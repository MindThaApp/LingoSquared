name: CI

# Core app CI for backend + frontend + content tooling. Mirrors the manual
# gate `scripts/verify.sh` (content compiler/tests -> backend pytest -> frontend
# build) plus the two test suites verify.sh does NOT run (content pytest and
# frontend vitest) — the gap that let a red backfill test ship unnoticed
# (2026-07-28 readiness audit). The four existing workflows only cover mobile/.
#
# NOTE: the `content` and `frontend` jobs were verified to pass locally. The
# `backend` job could not be run on the authoring machine (Python 3.9 + no
# Postgres; backend targets 3.12) — it is written to match backend/tests/
# conftest.py + verify.sh's Stage 2. If it fails on first run, the most likely
# cause is a dependency pin that doesn't resolve on public PyPI (the local
# machine could not resolve fastapi==0.139.0 from its index — verify the pin).

on:
  push:
    branches: [main, master, fix/wsl-handover-followups]
  pull_request:
    branches: [main, master, fix/wsl-handover-followups]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content tooling (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install content deps (.content-venv, as scripts/verify.sh expects)
        run: |
          python -m venv .content-venv
          .content-venv/bin/pip install -q -r scripts/requirements-content.txt pytest
      # The slow full verify (compile + practice-validate of every course/pack) runs
      # nightly in .github/workflows/nightly-content.yml. Fast gates only here.
      # _cross_leftover_check.py (~15 min) stays in the nightly verify.sh run.
      - name: Leftover checks (german, dutch, target-name)
        run: |
          .content-venv/bin/python scripts/_german_leftover_check.py
          .content-venv/bin/python scripts/_dutch_leftover_check.py
          .content-venv/bin/python scripts/_target_name_check.py
          .content-venv/bin/python scripts/_hindi_name_check.py
      - name: Lexeme column-length gate (backfill specs vs DB varchar limits)
        run: .content-venv/bin/python scripts/check_lexeme_lengths.py
      - name: Answer-leakage gate (max 36 hits, docs/GATE_BASELINES.md)
        run: |
          .content-venv/bin/python scripts/_answer_leakage_check.py 2> leak.txt || true
          cat leak.txt | tail -3
          hits=$(sed -n 's/^answer-leakage: \([0-9]*\) hit.*/\1/p' leak.txt | head -1)
          test -n "$hits" && test "$hits" -le 36
      - name: Run content test suite
        run: .content-venv/bin/python -m pytest scripts/tests -q

  frontend:
    name: Frontend (build + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Root install — frontend/ is an npm workspace member (depends on
      # @lingo/shared via workspace linking), same as the mobile CI does.
      - name: Install dependencies
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm test

  backend:
    name: Backend (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lingosquared
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: lingosquared_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingosquared"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Matches backend/tests/conftest.py's defaults; the suite drops/creates
      # schema public and seeds against this DB.
      DATABASE_URL: postgresql+psycopg://lingosquared:change-me@localhost:5432/lingosquared_test
      JWT_SECRET: test-secret
      ADMIN_EMAILS: admin@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

  e2e:
    name: E2E learner journeys (Playwright + Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Builds the frontend, starts an isolated db + api + nginx stack, seeds, runs
      # e2e/tests in the Playwright image and tears everything down (down -v --rmi local).
      - name: Run scripts/e2e.sh
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-results
        run: scripts/e2e.sh
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-results
          if-no-files-found: ignore
