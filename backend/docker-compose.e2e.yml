services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lingosquared_e2e
      POSTGRES_USER: lingosquared
      POSTGRES_PASSWORD: e2e-local-only-pw
    volumes:
      - postgres_data_e2e:/var/lib/postgresql/data
    ports:
      - "5461:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingosquared -d lingosquared_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env.e2e
    ports:
      - "8035:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
volumes:
  postgres_data_e2e:
