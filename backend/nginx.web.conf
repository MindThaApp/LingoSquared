# Static hosting for the Vite-built SPA (frontend/dist), served by the
# `web` service in docker-compose.yml. LAN phone-testing profile --
# see docs/PRE_DEPLOY_RUNBOOK.md's "Frontend (LAN web)" section.

# Cache policy by request path (evaluated on $uri, so the SPA fallback to
# /index.html is no-cache too). Only content-hashed /assets/* are immutable;
# index.html, the service worker and the manifest must always revalidate;
# unhashed icons/fonts/etc. get a short max-age.
map $uri $cache_control {
    default                      "no-cache";
    ~^/assets/                   "public, max-age=31536000, immutable";
    /index.html "no-cache";
    /sw.js "no-cache";
    /manifest.webmanifest "no-cache";
    ~*\.(?:woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif|js|css|wasm|json)$  "public, max-age=3600";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression for text-like assets (text/html is always compressed).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml application/wasm;

    # Security headers. All add_header directives live at server level on
    # purpose: nginx drops inherited add_header in any location that declares
    # its own, so no location below may use add_header.
    add_header Cache-Control $cache_control;  # no "always": never cache error responses
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # frame-ancestors is ignored in Report-Only CSPs, so it is also sent
    # as an enforced header (the app is never meant to be framed).
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    # REPORT-ONLY for now (nothing is blocked; violations show in the browser
    # console). Promote to Content-Security-Policy once clean. Allows: API on
    # :8010 (any LAN host), Sentry ingest, HuggingFace model download
    # (whisper), wasm-unsafe-eval for the ONNX wasm, blob: workers, data:/blob:
    # media and images, inline styles (React style props).
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://*:8010 https:; media-src 'self' blob: data: http://*:8010 https:; font-src 'self' data:; connect-src 'self' http://*:8010 https://*:8010 https://*.ingest.de.sentry.io https://huggingface.co https://*.huggingface.co https://*.hf.co data: blob:; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Never serve sourcemaps (build uses sourcemap: 'hidden').
    location ~* \.map$ {
        return 404;
    }

    # Real files only under /assets/ (a missing hashed chunk must 404, not
    # return index.html, so the client can detect a stale deploy).
    location /assets/ {
        try_files $uri =404;
    }

    # Pre-rendered TTS clips (scripts/render_audio.py). Files are named by a
    # content hash, so a name never changes meaning: cache for a year. They live
    # on a host dir mounted at /srv/media/audio (docker-compose.yml), outside the
    # image and the web_dist rsync, so redeploys never touch them. A missing hash
    # is a real 404 (not the SPA index) so the client falls back to /tts quickly.
    location /media/audio/ {
        alias /srv/media/audio/;
        types { audio/mpeg mp3; }
        default_type audio/mpeg;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
    }

    # SPA fallback: any path that isn't a real static file (client-side
    # routes like /courses/123) falls through to index.html so
    # React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
