# Static hosting for the Vite-built SPA (frontend/dist), served by the
# `web` service in docker-compose.yml. LAN phone-testing profile --
# see docs/PRE_DEPLOY_RUNBOOK.md's "Frontend (LAN web)" section.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must always be revalidated -- it's the one file whose
    # content can change without its own filename changing (it references
    # the current build's hashed asset filenames), so caching it defeats
    # cache-busting on every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's build output hashes every JS/CSS/asset filename by content
    # (e.g. index-a1b2c3d4.js), so these are safe to cache aggressively --
    # a new deploy produces new filenames, never mutates an existing one.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Pre-rendered TTS clips (scripts/render_audio.py). Files are named by a
    # content hash, so a name never changes meaning: cache for a year. They live
    # on a host dir mounted at /srv/media/audio (docker-compose.yml), outside the
    # image and the web_dist rsync, so redeploys never touch them. A missing hash
    # is a real 404 (not the SPA index) so the client falls back to /tts quickly.
    location /media/audio/ {
        alias /srv/media/audio/;
        types { audio/mpeg mp3; }
        default_type audio/mpeg;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
    }

    # SPA fallback: any path that isn't a real static file (client-side
    # routes like /courses/123) falls through to index.html so
    # React Router can handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
