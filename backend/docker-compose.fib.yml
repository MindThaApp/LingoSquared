services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lingosquared_fib
      POSTGRES_USER: lingosquared
      POSTGRES_PASSWORD: fib-local-only-pw
    volumes:
      - postgres_data_fib:/var/lib/postgresql/data
    ports:
      - "5490:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingosquared -d lingosquared_fib"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env.fib
    ports:
      - "8065:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
volumes:
  postgres_data_fib:
