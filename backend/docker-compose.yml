services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingosquared}
      POSTGRES_USER: ${POSTGRES_USER:-lingosquared}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingosquared} -d ${POSTGRES_DB:-lingosquared}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # faster-whisper downloads model weights from Hugging Face on first
      # use and caches them under ~/.cache/huggingface — without a named
      # volume here that cache lives only in the container's writable
      # layer and re-downloads (~150MB for the "base" model) on every
      # rebuild/recreate, not just every restart.
      - whisper_model_cache:/root/.cache/huggingface
  # Static hosting for the Vite-built SPA (frontend/dist), so the app is
  # reachable from a phone on the LAN. The deploy rsyncs a fresh
  # `frontend/dist` build into ./web_dist before `docker compose up -d
  # web` -- nginx just serves it, no build step happens in-container.
  # Port 8011 (8010 is the api, 8000 is unrelated on the live box).
  # See docs/PRE_DEPLOY_RUNBOOK.md's "Frontend (LAN web)" section.
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8011}:80"
    volumes:
      - ./web_dist:/usr/share/nginx/html:ro
      - ./nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  postgres_data:
  whisper_model_cache:
