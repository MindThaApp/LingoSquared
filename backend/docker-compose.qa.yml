services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lingosquared_qa}
      POSTGRES_USER: ${POSTGRES_USER:-lingosquared}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qa-local-only-pw}
    volumes:
      - postgres_data_qa:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingosquared} -d ${POSTGRES_DB:-lingosquared_qa}"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    env_file: .env.qa
    ports:
      - "8020:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
volumes:
  postgres_data_qa:
