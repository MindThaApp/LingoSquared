  - id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
    topic: hypotheticals
    can_do: >-
      Express hypothetical or unreal situations and wishes using a
      conditional-mood construction ("would" + verb) together with an unreal
      "if"-clause in a past/irrealis form, and use the conditional alone to
      soften a suggestion, request, or preference.
    prerequisites:
      - universal.a1.preferences.express_preferences
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_hypothetical_statement
        modality: listening
        task: Identify what someone says they would do (or would have done) in a stated hypothetical situation.
        success_criteria: Extracts the hypothetical condition and the stated hypothetical result without transcript-first support.
      - id: state_own_hypothetical
        modality: speaking
        task: Say what you would do in a real or invented hypothetical situation (more time, more money, a different choice), using the conditional-plus-if-clause construction.
        success_criteria: Produces an intelligible statement with a correctly formed conditional and a correctly formed irrealis if-clause.
      - id: read_hypothetical_statement
        modality: reading
        task: Interpret a short written statement about a hypothetical situation and its stated result.
        success_criteria: Identifies the condition and the hypothetical result.
      - id: write_hypothetical_statement
        modality: writing
        task: Write a short message stating what you would do in a hypothetical situation.
        success_criteria: Produces an accepted target-language sentence using the conditional-plus-if-clause construction with correct agreement.

  - id: universal.b1.opinions.debate_with_concession_and_nuance
    topic: opinions
    can_do: >-
      Debate a topic with nuance -- concede a valid point on the other side
      using a concessive connector ("although"/"even though") before
      restating your own position, and use a stronger contrastive connector
      than a simple "but" to structure a multi-point argument.
    prerequisites:
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_nuanced_argument
        modality: listening
        task: Identify a speaker's overall position and the concession they make to the opposing view before restating it.
        success_criteria: Extracts the speaker's real position and the specific point they concede without transcript-first support.
      - id: state_nuanced_opinion
        modality: speaking
        task: State an opinion on a real topic, concede one valid point on the other side using a concessive connector, and restate your own position.
        success_criteria: Produces an intelligible statement containing a correctly formed concessive clause and a clear restated position.
      - id: read_nuanced_argument
        modality: reading
        task: Interpret a short written argument that concedes a point before restating its main position.
        success_criteria: Identifies the writer's main position and the conceded point.
      - id: write_nuanced_argument
        modality: writing
        task: Write a short argument on a real topic that concedes one point on the other side before restating your own position.
        success_criteria: Produces an accepted target-language sentence using a concessive connector correctly.

  - id: universal.b1.workplace.communicate_professionally_in_meetings
    topic: workplace
    can_do: >-
      Communicate professionally in a workplace setting -- make a
      formal-register suggestion or request using a softened conditional
      form, participate in a short work-meeting exchange, and write a brief
      professional message.
    prerequisites:
      - universal.a1.work.describe_job
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_professional_request
        modality: listening
        task: Identify a formal-register suggestion, request, or proposal made in a short workplace exchange.
        success_criteria: Extracts the specific suggestion/request and who it is directed at without transcript-first support.
      - id: make_professional_request
        modality: speaking
        task: Make a formal-register suggestion or request to a colleague or manager using a softened conditional form.
        success_criteria: Produces an intelligible, correctly formal-register statement using the softened conditional construction.
      - id: read_professional_message
        modality: reading
        task: Interpret a short professional email or meeting note containing a suggestion or request.
        success_criteria: Identifies the suggestion/request and any stated deadline or next step.
      - id: write_professional_message
        modality: writing
        task: Write a brief professional message making a formal-register suggestion or request.
        success_criteria: Produces an accepted target-language sentence in formal register using the softened conditional construction.

  - id: universal.b1.narrative.combine_descriptions_with_relative_clauses
    topic: narrative
    can_do: >-
      Combine two facts about a person, place, or thing into a single,
      richer sentence using a relative clause (a "who"/"that"/"where"-type
      construction), including cases where the relative pronoun must agree
      in gender/number or must combine with a preposition.
    prerequisites:
      - universal.b1.opinions.debate_with_concession_and_nuance
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_relative_clause_description
        modality: listening
        task: Identify which person, place, or thing a speaker is describing when they use a relative clause to add identifying detail.
        success_criteria: Correctly matches the description to the right referent without transcript-first support.
      - id: describe_with_relative_clause
        modality: speaking
        task: Describe a real person, place, or thing by combining two facts about it into one sentence with a relative clause.
        success_criteria: Produces an intelligible sentence with a correctly formed and correctly agreeing relative clause.
      - id: read_relative_clause_description
        modality: reading
        task: Interpret a short written description that uses a relative clause to add identifying detail about a person, place, or thing.
        success_criteria: Identifies the referent and the added detail.
      - id: write_relative_clause_description
        modality: writing
        task: Write a short description of a real person, place, or thing that combines two facts using a relative clause.
        success_criteria: Produces an accepted target-language sentence with a correctly formed relative clause.

  - id: universal.b1.communication.report_what_someone_said
    topic: communication
    can_do: >-
      Report what someone said or asked using indirect/reported speech --
      shift a direct statement or question into a reported clause
      introduced by "that"/"whether", adjusting tense and pronouns as
      needed.
    prerequisites:
      - universal.b1.narrative.combine_descriptions_with_relative_clauses
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_reported_statement
        modality: listening
        task: Identify what someone reports another person said or asked, correctly distinguishing it from the reporter's own direct statement.
        success_criteria: Extracts the reported content and correctly attributes it to the original speaker without transcript-first support.
      - id: report_what_was_said
        modality: speaking
        task: Report what someone said or asked, using a reported-speech construction with correctly shifted tense and pronouns.
        success_criteria: Produces an intelligible reported-speech sentence with correct tense-shifting and pronoun agreement.
      - id: read_reported_statement
        modality: reading
        task: Interpret a short written passage that reports what someone said or asked.
        success_criteria: Identifies the original speaker and the reported content.
      - id: write_reported_statement
        modality: writing
        task: Write a short message reporting what someone said or asked.
        success_criteria: Produces an accepted target-language sentence using the reported-speech construction with correct tense-shifting.
