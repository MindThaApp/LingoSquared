schema_version: "1.0"
spine_id: universal
spine_version: "2026.1"
cefr_level: "A1, A2, B1"
status: draft
supported_learning_path_scope:
  hub_language: en
  directed_paths:
    - en-nl
    - nl-en
    - en-fr
    - fr-en
    - en-de
    - de-en
    - en-it
    - it-en
    - en-es
    - es-en
    - en-ru
    - ru-en
    - en-zh
    - zh-en
    - en-fa
    - fa-en
    - en-prs
    - prs-en

schema_notes:
  outcomes_not_order:
    description: >-
      This spine defines language-independent communicative capabilities only.
      The order of outcomes in this file is for readability and is never a
      mandatory teaching sequence.
    realization_rules:
      - A target-language realization owns its unit and lesson ordering.
      - A realization may reorder, split, combine, repeat, or reweight outcomes.
      - A realization may teach prerequisites concurrently when pedagogically appropriate.
      - Prerequisites express capability dependencies for teaching and assessment; they do not impose a universal unit order.
      - A realization must document every departure from the suggested CEFR weighting, but does not require approval merely for reordering.

  module_0:
    description: >-
      A target-language realization may define language-specific ramp modules
      before or alongside mapped outcomes. These modules teach prerequisites
      such as script, phonology, tones, pinyin, input methods, or sound-symbol
      correspondence and map to no universal spine node.
    representation:
      spine_outcome_id: null
      module_kind: one of [script_ramp, phonology_ramp, input_ramp, orthography_ramp]
    examples:
      - language: zh
        possible_content: tones, pinyin, syllable structure, character input
      - language: ru
        possible_content: Cyrillic decoding and sound-symbol correspondence
      - language: fa
        possible_content: RTL handling, connected letter forms, short-vowel omission
      - language: prs
        possible_content: RTL handling, connected letter forms, Dari sound-symbol conventions

  target_language_first:
    description: >-
      The universal spine supplies only the capability. Each target-language
      realization independently owns scenarios, names, relationships,
      register, culture, grammar progression, lexical selection, and dialogue.
    invariants:
      - Dialogues must be authored naturally for the target language and culture.
      - Structurally identical dialogues across target languages for the same spine outcome are a validation failure.
      - No realization may be produced by sentence-for-sentence translation of another realization.
      - Farsi and Dari are separate realizations and must never be auto-merged.

  source_overlay:
    description: >-
      A source-language overlay supplies direction-specific explanations,
      accepted variants, contrastive notes, learner-error guidance, and
      exercise distractor overrides.
    invariants:
      - Distractors must be reviewed for plausibility and ambiguity in each direction.
      - Reversing an exercise does not automatically create a valid exercise in the opposite direction.
      - Source-language overlays may replace, add, remove, or reorder distractors by stable exercise content key.

  modalities:
    allowed:
      - reading
      - writing
      - listening
      - speaking
    interpretation: >-
      Modalities identify how the capability must eventually be demonstrated.
      Realizations may scaffold a modality before assessing it independently.

  assessment_requirements:
    description: >-
      Each outcome lists minimum evidence that a realization must provide.
      A realization may add assessments or divide one requirement across
      multiple exercises, lessons, dialogues, or stories.
    required_fields:
      - id
      - modality
      - task
      - success_criteria

outcomes:
  - id: universal.a1.greetings.open_close_exchange
    topic: greetings
    can_do: Open and close a short everyday social exchange appropriately.
    prerequisites: []
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: recognize_greeting
        modality: listening
        task: Recognize an appropriate greeting or farewell in a short utterance.
        success_criteria: Selects the intended social function without seeing a transcript first.
      - id: produce_greeting
        modality: speaking
        task: Produce an appropriate greeting and farewell for a supplied context.
        success_criteria: Uses an intelligible, context-appropriate form.
      - id: interpret_written_greeting
        modality: reading
        task: Interpret a short written greeting or farewell.
        success_criteria: Identifies the intended meaning and register.
      - id: write_greeting
        modality: writing
        task: Write a conventional greeting or farewell.
        success_criteria: Produces an accepted target-language form.

  - id: universal.a1.introductions.exchange_identity
    topic: introductions
    can_do: Exchange names and basic identity information in a short interaction.
    prerequisites:
      - universal.a1.greetings.open_close_exchange
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_name_question
        modality: listening
        task: Understand a common question asking for a name or identity.
        success_criteria: Identifies what information is requested without transcript-first support.
      - id: ask_and_answer_name
        modality: speaking
        task: Ask for and provide a name.
        success_criteria: Completes both conversational turns intelligibly.
      - id: read_basic_profile
        modality: reading
        task: Extract a person's name and one basic identity fact from a short profile.
        success_criteria: Identifies the requested details accurately.
      - id: write_self_introduction
        modality: writing
        task: Write a one- or two-sentence self-introduction.
        success_criteria: Includes an accepted name and identity construction.

  - id: universal.a1.numbers.use_basic_numbers
    topic: numbers
    can_do: Understand and use common whole numbers in basic everyday contexts.
    prerequisites: []
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: recognize_spoken_number
        modality: listening
        task: Identify a spoken number in an everyday context.
        success_criteria: Selects or enters the intended number without transcript-first support.
      - id: say_number
        modality: speaking
        task: Say a displayed number or simple quantity.
        success_criteria: Produces an intelligible target-language number.
      - id: interpret_written_number_expression
        modality: reading
        task: Interpret a number written in words or digits.
        success_criteria: Maps the expression to the correct quantity.
      - id: write_number_expression
        modality: writing
        task: Write a requested basic number or quantity.
        success_criteria: Produces an accepted written form.

  - id: universal.a1.dates.exchange_calendar_dates
    topic: dates
    can_do: Ask for, understand, and state a simple calendar date.
    prerequisites:
      - universal.a1.numbers.use_basic_numbers
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_spoken_date
        modality: listening
        task: Identify a date in a short announcement or exchange.
        success_criteria: Selects the correct day, month, or complete date.
      - id: ask_state_date
        modality: speaking
        task: Ask for and state a date.
        success_criteria: Uses an intelligible and culturally appropriate date form.
      - id: read_date
        modality: reading
        task: Interpret a date in a supported written convention.
        success_criteria: Resolves the intended date without month/day ambiguity.
      - id: write_date
        modality: writing
        task: Write a supplied date in an accepted convention.
        success_criteria: Produces an unambiguous accepted form.

  - id: universal.a1.time.ask_tell_time
    topic: time
    can_do: Ask for and tell basic clock times and parts of the day.
    prerequisites:
      - universal.a1.numbers.use_basic_numbers
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_spoken_time
        modality: listening
        task: Identify a time in a short exchange or announcement.
        success_criteria: Selects the correct time without transcript-first support.
      - id: ask_tell_time
        modality: speaking
        task: Ask for the time and state a supplied time.
        success_criteria: Produces an intelligible conventional form.
      - id: read_schedule_time
        modality: reading
        task: Extract a time from a simple schedule.
        success_criteria: Identifies the requested event time accurately.
      - id: write_time
        modality: writing
        task: Write a simple time expression.
        success_criteria: Produces an accepted and unambiguous form.

  - id: universal.a1.family.describe_relationships
    topic: family
    can_do: Identify close family members and describe simple family relationships.
    prerequisites:
      - universal.a1.introductions.exchange_identity
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_family_description
        modality: listening
        task: Identify people and relationships in a short family description.
        success_criteria: Matches the people to the correct relationships.
      - id: describe_family
        modality: speaking
        task: Give a short description of one or more family relationships.
        success_criteria: Uses intelligible relationship terms and basic possessive structures.
      - id: read_family_profile
        modality: reading
        task: Extract relationships from a short written profile.
        success_criteria: Answers basic who-is-who questions accurately.
      - id: write_family_sentence
        modality: writing
        task: Write simple sentences identifying family members.
        success_criteria: Produces accepted relationship and possession forms.

  - id: universal.a1.food.order_simple_meal
    topic: food
    can_do: Identify common food and drink and complete a simple ordering exchange.
    prerequisites:
      - universal.a1.greetings.open_close_exchange
      - universal.a1.numbers.use_basic_numbers
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_ordering_exchange
        modality: listening
        task: Identify requested food, drink, or quantity in a short ordering exchange.
        success_criteria: Selects all requested items without transcript-first support.
      - id: place_order
        modality: speaking
        task: Request a common item and respond to one basic follow-up question.
        success_criteria: Completes the exchange politely and intelligibly.
      - id: read_basic_menu
        modality: reading
        task: Locate a named item and basic information on a short menu.
        success_criteria: Selects the correct menu entry.
      - id: write_simple_order
        modality: writing
        task: Write a short request for food or drink.
        success_criteria: Produces an accepted request with a suitable item or quantity.

  - id: universal.a1.shopping.ask_prices_quantities
    topic: shopping
    can_do: Ask about prices and quantities and understand a simple purchase exchange.
    prerequisites:
      - universal.a1.numbers.use_basic_numbers
      - universal.a1.greetings.open_close_exchange
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_price
        modality: listening
        task: Identify the price or quantity stated in a short purchase exchange.
        success_criteria: Selects the correct amount without transcript-first support.
      - id: ask_price_quantity
        modality: speaking
        task: Ask for a price or quantity and respond to a basic answer.
        success_criteria: Uses an intelligible target-language request.
      - id: read_price_label
        modality: reading
        task: Interpret simple price and quantity labels.
        success_criteria: Matches an item to the correct price or amount.
      - id: write_purchase_request
        modality: writing
        task: Write a short request for an item and quantity.
        success_criteria: Produces an accepted item-and-quantity construction.

  - id: universal.a1.places.locate_common_places
    topic: places
    can_do: Identify and state the location of common places and facilities.
    prerequisites: []
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_place_location
        modality: listening
        task: Identify a place and its basic location from a short utterance.
        success_criteria: Selects the correct place or spatial relationship.
      - id: state_location
        modality: speaking
        task: State where a common place or facility is located.
        success_criteria: Uses an intelligible location expression.
      - id: read_sign_map
        modality: reading
        task: Locate a common place using a simple sign or map label.
        success_criteria: Identifies the requested location accurately.
      - id: write_location
        modality: writing
        task: Write a short sentence locating a place.
        success_criteria: Produces an accepted place and location construction.

  - id: universal.a1.directions.ask_follow_basic_directions
    topic: directions
    can_do: Ask for and follow short directions to a nearby place.
    prerequisites:
      - universal.a1.places.locate_common_places
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_spoken_directions
        modality: listening
        task: Follow a short sequence of basic direction instructions.
        success_criteria: Selects the correct destination or route.
      - id: ask_give_directions
        modality: speaking
        task: Ask where a place is and give one or two basic direction steps.
        success_criteria: Produces an intelligible request and route.
      - id: read_directions
        modality: reading
        task: Follow short written directions on a simple map.
        success_criteria: Identifies the correct route or destination.
      - id: write_directions
        modality: writing
        task: Write one or two basic direction instructions.
        success_criteria: Produces an accepted sequence with clear spatial meaning.

  - id: universal.a1.routines.describe_daily_routine
    topic: routines
    can_do: Describe a simple daily routine using common activities and times.
    prerequisites:
      - universal.a1.time.ask_tell_time
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_routine
        modality: listening
        task: Identify activities and times in a short routine description.
        success_criteria: Matches the activities to the correct times.
      - id: describe_routine
        modality: speaking
        task: Describe several ordinary daily activities.
        success_criteria: Produces an intelligible sequence using suitable time expressions.
      - id: read_routine
        modality: reading
        task: Extract activities and timing from a short routine text.
        success_criteria: Answers basic sequence and timing questions accurately.
      - id: write_routine
        modality: writing
        task: Write several connected sentences about a daily routine.
        success_criteria: Produces an accepted basic sequence of activities.

  - id: universal.a1.plans.make_simple_plans
    topic: plans
    can_do: Propose, accept, decline, and schedule a simple near-future plan.
    prerequisites:
      - universal.a1.time.ask_tell_time
      - universal.a1.dates.exchange_calendar_dates
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_plan
        modality: listening
        task: Identify the activity, date, time, or response in a planning exchange.
        success_criteria: Extracts the requested plan details.
      - id: negotiate_plan
        modality: speaking
        task: Propose a simple activity and accept or decline a response.
        success_criteria: Completes the exchange with an intelligible outcome.
      - id: read_invitation
        modality: reading
        task: Extract basic details from a short invitation or message.
        success_criteria: Identifies activity, date, and time when present.
      - id: write_plan_message
        modality: writing
        task: Write a short message proposing or confirming a plan.
        success_criteria: Includes an accepted activity and scheduling expression.

  - id: universal.a1.past_events.describe_recent_event
    topic: past_events
    can_do: Give a short, basic account of a recent completed event.
    prerequisites:
      - universal.a1.routines.describe_daily_routine
      - universal.a1.time.ask_tell_time
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_recent_event
        modality: listening
        task: Identify what happened and one basic detail in a short account.
        success_criteria: Selects the correct event and detail.
      - id: describe_recent_event
        modality: speaking
        task: State one or more simple completed actions.
        success_criteria: Communicates past or completed meaning intelligibly.
      - id: read_recent_event
        modality: reading
        task: Extract a completed action and basic time reference from a short text.
        success_criteria: Answers event and timing questions accurately.
      - id: write_recent_event
        modality: writing
        task: Write several simple sentences about a recent event.
        success_criteria: Produces an accepted completed-event construction.

  - id: universal.a1.preferences.express_preferences
    topic: preferences
    can_do: Express and ask about basic likes, dislikes, wants, and choices.
    prerequisites: []
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_preference
        modality: listening
        task: Identify a speaker's stated preference or choice.
        success_criteria: Selects the correct preferred or rejected option.
      - id: exchange_preferences
        modality: speaking
        task: Ask about and state a simple preference.
        success_criteria: Completes both turns intelligibly.
      - id: read_preference
        modality: reading
        task: Identify likes, dislikes, or choices in a short message.
        success_criteria: Distinguishes preferred and non-preferred options.
      - id: write_preference
        modality: writing
        task: Write a simple preference with a reason if supported by the realization.
        success_criteria: Produces an accepted preference construction.

  - id: universal.a1.comparisons.make_basic_comparisons
    topic: comparisons
    can_do: Make and understand basic comparisons between familiar people, objects, or options.
    prerequisites:
      - universal.a1.preferences.express_preferences
      - universal.a1.numbers.use_basic_numbers
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_comparison
        modality: listening
        task: Identify which of two familiar options has a stated property.
        success_criteria: Selects the correct option.
      - id: make_comparison
        modality: speaking
        task: Compare two familiar items using a basic property.
        success_criteria: Communicates the intended relationship intelligibly.
      - id: read_comparison
        modality: reading
        task: Interpret a short comparison.
        success_criteria: Identifies the compared items and relationship.
      - id: write_comparison
        modality: writing
        task: Write a basic comparison between two familiar items.
        success_criteria: Produces an accepted comparative construction.

  - id: universal.a1.travel.handle_basic_journey
    topic: travel
    can_do: Handle basic transport information, tickets, destinations, and departure details.
    prerequisites:
      - universal.a1.numbers.use_basic_numbers
      - universal.a1.time.ask_tell_time
      - universal.a1.directions.ask_follow_basic_directions
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_travel_announcement
        modality: listening
        task: Identify a destination, platform, stop, or departure time.
        success_criteria: Extracts the requested travel detail without transcript-first support.
      - id: request_travel_information
        modality: speaking
        task: Ask for a ticket or basic journey information.
        success_criteria: Communicates destination and requested information intelligibly.
      - id: read_ticket_schedule
        modality: reading
        task: Extract basic information from a ticket or short schedule.
        success_criteria: Identifies destination, time, or location accurately.
      - id: write_travel_request
        modality: writing
        task: Write a short request or message about a journey.
        success_criteria: Includes an accepted destination and relevant detail.

  - id: universal.a1.health.describe_basic_problem
    topic: health
    can_do: State a basic health problem and understand simple immediate advice.
    prerequisites:
      - universal.a1.introductions.exchange_identity
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_health_problem
        modality: listening
        task: Identify a basic symptom or affected body area.
        success_criteria: Selects the intended problem accurately.
      - id: state_health_problem
        modality: speaking
        task: State a simple symptom or need for help.
        success_criteria: Communicates the immediate problem intelligibly.
      - id: read_basic_health_instruction
        modality: reading
        task: Interpret a short, non-diagnostic health instruction.
        success_criteria: Identifies the requested action.
      - id: write_health_message
        modality: writing
        task: Write a short message stating a basic health problem.
        success_criteria: Produces an accepted symptom or help-request construction.

  - id: universal.a1.work.describe_job
    topic: work
    can_do: State a basic occupation, workplace, and simple work activity.
    prerequisites:
      - universal.a1.introductions.exchange_identity
      - universal.a1.routines.describe_daily_routine
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_work_description
        modality: listening
        task: Identify a person's occupation, workplace, or common activity.
        success_criteria: Selects the correct work detail.
      - id: describe_work
        modality: speaking
        task: State an occupation or describe a simple work activity.
        success_criteria: Produces an intelligible basic description.
      - id: read_work_profile
        modality: reading
        task: Extract work details from a short profile.
        success_criteria: Identifies occupation and workplace when present.
      - id: write_work_profile
        modality: writing
        task: Write several basic facts about work.
        success_criteria: Produces accepted occupation and activity constructions.

  - id: universal.a1.housing.describe_home
    topic: housing
    can_do: Describe a basic home, rooms, household objects, and location.
    prerequisites:
      - universal.a1.places.locate_common_places
      - universal.a1.numbers.use_basic_numbers
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_home_description
        modality: listening
        task: Identify rooms, objects, quantities, or locations in a short description.
        success_criteria: Selects the requested home detail.
      - id: describe_home
        modality: speaking
        task: Give a short description of a home or room.
        success_criteria: Uses intelligible room, object, quantity, and location language.
      - id: read_housing_description
        modality: reading
        task: Extract basic facts from a short housing description.
        success_criteria: Identifies rooms, location, or included features accurately.
      - id: write_home_description
        modality: writing
        task: Write several simple sentences describing a home or room.
        success_criteria: Produces accepted existence, quantity, and location constructions.

  - id: universal.a1.weather.describe_basic_weather
    topic: weather
    can_do: Describe current weather conditions and make a simple weather-related plan.
    prerequisites: []
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_weather_report
        modality: listening
        task: Identify the weather condition described in a short forecast or remark.
        success_criteria: Selects the correct weather condition without transcript-first support.
      - id: describe_weather
        modality: speaking
        task: Describe the current weather and suggest a simple resulting plan.
        success_criteria: Produces an intelligible weather description and follow-up.
      - id: read_weather_forecast
        modality: reading
        task: Extract the forecasted condition from a short written forecast.
        success_criteria: Identifies the correct condition and timeframe.
      - id: write_weather_note
        modality: writing
        task: Write a short sentence describing today's weather.
        success_criteria: Produces an accepted weather-description construction.

  - id: universal.a1.clothing.describe_buy_clothing
    topic: clothing
    can_do: Identify common clothing items and complete a simple clothing purchase or exchange.
    prerequisites:
      - universal.a1.shopping.ask_prices_quantities
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_clothing_request
        modality: listening
        task: Identify a requested clothing item, size, or color in a short exchange.
        success_criteria: Selects the correct item, size, or color without transcript-first support.
      - id: request_clothing_item
        modality: speaking
        task: Ask for a clothing item in a specific size or color.
        success_criteria: Completes the exchange intelligibly.
      - id: read_clothing_label
        modality: reading
        task: Interpret a simple clothing label or size chart.
        success_criteria: Matches the label to the correct size or color.
      - id: write_clothing_request
        modality: writing
        task: Write a short request for a clothing item, size, or color.
        success_criteria: Produces an accepted item-size-color construction.

  - id: universal.a1.emotions.express_basic_feelings
    topic: emotions
    can_do: Express and ask about basic feelings and their simple immediate cause.
    prerequisites:
      - universal.a1.preferences.express_preferences
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_feeling
        modality: listening
        task: Identify a speaker's stated feeling and its simple cause.
        success_criteria: Selects the correct feeling and cause.
      - id: exchange_feelings
        modality: speaking
        task: Ask about and state a basic feeling with a simple reason.
        success_criteria: Completes both turns intelligibly.
      - id: read_feeling
        modality: reading
        task: Identify a stated feeling in a short message.
        success_criteria: Selects the correct feeling and, where present, its cause.
      - id: write_feeling
        modality: writing
        task: Write a simple sentence expressing a feeling and its cause.
        success_criteria: Produces an accepted feeling-and-cause construction.

  - id: universal.a1.communication.basic_phone_contact
    topic: communication
    can_do: Handle a basic phone or messaging exchange, including asking someone to repeat or clarify.
    prerequisites:
      - universal.a1.introductions.exchange_identity
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_phone_exchange
        modality: listening
        task: Identify the purpose and key detail of a short phone or voice-message exchange.
        success_criteria: Selects the correct purpose or detail without transcript-first support.
      - id: handle_phone_call
        modality: speaking
        task: Answer or place a basic phone call and ask the other person to repeat or speak slowly.
        success_criteria: Completes the exchange intelligibly, including a clarification request.
      - id: read_text_message
        modality: reading
        task: Interpret a short written text message.
        success_criteria: Identifies the intended meaning accurately.
      - id: write_text_message
        modality: writing
        task: Write a short text message conveying a simple request or piece of information.
        success_criteria: Produces an accepted, clear message.

  - id: universal.a1.money.handle_basic_money_matters
    topic: money
    can_do: Handle basic money matters such as exchanging currency, paying, and asking about payment methods.
    prerequisites:
      - universal.a1.numbers.use_basic_numbers
      - universal.a1.shopping.ask_prices_quantities
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_payment_request
        modality: listening
        task: Identify the amount or payment method requested in a short exchange.
        success_criteria: Selects the correct amount or payment method without transcript-first support.
      - id: ask_about_payment
        modality: speaking
        task: Ask about accepted payment methods or request to pay or exchange currency.
        success_criteria: Communicates the request intelligibly.
      - id: read_receipt_amount
        modality: reading
        task: Extract the total amount or payment method from a simple receipt or sign.
        success_criteria: Identifies the correct amount or method.
      - id: write_payment_note
        modality: writing
        task: Write a short note stating an amount owed or a payment method.
        success_criteria: Produces an accepted amount-and-method construction.

  - id: universal.a2.bureaucracy.register_with_authorities
    topic: bureaucracy
    can_do: Handle a basic in-person or phone appointment to register with local authorities and understand what is required.
    prerequisites:
      - universal.a1.introductions.exchange_identity
      - universal.a1.housing.describe_home
      - universal.a1.communication.basic_phone_contact
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_registration_requirements
        modality: listening
        task: Identify which documents or information an official requests during a registration appointment.
        success_criteria: Extracts the specific requested items without transcript-first support.
      - id: complete_registration_exchange
        modality: speaking
        task: Provide personal and address information and ask a clarifying question during an official appointment.
        success_criteria: Completes the exchange intelligibly using an appropriately formal register.
      - id: read_registration_notice
        modality: reading
        task: Interpret a short official notice or checklist about registration requirements.
        success_criteria: Identifies the required documents and any deadline.
      - id: write_registration_request
        modality: writing
        task: Write a short formal message requesting or confirming a registration appointment.
        success_criteria: Produces an accepted formal-register request with the necessary details.

  - id: universal.a2.opinions.give_opinions_with_reasons
    topic: opinions
    can_do: Express an opinion about a familiar topic, support it with a simple reason, and respond to someone else's opinion.
    prerequisites:
      - universal.a1.preferences.express_preferences
      - universal.a1.comparisons.make_basic_comparisons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_opinion_and_reason
        modality: listening
        task: Identify a speaker's opinion and the reason given for it.
        success_criteria: Selects both the stated opinion and its supporting reason.
      - id: give_and_support_opinion
        modality: speaking
        task: State an opinion about a familiar topic and give one supporting reason.
        success_criteria: Produces an intelligible opinion-plus-reason construction.
      - id: read_opinion_text
        modality: reading
        task: Interpret a short written opinion with its reason in a message or note.
        success_criteria: Identifies the opinion and the reason accurately.
      - id: write_opinion_with_reason
        modality: writing
        task: Write a short opinion statement supported by one reason, and respond to a contrasting opinion.
        success_criteria: Produces an accepted opinion-and-reason construction with an appropriate connector.

  - id: universal.a2.banking.open_bank_account
    topic: banking
    can_do: Open a basic bank account and understand simple account features and requirements.
    prerequisites:
      - universal.a1.money.handle_basic_money_matters
      - universal.a2.bureaucracy.register_with_authorities
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_account_requirements
        modality: listening
        task: Identify which documents or information a bank employee requests to open an account.
        success_criteria: Extracts the specific requested items without transcript-first support.
      - id: request_bank_account
        modality: speaking
        task: Request to open a bank account and answer basic questions about identity and address.
        success_criteria: Completes the exchange intelligibly using an appropriately formal register.
      - id: read_account_information
        modality: reading
        task: Interpret a short notice or leaflet describing basic account features or requirements.
        success_criteria: Identifies the required documents and any basic account feature mentioned.
      - id: write_account_request
        modality: writing
        task: Write a short formal message requesting information about opening a bank account.
        success_criteria: Produces an accepted formal-register request with the necessary details.

  - id: universal.a2.health.attend_doctor_appointment
    topic: health
    can_do: Attend a basic doctor's appointment, describe a symptom in more detail, and understand simple treatment and follow-up instructions.
    prerequisites:
      - universal.a1.health.describe_basic_problem
      - universal.a1.communication.basic_phone_contact
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_doctor_instructions
        modality: listening
        task: Identify a doctor's diagnosis or treatment instructions in a short consultation.
        success_criteria: Extracts the specific diagnosis or instruction without transcript-first support.
      - id: describe_symptom_in_detail
        modality: speaking
        task: Describe a symptom in more detail, including duration and severity, and answer a follow-up question.
        success_criteria: Completes the exchange intelligibly using an appropriately formal register.
      - id: read_appointment_confirmation
        modality: reading
        task: Interpret a short appointment confirmation or after-visit summary.
        success_criteria: Identifies the appointment time, purpose, or follow-up instruction.
      - id: write_appointment_request
        modality: writing
        task: Write a short formal message requesting an appointment or describing symptoms beforehand.
        success_criteria: Produces an accepted formal-register message with the necessary details.

  - id: universal.a2.housing.report_maintenance_problem
    topic: housing
    can_do: Report a basic household problem to a landlord or building manager and arrange for a repair.
    prerequisites:
      - universal.a1.housing.describe_home
      - universal.a1.communication.basic_phone_contact
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_problem_description
        modality: listening
        task: Identify a described household problem and any proposed solution or timing.
        success_criteria: Extracts the specific problem and repair timing without transcript-first support.
      - id: report_household_problem
        modality: speaking
        task: Describe a basic household problem and ask about repair timing.
        success_criteria: Completes the exchange intelligibly using an appropriately formal register.
      - id: read_maintenance_notice
        modality: reading
        task: Interpret a short maintenance notice or repair confirmation.
        success_criteria: Identifies the reported problem and the scheduled repair details.
      - id: write_problem_report
        modality: writing
        task: Write a short message reporting a household problem.

  - id: universal.a2.employment.attend_job_interview
    topic: employment
    can_do: Attend a basic job interview, describe relevant experience and availability, and ask a clarifying question about the role.
    prerequisites:
      - universal.a1.work.describe_job
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_interview_question
        modality: listening
        task: Identify what an interviewer is asking about (experience, availability, or strengths) in a short exchange.
        success_criteria: Selects the correct topic of the question without transcript-first support.
      - id: answer_interview_question
        modality: speaking
        task: Describe relevant experience or availability and ask a clarifying question about the role.
        success_criteria: Completes the exchange intelligibly using an appropriately formal register.
      - id: read_job_posting
        modality: reading
        task: Interpret a short job posting or interview invitation.
        success_criteria: Identifies the role, requirements, or interview details.
      - id: write_availability_note
        modality: writing
        task: Write a short formal message confirming interview availability or following up after an interview.
        success_criteria: Produces an accepted formal-register message with the necessary details.

  - id: universal.a2.travel.handle_travel_disruption
    topic: travel
    can_do: Understand and respond to a basic travel disruption (a delay, cancellation, or missed connection) and ask about alternative options.
    prerequisites:
      - universal.a1.travel.handle_basic_journey
      - universal.a1.time.ask_tell_time
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_disruption_announcement
        modality: listening
        task: Identify what has changed (delay, cancellation, platform change) in a short travel announcement or explanation.
        success_criteria: Extracts the specific disruption detail without transcript-first support.
      - id: ask_about_alternatives
        modality: speaking
        task: Ask a staff member about alternative transport options after a disruption.
        success_criteria: Completes the exchange intelligibly using an appropriately polite register.
      - id: read_disruption_notice
        modality: reading
        task: Interpret a short written notice about a delay, cancellation, or platform change.
        success_criteria: Identifies the change and any suggested alternative.
      - id: write_disruption_message
        modality: writing
        task: Write a short message explaining you will be late or missed a connection because of a travel disruption.
        success_criteria: Produces an accepted message with the disruption and its consequence.

  - id: universal.a2.technology.discuss_online_habits
    topic: technology
    can_do: Describe how you use the internet, a smartphone, or social media in daily life and give a simple opinion about it.
    prerequisites:
      - universal.a1.technology.describe_device_use
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_online_habit_description
        modality: listening
        task: Identify what app, site, or online activity a speaker describes using and how often.
        success_criteria: Extracts the specific activity and frequency without transcript-first support.
      - id: describe_own_online_habits
        modality: speaking
        task: Describe your own daily technology or social media use and give a simple opinion about it.
        success_criteria: Produces an intelligible habit-plus-opinion construction.
      - id: read_online_habit_text
        modality: reading
        task: Interpret a short written description or message about someone's technology or social media use.
        success_criteria: Identifies the described habit and any opinion expressed.
      - id: write_online_habit_message
        modality: writing
        task: Write a short message describing your own technology or social media use and one opinion about it.
        success_criteria: Produces an accepted habit-plus-opinion construction with an appropriate connector.

  - id: universal.a2.routines.describe_weekly_schedule
    topic: routines
    can_do: Describe a typical week with more complex sequencing, distinguishing weekdays from the weekend and ordering activities with connectors.
    prerequisites:
      - universal.a1.routines.describe_daily_routine
      - universal.a1.plans.make_simple_plans
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_weekly_schedule_description
        modality: listening
        task: Identify the order of activities across a described week, including which day something happens.
        success_criteria: Extracts the correct day-activity pairing and sequence without transcript-first support.
      - id: describe_own_weekly_schedule
        modality: speaking
        task: Describe your own typical week, sequencing activities with connectors and contrasting weekdays with the weekend.
        success_criteria: Produces an intelligible multi-activity account using at least one sequencing connector.
      - id: read_weekly_schedule_text
        modality: reading
        task: Interpret a short written weekly schedule or planner message.
        success_criteria: Identifies which activities happen on which days.
      - id: write_weekly_schedule_message
        modality: writing
        task: Write a short message describing your typical week, sequencing at least three activities.
        success_criteria: Produces an accepted multi-activity account using at least one sequencing connector.

  - id: universal.a2.shopping.make_a_complaint
    topic: shopping
    can_do: Return or exchange a purchased item, explain what's wrong with it, and request a refund or replacement.
    prerequisites:
      - universal.a1.shopping.ask_prices_quantities
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_complaint_response
        modality: listening
        task: Identify what a shop employee offers (refund, exchange, repair) in response to a complaint.
        success_criteria: Extracts the specific resolution offered without transcript-first support.
      - id: make_a_complaint
        modality: speaking
        task: Explain what's wrong with a purchased item and request a refund or exchange.
        success_criteria: Completes the exchange intelligibly using an appropriately polite register.
      - id: read_receipt_or_return_policy
        modality: reading
        task: Interpret a short receipt or return policy notice.
        success_criteria: Identifies the return window or condition required for a refund or exchange.
      - id: write_complaint_message
        modality: writing
        task: Write a short message explaining a problem with a purchased item and requesting a refund or exchange.
        success_criteria: Produces an accepted formal-register message with the necessary details.

  - id: universal.a2.past.narrate_recent_weekend
    topic: past_events
    can_do: Tell someone, in order, what you did last weekend, including what you did not do.
    prerequisites:
      - universal.a1.past_events.describe_recent_event
      - universal.a1.routines.describe_daily_routine
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_weekend_account
        modality: listening
        task: Identify what a speaker did and did not do over a weekend, and in what order.
        success_criteria: Extracts the activities, the order and at least one negated activity without transcript-first support.
      - id: say_weekend_account
        modality: speaking
        task: Tell a listener what you did last weekend, in order, and mention one thing you did not do.
        success_criteria: Produces an intelligible ordered account of finished events that includes one negated event.
      - id: read_weekend_account
        modality: reading
        task: Interpret a short written message describing someone's weekend.
        success_criteria: Identifies the activities, their order and what the writer did not do.
      - id: write_weekend_account
        modality: writing
        task: Write a short message telling a friend what you did and did not do last weekend.
        success_criteria: Produces an accepted ordered account of at least three finished events including one negated event.

  - id: universal.a2.past.describe_a_busy_morning
    topic: past_events
    can_do: Describe step by step how a morning, a commute or a short trip went, from getting ready to arriving.
    prerequisites:
      - universal.a1.past_events.describe_recent_event
      - universal.a2.past.narrate_recent_weekend
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_step_by_step_morning
        modality: listening
        task: Follow a speaker's step-by-step account of a morning or trip and identify each step.
        success_criteria: Extracts the sequence of steps and the point where something went differently without transcript-first support.
      - id: say_step_by_step_morning
        modality: speaking
        task: Describe step by step how your morning or a trip went, including one step you skipped or did not manage.
        success_criteria: Produces an intelligible step-by-step account of finished actions with a sequencing connector and one negated step.
      - id: read_step_by_step_morning
        modality: reading
        task: Interpret a short written account of a busy morning or a trip.
        success_criteria: Identifies the steps in order and any step that did not happen.
      - id: write_step_by_step_morning
        modality: writing
        task: Write a short account of how a morning or a trip went, step by step.
        success_criteria: Produces an accepted account of at least four finished steps in order.

  - id: universal.a2.past.describe_past_habits
    topic: past_events
    can_do: Describe how life used to be, for example in childhood, at a previous home or in a previous job, and say how it differs from now.
    prerequisites:
      - universal.a1.past_events.describe_recent_event
      - universal.a2.past.narrate_recent_weekend
      - universal.a1.housing.describe_home
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_past_habits
        modality: listening
        task: Identify what a speaker used to do and what has changed since.
        success_criteria: Extracts at least two past habits and one contrast with the present without transcript-first support.
      - id: say_past_habits
        modality: speaking
        task: Describe how life used to be in the past and contrast it with how it is now.
        success_criteria: Produces an intelligible then-and-now contrast about repeated past situations.
      - id: read_past_habits
        modality: reading
        task: Interpret a short written description of someone's childhood or earlier life.
        success_criteria: Identifies the past habits and what is different now.
      - id: write_past_habits
        modality: writing
        task: Write a short text about how things used to be and how they are now.
        success_criteria: Produces an accepted then-and-now contrast with at least two past habits.

  - id: universal.a2.past.tell_what_was_happening
    topic: past_events
    can_do: Say what was going on when something else happened, such as a small incident, a weather change or a traffic problem.
    prerequisites:
      - universal.a2.past.describe_past_habits
      - universal.a1.weather.describe_basic_weather
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_what_was_happening
        modality: listening
        task: Identify what a speaker was doing and what interrupted it.
        success_criteria: Extracts the background activity and the interrupting event without transcript-first support.
      - id: say_what_was_happening
        modality: speaking
        task: Tell a listener what you were doing when something else happened.
        success_criteria: Produces an intelligible account linking an ongoing past situation with a single interrupting event.
      - id: read_what_was_happening
        modality: reading
        task: Interpret a short written account of an incident.
        success_criteria: Identifies what was going on and what happened in the middle of it.
      - id: write_what_was_happening
        modality: writing
        task: Write a short account of an incident saying what was happening when it occurred.
        success_criteria: Produces an accepted account that links a background situation with one event.

  - id: universal.a2.experience.talk_about_life_experiences
    topic: experience
    can_do: Ask and say what you have or have never done, and whether you have already done something yet.
    prerequisites:
      - universal.a1.past_events.describe_recent_event
      - universal.a2.past.narrate_recent_weekend
      - universal.a1.travel.handle_basic_journey
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_life_experiences
        modality: listening
        task: Identify what a speaker has and has never done.
        success_criteria: Extracts each experience and whether it happened or not without transcript-first support.
      - id: say_life_experiences
        modality: speaking
        task: Ask someone whether they have ever done something and say what you have and have never done.
        success_criteria: Completes a question-and-answer exchange about experience intelligibly.
      - id: read_life_experiences
        modality: reading
        task: Interpret a short written exchange or profile about someone's experiences.
        success_criteria: Identifies which experiences the person has and has not had.
      - id: write_life_experiences
        modality: writing
        task: Write a short message saying what you have done and never done and asking a friend the same.
        success_criteria: Produces an accepted message with at least two experiences and one question.

  - id: universal.a2.past.explain_what_had_happened_before
    topic: past_events
    can_do: Explain that something had already happened before a certain point, for example a train had left before you arrived. Understanding is the main aim, with simple production.
    prerequisites:
      - universal.a1.past_events.describe_recent_event
      - universal.a2.past.tell_what_was_happening
      - universal.a1.lost_items.report_lost_item
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_earlier_event
        modality: listening
        task: Identify which of two past events happened first in a short account.
        success_criteria: Extracts the earlier event and the later reference point without transcript-first support.
      - id: say_earlier_event
        modality: speaking
        task: Explain briefly that something had already happened before you arrived or before a certain time.
        success_criteria: Produces an intelligible statement placing one event before another past reference point.
      - id: read_earlier_event
        modality: reading
        task: Interpret a short written note or message about a missed train, a late arrival or a lost item.
        success_criteria: Identifies what had already happened and what the writer found on arrival.
      - id: write_earlier_event
        modality: writing
        task: Write a short message explaining what had already happened when you arrived.
        success_criteria: Produces an accepted message with one earlier event and one reference point.

  - id: universal.a2.future.announce_plans_and_intentions
    topic: plans
    can_do: Say what you are going to do soon and what you intend to do later, for example holidays, courses or moving house.
    prerequisites:
      - universal.a1.plans.make_simple_plans
      - universal.a1.education.talk_about_studies
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_plans_intentions
        modality: listening
        task: Identify what a speaker is going to do soon and what they intend to do later.
        success_criteria: Extracts the near plan, the longer-term intention and any time expression without transcript-first support.
      - id: say_plans_intentions
        modality: speaking
        task: Tell a listener what you are going to do soon and what you plan to do later.
        success_criteria: Produces an intelligible statement of a near plan and a longer-term intention.
      - id: read_plans_intentions
        modality: reading
        task: Interpret a short written message about someone's plans.
        success_criteria: Identifies the plans, their timing and any stated intention.
      - id: write_plans_intentions
        modality: writing
        task: Write a short message about your plans for the coming weeks or months.
        success_criteria: Produces an accepted message with at least one near plan and one intention.

  - id: universal.a2.future.make_predictions_and_promises
    topic: plans
    can_do: Predict what will happen, say what will probably or possibly happen, and make a simple promise.
    prerequisites:
      - universal.a2.future.announce_plans_and_intentions
      - universal.a1.weather.describe_basic_weather
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_predictions_promises
        modality: listening
        task: Identify what a forecast, notice or speaker predicts or promises.
        success_criteria: Extracts the predicted event and whether it is certain or only possible without transcript-first support.
      - id: say_predictions_promises
        modality: speaking
        task: Make a prediction about the weather or the week ahead and make one promise.
        success_criteria: Produces an intelligible prediction and a promise using a suitable future or possibility expression.
      - id: read_predictions_promises
        modality: reading
        task: Interpret a short written forecast, notice or commitment.
        success_criteria: Identifies what is predicted or promised and how certain it is.
      - id: write_predictions_promises
        modality: writing
        task: Write a short message with a prediction and a promise.
        success_criteria: Produces an accepted message with at least one prediction and one promise.

  - id: universal.a2.modality.ask_permission_and_state_rules
    topic: rules
    can_do: Ask whether something is allowed and state what must be done, what must not be done and what does not need to be done.
    prerequisites:
      - universal.a1.library.borrow_return_item
      - universal.a1.housing.describe_home
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_rules_permission
        modality: listening
        task: Identify what is allowed, forbidden or required in a short explanation of rules.
        success_criteria: Extracts each rule and whether it is an obligation, a prohibition or a permission without transcript-first support.
      - id: say_rules_permission
        modality: speaking
        task: Ask whether something is allowed and state one rule that applies.
        success_criteria: Completes the exchange intelligibly with a permission question and a rule.
      - id: read_rules_permission
        modality: reading
        task: Interpret a short written list of house rules or a notice.
        success_criteria: Identifies what is required, forbidden or optional.
      - id: write_rules_permission
        modality: writing
        task: Write a short list of rules for a shared place.
        success_criteria: Produces an accepted list with at least one obligation and one prohibition.

  - id: universal.a2.modality.state_ability_and_possibility
    topic: abilities
    can_do: Say what you can and cannot do and what might happen, and describe your availability.
    prerequisites:
      - universal.a2.modality.ask_permission_and_state_rules
      - universal.a1.work.describe_job
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_ability_possibility
        modality: listening
        task: Identify what a speaker can or cannot do and what they say might happen.
        success_criteria: Extracts the ability or availability and any stated possibility without transcript-first support.
      - id: say_ability_possibility
        modality: speaking
        task: Say what you can and cannot do and one thing that might happen.
        success_criteria: Produces an intelligible statement of ability, inability and possibility.
      - id: read_ability_possibility
        modality: reading
        task: Interpret a short written message about someone's skills or availability.
        success_criteria: Identifies what the writer can do, cannot do and might do.
      - id: write_ability_possibility
        modality: writing
        task: Write a short message about your skills and your availability.
        success_criteria: Produces an accepted message with at least one ability, one inability and one possibility.

  - id: universal.a2.requests.make_polite_requests_and_offers
    topic: requests
    can_do: Make a polite request, offer help, and accept or decline an offer or request politely.
    prerequisites:
      - universal.a2.modality.state_ability_and_possibility
      - universal.a1.neighborhood.describe_neighborhood
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_requests_offers
        modality: listening
        task: Identify what is being requested or offered and whether it is accepted or declined.
        success_criteria: Extracts the request or offer and the response without transcript-first support.
      - id: say_requests_offers
        modality: speaking
        task: Make a polite request, offer help to someone, and accept or decline politely.
        success_criteria: Completes the exchange intelligibly in an appropriately polite register.
      - id: read_requests_offers
        modality: reading
        task: Interpret a short written request or offer of help.
        success_criteria: Identifies what is asked or offered and the reply.
      - id: write_requests_offers
        modality: writing
        task: Write a short polite message making a request or offering help.
        success_criteria: Produces an accepted message in an appropriately polite register.

  - id: universal.a2.advice.give_simple_advice
    topic: advice
    can_do: Give and respond to simple advice about a problem such as health, study or money.
    prerequisites:
      - universal.a2.requests.make_polite_requests_and_offers
      - universal.a1.health.describe_basic_problem
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_simple_advice
        modality: listening
        task: Identify what problem a speaker describes and what advice is given.
        success_criteria: Extracts the problem and the advice without transcript-first support.
      - id: say_simple_advice
        modality: speaking
        task: Describe a small problem, give advice about someone else's problem and respond to advice you are given.
        success_criteria: Produces an intelligible problem, a piece of advice and a response.
      - id: read_simple_advice
        modality: reading
        task: Interpret a short written message asking for or giving advice.
        success_criteria: Identifies the problem and the advice given.
      - id: write_simple_advice
        modality: writing
        task: Write a short reply giving advice about a problem.
        success_criteria: Produces an accepted reply with at least two pieces of advice.

  - id: universal.a2.habits.describe_starting_stopping_trying
    topic: habits
    can_do: Say what you started, stopped, tried or forgot to do, for example a sport, a habit or screen time.
    prerequisites:
      - universal.a2.modality.state_ability_and_possibility
      - universal.a1.sports.talk_about_sports_exercise
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_start_stop_try
        modality: listening
        task: Identify what a speaker started, stopped, tried or forgot to do.
        success_criteria: Extracts which action was started, stopped, tried or forgotten without transcript-first support.
      - id: say_start_stop_try
        modality: speaking
        task: Tell a listener about something you started, stopped, tried or forgot to do.
        success_criteria: Produces an intelligible statement with at least two of these four verbs of change or effort.
      - id: read_start_stop_try
        modality: reading
        task: Interpret a short written text about someone's changed habits.
        success_criteria: Identifies what was started, stopped, tried or forgotten.
      - id: write_start_stop_try
        modality: writing
        task: Write a short text about a habit you started or stopped and something you tried.
        success_criteria: Produces an accepted text with at least two different habit statements.

  - id: universal.a2.reasons.explain_reasons_and_consequences
    topic: reasons
    can_do: Give a reason and a consequence in one message, for example when explaining an excuse or a change of plan.
    prerequisites:
      - universal.a1.appointments.make_simple_appointment
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_reason_consequence
        modality: listening
        task: Identify the reason and the consequence in a short explanation.
        success_criteria: Extracts the reason and what followed from it without transcript-first support.
      - id: say_reason_consequence
        modality: speaking
        task: Explain a change of plan by giving a reason and its consequence.
        success_criteria: Produces an intelligible message that links one reason and one consequence.
      - id: read_reason_consequence
        modality: reading
        task: Interpret a short written message that gives a reason and a result.
        success_criteria: Identifies the reason and the consequence.
      - id: write_reason_consequence
        modality: writing
        task: Write a short message giving a reason and its consequence.
        success_criteria: Produces an accepted message with a connector marking reason and one marking consequence.

  - id: universal.a2.sequencing.order_events_with_time_clauses
    topic: sequencing
    can_do: Order events using before, after and when, for example daily sequences, travel logistics or a recipe.
    prerequisites:
      - universal.a2.reasons.explain_reasons_and_consequences
      - universal.a1.routines.describe_daily_routine
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_time_order
        modality: listening
        task: Identify which event comes first and which comes later in a short description.
        success_criteria: Extracts the order of events from before, after and when links without transcript-first support.
      - id: say_time_order
        modality: speaking
        task: Explain what you do before, after and when something else happens.
        success_criteria: Produces an intelligible statement that orders two events with a time link.
      - id: read_time_order
        modality: reading
        task: Interpret a short written sequence of instructions or events.
        success_criteria: Identifies the order of the events.
      - id: write_time_order
        modality: writing
        task: Write a short sequence of events using before, after or when.
        success_criteria: Produces an accepted text with at least two different time links.

  - id: universal.a2.purpose.say_why_you_do_things
    topic: purpose
    can_do: Say what you do something for, such as errands, learning or saving money.
    prerequisites:
      - universal.a2.reasons.explain_reasons_and_consequences
      - universal.a1.money.handle_basic_money_matters
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_purpose
        modality: listening
        task: Identify what a speaker does and what purpose they give.
        success_criteria: Extracts the action and its purpose without transcript-first support.
      - id: say_purpose
        modality: speaking
        task: Say what you do something for, giving your purpose.
        success_criteria: Produces an intelligible statement linking an action with its purpose.
      - id: read_purpose
        modality: reading
        task: Interpret a short written text explaining why someone does something.
        success_criteria: Identifies the action and its stated purpose.
      - id: write_purpose
        modality: writing
        task: Write a short text saying what you do and what you do it for.
        success_criteria: Produces an accepted text with at least two action-and-purpose statements.

  - id: universal.a2.conditions.talk_about_real_conditions
    topic: conditions
    can_do: Talk about what happens or will happen if a real, possible condition is met, for example weather plans or shop policies. Limited to real conditions only.
    prerequisites:
      - universal.a2.sequencing.order_events_with_time_clauses
      - universal.a1.weather.describe_basic_weather
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_real_conditions
        modality: listening
        task: Identify the condition and its result in a short explanation.
        success_criteria: Extracts the condition and the outcome without transcript-first support.
      - id: say_real_conditions
        modality: speaking
        task: Say what will happen if a possible condition is met, such as a weather plan or a shop policy.
        success_criteria: Produces an intelligible real-condition statement with a condition and a result.
      - id: read_real_conditions
        modality: reading
        task: Interpret a short written notice or message stating a condition and a result.
        success_criteria: Identifies the condition and the result.
      - id: write_real_conditions
        modality: writing
        task: Write two sentences saying what you will do depending on a real condition.
        success_criteria: Produces an accepted text with a condition and a result in each sentence.

  - id: universal.a2.questions.ask_indirect_questions
    topic: questions
    can_do: Ask politely for information with an embedded question, such as asking whether someone knows where or when something is.
    prerequisites:
      - universal.a2.purpose.say_why_you_do_things
      - universal.a1.directions.ask_follow_basic_directions
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_indirect_question
        modality: listening
        task: Identify what someone politely asks to be told.
        success_criteria: Extracts the information requested without transcript-first support.
      - id: say_indirect_question
        modality: speaking
        task: Politely ask a stranger for information at a station, an office or a museum using an embedded question.
        success_criteria: Produces an intelligible polite question that embeds where, when, whether or how.
      - id: read_indirect_question
        modality: reading
        task: Interpret a short written polite enquiry.
        success_criteria: Identifies the information being requested.
      - id: write_indirect_question
        modality: writing
        task: Write a short polite enquiry that asks for information.
        success_criteria: Produces an accepted enquiry with one embedded question.

  - id: universal.a2.communication.pass_on_a_simple_message
    topic: communication
    can_do: Pass on what someone says or asks, using the present tense only, for example a phone message or a note.
    prerequisites:
      - universal.a2.questions.ask_indirect_questions
      - universal.a1.communication.basic_phone_contact
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_passed_on_message
        modality: listening
        task: Identify what someone says or asks in a short phone message.
        success_criteria: Extracts the message content and who it is from without transcript-first support.
      - id: say_passed_on_message
        modality: speaking
        task: Pass on a simple message by telling someone what another person says or asks right now.
        success_criteria: Produces an intelligible report of one statement and one question in the present tense.
      - id: read_passed_on_message
        modality: reading
        task: Interpret a short written note that reports a message.
        success_criteria: Identifies who says or asks what.
      - id: write_passed_on_message
        modality: writing
        task: Write a short note passing on a message to someone.
        success_criteria: Produces an accepted note that reports one statement and one question.

  - id: universal.a2.plans.rearrange_an_appointment
    topic: appointments
    can_do: Move an appointment, explaining the reason and proposing a new day or time.
    prerequisites:
      - universal.a1.appointments.make_simple_appointment
      - universal.a1.communication.basic_phone_contact
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_rescheduling
        modality: listening
        task: Identify which day or time is offered, refused and finally agreed in a short call about moving an appointment.
        success_criteria: Extracts the refused option, the reason and the agreed new time without transcript-first support.
      - id: rearrange_an_appointment
        modality: speaking
        task: Ask to move an appointment, give a reason and agree a new day and time.
        success_criteria: Completes the exchange intelligibly using an appropriately polite register.
      - id: read_rescheduling_message
        modality: reading
        task: Interpret a short written message confirming that an appointment has been moved.
        success_criteria: Identifies the new time and what to do if it does not suit.
      - id: write_rescheduling_request
        modality: writing
        task: Write a short message saying you cannot come and asking to move the appointment.
        success_criteria: Produces an accepted polite message with a reason and a proposed alternative.

  - id: universal.a1.hobbies.describe_free_time_activities
    topic: hobbies
    can_do: Describe what you and others do for fun in your free time, and ask someone about theirs.
    prerequisites:
      - universal.a1.preferences.express_preferences
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_hobby_description
        modality: listening
        task: Identify what free-time activity someone describes doing and roughly how often.
        success_criteria: Extracts the specific activity and frequency without transcript-first support.
      - id: describe_own_hobbies
        modality: speaking
        task: Describe one or two things you do in your free time and how often.
        success_criteria: Produces an intelligible description naming a real activity and a frequency expression.
      - id: read_hobby_exchange
        modality: reading
        task: Interpret a short written exchange about free-time activities.
        success_criteria: Identifies which activities are mentioned and any stated preference between them.
      - id: write_hobby_description
        modality: writing
        task: Write a short message describing a free-time activity you enjoy.
        success_criteria: Produces an accepted target-language sentence naming a real activity.

  - id: universal.a1.appearance.describe_physical_appearance
    topic: appearance
    can_do: Describe a person's basic physical appearance and ask what someone looks like.
    prerequisites:
      - universal.a1.family.describe_relationships
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_appearance_description
        modality: listening
        task: Identify the physical traits (e.g. height, hair) a speaker attributes to a named person.
        success_criteria: Extracts the specific traits described without transcript-first support.
      - id: describe_someone_appearance
        modality: speaking
        task: Describe a real or supplied person's basic physical appearance in one or two sentences.
        success_criteria: Produces an intelligible description using at least one concrete physical trait.
      - id: read_appearance_description
        modality: reading
        task: Interpret a short written description of someone's appearance.
        success_criteria: Identifies which physical traits are mentioned and to whom they're attributed.
      - id: write_appearance_description
        modality: writing
        task: Write a short description of a person's physical appearance.
        success_criteria: Produces an accepted target-language sentence naming a real physical trait.

  - id: universal.a1.animals.describe_pets_animals
    topic: animals
    can_do: Talk about pets and common animals, including whether you have one and basic care.
    prerequisites:
      - universal.a1.preferences.express_preferences
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_pet_description
        modality: listening
        task: Identify what pet or animal someone describes and one stated fact about it (name, age, or care habit).
        success_criteria: Extracts the specific animal and fact without transcript-first support.
      - id: describe_own_pet_or_preference
        modality: speaking
        task: Say whether you have a pet (or which animal you like) and give one detail about it.
        success_criteria: Produces an intelligible statement naming a real animal.
      - id: read_pet_description
        modality: reading
        task: Interpret a short written description of someone's pet or favorite animal.
        success_criteria: Identifies which animal is described and the stated detail about it.
      - id: write_pet_description
        modality: writing
        task: Write a short message about a pet or animal you like.
        success_criteria: Produces an accepted target-language sentence naming a real animal.

  - id: universal.a1.sports.talk_about_sports_exercise
    topic: sports
    can_do: Talk about which sports or exercise you do, how often, and where.
    prerequisites:
      - universal.a1.hobbies.describe_free_time_activities
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_sport_description
        modality: listening
        task: Identify which sport or exercise activity someone describes doing and how often.
        success_criteria: Extracts the specific sport/activity and frequency without transcript-first support.
      - id: describe_own_sport_activity
        modality: speaking
        task: Say which sport or exercise you do (or don't do) and roughly how often.
        success_criteria: Produces an intelligible statement naming a real sport/activity and a frequency.
      - id: read_sport_description
        modality: reading
        task: Interpret a short written description of someone's sport or exercise habits.
        success_criteria: Identifies which sport/activity is described and its stated frequency or location.
      - id: write_sport_description
        modality: writing
        task: Write a short message about a sport or exercise activity you do.
        success_criteria: Produces an accepted target-language sentence naming a real sport/activity.

  - id: universal.a1.transportation.getting_around_town
    topic: transportation
    can_do: Talk about how you get around town (bus, train, bike, car, on foot), buy a ticket, and ask which transport to take.
    prerequisites:
      - universal.a1.directions.ask_follow_basic_directions
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_transport_choice
        modality: listening
        task: Identify which mode of transportation someone says they use and any stated detail (frequency, destination, or ticket type).
        success_criteria: Extracts the specific transport mode and detail without transcript-first support.
      - id: describe_own_transport_habit
        modality: speaking
        task: Say how you usually get to a place (work, school, downtown) and ask which transport someone else recommends.
        success_criteria: Produces an intelligible statement naming a real transport mode and a recommendation-seeking question.
      - id: read_transport_description
        modality: reading
        task: Interpret a short written description of someone's commute or a simple transit sign/ticket.
        success_criteria: Identifies the transport mode and the stated schedule/price/destination detail.
      - id: write_transport_description
        modality: writing
        task: Write a short message describing how to get somewhere by public transport or asking for a ticket.
        success_criteria: Produces an accepted target-language sentence naming a real transport mode and a concrete detail (destination, time, or price).

  - id: universal.b1.abilities.express_ability_with_embedded_clause
    topic: abilities
    can_do: >-
      Express what you can or could do using a modal-plus-embedded-clause
      construction (not just a bare modal + verb), across everyday and
      administrative topics such as errands, permissions, and appointments,
      and contrast present ability with past/hypothetical ability.
    prerequisites:
      - universal.a2.bureaucracy.register_with_authorities
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_ability_statement
        modality: listening
        task: Identify what someone says they can or could do and whether the ability is present or past/hypothetical.
        success_criteria: Extracts the specific action and correctly distinguishes present-ability from past/hypothetical-ability framing without transcript-first support.
      - id: state_own_ability
        modality: speaking
        task: Say what you can do (or could have done) regarding a real errand, permission, or appointment, using an embedded-clause construction rather than a bare modal.
        success_criteria: Produces an intelligible statement with correct subject-verb agreement across the modal and the embedded verb.
      - id: read_ability_statement
        modality: reading
        task: Interpret a short written statement about someone's present or past ability to do something.
        success_criteria: Identifies the action and the present-vs-past/hypothetical framing.
      - id: write_ability_statement
        modality: writing
        task: Write a short message stating what you can do or what you could have done about a real errand or appointment.
        success_criteria: Produces an accepted target-language sentence using the modal-plus-embedded-clause construction with correct agreement.

  - id: universal.a1.technology.describe_device_use
    topic: technology
    can_do: Talk about which devices and apps you use, and basic ways you use them, like calling, texting, or looking something up online.
    prerequisites:
      - universal.a1.communication.basic_phone_contact
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_device_use_description
        modality: listening
        task: Identify which device or app someone describes using and one basic detail about how they use it.
        success_criteria: Extracts the specific device/app and the stated use without transcript-first support.
      - id: describe_own_device_use
        modality: speaking
        task: Say which device(s) or app(s) you use and one thing you do with them (call, text, look something up).
        success_criteria: Produces an intelligible statement naming a real device/app and a basic use.
      - id: read_device_use_description
        modality: reading
        task: Interpret a short written description of someone's device or app use.
        success_criteria: Identifies which device/app is described and the stated use.
      - id: write_device_use_description
        modality: writing
        task: Write a short message about a device or app you use and how.
        success_criteria: Produces an accepted target-language sentence naming a real device/app and a use.

  - id: universal.b1.necessity.express_obligation_with_subjunctive
    topic: necessity
    can_do: >-
      Express present necessity/obligation and past regret about an
      unfulfilled obligation using an invariant modal particle plus a
      conjugated subordinate verb, and negate the modal for prohibition.
    prerequisites:
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_necessity_statement
        modality: listening
        task: Identify what someone says they must or should do, and whether it is present necessity or past regret.
        success_criteria: Extracts the specific action and correctly distinguishes present-necessity from past-regret framing without transcript-first support.
      - id: state_own_necessity
        modality: speaking
        task: Say what you must do (or should have done) regarding a real obligation, using the fixed-modal-plus-conjugated-verb construction.
        success_criteria: Produces an intelligible statement with correct subject-verb agreement on the subordinate verb.
      - id: read_necessity_statement
        modality: reading
        task: Interpret a short written statement about someone's present or past obligation.
        success_criteria: Identifies the action and the present-vs-past-regret framing.
      - id: write_necessity_statement
        modality: writing
        task: Write a short message stating what you must do or what you should have done about a real obligation.
        success_criteria: Produces an accepted target-language sentence using the modal-plus-conjugated-verb construction with correct agreement.

  - id: universal.a1.education.talk_about_studies
    topic: education
    can_do: Talk about what you study or are learning, where, and how you feel about it.
    prerequisites:
      - universal.a1.work.describe_job
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_study_description
        modality: listening
        task: Identify what someone says they study and where.
        success_criteria: Extracts the subject/field and institution without transcript-first support.
      - id: describe_own_studies
        modality: speaking
        task: Say what you study or are learning and where.
        success_criteria: Produces an intelligible statement naming a real subject/field and institution.
      - id: read_study_description
        modality: reading
        task: Interpret a short written description of someone's studies.
        success_criteria: Identifies the subject/field and one additional detail (institution or opinion).
      - id: write_study_description
        modality: writing
        task: Write a short message about what you study or are learning.
        success_criteria: Produces an accepted target-language sentence naming a real subject/field.

  - id: universal.a1.celebrations.talk_about_celebrations
    topic: celebrations
    can_do: Talk about birthdays and celebrations -- say when your birthday is, invite someone to celebrate, and congratulate them.
    prerequisites:
      - universal.a1.dates.exchange_calendar_dates
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_celebration_description
        modality: listening
        task: Identify what occasion someone describes celebrating and when it is.
        success_criteria: Extracts the occasion and its date or day without transcript-first support.
      - id: describe_own_celebration
        modality: speaking
        task: Say when your birthday is, or invite someone to a celebration and congratulate them.
        success_criteria: Produces an intelligible statement naming a real date or occasion and using a basic invitation or congratulation.
      - id: read_celebration_description
        modality: reading
        task: Interpret a short written message about a birthday or celebration.
        success_criteria: Identifies the occasion, its date, and one additional detail (e.g. who is invited or attending).
      - id: write_celebration_message
        modality: writing
        task: Write a short message inviting someone to a celebration or congratulating them on their birthday.
        success_criteria: Produces an accepted target-language sentence with a correctly formed invitation or congratulation.

  - id: universal.a1.household.describe_chores
    topic: household
    can_do: Talk about household chores -- say which chores need doing, who does them, and ask someone for help with one.
    prerequisites:
      - universal.a1.housing.describe_home
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_chore_description
        modality: listening
        task: Identify which household chore someone says they are doing or need to do.
        success_criteria: Extracts the specific chore without transcript-first support.
      - id: describe_own_chores
        modality: speaking
        task: Say which chore you are doing or need to do, or ask someone for help with one.
        success_criteria: Produces an intelligible statement naming a real chore and using a basic request for help.
      - id: read_chore_description
        modality: reading
        task: Interpret a short written message about household chores.
        success_criteria: Identifies which chore is mentioned and who is responsible for it.
      - id: write_chore_message
        modality: writing
        task: Write a short message saying which chore you will do or asking someone to help with one.
        success_criteria: Produces an accepted target-language sentence naming a real chore.

  - id: universal.a1.neighborhood.describe_neighborhood
    topic: neighborhood
    can_do: Talk about your neighborhood -- describe where you live, name nearby places, and talk about your neighbors.
    prerequisites:
      - universal.a1.places.locate_common_places
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_neighborhood_description
        modality: listening
        task: Identify what someone says about their neighborhood or a neighbor they describe.
        success_criteria: Extracts the nearby place or neighbor detail without transcript-first support.
      - id: describe_own_neighborhood
        modality: speaking
        task: Say something about where you live, a nearby place, or your neighbor.
        success_criteria: Produces an intelligible statement naming a real place or a neighbor detail.
      - id: read_neighborhood_description
        modality: reading
        task: Interpret a short written description of a neighborhood or a neighbor.
        success_criteria: Identifies the nearby place or neighbor detail and one additional detail.
      - id: write_neighborhood_message
        modality: writing
        task: Write a short message describing your neighborhood or a neighbor.
        success_criteria: Produces an accepted target-language sentence naming a real place or a neighbor detail.

  - id: universal.a1.post.send_receive_mail
    topic: post
    can_do: Handle basic post office tasks -- buy a stamp, send a letter or package, and ask when it will arrive.
    prerequisites:
      - universal.a1.money.handle_basic_money_matters
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_mail_exchange
        modality: listening
        task: Identify what someone at a post office counter says about sending mail or a package.
        success_criteria: Extracts the item being sent or its delivery detail without transcript-first support.
      - id: request_mail_service
        modality: speaking
        task: Ask for a stamp or ask to send a letter or package at a counter.
        success_criteria: Produces an intelligible request naming the item and the service needed.
      - id: read_mail_notice
        modality: reading
        task: Interpret a short written text about sending mail or a package's delivery.
        success_criteria: Identifies the item and its delivery detail.
      - id: write_mail_request
        modality: writing
        task: Write a short message about sending a letter or package.
        success_criteria: Produces an accepted target-language sentence naming the item and the request.

  - id: universal.a1.cooking.prepare_simple_meal
    topic: cooking
    can_do: Talk about cooking a simple meal -- name basic kitchen actions, describe preparing food, and follow or give simple cooking instructions.
    prerequisites:
      - universal.a1.food.order_simple_meal
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_cooking_description
        modality: listening
        task: Identify what someone says about cooking or preparing a meal.
        success_criteria: Extracts the food item or cooking action without transcript-first support.
      - id: describe_cooking_activity
        modality: speaking
        task: Say what you are cooking or a simple cooking action you're doing.
        success_criteria: Produces an intelligible statement naming a food item and a cooking action.
      - id: read_cooking_instruction
        modality: reading
        task: Interpret a short written text about cooking or preparing a meal.
        success_criteria: Identifies the food item and the cooking action described.
      - id: write_cooking_message
        modality: writing
        task: Write a short message about cooking or preparing a meal.
        success_criteria: Produces an accepted target-language sentence naming the food item and the cooking action.

  - id: universal.a1.personality.describe_basic_personality_traits
    topic: personality
