  - id: universal.b1.abilities.express_ability_with_embedded_clause
    topic: abilities
    can_do: >-
      Express what you can or could do using a modal-plus-embedded-clause
      construction (not just a bare modal + verb), across everyday and
      administrative topics such as errands, permissions, and appointments,
      and contrast present ability with past/hypothetical ability.
    prerequisites:
      - universal.a2.bureaucracy.register_with_authorities
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_ability_statement
        modality: listening
        task: Identify what someone says they can or could do and whether the ability is present or past/hypothetical.
        success_criteria: Extracts the specific action and correctly distinguishes present-ability from past/hypothetical-ability framing without transcript-first support.
      - id: state_own_ability
        modality: speaking
        task: Say what you can do (or could have done) regarding a real errand, permission, or appointment, using an embedded-clause construction rather than a bare modal.
        success_criteria: Produces an intelligible statement with correct subject-verb agreement across the modal and the embedded verb.
      - id: read_ability_statement
        modality: reading
        task: Interpret a short written statement about someone's present or past ability to do something.
        success_criteria: Identifies the action and the present-vs-past/hypothetical framing.
      - id: write_ability_statement
        modality: writing
        task: Write a short message stating what you can do or what you could have done about a real errand or appointment.
        success_criteria: Produces an accepted target-language sentence using the modal-plus-embedded-clause construction with correct agreement.

