  - id: universal.b1.hypotheticals.express_hypothetical_conditions
    topic: hypotheticals
    can_do: >-
      Express a real/possible future condition and its result, and contrast
      it with an unreal/counterfactual present-or-past condition and its
      result, using a conditional clause plus a matching result clause.
    prerequisites:
      - universal.b1.necessity.express_obligation_with_subjunctive
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_conditional_statement
        modality: listening
        task: Identify the stated condition and its result, and whether the condition is presented as real/possible or unreal/counterfactual.
        success_criteria: Extracts both the condition and the result and correctly distinguishes real/possible framing from unreal/counterfactual framing without transcript-first support.
      - id: state_own_condition
        modality: speaking
        task: Say what you will do if a real condition is met, or what you would do (or would have done) if an unreal condition were true, about a real everyday decision.
        success_criteria: Produces an intelligible conditional statement with the condition and result clause in the correct matching mood/tense pairing.
      - id: read_conditional_statement
        modality: reading
        task: Interpret a short written statement expressing a real/possible or unreal/counterfactual condition and its result.
        success_criteria: Identifies the condition, the result, and the real-vs-unreal framing.
      - id: write_conditional_statement
        modality: writing
        task: Write a short message expressing a real condition and its result, or an unreal/counterfactual condition and its result.
        success_criteria: Produces an accepted target-language sentence with the condition and result clause in the correct matching mood/tense pairing.

  - id: universal.b1.debate.agree_disagree_with_reasons
    topic: debate
    can_do: >-
      State agreement or disagreement with someone else's stated opinion and
      support your own position with a reason, using a subordinate
      that-clause to report or reference the other person's view.
    prerequisites:
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_agreement_or_disagreement
        modality: listening
        task: Identify whether a speaker agrees or disagrees with a stated opinion and the reason they give.
        success_criteria: Extracts the agree/disagree stance and the supporting reason without transcript-first support.
      - id: state_agreement_or_disagreement
        modality: speaking
        task: State whether you agree or disagree with a given opinion on an everyday topic and give a reason, referencing the other person's view with a that-clause.
        success_criteria: Produces an intelligible agree/disagree statement with a coherent supporting reason and correct subordinate-clause agreement.
      - id: read_agreement_or_disagreement
        modality: reading
        task: Interpret a short written exchange in which someone agrees or disagrees with a stated opinion.
        success_criteria: Identifies the stance taken and the reason given.
      - id: write_agreement_or_disagreement
        modality: writing
        task: Write a short message agreeing or disagreeing with a stated opinion and giving a reason.
        success_criteria: Produces an accepted target-language sentence stating a stance and a coherent supporting reason.

  - id: universal.b1.workplace.describe_responsibilities_and_updates
    topic: workplace
    can_do: >-
      Describe your job responsibilities, give a colleague a status update on
      a work task, and ask a colleague for professional help, in
      appropriately professional register.
    prerequisites:
      - universal.a2.employment.attend_job_interview
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_responsibility_or_update
        modality: listening
        task: Identify what task or area of responsibility someone describes, and whether they report it as complete, in progress, or delayed.
        success_criteria: Extracts the specific task/responsibility and the correct status without transcript-first support.
      - id: state_own_responsibility_or_update
        modality: speaking
        task: Say what you are responsible for at work, or give a status update on a task, using appropriately professional register.
        success_criteria: Produces an intelligible statement naming a real responsibility or task status with correct subject agreement.
      - id: read_responsibility_or_update
        modality: reading
        task: Interpret a short written status update or description of a work responsibility.
        success_criteria: Identifies the task/responsibility and its status.
      - id: write_responsibility_or_update
        modality: writing
        task: Write a short professional message describing a responsibility or giving a status update on a task.
        success_criteria: Produces an accepted target-language sentence naming a real responsibility or task status in professional register.

  - id: universal.b1.narrative.recount_past_experience_with_sequencing
    topic: narrative
    can_do: >-
      Recount a past experience as a sequence of events, marking background
      action against a main-line event with a sequencing connector, and
      report what someone else said using reported-speech subordination.
    prerequisites:
      - universal.a1.past_events.describe_recent_event
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_sequenced_narrative
        modality: listening
        task: Identify the background circumstance and the main event it interrupted or led to in a short past-tense narrative, and what someone reportedly said.
        success_criteria: Extracts the background action, the main-line event, and any reported statement without transcript-first support.
      - id: recount_sequenced_narrative
        modality: speaking
        task: Recount a real past experience as a short sequence of events, using a sequencing connector and reporting what someone said.
        success_criteria: Produces an intelligible narrative with events in a coherent sequence and correctly formed reported speech.
      - id: read_sequenced_narrative
        modality: reading
        task: Interpret a short written narrative with a background circumstance, a main-line event, and reported speech.
        success_criteria: Identifies the sequence of events and what was reportedly said.
      - id: write_sequenced_narrative
        modality: writing
        task: Write a short narrative recounting a real past experience as a sequence of events, including what someone said.
        success_criteria: Produces an accepted target-language narrative with events in a coherent sequence and correctly formed reported speech.

  - id: universal.b1.conditions.express_real_conditions
    topic: conditions
    can_do: >-
      Express a real/likely condition and its consequence using an
      if-clause construction (condition + result across two clauses,
      not a bare single statement), across everyday planning topics,
      and negate the condition to express "if not."
    prerequisites:
      - universal.b1.necessity.express_obligation_with_subjunctive
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_condition_statement
        modality: listening
        task: Identify the stated condition and its consequence in a short if-then statement.
        success_criteria: Extracts both the condition and the result clause without transcript-first support.
      - id: state_own_condition
        modality: speaking
        task: Say what you will do if a real, likely circumstance occurs (or does not occur), using an if-clause construction.
        success_criteria: Produces an intelligible two-clause statement with correct subject-verb agreement in both clauses.
      - id: read_condition_statement
        modality: reading
        task: Interpret a short written if-then statement.
        success_criteria: Identifies the condition and the result it leads to.
      - id: write_condition_statement
        modality: writing
        task: Write a short message stating a real condition and its consequence, including at least one negated condition.
        success_criteria: Produces an accepted target-language sentence using the if-clause construction with correct agreement.

  - id: universal.b1.sequencing.describe_events_with_time_clauses
    topic: sequencing
    can_do: >-
      Describe when one event happens relative to another using a
      time-clause construction ("when X happens, Y happens/happened"),
      across everyday routines and past narratives, distinguishing a
      habitual/present time clause from a past one.
    prerequisites:
      - universal.b1.conditions.express_real_conditions
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_time_clause_statement
        modality: listening
        task: Identify which event happens first and which follows in a short time-clause statement.
        success_criteria: Extracts both events and their relative sequence without transcript-first support.
      - id: state_own_sequence
        modality: speaking
        task: Say when you do something relative to another event in your routine, using a time-clause construction.
        success_criteria: Produces an intelligible two-clause statement correctly sequencing the two events.
      - id: read_time_clause_statement
        modality: reading
        task: Interpret a short written statement sequencing two events with a time clause.
        success_criteria: Identifies both events and their correct order.
      - id: write_time_clause_statement
        modality: writing
        task: Write a short message sequencing two events, in either a present/habitual or past time frame.
        success_criteria: Produces an accepted target-language sentence using the time-clause construction with correct sequencing.

  - id: universal.b1.reported_speech.report_what_someone_said
    topic: reported_speech
    can_do: >-
      Report what someone else said or asked using an embedded-clause
      reported-speech construction ("X said that...", "X asked
      whether..."), across everyday messages and workplace topics,
      without needing to reproduce the original speaker's exact words.
    prerequisites:
      - universal.b1.sequencing.describe_events_with_time_clauses
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_reported_statement
        modality: listening
        task: Identify who said or asked what in a short reported-speech statement.
        success_criteria: Extracts the reported speaker and the content of what was said or asked without transcript-first support.
      - id: report_what_someone_said
        modality: speaking
        task: Report what a real person told you or asked you, using an embedded reported-speech clause rather than quoting them directly.
        success_criteria: Produces an intelligible statement correctly embedding the reported content after a reporting verb.
      - id: read_reported_statement
        modality: reading
        task: Interpret a short written statement reporting what someone said or asked.
        success_criteria: Identifies the reported speaker and the reported content.
      - id: write_reported_statement
        modality: writing
        task: Write a short message reporting what someone said or asked.
        success_criteria: Produces an accepted target-language sentence using the reported-speech construction with correctly embedded content.

  - id: universal.b1.purpose.express_purpose_and_goals
    topic: purpose
    can_do: >-
      Explain the purpose or goal behind an action using a purpose-clause
      construction ("X does Y in order to/so that Z"), across everyday
      and abstract topics such as study, work, and saving money.
    prerequisites:
      - universal.b1.reported_speech.report_what_someone_said
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_purpose_statement
        modality: listening
        task: Identify the stated action and its purpose in a short purpose-clause statement.
        success_criteria: Extracts both the action and the goal it serves without transcript-first support.
      - id: state_own_purpose
        modality: speaking
        task: Say why you are doing something, stating a real goal using a purpose-clause construction.
        success_criteria: Produces an intelligible two-clause statement correctly linking an action to its purpose.
      - id: read_purpose_statement
        modality: reading
        task: Interpret a short written statement explaining the purpose behind an action.
        success_criteria: Identifies the action and the stated goal.
      - id: write_purpose_statement
        modality: writing
        task: Write a short message explaining the purpose behind an action you take.
        success_criteria: Produces an accepted target-language sentence using the purpose-clause construction with correctly linked goal.

  - id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
    topic: hypotheticals
    can_do: >-
      Express hypothetical or unreal situations and wishes using a
      conditional-mood construction ("would" + verb) together with an unreal
      "if"-clause in a past/irrealis form, and use the conditional alone to
      soften a suggestion, request, or preference.
    prerequisites:
      - universal.a1.preferences.express_preferences
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_hypothetical_statement
        modality: listening
        task: Identify what someone says they would do (or would have done) in a stated hypothetical situation.
        success_criteria: Extracts the hypothetical condition and the stated hypothetical result without transcript-first support.
      - id: state_own_hypothetical
        modality: speaking
        task: Say what you would do in a real or invented hypothetical situation (more time, more money, a different choice), using the conditional-plus-if-clause construction.
        success_criteria: Produces an intelligible statement with a correctly formed conditional and a correctly formed irrealis if-clause.
      - id: read_hypothetical_statement
        modality: reading
        task: Interpret a short written statement about a hypothetical situation and its stated result.
        success_criteria: Identifies the condition and the hypothetical result.
      - id: write_hypothetical_statement
        modality: writing
        task: Write a short message stating what you would do in a hypothetical situation.
        success_criteria: Produces an accepted target-language sentence using the conditional-plus-if-clause construction with correct agreement.

  - id: universal.b1.opinions.debate_with_concession_and_nuance
    topic: opinions
    can_do: >-
      Debate a topic with nuance -- concede a valid point on the other side
      using a concessive connector ("although"/"even though") before
      restating your own position, and use a stronger contrastive connector
      than a simple "but" to structure a multi-point argument.
    prerequisites:
      - universal.a2.opinions.give_opinions_with_reasons
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_nuanced_argument
        modality: listening
        task: Identify a speaker's overall position and the concession they make to the opposing view before restating it.
        success_criteria: Extracts the speaker's real position and the specific point they concede without transcript-first support.
      - id: state_nuanced_opinion
        modality: speaking
        task: State an opinion on a real topic, concede one valid point on the other side using a concessive connector, and restate your own position.
        success_criteria: Produces an intelligible statement containing a correctly formed concessive clause and a clear restated position.
      - id: read_nuanced_argument
        modality: reading
        task: Interpret a short written argument that concedes a point before restating its main position.
        success_criteria: Identifies the writer's main position and the conceded point.
      - id: write_nuanced_argument
        modality: writing
        task: Write a short argument on a real topic that concedes one point on the other side before restating your own position.
        success_criteria: Produces an accepted target-language sentence using a concessive connector correctly.

  - id: universal.b1.workplace.communicate_professionally_in_meetings
    topic: workplace
    can_do: >-
      Communicate professionally in a workplace setting -- make a
      formal-register suggestion or request using a softened conditional
      form, participate in a short work-meeting exchange, and write a brief
      professional message.
    prerequisites:
      - universal.a1.work.describe_job
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_professional_request
        modality: listening
        task: Identify a formal-register suggestion, request, or proposal made in a short workplace exchange.
        success_criteria: Extracts the specific suggestion/request and who it is directed at without transcript-first support.
      - id: make_professional_request
        modality: speaking
        task: Make a formal-register suggestion or request to a colleague or manager using a softened conditional form.
        success_criteria: Produces an intelligible, correctly formal-register statement using the softened conditional construction.
      - id: read_professional_message
        modality: reading
        task: Interpret a short professional email or meeting note containing a suggestion or request.
        success_criteria: Identifies the suggestion/request and any stated deadline or next step.
      - id: write_professional_message
        modality: writing
        task: Write a brief professional message making a formal-register suggestion or request.
        success_criteria: Produces an accepted target-language sentence in formal register using the softened conditional construction.

  - id: universal.b1.narrative.combine_descriptions_with_relative_clauses
    topic: narrative
    can_do: >-
      Combine two facts about a person, place, or thing into a single,
      richer sentence using a relative clause (a "who"/"that"/"where"-type
      construction), including cases where the relative pronoun must agree
      in gender/number or must combine with a preposition.
    prerequisites:
      - universal.b1.opinions.debate_with_concession_and_nuance
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_relative_clause_description
        modality: listening
        task: Identify which person, place, or thing a speaker is describing when they use a relative clause to add identifying detail.
        success_criteria: Correctly matches the description to the right referent without transcript-first support.
      - id: describe_with_relative_clause
        modality: speaking
        task: Describe a real person, place, or thing by combining two facts about it into one sentence with a relative clause.
        success_criteria: Produces an intelligible sentence with a correctly formed and correctly agreeing relative clause.
      - id: read_relative_clause_description
        modality: reading
        task: Interpret a short written description that uses a relative clause to add identifying detail about a person, place, or thing.
        success_criteria: Identifies the referent and the added detail.
      - id: write_relative_clause_description
        modality: writing
        task: Write a short description of a real person, place, or thing that combines two facts using a relative clause.
        success_criteria: Produces an accepted target-language sentence with a correctly formed relative clause.

  - id: universal.b1.communication.report_what_someone_said
    topic: communication
    can_do: >-
      Report what someone said or asked using indirect/reported speech --
      shift a direct statement or question into a reported clause
      introduced by "that"/"whether", adjusting tense and pronouns as
      needed.
    prerequisites:
      - universal.b1.narrative.combine_descriptions_with_relative_clauses
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_reported_statement
        modality: listening
        task: Identify what someone reports another person said or asked, correctly distinguishing it from the reporter's own direct statement.
        success_criteria: Extracts the reported content and correctly attributes it to the original speaker without transcript-first support.
      - id: report_what_was_said
        modality: speaking
        task: Report what someone said or asked, using a reported-speech construction with correctly shifted tense and pronouns.
        success_criteria: Produces an intelligible reported-speech sentence with correct tense-shifting and pronoun agreement.
      - id: read_reported_statement
        modality: reading
        task: Interpret a short written passage that reports what someone said or asked.
        success_criteria: Identifies the original speaker and the reported content.
      - id: write_reported_statement
        modality: writing
        task: Write a short message reporting what someone said or asked.
        success_criteria: Produces an accepted target-language sentence using the reported-speech construction with correct tense-shifting.

  - id: universal.b1.services.make_complaint_and_resolve_problem
    topic: services
    can_do: >-
      Make a polite complaint about a product, service, or living
      situation -- describe what is wrong, say what already happened,
      and ask for a concrete resolution (refund, repair, replacement,
      or change), maintaining an appropriate register.
    prerequisites:
      - universal.b1.communication.report_what_someone_said
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_complaint
        modality: listening
        task: Identify what a speaker is complaining about and what resolution they are asking for.
        success_criteria: Correctly extracts both the problem and the requested resolution without transcript-first support.
      - id: make_complaint
        modality: speaking
        task: Make a polite spoken complaint that names the problem and asks for a specific resolution.
        success_criteria: Produces an intelligible, register-appropriate complaint containing both the problem and the requested resolution.
      - id: read_complaint_response
        modality: reading
        task: Interpret a short written complaint or a service provider's written response to one.
        success_criteria: Identifies the problem, the resolution offered or requested, and any conditions attached.
      - id: write_complaint
        modality: writing
        task: Write a short, polite complaint message that describes the problem and requests a specific resolution.
        success_criteria: Produces an accepted target-language complaint with the problem and requested resolution stated in an appropriate register.

  - id: universal.b1.social.give_advice_and_make_suggestions
    topic: social
    can_do: >-
      Give advice and make suggestions in response to someone's problem
      or plan -- using advice/suggestion constructions (an
      "if I were you"/"you should"/"how about"-type range), and respond
      to advice by accepting, declining, or asking a follow-up.
    prerequisites:
      - universal.b1.services.make_complaint_and_resolve_problem
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_advice
        modality: listening
        task: Identify what advice or suggestion a speaker gives and whether the listener accepts it.
        success_criteria: Correctly extracts the advice given and the response to it without transcript-first support.
      - id: give_advice
        modality: speaking
        task: Give spoken advice or a suggestion in response to a stated problem, using a taught advice construction.
        success_criteria: Produces an intelligible, correctly formed advice/suggestion sentence responsive to the problem.
      - id: read_advice
        modality: reading
        task: Interpret a short written exchange in which advice is requested and given.
        success_criteria: Identifies the problem, the advice given, and the advisee's response.
      - id: write_advice
        modality: writing
        task: Write a short message giving advice or a suggestion about a stated problem, using a named advice construction.
        success_criteria: Produces an accepted target-language advice sentence using the required construction.

  - id: universal.b1.hypotheticals.express_regret_and_past_wishes
    topic: hypotheticals
    can_do: >-
      Express regret and wishes about the past -- say what you wish had
      happened, what you should have done, or what would have been
      different, using past-hypothetical constructions.
    prerequisites:
      - universal.b1.social.give_advice_and_make_suggestions
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_regret
        modality: listening
        task: Identify what past event or decision a speaker regrets or wishes had been different.
        success_criteria: Correctly distinguishes the real past event from the wished-for alternative without transcript-first support.
      - id: express_regret
        modality: speaking
        task: Express a regret or past wish about a real or given situation using a past-hypothetical construction.
        success_criteria: Produces an intelligible, correctly formed past-hypothetical sentence expressing the regret or wish.
      - id: read_regret
        modality: reading
        task: Interpret a short written passage in which someone expresses regret or a wish about the past.
        success_criteria: Identifies both what actually happened and what the writer wishes had happened.
      - id: write_regret
        modality: writing
        task: Write a sentence or short message expressing regret or a wish about a past event.
        success_criteria: Produces an accepted target-language past-hypothetical sentence expressing the regret or wish.

  - id: universal.b1.future.describe_plans_intentions_and_predictions
    topic: future
    can_do: >-
      Describe future plans, intentions, and predictions with the
      appropriate degree of certainty -- distinguish fixed arrangements,
      intentions, and probable or uncertain predictions using the
      target language's future-reference forms and certainty markers.
    prerequisites:
      - universal.b1.hypotheticals.express_regret_and_past_wishes
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_future_plans
        modality: listening
        task: Identify a speaker's plan, intention, or prediction and how certain they are about it.
        success_criteria: Correctly extracts the future event and its certainty level without transcript-first support.
      - id: describe_future_plans
        modality: speaking
        task: Describe a real or given plan, intention, or prediction with an appropriate certainty marker.
        success_criteria: Produces an intelligible sentence using a correct future-reference form matching the intended certainty.
      - id: read_future_plans
        modality: reading
        task: Interpret a short written passage describing plans, intentions, or predictions.
        success_criteria: Identifies the future events and distinguishes fixed plans from uncertain predictions.
      - id: write_future_plans
        modality: writing
        task: Write a short message describing a plan, an intention, and a prediction about a given topic.
        success_criteria: Produces accepted target-language sentences using future-reference forms with appropriate certainty marking.

  - id: universal.b1.communication.summarize_and_retell
    topic: communication
    can_do: >-
      Summarize and retell in your own words -- give the main points of
      a short article, conversation, film, or event in a condensed,
      ordered form, distinguishing main points from detail.
    prerequisites:
      - universal.b1.future.describe_plans_intentions_and_predictions
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_summary
        modality: listening
        task: Identify whether a spoken summary accurately reflects the main points of a short source passage.
        success_criteria: Correctly judges which main points the summary keeps, omits, or distorts without transcript-first support.
      - id: retell_content
        modality: speaking
        task: Retell the main points of a short passage or conversation in your own words.
        success_criteria: Produces an intelligible retelling that covers the main points in order without copying the source verbatim.
      - id: read_summary
        modality: reading
        task: Match a short written summary to the source passage it summarizes, or identify its main points.
        success_criteria: Correctly identifies the main points and distinguishes them from supporting detail.
      - id: write_summary
        modality: writing
        task: Write a short summary of a given passage or event, keeping only the main points.
        success_criteria: Produces an accepted target-language summary containing the main points in a condensed, ordered form.

  - id: universal.b2.argumentation.defend_a_position_with_evidence
    topic: argumentation
    can_do: >-
      Defend a position in a discussion -- state a claim, support it
      with reasons and evidence, acknowledge the strongest opposing
      point, and rebut it without conceding the claim.
    prerequisites:
      - universal.b1.communication.summarize_and_retell
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_an_argument
        modality: listening
        task: Follow an extended spoken argument and identify the speaker's claim, their supporting reason, and the counter-argument they rebut.
        success_criteria: Correctly separates claim, support, and rebuttal without transcript-first support.
      - id: defend_a_position
        modality: speaking
        task: Take a position on a familiar issue and defend it, including one acknowledged counter-argument and a rebuttal.
        success_criteria: Produces a sustained, intelligible argument containing a claim, at least one supporting reason, and a rebuttal.
      - id: read_an_argument
        modality: reading
        task: Interpret a short argumentative text and identify the author's position, evidence, and the objection they answer.
        success_criteria: Distinguishes the author's own claim from the objection being answered.
      - id: write_an_argument
        modality: writing
        task: Write a short argumentative paragraph defending a position, acknowledging and rebutting one objection.
        success_criteria: Produces an accepted text with claim, support, and rebuttal correctly signposted.

  - id: universal.b2.speculation.hypothesize_about_causes_and_consequences
    topic: speculation
    can_do: >-
      Speculate about causes and consequences with graded certainty --
      say what may, might, must, or cannot be the case (present and
      past), and distinguish deduction from guesswork.
    prerequisites:
      - universal.b2.argumentation.defend_a_position_with_evidence
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_speculation
        modality: listening
        task: Identify how certain a speaker is about a cause or consequence, and whether they are deducing or guessing.
        success_criteria: Correctly ranks the speaker's certainty and identifies the reasoning type without transcript-first support.
      - id: speculate_aloud
        modality: speaking
        task: Speculate about the cause of a described situation using a modal of deduction with an appropriate certainty level.
        success_criteria: Produces an intelligible speculation whose modal matches the intended certainty.
      - id: read_speculation
        modality: reading
        task: Interpret a written passage that speculates about causes, distinguishing asserted fact from speculation.
        success_criteria: Separates what the writer claims as fact from what they hedge as possible.
      - id: write_speculation
        modality: writing
        task: Write sentences speculating about a past and a present cause, using different certainty levels.
        success_criteria: Produces accepted sentences with correctly formed deduction/speculation constructions.

  - id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
    topic: discourse
    can_do: >-
      Express nuance -- soften or strengthen a statement (hedging,
      qualification, emphasis, and focus constructions) so that the same
      content can be delivered tentatively, neutrally, or emphatically.
    prerequisites:
      - universal.b2.speculation.hypothesize_about_causes_and_consequences
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: detect_nuance
        modality: listening
        task: Identify whether a speaker is hedging, stating neutrally, or emphasizing, and what that implies about their commitment.
        success_criteria: Correctly classifies the speaker's stance without transcript-first support.
      - id: modulate_a_statement
        modality: speaking
        task: Deliver the same claim twice -- once hedged, once emphasized -- using the taught constructions.
        success_criteria: Produces both versions intelligibly with the correct constructions and no change in propositional content.
      - id: read_nuance
        modality: reading
        task: Interpret a text where the writer hedges a claim, and identify the hedge and what it qualifies.
        success_criteria: Identifies the hedging device and the claim it modifies.
      - id: write_with_nuance
        modality: writing
        task: Rewrite a blunt statement as a hedged one, and a weak statement as an emphatic one.
        success_criteria: Produces accepted rewrites using the named hedging/emphasis constructions.

  - id: universal.b2.narrative.recount_complex_events_with_shifting_time
    topic: narrative
    can_do: >-
      Recount a complex sequence of events with shifting time reference
      -- background versus foreground, events before other past events,
      and interrupted or ongoing actions, keeping the timeline
      unambiguous.
    prerequisites:
      - universal.b2.discourse.express_nuance_with_hedging_and_emphasis
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_complex_narrative
        modality: listening
        task: Reconstruct the true chronological order of a spoken account whose events are not told in order.
        success_criteria: Correctly orders the events and identifies which happened before which without transcript-first support.
      - id: recount_complex_events
        modality: speaking
        task: Recount a real or given incident that includes background, an interrupting event, and something that had happened beforehand.
        success_criteria: Produces an intelligible account whose time relations are correctly and unambiguously marked.
      - id: read_complex_narrative
        modality: reading
        task: Interpret a narrative passage with non-linear time reference and identify the earliest event.
        success_criteria: Correctly resolves the chronology, including the pre-past event.
      - id: write_complex_narrative
        modality: writing
        task: Write a short account containing background, a foregrounded event, and an event that preceded both.
        success_criteria: Produces an accepted text with correctly formed and unambiguous time relations.

  - id: universal.b2.register.adapt_formality_to_audience
    topic: register
    can_do: >-
      Adapt register to audience and purpose -- convey the same message
      appropriately to a friend, a colleague, and an institution,
      recognizing which forms are too casual or too stiff for a given
      setting.
    prerequisites:
      - universal.b2.narrative.recount_complex_events_with_shifting_time
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: judge_register
        modality: listening
        task: Identify whether a speaker's register fits the situation, and what it signals when it does not.
        success_criteria: Correctly judges appropriateness and identifies the mismatching feature without transcript-first support.
      - id: shift_register
        modality: speaking
        task: Deliver the same request twice -- once to a close friend, once to an institution -- with appropriate register in each.
        success_criteria: Produces both versions intelligibly with register-appropriate forms and no propositional change.
      - id: read_register
        modality: reading
        task: Interpret two texts conveying the same content in different registers and identify the audience each is written for.
        success_criteria: Correctly matches each text to its intended audience, citing a register feature.
      - id: write_in_register
        modality: writing
        task: Rewrite an informal message as a formal one suitable for an institution.
        success_criteria: Produces an accepted formal text preserving the content with register-appropriate forms.

  - id: universal.b2.abstraction.discuss_abstract_ideas_and_values
    topic: abstraction
    can_do: >-
      Discuss abstract topics -- ideas, values, cultural differences,
      and social issues -- expressing an opinion with qualification and
      responding to another person's view rather than only stating your
      own.
    prerequisites:
      - universal.b2.register.adapt_formality_to_audience
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_abstract_discussion
        modality: listening
        task: Follow a discussion of an abstract topic and identify each speaker's position and where they differ.
        success_criteria: Correctly attributes positions and locates the point of disagreement without transcript-first support.
      - id: discuss_an_abstract_topic
        modality: speaking
        task: Give a qualified opinion on an abstract topic and respond directly to an opposing view.
        success_criteria: Produces an intelligible qualified opinion that engages with the opposing view rather than restating its own.
      - id: read_abstract_text
        modality: reading
        task: Interpret a short text on an abstract or cultural topic and identify the author's stance and its qualification.
        success_criteria: Identifies the stance and what the author concedes or qualifies.
      - id: write_abstract_opinion
        modality: writing
        task: Write a short qualified opinion on an abstract topic, responding to a stated opposing view.
        success_criteria: Produces an accepted text with a qualified stance that addresses the opposing view.

  - id: universal.b2.negotiation.negotiate_and_resolve_disagreement
    topic: negotiation
    can_do: >-
      Negotiate an outcome -- propose terms, push back on unacceptable
      ones, offer a conditional concession, and reach or decline an
      agreement while keeping the relationship intact.
    prerequisites:
      - universal.b2.abstraction.discuss_abstract_ideas_and_values
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_negotiation
        modality: listening
        task: Identify what each side proposes, what they refuse, and what conditional concession is offered.
        success_criteria: Correctly extracts proposal, refusal, and the condition attached to any concession, without transcript-first support.
      - id: negotiate_aloud
        modality: speaking
        task: Negotiate a described disagreement -- state your terms, decline one term, and offer a conditional concession.
        success_criteria: Produces an intelligible negotiation containing a proposal, a refusal, and a correctly formed conditional concession.
      - id: read_negotiation
        modality: reading
        task: Interpret a written exchange of terms and identify what was agreed and what remains open.
        success_criteria: Correctly separates agreed points from open ones and identifies any conditions.
      - id: write_negotiation
        modality: writing
        task: Write a reply proposing revised terms and attaching a condition to a concession.
        success_criteria: Produces an accepted text with a clear proposal and a correctly formed conditional concession.

  - id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    topic: synthesis
    can_do: >-
      Synthesize and evaluate -- combine information from more than one
      source into a coherent summary, note where the sources agree or
      conflict, and give a reasoned judgement about them.
    prerequisites:
      - universal.b2.negotiation.negotiate_and_resolve_disagreement
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: synthesize_spoken_sources
        modality: listening
        task: Listen to two speakers on the same topic and identify where they agree, where they conflict, and which is better supported.
        success_criteria: Correctly locates agreement and conflict and justifies which account is better supported, without transcript-first support.
      - id: present_a_synthesis
        modality: speaking
        task: Summarize two conflicting accounts of the same topic and give a reasoned judgement between them.
        success_criteria: Produces an intelligible synthesis that represents both accounts and justifies the judgement.
      - id: read_multiple_sources
        modality: reading
        task: Read two short texts on one topic and identify the point on which they conflict.
        success_criteria: Correctly identifies the conflicting claim and what each source asserts about it.
      - id: write_a_synthesis
        modality: writing
        task: Write a short synthesis of two sources, naming their agreement, their conflict, and a reasoned judgement.
        success_criteria: Produces an accepted text covering agreement, conflict, and a justified judgement.

  - id: universal.c1.discourse.structure_extended_discourse
    topic: discourse
    can_do: >-
      Structure an extended spoken or written contribution -- signpost its
      direction, develop points with digression and return, and sustain
      cohesion across a long stretch so the listener or reader can follow
      the overall shape.
    prerequisites:
      - universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_extended_structure
        modality: listening
        task: Follow an extended spoken contribution containing a signposted main line, a relevant digression, and an explicit return, and identify the function of each section.
        success_criteria: Correctly reconstructs the overall direction, the digression, and the point to which the speaker returns without transcript-first support.
      - id: deliver_extended_structure
        modality: speaking
        task: Deliver a sustained contribution that previews its direction, develops two linked points, briefly digresses, explicitly returns to the main line, and closes with a synthesis.
        success_criteria: Produces an intelligible extended contribution whose signposts and cohesive references keep every structural move and its relationship to the main line clear.
      - id: read_extended_structure
        modality: reading
        task: Read an extended text with a digression and identify its roadmap, main points, digression boundary, return signal, and conclusion.
        success_criteria: Correctly maps the text's overall shape and distinguishes its main line from supporting or digressive material.
      - id: write_extended_structure
        modality: writing
        task: Write an extended contribution that announces its direction, develops two connected points, includes a controlled digression and explicit return, and ends by drawing the strands together.
        success_criteria: Produces an accepted cohesive text in which signposting, reference, and paragraph progression make the full structure easy to follow.

  - id: universal.c1.inference.infer_implicit_meaning
    topic: inference
    can_do: >-
      Grasp and convey implicit meaning -- inference, implication, irony, and
      understatement -- recognizing what is meant beyond what is literally
      said.
    prerequisites:
      - universal.c1.discourse.structure_extended_discourse
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: infer_spoken_meaning
        modality: listening
        task: Infer a speaker's intended meaning and attitude from a short exchange using implication, irony, or understatement, citing the contextual cue that reverses or qualifies the literal words.
        success_criteria: Correctly states the intended meaning and attitude and identifies the decisive contextual or prosodic cue without transcript-first support.
      - id: convey_implicit_meaning
        modality: speaking
        task: Respond to a described situation with a contextually appropriate ironic or understated remark, then explain the unstated judgement it conveys.
        success_criteria: Produces an intelligible remark whose intended meaning is recoverable from context and accurately explains the gap between literal wording and intent.
      - id: read_between_the_lines
        modality: reading
        task: Interpret a written passage containing implication, irony, and understatement, distinguishing literal statements from the writer's actual stance.
        success_criteria: Correctly infers each unstated or non-literal meaning and supports it with specific evidence from the passage.
      - id: write_with_implication
        modality: writing
        task: Write a short context and message that convey a critical or sceptical judgement through implication or understatement rather than stating it directly.
        success_criteria: Produces an accepted text whose implicit judgement is clear from contextual cues while the literal wording remains plausibly indirect.

  - id: universal.c1.register.control_tone_and_register_precisely
    topic: register
    can_do: >-
      Exercise fine-grained control of tone and register, shifting between
      formal, diplomatic, ironic, and emphatic styles to suit audience and
      intent with stylistic appropriacy.
    prerequisites:
      - universal.c1.inference.infer_implicit_meaning
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: distinguish_precise_tone
        modality: listening
        task: Distinguish formal, diplomatic, ironic, and emphatic deliveries of comparable content and identify the linguistic cues and intended interpersonal effect of each.
        success_criteria: Correctly labels each tone and explains how at least one specific wording or delivery cue shapes its effect without transcript-first support.
      - id: shift_tone_precisely
        modality: speaking
        task: Deliver the same core message for two contrasting audiences, first diplomatically and then emphatically or ironically as specified.
        success_criteria: Preserves the core content while producing clearly differentiated, audience-appropriate tone through precise lexical, grammatical, and prosodic choices.
      - id: read_tone_and_register
        modality: reading
        task: Compare texts with the same communicative goal but different tones and determine the audience, intent, and stylistic appropriacy of each.
        success_criteria: Correctly matches texts to audience and intent and cites the features that make each register appropriate or inappropriate.
      - id: rewrite_for_tone
        modality: writing
        task: Rewrite a direct message in both a diplomatic formal style and a controlled emphatic or ironic style for specified audiences.
        success_criteria: Produces two accepted versions that preserve meaning while consistently realizing the required tone and register.

  - id: universal.c1.argumentation.concede_and_counter_with_subtlety
    topic: argumentation
    can_do: >-
      Argue with subtlety -- genuinely concede a valid opposing point, then
      qualify or rebut it, weighing competing considerations rather than
      dismissing them.
    prerequisites:
      - universal.c1.register.control_tone_and_register_precisely
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_subtle_counterargument
        modality: listening
        task: Follow an argument that grants a substantive opposing point before qualifying or rebutting it, and identify the weight the speaker assigns to each consideration.
        success_criteria: Correctly distinguishes genuine concession from the final position and explains how the qualification changes the force of the conceded point without transcript-first support.
      - id: concede_and_counter
        modality: speaking
        task: Respond to an opposing position by conceding its strongest valid point, qualifying its scope, and presenting a proportionate counterargument.
        success_criteria: Produces a sustained intelligible response that represents the opposing point fairly and makes the concession, limitation, and resulting judgement explicit.
      - id: read_weighted_argument
        modality: reading
        task: Interpret a nuanced argument and map its concession, qualification, counterevidence, and final weighing of competing considerations.
        success_criteria: Correctly identifies each argumentative move and the basis on which the author reaches the final judgement.
      - id: write_subtle_argument
        modality: writing
        task: Write a paragraph that genuinely concedes one strong objection, narrows or rebuts it with evidence, and weighs it against a competing consideration.
        success_criteria: Produces an accepted coherent argument in which the concession is substantive, the counter is proportionate, and the final judgement follows from the weighing.

  - id: universal.c1.hypothesis.reason_about_counterfactuals
    topic: hypothesis
    can_do: >-
      Reason about unreal and counterfactual situations -- mixed
      conditionals, hypothetical consequences, and regrets -- describing
      how things could or would have been different.
    prerequisites:
      - universal.c1.argumentation.concede_and_counter_with_subtlety
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: follow_counterfactual_reasoning
        modality: listening
        task: Follow a chain of counterfactual reasoning that links a past unreal condition to a present consequence and distinguishes fact, regret, and hypothetical result.
        success_criteria: Correctly reconstructs what actually happened, the unreal alternative, and its stated cross-time consequence without transcript-first support.
      - id: reason_counterfactually
        modality: speaking
        task: Explain how a present situation would differ if a past decision had been different, and add a regret or alternative consequence using a mixed counterfactual construction.
        success_criteria: Produces an intelligible account with consistent time reference and correctly related condition, consequence, and regret.
      - id: read_counterfactual_chain
        modality: reading
        task: Interpret a passage containing mixed and past counterfactuals and identify the real timeline and every hypothetical alternative.
        success_criteria: Correctly separates actual events from unreal conditions and resolves the time reference of each consequence.
      - id: write_counterfactual_analysis
        modality: writing
        task: Write a short analysis of a decision using one past counterfactual, one mixed conditional with a present consequence, and one expression of regret.
        success_criteria: Produces accepted sentences with accurate forms, internally consistent timelines, and logically connected hypothetical consequences.

  - id: universal.c1.idiom.use_idiomatic_and_figurative_language
    topic: idiom
    can_do: >-
      Understand and use idiomatic, collocational, and figurative language
      naturally, choosing register-appropriate idioms and avoiding literal
      calques.
    prerequisites:
      - universal.c1.hypothesis.reason_about_counterfactuals
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: understand_idiomatic_speech
        modality: listening
        task: Interpret idiomatic and figurative expressions in a natural exchange and identify the speaker's intended non-literal meaning and register.
        success_criteria: Correctly paraphrases the expressions in context and distinguishes an idiomatic reading from an implausible literal one without transcript-first support.
      - id: use_idiomatic_speech
        modality: speaking
        task: Describe a familiar situation using two taught idiomatic or strongly collocational expressions appropriate to the conversational setting.
        success_criteria: Uses both expressions naturally, with correct collocation and register, in an intelligible contribution that makes their meanings clear from context.
      - id: read_figurative_language
        modality: reading
        task: Interpret a text containing idiom, metaphor, and marked collocation and explain how each contributes meaning or tone.
        success_criteria: Correctly identifies the contextual meaning and stylistic effect of each expression without relying on literal translation.
      - id: write_idiomatically
        modality: writing
        task: Rewrite literal or calqued sentences as natural target-language prose using appropriate idiomatic or collocational choices.
        success_criteria: Produces accepted natural rewrites that preserve meaning, avoid literal calques, and fit the specified register.

  - id: universal.c1.mediation.mediate_and_synthesize_complex_sources
    topic: mediation
    can_do: >-
      Mediate between sources and audiences -- distill complex or conflicting
      material and relay it accurately and appropriately for a specific
      listener or reader.
    prerequisites:
      - universal.c1.idiom.use_idiomatic_and_figurative_language
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: mediate_spoken_sources
        modality: listening
        task: Listen to two complex or partially conflicting accounts and select the points, qualifications, and unresolved conflict that a specified audience needs.
        success_criteria: Accurately extracts audience-relevant information from both accounts without erasing qualifications or presenting disagreement as consensus.
      - id: relay_for_an_audience
        modality: speaking
        task: Orally relay complex source material to a specified non-specialist audience, condensing it, resolving terminology, and preserving any material disagreement.
        success_criteria: Produces an accurate, intelligible, audience-appropriate mediation that covers essential points, explains necessary concepts, and represents conflict fairly.
      - id: read_for_mediation
        modality: reading
        task: Read two dense sources and determine what must be retained, explained, or omitted when relaying them to a named audience with a specific purpose.
        success_criteria: Correctly prioritizes audience-relevant claims, retains decisive caveats, and identifies terminology requiring explanation.
      - id: write_a_mediation
        modality: writing
        task: Write an audience-specific briefing that synthesizes two complex or conflicting sources in accessible language while preserving attribution and uncertainty.
        success_criteria: Produces an accepted concise briefing that is accurate, appropriately adapted, and explicit about material agreement, conflict, and limitations.

  - id: universal.c1.persuasion.persuade_with_rhetorical_devices
    topic: persuasion
    can_do: >-
      Persuade an audience using rhetorical devices -- rhetorical questions,
      parallelism, emphasis, and appeals -- modulating stance and intensity to
      move the listener or reader.
    prerequisites:
      - universal.c1.mediation.mediate_and_synthesize_complex_sources
    modalities: [listening, speaking, reading, writing]
    assessment_requirements:
      - id: analyze_spoken_persuasion
        modality: listening
        task: Identify rhetorical questions, parallelism, emphasis, and audience appeals in a persuasive speech and explain how each is intended to influence the audience.
        success_criteria: Correctly locates the devices, distinguishes their functions, and identifies shifts in stance or intensity without transcript-first support.
      - id: deliver_persuasive_appeal
        modality: speaking
        task: Deliver a short persuasive appeal using a rhetorical question, a parallel structure, deliberate emphasis, and an audience-appropriate appeal while modulating intensity.
        success_criteria: Produces a coherent, intelligible appeal in which all four devices are recognizable, purposeful, and suited to the audience.
      - id: read_rhetorical_strategy
        modality: reading
        task: Analyze a persuasive text and identify how its rhetorical devices, appeals, and changes in intensity advance its central call to action.
        success_criteria: Correctly links specific devices to their persuasive function and distinguishes the central appeal from supporting rhetoric.
      - id: write_persuasively
        modality: writing
        task: Write a persuasive text for a specified audience that includes a rhetorical question, parallelism, controlled emphasis, and a clear appeal or call to action.
        success_criteria: Produces an accepted cohesive text whose required devices reinforce rather than obscure its argument and whose intensity fits the audience and purpose.
