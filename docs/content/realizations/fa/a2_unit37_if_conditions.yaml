  notes: 'Spine outcome: universal.a2.conditions.talk_about_real_conditions. Grammar target: real (possible) conditions only, with اگه plus the subjunctive (اگه بارون بیاد، اگه وقت داشته باشم) or the present (اگه بارون میاد), a present result (نمی‌ریم، میام), negative conditions (اگه بارون نیاد، اگه نیای), the question اگه ... چی؟, and the contrast between a possible condition (اگه) and a time clause (وقتی). No unreal or counterfactual conditions. Register: casual spoken Tehrani Persian; polite شما only in shop-policy sentences addressed to customers. Characters: established friends Sara and Nima only; grep of realizations/fa found Sara as the teacher and Nima as the engineer in the A2 units and as friends in A1 weather and shopping scenes; no job, family or other facts are asserted here. The unit delivers listening, speaking, reading, and a culminating written pair of condition-plus-result sentences. Authored without opening any prs file. NATIVE QUESTIONS: (1) Is the present indicative after اگه (اگه فردا بارون میاد، تو خونه می‌مونیم) natural enough to be taught as an alternative to the subjunctive (اگه بارون بیاد), or should only the subjunctive be shown? Recommended: keep it as a recognition-only note and produce only the subjunctive. (2) Is اگه رسید داشته باشید، پولتون رو پس می‌دیم the natural spoken shop phrasing for a refund, and is اگه رسید نداشته باشید، پول پس نمی‌دیم natural without رو? Recommended: keep both. (3) Is عوضش می‌کنیم the best spoken way for a shop to say “we will exchange it”, or is عوض می‌کنیم / تعویضش می‌کنیم preferable? Recommended: عوضش می‌کنیم. (4) Is اگه نمی‌تونی بیای، بهم زنگ بزن natural for “if you cannot come, call me”, or would اگه نتونی بیای be more usual? Recommended: keep نمی‌تونی بیای.'
