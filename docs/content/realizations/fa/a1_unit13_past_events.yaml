            target: {text: "دیروز به سینما رفتم. یک فیلم خوب دیدم. بعد ناهار خوردم", language_code: fa, direction: rtl}
            introduced_tokens: [یک, بعد, ناهار]
          - content_key: fa.a1.unit13.lesson04.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a1.unit13.lesson04.exercise01.reading_comprehension_what_saw
            type: reading_comprehension
            tested_text: "فیلم خوب"
            prompt:
              target_blocks:
                - {text: "دیروز به سینما رفتم. یک فیلم خوب دیدم. بعد ناهار خوردم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit13.lesson04.exercise02.match_reading_facts
            type: matching_pairs
            tested_text: "فیلم خوب یک بعد ناهار"
            prompt: {target_blocks: []}
            pairs:
              - {left: "یک فیلم خوب دیدم", right: "saw a good movie"}
              - {left: "ناهار خوردم", right: "ate lunch"}
              - {left: فیلم, right: movie}
              - {left: خوب, right: good}
              - {left: ناهار, right: lunch}
              - {left: بعد, right: after}
          - content_key: fa.a1.unit13.lesson04.exercise03.order_good_movie
            type: word_order
            tested_text: "یک فیلم خوب دیدم"
            prompt: {target_blocks: [{text: "I saw a good movie.", language_code: en, direction: ltr}]}
            word_bank: [یک, فیلم, خوب, دیدم]
          - content_key: fa.a1.unit13.lesson04.exercise04.translate_ate_lunch
            type: translation
            tested_text: "ناهار خوردم"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit13.lesson05.writing_about_a_recent_event
        title: نوشتن درباره اتفاق اخیر
        spine_outcome_id: universal.a1.past_events.describe_recent_event
