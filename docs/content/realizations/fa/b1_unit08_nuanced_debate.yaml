generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked the local
    `.firecrawl/` cache before writing (per standing instruction, since
    Firecrawl reports 402/credits-exhausted on the live network) -- no
    cached material relevant to a concessive/nuanced-argument construction
    was found there, and the FSI Persian Basic Course is separately
    confirmed beginner-only (see every prior fa B1 unit's own provenance
    note). Authored from general Persian grammar knowledge.

    This is fa's EIGHTH B1 unit, the second of the "second wave" (only the
    outcome id was reused from en-nl's own second-wave course -- verified
    verbatim against universal_spine.yaml -- never nl's actual content;
    no nl file was opened while authoring this one).

    Grammar target: CONCESSIVE subordination -- هرچند (although) and با
    اینکه (even though) each introducing a concessive clause, paired with
    a STRONGER contrastive connector than the plain ولی already taught in
    unit04's debate: در عین حال ("nevertheless" / "at the same time") and
    با این حال ("still" / "however"), used to link two independent
    clauses rather than subordinate one to the other. This is genuinely
    distinct from unit04's own construction (enclitic pronoun فused onto
    an adjective -- موافقم/مخالفم -- plus a که-clause reporting a
    THOUGHT, فکر می‌کنم که...): unit04 taught how to STATE a stance and a
    reason; this unit teaches how to concede a point on the other side
    before restating that same stance, real B1 argumentative nuance
    rather than simple agree/disagree.

    Continues unit04's established دورکاری (remote work) debate and its
    two participants -- رضا (pro-remote-work) and نرگس (skeptical) --
    rather than starting a new topic or new characters, since a nuanced
    debate genuinely benefits from being a continuation of an established
    position rather than a fresh one invented from nothing. Neither
    character's established stance from unit04 is contradicted: رضا still
    favors دورکاری overall, نرگس still has real reservations -- this unit
    adds NUANCE (each concedes one real point) without reversing either
    position, which is exactly what the outcome itself asks for ("concede
    a valid point... before restating your own position").

    All vocabulary is introduced self-contained within this file (the
    established per-file convention) -- even ولی, already taught in
    several other fa files, is redeclared here since it appears in
    example contrast with the new stronger connectors.

    Character-cast continuity: reuses رضا and نرگس, both established
    since unit04 (confirmed via grep against the fa corpus before
    writing); no new character introduced. No nl or other sibling-
    direction file was opened while authoring this one.

    Lessons 01-02 drill هرچند and با اینکه as the two concessive
    connectors (each with its own 1st/3rd-person example pair, since
    concession is a subordination pattern rather than a person-agreement
    paradigm -- the "all persons" drill structure of unit01-03/07 doesn't
    apply the same way here, so lesson02 instead drills the SECOND
    connector rather than repeating persons); lesson03 introduces the
    stronger contrastive connectors (در عین حال / با این حال) used
    independently of a concessive clause, plus a combined example using
    both halves together; lesson04 is a dialogue in which رضا and نرگس
    each make one nuanced, concession-then-restatement point; lesson05 is
    a third-person reading summarizing the nuanced debate; lesson06 is
    production-only wrap-up -- the same six-lesson arc established across
    every prior fa B1 unit, adapted for a subordination-family grammar
    target rather than a person-conjugation paradigm.
review:
  status: unreviewed
  required_next_reviewer: null
  notes: null

course:
  realization_key: fa.b1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken colloquial register
    used throughout fa units 01-57 and B1 units 01-07. هرچند، با اینکه، در
    عین حال، and با این حال are all register-neutral connectors, equally
    natural in casual spoken debate and more formal writing, so no special
    register marking is needed for this unit's between-friends debate
    scene.

