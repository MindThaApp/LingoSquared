schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "FSI Persian Basic Course (public domain), scope/register adapted; three separate attempts this pass (livelingua.com/fsi, livelingua.com/project/fsi/persian/farsi, fsi-language-courses.org/persian) each returned only page-level descriptions (course exists, 398pg/24 audio), not fetchable lesson text -- authored using this project's own established fa register/character conventions instead, per docs/content/AUTHORING_GUIDE.md's modernization standard, same honest-disclosure pattern as fa unit21."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude, zero access to the original
    authoring reasoning) found NO real bugs in this unit -- checked and
    confirmed clean: no same-speaker listen_select/dialogue_response
    distractor collisions (lesson06's dialogue_response_confirm distractors
    ["نه، نمیام.", "کجاست؟", "پول ندارم."] are invented plausible answers,
    none matching a line علی actually says elsewhere in the dialogue; the
    compiler's own validate_same_speaker_dialogue_distractors check passed
    with 0 errors); no stray unquoted YAML booleans; every exercise type
    used (multiple_choice, matching_pairs, word_order, translation,
    writing_prompt, speak_response, dialogue_comprehension,
    dialogue_response) is registered in ExerciseRenderer.tsx;
    matching_pairs/word_order answer shapes are correct and consistent; no
    internal jargon leaks; the meeting time/place (فردا ساعت چهار، کافه)
    is mutually consistent across lesson04's teaching card, its exercises,
    and lesson06's dialogue and summary-writing exercise; the میرن (they
    go) grammar note is properly taught via its own introduced_tokens
    before exercise07 requires composing a sentence with it; Farsi register
    and script read correctly throughout. Re-validated clean standalone
    and as part of the full fa units 21-26 batch: 0 errors/0 warnings.

    Original draft note (2026-07-07, Sonnet 5 fork, during a Codex
    usage-limit outage): realizes universal.a1.communication.basic_phone_contact
    (prerequisite: universal.a1.introductions.exchange_identity, already
    covered by fa unit01/02). Scoped to: answering/placing a basic phone
    call, asking someone to repeat or speak slowly, reading a short text
    message, and ending a call politely. Reuses the established علی/نرگس
    cast from unit01 rather than introducing new characters, since this is
    a personal (not transactional) call between two people who already
    know each other.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken register and the
    colloquial -e contraction pattern and می‌خوام forms used throughout
    fa A1 units 01-21.

