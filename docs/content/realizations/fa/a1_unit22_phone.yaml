        spine_outcome_id: universal.a1.communication.basic_phone_contact
        teaching:
          - content_key: fa.a1.unit22.lesson01.teach.phone_word
            kind: vocabulary
            target: {text: تلفن, language_code: fa, direction: rtl}
            introduced_tokens: [تلفن]
            example: {text: "تلفنم کجاست؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit22.lesson01.teach.message_word
            kind: vocabulary
            target: {text: پیام, language_code: fa, direction: rtl}
            introduced_tokens: [پیام]
            example: {text: "یه پیام دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit22.lesson01.teach.call_word
            kind: vocabulary
            target: {text: "زنگ زدن", language_code: fa, direction: rtl}
            introduced_tokens: [زنگ, زدن]
            example: {text: "بهم زنگ بزن.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit22.lesson01.teach.voice_word
            kind: vocabulary
            target: {text: صدا, language_code: fa, direction: rtl}
            introduced_tokens: [صدا]
            example: {text: "صدات خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit22.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a1.unit22.lesson01.exercise01.recognize_phone
            type: multiple_choice
            tested_text: تلفن
            prompt: {target_blocks: [{text: تلفن, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit22.lesson01.exercise02.recognize_message
            type: multiple_choice
            tested_text: پیام
            prompt: {target_blocks: [{text: پیام, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit22.lesson01.exercise03.recognize_call_reading
            type: multiple_choice
            tested_text: "زنگ زدن"
            prompt: {target_blocks: [{text: "زنگ زدن", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit22.lesson01.exercise04.match_phone_words
            type: matching_pairs
            tested_text: "تلفن پیام زنگ زدن صدا"
            prompt: {target_blocks: []}
            pairs:
              - {left: تلفن, right: phone}
              - {left: پیام, right: message}
              - {left: "زنگ زدن", right: "to call"}
              - {left: صدا, right: voice}
          - content_key: fa.a1.unit22.lesson01.exercise05.order_phone_words
            type: word_order
            tested_text: "تلفن و پیام"
            prompt: {target_blocks: []}
            word_bank: [تلفن, و, پیام]
          - content_key: fa.a1.unit22.lesson01.exercise06.translate_message
            type: translation
            tested_text: پیام
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit22.lesson01.exercise07.write_phone
            type: writing_prompt
            tested_text: تلفن
            prompt: {target_blocks: []}

