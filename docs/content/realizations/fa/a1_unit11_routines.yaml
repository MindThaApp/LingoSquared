review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, fa's next uncovered outcome (prerequisite: universal.a1.time.ask_tell_time, covered in unit09). Numbered unit11 (unit09=time, unit10=dates already taken). Six lessons: daily routine verbs, describing a routine with times, parts of the day (reused from unit09), reading a short routine text, a fill-in style writing task, and a dialogue comparing two people's routines. Reuses unit09's time vocabulary (ساعت، صبح، ظهر، عصر، شب) and colloquial -e contraction pattern (بیدار می‌شم) exactly as established, rather than re-teaching or diverging from it. Authored independently of the prs/nl/en realizations per the sibling-isolation rule. Proactively cross-checked the routine's stated times for internal consistency across all lessons per AUTHORING_GUIDE §11. Audio remains pending generation. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, discovered this unit was missed by the earlier project-wide audit -- it was authored but never actually reviewed): found 3 exercises (lesson01.exercise03, lesson02.exercise01, lesson06.exercise05) were listen_select/listen_type items -- genuinely unanswerable since fa has zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (visible Farsi prompt, English glosses), listen_type -> translation. MATCHING_PAIRS SCALE (§16) CHECK: match_verbs (4, lesson01's own routine phrases, no earlier lesson to pool from -- genuine ceiling) left unchanged; match_day_parts (10), match_comparison_phrases (9), and match_dialogue_facts (8) were already reasonably sized. Re-verified 0 remaining §14 violations, validate+compile both clean. STILL NEEDS the standing fresh-context review before status can move to reviewed -- dispatching now. POST-REVIEW FOLLOW-UP FIX, 2026-07-07: unit13's fresh-context reviewer flagged (out of scope for its own unit13-only review) that this unit still had 13 exercises where realization prompt.target_blocks duplicated this overlay's own instruction text verbatim in English -- fixed by emptying target_blocks for self-directed/scenario prompts (write_sleep, recognize_answer, speak_ask_wake_time, write_own_wake_time, write_night_routine, write_own_routine_sentence, speak_ask_what_about_you, recognize_saras_wake_time, write_routine_summary, speak_full_routine_scene) and substituting the actual Farsi reading passage as target_blocks for the 3 reading_comprehension/multiple_choice exercises about it (read_wake_time, read_first_activity_after_waking, choose_second_activity), matching the established convention from unit13's own fix. Re-verified validate+compile clean (0 errors/0 warnings) and confirmed zero remaining instruction-duplicate target_blocks via a script comparing every exercise's target_blocks against its overlay instruction.

    FRESH-CONTEXT REVIEW, 2026-07-06 (zero prior access to this unit's authoring reasoning, per AUTHORING_GUIDE §9): confirmed spine-outcome discipline (every lesson genuinely serves universal.a1.routines.describe_daily_routine, no drift) and recognition->drag->production exercise pacing in all 6 lessons; grepped clean for Arabic-range kaf/yeh (script is pure Persian range); found zero internal-jargon leaks; confirmed the §14 audio-accessibility retrofit and the prompt-shows-answer retrofit were both done correctly by spot-checking the actual compiled JSON, not just the source YAML. Found and fixed one real dialect-authenticity bug (§3): میرم سرکار (glued) is a different word from the intended idiom -- سرکار as one word means an honorific/boss address term (\"sarkar khanum\"), while سر کار (two words) is the actual idiom for \"at/to work\" -- confirmed against unit09's own already-shipped, already-reviewed text, which correctly writes سر کار with a space; fixed all ~20 occurrences across both files (teaching text, tested_text, prompts, pairs, word_bank, media_assets) and correctly split the introduced_tokens/word_bank list entries into separate سر/کار tokens rather than one two-word entry, matching this file's own established single-word-per-token convention (e.g. هر/روز). Wrote and ran a Python script tokenizing on Persian-range Unicode codepoints only (excluding Arabic punctuation, which a first draft of the script wrongly included, producing false positives exactly like the ones unit09's own review notes describe) to check every exercise's tested_text and the overlay's accepted_answers/pairs/word_bank against cumulative introduced_tokens (unit09's tokens counted as legitimate prior-unit vocabulary, since unit09 precedes unit11 in this course's numbering and its outcome is unit11's own declared spine prerequisite); found and fixed one real untaught-vocabulary bug beyond the checklist's literal scope (a distractor, not accepted-answer data, but still learner-facing): lesson06.exercise02's distractor ساعت شش (six) was never taught anywhere in unit09 or unit11 -- replaced with the already-taught ساعت چهار. Also found and fixed lesson02.exercise02's distractor تو چی؟ was used three lessons before تو/چی are actually taught in lesson05 -- replaced with the already-taught میرم سر کار. Independently re-verified the unit's own §11 fact-cross-check claim by tracing every stated time across every lesson/exercise/dialogue turn (generic \"I\": wakes at 7, sleeps at 11; dialogue: Nima wakes at 7, Sara wakes at 8 (\"a little later\", correctly later than 7) and sleeps at 11) -- fully consistent, no contradictions found. Found and fixed 5 §12 multi-clause gaps: lesson04.exercise06, lesson06.exercise06, lesson06.exercise07, and lesson06.exercise08 each had only 2 of the 3 required joining forms (missing comma-joined); lesson06.exercise05's translate_night_routine had only one Farsi variant (with هم) for an English prompt that doesn't require it -- added a without-هم variant since both are equally valid translations of the given English sentence. Attempted a §16 matching_pairs expansion of match_verbs (pooling unit09's already-taught time words) but reverted it after discovering the compiler's actual untaught-vocabulary validator (validate_untaught_vocabulary in scripts/compile_content.py) checks tested_text against introduced_tokens strictly within the SAME realization file, not across files -- confirming the original note's \"genuine ceiling\" claim was correct for tested_text purposes even though unit09's vocabulary is otherwise fair game for pairs/word_bank/distractors. Removed a redundant, unused unit-level spine_outcome_id singular field (unit09's reference file only has the spine_outcome_ids list; the compiler only reads the list form for units). Applied the AUTHORING_GUIDE §15 target-language-asterisk convention to the feedback strings actually rewritten during this pass (not a blanket retrofit). Confirmed content_key parity exact in both directions (20 teaching + 39 exercise keys) via a Python script, not by eye. Re-ran both validate and the actual compile (not just validate) after every fix: 0 errors, 0 warnings, valid JSON, and spot-checked the compiled output directly for every fix (سر کار spacing, both distractor replacements, and all three joining-form variants for every §12 fix) to confirm each landed in the real compiled exercise data, not just that the schema validated.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 8 kind:vocabulary teaching cards (the merged 4-part-of-day card given a 4-item list per §19's merged-card guidance), each a natural, comprehensible-from-gloss sentence using the card's own word(s). schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    2026-07-07: FRESH-CONTEXT REVIEW of the §19 retrofit examples specifically (zero prior access to the retrofit's own authoring reasoning, scoped narrowly to the new example/example_gloss fields per the standing task, not a re-review of the unit's already-settled spine outcome/exercises/dialogue). Reviewed all 8 vocabulary cards' example sentences (11 sentences total counting the 4-item parts-of-day list) against: natural colloquial Tehrani register match with this file's own established exercises, presence of the card's own word, genuine multi-word sentence structure, comprehensibility from the English gloss alone, non-identity with the card's own target text, gloss translation accuracy, Persian-range script purity (grepped clean, no Arabic kaf/yeh), and fact-consistency against this unit's own dialogue (generic \"I\" wakes 7/sleeps 11; Nima wakes 7, Sara wakes 8/sleeps 11 -- every new example checked against these, no contradictions found). No real problems found; all 8 cards' examples were already sound. Re-ran validate+compile after the sibling units' fixes (this file itself unchanged): 0 errors/0 warnings, valid JSON.

    Review 2026-10-21 (en-fa A1 language review r1): 0 fixes in this file (Persian text, ZWNJ, script and fact consistency re-checked; the exercise-prompt fixes live in the overlay). NATIVE FLAGS: none."

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern
    (بیدار می‌شم rather than the more formal بیدار می‌شوم) and reuses
    unit09's time-of-day vocabulary (صبح، ظهر، عصر، شب) and و (and) token
    exactly as already introduced there.

media_assets:
  - content_key: fa.a1.audio.routines.verbs.01
    language: fa
    text: بیدار می‌شم، صبحونه می‌خورم، میرم سر کار، می‌خوابم
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.routines.question.01
    language: fa
    text: ساعت چند بیدار می‌شی؟
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: fa.a1.audio.routines.description.01
    language: fa
    text: هر روز ساعت هفت بیدار می‌شم. بعدش صبحونه می‌خورم و میرم سر کار.
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.dialogue.daily_routine.01
    language: fa
    text: "سارا: تو هر روز ساعت چند بیدار می‌شی؟ نیما: ساعت هفت بیدار می‌شم. تو چی؟ سارا: من یه‌کم دیرتر، ساعت هشت. نیما: بعد از بیدار شدن چیکار می‌کنی؟ سارا: صبحونه می‌خورم و میرم سر کار. شب‌ها هم معمولاً ساعت یازده می‌خوابم."
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit11.routines
    title: توصیف برنامهٔ روزانه
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.routines.describe_daily_routine
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit11.lesson01.routine_verbs
        title: فعل‌های برنامهٔ روزانه
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: fa.a1.unit11.lesson01.teach.bidar_misham
            kind: vocabulary
            target: {text: "بیدار می‌شم", language_code: fa, direction: rtl}
            introduced_tokens: [بیدار, می‌شم]
            example: {text: "من هر روز ساعت هفت بیدار می‌شم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit11.lesson01.teach.sobhune_mikhoram
            kind: vocabulary
            target: {text: "صبحونه می‌خورم", language_code: fa, direction: rtl}
            introduced_tokens: [صبحونه, می‌خورم]
            example: {text: "صبحونه می‌خورم و میرم سر کار.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit11.lesson01.teach.miram_sarkar
            kind: vocabulary
            target: {text: "میرم سر کار", language_code: fa, direction: rtl}
            introduced_tokens: [میرم, سر, کار]
            example: {text: "بعدش میرم سر کار.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit11.lesson01.teach.mikhabam
            kind: vocabulary
            target: {text: "می‌خوابم", language_code: fa, direction: rtl}
            introduced_tokens: [می‌خوابم]
            example: {text: "شب زود می‌خوابم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit11.lesson01.teach.va_word
            kind: vocabulary
            target: {text: و, language_code: fa, direction: rtl}
            introduced_tokens: [و]
            example: {text: "بیدار می‌شم و صبحونه می‌خورم.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit11.lesson01.exercise01.recognize_bidar_misham
            type: multiple_choice
            tested_text: بیدار می‌شم
            prompt: {target_blocks: [{text: "بیدار می‌شم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson01.exercise02.recognize_mikhabam
            type: multiple_choice
            tested_text: می‌خوابم
            prompt: {target_blocks: [{text: می‌خوابم, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson01.exercise03.recognize_miram_sarkar_reading
            type: multiple_choice
            tested_text: میرم سر کار
            prompt: {target_blocks: [{text: "میرم سر کار", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson01.exercise04.match_verbs
            type: matching_pairs
            tested_text: "بیدار می‌شم صبحونه می‌خورم میرم سر کار می‌خوابم"
            prompt: {target_blocks: []}
            pairs:
              - {left: "بیدار می‌شم", right: "I wake up"}
              - {left: "صبحونه می‌خورم", right: "I eat breakfast"}
              - {left: "میرم سر کار", right: "I go to work"}
              - {left: می‌خوابم, right: "I go to sleep"}
          - content_key: fa.a1.unit11.lesson01.exercise05.order_routine_sequence
            type: word_order
            tested_text: "بیدار می‌شم صبحونه می‌خورم"
            prompt: {target_blocks: []}
            word_bank: ["بیدار می‌شم", "صبحونه می‌خورم"]
          - content_key: fa.a1.unit11.lesson01.exercise06.translate_go_to_work
            type: translation
            tested_text: میرم سر کار
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson01.exercise07.write_sleep
            type: writing_prompt
            tested_text: می‌خوابم
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit11.lesson02.routine_with_times
        title: برنامهٔ روزانه با ساعت
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
