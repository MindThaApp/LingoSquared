schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "FSI Persian Basic Course (public domain), modernized"
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: claude
  notes: "New unit, fa's next uncovered outcome (prerequisite: universal.a1.time.ask_tell_time, covered in unit09). Numbered unit11 (unit09=time, unit10=dates already taken). Six lessons: daily routine verbs, describing a routine with times, parts of the day (reused from unit09), reading a short routine text, a fill-in style writing task, and a dialogue comparing two people's routines. Reuses unit09's time vocabulary (ساعت، صبح، ظهر، عصر، شب) and colloquial -e contraction pattern (بیدار می‌شم) exactly as established, rather than re-teaching or diverging from it. Authored independently of the prs/nl/en realizations per the sibling-isolation rule. Proactively cross-checked the routine's stated times for internal consistency across all lessons per AUTHORING_GUIDE §11. Audio remains pending generation."

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern
    (بیدار می‌شم rather than the more formal بیدار می‌شوم) and reuses
    unit09's time-of-day vocabulary (صبح، ظهر، عصر، شب) and و (and) token
    exactly as already introduced there.

media_assets:
  - content_key: fa.a1.audio.routines.verbs.01
    language: fa
    text: بیدار می‌شم، صبحونه می‌خورم، میرم سرکار، می‌خوابم
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.routines.question.01
    language: fa
    text: ساعت چند بیدار می‌شی؟
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: fa.a1.audio.routines.description.01
    language: fa
    text: هر روز ساعت هفت بیدار می‌شم. بعدش صبحونه می‌خورم و میرم سرکار.
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.dialogue.daily_routine.01
    language: fa
    text: "سارا: تو هر روز ساعت چند بیدار می‌شی؟ نیما: ساعت هفت بیدار می‌شم. تو چی؟ سارا: من یه‌کم دیرتر، ساعت هشت. نیما: بعد از بیدار شدن چیکار می‌کنی؟ سارا: صبحونه می‌خورم و میرم سرکار. شب‌ها هم معمولاً ساعت یازده می‌خوابم."
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit11.routines
    title: توصیف برنامهٔ روزانه
    section: reading_writing
    spine_outcome_id: universal.a1.routines.describe_daily_routine
    spine_outcome_ids:
      - universal.a1.routines.describe_daily_routine
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit11.lesson01.routine_verbs
        title: فعل‌های برنامهٔ روزانه
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: fa.a1.unit11.lesson01.teach.bidar_misham
            kind: vocabulary
            target: {text: "بیدار می‌شم", language_code: fa, direction: rtl}
            introduced_tokens: [بیدار, می‌شم]
          - content_key: fa.a1.unit11.lesson01.teach.sobhune_mikhoram
            kind: vocabulary
            target: {text: "صبحونه می‌خورم", language_code: fa, direction: rtl}
            introduced_tokens: [صبحونه, می‌خورم]
          - content_key: fa.a1.unit11.lesson01.teach.miram_sarkar
            kind: vocabulary
            target: {text: "میرم سرکار", language_code: fa, direction: rtl}
            introduced_tokens: [میرم, سرکار]
          - content_key: fa.a1.unit11.lesson01.teach.mikhabam
            kind: vocabulary
            target: {text: "می‌خوابم", language_code: fa, direction: rtl}
            introduced_tokens: [می‌خوابم]
          - content_key: fa.a1.unit11.lesson01.teach.va_word
            kind: vocabulary
            target: {text: و, language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a1.unit11.lesson01.exercise01.recognize_bidar_misham
            type: multiple_choice
            tested_text: بیدار می‌شم
            prompt: {target_blocks: [{text: "بیدار می‌شم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson01.exercise02.recognize_mikhabam
            type: multiple_choice
            tested_text: می‌خوابم
            prompt: {target_blocks: [{text: می‌خوابم, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson01.exercise03.listen_verbs
            type: listen_select
            tested_text: میرم سرکار
            media_asset_key: fa.a1.audio.routines.verbs.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson01.exercise04.match_verbs
            type: matching_pairs
            tested_text: "بیدار می‌شم صبحونه می‌خورم میرم سرکار می‌خوابم"
            prompt: {target_blocks: []}
            pairs:
              - {left: "بیدار می‌شم", right: "I wake up"}
              - {left: "صبحونه می‌خورم", right: "I eat breakfast"}
              - {left: "میرم سرکار", right: "I go to work"}
              - {left: می‌خوابم, right: "I go to sleep"}
          - content_key: fa.a1.unit11.lesson01.exercise05.order_routine_sequence
            type: word_order
            tested_text: "بیدار می‌شم صبحونه می‌خورم"
            prompt: {target_blocks: []}
            word_bank: ["بیدار می‌شم", "صبحونه می‌خورم"]
          - content_key: fa.a1.unit11.lesson01.exercise06.translate_go_to_work
            type: translation
            tested_text: میرم سرکار
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson01.exercise07.write_sleep
            type: writing_prompt
            tested_text: می‌خوابم
            prompt: {target_blocks: [{text: "Write the Persian phrase for 'I go to sleep'.", language_code: en, direction: ltr}]}

      - content_key: fa.a1.unit11.lesson02.routine_with_times
        title: برنامهٔ روزانه با ساعت
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: fa.a1.unit11.lesson02.teach.che_saat_bidar
            kind: phrase
            target: {text: "ساعت چند بیدار می‌شی؟", language_code: fa, direction: rtl}
            introduced_tokens: [ساعت, چند, بیدار, می‌شی]
          - content_key: fa.a1.unit11.lesson02.teach.saat_haft_bidar
            kind: phrase
            target: {text: "ساعت هفت بیدار می‌شم", language_code: fa, direction: rtl}
            introduced_tokens: [هفت]
          - content_key: fa.a1.unit11.lesson02.teach.har_ruz
            kind: vocabulary
            target: {text: "هر روز", language_code: fa, direction: rtl}
            introduced_tokens: [هر, روز]
        exercises:
          - content_key: fa.a1.unit11.lesson02.exercise01.listen_question
            type: listen_select
            tested_text: ساعت چند بیدار می‌شی
            media_asset_key: fa.a1.audio.routines.question.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson02.exercise02.recognize_answer
            type: multiple_choice
            tested_text: ساعت هفت بیدار می‌شم
            prompt: {target_blocks: [{text: "Someone asks what time you wake up, and you wake up at seven. What do you say?", language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit11.lesson02.exercise03.order_har_ruz_bidar
            type: word_order
            tested_text: "هر روز ساعت هفت بیدار می‌شم"
            prompt: {target_blocks: []}
            word_bank: [هر, روز, ساعت, هفت, بیدار, می‌شم]
          - content_key: fa.a1.unit11.lesson02.exercise04.translate_what_time_wake
            type: translation
            tested_text: ساعت چند بیدار می‌شی
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson02.exercise05.speak_ask_wake_time
            type: speak_response
            tested_text: ساعت چند بیدار می‌شی
            prompt: {target_blocks: [{text: "Ask a friend what time they wake up every day.", language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit11.lesson02.exercise06.write_own_wake_time
            type: writing_prompt
            tested_text: "هر روز ساعت هفت بیدار می‌شم"
            prompt: {target_blocks: [{text: "Write that you wake up at seven every day.", language_code: en, direction: ltr}]}

      - content_key: fa.a1.unit11.lesson03.parts_of_the_day_review
        title: بخش‌های روز (مرور)
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: fa.a1.unit11.lesson03.teach.bad
            kind: vocabulary
            target: {text: بعدش, language_code: fa, direction: rtl}
            introduced_tokens: [بعدش]
          - content_key: fa.a1.unit11.lesson03.teach.parts_of_day
            kind: vocabulary
            target: {text: "صبح، ظهر، عصر، شب", language_code: fa, direction: rtl}
            introduced_tokens: [صبح, ظهر, عصر, شب]
          - content_key: fa.a1.unit11.lesson03.teach.night_routine
            kind: phrase
            target: {text: "شب‌ها ساعت یازده می‌خوابم", language_code: fa, direction: rtl}
            introduced_tokens: [شب‌ها, یازده]
        exercises:
          - content_key: fa.a1.unit11.lesson03.exercise01.recognize_bad
            type: multiple_choice
            tested_text: بعدش
            prompt: {target_blocks: [{text: بعدش, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson03.exercise02.recognize_night_routine
            type: multiple_choice
            tested_text: "شب‌ها ساعت یازده می‌خوابم"
            prompt: {target_blocks: [{text: "شب‌ها ساعت یازده می‌خوابم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson03.exercise03.match_day_parts
            type: matching_pairs
            tested_text: صبح ظهر عصر شب بعدش
            prompt: {target_blocks: []}
            pairs:
              - {left: صبح, right: morning}
              - {left: ظهر, right: noon}
              - {left: عصر, right: afternoon}
              - {left: شب, right: night}
              - {left: بعدش, right: "after that"}
          - content_key: fa.a1.unit11.lesson03.exercise04.order_night_sleep
            type: word_order
            tested_text: "شب‌ها ساعت یازده می‌خوابم"
            prompt: {target_blocks: []}
            word_bank: [شب‌ها, ساعت, یازده, می‌خوابم]
          - content_key: fa.a1.unit11.lesson03.exercise05.translate_after_that
            type: translation
            tested_text: بعدش
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson03.exercise06.write_night_routine
            type: writing_prompt
            tested_text: "شب‌ها ساعت یازده می‌خوابم"
            prompt: {target_blocks: [{text: "Write that you go to sleep at eleven at night.", language_code: en, direction: ltr}]}

      - content_key: fa.a1.unit11.lesson04.reading_a_routine
        title: خواندن یک برنامهٔ روزانه
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: fa.a1.unit11.lesson04.teach.routine_text
            kind: reading
            target: {text: "هر روز ساعت هفت بیدار می‌شم. بعدش صبحونه می‌خورم و میرم سرکار.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit11.lesson04.exercise01.read_wake_time
            type: reading_comprehension
            tested_text: هفت
            prompt: {target_blocks: [{text: "What time does the writer wake up?", language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit11.lesson04.exercise02.read_first_activity_after_waking
            type: reading_comprehension
            tested_text: صبحونه می‌خورم
            prompt: {target_blocks: [{text: "What does the writer do right after waking up?", language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit11.lesson04.exercise03.choose_second_activity
            type: multiple_choice
            tested_text: میرم سرکار
            prompt: {target_blocks: [{text: "What does the writer do after breakfast?", language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit11.lesson04.exercise04.order_reading_summary
            type: word_order
            tested_text: "بعدش صبحونه می‌خورم و میرم سرکار"
            prompt: {target_blocks: []}
            word_bank: [بعدش, صبحونه, می‌خورم, و, میرم, سرکار]
          - content_key: fa.a1.unit11.lesson04.exercise05.translate_routine_text
            type: translation
            tested_text: "هر روز ساعت هفت بیدار می‌شم"
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson04.exercise06.write_own_routine_sentence
            type: writing_prompt
            tested_text: "هر روز ساعت هفت بیدار می‌شم. بعدش صبحونه می‌خورم و میرم سرکار."
            prompt: {target_blocks: [{text: "Write two sentences describing your own morning routine, using هر روز and بعدش.", language_code: en, direction: ltr}]}

      - content_key: fa.a1.unit11.lesson05.comparing_routines
        title: مقایسهٔ برنامه‌های روزانه
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: fa.a1.unit11.lesson05.teach.tow_chi
            kind: phrase
            target: {text: "تو چی؟", language_code: fa, direction: rtl}
            introduced_tokens: [تو, چی]
          - content_key: fa.a1.unit11.lesson05.teach.yekam_dirtar
            kind: phrase
            target: {text: "یه‌کم دیرتر", language_code: fa, direction: rtl}
            introduced_tokens: [یه‌کم, دیرتر]
        exercises:
          - content_key: fa.a1.unit11.lesson05.exercise01.recognize_tow_chi
            type: multiple_choice
            tested_text: تو چی
            prompt: {target_blocks: [{text: "تو چی؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson05.exercise02.recognize_yekam_dirtar
            type: multiple_choice
            tested_text: یه‌کم دیرتر
            prompt: {target_blocks: [{text: "یه‌کم دیرتر", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson05.exercise03.match_comparison_phrases
            type: matching_pairs
            tested_text: "تو چی یه‌کم دیرتر"
            prompt: {target_blocks: []}
            pairs:
              - {left: "تو چی؟", right: "What about you?"}
              - {left: "یه‌کم دیرتر", right: "A little later"}
          - content_key: fa.a1.unit11.lesson05.exercise04.order_tow_chi
            type: word_order
            tested_text: تو چی
            prompt: {target_blocks: []}
            word_bank: [تو, چی]
          - content_key: fa.a1.unit11.lesson05.exercise05.translate_a_little_later
            type: translation
            tested_text: یه‌کم دیرتر
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson05.exercise06.speak_ask_what_about_you
            type: speak_response
            tested_text: تو چی
            prompt: {target_blocks: [{text: "After answering what time you wake up, ask your friend the same question back.", language_code: en, direction: ltr}]}

      - content_key: fa.a1.unit11.lesson06.routine_dialogue
        title: گفت‌وگو دربارهٔ برنامهٔ روزانه
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: fa.a1.unit11.lesson06.teach.turn01
            kind: dialogue
            target: {text: "تو هر روز ساعت چند بیدار می‌شی؟", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: [سارا]
          - content_key: fa.a1.unit11.lesson06.teach.turn02
            kind: dialogue
            target: {text: "ساعت هفت بیدار می‌شم. تو چی؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [نیما]
          - content_key: fa.a1.unit11.lesson06.teach.turn03
            kind: dialogue
            target: {text: "من یه‌کم دیرتر، ساعت هشت.", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: [من, هشت]
          - content_key: fa.a1.unit11.lesson06.teach.turn04
            kind: dialogue
            target: {text: "بعد از بیدار شدن چیکار می‌کنی؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [بعد, از, شدن, چیکار, می‌کنی]
          - content_key: fa.a1.unit11.lesson06.teach.turn05
            kind: dialogue
            target: {text: "صبحونه می‌خورم و میرم سرکار. شب‌ها هم معمولاً ساعت یازده می‌خوابم.", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: [هم, معمولاً]
          - content_key: fa.a1.unit11.lesson06.teach.third_person_forms
            kind: grammar_note
            target: {text: "بیدار می‌شه، می‌خوابه (او)", language_code: fa, direction: rtl}
            introduced_tokens: [می‌شه, می‌خوابه]
        exercises:
          - content_key: fa.a1.unit11.lesson06.exercise01.listen_context
            type: dialogue_comprehension
            tested_text: "سارا نیما بیدار می‌شی ساعت هفت ساعت هشت"
            media_asset_key: fa.a1.audio.dialogue.daily_routine.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson06.exercise02.recognize_saras_wake_time
            type: multiple_choice
            tested_text: ساعت هشت
            prompt:
              target_blocks:
                - {text: "What time does Sara wake up?", language_code: en, direction: ltr}
          - content_key: fa.a1.unit11.lesson06.exercise03.match_dialogue_facts
            type: matching_pairs
            tested_text: "نیما بیدار سارا بیدار سارا می‌خوابم"
            prompt: {target_blocks: []}
            pairs:
              - {left: "نیما بیدار می‌شه", right: "ساعت هفت"}
              - {left: "سارا بیدار می‌شه", right: "ساعت هشت"}
              - {left: "سارا می‌خوابه", right: "ساعت یازده شب"}
          - content_key: fa.a1.unit11.lesson06.exercise04.order_after_waking_question
            type: word_order
            tested_text: "بعد از بیدار شدن چیکار می‌کنی"
            prompt: {target_blocks: []}
            word_bank: [بعد, از, بیدار, شدن, چیکار, می‌کنی]
          - content_key: fa.a1.unit11.lesson06.exercise05.listen_type_night_routine
            type: listen_type
            tested_text: "شب‌ها هم معمولاً ساعت یازده می‌خوابم"
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit11.lesson06.exercise06.dialogue_response_own_routine
            type: dialogue_response
            tested_text: "صبحونه می‌خورم و میرم سرکار"
            prompt: {target_blocks: [{text: "بعد از بیدار شدن چیکار می‌کنی؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit11.lesson06.exercise07.write_routine_summary
            type: writing_prompt
            tested_text: "سارا ساعت هشت بیدار می‌شه و ساعت یازده شب می‌خوابه"
            prompt: {target_blocks: [{text: "Write a short summary of Sara's routine: what time she wakes up and what time she sleeps.", language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit11.lesson06.exercise08.speak_full_routine_scene
            type: speak_response
            tested_text: "ساعت هفت بیدار می‌شم صبحونه می‌خورم و میرم سرکار شب‌ها ساعت یازده می‌خوابم"
            prompt: {target_blocks: [{text: "Describe your own daily routine: what time you wake up, what you do after that, and what time you go to sleep.", language_code: en, direction: ltr}]}
