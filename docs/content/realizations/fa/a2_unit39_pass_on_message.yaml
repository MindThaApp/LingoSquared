  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.communication.pass_on_a_simple_message. Grammar target: present-tense reporting with می‌گه که / می‌گن که (statement), می‌پرسه که ... هست یا نه / داری یا نه / کی ... (question), می‌خواد که + subjunctive (request), and the person shift I to he/she (verb -م to -ه, possessive -م to -ش). Register: casual spoken Tehrani Persian; no past-shifted reported speech (that is B1). Characters: established friends Sara (teacher) and Nima (engineer) only appear by name; the message sender is an unnamed colleague (همکارت/همکارم) or friend (دوستم); no new job or family facts asserted. The unit delivers listening, speaking, reading, and writing tasks, with culminating notes that report a statement and a question (and a request). Authored without opening any prs file. NATIVE QUESTIONS: (1) Is می‌پرسه که وقت داری یا نه the most natural spoken way to report a yes/no question, or would می‌پرسه وقت داری یا نه (without که) be the usual form? Recommended: both are fine; the unit teaches with که and accepts it dropped. (2) For reporting, is می‌خواد که بهش زنگ بزنی natural, or would speakers more often say می‌خواد بهش زنگ بزنی or می‌گه بهش زنگ بزن? Recommended: keep the first and accept the second as a variant. (3) Is می‌گن که used here (اونا می‌گن که دیر می‌رسن) clear as ''they say'' for a plural speaker group, given that می‌گن also means ''people say''? Recommended: keep it as plural they. (4) Is فردا زنگ می‌زنم / می‌گه که فردا زنگ می‌زنه a natural present-tense way to report a plan, or should it be taught with می‌خوام زنگ بزنم? Recommended: keep the plain present.'
