  notes: 'Spine outcome: universal.a2.description.describe_objects_with_adjectives. Grammar target: ezafe chains noun + adjective (کیف قرمز), noun + owner (کیف سارا), noun + adjective + owner (کیف قرمز سارا), and noun + two adjectives (کیف چرمی سیاه), including the written forms after a silent ه (خونه‌ی نیما) and after و (پالتوی سارا). The ezafe vowel itself (-e) is never written in the course text, as in ordinary Persian spelling; notes explain that it is pronounced. Register: casual spoken Tehrani; the clerk uses شما. Characters: Sara and Nima plus an unnamed کارمند (clerk). NATIVE QUESTIONS: (1) Is the order noun + material + colour (کیف چرمی سیاه) or noun + colour + material the more natural default for a spoken description? Recommended: keep noun + material + colour and accept both orders. (2) Is میز چوبی بزرگ natural, or would میز بزرگ چوبی be preferred? Recommended: accept both; teach میز چوبی بزرگ. (3) Is مال نیماست the natural spoken way to say “it belongs to Nima”? Recommended: yes, keep. (4) After final ی (صندلی نیما) is it right to leave the ezafe unwritten in teaching text? Recommended: yes, keep the standard spelling and explain the -ye sound in the note.'
course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: 'Casual spoken Iranian (Tehrani): خونه، قرمزه، گم کردم، pronoun dropping, and spoken verb endings; polite شما forms only to a clerk. The ezafe vowel is not written after a consonant (the standard Persian writing convention); it is written ـه‌ی after a silent ه and ی after و. No written-only forms are produced.'
