  notes: 'Authored 2026-11 to fill the missing A2 slot ''rescheduling an appointment'' (sibling courses: rearrange_an_appointment, 6 lessons: cannot come / another day / giving a reason / agreeing a new time / reading / phone conversation). Spine outcome universal.a2.plans.rearrange_an_appointment. Grammar target: can / cannot + short be- verb (می‌تونم بیام، نمی‌تونم بیام، می‌تونم وقتم رو عوض کنم؟), می‌شه + باشه to propose a day (می‌شه دوشنبه باشه؟), براتون مناسبه؟ to ask whether a time suits, چون + reason, and day-then-time (دوشنبه ساعت ده). Register: colloquial Tehrani spoken Persian; the salon desk is addressed with polite شما endings (می‌تونید، براتون، می‌بینمتون) as in the existing unit18 service dialogue, while the two friends are not needed here. Characters: Nima (established male friend) phones a hairdresser; the staff speaker is labelled آرایشگاه, no name or personal facts are invented. Thursday is a normal working day for salons; the offered Saturday and the agreed Monday avoid the Friday closing day. Authored independently of every prs file (never opened). Pending native review. Native questions: (1) متأسفانه vs متاسفانه spelling (both accepted in typed answers); (2) is آرایشگاه، بفرمایید a natural way for a salon to answer the phone; (3) می‌شه دوشنبه باشه؟ versus دوشنبه می‌شه؟; (4) وقتم رو عوض کنم vs وقتم رو جابجا کنم; (5) یه روز قبل زنگ بزنید in the SMS (versus از قبل); (6) the SMS salutation آقای نیما.'
course:
  realization_key: fa.a2
