  notes: 'Authored 2026-11 to fill the missing A2 slot ''holiday plans'' (sibling courses: announce_plans_and_intentions, 6 lessons, near plans / intentions / maybe and certainly / questions about plans / reading / conversation). Spine outcome universal.a2.future.announce_plans_and_intentions. Grammar target: Persian has no future-tense verb in speech, so near and arranged plans use the present with می‌ plus a time word (مرداد می‌رم شمال), further intentions use می‌خوام / قصد دارم + a short be- verb (می‌خوام یه دوره بگیرم، می‌خوام خونه عوض کنم), uncertainty uses شاید + the be- form (شاید برم) and certainty حتما + می‌ present, and negative plans use نمی‌-. Register: colloquial Tehrani spoken Persian, consistent with the existing fa A2 units (contractions می‌رم، می‌مونم، تابستون، خونه). Characters: the established Sara / Nima friend pair; no job or family facts are asserted beyond a sister and a brother (Nima''s brother is named only as a travel companion). The Iranian summer-holiday picture (شمال = the Caspian coast) is used on purpose. Authored independently of every prs file (never opened). Pending native review. Native questions: (1) is بگیرم after دوره (take a course) the natural collocation versus ثبت‌نام کنم? (2) خونه عوض کردن for moving house versus اسباب‌کشی کردن; (3) پول جمع کردن versus پس‌انداز کردن; (4) accept both می‌خوام برم and می‌خوام که برم? (only the first is taught); (5) is شاید هم برم اصفهان natural at the end of a message; (6) تعطیلات تابستون vs تعطیلات‌ی تابستون: the unit uses the first.'
course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: 'Casual spoken Iranian (Tehrani) register between the established friends Sara and Nima: colloquial verb forms (می‌رم، می‌مونم، می‌خوام)، pronoun dropping, and polite شما forms only where a service desk is addressed. Written-only alternatives are not used.'
