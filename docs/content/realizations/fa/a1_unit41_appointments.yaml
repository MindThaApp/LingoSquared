review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), reviewed cold alongside
    units 39/40/42 in the same batch, no access to the authoring reasoning
    beyond what's recorded below this note. Found no real bugs -- unit41
    is clean. Checked: the compiler validator (0 errors/0 warnings
    standalone and as part of the full 39-42 group); a recursive
    yaml.safe_load boolean scan over both this file and the paired overlay
    (zero stray coercions); every exercise `type:` used (multiple_choice,
    matching_pairs, word_order, translation, dialogue_comprehension,
    dialogue_response, reading_comprehension, writing_prompt) is
    registered in ExerciseRenderer.tsx; no listen_select/dialogue_response
    exercise in this unit, so the same-speaker/same-audio distractor bug
    class structurally cannot apply -- checked anyway that lesson04's
    dialogue_comprehension distractors ("He wants a doctor's
    appointment."/"He wants to cancel his appointment."/"He wants
    directions to the clinic.") are invented plausible-fact paraphrases,
    not lines either dialogue speaker (نیما, خانم احمدی) actually says;
    matching_pairs accepted_answers use the established fa-corpus
    flat-dict shape, graded correctly either way; no jargon leaks; every
    kind:vocabulary card has a genuine example sentence built only from
    earlier-declared tokens; no untaught vocabulary (compiler-confirmed).
    Cross-lesson fact consistency per AUTHORING_GUIDE.md #11 verified by
    hand: the appointment's day/time/place (Thursday, 4pm, Dr. Rezaei's
    office) are stated identically in the lesson04 dialogue, the lesson05
    reading notice, and every exercise referencing them -- no
    contradiction found. Every multi-clause translate/writing exercise
    (lesson04.exercise05, lesson05.exercise04/05, lesson06.exercise05)
    carries period-joined and comma/no-period variants per
    AUTHORING_GUIDE.md #12. Grammar/script spot-checked by hand: آزادم
    ("I'm free") and آزادید ("are you free?", formal) correctly extend
    آزاد with the consonant-stem -م/-ید endings, single ی throughout (no
    doubling needed, unlike unit39's بیاید/بیایید issue, since آزاد
    already ends in a consonant); the وقت/آزاد polysemy extension (from
    "free time" to "appointment slot"/"available") and the دیدید-style
    formal -ید ending precedent are both accurately cross-referenced to
    their real originating units; Persian keheh (ک U+06A9) and yeh (ی
    U+06CC) codepoints are used throughout. The register split (نیما's
    neutral lines vs. the polite service register used with خانم احمدی)
    reads as natural, consistent Iranian Farsi.

    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit40 (lost items, merged). Realizes
    universal.a1.appointments.make_simple_appointment, the next unrealized A1
    outcome after unit40 -- confirmed by an exact diff of every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files (using a real
    yaml.safe_load recursive scan, not grep, to avoid false positives from
    comment text) against every universal.a1.* id in
    docs/content/universal_spine.yaml: fa had realized 41 of 48 A1 outcomes
    (unit05 covers both places and directions in one merged unit), with
    appointments the next one in the spine's own declaration order and
    library/waste_disposal/accommodation/pharmacy/personal_care/bike_rental
    still unrealized after this unit. All three prerequisites -- unit09's
    universal.a1.time.ask_tell_time, unit10's
    universal.a1.dates.exchange_calendar_dates, and unit22's
    universal.a1.communication.basic_phone_contact -- already covered.
    Notably, unit09's own lesson05 ("پرسیدن دربارهٔ ساعت قرار") already
    introduced قرار ('appointment/date', general sense) and the phrase "قرار
    ساعت چنده؟" ('what time is the appointment?') as part of teaching
    time-telling, and unit10's lesson03 introduced جلسه ('meeting')/کدوم
    ('which')/روز ('day')/خوبه ('that's good/works') as part of teaching
    dates -- this unit reuses روز/کدوم/خوبه directly (all re-declared in
    introduced_tokens before first use in THIS file per the compiler's
    per-file-only untaught-vocabulary check) but deliberately does NOT reuse
    قرار as the primary "appointment" noun, instead building around وقت
    ('time/appointment slot', already taught in unit24's "free time" sense
    and explicitly extended here to the appointment-slot sense, a genuine and
    common Persian polysemy, not an invented one) and آزاد ('free/available',
    also already taught in unit24 as part of "free time") -- this keeps the
    unit's own vocabulary internally consistent (وقت + آزاد پair
    consistently, "do you have an appointment slot free") rather than mixing
    two near-synonymous appointment nouns (قرار and وقت) in the same unit,
    while still correctly crediting قرار's unit09 precedent for register
    reviewers. New vocabulary genuinely introduced for the first time in the
    whole corpus: دندانپزشک ('dentist'), مطب ('doctor's/dentist's office'),
    and the two new minor characters خانم احمدی (a dentist's-office
    receptionist) and دکتر رضایی (the dentist, referenced by name, never
    speaks) -- both kept separate from the established نیما/سارا friend pair,
    same register-isolation precedent unit39/unit40 already established for
    stranger/service-provider characters. گرفتن ('to get/take') is reused
    from unit34's post lesson (there taught as 'to receive'; the unit's own
    title uses the same verb in its idiomatic 'get an appointment' sense,
    وقت گرفتن, but no lesson content here actually conjugates گرفتن beyond
    the bare infinitive in the unit title/summary card -- every REQUEST
    phrase in the actual teaching/exercise content uses the simpler,
    A1-appropriate "وقت [+ service] می‌خوام" (object + می‌خوام, verb-final,
    the exact same pattern already established by unit03's "دو تا سیب
    می‌خوام") rather than introducing the گرفتن subjunctive (بگیرم), which
    a2_unit09_bureaucracy.yaml already uses at the A2 level -- deliberately
    left for that level, not duplicated here, per the recognition->drag->
    production pacing rule and general A1 grammar-simplicity precedent
    (unit17's own review notes document the same deliberate subjunctive
    deferral). آزادید (formal 'are you free?') is a new but transparent
    extension of the already-established formal -ید ending pattern
    (هستید/بفرمایید/unit40's دیدید) applied to آزاد, flagged explicitly for
    reviewer attention same as unit40's دیدید was. Scoped to the outcome's
    four assessment_requirements: understanding a spoken appointment offer
    (listening, via lesson04's dialogue plus its dialogue_comprehension
    exercise -- day/time/place all present), requesting a simple appointment
    and confirming an offered time (speaking/production, via translate/
    dialogue_response/writing_prompt exercises across lessons 01-06, naming
    the service (دندانپزشک), day (پنجشنبه), and time (ساعت چهار عصر) exactly
    as the spine outcome's own can_do text requires), interpreting a short
    written appointment confirmation (reading, lesson05's
    reading_comprehension exercises against a service/day/time/place notice),
    and writing a short appointment request/confirmation message (writing,
    lessons05/06's writing_prompt exercises). Register choice, explicitly
    noted per AUTHORING_GUIDE.md #3: the phone call to the dentist's office
    (a stranger, new minor character خانم احمدی, kept separate from the
    established نیما/سارا friend pair) uses the polite/neutral service
    register consistent with unit22's phone-call precedent, while نیما's own
    lines stay register-neutral -- day/time facts are kept internally
    consistent across the whole unit per AUTHORING_GUIDE.md #11 (Thursday,
    4pm, Dr. Rezaei's office, stated identically in the dialogue, the reading
    notice, and every exercise that references them). Every kind:vocabulary
    card (دندانپزشک، مطب، وقت، آزاد) has an example sentence per schema
    1.1/AUTHORING_GUIDE §19, built only from the card's own word plus tokens
    already declared earlier in THIS file (no forward references -- notably
    وقت's example needed دندانپزشک/می‌خوام, both already declared in
    lesson01, and آزاد's example needed پنجشنبه, re-declared in that same
    card's own introduced_tokens alongside آزاد/آزادم since the compiler only
    enforces exercises' tested_text against the cumulative taught set, not
    example sentences against strictly-earlier cards -- verified by reading
    the compiler's validate_untaught_vocabulary/validate_vocabulary_examples
    source directly rather than assuming). Every matching_pairs exercise has
    6-7 pairs per §16. No listen_type/listen_select/listen_order exercise is
    used anywhere in this unit -- fa has real TTS per AUTHORING_GUIDE §14,
    but this file continues the established text-based corpus-consistency
    pattern from units 19-40, the same choice those units' own reviews made;
    this also means the same-speaker/same-audio distractor-collision bug
    class (found and fixed 2026-07-09 in the nl corpus, commit 148240e)
    cannot apply here -- there is no listen_select exercise in this file to
    check. lesson04's dialogue_comprehension exercise (the one exercise with
    English-language distractors tied to dialogue content, "What does Nima
    want?") was explicitly checked: its three distractors ("He wants a
    doctor's appointment."/"He wants to cancel his appointment."/"He wants
    directions to the clinic.") are plausible-fact alternatives, not lines
    either dialogue speaker (نیما or خانم احمدی) actually says anywhere in
    this unit's dialogue audio -- نیما never asks for a "doctor" (only
    دندانپزشک, dentist, is ever requested), neither speaker ever mentions
    canceling, and neither speaker ever asks for or gives directions to the
    clinic. Every "Translate into English" exercise in the paired overlay
    explicitly sets answer_language_code: en. Every multi-clause translate/
    writing_prompt exercise (lesson04.exercise05, lesson05.exercise04/05,
    lesson06.exercise05) carries period-joined and no-period/comma variants
    per §12; the dialogue's own day/time/place facts are additionally
    verified consistent with the reading lesson's confirmation notice (both
    say Thursday, 4pm, Dr. Rezaei's office) per §11. Ran a recursive
    yaml.safe_load scan over this file and its paired overlay for bare
    unquoted yes/no/true/false/on/off values (including matching_pairs
    right: values specifically, the two fields that have bitten this corpus
    before) -- zero hits, see the overlay's own review note for the exact
    scan result.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما's own
    lines stay register-neutral, while the phone call to the dentist's
    office (a stranger, new minor character خانم احمدی) uses the same
    polite/neutral service-call register unit22's phone lesson already
    established. Reuses وقت/آزاد (unit24, extended here from "free time" to
    "appointment slot"/"available"), روز/کدوم/خوبه (unit10), گرفتن (unit34,
    "to receive," referenced only in the unit title's idiomatic sense),
    می‌خوام (units 03/08), دکتر (unit17), کجاست (unit05), and یا (units
    07/09/14/28) without re-teaching any of them from scratch.

