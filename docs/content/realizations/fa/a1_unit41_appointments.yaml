    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf) has a real
    Acrobat Pro DC OCR text layer, 66,717 words extractable this fetch
    (consistent with every prior unit's fetch of the same file, confirming a
    stable extraction, not a fluke). Grepped the full extracted text
    case-insensitively for appointment/vaqt/vaght/waqt/qarar/ghorar/doctor/
    dentist/clinic/reserve/reservation/schedule/randevu: found exactly one
    genuine hit, a single isolated glossary-table entry "promise,
    appointment, date" (transliterated hândige, i.e. Persian هماهنگی/قرار
    family) with no surrounding scheduling scenario -- confirmed by reading
    the surrounding ~30 lines of context, which turned out to be an unrelated
    tailor/shopping dialogue about lining material and buttons, not an
    appointment-making scene. "Doctor" (doktor) appears twice elsewhere in
    the extracted text but only as an isolated vocabulary-glossary entry, no
    surrounding clinic/appointment dialogue either time. "To reserve, to
    retain" (line ~12442) appears in a genuine dialogue, but it's a hotel-room
    reservation ("we have reserved a room for..."), not a service appointment.
    This is a real, honest dead end for THIS specific outcome: no
    appointment-making, phone-booking, or clinic-scheduling scenario exists
    anywhere in the extracted text. All vocabulary and dialogue in this unit
    is authored fresh from this project's own established colloquial Iranian
    Farsi conventions and already-shipped vocabulary (see review notes below
