          - content_key: fa.a1.unit31.lesson03.teach.answer_accept_invite
            kind: phrase
            target: {text: "آره، حتماً میام!", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit31.lesson03.exercise01.recognize_miai
            type: multiple_choice
            tested_text: میای
            prompt: {target_blocks: [{text: میای, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit31.lesson03.exercise02.recognize_davat
            type: multiple_choice
            tested_text: دعوت
            prompt: {target_blocks: [{text: دعوت, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit31.lesson03.exercise03.match_invitation_words
            type: matching_pairs
            tested_text: "دعوت حتماً میای به آره میای به مهمونی تولدم آره حتماً میام"
            prompt: {target_blocks: []}
            pairs:
              - {left: دعوت, right: invitation}
              - {left: حتماً, right: definitely}
              - {left: میای, right: "you come (informal)"}
              - {left: به, right: to}
              - {left: آره, right: yeah}
              - {left: "میای به مهمونی تولدم؟", right: "Will you come to my birthday party?"}
              - {left: "آره، حتماً میام!", right: "Yeah, I'll definitely come!"}
          - content_key: fa.a1.unit31.lesson03.exercise04.word_order_invite
            type: word_order
            tested_text: "میای به مهمونی تولدم"
            prompt: {target_blocks: [{text: "Will you come to my birthday party?", language_code: en, direction: ltr}]}
            word_bank: [میای, به, مهمونی, "تولدم"]
          - content_key: fa.a1.unit31.lesson03.exercise05.translate_accept_invite
            type: translation
            tested_text: "آره، حتماً میام!"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit31.lesson04.birthday_dialogue
        title: "گفتگوی تولد"
        spine_outcome_id: universal.a1.celebrations.talk_about_celebrations
        teaching:
          - content_key: fa.a1.unit31.lesson04.teach.mobarak_word
            kind: vocabulary
            target: {text: مبارک, language_code: fa, direction: rtl}
            introduced_tokens: [مبارک]
            example: {text: "روزت مبارک!", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit31.lesson04.teach.review_dialogue_words
            kind: grammar_note
            target: {text: "فردا (tomorrow) / ممنون (thanks) / چه خوب (how nice)", language_code: fa, direction: rtl}
            introduced_tokens: [فردا, ممنون, چه, خوب]
          - content_key: fa.a1.unit31.lesson04.teach.dialogue_line1
            kind: dialogue
            target: {text: "سارا، فردا تولدمه!", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [سارا]
          - content_key: fa.a1.unit31.lesson04.teach.dialogue_line2
            kind: dialogue
            target: {text: "تولدت مبارک، نیما!", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: [نیما]
