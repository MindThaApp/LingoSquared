schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at the FSI Persian Basic Course source this
    pass, reusing the same pdftotext -layout extraction of
    https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf
    (pdfinfo-confirmed Author: US FSI, 398 pages) already sitting in this
    session's own scratchpad from the immediately-prior unit30 task, then
    grepped the extracted text fresh for THIS unit's own terms (birthday,
    born, congratulat*, gift, cake, party, invit*, celebrat*, anniversary,
    month) plus a manual read of every hit's surrounding context. Honest
    result, much thinner than unit30's education search, as expected --
    "birthday party" is not a natural 1963 diplomatic-course topic the way
    university/studies was: found ONE genuinely usable clean glossary-style
    hit, a two-column vocabulary entry "mehmun -> guest" / "mehmuni ->
    party, entertainment" (i.e. مهمان / مهمانی), illustrating Persian's
    /-i/ suffix ("pertaining to"). Also found a real, legible grammar note
    and drill sentence confirming ماه ("month; moon") as a genuine
    glossary entry, plus a worked "which day of the month is today"
    construction (امروز چندم ماهه؟) -- not used directly (this unit's own
    prerequisite outcome, unit10's dates, already independently
    established ماه/ordinal/date vocabulary in this course), but confirms
    the already-established unit10 vocabulary is period-authentic too, an
    incidental cross-check rather than a new find. "Invitation" itself
    does appear in the English column of a couple of Basic Sentences
    (thanking someone for an invitation, accepting an invitation to
    lunch), but the OCR of the corresponding Persian line is badly
    corrupted in both instances (e.g. "iceza ruetv.ste jenabe tali xeyli
    ... xey li IIUBll&";unam.") -- unlike مهمانی's clean two-column
    glossary format, this is not legible enough to confidently extract a
    real word from, so it is NOT treated as a confirmed FSI hit; this
    unit's own already-established دعوت ("invitation," genuinely taught
    back in unit12.plans, itself independently authored rather than
    FSI-sourced) is reused instead. No usable hit at all for birthday,
    born, congratulations, gift, or cake -- confirmed by direct grep of
    the full extraction, zero results beyond one OCR-garbage false
    positive ("zld -> birth", clearly noise, not a real dictionary
    entry). This is an honest, expected gap: a 1963 US diplomatic
    training course has no reason to teach "happy birthday." Used
    directly in this unit: مهمانی (party/gathering), adapted to this
    course's own established colloquial spelling مهمونی per the standing
    ا->و colloquial-shift convention this course already applies elsewhere
    (خواندن->خوندن/می‌خونم, unit24/unit30) -- FSI's own formal-register
    spelling is not reused verbatim, per the standing modernization
    requirement. تولد (birthday), کیک (cake), هدیه (gift), مبارک
    (congratulations/happy), and جشن (celebration) are authored fresh
    using this project's established fa register/character conventions,
    since FSI has no equivalent for any of them.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft authored 2026-07-09 by a Sonnet 5 worker task. Realizes
    universal.a1.celebrations.talk_about_celebrations, fa's next
    uncovered A1 outcome after unit30 (education) -- confirmed by an
    exact diff (via a real yaml.safe_load recursive walk collecting every
    spine_outcome_id/spine_outcome_ids value across all fa a1_unit*.yaml
    realization files, not a text grep) against every `id:` beginning
    `universal.a1.` in docs/content/universal_spine.yaml (39 total A1 ids
    at this spine file's current state, re-checked immediately before
    authoring per the standing fast-moving-spine footgun): celebrations
    is the very next A1 id after education in the spine file's own
    ordering (both physically adjacent, index 37/38). Also re-verified
    immediately before authoring (per the standing parallel-session
    unit-collision footgun) that no unit31 file existed yet in
    docs/content/realizations/fa/ or docs/content/overlays/en-fa/ at the
    moment this file was created -- prs already has its own, unrelated
    a1_unit32_celebrations.yaml (different unit number, different
    language, same outcome realized independently; per the standing §8
    sibling-isolation rule that file was never opened, not even to check
    its structure -- only its filename was seen in a directory listing
    while confirming no fa collision existed).

    Continues the نیما/سارا recurring cast from units 11-14/23-30.
    Scoped to: naming 4 celebration words (تولد birthday, مهمونی party,
    کیک cake, هدیه gift) plus a combined امروز تولدمه و مهمونی دارم ("Today
    is my birthday and I have a party") sentence built on this course's
    established colloquial possessive+copula pattern (already
    precedented by unit03's بیست و پنج سالمه and unit10's ...
    اردیبهشته); asking/telling a birthday date (تولدت کِیه؟) reusing
    unit10's already-established دهم/اردیبهشت ordinal+month vocabulary
    exactly (تولدم دهم اردیبهشته); an invitation exchange (میای به مهمونی
    تولدم؟ / آره، حتماً میام) reusing unit12's already-established دعوت
    and unit22's already-established میام/حتماً, extended with a fresh
    میای (2nd-person informal, the same style of person-family extension
    unit30 already applied to می‌خونم->می‌خونی->می‌خونه); a نیما/سارا
    dialogue introducing مبارک (congratulations/happy, genuinely new --
    no FSI equivalent, see provenance note) via تولدت مبارک، نیما!,
    combined with already-established فردا/ممنون/چه خوب and unit08's
    already-established برات ("for you") plus unit29/30's already-
    established می‌گیرم ("I get/take," reused here in its literal
    gift-getting sense); a third-person reading passage (lesson05) that
    explicitly cross-checks its own facts against the dialogue per
    AUTHORING_GUIDE.md §11 -- it restates exactly what the dialogue
    already established (Nima's birthday is tomorrow; Sara will bring
    him a gift and come to the party), introducing no new,
    dialogue-contradicting facts, and extends برات->براش and
    میام/میاد->میاد (3rd person, already independently established in
    unit12's own "سارا فردا میاد") plus a fresh می‌گیره (3rd-person
    extension of می‌گیرم, same pattern precedent as unit30's
    می‌خونم->می‌خونه); and a wrap-up combining a fresh جشن (celebration,
    general term distinct from the more specific مهمونی) with the plural
    suffix -ها (جشن‌ها، تولدها, each treated as its own single compound
    introduced_token per this course's own established convention for
    multi-morpheme colloquial forms, e.g. unit01's دانشجویم) into من
    جشن‌ها و تولدها رو دوست دارم, reusing the already-established دوست
    دارم/رو construction from units 14/26/28/29/30's own wrap-up
    lessons. Every already-taught word reused from an earlier unit is
    re-declared as an introduced_tokens review token at its first tested
    use in THIS file per the standing per-file untaught-vocabulary
    footgun (سال/unit03، دهم/اردیبهشت/unit10، دعوت/unit12، حتماً/میام/
    برات(root)/فردا (unit12/22)، آره/ممنون/این/امروز/دارم/و/رو/دوست/من
    (broadly established, all units), چه/خوب/می‌گیرم (unit30/29)، سارا/
    نیما (recurring cast) -- all re-declared fresh here, confirmed by
    running the actual compiler validator (not just a mental trace)
    after drafting and fixing every untaught-vocabulary error it raised.
    Matches the spine outcome's 4 assessment_requirements:
    understand_celebration_description via lesson04's
    dialogue_comprehension (reading-visible per the same pending-audio
    precedent units 13/17/18/24-30's fresh-context reviews accepted);
    describe_own_celebration via lesson02's production translate
    exercise (stating your birthday date) and lesson04's dialogue_response
    (accepting/making an invitation); read_celebration_description via
    lesson05's reading_comprehension (occasion + date + one additional
    detail: Sara brings a gift and attends); write_celebration_message via
    lesson06's final writing_prompt, deliberately phrased to match the
    spine's own assessment-requirement wording almost verbatim ("Write a
    short message inviting someone to a celebration, or congratulating
    them on their birthday"). matching_pairs pair counts: 7/6/7/7/6/6
    across lessons 1-6, all within AUTHORING_GUIDE.md §16's 6-12 range.
    Zero fill_in_blank anywhere (§17 n/a). Zero listen_type/listen_select/
    listen_order exercises, consistent corpus-wide choice matching units
    17/18/24-30 (audio remains pending_generation, not yet a live
    recorded/TTS-backed asset for this specific new content, despite §14's
    2026-07-06 revision technically permitting fa audio content now that
    Azure TTS covers Farsi). Every `kind: vocabulary` card (تولد/مهمونی/
    کیک/هدیه in lesson01, مبارک in lesson04, جشن in lesson06) has a real
    example sentence built entirely from already-taught or transparently-
    glossed words, per §19 (schema_version 1.1 from the start). §12
    multi-clause coverage applied to lesson01's combined-sentence
    translate exercise (period-joined, comma-and-joined, and-joined
    English variants all accepted as equally correct). §6 applied: every
    "Translate into English" exercise in this unit's overlay sets
    `answer_language_code: en` explicitly from the start. Not
    self-certified -- needs the mandatory fresh-context review before
    shipping, same as every other Claude-authored fa unit. Also manually
    re-verified (per this session's standing YAML boolean-coercion
    gotcha) that no bare yes/no/true/false/on/off value appears anywhere
    in this file via a recursive yaml.safe_load type scan, not just a
    text grep -- see the paired overlay's review notes for the combined
    result across both files.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-15/21-30. Reuses unit03's سالمه
    pattern (extended here to تولدمه), unit10's دهم/اردیبهشته, unit12's
    دعوت, unit22's میام/حتماً/بیا-family (extended here to a fresh
    2nd-person میای), unit08's برات (extended here to براش), and unit29/
    30's می‌گیرم present-tense pattern (extended here to می‌گیره), and the
    نیما/سارا cast, without re-teaching the underlying constructions,
    only the new vocabulary that combines with them. تولد، کیک، هدیه،
    مبارک، and جشن are standard, everyday, unremarkable Iranian Farsi
    words -- no loanword-authenticity verification burden. مهمونی
    (adapted from FSI's formal مهمانی to this course's own established
    colloquial ا->و spelling convention) is the one genuinely
    FSI-sourced word in this unit; full disclosure in the provenance
    note above.

