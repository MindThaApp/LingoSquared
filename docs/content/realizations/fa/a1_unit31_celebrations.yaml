units:
  - content_key: fa.a1.unit31.celebrations
    title: جشن‌ها و تولدها
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.celebrations.talk_about_celebrations
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit31.lesson01.celebration_vocabulary
        title: "کلمات جشن و تولد"
        spine_outcome_id: universal.a1.celebrations.talk_about_celebrations
        teaching:
          - content_key: fa.a1.unit31.lesson01.teach.tavallod_word
            kind: vocabulary
            target: {text: تولد, language_code: fa, direction: rtl}
            introduced_tokens: [تولد]
            example: {text: "امروز تولد منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit31.lesson01.teach.mehmooni_word
            kind: vocabulary
            target: {text: مهمونی, language_code: fa, direction: rtl}
            introduced_tokens: [مهمونی]
            example: {text: "مهمونی امروزه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit31.lesson01.teach.keik_word
            kind: vocabulary
            target: {text: کیک, language_code: fa, direction: rtl}
            introduced_tokens: [کیک]
            example: {text: "این کیک خوشمزه‌ست.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit31.lesson01.teach.hedye_word
            kind: vocabulary
            target: {text: هدیه, language_code: fa, direction: rtl}
            introduced_tokens: [هدیه]
            example: {text: "هدیه رو دوست دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit31.lesson01.teach.review_words
            kind: grammar_note
            target: {text: "امروز (today) / سال (year) / دارم (I have) / و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [امروز, سال, دارم, و]
          - content_key: fa.a1.unit31.lesson01.teach.tavallodam_pattern
            kind: grammar_note
            target: {text: "تولد (birthday) + م + ه = تولدمه (it's my birthday)", language_code: fa, direction: rtl}
            introduced_tokens: ["تولدمه"]
          - content_key: fa.a1.unit31.lesson01.teach.combined_sentence
            kind: phrase
            target: {text: "امروز تولدمه و مهمونی دارم.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit31.lesson01.exercise01.recognize_tavallod
            type: multiple_choice
            tested_text: تولد
            prompt: {target_blocks: [{text: تولد, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit31.lesson01.exercise02.recognize_mehmooni
            type: multiple_choice
            tested_text: مهمونی
            prompt: {target_blocks: [{text: مهمونی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit31.lesson01.exercise03.match_celebration_words
            type: matching_pairs
            tested_text: "تولد مهمونی کیک هدیه سال تولدمه امروز تولدمه و مهمونی دارم"
            prompt: {target_blocks: []}
            pairs:
              - {left: تولد, right: birthday}
              - {left: مهمونی, right: party}
              - {left: کیک, right: cake}
              - {left: هدیه, right: gift}
              - {left: سال, right: year}
              - {left: "تولدمه", right: "it's my birthday"}
              - {left: "امروز تولدمه و مهمونی دارم.", right: "Today is my birthday and I have a party."}
          - content_key: fa.a1.unit31.lesson01.exercise04.word_order_combined_sentence
            type: word_order
            tested_text: "امروز تولدمه و مهمونی دارم"
            prompt: {target_blocks: [{text: "Today is my birthday and I have a party.", language_code: en, direction: ltr}]}
            word_bank: [امروز, "تولدمه", و, مهمونی, دارم]
          - content_key: fa.a1.unit31.lesson01.exercise05.translate_combined_sentence
            type: translation
            tested_text: "امروز تولدمه و مهمونی دارم"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit31.lesson02.birthday_date
        title: "تولدت کِیه؟"
        spine_outcome_id: universal.a1.celebrations.talk_about_celebrations
        teaching:
          - content_key: fa.a1.unit31.lesson02.teach.key_word
            kind: vocabulary
            target: {text: کِی, language_code: fa, direction: rtl}
            introduced_tokens: [کِی]
            example: {text: "مهمونی کِیه؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit31.lesson02.teach.question_when_birthday
            kind: phrase
            target: {text: "تولدت کِیه؟", language_code: fa, direction: rtl}
            introduced_tokens: ["تولدت", "کِیه"]
          - content_key: fa.a1.unit31.lesson02.teach.review_dahom_ordibehesht
            kind: grammar_note
            target: {text: "دهم (10th) / اردیبهشت (Ordibehesht, 2nd Iranian month)", language_code: fa, direction: rtl}
            introduced_tokens: [دهم, اردیبهشت]
          - content_key: fa.a1.unit31.lesson02.teach.answer_birthday_date
            kind: phrase
            target: {text: "تولدم دهم اردیبهشته.", language_code: fa, direction: rtl}
            introduced_tokens: ["تولدم", "اردیبهشته"]
        exercises:
          - content_key: fa.a1.unit31.lesson02.exercise01.recognize_key
            type: multiple_choice
            tested_text: کِی
            prompt: {target_blocks: [{text: کِی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit31.lesson02.exercise02.recognize_dahom
            type: multiple_choice
            tested_text: دهم
            prompt: {target_blocks: [{text: دهم, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit31.lesson02.exercise03.match_date_words
            type: matching_pairs
            tested_text: "کِی دهم اردیبهشت تولدم تولدت کِیه تولدم دهم اردیبهشته"
            prompt: {target_blocks: []}
            pairs:
              - {left: کِی, right: when}
              - {left: دهم, right: "10th"}
              - {left: اردیبهشت, right: "Ordibehesht (2nd Iranian month)"}
              - {left: "تولدم", right: "my birthday"}
              - {left: "تولدت کِیه؟", right: "When's your birthday?"}
              - {left: "تولدم دهم اردیبهشته.", right: "My birthday is the 10th of Ordibehesht."}
          - content_key: fa.a1.unit31.lesson02.exercise04.word_order_birthday_date
            type: word_order
            tested_text: "تولدم دهم اردیبهشته"
            prompt: {target_blocks: [{text: "My birthday is the 10th of Ordibehesht.", language_code: en, direction: ltr}]}
            word_bank: ["تولدم", دهم, "اردیبهشته"]
          - content_key: fa.a1.unit31.lesson02.exercise05.translate_when_birthday
            type: translation
            tested_text: "تولدت کِیه؟"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit31.lesson03.invitation
        title: "دعوت به مهمونی"
        spine_outcome_id: universal.a1.celebrations.talk_about_celebrations
        teaching:
          - content_key: fa.a1.unit31.lesson03.teach.review_davat_hatman_miam
            kind: grammar_note
            target: {text: "دعوت (invitation) / حتماً (definitely) / میام (I come)", language_code: fa, direction: rtl}
            introduced_tokens: [دعوت, حتماً, میام]
          - content_key: fa.a1.unit31.lesson03.teach.miai_pattern
            kind: grammar_note
            target: {text: "میام (I come) -> میای (you come, informal)", language_code: fa, direction: rtl}
            introduced_tokens: [میای]
          - content_key: fa.a1.unit31.lesson03.teach.review_be
            kind: grammar_note
            target: {text: "به (to)", language_code: fa, direction: rtl}
            introduced_tokens: [به]
          - content_key: fa.a1.unit31.lesson03.teach.question_invite
            kind: phrase
            target: {text: "میای به مهمونی تولدم؟", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.a1.unit31.lesson03.teach.review_are
            kind: grammar_note
            target: {text: "آره (yeah)", language_code: fa, direction: rtl}
