review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), performed cold with no access
    to the authoring reasoning below. Ran the actual compiler standalone
    (0 errors/0 warnings) and as part of a 3-unit en-fa A1 batch with
    a1_unit55/a1_unit57 (also 0/0). Grepped both this file and its overlay
    for Arabic-range kaf (U+0643) and yeh (U+064A) -- zero hits, all
    keheh/yeh use correct Persian-range codepoints. Grepped for bare
    unquoted yes/no/true/false/on/off scalar values -- only the genuine
    human_reviewed/target_language_first boolean fields matched, no
    learner-facing field affected. Re-derived نیما's and سارا's full line
    lists from the dialogue by hand and confirmed lesson04's
    dialogue_comprehension distractors ("what time it is," "how much the
    beach costs," "go home") are not said or implied by either speaker
    anywhere in this unit's dialogue audio -- the price/hours live only in
    the separate lesson05 reading sign, never in the dialogue itself, so
    there is no same-speaker/same-audio collision. Confirmed every
    kind:vocabulary card (ساحل, دریا, ماسه) has a real example sentence
    built only from already-taught tokens, with a matching overlay
    example_gloss. Confirmed the unit's single-statement facts (beach has a
    sea and sand; umbrella rental 30,000 toman; hours 8am-8pm, stated once
    in the reading sign only, per this unit's own deliberate scenario shape)
    are not contradicted anywhere else in the unit. Confirmed every exercise
    type used is registered in ExerciseRenderer.tsx. matching_pairs
    accepted_answers use this course's established flat-dict shape,
    confirmed consistent with the corpus (not a bug, grading canonicalizes
    either shape per CLAUDE.md). Read every Farsi line against its English
    gloss for translation accuracy and register -- colloquial Iranian Farsi
    throughout, no Dari leaks, no instruction/answer-data mismatches found.
    Found no real bugs to fix in this unit. Original authoring-session
    provenance/reasoning preserved below for context.

    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit55 (gym). Realizes
    universal.a1.beach.enjoy_a_day_at_the_beach -- confirmed as the correct
    next unrealized A1 outcome for fa by diffing every spine_outcome_id/
    spine_outcome_ids value already used across every
    docs/content/realizations/fa/a1_unit*.yaml file (grep -o
    "universal\.a1\.[a-z0-9_]*\.[a-z0-9_]*" per file, deduplicated: 56
    distinct A1 primary outcomes covered across units01-55 -- unit05 alone
    declares two, places + directions -- plus two A2 outcomes and one B1
    outcome from this course's separate A2/B1 files) against every
    universal.a1.* id in docs/content/universal_spine.yaml's own
    declaration order (66 total A1 ids, greetings through florist): fa has
    realized every A1 outcome through unit55 (gym) with zero gaps -- ids 1
    through 56 in spine order (greetings ... gym) are all covered -- and
    universal.a1.beach.enjoy_a_day_at_the_beach is the very next A1 id
    declared in the spine immediately after gym.join_a_gym. Prerequisite
    outcomes (weather.describe_basic_weather/unit07,
    plans.make_simple_plans/unit12) are both already realized in this
    course, so no prerequisite gap blocks this unit. (Note:
    universal.a1.beach's own prerequisite pair -- weather + plans -- is
    identical to universal.a1.park.enjoy_a_park_outing's prerequisite
    pair, which is why this unit's scenario shape below deliberately
    mirrors unit54/park's own departure from the paid-service convention.)

    Scenario shape, continuing units 41-55's alternation: like unit54
    (park), universal.a1.beach.enjoy_a_day_at_the_beach's own can_do
    ("describe a day at the beach -- sea, sand, waves, swimming, a beach
    umbrella -- propose going, and read a simple beach sign") is primarily
    a friends'-plan scene, not a transaction, so this unit does NOT
    introduce a new named service clerk -- there is nothing to buy in the
    dialogue itself. It reuses the established سارا/نیما friend pair
    (already paired together in unit07/unit11/unit33/unit38/unit54),
    continuing their existing informal register rather than inventing a
    new character, the same judgment call unit54's own review notes made
    for the identical prerequisite pair. Unlike unit54, however, the
    outcome's own read_beach_sign assessment_requirement explicitly names
    "a rental price" (not just hours), so lesson05's reading sign states
    both a rental price (for a beach umbrella, reusing the already-taught
    چتر from unit40 in its original "umbrella" sense with no new sense
    given) and opening hours, matching units 41-53's service-counter
    sign convention on that one axis while keeping the friends'-plan
    dialogue itself transaction-free, exactly like unit54's own park sign
    stated hours with no dialogue transaction.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, confirmed with a real grep of every prior fa a1_unit*.yaml
    file's introduced_tokens declarations, not by eye): بریم (earliest:
    unit07, also unit12/54), می‌خوای (earliest: unit12), هوا (earliest:
    unit07), چطوره (earliest: unit01, also unit07/12/54), باشه (earliest:
    unit03, also many others), عالیه (earliest: unit07), آفتابیه
    (earliest: unit07), گرمه (earliest: unit07), خوبه (earliest:
    established from unit01/05/06/07/10/12), یا (earliest: unit06), داره
    (earliest: unit26), شنا (earliest: unit27, there taught for the sports
    outcome as swimming-as-a-hobby -- reused here for beach swimming, same
    core sense, no new sense given), بازی (earliest: unit27, "play"),
    کنیم (earliest: unit03's own "تمرین کنیم" -- already an established
    corpus word, not a new inflection, confirmed by grep before assuming
    it needed introducing as new the way park's بزنیم/gym's داریم did),
    امروز (earliest: unit06/07), و (earliest: unit26), می‌بینمت
    (earliest: unit54), چطور (earliest: unit01), بود (earliest: unit06),
    باحال (earliest: unit36), چتر (earliest: unit40, there "umbrella" for
    rain/lost-items -- reused here for a beach/sun umbrella, same core
    "umbrella" sense, no new sense given), سی (earliest: unit03), هزار
    (earliest: unit03), تومن (earliest: unit03), از (earliest: unit16),
    ساعت (earliest: unit09), هشت (earliest: unit03), صبح (earliest:
    unit01/09), تا (earliest: unit42), شب (earliest: unit01/09), سارا
    (earliest: unit02, recurring character). ملت (used ONLY as one
    component of a proper-noun place name, نور -- Noor, a real,
    well-known Caspian-coast town in Mazandaran, Iran with real public
    beaches -- exempt per the same real-place-name precedent unit05's
    میدان آزادی/unit54's پارک ملت already set; confirmed collision-free
    via a corpus-wide grep, zero prior use of نور as a proper noun
    anywhere in the fa corpus). New vocabulary genuinely introduced for
    the first time in the whole corpus: ساحل (beach -- this unit's own
    topic word), دریا (sea), and ماسه (sand) -- exactly 3 new words,
    within this course's established 2-4 new-word-per-unit range (unit53:
    2, unit54: 3, unit55: 2). "Waves," named in the outcome's own can_do
    text, is deliberately NOT given its own dedicated vocabulary card --
    the outcome's can_do is a descriptive list of things a learner should
    be ABLE to discuss at this level, not a literal checklist of five
    mandatory vocabulary cards, and "sea, sand, swimming, a beach
    umbrella" (all four of the other named concepts) are covered via a
    genuine taught word or an already-established reused word; a fourth
    brand-new word for "waves" alone would push past this unit's own
    established 2-4 range for no strong pedagogical gain at A1. No new
    verb-conjugation pattern or inflection is introduced in this unit --
    every verb form used (بریم, می‌خوای, داره, کنیم, بود) is an
    already-established corpus form reused as-is, not a new surface
    extension the way park's بزنیم or gym's داریم were.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: that the beach (دریا و ماسه داره, "has a sea
    and sand") is described identically in lesson02's teaching cards and
    the dialogue's own facts are never contradicted; the beach umbrella
    rental price (سی هزار تومن, "30,000 toman") and the opening hours
    (از ساعت هشت صبح تا هشت شب -- 8am to 8pm) are stated only once, in
    lesson05's reading sign (the dialogue itself, per the scenario-shape
    note above, is a friends'-plan scene and never states a price or
    hours, so there is no second statement of these facts anywhere else
    in the unit to cross-check against -- a genuine, deliberate
    difference from unit55/gym, where the same price+hours pair was
    stated in three separate places and needed a three-way cross-check;
    here §11 is satisfied by there being exactly one authoritative
    statement of each fact, not by multiple consistent statements).
    Every kind:vocabulary teaching item (ساحل, دریا, ماسه) has an example
    sentence per schema 1.1/AUTHORING_GUIDE §19, built only from the
    card's own word plus tokens already declared earlier in THIS file's
    document order (no forward references): "ساحل بریم؟" (ساحل's example)
    only uses بریم, declared on the immediately preceding review card in
    this same lesson01; "ساحل دریا داره." (دریا's example) only uses
    ساحل (lesson01) and داره, declared on the immediately preceding
    review card in this same lesson02; "ساحل ماسه داره." (ماسه's example)
    only uses ساحل (lesson01), ماسه (this same card, self-reference on
    first declaration, matching unit54/unit55's own precedent for a
    card's own first-declared word), and داره (same preceding review
    card as دریا's example). Every matching_pairs exercise has 6-8 pairs
    per §16 (lesson01: 6, lesson02: 6, lesson03: 6, lesson04: 6
    dialogue-line pairs matching the dialogue's own 6 turns, lesson05: 8,
    lesson06: 6). No listen_type/listen_select/listen_order exercise is
    used anywhere in this unit -- fa has real Azure TTS per AUTHORING_
    GUIDE §14 (this restriction is prs-only, not fa+prs), but this file
    continues the established text-based corpus-consistency pattern from
    units 19-55, the same choice those units' own reviews made. The
    spine outcome's own "listening" assessment requirement (identify a
    detail -- weather, water temperature, or an activity -- stated in a
    short beach exchange) is covered via lesson04's dialogue_comprehension
    exercise, the same interpretation units 41-55 already established for
    their own "listening" assessment coverage without a literal audio
    exercise type. Checked the same-speaker/same-audio distractor-
    collision bug class (found and fixed 2026-07-09 in the nl corpus,
    commit 148240e) anyway, per the standing instruction to list every
    line each speaker says before writing any distractor: نیما says
    "سارا، می‌خوای بریم ساحل؟"/"آفتابیه و گرمه."/"شنا کنیم. دریا خوبه.";
    سارا says "باشه، عالیه! امروز هوا چطوره؟"/"خوبه! شنا کنیم یا ماسه
    بازی کنیم؟"/"باشه، می‌بینمت." -- lesson04's dialogue_comprehension
    exercise asks what سارا proposes when she says "خوبه! شنا کنیم یا
    ماسه بازی کنیم؟", with distractors ("She asks what time it is."/"She
    asks how much the beach costs."/"She asks if Nima wants to go home.")
    that are plausible-fact alternatives, NOT lines either speaker
    actually says or facts either speaker actually states anywhere in
    this unit's DIALOGUE (the price and hours are stated only in the
    separate lesson05 reading sign, a different exercise/audio entirely,
    so there is no cross-exercise collision within the dialogue's own
    audio) -- the time, a beach cost, and going home are never mentioned
    by either character in the dialogue, so there is no collision. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line ("شنا کنیم. دریا خوبه.", with paraphrase variants also
    accepted), not a distractor set, so the same-speaker-collision
    question doesn't apply to it. Every "Translate into English" exercise
    in the paired overlay explicitly sets answer_language_code: en. No
    exercise in this unit tests a genuine two-clause sentence joined by
    "and"/comma (§12) -- the only "and"-joined construction (دریا و ماسه
    داره, "has a sea and sand") is a simple noun conjunction inside one
    clause, not two independent clauses, so §12's multi-clause-joining-
    form concern doesn't apply; every genuinely multi-sentence teaching/
    review line (lesson05's reading sign, lesson06's price/hours-style
    review) is authored as two or three separate short sentences, matching
    how units 44-55 already treat their own multi-sentence notes, with
    paraphrase-variant accepted answers rather than clause-join variants.
    Ran a recursive scan (grep for bare, unquoted yes/no/true/false/on/off
    tokens as YAML scalar values, plus a full yaml.safe_load parse of both
    this file and its paired overlay confirming every value that loaded is
    a str/list/dict, never a Python bool anywhere in a learner-facing
    field) for bare unquoted yes/no/true/false/on/off values (including
    matching_pairs right: values specifically) -- zero hits, see the
    overlay's own review note for the exact scan result. Ran a
    Persian-vs-Arabic codepoint scan (grep for Arabic kaf U+0643 and
    Arabic yeh U+064A across both files) -- zero hits, all keheh/yeh in
    this file use the correct Persian-range codepoints (U+06A9/U+06CC).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: سارا and
    نیما, both already-established recurring friend characters (paired
    together in unit07/unit11/unit33/unit38/unit54), keep their usual
    informal register while making a beach plan. Reuses بریم (unit07),
    می‌خوای (unit12), هوا/چطوره/آفتابیه/گرمه (unit07), باشه (unit03),
    عالیه (unit07), خوبه (established), یا (unit06), داره (unit26), شنا/
    بازی (unit27), کنیم (unit03), امروز (unit06/07), و (unit26), می‌بینمت
    (unit54), چطور (unit01), بود (unit06), باحال (unit36), چتر (unit40),
    سی/هزار/تومن (unit03), از (unit16), ساعت (unit09), هشت (unit03),
    صبح/شب (unit01/09), تا (unit42) without re-teaching any of it from
    scratch. No word is given a new sense beyond its existing corpus
    meaning in this unit.

media_assets:
  - content_key: fa.a1.unit56.audio.beach.vocab.01
    language: fa
    text: "ساحل، دریا، ماسه"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit56.audio.dialogue.beach.01
    language: fa
    text: "نیما: سارا، می‌خوای بریم ساحل؟ سارا: باشه، عالیه! امروز هوا چطوره؟ نیما: آفتابیه و گرمه. سارا: خوبه! شنا کنیم یا ماسه بازی کنیم؟ نیما: شنا کنیم. دریا خوبه. سارا: باشه، می‌بینمت."
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit56.beach
    title: ساحل
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.beach.enjoy_a_day_at_the_beach
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit56.lesson01.new_beach_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.beach.enjoy_a_day_at_the_beach
        teaching:
          - content_key: fa.a1.unit56.lesson01.teach.review_beriim_mikhaay
            kind: grammar_note
            target: {text: "بریم (let's go) -- already taught from unit07/12/54 / می‌خوای (do you want) -- already taught from unit12", language_code: fa, direction: rtl}
            introduced_tokens: [بریم, "می‌خوای"]
          - content_key: fa.a1.unit56.lesson01.teach.review_havaa_chetore
            kind: grammar_note
            target: {text: "هوا (weather) -- already taught from unit07 / چطوره (how is it) -- already taught from unit01/07/12/54", language_code: fa, direction: rtl}
            introduced_tokens: [هوا, چطوره]
          - content_key: fa.a1.unit56.lesson01.teach.review_bashe_aaliye
            kind: grammar_note
            target: {text: "باشه (okay) -- already taught from unit03 / عالیه (great) -- already taught from unit07", language_code: fa, direction: rtl}
            introduced_tokens: [باشه, عالیه]
          - content_key: fa.a1.unit56.lesson01.teach.sahel
            kind: vocabulary
            target: {text: ساحل, language_code: fa, direction: rtl}
            introduced_tokens: [ساحل]
            example: {text: "ساحل بریم؟", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit56.lesson01.exercise01.recognize_sahel
            type: multiple_choice
            tested_text: ساحل
            prompt: {target_blocks: [{text: ساحل, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit56.lesson01.exercise02.recognize_sahel_beriim
            type: multiple_choice
            tested_text: "ساحل بریم؟"
            prompt: {target_blocks: [{text: "ساحل بریم؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit56.lesson01.exercise03.match_beach_one
            type: matching_pairs
            tested_text: "بریم می‌خوای هوا چطوره باشه ساحل"
            prompt: {target_blocks: []}
            pairs:
              - {left: بریم, right: "let's go"}
              - {left: "می‌خوای", right: "do you want"}
              - {left: هوا, right: weather}
              - {left: چطوره, right: "how is it"}
              - {left: باشه, right: okay}
              - {left: ساحل, right: beach}
          - content_key: fa.a1.unit56.lesson01.exercise04.word_order_sahel_beriim
            type: word_order
            tested_text: "ساحل بریم"
            prompt: {target_blocks: [{text: "Let's go to the beach.", language_code: en, direction: ltr}]}
            word_bank: [ساحل, بریم]
          - content_key: fa.a1.unit56.lesson01.exercise05.translate_sahel_chetore
            type: translation
            tested_text: "ساحل چطوره؟"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit56.lesson02.new_beach_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.beach.enjoy_a_day_at_the_beach
        teaching:
          - content_key: fa.a1.unit56.lesson02.teach.review_khoobe_ya_dare
            kind: grammar_note
            target: {text: "خوبه (good) -- already taught from unit01/05/06/07/10/12 / یا (or) -- already taught from unit06 / داره (it has) -- already taught from unit26", language_code: fa, direction: rtl}
            introduced_tokens: [خوبه, یا, داره]
          - content_key: fa.a1.unit56.lesson02.teach.daryaa
            kind: vocabulary
            target: {text: دریا, language_code: fa, direction: rtl}
            introduced_tokens: [دریا]
            example: {text: "ساحل دریا داره.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit56.lesson02.teach.maase
            kind: vocabulary
            target: {text: ماسه, language_code: fa, direction: rtl}
            introduced_tokens: [ماسه]
            example: {text: "ساحل ماسه داره.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit56.lesson02.exercise01.recognize_daryaa
            type: multiple_choice
            tested_text: دریا
            prompt: {target_blocks: [{text: دریا, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit56.lesson02.exercise02.recognize_maase
            type: multiple_choice
            tested_text: ماسه
            prompt: {target_blocks: [{text: ماسه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit56.lesson02.exercise03.match_beach_two
            type: matching_pairs
            tested_text: "خوبه یا داره دریا ماسه ساحل"
            prompt: {target_blocks: []}
            pairs:
              - {left: خوبه, right: good}
              - {left: یا, right: or}
              - {left: داره, right: "it has"}
              - {left: دریا, right: sea}
              - {left: ماسه, right: sand}
              - {left: ساحل, right: beach}
          - content_key: fa.a1.unit56.lesson02.exercise04.word_order_sahel_daryaa_dare
            type: word_order
            tested_text: "ساحل دریا داره"
            prompt: {target_blocks: [{text: "The beach has a sea.", language_code: en, direction: ltr}]}
            word_bank: [ساحل, دریا, داره]
          - content_key: fa.a1.unit56.lesson02.exercise05.translate_maase_khoobe
            type: translation
            tested_text: "ماسه خوبه"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit56.lesson03.suggest_activity
        title: "پیشنهاد فعالیت"
        spine_outcome_id: universal.a1.beach.enjoy_a_day_at_the_beach
        teaching:
          - content_key: fa.a1.unit56.lesson03.teach.review_shena_bazi_konim
            kind: grammar_note
            target: {text: "شنا (swimming) -- already taught from unit27 / بازی (play) -- already taught from unit27 / کنیم (let's ..., we ...) -- already taught from unit03", language_code: fa, direction: rtl}
            introduced_tokens: [شنا, بازی, کنیم]
          - content_key: fa.a1.unit56.lesson03.teach.phrase_shena_ya_maase_bazi
            kind: phrase
            target: {text: "شنا کنیم یا ماسه بازی کنیم؟", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.a1.unit56.lesson03.teach.phrase_shena_daryaa_khoobe
