generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Firecrawl remains at 0 credits this session, so
    used direct pdftotext extraction against the Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf), the
    mirror with a real Acrobat Pro DC OCR text layer per every prior unit's
    finding this session (the DigitalOcean mirror is a JBIG2-only scan, 0
    extractable words, not re-attempted here since that dead end is already
    confirmed stable across units 36-41). This fetch extracted 66,717 words,
    consistent with every prior fetch of the same file. Grepped the full
    extracted text case-insensitively for library/book/borrow/lend/return/
    librarian/due date/overdue/ketab/ketabkhane/qarz/amanat: found two real
    but partial hits, neither amounting to a genuine library
    borrow/return scenario. (1) A "Classroom Expressions" glossary entry
    translates "library, bookstore" as the transliterated /ketabxane/ (i.e.
    Persian کتابخونه) with zero surrounding library scenario -- just a
    vocabulary-list line pairing the English gloss with the Persian word,
    same shape as unit41's isolated "appointment" glossary hit. (2) A
    genuine classroom-expressions dialogue line elsewhere in the same
    section teaches /pas dadan/ ("to give back") with the example "Will you
    please give me back that book" (/qorbanet, un ketabo bede pas/) -- a
    real, usable precedent for the "return" verb, but it's a bare
    classroom-object-handling drill (a teacher asking a student to hand a
    book back in class), not a library checkout/due-date scenario. No
    borrowing transaction, library card, due date, or librarian exchange of
    any kind exists anywhere in the extracted text -- a genuine, honest dead
    end for this specific outcome, same conclusion as unit41's own
    appointments search. All vocabulary and dialogue in this unit is
    authored fresh from this project's own established colloquial Iranian
    Farsi conventions and already-shipped vocabulary (see review notes below
    for the exact reuse chain), crediting only کتابخونه's glossary
    precedent and پس دادن's classroom-drill precedent as real (if partial)
    FSI grounding.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), reviewed cold alongside
    units 39/40/41 in the same batch, no access to the authoring reasoning
    beyond what's recorded below this note. Found no real bugs -- unit42
    is clean. Checked: the compiler validator (0 errors/0 warnings
    standalone and as part of the full 39-42 group); a recursive
    yaml.safe_load boolean scan over both this file and the paired overlay
    (zero stray coercions); every exercise `type:` used (multiple_choice,
    matching_pairs, word_order, translation, dialogue_comprehension,
    dialogue_response, reading_comprehension, writing_prompt) is
    registered in ExerciseRenderer.tsx; no listen_select/dialogue_response
    exercise in this unit, so the same-speaker/same-audio distractor bug
    class structurally cannot apply -- checked anyway that lesson04's
    dialogue_comprehension distractors ("He wants to return a book."/"He
    wants a library card."/"He wants directions to the library.") are
    invented plausible-fact paraphrases, not lines either dialogue speaker
    (نیما, آقای صادقی) actually says; matching_pairs accepted_answers use
    the established fa-corpus flat-dict shape, graded correctly either
    way; no jargon leaks; every kind:vocabulary card has a genuine example
    sentence built only from earlier-declared tokens; no untaught
    vocabulary (compiler-confirmed). The two deliberate polysemy
    extensions (پس "so/then" -> also "back"; تا counting-classifier ->
    also "until") are each given their own vocabulary card rather than
    silently reused, and neither is ever tested standalone without
    disambiguating phrase context (پس is only tested as "پس می‌دم", تا only
    as "تا سه‌شنبه" or within a full sentence) -- so the polysemy doesn't
    create an ambiguous exercise anywhere. Cross-lesson fact consistency
    per AUTHORING_GUIDE.md #11 verified by hand: the loan's due date and
    place (Tuesday, the library) are stated identically in the lesson04
    dialogue, the lesson05 reading notice, and every exercise referencing
    them -- lesson05.exercise05's writing_prompt correctly accepts an
    alternate day (Thursday) as well as Tuesday, which is fine since that
    exercise is open-ended creative writing ("using this note's pattern"),
    not a fixed-fact comprehension check, so it isn't a real
    inconsistency. Grammar/script spot-checked by hand: کتابخونه/امانت/
    کارت/دارید/می‌دم are all standard, correctly-formed colloquial Iranian
    Farsi; بفرمایید in this file is spelled with the correct double-ی
    (بفرمایید, matching the corpus-wide precedent, unlike unit39's
    بیاید/بیایید issue); Persian keheh (ک U+06A9) and yeh (ی U+06CC)
    codepoints are used throughout. The register split (نیما's neutral
    lines vs. the polite service register used with آقای صادقی) reads as
    natural, consistent Iranian Farsi.

    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit41 (appointments, merged).
    Realizes universal.a1.library.borrow_return_item, the next unrealized A1
    outcome after unit41 -- confirmed by an exact diff of every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files (using a real
    yaml.safe_load recursive scan of both the unit-level spine_outcome_ids
    list and each lesson's own spine_outcome_id field, not grep, to avoid
    false positives from comment/prose text mentioning outcome IDs) against
    every universal.a1.* id in docs/content/universal_spine.yaml: fa had
    realized 42 of 49 A1 outcomes after unit41, with library the next one in
    the spine's own declaration order (appointments -> library ->
    waste_disposal -> accommodation -> pharmacy -> personal_care ->
    bike_rental -> laundry) -- waste_disposal/accommodation/pharmacy/
    personal_care/bike_rental/laundry remain unrealized after this unit.

    Reuse chain (all re-declared in this file's own introduced_tokens before
    first use, per the compiler's per-file-only untaught-vocabulary check):
    کجاست (unit05), کتاب (unit03/13/24/37), کارت (unit08, there "payment
    card," extended here to "library card" -- a transparent, genuine
    extension, not a different word), دارید (units01/04/06/08/21), گرفتن's
    family is deliberately NOT reused as a conjugated borrowing verb this
    time (see below), می‌خوام (units03/08), کی (units16/34, "when"), می‌دم
    (unit26, "I give/I'll give," there "غذا می‌دم" for feeding a pet),
    سه‌شنبه (unit10), سلام/ممنون (units01/17/22), باشه (units17/22), بله
    (unit02), بفرمایید (units01/02/06), خواهش می‌کنم (units01/05/16),
    خداحافظ (unit01), آقای (unit40, there "آقای کریمی" a lost-and-found
    clerk). New vocabulary genuinely introduced for the first time in the
    whole corpus: کتابخونه (library), امانت (loan / on-loan -- used in the
    fixed collocation کتاب امانت می‌خوام, "I want to borrow a book," lit.
    "book [on] loan I want," parallel to unit41's وقت می‌خوام pattern), and
    one new minor character صادقی (آقای صادقی, a librarian, kept separate
    from the established نیما/سارا friend pair and from unit40's own آقای
    کریمی -- a fresh surname so the two service-provider NPCs stay
    distinct, not the same person appearing in two unrelated professions).
    Two words are deliberately given a NEW SENSE beyond their existing
    corpus meaning, flagged explicitly for reviewer attention: پس (already
    taught as the discourse marker "so/then" in units 04/07/12; used here in
    its equally common, unrelated "back" sense, as in پس دادن "to give
    back" -- real everyday Persian polysemy, not an invented one, and
    directly precedented by the FSI classroom-drill hit above) and تا
    (already taught as the counting classifier "تا" in units 03/04/06/19/24;
    used here in its equally common "until" sense, as in تا سه‌شنبه "until
    Tuesday" -- again real polysemy, same class as unit41's own وقت
    extension from "free time" to "appointment slot"). Both get their own
    `kind: vocabulary` card (not silently reused) specifically because the
    sense is new even though the surface form isn't, matching the way
    unit41 handled وقت.

    Deliberate grammar-simplicity choice, matching unit41's own explicit
    precedent: no new verb conjugation is introduced for "to borrow."
    گرفتن (already established as "to get/take" from unit34/41) is NOT
    reused here as a conjugated borrowing verb (e.g. امانت می‌گیرم) to avoid
    adding a new surface-form token for a concept the existing می‌خوام +
    noun pattern already covers cleanly (کتاب امانت می‌خوام, exactly
    parallel to unit41's وقت می‌خوام) -- one fewer new conjugated form for
    an A1 unit, consistent with unit41's own reasoning for avoiding the
    گرفتن subjunctive. Likewise این/رو (object marker) are avoided
    throughout, matching unit41's own avoidance of them in favor of bare
    noun+verb phrases (کتاب امانت می‌خوام rather than "این کتاب رو امانت
    می‌خوام") -- fewer new per-file tokens for the same meaning.

    Scoped to the outcome's real-world components: locating the library
    (lesson01), requesting to borrow a specific item and confirming
    membership/a library card (lesson02), asking/stating when it's due back
    (lesson03), a full librarian-desk dialogue covering the whole
    transaction start to finish (lesson04), reading a short loan-confirmation
    note naming the item and due date (lesson05), and a wrap-up review
    (lesson06). Register choice, explicitly noted per AUTHORING_GUIDE.md #3:
    the librarian-desk exchange (a stranger, new minor character آقای
    صادقی, kept separate from the established نیما/سارا friend pair) uses
    the polite/neutral service register unit22's phone-call and unit41's
    dentist-office precedents already established, while نیما's own lines
    stay register-neutral -- day/place facts are kept internally consistent
    across the whole unit per AUTHORING_GUIDE.md #11 (Tuesday, the library,
    stated identically in the dialogue, the reading notice, and every
    exercise that references them). Every kind:vocabulary card (کتابخونه،
    امانت، پس، تا) has an example sentence per schema 1.1/AUTHORING_GUIDE
    §19, built only from the card's own word plus tokens already declared
    earlier in THIS file (no forward references -- تا's example needed
    پس/می‌دم/سه‌شنبه, all three declared earlier in the same lesson03
    teaching stack before تا's own card). Every matching_pairs exercise has
    6-7 pairs per §16. No listen_type/listen_select/listen_order exercise is
    used anywhere in this unit -- fa has real TTS per AUTHORING_GUIDE §14,
    but this file continues the established text-based corpus-consistency
    pattern from units 19-41, the same choice those units' own reviews made;
    this also means the same-speaker/same-audio distractor-collision bug
    class (found and fixed 2026-07-09 in the nl corpus, commit 148240e)
    cannot directly apply here -- there is no listen_select exercise in
    this file to check. Checked anyway, since lesson04's dialogue_comprehension
    exercise is the closest analogue (a multiple-choice check tied to
    dialogue content): its three distractors ("He wants to return a
    book."/"He wants a library card."/"He wants directions to the
    library.") are plausible-fact alternatives, not lines either dialogue
    speaker (نیما or آقای صادقی) actually says anywhere in this unit's
    dialogue -- نیما's opening line is clearly a NEW-loan request, not a
    return of an already-held item; he never asks FOR a card (آقای صادقی
    asks HIM); and neither speaker ever asks for or gives directions to the
    library (that's a separate, already-answered question from lesson01).
    Every "Translate into English" exercise in the paired overlay
    explicitly sets answer_language_code: en. The one genuine two-clause
    sentence tested for translation (lesson04.exercise05, "ممنون. تا
    سه‌شنبه.") carries period-joined, comma-joined, and and-joined English
    variants per §12; lesson05's reading-note translation and lesson06's
    review sentence are each single label-style sentences (matching
    unit41's own treatment of its comma-separated appointment note) with
    paraphrase-variant accepted answers rather than clause-join variants,
    same shape as unit41's equivalent exercises. Ran a recursive
    yaml.safe_load scan over this file and its paired overlay for bare
    unquoted yes/no/true/false/on/off values (including matching_pairs
    right: values specifically, the two fields that have bitten this corpus
    before) -- zero hits, see the overlay's own review note for the exact
    scan result.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما's own
    lines stay register-neutral, while the librarian-desk exchange (a
    stranger, new minor character آقای صادقی) uses the same polite/neutral
    service register unit22's phone lesson and unit41's dentist-office
    lesson already established. Reuses کارت (unit08, extended here from
    "payment card" to "library card"), دارید (units01/04/06/08/21), کی
    (units16/34), می‌دم (unit26), سه‌شنبه (unit10), and the full
    greeting/politeness set (سلام/ممنون/باشه/بله/بفرمایید/خواهش
    می‌کنم/خداحافظ) without re-teaching any of it from scratch. پس and تا
    are each given one new, equally common sense beyond their existing
    corpus meaning (see review notes).

