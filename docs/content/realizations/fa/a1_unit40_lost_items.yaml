generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Firecrawl remains at 0 credits this session, so
    used direct pdftotext extraction against both known mirrors, same method
    as units 36-39. The DigitalOcean-mirror copy
    (https://fsi-language-courses-media.nyc3.cdn.digitaloceanspaces.com/
    languages/Persian/General/Spoken%20Persian.pdf) re-confirmed a JBIG2-only
    scan: pdftotext extracted 0 words, same dead end as every prior unit's
    attempt against this mirror. The Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf) has a real
    Acrobat Pro DC OCR text layer, 66,717 words extractable this fetch
    (consistent with the ~66,445-66,717 range every prior unit's fetch of the
    same file has measured, confirming a stable extraction, not a fluke).
    Grepped the full extracted text case-insensitively for lost/missing/
    mislaid/misplaced/found/key/keys/wallet/purse/bag/suitcase/passport/
    umbrella/camera/"have you seen"/"did you see", and separately for the
    Persian transliterations gom/gomkard/peyda/didid: found two genuine but
    narrow hits, the same shape as unit39's finding -- "gom" ('lost')
    appearing once as an isolated glossary-table entry with a single-word
    English gloss and no surrounding lost-item scenario (~line 3446 of the
    extracted text), and "kif" ('pocket-book, purse') plus "kelid" ('key')
    both appearing in genuine dialogue, but from an unrelated taxi-luggage
    scene (a customer telling a taxi driver where to put the suitcases and
    briefcase) and an unrelated hotel check-in scene (a bellhop handing over
    a room key) -- neither is a lost-item report, and no
    lost/found/passport/umbrella/camera vocabulary or dialogue of any kind
    exists anywhere in the extracted text. This is a real, honest partial
    hit: slightly more than unit38/39's pure dead ends (two usable isolated
    words plus two words borrowed from unrelated real dialogue, not zero),
    but still no actual lost-item scenario to adapt. گم (lost), کیف (bag,
    generalized here from the source's narrower 'purse/pocket-book' sense to
    the modern colloquial umbrella meaning), and کلید (key) are used in this
    unit reflecting those three real but narrow source hits; گذرنامه
    (passport), چتر (umbrella), پیدا (found), and the full lost-item
    reporting dialogue/reading are authored fresh from this project's own
    established colloquial Iranian Farsi conventions and already-shipped
    vocabulary, not sourced from FSI.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), reviewed cold alongside
    units 39/41/42 in the same batch, no access to the authoring
    reasoning beyond what's recorded below this note. Found no real bugs
    -- unit40 is clean. Checked: the compiler validator (0 errors/0
    warnings standalone and as part of the full 39-42 group); a recursive
    yaml.safe_load boolean scan over both this file and the paired overlay
    for stray yes/no/true/false/on/off coercions (zero hits, only the two
    legitimate boolean fields human_reviewed/target_language_first); every
    exercise `type:` used (multiple_choice, matching_pairs, word_order,
    translation, dialogue_comprehension, dialogue_response,
    reading_comprehension, writing_prompt) is registered in
    ExerciseRenderer.tsx; no listen_select/dialogue_response exercise in
    this unit (confirmed, so the same-speaker/same-audio distractor bug
    class structurally cannot apply here) -- checked anyway that
    lesson04's dialogue_comprehension distractors ("He lost his
    key."/"He lost his passport."/"He lost his umbrella.") are invented
    plausible-fact paraphrases, not lines either dialogue speaker (نیما,
    آقای کریمی) actually says in the dialogue text; matching_pairs
    accepted_answers use this fa corpus's established flat-dict shape,
    consistent with unit38/39 and correctly graded either way by the
    backend's shape canonicalization; no snake_case/internal-jargon leaks
    into learner-facing text; every kind:vocabulary card has a genuine
    example sentence built only from earlier-declared tokens (schema 1.1/
    AUTHORING_GUIDE.md #19); no untaught vocabulary (confirmed by the
    compiler's own validator). Grammar/script spot-checked by hand: گم
    کردم/پیدا کردم ("I lost/found it") correctly extend unit13's -م
    past-tense pattern to کردن; دیدید ("did you see?", formal) is a
    regular consonant-stem past tense + -ید ending, correctly spelled with
    a single ی (unlike unit39's بیاید/بیایید issue -- دیدن's past stem
    دید already ends in a consonant, so no doubling is needed, and none is
    present); گمشده/پیداشده ("lost"/"found") are standard passive-adjective
    compounds; Persian keheh (ک U+06A9) and yeh (ی U+06CC) codepoints are
    used throughout, not the Arabic kaf/yeh variants. The register split
    (نیما's register-neutral lines vs. the formal شما-register used with
    the stranger آقای کریمی) is applied consistently and reads as natural
    Iranian Farsi, not Dari or machine-translated. Cross-lesson facts
    (which items are lost/found/still-lost in lesson05's reading notice)
    are internally consistent and don't contradict the lesson04 dialogue.

    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit39 (emergencies, merged).
    Realizes universal.a1.lost_items.report_lost_item, the next unrealized A1
    outcome after unit39 -- confirmed by an exact diff of every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files (handling multi-outcome
    units like unit05's places+directions merge correctly, not just the
    first array entry) against every universal.a1.* id in
    docs/content/universal_spine.yaml: fa had realized 40 of 47 A1 outcomes
    (unit05 covers both places and directions in one merged unit), with
    lost_items the next one in the spine's own declaration order and
    appointments/library/waste_disposal/accommodation/pharmacy/
    personal_care still unrealized after this unit. Both prerequisites --
    universal.a1.places.locate_common_places and
    universal.a1.shopping.ask_prices_quantities -- already covered (units
    05 and 08). Reuses unit05's کجاست/ببخشید, unit06's رو (colloquial object
    marker), unit02's این.../منه and اسمم/اسم شما چیه/...ست identity
    pattern, unit13's -م past-tense ending pattern (extended here to کردم,
    a genuinely new root/ending combination, and to دیدید, a new
    formal-2nd-person extension of unit13's دیدم paralleling the already-
    established هستید/بفرمایید formal -ید ending), and units 01/17's ممنون
    -- all re-declared in introduced_tokens before first tested use in THIS
    file because the compiler's untaught-vocabulary check is per-file only.
    Scoped to the outcome's four assessment requirements: understanding a
    spoken lost-item exchange (listening, via lesson04's dialogue plus its
    dialogue_comprehension exercise), stating an item is missing and asking
    whether it's been found (speaking/production, via translate/
    dialogue_response/writing_prompt exercises across lessons 01-06,
    covering all four items -- bag, key, passport, umbrella -- named in the
    spine outcome's own can_do text), interpreting a short written notice
    (reading, lesson05's reading_comprehension exercises against a
    found/still-lost notice), and writing a short lost/found message
    (writing, lessons05/06's writing_prompt exercises). Register choice,
    explicitly noted per AUTHORING_GUIDE.md #3: reporting a lost item to a
    stranger (a lost-and-found clerk, new minor character آقای کریمی, kept
    separate from the established نیما/سارا friend-register pair to avoid
    the same register-mixing risk unit39's own review flagged) uses the
    polite/formal شما-register forms (اسم شما چیه already established
    formal from unit02; دیدید newly introduced as a formal extension) while
    نیما's own 1st-person lines stay register-neutral -- the same
    stranger-vs-friend register split unit39 already established and
    justified, applied here to a different social context (a public
    lost-and-found desk, not a shouted emergency). Deliberately avoided the
    -م/‌ام possessive suffix on گذرنامه (which ends in ه and would need a
    ZWNJ-joined ‌ام form with no prior corpus precedent to match against) by
    using the already-established من + noun + رو pattern ("من گذرنامه رو
    گم کردم") instead -- equally natural colloquial Farsi, and avoids
    introducing an unverified new possessive-suffix orthography choice.
    Every kind:vocabulary card (کیف، کلید، گذرنامه، چتر، گمشده، پیداشده) has
    an example sentence per schema 1.1/AUTHORING_GUIDE §19, built only from
    the card's own word plus tokens already declared earlier in THIS file
    (no forward references). Every matching_pairs exercise has 6-7 pairs
    per §16. No listen_type/listen_select/listen_order exercise is used
    anywhere in this unit -- fa has real TTS per AUTHORING_GUIDE §14, but
    this file continues the established text-based corpus-consistency
    pattern from units 19-39, the same choice those units' own reviews
    made; this also means the same-speaker/same-audio distractor-collision
    bug class (found and fixed 2026-07-09 in the nl corpus, commit
    148240e) cannot apply here -- there is no listen_select exercise in
    this file to check. The one exercise with English-language distractors
    tied to dialogue content (lesson04's dialogue_comprehension, "What did
    Nima lose?") was explicitly checked: its three distractors ("He lost
    his key."/"He lost his passport."/"He lost his umbrella.") are
    plausible-fact alternatives, not lines either dialogue speaker (نیما or
    آقای کریمی) actually says anywhere in this unit's dialogue audio --
    only کیف (bag) is ever mentioned as the lost item in the dialogue
    itself, matching the exact same fact-based (not line-based) distractor
    pattern unit39's own dialogue_comprehension exercise already used.
    Every translate-into-English exercise in the paired overlay explicitly
    sets answer_language_code: en. Ran a recursive yaml.safe_load scan over
    this file and its paired overlay for bare unquoted yes/no/true/false/
    on/off values (including matching_pairs right: values specifically, the
    two fields that have bitten this corpus before) -- zero hits, see the
    overlay's own review note for the exact scan result.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما's own
    1st-person reports stay register-neutral, while the stranger-facing
    lost-and-found exchange with the new minor character آقای کریمی uses
    the polite/formal شما-register (اسم شما چیه, already established
    formal from unit02; دیدید, a new formal extension of unit13's دیدم
    paralleling the already-established هستید/بفرمایید formal -ید ending)
    -- the same stranger-vs-friend register split unit39 already
    established and justified, applied to a different public-service
    context. Reuses کجاست/ببخشید (unit05), رو (unit06), این.../منه and
    اسمم/اسم شما چیه/...ست (unit02), and ممنون (units 01/17) without
    re-teaching them from scratch.

