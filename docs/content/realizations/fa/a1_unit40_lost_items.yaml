    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: fa.a1.unit40.lost_items
    title: وسایل گمشده
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.lost_items.report_lost_item
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit40.lesson01.new_lost_items_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.lost_items.report_lost_item
        teaching:
          - content_key: fa.a1.unit40.lesson01.teach.review_in_maneh
            kind: grammar_note
            target: {text: "این ... منه (this is mine) -- already taught from units 02/03", language_code: fa, direction: rtl}
            introduced_tokens: [این, منه]
          - content_key: fa.a1.unit40.lesson01.teach.review_ra
            kind: grammar_note
            target: {text: "رو (colloquial object marker) -- already taught from unit06's food lesson", language_code: fa, direction: rtl}
            introduced_tokens: [رو]
          - content_key: fa.a1.unit40.lesson01.teach.review_man
            kind: grammar_note
            target: {text: "من (I) -- already taught from unit02", language_code: fa, direction: rtl}
            introduced_tokens: [من]
          - content_key: fa.a1.unit40.lesson01.teach.kif
            kind: vocabulary
            target: {text: کیف, language_code: fa, direction: rtl}
            introduced_tokens: [کیف]
            example: {text: "این کیف منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit40.lesson01.teach.kelid
            kind: vocabulary
            target: {text: کلید, language_code: fa, direction: rtl}
            introduced_tokens: [کلید]
            example: {text: "این کلید منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit40.lesson01.teach.gom_kardam
            kind: phrase
            target: {text: "گم کردم", language_code: fa, direction: rtl}
            introduced_tokens: [گم, کردم]
        exercises:
          - content_key: fa.a1.unit40.lesson01.exercise01.recognize_kif
            type: multiple_choice
            tested_text: کیف
            prompt: {target_blocks: [{text: کیف, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit40.lesson01.exercise02.recognize_kelid
            type: multiple_choice
            tested_text: کلید
            prompt: {target_blocks: [{text: کلید, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit40.lesson01.exercise03.match_lost_items_one
            type: matching_pairs
            tested_text: "کیف کلید گم کردم این کیف منه این کلید منه من کیف رو گم کردم"
            prompt: {target_blocks: []}
            pairs:
              - {left: کیف, right: bag}
              - {left: کلید, right: key}
              - {left: "گم کردم", right: "I lost (it)"}
              - {left: "این کیف منه.", right: "This bag is mine."}
              - {left: "این کلید منه.", right: "This key is mine."}
              - {left: "من کیف رو گم کردم.", right: "I lost my bag."}
          - content_key: fa.a1.unit40.lesson01.exercise04.word_order_man_kif_gom_kardam
            type: word_order
            tested_text: "من کیف رو گم کردم"
            prompt: {target_blocks: [{text: "I lost my bag!", language_code: en, direction: ltr}]}
            word_bank: [من, کیف, رو, گم, کردم]
          - content_key: fa.a1.unit40.lesson01.exercise05.translate_in_kelid_maneh
            type: translation
            tested_text: "این کلید منه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit40.lesson02.new_lost_items_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.lost_items.report_lost_item
        teaching:
          - content_key: fa.a1.unit40.lesson02.teach.gozarnameh
            kind: vocabulary
            target: {text: گذرنامه, language_code: fa, direction: rtl}
            introduced_tokens: [گذرنامه]
            example: {text: "این گذرنامه منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit40.lesson02.teach.chatr
            kind: vocabulary
            target: {text: چتر, language_code: fa, direction: rtl}
            introduced_tokens: [چتر]
            example: {text: "این چتر منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit40.lesson02.teach.peyda_kardam
            kind: phrase
            target: {text: "پیدا کردم", language_code: fa, direction: rtl}
            introduced_tokens: [پیدا]
        exercises:
          - content_key: fa.a1.unit40.lesson02.exercise01.recognize_gozarnameh
            type: multiple_choice
            tested_text: گذرنامه
            prompt: {target_blocks: [{text: گذرنامه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit40.lesson02.exercise02.recognize_chatr
            type: multiple_choice
            tested_text: چتر
            prompt: {target_blocks: [{text: چتر, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit40.lesson02.exercise03.match_lost_items_two
            type: matching_pairs
            tested_text: "گذرنامه چتر پیدا کردم این گذرنامه منه این چتر منه من کلید رو پیدا کردم"
            prompt: {target_blocks: []}
            pairs:
              - {left: گذرنامه, right: passport}
              - {left: چتر, right: umbrella}
              - {left: "پیدا کردم", right: "I found (it)"}
              - {left: "این گذرنامه منه.", right: "This passport is mine."}
              - {left: "این چتر منه.", right: "This umbrella is mine."}
              - {left: "من کلید رو پیدا کردم!", right: "I found my key!"}
          - content_key: fa.a1.unit40.lesson02.exercise04.word_order_man_gozarnameh_gom_kardam
            type: word_order
            tested_text: "من گذرنامه رو گم کردم"
            prompt: {target_blocks: [{text: "I lost my passport!", language_code: en, direction: ltr}]}
            word_bank: [من, گذرنامه, رو, گم, کردم]
          - content_key: fa.a1.unit40.lesson02.exercise05.translate_man_chatr_gom_kardam
            type: translation
            tested_text: "من چتر رو گم کردم."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit40.lesson03.asking_if_seen
        title: "پرسیدن درباره وسایل گمشده"
        spine_outcome_id: universal.a1.lost_items.report_lost_item
        teaching:
          - content_key: fa.a1.unit40.lesson03.teach.review_kojast_bebakhshid
            kind: grammar_note
            target: {text: "کجاست (where is) و ببخشید (excuse me) -- already taught from unit05", language_code: fa, direction: rtl}
            introduced_tokens: [کجاست, ببخشید]
          - content_key: fa.a1.unit40.lesson03.teach.review_didid_formal
            kind: grammar_note
            target: {text: "دیدید (did you see? formal) extends دیدم (I saw, unit13)'s -م past ending to the formal -ید ending, the same formal ending already seen in هستید/بفرمایید", language_code: fa, direction: rtl}
            introduced_tokens: [دیدید]
          - content_key: fa.a1.unit40.lesson03.teach.chatr_didid
            kind: phrase
            target: {text: "چتر رو دیدید؟", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.a1.unit40.lesson03.teach.gozarnameh_kojast
            kind: phrase
            target: {text: "گذرنامه کجاست؟", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit40.lesson03.exercise01.recognize_didid
            type: multiple_choice
            tested_text: "دیدید؟"
            prompt: {target_blocks: [{text: "دیدید؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit40.lesson03.exercise02.recognize_kojast
            type: multiple_choice
            tested_text: کجاست
            prompt: {target_blocks: [{text: کجاست, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit40.lesson03.exercise03.match_asking_seen
            type: matching_pairs
            tested_text: "دیدید کجاست ببخشید چتر رو دیدید گذرنامه کجاست من گذرنامه رو گم کردم"
            prompt: {target_blocks: []}
            pairs:
              - {left: "دیدید؟", right: "did you see?"}
              - {left: کجاست, right: "where is"}
              - {left: ببخشید, right: "excuse me"}
              - {left: "چتر رو دیدید؟", right: "Have you seen the umbrella?"}
              - {left: "گذرنامه کجاست؟", right: "Where is the passport?"}
              - {left: "من گذرنامه رو گم کردم.", right: "I lost my passport."}
          - content_key: fa.a1.unit40.lesson03.exercise04.word_order_chatr_didid
            type: word_order
            tested_text: "چتر رو دیدید"
            prompt: {target_blocks: [{text: "Have you seen the umbrella?", language_code: en, direction: ltr}]}
            word_bank: [چتر, رو, دیدید]
          - content_key: fa.a1.unit40.lesson03.exercise05.translate_bebakhshid_kif_didid
            type: translation
            tested_text: "ببخشید، کیف رو دیدید؟"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit40.lesson04.lost_bag_dialogue
        title: "دیالوگ: کیف گمشده"
        spine_outcome_id: universal.a1.lost_items.report_lost_item
        teaching:
          - content_key: fa.a1.unit40.lesson04.teach.review_esm_shoma_chiye
            kind: grammar_note
            target: {text: "اسم شما چیه؟ (what's your name? formal) -- already taught from unit02", language_code: fa, direction: rtl}
            introduced_tokens: [اسم, شما, چیه]
          - content_key: fa.a1.unit40.lesson04.teach.review_bashe_mamnoon
            kind: grammar_note
            target: {text: "باشه (okay) و ممنون (thanks) -- already taught from units 17/22", language_code: fa, direction: rtl}
            introduced_tokens: [باشه, ممنون]
          - content_key: fa.a1.unit40.lesson04.teach.dialogue_line1
            kind: dialogue
            target: {text: "ببخشید، کیف رو گم کردم.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [نیما]
          - content_key: fa.a1.unit40.lesson04.teach.dialogue_line2
            kind: dialogue
            target: {text: "باشه. اسم شما چیه؟", language_code: fa, direction: rtl, speaker: "آقای کریمی"}
            introduced_tokens: ["آقای", کریمی]
          - content_key: fa.a1.unit40.lesson04.teach.dialogue_line3
            kind: dialogue
            target: {text: "اسمم نیماست.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [اسمم, نیماست]
          - content_key: fa.a1.unit40.lesson04.teach.dialogue_line4
            kind: dialogue
            target: {text: "من این کیف رو پیدا کردم!", language_code: fa, direction: rtl, speaker: "آقای کریمی"}
            introduced_tokens: []
          - content_key: fa.a1.unit40.lesson04.teach.dialogue_line5
            kind: dialogue
            target: {text: "ممنون!", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
        exercises:
