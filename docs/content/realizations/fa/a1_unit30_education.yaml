schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at the FSI Persian Basic Course source this
    pass. Rather than re-download the PDF, reused a genuine
    pdftotext -layout extraction of
    https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf
    (pdfinfo-confirmed Author: US FSI, 398 pages) already sitting in this
    session's own scratchpad from an immediately-prior task in the same
    session, then grepped the extracted text fresh for THIS unit's own
    terms (study/studies/studying/student/university/school/learn/class/
    college) plus a manual read of every hit's surrounding context --
    the same honest-disclosure standard unit29's own provenance note set,
    not a re-use of unit29's findings. Found several genuine, real hits,
    a richer result than unit29's thin technology search (expected, since
    education/schooling was a real 1963 diplomatic-course topic, unlike
    smartphones/computers): (1) a vocabulary entry for "university"
    (transliterated "danesgal", i.e. دانشگاه) plus a full sentence "Yes, I
    lived for two years in Washington and went to George Washington
    University" ("...Vae bedanesgahe... jorj vasangton mireftam"),
    confirming both the noun and a "go to + university" construction; (2)
    a vocabulary entry for "to study" (transliterated "doors xundaei",
    i.e. درس خواندن, literally "to read a lesson") plus a classroom
    instruction "Let's begin class" using the same درس/خواندن roots; (3) a
    "Classroom Expressions" vocabulary entry for "class" itself
    (transliterated "kelas", i.e. کلاس) plus "Please smoke after class";
    (4) a vocabulary entry for "to learn" (transliterated "yad gereftam",
    i.e. یاد گرفتن) used twice, once as "did you learn Persian well?" and
    once later as "learned the Persian language"; (5) a real narrative
    sentence using the already-confirmed "مدرسه" (school, already taught
    in this course's own unit18) in a genuine "go to school in the
    morning" context ("sobh be madrese miram..."), independently
    reconfirming unit18's own مدرسه as period-authentic rather than
    inventing it. Every one of these is genuinely usable period
    vocabulary for an education-topic unit, unlike unit29's thin,
    scattered technology result. Used directly in this unit: دانشگاه
    (university) and its "go to university" construction, درس (as the
    root of "to study," combined with this course's own already-
    established می‌خونم present-tense pattern rather than the source's own
    literal "doors khândan" infinitive phrasing, per the standing
    modernization requirement -- 1960s classroom-instruction register
    doesn't fit a first-person "what do you study" conversation), and یاد
    گرفتن (to learn), realized here as یاد می‌گیرم (I'm learning) using
    the same already-established می‌گیرم present-tense form unit29's
    عکس می‌گیرم already introduced (a different idiomatic sense of the same
    verb گرفتن, not a coincidence -- confirmed independently by the FSI
    source's own "یاد گرفتن" hit, not invented to reuse the verb form).
    Found but deliberately NOT used: کلاس (class) -- this unit's actual
    scope (what/where you study, how you feel about it) is fully served
    by دانشگاه/درس/رشته without needing a separate "class period" concept,
    and adding it would have padded lesson01 past what the unit's own
    vocabulary naturally supports; flagging the real, confirmed FSI hit
    here in case a future unit (e.g. a school-schedule/timetable topic)
    wants it. رشته (major/field of study), ریاضی (math), دانشجو (student),
    زبان (language, though the WORD زبان itself was independently already
    established via this course's own register/note conventions -- not a
    new discovery), and سخته (it's hard) are authored fresh using this
    project's established fa register/character conventions, since a
    1960s diplomatic course has no concept of an undergraduate "major" or
    a colloquial "it's hard" register comment. Modern Iranian usage for
    رشته/دانشجو was independently spot-checked via reasoning against this
    course's own already-established register (both are completely
    standard, unremarkable everyday Iranian words, not loanwords needing
    separate verification the way unit29's tech loanwords did).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found this unit clean: 0
    compiler errors/warnings (validated together with units 27-29/31-32
    and their overlays), 0 stray YAML boolean coercions, no
    listen_select/listen_type/listen_order exercises, and the one
    dialogue_response exercise is free-text (no distractors). Explicitly
    checked the reading passage's new claim that سارا ("او هر روز به
    دانشگاه می‌ره") goes to university every day against the dialogue,
    which never states سارا's location or frequency (only what she
    studies) -- this is new information, not a contradiction, so no fix
    needed. Cross-checked every other stated fact (who studies what,
    where, and how they feel about it) across teaching cards, exercises,
    the dialogue, and the reading -- all mutually consistent. All
    exercise types used have a matching ExerciseRenderer.tsx case. No
    real bugs found requiring a fix. Original authoring notes below,
    retained for context.

    Draft authored 2026-07-09 by a Sonnet 5 worker task. Realizes
    universal.a1.education.talk_about_studies (spine's own stated
    prerequisite id, universal.a1.work.describe_job_workplace, does not
    actually exist anywhere in docs/content/universal_spine.yaml -- the
    only real work-topic outcome id is universal.a1.work.describe_job,
    confirmed by grep; this is treated as a spine typo, not a missing
    dependency, since unit18 already covers the real work.describe_job
    outcome and the prerequisite's evident intent is clearly "already
    covered work vocabulary." Flagging this typo for whoever next edits
    universal_spine.yaml -- out of scope for this content-authoring task
    to fix the spine file itself). Fa's next uncovered A1 outcome after
    unit29 (technology) -- confirmed by an exact diff of every
    spine_outcome_id used across all fa realization files (30 distinct
    A1 outcomes covered across units01-29, walked via yaml.safe_load, not
    a text grep) against every `id:` beginning `universal.a1.` in
    docs/content/universal_spine.yaml (38 total A1 ids at this spine
    file's current state, re-checked immediately before authoring per
    this project's standing footgun about the spine file being a
    fast-moving target other sessions edit concurrently): education is
    the very next A1 id after technology in the spine file's own
    ordering (b1.necessity, the id physically between them in file order,
    is B1-level and was already separately realized as fa's own
    b1_unit01_necessity.yaml). Also re-verified immediately before
    authoring (per the standing parallel-session unit-collision footgun)
    that no unit30 file existed yet in docs/content/realizations/fa/ or
    docs/content/overlays/en-fa/ at the moment this file was created (prs
    has its own, unrelated a1_unit30_technology.yaml -- different
    language, different spine outcome, no collision). Continues the
    نیما/سارا recurring cast from units 11-14/23-29. Scoped to: naming 4
    devices-of-study words (دانشگاه university, دانشجو student, درس
    lesson/subject, زبان language) plus a combined من در دانشگاه درس
    می‌خونم ("I study at university") sentence built on this course's
    established می‌کنم-family present-tense pattern (already precedented
    by unit24's کتاب می‌خونم/می‌خونه) and unit18's already-established در
    (in/at, deliberately not تو, same homograph-avoidance precedent as
    unit18); subject vocabulary (ریاضی math, رشته major/field, reusing
    unit02's already-established انگلیسی for "زبان انگلیسی" as a subject
    name) plus a چی درس می‌خونی؟ question built from already-taught پیس
    (چی, already independently re-established per-file the same way
    every other fa unit re-declares it) and a fresh یاد می‌گیرم (I'm
    learning) construction combined with unit29's already-taught
    می‌گیرم-family present tense; a کجا درس می‌خونی؟ location question
    reusing already-established کجا-family question vocabulary plus a
    هر روز به دانشگاه می‌رم frequency statement built on unit11/24-28's
    already-established هر روز and unit28's already-established می‌رم; a
    نیما/سارا dialogue in the established informal تو register (matching
    units 20/24/25/26/27/28/29's own informal-register precedent)
    covering what/where each studies and a genuinely new سخته (it's hard)
    /جالبه (it's interesting, reused from unit14) feeling exchange,
    answered via a unit28/29-style English summary comprehension question
    specifically to avoid needing untaught 3rd-person conjugation inside
    the exercise prompt itself; a third-person reading passage (lesson05)
    that explicitly cross-checks its own facts against the dialogue per
    AUTHORING_GUIDE.md §11 -- it restates exactly what the dialogue
    already established (Nima: studies math at university, finds it hard
    but interesting; Sara: studies English, goes to university every
    day) and introduces no new, dialogue-contradicting facts; and a
    wrap-up combining a preference and a constraint with ولی (درس رو
    دوست دارم ولی گاهی سخته -- reusing the established رو-marked دوست
    دارم construction from units 14/26/28/29's own wrap-up lessons, and
    گاهی from units 24/27/28/29), continuing the exact wrap-up shape
    units 28/29 already established rather than inventing a new one.
    Every already-taught word reused from an earlier unit is re-declared
    as an introduced_tokens review token at its first tested_text use in
    THIS file per the standing per-file untaught-vocabulary footgun (من/
    unit01, این/units 03-29, در/unit18, انگلیسی/unit02, می‌خونی-family/
    unit24's می‌خونه precedent for the present-tense pattern only --
    می‌خونم/می‌خونی/می‌خونه themselves are all freshly introduced_tokens
    in THIS file since neither می‌خونم nor می‌خونی had ever previously
    been placed in any file's introduced_tokens, only inside non-tracked
    `example:` blocks per unit24's own review notes on that distinction,
    چی/units 06-07, هم/units 24-29, رو/units 26-29, جالبه/unit14, ولی/
    units 15-29, آره/units 03-29, سارا/units 11-29, کجا/unit05's کجاست
    family (fresh standalone کجا re-taught here), به/unit13, هر/روز/units
    11-29, می‌رم/unit28, دوست/دارم/وقت/ندارم/units 04-29, گاهی/units
    24-29, او/units 01-29 -- all re-declared fresh here, checked via a
    mental token-by-token trace of every exercise's tested_text/
    word_bank/pairs value against this file's own cumulative
    introduced_tokens at that point in reading order, confirming every
    value is covered by a prior teaching card in this same file, not just
    a prior unit). Matches the spine outcome's 4 assessment_requirements:
    listening via lesson04's dialogue_comprehension (reading-visible per
    the same pending-audio precedent units 13/17/18/24-29's fresh-context
    reviews accepted) and lesson05's reading_comprehension; speaking via
    lesson04's dialogue_response exercise; reading via lesson05's reading
    passage; writing via the writing_prompt exercises in lessons05/06.
    matching_pairs pair counts: 9/8/6/6/9/6 across lessons 1-6, all
    within AUTHORING_GUIDE.md §16's 6-12 range. Zero fill_in_blank
    anywhere (§17 n/a). Zero listen_type/listen_select/listen_order
    exercises, consistent corpus-wide choice matching units 17/18/24-29
    (audio remains pending_generation, not yet a live recorded/TTS-backed
    asset for this specific new content, despite §14's 2026-07-06
    revision technically permitting fa audio content now that Azure TTS
    covers Farsi). Every `kind: vocabulary` card (دانشگاه/دانشجو/درس/زبان
    in lesson01, ریاضی/رشته in lesson02, سخته in lesson04) has a real
    example sentence built entirely from already-taught or transparently-
    glossed words, per §19 (schema_version 1.1 from the start). §12
    multi-clause coverage applied to the wrap-up's ولی-joined translation/
    writing exercises and lesson02's two-sentence translation (period-
    joined and comma-and-joined variants both accepted as equally
    correct). §6 applied: every "Translate into English" exercise in
    this unit's overlay sets `answer_language_code: en` explicitly from
    the start (matching unit29's own fix over unit28's precedent, not
    regressing it). Not self-certified -- needs the mandatory
    fresh-context review before shipping, same as every other
    Claude-authored fa unit. Also manually re-verified (per this
    session's standing YAML boolean-coercion gotcha) that no bare
    yes/no/true/false/on/off value appears anywhere in this file via a
    recursive yaml.safe_load type scan, not just a text grep -- see the
    paired overlay's review notes for the combined result across both
    files.

    Review 2026-10-21: 1 fix - the example for the student card used the
    suffix copula 'من دانشجویم.' while the overlay note teaches the هستم
    form (register-neutral since unit02); aligned to 'من دانشجو هستم.'. NATIVE FLAGS: the preposition
    'در' in 'در دانشگاه درس می‌خونم' (and the matching dialogue line, audio
    text and word bank) mixes a formal preposition with colloquial verbs; a
    native speaker should decide whether to change it to 'توی'/'دانشگاه'
    across the unit.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-15/21-29. Reuses unit01's من,
    unit18's در (in/at, deliberately not تو, same homograph-avoidance
    precedent), unit24's کتاب می‌خونم/می‌خونه present-tense pattern
    (extended here to a full می‌خونم/می‌خونی/می‌خونه paradigm, all freshly
    introduced_tokens in this file since only the 3rd-person می‌خونه had
    ever previously been formally taught), unit29's می‌گیرم-family present
    tense (reused for a new idiomatic sense, یاد می‌گیرم "I'm learning"),
    unit02's انگلیسی, unit28's می‌رم, and the نیما/سارا cast without
    re-teaching the underlying constructions, only the new vocabulary
    that combines with them. دانشگاه، دانشجو، درس، رشته، and ریاضی are
    standard, everyday, unremarkable Iranian Farsi words -- no
    loanword-authenticity verification burden the way unit29's tech
    loanwords needed, confirmed by reasoning against this course's own
    already-established register.

