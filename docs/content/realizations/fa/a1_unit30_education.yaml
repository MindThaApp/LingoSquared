          - content_key: fa.a1.unit30.lesson02.exercise03.match_subject_words
            type: matching_pairs
            tested_text: "ریاضی رشته یاد می‌گیرم می‌خونی چی هم چی درس می‌خونی رشته‌ی من ریاضیه"
            prompt: {target_blocks: []}
            pairs:
              - {left: ریاضی, right: math}
              - {left: رشته, right: "major / field of study"}
              - {left: "یاد می‌گیرم", right: "I'm learning"}
              - {left: "می‌خونی", right: "you study/read (informal)"}
              - {left: چی, right: what}
