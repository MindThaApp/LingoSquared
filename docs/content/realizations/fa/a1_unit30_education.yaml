          - content_key: fa.a1.unit30.lesson02.exercise05.translate_major_and_learning
            type: translation
            tested_text: "رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit30.lesson03.where_and_frequency
        title: "کجا درس می‌خونی؟"
        spine_outcome_id: universal.a1.education.talk_about_studies
