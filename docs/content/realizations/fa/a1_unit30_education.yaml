units:
  - content_key: fa.a1.unit30.education
    title: تحصیلات
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.education.talk_about_studies
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit30.lesson01.study_vocabulary
        title: "کلمات درس و دانشگاه"
        spine_outcome_id: universal.a1.education.talk_about_studies
        teaching:
          - content_key: fa.a1.unit30.lesson01.teach.daneshgah_word
            kind: vocabulary
            target: {text: دانشگاه, language_code: fa, direction: rtl}
            introduced_tokens: [دانشگاه]
            example: {text: "این دانشگاه خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit30.lesson01.teach.daneshjoo_word
            kind: vocabulary
            target: {text: دانشجو, language_code: fa, direction: rtl}
            introduced_tokens: [دانشجو]
            example: {text: "من دانشجو هستم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit30.lesson01.teach.dars_word
            kind: vocabulary
            target: {text: درس, language_code: fa, direction: rtl}
            introduced_tokens: [درس]
            example: {text: "این درس جالبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit30.lesson01.teach.zaban_word
            kind: vocabulary
            target: {text: زبان, language_code: fa, direction: rtl}
            introduced_tokens: [زبان]
            example: {text: "فارسی یک زبانه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit30.lesson01.teach.review_man_in
            kind: grammar_note
            target: {text: "من (I) / این (this)", language_code: fa, direction: rtl}
            introduced_tokens: [من, این]
          - content_key: fa.a1.unit30.lesson01.teach.review_dar
            kind: grammar_note
            target: {text: "در (in / at)", language_code: fa, direction: rtl}
            introduced_tokens: [در]
          - content_key: fa.a1.unit30.lesson01.teach.mikhonam_pattern
            kind: grammar_note
            target: {text: "خوندن (to study/read) + م = می‌خونم (I study/read)", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌خونم"]
          - content_key: fa.a1.unit30.lesson01.teach.combined_sentence
            kind: phrase
            target: {text: "من در دانشگاه درس می‌خونم.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit30.lesson01.exercise01.recognize_daneshgah
            type: multiple_choice
            tested_text: دانشگاه
            prompt: {target_blocks: [{text: دانشگاه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit30.lesson01.exercise02.recognize_daneshjoo
            type: multiple_choice
            tested_text: دانشجو
            prompt: {target_blocks: [{text: دانشجو, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit30.lesson01.exercise03.match_study_words
            type: matching_pairs
            tested_text: "دانشگاه دانشجو درس زبان من این در می‌خونم من در دانشگاه درس می‌خونم"
            prompt: {target_blocks: []}
            pairs:
              - {left: دانشگاه, right: university}
              - {left: دانشجو, right: student}
              - {left: درس, right: "lesson / subject"}
              - {left: زبان, right: language}
              - {left: من, right: I}
              - {left: این, right: this}
              - {left: در, right: "in / at"}
              - {left: "می‌خونم", right: "I study/read"}
              - {left: "من در دانشگاه درس می‌خونم.", right: "I study at university."}
          - content_key: fa.a1.unit30.lesson01.exercise04.word_order_study_university
            type: word_order
            tested_text: "من در دانشگاه درس می‌خونم"
            prompt: {target_blocks: [{text: "I study at university.", language_code: en, direction: ltr}]}
            word_bank: [من, در, دانشگاه, درس, "می‌خونم"]
          - content_key: fa.a1.unit30.lesson01.exercise05.translate_study_university
            type: translation
            tested_text: "من در دانشگاه درس می‌خونم"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit30.lesson02.subjects
