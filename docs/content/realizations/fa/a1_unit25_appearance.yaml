schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at genuine FSI Persian Basic Course source
    text this pass (not reused from unit24's prior finding). Fetched
    https://fsi-languages.yojik.eu/languages/FSI/Persian/Spoken%20Persian.PDF
    (ERIC ED053628, "Persian Basic Course: Units 1-12", Obolensky/Yazdan
    Panah/Khaje Nouri, FSI/Center for Applied Linguistics, May 1963) as a
    real PDF and read its actual table-of-contents page images directly
    (pages 1-8, via a genuine Read-tool page-image extraction, not a
    text-only WebFetch -- the WebFetch text extraction failed outright on
    this scanned JBIG2-compressed document, confirming it is truly a
    scanned source and not something a naive fetch could have faked past).
    Re-confirmed the same structural fact unit24 found independently: all
    12 units are organized entirely by GRAMMATICAL progression (Unit 1
    pronunciation/spelling; Unit 2 verb endings/prefixes; Unit 3 pronouns;
    Unit 4 comparative/superlative suffix -tar; Unit 5 degrees of
    politeness; Unit 6 prepositions/tenses; Unit 7 passive voice/counters;
    Unit 8 past perfect/progressive; Unit 9 causative suffix; Unit 10 the
    verb neshastan/imperative; Unit 11 expressions of time -- see the
    actual table of contents read this pass), never by vocabulary topic.
    No unit is dedicated to describing a person's physical appearance
    (height, hair, eyes, glasses); the closest adjacent material is Unit
    4's comparative/superlative grammar point (-tar suffix), which this
    unit deliberately does NOT re-teach (see review notes below -- already
    a separate realized outcome, unit15). Given this is a second,
    independently-confirmed structural fact about the source, authored
    using this project's own established fa register/character
    conventions instead, per docs/content/AUTHORING_GUIDE.md's
    modernization standard.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft authored 2026-07-08 by a Sonnet 5 fork. Realizes
    universal.a1.appearance.describe_physical_appearance (prerequisite:
    universal.a1.family.describe_relationships, covered by unit04 --
    reuses its established برادر/خواهر/دارم pattern's grammar, not its
    vocabulary directly). Fa's next uncovered A1 outcome after unit24
    (hobbies) -- confirmed by an exact diff of every spine_outcome_id used
    across all fa realization files against every A1-level `id:` in
    docs/content/universal_spine.yaml (25 distinct A1 outcomes covered
    across units01-24; appearance is the next one in spine declaration
    order after hobbies, matching the same outcome nl unit30 just
    realized). Deliberately avoids re-teaching comparatives (taller than /
    shorter than) since universal.a1.comparisons.make_basic_comparisons is
    already a separate, already-realized outcome (unit15) -- this unit
    stays to plain has/is descriptive statements only (بلنده/کوتاهه/
    مشکیه/قهوه‌ایه fused copula predicates), not comparison, mirroring the
    same scoping decision already made in the shared English
    a1_unit31_appearance.yaml realization. Continues the نیما/سارا
    recurring cast from units 11-14/23/24, introducing one new
    incidental character (مریم, a friend سارا wants نیما to recognize at
    a cafe) purely as a described third party, never a speaking
    character -- same pattern unit24 used for its own cast continuity.
    Scoped to: height (بلند/کوتاه + قدش fused predicate, reviewing قد from
    unit15), hair length/color (مو, موی ezafe form, موهاش fused
    possessive, مشکی, بلوند), eye color (چشم, چشمای, چشماش fused
    possessive, قهوه‌ای, سبز, and آبی reviewed from unit20 alongside رنگ),
    glasses (عینک + می‌زنه, a genuinely new verb -- زدن, not a reuse of
    unit08/unit24's می‌کنم), the question "چه شکلیه؟" (what does s/he look
    like), a short reading passage self-describing نیما (reusing every
    construction from lessons 1-4, near-zero new vocabulary), and a
    closing نیما/سارا dialogue about recognizing مریم at a cafe that
    reuses the "چه شکلیه؟"/"چه رنگیه؟" question pattern and every prior
    lesson's copula constructions almost verbatim -- deliberate heavy
    recycling for spiral reinforcement, not laziness. Grammatical note for
    the fresh-context reviewer: چشماش/موهاش are grammatically PLURAL
    inanimate subjects (چشم/مو pluralized + possessive), which correctly
    take SINGULAR copula agreement in Persian (چشماش آبیه, not
    "چشماش آبیه‌ان") per Persian's inanimate-plural-singular-verb-
    agreement rule -- verified this is a real grammar rule, not a
    simplification, before using it throughout. Matches the spine
    outcome's 4 assessment_requirements exactly (listening via lesson06's
    dialogue_comprehension -- reading-visible per the same precedent
    unit13/unit24's fresh-context reviews accepted, since audio remains
    pending_generation; speaking via the dialogue_response exercise;
    reading via lesson05's reading_comprehension; writing via the
    writing_prompt exercises in lessons05/06). matching_pairs pair counts
    grow across the unit by pooling cumulative in-unit vocabulary (4/7/8/
    7/8/8 pairs, lessons 1-6) per AUTHORING_GUIDE.md #16 -- lesson01 stays
    smallest as the genuine first-lesson ceiling (only 4 items exist yet
    to pair), matching the unit11/unit12/unit23/unit24 precedent for a
    unit's own first lesson; lesson04 dips slightly to 7 rather than
    strictly monotonic growth, which is fine per the guide's "as much as
    the unit's taught vocabulary genuinely supports" standard rather than
    a strict-increase requirement. Not self-certified -- needs the
    mandatory fresh-context review before shipping, same as every other
    Claude-authored fa unit. Per this session's standing compiler
    gotcha (the untaught-vocabulary check is per-file only): every
    already-taught word reused from an earlier unit (قد/unit15,
    آبی+رنگ/unit20, من/او/دارم-داره family/units01-04, الان/unit06,
    باشه+ممنون/unit20, نیما+سارا/units11-14) is re-declared as an
    introduced_tokens review token at its first use in THIS file.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-14/21-24. Reuses unit15's قد,
    unit20's رنگ/آبی, unit04's دارم/داره family, unit06's الان, unit20's
    باشه/ممنون, and unit11-14's نیما/سارا cast without re-teaching the
    underlying constructions, only the new vocabulary that combines with
    them. New fused possessive forms (قدش، موهاش، چشماش) follow the same
    -ash suffix precedent already established by unit20's امتحانش.

