        spine_outcome_id: universal.a1.appearance.describe_physical_appearance
        teaching:
          - content_key: fa.a1.unit25.lesson03.teach.cheshm_word
            kind: vocabulary
            target: {text: چشم, language_code: fa, direction: rtl}
