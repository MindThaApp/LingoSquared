              - {left: کوتاه, right: short}
              - {left: مو, right: hair}
              - {left: مشکی, right: black}
              - {left: چشم, right: eye}
              - {left: "قهوه‌ای", right: brown}
              - {left: سبز, right: green}
          - content_key: fa.a1.unit25.lesson03.exercise04.word_order_his_eyes_are_green
