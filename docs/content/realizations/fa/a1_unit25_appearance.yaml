              - {left: بلوند, right: blond}
          - content_key: fa.a1.unit25.lesson02.exercise04.word_order_her_hair_is_black
            type: word_order
            tested_text: "او موهاش مشکیه"
            prompt: {target_blocks: [{text: "Her hair is black.", language_code: en, direction: ltr}]}
            word_bank: [او, موهاش, مشکیه]
          - content_key: fa.a1.unit25.lesson02.exercise05.translate_her_hair_is_blond
            type: translation
            tested_text: "موهاش بلونده"
            prompt: {target_blocks: []}

