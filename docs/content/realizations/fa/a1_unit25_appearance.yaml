units:
  - content_key: fa.a1.unit25.appearance
    title: ظاهر
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.appearance.describe_physical_appearance
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit25.lesson01.height
        title: "قد بلند و کوتاه"
        spine_outcome_id: universal.a1.appearance.describe_physical_appearance
        teaching:
          - content_key: fa.a1.unit25.lesson01.teach.oo_review
            kind: grammar_note
            target: {text: "او", language_code: fa, direction: rtl}
            introduced_tokens: [او]
          - content_key: fa.a1.unit25.lesson01.teach.ghad_review
            kind: vocabulary
            target: {text: قد, language_code: fa, direction: rtl}
            introduced_tokens: [قد, قدش]
            example: {text: "قد نیما بلنده.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit25.lesson01.teach.boland_word
            kind: vocabulary
            target: {text: بلند, language_code: fa, direction: rtl}
            introduced_tokens: [بلند, بلنده]
            example: {text: "قدش بلنده.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit25.lesson01.teach.kotah_word
            kind: vocabulary
            target: {text: کوتاه, language_code: fa, direction: rtl}
            introduced_tokens: [کوتاه, کوتاهه]
            example: {text: "قدش کوتاهه.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit25.lesson01.exercise01.recognize_boland
            type: multiple_choice
            tested_text: بلند
            prompt: {target_blocks: [{text: بلند, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit25.lesson01.exercise02.recognize_kotah
            type: multiple_choice
            tested_text: کوتاه
            prompt: {target_blocks: [{text: کوتاه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit25.lesson01.exercise03.match_height_vocab
            type: matching_pairs
            tested_text: "او قد بلند کوتاه"
            prompt: {target_blocks: []}
            pairs:
              - {left: او, right: "he / she"}
              - {left: قد, right: height}
              - {left: بلند, right: tall}
              - {left: کوتاه, right: short}
          - content_key: fa.a1.unit25.lesson01.exercise04.word_order_he_is_tall
            type: word_order
            tested_text: "او قدش بلنده"
            prompt: {target_blocks: [{text: "He is tall.", language_code: en, direction: ltr}]}
            word_bank: [او, قدش, بلنده]
          - content_key: fa.a1.unit25.lesson01.exercise05.translate_she_is_short
            type: translation
            tested_text: "او قدش کوتاهه"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit25.lesson02.hair
        title: "موی مشکی و بلوند"
        spine_outcome_id: universal.a1.appearance.describe_physical_appearance
        teaching:
          - content_key: fa.a1.unit25.lesson02.teach.mo_word
            kind: vocabulary
            target: {text: مو, language_code: fa, direction: rtl}
            introduced_tokens: [مو, موی]
            example: {text: "او موی بلند داره.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit25.lesson02.teach.moohash_word
            kind: grammar_note
            target: {text: موهاش, language_code: fa, direction: rtl}
            introduced_tokens: [موهاش]
          - content_key: fa.a1.unit25.lesson02.teach.meshki_word
            kind: vocabulary
            target: {text: مشکی, language_code: fa, direction: rtl}
            introduced_tokens: [مشکی, مشکیه]
            example: {text: "موهاش مشکیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit25.lesson02.teach.bolond_word
            kind: vocabulary
            target: {text: بلوند, language_code: fa, direction: rtl}
            introduced_tokens: [بلوند, بلونده]
            example: {text: "موهاش بلونده.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit25.lesson02.exercise01.recognize_mo
