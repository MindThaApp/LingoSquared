            prompt: {target_blocks: [{text: "قهوه‌ای", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit25.lesson03.exercise03.match_eye_vocab
            type: matching_pairs
            tested_text: "قد بلند کوتاه مو مشکی چشم قهوه‌ای سبز"
