            kind: grammar_note
            target: {text: "من (I) -- already taught from unit02 / دارم (I have) -- already taught from unit12 / دارید (you have, formal) -- already taught from unit06", language_code: fa, direction: rtl}
            introduced_tokens: [من, دارم, دارید]
          - content_key: fa.a1.unit44.lesson01.teach.hotel
            kind: vocabulary
            target: {text: هتل, language_code: fa, direction: rtl}
            introduced_tokens: [هتل]
            example: {text: "هتل کجاست؟", language_code: fa, direction: rtl}
