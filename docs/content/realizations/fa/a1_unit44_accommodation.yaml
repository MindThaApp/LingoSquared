generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Firecrawl remains at 0 credits this session, so
    used direct pdftotext extraction against the Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf), the
    mirror with a real Acrobat Pro DC OCR text layer per every prior unit's
    finding this session (the DigitalOcean mirror is a JBIG2-only scan, 0
    extractable words, not re-attempted here since that dead end is already
    confirmed stable across units 36-43). This fetch extracted 66,717 words,
    consistent with every prior fetch of the same file. Grepped the full
    extracted text case-insensitively for hotel/room/checkin/check-in/
    reservation/reserve/lodging/guesthouse/hostel/breakfast/passport/wifi/
    receptionist: 137 hits, a genuine, substantive positive result (unlike
    every one of units 39-43's dead ends). Unit 3's grammar notes (around
    the printed "Hotel" section header) contain real attested vocabulary and
    sentence patterns: /mehmanxane/ (مهمانخانه, "hotel/guesthouse") is FSI's
    taught word for hotel, in sentences like "این نزدیکیا مهمانخانه خوب
    کجاست؟" ("Excuse me sir, where is a good hotel in this vicinity?"),
    "راست برید، بپیچید، دست راست، یه مهمانخانه اونجاست." ("Go straight,
    turn right, there's a hotel there."), and "این مهمانخانه رستوران هم
    داره؟ / بله یه رستوران خوب داره تو این مهمانخانه." ("Does this hotel
    have a restaurant too? / Yes, there's a good restaurant in this
    hotel."). However, on inspection this FSI material is overwhelmingly a
    grammar lecture (pronoun suffixes, the plural /-ha/ suffix, the verb
    'to be') that happens to use hotel-themed example sentences, not a
    structured check-in/booking/room-service dialogue -- no room type,
    breakfast, wifi, key, or checkout-time content exists anywhere in the
    extracted text despite the substantive "kojast"/"dare" hits. Credited
    honestly where genuinely used: مهمانخانه is FSI's real attested word for
    "hotel," but this unit deliberately teaches the everyday colloquial
    loanword هتل instead (see the register note in the review below for why
    -- a live, disclosed dialect-authenticity choice, not an oversight), and
    the "X کجاست؟"/"X داره؟" question patterns FSI attests are already this
    project's own established grammar (unit05's کجاست, unit06/42's دارید)
    reused here rather than newly borrowed. All check-in/booking/room-
    service vocabulary and the full dialogue in this unit (رزرو, صبحانه,
    وای‌فای, خروج, آماده, مهمان) is authored fresh from this project's own
    established colloquial Iranian Farsi conventions and already-shipped
    vocabulary (see review notes below for the exact reuse chain), since no
    such content exists in the FSI source despite the real, substantive
    "hotel" hit count.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit43 (waste disposal, merged).
    Realizes universal.a1.accommodation.check_into_lodging, the next
    unrealized A1 outcome after unit43 -- confirmed by a real
    yaml.safe_load recursive scan (not grep) of every spine_outcome_ids/
    spine_outcome_id value across all docs/content/realizations/fa/
    a1_unit*.yaml files against every universal.a1.* id in
    docs/content/universal_spine.yaml: fa had realized 44 of 51 A1 outcomes
    through unit43 (waste_disposal), with accommodation, pharmacy,
    personal_care, bike_rental, laundry, and swimming_pool remaining --
    accommodation is the first of these in the spine's own declaration
    order (waste_disposal -> accommodation -> pharmacy -> personal_care ->
    bike_rental -> laundry -> swimming_pool -> restaurant), so this unit
    covers it; pharmacy/personal_care/bike_rental/laundry/swimming_pool/
    restaurant remain unrealized after this unit. The
    universal.a1.accommodation.check_into_lodging outcome itself is not new
    -- it was added earlier this session by the nl (Dutch) content lane
    (git log confirms nl unit49 "Add nl unit49 (checking into a hotel)" is
    its origin), so no new spine outcome needed adding here, just fa
    catching up to an outcome that already exists. Prerequisite outcomes
    (numbers.use_basic_numbers/unit03, dates.exchange_calendar_dates/
    unit10, travel.handle_basic_journey/unit16) are all already realized in
    this course, so no prerequisite gap blocks this unit.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, which validates each exercise's tested_text against tokens
    introduced anywhere earlier in the SAME file's document order): کجاست
    (unit05), اتاق (unit19), کلید (unit40), من (unit02), دارم (unit12,
    "کار دارم"), دارید (unit06/42), چند (units03/04), شب (unit09), این
    (unit08), ساعت (unit09), هفت/ده/دو/دوازده (unit03), می‌تونم/کنم
    (unit20), خوش/اومدید (unit06), چنده (unit09), سلام/ممنون (units01/17/
    22), باشه (units01/02/06/17/22), بله (unit06), اسمم/نیما (unit02, and
    نیما is this course's already-established recurring traveler character
    from units 16/20), شما (unit01), از/تا (unit16, unit42), هم (unit01),
    ظهر (unit09), خداحافظ (units01/05/16), تخت (unit19), تاریخ/دوشنبه/
    چهارشنبه (unit10). New vocabulary genuinely introduced for the first
    time in the whole corpus: هتل (hotel), رزرو (reservation/booking),
    صبحانه (breakfast), وای‌فای (wifi), خروج (checkout/departure), آماده
    (ready), and مهمان (guest) -- exactly 7 new words, consistent with this
    unit's own deliberate grammar-simplicity choice (no new verb
    conjugation pattern is introduced; every verb form used -- دارم/دارید,
    می‌تونم/کنم -- was already established by an earlier unit).

    Register/character choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring traveler from units 16/20) is the guest, checking
    into a hotel after a trip -- a natural continuation of his established
    role rather than a new character. A NEW formal-register character,
    آقای کریمی, is introduced as the hotel receptionist (distinct from
    unit41's خانم احمدی and unit42's آقای صادقی, avoiding any surname
    collision with either); he speaks in neutral polite service language
    (دارید/شما), consistent with the librarian's register in unit42 and the
    receptionist's register in unit41, while نیما keeps the same informal
    register he uses everywhere else in the corpus (باشه, no شما toward
    him). Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: breakfast hours (seven to ten) are stated
    identically in the dialogue (lesson04) and nowhere contradicted
    elsewhere; checkout time (twelve noon) is stated once, in the dialogue,
    and not repeated with a different value anywhere; the guest name (نیما)
    and room type (دو تخته, a double/two-bed room) in lesson05's reading
    confirmation note are independent, unconnected details from the
    dialogue's own booking (a separate example booking note, not implying
    it is literally the same stay depicted in lesson04's dialogue, the same
    "independent example" pattern unit19's own fresh-context review
    confirmed is fine for a reading text that names no shared identifying
    detail forcing a same-event reading). Every kind:vocabulary card (هتل،
    رزرو، صبحانه، وای‌فای، آماده، خروج، مهمان) has an example sentence per
    schema 1.1/AUTHORING_GUIDE §19, built only from the card's own word plus
    tokens already declared earlier in THIS file (no forward references).
    Every matching_pairs exercise has 6-7 pairs per §16 (lesson01: 6,
    lesson02: 6, lesson03: 6, lesson04: 7 dialogue-line pairs matching the
    dialogue's own 7 turns, lesson05: 6, lesson06: 7 -- exactly this unit's
    7 new words, mirroring unit43's own wrap-up pattern of reviewing only
    the unit's own new vocabulary). No listen_type/listen_select/
    listen_order exercise is used anywhere in this unit -- fa has real TTS
    per AUTHORING_GUIDE §14, but this file continues the established
    text-based corpus-consistency pattern from units 19-43, the same choice
    those units' own reviews made; this also means the same-speaker/
    same-audio distractor-collision bug class (found and fixed 2026-07-09
    in the nl corpus, commit 148240e) cannot directly apply here -- there is
    no listen_select exercise in this file to check. Checked anyway, since
    lesson04's dialogue_comprehension exercise is the closest analogue: its
    three distractors ("He wants to know if the hotel has a restaurant."/
    "He wants to know where the key is."/"He wants to know the room
    price.") are plausible-fact alternatives, NOT lines either dialogue
    speaker (نیما or آقای کریمی) actually says or facts either speaker
    actually states anywhere in this unit's dialogue -- a restaurant, the
    key, and a price are never mentioned by either speaker in this
    dialogue at all. Deliberately avoided a distractor like "he wants to
    know if there's wifi" precisely because نیما DOES ask that later in the
    same dialogue ("وای‌فای دارید؟") -- that would have been a real
    distractor/dialogue-content collision of the same shape as the
    documented same-speaker-audio footgun, even though this exercise isn't
    audio-based. Every "Translate into English" exercise in the paired
    overlay explicitly sets answer_language_code: en. The one genuine
    two-clause sentence tested for translation (lesson04.exercise05, "بله.
    ساعت خروج هم دوازده ظهره.") carries period-joined, comma-joined, and
    and-joined English variants per §12; lesson05's reading-note
    translation and lesson06's review sentences are each label-style/
    paraphrase-variant sentences rather than clause-join variants, matching
    unit43's own treatment of its colon-separated waste-sorting notice. Ran
    a recursive yaml.safe_load scan over this file and its paired overlay
    for bare unquoted yes/no/true/false/on/off values (including
    matching_pairs right: values specifically, the two fields that have
    bitten this corpus before) -- zero hits, see the overlay's own review
    note for the exact scan result.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring traveler from units 16/20) keeps his usual
    informal register as the hotel guest. آقای کریمی, a new formal-register
    hotel-receptionist character, speaks with دارید/شما polite service
    language, consistent with the register unit41's خانم احمدی and unit42's
    آقای صادقی already established for this course's other service-
    encounter characters. Reuses کجاست (unit05), اتاق (unit19), کلید
    (unit40), دارم/دارید (units12/06/42), چند/شب (units03/04/09), ساعت/
    چنده (unit09), می‌تونم/کنم (unit20), خوش اومدید (unit06), سلام/ممنون/
    باشه/بله/خداحافظ (units01/06/17/22), از/تا (unit16/42), and تاریخ/
    دوشنبه/چهارشنبه (unit10) without re-teaching any of it from scratch. No
    word is given a new sense beyond its existing corpus meaning in this
    unit (unlike unit42's پس/تا) -- FSI's own attested "hotel" word,
    مهمانخانه, is deliberately NOT taught in this unit in favor of the
    contemporary colloquial loanword هتل, a live dialect-authenticity
    choice disclosed in generation_provenance above, not an oversight.

