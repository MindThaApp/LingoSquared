units:
  - content_key: fa.a1.unit46.personal_care
    title: سلمانی
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.personal_care.get_haircut
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit46.lesson01.new_personal_care_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.personal_care.get_haircut
        teaching:
          - content_key: fa.a1.unit46.lesson01.teach.review_mo_kootah
            kind: grammar_note
            target: {text: "مو (hair) -- already taught from unit25 / کوتاه (short) -- already taught from unit25 / موی (ezafe form of مو, 'hair of') -- already taught from unit25", language_code: fa, direction: rtl}
            introduced_tokens: [مو, کوتاه, موی]
          - content_key: fa.a1.unit46.lesson01.teach.review_miram
            kind: grammar_note
            target: {text: "می‌رم (I'm going) -- already taught from unit24", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌رم"]
          - content_key: fa.a1.unit46.lesson01.teach.salmani
            kind: vocabulary
            target: {text: سلمانی, language_code: fa, direction: rtl}
            introduced_tokens: [سلمانی]
            example: {text: "می‌رم سلمانی.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit46.lesson01.exercise01.recognize_salmani
            type: multiple_choice
            tested_text: سلمانی
            prompt: {target_blocks: [{text: سلمانی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit46.lesson01.exercise02.recognize_miram_salmani
            type: multiple_choice
            tested_text: "می‌رم سلمانی."
            prompt: {target_blocks: [{text: "می‌رم سلمانی.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit46.lesson01.exercise03.match_personal_care_one
            type: matching_pairs
            tested_text: "سلمانی مو کوتاه می‌رم موی کوتاه می‌رم سلمانی"
            prompt: {target_blocks: []}
            pairs:
              - {left: سلمانی, right: barbershop}
              - {left: مو, right: hair}
              - {left: کوتاه, right: short}
              - {left: "می‌رم", right: "I'm going"}
              - {left: "موی کوتاه", right: "short hair"}
              - {left: "می‌رم سلمانی.", right: "I'm going to the barbershop."}
          - content_key: fa.a1.unit46.lesson01.exercise04.word_order_miram_salmani
            type: word_order
            tested_text: "می‌رم سلمانی"
            prompt: {target_blocks: [{text: "I'm going to the barbershop.", language_code: en, direction: ltr}]}
            word_bank: ["می‌رم", سلمانی]
          - content_key: fa.a1.unit46.lesson01.exercise05.translate_moye_kootah
            type: translation
            tested_text: "موی کوتاه"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit46.lesson02.new_personal_care_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.personal_care.get_haircut
        teaching:
          - content_key: fa.a1.unit46.lesson02.teach.review_mohash
            kind: grammar_note
            target: {text: "موهاش (his/her hair) -- already taught from unit25", language_code: fa, direction: rtl}
            introduced_tokens: [موهاش]
          - content_key: fa.a1.unit46.lesson02.teach.moham
            kind: vocabulary
            target: {text: موهام, language_code: fa, direction: rtl}
            introduced_tokens: [موهام, کوتاهه]
            example: {text: "موهام کوتاهه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit46.lesson02.teach.review_bashe
            kind: grammar_note
            target: {text: "باشه (okay) -- already taught from units 01/02/06/17/22/45", language_code: fa, direction: rtl}
            introduced_tokens: [باشه]
        exercises:
          - content_key: fa.a1.unit46.lesson02.exercise01.recognize_moham
            type: multiple_choice
            tested_text: موهام
            prompt: {target_blocks: [{text: موهام, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit46.lesson02.exercise02.recognize_moham_kootahe
            type: multiple_choice
            tested_text: "موهام کوتاهه."
            prompt: {target_blocks: [{text: "موهام کوتاهه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit46.lesson02.exercise03.match_personal_care_two
            type: matching_pairs
            tested_text: "موهام موهاش کوتاهه باشه مو کوتاه"
            prompt: {target_blocks: []}
            pairs:
              - {left: موهام, right: "my hair"}
              - {left: موهاش, right: "his/her hair"}
              - {left: کوتاهه, right: "is short"}
              - {left: باشه, right: okay}
              - {left: مو, right: hair}
              - {left: کوتاه, right: short}
          - content_key: fa.a1.unit46.lesson02.exercise04.word_order_moham_kootahe
            type: word_order
            tested_text: "موهام کوتاهه"
            prompt: {target_blocks: [{text: "My hair is short.", language_code: en, direction: ltr}]}
            word_bank: [موهام, کوتاهه]
          - content_key: fa.a1.unit46.lesson02.exercise05.translate_moham_kootahe
            type: translation
            tested_text: "موهام کوتاهه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit46.lesson03.request_shorter
        title: "درخواستِ کوتاه‌تر"
        spine_outcome_id: universal.a1.personal_care.get_haircut
        teaching:
          - content_key: fa.a1.unit46.lesson03.teach.review_mikhaam
            kind: grammar_note
            target: {text: "می‌خوام (I want) -- already taught from unit03", language_code: fa, direction: rtl}
