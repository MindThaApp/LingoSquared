          - content_key: fa.a1.unit46.lesson03.teach.mesle_ghabl
            kind: phrase
            target: {text: "مثل قبل (like before) -- مثل already taught from unit04, قبل already taught from unit45 / ولی (but) -- already taught from unit15", language_code: fa, direction: rtl}
            introduced_tokens: [مثل, قبل, "مثل قبل", ولی]
        exercises:
          - content_key: fa.a1.unit46.lesson03.exercise01.recognize_kootahtar
            type: multiple_choice
            tested_text: "کوتاه‌تر"
            prompt: {target_blocks: [{text: "کوتاه‌تر", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit46.lesson03.exercise02.recognize_mikhaam_moham_kootahtar_bashe
            type: multiple_choice
            tested_text: "می‌خوام موهام کوتاه‌تر باشه."
            prompt: {target_blocks: [{text: "می‌خوام موهام کوتاه‌تر باشه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit46.lesson03.exercise03.match_request_shorter
            type: matching_pairs
            tested_text: "کوتاه‌تر می‌خوام باشه موهام مثل قبل مثل قبل"
            prompt: {target_blocks: []}
            pairs:
              - {left: "کوتاه‌تر", right: shorter}
              - {left: "می‌خوام", right: "I want"}
              - {left: باشه, right: "(to) be"}
              - {left: موهام, right: "my hair"}
              - {left: مثل, right: like}
              - {left: قبل, right: before}
              - {left: "مثل قبل", right: "like before"}
          - content_key: fa.a1.unit46.lesson03.exercise04.word_order_mikhaam_moham_kootahtar_bashe
            type: word_order
            tested_text: "می‌خوام موهام کوتاه‌تر باشه"
            prompt: {target_blocks: [{text: "I want my hair to be shorter.", language_code: en, direction: ltr}]}
            word_bank: ["می‌خوام", موهام, "کوتاه‌تر", باشه]
          - content_key: fa.a1.unit46.lesson03.exercise05.translate_mesle_ghabl_kootahtar
            type: translation
            tested_text: "مثل قبل، ولی کوتاه‌تر."
            prompt: {target_blocks: []}

