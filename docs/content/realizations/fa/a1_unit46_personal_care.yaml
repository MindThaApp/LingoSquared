generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Firecrawl remains at 0 credits this session, so
    tried WebFetch directly against the Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf) first,
    per this task's explicit instruction to try WebFetch before falling
    back to local extraction -- it returned only a binary-content notice
    ("compressed object streams with encoded data... not readable as plain
    text"), no usable text. Fell back to downloading the PDF directly and
    running `pdftotext -layout` locally (the same Live Lingua mirror every
    prior fa unit this session has used, since it carries a real Acrobat
    Pro DC OCR text layer, unlike the DigitalOcean mirror's JBIG2-only
    scan) -- this extracted 66,717 words, exactly matching every prior
    fetch of the same file (units 36-45), confirming the extraction is
    stable and complete, not a truncated fetch. Grepped the full extracted
    text case-insensitively for haircut/barber/hairdress/salon/comb/shave/
    trim/hair: found only 3 scattered hits, none of them structured
    barbershop/haircut-request content -- "gis" ('hair') appears only as
    one entry in an unrelated phonetic minimal-pair drill list (g-sounds),
    "tarasidan" ('to sharpen, to shave, to scrape') appears only in a
    "Classroom Expressions" section about sharpening a PENCIL, not shaving
    a person, and "rish-tarasi" ('shaving') appears only inside an
    unrelated household-chores dialogue about having a shirt washed and
    ironed ("bring me hot water for shaving and have this shirt washed and
    ironed") -- a passing mention embedded in a laundry request, not a
    hairdresser/barbershop scene. No word for "barber," "hairdresser," or
    "salon" appears anywhere in the extracted text at all. This is a
    genuine dead end of the same shape as unit45's pharmacy search (which
    found zero structured pharmacy content) -- the FSI course simply has
    no barbershop/hairdresser material, not an extraction failure. All
    personal-care vocabulary and the full dialogue in this unit (سلمانی,
    موهام, کوتاه‌تر, and the customer-barber exchange) is authored fresh
    from this project's own established colloquial Iranian Farsi
    conventions and already-shipped vocabulary (see review notes below for
    the exact reuse chain), since no such content exists in the FSI
    source.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed one real,
    compiler-invisible bug per AUTHORING_GUIDE.md #19's "no forward
    references" rule: lesson04's character_noori vocabulary card's own
    example ("آقای نوری سلمانی داره.") used داره ("has," colloquial 3rd
    person) without it ever being declared anywhere earlier in THIS
    file -- unit45's own review card happens to re-declare داره (it's
    genuinely already-taught, from unit04), but the untaught-vocabulary
    check is per-file only (this corpus's own standing convention), so
    unit45's declaration doesn't carry over into unit46's file, and this
    file itself never re-declared it before using it in an example. This
    slipped past compile_content.py's validate_untaught_vocabulary check
    because that check only walks exercises' tested_text, never a
    teaching card's own example: field (confirmed by writing a
    standalone script replicating the compiler's own tokenize() against
    every example in this file, not by eyeballing it) -- the file still
    validated 0 errors/0 warnings despite the real gap. Fixed by adding
    داره to character_noori's own introduced_tokens. Also updated this
    file's own review-notes prose, which still named unit44's hotel
    receptionist as آقای کریمی and unit45's pharmacist as خانم رضایی --
    both renamed this same review pass (see those units' own review
    notes) to آقای رستمی and خانم صالحی after a corpus-wide
    character-name-collision audit found and fixed real collisions with
    unit40 and unit41 respectively; this unit's own barber character
    آقای نوری was independently re-confirmed collision-free against the
    corrected names and every other named character across the whole fa
    corpus. Re-validated clean after the fix (0 errors/0 warnings,
    standalone and as part of the 4-unit combined run). Everything else
    was checked clean: no same-speaker distractor collisions (lesson04's
    dialogue_comprehension distractors -- haircut price, same-day
    availability, needing an appointment -- are never mentioned by
    either speaker in the dialogue itself; the price only appears
    separately in lesson05's unrelated shop-sign reading text, so
    there's no cross-exercise collision either); a real yaml.safe_load
    boolean-type walk found zero stray yes/no/true/false/on/off
    coercions; no Arabic-range kaf/yeh codepoints; matching_pairs
    accepted_answers use the established fa-corpus flat-dict convention,
    left as-is; every exercise type used is registered; no jargon leaks;
    the style request (shorter, "like before") stays consistent across
    the dialogue and the wrap-up review; the Persian reads as natural,
    contemporary Iranian colloquial register throughout, with چشم
    correctly reused in its established idiomatic "sure/got it" sense
    (unit06), distinct from its unrelated "eye" sense (unit25).

    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit45 (pharmacy). Realizes
    universal.a1.personal_care.get_haircut -- confirmed as the next
    unrealized A1 outcome by a real yaml.safe_load-equivalent scan (grep
    -h "spine_outcome_id" across every docs/content/realizations/fa/
    a1_unit*.yaml, deduplicated) cross-checked against every
    universal.a1.* id declared in docs/content/universal_spine.yaml (51
    total A1 ids): fa had realized all A1 outcomes through unit45 except
    personal_care, bike_rental, laundry, swimming_pool, restaurant,
    cinema, and museum -- personal_care is the first of these in the
    spine's own declaration order (pharmacy -> personal_care -> bike_rental
    -> laundry -> swimming_pool -> restaurant -> cinema -> museum), so this
    unit covers it; bike_rental/laundry/swimming_pool/restaurant/cinema/
    museum remain unrealized for fa after this unit. The
    universal.a1.personal_care.get_haircut outcome itself is not new -- it
    was added earlier this session by the nl (Dutch) content lane (git log
    confirms "Add nl unit51 (hairdresser)" as its origin, alongside the
    spine outcome itself), so no new spine outcome needed adding here,
    just fa catching up to an outcome that already exists (per this task's
    own instruction to check git log first before considering adding a new
    outcome). Prerequisite outcomes (appointments.make_simple_appointment/
    unit41, money.handle_basic_money_matters/unit21) are both already
    realized in this course, so no prerequisite gap blocks this unit.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, which validates each exercise's tested_text against tokens
    introduced anywhere earlier in the SAME file's document order) --
    confirmed with a real grep of every prior fa a1_unit*.yaml file's
    introduced_tokens declarations, not by eye: مو/کوتاه/موهاش (unit25,
    appearance -- hair, short, "his/her hair" fused possessive), می‌رم
    (unit24), می‌خوام (unit03), باشه (units01/02/06/17/22/45), مثل
    (unit04), قبل (unit45), چطور (unit01), می‌خوای (unit12/14/16/20/35),
    آره (unit07), ولی (unit15), یکم (unit09/23/36), چشم -- reused in its
    established idiomatic "sure/got it" sense from unit06's food-ordering
    dialogue, not its unrelated "eye" sense from unit25, disambiguated by
    context the same way unit06 and unit25 already coexist without
    confusion in this corpus -- دو/سه (unit03), دقیقه (unit09/28), آقای
    (unit40/42/44), کردن (unit32/35), هزار/تومن (unit21). New vocabulary
    genuinely introduced for the first time in the whole corpus: سلمانی
    (barbershop), موهام (my hair -- a new 1st-person fused-possessive
    form extending the already-taught موهاش pattern from unit25, the same
    kind of morphological extension unit15 treated as new vocabulary for
    its -تر comparatives), and کوتاه‌تر (shorter -- the -تر comparative
    suffix applied to the already-taught کوتاه, following the exact fused
    colloquial -e-contraction convention unit15 established, e.g.
    بزرگ‌تره/کوچیک‌تره, with the ZWNJ (U+200C) before تر). Exactly 3 new
    words/forms, continuing this course's established low-new-vocabulary
    choice for later units (unit45 introduced exactly 4) given how much
    directly relevant vocabulary (مو، کوتاه، موهاش، مثل، قبل، می‌خوام،
    باشه) units 25/45/04/03 already established. No new verb-conjugation
    pattern is introduced -- every verb form used (می‌رم, می‌خوام,
    می‌خوای, باشه, کردن) was already established by an earlier unit; the
    -تر comparative suffix itself was already established by unit15, only
    the specific word کوتاه‌تر is new.

    Register/character choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring character) is the barbershop customer, keeping
    his usual informal register, a natural continuation of his established
    "visits a service provider and states a need" role from units 17
    (health), 41 (appointments), and 45 (pharmacy). A NEW formal-register
    character, آقای نوری, is introduced as the barber (distinct surname
    from unit41's خانم احمدی, unit42's آقای صادقی, unit44's آقای رستمی,
    and unit45's خانم صالحی -- confirmed via a real regex scan of every
    آقای/خانم name already used across the fa corpus, zero collision); he
    speaks in neutral polite service language, consistent with the
    receptionist/librarian/hotel-clerk/pharmacist register units
    41/42/44/45 already established for this course's other
    service-encounter characters, while نیما keeps the same informal
    register he uses everywhere else in the corpus. Facts are kept
    internally consistent across the whole unit per AUTHORING_GUIDE.md
    #11: the style request (shorter, "like before"/the same style as
    usual) is stated identically in the dialogue (lesson04), the reading
    note (lesson05, as the shop's own service listing rather than a
    restated fact, so there is nothing to contradict), and the wrap-up
    review (lesson06), and never contradicted. Every kind:vocabulary
    teaching card (سلمانی، موهام، کوتاه‌تر، and the character card آقای
    نوری) has an example sentence per schema 1.1/AUTHORING_GUIDE §19,
    built only from the card's own word plus tokens already declared
    earlier in THIS file (no forward references). Every matching_pairs
    exercise has 6-7 pairs per §16 (lesson01: 6, lesson02: 6, lesson03: 7,
    lesson04: 7 dialogue-line pairs matching the dialogue's own 7 turns,
    lesson05: 6, lesson06: 6). No listen_type/listen_select/listen_order
    exercise is used anywhere in this unit -- fa has real Azure TTS per
    AUTHORING_GUIDE §14 (this restriction is now prs-only, not fa+prs),
    but this file continues the established text-based corpus-consistency
    pattern from units 19-45, the same choice those units' own reviews
    made, rather than introducing audio exercises to only this one unit
    out of step with its immediate neighbors. This also means the
    same-speaker/same-audio distractor-collision bug class (found and
    fixed 2026-07-09 in the nl corpus, commit 148240e) cannot directly
    apply here -- there is no listen_select exercise in this file to
    check. Checked anyway, since lesson04's dialogue_comprehension
    exercise is the closest analogue: its three distractors ("He wants to
    know the price of the haircut."/"He wants to know if Mr. Nouri is
    free today."/"He wants to know if he needs an appointment.") are
    plausible-fact alternatives, NOT lines either dialogue speaker (نیما
    or آقای نوری) actually says or facts either speaker actually states
    anywhere in this unit's dialogue -- price, same-day availability, and
    needing an appointment are never mentioned by either speaker in this
    dialogue at all (the price only appears later, separately, in
    lesson05's unrelated shop-sign reading text, not in the dialogue
    itself, so there is no cross-exercise collision either). The
    dialogue_response exercise (lesson04) also has no distractor set at
    all (like unit45's own dialogue_response_dosage), so the
    same-speaker-collision question doesn't apply to it. Every "Translate
    into English" exercise in the paired overlay explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence (§12) -- every translated sentence is a single
    clause or a colon-separated label-style note (lesson05's reading
    text, matching unit43/44/45's own treatment of their colon-separated
    notes with paraphrase-variant accepted answers rather than
    clause-join variants). Ran a recursive scan (grep for bare, unquoted
    yes/no/true/false/on/off tokens as YAML scalar values, plus a full
    yaml.safe_load parse of both this file and its paired overlay
    confirming every value that loaded is a str/list/dict, never a Python
    bool anywhere in a learner-facing field) for bare unquoted yes/no/
    true/false/on/off values (including matching_pairs right: values
    specifically) -- zero hits, see the overlay's own review note for the
    exact scan result.

    Review 2026-10-21 (en-fa A1 pass): 0 fixes - Persian (colloquial register, ZWNJ, ye/ke script) checked against units 24/25/45 and found consistent. NATIVE FLAGS: none.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character) keeps his usual informal register as
    the barbershop customer. آقای نوری, a new formal-register barber
    character, speaks with neutral polite service language, consistent
    with the register unit41's خانم احمدی, unit42's آقای صادقی, unit44's
    آقای رستمی, and unit45's خانم صالحی already established for this
    course's other service-encounter characters. Reuses مو/کوتاه/موهاش
    (unit25), می‌رم (unit24), می‌خوام (unit03), باشه (units01/02/06/17/
    22/45), مثل (unit04), قبل (unit45), چطور (unit01), می‌خوای (unit12/
    14/16/20/35), آره (unit07), ولی (unit15), یکم (unit09/23/36), چشم
    (unit06, idiomatic "sure"), دو/سه (unit03), دقیقه (unit09/28), آقای
    (unit40/42/44), کردن (unit32/35), and هزار/تومن (unit21) without
    re-teaching any of it from scratch. No word is given a new sense
    beyond its existing corpus meaning in this unit, except چشم, which is
    deliberately reused in its already-established idiomatic "sure/got
    it" sense (from unit06), not its unrelated "eye" sense (from unit25)
    -- both senses already coexist in this corpus without confusion.

