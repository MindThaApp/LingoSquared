generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Tried `firecrawl search "FSI Persian Basic
    Course restaurant رستوران menu order food"` first, per the standing
    instruction to re-check Firecrawl quota fresh even though it was
    reported exhausted in every earlier round this session -- it returned
    `Error: Request failed with status code 402` (payment required),
    confirming the account genuinely remains at 0 credits, not a stale
    report. Fell back to this session's own cached `pdftotext -layout`
    extraction of the same Live Lingua-hosted FSI Spoken Persian PDF every
    prior fa unit this session has used (this session's own scratchpad
    path, ~66,700 words). Grepped the full extracted text case-insensitively
    for restaurant/menu/waiter: this one, UNLIKE most recent units'
    dead-end searches, found a real hit -- pp.155-157 of the extracted text
    contain a genuine multi-turn "Conversation" scene at a restaurant, with
    a labelled "Waiter:" speaker, a customer named Smith and his colleague
    Fereydun, covering "shall we go to a restaurant," picking a restaurant,
    asking what food is available, ordering food and drink, and closing
    small talk. Read the full scene closely before deciding NOT to adapt it
    directly, for two concrete reasons rather than a blanket "too old"
    dismissal: (1) it is built around ordering wine and beer
    (سراب/شراب, تاجو/تابجو) by the bottle for a business dinner --
    genuinely inappropriate to adapt for this course's target register,
    since public alcohol consumption is illegal in Iran today and every
    other fa unit in this corpus has deliberately used non-alcoholic
    Iranian staples (چای, دوغ, آب) for exactly this reason; (2) it is a
    three-party formal business conversation (Smith + Fereydun + waiter,
    with register like taqaye/xanom honorifics and an embedded narrative
    epilogue) that is well past A1 complexity for this course's established
    نیما-plus-one-service-character two-party shape. Genuinely useful as
    confirmation that FSI Persian DOES cover a restaurant scene structurally
    (menu inquiry -> order food -> order drink -> ask for/settle the bill),
    which is real signal that this project's own already-planned restaurant
    beat sequence is authentic, not a confirmation to adapt any of its
    actual sentences. Per AUTHORING_GUIDE.md #10's "never import verbatim"
    rule and the standing modernization requirement, no phrase from this
    scene is reused; all vocabulary and the full dialogue in this unit
    (چلوکباب, دوغ, سفارش, and the customer-waitress exchange) is authored
    fresh from this project's own established colloquial Iranian Farsi
    conventions and already-shipped vocabulary (see review notes below for
    the exact reuse chain), substituting the FSI scene's wine/beer order
    for the authentic modern Iranian non-alcoholic restaurant staples
    چلوکباب (chelo kabab) and دوغ (doogh).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found no real bugs in this
    unit. Checked: the compiler (`compile_content.py validate`) standalone
    and combined with units 47-49 -- 0 errors/0 warnings both times; a
    recursive grep for unquoted yes/no/true/false/on/off scalar values --
    zero hits; a scan for Arabic-range kaf (U+0643)/yeh (U+064A)/alef
    maksura (U+0649) codepoints -- zero hits, all keheh/yeh correctly in
    the Persian range; a targeted scan of every learner-facing gloss/
    title/note/instruction/correct_option/feedback string for snake_case
    jargon leaks -- zero hits. Arithmetic cross-check per AUTHORING_
    GUIDE.md #11: the dialogue's stated bill total (پنجاه هزار تومن,
    50,000 toman) is the correct sum of the two stated item prices
    (چلوکباب چهل هزار تومنه = 40,000 + دوغ ده هزار تومنه = 10,000 =
    50,000) -- verified by hand, no arithmetic error. Same prices are
    also stated identically in the restaurant-sign reading text and the
    wrap-up review, no drift. Same-speaker/same-audio distractor-
    collision check (no listen_select in this unit, so applied to
    lesson04's dialogue_comprehension instead): manually re-listed both
    نیما's and خانم رحیمی's actual dialogue lines and confirmed none of
    the three distractors ("He wants more chelo kabab."/"...a table for
    two."/"...to see the menu.") is a fact either speaker states anywhere
    in the dialogue -- confirmed clean. Character check: خانم رحیمی does
    not collide with any other named آقای/خانم service character anywhere
    else in the fa corpus. Cross-checked this unit's claimed reuse of
    unit06's own exact phrase صورت‌حساب رو لطف می‌کنید؟ against unit06's
    actual text -- confirmed a genuine verbatim match, not a misremembered
    claim. All 19 registered exercise types are used correctly.
    matching_pairs accepted_answers use the flat-dict shape, consistent
    with the established corpus convention, not treated as a bug. New
    vocabulary (چلوکباب, دوغ, سفارش) spot-checked against every other unit
    that introduces food/restaurant vocabulary (unit06) -- no collision
    or contradiction. Genuine colloquial Iranian Farsi register
    throughout; the decision not to adapt the FSI source's wine/beer
    restaurant scene (illegal alcohol content, wrong register/complexity
    for this course) is well-reasoned, not a shortcut. Nothing needed
    fixing in this unit; marking reviewed.

    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit49 (swimming pool). Realizes
    universal.a1.restaurant.dine_at_restaurant -- confirmed as the correct
    next unrealized A1 outcome for fa by diffing every spine_outcome_id
    already used across every docs/content/realizations/fa/a1_unit*.yaml
    file (grep -o "spine_outcome_id: universal\.[a-z0-9_.]*" per file,
    deduplicated) against universal.a1.* ids in
    docs/content/universal_spine.yaml's own declaration order: fa has
    realized every A1 outcome through unit49 (swimming pool) with zero
    gaps, and universal.a1.restaurant.dine_at_restaurant is the very next
    A1 id declared in the spine immediately after
    swimming_pool.visit_swimming_pool. Prerequisite outcomes
    (food.order_simple_meal/unit06, money.handle_basic_money_matters/
    unit21) are both already realized in this course, so no prerequisite
    gap blocks this unit.

    Relationship to unit06 (food): unit06 already realizes
    universal.a1.food.order_simple_meal and already contains a restaurant
    scene (گارسون/مشتری ordering جوجه‌کباب, plus منو/صورت‌حساب/توصیه
    می‌کنید/چی میل دارید/بفرمایید) -- that is expected overlap, not a
    duplicate unit, since dine_at_restaurant is a distinct, later spine
    outcome that specifically layers "ask what something costs" and "ask
    for the bill" with real prices onto the food-ordering skill unit06
    already teaches (unit06 never states a single price or does a bill
    total). This unit deliberately reuses unit06's own established
    restaurant vocabulary (رستوران, منو, صورت‌حساب, and even unit06's own
    exact phrase صورت‌حساب رو لطف می‌کنید؟, all re-declared in this file's
    own introduced_tokens per the compiler's per-file-only check) rather
    than re-inventing parallel restaurant vocabulary, and adds the
    genuinely new price-and-bill layer: an itemized order with two stated
    prices and a summed total, a new NAMED waitress character (following
    this course's established units-40-49 نیما-plus-one-new-named-
    service-character convention, distinct from unit06's un-named
    گارسون/مشتری), and a reading exercise on a priced menu sign.

    Scenario/register choice, per AUTHORING_GUIDE.md #3: unlike the
    swimming-pool unit's real gender-segregation constraint, Iranian
    restaurants and cafes commonly have female waitstaff with no
    authenticity concern either way, so this unit's new service character
    is authored female (خانم رحیمی) specifically to follow through on
    unit49's own review note that "a future unit should lean female to
    keep the corpus-wide balance reasonable" (unit49 left the corpus at 5
    male vs 3 female named service characters). This keeps the running
    named-character list collision-free (کریمی، احمدی، صادقی، رضایی،
    نوری، مرادی، کاظمی، جعفری -- confirmed via a real grep of every
    آقای/خانم name already used across the fa corpus, zero collision with
    رحیمی) and brings the corpus-wide balance to 5 male vs 4 female.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, which validates each exercise's tested_text against tokens
    introduced anywhere earlier in the SAME file's document order) --
    confirmed with a real grep of every prior fa a1_unit*.yaml file's
    introduced_tokens declarations, not by eye: رستوران (units05/06), منو
    (unit06), چقدر (unit21/28/49), می‌شه (unit11/35/49), یه (unit05,
    reused unit34/47), می‌خوام (unit03), چهل/پنجاه (unit03), هزار/تومن
    (unit03/21) -- with تومنه (تومن + colloquial -ه copula contraction)
    reused directly from unit03's own "سی هزار تومنه" pattern and unit49's
    own reuse of it, این (units03/04/08/15/20/26/49), چنده (unit03), ده
    (unit03), هم (unit06), صورت‌حساب (unit06), رو (object marker, unit30/
    32), لطف/می‌کنید (unit06's own exact phrase "صورت‌حساب رو لطف
    می‌کنید؟"), سلام/ممنون (units01/17/22/45/46/47/48/49), باشه (units01/
    02/06/17/22/45/46/47/48/49), خوبه (unit06/10/12/19/48), خانم (units41/
    45/48), هست (unit01/04/05/12). New vocabulary genuinely introduced for
    the first time in the whole corpus: چلوکباب (chelo kabab, the iconic
    rice-and-grilled-kebab dish), دوغ (doogh, the savory yogurt drink), and
    سفارش (order, as in a food/drink order) -- exactly 3 new words, in
    line with this course's established 2-4-new-word-per-unit range
    (unit47: 2, unit48: 2, unit49: 3). No new verb-conjugation pattern is
    introduced -- سفارش می‌دم reuses the exact می‌دم present-tense
    colloquial form already established by unit24's گوش می‌دم ("I
    listen"), and every other verb form used (می‌خوام, می‌شه) was already
    established by earlier units.

    Register/character choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring character) is the restaurant customer, keeping
    his usual informal register, a natural continuation of his established
    "visits a service provider and states a need" role from units 17
    (health), 41 (appointments), 44 (accommodation), 45 (pharmacy), 46
    (barbershop), 47 (bike rental), 48 (laundry), and 49 (swimming pool). A
    NEW formal-register character, خانم رحیمی, is introduced as the
    restaurant waitress -- distinct from unit40/42/44's آقای کریمی,
    unit41's خانم احمدی, unit42's آقای صادقی, unit45's خانم رضایی,
    unit46's آقای نوری, unit47's آقای مرادی, unit48's خانم کاظمی, and
    unit49's آقای جعفری; she speaks in neutral polite service language,
    consistent with the receptionist/librarian/hotel-clerk/pharmacist/
    barber/bike-shop-owner/laundry-owner/pool-attendant register units 41/
    42/44/45/46/47/48/49 already established for this course's other
    service-encounter characters, while نیما keeps the same informal
    register he uses everywhere else in the corpus.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the chelo kabab price (چهل هزار تومن, 40,000
    toman) and the doogh price (ده هزار تومن, 10,000 toman) are stated
    identically in the dialogue (lesson04), the restaurant-sign reading
    text (lesson05), and the wrap-up review (lesson06), and never
    contradicted anywhere else in the unit; the dialogue's stated bill
    total (پنجاه هزار تومن, 50,000 toman) is the correct arithmetic sum of
    the two item prices (40,000 + 10,000 = 50,000), also checked explicitly
    for internal consistency. Every kind:vocabulary teaching item (سفارش,
    چلوکباب, دوغ, and the character card خانم رحیمی) has an example
    sentence per schema 1.1/AUTHORING_GUIDE §19, built only from the
    card's own word plus tokens already declared earlier in THIS file's
    document order (no forward references). The phrase card "صورت‌حساب
    رو لطف می‌کنید؟" reviews only already-taught component tokens (no new
    root word), so it is not subject to the vocabulary-card example
    requirement, mirroring exactly how unit49's lesson03 built its own
    "استخر بازه؟" phrase card the same way. Every matching_pairs exercise
    has 6-8 pairs per §16 (lesson01: 6, lesson02: 7, lesson03: 7, lesson04:
    7 dialogue-line pairs matching the dialogue's own 7 turns, lesson05: 8,
    lesson06: 6). No listen_type/listen_select/listen_order exercise is
    used anywhere in this unit -- fa has real Azure TTS per AUTHORING_GUIDE
    §14 (this restriction is prs-only, not fa+prs), but this file
    continues the established text-based corpus-consistency pattern from
    units 19-49, the same choice those units' own reviews made, rather than
    introducing audio exercises to only this one unit out of step with its
    immediate neighbors -- the spine outcome's own "listening" assessment
    requirement (identify the food/drink ordered or the price stated in a
    short restaurant exchange) is covered via the dialogue_comprehension
    exercise's comprehension-of-the-exchange task, the same interpretation
    units 41/42/44/45/46/47/48/49 already established for their own
    "listening" assessment coverage without a literal audio exercise type.
    This also means the same-speaker/same-audio distractor-collision bug
    class (found and fixed 2026-07-09 in the nl corpus, commit 148240e)
    cannot directly apply here -- there is no listen_select exercise in
    this file to check. Checked anyway, per the standing instruction to
    list every line each speaker says before writing any distractor: نیما
    says "سلام خانم رحیمی. چلوکباب می‌خوام."/"باشه. یه دوغ هم
    می‌خوام."/"خوبه. صورت‌حساب رو لطف می‌کنید؟"/"ممنون!"; خانم رحیمی says
    "سلام نیما. چلوکباب چهل هزار تومنه."/"دوغ ده هزار تومنه."/"پنجاه
    هزار تومن می‌شه." -- lesson04's dialogue_comprehension exercise asks
    what نیما wants when he asks "صورت‌حساب رو لطف می‌کنید؟", with
    distractors ("He wants more chelo kabab."/"He wants a table for
    two."/"He wants to see the menu.") that are plausible-fact
    alternatives, NOT lines either speaker actually says or facts either
    speaker actually states anywhere in this unit's dialogue -- a second
    order, a table for two, and a menu request are never mentioned by
    either character, so there is no cross-exercise collision. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line ("ممنون!", with paraphrase variants also accepted), not a
    distractor set, so the same-speaker-collision question doesn't apply
    to it. Every "Translate into English" exercise in the paired overlay
    explicitly sets answer_language_code: en. No exercise in this unit
    tests a genuine two-clause sentence joined by "and"/comma (§12) --
    every multi-sentence teaching/review line (lesson04 dialogue lines
    1/3/5, lesson06's request/price review) is authored as two separate
    short sentences, matching how units 44/45/46/47/48/49 already treat
    their own two-sentence notes, with paraphrase-variant accepted answers
    rather than clause-join variants. Ran a recursive scan (grep for bare,
    unquoted yes/no/true/false/on/off tokens as YAML scalar values, plus a
    full yaml.safe_load parse of both this file and its paired overlay
    confirming every value that loaded is a str/list/dict, never a Python
    bool anywhere in a learner-facing field) for bare unquoted
    yes/no/true/false/on/off values (including matching_pairs right:
    values specifically) -- zero hits, see the overlay's own review note
    for the exact scan result. Ran a Persian-vs-Arabic codepoint scan
    (grep for Arabic kaf U+0643 and Arabic yeh U+064A across both files)
    -- zero hits, all keheh/yeh in this file use the correct Persian-range
    codepoints (U+06A9/U+06CC).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character) keeps his usual informal register as
    the restaurant customer. خانم رحیمی, a new formal-register restaurant
    waitress, speaks with neutral polite service language, consistent with
    the register units 41/42/44/45/46/47/48/49 already established for this
    course's other service-encounter characters. Reuses رستوران (unit05/
    06), منو (unit06), چقدر/می‌شه (unit21/28/49, unit11/35/49), یه
    (unit05), می‌خوام (unit03), چهل/پنجاه/هزار/تومن (unit03/21), این/چنده
    (unit03), ده (unit03), هم/صورت‌حساب/لطف/می‌کنید (unit06), رو (unit30/
    32), سلام/ممنون (units01/17/22/45/46/47/48/49), باشه (units01/02/06/
    17/22/45/46/47/48/49), خوبه (unit06/10/12/19/48), خانم (unit41/45/48),
    هست (unit01/04/05/12) without re-teaching any of it from scratch. No
    word is given a new sense beyond its existing corpus meaning in this
    unit.

