units:
  - content_key: fa.a1.unit50.restaurant
    title: رستوران
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.restaurant.dine_at_restaurant
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit50.lesson01.new_restaurant_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.restaurant.dine_at_restaurant
        teaching:
          - content_key: fa.a1.unit50.lesson01.teach.review_resturan_menu
            kind: grammar_note
            target: {text: "رستوران (restaurant) -- already taught from unit05/06 / منو (menu) -- already taught from unit06", language_code: fa, direction: rtl}
            introduced_tokens: [رستوران, منو]
          - content_key: fa.a1.unit50.lesson01.teach.review_cheghadr_mishe
            kind: grammar_note
            target: {text: "چقدر (how much) -- already taught from unit21/28/49 / می‌شه (it comes to / costs) -- already taught from unit11/35/49", language_code: fa, direction: rtl}
            introduced_tokens: [چقدر, "می‌شه"]
          - content_key: fa.a1.unit50.lesson01.teach.review_in
            kind: grammar_note
            target: {text: "این (this) -- already taught from unit03/04/08/15/20/26/49", language_code: fa, direction: rtl}
            introduced_tokens: [این]
          - content_key: fa.a1.unit50.lesson01.teach.review_midam
            kind: grammar_note
            target: {text: "می‌دم (I give / colloquial idiom for \"I'll order\") -- already taught from unit24's گوش می‌دم", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌دم"]
          - content_key: fa.a1.unit50.lesson01.teach.sefaresh
            kind: vocabulary
            target: {text: سفارش, language_code: fa, direction: rtl}
            introduced_tokens: [سفارش]
            example: {text: "سفارش می‌دم.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit50.lesson01.exercise01.recognize_sefaresh
            type: multiple_choice
            tested_text: سفارش
            prompt: {target_blocks: [{text: سفارش, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit50.lesson01.exercise02.recognize_sefaresh_midam
            type: multiple_choice
            tested_text: "سفارش می‌دم."
            prompt: {target_blocks: [{text: "سفارش می‌دم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit50.lesson01.exercise03.match_restaurant_one
            type: matching_pairs
            tested_text: "رستوران منو چقدر می‌شه سفارش سفارش می‌دم"
            prompt: {target_blocks: []}
            pairs:
              - {left: رستوران, right: restaurant}
              - {left: منو, right: menu}
              - {left: چقدر, right: "how much"}
              - {left: "می‌شه", right: "it comes to"}
              - {left: سفارش, right: order}
              - {left: "سفارش می‌دم.", right: "I'll order."}
          - content_key: fa.a1.unit50.lesson01.exercise04.word_order_sefaresh_midam
            type: word_order
            tested_text: "سفارش می‌دم"
            prompt: {target_blocks: [{text: "I'll order.", language_code: en, direction: ltr}]}
            word_bank: [سفارش, "می‌دم"]
          - content_key: fa.a1.unit50.lesson01.exercise05.translate_in_menu
            type: translation
            tested_text: "این منو"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit50.lesson02.new_restaurant_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.restaurant.dine_at_restaurant
        teaching:
          - content_key: fa.a1.unit50.lesson02.teach.review_ye_mikhaam
            kind: grammar_note
            target: {text: "یه (a, an) -- already taught from unit05 / می‌خوام (I want) -- already taught from unit03", language_code: fa, direction: rtl}
            introduced_tokens: [یه, "می‌خوام"]
          - content_key: fa.a1.unit50.lesson02.teach.review_chehel_hezar_toman
            kind: grammar_note
            target: {text: "چهل (forty) -- already taught from unit03 / هزار (thousand), تومن (toman) -- already taught from unit03/21 / تومنه (it's ... toman, colloquial تومن + است contraction) -- already taught from unit03's own \"سی هزار تومنه\"", language_code: fa, direction: rtl}
            introduced_tokens: [چهل, هزار, تومن, "تومنه"]
          - content_key: fa.a1.unit50.lesson02.teach.chelokabab
            kind: vocabulary
            target: {text: چلوکباب, language_code: fa, direction: rtl}
            introduced_tokens: [چلوکباب]
            example: {text: "چلوکباب می‌خوام.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit50.lesson02.exercise01.recognize_chelokabab
            type: multiple_choice
            tested_text: چلوکباب
            prompt: {target_blocks: [{text: چلوکباب, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit50.lesson02.exercise02.recognize_chelokabab_mikhaam
            type: multiple_choice
            tested_text: "چلوکباب می‌خوام."
            prompt: {target_blocks: [{text: "چلوکباب می‌خوام.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit50.lesson02.exercise03.match_restaurant_two
            type: matching_pairs
            tested_text: "چلوکباب یه می‌خوام چهل هزار تومن چلوکباب چهل هزار تومنه"
            prompt: {target_blocks: []}
            pairs:
              - {left: چلوکباب, right: "chelo kabab"}
              - {left: یه, right: a}
              - {left: "می‌خوام", right: "I want"}
