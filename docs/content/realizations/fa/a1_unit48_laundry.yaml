    "wash clothes"/"dry clean"/"wash cycle": zero hits for any of those.
    A broader grep for "clean"/"washing"/"lebas" (Persian for clothes, this
    extraction is Latin-transliterated, not Persian-script) surfaced a
    genuine but different scenario around lines 34600-34950: a tailor/
    dry-goods-shop exchange ("daram miram kot-o shalvaram-o az khayyati
    begiram" -- "I'm going to get my coat and pants from the tailor's",
    "parceharo entexab konam" -- "to choose the fabrics") -- clothing-
    adjacent but about a TAILOR (خیاط), not a laundry/dry-cleaning service,
