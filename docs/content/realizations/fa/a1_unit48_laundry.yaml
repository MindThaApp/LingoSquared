    آقای/خانم service character anywhere else in the fa corpus. All 19
    registered exercise types are used correctly. matching_pairs
    accepted_answers use the flat-dict shape, consistent with the
    established corpus convention (same as every other already-shipped fa
    unit), not treated as a bug since `grade()` canonicalizes either
    shape. Vocabulary reuse chain spot-checked against earlier units
    (لباس‌ها/unit32, می‌گیرم/unit29/34/41, etc.) -- confirmed accurate.
    Genuine colloquial Iranian Farsi register throughout, no Dari/Afghan
    forms detected; the خشکشویی (drop-off shop, not self-service
    launderette) scenario choice is a real, correctly-reasoned dialect-
    authenticity call per AUTHORING_GUIDE.md #3. Nothing needed fixing in
    this unit; marking reviewed.

    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit47 (bike_rental). Realizes
    universal.a1.laundry.use_launderette -- confirmed as the correct next
    unrealized A1 outcome for fa by diffing every spine_outcome_id already
    used across every docs/content/realizations/fa/a1_unit*.yaml file
    (grep -o "spine_outcome_id: universal\.[a-z0-9_.]*" per file,
    deduplicated) against universal.a1.* ids in
    docs/content/universal_spine.yaml's own declaration order: fa has
    realized every A1 outcome through unit47 (bike_rental) with zero gaps,
    and universal.a1.laundry.use_launderette is the very next A1 id
    declared in the spine immediately after bike_rental.rent_a_bicycle, so
    this unit covers it in fa's own established sequence. Prerequisite
    outcomes (money.handle_basic_money_matters/unit21,
    household.describe_chores/unit32) are both already realized in this
    course, so no prerequisite gap blocks this unit.

    Scenario choice, per AUTHORING_GUIDE.md #3 (verify actual dialect
    usage, don't assume the Western "self-service coin launderette"
    default): self-service coin launderettes are uncommon in Iran; the
    real everyday equivalent is a خشکشویی (a drop-off laundry/dry-cleaning
    shop that also does regular wash-and-fold, not just dry cleaning),
    which fits the spine outcome's own "ask about wash cycles and cost, and
    understand pickup instructions" assessment requirements naturally as a
    drop-off/pickup service rather than a self-service machine -- this is
    the dialect-authentic choice, not a Western-scenario transplant.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, which validates each exercise's tested_text against tokens
    introduced anywhere earlier in the SAME file's document order) --
    confirmed with a real grep of every prior fa a1_unit*.yaml file's
    introduced_tokens declarations, not by eye: لباس‌ها "clothes" (unit32,
    reused in its already-established plural form, no new sense), این
    "this" (units03/04/08/15/20/26), می‌رم "I go" (unit16/24), به "to"
    (unit16/21), رو (the colloquial object marker, unit32), می‌خوام "I
    want" (unit03), چقدر "how much" (unit21/28), می‌شه "it comes to /
    costs" (unit11/35), ده "ten" (unit03), هزار "thousand" (unit03/21),
    تومن "toman" (unit03/21), کِی "when" (unit34/42), فردا "tomorrow"
    (unit09), ظهر "noon" (unit09), خوبه "good, that's fine" (unit06/10/
    12/19), بله "yes" (unit20/21), می‌گیرم "I get it / I'll pick it up"
    (unit29/34/41 -- the same established "receive/take" verb reused here
    in its natural "pick up a finished service item" sense, not a new
    meaning), سلام/ممنون (units01/17/22/45/46/47), خانم "Ms." (unit41),
    باشه (units01/02/06/17/22/45/46/47). New vocabulary genuinely
    introduced for the first time in the whole corpus: خشکشویی
    (laundry/dry-cleaning shop) and فوری (express/urgent service) --
    exactly 2 new words, matching unit47's own lean 2-new-word count. No
    new verb-conjugation pattern is introduced -- every verb form used
    (می‌رم, می‌خوام, می‌شه, می‌گیرم) was already established by an earlier
    unit; only the two nouns خشکشویی and فوری are new.

    Register/character choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring character) is the laundry-drop-off customer,
    keeping his usual informal register, a natural continuation of his
    established "visits a service provider and states a need" role from
    units 17 (health), 41 (appointments), 44 (accommodation), 45
    (pharmacy), 46 (barbershop), and 47 (bike rental). A NEW
    formal-register character, خانم کاظمی, is introduced as the laundry
    shop owner -- distinct from unit40/42/44's آقای کریمی, unit41's خانم
    احمدی, unit42's آقای صادقی, unit45's خانم رضایی, unit46's آقای نوری,
    and unit47's آقای مرادی (confirmed via a real regex-equivalent scan of
    every آقای/خانم name already used across the fa corpus -- کریمی،
    احمدی، صادقی، رضایی، نوری، مرادی -- zero collision with کاظمی); she
    speaks in neutral polite service language, consistent with the
    receptionist/librarian/hotel-clerk/pharmacist/barber/bike-shop-owner
    register units 41/42/44/45/46/47 already established for this course's
    other service-encounter characters, while نیما keeps the same informal
    register he uses everywhere else in the corpus. This also continues the
    course's deliberate gender balance among service-encounter characters
    (خانم احمدی, خانم رضایی, and now خانم کاظمی alongside the several آقای
    characters), not a coincidence.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the price (ده هزار تومن, "10,000 toman") and
    the pickup time (فردا ظهر, "tomorrow noon") are stated identically in
    the dialogue (lesson04), the shop-sign reading text (lesson05), and the
    wrap-up review (lesson06), and never contradicted anywhere else in the
    unit. Every kind:vocabulary teaching card (خشکشویی, and the character
    card خانم کاظمی) has an example sentence per schema 1.1/AUTHORING_
    GUIDE §19, built only from the card's own word plus tokens already
    declared earlier in THIS file (no forward references); فوری's example
    sentence similarly only uses already-established tokens. Every
    matching_pairs exercise has 6-8 pairs per §16 (lesson01: 6, lesson02:
    7, lesson03: 8, lesson04: 7 dialogue-line pairs matching the dialogue's
    own 7 turns, lesson05: 6, lesson06: 6). No listen_type/listen_select/
    listen_order exercise is used anywhere in this unit -- fa has real
    Azure TTS per AUTHORING_GUIDE §14 (this restriction is prs-only, not
    fa+prs), but this file continues the established text-based
    corpus-consistency pattern from units 19-47, the same choice those
    units' own reviews made, rather than introducing audio exercises to
    only this one unit out of step with its immediate neighbors -- the
    spine outcome's own "listening" assessment requirement (identify wash
    cycle/cost/pickup time in a short exchange) is covered via the
    dialogue_comprehension exercise's comprehension-of-the-exchange task,
    the same interpretation units 41/42/44/45/46/47 already established for
    their own "listening" assessment coverage without a literal audio
    exercise type. This also means the same-speaker/same-audio
    distractor-collision bug class (found and fixed 2026-07-09 in the nl
    corpus, commit 148240e) cannot directly apply here -- there is no
    listen_select exercise in this file to check. Checked anyway, per the
    standing instruction to list every line each speaker says before
    writing any distractor: نیما says "سلام خانم کاظمی. این لباس‌ها رو
    فوری می‌خوام."/"بله، خوبه. چقدر می‌شه؟"/"باشه. کِی می‌گیرم؟"/"ممنون!";
    خانم کاظمی says "سلام نیما. فردا ظهر خوبه؟"/"ده هزار تومن می‌شه."/
    "فردا ظهر." -- lesson04's dialogue_comprehension exercise asks what
    نیما wants to know, with distractors ("He wants to know if they also
    do dry cleaning."/"He wants to know if the shop is open on
    Fridays."/"He wants to know if he needs an appointment.") that are
    plausible-fact alternatives, NOT lines either speaker actually says or
    facts either speaker actually states anywhere in this unit's dialogue
    -- dry cleaning, Friday hours, and appointments are never mentioned by
    either character, so there is no cross-exercise collision. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line ("بله، خوبه.", with the full turn "بله، خوبه. چقدر می‌شه؟" also
    accepted), not a distractor set, so the same-speaker-collision question
    doesn't apply to it. Every "Translate into English" exercise in the
    paired overlay explicitly sets answer_language_code: en. No exercise in
    this unit tests a genuine two-clause sentence joined by "and"/comma
    (§12) -- every multi-sentence teaching/review line (lesson04 dialogue
    line 1 and line 4, lesson06's price/pickup review) is authored as two
    separate short sentences, matching how units 34/45/46/47 already treat
    their own two-sentence notes, with paraphrase-variant accepted answers
    rather than clause-join variants. Ran a recursive scan (grep for bare,
    unquoted yes/no/true/false/on/off tokens as YAML scalar values, plus a
    full yaml.safe_load parse of both this file and its paired overlay
    confirming every value that loaded is a str/list/dict, never a Python
    bool anywhere in a learner-facing field) for bare unquoted yes/no/
    true/false/on/off values (including matching_pairs right: values
    specifically) -- zero hits, see the overlay's own review note for the
    exact scan result. Ran a Persian-vs-Arabic codepoint scan (grep for
    Arabic kaf U+0643 and Arabic yeh U+064A across both files) -- zero
    hits, all keheh/yeh in this file use the correct Persian-range
    codepoints (U+06A9/U+06CC).

    Review 2026-10-21 (en-fa A1 pass): 1 fix - lesson01 translation item written with a comma. NATIVE FLAGS: (1) کِی می‌گیرم؟ (kept with the kasra, as in units 22/31/32, to tell 'when' from 'who') for 'when do I pick it up?' - می‌گیرم is understood, but a native speaker might prefer e.g. کی بیام بگیرم؟ or کی تحویل می‌گیرم؟ for collecting finished laundry; (2) sign line لباس‌ها فوری ('clothes express') is shorthand - a native speaker may prefer a phrase like شست‌وشوی فوری لباس; (3) dialogue logic: the customer agrees to tomorrow noon and later asks when to pick up, which is redundant but harmless.

