            tested_text: "می‌رم به خشکشویی."
            prompt: {target_blocks: [{text: "می‌رم به خشکشویی.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit48.lesson01.exercise03.match_laundry_one
            type: matching_pairs
            tested_text: "خشکشویی لباس‌ها این می‌رم به می‌رم به خشکشویی"
