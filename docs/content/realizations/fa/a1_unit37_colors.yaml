generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit, via direct pdftotext extraction (not Firecrawl, which had zero
    credits left this session -- disclosed honestly) of the Live Lingua-hosted
    copy (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf,
    Acrobat Pro DC "Paper Capture Plug-in" OCR layer, 66,445 words
    extractable, unlike the DigitalOcean-mirror copy used for unit36's
    provenance and re-tried first here, which is a JBIG2-only scan with no
    extractable text at all -- both were fetched and diffed this pass, not
    assumed). Grepping the extracted text for "color"/"colour" found a real,
    genuine "Colors" vocabulary section (source page ~312 of the OCR text
    stream, inside a grammar-notes appendix following a tailor/cloth-shopping
    dialogue unit): white / black (siyâh) / red (qermez / sorx) / blue (âbi)
    / yellow (zard) / green (sabz). This is a genuine find, not a dead end
    like several prior units' provenance notes -- but honestly, five of
    these six words were already independently taught in this project's own
    fa corpus before this unit (سفید/سیاه/قرمز/آبی in unit20's clothing-
    shopping colors lesson, سبز in unit25's eye-color lesson), so the FSI
    source mostly *corroborates* this project's own already-shipped word
    choices rather than contributing new ones. زرد (yellow) is the one
    genuinely new-to-corpus word this unit teaches that the FSI source
    itself also lists, a real if narrow source contribution. The same page's
    drill sentences (choosing "parceye zerdaro" / "parceye sefiqero" /
    "parceye qermezaro" -- yellow/white/red cloth -- and "range lebase
    xodresra âbi ... entexab kerd", he chose the blue color for his own
    clothes) independently confirm all of these are used exactly the way
    this project's corpus already uses them (color + fused copula, or color
    + noun), not archaic or divergent. نارنجی (orange), صورتی (pink), بنفش
    (purple), and خاکستری (gray) do NOT appear anywhere in the source's own
    six-color list or its surrounding drills -- these four are authored
    fresh from this project's own established colloquial Iranian Farsi
    conventions, not sourced from FSI at all, disclosed honestly rather than
    overclaiming source coverage.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) checked this unit against every
    item on the standing review checklist and found no bugs on the
    realization side itself (the one small gap found this pass -- a missing
    accepted-answer period variant -- was on the paired overlay, see that
    file's own review note). No listen_select/listen_type exercises exist in
    this unit, so the same-speaker-distractor bug class doesn't apply. No
    stray unquoted yes/no/true/false/on/off values in any learner-facing
    field. Every exercise type used has a matching case in
    ExerciseRenderer.tsx. matching_pairs pairs and word_order/accepted_
    answers shapes match exactly between this realization and its overlay.
    Cross-checked object colors across lessons for consistency (Sara's book
    is purple, Nima's car is blue, consistently through the dialogue and its
    comprehension/matching exercises). Every spine_outcome_id resolves to a
    real universal_spine.yaml entry. No internal jargon leaks into
    learner-facing text. Spot-checked the genuine-but-modest FSI source
    contribution disclosed in generation_provenance (زرد corroborated by the
    source; نارنجی/صورتی/بنفش/خاکستری honestly disclosed as NOT
    source-derived) -- accurately represented, not overclaimed. The Farsi
    reads naturally with consistent colloquial Iranian register. Re-validated
    clean: 0 errors/0 warnings standalone and as part of the full 6-unit
    (33-38) fresh-context review batch.

    Originally authored 2026-07-09 by Claude (content-authoring worker session).
    Realizes universal.a1.colors.describe_colors, the next unrealized A1
    outcome after unit36 (personality) -- confirmed by an exact diff of
    every spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files against every
    universal.a1.* id in docs/content/universal_spine.yaml: fa had realized
    all 37 non-colors A1 outcomes through personality, with colors the next
    one in spine declaration order (seasons, emergencies, lost_items,
    appointments, library, waste_disposal remain unrealized after this
    unit). Prerequisite universal.a1.shopping.ask_prices_quantities
    (unit08) already covered. Scoped to the outcome's four assessment
    requirements: understanding a spoken color description (listening, via
    the lesson04 dialogue plus its dialogue_comprehension exercise),
    stating the color of a real or supplied object (speaking/production,
    via translate/dialogue_response/writing_prompt exercises across lessons
    01-06), interpreting a short written object-color description (reading,
    lesson05's reading_comprehension exercises), and writing a short
    object-color sentence (writing, lesson05/lesson06's writing_prompt
    exercises). Deliberately scoped to naming/describing colors of everyday
    objects only (fruit, furniture, a pet, a book, a house) rather than
    re-teaching clothing-shopping (unit20) or eye/hair-color appearance
    (unit25) phrasing -- reuses those units' already-taught color words
    (رنگ, سفید, سیاه, قرمز, آبی, سبز, قهوه‌ای) via re-declared
    introduced_tokens rather than re-teaching them as new vocabulary cards,
    and introduces five genuinely new color words this unit (زرد, نارنجی,
    صورتی, بنفش, خاکستری) plus a new "رنگش چیه؟"/"چه رنگیه؟" question
    pattern (structurally parallel to unit25's چه شکلیه؟ and unit36's چه
    جوریه؟, reusing the established ش possessive-suffix pattern rather than
    inventing a new one). Uses structured speaker fields for all dialogue
    turns; no spoken text embeds a "Name:" prefix. Every vocabulary card has
    an example sentence per schema 1.1. Already-taught words reused from
    earlier units (رنگ, سفید, سیاه, قرمز, آبی, سبز, قهوه‌ای, نیست, دوست
    دارم, رو, هم, تو چی؟, هست, اونجا, تو خونه, من, باحاله, etc.) are
    re-declared in introduced_tokens before first tested use in this file
    because the compiler's untaught-vocabulary check is per-file only. No
    fill_in_blank or audio-only exercise types are used (fa has real TTS per
    AUTHORING_GUIDE.md #14, but this file continues the established
    text-based corpus-consistency pattern from units 19-36, same choice
    those units' own reviews made). Every matching_pairs exercise has 7-8
    pairs. Every translate-into-English exercise in the paired overlay
    explicitly sets answer_language_code: en. Ran a recursive
    yaml.safe_load scan over this file and its paired overlay for bare
    unquoted yes/no/true/false/on/off values -- zero hits (see the overlay's
    own review note for the exact scan result).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: fused
    copula predicates (زرده, نارنجیه, صورتیه, بنفشه, خاکستریه) built the
    same way as units 20/25/36's قرمزه/آبیه/خجالتیه forms, رو as object
    marker, and تو-register dialogue. Reuses رنگ/سفید/سیاه/قرمز/آبی/سبز
    (unit20), قهوه‌ای (unit25), نیست (unit23), دوست دارم/رو (unit14), تو
    چی؟ (unit14), هست/اونجا (unit05), تو خونه (unit19), and هم/باحاله
    (unit36) without re-teaching them from scratch.

media_assets:
  - content_key: fa.a1.unit37.audio.colors.vocab.01
    language: fa
    text: "زرد، نارنجی، صورتی"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit37.audio.colors.vocab.02
    language: fa
    text: "بنفش، خاکستری"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit37.audio.dialogue.colors.01
    language: fa
    text: "نیما: سارا، رنگ کتابت چیه؟ سارا: بنفشه. رنگ ماشینت چیه؟ نیما: آبیه. رنگ آبی رو خیلی دوست دارم. سارا: من هم رنگ بنفش رو دوست دارم. نیما: باحاله!"
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit37.colors
    title: رنگ‌ها
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.colors.describe_colors
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit37.lesson01.new_colors_one
        title: "رنگ‌های جدید ۱"
        spine_outcome_id: universal.a1.colors.describe_colors
        teaching:
          - content_key: fa.a1.unit37.lesson01.teach.zard
            kind: vocabulary
            target: {text: زرد, language_code: fa, direction: rtl}
            introduced_tokens: [زرد]
            example: {text: "موز زرده.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit37.lesson01.teach.narenji
            kind: vocabulary
            target: {text: نارنجی, language_code: fa, direction: rtl}
            introduced_tokens: [نارنجی]
            example: {text: "گربه‌ی من نارنجیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit37.lesson01.teach.soorati
            kind: vocabulary
            target: {text: صورتی, language_code: fa, direction: rtl}
            introduced_tokens: [صورتی]
            example: {text: "پیراهنم صورتیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit37.lesson01.teach.review_known_colors
            kind: grammar_note
            target: {text: "رنگ (color) / سفید (white) / سیاه (black) / قرمز (red) / آبی (blue) / سبز (green) / قهوه‌ای (brown) -- already known from units 20 and 25", language_code: fa, direction: rtl}
            introduced_tokens: [رنگ, سفید, سیاه, قرمز, آبی, سبز, "قهوه‌ای", سفیده, سیاهه, قرمزه, آبیه, سبزه, "قهوه‌ایه", موز, "گربه‌ی من", پیراهنم, زرده, نارنجیه, صورتیه]
        exercises:
          - content_key: fa.a1.unit37.lesson01.exercise01.recognize_zard
            type: multiple_choice
            tested_text: زرد
            prompt: {target_blocks: [{text: زرد, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson01.exercise02.recognize_narenji
            type: multiple_choice
            tested_text: نارنجی
            prompt: {target_blocks: [{text: نارنجی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson01.exercise03.match_colors_one
            type: matching_pairs
            tested_text: "زرد نارنجی صورتی سفید سیاه قرمز آبی سبز"
            prompt: {target_blocks: []}
            pairs:
              - {left: زرد, right: yellow}
              - {left: نارنجی, right: orange}
              - {left: صورتی, right: pink}
              - {left: سفید, right: white}
              - {left: سیاه, right: black}
              - {left: قرمز, right: red}
              - {left: آبی, right: blue}
              - {left: سبز, right: green}
          - content_key: fa.a1.unit37.lesson01.exercise04.word_order_moz_zarde
            type: word_order
            tested_text: "موز زرده"
            prompt: {target_blocks: [{text: "The banana is yellow.", language_code: en, direction: ltr}]}
            word_bank: [موز, زرده]
          - content_key: fa.a1.unit37.lesson01.exercise05.translate_pirahanam_soorati
            type: translation
            tested_text: "پیراهنم صورتیه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit37.lesson02.new_colors_two
        title: "رنگ‌های جدید ۲"
        spine_outcome_id: universal.a1.colors.describe_colors
        teaching:
          - content_key: fa.a1.unit37.lesson02.teach.banafsh
            kind: vocabulary
            target: {text: بنفش, language_code: fa, direction: rtl}
            introduced_tokens: [بنفش]
            example: {text: "کتابم بنفشه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit37.lesson02.teach.khakestari
            kind: vocabulary
            target: {text: خاکستری, language_code: fa, direction: rtl}
            introduced_tokens: [خاکستری]
            example: {text: "میز خاکستریه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit37.lesson02.teach.review_negation
            kind: grammar_note
            target: {text: "ماشین سیاه نیست، سفیده. (The car isn't black, it's white.) -- نیست negates the fused copula, already taught from unit23", language_code: fa, direction: rtl}
            introduced_tokens: [نیست, ماشین, کتابم, میز, بنفشه, خاکستریه]
        exercises:
          - content_key: fa.a1.unit37.lesson02.exercise01.recognize_banafsh
            type: multiple_choice
            tested_text: بنفش
            prompt: {target_blocks: [{text: بنفش, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson02.exercise02.recognize_mashin_siyah_nist
            type: multiple_choice
            tested_text: "ماشین سیاه نیست"
            prompt: {target_blocks: [{text: "ماشین سیاه نیست", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson02.exercise03.match_colors_two
            type: matching_pairs
            tested_text: "بنفش خاکستری کتابم بنفشه میز خاکستریه ماشین سیاه نیست سفیده"
            prompt: {target_blocks: []}
            pairs:
              - {left: بنفش, right: purple}
              - {left: خاکستری, right: gray}
              - {left: "کتابم بنفشه.", right: "My book is purple."}
              - {left: "میز خاکستریه.", right: "The table is gray."}
              - {left: "ماشین سیاه نیست.", right: "The car isn't black."}
              - {left: سفیده, right: "it's white"}
              - {left: نیست, right: "is not"}
          - content_key: fa.a1.unit37.lesson02.exercise04.word_order_miz_khakestari
            type: word_order
            tested_text: "میز خاکستریه"
            prompt: {target_blocks: [{text: "The table is gray.", language_code: en, direction: ltr}]}
            word_bank: [میز, خاکستریه]
          - content_key: fa.a1.unit37.lesson02.exercise05.translate_ketabam_banafsh
            type: translation
            tested_text: "کتابم بنفشه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit37.lesson03.asking_about_color
        title: "پرسیدن درباره‌ی رنگ"
        spine_outcome_id: universal.a1.colors.describe_colors
        teaching:
          - content_key: fa.a1.unit37.lesson03.teach.rangesh_chiye
            kind: phrase
            target: {text: "رنگش چیه؟", language_code: fa, direction: rtl}
            introduced_tokens: ["رنگش", چیه]
          - content_key: fa.a1.unit37.lesson03.teach.che_rangiye
            kind: phrase
            target: {text: "چه رنگیه؟", language_code: fa, direction: rtl}
            introduced_tokens: ["چه رنگیه"]
          - content_key: fa.a1.unit37.lesson03.teach.answer_rang_mashinam
            kind: phrase
            target: {text: "رنگ ماشینم آبیه.", language_code: fa, direction: rtl}
            introduced_tokens: ["ماشینم"]
          - content_key: fa.a1.unit37.lesson03.teach.review_ask_color
            kind: grammar_note
            target: {text: "رنگش چیه؟ (what color is it? -- ش possessive suffix, same as شخصیتش/موهاش/چشماش) / چه رنگیه؟ (an alternative phrasing, same pattern as چه جوریه؟)", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit37.lesson03.exercise01.recognize_rangesh_chiye
            type: multiple_choice
            tested_text: "رنگش چیه؟"
            prompt: {target_blocks: [{text: "رنگش چیه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson03.exercise02.recognize_che_rangiye
            type: multiple_choice
            tested_text: "چه رنگیه؟"
            prompt: {target_blocks: [{text: "چه رنگیه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson03.exercise03.match_asking_color_words
            type: matching_pairs
            tested_text: "رنگش چیه رنگ ماشینم آبیه"
            prompt: {target_blocks: []}
            pairs:
              - {left: "رنگش چیه؟", right: "What color is it?"}
              - {left: "رنگ ماشینم آبیه.", right: "My car's color is blue."}
              - {left: چیه, right: "is what"}
              - {left: زرد, right: yellow}
              - {left: نارنجی, right: orange}
              - {left: صورتی, right: pink}
          - content_key: fa.a1.unit37.lesson03.exercise04.word_order_rangesh_chiye
            type: word_order
            tested_text: "رنگش چیه"
            prompt: {target_blocks: [{text: "What color is it?", language_code: en, direction: ltr}]}
            word_bank: ["رنگش", چیه]
          - content_key: fa.a1.unit37.lesson03.exercise05.translate_rang_mashinam
            type: translation
            tested_text: "رنگ ماشینم آبیه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit37.lesson04.color_dialogue
        title: "گفتگو درباره‌ی رنگ کتاب و ماشین"
        spine_outcome_id: universal.a1.colors.describe_colors
        teaching:
          - content_key: fa.a1.unit37.lesson04.teach.ketabet
            kind: phrase
            target: {text: "رنگ کتابت چیه؟", language_code: fa, direction: rtl}
            introduced_tokens: ["کتابت"]
          - content_key: fa.a1.unit37.lesson04.teach.mashinet
            kind: phrase
            target: {text: "رنگ ماشینت چیه؟", language_code: fa, direction: rtl}
            introduced_tokens: ["ماشینت"]
          - content_key: fa.a1.unit37.lesson04.teach.review_dislike_like
            kind: grammar_note
            target: {text: "رنگ آبی رو دوست دارم. (I like the color blue.) -- reuses دوست دارم/رو from unit14", language_code: fa, direction: rtl}
            introduced_tokens: ["دوست دارم", رو, "دوست دارد", خیلی, سارا, نیما]
          - content_key: fa.a1.unit37.lesson04.teach.dialogue_line1
            kind: dialogue
            target: {text: "سارا، رنگ کتابت چیه؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit37.lesson04.teach.dialogue_line2
            kind: dialogue
            target: {text: "بنفشه. رنگ ماشینت چیه؟", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: []
          - content_key: fa.a1.unit37.lesson04.teach.dialogue_line3
            kind: dialogue
            target: {text: "آبیه. رنگ آبی رو خیلی دوست دارم.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit37.lesson04.teach.dialogue_line4
            kind: dialogue
            target: {text: "من هم رنگ بنفش رو دوست دارم.", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: []
          - content_key: fa.a1.unit37.lesson04.teach.dialogue_line5
            kind: dialogue
            target: {text: "باحاله!", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [باحاله, هم]
        exercises:
          - content_key: fa.a1.unit37.lesson04.exercise01.dialogue_comprehension_colors
            type: dialogue_comprehension
            tested_text: "سارا رنگ کتابت چیه بنفشه رنگ ماشینت چیه آبیه رنگ آبی رو خیلی دوست دارم من هم رنگ بنفش رو دوست دارم باحاله"
            media_asset_key: fa.a1.unit37.audio.dialogue.colors.01
            prompt: {target_blocks: [{text: "نیما از سارا می‌پرسه کتابش چه رنگیه. سارا می‌گه کتابش بنفشه.", language_code: fa, direction: rtl}]}
            correct_option: "Sara's book is purple."
            distractors:
              - "Sara's book is blue."
              - "Sara's car is purple."
              - "Nima's book is yellow."
          - content_key: fa.a1.unit37.lesson04.exercise02.recognize_rang_mashinet
            type: multiple_choice
            tested_text: "رنگ ماشینت چیه؟"
            prompt: {target_blocks: [{text: "رنگ ماشینت چیه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson04.exercise03.match_dialogue_words
            type: matching_pairs
            tested_text: "نیما سارا کتابت ماشینت بنفشه آبیه هم باحاله"
            prompt: {target_blocks: []}
            pairs:
              - {left: نیما, right: Nima}
              - {left: سارا, right: Sara}
              - {left: "کتابت", right: "your book"}
              - {left: "ماشینت", right: "your car"}
              - {left: بنفشه, right: "it's purple"}
              - {left: آبیه, right: "it's blue"}
              - {left: هم, right: also}
              - {left: باحاله, right: cool}
          - content_key: fa.a1.unit37.lesson04.exercise04.dialogue_response_ask_book_color
            type: dialogue_response
            tested_text: "بنفشه."
            prompt: {target_blocks: [{text: "سارا، رنگ کتابت چیه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit37.lesson04.exercise05.translate_manham_banafsh
            type: translation
            tested_text: "من هم رنگ بنفش رو دوست دارم."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit37.lesson05.reading_colors
        title: "خواندن درباره‌ی رنگ‌ها"
        spine_outcome_id: universal.a1.colors.describe_colors
        teaching:
          - content_key: fa.a1.unit37.lesson05.teach.roo_word
            kind: grammar_note
            target: {text: "روی (on / on top of)", language_code: fa, direction: rtl}
            introduced_tokens: [روی]
