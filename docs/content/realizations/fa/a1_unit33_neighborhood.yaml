generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: codex
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit. Reached the Yojik FSI Persian course page and opened the
    linked Spoken Persian Student Text PDF
    (https://fsi-languages.yojik.eu/languages/FSI/Persian/Spoken%20Persian.PDF,
    398 pages); the page itself states that the FSI/DLI/Peace Corps content
    it hosts is public domain. Tried direct PDF text search for this unit's
    neighborhood terms (neighbor, neighborhood, street, near). Honest result:
    the browser-accessible PDF text layer returned no usable matches in this
    environment, so no FSI phrase or sentence is treated as a confirmed source
    hit for this unit. Authored the unit from this course's established fa
    conventions instead: modern Iranian colloquial register, recurring
    نیما/سارا cast, already-established خانه/پارک/مدرسه/مغازه place words, and
    A1 location patterns with نزدیک, کنار, and هست. No source sentence is
    imported verbatim.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed ONE real
    narrative-consistency bug: lesson04.exercise01's dialogue_comprehension
    prompt summarizes the whole dialogue in third person ("نیما می‌گوید
    محله‌اش آرومه. نزدیک خانه‌اش پارک هست. همسایه‌اش خوبه...") but its final
    clause reverted to the first-person possessive left over from the
    original dialogue line ("...و کنار خانه ما زندگی می‌کنه" -- "lives next
    to OUR house"), which doesn't parse against a narrator describing Nima in
    the third person. Fixed to "کنار خانه‌اش زندگی می‌کنه" ("lives next to
    HIS house"), consistent with the rest of the same sentence and with every
    other "خانه ما" occurrence in this file (all of which are legitimately
    first-person, spoken directly by نیما, and were left untouched). Checked
    every other dialogue_comprehension/reading_comprehension prompt in this
    unit for the same first-person-leftover pattern -- none found. Everything
    else in this unit was checked clean: no listen_select/listen_type
    exercises exist in this unit at all (only dialogue_comprehension/
    dialogue_response/multiple_choice/reading_comprehension/matching_pairs/
    word_order/translation/writing_prompt), so the same-speaker-distractor
    bug class doesn't apply; no stray unquoted yes/no/true/false/on/off
    values in any learner-facing field (only the legitimate
    human_reviewed/target_language_first schema booleans); every exercise
    type used has a matching case in ExerciseRenderer.tsx; matching_pairs
    pairs and word_order/accepted_answers shapes match exactly between this
    realization and its overlay; every spine_outcome_id resolves to a real
    universal_spine.yaml entry; no internal jargon leaks into learner-facing
    text; the Farsi reads naturally and with consistent colloquial Iranian
    register throughout. Re-validated clean after the fix: 0 errors/0
    warnings standalone and as part of the full 6-unit (33-38) fresh-context
    review batch.

    Originally authored 2026-07-09 by Codex. Realizes
    universal.a1.neighborhood.describe_neighborhood, the next unrealized A1
    outcome after unit32. Confirmed by yaml.safe_load recursive collection of
    every spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files and exact diff against
    every universal.a1.* id in docs/content/universal_spine.yaml. The current
    next missing ids were neighborhood, post, cooking, personality, colors,
    seasons, emergencies, and lost_items, in that order. Scoped to describing
    a neighborhood, naming nearby places, saying where someone lives, and
    giving one basic neighbor detail. Uses structured speaker fields for
    dialogue turns; no spoken text embeds a "Name:" prefix. Every vocabulary
    card has an example sentence per schema 1.1. Already-taught words reused
    from earlier units are re-declared in introduced_tokens before first
    tested use in this file because the compiler's untaught-vocabulary check
    is per-file only. No fill_in_blank or audio-only exercise types are used.
    Every matching_pairs exercise has 6-8 pairs. Every translate-into-English
    exercise in the paired overlay explicitly sets answer_language_code: en.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: رو as object
    marker where needed, تو-register dialogue, colloquial copula contractions
    such as آرومه/خوبه, and simple present-tense forms. Uses everyday Iranian
    neighborhood words: محله, همسایه, خیابان, نزدیک, کنار, and زندگی می‌کنم.

