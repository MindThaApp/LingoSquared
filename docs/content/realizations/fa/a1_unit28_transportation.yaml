            introduced_tokens: [با]
          - content_key: fa.a1.unit28.lesson01.teach.otobus_review
            kind: vocabulary
            target: {text: اتوبوس, language_code: fa, direction: rtl}
            introduced_tokens: [اتوبوس]
            example: {text: "با اتوبوس می‌رم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit28.lesson01.teach.ba_otobus_phrase
            kind: phrase
            target: {text: "با اتوبوس می‌رم", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌رم"]
          - content_key: fa.a1.unit28.lesson01.teach.metro_word
