generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at the FSI Persian Basic Course source this
    pass (a genuinely new fetch+read this session, not reused from any
    prior unit's cached finding): downloaded
    https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf directly
    (pdfinfo confirms Author: US FSI, 398 pages), ran pdftotext -layout
    against the full document, and grepped the extracted text for
    transportation-related English terms (bus, train, taxi, car,
    automobile, bicycle, bike, transport, walk, foot, drive, traffic,
    ticket, station) plus transliterated Persian forms (otobus, docarxe,
    masin). Unlike units 24-27's clean zero-hit result, this search found
    real, if scattered, transportation content: a "Taxi Driver" dialogue
    (hotel-arrival scene: hailing a taxi, loading luggage, "Take me to
    the Ferdowsi hotel") and a separate narrative passage describing
    Tehran that mentions "otobushaye tehran do tabaqmst" (the buses of
    Tehran are double-decked) alongside taxis (taksiha) and cars
    (savaraha) as part of a city description. Confirmed both are genuine
    hits, not tokenizer noise, by reading the surrounding page context
    directly. Neither is usable as-is: the taxi dialogue is a dated
    diplomatic-arrival scene with no everyday-commute framing (bus/bike/
    on-foot/recommendation), and the double-decker-bus detail is now
    factually outdated (Tehran's bus fleet is not double-decked today) so
    would fail this guide's own modernization bar if reused. No dedicated
    transportation-vocabulary unit exists anywhere in the source (this
    course is organized by grammatical progression, not vocabulary topic,
    per units 24-27's own independently-confirmed structural finding, now
    a fifth confirmation). Authored fresh using this project's established
    fa register/character conventions instead, informed only by the real
    cultural detail that taxis/buses are a normal part of getting around
    an Iranian city (not by any copied phrasing), and built directly on
    already-taught vocabulary (اتوبوس/بلیط from unit16, سر کار from
    unit11, بهتره from unit15, قیمت/چقدر from unit03/unit08/unit21)
    rather than re-teaching those words from scratch.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found this unit clean: 0
    compiler errors/warnings (validated together with units 27/29-32 and
    their overlays), 0 stray YAML boolean coercions (recursive
    yaml.safe_load type scan), no listen_select/listen_type/listen_order
    exercises (none authored here, consistent with the unit's own
    provenance note), and the one dialogue_response exercise is
    free-text (no distractors, so the same-speaker-distractor bug class
    doesn't apply). Explicitly checked the paired overlay's own claim
    that unit29 flagged a missing answer_language_code on this unit's
    "Translate into English" exercises -- re-verified directly via a
    parsed-YAML walk and found all 3 such exercises already correctly
    set answer_language_code: en, so no fix was actually needed there
    (the flag in unit29's notes appears to have been already resolved
    by the time of this review, or based on a stale read). Cross-checked
    every stated fact (who commutes how, which vehicle is recommended
    and why, the bus ticket price/frequency) against every other
    exercise/reading/dialogue touching the same facts -- all mutually
    consistent. All exercise types used have a matching
    ExerciseRenderer.tsx case. No real bugs found requiring a fix.
    Original authoring notes below, retained for context.

    Draft authored 2026-07-09 by a Sonnet 5 worker task. Realizes
    universal.a1.transportation.getting_around_town (prerequisite:
    universal.a1.directions.ask_follow_basic_directions, covered by
    unit05's merged places/directions content). Fa's next uncovered A1
    outcome after unit27 (sports) -- confirmed by an exact diff of every
    spine_outcome_id used across all fa realization files (27 distinct
    A1 outcomes covered across units01-27, walked via yaml.safe_load, not
    a text grep) against every `id:` beginning `universal.a1.` in
    docs/content/universal_spine.yaml (36 total A1 ids at this spine
    file's current state -- re-checked immediately before authoring
    since the spine file is a known fast-moving target other sessions
    edit concurrently, per this project's standing footgun about not
    trusting a stale count): transportation is the very next A1 id after
    sports in the spine file's own ordering, and sports was itself
    confirmed correct in unit27's own review notes. Also re-verified
    immediately before authoring (per the standing parallel-session
    unit-collision footgun) that no unit28 file existed yet in
    docs/content/realizations/fa/ or docs/content/overlays/en-fa/ at the
    moment this file was created. Continues the نیما/سارا recurring cast
    from units 11-14/23-27. Scoped to: naming 6 ways to get around
    (اتوبوس bus and بلیط ticket reviewed from unit16; new: مترو metro/
    subway, ماشین car, دوچرخه bicycle, پیاده on foot, تاکسی taxi), the
    با (by/with) preposition for vehicle-based transport (با اتوبوس
    می‌رم) versus the adverbial پیاده with no preposition (پیاده می‌رم,
    matching real colloquial usage), combining هر روز (unit11) and سر
    کار (unit11) to describe a regular commute, a new کدوم (which)
    question word combined with unit15's already-taught بهتره
    (comparative "better") and unit06/07/14's already-taught یا (or) to
    ask which transport is better/recommended (اتوبوس یا مترو، کدوم
    بهتره؟), a local ticket-price question reusing unit03/08's قیمت and
    unit21's چقدر (بلیط اتوبوس چقدره؟), a short transit-schedule reading
    sentence combining unit09's already-taught دقیقه and unit03's
    already-taught پانزده with one new colloquial verb میاد (it comes),
    a reading passage about نیما's regular commute and سارا's, and a
    closing نیما/سارا dialogue comparing how they each get around and
    which is better. Grammatical notes for the fresh-context reviewer:
    (1) پیاده deliberately takes no با preposition (پیاده می‌رم, not
    با پیاده می‌رم) -- verified this is the correct natural colloquial
    pattern (پیاده functions adverbially, "on foot," parallel to how
    English "I walk" needs no preposition either), contrasted explicitly
    against the با + vehicle-noun pattern taught earlier in the same
    unit so the exception is visible, not silently inconsistent; (2)
    مدرسه (school), reused in lessons05/06 for سارا's commute
    destination, was already taught in unit18 (work) -- a same-A1-course
    reuse, not a cross-course-boundary reuse (unit18 is itself an A1
    unit like this one, so this doesn't trip the AUTHORING_GUIDE.md #18
    A1/A2-boundary concern, which is specific to multiple_choice/
    listen_select candidate floors anyway and doesn't apply here since no
    exercise in this unit tests مدرسه itself via those types); (3) هر
    روز (unit11), سر کار (unit11, re-split into سر/کار per that unit's
    own established single-word-per-token convention), بهتره (unit15),
    یا (unit06/07/14), قیمت (unit03/08), چقدر (unit21), دقیقه (unit09),
    پانزده (unit03), اتوبوس/بلیط (unit16), گاهی/چه خوب (unit24/27), and
    نیما/سارا/آره/ولی are all re-declared as review tokens at their
    first use in THIS file per the standing per-file untaught-vocabulary
    gotcha, same as every other reused cross-unit word here. Matches the
    spine outcome's 4 assessment_requirements exactly (listening via
    lesson06's dialogue_comprehension and lesson04's reading_comprehension
    of the transit-schedule sentence -- reading-visible per the same
    precedent units 13/24/25/26/27's fresh-context reviews accepted,
    since audio remains pending_generation; speaking via the
    dialogue_response exercise asking the learner to state a
    recommendation; reading via lesson05's reading_comprehension pair on
    نیما/سارا's commute passage; writing via the writing_prompt exercises
    in lessons05/06). matching_pairs pair counts grow across the unit by
    pooling cumulative in-unit vocabulary (4/6/7/8/8/8 pairs, lessons
    1-6) per AUTHORING_GUIDE.md #16 -- lesson01 stays smallest as the
    genuine first-lesson ceiling, matching the unit11/12/23/24/25/26/27
    precedent for a unit's own first lesson. Deliberately zero
    listen_type/listen_select/listen_order exercises anywhere, despite
    §14's 2026-07-06 revision technically permitting fa audio content now
    that Azure TTS covers Farsi -- consistent, documented corpus-wide
    choice matching units 17/18/24/25/26/27 (audio remains
    pending_generation, not yet a live recorded/TTS-backed asset for this
    specific new content). Not self-certified -- needs the mandatory
    fresh-context review before shipping, same as every other
    Claude-authored fa unit. Per this session's standing compiler gotcha
    (the untaught-vocabulary check is per-file only, tested_text scoped,
    cumulative across the whole file in document order, confirmed by
    reading validate_untaught_vocabulary in scripts/compile_content.py
    directly rather than assuming): every already-taught word reused from
    an earlier unit is re-declared as an introduced_tokens review token
    at its first tested_text use in THIS file; every teaching-card
    `example:` sentence is exempt from this check (validator only scopes
    tested_text) but was still written to be genuinely comprehensible
    from already-established vocabulary wherever practical. Also
    manually re-verified (per this session's standing YAML
    boolean-coercion gotcha) that no bare yes/no/true/false/on/off value
    appears anywhere in this file via a recursive yaml.safe_load type
    scan, not just a text grep -- see the paired overlay's review notes
    for the combined result across both files.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-15/21-27. Reuses unit03/08's قیمت,
    unit09's دقیقه, unit11's هر روز/سر کار, unit15's بهتره, unit16's
    اتوبوس/بلیط, unit21's چقدر, unit24/27's گاهی/چه خوب/می‌رم family, and
    the نیما/سارا cast without re-teaching the underlying constructions,
    only the new vocabulary that combines with them.

