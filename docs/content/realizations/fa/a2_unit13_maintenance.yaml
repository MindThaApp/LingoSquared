  notes: >-
    Fifth A2 unit for the fa realization (spine outcome: universal.a2.
    housing.report_maintenance_problem). Continues سارا's small recurring
    storyline (AUTHORING_GUIDE §11): having registered her new address
    (unit09) and opened a bank account near it (unit11), something in
    that same new apartment now breaks -- a genuine everyday follow-on,
    not a forced callback. Own scenario, authored independently of the
    English/Dutch A2 units and of the prs sibling realization of this
    same outcome (not consulted, per AUTHORING_GUIDE §8). A2-level
    step-up from A1's plain home-description vocabulary
    (universal.a1.housing.describe_home, this outcome's own
    prerequisite): the present-progressive داره ... می‌کنه construction
    ("it's leaking" -- an ongoing action, not a simple present-tense
    fact), and reporting a problem with duration (از دیروز -- since
    yesterday) before negotiating a repair time. Every kind:vocabulary
    card carries a real example: sentence built only from already-taught
    or same-lesson-taught tokens, with a matching overlay example_gloss,
    per §19 -- authored at schema_version 1.1 from the start. No
    fill_in_blank exercises used at all, sidestepping §13/§17 entirely,
    same precedent as unit09/10/11/12. No listen_type/listen_select/
    listen_order or audio-only dialogue_comprehension used anywhere in
    this unit per §14 -- every exercise has a genuine visible text
    prompt; a media_assets block is declared purely to pre-stage a
    future recording pass, unreferenced by any exercise here. Every
    multi-clause accepted_answers list carries period/comma/و-joined
    forms per §12. matching_pairs uses 6 pairs per §16. Every fact (the
    bathroom pipe, leaking since yesterday, repairman coming tomorrow at
    10am, سارا home until 11am) kept consistent across lesson02/03/04 per
    §11 -- lesson03's reading (a maintenance-request confirmation) and
    lesson04's dialogue (the actual phone call reporting it) deliberately
    describe the same repair request as one continuous episode, not two
    unrelated facts. Dialect: continues fa's established Iranian
    register (هستم-family copula, colloquial -e/-ه contractions like
    "چکه می‌کنه"/"خونه‌ام"), deliberately never Dari forms. Checked script
    purity by eye against known-correct Persian-range keheh/yeh usage
    throughout. firecrawl re-checked fresh this pass
    (`firecrawl --status`): still 0/1,000 credits -- authored via
    established-conventions-only per the standing contingency, same
    precedent as unit09/10/11/12's own provenance. Pending fresh-context
    review; left unreviewed per AUTHORING_GUIDE §9.
    Review 2026-10-20: 2 fixes - notice *لطفاً در خونه باشید* mixed
    written *در* with spoken *خونه* (and the rest of the notice is spoken:
    *میاد*), now *لطفاً خونه باشید* (teaching text and tested_text);
    spoken *می‌ره* now carries the ZWNJ (dialogue, tested_text,
    media_asset). Dialogue cards vs audio text, word_order banks and ezafe
    (لوله‌ی حمام) checked clean. NATIVE FLAGS: *میام/میاد* are left
    without ZWNJ as the usual lexicalized colloquial spelling; a native
    speaker may prefer *می‌یام/می‌یاد*.

