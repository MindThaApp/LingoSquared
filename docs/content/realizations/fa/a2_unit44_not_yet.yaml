  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 42-46 pass): read every teaching card, exercise and media text with the en-fa overlay; boolean, jargon, title-length, spine-outcome and Yeh/Kaf sweeps clean. 0 fixes in this file (the distractor and accepted-answer fixes are in the en-fa overlay). Checked: every هنوز, دیگه and هیچ sentence pairs with a negative verb; the one positive هنوز (still) is only in a note; the reading (booked, not ready, no room free, does not want the hotel) and the dialogue (not ordered, the coffees are not his, only water) agree with every comprehension key. NATIVE FLAGS: the four NATIVE QUESTIONS below still stand; also the vocabulary examples رزرو اینجاست (the booking is here) and وقت دکتر اینجاست (the doctor appointment is here) read as filler and may want a more natural sentence. Spine outcome: universal.a2.negation.correct_misunderstandings. Grammar target: هنوز + negative verb (“not yet”: هنوز نیومده، هنوز سفارش ندادم، اتاق هنوز آماده نیست), دیگه + negative verb (“not any more”: دیگه نمی‌خوام، دیگه اینجا کار نمی‌کنه), هیچ / هیچی / هیچ کس + negative verb (“none / nothing / nobody”: هیچی نمی‌خوام، هیچ کس نیومد، هیچ میزی خالی نیست), and the short answers هنوز نه / دیگه نه. Positive هنوز (“still”) is mentioned once for contrast. Register: casual spoken Tehrani; the waiter and clerk use شما forms. Characters: Sara and Nima plus an unnamed گارسون (waiter) and کارمند (clerk). Rulings applied: the unit accepts the present perfect (نیومده) and the simple past (نیومد) for “not yet”, and uses تا حالا only as an optional extra. NATIVE QUESTIONS: (1) Is هنوز سفارش ندادم (simple past) as natural as هنوز سفارش نداده‌م for “I have not ordered yet”? Recommended: keep the simple past in prompts and accept the perfect. (2) Is هیچ میزی خالی نیست natural, or would هیچ میزی خالی نداریم be preferred in a restaurant? Recommended: keep هیچ میزی خالی نیست. (3) Is the short answer هنوز نه natural for “not yet”? Recommended: yes, keep. (4) Is the position of دیگه before the negative verb (دیگه قهوه نمی‌خوام) the natural default over a position after the noun (قهوه دیگه نمی‌خوام)? Recommended: accept both; teach دیگه first in the clause.'
