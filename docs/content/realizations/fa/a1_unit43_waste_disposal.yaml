            kind: grammar_note
            target: {text: "رو (object marker) / می‌کنم (I do) / باید (must, need to) -- already taught from unit32", language_code: fa, direction: rtl}
            introduced_tokens: [رو, "می‌کنم", باید]
          - content_key: fa.a1.unit43.lesson01.teach.zabale
            kind: vocabulary
            target: {text: زباله, language_code: fa, direction: rtl}
            introduced_tokens: [زباله, این]
            example: {text: "این زباله‌ست.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit43.lesson01.teach.satl
            kind: vocabulary
            target: {text: سطل, language_code: fa, direction: rtl}
            introduced_tokens: [سطل]
            example: {text: "سطل کجاست؟", language_code: fa, direction: rtl}
