            prompt: {target_blocks: [{text: زباله, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit43.lesson01.exercise02.recognize_satl
            type: multiple_choice
            tested_text: سطل
            prompt: {target_blocks: [{text: سطل, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit43.lesson01.exercise03.match_waste_one
