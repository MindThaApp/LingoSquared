generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Firecrawl remains at 0 credits this session, so
    used direct pdftotext extraction against the Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf), the
    mirror with a real Acrobat Pro DC OCR text layer per every prior unit's
    finding this session (the DigitalOcean mirror is a JBIG2-only scan, 0
    extractable words, not re-attempted here since that dead end is already
    confirmed stable across units 36-42). This fetch extracted 66,717 words,
    consistent with every prior fetch of the same file. Grepped the full
    extracted text case-insensitively for trash/garbage/waste/rubbish/bin/
    dustbin/sort/recycl/zobale/ashghal: found only two false-positive hits on
    the bare English word "sort" (a "kind, sort, quality" glossary gloss for
    an unrelated Persian word, and the verb root "bin-" meaning "to see" --
    coincidental substring match, not "bin" the noun) and zero hits on
    trash/garbage/waste/rubbish/dustbin/recycl/zobale/ashghal anywhere in
    the extracted text. No household-waste-sorting scenario, bin vocabulary,
    or collection-schedule content exists anywhere in this source -- a
    genuine, honest dead end for this specific outcome, same conclusion as
    units 41/42's own searches for their respective outcomes. All vocabulary
    and dialogue in this unit is authored fresh from this project's own
    established colloquial Iranian Farsi conventions and already-shipped
    vocabulary (see review notes below for the exact reuse chain).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed ONE real,
    compiler-invisible bug per AUTHORING_GUIDE.md #19's "no forward
    references" rule: lesson01's zabale vocabulary card's own example
    ("این زباله‌ست.") used این ("this") before it was declared anywhere
    earlier in this file (این wasn't re-declared until lesson02's
    review_in_baraye grammar_note) -- this slipped past
    compile_content.py's validate_untaught_vocabulary check because that
    check only walks exercises' tested_text, never a teaching card's own
    example: field, so the file still validated 0 errors/0 warnings
    despite the real gap (confirmed by writing a standalone script
    replicating the compiler's own tokenize() against every example in
    this file, not by eyeballing it). Fixed by adding این to zabale's own
    introduced_tokens, the same self-contained-declaration pattern this
    unit's own pelastik card already uses for its پلاستیک/پلاستیکه
    contraction pair. Re-validated clean after the fix (0 errors/0
    warnings, standalone and as part of the 4-unit combined en-fa run).
    Everything else was checked clean: no same-speaker distractor
    collisions (lesson04's dialogue_comprehension exercise, the closest
    analogue to a listen_select in this text-only unit, has zero overlap
    with anything either نیما or سارا actually says in the dialogue); a
    real yaml.safe_load boolean-type walk (not just a grep) over both
    this file and its overlay found zero stray yes/no/true/false/on/off
    coercions -- the only booleans present are the legitimate
    human_reviewed/target_language_first metadata fields; a script
    confirmed no Arabic-range kaf/yeh codepoints anywhere, only the
    correct Persian keheh/yeh codepoints throughout; matching_pairs
    accepted_answers use the flat-dict shape (not the {left,right} array
    shape nl uses) -- confirmed this is the established fa-corpus-wide
    convention (checked against unit42), so left as-is rather than
    converted, since grade() already canonicalizes either shape and
    rewriting only these 4 units would create a fresh inconsistency
    against 40+ already-shipped fa units using the same pattern; every
    exercise type used (multiple_choice, matching_pairs, word_order,
    translation, dialogue_comprehension, dialogue_response,
    reading_comprehension, writing_prompt) is registered in
    ExerciseRenderer.tsx; no jargon leaks in any learner-facing field;
    recycling->blue bin, plain trash->green bin, and collection
    day->Saturday stay consistent across the dialogue and the reading
    notice; the Persian throughout reads as natural, contemporary
    Iranian colloquial register consistent with the established
    نیما/سارا friend-pair dynamic, with no Dari forms. Also cross-checked
    نیما and سارا against every other named character across the whole fa
    corpus (units 01-57) -- no collision, unlike the real
    کریمی/رضایی name collisions this same review pass found and fixed in
    the paired unit44/unit45 files (see those units' own review notes).

    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit42 (library, merged). Realizes
    universal.a1.waste_disposal.sort_household_waste, the next unrealized A1
    outcome after unit42 -- confirmed by an exact diff of every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files (grepped recursively for
    every "spine_outcome_id" occurrence, both the unit-level
    spine_outcome_ids list and each lesson's own spine_outcome_id field)
    against every universal.a1.* id in docs/content/universal_spine.yaml in
    the spine's own declaration order: fa had realized 43 of 50 A1 outcomes
    through unit42 (library), with waste_disposal the very next one in
    declaration order (library -> waste_disposal -> accommodation ->
    pharmacy -> personal_care -> bike_rental -> laundry ->
    swimming_pool) -- accommodation/pharmacy/personal_care/bike_rental/
    laundry/swimming_pool remain unrealized after this unit. Prerequisite
    outcomes (household.describe_chores/unit32, colors.describe_colors/
    unit37, dates.exchange_calendar_dates/unit10) are all already realized
    in this course, so no prerequisite gap blocks this unit.

    Reuse chain (all re-declared in this file's own introduced_tokens before
    first use, per the compiler's per-file-only untaught-vocabulary check):
    کجاست (unit05), رو/می‌کنم/باید (unit32's household-chores lesson01),
    رنگ/آبی/سبز (units20/25/37), کدوم (units10/14/28/38/41), داخل (unit02,
    there "بفرمایید داخل," please come in -- the same core "inside" sense
    reused here for "inside the bin," not a different sense, so not flagged
    the way پس/تا were in unit42), برای (unit34, "for"), سلام/ممنون
    (units01/17/22), باشه (units01/02/06/17/22), چی (unit32), کی
    (units16/32/34), خداحافظ (unit01/05/16), روز/شنبه (unit10), این
    (unit08), هم (unit01 and reinforced widely since). New vocabulary
    genuinely introduced for the first time in the whole corpus: زباله
    (trash/garbage), سطل (bin/bucket), کاغذ (paper), پلاستیک (plastic),
    شیشه (glass), بازیافت (recycling), جمع‌آوری (collection), and
    می‌ندازم/می‌ندازی (I put-throw / you put-throw, from انداختن -- the one
    new verb this unit introduces, following unit32's already-established
    می‌کنم -> می‌کنی conjugation-pair pattern exactly). No new sense is given
    to any already-known word in this unit (unlike unit42's پس/تا) -- داخل's
    reuse is the same "inside" sense unit02 already established, just
    applied to a new object (a bin instead of a doorway), a transparent
    extension rather than genuine polysemy.

    Deliberate grammar-simplicity choice, matching unit41/42's own explicit
    precedent: only one new verb (انداختن's می‌ندازم/می‌ندازی) is introduced
    for the whole unit, and این/رو are used sparingly and only where they
    were already established (رو from unit32, این from unit08) rather than
    adding new determiner patterns.

    Scoped to the outcome's real-world components: naming the trash bin
    (lesson01), naming the three sortable materials and recycling
    (lesson02), asking/stating which bin something goes in (lesson03), a
    full neighbor-to-neighbor dialogue covering the whole sorting question
    plus the collection day (lesson04), reading a short household
    waste-sorting notice with bin colors and collection day (lesson05), and
    a wrap-up review (lesson06). Register choice, explicitly noted per
    AUTHORING_GUIDE.md #3: نیما and سارا (the established friend pair, reused
    from unit37's own color dialogue) stay in the informal register already
    established for their exchanges throughout the corpus -- no new stranger
    character was needed for this outcome, since asking a friend/neighbor
    which bin to use is at least as natural a scenario as a formal service
    exchange. Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: recycling (کاغذ، شیشه) is stated as going in the
    blue bin (سطل آبی) identically in the dialogue (lesson04) and the
    reading notice (lesson05); the reading notice additionally states plain
    household trash goes in the green bin (سطل سبز), a fact not
    contradicted anywhere else in the unit since the dialogue never
    discusses plain trash's bin color, only recycling's; collection day is
    شنبه (Saturday), stated identically in the dialogue and the reading
    notice. Every kind:vocabulary card (زباله، سطل، کاغذ، پلاستیک، شیشه،
    بازیافت، جمع‌آوری) has an example sentence per schema 1.1/AUTHORING_
    GUIDE §19, built only from the card's own word plus tokens already
    declared earlier in THIS file (no forward references -- e.g. بازیافت's
    example needed برای/کاغذ, both declared earlier in the same lesson02
    teaching stack before بازیافت's own card). Every matching_pairs exercise
    has 6-7 pairs per §16. No listen_type/listen_select/listen_order
    exercise is used anywhere in this unit -- fa has real TTS per
    AUTHORING_GUIDE §14, but this file continues the established
    text-based corpus-consistency pattern from units 19-42, the same choice
    those units' own reviews made; this also means the same-speaker/
    same-audio distractor-collision bug class (found and fixed 2026-07-09
    in the nl corpus, commit 148240e) cannot directly apply here -- there is
    no listen_select exercise in this file to check. Checked anyway, since
    lesson04's dialogue_comprehension exercise is the closest analogue (a
    multiple-choice check tied to dialogue content): its three distractors
    ("He wants to know which bin plastic goes in."/"He wants to know where
    the recycling bin is."/"He wants to know when the library is open.")
    are plausible-fact alternatives, NOT lines either dialogue speaker
    (نیما or سارا) actually says or facts either speaker actually states
    anywhere in this unit's dialogue -- plastic is never mentioned in the
    dialogue at all (only paper and glass are), neither speaker is ever
    asked or states WHERE the recycling bin is physically located (only
    WHICH bin/color it is), and the library is a completely different
    unit's topic never mentioned here. Deliberately avoided a distractor
    like "which bin glass goes in" precisely because نیما DOES ask about
    glass later in the same dialogue ("شیشه چی؟") -- that would have been a
    real distractor/dialogue-content collision of the same shape as the
    documented same-speaker-audio footgun, even though this exercise isn't
    audio-based. Every "Translate into English" exercise in the paired
    overlay explicitly sets answer_language_code: en. The one genuine
    two-clause sentence tested for translation (lesson04.exercise05,
    "داخل سطل آبیه. برای بازیافته.") carries period-joined, comma-joined,
    and and-joined English variants per §12; lesson05's reading-note
    translation and lesson06's review sentence are each label-style/
    paraphrase-variant sentences rather than clause-join variants, matching
    unit42's own treatment of its colon-separated library note. Ran a
    recursive yaml.safe_load scan over this file and its paired overlay for
    bare unquoted yes/no/true/false/on/off values (including matching_pairs
    right: values specifically, the two fields that have bitten this corpus
    before) -- zero hits, see the overlay's own review note for the exact
    scan result.

    Review 2026-10-21 (en-fa A1 pass): 0 fixes - Persian re-read for
    naturalness, register consistency, script and ZWNJ (scanned: no Arabic
    yeh/kaf, no missing or detached ZWNJ forms); matches earlier units'
    spellings. NATIVE FLAGS: none.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما and
    سارا (the established friend pair, reused from unit37's color dialogue)
    stay in the informal register already established for their exchanges
    throughout the corpus. Reuses کجاست (unit05), رو/می‌کنم/باید (unit32),
    رنگ/آبی/سبز (units20/25/37), کدوم (units10/14/28/38/41), داخل (unit02),
    برای (unit34), کی (units16/32/34), and the full greeting/politeness set
    (سلام/ممنون/باشه/خداحافظ) without re-teaching any of it from scratch.
    No word is given a new sense beyond its existing corpus meaning in this
    unit (unlike unit42's پس/تا) -- داخل's reuse for "inside the bin" is the
    same core sense unit02 already established for "please come in."

