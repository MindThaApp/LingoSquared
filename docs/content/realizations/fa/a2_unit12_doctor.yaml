review:
  status: reviewed
  required_next_reviewer: fresh_context_content_review
  notes: >-
    Fourth A2 unit for the fa realization (spine outcome: universal.a2.
    health.attend_doctor_appointment). Reuses نیما, an already-established
    character from a1_unit57 (zoo), rather than inventing a new one for
    every unit (AUTHORING_GUIDE §11): he's had a severe headache for
    three days and goes to see دکتر رضایی. Own scenario, authored
    independently of the English/Dutch A2 units and of the prs sibling
    realization of this same outcome (not consulted, per AUTHORING_GUIDE
    §8). A2-level step-up from A1's plain "I have a headache"
    (universal.a1.health.describe_basic_problem, this outcome's own
    prerequisite): describing a symptom with both DURATION (از سه روز
    پیش -- since three days ago) and SEVERITY (شدید -- severe), plus
    understanding a doctor's spoken treatment instruction rather than
    just naming the problem. Every kind:vocabulary card carries a real
    example: sentence built only from already-taught or same-lesson-
    taught tokens, with a matching overlay example_gloss, per §19 --
    authored at schema_version 1.1 from the start. No fill_in_blank
    exercises used at all, sidestepping §13/§17 entirely, same precedent
    as unit09/unit10/unit11. No listen_type/listen_select/listen_order
    or audio-only dialogue_comprehension used anywhere in this unit per
    §14 -- every exercise has a genuine visible text prompt; a
    media_assets block is declared purely to pre-stage a future
    recording pass, unreferenced by any exercise here. Every multi-
    clause accepted_answers list carries period/comma/و-joined forms per
    §12. matching_pairs uses 6 pairs per §16. Every fact (headache
    duration = three days, no fever, doctor's instructions = rest a few
    days + take the prescribed medicine, appointment doctor = دکتر
    رضایی) kept consistent across lesson02/03/04 per §11 -- lesson03's
    reading (an appointment confirmation naming دکتر رضایی) and
    lesson04's dialogue (نیما's actual visit, with the same doctor)
    deliberately share the doctor's name as one continuous visit, not
    two separate unrelated facts. Dialect: continues fa's established
    Iranian register (هستم-family copula, colloquial -e/-ه contractions
    like "شدیده"/"سردرده"), deliberately never Dari forms. Checked
    script purity by eye against known-correct Persian-range keheh/yeh
    usage throughout. firecrawl re-checked fresh this pass
    (`firecrawl --status`): still 0/1,000 credits -- authored via
    established-conventions-only per the standing contingency, same
    precedent as unit09/unit10/unit11's own provenance. Pending
    fresh-context review; left unreviewed per AUTHORING_GUIDE §9.

course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: >-
    Neutral-polite spoken Iranian register for a routine doctor's-office
    visit. Introduces describing a symptom's duration (از ... پیش) and
    severity (شدید) together, and understanding a doctor's spoken
    treatment instruction with باید (must/should) -- the A2-level step
    up from A1's bare symptom-naming.

media_assets:
  - content_key: fa.a2.audio.doctor.words.01
    language: fa
    text: دکتر، سردرد، علائم، مدت، نسخه، استراحت
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a2.audio.doctor.symptom.01
    language: fa
    text: "از سه روز پیش سردرد شدیدی دارم."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a2.audio.dialogue.doctor_visit.01
    language: fa
    text: "دکتر رضایی: بفرمایید، چی شده؟ نیما: از سه روز پیش سردرد شدیدی دارم. دکتر رضایی: تب هم دارید؟ نیما: نه، فقط سردرده، ولی شدیده. دکتر رضایی: باشه، این نسخه رو بگیرید و چند روز استراحت کنید. نیما: چشم، ممنون دکتر."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: fa.a2.unit12.doctor
    title: رفتن به دکتر
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.health.attend_doctor_appointment
    planned_lesson_count: 4

    lessons:
      - content_key: fa.a2.unit12.lesson01.doctor_vocabulary
        title: کلمات مربوط به دکتر
        spine_outcome_id: universal.a2.health.attend_doctor_appointment
        teaching:
          - content_key: fa.a2.unit12.lesson01.teach.doctor_word
            kind: vocabulary
            target: {text: دکتر, language_code: fa, direction: rtl}
            introduced_tokens: [دکتر]
            example: {text: "نیما پیش دکتر رفت.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson01.teach.headache_word
            kind: vocabulary
            target: {text: سردرد, language_code: fa, direction: rtl}
            introduced_tokens: [سردرد]
            example: {text: "سردرد شدیدی دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson01.teach.symptoms_word
            kind: vocabulary
            target: {text: علائم, language_code: fa, direction: rtl}
            introduced_tokens: [علائم]
            example: {text: "دکتر درباره‌ی علائمم پرسید.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson01.teach.duration_word
            kind: vocabulary
            target: {text: مدت, language_code: fa, direction: rtl}
            introduced_tokens: [مدت]
            example: {text: "چه مدته این‌طوری هستید؟", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson01.teach.prescription_word
            kind: vocabulary
            target: {text: نسخه, language_code: fa, direction: rtl}
            introduced_tokens: [نسخه]
            example: {text: "دکتر یک نسخه داد.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson01.teach.rest_word
            kind: vocabulary
            target: {text: استراحت, language_code: fa, direction: rtl}
            introduced_tokens: [استراحت, چند, روز, کنم]
            example: {text: "باید چند روز استراحت کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson01.teach.bayad_note
            kind: grammar_note
            target: {text: "باید (must / should)", language_code: fa, direction: rtl}
            introduced_tokens: [باید]
        exercises:
          - content_key: fa.a2.unit12.lesson01.exercise01.recognize_doctor
            type: multiple_choice
            tested_text: دکتر
            prompt: {target_blocks: [{text: دکتر, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit12.lesson01.exercise02.recognize_prescription
            type: multiple_choice
            tested_text: نسخه
            prompt: {target_blocks: [{text: نسخه, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit12.lesson01.exercise03.match_doctor_words
            type: matching_pairs
            tested_text: "دکتر سردرد علائم مدت نسخه استراحت"
            prompt: {target_blocks: []}
            pairs:
              - {left: دکتر, right: doctor}
              - {left: سردرد, right: headache}
              - {left: علائم, right: symptoms}
              - {left: مدت, right: duration}
              - {left: نسخه, right: prescription}
              - {left: استراحت, right: rest}
          - content_key: fa.a2.unit12.lesson01.exercise04.order_rest_a_few_days
            type: word_order
            tested_text: "باید چند روز استراحت کنم"
            prompt: {target_blocks: []}
            word_bank: [باید, چند, روز, استراحت, کنم]
          - content_key: fa.a2.unit12.lesson01.exercise05.write_prescription
            tested_text: نسخه
            type: writing_prompt
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit12.lesson02.describing_a_symptom
        title: توصیف علائم
        spine_outcome_id: universal.a2.health.attend_doctor_appointment
        teaching:
          - content_key: fa.a2.unit12.lesson02.teach.headache_three_days_severe
            kind: phrase
            target: {text: "از سه روز پیش سردرد شدیدی دارم.", language_code: fa, direction: rtl}
            introduced_tokens: [از, سه, روز, پیش, شدیدی, دارم]
          - content_key: fa.a2.unit12.lesson02.teach.doctor_instruction
            kind: phrase
            target: {text: "دکتر گفت باید استراحت کنم و آب زیاد بخورم.", language_code: fa, direction: rtl}
            introduced_tokens: [گفت, کنم, آب, زیاد, بخورم, و]
          - content_key: fa.a2.unit12.lesson02.teach.full_symptom_and_instruction
            kind: phrase
            target: {text: "از سه روز پیش سردرد شدیدی دارم. دکتر گفت باید استراحت کنم.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a2.unit12.lesson02.exercise01.recognize_symptom_sentence
            type: multiple_choice
            tested_text: "از سه روز پیش سردرد شدیدی دارم"
            prompt: {target_blocks: [{text: "از سه روز پیش سردرد شدیدی دارم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit12.lesson02.exercise02.order_doctor_instruction
            type: word_order
            tested_text: "دکتر گفت باید استراحت کنم و آب زیاد بخورم"
            prompt: {target_blocks: []}
            word_bank: [دکتر, گفت, باید, استراحت, کنم, و, آب, زیاد, بخورم]
          - content_key: fa.a2.unit12.lesson02.exercise03.dialogue_response_how_long
            type: dialogue_response
            tested_text: "از سه روز پیش سردرد شدیدی دارم"
            prompt: {target_blocks: [{text: "چه مدته این‌طوری هستید؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit12.lesson02.exercise04.translate_symptom_and_instruction
            type: translation
            tested_text: "از سه روز پیش سردرد شدیدی دارم دکتر گفت باید استراحت کنم"
            prompt: {target_blocks: []}
          - content_key: fa.a2.unit12.lesson02.exercise05.write_symptom_sentence
            type: writing_prompt
            tested_text: "از سه روز پیش سردرد شدیدی دارم"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit12.lesson03.reading_an_appointment_confirmation
        title: خواندن تاییدیه‌ی نوبت
        spine_outcome_id: universal.a2.health.attend_doctor_appointment
        teaching:
          - content_key: fa.a2.unit12.lesson03.teach.appointment_word
            kind: vocabulary
            target: {text: نوبت, language_code: fa, direction: rtl}
            introduced_tokens: [نوبت, نوبتم, سه‌شنبه, ساعت, "۱۱", صبحه, صبح]
            example: {text: "نوبتم سه‌شنبه ساعت ۱۱ صبحه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson03.teach.earlier_word
            kind: vocabulary
            target: {text: زودتر, language_code: fa, direction: rtl}
            introduced_tokens: [زودتر, لطفاً, "۱۵"]
            example: {text: "لطفاً ۱۵ دقیقه زودتر بیایید.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson03.teach.confirmation_text
            kind: reading
            target: {text: "نوبت شما با دکتر رضایی، سه‌شنبه ساعت ۱۱ صبح است. لطفاً ۱۵ دقیقه زودتر بیایید. اگر علائم بعد از یک هفته بهتر نشد، دوباره تماس بگیرید.", language_code: fa, direction: rtl}
            introduced_tokens: [دقیقه, بیایید, بعد, هفته, بهتر, نشد, دوباره, تماس, بگیرید]
        exercises:
          - content_key: fa.a2.unit12.lesson03.exercise01.read_appointment_time
            type: reading_comprehension
            tested_text: "سه‌شنبه ساعت ۱۱ صبح"
            prompt: {target_blocks: [{text: "نوبت با دکتر رضایی چه روز و ساعتیه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit12.lesson03.exercise02.read_if_not_better
            type: reading_comprehension
            tested_text: "دوباره تماس بگیرید"
            prompt: {target_blocks: [{text: "اگر بعد از یک هفته علائم بهتر نشد، باید چیکار کنید؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit12.lesson03.exercise03.recognize_appointment
            type: multiple_choice
            tested_text: نوبت
            prompt: {target_blocks: [{text: نوبت, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit12.lesson03.exercise04.order_come_earlier
            type: word_order
            tested_text: "لطفاً ۱۵ دقیقه زودتر بیایید"
            prompt: {target_blocks: []}
            word_bank: [لطفاً, "۱۵", دقیقه, زودتر, بیایید]
          - content_key: fa.a2.unit12.lesson03.exercise05.write_appointment_time
            type: writing_prompt
            tested_text: "نوبتم سه‌شنبه ساعت ۱۱ صبحه"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit12.lesson04.doctor_visit_dialogue
        title: ویزیت دکتر
        spine_outcome_id: universal.a2.health.attend_doctor_appointment
        teaching:
          - content_key: fa.a2.unit12.lesson04.teach.whats_wrong
            kind: phrase
            target: {text: "بفرمایید، چی شده؟", language_code: fa, direction: rtl}
            introduced_tokens: [چی, شده]
          - content_key: fa.a2.unit12.lesson04.teach.turn01
            kind: dialogue
            target: {text: "بفرمایید، چی شده؟", language_code: fa, direction: rtl, speaker: "دکتر رضایی"}
            introduced_tokens: ["دکتر رضایی"]
          - content_key: fa.a2.unit12.lesson04.teach.turn02
            kind: dialogue
            target: {text: "از سه روز پیش سردرد شدیدی دارم.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [نیما]
          - content_key: fa.a2.unit12.lesson04.teach.turn03
            kind: dialogue
            target: {text: "تب هم دارید؟", language_code: fa, direction: rtl, speaker: "دکتر رضایی"}
            introduced_tokens: [تب]
          - content_key: fa.a2.unit12.lesson04.teach.turn04
            kind: dialogue
            target: {text: "نه، فقط سردرده، ولی شدیده.", language_code: fa, direction: rtl, speaker: نیما}
