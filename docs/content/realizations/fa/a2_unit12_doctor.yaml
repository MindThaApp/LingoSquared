          - content_key: fa.a2.unit12.lesson04.teach.turn05
            kind: dialogue
            target: {text: "باشه، این نسخه رو بگیرید و چند روز استراحت کنید.", language_code: fa, direction: rtl, speaker: "دکتر رضایی"}
            introduced_tokens: [باشه, این, بگیرید, چند, رو, و, کنید]
          - content_key: fa.a2.unit12.lesson04.teach.turn06
            kind: dialogue
            target: {text: "چشم، ممنون دکتر.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [چشم, سردرده, شدیده, شدید, داشت, کند]
        exercises:
          - content_key: fa.a2.unit12.lesson04.exercise01.comprehend_nima_symptom
            type: dialogue_comprehension
            tested_text: "از سه روز پیش سردرد شدیدی دارم"
            prompt:
              target_blocks:
                - {text: "بفرمایید، چی شده؟ — از سه روز پیش سردرد شدیدی دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit12.lesson04.exercise02.comprehend_doctor_instruction
            type: dialogue_comprehension
            tested_text: "این نسخه رو بگیرید و چند روز استراحت کنید"
