              target_blocks:
                - {text: "ببخشید، قطار ساعت نُه به اصفهان کی حرکت می‌کنه؟", language_code: fa, direction: rtl, speaker: نیما}
                - {text: "متاسفانه به خاطر مشکل فنی، یک ساعت تاخیر داره.", language_code: fa, direction: rtl, speaker: کارمند}
          - content_key: fa.a2.unit15.lesson04.exercise02.comprehend_nima_decision
            type: dialogue_comprehension
            tested_text: "منتظر قطار می‌مونم"
            media_asset_key: fa.a2.audio.dialogue.station_counter.01
            prompt:
              target_blocks:
                - {text: "بله، یک اتوبوس ساعت نُه و نیم از سکوی پنج حرکت می‌کنه، ولی باید بلیط جدید بخرید.", language_code: fa, direction: rtl, speaker: کارمند}
                - {text: "نه، مشکلی نیست. منتظر قطار می‌مونم.", language_code: fa, direction: rtl, speaker: نیما}
          - content_key: fa.a2.unit15.lesson04.exercise03.recognize_wait
            type: multiple_choice
            tested_text: منتظر
            prompt: {target_blocks: [{text: منتظر, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson04.exercise04.order_i_will_wait
            type: word_order
            tested_text: "منتظر قطار می‌مونم"
            prompt: {target_blocks: []}
            word_bank: [منتظر, قطار, "می‌مونم"]
          - content_key: fa.a2.unit15.lesson04.exercise05.dialogue_response_decline_bus
            type: dialogue_response
            tested_text: "نه مشکلی نیست منتظر قطار می‌مونم"
            prompt: {target_blocks: [{text: "بله، یک اتوبوس ساعت نُه و نیم از سکوی پنج حرکت می‌کنه، ولی باید بلیط جدید بخرید.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson04.exercise06.write_will_be_late_message
            type: writing_prompt
            tested_text: "قطارم یک ساعت تاخیر داره"
            prompt: {target_blocks: []}
