  method: ai_generated
  authoring_system: claude
  human_reviewed: false
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: fresh_context_content_review
  notes: >-
    Seventh A2 unit for the fa realization (spine outcome: universal.a2.
    travel.handle_travel_disruption) -- the first of 4 new fa A2 units
    covering 4 brand-new A2 spine outcomes added this session (travel
    disruption, online habits, weekly schedule, shopping complaint), added
    to match the same 4 outcomes en-nl just grew for its own A2 course.
    Reuses نیما, already established in a1_unit57 (zoo) and a2_unit12
    (doctor visit), rather than inventing a new character (AUTHORING_GUIDE
    §11): he is travelling by train from تهران to اصفهان and the train is
    delayed. Own scenario, authored independently of the English/Dutch A2
    units and of the prs sibling realization of this same outcome (not
    consulted, per AUTHORING_GUIDE §8) -- also did not consult the nl
    realization built for this same new spine outcome this session, per
    the same standing rule (own-scenario discipline applies across
    languages, not just sibling directions). A2-level step-up from A1's
    plain ticket-buying (universal.a1.travel.handle_basic_journey, this
    outcome's own prerequisite): understanding a real disruption
    announcement (delay + reason + new time), politely asking a station
    employee about an alternative route, and reading a written notice
    that states the same disruption in writing. Every kind:vocabulary
    card carries a real example: sentence built only from already-taught
    or same-lesson-taught tokens, with a matching overlay example_gloss,
    per §19 -- authored at schema_version 1.1 from the start. No
    fill_in_blank exercises used at all, sidestepping §13/§17 entirely,
    same precedent as every earlier fa A2 unit. No listen_type/
    listen_select/listen_order or audio-only dialogue_comprehension used
    anywhere in this unit per §14 -- every exercise has a genuine visible
    text prompt; a media_assets block is declared purely to pre-stage a
    future recording pass, unreferenced by any exercise here. Every
    multi-clause accepted_answers list carries period/comma/و-joined
    forms per §12. matching_pairs uses 6 pairs per §16. Every fact (the
    9am train to اصفهان, delayed one hour by a technical problem, still
    departing platform 3 at 10, an alternative 9:30 bus from platform 5
    that needs a separate ticket, نیما chooses to wait for the train) kept
    consistent across lesson02/03/04 per §11 -- lesson03's reading notice
    and lesson04's dialogue are treated as the same real event, not two
    unrelated facts. Dialect: continues fa's established Iranian register
    (هستم-family copula, ببخشید/بفرمایید, colloquial -e/-ه contractions
    like "داره"/"می‌کنه"), deliberately never Dari forms. Checked script
    purity by eye against known-correct Persian-range keheh/yeh usage
    throughout. firecrawl re-checked fresh this pass (`firecrawl
    --status`): still 0/1,000 credits, confirming the account remains
    genuinely exhausted -- authored via established-conventions-only per
    the standing contingency, same precedent as every earlier fa A2 unit's
    own provenance. Pending fresh-context review; left unreviewed per
    AUTHORING_GUIDE §9.

course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: >-
    Neutral-polite spoken Iranian register for a routine train-station
    exchange. Continues ببخشید as the established polite attention-getter
    and introduces به خاطر ... (because of ..., + noun) as an A2-level
    causal construction distinct from the earlier چون (because, + clause).

media_assets:
  - content_key: fa.a2.audio.travel_disruption.words.01
    language: fa
    text: قطار، تاخیر، سکو، لغو، اعلامیه، مسیر جایگزین
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a2.audio.travel_disruption.notice.01
    language: fa
    text: "توجه: قطار ساعت ۹ به اصفهان به خاطر مشکل فنی یک ساعت تاخیر داره و ساعت ۱۰ از سکوی ۳ حرکت می‌کنه. اتوبوس جایگزین ساعت ۹:۳۰ از سکوی ۵ حرکت می‌کنه."
    voice_hint: neutral_adult_announcement
    status: pending_generation
  - content_key: fa.a2.audio.dialogue.station_counter.01
    language: fa
    text: "نیما: ببخشید، قطار ساعت ۹ به اصفهان کی حرکت می‌کنه؟ کارمند: متاسفانه به خاطر مشکل فنی، یک ساعت تاخیر داره. ساعت ۱۰ از سکوی ۳ حرکت می‌کنه. نیما: مسیر جایگزینی هست که زودتر برسم؟ کارمند: بله، یک اتوبوس ساعت ۹:۳۰ از سکوی ۵ حرکت می‌کنه، ولی باید بلیط جدید بخرید. نیما: نه، مشکلی نیست. منتظر قطار می‌مونم. کارمند: باشه، پس ساعت ۱۰ سکوی ۳ منتظر باشید."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: fa.a2.unit15.travel_disruption
    title: مشکلات سفر
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.travel.handle_travel_disruption
    planned_lesson_count: 4

    lessons:
      - content_key: fa.a2.unit15.lesson01.travel_disruption_vocabulary
        title: کلمات مربوط به تاخیر سفر
        spine_outcome_id: universal.a2.travel.handle_travel_disruption
        teaching:
          - content_key: fa.a2.unit15.lesson01.teach.train_word
            kind: vocabulary
            target: {text: قطار, language_code: fa, direction: rtl}
            introduced_tokens: [قطار]
            example: {text: "قطار من ساعت نُه حرکت می‌کنه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit15.lesson01.teach.delay_word
            kind: vocabulary
            target: {text: تاخیر, language_code: fa, direction: rtl}
            introduced_tokens: [تاخیر]
            example: {text: "قطار امروز تاخیر داره.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit15.lesson01.teach.platform_word
            kind: vocabulary
            target: {text: سکو, language_code: fa, direction: rtl}
            introduced_tokens: [سکو, سکوی]
            example: {text: "قطار از سکوی سه حرکت می‌کنه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit15.lesson01.teach.cancel_word
            kind: vocabulary
            target: {text: لغو, language_code: fa, direction: rtl}
            introduced_tokens: [لغو, "لغو شدن", شد]
            example: {text: "بلیط قطار لغو شد.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit15.lesson01.teach.announcement_word
            kind: vocabulary
            target: {text: اعلامیه, language_code: fa, direction: rtl}
            introduced_tokens: [اعلامیه]
            example: {text: "این اعلامیه خیلی مهمه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit15.lesson01.teach.alternative_route_word
            kind: vocabulary
            target: {text: "مسیر جایگزین", language_code: fa, direction: rtl}
            introduced_tokens: ["مسیر جایگزین", مسیر, جایگزین, جایگزینی]
            example: {text: "مسیر جایگزین از سکوی پنج حرکت می‌کنه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit15.lesson01.teach.recap_numbers_time
            kind: phrase
            target: {text: "ساعت نُه، ساعت ده، سه، پنج", language_code: fa, direction: rtl}
            introduced_tokens: ["نُه", ده, سه, پنج, یک, ساعت, داره, حرکت, "می‌کنه"]
        exercises:
          - content_key: fa.a2.unit15.lesson01.exercise01.recognize_train
            type: multiple_choice
            tested_text: قطار
            prompt: {target_blocks: [{text: قطار, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson01.exercise02.recognize_delay
            type: multiple_choice
            tested_text: تاخیر
            prompt: {target_blocks: [{text: تاخیر, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson01.exercise03.match_travel_words
            type: matching_pairs
            tested_text: "قطار تاخیر سکو لغو اعلامیه مسیر جایگزین"
            prompt: {target_blocks: []}
            pairs:
              - {left: قطار, right: train}
              - {left: تاخیر, right: delay}
              - {left: سکو, right: platform}
              - {left: لغو, right: cancelled}
              - {left: اعلامیه, right: announcement}
              - {left: "مسیر جایگزین", right: "alternative route"}
          - content_key: fa.a2.unit15.lesson01.exercise04.order_train_delayed
            type: word_order
            tested_text: "قطار یک ساعت تاخیر داره"
            prompt: {target_blocks: []}
            word_bank: [قطار, یک, ساعت, تاخیر, داره]
          - content_key: fa.a2.unit15.lesson01.exercise05.write_platform
            type: writing_prompt
            tested_text: سکو
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit15.lesson02.asking_about_alternatives
        title: پرسیدن درباره‌ی مسیر جایگزین
        spine_outcome_id: universal.a2.travel.handle_travel_disruption
        teaching:
          - content_key: fa.a2.unit15.lesson02.teach.when_does_it_leave
            kind: phrase
            target: {text: "ببخشید، قطار کی حرکت می‌کنه؟", language_code: fa, direction: rtl}
            introduced_tokens: [ببخشید, کی]
          - content_key: fa.a2.unit15.lesson02.teach.is_there_an_alternative
            kind: phrase
            target: {text: "مسیر جایگزینی هست؟", language_code: fa, direction: rtl}
            introduced_tokens: [هست]
          - content_key: fa.a2.unit15.lesson02.teach.full_alternative_question
            kind: phrase
            target: {text: "ببخشید، مسیر جایگزینی هست که زودتر برسم؟", language_code: fa, direction: rtl}
            introduced_tokens: [که, زودتر, برسم]
        exercises:
          - content_key: fa.a2.unit15.lesson02.exercise01.recognize_alternative_question
            type: multiple_choice
            tested_text: "مسیر جایگزینی هست که زودتر برسم"
            prompt: {target_blocks: [{text: "مسیر جایگزینی هست که زودتر برسم؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson02.exercise02.order_alternative_question
            type: word_order
            tested_text: "ببخشید مسیر جایگزینی هست که زودتر برسم"
            prompt: {target_blocks: []}
            word_bank: [ببخشید, مسیر, جایگزینی, هست, که, زودتر, برسم]
          - content_key: fa.a2.unit15.lesson02.exercise03.dialogue_response_ask_alternative
            type: dialogue_response
            tested_text: "ببخشید مسیر جایگزینی هست که زودتر برسم"
            prompt: {target_blocks: [{text: "قطار یک ساعت تاخیر داره.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson02.exercise04.translate_alternative_question
            type: translation
            tested_text: "ببخشید مسیر جایگزینی هست که زودتر برسم"
            prompt: {target_blocks: []}
          - content_key: fa.a2.unit15.lesson02.exercise05.write_ask_alternative
            type: writing_prompt
            tested_text: "مسیر جایگزینی هست"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit15.lesson03.reading_a_station_notice
        title: خواندن اعلامیه‌ی ایستگاه
        spine_outcome_id: universal.a2.travel.handle_travel_disruption
        teaching:
          - content_key: fa.a2.unit15.lesson03.teach.because_of_note
            kind: grammar_note
            target: {text: "به خاطر", language_code: fa, direction: rtl}
            introduced_tokens: ["به خاطر", از]
          - content_key: fa.a2.unit15.lesson03.teach.technical_problem_word
            kind: vocabulary
            target: {text: "مشکل فنی", language_code: fa, direction: rtl}
            introduced_tokens: ["مشکل فنی", مشکل, فنی]
            example: {text: "قطار به خاطر مشکل فنی تاخیر داره.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit15.lesson03.teach.notice_text
            kind: reading
            target: {text: "توجه: قطار ساعت نُه به اصفهان به خاطر مشکل فنی یک ساعت تاخیر داره و ساعت ده از سکوی سه حرکت می‌کنه. اتوبوس جایگزین ساعت نُه و نیم از سکوی پنج حرکت می‌کنه.", language_code: fa, direction: rtl}
            introduced_tokens: [توجه, به, اصفهان, و, نیم, از]
        exercises:
          - content_key: fa.a2.unit15.lesson03.exercise01.read_delay_reason
            type: reading_comprehension
            tested_text: "به خاطر مشکل فنی"
            prompt: {target_blocks: [{text: "طبق اعلامیه، قطار چرا تاخیر داره؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson03.exercise02.read_alternative_bus_platform
            type: reading_comprehension
            tested_text: "از سکوی پنج"
            prompt: {target_blocks: [{text: "اتوبوس جایگزین از کدوم سکو حرکت می‌کنه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson03.exercise03.recognize_technical_problem
            type: multiple_choice
            tested_text: "مشکل فنی"
            prompt: {target_blocks: [{text: "مشکل فنی", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit15.lesson03.exercise04.order_delay_reason_sentence
            type: word_order
            tested_text: "قطار به خاطر مشکل فنی تاخیر داره"
            prompt: {target_blocks: []}
            word_bank: [قطار, "به خاطر", "مشکل فنی", تاخیر, داره]
          - content_key: fa.a2.unit15.lesson03.exercise05.write_delay_reason
            type: writing_prompt
            tested_text: "قطار به خاطر مشکل فنی تاخیر داره"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit15.lesson04.station_counter_dialogue
        title: گفتگو در باجه‌ی ایستگاه
        spine_outcome_id: universal.a2.travel.handle_travel_disruption
        teaching:
          - content_key: fa.a2.unit15.lesson04.teach.i_will_wait
            kind: phrase
            target: {text: "منتظر قطار می‌مونم.", language_code: fa, direction: rtl}
            introduced_tokens: [منتظر, "می‌مونم", قطارم]
          - content_key: fa.a2.unit15.lesson04.teach.turn01
            kind: dialogue
            target: {text: "ببخشید، قطار ساعت نُه به اصفهان کی حرکت می‌کنه؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [نیما]
          - content_key: fa.a2.unit15.lesson04.teach.turn02
            kind: dialogue
            target: {text: "متاسفانه به خاطر مشکل فنی، یک ساعت تاخیر داره. ساعت ده از سکوی سه حرکت می‌کنه.", language_code: fa, direction: rtl, speaker: کارمند}
            introduced_tokens: [کارمند, متاسفانه]
          - content_key: fa.a2.unit15.lesson04.teach.turn03
            kind: dialogue
            target: {text: "مسیر جایگزینی هست که زودتر برسم؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a2.unit15.lesson04.teach.turn04
            kind: dialogue
            target: {text: "بله، یک اتوبوس ساعت نُه و نیم از سکوی پنج حرکت می‌کنه، ولی باید بلیط جدید بخرید.", language_code: fa, direction: rtl, speaker: کارمند}
            introduced_tokens: [بله, ولی, باید, بلیط, جدید, بخرید]
          - content_key: fa.a2.unit15.lesson04.teach.turn05
            kind: dialogue
            target: {text: "نه، مشکلی نیست. منتظر قطار می‌مونم.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [نه, مشکلی, نیست]
          - content_key: fa.a2.unit15.lesson04.teach.turn06
            kind: dialogue
            target: {text: "باشه، پس ساعت ده سکوی سه منتظر باشید.", language_code: fa, direction: rtl, speaker: کارمند}
            introduced_tokens: [باشه, پس, باشید]
        exercises:
          - content_key: fa.a2.unit15.lesson04.exercise01.comprehend_delay_reason
