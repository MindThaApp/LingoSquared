  notes: >-
    Eighth A2 unit for the fa realization (spine outcome: universal.a2.
    technology.discuss_online_habits) -- the second of 4 new fa A2 units
    covering 4 brand-new A2 spine outcomes added this session. Reuses the
    established سارا/نیما friend pair (AUTHORING_GUIDE §11), continuing
    the exact conversation they already had in a1_unit29 (technology) --
    there, سارا said she uses her phone a lot for photos/messages and a
    computer at home, and نیما said he uses the internet every day; this
    unit is a genuine A2 step-up of that same ongoing conversation rather
    than a new unrelated scene, now naming a SPECIFIC habit (social media,
    ~2 hours/day) with a simple opinion, per this outcome's own prereqs
    (universal.a1.technology.describe_device_use +
    universal.a2.opinions.give_opinions_with_reasons). Deliberately reuses
    the STRUCTURE of unit10's established به نظر من ... چون ... (in my
    opinion ... because ...) opinion construction and a1_unit29's own
    "چه خوب!" reaction line -- same fa corpus, genuine continuity, not a
    sibling-direction consultation (AUTHORING_GUIDE §8 only restricts
    consulting a sibling DIRECTION's file, e.g. prs; reusing this
    language's own already-taught grammar across its own units is exactly
    the intended behavior). Own scenario, authored independently of the
    English/Dutch A2 units and of the prs sibling realization of this same
    outcome (not consulted, per §8) -- also did not consult the nl
    realization built for this same new spine outcome this session. Every
    kind:vocabulary card carries a real example: sentence per §19,
    authored at schema_version 1.1 from the start. No fill_in_blank used
    (§13/§17 n/a). No listen_type/listen_select/listen_order or audio-only
    dialogue_comprehension anywhere per §14 -- every exercise has a real
    visible text prompt; media_assets is pre-staging only, unreferenced by
    any exercise. Every multi-clause accepted_answers list carries
    period/comma/و-joined forms per §12. matching_pairs uses 6 pairs per
    §16. Every fact (~2 hours/day on social media, favorite app is
    Instagram, her opinion is "fun but sometimes a waste of time", نیما
    mostly reads news instead) kept consistent across lesson02/03/04 per
    §11. Dialect: continues fa's established Iranian register (هستم-
    family copula, colloquial -e/-ه contractions like "مفیده"/"هست"),
    deliberately never Dari forms. Checked script purity by eye against
    known-correct Persian-range keheh/yeh usage throughout. firecrawl
    re-checked fresh this pass (`firecrawl --status`): still 0/1,000
    credits -- authored via established-conventions-only per the standing
    contingency. Pending fresh-context review; left unreviewed per
    AUTHORING_GUIDE §9.
    Review 2026-10-20: 0 fixes - spelling (شبکه‌ی اجتماعی، سرگرم‌کننده،
    علاقه‌ام), ZWNJ, casual register, dialogue cards vs audio text,
    word_order banks and exercise content checked clean. NATIVE FLAGS: *به
    نظر من هم سرگرم‌کننده هست هم گاهی وقت تلف می‌کنم* is understandable
    but a native speaker may prefer *سرگرم‌کننده‌ست، ولی گاهی وقتمو هم تلف
    می‌کنم*.

