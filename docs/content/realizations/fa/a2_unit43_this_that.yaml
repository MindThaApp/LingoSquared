review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.description.point_out_and_specify. Grammar target: این / اون + noun, این یکی / اون یکی, این / اون + plural (این سیب‌ها، اون گل‌ها رو), the indefinite ending -ی (کتابی می‌خوام) against definite رو (اون کتاب رو می‌خوام), and the spoken یه ... ی for “some / a certain” (یه نونی، یه شیرینی‌ای، یه چیزی). Register: casual spoken Tehrani; the seller and the customers use شما forms. Characters: Sara and Nima plus an unnamed فروشنده (seller); no job or family facts asserted. NATIVE QUESTIONS: (1) Is plural -ها fine in a spoken-register course, or should the dialogue use -ا (سیبا، گلا)? Recommended: teach -ها, accept -ا in every answer, and consider -ا in later review. (2) Is یه نونی بدید natural for “give me some bread”, or is a plain نون بدید better? Recommended: keep یه نونی (course spec) and accept both. (3) Is the plural verb needed after این سیب‌ها (e.g. ارزونن) or is the singular ارزونه acceptable? Recommended: the unit avoids the issue by using چنده only; confirm the singular verb is fine for inanimate plurals. (4) Is اون یکی رو می‌خوام the natural way to say “I want that one”? Recommended: yes, keep.'
