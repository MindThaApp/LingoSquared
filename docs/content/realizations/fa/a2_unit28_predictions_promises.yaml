nits); this unit asserts no job or family facts, only a meeting arrangement. The unit delivers listening (forecast and promise clips), speaking (dialogue answer), reading (message, bulletin, notice) and a culminating written message with a certain prediction, a possibility and a promise. Authored without opening any prs file. NATIVE QUESTIONS: (1) Is شاید برف بیاد (verb آمدن with برف) as natural as شاید برف بباره for “maybe it will snow”, and is it fine that the unit uses بارون می‌باره but شاید بارون بیاد in the same lesson? Recommended: yes, both are everyday spoken; keep بیاد because the learner needs one subjunctive with a common verb. (2) After احتمالا, is the plain present (احتمالا بارون می‌باره) the best-sounding choice for A2, compared with a subjunctive? Recommended: yes, keep the present. (3) Is قول می‌دم کمکت کنم fully natural with the clitic -ت attached to کمک, or is بهت کمک کنم better? Recommended: keep کمکت کنم (very common spoken). (4) Is دیر نمی‌کنی؟ a natural question meaning “you will not be late, will you?” in the dialogue? Recommended: yes; if not, replace with دیر نمی‌رسی؟.'
