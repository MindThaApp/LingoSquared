units:
  - content_key: fa.a1.unit29.technology
    title: تکنولوژی
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.technology.describe_device_use
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit29.lesson01.device_vocabulary
        title: "کلمات تکنولوژی"
        spine_outcome_id: universal.a1.technology.describe_device_use
        teaching:
          - content_key: fa.a1.unit29.lesson01.teach.tech_word
            kind: vocabulary
            target: {text: تکنولوژی, language_code: fa, direction: rtl}
            introduced_tokens: [تکنولوژی]
            example: {text: "تکنولوژی خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit29.lesson01.teach.goshi_word
            kind: vocabulary
            target: {text: گوشی, language_code: fa, direction: rtl}
            introduced_tokens: [گوشی]
            example: {text: "من گوشی دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit29.lesson01.teach.computer_word
            kind: vocabulary
            target: {text: کامپیوتر, language_code: fa, direction: rtl}
            introduced_tokens: [کامپیوتر]
            example: {text: "این کامپیوتر خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit29.lesson01.teach.internet_word
            kind: vocabulary
            target: {text: اینترنت, language_code: fa, direction: rtl}
            introduced_tokens: [اینترنت]
            example: {text: "اینترنت آهسته‌ست.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit29.lesson01.teach.app_word
            kind: vocabulary
            target: {text: اپلیکیشن, language_code: fa, direction: rtl}
            introduced_tokens: [اپلیکیشن]
            example: {text: "این اپلیکیشن خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit29.lesson01.teach.review_man_in_daram
            kind: grammar_note
            target: {text: "من (I) / این (this) / دارم (I have)", language_code: fa, direction: rtl}
            introduced_tokens: [من, این, دارم]
          - content_key: fa.a1.unit29.lesson01.teach.review_estefade_mikonam
            kind: grammar_note
            target: {text: "استفاده (use) + می‌کنم (I do) = استفاده می‌کنم (I use)", language_code: fa, direction: rtl}
            introduced_tokens: [استفاده, "می‌کنم", از]
          - content_key: fa.a1.unit29.lesson01.teach.combined_sentence
            kind: phrase
            target: {text: "من از اینترنت استفاده می‌کنم.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit29.lesson01.exercise01.recognize_goshi
            type: multiple_choice
            tested_text: گوشی
            prompt: {target_blocks: [{text: گوشی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit29.lesson01.exercise02.recognize_app
            type: multiple_choice
            tested_text: اپلیکیشن
            prompt: {target_blocks: [{text: اپلیکیشن, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit29.lesson01.exercise03.match_tech_words
            type: matching_pairs
            tested_text: "تکنولوژی گوشی کامپیوتر اینترنت اپلیکیشن من این دارم من از اینترنت استفاده می‌کنم"
            prompt: {target_blocks: []}
            pairs:
              - {left: تکنولوژی, right: technology}
              - {left: گوشی, right: "phone / mobile phone"}
              - {left: کامپیوتر, right: computer}
              - {left: اینترنت, right: internet}
              - {left: اپلیکیشن, right: app}
              - {left: من, right: I}
              - {left: این, right: this}
              - {left: دارم, right: "I have"}
              - {left: "من از اینترنت استفاده می‌کنم.", right: "I use the internet."}
          - content_key: fa.a1.unit29.lesson01.exercise04.word_order_i_use_internet
            type: word_order
            tested_text: "من از اینترنت استفاده می‌کنم"
            prompt: {target_blocks: [{text: "I use the internet.", language_code: en, direction: ltr}]}
            word_bank: [من, از, اینترنت, استفاده, "می‌کنم"]
