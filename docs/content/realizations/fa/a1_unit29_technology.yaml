          - content_key: fa.a1.unit29.lesson02.exercise02.recognize_download
            type: multiple_choice
            tested_text: دانلود
            prompt: {target_blocks: [{text: دانلود, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit29.lesson02.exercise03.match_phone_action_phrases
            type: matching_pairs
            tested_text: "پیام می‌فرستم زنگ می‌زنم عکس می‌گیرم دانلود می‌خوام یک اپلیکیشن دانلود کنم پیام عکس"
            prompt: {target_blocks: []}
            pairs:
              - {left: "پیام می‌فرستم", right: "I send a message"}
              - {left: "زنگ می‌زنم", right: "I call"}
              - {left: "عکس می‌گیرم", right: "I take a photo"}
