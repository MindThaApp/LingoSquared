generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at the FSI Persian Basic Course source this
    pass, reusing this same session's own earlier fetch (a genuine
    pdftotext -layout extraction of
    https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf, pdfinfo-
    confirmed Author: US FSI, 398 pages -- not re-downloaded a second time
    since the extracted text was already sitting in this session's own
    scratchpad from the immediately-prior transportation-unit search, but
    re-read and re-searched fresh for THIS unit's own terms, not reused
    findings) and grepped the extracted text for device/technology-related
    English terms (telephone, radio, television, camera, typewriter,
    calculator, record, machine, watch, clock) plus a manual read of every
    hit's surrounding context. Found one genuine, real hit: a vocabulary
    entry for "telephone" (تلفن) and "to telephone" (تلفن کردن), plus a
    short dialogue fragment about a missed call ("Why didn't you telephone
    us to let us know?" / "I didn't want to bother you"). "Radio" appears
    only inside register-explanation prose (radio broadcasts as an example
    of formal spoken Persian), never as a taught vocabulary item; "watch/
    clock" appears only as a time-telling vocabulary item (already covered
    by this course's own unit09), not as a device-topic item; "camera,"
    "television," "typewriter," and "calculator" produced zero real hits
    (one "photograph" hit was a bare word in a phonology/pronunciation
    drill table, not usable content). This is a thinner, more scattered
    result than unit28's transportation search, which is expected and
    consistent with a 1963 course predating computers, mobile phones, and
    the internet by decades -- there is no dedicated technology/device
    unit anywhere in the source, matching every prior unit's own
    independently-confirmed "organized by grammar, not vocabulary topic"
    finding. The one real, usable signal (تلفن / تلفن کردن as the
    authentic period vocabulary for "telephone" / "to telephone") directly
    confirms this course's own pre-existing تلفن (already taught back in
    unit22's phone vocabulary) as the correct, real word rather than
    something invented for this project -- not new content on its own,
    but a genuine independent confirmation. Everything else in this unit
    (گوشی/کامپیوتر/اینترنت/اپلیکیشن/دانلود and the sentences built from
    them) is authored fresh using this project's established fa register/
    character conventions, since none of it exists in a 1960s source by
    definition. Modern Iranian usage for these loanwords was independently
    verified via live web search this pass (not just reasoning): Persian
    Wikipedia's own articles (تلفن همراه, فناوری موبایل) and multiple
    Iranian tech-vocabulary reference pages confirm گوشی/موبایل as the
    genuine everyday Iranian terms for "mobile phone" (گوشی chosen here as
    the more colloquial everyday choice, paralleling how this course
    already distinguishes real register/dialect choices elsewhere -- see
    the register_policy note below), and confirm اینترنت/کامپیوتر/
    اپلیکیشن as standard, unremarkable loanwords in everyday Iranian
    Persian tech discussion (e.g. a real hit: "در حال حاضر در ایران دو
    تکنولوژی اینترنت همراه...ارائه میشه" -- "two mobile-internet
    technologies are currently offered in Iran," confirming تکنولوژی
    itself as a genuine, naturally-occurring Iranian Persian word, not
    just a dictionary loanword).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed ONE real
    cross-lesson factual inconsistency per AUTHORING_GUIDE.md §11.
    Lesson04's dialogue has سارا say "من زیاد از گوشی استفاده می‌کنم"
    (I use my phone A LOT) -- not "every day" -- but lesson05's own
    third-person reading passage originally restated this as "سارا هر
    روز از گوشی استفاده می‌کنه" (Sara uses her phone EVERY DAY), a
    different claim than the dialogue actually established (confirmed by
    the exercise's own feedback text, which correctly used "زیاد" to
    match the dialogue -- so the reading passage was the one place that
    drifted). No exercise happened to test this specific frequency word
    directly, so it wasn't a live wrong-answer bug, but it's a real
    stated-fact contradiction between the dialogue and the reading within
    the same unit. Fixed by changing the reading text (both the
    realization's teaching-card target and both reading_comprehension
    exercises' tested_text/prompt, all 4 occurrences of the same string)
    from "سارا هر روز از گوشی استفاده می‌کنه" to "سارا زیاد از گوشی
    استفاده می‌کنه", matching the dialogue; updated the paired overlay's
    reading_text gloss to match ("Sara uses her phone a lot" instead of
    "every day"). زیاد was already taught earlier in this same file
    (lesson04, before lesson05), so this substitution introduces no
    untaught-vocabulary violation -- re-confirmed by re-running the
    compiler validator after the fix (0 errors/0 warnings). Also
    confirmed 0 stray YAML boolean coercions, no listen_select/
    listen_type/listen_order exercises, all dialogue_response exercises
    free-text (no distractors), and all exercise types used have a
    matching ExerciseRenderer.tsx case. No other real bugs found. Original
    authoring notes below, retained for context.

    Draft authored 2026-07-09 by a Sonnet 5 worker task. Realizes
    universal.a1.technology.describe_device_use (prerequisite:
    universal.a1.communication.basic_phone_contact, covered by unit22's
    phone unit). Fa's next uncovered A1 outcome after unit28
    (transportation) -- confirmed by an exact diff of every
    spine_outcome_id used across all fa realization files (29 distinct
    A1 outcomes covered across units01-28, walked via yaml.safe_load, not
    a text grep) against every `id:` beginning `universal.a1.` in
    docs/content/universal_spine.yaml (37 total A1 ids at this spine
    file's current state -- re-checked immediately before authoring per
    this project's standing footgun about the spine file being a
    fast-moving target other sessions edit concurrently): technology is
    the very next A1 id after transportation in the spine file's own
    ordering, and transportation was itself confirmed correct in unit28's
    own review notes. Also re-verified immediately before authoring (per
    the standing parallel-session unit-collision footgun) that no unit29
    file existed yet in docs/content/realizations/fa/ or
    docs/content/overlays/en-fa/ at the moment this file was created.
    Continues the نیما/سارا recurring cast from units 11-14/23-28.
    Structurally informed (scenario shape, six-lesson breakdown, exercise-
    type pacing) by prs's own already-shipped a1_unit30_technology.yaml
    for the SAME spine outcome -- this is the explicitly-permitted
    structure-only reuse between fa and prs per AUTHORING_GUIDE.md §3
    ("Do reuse structure, not text... between fa and prs"), not the
    stronger sibling-DIRECTION-isolation rule in §8 (which is about
    en-prs vs prs-en overlay pairs, a different axis than fa vs prs
    realizations). Every word of actual Farsi text below was authored
    completely fresh for Iranian Farsi -- the prs file's own Dari text
    (دری) was never copied, adapted, or transliterated; independent
    lexical choices were made throughout (e.g. گوشی chosen over موبایل as
    the more genuinely colloquial Iranian term, contra prs's own موبایل
    choice for Dari -- a real, deliberate dialect divergence, not an
    oversight). Scoped to: naming 5 devices (تکنولوژی topic word, گوشی
    phone, کامپیوتر computer, اینترنت internet, اپلیکیشن app) plus a
    combined استفاده می‌کنم ("I use") sentence built on unit10's
    already-established استفاده + this course's already-established
    می‌کنم ending; phone-action phrases (پیام می‌فرستم -- a genuinely new
    verb combined with unit22's already-taught پیام; زنگ می‌زنم reused
    verbatim from unit03/unit22; عکس می‌گیرم -- a genuinely new verb
    combined with unit04's already-taught عکس; a دانلود vocabulary card
    plus a می‌خوام یک اپلیکیشن دانلود کنم construction reusing unit03/06's
    already-established می‌خوام and the same کردن-light-verb subjunctive
    pattern this course already uses); a هر روز چند بار از گوشیت استفاده
    می‌کنی؟ frequency question built entirely from already-taught pieces
    (هر روز from units 11/24/27/28, چند/بار from units 03-10/27, تو/
    می‌کنی from unit24) plus one new possessive form گوشیت (-ت possessive
    suffix, already precedented by unit04's خانواده‌ته); a نیما/سارا
    dialogue in the established informal تو register (matching units
    20/24/25/26/27/28's own informal-register precedent) covering phone/
    computer/internet use, answered via a unit28-style English summary
    comprehension question (correct_option/distractors in English over a
    Farsi transcript embedded in the exercise prompt) specifically to
    avoid needing any untaught 3rd-person conjugation inside the exercise
    prompt itself (prompts are not compiler-validated against
    introduced_tokens, but good pedagogy still shouldn't expose an
    unreviewed conjugation to the learner, so this was avoided by design,
    not by accident); a third-person reading passage (lesson05) that
    explicitly cross-checks its own facts against the dialogue per
    AUTHORING_GUIDE.md §11 -- it restates exactly what the dialogue
    already established (Sara: phone daily, takes photos, sends messages,
    also uses a computer at home; Nima: uses the internet every day) and
    introduces no new, dialogue-contradicting facts; and a wrap-up
    combining a preference and a constraint with ولی (تکنولوژی رو دوست
    دارم ولی گاهی وقت ندارم -- reusing the established رو-marked دوست
    دارم construction from units 14/26/28/29-lesson-internal, and وقت/
    ندارم from units 04/11/24/26/28), continuing the exact wrap-up shape
    prs's own unit30 established (permitted structural reuse, see above)
    rather than inventing a new one from scratch. Deliberately did NOT
    introduce می‌کنه/می‌گیره/می‌فرسته (3rd-person forms) without an
    explicit review grammar_note immediately before their first use in
    lesson05's reading passage and its own exercises' tested_text --
    checked proactively, matching the exact gap prs's own unit30 review
    notes flagged and fixed for its own می‌کند. Every already-taught word
    reused from an earlier unit is re-declared as an introduced_tokens
    review token at its first tested_text use in THIS file per the
    standing per-file untaught-vocabulary footgun (من/unit01, این/units
    03-15, دارم/unit04, پیام/زنگ‌زدن/unit22, عکس/unit04, می‌خوام/یک/units
    03-06, رو/unit26, هر/روز/units 11-28, چند/بار/units 03-27, تو/
    می‌کنی/unit24, زیاد/unit23, خونه/units 13-26, آره/unit04, هم/چه/خوب/
    units 24-28, او/units 01-05, نیما/units 11-28, ولی/units 15-28,
    دوست/دارم/وقت/ندارم/units 04-28, گاهی/units 24-28 -- all re-declared
    fresh here (نیما specifically via a dedicated review card immediately
    before lesson05's reading passage, the same fix-point unit28's own
    nima_review card used, since نیما only ever appears as dialogue
    `speaker:` metadata in lesson04, which the compiler's tested_text
    check does not scope -- caught by a real standalone-validation run
    against this exact file, not just reasoned through), checked
    via a mental token-by-token trace of every exercise's tested_text/
    word_bank/pairs value against this file's own cumulative
    introduced_tokens at that point in reading order, confirming every
    value is covered by a prior teaching card in this same file, not just
    a prior unit). Matches the spine outcome's 4 assessment_requirements:
    listening via lesson04's dialogue_comprehension (reading-visible per
    the same pending-audio precedent units 13/17/18/24/25/26/27/28's
    fresh-context reviews accepted) and lesson05's reading_comprehension;
    speaking via lesson04's dialogue_response exercise; reading via
    lesson05's reading passage; writing via the writing_prompt exercises
    in lessons05/06. matching_pairs pair counts: 9/7/8/8/9/6 across
    lessons 1-6, all within AUTHORING_GUIDE.md §16's 6-12 range. Zero
    fill_in_blank anywhere (§17 n/a). Zero listen_type/listen_select/
    listen_order exercises, despite §14's 2026-07-06 revision technically
    permitting fa audio content now that Azure TTS covers Farsi --
    consistent, documented corpus-wide choice matching units 17/18/24/
    25/26/27/28 (audio remains pending_generation, not yet a live
    recorded/TTS-backed asset for this specific new content). Every
    `kind: vocabulary` card (تکنولوژی/گوشی/کامپیوتر/اینترنت/اپلیکیشن in
    lesson01, دانلود in lesson02) has a real example sentence built
    entirely from already-taught or transparently-glossed words, per §19
    (schema_version 1.1 from the start). §12 multi-clause coverage
    applied to the wrap-up's ولی-joined translation/writing exercises
    (comma-joined and no-comma variants both accepted as equally
    correct). §6 applied deliberately and correctly this time (a real gap
    found in unit28's own precedent while preparing this file: unit28's
    "Translate into English" exercises never set an explicit
    answer_language_code override, so the compiled prompt's virtual-
    keyboard hint defaults to fa/target_language even though the expected
    typed answer is English -- a real, if cosmetic, latent gap in
    existing shipped content, flagged here for the fresh-context reviewer
    to also fix on unit28 separately, not silently propagated into this
    new file): every "Translate into English" exercise in this unit's
    overlay sets `answer_language_code: en` explicitly. Not
    self-certified -- needs the mandatory fresh-context review before
    shipping, same as every other Claude-authored fa unit. Also manually
    re-verified (per this session's standing YAML boolean-coercion
    gotcha) that no bare yes/no/true/false/on/off value appears anywhere
    in this file via a recursive yaml.safe_load type scan, not just a
    text grep -- see the paired overlay's review notes for the combined
    result across both files.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-15/21-28. Reuses unit03/06's
    می‌خوام, unit04's عکس/دارم, unit10's استفاده, unit22's تلفن/پیام/زنگ
    زدن, unit23's زیاد, unit24's تو/می‌کنی/هم/چه خوب, unit26's رو
    (colloquial object marker), and the نیما/سارا cast without
    re-teaching the underlying constructions, only the new vocabulary
    that combines with them. گوشی، کامپیوتر، اینترنت، and اپلیکیشن are
    standard, everyday shared Persian loanwords in Iranian usage, verified
    via live web search this pass against Persian Wikipedia and Iranian
    tech-vocabulary reference sources. گوشی is deliberately chosen over
    موبایل as the more genuinely colloquial everyday Iranian term for
    "mobile phone" -- a real, intentional lexical divergence from prs's
    own موبایل choice for Dari, the same class of authentic dialect
    difference as unit24's رستوران-register choices, not an oversight.

