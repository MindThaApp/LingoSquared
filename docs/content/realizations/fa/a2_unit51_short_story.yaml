review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.stories.retell_a_short_story. Grammar target: telling a short story in order with اول، بعدش، بعد، آخرش and وقتی, using the simple past (we -یم, they -ن, he/she), the affirmative past progressive (داشت می‌رفت), the past perfect (خریده بود), the habitual past (هر سال می‌رفتیم) and the present perfect with تا حالا (نرفته‌م, with the simple past accepted). Recycles outings: zoo (باغ‌وحش), boat trip, amusement park. Characters: Sara and Nima only, on a day out; the dialogue is the two of them recalling the same day. Register: casual spoken Tehrani Persian; no new grammar beyond Blocks A-D; new tokens limited to قایق، شهربازی، بستنی، ترسید، خندید and their person forms. NATIVE QUESTIONS: (1) Are the spoken they-forms رفتن / دیدن / خریدن / خندیدن natural in a narrated story, or would a written-style story use رفتند? Recommended: keep the spoken forms and accept nothing written. (2) Is وقتی قایق داشت می‌رفت natural for a moving boat, or is وقتی قایق راه افتاد more usual? Recommended: keep the taught progressive. (3) Are بعدش and بعد fully interchangeable as story connectors, and is آخرش the right everyday word for finally (versus آخر سر)? Recommended: accept both بعد forms and teach آخرش. (4) Is سوار قایق شدن the natural collocation for taking a boat trip, and is من قبلا شهربازی نرفته بودم natural for I had never been to an amusement park? Recommended: keep both. (5) With تا حالا, is the simple past (سوار قایق شدی؟) as normal as the perfect (شده‌ای؟) in everyday speech? Recommended: accept both, teach the perfect.'
