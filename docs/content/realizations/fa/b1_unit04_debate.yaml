    register, dialogue text vs audio media_assets text, reading vs exercises
    and Reza/Nargess canon checked clean. NATIVE FLAGS: whether 'به نظر من
    موافقم' (in my opinion, I agree) is natural or slightly redundant; spoken
    -ین vs -ید for 'you pl.' (course uses -ید).

