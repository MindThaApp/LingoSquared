generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked firecrawl
    availability fresh before starting: `firecrawl search` returned HTTP
    402 (credits exhausted), same result as every prior check this cycle.
    The FSI Persian Basic Course is separately confirmed beginner-only (see
    b1_unit01/02/03's own provenance notes); no adaptable Persian
    intermediate-level public-domain source exists for a debate/opinion
    outcome regardless of Firecrawl's quota. Authored from general Persian
    grammar knowledge, same as fa's other B1 units.

    This is fa's FOURTH B1 unit. Grammar target: the ENCLITIC PERSONAL
    PRONOUN attached directly to a predicate adjective (موافق + -م/-ی/-ه/
    -یم/-ید/-ن = موافقم/موافقی/موافقه/موافقیم/موافقید/موافقن, "I/you/he-
    she/we/you-pl./they agree," and the same paradigm on مخالف for
    "disagree") -- a genuinely distinct construction from every prior fa B1
    unit: unlike unit01's invariant باید, unit02's fully-conjugating verb
    توانستن, and unit03's two-clause اگه-conditional, this is agreement
    marked by a PRONOUN SUFFIX fused directly onto an ADJECTIVE with no
    separate verb at all (no copula, no "to be" verb -- موافق+م is a
    complete predicate by itself). Secondarily introduces که-clause
    subordination (فکر می‌کنم که..., "I think that...") for reporting a
    reason -- real B1 embedded-clause complexity distinct from unit01's
    simple subjunctive complement.

    Deliberately does NOT introduce the full formal copula هستم/هستی/هست/
    هستیم/هستید/هستن paradigm here, reserving that for a different B1 unit
    (workplace responsibilities) so the two units don't teach overlapping
    person-agreement mechanisms back to back -- enclitic-on-adjective
    (this unit) and standalone formal copula-verb (the other unit) are
    related but distinct constructions, kept separate on purpose.

    All vocabulary is introduced self-contained within this file (same
    convention as every other fa B1 unit; validate_untaught_vocabulary
    scopes the taught-token set to a single realization file) -- common
    words already taught in other fa files (چون, ولی, چرا) are redeclared
    here.

    Character-cast continuity: reuses رضا (an established fa name --
    already used as the workshop mechanic in b1_unit02, confirmed via grep
    against the fa corpus before writing) and نرگس (established as سارا's
    colleague in b1_unit01) in a new scene, a workplace debate about
    دورکاری (remote work) -- a genuine topic fit for this outcome's own
    "everyday topics" framing and a natural bridge toward the workplace
    unit that follows it in this same authoring batch. No prs file was
    opened or consulted while authoring this one.

    Lessons 01-02 drill موافق (agree) 1st/2nd then all persons; lesson03
    introduces مخالف (disagree, 1st/3rd person) plus the که-clause reason
    construction; lesson04 is a dialogue between رضا (agrees) and نرگس
    (disagrees); lesson05 is a third-person reading summarizing the same
    debate; lesson06 is production-only wrap-up -- the same six-lesson arc
    established across every prior fa B1 unit.
