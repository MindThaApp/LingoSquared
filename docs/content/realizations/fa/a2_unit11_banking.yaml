review:
  status: reviewed
  required_next_reviewer: fresh_context_content_review
  notes: >-
    Third A2 unit for the fa realization (spine outcome: universal.a2.
    banking.open_bank_account). Continues fa A2's small recurring cast
    rather than starting a brand-new one for every unit (AUTHORING_GUIDE
    §11's "continuing established Farsi character continuity where
    natural"): سارا, who just registered her new apartment's address in
    a2_unit09 (بروکراسی), now opens a bank account near that same new
    home -- a genuine everyday follow-on errand, not a forced callback
    (the spine outcome's own prerequisite chain literally names
    universal.a2.bureaucracy.register_with_authorities as a prerequisite
    of universal.a2.banking.open_bank_account, so this sequencing matches
    the spine's own dependency graph, not just narrative convenience).
    Reuses سارا's already-established کارت ملی (national ID card) and
    قبض (utility bill) vocabulary from unit09 directly in this unit's
    dialogue/reading without re-declaring them as new introduced_tokens
    (already taught, still fair game as background vocabulary). Own
    scenario, authored independently of the English/Dutch A2 units and
    of the prs sibling realization of this same outcome (not consulted,
    per AUTHORING_GUIDE §8). A2-level step-up from A1: the اگر ...
    (if...) conditional clause (a genuinely new construction for fa's A2
    course so far -- units 09/10 used چون/می‌خواستم but not a full
    conditional), continuing می‌خواستم as the established polite
    softened-request register from unit09, and a light-verb construction
    (حساب باز کردن -- literally "account open do", the natural Persian
    way to say "open an account"). Every kind:vocabulary card carries a
    real example: sentence built only from already-taught or
    same-lesson-taught tokens, with a matching overlay example_gloss, per
    §19 -- authored at schema_version 1.1 from the start (no retrofit
    needed). No fill_in_blank exercises used at all, sidestepping §13/§17
    entirely, same precedent as unit09/unit10. No listen_type/
    listen_select/listen_order or audio-only dialogue_comprehension used
    anywhere in this unit per §14 -- every exercise has a genuine visible
    text prompt; a media_assets block is declared purely to pre-stage a
    future recording pass, unreferenced by any exercise here. Every
    multi-clause accepted_answers list carries period/comma/و-joined
    forms per §12 (see the matching overlay). matching_pairs uses 6 pairs
    per §16. Every fact (documents required -- national ID + a utility
    bill; card ready in three days; PIN issued the same day as card
    pickup) kept consistent across lesson02/03/04 per §11. Dialect:
    continues fa's established Iranian register (هستم-family copula,
    ممنون/بفرمایید, colloquial -e/-ه contractions like "کافیه"/"آماده
    می‌شه"), deliberately never Dari forms. Checked script purity by eye
    against known-correct Persian-range keheh/yeh usage throughout.
    firecrawl re-checked fresh this pass (`firecrawl --status`): still
    0/1,000 credits, confirming the account remains genuinely exhausted,
    not just previously reported so -- authored via established-
    conventions-only per the standing contingency, same precedent as
    unit09/unit10's own provenance. Pending fresh-context review; left
    unreviewed per AUTHORING_GUIDE §9.

course:
