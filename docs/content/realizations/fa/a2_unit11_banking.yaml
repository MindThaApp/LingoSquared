          - content_key: fa.a2.unit11.lesson01.teach.bank_word
            kind: vocabulary
            target: {text: بانک, language_code: fa, direction: rtl}
            introduced_tokens: [بانک]
            example: {text: "بانک نزدیک خونه‌ی جدیدمه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit11.lesson01.teach.account_word
            kind: vocabulary
            target: {text: حساب, language_code: fa, direction: rtl}
            introduced_tokens: [حساب]
            example: {text: "می‌خوام یک حساب باز کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit11.lesson01.teach.bank_card_word
            kind: vocabulary
            target: {text: "کارت بانکی", language_code: fa, direction: rtl}
            introduced_tokens: ["کارت بانکی"]
            example: {text: "کارت بانکی من رمز داره.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit11.lesson01.teach.pin_word
            kind: vocabulary
            target: {text: رمز, language_code: fa, direction: rtl}
            introduced_tokens: [رمز]
            example: {text: "رمز کارتت رو فراموش نکن.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit11.lesson01.teach.balance_word
            kind: vocabulary
            target: {text: موجودی, language_code: fa, direction: rtl}
            introduced_tokens: [موجودی]
            example: {text: "موجودی حسابم کمه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit11.lesson01.teach.document_word
            kind: vocabulary
            target: {text: مدرک, language_code: fa, direction: rtl}
            introduced_tokens: [مدرک]
            example: {text: "برای باز کردن حساب یک مدرک لازمه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit11.lesson01.teach.baz_kardan_note
            kind: grammar_note
            target: {text: "باز کردن", language_code: fa, direction: rtl}
            introduced_tokens: [باز, کردن]
          - content_key: fa.a2.unit11.lesson01.teach.ra_note
