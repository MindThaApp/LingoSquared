review:
  status: reviewed
  required_next_reviewer: fresh_context_content_review
  notes: >-
    Tenth A2 unit for the fa realization (spine outcome: universal.a2.
    shopping.make_a_complaint) -- the last of 4 new fa A2 units covering 4
    brand-new A2 spine outcomes added this session. Reuses نیما, already
    established in a1_unit57 (zoo), a2_unit12 (doctor), and a2_unit15
    (travel disruption earlier this same batch), rather than inventing a
    new character (AUTHORING_GUIDE §11): he bought a pair of headphones
    that have no sound and returns to the shop to complain and request an
    exchange. Reuses فروشنده as the shop employee's generic role name,
    already established in a1_unit08 (shopping), rather than naming a new
    character for a one-off service role. Own scenario, authored
    independently of the English/Dutch A2 units and of the prs sibling
    realization of this same outcome (not consulted, per §8) -- also did
    not consult the nl realization built for this same new spine outcome
    this session. A2-level step-up from A1's plain price/quantity
    shopping (universal.a1.shopping.ask_prices_quantities, this outcome's
    own prerequisite, alongside universal.a2.opinions.
    give_opinions_with_reasons for the polite-complaint register):
    explaining what's wrong with a purchased item, understanding a
    written return-policy notice, and choosing between an exchange and a
    refund. Every kind:vocabulary card carries a real example: sentence
    per §19, authored at schema_version 1.1 from the start. No
    fill_in_blank used (§13/§17 n/a). No listen_type/listen_select/
    listen_order or audio-only dialogue_comprehension anywhere per §14 --
    every exercise has a real visible text prompt; media_assets is
    pre-staging only, unreferenced by any exercise. Every multi-clause
    accepted_answers list carries period/comma/و-joined forms per §12.
    matching_pairs uses 6 pairs per §16. Every fact (headphones bought
    three days ago, no sound, has the receipt, seven-day return window,
    exchanged rather than refunded) kept consistent across lesson02/03/04
    per §11 -- lesson03's return-policy notice and lesson04's dialogue
    are treated as the same real store's policy, not two unrelated facts.
    Dialect: continues fa's established Iranian register (هستم-family
    copula, ببخشید/بفرمایید, colloquial -e/-ه contractions like
    "خرابه"/"خریدینش"), deliberately never Dari forms. Checked script
    purity by eye against known-correct Persian-range keheh/yeh usage
    throughout. firecrawl re-checked fresh this pass (`firecrawl
    --status`): still 0/1,000 credits -- authored via established-
    conventions-only per the standing contingency, same precedent as
    every earlier fa A2 unit's own provenance. Pending fresh-context
    review; left unreviewed per AUTHORING_GUIDE §9.

course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: >-
    Neutral-polite spoken Iranian register for a routine store-counter
    complaint. Continues ببخشید as the established polite attention-getter
    and لطفاً (please) for a polite request, alongside the light-verb
    constructions پس دادن (to return an item) and تعویض کردن (to exchange).

