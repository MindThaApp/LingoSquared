    language: fa
    text: خراب، رسید، پس دادن، تعویض، بازپرداخت، مهلت
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a2.audio.shopping_complaint.notice.01
    language: fa
    text: "مهلت پس دادن کالا: هفت روز از تاریخ خرید، با رسید."
    voice_hint: neutral_adult_announcement
    status: pending_generation
  - content_key: fa.a2.audio.dialogue.shop_return_counter.01
    language: fa
    text: "نیما: ببخشید، این هدفون رو خریدم ولی صدا نداره. فروشنده: رسید دارید؟ چه روزی خریدینش؟ نیما: بله، بفرمایید. سه روز پیش خریدمش. فروشنده: مشکلی نیست، تو مهلت هفت روزه هستید. می‌خواید تعویضش کنیم یا پولتون رو پس بدیم؟ نیما: تعویضش کنید، لطفاً. فروشنده: باشه، الان یک هدفون جدید بهتون می‌دم."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: fa.a2.unit18.shopping_complaint
    title: شکایت خرید
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.shopping.make_a_complaint
    planned_lesson_count: 4

    lessons:
      - content_key: fa.a2.unit18.lesson01.shopping_complaint_vocabulary
        title: کلمات مربوط به پس دادن کالا
        spine_outcome_id: universal.a2.shopping.make_a_complaint
        teaching:
          - content_key: fa.a2.unit18.lesson01.teach.broken_word
            kind: vocabulary
            target: {text: خراب, language_code: fa, direction: rtl}
            introduced_tokens: [خراب, خرابه]
            example: {text: "این هدفون خرابه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson01.teach.receipt_word
            kind: vocabulary
            target: {text: رسید, language_code: fa, direction: rtl}
            introduced_tokens: [رسید]
            example: {text: "رسیدم رو گم کردم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson01.teach.return_item_note
            kind: grammar_note
            target: {text: "پس دادن", language_code: fa, direction: rtl}
            introduced_tokens: [پس, دادن, "می‌دم", بدم]
          - content_key: fa.a2.unit18.lesson01.teach.exchange_word
            kind: vocabulary
            target: {text: تعویض, language_code: fa, direction: rtl}
            introduced_tokens: [تعویض, "تعویض کردن", کنم, کنیم]
            example: {text: "می‌خوام این کالا رو تعویض کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson01.teach.refund_word
            kind: vocabulary
            target: {text: بازپرداخت, language_code: fa, direction: rtl}
            introduced_tokens: [بازپرداخت]
            example: {text: "بازپرداخت پول دو روز طول می‌کشه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson01.teach.deadline_word
            kind: vocabulary
            target: {text: مهلت, language_code: fa, direction: rtl}
            introduced_tokens: [مهلت]
            example: {text: "مهلت پس دادن کالا هفت روزه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson01.teach.recap_headphones
            kind: phrase
            target: {text: "این هدفون رو خریدم", language_code: fa, direction: rtl}
            introduced_tokens: [هدفون, خریدم, این, رو]
        exercises:
          - content_key: fa.a2.unit18.lesson01.exercise01.recognize_broken
            type: multiple_choice
            tested_text: خراب
            prompt: {target_blocks: [{text: خراب, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson01.exercise02.recognize_receipt
            type: multiple_choice
            tested_text: رسید
            prompt: {target_blocks: [{text: رسید, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson01.exercise03.match_return_words
            type: matching_pairs
            tested_text: "خراب رسید تعویض بازپرداخت مهلت هدفون"
            prompt: {target_blocks: []}
            pairs:
              - {left: خراب, right: broken}
              - {left: رسید, right: receipt}
              - {left: تعویض, right: exchange}
              - {left: بازپرداخت, right: refund}
              - {left: مهلت, right: deadline}
              - {left: هدفون, right: headphones}
          - content_key: fa.a2.unit18.lesson01.exercise04.order_headphones_broken
            type: word_order
            tested_text: "این هدفون خرابه"
            prompt: {target_blocks: []}
            word_bank: [این, هدفون, خرابه]
          - content_key: fa.a2.unit18.lesson01.exercise05.write_receipt
            type: writing_prompt
            tested_text: رسید
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit18.lesson02.explaining_the_problem
        title: توضیح دادن مشکل کالا
        spine_outcome_id: universal.a2.shopping.make_a_complaint
        teaching:
          - content_key: fa.a2.unit18.lesson02.teach.no_sound_word
            kind: vocabulary
            target: {text: "صدا نداره", language_code: fa, direction: rtl}
            introduced_tokens: ["صدا نداره", صدا, نداره]
            example: {text: "این هدفون صدا نداره.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson02.teach.i_want_to_exchange_or_refund
            kind: phrase
            target: {text: "می‌خوام این هدفون رو تعویض کنم یا پولم رو پس بگیرم.", language_code: fa, direction: rtl}
            introduced_tokens: [می‌خوام, یا, پولم, "پس بگیرم", بگیرم]
          - content_key: fa.a2.unit18.lesson02.teach.full_complaint_sentence
            kind: phrase
            target: {text: "این هدفون رو خریدم ولی صدا نداره. می‌خوام تعویضش کنم یا پولم رو پس بگیرم.", language_code: fa, direction: rtl}
            introduced_tokens: [ولی, تعویضش]
        exercises:
          - content_key: fa.a2.unit18.lesson02.exercise01.recognize_complaint_sentence
            type: multiple_choice
            tested_text: "این هدفون رو خریدم ولی صدا نداره"
            prompt: {target_blocks: [{text: "این هدفون رو خریدم ولی صدا نداره.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson02.exercise02.order_want_exchange_or_refund
            type: word_order
            tested_text: "می‌خوام این هدفون رو تعویض کنم یا پولم رو پس بگیرم"
            prompt: {target_blocks: []}
            word_bank: [می‌خوام, این, هدفون, رو, تعویض, کنم, یا, پولم, رو, "پس بگیرم"]
          - content_key: fa.a2.unit18.lesson02.exercise03.dialogue_response_state_the_problem
            type: dialogue_response
            tested_text: "این هدفون رو خریدم ولی صدا نداره"
            prompt: {target_blocks: [{text: "سلام، چطور می‌تونم کمکتون کنم؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson02.exercise04.translate_want_exchange_or_refund
            type: translation
            tested_text: "می‌خوام این هدفون رو تعویض کنم یا پولم رو پس بگیرم"
            prompt: {target_blocks: []}
          - content_key: fa.a2.unit18.lesson02.exercise05.write_no_sound
            type: writing_prompt
            tested_text: "این هدفون صدا نداره"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit18.lesson03.reading_a_return_policy
        title: خواندن قانون پس دادن کالا
        spine_outcome_id: universal.a2.shopping.make_a_complaint
        teaching:
          - content_key: fa.a2.unit18.lesson03.teach.purchase_date_word
            kind: vocabulary
            target: {text: "تاریخ خرید", language_code: fa, direction: rtl}
            introduced_tokens: ["تاریخ خرید", تاریخ, خرید]
            example: {text: "تاریخ خرید روی رسیده.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson03.teach.policy_notice_text
            kind: reading
            target: {text: "مهلت پس دادن کالا: هفت روز از تاریخ خرید، با رسید.", language_code: fa, direction: rtl}
            introduced_tokens: [کالا, هفت, روز, از, با, روزه]
        exercises:
          - content_key: fa.a2.unit18.lesson03.exercise01.read_return_window
            type: reading_comprehension
            tested_text: "هفت روز از تاریخ خرید"
            prompt: {target_blocks: [{text: "طبق اطلاعیه، مهلت پس دادن کالا چقدره؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson03.exercise02.read_return_condition
            type: reading_comprehension
            tested_text: "با رسید"
            prompt: {target_blocks: [{text: "طبق اطلاعیه، برای پس دادن کالا چی لازمه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson03.exercise03.recognize_purchase_date
            type: multiple_choice
            tested_text: "تاریخ خرید"
            prompt: {target_blocks: [{text: "تاریخ خرید", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson03.exercise04.order_return_policy_sentence
            type: word_order
            tested_text: "مهلت پس دادن کالا هفت روزه"
            prompt: {target_blocks: []}
            word_bank: [مهلت, پس, دادن, کالا, هفت, روزه]
          - content_key: fa.a2.unit18.lesson03.exercise05.write_return_window
            type: writing_prompt
            tested_text: "مهلت پس دادن کالا هفت روزه"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit18.lesson04.shop_return_counter_dialogue
        title: گفتگو در باجه‌ی پس دادن کالا
        spine_outcome_id: universal.a2.shopping.make_a_complaint
        teaching:
          - content_key: fa.a2.unit18.lesson04.teach.please_word
            kind: vocabulary
            target: {text: لطفاً, language_code: fa, direction: rtl}
            introduced_tokens: [لطفاً]
            example: {text: "تعویضش کنید، لطفاً.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson04.teach.turn01
            kind: dialogue
            target: {text: "ببخشید، این هدفون رو خریدم ولی صدا نداره.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [نیما, ببخشید]
          - content_key: fa.a2.unit18.lesson04.teach.turn02
            kind: dialogue
            target: {text: "رسید دارید؟ چه روزی خریدینش؟", language_code: fa, direction: rtl, speaker: فروشنده}
            introduced_tokens: [فروشنده, دارید, چه, روزی, خریدینش]
          - content_key: fa.a2.unit18.lesson04.teach.turn03
            kind: dialogue
            target: {text: "بله، بفرمایید. سه روز پیش خریدمش.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [بله, بفرمایید, سه, پیش, خریدمش]
          - content_key: fa.a2.unit18.lesson04.teach.turn04
            kind: dialogue
            target: {text: "مشکلی نیست، تو مهلت هفت روزه هستید. می‌خواید تعویضش کنیم یا پولتون رو پس بدیم؟", language_code: fa, direction: rtl, speaker: فروشنده}
            introduced_tokens: [مشکلی, نیست, تو, هستید, می‌خواید, پولتون, بدیم]
          - content_key: fa.a2.unit18.lesson04.teach.turn05
            kind: dialogue
            target: {text: "تعویضش کنید، لطفاً.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [کنید]
          - content_key: fa.a2.unit18.lesson04.teach.turn06
            kind: dialogue
            target: {text: "باشه، الان یک هدفون جدید بهتون می‌دم.", language_code: fa, direction: rtl, speaker: فروشنده}
            introduced_tokens: [باشه, الان, یک, جدید, بهتون]
        exercises:
          - content_key: fa.a2.unit18.lesson04.exercise01.comprehend_nima_problem
            type: dialogue_comprehension
            tested_text: "این هدفون رو خریدم ولی صدا نداره"
            prompt:
              target_blocks:
                - {text: "ببخشید، این هدفون رو خریدم ولی صدا نداره.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson04.exercise02.comprehend_shop_offer
            type: dialogue_comprehension
            tested_text: "می‌خواید تعویضش کنیم یا پولتون رو پس بدیم"
            prompt:
              target_blocks:
                - {text: "مشکلی نیست، تو مهلت هفت روزه هستید. می‌خواید تعویضش کنیم یا پولتون رو پس بدیم؟", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit18.lesson04.exercise03.recognize_please
            type: multiple_choice
            tested_text: لطفاً
            prompt: {target_blocks: [{text: لطفاً, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson04.exercise04.order_bought_three_days_ago
            type: word_order
            tested_text: "سه روز پیش خریدمش"
            prompt: {target_blocks: []}
            word_bank: [سه, روز, پیش, خریدمش]
          - content_key: fa.a2.unit18.lesson04.exercise05.dialogue_response_request_exchange
            type: dialogue_response
            tested_text: "تعویضش کنید لطفاً"
            prompt: {target_blocks: [{text: "می‌خواید تعویضش کنیم یا پولتون رو پس بدیم؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit18.lesson04.exercise06.write_complaint_summary
            type: writing_prompt
            tested_text: "این هدفون رو خریدم ولی صدا نداره"
