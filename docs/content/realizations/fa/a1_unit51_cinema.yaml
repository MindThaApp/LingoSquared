schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access
    before authoring this unit, per AUTHORING_GUIDE.md #10 and the standing
    instruction to re-check Firecrawl quota fresh even though it was
    reported exhausted in every prior round. `firecrawl search "FSI Persian
    Basic Course cinema سینما movie ticket theater"` returned `Error:
    Request failed with status code 402` (payment required), confirming the
    account genuinely remains at 0 credits. Fell back to this session's own
    cached `fsi_persian_livelingua.txt` local `pdftotext -layout`
    extraction of the same Live Lingua-hosted FSI Spoken Persian PDF prior
    fa units in this line have used (~66,700 words). Grepped
    case-insensitively for cinema/movie/film/theater: found a real, genuine
    hit -- Unit 4's Basic Sentences (Alborz/Parviz dialogue) contains
    "meyl darid, baham besinema berim" ("Would you like to go to the
    movies with me") and a follow-up exchange about coming to dinner
    before going to the movies, plus Unit 4's own grammar notes explicitly
    covering "When will the movies start?" (/sinema key soru mise/) as a
    worked example of the /mise/ ('becomes') construction. Read this
    section closely before deciding NOT to adapt it directly: it is a
    social dinner-invitation-then-movies scene between two colleague-level
    men (Alborz inviting Parviz to dinner before a shared trip to the
    cinema), not a box-office/ticket-counter exchange -- no ticket price,
    showtime-request, or film-title vocabulary appears anywhere in it, only
    the general "let's go to the movies" social frame and the /mise/
    "becomes/starts" grammar point this unit already independently needed
    for "شروع می‌شه" (see reuse chain below). Genuinely useful as
    confirmation that FSI Persian's own course structure treats "going to
    the movies" as a real A1-appropriate social topic and that /-e mise/
    ("it starts") is the authentic grammatical pattern for a thing
    beginning, not a coincidence -- but not a source of any adapted
    sentence, since this project's own established two-party
    customer-plus-named-service-character box-office shape (see units
    41/44/45/46/47/48/49/50) is a structurally different scene than FSI's
    two-friends social-invitation dialogue. Per AUTHORING_GUIDE.md #10's
    "never import verbatim" rule, no phrase from this source is reused;
    all vocabulary and the full dialogue in this unit are authored fresh
    from this project's own already-shipped vocabulary (see review notes
    below for the exact reuse chain).
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit50 (restaurant). Realizes
    universal.a1.cinema.go_to_the_cinema -- confirmed as the correct next
    unrealized A1 outcome for fa by diffing every spine_outcome_id already
    used across every docs/content/realizations/fa/a1_unit*.yaml file
    (grep -o "spine_outcome_id: universal\.[a-z0-9_.]*" per file,
    deduplicated) against universal.a1.* ids in
    docs/content/universal_spine.yaml's own declaration order: fa has
    realized every A1 outcome through unit50 (restaurant) with zero gaps,
    and universal.a1.cinema.go_to_the_cinema is the very next A1 id
    declared in the spine immediately after restaurant.dine_at_restaurant.
    Prerequisite outcomes (plans.make_simple_plans/unit12,
    money.handle_basic_money_matters/unit21) are both already realized in
    this course, so no prerequisite gap blocks this unit.

    Relationship to unit12 (plans): unit12 already realizes
    universal.a1.plans.make_simple_plans and its own dialogue already has
    a character proposing "می‌خوای پنجشنبه بریم سینما؟" (do you want to go
    to the movies on Thursday) -- that is expected, deliberate continuity,
    not a duplicate unit: unit12 teaches making the PLAN to go to the
    cinema in the abstract, while this unit realizes the distinct, later
    cinema.go_to_the_cinema outcome, which specifically layers the actual
    box-office transaction (buy a ticket, ask/confirm a showtime, learn
    the price, briefly discuss the film afterward) on top of that
    plan-making skill. سینما itself is directly reused from unit12
    (re-declared in this file's own introduced_tokens per the compiler's
    per-file-only check, per standing convention). Also reuses بلیط
    (ticket) from unit16 (travel) and فیلم (film) from unit13 (past
    events) -- both already-corpus-known nouns from unrelated topics,
    repurposed naturally into the cinema box-office scene, the same kind
    of established cross-unit reuse unit50 did with رستوران/منو from
    unit05/06.

    Character/register choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring customer character) buys the cinema ticket,
    continuing his established "visits a service provider and states a
    need" role from units 17/41/44/45/46/47/48/49/50. A NEW named
    box-office/cinema-clerk character, خانم موسوی, is introduced -- an
    Iranian cinema box office is a genuinely gender-neutral service role
    with no authenticity constraint either way, so she is authored female
    specifically to bring the running corpus-wide named-service-character
    balance to parity: unit50 left the corpus at 5 male (آقای کریمی,
    صادقی, نوری, مرادی, جعفری) vs 4 female (خانم احمدی, رضایی, کاظمی,
    رحیمی); adding موسوی brings it to 5 male vs 5 female, genuinely
    balanced for the first time this session. Confirmed collision-free via
    a real grep of every آقای/خانم name already used across the fa corpus
    (کریمی, احمدی, صادقی, رضایی, نوری, مرادی, کاظمی, جعفری, رحیمی) plus
    every occurrence of موسوی anywhere in the existing fa realizations or
    en-fa overlays: zero prior use anywhere. خانم موسوی speaks in the same
    neutral polite service register units 41/42/44/45/46/47/48/49/50
    already established for this course's other service-encounter
    characters; نیما keeps his usual informal register.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, confirmed with a real grep of every prior fa a1_unit*.yaml
    file's introduced_tokens declarations, not by eye): سینما (unit12),
    بلیط (unit16), فیلم (unit13), می‌خوام (unit03), این (unit03/04/08/15/
    20/26/49/50), چقدر/می‌شه (unit21/28/49/50, unit11/35/49/50), چقدره
    (unit03/28's own "بلیط اتوبوس چقدره؟" pattern, directly reused for
    "بلیط سینما چقدره؟" here), کدوم (unit10/14/28/43), ساعت (unit09),
    هفت/هشتاد/هزار/تومن (unit03/21), تومنه (unit03/50), عصر (unit09),
    آره/درسته (unit03 -- reviewed but NOT used as the actual dialogue
    "yes," see below), سلام/ممنون (units01/17/22/45/46/47/48/49/50), باشه
    (units01/02/06/17/22/45/46/47/48/49/50), چطور (unit01), بود (unit06,
    "خیلی خوشمزه بود"), باحال/باحاله (unit36/37/38). New vocabulary
    genuinely introduced for the first time in the whole corpus: سانس
    (showtime/session), شروع (start/begin -- combined with the
    already-taught cost-sense verb می‌شه to form "شروع می‌شه," a second,
    equally authentic sense of the same verb of becoming, exactly the
    /sinema key soru mise/ "when do the movies start" construction FSI's
    own Unit 4 grammar notes independently confirm as genuine colloquial
    Persian -- not a stretch usage), and بله (formal "yes," chosen over
    the already-taught informal آره specifically because خانم موسوی's
    established neutral-polite service register calls for the more formal
    yes, matching how every other service character in this corpus speaks
    -- exactly 3 new words, in line with this course's established 2-4
    new-word-per-unit range (unit47: 2, unit48: 2, unit49: 3, unit50: 3).
    No new verb-conjugation pattern is introduced -- شروع می‌شه reuses the
    exact می‌شه present-tense colloquial form already established by
    units 11/35/49/50 (cost/become sense), and every other verb form used
    (می‌خوام, باشه) was already established by earlier units.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the showtime (ساعت هفت عصر, 7 pm) and the
    ticket price (هشتاد هزار تومن, 80,000 toman) are stated identically in
    the dialogue (lesson04), the cinema-sign reading text (lesson05), and
    the wrap-up review (lesson06), and never contradicted anywhere else in
    the unit. Every kind:vocabulary teaching item (سانس, شروع, خانم موسوی)
    has an example sentence per schema 1.1/AUTHORING_GUIDE §19, built only
    from the card's own word plus tokens already declared earlier in THIS
    file's document order (no forward references) -- confirmed by hand
    for each: "بلیط سانس می‌خوام" (سانس's example) only uses بلیط/می‌خوام,
    both declared earlier in lesson01; "ساعت هفت شروع می‌شه" (شروع's
    example) only uses ساعت/هفت/می‌شه, all declared earlier in lesson02;
    "سلام خانم موسوی!" (character example) only uses سلام, declared
    earlier in lesson04. The phrase card "بلیط سینما چقدره؟" and "بلیط
    هشتاد هزار تومنه" (lesson03) review only already-taught component
    tokens (no new root word), so they are not subject to the
    vocabulary-card example requirement, mirroring exactly how unit50's
    own phrase card "صورت‌حساب رو لطف می‌کنید؟" was treated. Every
    matching_pairs exercise has 6-8 pairs per §16 (lesson01: 6, lesson02:
    6, lesson03: 6, lesson04: 7 dialogue-line pairs matching the
    dialogue's own 7 turns, lesson05: 7, lesson06: 6). No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit --
    fa has real Azure TTS per AUTHORING_GUIDE §14, but this file continues
    the established text-based corpus-consistency pattern from units
    19-50, the same choice those units' own reviews made. The spine
    outcome's own "listening" assessment requirement (identify the
    showtime, price, or film detail in a short cinema exchange) is covered
    via lesson04's dialogue_comprehension exercise, the same interpretation
    units 41/42/44/45/46/47/48/49/50 already established for their own
    "listening" assessment coverage without a literal audio exercise type.
    Checked the same-speaker/same-audio distractor-collision bug class
    (found and fixed 2026-07-09 in the nl corpus, commit 148240e) anyway,
    per the standing instruction to list every line each speaker says
    before writing any distractor, even though there is no listen_select
    exercise in this file to directly trigger it: نیما says "سلام خانم
    موسوی. یه بلیط می‌خوام."/"سانس ساعت هفت عصر."/"باشه، می‌خوام. فیلم
    ساعت هفت شروع می‌شه؟"/"ممنون!"; خانم موسوی says "سلام نیما. برای کدوم
    سانس؟"/"باشه. بلیط هشتاد هزار تومنه."/"بله، ساعت هفت شروع می‌شه." --
    lesson04's dialogue_comprehension exercise asks what خانم موسوی asks
    نیما when she says "برای کدوم سانس؟", with distractors ("She asks how
    many tickets he wants."/"She asks if he wants popcorn."/"She asks for
    his phone number.") that are plausible-fact alternatives, NOT lines
    either speaker actually says or facts either speaker actually states
    anywhere in this unit's dialogue -- ticket quantity, popcorn, and a
    phone number are never mentioned by either character, so there is no
    cross-exercise collision. The dialogue_response exercise (lesson04)
    accepts نیما's own actual next line ("ممنون!", with paraphrase
    variants also accepted), not a distractor set, so the same-speaker-
    collision question doesn't apply to it. Every "Translate into English"
    exercise in the paired overlay explicitly sets answer_language_code:
    en. No exercise in this unit tests a genuine two-clause sentence
    joined by "and"/comma (§12) -- every multi-sentence teaching/review
    line (lesson04 dialogue lines 1/5, lesson06's review/afterward lines)
    is authored as two separate short sentences, matching how units
    44-50 already treat their own two-sentence notes, with paraphrase-
    variant accepted answers rather than clause-join variants. Ran a
    recursive scan (grep for bare, unquoted yes/no/true/false/on/off
    tokens as YAML scalar values, plus a full yaml.safe_load parse of both
    this file and its paired overlay confirming every value that loaded is
    a str/list/dict, never a Python bool anywhere in a learner-facing
    field) for bare unquoted yes/no/true/false/on/off values (including
    matching_pairs right: values specifically) -- zero hits, see the
    overlay's own review note for the exact scan result. Ran a
    Persian-vs-Arabic codepoint scan (grep for Arabic kaf U+0643 and
    Arabic yeh U+064A across both files) -- zero hits, all keheh/yeh in
    this file use the correct Persian-range codepoints (U+06A9/U+06CC).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character) keeps his usual informal register as
    the cinema customer. خانم موسوی, a new formal-register cinema box-office
    clerk, speaks with neutral polite service language, consistent with the
    register units 41/42/44/45/46/47/48/49/50 already established for this
    course's other service-encounter characters. Reuses سینما (unit12),
    بلیط (unit16), فیلم (unit13), می‌خوام (unit03), این (unit03), چقدر/
    می‌شه (unit21/28/49/50, unit11/35/49/50), چقدره (unit03/28), کدوم
    (unit10/14/28/43), ساعت/عصر (unit09), هفت/هشتاد/هزار/تومن/تومنه
    (unit03/21/50), سلام/ممنون (units01/17/22/45/46/47/48/49/50), باشه
    (units01/02/06/17/22/45/46/47/48/49/50), چطور (unit01), بود (unit06),
    باحال/باحاله (unit36/37/38) without re-teaching any of it from scratch.
    No word is given a new sense beyond its existing corpus meaning in this
    unit, except می‌شه's already-attested second "becomes/starts" sense
    (شروع می‌شه), which is the same verb of becoming already taught for the
    cost sense, not a new lexical item.

media_assets:
  - content_key: fa.a1.unit51.audio.cinema.vocab.01
    language: fa
    text: "سانس، شروع، بله"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit51.audio.dialogue.cinema.01
    language: fa
    text: "نیما: سلام خانم موسوی. یه بلیط می‌خوام. خانم موسوی: سلام نیما. برای کدوم سانس؟ نیما: سانس ساعت هفت عصر. خانم موسوی: باشه. بلیط هشتاد هزار تومنه. نیما: باشه، می‌خوام. فیلم ساعت هفت شروع می‌شه؟ خانم موسوی: بله، ساعت هفت شروع می‌شه. نیما: ممنون!"
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit51.cinema
    title: سینما
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.cinema.go_to_the_cinema
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit51.lesson01.new_cinema_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.cinema.go_to_the_cinema
        teaching:
          - content_key: fa.a1.unit51.lesson01.teach.review_sinema_belit
            kind: grammar_note
            target: {text: "سینما (cinema, movies) -- already taught from unit12 / بلیط (ticket) -- already taught from unit16", language_code: fa, direction: rtl}
            introduced_tokens: [سینما, بلیط]
          - content_key: fa.a1.unit51.lesson01.teach.review_mikhaam_in
            kind: grammar_note
            target: {text: "می‌خوام (I want) -- already taught from unit03 / این (this) -- already taught from unit03/04/08/15/20/26/49/50", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌خوام", این]
          - content_key: fa.a1.unit51.lesson01.teach.review_cheghadr_mishe
            kind: grammar_note
            target: {text: "چقدر (how much) -- already taught from unit21/28/49/50 / می‌شه (it comes to / it becomes) -- already taught from unit11/35/49/50", language_code: fa, direction: rtl}
            introduced_tokens: [چقدر, "می‌شه"]
          - content_key: fa.a1.unit51.lesson01.teach.sans
            kind: vocabulary
            target: {text: سانس, language_code: fa, direction: rtl}
            introduced_tokens: [سانس]
            example: {text: "بلیط سانس می‌خوام.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit51.lesson01.exercise01.recognize_sans
            type: multiple_choice
            tested_text: سانس
            prompt: {target_blocks: [{text: سانس, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit51.lesson01.exercise02.recognize_belit_sans_mikhaam
            type: multiple_choice
            tested_text: "بلیط سانس می‌خوام."
            prompt: {target_blocks: [{text: "بلیط سانس می‌خوام.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit51.lesson01.exercise03.match_cinema_one
            type: matching_pairs
            tested_text: "سینما بلیط می‌خوام چقدر می‌شه سانس"
            prompt: {target_blocks: []}
            pairs:
              - {left: سینما, right: "cinema / movies"}
              - {left: بلیط, right: ticket}
              - {left: "می‌خوام", right: "I want"}
              - {left: چقدر, right: "how much"}
              - {left: "می‌شه", right: "it comes to"}
              - {left: سانس, right: showtime}
          - content_key: fa.a1.unit51.lesson01.exercise04.word_order_belit_sans_mikhaam
            type: word_order
            tested_text: "بلیط سانس می‌خوام"
            prompt: {target_blocks: [{text: "I want a showtime ticket.", language_code: en, direction: ltr}]}
            word_bank: [بلیط, سانس, "می‌خوام"]
          - content_key: fa.a1.unit51.lesson01.exercise05.translate_in_belit
            type: translation
            tested_text: "این بلیط"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit51.lesson02.new_cinema_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.cinema.go_to_the_cinema
        teaching:
          - content_key: fa.a1.unit51.lesson02.teach.review_kodum
            kind: grammar_note
            target: {text: "کدوم (which) -- already taught from unit10/14/28/43", language_code: fa, direction: rtl}
            introduced_tokens: [کدوم]
          - content_key: fa.a1.unit51.lesson02.teach.review_saat_haft
            kind: grammar_note
            target: {text: "ساعت (o'clock, hour) -- already taught from unit09 / هفت (seven) -- already taught from unit03", language_code: fa, direction: rtl}
            introduced_tokens: [ساعت, هفت]
          - content_key: fa.a1.unit51.lesson02.teach.review_asr
            kind: grammar_note
            target: {text: "عصر (afternoon, evening / pm) -- already taught from unit09", language_code: fa, direction: rtl}
            introduced_tokens: [عصر]
          - content_key: fa.a1.unit51.lesson02.teach.shoru
            kind: vocabulary
            target: {text: شروع, language_code: fa, direction: rtl}
            introduced_tokens: [شروع]
            example: {text: "ساعت هفت شروع می‌شه.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit51.lesson02.exercise01.recognize_shoru
            type: multiple_choice
            tested_text: شروع
            prompt: {target_blocks: [{text: شروع, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit51.lesson02.exercise02.recognize_saat_haft_shoru_mishe
            type: multiple_choice
            tested_text: "ساعت هفت شروع می‌شه."
            prompt: {target_blocks: [{text: "ساعت هفت شروع می‌شه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit51.lesson02.exercise03.match_cinema_two
            type: matching_pairs
            tested_text: "کدوم ساعت هفت عصر شروع ساعت هفت شروع می‌شه"
            prompt: {target_blocks: []}
            pairs:
              - {left: کدوم, right: which}
              - {left: ساعت, right: "o'clock / hour"}
              - {left: هفت, right: seven}
              - {left: عصر, right: "afternoon / pm"}
              - {left: شروع, right: "start / begin"}
              - {left: "ساعت هفت شروع می‌شه.", right: "It starts at seven o'clock."}
          - content_key: fa.a1.unit51.lesson02.exercise04.word_order_saat_haft_shoru_mishe
            type: word_order
            tested_text: "ساعت هفت شروع می‌شه"
            prompt: {target_blocks: [{text: "It starts at seven o'clock.", language_code: en, direction: ltr}]}
            word_bank: [ساعت, هفت, شروع, "می‌شه"]
          - content_key: fa.a1.unit51.lesson02.exercise05.translate_kodum_sans
            type: translation
            tested_text: "کدوم سانس؟"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit51.lesson03.ticket_price
        title: "قیمت بلیط"
        spine_outcome_id: universal.a1.cinema.go_to_the_cinema
        teaching:
          - content_key: fa.a1.unit51.lesson03.teach.review_cheghadre
            kind: grammar_note
            target: {text: "چقدره (how much is it) -- already taught from unit03/28's own \"بلیط اتوبوس چقدره؟\"", language_code: fa, direction: rtl}
            introduced_tokens: ["چقدره"]
          - content_key: fa.a1.unit51.lesson03.teach.review_hashtad_hezar_toman
            kind: grammar_note
            target: {text: "هشتاد (eighty) -- already taught from unit03 / هزار (thousand), تومن (toman) -- already taught from unit03/21 / تومنه (it's ... toman) -- already taught from unit03/50", language_code: fa, direction: rtl}
            introduced_tokens: [هشتاد, هزار, تومن, "تومنه"]
          - content_key: fa.a1.unit51.lesson03.teach.belit_cheghadre
            kind: phrase
            target: {text: "بلیط سینما چقدره؟", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.a1.unit51.lesson03.teach.belit_price
            kind: phrase
            target: {text: "بلیط هشتاد هزار تومنه.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit51.lesson03.exercise01.recognize_belit_cheghadre
            type: multiple_choice
            tested_text: "بلیط سینما چقدره؟"
            prompt: {target_blocks: [{text: "بلیط سینما چقدره؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit51.lesson03.exercise02.recognize_belit_price
            type: multiple_choice
            tested_text: "بلیط هشتاد هزار تومنه."
