target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access
    before authoring this unit, per AUTHORING_GUIDE.md #10 and the standing
    instruction to re-check Firecrawl quota fresh even though it has been
    reported exhausted in every prior round. `firecrawl search "FSI Persian
    Basic Course museum موزه exhibition ticket"` returned `Error: Request
    failed with status code 402` (payment required), confirming the account
    genuinely remains at 0 credits. Fell back to this session's own cached
    local `pdftotext -layout` extraction of the same Live Lingua-hosted FSI
    Spoken Persian PDF prior fa units in this line have used
    (`fsi_persian_livelingua.txt`, ~17,130 lines, ~66,700 words). Grepped
    case-insensitively for museum/exhibit: zero hits anywhere in the
    document. FSI Persian's own course genuinely does not cover a museum
    scene at all (unlike the cinema unit, which found a real, if
    structurally different, "going to the movies" passage in Unit 4) --
    honestly disclosing nothing usable was found, per the standing honesty
    requirement, rather than stretching an unrelated passage to look like a
    source. All vocabulary and the full dialogue in this unit are authored
    fresh from this project's own already-shipped vocabulary (see review
    notes below for the exact reuse chain).
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit51 (cinema). Realizes
    universal.a1.museum.visit_a_museum -- confirmed as the correct next
    unrealized A1 outcome for fa by diffing every spine_outcome_id already
    used across every docs/content/realizations/fa/a1_unit*.yaml file
    (grep -h "spine_outcome_id:" per file, deduplicated) against every
    universal.a1.* id in docs/content/universal_spine.yaml's own declaration
    order: fa has realized every A1 outcome through unit51 (cinema) with
    zero gaps, and universal.a1.museum.visit_a_museum is the very next A1 id
    declared in the spine immediately after cinema.go_to_the_cinema.
    Prerequisite outcomes (places.locate_common_places/unit05,
    money.handle_basic_money_matters/unit21) are both already realized in
    this course, so no prerequisite gap blocks this unit.

    Character/register choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring customer character) buys the museum ticket,
    continuing his established "visits a service provider and states a
    need" role from units 17/41/44/45/46/47/48/49/50/51. A NEW named
    museum-clerk character, آقای فرهادی, is introduced -- confirmed
    collision-free via a real grep of every آقای/خانم name already used
    across the fa corpus (کریمی, احمدی, صادقی, رضایی, نوری, مرادی, کاظمی,
    جعفری, رحیمی, موسوی) plus a scan for فرهادی anywhere in the existing
    fa realizations/overlays: zero prior use anywhere. This brings the
    corpus-wide named-service-character balance to 6 male (کریمی, صادقی,
    نوری, مرادی, جعفری, فرهادی) vs 5 female (احمدی, رضایی, کاظمی, رحیمی,
    موسوی) -- a deliberate, undramatic shift back toward male after unit51
    brought it to genuine parity, not a policy change; long-run balance is
    the goal, not a fixed ratio every single unit. آقای فرهادی speaks in
    the same neutral polite service register units 41/42/44/45/46/47/48/
    49/50/51 already established for this course's other service-encounter
    characters; نیما keeps his usual informal register.

    Museum named سینما-style after its own clerk (موزه فرهادی, "Farhadi
    Museum"), the exact same naming convention unit51 used for سینما موسوی
    -- a small provincial venue plausibly named for its owner/manager,
    consistent A1-appropriate business-naming pattern across this course's
    service-encounter units.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, confirmed with a real grep of every prior fa a1_unit*.yaml
    file's introduced_tokens declarations, not by eye): بلیط (earliest:
    unit16, also 28/51), دارید (earliest: unit01, also 04/06/21/42/44/49),
    می‌خوام (earliest: unit03), این (earliest: unit02, also 03/04/08/15/
    20/26/49/50/51), چقدر (earliest: unit21, also 28/48/49/50/51), می‌شه
    (earliest: unit11, also 35/48/49/50/51), داریم (unit38 only --
    1st-person-plural of دارم/داره), از (earliest: unit01), تا (earliest:
    unit03), ساعت (earliest: unit09), باز (earliest: unit24, also 27/43/
    49), بازه (unit49 only), چقدره (earliest: unit28, also 51), شصت
    (unit03 only), هزار/تومن/تومنه (earliest: unit03, also 21/46-51),
    سلام (earliest: unit01), ممنون (earliest: unit01), باشه (earliest:
    unit03), آقای (earliest: unit40), دیدم (unit13 only -- past tense "I
    saw"), چطور (earliest: unit01), بود (earliest: unit06), باحال
    (earliest: unit36), یه (earliest: unit02), نه/پنج (earliest: unit03 --
    numbers nine/five). New vocabulary genuinely introduced for the first
    time in the whole corpus: موزه (museum), نمایشگاه (exhibition), and
    قدیمی (old, historic) -- exactly 3 new words, in line with this
    course's established 2-4 new-word-per-unit range (unit48: 2, unit49: 3,
    unit50: 3, unit51: 3). No new verb-conjugation pattern is introduced --
    every verb form used (می‌خوام, دارید, داریم, بازه, دیدم) was already
    established by earlier units.

    CORRECTION TO A PRE-EXISTING INACCURACY found while verifying this
    unit's own reuse chain by real grep (not by eye, per the standing
    instruction): unit51's own review notes claimed بله ("formal yes") was
    "New vocabulary genuinely introduced for the first time in the whole
    corpus" in unit51. A direct grep of every fa a1_unit*.yaml file's
    introduced_tokens shows بله was actually already introduced in unit02
    (`اسم شما چیه؟` dialogue, "بله. من مینا هستم.") and reused several
    times since (unit06/20/21/42/44/48/49/51). This is a pre-existing
    citation error in unit51's own file, not something this task is
    authorized or scoped to fix (out of scope -- unit51 is someone else's
    already-drafted, unreviewed unit; flagging honestly here rather than
    silently repeating the same wrong claim or silently editing a sibling
    file). This unit does not reuse بله at all, so the error doesn't
    propagate into this file's own content; it's flagged purely so the
    eventual fresh-context reviewer (or a future audit pass) catches it in
    unit51 too.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the ticket price (شصت هزار تومن, 60,000 toman),
    the opening hours (از ساعت نه تا پنج, 9 to 5), and the exhibition
    description (یه نمایشگاه قدیمی, an old/historic exhibition) are stated
    identically in the dialogue (lesson04), the museum-sign reading text
    (lesson05), and the wrap-up review (lesson06), and never contradicted
    anywhere else in the unit. Every kind:vocabulary teaching item (موزه,
    نمایشگاه, قدیمی, آقای فرهادی) has an example sentence per schema 1.1/
    AUTHORING_GUIDE §19, built only from the card's own word plus tokens
    already declared earlier in THIS file's document order (no forward
    references) -- confirmed by hand for each: "بلیط موزه می‌خوام" (موزه's
    example) only uses بلیط/می‌خوام, both declared earlier in lesson01;
    "یه نمایشگاه داریم" (نمایشگاه's example) only uses یه/داریم, both
    declared earlier in lesson02; "یه نمایشگاه قدیمی داریم" (قدیمی's
    example) only uses یه/نمایشگاه/داریم, all declared earlier in lesson02;
    "سلام آقای فرهادی!" (character example) only uses سلام, declared
    earlier in lesson04. The phrase cards "بلیط موزه چقدره؟" and "بلیط
    شصت هزار تومنه." (lesson03) review only already-taught component
    tokens (no new root word), so they are not subject to the
    vocabulary-card example requirement, mirroring exactly how unit51's own
    phrase cards "بلیط سینما چقدره؟"/"بلیط هشتاد هزار تومنه." were treated.
    Every matching_pairs exercise has 6-8 pairs per §16 (lesson01: 7,
    lesson02: 8, lesson03: 6, lesson04: 7 dialogue-line pairs matching the
    dialogue's own 7 turns, lesson05: 7, lesson06: 6). No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit --
    fa has real Azure TTS per AUTHORING_GUIDE §14, but this file continues
    the established text-based corpus-consistency pattern from units
    19-51, the same choice those units' own reviews made. The spine
    outcome's own "listening" assessment requirement (identify the ticket
    price, opening/closing time, or exhibition detail in a short museum
    exchange) is covered via lesson04's dialogue_comprehension exercise,
    the same interpretation units 41/42/44/45/46/47/48/49/50/51 already
    established for their own "listening" assessment coverage without a
    literal audio exercise type. Checked the same-speaker/same-audio
    distractor-collision bug class (found and fixed 2026-07-09 in the nl
    corpus, commit 148240e) anyway, per the standing instruction to list
    every line each speaker says before writing any distractor, even
    though there is no listen_select exercise in this file to directly
    trigger it: نیما says "سلام آقای فرهادی. یه بلیط موزه می‌خوام."/"باشه،
    می‌خوام. نمایشگاه دارید؟"/"موزه بازه؟"/"ممنون!"; آقای فرهادی says
    "سلام نیما. بلیط شصت هزار تومنه."/"بله، یه نمایشگاه قدیمی داریم."/
    "بله، از ساعت نه تا پنج بازه." -- lesson04's dialogue_comprehension
    exercise asks what نیما wants to know when he says "نمایشگاه دارید؟",
    with distractors ("He asks how many tickets he wants."/"He asks if he
    needs a guide."/"He asks for a discount.") that are plausible-fact
    alternatives, NOT lines either speaker actually says or facts either
    speaker actually states anywhere in this unit's dialogue -- ticket
    quantity, a guide, and a discount are never mentioned by either
    character, so there is no cross-exercise collision. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line ("ممنون!", with paraphrase variants also accepted), not a
    distractor set, so the same-speaker-collision question doesn't apply
    to it. Every "Translate into English" exercise in the paired overlay
    explicitly sets answer_language_code: en. No exercise in this unit
    tests a genuine two-clause sentence joined by "and"/comma (§12) --
    every multi-sentence teaching/review line (lesson04 dialogue lines 1/3,
    lesson06's review_saw/review_afterward lines) is authored as two
    separate short sentences, matching how units 44-51 already treat their
    own two-sentence notes, with paraphrase-variant accepted answers rather
    than clause-join variants. Ran a recursive scan (grep for bare,
    unquoted yes/no/true/false/on/off tokens as YAML scalar values, plus a
    full yaml.safe_load parse of both this file and its paired overlay
    confirming every value that loaded is a str/list/dict, never a Python
    bool anywhere in a learner-facing field) for bare unquoted
    yes/no/true/false/on/off values (including matching_pairs right: values
    specifically) -- zero hits, see the overlay's own review note for the
    exact scan result. Ran a Persian-vs-Arabic codepoint scan (grep for
    Arabic kaf U+0643 and Arabic yeh U+064A across both files) -- zero
    hits, all keheh/yeh in this file use the correct Persian-range
    codepoints (U+06A9/U+06CC).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character) keeps his usual informal register as
    the museum customer. آقای فرهادی, a new formal-register museum clerk,
    speaks with neutral polite service language, consistent with the
    register units 41/42/44/45/46/47/48/49/50/51 already established for
    this course's other service-encounter characters. Reuses بلیط
    (unit16), دارید (unit01), می‌خوام (unit03), این (unit02), چقدر
    (unit21), می‌شه (unit11), داریم (unit38), از (unit01), تا (unit03),
    ساعت (unit09), باز/بازه (unit24/49), چقدره (unit28), شصت/هزار/تومن/
    تومنه (unit03), سلام/ممنون (unit01), باشه (unit03), آقای (unit40),
    دیدم (unit13), چطور (unit01), بود (unit06), باحال (unit36), یه
    (unit02), نه/پنج (unit03) without re-teaching any of it from scratch.
    No word is given a new sense beyond its existing corpus meaning in this
    unit.

media_assets:
  - content_key: fa.a1.unit52.audio.museum.vocab.01
    language: fa
    text: "موزه، نمایشگاه، قدیمی"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit52.audio.dialogue.museum.01
    language: fa
    text: "نیما: سلام آقای فرهادی. یه بلیط موزه می‌خوام. آقای فرهادی: سلام نیما. بلیط شصت هزار تومنه. نیما: باشه، می‌خوام. نمایشگاه دارید؟ آقای فرهادی: بله، یه نمایشگاه قدیمی داریم. نیما: موزه بازه؟ آقای فرهادی: بله، از ساعت نه تا پنج بازه. نیما: ممنون!"
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit52.museum
    title: موزه
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.museum.visit_a_museum
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit52.lesson01.new_museum_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.museum.visit_a_museum
        teaching:
          - content_key: fa.a1.unit52.lesson01.teach.review_belit_darid
            kind: grammar_note
            target: {text: "بلیط (ticket) -- already taught from unit16 / دارید (do you have, formal) -- already taught from unit01/04/06/21/42/44/49", language_code: fa, direction: rtl}
            introduced_tokens: [بلیط, دارید]
          - content_key: fa.a1.unit52.lesson01.teach.review_mikhaam_in
            kind: grammar_note
            target: {text: "می‌خوام (I want) -- already taught from unit03 / این (this) -- already taught from unit02/03/04/08/15/20/26/49/50/51", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌خوام", این]
          - content_key: fa.a1.unit52.lesson01.teach.review_cheghadr_mishe
            kind: grammar_note
            target: {text: "چقدر (how much) -- already taught from unit21/28/48/49/50/51 / می‌شه (it comes to / it becomes) -- already taught from unit11/35/48/49/50/51", language_code: fa, direction: rtl}
