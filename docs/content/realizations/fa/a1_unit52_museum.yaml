            introduced_tokens: [موزه]
            example: {text: "بلیط موزه می‌خوام.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit52.lesson01.exercise01.recognize_mooze
            type: multiple_choice
            tested_text: موزه
            prompt: {target_blocks: [{text: موزه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit52.lesson01.exercise02.recognize_belit_mooze_mikhaam
