              - {left: "می‌خوام", right: "I want"}
              - {left: این, right: this}
              - {left: چقدر, right: "how much"}
              - {left: "می‌شه", right: "it comes to"}
              - {left: موزه, right: museum}
          - content_key: fa.a1.unit52.lesson01.exercise04.word_order_belit_mooze_mikhaam
