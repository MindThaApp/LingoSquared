    status: pending_generation
  - content_key: fa.a2.audio.opinions.statement.01
    language: fa
    text: "به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a2.audio.dialogue.office_debate.01
    language: fa
    text: "نگار: به نظر من دورکاری بهتره. آرش: من موافق نیستم. نگار: چرا؟ آرش: چون تو خونه تمرکز ندارم و دوست دارم همکارامو ببینم. نگار: باشه، ولی به نظر من ترافیک وقت زیادی می‌گیره. آرش: درسته، ولی من عادت دارم."
    voice_hint: two_adults_neutral_friendly
