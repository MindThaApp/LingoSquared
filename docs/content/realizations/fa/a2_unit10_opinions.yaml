units:
  - content_key: fa.a2.unit10.opinions
    title: نظر دادن
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.opinions.give_opinions_with_reasons
    planned_lesson_count: 4

    lessons:
      - content_key: fa.a2.unit10.lesson01.opinions_vocabulary
        title: کلمات مربوط به نظر دادن
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: fa.a2.unit10.lesson01.teach.nazar_word
            kind: vocabulary
            target: {text: نظر, language_code: fa, direction: rtl}
            introduced_tokens: [نظر]
          - content_key: fa.a2.unit10.lesson01.teach.dalil_word
            kind: vocabulary
            target: {text: دلیل, language_code: fa, direction: rtl}
            introduced_tokens: [دلیل]
          - content_key: fa.a2.unit10.lesson01.teach.remote_work_word
            kind: vocabulary
            target: {text: دورکاری, language_code: fa, direction: rtl}
            introduced_tokens: [دورکاری]
          - content_key: fa.a2.unit10.lesson01.teach.traffic_word
            kind: vocabulary
            target: {text: ترافیک, language_code: fa, direction: rtl}
            introduced_tokens: [ترافیک]
          - content_key: fa.a2.unit10.lesson01.teach.focus_word
            kind: vocabulary
            target: {text: تمرکز, language_code: fa, direction: rtl}
            introduced_tokens: [تمرکز]
          - content_key: fa.a2.unit10.lesson01.teach.office_word
            kind: vocabulary
            target: {text: دفتر, language_code: fa, direction: rtl}
            introduced_tokens: [دفتر]
          - content_key: fa.a2.unit10.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a2.unit10.lesson01.exercise01.recognize_nazar
            type: multiple_choice
            tested_text: نظر
            prompt: {target_blocks: [{text: نظر, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson01.exercise02.recognize_traffic
            type: multiple_choice
            tested_text: ترافیک
            prompt: {target_blocks: [{text: ترافیک, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson01.exercise03.match_opinions_words
            type: matching_pairs
            tested_text: نظر دلیل دورکاری ترافیک تمرکز
            prompt: {target_blocks: []}
            pairs:
              - {left: نظر, right: opinion}
              - {left: دلیل, right: reason}
              - {left: دورکاری, right: "remote work"}
              - {left: ترافیک, right: traffic}
              - {left: تمرکز, right: concentration}
              - {left: دفتر, right: office}
          - content_key: fa.a2.unit10.lesson01.exercise04.order_nazar_dalil
            type: word_order
            tested_text: نظر و دلیل
            prompt: {target_blocks: []}
            word_bank: [نظر, و, دلیل]
          - content_key: fa.a2.unit10.lesson01.exercise05.write_remote_work
            type: writing_prompt
            tested_text: دورکاری
            prompt: {target_blocks: [{text: "Write the Farsi word for remote work.", language_code: en, direction: ltr}]}

      - content_key: fa.a2.unit10.lesson02.giving_an_opinion
        title: ابراز نظر
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: fa.a2.unit10.lesson02.teach.in_my_opinion_better
            kind: phrase
            target: {text: "به نظر من دورکاری بهتره.", language_code: fa, direction: rtl}
            introduced_tokens: [به, نظر, من, بهتره]
          - content_key: fa.a2.unit10.lesson02.teach.because_traffic_wastes_time
            kind: phrase
            target: {text: "چون تو ترافیک تهران وقت زیادی تلف می‌شه.", language_code: fa, direction: rtl}
            introduced_tokens: [چون, تو, وقت, تهران, زیادی, تلف, می‌شه]
          - content_key: fa.a2.unit10.lesson02.teach.full_opinion_with_reason
            kind: phrase
            target: {text: "به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a2.unit10.lesson02.exercise01.recognize_opinion_phrase
            type: multiple_choice
            tested_text: "به نظر من دورکاری بهتره"
            prompt: {target_blocks: [{text: "به نظر من دورکاری بهتره.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson02.exercise02.order_because_traffic
            type: word_order
            tested_text: "چون تو ترافیک تهران وقت زیادی تلف می‌شه"
            prompt: {target_blocks: []}
            word_bank: [چون, تو, ترافیک, تهران, وقت, زیادی, تلف, می‌شه]
          - content_key: fa.a2.unit10.lesson02.exercise03.dialogue_response_which_better
            type: dialogue_response
            tested_text: "به نظر من دورکاری بهتره چون تو ترافیک تهران وقت زیادی تلف می‌شه"
            prompt: {target_blocks: [{text: "به نظر تو، دورکاری بهتره یا رفتن به دفتر؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson02.exercise04.translate_opinion_with_reason
            type: translation
            tested_text: "به نظر من دورکاری بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه"
            prompt: {target_blocks: []}
          - content_key: fa.a2.unit10.lesson02.exercise05.write_opinion_with_reason
            type: writing_prompt
            tested_text: "به نظر من دورکاری بهتره چون تو ترافیک تهران وقت زیادی تلف می‌شه"
            prompt: {target_blocks: [{text: "Write that in your opinion remote work is better, because a lot of time is wasted in Tehran traffic.", language_code: en, direction: ltr}]}

      - content_key: fa.a2.unit10.lesson03.reading_an_opinion_message
        title: خواندن پیام حاوی نظر
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: fa.a2.unit10.lesson03.teach.message_word
            kind: vocabulary
            target: {text: پیام, language_code: fa, direction: rtl}
            introduced_tokens: [پیام]
          - content_key: fa.a2.unit10.lesson03.teach.family_word
            kind: vocabulary
            target: {text: خانواده, language_code: fa, direction: rtl}
            introduced_tokens: [خانواده]
          - content_key: fa.a2.unit10.lesson03.teach.message_text
            kind: reading
            target: {text: "به نظر من دورکاری خیلی بهتره، چون تو ترافیک تهران وقت زیادی تلف می‌شه و می‌تونم بیشتر پیش خانواده‌م باشم.", language_code: fa, direction: rtl}
            introduced_tokens: [خیلی, می‌تونم, بیشتر, پیش, خانواده‌م, باشم]
        exercises:
          - content_key: fa.a2.unit10.lesson03.exercise01.read_her_opinion
            type: reading_comprehension
            tested_text: "دورکاری خیلی بهتره"
            prompt: {target_blocks: [{text: "نویسنده این پیام درباره‌ی دورکاری چه نظری داره؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson03.exercise02.read_her_second_reason
            type: reading_comprehension
            tested_text: "می‌تونم بیشتر پیش خانواده‌م باشم"
            prompt: {target_blocks: [{text: "به‌جز ترافیک، دلیل دوم نویسنده برای دوست داشتن دورکاری چیه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson03.exercise03.recognize_message_word
            type: multiple_choice
            tested_text: پیام
            prompt: {target_blocks: [{text: پیام, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson03.exercise04.order_more_time_with_family
            type: word_order
            tested_text: "می‌تونم بیشتر پیش خانواده‌م باشم"
            prompt: {target_blocks: []}
            word_bank: [می‌تونم, بیشتر, پیش, خانواده‌م, باشم]
          - content_key: fa.a2.unit10.lesson03.exercise05.write_own_reply
            type: writing_prompt
            tested_text: "به نظر من دورکاری بهتره"
            prompt: {target_blocks: [{text: "Write your own opinion: in your opinion, remote work is better.", language_code: en, direction: ltr}]}

      - content_key: fa.a2.unit10.lesson04.office_debate_dialogue
        title: بحث درباره‌ی دورکاری
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: fa.a2.unit10.lesson04.teach.i_dont_agree
            kind: phrase
            target: {text: "من موافق نیستم.", language_code: fa, direction: rtl}
            introduced_tokens: [موافق, نیستم]
          - content_key: fa.a2.unit10.lesson04.teach.turn01
            kind: dialogue
            target: {text: "به نظر من دورکاری بهتره.", language_code: fa, direction: rtl, speaker: نگار}
            introduced_tokens: [نگار]
          - content_key: fa.a2.unit10.lesson04.teach.turn02
            kind: dialogue
            target: {text: "من موافق نیستم.", language_code: fa, direction: rtl, speaker: آرش}
            introduced_tokens: [آرش]
          - content_key: fa.a2.unit10.lesson04.teach.turn03
            kind: dialogue
            target: {text: "چرا؟", language_code: fa, direction: rtl, speaker: نگار}
            introduced_tokens: [چرا]
          - content_key: fa.a2.unit10.lesson04.teach.turn04
            kind: dialogue
            target: {text: "چون تو خونه تمرکز ندارم و دوست دارم همکارامو ببینم.", language_code: fa, direction: rtl, speaker: آرش}
            introduced_tokens: [خونه, ندارم, دوست, دارم, همکارامو, ببینم]
          - content_key: fa.a2.unit10.lesson04.teach.turn05
            kind: dialogue
            target: {text: "باشه، ولی به نظر من ترافیک وقت زیادی می‌گیره.", language_code: fa, direction: rtl, speaker: نگار}
            introduced_tokens: [باشه, ولی, می‌گیره]
          - content_key: fa.a2.unit10.lesson04.teach.turn06
            kind: dialogue
            target: {text: "درسته، ولی من عادت دارم.", language_code: fa, direction: rtl, speaker: آرش}
            introduced_tokens: [درسته, عادت]
        exercises:
          - content_key: fa.a2.unit10.lesson04.exercise01.comprehend_arash_opinion
            type: dialogue_comprehension
            tested_text: "من موافق نیستم"
            prompt:
              target_blocks:
                - {text: "به نظر من دورکاری بهتره. — من موافق نیستم.", language_code: fa, direction: rtl}
                - {text: "Does آرش agree with نگار's opinion about remote work?", language_code: en, direction: ltr}
          - content_key: fa.a2.unit10.lesson04.exercise02.comprehend_arash_reason
            type: dialogue_comprehension
            tested_text: "چون تو خونه تمرکز ندارم و دوست دارم همکارامو ببینم"
            prompt:
              target_blocks:
                - {text: "چون تو خونه تمرکز ندارم و دوست دارم همکارامو ببینم.", language_code: fa, direction: rtl}
                - {text: "What reasons does آرش give for preferring the office?", language_code: en, direction: ltr}
          - content_key: fa.a2.unit10.lesson04.exercise03.recognize_who_prefers_what
            type: multiple_choice
            tested_text: "نگار دورکاری آرش دفتر"
            prompt: {target_blocks: [{text: "Who prefers remote work, and who prefers the office?", language_code: en, direction: ltr}]}
          - content_key: fa.a2.unit10.lesson04.exercise04.order_i_dont_agree
            type: word_order
            tested_text: "من موافق نیستم"
            prompt: {target_blocks: []}
            word_bank: [من, موافق, نیستم]
          - content_key: fa.a2.unit10.lesson04.exercise05.dialogue_response_as_negar
            type: dialogue_response
            tested_text: "باشه ولی به نظر من ترافیک وقت زیادی می‌گیره"
            prompt: {target_blocks: [{text: "چون تو خونه تمرکز ندارم و دوست دارم همکارامو ببینم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit10.lesson04.exercise06.write_debate_summary
            type: writing_prompt
            tested_text: "به نظر من دورکاری بهتره من موافق نیستم"
            prompt: {target_blocks: [{text: "Write down what نگار said, then what آرش said, in their own words.", language_code: en, direction: ltr}]}
