review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Second A2 unit for the fa realization (spine outcome: universal.a2.
    opinions.give_opinions_with_reasons). Own scenario, authored
    independently of the English/Dutch A2 units and of the prs sibling
    realization of this same outcome (not consulted, per AUTHORING_GUIDE
    §8): two Tehran office colleagues, نگار and آرش, debate remote work
    vs. going into the office -- a genuinely contemporary, everyday
    Iranian workplace topic (Tehran traffic is a real, well-known
    everyday grievance, not an invented detail) that naturally produces
    an opinion-plus-reason exchange and a disagreement to respond to,
    exactly what the spine outcome requires. A2-level step-up from A1:
    the به نظر من ... چون ... (in my opinion ... because ...) construction,
    و-joined compound reasons, and a polite-disagreement register
    (من موافق نیستم، ولی...). Every concrete fact (نگار's stated reasons:
    Tehran traffic wastes time, more time with family; آرش's stated
    reasons: no concentration at home, likes seeing colleagues) kept
    consistent across lesson02/03/04 per §11 -- these are personal
    opinions, not objective facts, so exact rephrasing across turns is
    natural conversational variation, not a contradiction, and was
    checked for that distinction specifically. Multi-clause
    accepted_answers lists carry period/comma/و-joined forms per §12
    (see the matching overlay). No fill_in_blank used (§13 n/a). No
    listen_type/listen_select/listen_order or audio-only
    dialogue_comprehension anywhere in this unit per §14 -- every
    exercise has a genuine visible text prompt; a media_assets block is
    declared purely to pre-stage a future recording pass, unreferenced
    by any exercise here. Dialect: continues fa's established Iranian
    register (هستم-family copula, colloquial contractions like بهتره/
    نمی‌کنم), deliberately never Dari forms. Pending fresh-context
    review; left unreviewed per AUTHORING_GUIDE §9.

course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: >-
    Neutral-polite spoken Iranian register for everyday workplace small
    talk between colleagues. Introduces به نظر من ... (in my opinion...)
    as an opinion marker, چون for the supporting reason, and a polite
    disagreement form (من موافق نیستم، ولی...) as the A2-level step up
    from A1's simple preference statements.

