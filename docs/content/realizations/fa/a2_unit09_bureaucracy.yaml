review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    First A2 unit for the fa realization (spine outcome: universal.a2.
    bureaucracy.register_with_authorities). Own scenario, not templated
    from the English or Dutch A2 units or from the prs sibling realization
    of this same outcome (authored independently, sibling files not
    consulted per AUTHORING_GUIDE §8): سارا has moved apartments within
    the same city and needs to update her address on her کارت ملی
    (national ID card) at her local دفتر پیشخوان دولت -- the ubiquitous
    privatized government-services kiosk that actually handles this kind
    of civic-record update in Iran, not an invented institution. A2-level
    step-up from A1: چون (because) subordinate clauses, می‌خواستم as a
    polite softened request form ("I was wanting to...", the natural
    Persian equivalent register-step to English's "I was wondering
    whether"), and می‌شه...؟ indirect polite questions. Housing/phone-
    contact prerequisite vocabulary (خونه, آدرس, وقت گرفتن) is taught
    inline within this unit rather than assumed from a prior A1 unit,
    per universal_spine.yaml's own "a realization may teach prerequisites
    concurrently" allowance -- fa has not yet authored dedicated A1
    housing/communication units. Every fact (moved-in date, required
    documents, deadline, appointment day/time, tracking code) kept
    consistent across lesson02/03/04 per §11. Every multi-clause
    accepted_answers list will carry period/comma/و-joined forms per
    §12 (see the matching en-fa overlay). No fill_in_blank exercises
    used at all, sidestepping §13 entirely. No listen_type/listen_select/
    listen_order or audio-only dialogue_comprehension used anywhere in
    this unit per §14 -- fa has zero real recorded/TTS audio; every
    exercise has a genuine visible text prompt. A media_assets block is
    still declared (phrases + full dialogue) to pre-stage a future
    recording pass via scripts/audio_manifest.py, but nothing in this
    unit's exercises actually references any media_asset_key, so no
    exercise depends on audio existing. Dialect: continues fa's
    established Iranian register (هستم-family copula, ممنون/بفرمایید,
    colloquial -e contractions like "کافیه") -- deliberately never
    Dari's استم/استین forms. Pending fresh-context review; left
    unreviewed per AUTHORING_GUIDE §9 (the author does not self-certify
    review status). Fresh-context review completed 2026-07-06 (no
    sibling-direction files consulted): confirmed spine-outcome
    discipline, exercise pacing (recognition -> drag/matching ->
    production in every lesson), A2-appropriate complexity, script
    purity (zero Arabic-range kaf/yeh), content_key parity in both
    directions, §11 fact consistency, and §16 matching_pairs scale;
    verified dialect authenticity by web search (دفتر پیشخوان دولت,
    چه کمکی از دستم برمیاد, and خونه‌مو عوض کردم all confirmed genuine
    Iranian colloquial usage); ran a Persian-token cumulative-coverage
    script confirming no exercise tests vocabulary before it's taught.
    Fixed one real bug found in the paired en-fa overlay (an internal
    "reading_writing" section-key had leaked into a learner-facing
    teaching-card note) and one §12 gap (the because-clause dialogue
    response's multi-clause accepted_answers had a bare unpunctuated
    variant instead of a genuine period-joined form; replaced it with
    a real period-joined variant so all three of period/comma/و-joined
    forms are present as status:correct). Recompiled clean: 0 errors,
    0 warnings, valid JSON output confirming every exercise has a real
    status:correct accepted answer.

    POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by
    unit13's fresh-context reviewer flagging the same bug in units 11/12)
    found this file also had exercises where realization prompt.target_blocks
    duplicated the overlay's own instruction text verbatim in English -- the
    compiler would have rendered the same sentence twice to the learner. Fixed
    mechanically: every affected exercise's prompt set to target_blocks: [].
    Re-verified validate+compile clean (0 errors/0 warnings) and confirmed
    zero remaining instruction-duplicate target_blocks via a script comparing
    every exercise's target_blocks against its overlay instruction.
    Review 2026-10-20: 0 fixes - Persian spelling, ZWNJ, ezafe,
    punctuation, register (neutral-polite clerk speech), dialogue cards vs
    audio text, word_order banks vs teaching text and multiple-
    choice/comprehension content checked clean. NATIVE FLAGS: the clerk's
    last line mixes colloquial کافیه/خوبه with the written copula in *کد
    پیگیریتون ۲۲۱۴ است* and the notice has the spoken *بیارید*; both are
    plausible clerk speech but a native speaker may prefer *۲۲۱۴ه* /
    *بیاورید*.

course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: >-
    Neutral-polite spoken Iranian register appropriate for dealing with
    a government clerk -- more formal than casual chat with a friend but
    not stiff bureaucratic writing. Introduces چون (because) clauses and
    the softened polite request form می‌خواستم (lit. "I was wanting to",
    used to make a request less blunt) and می‌شه...؟ (lit. "would it be
    possible...?") as the A2-level step up from A1's direct requests.

