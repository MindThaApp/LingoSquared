    language: fa
    text: "نیما: چه ورزشی دوست داری؟ سارا: من شنا دوست دارم. هر هفته سه بار می‌رم استخر. تو چی؟ نیما: من فوتبال دوست دارم. هر روز می‌رم پارک و بازی می‌کنم. سارا: چه خوب! باشگاه هم می‌ری؟ نیما: آره، گاهی می‌رم باشگاه هم. سارا: عالیه!"
