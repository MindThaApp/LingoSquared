generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at the FSI Persian Basic Course source this
    pass (not reused from any prior unit's cached finding -- a genuinely
    new fetch+read this session). Fetched
    https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf (the
    same "Persian Basic Course: Units 1-12," Obolensky/Yazdan Panah/Khaje
    Nouri, FSI/Center for Applied Linguistics, May 1963, PD -- pdfinfo
    confirms Author: US FSI) as a real 398-page PDF, ran pdftotext against
    the full document (OCR text, not clean, but readable), and located
    the actual "TABLE OF CONTENTS" page directly (grep hit at line 298 of
    the extracted text). Re-confirmed the same structural fact prior fa
    units (24/25/26) each independently found: the course's 12 units are
    organized entirely by GRAMMATICAL progression (Unit 1
    pronunciation/spelling/stress; Unit 2 verb endings/prefixes/ezafe;
    Unit 3 pronouns/plural suffix; Unit 4 comparative -tar; Unit 5+
    degrees of politeness, prepositions, tenses, passive voice,
    causatives, imperative, time expressions), never by vocabulary topic.
    Beyond the TOC, ran a full-text grep across the entire 48,644-line
    extracted document for sport/athletic-related English terms (sport,
    football, soccer, volleyball, basketball, tennis, exercise, athlete,
    swim, wrestl(e), game) -- the only two hits were both the pedagogical
    phrase "exercise" (as in grammar drill), not sports vocabulary. No
    unit or drill anywhere in this source teaches sports/exercise
    vocabulary. Given this is now a fourth, independently-confirmed
    structural fact about the source, authored using this project's own
    established fa register/character conventions instead, per
    docs/content/AUTHORING_GUIDE.md's modernization standard -- building
    directly on unit24's own already-taught ورزش/فوتبال/بازی/می‌کنم
    sports-adjacent vocabulary (introduced there for the hobbies outcome)
    rather than re-teaching those words from scratch.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found this unit clean: 0
    compiler errors/warnings (validated together with units 28-32 and
    their overlays), 0 stray YAML boolean coercions (recursive
    yaml.safe_load type scan), no listen_select/listen_type/listen_order
    exercises to check for the same-speaker-distractor bug class (this
    unit deliberately has none, consistent with its own provenance
    note), and both dialogue_response exercises are free-text (no
    distractors, so that bug class doesn't apply). All 8 exercise types
    used here (multiple_choice/matching_pairs/word_order/translation/
    writing_prompt/reading_comprehension/dialogue_comprehension/
    dialogue_response) have a matching case in ExerciseRenderer.tsx.
    Cross-checked every stated fact in the unit (sport frequencies,
    places, who does what) against every other exercise/reading/dialogue
    that touches the same facts -- all mutually consistent, no
    contradictions found. No real bugs found requiring a fix. Original
    authoring notes below, retained for context.

    Draft authored 2026-07-09 by a Sonnet 5 worker task. Realizes
    universal.a1.sports.talk_about_sports_exercise (prerequisite:
    universal.a1.hobbies.describe_free_time_activities, covered by
    unit24 -- reuses its already-taught ورزش/می‌کنم/فوتبال/بازی
    sports-adjacent vocabulary as the unit's own launching point rather
    than re-introducing those words). Fa's next uncovered A1 outcome
    after unit26 (animals) -- confirmed by an exact diff of every
    spine_outcome_id used across all fa realization files (27 distinct
    A1 outcomes covered across units01-26, enumerated via a Python
    yaml.safe_load walk, not a text grep) against every A1-level `id:`
    in docs/content/universal_spine.yaml (35 total A1 ids at this
    spine_version): sports is the next one in spine declaration order
    after animals (both `directions`, merged into unit05 long ago, and
    `transportation`/`technology`/etc. remain uncovered too, but sports
    is the very next id after animals in the spine file's own ordering,
    and animals was itself confirmed the correct next pick in unit26's
    own review notes). Continues the نیما/سارا recurring cast from units
    11-14/23-26. Scoped to: two new named sports (بسکتبال basketball,
    والیبال volleyball, alongside unit24's already-taught فوتبال
    football), شنا (swimming, a new noun/verb-pair with می‌کنم), asking
    which sport someone likes (چه ورزشی دوست داری؟, combining unit24's
    چه with unit14's دوست داری and one genuinely new attributive suffix
    -ی on ورزش), three new places (باشگاه gym, استخر pool, پارک park)
    combined with unit24's already-taught می‌رم (I go) and one new
    3rd-person/2nd-person pair (می‌ره he/she goes, می‌ری you go) built
    the same way unit26 built سگم/سگمه from سگ, a new counter word بار
    (times/occurrences) combined with unit03's already-taught دو/سه for
    frequency (دو بار twice, سه بار three times) alongside review of
    unit11's هر روز and unit24's هر هفته/گاهی, a short reading passage
    about نیما's sports routine, and a closing نیما/سارا dialogue
    comparing which sports they each do, how often, and where.
    Grammatical notes for the fresh-context reviewer: (1) deliberately
    avoided the preposition تو ("in") throughout to sidestep collision
    with the already-taught 2nd-person pronoun تو ("you") -- every
    "go to a place" sentence uses unit24's established
    می‌رم/می‌ره/می‌ری + bare place-name pattern (میرم سینما precedent)
    with no preposition, exactly matching how unit24 itself phrased
    "می‌رم سینما"; (2) می‌ره was already implicitly available from
    unit24's own dialogue reading text ("... گاهی هم فوتبال بازی
    می‌کنه") but not from a می‌رم-family verb specifically, so می‌ره/
    می‌ری are treated as genuinely new here and explicitly taught as
    grammar_notes before their first tested use; (3) هر روز (unit11),
    هر هفته/گاهی/چه/می‌کنم/بازی/فوتبال/ورزش/می‌رم (unit24), دو/سه
    (unit03), دوست داری (unit14), کجا (unit02), و (unit05/14/24/25/26)
    are all re-declared as review tokens at their first use in THIS file
    per the standing per-file untaught-vocabulary gotcha, same as every
    other reused cross-unit word here. Matches the spine outcome's 4
    assessment_requirements exactly (listening via lesson06's
    dialogue_comprehension and lesson05's reading_comprehension --
    reading-visible per the same precedent units 13/24/25/26's
    fresh-context reviews accepted, since audio remains
    pending_generation; speaking via the dialogue_response exercise;
    reading via lesson05's reading_comprehension pair; writing via the
    writing_prompt exercises in lessons05/06). matching_pairs pair
    counts grow across the unit by pooling cumulative in-unit vocabulary
    (4/6/7/8/8/8 pairs, lessons 1-6) per AUTHORING_GUIDE.md #16 --
    lesson01 stays smallest as the genuine first-lesson ceiling, matching
    the unit11/unit12/unit23/unit24/unit25/unit26 precedent for a unit's
    own first lesson. Deliberately zero listen_type/listen_select/
    listen_order exercises anywhere, despite §14's 2026-07-06 revision
    technically permitting fa audio content now that Azure TTS covers
    Farsi -- consistent, documented corpus-wide choice matching units
    17/18/24/25/26 (audio remains pending_generation, not yet a live
    recorded/TTS-backed asset for this specific new content). Not
    self-certified -- needs the mandatory fresh-context review before
    shipping, same as every other Claude-authored fa unit. Per this
    session's standing compiler gotcha (the untaught-vocabulary check is
    per-file only, tested_text scoped): every already-taught word reused
    from an earlier unit is re-declared as an introduced_tokens review
    token at its first tested_text use in THIS file; every teaching-card
    `example:` sentence is exempt from this check (validator only scopes
    tested_text) but was still written to be genuinely comprehensible
    from already-established vocabulary wherever practical. Also
    manually re-verified (per this session's standing YAML
    boolean-coercion gotcha) that no bare yes/no/true/false/on/off value
    appears anywhere in this file via a recursive yaml.safe_load type
    scan, not just a text grep -- see the paired overlay's review notes
    for the combined result across both files.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-14/21-26. Reuses unit02's کجا,
    unit03's دو/سه, unit05's و, unit11's هر روز, unit14's دوست داری,
    unit24's ورزش/می‌کنم/فوتبال/بازی/چه/هر هفته/گاهی/می‌رم family, and
    the نیما/سارا cast without re-teaching the underlying constructions,
    only the new vocabulary that combines with them.

