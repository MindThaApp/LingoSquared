  notes: 'Spine outcome: universal.a2.ongoing.describe_what_is_happening_now. Grammar target: present progressive with داشتن + می‌ present (دارم می‌خونم، داری می‌خونی، داره می‌خونه، داریم می‌خونیم، دارین می‌خونین، دارن می‌خونن), contrasted with the plain present for habits (هر روز کتاب می‌خونم); the progressive is taught in the affirmative only and a negative uses the plain present (الان کتاب نمی‌خونم). Register: casual spoken Tehrani Persian. Characters: established friends Sara (teacher) and Nima (engineer); no job or family facts asserted. Recycles phone calls, household chores and laundry. Every tested word is re-introduced in this unit. Authored without opening any prs file; the Dari progressive (Q3) is not decided here. NATIVE QUESTIONS (each with a recommended answer): (1) Is دارم میام the natural spoken form of “I am on my way”, and is the spelling میام or می‌یام preferred in teaching material? Recommended: keep دارم میام and the corpus spelling میام. (2) Is دارم می‌رسم natural for “I am about to arrive / I am arriving”? Recommended: keep it. (3) Is the plain present الان کتاب نمی‌خونم the right way to teach a negative “not at the moment”, or do speakers say الان دارم کتاب نمی‌خونم? Recommended: keep the plain negative as the taught form. (4) Is داره ظرف‌ها رو می‌شوره correct (می‌شوره, not می‌شورَه) as the 3rd person of شستن in speech? Recommended: keep it. (5) Is همین الان natural as an intensifier before دارم? Recommended: keep it.'
