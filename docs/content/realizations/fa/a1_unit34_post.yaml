generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit, across independent hosts, not just a repeat of the same
    single check. Fetched the Yojik-hosted Spoken Persian Student Text PDF
    (https://fsi-languages.yojik.eu/languages/FSI/Persian/Spoken%20Persian.PDF,
    398 pages) and separately the Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf) and
    searched both for post-office/mail vocabulary (پست, نامه, تمبر, بسته,
    پستچی). Honest result: both PDFs are page-image scans with no usable
    text layer in this environment -- the same finding as unit33's
    provenance note, now independently reconfirmed on a second host rather
    than assumed to still hold. Also checked the Internet Archive item for
    this course (archive.org/details/mike_worldmentoringacademy_03b) for an
    OCR/text derivative; it only offers audio-format downloads (OGG/MP3),
    no searchable text. No FSI phrase or sentence is treated as a confirmed
    source hit for this unit; no source sentence is imported verbatim.
    Authored from this course's established fa conventions instead: modern
    Iranian colloquial register, recurring نیما/سارا cast, and A1
    request/service-counter patterns already used in unit21 (money) and
    unit29 (technology, پیام می‌فرستم) for "want to send" constructions.
    Per the standing fa/prs authoring policy (AUTHORING_GUIDE.md #3), the
    scenario shape (a counter request for a stamp, send vs. receive, an
    arrival-time question) is a legitimate structural reuse of the same
    real-world post-office script prs/a1_unit35_post.yaml already covers for
    Dari, but every word of the actual Farsi text below was authored
    independently for Iranian usage -- no Dari sentence, verb ending, or
    vocabulary choice was copied.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) checked this unit against every
    item on the standing review checklist and found no real bugs to fix. No
    listen_select/listen_type exercises exist in this unit (only
    dialogue_comprehension/dialogue_response/multiple_choice/
    reading_comprehension/matching_pairs/word_order/translation/
    writing_prompt), so the same-speaker-distractor bug class doesn't apply.
    No stray unquoted yes/no/true/false/on/off values in any learner-facing
    field. Every exercise type used has a matching case in
    ExerciseRenderer.tsx. matching_pairs pairs and word_order/accepted_
    answers shapes match exactly between this realization and its overlay.
    lesson04.exercise01's dialogue_comprehension prompt ("نیما می‌گه یه تمبر
    می‌خواد برای یه نامه. سارا می‌گه سه روزه می‌رسه.") is consistently third-
    person throughout, unlike unit33's sibling exercise which had a real
    first-person leftover -- checked specifically for that pattern here and
    found none. Cross-checked every concrete fact stated across all 6 lessons
    (the stamp is for a letter not a package, the letter/package arrives in
    three days, Nima is the one requesting it) for mutual consistency -- no
    contradictions. Every spine_outcome_id resolves to a real
    universal_spine.yaml entry. No internal jargon leaks into learner-facing
    text. The Farsi reads naturally and with consistent colloquial Iranian
    register throughout. Re-validated clean: 0 errors/0 warnings standalone
    and as part of the full 6-unit (33-38) fresh-context review batch.

    Originally authored 2026-07-09 by Claude (content-authoring worker session).
    Realizes universal.a1.post.send_receive_mail, the next unrealized A1
    outcome after unit33. Confirmed by grepping every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files and exact-diffing
    against every universal.a1.* id in docs/content/universal_spine.yaml:
    fa had realized all 34 A1 outcomes through neighborhood, with post,
    cooking, personality, colors, seasons, emergencies, lost_items,
    appointments, and library still missing -- post is the next one in
    spine order. Scoped to the outcome's four assessment requirements:
    understanding a post-office mail exchange (listening), asking for a
    stamp or to send a letter/package (speaking), reading a short mail
    notice (reading), and writing a short mail request (writing). Uses
    structured speaker fields for dialogue turns; no spoken text embeds a
    "Name:" prefix. Every vocabulary card has an example sentence per
    schema 1.1. Already-taught words reused from earlier units (یه, رو,
    می‌خوام, سه, etc.) are re-declared in introduced_tokens before first
    tested use in this file because the compiler's untaught-vocabulary
    check is per-file only. No fill_in_blank or audio-only exercise types
    are used. Every matching_pairs exercise has 7-8 pairs. Every
    translate-into-English exercise in the paired overlay explicitly sets
    answer_language_code: en. Ran a recursive yaml.safe_load scan over this
    file and its paired overlay for bare unquoted yes/no/true/false/on/off
    values -- zero hits (see the overlay's own review note for the exact
    scan result).

    Review 2026-10-21: 0 fixes - Persian checked (script, ZWNJ, register,
    answers vs prompts). NATIVE FLAGS: پستخانه is a written/formal word
    (spoken usually پست‌خونه or اداره پست); kept as taught. Confirm 'سه
    روزه می‌رسه' reads as 'arrives in three days'.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: رو as
    object marker, تو-register dialogue, colloquial copula/verb
    contractions such as می‌رسه/می‌فرسته/باشه, and یه as the colloquial
    form of یک ("a/one"). Uses everyday Iranian post-office words:
    پستخانه, تمبر, نامه, بسته, and می‌فرستم/می‌رسه.

