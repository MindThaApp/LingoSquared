            kind: dialogue
            target: {text: "برای این نامه.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit34.lesson04.teach.dialogue_line4
            kind: dialogue
            target: {text: "باشه، سه روزه می‌رسه.", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit34.lesson04.exercise01.dialogue_comprehension_post
            type: dialogue_comprehension
            tested_text: "نیما سارا سلام یه تمبر می‌خوام برای نامه یا بسته این باشه سه روزه می‌رسه"
            media_asset_key: fa.a1.unit34.audio.dialogue.post.01
            prompt: {target_blocks: [{text: "نیما می‌گه یه تمبر می‌خواد برای یه نامه. سارا می‌گه سه روزه می‌رسه.", language_code: fa, direction: rtl}]}
            correct_option: "The letter arrives in three days."
            distractors:
              - "The package arrives tomorrow."
              - "Sara wants to send a letter."
              - "Nima is buying two stamps."
          - content_key: fa.a1.unit34.lesson04.exercise02.recognize_for_this_letter
            type: multiple_choice
            tested_text: "برای این نامه."
            prompt: {target_blocks: [{text: "برای این نامه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson04.exercise03.match_dialogue_words
            type: matching_pairs
            tested_text: "نیما سارا سلام باشه تمبر نامه بسته"
            prompt: {target_blocks: []}
            pairs:
              - {left: نیما, right: Nima}
              - {left: سارا, right: Sara}
              - {left: سلام, right: hello}
              - {left: باشه, right: okay}
              - {left: تمبر, right: stamp}
              - {left: نامه, right: letter}
              - {left: بسته, right: package}
          - content_key: fa.a1.unit34.lesson04.exercise04.dialogue_response_letter_or_package
