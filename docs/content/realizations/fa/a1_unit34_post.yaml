units:
  - content_key: fa.a1.unit34.post
    title: پستخانه و نامه
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.post.send_receive_mail
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit34.lesson01.post_words
        title: "کلمات پستخانه"
        spine_outcome_id: universal.a1.post.send_receive_mail
        teaching:
          - content_key: fa.a1.unit34.lesson01.teach.postkhane
            kind: vocabulary
            target: {text: پستخانه, language_code: fa, direction: rtl}
            introduced_tokens: [پستخانه]
            example: {text: "پستخانه نزدیکه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit34.lesson01.teach.stamp
            kind: vocabulary
            target: {text: تمبر, language_code: fa, direction: rtl}
            introduced_tokens: [تمبر]
            example: {text: "یه تمبر می‌خوام.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit34.lesson01.teach.letter
            kind: vocabulary
            target: {text: نامه, language_code: fa, direction: rtl}
            introduced_tokens: [نامه]
            example: {text: "یه نامه دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit34.lesson01.teach.package
            kind: vocabulary
            target: {text: بسته, language_code: fa, direction: rtl}
            introduced_tokens: [بسته]
            example: {text: "این بسته سنگینه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit34.lesson01.teach.review_want_for
            kind: grammar_note
            target: {text: "می‌خوام (I want) / برای (for) / این (this)", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌خوام", برای, این]
          - content_key: fa.a1.unit34.lesson01.teach.want_stamp
            kind: phrase
            target: {text: "یه تمبر می‌خوام.", language_code: fa, direction: rtl}
            introduced_tokens: [یه]
        exercises:
          - content_key: fa.a1.unit34.lesson01.exercise01.recognize_postkhane
            type: multiple_choice
            tested_text: پستخانه
            prompt: {target_blocks: [{text: پستخانه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson01.exercise02.recognize_stamp
            type: multiple_choice
            tested_text: تمبر
            prompt: {target_blocks: [{text: تمبر, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson01.exercise03.match_post_words
            type: matching_pairs
            tested_text: "پستخانه تمبر نامه بسته می‌خوام برای این یه"
            prompt: {target_blocks: []}
            pairs:
              - {left: پستخانه, right: "post office"}
              - {left: تمبر, right: stamp}
              - {left: نامه, right: letter}
              - {left: بسته, right: package}
              - {left: "می‌خوام", right: "I want"}
              - {left: برای, right: for}
              - {left: این, right: this}
              - {left: یه, right: "a/one"}
          - content_key: fa.a1.unit34.lesson01.exercise04.word_order_want_stamp
            type: word_order
            tested_text: "یه تمبر می‌خوام"
            prompt: {target_blocks: [{text: "I want a stamp.", language_code: en, direction: ltr}]}
            word_bank: [یه, تمبر, "می‌خوام"]
          - content_key: fa.a1.unit34.lesson01.exercise05.translate_want_stamp
            type: translation
            tested_text: "یه تمبر می‌خوام."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit34.lesson02.send_or_receive
        title: "می‌خوام بفرستم"
        spine_outcome_id: universal.a1.post.send_receive_mail
        teaching:
          - content_key: fa.a1.unit34.lesson02.teach.send_letter
            kind: phrase
            target: {text: "می‌خوام این نامه رو بفرستم.", language_code: fa, direction: rtl}
            introduced_tokens: [بفرستم, رو]
          - content_key: fa.a1.unit34.lesson02.teach.send_package
            kind: phrase
            target: {text: "این بسته رو می‌فرستم.", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌فرستم"]
          - content_key: fa.a1.unit34.lesson02.teach.letter_or_package
            kind: grammar_note
            target: {text: "برای نامه یا بسته؟ = For a letter or a package?", language_code: fa, direction: rtl}
            introduced_tokens: [یا]
          - content_key: fa.a1.unit34.lesson02.teach.review_send_receive
            kind: grammar_note
            target: {text: "فرستادن (to send) / گرفتن (to receive)", language_code: fa, direction: rtl}
            introduced_tokens: [فرستادن, گرفتن]
          - content_key: fa.a1.unit34.lesson02.teach.send_it_today
            kind: phrase
            target: {text: "امروز می‌فرستمش.", language_code: fa, direction: rtl}
            introduced_tokens: [امروز, "می‌فرستمش"]
        exercises:
          - content_key: fa.a1.unit34.lesson02.exercise01.recognize_send_letter
            type: multiple_choice
            tested_text: "می‌خوام این نامه رو بفرستم"
            prompt: {target_blocks: [{text: "می‌خوام این نامه رو بفرستم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson02.exercise02.recognize_letter_or_package
            type: multiple_choice
            tested_text: "برای نامه یا بسته؟"
            prompt: {target_blocks: [{text: "برای نامه یا بسته؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson02.exercise03.match_send_words
            type: matching_pairs
            tested_text: "بفرستم می‌فرستم یا فرستادن گرفتن امروز می‌فرستمش"
            prompt: {target_blocks: []}
            pairs:
              - {left: بفرستم, right: "(I) send"}
              - {left: "می‌فرستم", right: "I'm sending"}
              - {left: یا, right: or}
              - {left: فرستادن, right: "to send"}
              - {left: گرفتن, right: "to receive"}
              - {left: امروز, right: today}
              - {left: "می‌فرستمش", right: "I'm sending it"}
          - content_key: fa.a1.unit34.lesson02.exercise04.word_order_send_package
            type: word_order
            tested_text: "این بسته رو می‌فرستم"
            prompt: {target_blocks: [{text: "I'm sending this package.", language_code: en, direction: ltr}]}
            word_bank: [این, بسته, رو, "می‌فرستم"]
          - content_key: fa.a1.unit34.lesson02.exercise05.translate_send_today
            type: translation
            tested_text: "امروز می‌فرستمش."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit34.lesson03.when_arrives
        title: "کی می‌رسه؟"
        spine_outcome_id: universal.a1.post.send_receive_mail
        teaching:
          - content_key: fa.a1.unit34.lesson03.teach.when_letter_arrives
            kind: phrase
            target: {text: "نامه کی می‌رسه؟", language_code: fa, direction: rtl}
            introduced_tokens: [کی, "می‌رسه"]
          - content_key: fa.a1.unit34.lesson03.teach.package_three_days
            kind: phrase
            target: {text: "بسته سه روزه می‌رسه.", language_code: fa, direction: rtl}
            introduced_tokens: [سه, روزه]
          - content_key: fa.a1.unit34.lesson03.teach.review_day_words
            kind: grammar_note
            target: {text: "روز (day) / فردا (tomorrow)", language_code: fa, direction: rtl}
            introduced_tokens: [روز, فردا]
          - content_key: fa.a1.unit34.lesson03.teach.review_late_early
            kind: grammar_note
            target: {text: "دیر (late) / زود (early)", language_code: fa, direction: rtl}
            introduced_tokens: [دیر, زود]
          - content_key: fa.a1.unit34.lesson03.teach.arrives_tomorrow
            kind: phrase
            target: {text: "فردا می‌رسه.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit34.lesson03.exercise01.recognize_when_letter
            type: multiple_choice
            tested_text: "نامه کی می‌رسه؟"
            prompt: {target_blocks: [{text: "نامه کی می‌رسه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson03.exercise02.recognize_package_three_days
            type: multiple_choice
            tested_text: "بسته سه روزه می‌رسه."
            prompt: {target_blocks: [{text: "بسته سه روزه می‌رسه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson03.exercise03.match_when_words
            type: matching_pairs
            tested_text: "کی می‌رسه روز فردا دیر زود سه"
            prompt: {target_blocks: []}
            pairs:
              - {left: کی, right: when}
              - {left: "می‌رسه", right: "it arrives"}
              - {left: روز, right: day}
              - {left: فردا, right: tomorrow}
              - {left: دیر, right: late}
              - {left: زود, right: early}
              - {left: سه, right: three}
          - content_key: fa.a1.unit34.lesson03.exercise04.word_order_package_arrives
            type: word_order
            tested_text: "بسته سه روزه می‌رسه"
            prompt: {target_blocks: [{text: "The package arrives in three days.", language_code: en, direction: ltr}]}
            word_bank: [بسته, سه, روزه, "می‌رسه"]
          - content_key: fa.a1.unit34.lesson03.exercise05.translate_arrives_tomorrow
            type: translation
            tested_text: "فردا می‌رسه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit34.lesson04.post_dialogue
