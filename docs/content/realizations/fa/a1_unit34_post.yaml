            kind: grammar_note
            target: {text: "نیما / سارا / سلام / باشه", language_code: fa, direction: rtl}
            introduced_tokens: [نیما, سارا, سلام, باشه]
          - content_key: fa.a1.unit34.lesson04.teach.dialogue_line1
            kind: dialogue
            target: {text: "سلام، یه تمبر می‌خوام.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit34.lesson04.teach.dialogue_line2
