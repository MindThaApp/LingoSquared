              - "The letter arrives today."
              - "Nima sends the letter tomorrow."
          - content_key: fa.a1.unit34.lesson05.exercise02.reading_comprehension_arrival
            type: reading_comprehension
            tested_text: "نیما به پستخانه می‌ره. اون یه تمبر می‌خواد برای این نامه. تمبر رو می‌خره و نامه رو می‌فرسته. نامه سه روزه می‌رسه."
            prompt: {target_blocks: [{text: "نیما به پستخانه می‌ره. اون یه تمبر می‌خواد برای این نامه. تمبر رو می‌خره و نامه رو می‌فرسته. نامه سه روزه می‌رسه.", language_code: fa, direction: rtl}]}
            correct_option: "The letter arrives in three days."
            distractors:
              - "The package is heavy."
              - "Nima works at the post office."
              - "Sara sends the package."
          - content_key: fa.a1.unit34.lesson05.exercise03.match_reading_vocab
            type: matching_pairs
            tested_text: "می‌ره اون می‌خواد می‌خره می‌فرسته به و"
            prompt: {target_blocks: []}
            pairs:
