            prompt: {target_blocks: [{text: "نیما به پستخانه می‌ره. اون یه تمبر می‌خواد برای این نامه. تمبر رو می‌خره و نامه رو می‌فرسته. نامه سه روزه می‌رسه.", language_code: fa, direction: rtl}]}
            correct_option: "Nima buys a stamp and sends the letter."
            distractors:
