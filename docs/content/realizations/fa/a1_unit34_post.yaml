            tested_text: "برای این نامه."
            prompt: {target_blocks: [{text: "برای نامه یا بسته؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit34.lesson04.exercise05.translate_okay_three_days
            type: translation
            tested_text: "باشه، سه روزه می‌رسه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit34.lesson05.reading_post
        title: "خواندن درباره‌ی پستخانه"
        spine_outcome_id: universal.a1.post.send_receive_mail
        teaching:
          - content_key: fa.a1.unit34.lesson05.teach.reading_text
            kind: reading
            target: {text: "نیما به پستخانه می‌ره. اون یه تمبر می‌خواد برای این نامه. تمبر رو می‌خره و نامه رو می‌فرسته. نامه سه روزه می‌رسه.", language_code: fa, direction: rtl}
