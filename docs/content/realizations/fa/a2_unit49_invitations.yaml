  notes: 'Spine outcome: universal.a2.social.invite_accept_decline_with_reasons. Grammar target: invitations with می‌خوای / با من میای / با هم بریم; acceptance (آره حتما میام, می‌تونم بیام); declining with an apology, نمی‌تونم بیام and چون + باید / present reason (including a future reason, چون فردا می‌خوام برم شمال); proposing an alternative with ولی and شنبه چطوره؟. Register: casual spoken Tehrani Persian. Characters: Sara and Nima only (friends); no job or family facts asserted. New tokens: دعوت، کنسرت، تئاتر، بریم; تولد is recycled from unit 48. Authored without opening any prs file. NATIVE QUESTIONS: (1) Is با هم بریم تئاتر؟ the most natural spoken way to suggest going together, or would بریم تئاتر؟ without با هم be usual? Recommended: both are fine; the unit teaches with با هم and accepts it dropped. (2) Is ممنون از دعوت a natural short thanks in speech, or should ممنون که دعوتم کردی be taught instead? Recommended: keep ممنون از دعوت (shorter, A2-level); the longer form needs a clitic not yet taught. (3) Is شاید بتونم بیام a natural tentative acceptance, or is ممکنه بتونم بیام more usual? Recommended: keep شاید بتونم بیام. (4) Is یه وقت دیگه (another time) natural when proposing a different day, alongside شنبه چطوره؟ Recommended: yes. (5) Is جمعه شب the natural way to say Friday evening for a concert at eight, rather than جمعه عصر? Recommended: yes, جمعه شب.'
