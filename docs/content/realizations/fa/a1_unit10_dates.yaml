review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit (numbered unit10, not unit09, to avoid a real numbering collision discovered mid-authoring: a separate concurrent session added fa/a1_unit09_time.yaml for a different topic while this file was being written under the same unit09 number -- renumbered this file to the next free A1 slot rather than touch their in-flight file). fa's next uncovered outcome after unit08 (prerequisite: numbers, already covered in unit03). Six lessons: days of the week, months of the Iranian solar calendar, asking today's date, giving a date, asking about a future date, and a dialogue arranging a meeting date. Uses the Iranian Solar Hijri calendar's own Persian-origin month names (فروردین، اردیبهشت، خرداد, etc.) -- deliberately NOT the Dari/Afghan Arabic-derived month names (حمل، ثور، جوزا) used in prs's own a1_unit09_dates.yaml, since Iran and Afghanistan share the same calendar system but use two genuinely different month-name vocabularies. Authored independently of the prs realization per the sibling-isolation rule (read prs's file only to calibrate lesson structure/pacing, not to copy any Persian content, dialogue, or specific dates/facts). Continues unit08's colloquial Tehrani register and -e contraction pattern. Proactively checked against AUTHORING_GUIDE §11-13 during authoring. Audio remains pending generation. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, discovered this unit was missed by the earlier project-wide audit -- it was authored but never actually reviewed): found 7 exercises (lesson01.exercise03, lesson02.exercise03, lesson03.exercise03, lesson04.exercise03/06, lesson05.exercise03, lesson06.exercise05) were listen_type or bare-prompt listen_select items -- genuinely unanswerable since fa has zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (visible Farsi prompt, English glosses), listen_type -> translation. MATCHING_PAIRS SCALE (§16) CHECK: all 6 matching_pairs exercises (7/10/9/11/8/9 pairs) already reasonably sized -- no changes needed. Re-verified 0 remaining §14 violations, validate+compile both clean. STILL NEEDS the standing fresh-context review before status can move to reviewed -- dispatching now. FRESH-CONTEXT REVIEW 2026-07-06 (§9, zero prior access to this content, sibling prs unit never opened): verified spine-outcome discipline, exercise pacing, dialect/calendar authenticity, script purity (no Arabic-range kaf/yeh), no jargon leaks, content_key parity, and prompt-shows-answer risk -- all passed as authored. Found and fixed four real bugs: (1) a §11 cross-lesson date-arithmetic contradiction -- lesson04 stated Thursday=10th of Ordibehesht while lesson06's dialogue stated Tuesday=7th, but 7th-to-10th is 3 days so 7th must be Monday, not Tuesday; corrected lesson06's date throughout (dialogue, media_assets text, teach.haftom renamed to teach.hashtom, and every dependent exercise) to Tuesday=8th, which is arithmetically consistent with lesson04's Thursday=10th; (2) a §14 audio-accessibility gap the earlier retrofit missed -- lesson06.exercise01 (dialogue_comprehension) had empty prompt.target_blocks and a pending_generation media_asset_key the compiler never wires to audio_text for this exercise type, making it silently unanswerable; added the full dialogue transcript as visible target_blocks text and changed the instruction from listening to reading; (3) a §5 instruction/answer mismatch in lesson02.exercise06 (grammar_check) which asked the learner to 'confirm' a sentence but required retyping it verbatim with no options -- converted to a real closed yes/no question; (4) two untaught-vocabulary bugs caught by a purpose-built Python tokenizer script cross-checking every exercise's tested_text/accepted_answers/pairs/word_bank against cumulative introduced_tokens per lesson: تاریخ (date) and و (and) were each tested before being taught -- added a lesson04 vocabulary card for تاریخ and a lesson06 vocabulary card for و, and simplified one matching-pair gloss that had introduced untaught 3rd-person morphology (سرش) to plain English. Also added the missing §12 comma-joined and period-joined multi-clause variants for two exercises. Re-ran validate + compile after all fixes: 0 errors/0 warnings, valid JSON output confirmed. POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by unit13's fresh-context reviewer flagging the same bug in units 11/12) found this file also had exercises where realization prompt.target_blocks duplicated the overlay's own instruction text verbatim in English -- the compiler would have rendered the same sentence twice to the learner. Fixed mechanically: every affected exercise's prompt set to target_blocks: []. Re-verified validate+compile clean (0 errors/0 warnings) and confirmed zero remaining instruction-duplicate target_blocks via a script comparing every exercise's target_blocks against its overlay instruction.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 11 kind:vocabulary teaching cards (3 merged day-pair cards each given a 2-item list per §19's merged-card guidance), each a natural, comprehensible-from-gloss sentence using the card's own word(s). schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    2026-07-07: §19 FRESH-CONTEXT REVIEW of the 11 example entries added in the retrofit above (supplemental check only -- spine outcome/pacing/date-arithmetic/etc. already settled and out of scope). Verified all 3 merged day-pair list cards (shanbe_yekshanbe, doshanbe_seshanbe, chaharshanbe_panjshanbe) have each list item positionally matching its own corresponding day in the merged target's word list (e.g. doshanbe_seshanbe's example[0] demonstrates دوشنبه and example[1] demonstrates سه‌شنبه, matching target order) -- all correct, no cross-wiring found. This file's own register_policy continues unit08's colloquial -e contraction pattern (already visible in this same file's own چندشنبه‌ست، سه‌شنبه‌ست، اردیبهشته، هشتمه), yet 8 of the 11 examples used formal است or literary آمدم/چیست instead -- a systematic register clash with this unit's own established, already-reviewed dialogue and phrases. Fixed: shanbe_yekshanbe's both list items (امروز شنبه است / فردا یکشنبه است -> شنبه‌ست / یکشنبه‌ست), jome (جمعه تعطیل است -> تعطیله), farvardin (سال است -> ساله), ordibehesht (هوا خوب است -> خوبه), khordad (به دنیا آمدم -> اومدم, matching this course's established ا->و colloquial shift precedent from بارونی/تهرون), lesson03's today_word (امروز چندم است؟ -> چندمه؟), tarikh_word (چیست؟ -> چیه؟), and hashtom (امروز هشتم است -> هشتمه). doshanbe_seshanbe, chaharshanbe_panjshanbe, and va_and's examples needed no change -- already colloquial and register-consistent. Verified all fixed/unchanged examples contain their card's target word(s), are 2+ words with real structure, are comprehensible from their unchanged glosses, and aren't duplicated or contradictory elsewhere in the file. Re-ran validate+compile after fixes: 0 errors/0 warnings, compiles to valid JSON, all 11 example entries present in the compiled output."

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues unit08's neutral-polite spoken register and colloquial -e
    contraction pattern. Uses the Iranian Solar Hijri (Persian) calendar's
    own month names (فروردین، اردیبهشت، خرداد, etc.), genuinely used
    throughout Iran for everyday dates, as distinct from the Dari/Afghan
    month-name set. Weekend framing follows Iranian convention (جمعه as
    the traditional weekly day off).

