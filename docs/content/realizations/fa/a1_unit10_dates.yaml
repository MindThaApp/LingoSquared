units:
  - content_key: fa.a1.unit10.dates
    title: روزها و تاریخ
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.dates.exchange_calendar_dates
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit10.lesson01.days_of_the_week
        title: روزهای هفته
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: fa.a1.unit10.lesson01.teach.shanbe_yekshanbe
            kind: vocabulary
            target: {text: "شنبه، یکشنبه", language_code: fa, direction: rtl}
            introduced_tokens: [شنبه, یکشنبه]
            example:
              - {text: "امروز شنبه‌ست.", language_code: fa, direction: rtl}
              - {text: "فردا یکشنبه‌ست.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit10.lesson01.teach.doshanbe_seshanbe
            kind: vocabulary
            target: {text: "دوشنبه، سه‌شنبه", language_code: fa, direction: rtl}
            introduced_tokens: [دوشنبه, سه‌شنبه]
            example:
              - {text: "دوشنبه کلاس دارم.", language_code: fa, direction: rtl}
              - {text: "سه‌شنبه قرار دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe
            kind: vocabulary
            target: {text: "چهارشنبه، پنجشنبه", language_code: fa, direction: rtl}
            introduced_tokens: [چهارشنبه, پنجشنبه]
            example:
              - {text: "چهارشنبه کار می‌کنم.", language_code: fa, direction: rtl}
              - {text: "پنجشنبه می‌بینمت.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit10.lesson01.teach.jome
            kind: vocabulary
            target: {text: جمعه, language_code: fa, direction: rtl}
            introduced_tokens: [جمعه]
            example: {text: "جمعه تعطیله.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit10.lesson01.teach.weekend_note
            kind: cultural_note
            target: {text: "جمعه روز تعطیل هفتگیه", language_code: fa, direction: rtl}
            introduced_tokens: [روز, تعطیل, هفتگیه]
        exercises:
          - content_key: fa.a1.unit10.lesson01.exercise01.recognize_shanbe
            type: multiple_choice
            tested_text: شنبه
            prompt: {target_blocks: [{text: شنبه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit10.lesson01.exercise02.recognize_jome
            type: multiple_choice
            tested_text: جمعه
            prompt: {target_blocks: [{text: جمعه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit10.lesson01.exercise03.recognize_doshanbe_reading
            type: multiple_choice
            tested_text: دوشنبه
            prompt: {target_blocks: [{text: دوشنبه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit10.lesson01.exercise04.match_days
            type: matching_pairs
            tested_text: شنبه یکشنبه دوشنبه سه‌شنبه چهارشنبه پنجشنبه جمعه
            prompt: {target_blocks: []}
            pairs:
              - {left: شنبه, right: Saturday}
              - {left: یکشنبه, right: Sunday}
              - {left: دوشنبه, right: Monday}
              - {left: سه‌شنبه, right: Tuesday}
              - {left: چهارشنبه, right: Wednesday}
              - {left: پنجشنبه, right: Thursday}
              - {left: جمعه, right: Friday}
          - content_key: fa.a1.unit10.lesson01.exercise05.order_days_sequence
            type: word_order
            tested_text: شنبه یکشنبه دوشنبه
            prompt: {target_blocks: []}
            word_bank: [شنبه, یکشنبه, دوشنبه]
          - content_key: fa.a1.unit10.lesson01.exercise06.translate_friday
            type: translation
            tested_text: جمعه
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit10.lesson01.exercise07.write_wednesday
            type: writing_prompt
            tested_text: چهارشنبه
            prompt: {target_blocks: []}

