review:
  status: unreviewed
  required_next_reviewer: claude
  notes: "New unit (numbered unit10, not unit09, to avoid a real numbering collision discovered mid-authoring: a separate concurrent session added fa/a1_unit09_time.yaml for a different topic while this file was being written under the same unit09 number -- renumbered this file to the next free A1 slot rather than touch their in-flight file). fa's next uncovered outcome after unit08 (prerequisite: numbers, already covered in unit03). Six lessons: days of the week, months of the Iranian solar calendar, asking today's date, giving a date, asking about a future date, and a dialogue arranging a meeting date. Uses the Iranian Solar Hijri calendar's own Persian-origin month names (فروردین، اردیبهشت، خرداد, etc.) -- deliberately NOT the Dari/Afghan Arabic-derived month names (حمل، ثور، جوزا) used in prs's own a1_unit09_dates.yaml, since Iran and Afghanistan share the same calendar system but use two genuinely different month-name vocabularies. Authored independently of the prs realization per the sibling-isolation rule (read prs's file only to calibrate lesson structure/pacing, not to copy any Persian content, dialogue, or specific dates/facts). Continues unit08's colloquial Tehrani register and -e contraction pattern. Proactively checked against AUTHORING_GUIDE §11-13 during authoring. Audio remains pending generation."

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues unit08's neutral-polite spoken register and colloquial -e
    contraction pattern. Uses the Iranian Solar Hijri (Persian) calendar's
    own month names (فروردین، اردیبهشت، خرداد, etc.), genuinely used
    throughout Iran for everyday dates, as distinct from the Dari/Afghan
    month-name set. Weekend framing follows Iranian convention (جمعه as
    the traditional weekly day off).

