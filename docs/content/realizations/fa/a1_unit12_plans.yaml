        title: رد کردن برنامه
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - content_key: fa.a1.unit12.lesson04.teach.motasefam_word
            kind: vocabulary
            target: {text: متأسفم, language_code: fa, direction: rtl}
            introduced_tokens: [متأسفم]
