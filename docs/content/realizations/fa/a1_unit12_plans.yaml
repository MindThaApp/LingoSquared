            type: multiple_choice
            tested_text: نمی‌تونم
            prompt: {target_blocks: [{text: نمی‌تونم, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit12.lesson04.exercise03.match_declining_phrases
            type: matching_pairs
            tested_text: "متأسفم نمی‌تونم کار دارم برنامه"
            prompt: {target_blocks: []}
            pairs:
              - {left: متأسفم, right: "I'm sorry"}
              - {left: نمی‌تونم, right: "I can't"}
              - {left: "کار دارم", right: "I have things to do"}
              - {left: کار, right: work}
              - {left: دارم, right: "I have"}
              - {left: برنامه, right: plan}
