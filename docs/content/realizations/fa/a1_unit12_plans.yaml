            type: translation
            tested_text: "متأسفم، نمی‌تونم"
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit12.lesson04.exercise06.dialogue_response_decline
            type: dialogue_response
            tested_text: "متأسفم، نمی‌تونم. کار دارم"
            prompt:
              target_blocks:
                - {text: "A friend proposed going to the movies on Thursday, but you're busy. Decline politely.", language_code: en, direction: ltr}

