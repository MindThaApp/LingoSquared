            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a1.unit12.lesson04.exercise01.recognize_motasefam_reading
            type: multiple_choice
            tested_text: متأسفم
            prompt: {target_blocks: [{text: متأسفم, language_code: fa, direction: rtl}]}
