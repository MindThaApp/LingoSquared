            type: dialogue_comprehension
            tested_text: "سارا می‌خوای پنجشنبه بریم سینما چه ساعتی ساعت هشت شب باشه عالیه قبوله خوبه پنجشنبه می‌بینمت"
            prompt:
              target_blocks:
                - {text: "آرش: سارا، می‌خوای پنجشنبه بریم سینما؟ سارا: چه ساعتی؟ آرش: ساعت هشت شب. سارا: باشه، عالیه! قبوله. آرش: خوبه، پنجشنبه می‌بینمت.", language_code: fa, direction: rtl}
