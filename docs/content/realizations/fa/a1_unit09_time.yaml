review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context review, 2026-07-06. Checked spine-outcome discipline
    against universal.a1.time.ask_tell_time's own assessment_requirements
    (understand a spoken time, ask for + state a time, read a schedule
    time, write a time expression) -- all covered across the six lessons,
    no drift into unrelated grammar. Exercise pacing verified recognition
    -> drag/matching -> production in every one of the 6 lessons (after
    fixes below). Verified dialect authenticity against
    fa_IR_standard_colloquial_intro: ساعت چنده؟ (contraction of چند است)
    is the genuine everyday colloquial way to ask the time; ساعت سه و
    نیمه and the نیمه contraction of نیم است follow the same -e/-ye
    pattern already established in unit07/unit08 (آفتابیه، تومنه);
    صبح/ظهر/عصر/شب is the correct natural division of the day, with ظهر
    genuinely meaning midday/noon distinct from عصر (afternoon); قرار is
    the natural word for an arranged appointment; یکم دیر می‌شه is
    genuine casual spoken Persian for "I'll be a bit late." Nothing read
    as invented, stilted, or translation-calqued. Cross-checked every
    concrete fact per §11 (appointment = 4pm, confirmed afternoon not
    morning, Negar's actual arrival = 4:15pm, reason = running a little
    late from work) across every exercise/teaching card/dialogue turn in
    lesson06 -- fully consistent throughout. No fill_in_blank exercises
    exist (§13 n/a). Ran a systematic Python token-coverage script
    (tokenizing on Persian-range letters only) checking every exercise's
    tested_text/word_bank/pairs against cumulative introduced_tokens --
    zero real gaps (two apparent hits were punctuation-tokenization
    false positives, resolved). Grepped for Arabic-range kaf (U+0643) and
    yeh (U+064A): none found, script is pure Persian range throughout.
    No unquoted YAML booleans in learner-facing fields. No internal
    jargon leaks found in any learner-facing string. No dated
    FSI/Peace-Corps register remaining -- content reads as modern
    spoken Persian. content_key parity confirmed exact both directions
    (teaching and exercises) both before and after fixes.

    Found and fixed 3 real bugs: (1) Two listen_type exercises
    (lesson03's then-exercise06, lesson06's then-exercise05) had a bare
    empty prompt with NO media_asset_key at all -- not just untested
    audio, genuinely zero prompt content, violating AUTHORING_GUIDE §14
    (no listen_type/audio-only exercises for fa without real recorded
    audio). Converted both to `translation` type with a real English
    prompt, renamed content_keys to translate_three_half/
    translate_arrival_time (overlay updated to match, parity
    reconfirmed). (2) Four multiple_choice exercises
    (lesson02.exercise01, lesson03.exercise01, lesson05.exercise01,
    lesson05.exercise02) displayed the exact target Farsi phrase in the
    prompt AND repeated it verbatim as the correct_option among
    Farsi-language distractors -- the identical "prompt literally shows
    the correct answer" bug class already found and fixed six times
    elsewhere in this project, confirmed via the actual compiled JSON.
    Fixed by converting correct_option/distractors/accepted_answers to
    English meaning-glosses (matching the already-correct
    recognize_sobh/recognize_asr pattern within this same file), and
    updating instructions to "What does this phrase/sentence mean?".
    (3) §12: write_meeting_time_summary only had period-joined and
    و-joined accepted_answers forms -- added the missing comma-joined
    form. Also applied the AUTHORING_GUIDE §15 target-language-asterisk
    convention to the feedback fields directly rewritten during these
    fixes (not a blanket file-wide retrofit, which the guide doesn't
    require for untouched content). Both `validate` and `compile`
    re-run after fixes: 0 errors, 0 warnings, compiles clean end to
    end -- spot-checked the actual compiled JSON for the renamed/fixed
    exercises to confirm the fix landed correctly, not just that the
    schema validated. Audio remains pending generation.

    AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this
    review completed): a project-wide audit found 5 more bare-prompt
    listen_select exercises remained in this unit (lesson01.exercise03,
    lesson02.exercise03, lesson03.exercise03, lesson04.exercise03,
    lesson05.exercise03) beyond the 2 listen_type ones this review
    already fixed. Converted all 5 to multiple_choice: added the target
    Farsi text as a real visible prompt, converted correct_option/
    distractors to English glosses (to avoid re-introducing the
    prompt-shows-answer bug), renamed content_keys to
    recognize_*_reading. Re-verified 0 remaining §14 violations via
    script, content_key parity intact, `validate`+`compile` both clean
    after the retrofit.

    MATCHING_PAIRS SCALE RETROFIT 2026-07-06 (§16, Ramin's direct
    feedback that 2-3 pair exercises are too small): match_time_question
    and match_time_telling each had only ONE pair (barely a matching
    exercise at all) -- expanded both by pooling lesson01's four time
    words (ساعت/دقیقه/نیم/ربع, already taught) to 5 pairs each.
    match_appointment_phrases expanded 2->6 (pooled قرار plus lesson04's
    three parts-of-day words). Left match_time_words (4) and
    match_parts_of_day (4) at their existing counts and
    match_dialogue_facts (2) unchanged -- checked and no further
    genuinely-taught, on-topic vocabulary exists to pool into these
    without violating §16's own anti-padding rule. Re-verified
    validate+compile clean after these additions.

    POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by
    unit13's fresh-context reviewer flagging the same bug in units 11/12)
    found this file also had exercises where realization prompt.target_blocks
    duplicated the overlay's own instruction text verbatim in English -- the
    compiler would have rendered the same sentence twice to the learner. Fixed
    mechanically: every affected exercise's prompt set to target_blocks: [].
    Re-verified validate+compile clean (0 errors/0 warnings) and confirmed
    zero remaining instruction-duplicate target_blocks via a script comparing
    every exercise's target_blocks against its overlay instruction.


    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added a real example
    sentence to all 10 kind:vocabulary teaching cards, each a natural,
    comprehensible-from-gloss sentence using the card's own word.
    schema_version bumped to 1.1. Example sentences are Claude-authored and
    pending fresh-context review.

    2026-07-07: §19 FRESH-CONTEXT REVIEW of the 10 example sentences added
    in the retrofit above (supplemental check only -- spine outcome/pacing/
    etc. already settled and out of scope). This file's own register_policy
    explicitly requires everyday spoken colloquial time forms (ساعت چنده؟،
    سه‌ونیمه) rather than formal written constructions. Found 4 of the 10
    examples violated this: hour_word (ساعت چند است؟ -> ساعت چنده؟, directly
    contradicting the phrase this same lesson's next card teaches verbatim
    in the correct register), half_word (ساعت هفت و نیم است -> نیمه, per
    this file's own taught نیمه = نیم است contraction), quarter_word (ساعت
    یک ربع به هشت است -> هشته, same -e pattern), and sobh (صبح زود بیدار
    می‌شوم -> می‌شم, matching this file's own می‌شه/می‌بینمت colloquial verb
    contractions rather than the literary می‌شوم). The other 6 examples
    (minute_word, zohr, asr, shab, appointment_word, tomorrow_review) used
    verbs with no established colloquial contraction (می‌خورم، می‌کنم،
    دارم, etc.) and needed no change. Verified all 10 fixed/unchanged
    examples contain their card's target word, are 2+ words with real
    structure, are comprehensible from their unchanged glosses, and aren't
    duplicated elsewhere in the file. Re-ran validate+compile after fixes:
    0 errors/0 warnings, compiles to valid JSON, all 10 examples present in
    the compiled output.

    Review 2026-10-21 (en-fa A1 language review r1): 1 fix - ZWNJ restored in میشه to می‌شه (teaching tokens, exercise text, word bank, dialogue audio text; audio stays pending_generation). NATIVE FLAGS: naturalness of چون از سر کار یکم دیر می‌شه for being late leaving work.
course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues unit01's neutral-polite spoken register and the colloquial
    -e/-ye contraction pattern already established (e.g. آفتابیه، گرمه).
    Time expressions use the everyday spoken colloquial forms (ساعت چنده؟،
    سه‌ونیمه) rather than formal written Persian time constructions.

