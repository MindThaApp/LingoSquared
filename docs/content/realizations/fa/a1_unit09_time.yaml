            tested_text: ساعت سه و نیمه
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit09.lesson03.exercise07.speak_tell_time
            type: speak_response
            tested_text: ساعت سه و نیمه
            prompt: {target_blocks: []}

