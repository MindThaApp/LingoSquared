units:
  - content_key: fa.a1.unit09.time
    title: ساعت و زمان
    section: speaking
    spine_outcome_ids:
      - universal.a1.time.ask_tell_time
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit09.lesson01.basic_time_vocabulary
        title: کلمات پایه دربارهٔ ساعت
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - content_key: fa.a1.unit09.lesson01.teach.hour_word
            kind: vocabulary
            target: {text: ساعت, language_code: fa, direction: rtl}
            introduced_tokens: [ساعت]
            example: {text: "ساعت چنده؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit09.lesson01.teach.minute_word
            kind: vocabulary
            target: {text: دقیقه, language_code: fa, direction: rtl}
            introduced_tokens: [دقیقه]
            example: {text: "پنج دقیقه صبر کن.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit09.lesson01.teach.half_word
            kind: vocabulary
            target: {text: نیم, language_code: fa, direction: rtl}
            introduced_tokens: [نیم]
            example: {text: "ساعت هفت و نیمه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit09.lesson01.teach.quarter_word
            kind: vocabulary
            target: {text: ربع, language_code: fa, direction: rtl}
            introduced_tokens: [ربع]
            example: {text: "ساعت یک ربع به هشته.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit09.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a1.unit09.lesson01.exercise01.recognize_hour
            type: multiple_choice
            tested_text: ساعت
            prompt: {target_blocks: [{text: ساعت, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit09.lesson01.exercise02.recognize_half
            type: multiple_choice
            tested_text: نیم
            prompt: {target_blocks: [{text: نیم, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit09.lesson01.exercise03.recognize_rob_reading
            type: multiple_choice
            tested_text: ربع
            prompt: {target_blocks: [{text: ربع, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit09.lesson01.exercise04.match_time_words
            type: matching_pairs
            tested_text: ساعت دقیقه نیم ربع
            prompt: {target_blocks: []}
            pairs:
              - {left: ساعت, right: "hour / clock"}
              - {left: دقیقه, right: minute}
              - {left: نیم, right: half}
              - {left: ربع, right: quarter}
          - content_key: fa.a1.unit09.lesson01.exercise05.order_time_words
            type: word_order
            tested_text: نیم و ربع
            prompt: {target_blocks: []}
            word_bank: [نیم, و, ربع]
          - content_key: fa.a1.unit09.lesson01.exercise06.translate_quarter
            type: translation
            tested_text: ربع
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit09.lesson01.exercise07.write_minute
            type: writing_prompt
            tested_text: دقیقه
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit09.lesson02.asking_the_time
        title: پرسیدن ساعت
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - content_key: fa.a1.unit09.lesson02.teach.what_time_question
            kind: phrase
            target: {text: "ساعت چنده؟", language_code: fa, direction: rtl}
            introduced_tokens: [ساعت, چنده]
          - content_key: fa.a1.unit09.lesson02.teach.contraction_note
            kind: grammar_note
            target: {text: "چنده = چند است (محاوره‌ای)", language_code: fa, direction: rtl}
            introduced_tokens: [چند, است]
        exercises:
          - content_key: fa.a1.unit09.lesson02.exercise01.recognize_what_time
            type: multiple_choice
            tested_text: ساعت چنده
            prompt: {target_blocks: [{text: "ساعت چنده؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit09.lesson02.exercise02.recognize_chande_meaning
            type: multiple_choice
            tested_text: چنده
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit09.lesson02.exercise03.recognize_what_time_reading
