              - {left: چند, right: "how much / how many"}
          - content_key: fa.a1.unit09.lesson02.exercise05.order_what_time
            type: word_order
            tested_text: ساعت چنده
            prompt: {target_blocks: []}
            word_bank: [ساعت, چنده]
          - content_key: fa.a1.unit09.lesson02.exercise06.translate_what_time
            type: translation
            tested_text: ساعت چنده
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit09.lesson02.exercise07.speak_ask_time
            type: speak_response
            tested_text: ساعت چنده
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit09.lesson03.telling_the_time
        title: گفتن ساعت
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - content_key: fa.a1.unit09.lesson03.teach.three_oclock_half
            kind: phrase
            target: {text: "ساعت سه و نیمه", language_code: fa, direction: rtl}
            introduced_tokens: [سه, و, نیمه]
          - content_key: fa.a1.unit09.lesson03.teach.contraction_note2
            kind: grammar_note
            target: {text: "نیمه = نیم است (محاوره‌ای)", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit09.lesson03.exercise01.recognize_three_half
            type: multiple_choice
            tested_text: ساعت سه و نیمه
            prompt: {target_blocks: [{text: "ساعت سه و نیمه", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit09.lesson03.exercise02.recognize_half_meaning
            type: multiple_choice
            tested_text: نیمه
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit09.lesson03.exercise03.recognize_time_telling_reading
            type: multiple_choice
            tested_text: ساعت سه و نیمه
            prompt: {target_blocks: [{text: "ساعت سه و نیمه", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit09.lesson03.exercise04.match_time_telling
            type: matching_pairs
            tested_text: ساعت سه و نیمه چنده ساعت دقیقه
            prompt: {target_blocks: []}
            pairs:
              - {left: "ساعت سه و نیمه", right: "It's three-thirty."}
              - {left: "ساعت چنده؟", right: "What time is it?"}
              - {left: ساعت, right: "hour / clock"}
              - {left: دقیقه, right: minute}
