            prompt: {target_blocks: [{text: after that, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson03.exercise03.match_direction_words
            type: matching_pairs
            tested_text: مستقیم برید بعد سمت راست چپ
