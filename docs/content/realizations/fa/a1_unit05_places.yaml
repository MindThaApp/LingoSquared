schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
status: complete_draft
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Vocabulary scope (hotel, restaurant, basic directions) inspired by the
    public-domain 1963 FSI "Persian Basic Course, Units 1-12" (Foreign
    Service Institute, Department of State; reprinted by the Center for
    Applied Linguistics). No sentences copied verbatim — fully re-authored
    in natural contemporary colloquial Tehrani Persian with a new scenario
    and characters, per docs/content/AUTHORING_GUIDE.md §10's mandatory
    modernization requirement. The 1963 source used formal diplomatic
    register and a phonetic transcription, not real Persian script.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context Codex review completed 2026-07-05. Persian wording and
    register are native-quality after scoped corrections. The review fixed
    dialogue audio wiring, single-turn overlay metadata, an exposed Latin
    transliteration, premature distractors, and several inaccurate or
    overly technical learner notes. Script purity and unit-only/combined
    compiler validation pass with zero errors and zero warnings.

    AUDIO-ACCESSIBILITY (§14) CHECK 2026-07-06: this unit has zero
    listen_type/bare-listen_select exercises -- already compliant.
    MATCHING_PAIRS SCALE RETROFIT (§16, same day, Ramin's direct
    feedback): expanded match_places 3->5 (pooled اینجا/اونجا, taught
    in this same lesson), match_sides 4->7 (pooled lesson01's
    هتل/رستوران/دستشویی), and match_dialogue_lines 4->6 (pooled
    کنار/همون, taught in this same lesson). Re-verified validate+compile
    clean after these additions.

    POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by
    unit13's fresh-context reviewer flagging the same bug in units 11/12)
    found this file also had exercises where realization prompt.target_blocks
    duplicated the overlay's own instruction text verbatim in English -- the
    compiler would have rendered the same sentence twice to the learner. Fixed
    mechanically: every affected exercise's prompt set to target_blocks: [].
    Re-verified validate+compile clean (0 errors/0 warnings) and confirmed
    zero remaining instruction-duplicate target_blocks via a script comparing
    every exercise's target_blocks against its overlay instruction.


    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added a real example
    sentence to all 12 kind:vocabulary teaching cards, each a natural,
    comprehensible-from-gloss sentence using the card's own word.
    schema_version bumped to 1.1. Example sentences are Claude-authored and
    pending fresh-context review.

    2026-07-07: Fresh-context §19 example review (this unit's 12 new example
    sentences only, not a full unit re-review). Checked each against register
    match to this unit's own established neutral-polite-spoken default
    (register_policy: "matching units 01-02"), presence of the card's own
    word, real sentence structure, gloss accuracy (all 12 verified correct,
    no mismatches), and script purity (no Arabic-range kaf/yeh codepoints -- confirmed
    clean). Found and fixed 4 register mismatches: hotel/restoran/kenar/azadi
    used the unlabeled formal است copula -- converted to the established -ه
    spoken contraction (نزدیکه، خوبه، رستورانه، معروفه), with kenar's fix
    directly validated against this same unit's own lesson04 dialogue line
    ("هتل کنار همون رستورانه"). The other 8 examples (dastshooyi, samt, rast,
    chap, mostaghim, berid, bad, hamoon) were already correctly in spoken/
    polite register and needed no change -- berid's برید سمت راست and
    hamoon's همون رستوران خوبه in particular were already exactly right.
    All fixes are meaning-preserving; no overlay gloss changes were needed.
    Re-validated clean (0 errors/0 warnings) after fixes.
course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Teach ordinary neutral-polite spoken Iranian Farsi as the default,
    matching units 01-02. Label formal-written and informal alternatives
    explicitly rather than mixing registers inside one exchange.

