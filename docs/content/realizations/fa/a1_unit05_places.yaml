units:
  - content_key: fa.a1.unit05.places_and_directions
    title: مکان‌ها و آدرس دادن
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.places.locate_common_places
      - universal.a1.directions.ask_follow_basic_directions
    planned_lesson_count: 4
    lessons:
      - content_key: fa.a1.unit05.lesson01.hotel_restaurant
        title: هتل و رستوران
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - content_key: fa.a1.unit05.lesson01.teach.hotel
            kind: vocabulary
            target: {text: هتل, language_code: fa, direction: rtl}
            introduced_tokens: [هتل]
            example: {text: "هتل ما نزدیکه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson01.teach.restoran
            kind: vocabulary
            target: {text: رستوران, language_code: fa, direction: rtl}
            introduced_tokens: [رستوران]
            example: {text: "این رستوران خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson01.teach.dastshooyi
            kind: vocabulary
            target: {text: دستشویی, language_code: fa, direction: rtl}
            introduced_tokens: [دستشویی]
            example: {text: "دستشویی کجاست؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson01.teach.inja_oonja
            kind: phrase
            target: {text: اینجا، اونجا, language_code: fa, direction: rtl}
            introduced_tokens: [اینجا, اونجا]
          - content_key: fa.a1.unit05.lesson01.teach.kojast
            kind: phrase
            target: {text: هتل کجاست؟, language_code: fa, direction: rtl}
            introduced_tokens: [هتل, کجاست]
          - content_key: fa.a1.unit05.lesson01.teach.bebakhshid
            kind: phrase
            target: {text: ببخشید، هتل کجاست؟, language_code: fa, direction: rtl}
            introduced_tokens: [ببخشید, هتل, کجاست]
        exercises:
          - content_key: fa.a1.unit05.lesson01.exercise01.choose_hotel
            type: multiple_choice
            tested_text: هتل
            prompt: {target_blocks: [{text: hotel, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson01.exercise02.choose_restoran
            type: multiple_choice
            tested_text: رستوران
            prompt: {target_blocks: [{text: restaurant, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson01.exercise03.match_places
            type: matching_pairs
            tested_text: هتل رستوران دستشویی اینجا اونجا
            prompt: {target_blocks: []}
            pairs: [{left: هتل, right: hotel}, {left: رستوران, right: restaurant}, {left: دستشویی, right: restroom}, {left: اینجا, right: here}, {left: اونجا, right: there}, {left: "هتل کجاست؟", right: "Where is the hotel?"}]
          - content_key: fa.a1.unit05.lesson01.exercise04.order_bebakhshid
            type: word_order
            tested_text: ببخشید هتل کجاست
            prompt: {target_blocks: [{text: "Excuse me, where is the hotel?", language_code: en, direction: ltr}]}
            word_bank: [ببخشید, هتل, کجاست]
          - content_key: fa.a1.unit05.lesson01.exercise05.translate_restroom
            type: translation
            tested_text: دستشویی
            prompt: {target_blocks: [{text: restroom, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson01.exercise06.fill_kojast
            type: fill_in_blank
            tested_text: هتل کجاست
            prompt: {target_blocks: [{text: "هتل ___؟", language_code: fa, direction: rtl}]}

      - content_key: fa.a1.unit05.lesson02.samt_rast_chap
        title: سمت راست و سمت چپ
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - content_key: fa.a1.unit05.lesson02.teach.samt
            kind: vocabulary
            target: {text: سمت, language_code: fa, direction: rtl}
            introduced_tokens: [سمت]
            example: {text: "به کدام سمت بروم؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson02.teach.rast
            kind: vocabulary
            target: {text: راست, language_code: fa, direction: rtl}
            introduced_tokens: [راست]
            example: {text: "به راست بپیچید.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson02.teach.chap
            kind: vocabulary
            target: {text: چپ, language_code: fa, direction: rtl}
            introduced_tokens: [چپ]
            example: {text: "به چپ بپیچید.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson02.teach.samte_rast
            kind: phrase
            target: {text: سمت راسته, language_code: fa, direction: rtl}
            introduced_tokens: [سمت, راسته]
          - content_key: fa.a1.unit05.lesson02.teach.samte_chap
            kind: phrase
            target: {text: سمت چپه, language_code: fa, direction: rtl}
            introduced_tokens: [سمت, چپه]
          - content_key: fa.a1.unit05.lesson02.teach.restoran_samte_rast
            kind: phrase
            target: {text: رستوران سمت راسته, language_code: fa, direction: rtl}
            introduced_tokens: [رستوران, سمت, راسته]
        exercises:
          - content_key: fa.a1.unit05.lesson02.exercise01.choose_rast
            type: multiple_choice
            tested_text: راست
            prompt: {target_blocks: [{text: right, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson02.exercise02.choose_chap
            type: multiple_choice
            tested_text: چپ
            prompt: {target_blocks: [{text: left, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson02.exercise03.match_sides
            type: matching_pairs
            tested_text: راست چپ سمت راسته سمت چپه هتل رستوران دستشویی
            prompt: {target_blocks: []}
            pairs: [{left: راست, right: right}, {left: چپ, right: left}, {left: سمت راسته, right: "it's on the right"}, {left: سمت چپه, right: "it's on the left"}, {left: هتل, right: hotel}, {left: رستوران, right: restaurant}, {left: دستشویی, right: restroom}]
          - content_key: fa.a1.unit05.lesson02.exercise04.order_restoran_samte_rast
            type: word_order
            tested_text: رستوران سمت راسته
            prompt: {target_blocks: [{text: "The restaurant is on the right.", language_code: en, direction: ltr}]}
            word_bank: [رستوران, سمت, راسته]
          - content_key: fa.a1.unit05.lesson02.exercise05.translate_left
            type: translation
            tested_text: چپ
            prompt: {target_blocks: [{text: left, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson02.exercise06.fill_samte
            type: fill_in_blank
            tested_text: رستوران سمت راسته
            prompt: {target_blocks: [{text: "رستوران ___ راسته.", language_code: fa, direction: rtl}]}

      - content_key: fa.a1.unit05.lesson03.mostaghim_va_narahi
        title: مستقیم رفتن و آدرس پرسیدن
        spine_outcome_id: universal.a1.directions.ask_follow_basic_directions
        teaching:
          - content_key: fa.a1.unit05.lesson03.teach.mostaghim
            kind: vocabulary
            target: {text: مستقیم, language_code: fa, direction: rtl}
            introduced_tokens: [مستقیم]
            example: {text: "مستقیم بروید.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson03.teach.berid
            kind: vocabulary
            target: {text: برید, language_code: fa, direction: rtl}
            introduced_tokens: [برید]
            example: {text: "برید سمت راست.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson03.teach.mostaghim_berid
            kind: phrase
            target: {text: مستقیم برید, language_code: fa, direction: rtl}
            introduced_tokens: [مستقیم, برید]
          - content_key: fa.a1.unit05.lesson03.teach.bad
            kind: vocabulary
            target: {text: بعد, language_code: fa, direction: rtl}
            introduced_tokens: [بعد]
            example: {text: "بعد به چپ بپیچید.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit05.lesson03.teach.mostaghim_bad_samte_rast
            kind: phrase
            target: {text: مستقیم برید. بعد سمت راست یه رستوران هست., language_code: fa, direction: rtl}
