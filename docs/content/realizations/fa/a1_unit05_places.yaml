            target: {text: ممنون. خواهش می‌کنم., language_code: fa, direction: rtl}
            introduced_tokens: [ممنون, خواهش, می‌کنم]
        exercises:
          - content_key: fa.a1.unit05.lesson03.exercise01.choose_mostaghim
            type: multiple_choice
            tested_text: مستقیم
            prompt: {target_blocks: [{text: straight ahead, language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit05.lesson03.exercise02.choose_bad
