review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.modality.ask_permission_and_state_rules. Grammar target: باید / نباید + subjunctive (باید بری، نباید بخوری، باید ساکت باشید), لازم نیست + subjunctive contrasted with نباید, and permission questions with می‌تونم / مشکلی نداره + subjunctive (اجازه هست is recognition only). Register: casual spoken Tehrani Persian (informal تو for friends; شما endings only in the notice and one polite-plural note). Characters: established friends Sara (teacher) and Nima (engineer); only the names are used, no new job or family facts asserted. Recycles library, pool, gym and waste sorting. The unit delivers a culminating written list of three rules (obligation, prohibition, not-needed) plus a spoken-style permission exchange. Authored without opening any prs file. NATIVE QUESTIONS: (1) Is اجازه هست بیام داخل؟ natural in everyday speech, or does it sound formal/old-fashioned (recommended: natural at a door, kept recognition-only)? (2) Is نه، نمی‌تونی an acceptable plain refusal to a friend, or is نه، نمی‌شه / نه، ممنوعه more natural (recommended: keep نه، ممنوعه as the graded answer)? (3) Is باید حوله بیارم؟ with the subjunctive بیارم fully natural for “Must I bring a towel?” (recommended: yes). (4) In the notice, is the bare noun-phrase form غذا خوردن ممنوعه (without است) the right register next to باید ... باشید (recommended: yes).'
