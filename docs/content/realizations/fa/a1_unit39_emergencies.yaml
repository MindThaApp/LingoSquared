    (https://fsi-language-courses-media.nyc3.cdn.digitaloceanspaces.com/
    languages/Persian/General/Spoken%20Persian.pdf) re-confirmed a JBIG2-only
    scan: pdftotext extracted 0 words, same dead end as every prior unit's
    attempt against this mirror. Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf) has a real
    Acrobat Pro DC "Paper Capture Plug-in" OCR text layer, 66,445 words
    extractable (identical word count to units 37/38's fetch of the same
    file, confirming a stable, genuine extraction, not a fluke). Grepped the
    full extracted text case-insensitively for police/ambulance/"fire
    brigade"/firemen/"fire dep"/emergency/danger/thief/robber/accident/"help
    me"/hospital, and separately for the Persian transliterations
    komak/kumak/"help!"/xatar/khatar/dozd/duzd/atash/otash/burn/"fire!"/"save
    me"/"call the police": found only two genuine but narrow isolated-word
    hits, both single glossary-table entries with no surrounding
    emergency-scenario content -- "paseban" ('policeman', an older/more
    formal term than this unit's modern colloquial پلیس) appearing three
    times in unrelated vocabulary/example-sentence tables (lines ~14264,
    17150, 18535, 35679 of the extracted text), and "bimarestan"/"nm-isxune"
    ('hospital') appearing once in an unrelated real-estate example sentence
    about a building that used to be a hospital (line ~45519). No
    ambulance/fire-department/danger/accident/emergency-call vocabulary or
    dialogue of any kind found anywhere in the extracted text. This is a
    real, honest dead end, the same shape as unit38's (colors/unit37 was the
    exception, not the rule): all vocabulary and dialogue in this unit is
    authored fresh from this project's own established colloquial Iranian
    Farsi conventions and its own already-shipped vocabulary (see review
    notes below for the specific reuse chain), not sourced from FSI at all.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed ONE real
    grammar/spelling error that appeared 13 times in this file (plus 6 more
    in the paired overlay): the formal/plural imperative "come!" was
    spelled "بیاید" (5 codepoints: ب-ی-ا-ی-د) throughout -- teaching cards
    (teach.zud_biayid), the dialogue (line3, and the media_assets dialogue
    transcript), every exercise built from it (recognize/match/translate/
    dialogue_comprehension/matching_pairs "right" values), and lesson06's
    wrap-up. That spelling is actually the standard 3rd-person-singular
    subjunctive "(که) او بیاید" ("that he/she come"), NOT the 2nd-person
    formal/plural imperative the unit intends -- Persian verbs whose
    present stem ends in the glide -ی (آمدن's stem آی) need a DOUBLE ی
    before the -ید formal ending (بیایید, 6 codepoints), the same pattern
    already used correctly and consistently everywhere in this course's own
    "بفرمایید" (verified with a corpus-wide grep of every fa realization
    file: "بفرمایید" always has the double-ی spelling, in units
    01/02/06/08/20/21/22/40/41/42/a2_unit09 -- 90+ instances, zero
    exceptions). This unit's other two formal-imperative forms, کنید
    (کن+ید, stem ends in a consonant) and بزنید (زن+ید, stem ends in a
    consonant), don't need the doubling and were already spelled correctly
    -- only the آمدن-derived form was wrong. Fixed by replacing every
    "بیاید" with "بیایید" in both this file and the paired overlay (13 + 6
    occurrences respectively, confirmed by grep after the fix: zero
    remaining bare "بیاید" instances, all now "بیایید"). Also added one
    missing multi-clause join variant per AUTHORING_GUIDE.md #12:
    lesson04.exercise05's ("ممنون! زود بیایید!") accepted_answers had "!"
    and ","-joined English forms but no period-joined form, unlike this
    same unit's own lesson03.exercise05, which already had all three --
    added "Thanks. Come quickly!" to match. Re-validated clean after both
    fixes: 0 errors/0 warnings standalone and as part of the full 4-unit
    (39-42) group. Everything else checked clean: no listen_select/
    dialogue_response distractor is a line either dialogue speaker (نیما,
    سارا) actually says elsewhere in this unit's dialogue audio (the one
    dialogue_comprehension exercise's distractors are invented
    plausible-fact paraphrases -- "he needs an ambulance/fire
    department/doctor" -- never spoken by anyone in the clip, matching the
    corpus's established safe pattern); a recursive yaml.safe_load boolean
    scan over both files found zero stray yes/no/true/false coercions
    (only the two legitimate boolean fields, human_reviewed and
    target_language_first); matching_pairs accepted_answers use this fa
    corpus's established flat-dict shape (not the {left,right}[] array
    shape), consistent with every other fa unit (checked unit38 as
    precedent) and correctly graded either way by the backend's shape
    canonicalization; every exercise `type:` used (multiple_choice,
    matching_pairs, word_order, translation, dialogue_comprehension,
    dialogue_response, reading_comprehension, writing_prompt) is registered
    in ExerciseRenderer.tsx; no untaught vocabulary (confirmed by the
    compiler's own validator, 0 errors); no snake_case/internal-jargon
    leaks into learner-facing text; the three emergency services'
    vocabulary and the لازمه fused-predicate construction are used
    consistently across all 6 lessons with no contradicting facts; the
    formal/plural register choice (کنید/بیایید/بزنید, not unit17's informal
    کن) is applied consistently and is correctly justified by the
    stranger/responder addressee, distinct from unit17's friend-to-friend
    context; Persian keheh (ک U+06A9) and yeh (ی U+06CC) codepoints are used
    throughout, not the Arabic kaf/yeh variants; the Iranian Farsi register
    reads naturally with no Dari forms or machine-translation-style calques.

    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit38 (seasons). Realizes
    universal.a1.emergencies.handle_basic_emergency, the next unrealized A1
    outcome after unit38 -- confirmed by an exact diff of every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files against every
    universal.a1.* id in docs/content/universal_spine.yaml: fa had realized
    all 39 non-emergencies A1 outcomes through seasons (unit38's own review
    note already flagged emergencies as the next one in spine declaration
    order), with lost_items/appointments/library/waste_disposal/
    accommodation/pharmacy still unrealized after this unit. Both
    prerequisites -- universal.a1.communication.basic_phone_contact (unit22)
    and universal.a1.health.describe_basic_problem (unit17) -- already
    covered; this unit reuses unit22's phone-call vocabulary (الو, باشه,
    میام, زنگ/زدن) and unit17's کمک ('help') without re-teaching them from
    scratch. Scoped to the outcome's four assessment requirements:
    understanding a spoken emergency request (listening, via lesson04's
    dialogue plus its dialogue_comprehension exercise), stating that help is
    needed and which kind (speaking/production, via translate/
    dialogue_response/writing_prompt exercises across lessons 01-06 covering
    all three services -- police, ambulance, fire department -- named in the
    spine outcome's own can_do text), interpreting a short written emergency
    notice (reading, lesson05's reading_comprehension exercises against a
    notice mapping each emergency type to the service it needs), and writing
    a short emergency-and-help-needed message (writing, lesson05/lesson06's
    writing_prompt exercises). Deliberately scoped to three services
    (پلیس/آمبولانس/آتش‌نشانی, exactly matching the spine outcome's own
    "police, ambulance, or fire brigade" wording) plus the fused-copula
    "needed" construction لازمه (built the same way as this course's already
    established قشنگه/گرمه/سرده/بارونیه/برفیه/باحاله fused predicates from
    units 07/20/23/36/38), rather than introducing unrelated new grammar.
    Register choice, explicitly noted per AUTHORING_GUIDE.md #3: this unit
    deliberately uses the FORMAL/plural imperative (کنید/بیایید/بزنید,
    "you-formal do/come/call") throughout, not the friend-to-friend informal
    تو-register imperative (کن) unit17 used for health advice between
    friends -- appropriate here since the shouted requests are addressed to
    strangers/emergency responders, a genuinely different register context
    from advising a friend, not an inconsistency with unit17's choice. Uses
    structured speaker fields for all dialogue turns; no spoken text embeds a
    "Name:" prefix. Every vocabulary card has an example sentence per schema
    1.1, and every example sentence is built only from the card's own word
    plus tokens already declared earlier in THIS file (no forward
    references). Already-taught words reused from earlier units (کمک, الو,
    باشه, ممنون, میام -> میاد, زنگ, زدن, کن -> کنید contrast) are
    re-declared in introduced_tokens before first tested use in this file
    because the compiler's untaught-vocabulary check is per-file only. No
    fill_in_blank or audio-only exercise types are used (fa has real TTS per
    AUTHORING_GUIDE.md #14, but this file continues the established
    text-based corpus-consistency pattern from units 19-38, same choice
    those units' own reviews made). Every matching_pairs exercise has 6-7
    pairs. Every translate-into-English exercise in the paired overlay
    explicitly sets answer_language_code: en. Ran a recursive
    yaml.safe_load scan over this file and its paired overlay for bare
    unquoted yes/no/true/false/on/off values -- zero hits (see the overlay's
    own review note for the exact scan result and script).

    Review 2026-10-21: 36 fixes (overlay 21, realization 15) - english 21 (subject-verb agreement 'Police is needed' -> 'Police are needed', 'An ambulance is needed', 'The fire department is needed' across glosses, matching pairs, distractors and word-order prompts; 'do! (formal)' gloss for کنید; clumsy dialogue_response and writing instructions; course description and jargon note wording); consistency 11 (internal unit references and English parentheticals removed from review-card targets and notes, notice card simplified); missing-variants 6 (translations, the dialogue_response and the wrap-up writing prompt now accept the natural English/Persian joins and the other taught emergency sentences); feedback asterisks added to all mixed English/Persian feedback; two Persian-only reading feedbacks now explain themselves. No script/ZWNJ problems found. Audio unchanged (all media_assets already pending_generation, dialogue text untouched). NATIVE FLAGS: (1) 'پلیس لازمه' / 'آمبولانس لازمه' / 'آتش‌نشانی لازمه' as emergency requests - confirm natural phrasing; (2) formal 'کنید/بیایید/بزنید' next to colloquial 'میاد' - confirm the register mix is natural (speech often uses 'بیاین').

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: fused
    copula predicates (لازمه) built the same way as units 07/20/23/36/38's
    own fused forms, plus a deliberate formal/plural imperative register
    (کنید/بیایید/بزنید) for addressing strangers/responders in an emergency --
    distinct from unit17's friend-to-friend informal imperative (کن), see
    this file's review notes for why. Reuses کمک (unit17), الو/باشه/میام/
    زنگ/زدن (units 17 and 22), and ممنون (unit17) without re-teaching them
    from scratch.

