  notes: 'Spine outcome: universal.a2.purpose.say_why_you_do_things. Grammar target: purpose with برای اینکه + subjunctive, colloquial تا + subjunctive (including تا بتونم), and برای + noun or verbal noun (برای خرید، برای فرستادن)؛ the unit contrasts purpose (subjunctive, looks forward) with reason (چون + ordinary verb, looks back) and teaches برای چی؟ as the question for purpose, without relying on unit 34. Register: casual spoken Tehrani Persian (می‌رم، می‌خوای، اومدی، بتونم، بزنم). Characters: established friends Sara (teacher) and Nima (engineer), confirmed by a grep of realizations/fa; no new job or family facts asserted (Nima saving for a car is a plan, not a biographical fact). Vocabulary: errands (bank, post office, market), learning (class, English) and saving money; recycles post, bank/money and education; every tested word is re-introduced in this unit. Delivers listening, reading, speaking and a culminating written text with three action-and-purpose statements (تا, برای اینکه, برای + noun). Authored without opening any prs file. NATIVE QUESTIONS: (1) Is پول جمع می‌کنم the natural spoken phrase for “I am saving money”, or would you prefer پس‌انداز می‌کنم / پول کنار می‌ذارم? Recommended: keep پول جمع می‌کنم (transparent, two common words). (2) Is رفتم پست برای فرستادن یه بسته natural with a bare verbal noun after برای, or do speakers prefer برای اینکه یه بسته بفرستم? Recommended: keep both; the unit teaches them as two options. (3) After چرا؟ is چون + past verb fine, while برای چی؟ is answered by a purpose clause; do speakers keep that distinction, or is برای چی؟ also used for “why” (cause)? Recommended: keep the taught distinction as a teaching simplification and flag that برای چی؟ can also mean “why”. (4) Is تا بتونم انگلیسی حرف بزنم natural in this order, or would speakers say تا بتونم به انگلیسی حرف بزنم? Recommended: keep without به.'
