  notes: 'Spine outcome: universal.a2.habits.describe_starting_stopping_trying. Grammar target: شروع کردم به + verbal noun; سعی می‌کنم / سعی کردم + subjunctive; یادم رفت (که) + subjunctive; stopping with دیگه ... نمی‌-verb and X رو ترک کردم. تموم کردم was deliberately left out (see question 3). Register: casual spoken Tehrani (خوندن، می‌خوام، شم, رو, pronoun drop; informal ببخش to a friend). Characters: established friends Sara (teacher) and Nima (engineer); no job or family facts asserted. Authored without opening any prs file. NATIVE QUESTIONS: (1) Is سعی کردم زود بیدار شم (shortened) fully natural, with بیدار بشم also accepted, or should the shortened شم be the only taught form? Recommended: teach شم, accept both. (2) Is کمتر از گوشی استفاده کنم the most natural phrasing for reducing screen time, or would you say گوشی رو کمتر نگاه کنم? Recommended: keep کمتر از گوشی استفاده کنم. (3) For stopping a habit, is ترک کردن fine for everyday items such as نوشابه and شیرینی, and is تموم کردم (e.g. ورزش رو تموم کردم) a natural way to say you stopped a habit, or does it only mean finishing a task? Recommended: keep ترک کردم, leave out تموم کردم. (4) Is تلویزیون نگاه کردن the natural spoken collocation, versus تلویزیون دیدن? Recommended: نگاه کردن.'
