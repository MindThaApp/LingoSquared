            target: {text: هم, language_code: fa, direction: rtl}
            introduced_tokens: [هم]
            example: {text: "کاش تو هم اونجا بودی.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.b1.unit07.lesson01.exercise01.recognize_kash
            type: multiple_choice
            tested_text: کاش
            prompt: {target_blocks: [{text: کاش, language_code: fa, direction: rtl}]}
