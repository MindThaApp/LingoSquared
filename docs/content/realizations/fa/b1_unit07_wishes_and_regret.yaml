          - content_key: fa.b1.unit07.lesson01.exercise04.match_wish_words_l1
            type: matching_pairs
            tested_text: "کاش اونجا بودم بودی دیشب جشن تولد"
            prompt: {target_blocks: []}
            pairs:
              - {left: کاش, right: "if only / I wish"}
              - {left: "اونجا بودم", right: "I wish I were there"}
