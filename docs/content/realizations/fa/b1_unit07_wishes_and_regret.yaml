    planned_lesson_count: 6

    lessons:
      - content_key: fa.b1.unit07.lesson01.wish_present_1st2nd
        title: "کاش اونجا بودم"
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
        teaching:
          - content_key: fa.b1.unit07.lesson01.teach.kash
            kind: vocabulary
            target: {text: کاش, language_code: fa, direction: rtl}
            introduced_tokens: [کاش]
            example: {text: "کاش وقت داشتم.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit07.lesson01.teach.unja_budam
            kind: vocabulary
            target: {text: "اونجا بودم", language_code: fa, direction: rtl}
            introduced_tokens: [اونجا, بودم]
            example: {text: "کاش دیشب اونجا بودم.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit07.lesson01.teach.unja_budi
            kind: vocabulary
            target: {text: "اونجا بودی", language_code: fa, direction: rtl}
            introduced_tokens: [بودی]
            example: {text: "کاش تو هم اونجا بودی.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit07.lesson01.teach.grammar_kash_wish
            kind: grammar_note
            target: {text: "کاش اونجا بودم. کاش اونجا بودی؟", language_code: fa, direction: rtl}
            introduced_tokens: [دیشب]
          - content_key: fa.b1.unit07.lesson01.teach.dishab
            kind: vocabulary
            target: {text: دیشب, language_code: fa, direction: rtl}
            introduced_tokens: []
            example: {text: "دیشب کار داشتم.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit07.lesson01.teach.reza
            kind: vocabulary
            target: {text: رضا, language_code: fa, direction: rtl}
            introduced_tokens: [رضا]
            example: {text: "دیشب جشن تولد رضا بود.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit07.lesson01.teach.jashne_tavallod
            kind: vocabulary
            target: {text: "جشن تولد", language_code: fa, direction: rtl}
            introduced_tokens: [جشن, تولد]
            example: {text: "دیشب جشن تولد رضا بود.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit07.lesson01.teach.to
