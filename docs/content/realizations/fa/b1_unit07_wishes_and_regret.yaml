generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked the local
    `.firecrawl/` cache before writing (per standing instruction to check
    the cache, never the live network while Firecrawl reports 402/credits-
    exhausted) -- no cached Persian intermediate-grammar material relevant
    to wish/counterfactual constructions was found there, and per every
    prior fa B1 unit's own provenance note, the FSI Persian Basic Course is
    separately confirmed beginner-only (12 units, no intermediate volume)
    regardless of Firecrawl access. Authored from general Persian grammar
    knowledge, same as fa's other B1 units.

    This is fa's SEVENTH B1 unit and the first of the "second wave" -- the
    same five second-wave spine outcomes en-nl's B1 course just finished
    (hypotheticals-with-conditional, opinions-with-concession, workplace
    meetings, narrative-with-relative-clauses, reported speech), reusing
    ONLY the outcome ids (verified verbatim against universal_spine.yaml),
    never nl's actual content or structure -- no nl file was opened while
    authoring this one.

    Grammar target, genuinely distinct from unit03's own hypotheticals
    unit (real/possible اگه + داشته باشم, and unreal اگه + داشتم +
    می‌خریدم -- a SIMPLE imperfect condition): (1) کاش ("if only"/"I wish")
    + IMPERFECT for an unreal wish about a present/ongoing state (کاش
    اونجا بودم, "I wish I were there" / "I wish I had been there") --
    کاش is a genuinely different construction from اگه: it is a bare wish
    particle with no separate result clause at all, not a two-clause
    conditional; (2) a DEEPER past counterfactual than unit03's, using the
    PLUPERFECT/گذشته نقلی in the if-clause (اگر زودتر رفته بودم, "if I had
    gone earlier") paired with an imperfect result clause (رضا رو می‌دیدم,
    "I would have seen Reza") -- genuinely more complex subordination than
    unit03's simple-imperfect if-clause (اگه پول داشتم), matching the
    spine outcome's own wording ("an unreal 'if'-clause in a past/irrealis
    form"); (3) می‌خواستم (imperfect of the already-taught A1 verb خواستن,
    "می‌خوام") used on its own, with NO اگه-clause at all, as a softened
    request/preference opener ("I wanted to ask..." / "I would like to
    ask...") -- directly serving the outcome's own "use the conditional
    alone to soften a suggestion, request, or preference" clause. This
    softening use is deliberately kept in a PERSONAL/casual-register scene
    here (asking a friend to reschedule), reserving the FORMAL/workplace
    register version of conditional softening for the professional-
    meetings unit later in this same batch, so the two units don't teach
    the identical pragmatic move in the identical register back to back.

    Two governing verbs held constant across the unit (mirroring unit03's
    own two-verb discipline with داشتن/خریدن): بودن (to be, for the کاش-
    wish paradigm) and رفتن/دیدن (go/see, for the pluperfect-counterfactual
    paradigm). رفتن is reused from unit01, but in a genuinely new inflected
    form (رفته بودم, pluperfect) never taught there (unit01 only taught
    present subjunctive برم/بری/... and the separate باید-past-regret
    construction باید می‌رفتم) -- not a vocabulary reskin, a new tense
    entirely. خریدن/داشتن (unit03) and توانستن (unit02) are avoided
    entirely so this unit doesn't read as a reskin of either prior unit.

    All vocabulary is introduced self-contained within this file (the
    established per-file convention, since validate_untaught_vocabulary
    scopes the taught-token set to a single realization file) -- even
    common words already taught elsewhere (اگر/اگه, آخر هفته) are
    redeclared here.

    Character-cast continuity: reuses نیما (established protagonist since
    b1_unit02/03/06) and رضا (established since b1_unit02/04/06, an
    existing fa name with many prior corpus hits) -- both confirmed via
    grep against the fa corpus before writing. Scenario: نیما missed
    رضا's birthday party because he was busy with work, and the two
    friends talk through the regret and make a plan to meet another time.
    This does not contradict anything established for either character
    elsewhere in the corpus (رضا's established role as a workshop
    mechanic in unit02 is compatible with also being نیما's friend here;
    نیما's established busy-with-work characterization from unit01/03
    carries through consistently as the reason he missed the party). No
    nl or other sibling-direction file was opened while authoring this
    one.

    Lessons 01-02 drill کاش + imperfect بودن (1st/2nd person, then all
    persons); lesson03 introduces the pluperfect counterfactual (اگر
    زودتر رفته بودم .../اگر نرفته بودم...) plus its negation; lesson04 is
    a dialogue between نیما and رضا working through the regret and ending
    with نیما's softened می‌خواستم-request to reschedule; lesson05 is a
    third-person reading recounting the same events; lesson06 is
    production-only wrap-up -- the same six-lesson arc established across
    every prior fa B1 unit.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude), cold, no access to the
    authoring reasoning above. Verified all three constructions are correct
    Persian: کاش + imperfect بودن for the unreal present/past wish, اگر +
    pluperfect (رفته بودم) + imperfect result (می‌دیدم) for the deeper past
    counterfactual (and its negation نرفته بودم/نمی‌دیدم), and bare
    می‌خواستم as a softened-request opener. word_order accepted_answers are
    all in correct sentence order and comma-free (match the tiles); §12
    comma/no-comma variants present on every multi-clause translation.
    Fixed (objective-grading): lesson02 exercise01/02 recognize items
    offered the literal simple-past reading ("he/she was there" / "they were
    there") as a distractor against the کاش-wish keyed answer, with no کاش in
    the prompt to disambiguate -- a learner reading the bare form literally
    (correctly) would be marked wrong; swapped both colliding distractors for
    non-colliding different-person wish forms, matching the author's own
    convention in the other recognize items. Character continuity (نیما/رضا,
    Sara mentioned) consistent with units 01-06.

course:
  realization_key: fa.b1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken colloquial register
    used throughout fa units 01-57 and B1 units 01-06. کاش and اگر
    (colloquially اگه) are both register-neutral in spoken Persian --
    used identically in casual and polite speech -- so this unit's
    personal, between-friends scene does not require any special
    register marking; a dedicated grammar note contrasts this with the
    FORMAL register that the later professional-meetings unit will use
    for its own softened-request construction.

