realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: codex
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access
    for this unit. Reached the Yojik FSI Persian course page and opened
    the linked Spoken Persian Student Text PDF
    (https://fsi-languages.yojik.eu/languages/FSI/Persian/Spoken%20Persian.PDF,
    398 pages); also confirmed the page itself describes the FSI/DLI/Peace
    Corps materials it hosts as public domain. Tried direct PDF text search
    for this unit's own English chore/household terms (clean, wash, house,
    room, help, cook). Honest result: the browser-accessible PDF text layer
    returned no usable matches for those searches in this environment, so
    no FSI phrase or sentence is treated as a confirmed source hit for this
    unit. Authored the unit from this course's established fa conventions
    instead: modern Iranian colloquial register, already-established
    می‌کنم-family present-tense patterns, object marker رو, خانه/اتاق from
    housing-topic prerequisites, and the نیما/سارا recurring cast. No source
    sentence is imported verbatim.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed ONE real
    bug: lesson04.exercise01.dialogue_comprehension_context's `prompt`
    did not match the actual dialogue transcript and used vocabulary/
    grammar the learner hasn't been taught yet at this point in the
    unit. Every other dialogue_comprehension exercise in this unit
    (and across every other unit in this review batch, 27/28/29/30/31)
    shows the learner the literal, verbatim multi-speaker dialogue
    transcript (with نیما:/سارا: speaker labels) as its `prompt` --
    unit32's own lesson04 exercise instead showed a rewritten
    third-person paraphrase ("سارا می‌گوید خانه امروز خیلی شلوغه. نیما
    ظرف‌ها رو می‌شوره. سارا اتاق رو تمیز می‌کنه. بعد نیما لباس‌ها رو
    می‌شوره.") that (a) used می‌گوید, a word never taught anywhere in
    this unit at all, and (b) used the 3rd-person colloquial forms
    می‌شوره/می‌کنه, which aren't introduced until lesson05's own
    review_third_person grammar note -- one full lesson AFTER this
    exercise. Since exercise prompts aren't compiler-validated against
    introduced_tokens (only tested_text is, confirmed against
    scripts/compile_content.py), this passed validation clean but would
    have shown a real learner unreviewed vocabulary/grammar mid-exercise,
    exactly the failure mode AUTHORING_GUIDE.md's instruction-coherence
    and lesson-pacing rules exist to prevent. Fixed by replacing the
    prompt with the actual verbatim dialogue transcript (matching the
    media_assets audio text and every other unit's established
    convention): "سارا: نیما، امروز خانه خیلی شلوغه. نیما: آره، من
    ظرف‌ها رو می‌شورم. سارا: من اتاق رو تمیز می‌کنم. بعد کمک می‌کنی؟
    نیما: حتماً. بعد لباس‌ها رو می‌شورم. سارا: عالیه، ممنون!" -- every
    word in this transcript is already-taught 1st/2nd-person vocabulary
    from this unit's own lessons 01-04. Also fixed the paired overlay's
    feedback text for the same exercise, which likewise used the
    untaught می‌شوره form -- replaced with a feedback string quoting the
    dialogue's actual taught lines. Re-ran the compiler after both fixes
    (0 errors/0 warnings). Also confirmed 0 stray YAML boolean
    coercions, no listen_select/listen_type/listen_order exercises, both
    dialogue_response exercises free-text (no distractors), all exercise
    types used have a matching ExerciseRenderer.tsx case, and every
    other stated fact (who does which chore) is mutually consistent
    across the dialogue, reading, and exercises. Original authoring
    notes below, retained for context.

    Draft authored 2026-07-09 by Codex. Realizes
    universal.a1.household.describe_chores, the next unrealized A1 outcome
    after unit31. Confirmed by yaml.safe_load recursive collection of every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files and exact diff against
    every universal.a1.* id in docs/content/universal_spine.yaml. The current
    next missing ids were household, neighborhood, post, cooking,
    personality, colors, seasons, emergencies, and lost_items, in that order.
    Scoped to saying which chores need doing, who does them, and asking for
    help with one: ظرف شستن, لباس شستن, اتاق رو تمیز کردن, and جارو زدن.
    Uses structured speaker fields for dialogue turns; no spoken text embeds
    a "Name:" prefix. Every vocabulary card has an example sentence per
    schema 1.1. Already-taught words reused from earlier units are
    re-declared in introduced_tokens before first tested use in this file
    because the compiler's untaught-vocabulary check is per-file only.
    No fill_in_blank or audio-only exercise types are used. Every
    matching_pairs exercise has 6-8 pairs. Every translate-into-English
    exercise in the paired overlay explicitly sets answer_language_code: en.

    Review 2026-10-21: 2 fixes - matching pair for 'می‌زنم' now reads 'جارو
    می‌زنم' = 'I sweep' (tested_text kept in sync). NATIVE FLAGS: (1) 'چه کاری
    می‌کنی؟' reads somewhat stiff for 'what are you doing' (colloquial 'چیکار
    می‌کنی'); (2) 'شلوغه' for a messy home - confirm it is the natural word
    (alternatives such as 'به‌هم‌ریخته'); (3) 'لطفاً در کارهای خونه کمک
    می‌کنی؟' mixes formal 'در' and 'لطفاً' with colloquial verbs (colloquial
    'توی کارهای خونه'); (4) in the dialogue Nima answers 'Will you help
    later?' with 'then I'll do the laundry', which does not quite answer a
    request to help clean the room.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register from units
    24-31: رو as object marker, informal تو-register dialogue, colloquial
    present forms such as می‌کنم/می‌کنی and میام-family patterns, and
    خونه/اتاق vocabulary from the housing prerequisite. Chore phrases use
    natural light-verb compounds: ظرف شستن, لباس شستن, تمیز کردن, and جارو
    زدن.

