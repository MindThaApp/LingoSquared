units:
  - content_key: fa.a1.unit32.household
    title: کارهای خونه
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.household.describe_chores
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit32.lesson01.chore_vocabulary
        title: "کلمات کارهای خونه"
        spine_outcome_id: universal.a1.household.describe_chores
        teaching:
          - content_key: fa.a1.unit32.lesson01.teach.zarf_shostan
            kind: vocabulary
            target: {text: "ظرف شستن", language_code: fa, direction: rtl}
            introduced_tokens: [ظرف, شستن]
            example: {text: "ظرف شستن کار منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit32.lesson01.teach.lebas_shostan
            kind: vocabulary
            target: {text: "لباس شستن", language_code: fa, direction: rtl}
            introduced_tokens: [لباس]
            example: {text: "لباس شستن امروز کار منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit32.lesson01.teach.tamiz_kardan
            kind: vocabulary
            target: {text: "تمیز کردن", language_code: fa, direction: rtl}
            introduced_tokens: [تمیز, کردن]
            example: {text: "اتاق رو تمیز می‌کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit32.lesson01.teach.jaru_zadan
            kind: vocabulary
            target: {text: "جارو زدن", language_code: fa, direction: rtl}
            introduced_tokens: [جارو, زدن]
            example: {text: "من خونه رو جارو می‌زنم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit32.lesson01.teach.review_house_words
            kind: grammar_note
            target: {text: "خونه (home) / اتاق (room) / کار (work, task) / من (I, my) / و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [خونه, اتاق, کار, من, و]
          - content_key: fa.a1.unit32.lesson01.teach.review_object_marker
            kind: grammar_note
            target: {text: "رو (object marker) / می‌کنم (I do) / باید (must, need to)", language_code: fa, direction: rtl}
            introduced_tokens: [رو, "می‌کنم", باید]
          - content_key: fa.a1.unit32.lesson01.teach.need_clean_room
            kind: phrase
            target: {text: "باید اتاق رو تمیز کنم.", language_code: fa, direction: rtl}
            introduced_tokens: [کنم]
        exercises:
          - content_key: fa.a1.unit32.lesson01.exercise01.recognize_zarf_shostan
            type: multiple_choice
            tested_text: "ظرف شستن"
            prompt: {target_blocks: [{text: "ظرف شستن", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit32.lesson01.exercise02.recognize_tamiz_kardan
            type: multiple_choice
            tested_text: "تمیز کردن"
            prompt: {target_blocks: [{text: "تمیز کردن", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit32.lesson01.exercise03.match_chore_words
            type: matching_pairs
            tested_text: "ظرف شستن لباس شستن تمیز کردن جارو زدن خونه اتاق باید اتاق رو تمیز کنم"
            prompt: {target_blocks: []}
            pairs:
              - {left: "ظرف شستن", right: "washing dishes"}
              - {left: "لباس شستن", right: "doing laundry"}
              - {left: "تمیز کردن", right: cleaning}
              - {left: "جارو زدن", right: sweeping}
              - {left: خونه, right: home}
              - {left: اتاق, right: room}
              - {left: "باید اتاق رو تمیز کنم.", right: "I need to clean the room."}
          - content_key: fa.a1.unit32.lesson01.exercise04.word_order_need_clean
            type: word_order
            tested_text: "باید اتاق رو تمیز کنم"
            prompt: {target_blocks: [{text: "I need to clean the room.", language_code: en, direction: ltr}]}
            word_bank: [باید, اتاق, رو, تمیز, کنم]
          - content_key: fa.a1.unit32.lesson01.exercise05.translate_need_clean
            type: translation
            tested_text: "باید اتاق رو تمیز کنم."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit32.lesson02.doing_chores
        title: "چه کاری می‌کنی؟"
        spine_outcome_id: universal.a1.household.describe_chores
        teaching:
          - content_key: fa.a1.unit32.lesson02.teach.review_questions
            kind: grammar_note
            target: {text: "چی (what) / کِی (when) / امروز (today)", language_code: fa, direction: rtl}
            introduced_tokens: [چی, کِی, امروز]
          - content_key: fa.a1.unit32.lesson02.teach.mikoni_pattern
            kind: grammar_note
            target: {text: "می‌کنم (I do) -> می‌کنی (you do, informal)", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌کنی"]
          - content_key: fa.a1.unit32.lesson02.teach.question_what_chore
            kind: phrase
            target: {text: "امروز چه کاری می‌کنی؟", language_code: fa, direction: rtl}
            introduced_tokens: [چه, کاری]
          - content_key: fa.a1.unit32.lesson02.teach.mishuram_pattern
            kind: grammar_note
            target: {text: "می‌شورم = I wash", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌شورم"]
          - content_key: fa.a1.unit32.lesson02.teach.zarfha_answer
            kind: phrase
            target: {text: "من ظرف‌ها رو می‌شورم.", language_code: fa, direction: rtl}
            introduced_tokens: ["ظرف‌ها"]
          - content_key: fa.a1.unit32.lesson02.teach.lebasha_answer
            kind: phrase
            target: {text: "لباس‌ها رو می‌شورم.", language_code: fa, direction: rtl}
            introduced_tokens: ["لباس‌ها"]
        exercises:
          - content_key: fa.a1.unit32.lesson02.exercise01.recognize_mishuram
            type: multiple_choice
            tested_text: "می‌شورم"
            prompt: {target_blocks: [{text: "می‌شورم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit32.lesson02.exercise02.recognize_question
            type: multiple_choice
            tested_text: "امروز چه کاری می‌کنی؟"
            prompt: {target_blocks: [{text: "امروز چه کاری می‌کنی؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit32.lesson02.exercise03.match_doing_chores
            type: matching_pairs
            tested_text: "چی کِی امروز چه کاری می‌کنی می‌شورم ظرف‌ها لباس‌ها من ظرف‌ها رو می‌شورم"
            prompt: {target_blocks: []}
            pairs:
              - {left: چی, right: what}
              - {left: کِی, right: when}
              - {left: امروز, right: today}
              - {left: "می‌کنی", right: "you do"}
              - {left: "می‌شورم", right: "I wash"}
              - {left: "ظرف‌ها", right: dishes}
              - {left: "لباس‌ها", right: clothes}
              - {left: "من ظرف‌ها رو می‌شورم.", right: "I wash the dishes."}
          - content_key: fa.a1.unit32.lesson02.exercise04.word_order_wash_dishes
            type: word_order
            tested_text: "من ظرف‌ها رو می‌شورم"
            prompt: {target_blocks: [{text: "I wash the dishes.", language_code: en, direction: ltr}]}
            word_bank: [من, "ظرف‌ها", رو, "می‌شورم"]
          - content_key: fa.a1.unit32.lesson02.exercise05.translate_laundry
            type: translation
            tested_text: "لباس‌ها رو می‌شورم."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit32.lesson03.ask_for_help
        title: "کمک می‌کنی؟"
        spine_outcome_id: universal.a1.household.describe_chores
        teaching:
          - content_key: fa.a1.unit32.lesson03.teach.help_word
            kind: vocabulary
            target: {text: کمک, language_code: fa, direction: rtl}
            introduced_tokens: [کمک]
            example: {text: "کمک می‌کنی؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit32.lesson03.teach.help_question
            kind: phrase
            target: {text: "کمک می‌کنی؟", language_code: fa, direction: rtl}
            introduced_tokens: []
