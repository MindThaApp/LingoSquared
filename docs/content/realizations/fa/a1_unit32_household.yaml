    text: "سارا: نیما، امروز خونه خیلی شلوغه. نیما: آره، من ظرف‌ها رو می‌شورم. سارا: من اتاق رو تمیز می‌کنم. بعد کمک می‌کنی؟ نیما: حتماً. بعد لباس‌ها رو می‌شورم. سارا: عالیه، ممنون!"
