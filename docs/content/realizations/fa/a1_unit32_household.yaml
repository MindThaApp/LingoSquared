            prompt: {target_blocks: [{text: کمک, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit32.lesson03.exercise02.recognize_help_question
            type: multiple_choice
            tested_text: "کمک می‌کنی؟"
            prompt: {target_blocks: [{text: "کمک می‌کنی؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit32.lesson03.exercise03.match_help_words
            type: matching_pairs
            tested_text: "کمک لطفاً بعد حتماً جارو می‌زنم کمک می‌کنی لطفاً کمک می‌کنی اتاق رو تمیز کنم حتماً بعد جارو می‌زنم"
            prompt: {target_blocks: []}
            pairs:
