            kind: grammar_note
            target: {text: "لطفاً (please) / بعد (after, then) / حتماً (definitely)", language_code: fa, direction: rtl}
            introduced_tokens: [لطفاً, بعد, حتماً]
          - content_key: fa.a1.unit32.lesson03.teach.help_request_room
