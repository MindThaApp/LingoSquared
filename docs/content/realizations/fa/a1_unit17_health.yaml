review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, fa's next uncovered outcome (universal.a1.health.describe_basic_problem, prerequisite: introductions/unit02, already covered). Six lessons: basic symptoms (سردرد/تب), more symptoms (دل درد/خسته), asking for help, simple health advice (استراحت کن/آب بخور), reading a short symptom note, and a dialogue where a friend gives basic advice. Deliberately keeps grammar simple (no subjunctive باید+verb construction) by using only imperative advice forms and already-established present-tense patterns, appropriate for A1. Colloquial -e/-am contraction register maintained throughout (خسته‌ام، ممنون), هستم copula family. Authored independently of the prs realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6 pairs except lesson01's genuine 4-pair first-lesson ceiling, and zero fill_in_blank exercises. Multi-clause exercises include period-joined, comma-joined, and و-joined accepted variants per §12, and open-ended production exercises carry multiple accepted symptom variants from the start. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW, 2026-07-07 (zero prior access to this unit's authoring reasoning, prs sibling files never opened, per §8/§9): confirmed spine-outcome discipline (all 6 lessons genuinely serve universal.a1.health.describe_basic_problem, no drift) and all 4 assessment_requirements covered (understand_health_problem via lesson05/06's reading_comprehension pairs plus matching_pairs recognition, read-substituting-for-listening per the same precedent already accepted in units 09-16's own fresh-context reviews since fa audio for this unit's own phrases remains pending_generation; state_health_problem via the translate/dialogue_response exercises; read_basic_health_instruction specifically via lesson06.exercise03, which precisely matches the spine's own wording -- 'read the line, identify what Sara advises'; write_health_message via lesson05/06's writing_prompt exercises). Verified recognition->drag/matching->production pacing in all 6 lessons. Grepped both files: zero listen_type/listen_select/listen_order exercises (§14) and zero fill_in_blank exercises (§17). Verified §16 matching_pairs sizing exactly as claimed (lesson01: 4, lessons02-06: 6 each). Grepped both files for Arabic-range kaf (U+0643)/yeh (U+064A): zero found. Wrote a real Python script (yaml.safe_load, recursive dict-value walk) checking every dict value in both files for a stray non-schema Python bool: none found. Confirmed content_key parity exact in both directions via script (23 teaching + 30 exercise keys, plus units/lessons dicts). Confirmed all 8 exercise types used (multiple_choice, matching_pairs, translation, word_order, reading_comprehension, writing_prompt, dialogue_comprehension, dialogue_response) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx. Wrote a real duplicate-instruction-vs-target_blocks script (yaml.safe_load both files, casefold compare of every exercise's en-language target_blocks against that exercise's overlay instruction): zero duplicates found. Read backend/app/api/router.py's grade()/is_multi_answer_response() and confirmed lesson05.exercise05 (write_own_symptom) and lesson06.exercise05 (write_health_summary)'s multi-variant open-ended acceptance is genuine multi-answer grading (any accepted-list item matches), not a disguised bug -- confirmed directly in the compiled JSON that every authored variant appears in correct_response.accepted, and that all 30 exercises (24 free-text/matching plus 6 matching_pairs) have a genuine non-empty correct_response. Verified every multiple_choice/reading_comprehension/dialogue_comprehension exercise pairs a Farsi prompt with English-only correct_option/distractors -- no same-script visual-matching shortcut anywhere. Wrote a Python tokenizer (ZWNJ-aware, Persian-punctuation-stripping) and checked every exercise's tested_text/pairs/word_bank plus the overlay's Farsi-side accepted_answers against cumulative file-scoped introduced_tokens: zero untaught-vocabulary gaps found, including confirming داره (lesson06's 3rd-person grammar note) and هم (also/too) are both taught before their use in write_health_summary/the dialogue respectively. Cross-checked §11 facts: lesson06's Nima/Sara dialogue (headache+fever, rest+water advice) and lesson05's anonymous first-person reading note (headache, fever, tiredness) are correctly two independent, unconnected examples -- neither references the other, so there's no unintended implication they're the same continuous narrative. Confirmed §12 multi-clause coverage: translate_rest_and_drink_water (lesson04), translate_headache_and_fever (lesson05), and write_health_summary (lesson06) all carry period-joined, comma-joined, and و-joined accepted variants, verified present in the actual compiled correct_response.accepted lists. Assessed the deliberate باید+subjunctive avoidance: reasoned through the register directly and confirmed via web search that the bare informal imperative (استراحت کن، آب هم بخور) is genuinely how Persian speakers casually advise a friend -- bare imperatives are the standard informal-register form for peer-to-peer advice in Persian (softening particles like لطفاً are for formal/polite-register requests, not friend-to-friend care-advice), and the exchange's own باشه، ممنون reply confirms it reads as warm advice received well, not a curt command; this simplification is pedagogically correct for A1, not unnaturally curt. Verified vocabulary/grammar authenticity: حالم خوب نیست، سردرد، تب، دلم درد می‌کنه، خسته‌ام، کمک، می‌تونی کمکم کنی؟، دکتر، دارو، استراحت کن، آب بخور، and دارو خوردن (take medicine, literally eat/drink medicine, the standard colloquial construction paralleling قرص خوردن) are all natural, correct, idiomatic colloquial Tehrani Farsi, not calques or overly formal. Verified register consistency against units 15/16 (هستم-family copula, -e/-am contractions, نیما/سارا names, established و-joined multi-clause precedent) -- fully consistent. Confirmed A1-appropriate complexity throughout. Noted for the roadmap (not a blocking issue for this unit): §14 was revised 2026-07-06 to permit listen_type/listen_select content for fa now that Azure TTS ships real Farsi voices, but this unit (matching the same-day-reviewed units 15/16 precedent) still uses the reading-substitutes-for-listening pattern since this unit's own audio remains pending_generation and no sibling fa unit has added a real listen exercise yet -- a legitimate consistency choice, not a violation, but a candidate for a future pass once fa TTS-backed listen exercises become the norm across the course. Re-ran validate + compile after confirming zero issues needed fixing: 0 errors/0 warnings, valid JSON, and the actual compiled output was spot-checked directly (not just validate) to confirm all 30 exercises have a genuine non-empty correct_response and answer_language_code correctly resolves to fa for every translation/writing_prompt/dialogue_response exercise per §6."

