review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context review, 2026-07-05. Checked spine-outcome discipline
    against universal.a1.shopping.ask_prices_quantities's own
    assessment_requirements (understand a price/quantity, ask a
    price/quantity + respond, read a price label, write a purchase
    request) -- all covered across the six lessons, no drift into
    unrelated grammar. Exercise pacing verified recognition -> drag/
    matching -> production in every one of the 6 lessons. Verified
    dialect authenticity: تومن (not ریال) is the correct everyday
    spoken currency unit, این چنده؟ is a genuine colloquial price
    question, تخفیف می‌دید؟ is genuine, ordinary Iranian bargaining
    culture (confirmed, not rude/unusual), and the -e contractions
    (تومنه) match unit07's established pattern. Found and fixed a real
    bug: 10 multiple_choice "recognize_*" exercises across lessons
    01-05 displayed the exact target Farsi phrase in the prompt AND
    repeated it verbatim as the correct_option/distractors -- the
    identical bug class found and fixed in unit07 (also exactly 10
    instances there). Fixed by converting correct_option/distractors/
    accepted_answers to English glosses, matching the unit07/unit01
    reference pattern. Cross-checked every concrete fact per §11 (item
    = apples, original price = 30 toman/kg, discounted price = 28
    toman, payment = cash) across every exercise/teaching card/dialogue
    referencing them -- fully consistent throughout. Added missing
    §12 multi-clause joining forms: a و-joined form to
    dialogue_response_pay and a comma-joined form to
    write_market_summary (speak_full_market_scene's two question-mark
    clauses correctly omit a comma form, which wouldn't be grammatical
    there). No fill_in_blank exercises exist (§13 n/a as a type, but
    ran a Python token-coverage script tokenizing on Persian-range
    characters only against every exercise's tested_text/word_bank/
    pairs and the overlay's accepted_answers/pairs/word_bank, checked
    cumulatively lesson-by-lesson against introduced_tokens -- zero
    gaps found on the realization side and zero on the overlay's
    accepted_answers/pairs/word_bank; a handful of listen_select
    distractors reference forward vocabulary, matching unit07's own
    already-reviewed precedent for that exempt field). content_key
    parity confirmed exact both directions (teaching and exercises).
    Grepped for Arabic-range kaf (U+0643) and yeh (U+064A): none found.
    No unquoted YAML booleans in learner-facing fields. No internal
    jargon leaks found in any learner-facing string. FLAGGED, not
    fixed (a product/curriculum-scope call, not a bug): 30 toman/kg
    for apples (28 toman discounted) reads as an unrealistically low
    placeholder given real-world Iranian toman pricing under ongoing
    inflation -- real prices would plausibly be in the thousands-to-
    tens-of-thousands-of-toman range. Left as-is because a realistic
    price would require teaching "هزار" (thousand), which exceeds this
    unit's numbers prerequisite scope (universal.a1.numbers.
    use_basic_numbers) -- flagging for Ramin's awareness rather than
    unilaterally expanding scope. Both `validate` and `compile` run
    clean after fixes: 0 errors, 0 warnings, compiles to valid JSON.
    Audio remains pending generation.

    AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, project-wide audit):
    found 10 exercises in this unit (lesson01.exercise03,
    lesson02.exercise03/06, lesson03.exercise03/06, lesson04.exercise03/06,
    lesson05.exercise03/06, lesson06.exercise05) were listen_type or
    bare-prompt listen_select items -- genuinely unanswerable since
    fa/prs have zero working TTS/recorded audio. Converted:
    listen_select -> multiple_choice (visible Farsi prompt, English
    glosses to avoid re-introducing the prompt-shows-answer bug this
    same file's earlier review already fixed once), listen_type ->
    translation. MATCHING_PAIRS SCALE (§16) CHECK: all 6 matching_pairs
    exercises (4/7/7/8/7/8) already reasonably sized -- no changes
    needed. Re-verified 0 remaining §14 violations via script,
    content_key parity intact, validate+compile both clean after the
    retrofit. This is the last of all 18 fa/prs A1 units to complete
    this retrofit.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues unit01's neutral-polite spoken register and the colloquial
    -e contraction pattern already established (e.g. گرونه = گران است,
    ارزونه = ارزان است). Bargaining language (تخفیف می‌دید؟) reflects
    genuine, everyday Iranian shopping culture, not an invented flourish.

