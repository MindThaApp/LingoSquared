          - content_key: fa.a1.unit08.lesson03.exercise02.recognize_half_kilo
            type: multiple_choice
            tested_text: نصف کیلو می‌خوام
            prompt: {target_blocks: [{text: "نصف کیلو می‌خوام", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit08.lesson03.exercise03.recognize_quantity_reading
