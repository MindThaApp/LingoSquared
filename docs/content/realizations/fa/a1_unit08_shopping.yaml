            kind: phrase
            target: {text: "کیلویی سی تومنه", language_code: fa, direction: rtl}
            introduced_tokens: [کیلویی, سی, تومنه]
          - content_key: fa.a1.unit08.lesson02.teach.contraction_note
            kind: grammar_note
            target: {text: "تومنه = تومن است (محاوره‌ای)", language_code: fa, direction: rtl}
            introduced_tokens: [تومن, است]
        exercises:
          - content_key: fa.a1.unit08.lesson02.exercise01.recognize_how_much
            type: multiple_choice
            tested_text: این چنده
            prompt: {target_blocks: [{text: "این چنده؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit08.lesson02.exercise02.recognize_per_kilo
            type: multiple_choice
            tested_text: کیلویی سی تومنه
