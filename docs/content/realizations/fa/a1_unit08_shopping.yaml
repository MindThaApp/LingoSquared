            word_bank: [این, چنده]
          - content_key: fa.a1.unit08.lesson02.exercise06.translate_price_question
            type: translation
            tested_text: این چنده
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit08.lesson02.exercise07.speak_ask_price
