units:
  - content_key: fa.a1.unit08.shopping
    title: خرید کردن
    section: speaking
    spine_outcome_ids:
      - universal.a1.shopping.ask_prices_quantities
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit08.lesson01.shop_vocabulary
        title: کلمات مربوط به مغازه
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: fa.a1.unit08.lesson01.teach.shop_word
            kind: vocabulary
            target: {text: مغازه, language_code: fa, direction: rtl}
            introduced_tokens: [مغازه]
          - content_key: fa.a1.unit08.lesson01.teach.price_word
            kind: vocabulary
            target: {text: قیمت, language_code: fa, direction: rtl}
            introduced_tokens: [قیمت]
          - content_key: fa.a1.unit08.lesson01.teach.discount_word
            kind: vocabulary
            target: {text: تخفیف, language_code: fa, direction: rtl}
            introduced_tokens: [تخفیف]
          - content_key: fa.a1.unit08.lesson01.teach.apple_word
            kind: vocabulary
            target: {text: سیب, language_code: fa, direction: rtl}
            introduced_tokens: [سیب]
          - content_key: fa.a1.unit08.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a1.unit08.lesson01.exercise01.recognize_shop
            type: multiple_choice
            tested_text: مغازه
            prompt: {target_blocks: [{text: مغازه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit08.lesson01.exercise02.recognize_price
            type: multiple_choice
            tested_text: قیمت
            prompt: {target_blocks: [{text: قیمت, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit08.lesson01.exercise03.recognize_takhfif_reading
            type: multiple_choice
            tested_text: تخفیف
            prompt: {target_blocks: [{text: تخفیف, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit08.lesson01.exercise04.match_shop_words
            type: matching_pairs
            tested_text: مغازه قیمت تخفیف سیب
            prompt: {target_blocks: []}
            pairs:
              - {left: مغازه, right: shop}
              - {left: قیمت, right: price}
              - {left: تخفیف, right: discount}
              - {left: سیب, right: apple}
          - content_key: fa.a1.unit08.lesson01.exercise05.order_shop_words
            type: word_order
            tested_text: قیمت و تخفیف
            prompt: {target_blocks: []}
            word_bank: [قیمت, و, تخفیف]
          - content_key: fa.a1.unit08.lesson01.exercise06.translate_discount
            type: translation
            tested_text: تخفیف
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit08.lesson01.exercise07.write_apple
            type: writing_prompt
            tested_text: سیب
            prompt: {target_blocks: [{text: "Write the Farsi word for apple.", language_code: en, direction: ltr}]}

      - content_key: fa.a1.unit08.lesson02.asking_the_price
        title: پرسیدن قیمت
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
