            type: matching_pairs
            tested_text: این چنده کیلویی سی تومنه تومن
            prompt: {target_blocks: []}
            pairs:
              - {left: "این چنده؟", right: "How much is this?"}
              - {left: "کیلویی سی تومنه", right: "It's 30 toman per kilo."}
              - {left: این, right: this}
              - {left: چنده, right: "how much is it"}
              - {left: کیلویی, right: "per kilo"}
              - {left: سی, right: thirty}
              - {left: تومن, right: toman}
          - content_key: fa.a1.unit08.lesson02.exercise05.order_how_much
            type: word_order
            tested_text: این چنده
