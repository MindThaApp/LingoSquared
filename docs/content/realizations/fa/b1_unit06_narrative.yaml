generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked firecrawl
    availability fresh before starting: `firecrawl search` returned HTTP
    402 (credits exhausted), same result as every prior check this cycle.
    No adaptable Persian intermediate-level public-domain source exists
    for a narrative/reported-speech outcome (see b1_unit01-05's own
    provenance notes on the FSI Persian Basic Course's beginner-only
    scope). Authored from general Persian grammar knowledge, same as fa's
    other B1 units.

    This is fa's SIXTH B1 unit. Grammar target has two parts, genuinely
    distinct from every prior fa B1 unit's single-construction focus: (1)
    وقتی که (when) + IMPERFECT background clause (می‌رفتم, "I was going")
    contrasted against a PRETERITE main-line event (دیدم, "I saw") in the
    same sentence -- the classic background-vs-foreground tense contrast
    that marks real narrative sequencing, distinct from unit03's
    conditional-clause subordination; (2) PRETERITE of گفتن (to say) --
    گفتم/گفتی/گفت -- introducing a که-clause for genuine reported speech
    (گفت که دیر می‌رسه, "he said that he'd be late"), distinct from
    unit04's که-clause which reported a THOUGHT (فکر می‌کنم که) rather than
    a quoted UTTERANCE. Deliberately taught 1st/2nd/3rd singular only for
    گفتن's preterite, NOT the full six-person paradigm -- colloquial
    Persian's 3rd-person-plural preterite of گفتن is گفتن, homographic
    with the bare INFINITIVE گفتن, a genuine ambiguity not worth
    introducing at this stage when the singular forms alone already
    deliver the outcome's real target (recounting a personal
    conversation, not a group one).

    All vocabulary is introduced self-contained within this file (same
    convention as every other fa B1 unit) -- even the object marker رو
    and question word چرا, already taught in other fa files, are
    redeclared here.

    Character-cast continuity: reuses نیما (established protagonist since
    b1_unit02/03), رضا (established since b1_unit02/04), and سارا
    (established since b1_unit01/03/04/05) rather than inventing new
    names -- all three confirmed via grep against the fa corpus before
    writing. No prs file was opened or consulted while authoring this
    one.

    Lesson01 introduces the وقتی که + imperfect-vs-preterite background/
    foreground contrast in 1st person; lesson02 introduces گفتن's
    preterite (1st/2nd/3rd singular) plus reported-speech که; lesson03
    combines both into a single compound sentence plus negation
    (نگفت); lesson04 is a dialogue in which نیما recounts the event to
    سارا; lesson05 is a third-person reading recounting the same events;
    lesson06 is production-only wrap-up -- the same six-lesson arc
    established across every prior fa B1 unit.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude), cold, no access to the
    authoring reasoning above. Verified the narrative-sequencing grammar is
    correct colloquial Iranian Farsi: وقتی که + imperfect background clause
    (می‌رفتم) contrasted with a preterite main event (دیدم); reported speech
    گفت که دیر می‌رسه correctly retains the embedded present (Persian does not
    back-shift tense the way English does), genuinely distinct from unit04's
    reported-thought فکر می‌کنم که; preterite of گفتن taught singular-only,
    with the note honestly flagging the گفتن-plural/infinitive homograph as
    deliberately deferred. Negation نگفت correct. Reading passage recounts
    the dialogue's events in third person (می‌رفت/دید) with no contradiction.
    Cast (نیما, رضا, سارا) established in the fa corpus, no prs-name leak.
    Compiler validate AND compile both 0/0. Mechanical sweep clean (no
    Arabic kaf/yeh, no stray YAML booleans, no title>200, all exercise types
    registered, no jargon leaks, all accepted_answers value: keys present,
    matching_pairs/word_order shapes correct). B1-appropriate (background/
    foreground aspect contrast + reported speech).

