schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access
    before authoring this unit, per AUTHORING_GUIDE.md #10 and the standing
    instruction to re-check Firecrawl quota fresh even though it has been
    reported exhausted in every prior round this session. `firecrawl search
    "FSI Persian Basic Course zoo باغ‌وحش animals lion elephant"` returned
    `Error: Request failed with status code 402` (payment required),
    confirming the account genuinely remains at 0 credits. This worker
    session had no cached local pdftotext extraction inherited from any
    prior session (scratchpad directories are session-isolated), so it
    freshly fetched the same public-domain Live Lingua-hosted FSI Spoken
    Persian PDF directly via curl (8,753,270 bytes, the exact same byte
    count prior units' provenance notes report for this identical document)
    and ran `pdftotext -layout` locally (17,130 lines, 66,717 words -- also
    matching prior units' counts, confirming this is the same document, not
    a different edition). Grepped case-insensitively for zoo/elephant/lion/
    monkey/"wild animal"/"animal cage": found exactly two hits, neither a
    real zoo scenario -- "meymun" (monkey) is a single isolated vocabulary
    item inside a pure diphthong-illustration phonology table (a chart of
    example words for the "ey" diphthong, not a scenario or dialogue), and
    "sir" is glossed as a "milk; lion; faucet" homograph note appearing
    inside an unrelated hotel/plumbing dialogue about a broken hot-water
    faucet (the "faucet" sense is the one actually used there, not "lion",
    and there is zero connection to a zoo visit). FSI Persian's own 1960s
    diplomatic training course genuinely does not cover a zoo visit at all
    (same honest-nothing-found outcome as the park/museum/concert/gym/beach
    units before it). All vocabulary and the full dialogue in this unit are
    authored fresh from this project's own already-shipped vocabulary (see
    review notes below for the exact reuse chain).
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit56 (beach). Realizes
    universal.a1.zoo.visit_the_zoo -- confirmed as the correct next
    unrealized A1 outcome for fa by diffing every spine_outcome_id already
    used across every docs/content/realizations/fa/a1_unit*.yaml file
    (grep -h "spine_outcome_id:" per file, deduplicated: 57 distinct A1
    primary outcomes covered across units01-56 -- unit05 alone declares two,
    places + directions -- plus two A2 outcomes and one B1 outcome from this
    course's separate A2/B1 files) against every universal.a1.* id in
    docs/content/universal_spine.yaml's own declaration order (66 total A1
    ids, greetings through bookstore): fa has realized every A1 outcome
    through unit56 (beach) with zero gaps -- ids 1 through 57 in spine order
    (greetings ... beach) are all covered -- and universal.a1.zoo.
    visit_the_zoo is the very next A1 id declared in the spine immediately
    after beach.enjoy_a_day_at_the_beach. Prerequisite outcomes (animals.
    describe_pets_animals/unit26, plans.make_simple_plans/unit12) are both
    already realized in this course, so no prerequisite gap blocks this
    unit.

    Scenario shape: universal.a1.zoo.visit_the_zoo's prerequisite pair is
    animals + plans, NOT money (unlike museum/cinema/concert, whose own
    prerequisites include money.handle_basic_money_matters) -- so, per the
    same judgment call units 54/56 already made for their own weather+plans
    prerequisite pair, this unit does NOT introduce a new named service
    clerk. It reuses the established سارا/نیما friend pair (already paired
    together in the large majority of units since unit11, most recently
    park/unit54 and beach/unit56) for a friends'-plan dialogue with no
    transaction in the dialogue itself. The outcome's own read_zoo_sign
    assessment_requirement names "a ticket price, or a feeding time" (an
    "or," not a mandatory pair) -- lesson05's reading sign states a ticket
    price (بلیط پنجاه هزار تومن) and opening hours, matching units 41-56's
    service-sign convention on price/hours while keeping the friends'-plan
    dialogue itself transaction-free, the same shape unit56/beach's own
    sign used. Feeding time specifically was deliberately left off the sign
    (the outcome only requires ticket price OR feeding time, not both, and
    adding a "feeding time" fact would have required either inventing new
    vocabulary for "زمان"/"time" -- confirmed by grep to have never actually
    been taught as real vocabulary anywhere in the corpus, only ever
    appearing inside unrelated unit/section TITLE strings, which don't
    count as taught tokens -- or an awkward izafe-suffixed "غذای" form; the
    ticket-price half alone cleanly satisfies the requirement without
    either complication).

    Character/register choice: continuing سارا/نیما rather than switching to
    a different established pair (رضا/سارا, نگار/آرش, رضا/مریم, نرگس/علی --
    all used only in this course's earliest units, 07-10/22, before سارا/
    نیما became the settled recurring duo from unit11 onward) is a
    deliberate consistency choice, not unexamined repetition -- a real
    corpus-wide count (Python regex over every fa realization file's own
    `speaker:` fields) confirms سارا/نیما is this course's own established,
    intentional convention for every friends'-plan unit since unit11, the
    same reasoning unit56's own review note gave for reusing them.

    Zoo named ارم (باغ‌وحش ارم, "Eram Zoo," after Tehran's real,
    well-known city zoo) rather than reusing نور (already used for beach's
    "ساحل نور" two units ago, which would be confusing to reuse for an
    unrelated place two units later) or ملت (already used for park's
    "پارک ملت") -- confirmed collision-free via a real grep for the
    standalone token ارم across every fa realization/overlay file
    (excluding the many false-positive substring hits inside دارم/ندارم/
    کارمند/میارم/بیارم, checked individually): zero prior use as its own
    token anywhere in the corpus.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, confirmed with a real grep of every prior fa a1_unit*.yaml
    file's introduced_tokens declarations, not by eye): بریم (earliest:
    unit07, also unit12/54/56), می‌خوای (earliest: unit12), چطوره
    (earliest: unit01, also unit07/12/54/56), باشه (earliest: unit03),
    عالیه (earliest: unit07), کدوم (earliest: unit10, also unit04/14/28/
    38/41/43/51/53), رو (earliest: unit06, also unit26/31/40), یا
    (earliest: unit06), داره (earliest: unit26), بزرگه (earliest: unit26,
    "big"), دوست/داری/دارم (earliest: unit14's "کدوم رو دوست داری؟"/
    unit24's "دوست دارم" -- this unit reuses unit14's exact phrase
    verbatim as a callback), و (earliest: unit26), تو/چی (earliest:
    unit07's "فردا چی؟"), من (earliest: unit03), می‌بینمت (earliest:
    unit54, also unit56), بلیط (earliest: unit16, also 28/51), پنجاه
    (earliest: unit03), هزار/تومنه (earliest: unit03, also 21/46-56), از
    (earliest: unit01), ساعت (earliest: unit09), نه/پنج (earliest: unit03
    -- numbers nine/five), تا (earliest: unit03), بازه (earliest: unit24,
    also 27/43/49/55/56), چطور (earliest: unit01), بود (earliest: unit06),
    باحال (earliest: unit36), سارا (earliest: unit02, recurring
    character). New vocabulary genuinely introduced for the first time in
    the whole corpus: باغ‌وحش (zoo -- this unit's own topic word), شیر
    (lion), and فیل (elephant) -- exactly 3 new words, within this course's
    established 2-4 new-word-per-unit range (unit54: 3, unit55: 2, unit56:
    3). Confirmed both شیر and فیل are genuinely unclaimed via a real grep
    excluding false-positive substring hits (شیر never appears standalone
    anywhere in the corpus at all; فیل only ever appears as part of فیلم,
    "film/movie," never as its own token). One new inflected verb SURFACE
    form, not new vocabulary: ببینیم ("let's see," 1st-person-plural
    subjunctive of the already-taught دیدن, unit24's "to watch/to see") --
    the same kind of single-unit inflection extension unit54's بزنیم and
    unit55's داریم already established as acceptable, confirmed genuinely
    new via grep (zero prior use of ببینیم anywhere in the corpus).

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the zoo's animals (شیر و فیل, "a lion and an
    elephant") are named consistently across lesson02's teaching cards,
    the dialogue (lesson04, both سارا and نیما name exactly these same two
    animals and no others), and the reading sign (lesson05, "شیر و فیل
    داره") -- never contradicted anywhere in the unit. The ticket price
    (بلیط پنجاه هزار تومنه, "ticket 50,000 toman") and the opening hours
    (از ساعت نه تا پنج, 9 to 5) are stated only once, in lesson05's reading
    sign (the dialogue itself, per the scenario-shape note above, is a
    friends'-plan scene and never states a price or hours, so there is no
    second statement of these facts anywhere else in the unit to
    cross-check against -- the same single-authoritative-statement shape
    unit56/beach used for the identical reason). Every kind:vocabulary
    teaching item (باغ‌وحش, شیر, فیل) has an example sentence per schema
    1.1/AUTHORING_GUIDE §19, built only from the card's own word plus
    tokens already declared earlier in THIS file's document order (no
    forward references): "باغ‌وحش بریم؟" (باغ‌وحش's example) only uses
    بریم, declared on the immediately preceding review card in this same
    lesson01; "باغ‌وحش شیر داره." (شیر's example) only uses باغ‌وحش
    (lesson01) and داره, declared on the immediately preceding review card
    in this same lesson02; "باغ‌وحش فیل داره." (فیل's example) only uses
    باغ‌وحش (lesson01), فیل (this same card, self-reference on first
    declaration, matching unit54/55/56's own precedent for a card's own
    first-declared word), and داره (same preceding review card as شیر's
    example). Every matching_pairs exercise has 6-8 pairs per §16
    (lesson01: 6, lesson02: 6, lesson03: 6, lesson04: 6 dialogue-line
    pairs matching the dialogue's own 6 turns, lesson05: 8, lesson06: 6).
    No listen_type/listen_select/listen_order exercise is used anywhere in
    this unit -- fa has real Azure TTS per AUTHORING_GUIDE §14 (this
    restriction is prs-only, not fa+prs), but this file continues the
    established text-based corpus-consistency pattern from units 19-56,
    the same choice those units' own reviews made. No fill_in_blank
    exercise is used either, matching units 54-56's own choice, avoiding
    any §17 ambiguity-check exposure entirely. The spine outcome's own
    "listening" assessment requirement (identify which animal or detail is
    stated in a short zoo exchange) is covered via lesson04's
    dialogue_comprehension exercise, the same interpretation units 41-56
    already established for their own "listening" assessment coverage
    without a literal audio exercise type. Checked the
    same-speaker/same-audio distractor-collision bug class (found and
    fixed 2026-07-09 in the nl corpus, commit 148240e) anyway, per the
    standing instruction to list every line each speaker says before
    writing any distractor: نیما says "سارا، می‌خوای بریم باغ‌وحش؟"/"فیل
    رو دوست دارم. تو چی؟"/"باشه، بریم!"; سارا says "باشه، عالیه! کدوم رو
    دوست داری، شیر یا فیل؟"/"من شیر رو دوست دارم. بریم شیر و فیل
    ببینیم!"/"می‌بینمت." -- lesson04's dialogue_comprehension exercise
    asks what سارا proposes when she says "کدوم رو دوست داری، شیر یا
    فیل؟", with distractors ("She asks what time the zoo opens."/"She asks
    how much the ticket costs."/"She asks if Nima wants to go home.") that
    are plausible-fact alternatives, NOT lines either speaker actually says
    or facts either speaker actually states anywhere in this unit's
    DIALOGUE (the ticket price and hours are stated only in the separate
    lesson05 reading sign, a different exercise/audio entirely, so there is
    no cross-exercise collision within the dialogue's own audio) -- the
    zoo's opening time, the ticket cost, and going home are never mentioned
    by either character in the dialogue, so there is no collision. The
    dialogue_response exercise (lesson04) accepts نیما's own actual next
    line ("باشه، بریم!", with a punctuation-variant also accepted), not a
    distractor set, so the same-speaker-collision question doesn't apply to
    it. Every "Translate into English" exercise in the paired overlay
    explicitly sets answer_language_code: en. No exercise in this unit
    tests a genuine two-clause sentence joined by "and"/comma (§12) --
    every multi-sentence teaching/review line (lesson04's dialogue lines,
    lesson05's reading sign, lesson06's wrap-up review) is authored as two
    or three separate short sentences, matching how units 44-56 already
    treat their own multi-sentence notes, with paraphrase-variant accepted
    answers rather than clause-join variants. Ran a recursive scan (grep
    for bare, unquoted yes/no/true/false/on/off tokens as YAML scalar
    values, plus a full yaml.safe_load parse of both this file and its
    paired overlay confirming every value that loaded is a str/list/dict,
    never a Python bool anywhere in a learner-facing field) for bare
    unquoted yes/no/true/false/on/off values (including matching_pairs
    right: values specifically) -- zero hits, see the overlay's own review
    note for the exact scan result. Ran a Persian-vs-Arabic codepoint scan
    (grep for Arabic kaf U+0643 and Arabic yeh U+064A across both files) --
    zero hits, all keheh/yeh in this file use the correct Persian-range
    codepoints (U+06A9/U+06CC).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: سارا and
    نیما, both already-established recurring friend characters (paired
    together in the large majority of units since unit11, most recently
    unit54/unit56), keep their usual informal register while making a zoo
    plan. Reuses بریم (unit07/12/54/56), می‌خوای (unit12), چطوره
    (unit01/07/12/54/56), باشه (unit03), عالیه (unit07), کدوم (unit10),
    رو (unit06), یا (unit06), داره/بزرگه (unit26), دوست/داری/دارم
    (unit14/24), و (unit26), تو/چی (unit07), من (unit03), می‌بینمت
    (unit54/56), بلیط (unit16), پنجاه/هزار/تومنه (unit03), از (unit01),
    ساعت (unit09), نه/پنج (unit03), تا (unit03), بازه (unit24), چطور
    (unit01), بود (unit06), باحال (unit36) without re-teaching any of it
    from scratch. No word is given a new sense beyond its existing corpus
    meaning in this unit.

media_assets:
  - content_key: fa.a1.unit57.audio.zoo.vocab.01
    language: fa
    text: "باغ‌وحش، شیر، فیل"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit57.audio.dialogue.zoo.01
    language: fa
    text: "نیما: سارا، می‌خوای بریم باغ‌وحش؟ سارا: باشه، عالیه! کدوم رو دوست داری، شیر یا فیل؟ نیما: فیل رو دوست دارم. تو چی؟ سارا: من شیر رو دوست دارم. بریم شیر و فیل ببینیم! نیما: باشه، بریم! سارا: می‌بینمت."
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit57.zoo
    title: باغ‌وحش
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.zoo.visit_the_zoo
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit57.lesson01.new_zoo_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.zoo.visit_the_zoo
        teaching:
          - content_key: fa.a1.unit57.lesson01.teach.review_beriim_mikhaay
            kind: grammar_note
            target: {text: "بریم (let's go) -- already taught from unit07/12/54/56 / می‌خوای (do you want) -- already taught from unit12", language_code: fa, direction: rtl}
            introduced_tokens: [بریم, "می‌خوای"]
          - content_key: fa.a1.unit57.lesson01.teach.review_chetore
            kind: grammar_note
            target: {text: "چطوره (how is it) -- already taught from unit01/07/12/54/56", language_code: fa, direction: rtl}
            introduced_tokens: [چطوره]
          - content_key: fa.a1.unit57.lesson01.teach.review_bashe_aaliye
            kind: grammar_note
            target: {text: "باشه (okay) -- already taught from unit03 / عالیه (great) -- already taught from unit07", language_code: fa, direction: rtl}
            introduced_tokens: [باشه, عالیه]
          - content_key: fa.a1.unit57.lesson01.teach.baghvahsh
            kind: vocabulary
            target: {text: "باغ‌وحش", language_code: fa, direction: rtl}
            introduced_tokens: ["باغ‌وحش"]
            example: {text: "باغ‌وحش بریم؟", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit57.lesson01.exercise01.recognize_baghvahsh
            type: multiple_choice
            tested_text: "باغ‌وحش"
            prompt: {target_blocks: [{text: "باغ‌وحش", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit57.lesson01.exercise02.recognize_baghvahsh_beriim
            type: multiple_choice
            tested_text: "باغ‌وحش بریم؟"
            prompt: {target_blocks: [{text: "باغ‌وحش بریم؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit57.lesson01.exercise03.match_zoo_one
            type: matching_pairs
            tested_text: "بریم می‌خوای چطوره باشه عالیه باغ‌وحش"
            prompt: {target_blocks: []}
            pairs:
              - {left: بریم, right: "let's go"}
              - {left: "می‌خوای", right: "do you want"}
              - {left: چطوره, right: "how is it"}
              - {left: باشه, right: okay}
              - {left: عالیه, right: great}
              - {left: "باغ‌وحش", right: zoo}
          - content_key: fa.a1.unit57.lesson01.exercise04.word_order_baghvahsh_beriim
            type: word_order
            tested_text: "باغ‌وحش بریم"
            prompt: {target_blocks: [{text: "Let's go to the zoo.", language_code: en, direction: ltr}]}
            word_bank: ["باغ‌وحش", بریم]
          - content_key: fa.a1.unit57.lesson01.exercise05.translate_baghvahsh_chetore
            type: translation
            tested_text: "باغ‌وحش چطوره؟"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit57.lesson02.new_zoo_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.zoo.visit_the_zoo
        teaching:
          - content_key: fa.a1.unit57.lesson02.teach.review_kodum_ro_ya
            kind: grammar_note
            target: {text: "کدوم (which) -- already taught from unit10 / رو (object marker) -- already taught from unit06 / یا (or) -- already taught from unit06", language_code: fa, direction: rtl}
            introduced_tokens: [کدوم, رو, یا]
          - content_key: fa.a1.unit57.lesson02.teach.review_dare_bozorge
            kind: grammar_note
            target: {text: "داره (it has) -- already taught from unit26 / بزرگه (it's big) -- already taught from unit26", language_code: fa, direction: rtl}
            introduced_tokens: [داره, بزرگه]
          - content_key: fa.a1.unit57.lesson02.teach.shir
            kind: vocabulary
            target: {text: شیر, language_code: fa, direction: rtl}
            introduced_tokens: [شیر]
            example: {text: "باغ‌وحش شیر داره.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit57.lesson02.teach.fil
            kind: vocabulary
            target: {text: فیل, language_code: fa, direction: rtl}
            introduced_tokens: [فیل]
            example: {text: "باغ‌وحش فیل داره.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit57.lesson02.exercise01.recognize_shir
            type: multiple_choice
            tested_text: شیر
            prompt: {target_blocks: [{text: شیر, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit57.lesson02.exercise02.recognize_fil
            type: multiple_choice
            tested_text: فیل
            prompt: {target_blocks: [{text: فیل, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit57.lesson02.exercise03.match_zoo_two
            type: matching_pairs
            tested_text: "کدوم رو یا داره شیر فیل"
            prompt: {target_blocks: []}
            pairs:
              - {left: کدوم, right: which}
              - {left: رو, right: "(object marker)"}
              - {left: یا, right: or}
              - {left: داره, right: "it has"}
              - {left: شیر, right: lion}
              - {left: فیل, right: elephant}
          - content_key: fa.a1.unit57.lesson02.exercise04.word_order_baghvahsh_shir_dare
            type: word_order
            tested_text: "باغ‌وحش شیر داره"
            prompt: {target_blocks: [{text: "The zoo has a lion.", language_code: en, direction: ltr}]}
            word_bank: ["باغ‌وحش", شیر, داره]
          - content_key: fa.a1.unit57.lesson02.exercise05.translate_fil_bozorge
            type: translation
            tested_text: "فیل بزرگه"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit57.lesson03.suggest_animal
        title: "پیشنهاد حیوان"
        spine_outcome_id: universal.a1.zoo.visit_the_zoo
        teaching:
          - content_key: fa.a1.unit57.lesson03.teach.review_doost_daari_daram
            kind: grammar_note
            target: {text: "دوست داری (do you like) -- already taught from unit14 / دوست دارم (I like) -- already taught from unit14/24", language_code: fa, direction: rtl}
            introduced_tokens: [دوست, داری, دارم]
          - content_key: fa.a1.unit57.lesson03.teach.review_va
            kind: grammar_note
            target: {text: "و (and) -- already taught from unit26", language_code: fa, direction: rtl}
            introduced_tokens: ["و"]
          - content_key: fa.a1.unit57.lesson03.teach.phrase_kodum_shir_ya_fil
            kind: phrase
            target: {text: "کدوم رو دوست داری، شیر یا فیل؟", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.a1.unit57.lesson03.teach.phrase_beriim_shir_fil_bebinim
            kind: phrase
            target: {text: "بریم شیر و فیل ببینیم!", language_code: fa, direction: rtl}
            introduced_tokens: [ببینیم]
        exercises:
          - content_key: fa.a1.unit57.lesson03.exercise01.recognize_kodum_shir_ya_fil
            type: multiple_choice
            tested_text: "کدوم رو دوست داری، شیر یا فیل؟"
            prompt: {target_blocks: [{text: "کدوم رو دوست داری، شیر یا فیل؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit57.lesson03.exercise02.recognize_beriim_shir_fil_bebinim
            type: multiple_choice
            tested_text: "بریم شیر و فیل ببینیم!"
            prompt: {target_blocks: [{text: "بریم شیر و فیل ببینیم!", language_code: fa, direction: rtl}]}
