  - content_key: fa.a1.audio.animals.pets.01
    language: fa
    text: "حیوان، حیوان خونگی، سگ، گربه، پرنده، ماهی"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.animals.colors_sizes.01
    language: fa
    text: "سفید، کوچیک، بزرگ، خوشگل"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.dialogue.animals.01
    language: fa
    text: "نیما: این گربه‌ی کیه؟ سارا: گربه‌ی منه. اسمش پشمکه. نیما: چه رنگیه؟ سارا: سفیده و کوچیکه. نیما: خیلی خوشگله! سارا: ممنون!"
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
