generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at genuine FSI Persian Basic Course source
    text this pass (not reused from unit24/unit25's prior findings, a
    genuinely new fetch+read this session). Fetched
    https://fsi-languages.yojik.eu/languages/FSI/Persian/Spoken%20Persian.PDF
    (ERIC ED053628, "Persian Basic Course: Units 1-12", Obolensky/Yazdan
    Panah/Khaje Nouri, FSI/Center for Applied Linguistics, May 1963) as a
    real PDF (WebFetch's text extraction failed outright on this scanned
    JBIG2-compressed document, confirming it is truly a scanned source and
    not something a naive fetch could have faked past) and read its actual
    table-of-contents page images directly (pages 1-8, via a genuine
    Read-tool page-image extraction of the downloaded PDF). Re-confirmed
    the same structural fact units 24/25 each found independently: all 12
    units are organized entirely by GRAMMATICAL progression (Unit 1
    pronunciation/spelling; Unit 2 verb endings/prefixes; Unit 3 pronouns;
    Unit 4 comparative/superlative suffix -tar; Unit 5 degrees of
    politeness; Unit 6 prepositions/tenses; Unit 7 passive voice/counters;
    Unit 8 past perfect/progressive; Unit 9 causative suffix; Unit 10 the
    verb neshastan/imperative; Unit 11 expressions of time -- see the
    actual table of contents read this pass), never by vocabulary topic.
    No unit is dedicated to pets or animals; the closest adjacent material
    is Unit 9's causative-suffix drills, which happen to use arbitrary verb
    objects and are not a coherent animal/pet scenario to adapt. Given this
    is now a third, independently-confirmed structural fact about the
    source, authored using this project's own established fa register/
    character conventions instead, per docs/content/AUTHORING_GUIDE.md's
    modernization standard.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude, zero access to the original
    authoring reasoning) found and fixed TWO real issues, both in
    lesson06.exercise01.dialogue_comprehension_context, same bug class as
    fa unit23/unit24/unit25's own fresh-context reviews: (1) an English
    correct_option/distractors block had been duplicated directly into
    this fa (target-language) realization file, identical to what the
    overlay already carried -- confirmed via scripts/compile_content.py
    that the compiled-exercise builder only ever reads correct_option/
    distractors from exercise_overlay, so this was pure dead English data
    in a file that should be Farsi-only; removed it. (2) media_assets
    already declared a real dialogue audio asset
    (fa.a1.audio.dialogue.animals.01) but no exercise ever referenced it
    via media_asset_key, unlike unit21/unit22's own established wiring
    pattern -- fixed by adding
    media_asset_key: fa.a1.audio.dialogue.animals.01 to that exercise, so
    the asset will actually play once recorded/synthesized. Everything
    else checked clean: no same-speaker distractor collisions (compiler's
    validate_same_speaker_dialogue_distractors passed with 0 errors); no
    stray unquoted YAML booleans; every exercise type used is registered
    in ExerciseRenderer.tsx; matching_pairs/word_order answer shapes
    correct; no jargon leaks; Pashmak's stated color/size (white, small)
    is mutually consistent across the lesson04 vocabulary, the lesson05
    reading passage, and the lesson06 dialogue and exercises; Farsi
    register and script read correctly throughout, including پشمک as an
    authentic (not transliterated) Iranian pet name. Re-validated clean
    standalone and as part of the full fa units 21-26 batch: 0 errors/0
    warnings.

    Original draft note (2026-07-09, Sonnet 5 fork): realizes
    universal.a1.animals.describe_pets_animals (prerequisite:
    universal.a1.preferences.express_preferences, covered by unit14 --
    reuses its established دوست دارم/دارم/داره patterns rather than
    teaching a new construction). Fa's next uncovered A1 outcome after
    unit25 (appearance) -- confirmed by an exact diff of every
    spine_outcome_id used across all fa realization files against every
    A1-level `id:` in docs/content/universal_spine.yaml (26 distinct A1
    outcomes covered across units01-25; animals is the next one in spine
    declaration order after appearance -- directions/A1 remains
    unit05-merged, so animals really is the first genuinely uncovered A1
    id). Continues the نیما/سارا recurring cast from units 11-14/23-25,
    introducing one incidental new proper noun (پشمک, a common real
    Iranian pet name literally meaning "cotton candy" -- authentic
    register choice, not a transliterated English name) as سارا's own cat,
    never a speaking character. Scoped to: naming pets/animals (سگ dog,
    گربه cat, پرنده bird, ماهی fish), the question حیوان خونگی داری؟ (do
    you have a pet), a pet's name (اسمش چیه؟, reusing the -ش possessive
    suffix precedent from unit25's قدش/موهاش/چشماش and the
    اسم/اسمم/اسمت family from unit02), basic care (غذا می‌دم/می‌ده,
    reusing غذا from unit06 and the می‌دم verb form already seen in
    unit24's گوش می‌دم), color/size description reusing unit25's چه
    رنگیه؟ question pattern plus unit19's کوچیک/بزرگ and unit20's سفید,
    a short reading passage about سارا's cat پشمک, and a closing نیما/سارا
    dialogue where نیما notices و admires پشمک. Grammatical notes for the
    fresh-context reviewer: (1) دارم/داره's negative family ندارم/نداره is
    explicitly re-taught alongside the affirmative forms in lesson01
    (matching unit04's own dialogue precedent, which already used
    ندارم/داره together) so a "no, I don't have a pet" answer is
    genuinely gradable, not just the affirmative; (2) consonant-final
    possessives use the fused -م/-ش suffix directly (سگم my dog, سگمه
    it's my dog) while the vowel-final گربه uses the ezafe construction
    (گربه‌ی من my cat, گربه‌ی کیه؟ whose cat), matching unit19's own
    established خونه‌ی من precedent for vowel-final nouns rather than an
    invented fused form; (3) هر روز (unit11) and رو-as-object-marker
    (unit14) are both re-declared as review tokens at their first use in
    THIS file per the standing per-file untaught-vocabulary gotcha, same
    as every other reused cross-unit word here. Matches the spine
    outcome's 4 assessment_requirements exactly (listening via lesson06's
    dialogue_comprehension -- reading-visible per the same precedent
    units 13/24/25's fresh-context reviews accepted, since audio remains
    pending_generation; speaking via the dialogue_response exercise;
    reading via lesson05's reading_comprehension pair; writing via the
    writing_prompt exercises in lessons05/06). matching_pairs pair counts
    grow across the unit by pooling cumulative in-unit vocabulary (4/6/7/
    8/8/8 pairs, lessons 1-6) per AUTHORING_GUIDE.md #16 -- lesson01 stays
    smallest as the genuine first-lesson ceiling, matching the
    unit11/unit12/unit23/unit24/unit25 precedent for a unit's own first
    lesson. Deliberately zero listen_type/listen_select/listen_order
    exercises anywhere, despite §14's 2026-07-06 revision technically
    permitting fa audio content now that Azure TTS covers Farsi --
    consistent, documented corpus-wide choice matching units 17/18/24/25
    (audio remains pending_generation, not yet a live recorded/TTS-backed
    asset for this specific new content). Not self-certified -- needs the
    mandatory fresh-context review before shipping, same as every other
    Claude-authored fa unit. Per this session's standing compiler
    gotcha (the untaught-vocabulary check is per-file only, tested_text
    scoped): every already-taught word reused from an earlier unit
    (دارم/داره/ندارم/نداره+من+او/units01-04, اسم/unit02, کیه/unit04,
    غذا+خیلی/unit06, هر+روز/unit11, رو+آره/unit14, خونه‌ی-style ezafe
    pattern/unit19, کوچیک+بزرگ/unit19, سفید/unit20, چه+رنگیه/unit25) is
    re-declared as an introduced_tokens review token at its first
    tested_text use in THIS file; every teaching-card `example:` sentence
    is exempt from this check (validator only scopes tested_text) but was
    still written to be genuinely comprehensible from already-established
    vocabulary wherever practical.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-14/21-25. Reuses unit02's اسم family,
    unit04's دارم/داره/ندارم/نداره family, unit06's غذا/خیلی, unit11's
    هر روز, unit14's رو/آره, unit19's کوچیک/بزرگ/ezafe possessive pattern,
    unit20's سفید, unit25's چه رنگیه؟ question and -ش possessive suffix,
    and unit11-14's نیما/سارا cast without re-teaching the underlying
    constructions, only the new vocabulary that combines with them.

