        spine_outcome_id: universal.a1.animals.describe_pets_animals
        teaching:
          - content_key: fa.a1.unit26.lesson01.teach.man_review
            kind: grammar_note
            target: {text: من, language_code: fa, direction: rtl}
            introduced_tokens: [من]
          - content_key: fa.a1.unit26.lesson01.teach.oo_review
            kind: grammar_note
            target: {text: او, language_code: fa, direction: rtl}
            introduced_tokens: [او]
          - content_key: fa.a1.unit26.lesson01.teach.daram_family_review
            kind: grammar_note
            target: {text: "دارم / داره / ندارم", language_code: fa, direction: rtl}
            introduced_tokens: [دارم, داره, ندارم, نداره]
          - content_key: fa.a1.unit26.lesson01.teach.heyvan_word
            kind: vocabulary
            target: {text: حیوان, language_code: fa, direction: rtl}
            introduced_tokens: [حیوان]
            example: {text: "گربه یک حیوانه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit26.lesson01.teach.heyvane_khoonegi_phrase
            kind: phrase
            target: {text: "حیوان خونگی", language_code: fa, direction: rtl}
            introduced_tokens: [خونگی]
          - content_key: fa.a1.unit26.lesson01.teach.sag_word
            kind: vocabulary
            target: {text: سگ, language_code: fa, direction: rtl}
            introduced_tokens: [سگ]
            example: {text: "من سگ دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit26.lesson01.teach.gorbe_word
            kind: vocabulary
            target: {text: گربه, language_code: fa, direction: rtl}
            introduced_tokens: [گربه]
            example: {text: "او گربه داره.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit26.lesson01.exercise01.recognize_sag
            type: multiple_choice
            tested_text: سگ
            prompt: {target_blocks: [{text: سگ, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit26.lesson01.exercise02.recognize_gorbe
            type: multiple_choice
            tested_text: گربه
            prompt: {target_blocks: [{text: گربه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit26.lesson01.exercise03.match_pets_vocab
            type: matching_pairs
            tested_text: "حیوان حیوان خونگی سگ گربه اسم کوچیک بزرگ"
            prompt: {target_blocks: []}
            pairs:
              - {left: حیوان, right: animal}
              - {left: "حیوان خونگی", right: pet}
              - {left: سگ, right: dog}
              - {left: گربه, right: cat}
              - {left: اسم, right: name}
