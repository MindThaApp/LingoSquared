generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Firecrawl remains at 0 credits this session.
    Tried WebFetch directly against the Live Lingua-hosted copy
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf) first,
    per this task's explicit instruction to try WebFetch before falling
    back to local extraction -- it returned only a binary-content notice
    ("compressed object streams with encoded data... not readable as plain
    text"), no usable text, consistent with this PDF needing a real text
    layer extracted locally rather than summarized by a fetch-and-model
    pipeline. Fell back to downloading the PDF directly and running
    `pdftotext -layout` locally (the same Live Lingua mirror every prior
    fa unit this session has used, since it carries a real Acrobat Pro DC
    OCR text layer, unlike the DigitalOcean mirror's JBIG2-only scan) --
    this extracted 66,717 words, exactly matching every prior fetch of the
    same file (units 36-44), confirming the extraction is stable and
    complete, not a truncated fetch. Grepped the full extracted text
    case-insensitively for pharmac/medicine/drug/prescription/dosage/
    headache/fever/pill/tablet/drugstore/chemist: zero hits, a genuine dead
    end (unlike unit44's hotel search, which found 137 real hits). A
    broader grep for sick/illness/doctor/hospital/health found only
    scattered vocabulary-list entries (e.g. a glossary line pairing
    "doktor" with "doctor," a few isolated "health"/"hil" phonetic-drill
    entries), no structured pharmacy, medicine-request, or dosage-
    instruction dialogue anywhere in the extracted text. This is
    consistent with unit17's own review, which already covered this
    source's general "describe how you feel" health content -- the FSI
    course simply has no pharmacy-specific material at all, not a
    extraction failure. All pharmacy vocabulary and the full dialogue in
    this unit (داروخانه, قرص, قبل, روزی, and the pharmacist exchange) is
    authored fresh from this project's own established colloquial Iranian
    Farsi conventions and already-shipped vocabulary (see review notes
    below for the exact reuse chain), since no such content exists in the
    FSI source.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed the same
    class of real cross-unit character-name collision documented in
    unit44's own review note: this file's review notes claimed the
    pharmacist خانم رضایی was confirmed collision-free "via a real regex
    scan of every آقای/خانم name already used across the fa corpus," but
    that regex specifically only matched آقای/خانم-prefixed names, so it
    missed unit41's دکتر رضایی (Dr. Rezaei, the dentist referenced by
    name in that unit's appointment-booking dialogue) -- a دکتر-titled
    name, structurally invisible to that scan pattern. Fixed by renaming
    this unit's pharmacist from خانم رضایی to خانم صالحی throughout
    (dialogue lines, the dedicated character teaching card -- content_key
    renamed from ...teach.character_rezaei to ...teach.character_salehi
    in both this file and its overlay -- register-policy prose, and
    every matching_pairs/translation exercise referencing her); صالحی
    confirmed via a fresh corpus-wide grep (not just آقای/خانم-anchored)
    to collide with no other named character, including دکتر-titled
    ones, across the whole fa corpus. Also ran the same compiler-
    invisible example-forward-reference check described in unit43's
    review note against this file: clean, no unrelated-word forward
    references found (only the pharmacist's own newly-introduced surname
    ever triggered the naive scan, which is expected/correct).
    Re-validated clean after the rename (0 errors/0 warnings, standalone
    and as part of the 4-unit combined run). Everything else was checked
    clean: no same-speaker distractor collisions (lesson04's
    dialogue_comprehension distractors -- price, pharmacy location,
    seeing a doctor -- are never mentioned by either speaker; the
    before-food distractor was deliberately avoided since نیما does ask
    about taking it before food later in the same dialogue, correctly
    treated as a real collision risk by the original author); a real
    yaml.safe_load boolean-type walk found zero stray
    yes/no/true/false/on/off coercions; no Arabic-range kaf/yeh
    codepoints; matching_pairs accepted_answers use the established
    fa-corpus flat-dict convention, left as-is; every exercise type used
    is registered; no jargon leaks; the dosage fact (two pills a day,
    after food, not before) stays consistent across the dialogue, the
    reading note, and the wrap-up review; the Persian reads as natural,
    contemporary Iranian colloquial register throughout.

    Draft authored 2026-07-09 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit44 (accommodation, merged).
    Realizes universal.a1.pharmacy.buy_basic_medicine -- confirmed as the
    next unrealized A1 outcome by a real yaml.safe_load recursive scan
    (not grep) of every spine_outcome_ids/spine_outcome_id value across
    all docs/content/realizations/fa/a1_unit*.yaml files against every
    universal.a1.* id in docs/content/universal_spine.yaml: fa had realized
    45 of 51 A1 outcomes through unit44, with pharmacy, personal_care,
    bike_rental, laundry, swimming_pool, restaurant, and cinema remaining
    -- pharmacy is the first of these in the spine's own declaration order
    (accommodation -> pharmacy -> personal_care -> bike_rental -> laundry
    -> swimming_pool -> restaurant -> cinema), so this unit covers it;
    personal_care/bike_rental/laundry/swimming_pool/restaurant/cinema
    remain unrealized after this unit. The universal.a1.pharmacy.
    buy_basic_medicine outcome itself is not new -- it was added earlier
    this session by the nl (Dutch) content lane (git log confirms nl
    unit50 "Add nl unit50 (pharmacy: buying medicine)" is its origin), so
    no new spine outcome needed adding here, just fa catching up to an
    outcome that already exists. Prerequisite outcomes
    (health.describe_basic_problem/unit17, shopping.ask_prices_quantities/
    unit08, numbers.use_basic_numbers/unit03) are all already realized in
    this course, so no prerequisite gap blocks this unit.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, which validates each exercise's tested_text against tokens
    introduced anywhere earlier in the SAME file's document order) --
    confirmed with a real Python yaml.safe_load scan of every prior fa
    a1_unit*.yaml file's introduced_tokens declarations, not by eye:
    سردرد/دارو (unit17), دارم (unit12), می‌خوام (unit03), کجاست (unit05),
    این (unit08), خوب (unit13), بعد (unit05), غذا (unit26), از (unit16/
    unit42), چند (unit03/unit04), تا/دو/نه (unit03), فقط (unit23),
    می‌تونم (unit20), هم (unit01), باشه (units01/02/06/17/22), ممنون
    (units01/17/22), خداحافظ (units01/05/16), سلام (unit01), خانم
    (unit41). New vocabulary genuinely introduced for the first time in
    the whole corpus: داروخانه (pharmacy), قرص (pill/tablet), قبل
    (before), and روزی (per day/daily) -- exactly 4 new words, this unit's
    own deliberate low-new-vocabulary choice given how much directly
    relevant vocabulary (سردرد، تب، دارو، دارم، می‌خوام) unit17 (health)
    and unit08 (shopping) already established; the contraction خوبه ("is
    good," colloquial contraction of خوب است) is declared alongside its
    base-form خوب review card, the same pattern unit44 used for
    "آماده‌ست"/"صبحانه‌ست." No new verb-conjugation pattern is
    introduced -- every verb form used (دارم, می‌خوام, می‌تونم) was
    already established by an earlier unit.

    Register/character choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring character, previously the patient in unit17's
    own health dialogue with سارا) is the pharmacy customer, a natural
    continuation of his established "describes symptoms, gets advice"
    role. A NEW formal-register character, خانم صالحی, is introduced as
    the pharmacist (distinct surname from unit41's خانم احمدی, unit42's
    آقای صادقی, and unit44's آقای کریمی -- confirmed via a real regex
    scan of every آقای/خانم name already used across the fa corpus, zero
    collision); she speaks in neutral polite service language (دارید-
    register is available but not needed in this exchange's actual
    lines), consistent with the receptionist/librarian/hotel-clerk
    register already established in units 41/42/44, while نیما keeps the
    same informal register he uses everywhere else in the corpus. Facts
    are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the dosage (two pills a day, after food, NOT
    before food) is stated identically in the dialogue (lesson04), the
    reading note (lesson05), and the wrap-up review (lesson06), and never
    contradicted -- lesson04's own dialogue explicitly has نیما ask about
    taking it before food and be told no, so the "after food only" fact is
    actively reinforced rather than just asserted once. Every
    kind:vocabulary card (داروخانه، قرص، قبل، روزی) has an example
    sentence per schema 1.1/AUTHORING_GUIDE §19, built only from the
    card's own word plus tokens already declared earlier in THIS file (no
    forward references). Every matching_pairs exercise has 6-7 pairs per
    §16 (lesson01: 6, lesson02: 6, lesson03: 7, lesson04: 7 dialogue-line
    pairs matching the dialogue's own 7 turns, lesson05: 6, lesson06: 6).
    No listen_type/listen_select/listen_order exercise is used anywhere in
    this unit -- fa has real TTS per AUTHORING_GUIDE §14, but this file
    continues the established text-based corpus-consistency pattern from
    units 19-44, the same choice those units' own reviews made; this also
    means the same-speaker/same-audio distractor-collision bug class
    (found and fixed 2026-07-09 in the nl corpus, commit 148240e) cannot
    directly apply here -- there is no listen_select exercise in this file
    to check. Checked anyway, since lesson04's dialogue_comprehension
    exercise is the closest analogue: its three distractors ("He wants to
    know if the medicine is expensive."/"He wants to know where the
    pharmacy is."/"He wants to know if he needs to see a doctor.") are
    plausible-fact alternatives, NOT lines either dialogue speaker (نیما
    or خانم صالحی) actually says or facts either speaker actually states
    anywhere in this unit's dialogue -- price, the pharmacy's location, and
    seeing a doctor are never mentioned by either speaker in this dialogue
    at all. Deliberately avoided a distractor like "he wants to know if he
    can take it before food" precisely because نیما DOES ask that later in
    the same dialogue ("قبل از غذا هم می‌تونم؟") -- that would have been a
    real distractor/dialogue-content collision of the same shape as the
    documented same-speaker-audio footgun, even though this exercise isn't
    audio-based. Every "Translate into English" exercise in the paired
    overlay explicitly sets answer_language_code: en. No exercise in this
    unit tests a genuine two-clause sentence (§12) -- every translated
    sentence is a single clause or a colon-separated label-style note
    (lesson05's reading text, matching unit43/unit44's own treatment of
    their colon-separated notes with paraphrase-variant accepted answers
    rather than clause-join variants). Ran a recursive yaml.safe_load scan
    over this file and its paired overlay for bare unquoted yes/no/true/
    false/on/off values (including matching_pairs right: values
    specifically) -- zero hits, see the overlay's own review note for the
    exact scan result.

    Review 2026-10-21 (en-fa A1 pass): 1 fix - English right-hand side of
    the dialogue matching pair 'Can I also before food?' changed to 'Can I
    take it before food too?'. Script and ZWNJ scanned clean. NATIVE FLAGS:
    'روزی دو تا' on a printed label vs a written form; elliptical 'قبل از
    غذا هم می‌تونم؟'.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character, the patient in unit17's own health
    dialogue) keeps his usual informal register as the pharmacy customer.
    خانم صالحی, a new formal-register pharmacist character, speaks with
    neutral polite service language, consistent with the register unit41's
    خانم احمدی, unit42's آقای صادقی, and unit44's آقای کریمی already
    established for this course's other service-encounter characters.
    Reuses سردرد/دارو (unit17), دارم (unit12), می‌خوام (unit03), کجاست
    (unit05), این (unit08), خوب (unit13), بعد (unit05), غذا (unit26), از
    (unit16/unit42), چند/تا/دو/نه (unit03/unit04), فقط (unit23), می‌تونم
    (unit20), هم (unit01), باشه/ممنون/خداحافظ/سلام (units01/02/05/06/16/
    17/22), and خانم (unit41) without re-teaching any of it from scratch.
    No word is given a new sense beyond its existing corpus meaning in
    this unit.

