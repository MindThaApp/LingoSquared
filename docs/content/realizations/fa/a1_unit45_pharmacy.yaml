    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit45.pharmacy
    title: داروخانه
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.pharmacy.buy_basic_medicine
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit45.lesson01.new_pharmacy_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.pharmacy.buy_basic_medicine
        teaching:
          - content_key: fa.a1.unit45.lesson01.teach.review_sardard_daram
            kind: grammar_note
            target: {text: "سردرد (headache) / دارم (I have)", language_code: fa, direction: rtl}
            introduced_tokens: [سردرد, دارم]
          - content_key: fa.a1.unit45.lesson01.teach.review_daroo_mikhaam
            kind: grammar_note
            target: {text: "دارو (medicine) / می‌خوام (I want)", language_code: fa, direction: rtl}
            introduced_tokens: [دارو, "می‌خوام"]
          - content_key: fa.a1.unit45.lesson01.teach.review_kojast
            kind: grammar_note
            target: {text: "کجاست (where is)", language_code: fa, direction: rtl}
            introduced_tokens: [کجاست]
          - content_key: fa.a1.unit45.lesson01.teach.daroukhane
            kind: vocabulary
            target: {text: داروخانه, language_code: fa, direction: rtl}
            introduced_tokens: [داروخانه]
            example: {text: "داروخانه کجاست؟", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit45.lesson01.exercise01.recognize_daroukhane
            type: multiple_choice
            tested_text: داروخانه
            prompt: {target_blocks: [{text: داروخانه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit45.lesson01.exercise02.recognize_daroukhane_kojast
            type: multiple_choice
            tested_text: "داروخانه کجاست؟"
            prompt: {target_blocks: [{text: "داروخانه کجاست؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit45.lesson01.exercise03.match_pharmacy_one
            type: matching_pairs
            tested_text: "داروخانه دارو سردرد دارم کجاست می‌خوام"
            prompt: {target_blocks: []}
            pairs:
              - {left: داروخانه, right: pharmacy}
              - {left: دارو, right: medicine}
              - {left: سردرد, right: headache}
              - {left: دارم, right: "I have"}
              - {left: کجاست, right: "where is"}
              - {left: "می‌خوام", right: "I want"}
          - content_key: fa.a1.unit45.lesson01.exercise04.word_order_daroukhane_kojast
            type: word_order
            tested_text: "داروخانه کجاست"
            prompt: {target_blocks: [{text: "Where is the pharmacy?", language_code: en, direction: ltr}]}
            word_bank: [داروخانه, کجاست]
          - content_key: fa.a1.unit45.lesson01.exercise05.translate_daroo_mikhaam
            type: translation
            tested_text: "دارو می‌خوام."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit45.lesson02.new_pharmacy_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.pharmacy.buy_basic_medicine
        teaching:
          - content_key: fa.a1.unit45.lesson02.teach.review_in
            kind: grammar_note
            target: {text: "این (this)", language_code: fa, direction: rtl}
            introduced_tokens: [این]
          - content_key: fa.a1.unit45.lesson02.teach.review_khoob
            kind: grammar_note
            target: {text: "خوب (good) / خوبه (contracted 'is good') -- colloquial contraction of خوب است", language_code: fa, direction: rtl}
            introduced_tokens: [خوب, خوبه]
          - content_key: fa.a1.unit45.lesson02.teach.gors
            kind: vocabulary
            target: {text: قرص, language_code: fa, direction: rtl}
            introduced_tokens: [قرص]
            example: {text: "این قرص خوبه.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit45.lesson02.exercise01.recognize_gors
            type: multiple_choice
            tested_text: قرص
            prompt: {target_blocks: [{text: قرص, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit45.lesson02.exercise02.recognize_in_gors_khoobe
            type: multiple_choice
            tested_text: "این قرص خوبه."
            prompt: {target_blocks: [{text: "این قرص خوبه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit45.lesson02.exercise03.match_pharmacy_two
            type: matching_pairs
            tested_text: "قرص این خوب خوبه داروخانه دارو"
            prompt: {target_blocks: []}
            pairs:
              - {left: قرص, right: "pill / tablet"}
              - {left: این, right: this}
              - {left: خوب, right: good}
              - {left: خوبه, right: "is good"}
              - {left: داروخانه, right: pharmacy}
              - {left: دارو, right: medicine}
          - content_key: fa.a1.unit45.lesson02.exercise04.word_order_in_gors_khoobe
            type: word_order
            tested_text: "این قرص خوبه"
            prompt: {target_blocks: [{text: "This pill is good.", language_code: en, direction: ltr}]}
            word_bank: [این, قرص, خوبه]
          - content_key: fa.a1.unit45.lesson02.exercise05.translate_gors_mikhaam
            type: translation
            tested_text: "قرص می‌خوام."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit45.lesson03.dosage_timing
        title: "زمان مصرف دارو"
        spine_outcome_id: universal.a1.pharmacy.buy_basic_medicine
        teaching:
          - content_key: fa.a1.unit45.lesson03.teach.review_bad_ghaza
            kind: grammar_note
            target: {text: "بعد (after) / غذا (food, meal)", language_code: fa, direction: rtl}
            introduced_tokens: [بعد, غذا]
          - content_key: fa.a1.unit45.lesson03.teach.review_az
            kind: grammar_note
            target: {text: "از (from)", language_code: fa, direction: rtl}
            introduced_tokens: [از]
          - content_key: fa.a1.unit45.lesson03.teach.review_chand_ta_do
            kind: grammar_note
            target: {text: "چند (how many) / تا (counter word) / دو (two)", language_code: fa, direction: rtl}
            introduced_tokens: [چند, تا, دو]
          - content_key: fa.a1.unit45.lesson03.teach.review_na_faghat
            kind: grammar_note
            target: {text: "نه (no) / فقط (only)", language_code: fa, direction: rtl}
            introduced_tokens: [نه, فقط]
          - content_key: fa.a1.unit45.lesson03.teach.ghabl
            kind: vocabulary
            target: {text: قبل, language_code: fa, direction: rtl}
            introduced_tokens: [قبل]
            example: {text: "قبل از غذا", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit45.lesson03.teach.roozi
            kind: vocabulary
            target: {text: روزی, language_code: fa, direction: rtl}
            introduced_tokens: [روزی]
            example: {text: "روزی دو تا", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit45.lesson03.exercise01.recognize_ghabl
            type: multiple_choice
            tested_text: قبل
            prompt: {target_blocks: [{text: قبل, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit45.lesson03.exercise02.recognize_roozi_do_ta
            type: multiple_choice
            tested_text: "روزی دو تا"
            prompt: {target_blocks: [{text: "روزی دو تا", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit45.lesson03.exercise03.match_dosage_timing
            type: matching_pairs
            tested_text: "قبل بعد غذا روزی روزی دو تا قبل از غذا بعد از غذا"
            prompt: {target_blocks: []}
            pairs:
              - {left: قبل, right: before}
              - {left: بعد, right: after}
              - {left: غذا, right: "food, meal"}
              - {left: روزی, right: "per day, daily"}
              - {left: "روزی دو تا", right: "two a day"}
              - {left: "قبل از غذا", right: "before food"}
              - {left: "بعد از غذا", right: "after food"}
          - content_key: fa.a1.unit45.lesson03.exercise04.word_order_roozi_do_ta
            type: word_order
            tested_text: "روزی دو تا"
            prompt: {target_blocks: [{text: "Two a day.", language_code: en, direction: ltr}]}
            word_bank: [روزی, دو, تا]
          - content_key: fa.a1.unit45.lesson03.exercise05.translate_bad_az_ghaza
            type: translation
            tested_text: "بعد از غذا."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit45.lesson04.pharmacy_dialogue
        title: "دیالوگ: در داروخانه"
        spine_outcome_id: universal.a1.pharmacy.buy_basic_medicine
        teaching:
          - content_key: fa.a1.unit45.lesson04.teach.review_salam_mamnoon
            kind: grammar_note
            target: {text: "سلام و ممنون", language_code: fa, direction: rtl}
