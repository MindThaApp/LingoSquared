units:
  - content_key: fa.a1.unit47.bike_rental
    title: کرایه‌ی دوچرخه
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.bike_rental.rent_a_bicycle
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit47.lesson01.new_bike_rental_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.bike_rental.rent_a_bicycle
        teaching:
          - content_key: fa.a1.unit47.lesson01.teach.review_docharkhe
            kind: grammar_note
            target: {text: "دوچرخه (bicycle)", language_code: fa, direction: rtl}
            introduced_tokens: [دوچرخه]
          - content_key: fa.a1.unit47.lesson01.teach.review_mikhaam_ye
            kind: grammar_note
            target: {text: "می‌خوام (I want) / یه (a, an)", language_code: fa, direction: rtl}
            introduced_tokens: ["می‌خوام", یه]
          - content_key: fa.a1.unit47.lesson01.teach.review_kardan_konam
            kind: grammar_note
            target: {text: "کردن (to do) / کنم (that I do)", language_code: fa, direction: rtl}
            introduced_tokens: [کردن, کنم]
          - content_key: fa.a1.unit47.lesson01.teach.keraye
            kind: vocabulary
            target: {text: کرایه, language_code: fa, direction: rtl}
            introduced_tokens: [کرایه]
            example: {text: "می‌خوام یه دوچرخه کرایه کنم.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit47.lesson01.exercise01.recognize_keraye
            type: multiple_choice
            tested_text: کرایه
            prompt: {target_blocks: [{text: کرایه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit47.lesson01.exercise02.recognize_mikhaam_ye_docharkhe_keraye_konam
            type: multiple_choice
            tested_text: "می‌خوام یه دوچرخه کرایه کنم."
            prompt: {target_blocks: [{text: "می‌خوام یه دوچرخه کرایه کنم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit47.lesson01.exercise03.match_bike_rental_one
            type: matching_pairs
            tested_text: "کرایه دوچرخه می‌خوام یه کنم می‌خوام یه دوچرخه کرایه کنم"
            prompt: {target_blocks: []}
            pairs:
              - {left: کرایه, right: rent}
              - {left: دوچرخه, right: bicycle}
              - {left: "می‌خوام", right: "I want"}
              - {left: یه, right: a}
              - {left: کنم, right: "(that) I do"}
              - {left: "می‌خوام یه دوچرخه کرایه کنم.", right: "I want to rent a bicycle."}
          - content_key: fa.a1.unit47.lesson01.exercise04.word_order_mikhaam_ye_docharkhe_keraye_konam
            type: word_order
            tested_text: "می‌خوام یه دوچرخه کرایه کنم"
            prompt: {target_blocks: [{text: "I want to rent a bicycle.", language_code: en, direction: ltr}]}
            word_bank: ["می‌خوام", یه, دوچرخه, کرایه, کنم]
          - content_key: fa.a1.unit47.lesson01.exercise05.translate_docharkhe_keraye
            type: translation
            tested_text: "کرایه دوچرخه"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit47.lesson02.new_bike_rental_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.bike_rental.rent_a_bicycle
        teaching:
          - content_key: fa.a1.unit47.lesson02.teach.review_roozi_price
            kind: grammar_note
            target: {text: "روزی (per day) / پنج (five), هزار (thousand), تومن (toman)", language_code: fa, direction: rtl}
            introduced_tokens: [روزی, پنج, هزار, تومن, "تومنه"]
          - content_key: fa.a1.unit47.lesson02.teach.review_ham_mikhaad
            kind: grammar_note
            target: {text: "هم (also) / می‌خواد (it needs/wants) / ده (ten)", language_code: fa, direction: rtl}
            introduced_tokens: [هم, "می‌خواد", ده]
          - content_key: fa.a1.unit47.lesson02.teach.vadiye
            kind: vocabulary
            target: {text: ودیعه, language_code: fa, direction: rtl}
            introduced_tokens: [ودیعه]
            example: {text: "ده هزار تومن ودیعه می‌خواد.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit47.lesson02.exercise01.recognize_vadiye
            type: multiple_choice
            tested_text: ودیعه
            prompt: {target_blocks: [{text: ودیعه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit47.lesson02.exercise02.recognize_roozi_panj_hezar_tomane
            type: multiple_choice
            tested_text: "روزی پنج هزار تومنه."
            prompt: {target_blocks: [{text: "روزی پنج هزار تومنه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit47.lesson02.exercise03.match_bike_rental_two
            type: matching_pairs
            tested_text: "ودیعه روزی پنج هزار تومن ده می‌خواد"
            prompt: {target_blocks: []}
            pairs:
              - {left: ودیعه, right: deposit}
              - {left: روزی, right: "per day"}
              - {left: پنج, right: five}
              - {left: هزار, right: thousand}
              - {left: تومن, right: toman}
              - {left: ده, right: ten}
              - {left: "می‌خواد", right: "it needs"}
          - content_key: fa.a1.unit47.lesson02.exercise04.word_order_dah_hezar_toman_vadiye_mikhaad
            type: word_order
            tested_text: "ده هزار تومن ودیعه می‌خواد"
            prompt: {target_blocks: [{text: "It needs a 10,000 toman deposit.", language_code: en, direction: ltr}]}
            word_bank: [ده, هزار, تومن, ودیعه, "می‌خواد"]
          - content_key: fa.a1.unit47.lesson02.exercise05.translate_roozi_panj_hezar_tomane
            type: translation
            tested_text: "روزی پنج هزار تومنه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit47.lesson03.size_and_return
        title: "اندازه و پس دادن"
        spine_outcome_id: universal.a1.bike_rental.rent_a_bicycle
        teaching:
          - content_key: fa.a1.unit47.lesson03.teach.review_koochik_bozorg_ya
            kind: grammar_note
            target: {text: "کوچیک (small), بزرگ (big) / یا (or)", language_code: fa, direction: rtl}
