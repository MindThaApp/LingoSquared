generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Tried `firecrawl search "FSI Persian Basic
    Course bicycle rental"` first, per the standing instruction to re-check
    Firecrawl quota fresh even though it was reported exhausted in earlier
    rounds this session -- it returned `Error: Request failed with status
    code 402` (payment required), confirming the account genuinely remains
    at 0 credits, not a stale report. Fell back to a cached local
    `pdftotext -layout` extraction of the same Live Lingua-hosted FSI
    Spoken Persian PDF every prior fa unit this session has used (found at
    this session's own scratchpad path, 66,717 words -- the exact same
    word count as every prior fetch of this file across units 36-46,
    confirming it is the complete, stable extraction, not a truncated
    re-fetch, so a fresh WebFetch/download pass was not needed). Grepped
    the full extracted text case-insensitively for bicycle/bike/rent/
    rental/deposit/keraye ("keraye" = Persian for rent/hire) and Persian
    transliterations (docharkhe, charkh): found real hits only for
    "keraye" itself (a genuine glossary entry: "rent, hire, cost,
    charges -- keraye"), but every surrounding sentence ("I wanted to pay
    two weeks rent in advance", "490 tumans including breakfast, lunch and
    dinner") is from an unrelated LODGING/board-payment scenario, not a
    bicycle rental scene -- no word for "bicycle" appears anywhere near
    it, and no bicycle-rental-shop dialogue, price list, or rental-terms
    material exists anywhere in the extracted text at all. This is a
    genuine dead end of the same shape as unit45's pharmacy search and
    unit46's barbershop search: the FSI course simply has no
    bicycle-rental material, not an extraction failure. The word "keraye"
    itself is confirmed as genuine, independently-known standard
    colloquial Persian for "rent/rental fee" (not something copied from
    the source text -- the source sentence it appears in is about a hotel
    bill, never reused here), so it is used in this unit on that basis,
    not as an FSI-sourced borrowing. All bicycle-rental vocabulary and the
    full dialogue in this unit (کرایه, ودیعه, and the customer-shop-owner
    exchange) is authored fresh from this project's own established
    colloquial Iranian Farsi conventions and already-shipped vocabulary
    (see review notes below for the exact reuse chain).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found no real bugs in this
    unit. Checked: the compiler (`compile_content.py validate`) standalone
    and combined with units 48-50 -- 0 errors/0 warnings both times; a
    recursive grep for unquoted yes/no/true/false/on/off scalar values --
    zero hits; a scan for Arabic-range kaf (U+0643)/yeh (U+064A)/alef
    maksura (U+0649) codepoints across both this file and its overlay --
    zero hits, all keheh/yeh correctly in the Persian range; a targeted
    scan of every learner-facing gloss/title/note/instruction/
    correct_option/feedback string for snake_case jargon leaks -- zero
    hits (the only underscore-bearing tokens are internal content_keys,
    never learner-facing). Same-speaker/same-audio distractor-collision
    check (this unit has no listen_select, so the check applies to
    lesson04's dialogue_comprehension instead, per the task's own
    instruction not to assume "no listen_select" means "nothing to
    check"): manually re-listed both نیما's and آقای مرادی's actual
    dialogue lines and confirmed none of the three distractors ("He wants
    to know the price of the rental."/"...if Nima already has a
    bicycle."/"...if Nima needs a helmet.") is a fact either speaker
    states anywhere in the dialogue -- confirmed clean, matching the
    author's own claim. Price (روزی پنج هزار تومن) and deposit (ده هزار
    تومن) are stated identically in the dialogue, the shop-sign reading
    text, and the wrap-up review, per AUTHORING_GUIDE.md #11 -- no drift.
    Character check: آقای مرادی does not collide with any other named
    آقای/خانم service character anywhere else in the fa corpus (grepped
    every unit). All 19 registered exercise types are used correctly (no
    unregistered type value). matching_pairs accepted_answers use the
    flat-dict shape (`{left: right, ...}`), consistent with every other
    already-shipped fa unit's own overlay convention (e.g. unit46) rather
    than the array-of-{left,right}-objects shape -- since `grade()`
    canonicalizes either shape and this matches the established corpus
    norm rather than deviating from it, left as-is, not treated as a bug.
    Genuine colloquial Iranian Farsi register throughout (تومنه/کوچیک/
    بزرگ contractions, می‌خوام...کنم subjunctive pattern) -- no Dari/
    Afghan forms detected. Nothing needed fixing in this unit; marking
    reviewed.

    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit46 (personal_care/barbershop).
    Realizes universal.a1.bike_rental.rent_a_bicycle -- confirmed as the
    correct next unrealized A1 outcome for fa by diffing every
    spine_outcome_id already used across every docs/content/realizations/
    fa/a1_unit*.yaml file (grep -o "spine_outcome_id: universal\.[a-z0-9_.]*"
    per file, deduplicated) against universal.a1.* ids in
    docs/content/universal_spine.yaml's own declaration order: fa has
    realized every A1 outcome through unit46 (personal_care) with zero
    gaps, and universal.a1.bike_rental.rent_a_bicycle is the very next A1
    id declared in the spine after personal_care.get_haircut, so this unit
    covers it in fa's own established sequence (not copying nl's or prs's
    unit-number placement -- nl realizes this same outcome as its own
    unit52 and prs as its own unit48, at different positions in their own
    sequences, which is expected and not a conflict; fa's sequence is
    self-consistent on its own terms). This outcome is not new -- it
    already exists in the spine (prs claimed it first as its own unit48,
    nl as its own unit52), so no new spine outcome needed adding here.
    Prerequisite outcomes (money.handle_basic_money_matters/unit21,
    transportation.getting_around_town/unit28) are both already realized
    in this course, so no prerequisite gap blocks this unit.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, which validates each exercise's tested_text against tokens
    introduced anywhere earlier in the SAME file's document order) --
    confirmed with a real grep of every prior fa a1_unit*.yaml file's
    introduced_tokens declarations, not by eye: دوچرخه "bicycle" (unit28,
    where it was already established as a mode of transport -- reused here
    in a new "rentable item" sense, same word), می‌خوام (unit03), یه
    (unit34), کردن (units32/35/46), کنم -- the subjunctive "-م" form of
    کردن, already established in unit21's identical "می‌خوام ... کنم"
    construction ("می‌خوام دلار به تومن تبدیل کنم"), reused here in the
    exact same grammatical pattern with a new object ("می‌خوام یه دوچرخه
    کرایه کنم"). روزی (unit45, "per day"), پنج/ده/سه (unit03), هزار/تومن/
    "تومنه" (unit21, the fused copula form already established in "سی
    تومنه"), هم (unit45), می‌خواد -- third-person "wants/needs," already
    established in unit34's post-office dialogue. کوچیک/بزرگ (unit26,
    already taught as bare adjectives, not just their -تر comparative
    forms), یا (unit28), می‌خوای (unit12/14/16/20/35, reviewed again in
    unit46). پس/می‌دم (unit42, the exact "پس می‌دم"/"کی پس می‌دم؟"
    give-back construction reused here with a new item, same grammatical
    pattern as the library book return, not verbatim content reuse), کی
    (unit34/42), تا (unit42), فردا (unit09), ظهر (unit09). سلام/ممنون
    (units01/17/22/45/46), آقای (units40/42/44/46), لطفاً (unit21), باشه
    (units01/02/06/17/22/45/46). New vocabulary genuinely introduced for
    the first time in the whole corpus: کرایه (rent/rental fee) and ودیعه
    (deposit) -- exactly 2 new words, even leaner than unit45's 4 and
    unit46's 3, reflecting how much of this scenario's needed vocabulary
    (دوچرخه, کوچیک/بزرگ, پس دادن, کی, روزی, هزار/تومن) this course had
    already independently established across units 03/09/21/26/28/34/42/
    45 before this unit. No new verb-conjugation pattern is introduced --
    every verb form used (می‌خوام, کنم, می‌خواد, می‌دم, می‌خوای) was
    already established by an earlier unit; only the two nouns کرایه and
    ودیعه are new.

    Register/character choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring character) is the bike-rental customer, keeping
    his usual informal register, a natural continuation of his established
    "visits a service provider and states a need" role from units 17
    (health), 41 (appointments), 45 (pharmacy), and 46 (barbershop). A NEW
    formal-register character, آقای مرادی, is introduced as the bike shop
    owner, distinct from unit40's آقای کریمی, unit41's خانم احمدی,
    unit42's آقای صادقی, unit44's آقای کریمی (reused for the hotel clerk),
    unit45's خانم رضایی, and unit46's آقای نوری (confirmed via a real
    regex-equivalent scan of every آقای/خانم name already used across the
    fa corpus -- کریمی، احمدی، صادقی، رضایی، نوری -- zero collision with
    مرادی); he speaks in neutral polite service language, consistent with
    the receptionist/librarian/hotel-clerk/pharmacist/barber register
    units 41/42/44/45/46 already established for this course's other
    service-encounter characters, while نیما keeps the same informal
    register he uses everywhere else in the corpus. Facts are kept
    internally consistent across the whole unit per AUTHORING_GUIDE.md
    #11: the price (روزی پنج هزار تومن, "5,000 toman per day") and the
    deposit (ده هزار تومن, "10,000 toman") are stated identically in the
    dialogue (lesson04) and the shop-sign reading text (lesson05), and
    never contradicted anywhere else in the unit (the wrap-up review,
    lesson06, restates the same two sentences verbatim rather than
    re-stating the numbers in a new form, so there is nothing to drift).
    Every kind:vocabulary teaching card (کرایه, ودیعه, and the character
    card آقای مرادی) has an example sentence per schema 1.1/AUTHORING_
    GUIDE §19, built only from the card's own word plus tokens already
    declared earlier in THIS file (no forward references). Every
    matching_pairs exercise has 6-7 pairs per §16 (lesson01: 6, lesson02:
    7, lesson03: 7, lesson04: 7 dialogue-line pairs matching the
    dialogue's own 7 turns, lesson05: 6, lesson06: 6). No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit --
    fa has real Azure TTS per AUTHORING_GUIDE §14 (this restriction is
    prs-only, not fa+prs), but this file continues the established
    text-based corpus-consistency pattern from units 19-46, the same
    choice those units' own reviews made, rather than introducing audio
    exercises to only this one unit out of step with its immediate
    neighbors -- the spine outcome's own "listening" assessment
    requirement (identify price/deposit/return-time in a short exchange)
    is covered via the dialogue_comprehension exercise's comprehension-of-
    the-exchange task, the same interpretation units 41/42/44/45/46 already
    established for their own "listening" assessment coverage without a
    literal audio exercise type. This also means the same-speaker/
    same-audio distractor-collision bug class (found and fixed 2026-07-09
    in the nl corpus, commit 148240e) cannot directly apply here -- there
    is no listen_select exercise in this file to check. Checked anyway,
    since lesson04's dialogue_comprehension exercise is the closest
    analogue: its three distractors ("He wants to know the price of the
    rental."/"He wants to know if Nima already has a bicycle."/"He wants
    to know if Nima needs a helmet.") are plausible-fact alternatives, NOT
    lines either dialogue speaker (نیما or آقای مرادی) actually says or
    facts either speaker actually asks anywhere in this unit's dialogue --
    price is volunteered later by آقای مرادی but never asked as a question
    by anyone, and "already has a bicycle" / "needs a helmet" are never
    mentioned by either speaker at all, so there is no cross-exercise
    collision either. The dialogue_response exercise (lesson04) has no
    distractor set at all (like unit45's own dialogue_response_dosage and
    unit46's dialogue_response_style), so the same-speaker-collision
    question doesn't apply to it. Every "Translate into English" exercise
    in the paired overlay explicitly sets answer_language_code: en. No
    exercise in this unit tests a genuine two-clause sentence joined by
    "and"/comma (§12) -- the two-sentence price/deposit statement
    (lesson04 dialogue line 4, lesson05 reading text) is authored as two
    separate short sentences, matching how unit34's post-office dialogue
    and unit45/46's own two-sentence teaching notes are already treated,
    with paraphrase-variant accepted answers rather than clause-join
    variants (natural fit, since "It's 5,000 toman a day. It also needs a
    10,000 toman deposit." is two separate statements in English too, not
    a single compound clause). Ran a recursive scan (grep for bare,
    unquoted yes/no/true/false/on/off tokens as YAML scalar values, plus a
    full yaml.safe_load parse of both this file and its paired overlay
    confirming every value that loaded is a str/list/dict, never a Python
    bool anywhere in a learner-facing field) for bare unquoted yes/no/
    true/false/on/off values (including matching_pairs right: values
    specifically) -- zero hits, see the overlay's own review note for the
    exact scan result.

    Review 2026-10-21 (en-fa A1 pass): 1 fix - lesson01 translation item 'bicycle rental' changed from the unnatural دوچرخه کرایه to کرایه دوچرخه (the usual shop-sign form). Other Persian (colloquial می‌خواد/می‌دم/تومنه, ezafe دوچرخه‌ی with ZWNJ) checked and consistent with units 28/42/45. NATIVE FLAGS: none.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character) keeps his usual informal register as
    the bike-rental customer. آقای مرادی, a new formal-register bike shop
    owner, speaks with neutral polite service language, consistent with
    the register units 41/42/44/45/46 already established for this
    course's other service-encounter characters. Reuses دوچرخه (unit28),
    می‌خوام (unit03), یه (unit34), کردن (units32/35/46), کنم (unit21,
    subjunctive "می‌خوام ... کنم" pattern), روزی (unit45), پنج/ده/سه
    (unit03), هزار/تومن/تومنه (unit21), هم (unit45), می‌خواد (unit34),
    کوچیک/بزرگ (unit26), یا (unit28), می‌خوای (unit12/14/16/20/35), پس/
    می‌دم (unit42), کی (unit34/42), تا (unit42), فردا/ظهر (unit09), سلام/
    ممنون (units01/17/22/45/46), آقای (units40/42/44/46), لطفاً (unit21),
    and باشه (units01/02/06/17/22/45/46) without re-teaching any of it
    from scratch. No word is given a new sense beyond its existing corpus
    meaning in this unit -- دوچرخه keeps its established "bicycle" sense
    (already used as a transport mode in unit28, here as the rentable
    item, not a new meaning), and پس/می‌دم keeps its established "give
    back" sense from unit42's library-book return, applied to a new item.

