    Review 2026-10-20: 0 fixes - checked the copula paradigm, negation نیستم/نیست, status vocabulary, dialogue text vs audio text, reading consistency, ی/ک, ZWNJ (می‌کنم, چه‌وقت, همه‌ی, جلسه‌ی), character canon (سارا, حسین). NATIVE FLAGS: the register claim that هستم/هستی/هستن is the more formal end of colloquial is arguable (it is the standalone/emphatic form, equally normal in speech); overlay notes were softened accordingly, realization provenance and register_policy left unchanged.

course:
