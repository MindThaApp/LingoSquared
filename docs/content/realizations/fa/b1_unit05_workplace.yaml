generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked firecrawl
    availability fresh before starting: `firecrawl search` returned HTTP
    402 (credits exhausted), same result as every prior check this cycle.
    No adaptable Persian intermediate-level public-domain source exists
    for a workplace/professional-register outcome (see b1_unit01-04's own
    provenance notes on the FSI Persian Basic Course's beginner-only
    scope). Authored from general Persian grammar knowledge, same as fa's
    other B1 units.

    This is fa's FIFTH B1 unit. Grammar target: the FULL FORMAL COPULA
    paradigm of بودن (to be) -- هستم/هستی/هست/هستیم/هستید/هستن -- used
    predicatively with مسئول (responsible) to state job responsibilities
    (من مسئول این پروژه هستم, "I'm responsible for this project"),
    contrasted with its negation (نیستم/نیست). This is deliberately
    DIFFERENT from unit04's enclitic-suffix-on-adjective construction
    (موافقم/مخالفم, no separate verb at all) even though both look
    superficially similar to an English speaker as "predicate adjective +
    person marking" -- هستم/هستی/... is a genuine STANDALONE VERB (the
    emphatic/formal register of بودن, as opposed to the more common
    unstressed enclitic ام/ای/است/ایم/اید/اند used for ordinary predicate
    statements elsewhere in this corpus), used here specifically because
    workplace/professional register favors the fuller, more formal copula
    form over the casual enclitic contraction -- a genuine register
    distinction, not an arbitrary variation, called out explicitly in the
    grammar notes. Also drills status-update vocabulary (تمومه/تموم
    نیست/هنوز, "done"/"not done"/"still") as the second half of the
    outcome's own "give a status update" requirement.

    All vocabulary is introduced self-contained within this file (same
    convention as every other fa B1 unit).

    Character-cast continuity: reuses سارا (established as a workplace
    character since b1_unit01's own reporting-deadline scenario, confirmed
    via grep before writing) and introduces حسین as a new colleague --
    confirmed via grep against the entire fa corpus before writing that
    حسین has never been used, so this doesn't collide with any existing
    characterization. رضا was deliberately NOT reused here despite being
    an established fa B1 name (unit02's mechanic, unit04's debate
    participant) to avoid overloading one character across three
    unrelated professional contexts in the same short B1 course. No prs
    file was opened or consulted while authoring this one.

    Lessons 01-02 drill the formal copula 1st/2nd then all persons;
    lesson03 covers status-update vocabulary and copula negation;
    lesson04 is a dialogue between سارا and حسین about a project's status;
    lesson05 is a third-person reading recounting the same facts;
    lesson06 is production-only wrap-up -- the same six-lesson arc
    established across every prior fa B1 unit.
