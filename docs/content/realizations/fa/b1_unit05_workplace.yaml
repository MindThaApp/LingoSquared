    register. Reading passage consistent with the dialogue. Cast (سارا,
    established since unit01; حسین, confirmed genuinely new via corpus grep so
    no clashing characterization) checks out, no prs-name leak. Compiler
    validate AND compile both 0/0. Mechanical sweep clean (no Arabic
    kaf/yeh, no stray YAML booleans -- including the quoted "Yes" learner
    option, no title>200, all exercise types registered, no jargon leaks,
    all accepted_answers value: keys present, matching_pairs/word_order
