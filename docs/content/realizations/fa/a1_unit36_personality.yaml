  - content_key: fa.a1.unit36.audio.personality.vocab.01
    language: fa
    text: "مهربون، بامزه، خجالتی، جدی"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit36.audio.personality.vocab.02
    language: fa
    text: "زرنگ، تنبل، زحمت‌کش، صبور"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit36.audio.dialogue.personality.01
    language: fa
    text: "نیما: سارا، مریم چه جوریه؟ سارا: خیلی مهربونه و زرنگه. نیما: تنبل نیست؟ سارا: نه، اصلاً، خیلی هم زحمت‌کشه. فقط یکم خجالتیه. نیما: باحاله، دوست دارم بیشتر باهاش آشنا بشم."
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit36.personality
    title: شخصیت
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.personality.describe_basic_personality_traits
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit36.lesson01.personality_words_one
        title: "صفت‌های شخصیتی ۱"
        spine_outcome_id: universal.a1.personality.describe_basic_personality_traits
        teaching:
          - content_key: fa.a1.unit36.lesson01.teach.mehrabun
            kind: vocabulary
            target: {text: مهربون, language_code: fa, direction: rtl}
            introduced_tokens: [مهربون]
            example: {text: "سارا خیلی مهربونه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson01.teach.bamaze
            kind: vocabulary
            target: {text: بامزه, language_code: fa, direction: rtl}
            introduced_tokens: [بامزه]
            example: {text: "نیما بامزه‌ست.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson01.teach.khejalati
            kind: vocabulary
            target: {text: خجالتی, language_code: fa, direction: rtl}
            introduced_tokens: [خجالتی]
            example: {text: "یکم خجالتیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson01.teach.jeddi
            kind: vocabulary
            target: {text: جدی, language_code: fa, direction: rtl}
            introduced_tokens: [جدی]
            example: {text: "معلممون جدیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson01.teach.review_copula_fusion
            kind: grammar_note
            target: {text: "مهربونه = مهربون + است (fused 'is', consonant-ending) / بامزه‌ست = بامزه + است (vowel-ending, with ZWNJ) / خجالتیه = خجالتی + ه (ی-ending)", language_code: fa, direction: rtl}
            introduced_tokens: ["مهربونه", "بامزه‌ست", خجالتیه, جدیه, خیلی, سارا, نیما]
        exercises:
          - content_key: fa.a1.unit36.lesson01.exercise01.recognize_mehrabun
            type: multiple_choice
            tested_text: مهربون
            prompt: {target_blocks: [{text: مهربون, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson01.exercise02.recognize_bamaze
            type: multiple_choice
            tested_text: بامزه
            prompt: {target_blocks: [{text: بامزه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson01.exercise03.match_personality_words_one
            type: matching_pairs
            tested_text: "مهربون بامزه خجالتی جدی مهربونه بامزه‌ست خجالتیه جدیه"
            prompt: {target_blocks: []}
            pairs:
              - {left: مهربون, right: kind}
              - {left: بامزه, right: funny}
              - {left: خجالتی, right: shy}
              - {left: جدی, right: serious}
              - {left: "مهربونه", right: "he/she is kind"}
              - {left: "بامزه‌ست", right: "he/she is funny"}
              - {left: خجالتیه, right: "he/she is shy"}
              - {left: جدیه, right: "he/she is serious"}
          - content_key: fa.a1.unit36.lesson01.exercise04.word_order_sara_mehrabun
            type: word_order
            tested_text: "سارا خیلی مهربونه"
            prompt: {target_blocks: [{text: "Sara is very kind.", language_code: en, direction: ltr}]}
            word_bank: [سارا, خیلی, "مهربونه"]
          - content_key: fa.a1.unit36.lesson01.exercise05.translate_nima_bamaze
            type: translation
            tested_text: "نیما بامزه‌ست."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit36.lesson02.personality_words_two
        title: "صفت‌های شخصیتی ۲"
        spine_outcome_id: universal.a1.personality.describe_basic_personality_traits
        teaching:
          - content_key: fa.a1.unit36.lesson02.teach.zerang
            kind: vocabulary
            target: {text: زرنگ, language_code: fa, direction: rtl}
            introduced_tokens: [زرنگ]
            example: {text: "مریم خیلی زرنگه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson02.teach.tanbal
            kind: vocabulary
            target: {text: تنبل, language_code: fa, direction: rtl}
            introduced_tokens: [تنبل]
            example: {text: "امروز یکم تنبلم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson02.teach.zahmatkesh
            kind: vocabulary
            target: {text: "زحمت‌کش", language_code: fa, direction: rtl}
            introduced_tokens: ["زحمت‌کش"]
            example: {text: "پدرم خیلی زحمت‌کشه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson02.teach.sabur
            kind: vocabulary
            target: {text: صبور, language_code: fa, direction: rtl}
            introduced_tokens: [صبور]
            example: {text: "معلم ما خیلی صبوره.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson02.teach.review_negation
            kind: grammar_note
            target: {text: "تنبل نیست (he/she is not lazy) -- نیست negates the fused copula", language_code: fa, direction: rtl}
            introduced_tokens: ["تنبل نیست", نیست, صبوره, ما, معلم, "زحمت‌کشه"]
        exercises:
          - content_key: fa.a1.unit36.lesson02.exercise01.recognize_zerang
            type: multiple_choice
            tested_text: زرنگ
            prompt: {target_blocks: [{text: زرنگ, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson02.exercise02.recognize_tanbal_nist
            type: multiple_choice
            tested_text: "تنبل نیست"
            prompt: {target_blocks: [{text: "تنبل نیست", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson02.exercise03.match_personality_words_two
            type: matching_pairs
            tested_text: "زرنگ تنبل زحمت‌کش صبور تنبل نیست"
            prompt: {target_blocks: []}
            pairs:
              - {left: زرنگ, right: "smart / clever"}
              - {left: تنبل, right: lazy}
              - {left: "زحمت‌کش", right: hardworking}
              - {left: صبور, right: patient}
              - {left: "تنبل نیست", right: "he/she is not lazy"}
              - {left: "مریم خیلی زرنگه.", right: "Maryam is very smart."}
              - {left: "پدرم خیلی زحمت‌کشه.", right: "My father is very hardworking."}
          - content_key: fa.a1.unit36.lesson02.exercise04.word_order_teacher_sabur
            type: word_order
            tested_text: "معلم ما خیلی صبوره"
            prompt: {target_blocks: [{text: "Our teacher is very patient.", language_code: en, direction: ltr}]}
            word_bank: [معلم, ما, خیلی, صبوره]
          - content_key: fa.a1.unit36.lesson02.exercise05.translate_tanbal_nist
            type: translation
            tested_text: "تنبل نیست، زحمت‌کشه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit36.lesson03.asking_about_personality
        title: "پرسیدن درباره‌ی شخصیت"
        spine_outcome_id: universal.a1.personality.describe_basic_personality_traits
        teaching:
          - content_key: fa.a1.unit36.lesson03.teach.shakhsiat_word
            kind: vocabulary
            target: {text: شخصیت, language_code: fa, direction: rtl}
            introduced_tokens: [شخصیت]
            example: {text: "شخصیتش خیلی خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit36.lesson03.teach.ask_shakhsiat
            kind: phrase
            target: {text: "شخصیتش چطوره؟", language_code: fa, direction: rtl}
            introduced_tokens: [چطوره, "ش"]
          - content_key: fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang
            kind: phrase
            target: {text: "خیلی مهربونه و زرنگه.", language_code: fa, direction: rtl}
            introduced_tokens: [و]
          - content_key: fa.a1.unit36.lesson03.teach.che_joriye
            kind: phrase
            target: {text: "چه جوریه؟", language_code: fa, direction: rtl}
            introduced_tokens: ["چه جوریه"]
          - content_key: fa.a1.unit36.lesson03.teach.review_shakhsiat_words
            kind: grammar_note
            target: {text: "شخصیت (personality) / چطوره؟ (how is...?) / چه جوریه؟ (what's...like?)", language_code: fa, direction: rtl}
            introduced_tokens: [شخصیتش, زرنگه]
        exercises:
          - content_key: fa.a1.unit36.lesson03.exercise01.recognize_ask_shakhsiat
            type: multiple_choice
            tested_text: "شخصیتش چطوره؟"
            prompt: {target_blocks: [{text: "شخصیتش چطوره؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson03.exercise02.recognize_che_joriye
            type: multiple_choice
            tested_text: "چه جوریه؟"
            prompt: {target_blocks: [{text: "چه جوریه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson03.exercise03.match_asking_words
            type: matching_pairs
            tested_text: "شخصیت شخصیتش چطوره چه جوریه خیلی مهربونه و زرنگه"
            prompt: {target_blocks: []}
            pairs:
              - {left: شخصیت, right: personality}
              - {left: "شخصیتش چطوره؟", right: "What's his/her personality like?"}
              - {left: "چه جوریه؟", right: "What's he/she like?"}
              - {left: "خیلی مهربونه و زرنگه.", right: "He/she is very kind and smart."}
          - content_key: fa.a1.unit36.lesson03.exercise04.word_order_ask_shakhsiat
            type: word_order
            tested_text: "شخصیتش چطوره"
            prompt: {target_blocks: [{text: "What's his/her personality like?", language_code: en, direction: ltr}]}
            word_bank: ["شخصیتش", چطوره]
          - content_key: fa.a1.unit36.lesson03.exercise05.translate_answer_mehrabun_zerang
            type: translation
            tested_text: "خیلی مهربونه و زرنگه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit36.lesson04.personality_dialogue
        title: "گفتگو درباره‌ی شخصیت مریم"
        spine_outcome_id: universal.a1.personality.describe_basic_personality_traits
        teaching:
          - content_key: fa.a1.unit36.lesson04.teach.review_dialogue_words
            kind: grammar_note
            target: {text: "نیما / سارا / مریم / اصلاً / فقط / باحال", language_code: fa, direction: rtl}
            introduced_tokens: [نیما, سارا, مریم, "اصلاً", فقط, باحال, دارم, دوست, یکم]
          - content_key: fa.a1.unit36.lesson04.teach.get_to_know
            kind: phrase
            target: {text: "دوست دارم بیشتر باهاش آشنا بشم.", language_code: fa, direction: rtl}
            introduced_tokens: [بیشتر, باهاش, "آشنا بشم"]
          - content_key: fa.a1.unit36.lesson04.teach.dialogue_line1
            kind: dialogue
            target: {text: "سارا، مریم چه جوریه؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit36.lesson04.teach.dialogue_line2
            kind: dialogue
            target: {text: "خیلی مهربونه و زرنگه.", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: []
          - content_key: fa.a1.unit36.lesson04.teach.dialogue_line3
            kind: dialogue
            target: {text: "تنبل نیست؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit36.lesson04.teach.dialogue_line4
            kind: dialogue
            target: {text: "نه، اصلاً، خیلی هم زحمت‌کشه. فقط یکم خجالتیه.", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: [نه, هم]
          - content_key: fa.a1.unit36.lesson04.teach.dialogue_line5
            kind: dialogue
            target: {text: "باحاله، دوست دارم بیشتر باهاش آشنا بشم.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [باحاله]
        exercises:
          - content_key: fa.a1.unit36.lesson04.exercise01.dialogue_comprehension_personality
            type: dialogue_comprehension
            tested_text: "سارا مریم چه جوریه خیلی مهربونه و زرنگه تنبل نیست نه اصلاً خیلی هم زحمت‌کشه فقط یکم خجالتیه باحاله دوست دارم بیشتر باهاش آشنا بشم"
            prompt: {target_blocks: [{text: "نیما از سارا می‌پرسه مریم چه جوریه. سارا می‌گه مریم مهربون، زرنگ و زحمت‌کشه، ولی یکم خجالتیه.", language_code: fa, direction: rtl}]}
            correct_option: "Maryam is kind, smart, and hardworking, but a little shy -- and not lazy at all."
            distractors:
              - "Maryam is lazy and not very kind."
              - "Maryam is serious and doesn't like to meet new people."
              - "Nima already knows Maryam very well."
          - content_key: fa.a1.unit36.lesson04.exercise02.recognize_tanbal_nist_question
            type: multiple_choice
            tested_text: "تنبل نیست؟"
            prompt: {target_blocks: [{text: "تنبل نیست؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson04.exercise03.match_dialogue_words
            type: matching_pairs
            tested_text: "نیما سارا مریم اصلاً فقط باحال هم نه"
            prompt: {target_blocks: []}
            pairs:
              - {left: نیما, right: Nima}
              - {left: سارا, right: Sara}
              - {left: مریم, right: Maryam}
              - {left: "اصلاً", right: "not at all"}
              - {left: فقط, right: only}
              - {left: باحال, right: cool}
              - {left: هم, right: also}
              - {left: نه, right: "no"}
          - content_key: fa.a1.unit36.lesson04.exercise04.dialogue_response_ask_personality
            type: dialogue_response
            tested_text: "خیلی مهربونه و زرنگه."
            prompt: {target_blocks: [{text: "سارا، مریم چه جوریه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit36.lesson04.exercise05.translate_zahmatkesh_khejalati
            type: translation
            tested_text: "نه، اصلاً، خیلی هم زحمت‌کشه. فقط یکم خجالتیه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit36.lesson05.reading_personality
        title: "خواندن درباره‌ی شخصیت"
        spine_outcome_id: universal.a1.personality.describe_basic_personality_traits
        teaching:
          - content_key: fa.a1.unit36.lesson05.teach.reading_text
            kind: reading
