schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit, and this pass found a genuinely new, usable result unlike the
    last several units' dead ends. Searched
    ("FSI Persian Basic Course personality traits vocabulary" and a
    Persian-keyword variant with شخصیت) -- no FSI Persian personality-themed
    lesson transcript surfaced from either search. But a search result
    surfaced a different host for the same source document (ERIC ED053628,
    "Persian Basic Course: Units 1-12", Obolensky/Khaje Nouri/Yazdan Panah,
    1963) than the Yojik copy already confirmed unusable in units 33-35's
    provenance notes:
    https://fsi-language-courses-media.nyc3.cdn.digitaloceanspaces.com/languages/Persian/General/Spoken%20Persian.pdf.
    Fetched it via Firecrawl -- unlike the Yojik scan, this copy's OCR text
    layer is genuinely extractable (121,756 words retrieved, not a page-image
    scan). Confirmed the same structural fact units 24/25 independently found
    from the table of contents: all 12 units are organized purely by
    grammatical progression (verb endings, pronouns, comparative suffixes,
    prepositions, passive voice, etc.), never by vocabulary topic -- grepping
    the full extracted text for "personality"/"character trait"/"shy"/
    "friendly"/"hardworking"/"lazy" found no themed section. However, two
    genuine, individual vocabulary glosses relevant to this unit's topic DID
    turn up in the source's own running vocabulary lists: "fæyyáz | generous"
    and "sêbr kærdân | to be patient, to wait" (from Unit 5's material). The
    "generous" entry (فیاض) was assessed and NOT used -- it is a real word but
    reads as formal/literary in modern colloquial Iranian Farsi (closer to a
    given name in everyday use), not this unit's established informal
    register, per AUTHORING_GUIDE.md's modernization standard, so no
    personality trait for "generous" was included in this unit at all rather
    than force an inauthentic word choice. The "to be patient, to wait" entry
    (صبر کردن) IS used, adapted to its adjectival form صبور ("patient") for
    lesson02 -- a genuine, if narrow, real source contribution, not a claimed
    win where none exists. Every other trait word and every sentence below
    was authored fresh from this course's own established fa conventions
    (colloquial Iranian register, fused copula predicates already established
    in units 11/23/25, the recurring نیما/سارا cast, and مریم -- the
    incidental third character already introduced in unit25/appearance as
    سارا's friend -- reused here for genuine same-corpus continuity, not a
    cross-language borrow).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) checked this unit against every
    item on the standing review checklist and found no real bugs to fix.
    Cross-checked Maryam's personality traits (kind, smart, hardworking,
    shy, never lazy) across lesson04's dialogue and lesson05's reading for
    mutual consistency -- fully consistent, both agree on all four traits
    and the "not lazy" contrast. No listen_select/listen_type exercises
    exist in this unit, so the same-speaker-distractor bug class doesn't
    apply. No stray unquoted yes/no/true/false/on/off values in any
    learner-facing field. Every exercise type used has a matching case in
    ExerciseRenderer.tsx. matching_pairs pairs and word_order/accepted_
    answers shapes match exactly between this realization and its overlay.
    Every spine_outcome_id resolves to a real universal_spine.yaml entry.
    No internal jargon leaks into learner-facing text. Spot-checked the
    genuine FSI source contribution disclosed in this unit's
    generation_provenance (صبور adapted from the source's own صبر کردن
    gloss) -- correctly and honestly disclosed, not overclaimed. The Farsi
    reads naturally and with consistent colloquial Iranian register
    throughout, including the fused-copula forms (مهربونه/بامزه‌ست/خجالتیه)
    which are internally consistent with the established pattern from
    earlier units. Re-validated clean: 0 errors/0 warnings standalone and
    as part of the full 6-unit (33-38) fresh-context review batch.

    Originally authored 2026-07-09 by Claude (content-authoring worker session).
    Realizes universal.a1.personality.describe_basic_personality_traits, the
    next unrealized A1 outcome after unit35 (cooking) -- confirmed by an
    exact diff of every spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files against every
    universal.a1.* id in docs/content/universal_spine.yaml: fa had realized
    all 36 A1 outcomes through cooking, with personality the next one in
    spine declaration order (colors, seasons, emergencies, lost_items,
    appointments, library, waste_disposal remain unrealized after this unit).
    Scoped to the outcome's four assessment requirements: understanding a
    spoken personality description (listening, via the lesson04 dialogue
    plus its dialogue_comprehension exercise), describing a person's
    personality in one or two sentences (speaking/production, via translate
    and writing_prompt exercises across lessons 3/4/6), reading a short
    personality description (reading, lesson05's reading_comprehension
    exercises), and writing a short personality description (writing,
    lesson05/lesson06's writing_prompt exercises). Deliberately does not
    re-teach comparatives (already a separate, already-realized outcome,
    unit15) or physical appearance (unit25) -- stays to plain has/is
    descriptive statements about character only. Uses structured speaker
    fields for all dialogue turns; no spoken text embeds a "Name:" prefix.
    Every vocabulary card has an example sentence per schema 1.1.
    Already-taught words reused from earlier units (چطوره, خیلی, نیست, اون,
    دوست, etc.) are re-declared in introduced_tokens before first tested use
    in this file because the compiler's untaught-vocabulary check is
    per-file only. No fill_in_blank or audio-only exercise types are used
    (fa has real TTS per AUTHORING_GUIDE.md #14, but this file continues the
    established text-based corpus-consistency pattern from units 19-35,
    same choice those units' own reviews made). Every matching_pairs
    exercise has 7-8 pairs. Every translate-into-English exercise in the
    paired overlay explicitly sets answer_language_code: en. Ran a recursive
    yaml.safe_load scan over this file and its paired overlay for bare
    unquoted yes/no/true/false/on/off values -- zero hits (see the overlay's
    own review note for the exact scan result).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: fused
    copula predicates (مهربونه, بامزه‌ست, خجالتیه) built the same way as
    units 11/23/25's بلنده/خسته‌ام/آماده‌ست forms, رو as object marker, and
    تو-register dialogue. Reuses چطوره (unit01), خیلی (unit01), نیست
    (unit23), and اون (unit35) without re-teaching them from scratch.

