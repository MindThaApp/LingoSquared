schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real attempt at genuine FSI Persian Basic Course lesson text this
    pass, going further than the index-page-only failures logged in prior fa
    units' own provenance notes. Fetched
    https://files.eric.ed.gov/fulltext/ED185859.pdf (ERIC ED185859, "Persian
    Basic Course: Persian-English Glossary and Notes for Advanced Reading",
    DLI, Aug 1967) and
    https://fsi-languages.yojik.eu/languages/FSI/Persian/Spoken%20Persian.PDF
    (ERIC ED053628, "Persian Basic Course: Units 1-12", Obolensky/Yazdan
    Panah/Khaje Nouri, FSI/Center for Applied Linguistics, May 1963) as real
    PDFs and read their actual page images (not just a directory listing --
    both are scanned documents readable as images, confirmed via a genuine
    table-of-contents page read, unlike the text-only WebFetch calls prior
    fa units logged). Confirmed real access this time, then confirmed the
    actual course structure rules out a usable hobbies source: "Persian
    Basic Course Units 1-12" is organized entirely by GRAMMATICAL
    progression across exactly 12 units (pronouns, verb endings, degrees of
    politeness, passive voice, causatives, kinship terms, expressions of
    time, etc. -- see its own table of contents), not by vocabulary topic,
    and its "Basic Sentences" drill format ties every sentence to the
    grammar point of that unit rather than a coherent free-time/hobbies
    scenario; the companion glossary volume is an ADVANCED-reading
    supplement (idiom notes for a separate advanced text), also not
    topic-organized and far above A1 register. Neither source has a
    dedicated hobbies/free-time/sports/leisure unit to adapt from. Given
    this is a genuine structural fact about the source (confirmed by really
    reading its real table of contents, not a failed fetch), continuing to
    hunt through hundreds of pages of unrelated grammar drills for
    incidental leisure vocabulary was not a productive path to real
    hobby-specific lesson text -- authored using this project's own
    established fa register/character conventions instead (reusing this
    course's own already-taught *دوست دارم*/*چیکار می‌کنی*/*می‌رم* patterns
    and the نیما/سارا cast from units 11-14/23), per
    docs/content/AUTHORING_GUIDE.md's modernization standard.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude, zero access to the original
    authoring reasoning) found and fixed TWO real issues, both in
    lesson06.exercise01.dialogue_comprehension_context, same bug class as
    fa unit23's own fresh-context review: (1) an English
    correct_option/distractors block had been duplicated directly into
    this fa (target-language) realization file, identical to what the
    overlay already carried -- confirmed via scripts/compile_content.py
    that the compiled-exercise builder only ever reads correct_option/
    distractors from exercise_overlay, so this was pure dead English data
    in a file that should be Farsi-only; removed it. (2) media_assets
    already declared a real dialogue audio asset
    (fa.a1.audio.hobbies.dialogue.01) but no exercise ever referenced it
    via media_asset_key, unlike unit21/unit22's own established wiring
    pattern -- fixed by adding
    media_asset_key: fa.a1.audio.hobbies.dialogue.01 to that exercise, so
    the asset will actually play once recorded/synthesized. Everything
    else checked clean: no same-speaker distractor collisions (compiler's
    validate_same_speaker_dialogue_distractors passed with 0 errors); no
    stray unquoted YAML booleans; every exercise type used is registered
    in ExerciseRenderer.tsx; matching_pairs/word_order answer shapes
    correct; no jargon leaks; Sara's cinema/movies and Nima's reading/
    football characterization is genuinely consistent with the unit13
    precedent this unit's own provenance note claims to continue (spot-
    checked against unit13 directly); Farsi register and script read
    correctly throughout. Re-validated clean standalone and as part of the
    full fa units 21-26 batch: 0 errors/0 warnings.

    Original draft note (2026-07-08, Sonnet 5 fork): realizes
    universal.a1.hobbies.describe_free_time_activities (prerequisite:
    universal.a1.preferences.express_preferences, covered by unit14 -- reuses
    its established دوست دارم pattern throughout rather than teaching a new
    "like" construction). Fa's next uncovered A1 outcome after unit23
    (emotions) -- confirmed by an exact diff of every spine_outcome_id used
    across all fa realization files against every A1-level `id:` in
    docs/content/universal_spine.yaml. Scoped to: naming the concept of a
    hobby/free time, four concrete activities (reading, listening to music,
    watching movies, sport/football) built from mostly-already-taught verbs
    (دوست دارم from unit14, می‌کنم from unit08, می‌رم/چیکار می‌کنی/هر روز-style
    frequency from unit11, کتاب/فیلم from unit03/unit13), frequency
    (هر هفته/گاهی), asking someone what they do in their free time, a short
    reading passage about نیما's hobbies, and a closing نیما/سارا dialogue
    that deliberately continues their unit13 characterization (سارا already
    established as someone who goes to the cinema and watches movies; نیما
    as someone who stays home and reads) rather than inventing new facts
    about them. Matches the spine outcome's 4 assessment_requirements
    exactly (listening via lesson06's dialogue_comprehension -- reading-
    visible per the same precedent unit13's fresh-context review accepted,
    since audio remains pending_generation; speaking via the dialogue_response
    exercise; reading via lesson05's reading_comprehension; writing via two
    writing_prompt exercises). matching_pairs pair counts grow across the
    unit by pooling cumulative in-unit vocabulary (4/6/7/7/7/8 pairs,
    lessons 1-6) per AUTHORING_GUIDE.md #16, rather than staying flat at the
    2-3 pairs that guide flags as too small -- lesson01 stays smallest as
    the genuine first-lesson ceiling (only 3-4 new items exist yet to pair),
    matching the unit11/unit12/unit23 precedent for a unit's own first
    lesson. Not self-certified -- needs the mandatory fresh-context review
    before shipping, same as every other Claude-authored fa unit.

    Review 2026-10-21: 0 fixes - clean. NATIVE FLAGS: none.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-14/21-23. Reuses unit14's دوست دارم,
    unit08's می‌کنم, unit11's می‌رم/چیکار می‌کنی, and unit03/unit13's
    کتاب/فیلم without re-teaching the underlying construction, only the
    new vocabulary that combines with it.

media_assets:
  - content_key: fa.a1.audio.hobbies.vocab.01
    language: fa
    text: سرگرمی، موسیقی، ورزش، فوتبال
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.hobbies.dialogue.01
    language: fa
    text: "نیما: سارا، وقت آزاد چیکار می‌کنی؟ سارا: من فیلم دیدن دوست دارم. هر هفته می‌رم سینما. تو چی؟ نیما: من کتاب خوندن دوست دارم. گاهی هم فوتبال بازی می‌کنم. سارا: چه خوب!"
    voice_hint: two_adults_neutral_polite
    status: pending_generation

