schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A2
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: fresh_context_content_review
  notes: >-
    Sixth A2 unit for the fa realization (spine outcome: universal.a2.
    employment.attend_job_interview) -- this closes out ALL SIX A2-level
    spine outcomes for fa (bureaucracy/opinions/banking/health/housing/
    employment are the entire universal.a2.* set in universal_spine.yaml
    as of this pass; confirmed by grep before starting, per the standing
    "always check the real spine, not a memory note" discipline). Reuses
    آرش, already established in a2_unit10 (opinions) as a Tehran office
    worker who prefers the office over remote work -- a natural
    continuation for him to now interview for a new position, rather
    than inventing a brand-new character (AUTHORING_GUIDE §11). Own
    scenario, authored independently of the English/Dutch A2 units and
    of the prs sibling realization of this same outcome (not consulted,
    per AUTHORING_GUIDE §8). A2-level step-up from A1's plain job-
    description vocabulary (universal.a1.work.describe_job, this
    outcome's own prerequisite, alongside universal.a2.opinions.
    give_opinions_with_reasons for the register step): stating
    experience with a duration (سه سال تجربه‌ی کار -- three years of work
    experience) and availability (از هفته‌ی دیگه -- from next week), then
    asking a clarifying question about the role -- three distinct
    interview moves A1's bare "I am a teacher"-style sentences never
    required. Every kind:vocabulary card carries a real example:
    sentence built only from already-taught or same-lesson-taught
    tokens, with a matching overlay example_gloss, per §19 -- authored
    at schema_version 1.1 from the start. No fill_in_blank exercises
    used at all, sidestepping §13/§17 entirely, same precedent as
    unit09/10/11/12/13. No listen_type/listen_select/listen_order or
    audio-only dialogue_comprehension used anywhere in this unit per
    §14 -- every exercise has a genuine visible text prompt; a
    media_assets block is declared purely to pre-stage a future
    recording pass, unreferenced by any exercise here. Every multi-
    clause accepted_answers list carries period/comma/و-joined forms
    per §12. matching_pairs uses 6 pairs per §16. Every fact (three
    years of office experience, can start next week, the store's job
    posting requiring at least one year of experience) kept consistent
    across lesson02/03/04 per §11 -- lesson03's reading (a job posting)
    and lesson04's dialogue (آرش's actual interview) are treated as one
    continuous application, not two unrelated facts. Dialect: continues
    fa's established Iranian register (هستم-family copula, colloquial
    -e/-ه contractions like "چطوره"), deliberately never Dari forms.
    Checked script purity by eye against known-correct Persian-range
    keheh/yeh usage throughout. firecrawl re-checked fresh this pass
    (`firecrawl --status`): still 0/1,000 credits -- authored via
    established-conventions-only per the standing contingency, same
    precedent as unit09 through unit13's own provenance. Pending
    fresh-context review; left unreviewed per AUTHORING_GUIDE §9.

course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: >-
    Neutral-polite spoken Iranian register for a basic job interview.
    Introduces stating work experience with a duration and availability
    with a start date, plus asking a clarifying question about the role
    -- the A2-level step up from A1's bare job-naming vocabulary.

media_assets:
  - content_key: fa.a2.audio.interview.words.01
    language: fa
    text: مصاحبه، تجربه، مهارت، حقوق، فرصت شغلی، رزومه
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a2.audio.interview.experience.01
    language: fa
    text: "من سه سال تجربه‌ی کار دارم."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a2.audio.dialogue.job_interview.01
    language: fa
    text: "مصاحبه‌کننده: لطفاً از تجربه‌ی کاریتون بگید. آرش: من سه سال تو یه دفتر کار کردم. مصاحبه‌کننده: چه مهارت‌هایی دارید؟ آرش: تو کار تیمی و حل مسئله خوبم. مصاحبه‌کننده: می‌تونید از هفته‌ی دیگه شروع کنید؟ آرش: بله، می‌تونم."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: fa.a2.unit14.job_interview
    title: مصاحبه‌ی شغلی
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.employment.attend_job_interview
    planned_lesson_count: 4

    lessons:
      - content_key: fa.a2.unit14.lesson01.interview_vocabulary
        title: کلمات مربوط به مصاحبه
        spine_outcome_id: universal.a2.employment.attend_job_interview
        teaching:
          - content_key: fa.a2.unit14.lesson01.teach.interview_word
            kind: vocabulary
            target: {text: مصاحبه, language_code: fa, direction: rtl}
            introduced_tokens: [مصاحبه]
            example: {text: "فردا مصاحبه دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson01.teach.experience_word
            kind: vocabulary
            target: {text: تجربه, language_code: fa, direction: rtl}
            introduced_tokens: [تجربه, "تجربه‌ی"]
            example: {text: "سه سال تجربه‌ی کار دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson01.teach.skill_word
            kind: vocabulary
            target: {text: مهارت, language_code: fa, direction: rtl}
            introduced_tokens: [مهارت]
            example: {text: "چه مهارت‌هایی دارید؟", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson01.teach.salary_word
            kind: vocabulary
            target: {text: حقوق, language_code: fa, direction: rtl}
            introduced_tokens: [حقوق]
            example: {text: "حقوق این شغل چقدره؟", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson01.teach.job_opportunity_word
            kind: vocabulary
            target: {text: "فرصت شغلی", language_code: fa, direction: rtl}
            introduced_tokens: ["فرصت شغلی"]
            example: {text: "این یک فرصت شغلی خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson01.teach.resume_word
            kind: vocabulary
            target: {text: رزومه, language_code: fa, direction: rtl}
            introduced_tokens: [رزومه]
            example: {text: "رزومه‌مو فرستادم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
          - content_key: fa.a2.unit14.lesson01.teach.ra_note
            kind: grammar_note
            target: {text: "رو (object marker)", language_code: fa, direction: rtl}
            introduced_tokens: [رو]
        exercises:
          - content_key: fa.a2.unit14.lesson01.exercise01.recognize_interview
            type: multiple_choice
            tested_text: مصاحبه
            prompt: {target_blocks: [{text: مصاحبه, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson01.exercise02.recognize_salary
            type: multiple_choice
            tested_text: حقوق
            prompt: {target_blocks: [{text: حقوق, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson01.exercise03.match_interview_words
            type: matching_pairs
            tested_text: "مصاحبه تجربه مهارت حقوق فرصت شغلی رزومه"
            prompt: {target_blocks: []}
            pairs:
              - {left: مصاحبه, right: interview}
              - {left: تجربه, right: experience}
              - {left: مهارت, right: skill}
              - {left: حقوق, right: salary}
              - {left: "فرصت شغلی", right: "job opportunity"}
              - {left: رزومه, right: résumé}
          - content_key: fa.a2.unit14.lesson01.exercise04.order_i_have_experience
            type: word_order
            tested_text: "تجربه و مهارت"
            prompt: {target_blocks: []}
            word_bank: [تجربه, و, مهارت]
          - content_key: fa.a2.unit14.lesson01.exercise05.write_resume
            type: writing_prompt
            tested_text: رزومه
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit14.lesson02.describing_experience_and_availability
        title: توصیف تجربه و زمان شروع
        spine_outcome_id: universal.a2.employment.attend_job_interview
        teaching:
          - content_key: fa.a2.unit14.lesson02.teach.three_years_experience
            kind: phrase
            target: {text: "من سه سال تجربه‌ی کار دارم.", language_code: fa, direction: rtl}
            introduced_tokens: [من, سه, سال, کار, دارم]
          - content_key: fa.a2.unit14.lesson02.teach.can_start_next_week
            kind: phrase
            target: {text: "می‌تونم از هفته‌ی دیگه شروع کنم.", language_code: fa, direction: rtl}
            introduced_tokens: [می‌تونم, از, "هفته‌ی", دیگه, شروع, کنم]
          - content_key: fa.a2.unit14.lesson02.teach.clarifying_question
            kind: phrase
            target: {text: "ساعت کاری این شغل چطوره؟", language_code: fa, direction: rtl}
            introduced_tokens: ["ساعت کاری", این, شغل, چطوره]
        exercises:
          - content_key: fa.a2.unit14.lesson02.exercise01.recognize_experience_sentence
            type: multiple_choice
            tested_text: "من سه سال تجربه‌ی کار دارم"
            prompt: {target_blocks: [{text: "من سه سال تجربه‌ی کار دارم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson02.exercise02.order_can_start_next_week
            type: word_order
            tested_text: "می‌تونم از هفته‌ی دیگه شروع کنم"
            prompt: {target_blocks: []}
            word_bank: [می‌تونم, از, "هفته‌ی", دیگه, شروع, کنم]
          - content_key: fa.a2.unit14.lesson02.exercise03.dialogue_response_availability
            type: dialogue_response
            tested_text: "می‌تونم از هفته‌ی دیگه شروع کنم"
            prompt: {target_blocks: [{text: "کی می‌تونید شروع کنید؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson02.exercise04.translate_experience_and_availability
            type: translation
            tested_text: "من سه سال تجربه‌ی کار دارم و می‌تونم از هفته‌ی دیگه شروع کنم"
            prompt: {target_blocks: []}
          - content_key: fa.a2.unit14.lesson02.exercise05.write_clarifying_question
            type: writing_prompt
            tested_text: "ساعت کاری این شغل چطوره"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit14.lesson03.reading_a_job_posting
        title: خواندن آگهی استخدام
        spine_outcome_id: universal.a2.employment.attend_job_interview
        teaching:
          - content_key: fa.a2.unit14.lesson03.teach.salesperson_word
            kind: vocabulary
            target: {text: فروشنده, language_code: fa, direction: rtl}
            introduced_tokens: [فروشنده]
            example: {text: "فروشگاه به یک فروشنده نیاز داره.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson03.teach.at_least_word
            kind: vocabulary
            target: {text: حداقل, language_code: fa, direction: rtl}
            introduced_tokens: [حداقل, یک, لازمه]
            example: {text: "حداقل یک سال تجربه لازمه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson03.teach.posting_text
            kind: reading
            target: {text: "فروشگاه به یک فروشنده با حداقل یک سال تجربه نیاز داره. حقوق مناسب. مصاحبه‌ها این هفته انجام می‌شه.", language_code: fa, direction: rtl}
            introduced_tokens: [فروشگاه, به, نیاز, داره, مناسب, "مصاحبه‌ها", هفته, انجام, می‌شه]
        exercises:
          - content_key: fa.a2.unit14.lesson03.exercise01.read_experience_required
            type: reading_comprehension
            tested_text: "حداقل یک سال تجربه"
            prompt: {target_blocks: [{text: "طبق آگهی، چقدر تجربه لازمه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson03.exercise02.read_interview_timing
            type: reading_comprehension
            tested_text: "این هفته"
            prompt: {target_blocks: [{text: "طبق آگهی، مصاحبه‌ها کی انجام می‌شه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson03.exercise03.recognize_salesperson
            type: multiple_choice
            tested_text: فروشنده
            prompt: {target_blocks: [{text: فروشنده, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson03.exercise04.order_store_needs_salesperson
            type: word_order
            tested_text: "فروشگاه به یک فروشنده نیاز داره"
            prompt: {target_blocks: []}
            word_bank: [فروشگاه, به, یک, فروشنده, نیاز, داره]
          - content_key: fa.a2.unit14.lesson03.exercise05.write_experience_required
            type: writing_prompt
            tested_text: "حداقل یک سال تجربه لازمه"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit14.lesson04.interview_dialogue
        title: گفتگوی مصاحبه
        spine_outcome_id: universal.a2.employment.attend_job_interview
        teaching:
          - content_key: fa.a2.unit14.lesson04.teach.tell_me_about_experience
            kind: phrase
            target: {text: "لطفاً از تجربه‌ی کاریتون بگید.", language_code: fa, direction: rtl}
            introduced_tokens: [لطفاً, "کاریتون", بگید]
          - content_key: fa.a2.unit14.lesson04.teach.turn01
            kind: dialogue
            target: {text: "لطفاً از تجربه‌ی کاریتون بگید.", language_code: fa, direction: rtl, speaker: "مصاحبه‌کننده"}
            introduced_tokens: ["مصاحبه‌کننده"]
          - content_key: fa.a2.unit14.lesson04.teach.turn02
            kind: dialogue
            target: {text: "من سه سال تو یه دفتر کار کردم.", language_code: fa, direction: rtl, speaker: آرش}
            introduced_tokens: [آرش, تو, یه, دفتر, کردم]
          - content_key: fa.a2.unit14.lesson04.teach.turn03
            kind: dialogue
            target: {text: "چه مهارت‌هایی دارید؟", language_code: fa, direction: rtl, speaker: "مصاحبه‌کننده"}
            introduced_tokens: ["مهارت‌هایی", دارید]
          - content_key: fa.a2.unit14.lesson04.teach.turn04
            kind: dialogue
            target: {text: "تو کار تیمی و حل مسئله خوبم.", language_code: fa, direction: rtl, speaker: آرش}
            introduced_tokens: ["تیمی", حل, مسئله, خوبم]
          - content_key: fa.a2.unit14.lesson04.teach.turn05
            kind: dialogue
            target: {text: "می‌تونید از هفته‌ی دیگه شروع کنید؟", language_code: fa, direction: rtl, speaker: "مصاحبه‌کننده"}
            introduced_tokens: [می‌تونید, کنید]
          - content_key: fa.a2.unit14.lesson04.teach.turn06
            kind: dialogue
            target: {text: "بله، می‌تونم.", language_code: fa, direction: rtl, speaker: آرش}
            introduced_tokens: [بله]
        exercises:
          - content_key: fa.a2.unit14.lesson04.exercise01.comprehend_arash_experience
            type: dialogue_comprehension
            tested_text: "سه سال تو یه دفتر کار کردم"
            prompt:
              target_blocks:
                - {text: "لطفاً از تجربه‌ی کاریتون بگید. — من سه سال تو یه دفتر کار کردم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson04.exercise02.comprehend_arash_skills
            type: dialogue_comprehension
            tested_text: "کار تیمی و حل مسئله"
            prompt:
              target_blocks:
                - {text: "چه مهارت‌هایی دارید؟ — تو کار تیمی و حل مسئله خوبم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit14.lesson04.exercise03.recognize_skill_word_in_context
            type: multiple_choice
            tested_text: "مهارت‌هایی"
            prompt: {target_blocks: [{text: "چه مهارت‌هایی دارید؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson04.exercise04.order_good_at_teamwork
            type: word_order
            tested_text: "تو کار تیمی و حل مسئله خوبم"
            prompt: {target_blocks: []}
            word_bank: [تو, کار, "تیمی", و, حل, مسئله, خوبم]
          - content_key: fa.a2.unit14.lesson04.exercise05.dialogue_response_can_start
            type: dialogue_response
            tested_text: "بله می‌تونم"
            prompt: {target_blocks: [{text: "می‌تونید از هفته‌ی دیگه شروع کنید؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit14.lesson04.exercise06.write_interview_summary
            type: writing_prompt
            tested_text: "من سه سال تو یه دفتر کار کردم"
            prompt: {target_blocks: []}
