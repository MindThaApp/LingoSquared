review: {status: unreviewed, required_next_reviewer: native_fa, notes: 'Spine outcome: universal.a2.reasons.explain_reasons_and_consequences. Grammar target: چون + reason clause, برای همین + result clause, به خاطر + noun, and the word-order contrast (reason first with چون vs result after برای همین). Past and present reasons only. Register: casual spoken Tehrani (بارون، میام، نمیام، قرارمون، نتونستم). Characters: established friends Sara (teacher) and Nima (engineer); a grep of realizations/fa found them as recurring friends in earlier units (e.g. a2_unit21 reschedule, a2_unit22); no new job or family facts asserted. Delivers listening, reading, speaking and writing of one reason plus one consequence, with a culminating written message using both چون and برای همین. Authored without opening any prs file. NATIVE QUESTIONS: (1) Is قرارمون رو عوض کردیم the natural spoken phrase for “we changed our appointment/plan”, or would you prefer قرارمون رو کنسل کردیم / قرار رو گذاشتیم یه وقت دیگه? Recommended: keep عوض کردیم (neutral, avoids loanwords). (2) In بارون اومد، برای همین نیومدم, is a comma-pause before برای همین natural, and is the spoken order with the result clause directly after it the only normal one? Recommended: yes; keep as taught. (3) Is نتونستم بیام the best natural “I could not come” after برای همین, or does نمی‌تونستم بیام sound more usual in past-excuse speech? Recommended: keep نتونستم بیام (simple, single event). (4) Is چون مریضم، امروز نمیام natural, or would speakers normally put the result first (امروز نمیام، چون مریضم)? Recommended: keep reason-first as the taught drill and mention the reverse only in prose.'}
