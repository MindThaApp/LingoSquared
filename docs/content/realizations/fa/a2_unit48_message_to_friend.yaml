review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.communication.write_informal_message. Grammar target: an informal message with greeting, what happened (simple past), what is next (می‌خوام + short verb, or plain present with a time word), because/so (چون, برای همین) and a sign-off. Register: casual spoken Tehrani Persian written as people text it. Characters: Nima writes to Sara (both friends; no job or family facts asserted). New tokens: فعلا، تولد، کادو only; all other grammar and vocabulary recycled from units 27-39. No Block E/F grammar (no relative clauses, superlatives or reflexives). Authored without opening any prs file. NATIVE QUESTIONS: (1) Is ببخش که زنگ نزدم natural as a texted apology, or would ببخشید (or sorry-style ببخشید که) be more usual between friends? Recommended: both are fine; the unit teaches ببخش and accepts ببخشید. (2) Is رفتم تولد دوستم (without به) the normal spoken way to say went to my friend''s birthday? Recommended: yes; به is accepted as a variant. (3) Is فعلا a natural sign-off in a text message between friends, or would خداحافظ/فعلا خداحافظ read better? Recommended: keep فعلا. (4) Is the comma-less چون ... clause fronting (چون مریض بودم نرفتم کلاس) natural without a comma and without ‘so’, or should برای همین be preferred? Recommended: both are natural; accept both orders. (5) Does فردا می‌خوام برم سینما read as a firm plan (‘I am going to go’) to a Persian speaker, rather than only a wish? Recommended: yes, in context it is a plan; فردا می‌رم سینما is accepted as the plain-present variant where the prompt allows it.'
