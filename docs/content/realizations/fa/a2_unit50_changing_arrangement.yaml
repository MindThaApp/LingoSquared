review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.plans.rearrange_an_appointment. Grammar target: moving an arrangement with a polite request (می‌شه / می‌تونیم قرارمون رو عوض کنیم؟), a reason with چون or برای همین, a new time with برات خوبه؟ / چطوره؟, time clauses with وقتی / قبل از اینکه / بعد از اینکه (future: ب-form plus plain present; past: past verbs), and conditionals with اگه. Recycles appointments, hairdresser (آرایشگاه, formal شما forms) and bike rental (دوچرخه). The hairdresser call of a2_unit21 is not repeated; the culminating dialogue is between Sara and Nima. Register: casual spoken Tehrani Persian; no new grammar beyond Blocks A-D. NATIVE QUESTIONS: (1) Is می‌شه قرارمون رو عوض کنیم؟ the most natural spoken way to ask a friend to move a plan, or would speakers say می‌شه قرارو عوض کنیم / یه وقت دیگه بذاریم? Recommended: keep as is and accept می‌تونیم as a variant. (2) Is جمعه ساعت چهار برات خوبه؟ natural, versus برات مناسبه؟ or ساعت چهار جمعه؟ Recommended: keep برات خوبه؟ (taught) and use مناسب نیست in the اگه clause. (3) After وقتی with a future meaning, is the ب-form (وقتی کارم تموم بشه، بهت زنگ می‌زنم) the usual choice over وقتی کارم تموم می‌شه? Recommended: teach the ب-form and keep it. (4) Is اگه نتونی بیای accepted alongside اگه نمی‌تونی بیای for a possible situation? Recommended: teach نمی‌تونی and accept نتونی as an answer only. (5) Is مریضم، برای همین نمی‌تونم بیام natural when چون is dropped, and is چون … برای همین in one sentence really avoided? Recommended: yes, keep them separate.'
