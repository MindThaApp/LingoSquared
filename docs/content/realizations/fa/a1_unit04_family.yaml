          - content_key: fa.a1.unit04.lesson04.exercise05.reply_sibling_count
            type: dialogue_response
            tested_text: چند تا خواهر و برادر داری من یک برادر دارم
            prompt: {target_blocks: [{text: "چند تا خواهر و برادر داری؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson04.exercise05b.family_size_answer_meaning
