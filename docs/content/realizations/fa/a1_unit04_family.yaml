            prompt: {target_blocks: [{text: "خانواده‌ی شما چند نفرن؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson04.exercise07.register_check
            type: grammar_check
            tested_text: دارید داری
            prompt: {target_blocks: [{text: "کدوم شکل رسمی‌تره: دارید یا داری؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson04.exercise08.speak_family_size
            type: speak_response
            tested_text: چهار نفریم
            prompt: {target_blocks: [{text: "خانواده‌ی شما چند نفرن؟", language_code: fa, direction: rtl}]}

