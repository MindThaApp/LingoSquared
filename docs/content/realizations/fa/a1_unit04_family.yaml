schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
status: complete_draft
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Kinship vocabulary scaffolded from the FSI Persian Basic Course
    (1963, Center for Applied Linguistics, US Dept. of Education --
    public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents this vocabulary as a
    bare genealogical chart with no dialogue or example sentences;
    every sentence, exercise, and scenario in this unit is freshly
    authored in modern colloquial register, not copied or lightly
    edited from any 1960s source text.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context review: verified spine-outcome discipline against
    universal.a1.family.describe_relationships (no drift into unrelated
    grammar); confirmed fa_IR_standard_colloquial_intro register/dialect
    throughout, consistent with unit01 (هستم copula, Iranian names,
    correct Persian keheh/yeh codepoints, no Dari -ین verb endings or
    vocabulary). Fixed real bugs found: two register-mixing errors using
    a -ین ending flagged as a Dari-style marker by this course's own
    conventions (لسون05 "متأهلین یا مجرد؟" -> "متأهلی یا مجردی؟"; lesson06
    "چند نفرین" clashing with the same sentence's informal خانواده‌ت ->
    "چند نفرن" to match the established lesson04 pattern); a register-
    mixing bug in lesson06's formal-register note that used the
    affectionate داداش inside a "formal writing" example (-> برادرم) and
    padded introduced_tokens with نداره that was never actually shown to
    the learner (rewrote the note to genuinely display and teach داره/
    نداره/دارد/ندارد); the same untaught-token-padding pattern in lesson05
    (مجردم/متأهلین declared as introduced without ever being displayed --
    added real "من مجردم."/"من متأهلم." teaching phrases and trimmed the
    padding). Fixed three exercise-pacing gaps where a production/typing
    exercise tested vocabulary with zero prior recognition-tier
    (multiple_choice/listen_select) exposure within the lesson: lesson01
    (خواهر), lesson03 (عمو/عمه/دایی/خاله), and lesson04 (خانواده‌ی شما چند
    نفرن؟ / چهار نفریم, which previously had literally no exposure of any
    kind before being required in a listen_type/dialogue_response) --
    added one recognition exercise at each gap. Checked all MC distractor
    sets (found no ambiguity), all free-text accepted_answers (none are
    ungradeable blank templates), all learner-facing strings (no internal
    jargon leaks), and cross-file content_key/introduced_tokens parity
    with the overlay after every fix. No 1960s FSI-register leakage found
    in the adapted content. Audio remains pending generation.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Teach ordinary neutral-polite spoken Iranian Farsi as the default,
    matching units 1-2. Label formal-written and informal alternatives
    explicitly rather than mixing registers inside one exchange.

