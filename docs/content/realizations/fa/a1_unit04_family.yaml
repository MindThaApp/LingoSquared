units:
  - content_key: fa.a1.unit04.family
    title: خانواده
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.family.describe_relationships
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit04.lesson01.immediate_family
        title: خانواده‌ی نزدیک
        spine_outcome_id: universal.a1.family.describe_relationships
        teaching:
          - content_key: fa.a1.unit04.lesson01.teach.madar
            kind: vocabulary
            target: {text: "مادر", language_code: fa, direction: rtl}
            introduced_tokens: [مادر]
          - content_key: fa.a1.unit04.lesson01.teach.maman
            kind: vocabulary
            target: {text: "مامان", language_code: fa, direction: rtl}
            introduced_tokens: [مامان]
          - content_key: fa.a1.unit04.lesson01.teach.pedar
            kind: vocabulary
            target: {text: "پدر", language_code: fa, direction: rtl}
            introduced_tokens: [پدر]
          - content_key: fa.a1.unit04.lesson01.teach.baba
            kind: vocabulary
            target: {text: "بابا", language_code: fa, direction: rtl}
            introduced_tokens: [بابا]
          - content_key: fa.a1.unit04.lesson01.teach.baradar
            kind: vocabulary
            target: {text: "برادر", language_code: fa, direction: rtl}
            introduced_tokens: [برادر]
          - content_key: fa.a1.unit04.lesson01.teach.khahar
            kind: vocabulary
            target: {text: "خواهر", language_code: fa, direction: rtl}
            introduced_tokens: [خواهر]
          - content_key: fa.a1.unit04.lesson01.teach.register_note
            kind: grammar_note
            target: {text: "مامان و بابا مثل مادر و پدر هستن، ولی خودمونی‌ترن.", language_code: fa, direction: rtl}
            introduced_tokens: [مثل, خودمونی]
        exercises:
          - content_key: fa.a1.unit04.lesson01.exercise01.recognize_madar
            type: multiple_choice
            tested_text: مادر
            prompt: {target_blocks: [{text: "مادر", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson01.exercise02.recognize_pedar
            type: multiple_choice
            tested_text: پدر
            prompt: {target_blocks: [{text: "پدر", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson01.exercise03.recognize_baradar
            type: multiple_choice
            tested_text: برادر
            prompt: {target_blocks: [{text: "برادر", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson01.exercise04.match_formal_informal
            type: matching_pairs
            tested_text: مادر مامان پدر بابا
            prompt: {target_blocks: []}
            pairs:
              - {left: مادر, right: مامان}
              - {left: پدر, right: بابا}
          - content_key: fa.a1.unit04.lesson01.exercise05.listen_madar_pedar
            type: listen_select
            tested_text: مادر پدر
            media_asset_key: fa.a1.audio.madar_pedar.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit04.lesson01.exercise05b.recognize_khahar
            type: multiple_choice
            tested_text: خواهر
            prompt: {target_blocks: [{text: "خواهر", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson01.exercise06.order_khahar
            type: word_order
            tested_text: خواهر برادر
            prompt: {target_blocks: []}
            word_bank: [خواهر, برادر]
          - content_key: fa.a1.unit04.lesson01.exercise07.listen_baradar_khahar
            type: listen_type
            tested_text: برادر خواهر
            media_asset_key: fa.a1.audio.baradar_khahar.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit04.lesson01.exercise08.write_khahar
            type: writing_prompt
            tested_text: خواهر
            prompt: {target_blocks: [{text: "خواهر", language_code: fa, direction: rtl}]}

      - content_key: fa.a1.unit04.lesson02.describing_own_family
        title: معرفی خانواده‌ی خودم
        spine_outcome_id: universal.a1.family.describe_relationships
        teaching:
          - content_key: fa.a1.unit04.lesson02.teach.daram
            kind: grammar_note
            target: {text: "دارم", language_code: fa, direction: rtl}
            introduced_tokens: [دارم]
          - content_key: fa.a1.unit04.lesson02.teach.yek
            kind: vocabulary
            target: {text: "یک", language_code: fa, direction: rtl}
            introduced_tokens: [یک]
          - content_key: fa.a1.unit04.lesson02.teach.one_brother
            kind: phrase
            target: {text: "من یک برادر دارم.", language_code: fa, direction: rtl}
            introduced_tokens: [من, یک, برادر, دارم]
          - content_key: fa.a1.unit04.lesson02.teach.no_sister
            kind: phrase
            target: {text: "خواهر ندارم.", language_code: fa, direction: rtl}
            introduced_tokens: [خواهر, ندارم]
          - content_key: fa.a1.unit04.lesson02.teach.family_big
            kind: phrase
            target: {text: "خانواده‌ی من بزرگه.", language_code: fa, direction: rtl}
            introduced_tokens: ["خانواده‌ی", بزرگه]
          - content_key: fa.a1.unit04.lesson02.teach.family_small
            kind: phrase
            target: {text: "خانواده‌ی ما کوچیکه.", language_code: fa, direction: rtl}
            introduced_tokens: [ما, کوچیکه]
        exercises:
          - content_key: fa.a1.unit04.lesson02.exercise01.daram_meaning
            type: multiple_choice
            tested_text: دارم
            prompt: {target_blocks: [{text: "دارم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson02.exercise02.choose_one_brother
            type: multiple_choice
            tested_text: من یک برادر دارم
            prompt: {target_blocks: [{text: "Which sentence says 'I have one brother'?", language_code: en, direction: ltr}]}
          - content_key: fa.a1.unit04.lesson02.exercise03.order_one_brother
            type: word_order
            tested_text: من یک برادر دارم
            prompt: {target_blocks: []}
            word_bank: [دارم, برادر, یک, من]
          - content_key: fa.a1.unit04.lesson02.exercise04.listen_one_brother
            type: listen_type
            tested_text: من یک برادر دارم
            media_asset_key: fa.a1.audio.man_yek_baradar_daram.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit04.lesson02.exercise05.order_no_sister
            type: word_order
            tested_text: خواهر ندارم
            prompt: {target_blocks: []}
            word_bank: [ندارم, خواهر]
          - content_key: fa.a1.unit04.lesson02.exercise06.family_big_meaning
            type: multiple_choice
            tested_text: خانواده‌ی من بزرگه
            prompt: {target_blocks: [{text: "خانواده‌ی من بزرگه.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson02.exercise07.speak_own_family
            type: speak_response
            tested_text: من یک خواهر دارم برادر ندارم
            prompt: {target_blocks: [{text: "خانواده‌ت چطوریه؟ چند تا خواهر و برادر داری؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson02.exercise08.write_own_family
            type: writing_prompt
            tested_text: خانواده‌ی من بزرگه
            prompt: {target_blocks: [{text: "Describe whether your family is big or small in Farsi.", language_code: en, direction: ltr}]}

      - content_key: fa.a1.unit04.lesson03.extended_family
        title: خانواده‌ی بزرگ‌تر
        spine_outcome_id: universal.a1.family.describe_relationships
        teaching:
          - content_key: fa.a1.unit04.lesson03.teach.pedarbozorg
            kind: vocabulary
            target: {text: "پدربزرگ", language_code: fa, direction: rtl}
            introduced_tokens: [پدربزرگ]
          - content_key: fa.a1.unit04.lesson03.teach.madarbozorg
            kind: vocabulary
            target: {text: "مادربزرگ", language_code: fa, direction: rtl}
            introduced_tokens: [مادربزرگ]
          - content_key: fa.a1.unit04.lesson03.teach.amoo
            kind: vocabulary
            target: {text: "عمو", language_code: fa, direction: rtl}
            introduced_tokens: [عمو]
          - content_key: fa.a1.unit04.lesson03.teach.amme
            kind: vocabulary
            target: {text: "عمه", language_code: fa, direction: rtl}
            introduced_tokens: [عمه]
          - content_key: fa.a1.unit04.lesson03.teach.dayi
            kind: vocabulary
            target: {text: "دایی", language_code: fa, direction: rtl}
            introduced_tokens: [دایی]
          - content_key: fa.a1.unit04.lesson03.teach.khale
            kind: vocabulary
            target: {text: "خاله", language_code: fa, direction: rtl}
            introduced_tokens: [خاله]
          - content_key: fa.a1.unit04.lesson03.teach.register_note
            kind: grammar_note
            target: {text: "عمو و عمه طرف پدرن؛ دایی و خاله طرف مادرن.", language_code: fa, direction: rtl}
            introduced_tokens: [طرف, پدرن, مادرن]
        exercises:
          - content_key: fa.a1.unit04.lesson03.exercise01.recognize_pedarbozorg
            type: multiple_choice
            tested_text: پدربزرگ
            prompt: {target_blocks: [{text: "پدربزرگ", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson03.exercise02.recognize_madarbozorg
            type: multiple_choice
            tested_text: مادربزرگ
            prompt: {target_blocks: [{text: "مادربزرگ", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit04.lesson03.exercise02b.listen_aunts_uncles_recognition
            type: listen_select
            tested_text: عمو عمه دایی خاله
            media_asset_key: fa.a1.audio.amoo_amme_dayi_khale.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit04.lesson03.exercise03.match_paternal
            type: matching_pairs
            tested_text: عمو عمه دایی خاله پدربزرگ مادربزرگ
            prompt: {target_blocks: []}
            pairs:
              - {left: عمو, right: paternal uncle}
              - {left: عمه, right: paternal aunt}
              - {left: دایی, right: maternal uncle}
              - {left: خاله, right: maternal aunt}
              - {left: پدربزرگ, right: grandfather}
              - {left: مادربزرگ, right: grandmother}
          - content_key: fa.a1.unit04.lesson03.exercise05.listen_grandparents
            type: listen_select
            tested_text: پدربزرگ مادربزرگ
