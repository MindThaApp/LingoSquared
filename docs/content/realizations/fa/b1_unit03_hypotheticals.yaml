generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked firecrawl
    availability fresh before starting per the standing instruction to
    re-check even though it has been reported exhausted repeatedly:
    `firecrawl search "FSI Persian intermediate course B1 subjunctive
    conditional"` returned HTTP 402 (credits exhausted), same result as
    every prior check this cycle. Per fa's own b1_unit01/b1_unit02
    provenance notes, the FSI Persian Basic Course is separately confirmed
    beginner-only (12 units, no intermediate volume) even when Firecrawl
    access exists, so there is no adaptable Persian intermediate-level
    public-domain source for this outcome regardless of Firecrawl's quota.
    Genuinely nothing usable found; authored from general Persian grammar
    knowledge, same as fa's first two B1 units.

    This is fa's THIRD B1 unit, and its first to leave the modal-plus-
    embedded/subordinate-verb pattern that unit01 (باید, invariant) and
    unit02 (می‌تونم, fully conjugating) both used -- this unit's target is
    a two-clause CONDITIONAL sentence (اگه ... clause + result clause),
    genuinely new B1 sentence-level complexity (subordination via a
    conditional conjunction, not just an embedded-verb complement) rather
    than a third variation on the same modal-plus-verb shape. Teaches: (1)
    real/possible future condition, اگه + PERFECT SUBJUNCTIVE of داشتن
    ("داشته باشم" -- have-PastParticiple + subjunctive باشم, since داشتن
    has no colloquial simple-present-subjunctive in real use) + present-
    indicative result clause (می‌خرم); (2) unreal/counterfactual condition,
    اگه + PAST/IMPERFECT of داشتن (داشتم) + IMPERFECT result clause
    (می‌خریدم, doing double duty as both literal imperfect "was buying" and
    conditional "would buy" -- standard, unambiguous in context, real
    colloquial Persian, not an invented simplification); (3) negation of
    both. The governing verb داشتن (have) and the result-clause verb
    خریدن (buy) are held constant across every lesson (mirroring unit01's
    single-verb-family discipline with رفتن and unit02's with توانستن +
    رانندگی کردن), so the unit drills the CONDITIONAL CONSTRUCTION itself
    rather than vocabulary breadth.

    Deliberately avoided رفتن (go) entirely, unlike unit01/02, specifically
    so this unit's dialogue/reading don't accidentally reuse either prior
    unit's governing verb and read as a vocabulary reskin of the same
    sentence -- confirmed by grep against this file's own draft that رفتن
    inflections never appear.

    All vocabulary is introduced self-contained within this file (same
    convention as b1_unit01/02, necessary since validate_untaught_vocabulary
    scopes the taught-token set to a single realization file) -- even
    common words already taught in other fa files (پارسال, ولی, امسال) are
    redeclared here.

    Character-cast continuity: reuses fa's established recurring leads
    (نیما, سارا -- both already extensively used across the A1/A2/B1 fa
    corpus, confirmed via grep before writing) rather than inventing new
    names, per the same continuity check b1_unit02's provenance note
    documents (that unit corrected an earlier prs-cast-name mistake; this
    unit avoids repeating it by only using confirmed fa names).

    Lessons 01-03 drill the paradigm in first/second person, then all
    persons, then the counterfactual/negation contrast, exactly mirroring
    unit01/02's own three-lesson drill arc (a deliberate, established
    corpus convention for this course's B1 grammar-target lessons, not a
    coincidence). Lesson04 is a dialogue between نیما and سارا about a
    weekend purchase; lesson05 is a third-person reading recounting the
    same events (mirroring unit02's own first-person-then-third-person
    continuity device); lesson06 is production-only wrap-up.
