  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken colloquial register
    used throughout fa units 01-57 and B1 units 01-02. اگه is the
    colloquial contraction of literary اگر, used consistently throughout
    (matching the corpus's existing می‌تونم/باید-style colloquial
    contraction convention); the grammar note in lesson01 states the
    literary form for recognition only.

