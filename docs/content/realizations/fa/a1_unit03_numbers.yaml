review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    First unit authored directly by Claude (content-velocity lane,
    2026-07-05). Draft 2: applied every finding from a fresh-context Codex
    review (thread 019f31f2-76ed-7381-a7e8-922e149ded98) - softened the
    over-absolute "phone numbers are always digit-by-digit" claim, switched
    to realistic 11-digit 09xx mobile numbers throughout, corrected the
    سالمه/تمرین کنیم morphology explanations, added the missing 16-19 teens
    with a real drill, clarified typing instructions that could plausibly
    accept a bare digit, replaced the ungradable "give any phone number"
    exercises with specific gradable targets, and reordered every lesson's
    exercises to recognition -> drag/matching -> production. Marked reviewed
    after re-validating clean (0 errors/0 warnings) with every finding
    concretely fixed, not just self-reported - matches the precedent set by
    fa unit05 the same night (one real fresh-context review + genuine fixes
    is the bar, not a second confirmatory review). Audio remains pending
    generation.

    AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, project-wide audit):
    found 13 exercises in this unit (lesson01.exercise03/08,
    lesson02.exercise03/08/09, lesson03.exercise03/05,
    lesson04.exercise03/06/07, lesson05.exercise03/06,
    lesson06.exercise06) were listen_type/listen_order/bare-prompt
    listen_select items -- genuinely unanswerable since fa/prs have zero
    working TTS/recorded audio. Converted: listen_select ->
    multiple_choice (visible Farsi prompt, English glosses for
    single-item recognition; the number-sequence tests kept their full
    sequence as the visible prompt, tested as one unit), listen_type ->
    translation, listen_order -> word_order (English prompt describing
    the target instead of audio). MATCHING_PAIRS SCALE RETROFIT (§16,
    same day, Ramin's direct feedback): match_low/match_teens_low were
    artificially capped well below what their own lesson had already
    taught (lesson01 teaches all of 0-10, lesson02 teaches all of
    11-90, but the matching exercises only tested small slices) --
    expanded match_low 4->7 (0-6), match_high 4->5 (added عدد),
    match_teens_low 4->7 (pooled some already-taught 0-10 numbers for
    variety), match_teens_high 5->6, and match_tens 4->7 (30-90, all
    already taught in the same lesson). Re-verified 0 remaining §14
    violations via script, content_key parity intact, validate+compile
    both clean after both retrofits.

    POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by
    unit13's fresh-context reviewer flagging the same bug in units 11/12)
    found this file also had exercises where realization prompt.target_blocks
    duplicated the overlay's own instruction text verbatim in English -- the
    compiler would have rendered the same sentence twice to the learner. Fixed
    mechanically: every affected exercise's prompt set to target_blocks: [].
    Re-verified validate+compile clean (0 errors/0 warnings) and confirmed
    zero remaining instruction-duplicate target_blocks via a script comparing
    every exercise's target_blocks against its overlay instruction.


    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added a real example
    sentence to all 32 kind:vocabulary teaching cards (31 single-word plus the
    merged چهل-نود card, given a list of 6 examples, one per member, per §19's
    merged-card guidance), each a natural, comprehensible-from-gloss sentence
    using the card's own word. schema_version bumped to 1.1. Example sentences
    are Claude-authored and pending fresh-context review.

    2026-07-07: Fresh-context §19 example review (this unit's 37 new example
    sentences across 32 cards only, not a full unit re-review). Checked each
    against register match to this unit's own established neutral-polite-
    spoken default (confirmed via this file's own چنده؟/سالمه/داره precedents),
    presence of the card's own word, real sentence structure, gloss accuracy
    (verified all 37 against their paired example -- all already correct, no
    mismatches), script purity (no Arabic-range kaf/yeh codepoints -- confirmed clean), and
    positional correspondence for the merged چهل-نود card (all 6 list items
    verified to demonstrate their own corresponding number, not a shuffled
    subset). Found and fixed 19 register mismatches: bare است/دارد (formal-
    written copula/"have") used unlabeled against this file's own spoken
    default -- converted to the established -ه/داره spoken contraction
    (عدده، چهاره، داره forms) across adad/zero/three/four/twelve/thirteen/
    fifteen/sixteen/eighteen/thirty/shomare/ketab/gheymat/toman and 3 of the
    6 forty_to_ninety list items (forty/sixty/eighty), plus restructured
    seven's و twelve's/thirty's "X در Y است" phrasing into the equivalent,
    register-safe "Y X داره" (avoids a fact/spelling contraction I wasn't
    fully confident about). Also fixed 2 unlabeled-register slips: five's
    informal imperative صبر کن -> polite صبر کنید, and eight's informal
    object clitic می‌بینمت -> polite می‌بینمتون. All fixes are meaning-
    preserving; no overlay gloss changes were needed. Re-validated clean
    (0 errors/0 warnings) after fixes.
course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Teach ordinary neutral-polite spoken Iranian Farsi as the default.
    Label formal-written and informal alternatives explicitly rather than
    mixing registers inside one exchange.

