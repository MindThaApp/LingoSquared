      - content_key: fa.a1.unit03.lesson06.dialogue_phone_numbers
        title: رد و بدل کردن شماره تلفن
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: fa.a1.unit03.lesson06.teach.practice_together
            kind: dialogue
            target:
              text: "سارا: مینا، می‌خوام باهم فارسی تمرین کنیم. شماره تلفنت چنده؟"
              language_code: fa
              direction: rtl
            introduced_tokens: [سارا, مینا, می‌خوام, باهم, فارسی, تمرین, کنیم, شماره, تلفنت, چنده]
          - content_key: fa.a1.unit03.lesson06.teach.mina_gives_number
            kind: dialogue
            target:
              text: "مینا: باشه، حتماً. شماره‌ام صفر، نه، یک، دو، سه، چهار، پنج، شش، هفت، هشت، هشته."
              language_code: fa
              direction: rtl
            introduced_tokens: [مینا, باشه, حتماً, شماره‌ام, صفر, نه, یک, دو, سه, چهار, پنج, شش, هفت, هشت, هشته]
          - content_key: fa.a1.unit03.lesson06.teach.sara_confirms
            kind: dialogue
            target:
              text: "سارا: صبر کن بنویسم... صفر نه یک دو سه چهار پنج شش هفت هشت هشت، درسته؟"
              language_code: fa
              direction: rtl
            introduced_tokens: [صبر, کن, بنویسم, درسته]
          - content_key: fa.a1.unit03.lesson06.teach.mina_confirms_asks
            kind: dialogue
            target:
              text: "مینا: آره درسته. شماره تو چنده؟"
              language_code: fa
              direction: rtl
            introduced_tokens: [آره, درسته, شماره, تو, چنده]
          - content_key: fa.a1.unit03.lesson06.teach.sara_gives_number
            kind: dialogue
            target:
              text: "سارا: صفر، نه، یک، نه، هفت، شش، پنج، چهار، سه، دو، یکه."
              language_code: fa
              direction: rtl
            introduced_tokens: [صفر, نه, یک, نه, هفت, شش, پنج, چهار, سه, دو, یکه]
            note: "یکه contracts یک است, ending the count the same way هشته ended Mina's number."
          - content_key: fa.a1.unit03.lesson06.teach.mina_will_call
            kind: dialogue
            target:
              text: "مینا: باشه، فردا زنگ می‌زنم بهت."
              language_code: fa
              direction: rtl
            introduced_tokens: [باشه, فردا, زنگ, می‌زنم, بهت]
        exercises:
