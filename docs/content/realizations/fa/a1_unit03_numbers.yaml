        register) per docs/content/AUTHORING_GUIDE.md §10.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    First unit authored directly by Claude (content-velocity lane,
    2026-07-05). Draft 2: applied every finding from a fresh-context Codex
    review (thread 019f31f2-76ed-7381-a7e8-922e149ded98) - softened the
    over-absolute "phone numbers are always digit-by-digit" claim, switched
    to realistic 11-digit 09xx mobile numbers throughout, corrected the
    سالمه/تمرین کنیم morphology explanations, added the missing 16-19 teens
    with a real drill, clarified typing instructions that could plausibly
    accept a bare digit, replaced the ungradable "give any phone number"
    exercises with specific gradable targets, and reordered every lesson's
    exercises to recognition -> drag/matching -> production. Audio remains
    pending generation.

