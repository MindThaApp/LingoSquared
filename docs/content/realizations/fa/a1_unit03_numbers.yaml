            tested_text: شماره تلفنتون چنده صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            prompt:
              target_blocks:
                - {text: "شماره تلفنتون چنده؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson03.exercise07.write_digits
            type: fill_in_blank
            tested_text: صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            media_asset_key: fa.a1.audio.phone_number_read.01
            prompt:
              target_blocks:
                - {text: "Type the Persian word for each digit you hear, in order.", language_code: en, direction: ltr}
          - content_key: fa.a1.unit03.lesson03.exercise08.speak_number
