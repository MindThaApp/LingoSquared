      - content_key: fa.a1.unit03.lesson05.prices
        title: قیمت به تومن
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: fa.a1.unit03.lesson05.teach.gheymat
            kind: vocabulary
            target: {text: "قیمت", language_code: fa, direction: rtl}
            introduced_tokens: [قیمت]
          - content_key: fa.a1.unit03.lesson05.teach.toman
            kind: vocabulary
            target: {text: "تومن", language_code: fa, direction: rtl}
            introduced_tokens: [تومن]
            note: "تومن (toman) is the unit ordinary spoken Persian actually uses for prices, not the official rial."
          - content_key: fa.a1.unit03.lesson05.teach.hezar
            kind: vocabulary
            target: {text: "هزار", language_code: fa, direction: rtl}
            introduced_tokens: [هزار]
          - content_key: fa.a1.unit03.lesson05.teach.ask_price
            kind: phrase
            target: {text: "این چنده؟", language_code: fa, direction: rtl}
            introduced_tokens: [این, چنده]
          - content_key: fa.a1.unit03.lesson05.teach.price_answer
            kind: phrase
            target: {text: "سی هزار تومنه", language_code: fa, direction: rtl}
            introduced_tokens: [سی, هزار, تومنه]
            note: "تومنه contracts تومن است: number + هزار + تومن + است."
        exercises:
          - content_key: fa.a1.unit03.lesson05.exercise01.toman_meaning
            type: multiple_choice
            tested_text: تومن
            prompt:
              target_blocks:
                - {text: "تومن", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson05.exercise02.hezar_meaning
            type: multiple_choice
            tested_text: هزار
            prompt:
              target_blocks:
                - {text: "هزار", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson05.exercise03.listen_ask_price
            type: listen_select
            tested_text: این چنده
            media_asset_key: fa.a1.audio.ask_price.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit03.lesson05.exercise04.match_prices
            type: matching_pairs
            tested_text: ده هزار تومن سی هزار تومن
            prompt: {target_blocks: []}
            pairs:
              - {left: "ده هزار تومن", right: "10,000 toman"}
              - {left: "سی هزار تومن", right: "30,000 toman"}
          - content_key: fa.a1.unit03.lesson05.exercise05.order_price_answer
            type: word_order
            tested_text: سی هزار تومنه
            prompt:
              target_blocks:
                - {text: "Arrange: it's 30,000 toman.", language_code: en, direction: ltr}
            word_bank: [تومنه, سی, هزار]
          - content_key: fa.a1.unit03.lesson05.exercise06.listen_type_price
