      - content_key: fa.a1.unit03.lesson03.phone_numbers
        title: شماره تلفن
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: fa.a1.unit03.lesson03.teach.shomare
            kind: vocabulary
            target: {text: "شماره", language_code: fa, direction: rtl}
            introduced_tokens: [شماره]
            example: {text: "این شماره تلفن منه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson03.teach.telefon
            kind: vocabulary
            target: {text: "تلفن", language_code: fa, direction: rtl}
            introduced_tokens: [تلفن]
            example: {text: "من تلفن ندارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson03.teach.digit_by_digit
            kind: grammar_note
            target: {text: "شماره تلفنتون چنده؟", language_code: fa, direction: rtl}
            introduced_tokens: [شماره, تلفنتون, چنده]
            note: >-
              Reading a phone number one digit at a time (صفر نه یک دو...) is
              always understood and is the safest beginner strategy, so this
              lesson practices that form. In real speech, Iranians also
              commonly group a few digits together when reading a number
              aloud (e.g. reading the last four digits as two pairs) - both
              styles are authentic, this lesson just starts with the simpler
              one.
          - content_key: fa.a1.unit03.lesson03.teach.chande
            kind: phrase
            target: {text: "چنده؟", language_code: fa, direction: rtl}
            introduced_tokens: [چنده]
          - content_key: fa.a1.unit03.lesson03.teach.read_number
            kind: phrase
            target: {text: "صفر، نه، یک، دو، سه، چهار، پنج، شش، هفت، هشت، هشت", language_code: fa, direction: rtl}
            introduced_tokens: [صفر, نه, یک, دو, سه, چهار, پنج, شش, هفت, هشت]
            note: "A real Iranian mobile number has 11 digits and starts with 0, e.g. 0912 345 6788."
        exercises:
          - content_key: fa.a1.unit03.lesson03.exercise01.shomare_meaning
            type: multiple_choice
            tested_text: شماره
            prompt:
              target_blocks:
                - {text: "شماره", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson03.exercise02.telefon_meaning
            type: multiple_choice
            tested_text: تلفن
            prompt:
              target_blocks:
                - {text: "تلفن", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson03.exercise03.recognize_ask_reading
            type: multiple_choice
            tested_text: شماره تلفنتون چنده
            prompt: {target_blocks: [{text: "شماره تلفنتون چنده؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit03.lesson03.exercise04.order_ask
            type: word_order
            tested_text: شماره تلفنتون چنده
            prompt: {target_blocks: []}
            word_bank: [چنده, شماره, تلفنتون]
          - content_key: fa.a1.unit03.lesson03.exercise05.order_digits
            type: word_order
            tested_text: صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            prompt: {target_blocks: [{text: "0, 9, 1, 2, 3, 4, 5, 6, 7, 8, 8", language_code: en, direction: ltr}]}
            word_bank: [پنج, صفر, نه, دو, هشت, یک, هفت, سه, چهار, شش, هشت]
          - content_key: fa.a1.unit03.lesson03.exercise06.dialogue_give_number
            type: dialogue_response
            tested_text: شماره تلفنتون چنده صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            prompt:
              target_blocks:
                - {text: "شماره تلفنتون چنده؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson03.exercise07.translate_phone_digits
            type: translation
            tested_text: صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit03.lesson03.exercise08.speak_number
            type: speak_response
            tested_text: صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            prompt:
              target_blocks:
                - {text: "شماره تلفنتون چنده؟", language_code: fa, direction: rtl}

      - content_key: fa.a1.unit03.lesson04.ages_and_quantities
        title: سن و تعداد
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: fa.a1.unit03.lesson04.teach.man_recap
            kind: grammar_note
            target: {text: "من", language_code: fa, direction: rtl}
            introduced_tokens: [من]
            note: "A quick recap of I, needed to say my own age in full sentences below."
          - content_key: fa.a1.unit03.lesson04.teach.sal
            kind: vocabulary
            target: {text: "سال", language_code: fa, direction: rtl}
            introduced_tokens: [سال]
            example: {text: "من بیست سال دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson04.teach.chand_saale
            kind: phrase
            target: {text: "چند سالته؟", language_code: fa, direction: rtl}
            introduced_tokens: [چند, سالته]
            note: "Informal singular; چند سالتونه؟ is the polite equivalent."
          - content_key: fa.a1.unit03.lesson04.teach.salame
            kind: grammar_note
            target: {text: "بیست و پنج سالمه", language_code: fa, direction: rtl}
            introduced_tokens: [بیست, و, پنج, سالمه]
            note: >-
              سالمه attaches the possessive ending ـم (my) directly onto
              سال, then adds the colloquial copula ـه (is) - literally
              "my-year-is", i.e. "I am ... years old."
          - content_key: fa.a1.unit03.lesson04.teach.ta
            kind: grammar_note
            target: {text: "تا", language_code: fa, direction: rtl}
            introduced_tokens: [تا]
            note: "تا is the general counting classifier: number + تا + noun, e.g. دو تا سیب 'two apples'."
          - content_key: fa.a1.unit03.lesson04.teach.sib
            kind: vocabulary
            target: {text: "سیب", language_code: fa, direction: rtl}
            introduced_tokens: [سیب]
            example: {text: "من سیب دوست دارم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson04.teach.ketab
            kind: vocabulary
            target: {text: "کتاب", language_code: fa, direction: rtl}
            introduced_tokens: [کتاب]
            example: {text: "این کتاب خوبیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson04.teach.do_ta_sib
            kind: phrase
            target: {text: "دو تا سیب می‌خوام", language_code: fa, direction: rtl}
            introduced_tokens: [دو, تا, سیب, می‌خوام]
        exercises:
          - content_key: fa.a1.unit03.lesson04.exercise01.sal_meaning
            type: multiple_choice
            tested_text: سال
            prompt:
              target_blocks:
                - {text: "سال", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson04.exercise02.ta_meaning
            type: multiple_choice
            tested_text: تا
            prompt:
              target_blocks:
                - {text: "دو تا سیب", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson04.exercise03.recognize_ask_age_reading
            type: multiple_choice
            tested_text: چند سالته
            prompt: {target_blocks: [{text: "چند سالته؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit03.lesson04.exercise04.order_age_answer
            type: word_order
            tested_text: من بیست و پنج سالمه
            prompt: {target_blocks: []}
            word_bank: [سالمه, بیست, من, پنج, و]
          - content_key: fa.a1.unit03.lesson04.exercise05.match_quantities
            type: matching_pairs
            tested_text: یک تا سیب دو تا سیب سه تا کتاب چهار تا سیب پنج تا کتاب شش تا سیب هفت تا کتاب هشت تا سیب
            prompt: {target_blocks: []}
            pairs:
              - {left: "یک تا سیب", right: "one apple"}
              - {left: "دو تا سیب", right: "two apples"}
              - {left: "سه تا کتاب", right: "three books"}
              - {left: "چهار تا سیب", right: "four apples"}
              - {left: "پنج تا کتاب", right: "five books"}
              - {left: "شش تا سیب", right: "six apples"}
              - {left: "هفت تا کتاب", right: "seven books"}
              - {left: "هشت تا سیب", right: "eight apples"}
          - content_key: fa.a1.unit03.lesson04.exercise06.order_want
            type: word_order
            tested_text: دو تا سیب می‌خوام
            prompt: {target_blocks: [{text: "I'd like two apples.", language_code: en, direction: ltr}]}
            word_bank: [سیب, می‌خوام, دو, تا]
          - content_key: fa.a1.unit03.lesson04.exercise07.translate_age_answer
            type: translation
            tested_text: من بیست و پنج سالمه
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit03.lesson04.exercise08.dialogue_answer_age
            type: dialogue_response
            tested_text: چند سالته سالمه
            prompt:
              target_blocks:
                - {text: "چند سالته؟", language_code: fa, direction: rtl}

      - content_key: fa.a1.unit03.lesson05.prices
        title: قیمت به تومن
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: fa.a1.unit03.lesson05.teach.gheymat
            kind: vocabulary
            target: {text: "قیمت", language_code: fa, direction: rtl}
            introduced_tokens: [قیمت]
            example: {text: "قیمت این چقدره؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit03.lesson05.teach.toman
            kind: vocabulary
            target: {text: "تومن", language_code: fa, direction: rtl}
            introduced_tokens: [تومن]
            example: {text: "این ده هزار تومنه.", language_code: fa, direction: rtl}
            note: "تومن (toman) is the unit ordinary spoken Persian actually uses for prices, not the official rial."
          - content_key: fa.a1.unit03.lesson05.teach.hezar
            kind: vocabulary
