            media_asset_key: fa.a1.audio.ask_phone_number.polite.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit03.lesson03.exercise04.order_ask
            type: word_order
            tested_text: شماره تلفنتون چنده
            prompt: {target_blocks: []}
            word_bank: [چنده, شماره, تلفنتون]
          - content_key: fa.a1.unit03.lesson03.exercise05.listen_read_digits
            type: listen_order
            tested_text: صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            media_asset_key: fa.a1.audio.phone_number_read.01
            prompt: {target_blocks: []}
            word_bank: [پنج, صفر, نه, دو, هشت, یک, هفت, سه, چهار, شش, هشت]
          - content_key: fa.a1.unit03.lesson03.exercise06.dialogue_give_number
