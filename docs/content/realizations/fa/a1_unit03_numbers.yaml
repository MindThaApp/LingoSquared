      - content_key: fa.a1.unit03.lesson04.ages_and_quantities
        title: سن و تعداد
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: fa.a1.unit03.lesson04.teach.man_recap
            kind: grammar_note
            target: {text: "من", language_code: fa, direction: rtl}
            introduced_tokens: [من]
            note: "A quick recap of I, needed to say my own age in full sentences below."
          - content_key: fa.a1.unit03.lesson04.teach.sal
            kind: vocabulary
            target: {text: "سال", language_code: fa, direction: rtl}
            introduced_tokens: [سال]
          - content_key: fa.a1.unit03.lesson04.teach.chand_saale
            kind: phrase
            target: {text: "چند سالته؟", language_code: fa, direction: rtl}
            introduced_tokens: [چند, سالته]
            note: "Informal singular; چند سالتونه؟ is the polite equivalent."
          - content_key: fa.a1.unit03.lesson04.teach.salame
            kind: grammar_note
            target: {text: "بیست و پنج سالمه", language_code: fa, direction: rtl}
            introduced_tokens: [بیست, و, پنج, سالمه]
            note: >-
              سالمه attaches the possessive ending ـم (my) directly onto
              سال, then adds the colloquial copula ـه (is) - literally
              "my-year-is", i.e. "I am ... years old."
          - content_key: fa.a1.unit03.lesson04.teach.ta
            kind: grammar_note
            target: {text: "تا", language_code: fa, direction: rtl}
            introduced_tokens: [تا]
            note: "تا is the general counting classifier: number + تا + noun, e.g. دو تا سیب 'two apples'."
          - content_key: fa.a1.unit03.lesson04.teach.sib
            kind: vocabulary
