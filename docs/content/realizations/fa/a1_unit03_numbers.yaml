              - {left: "چهل هزار تومن", right: "40,000 toman"}
              - {left: "پنجاه هزار تومن", right: "50,000 toman"}
              - {left: "شصت هزار تومن", right: "60,000 toman"}
              - {left: "هفتاد هزار تومن", right: "70,000 toman"}
              - {left: "هشتاد هزار تومن", right: "80,000 toman"}
