      - content_key: fa.a1.unit03.lesson06.dialogue_phone_numbers
        title: رد و بدل کردن شماره تلفن
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: fa.a1.unit03.lesson06.teach.practice_together
            kind: dialogue
            target:
              text: "سارا: مینا، می‌خوام باهم فارسی تمرین کنیم. شماره تلفنت چنده؟"
              language_code: fa
              direction: rtl
            introduced_tokens: [سارا, مینا, می‌خوام, باهم, فارسی, تمرین, کنیم, شماره, تلفنت, چنده]
          - content_key: fa.a1.unit03.lesson06.teach.mina_gives_number
            kind: dialogue
            target:
              text: "مینا: باشه، حتماً. شماره‌ام صفر، نه، یک، دو، سه، چهار، پنج، شش، هفت، هشت، هشته."
              language_code: fa
              direction: rtl
            introduced_tokens: [مینا, باشه, حتماً, شماره‌ام, صفر, نه, یک, دو, سه, چهار, پنج, شش, هفت, هشت, هشته]
          - content_key: fa.a1.unit03.lesson06.teach.sara_confirms
            kind: dialogue
            target:
              text: "سارا: صبر کن بنویسم... صفر نه یک دو سه چهار پنج شش هفت هشت هشت، درسته؟"
              language_code: fa
              direction: rtl
            introduced_tokens: [صبر, کن, بنویسم, درسته]
          - content_key: fa.a1.unit03.lesson06.teach.mina_confirms_asks
            kind: dialogue
            target:
              text: "مینا: آره درسته. شماره تو چنده؟"
              language_code: fa
              direction: rtl
            introduced_tokens: [آره, درسته, شماره, تو, چنده]
          - content_key: fa.a1.unit03.lesson06.teach.sara_gives_number
            kind: dialogue
            target:
              text: "سارا: صفر، نه، یک، نه، هفت، شش، پنج، چهار، سه، دو، یکه."
              language_code: fa
              direction: rtl
            introduced_tokens: [صفر, نه, یک, نه, هفت, شش, پنج, چهار, سه, دو, یکه]
            note: "یکه contracts یک است, ending the count the same way هشته ended Mina's number."
          - content_key: fa.a1.unit03.lesson06.teach.mina_will_call
            kind: dialogue
            target:
              text: "مینا: باشه، فردا زنگ می‌زنم بهت."
              language_code: fa
              direction: rtl
            introduced_tokens: [باشه, فردا, زنگ, می‌زنم, بهت]
        exercises:
          - content_key: fa.a1.unit03.lesson06.exercise01.listen_purpose
            type: dialogue_comprehension
            tested_text: باهم فارسی تمرین کنیم
            media_asset_key: fa.a1.audio.dialogue.phone_numbers.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit03.lesson06.exercise02.who_asks_first
            type: dialogue_comprehension
            tested_text: سارا شماره تلفنت چنده
            media_asset_key: fa.a1.audio.dialogue.phone_numbers.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit03.lesson06.exercise03.mina_response_style
            type: multiple_choice
            tested_text: باشه حتماً
            prompt:
              target_blocks:
                - {text: "How does Mina respond when Sara asks for her number?", language_code: en, direction: ltr}
          - content_key: fa.a1.unit03.lesson06.exercise04.who_calls_tomorrow
            type: dialogue_comprehension
            tested_text: مینا فردا زنگ می‌زنم بهت
            media_asset_key: fa.a1.audio.dialogue.phone_numbers.01
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit03.lesson06.exercise05.order_confirm
            type: word_order
            tested_text: آره درسته
            prompt:
              target_blocks:
                - {text: "Arrange: yes, that's right.", language_code: en, direction: ltr}
            word_bank: [درسته, آره]
          - content_key: fa.a1.unit03.lesson06.exercise06.listen_type_minas_number
            type: listen_type
            tested_text: صفر نه یک دو سه چهار پنج شش هفت هشت هشت
            media_asset_key: fa.a1.audio.dialogue.phone_numbers.mina_number.01
            prompt:
              target_blocks:
                - {text: "Type Mina's phone number, one Persian word per digit.", language_code: en, direction: ltr}
          - content_key: fa.a1.unit03.lesson06.exercise07.dialogue_give_saras_number
            type: dialogue_response
            tested_text: شماره تو چنده صفر نه یک نه هفت شش پنج چهار سه دو یکه
            prompt:
              target_blocks:
                - {text: "Reply as Sara, giving her number: 09197654321.", language_code: en, direction: ltr}
          - content_key: fa.a1.unit03.lesson06.exercise08.speak_saras_number
            type: speak_response
            tested_text: صفر نه یک نه هفت شش پنج چهار سه دو یکه
            prompt:
              target_blocks:
                - {text: "Say Sara's phone number aloud: 09197654321.", language_code: en, direction: ltr}
