generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked the local
    `.firecrawl/` cache before writing (per standing instruction, since
    Firecrawl reports 402/credits-exhausted on the live network) -- no
    cached material relevant to Persian relative clauses was found there,
    and the FSI Persian Basic Course is separately confirmed beginner-only
    (see every prior fa B1 unit's own provenance note). Authored from
    general Persian grammar knowledge.

    This is fa's TENTH B1 unit, the fourth of the "second wave" (only the
    outcome id was reused from en-nl's own second-wave course -- verified
    verbatim against universal_spine.yaml -- never nl's actual content;
    no nl file was opened while authoring this one).

    Grammar target: RELATIVE CLAUSES with که, in three genuinely distinct
    shapes: (1) SUBJECT relative (کسی که..., "the person who...") -- no
    resumptive pronoun needed, since که + a verb already agreeing with the
    antecedent as its subject is a complete relative clause; (2) OBJECT
    relative, which in colloquial Persian REQUIRES a resumptive object
    clitic on the verb (کتابی که خریدمش, "the book that I bought [it]") --
    unlike English, which fronts the relative pronoun and leaves a gap,
    Persian keeps the object pronoun IN PLACE as a clitic, referring back
    to the antecedent; (3) OBLIQUE/PREPOSITIONAL relative, where the
    resumptive pronoun must attach to a PREPOSITION rather than the verb
    (دوستی که باهاش حرف زدم, "the friend that I talked with [him]" --
    literally "the friend that with-him I talked") -- this is the
    spine outcome's own explicitly named hardest case ("the relative
    pronoun must... combine with a preposition"), genuinely distinct from
    every other که-clause this fa B1 course has taught so far: unit04's
    که reports a THOUGHT (فکر می‌کنم که), unit06's که reports an UTTERANCE
    (گفت که), unit09's که softens a REQUEST (امکانش هست که)/reports a
    SUGGESTION (پیشنهاد می‌کنم که) -- none of those are relative clauses
    modifying a noun at all; this unit's که genuinely attaches to and
    identifies a noun phrase, a different syntactic function entirely.

    Continues نیما's established narrator role (unit02/03/06/07) and his
    established friendship with سارا (first shown together in unit03's
    weekend-shopping dialogue) -- rather than inventing a new relationship
    from nothing, since a "describe someone you know" unit genuinely
    benefits from an already-established real friendship rather than a
    stranger. Nothing established about نیما or سارا elsewhere in the
    corpus is contradicted (this unit adds narrator-voice description of
    an existing friendship, doesn't introduce new biographical facts that
    conflict with unit01/03/05's own established facts about سارا's
    workplace life).

    All vocabulary is introduced self-contained within this file (the
    established per-file convention).

    Character-cast continuity: reuses نیما and سارا, both established
    (confirmed via grep against the fa corpus before writing); no new
    character introduced. No nl or other sibling-direction file was
    opened while authoring this one.

    Lessons 01-03 drill the three relative-clause shapes in turn (subject,
    then object, then oblique/prepositional -- deliberately ordered
    easiest-to-hardest, matching the spine outcome's own framing of the
    prepositional case as the hardest); lesson04 is a dialogue in which
    نیما describes سارا to a third party using all three shapes; lesson05
    is a third-person reading in which نیما describes his hometown using
    a locative relative clause with a prepositional resumptive; lesson06
    is production-only wrap-up -- the same six-lesson arc established
    across every prior fa B1 unit.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude), cold, no access to the
    authoring reasoning above. Verified all three relative-clause shapes and
    their resumptive pronouns are correct colloquial Persian: subject
    relatives (کسی که) correctly take NO resumptive; object relatives take the
    object clitic on the verb (خریدمش = خریدم+ش); oblique/prepositional
    relatives attach the resumptive to the preposition (باهاش = با+ش، توش =
    تو+ش), including correct number agreement (plural باهاشون for plural
    antecedent همسایه‌ها). word_order accepted_answers comma-free/correct
    order (the ZWNJ token سارا‌ست matches its tile). Two objective bugs fixed
    in the overlay: (1) the باهاش teach note mis-analysed the clitic as *هاش*
    -- corrected to *ش* with a linking *ها*, matching the sibling توش note and
    the recognize_bahash feedback which both already said ش; (2) lesson05
    exercise05's English instruction said "the neighbors that I was close
    with" while the accepted answer صمیمی بود is 3rd person ("he was close",
    matching the 3rd-person reading about نیما) -- instruction corrected to
    "he was close with." Judgment flag (not fixed): "کاری که می‌کنه" is grouped
    under the object-relative lesson but carries no resumptive clitic -- it is
    genuinely natural Persian (کار کردن light verb), so left as-is, but a
    native pass may want a cleaner illustrating example. Continues نیما/سارا.

course:
  realization_key: fa.b1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken colloquial register
    used throughout fa units 01-57 and B1 units 01-09. Relative clauses
    with که are register-neutral, used identically in casual speech and
    more formal registers, so this unit's between-friends narration needs
    no special register marking.

