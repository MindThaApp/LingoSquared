generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked Firecrawl
    quota fresh before starting (the standing instruction to re-check even
    though it has been reported exhausted in every prior round): `firecrawl
    --status` reports 0/1,000 credits remaining this cycle (0% left, same
    result as every prior check). Per fa's own b1_unit01 provenance note,
    the FSI Persian Basic Course is separately confirmed beginner-only (12
    units, no intermediate volume) even when Firecrawl access exists, so
    there is no adaptable Persian intermediate-level public-domain source
    for this outcome regardless of Firecrawl's quota. Genuinely nothing
    usable found; authored from general Persian grammar knowledge, same as
    fa's first B1 unit.

    This is fa's SECOND B1 unit. Teaches توانستن (to be able) as the B1
    target: full present-tense paradigm across all six persons, contrasted
    with PAST general ability (می‌تونستم) and negation in both tenses,
    across a car-repair/driver's-license errand scenario -- a direct fit
    for this outcome's own "errands, permissions, and appointments" framing
    in universal_spine.yaml. This is the SAME spine outcome
    (universal.b1.abilities.express_ability_with_embedded_clause) that
    prs's own b1_unit01 already covers, which is legitimate per the
    spine's own schema_notes.outcomes_not_order rule -- a realization may
    reorder outcomes freely; fa is simply teaching this outcome as its
    SECOND B1 unit rather than its first, not duplicating prs's file. No
    prs file was opened or consulted while authoring this one.

    Character-cast correction: the task brief that prompted this unit
    mentioned maintaining "Homayoun/Zarmina" cast continuity. Those are
    prs (Dari) character names, not fa (Iranian Farsi) ones -- confirmed
    by grep against every existing docs/content/realizations/fa/*.yaml
    file (zero hits for either name), while سارا (560 corpus hits) and
    نیما (671 hits) are fa's actual, extensively-established recurring
    leads (نیما already appears as the customer/protagonist in units
    20/44/45, among others). Using Homayoun/Zarmina here would have
    imported prs's cast into a Farsi file -- exactly the kind of
    dialect-authenticity error AUTHORING_GUIDE.md #3 warns against ("never
    reuse the actual fa/prs text... across the two"), extended here to
    character identity, not just text. This unit instead continues fa's
    real, established cast: نیما as protagonist/narrator, and رضا (54
    prior corpus hits, an existing fa name) as a new supporting character,
    a workshop mechanic.

    Grammar target is deliberately distinct from fa's OWN b1_unit01
    (necessity/باید, an INVARIANT modal -- never conjugates for person or
    tense) and from how prs's b1_unit01 frames this same ability outcome:
    توانستن fully CONJUGATES for both person AND tense
    (می‌تونم/می‌تونی/.../می‌تونستم/نمی‌تونستم), while the embedded
    subjunctive complement verb it governs ALSO independently agrees with
    the subject (رانندگی کنم/کنی/کنه/کنیم/کنید/کنن) -- a genuine
    double-agreement construction, structurally the mirror image of
    unit01's single-conjugating-element باید+subjunctive pattern (where
    باید itself never changes and only the complement verb carries
    person). This is called out explicitly in this unit's own grammar
    notes as a callback to unit01.

    All vocabulary is introduced self-contained within this file (same
    convention as b1_unit01, confirmed necessary since
    validate_untaught_vocabulary scopes the taught-token set to a single
    realization file) -- not assumed already taught even though
    می‌تونم/نمی‌تونم/می‌تونی already appear informally in fa's A1 corpus
    (grep-confirmed in units 12/17/20/44/45 before writing this unit).
    باید itself is reintroduced here too (in lesson04's dialogue) purely
    as a deliberate callback/review token connecting the two B1 units, not
    because this unit's own grammar target needs it.

    Character/story continuity check: lessons 01-03 narrate Nima's own
    driving-ability story in the FIRST person (couldn't drive last year,
    got his license and can drive this year); lesson05's reading recounts
    the exact same facts about him in the THIRD person, deliberately, as a
    two-angle continuity device rather than an accidental duplicate --
    confirmed no contradiction between the two tellings.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude), performed cold with no access
    to the authoring reasoning above. Verified the توانستن ability paradigm
    (می‌تونم/می‌تونی/می‌تونه/می‌تونیم/می‌تونید/می‌تونن + independently-agreeing
    subjunctive complement رانندگی کنم/کنی/...) is grammatically correct
    colloquial Iranian Farsi with a genuine double-agreement construction;
    past ability می‌تونستم/نمی‌تونستم and lesson05's third-person retelling
    (نمی‌تونست، گواهینامه گرفت) are internally consistent and don't contradict
    the first-person telling in lessons 01-03. Character cast (نیما, رضا)
    confirmed established in the wider fa corpus, no prs-name leak. Compiler
    validate AND compile both 0 errors/0 warnings. Mechanical footgun sweep
    clean: no Arabic-range kaf/yeh, no stray unquoted YAML booleans, no
    content_items.title over 200 chars, every exercise type registered in
    ExerciseRenderer.tsx, no snake_case jargon leaks, every accepted_answers
    variant carries a value: key, matching_pairs/word_order answer shapes
    canonicalize correctly. B1-appropriate (embedded subjunctive complement,
    causal چون subordination, present/past ability contrast). One §12
    additive fix applied to the paired overlay: the two "was able to get a
    driver's license" production translations accepted only the
    imperfect-ability form (می‌تونستم گواهینامه بگیرم); added the
    preterite/accomplishment form تونستم گواهینامه بگیرم as an equally-correct
    variant, since a realized one-time accomplishment is at least as
    naturally rendered with the preterite and a learner producing it would
    otherwise have been wrongly marked incorrect.

course:
  realization_key: fa.b1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken colloquial register
    (می‌تونم-style contractions of the literary می‌توانم) used throughout
    fa units 01-57 and b1_unit01. توانستن fully conjugates for person in
    both the colloquial and literary registers; only the colloquial
    contraction (توانستن -> تون-) is used here, matching the corpus's
    consistent colloquial register throughout.

