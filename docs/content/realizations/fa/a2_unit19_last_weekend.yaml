review:
  status: unreviewed
  required_next_reviewer: fresh_context_content_review
  notes: 'Wave-0 pilot unit for the grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block A unit A1), spine outcome universal.a2.past.narrate_recent_weekend. Grammar target: the simple past as a system (past stem = infinitive minus final ن, person endings, 3sg = bare stem) and the negative past with نـ (نرفتم، نخوردم), incl. the اومدن exception (نیومدم), plus past vs present (می‌) and negation of noun+کردن verbs (خرید نکردم). Register: colloquial Tehrani spoken Persian, consistent with the existing fa A2 units. Characters: the established Sara (teacher) / Nima (engineer) friend pair; no job/family facts are asserted, and the Thursday/Friday Iranian weekend follows a2_unit17. Every recycled A1 word (routines, past events, outings, errands) is re-declared in this unit''s own L01/L02 vocabulary cards so the unit is self-sufficient inside the A2 course. Listening uses listen_select + dictation (fa has TTS per AUTHORING_GUIDE 14/14a); no audio-only exercise depends on prs. Authored independently of every prs file (never opened). Pending fresh-context review. Reviewer native questions (2026-09 fresh-context review, to confirm with a native speaker): (1) is آخر هفته‌ی پیش the natural way to say ''last weekend'', or is آخر هفته‌ی گذشته / آخر هفته alone better? (2) آخرش vs در آخر for ''in the end'' in an ordered account. (3) Ruling on the colloquial ''verb + به + place'' pattern (رفتم به پارک / نرفتم به سینما): accepted everywhere in this unit alongside ''به + place + verb'' and the به-drop forms; confirm it is natural spoken usage. (4) Naturalness of the به-drop object-before-verb order (پارک رفتم / سینما نرفتم / بانک رفتم) versus verb-first (رفتم پارک). (5) Scope of رفتم خرید: ''I went shopping'' (general shopping and errands) -- and خرید is also the 3sg past ''he/she bought''. (6) Thursday/Friday as the weekend versus Iran''s newer Saturday-holiday arrangement for many offices -- should the note say ''Thursday and Friday (Saturday too in some workplaces)''? (7) Spelling of پنجشنبه: joined (as used here), پنج‌شنبه with ZWNJ, or پنج شنبه with a space; grading folds ZWNJ but not a space, and speech-to-text may return the spaced form. (8) Whether نیامدیم (written form of نیومدیم) should be accepted as a typed answer (currently acceptable_with_note). (9) آخرش اومدم خونه as the closing event after going out, and یه vs یک before کتاب (both accepted).'
course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: 'Casual spoken Iranian (Tehrani) register between two established friends: colloquial verb forms (خونه، موندم، خوندم، اومدم، نیومدم), pronoun dropping, and the optional به after رفتن (رفتم پارک / به پارک رفتم). Written-only alternatives (آمدم، نیامدم، رفتند) are mentioned in notes for recognition only.'
