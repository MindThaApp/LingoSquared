  notes: 'Spine outcome: universal.a2.modality.state_ability_and_possibility. Grammar target: می‌تونم / نمی‌تونم / می‌تونی / می‌تونه + subjunctive (می‌تونم بیام، نمی‌تونم صحبت کنم) for ability and availability; ممکنه / شاید + subjunctive for possibility (ممکنه دیر برسم، شاید بتونم بیام); contrast with باید. Register: casual spoken Tehrani Persian (بیام، برم، گوشی، اشکالی نداره). Characters: established friends Sara (teacher) and Nima (engineer) per a1_unit18_work; no new job or family facts asserted (only a meeting, being free or busy, and general skills). Delivers listening, speaking, reading and a culminating written message with one ability, one inability and one possibility. Authored without opening any prs file. NATIVE QUESTIONS: (1) After شاید, is the subjunctive بتونم (شاید بتونم بیام) the most natural spoken form, or do speakers also say شاید می‌تونم بیام? Recommended: keep شاید بتونم بیام as the only taught form. (2) Is the negative subjunctive after ممکنه natural as taught (ممکنه نیام، ممکنه نیاد، ممکنه نرم)? Recommended: yes, keep. (3) As Sara''s reply to a possible delay, is اشکالی نداره the best spoken choice, or would مشکلی نیست / اشکال نداره be more usual? Recommended: keep اشکالی نداره. (4) Is فردا وقت داری؟ the natural way to ask about availability to a friend, or would فردا آزادی؟ be preferred? Recommended: keep وقت داری; آزادم is taught only as the answer.'
