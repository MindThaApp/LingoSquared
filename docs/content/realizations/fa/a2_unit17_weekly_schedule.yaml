        teaching:
          - content_key: fa.a2.unit17.lesson04.teach.good_week_phrase
            kind: phrase
            target: {text: "هفته‌ی خوبی داری!", language_code: fa, direction: rtl}
            introduced_tokens: [خوبی, داری, "می‌کند"]
          - content_key: fa.a2.unit17.lesson04.teach.turn01
            kind: dialogue
            target: {text: "سارا، هفته‌ات چطوره؟ برنامه‌ت چیه؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [نیما, سارا, چطوره, "برنامه‌ت", چیه]
          - content_key: fa.a2.unit17.lesson04.teach.turn02
            kind: dialogue
            target: {text: "اول، شنبه تا چهارشنبه سر کار می‌رم.", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: ["سر کار", سر, "می‌رم"]
          - content_key: fa.a2.unit17.lesson04.teach.turn03
            kind: dialogue
            target: {text: "بعدش چی؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: [چی]
          - content_key: fa.a2.unit17.lesson04.teach.turn04
            kind: dialogue
            target: {text: "بعد، پنجشنبه‌ها خرید می‌کنم و خونه رو تمیز می‌کنم.", language_code: fa, direction: rtl, speaker: سارا}
