  notes: >-
    Ninth A2 unit for the fa realization (spine outcome: universal.a2.
    routines.describe_weekly_schedule) -- the third of 4 new fa A2 units
    covering 4 brand-new A2 spine outcomes added this session. Reuses the
    established سارا/نیما friend pair (AUTHORING_GUIDE §11), continuing
    their a1_unit11 (routines) daily-schedule conversation into a genuine
    A2 step-up: a full WEEK with the real Iranian work-week structure
    (شنبه تا چهارشنبه = Saturday-Wednesday work days, پنجشنبه/جمعه =
    Thursday/Friday weekend -- verified real Iranian convention, not the
    Western Saturday/Sunday weekend), sequenced with اول/بعد/در آخر
    (first/then/finally) connectors and the habitual "-ها" day-name suffix
    (پنجشنبه‌ها = "on Thursdays", every week) per this outcome's own
    prerequisites (universal.a1.routines.describe_daily_routine +
    universal.a1.plans.make_simple_plans). Weekday vocabulary itself was
    already taught in a1_unit10 (dates), but per this pipeline's own
    per-file token-coverage validation, every weekday actually tested in
    THIS unit's own exercises is freshly re-declared via this file's own
    recap card (AUTHORING_GUIDE §11's "already taught, still fair game as
    background vocabulary" -- re-declared, not re-taught from scratch).
    Own scenario, authored independently of the English/Dutch A2 units
    and of the prs sibling realization of this same outcome (not
    consulted, per §8) -- also did not consult the nl realization built
    for this same new spine outcome this session. Every kind:vocabulary
    card carries a real example: sentence per §19, authored at
    schema_version 1.1 from the start. No fill_in_blank used (§13/§17
    n/a). No listen_type/listen_select/listen_order or audio-only
    dialogue_comprehension anywhere per §14 -- every exercise has a real
    visible text prompt; media_assets is pre-staging only, unreferenced by
    any exercise. Every multi-clause accepted_answers list carries
    period/comma/و-joined forms per §12. matching_pairs uses 6 pairs per
    §16. Every fact (works شنبه-چهارشنبه, shops/cleans on پنجشنبه, rests
    and sees friends on جمعه) kept consistent across lesson02/03/04 per
    §11 -- lesson03's written schedule and lesson04's dialogue describe
    the same real week, not two unrelated facts. Dialect: continues fa's
    established Iranian register (هستم-family copula, colloquial -e/-ه
    contractions like "چطوره"/"چیه"), deliberately never Dari forms.
    Checked script purity by eye against known-correct Persian-range
    keheh/yeh usage throughout. firecrawl re-checked fresh this pass
    (`firecrawl --status`): still 0/1,000 credits -- authored via
    established-conventions-only per the standing contingency. Pending
    fresh-context review; left unreviewed per AUTHORING_GUIDE §9.

