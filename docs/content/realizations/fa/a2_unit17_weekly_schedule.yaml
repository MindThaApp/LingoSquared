units:
  - content_key: fa.a2.unit17.weekly_schedule
    title: برنامه‌ی هفتگی
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.routines.describe_weekly_schedule
    planned_lesson_count: 4

    lessons:
      - content_key: fa.a2.unit17.lesson01.weekly_schedule_vocabulary
        title: کلمات مربوط به برنامه‌ی هفتگی
        spine_outcome_id: universal.a2.routines.describe_weekly_schedule
        teaching:
          - content_key: fa.a2.unit17.lesson01.teach.week_word
            kind: vocabulary
            target: {text: هفته, language_code: fa, direction: rtl}
            introduced_tokens: [هفته, "هفته‌ات", "هفته‌ی"]
            example: {text: "این هفته خیلی شلوغه.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit17.lesson01.teach.weekend_word
            kind: vocabulary
            target: {text: "آخر هفته", language_code: fa, direction: rtl}
            introduced_tokens: ["آخر هفته", آخر]
            example: {text: "آخر هفته کار نمی‌کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit17.lesson01.teach.rest_word
            kind: vocabulary
            target: {text: استراحت, language_code: fa, direction: rtl}
            introduced_tokens: [استراحت, "می‌کنم", "استراحت کردن"]
            example: {text: "جمعه‌ها استراحت می‌کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit17.lesson01.teach.first_word
            kind: vocabulary
            target: {text: اول, language_code: fa, direction: rtl}
            introduced_tokens: [اول]
            example: {text: "اول صبحونه می‌خورم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit17.lesson01.teach.then_word
            kind: vocabulary
            target: {text: بعد, language_code: fa, direction: rtl}
            introduced_tokens: [بعد, بعدش]
            example: {text: "بعد سر کار می‌رم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit17.lesson01.teach.finally_word
            kind: vocabulary
            target: {text: "در آخر", language_code: fa, direction: rtl}
            introduced_tokens: ["در آخر", در]
            example: {text: "در آخر استراحت می‌کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit17.lesson01.teach.recap_weekdays
            kind: phrase
            target: {text: "شنبه، یکشنبه، دوشنبه، سه‌شنبه، چهارشنبه، پنجشنبه، جمعه", language_code: fa, direction: rtl}
            introduced_tokens: [شنبه, یکشنبه, دوشنبه, "سه‌شنبه", چهارشنبه, پنجشنبه, جمعه, "پنجشنبه‌ها", "جمعه‌ها", و]
        exercises:
          - content_key: fa.a2.unit17.lesson01.exercise01.recognize_week
            type: multiple_choice
            tested_text: هفته
            prompt: {target_blocks: [{text: هفته, language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit17.lesson01.exercise02.recognize_weekend
            type: multiple_choice
            tested_text: "آخر هفته"
            prompt: {target_blocks: [{text: "آخر هفته", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit17.lesson01.exercise03.match_schedule_words
            type: matching_pairs
            tested_text: "هفته آخر هفته استراحت اول بعد در آخر"
            prompt: {target_blocks: []}
            pairs:
              - {left: هفته, right: week}
              - {left: "آخر هفته", right: weekend}
              - {left: استراحت, right: rest}
              - {left: اول, right: first}
              - {left: بعد, right: then}
              - {left: "در آخر", right: finally}
          - content_key: fa.a2.unit17.lesson01.exercise04.order_i_rest_on_fridays
            type: word_order
            tested_text: "جمعه‌ها استراحت می‌کنم"
            prompt: {target_blocks: []}
            word_bank: ["جمعه‌ها", استراحت, "می‌کنم"]
          - content_key: fa.a2.unit17.lesson01.exercise05.write_weekend
            type: writing_prompt
            tested_text: "آخر هفته"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit17.lesson02.sequencing_your_week
        title: مرتب کردن برنامه‌ی هفته با اول، بعد، در آخر
        spine_outcome_id: universal.a2.routines.describe_weekly_schedule
        teaching:
          - content_key: fa.a2.unit17.lesson02.teach.until_word
            kind: grammar_note
            target: {text: "تا (until / to, for a day range)", language_code: fa, direction: rtl}
            introduced_tokens: [تا]
          - content_key: fa.a2.unit17.lesson02.teach.work_days_sentence
            kind: phrase
            target: {text: "شنبه تا چهارشنبه کار می‌کنم.", language_code: fa, direction: rtl}
            introduced_tokens: [کار]
          - content_key: fa.a2.unit17.lesson02.teach.thursdays_habitual_note
            kind: grammar_note
            target: {text: "-ها (habitual plural on a day name: پنجشنبه‌ها = every Thursday)", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.a2.unit17.lesson02.teach.during_vs_weekend_sentence
            kind: phrase
            target: {text: "در طول هفته کار می‌کنم، ولی آخر هفته استراحت می‌کنم.", language_code: fa, direction: rtl}
            introduced_tokens: ["در طول هفته", طول, ولی]
        exercises:
          - content_key: fa.a2.unit17.lesson02.exercise01.recognize_work_days_sentence
            type: multiple_choice
            tested_text: "شنبه تا چهارشنبه کار می‌کنم"
            prompt: {target_blocks: [{text: "شنبه تا چهارشنبه کار می‌کنم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit17.lesson02.exercise02.order_during_vs_weekend
            type: word_order
            tested_text: "در طول هفته کار می‌کنم ولی آخر هفته استراحت می‌کنم"
            prompt: {target_blocks: []}
            word_bank: ["در طول هفته", کار, "می‌کنم", ولی, "آخر هفته", استراحت, "می‌کنم"]
          - content_key: fa.a2.unit17.lesson02.exercise03.dialogue_response_when_do_you_work
            type: dialogue_response
            tested_text: "شنبه تا چهارشنبه کار می‌کنم"
            prompt: {target_blocks: [{text: "چه روزهایی کار می‌کنی؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit17.lesson02.exercise04.translate_during_vs_weekend
            type: translation
            tested_text: "در طول هفته کار می‌کنم ولی آخر هفته استراحت می‌کنم"
            prompt: {target_blocks: []}
          - content_key: fa.a2.unit17.lesson02.exercise05.write_work_days
            type: writing_prompt
            tested_text: "شنبه تا چهارشنبه کار می‌کنم"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit17.lesson03.reading_a_weekly_schedule
        title: خواندن برنامه‌ی هفتگی
        spine_outcome_id: universal.a2.routines.describe_weekly_schedule
        teaching:
          - content_key: fa.a2.unit17.lesson03.teach.clean_word
            kind: vocabulary
            target: {text: "تمیز کردن", language_code: fa, direction: rtl}
            introduced_tokens: ["تمیز کردن", تمیز, "می‌کنم"]
            example: {text: "پنجشنبه‌ها خونه رو تمیز می‌کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a2.unit17.lesson03.teach.schedule_note_text
            kind: reading
            target: {text: "برنامه‌ی هفته‌ی من: شنبه تا چهارشنبه کار می‌کنم. پنجشنبه‌ها خرید می‌کنم و خونه رو تمیز می‌کنم. جمعه‌ها، آخر هفته، دوستامو می‌بینم و استراحت می‌کنم.", language_code: fa, direction: rtl}
            introduced_tokens: ["برنامه‌ی", برنامه, خرید, رو, دوستامو, "می‌بینم", خونه]
        exercises:
          - content_key: fa.a2.unit17.lesson03.exercise01.read_thursday_activities
            type: reading_comprehension
            tested_text: "خرید می‌کنم و خونه رو تمیز می‌کنم"
            prompt: {target_blocks: [{text: "طبق برنامه، پنجشنبه‌ها چیکار می‌کنه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit17.lesson03.exercise02.read_friday_activities
            type: reading_comprehension
            tested_text: "دوستامو می‌بینم و استراحت می‌کنم"
            prompt: {target_blocks: [{text: "طبق برنامه، جمعه‌ها چیکار می‌کنه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit17.lesson03.exercise03.recognize_clean
            type: multiple_choice
            tested_text: "تمیز کردن"
            prompt: {target_blocks: [{text: "تمیز کردن", language_code: fa, direction: rtl}]}
          - content_key: fa.a2.unit17.lesson03.exercise04.order_thursday_sentence
            type: word_order
            tested_text: "پنجشنبه‌ها خرید می‌کنم و خونه رو تمیز می‌کنم"
            prompt: {target_blocks: []}
            word_bank: ["پنجشنبه‌ها", خرید, "می‌کنم", و, خونه, رو, تمیز, "می‌کنم"]
          - content_key: fa.a2.unit17.lesson03.exercise05.write_thursday_sentence
            type: writing_prompt
            tested_text: "پنجشنبه‌ها خرید می‌کنم"
            prompt: {target_blocks: []}

      - content_key: fa.a2.unit17.lesson04.weekly_schedule_conversation
