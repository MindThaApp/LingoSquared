review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.future.announce_plans_and_intentions. Grammar target (casual spoken Tehrani): the present used for plans with explicit time words (فردا، هفته‌ی بعد، ماه دیگه، سال دیگه), contrasted with the habitual present (هر روز، همیشه، معمولا); intention with می‌خوام plus the short subjunctive (برم، بخرم، شروع کنم); تصمیم گرفتم plus the short subjunctive; قصد دارم recognition only. Formal خواهم is not taught. Not taught: قراره. Register: casual spoken Tehrani (خونه، یه، چیکار، می‌خوام). Characters: established friends Sara (teacher) and Nima (engineer); no new job or family facts asserted. Scenario: Sara starts a language class, Nima moves house. Authored without opening any prs file. NATIVE QUESTIONS: (1) Is آخر هفته می‌رم read as a future plan in speech, or does it need این (این آخر هفته می‌رم) to avoid a habitual reading? Recommended: this unit only teaches آخر هفته as a vocabulary item and never tests it in a disambiguating exercise; add این if you prefer. (2) Is bare تصمیم گرفتم خونه عوض کنم natural, or do speakers normally add که (تصمیم گرفتم که خونه عوض کنم)? Recommended: keep the bare form. (3) Is خونه عوض کردن the preferred spoken phrase for moving house, versus اسباب‌کشی کردن? Recommended: keep خونه عوض کردن. (4) Are هفته‌ی بعد، ماه دیگه، سال دیگه (mixed بعد and دیگه) the most natural trio, or should one pattern be used throughout? Recommended: keep as is; they are the common everyday pairings.'
