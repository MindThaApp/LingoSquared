    language: fa
    text: "سارا: حسین، ممنون که تو جلسه شرکت کردید. امکانش هست که گزارش پروژه رو زودتر بفرستید؟ حسین: بله، حتماً. می‌شه اگه جلسه‌ی بعدی رو به سه‌شنبه موکول کنیم؟ سارا: بله، مشکلی نیست. من پیشنهاد می‌کنم که این هفته درباره‌ی بودجه هم تصمیم بگیریم. حسین: موافقم. گزارش رو تا فردا آماده می‌کنم."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

