generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked the local
    `.firecrawl/` cache before writing (per standing instruction, since
    Firecrawl reports 402/credits-exhausted on the live network) -- no
    cached material relevant to formal-register meeting language was
    found there, and the FSI Persian Basic Course is separately confirmed
    beginner-only (see every prior fa B1 unit's own provenance note).
    Authored from general Persian grammar knowledge.

    This is fa's NINTH B1 unit, the third of the "second wave" (only the
    outcome id was reused from en-nl's own second-wave course -- verified
    verbatim against universal_spine.yaml -- never nl's actual content;
    no nl file was opened while authoring this one).

    Grammar target: FORMAL-REGISTER SOFTENED REQUEST/SUGGESTION forms --
    می‌شه اگه...؟ ("would it be all right if...?"), امکانش هست که...؟
    ("is it possible that...?"), and پیشنهاد می‌کنم که... ("I suggest
    that..."/formal-register که-clause after a suggestion verb, distinct
    from unit04's فکر می‌کنم که which reports a THOUGHT and unit06's گفت
    که which reports an UTTERANCE -- this one reports a SUGGESTION,
    genuinely the outcome's own "make a formal-register suggestion or
    request" target). Register is marked explicitly with شما (formal
    "you") throughout, a step up from unit05's own mixed register (تو
    plus the formal copula هستم/هستی, appropriate for that unit's casual
    status-check exchange) -- this unit's scene is a real meeting, so
    شما-address is used consistently, and a grammar note explicitly
    contrasts the two registers so a learner doesn't confuse "formal verb
    form" with "fully formal register" (unit05 mixed the two on purpose
    for a casual-but-professional status check; this unit is the fully
    formal version). Also teaches the written professional-message frame
    (با سلام... opening, با تشکر closing) as its own construction, since
    the outcome explicitly requires "write a brief professional message."

    Continues unit05's established workplace pair -- سارا (project lead)
    and حسین (project team member), reusing the SAME "این پروژه" (this
    project) referent unit05 introduced, generically named rather than
    given a specific title there -- rather than inventing new characters
    or a new project, since a professional-meetings unit genuinely
    benefits from being a continuation of an already-established working
    relationship. Nothing established about سارا/حسین in unit05 is
    contradicted: unit05 already showed them discussing this project's
    status casually; this unit shows them in a formal meeting about the
    SAME project, which is a natural escalation, not a contradiction.

    All vocabulary is introduced self-contained within this file (the
    established per-file convention) -- even پروژه/رو, already taught in
    unit05/others, are redeclared here.

    Character-cast continuity: reuses سارا and حسین, both established
    since unit05 (confirmed via grep against the fa corpus before
    writing); no new character introduced. No nl or other sibling-
    direction file was opened while authoring this one.

    Lessons 01-02 drill the two softened-request forms (می‌شه اگه...؟,
    امکانش هست که...؟) in turn; lesson03 introduces the formal suggestion
    verb پیشنهاد می‌کنم که... plus a grammar note explicitly contrasting
    this unit's fully-formal شما-register against unit05's mixed register;
    lesson04 is a meeting dialogue between سارا and حسین using both
    softened forms plus the suggestion verb; lesson05 is a short written
    professional message (با سلام.../با تشکر) summarizing the meeting's
    outcome, read as a reading-comprehension passage; lesson06 is
    production-only wrap-up -- the same six-lesson arc established across
    every prior fa B1 unit, adapted (as unit08 already did) for a register/
    pragmatics grammar target rather than a person-conjugation paradigm.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude), cold, no access to the
    authoring reasoning above. Verified the formal register is genuinely
    consistent: every 2nd-person verb is the formal شما form (شرکت کردید،
    بفرستید، هستید، دارید، بگید), and the single تو in the dialogue is the
    colloquial preposition "in" (تو جلسه = "in the meeting"), correctly paired
    with formal شرکت کردید -- NOT an informal-pronoun slip. Softened-request
    grammar correct: می‌شه اگه + subjunctive, امکانش هست که + subjunctive,
    پیشنهاد می‌کنم که + subjunctive, plus the با سلام/با تشکر written frame.
    Cross-fact check: سه‌شنبه (Tuesday) is consistent across dialogue,
    reading, and the comprehension answer. word_order comma-free/correct
    order; §12 question-mark variants present on typed request exercises.
    Continues unit05's سارا (project lead) / حسین (team member) pair. No
    objective bugs found.

course:
  realization_key: fa.b1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    This unit is deliberately the corpus's most consistently FORMAL scene
    so far: شما-address throughout, the softened می‌شه/امکانش‌هست request
    forms, and a written با سلام/با تشکر professional-message frame --
    all genuinely register-neutral in the sense that they're equally at
    home in spoken meetings and written messages, but distinct from the
    casual colloquial register (تو-address, contracted verb endings) used
    everywhere else in fa units 01-57 and B1 units 01-08. A grammar note
    explicitly flags this contrast so a learner doesn't mistake it for a
    dialect difference.

