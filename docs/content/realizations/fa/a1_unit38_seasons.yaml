generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Firecrawl remains at 0 credits this session, so
    used direct pdftotext extraction against both known mirrors, same method
    as unit36/unit37's provenance. DigitalOcean-mirror copy
    (https://fsi-language-courses-media.nyc3.cdn.digitaloceanspaces.com/
    languages/Persian/General/Spoken%20Persian.pdf) re-confirmed a JBIG2-only
    scan: pdftotext extracted 0 words, same dead end as before. Live
    Lingua-hosted copy (https://www.livelingua.com/fsi/FSI%20-%20Spoken
    %20Persian.pdf) has a real Acrobat Pro DC "Paper Capture Plug-in" OCR
    text layer, 66,445 words extractable (identical word count to unit37's
    fetch of the same file, confirming a stable, genuine extraction, not a
    fluke). Grepped the full extracted text case-insensitively for
    season/spring/summer/autumn/winter and the Persian transliterations
    bahar/tabestan/paeez/zemest, plus fasl (season) and weather/hava: found
    exactly one genuine hit, "bahar" ('spring') listed as a single example
    word inside an alphabet/phonology drill table (medial/initial/final
    consonant-form practice, not a seasons vocabulary section) with no
    surrounding seasons content at all -- confirmed by reading the
    surrounding ~40 lines of context. Two other substring matches
    ("baharn besinema", "baharn rref'ta") turned out on inspection to be
    OCR-garbled fragments of an unrelated movie-going dialogue (most likely
    a mangled transliteration of "ba'dan" / بعدا, 'later', not bahar/spring
    at all) -- a false positive, not a real seasons reference. No
    tabestan/paeez/zemest/fasl hits anywhere in the extracted text at all.
    Unlike unit37 (a genuine, if narrow, source contribution), this is a
    real, honest dead end: the source has no seasons-topic content to draw
    from. All vocabulary and dialogue in this unit is authored fresh from
    this project's own established colloquial Iranian Farsi conventions and
    its own already-shipped vocabulary (see review notes below for the
    specific reuse chain), not sourced from FSI at all.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) checked this unit against every
    item on the standing review checklist and found no new bugs to fix (the
    authoring session's own generation_provenance/overlay notes already
    disclose one self-caught-and-fixed draft bug -- a preference clause in
    the lesson05 reading that would have contradicted lesson06's wrap-up
    preference sentence -- confirmed that fix is genuinely reflected in the
    shipped text: lesson05's reading is purely factual with no personal
    preference clause). Cross-checked every season's weather description
    (spring pretty, summer hot, autumn rainy, winter cold-and-snowy) across
    lessons 01/02/05/06 for mutual consistency -- fully consistent
    throughout, including the "Summer isn't cold, it's hot" negation drill in
    lesson02 which correctly doesn't contradict lesson01's "Summer is hot."
    No listen_select/listen_type exercises exist in this unit, so the
    same-speaker-distractor bug class doesn't apply. No stray unquoted
    yes/no/true/false/on/off values in any learner-facing field. Every
    exercise type used has a matching case in ExerciseRenderer.tsx.
    matching_pairs pairs and word_order/accepted_answers shapes match
    exactly between this realization and its overlay. Every
    spine_outcome_id resolves to a real universal_spine.yaml entry. No
    internal jargon leaks into learner-facing text. The Farsi reads
    naturally with consistent colloquial Iranian register. Re-validated
    clean: 0 errors/0 warnings standalone and as part of the full 6-unit
    (33-38) fresh-context review batch.

    Originally authored 2026-07-09 by Claude (content-authoring worker session).
    Realizes universal.a1.seasons.describe_seasons, the next unrealized A1
    outcome after unit37 (colors) -- confirmed by an exact diff of every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files against every
    universal.a1.* id in docs/content/universal_spine.yaml: fa had realized
    all 38 non-seasons A1 outcomes through colors, with seasons the next one
    in spine declaration order (emergencies, lost_items, appointments,
    library, waste_disposal, accommodation remain unrealized after this
    unit; a brand-new universal.a1.pharmacy.buy_basic_medicine outcome was
    also added to the spine by a concurrent session partway through this
    task but sits after all of these in declaration order, so it does not
    change which outcome is "next"). Prerequisite
    universal.a1.weather.describe_basic_weather (unit07) already covered.
    Scoped to the outcome's four assessment requirements: understanding a
    spoken season description (listening, via lesson04's dialogue plus its
    dialogue_comprehension exercise), describing a season by naming its
    typical weather or activity (speaking/production, via translate/
    dialogue_response/writing_prompt exercises across lessons 01-06),
    interpreting a short written season description (reading, lesson05's
    reading_comprehension exercises), and writing a short season-description
    sentence (writing, lesson05/lesson06's writing_prompt exercises).
    Deliberately scoped to naming the four seasons, describing each one's
    typical weather (reusing unit07's already-taught آفتابی/بارونی/برفی/
    گرم/سرد fused forms) and a typical activity (reusing unit27's already-
    taught شنا, plus one new activity اسکی), rather than introducing new
    weather vocabulary from scratch. Uses structured speaker fields for all
    dialogue turns; no spoken text embeds a "Name:" prefix. Every vocabulary
    card has an example sentence per schema 1.1. Already-taught words reused
    from earlier units (هوا, آفتابیه, بارونیه, برفیه, گرمه, سرده, و, قشنگ,
    ایران, چهار, دارم, داره, شنا, می‌کنم, دوست دارم/داری, رو, کدوم, بیشتر,
    چون, خیلی, هم, باحاله, نیست, etc.) are re-declared in introduced_tokens
    before first tested use in this file because the compiler's
    untaught-vocabulary check is per-file only. No fill_in_blank or
    audio-only exercise types are used (fa has real TTS per
    AUTHORING_GUIDE.md #14, but this file continues the established
    text-based corpus-consistency pattern from units 19-37, same choice
    those units' own reviews made). Every matching_pairs exercise has 6-8
    pairs. Every translate-into-English exercise in the paired overlay
    explicitly sets answer_language_code: en. Ran a recursive
    yaml.safe_load scan over this file and its paired overlay for bare
    unquoted yes/no/true/false/on/off values -- zero hits (see the overlay's
    own review note for the exact scan result).

    Review 2026-10-21: 16 fixes (overlay 11, realization 5) - removed answer
    giveaway in the dialogue_comprehension prompt; removed internal unit-
    number references from notes and grammar_note cards; corrected a note
    claiming تو is new (it was already used earlier) and feedback calling
    the new word فصل a review word; added translation variants
    (contractions, the summer, I go swimming, Iran has four seasons); added
    variants to dialogue_response (comma before چون, with/without من) and
    writing prompts (all seasons, spoken forms). NATIVE FLAGS: 1 - written
    forms تابستان/زمستان are used throughout a colloquial register where
    spoken Tehrani is تابستون/زمستون; left unchanged (spoken forms accepted
    in writing prompts only); needs a native decision on whether lesson text
    and audio should use the spoken forms.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: fused
    copula predicates (قشنگه, گرمه, بارونیه, سرده, برفیه) built the same way
    as unit07's own weather forms, رو as object marker, and تو-register
    dialogue. Reuses هوا/آفتابی/بارونی/ابری/برفی/گرم/سرد (unit07), قشنگ
    (unit20), ایران (unit02), چهار (unit03), شنا/می‌کنم (unit27), دوست
    دارم/دارم/کدوم/بیشتر/چون/رو (unit14), خیلی (unit01), نیست (unit23), و
    هم/باحاله (unit36) without re-teaching them from scratch.

media_assets:
  - content_key: fa.a1.unit38.audio.seasons.vocab.01
    language: fa
    text: "فصل، بهار، تابستان"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit38.audio.seasons.vocab.02
    language: fa
    text: "پاییز، زمستان"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit38.audio.dialogue.seasons.01
    language: fa
    text: "نیما: کدوم فصل رو بیشتر دوست داری؟ سارا: پاییز رو بیشتر دوست دارم چون بارونیه و قشنگه. تو چی؟ نیما: من تابستان رو دوست دارم چون گرمه و شنا می‌کنم. سارا: باحاله!"
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: fa.a1.unit38.seasons
    title: فصل‌ها
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.seasons.describe_seasons
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit38.lesson01.new_seasons_one
        title: "فصل‌های جدید ۱"
        spine_outcome_id: universal.a1.seasons.describe_seasons
        teaching:
          - content_key: fa.a1.unit38.lesson01.teach.fasl
            kind: vocabulary
            target: {text: فصل, language_code: fa, direction: rtl}
            introduced_tokens: [فصل]
            example: {text: "چهار فصل داریم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit38.lesson01.teach.bahar
            kind: vocabulary
            target: {text: بهار, language_code: fa, direction: rtl}
            introduced_tokens: [بهار]
            example: {text: "بهار قشنگه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit38.lesson01.teach.tabestan
            kind: vocabulary
            target: {text: تابستان, language_code: fa, direction: rtl}
            introduced_tokens: [تابستان]
            example: {text: "تابستان گرمه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit38.lesson01.teach.review_weather
            kind: grammar_note
            target: {text: "هوا (weather) / آفتابیه (it's sunny) / گرمه (it's hot) / قشنگ (pretty) / من (I) -- already known from earlier units", language_code: fa, direction: rtl}
            introduced_tokens: [هوا, آفتابیه, گرمه, قشنگ, قشنگه, داریم, "چهار فصل", من]
        exercises:
          - content_key: fa.a1.unit38.lesson01.exercise01.recognize_fasl
            type: multiple_choice
            tested_text: فصل
            prompt: {target_blocks: [{text: فصل, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson01.exercise02.recognize_bahar
            type: multiple_choice
            tested_text: بهار
            prompt: {target_blocks: [{text: بهار, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson01.exercise03.match_seasons_one
            type: matching_pairs
            tested_text: "فصل بهار تابستان بهار قشنگه تابستان گرمه چهار فصل داریم"
            prompt: {target_blocks: []}
            pairs:
              - {left: فصل, right: season}
              - {left: بهار, right: spring}
              - {left: تابستان, right: summer}
              - {left: "بهار قشنگه.", right: "Spring is pretty."}
              - {left: "تابستان گرمه.", right: "Summer is hot."}
              - {left: "چهار فصل داریم.", right: "We have four seasons."}
          - content_key: fa.a1.unit38.lesson01.exercise04.word_order_bahar_ghashange
            type: word_order
            tested_text: "بهار قشنگه"
            prompt: {target_blocks: [{text: "Spring is pretty.", language_code: en, direction: ltr}]}
            word_bank: [بهار, قشنگه]
          - content_key: fa.a1.unit38.lesson01.exercise05.translate_tabestan_garme
            type: translation
            tested_text: "تابستان گرمه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit38.lesson02.new_seasons_two
        title: "فصل‌های جدید ۲"
        spine_outcome_id: universal.a1.seasons.describe_seasons
        teaching:
          - content_key: fa.a1.unit38.lesson02.teach.paeez
            kind: vocabulary
            target: {text: پاییز, language_code: fa, direction: rtl}
            introduced_tokens: [پاییز]
            example: {text: "پاییز بارونیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit38.lesson02.teach.zemestan
            kind: vocabulary
            target: {text: زمستان, language_code: fa, direction: rtl}
            introduced_tokens: [زمستان]
            example: {text: "زمستان سرده و برفیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit38.lesson02.teach.review_negation
            kind: grammar_note
            target: {text: "تابستان سرد نیست، گرمه. (Summer isn't cold, it's hot.) -- نیست negates the fused copula", language_code: fa, direction: rtl}
            introduced_tokens: [نیست, بارونیه, سرده, برفیه, و, "سرد نیست"]
        exercises:
          - content_key: fa.a1.unit38.lesson02.exercise01.recognize_paeez
            type: multiple_choice
            tested_text: پاییز
            prompt: {target_blocks: [{text: پاییز, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson02.exercise02.recognize_tabestan_sard_nist
            type: multiple_choice
            tested_text: "تابستان سرد نیست"
            prompt: {target_blocks: [{text: "تابستان سرد نیست", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson02.exercise03.match_seasons_two
            type: matching_pairs
            tested_text: "پاییز زمستان پاییز بارونیه زمستان سرده و برفیه تابستان سرد نیست گرمه"
            prompt: {target_blocks: []}
            pairs:
              - {left: پاییز, right: autumn}
              - {left: زمستان, right: winter}
              - {left: "پاییز بارونیه.", right: "Autumn is rainy."}
              - {left: "زمستان سرده و برفیه.", right: "Winter is cold and snowy."}
              - {left: "تابستان سرد نیست.", right: "Summer isn't cold."}
              - {left: نیست, right: "is not"}
          - content_key: fa.a1.unit38.lesson02.exercise04.word_order_zemestan_sarde
            type: word_order
            tested_text: "زمستان سرده و برفیه"
            prompt: {target_blocks: [{text: "Winter is cold and snowy.", language_code: en, direction: ltr}]}
            word_bank: [زمستان, سرده, و, برفیه]
          - content_key: fa.a1.unit38.lesson02.exercise05.translate_paeez_barooniye
            type: translation
            tested_text: "پاییز بارونیه."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit38.lesson03.seasonal_activities
        title: "فعالیت‌های فصلی"
        spine_outcome_id: universal.a1.seasons.describe_seasons
        teaching:
          - content_key: fa.a1.unit38.lesson03.teach.eski
            kind: vocabulary
            target: {text: اسکی, language_code: fa, direction: rtl}
            introduced_tokens: [اسکی]
            example: {text: "زمستان اسکی می‌کنم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit38.lesson03.teach.barf
            kind: vocabulary
            target: {text: برف, language_code: fa, direction: rtl}
            introduced_tokens: [برف]
            example: {text: "زمستان برف می‌بینم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit38.lesson03.teach.review_shena
            kind: grammar_note
            target: {text: "تابستان شنا می‌کنم. (In summer I swim.)", language_code: fa, direction: rtl}
            introduced_tokens: [شنا, "می‌کنم", می‌بینم]
          - content_key: fa.a1.unit38.lesson03.teach.phrase_tabestan_shena
            kind: phrase
            target: {text: "تو تابستان شنا می‌کنم.", language_code: fa, direction: rtl}
            introduced_tokens: [تو]
          - content_key: fa.a1.unit38.lesson03.teach.phrase_zemestan_eski
            kind: phrase
            target: {text: "تو زمستان اسکی می‌کنم.", language_code: fa, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit38.lesson03.exercise01.recognize_eski
            type: multiple_choice
            tested_text: اسکی
            prompt: {target_blocks: [{text: اسکی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson03.exercise02.recognize_barf
            type: multiple_choice
            tested_text: برف
            prompt: {target_blocks: [{text: برف, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson03.exercise03.match_activities
            type: matching_pairs
            tested_text: "اسکی برف تو تابستان شنا می‌کنم تو زمستان اسکی می‌کنم زمستان برف می‌بینم"
            prompt: {target_blocks: []}
            pairs:
              - {left: اسکی, right: ski}
              - {left: برف, right: snow}
              - {left: "تو تابستان شنا می‌کنم.", right: "In summer I swim."}
              - {left: "تو زمستان اسکی می‌کنم.", right: "In winter I ski."}
              - {left: "زمستان برف می‌بینم.", right: "In winter I see snow."}
              - {left: تو, right: "in"}
          - content_key: fa.a1.unit38.lesson03.exercise04.word_order_zemestan_eski
            type: word_order
            tested_text: "تو زمستان اسکی می‌کنم"
            prompt: {target_blocks: [{text: "In winter I ski.", language_code: en, direction: ltr}]}
            word_bank: [تو, زمستان, اسکی, "می‌کنم"]
          - content_key: fa.a1.unit38.lesson03.exercise05.translate_tabestan_shena
            type: translation
            tested_text: "تو تابستان شنا می‌کنم."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit38.lesson04.season_dialogue
        title: "گفتگو درباره‌ی فصل مورد علاقه"
        spine_outcome_id: universal.a1.seasons.describe_seasons
        teaching:
          - content_key: fa.a1.unit38.lesson04.teach.kodoom_fasl
            kind: phrase
            target: {text: "کدوم فصل رو بیشتر دوست داری؟", language_code: fa, direction: rtl}
            introduced_tokens: ["کدوم فصل"]
          - content_key: fa.a1.unit38.lesson04.teach.review_kodoom_bishtar
            kind: grammar_note
            target: {text: "کدوم (which) و بیشتر (more) و دوست داری (you like)", language_code: fa, direction: rtl}
            introduced_tokens: [کدوم, بیشتر, "دوست داری", "دوست دارم", رو, چون]
          - content_key: fa.a1.unit38.lesson04.teach.dialogue_line1
            kind: dialogue
            target: {text: "کدوم فصل رو بیشتر دوست داری؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit38.lesson04.teach.dialogue_line2
            kind: dialogue
            target: {text: "پاییز رو بیشتر دوست دارم چون بارونیه و قشنگه. تو چی؟", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: ["تو چی؟"]
          - content_key: fa.a1.unit38.lesson04.teach.dialogue_line3
            kind: dialogue
            target: {text: "من تابستان رو دوست دارم چون گرمه و شنا می‌کنم.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit38.lesson04.teach.dialogue_line4
            kind: dialogue
            target: {text: "باحاله!", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: [باحاله, نیما, سارا]
        exercises:
          - content_key: fa.a1.unit38.lesson04.exercise01.dialogue_comprehension_seasons
            type: dialogue_comprehension
            tested_text: "کدوم فصل رو بیشتر دوست داری پاییز رو بیشتر دوست دارم چون بارونیه و قشنگه تو چی من تابستان رو دوست دارم چون گرمه و شنا می‌کنم باحاله"
            media_asset_key: fa.a1.unit38.audio.dialogue.seasons.01
            prompt: {target_blocks: [{text: "نیما و سارا درباره‌ی فصل‌ها حرف می‌زنن.", language_code: fa, direction: rtl}]}
            correct_option: "Sara likes autumn more."
            distractors:
              - "Sara likes summer more."
              - "Nima likes autumn more."
              - "Sara likes winter more."
          - content_key: fa.a1.unit38.lesson04.exercise02.recognize_nima_tabestan
            type: multiple_choice
            tested_text: "من تابستان رو دوست دارم چون گرمه و شنا می‌کنم."
            prompt: {target_blocks: [{text: "من تابستان رو دوست دارم چون گرمه و شنا می‌کنم.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson04.exercise03.match_dialogue_words
            type: matching_pairs
            tested_text: "نیما سارا کدوم فصل بیشتر چون تو چی باحاله"
            prompt: {target_blocks: []}
            pairs:
              - {left: نیما, right: Nima}
              - {left: سارا, right: Sara}
              - {left: "کدوم فصل", right: "which season"}
              - {left: بیشتر, right: more}
              - {left: چون, right: because}
              - {left: "تو چی؟", right: "what about you?"}
              - {left: باحاله, right: cool}
          - content_key: fa.a1.unit38.lesson04.exercise04.dialogue_response_ask_favorite_season
            type: dialogue_response
            tested_text: "پاییز رو بیشتر دوست دارم چون بارونیه و قشنگه."
            prompt: {target_blocks: [{text: "کدوم فصل رو بیشتر دوست داری؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit38.lesson04.exercise05.translate_nima_tabestan
            type: translation
            tested_text: "من تابستان رو دوست دارم چون گرمه و شنا می‌کنم."
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit38.lesson05.reading_seasons
        title: "خواندن درباره‌ی فصل‌ها"
        spine_outcome_id: universal.a1.seasons.describe_seasons
        teaching:
          - content_key: fa.a1.unit38.lesson05.teach.darim_word
            kind: grammar_note
            target: {text: "داریم (we have) -- derived from دارم/داره", language_code: fa, direction: rtl}
            introduced_tokens: [داریم]
