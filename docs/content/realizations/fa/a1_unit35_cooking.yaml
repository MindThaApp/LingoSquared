generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before falling back to established conventions. Fetched the
    Yojik host's Persian directory listing
    (https://fsi-languages.yojik.eu/languages/FSI/Persian/) directly: it
    offers only the same "Spoken Persian.PDF" already confirmed
    (units 33/34's provenance notes) to be a page-image scan with no usable
    text layer, 24 audio tapes (not text), and a second document, "A Reader
    in Modern Persian.pdf" -- attempted to fetch that one too, but at 91MB it
    exceeds Firecrawl's processable file-size limit and could not be
    retrieved at all. Separately retried the Live Lingua-hosted copy of
    Spoken Persian
    (https://www.livelingua.com/fsi/FSI%20-%20Spoken%20Persian.pdf); the
    fetch itself failed outright (connection reset) rather than returning
    scannable-but-unusable content. A general web search
    ("FSI Persian Basic Course lesson transcript text kitchen OR cooking OR
    غذا") returned no FSI Persian cooking-lesson transcript or text
    derivative anywhere -- only unrelated Dari/Turkish/Tajik course PDFs and
    modern third-party vocabulary blogs (not public-domain source material,
    not used). No FSI phrase or sentence is treated as a confirmed source hit
    for this unit; no source sentence is imported verbatim. Authored instead
    from this course's established fa conventions: modern Iranian colloquial
    register, the recurring نیما/سارا cast, already-taught food vocabulary
    from unit06 (برنج, نان, مرغ, خوشمزه) and already-taught kitchen vocabulary
    from unit19 (آشپزخانه), plus authentic Iranian home-cooking vocabulary
    (پیاز, نمک, روغن, خرد کردن, ریختن, سرخ کردن) and a real Iranian dish name
    (قرمه‌سبزی, ghormeh sabzi) for register authenticity. Per the standing
    fa/prs authoring policy (AUTHORING_GUIDE.md #3), the scenario shape (core
    ingredient/action vocabulary, step-by-step cooking instructions with
    اول/بعد, a two-speaker kitchen dialogue, a short third-person reading) is
    a legitimate structural reuse of the same real-world cooking-unit shape
    prs/a1_unit36_cooking.yaml already covers for Dari, but every word of the
    actual Farsi text below -- including the dish name, ingredients, and verb
    forms -- was authored independently for Iranian usage; no Dari sentence,
    verb ending, or vocabulary choice was copied.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed ONE real
    cross-lesson narrative-consistency bug per AUTHORING_GUIDE.md §11:
    lesson04's dialogue has سارا ask نیما to chop the onion ("لطفاً پیاز رو
    خرد کن" / "باشه") -- but lesson05's reading passage, written entirely
    with سارا as the sole third-person subject ("اون قرمه‌سبزی می‌پزه. اول
    پیاز رو خرد می‌کنه، بعد تو روغن سرخش می‌کنه..."), silently implied Sara
    chopped the onion herself, directly contradicting the dialogue two
    lessons earlier. This also made lesson05.exercise01's correct_option
    ("Sara chops the onion first, then fries it in oil.") factually wrong
    against the unit's own established story. Fixed by explicitly naming
    نیما as the subject of the chopping clause and سارا as the subject of
    the frying/salting clauses in the reading text (all 4 occurrences: the
    teaching card, both exercise tested_text/prompt duplicates), updating
    the overlay's matching English gloss, and rewriting exercise01's
    correct_option/distractors/feedback (realization + overlay) to test "who
    chops, who fries" instead of misattributing both actions to Sara alone
    -- no new vocabulary introduced (both نیما and سارا were already taught
    earlier in this same file, in lesson04). Re-validated clean after the
    fix: 0 errors/0 warnings standalone and as part of the full 6-unit
    (33-38) fresh-context review batch. Everything else in this unit was
    checked clean: no listen_select/listen_type exercises exist (so the
    same-speaker-distractor bug class doesn't apply), no stray unquoted
    yes/no/true/false/on/off values, every exercise type used is registered
    in ExerciseRenderer.tsx, matching_pairs/word_order shapes match between
    realization and overlay, every spine_outcome_id resolves to a real
    universal_spine.yaml entry, no jargon leaks, and the Farsi reads
    naturally with consistent colloquial Iranian register.

    Originally authored 2026-07-09 by Claude (content-authoring worker session).
    Realizes universal.a1.cooking.prepare_simple_meal, the next unrealized A1
    outcome after unit34 (post). Confirmed by grepping every
    spine_outcome_id/spine_outcome_ids value across all
    docs/content/realizations/fa/a1_unit*.yaml files and exact-diffing
    against every universal.a1.* id in docs/content/universal_spine.yaml: fa
    had realized all 35 A1 outcomes through post, with cooking, personality,
    colors, seasons, emergencies, lost_items, and appointments still missing
    (library was added to the spine by a concurrent session mid-task, still
    uncommitted at authoring time, and is not counted against this unit's
    scope) -- cooking is the next one in spine order. Scoped to the outcome's
    four assessment requirements: understanding a cooking exchange
    (listening), describing cooking actions and giving simple step-by-step
    instructions (speaking), reading a short passage about someone cooking
    (reading), and writing a short cooking-related sentence (writing). Uses
    structured speaker fields for dialogue turns; no spoken text embeds a
    "Name:" prefix. Every vocabulary card has an example sentence per schema
    1.1. Already-taught words reused from earlier units (آشپزخانه, برنج,
    لطفاً, می‌خوام, این, etc.) are re-declared in introduced_tokens before
    first tested use in this file because the compiler's untaught-vocabulary
    check is per-file only. No fill_in_blank or audio-only exercise types are
    used (fa has real TTS per AUTHORING_GUIDE.md #14, but this file continues
    the established text-based corpus-consistency pattern from units 19-34,
    same choice those units' own reviews made). Every matching_pairs
    exercise has 7-8 pairs. Every translate-into-English exercise in the
    paired overlay explicitly sets answer_language_code: en. Ran a recursive
    yaml.safe_load scan over this file and its paired overlay for bare
    unquoted yes/no/true/false/on/off values -- zero hits (see the overlay's
    own review note for the exact scan result).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: رو as
    object marker, تو-register dialogue, colloquial copula/verb contractions
    such as می‌پزه/می‌ریزه/باشه, and یه as the colloquial form of یک
    ("a/one"). Uses everyday Iranian home-cooking words: آشپزی, پیاز, نمک,
    روغن, and a real home-cooked dish name, قرمه‌سبزی, for authenticity.

