            prompt: {target_blocks: [{text: کت, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit20.lesson01.exercise05.match_clothing_words
            type: matching_pairs
            tested_text: پیراهن شلوار کفش کت قشنگ
            prompt: {target_blocks: []}
            pairs:
