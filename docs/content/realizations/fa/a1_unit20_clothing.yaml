review:
  status: draft
  required_next_reviewer: fresh_context_codex
  notes: >-
    New unit, fa's next uncovered outcome (universal.a1.clothing.describe_buy_clothing,
    prerequisite: universal.a1.shopping.ask_prices_quantities / unit08, already covered).
    Six lessons: clothing item vocabulary (پیراهن/شلوار/کفش/کت plus قشنگ as a useful
    descriptive adjective), colors (رنگ/قرمز/آبی/سیاه/سفید), sizes (سایز/بزرگ/کوچیک/متوسط),
    trying on and requesting (می‌تونم امتحانش کنم؟/بله، بفرمایید), reading a clothing
    label plus a combined item+color+size writing request, and a full store dialogue
    reusing established character نیما (as customer, continuing from units 17-19) against
    a فروشنده shopkeeper role (matching unit08's market convention). Colloquial -e
    contraction register maintained throughout (قشنگه, آبیه, سیاهه, کوچیکه). Deliberately
    reuses established phrases rather than inventing new ones where possible: می‌خوام،
    دارید، این...چنده؟، بفرمایید، ممنون، باشه، نقدی حساب می‌کنم all carried over from
    unit08's shopping vocabulary, یه (indefinite article) from unit19. Authored §14/§16/
    §19-compliant from the start: zero listen_type/listen_select/listen_order exercises
    (lesson06's dialogue comprehension uses reading_comprehension against dialogue-line
    target_blocks, matching unit19 lesson06's own established audio-independent pattern,
    NOT a dialogue_comprehension+media_asset_key wiring -- deliberately avoiding the
    unwired-audio bug fa unit05's fresh-context review found and fixed), matching_pairs
    sized 4-6 pairs throughout, every kind:vocabulary teaching card carries a real
    example/example_gloss pair from the start (schema_version 1.1). Self-checked (not a
    substitute for the mandatory fresh-context review, which is still pending): spine-
    outcome discipline against all 4 assessment_requirements (understand_clothing_request
    via lesson06's reading_comprehension pair; request_clothing_item via lesson04/06's
    speak_response/dialogue_response; read_clothing_label via lesson05's reading_comprehension
    pair; write_clothing_request via lesson05/06's writing_prompt exercises), recognition->
    drag/matching->production pacing in every lesson, no bare yes/no/true/false unquoted
    YAML values, no internal-jargon leaks, no Arabic-range kaf/yeh codepoints (U+0643/U+064A).
    Compiler validation clean (0 errors/0 warnings) at authoring time. Audio remains
    pending generation, matching every other fa unit's current state. Authored
    independently of the prs realization per the sibling-isolation rule -- prs sibling
    files not opened during this authoring pass. STATUS: draft, review pending -- do not
    treat as ship-ready until the standing fresh-context Codex review has run, per this
    project's non-negotiable content pipeline.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am/-s contraction pattern (قشنگه, آبیه,
    سیاهه, کوچیکه) and هستم-family copula, consistent with units 07-19. The shopkeeper's
    بله (polite yes) reflects ordinary Iranian retail politeness norms, distinct from
    the casual آره used between established friends نیما/سارا in unit19's dialogue.

