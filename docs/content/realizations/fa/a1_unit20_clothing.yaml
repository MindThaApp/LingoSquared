            example: {text: "این کت قشنگه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit20.lesson01.teach.want_word
            kind: grammar_note
            target: {text: "می‌خوام (I want)", language_code: fa, direction: rtl}
            introduced_tokens: [می‌خوام]
          - content_key: fa.a1.unit20.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: fa, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: fa.a1.unit20.lesson01.exercise01.recognize_shirt
            type: multiple_choice
            tested_text: پیراهن
            prompt: {target_blocks: [{text: پیراهن, language_code: fa, direction: rtl}]}
