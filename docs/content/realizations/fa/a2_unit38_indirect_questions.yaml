  notes: 'Spine outcome: universal.a2.questions.ask_indirect_questions. Grammar target: polite embedded questions after می‌دونید (کجاست، ساعت چنده، کی ... می‌شه), yes/no embedded with یا نه, نمی‌دونم statements with optional که, and the fact that the question keeps its Persian word order (no English-style rearranging). Register: casual spoken Tehrani; polite شما forms (می‌دونید) only to strangers, friends Sara and Nima use تو forms (می‌دونی). Characters: established friends Sara and Nima; no job or family facts asserted; unnamed رهگذر (passer-by) is the only other speaker. The unit delivers listening, reading, speaking-style dialogue responses and a culminating written polite enquiry with two embedded questions (where and when). Authored without opening any prs file. NATIVE QUESTIONS: (1) Is می‌دونید or the more colloquial می‌دونین the better written form for polite spoken شما in teaching text? Recommended: keep می‌دونید (as in the course spec) and add می‌دونین as an accepted variant later if reviewers agree. (2) Is ساعت چنده؟ the natural way to ask a stranger the time after می‌دونید? Recommended: yes, keep ساعت چنده. (3) Is مستقیم برید and دفتر سمت راست هست natural for a passer-by giving directions, or would سمت راسته be the usual spoken contraction? Recommended: keep the unreduced forms for learners and mention سمت راسته later. (4) Is باز هست یا نه preferred over باز هست یا نیست after می‌دونید? Recommended: keep یا نه as taught.'
