          - content_key: fa.b1.unit01.lesson02.teach.shoma
            kind: vocabulary
            target: {text: شما, language_code: fa, direction: rtl}
            introduced_tokens: [شما]
            example: {text: "شما باید برید.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.b1.unit01.lesson02.exercise01.recognize_bere
            type: multiple_choice
            tested_text: بره
            prompt: {target_blocks: [{text: بره, language_code: fa, direction: rtl}]}
          - content_key: fa.b1.unit01.lesson02.exercise02.recognize_berim
