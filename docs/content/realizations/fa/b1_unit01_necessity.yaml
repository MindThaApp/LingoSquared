generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation (not adapted from a source), authored directly
    by Claude during the standing Codex usage-limit outage contingency.
    Unlike prs's B1 unit (adapted from a real intermediate Dari source),
    no adaptable intermediate-level Persian source material exists -- the
    FSI Persian Basic Course is confirmed beginner-only (12 units, no
    intermediate volume, unlike French/Spanish which have multiple FSI
    volumes). This is fa's first B1 unit, built from general Persian
    grammar knowledge rather than adapted from a public-domain text.
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    First fa B1 unit, genuinely exploratory, same as prs's b1_unit01.
    Teaches باید (must/should) + present subjunctive as the main B1
    target -- deliberately chosen as a DIFFERENT grammar pattern than
    prs's b1_unit01 (modal-plus-embedded-clause ability), so the two
    languages' first B1 units aren't structurally identical constructions
    wearing different vocabulary (a real project bug class flagged
    before: "structurally identical dialogues across languages = a
    validation failure"). Persian باید is grammatically distinct from
    prs's می‌تانم pattern: باید itself is INVARIANT (never conjugates for
    person), while the verb that follows takes subjunctive conjugation
    that DOES change with person (باید برم / باید بری / باید بره) -- the
    reverse distribution of prs's pattern, where می‌تانم itself conjugates.
    Past/hypothetical obligation (باید می‌رفتم = "I should have gone," a
    genuine regret/unfulfilled-obligation construction using the past/
    imperfect stem rather than subjunctive) and negation (نباید = must
    not) are both taught as the second half of the B1 target, mirroring
    prs's present/past structure. All vocabulary is introduced
    self-contained within this file (not assumed already taught
    elsewhere) to avoid the known per-file untaught-vocabulary compiler
    gotcha. STATUS: draft, review pending, not self-certified -- extra
    scrutiny owed since this is from-scratch (not source-adapted)
    content and the first B1 unit for this specific language.

course:
  realization_key: fa.b1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken register and می‌خوام-
    style colloquial contractions used throughout fa A1 units 01-21.
    باید itself has no formal/informal variant distinction in spoken
    Persian -- it is register-neutral, used identically in casual and
    polite speech, which the grammar note states explicitly.

