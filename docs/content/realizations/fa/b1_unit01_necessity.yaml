            target: {text: نباید, language_code: fa, direction: rtl}
            introduced_tokens: [نباید]
            example: {text: "نباید بری اونجا.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson03.teach.grammar_past_regret
            kind: grammar_note
            target: {text: "باید می‌رفتم = I should have gone (but didn't) -- a real regret about an unfulfilled past obligation. This uses باید + the PAST/IMPERFECT stem (می‌رفتم, می‌کردم), not the subjunctive used for present necessity. Negate باید itself with نه‌ to make نباید (must not) -- this is different from negating the verb after it.", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.b1.unit01.lesson03.teach.diruz
            kind: vocabulary
            target: {text: دیروز, language_code: fa, direction: rtl}
