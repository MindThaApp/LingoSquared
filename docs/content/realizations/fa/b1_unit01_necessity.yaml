units:
  - content_key: fa.b1.unit01.necessity
    title: باید و ضرورت
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.necessity.express_obligation_with_subjunctive
    planned_lesson_count: 6

    lessons:
      - content_key: fa.b1.unit01.lesson01.present_necessity_1st2nd
        title: باید برم، باید بری
        spine_outcome_id: universal.b1.necessity.express_obligation_with_subjunctive
        teaching:
          - content_key: fa.b1.unit01.lesson01.teach.bayad
            kind: vocabulary
            target: {text: باید, language_code: fa, direction: rtl}
            introduced_tokens: [باید]
            example: {text: "باید برم خونه.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson01.teach.beram
            kind: vocabulary
            target: {text: برم, language_code: fa, direction: rtl}
            introduced_tokens: [برم]
            example: {text: "باید برم دانشگاه.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson01.teach.beri
            kind: vocabulary
            target: {text: بری, language_code: fa, direction: rtl}
            introduced_tokens: [بری]
            example: {text: "باید بری دکتر؟", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson01.teach.grammar_bayad_invariant
            kind: grammar_note
            target: {text: "باید (must/should) never changes form for person -- it's the same word whether you say I must, you must, or they must. Instead, the VERB after it changes: باید برم (I must go), باید بری (you must go). This is the opposite of می‌تونم (I can), which itself conjugates. باید stays fixed; the subjunctive verb after it carries the person.", language_code: fa, direction: rtl}
            introduced_tokens: [خونه, دانشگاه, دکتر]
          - content_key: fa.b1.unit01.lesson01.teach.chera
            kind: vocabulary
            target: {text: چرا, language_code: fa, direction: rtl}
            introduced_tokens: [چرا]
            example: {text: "چرا باید بری؟", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson01.teach.emruz
            kind: vocabulary
            target: {text: امروز, language_code: fa, direction: rtl}
            introduced_tokens: [امروز]
            example: {text: "امروز باید کار کنم.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson01.teach.kar_konam
            kind: vocabulary
            target: {text: کار کنم, language_code: fa, direction: rtl}
            introduced_tokens: [کار, کنم]
            example: {text: "باید کار کنم.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.b1.unit01.lesson01.exercise01.recognize_bayad
            type: multiple_choice
            tested_text: باید
            prompt: {target_blocks: [{text: باید, language_code: fa, direction: rtl}]}
          - content_key: fa.b1.unit01.lesson01.exercise02.recognize_beram
            type: multiple_choice
            tested_text: برم
            prompt: {target_blocks: [{text: برم, language_code: fa, direction: rtl}]}
          - content_key: fa.b1.unit01.lesson01.exercise03.order_bayad_beram_khone
            type: word_order
            tested_text: باید برم خونه
            prompt: {target_blocks: []}
            word_bank: [باید, برم, خونه]
          - content_key: fa.b1.unit01.lesson01.exercise04.match_necessity_words
            type: matching_pairs
            tested_text: باید برم بری خونه دانشگاه دکتر
            prompt: {target_blocks: []}
            pairs:
              - {left: باید, right: must/should}
              - {left: برم, right: I go (subjunctive)}
              - {left: بری, right: you go (subjunctive)}
              - {left: خونه, right: home}
              - {left: دانشگاه, right: university}
              - {left: دکتر, right: doctor}
          - content_key: fa.b1.unit01.lesson01.exercise05.translate_must_go_university
            type: translation
            tested_text: باید برم دانشگاه
            prompt: {target_blocks: []}
          - content_key: fa.b1.unit01.lesson01.exercise06.speak_must_go_doctor
            type: speak_response
            tested_text: باید بری دکتر
            prompt: {target_blocks: []}
          - content_key: fa.b1.unit01.lesson01.exercise07.write_necessity_sentence
            type: writing_prompt
            tested_text: امروز باید کار کنم
            prompt: {target_blocks: []}

      - content_key: fa.b1.unit01.lesson02.present_necessity_all_persons
