            target: {text: نرفتم, language_code: fa, direction: rtl}
            introduced_tokens: [نرفتم]
            example: {text: "دیروز نرفتم دکتر.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson03.teach.unja
            kind: vocabulary
            target: {text: اونجا, language_code: fa, direction: rtl}
            introduced_tokens: [اونجا]
            example: {text: "نباید بری اونجا.", language_code: fa, direction: rtl}
        exercises:
