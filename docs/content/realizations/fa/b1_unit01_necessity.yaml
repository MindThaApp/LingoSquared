        teaching:
          - content_key: fa.b1.unit01.lesson06.teach.grammar_review
            kind: grammar_note
            target: {text: "Review: present necessity = باید (invariant) + subjunctive verb matching the subject (باید برم، باید بری، باید بره، باید بریم، باید برید، باید برن). Past regret/unfulfilled obligation = باید + past/imperfect stem (باید می‌رفتم = I should have gone). Negate باید itself for نباید (must not). All six lessons in this unit use this same fixed-باید-plus-changing-verb pattern across different persons, tenses, and situations.", language_code: fa, direction: rtl}
            introduced_tokens: []
          - content_key: fa.b1.unit01.lesson06.teach.bokonam
            kind: vocabulary
            target: {text: بکنم, language_code: fa, direction: rtl}
