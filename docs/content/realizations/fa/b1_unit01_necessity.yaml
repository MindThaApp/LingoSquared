        spine_outcome_id: universal.b1.necessity.express_obligation_with_subjunctive
        teaching:
          - content_key: fa.b1.unit01.lesson02.teach.bere
            kind: vocabulary
            target: {text: بره, language_code: fa, direction: rtl}
            introduced_tokens: [بره]
            example: {text: "نرگس باید بره خونه.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson02.teach.berim
            kind: vocabulary
            target: {text: بریم, language_code: fa, direction: rtl}
            introduced_tokens: [بریم]
            example: {text: "باید بریم دانشگاه.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson02.teach.berid
            kind: vocabulary
            target: {text: برید, language_code: fa, direction: rtl}
            introduced_tokens: [برید]
            example: {text: "شما باید برید دکتر.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson02.teach.beran
            kind: vocabulary
            target: {text: برن, language_code: fa, direction: rtl}
            introduced_tokens: [برن]
            example: {text: "اونا باید برن خونه.", language_code: fa, direction: rtl}
          - content_key: fa.b1.unit01.lesson02.teach.grammar_agreement
            kind: grammar_note
            target: {text: "باید stays the same in every sentence. Only the subjunctive verb after it agrees with the subject: برم (I), بری (you), بره (he/she), بریم (we), برید (you pl.), برن (they). Compare with می‌تونم (I can), which itself changes for every person -- باید never does.", language_code: fa, direction: rtl}
