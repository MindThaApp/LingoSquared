            tested_text: امروز هوا آفتابیه امروز سرده امروز بارونیه
            prompt: {target_blocks: []}
            pairs:
              - {left: "امروز هوا آفتابیه", right: "Today the weather is sunny."}
              - {left: "امروز سرده", right: "Today it's cold."}
              - {left: "امروز بارونیه", right: "Today it's rainy."}
              - {left: آفتابی, right: sunny}
              - {left: سرد, right: cold}
              - {left: بارونی, right: rainy}
          - content_key: fa.a1.unit07.lesson04.exercise05.order_today_sunny
            type: word_order
            tested_text: امروز هوا آفتابیه
            prompt: {target_blocks: []}
            word_bank: [امروز, هوا, آفتابیه]
          - content_key: fa.a1.unit07.lesson04.exercise06.translate_today_cold
