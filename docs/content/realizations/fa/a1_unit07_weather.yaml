          - content_key: fa.a1.unit07.lesson04.teach.contraction_note
            kind: grammar_note
            target: {text: "آفتابیه = آفتابی است (محاوره‌ای)", language_code: fa, direction: rtl}
            introduced_tokens: [است]
          - content_key: fa.a1.unit07.lesson04.teach.today_rainy
            kind: phrase
            target: {text: "امروز بارونیه", language_code: fa, direction: rtl}
            introduced_tokens: [بارونیه]
        exercises:
          - content_key: fa.a1.unit07.lesson04.exercise01.recognize_today_sunny
            type: multiple_choice
            tested_text: امروز هوا آفتابیه
            prompt: {target_blocks: [{text: "امروز هوا آفتابیه", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson04.exercise02.recognize_today_cold
