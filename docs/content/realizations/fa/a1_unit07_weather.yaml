units:
  - content_key: fa.a1.unit07.weather
    title: هوا و برنامه‌ریزی
    section: speaking
    spine_outcome_ids:
      - universal.a1.weather.describe_basic_weather
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit07.lesson01.weather_conditions
        title: وضعیت هوا
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: fa.a1.unit07.lesson01.teach.sunny
            kind: vocabulary
            target: {text: آفتابی, language_code: fa, direction: rtl}
            introduced_tokens: [آفتابی]
            example: {text: "امروز هوا آفتابیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson01.teach.rainy
            kind: vocabulary
            target: {text: بارونی, language_code: fa, direction: rtl}
            introduced_tokens: [بارونی]
            example: {text: "فردا هوا بارونیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson01.teach.cloudy
            kind: vocabulary
            target: {text: ابری, language_code: fa, direction: rtl}
            introduced_tokens: [ابری]
            example: {text: "هوا ابریه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson01.teach.snowy
            kind: vocabulary
            target: {text: برفی, language_code: fa, direction: rtl}
            introduced_tokens: [برفی]
            example: {text: "زمستان هوا برفیه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson01.teach.or_word
            kind: grammar_note
            target: {text: "یا (or)", language_code: fa, direction: rtl}
            introduced_tokens: [یا]
        exercises:
          - content_key: fa.a1.unit07.lesson01.exercise01.recognize_sunny
            type: multiple_choice
            tested_text: آفتابی
            prompt: {target_blocks: [{text: آفتابی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson01.exercise02.recognize_rainy
            type: multiple_choice
            tested_text: بارونی
            prompt: {target_blocks: [{text: بارونی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson01.exercise03.recognize_abri_reading
            type: multiple_choice
            tested_text: ابری
            prompt: {target_blocks: [{text: ابری, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson01.exercise04.match_conditions
            type: matching_pairs
            tested_text: آفتابی بارونی ابری برفی
            prompt: {target_blocks: []}
            pairs:
              - {left: آفتابی, right: sunny}
              - {left: بارونی, right: rainy}
              - {left: ابری, right: cloudy}
              - {left: برفی, right: snowy}
          - content_key: fa.a1.unit07.lesson01.exercise05.order_conditions_list
            type: word_order
            tested_text: آفتابی یا بارونی
            prompt: {target_blocks: []}
            word_bank: [آفتابی, یا, بارونی]
          - content_key: fa.a1.unit07.lesson01.exercise06.translate_snowy
            type: translation
            tested_text: برفی
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit07.lesson01.exercise07.write_cloudy
            type: writing_prompt
            tested_text: ابری
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit07.lesson02.temperature_words
        title: گرم و سرد
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: fa.a1.unit07.lesson02.teach.hot
            kind: vocabulary
            target: {text: گرم, language_code: fa, direction: rtl}
            introduced_tokens: [گرم]
            example: {text: "امروز هوا گرمه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson02.teach.cold
            kind: vocabulary
            target: {text: سرد, language_code: fa, direction: rtl}
            introduced_tokens: [سرد]
            example: {text: "زمستان هوا سرده.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson02.teach.cool
            kind: vocabulary
            target: {text: خنک, language_code: fa, direction: rtl}
            introduced_tokens: [خنک]
            example: {text: "عصرها هوا خنکه.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit07.lesson02.exercise01.recognize_hot
            type: multiple_choice
            tested_text: گرم
            prompt: {target_blocks: [{text: گرم, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson02.exercise02.recognize_cold
            type: multiple_choice
            tested_text: سرد
            prompt: {target_blocks: [{text: سرد, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson02.exercise03.recognize_khonak_reading
            type: multiple_choice
            tested_text: خنک
            prompt: {target_blocks: [{text: خنک, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson02.exercise04.match_temperature
            type: matching_pairs
            tested_text: گرم سرد خنک آفتابی بارونی ابری برفی
            prompt: {target_blocks: []}
            pairs:
              - {left: گرم, right: hot}
              - {left: سرد, right: cold}
              - {left: خنک, right: cool}
              - {left: آفتابی, right: sunny}
              - {left: بارونی, right: rainy}
              - {left: ابری, right: cloudy}
              - {left: برفی, right: snowy}
          - content_key: fa.a1.unit07.lesson02.exercise05.order_hot_or_cold
            type: word_order
            tested_text: گرم یا سرد
            prompt: {target_blocks: []}
            word_bank: [گرم, یا, سرد]
          - content_key: fa.a1.unit07.lesson02.exercise06.translate_cool
            type: translation
            tested_text: خنک
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit07.lesson02.exercise07.write_hot
            type: writing_prompt
            tested_text: گرم
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit07.lesson03.asking_about_weather
        title: پرسیدن دربارهٔ هوا
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: fa.a1.unit07.lesson03.teach.weather_word
            kind: vocabulary
            target: {text: هوا, language_code: fa, direction: rtl}
            introduced_tokens: [هوا]
            example: {text: "هوا امروز چطوره؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson03.teach.weather_question
            kind: phrase
            target: {text: "هوا چطوره؟", language_code: fa, direction: rtl}
            introduced_tokens: [چطوره]
          - content_key: fa.a1.unit07.lesson03.teach.today_word
            kind: vocabulary
            target: {text: امروز, language_code: fa, direction: rtl}
            introduced_tokens: [امروز]
            example: {text: "امروز هوا خوبه.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson03.teach.tomorrow_word
            kind: vocabulary
            target: {text: فردا, language_code: fa, direction: rtl}
            introduced_tokens: [فردا]
            example: {text: "فردا می‌بینمت.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit07.lesson03.exercise01.recognize_weather_question
            type: multiple_choice
            tested_text: هوا چطوره
            prompt: {target_blocks: [{text: "هوا چطوره؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson03.exercise02.recognize_tomorrow
            type: multiple_choice
            tested_text: فردا
            prompt: {target_blocks: [{text: فردا, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson03.exercise03.recognize_weather_question_reading
            type: multiple_choice
            tested_text: هوا چطوره
            prompt: {target_blocks: [{text: "هوا چطوره؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson03.exercise04.match_time_words
            type: matching_pairs
            tested_text: هوا چطوره امروز فردا یا آفتابی بارونی
            prompt: {target_blocks: []}
            pairs:
              - {left: "هوا چطوره؟", right: "How's the weather?"}
              - {left: امروز, right: today}
              - {left: فردا, right: tomorrow}
              - {left: هوا, right: weather}
              - {left: یا, right: or}
              - {left: آفتابی, right: sunny}
              - {left: بارونی, right: rainy}
          - content_key: fa.a1.unit07.lesson03.exercise05.order_weather_question
            type: word_order
            tested_text: هوا چطوره
            prompt: {target_blocks: []}
            word_bank: [هوا, چطوره]
          - content_key: fa.a1.unit07.lesson03.exercise06.translate_weather_question
            type: translation
            tested_text: هوا چطوره
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit07.lesson03.exercise07.speak_weather_question
            type: speak_response
            tested_text: هوا چطوره
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit07.lesson04.describing_todays_weather
        title: توصیف هوای امروز
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: fa.a1.unit07.lesson04.teach.today_sunny
            kind: phrase
            target: {text: "امروز هوا آفتابیه", language_code: fa, direction: rtl}
            introduced_tokens: [امروز, هوا, آفتابیه]
          - content_key: fa.a1.unit07.lesson04.teach.today_cold
            kind: phrase
            target: {text: "امروز سرده", language_code: fa, direction: rtl}
