review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context review, 2026-07-05. Checked spine-outcome discipline
    against universal.a1.weather.describe_basic_weather's own
    assessment_requirements (understand a forecast, describe weather +
    suggest a plan, read a forecast, write a weather note) -- all four
    covered across the six lessons, no drift into unrelated grammar.
    Verified dialect authenticity against fa_IR_standard_colloquial_intro
    (established in unit01): بارونی is a genuine colloquial pronunciation
    of بارانی (same ا→و shift as نان/نون، تهران/تهرون), the -e copula
    contraction (آفتابیه، سرده، بارونیه) is standard spoken Persian, and
    the lesson06 dialogue (باشه، موافقم، فکر کنم، می‌بینمت، چون بارونیه،
    بهتره چتر ببریم) reads as natural spoken Tehrani Persian, not a
    translated calque. Cross-checked every weather/plan fact in lesson06
    (today rainy, tomorrow sunny+hot, park plan is for tomorrow) across
    its dialogue, matching_pairs, and writing exercises -- consistent.
    Found and fixed two real bugs: (1) ten multiple_choice exercises
    (lessons 01-05) displayed the target Farsi word/phrase in the prompt
    AND repeated it verbatim as the correct multiple_choice option --
    confirmed via the actual compiled JSON, not just validate -- solvable
    by visual text-matching alone with zero comprehension required.
    Fixed by converting correct_option/distractors to English glosses,
    matching the already-reviewed goodbye_meaning pattern in a1_unit01.
    (2) lesson06's exercise order placed a listen_type production/typing
    exercise before its matching_pairs and word_order drag exercises,
    violating AUTHORING_GUIDE §2 pacing -- reordered so recognition
    (dialogue_comprehension, multiple_choice) precedes matching/drag
    (matching_pairs, word_order) precedes production (listen_type,
    dialogue_response, writing_prompt, speak_response); confirmed via
    the compiled order. Also added missing plain-comma-joined
    accepted_answers variants per §12 to lesson06's
    write_weather_plan_summary and speak_full_weather_exchange. No
    fill_in_blank exercises exist (§13 n/a). Grepped for Arabic-range
    kaf (U+0643) and yeh (U+064A) codepoints: none found in either
    file. No unquoted YAML booleans. content_key parity
    reconfirmed between realization and overlay after fixes (only the
    6 media_asset audio keys are realization-only, as expected). Every
    accepted_answers list confirmed to have at least one status:correct
    entry (43/43 exercises). Both `validate` and `compile` re-run after
    fixes: 0 errors, 0 warnings, compiles clean end to end. Audio
    remains pending generation.

    AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, project-wide audit):
    found 8 exercises in this unit (lesson01.exercise03,
    lesson02.exercise03, lesson03.exercise03, lesson04.exercise03/06,
    lesson05.exercise03/06, lesson06.exercise03) were listen_type or
    bare-prompt listen_select items -- genuinely unanswerable since
    fa/prs have zero working TTS/recorded audio. Converted:
    listen_select -> multiple_choice (visible Farsi prompt, English
    glosses to avoid re-introducing the prompt-shows-answer bug this
    same file's earlier review already fixed once), listen_type ->
    translation. MATCHING_PAIRS SCALE (§16) CHECK: all 6 matching_pairs
    exercises (4/7/7/6/7/9) already reasonably sized -- no changes
    needed. Re-verified 0 remaining §14 violations via script,
    content_key parity intact, validate+compile both clean after the
    retrofit.

    POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by
    unit13's fresh-context reviewer flagging the same bug in units 11/12)
    found this file also had exercises where realization prompt.target_blocks
    duplicated the overlay's own instruction text verbatim in English -- the
    compiler would have rendered the same sentence twice to the learner. Fixed
    mechanically: every affected exercise's prompt set to target_blocks: [].
    Re-verified validate+compile clean (0 errors/0 warnings) and confirmed
    zero remaining instruction-duplicate target_blocks via a script comparing
    every exercise's target_blocks against its overlay instruction.


    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added a real example
    sentence to all 12 kind:vocabulary teaching cards, each a natural,
    comprehensible-from-gloss sentence using the card's own word.
    schema_version bumped to 1.1. Example sentences are Claude-authored and
    pending fresh-context review.

    2026-07-07: §19 FRESH-CONTEXT REVIEW of the 12 example sentences added
    in the retrofit above (supplemental check only -- spine outcome/pacing/
    etc. already settled and out of scope). This file's own register_policy
    explicitly requires the colloquial -e contraction for weather
    descriptions (آفتابیه، سرده, etc.), and this file's own already-reviewed
    exercises/dialogue never use a bare است for these predicates -- yet 11 of
    the 12 newly-added examples used exactly that formal است (a direct,
    systematic clash with this unit's own established register). Fixed all
    11: sunny/rainy/cloudy/snowy/hot/cold/cool examples (آفتابی/بارونی/ابری/
    برفی/گرم/سرد/خنک است -> -ه contractions), weather_word (هوا امروز چطور
    است؟ -> چطوره؟, doubly justified since the very next card in this same
    lesson teaches هوا چطوره؟ as the target phrase), today_word (امروز هوا
    خوب است -> خوبه), because_word (چون سرد است -> چون سرده), and lesson06's
    coat_review (هوا سرد است -> سرده). Only tomorrow_word's فردا می‌بینمت
    needed no change -- already colloquial, matching the dialogue's own
    usage. Verified every fixed example still contains its card's target
    word, is 2+ words with real structure, is comprehensible from its
    unchanged gloss (meaning didn't change, only register), and isn't
    duplicated elsewhere in the file. Re-ran validate+compile after fixes:
    0 errors/0 warnings, compiles to valid JSON, all 12 examples present in
    the compiled output.
course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues unit01's neutral-polite spoken register. Weather descriptions
    use the everyday colloquial -e contraction already established in this
    course (خوبه، خوبه‌ست pattern from unit06), e.g. آفتابیه (it's sunny),
    سرده (it's cold), consistent with ordinary spoken Tehrani Persian.

