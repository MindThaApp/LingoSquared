            tested_text: امروز بارونیه
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit07.lesson05.weather_based_suggestions
        title: پیشنهاد بر اساس هوا
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: fa.a1.unit07.lesson05.teach.because_word
            kind: vocabulary
            target: {text: چون, language_code: fa, direction: rtl}
            introduced_tokens: [چون]
            example: {text: "کت می‌پوشم چون سرده.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit07.lesson05.teach.better_to
            kind: phrase
            target: {text: "بهتره چتر ببریم", language_code: fa, direction: rtl}
            introduced_tokens: [بهتره, چتر, ببریم]
          - content_key: fa.a1.unit07.lesson05.teach.full_suggestion
            kind: phrase
            target: {text: "چون بارونیه، بهتره چتر ببریم", language_code: fa, direction: rtl}
            introduced_tokens: [بارونیه]
          - content_key: fa.a1.unit07.lesson05.teach.coat_suggestion
            kind: phrase
            target: {text: "چون سرده، بهتره کت بپوشیم", language_code: fa, direction: rtl}
            introduced_tokens: [کت, بپوشیم]
        exercises:
          - content_key: fa.a1.unit07.lesson05.exercise01.recognize_because
            type: multiple_choice
            tested_text: چون
            prompt: {target_blocks: [{text: چون, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson05.exercise02.recognize_umbrella_suggestion
            type: multiple_choice
            tested_text: بهتره چتر ببریم
            prompt: {target_blocks: [{text: "بهتره چتر ببریم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson05.exercise03.recognize_full_suggestion_reading
            type: multiple_choice
            tested_text: چون بارونیه بهتره چتر ببریم
            prompt: {target_blocks: [{text: "چون بارونیه، بهتره چتر ببریم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit07.lesson05.exercise04.match_suggestion_parts
            type: matching_pairs
            tested_text: چون بهتره چتر ببریم بارونیه کت بپوشیم
            prompt: {target_blocks: []}
            pairs:
              - {left: چون, right: "because / since"}
              - {left: بهتره, right: "it's better [to]"}
