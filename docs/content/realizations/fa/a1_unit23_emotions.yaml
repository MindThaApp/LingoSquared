schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fa
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "FSI Persian Basic Course (public domain), scope/register adapted; attempted real lesson text again this pass (livelingua.com/fsi index page, confirmed the Persian/Farsi course entry exists at livelingua.com/project/fsi/persian/farsi) but the page returned only a course directory/update log, no fetchable lesson-by-lesson text or vocabulary lists -- authored using this project's own established fa register/character conventions instead, per docs/content/AUTHORING_GUIDE.md's modernization standard, same honest-disclosure pattern as fa unit21/unit22."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Draft authored 2026-07-08 by a Sonnet 5 fork. Realizes
    universal.a1.emotions.express_basic_feelings (prerequisite:
    universal.a1.preferences.express_preferences, covered by unit14).
    Scoped to: basic feeling vocabulary, asking about someone's state
    (reusing unit01's already-taught حالتون چطوره/چطوری/خوبم rather than
    re-teaching), negating a feeling, giving a simple cause with چون
    (already taught unit14), reading a short feelings passage, and a
    closing نیما/سارا dialogue (reusing the established cast from
    unit14 rather than introducing new characters, since this is a
    personal check-in exchange). Matches the spine outcome's 4
    assessment_requirements exactly. Not self-certified -- needs the
    mandatory fresh-context review before shipping, same as every
    other Claude-authored fa unit.

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula family from units 07-14/21/22. Reuses unit01's neutral-
    polite حالتون چطوره and unit01-lesson04's informal چطوری without
    re-teaching either.

media_assets:
  - content_key: fa.a1.audio.emotions.vocab.01
    language: fa
    text: خوشحال، ناراحت، خسته، گشنه
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.audio.emotions.dialogue.01
    language: fa
    text: "نیما: سارا، چطوری؟ سارا: امروز یکم خسته‌ام چون زیاد کار کردم. تو چطوری؟ نیما: من خوشحالم چون امروز تعطیله. سارا: چه خوب!"
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: fa.a1.unit23.emotions
    title: احساسات
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.emotions.express_basic_feelings
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit23.lesson01.basic_feelings
        title: احساسات ساده
        spine_outcome_id: universal.a1.emotions.express_basic_feelings
        teaching:
          - content_key: fa.a1.unit23.lesson01.teach.khoshhal_word
            kind: vocabulary
            target: {text: خوشحال, language_code: fa, direction: rtl}
            introduced_tokens: [خوشحال]
            example: {text: "من خوشحالم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson01.teach.narahat_word
            kind: vocabulary
            target: {text: ناراحت, language_code: fa, direction: rtl}
            introduced_tokens: [ناراحت]
            example: {text: "من ناراحتم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson01.teach.hastam_contraction
            kind: grammar_note
            target: {text: "خوشحالم = خوشحال + هستم (I am happy, contracted)", language_code: fa, direction: rtl}
            introduced_tokens: [خوشحالم, ناراحتم, "خسته‌ام"]
          - content_key: fa.a1.unit23.lesson01.teach.khaste_word
            kind: vocabulary
            target: {text: خسته, language_code: fa, direction: rtl}
            introduced_tokens: [خسته]
            example: {text: "من خسته‌ام.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit23.lesson01.exercise01.recognize_khoshhal
            type: multiple_choice
            tested_text: خوشحال
            prompt: {target_blocks: [{text: خوشحال, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson01.exercise02.recognize_narahat
            type: multiple_choice
            tested_text: ناراحت
            prompt: {target_blocks: [{text: ناراحت, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson01.exercise03.match_feelings_vocab
            type: matching_pairs
            tested_text: "خوشحال ناراحت خسته"
            prompt: {target_blocks: []}
            pairs:
              - {left: خوشحال, right: happy}
              - {left: ناراحت, right: sad}
              - {left: خسته, right: tired}
          - content_key: fa.a1.unit23.lesson01.exercise04.translate_i_am_happy
            type: translation
            tested_text: خوشحالم
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit23.lesson01.exercise05.translate_i_am_tired
            type: translation
            tested_text: خسته‌ام
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit23.lesson02.asking_how_someone_is
        title: پرسیدن حال
        spine_outcome_id: universal.a1.emotions.express_basic_feelings
        teaching:
          - content_key: fa.a1.unit23.lesson02.teach.khoob_nistam_phrase
            kind: phrase
            target: {text: "خوب نیستم", language_code: fa, direction: rtl}
            introduced_tokens: ["خوب", نیستم, چطوری, خوبم, من]
          - content_key: fa.a1.unit23.lesson02.teach.goshne_word
            kind: vocabulary
            target: {text: گشنه, language_code: fa, direction: rtl}
            introduced_tokens: [گشنه, "گشنه‌ام"]
            example: {text: "من گشنه‌ام.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson02.teach.yekam_word
            kind: vocabulary
            target: {text: یکم, language_code: fa, direction: rtl}
            introduced_tokens: [یکم]
            example: {text: "یکم خسته‌ام.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit23.lesson02.exercise01.recognize_khoob_nistam
            type: multiple_choice
            tested_text: "خوب نیستم"
            prompt: {target_blocks: [{text: "خوب نیستم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson02.exercise02.recognize_goshne
            type: multiple_choice
            tested_text: گشنه
            prompt: {target_blocks: [{text: گشنه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson02.exercise03.match_asking_vocab
            type: matching_pairs
            tested_text: "چطوری خوبم خوب نیستم گشنه یکم"
            prompt: {target_blocks: []}
            pairs:
              - {left: چطوری, right: "how are you (informal)"}
              - {left: خوبم, right: "I'm good"}
              - {left: "خوب نیستم", right: "I'm not good"}
              - {left: گشنه, right: hungry}
              - {left: یکم, right: "a little"}
          - content_key: fa.a1.unit23.lesson02.exercise04.word_order_not_good
            type: word_order
            tested_text: "من خوب نیستم"
            prompt: {target_blocks: [{text: "I'm not good.", language_code: en, direction: ltr}]}
            word_bank: [من, خوب, نیستم]
          - content_key: fa.a1.unit23.lesson02.exercise05.translate_a_little_hungry
            type: translation
            tested_text: "یکم گشنه‌ام"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit23.lesson03.more_feelings
        title: احساسات بیشتر
        spine_outcome_id: universal.a1.emotions.express_basic_feelings
        teaching:
          - content_key: fa.a1.unit23.lesson03.teach.asabani_word
            kind: vocabulary
            target: {text: عصبانی, language_code: fa, direction: rtl}
            introduced_tokens: [عصبانی, "عصبانی‌ام"]
            example: {text: "چرا عصبانی هستی؟", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson03.teach.negaran_word
            kind: vocabulary
            target: {text: نگران, language_code: fa, direction: rtl}
            introduced_tokens: [نگران]
            example: {text: "من نگرانم.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson03.teach.chera_word
            kind: grammar_note
            target: {text: "چرا (why)", language_code: fa, direction: rtl}
            introduced_tokens: [چرا, هستی, نگرانی]
        exercises:
          - content_key: fa.a1.unit23.lesson03.exercise01.recognize_asabani
            type: multiple_choice
            tested_text: عصبانی
            prompt: {target_blocks: [{text: عصبانی, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson03.exercise02.recognize_negaran
            type: multiple_choice
            tested_text: نگران
            prompt: {target_blocks: [{text: نگران, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson03.exercise03.match_more_feelings_vocab
            type: matching_pairs
            tested_text: "عصبانی نگران چرا خوشحال ناراحت"
            prompt: {target_blocks: []}
            pairs:
              - {left: عصبانی, right: angry}
              - {left: نگران, right: worried}
              - {left: چرا, right: why}
              - {left: خوشحال, right: happy}
              - {left: ناراحت, right: sad}
          - content_key: fa.a1.unit23.lesson03.exercise04.translate_why_worried
            type: translation
            tested_text: "چرا نگرانی؟"
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit23.lesson03.exercise05.translate_i_am_angry
            type: translation
            tested_text: عصبانی‌ام
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit23.lesson04.giving_a_reason
        title: دلیل حس
        spine_outcome_id: universal.a1.emotions.express_basic_feelings
        teaching:
          - content_key: fa.a1.unit23.lesson04.teach.kar_kardam_phrase
            kind: phrase
            target: {text: "کار کردم", language_code: fa, direction: rtl}
            introduced_tokens: ["کار", کردم, چون, "خسته‌ام"]
          - content_key: fa.a1.unit23.lesson04.teach.tatile_word
            kind: vocabulary
            target: {text: تعطیله, language_code: fa, direction: rtl}
            introduced_tokens: [تعطیله]
            example: {text: "امروز تعطیله.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson04.teach.emrooz_word
            kind: vocabulary
            target: {text: امروز, language_code: fa, direction: rtl}
            introduced_tokens: [امروز]
            example: {text: "امروز خسته‌ام.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson04.teach.ziad_word
            kind: vocabulary
            target: {text: زیاد, language_code: fa, direction: rtl}
            introduced_tokens: [زیاد]
            example: {text: "زیاد کار کردم.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit23.lesson04.exercise01.recognize_tatile
            type: multiple_choice
            tested_text: تعطیله
            prompt: {target_blocks: [{text: تعطیله, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson04.exercise02.recognize_kar_kardam
            type: multiple_choice
            tested_text: "کار کردم"
            prompt: {target_blocks: [{text: "کار کردم", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson04.exercise03.match_reason_vocab
            type: matching_pairs
            tested_text: "امروز تعطیله کار کردم چون خسته"
            prompt: {target_blocks: []}
            pairs:
              - {left: امروز, right: today}
              - {left: تعطیله, right: "it's a holiday"}
              - {left: "کار کردم", right: "I worked"}
              - {left: چون, right: because}
              - {left: خسته, right: tired}
          - content_key: fa.a1.unit23.lesson04.exercise04.translate_happy_because_holiday
            type: translation
            tested_text: "خوشحالم چون امروز تعطیله"
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit23.lesson04.exercise05.translate_tired_because_worked
            type: translation
            tested_text: "خسته‌ام چون زیاد کار کردم"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit23.lesson05.reading_about_feelings
        title: خواندن درباره‌ی احساسات
        spine_outcome_id: universal.a1.emotions.express_basic_feelings
        teaching:
          - content_key: fa.a1.unit23.lesson05.teach.sara_name_review
            kind: vocabulary
            target: {text: سارا, language_code: fa, direction: rtl}
            introduced_tokens: [سارا]
            example: {text: "سارا خسته‌ست.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit23.lesson05.teach.reading_text
            kind: reading
            target: {text: "سارا امروز یکم خسته‌ست چون زیاد کار کرده. سارا ناراحت نیست، فقط خسته‌ست.", language_code: fa, direction: rtl}
            introduced_tokens: [خسته‌ست, کرده, نیست, فقط]
        exercises:
          - content_key: fa.a1.unit23.lesson05.exercise01.reading_comprehension_how_sara_feels
            type: reading_comprehension
            tested_text: "سارا امروز یکم خسته‌ست چون زیاد کار کرده. سارا ناراحت نیست، فقط خسته‌ست."
            prompt: {target_blocks: [{text: "سارا امروز یکم خسته‌ست چون زیاد کار کرده. سارا ناراحت نیست، فقط خسته‌ست.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson05.exercise02.reading_comprehension_why
            type: reading_comprehension
            tested_text: "سارا امروز یکم خسته‌ست چون زیاد کار کرده. سارا ناراحت نیست، فقط خسته‌ست."
            prompt: {target_blocks: [{text: "سارا امروز یکم خسته‌ست چون زیاد کار کرده. سارا ناراحت نیست، فقط خسته‌ست.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson05.exercise03.match_reading_vocab
            type: matching_pairs
            tested_text: "زیاد فقط خسته نیست کرده"
            prompt: {target_blocks: []}
            pairs:
              - {left: زیاد, right: "a lot"}
              - {left: فقط, right: only}
              - {left: خسته, right: tired}
              - {left: نیست, right: "is not"}
          - content_key: fa.a1.unit23.lesson05.exercise04.translate_sara_is_tired
            type: translation
            tested_text: "سارا خسته‌ست"
            prompt: {target_blocks: []}
          - content_key: fa.a1.unit23.lesson05.exercise05.write_own_feeling
            type: writing_prompt
            tested_text: "خوشحالم چون امروز تعطیله"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit23.lesson06.feelings_dialogue
        title: گفتگوی احساسات
        spine_outcome_id: universal.a1.emotions.express_basic_feelings
        teaching:
          - content_key: fa.a1.unit23.lesson06.teach.che_khoob_phrase
            kind: phrase
            target: {text: "چه خوب!", language_code: fa, direction: rtl}
            introduced_tokens: [چه, نیما, تو, خوشحاله]
          - content_key: fa.a1.unit23.lesson06.teach.dialogue_line1
            kind: dialogue
            target: {text: "سارا، چطوری؟", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit23.lesson06.teach.dialogue_line2
            kind: dialogue
            target: {text: "امروز یکم خسته‌ام چون زیاد کار کردم. تو چطوری؟", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: []
          - content_key: fa.a1.unit23.lesson06.teach.dialogue_line3
            kind: dialogue
            target: {text: "من خوشحالم چون امروز تعطیله.", language_code: fa, direction: rtl, speaker: نیما}
            introduced_tokens: []
          - content_key: fa.a1.unit23.lesson06.teach.dialogue_line4
            kind: dialogue
            target: {text: "چه خوب!", language_code: fa, direction: rtl, speaker: سارا}
            introduced_tokens: []
        exercises:
          - content_key: fa.a1.unit23.lesson06.exercise01.dialogue_comprehension_context
            type: dialogue_comprehension
            tested_text: "سارا چطوری امروز یکم خسته‌ام چون زیاد کار کردم تو چطوری من خوشحالم چون امروز تعطیله چه خوب"
            prompt: {target_blocks: [{text: "سارا، چطوری؟ امروز یکم خسته‌ام چون زیاد کار کردم. تو چطوری؟ من خوشحالم چون امروز تعطیله. چه خوب!", language_code: fa, direction: rtl}]}
            correct_option: "Nima is happy because today is a holiday; Sara is a little tired because she worked a lot."
            distractors:
              - "Nima is tired because he worked a lot; Sara is happy because today is a holiday."
              - "Both Nima and Sara are angry about work today."
              - "Sara is worried about Nima being tired."
          - content_key: fa.a1.unit23.lesson06.exercise02.match_dialogue_facts
            type: matching_pairs
            tested_text: "نیما سارا خوشحال خسته تعطیله کار کردم"
            prompt: {target_blocks: []}
            pairs:
              - {left: نیما, right: Nima}
              - {left: سارا, right: Sara}
              - {left: خوشحال, right: happy}
              - {left: خسته, right: tired}
              - {left: تعطیله, right: "it's a holiday"}
              - {left: "کار کردم", right: "I worked"}
          - content_key: fa.a1.unit23.lesson06.exercise03.reading_comprehension_who_feels_what
            type: reading_comprehension
            tested_text: "امروز یکم خسته‌ام چون زیاد کار کردم. من خوشحالم چون امروز تعطیله."
            prompt: {target_blocks: [{text: "امروز یکم خسته‌ام چون زیاد کار کردم. من خوشحالم چون امروز تعطیله.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson06.exercise04.dialogue_response_own_feeling
            type: dialogue_response
            tested_text: "خوشحالم چون امروز تعطیله"
            prompt: {target_blocks: [{text: "چطوری؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit23.lesson06.exercise05.write_comparison_summary
            type: writing_prompt
            tested_text: "سارا خسته‌ست نیما خوشحاله"
            prompt: {target_blocks: []}
