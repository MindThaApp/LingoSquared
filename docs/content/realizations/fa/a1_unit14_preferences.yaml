  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial -e/-am contraction pattern and
    هستم copula, consistent with units 07-13. Introduces the colloquial
    3rd-person داره (has/likes) form for the first time in this course.

