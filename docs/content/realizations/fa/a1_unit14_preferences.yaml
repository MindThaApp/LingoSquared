review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, fa's next uncovered outcome (universal.a1.preferences.express_preferences, no prerequisites). Six lessons: basic likes/dislikes (دوست دارم/دوست ندارم), asking about preferences, choosing between two options, giving a reason with چون, reading a short preference text (introducing the colloquial 3rd-person داره form), and a dialogue comparing two people's preferences. Colloquial -e/-am contraction register maintained throughout (خوشمزه‌ست، گرمه، جالبه، عالیه), هستم copula family. Authored independently of the prs realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6 pairs (lesson01's 4-pair ceiling is a genuine first-lesson limit, no earlier vocabulary to pool from), and zero fill_in_blank exercises -- every completion-style moment uses translation/writing_prompt with an explicit English cue and multiple accepted phrasing variants instead. Multi-clause production exercises (write_own_preference, dialogue_response_own_preference, write_comparison_summary) include period-joined, comma-joined, and و-joined accepted variants per §12. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW, 2026-07-07 (zero prior access to this unit's authoring reasoning, prs sibling files never opened, per §9/§8): confirmed spine-outcome discipline (all 6 lessons genuinely serve universal.a1.preferences.express_preferences, no drift) and all 4 assessment_requirements covered (understand_preference via lesson06's dialogue_comprehension, exchange_preferences via the dialogue_response exercises, read_preference via lesson05/06's reading_comprehension, write_preference via the writing_prompt exercises) -- matching the same reading-visible-comprehension-for-listening precedent already accepted in units 12/13's own fresh-context reviews, since this unit's audio remains pending_generation. Verified recognition->drag/matching->production pacing in all 6 lessons. Confirmed the §14 claim true (zero listen_type/listen_select/listen_order exercises) and the §17 claim true (zero fill_in_blank exercises, grepped). Verified §16 matching_pairs sizing exactly as claimed (lesson01: 4, lessons02-06: 6 each). Grepped both files for Arabic-range kaf (U+0643)/yeh (U+064A): zero found. Wrote a real Python script (yaml.safe_load, recursive dict-value walk) checking every dict value in both files for a stray non-schema Python bool: none found. Confirmed content_key parity exact in both directions (26 teaching + 30 exercise keys) via script, and confirmed all 8 exercise types used are registered in frontend/src/components/exercises/ExerciseRenderer.tsx. Verified every multiple_choice/reading_comprehension/dialogue_comprehension exercise pairs a Farsi prompt with English-only correct_response/distractors -- no same-script visual-matching shortcut anywhere. Verified via the actual compiled JSON (not just validate) that all 30 exercises have a genuine correct answer, and that answer_language_code resolves to fa for every translation/writing_prompt/dialogue_response exercise per §6. Reasoned through the grammar for authenticity (دوست دارم/ندارم 1st person, می‌خوای 2nd person informal, داره/نداره 3rd person colloquial, چون، خوشمزه‌ست، جالبه، گرمه، کدوم، بیشتر، یا، تو چی؟) and found it genuine, idiomatic colloquial Tehrani Farsi, consistently applied to the correct grammatical person throughout every exercise, and register-consistent with units 12/13 (هستم-family copula, -e/-am contractions, نیما/سارا names). Confirmed A1-appropriate complexity despite the 3rd-person introduction.

    Wrote a Python tokenizer (splitting on whitespace after stripping Persian punctuation، treating ZWNJ-joined compounds as single tokens since ZWNJ isn't whitespace) and checked every exercise's tested_text/word_bank/pairs plus the overlay's Farsi-side accepted_answers against cumulative file-scoped introduced_tokens. Found and fixed 2 real untaught-vocabulary gaps: (1) من (I) was used in accepted_answers starting lesson01.exercise04/05, but was only ever taught in lesson06 -- added a dedicated teaching card introducing من in lesson01 (and removed the now-redundant re-declaration in lesson06's dialogue_line2, which no longer introduces a new token). (2) و (and), used as this unit's §12 multi-clause joiner starting lesson04's accepted_answers, was never taught anywhere in this file at all -- added a grammar_note teaching card for و in lesson04 (mirroring the exact precedent already used in unit13's own و teaching card). Re-ran the tokenizer after both fixes: zero remaining gaps.

    Found and fixed a genuine §11 fact-consistency bug: lesson05's reading text stated 'Sara likes tea because it's warm, Sara doesn't like coffee,' while lesson06's dialogue (same character, same file) has Sara say she prefers coffee over tea because it's delicious -- a direct contradiction about the same named character's stated preference, not two independent unconnected scenarios. Fixed by changing lesson05's stated dislike from coffee to music (سارا موسیقی دوست نداره -- موسیقی was already taught in lesson02, so no new untaught-vocabulary issue introduced), which preserves lesson06's دیالوگ and its بیشتر-comparison teaching goal untouched while removing the contradiction entirely; updated the realization's reading text/tested_text/prompt and the overlay's gloss to match.

    Found and fixed a disguised §17-class ambiguity distinct from the literal fill_in_blank check: lesson05.exercise05 (write_own_preference) is an open-ended 'write about something you like and why' prompt, but only accepted the coffee/delicious answer -- despite this same lesson's own reading text modeling tea/warm and lesson04 modeling music/interesting as equally taught, equally valid topics. A learner truthfully writing about tea or music with correct taught vocabulary would have been marked wrong. Fixed by adding tea and music variants (each with period-joined, comma-joined, و-joined, and من-prefixed forms) as additional status:correct accepted answers.

    Specifically verified lesson06.exercise04 (dialogue_response_own_preference)'s coffee/tea dual-acceptance is NOT a disguised bug: read backend/app/api/router.py's grade() and confirmed the generic multi-answer path (is_multi_answer_response(correct) -> any(normalized_response==normalized(item) for item in correct['accepted'])) genuinely accepts ANY item in the accepted list regardless of which real-world topic it represents -- the exact same mechanism every other multi-variant exercise in the corpus already relies on, not a special case. Confirmed directly in the compiled JSON output that all 6 variants (coffee x3 join-forms, tea x3 join-forms) are present in correct_response.accepted. Also reasoned through whether replacing چون with و changes the causal meaning of the because-clauses (it softens 'because' to a looser 'and'-coordination) and judged this an acceptable, genuinely natural colloquial register choice (comparable to English speakers dropping 'because' for a coordinate clause when giving a casual reason), not a fabricated mechanical insertion -- consistent with the already-established و-joined precedent in unit13.

    One systemic observation NOT fixed here (out of scope for this unit specifically): §15's asterisk-wrapping convention for target-language spans inside mixed-language note/feedback strings (e.g. 'دوست دارم means I like') is not applied anywhere in this unit's overlay, but this exact same gap exists throughout the immediately-prior, already-reviewed-and-shipped unit13 overlay too (checked directly) -- reads as a systemic, pre-existing convention gap across the whole en-fa course rather than something specific to this new unit, so left unfixed here to avoid diverging from established sibling precedent; flagging for whoever next does a dedicated note/feedback formatting pass. Re-ran validate + compile after every fix: 0 errors/0 warnings, valid JSON, and the actual compiled output was spot-checked directly (not just validate) to confirm every fix landed correctly.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 12 kind:vocabulary teaching cards (the merged names card given a 2-item list), each a natural, comprehensible-from-gloss sentence using the card's own word(s). schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    2026-07-07: FRESH-CONTEXT REVIEW of the §19 retrofit examples specifically (zero prior access to the retrofit's own authoring reasoning, scoped narrowly to the new example/example_gloss fields, not a re-review of the unit's already-settled spine outcome/exercises/dialogue). Reviewed all 12 vocabulary cards' example sentences (13 sentences total counting the 2-item names list) for register match, target-word containment, comprehensibility, non-identity with target text, gloss accuracy, script purity (clean), and fact-consistency against this unit's own dialogue (established: Sara prefers coffee over tea because it's delicious; Nima prefers tea because it's warm). Confirmed fa.a1.unit14.lesson05.teach.sara_name's example (\"سارا چای دوست داره\" -- Sara likes tea) is compatible, not contradictory -- the dialogue only establishes a relative preference (Sara likes coffee MORE than tea), so Sara can still like tea. Found and fixed a real §11-class fact-consistency bug elsewhere: fa.a1.unit14.lesson06.teach.names's 2-item example list had Nima's and Sara's drink preferences backwards -- \"نیما قهوه دوست داره\" (Nima likes coffee) and \"سارا چای دوست داره\" (Sara likes tea) directly contradicted the dialogue's own established facts (Sara prefers coffee, Nima prefers tea). Fixed by swapping while keeping each sentence positionally matched to its target name: item0 (نیما) -> \"نیما چای دوست داره\" (Nima likes tea); item1 (سارا) -> \"سارا قهوه دوست داره\" (Sara likes coffee). Re-verified validate+compile clean (0 errors/0 warnings, valid JSON) and spot-checked the compiled output directly to confirm the fix landed."

course:
