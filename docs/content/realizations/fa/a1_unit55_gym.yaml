  - content_key: fa.a1.unit55.audio.gym.vocab.01
    language: fa
    text: "روزانه، وزنه"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit55.audio.dialogue.gym.01
    language: fa
    text: "نیما: سلام خانم شریفی. یک کارت روزانه می‌خوام. خانم شریفی: سلام نیما. کارت روزانه چهل هزار تومنه. نیما: باشه. کلاس و وزنه دارید؟ خانم شریفی: بله، کلاس و وزنه داریم. نیما: باشگاه بازه؟ خانم شریفی: بله، از ساعت شش صبح تا یازده شب بازه. نیما: عالیه. تمرین می‌کنم. ممنون!"
