units:
  - content_key: fa.a1.unit55.gym
    title: باشگاه
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.gym.join_a_gym
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit55.lesson01.new_gym_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.gym.join_a_gym
        teaching:
          - content_key: fa.a1.unit55.lesson01.teach.review_bashgah_mikhaam
            kind: grammar_note
            target: {text: "باشگاه (gym) -- already taught from unit27 / می‌خوام (I want) -- already taught from unit03", language_code: fa, direction: rtl}
            introduced_tokens: [باشگاه, "می‌خوام"]
          - content_key: fa.a1.unit55.lesson01.teach.review_yek_kart
            kind: grammar_note
            target: {text: "یک (one, a) -- already taught from unit03 / کارت (card) -- already taught from unit08", language_code: fa, direction: rtl}
            introduced_tokens: [یک, کارت]
          - content_key: fa.a1.unit55.lesson01.teach.roozane
            kind: vocabulary
            target: {text: روزانه, language_code: fa, direction: rtl}
            introduced_tokens: [روزانه]
            example: {text: "کارت روزانه می‌خوام.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit55.lesson01.exercise01.recognize_roozane
            type: multiple_choice
            tested_text: روزانه
            prompt: {target_blocks: [{text: روزانه, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit55.lesson01.exercise02.recognize_kart_roozane_mikhaam
            type: multiple_choice
            tested_text: "کارت روزانه می‌خوام."
            prompt: {target_blocks: [{text: "کارت روزانه می‌خوام.", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit55.lesson01.exercise03.match_gym_one
            type: matching_pairs
            tested_text: "باشگاه می‌خوام یک کارت روزانه کارت روزانه"
            prompt: {target_blocks: []}
            pairs:
              - {left: باشگاه, right: gym}
              - {left: "می‌خوام", right: "I want"}
              - {left: یک, right: "one, a"}
              - {left: کارت, right: card}
              - {left: روزانه, right: daily}
              - {left: "کارت روزانه", right: "day pass"}
          - content_key: fa.a1.unit55.lesson01.exercise04.word_order_kart_roozane_mikhaam
            type: word_order
            tested_text: "کارت روزانه می‌خوام"
            prompt: {target_blocks: [{text: "I want a day pass.", language_code: en, direction: ltr}]}
            word_bank: [کارت, روزانه, "می‌خوام"]
          - content_key: fa.a1.unit55.lesson01.exercise05.translate_bashgah_mikhaam
            type: translation
            tested_text: "باشگاه می‌خوام"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit55.lesson02.new_gym_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.gym.join_a_gym
        teaching:
          - content_key: fa.a1.unit55.lesson02.teach.review_cheghadr_mishe
            kind: grammar_note
            target: {text: "چقدر (how much) -- already taught from unit21/28 / می‌شه (it comes to / costs) -- already taught from unit11/35", language_code: fa, direction: rtl}
            introduced_tokens: [چقدر, "می‌شه"]
          - content_key: fa.a1.unit55.lesson02.teach.review_chehel_hezar_toman
            kind: grammar_note
            target: {text: "چهل (forty) -- already taught from unit03 / هزار (thousand), تومن (toman) -- already taught from unit03 / تومنه (it's ... toman, colloquial تومن + است contraction) -- already taught from unit03's own \"سی هزار تومنه\"", language_code: fa, direction: rtl}
            introduced_tokens: [چهل, هزار, تومن, "تومنه"]
          - content_key: fa.a1.unit55.lesson02.teach.review_dare
            kind: grammar_note
