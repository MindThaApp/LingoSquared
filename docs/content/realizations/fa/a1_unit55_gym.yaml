    ran `pdftotext -layout` on it locally (17,130 lines, 66,717 words --
    matching the same line/word counts prior units' provenance notes
    reported for this identical source, confirming this is the same
    document, not a different edition). Grepped the freshly-extracted text
    case-insensitively for gym/gymnas/weight/barbell/dumbbell/membership/
    "day pass"/workout/exercise/fitness/"athletic club"/club: exactly 3
    hits, all false positives -- a pedagogical cross-reference ("this
    exercise" as in a grammar drill, line 565), an unrelated grammatical
    suffix explanation using the word "fitness" in the sense of
    "suitability" (line 5076), and another pedagogical "exercises
    necessary to gain fluency" reference (line 6882). Zero genuine hits for
    a gym/fitness scenario anywhere in the document. FSI Persian's own
    1960s diplomatic training course genuinely does not cover a gym visit
    at all (same honest-nothing-found outcome as the park/swimming-pool/
    sports units before it). All vocabulary and the full dialogue in this
