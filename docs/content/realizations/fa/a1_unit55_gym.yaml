review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), performed cold with no access
    to the authoring reasoning below. Ran the actual compiler standalone
    (0 errors/0 warnings) and as part of a 3-unit en-fa A1 batch with
    a1_unit56/a1_unit57 (also 0/0). Independently re-verified every check
    the authoring session's own notes below claim, rather than trusting the
    self-report: grepped both this file and its overlay for Arabic-range
    kaf (U+0643) and yeh (U+064A) -- zero hits, confirmed all keheh/yeh use
    the correct Persian-range codepoints (U+06A9/U+06CC); grepped for bare
    unquoted yes/no/true/false/on/off scalar values -- the only matches are
    the genuine boolean fields human_reviewed/target_language_first, no
    learner-facing field affected; re-derived نیما's and خانم شریفی's full
    line lists from the dialogue by hand and confirmed lesson04's
    dialogue_comprehension distractors ("swimming pool," "how much a class
    costs," "water bottles") are not said or implied by either speaker
    anywhere in this unit's dialogue audio, so there is no same-speaker/
    same-audio collision; confirmed every kind:vocabulary card (روزانه,
    وزنه) has a real example sentence built only from already-taught
    tokens, with a matching overlay example_gloss; confirmed the day-pass
    price (40,000 toman) and hours (6am-11pm) are stated identically across
    the dialogue, the reading sign, and the wrap-up review, with no
    contradiction anywhere in the unit; confirmed every exercise type used
    (multiple_choice, matching_pairs, word_order, translation,
    dialogue_comprehension, dialogue_response, reading_comprehension,
    writing_prompt) is registered in ExerciseRenderer.tsx. matching_pairs
    accepted_answers use this course's established flat-dict shape (not
    {left,right} pair-object arrays) -- confirmed this is the consistent,
    corpus-wide convention (spot-checked against the already-shipped
    a1_unit50 overlay) rather than a one-off deviation, and per CLAUDE.md
    the grading code canonicalizes either shape, so this is a
    consistency note, not a bug. Read every Farsi line in the unit against
    its English gloss for translation accuracy, register (colloquial
    Iranian Farsi throughout, no Dari verb-ending or vocabulary leaks), and
    instruction/answer-data coherence -- found no errors. Found no real bugs
    to fix in this unit. Original authoring-session provenance/reasoning
    preserved below for context.

    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit54 (park). Realizes
    universal.a1.gym.join_a_gym -- confirmed as the correct next unrealized
    A1 outcome for fa by diffing every spine_outcome_id/spine_outcome_ids
    value already used across every docs/content/realizations/fa/
    a1_unit*.yaml file (a yaml-aware grep of "spine_outcome_id" per file,
    deduplicated -- 55 distinct A1 outcomes covered across units01-54, plus
    two A2 outcomes and one B1 outcome from this course's separate A2/B1
    files) against every universal.a1.* id in docs/content/
    universal_spine.yaml's own declaration order: fa has realized every A1
    outcome through unit54 (park) with zero gaps, and
    universal.a1.gym.join_a_gym is the very next A1 id declared in the
    spine immediately after park.enjoy_a_park_outing. Prerequisite outcomes
    (sports.talk_about_sports_exercise/unit27,
    appointments.make_simple_appointment/unit41) are both already realized
    in this course, so no prerequisite gap blocks this unit.

    Scenario shape: universal.a1.gym.join_a_gym's own can_do ("ask about
    joining a gym or buying a day pass, describe basic equipment and a
    class, and talk simply about a workout") is a paid-service transaction,
    so this unit returns to the units 41-49's service-counter convention
    (park/unit54 was a deliberate one-unit departure into a friends'-plan
    scene, explicitly flagged as such in its own review notes) rather than
    reusing the سارا/نیما friend-pair pattern. نیما (this course's
    established male recurring character) is the gym customer, continuing
    his established "visits a service provider and states a need" role
    from units 17 (health), 41 (appointments), 44 (accommodation), 45
    (pharmacy), 46 (barbershop), 47 (bike rental), 48 (laundry), and 49
    (swimming pool). A NEW formal-register character, خانم شریفی, is
    introduced as the gym receptionist -- confirmed collision-free via a
    real scan of every آقای/خانم surname already used across the fa
    corpus's service-encounter units (کریمی، احمدی، صادقی، رضایی، نوری،
    مرادی، کاظمی، جعفری، رحیمی، موسوی، فرهادی، حسینی -- 6 male/6 female as
    of unit53, balanced -- zero collision with شریفی). Choosing her female
    keeps this course's service-clerk gender count close to balanced
    (6 male / 7 female after this unit), not a large skew.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, confirmed with a real grep of every prior fa a1_unit*.yaml
    file's introduced_tokens declarations, not by eye): باشگاه "gym"
    (earliest: unit27, already taught there as a place sports-adjacent
    vocabulary, so this unit's OWN new vocabulary is genuinely limited to
    the transaction-specific words below, not the gym word itself),
    می‌خوام "I want" (unit03), یک "one/a" (unit03), کارت "card" (unit08,
    there used for a payment card -- reused here for a membership/day-pass
    card, the same core "card" sense, no new sense given to the word),
    چقدر "how much" (unit21/28), می‌شه "it comes to/costs" (unit11/35),
    چهل/هزار/تومن (unit03, and چهل هزار تومن as an exact combination was
    already used together in unit03's own price-list matching_pairs),
    تومنه (تومن + colloquial -ه copula contraction, reused directly from
    the exact "سی هزار تومنه" pattern unit03 itself already established),
    داره "it has" (unit26, also reused by unit54), دارید "do you have,
    formal" (units01/04/06/08/21/42/44/45), کلاس "class" (unit02, there
    used for "Persian class" -- reused here for a gym class, same core
    "class" sense), از "from" (unit16), تا "until, to" (unit42), ساعت
    "hour, o'clock" (unit09), شش "six" (unit03), یازده "eleven" (unit03),
    صبح "morning" (unit01/09), شب "night" (unit01/09), باز "open"
    (unit08/24/27/43), بازه "it's open" (colloquial باز + است contraction,
    established unit49), و "and" (unit26), سلام/ممنون (units01/17/22/45/
    46/47/48/49), باشه (units01/02/06/17/22/45/46/47/48/49), بله "yes"
    (unit20/21), آقای/خانم (units40+/41+), عالیه "great" (unit07), تمرین
    "practice/workout" (unit03, from "تمرین کنیم" -- reused here as the
    noun object of می‌کنم), می‌کنم "I do" (established from units01/05/08/
    16/18 and many others). New vocabulary genuinely introduced for the
    first time in the whole corpus: روزانه (daily, forming کارت روزانه
    "day pass") and وزنه (weight/weights, gym equipment) -- exactly 2 new
    words, at the low end of this course's established 2-4-new-word-per-
    unit range (unit52: 3, unit53: 2, unit54: 3), a deliberate choice
    since باشگاه itself (the unit's own topic word) was already taught
    three units ago in unit27, leaving less genuinely new vocabulary
    needed here than a typical brand-new-place unit. One new INFLECTION
    (not a new lexeme) is also introduced: داریم ("we have," 1st-person-
    plural of the already-taught دار- root that unit49 already
    established as دارید/داره) -- declared at its first use in lesson04's
    dialogue_line4, the same "extends an already-known root, not a new
    verb-conjugation pattern" treatment unit27 already used for
    می‌رم/می‌ری/می‌ره and unit49 used for بازه.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the day-pass price (چهل هزار تومن, "40,000
    toman") and the opening hours (از ساعت شش صبح تا یازده شب, "6am to
    11pm") are stated identically in the dialogue (lesson04), the gym-sign
    reading text (lesson05), and the wrap-up review (lesson06); that the
    gym has both a class and weights (کلاس و وزنه داره) is likewise stated
    identically in the dialogue and the reading sign; none of these facts
    are contradicted anywhere else in the unit. Every kind:vocabulary
    teaching item (روزانه, وزنه, and the character card خانم شریفی) has an
    example sentence per schema 1.1/AUTHORING_GUIDE §19, built only from
    the card's own word plus tokens already declared earlier in THIS
    file's document order (no forward references): "کارت روزانه می‌خوام."
    (روزانه's example) only uses کارت and می‌خوام, both declared on the
    two immediately preceding review cards in this same lesson01; "باشگاه
    وزنه داره." (وزنه's example) only uses باشگاه (lesson01) and داره,
    declared on the immediately preceding review card in this same
    lesson02; "سلام خانم شریفی!" (character example) only uses سلام,
    declared on the immediately preceding review card in this same
    lesson04. Every matching_pairs exercise has 6-8 pairs per §16
    (lesson01: 6, lesson02: 7, lesson03: 8, lesson04: 7 dialogue-line
    pairs matching the dialogue's own 7 turns, lesson05: 8, lesson06: 6).
    No listen_type/listen_select/listen_order exercise is used anywhere in
    this unit -- fa has real Azure TTS per AUTHORING_GUIDE §14 (this
    restriction is prs-only, not fa+prs), but this file continues the
    established text-based corpus-consistency pattern from units 19-54,
    the same choice those units' own reviews made. The spine outcome's own
    "listening" assessment requirement (identify membership price, class
    time, or opening hours in a short exchange) is covered via lesson04's
    dialogue_comprehension exercise, the same interpretation units 41-49
    already established for their own "listening" assessment coverage
    without a literal audio exercise type. Checked the same-speaker/
    same-audio distractor-collision bug class (found and fixed 2026-07-09
    in the nl corpus, commit 148240e) anyway, per the standing instruction
    to list every line each speaker says before writing any distractor:
    نیما says "سلام خانم شریفی. یک کارت روزانه می‌خوام."/"باشه. کلاس و
    وزنه دارید؟"/"باشگاه بازه؟"/"عالیه. تمرین می‌کنم. ممنون!"; خانم شریفی
    says "سلام نیما. کارت روزانه چهل هزار تومنه."/"بله، کلاس و وزنه
    داریم."/"بله، از ساعت شش صبح تا یازده شب بازه." -- lesson04's
    dialogue_comprehension exercise asks what نیما wants to know when he
    asks "باشه. کلاس و وزنه دارید؟", with distractors ("He asks if there's
    a swimming pool."/"He asks how much a class costs."/"He asks if they
    sell water bottles.") that are plausible-fact alternatives, NOT lines
    either speaker actually says or facts either speaker actually states
    anywhere in this unit's dialogue -- a swimming pool, a class price, and
    water bottles are never mentioned by either character, so there is no
    cross-exercise collision. The dialogue_response exercise (lesson04)
    accepts نیما's own actual next line ("عالیه. تمرین می‌کنم. ممنون!",
    with paraphrase variants also accepted), not a distractor set, so the
    same-speaker-collision question doesn't apply to it. Every "Translate
    into English" exercise in the paired overlay explicitly sets
    answer_language_code: en. No exercise in this unit tests a genuine
    two-clause sentence joined by "and"/comma (§12) -- the only
    "and"-joined construction (کلاس و وزنه دارید؟/داریم, "a class and
    weights") is a simple noun conjunction inside one clause, not two
    independent clauses, so §12's multi-clause-joining-form concern
    doesn't apply; every genuinely multi-sentence teaching/review line
    (lesson04 dialogue line1/line7, lesson06's price/hours review) is
    authored as two separate short sentences, matching how units 44-49
    already treat their own two-sentence notes, with paraphrase-variant
    accepted answers rather than clause-join variants. Ran a recursive
    scan (grep for bare, unquoted yes/no/true/false/on/off tokens as YAML
    scalar values, plus a full yaml.safe_load parse of both this file and
    its paired overlay confirming every value that loaded is a
    str/list/dict, never a Python bool anywhere in a learner-facing
    field) for bare unquoted yes/no/true/false/on/off values (including
    matching_pairs right: values specifically) -- zero hits, see the
    overlay's own review note for the exact scan result. Ran a
    Persian-vs-Arabic codepoint scan (grep for Arabic kaf U+0643 and
    Arabic yeh U+064A across both files) -- zero hits, all keheh/yeh in
    this file use the correct Persian-range codepoints (U+06A9/U+06CC).

    Review 2026-10-21 (en-fa A1 pass): 0 fixes to the Persian text; scanned for Arabic kaf/yeh, missing ZWNJ after می and detached ها - none found in teaching or exercise text. Review notes for the English overlay list the changes made there. NATIVE FLAGS: the English-in-Persian-block 'already taught from unitNN' lines inside the review-note teaching cards are shown to learners as authored (owner decision).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character) keeps his usual informal register as
    the gym customer. خانم شریفی, a new formal-register gym receptionist,
    speaks with neutral polite service language, consistent with the
    register units 41/42/44/45/46/47/48/49 already established for this
    course's other service-encounter characters. Reuses باشگاه (unit27),
    می‌خوام/یک (unit03), کارت (unit08), چقدر (unit21/28), می‌شه (unit11/
    35), چهل/هزار/تومن (unit03), داره (unit26), دارید (established), کلاس
    (unit02), از/تا/ساعت (unit16/42/09), شش/یازده (unit03), صبح/شب (unit01/
    09), باز (unit08/24/27/43), بازه (unit49), و (unit26), سلام/ممنون/باشه/
    بله/آقای/خانم (established), عالیه (unit07), تمرین (unit03), می‌کنم
    (established) without re-teaching any of it from scratch. No word is
    given a new sense beyond its existing corpus meaning in this unit.

