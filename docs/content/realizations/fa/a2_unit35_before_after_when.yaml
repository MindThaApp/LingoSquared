  notes: 'Spine outcome: universal.a2.sequencing.order_events_with_time_clauses. Grammar target: قبل از اینکه + subjunctive (برم، بخوابم، برسم), بعد از اینکه + simple past (رسیدم، خریدم), and وقتی + past or present; the unit contrasts the subjunctive after قبل with the past after بعد and ends with a three-sentence ordered account. Past perfect not used. Register: casual spoken Tehrani (خونه، صبحونه، اومد، می‌زنم، بهت/بهم, pronoun drop). Characters: established friends Sara and Nima (grep of existing units: Sara is a teacher, Nima an engineer); no new job or family facts asserted. Authored without opening any prs file. NATIVE QUESTIONS: (1) The unit teaches that the verb after قبل از اینکه stays subjunctive even with a past main verb (قبل از اینکه برم، در رو بستم for ''Before I left, I closed the door''). Is this fully natural in speech? Recommended: yes, keep. (2) In the last dialogue turn بعد از اینکه غذا خوردیم، چای می‌خوریم uses a past-form clause with a plan in the main clause. Is this
    natural, or should the clause be subjunctive (بعد از اینکه غذا بخوریم)? Recommended: keep the past form at A2 as natural, and mention the subjunctive only later. (3) Is اینکه (joined) the form to show in learner text rather than این‌که, and is سوار شدم / سوار بشم the most natural pair for getting on a train? Recommended: joined اینکه; سوار شدم / سوار بشم.'
