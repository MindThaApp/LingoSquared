generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access for
    this unit before authoring fresh, honestly disclosed either way per
    AUTHORING_GUIDE.md #10. Tried `firecrawl search "FSI Persian Basic
    Course swimming pool استخر"` first, per the standing instruction to
    re-check Firecrawl quota fresh even though it was reported exhausted in
    every earlier round this session -- it returned `Error: Request failed
    with status code 402` (payment required), confirming the account
    genuinely remains at 0 credits, not a stale report. Fell back to this
    session's own cached `pdftotext -layout` extraction of the same
    Live Lingua-hosted FSI Spoken Persian PDF every prior fa unit this
    session has used (found at this session's own scratchpad path,
    66,445 words, the same file unit48's provenance recorded). Grepped the
    full extracted text case-insensitively for swim/pool/locker/bathhouse:
    exactly one hit, a hotel-room vocabulary list entry ("bath,bathroom" /
    "Does this room have a bath?" / "bathtub" / "shower" / "towel") at
    lines ~38780-38786 -- a hotel-bathroom fixture list, not a public
    swimming-pool scenario at all: no ticket price, locker, opening-hours,
    or pool-rules material exists anywhere in the extracted text. This is a
    genuine dead end of the same shape as units 44-48's own source
    searches: the FSI course has no public-swimming-pool material, not an
    extraction failure. All swimming-pool vocabulary and the full dialogue
    in this unit (استخر, بلیط, کمد, and the customer-attendant exchange)
    is authored fresh from this project's own established colloquial
    Iranian Farsi conventions and already-shipped vocabulary (see review
    notes below for the exact reuse chain).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed ONE real
    spelling bug. This unit's own draft spelled "ticket" as بلیت
    throughout (46 lines in this file, 24 in the paired overlay), but the
    standard modern Persian spelling -- and the spelling already
    established by two EARLIER fa units (unit16 travel, unit28
    transportation) plus every later fa unit that also uses the word
    (units 51/52/53/57: cinema/museum/concert/zoo, already-shipped) -- is
    بلیط (from French "billet," ط not ت). This unit was internally
    self-consistent (بلیت used uniformly, never mixed with بلیط within the
    same file, so the compiler's own per-file checks had nothing to catch)
    but broke corpus-wide spelling consistency for a word this course
    teaches learners more than once across different units -- a real
    "genuine Persian... grammar/register quality" defect per this review's
    own charge, not a stylistic nitpick (بلیت would read as a plain typo
    to a native speaker). Fixed with a global find-and-replace of بلیت ->
    بلیط across both this file and its overlay (content_key values like
    `...teach.belit` are romanized ASCII and untouched, correctly).
    Re-validated clean after the fix: 0 errors/0 warnings standalone and
    combined with units 47/48/50.

    Everything else in this unit was checked clean: a recursive grep for
    unquoted yes/no/true/false/on/off scalar values -- zero hits; a scan
    for Arabic-range kaf (U+0643)/yeh (U+064A)/alef maksura (U+0649)
    codepoints -- zero hits, all keheh/yeh correctly in the Persian range;
    a targeted scan of every learner-facing gloss/title/note/instruction/
    correct_option/feedback string for snake_case jargon leaks -- zero
    hits. Same-speaker/same-audio distractor-collision check (no
    listen_select in this unit, so applied to lesson04's
    dialogue_comprehension instead): manually re-listed both نیما's and
    آقای جعفری's actual dialogue lines and confirmed none of the three
    distractors ("...if they sell swimsuits."/"...if there's a
    café."/"...how many lanes the pool has.") is a fact either speaker
    states anywhere in the dialogue -- confirmed clean. Ticket price (پنج
    هزار تومن) and opening hours (از ساعت شش تا نه) are stated identically
    in the dialogue, the pool-sign reading text, and the wrap-up review,
    per AUTHORING_GUIDE.md #11 -- no drift. Character check: آقای جعفری
    does not collide with any other named آقای/خانم service character
    anywhere else in the fa corpus. All 19 registered exercise types are
    used correctly. matching_pairs accepted_answers use the flat-dict
    shape, consistent with the established corpus convention, not treated
    as a bug. The gender-segregated-pool scenario reasoning (male
    front-desk attendant matching real Iranian public-pool staffing
    convention) is a genuinely researched dialect-authenticity call per
    AUTHORING_GUIDE.md #3, not an unexamined default.

    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit48 (laundry). Realizes
    universal.a1.swimming_pool.visit_swimming_pool -- confirmed as the
    correct next unrealized A1 outcome for fa by diffing every
    spine_outcome_id already used across every
    docs/content/realizations/fa/a1_unit*.yaml file (grep -o
    "spine_outcome_id: universal\.[a-z0-9_.]*" per file, deduplicated)
    against universal.a1.* ids in docs/content/universal_spine.yaml's own
    declaration order: fa has realized every A1 outcome through unit48
    (laundry) with zero gaps, and universal.a1.swimming_pool.
    visit_swimming_pool is the very next A1 id declared in the spine
    immediately after laundry.use_launderette (the outcomes between them --
    a2.bureaucracy/a2.opinions/a2.banking/a2.health/a2.housing -- are all
    A2, out of scope for this A1 pass, and fa's two shipped A2 units
    already cover bureaucracy/opinions independently). Prerequisite
    outcomes (money.handle_basic_money_matters/unit21,
    places.locate_common_places/unit05) are both already realized in this
    course, so no prerequisite gap blocks this unit.

    Scenario choice, per AUTHORING_GUIDE.md #3 (verify actual dialect
    usage, don't assume a Western default): Iranian public swimming pools
    (استخر) are real, common, and -- unlike some Western assumptions about
    segregated facilities being unusual -- are legally gender-segregated
    with separate men's/women's time slots and staff, a genuine cultural
    detail rather than an invented one. Since نیما (this course's
    established male recurring character) is the customer, the new
    front-desk attendant character is authored male (آقای جعفری) to match
    the real men's-session staffing convention, not as a coincidental
    choice -- this keeps the scenario dialect-authentic rather than
    defaulting to an assumed-neutral front-desk character. This does shift
    this unit's own service-encounter gender count to 5 male (کریمی،
    صادقی، نوری، مرادی، جعفری) vs 3 female (احمدی، رضایی، کاظمی) rather
    than staying perfectly balanced -- a deliberate authenticity call for
    THIS specific scenario, not a general drift away from the course's
    established gender-balance practice; a future unit should lean female
    to keep the corpus-wide balance reasonable.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, which validates each exercise's tested_text against tokens
    introduced anywhere earlier in the SAME file's document order) --
    confirmed with a real grep of every prior fa a1_unit*.yaml file's
    introduced_tokens declarations, not by eye: کجاست "where is" (unit05),
    این "this" (units03/04/08/15/20/26), یک "one/a" (unit03), می‌خوام "I
    want" (unit03), چقدر "how much" (unit21/28), می‌شه "it comes to /
    costs" (unit11/35), پنج "five" (unit03), هزار "thousand" (unit03/21),
    تومن "toman" (unit03/21) -- with تومنه (تومن + colloquial -ه copula
    contraction) reused directly from the exact "سی هزار تومنه" pattern
    unit03 itself already established, دارید "do you have, formal"
    (units01/04/06/08/21/42/44/45), از "from" (unit16), تا "until, to"
    (unit42), ساعت "hour, o'clock" (unit09), شش "six" (unit03), نه "nine"
    (unit03), باز "open" (unit08/24/27/43), سلام/ممنون (units01/17/22/45/
    46/47/48), باشه (units01/02/06/17/22/45/46/47/48), بله "yes" (unit20/
    21), خوبه "good, that's fine" (unit06/10/12/19/48). New vocabulary
    genuinely introduced for the first time in the whole corpus: استخر
    (swimming pool), بلیط (ticket), and کمد (locker) -- exactly 3 new
    words, in line with this course's established 2-4-new-word-per-unit
    range (unit47: 2, unit48: 2, unit45: 4). One new CONSTRUCTION is also
    introduced without being a new root word: بازه, the colloquial
    contraction of باز + است ("[it] is open"), built on the already-taught
    root باز and following the exact same -ه copula-contraction pattern
    this corpus already established for خوبه/چنده/تومنه/آماده‌ست (unit44).
    Declared via its own grammar_note review card (not a vocabulary card,
    since باز itself isn't new) alongside a phrase card for the resulting
    "استخر بازه؟" question, mirroring exactly how unit48's lesson03 built
    "فردا ظهر خوبه؟" as a phrase card on top of a grammar_note reviewing
    its own already-taught parts. No new verb-conjugation pattern is
    introduced -- every verb form used (می‌خوام, می‌شه) was already
    established by an earlier unit; بازه is a copula contraction, not a
    new verb form.

    Register/character choice, per AUTHORING_GUIDE.md #3: نیما (the
    established recurring character) is the pool customer, keeping his
    usual informal register, a natural continuation of his established
    "visits a service provider and states a need" role from units 17
    (health), 41 (appointments), 44 (accommodation), 45 (pharmacy), 46
    (barbershop), 47 (bike rental), and 48 (laundry). A NEW formal-register
    character, آقای جعفری, is introduced as the pool front-desk attendant
    -- distinct from unit40/42/44's آقای کریمی, unit41's خانم احمدی,
    unit42's آقای صادقی, unit45's خانم رضایی, unit46's آقای نوری, unit47's
    آقای مرادی, and unit48's خانم کاظمی (confirmed via a real scan of
    every آقای/خانم name already used across the fa corpus -- کریمی،
    احمدی، صادقی، رضایی، نوری، مرادی، کاظمی -- zero collision with جعفری);
    he speaks in neutral polite service language, consistent with the
    receptionist/librarian/hotel-clerk/pharmacist/barber/bike-shop-owner/
    laundry-owner register units 41/42/44/45/46/47/48 already established
    for this course's other service-encounter characters, while نیما keeps
    the same informal register he uses everywhere else in the corpus.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the ticket price (پنج هزار تومن, "5,000
    toman") and the opening hours (از ساعت شش تا نه, "from six to nine")
    are stated identically in the dialogue (lesson04), the pool-sign
    reading text (lesson05), and the wrap-up review (lesson06), and never
    contradicted anywhere else in the unit. Every kind:vocabulary teaching
    item (استخر, بلیط, کمد, and the character card آقای جعفری) has an
    example sentence per schema 1.1/AUTHORING_GUIDE §19, built only from
    the card's own word plus tokens already declared earlier in THIS
    file's document order (no forward references); بازه is authored as a
    grammar_note + phrase pair instead of a vocabulary card (see the reuse-
    chain note above), so it isn't subject to the vocabulary-card example
    requirement, but its own phrase card still carries a natural note.
    Every matching_pairs exercise has 6-8 pairs per §16 (lesson01: 6,
    lesson02: 7, lesson03: 8, lesson04: 7 dialogue-line pairs matching the
    dialogue's own 7 turns, lesson05: 8, lesson06: 6). No listen_type/
    listen_select/listen_order exercise is used anywhere in this unit --
    fa has real Azure TTS per AUTHORING_GUIDE §14 (this restriction is
    prs-only, not fa+prs), but this file continues the established
    text-based corpus-consistency pattern from units 19-48, the same
    choice those units' own reviews made, rather than introducing audio
    exercises to only this one unit out of step with its immediate
    neighbors -- the spine outcome's own "listening" assessment
    requirement (identify ticket price, locker instructions, or opening
    hours in a short exchange) is covered via the dialogue_comprehension
    exercise's comprehension-of-the-exchange task, the same interpretation
    units 41/42/44/45/46/47/48 already established for their own
    "listening" assessment coverage without a literal audio exercise type.
    This also means the same-speaker/same-audio distractor-collision bug
    class (found and fixed 2026-07-09 in the nl corpus, commit 148240e)
    cannot directly apply here -- there is no listen_select exercise in
    this file to check. Checked anyway, per the standing instruction to
    list every line each speaker says before writing any distractor: نیما
    says "سلام آقای جعفری. یک بلیط استخر می‌خوام."/"باشه. کمد دارید؟"/
    "استخر بازه؟"/"خوبه. ممنون!"; آقای جعفری says "سلام نیما. بلیط پنج
    هزار تومنه."/"بله، کمد هست."/"بله، از ساعت شش تا نه بازه." -- lesson04's
    dialogue_comprehension exercise asks what نیما wants to know when he
    asks "استخر بازه؟", with distractors ("He wants to know if they sell
    swimsuits."/"He wants to know if there's a café."/"He wants to know
    how many lanes the pool has.") that are plausible-fact alternatives,
    NOT lines either speaker actually says or facts either speaker
    actually states anywhere in this unit's dialogue -- swimsuits, a café,
    and lane count are never mentioned by either character, so there is no
    cross-exercise collision. The dialogue_response exercise (lesson04)
    accepts نیما's own actual next line ("خوبه. ممنون!", with paraphrase
    variants also accepted), not a distractor set, so the same-speaker-
    collision question doesn't apply to it. Every "Translate into English"
    exercise in the paired overlay explicitly sets answer_language_code:
    en. No exercise in this unit tests a genuine two-clause sentence
    joined by "and"/comma (§12) -- every multi-sentence teaching/review
    line (lesson04 dialogue line 4, lesson06's price/hours review) is
    authored as two separate short sentences, matching how units 44/45/46/
    47/48 already treat their own two-sentence notes, with paraphrase-
    variant accepted answers rather than clause-join variants. Ran a
    recursive scan (grep for bare, unquoted yes/no/true/false/on/off
    tokens as YAML scalar values, plus a full yaml.safe_load parse of both
    this file and its paired overlay confirming every value that loaded is
    a str/list/dict, never a Python bool anywhere in a learner-facing
    field) for bare unquoted yes/no/true/false/on/off values (including
    matching_pairs right: values specifically) -- zero hits, see the
    overlay's own review note for the exact scan result. Ran a
    Persian-vs-Arabic codepoint scan (grep for Arabic kaf U+0643 and
    Arabic yeh U+064A across both files) -- zero hits, all keheh/yeh in
    this file use the correct Persian-range codepoints (U+06A9/U+06CC).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: نیما (the
    established recurring character) keeps his usual informal register as
    the swimming-pool customer. آقای جعفری, a new formal-register pool
    front-desk attendant, speaks with neutral polite service language,
    consistent with the register units 41/42/44/45/46/47/48 already
    established for this course's other service-encounter characters.
    Reuses کجاست (unit05), این (unit03/04/08/15/20/26), یک (unit03),
    می‌خوام (unit03), چقدر (unit21/28), می‌شه (unit11/35), پنج/هزار/تومن
    (unit03/21), دارید (unit01/04/06/08/21/42/44/45), از (unit16), تا
    (unit42), ساعت (unit09), شش/نه (unit03), باز (unit08/24/27/43),
    سلام/ممنون (units01/17/22/45/46/47/48), باشه (units01/02/06/17/22/45/
    46/47/48), بله (unit20/21), خوبه (unit06/10/12/19/48) without
    re-teaching any of it from scratch. No word is given a new sense
    beyond its existing corpus meaning in this unit.

media_assets:
  - content_key: fa.a1.unit49.audio.pool.vocab.01
    language: fa
    text: "استخر، بلیط، کمد"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit49.audio.dialogue.pool.01
    language: fa
    text: "نیما: سلام آقای جعفری. یک بلیط استخر می‌خوام. آقای جعفری: سلام نیما. بلیط پنج هزار تومنه. نیما: باشه. کمد دارید؟ آقای جعفری: بله، کمد هست. نیما: استخر بازه؟ آقای جعفری: بله، از ساعت شش تا نه بازه. نیما: خوبه. ممنون!"
    voice_hint: two_adults_neutral_friendly
