units:
  - content_key: fa.a1.unit49.swimming_pool
    title: استخر
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.swimming_pool.visit_swimming_pool
    planned_lesson_count: 6

    lessons:
      - content_key: fa.a1.unit49.lesson01.new_pool_one
        title: "کلمات جدید ۱"
        spine_outcome_id: universal.a1.swimming_pool.visit_swimming_pool
        teaching:
          - content_key: fa.a1.unit49.lesson01.teach.review_kojast_in
            kind: grammar_note
            target: {text: "کجاست (where is) -- already taught from unit05 / این (this) -- already taught from unit03/04/08", language_code: fa, direction: rtl}
            introduced_tokens: [کجاست, این]
          - content_key: fa.a1.unit49.lesson01.teach.review_yek_mikhaam
            kind: grammar_note
            target: {text: "یک (one, a) -- already taught from unit03 / می‌خوام (I want) -- already taught from unit03", language_code: fa, direction: rtl}
            introduced_tokens: [یک, "می‌خوام"]
          - content_key: fa.a1.unit49.lesson01.teach.estakhr
            kind: vocabulary
            target: {text: استخر, language_code: fa, direction: rtl}
            introduced_tokens: [استخر]
            example: {text: "استخر کجاست؟", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit49.lesson01.exercise01.recognize_estakhr
            type: multiple_choice
            tested_text: استخر
            prompt: {target_blocks: [{text: استخر, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit49.lesson01.exercise02.recognize_estakhr_kojast
            type: multiple_choice
            tested_text: "استخر کجاست؟"
            prompt: {target_blocks: [{text: "استخر کجاست؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit49.lesson01.exercise03.match_pool_one
            type: matching_pairs
            tested_text: "استخر کجاست این یک می‌خوام استخر کجاست"
            prompt: {target_blocks: []}
            pairs:
              - {left: استخر, right: "swimming pool"}
              - {left: کجاست, right: "where is"}
              - {left: این, right: this}
              - {left: یک, right: "one, a"}
              - {left: "می‌خوام", right: "I want"}
              - {left: "استخر کجاست؟", right: "Where is the swimming pool?"}
          - content_key: fa.a1.unit49.lesson01.exercise04.word_order_estakhr_kojast
            type: word_order
            tested_text: "استخر کجاست"
            prompt: {target_blocks: [{text: "Where is the swimming pool?", language_code: en, direction: ltr}]}
            word_bank: [استخر, کجاست]
          - content_key: fa.a1.unit49.lesson01.exercise05.translate_in_estakhr
            type: translation
            tested_text: "این استخر"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit49.lesson02.new_pool_two
        title: "کلمات جدید ۲"
        spine_outcome_id: universal.a1.swimming_pool.visit_swimming_pool
        teaching:
          - content_key: fa.a1.unit49.lesson02.teach.review_cheghadr_mishe
            kind: grammar_note
            target: {text: "چقدر (how much) -- already taught from unit21/28 / می‌شه (it comes to / costs) -- already taught from unit11/35", language_code: fa, direction: rtl}
            introduced_tokens: [چقدر, "می‌شه"]
          - content_key: fa.a1.unit49.lesson02.teach.review_panj_hezar_toman
            kind: grammar_note
            target: {text: "پنج (five) -- already taught from unit03 / هزار (thousand), تومن (toman) -- already taught from unit03/21 / تومنه (it's ... toman, colloquial تومن + است contraction) -- already taught from unit03's own \"سی هزار تومنه\"", language_code: fa, direction: rtl}
            introduced_tokens: [پنج, هزار, تومن, "تومنه"]
          - content_key: fa.a1.unit49.lesson02.teach.belit
            kind: vocabulary
            target: {text: بلیط, language_code: fa, direction: rtl}
            introduced_tokens: [بلیط]
            example: {text: "بلیط چقدر می‌شه؟", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.a1.unit49.lesson02.exercise01.recognize_belit
            type: multiple_choice
            tested_text: بلیط
            prompt: {target_blocks: [{text: بلیط, language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit49.lesson02.exercise02.recognize_belit_cheghadr_mishe
            type: multiple_choice
            tested_text: "بلیط چقدر می‌شه؟"
            prompt: {target_blocks: [{text: "بلیط چقدر می‌شه؟", language_code: fa, direction: rtl}]}
          - content_key: fa.a1.unit49.lesson02.exercise03.match_pool_two
            type: matching_pairs
            tested_text: "بلیط چقدر می‌شه پنج هزار تومن بلیط چقدر می‌شه"
            prompt: {target_blocks: []}
            pairs:
              - {left: بلیط, right: ticket}
              - {left: چقدر, right: "how much"}
              - {left: "می‌شه", right: "it comes to"}
              - {left: پنج, right: five}
              - {left: هزار, right: thousand}
              - {left: تومن, right: toman}
              - {left: "بلیط چقدر می‌شه؟", right: "How much does the ticket come to?"}
          - content_key: fa.a1.unit49.lesson02.exercise04.word_order_belit_panj_hezar_tomane
            type: word_order
            tested_text: "بلیط پنج هزار تومنه"
            prompt: {target_blocks: [{text: "The ticket is 5,000 toman.", language_code: en, direction: ltr}]}
            word_bank: [بلیط, پنج, هزار, "تومنه"]
          - content_key: fa.a1.unit49.lesson02.exercise05.translate_panj_hezar_toman
            type: translation
            tested_text: "پنج هزار تومن"
            prompt: {target_blocks: []}

      - content_key: fa.a1.unit49.lesson03.locker_and_hours
        title: "کمد و ساعت کاری"
        spine_outcome_id: universal.a1.swimming_pool.visit_swimming_pool
        teaching:
          - content_key: fa.a1.unit49.lesson03.teach.review_darid
            kind: grammar_note
            target: {text: "دارید (do you have, formal) -- already taught from units 01/04/06/08/21/42/44/45", language_code: fa, direction: rtl}
            introduced_tokens: [دارید]
          - content_key: fa.a1.unit49.lesson03.teach.review_az_ta_saat
            kind: grammar_note
            target: {text: "از (from) -- already taught from unit16 / تا (until, to) -- already taught from unit42 / ساعت (hour, o'clock) -- already taught from unit09", language_code: fa, direction: rtl}
            introduced_tokens: [از, تا, ساعت]
