review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, fa's next uncovered outcome (universal.a1.comparisons.make_basic_comparisons, prerequisites: preferences and numbers, both already covered in unit14/unit03). Six lessons: basic comparative forms (بزرگ‌تره/کوچیک‌تره), comparing prices (گرون‌تره/ارزون‌تره), comparing people (قد بلند‌تره/جوون‌تره), giving a reason for a comparison (بهتره/بد‌تره + چون), reading a short comparison text, and a dialogue comparing two options while making a purchase decision. Colloquial -e contraction register maintained throughout (fused comparative forms like بزرگ‌تره), هستم copula family. Authored independently of the prs realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6 pairs except lesson01's genuine 4-pair first-lesson ceiling, and zero fill_in_blank exercises. Learning from unit14's own fresh-context review findings, both open-ended production exercises (write_own_comparison, dialogue_response_own_comparison) carry multiple topic/adjective variants from the start rather than a single expected answer. Multi-clause reason exercises include period-joined, comma-joined, and و-joined accepted variants per §12. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW, 2026-07-07 (zero prior access to this unit's authoring reasoning, prs sibling files never opened, per §8/§9): confirmed spine-outcome discipline (all 6 lessons genuinely serve universal.a1.comparisons.make_basic_comparisons) and all 4 assessment_requirements covered (understand_comparison/read_comparison via lesson05/06's reading_comprehension and dialogue_comprehension, make_comparison via the dialogue_response exercises, write_comparison via the writing_prompt/translation exercises), matching the same reading-visible-comprehension-for-listening precedent already accepted in units 12-14's own fresh-context reviews since this unit's audio remains pending_generation. Verified recognition->drag/matching->production pacing in all 6 lessons. Confirmed the §14 claim true (zero listen_type/listen_select/listen_order exercises, grepped) and the §17 claim true (zero fill_in_blank exercises, grepped). Verified §16 matching_pairs sizing exactly as claimed (lesson01: 4, lessons02-06: 6 each). Grepped both files for Arabic-range kaf (U+0643)/yeh (U+064A): zero found. Wrote a real Python script (yaml.safe_load, recursive dict-value walk) checking every dict value in both files for a stray non-schema Python bool: none found. Confirmed content_key parity exact in both directions (20 teaching + 30 exercise keys) via script, and confirmed all 7 exercise types used are registered in ExerciseRenderer.tsx. Wrote a real duplicate-instruction-vs-target_blocks script (yaml.safe_load both files, case-insensitive compare of every exercise's en-language target_blocks against that exercise's overlay instruction): zero duplicates found. Read backend/app/api/router.py's grade()/is_multi_answer_response() and confirmed lesson05.exercise05/lesson06.exercise04/lesson06.exercise05's multi-variant open-ended acceptance is genuine multi-answer grading (any accepted-list item matches, regardless of topic), not a disguised bug -- confirmed directly in the compiled JSON that every authored variant appears in correct_response.accepted. Verified via web search that Persian has only five true frozen/suppletive تر exceptions (بهتر، مهتر، کهتر، بیشتر، کمتر) and found + fixed two real issues: (1) an internal orthography inconsistency -- بدتره/بلندتره were missing the ZWNJ every other fused comparative in this file uses (بزرگ‌تره، کوچیک‌تره، گرون‌تره، ارزون‌تره، جوون‌تره), corrected to بد‌تره/بلند‌تره throughout both files, confirmed present in the actual compiled output; (2) a genuine grammar-accuracy error in the overlay's teaching note, which incorrectly called بد‌تر an 'irregular' comparative of بد -- it is actually the REGULAR +تر suffixation of the identical root (only بهتر is genuinely suppletive/irregular, built from the archaic root به, not from خوب) -- corrected the note's wording. Wrote and ran a real Python tokenizer (ZWNJ-aware, Persian-punctuation-stripping) checking every exercise's tested_text/pairs/word_bank and the overlay's accepted_answers against cumulative file-scoped introduced_tokens: found and fixed one genuine untaught-vocabulary gap (اما used in lesson06.exercise05's fourth accepted variant but never taught anywhere in this unit; replaced with the already-taught ولی). Re-ran the tokenizer after the fix: zero remaining gaps. Cross-checked §11 facts (Nima taller/Sara younger in lesson03/05; the more-expensive-but-better vs. cheaper item in lesson06) across every exercise/teaching card referencing them: fully consistent throughout, no contradictions found. Confirmed lesson04's two multi-clause reason exercises and lesson06.exercise05's summary exercise each carry period-joined, comma-joined, and و-joined accepted variants per §12. Verified every multiple_choice/reading_comprehension/dialogue_comprehension exercise pairs a Farsi prompt with English-only correct_option/distractors -- no same-script visual-matching shortcut anywhere. Reasoned through and verified via web search (Persian Wikipedia's style guide, Wiktionary, UT Austin Persian resources) that از is used correctly and consistently as 'than' (never confused with 'from'), that بزرگ‌تر/کوچیک‌تر/گرون‌تر/ارزون‌تر/بلند‌تر/جوون‌تر are all correct regular comparatives, that بهتر is genuinely the correct irregular/suppletive comparative of خوب, and that قد بلند‌تره is a natural, correct colloquial idiom for 'taller,' not a calque. Confirmed A1-appropriate complexity throughout despite the first introduction of comparative morphology. Register verified consistent with units 13/14 (هستم-family copula, -e/-am contractions, نیما/سارا names, و-joined multi-clause precedent). Re-ran validate + compile after every fix: 0 errors/0 warnings, valid JSON, and the actual compiled output was spot-checked directly (not just validate) to confirm the ZWNJ fixes, the untaught-vocabulary fix, all 30 exercises have a genuine non-empty correct_response, and answer_language_code correctly resolves to fa for every translation/writing_prompt/dialogue_response exercise per §6.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 12 kind:vocabulary teaching cards (2 merged names cards, lesson03 and lesson06, each given a 2-item list), each a natural, comprehensible-from-gloss sentence using the card's own word(s). schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    2026-07-07: FRESH-CONTEXT REVIEW of the §19 retrofit examples specifically (zero prior access to the retrofit's own authoring reasoning, scoped narrowly to the new example/example_gloss fields, not a re-review of the unit's already-settled spine outcome/exercises/dialogue). Reviewed all 12 vocabulary cards' example sentences (14 sentences total counting the two 2-item names lists) for register match, target-word containment, comprehensibility, non-identity with target text, gloss accuracy, script purity (clean), and fact-consistency against this unit's own dialogue/reading (Nima taller/Sara younger; Nima's more-expensive-but-better item vs. Sara's cheaper one) -- all consistent, including fa.a1.unit15.lesson06.teach.names's example list, which accurately reflects each speaker's own dialogue line. Found and fixed a real orthography bug distinct from the fact-consistency class found in sibling units: fa.a1.unit15.lesson03.teach.names's example list used \"بلندتره\" without the ZWNJ (U+200C) every other fused comparative in this same file uses (بزرگ‌تره، کوچیک‌تره، گرون‌تره، ارزون‌تره، جوون‌تره، بد‌تره -- this exact ZWNJ convention was already fixed project-wide in this unit's own prior fresh-context review, but that pass predates this later §19 retrofit's new example text, which wasn't checked against it) -- fixed to \"بلند‌تره\", matching the card's own target token. Re-verified validate+compile clean (0 errors/0 warnings, valid JSON) and confirmed the ZWNJ is present in the actual compiled example text."

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
