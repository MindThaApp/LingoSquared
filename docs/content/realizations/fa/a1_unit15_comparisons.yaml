        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - content_key: fa.a1.unit15.lesson01.teach.in_word
            kind: vocabulary
            target: {text: این, language_code: fa, direction: rtl}
            introduced_tokens: [این]
            example: {text: "این از اون بزرگ‌تره.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit15.lesson01.teach.oon_word
            kind: vocabulary
            target: {text: اون, language_code: fa, direction: rtl}
            introduced_tokens: [اون]
            example: {text: "اون از این کوچیک‌تره.", language_code: fa, direction: rtl}
          - content_key: fa.a1.unit15.lesson01.teach.bozorgtare_word
            kind: vocabulary
            target: {text: بزرگ‌تره, language_code: fa, direction: rtl}
            introduced_tokens: ["بزرگ‌تره"]
            example: {text: "این از اون بزرگ‌تره.", language_code: fa, direction: rtl}
