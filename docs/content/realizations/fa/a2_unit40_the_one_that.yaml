  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.description.identify_with_relative_clauses. Grammar target: head noun + ی + که + clause (کتابی که خریدم، مردی که اونجا نشسته), object and subject relative clauses, the ای spelling after a silent ه or a final ی (خونه‌ای که، مشتری‌ای که), and اون / همون / کدوم with a relative clause. Resumptive pronouns and oblique forms (که ... توش) are left for B1. Register: casual spoken Tehrani; the clerk uses شما forms. Characters: Sara and Nima plus an unnamed کارمند (clerk); no family or job facts asserted. NATIVE QUESTIONS: (1) Is دفتر گمشده‌ها a natural name for a lost-property office, or is اشیای گمشده better? Recommended: keep دفتر گمشده‌ها (shorter for A2). (2) Is مشتری‌ای که زنگ زد correct in careful spelling (ZWNJ + ای after ی)? Recommended: yes, keep. (3) Is همکاری که تو بانک کار می‌کنه better with an optional اون in front for spoken style? Recommended: keep as is and accept optional اون. (4) Is کیفی که گم کردید formal enough for a clerk, or would you expect گم کرده‌اید? Recommended: keep گم کردید (spoken polite).'
course:
  realization_key: fa.a2
  target_language_first: true
  dialect: fa_IR_standard_colloquial_a2
  register_policy: 'Casual spoken Iranian (Tehrani): کیفی که گم کردم، می‌کنه، خونه‌ای که, pronoun dropping, and spoken verb endings; polite شما forms (گم کردید) only to a clerk. No written-only forms are produced.'
