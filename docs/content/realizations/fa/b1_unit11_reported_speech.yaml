          - content_key: fa.b1.unit11.lesson01.teach.sara
            kind: vocabulary
            target: {text: سارا, language_code: fa, direction: rtl}
            introduced_tokens: [سارا]
            example: {text: "سارا پرسید که آیا وقت داری.", language_code: fa, direction: rtl}
        exercises:
          - content_key: fa.b1.unit11.lesson01.exercise01.recognize_porsid
            type: multiple_choice
            tested_text: پرسید
            prompt: {target_blocks: [{text: پرسید, language_code: fa, direction: rtl}]}
          - content_key: fa.b1.unit11.lesson01.exercise02.recognize_aya
