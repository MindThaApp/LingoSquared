generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Checked the local
    `.firecrawl/` cache before writing (per standing instruction, since
    Firecrawl reports 402/credits-exhausted on the live network) -- no
    cached material relevant to Persian reported speech was found there,
    and the FSI Persian Basic Course is separately confirmed beginner-only
    (see every prior fa B1 unit's own provenance note). Authored from
    general Persian grammar knowledge.

    This is fa's ELEVENTH B1 unit, the fifth and last of the "second
    wave" (only the outcome id was reused from en-nl's own second-wave
    course -- verified verbatim against universal_spine.yaml -- never
    nl's actual content; no nl file was opened while authoring this one).

    Grammar target, genuinely distinct from unit06's own reported-speech
    unit (که گفتن + preterite, 1st/2nd/3rd SINGULAR only, retained-present
    STATEMENTS: گفت که دیر می‌رسه): (1) reporting YES/NO QUESTIONS with
    پرسید (که) آیا...؟ ("asked whether...?") -- unit06 never covered
    reported QUESTIONS at all, only statements; (2) reporting WH-QUESTIONS
    with پرسید (که) کجا/کِی...؟ ("asked where/when...?"), keeping the
    original question word in the embedded clause rather than an
    English-style "asked where I was" inversion; (3) PRONOUN SHIFT when
    reporting someone else's own first-person statement -- the direct
    quote "من می‌رم" ("I'm going," سارا's own words) becomes گفت (که)
    خودش می‌ره ("she said she herself is going," 3rd person) when نیما
    reports it -- unit06's own review explicitly confirmed Persian does
    NOT back-shift TENSE the way English does, but never addressed PRONOUN
    shift, which is a genuinely separate feature of reported speech this
    unit picks up; (4) completing the گفتن paradigm gap unit06's own
    provenance note explicitly deferred -- گفتیم/گفتید (1st/2nd person
    PLURAL preterite of گفتن), both unambiguous with the bare infinitive
    گفتن (only the 3rd-person-plural preterite collides with it, which
    remains deliberately untaught here too, same as unit06).

    Continues the established trio from unit06 (نیما as narrator, رضا as
    listener, سارا as the person whose speech gets reported) rather than
    inventing new characters, since a reported-speech unit genuinely
    benefits from continuing an established narrative voice. Nothing
    established about these three elsewhere in the corpus is contradicted
    (سارا's own established busy-with-deadlines characterization from
    unit01 is consistent with her asking نیما for a favor here).

    All vocabulary is introduced self-contained within this file (the
    established per-file convention) -- even که/گفت, already taught in
    unit06, are redeclared here.

    Character-cast continuity: reuses نیما, رضا, and سارا, all
    established (confirmed via grep against the fa corpus before
    writing); no new character introduced. No nl or other sibling-
    direction file was opened while authoring this one.

    Lessons 01-02 drill the two reported-question forms (yes/no with آیا,
    then wh-question) in turn; lesson03 introduces the pronoun-shift
    feature plus the گفتیم/گفتید paradigm-completion; lesson04 is a
    dialogue in which نیما reports to رضا what سارا asked/said, using all
    three new constructions; lesson05 is a third-person reading
    recounting the same reported exchange; lesson06 is production-only
    wrap-up -- the same six-lesson arc established across every prior fa
    B1 unit.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude), cold, no access to the
    authoring reasoning above. Verified reported-speech grammar is correct:
    reported yes/no (پرسید که آیا...) and wh-questions (پرسید که کِی/کجا...)
    keep statement word order with the question word in place; pronoun shift
    to خودش (3rd person) with tense NOT back-shifted (می‌رم→می‌ره), correct for
    Persian; گفتیم/گفتید plural preterite forms correct; the reading's
    pluperfect گفته بود is well-used. Person handling is right: the isolated
    teaching forms use 2sg (داری/میای) while the embedded dialogue/reading
    correctly shift to 1sg (دارم/میام) or 3sg (داره/میاد) per speaker. Fixed
    (objective-grading): the word کِی is written with an explicit kasre
    (U+0650); since fa grades strict (no distance-1 tolerance) and _normalize
    does not strip Persian harakat, a learner typing the natural undiacritized
    کی in the three typed کِی exercises (lesson02 ex05/ex07, lesson06 ex03)
    would be marked incorrect -- added an undiacritized کی accepted-answer
    variant on those. Broader flag (Codex/compiler lane, not fixed here): the
    strict fa grading path never strips harakat, so any standard tanwin-alef
    adverb in a typed/speak accepted answer (حتماً/لطفاً/واقعاً, across these
    and likely other fa units) is a latent friction point if a learner omits
    the tanwin -- a harakat-stripping normalization step would be the durable
    corpus-wide fix. Continues نیما/رضا/سارا from unit06; مریم reused as a
    generic background name (no conflicting biography).

course:
  realization_key: fa.b1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established neutral-polite spoken colloquial register
    used throughout fa units 01-57 and B1 units 01-10. Reported speech
    with که is register-neutral, used identically in casual speech and
    more formal registers, so this unit's between-friends narration needs
    no special register marking.

