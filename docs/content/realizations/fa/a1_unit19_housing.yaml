none found. Re-ran validate + compile after confirming zero issues needed fixing: 0 errors/0 warnings, valid JSON, and the actual compiled output was spot-checked directly (not just validate) to confirm all 30 exercises have a genuine non-empty correct_response and answer_language_code correctly resolves to fa for every translation/writing_prompt/dialogue_response exercise per §6.

