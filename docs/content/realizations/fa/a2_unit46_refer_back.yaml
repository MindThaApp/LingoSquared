review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.references.refer_back_without_repeating. Grammar target: object clitics on the verb in spoken Persian: -ش for “it / him / her” (خریدمش، دیدیش، خوندمش), -شون for “them” and -ت for “you” (دیدمشون، دیدمت); fused preposition clitics (بهش، ازش، براش، باهاش) and the first-person forms بهم and برام; question and negative forms (خریدیش؟، ندیدمش). Teaching order: mention the noun once with رو, then refer back with the clitic. Register: casual spoken Tehrani Persian. Characters: established friends Sara (teacher) and Nima (engineer); Mina appears by name only and no job or family facts are asserted. Recycles library (borrowing and returning), celebrations (gifts) and shops. Every tested word is re-introduced in this unit. Authored without opening any prs file; the Dari clitic policy (Q3) is not decided here. NATIVE QUESTIONS (each with a recommended answer): (1) Is the -ش object clitic on a past verb (خریدمش) the natural spoken choice, or would speakers also say اونو خریدم here? Recommended: teach the clitic as the main pattern and mention nothing else. (2) Is دیدیش the right written form for “did you see it”, and is the stress different from دیدی؟ Recommended: keep دیدیش. (3) Is باهاش (not باش) the correct spoken form of “with him / her”? Recommended: keep باهاش. (4) Is بهم پس دادن natural for “give back to me”, and is we-form needed at A2? Recommended: keep first-person بهم and برام only, no we-forms. (5) For things (کتاب, هدیه) is the clitic -ش fully natural, or do speakers prefer to repeat the noun? Recommended: keep the clitic; it is very common in speech.'
