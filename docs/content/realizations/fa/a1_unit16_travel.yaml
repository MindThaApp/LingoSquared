review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, fa's next uncovered outcome (universal.a1.travel.handle_basic_journey, prerequisites: numbers/unit03, time/unit09, directions/unit05-places_and_directions, all already covered). Six lessons: basic travel vocabulary (bilit/train/bus/airport), buying a ticket, asking about departure time and platform, reading a short schedule/announcement, a dialogue at the ticket counter, and writing a short travel request message. understand_travel_announcement's own success_criteria calls for listening 'without transcript-first support' -- since fa has zero working TTS/recorded audio, this unit follows the established read-substituting-for-listening pattern already used for the same reason in units 09/11/12/13/14/15 (a written announcement/schedule text stands in for the audio announcement). Colloquial -e/-am contraction register maintained throughout, هستم copula family. Authored independently of the prs realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6 pairs except lesson01's genuine 4-pair first-lesson ceiling, and zero fill_in_blank exercises. Multi-clause exercises include period-joined, comma-joined, and و-joined accepted variants per §12, and the open-ended production exercise carries multiple accepted destination/time variants from the start, per the pattern established in unit14/unit15's own reviews. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW, 2026-07-07 (zero prior access to this unit's authoring reasoning, prs sibling files never opened, per §8/§9): confirmed spine-outcome discipline (all 6 lessons genuinely serve universal.a1.travel.handle_basic_journey, no drift) and all 4 assessment_requirements covered (understand_travel_announcement via lesson04's reading_comprehension and lesson05's dialogue_comprehension -- the same read-substituting-for-listening precedent already accepted in units 09/11-15's own fresh-context reviews since audio remains pending_generation; request_travel_information via lesson02/03's translation exercises and lesson05's dialogue_response; read_ticket_schedule via lesson04's reading_comprehension pair; write_travel_request via the writing_prompt exercises in lessons 04-06), and confirmed the substituted reading/dialogue material genuinely tests extracting a travel detail (time, platform) from text, the same underlying skill the spine's listening requirement targets. Verified recognition->drag/matching->production pacing in all 6 lessons (reading_comprehension/dialogue_comprehension exercises function as recognition-tier comprehension checks, correctly placed before or alongside matching_pairs and ahead of every production exercise). Confirmed the §14 claim true (zero listen_type/listen_select/listen_order exercises, grepped) and the §17 claim true (zero fill_in_blank exercises, grepped). Verified §16 matching_pairs sizing exactly as claimed (lesson01: 4, lessons02-06: 6 each). Grepped both files for Arabic-range kaf (U+0643)/yeh (U+064A): zero found. Wrote a real Python script (yaml.safe_load, recursive dict-value walk) checking every dict value in both files for a stray non-schema Python bool: none found. Confirmed content_key parity exact in both directions (26 teaching + 30 exercise keys after the fix below) via script, and confirmed all 8 exercise types used (multiple_choice, matching_pairs, translation, word_order, reading_comprehension, writing_prompt, dialogue_comprehension, dialogue_response) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx. Wrote a real duplicate-instruction-vs-target_blocks script (yaml.safe_load both files, case-insensitive compare of every exercise's en-language target_blocks against that exercise's overlay instruction): zero duplicates found -- this unit was correctly checked against the project-wide duplicate-instruction-text bug during authoring. Verified every multiple_choice/reading_comprehension/dialogue_comprehension exercise pairs a Farsi prompt with English-only correct_option/distractors -- no same-script visual-matching shortcut anywhere. Read backend/app/api/router.py's grade()/is_multi_answer_response() and confirmed lesson04.exercise05/lesson05.exercise05/lesson06.exercise05's multi-variant open-ended acceptance is genuine multi-answer grading (any accepted-list item matches), not a disguised bug -- confirmed directly in the compiled JSON that every authored variant appears in correct_response.accepted, and that all 30 exercises have a genuine non-empty correct_response. Reasoned through the vocabulary/grammar for authenticity: بلیط/قطار/اتوبوس/فرودگاه/سکو/حرکت می‌کنه/کی/می‌خوام/خواهش می‌کنم are all natural, correct, idiomatic colloquial Tehrani Farsi for train travel, not calques or overly formal; یک بلیط به تهران می‌خوام is natural, common, correctly-ordered Iranian Farsi for 'I want a ticket to Tehran'; سکوی دو is a correctly-formed ezafe construction ('platform two'); grepped every از occurrence in this unit and confirmed it is used consistently and unambiguously as 'from' (departure origin) throughout, with no 'than'-usage confusion (that usage is unit15-specific and does not appear here). Verified register consistency against units 14/15 (هستم-family copula, -e/-am contractions, colloquial می‌خوام/می‌کنه/باشه forms) -- fully consistent. Confirmed A1-appropriate complexity throughout.

    Wrote a Python tokenizer (whitespace-splitting after stripping Persian punctuation، ZWNJ-aware since ZWNJ isn't whitespace) and checked every exercise's tested_text/pairs/word_bank plus the overlay's Farsi-side accepted_answers against cumulative file-scoped introduced_tokens. Found and fixed one genuine untaught-vocabulary gap: و (and), used as lesson06.exercise05's §12 و-joined multi-clause variant, was never taught anywhere in this file (unlike unit14/unit15, which both have a dedicated و teaching card) -- added a grammar_note teaching card for و in lesson06 (mirroring the exact precedent already used in unit14/unit15's own و teaching cards), in both the realization and the overlay. Re-ran the tokenizer after the fix: zero remaining gaps.

    Checked lesson04.exercise05/lesson05.exercise05/lesson06.exercise05 (the three open-ended production exercises) for §17-class hidden ambiguity (whether the English cue could be satisfied by equally-valid Farsi phrasings not all listed): lesson04.exercise05 and lesson06.exercise05 already had adequate multi-variant coverage (different fact-subsets and all three §12 join forms respectively). Found and fixed one real gap: lesson02.exercise05 (translate_ticket_request) and lesson05.exercise05 (write_travel_request) only accepted 'یک بلیط به تهران می‌خوام' (with the indefinite یک), despite this same file's own lesson01.exercise04 already establishing the precedent that dropping یک before بلیط is an equally natural, equally accepted colloquial variant ('یک بلیط قطار' / 'بلیط قطار' both accepted there) -- added 'بلیط به تهران می‌خوام' (without یک) as an additional accepted variant to both exercises for consistency with that in-file precedent. Confirmed via the actual compiled JSON that both new variants appear correctly in correct_response.accepted.

    Cross-checked §11 facts (ticket to Tehran, traveling tomorrow morning, train departs 8am from platform two) across every exercise/teaching card that references them (lesson04's schedule reading text, lesson05's dialogue, lesson06's summary exercise): fully consistent throughout, no contradictions found. Confirmed lesson06.exercise05 (write_travel_summary) carries period-joined, comma-joined, و-joined, and two-sentence accepted variants per §12. Re-ran validate + compile after every fix: 0 errors/0 warnings, valid JSON, and the actual compiled output was spot-checked directly (not just validate) to confirm every fix landed correctly and every exercise has a genuine correct answer."

