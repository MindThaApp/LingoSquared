generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    Made a real, fresh attempt at FSI Persian Basic Course source access
    before authoring this unit, per AUTHORING_GUIDE.md #10 and the standing
    instruction to re-check Firecrawl quota fresh even though it has been
    reported exhausted in every prior round. `firecrawl search "FSI Persian
    Basic Course park پارک picnic پیک‌نیک walk stroll"` returned `Error:
    Request failed with status code 402` (payment required), confirming the
    account genuinely remains at 0 credits. Fell back to this worker's own
    cached local `pdftotext -layout` extraction of the same Live
    Lingua-hosted FSI Spoken Persian PDF prior fa units in this line have
    used (`fsi_persian_livelingua.txt`, ~17,130 lines, ~66,700 words).
    Grepped case-insensitively for park/picnic/stroll/walk (in a leisure
    sense, not "walk to a place"): zero genuine hits for a park-outing
    scene anywhere in the document. FSI Persian's own 1960s diplomatic
    training course genuinely does not cover a leisure park visit at all
    (same honest-nothing-found outcome as the museum/concert units before
    it). All vocabulary and the full dialogue in this unit are authored
    fresh from this project's own already-shipped vocabulary (see review
    notes below for the exact reuse chain).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed the same
    خوبه citation-accuracy bug found in unit53 (same authoring pass, same
    error, propagated here too): this file's lesson02 grammar_note card's
    target.text, its own reuse-chain review-note prose, and the paired
    overlay's matching "note" field all claimed خوبه ("good") was
    "already taught from unit01/05/06/07/10/12." A real introduced_tokens
    grep confirms unit01/05/07 never actually declared خوبه as taught
    vocabulary (only used it in an example sentence or informal prose,
    e.g. unit07's own review notes independently attribute it to "the
    خوبه، خوبه‌ست pattern from unit06") -- its real first introduction is
    unit06. Corrected all three locations (grammar_note target.text,
    reuse-chain prose, and the overlay's note field) to cite unit06/10/12
    instead. Everything else in this unit checked clean: no
    same-speaker/same-audio distractor collisions in the park dialogue
    (نیما and سارا's lines independently listed and checked against the
    dialogue_comprehension distractors), no stray unquoted
    yes/no/true/false/on/off YAML booleans, no Arabic-range kaf/yeh
    codepoints, every exercise type used is registered, the park's name
    (پارک ملت, a real, well-known Tehran park), its hours (7am-10pm), and
    that it has trees are stated identically across the dialogue and the
    park-sign reading text (this unit correctly states no price anywhere,
    since a park visit is free and the spine outcome never requires one),
    matching_pairs/word_order shapes are correct, and the Farsi reads
    naturally with correct Iranian colloquial register -- سارا and نیما
    are confirmed as a genuine established recurring friend pair via a
    real corpus grep showing both names appearing substantially in
    unit11/33/38, not just an unverified claim. Compiler validation clean
    both standalone and as part of the combined unit51-54 run: 0 errors/0
    warnings.

    Prior draft-authoring provenance notes, kept for the record below.

    Draft authored 2026-07-10 by Claude (content-authoring worker session),
    continuing fa A1 volume growth past unit53 (concert). Realizes
    universal.a1.park.enjoy_a_park_outing -- confirmed as the correct next
    unrealized A1 outcome for fa by diffing every spine_outcome_id/
    spine_outcome_ids value already used across every
    docs/content/realizations/fa/a1_unit*.yaml file (grep -h
    "spine_outcome_id" per file, deduplicated) against every
    universal.a1.* id in docs/content/universal_spine.yaml's own
    declaration order: fa has realized every A1 outcome through unit53
    (concert) with zero gaps, and universal.a1.park.enjoy_a_park_outing is
    the very next A1 id declared in the spine immediately after
    concert.attend_a_concert. Prerequisite outcomes
    (plans.make_simple_plans/unit12, weather.describe_basic_weather/unit07)
    are both already realized in this course, so no prerequisite gap
    blocks this unit.

    Scenario shape, a deliberate departure from units 41-53's own
    service-counter convention: universal.a1.park.enjoy_a_park_outing's own
    can_do ("make plans to spend time in a park, describe what you see
    there, suggest a simple activity like a walk or a picnic, and talk
    simply about the visit afterward") is a friends'-plan scene, not a
    transaction, so this unit does NOT introduce a new named service clerk
    the way units 41-53 each did -- there is nothing to buy and no counter
    exchange the outcome's own assessment_requirements ask for. Instead it
    reuses the established سارا/نیما friend pair (already paired together
    in unit11/unit33/unit38, and separately with each in units this course
    has already shipped), continuing their existing informal register
    rather than inventing a new character, matching how unit07 (weather)
    and unit38 (seasons) -- this course's other non-transactional,
    friends-chatting units -- were built. This is flagged explicitly as an
    intentional scenario judgment call, not an oversight of the
    established-character convention.

    Reuse chain (all re-declared in this file's own introduced_tokens
    before first use, per the compiler's per-file-only untaught-vocabulary
    check, confirmed with a real grep of every prior fa a1_unit*.yaml
    file's introduced_tokens declarations, not by eye): بریم (earliest:
    unit07, also unit12), می‌خوای (earliest: unit12), پارک (earliest:
    unit07, also unit27/unit33), باشه (earliest: unit03, also unit07/12/
    many others), عالیه (earliest: unit07), امروز (earliest: unit06/07),
    هوا (earliest: unit07), چطوره (earliest: unit01, also unit07/12),
    آفتابیه (earliest: unit07), و (earliest: unit26), گرمه (earliest:
    unit07), خوبه (earliest: unit06, also unit10/12 -- CORRECTED DURING
    FRESH-CONTEXT REVIEW, 2026-07-10: this file originally cited
    unit01/05/06/07/10/12; a real introduced_tokens grep confirms unit01/
    05/07 only ever used خوبه inside an example sentence or review-note
    prose, never declared it as taught vocabulary -- unit06 is its real
    first introduction), یا
    (earliest: unit06), داره (earliest: unit26), چطور (earliest: unit01),
    بود (earliest: unit06), باحال (earliest: unit36), سارا (earliest:
    unit02, recurring character), ملت (used ONLY as one component of a
    proper-noun park name, پارک ملت -- Mellat Park, a genuine well-known
    Tehran park, matching the real-place-name authenticity precedent
    already set by unit05's میدان آزادی/هتل آزادی -- confirmed collision-
    free via a corpus-wide grep, zero prior use), از/ساعت/هفت/صبح/تا/ده/شب
    (all corpus-established time/number words reused for lesson05's
    reading-only opening-hours line; earliest sources respectively unit01,
    unit09, unit03, unit01, unit03, unit03, unit09 -- re-declared here
    since this is their first appearance in THIS file, not because any of
    them are new to the corpus). New vocabulary genuinely introduced for
    the first time in the whole corpus: پیک‌نیک (picnic, a direct
    loanword), قدم (step, combined with the already-corpus-known root
    زدن -- unit22's زنگ زدن/بزن already established this verb -- into the
    cohortative phrase قدم بزنیم, "let's walk/stroll"; بزنیم itself is a
    new surface inflection of that known root and is declared alongside
    قدم rather than counted as a second new lexeme), and درخت (tree) --
    exactly 3 new words (within this course's established 2-4
    new-word-per-unit range: unit50: 3, unit51: 3, unit52: 3, unit53: 2),
    not counting the one exempt proper noun (ملت) per the precedent
    explained above. No new verb-conjugation PATTERN is introduced --
    بزنیم extends the already-known زدن root the same way می‌ری/می‌رم/
    بریم already coexist in this corpus as related-but-distinct surface
    forms of رفتن.

    Facts are kept internally consistent across the whole unit per
    AUTHORING_GUIDE.md #11: the park's name (پارک ملت), its hours (از
    ساعت هفت صبح تا ده شب -- 7am to 10pm), and that it has trees (درخت
    داره) are stated identically in the dialogue (lesson04, "پارک درخت
    داره"), the park-sign reading text (lesson05), and never contradicted
    anywhere else in the unit; no price or money figure is stated anywhere
    in this unit (a genuine, deliberate difference from every one of
    units 41-53's paid-service scenes -- a park visit is free, and
    universal.a1.park.enjoy_a_park_outing's own assessment_requirements
    never mention price), so there is no §11 numeric-fact risk to
    cross-check on that axis. Every kind:vocabulary teaching item (پیک‌نیک,
    قدم بزنیم, درخت) has an example sentence per schema 1.1/AUTHORING_
    GUIDE §19, built only from the card's own word plus tokens already
    declared earlier in THIS file's document order (no forward
    references): "پیک‌نیک بریم؟" (پیک‌نیک's example) only uses بریم,
    declared on the immediately preceding review card in this same
    lesson01; "پارک قدم بزنیم؟" (قدم بزنیم's example) only uses پارک
    (lesson01) and قدم/بزنیم (this same card, self-reference on first
    declaration, matching unit53's own کنسرت-card precedent); "پارک درخت
    داره." (درخت's example) only uses پارک (lesson01), درخت (this same
    card), and داره, declared on the immediately preceding review card in
    this same lesson02. Every matching_pairs exercise has 6-8 pairs per
    §16 (lesson01: 6, lesson02: 7, lesson03: 6, lesson04: 6 dialogue-line
    pairs matching the dialogue's own 6 turns, lesson05: 8, lesson06: 6).
    No listen_type/listen_select/listen_order exercise is used anywhere in
    this unit -- fa has real Azure TTS per AUTHORING_GUIDE §14, but this
    file continues the established text-based corpus-consistency pattern
    from units 19-53, the same choice those units' own reviews made. The
    spine outcome's own "listening" assessment requirement (identify what
    someone sees or plans to do in a park from a short spoken exchange) is
    covered via lesson04's dialogue_comprehension exercise, the same
    interpretation units 41-53 already established for their own
    "listening" assessment coverage without a literal audio exercise type.
    Checked the same-speaker/same-audio distractor-collision bug class
    (found and fixed 2026-07-09 in the nl corpus, commit 148240e) anyway,
    per the standing instruction to list every line each speaker says
    before writing any distractor, even though there is no listen_select
    exercise in this file to directly trigger it: نیما says "سارا،
    می‌خوای بریم پارک؟"/"آفتابیه و گرمه."/"قدم بزنیم. پارک درخت داره.";
    سارا says "باشه، عالیه! امروز هوا چطوره؟"/"خوبه! قدم بزنیم یا
    پیک‌نیک بریم؟"/"باشه، می‌بینمت." -- lesson04's dialogue_comprehension
    exercise asks what سارا proposes when she says "خوبه! قدم بزنیم یا
    پیک‌نیک بریم؟", with distractors ("She asks what time it is."/"She
    asks how much the picnic costs."/"She asks if Nima wants to go
    home.") that are plausible-fact alternatives, NOT lines either speaker
    actually says or facts either speaker actually states anywhere in
    this unit's dialogue -- the time, a cost, and going home are never
    mentioned by either character, so there is no cross-exercise
    collision. The dialogue_response exercise (lesson04) accepts نیما's
    own actual next line ("قدم بزنیم. پارک درخت داره.", with paraphrase
    variants also accepted), not a distractor set, so the same-speaker-
    collision question doesn't apply to it. Every "Translate into English"
    exercise in the paired overlay explicitly sets answer_language_code:
    en. No exercise in this unit tests a genuine two-clause sentence
    joined by "and"/comma (§12) -- every multi-sentence teaching/review
    line (lesson04 dialogue line2, lesson06's review_afterward line) is
    authored as two separate short sentences, matching how units 44-53
    already treat their own two-sentence notes, with paraphrase-variant
    accepted answers rather than clause-join variants. Ran a recursive
    scan (grep for bare, unquoted yes/no/true/false/on/off tokens as YAML
    scalar values, plus a full yaml.safe_load parse of both this file and
    its paired overlay confirming every value that loaded is a
    str/list/dict, never a Python bool anywhere in a learner-facing
    field) for bare unquoted yes/no/true/false/on/off values (including
    matching_pairs right: values specifically) -- zero hits, see the
    overlay's own review note for the exact scan result. Ran a
    Persian-vs-Arabic codepoint scan (grep for Arabic kaf U+0643 and
    Arabic yeh U+064A across both files) -- zero hits, all keheh/yeh in
    this file use the correct Persian-range codepoints (U+06A9/U+06CC).

course:
  realization_key: fa.a1
  target_language_first: true
  dialect: fa_IR_standard_colloquial_intro
  register_policy: >-
    Continues the established colloquial Iranian Farsi register: سارا and
    نیما, both already-established recurring friend characters (paired
    together in unit11/unit33/unit38), keep their usual informal register
    while making a park plan. Reuses بریم (unit07), می‌خوای (unit12), پارک
    (unit07), باشه (unit03), عالیه (unit07), امروز/هوا/چطوره/آفتابیه/گرمه
    (unit07), خوبه (established), یا (unit06), داره (unit26), چطور
    (unit01), بود (unit06), باحال (unit36) without re-teaching any of it
    from scratch. No word is given a new sense beyond its existing corpus
    meaning in this unit.

media_assets:
  - content_key: fa.a1.unit54.audio.park.vocab.01
    language: fa
    text: "پیک‌نیک، قدم بزنیم، درخت"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fa.a1.unit54.audio.dialogue.park.01
    language: fa
    text: "نیما: سارا، می‌خوای بریم پارک؟ سارا: باشه، عالیه! امروز هوا چطوره؟ نیما: آفتابیه و گرمه. سارا: خوبه! قدم بزنیم یا پیک‌نیک بریم؟ نیما: قدم بزنیم. پارک درخت داره. سارا: باشه، می‌بینمت."
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

