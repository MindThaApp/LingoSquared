review:
  status: unreviewed
  required_next_reviewer: native_fa
  notes: 'Spine outcome: universal.a2.daily_life.describe_self_care_and_feelings. Grammar target: reflexive خود + possessive ending (خودم، خودت، خودش، خودمون، خودتون، خودشون) after از (از خودم مراقبت می‌کنم) and مواظب (مواظب خودت باش), reflexive compound verbs (خودم رو خسته/آماده کردم), contrast with the emphatic خود before the verb (خودم شام درست کردم), personal-care compound verbs (دوش می‌گیرم، مسواک می‌زنم، ورزش می‌کنم، استراحت می‌کنم) and feeling adjectives with the spoken person ending (خسته‌م، ناراحتم، حالم بده). Register: casual spoken Tehrani Persian. Characters: established friends Sara (teacher) and Nima (engineer); no new job or family facts asserted. Recycles health, personal care and emotions (A1 units 17, 23, 46); every tested word is re-introduced in this unit. Authored without opening any prs file. NATIVE QUESTIONS (each with a recommended answer): (1) Is به خودم می‌رسم natural for “I look after myself / my appearance” in everyday Tehrani speech? Recommended: keep it, taught as a fixed phrase. (2) Is خودم رو خسته کردم natural for “I tired myself out”, or do speakers prefer خسته شدم? Recommended: keep خودم رو خسته کردم because it shows the reflexive pattern, and gloss it as a fixed use. (3) Do speakers contract خودم رو to خودمو in casual speech, and is it fine to accept it? Recommended: show the spaced form, accept the contracted one with a note. (4) Is مواظب خودتون باشین the right plural / polite imperative, or مواظب خودتون باشید? Recommended: keep باشین (spoken). (5) Is حالم بده natural for feeling unwell as well as feeling low? Recommended: keep it, glossed as “I feel bad”.'
