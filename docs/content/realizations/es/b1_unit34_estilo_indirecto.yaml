schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Authored fresh for Peninsular Spanish. No other language unit was
    consulted.
review:
  status: reviewed
  required_next_reviewer: codex
  notes: >-
    Realizes universal.b1.reported_speech.report_what_someone_said
    literally: learners report both a reported STATEMENT ("dice que...")
    and a reported QUESTION ("pregunta si..."), plus a past reporting verb
    ("dijo que..."). Character canon checked on disk and preserved (grep of
    a1_unit13_work.yaml, a2_unit22-25, b1_unit27/29/33): Elena is a Spanish
    teacher living in London; Mateo is a Colombian accountant living in
    London; they address each other with tú as established peers. No new
    facts about either character are introduced. The culminating exercise
    (lesson04) requires the learner to report BOTH a statement and a
    question about the same message, matching the outcome's can_do
    ("X said that...", "X asked whether...") in full.

    Second-pass review 2026-10-19: 1 fix -- lesson03.teach.tense_note: false rule 'reported verb stays in the past (llegó, not llega)' rewritten to say the verb stays in a past tense when the original words were about the past, naming había llegado as the formal backshift.
course:
  realization_key: es.b1
  target_language_first: true
  dialect: es_peninsular
  register_policy: >-
    Peninsular Spanish. Elena and Mateo use tú as established peers;
    reported-speech sentences use natural first-person/third-person
    wording consistent with prior B1 units.
media_assets:
  - {content_key: es.b1.audio.estilo_indirecto.mateo_tarde.01, language: es, text: "Mateo dice que llega tarde.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.estilo_indirecto.elena_pregunta.01, language: es, text: "Elena pregunta si tengo la llave.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.estilo_indirecto.elena_dijo.01, language: es, text: "Elena dijo que llegó tarde a la reunión.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.estilo_indirecto.mensaje_completo.01, language: es, text: "Mateo dice que llega tarde. Mateo pregunta si tengo la llave.", voice_hint: neutral_young_adult, status: pending_generation}
units:
  - content_key: es.b1.unit34.estilo_indirecto
    title: "Estilo indirecto"
    section: speaking
    spine_outcome_ids: [universal.b1.reported_speech.report_what_someone_said]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit34.lesson01.dice_que
        title: "Dice que..."
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - content_key: es.b1.unit34.lesson01.teach.dice
            kind: vocabulary
            target: {text: "dice", language_code: es, direction: ltr}
            introduced_tokens: [dice]
            example: {text: "Mateo dice que llega tarde.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson01.teach.que
            kind: vocabulary
            target: {text: "que", language_code: es, direction: ltr}
            introduced_tokens: [que]
            example: {text: "Dice que llega tarde.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson01.teach.llega
            kind: vocabulary
            target: {text: "llega", language_code: es, direction: ltr}
            introduced_tokens: [llega]
            example: {text: "Mateo llega tarde.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson01.teach.tarde
            kind: vocabulary
            target: {text: "tarde", language_code: es, direction: ltr}
            introduced_tokens: [tarde]
            example: {text: "Llega tarde hoy.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson01.teach.reported_statement
            kind: phrase
            target: {text: "Mateo dice que llega tarde.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, dice, que, llega, tarde]
          - content_key: es.b1.unit34.lesson01.teach.construction_note
            kind: grammar_note
            target: {text: "To report what someone said, use *dice que* + the reported sentence -- no quotation marks needed.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit34.lesson01.exercise01.choose_mateo, type: multiple_choice, tested_text: "Mateo dice que llega tarde", prompt: {target_blocks: [{text: "Which sentence reports what Mateo said?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit34.lesson01.exercise02.listen_mateo, type: listen_select, tested_text: "Mateo dice que llega tarde", media_asset_key: es.b1.audio.estilo_indirecto.mateo_tarde.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit34.lesson01.exercise03.match_mateo
            type: matching_pairs
            tested_text: "dice que llega tarde"
            prompt: {target_blocks: []}
            pairs: [{left: "dice", right: "says"}, {left: "que", right: "that"}, {left: "llega", right: "arrives"}, {left: "tarde", right: "late"}, {left: "Mateo dice que llega tarde", right: "Mateo says that he's arriving late"}]
          - {content_key: es.b1.unit34.lesson01.exercise04.order_mateo, type: word_order, tested_text: "Mateo dice que llega tarde", prompt: {target_blocks: []}, word_bank: [Mateo, dice, que, llega, tarde]}
          - {content_key: es.b1.unit34.lesson01.exercise05.translate_mateo, type: translation, tested_text: "Mateo dice que llega tarde", prompt: {target_blocks: [{text: "Translate to Spanish using \"dice que\": Mateo says that he's arriving late.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit34.lesson01.exercise06.dictation_mateo_tarde, type: dictation, tested_text: "Mateo dice que llega tarde", media_asset_key: es.b1.audio.estilo_indirecto.mateo_tarde.01, prompt: {target_blocks: []}}

      - content_key: es.b1.unit34.lesson02.pregunta_si
        title: "Pregunta si..."
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - content_key: es.b1.unit34.lesson02.teach.pregunta
            kind: vocabulary
            target: {text: "pregunta", language_code: es, direction: ltr}
            introduced_tokens: [pregunta]
            example: {text: "Elena pregunta si tengo la llave.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson02.teach.si
            kind: vocabulary
            target: {text: "si", language_code: es, direction: ltr}
            introduced_tokens: [si]
            example: {text: "Pregunta si tengo la llave.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson02.teach.tengo
            kind: vocabulary
            target: {text: "tengo", language_code: es, direction: ltr}
            introduced_tokens: [tengo]
            example: {text: "Tengo la llave.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson02.teach.la_llave
            kind: vocabulary
            target: {text: "la llave", language_code: es, direction: ltr}
            introduced_tokens: [la, llave]
            example: {text: "La llave está aquí.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson02.teach.reported_question
            kind: phrase
            target: {text: "Elena pregunta si tengo la llave.", language_code: es, direction: ltr}
            introduced_tokens: [Elena, pregunta, si, tengo, la, llave]
          - content_key: es.b1.unit34.lesson02.teach.si_note
            kind: grammar_note
            target: {text: "To report a yes/no question, use *pregunta si* + the reported sentence -- not *pregunta que si*.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit34.lesson02.exercise01.choose_elena, type: multiple_choice, tested_text: "Elena pregunta si tengo la llave", prompt: {target_blocks: [{text: "Which sentence reports the question Elena asked?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit34.lesson02.exercise02.listen_elena, type: listen_select, tested_text: "Elena pregunta si tengo la llave", media_asset_key: es.b1.audio.estilo_indirecto.elena_pregunta.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit34.lesson02.exercise03.match_elena
            type: matching_pairs
            tested_text: "pregunta si tengo llave"
            prompt: {target_blocks: []}
            pairs: [{left: "pregunta", right: "asks"}, {left: "si", right: "whether"}, {left: "tengo", right: "I have"}, {left: "la llave", right: "the key"}, {left: "Elena pregunta si tengo la llave", right: "Elena asks whether I have the key"}]
          - {content_key: es.b1.unit34.lesson02.exercise04.order_elena, type: word_order, tested_text: "Elena pregunta si tengo la llave", prompt: {target_blocks: []}, word_bank: [Elena, pregunta, si, tengo, la, llave]}
          - {content_key: es.b1.unit34.lesson02.exercise05.fill_si, type: fill_in_blank, tested_text: "Elena pregunta si tengo la llave", prompt: {target_blocks: [{text: "Elena pregunta ___ tengo la llave. (whether)", language_code: es, direction: ltr}]}}

      - content_key: es.b1.unit34.lesson03.dijo_que
        title: "Dijo que..."
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - content_key: es.b1.unit34.lesson03.teach.dijo
            kind: vocabulary
            target: {text: "dijo", language_code: es, direction: ltr}
            introduced_tokens: [dijo]
            example: {text: "Elena dijo que llegó tarde.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson03.teach.llego_past
            kind: vocabulary
            target: {text: "llegó", language_code: es, direction: ltr}
            introduced_tokens: [llegó, llego]
            example: {text: "Elena llegó tarde a la reunión.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson03.teach.a_la_reunion
            kind: vocabulary
            target: {text: "a la reunión", language_code: es, direction: ltr}
            introduced_tokens: [a, la, reunión, reunion]
            example: {text: "Llegó tarde a la reunión.", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson03.teach.past_reported_statement
            kind: phrase
            target: {text: "Elena dijo que llegó tarde a la reunión.", language_code: es, direction: ltr}
            introduced_tokens: [Elena, dijo, que, llegó, tarde, a, la, reunión]
          - content_key: es.b1.unit34.lesson03.teach.tense_note
            kind: grammar_note
            target: {text: "*Dijo que* reports a past statement. When the original words were already about the past (*Llegué tarde*), the reported verb stays in a past tense: *llegó*, or more formally *había llegado*.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit34.lesson03.exercise01.choose_dijo, type: multiple_choice, tested_text: "Elena dijo que llegó tarde a la reunión", prompt: {target_blocks: [{text: "Which sentence reports what Elena said about the meeting?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit34.lesson03.exercise02.listen_dijo, type: listen_select, tested_text: "Elena dijo que llegó tarde a la reunión", media_asset_key: es.b1.audio.estilo_indirecto.elena_dijo.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit34.lesson03.exercise03.match_dijo
            type: matching_pairs
            tested_text: "dijo llego reunion"
            prompt: {target_blocks: []}
            pairs: [{left: "dijo", right: "said"}, {left: "llegó", right: "arrived"}, {left: "a la reunión", right: "to the meeting"}, {left: "Elena dijo que llegó tarde", right: "Elena said that she arrived late"}, {left: "dice / dijo", right: "present / past reporting"}]
          - {content_key: es.b1.unit34.lesson03.exercise04.order_dijo, type: word_order, tested_text: "Elena dijo que llegó tarde a la reunión", prompt: {target_blocks: []}, word_bank: [Elena, dijo, que, llegó, tarde, a, la, reunión]}
          - {content_key: es.b1.unit34.lesson03.exercise05.translate_dijo, type: translation, tested_text: "Elena dijo que llegó tarde a la reunión", prompt: {target_blocks: [{text: "Translate to Spanish using \"dijo que\": Elena said that she arrived late to the meeting.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit34.lesson04.mensaje_de_mateo
        title: "El mensaje de Mateo"
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - content_key: es.b1.unit34.lesson04.teach.tienes
            kind: vocabulary
            target: {text: "tienes", language_code: es, direction: ltr}
            introduced_tokens: [tienes]
            example: {text: "¿Tienes la llave?", language_code: es, direction: ltr}
          - content_key: es.b1.unit34.lesson04.teach.original_message
            kind: dialogue
            target: {text: "Llego tarde. ¿Tienes la llave?", language_code: es, direction: ltr, speaker: Mateo}
            introduced_tokens: [Llego, tarde, Tienes, la, llave]
          - content_key: es.b1.unit34.lesson04.teach.reported_statement_2
            kind: phrase
            target: {text: "Mateo dice que llega tarde.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, dice, que, llega, tarde]
          - content_key: es.b1.unit34.lesson04.teach.reported_question_2
            kind: phrase
            target: {text: "Mateo pregunta si tengo la llave.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, pregunta, si, tengo, la, llave]
          - content_key: es.b1.unit34.lesson04.teach.full_report
            kind: reading
            target: {text: "Mateo dice que llega tarde. Mateo pregunta si tengo la llave.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, dice, que, llega, tarde, pregunta, si, tengo, la, llave]
        exercises:
          - {content_key: es.b1.unit34.lesson04.exercise01.choose_which_is_question, type: multiple_choice, tested_text: "Mateo pregunta si tengo la llave", prompt: {target_blocks: [{text: "Which sentence reports Mateo's question, not his statement?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit34.lesson04.exercise02.listen_full, type: listen_select, tested_text: "Mateo dice que llega tarde Mateo pregunta si tengo la llave", media_asset_key: es.b1.audio.estilo_indirecto.mensaje_completo.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit34.lesson04.exercise03.match_full_unit
            type: matching_pairs
            tested_text: "dice pregunta llega tengo llave"
            prompt: {target_blocks: []}
            pairs: [{left: "Mateo dice que llega tarde", right: "reports a statement"}, {left: "Mateo pregunta si tengo la llave", right: "reports a question"}, {left: "dice / pregunta", right: "reporting verbs"}, {left: "llega tarde", right: "the statement's content"}, {left: "tengo la llave", right: "the question's content"}]
          - {content_key: es.b1.unit34.lesson04.exercise04.order_question, type: word_order, tested_text: "Mateo pregunta si tengo la llave", prompt: {target_blocks: []}, word_bank: [Mateo, pregunta, si, tengo, la, llave]}
          - {content_key: es.b1.unit34.lesson04.exercise05.write_culminating_reported_speech, type: writing_prompt, tested_text: "Mateo dice que llega tarde Mateo pregunta si tengo la llave", prompt: {target_blocks: [{text: "Mateo texted you: \"Llego tarde. ¿Tienes la llave?\" Write two Spanish sentences reporting his message to a friend. Sentence 1 must report his STATEMENT using \"Mateo dice que...\". Sentence 2 must report his QUESTION using \"Mateo pregunta si...\".", language_code: en, direction: ltr}]}}
