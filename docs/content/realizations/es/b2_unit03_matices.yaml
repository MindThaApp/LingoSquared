generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    From-scratch generation, not adapted from a source. Continues es's
    B2 lane (unit01 argumentación, unit02 especulación); mirrors nl's
    shipped B2 unit03 (nuance) as the assigned structural exemplar
    (lesson arc, exercise-type pacing, spine-outcome sequencing) --
    every sentence of actual Spanish text is freshly authored, not
    translated from the Dutch. Elena and Mateo continue as the
    established es characters, reviewing a restaurant together; only
    lesson06's culminating dialogue names them. No sibling-direction
    file (es-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority
    checks: (1) lesson05's matching_pairs deliberately excludes "merece
    la pena" (taught in the reading but not quizzed) since it is a near-
    synonym of the quizzed "vale la pena" -- confirm this was the right
    call rather than teaching a false distinction; (2) confirm "no es
    que sea malo, sino que es caro" reads as natural spoken register
    (subjunctive after "no es que", indicative after "sino que"); (3)
    confirm "sí que" as an emphatic marker and the cleft "lo que más me
    gusta es..." read as idiomatic pan-Hispanic Spanish and not overly
    Iberian-specific -- flag if a form is regionally marked; (4) the
    culminating lesson06 exercise asks the learner to deliver the SAME
    underlying claim (the restaurant is good) once hedged and once
    emphasized, matching the spine outcome's modulate_a_statement
    requirement literally -- confirm the accepted-answer variants are
    complete.
  notes: >-
    Third Spanish B2 unit. Targets the CEFR B2 nuance outcome
    (universal.b2.discourse.express_nuance_with_hedging_and_emphasis):
    soften or strengthen a statement using hedging, qualification, and
    emphasis/focus constructions, delivering the same content
    tentatively, neutrally, or emphatically. Theme: reviewing a
    restaurant, El Rincón -- one everyday evaluative topic running
    across all six lessons. Lesson arc: L01 softening (un poco / algo /
    no está mal / más bien), L02 careful qualification (no es que...
    sino que... / hasta cierto punto / en cierto modo), L03 emphasis (sí
    que / de hecho / en realidad / sin duda), L04 focus/cleft
    constructions (lo que más me gusta es... / lo que pasa es que...),
    L05 a review reading combining hedge and emphasis, L06 the
    culminating production -- Elena and Mateo discuss the restaurant,
    and the exercises require delivering the SAME claim (the restaurant
    is good) once hedged and once emphasized, matching the spine
    outcome's literal assessment requirement. Register: informal tu
    throughout. All vocabulary continues the token pool established in
    unit01/unit02 (same course, cumulative per docs/content/CLAUDE.md).

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked realization + en-es overlay for unit03. Fixes:
    lesson05.exercise07.write_vale_la_pena accepts 'Sin duda merece la
    pena' (taught in the reading); lesson06.exercise05/06 modulate
    instructions pinned to the exact two sentences the key expects;
    lesson01.exercise03.match_hedge_words: algo/somewhat pair dropped
    (synonym of un poco) in pairs, tested_text and overlay value;
    lesson05.exercise06.translate_especial instruction pinned 'using
    realmente' (si que is also a valid rendering); lesson03.exercise03
    en realidad = 'in reality / actually';
    lesson01.teach.grammar_suavizar English title/gloss fixed ('more
    expensive than cheap, if anything'); claim_model notes
    (lesson01/02/03), grammar_foco and grammar_modular notes no longer
    describe course construction or cite lesson ids;
    lesson05.exercise01-04 reading_comprehension prompts now carry the
    Spanish passage as the first target_block. NATIVE FLAGS: merece
    gloss 'more formal' -- merece la pena is more Peninsular than more
    formal; 'El postre estaba muy delicioso' (muy + delicioso) is
    common but stylistically frowned on. DEFERRED: none.

    Language review 2026-10-24 (session 10): 3 fixes -- lesson03.teach.delicioso example 'El postre estaba muy
    delicioso' (muy + delicioso is stylistically poor) -> 'El postre estaba delicioso', with muy moved to the
    estaba example 'El ambiente estaba muy agradable'; lesson03.teach.grammar_enfatizar 'De hecho, en realidad
    todo el restaurante es excelente' stacked two connectives, now 'De hecho, todo el restaurante es
    excelente'; plus the English fixes in the overlay (reading gloss, merece/pena glosses, voy a card).
    Answers to the open native questions: (1) leaving 'merece la pena' out of the quizzed pairs was right, it
    is a plain synonym of 'vale la pena' and is not 'more formal' (it is common in Spain, 'vale la pena' is
    the pan-Hispanic default); (2) 'no es que sea malo, sino que es caro' is natural and correctly moded
    (subjunctive after no es que, indicative after sino que); (3) 'lo que más me gusta es...' is neutral
    pan-Hispanic; 'sí que' is understood everywhere but is Peninsular-leaning, Latin Americans more often say
    'sí estaba delicioso' or 'estaba buenísimo'; (4) lesson06 modulate variants are complete enough, the
    grader ignores boundary punctuation. Native flags: 'sí que' regional weight (taught as the unit's emphasis
    marker, left as authored).

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent). B2 nuance layers
    hedging and emphasis markers onto that register -- un poco, no está
    mal, sí que, de hecho, sin duda, lo que más me gusta es -- while
    keeping everyday informal address. Elena and Mateo continue the
    informal tu they use with each other throughout the es lane.

