  - content_key: es.b2.audio.matices.dialogo.restaurante.01
    language: es
    text: >-
      Elena: El restaurante es un poco caro, pero sin duda vale la
      pena. Mateo: ¿Tú crees? A mí me pareció caro. Elena: No es que
      sea barato, sino que la calidad es muy buena. Mateo: Es verdad,
      el postre sí que estaba delicioso. Elena: Lo que más me gustó
      fue el ambiente. Mateo: Tienes razón. De hecho, creo que voy a
      volver.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

