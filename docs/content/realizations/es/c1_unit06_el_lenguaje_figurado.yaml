generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1 unit 06, the sixth C1 unit in the
    es lane. Sourcing attempted: a firecrawl/web search for public-domain
    advanced/C1 Spanish idiom-and-figurative-language material returned no
    usable hits; the FSI Spanish Basic Course is public domain but capped at
    intermediate, and per AUTHORING_GUIDE 10 it cannot scaffold C1
    idiomatic/collocational content. No usable public-domain C1 Spanish
    source was found, so this is established-conventions-only authoring,
    built from general knowledge of pan-Hispanic everyday idioms,
    collocations, and metaphors. Unit05 (situaciones_irreales) was the
    assigned structural exemplar for pacing and exercise depth only -- every
    word of Spanish text is freshly authored, not translated from any other
    lane, and the scenario is unrelated to unit05's. Elena and Mateo
    continue as the established es characters (informal tu register: Elena
    is a Spanish teacher in London, Mateo is a Colombian accountant in
    London who works in an office -- profile set in b1_unit44 and a1_unit13,
    and re-confirmed in c1_unit01-05). Over coffee Elena tells Mateo about
    the English-speaking students in her class who keep translating English
    idioms word for word, and together they work through pan-Hispanic
    idioms, collocations, and metaphors and how to avoid literal calques.
    No sibling-direction file (es-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness and correct informal-tu register of every Elena/Mateo
    line and instruction, and that no vosotros/usted form slipped in; (2)
    that every idiom/collocation/metaphor is genuinely pan-Hispanic and
    current (none specific to a single country's slang), and that each
    English gloss in the overlay is the correct non-literal meaning; (3)
    that the calque traps are real: 'hacer una decisión' / 'hacer sentido'
    / 'pagar atención' are the wrong forms and 'tomar una decisión' /
    'tener sentido' / 'prestar atención' are the natural ones; (4) the
    lesson06 culminating speak answer contains two idiomatic expressions
    and the writing answer rewrites the three calques into the three
    natural collocations, with accepted-answer punctuation (trailing period
    vs none) covering what a correct learner would type; (5) the lesson05
    reading genuinely mixes an idiom, a collocation, and a metaphor, and no
    two exercises give the same expression a contradictory reading.
  notes: >-
    Sixth Spanish C1 unit. Targets the CEFR C1 idiom outcome
    (universal.c1.idiom.use_idiomatic_and_figurative_language): understand
    and use idiomatic, collocational, and figurative language naturally,
    choosing register-appropriate idioms and avoiding literal calques.
    Theme: one coherent situation across all six lessons -- Elena's
    English-speaking students keep translating English idioms literally
    (calques), and over coffee she and Mateo sort the idiomatic from the
    literal. Lesson arc mirrors the outcome's own assessment requirements:
    L01 the concept and core terms (el modismo, la colocacion, la metafora,
    el sentido figurado, el calco); L02 everyday idioms (echar una mano,
    dar en el clavo, no pegar ojo, costar un ojo de la cara, estar en las
    nubes, tirar la toalla); L03 natural collocations and their calque
    traps (tomar una decision, hacer una pregunta, dar un paseo, poner la
    mesa, tener sentido, prestar atencion); L04 everyday metaphors and
    figurative sense (estar entre la espada y la pared, ser pan comido,
    llover a cantaros, romper el hielo, tener un as bajo la manga, estar en
    la cresta de la ola); L05 reading a short anecdote that mixes an idiom,
    a collocation, and a metaphor and interpreting each; L06 the
    culminating production -- a listening exchange that distinguishes
    non-literal meaning, a speaking task that produces two idiomatic
    expressions, and a writing task that rewrites three literal calques as
    natural collocations, plus a dictation. Register: informal tu
    throughout the Elena/Mateo frame narration and instructions; the
    idioms and collocations are pan-Hispanic and sit naturally inside
    informal speech. All vocabulary is introduced self-contained within
    this file (C1 is a separate Course row from B1/B2, so a C1 learner
    never sees lower-tier lexemes at runtime); common words already
    introduced in c1_unit01-05 are reused per the cumulative-vocabulary
    rule.

    Second-pass review 2026-10-19: 5 fixes (realization side) --
    lesson05.exercise01-04.read_*: the Spanish passage added to
    prompt.target_blocks (the questions asked about a passage the learner
    never saw); lesson06.exercise06.write_reescritura: prompt printed each
    answer ('hacer una decisión -> tomar una decisión' etc.) -> calque
    plus English meaning only (mirrored in the overlay). NATIVE FLAGS:
    lesson06 dialogue 'Me costó un ojo de la cara' is used about the
    effort of preparing a presentation; the DLE sense is price ('ser muy
    caro'), so a native should confirm the extended effort reading or swap
    the line (it is also in the audio script and lesson06.exercise04 word
    order). 'Ayer no pegué ojo' (vs 'Anoche') also worth a native glance.

    Language review 2026-10-20 (native-level es/en editor pass): 1 fix
    (realization side) -- lesson06 Mateo line 'Me costo un ojo de la cara'
    used the idiom for effort; the idiom means price (flagged 2026-10-19)
    -> 'Y encima imprimirla me costo un ojo de la cara.'
    (teach.mateo_ojo_cara + audio intercambio.01; tokens Y, encima,
    imprimirla, me). lesson06.exercise04 word order 'Me costo un ojo de la
    cara' still matches. NATIVE FLAGS: 'Ayer no pegue ojo' (vs 'Anoche');
    lesson05 reading 'al final todo era pan comido' (preterite 'fue' is
    also natural).

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout for the lane's frame narration and instructions
    (es lane precedent from b1_unit27/29/33 and b2_unit01). Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2/C1 units. This unit is ABOUT idiomatic, collocational, and
    figurative language: it teaches a set of pan-Hispanic everyday idioms,
    collocations, and metaphors in their natural informal spoken register,
    plus the metalinguistic vocabulary (el modismo, la colocacion, la
    metafora, el calco) in an essayistic register -- distinct from the
    lane's default informal tu used in the Elena/Mateo frame dialogue and
    in instructions. The idioms are register-appropriate to informal
    speech and neutral pan-Hispanic, deliberately avoiding any
    single-country slang. No vosotros or usted.

