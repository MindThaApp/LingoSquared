      - content_key: es.a2.unit94.lesson05.los_veranos_de_elena
        title: "Los veranos de Elena"
        spine_outcome_id: universal.a2.past.describe_past_habits
        teaching:
          - {"content_key": "es.a2.unit94.lesson05.teach.palabras", "kind": "vocabulary", "target": {"text": "cuando, pasar, el verano, el tren, los abuelos, la abuela, el tomate, fría, feliz", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["cuando", "pasar", "el", "verano", "tren", "los", "abuelos", "la", "abuela", "tomate", "fría", "feliz", "era", "pequeña", "pasaba", "veranos", "con", "mis", "Íbamos", "al", "pueblo", "en", "Mi", "hacía", "pan", "Bebíamos", "leche"], "example": [{"text": "Cuando era pequeña, pasaba los veranos con mis abuelos.", "language_code": "es", "direction": "ltr"}, {"text": "Íbamos al pueblo en tren.", "language_code": "es", "direction": "ltr"}, {"text": "Mi abuela hacía pan.", "language_code": "es", "direction": "ltr"}, {"text": "Bebíamos leche fría.", "language_code": "es", "direction": "ltr"}]}
          - {"content_key": "es.a2.unit94.lesson05.teach.gn_cuando", "kind": "grammar_note", "target": {"text": "Cuando era pequeña, pasaba los veranos con mis abuelos.", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["Cuando", "era", "pequeña", "pasaba", "los", "veranos", "con", "mis", "abuelos"]}
          - {"content_key": "es.a2.unit94.lesson05.teach.gn_preguntar", "kind": "grammar_note", "target": {"text": "¿Qué hacías de niño? ¿Cómo eras de niña?", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["Qué", "hacías", "de", "niño", "Cómo", "eras", "niña"]}
          - {"content_key": "es.a2.unit94.lesson05.teach.lectura", "kind": "reading", "target": {"text": "Hola, Mateo. Cuando era pequeña, pasaba los veranos con mis abuelos. Cada verano íbamos al pueblo en tren. Mis abuelos vivían en una casa grande con un jardín. Por la mañana jugaba con mi perro y por la tarde ayudaba a mi abuela. Comíamos pan con tomate y bebíamos leche fría. Era muy feliz. ¿Y tú? ¿Qué hacías de niño?", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["Hola", "Mateo", "Cuando", "era", "pequeña", "pasaba", "los", "veranos", "con", "mis", "abuelos", "Cada", "verano", "íbamos", "al", "pueblo", "en", "tren", "vivían", "una", "casa", "grande", "un", "jardín", "Por", "la", "mañana", "jugaba", "mi", "perro", "y", "tarde", "ayudaba", "a", "abuela", "Comíamos", "pan", "tomate", "bebíamos", "leche", "fría", "muy", "feliz", "tú", "Qué", "hacías", "de", "niño"]}
        exercises:
          - {"content_key": "es.a2.unit94.lesson05.exercise01.lee_viaje", "type": "reading_comprehension", "tested_text": "íbamos al pueblo en tren", "prompt": {"target_blocks": [{"text": "How did Elena get to the village every summer?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit94.lesson05.exercise02.lee_perro", "type": "reading_comprehension", "tested_text": "Por la mañana jugaba con mi perro", "prompt": {"target_blocks": [{"text": "Who did Elena play with in the morning?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit94.lesson05.exercise03.une_mensaje", "type": "matching_pairs", "tested_text": "Cuando era pequeña pasaba los veranos íbamos al pueblo mis abuelos vivían jugaba con mi perro ayudaba a mi abuela bebíamos leche fría Era muy feliz", "prompt": {"target_blocks": []}, "pairs": [{"left": "Cuando era pequeña", "right": "When I was little"}, {"left": "pasaba los veranos", "right": "I used to spend the summers"}, {"left": "íbamos al pueblo", "right": "we used to go to the village"}, {"left": "mis abuelos vivían", "right": "my grandparents lived"}, {"left": "jugaba con mi perro", "right": "I used to play with my dog"}, {"left": "ayudaba a mi abuela", "right": "I used to help my grandmother"}, {"left": "bebíamos leche fría", "right": "we used to drink cold milk"}, {"left": "Era muy feliz.", "right": "I was very happy."}]}
          - {"content_key": "es.a2.unit94.lesson05.exercise04.ordena_tren", "type": "word_order", "tested_text": "Cada verano íbamos al pueblo en tren", "prompt": {"target_blocks": []}, "word_bank": ["Cada", "verano", "íbamos", "al", "pueblo", "en", "tren"]}
          - {"content_key": "es.a2.unit94.lesson05.exercise05.traduce_perro", "type": "translation", "tested_text": "Por la mañana jugaba con mi perro", "prompt": {"target_blocks": [{"text": "In the morning I used to play with my dog.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit94.lesson05.exercise06.dicta_abuelos", "type": "dictation", "tested_text": "Mis abuelos vivían en una casa grande.", "media_asset_key": "es.a2.audio.cuando_era_pequeno.abuelos_casa.01", "prompt": {"target_blocks": []}}
