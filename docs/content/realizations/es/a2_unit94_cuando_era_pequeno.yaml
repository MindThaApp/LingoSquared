      - content_key: es.a2.unit94.lesson06.como_eras_de_nina
        title: "¿Cómo eras de niña?"
        spine_outcome_id: universal.a2.past.describe_past_habits
        teaching:
          - {"content_key": "es.a2.unit94.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Elena, ¿cómo eras de niña?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Elena", "cómo", "eras", "de", "niña"]}
          - {"content_key": "es.a2.unit94.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Era muy feliz. Pasaba los veranos con mis abuelos en el pueblo.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Era", "muy", "feliz", "Pasaba", "los", "veranos", "con", "mis", "abuelos", "en", "el", "pueblo"]}
          - {"content_key": "es.a2.unit94.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "¿Qué hacías allí todos los días?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Qué", "hacías", "allí", "todos", "los", "días"]}
          - {"content_key": "es.a2.unit94.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Jugaba con mi perro y ayudaba a mi abuela. Por la tarde leía en el jardín.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Jugaba", "con", "mi", "perro", "y", "ayudaba", "a", "abuela", "Por", "la", "tarde", "leía", "en", "el", "jardín"]}
          - {"content_key": "es.a2.unit94.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "¡Qué bonito! ¿Y ahora? ¿Es diferente?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Qué", "bonito", "Y", "ahora", "Es", "diferente"]}
          - {"content_key": "es.a2.unit94.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Sí. Antes jugaba todos los días. Ahora tengo menos tiempo.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Sí", "Antes", "jugaba", "todos", "los", "días", "Ahora", "tengo", "menos", "tiempo"]}
        exercises:
          - {"content_key": "es.a2.unit94.lesson06.exercise01.escucha_respuesta", "type": "listen_select", "tested_text": "Era muy feliz Pasaba los veranos con mis abuelos en el pueblo", "media_asset_key": "es.a2.audio.dialogue.cuando_era_pequeno.01", "prompt": {"target_blocks": []}}
          - {"content_key": "es.a2.unit94.lesson06.exercise02.entiende_tarde", "type": "dialogue_comprehension", "tested_text": "leía en el jardín", "media_asset_key": "es.a2.audio.dialogue.cuando_era_pequeno.01", "prompt": {"target_blocks": [{"text": "What did Elena use to do in the afternoon?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit94.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Cómo eras de niña Era muy feliz Pasaba los veranos con mis abuelos Qué hacías allí todos los días Jugaba con mi perro Ayudaba a mi abuela Es diferente Ahora tengo menos tiempo", "prompt": {"target_blocks": []}, "pairs": [{"left": "¿Cómo eras de niña?", "right": "What were you like as a girl?"}, {"left": "Era muy feliz.", "right": "I was very happy."}, {"left": "Pasaba los veranos con mis abuelos.", "right": "I used to spend the summers with my grandparents."}, {"left": "¿Qué hacías allí todos los días?", "right": "What did you use to do there every day?"}, {"left": "Jugaba con mi perro.", "right": "I used to play with my dog."}, {"left": "Ayudaba a mi abuela.", "right": "I used to help my grandmother."}, {"left": "¿Es diferente?", "right": "Is it different?"}, {"left": "Ahora tengo menos tiempo.", "right": "Now I have less time."}]}
          - {"content_key": "es.a2.unit94.lesson06.exercise04.ordena_jardin", "type": "word_order", "tested_text": "Por la tarde leía en el jardín", "prompt": {"target_blocks": []}, "word_bank": ["Por", "la", "tarde", "leía", "en", "el", "jardín"]}
          - {"content_key": "es.a2.unit94.lesson06.exercise05.responde_hacias", "type": "dialogue_response", "tested_text": "Jugaba con mi perro", "prompt": {"target_blocks": [{"text": "¿Qué hacías allí todos los días?", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit94.lesson06.exercise06.traduce_ahora", "type": "translation", "tested_text": "Antes jugaba todos los días Ahora tengo menos tiempo", "prompt": {"target_blocks": [{"text": "Before, I used to play every day. Now I have less time.", "language_code": "en", "direction": "ltr"}]}}
