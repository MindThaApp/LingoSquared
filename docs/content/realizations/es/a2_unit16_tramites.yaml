      - content_key: es.a2.unit16.lesson05.leer_el_aviso
        title: "Leer el aviso de la oficina"
        spine_outcome_id: universal.a2.bureaucracy.register_with_authorities
        teaching:
          - content_key: es.a2.unit16.lesson05.teach.aviso_reading
            kind: reading
            target:
