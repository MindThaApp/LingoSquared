generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The core A2 grammar step-up used across this unit -- the conditional
    as a politeness softener (quisiera, ¿podría...?) and the impersonal
    "es necesario/importante que" + subjunctive construction -- is
    scaffolded from the real, public-domain FSI Spanish Basic Course
    (Foreign Service Institute, 1961+ revisions, US government work),
    Volume 4 (Units 46-55): §48.16 "The conditional tense" explicitly
    presents this exact function ("¿Podría Ud. ayudarnos?" = 'Could you
    help us?', explained as softening a request compared to the plain
    present) and drill items at lines ~12721-12724 present "¿Es
    necesario que llegue un poco temprano? Sí, es necesario que...";
    "¿Es importante que lo sepa? Sí, es importante que..." as the
    impersonal-expression-plus-subjunctive pattern -- downloaded
    directly (firecrawl confirmed at 0/1000 credits via `firecrawl
    --status`, so this used the documented WebSearch + direct-download +
    `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%204/FSI%20-%20Spanish%20Basic%20Course%20-%20Volume%204%20-%20Student%20Text.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. Only the
    grammar POINTS themselves (conditional-as-softener, impersonal +
    subjunctive) are reused, not any scenario, drill sentence, or
    vocabulary set, all of which are freshly written for a bureaucracy/
    registration scenario (the FSI drills that happen to illustrate
    these patterns are about unrelated topics -- studying, punctuality,
    reading an article). The specific vocabulary (el trámite,
    registrarse, el comprobante de domicilio) reflects 2020s civic
    administration and has no FSI equivalent (1960s diplomatic-office
    material has no direct analogue for this scenario).
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    First Spanish A2 unit (spine outcome:
    universal.a2.bureaucracy.register_with_authorities, no es A1 unit
    yet covers this since it's A2-only on the spine), continuing the
    Elena/Mateo storyline directly from unit14's apartment move: Mateo
    now needs to register his new address with the local registration
    office. A2-level complexity deliberately exceeds A1: the conditional
    as a politeness softener (quisiera, ¿podría...?), impersonal
    "es necesario/importante que" + present subjunctive, and a
    duration-since construction (vivo aquí desde el mes pasado) reused
    from the FSI Volume 4 grammar drills cited above. Authored fresh at
    schema_version 1.1 per AUTHORING_GUIDE §19. tú register continues
    between Elena and Mateo; usted (formal) is used with the
    registration-office official throughout, per this unit's own
    register_policy below.

    Six lessons, recognition->drag->production (§2): 01 teaches
    appointment-making vocabulary and the polite "quisiera" request; 02
    teaches the documents-needed vocabulary and question; 03 is the
    at-the-office formal exchange (¿podría ayudarme?, desde cuándo vive
    aquí); 04 teaches the impersonal-plus-subjunctive requirement
    pattern; 05 is a reading of an official registration notice; 06 is a
    dialogue capstone of Mateo's actual registration appointment.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    quisiera/podría for true-synonym risk -- they serve different
    grammatical roles (quisiera = "I would like," a 1st-person softened
    want; podría = "could," a 2nd-person softened request/ability), not
    interchangeable, and every slot testing one is anchored by the
    sentence's own subject/addressee. §16: lesson02's matching_pairs
    pools forward (documents vocab plus lesson01's appointment vocab, 7
    pairs); lesson04's pools the full unit's vocabulary so far (7
    pairs). §12: multi-clause accepted_answers (lesson06's summary
    lines) have period/comma/conjunction-joined variants. No bare
    yes/no/true/false -- checked by hand.

    Internal consistency (§11): "vivo aquí desde el mes pasado" (lesson03
    teaching example and lesson06 dialogue) matches unit14's own move-in
    timeline (Mateo moved into the new apartment at the end of unit14)
    without contradiction -- "last month" is consistent with unit14
    being set a short time before this unit. Mateo's already-established
    facts (Colombia-born, London-resident, accountant) are never
    touched or contradicted; this unit only adds his new address's
    registration status.

    Listening-integrity check (per the standing footgun on
    listen_select/dialogue_response distractors): lesson06's
    dialogue_comprehension exercises test facts via English answer
    options drawn from what happened, not literal same-speaker quote
    picks, so the same-speaker-distractor collision bug class does not
    apply here.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grammar notes, accepted-answer coverage, prompt
    determinacy, learner-visible internal ids and character
    continuity for this unit and its en-es overlay. Fixes in this
    file: lesson01.teach.quisiera_note no longer calls quisiera the
    conditional (it is the past subjunctive used like a conditional
    to soften requests); lesson05.teach.haga_note no longer claims a
    shared -a ending for haga/traiga/llegue (now explains -er/-ir ->
    -a, -ar -> -e). Overlay-side fixes listed in the en-es overlay
    note. DEFERRED: none for this unit. NATIVE FLAGS:
    lesson03.teach.desde_cuando_vive gloss "Since when do you live
    at this address?" and its matching right "Since when do you live
    here?" read as a calque ("How long have you lived...?" is
    natural English) -- style only;
    lesson01.exercise03.match_cita_vocab rights "to register
    (oneself)" vs "to register myself" are near-identical,
    borderline confusable.

    Second-pass review 2026-10-19: 4 fixes in this file --
    lesson05.exercise01-04 (reading_comprehension): the notice text was
    never shown in the exercise; added it as the first
    prompt.target_block (es) before the question. Overlay-side fixes
    listed in the en-es overlay note.

course:
  realization_key: es.a2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Continues Elena and Mateo's established tú register with each
    other. This unit introduces the first sustained formal exchange in
    the course: Mateo and the registration-office official (funcionario)
    use usted throughout, since an official appointment calls for
    formal register -- distinct from, and never mixed with, the
    informal tú Elena and Mateo use in the surrounding storyline.

