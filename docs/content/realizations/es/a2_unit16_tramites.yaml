        title: "En la oficina"
        spine_outcome_id: universal.a2.bureaucracy.register_with_authorities
        teaching:
          - {content_key: es.a2.unit16.lesson03.teach.podria_ayudarme, kind: phrase, target: {text: "¿Podría ayudarme, por favor?", language_code: es, direction: ltr}, introduced_tokens: [Podría, ayudarme, por, favor]}
