          - {content_key: es.a2.unit16.lesson01.exercise04.order_quisiera_cita, type: word_order, tested_text: "Quisiera hacer una cita para registrarme", prompt: {target_blocks: []}, word_bank: [Quisiera, hacer, una, cita, para, registrarme]}
