        spine_outcome_id: universal.a2.bureaucracy.register_with_authorities
        teaching:
          - {content_key: es.a2.unit16.lesson04.teach.es_necesario_pasaporte, kind: phrase, target: {text: "Es necesario que traiga su pasaporte.", language_code: es, direction: ltr}, introduced_tokens: [Es, necesario, que, traiga, su, pasaporte]}
