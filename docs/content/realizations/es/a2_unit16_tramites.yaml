          - {content_key: es.a2.unit16.lesson04.exercise05.fill_es_importante_llegar, type: fill_in_blank, tested_text: "Es importante que llegue a tiempo", prompt: {target_blocks: [{text: "Es importante que ___ a tiempo. (you arrive)", language_code: es, direction: ltr}]}}
