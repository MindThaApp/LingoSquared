          - content_key: es.a2.unit16.lesson03.teach.podria_note
            kind: grammar_note
            target: {text: "*¿Podría...?* (Could you...?) is the conditional of *poder* (can/to be able), used to soften a request -- more polite than *¿Puede ayudarme?*, the same way *quisiera* softens *quiero*.", language_code: en, direction: ltr}
