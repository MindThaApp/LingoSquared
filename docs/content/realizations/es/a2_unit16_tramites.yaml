          - content_key: es.a2.unit16.lesson01.teach.quisiera_note
            kind: grammar_note
            target: {text: "*Quisiera* (I would like) is a special polite form of *querer* (to want) -- technically the past subjunctive, but used like a conditional to soften a request. It is softer than *quiero*, the natural way to open a formal request.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit16.lesson01.exercise01.choose_quisiera_cita, type: multiple_choice, tested_text: "Quisiera hacer una cita para registrarme", prompt: {target_blocks: [{text: "I would like to make an appointment to register.", language_code: en, direction: ltr}]}}
