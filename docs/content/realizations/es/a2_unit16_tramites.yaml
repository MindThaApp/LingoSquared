  - content_key: es.a2.audio.tramites.aviso.01
    language: es
    text: >-
      Para registrarse en la oficina, es necesario traer los siguientes
      documentos: un pasaporte válido, su contrato de alquiler y, si
      corresponde, un comprobante de domicilio. Haga una cita antes de
      venir. Es importante llegar a tiempo. Después de registrarse,
      recibirá su número de registro por correo en unos días.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.a2.audio.dialogue.tramites_cita.01
    language: es
    text: >-
      Funcionario: Buenos días, ¿en qué puedo ayudarle? Mateo: Buenos
      días. Tengo una cita para registrarme en mi nueva dirección.
      Funcionario: Muy bien. ¿Podría mostrarme su pasaporte y su
      contrato de alquiler, por favor? Mateo: Aquí tiene. Vivo aquí
      desde el mes pasado. Funcionario: Perfecto, todo está en orden.
      Es necesario que firme aquí. Mateo: Listo. ¿Cuándo recibiré mi
      número de registro? Funcionario: Lo recibirá por correo en unos
      días. Gracias por su paciencia. Mateo: Gracias a usted por su
      ayuda.
    voice_hint: two_adults_formal_polite
    status: pending_generation
  - {content_key: es.a2.audio.tramites.dialogue.gracias_ayuda.01, language: es, text: "Gracias a usted por su ayuda.", voice_hint: neutral_young_adult_polite, status: pending_generation}

