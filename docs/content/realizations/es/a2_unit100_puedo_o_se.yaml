          - {"content_key": "es.a2.unit100.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Vale, no hay problema. El jueves a las seis, entonces.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Vale", "no", "hay", "problema", "El", "jueves", "a", "las", "seis", "entonces"]}
