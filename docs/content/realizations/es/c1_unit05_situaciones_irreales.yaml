generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1 unit 05, the fifth C1 unit in the
    es lane. Sourcing attempted: a firecrawl search for public-domain
    advanced/C1 Spanish counterfactual-conditional material returned only
    commercial and non-public-domain hits (YouTube, Elon.io, Kwiziq, Varsity
    Tutors, DICENDI) plus the FSI Spanish Basic Course (verified public
    domain, but capped at intermediate -- per AUTHORING_GUIDE 10 it cannot
    scaffold C1 counterfactual content). No usable public-domain C1 Spanish
    source was found, so this is established-conventions-only authoring,
    built from general knowledge of Spanish counterfactual-conditional and
    regret conventions, using unit04 (conceder_y_sopesar) as the assigned
    structural exemplar for pacing and exercise depth only -- every word of
    Spanish text is freshly authored, not translated from any other lane,
    and the scenario is unrelated to unit04's. Elena and Mateo continue as
    the established es characters (informal tu register: Elena is a Spanish
    teacher in London, Mateo is a Colombian accountant in London who works
    in an office -- profile set in b1_unit44 and earlier); over coffee they
    reason through the counterfactual of a past decision: years ago Mateo
    was offered a transfer to his company's Barcelona office and turned it
    down, and now he works out how his present would be different and what
    he regrets. No sibling-direction file (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness and correct informal-tu register of the Elena/Mateo
    frame narration and every sentence, and that no vosotros/usted form
    slipped in; (2) that the counterfactual mood sequence is correct
    throughout: si + hubiera/hubieras + participio (pluperfect subjunctive)
    for the past unreal condition, habria/habrías + participio (conditional
    perfect) for the past hypothetical consequence, and ahora + conditional
    simple (estaría/viviría/tendría) for the mixed present consequence;
    (3) the regret forms (Ojalá + hubiera, Me arrepiento de + haber,
    Si hubiera sabido) are idiomatic pan-Hispanic Spanish and genuinely
    express regret, not its absence; (4) the lesson06 culminating writing
    answer contains all three required moves -- a past counterfactual, a
    mixed conditional with a present consequence, and an expression of
    regret -- and its accepted-answer punctuation variants (trailing period
    vs none) cover what a correct learner would type; (5) the lesson05
    reading genuinely separates fact, regret, and hypothetical result, and
    no two exercises give the same passage detail a contradictory
    characterization.
  notes: >-
    Fifth Spanish C1 unit. Targets the CEFR C1 hypothesis outcome
    (universal.c1.hypothesis.reason_about_counterfactuals): reason about
    unreal and counterfactual situations -- mixed conditionals, hypothetical
    consequences, and regrets -- describing how things could or would have
    been different. Theme: one coherent situation across all six lessons --
    over coffee, Mateo revisits the biggest fork in his life: years ago his
    company offered him a transfer to the Barcelona office and he turned it
    down to stay in London; now he and Elena reason through what would have
    happened, how his present would be different, and what he regrets.
    Lesson arc mirrors the outcome's own assessment requirements: L01 the
    concept and core terms (el contrafactual, la hipotesis, el pasado
    irreal, la consecuencia, el arrepentimiento, el condicional compuesto);
    L02 the past counterfactual (si + hubiera + participio, habria +
    participio); L03 the mixed conditional (si + hubiera + participio,
    ahora + condicional simple); L04 regret (ojala + hubiera, me arrepiento
    de + haber, si hubiera sabido); L05 reading a counterfactual chain and
    separating fact, regret, and hypothetical result; L06 the culminating
    production -- a listening exchange that distinguishes the moves, a
    speaking task that produces a mixed counterfactual, and a writing task
    that produces a past counterfactual + mixed conditional + regret, in
    that order, plus a dictation. Register: informal tu throughout the
    Elena/Mateo frame narration and instructions; the counterfactual
    grammar itself is register-neutral and used in Mateo's informal voice.
    All vocabulary is introduced self-contained within this file (C1 is a
    separate Course row from B1/B2, so a C1 learner never sees lower-tier
    lexemes at runtime); common words already introduced in
    c1_unit01/c1_unit02/c1_unit03/c1_unit04 are reused per the
    cumulative-vocabulary rule.

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout for the lane's frame narration and instructions
    (es lane precedent from b1_unit27/29/33 and b2_unit01). Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2/C1 units. The counterfactual grammar this unit teaches (si +
    hubiera/hubieras + participio, habria/habrías + participio, ojala +
    hubiera, me arrepiento de + haber) is register-neutral and sits
    naturally inside informal speech: Mateo's tu-form hubieras/habrías in
    the dialogue, and the first-person me arrepiento / ojala hubiera, are
    the informal-register forms the learner must recognize and produce. No
    vosotros or usted.

