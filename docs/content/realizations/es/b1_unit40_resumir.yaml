schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Authored fresh: a short source passage (Elena's weekend, with detail)
    paired with a condensed main-points-only summary using the signal
    phrase "en resumen". No other language unit was consulted.
review:
  status: reviewed
  required_next_reviewer: codex
  notes: >-
    Realizes universal.b1.communication.summarize_and_retell literally:
    learners read a short source passage (lesson01), then produce a
    condensed, ordered summary that keeps the main points and drops
    supporting detail (lessons02-04), distinguishing main points from
    detail throughout (lesson03/04 exercises explicitly test which detail
    was dropped and which point was kept). Character canon checked on
    disk and preserved (grep of a1_unit13_work.yaml, b1_unit27/29/33/
    35/36/37/38/39): Elena is a Spanish teacher living in London; Mateo
    is a Colombian accountant living in London; tú register between them
    as established peers. No new facts contradicted. The culminating
    exercise (lesson04) requires a single written summary of the full
    source passage, condensed to exactly the two main points in order,
    using the signal phrase "en resumen".

    Second-pass review 2026-10-19: 2 fixes -- lesson01.exercise05.read_which_is_detail: the passage was not in prompt.target_blocks, so the learner never saw the text being asked about -> added it; lesson04.exercise05.write_culminating_resumen: prompt no longer ends with 'Use exactly: <answer>' (now names the two-sentence structure).
course:
  realization_key: es.b1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Elena and Mateo use tú as established peers (informal register),
    matching the precedent set across b1_unit27/29/33/35/36/37/38/39.
media_assets:
  - {content_key: es.b1.audio.resumir.pasaje_completo.01, language: es, text: "El sábado fui al mercado, compré fruta, pan y queso, y después visité a mi hermana. Hablamos de su nuevo trabajo durante dos horas.", voice_hint: neutral_adult_narrative, status: pending_generation}
  - {content_key: es.b1.audio.resumir.en_resumen_mercado.01, language: es, text: "En resumen, fui al mercado y visité a mi hermana.", voice_hint: neutral_adult_narrative, status: pending_generation}
  - {content_key: es.b1.audio.resumir.hablamos_trabajo.01, language: es, text: "Hablamos de su nuevo trabajo.", voice_hint: neutral_adult_narrative, status: pending_generation}
  - {content_key: es.b1.audio.resumir.resumen_completo.01, language: es, text: "En resumen, fui al mercado y visité a mi hermana. Hablamos de su nuevo trabajo.", voice_hint: neutral_adult_narrative, status: pending_generation}
units:
  - content_key: es.b1.unit40.resumir
    title: "Resumir y contar"
    section: speaking
    spine_outcome_ids: [universal.b1.communication.summarize_and_retell]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit40.lesson01.el_pasaje
        title: "El pasaje"
        spine_outcome_id: universal.b1.communication.summarize_and_retell
        teaching:
          - content_key: es.b1.unit40.lesson01.teach.fui_al_mercado
            kind: vocabulary
            target: {text: "fui al mercado", language_code: es, direction: ltr}
            introduced_tokens: [fui, al, mercado]
            example: {text: "El sábado fui al mercado." , language_code: es, direction: ltr}
          - content_key: es.b1.unit40.lesson01.teach.compre_fruta
            kind: vocabulary
            target: {text: "compré fruta, pan y queso", language_code: es, direction: ltr}
            introduced_tokens: [compré, fruta, pan, y, queso]
            example: {text: "Compré fruta y pan." , language_code: es, direction: ltr}
          - content_key: es.b1.unit40.lesson01.teach.visite_hermana
            kind: vocabulary
            target: {text: "visité a mi hermana", language_code: es, direction: ltr}
            introduced_tokens: [visité, a, mi, hermana]
            example: {text: "El domingo visité a mi hermana." , language_code: es, direction: ltr}
          - content_key: es.b1.unit40.lesson01.teach.pasaje_completo
            kind: reading
            target: {text: "El sábado fui al mercado, compré fruta, pan y queso, y después visité a mi hermana. Hablamos de su nuevo trabajo durante dos horas.", language_code: es, direction: ltr}
            introduced_tokens: [El, sábado, fui, al, mercado, compré, fruta, pan, y, queso, después, visité, a, mi, hermana, Hablamos, de, su, nuevo, trabajo, durante, dos, horas]
        exercises:
          - {content_key: es.b1.unit40.lesson01.exercise01.choose_market, type: multiple_choice, tested_text: "fui al mercado compré fruta pan y queso", prompt: {target_blocks: [{text: "Which phrase means \"I went to the market, I bought fruit, bread, and cheese\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit40.lesson01.exercise02.listen_pasaje, type: listen_select, tested_text: "El sábado fui al mercado compré fruta pan y queso y después visité a mi hermana Hablamos de su nuevo trabajo durante dos horas", media_asset_key: es.b1.audio.resumir.pasaje_completo.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit40.lesson01.exercise03.match_pasaje
            type: matching_pairs
            tested_text: "fui mercado compré fruta visité hermana"
            prompt: {target_blocks: []}
            pairs: [{left: "fui al mercado", right: "I went to the market"}, {left: "compré fruta, pan y queso", right: "I bought fruit, bread, and cheese"}, {left: "visité a mi hermana", right: "I visited my sister"}, {left: "durante dos horas", right: "for two hours"}, {left: "El sábado fui al mercado", right: "on Saturday I went to the market"}]
          - {content_key: es.b1.unit40.lesson01.exercise04.order_market, type: word_order, tested_text: "fui al mercado compré fruta pan y queso", prompt: {target_blocks: []}, word_bank: [fui, al, mercado, compré, fruta, pan, y, queso]}
          - {content_key: es.b1.unit40.lesson01.exercise05.read_which_is_detail, type: reading_comprehension, tested_text: "fruta pan y queso durante dos horas", prompt: {target_blocks: [{text: "El sábado fui al mercado, compré fruta, pan y queso, y después visité a mi hermana. Hablamos de su nuevo trabajo durante dos horas.", language_code: es, direction: ltr}, {text: "In the passage, which words are supporting DETAIL rather than a main point: what specifically the speaker bought, or that the speaker visited their sister?", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit40.lesson02.en_resumen_mercado
        title: "En resumen..."
        spine_outcome_id: universal.b1.communication.summarize_and_retell
        teaching:
          - content_key: es.b1.unit40.lesson02.teach.en_resumen
            kind: vocabulary
            target: {text: "en resumen", language_code: es, direction: ltr}
            introduced_tokens: [en, resumen]
            example: {text: "En resumen, tuve un buen fin de semana." , language_code: es, direction: ltr}
          - content_key: es.b1.unit40.lesson02.teach.main_point_note
            kind: grammar_note
            target: {text: "A summary keeps only the main points -- who did what -- and drops supporting detail like exact items or how long something took.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.b1.unit40.lesson02.teach.summary_sentence_one
            kind: phrase
            target: {text: "En resumen, fui al mercado y visité a mi hermana.", language_code: es, direction: ltr}
            introduced_tokens: [En, resumen, fui, al, mercado, y, visité, a, mi, hermana]
        exercises:
          - {content_key: es.b1.unit40.lesson02.exercise01.choose_summary_one, type: multiple_choice, tested_text: "En resumen fui al mercado y visité a mi hermana", prompt: {target_blocks: [{text: "Which sentence is the condensed summary of \"I went to the market, bought fruit, bread, and cheese, and then visited my sister\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit40.lesson02.exercise02.listen_summary_one, type: listen_select, tested_text: "En resumen fui al mercado y visité a mi hermana", media_asset_key: es.b1.audio.resumir.en_resumen_mercado.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit40.lesson02.exercise03.match_summary_one
            type: matching_pairs
            tested_text: "en resumen fui mercado visité hermana"
            prompt: {target_blocks: []}
            pairs: [{left: "en resumen", right: "in summary"}, {left: "fui al mercado", right: "I went to the market"}, {left: "visité a mi hermana", right: "I visited my sister"}, {left: "y", right: "and"}, {left: "En resumen, fui al mercado y visité a mi hermana", right: "in summary, I went to the market and visited my sister"}]
          - {content_key: es.b1.unit40.lesson02.exercise04.order_summary_one, type: word_order, tested_text: "En resumen fui al mercado y visité a mi hermana", prompt: {target_blocks: []}, word_bank: [En, resumen, fui, al, mercado, y, visité, a, mi, hermana]}
          - {content_key: es.b1.unit40.lesson02.exercise05.translate_summary_one, type: translation, tested_text: "En resumen fui al mercado y visité a mi hermana", prompt: {target_blocks: [{text: "Translate to Spanish, summarizing the main points in condensed form: In summary, I went to the market and visited my sister.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit40.lesson03.hablamos_trabajo
        title: "Hablamos de su trabajo"
        spine_outcome_id: universal.b1.communication.summarize_and_retell
        teaching:
          - content_key: es.b1.unit40.lesson03.teach.hablamos_de
            kind: vocabulary
            target: {text: "hablamos de", language_code: es, direction: ltr}
            introduced_tokens: [hablamos, de]
            example: {text: "Hablamos de la reunión." , language_code: es, direction: ltr}
          - content_key: es.b1.unit40.lesson03.teach.su_nuevo_trabajo
            kind: vocabulary
            target: {text: "su nuevo trabajo", language_code: es, direction: ltr}
            introduced_tokens: [su, nuevo, trabajo]
            example: {text: "Me gusta su nuevo trabajo." , language_code: es, direction: ltr}
          - content_key: es.b1.unit40.lesson03.teach.drop_detail_note
            kind: grammar_note
            target: {text: "The summary keeps \"we talked about her new job\" but drops \"for two hours\" -- how long is supporting detail, not a main point.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.b1.unit40.lesson03.teach.summary_sentence_two
            kind: phrase
            target: {text: "Hablamos de su nuevo trabajo.", language_code: es, direction: ltr}
            introduced_tokens: [Hablamos, de, su, nuevo, trabajo]
        exercises:
          - {content_key: es.b1.unit40.lesson03.exercise01.choose_summary_two, type: multiple_choice, tested_text: "Hablamos de su nuevo trabajo", prompt: {target_blocks: [{text: "Which sentence keeps the main point (what they talked about) while dropping the detail of how long it lasted?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit40.lesson03.exercise02.listen_summary_two, type: listen_select, tested_text: "Hablamos de su nuevo trabajo", media_asset_key: es.b1.audio.resumir.hablamos_trabajo.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit40.lesson03.exercise03.match_summary_two
            type: matching_pairs
            tested_text: "hablamos su nuevo trabajo"
            prompt: {target_blocks: []}
            pairs: [{left: "hablamos de", right: "we talked about"}, {left: "su nuevo trabajo", right: "her new job"}, {left: "durante dos horas", right: "the dropped detail"}, {left: "Hablamos de su nuevo trabajo", right: "we talked about her new job"}, {left: "trabajo", right: "job"}]
          - {content_key: es.b1.unit40.lesson03.exercise04.order_summary_two, type: word_order, tested_text: "Hablamos de su nuevo trabajo", prompt: {target_blocks: []}, word_bank: [Hablamos, de, su, nuevo, trabajo]}
          - {content_key: es.b1.unit40.lesson03.exercise05.fill_hablamos, type: fill_in_blank, tested_text: "Hablamos de su nuevo trabajo", prompt: {target_blocks: [{text: "___ de su nuevo trabajo. (we talked)", language_code: es, direction: ltr}]}}
          - {content_key: es.b1.unit40.lesson03.exercise06.dictation_hablamos_trabajo, type: dictation, tested_text: "Hablamos de su nuevo trabajo", media_asset_key: es.b1.audio.resumir.hablamos_trabajo.01, prompt: {target_blocks: []}}

      - content_key: es.b1.unit40.lesson04.el_resumen_completo
        title: "El resumen completo"
        spine_outcome_id: universal.b1.communication.summarize_and_retell
        teaching:
          - content_key: es.b1.unit40.lesson04.teach.pasaje_recall
            kind: reading
            target: {text: "El sábado fui al mercado, compré fruta, pan y queso, y después visité a mi hermana. Hablamos de su nuevo trabajo durante dos horas.", language_code: es, direction: ltr}
            introduced_tokens: [El, sábado, fui, al, mercado, compré, fruta, pan, y, queso, después, visité, a, mi, hermana, Hablamos, de, su, nuevo, trabajo, durante, dos, horas]
          - content_key: es.b1.unit40.lesson04.teach.summary_one_recall
            kind: phrase
            target: {text: "En resumen, fui al mercado y visité a mi hermana.", language_code: es, direction: ltr}
            introduced_tokens: [En, resumen, fui, al, mercado, y, visité, a, mi, hermana]
          - content_key: es.b1.unit40.lesson04.teach.summary_two_recall
            kind: phrase
            target: {text: "Hablamos de su nuevo trabajo.", language_code: es, direction: ltr}
            introduced_tokens: [Hablamos, de, su, nuevo, trabajo]
          - content_key: es.b1.unit40.lesson04.teach.full_summary
            kind: reading
            target: {text: "En resumen, fui al mercado y visité a mi hermana. Hablamos de su nuevo trabajo.", language_code: es, direction: ltr}
            introduced_tokens: [En, resumen, fui, al, mercado, y, visité, a, mi, hermana, Hablamos, de, su, nuevo, trabajo]
        exercises:
          - {content_key: es.b1.unit40.lesson04.exercise01.choose_which_summary, type: multiple_choice, tested_text: "En resumen fui al mercado y visité a mi hermana Hablamos de su nuevo trabajo", prompt: {target_blocks: [{text: "Which version correctly summarizes the passage, keeping only the main points in order?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit40.lesson04.exercise02.listen_full, type: listen_select, tested_text: "En resumen fui al mercado y visité a mi hermana Hablamos de su nuevo trabajo", media_asset_key: es.b1.audio.resumir.resumen_completo.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit40.lesson04.exercise03.match_full_unit
            type: matching_pairs
            tested_text: "en resumen mercado hermana hablamos trabajo"
            prompt: {target_blocks: []}
            pairs: [{left: "En resumen, fui al mercado y visité a mi hermana", right: "the first main point, condensed"}, {left: "Hablamos de su nuevo trabajo", right: "the second main point, condensed"}, {left: "fruta, pan y queso", right: "detail dropped from the summary"}, {left: "durante dos horas", right: "detail dropped from the summary"}, {left: "en resumen", right: "the summary signal phrase"}]
          - {content_key: es.b1.unit40.lesson04.exercise04.order_summary_two_2, type: word_order, tested_text: "Hablamos de su nuevo trabajo", prompt: {target_blocks: []}, word_bank: [Hablamos, de, su, nuevo, trabajo]}
          - {content_key: es.b1.unit40.lesson04.exercise05.write_culminating_resumen, type: writing_prompt, tested_text: "En resumen fui al mercado y visité a mi hermana Hablamos de su nuevo trabajo", prompt: {target_blocks: [{text: "Write a condensed, ordered summary in Spanish of this passage: \"El sábado fui al mercado, compré fruta, pan y queso, y después visité a mi hermana. Hablamos de su nuevo trabajo durante dos horas.\" Keep only the main points and drop the supporting detail (what was bought, how long). Write two sentences: start the first with the signal phrase \"En resumen,\" and say where you went and whom you visited; in the second, say what you talked about.", language_code: en, direction: ltr}]}}
