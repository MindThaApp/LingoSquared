          - content_key: es.b1.unit38.lesson02.teach.hubiera_hablado
            kind: vocabulary
            target: {text: "hubiera hablado", language_code: es, direction: ltr}
            introduced_tokens: [hubiera, hablado]
            example: {text: "Ojalá hubiera hablado antes." , language_code: es, direction: ltr}
          - content_key: es.b1.unit38.lesson02.teach.mi_jefe
            kind: vocabulary
