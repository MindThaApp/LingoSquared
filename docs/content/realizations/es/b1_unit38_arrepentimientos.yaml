            target: {text: "Ojalá hubiera hablado con mi jefe antes.", language_code: es, direction: ltr}
            introduced_tokens: [Ojalá, hubiera, hablado, con, mi, jefe, antes]
          - content_key: es.b1.unit38.lesson04.teach.alternative_recall
            kind: phrase
            target: {text: "Si hubiera pedido ayuda, habría sido más fácil.", language_code: es, direction: ltr}
            introduced_tokens: [Si, hubiera, pedido, ayuda, habría, sido, más, fácil]
