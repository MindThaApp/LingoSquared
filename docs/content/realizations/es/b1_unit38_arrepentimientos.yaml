            kind: reading
            target: {text: "Debería haber estudiado más para el examen. Ojalá hubiera hablado con mi jefe antes. Si hubiera pedido ayuda, habría sido más fácil.", language_code: es, direction: ltr}
            introduced_tokens: [Debería, haber, estudiado, más, para, el, examen, Ojalá, hubiera, hablado, con, mi, jefe, antes, Si, pedido, ayuda, habría, sido, fácil]
        exercises:
