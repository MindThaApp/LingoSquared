            example: {text: "Mi jefe está ocupado." , language_code: es, direction: ltr}
          - content_key: es.b1.unit38.lesson02.teach.antes
            kind: vocabulary
            target: {text: "antes", language_code: es, direction: ltr}
            introduced_tokens: [antes]
            example: {text: "Llegué antes de las nueve." , language_code: es, direction: ltr}
