          - {content_key: es.b1.unit38.lesson04.exercise02.listen_full, type: listen_select, tested_text: "Debería haber estudiado más para el examen Ojalá hubiera hablado con mi jefe antes Si hubiera pedido ayuda habría sido más fácil", media_asset_key: es.b1.audio.arrepentimientos.mensaje_completo.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit38.lesson04.exercise03.match_full_unit
            type: matching_pairs
            tested_text: "debería ojalá hubiera habría sido"
            prompt: {target_blocks: []}
            pairs: [{left: "Debería haber estudiado más para el examen", right: "the regret about a decision"}, {left: "Ojalá hubiera hablado con mi jefe antes", right: "the wish the past were different"}, {left: "Si hubiera pedido ayuda, habría sido más fácil", right: "what would have been different"}, {left: "debería haber / hubiera / habría sido", right: "past-hypothetical forms used"}, {left: "antes", right: "time marker for the missed action"}]
          - {content_key: es.b1.unit38.lesson04.exercise04.order_alternative_2, type: word_order, tested_text: "Si hubiera pedido ayuda habría sido más fácil", prompt: {target_blocks: []}, word_bank: [Si, hubiera, pedido, ayuda, habría, sido, más, fácil]}
          - {content_key: es.b1.unit38.lesson04.exercise05.write_culminating_arrepentimiento, type: writing_prompt, tested_text: "Debería haber estudiado más para el examen Ojalá hubiera hablado con mi jefe antes Si hubiera pedido ayuda habría sido más fácil", prompt: {target_blocks: [{text: "Write a short reflection in Spanish about a past mistake. It must contain exactly these three parts in order: (1) a regret about a decision, using \"Debería haber estudiado más para el examen\"; (2) a wish that the past had been different, using \"Ojalá hubiera hablado con mi jefe antes\"; (3) what would have been different, using \"Si hubiera pedido ayuda, habría sido más fácil\".", language_code: en, direction: ltr}]}}
