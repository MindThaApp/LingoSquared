        spine_outcome_id: universal.b1.hypotheticals.express_regret_and_past_wishes
        teaching:
          - content_key: es.b1.unit38.lesson04.teach.regret_recall
            kind: phrase
            target: {text: "Debería haber estudiado más para el examen.", language_code: es, direction: ltr}
            introduced_tokens: [Debería, haber, estudiado, más, para, el, examen]
