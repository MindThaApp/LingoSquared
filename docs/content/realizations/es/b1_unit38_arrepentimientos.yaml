target_language: es
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Authored fresh for past-hypothetical regret constructions
    (condicional compuesto + pluscuamperfecto de subjuntivo). No other
    language unit was consulted.
review:
  status: reviewed
  required_next_reviewer: codex
  notes: >-
    Realizes universal.b1.hypotheticals.express_regret_and_past_wishes
    literally: learners say what they wish had happened, what they
    should have done, and what would have been different, using
    past-hypothetical constructions ("debería haber...", "ojalá hubiera...",
    "habría sido diferente si..."). Character canon checked on disk and
    preserved (grep of a1_unit13_work.yaml, b1_unit27/29/33/35/36/37):
    Elena is a Spanish teacher living in London; Mateo is a Colombian
    accountant living in London; tú register between them as established
    peers. No new facts contradicted. The culminating exercise (lesson04)
    requires a single message containing all three can_do components
    literally: a regret about a decision, a wish that the past had been
    different, and a statement of what would have been different, all in
    past-hypothetical form.
course:
  realization_key: es.b1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Elena and Mateo use tú as established peers (informal register),
    matching the precedent set across b1_unit27/29/33/35/36/37.
