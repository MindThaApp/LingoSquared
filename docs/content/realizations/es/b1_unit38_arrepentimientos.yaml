          - {content_key: es.b1.unit38.lesson03.exercise02.listen_alternative, type: listen_select, tested_text: "Si hubiera pedido ayuda habría sido más fácil", media_asset_key: es.b1.audio.arrepentimientos.habria_sido.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit38.lesson03.exercise03.match_alternative
            type: matching_pairs
            tested_text: "si hubiera pedido ayuda habría sido fácil"
            prompt: {target_blocks: []}
            pairs: [{left: "si hubiera pedido", right: "if I had asked"}, {left: "ayuda", right: "for help"}, {left: "habría sido", right: "it would have been"}, {left: "más fácil", right: "easier"}, {left: "Si hubiera pedido ayuda, habría sido más fácil", right: "if I had asked for help, it would have been easier"}]
          - {content_key: es.b1.unit38.lesson03.exercise04.order_alternative, type: word_order, tested_text: "Si hubiera pedido ayuda habría sido más fácil", prompt: {target_blocks: []}, word_bank: [Si, hubiera, pedido, ayuda, habría, sido, más, fácil]}
