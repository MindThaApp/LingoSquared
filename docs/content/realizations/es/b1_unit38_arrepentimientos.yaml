units:
  - content_key: es.b1.unit38.arrepentimientos
    title: "Arrepentimientos"
    section: speaking
    spine_outcome_ids: [universal.b1.hypotheticals.express_regret_and_past_wishes]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit38.lesson01.deberia_haber
        title: "Debería haber..."
        spine_outcome_id: universal.b1.hypotheticals.express_regret_and_past_wishes
        teaching:
          - content_key: es.b1.unit38.lesson01.teach.deberia_haber
            kind: vocabulary
            target: {text: "debería haber", language_code: es, direction: ltr}
            introduced_tokens: [debería, haber]
            example: {text: "Debería haber llamado antes.", language_code: es, direction: ltr}
          - content_key: es.b1.unit38.lesson01.teach.estudiado
            kind: vocabulary
            target: {text: "estudiado", language_code: es, direction: ltr}
            introduced_tokens: [estudiado]
            example: {text: "He estudiado español.", language_code: es, direction: ltr}
          - content_key: es.b1.unit38.lesson01.teach.para_el_examen
            kind: vocabulary
            target: {text: "para el examen", language_code: es, direction: ltr}
            introduced_tokens: [para, el, examen]
            example: {text: "Estudio para el examen.", language_code: es, direction: ltr}
          - content_key: es.b1.unit38.lesson01.teach.decision_regret
            kind: phrase
            target: {text: "Debería haber estudiado más para el examen.", language_code: es, direction: ltr}
            introduced_tokens: [Debería, haber, estudiado, más, para, el, examen]
        exercises:
          - {content_key: es.b1.unit38.lesson01.exercise01.choose_regret, type: multiple_choice, tested_text: "Debería haber estudiado más para el examen", prompt: {target_blocks: [{text: "Which sentence means \"I should have studied more for the exam\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit38.lesson01.exercise02.listen_regret, type: listen_select, tested_text: "Debería haber estudiado más para el examen", media_asset_key: es.b1.audio.arrepentimientos.deberia_haber.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit38.lesson01.exercise03.match_regret
            type: matching_pairs
            tested_text: "debería haber estudiado más examen"
            prompt: {target_blocks: []}
            pairs: [{left: "debería haber", right: "I should have"}, {left: "estudiado", right: "studied"}, {left: "para el examen", right: "for the exam"}, {left: "más", right: "more"}, {left: "Debería haber estudiado más para el examen", right: "I should have studied more for the exam"}]
          - {content_key: es.b1.unit38.lesson01.exercise04.order_regret, type: word_order, tested_text: "Debería haber estudiado más para el examen", prompt: {target_blocks: []}, word_bank: [Debería, haber, estudiado, más, para, el, examen]}
          - {content_key: es.b1.unit38.lesson01.exercise05.translate_regret, type: translation, tested_text: "Debería haber estudiado más para el examen", prompt: {target_blocks: [{text: "Translate to Spanish, expressing regret about a decision: I should have studied more for the exam.", language_code: en, direction: ltr}]}}

