          - content_key: es.b1.unit38.lesson02.exercise03.match_wish
            type: matching_pairs
            tested_text: "ojalá hubiera hablado jefe antes"
            prompt: {target_blocks: []}
            pairs: [{left: "ojalá", right: "I wish"}, {left: "hubiera hablado", right: "I had talked"}, {left: "con mi jefe", right: "with my boss"}, {left: "antes", right: "earlier"}, {left: "Ojalá hubiera hablado con mi jefe antes", right: "I wish I had talked to my boss earlier"}]
          - {content_key: es.b1.unit38.lesson02.exercise04.order_wish, type: word_order, tested_text: "Ojalá hubiera hablado con mi jefe antes", prompt: {target_blocks: []}, word_bank: [Ojalá, hubiera, hablado, con, mi, jefe, antes]}
          - {content_key: es.b1.unit38.lesson02.exercise05.fill_ojala, type: fill_in_blank, tested_text: "Ojalá hubiera hablado con mi jefe antes", prompt: {target_blocks: [{text: "___ hubiera hablado con mi jefe antes. (I wish)", language_code: es, direction: ltr}]}}

