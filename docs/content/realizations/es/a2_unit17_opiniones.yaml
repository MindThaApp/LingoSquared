generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The core A2 grammar step-up used in this unit -- the subjunctive
    after a NEGATED opinion verb (no creo que + subjunctive, contrasted
    with creo que + indicative for an affirmed opinion) -- is scaffolded
    from the real, public-domain FSI Spanish Basic Course (Foreign
    Service Institute, 1961+ revisions, US government work), Volume 4
    (Units 46-55): lines ~493-499 and ~2956-2964 present real drill
    pairs illustrating exactly this contrast ("No creo que éstas sean
    iguales a ésas," "No creo que hayan venido") -- downloaded directly
    (firecrawl confirmed at 0/1000 credits via `firecrawl --status`, so
    this used the documented WebSearch + direct-download + `pdftotext
    -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%204/FSI%20-%20Spanish%20Basic%20Course%20-%20Volume%204%20-%20Student%20Text.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. Only the
    grammar POINT itself (negated-opinion-verb triggers subjunctive) is
    reused, not any scenario or drill sentence -- the FSI drills
    illustrating it are about unrelated topics (whether two houses are
    the same, whether people have arrived). The neighborhood-opinion
    scenario, vocabulary, and every sentence are freshly written for
    Elena and Mateo's own storyline.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Second Spanish A2 unit (spine outcome:
    universal.a2.opinions.give_opinions_with_reasons), continuing
    directly from unit16: now settled into the new apartment and
    registered, Elena and Mateo discuss their opinions about the new
    neighborhood versus the old one. A2-level complexity: opinion-plus-
    reason constructions with *porque*, and the indicative/subjunctive
    contrast between an AFFIRMED opinion (*creo que* + indicative) and a
    NEGATED one (*no creo que* + subjunctive) -- a genuinely new mood
    contrast, not just new vocabulary. Authored fresh at schema_version
    1.1 per AUTHORING_GUIDE §19. tú register throughout (an opinion
    exchange between Elena and Mateo themselves, no formal-register
    party involved, unlike unit16).

    Six lessons, recognition->drag->production (§2): 01 teaches opinion
    vocabulary and the "me parece que" opener; 02 teaches opinion-plus-
    reason with *porque*; 03 is the question-and-answer pattern (¿qué
    piensas...? / creo que...); 04 teaches the *no creo que* +
    subjunctive contrast; 05 is a reading of a short note comparing the
    neighborhoods; 06 is a dialogue capstone where they discuss and
    ultimately agree to disagree amicably.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    creo/no creo for true-synonym risk -- they are opposites (affirm vs.
    negate an opinion), not synonyms, and every slot testing one is
    anchored by which specific claim is being made (more shops = better,
    quieter = the old one), never an open choice. §16: lesson02's and
    lesson04's matching_pairs pool forward the unit's vocabulary so far
    (6-7 pairs each). §12: multi-clause accepted_answers (lesson06's
    opinion-plus-reason lines) have period/comma/conjunction-joined
    variants. No bare yes/no/true/false -- checked by hand.

    Internal consistency (§11): "el barrio nuevo" (the new
    neighborhood) throughout this unit refers consistently to the
    neighborhood around the apartment Mateo moved into in unit14/
    registered at in unit16 -- never contradicted. The specific reasons
    given (more shops, closer to work vs. quieter) are stated
    consistently across every exercise and the dialogue: the new
    neighborhood has more shops and is closer to work; the old one was
    quieter. Neither claim is reversed anywhere. This is deliberately an
    opinion DISAGREEMENT (Mateo prefers the new neighborhood's
    convenience, Elena misses the old one's quiet) resolved amicably,
    not a factual contradiction -- consistent with their established
    equal-partners dynamic (see unit15's own consistency note on their
    cooking-skill comparison).

    Listening-integrity check: lesson06's dialogue_comprehension
    exercises test facts via English answer options, not literal
    same-speaker quote picks, so the same-speaker-distractor collision
    bug class does not apply here.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grammar notes, accepted-answer coverage, prompt
    determinacy, matching logic and character continuity for this
    unit and its en-es overlay. Fix in this file:
    lesson05.exercise05.match_nota_points right "the concession
    about the old one" -> "the concession about the new one" (the
    concession no creo que sea tan tranquilo is about the new
    neighborhood; overlay mirror updated). Overlay-side fixes listed
    in the en-es overlay note. DEFERRED (owner decision): cross-unit
    character canon -- Elena says "Yo extraño la tranquilidad del
    barrio viejo" and argues old vs new neighborhood as if she had
    lived there, but A1 canon has only Mateo moving (a1 unit14/15)
    and Elena living with her grandparents; fixing it means
    reassigning lines and re-recording audio
    (es.a2.audio.dialogue.opiniones_barrio.01,
    es.a2.audio.opiniones.extranio_tranquilidad.01) plus
    lesson04/lesson06 cards and comprehension questions. NATIVE
    FLAGS: none new.

