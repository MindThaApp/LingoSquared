units:
  - content_key: es.a2.unit17.opiniones
    title: "Elena y Mateo opinan sobre el barrio nuevo"
    section: reading_writing
    spine_outcome_ids: [universal.a2.opinions.give_opinions_with_reasons]
    planned_lesson_count: 6
    lessons:
      - content_key: es.a2.unit17.lesson01.mi_opinion
        title: "Me parece que..."
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: es.a2.unit17.lesson01.teach.la_opinion
            kind: vocabulary
            target: {text: "la opinión", language_code: es, direction: ltr}
            introduced_tokens: [la, opinión]
            example: {text: "¿Cuál es tu opinión sobre el barrio nuevo?", language_code: es, direction: ltr}
          - content_key: es.a2.unit17.lesson01.teach.el_barrio
            kind: vocabulary
            target: {text: "el barrio", language_code: es, direction: ltr}
            introduced_tokens: [el, barrio]
            example: {text: "Este barrio tiene muchas tiendas.", language_code: es, direction: ltr}
          - content_key: es.a2.unit17.lesson01.teach.pensar
            kind: vocabulary
            target: {text: "pensar", language_code: es, direction: ltr}
            introduced_tokens: [pensar]
            example: {text: "¿Qué piensas de esto?", language_code: es, direction: ltr}
          - {content_key: es.a2.unit17.lesson01.teach.me_parece_mejor, kind: phrase, target: {text: "Me parece que el barrio nuevo es mejor.", language_code: es, direction: ltr}, introduced_tokens: [Me, parece, que, el, barrio, nuevo, es, mejor]}
          - content_key: es.a2.unit17.lesson01.teach.me_parece_note
            kind: grammar_note
            target: {text: "*Me parece que...* (it seems to me that.../I think that...) is a natural, common way to open an opinion, softer than a flat statement -- similar in function to English \"I feel like...\".", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit17.lesson01.exercise01.choose_me_parece_mejor, type: multiple_choice, tested_text: "Me parece que el barrio nuevo es mejor", prompt: {target_blocks: [{text: "It seems to me that the new neighborhood is better.", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson01.exercise02.listen_me_parece_mejor, type: listen_select, tested_text: "Me parece que el barrio nuevo es mejor", media_asset_key: es.a2.audio.opiniones.me_parece_mejor.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit17.lesson01.exercise03.match_opinion_vocab
            type: matching_pairs
            tested_text: "opinión barrio pensar me parece mejor"
            prompt: {target_blocks: []}
            pairs: [{left: "la opinión", right: "the opinion"}, {left: "el barrio", right: "the neighborhood"}, {left: pensar, right: "to think"}, {left: "Me parece que...", right: "It seems to me that..."}, {left: "el barrio nuevo", right: "the new neighborhood"}, {left: mejor, right: better}]
          - {content_key: es.a2.unit17.lesson01.exercise04.order_me_parece_mejor, type: word_order, tested_text: "Me parece que el barrio nuevo es mejor", prompt: {target_blocks: []}, word_bank: [Me, parece, que, el, barrio, nuevo, es, mejor]}
          - {content_key: es.a2.unit17.lesson01.exercise05.fill_me_parece_mejor, type: fill_in_blank, tested_text: "Me parece que el barrio nuevo es mejor", prompt: {target_blocks: [{text: "___ que el barrio nuevo es mejor. (it seems to me)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson01.exercise06.write_first_opinion, type: writing_prompt, tested_text: "Me parece que el barrio nuevo es mejor", prompt: {target_blocks: [{text: "Write in Spanish: say it seems to you that the new neighborhood is better.", language_code: en, direction: ltr}]}}

      - content_key: es.a2.unit17.lesson02.porque_hay_mas_tiendas
        title: "Porque hay más tiendas"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - {content_key: es.a2.unit17.lesson02.teach.hay_mas_tiendas, kind: phrase, target: {text: "El barrio nuevo es mejor porque hay más tiendas.", language_code: es, direction: ltr}, introduced_tokens: [El, barrio, nuevo, es, mejor, porque, hay, más, tiendas]}
          - {content_key: es.a2.unit17.lesson02.teach.mas_cerca_trabajo, kind: phrase, target: {text: "También está más cerca del trabajo.", language_code: es, direction: ltr}, introduced_tokens: [También, está, más, cerca, del, trabajo]}
        exercises:
          - {content_key: es.a2.unit17.lesson02.exercise01.choose_hay_mas_tiendas, type: multiple_choice, tested_text: "El barrio nuevo es mejor porque hay más tiendas", prompt: {target_blocks: [{text: "The new neighborhood is better because there are more shops.", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson02.exercise02.listen_hay_mas_tiendas, type: listen_select, tested_text: "El barrio nuevo es mejor porque hay más tiendas", media_asset_key: es.a2.audio.opiniones.hay_mas_tiendas.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit17.lesson02.exercise03.match_reasons
            type: matching_pairs
            tested_text: "tiendas cerca trabajo opinión barrio pensar mejor"
            prompt: {target_blocks: []}
            pairs: [{left: "hay más tiendas", right: "there are more shops"}, {left: "más cerca del trabajo", right: "closer to work"}, {left: "la opinión", right: "the opinion"}, {left: "el barrio", right: "the neighborhood"}, {left: pensar, right: "to think"}, {left: "Me parece que...", right: "It seems to me that..."}]
          - {content_key: es.a2.unit17.lesson02.exercise04.order_hay_mas_tiendas, type: word_order, tested_text: "El barrio nuevo es mejor porque hay más tiendas", prompt: {target_blocks: []}, word_bank: [El, barrio, nuevo, es, mejor, porque, hay, más, tiendas]}
          - {content_key: es.a2.unit17.lesson02.exercise05.fill_mas_cerca_trabajo, type: fill_in_blank, tested_text: "También está más cerca del trabajo", prompt: {target_blocks: [{text: "También está más ___ del trabajo. (close)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson02.exercise06.translate_opinion_reason, type: translation, tested_text: "El barrio nuevo es mejor porque hay más tiendas", prompt: {target_blocks: [{text: "The new neighborhood is better because there are more shops.", language_code: en, direction: ltr}]}}

      - content_key: es.a2.unit17.lesson03.que_piensas_del_barrio
        title: "¿Qué piensas del barrio?"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - {content_key: es.a2.unit17.lesson03.teach.que_piensas, kind: phrase, target: {text: "¿Qué piensas del barrio nuevo?", language_code: es, direction: ltr}, introduced_tokens: [Qué, piensas, del, barrio, nuevo]}
          - {content_key: es.a2.unit17.lesson03.teach.creo_que_mejor, kind: phrase, target: {text: "Creo que es mejor porque está más cerca del trabajo.", language_code: es, direction: ltr}, introduced_tokens: [Creo, que, es, mejor, porque, está, más, cerca, del, trabajo]}
          - content_key: es.a2.unit17.lesson03.teach.creo_que_note
            kind: grammar_note
            target: {text: "*Creo que* (I believe/think that) + INDICATIVE (*es*) states an opinion you're affirming as true -- contrast this with lesson04's *no creo que* + SUBJUNCTIVE, used when denying it.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit17.lesson03.exercise01.choose_que_piensas, type: multiple_choice, tested_text: "Qué piensas del barrio nuevo", prompt: {target_blocks: [{text: "What do you think of the new neighborhood?", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson03.exercise02.listen_que_piensas, type: listen_select, tested_text: "Qué piensas del barrio nuevo", media_asset_key: es.a2.audio.opiniones.que_piensas.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit17.lesson03.exercise03.match_question_answer
            type: matching_pairs
            tested_text: "que piensas creo mejor cerca trabajo tiendas"
            prompt: {target_blocks: []}
            pairs: [{left: "¿Qué piensas del barrio nuevo?", right: "What do you think of the new neighborhood?"}, {left: "Creo que es mejor.", right: "I think it's better."}, {left: "más cerca del trabajo", right: "closer to work"}, {left: "hay más tiendas", right: "there are more shops"}, {left: "la opinión", right: "the opinion"}, {left: pensar, right: "to think"}]
          - {content_key: es.a2.unit17.lesson03.exercise04.order_creo_que_mejor, type: word_order, tested_text: "Creo que es mejor porque está más cerca del trabajo", prompt: {target_blocks: []}, word_bank: [Creo, que, es, mejor, porque, está, más, cerca, del, trabajo]}
          - {content_key: es.a2.unit17.lesson03.exercise05.fill_creo_que_mejor, type: fill_in_blank, tested_text: "Creo que es mejor porque está más cerca del trabajo", prompt: {target_blocks: [{text: "___ que es mejor porque está más cerca del trabajo. (I believe)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson03.exercise06.respond_que_piensas, type: dialogue_response, tested_text: "Creo que es mejor porque está más cerca del trabajo", prompt: {target_blocks: [{text: "¿Qué piensas del barrio nuevo?", language_code: es, direction: ltr}]}}

      - content_key: es.a2.unit17.lesson04.no_creo_que
        title: "No creo que sea tan tranquilo"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - {content_key: es.a2.unit17.lesson04.teach.no_creo_tranquilo, kind: phrase, target: {text: "No creo que sea tan tranquilo como el viejo.", language_code: es, direction: ltr}, introduced_tokens: ["No", creo, que, sea, tan, tranquilo, como, el, viejo]}
          - {content_key: es.a2.unit17.lesson04.teach.extranio_tranquilidad, kind: phrase, target: {text: "Yo extraño la tranquilidad del barrio viejo.", language_code: es, direction: ltr}, introduced_tokens: [Yo, extraño, la, tranquilidad, del, barrio, viejo]}
          - content_key: es.a2.unit17.lesson04.teach.subjunctive_opinion_note
            kind: grammar_note
            target: {text: "*No creo que* (I don't believe/think that) + SUBJUNCTIVE (*sea*, not *es*) -- negating an opinion verb (creer, pensar) shifts the following verb to the subjunctive, unlike the affirmed version in lesson03.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit17.lesson04.exercise01.choose_no_creo_tranquilo, type: multiple_choice, tested_text: "No creo que sea tan tranquilo como el viejo", prompt: {target_blocks: [{text: "I don't think it's as quiet as the old one.", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson04.exercise02.listen_no_creo_tranquilo, type: listen_select, tested_text: "No creo que sea tan tranquilo como el viejo", media_asset_key: es.a2.audio.opiniones.no_creo_tranquilo.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit17.lesson04.exercise03.match_negated_opinions
            type: matching_pairs
            tested_text: "no creo tranquilo extraño tranquilidad viejo creo mejor piensas"
            prompt: {target_blocks: []}
            pairs: [{left: "No creo que sea tan tranquilo.", right: "I don't think it's as quiet."}, {left: "Yo extraño la tranquilidad.", right: "I miss the quiet."}, {left: "el barrio viejo", right: "the old neighborhood"}, {left: "Creo que es mejor.", right: "I think it's better."}, {left: "¿Qué piensas?", right: "What do you think?"}, {left: "hay más tiendas", right: "there are more shops"}, {left: "más cerca del trabajo", right: "closer to work"}]
          - {content_key: es.a2.unit17.lesson04.exercise04.order_no_creo_tranquilo, type: word_order, tested_text: "No creo que sea tan tranquilo como el viejo", prompt: {target_blocks: []}, word_bank: ["No", creo, que, sea, tan, tranquilo, como, el, viejo]}
          - {content_key: es.a2.unit17.lesson04.exercise05.fill_no_creo_tranquilo, type: fill_in_blank, tested_text: "No creo que sea tan tranquilo como el viejo", prompt: {target_blocks: [{text: "No creo que ___ tan tranquilo como el viejo. (it is, subjunctive)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson04.exercise06.write_disagree_opinion, type: writing_prompt, tested_text: "No creo que sea tan tranquilo como el viejo", prompt: {target_blocks: [{text: "Write in Spanish: say you don't think it's as quiet as the old one.", language_code: en, direction: ltr}]}}

      - content_key: es.a2.unit17.lesson05.leer_la_nota
        title: "Leer una nota de opinión"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: es.a2.unit17.lesson05.teach.nota_reading
            kind: reading
            target:
              text: >-
                Para mí, el barrio nuevo es mejor porque hay más tiendas
                y está más cerca del trabajo. Sin embargo, no creo que
                sea tan tranquilo como el viejo. Cada barrio tiene sus
                ventajas.
              language_code: es
              direction: ltr
            introduced_tokens: [Para, mí, el, barrio, nuevo, es, mejor, porque, hay, más, tiendas, y, está, cerca, del, trabajo, Sin, embargo, "no", creo, que, sea, tan, tranquilo, como, viejo, Cada, tiene, sus, ventajas]
          - content_key: es.a2.unit17.lesson05.teach.sin_embargo_note
            kind: grammar_note
            target: {text: "*Sin embargo* (however/nevertheless) introduces a contrasting point -- here, praising the new neighborhood's convenience while still conceding the old one was quieter.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit17.lesson05.exercise01.read_why_better, type: reading_comprehension, tested_text: "hay más tiendas y está más cerca del trabajo", prompt: {target_blocks: [{text: "Why does the writer think the new neighborhood is better?", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson05.exercise02.read_concession, type: reading_comprehension, tested_text: "no creo que sea tan tranquilo como el viejo", prompt: {target_blocks: [{text: "What does the writer concede about the old neighborhood?", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson05.exercise03.read_conclusion, type: reading_comprehension, tested_text: "Cada barrio tiene sus ventajas", prompt: {target_blocks: [{text: "How does the note conclude?", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson05.exercise04.listen_nota, type: listen_select, tested_text: "Cada barrio tiene sus ventajas", media_asset_key: es.a2.audio.opiniones.cada_barrio_ventajas.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit17.lesson05.exercise05.match_nota_points
            type: matching_pairs
            tested_text: "tiendas trabajo tranquilo ventajas"
            prompt: {target_blocks: []}
            pairs: [{left: "hay más tiendas", right: "the reason it's more convenient"}, {left: "no tan tranquilo", right: "the concession about the new one"}, {left: "cada barrio tiene sus ventajas", right: "the balanced conclusion"}]
          - {content_key: es.a2.unit17.lesson05.exercise06.fill_sin_embargo, type: fill_in_blank, tested_text: "Sin embargo no creo que sea tan tranquilo como el viejo", prompt: {target_blocks: [{text: "___ embargo, no creo que sea tan tranquilo. (however)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit17.lesson05.exercise07.write_own_opinion_reason, type: writing_prompt, tested_text: "El barrio nuevo es mejor porque hay más tiendas", prompt: {target_blocks: [{text: "Write in Spanish: give your opinion that the new neighborhood is better because there are more shops.", language_code: en, direction: ltr}]}}

      - content_key: es.a2.unit17.lesson06.elena_mateo_debaten
        title: "Elena y Mateo hablan del barrio"
        spine_outcome_ids: [universal.a2.opinions.give_opinions_with_reasons]
