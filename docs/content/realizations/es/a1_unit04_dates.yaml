          - {content_key: es.a1.unit04.lesson04.exercise04.order_mi_cumpleanos, type: word_order, tested_text: "Mi cumpleaños es el diez de marzo", prompt: {target_blocks: []}, word_bank: [Mi, cumpleaños, es, el, diez, de, marzo]}
