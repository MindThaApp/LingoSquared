            kind: vocabulary
            target: {text: "lunes, martes, miércoles, jueves, viernes", language_code: es, direction: ltr}
            introduced_tokens: [lunes, martes, miércoles, jueves, viernes]
            example:
              - {text: "El taller de cocina es los martes.", language_code: es, direction: ltr}
              - {text: "Los jueves estudio español.", language_code: es, direction: ltr}
          - content_key: es.a1.unit04.lesson01.teach.fin_de_semana
            kind: vocabulary
            target: {text: "sábado, domingo", language_code: es, direction: ltr}
            introduced_tokens: [sábado, domingo]
            example:
              - {text: "Los sábados voy al mercado.", language_code: es, direction: ltr}
              - {text: "Los domingos descanso.", language_code: es, direction: ltr}
          - {content_key: es.a1.unit04.lesson01.teach.hoy_es_viernes, kind: phrase, target: {text: "Hoy es viernes.", language_code: es, direction: ltr}, introduced_tokens: [Hoy, es, viernes]}
          - {content_key: es.a1.unit04.lesson01.teach.el_taller_es_los_martes, kind: phrase, target: {text: "El taller de cocina es los martes.", language_code: es, direction: ltr}, introduced_tokens: [El, taller, de, cocina, es, los, martes]}
        exercises:
          - {content_key: es.a1.unit04.lesson01.exercise01.choose_martes, type: multiple_choice, tested_text: "martes", prompt: {target_blocks: [{text: "Tuesday", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit04.lesson01.exercise02.listen_dias, type: listen_select, tested_text: "lunes martes miércoles jueves viernes", media_asset_key: es.a1.audio.dias.lunes_viernes.01, prompt: {target_blocks: []}}
          - content_key: es.a1.unit04.lesson01.exercise03.match_dias
            type: matching_pairs
            tested_text: "lunes martes miércoles jueves viernes sábado domingo"
            prompt: {target_blocks: []}
            pairs: [{left: lunes, right: Monday}, {left: martes, right: Tuesday}, {left: miércoles, right: Wednesday}, {left: jueves, right: Thursday}, {left: viernes, right: Friday}, {left: sábado, right: Saturday}, {left: domingo, right: Sunday}]
          - {content_key: es.a1.unit04.lesson01.exercise04.listen_hoy_es_viernes, type: listen_select, tested_text: "Hoy es viernes", media_asset_key: es.a1.audio.dias.hoy_es_viernes.01, prompt: {target_blocks: []}}
          - {content_key: es.a1.unit04.lesson01.exercise05.order_el_taller_es_los_martes, type: word_order, tested_text: "El taller de cocina es los martes", prompt: {target_blocks: []}, word_bank: [El, taller, de, cocina, es, los, martes]}
          - {content_key: es.a1.unit04.lesson01.exercise06.translate_domingo, type: translation, tested_text: "domingo", prompt: {target_blocks: [{text: "Sunday", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit04.lesson01.exercise07.dictation_hoy_es_viernes, type: dictation, tested_text: "Hoy es viernes", media_asset_key: es.a1.audio.dias.hoy_es_viernes.01, prompt: {target_blocks: []}}

      - content_key: es.a1.unit04.lesson02.los_meses_del_ano
        title: "Los meses del año"
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: es.a1.unit04.lesson02.teach.meses_primer_semestre
            kind: vocabulary
            target: {text: "enero, febrero, marzo, abril, mayo, junio", language_code: es, direction: ltr}
