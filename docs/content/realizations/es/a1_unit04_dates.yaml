          - {content_key: es.a1.unit04.lesson04.exercise07.speak_own_birthday, type: speak_response, tested_text: "Mi cumpleaños es el diez de marzo", prompt: {target_blocks: [{text: "Di que tu cumpleaños es el diez de marzo.", language_code: es, direction: ltr}]}}

      - content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
        title: "Leer el horario del taller"
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: es.a1.unit04.lesson05.teach.horario_reading
            kind: reading
            target:
              text: "El taller de cocina es los martes. La próxima clase es el veintidós de julio. Después, hay una clase el veintinueve de julio. El taller termina el doce de agosto."
