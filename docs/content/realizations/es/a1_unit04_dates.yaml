          - {content_key: es.a1.unit04.lesson03.exercise06.reply_cuando_es_el_taller, type: dialogue_response, tested_text: "Cuándo es el taller El taller es el veintidós de julio", prompt: {target_blocks: [{text: "¿Cuándo es el taller?", language_code: es, direction: ltr}]}}
