          - content_key: es.a1.unit04.lesson03.teach.formato_fecha_note
            kind: grammar_note
            target: {text: "Spanish states a date as cardinal number + de + month, not an ordinal like English \"the fifteenth\": el veintidós de julio literally reads \"the twenty-two of July.\" The only common exception is *el primero* (the first) for day one of a month.", language_code: en, direction: ltr}
