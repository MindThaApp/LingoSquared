generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    Days-of-week and months-of-year vocabulary, the standard Spanish
    date-reading convention ("[cardinal number] de [month] de [year]"),
    and the general two-colleagues-scheduling-together scenario shape
    are scaffolded from the real, public-domain FSI Spanish Basic Course
    (Foreign Service Institute, 1961, US government work), Volume 3
    (Units 31-45), Unit 32 "A conversation after dinner" (32.21.1,
    cardinal numbers/days of the week/months of the year drills) --
    fetched via WebSearch/WebFetch + local pdftotext extraction from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%203/Fsi-SpanishBasicCourse-Volume1-StudentText.pdf
    (firecrawl was out of API credits this session -- 0/1000 remaining
    per `firecrawl --status` -- so this fell back to the older manual
    WebFetch+pdftotext workflow AUTHORING_GUIDE §10 says firecrawl
    should normally replace). No sentence, dialogue line, or drill item
    was copied verbatim -- every phrase below is freshly written for
    Elena and Mateo's own storyline and modernized register (no 1961
    diplomatic-training framing). The specific workshop-schedule/
    birthday dates and all exercise content are original to this unit.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Fourth Spanish A1 unit, continuing the Elena/Mateo cooking-workshop
    storyline from units 01-03 (register: tú throughout, matching
    unit01-03's established split). Realizes
    universal.a1.dates.exchange_calendar_dates (prerequisite: universal.
    a1.numbers.use_basic_numbers, realized in unit02). Authored fresh at
    schema_version 1.1 from the start per AUTHORING_GUIDE §19 -- every
    kind: vocabulary card carries a real example sentence.

    Six lessons, recognition->drag->production pacing throughout (§2):
    01 teaches the 7 days of the week; 02 teaches the 12 months; 03
    teaches the core question-and-answer pattern for stating a date
    (¿Qué fecha es hoy? / Hoy es el [number] de [month]), introducing
    only the specific number words this unit actually uses (diez, doce,
    veintidós, veintinueve, treinta) rather than the full 1-31 range,
    since AUTHORING_GUIDE's per-file untaught-vocabulary check requires
    every tested number word to be freshly introduced in THIS file
    (confirmed by reading scripts/compile_content.py's
    validate_untaught_vocabulary -- it accumulates taught tokens per
    realization file, not course-wide, so unit02's already-taught
    numbers don't carry over); 04 applies the pattern to birthdays
    (Elena's cumpleaños es el diez de marzo, a fact newly established
    here and not previously stated anywhere in units01-03, freely
    invented and cross-checked for no clash with any existing fact;
    Mateo's is el veintidós de agosto, deliberately reusing the
    veintidós already introduced in lesson03's workshop-schedule phrase
    to avoid a fresh, unnecessary number); 05 is a short reading (the
    workshop's own printed schedule) that reuses lesson03's specific
    dates rather than inventing new ones, keeping the whole unit's dates
    internally consistent per §11 (next class 22 July, following class
    29 July, workshop ends 12 August -- all three restated identically
    in lesson06's dialogue); 06 is a dialogue capstone where Elena and
    Mateo confirm the schedule dates from lesson05's reading and then
    exchange birthdays from lesson04, closing the loop and explicitly
    noting (Elena's own line) that Mateo's birthday falls after the
    workshop ends -- a fact checked against the stated dates (22 August
    is indeed after 12 August).

    §13 checked: every fill_in_blank frame keeps visible surrounding
    text besides the blanked slot. §17 checked: the two production
    slots that could risk true-synonym ambiguity (which specific day
    name, which specific month name) are always anchored by an
    already-stated fact in the same sentence/dialogue turn (e.g. "El
    taller es los ___" only makes sense as "martes" given the
    established Tuesday-workshop fact restated earlier in the same
    lesson), not a free open choice between synonyms. §16
    matching_pairs: lesson01 uses all 7 days (day-name to day-name-
    number-in-week gloss) plus repeats for pacing floor; lesson02 uses
    all 12 months. §12: the one multi-clause accepted_answers list
    (lesson06's closing exchange) has period/comma/conjunction-joined
    variants. No bare yes/no/true/false anywhere -- Spanish "no"
    appears only inside full double-quoted sentences, never as a bare
    standalone scalar, checked by hand.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked pacing, token coverage, prompt determinacy, matching_pairs
    discrimination, reading visibility, character canon (units 01-03) and
    learner-facing notes, together with the en-es overlay. Fixes:
    lesson05.exercise01-04 read_* -- schedule passage added as the first
    es prompt.target_block (it was never visible during the questions);
    lesson05.exercise05.match_horario -- confusable pair 'La próxima
    clase'/'The next class' (same meaning as 'next class') replaced by
    'termina'/'ends'; lesson03.exercise05.fill_dia_del_taller -- '(from
    lesson01: Tuesdays)' -> '(Tuesdays)';
    lesson03.exercise07.write_hoy_es_la_fecha -- prompt pinned to 'Write
    in Spanish: Today is the twenty-second of July.';
    lesson04.exercise07.speak_own_birthday -- open 'real o inventado'
    prompt pinned to 'Di que tu cumpleaños es el diez de marzo.';
    lesson05.exercise07.write_horario_summary -- prompt pinned to the two
    exact sentences; lesson05.teach.despues_note -- removed false/internal
    'pero in unit03' cross-reference. NATIVE FLAGS: formato_fecha_note
    calls *el primero* the only common exception (el uno is also common in
    Spain); untaught imperatives in Spanish speak/dialogue instructions
    (Di, Toma, dile, pregúntale). DEFERRED (owner decision): showing the
    lesson's reading card in the ReadingComprehension renderer / compiler
    instead of duplicating passages into target_blocks.

course:
  realization_key: es.a1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Continues unit01-03's register split: tú with Mateo and other peers
    at the cooking workshop. Dates are read in the standard
    pan-Hispanic spoken convention: cardinal number + de + month (+ de
    + year when a year is stated), e.g. "el quince de julio" -- not the
    English ordinal pattern ("the fifteenth of July").

