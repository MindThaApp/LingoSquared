  - content_key: es.a1.audio.dialogue.planear_proxima_clase.01
    language: es
    text: >-
      Mateo: Elena, ¿cuándo es la próxima clase del taller?
      Elena: Es el veintidós de julio, un martes.
      Mateo: Perfecto. ¿Y cuándo termina el taller?
      Elena: Termina el doce de agosto.
      Mateo: Por cierto, ¿cuándo es tu cumpleaños?
      Elena: Es el diez de marzo. ¿Y el tuyo?
      Mateo: El veintidós de agosto.
      Elena: ¡Qué bien! Es después del taller.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
  - {content_key: es.a1.audio.dialogue.planear_proxima_clase.termina_doce_agosto.01, language: es, text: "Termina el doce de agosto.", voice_hint: neutral_young_adult, status: pending_generation}

