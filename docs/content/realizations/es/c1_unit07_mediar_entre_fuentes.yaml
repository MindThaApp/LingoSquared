schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: C1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1 unit 07, the seventh C1 unit in
    the es lane. Sourcing attempted: a firecrawl/web search for a
    public-domain advanced/C1 Spanish mediation source returned only
    commercial courseware (Lengalia, Instituto Cervantes), a Reddit thread,
    and the FSI Spanish Basic Course; FSI is public domain but caps at
    intermediate (Basic Course, 55 units), so per AUTHORING_GUIDE 10 it
    cannot scaffold C1 mediation/synthesis content. No usable public-domain
    C1 Spanish source was found, so this is established-conventions-only
    authoring, built from general knowledge of pan-Hispanic mediation and
    synthesis conventions. Unit06 (el_lenguaje_figurado) was the assigned
    structural exemplar for pacing and exercise depth only -- every word of
    Spanish text is freshly authored, and the scenario is unrelated to
    unit06's. Elena and Mateo continue as the established es characters
    (informal tu register: Elena is a Spanish teacher in London, Mateo is a
    Colombian accountant in London -- profile set in b1_unit44 and a1_unit13,
    re-confirmed in c1_unit01-06). Over coffee Mateo tells Elena that his
    office received two conflicting reports on remote work (el teletrabajo)
    -- a consultancy's report claiming it raises productivity, and a
    university study warning that it isolates workers -- and that he must
    distill both for a non-specialist colleague. Together they work through
    how to mediate: attribute each idea to its source, preserve the
    disagreement, and adapt the language to the audience. No
    sibling-direction file (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness and correct informal-tu register of every Elena/Mateo
    line and instruction, and that no vosotros/usted form slipped in; (2)
    that the mediation vocabulary (mediar, sintetizar, la fuente, el
    destinatario, el desacuerdo, el matiz, la salvedad, la conclusión) and
    the attribution/condensing frames (según, sostiene que, mientras que,
    en cambio, coinciden en que, discrepan sobre, en pocas palabras, es
    decir, sin entrar en tecnicismos) read as current pan-Hispanic Spanish;
    (3) that the culminating speaking exercise in lesson06 requires the
    FULL multi-sentence briefing -- source attribution, disagreement, and
    audience framing -- not a single sentence, matching the writing
    exercise's thoroughness; (4) the lesson06 accepted-answer punctuation
    variants (trailing period vs none) cover what a correct learner would
    produce; (5) that the two conflicting sources (consultora vs
    universidad) stay internally consistent across the reading passage, the
    dialogue, and the audio asset, and the caveat (la consultora tiene
    intereses comerciales) is a genuine qualification, not a contradiction.
  notes: >-
    Seventh Spanish C1 unit. Targets the CEFR C1 mediation outcome
    (universal.c1.mediation.mediate_and_synthesize_complex_sources):
    mediate between sources and audiences -- distill complex or conflicting
    material and relay it accurately and appropriately for a specific
    listener or reader. Theme: one coherent situation across all six
    lessons -- Mateo's office received two conflicting reports on remote
    work (el teletrabajo) and he must distill them for a non-specialist
    colleague, with Elena coaching him through mediation. Lesson arc maps
    the outcome's four assessment requirements: L01 the core mediation
    concepts (mediar, sintetizar, la fuente, el destinatario, el
    desacuerdo, el matiz); L02 attributing each idea to its source and
    marking agreement vs disagreement (según, sostiene que, mientras que,
    en cambio, coinciden en que, discrepan sobre) -- the two conflicting
    sources enter here; L03 reading two dense sources and deciding what to
    retain, explain, and omit (lo esencial, la salvedad, omitir, retener);
    L04 condensing and resolving terminology for a non-specialist audience
    (en pocas palabras, es decir, en términos sencillos, sin entrar en
    tecnicismos); L05 selecting content for a named audience and closing
    with a conclusion and the caveat (la conclusión, el público, los
    intereses comerciales); L06 the culminating production -- a listening
    exchange that selects the unresolved conflict for the audience, a
    speaking task AND a writing task that each require the full
    multi-sentence briefing (source attribution + disagreement + audience
    framing + caveat), plus a dictation. Register: informal tu throughout
    the Elena/Mateo frame narration and instructions (es lane precedent);
    the mediation metalanguage sits in an essayistic register distinct from
    the informal frame. No vosotros or usted. All vocabulary is introduced
    self-contained within this file (C1 is a separate Course row from B2, so
    a C1 learner never sees lower-tier lexemes at runtime); common words
    already introduced in c1_unit01-06 are reused per the
    cumulative-vocabulary rule.

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout for the lane's frame narration and instructions
    (es lane precedent from b1_unit27/29/33 and b2_unit01). Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2/C1 units. This unit is ABOUT mediation: it teaches a set of
    pan-Hispanic mediation, attribution, and condensing frames in their
    natural informal spoken register, plus the metalinguistic vocabulary
    (la fuente, el destinatario, la salvedad, la conclusión) in an
    essayistic register -- distinct from the lane's default informal tu
    used in the Elena/Mateo frame dialogue and in instructions. No
    vosotros or usted.

