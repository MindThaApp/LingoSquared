            example: {text: "Hay un desacuerdo entre las dos fuentes.", language_code: es, direction: ltr}
          - content_key: es.c1.unit07.lesson01.teach.el_matiz
            kind: vocabulary
            target: {text: "el matiz", language_code: es, direction: ltr}
            introduced_tokens: [matiz, pierdas, al, resumir]
            example: {text: "No pierdas el matiz al resumir.", language_code: es, direction: ltr}
          - content_key: es.c1.unit07.lesson01.teach.oficio_note
