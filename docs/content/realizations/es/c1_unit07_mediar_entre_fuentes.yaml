      - content_key: es.c1.unit07.lesson05.seleccionar_para_el_destinatario
        title: "Seleccionar para el destinatario"
        spine_outcome_id: universal.c1.mediation.mediate_and_synthesize_complex_sources
        teaching:
          - content_key: es.c1.unit07.lesson05.teach.elena_que_contamos
