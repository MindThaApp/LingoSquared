        teaching:
          - {content_key: es.a1.unit13.lesson04.teach.me_gusta_mi_trabajo, kind: phrase, target: {text: "Me gusta mi trabajo.", language_code: es, direction: ltr}, introduced_tokens: [Me, gusta, mi, trabajo]}
