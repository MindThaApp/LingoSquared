status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The office/workplace scenario shape and core vocabulary (el
    escritorio, la oficina) are scaffolded from the real, public-domain
    FSI Spanish Basic Course (Foreign Service Institute, 1961, US
    government work), Volume 1 (Units 1-15), Unit 5 "White's first day
    at work" (5.1 basic sentences, John White's first day in a shared
    office with José Molina -- "Juan, éste va a ser su escritorio,"
    small talk about where each is from) -- downloaded directly
    (firecrawl confirmed at 0/1000 credits again this session via
    `firecrawl --status`, so this used the documented WebSearch +
    direct-download + `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%201/Fsi-SpanishBasicCourse-Volume1-StudentText.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. The
    source unit is diplomatic-office small talk with no actual job-
    title vocabulary, so beyond the office/desk setting itself, this
    unit adds established-conventions-only job-title vocabulary
    (contador, profesora, trabajar, enseñar) to fit Elena and Mateo's
    own day jobs. No sentence or drill item was copied verbatim --
    every phrase below is freshly written for Elena and Mateo's own
    storyline (a workshop-break conversation about their day jobs) and
    modernized register (no 1961 diplomatic-office framing).
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Thirteenth Spanish A1 unit, continuing the Elena/Mateo cooking-
    workshop storyline with a break-time conversation during the 22
    July class, after unit12's cooking mishap and recovery. Realizes
    universal.a1.work.describe_job (no prerequisites per the spine).
    Establishes new facts: Mateo works as an accountant (contador) in
    an office in London; Elena works as a teacher (profesora) at a
    school in London -- both live in London (already established for
    Mateo in unit01; Elena's own city was never stated before, only
    that she's originally from Spain, so this is a new, non-
    contradicting addition, not a retcon). Authored fresh at schema_
    version 1.1 per AUTHORING_GUIDE §19. tú register throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches 5 work
    nouns (el trabajo, la oficina, el escritorio, la escuela, los
    estudiantes); 02 teaches job-title/action phrases (trabajar, Soy
    contador, Soy profesora, Enseño en una escuela); 03 teaches the
    core question-and-answer pattern (¿En qué trabajas? / Trabajo en
    una oficina. Soy contador.); 04 is a phrase lesson contrasting the
    day job with the cooking hobby (Me gusta mi trabajo, pero prefiero
    cocinar); 05 is a reading of a short paragraph about both their
    jobs; 06 is a dialogue capstone during the workshop break where
    Elena and Mateo talk about their jobs and agree they both prefer
    cooking together.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    contador/profesora for true-synonym risk -- they are two genuinely
    distinct professions (Mateo's vs. Elena's), not synonyms, and every
    slot testing one is anchored by an already-stated fact (which
    specific person's job is being described), never an open choice.
    §16: lesson01's matching_pairs uses all 5 work nouns plus 3 example
    sentences (8 pairs). §12: multi-clause accepted_answers (lesson04's
    job+preference sentences) have period/comma/conjunction-joined
    variants. No bare yes/no/true/false -- checked by hand.

    Internal consistency (§11): Mateo's Colombia-born/London-resident
    fact (unit01) and Elena's Spain-born fact (unit01) are never
    contradicted; Elena's workplace city (London) is a new fact
    consistent with (not contradicting) her being from Spain
    originally, mirroring Mateo's own established immigrant-in-London
    pattern. Job assignments are consistent throughout every exercise
    and the dialogue: Mateo is always the accountant, Elena is always
    the teacher, with no swap anywhere.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked canon against units 01-12, token introduction,
    accepted-answer coverage (§12), gendered answers, matching_pairs,
    and learner-visible notes for internal unit/lesson references;
    overlay en-es/a1_unit13.yaml reviewed alongside. Fixes:
    lesson05.teach.trabajos_reading -- "Elena enseña en una escuela,
    también en Londres." -> "Elena enseña en una escuela." (CANON
    CONTRADICTION: unit03 has Elena living with her grandparents "aquí
    en España", so the earlier claim above that her city was never
    stated is wrong; también dropped from introduced_tokens and the
    overlay gloss/glosses); lesson05.teach.a_los_dos_les_gusta_note --
    "(already used since unit06)" -> "(which you already know)". Overlay
    fixes: lesson02.exercise07.fill_soy_contador accepts "contadora"
    (prompt fixes no speaker);
    lesson06.exercise08.speak_conclude_prefer_cooking adds "(Entonces)
    los dos preferimos cocinar juntos.";
    lesson04.exercise07.speak_compare_work_and_cooking drops the
    half-answer "Prefiero cocinar." and adds "Me gusta mi trabajo. Pero
    prefiero cocinar."; lesson05.exercise07.write_trabajos_summary adds
    the no-comma "Mateo es contador y Elena es profesora.";
    lesson01.teach.los_estudiantes note corrected (estudiante, not
    estudiantes, is the invariable form); internal lessonNN/unitNN
    references removed from notes of
    lesson02.teach.enseno_en_una_escuela,
    lesson03.teach.trabajo_en_una_oficina_soy_contador,
    lesson04.teach.me_gusta_mi_trabajo,
    lesson04.teach.pero_prefiero_cocinar,
    lesson05.teach.trabajos_reading and
    lesson06.teach.line01/02/03/05/06/07. NATIVE FLAG: Spanish
    instruction prompt "Concluye" is untaught instruction language
    (English instruction carries the meaning). DEFERRED (owner
    decision): story-wide location canon -- unit01 has Mateo living in
    London, unit03 has the shared workshop "aquí en España", and this
    unit still places Mateo's office in London; where the Tuesday
    workshop is needs Ramin's call (would touch a1_unit01/a1_unit03,
    outside this batch).

