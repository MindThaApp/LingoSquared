      Elena: ¿En qué trabajas, Mateo?
      Mateo: Trabajo en una oficina. Soy contador.
      Elena: Interesante. Yo soy profesora. Enseño en una escuela.
      Mateo: ¿Te gusta enseñar?
      Elena: Sí, me gusta mucho, pero prefiero cocinar contigo los martes.
      Mateo: A mí también me gusta mi trabajo, pero prefiero cocinar.
      Elena: Entonces los dos preferimos esto.
      Mateo: Sí, definitivamente.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
