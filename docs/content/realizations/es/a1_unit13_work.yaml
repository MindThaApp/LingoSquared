          - {content_key: es.a1.unit13.lesson02.exercise06.order_enseno_en_una_escuela, type: word_order, tested_text: "Enseño en una escuela", prompt: {target_blocks: []}, word_bank: [Enseño, en, una, escuela]}
          - {content_key: es.a1.unit13.lesson02.exercise07.fill_soy_contador, type: fill_in_blank, tested_text: "Soy contador", prompt: {target_blocks: [{text: "Soy ___. (accountant, not teacher)", language_code: es, direction: ltr}]}}
