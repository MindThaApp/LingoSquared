          - {content_key: es.a1.unit13.lesson01.teach.la_oficina, kind: vocabulary, target: {text: "la oficina", language_code: es, direction: ltr}, introduced_tokens: [la, oficina], example: {text: "Trabajo en una oficina.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit13.lesson01.teach.el_escritorio, kind: vocabulary, target: {text: "el escritorio", language_code: es, direction: ltr}, introduced_tokens: [el, escritorio, Este, es, mi], example: {text: "Este es mi escritorio.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit13.lesson01.teach.la_escuela, kind: vocabulary, target: {text: "la escuela", language_code: es, direction: ltr}, introduced_tokens: [la, escuela, Enseño, en, una], example: {text: "Enseño en una escuela.", language_code: es, direction: ltr}}
