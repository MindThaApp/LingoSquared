            tested_text: "trabajo oficina escritorio escuela estudiantes"
            prompt: {target_blocks: []}
            pairs: [{left: "el trabajo", right: "the job / the work"}, {left: "la oficina", right: "the office"}, {left: "el escritorio", right: "the desk"}, {left: "la escuela", right: "the school"}, {left: "los estudiantes", right: "the students"}, {left: "Me gusta mi trabajo.", right: "I like my job."}, {left: "Este es mi escritorio.", right: "This is my desk."}, {left: "Tengo veinte estudiantes.", right: "I have twenty students."}]
          - {content_key: es.a1.unit13.lesson01.exercise05.order_trabajo_en_una_oficina, type: word_order, tested_text: "Trabajo en una oficina", prompt: {target_blocks: []}, word_bank: [Trabajo, en, una, oficina]}
          - {content_key: es.a1.unit13.lesson01.exercise06.translate_la_escuela, type: translation, tested_text: "la escuela", prompt: {target_blocks: [{text: "the school", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit13.lesson02.las_profesiones
        title: "Soy contador, soy profesora"
        spine_outcome_id: universal.a1.work.describe_job
        teaching:
          - {content_key: es.a1.unit13.lesson02.teach.trabajar, kind: phrase, target: {text: "trabajar", language_code: es, direction: ltr}, introduced_tokens: [trabajar]}
          - {content_key: es.a1.unit13.lesson02.teach.soy_contador, kind: phrase, target: {text: "Soy contador.", language_code: es, direction: ltr}, introduced_tokens: [Soy, contador]}
          - {content_key: es.a1.unit13.lesson02.teach.soy_profesora, kind: phrase, target: {text: "Soy profesora.", language_code: es, direction: ltr}, introduced_tokens: [Soy, profesora]}
          - {content_key: es.a1.unit13.lesson02.teach.enseno_en_una_escuela, kind: phrase, target: {text: "Enseño en una escuela.", language_code: es, direction: ltr}, introduced_tokens: [Enseño, en, una, escuela]}
          - content_key: es.a1.unit13.lesson02.teach.contador_vs_profesora_note
            kind: grammar_note
            target: {text: "Job titles use *ser* + profession, no article: *soy contador* (I'm an accountant), not *soy un contador*. *Contador* has a matching feminine form *contadora*; *profesor/profesora* is the equivalent -o/-a pair for \"teacher.\"", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
