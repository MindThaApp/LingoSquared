        exercises:
          - {content_key: es.a1.unit13.lesson01.exercise01.choose_el_trabajo, type: multiple_choice, tested_text: "el trabajo", prompt: {target_blocks: [{text: "the job / the work", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit13.lesson01.exercise02.choose_la_escuela, type: multiple_choice, tested_text: "la escuela", prompt: {target_blocks: [{text: "the school", language_code: en, direction: ltr}]}}
