course:
  realization_key: es.a1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Teach a neutral pan-Hispanic standard suitable for international
    communication. Present tú for informal peer relationships and usted for
    respectful or initially formal encounters. Avoid region-specific forms
    such as vos and vosotros in this introductory unit while acknowledging
    that actual usage varies across Spanish-speaking communities.

