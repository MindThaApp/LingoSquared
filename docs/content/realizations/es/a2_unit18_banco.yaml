target_language: es
cefr_level: A2
status: complete_draft
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The core A2 grammar pattern reused in this unit -- the conditional
    "me gustaría" (I would like) as a polite way to open a formal
    request, the same softening function as unit16's *quisiera*/
    *podría* -- is scaffolded from the real, public-domain FSI Spanish
    Basic Course (Foreign Service Institute, 1961+ revisions, US
    government work), Volume 4 (Units 46-55), §48.16 "The conditional
    tense" (line ~3812: "A mí me gustaría ir también" illustrates the
    identical *me gustaría* + infinitive construction) -- downloaded
    directly (firecrawl confirmed at 0/1000 credits via `firecrawl
    --status`, so this used the documented WebSearch + direct-download +
    `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%204/FSI%20-%20Spanish%20Basic%20Course%20-%20Volume%204%20-%20Student%20Text.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. Only the
    grammar POINT (me gustaría + infinitive as a polite opener) is
    reused, not any scenario or sentence -- the FSI line illustrating it
    is about wanting to go somewhere, unrelated to banking. The banking
    scenario, vocabulary (abrir una cuenta, la tarjeta de débito, el
    saldo), and every sentence are freshly written for Mateo's own
    storyline, reflecting 2020s banking practice with no FSI equivalent.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Third Spanish A2 unit (spine outcome:
    universal.a2.banking.open_bank_account), continuing directly from
    unit16: now registered at his new address, Mateo opens a bank
    account in London. A2-level complexity continues the polite-
    conditional pattern from unit16 (*me gustaría*, another softened
    request alongside *quisiera*/*podría*) plus new formal-register
    vocabulary for account features. Authored fresh at schema_version
    1.1 per AUTHORING_GUIDE §19. tú register continues between Elena
    and Mateo; usted (formal) is used with the bank employee throughout,
    matching unit16's own precedent for institutional exchanges.

    Six lessons, recognition->drag->production (§2): 01 teaches bank
    vocabulary and the *me gustaría* request; 02 teaches the documents/
    identity question-and-answer; 03 is the account-features vocabulary
    lesson (tarjeta de débito, saldo); 04 teaches a follow-up formal
    question-and-answer about online banking; 05 is a reading of an
    account-features leaflet; 06 is a dialogue capstone of Mateo's
    actual bank visit.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    me gustaría/quisiera for true-synonym risk -- both are polite
    conditional openers but grammatically distinct (me gustaría +
    infinitive vs. quisiera + infinitive, interchangeable in THIS
    specific frame in real usage) -- since they ARE genuinely
    interchangeable as openers for "I would like to open an account,"
    no exercise tests choosing between them; each is only ever tested
    against its own fixed sentence, never against the other as a
    distractor option for the same meaning. §16: lesson03's and
    lesson05's matching_pairs pool the unit's vocabulary so far (7
    pairs each). §12: multi-clause accepted_answers (lesson06's summary
    lines) have period/comma/conjunction-joined variants. No bare
    yes/no/true/false -- checked by hand (including the lesson04 "no"
    token, learned from unit17's real validator catch, quoted
    throughout).

    Internal consistency (§11): Mateo's already-established facts
    (Colombia-born, London-resident, accountant, new address from
    unit14/16) are never touched or contradicted; this unit only adds
    that he now holds a UK bank account. The account-opening reason
    given (his new address needs a linked local account) is consistent
    with unit16's registration, not a new unrelated plot thread.

    Listening-integrity check: lesson06's dialogue_comprehension
    exercises test facts via English answer options, not literal
    same-speaker quote picks, so the same-speaker-distractor collision
    bug class does not apply here.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grammar notes, accepted-answer coverage, prompt
    determinacy and learner-visible internal ids for this unit and
    its en-es overlay. Fixes in this file:
    lesson01.teach.me_gustaria_note no longer restates quisiera as a
    conditional; lesson03.exercise06.writing_describe_card and
    lesson05.exercise07.write_account_benefit prompt target_blocks
    re-pinned to match their overlay instructions (see overlay
    note). DEFERRED: none for this unit. NATIVE FLAGS: none new.

