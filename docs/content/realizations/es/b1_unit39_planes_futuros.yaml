            kind: reading
            target: {text: "El tren sale a las ocho mañana. Voy a buscar un trabajo nuevo este año. Probablemente lloverá el fin de semana.", language_code: es, direction: ltr}
            introduced_tokens: [El, tren, sale, a, las, ocho, mañana, Voy, buscar, un, trabajo, nuevo, este, año, Probablemente, lloverá, fin, de, semana]
        exercises:
