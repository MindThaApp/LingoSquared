            example: {text: "Descanso el fin de semana." , language_code: es, direction: ltr}
          - content_key: es.b1.unit39.lesson03.teach.prediction
            kind: phrase
            target: {text: "Probablemente lloverá el fin de semana.", language_code: es, direction: ltr}
            introduced_tokens: [Probablemente, lloverá, el, fin, de, semana]
        exercises:
          - {content_key: es.b1.unit39.lesson03.exercise01.choose_prediction, type: multiple_choice, tested_text: "Probablemente lloverá el fin de semana", prompt: {target_blocks: [{text: "Which sentence means \"it will probably rain this weekend\" (an uncertain prediction)?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit39.lesson03.exercise02.listen_prediction, type: listen_select, tested_text: "Probablemente lloverá el fin de semana", media_asset_key: es.b1.audio.planes_futuros.probablemente_lloveremos.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit39.lesson03.exercise03.match_prediction
            type: matching_pairs
            tested_text: "probablemente lloverá fin semana"
            prompt: {target_blocks: []}
            pairs: [{left: "probablemente", right: "probably"}, {left: "lloverá", right: "it will rain"}, {left: "el fin de semana", right: "this weekend"}, {left: "Probablemente lloverá", right: "it will probably rain"}, {left: "Probablemente lloverá el fin de semana", right: "it will probably rain this weekend"}]
          - {content_key: es.b1.unit39.lesson03.exercise04.order_prediction, type: word_order, tested_text: "Probablemente lloverá el fin de semana", prompt: {target_blocks: []}, word_bank: [Probablemente, lloverá, el, fin, de, semana]}
          - {content_key: es.b1.unit39.lesson03.exercise05.translate_prediction, type: translation, tested_text: "Probablemente lloverá el fin de semana", prompt: {target_blocks: [{text: "Translate to Spanish, making an uncertain prediction: It will probably rain this weekend.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit39.lesson04.el_plan_completo
        title: "El plan completo"
        spine_outcome_id: universal.b1.future.describe_plans_intentions_and_predictions
        teaching:
