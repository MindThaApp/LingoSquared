schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Authored fresh, contrasting three future-reference forms (presente
    con valor de futuro for fixed arrangements, ir a + infinitivo for
    intentions, futuro simple + "probablemente"/"seguramente" for
    uncertain predictions). No other language unit was consulted.
review:
  status: reviewed
  required_next_reviewer: codex
  notes: >-
    Realizes universal.b1.future.describe_plans_intentions_and_predictions
    literally: learners distinguish a fixed arrangement, an intention, and
    a probable/uncertain prediction using the target language's
    future-reference forms and certainty markers. Character canon checked
    on disk and preserved (grep of a1_unit13_work.yaml,
    b1_unit27/29/33/35/36/37/38): Elena is a Spanish teacher living in
    London; Mateo is a Colombian accountant living in London; tú register
    between them as established peers. No new facts contradicted. The
    culminating exercise (lesson04) requires a single message containing
    all three can_do components literally: a fixed arrangement, an
    intention, and an uncertain prediction, each with its own
    future-reference form and certainty marker.
course:
  realization_key: es.b1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Elena and Mateo use tú as established peers (informal register),
    matching the precedent set across b1_unit27/29/33/35/36/37/38.
media_assets:
  - {content_key: es.b1.audio.planes_futuros.el_tren_sale.01, language: es, text: "El tren sale a las ocho mañana.", voice_hint: neutral_adult_planning, status: pending_generation}
  - {content_key: es.b1.audio.planes_futuros.voy_a_buscar.01, language: es, text: "Voy a buscar un trabajo nuevo este año.", voice_hint: neutral_adult_planning, status: pending_generation}
  - {content_key: es.b1.audio.planes_futuros.probablemente_lloveremos.01, language: es, text: "Probablemente lloverá el fin de semana.", voice_hint: neutral_adult_planning, status: pending_generation}
  - {content_key: es.b1.audio.planes_futuros.mensaje_completo.01, language: es, text: "El tren sale a las ocho mañana. Voy a buscar un trabajo nuevo este año. Probablemente lloverá el fin de semana.", voice_hint: neutral_adult_planning, status: pending_generation}
units:
  - content_key: es.b1.unit39.planes_futuros
    title: "Planes futuros"
    section: speaking
    spine_outcome_ids: [universal.b1.future.describe_plans_intentions_and_predictions]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit39.lesson01.el_tren_sale
        title: "El tren sale..."
        spine_outcome_id: universal.b1.future.describe_plans_intentions_and_predictions
        teaching:
          - content_key: es.b1.unit39.lesson01.teach.el_tren
            kind: vocabulary
            target: {text: "el tren", language_code: es, direction: ltr}
            introduced_tokens: [el, tren]
            example: {text: "El tren llega tarde.", language_code: es, direction: ltr}
          - content_key: es.b1.unit39.lesson01.teach.sale
            kind: vocabulary
            target: {text: "sale", language_code: es, direction: ltr}
            introduced_tokens: [sale]
            example: {text: "El autobús sale ahora.", language_code: es, direction: ltr}
          - content_key: es.b1.unit39.lesson01.teach.a_las_ocho
            kind: vocabulary
            target: {text: "a las ocho", language_code: es, direction: ltr}
            introduced_tokens: [a, las, ocho]
            example: {text: "Llego a las ocho.", language_code: es, direction: ltr}
          - content_key: es.b1.unit39.lesson01.teach.manana
            kind: vocabulary
            target: {text: "mañana", language_code: es, direction: ltr}
            introduced_tokens: [mañana]
            example: {text: "Nos vemos mañana.", language_code: es, direction: ltr}
          - content_key: es.b1.unit39.lesson01.teach.fixed_arrangement
            kind: phrase
            target: {text: "El tren sale a las ocho mañana.", language_code: es, direction: ltr}
            introduced_tokens: [El, tren, sale, a, las, ocho, mañana]
          - content_key: es.b1.unit39.lesson01.teach.grammar_note
            kind: grammar_note
            target: {text: "Spanish uses the simple present tense for a fixed, scheduled arrangement, just like a timetable.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit39.lesson01.exercise01.choose_arrangement, type: multiple_choice, tested_text: "El tren sale a las ocho mañana", prompt: {target_blocks: [{text: "Which sentence means \"the train leaves at eight tomorrow\" (a fixed arrangement)?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit39.lesson01.exercise02.listen_arrangement, type: listen_select, tested_text: "El tren sale a las ocho mañana", media_asset_key: es.b1.audio.planes_futuros.el_tren_sale.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit39.lesson01.exercise03.match_arrangement
            type: matching_pairs
            tested_text: "tren sale ocho mañana"
            prompt: {target_blocks: []}
            pairs: [{left: "el tren", right: "the train"}, {left: "sale", right: "leaves"}, {left: "a las ocho", right: "at eight"}, {left: "mañana", right: "tomorrow"}, {left: "El tren sale a las ocho mañana", right: "the train leaves at eight tomorrow"}]
          - {content_key: es.b1.unit39.lesson01.exercise04.order_arrangement, type: word_order, tested_text: "El tren sale a las ocho mañana", prompt: {target_blocks: []}, word_bank: [El, tren, sale, a, las, ocho, mañana]}
          - {content_key: es.b1.unit39.lesson01.exercise05.translate_arrangement, type: translation, tested_text: "El tren sale a las ocho mañana", prompt: {target_blocks: [{text: "Translate to Spanish, stating a fixed scheduled arrangement: The train leaves at eight tomorrow.", language_code: en, direction: ltr}]}}

