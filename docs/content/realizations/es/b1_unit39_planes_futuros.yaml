          - {content_key: es.b1.unit39.lesson04.exercise04.order_prediction_2, type: word_order, tested_text: "Probablemente lloverá el fin de semana", prompt: {target_blocks: []}, word_bank: [Probablemente, lloverá, el, fin, de, semana]}
          - {content_key: es.b1.unit39.lesson04.exercise05.write_culminating_planes, type: writing_prompt, tested_text: "El tren sale a las ocho mañana Voy a buscar un trabajo nuevo este año Probablemente lloverá el fin de semana", prompt: {target_blocks: [{text: "Write a short message in Spanish about your week. It must contain exactly these three parts in order: (1) a fixed scheduled arrangement, using \"El tren sale a las ocho mañana\"; (2) a personal intention, using \"Voy a buscar un trabajo nuevo este año\"; (3) an uncertain prediction with a certainty marker, using \"Probablemente lloverá el fin de semana\".", language_code: en, direction: ltr}]}}
