          - content_key: es.b1.unit39.lesson02.exercise03.match_intention
            type: matching_pairs
            tested_text: "voy buscar trabajo nuevo año"
            prompt: {target_blocks: []}
            pairs: [{left: "voy a buscar", right: "I'm going to look for"}, {left: "un trabajo nuevo", right: "a new job"}, {left: "este año", right: "this year"}, {left: "buscar", right: "to look for"}, {left: "Voy a buscar un trabajo nuevo este año", right: "I'm going to look for a new job this year"}]
          - {content_key: es.b1.unit39.lesson02.exercise04.order_intention, type: word_order, tested_text: "Voy a buscar un trabajo nuevo este año", prompt: {target_blocks: []}, word_bank: [Voy, a, buscar, un, trabajo, nuevo, este, año]}
          - {content_key: es.b1.unit39.lesson02.exercise05.fill_voy, type: fill_in_blank, tested_text: "Voy a buscar un trabajo nuevo este año", prompt: {target_blocks: [{text: "___ a buscar un trabajo nuevo este año. (I'm going)", language_code: es, direction: ltr}]}}

