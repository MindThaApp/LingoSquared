          - content_key: es.c1.unit03.lesson01.teach.el_destinatario
            kind: vocabulary
            target: {text: "el destinatario", language_code: es, direction: ltr}
            introduced_tokens: [destinatario, con]
            example: {text: "El registro depende del destinatario.", language_code: es, direction: ltr}
          - content_key: es.c1.unit03.lesson01.teach.la_cortesia
            kind: vocabulary
            target: {text: "la cortesía", language_code: es, direction: ltr}
            introduced_tokens: [cortesía, exige, respetuoso]
            example: {text: "La cortesía exige un trato respetuoso.", language_code: es, direction: ltr}
          - content_key: es.c1.unit03.lesson01.teach.registro_note
            kind: grammar_note
            target: {text: "El registro cambia según el destinatario: formal, diplomático, irónico o enfático.", language_code: es, direction: ltr}
            introduced_tokens: [cambia, según, diplomático, irónico, enfático]
        exercises:
          - content_key: es.c1.unit03.lesson01.exercise01.recognize_registro
            type: multiple_choice
            tested_text: "el registro"
            prompt: {target_blocks: [{text: "el registro", language_code: es, direction: ltr}]}
          - content_key: es.c1.unit03.lesson01.exercise02.recognize_formal
            type: multiple_choice
            tested_text: "formal"
            prompt: {target_blocks: [{text: "formal", language_code: es, direction: ltr}]}
          - content_key: es.c1.unit03.lesson01.exercise03.match_registros
            type: matching_pairs
            tested_text: "el registro formal informal el trato el destinatario la cortesía"
            prompt: {target_blocks: []}
            pairs:
              - {left: "el registro", right: "register / style of language"}
              - {left: formal, right: formal}
              - {left: informal, right: informal}
              - {left: "el trato", right: "manner of address"}
              - {left: "el destinatario", right: "the addressee / recipient"}
              - {left: "la cortesía", right: "courtesy / politeness"}
          - content_key: es.c1.unit03.lesson01.exercise04.order_registro
