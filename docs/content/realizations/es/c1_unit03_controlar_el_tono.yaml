generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1 unit 03, the third C1 unit in the
    es lane. Sourcing attempted: a firecrawl search for public-domain
    advanced/C1 Spanish register-and-tone material returned only commercial
    and non-public-domain hits (Instituto Cervantes New York, study.com,
    Lengalia, and YouTube) -- none usable; the only verified public-domain
    Spanish source (FSI Spanish Basic Course, per AUTHORING_GUIDE 10) caps at
    intermediate and cannot scaffold C1 register-control content. No usable
    public-domain C1 Spanish source was found, so this is
    established-conventions-only authoring, built from general knowledge of
    Spanish register/tone conventions, using unit02 (leer_entre_lineas) as
    the assigned structural exemplar for pacing and exercise depth only --
    every word of Spanish text is freshly authored, not translated from any
    other lane, and the scenario is unrelated to unit02's. Elena and Mateo
    continue as the established es characters (informal tu register: Elena is
    a Spanish teacher in London, Mateo is a Colombian accountant in London
    who works in an office -- profile set in b1_unit44 and earlier); they
    address each other with tu as always, while the unit teaches them to
    SHIFT into formal usted, diplomatic, ironic, and emphatic registers when
    writing and speaking to their landlord (el propietario, señor García),
    whose heating has been broken for a week. No sibling-direction file
    (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness and correct informal-tu register of the Elena/Mateo frame
    narration, AND that the formal usted / diplomatic / emphatic / ironic
    content taught inside the unit is correctly conjugated (usted uses
    third-person verb forms: le, su, agradecería, solucionara); (2) that each
    register marker (usted, le escribo para informarle, le agradecería que,
    atentamente, me gustaría señalar, quizá, podría, con todo respeto, entiendo
    que, ya es suficiente, estamos hartos, exigimos, de ninguna manera, qué
    maravilla, total solo hace frío) reads as current pan-Hispanic Spanish and
    actually conveys the intended register; (3) the lesson06 culminating
    listening/speaking/writing answers are graded against fixed strings --
    confirm the accepted-answer punctuation variants cover what a correct
    learner would type; (4) the two lesson05 reading texts (formal email vs
    informal message) genuinely contrast the same communicative goal in
    different registers; (5) confirm "total, solo hace frío" and "qué
    maravilla de atención al cliente" read as intended (ironic), not as
    anglicisms.
  notes: >-
    Third Spanish C1 unit. Targets the CEFR C1 register outcome
    (universal.c1.register.control_tone_and_register_precisely): exercise
    fine-grained control of tone and register, shifting between formal,
    diplomatic, ironic, and emphatic styles to suit audience and intent.
    Theme: one coherent situation across all six lessons -- Elena and Mateo's
    flat (or building) heating has been broken for a week and their landlord,
    señor García, keeps ignoring them; they must write a formal complaint
    while, among themselves, they vent emphatically and ironically, and they
    practise shifting the SAME core message (la calefacción está rota,
    arréglenla) across the four registers. Lesson arc mirrors the outcome's
    own assessment requirements: L01 the concept and the four registers
    (el registro, formal, informal, el trato, el destinatario, la cortesía);
    L02 the formal usted register (usted, le, Estimado señor García, le
    escribo para informarle, le agradecería que, atentamente); L03 the
    diplomatic register (me gustaría señalar, quizá, podría, con todo
    respeto, entiendo que); L04 the expressive registers, emphatic and ironic
    (ya es suficiente, estamos hartos, exigimos, de ninguna manera; qué
    maravilla, total solo hace frío); L05 reading -- comparing a formal email
    and an informal message with the same goal, determining audience, intent
    and appropriacy; L06 the culminating production -- a listening exchange
    that distinguishes tones, a speaking task that delivers the same message
    diplomatically then emphatically, a writing task that rewrites a direct
    message in a diplomatic formal style and an ironic style, and a dictation.
    Register: informal tu throughout the Elena/Mateo frame narration and
    instructions (es lane precedent); the formal usted, diplomatic, ironic and
    emphatic registers are taught and tested INSIDE the unit's own exercises
    as the target content the outcome requires. All vocabulary is introduced
    self-contained within this file (C1 is a separate Course row from B1/B2,
    so a C1 learner never sees lower-tier lexemes at runtime); common words
    already introduced in c1_unit01/c1_unit02 are reused per the
    cumulative-vocabulary rule.

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout for the lane's frame narration and instructions
    (es lane precedent from b1_unit27/29/33 and b2_unit01). Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2 units. This unit is specifically ABOUT register control: within its
    OWN exercises it teaches and tests the formal usted register (usted, le,
    su, third-person verb forms such as agradecería / solucionara) and the
    diplomatic, ironic, and emphatic styles as target registers the learner
    must recognize and produce -- distinct from the lane's default informal
    tu used in the Elena/Mateo frame dialogue and in instructions. No
    vosotros. The formal register appears where the scenario warrants it
    (writing and speaking to the landlord, señor García); the informal tu
    frame does not leak into the formal target content, and vice versa.

