          - {"content_key": "es.a2.unit109.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Mi abuela dice que mañana hace sol. ¿Y qué más dice? Dice que el pueblo está muy bonito. Pregunta si vienes con nosotros. ¿A qué hora sale el tren? Dice que sale a las nueve. Entonces voy contigo.", "prompt": {"target_blocks": []}, "pairs": [{"left": "Mi abuela dice que mañana hace sol.", "right": "My grandmother says that it is sunny tomorrow."}, {"left": "¿Y qué más dice?", "right": "And what else does she say?"}, {"left": "Dice que el pueblo está muy bonito.", "right": "She says that the village looks very nice."}, {"left": "Pregunta si vienes con nosotros.", "right": "She asks if you are coming with us."}, {"left": "¿A qué hora sale el tren?", "right": "What time does the train leave?"}, {"left": "Dice que sale a las nueve.", "right": "She says that it leaves at nine."}, {"left": "Entonces voy contigo.", "right": "Then I am going with you."}]}
