        teaching:
          - {"content_key": "es.a2.unit109.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Hola, Mateo. Mi abuela llama y dice que mañana hace sol.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Hola", "Mateo", "Mi", "abuela", "llama", "y", "dice", "que", "mañana", "hace", "sol"]}
