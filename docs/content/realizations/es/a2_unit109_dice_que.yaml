          - {"content_key": "es.a2.unit109.lesson06.exercise05.responde_mas", "type": "dialogue_response", "tested_text": "Dice que el pueblo está muy bonito Y pregunta si vienes con nosotros", "prompt": {"target_blocks": [{"text": "¿Y qué más dice?", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit109.lesson06.exercise06.traduce_hora", "type": "translation", "tested_text": "Mi abuela dice que el tren sale a las nueve", "prompt": {"target_blocks": [{"text": "My grandmother says that the train leaves at nine.", "language_code": "en", "direction": "ltr"}]}}
