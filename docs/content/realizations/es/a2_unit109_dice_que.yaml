          - {"content_key": "es.a2.unit109.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Dice que el pueblo está muy bonito. Y pregunta si vienes con nosotros.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Dice", "que", "el", "pueblo", "está", "muy", "bonito", "Y", "pregunta", "si", "vienes", "con", "nosotros"]}
          - {"content_key": "es.a2.unit109.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "¡Qué amable! ¿A qué hora sale el tren?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Qué", "amable", "A", "qué", "hora", "sale", "el", "tren"]}
          - {"content_key": "es.a2.unit109.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Mi abuela dice que sale a las nueve.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Mi", "abuela", "dice", "que", "sale", "a", "las", "nueve"]}
          - {"content_key": "es.a2.unit109.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Perfecto. Entonces voy contigo.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Perfecto", "Entonces", "voy", "contigo"]}
        exercises:
