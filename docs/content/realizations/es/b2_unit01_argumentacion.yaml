status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    From-scratch generation, not adapted from a source. This is es's
    first B2 unit. No adaptable upper-intermediate public-domain Spanish
    source was consulted for this file (the FSI Spanish Basic Course used
    to scaffold es's A1/B1 lane is beginner/intermediate; this is a
    genuinely new tier). Built from general Spanish grammar/discourse
    knowledge, mirroring nl's shipped B2 unit01 (argumentatie) as the
    assigned structural exemplar (lesson arc, exercise-type pacing,
    spine-outcome sequencing) per the dispatch instructions -- every
    sentence of actual Spanish text is freshly authored, not translated
    from the Dutch. Elena and Mateo continue as the established es B1
    characters (informal tu register, set in b1_unit44 and earlier B1
    units); no sibling-direction file (es-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of every connective frame (por un
    lado / por otro lado, eso no quita que, en resumen) and that informal
    tu register is consistent and correctly conjugated throughout; (2)
    lesson04.exercise06 (eso no quita que + indicative "la libertad
    pesa") -- prescriptive grammars call for the subjunctive here (pese);
    this file deliberately uses the indicative as the common colloquial
    register matching Elena/Mateo's informal speech, but confirm this
    reads as natural rather than as an error to a native ear, or decide
    whether to switch to subjunctive and note that as a distinct,
    not-yet-taught grammar point; (3) the culminating writing exercise
    (lesson06.exercise06) is graded against a fixed multi-sentence
    string -- confirm the accepted-answer punctuation variants are
    complete enough that a correct learner is never marked wrong; (4)
    confirm "hacer videollamadas", "según las investigaciones", and
    "algo de razon tienes" read as current everyday pan-Hispanic Spanish.
  notes: >-
    First Spanish B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence): state
    a claim, support it with reasons/evidence, acknowledge the strongest
    opposing point, and rebut it without conceding. Theme: el teletrabajo
    (working from home) -- one coherent debatable everyday issue across
    all six lessons. Lesson arc mirrors the argument structure itself:
    L01 stating a claim (creo que / en mi opinion), L02 supporting it (en
    primer lugar / por ejemplo / segun las investigaciones), L03
    acknowledging the opposing point (por un lado ... por otro lado /
    aunque / claro que / es cierto que), L04 rebutting without conceding
    (sin embargo / no obstante / en cambio / eso no quita que / en
    resumen), L05 an argumentative reading text (distinguish the
    author's claim from the objection answered), L06 the culminating
    production -- an Elena/Mateo debate for the listening requirement
    plus a speaking task and a writing task that each require a FULL
    argument (claim + support + acknowledged objection + rebuttal), not
    just connective drilling. Register: informal tu throughout, per the
    es lane's established B1 precedent; Elena and Mateo continue that
    register. All vocabulary is introduced self-contained within this
    file (B2 is a separate Course row from B1, so a B2 learner never
    sees B1 lexemes at runtime).

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked realization + en-es overlay for unit01 (grading/accepted
    answers, matching-pair discriminability, glosses, learner-visible
    notes, token coverage, reading-passage visibility). Fixes:
    lesson05.exercise06.translate_convencida accepted answers widened
    with masculine 'Estoy convencido de que es un buen desarrollo';
    lesson02.exercise07.write_two_reasons accepts 'eres mas
    productiva'; lesson01.teach.estoy_de_acuerdo note corrected (con =
    agree WITH something, not disagree);
    lesson04.exercise03.match_rebuttal_words: 'no
    obstante'/nevertheless pair (interchangeable with sin
    embargo/however) replaced by 'pesar mas que'/'to weigh more than'
    in pairs, tested_text and overlay value;
    lesson02.exercise03.match_argument_words: ya que right side now
    'since / given that (usually opens the sentence)';
    lesson05.teach.texto gloss videollamadas = 'video calls';
    lesson04.teach.eso_no_quita_que note now states the standard
    subjunctive and that the indicative is a relaxed-speech variant;
    companeros and grammar_argumento_completo notes no longer describe
    course construction; lesson05.exercise01-04 reading_comprehension
    prompts now carry the Spanish passage as the first target_block
    before the question. NATIVE FLAGS: eso no quita que + indicative
    throughout (lesson04.teach.grammar_rebatir, lesson05 reading,
    lesson06 dialogue and audio
    es.b2.audio.argumentacion.dialogo.teletrabajo.01,
    lesson06.exercise04 word bank offers only 'puedes');
    lesson03.exercise04 'Claro que echas de menos a tus companeros a
    veces' is also a valid tile order but only one is accepted;
    lesson01.exercise03 'el teletrabajo' vs 'trabajar desde casa'
    glosses are close. DEFERRED: switching the unit to eso no quita
    que + subjunctive (text with audio asset; needs native
    confirmation and re-voicing) including the lesson06.exercise04
    word_order tiles; lesson04.exercise06 already accepts 'pese'.

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent from b1_unit27/29/33 etc.).
    B2 argumentation layers discourse connectives and signposting onto
    that register -- en primer lugar, por ejemplo, por un lado ... por
    otro lado, sin embargo, en resumen -- while keeping everyday informal
    address (ahorras, echas de menos). Elena and Mateo continue the
    informal tu they use with each other throughout the es B1 units.

