    language: es
    text: "Claro que a veces echas de menos el contacto con tus compañeros."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.b2.audio.argumentacion.sin_embargo_ventajas.01
    language: es
    text: "Sin embargo, las ventajas pesan más que los inconvenientes."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.b2.audio.argumentacion.dialogo.teletrabajo.01
    language: es
    text: >-
      Elena: Creo que trabajar desde casa es mejor que ir a la oficina.
      Mateo: ¿Por qué crees eso? Elena: En primer lugar, ahorras mucho
      tiempo de trayecto, y según las investigaciones, quienes trabajan
      desde casa son más productivos. Mateo: Por otro lado, echas de
      menos el contacto con tus compañeros. Elena: Es cierto, pero eso
      no quita que puedes hacer videollamadas. En resumen, las ventajas
      pesan más. Mateo: Algo de razón tienes.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: es.b2.unit01.argumentacion
    title: "Argumentar"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.argumentation.defend_a_position_with_evidence
    planned_lesson_count: 6

    lessons:
      - content_key: es.b2.unit01.lesson01.tomar_postura
        title: "Tomar una postura"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: es.b2.unit01.lesson01.teach.teletrabajo
            kind: vocabulary
            target: {text: "el teletrabajo", language_code: es, direction: ltr}
            introduced_tokens: [el, teletrabajo]
            example: {text: "El teletrabajo ahorra tiempo.", language_code: es, direction: ltr}
          - content_key: es.b2.unit01.lesson01.teach.ir_a_la_oficina
            kind: phrase
            target: {text: "ir a la oficina", language_code: es, direction: ltr}
            introduced_tokens: [ir, a, la, oficina]
          - content_key: es.b2.unit01.lesson01.teach.postura
            kind: vocabulary
            target: {text: "una postura", language_code: es, direction: ltr}
            introduced_tokens: [una, postura]
            example: {text: "Tengo una postura clara.", language_code: es, direction: ltr}
          - content_key: es.b2.unit01.lesson01.teach.creo_que
            kind: phrase
            target: {text: "Creo que...", language_code: es, direction: ltr}
            introduced_tokens: [creo, que]
          - content_key: es.b2.unit01.lesson01.teach.en_mi_opinion
            kind: phrase
            target: {text: "En mi opinión...", language_code: es, direction: ltr}
            introduced_tokens: [en, mi, opinión]
          - content_key: es.b2.unit01.lesson01.teach.mejor_que
            kind: vocabulary
            target: {text: "mejor que", language_code: es, direction: ltr}
            introduced_tokens: [mejor]
            example: {text: "Esta opción es mejor.", language_code: es, direction: ltr}
          - content_key: es.b2.unit01.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Creo que trabajar desde casa es mejor que ir a la oficina.", language_code: es, direction: ltr}
            introduced_tokens: [trabajar, desde, casa, es]
          - content_key: es.b2.unit01.lesson01.teach.estoy_de_acuerdo
            kind: phrase
            target: {text: "Estoy de acuerdo.", language_code: es, direction: ltr}
            introduced_tokens: [estoy, de, acuerdo]
          - content_key: es.b2.unit01.lesson01.teach.grammar_postura
            kind: grammar_note
            target: {text: "Creo que trabajar desde casa es mejor que ir a la oficina. En mi opinión, eso es mejor.", language_code: es, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: es.b2.unit01.lesson01.exercise01.recognize_postura
            type: multiple_choice
            tested_text: postura
            prompt: {target_blocks: [{text: postura, language_code: es, direction: ltr}]}
          - content_key: es.b2.unit01.lesson01.exercise02.listen_claim
            type: listen_select
            tested_text: "Creo que trabajar desde casa es mejor que ir a la oficina"
            media_asset_key: es.b2.audio.argumentacion.postura_teletrabajo.01
            prompt: {target_blocks: []}
          - content_key: es.b2.unit01.lesson01.exercise03.match_claim_words
            type: matching_pairs
            tested_text: "el teletrabajo ir a la oficina una postura creo que en mi opinión mejor trabajar desde casa estoy de acuerdo"
            prompt: {target_blocks: []}
            pairs:
              - {left: "el teletrabajo", right: "working from home"}
              - {left: "ir a la oficina", right: "to go to the office"}
              - {left: "una postura", right: "a position / viewpoint"}
              - {left: "Creo que...", right: "I think that..."}
              - {left: "En mi opinión...", right: "In my opinion..."}
              - {left: "mejor que", right: "better than"}
              - {left: "trabajar desde casa", right: "to work from home"}
              - {left: "Estoy de acuerdo.", right: "I agree."}
          - content_key: es.b2.unit01.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Creo que trabajar desde casa es mejor"
            prompt: {target_blocks: []}
            word_bank: [Creo, que, trabajar, desde, casa, es, mejor]
          - content_key: es.b2.unit01.lesson01.exercise05.translate_en_mi_opinion
            type: translation
            tested_text: "En mi opinión, trabajar desde casa es mejor"
            prompt: {target_blocks: [{text: "In my opinion, working from home is better.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit01.lesson01.exercise06.speak_estoy_de_acuerdo
