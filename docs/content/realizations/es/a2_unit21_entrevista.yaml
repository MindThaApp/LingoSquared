generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    This unit's core vocabulary and one grammar pattern are scaffolded
    from the real, public-domain FSI Spanish Basic Course (Foreign
    Service Institute, 1961+ revisions, US government work), Volume 4
    (Units 46-55): *el sueldo* (the salary, glossary line ~3646) and
    *el empleo* (the employment/job, glossary line ~8830) are both real
    FSI-glossed vocabulary items, an interview narrative is referenced
    directly at lines ~1197 and ~10098 ("...toda la conversación que
    usted tuvo en la entrevista con el Sr. Jaramillo," "...lo que pasó
    en la entrevista con el Sr. Ramírez"), and the *me gustaría*
    conditional-politeness pattern already used in unit18 extends
    naturally to a candidate's own interview self-introduction --
    downloaded directly (firecrawl confirmed at 0/1000 credits via
    `firecrawl --status`, so this used the documented WebSearch +
    direct-download + `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%204/FSI%20-%20Spanish%20Basic%20Course%20-%20Volume%204%20-%20Student%20Text.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. Only the
    vocabulary items and the general "job interview" scenario frame are
    reused, not any drill sentence -- the FSI lines referencing
    interviews are narrative prompts asking a student to retell what
    happened, not actual interview dialogue to adapt. Every sentence,
    the specific role (a teaching position at a different school), and
    the whole Elena storyline are freshly written.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Sixth and final Spanish A2 unit of this batch (spine outcome:
    universal.a2.employment.attend_job_interview), a new scenario for
    Elena: continuing from unit13's established fact that she works as
    a teacher (profesora) at a school in London, she interviews for a
    new teaching position at a different, better-located school. A2-
    level complexity: describing years of experience with *desde hace*
    (a duration-since-now construction, distinct from unit16/19's
    *desde* + fixed point in time), and the *me gustaría* polite-
    conditional pattern from unit18 reused for a candidate's self-
    introduction rather than a service request. Authored fresh at
    schema_version 1.1 per AUTHORING_GUIDE §19. tú register continues
    in the surrounding storyline; usted (formal) is used between Elena
    and the interviewer throughout, matching this batch's institutional-
    exchange precedent (unit16/18/19/20).

    Six lessons, recognition->drag->production (§2): 01 teaches
    interview vocabulary and the *me gustaría* self-introduction; 02
    teaches describing experience with *desde hace*; 03 is the
    interviewer's formal question-and-answer pattern about interest in
    the role; 04 teaches asking a clarifying question about availability
    and schedule; 05 is a reading of the job posting itself; 06 is a
    dialogue capstone of Elena's actual interview.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    puesto/empleo for true-synonym risk -- both can mean "job/position"
    in general Spanish, but in THIS unit's frames they're used in
    genuinely distinct contexts (puesto = the specific advertised
    position being interviewed for; empleo = employment/work in
    general, in the FSI-sourced vocabulary sense) with no exercise
    testing choosing between them for the same sentence -- each is
    tested only against its own fixed sentence. §16: lesson03's and
    lesson05's matching_pairs pool the unit's vocabulary so far (6-7
    pairs each). §12: multi-clause accepted_answers (lesson06's summary
    lines) have period/comma/conjunction-joined variants. No bare
    yes/no/true/false -- checked by hand throughout.

    Internal consistency (§11): Elena's years of teaching experience
    ("desde hace tres años," for three years) is stated consistently
    across lesson02's teaching example, lesson05's reading (implicitly,
    as the posting's own required experience), and lesson06's dialogue
    -- never changed anywhere. This is a new job SEARCH, not a
    retcon of unit13's established fact that she currently works as a
    teacher -- the posting is for a DIFFERENT school, and the unit ends
    at the interview itself (no outcome stated), consistent with not
    overwriting her established current employment without a clear
    resolution. Elena's other already-established facts (Spain-born,
    London-resident) are untouched.

    Listening-integrity check: lesson06's dialogue_comprehension
    exercises test facts via English answer options, not literal
    same-speaker quote picks, so the same-speaker-distractor collision
    bug class does not apply here.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

course:
  realization_key: es.a2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Continues Elena and Mateo's established tú register with each
    other (briefly, at the start of this unit). Elena and the
    interviewer (entrevistador/a) use usted throughout, matching this
    batch's precedent for institutional exchanges.

