  - content_key: es.a2.audio.entrevista.anuncio.01
    language: es
    text: >-
      Se busca profesor o profesora con al menos dos años de
      experiencia. Horario: de ocho a tres de la tarde, de lunes a
      viernes. Interesados favor de enviar su currículum antes del
      viernes.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.a2.audio.dialogue.entrevista_elena.01
    language: es
    text: >-
      Entrevistador: Buenos días, gracias por venir. ¿Podría
      presentarse? Elena: Buenos días. Me gustaría presentarme. Soy
      Elena, y enseño desde hace tres años. Entrevistador: ¿Por qué le
      interesa este puesto? Elena: Me interesa porque está más cerca
      de mi casa. Entrevistador: Entiendo. ¿Tiene alguna pregunta para
      nosotros? Elena: Sí, ¿cuál es el horario de trabajo? Entrevistador:
      El horario es de ocho a tres de la tarde. Elena: Perfecto, muchas
      gracias por la oportunidad.
    voice_hint: two_adults_formal_polite
    status: pending_generation
  - {content_key: es.a2.audio.entrevista.dialogue.gracias_oportunidad.01, language: es, text: "Perfecto, muchas gracias por la oportunidad.", voice_hint: neutral_young_adult_polite, status: pending_generation}

