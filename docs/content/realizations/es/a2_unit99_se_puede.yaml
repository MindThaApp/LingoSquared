          - {"content_key": "es.a2.unit99.lesson06.exercise02.entiende_dialogo", "type": "dialogue_comprehension", "tested_text": "en la biblioteca sí se puede entrar", "media_asset_key": "es.a2.audio.dialogue.se_puede.01", "prompt": {"target_blocks": [{"text": "Where can Elena go with her dog?", "language_code": "en", "direction": "ltr"}]}}
