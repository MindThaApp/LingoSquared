        teaching:
          - {"content_key": "es.a2.unit99.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Hola, Mateo. ¿Puedo ir con mi perro a tu oficina mañana?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Hola", "Mateo", "Puedo", "ir", "con", "mi", "perro", "a", "tu", "oficina", "mañana"]}
          - {"content_key": "es.a2.unit99.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Hola, Elena. Lo siento, pero en el edificio no se puede entrar con perros.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Hola", "Elena", "Lo", "siento", "pero", "en", "el", "edificio", "no", "se", "puede", "entrar", "con", "perros"]}
          - {"content_key": "es.a2.unit99.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Ah, ¿y en la biblioteca? ¿Se puede entrar con un perro?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Ah", "y", "en", "la", "biblioteca", "Se", "puede", "entrar", "con", "un", "perro"]}
          - {"content_key": "es.a2.unit99.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "En la biblioteca sí se puede entrar, pero tienes que hablar muy bajo.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["En", "la", "biblioteca", "sí", "se", "puede", "entrar", "pero", "tienes", "que", "hablar", "muy", "bajo"]}
          - {"content_key": "es.a2.unit99.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Vale. ¿Hay que pagar?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Vale", "Hay", "que", "pagar"]}
          - {"content_key": "es.a2.unit99.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "No, no hace falta pagar. ¡Hasta mañana, Elena!", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["No", "no", "hace", "falta", "pagar", "Hasta", "mañana", "Elena"]}
        exercises:
