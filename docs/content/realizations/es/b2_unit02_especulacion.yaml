      Mateo: ¿Dónde está Elena? No contesta el teléfono. Quizás está
      atrapada en el tráfico, o tal vez tiene una reunión. Debe de
      haber salido tarde de casa. Elena: ¡Perdón! Es posible que haya
      perdido el autobús. Mateo: ¡Lo sabía! Tenía que ser eso.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

