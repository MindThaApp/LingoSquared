schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    From-scratch generation, not adapted from a source. Continues es's
    B2 lane (unit01 argumentación); mirrors nl's shipped B2 unit02
    (speculatie) as the assigned structural exemplar (lesson arc,
    exercise-type pacing, spine-outcome sequencing) -- every sentence of
    actual Spanish text is freshly authored, not translated from the
    Dutch. Elena and Mateo continue as the established es characters;
    lessons 01-05 deliberately keep the mystery generic ("tu amigo") so
    only lesson06's culminating dialogue names them, matching the
    convention nl's own unit01 set (character names appear only inside
    kind:dialogue cards' speaker field or free target text, never inside
    an exercise's tested_text/prompt). No sibling-direction file
    (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority
    checks: (1) lesson01's register note that quizás/tal vez pair with
    the indicative in this file's everyday-spoken register (a lo mejor
    always takes the indicative; puede que/es posible que in lesson03
    correctly take the subjunctive) -- confirm this reads as natural
    colloquial speech rather than as a prescriptive error; (2)
    lesson03's matching_pairs distinguishes "puede que" (colloquial) from
    "es posible que" (neutral) by register only, since both mean "it's
    possible that" -- confirm this register distinction is real and the
    pair is not effectively ambiguous to a learner; (3) confirm "debe de
    + infinitive" (deduction) is kept clearly distinct in feel from
    "tiene que + infinitive" (near-certainty) throughout; (4) confirm
    "atrapada"/"atrapado" gender agreement, "haber perdido el autobús",
    and the lesson06 dialogue read as natural spoken Spanish.
  notes: >-
    Second Spanish B2 unit. Targets the CEFR B2 speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    say what may, might, must, or cannot be the case (present and past),
    distinguishing deduction from guesswork. Theme: a friend who is not
    answering the phone -- a single everyday mystery running across all
    six lessons, resolved only in the culminating lesson06 dialogue.
    Lesson arc: L01 graded certainty markers (quizás / tal vez /
    seguramente / a lo mejor / seguro que), L02 deduction with deber de +
    infinitive vs the stronger tiene que + infinitive, L03 possibility
    vs guesswork with puede que / es posible que / no puede ser que (all
    + subjunctive) contrasted against L01's indicative guessing, L04
    speculating about the past (debe de haber + participle, puede que
    haya + participle), L05 a reading distinguishing stated fact from
    speculation, L06 the culminating production -- Mateo speculates
    about why Elena hasn't arrived, using all three registers (guess,
    deduction, possibility) before she appears with the real
    explanation. Register: informal tu throughout, per the es lane
    precedent. All vocabulary is introduced self-contained within this
    file, continuing the token pool established in unit01 (same course,
    cumulative per docs/content/CLAUDE.md).

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent). B2 speculation layers
    graded-certainty modals onto that register -- quizás, a lo mejor,
    debe de, tiene que, puede que, es posible que -- while keeping
    everyday informal address. Elena and Mateo continue the informal tu
    they use with each other throughout the es lane.

