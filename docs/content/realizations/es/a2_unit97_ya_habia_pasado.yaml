      - content_key: es.a2.unit97.lesson06.elena_y_mateo
        title: "Elena y Mateo hablan"
        spine_outcome_id: universal.a2.past.explain_what_had_happened_before
        teaching:
          - {"content_key": "es.a2.unit97.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Hola, Mateo. ¿Qué ha pasado? Has llegado muy tarde.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Hola", "Mateo", "Qué", "ha", "pasado", "Has", "llegado", "muy", "tarde"]}
          - {"content_key": "es.a2.unit97.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Perdona, Elena. Cuando llegué a la estación, el tren ya había salido.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Perdona", "Elena", "Cuando", "llegué", "a", "la", "estación", "el", "tren", "ya", "había", "salido"]}
          - {"content_key": "es.a2.unit97.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Ay, qué mala suerte. Yo ya había hecho la cena cuando sonó el móvil.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Ay", "qué", "mala", "suerte", "Yo", "ya", "había", "hecho", "la", "cena", "cuando", "sonó", "el", "móvil"]}
          - {"content_key": "es.a2.unit97.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "¿Ya habías hecho la cena? Cuando salí de la oficina, todavía no había comido.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Ya", "habías", "hecho", "la", "cena", "Cuando", "salí", "de", "oficina", "todavía", "no", "había", "comido"]}
          - {"content_key": "es.a2.unit97.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Pues ya había puesto la mesa. ¿Quieres comer?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Pues", "ya", "había", "puesto", "la", "mesa", "Quieres", "comer"]}
          - {"content_key": "es.a2.unit97.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Sí, por favor. ¡Gracias, Elena!", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Sí", "por", "favor", "Gracias", "Elena"]}
        exercises:
          - {"content_key": "es.a2.unit97.lesson06.exercise01.escucha_explicacion", "type": "listen_select", "tested_text": "Perdona Elena Cuando llegué a la estación el tren ya había salido", "media_asset_key": "es.a2.audio.dialogue.ya_habia_pasado.01", "prompt": {"target_blocks": []}}
          - {"content_key": "es.a2.unit97.lesson06.exercise02.entiende_cena", "type": "dialogue_comprehension", "tested_text": "Yo ya había hecho la cena cuando sonó el móvil", "media_asset_key": "es.a2.audio.dialogue.ya_habia_pasado.01", "prompt": {"target_blocks": [{"text": "What had Elena already done when the phone rang?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit97.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Qué ha pasado Has llegado muy tarde Perdona El tren ya había salido Ya había hecho la cena Todavía no había comido Ya había puesto la mesa Quieres comer", "prompt": {"target_blocks": []}, "pairs": [{"left": "¿Qué ha pasado?", "right": "What happened?"}, {"left": "Has llegado muy tarde.", "right": "You have arrived very late."}, {"left": "Perdona.", "right": "Sorry."}, {"left": "El tren ya había salido.", "right": "The train had already left."}, {"left": "Ya había hecho la cena.", "right": "I had already made dinner."}, {"left": "Todavía no había comido.", "right": "I had not eaten yet."}, {"left": "Ya había puesto la mesa.", "right": "I had already set the table."}, {"left": "¿Quieres comer?", "right": "Do you want to eat?"}]}
          - {"content_key": "es.a2.unit97.lesson06.exercise04.ordena_oficina", "type": "word_order", "tested_text": "Cuando salí de la oficina todavía no había comido", "prompt": {"target_blocks": []}, "word_bank": ["Cuando", "salí", "de", "la", "oficina", "todavía", "no", "había", "comido"]}
          - {"content_key": "es.a2.unit97.lesson06.exercise05.responde_pasado", "type": "dialogue_response", "tested_text": "Cuando llegué a la estación el tren ya había salido", "prompt": {"target_blocks": [{"text": "Hola, Mateo. ¿Qué ha pasado? Has llegado muy tarde.", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit97.lesson06.exercise06.traduce_comido", "type": "translation", "tested_text": "Cuando salí de la oficina todavía no había comido", "prompt": {"target_blocks": [{"text": "When I left the office, I had not eaten yet.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit97.lesson06.exercise07.escribe_tren", "type": "writing_prompt", "tested_text": "Cuando llegué el tren ya había salido Había perdido el móvil", "prompt": {"target_blocks": [{"text": "Write two Spanish sentences about a missed train: (1) When you arrived, the train had already left. (2) You had lost the phone.", "language_code": "en", "direction": "ltr"}]}}
