          - {"content_key": "es.a2.unit97.lesson05.teach.lectura", "kind": "reading", "target": {"text": "Hola, Mateo. ¡Qué día! Salí de casa a las ocho, pero cuando llegué a la estación, el tren ya había salido. Además, había perdido el móvil. Cuando volví a casa, mi perro ya había encontrado el móvil en la cama. ¿Y tú? ¿Ya habías llegado a la oficina?", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["Hola", "Mateo", "Qué", "día", "Salí", "de", "casa", "a", "las", "ocho", "pero", "cuando", "llegué", "la", "estación", "el", "tren", "ya", "había", "salido", "Además", "perdido", "móvil", "volví", "mi", "perro", "encontrado", "en", "cama", "Y", "tú", "habías", "llegado", "oficina"]}
