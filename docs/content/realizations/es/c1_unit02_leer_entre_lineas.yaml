schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: C1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1 unit 02, the second C1 unit in
    the es lane. Sourcing attempted: a firecrawl search for public-domain
    advanced/C1 Spanish discourse material returned only the FSI Spanish
    Basic and Programmatic courses (verified public domain, but capped at
    intermediate -- per AUTHORING_GUIDE 10 they cannot scaffold C1
    implicit-meaning content), a YouTube course (not public domain), and a
    research benchmark (not a learner source). No usable public-domain
    C1 Spanish source was found, so this is
    established-conventions-only authoring, built from general knowledge
    of Spanish irony, understatement (atenuacion) and implication
    conventions, using unit01 (discurso_extenso) as the assigned
    structural exemplar for pacing and exercise depth only -- every word
    of Spanish text is freshly authored, not translated from any other
    lane, and the scenario is unrelated to unit01's. Elena and Mateo
    continue as the established es characters (informal tu register: Elena
    is a Spanish teacher in London, Mateo is a Colombian accountant in
    London who works in an office -- profile set in b1_unit44 and
    earlier); they discuss, with irony and understatement, the company
    memo announcing Mateo's office move to an open-plan space. No
    sibling-direction file (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness and correct informal-tu register of every Spanish
    sentence, and that no vosotros/usted form slipped in; (2) that each
    irony/understatement/implication device (pues que bien, menuda idea,
    claro que si, no esta mal, podria ser peor, no es lo mejor, regular,
    ya veremos, eso dice, si tu lo dices, a primera vista, sonar bien)
    reads as current pan-Hispanic Spanish and actually conveys the
    intended non-literal meaning; (3) the lesson06 culminating
    writing/speaking answers are graded against fixed strings -- confirm
    the accepted-answer punctuation variants cover what a correct learner
    would type; (4) the memo reading (lesson05) is a plausible office
    communication whose euphemisms (mas dinamico, sin despachos
    individuales, un poco mas reducido, una gran oportunidad) genuinely
    signal the implied negative meaning; (5) confirm "regular" (so-so/
    mediocre) and "ya veremos" read as intended, not as anglicisms.
  notes: >-
    Second Spanish C1 unit. Targets the CEFR C1 inference outcome
    (universal.c1.inference.infer_implicit_meaning): grasp and convey
    implicit meaning -- inference, implication, irony, and understatement
    -- recognizing what is meant beyond what is literally said. Theme:
    one coherent situation across all six lessons -- Mateo's company
    announces the office is moving to a "modern, collaborative" open-plan
    space, which he and Elena privately think will be cramped and noisy;
    they practise reading and producing the implicit, ironic and
    understated judgement behind the official language. Lesson arc
    mirrors the outcome's own progression: L01 the concept and core idiom
    (leer entre lineas, querer decir, en realidad); L02 irony -- saying
    the opposite (pues que bien, menuda idea, claro que si); L03
    understatement / atenuacion (no esta mal, podria ser peor, no es lo
    mejor, regular); L04 implication (ya veremos, eso dice, si tu lo
    dices); L05 reading a written passage between the lines -- the company
    memo -- distinguishing literal praise from actual scepticism; L06 the
    culminating production -- an Elena/Mateo exchange for the listening
    requirement, a speaking task that delivers an ironic/understated
    remark, a writing task that composes an implicit message, and a
    dictation. Register: informal tu throughout (es lane precedent), with
    C1 discourse polish layered on top -- Elena and Mateo speak in their
    established informal voice while the implicit-meaning toolkit is
    essayistic. All vocabulary is introduced self-contained within this
    file (C1 is a separate Course row from B1/B2, so a C1 learner never
    sees lower-tier lexemes at runtime); common words already introduced
    in c1_unit01 are reused per the cumulative-vocabulary rule.

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent from b1_unit27/29/33 and
    b2_unit01). C1 raises the discourse register -- essayistic, sustained,
    cohesive -- while keeping the informal tu address. Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2 units; Mateo addresses Elena with tu (Que te parece...?), and
    their ironic and understated remarks keep their everyday spoken voice
    even as the metalinguistic vocabulary (la ironia, la atenuacion, la
    implicacion) is essayistic. No usted or vosotros.

