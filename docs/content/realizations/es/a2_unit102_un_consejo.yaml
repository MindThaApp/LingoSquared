        teaching:
          - {"content_key": "es.a2.unit102.lesson05.teach.palabras", "kind": "vocabulary", "target": {"text": "el consejo, la noche, el café, tarde", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["el", "consejo", "la", "noche", "café", "tarde", "Elena", "bebe", "por", "Gracias", "tu", "Mateo", "trabaja", "en", "oficina", "hasta", "tiene", "que", "estudiar"], "example": [{"text": "Elena bebe café por la noche.", "language_code": "es", "direction": "ltr"}, {"text": "Gracias por tu consejo.", "language_code": "es", "direction": "ltr"}, {"text": "Mateo trabaja en la oficina hasta tarde.", "language_code": "es", "direction": "ltr"}, {"text": "Elena tiene que estudiar por la noche.", "language_code": "es", "direction": "ltr"}]}
