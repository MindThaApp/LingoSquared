      - content_key: es.a2.unit102.lesson06.elena_y_mateo
        title: "Elena y Mateo hablan"
        spine_outcome_id: universal.a2.advice.give_simple_advice
        teaching:
          - {"content_key": "es.a2.unit102.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Hola, Mateo. Estás muy cansado. ¿Qué te pasa?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Hola", "Mateo", "Estás", "muy", "cansado", "Qué", "te", "pasa"]}
          - {"content_key": "es.a2.unit102.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Estoy cansado y no tengo dinero después de las vacaciones.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Estoy", "cansado", "y", "no", "tengo", "dinero", "después", "de", "las", "vacaciones"]}
          - {"content_key": "es.a2.unit102.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Pues deberías dormir ocho horas. Es mejor descansar un poco.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Pues", "deberías", "dormir", "ocho", "horas", "Es", "mejor", "descansar", "un", "poco"]}
          - {"content_key": "es.a2.unit102.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Tienes razón. Pero también tengo que ahorrar dinero.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Tienes", "razón", "Pero", "también", "tengo", "que", "ahorrar", "dinero"]}
          - {"content_key": "es.a2.unit102.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Te recomiendo ahorrar dinero este mes. ¿Por qué no comes en casa?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Te", "recomiendo", "ahorrar", "dinero", "este", "mes", "Por", "qué", "no", "comes", "en", "casa"]}
          - {"content_key": "es.a2.unit102.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Buena idea. Es difícil, pero lo intentaré. ¡Gracias, Elena!", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Buena", "idea", "Es", "difícil", "pero", "lo", "intentaré", "Gracias", "Elena"]}
        exercises:
          - {"content_key": "es.a2.unit102.lesson06.exercise01.escucha_razon", "type": "listen_select", "tested_text": "Tienes razón Pero también tengo que ahorrar dinero", "media_asset_key": "es.a2.audio.dialogue.un_consejo.01", "prompt": {"target_blocks": []}}
          - {"content_key": "es.a2.unit102.lesson06.exercise02.entiende_casa", "type": "dialogue_comprehension", "tested_text": "Por qué no comes en casa", "media_asset_key": "es.a2.audio.dialogue.un_consejo.01", "prompt": {"target_blocks": [{"text": "What does Elena suggest to help Mateo save money?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit102.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Qué te pasa Estás muy cansado Deberías dormir ocho horas Es mejor descansar un poco Tienes razón Te recomiendo ahorrar dinero Por qué no comes en casa Es difícil pero lo intentaré", "prompt": {"target_blocks": []}, "pairs": [{"left": "¿Qué te pasa?", "right": "What's wrong?"}, {"left": "Estás muy cansado.", "right": "You are very tired."}, {"left": "Deberías dormir ocho horas.", "right": "You should sleep eight hours."}, {"left": "Es mejor descansar un poco.", "right": "It is better to rest a little."}, {"left": "Tienes razón.", "right": "You are right."}, {"left": "Te recomiendo ahorrar dinero.", "right": "I recommend that you save money."}, {"left": "¿Por qué no comes en casa?", "right": "Why don't you eat at home?"}, {"left": "Es difícil, pero lo intentaré.", "right": "It is hard, but I will try."}]}
          - {"content_key": "es.a2.unit102.lesson06.exercise04.ordena_mes", "type": "word_order", "tested_text": "Te recomiendo ahorrar dinero este mes", "prompt": {"target_blocks": []}, "word_bank": ["Te", "mes", "recomiendo", "este", "dinero", "ahorrar"]}
          - {"content_key": "es.a2.unit102.lesson06.exercise05.responde_consejo", "type": "dialogue_response", "tested_text": "Buena idea Es difícil pero lo intentaré", "prompt": {"target_blocks": [{"text": "Te recomiendo ahorrar dinero este mes. ¿Por qué no comes en casa?", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit102.lesson06.exercise06.traduce_ahorrar", "type": "translation", "tested_text": "Tengo que ahorrar dinero", "prompt": {"target_blocks": [{"text": "I have to save money.", "language_code": "en", "direction": "ltr"}]}}
