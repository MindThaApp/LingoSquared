            prompt: {target_blocks: []}
            pairs: [{left: "¿Cuánto cuesta?", right: "How much does it cost?"}, {left: "¿Cuánto es?", right: "How much is it?"}, {left: "Cuesta dos.", right: "It costs two."}]
          - {content_key: es.a1.unit07.lesson02.exercise06.reply_cuanto_cuesta, type: dialogue_response, tested_text: "Cuánto cuesta Cuesta dos", prompt: {target_blocks: [{text: "¿Cuánto cuesta?", language_code: es, direction: ltr}]}}
          - {content_key: es.a1.unit07.lesson02.exercise07.write_ask_price, type: writing_prompt, tested_text: "Cuánto cuesta", prompt: {target_blocks: [{text: "Write in Spanish: ask how much something costs.", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit07.lesson03.cantidades
