          - {content_key: es.a1.unit07.lesson03.exercise06.fill_medio_kilo, type: fill_in_blank, tested_text: "Medio kilo de pan por favor", prompt: {target_blocks: [{text: "___ kilo de pan, por favor. (half)", language_code: es, direction: ltr}]}}
          - {content_key: es.a1.unit07.lesson03.exercise07.speak_ask_for_quantity, type: speak_response, tested_text: "Un kilo de tomates por favor", prompt: {target_blocks: [{text: "Pide un kilo de tomates.", language_code: es, direction: ltr}]}}

