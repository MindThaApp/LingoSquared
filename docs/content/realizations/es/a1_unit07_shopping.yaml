          - {content_key: es.a1.unit07.lesson05.exercise07.write_cheapest_item, type: writing_prompt, tested_text: "Pan seis", prompt: {target_blocks: [{text: "Write in Spanish which item on Rosa's stand you would buy and its price.", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
        title: "Elena y Mateo van al mercado"
        spine_outcome_ids: [universal.a1.shopping.ask_prices_quantities]
        teaching:
          - {content_key: es.a1.unit07.lesson06.teach.line01, kind: dialogue, target: {text: "Vamos al mercado. Necesitamos ingredientes para la próxima clase.", language_code: es, direction: ltr, speaker: Elena}, introduced_tokens: [Vamos, al, mercado, Necesitamos, ingredientes, para, la, próxima, clase]}
          - {content_key: es.a1.unit07.lesson06.teach.line02, kind: dialogue, target: {text: "Buena idea. ¿Qué necesitamos?", language_code: es, direction: ltr, speaker: Mateo}, introduced_tokens: [Buena, idea, Qué, necesitamos]}
          - {content_key: es.a1.unit07.lesson06.teach.line03, kind: dialogue, target: {text: "Primero, verduras frescas. Mira, ¡qué tomates tan frescos!", language_code: es, direction: ltr, speaker: Elena}, introduced_tokens: [Primero, verduras, frescas, Mira, qué, tomates, tan, frescos]}
          - {content_key: es.a1.unit07.lesson06.teach.line04, kind: dialogue, target: {text: "¿Cuánto quiere, señorita?", language_code: es, direction: ltr, speaker: Vendedor}, introduced_tokens: [Cuánto, quiere, señorita]}
