          - {content_key: es.a1.unit07.lesson03.exercise04.order_una_docena_de_huevos, type: word_order, tested_text: "Una docena de huevos por favor", prompt: {target_blocks: []}, word_bank: [Una, docena, de, huevos, por, favor]}
