          - {content_key: es.a1.unit07.lesson01.exercise01.choose_mercado, type: multiple_choice, tested_text: "mercado", prompt: {target_blocks: [{text: "market", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit07.lesson01.exercise02.listen_mercado_vocab, type: listen_select, tested_text: "mercado fruta verdura huevos pan", media_asset_key: es.a1.audio.mercado.lista.01, prompt: {target_blocks: []}}
          - content_key: es.a1.unit07.lesson01.exercise03.match_mercado_vocab
            type: matching_pairs
            tested_text: "mercado fruta verdura huevos pan"
            prompt: {target_blocks: []}
            pairs: [{left: "el mercado", right: market}, {left: "la fruta", right: fruit}, {left: "la verdura", right: vegetable}, {left: "los huevos", right: eggs}, {left: "el pan", right: bread}, {left: "Vamos al mercado.", right: "Let's go to the market."}, {left: "La verdura está fresca.", right: "The vegetables are fresh."}, {left: "Necesito huevos.", right: "I need eggs."}]
          - {content_key: es.a1.unit07.lesson01.exercise04.listen_huevos, type: listen_select, tested_text: "huevos", media_asset_key: es.a1.audio.mercado.huevos.01, prompt: {target_blocks: []}}
          - {content_key: es.a1.unit07.lesson01.exercise05.order_la_verdura_esta_fresca, type: word_order, tested_text: "La verdura está fresca", prompt: {target_blocks: []}, word_bank: [La, verdura, está, fresca]}
          - {content_key: es.a1.unit07.lesson01.exercise06.translate_pan, type: translation, tested_text: "pan", prompt: {target_blocks: [{text: "bread", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit07.lesson02.preguntar_el_precio
        title: "Preguntar el precio"
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - {content_key: es.a1.unit07.lesson02.teach.cuanto_cuesta, kind: phrase, target: {text: "¿Cuánto cuesta?", language_code: es, direction: ltr}, introduced_tokens: [Cuánto, cuesta]}
          - {content_key: es.a1.unit07.lesson02.teach.cuanto_es, kind: phrase, target: {text: "¿Cuánto es?", language_code: es, direction: ltr}, introduced_tokens: [Cuánto, es]}
          - {content_key: es.a1.unit07.lesson02.teach.cuesta_dos, kind: phrase, target: {text: "Cuesta dos.", language_code: es, direction: ltr}, introduced_tokens: [Cuesta, dos]}
          - content_key: es.a1.unit07.lesson02.teach.cuanto_cuesta_vs_es_note
            kind: grammar_note
            target: {text: "*¿Cuánto cuesta?* (how much does it cost?) and *¿Cuánto es?* (how much is it?) are both natural ways to ask a price -- interchangeable in this everyday shopping context.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a1.unit07.lesson02.exercise01.choose_cuanto_cuesta, type: multiple_choice, tested_text: "Cuánto cuesta", prompt: {target_blocks: [{text: "How much does it cost?", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit07.lesson02.exercise02.listen_cuanto_cuesta, type: listen_select, tested_text: "Cuánto cuesta", media_asset_key: es.a1.audio.mercado.cuanto_cuesta.01, prompt: {target_blocks: []}}
