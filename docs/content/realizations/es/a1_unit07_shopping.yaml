target_language: es
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The market-shopping scenario shape (two people go together to buy
    ingredients: meat first, then fresh vegetables, a dozen eggs, bread/
    butter/salt/pepper) and core shopping vocabulary/questions (el
    mercado, la docena, ¿Cuánto cuesta?, fresco) are scaffolded from the
    real, public-domain FSI Spanish Basic Course (Foreign Service
    Institute, 1961, US government work), Volume 2 (Units 16-30), Units
    22 "Mrs. Harris wants to go to the market" and 23 "Shopping at the
    market" -- fetched via WebSearch/WebFetch + local pdftotext
    extraction from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%202/Fsi-SpanishBasicCourse-Volume2-StudentText.pdf
    (firecrawl was out of API credits this session -- 0/1000 remaining
    per `firecrawl --status` -- so this fell back to the older manual
    WebFetch+pdftotext workflow AUTHORING_GUIDE §10 should normally
    replace). No sentence was copied verbatim -- every phrase below is
    freshly written for Elena and Mateo's own storyline (buying
    ingredients together for the workshop's next class), replacing the
    source's 1961 domestic-servant/telephone framing with two peers
    shopping together.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Seventh Spanish A1 unit, continuing the Elena/Mateo storyline: after
    unit06's lunch, they go to the market together to buy ingredients
    for the workshop's next class (the 22 July class established in
    unit04). Realizes universal.a1.shopping.ask_prices_quantities
    (prerequisites: universal.a1.numbers.use_basic_numbers (unit02),
    universal.a1.greetings.open_close_exchange (unit01)). Authored
    fresh at schema_version 1.1 per AUTHORING_GUIDE §19. tú register
    throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches market
    vocabulary (el mercado, la fruta, la verdura, los huevos, el pan);
    02 teaches asking prices (¿Cuánto cuesta? / ¿Cuánto es?); 03 teaches
    quantities (la docena, el kilo, medio kilo, un poco de); 04 teaches
    a short purchase exchange with a specific price given in response;
    05 is a reading of price labels at a market stall; 06 is a dialogue
    capstone: Elena and Mateo actually shopping together for the
    workshop's ingredients.

    Only specific numbers this unit's prices actually use (dos, cuatro,
    seis) are introduced, confirmed against
    validate_untaught_vocabulary's per-file accumulation (same finding
    as units04-06). §13: every fill_in_blank keeps surrounding context.
    §17: no true-synonym slot risk -- fruta/verdura/huevos/pan are
    genuinely distinct items, and docena/kilo/medio kilo are taught as
    quantity-specific words tied to a specific counted item (a dozen of
    eggs, a kilo of tomatoes), not interchangeable with each other in
    the same frame. §16: lesson01's matching_pairs uses all 5 market
    nouns plus 3 example sentences (8 pairs). §12: the multi-clause
    accepted_answers (lesson06's closing exchange) has period/comma/
    conjunction-joined variants. No bare yes/no/true/false -- checked
    by hand, "no" only appears inside full quoted sentences (e.g.
    "No, gracias").

    Internal consistency (§11): the shopping trip is explicitly for
    "la próxima clase" (22 July), the same date established in unit04;
    the tomato price (dos), egg-dozen price (cuatro), and bread price
    (seis) stay identical between lesson05's reading and lesson06's
    dialogue.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

