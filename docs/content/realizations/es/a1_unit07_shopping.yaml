          - content_key: es.a1.unit07.lesson01.teach.fruta_verdura
            kind: vocabulary
            target: {text: "la fruta, la verdura", language_code: es, direction: ltr}
            introduced_tokens: [la, fruta, verdura, está, fresca]
            example:
              - {text: "Quiero comprar fruta.", language_code: es, direction: ltr}
              - {text: "La verdura está fresca.", language_code: es, direction: ltr}
          - content_key: es.a1.unit07.lesson01.teach.huevos_pan
            kind: vocabulary
            target: {text: "los huevos, el pan", language_code: es, direction: ltr}
            introduced_tokens: [los, huevos, el, pan]
            example:
              - {text: "Necesito huevos.", language_code: es, direction: ltr}
