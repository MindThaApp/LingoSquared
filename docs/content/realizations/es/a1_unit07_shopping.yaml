  - content_key: es.a1.audio.dialogue.mercado_elena_mateo.01
    language: es
    text: >-
      Elena: Vamos al mercado. Necesitamos ingredientes para la próxima clase.
      Mateo: Buena idea. ¿Qué necesitamos?
      Elena: Primero, verduras frescas. Mira, ¡qué tomates tan frescos!
      Vendedor: ¿Cuánto quiere, señorita?
      Elena: Un kilo, por favor. ¿Cuánto cuesta?
      Vendedor: Cuesta dos.
      Mateo: Yo necesito una docena de huevos y pan.
      Vendedor: Los huevos cuestan cuatro, y el pan, seis.
      Mateo: Perfecto, gracias.
      Elena: ¿Necesitas algo más?
      Mateo: No, creo que ya tenemos todo.
    voice_hint: two_young_adults_and_vendor_neutral_friendly
    status: pending_generation
  - {content_key: es.a1.audio.dialogue.mercado_elena_mateo.huevos_cuatro_pan_seis.01, language: es, text: "Los huevos cuestan cuatro, y el pan, seis.", voice_hint: neutral_adult, status: pending_generation}

