schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    Authored fresh: a nuanced debate about remote work vs. the office,
    using the concessive connector "aunque" and the stronger contrastive
    connector "sin embargo" (rather than a simple "pero"). No other
    language unit was consulted.
review:
  status: reviewed
  required_next_reviewer: codex
  notes: >-
    Realizes universal.b1.opinions.debate_with_concession_and_nuance
    literally: learners concede a valid point on the other side using a
    concessive connector ("aunque") before restating their own position
    (lesson02), then use a stronger contrastive connector than a simple
    "pero" ("sin embargo") to structure a multi-point argument (lesson03).
    Character canon checked on disk and preserved (grep of
    a1_unit13_work.yaml, b1_unit27/29/33/35/36/37/38/39/40): Elena is a
    Spanish teacher living in London; Mateo is a Colombian accountant
    living in London; tú register between them as established peers. No
    new facts contradicted. The culminating exercise (lesson04) requires
    a single written argument containing both the concessive clause with
    restated position AND the sin-embargo-structured multi-point
    contrast, matching the outcome's compound requirement literally.

    Second-pass review 2026-10-19: 1 fix -- lesson04.exercise05.write_culminating_debate: prompt no longer prints the full answer (content in English, connectors named).
course:
  realization_key: es.b1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Elena and Mateo use tú as established peers (informal register),
    matching the precedent set across b1_unit27/29/33/35/36/37/38/39/40.
media_assets:
  - {content_key: es.b1.audio.concesiones.prefiero_oficina.01, language: es, text: "Prefiero trabajar en la oficina.", voice_hint: neutral_adult_debate, status: pending_generation}
  - {content_key: es.b1.audio.concesiones.aunque_flexible.01, language: es, text: "Aunque trabajar desde casa es más flexible, prefiero la oficina.", voice_hint: neutral_adult_debate, status: pending_generation}
  - {content_key: es.b1.audio.concesiones.sin_embargo_concentrarse.01, language: es, text: "El trabajo en casa ahorra tiempo. Sin embargo, es más difícil concentrarse.", voice_hint: neutral_adult_debate, status: pending_generation}
  - {content_key: es.b1.audio.concesiones.argumento_completo.01, language: es, text: "Aunque trabajar desde casa es más flexible, prefiero la oficina. El trabajo en casa ahorra tiempo. Sin embargo, es más difícil concentrarse.", voice_hint: neutral_adult_debate, status: pending_generation}
units:
  - content_key: es.b1.unit41.concesiones
    title: "Debatir con matices"
    section: speaking
    spine_outcome_ids: [universal.b1.opinions.debate_with_concession_and_nuance]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit41.lesson01.prefiero_oficina
        title: "Prefiero la oficina"
        spine_outcome_id: universal.b1.opinions.debate_with_concession_and_nuance
        teaching:
          - content_key: es.b1.unit41.lesson01.teach.prefiero
            kind: vocabulary
            target: {text: "prefiero", language_code: es, direction: ltr}
            introduced_tokens: [prefiero]
            example: {text: "Prefiero el té." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson01.teach.trabajar_en_la_oficina
            kind: vocabulary
            target: {text: "trabajar en la oficina", language_code: es, direction: ltr}
            introduced_tokens: [trabajar, en, la, oficina]
            example: {text: "Me gusta trabajar en la oficina." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson01.teach.position_statement
            kind: phrase
            target: {text: "Prefiero trabajar en la oficina.", language_code: es, direction: ltr}
            introduced_tokens: [Prefiero, trabajar, en, la, oficina]
        exercises:
          - {content_key: es.b1.unit41.lesson01.exercise01.choose_position, type: multiple_choice, tested_text: "Prefiero trabajar en la oficina", prompt: {target_blocks: [{text: "Which sentence means \"I prefer to work in the office\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit41.lesson01.exercise02.listen_position, type: listen_select, tested_text: "Prefiero trabajar en la oficina", media_asset_key: es.b1.audio.concesiones.prefiero_oficina.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit41.lesson01.exercise03.match_position
            type: matching_pairs
            tested_text: "prefiero trabajar oficina"
            prompt: {target_blocks: []}
            pairs: [{left: "prefiero", right: "I prefer"}, {left: "trabajar en la oficina", right: "to work in the office"}, {left: "la oficina", right: "the office"}, {left: "Prefiero trabajar en la oficina", right: "I prefer to work in the office"}, {left: "trabajar", right: "to work"}]
          - {content_key: es.b1.unit41.lesson01.exercise04.order_position, type: word_order, tested_text: "Prefiero trabajar en la oficina", prompt: {target_blocks: []}, word_bank: [Prefiero, trabajar, en, la, oficina]}
          - {content_key: es.b1.unit41.lesson01.exercise05.translate_position, type: translation, tested_text: "Prefiero trabajar en la oficina", prompt: {target_blocks: [{text: "Translate to Spanish, stating an opinion: I prefer to work in the office.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit41.lesson01.exercise06.dictation_prefiero_oficina, type: dictation, tested_text: "Prefiero trabajar en la oficina", media_asset_key: es.b1.audio.concesiones.prefiero_oficina.01, prompt: {target_blocks: []}}

      - content_key: es.b1.unit41.lesson02.aunque_flexible
        title: "Aunque es más flexible..."
        spine_outcome_id: universal.b1.opinions.debate_with_concession_and_nuance
        teaching:
          - content_key: es.b1.unit41.lesson02.teach.aunque
            kind: vocabulary
            target: {text: "aunque", language_code: es, direction: ltr}
            introduced_tokens: [aunque]
            example: {text: "Aunque llueve, salgo." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson02.teach.trabajar_desde_casa
            kind: vocabulary
            target: {text: "trabajar desde casa", language_code: es, direction: ltr}
            introduced_tokens: [trabajar, desde, casa]
            example: {text: "Hoy trabajo desde casa." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson02.teach.mas_flexible
            kind: vocabulary
            target: {text: "más flexible", language_code: es, direction: ltr}
            introduced_tokens: [más, flexible]
            example: {text: "Mi horario es más flexible." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson02.teach.concession_note
            kind: grammar_note
            target: {text: "\"Aunque\" concedes a valid point on the other side before you restate your own position -- it does not change your position.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.b1.unit41.lesson02.teach.concession_sentence
            kind: phrase
            target: {text: "Aunque trabajar desde casa es más flexible, prefiero la oficina.", language_code: es, direction: ltr}
            introduced_tokens: [Aunque, trabajar, desde, casa, es, más, flexible, prefiero, la, oficina]
        exercises:
          - {content_key: es.b1.unit41.lesson02.exercise01.choose_concession, type: multiple_choice, tested_text: "Aunque trabajar desde casa es más flexible prefiero la oficina", prompt: {target_blocks: [{text: "Which sentence concedes that working from home is more flexible, then restates a preference for the office?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit41.lesson02.exercise02.listen_concession, type: listen_select, tested_text: "Aunque trabajar desde casa es más flexible prefiero la oficina", media_asset_key: es.b1.audio.concesiones.aunque_flexible.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit41.lesson02.exercise03.match_concession
            type: matching_pairs
            tested_text: "aunque trabajar casa flexible prefiero oficina"
            prompt: {target_blocks: []}
            pairs: [{left: "aunque", right: "although"}, {left: "trabajar desde casa", right: "working from home"}, {left: "más flexible", right: "more flexible"}, {left: "prefiero la oficina", right: "I prefer the office"}, {left: "Aunque trabajar desde casa es más flexible, prefiero la oficina", right: "although working from home is more flexible, I prefer the office"}]
          - {content_key: es.b1.unit41.lesson02.exercise04.order_concession, type: word_order, tested_text: "Aunque trabajar desde casa es más flexible prefiero la oficina", prompt: {target_blocks: []}, word_bank: [Aunque, trabajar, desde, casa, es, más, flexible, prefiero, la, oficina]}
          - {content_key: es.b1.unit41.lesson02.exercise05.fill_aunque, type: fill_in_blank, tested_text: "Aunque trabajar desde casa es más flexible prefiero la oficina", prompt: {target_blocks: [{text: "___ trabajar desde casa es más flexible, prefiero la oficina. (although)", language_code: es, direction: ltr}]}}

      - content_key: es.b1.unit41.lesson03.sin_embargo_concentrarse
        title: "Sin embargo..."
        spine_outcome_id: universal.b1.opinions.debate_with_concession_and_nuance
        teaching:
          - content_key: es.b1.unit41.lesson03.teach.ahorra_tiempo
            kind: vocabulary
            target: {text: "ahorra tiempo", language_code: es, direction: ltr}
            introduced_tokens: [ahorra, tiempo]
            example: {text: "El coche ahorra tiempo." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson03.teach.sin_embargo
            kind: vocabulary
            target: {text: "sin embargo", language_code: es, direction: ltr}
            introduced_tokens: [sin, embargo]
            example: {text: "Es tarde. Sin embargo, voy a salir." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson03.teach.dificil_concentrarse
            kind: vocabulary
            target: {text: "difícil concentrarse", language_code: es, direction: ltr}
            introduced_tokens: [difícil, concentrarse]
            example: {text: "Es difícil concentrarse con ruido." , language_code: es, direction: ltr}
          - content_key: es.b1.unit41.lesson03.teach.contrast_note
            kind: grammar_note
            target: {text: "\"Sin embargo\" is a stronger contrastive connector than a simple \"pero\", used to structure a multi-point argument between two full sentences.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.b1.unit41.lesson03.teach.contrast_sentence
            kind: phrase
            target: {text: "El trabajo en casa ahorra tiempo. Sin embargo, es más difícil concentrarse.", language_code: es, direction: ltr}
            introduced_tokens: [El, trabajo, en, casa, ahorra, tiempo, Sin, embargo, es, más, difícil, concentrarse]
        exercises:
          - {content_key: es.b1.unit41.lesson03.exercise01.choose_contrast, type: multiple_choice, tested_text: "El trabajo en casa ahorra tiempo Sin embargo es más difícil concentrarse", prompt: {target_blocks: [{text: "Which pair of sentences means \"working from home saves time; however, it's harder to concentrate\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit41.lesson03.exercise02.listen_contrast, type: listen_select, tested_text: "El trabajo en casa ahorra tiempo Sin embargo es más difícil concentrarse", media_asset_key: es.b1.audio.concesiones.sin_embargo_concentrarse.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit41.lesson03.exercise03.match_contrast
            type: matching_pairs
            tested_text: "trabajo casa ahorra tiempo embargo concentrarse"
            prompt: {target_blocks: []}
            pairs: [{left: "el trabajo en casa", right: "working from home"}, {left: "ahorra tiempo", right: "saves time"}, {left: "sin embargo", right: "however"}, {left: "difícil concentrarse", right: "hard to concentrate"}, {left: "El trabajo en casa ahorra tiempo. Sin embargo, es más difícil concentrarse", right: "working from home saves time; however, it's harder to concentrate"}]
          - {content_key: es.b1.unit41.lesson03.exercise04.order_contrast, type: word_order, tested_text: "El trabajo en casa ahorra tiempo Sin embargo es más difícil concentrarse", prompt: {target_blocks: []}, word_bank: [El, trabajo, en, casa, ahorra, tiempo, Sin, embargo, es, más, difícil, concentrarse]}
          - {content_key: es.b1.unit41.lesson03.exercise05.translate_contrast, type: translation, tested_text: "El trabajo en casa ahorra tiempo Sin embargo es más difícil concentrarse", prompt: {target_blocks: [{text: "Translate to Spanish, using a stronger contrastive connector than a simple \"pero\": Working from home saves time. However, it's harder to concentrate.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit41.lesson04.el_debate_completo
        title: "El debate completo"
        spine_outcome_id: universal.b1.opinions.debate_with_concession_and_nuance
        teaching:
          - content_key: es.b1.unit41.lesson04.teach.concession_recall
            kind: phrase
            target: {text: "Aunque trabajar desde casa es más flexible, prefiero la oficina.", language_code: es, direction: ltr}
            introduced_tokens: [Aunque, trabajar, desde, casa, es, más, flexible, prefiero, la, oficina]
          - content_key: es.b1.unit41.lesson04.teach.contrast_recall
            kind: phrase
            target: {text: "El trabajo en casa ahorra tiempo. Sin embargo, es más difícil concentrarse.", language_code: es, direction: ltr}
            introduced_tokens: [El, trabajo, en, casa, ahorra, tiempo, Sin, embargo, es, más, difícil, concentrarse]
          - content_key: es.b1.unit41.lesson04.teach.full_argument
            kind: reading
            target: {text: "Aunque trabajar desde casa es más flexible, prefiero la oficina. El trabajo en casa ahorra tiempo. Sin embargo, es más difícil concentrarse.", language_code: es, direction: ltr}
            introduced_tokens: [Aunque, trabajar, desde, casa, es, más, flexible, prefiero, la, oficina, El, trabajo, en, ahorra, tiempo, Sin, embargo, difícil, concentrarse]
        exercises:
          - {content_key: es.b1.unit41.lesson04.exercise01.choose_which_is_concession, type: multiple_choice, tested_text: "Aunque trabajar desde casa es más flexible prefiero la oficina", prompt: {target_blocks: [{text: "Which sentence uses the concessive connector to concede a point before restating the speaker's own position, rather than using the stronger contrastive connector between two full sentences?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit41.lesson04.exercise02.listen_full, type: listen_select, tested_text: "Aunque trabajar desde casa es más flexible prefiero la oficina El trabajo en casa ahorra tiempo Sin embargo es más difícil concentrarse", media_asset_key: es.b1.audio.concesiones.argumento_completo.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit41.lesson04.exercise03.match_full_unit
            type: matching_pairs
            tested_text: "aunque flexible prefiero ahorra embargo concentrarse"
            prompt: {target_blocks: []}
            pairs: [{left: "Aunque trabajar desde casa es más flexible, prefiero la oficina", right: "the concession and restated position"}, {left: "El trabajo en casa ahorra tiempo. Sin embargo, es más difícil concentrarse", right: "the contrastive multi-point argument"}, {left: "aunque", right: "the concessive connector"}, {left: "sin embargo", right: "the stronger contrastive connector"}, {left: "prefiero la oficina", right: "the speaker's own position"}]
          - {content_key: es.b1.unit41.lesson04.exercise04.order_contrast_2, type: word_order, tested_text: "El trabajo en casa ahorra tiempo Sin embargo es más difícil concentrarse", prompt: {target_blocks: []}, word_bank: [El, trabajo, en, casa, ahorra, tiempo, Sin, embargo, es, más, difícil, concentrarse]}
          - {content_key: es.b1.unit41.lesson04.exercise05.write_culminating_debate, type: writing_prompt, tested_text: "Aunque trabajar desde casa es más flexible prefiero la oficina El trabajo en casa ahorra tiempo Sin embargo es más difícil concentrarse", prompt: {target_blocks: [{text: "Write a short nuanced argument in Spanish about working from home vs. the office, in this order: (1) one sentence with \"aunque\" conceding that working from home is more flexible, then restating that you prefer the office; (2) two sentences linked by \"sin embargo\" (not a simple \"pero\"): working from home saves time; however, it is harder to concentrate.", language_code: en, direction: ltr}]}}
