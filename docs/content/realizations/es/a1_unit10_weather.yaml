          - {content_key: es.a1.unit10.lesson02.exercise07.order_hace_mucho_calor_en_julio, type: word_order, tested_text: "Hace mucho calor en julio", prompt: {target_blocks: []}, word_bank: [Hace, mucho, calor, en, julio]}
          - {content_key: es.a1.unit10.lesson02.exercise08.fill_hace_frio, type: fill_in_blank, tested_text: "En diciembre hace frío", prompt: {target_blocks: [{text: "En diciembre hace ___. (cold, not hot)", language_code: es, direction: ltr}]}}
          - {content_key: es.a1.unit10.lesson02.exercise09.write_esta_nublado, type: writing_prompt, tested_text: "Está nublado", prompt: {target_blocks: [{text: "Write in Spanish: it's cloudy.", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit10.lesson02.exercise10.dictation_hace_calor, type: dictation, tested_text: "Hace calor", media_asset_key: es.a1.audio.tiempo.hace_calor.01, prompt: {target_blocks: []}}

      - content_key: es.a1.unit10.lesson03.que_tiempo_hace_hoy
