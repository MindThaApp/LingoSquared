          - {content_key: es.a1.unit10.lesson03.exercise02.listen_que_tiempo_hace_hoy, type: listen_select, tested_text: "Qué tiempo hace hoy", media_asset_key: es.a1.audio.tiempo.que_tiempo_hace_hoy.01, prompt: {target_blocks: []}}
