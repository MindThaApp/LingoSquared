          - {content_key: es.a1.unit10.lesson03.exercise06.reply_que_tiempo_hace_hoy, type: dialogue_response, tested_text: "Hace mucho calor y hace sol", prompt: {target_blocks: [{text: "¿Qué tiempo hace hoy?", language_code: es, direction: ltr}]}}
