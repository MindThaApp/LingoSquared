          - {content_key: es.a1.unit10.lesson05.exercise04.read_que_es_importante, type: reading_comprehension, tested_text: "es importante llevar agua", prompt: {target_blocks: [{text: "Hoy, veintidós de julio, hace mucho calor y hace sol. No hay ni una nube. También hay un poco de viento. Es un buen día para ir al taller de cocina, pero es importante llevar agua.", language_code: es, direction: ltr}, {text: "What does the forecast say is important to bring?", language_code: en, direction: ltr}]}}
