generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    Core weather vocabulary and expressions (el tiempo, el sol, la
    lluvia, el viento, la nube, hace calor, hace frío, hace sol,
    llueve, está nublado) are scaffolded from the real, public-domain
    FSI Spanish Basic Course (Foreign Service Institute, 1961, US
    government work), Volume 2 (Units 16-30), Unit 21 "The weather"
    (21.1 basic sentences, a dialogue about a visit to an air base
    where the characters discuss cold, sun, changeable weather, a
    pleasant sunny day, heat, clouds, rain, and wind) -- downloaded
    directly (firecrawl confirmed at 0/1000 credits again this session
    via `firecrawl --status`, so this used the documented WebSearch +
    direct-download + `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%202/Fsi-SpanishBasicCourse-Volume2-StudentText.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. No
    sentence or drill item was copied verbatim -- every phrase below
    is freshly written for Elena and Mateo's own storyline (the hot
    July day of the workshop's next class) and modernized register (no
    1961 diplomatic/military-base framing). The seasonal-contrast
    detail (Elena mentioning Madrid winters) and all exercise content
    are original to this unit.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Tenth Spanish A1 unit, continuing the Elena/Mateo cooking-workshop
    storyline. Realizes universal.a1.weather.describe_basic_weather (no
    prerequisites per the spine). Set on the morning of 22 July -- the
    date of "la próxima clase" already established in unit04/unit07 --
    as Elena and Mateo walk to the workshop and talk about the heat.
    Authored fresh at schema_version 1.1 per AUTHORING_GUIDE §19 (every
    kind: vocabulary card carries a real example sentence). tú register
    throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches 5
    weather nouns (el tiempo, el sol, la lluvia, el viento, la nube);
    02 teaches 5 weather expressions (hace calor, hace frío, hace sol,
    llueve, está nublado) plus a grammar note distinguishing the
    *hace*-idiom pattern from plain verb forms (llueve, está nublado);
    03 teaches the core question-and-answer pattern (¿Qué tiempo hace
    hoy? / Hace mucho calor y hace sol); 04 is a phrase lesson
    contrasting today's heat with Elena's memory of cold Madrid winters
    (en invierno hace frío en Madrid), plus practical advice tied to
    the workshop (necesitamos agua porque hace calor); 05 is a reading
    of a short weather-report-style paragraph about the day; 06 is a
    dialogue capstone where Elena and Mateo walk to the 22 July class
    discussing the heat and agree to buy cold water on the way.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    hace calor / hace sol / hace frío for true-synonym risk -- they are
    three genuinely distinct weather states (heat, sun, cold), not
    synonyms, and every slot testing one is anchored by an
    already-stated scenario fact (the established hot, sunny July day),
    never an open choice among them. §16: lesson02's matching_pairs
    uses all 5 weather expressions plus 3 example sentences (8 pairs).
    §12: multi-clause accepted_answers (lesson03/06's compound weather
    descriptions) have period/comma/conjunction-joined variants. No
    bare yes/no/true/false -- checked by hand.

    Internal consistency (§11): the established facts (22 July,
    workshop starts 4pm, Elena is from Spain, Mateo is from Colombia
    and lives in London) are never contradicted -- the seasonal
    contrast in lesson04 is explicitly framed as Elena's memory of
    Madrid winters, a hypothetical/general statement, not a claim about
    the current (July) weather, so it doesn't conflict with the hot day
    established throughout the rest of the unit.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grading keys vs prompts, reading/dialogue display vs
    audio, learner-visible notes for false cross-unit claims and
    internal unit/lesson ids, YAML/compiler validity. Fixes:
    lesson05.exercise01-04 (read_que_tiempo_hace, read_hay_nubes,
    read_hay_viento, read_que_es_importante) prompt.target_blocks now
    show the Spanish forecast passage before the English question
    (passage was never displayed); lesson05.teach.un_poco_de_note
    dropped the learner-visible "unit07" reference. Overlay-side fixes
    listed in the en-es overlay review. NATIVE FLAG:
    lesson05.exercise06 hint "(to bring)" could elicit *traer* (not
    taught; low risk). DEFERRED: none.

    Language review 2026-10-24 (session 10): 0 fixes -- realization and paired overlay read in full, no
    defects found. Native flags: lesson06.teach.line07 'Vamos, o llegamos tarde a la clase' is understandable
    but 'Vamos, que llegamos tarde' (or 'si no, llegamos tarde') is the idiomatic spoken form; left as
    authored.

