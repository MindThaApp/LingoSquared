    language: es
    text: >-
      Elena: ¡Qué calor hace hoy!
      Mateo: Sí, hace mucho calor y hace sol. No hay ni una nube.
      Elena: Necesitamos agua para el camino.
      Mateo: Buena idea. Hay una tienda cerca de aquí.
      Elena: En invierno hace mucho frío en Madrid, pero en julio hace demasiado calor.
      Mateo: Prefiero el calor. En Londres llueve casi todos los días.
      Elena: Es verdad. Vamos, o llegamos tarde a la clase.
      Mateo: Tienes razón. Vamos.
