units:
  - content_key: es.a1.unit10.weather
    title: "Hace mucho calor hoy"
    section: reading_writing
    spine_outcome_ids: [universal.a1.weather.describe_basic_weather]
    planned_lesson_count: 6
    lessons:
      - content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
        title: "El tiempo"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: es.a1.unit10.lesson01.teach.el_tiempo, kind: vocabulary, target: {text: "el tiempo", language_code: es, direction: ltr}, introduced_tokens: [el, tiempo], example: {text: "¿Qué tiempo hace hoy?", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit10.lesson01.teach.el_sol, kind: vocabulary, target: {text: "el sol", language_code: es, direction: ltr}, introduced_tokens: [el, sol], example: {text: "Hace mucho sol hoy.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit10.lesson01.teach.la_lluvia, kind: vocabulary, target: {text: "la lluvia", language_code: es, direction: ltr}, introduced_tokens: [la, lluvia], example: {text: "No me gusta la lluvia.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit10.lesson01.teach.el_viento, kind: vocabulary, target: {text: "el viento", language_code: es, direction: ltr}, introduced_tokens: [el, viento, Hay, mucho, hoy], example: {text: "Hay mucho viento hoy.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit10.lesson01.teach.la_nube, kind: vocabulary, target: {text: "la nube", language_code: es, direction: ltr}, introduced_tokens: [la, nube, "No", "no", hay, ni, una], example: {text: "No hay ni una nube.", language_code: es, direction: ltr}}
        exercises:
          - {content_key: es.a1.unit10.lesson01.exercise01.choose_el_tiempo, type: multiple_choice, tested_text: "el tiempo", prompt: {target_blocks: [{text: "the weather", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit10.lesson01.exercise02.choose_la_lluvia, type: multiple_choice, tested_text: "la lluvia", prompt: {target_blocks: [{text: "the rain", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit10.lesson01.exercise03.listen_tiempo_sol_lluvia, type: listen_select, tested_text: "tiempo sol lluvia viento nube", media_asset_key: es.a1.audio.tiempo.lista.01, prompt: {target_blocks: []}}
          - content_key: es.a1.unit10.lesson01.exercise04.match_tiempo_vocab
            type: matching_pairs
            tested_text: "tiempo sol lluvia viento nube"
            prompt: {target_blocks: []}
            pairs: [{left: "el tiempo", right: "the weather"}, {left: "el sol", right: "the sun"}, {left: "la lluvia", right: "the rain"}, {left: "el viento", right: "the wind"}, {left: "la nube", right: "the cloud"}, {left: "¿Qué tiempo hace hoy?", right: "What's the weather like today?"}, {left: "Hay mucho viento hoy.", right: "It's very windy today."}, {left: "No hay ni una nube.", right: "There isn't a single cloud."}]
          - {content_key: es.a1.unit10.lesson01.exercise05.order_hay_mucho_viento_hoy, type: word_order, tested_text: "Hay mucho viento hoy", prompt: {target_blocks: []}, word_bank: [Hay, mucho, viento, hoy]}
          - {content_key: es.a1.unit10.lesson01.exercise06.translate_la_nube, type: translation, tested_text: "la nube", prompt: {target_blocks: [{text: "the cloud", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
        title: "Hace calor, hace frío..."
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: es.a1.unit10.lesson02.teach.hace_calor, kind: phrase, target: {text: "Hace calor.", language_code: es, direction: ltr}, introduced_tokens: [Hace, calor, en, julio], example: {text: "Hace mucho calor en julio.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit10.lesson02.teach.hace_frio, kind: phrase, target: {text: "Hace frío.", language_code: es, direction: ltr}, introduced_tokens: [Hace, frío, diciembre], example: {text: "En diciembre hace frío.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit10.lesson02.teach.hace_sol, kind: phrase, target: {text: "Hace sol.", language_code: es, direction: ltr}, introduced_tokens: [Hace, sol]}
          - {content_key: es.a1.unit10.lesson02.teach.llueve, kind: phrase, target: {text: "Llueve.", language_code: es, direction: ltr}, introduced_tokens: [Llueve]}
          - {content_key: es.a1.unit10.lesson02.teach.esta_nublado, kind: phrase, target: {text: "Está nublado.", language_code: es, direction: ltr}, introduced_tokens: [Está, nublado]}
          - content_key: es.a1.unit10.lesson02.teach.hace_vs_esta_note
            kind: grammar_note
            target: {text: "Weather expressions with *hace* (hace calor, hace frío, hace sol) use a fixed idiom, literally \"it makes heat/cold/sun.\" *Llueve* (it rains) is its own verb form, and *está nublado* (it's cloudy) uses *estar* + adjective -- three different patterns for the same idea: describing the weather.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a1.unit10.lesson02.exercise01.choose_hace_calor, type: multiple_choice, tested_text: "Hace calor", prompt: {target_blocks: [{text: "It's hot.", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit10.lesson02.exercise02.choose_llueve, type: multiple_choice, tested_text: "Llueve", prompt: {target_blocks: [{text: "It's raining.", language_code: en, direction: ltr}]}}
