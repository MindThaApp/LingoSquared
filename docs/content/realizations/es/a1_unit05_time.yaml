          - {content_key: es.a1.unit05.lesson01.exercise08.dictation_es_la_una, type: dictation, tested_text: "Es la una", media_asset_key: es.a1.audio.hora.es_la_una.01, prompt: {target_blocks: []}}

      - content_key: es.a1.unit05.lesson02.cuarto_y_media
        title: "Cuarto y media"
