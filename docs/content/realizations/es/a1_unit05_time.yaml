          - content_key: es.a1.unit05.lesson01.exercise05.match_horas
            type: matching_pairs
            tested_text: "una dos cuatro cinco siete"
            prompt: {target_blocks: []}
            pairs: [{left: "Es la una.", right: "It's one o'clock."}, {left: "Son las dos.", right: "It's two o'clock."}, {left: "Son las cuatro.", right: "It's four o'clock."}, {left: "Son las cinco.", right: "It's five o'clock."}, {left: "Son las siete.", right: "It's seven o'clock."}, {left: "¿Qué hora es?", right: "What time is it?"}]
          - {content_key: es.a1.unit05.lesson01.exercise06.order_son_las_cuatro, type: word_order, tested_text: "Son las cuatro", prompt: {target_blocks: []}, word_bank: [Son, las, cuatro]}
