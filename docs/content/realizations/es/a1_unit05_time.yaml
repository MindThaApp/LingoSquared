        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - {content_key: es.a1.unit05.lesson01.teach.que_hora_es, kind: phrase, target: {text: "¿Qué hora es?", language_code: es, direction: ltr}, introduced_tokens: [Qué, hora, es]}
          - {content_key: es.a1.unit05.lesson01.teach.es_la_una, kind: phrase, target: {text: "Es la una.", language_code: es, direction: ltr}, introduced_tokens: [Es, la, una]}
          - content_key: es.a1.unit05.lesson01.teach.es_vs_son_note
            kind: grammar_note
            target: {text: "One o'clock uses the singular verb *es* (Es la una), but every other hour uses the plural *son* (Son las dos, Son las tres...) because *la una* is singular (\"the one [hour]\") while *las dos*, *las tres*, etc. are plural.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.a1.unit05.lesson01.teach.son_las_horas
            kind: vocabulary
            target: {text: "Son las dos, Son las cuatro, Son las cinco, Son las siete", language_code: es, direction: ltr}
            introduced_tokens: [Son, las, dos, cuatro, cinco, siete]
            example:
              - {text: "Son las dos.", language_code: es, direction: ltr}
              - {text: "Son las cuatro.", language_code: es, direction: ltr}
              - {text: "Son las cinco.", language_code: es, direction: ltr}
              - {text: "Son las siete.", language_code: es, direction: ltr}
        exercises:
          - {content_key: es.a1.unit05.lesson01.exercise01.choose_que_hora_es, type: multiple_choice, tested_text: "Qué hora es", prompt: {target_blocks: [{text: "What time is it?", language_code: en, direction: ltr}]}}
          - {content_key: es.a1.unit05.lesson01.exercise02.listen_que_hora_es, type: listen_select, tested_text: "Qué hora es", media_asset_key: es.a1.audio.hora.que_hora_es.01, prompt: {target_blocks: []}}
