target_language: es
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The core time-telling forms (¿Qué hora es? / Es la una / Son las
    dos / Son las [hour] y cuarto / y media / menos cuarto) are
    scaffolded from the real, public-domain FSI Spanish Basic Course
    (Foreign Service Institute, 1961, US government work), Volume 2
    (Units 16-30), Unit 24 "Shopping in the stores", drill 24.21.3
    "Expressions for time of day" -- fetched via WebSearch/WebFetch +
    local pdftotext extraction from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%202/Fsi-SpanishBasicCourse-Volume2-StudentText.pdf
    (firecrawl was out of API credits this session -- 0/1000 remaining
    per `firecrawl --status` -- so this fell back to the older manual
    WebFetch+pdftotext workflow AUTHORING_GUIDE §10 should normally
    replace). No sentence or drill item was copied verbatim -- every
    phrase below is freshly written for Elena and Mateo's own
    storyline. The scheduling scenario (agreeing on a meeting time
    that leads into a lunch) is original to this unit.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Fifth Spanish A1 unit, continuing the Elena/Mateo cooking-workshop
    storyline from units 01-04 (tú register throughout). Realizes
    universal.a1.time.ask_tell_time (prerequisite: universal.a1.numbers.
    use_basic_numbers, unit02). Authored fresh at schema_version 1.1
    per AUTHORING_GUIDE §19.

    Six lessons, recognition->drag->production (§2): 01 teaches hour-
    only time-telling (es la una / son las dos...) plus ¿Qué hora es?;
    02 teaches cuarto/media fractions (y cuarto, y media, menos
    cuarto); 03 teaches parts of the day (de la mañana, de la tarde,
    de la noche) applied to the workshop's own start time; 04 is a
    phrase lesson where Mateo proposes a specific meeting time before
    the workshop; 05 is a short reading of a printed workshop-day
    timetable; 06 is a dialogue capstone where Elena and Mateo agree on
    a time to have lunch together after the workshop -- a deliberate
    hook into unit06 (food), which opens with them arriving at that
    same lunch.

    Only the specific number words this unit's clock times actually use
    (una, dos, cuatro, cinco, siete, quince, treinta) are introduced --
    confirmed again against scripts/compile_content.py's
    validate_untaught_vocabulary (per-file accumulation, not
    course-wide, same finding as unit04). "Es la una" (singular, no
    plural verb) vs. "Son las dos" (plural) is flagged explicitly with
    a grammar_note since it's a genuine, easy-to-miss irregularity (one
    o'clock is the only hour that takes the singular verb *es* instead
    of *son*).

    §13: every fill_in_blank frame keeps surrounding text besides the
    blank. §17: the one open slot with two candidates in the same
    semantic field (de la mañana / de la tarde) is always anchored by
    an already-stated clock hour that disambiguates which part of day
    is meant (e.g. "a las cuatro de la ___" only makes sense as "tarde"
    given the established 4pm workshop-start fact restated earlier in
    the same lesson) -- not a free open choice. §16: lesson01's
    matching_pairs uses all introduced time expressions plus their
    English glosses (8 pairs). §12: the one multi-clause
    accepted_answers list (lesson06's closing agreement) has period/
    comma/conjunction-joined variants. No bare yes/no/true/false --
    checked by hand, "no" only appears inside full quoted sentences.

    Internal consistency (§11): the workshop's start time (las cuatro
    de la tarde, established lesson03) is restated identically in
    lesson04's proposed meeting time (a las tres y media, before the
    4pm workshop -- checked: 3:30pm is indeed before 4pm) and in
    lesson05's reading and lesson06's dialogue (lunch afterward at la
    una, the day after the workshop -- deliberately not the same day,
    since the workshop's own end time was never stated to overlap with
    a lunch hour).

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

course:
  realization_key: es.a1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Continues unit01-04's tú register with Mateo. Clock time uses the
    standard pan-Hispanic spoken convention (Es la una / Son las dos...
    y cuarto/y media/menos cuarto), not a 24-hour or digital reading.

