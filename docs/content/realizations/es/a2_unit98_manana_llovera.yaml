          - {"content_key": "es.a2.unit98.lesson05.exercise03.une_mensaje", "type": "matching_pairs", "tested_text": "Hola Mateo El sábado hará sol El domingo probablemente lloverá Saldré en tren a las ocho Te prometo que llevaré el pan Vendrás en bici Hasta el sábado", "prompt": {"target_blocks": []}, "pairs": [{"left": "Hola, Mateo.", "right": "Hi, Mateo."}, {"left": "El sábado hará sol.", "right": "On Saturday it will be sunny."}, {"left": "El domingo probablemente lloverá.", "right": "On Sunday it will probably rain."}, {"left": "Saldré en tren a las ocho.", "right": "I will leave by train at eight."}, {"left": "Te prometo que llevaré el pan.", "right": "I promise you I will bring the bread."}, {"left": "¿Vendrás en bici?", "right": "Will you come by bike?"}, {"left": "¡Hasta el sábado!", "right": "See you on Saturday!"}]}
