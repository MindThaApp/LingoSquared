        spine_outcome_id: universal.a2.future.make_predictions_and_promises
        teaching:
          - {"content_key": "es.a2.unit98.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Hola, Mateo. El sábado voy a salir de paseo con mi perro. ¿Vendrás?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Hola", "Mateo", "El", "sábado", "voy", "a", "salir", "de", "paseo", "con", "mi", "perro", "Vendrás"]}
          - {"content_key": "es.a2.unit98.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Sí, vendré en bici. ¿Qué tiempo hará?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Sí", "vendré", "en", "bici", "Qué", "tiempo", "hará"]}
