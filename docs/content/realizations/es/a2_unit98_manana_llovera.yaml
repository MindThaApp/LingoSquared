          - {"content_key": "es.a2.unit98.lesson06.exercise02.entiende_promesa", "type": "dialogue_comprehension", "tested_text": "Te llamaré a las ocho te lo prometo", "media_asset_key": "es.a2.audio.dialogue.manana_llovera.01", "prompt": {"target_blocks": [{"text": "What does Mateo promise?", "language_code": "en", "direction": "ltr"}]}}
