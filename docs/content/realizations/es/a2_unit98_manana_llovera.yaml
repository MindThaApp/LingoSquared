          - {"content_key": "es.a2.unit98.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Qué bien. Entonces el sábado saldremos a las nueve.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Qué", "bien", "Entonces", "el", "sábado", "saldremos", "a", "las", "nueve"]}
          - {"content_key": "es.a2.unit98.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Perfecto. Yo llevaré el pan. ¿Me llamarás el sábado a las ocho?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Perfecto", "Yo", "llevaré", "el", "pan", "Me", "llamarás", "sábado", "a", "las", "ocho"]}
          - {"content_key": "es.a2.unit98.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Sí, te lo prometo. A las ocho te llamaré.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Sí", "te", "lo", "prometo", "A", "las", "ocho", "llamaré"]}
        exercises:
