          - {"content_key": "es.a2.unit98.lesson06.exercise05.responde_promesa", "type": "dialogue_response", "tested_text": "Sí te lo prometo A las ocho te llamaré", "prompt": {"target_blocks": [{"text": "Perfecto. Yo llevaré el pan. ¿Me llamarás el sábado a las ocho?", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit98.lesson06.exercise06.traduce_probablemente", "type": "translation", "tested_text": "El sábado probablemente hará sol", "prompt": {"target_blocks": [{"text": "On Saturday it will probably be sunny.", "language_code": "en", "direction": "ltr"}]}}
