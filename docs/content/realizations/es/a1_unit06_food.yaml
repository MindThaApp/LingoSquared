    language: es
    text: >-
      Camarero: Buenas tardes. ¿Qué quieren comer?
      Elena: Yo quiero una ensalada y agua, por favor.
      Mateo: Para mí, un sándwich y un café.
      Camarero: Muy bien. ¿Algo de postre?
      Elena: Sí, un pastel para los dos.
      Mateo: Buena idea. Y la cuenta, por favor.
      Camarero: Aquí tiene.
      Elena: Gracias. ¡Qué buena comida!
    voice_hint: waiter_and_two_young_adults_neutral_friendly
