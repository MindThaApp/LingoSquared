schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The restaurant scenario shape (two friends sit down, look at the
    menu, order a main dish and a drink, then dessert) and core
    ordering vocabulary (mesa, menú, sándwich, ensalada, sopa, postre)
    are scaffolded from the real, public-domain FSI Spanish Basic
    Course (Foreign Service Institute, 1961, US government work),
    Volume 1 (Units 1-15), Unit 6 "White and Molina have lunch
    together" -- fetched via WebSearch/WebFetch + local pdftotext
    extraction from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%201/Fsi-SpanishBasicCourse-Volume1-StudentText.pdf
    (firecrawl was out of API credits this session -- 0/1000 remaining
    per `firecrawl --status` -- so this fell back to the older manual
    WebFetch+pdftotext workflow AUTHORING_GUIDE §10 should normally
    replace). No sentence was copied verbatim, and the 1961 source's
    formal "Mesero" (waiter)-addressed, gentlemen-only framing was
    dropped for a modern, informal camarero/camarera exchange between
    two peers ordering for themselves -- matching AUTHORING_GUIDE §10's
    explicit modernization requirement. All dialogue is freshly written
    for Elena and Mateo's own storyline (their lunch the day after the
    workshop, set up by unit05 lesson06).
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Sixth Spanish A1 unit, continuing the Elena/Mateo storyline directly
    from unit05's cliffhanger (they agreed to meet for lunch at one
    o'clock). Realizes universal.a1.food.order_simple_meal
    (prerequisites: universal.a1.greetings.open_close_exchange (unit01),
    universal.a1.numbers.use_basic_numbers (unit02)). Authored fresh at
    schema_version 1.1 per AUTHORING_GUIDE §19. tú register throughout,
    both with each other and with the waiter (a young, informal
    restaurant, consistent with the workshop's overall casual register).

    Six lessons, recognition->drag->production (§2): 01 teaches core
    food/drink nouns (sándwich, ensalada, sopa, agua, café); 02 teaches
    ordering phrases (Quiero..., Para mí..., ¿Qué quieres comer?); 03
    teaches asking for and reading a menu; 04 teaches dessert and
    asking for the check (la cuenta); 05 is a short reading of a
    printed menu with prices (also lightly touches
    universal.a1.shopping's price-reading skill by exposure, but the
    unit's own spine_outcome_id stays food throughout per §1 -- prices
    here exist only to make the menu realistic, no lesson tests asking
    ABOUT a price the way unit07 will); 06 is a dialogue capstone: Elena
    and Mateo's actual lunch, ordering food, drink, and dessert, closing
    the loop from unit05's setup.

    Only specific numbers this unit's menu prices actually use (cinco,
    ocho, tres) are introduced, confirmed against
    validate_untaught_vocabulary's per-file accumulation (same finding
    as units04-05). §13: every fill_in_blank keeps surrounding context.
    §17: no true-synonym ambiguity risk -- sándwich/ensalada/sopa/agua/
    café are genuinely distinct foods, not synonyms, and lesson02's
    Quiero/Para mí are taught as a fixed alternate-phrasing pair (both
    always accepted together wherever tested, not treated as an open
    single-answer slot). §16: lesson01's matching_pairs uses all 5
    food/drink nouns plus 3 full example sentences (8 pairs). §12: the
    multi-clause accepted_answers (lesson06's closing order) has
    period/comma/conjunction-joined variants. No bare yes/no/true/false
    -- checked by hand.

    Internal consistency (§11): the lunch happens "al día siguiente"
    (the next day) at "la una," both facts established in unit05
    lesson05/06 and restated identically in this unit's lesson06
    dialogue; the restaurant is the same "restaurante cerca de aquí"
    Mateo mentioned in unit05's closing line. Menu prices (sándwich 5,
    ensalada 8, sopa 3 -- unit currency left unstated, matching this
    project's established convention of not inventing a fictional
    country/currency for the shared workshop setting) are internally
    consistent between the lesson05 reading and the lesson06 dialogue's
    actual order.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

