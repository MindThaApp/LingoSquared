          - {"content_key": "es.a2.unit101.lesson05.teach.lectura", "kind": "reading", "target": {"text": "Hola, Mateo. Lo siento, hoy no puedo traer el bolígrafo, pero mañana sí. ¿Te echo una mano con el trabajo? Gracias por el café, pero no hace falta. ¡Hasta mañana!", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["Hola", "Mateo", "Lo", "siento", "hoy", "no", "puedo", "traer", "el", "bolígrafo", "pero", "mañana", "sí", "Te", "echo", "una", "mano", "con", "trabajo", "Gracias", "por", "café", "hace", "falta", "Hasta"]}
        exercises:
          - {"content_key": "es.a2.unit101.lesson05.exercise01.lee_boligrafo", "type": "reading_comprehension", "tested_text": "hoy no puedo traer el bolígrafo pero mañana sí", "prompt": {"target_blocks": [{"text": "What does Elena say about the pen?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit101.lesson05.exercise02.lee_cafe", "type": "reading_comprehension", "tested_text": "gracias por el café pero no hace falta", "prompt": {"target_blocks": [{"text": "What does Elena do about the coffee?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit101.lesson05.exercise03.une_mensaje", "type": "matching_pairs", "tested_text": "Lo siento hoy no puedo pero mañana sí Te echo una mano con el trabajo Gracias por el café no hace falta Hasta mañana el bolígrafo", "prompt": {"target_blocks": []}, "pairs": [{"left": "Lo siento, hoy no puedo.", "right": "I am sorry, I cannot today."}, {"left": "pero mañana sí", "right": "but tomorrow I can"}, {"left": "¿Te echo una mano con el trabajo?", "right": "Shall I give you a hand with the work?"}, {"left": "Gracias por el café", "right": "Thanks for the coffee"}, {"left": "no hace falta", "right": "there is no need"}, {"left": "Hasta mañana", "right": "See you tomorrow"}, {"left": "el bolígrafo", "right": "the pen"}]}
          - {"content_key": "es.a2.unit101.lesson05.exercise04.ordena_boligrafo", "type": "word_order", "tested_text": "Lo siento hoy no puedo traer el bolígrafo", "prompt": {"target_blocks": []}, "word_bank": ["bolígrafo", "hoy", "Lo", "traer", "puedo", "siento", "el", "no"]}
          - {"content_key": "es.a2.unit101.lesson05.exercise05.traduce_cafe", "type": "translation", "tested_text": "Gracias por el café pero no hace falta", "prompt": {"target_blocks": [{"text": "Thanks for the coffee, but there is no need.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit101.lesson05.exercise06.dicta_mano", "type": "dictation", "tested_text": "¿Te echo una mano con el trabajo?", "media_asset_key": "es.a2.audio.me_ayudas.te_echo_una_mano_con_el_trabajo.01", "prompt": {"target_blocks": []}}
