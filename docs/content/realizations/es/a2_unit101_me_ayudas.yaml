      - content_key: es.a2.unit101.lesson06.en_la_oficina
        title: "En la oficina de Mateo"
        spine_outcome_id: universal.a2.requests.make_polite_requests_and_offers
        teaching:
          - {"content_key": "es.a2.unit101.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Hola, Mateo. ¿Puedes abrir la ventana de la oficina, por favor?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Hola", "Mateo", "Puedes", "abrir", "la", "ventana", "de", "oficina", "por", "favor"]}
          - {"content_key": "es.a2.unit101.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Sí, claro. ¿Quieres un café?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Sí", "claro", "Quieres", "un", "café"]}
          - {"content_key": "es.a2.unit101.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "No, gracias. No hace falta. ¿Me das un bolígrafo, por favor?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["No", "gracias", "hace", "falta", "Me", "das", "un", "bolígrafo", "por", "favor"]}
          - {"content_key": "es.a2.unit101.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Aquí tienes. ¿Te echo una mano con la bolsa?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Aquí", "tienes", "Te", "echo", "una", "mano", "con", "la", "bolsa"]}
          - {"content_key": "es.a2.unit101.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Sí, gracias. Muy amable.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Sí", "gracias", "Muy", "amable"]}
          - {"content_key": "es.a2.unit101.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "De nada. ¡Hasta mañana!", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["De", "nada", "Hasta", "mañana"]}
        exercises:
          - {"content_key": "es.a2.unit101.lesson06.exercise01.escucha_oferta", "type": "listen_select", "tested_text": "Aquí tienes Te echo una mano con la bolsa", "media_asset_key": "es.a2.audio.dialogue.me_ayudas.01", "prompt": {"target_blocks": []}}
          - {"content_key": "es.a2.unit101.lesson06.exercise02.entiende_ventana", "type": "dialogue_comprehension", "tested_text": "Puedes abrir la ventana de la oficina por favor", "media_asset_key": "es.a2.audio.dialogue.me_ayudas.01", "prompt": {"target_blocks": [{"text": "What does Elena ask Mateo to do first?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit101.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Puedes abrir la ventana Sí claro Quieres un café No gracias Me das un bolígrafo Aquí tienes Te echo una mano con la bolsa De nada", "prompt": {"target_blocks": []}, "pairs": [{"left": "¿Puedes abrir la ventana?", "right": "Can you open the window?"}, {"left": "Sí, claro.", "right": "Yes, of course."}, {"left": "¿Quieres un café?", "right": "Would you like a coffee?"}, {"left": "No, gracias.", "right": "No, thank you."}, {"left": "¿Me das un bolígrafo?", "right": "Can you give me a pen?"}, {"left": "Aquí tienes.", "right": "Here you are."}, {"left": "¿Te echo una mano con la bolsa?", "right": "Shall I give you a hand with the bag?"}, {"left": "De nada.", "right": "You are welcome."}]}
          - {"content_key": "es.a2.unit101.lesson06.exercise04.ordena_boligrafo", "type": "word_order", "tested_text": "Me das un bolígrafo por favor", "prompt": {"target_blocks": []}, "word_bank": ["bolígrafo", "favor", "das", "Me", "por", "un"]}
          - {"content_key": "es.a2.unit101.lesson06.exercise05.responde_cafe", "type": "dialogue_response", "tested_text": "No gracias No hace falta", "prompt": {"target_blocks": [{"text": "Sí, claro. ¿Quieres un café?", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit101.lesson06.exercise06.traduce_bolsa", "type": "translation", "tested_text": "Te echo una mano con la bolsa", "prompt": {"target_blocks": [{"text": "Shall I give you a hand with the bag?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit101.lesson06.exercise07.escribe_boligrafo", "type": "writing_prompt", "tested_text": "Me das un bolígrafo por favor Muy amable", "prompt": {"target_blocks": [{"text": "Write two Spanish sentences: (1) Ask Mateo for a pen, please (use *me das*). (2) Tell him he is very kind (use *muy amable*).", "language_code": "en", "direction": "ltr"}]}}
