      - content_key: es.a2.unit101.lesson05.el_mensaje_de_elena
        title: "El mensaje de Elena"
        spine_outcome_id: universal.a2.requests.make_polite_requests_and_offers
        teaching:
          - {"content_key": "es.a2.unit101.lesson05.teach.palabras", "kind": "vocabulary", "target": {"text": "hoy, mañana, pero, hasta mañana", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["hoy", "mañana", "pero", "hasta", "no", "puedo", "sí", "Gracias", "por", "el", "café", "Mateo", "Elena", "puedes", "traer", "bolígrafo"], "example": [{"text": "Hoy no puedo, pero mañana sí.", "language_code": "es", "direction": "ltr"}, {"text": "Gracias por el café, Mateo.", "language_code": "es", "direction": "ltr"}, {"text": "Hasta mañana, Elena.", "language_code": "es", "direction": "ltr"}, {"text": "Mateo, ¿puedes traer el bolígrafo hoy?", "language_code": "es", "direction": "ltr"}]}
