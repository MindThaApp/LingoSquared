  notes: >-
    Realizes universal.b1.necessity.express_obligation_with_subjunctive.
    B1 standalone basics are refreshed through document, form, office, and
    appointment vocabulary introduced in this tier. Character canon checked
    on disk and preserved: Mateo is a Colombian accountant living in London.
    This unit teaches obligation/prohibition with impersonal expressions plus
    subjunctive (Es necesario que entregue..., No está permitido que entre...)
    and past regret with Habría sido necesario que entregara..., then
    culminates in a written message containing present obligation, prohibition,
    and past regret.
