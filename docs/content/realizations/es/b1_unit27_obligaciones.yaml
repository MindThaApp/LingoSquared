  - {content_key: es.b1.audio.obligaciones.no_entre.01, language: es, text: "No está permitido que entre sin cita.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: es.b1.audio.obligaciones.entregara_ayer.01, language: es, text: "Habría sido necesario que entregara el formulario ayer.", voice_hint: neutral_young_adult, status: pending_generation}
