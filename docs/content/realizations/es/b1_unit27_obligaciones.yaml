units:
  - content_key: es.b1.unit27.obligaciones
    title: "Obligaciones con subjuntivo"
    section: reading_writing
    spine_outcome_ids: [universal.b1.necessity.express_obligation_with_subjunctive]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit27.lesson01.formulario_hoy
        title: "Es necesario que entregue..."
        spine_outcome_id: universal.b1.necessity.express_obligation_with_subjunctive
        teaching:
          - content_key: es.b1.unit27.lesson01.teach.el_formulario
            kind: vocabulary
            target: {text: "el formulario", language_code: es, direction: ltr}
            introduced_tokens: [el, formulario]
            example: {text: "El formulario está en la mesa.", language_code: es, direction: ltr}
          - content_key: es.b1.unit27.lesson01.teach.entregar
            kind: vocabulary
            target: {text: "entregar", language_code: es, direction: ltr}
            introduced_tokens: [entregar]
            example: {text: "Tengo que entregar el formulario.", language_code: es, direction: ltr}
          - {content_key: es.b1.unit27.lesson01.teach.es_necesario_entregue, kind: phrase, target: {text: "Es necesario que entregue el formulario hoy.", language_code: es, direction: ltr}, introduced_tokens: [Es, necesario, que, entregue, el, formulario, hoy]}
          - content_key: es.b1.unit27.lesson01.teach.subjunctive_note
            kind: grammar_note
            target: {text: "After *es necesario que*, Spanish uses the subjunctive: *entregue*, not *entrega*. English does not change the verb this way.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit27.lesson01.exercise01.choose_entregue, type: multiple_choice, tested_text: "Es necesario que entregue el formulario hoy", prompt: {target_blocks: [{text: "It is necessary that you hand in the form today.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit27.lesson01.exercise02.listen_entregue, type: listen_select, tested_text: "Es necesario que entregue el formulario hoy", media_asset_key: es.b1.audio.obligaciones.entregue_formulario.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit27.lesson01.exercise03.match_obligation
            type: matching_pairs
            tested_text: "formulario entregar necesario entregue hoy cita documento"
            prompt: {target_blocks: []}
            pairs: [{left: "el formulario", right: "the form"}, {left: "entregar", right: "to hand in"}, {left: "entregue", right: "you hand in (subjunctive)"}, {left: "es necesario que", right: "it is necessary that"}, {left: "hoy", right: "today"}, {left: "la cita", right: "the appointment"}]
          - {content_key: es.b1.unit27.lesson01.exercise04.order_entregue, type: word_order, tested_text: "Es necesario que entregue el formulario hoy", prompt: {target_blocks: []}, word_bank: [Es, necesario, que, entregue, el, formulario, hoy]}
          - {content_key: es.b1.unit27.lesson01.exercise05.translate_obligation, type: translation, tested_text: "Es necesario que entregue el formulario hoy", prompt: {target_blocks: [{text: "It is necessary that you hand in the form today, using formal usted.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit27.lesson02.prohibicion
        title: "No está permitido que..."
        spine_outcome_id: universal.b1.necessity.express_obligation_with_subjunctive
        teaching:
          - content_key: es.b1.unit27.lesson02.teach.sin_cita
            kind: vocabulary
            target: {text: "sin cita", language_code: es, direction: ltr}
            introduced_tokens: [sin, cita]
            example: {text: "No entro sin cita.", language_code: es, direction: ltr}
          - {content_key: es.b1.unit27.lesson02.teach.no_entre, kind: phrase, target: {text: "No está permitido que entre sin cita.", language_code: es, direction: ltr}, introduced_tokens: ["No", está, permitido, que, entre, sin, cita]}
          - content_key: es.b1.unit27.lesson02.teach.prohibition_note
            kind: grammar_note
            target: {text: "*No está permitido que* introduces a prohibition and is followed by subjunctive: *entre*. It is stronger than simply saying someone cannot enter.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit27.lesson02.exercise01.choose_no_entre, type: multiple_choice, tested_text: "No está permitido que entre sin cita", prompt: {target_blocks: [{text: "It is not permitted for you to enter without an appointment.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit27.lesson02.exercise02.listen_no_entre, type: listen_select, tested_text: "No está permitido que entre sin cita", media_asset_key: es.b1.audio.obligaciones.no_entre.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit27.lesson02.exercise03.match_prohibition
            type: matching_pairs
            tested_text: "no permitido entre sin cita formulario hoy"
            prompt: {target_blocks: []}
            pairs: [{left: "No está permitido que entre.", right: "It is not permitted for you to enter."}, {left: "sin cita", right: "without an appointment"}, {left: "entre", right: "you enter (subjunctive)"}, {left: "el formulario", right: "the form"}, {left: "hoy", right: "today"}, {left: "es necesario que", right: "it is necessary that"}]
          - {content_key: es.b1.unit27.lesson02.exercise04.order_no_entre, type: word_order, tested_text: "No está permitido que entre sin cita", prompt: {target_blocks: []}, word_bank: ["No", está, permitido, que, entre, sin, cita]}
          - {content_key: es.b1.unit27.lesson02.exercise05.fill_entre, type: fill_in_blank, tested_text: "No está permitido que entre sin cita", prompt: {target_blocks: [{text: "No está permitido que ___ sin cita. (enter, subjunctive)", language_code: es, direction: ltr}]}}

      - content_key: es.b1.unit27.lesson03.regret_ayer
        title: "Habría sido necesario que..."
        spine_outcome_id: universal.b1.necessity.express_obligation_with_subjunctive
        teaching:
          - content_key: es.b1.unit27.lesson03.teach.ayer
            kind: vocabulary
            target: {text: "ayer", language_code: es, direction: ltr}
            introduced_tokens: [ayer]
            example: {text: "Ayer tenía una cita.", language_code: es, direction: ltr}
          - {content_key: es.b1.unit27.lesson03.teach.era_necesario, kind: phrase, target: {text: "Habría sido necesario que entregara el formulario ayer.", language_code: es, direction: ltr}, introduced_tokens: [Habría, sido, necesario, que, entregara, el, formulario, ayer]}
          - content_key: es.b1.unit27.lesson03.teach.past_regret_note
            kind: grammar_note
            target: {text: "*Habría sido necesario que entregara...* says that I should have handed something in, but did not.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit27.lesson03.exercise01_choose_regret, type: multiple_choice, tested_text: "Habría sido necesario que entregara el formulario ayer", prompt: {target_blocks: [{text: "I should have handed in the form yesterday.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit27.lesson03.exercise02_listen_regret, type: listen_select, tested_text: "Habría sido necesario que entregara el formulario ayer", media_asset_key: es.b1.audio.obligaciones.entregara_ayer.01, prompt: {target_blocks: []}}
          - {content_key: es.b1.unit27.lesson03.exercise03_order_regret, type: word_order, tested_text: "Habría sido necesario que entregara el formulario ayer", prompt: {target_blocks: []}, word_bank: [Habría, sido, necesario, que, entregara, el, formulario, ayer]}
          - {content_key: es.b1.unit27.lesson03.exercise04_fill_entregara, type: fill_in_blank, tested_text: "Habría sido necesario que entregara el formulario ayer", prompt: {target_blocks: [{text: "Habría sido necesario que ___ el formulario ayer. (hand in, past subjunctive)", language_code: es, direction: ltr}]}}
          - {content_key: es.b1.unit27.lesson03.exercise05_translate_regret, type: translation, tested_text: "Habría sido necesario que entregara el formulario ayer", prompt: {target_blocks: [{text: "I should have handed in the form yesterday.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit27.lesson04.aviso_y_mensaje
        title: "Un aviso de obligación"
        spine_outcome_id: universal.b1.necessity.express_obligation_with_subjunctive
        teaching:
          - content_key: es.b1.unit27.lesson04.teach.original
            kind: vocabulary
            target: {text: "el documento original", language_code: es, direction: ltr}
            introduced_tokens: [el, documento, original]
            example: {text: "Traigo el documento original.", language_code: es, direction: ltr}
          - {content_key: es.b1.unit27.lesson04.teach.es_obligatorio, kind: phrase, target: {text: "Es obligatorio que traiga el documento original.", language_code: es, direction: ltr}, introduced_tokens: [Es, obligatorio, que, traiga, el, documento, original]}
          - {content_key: es.b1.unit27.lesson04.teach.aviso, kind: reading, target: {text: "Es obligatorio que traiga el documento original. No está permitido que entre sin cita.", language_code: es, direction: ltr}, introduced_tokens: [Es, obligatorio, que, traiga, el, documento, original, "No", está, permitido, entre, sin, cita]}
        exercises:
          - {content_key: es.b1.unit27.lesson04.exercise01.choose_obligatorio, type: multiple_choice, tested_text: "Es obligatorio que traiga el documento original", prompt: {target_blocks: [{text: "It is compulsory that you bring the original document.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit27.lesson04.exercise02.listen_aviso, type: listen_select, tested_text: "Es obligatorio que traiga el documento original", media_asset_key: es.b1.audio.obligaciones.aviso.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit27.lesson04.exercise03.match_full_unit
            type: matching_pairs
            tested_text: "necesario obligatorio permitido entregue entregara traiga entre"
            prompt: {target_blocks: []}
            pairs: [{left: "Es necesario que entregue el formulario.", right: "present obligation"}, {left: "No está permitido que entre sin cita.", right: "prohibition"}, {left: "Habría sido necesario que entregara el formulario.", right: "past regret"}, {left: "traiga", right: "you bring (subjunctive)"}, {left: "el documento original", right: "the original document"}, {left: "ayer", right: "yesterday"}]
          - {content_key: es.b1.unit27.lesson04.exercise04.order_obligatorio, type: word_order, tested_text: "Es obligatorio que traiga el documento original", prompt: {target_blocks: []}, word_bank: [Es, obligatorio, que, traiga, el, documento, original]}
          - {content_key: es.b1.unit27.lesson04.exercise05.write_culminating_obligation, type: writing_prompt, tested_text: "Es necesario que entregue el formulario hoy No está permitido que entre sin cita Habría sido necesario que entregara el formulario ayer", prompt: {target_blocks: [{text: "Write three Spanish sentences. First, use \"Es necesario que...\" to say, using formal usted, that you must hand in the form today. Then use \"No está permitido que...\" to say, using formal usted, that you may not enter without an appointment. Then use \"Habría sido necesario que...\" to say that I should have handed in the form yesterday.", language_code: en, direction: ltr}]}}
