generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1 unit 04, the fourth C1 unit in the
    es lane. Sourcing attempted: a firecrawl search for public-domain
    advanced/C1 Spanish argumentation material returned only commercial and
    non-public-domain hits; the only verified public-domain Spanish source
    (FSI Spanish Basic Course, per AUTHORING_GUIDE 10) caps at intermediate
    and cannot scaffold C1 concession/counter-argument content. No usable
    public-domain C1 Spanish source was found, so this is
    established-conventions-only authoring, built from general knowledge of
    Spanish argumentation conventions, using unit03 (controlar_el_tono) as
    the assigned structural exemplar for pacing and exercise depth only --
    every word of Spanish text is freshly authored, not translated from any
    other lane, and the scenario is unrelated to unit03's. Elena and Mateo
    continue as the established es characters (informal tu register: Elena is
    a Spanish teacher in London, Mateo is a Colombian accountant in London
    who works in an office -- profile set in b1_unit44 and earlier); they
    debate, conceding and countering with subtlety, whether Elena should
    accept a one-year teaching post in Valencia. No sibling-direction file
    (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness and correct informal-tu register of the Elena/Mateo frame
    narration and every argumentative phrase (es cierto que, reconozco que,
    admito que, tienes razon en que, no cabe duda de que, sin embargo, no
    obstante, aunque, aun asi, por un lado / por otro lado, a fin de cuentas,
    las ventajas compensan los inconvenientes); (2) that the concessive
    connectives take the correct mood (es cierto que + indicative, no cabe
    duda de que + indicative, aunque + indicative/subjunctive) throughout;
    (3) the lesson06 culminating writing answer is graded against a fixed
    multi-sentence string -- confirm the accepted-answer punctuation variants
    (trailing period vs none, internal colon/comma) cover what a correct
    learner would type, and that the colon in "un coste: pierdo a mis
    alumnos" matches the dialogue teaching card's own punctuation; (4) the
    lesson05 reading genuinely maps concession, qualification, counter and
    weighing; (5) confirm "a fin de cuentas", "aun asi", "no cabe duda de
    que" read as current pan-Hispanic Spanish, not as anglicisms.
  notes: >-
    Fourth Spanish C1 unit. Targets the CEFR C1 argumentation outcome
    (universal.c1.argumentation.concede_and_counter_with_subtlety): argue with
    subtlety -- genuinely concede a valid opposing point, then qualify or
    rebut it, weighing competing considerations rather than dismissing them.
    Theme: one coherent situation across all six lessons -- Elena has been
    offered a one-year teaching post in Valencia and she and Mateo debate
    whether she should take it, each conceding the other's strongest point,
    qualifying its scope, countering, and weighing the trade-offs. Lesson arc
    mirrors the outcome's own assessment requirements: L01 the concept and
    the moves (el argumento, conceder, matizar, el contraargumento, sopesar,
    el matiz); L02 conceding (es cierto que, reconozco que, admito que,
    tienes razon en que, no cabe duda de que, la concesion); L03 qualifying
    and countering (sin embargo, no obstante, aunque, aun asi, la objecion,
    contraargumentar); L04 weighing (por un lado / por otro lado, las
    ventajas, los inconvenientes, compensar, a fin de cuentas); L05 reading a
    nuanced argument and mapping its concession, qualification, counter and
    weighing; L06 the culminating production -- a listening exchange that
    distinguishes the moves, a speaking task that concedes then qualifies,
    and a writing task that produces a genuine concession + proportionate
    counter + weighing, in that order, plus a dictation. Register: informal
    tu throughout the Elena/Mateo frame narration and instructions (es lane
    precedent); the argumentative toolkit itself is essayistic. All
    vocabulary is introduced self-contained within this file (C1 is a
    separate Course row from B1/B2, so a C1 learner never sees lower-tier
    lexemes at runtime); common words already introduced in
    c1_unit01/c1_unit02/c1_unit03 are reused per the cumulative-vocabulary
    rule.

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout for the lane's frame narration and instructions
    (es lane precedent from b1_unit27/29/33 and b2_unit01). Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2 units. This unit is ABOUT argumentation: it teaches and tests a
    set of essayistic argumentative connectives (es cierto que, sin embargo,
    no obstante, aunque, aun asi, a fin de cuentas) as the target content the
    learner must recognize and produce -- distinct from the lane's default
    informal tu used in the Elena/Mateo frame dialogue and in instructions.
    No vosotros. The argumentative register does not leak vosotros or usted
    into the frame, and the informal tu frame does not leak into the target
    argumentative content.

