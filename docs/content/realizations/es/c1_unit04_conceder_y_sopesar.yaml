      - content_key: es.c1.unit04.lesson05.leer_un_argumento_matizado
        title: "Leer un argumento matizado"
        spine_outcome_id: universal.c1.argumentation.concede_and_counter_with_subtlety
        teaching:
          - content_key: es.c1.unit04.lesson05.teach.el_texto
