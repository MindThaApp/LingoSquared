schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    From-scratch generation, not adapted from a source. Completes es's
    first B2 wave (units 01-04: argumentación, especulación, matices,
    relato); mirrors nl's shipped B2 unit04 (verhaal) as the assigned
    structural exemplar (lesson arc, exercise-type pacing, spine-outcome
    sequencing) -- every sentence of actual Spanish text is freshly
    authored, not translated from the Dutch. Elena and Mateo continue as
    the established es characters; only lesson06's culminating dialogue
    is a full back-and-forth, matching the unit's own convention of
    naming them only there. No sibling-direction file (es-en) was
    consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority
    checks: (1) confirm the imperfect/preterite split (hacía/estaba for
    background vs desperté/salí/llegué for foregrounded events) is used
    correctly and consistently throughout, including in the culminating
    lesson06 dialogue; (2) confirm "el autobús ya se había ido" and "ya
    habían empezado" (pluperfect) are the natural way to express the
    pre-past event, not "acababa de" or another alternative; (3)
    lesson04 deliberately avoids the imperfect subjunctive ("antes de
    que llegara") in favor of a nominalized alternative ("antes de mi
    llegada") since the imperfect subjunctive isn't taught in this
    unit -- confirm this substitution reads as natural rather than
    stilted; (4) confirm "por fin" and "tan" (¡Qué mañana tan horrible!)
    read as idiomatic pan-Hispanic Spanish.
  notes: >-
    Fourth Spanish B2 unit. Targets the CEFR B2 narrative outcome
    (universal.b2.narrative.recount_complex_events_with_shifting_time):
    recount a complex sequence of events with shifting time reference --
    background vs foreground, pre-past events, and interrupted actions,
    keeping the timeline unambiguous. Theme: Elena's chaotic morning --
    running late for an important meeting -- one continuous story
    running across all six lessons. Lesson arc: L01 background with the
    imperfect (hacía frío, eran las siete, estaba en la cama), L02 the
    foregrounded event sequence with the preterite plus sequencing words
    (primero, luego, después, entonces), L03 an action interrupted by
    another (mientras + imperfect / cuando + preterite), L04 the
    pre-past with the pluperfect (había salido, se había ido), L05 a
    reading combining all four devices and asking what happened in what
    order, L06 the culminating production -- Elena recounts the whole
    morning to Mateo, and the exercises require background, an
    interrupting event, and something that had already happened, in one
    account, matching the spine outcome's compound production
    requirement literally. Register: informal tu throughout. All
    vocabulary continues the token pool established in units 01-03 (same
    course, cumulative per docs/content/CLAUDE.md).

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent). B2 narrative layers the
    imperfect/preterite contrast and the pluperfect onto that register --
    hacía, estaba, desperté, salí, llegué, se había ido -- while keeping
    everyday informal address. Elena and Mateo continue the informal tu
    they use with each other throughout the es lane.

