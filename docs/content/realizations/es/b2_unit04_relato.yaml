  - content_key: es.b2.audio.relato.dialogo.manana_horrible.01
    language: es
    text: >-
      Mateo: ¿Qué pasó esta mañana? Elena: Hoy tuve una mañana
      horrible. Hacía mucho frío y todavía estaba en la cama cuando
      sonó la alarma. Me desperté tarde, salí de casa corriendo, pero
      el autobús ya se había ido. Mientras esperaba un taxi, sonó el
      teléfono: era mi jefe. Por fin llegué a la reunión, pero ya
      habían empezado. Mateo: ¡Qué mañana tan horrible!
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

