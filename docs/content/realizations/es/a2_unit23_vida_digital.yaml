    language: es
    text: >-
      Mateo: ¿Usas mucho el móvil durante la semana? Elena: Sí, lo uso
      todos los días para leer noticias y escribir mensajes. Mateo: Yo
      miro las redes sociales por la noche. Elena: Yo también, pero creo
      que paso demasiado tiempo en línea. Mateo: Tienes razón. Es útil,
      pero a veces cansa.
    voice_hint: two_young_adults_neutral_friendly
