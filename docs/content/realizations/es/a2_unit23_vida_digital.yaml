  notes: >-
    Realizes universal.a2.technology.discuss_online_habits literally:
    learners identify an online activity and frequency, describe daily
    phone/internet use, give a simple opinion, read a short habit message,
    and finish by writing a habit-plus-opinion message. Character canon
    checked on disk: Elena is a London-based teacher from Spain; Mateo is a
    London-based accountant from Colombia. The unit has them discuss normal
    phone habits after arranging plans.

    Second-pass review 2026-10-19: 3 fixes — lesson04.exercise01.read_activity and exercise02.read_opinion: added the Spanish message text to prompt.target_blocks (questions were unanswerable without it); lesson03.exercise05.respond_opinion and lesson04.exercise06.respond_habit_opinion: prompt ¿Qué opinas...? changed to ¿Qué piensas...? (opinas never taught; piensas taught in unit17).
