            kind: grammar_note
            target: {text: "*Me queda bien* (it fits me well) uses *quedar* (to fit/suit), a different verb from *ser* or *estar* -- literally \"it stays/remains well on me.\" *Bien* and *mal* here describe fit, not quality.", language_code: en, direction: ltr}
