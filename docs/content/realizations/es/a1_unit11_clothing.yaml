          - {content_key: es.a1.unit11.lesson05.exercise07.write_precios_summary, type: writing_prompt, tested_text: "La camisa cuesta quince El delantal cuesta doce", prompt: {target_blocks: [{text: "Write two Spanish sentences from the price list: how much the shirt costs, and how much the apron costs.", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
        title: "Elena y Mateo compran delantales"
        spine_outcome_ids: [universal.a1.clothing.describe_buy_clothing]
        teaching:
          - {content_key: es.a1.unit11.lesson06.teach.line01, kind: dialogue, target: {text: "Necesitamos delantales para el taller.", language_code: es, direction: ltr, speaker: Elena}, introduced_tokens: [Necesitamos, delantales, para, el, taller]}
          - {content_key: es.a1.unit11.lesson06.teach.line02, kind: dialogue, target: {text: "Tienes razón. Vamos a esa tienda.", language_code: es, direction: ltr, speaker: Mateo}, introduced_tokens: [Tienes, razón, Vamos, a, esa, tienda]}
