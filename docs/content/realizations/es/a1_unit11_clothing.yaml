          - {content_key: es.a1.unit11.lesson03.exercise07.write_own_price, type: writing_prompt, tested_text: "Cuesta doce", prompt: {target_blocks: [{text: "Write in Spanish: it costs twelve.", language_code: en, direction: ltr}]}}

