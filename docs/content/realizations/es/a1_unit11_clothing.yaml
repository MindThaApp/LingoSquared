        title: "¿Qué talla usas?"
        spine_outcome_id: universal.a1.clothing.describe_buy_clothing
        teaching:
          - {content_key: es.a1.unit11.lesson02.teach.que_talla_usas, kind: phrase, target: {text: "¿Qué talla usas?", language_code: es, direction: ltr}, introduced_tokens: [Qué, talla, usas]}
          - {content_key: es.a1.unit11.lesson02.teach.uso_la_talla_mediana, kind: phrase, target: {text: "Uso la talla mediana.", language_code: es, direction: ltr}, introduced_tokens: [Uso, la, talla, mediana]}
          - {content_key: es.a1.unit11.lesson02.teach.me_queda_bien, kind: phrase, target: {text: "Me queda bien.", language_code: es, direction: ltr}, introduced_tokens: [Me, queda, bien]}
          - {content_key: es.a1.unit11.lesson02.teach.me_queda_mal, kind: phrase, target: {text: "Me queda mal.", language_code: es, direction: ltr}, introduced_tokens: [Me, queda, mal]}
