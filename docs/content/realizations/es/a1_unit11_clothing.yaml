      - content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
        title: "La lista de precios"
        spine_outcome_id: universal.a1.clothing.describe_buy_clothing
        teaching:
          - content_key: es.a1.unit11.lesson05.teach.precios_reading
            kind: reading
            target:
              text: "En esta tienda, la camisa cuesta quince, el pantalón cuesta veinte, la chaqueta cuesta treinta, y los zapatos cuestan veinticinco. El delantal es el más barato: solo cuesta doce."
              language_code: es
              direction: ltr
            introduced_tokens: [En, esta, tienda, la, camisa, cuesta, quince, el, pantalón, veinte, chaqueta, treinta, y, los, zapatos, cuestan, veinticinco, El, delantal, es, más, barato, solo, doce]
