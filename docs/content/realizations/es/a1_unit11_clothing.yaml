status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    No FSI Spanish Basic Course unit directly covers clothing shopping
    as its own topic (all 4 volumes' tables of contents were checked
    this session via direct PDF download + `pdftotext -layout` --
    Volume 1 units 1-15, Volume 2 units 16-30, Volume 3 units 31-45,
    Volume 4 units 46-55 -- none is titled around clothing, and a text
    search of all four volumes' basic-sentences sections for
    clothing/dress/shirt vocabulary found nothing beyond one incidental
    "undershirt" mention in a medical-exam dialogue, Volume 4 Unit 51).
    Per AUTHORING_GUIDE §10, when no directly-usable public-domain
    source exists for a topic, established-conventions-only authoring
    is the honest fallback rather than stretching an unrelated source
    -- the same finding already made for unit08 (places). This unit is
    authored from established beginner-Spanish teaching conventions
    (common clothing nouns: la camisa, el pantalón, la chaqueta, los
    zapatos, el delantal; size/fit phrases: la talla, me queda bien/
    mal). The specific scenario (buying matching aprons for the
    workshop) and all exercise content are original to this unit.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Eleventh Spanish A1 unit, continuing the Elena/Mateo cooking-
    workshop storyline. Realizes universal.a1.clothing.describe_buy_
    clothing (no prerequisites per the spine). The workshop instructor
    has asked everyone to bring their own apron, so Elena and Mateo go
    to a shop together to buy matching ones -- a natural, workshop-
    grounded reason to shop for clothing rather than a generic
    department-store scene. Authored fresh at schema_version 1.1 per
    AUTHORING_GUIDE §19. tú register throughout, both with each other
    and with the shop clerk.

    Six lessons, recognition->drag->production (§2): 01 teaches 5
    clothing nouns (la camisa, el pantalón, la chaqueta, los zapatos,
    el delantal); 02 teaches size/fit phrases (¿Qué talla usas? / Uso
    la talla mediana / Me queda bien / Me queda mal); 03 teaches the
    core question-and-answer pattern for trying something on and
    checking the price (¿Cuánto cuesta este delantal? / Cuesta doce);
    04 is a phrase lesson about color-free preference and decision
    (Me gusta este. Voy a comprarlo.); 05 is a reading of a short shop
    price list; 06 is a dialogue capstone where Elena and Mateo buy
    matching aprons at the shop.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    me queda bien / me queda mal for true-synonym risk -- they are
    opposites (fits well vs. fits badly), not synonyms, and every slot
    testing one is anchored by an already-stated fact (which specific
    item and size was just tried on), never an open choice. §16:
    lesson01's matching_pairs uses all 5 clothing nouns plus 3 example
    sentences (8 pairs). §12: multi-clause accepted_answers (lesson06's
    decision-to-buy sentences) have period/comma/conjunction-joined
    variants. No bare yes/no/true/false -- checked by hand ("Sí"
    appears standalone in exercises' accepted_answers and is always
    double-quoted).

    Internal consistency (§11): reuses unit07's established ¿Cuánto
    cuesta? / Cuesta [number] pattern and price-stating convention
    (cardinal number as the price) without contradiction; the apron
    price (doce) and shirt/pants/jacket/shoe prices stated in lesson05's
    reading are mutually consistent with lesson06's dialogue (both
    aprons cost doce each). Never contradicts any established fact
    about Elena/Mateo (Spain/Colombia-living-in-London, tú register,
    22 July class).

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

