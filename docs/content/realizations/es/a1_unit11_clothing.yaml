      Elena: Necesitamos delantales para el taller.
      Mateo: Tienes razón. Vamos a esa tienda.
      Empleado: Buenos días. ¿Los ayudo?
      Elena: Sí, buscamos delantales.
      Empleado: Aquí tengo estos. ¿Qué talla usan?
      Mateo: Uso la talla mediana.
      Elena: Yo también.
      Mateo: ¿Cuánto cuesta este delantal?
      Empleado: Cuesta doce.
      Elena: Me queda bien. Me gusta este. Voy a comprarlo.
      Mateo: A mí también me queda bien. Compramos dos.
