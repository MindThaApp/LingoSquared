schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    From-scratch generation, not adapted from a source. Mirrors nl's shipped
    B2 unit07 (onderhandelen) as the assigned structural exemplar (6-lesson
    negotiation-move progression: propose -> decline politely -> conditional
    concession -> reach agreement -> read a written exchange -> full
    negotiation dialogue; lesson/exercise counts matched exactly) -- every
    sentence of actual Spanish text is freshly authored from Spanish
    grammar/discourse knowledge, not translated from the Dutch (no calquing,
    per dispatch instructions). Elena and Mateo continue as the established
    es B2 characters (informal tu register, set in earlier B1/B2 units); per
    the es-lane's own established convention (see b2_unit02's review notes),
    lessons 01-05 keep the negotiation generic (address "tu" directly, no
    named speaker), and only the culminating lesson06 dialogue names Elena
    and Mateo. Scenario: they are organizing a surprise party for a mutual
    friend and must divide tasks (cooking, buying drinks, cleaning up) and
    settle a still-open point (the gift) -- deliberately not a
    shared-living scenario, so no conflict with established canon (no
    shared residence has ever been claimed for Elena/Mateo). Sibling
    isolation honored: no other B2 unit (05/06/08, authored in parallel by
    other agents) and no sibling-direction file (es-en) was consulted; only
    this course's own committed b2_unit01-04 realizations/overlays were
    read, to harvest the accumulated course-scoped introduced-token pool
    (per docs/content/CLAUDE.md) and confirm character canon.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness and current everyday register of
    "trato hecho", "eso no me viene bien", "estoy de acuerdo en parte,
    pero...", and "¿podríamos llegar a un punto medio?" -- confirm these
    read as natural informal spoken pan-Hispanic Spanish, not stilted; (2)
    the indicative/subjunctive split is the unit's core grammar point --
    "pero solo si" + indicative states a real, already-decided condition
    ("Puedo cocinar, pero solo si tú limpias"), while "siempre que", "con
    tal de que" and "a menos que" + subjunctive mark the hypothetical
    trigger of a concession ("Estoy de acuerdo, siempre que tú limpies") --
    confirm every instance is used correctly and that the contrast reads as
    natural, not overtaught; (3) confirm "te propongo que" + subjunctive
    and "mi propuesta es que" + subjunctive (both proposal-of-suggestion
    frames) sound natural rather than overly formal for two friends
    organizing a party together, and that "qué tal si" / "y si" +
    indicative (real, open suggestions) contrast correctly against them;
    (4) the culminating lesson06 speaking answer (exercise05) is a
    TWO-sentence move graded against a fixed string -- comma-present,
    comma-absent, trailing-period and no-trailing-period variants are
    supplied, but decide whether a learner might phrase the two-move
    structure differently and whether more variants are needed; (5)
    cross-check the negotiation facts across lessons 05-06 for consistency
    (cooking/drinks agreed from the start, cleaning traded conditionally
    for the cake, the gift still open) -- confirm no contradiction slipped
    in.
  notes: >-
    Fifth Spanish B2 unit committed to disk (unit07; units 05/06/08 are
    being authored in parallel by other agents and were not consulted).
    Targets the CEFR B2 negotiation outcome
    (universal.b2.negotiation.negotiate_and_resolve_disagreement): negotiate
    and resolve a disagreement -- state terms, decline a term, offer a
    CONDITIONAL concession, reach agreement. Theme: organizing a surprise
    party for a friend -- one coherent negotiation running across all six
    lessons (who cooks, who buys the drinks, who cleans up, and the still-
    open question of the gift). Lesson arc: L01 making a proposal / stating
    terms (te propongo que + subjunctive, qué tal si / y si + indicative,
    mi propuesta es que + subjunctive); L02 declining a task politely (eso
    no puedo hacerlo, lo siento pero no puedo, prefiero que no, eso no me
    viene bien); L03 the core act, a conditional concession (pero solo si +
    indicative for a real condition, vs siempre que / con tal de que / a
    menos que + subjunctive for the hypothetical trigger of a concession,
    plus estoy de acuerdo en parte, pero...); L04 reaching agreement (trato
    hecho, de acuerdo, me parece bien, ¿podríamos llegar a un punto medio?)
    plus splitting the cost; L05 a written EXCHANGE of terms for the
    reading requirement (identify what was agreed and what remains open);
    L06 the culminating production -- a named Elena/Mateo dialogue for the
    listening requirement (identify what each side proposes, declines, and
    the conditional concession offered), a speaking task requiring the
    WHOLE negotiation move (state terms + decline one + conditional
    concession), and a writing task proposing revised terms with a new
    condition attached. Register: informal tu throughout. All vocabulary is
    introduced self-contained within this file, course-scoped to this
    course's own committed b2_unit01-04 (B2 is a separate Course row from
    B1/A-levels, same self-containment precedent as this course's earlier
    units). No sibling-direction file was consulted.

    Second-pass review 2026-10-19: 4 fixes -- lesson03.teach.a_menos_que +
    lesson03.exercise07: 'Yo lo hago, a menos que tú lo prefieras'
    (illogical: 'unless you prefer it') -> 'Yo lo hago, a menos que
    prefieras hacerlo tú'; lesson05.teach.texto: 'Te propongo que yo
    cocine y tú compras la bebida' mixed subjunctive and indicative under
    one 'propongo que' -> 'Te propongo que yo cocine. ¿Tú compras la
    bebida?' (exercise01 tested_text mirrored); lesson05.exercise01-04:
    the reading text was never shown; added as es prompt.target_block, and
    exercise03/04 now say 'first speaker' / 'second speaker' (exercise04
    asked what the FIRST friend declines, but the second speaker declines
    cleaning); lesson06.exercise05/06: prompts no longer print the full
    Spanish sentence 'te propongo que yo cocine' / 'yo compro el pastel'
    (answer leak). NATIVE FLAGS: Elena both proposing and approving her
    own idea ('Lo compramos juntos. Me parece bien.') reads a little odd;
    left as authored.

    Language review 2026-10-20 (native-level es/en editor pass): 2 fixes
    (realization side) -- lesson06 dialogue/audio: Elena proposed and
    approved her own idea ('Lo compramos juntos. Me parece bien.') -> 'Lo
    compramos juntos, ¿te parece bien?'; lesson06.exercise06 prompt
    glossed siempre que as 'provided that' (the unit's gloss for con tal
    de que) -> 'as long as'. NATIVE FLAGS: 'No, eso no puedo hacerlo hoy.
    Pero estoy de acuerdo, con tal de que tu traigas el pastel' -- 'estoy
    de acuerdo' has no clear object after a refusal; tested in
    exercise04/05/07, so left. 'la bebida' for party drinks is Peninsular-
    colloquial ('las bebidas' elsewhere).

    Owner-approved follow-up 2026-10-20: 'Pero estoy de acuerdo, con tal
    de que tu traigas el pastel' (no object) -> 'Pero compro la bebida
    mañana, con tal de que tu traigas el pastel' (audio, dialogue card,
    grammar_completo); lesson06.exercise04 key/word bank -> 'Compro la
    bebida mañana con tal de que tu traigas el pastel';
    lesson06.exercise05 key and prompt (friend asks you to buy the drinks;
    decline for today, concede tomorrow).

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent). B2 negotiation layers
    proposing, declining and conditional-concession frames onto that
    register -- te propongo que, qué tal si, mi propuesta es que, eso no
    puedo hacerlo, prefiero que no, pero solo si, siempre que, con tal de
    que, a menos que, trato hecho, de acuerdo -- while keeping everyday
    informal address (tú, te, tu). Elena and Mateo continue the informal tú
    they use with each other throughout the es lane.

