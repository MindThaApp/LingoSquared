      - content_key: es.c1.unit08.lesson01.el_arte_de_persuadir
        title: "El arte de persuadir"
        spine_outcome_id: universal.c1.persuasion.persuade_with_rhetorical_devices
        teaching:
          - content_key: es.c1.unit08.lesson01.teach.persuadir
            kind: vocabulary
            target: {text: "persuadir", language_code: es, direction: ltr}
            introduced_tokens: [persuadir, es, mover, a, la, audiencia, actuar]
            example: {text: "Persuadir es mover a la audiencia a actuar.", language_code: es, direction: ltr}
          - content_key: es.c1.unit08.lesson01.teach.el_discurso
            kind: vocabulary
            target: {text: "el discurso", language_code: es, direction: ltr}
            introduced_tokens: [discurso, un, breve, persuade, más, que, uno, largo]
            example: {text: "Un discurso breve persuade más que uno largo.", language_code: es, direction: ltr}
          - content_key: es.c1.unit08.lesson01.teach.la_audiencia
            kind: vocabulary
            target: {text: "la audiencia", language_code: es, direction: ltr}
            introduced_tokens: [conoce, antes, de, hablar]
            example: {text: "Conoce a la audiencia antes de hablar.", language_code: es, direction: ltr}
          - content_key: es.c1.unit08.lesson01.teach.la_retorica
            kind: vocabulary
            target: {text: "la retórica", language_code: es, direction: ltr}
            introduced_tokens: [retórica, el, arte]
            example: {text: "La retórica es el arte de persuadir.", language_code: es, direction: ltr}
          - content_key: es.c1.unit08.lesson01.teach.el_argumento
            kind: vocabulary
            target: {text: "el argumento", language_code: es, direction: ltr}
            introduced_tokens: [argumento, buen, convence]
            example: {text: "Un buen argumento convence a la audiencia.", language_code: es, direction: ltr}
          - content_key: es.c1.unit08.lesson01.teach.la_opinion
            kind: vocabulary
            target: {text: "la opinión", language_code: es, direction: ltr}
            introduced_tokens: [cambiar, opinión, de, alguien]
            example: {text: "Persuadir es cambiar la opinión de alguien.", language_code: es, direction: ltr}
          - content_key: es.c1.unit08.lesson01.teach.persuadir_note
            kind: grammar_note
            target: {text: "Persuadir es mover a la audiencia a actuar o a cambiar de opinión.", language_code: es, direction: ltr}
            introduced_tokens: [o]
        exercises:
          - content_key: es.c1.unit08.lesson01.exercise01.recognize_persuadir
            type: multiple_choice
            tested_text: "persuadir"
            prompt: {target_blocks: [{text: "persuadir", language_code: es, direction: ltr}]}
          - content_key: es.c1.unit08.lesson01.exercise02.recognize_retorica
            type: multiple_choice
            tested_text: "la retórica"
            prompt: {target_blocks: [{text: "la retórica", language_code: es, direction: ltr}]}
          - content_key: es.c1.unit08.lesson01.exercise03.match_conceptos
            type: matching_pairs
            tested_text: "persuadir el discurso la audiencia la retórica el argumento la opinión"
            prompt: {target_blocks: []}
            pairs:
