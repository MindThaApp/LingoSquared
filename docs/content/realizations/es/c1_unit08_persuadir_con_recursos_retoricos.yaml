              - {left: "el discurso", right: "the speech"}
              - {left: "la audiencia", right: "the audience"}
              - {left: "la retórica", right: "rhetoric"}
              - {left: "el argumento", right: "the argument"}
              - {left: "la opinión", right: "the opinion"}
          - content_key: es.c1.unit08.lesson01.exercise04.order_persuadir
            type: word_order
            tested_text: "Persuadir es mover a la audiencia"
            prompt: {target_blocks: []}
