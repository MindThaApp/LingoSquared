    sentence; (5) lesson06 accepted-answer punctuation variants cover what a
    correct learner would produce; (6) the central appeal theme stays
    internally consistent across the reading passage, dialogue, and audio.
  notes: >-
    Eighth and final Spanish C1 unit, targeting the CEFR C1 persuasion
    outcome. Theme: Elena delivers a short speech to the school assembly
    persuading families to reduce single-use plastic, coached by Mateo.
    Lesson arc maps the four assessment requirements: L01 core persuasion
    concepts; L02 rhetorical question and parallelism; L03 emphasis and
    appeals; L04 modulating stance and intensity; L05 analyzing the full
    speech; L06 the culminating production (listening, speaking, writing,
    dictation) requiring the full five-sentence appeal. Register: informal
    tu in the frame, formal ustedes in the speech. No vosotros.

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout for the lane's frame narration and instructions
    (es lane precedent from b1_unit27/29/33 and b2_unit01). Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2/C1 units. This unit is specifically ABOUT persuasion: the
    persuasive speech/appeal itself (the target content the learner analyzes
    and produces) is delivered in the FORMAL ustedes register -- the public
    rhetorical register a speaker uses when addressing an audience (les
    pido que cambien, juntos podemos) -- while the frame dialogue, narration,
    and instructions stay in the lane's default informal tu. No vosotros.
    The formal ustedes does not leak into the Elena/Mateo frame, and the
    informal tu does not leak into the speech.

media_assets:
  - content_key: es.c1.audio.persuasion.discurso.01
    language: es
    text: >-
      ¿De verdad queremos dejar a nuestros hijos un planeta lleno de
      plástico? Cada botella que tiramos, cada bolsa que usamos una sola
      vez, cada gesto que no hacemos deja una huella. No es solo una
      cuestión de comodidad: es una cuestión de responsabilidad. Por eso
      les pido que cambien un hábito hoy. Juntos podemos reducir el
      plástico, y juntos podemos empezar hoy.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.c1.audio.persuasion.intercambio.01
    language: es
    text: >-
      Elena: Empecé con una pregunta retórica. Mateo: Después usaste un
      paralelismo con cada botella, cada bolsa, cada gesto. Elena: El
      énfasis está en el contraste: no es solo una cuestión de comodidad.
      Mateo: La apelación final es directa: les pido que cambien un hábito
      hoy.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
  - content_key: es.c1.audio.persuasion.dictado.01
    language: es
    text: "Por eso les pido que cambien un hábito hoy"
    voice_hint: neutral_adult_clear
    status: pending_generation

units:
  - content_key: es.c1.unit08.persuadir_con_recursos_retoricos
    title: "Persuadir con recursos retóricos"
    section: reading_writing
    spine_outcome_ids:
