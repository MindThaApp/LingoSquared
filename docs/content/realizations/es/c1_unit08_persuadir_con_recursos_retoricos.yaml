          - content_key: es.c1.unit08.lesson01.exercise05.translate_persuadir
            type: translation
            tested_text: "Persuadir es cambiar la opinión de alguien"
            prompt: {target_blocks: [{text: "To persuade is to change someone's opinion.", language_code: en, direction: ltr}]}
          - content_key: es.c1.unit08.lesson01.exercise06.speak_retorica
