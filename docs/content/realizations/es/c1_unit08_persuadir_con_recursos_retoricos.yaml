  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1 unit 08, the eighth and final C1
    unit in the es lane. Sourcing attempted: a firecrawl search for a
    public-domain advanced/C1 Spanish persuasion/rhetoric source returned
    only commercial/copyrighted courseware (Harvard Online, edX, Springer)
    and no public-domain Spanish C1 source; the FSI Spanish Basic Course is
    public domain but caps at intermediate, so per AUTHORING_GUIDE 10 it
    cannot scaffold C1 persuasion/rhetoric content. No usable public-domain
    C1 Spanish source was found, so this is established-conventions-only
    authoring. Unit07 (mediar_entre_fuentes) was the structural exemplar for
    pacing and exercise depth only. Elena (Spanish teacher in London) and
    Mateo (Colombian accountant in London) continue as the established es
    characters. Elena must deliver a short persuasive speech to the school
    assembly persuading families to reduce single-use plastic; Mateo coaches
    her through the rhetorical devices. No sibling-direction file (es-en)
    was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed (DRAFT). Priority checks: (1)
    naturalness and correct informal-tu register of every Elena/Mateo line,
