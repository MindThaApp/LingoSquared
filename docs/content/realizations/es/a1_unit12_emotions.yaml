  - content_key: es.a1.audio.dialogue.el_pastel_se_quema.01
    language: es
    text: >-
      Elena: ¿Cómo te sientes antes de la clase?
      Mateo: Me siento un poco nervioso, pero contento.
      Elena: Yo también. ¡Ay, no! ¡Algo se quema!
      Mateo: Estoy preocupado. ¿Qué hacemos?
      Elena: No te preocupes. Podemos empezar de nuevo.
      Mateo: Tienes razón. Vamos a intentarlo otra vez.
      Elena: ¡Mira! Ahora el pastel está perfecto.
      Mateo: ¡Qué bien! Estoy muy orgulloso de nosotros.
      Elena: Yo también estoy orgullosa. Lo logramos juntos.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
  - {content_key: es.a1.audio.dialogue.el_pastel_se_quema.estoy_muy_orgulloso.01, language: es, text: "¡Qué bien! Estoy muy orgulloso de nosotros.", voice_hint: neutral_young_adult, status: pending_generation}

