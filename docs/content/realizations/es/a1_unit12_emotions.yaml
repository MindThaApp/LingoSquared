schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    No FSI Spanish Basic Course unit directly covers expressing basic
    feelings/emotions as its own topic (all 4 volumes' tables of
    contents checked this session via direct PDF download +
    `pdftotext -layout`; a full-text search for "feeling"/"emotion"
    across all four volumes found only one incidental medical-context
    line, "¿Desde cuándo se siente así?" in Volume 4 Unit 51, unrelated
    to everyday emotion vocabulary). Per AUTHORING_GUIDE §10, when no
    directly-usable public-domain source exists for a topic,
    established-conventions-only authoring is the honest fallback --
    the same finding already made for unit08 (places) and unit11
    (clothing). This unit is authored from established beginner-
    Spanish teaching conventions (common feeling adjectives: nervioso/
    nerviosa, contento/contenta, cansado/cansada, preocupado/
    preocupada, orgulloso/orgullosa, all -o/-a agreement pairs) and
    the standard *estar* + adjective construction for temporary states
    (distinct from *ser* + adjective for permanent traits, already
    established across unit01-11's content). The specific scenario (a
    cooking mishap during the 22 July class, and the pride afterward)
    and all exercise content are original to this unit.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Twelfth Spanish A1 unit, continuing the Elena/Mateo cooking-
    workshop storyline directly into the 22 July class itself (the
    date established in unit04/unit07, and the day whose hot weather
    was described in unit10). Realizes universal.a1.emotions.
    express_basic_feelings (no prerequisites per the spine). Authored
    fresh at schema_version 1.1 per AUTHORING_GUIDE §19. tú register
    throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches 5
    feeling adjectives with masculine/feminine pairs (nervioso/
    nerviosa, contento/contenta, cansado/cansada, preocupado/
    preocupada, orgulloso/orgullosa); 02 teaches the *estar* +
    adjective construction and the core self-report phrase (Estoy
    nervioso/nerviosa); 03 teaches the core question-and-answer pattern
    (¿Cómo te sientes? / Me siento un poco nervioso, pero contento); 04
    is a phrase lesson for a cooking mishap mid-class (algo se quemó,
    estoy preocupado/preocupada) and reassurance (no te preocupes,
    podemos empezar de nuevo -- reusing unit09's negative-imperative
    *no te* pattern); 05 is a reading of a short reflection on how the
    class went; 06 is a dialogue capstone spanning the mishap and the
    proud resolution when the dish turns out well after all.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    nervioso/preocupado for true-synonym risk -- related but genuinely
    distinct feelings (anxious anticipation vs. active worry about a
    specific problem), and every slot testing one is anchored by an
    already-stated scenario fact (before class vs. after the burning
    incident), never an open choice between them. §16: lesson01's
    matching_pairs uses all 5 adjectives (both genders where taught)
    plus 3 example sentences (9 pairs). §12: multi-clause
    accepted_answers (lesson06's feeling+reason sentences) have
    period/comma/conjunction-joined variants. No bare yes/no/true/
    false -- checked by hand ("No" appears in "No te preocupes" and is
    always part of a longer quoted phrase, never a bare standalone
    token).

    Internal consistency (§11): set on 22 July (the established class
    date), continuing directly from unit11's apron purchase and
    unit10's hot-weather morning walk -- never contradicts either.
    Elena consistently uses feminine adjective forms (nerviosa,
    preocupada, orgullosa) and Mateo consistently uses masculine forms
    (nervioso, preocupado, orgulloso) throughout every exercise and the
    dialogue, with no gender-agreement slip.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

