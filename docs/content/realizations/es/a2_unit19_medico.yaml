generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    This unit's core vocabulary and one grammar pattern are scaffolded
    from the real, public-domain FSI Spanish Basic Course (Foreign
    Service Institute, 1961+ revisions, US government work), Volume 4
    (Units 46-55): the doctor-visit narrative around lines ~331-499
    ("Jose Molina, who is sick in bed, is visited by a doctor," "¿Qué
    tengo, doctor? ¿Un catarro?") establishes *el doctor*/*el médico* and
    symptom-description framing as an FSI-authentic scenario, and line
    ~2679 ("Eso es lo que mandó el médico, ¿no? Sí, mandó que durmiera
    por lo menos ocho [horas]") illustrates *mandar que* + subjunctive
    for a doctor's instruction, the same impersonal/command-verb-plus-
    subjunctive pattern already introduced in unit16's *es necesario
    que* -- downloaded directly (firecrawl confirmed at 0/1000 credits
    via `firecrawl --status`, so this used the documented WebSearch +
    direct-download + `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%204/FSI%20-%20Spanish%20Basic%20Course%20-%20Volume%204%20-%20Student%20Text.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. Only the
    scenario FRAME (a doctor visit) and the grammar point (recommendation-
    verb + subjunctive) are reused, not any drill sentence -- every
    actual sentence, the specific symptom, and the whole Elena storyline
    are freshly written; this unit uses *le recomiendo que* rather than
    the source's *mandar que*, a softer, more contemporary register
    choice for a doctor addressing a patient.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Fourth Spanish A2 unit (spine outcome:
    universal.a2.health.attend_doctor_appointment), a new scenario for
    Elena: she starts feeling unwell and attends a doctor's appointment
    in London, describing a symptom in more detail than any A1 health
    content would (no es A1 unit yet covers basic health for this
    course, so this is the first health-topic unit in the es track).
    A2-level complexity: describing symptom duration (*desde ayer*,
    since yesterday, reusing unit16's *desde* + time-duration pattern),
    and a recommendation-verb + subjunctive construction (*le recomiendo
    que descanse*) extending unit16's *es necesario que* impersonal-
    subjunctive pattern to a personal recommendation verb. Authored
    fresh at schema_version 1.1 per AUTHORING_GUIDE §19. tú register
    continues in the surrounding storyline; usted (formal) is used
    between Elena and the doctor throughout, matching unit16/18's
    institutional-exchange precedent.

    Six lessons, recognition->drag->production (§2): 01 teaches symptom
    vocabulary and a basic feeling-unwell phrase; 02 teaches describing
    a symptom's duration in detail; 03 is the doctor's formal question-
    and-answer pattern; 04 teaches the doctor's subjunctive-based
    recommendation; 05 is a reading of an appointment/after-visit
    summary; 06 is a dialogue capstone of Elena's actual appointment.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    dolor/fiebre/mareo for true-synonym risk -- three genuinely distinct
    symptoms (pain, fever, dizziness), not synonyms, and every slot
    testing one is anchored by which specific symptom Elena has, never
    an open choice. §16: lesson03's and lesson05's matching_pairs pool
    the unit's vocabulary so far (6-7 pairs each). §12: multi-clause
    accepted_answers (lesson06's summary lines) have period/comma/
    conjunction-joined variants. No bare yes/no/true/false -- checked by
    hand throughout, including every stray "no"/"sí" token, learned from
    unit17's real validator catch.

    Internal consistency (§11): Elena's symptom (headache, starting
    yesterday) is stated consistently across lesson02's teaching example,
    lesson05's reading, and lesson06's dialogue -- never contradicted or
    changed to a different symptom or duration anywhere. Elena's
    already-established facts (Spain-born, London-resident, teacher) are
    untouched; this unit only adds a temporary illness, resolved by the
    end of the unit (doctor's advice to rest and take medication, no
    ongoing condition implied).

    Listening-integrity check: lesson06's dialogue_comprehension
    exercises test facts via English answer options, not literal
    same-speaker quote picks, so the same-speaker-distractor collision
    bug class does not apply here.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

course:
  realization_key: es.a2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Continues Elena and Mateo's established tú register with each
    other (briefly, at the start of this unit). Elena and the doctor
    (doctora) use usted throughout, matching unit16/18's precedent for
    institutional exchanges.

