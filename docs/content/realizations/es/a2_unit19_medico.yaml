            kind: grammar_note
            target: {text: "*Me duele la cabeza* (my head hurts) uses *doler* (to hurt) like *gustar* -- the body part is the grammatical subject, and the person is an indirect object (*me*), not \"I hurt my head.\"", language_code: en, direction: ltr}
