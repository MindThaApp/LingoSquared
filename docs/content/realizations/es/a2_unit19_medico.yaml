            kind: vocabulary
            target: {text: "la fiebre", language_code: es, direction: ltr}
            introduced_tokens: [la, fiebre]
            example: {text: "Creo que tengo fiebre.", language_code: es, direction: ltr}
          - content_key: es.a2.unit19.lesson01.teach.sentirse_mal
            kind: vocabulary
            target: {text: "sentirse mal", language_code: es, direction: ltr}
            introduced_tokens: [sentirse, mal]
            example: {text: "Me siento mal hoy.", language_code: es, direction: ltr}
