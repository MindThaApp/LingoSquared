    language: es
    text: >-
      Paciente: Elena García. Síntoma: dolor de cabeza y fiebre leve
      desde ayer. Recomendación: descansar, tomar las pastillas
      recetadas y beber mucha agua. Próxima cita: solo si los
      síntomas continúan después de tres días.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.a2.audio.dialogue.medico_cita.01
    language: es
    text: >-
      Doctora: Buenos días, ¿qué le pasa? Elena: Buenos días, doctora.
      Me duele la cabeza desde ayer. Doctora: ¿Tiene fiebre también?
      Elena: Sí, tengo un poco de fiebre. Doctora: Entiendo. Le
      recomiendo que descanse y tome estas pastillas. Elena: ¿Necesito
      otra cita? Doctora: Solo si los síntomas continúan después de
      tres días. Es importante que beba mucha agua. Elena: Muchas
      gracias, doctora.
    voice_hint: two_adults_formal_polite
