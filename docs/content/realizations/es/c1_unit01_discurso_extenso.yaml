schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: C1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Spanish C1, the first C1 unit in the es
    lane. No adaptable public-domain source was found: the FSI Spanish
    Basic Course (the only verified public-domain Spanish source, per
    AUTHORING_GUIDE 10) caps at intermediate (Basic Course, Units 1-55),
    and no public-domain advanced/C1 Spanish discourse source exists.
    This is established-conventions-only authoring, built from general
    knowledge of Spanish discourse-structure conventions, using nl's
    shipped C1 unit01 (betoogstructuur) as the assigned structural
    exemplar for pacing and exercise depth only -- every word of actual
    Spanish text is freshly authored, not translated from the Dutch, and
    the scenario is unrelated. Elena and Mateo continue as the
    established es B1/B2 characters (informal tu register, set in b1_unit44
    and earlier); Elena delivers the sustained monologue. No
    sibling-direction file (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness of every signposting frame (para empezar, a grandes
    rasgos, en primer lugar, en concreto, hago un pequeño paréntesis,
    volviendo a mi idea principal, en definitiva) and that the informal tu
    register is consistent and correctly conjugated throughout; (2) the
    extended contribution in lesson06 is graded against a fixed
    multi-sentence string -- confirm the accepted-answer punctuation
    variants are complete enough that a correct learner is never marked
    wrong; (3) confirm "dicha zona", "a grandes rasgos", and "crear
    comunidad" read as current pan-Hispanic Spanish; (4) verify "un parque
    bien diseñado no cuesta tanto de mantener" (lesson04) reads naturally
    rather than as an anglicism.
  notes: >-
    First Spanish C1 unit. Targets the CEFR C1 extended-discourse outcome
    (universal.c1.discourse.structure_extended_discourse): signpost the
    direction of a long contribution, develop linked points with a
    controlled digression and explicit return, and sustain cohesion so the
    listener or reader can follow the overall shape. Theme: más zonas
    verdes en la ciudad (creating more green areas in the city) -- one
    coherent proposal sustained across all six lessons. Lesson arc mirrors
    the discourse structure itself: L01 previewing the route (para empezar,
    primero ... después, a grandes rasgos), L02 developing linked points
    (en primer lugar, en concreto, además), L03 making a bounded digression
    (hago un pequeño paréntesis, a propósito, una preocupación
    comprensible), L04 returning explicitly (volviendo a mi idea principal,
    eso no significa que), L05 sustaining reference and synthesizing (dicha
    zona, esta propuesta, en definitiva), L06 the culminating production --
    a full Elena monologue for the listening requirement plus a speaking
    task and a writing task that each require the complete structured
    contribution, not just signpost drilling. Register: informal tu
    throughout (es lane precedent), with C1 discourse polish layered on top
    -- Elena speaks in her established informal voice while the discourse
    itself is essayistic. All vocabulary is introduced self-contained
    within this file (C1 is a separate Course row from B2, so a C1 learner
    never sees B1/B2 lexemes at runtime).

    Second-pass review 2026-10-19: 8 fixes (realization side) -- lesson04
    teach.parque_bien_disenado/teach.retorno/exercise03/05/06 and lesson06
    monologue (audio intervencion.01, teach.intervencion_completa,
    exercise02/05/06): 'un parque bien diseñado no cuesta tanto de mantener'
    (nonstandard costar + de + infinitive) -> 'el mantenimiento de un parque
    bien diseñado no cuesta tanto'; match pair 'de mantener / to maintain' ->
    'el mantenimiento de / the upkeep of'; English prompts -> 'The upkeep of a
    well-designed park does not cost that much.'; lesson05
    teach.esta_propuesta/teach.sintesis/exercise07.write_cohesion: 'Esta
    propuesta crea zonas verdes. Dicha zona...' (singular dicha zona with a
    plural antecedent) -> 'Esta propuesta crea una zona verde.' (zona/verde
    now introduced there, zonas/verdes in teach.sintesis), write_cohesion
    prompt now names the content; lesson05.exercise01.recognize_dicha_zona:
    the two sentences added as a target_block (question was about text not
    shown); lesson05.exercise02.recognize_en_definitiva: sentence added as a
    target_block (none shown); lesson06.exercise02.lee_estructura: Elena's
    monologue added as a target_block; lesson01.exercise03.match_rumbo:
    confusable rights 'opens the first stage' / 'marks the initial step' ->
    'to begin with' / 'first'; lesson03.exercise07.write_a_proposito:
    underdetermined 'Write the taught Spanish aside' -> names the full
    content; lesson02.teach.es_decir example comma 'es decir, la salud'.

course:
  realization_key: es.c1
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent from b1_unit27/29/33 and
    b2_unit01). C1 raises the discourse register -- essayistic, sustained,
    cohesive -- while keeping the informal tu address. Elena and Mateo
    continue the informal tu they use with each other throughout the es
    B1/B2 units; Mateo addresses Elena with tu (¿Por qué propones...?), and
    Elena's monologue keeps her everyday spoken voice even as the structure
    becomes polished. No usted or vosotros.

media_assets:
  - content_key: es.c1.audio.discurso_extenso.rumbo.01
    language: es
    text: "Para empezar planteo el problema después explico los beneficios"
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.c1.audio.discurso_extenso.intervencion.01
    language: es
    text: >-
      Para empezar, planteo el problema: la ciudad tiene pocas zonas
      verdes. En primer lugar, los parques mejoran la salud, en concreto
      fomentan el ejercicio. Además, crean comunidad, porque los vecinos
      se conocen. Hago un pequeño paréntesis: algunos temen que el
      mantenimiento sea caro, una preocupación comprensible. Pero
      volviendo a mi idea principal, el mantenimiento de un parque bien diseñado no cuesta
      tanto. En definitiva, más zonas verdes significan una
      ciudad más sana y más unida.
    voice_hint: neutral_young_adult_thoughtful
    status: pending_generation

