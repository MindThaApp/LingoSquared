    language: es
    text: >-
      Mateo: Elena, ¿cómo llego a la biblioteca desde el mercado?
      Elena: Es fácil. Sigue derecho por esta calle.
      Mateo: Sigo derecho. ¿Y después?
      Elena: Dobla a la izquierda en la esquina.
      Mateo: Doblo a la izquierda en la esquina. ¿Está bien así?
      Elena: Sí, así es. Después cruza la calle, y la biblioteca está a la derecha.
      Mateo: Perfecto, muchas gracias.
      Elena: De nada. ¡No te pierdas!
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
