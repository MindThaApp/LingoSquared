    asking for or giving basic directions as its own topic. Per
    AUTHORING_GUIDE §10, established-conventions-only authoring is the
    honest fallback. This unit uses standard beginner-Spanish direction
    vocabulary (seguir derecho, doblar/girar a la izquierda/derecha,
    la calle, la esquina, cruzar) and follows on directly from unit08's
    place-location content (its own listed prerequisite in universal_
    spine.yaml).
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Ninth Spanish A1 unit, closing out this authoring batch (units
    04-09). Elena and Mateo's storyline continues directly from unit08:
    Mateo now asks Elena for step-by-step directions to the library
    (established in unit08 as being between the bank and the park).
    Realizes universal.a1.directions.ask_follow_basic_directions
    (prerequisite: universal.a1.places.locate_common_places, unit08).
    Authored fresh at schema_version 1.1 per AUTHORING_GUIDE §19. tú
    register throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches core
    direction nouns (la calle, la esquina); 02 teaches movement verbs
    (seguir derecho, doblar/girar a la izquierda, doblar/girar a la
    derecha, cruzar); 03 teaches the core question (¿Cómo llego a...?)
    and a two-step direction answer; 04 teaches confirming/checking
    understanding (¿Está bien así? / Sí, así es); 05 is a reading of a
    short written direction set; 06 is a dialogue capstone where Elena
    gives Mateo real step-by-step directions to the library from the
    market.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    izquierda/derecha (left/right) for true-synonym risk -- they are
    opposites, not synonyms, and every slot testing one is anchored by
    an already-stated route fact (e.g. which specific turn the
    established route to the library actually uses), never an open
    choice between them. §16: lesson02's matching_pairs uses all 4
    movement phrases plus 4 example sentences (8 pairs). §12: the
    multi-clause accepted_answers (lesson06's closing direction set)
    has period/comma/conjunction-joined variants. No bare yes/no/true/
    false -- checked by hand ("Sí" appears standalone in a few
    exercises' accepted_answers/distractors and is always double-
    quoted; bare "no" never appears standalone).

    Internal consistency (§11): the route to the library (from the
    market: seguir derecho, doblar a la izquierda en la esquina, cruzar
    la calle) is established once in lesson05's reading and repeated
    identically in lesson06's dialogue -- no contradicting turn
    direction anywhere. The destination (biblioteca) and its
    established location (entre el banco y el parque, from unit08) are
    never contradicted.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every exercise's visible prompt, accepted answers, route
    consistency and notes. Fixes: es.a1.unit09.lesson05.exercise01-04
    (read_primer_paso, read_segundo_paso, read_tercer_paso,
    read_destino) -- no visible passage; the Spanish written directions
    are now the first prompt.target_block (es) before the question.
    lesson05.exercise05.match_pasos -- step-number matching was only
    answerable from the unshown text; the passage is now its prompt
    block. lesson06.exercise06.respond_as_elena -- open prompt ('Dile a
    Mateo cómo llegar a la biblioteca') graded against the first step
    only; pinned to 'Toma el papel de Elena. Dile a Mateo que es fácil y
    dale el primer paso: seguir derecho por esta calle.' (overlay
    instruction mirrored). NATIVE FLAGS: 'direcciones' used for route
    directions (lesson titles, prompts) where 'indicaciones' is the
    standard word; 'sigue derecho' is Latin American while Elena is
    established as Spanish ('sigue recto / todo recto') -- consider
    teaching/accepting recto. DEFERRED: Elena/Mateo location canon
    (unit01/unit03) -- owner decision; reading_comprehension passage
    validator (Codex lane).

    Language review 2026-10-24 (session 10): 1 fix -- lesson06.exercise08.speak_confirm_and_thank prompt:
    'Agradécele a Elena por las direcciones' -> 'Agradécele a Elena las direcciones' (agradecer algo a
    alguien; por is a doubtful construction here). Native flags: none.

