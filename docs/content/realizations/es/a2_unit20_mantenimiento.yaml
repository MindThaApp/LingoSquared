units:
  - content_key: es.a2.unit20.mantenimiento
    title: "Mateo reporta una gotera"
    section: reading_writing
    spine_outcome_ids: [universal.a2.housing.report_maintenance_problem]
    planned_lesson_count: 6
    lessons:
      - content_key: es.a2.unit20.lesson01.no_funciona
        title: "El calentador no funciona"
        spine_outcome_id: universal.a2.housing.report_maintenance_problem
        teaching:
          - content_key: es.a2.unit20.lesson01.teach.el_calentador
            kind: vocabulary
            target: {text: "el calentador", language_code: es, direction: ltr}
            introduced_tokens: [el, calentador]
            example: {text: "El calentador está roto otra vez.", language_code: es, direction: ltr}
          - content_key: es.a2.unit20.lesson01.teach.la_gotera
            kind: vocabulary
            target: {text: "la gotera", language_code: es, direction: ltr}
            introduced_tokens: [la, gotera]
            example: {text: "Hay una gotera en la cocina.", language_code: es, direction: ltr}
          - content_key: es.a2.unit20.lesson01.teach.el_plomero
            kind: vocabulary
            target: {text: "el plomero", language_code: es, direction: ltr}
            introduced_tokens: [el, plomero]
            example: {text: "Necesito llamar a un plomero.", language_code: es, direction: ltr}
          - {content_key: es.a2.unit20.lesson01.teach.no_funciona_calentador, kind: phrase, target: {text: "El calentador no funciona.", language_code: es, direction: ltr}, introduced_tokens: [El, calentador, "no", funciona]}
          - content_key: es.a2.unit20.lesson01.teach.no_funciona_note
            kind: grammar_note
            target: {text: "*[Algo] no funciona* (something isn't working) is the standard way to report a broken appliance -- reused for any device, not just this specific *calentador*.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit20.lesson01.exercise01.choose_no_funciona_calentador, type: multiple_choice, tested_text: "El calentador no funciona", prompt: {target_blocks: [{text: "The water heater isn't working.", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson01.exercise02.listen_no_funciona_calentador, type: listen_select, tested_text: "El calentador no funciona", media_asset_key: es.a2.audio.mantenimiento.no_funciona_calentador.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit20.lesson01.exercise03.match_mantenimiento_vocab
            type: matching_pairs
            tested_text: "calentador gotera plomero no funciona"
            prompt: {target_blocks: []}
            pairs: [{left: "el calentador", right: "the water heater"}, {left: "la gotera", right: "the leak"}, {left: "el plomero", right: "the plumber"}, {left: "no funciona", right: "isn't working"}, {left: "El calentador no funciona.", right: "The water heater isn't working."}]
          - {content_key: es.a2.unit20.lesson01.exercise04.order_no_funciona_calentador, type: word_order, tested_text: "El calentador no funciona", prompt: {target_blocks: []}, word_bank: [El, calentador, "no", funciona]}
          - {content_key: es.a2.unit20.lesson01.exercise05.fill_no_funciona_calentador, type: fill_in_blank, tested_text: "El calentador no funciona", prompt: {target_blocks: [{text: "El calentador no ___. (works)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson01.exercise06.write_report_broken, type: writing_prompt, tested_text: "El calentador no funciona", prompt: {target_blocks: [{text: "Write in Spanish: say the water heater isn't working.", language_code: en, direction: ltr}]}}

      - content_key: es.a2.unit20.lesson02.hay_una_gotera
        title: "Hay una gotera en el baño"
        spine_outcome_id: universal.a2.housing.report_maintenance_problem
        teaching:
          - {content_key: es.a2.unit20.lesson02.teach.hay_gotera_bano, kind: phrase, target: {text: "Hay una gotera en el baño.", language_code: es, direction: ltr}, introduced_tokens: [Hay, una, gotera, en, el, baño]}
          - {content_key: es.a2.unit20.lesson02.teach.esta_empeorando, kind: phrase, target: {text: "Desde esta mañana, y está empeorando.", language_code: es, direction: ltr}, introduced_tokens: [Desde, esta, mañana, y, está, empeorando]}
        exercises:
          - {content_key: es.a2.unit20.lesson02.exercise01.choose_hay_gotera_bano, type: multiple_choice, tested_text: "Hay una gotera en el baño", prompt: {target_blocks: [{text: "There's a leak in the bathroom.", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson02.exercise02.listen_hay_gotera_bano, type: listen_select, tested_text: "Hay una gotera en el baño", media_asset_key: es.a2.audio.mantenimiento.hay_gotera_bano.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit20.lesson02.exercise03.match_gotera_details
            type: matching_pairs
            tested_text: "gotera baño empeorando calentador plomero funciona"
            prompt: {target_blocks: []}
            pairs: [{left: "hay una gotera", right: "there's a leak"}, {left: "en el baño", right: "in the bathroom"}, {left: "está empeorando", right: "it's getting worse"}, {left: "el calentador", right: "the water heater"}, {left: "el plomero", right: "the plumber"}, {left: "no funciona", right: "isn't working"}]
          - {content_key: es.a2.unit20.lesson02.exercise04.order_hay_gotera_bano, type: word_order, tested_text: "Hay una gotera en el baño", prompt: {target_blocks: []}, word_bank: [Hay, una, gotera, en, el, baño]}
          - {content_key: es.a2.unit20.lesson02.exercise05.fill_esta_empeorando, type: fill_in_blank, tested_text: "Desde esta mañana y está empeorando", prompt: {target_blocks: [{text: "Desde esta mañana, y está ___. (getting worse)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson02.exercise06.translate_report_leak, type: translation, tested_text: "Hay una gotera en el baño", prompt: {target_blocks: [{text: "There's a leak in the bathroom.", language_code: en, direction: ltr}]}}

      - content_key: es.a2.unit20.lesson03.desde_cuando_gotera
        title: "¿Desde cuándo tiene la gotera?"
        spine_outcome_id: universal.a2.housing.report_maintenance_problem
        teaching:
          - {content_key: es.a2.unit20.lesson03.teach.desde_cuando_gotera, kind: phrase, target: {text: "¿Desde cuándo tiene la gotera?", language_code: es, direction: ltr}, introduced_tokens: [Desde, cuándo, tiene, la, gotera]}
          - {content_key: es.a2.unit20.lesson03.teach.es_necesario_revisemos, kind: phrase, target: {text: "Es necesario que la revisemos pronto.", language_code: es, direction: ltr}, introduced_tokens: [Es, necesario, que, la, revisemos, pronto]}
          - content_key: es.a2.unit20.lesson03.teach.revisemos_note
            kind: grammar_note
            target: {text: "*Es necesario que la revisemos* reuses the impersonal *es necesario que* + subjunctive pattern from an earlier unit, now with a first-person-plural (we) subjunctive (*revisemos*, we check) instead of the usted forms used there (*traiga*, *llegue*).", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit20.lesson03.exercise01.choose_desde_cuando_gotera, type: multiple_choice, tested_text: "Desde cuándo tiene la gotera", prompt: {target_blocks: [{text: "Since when have you had the leak?", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson03.exercise02.listen_desde_cuando_gotera, type: listen_select, tested_text: "Desde cuándo tiene la gotera", media_asset_key: es.a2.audio.mantenimiento.desde_cuando_gotera.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit20.lesson03.exercise03.match_landlord_questions
            type: matching_pairs
            tested_text: "desde cuándo gotera necesario revisemos pronto baño empeorando"
            prompt: {target_blocks: []}
            pairs: [{left: "¿Desde cuándo tiene la gotera?", right: "Since when have you had the leak?"}, {left: "Es necesario que la revisemos.", right: "It's necessary that we check it."}, {left: pronto, right: soon}, {left: "en el baño", right: "in the bathroom"}, {left: "está empeorando", right: "it's getting worse"}, {left: "el plomero", right: "the plumber"}]
          - {content_key: es.a2.unit20.lesson03.exercise04.order_es_necesario_revisemos, type: word_order, tested_text: "Es necesario que la revisemos pronto", prompt: {target_blocks: []}, word_bank: [Es, necesario, que, la, revisemos, pronto]}
          - {content_key: es.a2.unit20.lesson03.exercise05.fill_desde_cuando_gotera, type: fill_in_blank, tested_text: "Desde cuándo tiene la gotera", prompt: {target_blocks: [{text: "¿Desde cuándo ___ la gotera? (you have)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson03.exercise06.respond_desde_cuando_gotera, type: dialogue_response, tested_text: "Desde esta mañana y está empeorando", prompt: {target_blocks: [{text: "¿Desde cuándo tiene la gotera?", language_code: es, direction: ltr}]}}

      - content_key: es.a2.unit20.lesson04.podria_venir_jueves
        title: "¿Podría venir el jueves?"
        spine_outcome_id: universal.a2.housing.report_maintenance_problem
        teaching:
          - {content_key: es.a2.unit20.lesson04.teach.podria_venir_jueves, kind: phrase, target: {text: "¿Podría venir el jueves a las tres?", language_code: es, direction: ltr}, introduced_tokens: [Podría, venir, el, jueves, a, las, tres]}
          - {content_key: es.a2.unit20.lesson04.teach.si_ahi_estare, kind: phrase, target: {text: "Sí, ahí estaré el jueves a las tres.", language_code: es, direction: ltr}, introduced_tokens: ["Sí", ahí, estaré, el, jueves, a, las, tres]}
        exercises:
          - {content_key: es.a2.unit20.lesson04.exercise01.choose_podria_venir_jueves, type: multiple_choice, tested_text: "Podría venir el jueves a las tres", prompt: {target_blocks: [{text: "Could you come on Thursday at three?", language_code: en, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson04.exercise02.listen_podria_venir_jueves, type: listen_select, tested_text: "Podría venir el jueves a las tres", media_asset_key: es.a2.audio.mantenimiento.podria_venir_jueves.01, prompt: {target_blocks: []}}
          - content_key: es.a2.unit20.lesson04.exercise03.match_repair_time
            type: matching_pairs
            tested_text: "podría venir jueves ahí estaré desde cuándo gotera revisemos"
            prompt: {target_blocks: []}
            pairs: [{left: "¿Podría venir el jueves?", right: "Could you come on Thursday?"}, {left: "ahí estaré", right: "I'll be there"}, {left: "a las tres", right: "at three o'clock"}, {left: "¿Desde cuándo?", right: "Since when?"}, {left: "es necesario que la revisemos", right: "it's necessary that we check it"}, {left: "la gotera", right: "the leak"}]
          - {content_key: es.a2.unit20.lesson04.exercise04.order_si_ahi_estare, type: word_order, tested_text: "Sí ahí estaré el jueves a las tres", prompt: {target_blocks: []}, word_bank: ["Sí", ahí, estaré, el, jueves, a, las, tres]}
          - {content_key: es.a2.unit20.lesson04.exercise05.fill_podria_venir_jueves, type: fill_in_blank, tested_text: "Podría venir el jueves a las tres", prompt: {target_blocks: [{text: "¿___ venir el jueves a las tres? (could you)", language_code: es, direction: ltr}]}}
          - {content_key: es.a2.unit20.lesson04.exercise06.respond_podria_venir_jueves, type: dialogue_response, tested_text: "Sí ahí estaré el jueves a las tres", prompt: {target_blocks: [{text: "¿Podría venir el jueves a las tres?", language_code: es, direction: ltr}]}}

      - content_key: es.a2.unit20.lesson05.leer_la_confirmacion
        title: "Leer la confirmación de reparación"
        spine_outcome_id: universal.a2.housing.report_maintenance_problem
        teaching:
          - content_key: es.a2.unit20.lesson05.teach.confirmacion_reading
            kind: reading
            target:
              text: >-
                Problema reportado: gotera en el baño, desde esta
                mañana. Técnico asignado: se confirma la visita para
                el jueves a las tres de la tarde. Por favor, esté
                disponible a esa hora.
              language_code: es
              direction: ltr
            introduced_tokens: [Problema, reportado, gotera, en, el, baño, desde, esta, mañana, Técnico, asignado, se, confirma, la, visita, para, jueves, a, las, tres, de, tarde, Por, favor, esté, disponible, esa, hora]
          - content_key: es.a2.unit20.lesson05.teach.este_disponible_note
            kind: grammar_note
            target: {text: "*Esté disponible* (be available) is a formal usted-command, and it uses the present subjunctive, the same mood as *revisemos*/*llegue* from earlier units (-ar verbs take *-e*; -er verbs like *beba* take *-a*).", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.a2.unit20.lesson05.exercise01.read_problem_reported, type: reading_comprehension, tested_text: "gotera en el baño desde esta mañana", prompt: {target_blocks: [{text: "Problema reportado: gotera en el baño, desde esta mañana. Técnico asignado: se confirma la visita para el jueves a las tres de la tarde. Por favor, esté disponible a esa hora.", language_code: es, direction: ltr}, {text: "What problem was reported, and since when?", language_code: en, direction: ltr}]}}
