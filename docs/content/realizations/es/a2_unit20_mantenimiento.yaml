schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: A2
status: complete_draft
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    This unit's core vocabulary is scaffolded from the real, public-
    domain FSI Spanish Basic Course (Foreign Service Institute, 1961+
    revisions, US government work), Volume 4 (Units 46-55): a real
    mechanical-problem narrative around line ~3170 ("...que los frenos
    no funcionan bien. El mecánico prende (arranca) el motor, lo revisa
    cuidadosamente...") establishes the "[thing] no funciona" (isn't
    working) construction this unit reuses for a household appliance
    instead of a car, and *el plomero* (the plumber, glossary line
    ~16218) and *reparar* (to repair, glossary line ~16443) are both
    real FSI-glossed vocabulary items -- downloaded directly (firecrawl
    confirmed at 0/1000 credits via `firecrawl --status`, so this used
    the documented WebSearch + direct-download + `pdftotext -layout`
    fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%204/FSI%20-%20Spanish%20Basic%20Course%20-%20Volume%204%20-%20Student%20Text.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. Only the
    "[thing] no funciona" construction and the plumber/repair
    vocabulary are reused, not any scenario or drill sentence -- the FSI
    passage this comes from is about a car mechanic, unrelated to
    housing. The apartment-maintenance scenario, the specific problem
    (a leak), and every sentence are freshly written for Mateo's own
    storyline.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Fifth Spanish A2 unit (spine outcome:
    universal.a2.housing.report_maintenance_problem), continuing
    directly from unit14's apartment move and unit16's registration at
    that same address: a real household problem comes up (a leak in the
    bathroom), and Mateo reports it to the landlord and arranges a
    repair time. A2-level complexity: the "[thing] no funciona"/"hay una
    gotera" problem-description constructions, and the conditional-
    politeness pattern from unit16/18 (*podría*) reused for arranging a
    repair time rather than a document request. Authored fresh at
    schema_version 1.1 per AUTHORING_GUIDE §19. tú register continues
    between Elena and Mateo; usted (formal) is used with the landlord
    throughout, matching unit16/18/19's institutional-exchange
    precedent.

    Six lessons, recognition->drag->production (§2): 01 teaches
    maintenance-problem vocabulary and the "no funciona" construction;
    02 teaches describing the specific leak in detail; 03 is the
    landlord's formal question-and-answer pattern about the problem; 04
    teaches arranging a repair time with polite-conditional *podría*; 05
    is a reading of a repair confirmation notice; 06 is a dialogue
    capstone of Mateo's actual call to the landlord.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    gotera/calentador for true-synonym risk -- two genuinely distinct
    problems (a leak vs. a broken water heater), not synonyms, and every
    slot testing one is anchored by which specific problem is being
    reported, never an open choice. §16: lesson03's and lesson05's
    matching_pairs pool the unit's vocabulary so far (6-7 pairs each).
    §12: multi-clause accepted_answers (lesson06's summary lines) have
    period/comma/conjunction-joined variants. No bare yes/no/true/false
    -- checked by hand throughout, including every stray "no" token
    (this unit's own "no funciona" is a genuine risk case, verified
    quoted everywhere it appears as a standalone introduced_tokens
    entry).

    Internal consistency (§11): the leak is consistently located "en el
    baño" (in the bathroom) across lesson02's teaching example, lesson05's
    reading, and lesson06's dialogue -- never relocated to a different
    room anywhere. The repair time (Thursday at 3pm) is stated
    consistently in lesson04's teaching, the lesson05 reading, and
    lesson06's dialogue. Mateo's already-established facts (Colombia-
    born, London-resident, accountant, new address from unit14/16, bank
    account from unit18) are untouched; this is a new but consistent
    maintenance issue at that same established address, not a
    contradiction of anything already stated (e.g. not implying the
    apartment was described as flawless in unit14 -- unit14 never made
    that claim).

    Listening-integrity check: lesson06's dialogue_comprehension
    exercises test facts via English answer options, not literal
    same-speaker quote picks, so the same-speaker-distractor collision
    bug class does not apply here.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked teaching/exercise alignment, accepted-answer coverage,
    matching_pairs, reading/dialogue consistency with the audio,
    learner-visible notes, and grammar claims against the en-es overlay.
    Fixes: es.a2.unit20.lesson05.exercise01/02/03
    (reading_comprehension) -- the confirmation passage was never shown
    in the exercise; added it as the first prompt.target_block (es)
    before the question.
    es.a2.unit20.lesson05.teach.este_disponible_note -- false claim that
    beba shares the -e ending corrected: now says -ar verbs take -e, -er
    verbs like beba take -a.
    es.a2.unit20.lesson06.exercise08.write_visit_summary -- prompt now
    names "the landlord (la casera)" so the accepted la casera answer is
    determined (overlay instruction matched). Overlay fixes listed in
    the en-es overlay's own review note. DEFERRED: the "¿Podría venir el
    jueves a las tres?" role logic (the landlord asks Mateo to 'come' to
    his own flat) is structural -- it touches the lesson04
    title/teaching and its exercises, lesson06 line05 and its overlay
    gloss, and the podria_venir_jueves / dialogue audio assets and voice
    hints; owner decision needed (reframe as "¿Podría estar en casa...?"
    or have Mateo ask and the landlord answer). NATIVE FLAG: line08
    "Muchas gracias por su ayuda rápida." reads stiffly ("por su rápida
    ayuda" / "por ayudarme tan rápido"); not changed because the
    dialogue audio and listen_type exercise use it. NATIVE FLAG: dialect
    mix (plomero = Latin American, casera = Spain-leaning) in an
    es_neutral course, noted only.

    Second-pass review 2026-10-19: 3 fixes -- lesson06.teach.line05/
    line06 + dialogue audio text: resolved the deferred role-logic
    defect (the landlord asked Mateo "¿Podría venir...?" to his own flat
    while sending a technician); the landlord now only says "Entiendo,
    es necesario que la revisemos pronto.", Mateo asks "¿Podría venir el
    técnico el jueves a las tres?", and line07 "Perfecto, enviaré al
    técnico ese día." answers him (no exercise tested the old line06
    "Sí, ahí estaré..." turn; comprehension answers unchanged);
    lesson03.teach.revisemos_note: called the earlier usted forms
    (traiga/llegue) "second-person" -> now names them as usted forms;
    lesson05.teach.este_disponible_note: "the same form as
    revisemos/llegue" (they are different persons) -> "the same mood".

course:
  realization_key: es.a2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Continues Elena and Mateo's established tú register with each
    other. Mateo and the landlord (el casero/la casera) use usted
    throughout, matching unit16/18/19's precedent for institutional
    exchanges.

