  authoring_system: claude
  source_material: >-
    Authored fresh for Peninsular Spanish. No other language unit was
    consulted.
review:
  status: reviewed
  required_next_reviewer: codex
  notes: >-
    Realizes universal.b1.purpose.express_purpose_and_goals literally:
    learners state purpose using "para" + infinitive across the outcome's
    own named topics -- study, work, and saving money. Character canon
    checked on disk and preserved (grep of a1_unit13_work.yaml,
    a2_unit16/18/21-25, b1_unit27/29/33): Mateo is a Colombian accountant
    living in London; Elena is a Spanish teacher living in London; tú
    register between them as established peers. No new facts introduced.
    The culminating exercise (lesson04) requires two complete purpose-clause
    sentences on two different topics (work and money), matching the
    outcome's can_do ("across everyday and abstract topics such as study,
    work, and saving money") rather than drilling a single isolated
    sentence.
course:
  realization_key: es.b1
  target_language_first: true
  dialect: es_peninsular
  register_policy: >-
    Peninsular Spanish. Elena and Mateo use tú as established peers;
    purpose-clause sentences use natural first-person wording.
media_assets:
  - {content_key: es.b1.audio.propositos.estudio_espanol.01, language: es, text: "Estudio español para trabajar en España.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.propositos.ahorro_dinero.01, language: es, text: "Ahorro dinero para comprar una casa.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.propositos.mateo_trabaja.01, language: es, text: "Mateo trabaja muchas horas para ahorrar dinero.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.propositos.dos_propositos.01, language: es, text: "Estudio español para trabajar en España. Ahorro dinero para comprar una casa.", voice_hint: neutral_young_adult, status: pending_generation}
units:
  - content_key: es.b1.unit35.propositos
    title: "Propósitos y metas"
    section: speaking
    spine_outcome_ids: [universal.b1.purpose.express_purpose_and_goals]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit35.lesson01.para_trabajar
        title: "Para trabajar..."
        spine_outcome_id: universal.b1.purpose.express_purpose_and_goals
        teaching:
          - content_key: es.b1.unit35.lesson01.teach.estudio
            kind: vocabulary
            target: {text: "estudio", language_code: es, direction: ltr}
            introduced_tokens: [estudio]
            example: {text: "Estudio español.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson01.teach.para
            kind: vocabulary
            target: {text: "para", language_code: es, direction: ltr}
            introduced_tokens: [para]
            example: {text: "Estudio para trabajar en España.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson01.teach.trabajar_en
            kind: vocabulary
            target: {text: "trabajar en España", language_code: es, direction: ltr}
            introduced_tokens: [trabajar, en, España]
            example: {text: "Quiero trabajar en España.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson01.teach.purpose_study
            kind: phrase
            target: {text: "Estudio español para trabajar en España.", language_code: es, direction: ltr}
            introduced_tokens: [Estudio, español, espanol, para, trabajar, en, España]
          - content_key: es.b1.unit35.lesson01.teach.para_note
            kind: grammar_note
            target: {text: "*Para* + infinitive gives the purpose or goal of the first action.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit35.lesson01.exercise01.choose_estudio, type: multiple_choice, tested_text: "Estudio español para trabajar en España", prompt: {target_blocks: [{text: "Which sentence means \"I study Spanish in order to work in Spain\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit35.lesson01.exercise02.listen_estudio, type: listen_select, tested_text: "Estudio español para trabajar en España", media_asset_key: es.b1.audio.propositos.estudio_espanol.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit35.lesson01.exercise03.match_estudio
            type: matching_pairs
            tested_text: "estudio espanol para trabajar España"
            prompt: {target_blocks: []}
            pairs: [{left: "estudio", right: "I study"}, {left: "para", right: "in order to"}, {left: "trabajar en España", right: "to work in Spain"}, {left: "Estudio español", right: "I study Spanish"}, {left: "Estudio español para trabajar en España", right: "I study Spanish in order to work in Spain"}]
          - {content_key: es.b1.unit35.lesson01.exercise04.order_estudio, type: word_order, tested_text: "Estudio español para trabajar en España", prompt: {target_blocks: []}, word_bank: [Estudio, español, para, trabajar, en, España]}
          - {content_key: es.b1.unit35.lesson01.exercise05.translate_estudio, type: translation, tested_text: "Estudio español para trabajar en España", prompt: {target_blocks: [{text: "Translate to Spanish using \"para\": I study Spanish in order to work in Spain.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit35.lesson01.exercise06.dictation_estudio_espanol, type: dictation, tested_text: "Estudio español para trabajar en España", media_asset_key: es.b1.audio.propositos.estudio_espanol.01, prompt: {target_blocks: []}}

      - content_key: es.b1.unit35.lesson02.para_comprar
        title: "Para comprar..."
        spine_outcome_id: universal.b1.purpose.express_purpose_and_goals
        teaching:
          - content_key: es.b1.unit35.lesson02.teach.ahorro
            kind: vocabulary
            target: {text: "ahorro", language_code: es, direction: ltr}
            introduced_tokens: [ahorro]
            example: {text: "Ahorro dinero.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson02.teach.dinero
            kind: vocabulary
            target: {text: "dinero", language_code: es, direction: ltr}
            introduced_tokens: [dinero]
            example: {text: "Necesito dinero.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson02.teach.comprar_una_casa
            kind: vocabulary
            target: {text: "comprar una casa", language_code: es, direction: ltr}
            introduced_tokens: [comprar, una, casa]
            example: {text: "Quiero comprar una casa.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson02.teach.purpose_money
            kind: phrase
            target: {text: "Ahorro dinero para comprar una casa.", language_code: es, direction: ltr}
            introduced_tokens: [Ahorro, dinero, para, comprar, una, casa]
        exercises:
          - {content_key: es.b1.unit35.lesson02.exercise01.choose_ahorro, type: multiple_choice, tested_text: "Ahorro dinero para comprar una casa", prompt: {target_blocks: [{text: "Which sentence means \"I save money in order to buy a house\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit35.lesson02.exercise02.listen_ahorro, type: listen_select, tested_text: "Ahorro dinero para comprar una casa", media_asset_key: es.b1.audio.propositos.ahorro_dinero.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit35.lesson02.exercise03.match_ahorro
            type: matching_pairs
            tested_text: "ahorro dinero comprar casa"
            prompt: {target_blocks: []}
            pairs: [{left: "ahorro", right: "I save"}, {left: "dinero", right: "money"}, {left: "comprar una casa", right: "to buy a house"}, {left: "Ahorro dinero", right: "I save money"}, {left: "Ahorro dinero para comprar una casa", right: "I save money in order to buy a house"}]
          - {content_key: es.b1.unit35.lesson02.exercise04.order_ahorro, type: word_order, tested_text: "Ahorro dinero para comprar una casa", prompt: {target_blocks: []}, word_bank: [Ahorro, dinero, para, comprar, una, casa]}
          - {content_key: es.b1.unit35.lesson02.exercise05.fill_para, type: fill_in_blank, tested_text: "Ahorro dinero para comprar una casa", prompt: {target_blocks: [{text: "Ahorro dinero ___ comprar una casa. (in order to)", language_code: es, direction: ltr}]}}

      - content_key: es.b1.unit35.lesson03.mateo_trabaja_para
        title: "Mateo trabaja para..."
        spine_outcome_id: universal.b1.purpose.express_purpose_and_goals
        teaching:
          - content_key: es.b1.unit35.lesson03.teach.trabaja
            kind: vocabulary
            target: {text: "trabaja", language_code: es, direction: ltr}
            introduced_tokens: [trabaja]
            example: {text: "Mateo trabaja en Londres.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson03.teach.muchas_horas
            kind: vocabulary
            target: {text: "muchas horas", language_code: es, direction: ltr}
            introduced_tokens: [muchas, horas]
            example: {text: "Trabaja muchas horas.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson03.teach.ahorrar
            kind: vocabulary
            target: {text: "ahorrar", language_code: es, direction: ltr}
            introduced_tokens: [ahorrar]
            example: {text: "Quiere ahorrar dinero.", language_code: es, direction: ltr}
          - content_key: es.b1.unit35.lesson03.teach.purpose_work
            kind: phrase
            target: {text: "Mateo trabaja muchas horas para ahorrar dinero.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, trabaja, muchas, horas, para, ahorrar, dinero]
          - content_key: es.b1.unit35.lesson03.teach.two_paras_note
            kind: grammar_note
            target: {text: "*Ahorro* (I save, present) and *ahorrar* (to save, infinitive) are different forms of the same verb -- *para* is always followed by the infinitive.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit35.lesson03.exercise01.choose_mateo, type: multiple_choice, tested_text: "Mateo trabaja muchas horas para ahorrar dinero", prompt: {target_blocks: [{text: "Which sentence means \"Mateo works many hours in order to save money\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit35.lesson03.exercise02.listen_mateo, type: listen_select, tested_text: "Mateo trabaja muchas horas para ahorrar dinero", media_asset_key: es.b1.audio.propositos.mateo_trabaja.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit35.lesson03.exercise03.match_mateo
            type: matching_pairs
            tested_text: "trabaja muchas horas ahorrar dinero"
            prompt: {target_blocks: []}
            pairs: [{left: "trabaja", right: "he works"}, {left: "muchas horas", right: "many hours"}, {left: "ahorrar", right: "to save"}, {left: "Mateo trabaja muchas horas", right: "Mateo works many hours"}, {left: "para ahorrar dinero", right: "in order to save money"}]
          - {content_key: es.b1.unit35.lesson03.exercise04.order_mateo, type: word_order, tested_text: "Mateo trabaja muchas horas para ahorrar dinero", prompt: {target_blocks: []}, word_bank: [Mateo, trabaja, muchas, horas, para, ahorrar, dinero]}
          - {content_key: es.b1.unit35.lesson03.exercise05.translate_mateo, type: translation, tested_text: "Mateo trabaja muchas horas para ahorrar dinero", prompt: {target_blocks: [{text: "Translate to Spanish using \"para ahorrar\": Mateo works many hours in order to save money.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit35.lesson04.mis_dos_metas
        title: "Mis dos metas"
        spine_outcome_id: universal.b1.purpose.express_purpose_and_goals
        teaching:
          - content_key: es.b1.unit35.lesson04.teach.purpose_study_recall
            kind: phrase
            target: {text: "Estudio español para trabajar en España.", language_code: es, direction: ltr}
            introduced_tokens: [Estudio, español, para, trabajar, en, España]
          - content_key: es.b1.unit35.lesson04.teach.purpose_money_recall
            kind: phrase
            target: {text: "Ahorro dinero para comprar una casa.", language_code: es, direction: ltr}
            introduced_tokens: [Ahorro, dinero, para, comprar, una, casa]
          - content_key: es.b1.unit35.lesson04.teach.full_message
            kind: reading
            target: {text: "Estudio español para trabajar en España. Ahorro dinero para comprar una casa.", language_code: es, direction: ltr}
            introduced_tokens: [Estudio, español, para, trabajar, en, España, Ahorro, dinero, comprar, una, casa]
        exercises:
          - {content_key: es.b1.unit35.lesson04.exercise01.choose_which_is_money, type: multiple_choice, tested_text: "Ahorro dinero para comprar una casa", prompt: {target_blocks: [{text: "Which sentence states the purpose of saving money, not studying?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit35.lesson04.exercise02.listen_full, type: listen_select, tested_text: "Estudio español para trabajar en España Ahorro dinero para comprar una casa", media_asset_key: es.b1.audio.propositos.dos_propositos.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit35.lesson04.exercise03.match_full_unit
            type: matching_pairs
            tested_text: "estudio ahorro trabajar comprar"
            prompt: {target_blocks: []}
            pairs: [{left: "Estudio español", right: "action"}, {left: "para trabajar en España", right: "its purpose"}, {left: "Ahorro dinero", right: "action"}, {left: "para comprar una casa", right: "its purpose"}, {left: "estudio / ahorro", right: "the two goal actions"}]
          - {content_key: es.b1.unit35.lesson04.exercise04.order_money_goal, type: word_order, tested_text: "Ahorro dinero para comprar una casa", prompt: {target_blocks: []}, word_bank: [Ahorro, dinero, para, comprar, una, casa]}
          - {content_key: es.b1.unit35.lesson04.exercise05.write_culminating_propositos, type: writing_prompt, tested_text: "Estudio español para trabajar en España Ahorro dinero para comprar una casa", prompt: {target_blocks: [{text: "Write two Spanish sentences about your own goals, each using \"para\" + infinitive. Sentence 1 must use \"Estudio español para...\" to say your goal is to work in Spain. Sentence 2 must use \"Ahorro dinero para...\" to say your goal is to buy a house.", language_code: en, direction: ltr}]}}
