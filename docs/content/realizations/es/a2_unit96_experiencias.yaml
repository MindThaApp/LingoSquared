          - {"content_key": "es.a2.unit96.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "¿Has probado la paella en Barcelona?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Has", "probado", "la", "paella", "en", "Barcelona"]}
          - {"content_key": "es.a2.unit96.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Sí, dos veces. ¿Y tú? ¿Has estado ya en Barcelona?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Sí", "dos", "veces", "Y", "tú", "Has", "estado", "ya", "en", "Barcelona"]}
          - {"content_key": "es.a2.unit96.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "No, todavía no he estado, pero he viajado en tren muchas veces.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["No", "todavía", "he", "estado", "pero", "viajado", "en", "tren", "muchas", "veces"]}
          - {"content_key": "es.a2.unit96.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Entonces tienes que ir. Es una ciudad muy bonita.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Entonces", "tienes", "que", "ir", "Es", "una", "ciudad", "muy", "bonita"]}
        exercises:
          - {"content_key": "es.a2.unit96.lesson06.exercise01.escucha_apertura", "type": "listen_select", "tested_text": "Mateo has estado alguna vez en Barcelona", "media_asset_key": "es.a2.audio.dialogue.experiencias.01", "prompt": {"target_blocks": []}}
          - {"content_key": "es.a2.unit96.lesson06.exercise02.entiende_paella", "type": "dialogue_comprehension", "tested_text": "dos veces", "media_asset_key": "es.a2.audio.dialogue.experiencias.01", "prompt": {"target_blocks": [{"text": "How many times has Mateo tried paella in Barcelona?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit96.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Has estado alguna vez en Barcelona Sí muchas veces Mi tío vive en Barcelona Has probado la paella en Barcelona Sí dos veces Todavía no he estado He viajado en tren muchas veces Entonces tienes que ir", "prompt": {"target_blocks": []}, "pairs": [{"left": "¿Has estado alguna vez en Barcelona?", "right": "Have you ever been in Barcelona?"}, {"left": "Sí, muchas veces.", "right": "Yes, many times."}, {"left": "Mi tío vive en Barcelona.", "right": "My uncle lives in Barcelona."}, {"left": "¿Has probado la paella en Barcelona?", "right": "Have you tried paella in Barcelona?"}, {"left": "Sí, dos veces.", "right": "Yes, twice."}, {"left": "Todavía no he estado.", "right": "I haven't been yet."}, {"left": "He viajado en tren muchas veces.", "right": "I have travelled by train many times."}, {"left": "Entonces tienes que ir.", "right": "Then you have to go."}]}
          - {"content_key": "es.a2.unit96.lesson06.exercise04.ordena_paella2", "type": "word_order", "tested_text": "Sí he probado la paella dos veces", "prompt": {"target_blocks": []}, "word_bank": ["Sí", "he", "probado", "la", "paella", "dos", "veces"]}
          - {"content_key": "es.a2.unit96.lesson06.exercise05.responde_barcelona", "type": "dialogue_response", "tested_text": "Sí muchas veces", "prompt": {"target_blocks": [{"text": "¿Has estado alguna vez en Barcelona?", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit96.lesson06.exercise06.traduce_todavia_pero", "type": "translation", "tested_text": "Todavía no he estado en Barcelona pero he viajado en tren muchas veces", "prompt": {"target_blocks": [{"text": "I haven't been in Barcelona yet, but I have travelled by train many times.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit96.lesson06.exercise07.escribe_experiencias", "type": "writing_prompt", "tested_text": "He probado la paella una vez Nunca he montado a caballo Todavía no he estado en Barcelona", "prompt": {"target_blocks": [{"text": "Write three Spanish sentences about yourself: (1) you have tried paella once; (2) you have never ridden a horse; (3) you haven't been in Barcelona yet.", "language_code": "en", "direction": "ltr"}]}}
