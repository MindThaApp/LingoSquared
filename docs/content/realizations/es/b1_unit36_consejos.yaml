  notes: >-
    Realizes universal.b1.social.give_advice_and_make_suggestions
    literally: learners give advice with "deberías" + infinitive, make a
    suggestion with "¿Por qué no...?", and respond to advice by accepting
    it. Character canon checked on disk and preserved (grep of
    a1_unit13_work.yaml, a2_unit16-25, b1_unit27/29/33): Elena is a Spanish
    teacher living in London; Mateo is a Colombian accountant living in
    London; tú register between them as established peers. No new facts
    introduced -- Elena is tired from her teaching schedule, consistent
    with her established job. The culminating exercise (lesson04) requires
    BOTH giving advice ("Deberías...") AND writing Elena's response
    accepting it ("Tienes razón..."), matching the outcome's can_do (give
    advice, and respond by accepting/declining/follow-up) in full rather
    than drilling only the advice half.
