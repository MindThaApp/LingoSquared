      - content_key: es.b2.unit06.lesson05.que_opina_el_autor
        title: "¿Qué opina el autor?"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: es.b2.unit06.lesson05.teach.texto
            kind: reading
            target:
              text: >-
                A mi parecer, deben instalarse cámaras de vigilancia en
                los espacios públicos. Por una parte, la seguridad de la
                comunidad mejora; por otra parte, la privacidad también
                importa. Por lo general, la vigilancia ayuda, pero no
                necesariamente resuelve todo. Comprendo que algunas
                personas se preocupan, pero no comparto esa opinión del
                todo. En muchos casos, el beneficio es mayor que el
                riesgo. No me cabe duda de que, con reglas claras, la
                confianza de la comunidad puede crecer.
              language_code: es
              direction: ltr
            introduced_tokens: [mejora, algunas, personas, preocupan, del, mayor, con, reglas, claras, crecer]
        exercises:
          - content_key: es.b2.unit06.lesson05.exercise01.read_stance
            type: reading_comprehension
            tested_text: "deben instalarse cámaras de vigilancia"
            prompt: {target_blocks: [{text: "What is the author's overall opinion?", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson05.exercise02.read_qualification
            type: reading_comprehension
            tested_text: "no necesariamente resuelve todo"
            prompt: {target_blocks: [{text: "What does the author CONCEDE about surveillance?", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson05.exercise03.read_final_value
            type: reading_comprehension
            tested_text: "el beneficio es mayor que el riesgo"
            prompt: {target_blocks: [{text: "On what basis does the author still support the cameras?", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson05.exercise04.read_hedge
            type: reading_comprehension
            tested_text: "la privacidad también importa"
            prompt: {target_blocks: [{text: "Does the author claim privacy doesn't matter?", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "mejora algunas personas se preocupan mayor reglas claras crecer"
            prompt: {target_blocks: []}
            pairs:
              - {left: mejora, right: improves}
              - {left: "algunas personas", right: "some people"}
              - {left: "se preocupan", right: worry}
              - {left: mayor, right: greater}
              - {left: "reglas claras", right: "clear rules"}
              - {left: crecer, right: "to grow"}
          - content_key: es.b2.unit06.lesson05.exercise06.translate_confianza_crecer
            type: translation
            tested_text: "La confianza puede crecer"
            prompt: {target_blocks: [{text: "Translate into Spanish: Trust can grow.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson05.exercise07.write_beneficio_mayor
            type: writing_prompt
            tested_text: "El beneficio es mayor que el riesgo"
            prompt: {target_blocks: [{text: "Write in Spanish, using mayor que: The benefit is greater than the risk.", language_code: en, direction: ltr}]}

      - content_key: es.b2.unit06.lesson06.en_conversacion
        title: "En conversación: una opinión matizada"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: es.b2.unit06.lesson06.teach.afecta_vida_diaria
            kind: phrase
            target: {text: "afecta tu vida diaria", language_code: es, direction: ltr}
            introduced_tokens: [afecta, afectan, vida, diaria]
            example: {text: "Eso no afecta tu vida diaria.", language_code: es, direction: ltr}
          - content_key: es.b2.unit06.lesson06.teach.dialogue_elena_open
            kind: dialogue
            target: {text: "A mi parecer, deben instalarse cámaras de vigilancia en la plaza. Eso mejora la seguridad.", language_code: es, direction: ltr, speaker: Elena}
            introduced_tokens: []
          - content_key: es.b2.unit06.lesson06.teach.dialogue_mateo_concede
            kind: dialogue
            target: {text: "Comprendo tu punto de vista, pero me preocupa la privacidad.", language_code: es, direction: ltr, speaker: Mateo}
            introduced_tokens: []
          - content_key: es.b2.unit06.lesson06.teach.dialogue_elena_push
            kind: dialogue
            target: {text: "Por lo general, la vigilancia ayuda. No necesariamente afecta tu vida diaria.", language_code: es, direction: ltr, speaker: Elena}
            introduced_tokens: []
          - content_key: es.b2.unit06.lesson06.teach.dialogue_mateo_qualify
            kind: dialogue
            target: {text: "No comparto esa opinión del todo. Por otra parte, comprendo que la seguridad importa.", language_code: es, direction: ltr, speaker: Mateo}
            introduced_tokens: []
          - content_key: es.b2.unit06.lesson06.teach.dialogue_elena_conviction
            kind: dialogue
            target: {text: "No me cabe duda de que, con reglas claras, la confianza puede crecer.", language_code: es, direction: ltr, speaker: Elena}
            introduced_tokens: []
          - content_key: es.b2.unit06.lesson06.teach.dialogue_mateo_final
            kind: dialogue
            target: {text: "Eso depende de las reglas, pero la privacidad también importa.", language_code: es, direction: ltr, speaker: Mateo}
            introduced_tokens: []
          - content_key: es.b2.unit06.lesson06.teach.grammar_conversacion_matizada
            kind: grammar_note
            target: {text: "A mi parecer, deben instalarse cámaras, pero eso depende de las reglas. No comparto esa opinión del todo.", language_code: es, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: es.b2.unit06.lesson06.exercise01.comprehend_elena
            type: dialogue_comprehension
            tested_text: "cámaras de vigilancia en la plaza"
            media_asset_key: es.b2.audio.abstraccion.dialogo.camaras_debate.01
            prompt: {target_blocks: [{text: "What is Elena's position?", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson06.exercise02.comprehend_mateo
