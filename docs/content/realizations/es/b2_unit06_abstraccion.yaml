            prompt: {target_blocks: [{text: "What is Mateo's position, and how does he qualify it?", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson06.exercise03.comprehend_difference
            type: dialogue_comprehension
            tested_text: "la confianza puede crecer"
            media_asset_key: es.b2.audio.abstraccion.dialogo.camaras_debate.01
            prompt: {target_blocks: [{text: "Where do Elena and Mateo mainly DIFFER?", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson06.exercise04.order_no_me_cabe_duda
            type: word_order
            tested_text: "No me cabe duda de que la confianza puede crecer"
            prompt: {target_blocks: []}
            word_bank: ["No", me, cabe, duda, de, que, la, confianza, puede, "crecer"]
          - content_key: es.b2.unit06.lesson06.exercise05.speak_qualified_opinion
            type: speak_response
            tested_text: "Por lo general, la vigilancia ayuda, pero comprendo que la privacidad también importa"
            prompt: {target_blocks: [{text: "Someone says cameras should never be installed anywhere. Respond aloud with a QUALIFIED opinion that answers them, using por lo general and pero...: Generally, surveillance helps, but I understand that privacy also matters.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson06.exercise06.write_qualified_response
            type: writing_prompt
            tested_text: "Comprendo tu punto de vista, pero no comparto esa opinión del todo. A mi parecer, la seguridad de la comunidad importa más."
            prompt: {target_blocks: [{text: "Someone argues that cameras should never be installed. Write TWO Spanish sentences responding with a QUALIFIED opinion that answers them directly. (1) Concede partly, using comprendo tu punto de vista, pero...: I understand your point of view, but I don't share that opinion entirely. (2) Give your own qualified opinion, using a mi parecer: In my view, the community's security matters more.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit06.lesson06.exercise07.respond_qualified
            type: dialogue_response
            tested_text: "Comprendo tu punto de vista, pero a mi parecer la seguridad de la comunidad importa más"
            prompt: {target_blocks: [{text: "Las cámaras de vigilancia no deben instalarse porque afectan la privacidad.", language_code: es, direction: ltr}]}
