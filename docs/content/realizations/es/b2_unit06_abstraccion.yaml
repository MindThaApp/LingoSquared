generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    From-scratch generation, not adapted from a source. This is es's B2
    abstraction unit (discussing abstract ideas and values), authored as
    part of the second B2 wave (units 05-08) alongside three sibling
    units this file never saw. Mirrors nl's shipped B2 unit06 (abstractie)
    as the assigned structural exemplar (lesson arc, exercise-type
    pacing, spine-outcome sequencing) -- every sentence of actual Spanish
    text is freshly authored from first principles, not translated from
    the Dutch. The Dutch exemplar's hedge set (tot op zekere hoogte, over
    het algemeen, dat hangt ervan af) was deliberately NOT calqued;
    idiomatic Spanish hedges (por lo general, no necesariamente, eso
    depende de, en muchos casos) were chosen independently. Theme (cámaras
    de vigilancia en espacios públicos) and opinion-frame vocabulary (a mi
    parecer, yo diría que, no me cabe duda de que) are new territory for
    this course -- checked against es units 01-04 (same course) to avoid
    re-teaching unit01's "creo que / en mi opinión / estoy de acuerdo /
    por un lado ... por otro lado / libertad" or unit03's "hasta cierto
    punto / en cierto modo" as new material; this unit is fully
    self-contained (every token an exercise tests is introduced within
    this file, not borrowed from units 01-04). Elena and Mateo continue
    as the established es characters (informal tu register); only
    lesson06's culminating dialogue names them. No sibling-direction file
    (es-en) and no other unit-05/07/08 file was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of every opinion/qualification frame
    in everyday informal Spanish -- a mi parecer, yo diría que, no me cabe
    duda de que, por lo general, no necesariamente, eso depende de, en
    muchos casos -- and that the intended certainty scale (tentative ->
    firm) reads correctly to a native ear; (2) naturalness of the
    respond-to-opposing frames -- "comprendo tu punto de vista, pero...";
    "no comparto esa opinión, porque..."; "comparto esa opinión" -- and
    confirm these read as genuine concession-then-pushback / outright
    agree-disagree moves, not stilted textbook Spanish; (3) that "por una
    parte ... por otra parte" (chosen instead of unit01's already-taught
    "por un lado ... por otro lado" to avoid re-teaching the same
    connective) is an equally natural, unmarked register choice, not
    stiffer or more formal than the rest of the unit's informal register;
    (4) the abstract-value nouns as used here read as current everyday
    Spanish: la seguridad, la privacidad, la confianza, la comunidad; (5)
    the culminating writing exercise (lesson06 exercise06) is graded
    against a fixed two-sentence string -- confirm the accepted-answer
    punctuation variants are complete enough that a correct learner is
    never marked wrong; (6) confirm Mateo's position across lesson06
    reads as a genuinely QUALIFIED disagreement (concedes the security
    point, still holds the privacy concern), not a flat rejection or a
    flat concession.
  notes: >-
    Sixth Spanish B2 unit (second wave, units 05-08). Targets the CEFR B2
    abstraction outcome (universal.b2.abstraction.discuss_abstract_ideas_and_values):
    give a QUALIFIED opinion on an abstract topic and respond directly to
    an opposing view, distinguishing a flat opinion from a qualified one
    and an agreement from a direct rebuttal. Theme: one coherent everyday
    abstract debate across all six lessons -- should surveillance cameras
    be installed in public spaces? -- pitting collective security against
    individual privacy. Lesson arc: L01 opinion frames + abstract-value
    vocabulary (a mi parecer / yo diría que / no me cabe duda de que; la
    seguridad, la vigilancia); L02 QUALIFICATION -- softening an opinion
    (por lo general, no necesariamente, eso depende de, en muchos casos);
    L03 RESPONDING to an opposing view (comprendo tu punto de vista,
    pero...; no comparto esa opinión, porque...; comparto esa opinión);
    L04 weighing two sides (por una parte ... por otra parte; beneficio,
    riesgo, comunidad); L05 a short opinion READING that states a
    qualified stance (author's stance + what they concede); L06 the
    culminating production -- an Elena/Mateo dialogue for the LISTENING
    requirement (identify each position + where they differ), a SPEAKING
    task (qualified opinion answering an opposing view), a WRITING task
    (qualified opinion responding to a stated opposing view), and a
    dialogue_response that directly answers a stated opposing view with a
    qualified opinion. Register: informal tu throughout, per the es lane
    precedent; Elena and Mateo continue their established informal
    register. All vocabulary is introduced self-contained within this
    file (each token is taught in this or an earlier lesson of THIS unit
    before it is tested) -- deliberately not dependent on units 01-04's
    token pool, so the unit stands on its own. No sibling-direction file
    was consulted.

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tu throughout (es lane precedent). B2 abstraction layers
    opinion frames, qualification frames, and respond-to-opposing frames
    onto that register -- a mi parecer, yo diría que, no me cabe duda de
    que, por lo general, no necesariamente, comprendo tu punto de vista,
    pero..., comparto esa opinión -- while keeping everyday informal
    address. Elena and Mateo continue the informal tu they use with each
    other.

