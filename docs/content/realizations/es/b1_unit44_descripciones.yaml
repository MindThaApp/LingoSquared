units:
  - content_key: es.b1.unit44.descripciones
    title: "Descripciones con oraciones relativas"
    section: reading_writing
    spine_outcome_ids: [universal.b1.narrative.combine_descriptions_with_relative_clauses]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit44.lesson01.oficina_londres
        title: "La oficina que está en Londres"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: es.b1.unit44.lesson01.teach.que
            kind: vocabulary
            target: {text: "que", language_code: es, direction: ltr}
            introduced_tokens: [que]
            example: {text: "El libro que leo es interesante.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson01.teach.una_oficina
            kind: vocabulary
            target: {text: "una oficina", language_code: es, direction: ltr}
            introduced_tokens: [una, oficina]
            example: {text: "Trabajo en una oficina pequeña.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson01.teach.esta_en_londres
            kind: vocabulary
            target: {text: "está en Londres", language_code: es, direction: ltr}
            introduced_tokens: [está, en, Londres]
            example: {text: "La tienda está en Londres.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson01.teach.grammar_note
            kind: grammar_note
            target: {text: "\"Que\" combines two facts about a thing into one sentence with a relative clause: it does not change form for gender or number.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.b1.unit44.lesson01.teach.phrase
            kind: phrase
            target: {text: "Mateo trabaja en una oficina que está en Londres.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, trabaja, en, una, oficina, que, está, Londres]
        exercises:
          - {content_key: es.b1.unit44.lesson01.exercise01.choose_relativa, type: multiple_choice, tested_text: "Mateo trabaja en una oficina que está en Londres", prompt: {target_blocks: [{text: "Which sentence combines both facts: \"Mateo works in an office\" and \"the office is in London\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit44.lesson01.exercise02.listen_relativa, type: listen_select, tested_text: "Mateo trabaja en una oficina que está en Londres", media_asset_key: es.b1.audio.descripciones.oficina_londres.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit44.lesson01.exercise03.match_relativa
            type: matching_pairs
            tested_text: "que oficina londres"
            prompt: {target_blocks: []}
            pairs: [{left: "que", right: "that/which"}, {left: "una oficina", right: "an office"}, {left: "está en Londres", right: "is in London"}, {left: "una oficina que está en Londres", right: "an office that is in London"}, {left: "Mateo trabaja en una oficina que está en Londres", right: "Mateo works in an office that is in London"}]
          - {content_key: es.b1.unit44.lesson01.exercise04.order_relativa, type: word_order, tested_text: "Mateo trabaja en una oficina que está en Londres", prompt: {target_blocks: []}, word_bank: [Mateo, trabaja, en, una, oficina, que, está, en, Londres]}
          - {content_key: es.b1.unit44.lesson01.exercise05.translate_relativa, type: translation, tested_text: "Mateo trabaja en una oficina que está en Londres", prompt: {target_blocks: [{text: "Translate to Spanish, combining both facts into one sentence with \"que\": Mateo works in an office that is in London.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit44.lesson02.oficina_empleados
        title: "La oficina donde hay muchos empleados"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: es.b1.unit44.lesson02.teach.donde
            kind: vocabulary
            target: {text: "donde", language_code: es, direction: ltr}
            introduced_tokens: [donde]
            example: {text: "Esta es la casa donde nací.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson02.teach.hay_muchos_empleados
            kind: vocabulary
            target: {text: "hay muchos empleados", language_code: es, direction: ltr}
            introduced_tokens: [hay, muchos, empleados]
            example: {text: "En la fábrica hay muchos empleados.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson02.teach.grammar_note
            kind: grammar_note
            target: {text: "\"Donde\" combines a fact about a place with a second fact about what happens there, into one richer sentence.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.b1.unit44.lesson02.teach.phrase
            kind: phrase
            target: {text: "Mateo trabaja en una oficina donde hay muchos empleados.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, trabaja, en, una, oficina, donde, hay, muchos, empleados]
        exercises:
          - {content_key: es.b1.unit44.lesson02.exercise01.choose_donde, type: multiple_choice, tested_text: "Mateo trabaja en una oficina donde hay muchos empleados", prompt: {target_blocks: [{text: "Which sentence combines both facts: \"Mateo works in an office\" and \"there are many employees there\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit44.lesson02.exercise02.listen_donde, type: listen_select, tested_text: "Mateo trabaja en una oficina donde hay muchos empleados", media_asset_key: es.b1.audio.descripciones.oficina_empleados.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit44.lesson02.exercise03.match_donde
            type: matching_pairs
            tested_text: "donde empleados oficina"
            prompt: {target_blocks: []}
            pairs: [{left: "donde", right: "where"}, {left: "hay muchos empleados", right: "there are many employees"}, {left: "una oficina donde hay muchos empleados", right: "an office where there are many employees"}, {left: "muchos empleados", right: "many employees"}, {left: "Mateo trabaja en una oficina donde hay muchos empleados", right: "Mateo works in an office where there are many employees"}]
          - {content_key: es.b1.unit44.lesson02.exercise04.order_donde, type: word_order, tested_text: "Mateo trabaja en una oficina donde hay muchos empleados", prompt: {target_blocks: []}, word_bank: [Mateo, trabaja, en, una, oficina, donde, hay, muchos, empleados]}
          - {content_key: es.b1.unit44.lesson02.exercise05.fill_donde, type: fill_in_blank, tested_text: "Mateo trabaja en una oficina donde hay muchos empleados", prompt: {target_blocks: [{text: "Mateo trabaja en una oficina ___ hay muchos empleados. (where)", language_code: es, direction: ltr}]}}

      - content_key: es.b1.unit44.lesson03.colega_con_quien
        title: "Un colega con quien trabaja"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: es.b1.unit44.lesson03.teach.un_colega
            kind: vocabulary
            target: {text: "un colega", language_code: es, direction: ltr}
            introduced_tokens: [un, colega]
            example: {text: "Tengo un colega simpático.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson03.teach.con_quien
            kind: vocabulary
            target: {text: "con quien", language_code: es, direction: ltr}
            introduced_tokens: [con, quien]
            example: {text: "Esta es la amiga con quien estudio.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson03.teach.todos_los_dias
            kind: vocabulary
            target: {text: "todos los días", language_code: es, direction: ltr}
            introduced_tokens: [todos, los, días]
            example: {text: "Camino todos los días.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson03.teach.grammar_note
            kind: grammar_note
            target: {text: "\"Quien\" is used for people after a preposition (\"con quien\" = \"with whom\"); it agrees only in number (quien/quienes), never in gender.", language_code: en, direction: ltr}
            introduced_tokens: []
          - content_key: es.b1.unit44.lesson03.teach.phrase
            kind: phrase
            target: {text: "Mateo tiene un colega con quien trabaja todos los días.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, tiene, un, colega, con, quien, trabaja, todos, los, días]
        exercises:
          - {content_key: es.b1.unit44.lesson03.exercise01.choose_con_quien, type: multiple_choice, tested_text: "Mateo tiene un colega con quien trabaja todos los días", prompt: {target_blocks: [{text: "Which sentence combines both facts using a preposition-combined relative pronoun: \"Mateo has a colleague\" and \"Mateo works with the colleague every day\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit44.lesson03.exercise02.listen_con_quien, type: listen_select, tested_text: "Mateo tiene un colega con quien trabaja todos los días", media_asset_key: es.b1.audio.descripciones.colega_con_quien.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit44.lesson03.exercise03.match_con_quien
            type: matching_pairs
            tested_text: "colega quien días"
            prompt: {target_blocks: []}
            pairs: [{left: "un colega", right: "a colleague"}, {left: "con quien", right: "with whom"}, {left: "todos los días", right: "every day"}, {left: "trabaja todos los días", right: "works every day"}, {left: "Mateo tiene un colega con quien trabaja todos los días", right: "Mateo has a colleague with whom he works every day"}]
          - {content_key: es.b1.unit44.lesson03.exercise04.order_con_quien, type: word_order, tested_text: "Mateo tiene un colega con quien trabaja todos los días", prompt: {target_blocks: []}, word_bank: [Mateo, tiene, un, colega, con, quien, trabaja, todos, los, días]}
          - {content_key: es.b1.unit44.lesson03.exercise05.translate_con_quien, type: translation, tested_text: "Mateo tiene un colega con quien trabaja todos los días", prompt: {target_blocks: [{text: "Translate to Spanish, using the preposition-combined relative pronoun \"con quien\": Mateo has a colleague with whom he works every day.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit44.lesson04.combinar_hechos
        title: "Combinar dos hechos"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: es.b1.unit44.lesson04.teach.que_recall
            kind: phrase
            target: {text: "Mateo trabaja en una oficina que está en Londres.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, trabaja, en, una, oficina, que, está, Londres]
          - content_key: es.b1.unit44.lesson04.teach.con_quien_recall
            kind: phrase
            target: {text: "Mateo tiene un colega con quien trabaja todos los días.", language_code: es, direction: ltr}
            introduced_tokens: [Mateo, tiene, un, colega, con, quien, trabaja, todos, los, días]
          - content_key: es.b1.unit44.lesson04.teach.tengo_un_colega
            kind: vocabulary
            target: {text: "tengo un colega", language_code: es, direction: ltr}
            introduced_tokens: [Tengo, tengo]
            example: {text: "Tengo un colega en Madrid.", language_code: es, direction: ltr}
          - content_key: es.b1.unit44.lesson04.teach.trabajo_primera_persona
            kind: vocabulary
            target: {text: "trabajo", language_code: es, direction: ltr}
            introduced_tokens: [trabajo]
            example: {text: "Trabajo en una escuela.", language_code: es, direction: ltr}
        exercises:
          - {content_key: es.b1.unit44.lesson04.exercise01.choose_which_uses_preposition, type: multiple_choice, tested_text: "Mateo tiene un colega con quien trabaja todos los días", prompt: {target_blocks: [{text: "Which sentence uses a relative pronoun combined with a preposition, rather than the plain \"que\"?", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit44.lesson04.exercise02.listen_recap, type: listen_select, tested_text: "Mateo trabaja en una oficina que está en Londres donde hay muchos empleados y tiene un colega con quien trabaja todos los días", media_asset_key: es.b1.audio.descripciones.recap.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit44.lesson04.exercise03.match_recap
            type: matching_pairs
            tested_text: "que donde con quien"
            prompt: {target_blocks: []}
            pairs: [{left: "que", right: "the plain relative pronoun for things"}, {left: "donde", right: "the relative pronoun for places"}, {left: "con quien", right: "the preposition-combined relative pronoun for people"}, {left: "Mateo trabaja en una oficina que está en Londres", right: "combines two facts about the office"}, {left: "Mateo tiene un colega con quien trabaja todos los días", right: "combines two facts about the colleague"}]
          - {content_key: es.b1.unit44.lesson04.exercise04.order_tengo_colega, type: word_order, tested_text: "Tengo un colega con quien trabajo todos los días", prompt: {target_blocks: []}, word_bank: [Tengo, un, colega, con, quien, trabajo, todos, los, días]}
          - {content_key: es.b1.unit44.lesson04.exercise05.write_culminating_descripcion, type: writing_prompt, tested_text: "Tengo un colega con quien trabajo todos los días", prompt: {target_blocks: [{text: "Combine these two facts into one sentence using the preposition-combined relative pronoun \"con quien\": Tengo un colega. Trabajo con mi colega todos los días.", language_code: en, direction: ltr}]}}
