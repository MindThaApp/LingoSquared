schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: codex
  human_reviewed: false
  source_material: >-
    Authored fresh for Peninsular Spanish. No other language units were
    consulted.
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Opens the Spanish B1 tier. Since B1 validates standalone, this unit
    reintroduces recurring people, workplace, appointment, and document
    basics inside B1 rather than relying on A1/A2 credit. Character canon
    checked on disk: Elena is a teacher from Spain living in London; Mateo
    is an accountant from Colombia living in London. This unit preserves
    those facts and teaches ability through poder plus an embedded que-clause
    (Puedo confirmar que..., Podría haber explicado que...), contrasting
    present ability with past/hypothetical ability and culminating in a
    written message using that construction.
course:
  realization_key: es.b1
  target_language_first: true
  dialect: es_peninsular
  register_policy: >-
    Peninsular Spanish. Elena and Mateo use tú as established peers; formal
    usted appears only in institutional phrases.
