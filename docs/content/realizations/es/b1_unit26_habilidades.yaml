  - {content_key: es.b1.audio.habilidades.puedo_confirmar.01, language: es, text: "Puedo confirmar que tengo una cita.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.habilidades.podria_haber.01, language: es, text: "Podría haber explicado que el documento estaba listo.", voice_hint: neutral_young_adult, status: pending_generation}
  - {content_key: es.b1.audio.habilidades.mensaje.01, language: es, text: "Puedo confirmar que tengo una cita el martes. También puedo explicar que Mateo trabaja como contable.", voice_hint: neutral_young_adult_clear, status: pending_generation}
units:
  - content_key: es.b1.unit26.habilidades
    title: "Habilidades con frases dentro de frases"
    section: speaking
    spine_outcome_ids: [universal.b1.abilities.express_ability_with_embedded_clause]
    planned_lesson_count: 4
    lessons:
      - content_key: es.b1.unit26.lesson01.recordatorio_personas
        title: "Elena y Mateo"
        spine_outcome_id: universal.b1.abilities.express_ability_with_embedded_clause
        teaching:
          - content_key: es.b1.unit26.lesson01.teach.elena
            kind: vocabulary
            target: {text: "Elena", language_code: es, direction: ltr}
            introduced_tokens: [Elena]
            example: {text: "Elena es profesora y vive en Londres.", language_code: es, direction: ltr}
          - content_key: es.b1.unit26.lesson01.teach.mateo
            kind: vocabulary
            target: {text: "Mateo", language_code: es, direction: ltr}
            introduced_tokens: [Mateo]
            example: {text: "Mateo trabaja como contable.", language_code: es, direction: ltr}
          - content_key: es.b1.unit26.lesson01.teach.contable
            kind: vocabulary
            target: {text: "contable", language_code: es, direction: ltr}
            introduced_tokens: [contable, trabaja, como]
            example: {text: "Mateo trabaja como contable.", language_code: es, direction: ltr}
          - content_key: es.b1.unit26.lesson01.teach.la_cita
            kind: vocabulary
            target: {text: "la cita", language_code: es, direction: ltr}
            introduced_tokens: [la, cita]
            example: {text: "Tengo una cita el martes.", language_code: es, direction: ltr}
          - {content_key: es.b1.unit26.lesson01.teach.elena_profesora, kind: phrase, target: {text: "Elena es profesora y vive en Londres.", language_code: es, direction: ltr}, introduced_tokens: [es, profesora, y, vive, en, Londres]}
        exercises:
          - {content_key: es.b1.unit26.lesson01.exercise01.choose_elena, type: multiple_choice, tested_text: "Elena es profesora y vive en Londres", prompt: {target_blocks: [{text: "Elena is a teacher and lives in London.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit26.lesson01.exercise02.listen_elena, type: listen_select, tested_text: "Elena es profesora y vive en Londres", media_asset_key: es.b1.audio.habilidades.elena_profesora.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit26.lesson01.exercise03.match_people
            type: matching_pairs
            tested_text: "Elena Mateo profesora contable cita Londres"
            prompt: {target_blocks: []}
            pairs: [{left: "Elena", right: "the teacher from Spain"}, {left: "Mateo", right: "the accountant from Colombia"}, {left: "profesora", right: "teacher"}, {left: "contable", right: "accountant"}, {left: "la cita", right: "the appointment"}, {left: "Londres", right: "London"}]
          - {content_key: es.b1.unit26.lesson01.exercise04.order_elena, type: word_order, tested_text: "Elena es profesora y vive en Londres", prompt: {target_blocks: []}, word_bank: [Elena, es, profesora, y, vive, en, Londres]}
          - {content_key: es.b1.unit26.lesson01.exercise05.write_mateo, type: writing_prompt, tested_text: "Mateo trabaja como contable", prompt: {target_blocks: [{text: "Write in Spanish: Mateo works as an accountant.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit26.lesson02.puedo_confirmar_que
        title: "Puedo confirmar que..."
        spine_outcome_id: universal.b1.abilities.express_ability_with_embedded_clause
        teaching:
          - content_key: es.b1.unit26.lesson02.teach.confirmar
            kind: vocabulary
            target: {text: "confirmar", language_code: es, direction: ltr}
            introduced_tokens: [confirmar]
            example: {text: "Puedo confirmar que tengo una cita.", language_code: es, direction: ltr}
          - content_key: es.b1.unit26.lesson02.teach.explicar
            kind: vocabulary
            target: {text: "explicar", language_code: es, direction: ltr}
            introduced_tokens: [explicar]
            example: {text: "Puedo explicar la cita.", language_code: es, direction: ltr}
          - content_key: es.b1.unit26.lesson02.teach.documento_listo
            kind: vocabulary
            target: {text: "el documento listo", language_code: es, direction: ltr}
            introduced_tokens: [el, documento, listo]
            example: {text: "El documento está listo.", language_code: es, direction: ltr}
          - {content_key: es.b1.unit26.lesson02.teach.puedo_confirmar, kind: phrase, target: {text: "Puedo confirmar que tengo una cita.", language_code: es, direction: ltr}, introduced_tokens: [Puedo, confirmar, que, tengo, una, cita]}
          - content_key: es.b1.unit26.lesson02.teach.embedded_note
            kind: grammar_note
            target: {text: "In *Puedo confirmar que tengo una cita*, the ability is not just *puedo confirmar*. The part after *que* says what you can confirm.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit26.lesson02.exercise01.choose_puedo_confirmar, type: multiple_choice, tested_text: "Puedo confirmar que tengo una cita", prompt: {target_blocks: [{text: "I can confirm that I have an appointment.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit26.lesson02.exercise02.listen_puedo_confirmar, type: listen_select, tested_text: "Puedo confirmar que tengo una cita", media_asset_key: es.b1.audio.habilidades.puedo_confirmar.01, prompt: {target_blocks: []}}
          - content_key: es.b1.unit26.lesson02.exercise03.match_ability
            type: matching_pairs
            tested_text: "puedo confirmar tengo cita explicar documento listo"
            prompt: {target_blocks: []}
            pairs: [{left: "puedo", right: "I can"}, {left: "confirmar", right: "to confirm"}, {left: "que tengo una cita", right: "that I have an appointment"}, {left: "explicar", right: "to explain"}, {left: "el documento", right: "the document"}, {left: "listo", right: "ready"}]
          - {content_key: es.b1.unit26.lesson02.exercise04.order_puedo_confirmar, type: word_order, tested_text: "Puedo confirmar que tengo una cita", prompt: {target_blocks: []}, word_bank: [Puedo, confirmar, que, tengo, una, cita]}
          - {content_key: es.b1.unit26.lesson02.exercise05.translate_puedo_confirmar, type: translation, tested_text: "Puedo confirmar que tengo una cita", prompt: {target_blocks: [{text: "I can confirm that I have an appointment.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit26.lesson03.podria_haber_explicado
        title: "Podría haber explicado que..."
        spine_outcome_id: universal.b1.abilities.express_ability_with_embedded_clause
        teaching:
          - content_key: es.b1.unit26.lesson03.teach.el_documento
            kind: vocabulary
            target: {text: "el documento", language_code: es, direction: ltr}
            introduced_tokens: [el, documento]
            example: {text: "El documento estaba listo.", language_code: es, direction: ltr}
          - {content_key: es.b1.unit26.lesson03.teach.podria_haber, kind: phrase, target: {text: "Podría haber explicado que el documento estaba listo.", language_code: es, direction: ltr}, introduced_tokens: [Podría, haber, explicado, que, el, documento, estaba, listo]}
          - content_key: es.b1.unit26.lesson03.teach.contrast_note
            kind: grammar_note
            target: {text: "*Puedo confirmar que...* states present ability. *Podría haber explicado que...* says what someone could have done, but did not or may not have done.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
          - {content_key: es.b1.unit26.lesson03.exercise01.choose_past_ability, type: multiple_choice, tested_text: "Podría haber explicado que el documento estaba listo", prompt: {target_blocks: [{text: "I could have explained that the document was ready.", language_code: en, direction: ltr}]}}
          - {content_key: es.b1.unit26.lesson03.exercise02.listen_past_ability, type: listen_select, tested_text: "Podría haber explicado que el documento estaba listo", media_asset_key: es.b1.audio.habilidades.podria_haber.01, prompt: {target_blocks: []}}
          - {content_key: es.b1.unit26.lesson03.exercise03.order_past_ability, type: word_order, tested_text: "Podría haber explicado que el documento estaba listo", prompt: {target_blocks: []}, word_bank: [Podría, haber, explicado, que, el, documento, estaba, listo]}
          - {content_key: es.b1.unit26.lesson03.exercise04.fill_que_clause, type: fill_in_blank, tested_text: "Podría haber explicado que el documento estaba listo", prompt: {target_blocks: [{text: "Podría haber explicado ___ el documento estaba listo. (that)", language_code: es, direction: ltr}]}}
          - {content_key: es.b1.unit26.lesson03.exercise05.translate_past_ability, type: translation, tested_text: "Podría haber explicado que el documento estaba listo", prompt: {target_blocks: [{text: "I could have explained that the document was ready.", language_code: en, direction: ltr}]}}

      - content_key: es.b1.unit26.lesson04.mensaje_habilidad
        title: "Escribe lo que puedes hacer"
        spine_outcome_id: universal.b1.abilities.express_ability_with_embedded_clause
        teaching:
          - {content_key: es.b1.unit26.lesson04.teach.mensaje, kind: phrase, target: {text: "Puedo confirmar que tengo una cita el martes.", language_code: es, direction: ltr}, introduced_tokens: [Puedo, confirmar, que, tengo, una, cita, el, martes]}
          - {content_key: es.b1.unit26.lesson04.teach.explicar_mateo, kind: phrase, target: {text: "También puedo explicar que Mateo trabaja como contable.", language_code: es, direction: ltr}, introduced_tokens: [También, puedo, explicar, que, Mateo, trabaja, como, contable]}
        exercises:
          - {content_key: es.b1.unit26.lesson04.exercise01.choose_message, type: multiple_choice, tested_text: "Puedo confirmar que tengo una cita el martes", prompt: {target_blocks: [{text: "I can confirm that I have an appointment on Tuesday.", language_code: en, direction: ltr}]}}
          - content_key: es.b1.unit26.lesson04.exercise02.match_full_unit
            type: matching_pairs
            tested_text: "confirmar explicar cita documento contable profesora Londres martes"
            prompt: {target_blocks: []}
            pairs: [{left: "Puedo confirmar que tengo una cita.", right: "present ability"}, {left: "Podría haber explicado que el documento estaba listo.", right: "past/hypothetical ability"}, {left: "Elena es profesora.", right: "Elena is a teacher."}, {left: "Mateo trabaja como contable.", right: "Mateo is an accountant."}, {left: "el documento", right: "the document"}, {left: "el martes", right: "on Tuesday"}]
          - {content_key: es.b1.unit26.lesson04.exercise03.order_second_sentence, type: word_order, tested_text: "También puedo explicar que Mateo trabaja como contable", prompt: {target_blocks: []}, word_bank: [También, puedo, explicar, que, Mateo, trabaja, como, contable]}
          - {content_key: es.b1.unit26.lesson04.exercise04.listen_message, type: listen_select, tested_text: "Puedo confirmar que tengo una cita el martes", media_asset_key: es.b1.audio.habilidades.mensaje.01, prompt: {target_blocks: []}}
          - {content_key: es.b1.unit26.lesson04.exercise05.write_culminating_ability, type: writing_prompt, tested_text: "Puedo confirmar que tengo una cita el martes También puedo explicar que Mateo trabaja como contable", prompt: {target_blocks: [{text: "Write two Spanish sentences. First, say: I can confirm that I have an appointment on Tuesday. Then say: I can also explain that Mateo works as an accountant. Use puedo + a verb + que in both sentences.", language_code: en, direction: ltr}]}}
