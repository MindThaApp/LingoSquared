      - content_key: es.a2.unit103.lesson05.el_mensaje_de_mateo
        title: "El mensaje de Mateo"
        spine_outcome_id: universal.a2.habits.describe_starting_stopping_trying
        teaching:
          - {"content_key": "es.a2.unit103.lesson05.teach.palabras", "kind": "vocabulary", "target": {"text": "la rutina, nueva, el trabajo, temprano, fácil", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["la", "rutina", "nueva", "el", "trabajo", "temprano", "fácil", "Tengo", "una", "Mateo", "sale", "del", "a", "las", "seis", "Por", "noche", "dejo", "de", "usar", "móvil", "No", "es", "dormir"], "example": [{"text": "Tengo una rutina nueva.", "language_code": "es", "direction": "ltr"}, {"text": "Mateo sale del trabajo a las seis.", "language_code": "es", "direction": "ltr"}, {"text": "Por la noche dejo de usar el móvil.", "language_code": "es", "direction": "ltr"}, {"text": "No es fácil dormir temprano.", "language_code": "es", "direction": "ltr"}]}
          - {"content_key": "es.a2.unit103.lesson05.teach.gn_repaso", "kind": "grammar_note", "target": {"text": "Yo he empezado a correr después del trabajo. Por la noche he dejado de usar el móvil.", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["Yo", "he", "empezado", "a", "correr", "después", "del", "trabajo", "Por", "la", "noche", "dejado", "de", "usar", "el", "móvil"]}
          - {"content_key": "es.a2.unit103.lesson05.teach.lectura", "kind": "reading", "target": {"text": "Hola, Elena. Esta semana tengo una rutina nueva. He empezado a correr después del trabajo. He dejado de usar el móvil por la noche. He intentado dormir temprano, pero no es fácil. Y he olvidado llamar a mi tío de Barcelona. ¿Y tú? ¿Has dejado de mirar el móvil en el tren?", "language_code": "es", "direction": "ltr"}, "introduced_tokens": ["Hola", "Elena", "Esta", "semana", "tengo", "una", "rutina", "nueva", "He", "empezado", "a", "correr", "después", "del", "trabajo", "dejado", "de", "usar", "el", "móvil", "por", "la", "noche", "intentado", "dormir", "temprano", "pero", "no", "es", "fácil", "Y", "olvidado", "llamar", "mi", "tío", "Barcelona", "tú", "Has", "mirar", "en", "tren"]}
        exercises:
          - {"content_key": "es.a2.unit103.lesson05.exercise01.lee_correr", "type": "reading_comprehension", "tested_text": "he empezado a correr", "prompt": {"target_blocks": [{"text": "What has Mateo started doing?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit103.lesson05.exercise02.lee_tio", "type": "reading_comprehension", "tested_text": "he olvidado llamar a mi tío", "prompt": {"target_blocks": [{"text": "What has Mateo forgotten to do?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit103.lesson05.exercise03.une_mensaje", "type": "matching_pairs", "tested_text": "Tengo una rutina nueva He empezado a correr después del trabajo He dejado de usar el móvil por la noche He intentado dormir temprano No es fácil He olvidado llamar a mi tío Has dejado de mirar el móvil en el tren", "prompt": {"target_blocks": []}, "pairs": [{"left": "Tengo una rutina nueva.", "right": "I have a new routine."}, {"left": "He empezado a correr después del trabajo.", "right": "I have started running after work."}, {"left": "He dejado de usar el móvil por la noche.", "right": "I have stopped using my phone at night."}, {"left": "He intentado dormir temprano.", "right": "I have tried to sleep early."}, {"left": "No es fácil.", "right": "It is not easy."}, {"left": "He olvidado llamar a mi tío.", "right": "I have forgotten to call my uncle."}, {"left": "¿Has dejado de mirar el móvil en el tren?", "right": "Have you stopped looking at your phone on the train?"}]}
          - {"content_key": "es.a2.unit103.lesson05.exercise04.ordena_noche", "type": "word_order", "tested_text": "He dejado de usar el móvil por la noche", "prompt": {"target_blocks": []}, "word_bank": ["noche", "de", "He", "el", "usar", "la", "dejado", "móvil", "por"]}
          - {"content_key": "es.a2.unit103.lesson05.exercise05.traduce_facil", "type": "translation", "tested_text": "He intentado dormir temprano pero no es fácil", "prompt": {"target_blocks": [{"text": "I have tried to sleep early, but it is not easy.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit103.lesson05.exercise06.dicta_correr", "type": "dictation", "tested_text": "He empezado a correr después del trabajo.", "media_asset_key": "es.a2.audio.empezar_y_dejar.he_empezado_a_correr.01", "prompt": {"target_blocks": []}}
          - {"content_key": "es.a2.unit103.lesson05.exercise07.dicta_llamar", "type": "dictation", "tested_text": "He olvidado llamar a mi tío.", "media_asset_key": "es.a2.audio.empezar_y_dejar.he_olvidado_llamar_a_mi_tio.01", "prompt": {"target_blocks": []}}
      - content_key: es.a2.unit103.lesson06.elena_y_mateo
        title: "Elena y Mateo hablan"
        spine_outcome_id: universal.a2.habits.describe_starting_stopping_trying
        teaching:
          - {"content_key": "es.a2.unit103.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Hola, Mateo. ¿Qué tal la rutina nueva?", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Hola", "Mateo", "Qué", "tal", "la", "rutina", "nueva"]}
          - {"content_key": "es.a2.unit103.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Bien. He empezado a salir en bici después del trabajo. ¿Y tú?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Bien", "He", "empezado", "a", "salir", "en", "bici", "después", "del", "trabajo", "Y", "tú"]}
          - {"content_key": "es.a2.unit103.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Yo he dejado de mirar el móvil en el tren.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Yo", "he", "dejado", "de", "mirar", "el", "móvil", "en", "tren"]}
          - {"content_key": "es.a2.unit103.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "¿De verdad? ¿Y qué haces ahora?", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["De", "verdad", "Y", "qué", "haces", "ahora"]}
          - {"content_key": "es.a2.unit103.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Miro por la ventana. Es más tranquilo. Pero he olvidado llamar a mi abuela.", "language_code": "es", "direction": "ltr", "speaker": "Elena"}, "introduced_tokens": ["Miro", "por", "la", "ventana", "Es", "más", "tranquilo", "Pero", "he", "olvidado", "llamar", "a", "mi", "abuela"]}
          - {"content_key": "es.a2.unit103.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Acabas de llegar a casa. Puedes llamar a tu abuela ahora.", "language_code": "es", "direction": "ltr", "speaker": "Mateo"}, "introduced_tokens": ["Acabas", "de", "llegar", "a", "casa", "Puedes", "llamar", "tu", "abuela", "ahora"]}
        exercises:
          - {"content_key": "es.a2.unit103.lesson06.exercise01.escucha_mateo", "type": "listen_select", "tested_text": "Bien He empezado a salir en bici después del trabajo Y tú", "media_asset_key": "es.a2.audio.dialogue.empezar_y_dejar.01", "prompt": {"target_blocks": []}}
          - {"content_key": "es.a2.unit103.lesson06.exercise02.entiende_tren", "type": "dialogue_comprehension", "tested_text": "Yo he dejado de mirar el móvil en el tren", "media_asset_key": "es.a2.audio.dialogue.empezar_y_dejar.01", "prompt": {"target_blocks": [{"text": "What has Elena stopped doing?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit103.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Qué tal la rutina nueva He empezado a salir en bici después del trabajo He dejado de mirar el móvil Miro por la ventana Es más tranquilo He olvidado llamar a mi abuela Acabas de llegar a casa", "prompt": {"target_blocks": []}, "pairs": [{"left": "¿Qué tal la rutina nueva?", "right": "How is the new routine?"}, {"left": "He empezado a salir en bici.", "right": "I have started going out on my bike."}, {"left": "después del trabajo", "right": "after work"}, {"left": "He dejado de mirar el móvil.", "right": "I have stopped looking at my phone."}, {"left": "Miro por la ventana.", "right": "I look out of the window."}, {"left": "Es más tranquilo.", "right": "It is calmer."}, {"left": "He olvidado llamar a mi abuela.", "right": "I have forgotten to call my grandmother."}, {"left": "Acabas de llegar a casa.", "right": "You have just arrived home."}]}
          - {"content_key": "es.a2.unit103.lesson06.exercise04.ordena_tren", "type": "word_order", "tested_text": "Yo he dejado de mirar el móvil en el tren", "prompt": {"target_blocks": []}, "word_bank": ["el", "tren", "móvil", "he", "Yo", "de", "dejado", "mirar", "en", "el"]}
          - {"content_key": "es.a2.unit103.lesson06.exercise05.responde_rutina", "type": "dialogue_response", "tested_text": "Yo he dejado de mirar el móvil en el tren", "prompt": {"target_blocks": [{"text": "Bien. He empezado a salir en bici después del trabajo. ¿Y tú?", "language_code": "es", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit103.lesson06.exercise06.traduce_bici", "type": "translation", "tested_text": "Mateo ha empezado a salir en bici después del trabajo", "prompt": {"target_blocks": [{"text": "Mateo has started going out on his bike after work.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "es.a2.unit103.lesson06.exercise07.escribe_dos", "type": "writing_prompt", "tested_text": "He dejado de mirar el móvil en el tren He olvidado llamar a mi abuela", "prompt": {"target_blocks": [{"text": "Write two Spanish sentences: (1) I have stopped looking at my phone on the train. (2) I have forgotten to call my grandmother.", "language_code": "en", "direction": "ltr"}]}}
