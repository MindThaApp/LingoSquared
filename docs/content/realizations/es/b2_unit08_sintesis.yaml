              - {left: "el tema", right: "the topic"}
              - {left: "están de acuerdo", right: "they agree"}
              - {left: ambas, right: "both (of them, feminine)"}
              - {left: entrenadores, right: trainers}
          - content_key: es.b2.unit08.lesson03.exercise04.order_coinciden_entrenadores
            type: word_order
            tested_text: "Laura y Marcos coinciden en que los entrenadores son buenos"
            prompt: {target_blocks: []}
            word_bank: [Laura, y, Marcos, coinciden, en, que, los, entrenadores, son, "buenos"]
          - content_key: es.b2.unit08.lesson03.exercise05.translate_coinciden
            type: translation
            tested_text: "Laura y Marcos coinciden en que los entrenadores son buenos"
            prompt: {target_blocks: [{text: "Translate into Spanish, using coincidir: Laura and Marcos agree that the trainers are good.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson03.exercise06.speak_lo_mismo
