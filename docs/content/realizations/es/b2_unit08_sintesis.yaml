            tested_text: "Laura y Marcos coinciden en que los entrenadores son buenos"
            media_asset_key: es.b2.audio.sintesis.coinciden_entrenadores.01
            prompt: {target_blocks: []}
          - content_key: es.b2.unit08.lesson03.exercise03.match_acuerdo_words
            type: matching_pairs
            tested_text: "coinciden lo mismo el tema están de acuerdo ambas entrenadores"
