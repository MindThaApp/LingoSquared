  - content_key: es.b2.audio.sintesis.ambas_entrenadores.01
    language: es
    text: "Ambas reseñas dicen que los entrenadores son buenos."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.b2.audio.sintesis.coinciden_entrenadores.01
    language: es
    text: "Laura y Marcos coinciden en que los entrenadores son buenos."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.b2.audio.sintesis.discrepan_precio.01
    language: es
    text: "Laura y Marcos discrepan en el precio."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: es.b2.audio.sintesis.dialogo.fitclub.01
    language: es
    text: >-
      Mateo: ¿Qué te pareció FitClub? Elena: Creo que es un gimnasio
      genial. Los entrenadores son muy buenos y las instalaciones son
      modernas. Y creo que el precio no es caro. Mateo: Yo, en cambio,
      pienso que es caro. La mensualidad cuesta cuarenta euros al mes.
      Elena: Pero los entrenadores son excelentes, ¿no? Mateo: Sí, en
      eso coincidimos. Pero en el precio, discrepamos. En conjunto,
      creo que mi opinión es más sólida, porque tengo una cifra
      concreta. Elena: Tienes razón. Al final, tu opinión es más
      convincente.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: es.b2.unit08.sintesis
    title: "Síntesis"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    planned_lesson_count: 6

    lessons:
      - content_key: es.b2.unit08.lesson01.quien_dice_que
        title: "¿Quién dice qué?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: es.b2.unit08.lesson01.teach.fitclub
            kind: phrase
            target: {text: "FitClub es un gimnasio nuevo.", language_code: es, direction: ltr}
            introduced_tokens: [FitClub, gimnasio, nuevo]
          - content_key: es.b2.unit08.lesson01.teach.resena
            kind: vocabulary
            target: {text: "la reseña", language_code: es, direction: ltr}
            introduced_tokens: [reseña, leí, sobre]
            example: {text: "Leí una reseña sobre FitClub.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson01.teach.segun
            kind: phrase
            target: {text: "Según Laura, el gimnasio no es caro.", language_code: es, direction: ltr}
            introduced_tokens: [Laura]
          - content_key: es.b2.unit08.lesson01.teach.marcos_afirma
            kind: vocabulary
            target: {text: "afirma (afirmar)", language_code: es, direction: ltr}
            introduced_tokens: [Marcos, afirma, afirmar]
            example: {text: "Marcos afirma que el gimnasio es caro.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson01.teach.sostiene
            kind: vocabulary
            target: {text: "sostiene (sostener)", language_code: es, direction: ltr}
            introduced_tokens: [sostiene, sostener, precio, alto]
            example: {text: "Marcos sostiene que el precio es alto.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson01.teach.senala
            kind: vocabulary
            target: {text: "señala (señalar)", language_code: es, direction: ltr}
            introduced_tokens: [señala, señalar, entrenadores, entrenador, buenos]
            example: {text: "Laura señala que los entrenadores son buenos.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson01.teach.fuente
            kind: vocabulary
            target: {text: "la fuente", language_code: es, direction: ltr}
            introduced_tokens: [fuente, fuentes, dos]
            example: {text: "Laura y Marcos son las dos fuentes.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson01.teach.grammar_atribuir
            kind: grammar_note
            target: {text: "Según Laura, el gimnasio no es caro. Marcos afirma que es caro. Marcos sostiene que el precio es alto. Laura señala que los entrenadores son buenos.", language_code: es, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: es.b2.unit08.lesson01.exercise01.recognize_segun
            type: multiple_choice
            tested_text: según
            prompt: {target_blocks: [{text: según, language_code: es, direction: ltr}]}
          - content_key: es.b2.unit08.lesson01.exercise02.listen_segun_laura
            type: listen_select
            tested_text: "Según Laura, el gimnasio no es caro"
            media_asset_key: es.b2.audio.sintesis.segun_laura.01
            prompt: {target_blocks: []}
          - content_key: es.b2.unit08.lesson01.exercise03.match_atribucion_words
            type: matching_pairs
            tested_text: "según afirma sostiene señala reseña fuente gimnasio entrenadores"
            prompt: {target_blocks: []}
            pairs:
              - {left: según, right: "according to"}
              - {left: afirma, right: "states / asserts"}
              - {left: sostiene, right: "argues / maintains"}
              - {left: señala, right: "points out / notes"}
              - {left: reseña, right: review}
              - {left: fuente, right: source}
              - {left: gimnasio, right: gym}
              - {left: entrenadores, right: trainers}
          - content_key: es.b2.unit08.lesson01.exercise04.order_marcos_afirma
            type: word_order
            tested_text: "Marcos afirma que el gimnasio es caro"
            prompt: {target_blocks: []}
            word_bank: [Marcos, afirma, que, el, gimnasio, es, "caro"]
          - content_key: es.b2.unit08.lesson01.exercise05.translate_sostiene
            type: translation
            tested_text: "Marcos sostiene que el precio es alto"
            prompt: {target_blocks: [{text: "Translate into Spanish, using sostener: Marcos maintains that the price is high.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson01.exercise06.speak_segun_laura
            type: speak_response
            tested_text: "Según Laura, el gimnasio no es caro"
            prompt: {target_blocks: [{text: "Say aloud in Spanish, using según: According to Laura, the gym isn't expensive.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson01.exercise07.write_senala
            type: writing_prompt
            tested_text: "Laura señala que los entrenadores son buenos"
            prompt: {target_blocks: [{text: "Write in Spanish, using señalar: Laura points out that the trainers are good.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson01.exercise08.dictation_segun_laura
            type: dictation
            tested_text: "Según Laura, el gimnasio no es caro"
            media_asset_key: es.b2.audio.sintesis.segun_laura.01
            prompt: {target_blocks: []}

      - content_key: es.b2.unit08.lesson02.comparar
        title: "Comparar dos fuentes"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: es.b2.unit08.lesson02.teach.ambas
            kind: vocabulary
            target: {text: "ambas", language_code: es, direction: ltr}
            introduced_tokens: [ambas, reseñas]
            example: {text: "Ambas reseñas dicen que los entrenadores son buenos.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson02.teach.mientras_que
            kind: phrase
            target: {text: "Laura dice que no es caro, mientras que Marcos dice que es caro.", language_code: es, direction: ltr}
            introduced_tokens: [dice]
          - content_key: es.b2.unit08.lesson02.teach.en_cambio
            kind: phrase
            target: {text: "Laura piensa que es barato; Marcos, en cambio, piensa que es caro.", language_code: es, direction: ltr}
            introduced_tokens: [piensa]
          - content_key: es.b2.unit08.lesson02.teach.a_diferencia_de
            kind: vocabulary
            target: {text: "a diferencia de", language_code: es, direction: ltr}
            introduced_tokens: [diferencia]
            example: {text: "A diferencia de Laura, Marcos piensa que es caro.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson02.teach.claim_comparacion
            kind: phrase
            target: {text: "Ambas reseñas dicen que los entrenadores son buenos, pero Laura piensa que el precio es bajo, mientras que Marcos piensa que es alto.", language_code: es, direction: ltr}
            introduced_tokens: [bajo]
          - content_key: es.b2.unit08.lesson02.teach.grammar_comparar
            kind: grammar_note
            target: {text: "Ambas reseñas dicen que los entrenadores son buenos. Laura piensa que el precio es bajo, mientras que Marcos piensa que es alto.", language_code: es, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: es.b2.unit08.lesson02.exercise01.recognize_ambas
            type: multiple_choice
            tested_text: ambas
            prompt: {target_blocks: [{text: ambas, language_code: es, direction: ltr}]}
          - content_key: es.b2.unit08.lesson02.exercise02.listen_ambas_entrenadores
            type: listen_select
            tested_text: "Ambas reseñas dicen que los entrenadores son buenos"
            media_asset_key: es.b2.audio.sintesis.ambas_entrenadores.01
            prompt: {target_blocks: []}
          - content_key: es.b2.unit08.lesson02.exercise03.match_comparacion_words
            type: matching_pairs
            tested_text: "ambas mientras que en cambio a diferencia de bajo alto reseñas precio"
            prompt: {target_blocks: []}
            pairs:
              - {left: ambas, right: "both (of them, feminine)"}
              - {left: "mientras que", right: whereas}
              - {left: "en cambio", right: "on the other hand"}
              - {left: "a diferencia de", right: "unlike / in contrast to"}
              - {left: bajo, right: low}
              - {left: alto, right: high}
              - {left: reseñas, right: reviews}
              - {left: precio, right: price}
          - content_key: es.b2.unit08.lesson02.exercise04.order_ambas_entrenadores
            type: word_order
            tested_text: "Ambas reseñas dicen que los entrenadores son buenos"
            prompt: {target_blocks: []}
            word_bank: [Ambas, reseñas, dicen, que, los, entrenadores, son, "buenos"]
          - content_key: es.b2.unit08.lesson02.exercise05.translate_mientras_que
            type: translation
            tested_text: "Laura dice que no es caro, mientras que Marcos dice que es caro"
            prompt: {target_blocks: [{text: "Translate into Spanish, using mientras que: Laura says it isn't expensive, whereas Marcos says it is expensive.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson02.exercise06.translate_a_diferencia_de
            type: translation
            tested_text: "A diferencia de Laura, Marcos piensa que es caro"
            prompt: {target_blocks: [{text: "Translate into Spanish, using a diferencia de: Unlike Laura, Marcos thinks it is expensive.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson02.exercise07.write_en_cambio
            type: writing_prompt
            tested_text: "Marcos, en cambio, piensa que es caro"
            prompt: {target_blocks: [{text: "Write in Spanish, using en cambio: Marcos, on the other hand, thinks it's expensive.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson02.exercise08.dictation_ambas_entrenadores
            type: dictation
            tested_text: "Ambas reseñas dicen que los entrenadores son buenos"
            media_asset_key: es.b2.audio.sintesis.ambas_entrenadores.01
            prompt: {target_blocks: []}

      - content_key: es.b2.unit08.lesson03.coincidencias
        title: "¿En qué coinciden?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: es.b2.unit08.lesson03.teach.coincidir
