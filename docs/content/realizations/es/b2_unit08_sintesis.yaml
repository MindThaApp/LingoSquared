            tested_text: "Piensan lo mismo sobre el tema"
            prompt: {target_blocks: [{text: "Say aloud in Spanish, using lo mismo: They think the same about the topic.", language_code: en, direction: ltr}]}
          - content_key: es.b2.unit08.lesson03.exercise07.write_de_acuerdo
            type: writing_prompt
            tested_text: "Están de acuerdo en que los entrenadores son buenos"
            prompt: {target_blocks: [{text: "Write in Spanish, using estar de acuerdo en: They agree that the trainers are good.", language_code: en, direction: ltr}]}

      - content_key: es.b2.unit08.lesson04.discrepancias
        title: "¿En qué discrepan?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: es.b2.unit08.lesson04.teach.discrepar
            kind: vocabulary
            target: {text: "discrepan (discrepar)", language_code: es, direction: ltr}
            introduced_tokens: [discrepan, discrepar]
