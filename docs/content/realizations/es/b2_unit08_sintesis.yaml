          - content_key: es.b2.unit08.lesson04.teach.discrepancia
            kind: vocabulary
            target: {text: "la discrepancia", language_code: es, direction: ltr}
            introduced_tokens: [discrepancia]
            example: {text: "La discrepancia es el precio.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson04.teach.contradicen
            kind: vocabulary
            target: {text: "se contradicen (contradecirse)", language_code: es, direction: ltr}
            introduced_tokens: [contradicen, contradecirse]
            example: {text: "Se contradicen sobre el precio.", language_code: es, direction: ltr}
          - content_key: es.b2.unit08.lesson04.teach.no_de_acuerdo
            kind: phrase
            target: {text: "Laura no está de acuerdo con Marcos sobre el precio.", language_code: es, direction: ltr}
            introduced_tokens: []
          - content_key: es.b2.unit08.lesson04.teach.aunque_discrepan
            kind: phrase
            target: {text: "Aunque coinciden en los entrenadores, discrepan en el precio.", language_code: es, direction: ltr}
            introduced_tokens: []
          - content_key: es.b2.unit08.lesson04.teach.grammar_discrepancia
            kind: grammar_note
            target: {text: "Laura y Marcos discrepan en el precio. Se contradicen: Laura dice que no es caro, Marcos dice que sí.", language_code: es, direction: ltr}
