schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: es
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    From-scratch generation, not adapted from a source. This is es's B2
    synthesis unit (the course-culminating unit of the second B2 wave,
    units 05-08, authored by parallel sibling sessions on disjoint files).
    Mirrors nl's shipped B2 unit08 (synthese) as the assigned structural
    exemplar (6 lessons, 44 exercises, spine-outcome sequencing, exercise
    pacing) -- every sentence of actual Spanish text is freshly authored
    from first principles, not translated or calqued from the Dutch.
    Elena and Mateo continue as the established es characters (see
    b2_unit04_relato.yaml); they appear only in lesson06's culminating
    dialogue, as two people giving their own opinions of the same gym --
    the two WRITTEN reviews in lesson05 are by new characters, Laura and
    Marcos (verified unused elsewhere in the es corpus before use). No
    sibling-direction file (es-en) was consulted, and no sibling unit
    05/06/07 file (being authored concurrently by other sessions) was
    read or depended on.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks:
    (1) naturalness of the whole synthesis toolkit -- the attributing
    frames (según X, X afirma/sostiene/señala que...), the comparing
    connectives (ambas, mientras que, en cambio, a diferencia de), the
    agreement frame (coinciden en que, están de acuerdo en que, lo
    mismo), the conflict frame (discrepan en, se contradicen, la
    discrepancia) and the judgement frames (más convincente, más sólida,
    en conjunto, al final) -- confirm each reads as current everyday
    pan-Hispanic Spanish and not as a stiff, overly formal register for a
    casual conversation between friends; (2) confirm "mientras que" as
    the CONTRASTIVE "whereas" (distinct from lesson-independent temporal
    "mientras" taught in unit04) is used correctly and that a learner
    would not confuse the two; (3) confirm "señala que" and "sostiene
    que" are genuinely distinct in register/strength from "afirma que"
    and are not redundant near-synonyms in this context (each has its
    own matching_pairs gloss to keep them distinguishable, mirroring
    nl's stelt/beweert/blijkt distinction); (4) the culminating writing
    exercise (lesson06 exercise06) is graded against a fixed
    three-sentence string -- confirm the supplied comma/period variants
    cover what a correct learner would actually type, or that more
    variants are needed; (5) confirm the deduction the unit rests on --
    that Mateo's/Marcos's view is "more convincing" BECAUSE he names a
    concrete figure (cuarenta euros al mes) while Laura/Elena only
    assert -- is a fair, single-answer reading of the two sources; (6)
    confirm "genial", "excelente(s)", "sólida", "convincente" carry no
    unwanted register mismatch inside an informal tú conversation
    between Elena and Mateo.
  notes: >-
    es's B2 synthesis unit, the course-culminating unit for en-es B2.
    Targets the CEFR B2 synthesis outcome
    (universal.b2.synthesis.summarize_and_evaluate_multiple_sources):
    summarize and evaluate multiple sources -- name where two sources
    agree, where they conflict, and give a reasoned judgement between
    them. Theme: one coherent everyday puzzle across all six lessons --
    two online reviews of a new gym (FitClub), one by Laura and one by
    Marcos, that AGREE the trainers are good but CONFLICT on the price,
    one of which is better supported. Lesson arc: L01 attributing a
    claim to a source (según / afirma / sostiene / señala que); L02
    comparing two sources side by side (ambas / mientras que / en cambio
    / a diferencia de); L03 naming AGREEMENT (coinciden en que / lo
    mismo / están de acuerdo en que); L04 naming CONFLICT (discrepan en
    / se contradicen / la discrepancia); L05 a reading of BOTH review
    texts side by side -- identify the agreement, the conflict point,
    and which review backs its price claim with a figure; L06 the
    culminating production -- an Elena/Mateo dialogue for the listening
    requirement (identify agreement, conflict, and whose view is better
    supported), a speaking synthesis, and a writing synthesis that NAMES
    all three parts (agreement + conflict + reasoned judgement).
    Register: informal tú throughout, per the es lane pin; Elena and
    Mateo continue their established informal register from
    b2_unit04_relato. All new synthesis vocabulary is introduced
    self-contained within this file, with recognition (teaching card)
    preceding any production use, before it is tested (B2 is a separate
    Course row from A1/A2/B1, so a B2 learner never sees lower-tier
    lexemes at runtime -- same self-containment precedent as es's
    earlier B2 units); some already course-taught words from units
    01-04 (según, aunque, en cambio, punto, acuerdo, razón, mejor, vale
    la pena, caro, barato, calidad, esperaba) are reused for recognition
    per docs/content/CLAUDE.md's cumulative-vocabulary rule. No
    sibling-direction file was consulted.

    Second-pass review 2026-10-19: 1 fix -- lesson05.exercise01-04
    (reading_comprehension): the two reviews were never shown in the
    exercise; added both, labelled 'Laura:' / 'Marcos:', as es
    prompt.target_blocks before the question. NATIVE FLAGS: 'el precio no
    es caro' (Laura's review, Elena's dialogue line) is common in speech
    but prescriptively a price is alto/bajo, not caro; 'la mensualidad
    cuesta cuarenta euros al mes' is redundant (mensualidad already means
    monthly fee). Both left as authored since audio and many items depend
    on them.

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    Informal tú throughout (es lane precedent). B2 synthesis layers the
    attributing, comparing, agreement/conflict and judgement toolkit onto
    that register -- según, afirma, sostiene, señala, ambas, mientras
    que, en cambio, a diferencia de, coinciden en que, están de acuerdo
    en que, discrepan en, se contradicen, más convincente, más sólida,
    en conjunto, al final -- while keeping everyday informal address (tú,
    creo que, pienso que). Elena and Mateo continue the informal tú they
    use with each other throughout the es lane.

