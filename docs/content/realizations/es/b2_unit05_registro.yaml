  notes: >-
    From-scratch generation, not adapted from a source. This is es's fifth
    B2 unit (register -- adapting formality to the audience), the first
    unit of the second half of the B2 course (units 05-08), authored as an
    independent, self-contained file alongside sibling units 06/07/08
    (never opened, per parallel-dispatch isolation). Mirrors nl's shipped
    B2 unit05 (register) as the assigned STRUCTURAL exemplar only (6
    lessons, 44 exercises, the same recognition->drag->production pacing
    and the same "same request in both registers" culminating device) --
    every sentence of actual Spanish text is freshly authored from
    first-principles Spanish grammar and idiom, not translated or calqued
    from the Dutch realization. Elena and Mateo continue as the
    established es characters (informal tú with each other, per es
    units 01-04 and the earlier A/B1 lane); this unit additionally
    introduces a second, formal-register voice -- an unnamed institutional
    contact (el ayuntamiento) -- addressed with usted, matching the
    exemplar's Lotte/Omar-plus-institution pattern. Elena's surname
    (García) is not invented here: it is the same surname already used
    for the character in es/a2_unit19_medico's patient record, reused for
    continuity rather than left unpinned. No sibling-direction file
    (es-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Spanish confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) the tú/usted verb shift -- confirm "tienes /
    tiene usted", "puedes / puede usted", "podría" (conditional of poder,
    formal softener) all read as natural and that usted correctly takes
    the same verb form as él/ella throughout; (2) "le" as the formal
    indirect-object pronoun for usted ("le escribo un mensaje" = I'm
    writing you, formal) -- confirm this reads as standard formal Spanish
    and not as a leísmo-specific regional marker that would sound odd in
    a neutral pan-Hispanic course; (3) the two full request frames --
    informal "¿Podemos cambiar la cita?" / "¿Puedes cambiar la cita?" and
    formal "¿Sería posible cambiar nuestra cita?" -- confirm both are
    idiomatic and that "cambiar la cita" (rather than "posponer" or
    "aplazar") is the everyday verb choice for rescheduling an
    appointment; (4) the closing ladder -- confirm "Un abrazo" (informal),
    "Querido" + name (neutral), "Atentamente" (formal), and "Le saluda
    atentamente" (most formal) are correctly ranked and that "Le saluda
    atentamente" reads as genuine, current formal correspondence rather
    than archaic; (5) "Estimado señor o señora" as the salutation for an
    unknown recipient -- confirm this (rather than the abbreviated
    "Estimado/a Sr./Sra.:" or a plural "Estimados señores") is the more
    natural spoken/written form for this course's register, and whether a
    colon after the salutation (as used in lesson05's formal reading) is
    correct pan-Hispanic convention; (6) confirm "por favor" genuinely
    does NOT change between tú and usted (lesson03 teaches this
    explicitly as a contrast point against languages that do split
    "please" by register) and that "¿Sería tan amable de hacerlo?" and
    "¿Sería posible + infinitive?" are both idiomatic, naturally
    distinguishable formal-politeness frames, not redundant with each
    other; (7) the culminating writing exercises (lesson06 exercise06 the
    informal->formal rewrite, and lesson06 exercise07 producing both
    registers) are graded against fixed strings -- confirm no natural
    correct answer (comma placement, an alternative but equally correct
    connector) falls outside the supplied accepted-answer variants.
  notes: >-
    Fifth Spanish B2 unit; first register unit. Targets the CEFR B2
    register outcome (universal.b2.register.adapt_formality_to_audience):
    adapt register to audience and purpose -- convey the same message
    appropriately to a friend, a colleague, and an institution, recognizing
    which forms are too casual or too stiff for a given setting. Theme:
    one everyday request -- rescheduling an appointment (la cita) --
    rendered both ways across all six lessons. Lesson arc: L01 the
    tú<->usted pronoun/verb shift (tú/te/tu vs usted/le/su; tienes ->
    tiene usted, puedes -> puede usted); L02 salutations and closings
    (Hola/Un abrazo vs Estimado señor o señora / Atentamente / Le saluda
    atentamente, with Querido as the neutral middle ground); L03
    directness -- informal question + imperative + por favor (a "please"
    that does NOT change by register, a deliberate contrast point) vs
    formal indirect podría / sería tan amable / sería posible; L04 the
    actual request (cambiar la cita) rendered informally and formally;
    L05 a reading requirement -- two messages, same content, different
    register, identify the audience of each; L06 the culminating
    production -- an Elena/Mateo dialogue for the listening requirement
    (judge whether the register fits the situation and what a mismatch
    would signal), a speaking task delivering the SAME request once to a
    friend and once to an institution, a writing task rewriting the
    informal message as a formal one, and a culminating writing task
    producing the request in BOTH registers. Register: this unit teaches
    both; Elena and Mateo supply the informal tú side (their established
    register from earlier es units), the institutional side (el
    ayuntamiento) is formal usted, addressed to an unnamed official. All
    vocabulary is introduced self-contained within this file (B2 is a
    separate Course row, so a B2 learner never sees A1/A2/B1 lexemes at
    runtime). No sibling-direction file was consulted.

course:
  realization_key: es.b2
  target_language_first: true
  dialect: es_neutral_pan_hispanic
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    informal tú register (the es lane default, per units 01-04) and the
    formal usted register, contrasting them. Each single exercise stays
    in one consistent register; the contrast is carried across exercise
    pairs and the culminating exercise. Informal: tú/te/tu, direct
    questions and the imperative, por favor. Formal: usted/le/su with the
    3rd-person-like verb (tiene usted, puede usted), podría, sería tan
    amable de, sería posible, Estimado señor o señora, Le saluda
    atentamente. Note: unlike some languages, Spanish "por favor" itself
    does NOT change between registers -- this unit teaches that
    explicitly rather than inventing a false split. Elena and Mateo keep
    the informal tú they use with each other throughout the es lane.

