          - {content_key: es.a1.unit15.lesson01.exercise02.choose_tan_como, type: multiple_choice, tested_text: "tan como", prompt: {target_blocks: [{text: "as...as", language_code: en, direction: ltr}]}}
          - content_key: es.a1.unit15.lesson01.exercise03.match_comparativos_vocab
            type: matching_pairs
            tested_text: "más menos tan como"
            prompt: {target_blocks: []}
            pairs: [{left: "más...que", right: "more...than"}, {left: "menos...que", right: "less...than"}, {left: "tan...como", right: "as...as"}, {left: "El apartamento nuevo es más grande que el viejo.", right: "The new apartment is bigger than the old one."}, {left: "El apartamento viejo es menos grande que el nuevo.", right: "The old apartment is less big than the new one."}, {left: "Mateo cocina tan bien como Elena.", right: "Mateo cooks as well as Elena."}]
          - {content_key: es.a1.unit15.lesson01.exercise04.order_mateo_cocina_tan_bien_como_elena, type: word_order, tested_text: "Mateo cocina tan bien como Elena", prompt: {target_blocks: []}, word_bank: [Mateo, cocina, tan, bien, como, Elena]}
          - {content_key: es.a1.unit15.lesson01.exercise05.translate_menos, type: translation, tested_text: "menos", prompt: {target_blocks: [{text: "less", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
