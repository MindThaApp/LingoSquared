          - {content_key: es.a1.unit15.lesson02.exercise06.write_own_comparison, type: writing_prompt, tested_text: "El apartamento nuevo es más grande que el viejo", prompt: {target_blocks: [{text: "Write in Spanish: the new apartment is bigger than the old one.", language_code: en, direction: ltr}]}}
