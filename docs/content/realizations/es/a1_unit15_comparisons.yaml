    planned_lesson_count: 6
    lessons:
      - content_key: es.a1.unit15.lesson01.mas_menos_tan_vocabulario
        title: "Más, menos, tan"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: es.a1.unit15.lesson01.teach.mas_que, kind: phrase, target: {text: "más...que", language_code: es, direction: ltr}, introduced_tokens: [más, que], example: {text: "El apartamento nuevo es más grande que el viejo.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit15.lesson01.teach.menos_que, kind: phrase, target: {text: "menos...que", language_code: es, direction: ltr}, introduced_tokens: [menos], example: {text: "El apartamento viejo es menos grande que el nuevo.", language_code: es, direction: ltr}}
          - {content_key: es.a1.unit15.lesson01.teach.tan_como, kind: phrase, target: {text: "tan...como", language_code: es, direction: ltr}, introduced_tokens: [tan, como, Mateo, cocina, bien, Elena], example: {text: "Mateo cocina tan bien como Elena.", language_code: es, direction: ltr}}
          - content_key: es.a1.unit15.lesson01.teach.mas_menos_tan_note
            kind: grammar_note
            target: {text: "*Más...que* (more...than) and *menos...que* (less...than) compare two DIFFERENT things or amounts. *Tan...como* (as...as) compares two EQUAL things -- a different construction, not just a synonym of *más/menos*.", language_code: en, direction: ltr}
            introduced_tokens: []
        exercises:
