          - {content_key: es.a1.unit15.lesson05.exercise07.write_comparacion_summary, type: writing_prompt, tested_text: "El apartamento nuevo es más grande que el viejo", prompt: {target_blocks: [{text: "Write one Spanish sentence comparing the two apartments: the new one is bigger than the old one.", language_code: en, direction: ltr}]}}

      - content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
        title: "Elena y Mateo comparan los apartamentos"
        spine_outcome_ids: [universal.a1.comparisons.make_basic_comparisons]
