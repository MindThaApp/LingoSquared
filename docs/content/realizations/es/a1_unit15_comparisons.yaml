  - content_key: es.a1.audio.dialogue.comparar_apartamentos.01
    language: es
    text: >-
      Elena: ¿Ya viste el apartamento nuevo?
      Mateo: Sí. Es más grande que el viejo, y la cocina también es más grande.
      Elena: ¿Cuál apartamento es más pequeño, entonces?
      Mateo: El viejo es más pequeño que el nuevo. Por eso quiero mudarme.
      Elena: Tiene mucho sentido. El nuevo tiene más espacio para cocinar.
      Mateo: Exacto. Y tú cocinas tan bien como yo, así que necesitamos espacio para los dos.
      Elena: ¡Es verdad! Y tú cocinas tan bien como yo.
      Mateo: Somos un buen equipo.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
