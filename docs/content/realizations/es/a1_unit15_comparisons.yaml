          - {content_key: es.a1.unit15.lesson03.exercise04.fill_el_nuevo_es_mas_grande, type: fill_in_blank, tested_text: "El nuevo es más grande que el viejo", prompt: {target_blocks: [{text: "El nuevo es más grande ___ el viejo. (than)", language_code: es, direction: ltr}]}}
