          - {content_key: es.a1.unit15.lesson02.exercise02.listen_el_nuevo_es_mas_grande, type: listen_select, tested_text: "El apartamento nuevo es más grande que el viejo", media_asset_key: es.a1.audio.comparaciones.mas_grande_que.01, prompt: {target_blocks: []}}
          - {content_key: es.a1.unit15.lesson02.exercise03.listen_el_viejo_es_mas_pequeno, type: listen_select, tested_text: "El apartamento viejo es más pequeño que el nuevo", media_asset_key: es.a1.audio.comparaciones.mas_pequeno_que.01, prompt: {target_blocks: []}}
          - {content_key: es.a1.unit15.lesson02.exercise04.order_el_nuevo_es_mas_grande, type: word_order, tested_text: "El apartamento nuevo es más grande que el viejo", prompt: {target_blocks: []}, word_bank: [El, apartamento, nuevo, es, más, grande, que, el, viejo]}
