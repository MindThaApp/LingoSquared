generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The core comparative grammar patterns (más...que / menos...que for
    comparison of inequality, tan...como for comparison of equality
    with adjectives) are scaffolded from the real, public-domain FSI
    Spanish Basic Course (Foreign Service Institute, 1961, US
    government work), Volume 3 (Units 31-45), grammar sections 43.21.1
    "Comparison of inequality" ("Tengo más tiempo que dinero," "Es más
    verde que azul") and 44.21.1 "Comparison of equality" ("Esta base
    no es tan moderna como la que visitamos ayer," "Ud. no vive tan
    lejos como yo") -- downloaded directly (firecrawl confirmed at
    0/1000 credits again this session via `firecrawl --status`, so
    this used the documented WebSearch + direct-download +
    `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%203/Fsi-SpanishBasicCourse-Volume3-StudentText.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. These are
    grammar-drill sections embedded within FSI's own Units 43 ("At the
    gas station") and 44 ("At the beach"), whose surrounding scenarios
    are unrelated to this unit's content -- only the grammar POINT
    itself (the más/menos...que and tan...como patterns) is reused, not
    any scenario, dialogue, or drill sentence, which are all freshly
    written for Elena and Mateo's own storyline (comparing Mateo's old
    and new apartment from unit14, and their relative cooking skill).
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Fifteenth Spanish A1 unit, continuing the Elena/Mateo cooking-
    workshop storyline directly from unit14's new-apartment listing.
    Realizes universal.a1.comparisons.make_basic_comparisons (no
    prerequisites per the spine). Authored fresh at schema_version 1.1
    per AUTHORING_GUIDE §19. tú register throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches the
    three comparative markers as isolated phrases (más...que, menos...
    que, tan...como) with concrete grande/pequeño examples (reusing
    unit14's adjectives); 02 teaches comparison of inequality applied
    to the two apartments (El apartamento nuevo es más grande que el
    viejo / El apartamento viejo es más pequeño que el nuevo); 03
    teaches the core question-and-answer pattern (¿Cuál apartamento es
    más grande? / El nuevo es más grande que el viejo); 04 teaches
    comparison of equality applied to their cooking (Mateo cocina tan
    bien como Elena); 05 is a reading comparing the two apartments in
    detail; 06 is a dialogue capstone where Elena and Mateo compare the
    apartments and end on the equal-footing note about their cooking.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    más/menos for true-synonym risk -- they are opposites (more vs.
    less), not synonyms, and every slot testing one is anchored by an
    already-stated comparison fact (which specific apartment/kitchen is
    bigger), never an open choice. §16: lesson01's matching_pairs uses
    all 3 comparative markers plus 5 example sentences (8 pairs). §12:
    multi-clause accepted_answers (lesson06's comparison summaries)
    have period/comma/conjunction-joined variants. No bare yes/no/
    true/false -- checked by hand.

    Internal consistency (§11): reuses unit14's established facts
    without contradiction -- the new apartment (two dormitorios, big
    kitchen) is consistently described as bigger/better-kitchened than
    the old one (small kitchen, the reason Mateo wanted to move in the
    first place) throughout every exercise and the dialogue. The
    cooking-skill comparison (tan bien como, "as well as") is
    deliberately an equality comparison, not inequality, avoiding any
    claim that either Elena or Mateo cooks better than the other --
    consistent with their established equal-partners dynamic since
    unit01.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked canon against units 13-14, token introduction,
    accepted-answer coverage (§12), matching_pairs confusability,
    distractor ambiguity, and learner-visible notes for internal
    unit/lesson references; overlay en-es/a1_unit15.yaml reviewed
    alongside. Fixes: lesson05.exercise05.match_comparacion -- lefts "El
    apartamento nuevo" and "El nuevo" were the same apartment with
    interchangeable rights (unanswerable) -> pairs now El apartamento
    viejo/tiene una cocina pequeña, El apartamento nuevo/tiene más
    espacio para cocinar, Mateo/quiere mudarse (tested_text updated;
    overlay correct_response + instruction mirrored);
    lesson06.teach.line07 and dialogue audio
    es.a1.audio.dialogue.comparar_apartamentos.01 (pending_generation,
    not yet recorded) -- "¡Es verdad! Mateo cocina tan bien como Elena,
    y Elena cocina tan bien como Mateo." (Elena talking about herself
    and her listener in the third person) -> "¡Es verdad! Y tú cocinas
    tan bien como yo." with introduced_tokens and overlay gloss/note
    updated; lesson05.teach.por_eso_note -- "already seen with *porque*
    in unit10" -> "you've already seen with *porque*". Overlay fixes:
    lesson05.exercise07.write_comparacion_summary accepts "El nuevo es
    más grande que el viejo."; lesson06.exercise06.respond_as_mateo adds
    comma-, ", y"- and "y"-joined forms; lesson02.exercise01 distractor
    "El apartamento viejo es más pequeño que el nuevo." (same meaning as
    the target) -> "El apartamento viejo es más grande que el nuevo.";
    course description drops "from unit14"; internal lessonNN/unitNN
    references removed from notes of
    lesson02.teach.el_nuevo_es_mas_grande/el_viejo_es_mas_pequeno,
    lesson03.teach.el_nuevo_es_mas_grande_reply,
    lesson04.teach.mateo_cocina_tan_bien_como_elena,
    lesson05.teach.comparacion_reading and lesson06.teach.line02-08.
    NATIVE FLAGS: lesson01.teach.menos_que example "El apartamento viejo
    es menos grande que el nuevo." is grammatical but unnatural
    (consider "tiene menos espacio que el nuevo"); "¿Cuál
    apartamento...?" is Latin American usage, marked in Spain
    (es_neutral_pan_hispanic -- confirm); line01 "¿Ya viste...?" and
    line05 "Tiene mucho sentido" lean Latin American, fitting Mateo but
    spoken by Spanish-born Elena; untaught instruction-language
    "Concluye"/"Explica"/"ustedes" in Spanish prompts. DEFERRED (owner
    decision): story-wide location canon (see unit13 notes).

