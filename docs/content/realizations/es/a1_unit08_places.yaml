generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    No FSI Spanish Basic Course unit directly covers "locating common
    places" as its own topic (Volume 1-3's units 1-35 were searched via
    the table of contents fetched this session -- the closest adjacent
    material is Unit 7 "Looking for an apartment," about housing, not
    general place-location vocabulary). Per AUTHORING_GUIDE §10, when no
    directly-usable public-domain source exists for a topic, established-
    conventions-only authoring is the honest fallback rather than
    stretching an unrelated source. This unit is authored from
    established beginner-Spanish teaching conventions (common civic
    vocabulary: banco, farmacia, parque, restaurante, biblioteca; the
    location prepositions cerca de, lejos de, al lado de, enfrente de,
    entre), the same category of authoring already used for de/a1_
    unit09_orte.yaml (this project's own recently-shipped German
    "places" unit, consulted only for its §19 schema-shape/pacing
    pattern as a different-language structural reference, not for any
    Spanish text or content -- no sibling-direction-isolation concern
    since German and Spanish are unrelated directions).
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Eighth Spanish A1 unit. Elena and Mateo's storyline continues:
    Mateo, newer to the neighborhood, asks Elena where common places
    are. Realizes universal.a1.places.locate_common_places (no
    prerequisites, per the spine). Authored fresh at schema_version 1.1
    per AUTHORING_GUIDE §19. tú register throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches 5
    common place nouns (el banco, la farmacia, el parque, el
    restaurante, la biblioteca); 02 teaches location prepositions
    (cerca de, lejos de, al lado de, enfrente de, entre) via short
    example sentences placing each of unit01's nouns relative to
    another; 03 teaches the core question-and-answer pattern (¿Dónde
    está...? / Está...); 04 teaches asking if somewhere is far (¿Está
    lejos?); 05 is a reading of a short neighborhood description; 06 is
    a dialogue capstone where Mateo asks Elena where several places are
    near the market from unit07.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    the preposition set (cerca de/lejos de/al lado de/enfrente de/
    entre) for true-synonym risk -- all five are genuinely distinct
    spatial relationships, not synonyms, and every fill_in_blank/
    production slot testing one is anchored by an already-stated
    location fact (e.g. the bank's actual position relative to the
    park, established once and reused consistently) rather than an open
    choice among the five. §16: lesson01's matching_pairs uses all 5
    place nouns plus 3 example sentences (8 pairs); lesson02's uses all
    5 prepositions plus their location sentences (10 pairs). §12: the
    one multi-clause accepted_answers list (lesson06's closing
    directions) has period/comma/conjunction-joined variants. No bare
    yes/no/true/false -- checked by hand.

    Internal consistency (§11): the neighborhood layout is fixed once
    in lesson02/05 and reused identically in lesson06's dialogue --
    banco next to (al lado de) the market, farmacia across from
    (enfrente de) the market, parque far from (lejos de) the market,
    biblioteca between (entre) the bank and the park, restaurante close
    to (cerca de) the market (the same restaurant from unit06's lunch,
    a deliberate continuity callback). No two facts contradict.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

