  - content_key: es.a1.audio.dialogue.lugares_del_barrio.01
    language: es
    text: >-
      Mateo: Elena, ¿dónde está el banco?
      Elena: Está al lado del mercado, donde compramos los huevos.
      Mateo: Ah, sí. ¿Y la farmacia?
      Elena: Está enfrente del mercado.
      Mateo: ¿Y el parque? ¿Está cerca?
      Elena: No, el parque está lejos. Pero la biblioteca está entre el banco y el parque.
      Mateo: Perfecto, gracias. Y el restaurante donde comimos, ¿está cerca de aquí?
      Elena: Sí, está muy cerca del mercado.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
  - {content_key: es.a1.audio.dialogue.lugares_del_barrio.biblioteca_entre.01, language: es, text: "La biblioteca está entre el banco y el parque.", voice_hint: neutral_young_adult, status: pending_generation}

