generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    The apartment-hunting scenario shape (two friends check newspaper
    listings for an available apartment to rent) and core vocabulary
    (alquilar, el apartamento, el edificio, desocupado) are scaffolded
    from the real, public-domain FSI Spanish Basic Course (Foreign
    Service Institute, 1961, US government work), Volume 1 (Units
    1-15), Unit 7 "White and Molina look for an apartment" (7.1 basic
    sentences: "Vamos a ver el periódico," "El señor desea alquilar un
    apartamento," "Por ahora sólo tengo dos desocupados") -- downloaded
    directly (firecrawl confirmed at 0/1000 credits again this session
    via `firecrawl --status`, so this used the documented WebSearch +
    direct-download + `pdftotext -layout` fallback) from
    https://fsi-languages.yojik.eu/languages/FSI/Spanish/Basic/Volume%201/Fsi-SpanishBasicCourse-Volume1-StudentText.pdf
    -- `pdfinfo` confirms Author: Foreign Service Institute. Room-level
    vocabulary (la cocina, el dormitorio, el baño, la sala) is not in
    the source (which stops at "an apartment is available," not room
    detail) and is established-conventions-only, needed for the
    describe_home spine outcome specifically. No sentence or drill item
    was copied verbatim -- every phrase below is freshly written for
    Elena and Mateo's own storyline (Mateo wants a bigger kitchen to
    practice cooking at home) and modernized register (no 1961
    rental-agency framing).
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Fourteenth Spanish A1 unit, continuing the Elena/Mateo cooking-
    workshop storyline after unit13's work conversation. Realizes
    universal.a1.housing.describe_home (no prerequisites per the
    spine). New scenario: Mateo's current apartment has a tiny kitchen,
    so after the workshop Elena helps him look through newspaper
    listings for a new apartment with a bigger one. Authored fresh at
    schema_version 1.1 per AUTHORING_GUIDE §19. tú register throughout.

    Six lessons, recognition->drag->production (§2): 01 teaches 5 room
    nouns (el apartamento, la cocina, el dormitorio, el baño, la sala);
    02 teaches housing-search vocabulary (alquilar, el edificio,
    desocupado, grande/pequeño); 03 teaches the core question-and-
    answer pattern (¿Cuántos dormitorios tiene? / Tiene dos dormitorios
    y una cocina grande); 04 is a phrase lesson stating Mateo's actual
    need (Quiero alquilar un apartamento con una cocina grande); 05 is
    a reading of a short newspaper-style apartment listing; 06 is a
    dialogue capstone where Elena and Mateo look through listings
    together and find one with a big kitchen.

    §13: every fill_in_blank keeps surrounding context. §17: checked
    grande/pequeño for true-synonym risk -- they are opposites (big vs.
    small), not synonyms, and every slot testing one is anchored by an
    already-stated fact (which specific apartment/kitchen is being
    described), never an open choice. §16: lesson01's matching_pairs
    uses all 5 room nouns plus 3 example sentences (8 pairs). §12:
    multi-clause accepted_answers (lesson06's listing-description
    sentences) have period/comma/conjunction-joined variants. No bare
    yes/no/true/false -- checked by hand.

    Internal consistency (§11): a grammar note explicitly disambiguates
    *la cocina* (the kitchen, a room) from the already-established
    *cocina*/*cocinar* (cooking/to cook, the workshop's own name) so
    the two senses don't read as contradictory or confusing --
    context (a room noun with an article vs. a bare activity noun)
    distinguishes them, the same ambiguity a real English word like
    "cook" would have if reused as a room name, which it isn't, so
    this is flagged explicitly rather than left implicit. The
    apartment listing's room counts (two bedrooms, one bathroom, one
    big kitchen) are consistent between lesson05's reading and
    lesson06's dialogue -- the same listing is referenced in both.
    Never contradicts any established fact about Elena/Mateo.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets declared for generation, not yet recorded.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked canon against units 01-13, token introduction,
    accepted-answer coverage (§12), matching_pairs, orthography, and
    learner-visible notes for internal unit/lesson references; overlay
    en-es/a1_unit14.yaml reviewed alongside. Fixes:
    lesson05.teach.anuncio_reading -- "un baño, una sala, y una cocina
    grande" -> "un baño, una sala y una cocina grande" (no comma before
    y in a simple Spanish list); lesson05.exercise05.match_anuncio --
    pairs were a gender puzzle (dos/un/una -> nouns, plus a non-quantity
    "una cocina"->"grande") -> now meaning matches: dos dormitorios/two
    bedrooms, un baño/one bathroom, una sala/a living room, una cocina
    grande/a big kitchen (overlay correct_response + instruction "Match
    each part of the listing to its meaning." mirrored). Overlay fixes:
    lesson06.teach.line07 note falsely claimed agencia came from unit07
    -> rewritten; lesson05.exercise07.write_anuncio_summary adds "El
    apartamento tiene dos dormitorios, una cocina grande y un baño."
    (plus serial-comma variant) and lists the no-serial-comma form
    first; internal lessonNN/unitNN references removed from notes of
    lesson03.teach.tiene_dos_dormitorios_y_una_cocina_grande,
    lesson04.teach.quiero_alquilar_un_apartamento_con_una_cocina_grande,
    lesson05.teach.anuncio_reading and
    lesson06.teach.line01/03/04/05/06/08. NATIVE FLAGS: "desocupado" is
    fine but "disponible" is more common in listings; Spanish
    instruction prompts use untaught "Explica"/"suena" (English
    instruction carries the meaning); lesson06.exercise08
    speak_confirm_perfect does not accept "¡Es perfecto!" (minor,
    "Perfecto." is accepted). DEFERRED (owner decision): story-wide
    location canon (where Mateo lives/rents vs. unit03's workshop "aquí
    en España").

    Second-pass review 2026-10-19: 2 fixes (realization) --
    lesson05.exercise01-04 (read_donde_esta_el_edificio,
    read_cuantos_dormitorios, read_como_es_la_cocina,
    read_para_quien_es_perfecto): listing text added to
    prompt.target_blocks (learner never saw the ad being asked
    about); lesson01.teach.cocina_ambiguity_note: false rule "la
    cocina with an article names the room" (la cocina also means
    cuisine/cooking) -> context-based explanation (taller de cocina
    = cooking; la cocina of a home = the room; cocinar = to cook).

