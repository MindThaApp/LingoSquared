  human_reviewed: false
  source_note: >-
    `firecrawl --status` checked before authoring (per standing instruction
    to try real source material first) and confirmed 0/1,000 credits left
    this billing cycle, same as every hi A2 unit before it -- no FSI/Peace
    Corps Hindi source has ever been recoverable as usable text across any
    of the 25 prior hi units (every attempt reached only OCR-unreadable
    scans), so `firecrawl search` was not attempted given the confirmed-
    empty quota. This is hi's first B1 unit, and per the standing
    established-conventions-only fallback, every sentence below is this
    session's own fresh authoring of Modern Standard Hindi grammar --
    nothing adapted, translated, or copied from any external source.
review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Hi's first B1 unit (spine outcome:
    universal.b1.necessity.express_obligation_with_subjunctive, confirmed
    by direct read of universal_spine.yaml lines 1006-1031: can_do, all
    four modalities, and all four assessment_requirements -- read in full
    before designing this unit's exercises). Continues directly from hi's
    A2 course (Priya/Arjun remain the throughline; Arjun just got the job
    offered in a2_unit25, so this unit's workplace-obligation scenario is
    a direct, natural continuation of that storyline, still on तुम terms).

    Central B1 grammar decision (this unit's whole reason for existing):
    चाहिए itself is invariant, but the INFINITIVE immediately before it
    agrees in gender/number with the logical direct object of a transitive
    verb (करना/करनी/करने) -- a rule hi's own A2 unit23 explicitly
    DEFERRED by design (that unit's own grammar note states verbatim: "यह
    यूनिट सिर्फ़ पुल्लिंग 'करना' रूप को अभ्यास में इस्तेमाल करती है, ताकि
    एक बार में एक ही नया नियम सिखाया जाए" -- confirmed by direct grep of
    hi/a2_unit23_doctor.yaml before writing this note). This unit picks up
    exactly that deferred rule: lesson01 teaches all three agreement forms
    (करना masc sg, करनी fem sg/pl, करने masc pl) against रिपोर्ट (fem)/
    रिपोर्टें (fem pl)/काम (masc, invariant sg/pl) as the three test nouns.
    Lesson02 adds the second half of the spine outcome -- past regret about
    an unfulfilled obligation via चाहिए था/थी (था/थी itself ALSO agrees
    with the same complement, e.g. "...पूरी करनी चाहिए थी", genuine added
    complexity layered onto lesson01's rule, not a separate one) and
    negation for prohibition (नहीं placed before the infinitive: "...नहीं
    जाना चाहिए"). Lesson03 applies both in a Priya/Arjun workplace dialogue
    (Priya's report deadline, Arjun's own missed-call regret) plus a short
    reading passage and review.

    Confirmed by a fresh grep of every hi realization file for 'चाहिए था'/
    'चाहिए थी' before writing: zero hits anywhere in the corpus -- the
    past-regret construction is genuinely new to hi, not previously taught
    under a different label. सकना/सकता is NOT used anywhere in this file
    (reserved for the planned b1_unit02 abilities unit, kept out here to
    keep this unit's new-grammar budget to exactly the चाहिए paradigm).

    Per this task's standing tokenizer-fragmentation discipline: this file
    is fully SELF-CONTAINED (every token any exercise's tested_text or
    word_bank uses is declared via this file's OWN introduced_tokens,
    including basic words like मुझे/यह/ये/नहीं/कल that a real learner
    already knows from A1/A2 -- not assumed carried over from another
    file, matching fa/prs/ro's own B1-unit precedent for a fresh CEFR-level
    jump). Verified by running the compiler's own tokenize() regex against
    every planned literal surface form in a standalone check before writing
    any exercise -- Devanagari matras fragment badly under that regex
    (confirmed: जानी/जाने both fragment to identical {'ज','न'}; करनी/करने
    both fragment to identical {'करन'}; सकता/सकती/सकते would all fragment
    identically) but this is harmless as long as the EXACT literal string
    used in tested_text/word_bank is separately declared in
    introduced_tokens somewhere in this file, which it always is here --
    never relied on one form's declaration silently covering a different
    form via fragment-set collision.

    `Dialogue`/`reading`-kind teaching cards' own `target` text and exercise
    `prompt.target_blocks` are NOT checked by validate_untaught_vocabulary
    (confirmed by re-reading that function directly, matching a2_unit25's
    own documented finding) -- lesson03's dialogue and reading passage use
    a couple of richer words (क्लाइंट, फ़ोन) freely without a separate
    introduced_tokens declaration, since neither string is ever used as an
    exercise's own tested_text.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    structurally inapplicable, same as every prior hi unit -- hi dialogue
    content carries no media_asset_key (plain TextBlocks), and this unit's
    two listen_select exercises are each a single standalone utterance with
    its own dedicated media_asset_key, not pulled from the dialogue clip.

    Cross-check of every concrete fact stated across the unit (AUTHORING_
    GUIDE §11): exactly two facts are stated and never contradicted --
    (1) Priya's report is due tonight (आज रात तक), stated in lesson03's
    dialogue line01 and the reading passage's own restatement ("आज रिपोर्ट
    पूरी हो गई"); (2) Arjun should have called a client yesterday but
    forgot, stated once in dialogue line02 and never repeated elsewhere
    with a conflicting detail.

    fill_in_blank ambiguity check (§17): lesson01's blank (करना, frame
    "मुझे यह काम ___ चाहिए।") -- यह काम is masculine singular by this
    file's own established gender assignment, and करनी (fem) / करने (pl)
    are grammatically excluded by that same agreement rule the lesson
    exists to teach, so the frame disambiguates by grammar alone, not a
    true-synonym collision. lesson02's blank (थी, frame "मुझे कल यह
    रिपोर्ट पूरी करनी चाहिए ___।") -- थी is required by रिपोर्ट (fem);
    था is grammatically excluded the same way; unambiguous.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    This unit is NOT yet native-speaker or fresh-context reviewed --
    status left honestly as unreviewed, matching this course's own
    standing convention for freshly authored content pending that
    separate pass.

