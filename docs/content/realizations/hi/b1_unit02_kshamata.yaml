review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Hi's second B1 unit (spine outcome:
    universal.b1.abilities.express_ability_with_embedded_clause, confirmed
    by direct read of universal_spine.yaml lines 954-980; prerequisite
    universal.a2.bureaucracy.register_with_authorities is hi's own
    a2_unit20_panjikaran, confirmed satisfied). Continues Priya/Arjun on
    तुम terms; scenario is Priya's passport renewal, needing a form filled
    at an office -- a direct thematic continuation of unit20's
    registration/bureaucracy content and unit01's workplace-obligation
    throughline (Arjun offering to help again, this time with ability
    rather than necessity).

    Central B1 grammar decision: सकना (can/be able to) was first taught in
    hi's own a2_unit25 (interview), but DELIBERATELY scope-narrowed there
    to masculine singular सकता only (that file's own review notes state
    this explicitly and confirm सकती/सकते appear only once, in a dialogue
    PROMPT never used as tested_text, so never actually exercised live).
    This unit picks up exactly that deferred scope: lesson01 teaches the
    full सकता/सकती/सकते present-ability paradigm (masc./fem./plural
    agreement with the subject, not the object -- unlike unit01's चाहिए
    agreement, which is object-agreement; this is a genuinely different
    agreement axis, flagged directly in this unit's own grammar notes so
    a learner doesn't conflate the two). Lesson02 adds past/hypothetical
    ability (सकता था/सकती थी -- could have/was able to) contrasted with
    present. Lesson03 adds the outcome's other half, a genuine embedded-
    clause construction: "हो सकता है कि... सकूँ" (it's possible that I
    can/may...), which requires the true Hindi subjunctive form सकूँ
    (1st person) inside a कि-clause -- scope-narrowed to सकूँ only (the
    3rd person subjunctive सके appears once in the reading passage, never
    as tested_text, matching this course's own established "exposure
    without testing" precedent for untaught inflections, e.g. unit25's own
    सकते-in-dialogue-only handling).

    Confirmed by a fresh grep of every hi realization file for 'सकती'/
    'सकते'/'सकूँ'/'हो सकता है' before writing: zero hits anywhere in the
    corpus outside a2_unit25's single untested सकते exposure -- this
    unit's paradigm expansion is genuinely new, not relabeled A2 content.
    चाहिए is NOT used anywhere in this file (kept out to isolate this
    unit's own grammar budget from unit01's, per this course's
    one-central-decision-per-unit discipline).

    Tokenizer-fragmentation discipline: this file is self-contained
    (introduced_tokens declared fresh in THIS file for every literal used
    in tested_text/word_bank -- not assumed carried over from
    b1_unit01_zaroorat.yaml or any A2 file, matching that file's own
    precedent). Verified सकता/सकती/सकते all fragment to the identical
    {'सकत'} under the compiler's tokenize() regex, and जा/आ (bare stems)
    fragment to trivial single-character tokens -- harmless because every
    exact literal string used in an exercise is separately declared here,
    never relying on fragment-set collision to cover a different form.
    Confirmed the `taught` vocabulary set accumulates across the WHOLE
    file (all three lessons), not reset per lesson (re-read
    validate_untaught_vocabulary directly to confirm) -- so lesson03 freely
    reuses सकता/है/हूँ/जा/आ already declared in lesson01/02 without
    redeclaring them, and only genuinely new lesson03 tokens (हो, कि,
    सकूँ, अकेले, शाम) get fresh introduced_tokens entries.

    Dialogue/reading-kind teaching cards' own target text is NOT checked by
    validate_untaught_vocabulary (only tested_text/word_bank are) --
    lesson03's dialogue and reading passage freely use a few richer words
    (पक्का, अभी, फिर से, कह, दूँगा) that are never used as any exercise's
    own tested_text, so no separate declaration is needed for them.

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit (no media_asset_key on dialogue content; the three
    listen_select exercises are each single standalone utterances with
    their own dedicated media_asset_key).

    Cross-check of every concrete fact stated (AUTHORING_GUIDE §11):
    exactly two facts, restated but never contradicted -- (1) Priya's
    passport-office errand is tomorrow (कल), stated in lesson03's dialogue
    line01 and consistent with lesson02's own "मैं कल आ सकता था" framing
    (a different day, Arjun's own separate missed opportunity, not in
    conflict); (2) Arjun isn't yet sure he can join, stated in dialogue
    line02 and the reading passage's own consistent restatement ("वह अभी
    पक्का नहीं कह सकता").

    fill_in_blank ambiguity check (§17): lesson01's blank (सकती, frame
    "प्रिया यह फ़ॉर्म भर ___ है।") -- प्रिया is feminine singular by this
    file's own established gender; सकता (masc.) and सकते (plural) are
    grammatically excluded by subject-agreement, unambiguous. lesson02's
    blank (सकती, frame "प्रिया वहाँ जा ___ थी।") -- same subject, same
    exclusion, unambiguous.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/b1_unit02.yaml. No realization edits
    needed; all fixes landed in the overlay (see its notes). Native-
    speaker check needed: none beyond the standing pass.

