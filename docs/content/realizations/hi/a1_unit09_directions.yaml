            type: word_order
            tested_text: "बैंक दाएँ है"
            prompt: {target_blocks: []}
            word_bank: ["है", "बैंक", "दाएँ"]
          - content_key: hi.a1.unit09.lesson01.exercise09.fill_bank_daaen_muro
            type: fill_in_blank
            tested_text: "दाएँ"
            prompt:
              target_blocks:
                - {text: "बैंक दाएँ है। ___ मुड़ो।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit09.lesson01.exercise10.fill_yahan_se_seedhe
            type: fill_in_blank
            tested_text: "सीधे"
            prompt:
              target_blocks:
                - {text: "स्कूल कहाँ है? यहाँ से ___ जाओ।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit09.lesson01.exercise11.reply_bank_kahan_hai
            type: dialogue_response
            tested_text: "यहाँ से सीधे जाओ"
            prompt:
              target_blocks:
