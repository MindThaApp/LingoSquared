            prompt: {target_blocks: []}
            pairs:
              - {left: "बैंक", right: "bank"}
              - {left: "स्कूल", right: "school"}
              - {left: "अस्पताल", right: "hospital"}
              - {left: "पार्क", right: "park"}
              - {left: "स्टेशन", right: "station"}
              - {left: "डाकघर", right: "post office"}
              - {left: "सीधे", right: "straight ahead"}
              - {left: "बाएँ", right: "left"}
              - {left: "दाएँ", right: "right"}
              - {left: "जाओ", right: "go!"}
              - {left: "मुड़ो", right: "turn!"}
          - content_key: hi.a1.unit09.lesson01.exercise07.order_yahan_se_seedhe_jao
            type: word_order
            tested_text: "यहाँ से सीधे जाओ"
            prompt: {target_blocks: []}
            word_bank: ["सीधे", "यहाँ", "जाओ", "से"]
