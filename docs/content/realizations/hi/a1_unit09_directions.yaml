          - {content_key: hi.a1.unit09.lesson01.exercise13.dictation_baaen_muro, type: dictation, tested_text: "बाएँ मुड़ो", media_asset_key: hi.a1.audio.directions.baaen_muro.01, prompt: {target_blocks: []}}
      - content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
        title: "कैसे जाऊँ?"
        spine_outcome_id: universal.a1.directions.ask_follow_basic_directions
        teaching:
