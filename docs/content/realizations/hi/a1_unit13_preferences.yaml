    and ask about basic likes, dislikes, wants, and choices"), whose own
    `prerequisites:` list is empty (line 418) -- no gating dependency to
    verify. Cross-checked against on-disk precedent per this task's explicit
    instruction: `ls docs/content/realizations/nl/`, `pl/`, and `ro/` all
    independently confirm a1_unit13_preferences.yaml as their own thirteenth
    unit, matching hi's own unit01-12 sequence, which has independently
    tracked the same topic order as those three languages throughout. Sized
    to 3 lessons matching unit01-12's bootstrap pace. Topic/pacing structure
    only (recognition-first, minimal new grammar surface, dialogue in
    lesson03) informed at a purely structural level by this session's own
    established hi conventions, not by opening any nl/pl/ro file's actual
    text -- every Hindi sentence below is authored fresh.

    Source access, re-attempted per this task's explicit instruction (not
    assumed to fail the same way as every prior hi unit): a fresh
    `firecrawl search` (no query cache reused from any prior session) failed
    outright with the same HTTP 402 (payment/quota) error every prior hi
    unit this session has hit -- quota still has not reset, fully disclosed
    rather than silently skipped. Fell back to the same FSI "Hindi: An
    Active Introduction" archive.org item (`Fsi-Hindi-AnActiveIntroduction`),
    re-downloaded fresh into this session's own isolated scratchpad (a fresh
    Claude session cannot reuse a prior session's scratch files). A fresh
    regex scan (Python, not eyeballed) of the Internet Archive's own OCR
    pass (`Fsi-HindiActiveIntroduction-StudentText_djvu.txt`, 94KB,
    re-downloaded this session) for the Devanagari Unicode block
    (U+0900-U+097F) returned ZERO matches anywhere in the document --
    confirmed programmatically, consistent with unit12's own documented
    "twelfth" confirmation of this exact same zero-Devanagari-match result;
    this unit's own fresh scan is the thirteenth such confirmation in
    sequence. A dedicated grep of the OCR file for this unit's own topic
    (like/dislike/want/prefer) found only incidental English commentary
    about honorific naming conventions and greeting-phrase regional
    preference ("Different greetings are preferred by people of different
    religious and regional backgrounds", "Most Hindu women prefer to be
    known by their first name") -- no grammar explanation of an actual
    Hindi liking/preference construction, and every Hindi-script line
    anywhere near those hits is pure OCR mojibake ("TFtf ^tf^ I", "SPHTiT^T
    I"), confirmed by eye to be garbage, not readable
    Devanagari-as-Latin-transliteration, matching the exact failure mode
    confirmed twelve times over across units 01-12, now a thirteenth time.
    Per this task's explicit instruction, nothing from either extraction
    attempt -- neither any mojibake fragment nor any wording of the
    recovered English framing prose -- was used, cleaned up, transcribed,
    or guessed at anywhere in this file. Every Devanagari string below is
    this session's own careful, correct rendering of established Modern
    Standard Hindi, verified character-by-character (codepoint hex dump
    run directly against every new word before finalizing, see the
    nasalization discipline paragraph below).

    Central grammar decision #1: "पसंद है/हैं" (pasand hai/hain, "is/are
    liked", i.e. "I like...") is introduced as a direct, disclosed
    extension of the ALREADY-established दातिव-subject construction
    मुझे/तुम्हें ... है (already taught via मुझे...चाहिए, unit06/07's "I
    want/need", and मुझे काम है, unit11's "I have work") -- same मुझे/तुम्हें
    dative-subject logic, now applied to a new predicate noun पसंद
    ("liking/favorite") instead of चाहिए ("want/need") or काम है ("have
    work"). A dedicated grammar_note (lesson01.teach.pasand_hai_grammar)
    explicitly distinguishes पसंद से चाहिए: चाहिए (unit06) is itself already
    gender-invariant and takes NO है after it ("इसके बाद 'है' नहीं आता",
    unit06's own disclosed rule); पसंद, by contrast, is a noun that
    REQUIRES a है/हैं copula after it, disclosed here as the one genuinely
    new structural fact this unit adds to the दातिव-subject family.

    Central grammar decision #2: the है/हैं choice after पसंद agrees with
    the NUMBER of the liked thing (not the speaker's gender, and not the
    liked thing's gender either) -- a direct, disclosed extension of the
    already-established है/हैं number-agreement pattern from unit02's
    "मेरे पास एक किताब है" (singular) / "मेरे पास छह किताबें हैं" (plural).
    Demonstrated with चाय/संगीत (singular, है) against किताबें (plural,
    हैं) -- lesson01.teach.number_agreement_grammar states this explicitly
    and cross-references unit02 by name. This deliberately avoids
    introducing any NEW grammar concept: it is the same है/हैं fact the
    course already taught, now shown to apply beyond simple possession.

    Central grammar decision #3: "X ज़्यादा पसंद है" ("X is liked more",
    i.e. "I prefer X") is introduced as a minor lexical extension, not a
    new grammar point -- ज़्यादा ("more") is simply placed before the
    already-taught पसंद है, no new sentence structure. This is how the
    spine's "choices" requirement is met without introducing कौन सा/सी
    ("which") or a से-based comparative ("X से ज़्यादा", "more than X"),
    both of which are deliberately deferred to unit14 (comparisons, the
    very next spine outcome, which exists specifically to teach comparison
    grammar) -- this unit only teaches EXPRESSING a preference between two
    options already both named in the same या-joined question
    (लेसन02's "तुम्हें चाय पसंद है या कॉफ़ी?"), not comparing them
    grammatically.

    Central grammar decision #4: choice/either-or questions reuse या
    ("or"), already taught in unit06/07 (there for ordering food/goods,
    e.g. unit06 lesson02's "चाय या कॉफ़ी" word_bank) -- lesson02's
    "तुम्हें चाय पसंद है या कॉफ़ी?" is a direct, disclosed extension of that
    same word into the "likes" domain, no new grammar.

    Central grammar decision #5, a genuine dual usage disclosed: तुम्हें
    (already taught unit06 as "to you", used there only with चाहिए, e.g.
    "तुम्हें चाय चाहिए?") is now also paired with पसंद है ("तुम्हें संगीत
    पसंद है?") -- the same दातिव pronoun, a new predicate, not a new word
    or a new grammatical fact about तुम्हें itself (it was already
    established as a general दातिव-subject marker, not चाहिए-specific);
    flagged here per the standing "cross-check every usage, not just
    mechanically-enforced tokens" discipline even though this is a
    straightforward extension rather than a surprising dual meaning like
    से or क्या in earlier units.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    performed explicitly. All three listen_select exercises (lesson01.
    exercise04, lesson02.exercise03, lesson03.exercise05) are each a
    single standalone, non-dialogue utterance with no other speaker/other
    lines in the same clip -- this bug class structurally cannot occur
    here, matching unit09-12's own precedent, now applied a fifth time.
    The two dialogue_comprehension exercises in lesson03 (exercise01/02)
    are TEXT reading-comprehension (the learner reads the actual dialogue
    line, no audio/`media_asset_key` involved), matching unit08-12's own
    dialogue_comprehension pattern -- each shown `target_blocks` line was
    deliberately chosen to directly contain its own correct answer
    (exercise01 shows line02 "हाँ, मुझे संगीत बहुत पसंद है। तुम्हें?" and
    asks what Priya likes, answer directly stated; exercise02 shows line04
    "अच्छा! मुझे यह खेल पसंद नहीं है। मुझे किताबें पसंद हैं।" and asks what
    Priya likes instead of the game, answer directly stated) -- neither
    requires inference across lines the learner isn't shown, and neither
    distractor option is itself a fact stated anywhere in the shown line.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11), not just within the dialogue: lesson03's
    dialogue establishes, in order: Priya likes music a lot; Arjun also
    likes music and likes sports/games; Priya does NOT like this
    particular game, but likes books; Priya prefers tea over coffee when
    asked to choose; Arjun also likes tea. Priya's closing written note
    (lesson03's reading card) restates exactly these same facts (likes
    music a lot, likes books, doesn't like this game, prefers tea) with no
    added or conflicting claim -- deliberately does NOT state she dislikes
    coffee outright (the dialogue only established a PREFERENCE for tea
    over coffee when choosing between the two, not a stated dislike of
    coffee), so the note's wording was kept to "मुझे चाय ज़्यादा पसंद है"
    rather than adding an unsupported "कॉफ़ी नहीं" clause. No exercise
    anywhere in lesson01-03 states a conflicting account of any of these
    facts.

    Nasalization/spelling discipline, disclosed per unit07-12 precedent,
    verified this round via a direct Python codepoint hex dump of every
    NEW word before finalizing (not eyeballed): पसंद (U+092A U+0938
    U+0902 U+0926) and संगीत (U+0938 U+0902 U+0917 U+0940 U+0924) both use
    anusvara U+0902 (a homorganic nasal before a following stop consonant
    द/ग) -- correct, matches the already-established anusvara convention
    (हैं/मुझे/तुम्हें), NOT chandrabindu, which this unit's reused हाँ
    (U+0939 U+093E U+0901) correctly keeps unchanged from its own
    already-settled spelling. किताबें's plural ending (U+0947 U+0902,
    "-ें") is likewise anusvara, the correct standard spelling for a
    consonant-final feminine noun's direct plural (किताब -> किताबें,
    parallel to बात -> बातें) -- distinct from the chandrabindु plural
    pattern used by ी-final feminine nouns (लड़की -> लड़कियाँ, not used in
    this unit, noted here only to disclose the distinction was actually
    considered, not assumed). ज़्यादा correctly uses nuqta-marked ज़
    (U+091C + U+093C), matching this course's established loanword
    convention already used for बाज़ार/फ़िल्म. No new nasalization DECISION
    was actually needed this unit -- every new nasalized form followed an
    already-settled rule, applied to new words.

    Untaught-vocabulary validator footgun (already documented by
    unit07-12, re-confirmed live during this unit's authoring, and
    directly re-read from `scripts/compile_content.py`'s
    `validate_untaught_vocabulary` before relying on it): the function
    only checks each exercise's own `tested_text` against the accumulated
    `introduced_tokens` set for the file so far (all teaching cards in a
    lesson are added to `taught` before that lesson's own exercises are
    checked; the set is NOT reset per lesson within one file, but IS
    reset per file). Every token that appears in ANY tested_text below --
    including reused grammar words from earlier units (मुझे, है, हैं,
    नहीं, हाँ, तुम्हें, यह, या, चाय, कॉफ़ी) -- was re-added to THIS file's
    own introduced_tokens before its first tested_text use (मुझे, है,
    हाँ, नहीं declared via lesson01's mujhe_review/pasand_hai_grammar/
    haan_nahi_review cards; हैं via lesson01.teach.number_agreement_
    grammar; तुम्हें/यह/या via lesson02's own review cards). Words used
    ONLY in dialogue/reading-note TEXT and never in a tested_text
    (प्रिया, अर्जुन, बहुत, भी, और, अच्छा, ठीक, कल, फिर, मिलते) were
    deliberately left OUT of introduced_tokens, confirmed by grep of
    every tested_text/word_bank/fill-blank value before finalizing --
    exactly the same treatment unit12 gave बहुत (reused in dialogue only,
    never re-declared since never tested).

    Word-order duplicate-token check (unit10-12's own standing
    consideration, re-confirmed clean here): every `word_order` exercise
    in this unit uses a word_bank with zero repeated tokens (checked by
    hand against each exercise's own word_bank array below).

    fill_in_blank ambiguity check (AUTHORING_GUIDE §17): every blank in
    this unit either has a unique, unambiguous grammatical answer (है vs.
    हैं number agreement, where only one of the two is grammatically
    correct for the given subject) or tests recall of a specific pronoun/
    connector word (तुम्हें, या) where no other already-taught word could
    plausibly fill the same syntactic slot in that exact frame. A
    considered-and-rejected design: blanking ज़्यादा in a frame like
    "मुझे यह खेल ___ पसंद है" was dropped because बहुत ("a lot", already
    taught unit06) would ALSO fit that exact slot grammatically and
    change the meaning only subtly ("I like this sport more" vs. "I like
    this sport a lot") with nothing in the bare frame to disambiguate
    which is being tested -- a real instance of the synonym-adjacent
    ambiguity §17 warns against, avoided by never blanking ज़्यादा at all
    (it is only tested via multiple_choice/word_order/dialogue_response/
    speak_response, never fill_in_blank).

