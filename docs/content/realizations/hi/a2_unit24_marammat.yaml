review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Fifth Hindi A2 unit (spine outcome:
    universal.a2.housing.report_maintenance_problem, confirmed by direct
    read of universal_spine.yaml lines 785-808: can_do, all four
    modalities, and all four assessment_requirements -- understand_
    problem_description/report_household_problem/read_maintenance_notice/
    write_problem_report -- read in full before designing this unit's
    exercises). Continues directly from hi/a2_unit23_doctor.yaml (same
    Priya/Arjun characters, still on तुम terms with each other). Introduces
    hi's fourth A2 stranger character, मकान मालिक (landlord), in आप
    register, matching the established formal-official convention already
    used for unit20's क्लर्क/unit22's कर्मचारी/unit23's डॉक्टर.

    Scenario: something breaks at Arjun's home (the fan, and later also
    the tap); he reports it to his landlord and asks when it will be
    fixed, gets a repair timing, and a written maintenance notice
    confirms it -- directly serving all four assessment_requirements
    (listening: understand the reported problem + timing; speaking:
    describe the problem and ask about repair timing; reading: interpret
    a maintenance notice; writing: report a household problem).

    Central A2 grammar decision (this unit's whole reason for existing):
    the simple future tense via '-गा/-गी/-गे' suffixed onto होना (है/हैं's
    own future form) -- genuinely new grammar, never introduced anywhere
    in this course before (confirmed by a fresh grep of every hi
    realization file for 'होगा'/'होगी'/'होंगे' before writing this note --
    zero hits anywhere in the corpus). Deliberately scope-narrowed to
    exactly ONE live-tested form, होगा (masculine singular, matching
    पंखा/नल/'यह' as the subject every exercise uses) -- lesson02's own
    grammar note discloses होगी/होंगे exist for feminine/plural subjects
    but never exercises them live, matching this course's own standing
    scope-narrowing discipline (unit20's ने-ergative masculine-only
    scope, unit23's चाहिए masculine-only scope). होगी IS used once,
    passively, in lesson03's own maintenance-notice reading card ("पंखे
    की मरम्मत कल होगी") -- reading-card target text is not checked by the
    compiler's untaught-vocabulary validator (confirmed by re-reading
    that function directly, see the tokenizer paragraph below), so this
    is safe exposure-only, consistent with how unit20/22/23 exposed
    ने-agreement variants passively without testing them.

    Secondary grammar note (not a new construction, just an explicit
    disclosure): खराब ("broken/not working") is an INVARIANT adjective --
    unlike बड़ा/बड़ी or छोटा/छोटी (unit18), it never changes form
    regardless of the noun's gender. Flagged explicitly in lesson01's own
    grammar note specifically because this course has spent multiple
    units training learners to expect adjectives to gender-agree, so an
    adjective that deliberately does NOT was judged worth calling out
    rather than leaving as a silent exception.

    Vocabulary reuse audited before writing (grep-confirmed): समस्या/क्या
    (unit23), ठीक (unit13/18/23), कब (unit23), कल (unit03/04/12), यह
    (widely established, e.g. unit18), भी (unit17/23), है/हैं (unit01
    onward) are all real prior vocabulary, confirmed by grep before use
    and re-declared in THIS file's own introduced_tokens per the standing
    per-file-reset tokenizer discipline (see the tokenizer-fragmentation
    paragraph below). New words this unit: पंखा (fan), खराब (broken/not
    working), मकान मालिक (landlord, two-word compound), नल (tap/faucet),
    होगा (future copula, masculine), मरम्मत (repair, noun, feminine),
    सूचना (notice, noun).

    Tokenizer-fragmentation discipline (per this task's explicit
    instruction, and unit20-23's own established precedent): every
    literal surface form tested anywhere in this file's exercises
    (tested_text or word_bank) has its own explicit `introduced_tokens`
    declaration earlier in the SAME file -- verified this round by
    actually running the compiler's own `tokenize()` regex
    (`[\w‌]+`) against every planned new word in a standalone Python
    check before writing any exercise, not assumed clean by eye. Several
    of this unit's new words fragment badly under that regex (e.g. मकान
    -> two separate fragments, मालिक -> three, होगा -> two, मरम्मत -> two)
    -- this is harmless AS LONG AS the exact same literal string is
    declared via introduced_tokens as appears in the exercise's own
    tested_text (fragment-set comparison is symmetric: tokenizing an
    identical substring in isolation vs. embedded in a larger
    space-separated sentence produces the same fragments either way,
    confirmed by direct check), which is the discipline followed
    throughout. `Reading`/`dialogue`-kind teaching cards' own `target`
    text and exercise `prompt.target_blocks` are NOT checked by the
    compiler's `validate_untaught_vocabulary` (only `tested_text`/
    `word_bank` are, confirmed by re-reading that function directly) --
    so the lesson03 reading cards and every dialogue line below use
    richer, more natural vocabulary (कोई बात नहीं, बहुत अच्छा, अगले दिन,
    बात की) freely, without needing separate introduced_tokens
    declarations, since none of those specific strings is ever used as
    an exercise's own tested_text.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    performed explicitly, structurally inapplicable the same way it was
    in unit20-23 -- hi dialogue content carries NO `media_asset_key` at
    all (plain TextBlocks), so lesson03's two dialogue_comprehension
    exercises cannot trigger this bug class by construction. The three
    listen_select exercises (lesson01.exercise04, lesson02.exercise04,
    lesson03.exercise06) are each a single standalone, non-dialogue
    utterance with its own dedicated media_asset_key and no other
    speaker/other lines in the same clip -- structurally cannot trigger
    this bug class either.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): this unit establishes exactly two facts,
    restated (never contradicted) across the dialogue, the reading cards,
    and the exercises: (1) the fan (पंखा) is broken -- stated in lesson01,
    the lesson03 dialogue line03, and both reading cards; (2) the repair
    will happen tomorrow (कल) -- stated in lesson02, the lesson03 dialogue
    line04, and both reading cards. lesson03's dialogue additionally has
    Arjun mention the tap (नल) is ALSO broken (word_order/speak_response
    review material only, drawn from lesson02's own vocabulary) -- this
    is never contradicted anywhere (no exercise or card claims the tap
    is fine).

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    fill_in_blank ambiguity check (§17): lesson01's exercise09 blank
    (खराब, frame "पंखा ___ है।") is grammatically compatible with several
    OTHER already-corpus-wide adjectives (बड़ा, छोटा, नया, अच्छा would all
    grammatically fit the bare frame), so this is disambiguated via the
    overlay's explicit English instruction naming the intended meaning
    ("Complete: The fan is broken."), matching this course's own
    established §17 precedent for open-vocabulary slots (unit17/18's
    own convention) rather than `interchangeable: true`, since these are
    not true synonyms of खराब. lesson02's exercise09 blank (होगा, frame
    "कल ठीक ___।") has a genuine two-way ambiguity WITHIN this unit's own
    vocabulary -- "कल ठीक है" (tomorrow works/is fine, present tense) is
    an equally grammatical, semantically DIFFERENT but plausible
    completion using this file's own already-declared है -- disambiguated
    the same way, via an explicit English instruction naming the future
    reading ("Complete: It will be fixed tomorrow.").

    This unit is NOT yet native-speaker or fresh-context reviewed --
    status left honestly as unreviewed, matching this course's own
    convention for freshly authored content pending that separate pass.

