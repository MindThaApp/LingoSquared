review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Hi's fourteenth B1 unit (spine outcome:
    universal.b1.sequencing.describe_events_with_time_clauses, confirmed
    by direct read of universal_spine.yaml: can_do text "describe when
    one event happens relative to another using a time-clause
    construction ('when X happens, Y happens/happened'), across everyday
    routines and past narratives, distinguishing a habitual/present time
    clause from a past one", all four modalities, and all four
    assessment_requirements read in full before designing this unit).

    DUPLICATION CHECK against hi/b1_unit06_kahani.yaml (mandatory,
    done before writing): unit06 already teaches "जब [background action
    in past continuous, -रहा था/-रही थी], तब [main past event]" --
    e.g. "jab main shaam ko ghar ja rahi thi, tab main Arjun se mili"
    (while I was going home, I met Arjun). That is a background-
    interruption pattern, NOT the same construction as this outcome's own
    two required registers: (a) a HABITUAL/PRESENT time clause with two
    simple habitual actions ("jab main daftar pahunchta hoon, to main
    sabse pehle email dekhta hoon" -- when I arrive at the office, I
    check email first) and (b) a PAST time clause with two completed,
    SEQUENTIAL perfective events, not one continuous background action
    interrupted by another ("jab Arjun ne report bheji, to manager khush
    hua" -- when Arjun sent the report, the manager was happy). Neither
    lesson01 nor lesson02 here reuses unit06's "-रहा था/-रही थी +
    तब" shape or any of its sentences; lesson03's reading passage
    explicitly contrasts the habitual and past registers side by side,
    directly matching the outcome's own "distinguishing a habitual/
    present time clause from a past one" wording -- a requirement unit06
    (a single past-narrative unit) never had reason to address.

    Ergative/agreement care (known defect class 1): lesson02's "जब अर्जुन
    ने रिपोर्ट भेजी, तो मैनेजर खुश हुआ" -- ergative अर्जुन ने + perfective
    भेजी correctly agrees with the direct object रिपोर्ट (feminine), NOT
    with अर्जुन (masc.); "खुश हुआ" is intransitive (होना), agreeing with
    मैनेजर (masc.), no ergative involved there. Lesson03's reading
    passage "उसने पहले अपना फ़ोन देखा" -- उसने + देखा agrees with the
    object फ़ोन (masc.), and reflexive अपना also agrees with फ़ोन (masc.),
    not with the subject अर्जुन (who happens to also be masc. here, so
    this line alone doesn't test the fem.-subject/masc.-object contrast,
    but lesson02's रिपोर्ट(fem. object)/अर्जुन(masc. subject) pairing
    does).

    Continues Priya/Arjun directly, तुम-register throughout (grepped
    every speaker: line in docs/content/realizations/hi/b1_unit0*.yaml
    and b1_unit1[0-3] before writing). New, ordinary detail: a manager
    who reviews Arjun's reports (consistent with unit05's established
    "अर्जुन...एक प्रोजेक्ट की टीम का काम देखता है" office-report context;
    no new character with dialogue, "मैनेजर" is a background referent
    only, same treatment as unit08's "दुकानदार").

    matching_pairs pools: 6 pairs each lesson, all lefts checked by hand
    for mutual distinctness. Word-order word_bank duplicate-token check
    done by hand for every word_order exercise below -- zero repeats.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed per dispatch instructions.

