  notes: 'Drafted by drafting tool A. Grammar: reporting in the present with कहता / कहती है कि, पूछता / पूछती है कि (question word or क्या), बताता / बताती है कि, and the request X को बताओ कि ...; person shift (मैं → वह, मुझे → उसे, मेरा → उसका / उसकी, तुम stays तुम when speaking to the addressee); the reporting verb agrees with the speaker (man / woman). Present tense reporting only (no past reports). Priya, Arjun and Neha use tum. OPEN NATIVE QUESTIONS: (1) is ''वह पूछता है कि क्या तुम आज आओगी'' natural for a yes/no report, or is ''वह पूछता है कि तुम आज आओगी या नहीं'' better; (2) is कहता है कि / बताता है कि interchangeable at this level (typed answers accept both for ''says''); (3) is ''उसे बताओ कि मैं ऑफ़िस में हूँ'' the right way to ask a friend to pass on a message.'
