  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Same source-access situation as hi/a2_unit20_panjikaran.yaml and
    hi/a2_unit21_raay.yaml, authored the same session: `firecrawl --status`
    confirmed 0/1,000 credits, no search attempted given that.
    Established-conventions-only fallback, matching every prior hi unit's
    own precedent. Every sentence below is this session's own fresh
    authoring of established Modern Standard Hindi.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Third Hindi A2 unit (spine outcome:
    universal.a2.banking.open_bank_account, confirmed by direct read of
    universal_spine.yaml lines 735-758). Continues directly from
    hi/a2_unit20_panjikaran.yaml/hi/a2_unit21_raay.yaml -- same Priya/
    Arjun characters, and reuses unit20's Aadhaar-center storyline beat
    (Arjun now needs a bank account at his new address) rather than
    inventing an unrelated scenario. Introduces a second A2 stranger
    character (कर्मचारी, a bank employee) in आप register, same convention
    as unit20's क्लर्क.

    Applies the same up-front token-declaration discipline learned while
    authoring unit20 (see that file's own review notes for the full
    tokenizer-fragment-matching root cause): every literal surface form
    tested anywhere in this file's exercises has its own `introduced_
    tokens` declaration earlier in the same file, including words already
    taught in A1 (बैंक, दस्तावेज़, हाँ, बहुत, अच्छा, खुश, था, अर्जुन) or
    earlier in this same A2 arc (अपना, फ़ॉर्म, भरा, आपको, आपने) -- the
    tokenizer resets per file, so cross-file "already taught" status
    doesn't carry over mechanically and every surface form needs its own
    local declaration regardless of real prior exposure.

    Central A2 grammar decision: reinforces and EXTENDS unit20's
    ने-ergative past tense with a genuinely new nuance -- NUMBER
    agreement, not just gender. Unit20 only ever exercised masculine-
    SINGULAR objects (फ़ॉर्म, आधार कार्ड, पता). This unit adds a
    masculine-PLURAL object: "क्या आपने दस्तावेज़ लाए?" (दस्तावेज़ treated
    as plural here) contrasts directly against "क्या आपने पहचान पत्र
    लाया?" (सिंगुलर) within the same lesson (lesson02's own grammar note
    makes this contrast explicit) -- disclosed, not left implicit, per
    this guide's own standing scope-narrowing discipline (same approach
    unit19 used for ठंडा/ठंडी, unit20 for अपना/अपनी/अपने).

    Vocabulary reuse audited before writing (grep-confirmed): बैंक
    (unit08), चाहिए (unit06), अपना/अपनी/अपने + ने-ergative singular +
    फ़ॉर्म/भरना/भरा/आपको/आपने/हाँ/धन्यवाद-adjacent pattern (unit20 itself,
    same A2 arc), बहुत/अच्छा (unit06/09), खुश (unit01), था (unit12),
    अर्जुन/प्रिया (recurring characters). New this unit: खाता (account),
    खोलना/खोला (to open, transitive -- new verb pair reinforcing the
    ne-ergative pattern with a fresh verb rather than reusing unit20's
    भरना/लाना/बदलना), पैसे (money), पहचान पत्र (ID proof, a new compound
    noun distinct from unit20's आधार कार्ड/दस्तावेज़, giving this unit its
    own concrete document besides the reused generic दस्तावेज़), कर्मचारी
    (employee). उसका/उसे (3rd-person oblique pronouns) again deliberately
    avoided in the lesson03 reading card, same reasoning as unit20/21 --
    repeats "अर्जुन का"/"अर्जुन" by name instead.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    fill_in_blank ambiguity check (§17): lesson01's exercise08 blank
    (खोलना, frame "मुझे अपना खाता ___ है।") has no other lesson01
    infinitive verb that could plausibly fill the same slot (केवल खोलना
    "to open" fits an account meaningfully) -- unambiguous by frame alone.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with en-hi/a2_unit22.yaml. Fixes: the unit's central
    number-agreement contrast was built on लाना + ने ("क्या आपने
    दस्तावेज़ लाए?" vs "क्या आपने पहचान पत्र लाया?"), which is
    ungrammatical (लाना never takes ने; with आप the verb is always लाए,
    so the "singular" grammar_check answer was itself wrong). Rebuilt on
    भरना: "मैंने एक फ़ॉर्म भरा" vs "मैंने दो फ़ॉर्म भरे" (new phrase
    card, grammar_ne_plural, audio asset renamed
    hi.a2.audio.banking.maine_do_form_bhare.01, lesson02 exercise03
    listen, exercise04 pairs, exercise07 fill = भरे, exercise08 fix =
    मैंने दो फ़ॉर्म भरा -> भरे); लाना kept without ने ("क्या आप पहचान
    पत्र/दस्तावेज़ लाए?", "हाँ, मैं ... लाया") in the phrase card, haan
    example, lesson02 exercise06/09, dialogue line03/04, reading card,
    lesson03 exercise02/04/05 prompts and grammar summary. Exercise
    content_keys kept unchanged for stability (some still carry the old
    laaye/laaya names). The authoring notes above describing the लाना
    contrast are superseded. Native-speaker check needed: the rebuilt
    lesson02 (naturalness of "मैंने दो फ़ॉर्म भरे" in a bank context)
    and the लाना rewrites.

    Second-pass review 2026-10-19: 0 fixes.

    Second-pass follow-up 2026-10-19: speak prompts no longer print the Hindi answer (3 items); variants added: none needed.

