    Third Hindi unit, continuing directly from hi/a1_unit02_numbers.yaml
    (same Priya/Arjun characters, same yoga-class setting, same aap/tum
    register split, same feminine-noun possessive-agreement teaching
    thread now extended to a new feminine noun, तारीख़). Spine outcome
    confirmed via universal_spine.yaml: hi/a1_unit02 realized
    universal.a1.numbers.use_basic_numbers, and
    universal.a1.dates.exchange_calendar_dates lists that exact outcome
    as its only prerequisite -- confirmed against actual on-disk
    precedent from every other launched language's own unit03
    (nl/a1_unit03_dates.yaml, pl/a1_unit03_dates.yaml,
    ro/a1_unit03_dates.yaml all realize this exact outcome as their
    third unit, matching hi's own greetings-then-numbers-then-dates
    sequence; es/a1_unit03_family.yaml and fa/a1_unit03_numbers.yaml are
    both older units predating this project's now-settled
    numbers-then-dates convention, following an older unit ordering, not
    a counter-example). Sized to 3 lessons matching unit01/02's
    bootstrap pace -- topic/pacing structure only (days, then months
    plus asking the date, then a scheduling-and-birthday dialogue),
    no text or phrasing reused from any other language's file, per the
    standing skeleton-share-not-text-share policy.

    Source access, re-attempted per this task's explicit instruction
    (not just assumed to fail the same way as unit01/unit02): re-used
    the same FSI "Hindi: An Active Introduction" PDF already downloaded
    for units 01/02 (scratch copy at .../scratchpad/hi/fsi_hindi.pdf)
    and re-ran both extraction paths specifically against this unit's
    own topic. (1) `pdftotext -layout` against the raw PDF again
    returned a near-empty file (143 bytes total across all 143 pages,
    byte-for-byte identical to the unit01/unit02 result) -- confirms
    this is genuinely a pure page-image scan with no embedded text
    layer at all, not something that varies by section. (2) A fresh
    grep of the same Internet Archive OCR pass (`ocr.txt`, the ABBYY
    FineReader 9.0 output already recovered for unit01/02) specifically
    for date/calendar/weekday English framing prose found real hits
    confirming the OCR pass DID correctly transcribe the surrounding
    instructional text for this exact section: "It's Tuesday.", "And
    what date?", "Write the current date on the blackboard.", "Dates:
    these expressions are used:", "on Sunday", "Thursdays", "last
    week"/"last month". But a full-document regex scan of the same
    94KB OCR file for the Devanagari Unicode block (U+0900-U+097F)
    returns ZERO matches anywhere -- including at the exact lines
    identified above, where the Hindi half of each example survives
    only as unusable Latin-lookalike mojibake (e.g. the "It's
    Tuesday." line renders as "*T T^T I 1 It's Tuesday.", the "Dates:
    these expressions are used:" line is followed by "*rr# q^ft sifter
    spt" with no recoverable Devanagari at all). Identical failure mode
    to units 01/02, now confirmed a third time against this unit's own
    specific topic rather than assumed. Per this task's explicit
    instruction, nothing from either extraction attempt was used,
    cleaned up, or guessed at anywhere in this file -- every Devanagari
    string below is this session's own careful, correct rendering from
    established Modern Standard Hindi, verified character-by-character
    (including the anusvara-vs-chandrabindu convention: chandrabindu
    (ँ) after non-ascending vowel signs, anusvara (ं) after ascending
    vowel signs as in नहीं/मैं/हैं/में -- this unit's own new
    vocabulary happens to need no new nasalization marks beyond हैं,
    already established in unit01), never OCR output, never
    machine-translated.

    Two real calendar dates are stated together with a weekday in this
    file (lesson03's "अगली क्लास मंगलवार, दस मार्च को है" -- "the next
    class is Tuesday, March 10th"), so per the standing calendar-fact
    lesson from nl/a1_unit03's own review history, the weekday/date
    pairing was independently verified with Python's date library
    before writing it: `datetime.date(2026, 3, 10).strftime('%A')`
    returns "Tuesday" -- genuinely calendar-true for the same 2026
    course-canon year nl/a1_unit03 already established, not an
    invented pairing. No other sentence in this file combines a
    specific weekday with a specific date/month, so no other fact
    needed this check.

    A genuine, disclosed content-design choice: Hindi dates are
    normally stated with a cardinal number plus तारीख़/the month name
    (आज तीन तारीख़ है, आज तीन जनवरी है), NOT with an ordinal
    construction the way English ("the third") or Dutch (de derde)
    are -- so unlike nl/a1_unit03's 31-card ordinal-number teaching
    block, this unit does not teach Hindi ordinals for dates at all.
    That is not a gap or a simplification of real Hindi grammar; it is
    the real, natural way an ordinary date is spoken and written in
    Hindi. Numbers 1-31 beyond what unit02 already taught (0-10, 11,
    12, 15, 20, 30, 50, 100) are not separately introduced here either
    -- this unit reuses only तीन and दस (both re-taught within this
    file per the standing per-file vocabulary rule) since those are
    the only two numbers this unit's own dates/examples actually need.

course:
  realization_key: hi.a1
  target_language_first: true
  dialect: hi_standard
  register_policy: >-
    Continues unit01/02's aap/tum split exactly. Extends the running
    feminine-noun possessive-agreement thread (इसकी कीमत, आपकी/तुम्हारी
    उम्र from unit02) to a new feminine noun, तारीख़ (date) -- आज
    कितनी तारीख़ है? uses the feminine question word कितनी, never the
    masculine कितना, called out explicitly on the relevant teaching
    card and drilled via a grammar_check exercise. दिन (day) and
    जन्मदिन (birthday) are both masculine, and क्लास (class, an
    English loanword) is treated as feminine per its common everyday
    usage (अगली क्लास, not अगला क्लास) -- also called out explicitly
    rather than left as an unexplained variant spelling. Priya and
    Arjun, already on तुम terms from unit01/02's dialogues, continue in
    that register for this unit's own closing dialogue.

