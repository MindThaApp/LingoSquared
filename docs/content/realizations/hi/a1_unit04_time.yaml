review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fourth Hindi unit, continuing directly from hi/a1_unit03_dates.yaml
    (same Priya/Arjun characters, same yoga-class setting, same aap/tum
    register split). Spine outcome confirmed via universal_spine.yaml:
    hi/a1_unit03 realized universal.a1.dates.exchange_calendar_dates,
    and universal.a1.time.ask_tell_time is the next A1 outcome in spine
    order -- confirmed against actual on-disk precedent from every other
    launched language's own unit04 (nl/a1_unit04_time.yaml,
    pl/a1_unit04_time.yaml, ro/a1_unit04_time.yaml all realize this
    exact outcome as their fourth unit, matching hi's own
    greetings-then-numbers-then-dates-then-time sequence; es/a1_unit03
    is "family" and fa/a1_unit04 is "family" -- both older units
    predating this project's now-settled numbers-then-dates-then-time
    convention, not counter-examples). Sized to 3 lessons matching
    unit01/02/03's bootstrap pace -- topic/pacing structure only (asking
    and telling the hour, then parts of the day plus a scheduled event,
    then a dialogue confirming the next class's day and time), no text
    or phrasing reused from any other language's file, per the standing
    skeleton-share-not-text-share policy.

    Source access, re-attempted per this task's explicit instruction
    (not just assumed to fail the same way as units 01-03): re-used the
    same FSI "Hindi: An Active Introduction" PDF already downloaded for
    the earlier units (scratch copy at .../scratchpad/hi/fsi_hindi.pdf)
    and re-ran both extraction paths specifically against this unit's
    own topic. (1) `pdftotext -layout` against the raw PDF again
    returned a near-empty file (143 bytes total across all 143 pages,
    byte-for-byte identical to every earlier unit's result) -- confirms
    yet again this is a pure page-image scan with no embedded text
    layer at all. (2) A fresh grep of the same Internet Archive OCR pass
    (`ocr.txt`, the ABBYY FineReader 9.0 output already recovered for
    units 01-03) specifically for time/clock English framing prose
    found real hits confirming the OCR pass DID correctly transcribe
    the surrounding instructional text for this exact section: "At what
    time do you get up?", "I arrive at school at nine o'clock", "We
    come back at one o'clock.", "The half-hours are expressed this
    way:", "For the time being, avoid the question, \"What time is
    it?\"", "What time is it: now?". But a full-document regex scan of
    the same 94KB OCR file for the Devanagari Unicode block
    (U+0900-U+097F) again returns ZERO matches anywhere -- including at
    the exact lines identified above, where the Hindi half of each
    example is either simply blank (nothing followed "At what time do
    you get up?" at all) or survives only as unusable Latin-lookalike
    mojibake (e.g. the line after "For the time being..." renders as
    "! 5R OrFT | ? What time is it: now?", and the half-hour example
    renders as "^tts rffa sr^r" with no recoverable Devanagari at all).
    Identical failure mode to units 01-03, now confirmed a fourth time
    against this unit's own specific topic rather than assumed. Per
    this task's explicit instruction, nothing from either extraction
    attempt was used, cleaned up, or guessed at anywhere in this file --
    every Devanagari string below is this session's own careful,
    correct rendering from established Modern Standard Hindi, verified
    character-by-character (including the anusvara-vs-chandrabindu
    convention: chandrabindu (ँ) after non-ascending vowel signs as in
    पाँच, already established in unit02; anusvara (ं) after ascending
    vowel signs as in नहीं/हैं, already established in units 01/03 --
    this unit's own new vocabulary needs no NEW nasalization-mark
    decisions, only reuse of already-settled spellings).

    Two genuine, disclosed grammar-teaching decisions: (1) Hindi marks
    "one o'clock" with the singular masculine बजा (एक बजा है) but every
    other hour with the plural बजे (दो बजे हैं, बारह बजे हैं) -- a real,
    load-bearing agreement exception, not a simplification, so it is
    taught explicitly on its own grammar_note card and drilled via a
    dedicated grammar_check exercise rather than glossed over. (2) A
    specific hour combines directly with a time-of-day word with no
    postposition (सुबह सात बजे, "at 7 in the morning"), while the same
    time-of-day word used generally without a specific hour takes को
    (दोपहर को, "in the afternoon", रात को, "at night") -- both are
    genuine, natural constructions in real spoken/written Hindi, not an
    invented rule, and each is taught on its own grammar_note card
    rather than presented as one blanket pattern.

    A genuine, disclosed lexical note: कल means both "tomorrow" and
    "yesterday" in Hindi, disambiguated by context/tense rather than
    having two separate words the way English does -- flagged honestly
    on its own teaching card's overlay note rather than silently taught
    as "tomorrow" only.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/a1_unit04.yaml. Fixes:
    lesson03.exercise07 match_questions_and_answers -- removed two
    interchangeable pairs, added two unambiguous earlier-unit Q/A pairs
    (birthday, name), tested_text synced with overlay. No Hindi text
    errors found. Native-speaker check needed: none beyond the overlay's
    notes.

