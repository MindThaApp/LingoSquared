    postpositions are register-neutral in Hindi). Priya and Arjun,
    already on तुम terms from earlier units, continue in that register
    for this unit's own closing dialogue. The एक बजा/बाकी बजे agreement
    exception and the बजे-vs-को postposition choice (see
    generation_provenance above) are both called out explicitly on
    dedicated grammar_note cards and drilled via grammar_check
    exercises, matching the explicit-callout convention every earlier
    unit's own agreement points (feminine तारीख़/कीमत/उम्र, feminine
    क्लास) already established.

