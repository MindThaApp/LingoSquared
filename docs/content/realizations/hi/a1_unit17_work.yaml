    Central grammar decision #1: occupation identity via "मैं + occupation
    + हूँ" ("I am a/an [occupation]"), a trivial, already-established
    extension of the copula (मैं...हूँ, taught since unit01) to a new noun
    category. Disclosed explicitly on lesson01's own teach.
    grammar_occupation_gender card: occupation nouns divide into two
    classes -- शिक्षक/शिक्षिका ("teacher") agree with the SPEAKER's own
    gender, the exact same discipline already taught for verb forms in
    unit10's -ता/-ती rule (उठता/उठती, etc.) and unit01's कोई-गender
    adjectives, now applied to a noun instead of a verb; डॉक्टर/इंजीनियर
    ("doctor"/"engineer") are gender-invariant loanwords, identical in
    either speaker's mouth. No new case or conjugation is introduced by
    this decision -- it is a vocabulary-class distinction layered onto
    already-known grammar.

    Central grammar decision #2: "[जगह] में काम करता/करती हूँ" ("I work
    at/in [place]"), disclosed on lesson02's own teach.grammar_workplace
    card as a direct combination of three already-established pieces: में
    ("in", unit01's "लंदन में रहता हूँ"), काम ("work", unit10/11), and
    करना's already-taught -ता/-ती/-ते present-tense agreement rule (first
    disclosed unit10 via नाश्ता करता/करती हूँ, and independently
    precedented even earlier in unit01's own "क्या तुम योग करती हो?").
    No new grammar is introduced -- this unit is the first to combine all
    three into one sentence, which is disclosed as combination, not
    invention.

    Central grammar decision #3 (addressee-gender disambiguation
    technique, reused explicitly from unit10's own precedent): every
    exercise that blanks a करते/करती (or similarly gender-agreeing) slot
    is anchored to a NAMED, already-established-gender character (अर्जुन
    = male, प्रिया = female, both confirmed via unit10's own dialogue
    where Priya's verbs take -ती and Arjun's take -ता) rather than left
    as a bare "तुम" question with no addressee named -- e.g. lesson01.
    exercise10's "अर्जुन, तुम क्या काम ___ हो?" (करते) and lesson02.
    exercise10's "प्रिया, तुम कहाँ काम ___ हो?" (करती). This directly
    reuses unit10's own established name-anchoring convention (its own
    dialogue used "प्रिया, तुम रोज़ कितने बजे उठती हो?" /
    "मैं...उठता हूँ" address-by-name pattern) rather than inventing a
    new disambiguation mechanism -- see the fill_in_blank ambiguity
    paragraph below for the full accounting of every blanked slot in this
    unit, both this name-anchored kind and the open-vocabulary-slot kind
    (disambiguated by the accompanying English translation cue, the
    established unit06/unit15/unit16 convention).

    Central grammar decision #4, a deliberate scope-narrowing, disclosed
    (matching unit16's own explicit precedent for this discipline): this
    unit teaches केवल three occupations (शिक्षक/शिक्षिका, डॉक्टर,
    इंजीनियर) and three workplaces (स्कूल, अस्पताल, दफ़्तर), each mapped
    1:1 to a single occupation (teacher-school, doctor-hospital,
    engineer-office) for scenario coherence, not a broader occupation
    vocabulary set. दुकानदार ("shopkeeper") and अन्य occupation words were
    considered and deliberately left out to keep the unit's real
    vocabulary load comparable to unit16's own two-symptom/three-advice
    scope. This unit's own scope fully satisfies the spine outcome's own
    can_do ("State a basic occupation, workplace, and simple work
    activity") without needing a larger occupation-vocabulary set; a
    broader occupations unit remains available as a clean future topic.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    performed explicitly, and structurally inapplicable here the same way
    it was in unit16 -- hi dialogue content carries NO `media_asset_key`
