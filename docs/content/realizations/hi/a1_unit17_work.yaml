    deliberately, for maximum safety: Priya's established gender AND an
    explicit English cue naming the female form ("Complete: Priya is a
    teacher (female form)."), specifically because शिक्षक/शिक्षिका are a
    true near-synonym gender pair (the exact failure class named in §17's
