    line05 "मैं इंजीनियर हूँ। मैं दफ़्तर में काम करता हूँ।" and asks
    Arjun's job, answer directly stated), neither requiring inference
    across unseen lines. The three listen_select exercises (lesson01.
    exercise04, lesson02.exercise04, lesson03.exercise06) are each a
    single standalone, non-dialogue utterance with its own dedicated
    media_asset_key and no other speaker/other lines in the same clip --
    structurally cannot trigger this bug class either, matching unit08-16's
