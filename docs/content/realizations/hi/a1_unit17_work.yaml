    disambiguated by "Complete: I am an engineer.") and lesson02.
    exercise09's "मैं ___ में काम करती हूँ।" blank (अस्पताल, candidates
    स्कूल/अस्पताल/दफ़्तर all frame-compatible in isolation, disambiguated
    by "Complete: I work at the hospital."); or (b) a गender-agreement
    slot (करते/करती) anchored to a NAMED character whose gender is already
    an established course fact, per central grammar decision #3 above --
    lesson01.exercise10's "अर्जुन, तुम क्या काम ___ हो?" (करते, Arjun
    established male) and lesson02.exercise10's "प्रिया, तुम कहाँ काम
    ___ हो?" (करती, Priya established female). lesson03.exercise10's
