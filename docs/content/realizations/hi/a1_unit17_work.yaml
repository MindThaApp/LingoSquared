    Nasalization/spelling discipline, disclosed per unit07-16 precedent,
    verified this round via a direct Python codepoint hex dump of every
    NEW word before finalizing (not eyeballed): शिक्षक (U+0936 U+093F
    U+0915 U+094D U+0937 U+0915, zero nasalization), शिक्षिका (U+0936
    U+093F U+0915 U+094D U+0937 U+093F U+0915 U+093E, zero nasalization),
    दफ़्तर (U+0926 U+092B U+093C U+094D U+0924 U+0930, zero nasalization,
    nuqta-फ़ matching the exact same combining-nuqta codepoint pair
    U+092B U+093C already used course-wide for फ़ोन in unit02 -- verified
    by a direct comparison hex dump against that existing word, not
    assumed). UNLIKE unit16 (which had zero nasalization decisions to
    make), this unit's third new word genuinely does carry a
    nasalization mark, and the choice was verified deliberately, not
    defaulted: इंजीनियर (U+0907 U+0902 U+091C U+0940 U+0928 U+093F U+092F
    U+0930) uses ANUSVARA (U+0902), not chandrabindu (U+0901) -- correct
    per standard Modern Standard Hindi orthography, since the nasal here
    precedes an oral stop (ज) within the same syllable-cluster, the
    anusvara-before-consonant pattern already established course-wide by
    words like अंग्रेज़ी-class loanwords, and structurally distinct from
    this course's own chandrabindu uses (हूँ, नहीं, हाँ), which are all
    nasalized VOWELS at a word-final/open-syllable position with no
    following consonant. करते/करती/करता (U+0915 U+0930 U+0924 U+0947 /
    U+0940 / U+093E) carry zero nasalization, regular verb-stem
    inflections of the already-known करना.

    Untaught-vocabulary validator footgun (already documented by
