    precedent for dialogue-only/example-only/prompt-only words -- confirmed
    by grep of every tested_text/word_bank value below before finalizing.

    Word-order duplicate-token check (unit10-16's own standing
    consideration, re-confirmed clean here): every `word_order` exercise
