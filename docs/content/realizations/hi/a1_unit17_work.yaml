    fill_in_blank ambiguity check (AUTHORING_GUIDE §17): every blank in
    this unit is either (a) a genuinely open vocabulary slot disambiguated
    by the English instruction's own explicit translation, matching the
    established convention already used throughout this course (unit06's
    पानी/चाय-style blanks, unit15/16's translation-cued blanks) --
    lesson01.exercise09's "मैं ___ हूँ।" blank (इंजीनियर, candidates
