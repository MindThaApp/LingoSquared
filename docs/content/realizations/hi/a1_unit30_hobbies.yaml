  register_policy: 'Teach Modern Standard Hindi (Khari Boli, the Delhi-based standard taught nationally and used in media/education) as spoken across India. Hindi marks a real three-way address distinction -- आप (aap, formal/respectful), तुम (tum, informal/familiar), and तू (tu, intimate -- reserved for very close family, God, or as a genuine insult depending on tone). This introductory unit teaches only आप and तुम, the two forms a learner actually needs day to day; तू is deliberately out of scope, the same discipline the es and pl bootstrap units applied to their own most-marked/least-u seful register forms (vos/vosotros, vy-plural). A second, equally important real grammatical feature taught here: Hindi adjectives and many verb forms agree with the GENDER of either the subject or the addressee depending on the construction (अच्छा/अच्छी, चाहता/चाहती, करता/करती, मेरा/मेरी, तुम्हारा/तुम्हारी) -- English has no equivalent, so every gender-agreeing form taught here is called out explicitly rather than presented as an unexplained variant spelling.'
