  notes: 'Drafted by Claude Sonnet. Grammar: reason with क्योंकि (reason follows), result with इसलिए (result follows), asking why with क्यों and answering with क्योंकि, मुझे/उसे बुखार है, था/थी, adjective agreement (थका हुआ / थकी हुई). Priya and Arjun use tum. OPEN NATIVE QUESTIONS: (1) is the comma before क्योंकि and इसलिए optional in a beginner text, and is accepting both in typed answers right; (2) is ''बस देर से आई, इसलिए मैं देर से पहुँचा'' the most natural way to give the excuse; (3) is ''मेरा फ़ोन बंद था'' natural for ''my phone was switched off''.'
