  human_reviewed: false
  source_note: >-
    No firecrawl attempt this round (established-conventions-only
    fallback, same precedent as b1_unit01-14). Every sentence below is
    this session's own fresh authoring of Modern Standard Hindi, nothing
    adapted, translated, or copied from any external source.
review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Hi's fifteenth B1 unit (spine outcome:
    universal.b1.reported_speech.report_what_someone_said, confirmed by
    direct read of universal_spine.yaml: can_do text "report what someone
    else said or asked using an embedded-clause reported-speech
    construction ('X said that...', 'X asked whether...'), across
    everyday messages and workplace topics, without needing to reproduce
    the original speaker's exact words", all four modalities, and all
    four assessment_requirements read in full before designing this
    unit).

    DUPLICATION CHECK against the corpus (mandatory, done before writing
    a single sentence): grepped every hi realization file for "कहा कि"
    and "पूछा". "...ne kaha ki..." (said that) already appears twice --
    b1_unit06_kahani.yaml ("पड़ोसी ने कहा कि वह भी दुकान जा रहा था") and
    b1_unit08_shikayat.yaml ("दुकानदार ने कहा कि वह ज़रूर मदद करेगा").
    "पूछा" (asked) has ZERO hits anywhere in the hi corpus before this
    unit. So this unit's genuinely new grammar surface is REPORTED
    QUESTIONS -- "...ne poochha ki kya..." (asked whether) in lesson01
    and "...ne poochha ki kab/kahaan..." (asked when/where) in lesson02
    -- while "kaha ki" is only lightly reused as already-taught cumulative
    vocabulary in lesson03's combined production scenario, never
    re-taught as new material.

    Ergative/agreement care (known defect class 1 and the specific
    gender-invariance nuance for this construction): "कहा"/"पूछा" stay in
    the default MASCULINE SINGULAR form regardless of the reporting
    speaker's own gender, because their direct object is the embedded
    क्लॉज़ itself (कि...), not a nominal phrase -- Hindi ergative-object
    agreement only applies when the direct object is a real noun phrase.
    This is explicitly taught in lesson01's grammar_note and contrasted
    with an ordinary NP-object example ("प्रिया ने फ़ोन खरीदा" -- फ़ोन is
    a real object, so खरीदा there DOES have to agree with it) so the
    learner does not overgeneralize either rule onto the other case.
    Lesson03's "मैनेजर ने संदेश भेजा" (भेजा agrees with संदेश, masc.) and
    "अर्जुन ने जवाब दिया" (दिया agrees with जवाब, masc.) are both genuine
    NP-object agreement, included deliberately as a second contrast pair.

    Continues Priya/Arjun directly, तुम-register throughout (grepped
    every speaker: line in docs/content/realizations/hi/b1_unit0*.yaml
    and b1_unit1[0-4] before writing). Reuses unit14's established
    "मैनेजर" background referent (no new character with dialogue lines).

    matching_pairs pools: 6 pairs each lesson, all lefts checked by hand
    for mutual distinctness. Word-order word_bank duplicate-token check
    done by hand for every word_order exercise below -- zero repeats.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed per dispatch instructions.

