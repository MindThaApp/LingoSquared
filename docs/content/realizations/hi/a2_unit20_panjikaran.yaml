review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    First Hindi A2 unit (spine outcome:
    universal.a2.bureaucracy.register_with_authorities, confirmed by direct
    read of universal_spine.yaml lines 684-708). Continues directly from
    hi/a1_unit19_weather.yaml -- same Priya/Arjun characters, still on तुम
    terms with each other. This unit introduces hi's first-ever A2 stranger
    character (क्लर्क, an Aadhaar-center clerk) in आप register, matching
    the established aap/tum split from unit01 (आप was already used with
    shopkeepers in unit06/unit07, so this is a continuation of an existing
    register, not a brand-new one).

    Scenario: Arjun recently moved and needs to update his address in his
    Aadhaar card (आधार कार्ड) -- India's real national ID system and the
    genuinely current, authentic way an ordinary resident registers an
    address change with the authorities, chosen over an invented "town
    hall" scenario for real-world accuracy.

    Central A2 grammar decision (this unit's whole reason for existing):
    the ergative "ने" construction for transitive verbs in the past tense,
    introduced for the first time in this course (lesson02's
    grammar_ne_ergative card). Hindi's past-tense transitive clause marks
    the subject with ने and the verb agrees with the direct object (not the
    subject) when the object carries no postposition of its own --
    genuinely new grammar, deliberately withheld until A2 per this course's
    own A1 precedent: unit12 (past events) taught था/थी and गया/गई, but
    exclusively with INTRANSITIVE verbs (जाना, मिलना), which never take ने
    -- confirmed by grep of unit12's own file before writing this note.
    Kept to exactly two transitive verbs this unit (भरना "to fill", लाना
    "to bring", plus बदलना "to change" reused across all three lessons) so
    the new grammar surface stays narrow: every ने-marked exercise pairs
    the verb with a masculine-singular object (फ़ॉर्म, आधार कार्ड, पता),
    so only the masculine-singular past-participle form (भरा/लाया/बदला) is
    ever actually required as a typed answer -- the feminine/plural
    agreement forms are disclosed in the grammar note's prose but never
    exercised live, the same scope-narrowing discipline unit19 used for
    ठंडा/ठंडी.

    Second new grammar point: अपना/अपनी/अपने, the reflexive possessive
    ("one's own"), introduced lesson01 ahead of ने specifically so the
    ने-construction's own example sentences ("मैंने अपना पता बदला") don't
    have to introduce two new grammar points in the same phrase from a
    cold start.

    Vocabulary reuse audited before writing: चाहिए/मुझे...है (unit06),
    के पास (unit16), कहाँ (unit08), नया/नई (unit14), बहुत/अच्छा (unit06/
    unit09), खुश (unit01), था (unit12), का/की/के possessive (unit18) are
    all real prior A1 vocabulary, confirmed by grep before use. New words
    this unit (पता, अपना/अपनी/अपने, बदलना, आधार कार्ड, केंद्र, दस्तावेज़,
    फ़ॉर्म, भरना, लाना, आपको) each get their own teaching card with
    introduced_tokens declared before their first tested_text use, per the
    compiler's own accumulates-within-file tokenizer behavior. उसका/उसकी
    (his/her) was deliberately AVOIDED in the lesson03 reading card (not
    yet established anywhere in the corpus, confirmed by grep) -- the
    reading card uses "अर्जुन का पता" (repeating the name) instead of a
    third-person possessive pronoun, to stay compiler-safe and pedagogically
    honest about what's actually been taught. जी हाँ (formal yes) was
    likewise avoided (not found anywhere in the corpus) in favor of the
    already-known plain हाँ.

    Word-order duplicate-token check: every word_order exercise's word_bank
    below has zero repeated tokens (checked by hand).

    fill_in_blank ambiguity check (§17): lesson01's exercise08 blank
    (बदलना, frame "मुझे अपना पता ___ है।") has जाना as the only other
    lesson01 vocabulary item that could grammatically slot into the same
    shape, but "मुझे अपना पता जाना है" is semantically nonsensical (you
    cannot "go" an address), so the real candidate pool is a single item --
    unambiguous by frame alone, no interchangeable flag needed. Lesson02's
    exercise07 blank (भरा, frame "मैंने फ़ॉर्म ___।") is a genuine two-way
    semantic ambiguity within this lesson's own vocabulary -- "मैंने फ़ॉर्म
    लाया" (I brought the form) is equally grammatical and equally plausible
    -- disambiguated via the overlay's explicit English instruction
    ("Complete: I filled the form."), matching this course's own
    established §17 precedent (naming the intended word in the instruction)
    rather than `interchangeable: true`, since भरना and लाना are not true
    synonyms.

    This unit is NOT yet native-speaker reviewed or fresh-context reviewed
    -- status left honestly as unreviewed, matching this course's own
    convention for freshly authored content pending that separate pass.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with en-hi/a2_unit20.yaml. Fixes: लाना was taught and
    exercised as a ने-verb ("क्या आपने आधार कार्ड लाया?", "हाँ, मैंने
    आधार कार्ड लाया", "अर्जुन ने ... लाया") -- standard Hindi लाना never
    takes ने -> rewritten to "क्या आप आधार कार्ड लाए?" / "हाँ, मैं आधार
    कार्ड लाया" / "अर्जुन ... लाया" across the audio asset (renamed
    hi.a2.audio.bureaucracy.aap_aadhaar_card_laaye.01), teach.laana, the
    phrase card, haan_review example, lesson02 exercise03/04/06/09,
    dialogue line03/04, reading card and lesson03 exercise02/04/05
    prompts; grammar_ne_ergative now uses बदलना as its second example
    and states the लाना exception. The authoring notes above describing
    लाना as a ने-verb are superseded by this fix. Native-speaker check
    needed: the लाना rewrite; whether "मैंने आपका पता बदला" is the
    natural clerk phrasing (vs "बदल दिया").

