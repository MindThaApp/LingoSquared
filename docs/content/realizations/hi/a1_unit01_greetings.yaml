review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    First-ever Hindi unit for this app (hi is a brand-new target
    language: Devanagari script, ltr, Language row + Google Cloud TTS
    hi-IN-Neural2-A + a real InScript-derived virtual keyboard already
    live). Structural template: es/a1_unit01_greetings.yaml (the
    original brand-new-target-language bootstrap precedent) and, even
    more closely, pl/a1_unit01_greetings.yaml (the most recent
    brand-new-language bootstrap, same 3-lesson sizing, same
    schema_version 1.1 §19 vocabulary-example format from the start,
    same "audio-less language, avoid listen_type/listen_select/
    listen_order" precaution -- applied here to hi for the same reason:
    hi is configured for Google Cloud TTS but no real hi TTS audio has
    been synthesized/verified live in this session, so every exercise
    uses a real visible text prompt instead of an audio-only one;
    media_assets is therefore an empty list, not an oversight).

    Source access, disclosed honestly: a genuine public-domain source
    was located and downloaded -- FSI "Hindi: An Active Introduction"
    (D.N. Sharma & James W. Stone, 1970, jointly published with the
    Peace Corps; confirmed real PD US-government work via pdfinfo
    Author: "Foreign Service Institute") --
    https://fsi-languages.yojik.eu/languages/FSI/Hindi/Fsi-HindiActiveIntroduction-StudentText.pdf.
    Two independent extraction attempts both failed to recover usable
    Devanagari text, confirming this is a genuine OCR-unreliability
    case per the standing guidance, not a "didn't try hard enough"
    gap: (1) raw `pdftotext -layout` against the source PDF returned
    zero characters -- it is a pure page-image scan with no embedded
    text layer or fonts at all (`pdffonts` returns an empty table).
    (2) The Internet Archive mirror's own ABBYY FineReader 9.0 OCR
    pass (https://archive.org/details/Fsi-Hindi-AnActiveIntroduction,
    `_djvu.txt`) DID cleanly recover the book's English framing/
    instructional prose (verified: front matter, preface, introduction
    all extract as clean readable English), but a regex scan of the
    full 94KB OCR output for the Devanagari Unicode block (U+0900-
    U+097F) returns ZERO matches anywhere in the document -- the OCR
    engine silently dropped every Devanagari passage rather than
    transcribing it, and where a facing-page Devanagari line partially
    survived it came through as unusable mojibake (e.g. the Unit 1
    material renders as "91 ¥TT", "WTT t ?", "3Tf?", "^Tff f |" --
    Latin-lookalike glyph substitutions with no recoverable meaning).
    This is a strictly worse case than "garbled but salvageable" --
    the actual target-language content is either silently absent or
    actively corrupted, never usable. Per this task's explicit
    instruction, this content was NOT used, cleaned up, or guessed at.
    Peace Corps Hindi materials were not independently re-checked this
    pass: they were already flagged going in as agriculture-focused
    (Peace Corps volunteer training for India, not a greetings-first
    general course) and, since this exact scan family/era (Peace
    Corps + FSI Hindi were co-published, per this PDF's own preface)
    already conclusively demonstrated the Devanagari-OCR failure mode,
    re-spending budget to confirm the same failure a second time was
    judged low-value versus authoring time.

    Consequently, this file is FRESHLY AUTHORED from established,
    uncontroversial Modern Standard Hindi (the FSI source's own
    register: Khari Boli/Delhi-standard, the same variety taught in
    virtually every introductory Hindi course), not adapted from any
    source text -- disclosed honestly per the standing requirement,
    matching the precedent already set by pl/a1_unit01's ty-register
    content (also freshly authored where its own FSI source didn't
    cover it). Every phrase here (namaste/namaskar, aap/tum address,
    kaise/kaisi gender-agreeing "how are you", aapka/tumhara naam kya
    hai, milkar khushi hui / accha laga) is extremely well-established
    A1 Hindi taught in essentially every real course; nothing here is
    a novel or uncertain construction. The actual Devanagari script
    text is this session's own careful, correct rendering (verified
    character-by-character against known standard spellings,
    including the anusvara-vs-chandrabindu convention: chandrabindu
    (ँ) after non-ascending vowel signs as in हूँ/हाँ/कहाँ, anusvara
    (ं) after ascending vowel signs as in मैं/हैं/में/मिलेंगे) --
    never OCR output, never machine-translated.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/a1_unit01.yaml. Fixes:
    lesson03.exercise08.match_questions_and_answers had
    interchangeable pairs (either name answered either name
    question; either origin answered either origin question) ->
    replaced the tum-name and tum-origin pairs with आपसे मिलकर खुशी
    हुई / मुझे भी and क्या तुम योग करती हो / हाँ, मैं योग करती हूँ
    (tested_text and overlay mirror updated). Native-speaker check
    needed: naturalness of यह मेरी पहली बार है / क्या यह तुम्हारी
    पहली बार है (vs. मैं पहली बार आया/आई हूँ), and आपका दिन अच्छा
    रहे as a closing wish.

    Second-pass review 2026-10-19: 1 fix - dialogue line03 Priya's
    reply to Arjun's मैं ... सीखना चाहता हूँ changed from dative मुझे
    भी! to nominative मैं भी! (मुझे भी answers a मुझे-type sentence,
    not a मैं-subject one). NATIVE FLAGS: line10 (चलो शुरू करते हैं
    immediately followed by फिर मिलते हैं while both are about to
    start the same class) reads slightly incoherent; अलविदा! फिर
    मिलेंगे combines a final-sounding farewell with see-you-again;
    earlier flag on यह मेरी पहली बार है still stands.

course:
  realization_key: hi.a1
  target_language_first: true
  dialect: hi_standard
  register_policy: >-
    Teach Modern Standard Hindi (Khari Boli, the Delhi-based standard
    taught nationally and used in media/education) as spoken across
    India. Hindi marks a real three-way address distinction --
    आप (aap, formal/respectful), तुम (tum, informal/familiar), and
    तू (tu, intimate -- reserved for very close family, God, or as a
    genuine insult depending on tone). This introductory unit teaches
    only आप and तुम, the two forms a learner actually needs day to
    day; तू is deliberately out of scope, the same discipline the es
    and pl bootstrap units applied to their own most-marked/least-u
    seful register forms (vos/vosotros, vy-plural). A second, equally
    important real grammatical feature taught here: Hindi adjectives
    and many verb forms agree with the GENDER of either the subject or
    the addressee depending on the construction (अच्छा/अच्छी,
    चाहता/चाहती, करता/करती, मेरा/मेरी, तुम्हारा/तुम्हारी) -- English
    has no equivalent, so every gender-agreeing form taught here is
    called out explicitly rather than presented as an unexplained
    variant spelling.

