review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    First Hindi B2 unit. Targets universal.b2.argumentation.
    defend_a_position_with_evidence: state a claim, support it with
    reasons/evidence, acknowledge the strongest opposing point, and
    rebut it without conceding. Theme: घर से काम करना (working from
    home) vs दफ़्तर में काम करना (working at the office) -- one
    coherent debatable everyday issue across all six lessons, argued
    between the established Priya/Arjun canon (colleagues, तुम-register
    throughline since hi's A1 unit, continued here). Lesson arc mirrors
    the argument structure itself: L01 taking a position (मुझे लगता
    है कि.../मेरे ख़याल से...), L02 giving reasons and evidence
    (पहली बात/इसके अलावा/शोध से पता चलता है कि), L03 acknowledging
    the opposing point (एक तरफ़...दूसरी तरफ़.../हालांकि/यह सच है),
    L04 rebutting without conceding (फिर भी/लेकिन/इसका मतलब यह नहीं
    कि/कुल मिलाकर), L05 an argumentative reading text (distinguish the
    author's claim from the objection answered), L06 the culminating
    production -- a Priya/Arjun debate for the listening requirement plus
    a speaking task and a writing task that each require a FULL argument
    (claim + support + acknowledged objection + rebuttal), not just
    connective drilling. Register: तुम throughout (hi lane's established
    canon, continued from b1). B2 is a separate Course row from B1, so a
    B2 learner never sees B1 lexemes at runtime; all vocabulary this unit
    uses is introduced self-contained within this file (and cumulatively
    reused by units 02-04 of the same hi.b2 course). No sibling-direction
    file was consulted. Character-canon check performed: grepped every
    docs/content/realizations/hi/b1_unit*.yaml occurrence of Priya/Arjun
    before writing -- both are established colleagues who use तुम with
    each other (आप only appears once, in b1_unit18, addressing their
    MANAGER specifically, not each other); this unit continues तुम
    between them and never has them address a manager, so no register
    conflict arises. Gender-agreement design note: every learner-facing
    1st-person production prompt in this unit uses a gender-invariant
    Hindi construction (मुझे लगता है कि... [दात-experiencer, verb
    agrees with an implicit "it", never the speaker], मैं...सहमत हूँ
    [हूँ is invariant], ...याद आती है [agrees with याद, feminine,
    never the speaker]) -- no 1st-person prompt in this file requires a
    करता/करती-class choice. Any करता/करती-class or गया/गई-class
    form used in this unit is always attached to a fixed, author-named
    3rd-person referent (Priya or Arjun, or a fixed-gender noun), never
    to the learner's own unspecified gender.

course:
  realization_key: hi.b2
  target_language_first: true
  dialect: hi_standard
  register_policy: >-
    तुम throughout (hi lane's established Priya/Arjun canon, continued
    from A1-B1). B2 argumentation layers discourse connectives and
    signposting onto that register -- मुझे लगता है कि, पहली बात,
    एक तरफ़...दूसरी तरफ़..., फिर भी, कुल मिलाकर -- while Priya and
    Arjun keep addressing each other with तुम exactly as established;
    neither addresses a manager or stranger in this unit, so no formal
    आप register question arises.

