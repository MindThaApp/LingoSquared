    whether the dialogue's तुम कल दफ़्तर क्यों नहीं आए / सिर्फ़ बस की वजह
    से देर हो गई reads naturally as a full-day absence; फंसना vs फँसना as
    the taught spelling.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Second hi B2 unit, continuing the same hi.b2 course as unit01 (same
    course row, so all of unit01's vocabulary -- मुझे, लगता, है, कि,
    को, नहीं, क्योंकि, इसलिए, कल, etc. -- is already taught and
    reused here without reintroduction). Targets universal.b2.
    speculation.hypothesize_about_causes_and_consequences: speculate
    about causes and consequences with graded certainty, and distinguish
    deduction from guesswork. Theme: Arjun is late to / absent from the
    office, and Priya (plus the narration) speculates about why, with
    the real reason revealed only in lesson06's dialogue -- continuing
    the established Priya/Arjun colleague canon and तुम-register from
    unit01 and hi's B1 lane. Lesson arc: L01 a certainty scale (शायद
    / हो सकता है / लगता है / ज़रूर / निश्चित रूप से) over a
    single copula frame so no verb ever needs to agree with a person;
    L02 present-tense deduction with the epistemic future (...फंसा
    होगा, "must be"); L03 contrasting a bare guess (अंदाज़ा) against a
    confident deduction (पक्का अनुमान); L04 speculating about the
    past (perfective + होगा/होगी, "must have"); L05 a reading text
    distinguishing what is asserted as fact from what is only
    speculated; L06 the culminating Priya/Arjun dialogue where Arjun
    reveals the real reason, requiring the learner to both speak and
    write a speculation that names a cause with an explicit certainty
    level. Register: तुम throughout, matching unit01 and hi's B1
    canon. Character-canon check performed: grepped every
    docs/content/realizations/hi/b1_unit*.yaml and this course's own
    unit01 for Priya/Arjun facts before writing -- both remain
    colleagues who address each other with तुम; this unit adds no new
    biographical facts about either (Arjun's lateness is a one-off
    situational event, not a canon claim about his job/nationality/etc.).
    Gender-agreement design note: every 1st-person production prompt in
    this unit uses either an invariant copula (है/हूँ), an invariant
    subjunctive (हो सकता है कि...हो), or an invariant idiom (मुझे पता
    नहीं) -- never a करता/करती-class or गया/गई-class form. Every
    गया/गई/होगा/होगी/फंसा-class form in this unit is anchored to a
    fixed 3rd-person referent (वह, established as Arjun, masculine) or
    a fixed-gender noun (बस, feminine), never to the learner's own
    unspecified gender; production prompts requiring these forms
    explicitly say "about Arjun" in the English instruction.

