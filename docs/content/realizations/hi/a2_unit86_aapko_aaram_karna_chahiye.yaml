  notes: 'Drafted by Claude Sonnet. Grammar: advice with चाहिए (infinitive agrees with the object: आराम करना, दवा लेनी, पैसे बचाने), negative advice with नहीं ... चाहिए, softer advice with बेहतर होगा कि + तुम -ओ form or आप -एँ form, asking for and answering advice (मुझे क्या करना चाहिए?). Priya and Arjun use tum. OPEN NATIVE QUESTIONS: (1) colloquial speech often uses the unchanged form (पैसे बचाना चाहिए, दवा लेना चाहिए); the unit teaches the agreeing form and accepts the unchanged form only in translation answers; is that the right policy; (2) is ''बेहतर होगा कि आप डॉक्टर के पास जाएँ'' the right formal pattern; (3) is ''तुम्हारे सिर में दर्द है'' natural when stated by a friend as advice context.'
