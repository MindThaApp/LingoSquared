    adapted, translated, or copied from any external source.
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Hi's eleventh B1 unit (spine outcome:
    universal.b1.communication.summarize_and_retell, confirmed by direct
    read of universal_spine.yaml: can_do text "give the main points of a
    short article, conversation, film, or event in a condensed, ordered
    form, distinguishing main points from detail", all four modalities,
    and all four assessment_requirements -- understand_summary/
    retell_content/read_summary/write_summary -- read in full before
    designing this unit's exercises). Continues Priya/Arjun directly,
    तुम-register throughout (grepped every speaker: line in
    docs/content/realizations/hi/b1_unit0*.yaml and b1_unit10 before
    writing -- no new character needed or introduced). Introduces one
    new, ordinary event for Priya to retell (a trip by train to visit
    her parents) that doesn't touch or contradict any previously
    established fact about her.

    Three summarizing tools, each its own lesson: (1) lesson01 "मुख्य
    बात यह है कि..." (the main point is that...) for extracting the
    single most important point out of more detail; (2) lesson02
    "सबसे पहले...फिर...आखिर में..." (first...then...finally...) for
    ordered retelling of a sequence of events; (3) lesson03 "संक्षेप
    में..." (in short/to summarize) combined with a short reading
    passage about Priya's trip, culminating in exercise13's
    writing_prompt that requires the learner to condense the whole
    passage into one ordered, main-points-only summary sentence --
    literally delivering write_summary's own requirement ("Write a
    short summary of a given passage or event, keeping only the main
    points"), not just the individual connector vocabulary
    (AUTHORING_GUIDE checklist item 7). Exercise11
    (reading_comprehension) and exercise12 (multiple_choice) directly
    test "distinguishing main points from detail" by asking the learner
    to identify which of two true statements from the passage is the
    MAIN point versus incidental detail -- this is the outcome's own
    literal success criterion for read_summary/understand_summary, not
    just plain reading comprehension.

    Since the summarizing task is inherently open-ended in real life,
    every production exercise below instead follows this corpus's own
    established pattern (see b1_unit09's writing_prompt notes) of
    giving the learner the EXACT English content to render, so grading
    against one accepted string never marks a correct learner wrong
    (AUTHORING_GUIDE checklist item 3) -- no exercise here asks the
    learner to freely improvise their own original summary text.

    Gender-agreement check: "मुख्य बात यह है कि" and "संक्षेप में" are
    both fixed, invariant discourse-marker constructions -- neither
    inflects for the speaker's gender at all. "सबसे पहले...फिर...आखिर
    में" narrates Arjun's own morning routine using उठा (masc, Arjun's
    own established gender, consistent with every other hi B1 unit's
    treatment of Arjun) and किया (also masc-agreeing with the object
    नाश्ता, itself masculine, so no variant is introduced or needed
    there either); no first-person production exercise in this unit
    requires a gender-inflected verb form, so no feminine variant is
    owed anywhere in this file -- confirmed by walking every exercise's
    tested_text/accepted_answers by hand.

    Tokenizer-fragmentation discipline: file is fully self-contained,
    matching every prior hi B1 unit's own precedent -- every literal
    string used in any exercise's tested_text/word_bank/prompt.target_blocks
    is separately declared via this file's OWN introduced_tokens
    (including every function word, e.g. मैं/है/को/से/और/पर, that a
    prior unit already used but this file re-declares per the
    established self-contained convention -- confirmed against
    b1_unit10's own validator run, which required exactly this).

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit -- no media_asset_key is attached to dialogue
    content, and all three listen_select exercises are single
    standalone utterances with their own dedicated media_asset_key.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): single consistent thread -- Priya travelled
    by train last week to meet her parents; the weather was bad and the
    train was late, but she arrived safely and had a good time; no
    conflicting detail (destination, mode of travel, outcome) is ever
    given anywhere else in the unit.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below was checked by hand -- zero repeated tokens in any
    of them.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed per dispatch instructions.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with en-hi/b1_unit11.yaml. Fixes: lesson01.exercise07
    word_bank dropped the sentence-final है (the 'zero repeated
    tokens' rule truncated the sentence to an ungrammatical one) ->
    second है tile restored (duplicate tiles are valid).
    Native-speaker check needed: naturalness of the double-से summary
    sentence (ट्रेन से अपने माता-पिता से मिलने गई).

