  notes: 'Drafted by Claude Sonnet. Grammar: past progressive (-रहा था / -रही थी / -रहे थे / -रही थीं), negative and question forms, जब ... तभी ... for an interrupting event (simple perfective, with ने where the verb has an object), जब ... तब ... for two simultaneous activities. Canon: Priya and Arjun are friends using tum; Priya takes the bus to the office (as in unit 77). OPEN NATIVE QUESTIONS: (1) is तभी or उसी समय more natural after जब-clauses in speech? (2) is ''माफ़ करना'' fine between friends? (3) ''बारिश शुरू हो गई'' vs ''बारिश होने लगी''.'
