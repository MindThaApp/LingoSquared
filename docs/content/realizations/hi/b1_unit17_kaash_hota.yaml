review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Hi's seventeenth B1 unit (spine outcome:
    universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional,
    confirmed by direct read of universal_spine.yaml: can_do text
    "express hypothetical or unreal situations and wishes using a
    conditional-mood construction ('would' + verb) together with an
    unreal 'if'-clause in a past/irrealis form, and use the conditional
    alone to soften a suggestion, request, or preference," all four
    modalities, and all four assessment_requirements read in full before
    designing this unit).

    DISTINCTNESS FROM UNIT03 AND UNIT13 (mandatory pre-write check, both
    files read in full):
    - unit03 lesson02 already teaches the SIMPLE unreal conditional
      (होता/होती + तो + जाता/आता), covering both a present-unreal reading
      ("अगर आज छुट्टी होती, तो मैं बाज़ार जाता" -- if today were a
      holiday...) and a past-unreal reading with the SAME intransitive/
      -ता-participle verbs ("अगर मुझे पता होता, तो मैं आता" -- if I had
      known, I would have come). Its own grammar_real_vs_unreal note
      explicitly says the construction is "tenseless," disambiguated only
      by context adverbs -- so a unit that just repeated होता/जाता-style
      forms with new vocabulary would be the exact same grammar point.
    - unit13 covers the REAL/habitual/likely condition (अगर + present
      habitual or अगर + future, तो + habitual/future result) -- a
      different mood entirely (indicative, not irrealis), so no overlap
      risk there; confirmed by its own review notes ("real/likely
      condition", "not the unreal/counterfactual one from unit03").
    - THIS unit's genuinely distinct angle, confirmed by grep of every hi
      realization file for "ने...होती" / "किया होता" / "चाहूँगा" (zero
      hits anywhere before this unit): (1) lesson01-02 teach the
      COMPOUND past-unreal conditional built on a TRANSITIVE PERFECTIVE
      verb under ERGATIVE ने-marking -- "अगर मैंने मेहनत की होती, तो मुझे
      नौकरी मिल जाती" (if I had worked harder, I would have gotten the
      job) -- which requires the learner to combine two things unit03
      never combines: the ने-ergative perfective (की, agrees with the
      feminine direct object मेहनत, not with मैं) INSIDE the protasis,
      nested under होती as an auxiliary marking the whole clause
      counterfactual, plus a दिया जाता/मिल जाती-style compound verb in
      the apodosis. This is structurally and pedagogically new: unit03's
      होता/जाता are the ENTIRE predicate; here होती is an auxiliary
      layered onto an already-inflected ergative-perfective participle.
      (2) lesson03 teaches the outcome's OTHER required piece -- "use the
      conditional alone to soften a suggestion, request, or preference"
      -- with NO if-clause at all, via चाहूँगा/चाहेंगे ("would like",
      future-as-polite-conditional, the standard Hindi softener for
      requests/preferences, distinct from unit01's चाहिए which marks
      obligation/necessity, not a softened wish) and सकता/सकती + था/थी
      ("could have", a softened past-oriented suggestion/regret used
      standalone). Neither चाहूँगा nor this standalone सकता...था pattern
      appears anywhere in the prior corpus (grepped, zero hits).

    Ergative-agreement care (known defect class 1, extra caution since
    this is the first hi unit to put ने-ergative INSIDE an unreal
    protasis): "मैंने मेहनत की होती" -- की is feminine singular
    because it agrees with the direct object मेहनत (feminine), NOT with
    मैं (the ergative subject is invisible to verb agreement, per the
    standard rule already established for hi ergative content). होती
    itself agrees with the same feminine direct-object-controlled
    participle it modifies (की + होती both feminine, matching मेहनत),
    not with the ने-subject. Lesson01's grammar_note states this
    explicitly and contrasts it with a MASCULINE-object parallel ("अगर
    उसने प्रयास किया होता, तो..." -- किया/होता masculine, agreeing with
    प्रयास) so the learner sees the agreement target vary correctly with
    the object's gender, not with the (irrelevant) subject.

    Continues Priya/Arjun on तुम terms throughout (grepped every
    speaker: line in b1_unit01-16 before writing) -- lesson03's softened-
    request examples are addressed to each other informally (तुम-level
    चाहूँगा), NOT the formal आप register, which is reserved for unit18's
    dedicated workplace/meeting register shift.

    Tokenizer-fragmentation discipline: this file is self-contained, same
    as prior units. Every exact literal string used in tested_text/
    word_bank is separately declared in this file's own teaching cards.

    Same-speaker-distractor check: structurally inapplicable (no
    media_asset_key on dialogue content; both listen_select exercises are
    single standalone utterances with their own dedicated media_asset_key).

    Cross-check of every concrete fact stated (AUTHORING_GUIDE §11):
    two facts, restated but never contradicted -- (1) Arjun did not work
    hard enough for a specific past job application and did not get the
    job (lesson01/03, consistently a completed, resolved past event);
    (2) Priya's softened suggestion in lesson03 is about the CURRENT
    project deadline, a separate, still-open matter, never merged with
    Arjun's past regret.

    fill_in_blank ambiguity check (§17): every blank targets a single
    unambiguous token given the surrounding frame (होती/चाहूँगा/सकता are
    each uniquely determined by the sentence's stated subject and
    gender, cross-checked against the accepted_answers list).

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/b1_unit17.yaml. Fixes:
    lesson01.teach.grammar_ergative_unreal_past misspelled 'ब्यतीत' and
    wrote the pattern as 'ने [कर्ता]' -> '[कर्ता] + ने ...', 'बीते समय
    की एक अवास्तविक शर्त'; lesson02.teach.grammar_tumne_object_agreement
    and lesson03.teach.grammar_chahoonga_softener cited internal unit
    numbers (unit15/unit01) in learner-facing text -> 'पहले'/'पहले
    सीखे'. Native-speaker check needed: lesson03 phrase 'मैं चाहूँगी कि
    तुम थोड़ा आराम करो -- तुम आराम कर सकते थे' pairs a forward request
    with a past reproach and reads oddly as one utterance; grammar_check
    lesson03.exercise10 treats 'मुझे चाहिए कि तुम काम जल्दी भेजो' as an
    error though it is arguably grammatical (different meaning, not
    wrong form).

