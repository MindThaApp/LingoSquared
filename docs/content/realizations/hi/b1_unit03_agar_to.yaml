review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Hi's third B1 unit (spine outcome:
    universal.b1.hypotheticals.express_hypothetical_conditions, confirmed
    by direct read of universal_spine.yaml lines 1979-2004; prerequisite
    universal.b1.necessity.express_obligation_with_subjunctive is this
    course's own b1_unit01_zaroorat.yaml, confirmed satisfied). Continues
    Priya/Arjun on तुम terms; scenario is a weekend outing they're
    planning, contrasted with a past weekend where they got caught by
    surprise rain -- a natural vehicle for the outcome's own required
    contrast between a real/possible future condition and an unreal/
    counterfactual one.

    Central B1 grammar decision: अगर ("if") ... तो ("then") is genuinely
    new to hi (confirmed by a fresh grep of every hi realization file for
    'अगर' before writing -- zero hits anywhere in the corpus). Two
    DISTINCT clause-pairings are taught, matching the spine outcome's own
    explicit requirement to contrast them, not just teach one: (1)
    lesson01, a real/likely future condition using FUTURE tense in BOTH
    clauses (अगर...होगा/होगी, तो...-ूँगा/एगा/एँगे) -- deliberately chosen
    over the perfective-protasis alternative (अगर...हुआ, तो...) to keep
    this lesson's new-grammar surface to a single tense marker reused in
    both halves rather than two different new mechanics at once; (2)
    lesson02, the unreal/counterfactual conditional (अगर...होता/होती,
    तो...जाता/आता), which reuses the same -ता/ती/ते participle form for
    BOTH the present-unreal and past-unreal reading (genuinely tenseless
    in this construction in real Hindi grammar -- context/adverbs like
    'आज'/'अगर मुझे पहले पता होता' disambiguate, not a separate verb form),
    exactly matching this outcome's own can_do text ("contrast it with an
    unreal/counterfactual present-or-past condition"). Lesson03 applies
    both contrastively in one dialogue (real: what they'll do if it rains
    tomorrow; unreal/regret: what Priya would have done if she'd known
    about a past rainy weekend sooner) plus a reading passage and review.

    चाहिए and सकना are NOT used anywhere in this file's own tested content
    (kept out to isolate this unit's own grammar budget; सकना appears once
    in the reading passage's own dialogue-adjacent color text but never as
    tested_text, so needs no declaration).

    Tokenizer-fragmentation discipline: this file is self-contained, same
    as b1_unit01/02. Verified होगा/होगी fragment to the identical {'ह',
    'ग'} and जाता/आता are trivially short fragments under the compiler's
    tokenize() regex -- harmless because every exact literal string used
    in tested_text/word_bank is separately declared here. Confirmed the
    `taught` set accumulates across the whole file (all three lessons),
    so lesson03 freely reuses lesson01/02's declared tokens without
    redeclaring them.

    Dialogue/reading-kind teaching cards' own target text is not checked
    by validate_untaught_vocabulary -- lesson03's dialogue and reading use
    a few richer words (छाता "umbrella", ले आती "would have brought", कोई
    बात नहीं "no problem", घूमने "to roam/outing", मौसम "weather", पिछली
    बार "last time") freely, since none of those strings is ever used as
    an exercise's own tested_text.

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit (no media_asset_key on dialogue content; both
    listen_select exercises are single standalone utterances with their
    own dedicated media_asset_key).

    Cross-check of every concrete fact stated (AUTHORING_GUIDE §11):
    exactly two facts, restated but never contradicted -- (1) the movie
    plan is specifically the rainy-weather contingency (stated identically
    in lesson03's dialogue line02 and the reading passage's own "अगर
    बारिश होगी, तो वे घर पर रहेंगे और फ़िल्म देखेंगे"); (2) Priya wishes
    she'd brought an umbrella LAST time (a past, already-resolved event,
    dialogue line03), while the CURRENT plan is still about tomorrow's
    forecast -- the two are clearly distinguished by "पिछली बार" in the
    reading passage, never conflated into one timeframe.

    fill_in_blank ambiguity check (§17): lesson01's blank (होगी, frame
    "अगर कल बारिश ___, तो मैं घर पर रहूँगा।") -- बारिश is feminine, so
    होगा (masc.) is grammatically excluded; unambiguous. lesson02's blank
    (जाता, frame "अगर आज छुट्टी होती, तो मैं बाज़ार ___।") -- मैं is this
    file's established masculine default speaker (matching आता/जाता
    elsewhere in the file), and no other participle-shaped word is
    introduced anywhere in this file that could grammatically slot into
    this exact frame; unambiguous by frame + established speaker gender.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/b1_unit03.yaml. No realization edits
    needed; all fixes landed in the overlay (see its notes). Native-
    speaker check needed: dialogue line03 timeframe (see overlay notes).

    Second-pass review 2026-10-19: 0 fixes. Earlier native flag on
    dialogue line03 timeframe still stands.

