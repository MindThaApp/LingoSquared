    fill_in_blank ambiguity check (AUTHORING_GUIDE §17): every blank in
    this unit is either (a) structurally unique given the fixed
    surrounding frame -- lesson01.exercise09's "मुझे सिर ___ है।" blank
    (दर्द) cannot be चाहिए instead, since चाहिए is never followed by है
    (unit06's own established rule, re-disclosed on this unit's own
    grammar_symptom_hai note), so the trailing है in the frame
    structurally excludes the only other candidate that would otherwise
    fit -- and no other symptom noun is taught in this course that could
    fit "सिर ___ है" instead; lesson02.exercise10's "मुझे डॉक्टर के पास
    ___ है।" blank (जाना) has the exact same trailing-है exclusion of
    चाहिए, directly reusing unit15's own precedent for this identical
    frame shape; lesson03.exercise09's "मुझे सिर दर्द ___ बुखार है।"
    blank (और) has no other taught conjunction that fits a coordinating
    "and" position here -- लेकिन ("but") is the only other taught
    conjunction, and substituting it would produce a semantically
    contrastive, not additive, reading that no native speaker would
    intend when simply listing two co-occurring symptoms, so it is not a
    true synonym candidate for this slot -- or (b) a genuinely open
    vocabulary slot disambiguated by the English instruction's own
    explicit translation, matching the established convention already
    used throughout this course (unit06's पानी/चाय-style blanks, unit15's
    translation-cued blanks): lesson01.exercise10's "मुझे ___ है।" slot
