    Central grammar decision #1: extends the already-established दात +
    noun + है construction (unit11's "मुझे काम है" = "I have work") to
    symptom statements: "मुझे सिर दर्द है" ("I have a headache"), "मुझे
    बुखार है" ("I have a fever"). This is explicitly disclosed as the SAME
    pattern, not new grammar, on lesson01's own
    teach.grammar_symptom_hai card, which also names सिर दर्द ("head" +
    "pain") as a compound noun, not a new grammatical structure. No new
    conjugation or case is introduced by this decision.

    Central grammar decision #2: "के पास" (unit08) already carries two
    disclosed senses -- "near" (बैंक स्कूल के पास है) and "possession"
    (मेरे पास एक किताब है). This unit adds a third, real, standard Hindi
    sense: "at a person's place" -- "डॉक्टर के पास जाना है" ("need to go
    to the doctor('s)"). Disclosed explicitly on lesson02's own
    teach.grammar_ke_paas_third_sense card, naming both prior senses by
    unit number before introducing the third. Combined in the same
    sentence with unit15's "मुझे...जाना है" obligation construction
    (verb-infinitive + है), itself re-disclosed as a direct reuse, not new
    grammar.

    Central grammar decision #3: "करो" (do! / rest!, as in "आराम करो") is
    introduced as a direct, explicit extension of the तुम-imperative -ओ
    rule ALREADY taught in unit09 (जाओ, मुड़ो, बताओ, गिनो all named there
    as "-ओ पर खत्म होते हैं") -- applied here to करना, itself already a
    known infinitive since unit11's "माफ़ करना" (sorry/excuse me) idiom.
    करना's stem कर + ओ = करो, the exact same regular formation already
    modeled by unit09's जाओ (जा + ओ), not an irregular contraction (unlike
    लेना→लो or देना→दो, which this unit deliberately does NOT introduce,
    to avoid mixing a regular rule with an irregular exception in the same
    lesson). Disclosed explicitly on lesson02's own teach.karo_grammar
    card, naming unit09 and unit11 by number.

    Central grammar decision #4, a deliberate scope-narrowing, disclosed:
    this unit teaches केवल two symptom nouns (सिर दर्द "headache", बुखार
    "fever") and three pieces of advice (आराम "rest", दवा "medicine",
    डॉक्टर के पास जाना "going to the doctor"), not a broader body-part or
    illness vocabulary set. हाथ ("hand") appears only inside an EXAMPLE
    sentence in unit02 (मेरे हाथ में दस उंगलियाँ हैं) and was never added
    to that file's own introduced_tokens, so it is NOT actually
    course-wide taught vocabulary despite the surface-string match found
    while auditing prior units for reusable body-part words -- confirmed
    by grepping unit02's own introduced_tokens declarations, not assumed
    from the word's mere presence in the file. पेट ("stomach"), गला
    ("throat"), and नाक ("nose") are not used anywhere in the existing hi
    corpus at all (गला/कान string-matches found during the initial audit
    were false positives inside अगला "next" and दुकान "shop" respectively
    -- confirmed by reading context, not just a bare grep hit). This
    unit's own scope (two symptoms, three pieces of advice) fully
    satisfies the spine outcome's own can_do ("State a basic health
    problem and understand simple immediate advice") without needing a
    larger body-part vocabulary set; a broader body-part/illness unit
    remains available as a clean future topic.

    Same-speaker-distractor check (the nl unit44-50 regression class):
