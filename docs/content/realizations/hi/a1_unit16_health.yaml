    आराम via lesson02.teach.aaraam; चाहिए via lesson02.teach.
    chahiye_review; दवा via lesson02.teach.dawa; जाओ/और via lesson02.
    teach.jaao_aur_review; करो via lesson02.teach.karo_grammar. Because
