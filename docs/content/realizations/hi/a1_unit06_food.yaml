    neither the mojibake fragments (none were even found reachable
    for this topic) nor any wording of the recovered English framing
    prose -- was used, cleaned up, transcribed, or guessed at anywhere
    in this file. Every Devanagari string below is this session's own
    careful, correct rendering of established Modern Standard Hindi,
    verified character-by-character (including the anusvara-vs-
    chandrabindu convention already settled in units 01-05:
    chandrabindu (ँ) after non-ascending vowel signs as in हाँ,
    anusvara (ं) after ascending vowel signs as in मुझे-adjacent
    तुम्हें/मिलेंगे/हैं/नहीं -- this unit's own new vocabulary needs
    no new nasalization-mark decisions, it only reuses already-settled
    spelling patterns).

    Three genuine, disclosed grammar-teaching decisions, all
    independently real and uncontroversial Modern Standard Hindi: (1)
    The core ordering construction मुझे ... चाहिए ("I would like ...",
    literally "to me ... is wanted") is taught explicitly on its own
    dedicated grammar_note card in lesson01, with two real, load-
    bearing contrasts called out rather than left implicit: चाहिए does
    NOT agree with the speaker's gender (unlike चाहता/चाहती, already
    taught in unit01's yoga dialogue), and चाहिए is a complete
    predicate on its own -- it never takes है/हैं afterward, a common
    real learner overgeneralization from every other है-taking
    sentence taught so far, drilled explicitly via grammar_check
    exercises in both lesson01 and lesson02. (2) तुम्हें (informal "to
    you") is introduced as the direct parallel to मुझे and to unit05's
    own तुम्हारा/तुम्हारी, continuing the aap/tum dative-pronoun
    pattern rather than treating it as an unrelated new word. (3)
    स्वादिष्ट ("delicious") is flagged on its own grammar_note card in
    lesson03 as a genuinely INVARIANT adjective -- unlike the
    आ/ई-agreeing adjectives already taught (अच्छा/अच्छी, बड़ा/बड़ी,
    मेरा/मेरी), consonant-ending adjectives like स्वादिष्ट never
    change for gender -- called out explicitly as a real, load-bearing
    exception rather than left for the learner to wrongly infer that
    ALL Hindi adjectives inflect, the same "flag the real exception"
    discipline unit01's aap/tum split and unit04's बजा/बजे exception
    already established for this course.

