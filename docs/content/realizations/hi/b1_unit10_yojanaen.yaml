review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Hi's tenth B1 unit (spine outcome:
    universal.b1.future.describe_plans_intentions_and_predictions,
    confirmed by direct read of universal_spine.yaml: can_do text
    "distinguish fixed arrangements, intentions, and probable or
    uncertain predictions using the target language's future-reference
    forms and certainty markers", all four modalities, and all four
    assessment_requirements -- understand_future_plans/
    describe_future_plans/read_future_plans/write_future_plans -- read
    in full before designing this unit's exercises). Continues
    Priya/Arjun directly, तुम-register throughout (grepped every
    speaker: line in docs/content/realizations/hi/b1_unit0*.yaml before
    writing -- no new character needed or introduced; also grepped for
    any prior establishment of Arjun's or Priya's job/occupation --
    none found beyond unit01's client-report thread and unit05's generic
    responsibilities vocabulary, so this unit's "new job search" /
    "Mumbai trip" content does not contradict any pinned fact).

    Three certainty degrees, each its own lesson, matching the outcome's
    own "distinguish fixed arrangements / intentions / predictions"
    wording literally: (1) lesson01 "...का इरादा है" (firm, planned
    intention -- Arjun's/Priya's own fixed near-future plan); (2)
    lesson02 "...के बारे में सोच रहा/रही हूँ" (tentative, still-considering
    intention, explicitly weaker commitment than lesson01's इरादा); (3)
    lesson03 "शायद...होगा/होगी/-ऊँगा/-ऊँगी" (uncertain probable
    prediction, weather and a personal guess). Lesson03's dialogue
    reuses lesson01 and lesson02's own taught sentences verbatim so all
    three certainty degrees appear together in one exchange, and its
    culminating writing_prompt (exercise13) requires the learner to
    produce all three -- a plan, an intention, and a prediction -- in
    one written message, literally delivering
    universal.b1.future.describe_plans_intentions_and_predictions's own
    write_future_plans requirement ("Write a short message describing a
    plan, an intention, and a prediction about a given topic"), not just
    the individual component constructions (AUTHORING_GUIDE checklist
    item 7).

    Gender-agreement check, construction by construction (checklist
    item 6 / rule 6):
    - lesson01's "...का इरादा है": मेरा/मेरी agrees with इरादा (a
      masculine noun), NOT with the speaker's own gender -- so मेरा is
      invariant regardless of whether Arjun or Priya is speaking. No
      feminine variant is needed or offered for this construction; both
      lesson01 model sentences correctly use मेरा for both a male
      (Arjun) and a female (Priya) speaker, and the overlay's
      answer_policy states this explicitly so no reviewer mistakes it
      for a missed variant.
    - lesson02's "...सोच रहा/रही हूँ": this progressive DOES agree with
      the SPEAKER's own gender (रहा masc / रही fem). Arjun's model
      sentence uses रहा, Priya's uses रही, and the lesson's own
      production exercise (writing_prompt, exercise11) accepts BOTH
      रहा and रही variants since the English prompt does not specify the
      answering learner's gender.
    - lesson03's "शायद कल बारिश होगी": होगी agrees with बारिश (feminine
      noun, third-person weather statement) -- entirely independent of
      the speaker's own gender, so no variant is needed here either.
      "शायद मैं आज रात जल्दी सोऊँगा/सोऊँगी" (future of सोना, 1st person)
      DOES agree with the speaker (सोऊँगा masc / सोऊँगी fem, per the
      standing rule that Hindi future forms agree with the speaker) --
      both variants are offered in the fill_in_blank feedback and the
      culminating writing_prompt's accepted_answers.

    Tokenizer-fragmentation discipline: file is fully self-contained,
    matching every prior hi B1 unit's own precedent -- every literal
    string used in any exercise's tested_text/word_bank/prompt.target_blocks
    is separately declared via this file's OWN introduced_tokens.

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit -- no media_asset_key is attached to dialogue
    content, and all three listen_select exercises are single
    standalone utterances with their own dedicated media_asset_key.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): single consistent thread -- Arjun intends to
    go to Mumbai next week and is considering a new job there once he
    arrives; Priya intends to go home next month; the only weather/sleep
    claims are explicitly marked as uncertain predictions with शायद, so
    they never conflict with a stated fact.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below was checked by hand; lesson01's two word_banks each
    contain one repeated token (का, appearing once as the subject's
    possessive marker and once as the fixed इरादा-construction marker) --
    both occurrences take the identical string value at fixed, distinct
    slot positions, so the duplicate is not ambiguous (either physical
    tile can fill either का-slot with an identical, equally-correct
    result); no other word_bank in this file has a repeated token.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed per dispatch instructions.

