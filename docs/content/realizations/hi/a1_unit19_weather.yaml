    nasalization/nuqta), बुरा (U+092C U+0941 U+0930 U+093E, zero
    nasalization/nuqta), बाहर (U+092C U+093E U+0939 U+0930, zero
    nasalization/nuqta), जाते (U+091C U+093E U+0924 U+0947, zero
    nasalization/nuqta). One genuine anusvara decision was made and
    verified this unit: ठंडा/ठंडी (U+0920 U+0902 U+0921 U+093E / U+0920
    U+0902 U+0921 U+0940) use anusvara U+0902 before the consonant ड --
    the nasal-before-consonant class already established by इंजीनियर
    (unit17), NOT the nasalized-open-vowel chandrabindu class used by
    कुर्सियाँ/खिड़कियाँ (unit18) -- confirmed correct per standard Modern
