    Central grammar decision #1: the weather-existential construction,
    "आज/कल + [मौसम-संबंधी संज्ञा] + है" ("Today/tomorrow there is
    [weather noun]" -- e.g. "आज धूप है" = "It's sunny today," "आज बारिश
    है" = "It's raining today," "आज हवा है" = "It's windy today"). This
    directly reuses unit18's own established है/हैं existential pattern
    ("[जगह] में [संख्या] [संज्ञा] है/हैं") but simplified: no numeral, no
    postposition -- the weather noun is stated as a bare subject, which
    is genuinely how Hindi idiomatically talks about sun/rain/wind
    ("dhoop hai," "baarish hai," "hawa hai" are all standard, natural
    phrasings, not simplified/artificial constructions -- avoiding the
    progressive "बारिश हो रही है" construction, which would be new,
    untaught grammar). बादल (cloud) is introduced only in its natural
    plural existential form, "आज बादल हैं" ("There are clouds today" /
    "it's cloudy today") -- मौसम itself, by contrast, always takes
    singular है (there is exactly one "weather" being discussed at a
    time), giving a clean, disclosed contrast between the two nouns'
    natural number in this unit's own sentences.

    Central grammar decision #2 (disclosed contrast, lesson02's own
    teach.grammar_garm_thanda card): गर्म ("hot") is a consonant-ending
    adjective and does NOT change for gender ("मौसम गर्म है" stays
    "गर्म" regardless of the noun's gender), while ठंडा/ठंडी ("cold")
    is an "-आ"-ending adjective that DOES change for gender, reusing
    unit14's already-taught बड़ा/बड़ी agreement rule exactly (see
    unit14's own gender_agreement policy, reused verbatim in this unit's
    own answer_policy). Deliberate scope-narrowing, matching unit16-18's
    own precedent: ठंडी (the feminine form) is shown ONCE, in this
    lesson's own teaching-card `example:` only (paired against रसोई,
    already an established feminine noun from unit18, itself never
    re-tested here), and never appears in any exercise's `tested_text` --
    every exercise in this unit that tests गर्म/ठंडा pairs it with मौसम
    (masculine) only, so ठंडा is the only inflected form ever actually
    graded. This keeps the new grammar surface to exactly one disclosed
    contrast (invariant vs. gender-agreeing adjective) rather than also
    exercising the feminine form live. बुरा ("bad") is likewise a
    genuine "-आ"/"-ई" adjective (बुरा/बुरी) but, matching the same
    scope-narrowing, is only ever used here in its masculine form
    (paired with मौसम); its own feminine form is not shown at all this
    unit, not even in an example -- a smaller, silent version of the
    same discipline, not requiring its own separate disclosure paragraph
    since no contrast is being taught around it.

    Central grammar decision #3: lesson03's "let's ___" suggestion reuses
    the already-explicitly-documented "चलो" + habitual-plural-verb
    pattern (unit01 "चलो शुरू करते हैं," unit06 "चलो, कुछ खाते हैं!,"
    unit07 "चलो, कुछ खरीदते हैं!" -- all already establish "चलो" + a
    "-ते हैं" habitual form as "Let's ___"). "जाते हैं" is a NEW surface
    form here, but it is the exact same "-ते हैं" habitual pattern
    applied to जाना ("to go," already taught as a bare infinitive in
    unit15's "मुझे स्टेशन जाना है" construction) -- the identical
    derivation unit11 already used for "देखते हैं"/"पीते हैं" from
    देखना/पीना. "चलो, बाहर जाते हैं!" ("Let's go outside!") is also,
    separately, a genuinely natural, idiomatic Hindi phrase in its own
    right (the root चलना and चलो sharing an etymological root is not
    accidental repetition -- "chalo, chalte hain" / "chalo, jaate hain"
    are both authentically how this suggestion is made in everyday
    spoken Hindi). रहते हैं ("[they/we] stay/live") is reused from
    unit05, where it was established via masculine-plural RESPECT
    agreement for a singular grandfather ("मेरे दादा दिल्ली में रहते
    हैं") -- this unit is the first to use रहते हैं with a genuinely
    plural subject (हम, "we," already taught unit11), a simpler,
    non-respect instance of the exact same verb-agreement form, not a
    new rule.

    कल ("yesterday"/"tomorrow," first taught unit04, reused for
    "yesterday" again in unit12) is reused a third time in this unit for
    its other, equally standard meaning, "tomorrow" -- genuinely
    ambiguous by design in real Hindi, disambiguated only by sentence
    context (past-tense surrounding content = yesterday, as in unit12;
    future/plan-making content = tomorrow, as here). This is a real,
    disclosed feature of the word being taught accurately, not a content
    inconsistency between units -- unit12's own gloss ("yesterday") and
    this unit's gloss ("tomorrow") both remain individually correct
    within their own sentence's tense context, and this unit's own
    overlay note says so explicitly for whoever reviews next.

