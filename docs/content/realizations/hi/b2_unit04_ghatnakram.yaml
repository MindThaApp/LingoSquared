generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source, continuing hi's
    B2 course (same hi.b2 realization_key as units 01-03, so vocabulary
    is cumulative). Sibling-isolation honored: the en-hi (X->en) B2
    realization and every other language's B2 file were treated as
    non-existent; the nl B2 unit04 file was consulted only for STRUCTURE
    (background/foreground/pre-past lesson sequencing), never for
    sentence text.
review:
  status: unreviewed
  required_next_reviewer: >-
    Fresh-context content review needed (DRAFT). Priority checks: (1)
    every narrative sentence in this unit is told in the 3rd person
    ABOUT Priya (a deliberate design choice, documented below, so no
    learner production prompt ever requires the learner's own gender for
    कर रही थी / घबरा गई / भेज दी थी -- confirm every speak_response/
    writing_prompt instruction explicitly frames the task as "recount
    Priya's story", never "recount your own day"); (2) ने-ergative
    usage in lesson04/05/06 (प्रिया ने...भेज दी थी) is grammatically
    correct standard Hindi; (3) फोन is fixed MASCULINE throughout
    (बजा, agrees with फोन) while बिजली/बारिश/रिपोर्ट are fixed
    FEMININE -- confirm no cross-contamination; (4) the lesson06
    culminating exercises actually require background + interrupting
    event + pre-past event together, per universal.b2.narrative's own
    assessment_requirements, not just one time-relation drilled alone.
  notes: >-
    Fourth hi B2 unit, continuing the same hi.b2 course as units 01-03
    (all of that vocabulary -- घर, से, काम, समय, अर्जुन, मीटिंग, तुम,
    कल, आए, है, को, आज, etc. -- is already taught and reused here).
    Targets universal.b2.narrative.recount_complex_events_with_
    shifting_time: recount a complex sequence of events with shifting
    time reference -- background versus foreground, an event before
    other past events, keeping the timeline unambiguous. Theme:
    continuing the Priya/Arjun workplace canon -- the day of a meeting
    with a power cut, told entirely in the 3rd person about Priya (a
    given incident the learner recounts, matching this outcome's own
    "recount a real OR GIVEN incident" allowance -- chosen specifically
    so no learner production prompt ever needs the learner's own
    gender). Lesson arc: L01 background with the continuous past (...कर
    रही थी); L02 the foregrounded interrupting event with the simple
    past (अचानक...चली गई); L03 time connectors (जब...तब...,
    जैसे ही, जबकि, ...के दौरान); L04 the pre-past ("had already
    done", ने-ergative + perfective + था/थी); L05 a reading text
    combining all three time layers, with chronology-resolution
    questions; L06 the culminating Arjun/Priya dialogue the next day,
    where the learner recounts the whole complex event (background +
    interruption + pre-past) aloud and in writing. Register: तुम
    throughout in the dialogue frame, matching units 01-03 and hi's B1
    canon; the narrative body itself is 3rd-person narration, not
    direct address, so तुम/आप does not arise within it. Character-canon
    check performed: grepped this course's own units 01-03 and hi's
    b1_unit*.yaml for Priya/Arjun facts before writing -- both remain
    colleagues who use तुम with each other; this unit adds no new
    biographical facts about either (a single day's meeting mishap is a
    situational event, not a canon claim). Gender-agreement design
    note: this unit's central strategy is telling the ENTIRE narrative
    in the 3rd person about Priya (fixed feminine, author-controlled),
    so every गई/रही/थी/दी-class form is anchored to her, never to the
    learner's own unspecified gender; every speak_response/writing_
    prompt in this unit explicitly instructs "recount Priya's story",
    never "write about yourself". The two scripted 1st-person dialogue
    lines in lesson06 (Arjun asking, Priya answering as herself) are
    fixed character speech, not learner production, so their gendered
    forms (मैं...कर रही थी, मैंने...भेज दी थी) are author-controlled
    exactly like any other dialogue card.

course:
  realization_key: hi.b2
  target_language_first: true
  dialect: hi_standard
  register_policy: >-
    तुम throughout in direct address (hi lane's established Priya/Arjun
    canon; see hi.b2.unit01.tark's course block for the full statement).
    This unit's narrative body is 3rd-person narration about Priya, so no
    तुम/आप register choice arises within it -- only lesson06's dialogue
    frame uses direct address, and it continues तुम exactly as
    established.

