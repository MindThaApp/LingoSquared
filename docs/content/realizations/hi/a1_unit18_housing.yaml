    Priya's house is big or small, answer directly stated; exercise02
    shows line04 "मेरा घर बड़ा है। घर में तीन बेडरूम हैं और एक बड़ी
    रसोई है।" and asks how many bedrooms Arjun's house has, answer
    directly stated), neither requiring inference across unseen lines or
