    unit06's kitchen-adjacent food context only at the concept level, not
    the word itself which is new here, बाथरूम/बेडरूम "bathroom"/
    "bedroom", मेज़/कुर्सी/बिस्तर/खिड़की "table"/"chair"/"bed"/"window")
    were both already fully planned and largely authored before this
    source-access step was run at all. Every Devanagari string below is
