    Central grammar decision #1: existential quantity construction,
    "[जगह] में [संख्या] [संज्ञा] है/हैं" ("There is/are [number] [noun]
    in/at [place]"), combining three already-established pieces: में
    ("in/at", unit01/17), है/हैं (copula, unit05/10, singular/plural
    verb agreement already established for respect-plural family members
    and now extended to ordinary count-plural nouns), and एक/दो/तीन/
    कितने (numbers and "how many", unit02/07). No new function word is
    introduced by this decision -- this unit is the first to combine all
    of these into a genuine quantity-existential sentence about a home.

    Central grammar decision #2 (genuinely new morphology, disclosed
    explicitly, lesson01's own teach.grammar_room_plural card): the
    masculine noun plural rule for words ending in "-आ" -- कमरा (one
    room) becomes कमरे (more than one room) in the direct plural, the
    first time this course formally teaches AND tests a noun-plural rule
    (a bare example of this exact pattern, "इस कमरे में आठ कुर्सियाँ
    हैं", appeared untested in unit02's own numbers content but was never
    formally taught or exercised there -- this unit is the first to
    disclose the rule itself, not just use an inflected form in passing).

    Central grammar decision #3 (second plural rule, lesson02's own
    teach.grammar_feminine_plural card): the feminine noun plural rule
    for words ending in "-ई" -- कुर्सी (one chair) becomes कुर्सियाँ
    (more than one chair), खिड़की (one window) becomes खिड़कियाँ (more
    than one window), contrasted explicitly against decision #2's
    masculine "-आ"->"-े" rule in the same grammar note, since a learner
    seeing both patterns back-to-back is far more likely to retain the
    contrast than seeing them in separate units.

    Central grammar decision #4, a deliberate scope-narrowing (matching
    unit16/17's own explicit precedent for this discipline): मेज़
    ("table") and बिस्तर ("bed") are feminine/masculine nouns whose own
    plural forms use a DIFFERENT rule again (मेज़->मेज़ें, an "-ें"
    suffix on a consonant-ending feminine noun; बिस्तर stays invariant,
    a consonant-ending masculine noun) -- this unit deliberately keeps
    both of these singular-only in every exercise, and बाथरूम/बेडरूम
    (invariant English loanwords, matching unit17's डॉक्टर/इंजीनियर
    precedent for loanword invariance) are only ever pluralized via the
    numeral + हैं pattern, never given their own plural SUFFIX. This
    keeps this unit's new-morphology surface to exactly the two
    contrasting native plural rules (decisions #2 and #3) rather than
    piling a third and fourth suffix pattern into one unit's real
    vocabulary load. A future unit remains free to teach the "-ें" rule
    on its own terms.

    Central grammar decision #5, a second deliberate scope-narrowing:
    this unit never combines a possessive (मेरा/तुम्हारा) directly with
    a postposition-marked noun (which would require the oblique-case
    agreement मेरा->मेरे / तुम्हारा->तुम्हारे, already informally
    PRESENT in the corpus via "मेरे हाथ में" (unit02) and "मेरे दादा
    दिल्ली में रहते हैं" (unit05) but never formally taught as its own
    rule). Every "in/at [place]" sentence in this unit uses either a bare
    place noun ("घर में", "रसोई में", "बेडरूम में" -- whose ownership is
    already clear from dialogue/exercise context) or a possessive in a
    NON-oblique predicate-adjective position ("प्रिया का घर छोटा है",
    "अर्जुन का घर बड़ा है", where घर is followed by an adjective, not a
    postposition, so का/मेरा/तुम्हारा never needs to shift to के/मेरे/
    तुम्हारे). This is a deliberate, disclosed decision to keep this
    unit's new-grammar budget to decisions #2/#3 above, not an oversight
    -- the oblique-possessive-before-postposition rule remains available
    as a clean, well-precedented future teaching point.

    Same-speaker-distractor check (the nl unit44-50 regression class):
