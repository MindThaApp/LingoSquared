    Nasalization/nuqta discipline, disclosed per unit07-17 precedent,
    verified this round via a direct Python codepoint hex dump of every
    NEW word before finalizing (not eyeballed), each compared against an
    already-shipped known-good precedent word rather than judged in
    isolation: कमरा/कमरे (U+0915 U+092E U+0930 U+093E / U+0915 U+092E
    U+0930 U+0947, zero nasalization, zero nuqta), रसोई (U+0930 U+0938
    U+094B U+0908, zero nasalization), बाथरूम/बेडरूम (zero nasalization,
    zero nuqta, plain loanword transliterations), बिस्तर (U+092C U+093F
    U+0938 U+094D U+0924 U+0930, zero nasalization). Two genuine nuqta/
    nasalization decisions were made and verified this unit: मेज़ (U+092E
    U+0947 U+091C U+093C) uses the combining nuqta pair U+091C U+093C
    for ज़ -- confirmed via a direct hex-dump comparison against रोज़
    (unit10/17, U+0930 U+094B U+091C U+093C), an EXACT codepoint match on
    the ja+nuqta pair, not assumed; खिड़की/खिड़कियाँ (U+0916 U+093F
    U+0921 U+093C U+0915 U+0940 / ...U+0915 U+093F U+092F U+093E U+0901)
    use the combining nuqta pair U+0921 U+093C for ड़ -- confirmed via a
    direct hex-dump comparison against बड़ा (unit14, U+092C U+0921 U+093C
    U+093E), an EXACT codepoint match on the Da+nuqta pair. The two
    plural forms कुर्सियाँ and खिड़कियाँ both end in CHANDRABINDU
    (U+0901), not anusvara -- confirmed via a direct hex-dump comparison
    against हूँ (U+0939 U+0942 U+0901), an EXACT codepoint match on the
    vowel+chandrabindu pair -- correct per standard Modern Standard Hindi
    orthography, since both are nasalized OPEN word-final vowels
    (-इयाँ), the same phonological class as हूँ/नहीं/हाँ, not the
    nasal-before-consonant anusvara class used by इंजीनियर (unit17).
    Zero anusvara decisions were needed anywhere in this unit's new
    vocabulary.

