  source_note: >-
    Same source-access situation as the other three hi A2 units authored
    this session (unit20/21/22): `firecrawl --status` confirmed 0/1,000
    credits, no search attempted given that. Established-conventions-only
    fallback, matching every prior hi unit's own precedent. Every sentence
    below is this session's own fresh authoring of established Modern
    Standard Hindi.
review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Fourth Hindi A2 unit (spine outcome:
    universal.a2.health.attend_doctor_appointment, confirmed by direct
    read of universal_spine.yaml lines 760-783). Continues directly from
    hi/a1_unit16_health.yaml (A1's health unit -- same दर्द/बुखार/डॉक्टर/
    चाहिए/आराम vocabulary base) and hi/a2_unit20-22 (same Priya/Arjun
    characters, ने-ergative reinforced once more via आराम किया in the
    reading card). Introduces a third A2 stranger character (डॉक्टर) in
    आप register, same convention as unit20's क्लर्क/unit22's कर्मचारी.

    Applies the same up-front token-declaration discipline established
    across unit20-22 (see unit20's own review notes for the full
    tokenizer-fragment-matching root cause) -- every literal surface form
    tested anywhere in this file's exercises has its own `introduced_
    tokens` declaration earlier in the same file.

    Central A2 grammar decision #1: a THIRD distinct sense of से, disclosed
    explicitly against the two senses this course already teaches --
    "from" (unit 3, "main Bharat se hoon") and "with" (unit 12, "X se
    milna") -- this unit adds duration/since: "[time] se" = "for/since
    [duration]", e.g. "teen din se bukhar hai" (I've had a fever for three
    days). lesson01's own grammar note states all three senses side by
    side rather than silently introducing a third meaning of an
    already-familiar word with no acknowledgment.

    Central A2 grammar decision #2: चाहिए + infinitive as a "should" modal,
    extending unit16's noun-object-only चाहिए ("tumhein aaraam chahiye") to
    govern a verb infinitive ("aapko aaraam karna chahiye"). Deliberately
    SCOPE-NARROWED: real Hindi also gender/number-agrees the governed
    infinitive with ITS OWN object when one exists (e.g. "aapko yah dawa
    leni chahiye", *leni* agreeing with feminine *dawa*) -- this is
    disclosed as an aside in lesson02's grammar note and appears once in
    lesson03's dialogue (line05, untested) for authenticity, but is
    deliberately NOT exercised live this unit, keeping this unit's own
    graded exercises to the single invariant masculine pattern ("karna
    chahiye", *aaraam* is masculine) rather than adding a third live
    grammar nuance on top of से and the modal itself. Matches this
    course's own standing scope-narrowing precedent (unit19's ठंडी,
    unit20's plural/feminine ने-agreement forms).

    Vocabulary reuse audited before writing (grep-confirmed): दर्द/बुखार/
    सिर/डॉक्टर/आराम/चाहिए (unit16), मुझे/तुम्हें/आपको (unit6/16/20), हाँ/
    ठीक है (unit1/13), अर्जुन/प्रिया (recurring characters), करना/किया
    ने-ergative pattern (reinforces unit20-22's rule with a new verb).
    New this unit: दिन (day), कब (when) + से (duration sense), दवा
    (medicine), समस्या (problem), भी (also). उसका/उसे (3rd-person oblique
    pronouns) again deliberately avoided in the reading card -- uses
    "अर्जुन को"/"अर्जुन ने" by name throughout, matching unit20-22's own
    precedent.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    fill_in_blank ambiguity check (§17): lesson01's exercise08 blank (से,
    frame "मुझे तीन दिन ___ बुखार है।") has no other postposition taught
    in this file that fits a duration reading -- unambiguous by frame
    alone (में, taught review-style but only in a locative sense, would
    read as "in three days" / future, not "for three days" duration, and
    isn't declared in this file regardless). Lesson02's exercise07 blank
    (चाहिए, frame "आपको आराम करना ___।") is likewise the only modal this
    file's vocabulary supports in that slot.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

