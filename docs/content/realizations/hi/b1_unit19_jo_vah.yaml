review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Hi's nineteenth (and, per the canonical B1 spine, final) B1 unit
    (spine outcome:
    universal.b1.narrative.combine_descriptions_with_relative_clauses,
    confirmed by direct read of universal_spine.yaml: can_do text
    "combine two facts about a person, place, or thing into a single,
    richer sentence using a relative clause (a 'who'/'that'/'where'-type
    construction), including cases where the relative pronoun must agree
    in gender/number or must combine with a preposition," all four
    modalities, and all four assessment_requirements read in full before
    designing this unit).

    DUPLICATION CHECK: grepped every hi realization file for "जो" (as a
    relative pronoun, not the verb "hona"-adjacent homograph) and
    "जिसके"/"जिसमें"/"जिससे" before writing -- zero hits anywhere in the
    corpus. Genuinely new grammar surface, confirmed.

    Grammar decision, matching the outcome's own explicit two-part
    requirement: lesson01 teaches the SUBJECT relative clause with the
    correlative जो...वह pair for people ("वह लड़का जो गा रहा है, मेरा
    दोस्त है" / "वह लड़की जो गा रही है, मेरी दोस्त है") -- जो itself is
    invariant for gender/number, but the VERB inside the relative clause
    and the possessive/main-clause predicate both agree with the
    antecedent's gender, which the two contrasting examples make
    explicit. Lesson02 teaches the outcome's OTHER required piece --
    जिस-forms combined with a preposition/postposition in the OBLIQUE
    case (जिसके साथ "with whom", जिसमें "in which", जिससे "from/with
    which"), confirmed distinct grammar (जो -> जिस- is a real case
    change, not just vocabulary). Lesson03 combines two independent
    facts into one relative-clause sentence (this outcome's own core
    task) across a person, a place, and a thing, plus a short reading/
    review.

    Ergative-agreement care (known defect class 1): deliberately kept
    every verb in this unit's own tested sentences in the simple
    present/habitual or continuous (गा रहा है, रहता है, काम करता हूँ,
    पैदा हुआ -- the one perfective, पैदा हुआ, is intransitive so it
    takes no ने and has no ergative-agreement question at all), so this
    unit's new grammar budget (the relative-clause construction and its
    oblique/prepositional forms) is not stacked against a second new
    mechanic (ने-ergative agreement) in the same file, matching this
    course's own established practice of isolating one new grammar
    surface per unit wherever the outcome allows it.

    Continues Priya/Arjun on तुम terms throughout (grepped every
    speaker: line in b1_unit01-18 before writing); this unit's exercises
    describe a THIRD person (a friend, a colleague, a city) rather than
    Arjun/Priya describing each other, so no register question arises.

    Overlay/realization correspondence double-checked line-by-line
    (known defect class 2): every exercise's instruction/accepted_answers
    below was re-read against its own realization sentence immediately
    before finalizing this file.

    Cross-check of every concrete fact stated (AUTHORING_GUIDE §11):
    three facts, restated but never contradicted -- (1) the singing boy
    and girl in lesson01 are each independently identified as Arjun's/
    Priya's friend, one fact per referent, never merged; (2) lesson02's
    colleague (जिसके साथ मैं काम करता हूँ) is a stable, ongoing
    relationship, distinct from (3) lesson02/03's city (जिसमें मैं
    पैदा हुआ), which is a fixed past fact about birthplace, never
    conflated with the colleague or with "जहाँ मैं अभी रहता हूँ" (where
    I currently live, introduced in lesson03 as an explicit CONTRAST to
    birthplace, not a restatement of it).

    Tokenizer-fragmentation discipline: this file is self-contained, same
    as prior units. Every exact literal string used in tested_text/
    word_bank is separately declared in this file's own teaching cards.

    Same-speaker-distractor check: structurally inapplicable (no
    media_asset_key on dialogue content; both listen_select exercises are
    single standalone utterances with their own dedicated media_asset_key).

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/b1_unit19.yaml. Fixes:
    lesson03.teach.grammar_jahan_place leaked an internal key
    '(unit19.lesson02)' and repeated 'जिसमें'/'जिसमें' -> '(पिछले पाठ
    वाला)', single 'जिसमें'; lesson02.teach.paida_hua example 'मैं
    दिल्ली में पैदा हुआ' contradicted lesson03's passage (Arjun born
    elsewhere, now lives in Delhi) -> 'मैं मुंबई में पैदा हुआ' (मुंबई
    taught in A1 unit05). Native-speaker check needed: 'वह शहर जिसमें
    मैं पैदा हुआ' (vs the more idiomatic 'जिस शहर में मैं पैदा हुआ,
    वह...' / 'जहाँ मैं पैदा हुआ'); reading passage's 'लेकिन यह वह शहर
    नहीं है जहाँ...' using यह for the just-mentioned birth city.

    Second-pass review 2026-10-19: 1 fix - lesson03.exercise13 writing prompt printed the romanized answer (leak) -> removed. NATIVE FLAGS: unchanged from the earlier pass ('वह शहर जिसमें मैं पैदा हुआ' idiomaticity; यह for the just-mentioned birth city in the reading passage).

