generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Same source-access situation as hi/a2_unit20_panjikaran.yaml, authored
    the same session: `firecrawl --status` confirmed 0/1,000 credits, no
    search attempted given that. Established-conventions-only fallback,
    matching every prior hi unit's own precedent. Every sentence below is
    this session's own fresh authoring of established Modern Standard
    Hindi.
review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Second Hindi A2 unit (spine outcome:
    universal.a2.opinions.give_opinions_with_reasons, confirmed by direct
    read of universal_spine.yaml lines 710-733). Continues directly from
    hi/a2_unit20_panjikaran.yaml -- same Priya/Arjun characters, तुम terms
    (no formal-register stranger this unit, unlike unit20).

    Real tokenizer footgun found and worked around while authoring unit20,
    applied proactively here from the start: `compile_content.py`'s
    `tokenize()` uses a plain `[\w‌]+` regex, and Python's Unicode
    `\w` does NOT include Devanagari dependent vowel signs/virama (the Mc/
    Mn-category combining marks) -- so a word like "नया" tokenizes to the
    fragment "नय", "अपना" to "अपन", etc. Because the validator applies this
    SAME lossy tokenizer to both `introduced_tokens` and each exercise's
    `tested_text`, a word only validates cleanly if its EXACT surface form
    (not just a related form -- an infinitive doesn't cover its own
    inflected past-tense form, for instance) has been fed through
    `introduced_tokens` somewhere earlier in the same file, since the
    tokenizer resets per file. Confirmed live: unit20's first validation
    attempt failed with 7 errors, all resolved by adding explicit review-
    vocabulary cards for words that were genuinely already-taught Hindi
    (मेरा, हाँ, अर्जुन, प्रिया, नया) but had never been literally declared
    as `introduced_tokens` INSIDE that specific file. Every teaching card
    below was planned with this in mind up front (every literal surface
    form used in any exercise's `tested_text`, including function words
    and character names, has its own `introduced_tokens` declaration
    earlier in this file), rather than discovered via a validation-error
    loop this time. This is a real, general gap worth flagging for the
    compiler's own lane (Codex): the tokenizer's Unicode handling is
    accurate for Latin/Cyrillic-script content but produces misleadingly
    coarse fragments for any script with combining diacritics/vowel signs
    (Devanagari, and likely Arabic/Farsi harakat if those are ever
    similarly checked) -- not a hi-specific content bug, a script-general
    validator limitation, not yet documented in CLAUDE.md's footguns list.

    Central A2 grammar decision: the लगना ("to seem/feel") experiencer
    verb, in two distinct uses that are DELIBERATELY DISCLOSED as
    different despite looking similar on the surface: (1) lesson01's
    "मुझे [चीज़] [विशेषण] लगती/लगता है" (agrees with the thing being
    evaluated, exactly parallel to unit13's already-taught "पसंद है/हैं"
    pattern -- same dative-experiencer shape, same -आ/-ई adjective
    agreement already established for बड़ा/बड़ी (unit14) and ठंडा/ठंडी
    (unit19), now applied to अच्छी); (2) lesson02's "मुझे लगता है कि
    [पूरा वाक्य]" (a FIXED, non-agreeing idiomatic form -- लगता stays
    invariant here regardless of what follows, since grammatically
    nothing agrees with it; the following कि-clause is a full subordinate
    sentence, not a simple noun). Getting this distinction right matters:
    lesson02's own grammar_check exercise (fix_lagta_hai_ki_agreement)
    directly tests a learner NOT over-applying pattern (1)'s agreement
    rule to pattern (2)'s fixed idiom.

    Second new grammar point: क्योंकि (because), joining a stated opinion
    to its supporting reason -- directly serves this outcome's own
    "support it with a simple reason" requirement.

    Scenario: Priya and Arjun discuss a film (फ़िल्म, reused from unit11)
    they watched together, disagree, and each states a preference --
    directly serves this outcome's "respond to someone else's opinion"
    assessment requirement (lesson03's dialogue).

    Vocabulary reuse audited before writing (grep-confirmed): फ़िल्म
    (unit11), पसंद/हाँ/नहीं (unit13), यह/खेल (unit13), बड़ा/बड़ी agreement
    rule (unit14), बहुत (unit06), ठीक है (unit01), कैसा (unit12, reused
    unit19), बुरा (unit19, masculine only -- this unit's बुरी is the
    first live use of its feminine counterpart, predictable from the
    same rule but never before exercised). New this unit: लगना, कहानी,
    मज़ेदार (invariant, doesn't end in -आ, a disclosed contrast against
    अच्छी/बुरी right in the same lesson), क्योंकि, किताब/किताबें (books,
    reintroduced since unit13's own declaration doesn't carry over
    file-to-file). उसे/उसका (3rd-person oblique pronoun forms) were
    again deliberately avoided in the reading card (still not
    established anywhere in the corpus, confirmed by grep) -- repeats
    "प्रिया को" by name instead, matching unit20's own precedent for the
    same reason. को as a third-person dative postposition (as opposed to
    the already-fused मुझे/तुम्हें) appears ONLY in the untested reading
    card, not exercised directly, to avoid adding a third new grammar
    point this unit beyond लगना and क्योंकि.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand;
    deliberately avoided "मुझे यह फ़िल्म पसंद है क्योंकि कहानी अच्छी है"-
    shaped sentences for word_order specifically, since any two-clause
    sentence with पसंद है...अच्छी है repeats है -- used only in fill_in_
    blank/dialogue/reading contexts instead, where repeated words aren't
    a constraint).

    fill_in_blank ambiguity check (§17): lesson01's exercise08 blank
    (अच्छी, frame "मुझे यह फ़िल्म ___ लगती है।") has मज़ेदार as a genuinely
    plausible alternative within this lesson's own vocabulary (a learner
    could reasonably answer "I find this film fun" instead of "good") --
    disambiguated via the overlay's explicit English instruction
    ("Complete: I find this film good."), not `interchangeable: true`,
    since अच्छी and मज़ेदार are not true synonyms. Lesson02's exercise07
    blank (क्योंकि) has no other reason-connector taught in this unit's
    own vocabulary, so it is unambiguous by frame alone.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

