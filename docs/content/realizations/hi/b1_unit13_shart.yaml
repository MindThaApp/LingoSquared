review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Hi's thirteenth B1 unit (spine outcome:
    universal.b1.conditions.express_real_conditions, confirmed by direct
    read of universal_spine.yaml: can_do text "express a real/likely
    condition and its consequence using an if-clause construction
    (condition + result across two clauses, not a bare single
    statement), across everyday planning topics, and negate the
    condition to express 'if not'", all four modalities, and all four
    assessment_requirements read in full before designing this unit).

    DUPLICATION CHECK against hi/b1_unit03_agar_to.yaml (mandatory
    per dispatch instructions, done before writing a single sentence):
    unit03 already teaches (1) a real/likely FUTURE condition, both
    clauses in future tense ("agar kal baarish hogi, to main ghar par
    rahoonga") and (2) an UNREAL/counterfactual conditional ("agar aaj
    chutti hoti, to main baazaar jaata"). Neither of those is a bare
    "real conditions" duplicate risk in itself, BUT the spine outcome's
    own explicit, distinguishing requirement -- "negate the condition to
    express 'if not'" -- is NOT covered anywhere in unit03 (grepped
    "नहीं" across unit03: zero co-occurrence with "अगर" anywhere in the
    file). That negation gap is this unit's genuinely new angle, plus a
    second, tense-based angle: lesson01 here teaches a HABITUAL/PRESENT
    real condition (general-truth register, "agar main samay par
    pahunchta hoon, to mera din accha jaata hai") rather than unit03's
    future-tense register, giving the learner a second real-condition
    tense they don't yet have. Lesson02 is the negated real/likely
    FUTURE condition the outcome explicitly names ("agar baarish nahin
    hogi, to..."). Lesson03's planning dialogue deliberately avoids
    unit03's own reading-passage sentence "agar baarish hogi, to ghar
    par rahenge aur film dekhenge" (grepped verbatim, unit03 line ~
    reading passage) by substituting a different consequence (ताश
    खेलेंगे, play cards, instead of फ़िल्म देखेंगे) so no sentence is
    reused wholesale.

    Continues Priya/Arjun directly, तुम-register throughout (grepped
    every speaker: line in docs/content/realizations/hi/b1_unit0*.yaml
    and b1_unit1[0-2] before writing -- no new character needed;
    Priya works overtime to save money and Arjun is learning English
    for a promotion, per unit12 -- neither fact touched here). New,
    ordinary event: Arjun and Priya planning a Saturday outing, which
    doesn't contradict any previously established fact.

    Ergative/agreement care (known defect class 1): lesson01/02/03 use
    only intransitive or future-tense verbs in the अगर-clauses (होना,
    उठना, पहुँचना, जाना, करना-future), so no perfective transitive-ने
    construction appears in any अगर-clause here, sidestepping the
    ergative-agreement risk entirely for this unit's new grammar surface.
    Where ने does appear (lesson02 "मैं...रिपोर्ट पूरी नहीं करूँगा" --
    future tense, so NO ने is used at all, confirmed correct: ने only
    marks perfective transitive verbs, never future/habitual ones).

    matching_pairs pools: 6 pairs each lesson, all lefts checked by hand
    for mutual distinctness (no interchangeable glosses).

    Word-order duplicate-token check: every word_order exercise's
    word_bank below was checked by hand -- zero repeated tokens.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed per dispatch instructions.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with en-hi/b1_unit13.yaml. Fixes: lesson02 grammar note
    'अगर-उपवाक्य के क्रिया' (wrong gender, क्रिया is feminine) -> 'की
    क्रिया'. Native-speaker check needed: naturalness of 'आज बारिश
    है।' example (vs 'आज बारिश हो रही है').

    Second-pass review 2026-10-19: 3 fixes (realization side) - Priya's
    sentences moved from दफ़्तर to स्कूल (canon: Priya is a school
    teacher, a1_unit17); lesson03.exercise13 English prompt printed the
    romanized answer -> removed. (Overlay side carries the rest.) NATIVE
    FLAGS: 'आज बारिश है।' naturalness (vs 'आज बारिश हो रही है').

    Second-pass follow-up 2026-10-19: speak prompts no longer print the Hindi answer (3 items); variants added: none needed.

