    conflicting date), it does not work (खराब, stated consistently
    lesson01/lesson03), and she asks for a refund (वापस, stated
    consistently lesson02/lesson03), which the दुकानदार agrees to
    (never a conflicting resolution offered anywhere in the unit).

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

