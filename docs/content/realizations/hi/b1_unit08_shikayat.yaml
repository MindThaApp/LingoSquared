    मदद चाहिए"), now applied to an imperative rather than a question.
    (2) खराब (broken/faulty) + past तense खरीदा (bought) to describe
    the problem and what already happened, both genuinely new
    vocabulary, following the plain past-tense pattern already
    established across the course (गया/मिली/गई, unit06).

    Tokenizer-fragmentation discipline: file is fully self-contained,
    matching every prior hi B1 unit's own precedent -- every literal
    string used in any exercise's tested_text/word_bank is separately
    declared via this file's OWN introduced_tokens.

