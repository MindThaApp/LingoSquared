    choice here, not a drift. register_policy below states this
    explicitly.

    Two new pieces: (1) कृपया + आप-imperative ("करें") for a polite
    request -- कृपया is genuinely new; the आप-imperative करें is a
    disclosed extension of the आप verb-agreement pattern already used
