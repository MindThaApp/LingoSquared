    describe_daily_routine and universal.a1.time.ask_tell_time -- already
    realized as hi's own unit10 and unit04 respectively. Cross-checked
    against on-disk precedent per this task's explicit instruction: `ls
    docs/content/realizations/nl/`, `pl/`, and `ro/` all independently
    confirm a1_unit12_past_events.yaml as their own twelfth unit, matching
    hi's own unit01-11 sequence, which has independently tracked the same
    topic order as those three languages throughout. Sized to 3 lessons
    matching unit01-11's bootstrap pace. Topic/pacing structure only
    (recognition-first, minimal new grammar surface per central decision,
    dialogue in lesson03) informed at a purely structural level by this
    session's own established hi conventions, not by opening any nl/pl/ro
    file's actual text -- every Hindi sentence below is authored fresh.

    Source access, re-attempted per this task's explicit instruction (not
    assumed to fail the same way as every prior hi unit): a fresh
    `firecrawl search` (no query cache reused from any prior session)
    failed outright with the same HTTP 402 (payment/quota) error every
    prior hi unit this session has hit -- quota still has not reset, fully
    disclosed rather than silently skipped. Fell back to the same FSI
    "Hindi: An Active Introduction" archive.org item
    (`Fsi-Hindi-AnActiveIntroduction`), re-downloaded fresh into this
    session's own isolated scratchpad (a fresh Claude session cannot reuse
    a prior session's scratch files). A fresh regex scan (Python, not
    eyeballed) of the Internet Archive's own OCR pass
    (`Fsi-HindiActiveIntroduction-StudentText_djvu.txt`, 94KB, re-downloaded
    this session) for the Devanagari Unicode block (U+0900-U+097F) returned
    ZERO matches anywhere in the document -- confirmed programmatically, a
    twelfth confirmation of the same fact across this whole session's worth
    of hi units. A direct binary PDF re-fetch this round hit an unrelated
    archive.org URL-format hiccup (the download link resolved to something
    `pdfinfo`/`pdftotext` couldn't parse as a PDF at all) rather than
    reproducing the exact "scanned image, empty pdffonts" evidence units
    07-11 captured directly -- not re-chased further since the OCR-text
    zero-Devanagari-match evidence above is the same authoritative signal
    every prior unit actually relied on and is conclusive on its own. A
    fresh grep of the OCR file for this unit's own topic (past events,
    recent completed actions) this time found real, directly on-topic
    incidental corroboration -- genuine grammar-explanation prose about
    Hindi's perfect participle and past auxiliary ("With the past
    auxiliary, the meaning is clearly in the past... it will be used
    wherever in English 'I had gone' is appropriate, but also in many
    cases where 'I went' is used") plus example glosses ("If he has gone to
    the market", "Did you go?") -- but every Hindi-script line immediately
    preceding each hit is pure OCR mojibake ("qf^ ^ ^"T^TR ?[t", "EPTT
    s^PT I**"), confirmed by eye to be garbage, not readable
    Devanagari-as-Latin-transliteration, matching the exact failure mode
    confirmed eleven times over across units 01-11, now a twelfth time
    against this unit's own topic. Per this task's explicit instruction,
    nothing from either extraction attempt -- neither any mojibake
    fragment nor any wording of the recovered English framing prose -- was
    used, cleaned up, transcribed, or guessed at anywhere in this file.
    Every Devanagari string below is this session's own careful, correct
    rendering of established Modern Standard Hindi, verified
    character-by-character.

    Central grammar decision #1: था (m.sg) / थी (f.sg), the past copula
    ("was"), is introduced as a direct, disclosed extension of the
    already-established present copula है/हूँ/हैं (unit01/10) -- same
    gender-agreement logic already drilled via मेरा/मेरी (unit05) and
    अच्छा/अच्छी (used incidentally since unit01, formally paired here).
    Demonstrated with both established characters (अर्जुन व्यस्त था /
    प्रिया व्यस्त थी) exactly as unit11 demonstrated हम via both leads.

    Central grammar decision #2, a deliberate simplification, disclosed:
    this unit teaches the simple past of exactly two INTRANSITIVE verbs
    only -- जाना ("to go") -> गया(m.sg)/गई(f.sg), reusing the same root
    already established via जाओ (तुम-imperative, unit09's "go!"), and
    मिलना ("to meet") -> मिला(m.sg)/मिली(f.sg), reusing the same root
    already established via मिलते हैं (habitual, unit01/04/10/11's
    closings). Both verbs conjugate by subject-gender agreement alone, no
    ने (ergative case marking). Deliberately, explicitly avoids ANY
    transitive-verb past tense this unit (मैंने चाय पी, मैंने खाना खाया,
    तुमने क्या किया) -- the ergative ने-construction genuinely required for
    transitive-verb past tense in Hindi is a significantly bigger, A2-
    appropriate grammar point, the same "avoid the harder construction,
    reuse what's already taught" discipline unit11 applied to decline via
    copula+dative-possession instead of a new "can" modal (सकना). Deferred
    to a future unit, not built here.

    Central grammar decision #3: मिलना's past tense pairs with "से"
    (Arjun प्रिया से मिला, lit. "Arjun met WITH Priya") -- a genuine dual
    usage of an already-taught word disclosed explicitly: से was
    previously only ever taught/tested meaning "from" (unit01 "मैं भारत
    से हूँ", unit09 "यहाँ से सीधे जाओ"); this unit is the first to use its
    equally standard "with" sense in the फिक्स्ड collocation "X से मिलना"
    (to meet WITH X). Both senses are genuine, common, standard Hindi --
    not a course error -- and a dedicated grammar_note
    (lesson02.teach.milna_se_grammar) states the distinction explicitly,
    matching the precedent already set for को's and अच्छा/अच्छी's own
    dual-use/paradigm notes in earlier units.

    Central grammar decision #4, a minor lexical extension not a new
    grammar point: कैसा (m.sg "how") is introduced to complete a paradigm
    this course already has two-thirds of -- कैसे (used for आप/तुम "how
    are you", unit01) and कैसी (used for आप fem "how are you", unit01)
    were both already taught; कैसा simply fills the missing masculine-
    singular slot (used for यह/वह/दिन-type subjects: "दिन कैसा था?"), the
    exact same paradigm, not a new one. Formalized in lesson01's
    teach.kaisa_kaisi_grammar card, which explicitly ties the three forms
    together for the first time.

    Central grammar decision #5, disclosed as a deliberate RECOGNITION-
    ONLY scope decision at the grammar-paradigm level (an extension of
    the course's usual exercise-level recognition->production pacing
    rule, applied here to which VERB FORMS get actively drilled): तुम,
    हम, and वे all take the exact same "plural-shaped" past-tense verb
    ending already established for present tense (unit10/11's -ते + हैं/हो
    pattern) -- थे, गए, मिले replace था/गया/मिला respectively regardless
    of the addressee's/subject's actual number or gender, mirroring the
    already-taught present-tense fact that तुम/हम/वे always pair with the
    "plural-looking" verb form. This unit's dialogue (lesson03, line02)
    uses exactly one instance of this ("हम मिले") and lesson03's
    teach.mile_grammar card states the full rule (थे/गए/मिले, all three
    named) so the learner isn't confused encountering गए/थे later, but ONLY
    मिले is drilled in an actual exercise (lesson03.exercise03, recognition
    multiple_choice) -- गए and थे appear nowhere in this file's exercises
    at all, only in the grammar_note's own explanatory prose (which, per
    the standing tokenizer-footgun rule, is exempt from the taught-token
    check since grammar_note prose isn't `tested_text`). This keeps the
    unit's PRODUCTION burden to exactly six drilled forms (था/थी, गया/गई,
    मिला/मिली) while still giving genuine, honest exposure to the fuller,
    grammatically complete paradigm -- a wider application of this
    project's standing recognition-before-production discipline, not a
    new exception to it.

    Central grammar decision #6, a genuine dual usage disclosed: क्या,
    previously taught/tested only as the yes/no question marker (unit01
    "क्या यह तुम्हारी पहली बार है?", unit11 "क्या रविवार को ठीक है?"),
    additionally means "what" as an interrogative pronoun -- both are
    completely standard, unrelated-looking-but-actually-the-same-word uses
    of क्या in real Hindi. Used with its "what" sense in lesson03's
    dialogue line04 ("बाज़ार में क्या था?" -- "What was at the market?").
    Not tested via any exercise's tested_text in this file (only appears
    in dialogue target text, which the tokenizer validator doesn't check),
    so no re-declaration footgun applies here, but flagged per the
    standing "cross-check every fact/usage, not just tokens that are
    mechanically enforced" discipline.

    कल's already-disclosed dual meaning (unit04: "means both 'tomorrow'
    and 'yesterday', disambiguated only by the verb's tense") is
    deliberately exploited as a real teaching moment in this unit, its
    first genuine PAST-tense use anywhere in the course: कल pairs with
    था/गया/मिला-family past verbs throughout lessons 1-3 to mean
    "yesterday", then lesson03's closing line08 ("कल फिर मिलते हैं?" --
    "Shall we meet again tomorrow?") deliberately switches back to कल's
    "tomorrow" sense, signaled unambiguously by मिलते हैं's present-
    habitual (non-past) tense in exactly the same closing-line slot
    unit01/04/10/11 have already used with this same meaning -- the
    learner sees both senses of the same word disambiguated by tense
    within one unit, not a new fact, but the first unit that can actually
    demonstrate it in action.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    performed explicitly. All three listen_select exercises (lesson01.
    exercise04, lesson02.exercise04, lesson03.exercise07) are each a
    single standalone, non-dialogue utterance with no other speaker/other
    lines in the same clip -- the "distractor must not be something the
    same speaker also says elsewhere in this audio" bug class structurally
    cannot occur here, since there is no "elsewhere in this audio" for a
    standalone phrase (same reasoning as unit09/10/11's own listen_select
    exercises, now applied a fourth time). The two dialogue_comprehension
    exercises in lesson03 (exercise01/02) are TEXT reading-comprehension
    (the learner reads the actual dialogue line, no audio/`media_asset_key`
    involved), matching unit08/09/10/11's own dialogue_comprehension
    pattern -- each shown `target_blocks` line was deliberately chosen to
    directly contain its own correct answer (exercise01 shows line02
    "बहुत अच्छा था! हम मिले।" and asks how Priya's day was, answer directly
    stated; exercise02 shows line03 "हाँ! मैं पहले बाज़ार भी गया।" and asks
    where Arjun went first, answer directly stated) -- neither requires
    inference across lines the learner isn't shown, and neither distractor
    option (English gloss text on the overlay side: "Busy"/"Bad" for
    exercise01, "The tea shop"/"Home" for exercise02) is itself a fact
    stated anywhere in the shown line, so neither is a disguised second-
    correct-answer.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11), not just within the dialogue: lesson03's
    dialogue establishes, in order: Priya's day was good and she and Arjun
    met; Arjun also went to the market first, before meeting; the market
    had good food; the tea shop (where they met) was also very good;
    they agree to meet again tomorrow. No exercise anywhere in lesson01-03
    states a conflicting account -- lesson01's generic examples (अर्जुन/
    प्रिया व्यस्त था/थी, दिन अच्छा था, फ़िल्म अच्छी थी) and lesson02's
    generic examples (अर्जुन बाज़ार गया, प्रिया घर गई, अर्जुन/प्रिया...से
    मिला/मिली) are all either unattributed teaching-card illustrations or,
    where attributed to a character, consistent with lesson03's own
    dialogue-established facts (Arjun did go to the market; Arjun and
    Priya did meet). Priya's closing written note (lesson03's reading card)
    restates exactly the same facts the dialogue already established (the
    day was good, the food was good, the tea shop was also good) with no
    numeric or factual conflict. This unit deliberately makes NO reference
    to unit11's own specific Sunday/4-o'clock tea-plan details (day-of-week,
    exact time) -- the "yesterday" recounted here is a fresh, self-
    contained account that a reader could plausibly read as the SAME
    meetup unit11 planned, without requiring it (avoids any risk of a
    stale/contradicting numeric callback while still preserving the
    narrative spirit of "the plan from last unit happened").

    Nasalization/spelling discipline, disclosed per unit07-11 precedent:
    this unit introduces genuinely NO new nasalized vocabulary. था, थी,
    गया, गई, मिला, मिली, कैसा, कैसी, का, खाना, दुकान, चाय, बाज़ार, घर,
    वहाँ (reused, already anusvara/chandrabindu-settled from unit08-09) --
    the only nasalized forms anywhere in this unit are हैं/हूँ (reused
    unchanged from their already-settled spellings) and वहाँ (reused
    unchanged from unit08/09's own chandrabindu spelling). No new
    nasalization decision was needed. बाज़ार and फ़िल्म (reused from
    unit07/11) both correctly keep their nuqta-marked ज़/फ़ (U+095B/
    U+095E), matching this course's established loanword convention.

    Untaught-vocabulary validator footgun (already documented by
    unit07-11, re-confirmed live during this unit's authoring): every
    word from an earlier unit reused here in a `tested_text` (कल, अच्छा,
    अच्छी, फ़िल्म, व्यस्त, बाज़ार, घर, वहाँ, साथ, मैं, अर्जुन, प्रिया, से,
    चाय, दुकान, खाना, दिन, है, हूँ, हैं) was re-added to this file's own
    introduced_tokens at or before its first tested-text use, since
    `validate_untaught_vocabulary`'s `taught` set is declared fresh per
    realization FILE (confirmed correct this round: it is NOT reset
    per-lesson within one file -- lesson01's introduced_tokens carry
    forward and remain valid for lesson02/lesson03's own tested_text
    within this same file, confirmed by direct reading of
    `scripts/compile_content.py`'s `validate_untaught_vocabulary` before
    relying on it). Two live catches while drafting: बहुत (already taught
    unit06, reused only in dialogue/reading TEXT here, never in a
    tested_text -- deliberately left OUT of introduced_tokens since it's
    never actually tested in this file, confirmed by grep of every
