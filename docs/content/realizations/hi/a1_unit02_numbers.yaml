review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Second Hindi unit, continuing directly from
    hi/a1_unit01_greetings.yaml (same Priya/Arjun characters, same
    yoga-class setting, same aap/tum register split). Spine outcome
    confirmed via universal_spine.yaml: hi/a1_unit01 realized
    universal.a1.greetings.open_close_exchange and
    universal.a1.introductions.exchange_identity, so the next A1
    outcome in spine order is universal.a1.numbers.use_basic_numbers --
    confirmed against actual on-disk precedent from every other
    launched language's own unit02 (nl/a1_unit02_numbers.yaml,
    es/a1_unit02_numbers.yaml, pl/a1_unit02_numbers.yaml,
    ro/a1_unit02_numbers.yaml all realize this exact outcome as their
    second unit; fa/a1_unit02 is the one exception, an older unit
    predating this project's now-settled numbers-second convention).
    Sized to 3 lessons matching unit01's bootstrap pace, structurally
    following the same lesson-topic split every other language's own
    numbers unit uses (0-10, then 11-100 plus a price/quantity
    question, then a phone-number-and-age dialogue) -- topic/pacing
    structure only, no text or phrasing reused from any other
    language's file, per the standing skeleton-share-not-text-share
    policy.

    Source access, re-attempted per this task's explicit instruction
    (not just assumed to fail the same way as unit01): re-used the
    same FSI "Hindi: An Active Introduction" PDF already downloaded for
    unit01 (scratch copy at .../scratchpad/hi/fsi_hindi.pdf) and
    re-ran both extraction paths specifically against this unit's own
    topic. (1) `pdftotext -layout` against the raw PDF again returned
    a near-empty file (143 bytes total across all 143 pages) --
    confirms this is genuinely a pure page-image scan with no embedded
    text layer at all, not something that varies by section. (2) A
    fresh regex scan of the same Internet Archive OCR pass
    (`ocr.txt`, the ABBYY FineReader 9.0 output already recovered for
    unit01) specifically around every "number"/"count" mention in the
    book's English framing prose (found real hits: "Large numbers are
    said and written this way:", "Numbers are one of the more
    difficult vocabulary problems...", "Note also the special numbers
    1 1/2, 2 1/2" -- confirming the OCR pass DID correctly transcribe
    the surrounding English instructional text for this exact section)
    turned up a full-document regex scan for the Devanagari Unicode
    block (U+0900-U+097F): zero matches anywhere in the 94KB file,
    identical to the unit01 finding. The numbers section's own
    Devanagari number words are simply absent from the OCR output, not
    even as recoverable mojibake in this particular section -- a
    strictly cleaner "not present" failure than unit01's partial
    mojibake fragments, but still zero usable target-language text.
    Per this task's explicit instruction, nothing from either
    extraction attempt was used, cleaned up, or guessed at anywhere in
    this file -- every Devanagari string below is this session's own
    careful, correct rendering from established Modern Standard Hindi,
    verified character-by-character (including the anusvara-vs-
    chandrabindu convention: chandrabindu (ँ) after non-ascending
    vowel signs as in पाँच/हाँ/कहाँ, anusvara (ं) after ascending
    vowel signs as in नहीं/मैं/हैं/में), never OCR output, never
    machine-translated.

    A genuine, disclosed content-design consequence of authoring real
    Hindi (rather than reusing another language's structure verbatim):
    unlike Polish, English, or most European languages, Hindi's
    teens and tens (11-99) are NOT compositional -- ग्यारह (11),
    बारह (12), बीस (20), तीस (30) etc. are each their own irregular
    lexical item, not "ten-word + unit-word" the way pl's "dwadzieścia
    jeden" (twenty + one = 21) can be built and drilled with a
    word_order exercise. This unit therefore does not include a
    "build a compound number from its parts" word_order drill the way
    other languages' numbers units do -- that would misrepresent real
    Hindi grammar. Numbers past the ones taught here (11, 12, 15, 20,
    30, 50, 100) are simply not introduced yet, left for a future
    numbers-depth pass, rather than papering over the irregularity
    with an invented compositional rule.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/a1_unit02.yaml. Fixes: teach.das
    example मेरे हाथ में दस उंगलियाँ हैं (one hand, ten fingers -
    factually false) -> मेरे हाथों में दस उंगलियाँ हैं;
    lesson03.exercise07.match_questions_and_answers had
    interchangeable pairs (two age questions and two phone questions
    with swappable answers) -> dropped आपकी उम्र / तुम्हारा फ़ोन
    नंबर pairs, pooled unit01's आपका नाम क्या है / आप कैसे हैं pairs
    (tested_text and overlay mirror updated). Native-speaker check
    needed: यह पचास रुपये की है in the exercise08 prompt (की vs का
    agreement).

course:
  realization_key: hi.a1
  target_language_first: true
  dialect: hi_standard
  register_policy: >-
    Continues unit01's aap/tum split exactly, extended to two new
    question types: asking a price (इसकी कीमत क्या है? -- "iski keemat
    kya hai", "What is its price?") and asking someone's age (आपकी/
    तुम्हारी उम्र क्या है? -- "aapki/tumhari umra kya hai", "What is
    your age?"). Both कीमत (price) and उम्र (age) are grammatically
    feminine nouns, so their possessives take the feminine oblique
    form (इसकी, आपकी, तुम्हारी, मेरी) regardless of who is speaking or
    being addressed -- a deliberate, simpler continuation of unit01's
    gender-agreement teaching thread (which centered on adjectives/
    verbs agreeing with people) now applied to agreement with a
    feminine THING being discussed, still called out explicitly on the
    relevant teaching cards and drilled via grammar_check exercises,
    not glossed over as an unexplained variant spelling. Priya and
    Arjun, already on तुम terms from unit01's closing dialogue, stay in
    that register for this unit's own dialogue; both aap and tum
    question forms are still taught as standalone vocabulary either
    way, matching unit01's own precedent of teaching both registers
    even when the embedded dialogue only demonstrates one.

