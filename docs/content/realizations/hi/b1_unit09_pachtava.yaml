  required_next_reviewer: null
  notes: >-
    Hi's ninth B1 unit (spine outcome:
    universal.b1.hypotheticals.express_regret_and_past_wishes, confirmed
    by direct read of universal_spine.yaml: can_do, all four modalities,
    and all four assessment_requirements -- understand_regret/
    express_regret/read_regret/write_regret -- read in full before
    designing this unit's exercises). Continues Priya/Arjun directly,
    तुम-register throughout (grepped every speaker: line in
    docs/content/realizations/hi/b1_unit0*.yaml before writing -- no new
    character needed or introduced), continuing the unit01 work-report
    scenario thread (Arjun's report, first raised in unit01's own
    example sentence "मुझे भी कल एक क्लाइंट को फ़ोन करना चाहिए था, पर
    मैं भूल गया" -- this unit picks that thread back up and resolves it
    with genuine past-hypothetical regret forms).

    Two genuinely new-but-disclosed-reuse constructions: (1)
    "...चाहिए था" (should have -- past obligation, unfulfilled), a
    direct, disclosed reuse of unit01's own चाहिए mechanism plus था
    (unit12/unit06), already informally modelled in unit01's own example
    sentence but never taught as its own exercise-bearing construction
    until now; (2) "काश...होता" (if only.../I wish...had), a genuinely
    new counterfactual-wish particle (काश) combined with the past
    subjunctive होता/होती (unit03) and किया होता (did + would-have,
    compounding unit03's होता onto the past participle किया, itself
    already taught, unit04/unit06's कहा/की family) -- confirmed by a
    fresh grep of every hi realization file for 'काश' before writing:
    zero hits anywhere in the corpus outside this file, genuinely new.

    Lesson01 teaches ...चाहिए था in isolation (Arjun regrets not
    finishing the report). Lesson02 teaches काश + किया होता (wish/if
    only), continuing the same story with a genuinely new mistake
    (गलती). Lesson03 combines both in a fresh mini-dialogue between
    Priya and Arjun plus a grammar summary and a reading passage
    retelling the same regret in third person.

    Tokenizer-fragmentation discipline: file is fully self-contained,
    matching every prior hi B1 unit's own precedent -- every literal
    string used in any exercise's tested_text/word_bank is separately
    declared via this file's OWN introduced_tokens.

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit -- no media_asset_key is attached to dialogue
    content, and all three listen_select exercises are single
    standalone utterances with their own dedicated media_asset_key.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): single consistent thread -- Arjun did not
    finish his report on time (stated lesson01, restated consistently
    lesson03, never given a conflicting deadline or outcome anywhere in
    the unit) and regrets a specific mistake, starting late (गलती,
    stated consistently lesson02/lesson03 as "मैंने जल्दी शुरू नहीं
    किया" -- never a conflicting cause given).

    Gender-agreement check: होता (masculine, Arjun's own established
    gender) is used consistently throughout every काश/चाहिए था
    construction where Arjun is the subject -- no feminine वेरिएंट
    needed within this unit's own dialogue since Arjun is always the one
    expressing regret here, but the overlay's accepted_answers for the
    culminating writing exercise add the feminine करनी/होती variant per
    the standing rule that a learner answering as herself may use either
    gender where the exercise doesn't pin a specific character.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

