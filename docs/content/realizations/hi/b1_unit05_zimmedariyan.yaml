review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Hi's fifth B1 unit (spine outcome:
    universal.b1.workplace.describe_responsibilities_and_updates, confirmed
    by direct read of universal_spine.yaml lines 2133-2158: can_do, all four
    modalities, and all four assessment_requirements --
    understand_responsibility_or_update/state_own_responsibility_or_update/
    read_responsibility_or_update/write_responsibility_or_update -- read in
    full before designing this unit's exercises. Prerequisite
    universal.a2.employment.attend_job_interview is hi's own
    a2_unit25_interview.yaml, confirmed satisfied (Arjun was offered and
    accepted the job there). Continues Priya/Arjun directly: Arjun is now
    employed at the office job from a2_unit25, and this unit is the natural
    next step of that storyline -- describing what he actually does there.

    Central B1 grammar decision (this unit's whole reason for existing): the
    present-continuous "-रहा/रही/रहे + है/हैं" construction (verb stem +
    continuous participle + auxiliary), used for real-time status updates
    ("काम चल रहा है" -- work is in progress). Confirmed genuinely NEW to this
    course by a fresh grep of every hi realization file for 'रहा है'/'रही
    है'/'रहे हैं' before writing: zero prior teaching hits anywhere in the
    corpus (one file, a1_unit19_weather.yaml, explicitly flags in its own
    review notes that this exact progressive construction "would be new" and
    deliberately did not teach it -- confirming this unit is the first to
    actually build it). Lesson01 sets up the responsibility vocabulary
    (ज़िम्मेदारी, प्रोजेक्ट, टीम) plus a disclosed dual-use of देखना
    ("to see/watch", taught via फ़िल्म देखना in unit11) idiomatically meaning
    "to look after / be in charge of" (टीम का काम देखना) -- a genuine,
    standard second sense of an already-known verb, same disclosure pattern
    already used for से (from/with, a1_unit12) and क्या (what/yes-no marker,
    a1_unit12). Lesson02 teaches the central continuous-aspect grammar itself
    and applies it to all three status categories the spine outcome's own
    listening assessment_requirement names explicitly ("complete, in
    progress, or delayed"): चल रहा है (in progress, new), पूरा/पूरी हो गया/
    गई है (complete, composing three already-known pieces -- अच्छा/अच्छी-
    style adjective agreement since unit01, गया/गई past-intransitive since
    a1_unit12, and है for present perfect -- disclosed as composition, not
    new grammar), and देर हो रही है (delayed, reusing देर itself from
    b1_unit01 and applying this lesson's own new continuous construction to
    it). A second disclosed dual-use: गया/गई in "हो गया/गई है" functions as
    a completive light verb ("has become/happened"), distinct from its
    literal "went" sense taught in a1_unit12 -- both are genuine, standard
    Hindi uses of the same participle, flagged directly in lesson02's own
    grammar note so a learner doesn't conflate the two. Lesson03 applies
    everything in a professional-register dialogue: Arjun and a workplace
    colleague (सहकर्मी, a role-label speaker matching a2_unit25's own
    "Manager" precedent rather than inventing a new personal name), meeting
    the spine outcome's "ask a colleague for professional help" requirement
    by reusing सकते (from b1_unit02's सकना paradigm, आप-agreement) rather
    than introducing new modal grammar.

    सहकर्मी's own dialogue lines are deliberately written to never require a
    first-person gendered verb form (सकता/सकती is 1st-person-agreeing, and
    सहकर्मी's gender is intentionally left unstated, matching a2_unit25's
    मैनेजर precedent of avoiding self-referential gendered verbs for an
    unspecified-gender stranger character) -- confirmed by re-reading every
    सहकर्मी line below before finalizing: none contains a 1st-person सकता/
    सकती/करता/करती-class verb.

    Tokenizer-fragmentation discipline: this file is fully self-contained,
    matching b1_unit01-04's own precedent -- every literal string used in
    any exercise's tested_text/word_bank is separately declared via this
    file's OWN introduced_tokens, never assumed carried over from another
    file (including basic words a real learner already knows, e.g. मैं/का/
    है/हूँ, redeclared fresh here). Verified by checking the compiler's own
    tokenize() regex (`[\w‌]+`) against every new literal before
    writing exercises -- ज़िम्मेदारी and सहकर्मी both fragment into multiple
    pieces under that regex, which is harmless as long as the exact literal
    string tested is separately declared, which it is throughout.
    `Dialogue`/`reading`-kind teaching cards' own target text and exercise
    `prompt.target_blocks` are NOT checked by validate_untaught_vocabulary
    (confirmed by re-reading that function directly, matching every prior hi
    unit's documented finding) -- lesson03's dialogue and reading passage use
    a couple of richer, untested words (माँगी, हफ़्ते) freely since neither
    string is ever used as an exercise's own tested_text.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    structurally inapplicable, same as every prior hi unit -- hi dialogue
    content carries no media_asset_key (plain TextBlocks), and all three
    listen_select exercises are single standalone utterances with their own
    dedicated media_asset_key, not pulled from the dialogue clip.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): exactly two facts, restated but never
    contradicted -- (1) Arjun looks after his team's work on a project
    (lesson01's teaching phrase, lesson03 dialogue line02, and the reading
    card's own "अर्जुन...एक प्रोजेक्ट की टीम का काम देखता है"); (2) the
    report is delayed and Arjun asks his colleague for help (lesson02's देर
    teaching, lesson03 dialogue line04, and the reading card's closing "अर्जुन
    ने अपने सहकर्मी से मदद माँगी है"). No exercise or card anywhere states a
    conflicting status (e.g. the report is never separately claimed complete
    once the delay is established).

    fill_in_blank ambiguity check (§17): lesson01's blank (प्रोजेक्ट, frame
    "मैं यह ___ देखता हूँ।") -- candidates प्रोजेक्ट/टीम/ज़िम्मेदारी are all
    genuinely different nouns (not synonyms), disambiguated by the English
    instruction's own translation cue ("Complete: I look after this
    project."), matching this course's established open-vocabulary-slot
    convention. lesson02's blank (देर, frame "रिपोर्ट में ___ हो रही है।")
    -- देर होना is a fixed idiom; neither पूरा/पूरी (which pairs with हो
    गया/गई, not हो रही, a different aspect) nor any other noun this file
    teaches grammatically fits this exact continuous frame, unambiguous by
    idiom and aspect together, not a true-synonym collision.

    Word-order duplicate-token check: every word_order exercise's word_bank
    below has zero repeated tokens (checked by hand).

    Not yet native-speaker or fresh-context reviewed -- status left honestly
    as unreviewed.

