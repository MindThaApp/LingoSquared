  human_reviewed: false
  source_note: >-
    `firecrawl --status` checked before authoring, still 0/1,000 credits
    this billing cycle -- same established-conventions-only fallback as
    the other three hi B1 units this session (see
    hi/b1_unit01_zaroorat.yaml's own note for the full account). Every
    sentence below is this session's own fresh authoring of Modern
    Standard Hindi, nothing adapted or copied from any source.
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Hi's fourth B1 unit (spine outcome:
    universal.b1.debate.agree_disagree_with_reasons, confirmed by direct
    read of universal_spine.yaml lines 2006-2031; prerequisite
    universal.a2.opinions.give_opinions_with_reasons is this course's own
    a2_unit21_raay, confirmed satisfied). Continues Priya/Arjun on तुम
    terms; scenario is a small everyday disagreement -- whether to try a
    new restaurant this week -- deliberately low-stakes so the grammar,
    not the topic, carries the unit.

    Central B1 grammar decision: two layers, matching the spine outcome's
    own two-part can_do text ("state agreement/disagreement... AND
    support your own position with a reason, using a subordinate
    that-clause to report or reference the other person's view").
    Lesson01 teaches the base agree/disagree vocabulary itself (सहमत/
    असहमत होना) plus reason-giving with क्योंकि (because) -- both
    genuinely new to hi (confirmed by a fresh grep of every hi
    realization file for 'सहमत'/'क्योंकि' before writing: zero hits
    anywhere in the corpus; A2's own opinion-giving unit,
    a2_unit21_raay, teaches STATING an opinion but never agreeing/
    disagreeing with someone else's). Lesson02 teaches the outcome's
    other half: an embedded कि-clause referencing what the other
    person said or a stated position ("मुझे लगता है कि...", "तुमने कहा
    कि..."), reusing कि itself (first taught in this course's own
    b1_unit02_kshamata.yaml, redeclared here per this file's own
    self-containment discipline) but combining it with new vocabulary
    (लगता, तुमने + कहा -- the ने-ergative past, reusing the ergative
    MECHANISM hi's A2 course already established, not reteaching ergative
    marking itself, just applying it to a new verb). Lesson03 applies
    both layers together in a Priya/Arjun dialogue about the restaurant,
    deliberately reusing this course's own established चाहिए (unit01)
    and सकते (unit02) constructions in the SAME dialogue to show a
    learner these B1 pieces compose naturally, not just in isolation.

    Tokenizer-fragmentation discipline: this file is self-contained, same
    as b1_unit01/02/03. Verified सहमत/असहमत fragment as single opaque
    tokens (both contain no Devanagari matras splitting them further, an
    exception to the fragmentation pattern seen elsewhere in this course)
    while रेस्टोरेंट/तुमसे/तुमने fragment into several short pieces --
    handled the same way as every prior unit: every exact literal string
    used in tested_text/word_bank is separately declared in this file's
    own introduced_tokens, never relying on fragment-set collision.
    Confirmed the `taught` set accumulates across the whole file, so
    lesson03 freely reuses lesson01/02's declared tokens plus this
    course's already-established चाहिए/सकते (redeclared fresh in this
    file per the standing self-containment rule, since cross-file
    coverage is never assumed).

    Dialogue/reading-kind teaching cards' own target text is not checked
    by validate_untaught_vocabulary -- lesson03's dialogue and reading use
    a few richer words (समीक्षाएँ "reviews", आख़िर में "in the end", सिर्फ़
    "only") freely, since none of those strings is ever used as an
    exercise's own tested_text.

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit (no media_asset_key on dialogue content; both
    listen_select exercises are single standalone utterances with their
    own dedicated media_asset_key).

    Cross-check of every concrete fact stated (AUTHORING_GUIDE §11):
    exactly two facts, restated but never contradicted -- (1) Arjun's
    stated reason for disagreeing is that the food is expensive (dialogue
    line02 and the reading passage's own consistent "उसे लगा कि खाना
    महंगा होगा"); (2) Arjun ultimately agrees to try it once (dialogue
    line04 and the reading passage's own "आख़िर में अर्जुन सहमत हो गया"),
    never contradicted by a later "he refused" statement anywhere in the
    unit.

    fill_in_blank ambiguity check (§17): lesson01's blank (असहमत, frame
    "मैं तुमसे ___ हूँ, क्योंकि यह महंगा है।") -- सहमत (agree) is the
    only other candidate this file's own vocabulary pool offers for this
    exact slot, and it's semantically excluded by the frame's own reason
    clause (a high price is a reason to disagree, not agree, with trying
    something) -- genuinely disambiguated by the frame's own content, not
    a true-synonym collision. lesson02's blank (कहा, frame "तुमने ___ कि
    नया रेस्टोरेंट अच्छा है।") -- no other ने-past verb is introduced
    anywhere in this file that could grammatically slot into this exact
    frame; unambiguous.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

course:
