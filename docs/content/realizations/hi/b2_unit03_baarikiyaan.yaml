    Targets universal.b2.discourse.express_nuance_with_hedging_and_
    emphasis: soften or strengthen a statement so the same content can
    be delivered tentatively, neutrally, or emphatically. Theme:
    continuing the Priya/Arjun workplace canon -- giving feedback on a
    presentation/report, first hedged, then emphatic, and a short review
    text that mixes both registers. Lesson arc: L01 softening a blunt
    statement (थोड़ा, कुछ हद तक, ज़रा); L02 formulating carefully with
    a contrast frame (ऐसा नहीं है कि...बल्कि..., पूरी तरह से...नहीं);
    L03 emphasis words (बिल्कुल, सचमुच, ही, सबसे); L04 focus
    constructions (असल में, सबसे ज़रूरी बात, सिर्फ़...ही); L05 a
    review text mixing hedges and emphasis; L06 the culminating dialogue
    where Priya delivers the SAME claim about a report first hedged,
    then (pressed by Arjun) emphatically -- the exact "deliver the same
    content tentatively vs. emphatically" requirement this outcome
    names. Register: तुम throughout, matching units 01-02 and hi's B1
    canon. Character-canon check performed: grepped this course's own
    units 01-02 and hi's b1_unit*.yaml for Priya/Arjun facts before
    writing -- both remain colleagues who use तुम with each other; this
    unit adds no new biographical facts about either. Gender-agreement
    design note: every 1st-person production prompt in this unit uses an
    invariant construction (है/हूँ copula, दात-experiencer पसंद है,
    invariant adjectives बिल्कुल/सचमुच/ज़रूरी/शानदार/मुख्य) -- no
    1st-person prompt requires a करता/करती-class or गया/गई-class
    choice. The one recurring gendered noun (प्रेज़ेंटेशन, fixed
    feminine) drives agreement in लंबी/थी/अच्छी/शानदार-with-थी
    throughout, never the speaker's gender.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with b2_unit03.yaml. Fixes: lesson01.exercise03 matching pairs
    had synonymous rights (थोड़ा 'a little / somewhat' vs ज़रा 'a bit') ->
    ज़रा pair replaced by थी 'was (feminine)', थोड़ा right narrowed to 'a
    little'; lesson03/04 matching ही 'precisely / only' collided with
    सिर्फ़ 'only / just' -> ही right is now 'precisely (emphasis
    particle)'; lesson05 reading_comprehension x4 never showed the passage
    -> passage added as a hi prompt block; lesson04.exercise06
    underdetermined (सिर्फ़ only) -> prompt pins सिर्फ़ and यही. Priority
    checks verified: प्रेज़ेंटेशन feminine agreement consistent everywhere
    incl. lesson05 reading; comma variants are redundant (grading folds
    internal commas); lesson06 hedged/emphatic pair keeps the same
    proposition; ठीक/गलतियाँ/परफेक्ट byte-identical throughout. Native-
    speaker check needed: (a) थोड़ा लंबी vs the more usual agreeing थोड़ी
    लंबी (tested text kept; थोड़ी accepted in free-text answers); (b)
    naturalness of 'शायद रिपोर्ट में कुछ हद तक गलतियाँ हैं' (कुछ हद तक
    with an existential clause); (c) प्रेज़ेंटेशन gender (many speakers
    use masculine).

    Second-pass review 2026-10-19: 1 fix - lesson05 matching pair आए
    'turned out / came' gave a sense आना does not have -> 'came (पसंद आए =
    were liked)' (mirrored in overlay). NATIVE FLAGS: lesson06 dialogue --
    Priya answers Arjun's 'why do you think so?' with ठीक है, असल में...
    and no reason, which may read oddly; plus the carried-over थोड़ा/थोड़ी
    लंबी, कुछ हद तक गलतियाँ and प्रेज़ेंटेशन gender items; Priya-as-
    teacher canon vs this unit's report/presentation workplace frame.

