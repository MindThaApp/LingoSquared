review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Hi's seventh B1 unit (spine outcome:
    universal.b1.social.give_advice_and_make_suggestions, confirmed by
    direct read of universal_spine.yaml: can_do, all four modalities, and
    all four assessment_requirements -- understand_advice/give_advice/
    read_advice/write_advice -- read in full before designing this unit's
    exercises). Continues Priya/Arjun directly, तुम-register throughout
    (matches every prior B1 unit's own precedent; grepped
    docs/content/realizations/hi/b1_unit0*.yaml speaker: lines before
    writing -- only Priya, Arjun, and unit05's Sahkarmi exist in the hi
    lane; this unit reuses Priya/Arjun only, no new named character).

    Three advice constructions, spanning the can_do's own explicit
    "if I were you / you should / how about" range: (1) तुम्हें...चाहिए
    ("you should"), a direct, disclosed reuse of unit01's चाहिए obligation
    mechanism repurposed for advice rather than self-obligation; (2)
    अगर मैं तुम्हारी जगह होता, तो... ("if I were you..."), a disclosed
    extension of unit03's अगर...तो conditional mechanism with होता (also
    unit03) plus genuinely new vocabulary (जगह, तुम्हारी); (3) क्यों न
    तुम...? ("why don't you...?"), a genuinely new suggestion construction
    using the subjunctive (सोओ). Lesson03 combines all three plus the
    outcome's required response range (accept: "मैं कोशिश करूँगी", and a
    follow-up question).

    Tokenizer-fragmentation discipline: file is fully self-contained,
    matching every prior hi B1 unit's own precedent -- every literal
    string used in any exercise's tested_text/word_bank is separately
    declared via this file's OWN introduced_tokens, including reused words
    (चाहिए, अगर, तो, होता), redeclared fresh here.

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit -- hi dialogue content carries no media_asset_key
    (plain TextBlocks), and all three listen_select exercises are single
    standalone utterances with their own dedicated media_asset_key, not
    pulled from the dialogue clip.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): single consistent thread -- Priya has trouble
    sleeping (stated lesson01, restated consistently lesson03: "मुझे
    नींद नहीं आती"); Arjun gives three pieces of advice across the unit,
    never contradicted; Priya's response is a consistent acceptance
    ("मैं कोशिश करूँगी") plus one follow-up agreement ("यह अच्छा विचार
    है"), never a decline (the outcome only requires the unit's exercises
    to cover the accept/decline/follow-up RANGE across its assessment
    items collectively, not every dialogue turn -- lesson03's culminating
    writing_prompt exercise explicitly asks for an accepting reply).

    Gender-agreement check: transitive-infinitive-object agreement with
    चाहिए is exercised deliberately (पीनी agreeing with feminine कॉफ़ी,
    contrasted with the intransitive सोना which does not inflect) --
    two grammar_check exercises drill exactly this contrast, matching the
    course's established चाहिए-agreement discipline (unit01).

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed.

