  register_policy: >-
    Continues unit01-07's aap/tum split. This unit's dialogue (lesson03)
    stays entirely in तुम between Priya and Arjun -- unlike unit07, no
    new stranger character is introduced here, so there is no fresh aap
    exchange to demonstrate; the aap-with-strangers pattern already
    established via unit07's दुकानदार remains the standing precedent for
    any future unit that introduces another stranger. Gender agreement
    (अच्छा/अच्छी, चाहता/चाहती, मेरा/मेरी) is deliberately NOT touched in
    this unit -- every place noun taught here (घर, स्कूल, अस्पताल, बैंक,
    पार्क, स्टेशन, डाकघर) is masculine, keeping this unit focused
    squarely on its own spatial-location outcome rather than reopening
    the gender point already taught at length in units 01/05/07.

