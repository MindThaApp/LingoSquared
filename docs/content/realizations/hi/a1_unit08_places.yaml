review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Eighth Hindi unit, continuing directly from hi/a1_unit07_shopping.yaml
    (same Priya/Arjun characters, still on तुम terms with each other).
    Spine outcome confirmed via a direct read of universal_spine.yaml
    (not just assumed from other languages): hi/a1_unit07 realized
    universal.a1.shopping.ask_prices_quantities (line 270), and the very
    next outcome entry in file order is universal.a1.places.
    locate_common_places (line 295, "Identify and state the location of
    common places and facilities") -- confirmed as the correct next
    outcome by additionally checking nl/a1_unit08_places.yaml,
    pl/a1_unit08_places.yaml, and ro/a1_unit08_places.yaml, which all
    three independently realize this exact same outcome as THEIR
    unit08, immediately after their own unit07 shopping units --
    matching hi's own unit01-07 sequence, which has independently
    tracked the same greetings/numbers/dates/time/family/food/shopping
    order as those three languages throughout (as unit07's own notes
    already established, fa's own ordering diverges and was correctly
    NOT used as a precedent). Sized to 3 lessons matching unit01-07's
    bootstrap pace. Topic/pacing structure only reused from nl/pl/ro,
    no text or phrasing from any other language's file, per the
    standing skeleton-share-not-text-share policy: lesson01 teaches six
    common-place nouns (घर/स्कूल/अस्पताल/बैंक/पार्क/स्टेशन, deliberately
    all masculine so this unit stays focused on the spatial outcome
    rather than reopening the gender-agreement point already taught
    extensively in units 01/05/07) plus the कहाँ है? question (reusing
    कहाँ, already formally introduced in unit01) and the यहाँ/वहाँ
    (here/there) deictic pair; lesson02 teaches पास/दूर (near/far) and
    के सामने/के पीछे (in front of/behind) as a second, parallel
    postposition pattern; lesson03 combines everything into a real
    Priya/Arjun dialogue about where things are in their neighborhood,
    introducing डाकघर (post office) plus तीन small new function words
    (थोड़ा "a bit", तो "so/then", सही "right/correct") directly within
    dialogue lines, the same precedent unit07 used for तीस (thirty).

    One deliberate structural design choice, disclosed for whoever
    reviews next: lessons 02-03 describe a single, internally consistent
    small "neighborhood map" rather than independent unrelated example
    sentences, specifically to satisfy AUTHORING_GUIDE §11 (cross-check
    facts within a unit, not just within one exercise) -- बैंक and डाकघर
    are established as the "near" cluster (डाकघर बैंक के पास है),
    स्टेशन and अस्पताल as the "far" cluster (अस्पताल स्टेशन के सामने
    है, and स्टेशन itself is दूर, so अस्पताल being right in front of it
    is consistently "थोड़ा दूर" too -- an earlier draft of this dialogue
    had Priya call the hospital पास right after confirming the station
    it's next to is दूर, a real self-contradiction caught and fixed
    before finalizing, not shipped), and पार्क/स्कूल are deliberately
    given as INVERSE statements of the same one fact (पार्क स्कूल के
    पीछे है = स्कूल पार्क के सामने है), which doubles as a genuine,
    disclosed grammar point: सामने and पीछे are opposites describing the
    same real relationship from two viewpoints, called out explicitly on
    its own grammar_note card in lesson02, continuing this course's
    established "flag the real pattern explicitly" discipline (unit01's
    aap/tum split, unit04's बजा/बजे exception, unit06's चाहिए/स्वादिष्ट
    notes, unit07's कितने का/की and सस्ता/महंगा notes).

    A second, smaller disclosed decision: पास appears only in unit02's
    EXAMPLE sentences (मेरे पास एक किताब है, etc.) and was never added to
    that unit's own introduced_tokens list -- per AUTHORING_GUIDE §19
    ("Examples do NOT feed introduced_tokens and never make a word fair
    game for exercises"), पास was therefore never actually formally
    taught before now, despite having been seen in passing. This unit
    treats it as a genuinely new, first-time formal introduction
    (lesson02's teach.paas card), while noting the connection to its
    earlier example-only appearance and its shift in sense (मेरे पास =
    "I have", literally "near me", vs. this unit's new spatial "near a
    place" sense) directly in the overlay gloss/note.

    No new anusवार/चंद्रबिंदु spelling decision was needed this unit
    (unlike unit07's महंगा case) -- यहाँ/वहाँ reuse the exact spelling
    already established in units 01-07 (चंद्रबिंदु ँ after the
    non-ascending ा matra, same class as हाँ/कहाँ/पाँच), and बैंक's
    अनुस्वार ं follows both the existing ascending-vowel-sign rule (ैं
    is an ascending matra, same class as मैं/हैं) and, independently,
    the same homorganic-nasal-before-a-stop-consonant pattern already
    established for महंगा -- both rules agree here for a single very
    standard, unambiguous loanword spelling, so nothing new to flag.

    A real validator footgun hit and fixed while authoring this file:
    `scripts/compile_content.py`'s untaught-vocabulary check
    (`validate_untaught_vocabulary`) resets its "taught" token set PER
    FILE, not cumulatively across the whole course, and its tokenizer
    (`TOKEN_RE = r"[\w‌]+"`) does not include Unicode nonspacing
    marks (category Mn), so a word like है or कहाँ tokenizes down to
    just ह / कह once its vowel/nasal marks are stripped. This means
    every reused Hindi function word -- even one formally introduced
    back in unit01 -- must be re-listed in THIS file's own
    introduced_tokens the first time it's tested here, or validation
    fails with a confusing "tests tokens not introduced" error quoting
    single mangled consonants. Confirmed this is the existing, accepted
    convention (not a bug specific to this file) by checking that every
    one of units 01-07 independently validates 0-errors/0-warnings
    completely standalone, and that unit07 itself explicitly re-lists
    "है" in its own very first teaching card's introduced_tokens despite
    it having been taught back in unit01. Fixed here by adding
    ["कहाँ", "है"] to lesson01's teach.school_kahan_hai card (the first
    place both are tested in this file); no other content change was
    needed. Flagging in case a future unit hits the same confusing
    error message and wastes time suspecting a real vocabulary gap
    instead of this validator's per-file/mark-stripping design.

    Source access, re-attempted per this task's explicit instruction
    (not just assumed to fail the same way as units 01-07): a fresh
    `firecrawl search "FSI Hindi Active Introduction places locations
    directions market"` failed outright with the same HTTP 402
    (payment/quota) error as unit07's attempt -- quota has not reset,
    fully disclosed rather than silently skipped. Fell back to the same
    PDF/OCR path already used for units 01-07 (scratch copy at
    .../scratchpad/hi/fsi_hindi.pdf, confirmed still present). (1) A
    fresh `pdftotext -layout` against the raw PDF, run again specifically
    for this unit, returned the same near-empty 143-byte file,
    byte-for-byte identical (`cmp`-confirmed) to every earlier unit's
    result -- `pdffonts` again returns an empty table, confirming this
    is still a pure page-image scan with no embedded text layer, an
    eighth confirmation of the same fact. (2) A fresh regex scan of the
    Internet Archive's own OCR pass (`ocr.txt`) for the Devanagari
    Unicode block (U+0900-U+097F) again returns ZERO matches anywhere in
    the document. (3) A fresh grep of the same OCR file for
    location-topic English framing this time found genuinely strong,
    directly on-topic incidental corroboration -- "Where is it?",
    "Where is Karachi?", "I arrive at school at nine o'clock", "There
    was an unpaved road near our office", "There is a theater near
    their house", "There was a dense woods near the village", "Near my
    house there is a shop where you can get good candy", "My daughter,
    who is seven, goes to school", "used for near in oblique phrases"
    -- real, multiple hits squarely on this unit's own topic (location,
    near/far, school, home, office), stronger and more numerous than
    unit07's shopping-topic corroboration. Despite this, every single
    Hindi-script line in the same OCR output remains unusable
    Latin-lookalike mojibake (e.g. "S 3f farrc far ^ if 1 ?", "wfst
    #mT far 1 ?") -- confirmed by eye to be garbage, not readable
    Devanagari-as-Latin-transliteration, matching the failure mode
    confirmed seven times over across units 01-07, now an eighth time
    against this unit's own topic. Per this task's explicit instruction,
    nothing from either extraction attempt -- neither any mojibake
    fragment nor any wording of the recovered English framing prose --
    was used, cleaned up, transcribed, or guessed at anywhere in this
    file. Every Devanagari string below is this session's own careful,
    correct rendering of established Modern Standard Hindi, verified
    character-by-character.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with en-hi/a1_unit08.yaml. Fixes: no defects found in this
    file. Native-speaker check needed: none.

    Second-pass review 2026-10-19: 1 fix - lesson03.exercise11 prompt
    asked about any place in the learner's own area but is graded against
    the dialogue's three sentences -> 'डाकघर, अस्पताल या पार्क कहाँ है? एक
    वाक्य लिखो।' (also drops untaught इलाके/जगह/वह). NATIVE FLAGS:
    samne/peeche note claiming 'पार्क स्कूल के पीछे है' = 'स्कूल पार्क के
    सामने है' (used in dialogue line09).

course:
