review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Sixth Hindi A2 unit (spine outcome:
    universal.a2.employment.attend_job_interview, confirmed by direct read
    of universal_spine.yaml lines 809-832: can_do, all four modalities, and
    all four assessment_requirements -- understand_interview_question/
    answer_interview_question/read_job_posting/write_availability_note --
    read in full before designing this unit's exercises). Continues
    directly from hi/a2_unit24_marammat.yaml (same Priya/Arjun characters
    remain the course's throughline, still on तुम terms with each other,
    though this unit's own scenario is Arjun alone). Introduces hi's fifth
    A2 stranger character, मैनेजर (manager, a gender-invariant loanword
    matching the established डॉक्टर/इंजीनियर precedent from unit17/23), in
    आप register, matching the formal-official convention already used for
    unit20's क्लर्क/unit22's कर्मचारी/unit23's डॉक्टर/unit24's मकान मालिक.

    Scenario: Arjun interviews for a job -- the interviewer asks about his
    experience and availability, offers him the job, and Arjun asks a
    clarifying question about when to start; a short written job posting
    is also read. Directly serves all four assessment_requirements
    (listening: understand what the interviewer is asking about;
    speaking: describe experience/availability and ask a clarifying
    question; reading: interpret a job posting; writing: state
    availability).

    Central A2 grammar decision (this unit's whole reason for existing):
    the सकना modal ("can / be able to"), introduced for the first time in
    this course (confirmed by a fresh grep of every hi realization file
    for 'सकना'/'सकता'/'सकती'/'सकते' before writing this note -- zero hits
    anywhere in the corpus). सकना governs the BARE VERB STEM ("कर सकता
    हूँ", stem कर + सकता), a deliberate, explicitly disclosed contrast
    against unit23's चाहिए, which governs the FULL INFINITIVE ("करना
    चाहिए") -- lesson02's own grammar note states this contrast directly,
    and lesson02.exercise10's grammar_check exercise directly tests it
    (the wrong sentence swaps in the infinitive करना where the bare stem
    कर belongs). Deliberately scope-narrowed to exactly ONE live-tested
    form, सकता (masculine singular, matching Arjun as the only character
    who ever answers this way in this unit) -- the interviewer's own
    dialogue line freely uses सकते (आप-agreement) but that appears only
    in a dialogue prompt, never as an exercise's own tested_text (see the
    tokenizer-fragmentation paragraph below for why that's safe), so
    सकती/सकते are never actually exercised live, matching this course's
    own standing scope-narrowing discipline (unit17's करते/करती split,
    unit20's ने-ergative masculine-only scope, unit23's चाहिए
    masculine-only scope, unit24's होगा-only future scope).

    A deliberate scope decision, disclosed here rather than left silent:
    an earlier draft of this unit also taught घंटा/घंटे (hour/hours) and
    the possessive-agreement के (masculine-plural का, needed for "काम के
    घंटे", work hours) as a second grammar surface for the "ask a
    clarifying question" requirement -- dropped before finalizing to keep
    this unit's new-grammar budget to exactly one point (सकना), matching
    every other A2 unit's own single-central-decision discipline. The
    "ask a clarifying question about the role" requirement is instead
    served by "मुझे कब शुरू करना है?" (When do I need to start?), which
    reuses the ALREADY-ESTABLISHED "[infinitive] + है" obligation
    construction (unit16's "मुझे डॉक्टर के पास जाना है", now applied to
    करना) -- genuinely zero new grammar, not a workaround.

    Vocabulary reuse audited before writing (grep-confirmed): आपको
    (unit20/22/23), कितने/साल (unit02), का (widely established, e.g.
    unit18/20), मुझे/तीन (unit02/06), सोमवार/को (unit03/04), कब (unit23),
    है/हैं/मैं/हूँ (unit01 onward) are all real prior vocabulary,
    confirmed by grep before use and re-declared in THIS file's own
    introduced_tokens per the standing per-file-reset tokenizer
    discipline. New words this unit: अनुभव (experience), नौकरी (job,
    distinct from काम "work/task" already known since unit10/17 --
    नौकरी specifically means an employment position), इंटरव्यू
    (interview, a gender-invariant loanword matching the established
    डॉक्टर/इंजीनियर/बैंक/फ़ॉर्म loanword-integration precedent), मैनेजर
    (manager, same loanword class), शुरू (start -- appeared once before,
    in unit01's fixed phrase "चलो शुरू करते हैं", but never formally
    taught/declared as its own standalone vocabulary item until now,
    matching unit02's own कमरे precedent for "used informally once,
    taught formally later"), कर (bare verb stem of करना, a distinct
    surface form from करना/करता/करते), सकता (the सकना modal itself),
    करना (the plain infinitive, needed for the "मुझे कब शुरू करना है"
    obligation phrase).

    Tokenizer-fragmentation discipline (per this task's explicit
    instruction, and unit20-24's own established precedent): every
    literal surface form tested anywhere in this file's exercises
    (tested_text or word_bank) has its own explicit `introduced_tokens`
    declaration earlier in the SAME file -- verified this round by
    actually running the compiler's own `tokenize()` regex against every
    planned new word (and against likely inflected/oblique variants, e.g.
    confirming "इंटरव्यू" and "करना" fragment identically to any form
    used in an example) in a standalone Python check before writing any
    exercise, not assumed clean by eye. Several of this unit's new words
    fragment badly under that regex (e.g. नौकरी -> two fragments,
    इंटरव्यू -> three, मैनेजर -> three, अनुभव -> two) -- this is harmless
    AS LONG AS the exact same literal string is declared via
    introduced_tokens as appears in the exercise's own tested_text
    (fragment-set comparison is symmetric, confirmed by direct check).
    `Dialogue`/`reading`-kind teaching cards' own `target` text and
    exercise `prompt.target_blocks` are NOT checked by the compiler's
    `validate_untaught_vocabulary` (only `tested_text`/`word_bank` are,
    confirmed by re-reading that function directly) -- so lesson03's
    dialogue (आपकी नौकरी है, सकते, सवाल) and reading card use richer,
    more natural vocabulary freely without needing separate declarations,
    since none of those specific strings is ever used as an exercise's
    own tested_text.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    performed explicitly, structurally inapplicable the same way it was
    in unit20-24 -- hi dialogue content carries NO `media_asset_key` at
    all (plain TextBlocks), so lesson03's two dialogue_comprehension
    exercises cannot trigger this bug class by construction. The three
    listen_select exercises (lesson01.exercise04, lesson02.exercise04,
    lesson03.exercise06) are each a single standalone, non-dialogue
    utterance with its own dedicated media_asset_key and no other
    speaker/other lines in the same clip -- structurally cannot trigger
    this bug class either.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): this unit establishes exactly two facts,
    restated (never contradicted) across the dialogue, the reading card,
    and the exercises: (1) Arjun has three years of experience (तीन साल
    का अनुभव) -- stated in lesson01, the lesson03 dialogue line02, and
    lesson03.exercise08/exercise10; (2) Arjun can start on Monday
    (सोमवार) -- stated in lesson02, the lesson03 dialogue line04, and the
    job-posting reading card (which independently states the job starts
    Monday, "सोमवार से शुरू" -- consistent with, not contradicting,
    Arjun's own stated availability). No exercise or card ever gives a
    conflicting experience length or start day.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below has zero repeated tokens (checked by hand).

    fill_in_blank ambiguity check (§17): lesson01's exercise09 blank
    (अनुभव, frame "मुझे तीन साल का ___ है।") -- नौकरी is the only other
    noun this unit teaches, but नौकरी is feminine and would require की
    not का ("तीन साल की नौकरी" is grammatically well-formed but means
    something different, "a three-year job", not a candidate for this
    slot's का-marked frame), so the frame's own का already rules out
    नौकरी on gender-agreement grounds alone; unambiguous. lesson02's
    exercise09 blank (सकता, frame "मैं सोमवार को शुरू कर ___ हूँ।") has no
    other modal or participle-shaped word introduced anywhere in this
    file that could grammatically slot into this exact frame; unambiguous
    by frame alone.

    This unit is NOT yet native-speaker or fresh-context reviewed --
    status left honestly as unreviewed, matching this course's own
    convention for freshly authored content pending that separate pass.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/a2_unit25.yaml. Fixes: no realization
    defects found. Native-speaker check needed: teach.shuru example 'मैं
    काम कल शुरू करता हूँ' (word order / present-for-future naturalness);
    lesson03.exercise09 premise that 'सोमवार शुरू' without को is wrong
    (colloquially common).

    Second-pass review 2026-10-19: 0 fixes. NATIVE FLAGS: still open from
    the first pass -- teach.shuru example 'मैं काम कल शुरू करता हूँ' word
    order; lesson03.exercise09 treats 'सोमवार शुरू' without को as wrong.

    Second-pass follow-up 2026-10-19: speak prompts no longer print the Hindi answer (3 items); variants added: none needed.

