units:
  - content_key: hi.a1.unit14.comparisons
    title: "तुलना"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.comparisons.make_basic_comparisons
    planned_lesson_count: 3

    lessons:
      - content_key: hi.a1.unit14.lesson01.se_tulna
        title: "प्रिया अर्जुन से बड़ी है"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - content_key: hi.a1.unit14.lesson01.teach.arjun_priya_review
            kind: vocabulary
            target: {text: "अर्जुन, प्रिया, है", language_code: hi, direction: ltr}
            introduced_tokens: ["अर्जुन", "प्रिया", "है"]
            example:
              - {text: "अर्जुन ठीक है।", language_code: hi, direction: ltr}
              - {text: "प्रिया ठीक है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.teach.bada_badi_review
            kind: vocabulary
            target: {text: "बड़ा, बड़ी", language_code: hi, direction: ltr}
            introduced_tokens: ["बड़ा", "बड़ी"]
            example:
              - {text: "मेरा बड़ा भाई दिल्ली में रहता है।", language_code: hi, direction: ltr}
              - {text: "मेरी बड़ी बहन दिल्ली में रहती है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.teach.chota_choti_review
            kind: vocabulary
            target: {text: "छोटा, छोटी", language_code: hi, direction: ltr}
            introduced_tokens: ["छोटा", "छोटी"]
            example:
              - {text: "मेरा छोटा भाई अभी छात्र है।", language_code: hi, direction: ltr}
              - {text: "मेरी छोटी बहन अभी छात्र है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.teach.se_comparative_grammar
            kind: grammar_note
            target: {text: "'से' पहले 'यहाँ से सीधे जाओ' (यूनिट 9, matlab 'from') और 'प्रिया से मिला' (यूनिट 12, matlab 'with') में सीखा था; अब यह तुलना के लिए भी आता है: 'X, Y से ADJ है' का मतलब है 'X is more ADJ than Y' -- जैसे 'प्रिया अर्जुन से बड़ी है'।", language_code: hi, direction: ltr}
            introduced_tokens: ["से"]
          - content_key: hi.a1.unit14.lesson01.teach.arjun_bada_phrase
            kind: phrase
            target: {text: "प्रिया अर्जुन से बड़ी है।", language_code: hi, direction: ltr}
            introduced_tokens: []
          - content_key: hi.a1.unit14.lesson01.teach.lamba_lambi
            kind: vocabulary
            target: {text: "लंबा, लंबी", language_code: hi, direction: ltr}
            introduced_tokens: ["लंबा", "लंबी"]
            example:
              - {text: "मेरा भाई लंबा है।", language_code: hi, direction: ltr}
              - {text: "मेरी बहन लंबी है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.teach.agreement_grammar
            kind: grammar_note
            target: {text: "तुलना के वाक्य में विशेषण (जैसे बड़ा/बड़ी, छोटा/छोटी) हमेशा विषय (subject) के लिंग से मेल खाता है, 'से' के बाद वाले शब्द के नहीं -- जैसे 'अर्जुन प्रिया से छोटा है' में 'छोटा' अर्जुन (पुल्लिंग विषय) से मेल खाता है, प्रिया से नहीं।", language_code: hi, direction: ltr}
            introduced_tokens: []
          - content_key: hi.a1.unit14.lesson01.teach.priya_chota_phrase
            kind: phrase
            target: {text: "अर्जुन प्रिया से छोटा है।", language_code: hi, direction: ltr}
            introduced_tokens: []
          - content_key: hi.a1.unit14.lesson01.teach.kaun_ya_review
            kind: vocabulary
            target: {text: "कौन, या", language_code: hi, direction: ltr}
            introduced_tokens: ["कौन", "या"]
            example: {text: "कौन बड़ा है, अर्जुन या प्रिया?", language_code: hi, direction: ltr}
        exercises:
