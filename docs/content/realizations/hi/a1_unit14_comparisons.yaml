    Claude session cannot reuse a prior session's scratch files). A fresh
    regex scan (Python, not eyeballed) of the Internet Archive's own OCR
    pass (`Fsi-HindiActiveIntroduction-StudentText_djvu.txt`, 94KB,
    re-downloaded this session) for the Devanagari Unicode block
    (U+0900-U+097F) returned ZERO matches anywhere in the document --
    confirmed programmatically, consistent with every prior hi unit's
    documented zero-Devanagari-match result; this is the fourteenth such
    confirmation in sequence. Unlike prior units, this scan's English-only
    surrounding prose happened to include a short comparison-grammar
    explanation ("Comparison is expressed with than", worked examples like
    "India is larger than Pakistan", "Kerala is smaller than Madras", and a
    separate "sabse" (most)-superlative aside) -- disclosed honestly because
    it INCIDENTALLY CONFIRMS (does not source) that a से-marked "X, Y से ADJ
    है" construction is the real, standard Hindi comparative, matching this
    unit's independently-designed central grammar point; it also confirms
    real Hindi has a sabse-superlative, which this unit deliberately does
    NOT teach (spine's "basic comparisons" outcome asks for comparatives
    between two familiar things, not superlatives -- scope discipline, not
    an oversight). Every Devanagari string in the OCR pass itself was pure
    mojibake ("€t miff % ^rtt r", "?TR<T 3"fT | I"), confirmed unreadable
    garbage, not usable Devanagari-as-Latin-transliteration -- matching the
    exact failure mode confirmed thirteen times before. Per this task's
    explicit instruction, nothing from either extraction attempt -- neither
    any mojibake fragment nor any wording of the recovered English framing
    prose -- was copied, cleaned up, transcribed, or translated anywhere in
    this file. Every Devanagari string below is this session's own careful,
    correct rendering of established Modern Standard Hindi, verified
    character-by-character (codepoint hex dump run directly against every
    new word before finalizing, see the nasalization discipline paragraph
    below).

    Central grammar decision #1: से's THIRD disclosed sense. से was already
    taught as "from" (unit09, "यहाँ से सीधे जाओ") and as the fixed "meet
    WITH" collocation (unit12, "X से मिलना", a genuine dual usage disclosed
    there). This unit adds a third, equally real sense: से + adjective is
    the standard Hindi comparative, "than" -- "X, Y से ADJ है" means "X is
    more ADJ than Y" (e.g. "अर्जुन प्रिया से बड़ा है", "Arjun is bigger than
    Priya"). Disclosed explicitly via a dedicated grammar_note
    (lesson01.teach.se_comparative_grammar) that names both prior senses by
    unit number before introducing the new one, following unit12's own
    precedent for disclosing से's second sense.

    Central grammar decision #2: the compared-against noun phrase is always
    a bare common noun or a proper name in every sentence in this unit
    (अर्जुन, प्रिया, बैग, टोपी) -- DELIBERATELY never a demonstrative
    pronoun (यह/वह) or a first/second-person pronoun (मैं/तुम) in the
    से-marked slot. This was a considered, disclosed design choice: वह's
    oblique form (उस) and मैं's oblique stem (मुझ, as in "मुझसे") have never
    been taught as a general rule in this course (only the fixed collocation
    "मेरे पास" and the idiomatic "तुमसे मिलकर अच्छा लगा" from unit01 use an
    oblique pronoun form, and neither was ever disclosed as a GENERAL
    declension rule) -- introducing pronoun-oblique comparatives here would
    add real, undisclosed grammar beyond the spine's "basic comparisons"
    scope. Common nouns (बैग, टोपी) and proper names (अर्जुन, प्रिया) never
    decline before से in Hindi, so every से-marked comparison target in this
    unit is safe without teaching oblique case at all. Possessives
    (मेरा/तुम्हारी) are used only in nominative subject position in this
    file (never modifying a से-marked noun), for the same reason -- avoiding
    the undisclosed मेरा→मेरे-style oblique-adjective shift.

    Central grammar decision #3: comparative-sentence adjective agreement
    targets the SUBJECT, never the से-marked compared item -- e.g. "प्रिया
    अर्जुन से छोटी है" uses छोटी (feminine) because प्रिया (the subject) is
    feminine, regardless of अर्जुन's (masculine) gender. Disclosed via a
    dedicated grammar_note (lesson01.teach.agreement_grammar) as a direct,
    explicit extension of the already-established -आ/-ई adjective-agreement
    pattern (मेरा/मेरी, बड़ा/बड़ी, सस्ता/सस्ती), now applied specifically to
    comparative sentences.

    Central grammar decision #4: ज़्यादा generalizes beyond पसंद है. Unit13
    taught "X ज़्यादा पसंद है" (prefer) as a fixed collocation. This unit
    discloses explicitly (lesson02.teach.zyada_mehnga_grammar) that ज़्यादा
    can precede ANY adjective to intensify a comparison -- "बैग टोपी से
    ज़्यादा महंगा है" ("the bag is even more expensive than the hat") uses
    the exact same "X, Y से ADJ है" frame from decision #1, with ज़्यादा
    simply inserted before the adjective. Not a new grammar point, a
    disclosed generalization of an already-taught word's placement rule.

    New vocabulary this unit: लंबा/लंबी (tall/long, lesson01) and नया/नई
    (new, lesson02) -- two adjective pairs, both following the
    already-established -आ/-ई masculine/feminine agreement pattern
    (बड़ा/बड़ी, छोटा/छोटी, सस्ता/सस्ती, महंगा/महंगी), so no new agreement
    RULE is introduced, only two new adjective STEMS applying the existing
    rule. Also formally (re-)declared as this FILE's own introduced_tokens
    (see the tokenizer-footgun paragraph below) though already known
    corpus-wide: अर्जुन, प्रिया, है, कौन, या, मैं, हूँ, और, भी, का.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    performed explicitly. The three listen_select exercises (lesson01.
    exercise04, lesson02.exercise04, lesson03.exercise06) are each a single
    standalone, non-dialogue utterance with no other speaker/other lines in
    the same clip -- structurally cannot trigger this bug class, matching
    unit09-13's own precedent, now applied a sixth time. lesson03's dialogue
    lines themselves carry NO `media_asset_key` at all (plain TextBlocks,
    matching unit08-13's established pattern that hi dialogue is
    text-only, not audio, for dialogue_comprehension purposes) -- the two
    dialogue_comprehension exercises in lesson03 (exercise01/02) are TEXT
    reading-comprehension, each shown line was chosen to directly contain
    its own correct answer (exercise01 shows line03 "हाँ। मेरा बैग महंगा है
    -- यह टोपी से ज़्यादा महंगा है।" and asks what Arjun's bag is like,
    answer directly stated as "महंगा"; exercise02 shows line06 "ठीक है, ठीक
    है! पर टोपी बैग से नई भी है।" and asks what is new, answer directly
    stated as "टोपी") -- neither requires inference across unseen lines, and
    neither distractor is itself a fact stated in the shown line.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11), not just within the dialogue: this unit
    establishes exactly six comparative facts, restated (never contradicted)
    across lessons: (1) Arjun is bigger/older than Priya (lesson01 phrase +
    lesson03 line05 "मैं बड़ा हूँ"); (2) Priya is smaller/younger than Arjun
    (lesson01 phrase, the direct complementary restatement of fact 1, not a
    conflicting claim); (3) Arjun is taller than Priya (lesson01 vocabulary
    example + lesson03 line05 "मैं...लंबा भी हूँ"); (4) the hat is cheaper
    than the bag (lesson02 phrase + lesson03 line02 + priya_note); (5) the
    bag is more expensive than the hat (lesson02 phrase + intensified
    restatement + lesson03 line03, the direct complement of fact 4, not a
    conflict); (6) the hat is newer than the bag (lesson02 phrase +
    lesson03 line06 + priya_note). Every restatement across all three
    lessons and the closing reading note agrees with these six facts; none
    is ever contradicted.

    Nasalization/spelling discipline, disclosed per unit07-13 precedent,
    verified this round via a direct Python codepoint hex dump of every NEW
    word before finalizing (not eyeballed): लंबा (U+0932 U+0902 U+092C
    U+093E) and लंबी (U+0932 U+0902 U+092C U+0940) both use anusvara U+0902
    (a homorganic nasal before the following stop consonant ब) -- correct,
    matches the already-established anusvara convention (हैं/मुझे/तुम्हें/
    पसंद/संगीत from unit13), NOT chandrabindu. नया (U+0928 U+092F U+093E)
    and नई (U+0928 U+0908) carry no nasalization at all -- no decision
    needed, confirmed by the same hex-dump pass. हूँ (reused exactly from
    unit01, U+0939 U+0942 U+0901) correctly keeps its own already-settled
    chandrabindu U+0901 unchanged -- reused, not re-decided.

    Untaught-vocabulary validator footgun (already documented by unit07-13,
    re-confirmed live during this unit's authoring, and directly re-read
    from `scripts/compile_content.py`'s `validate_untaught_vocabulary`
