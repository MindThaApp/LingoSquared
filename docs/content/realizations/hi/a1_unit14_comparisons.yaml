    Word-order duplicate-token check (unit10-13's own standing
    consideration, re-confirmed clean here): every `word_order` exercise in
    this unit uses a word_bank with zero repeated tokens (checked by hand
    against each exercise's own word_bank array below).

    fill_in_blank ambiguity check (AUTHORING_GUIDE §17), including a
    directly-inherited consideration from unit13: unit13 explicitly
    considered and REJECTED blanking ज़्यादा (found it synonym-adjacent
    with बहुत in some frames) and never blanked it in any fill_in_blank.
    This unit hits the exact same risk in lesson02.exercise10's frame
    ("बैग टोपी से ___ महंगा है", intending ज़्यादा) -- ज़्यादा was
    considered and REJECTED for that blank for the same reason (बहुत could
    also grammatically slot into that exact position with a related but
    distinct meaning), so the blank was redesigned to target the ADJECTIVE
