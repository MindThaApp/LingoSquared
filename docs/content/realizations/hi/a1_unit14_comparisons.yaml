    अर्जुन/प्रिया/है via lesson01.teach.arjun_priya_review; कौन/या via
    lesson01.teach.kaun_ya_review; मैं/हूँ via lesson03.teach.main_hun_review;
    और/भी via lesson03.teach.aur_bhi_review; का via lesson03.teach.ka_review.
    Genuinely new words (लंबा/लंबी, नया/नई) and reused-but-file-local words
    (बड़ा/बड़ी, छोटा/छोटी, से, सस्ता/महंगा, सस्ती/महंगी, ज़्यादा, टोपी, बैग)
    were likewise all declared before first tested_text use. Words used
    ONLY in dialogue/example/reading-note TEXT and never in a tested_text
    (देखो-style fillers were deliberately avoided rather than left
    undeclared; ठीक/कल/फिर/मिलते/सच appear only in lesson03's dialogue
    closing lines, never in any tested_text, and were deliberately left OUT
