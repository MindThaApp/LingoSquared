            type: multiple_choice
            tested_text: "लंबा"
            prompt:
              target_blocks:
                - {text: "लंबा", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.exercise02.select_bada_meaning
            type: multiple_choice
            tested_text: "बड़ा"
            prompt:
              target_blocks:
                - {text: "बड़ा", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.exercise03.select_arjun_bada_meaning
            type: multiple_choice
            tested_text: "प्रिया अर्जुन से बड़ी है"
            prompt:
              target_blocks:
                - {text: "प्रिया अर्जुन से बड़ी है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.exercise04.listen_arjun_prese_lamba
            type: listen_select
            tested_text: "अर्जुन प्रिया से लंबा है"
            media_asset_key: hi.a1.audio.comp.arjun_priya_se_lamba_hai.01
            prompt: {target_blocks: []}
          - content_key: hi.a1.unit14.lesson01.exercise05.select_chota_meaning
            type: multiple_choice
            tested_text: "छोटा"
            prompt:
              target_blocks:
                - {text: "छोटा", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit14.lesson01.exercise06.match_lesson01_words
            type: matching_pairs
            tested_text: "बड़ा बड़ी छोटा छोटी लंबा लंबी से कौन"
            prompt: {target_blocks: []}
