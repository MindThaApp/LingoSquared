  notes: >-
    Seventh Hindi unit, continuing directly from hi/a1_unit06_food.yaml
    (same Priya/Arjun characters, still on तुम terms with each other,
    aap register reserved for a new minor character -- a shopkeeper --
    matching this course's own established register discipline of aap
    with strangers). Spine outcome confirmed via universal_spine.yaml:
    hi/a1_unit06 realized universal.a1.food.order_simple_meal, and
    universal.a1.shopping.ask_prices_quantities ("Ask about prices and
    quantities and understand a simple purchase exchange") is the next
    A1 outcome in spine order -- confirmed by checking every other
    language's own unit07: nl/a1_unit07_shopping.yaml,
    pl/a1_unit07_shopping.yaml, and ro/a1_unit07_shopping.yaml all
    independently realize this exact same outcome as THEIR unit07,
    immediately after their own unit06 food units -- hi's own unit01-06
    already independently tracked the same greetings/numbers/dates/
    time/family/food sequence as those three languages (fa's own
    ordering diverges -- introductions split out, places/weather
    inserted earlier -- so fa's unit07/weather was NOT used as the
    pattern here; nl/pl/ro's matching unit01-06 sequence was the
    correct precedent to check). Sized to 3 lessons matching unit01-06's
    bootstrap pace (nl's own unit07 is a larger, mature 6-lesson
    reference-language draft, not hi's current bootstrap stage) --
    topic/pacing structure only reused, no text or phrasing from any
    other language's file, per the standing skeleton-share-not-
    text-share policy: lesson01 teaches shop/market/shopkeeper
    vocabulary plus clothing items and reuses unit06's मुझे...चाहिए
    construction for wanting an item, lesson02 teaches price/quantity
    vocabulary (reusing unit02's इसकी कीमत... construction) plus the
    कितने का/की है idiom and the सस्ता/महंगा (cheap/expensive)
    adjective pair, and lesson03 combines everything into a real
    Priya/Arjun-visit-a-shop dialogue with a new शॉपकीपर character.

    Source access, re-attempted per this task's explicit instruction
    (not just assumed to fail the same way as units 01-06): per the
    project's standing instruction to try Firecrawl first, ran
    `firecrawl search "FSI Hindi Active Introduction shopping market"`
    -- it failed outright with an HTTP 402 (payment/quota) error, so no
    Firecrawl-sourced material was available this round at all (fully
    disclosed, not silently skipped). Fell back to the same PDF/OCR
    path already used for units 01-06 (scratch copy at
    .../scratchpad/hi/fsi_hindi.pdf, confirmed still present and
    byte-identical). (1) A fresh `pdftotext -layout` against the raw
    PDF, run again specifically for this unit, returned the same
    near-empty 143-byte file, byte-for-byte identical (`cmp`-confirmed)
    to every earlier unit's result -- confirms yet again this is a pure
    page-image scan with no embedded text layer (`pdffonts` returns an
    empty table, same as every prior check). (2) A fresh grep of the
    same Internet Archive OCR pass (`ocr.txt`) for shopping-topic
    English framing this time found noticeably STRONGER incidental
    corroboration than unit06's food search did: "price of a book",
    "8,25,000 rupees", "Rice is not available in the market these
    days", "Near my house there is a shop where you can get good
    candy", "They ought to buy books", "We must buy saris"/"We'll have
    to buy saris", "If he has gone to the market", "I get my clothes
    washed", "Leaving the crying girl in the room, they went
    shopping", "on my shirt was broken" -- real, multiple hits
    genuinely on-topic (shop, market, price, buying, clothes), though
    still scattered across pattern-substitution drills rather than one
    clean dedicated chapter heading the way unit05's family chapter
    was found. Despite this being the strongest English-side
    corroboration since unit05, a full regex scan of the same OCR file
    for the Devanagari Unicode block (U+0900-U+097F) again returns
    ZERO matches anywhere in the document -- the actual Hindi text is
    either silently absent or survives only as unusable Latin-lookalike
    mojibake, identical to the failure mode confirmed six times over
    across units 01-06, now confirmed a seventh time against this
    unit's own topic. Per this task's explicit instruction, nothing
    from either extraction attempt -- neither any mojibake fragment
    (none were even found reachable) nor any wording of the recovered
    English framing prose -- was used, cleaned up, transcribed, or
    guessed at anywhere in this file. Every Devanagari string below is
    this session's own careful, correct rendering of established
    Modern Standard Hindi, verified character-by-character (including
    the anusvara-vs-chandrabindu convention already settled in
    units 01-06: chandrabindu (ँ) after non-ascending vowel signs, as
    in हूँ/हाँ; anusvara (ं) after ascending vowel signs, as in
    मैं/हैं/में/कितने). One genuinely new spelling decision this unit
    makes and discloses explicitly: महंगा/महंगी ("expensive") is
    spelled with अनुस्वार (ं), not चंद्रबिंदु, and this is NOT an
    application of the existing vowel-height convention at all -- the
    nasal in महंगा is a class-nasal-before-a-stop-consonant (the ं
    functions as the homorganic nasal ङ् before ग, the same pattern as
    गंगा/मंगल/अंगूठा), which Hindi orthography always writes as
    अनुस्वार regardless of the preceding vowel's height. This is a
    different phonological case from the word-final/vowel-nasalization
    height rule already governing हूँ/हाँ/मैं/हैं/में, not an exception
    to it.

    Two genuine, disclosed grammar-teaching decisions, both
    independently real and uncontroversial Modern Standard Hindi: (1)
    "यह कितने का है?" / "यह कितने की है?" (the fixed shopping idiom for
    "how much is this?") is taught explicitly on its own grammar_note
    card in lesson02, calling out that कितने itself never changes here
    (unlike its unit04 use in कितने बजे, where it questions a specific
    count) -- only the possessive marker का/की changes to agree with
    the item's own gender, the exact same का/की alternation already
    established via मेरा/मेरी and तुम्हारा/तुम्हारी, deliberately drawn
    as an explicit parallel rather than presented as an unrelated new
    pattern. (2) सस्ता/सस्ती and महंगा/महंगी (cheap/expensive) are
    taught as a second load-bearing instance of the same आ/ई gender-
    agreement pattern, with a dedicated grammar_note in lesson02 and a
    grammar_check drill in lesson03 -- continuing the "flag the real
    exception/pattern explicitly" discipline unit01's aap/tum split,
    unit04's बजा/बजे exception, and unit06's चाहिए-never-है/
    स्वादिष्ट-invariant notes already established for this course.
    लesson03 also extends unit01's own "V+ना चाहता/चाहती हूँ" ("I want
    to [verb]") construction (first taught there for योग सीखना चाहता/
    चाहती हूँ) to a new verb, खरीदना ("to buy") -- an explicit,
    intentional reuse of an already-taught grammatical shape rather
    than a new pattern, tying this unit's own new मुझे...चाहिए-for-
    items usage (from unit06) to the earlier want-to-do-an-action
    construction.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with en-hi/a1_unit07.yaml. Fixes:
    lesson02.teach.kitne_ka_ki_note Hindi text was garbled (doubled 'ठीक
    वैसे ही जैसे ... वैसे ही यहाँ भी' clause, and implied मेरा/मेरी
