    changes, paralleling the आ/ई alternation of मेरा/मेरी. Native-speaker
    check needed: महंगा/महंगी is taught with anusvara, but the standard
    dictionary spelling is महँगा/महँगी (the claim above that Hindi
    'always' writes anusvara here is not accurate) -- the overlay now
    accepts both; decide which to display. Also confirm 'मुझे यह टोपी
    चाहिए है' is the right error to drill (colloquially heard).

    Second-pass review 2026-10-19: 1 fix - lesson03.exercise11 Hindi
    prompt said 'एक वाक्य लिखो' (write ONE sentence) but every accepted
    answer is two sentences (item + price) -> 'अपनी खरीदारी के बारे में
    लिखो -- ...'. NATIVE FLAGS: महंगा/महंगी display spelling (standard
    महँगा); 'दुकानदार जी' as a form of address.

