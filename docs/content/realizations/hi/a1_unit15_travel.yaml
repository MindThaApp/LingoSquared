    title: "यात्रा"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.travel.handle_basic_journey
    planned_lesson_count: 3

    lessons:
      - content_key: hi.a1.unit15.lesson01.station_jana
        title: "मुझे स्टेशन जाना है"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: hi.a1.unit15.lesson01.teach.station_mujhe_hai_review
            kind: vocabulary
            target: {text: "स्टेशन, मुझे, है", language_code: hi, direction: ltr}
            introduced_tokens: ["स्टेशन", "मुझे", "है"]
            example:
              - {text: "स्टेशन यहाँ है।", language_code: hi, direction: ltr}
              - {text: "मुझे काम है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit15.lesson01.teach.jaana
            kind: vocabulary
            target: {text: "जाना", language_code: hi, direction: ltr}
            introduced_tokens: ["जाना"]
            example: {text: "मुझे जाना है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai
            kind: grammar_note
            target: {text: "'मुझे' पहले 'चाहिए' (यूनिट 6, संज्ञा के साथ) और 'है' (यूनिट 11, जैसे 'मुझे काम है') के साथ सीखा था। अब यह क्रिया के साथ भी आता है: 'मुझे जाना है' का मतलब है 'I need to go'। ध्यान दें -- 'है' हमेशा वही रहता है, 'हैं' नहीं बनता, क्योंकि यह क्रिया 'जाना' से मेल खाता है, बोलने वाले से नहीं।", language_code: hi, direction: ltr}
            introduced_tokens: []
          - content_key: hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase
            kind: phrase
            target: {text: "मुझे स्टेशन जाना है।", language_code: hi, direction: ltr}
            introduced_tokens: []
          - content_key: hi.a1.unit15.lesson01.teach.tiket
            kind: vocabulary
            target: {text: "टिकट", language_code: hi, direction: ltr}
            introduced_tokens: ["टिकट"]
            example: {text: "मेरा टिकट कहाँ है?", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit15.lesson01.teach.chahiye_review
            kind: vocabulary
            target: {text: "चाहिए", language_code: hi, direction: ltr}
            introduced_tokens: ["चाहिए"]
            example: {text: "मुझे चाय चाहिए।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase
            kind: phrase
            target: {text: "मुझे टिकट चाहिए।", language_code: hi, direction: ltr}
            introduced_tokens: []
          - content_key: hi.a1.unit15.lesson01.teach.train
            kind: vocabulary
            target: {text: "ट्रेन", language_code: hi, direction: ltr}
            introduced_tokens: ["ट्रेन"]
            example: {text: "ट्रेन बड़ी है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit15.lesson01.teach.delhi_ka_review
            kind: vocabulary
            target: {text: "दिल्ली, का", language_code: hi, direction: ltr}
            introduced_tokens: ["दिल्ली", "का"]
            example:
              - {text: "मेरा भाई दिल्ली में रहता है।", language_code: hi, direction: ltr}
              - {text: "यह अर्जुन का बैग है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase
            kind: phrase
            target: {text: "मुझे दिल्ली का टिकट चाहिए।", language_code: hi, direction: ltr}
            introduced_tokens: []
          - content_key: hi.a1.unit15.lesson01.teach.kahan_tumhein_review
