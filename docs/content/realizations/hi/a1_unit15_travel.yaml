          - content_key: hi.a1.unit15.lesson01.exercise03.select_mujhe_station_jana_hai_meaning
            type: multiple_choice
            tested_text: "मुझे स्टेशन जाना है"
            prompt:
              target_blocks:
                - {text: "मुझे स्टेशन जाना है।", language_code: hi, direction: ltr}
          - content_key: hi.a1.unit15.lesson01.exercise04.listen_mujhe_station_jana_hai
            type: listen_select
            tested_text: "मुझे स्टेशन जाना है"
            media_asset_key: hi.a1.audio.travel.mujhe_station_jana_hai.01
