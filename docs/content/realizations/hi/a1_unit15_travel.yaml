    need' -> 'to me'. Native-speaker check needed: gender of टिकट -- this unit
    teaches it as masculine only (टिकट पचास रुपये का है) and
    lesson02.exercise11 grammar_check marks की as an error; feminine usage
    (टिकट की है / टिकट मिल गई) is common in speech, so confirm whether the
    grammar_check and lesson02.exercise10 fill should also accept की or be
    redesigned.

course:
  realization_key: hi.a1
  target_language_first: true
  dialect: hi_standard
  register_policy: >-
    Continues unit01-14's aap/tum split. This unit's dialogue (lesson03)
    stays entirely in तुम between Priya and Arjun, matching every prior
    unit's continuation of their established friendship -- no new stranger
    character (e.g. a ticket-counter clerk) is introduced here; Priya and
    Arjun travel together and share ticket/platform/time information with
    each other directly, keeping the dialogue's register consistent with
    the whole course's Priya/Arjun thread rather than adding a new
    aap-register service-transaction scene.

