    unit14) is universal.a1.travel.handle_basic_journey (line 464, "Handle
    basic transport information, tickets, destinations, and departure
    details"). Its `prerequisites:` list (lines 467-470) names
    universal.a1.numbers.use_basic_numbers (hi unit02, done),
    universal.a1.time.ask_tell_time (hi unit04, done), and
    universal.a1.directions.ask_follow_basic_directions (hi unit09, done) --
    all three satisfied, no gating gap. Cross-checked against on-disk
    precedent per this task's explicit instruction: `ls
    docs/content/realizations/nl/`, `pl/`, and `ro/` all independently
    confirm a1_unit15_travel.yaml as their own fifteenth unit, matching hi's
    own unit01-14 sequence -- but this was used only as a cross-check, not
    as the basis for the decision, which rests on the direct spine-file read
    above. Sized to 3 lessons matching unit01-14's bootstrap pace. Topic/
    pacing structure only (recognition-first, minimal new grammar surface,
    dialogue in lesson03) informed at a purely structural level by this
    session's own established hi conventions, not by opening any nl/pl/ro
    file's actual text -- every Hindi sentence below is authored fresh.

    Source access, re-attempted per this task's explicit instruction (not
    assumed to fail the same way as every prior hi unit): a fresh
    `firecrawl search "FSI Hindi Active Introduction train station ticket
    platform travel"` (no query cache reused from any prior session) failed
    outright with HTTP 402 (payment/quota), the fifteenth consecutive such
    failure across this whole session's worth of hi units. Fell back to the
    same FSI "Hindi: An Active Introduction" archive.org item
    (`Fsi-Hindi-AnActiveIntroduction`), re-downloaded fresh into THIS
    session's own isolated scratchpad. A fresh regex scan (Python, not
    eyeballed) of the Internet Archive's own OCR pass
    (`Fsi-HindiActiveIntroduction-StudentText_djvu.txt`, 94KB, re-downloaded
    this session) for the Devanagari Unicode block (U+0900-U+097F) returned
    ZERO matches anywhere in the document -- confirmed programmatically,
    consistent with every prior hi unit's documented zero-Devanagari-match
    result; this is the fifteenth such confirmation in sequence. A fresh
    grep of the same OCR file for travel-topic English framing this time
    found real, directly on-topic incidental corroboration -- "by train",
    "The train doesn't go.", "The trains don't go.", "The train was just
    about to start.", "The trains aren't arriving." (all from grammar-
    example sentences about negation/verb agreement, not vocabulary
    instruction) -- but every Devanagari-script line immediately adjacent
    to each hit remains unreadable OCR mojibake ("^rrft % b y train", "cTT ^
    ^ft", "irffqi ^nff ^TRTf", "yj^,^ q-pt ^t^c ^", "irr^V 3?!% 3T?ft *ft
    *ft", "TffW ^ Tf^ T^f"), confirmed by eye to be garbage, not readable
    Devanagari-as-Latin-transliteration -- matching the exact failure mode
    confirmed fourteen times before. Per this task's explicit instruction,
    nothing from either extraction attempt -- neither any mojibake fragment
    nor any wording of the recovered English framing prose -- was copied,
    cleaned up, transcribed, or translated anywhere in this file. Every
    Devanagari string below is this session's own careful, correct
    rendering of established Modern Standard Hindi, verified
    character-by-character (codepoint hex dump run directly against every
    new word before finalizing, see the nasalization discipline paragraph
    below).

    Central grammar decision #1: the दात-subject obligation construction
    "X + [verb infinitive] + है" ("X needs/has to ___"). मुझे was already
    established with चाहिए (unit06, "मुझे...चाहिए" = "I want/need [noun]")
    and, separately, with a following noun + है (unit11, "मुझे काम है" = "I
    have work", decision #2 of that unit's own notes). This unit extends
    the SAME दात + है shape to a following verb-infinitive instead of a
    noun: "मुझे जाना है" = "I need to go." Disclosed explicitly via a
    dedicated grammar_note (lesson01.teach.grammar_mujhe_verb_hai) that
    names both prior uses by unit number before introducing the new slot.
    A load-bearing detail called out on the same card: है stays invariant
    (never हैं) regardless of the दात pronoun used (मुझे/तुम्हें/हमें/
    आपको), because grammatically है agrees with the infinitive verb
    (जाना, masculine singular verbal noun), not with the दात subject --
    this is real, standard Hindi grammar, not a simplification, and is
    disclosed on the same card plus re-disclosed on lesson03's हमें
    grammar_note when हम/हमें is introduced (a real place a learner might
    otherwise expect हैं).

    Central grammar decision #2: जाती है reuses unit10's habitual-present
    -ता/-ती/-ते + है/हैं rule with a NEW verb stem (जाना, "to go") rather
    than introducing a new conjugation paradigm -- disclosed on
    lesson02.teach.jaana_habitual_grammar, explicitly naming ट्रेन's
    grammatical gender (feminine, hence जाती है not जाता है) as the reason
    for the specific form used throughout the unit's train-schedule
    sentences.

    Central grammar decision #3: हमें, the दात form of हम (unit11's first
    formal first-person-plural pronoun), introduced here as the fourth
    member of the already-established दात-pronoun set (मुझे/तुम्हें/
    आपको), not a new pattern -- disclosed on lesson03.teach.hamein_grammar,
    which explicitly names all three prior दात pronouns by unit number
    before adding हमें.

    Central grammar decision #4, a deliberate scope-narrowing, disclosed:
    this unit teaches only ट्रेन (train) as its vehicle, deliberately NOT
    बस (bus). बस was already taught in unit09 as "just/only" (e.g. "बस
    थोड़ा और जाओ"), and बस is ALSO the standard, extremely common Hindi
    loanword for "bus" (the vehicle) -- a genuine, real-world homograph
    already flagged as a disclosed-but-then-inert lexical ambiguity in
    unit09's own notes ("that second sense is NEVER taught anywhere in
    this course, so within this course's own actual taught vocabulary
    there is no real ambiguity for a learner"). Teaching बस as "bus" in
    THIS unit would activate that dormant ambiguity for real, since both
    senses would now be live, taught meanings of the identical surface
    form. Rather than attempt to disambiguate a true homograph within an
    A1 unit (a genuinely harder problem than an ordinary open-vocabulary
    slot), this unit sidesteps it entirely by building its whole scenario
    around train travel only -- the spine outcome's own can_do ("Handle
    basic transport information, tickets, destinations, and departure
    details") is fully satisfiable with one vehicle type, and bus travel
    remains available as a clean future unit's own topic once/if this
    homograph is separately, deliberately addressed.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    performed explicitly. The three listen_select exercises (lesson01.
    exercise04, lesson02.exercise04, lesson03.exercise07) are each a single
    standalone, non-dialogue utterance with no other speaker/other lines in
    the same clip -- structurally cannot trigger this bug class, matching
    unit09-14's own precedent, now applied a seventh time. lesson03's
    dialogue lines themselves carry NO `media_asset_key` at all (plain
    TextBlocks, matching unit08-14's established pattern that hi dialogue
    is text-only, not audio, for dialogue_comprehension purposes) -- the
    two dialogue_comprehension exercises in lesson03 (exercise01/02) are
    TEXT reading-comprehension, each shown line was chosen to directly
    contain its own correct answer (exercise01 shows line02 "ठीक है। मुझे
    दिल्ली का टिकट चाहिए।" and asks what Priya needs, answer directly
    stated as "टिकट"; exercise02 shows line06 "ट्रेन छह बजे जाती है,
    प्लेटफ़ॉर्म नंबर तीन से।" and asks the platform number, answer
    directly stated as "तीन") -- neither requires inference across unseen
    lines, and neither distractor is itself a fact stated in the shown
    line.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11), not just within the dialogue: this unit
    establishes exactly three concrete travel facts, restated (never
    contradicted) across lessons and the closing ticket-reading card: (1)
    the destination is Delhi (lesson01 phrase "मुझे दिल्ली का टिकट
    चाहिए।", lesson03 line02, the ticket-reading card's "टिकट: दिल्ली।",
    and the closing announcement's "दिल्ली की ट्रेन..."); (2) the train
    leaves from platform number 3 (lesson02 phrase, lesson03 line06, the
    ticket-reading card's "प्लेटफ़ॉर्म नंबर तीन।", and the closing
    announcement); (3) the train leaves at 6 o'clock (lesson02 phrase,
    lesson03 line06, the ticket-reading card's "छह बजे।"); (4) the ticket
    costs 50 rupees (lesson02 phrase, lesson03 line04). Every restatement
    across all three lessons and the ticket-reading card agrees with these
    four facts; none is ever contradicted.

    Nasalization/spelling discipline, disclosed per unit07-14 precedent,
    verified this round via a direct Python codepoint hex dump of every NEW
    word before finalizing (not eyeballed): टिकट (U+091F U+093F U+0915
    U+091F) and ट्रेन (U+091F U+094D U+0930 U+0947 U+0928) carry no
    nasalization at all -- no decision needed. प्लेटफ़ॉर्म (U+092A U+094D
    U+0932 U+0947 U+091F U+092B U+093C U+0949 U+0930 U+094D U+092E) uses
    the nukta फ़ (फ + U+093C, the same nukta letter already established in
    this course's own फ़ोन, "phone", unit02) and the candra-o vowel sign
    ऑ (U+0949, standard for representing the English loanword's "-form"
    vowel), neither of which needs a nasalization decision. हमें (U+0939
    U+092E U+0947 U+0902) ends in ें -- e-matra plus anusvara U+0902 --
    matching the exact same already-established anusvara (not
    chandrabindu) spelling of तुम्हें (unit06), not a new decision, direct
    reuse of the settled pattern for this exact ending shape. जाना/जाती
    (U+091C U+093E U+0928 U+093E / U+091C U+093E U+0924 U+0940) carry no
    nasalization. की (U+0915 U+0940, reused from unit07's original
    कितने/का/की declaration) carries no nasalization either. No new
    nasalization AMBIGUITY was hit this unit (unlike unit07's महंगा case)
    -- every nasalized word here either reuses an already-established
    spelling verbatim (हमें, following तुम्हें) or needs no nasalization
    decision at all.

    Untaught-vocabulary validator footgun (already documented by unit07-14,
    re-confirmed live during this unit's authoring, and directly re-read
    from `scripts/compile_content.py`'s `validate_untaught_vocabulary`
    before relying on it): the function only checks each exercise's own
    `tested_text` against the accumulated `introduced_tokens` set for the
    FILE so far (resets per file, accumulates across lessons within one
    file). Every token used in ANY exercise's tested_text below --
    including words already known corpus-wide -- was explicitly
    re-declared in THIS file's own introduced_tokens before its first
    tested_text use: स्टेशन/मुझे/है via lesson01.teach.station_mujhe_hai_
    review; टिकट via lesson01.teach.tiket; चाहिए via lesson01.teach.
    chahiye_review; ट्रेन via lesson01.teach.train; दिल्ली/का via lesson01.
    teach.delhi_ka_review; कहाँ/तुम्हें via lesson01.teach.kahan_tumhein_
    review; नंबर via lesson02.teach.number_review; प्लेटफ़ॉर्म via lesson02.
    teach.platform; क्या via lesson02.teach.platform_number_kya_hai_phrase;
    तीन via lesson02.teach.platform_number_teen_hai_phrase; से via
    lesson02.teach.se_review; कितने/बजे via lesson02.teach.kitne_baje_
    review; छह via lesson02.teach.train_chhah_baje_jaati_hai_phrase;
    रुपये/पचास via lesson02.teach.rupaye_review; हम/हमें via lesson03.
    teach.hum_hamein; की via lesson03.teach.ki_review. Because
    introduced_tokens accumulate across lessons WITHIN one file (not reset
    per lesson), tokens declared in lesson01/lesson02 remain valid for
    lesson03's own tested_text without redeclaration -- confirmed by
    re-reading the same compiler function this unit, not assumed.
    Genuinely new words (टिकट, ट्रेन, प्लेटफ़ॉर्म, जाना, हमें) and
    reused-but-file-local words (स्टेशन, मुझे, है, चाहिए, दिल्ली, का,
    कहाँ, तुम्हें, नंबर, क्या, तीन, से, कितने, बजे, छह, रुपये, पचास,
    हम, की) were likewise all declared before first tested_text use. Words
    used ONLY in dialogue text and never in a tested_text (भी, अच्छा,
    समझ, गया, चलो -- all already established corpus-wide from unit09/11/
    14) were deliberately left OUT of this file's introduced_tokens,
    matching unit09/12/13/14's own precedent for dialogue-only words --
    confirmed by grep of every tested_text/word_bank/fill-blank value
    before finalizing.

    Word-order duplicate-token check (unit10-14's own standing
    consideration, re-confirmed clean here): every `word_order` exercise in
    this unit uses a word_bank with zero repeated tokens (checked by hand
    against each exercise's own word_bank array below).

    fill_in_blank ambiguity check (AUTHORING_GUIDE §17): every blank in
    this unit is either (a) structurally unique given the fixed surrounding
    frame -- lesson01.exercise09's "मुझे स्टेशन ___ है।" blank (जाना)
    cannot be चाहिए instead, since चाहिए is never followed by है (unit06's
    own established rule, re-disclosed on this unit's own grammar_note),
    so the trailing है in the frame structurally excludes the only other
    candidate that would otherwise fit; lesson02.exercise09's "___ जाती
    है" blank (से) has no other postposition that fits "नंबर तीन ___
    जाती है" grammatically; lesson02.exercise10's "रुपये ___ है" blank
    (का) is uniquely correct given टिकट's established grammatical gender
    (masculine, per the same कितने का/की gender-agreement rule unit07
    already taught) -- or (b) a genuinely open vocabulary/pronoun slot
    disambiguated by the English instruction's own explicit translation,
    matching the established convention already used throughout this
    course (unit06's पानी/चाय-style blanks, unit13/14's translation-cued
    blanks): lesson01.exercise10's destination slot (दिल्ली, cued by
    "Complete: I need a ticket to Delhi.") and lesson03.exercise10's दात-
    pronoun slot (हमें, cued by "Complete: We need to go to the
    station.", though मुझे/तुम्हें/आपको are equally grammatical in the
    bare frame, the same closed-set-disambiguated-by-instruction shape
    already standard for this course's own दात-pronoun blanks).

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): checked
    with overlays/en-hi/a1_unit15.yaml. Fixes:
    lesson01.teach.station_mujhe_hai_review example 'मुझे पानी है।' is not
