  text: नीना का हफ्ता व्यस्त दिखता है। सोमवार और मंगलवार को वह लाइब्रेरी में काम करती है। बुधवार शाम को उसकी भाषा की क्लास होती है। गुरुवार को वह दोस्तों के साथ कसरत करती है, और शुक्रवार को अपने परिवार के लिए खाना बनाती है। वीकेंड पर वह आराम करती है और एक किताब पढ़ती है।
