generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: true
  source_note: >-
    No firecrawl attempt this round (established-conventions-only
    fallback, same precedent as b1_unit01-11). Every sentence below is
    this session's own fresh authoring of Modern Standard Hindi, nothing
    adapted, translated, or copied from any external source.
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Hi's twelfth B1 unit (spine outcome:
    universal.b1.purpose.express_purpose_and_goals, confirmed by direct
    read of universal_spine.yaml: can_do text "explain the purpose or
    goal behind an action using a purpose-clause construction (X does Y
    in order to/so that Z), across everyday and abstract topics such as
    study, work, and saving money", all four modalities, and all four
    assessment_requirements -- understand_purpose_statement/
    state_own_purpose/read_purpose_statement/write_purpose_statement --
    read in full before designing this unit's exercises). Continues
    Priya/Arjun directly, तुम-register throughout (grepped every
    speaker: line in docs/content/realizations/hi/b1_unit0*.yaml and
    b1_unit10-11 before writing -- no new character needed or
    introduced; also grepped for any prior mention of Arjun's job/
    promotion or Priya's finances -- none found, so this unit's
    "learning English for a promotion" / "saving for a house" content
    does not contradict any pinned fact, and is consistent with
    unit01's already-established fact that Arjun has an office job with
    clients and reports).

    Two purpose constructions, one per lesson: (1) lesson01 "...के लिए"
    (in order to/for the purpose of) + oblique infinitive, taught with
    "मैं पैसे बचाने के लिए काम करता/करती हूँ" (I work in order to save
    money) -- this is a present-habitual main clause, which DOES agree
    with the speaker's own gender (करता masc/करती fem), so both
    variants are modelled (Arjun करता, Priya करती) and the production
    exercise accepts both; (2) lesson02 "ताकि" (so that) + subjunctive,
    taught with "मैं जल्दी सोता/सोती हूँ ताकि सुबह जल्दी उठ सकूँ" (I
    sleep early so that I can wake up early) -- सकूँ (1st person
    subjunctive of सकना) is invariant for gender (Hindi subjunctive verb
    endings don't mark gender), so only the habitual main clause
    सोता/सोती needs a variant, not सकूँ. Lesson03 combines both
    constructions in one dialogue about a real goal (Arjun studying
    English for a promotion; Priya working overtime to save for a
    house), and its culminating writing_prompt (exercise13) requires
    the learner to produce BOTH a के लिए clause and a ताकि clause about
    a stated goal in one message -- going beyond the outcome's own
    literal minimum (a single purpose-clause sentence suffices per its
    own wording) to more thoroughly exercise the full compound
    construction taught across the unit (AUTHORING_GUIDE checklist
    item 7).

    Gender-agreement check, construction by construction (checklist
    item 6 / rule 6):
    - "...के लिए काम करता/करती हूँ" (1st person habitual): agrees with
      the SPEAKER's own gender -- Arjun's model sentence uses करता,
      Priya's uses करती; the lesson01 writing_prompt's accepted_answers
      include both variants since the English prompt does not specify
      the answering learner's gender.
    - "...ताकि...उठ सकूँ" / "...ताकि...खरीद सकें" (subjunctive of
      सकना): invariant for gender in all persons used here (सकूँ 1st
      sg., सकें 1st pl.) -- no variant is needed or offered for these.
      The lesson02 model sentence's own main clause "सोता/सोती हूँ"
      DOES vary with the speaker, and both variants are given.
    - lesson03's "मुझे प्रमोशन मिल सके" and "हम...घर खरीद सकें" are both
      dative/1st-plural subjunctive constructions whose subject is not
      directly the speaker's own gendered "I", so neither needs a
      feminine variant -- confirmed by walking the actual grammatical
      subject of each सकना clause, not just the surface English
      translation, before writing.

    Tokenizer-fragmentation discipline: file is fully self-contained,
    matching every prior hi B1 unit's own precedent -- every literal
    string used in any exercise's tested_text/word_bank/prompt.target_blocks
    is separately declared via this file's OWN introduced_tokens.

    Same-speaker-distractor check: structurally inapplicable, same as
    every prior hi unit -- no media_asset_key is attached to dialogue
    content, and all three listen_select exercises are single
    standalone utterances with their own dedicated media_asset_key.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): single consistent thread -- Arjun is
    learning English so that he can get a promotion at his (already-
    established, unit01) office job; Priya is working overtime to save
    money so that they can buy a new house; no conflicting goal or
    outcome is stated anywhere else in the unit.

    Word-order duplicate-token check: every word_order exercise's
    word_bank below was checked by hand -- zero repeated tokens in any
    of them.

    Not yet native-speaker or fresh-context reviewed -- status left
    honestly as unreviewed per dispatch instructions.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with en-hi/b1_unit12.yaml. Fixes: lesson02.exercise07/08
    word_banks dropped the second जल्दी (sentence lost 'early' in the
    taaki clause) -> restored. Canon/native check needed: Priya's
    'ताकि हम नया घर खरीद सकें' -- 'we' is unspecified; canon has Priya
    and Arjun as friends, so confirm 'we' is not read as a couple;
    naturalness of 'मुझे उम्मीद है कि मुझे प्रमोशन मिल सके' and 'मैं
    जल्दी उठ सकूँ, इसलिए जल्दी सोता हूँ' examples.

    Second-pass review 2026-10-19: 3 fixes - lesson01.exercise11,
    lesson02.exercise11, lesson03.exercise13 writing prompts printed
    the romanized answer -> construction named only
    (lesson03.exercise13 English now 'you work overtime' to match
    the habitual answer). NATIVE FLAGS: unchanged from the earlier
    note ('हम' canon; 'उम्मीद है कि ... मिल सके').

