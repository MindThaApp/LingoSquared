review:
  status: "unreviewed"
  required_next_reviewer: null
  notes: >-
    Hi's sixth B1 unit (spine outcome:
    universal.b1.narrative.recount_past_experience_with_sequencing,
    confirmed by direct read of universal_spine.yaml lines 2160-2185: can_do,
    all four modalities, and all four assessment_requirements --
    understand_sequenced_narrative/recount_sequenced_narrative/
    read_sequenced_narrative/write_sequenced_narrative -- read in full before
    designing this unit's exercises. Prerequisite
    universal.a1.past_events.describe_recent_event is hi's own
    a1_unit12_past_events.yaml, confirmed satisfied (था/थी past copula,
    गया/गई/मिला/मिली simple past of जाना/मिलना). Continues Priya/Arjun
    directly: Priya recounts, first to the listener directly (lesson01-02)
    and then to Arjun himself (lesson03), a small past anecdote using the
    unit's three new pieces together.

    Central B1 grammar decision, three genuinely new pieces composing
    heavily-reused mechanisms (this unit's whole reason for existing):
    (1) the जब...तब correlative marking a BACKGROUND action against a
    MAIN-LINE event -- जब/तब are both new vocabulary, but the past
    continuous itself (रहा था/रही थी) is a direct, disclosed extension of
    b1_unit05's own brand-new -रहा है/रही है construction, now combined with
    था/थी (a1_unit12's own past copula) instead of है/हैं -- confirmed by a
    fresh grep of every hi realization file for 'रहा था'/'रही थी' before
    writing: zero hits anywhere in the corpus outside this file, genuinely
    new. (2) फिर as a temporal sequencing connector ("then") marking the
    main-line event -- a disclosed dual-use, since फिर से ("again") was
    already taught in b1_unit02; bare फिर meaning "then" is a distinct,
    equally standard sense, same disclosure pattern as देखना/गया in
    b1_unit05. (3) उसने कहा कि... (reported speech, 3rd person) -- directly
    extends the ने-ergative + कहा + कि reported-speech MECHANISM b1_unit04
    already established for 2nd person (तुमने कहा कि...) to the 3rd-person
    pronoun उसने, genuinely new vocabulary (the pronoun form itself) but a
    disclosed reuse of the grammatical mechanism, matching this course's own
    standing "reuse the mechanism, don't reteach it" discipline (e.g.
    b1_unit02's सकती/सकते picking up a2_unit25's deferred सकना scope).

    Lesson01 teaches जब/तब + the past-continuous background clause in
    isolation (Priya recounts meeting Arjun). Lesson02 teaches फिर +
    उसने कहा कि... (reported speech), continuing the same story. Lesson03
    combines all three in a fresh, self-contained mini-story (Priya
    recounting to Arjun a separate anecdote about running into a neighbour)
    plus a grammar summary and reading passage retelling the same anecdote
    in third person.

    Character note: लesson03 introduces पड़ोसी ("neighbour"), a generic role
    noun (not a personal name), deliberately kept male so that उसने...जा
    रहा था (masculine agreement, reused verbatim from lesson02's Arjun
    example) applies without needing a new feminine neighbour-noun form
    (पड़ोसन) -- Priya's own first-person lines use रही (feminine, her own
    already-established gender) throughout, so the two genders never
    conflict within the same sentence.

    Tokenizer-fragmentation discipline: this file is fully self-contained,
    matching every prior hi B1 unit's own precedent -- every literal string
    used in any exercise's tested_text/word_bank is separately declared via
    this file's OWN introduced_tokens (including था/थी/रहा/रही/गया/गई/मिली/
    से/कहा/कि/भी, all reused from earlier files but redeclared fresh here).
    Verified by checking the compiler's own tokenize() regex against every
    new literal before writing exercises -- ज़िम्मेदारी-class fragmentation
    risk doesn't recur here (this unit's new words -- जब, तब, फिर, उसने,
    शाम, पड़ोसी, मज़ेदार, बात, हुआ -- were each spot-checked and, where they
    fragment, the exact literal string is separately declared, never relying
    on fragment-set collision). `Dialogue`/`reading`-kind teaching cards'
    own target text and exercise `prompt.target_blocks` are NOT checked by
    validate_untaught_vocabulary (confirmed by re-reading that function
    directly, matching every prior hi unit's documented finding) --
    lesson03's reading passage uses दोनों/गए/साथ freely as untested exposure
    since none of those specific strings is ever used as an exercise's own
    tested_text.

    Same-speaker-distractor check (the nl unit44-50 regression class):
    structurally inapplicable, same as every prior hi unit -- hi dialogue
    content carries no media_asset_key (plain TextBlocks), and all three
    listen_select exercises are single standalone utterances with their own
    dedicated media_asset_key, not pulled from the dialogue clip.

    Cross-check of every concrete fact stated across the whole unit
    (AUTHORING_GUIDE §11): exactly two narrative threads, each internally
    consistent and never contradicted -- (1) lesson01-02's story: Priya was
    going home in the evening when she met Arjun, who said he was also
    going to the market (stated once in lesson01, continued once in
    lesson02, never restated with a conflicting detail); (2) lesson03's
    separate story: Priya was going to the shop when she met her neighbour,
    who said he was also going to the shop, restated consistently across
    the dialogue (lines 03/05) and the reading passage's own retelling, with
    no conflicting detail (the neighbour is never named or given a
    conflicting destination anywhere in the unit).

    fill_in_blank ambiguity check (§17): lesson01's blank (रही, frame
    "जब मैं शाम को घर जा ___ थी, तब मैं अर्जुन से मिली।") -- मैं alone
    doesn't reveal the speaker's gender, so this is disambiguated explicitly
    via the English instruction's own cue ("Complete (you are female): ..."),
    matching this course's established gender-ambiguous-मैं-slot convention
    (e.g. a1_unit17 lesson03's own explicit "(female form)" cue for a true
    near-synonym-shaped gender pair). lesson02's blank (उसने, frame "फिर
    ___ कहा कि वह भी बाज़ार जा रहा था।") -- उसने is the only ने-ergative
    pronoun this file's own vocabulary pool contains at this point (तुमने,
    taught in a separate file, b1_unit04, is never redeclared here per this
    course's self-containment discipline), unambiguous by the file's own
    closed vocabulary pool.

    Word-order duplicate-token check: every word_order exercise's word_bank
    below has zero repeated tokens (checked by hand).

    Not yet native-speaker or fresh-context reviewed -- status left honestly
    as unreviewed.

