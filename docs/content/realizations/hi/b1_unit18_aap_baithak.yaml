review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Hi's eighteenth B1 unit (spine outcome:
    universal.b1.workplace.communicate_professionally_in_meetings,
    confirmed by direct read of universal_spine.yaml: can_do text
    "communicate professionally in a workplace setting -- make a
    formal-register suggestion or request using a softened conditional
    form, participate in a short work-meeting exchange, and write a
    brief professional message," all four modalities, and all four
    assessment_requirements read in full before designing this unit).

    REGISTER SHIFT -- INTENTIONAL, CALLED OUT EXPLICITLY: this is the
    FIRST hi unit where Arjun and Priya use आप (formal "you") in their
    OWN dialogue lines, addressing this course's established मैनेजर
    referent (from a2_unit25/b1_unit14/b1_unit15) in a workplace-meeting
    context specifically. Every prior unit (01-17) keeps Priya and Arjun
    on तुम terms WITH EACH OTHER, and that does not change here either --
    lesson02's meeting dialogue has Arjun and Priya each individually
    address the मैनेजर with आप while the narration/grammar_note is
    explicit that this is a register shift scoped ONLY to the formal
    workplace/meeting context, not a change to how they speak to each
    other. Grepped the corpus (see root task dispatch) and confirmed आप
    has appeared only incidentally in three earlier files (never as an
    established Arjun/Priya register); this is the first UNIT-level,
    deliberate introduction of आप as this pair's professional register.

    Builds directly on unit17's softened-conditional-alone construction
    (चाहूँगा/चाहूँगी, "would like") -- lesson01 reuses it in the FORMAL
    register (चाहूँगा/चाहूँगी unchanged in form when addressing आप,
    since Hindi's first-person verb doesn't change for the addressee's
    register; what changes is the addressee pronoun आप + the verb
    agreeing with आप when the manager is the grammatical subject, e.g.
    "क्या आप ... कर सकेंगे?"), which is exactly this outcome's own
    required "formal-register suggestion or request using a softened
    conditional form."

    DUPLICATION CHECK: grepped every hi realization file for "सुझाव
    देना चाहूँगा", "बैठक", and "समय सीमा" before writing -- zero hits
    anywhere in the corpus (बैठक itself is new; unit16's "समस्या" and
    "पैसे की/समय की" are distinct words, no overlap).

    Continues मैनेजर as a gender-invariant loanword background referent
    (per a2_unit25's own established precedent, re-confirmed here) --
    no gendered self-referential verb is ever put in मैनेजर's own mouth
    where it would force a gender choice; मैनेजर's lines here use
    कर सकेंगे (आप-agreement, gender-neutral) throughout.

    Ergative-agreement care (known defect class 1): this unit's new
    sentences avoid ने-ergative entirely (सुझाव देना चाहूँगा is an
    infinitive-complement construction, not an ergative-marked
    perfective), so no new agreement surface is introduced here beyond
    what unit17 already covers -- deliberately, to keep this unit's own
    grammar budget on the register shift and the workplace scenario
    rather than stacking two new mechanics at once.

    Overlay/realization correspondence double-checked line-by-line
    (known defect class 2): every exercise's instruction/accepted_answers
    below was re-read against its own realization sentence immediately
    before finalizing this file.

    Cross-check of every concrete fact stated (AUTHORING_GUIDE §11): two
    facts, restated but never contradicted -- (1) the meeting/deadline
    discussion is about extending a report's due date by one week
    (lesson02 dialogue and lesson03 email both state exactly "एक हफ़्ता",
    never a different span); (2) it is Priya who writes the follow-up
    email in lesson03, addressed to मैनेजर, consistent with lesson02's
    dialogue where she is the one who raises the deadline point.

    Tokenizer-fragmentation discipline: this file is self-contained, same
    as prior units. Every exact literal string used in tested_text/
    word_bank is separately declared in this file's own teaching cards.

    Same-speaker-distractor check: structurally inapplicable (no
    media_asset_key on dialogue content; both listen_select exercises are
    single standalone utterances with their own dedicated media_asset_key).

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked with overlays/en-hi/b1_unit18.yaml. Fixes:
    lesson01.teach.grammar_register_shift cited 'unit17' in
    learner-facing text -> 'पहले सीखे';
    lesson02.teach.grammar_aap_agreement now adds that the feminine with
    आप is 'सकेंगी'. Native-speaker check needed: the manager's line
    'क्या आप यह रिपोर्ट कल तक भेज सकेंगे?' is answered by Priya ('जी,
    मैं कोशिश करूँगी'), so standard agreement for a female addressee
    would be 'सकेंगी' (the notes above wrongly call सकेंगे
    gender-neutral); audio/dictation/word_order were left unchanged
    pending a native decision on whether to re-key the line to सकेंगी;
    also 'समय सीमा' vs 'समय-सीमा'/'समयसीमा' spelling.

