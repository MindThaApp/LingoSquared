      - content_key: it.b2.unit06.lesson05.leggere_unopinione
        title: "Leggere un'opinione"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: it.b2.unit06.lesson05.teach.testo
            kind: reading
            target:
              text: >-
                Penso che le città debbano limitare il turismo di massa. Da
                un lato è positivo per l'economia, dall'altro capisco che
                non tutti sono d'accordo. Fino a un certo punto è vero. Però
                sono convinto che una città con meno turisti sia migliore
                per la società. Non è necessariamente facile, ma ne vale
                la pena.
              language_code: it
              direction: ltr
            introduced_tokens: [tutti, migliore, facile, ne, vale, valere, pena]
        exercises:
          - content_key: it.b2.unit06.lesson05.exercise01.read_stance
            type: reading_comprehension
            tested_text: "le città debbano limitare il turismo di massa"
            prompt: {target_blocks: [{text: "What is the author's overall opinion?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson05.exercise02.read_qualification
            type: reading_comprehension
            tested_text: "fino a un certo punto"
            prompt: {target_blocks: [{text: "What does the author CONCEDE to the opposing side?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson05.exercise03.read_final_value
            type: reading_comprehension
            tested_text: "migliore per la società"
            prompt: {target_blocks: [{text: "On what basis does the author still support limiting mass tourism?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson05.exercise04.read_hedge
            type: reading_comprehension
            tested_text: "non è necessariamente facile"
            prompt: {target_blocks: [{text: "Does the author claim it would be easy?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "facile ne vale la pena migliore economia società"
            prompt: {target_blocks: []}
            pairs:
              - {left: facile, right: easy}
              - {left: "ne vale la pena", right: "it's worth it"}
              - {left: migliore, right: better}
              - {left: economia, right: economy}
              - {left: società, right: society}
              - {left: dipende, right: "it depends"}
          - content_key: it.b2.unit06.lesson05.exercise06.translate_ne_vale_la_pena
            type: translation
            tested_text: "Ne vale la pena"
            prompt: {target_blocks: [{text: "Translate into Italian: It's worth it.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson05.exercise07.write_non_e_facile
            type: writing_prompt
            tested_text: "Non è necessariamente facile"
            prompt: {target_blocks: [{text: "Write in Italian, using non è necessariamente: It is not necessarily easy.", language_code: en, direction: ltr}]}

      - content_key: it.b2.unit06.lesson06.in_conversazione
        title: "In conversazione: un'opinione sfumata"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: it.b2.unit06.lesson06.teach.dialogue_elena_open
            kind: dialogue
            target: {text: "Penso che le città debbano limitare il turismo di massa. È meglio per la cultura.", language_code: it, direction: ltr, speaker: Elena}
            introduced_tokens: []
          - content_key: it.b2.unit06.lesson06.teach.dialogue_sam_concede
            kind: dialogue
            target: {text: "È vero, ma non tutti sono d'accordo.", language_code: it, direction: ltr, speaker: Sam}
            introduced_tokens: []
          - content_key: it.b2.unit06.lesson06.teach.dialogue_elena_push
            kind: dialogue
            target: {text: "Capisco il tuo punto, però è meglio anche per la società.", language_code: it, direction: ltr, speaker: Elena}
            introduced_tokens: []
          - content_key: it.b2.unit06.lesson06.teach.dialogue_sam_qualify
            kind: dialogue
            target: {text: "Sono d'accordo con te fino a un certo punto. Ma dipende.", language_code: it, direction: ltr, speaker: Sam}
            introduced_tokens: [con, te]
          - content_key: it.b2.unit06.lesson06.teach.dialogue_elena_conviction
            kind: dialogue
            target: {text: "Sono convinta che ne valga la pena.", language_code: it, direction: ltr, speaker: Elena}
            introduced_tokens: [valga]
          - content_key: it.b2.unit06.lesson06.teach.dialogue_sam_final
            kind: dialogue
            target: {text: "Secondo me non è necessariamente meglio.", language_code: it, direction: ltr, speaker: Sam}
            introduced_tokens: []
          - content_key: it.b2.unit06.lesson06.teach.grammar_sfumata
            kind: grammar_note
            target: {text: "Penso che le città debbano limitare il turismo di massa, ma dipende. Non sono necessariamente d'accordo su tutto.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit06.lesson06.exercise01.comprehend_elena
            type: dialogue_comprehension
            tested_text: "le città debbano limitare il turismo di massa"
            media_asset_key: it.b2.audio.astrazione.dialogo.turismo.01
            prompt: {target_blocks: [{text: "What is Elena's position?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson06.exercise02.comprehend_sam
            type: dialogue_comprehension
            tested_text: "fino a un certo punto"
            media_asset_key: it.b2.audio.astrazione.dialogo.turismo.01
            prompt: {target_blocks: [{text: "What is Sam's position, and how does he qualify it?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson06.exercise03.comprehend_difference
            type: dialogue_comprehension
            tested_text: "non è necessariamente meglio"
            media_asset_key: it.b2.audio.astrazione.dialogo.turismo.01
            prompt: {target_blocks: [{text: "Where do Elena and Sam mainly DIFFER?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson06.exercise04.order_sono_convinta
            type: word_order
            tested_text: "Sono convinta che sia meglio"
            prompt: {target_blocks: []}
            word_bank: [Sono, convinta, che, sia, meglio]
          - content_key: it.b2.unit06.lesson06.exercise05.speak_qualified_opinion
            type: speak_response
            tested_text: "Fino a un certo punto è vero, ma una città con meno turisti è meglio per la cultura"
            prompt: {target_blocks: [{text: "Someone says cities should welcome unlimited tourism. Respond aloud with a QUALIFIED opinion that answers them, using fino a un certo punto and è vero, ma...: That is true to a certain extent, but a city with fewer tourists is better for culture.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson06.exercise06.write_qualified_response
            type: writing_prompt
            tested_text: "È vero, ma non è positivo per la cultura. Secondo me una città con meno turisti è meglio."
            prompt: {target_blocks: [{text: "Someone argues that cities should welcome unlimited tourism. Write TWO Italian sentences responding with a QUALIFIED opinion that answers them directly. (1) Concede partly, using è vero, ma...: That's true, but it's not positive for culture. (2) Give your own qualified opinion, using secondo me: In my opinion, a city with fewer tourists is better.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson06.exercise07.respond_qualified
            type: dialogue_response
            tested_text: "Fino a un certo punto è vero, ma secondo me una città con meno turisti è meglio per la cultura"
            prompt: {target_blocks: [{text: "Le città non dovrebbero limitare il turismo.", language_code: it, direction: ltr}]}
