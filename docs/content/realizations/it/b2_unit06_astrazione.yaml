          - content_key: it.b2.unit06.lesson02.teach.grammar_sfumatura
            kind: grammar_note
            target: {text: "Questo è vero fino a un certo punto. In generale, la città è meglio. Dipende dalla città.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
