generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is it's B2
    abstraction unit (discussing abstract ideas and values). No adaptable
    intermediate/upper-intermediate public-domain Italian source exists, so
    this was built from general Italian grammar/discourse knowledge, the
    same honest-disclosure precedent unit01-05 set. Sibling-isolation
    honored: the nl b2 unit06 realization/overlay was read once for the
    dispatch's required STRUCTURE mirror (spine outcome, lesson-count
    pacing) but no Dutch text was consulted while writing any Italian
    sentence; the TOPIC was also deliberately changed from the exemplar
    (mass tourism, not car-free cities) to avoid a structurally-identical
    scenario. Character canon (grepped docs/content/realizations/it/*.yaml
    before writing): Sam is an American engineer from Chicago in Milan for
    work; Elena is an Italian teacher from Milan; tu register between them
    (established unit01-05 canon). Theme: Sam and Elena debate an everyday
    abstract question relevant to their own city (whether cities should
    limit mass tourism), which introduces no canon conflict -- Milan and
    nearby tourist cities (already established via Elena being a Milan
    teacher) are a natural topic for the two of them.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of every qualification frame in
    everyday spoken Italian -- fino a un certo punto, in generale, in molti
    casi, non necessariamente, dipende -- and that the intended softening
    reads correctly to a native ear; (2) naturalness of the
    respond-to-opposing frames -- 'è vero, ma...'; 'capisco il tuo punto,
    però...'; '(non) sono d'accordo, perché...' -- and confirm the word
    order in each is natural; (3) the congiuntivo forms triggered by
    "penso che"/"sono convinto/a che" (debbano, funzioni) -- confirm these
    are the correct present-subjunctive forms and read as natural everyday
    B2 Italian, not stilted; (4) the abstract-value nouns as used here read
    as current everyday Italian: cultura, economia, responsabilità,
    ambiente, società; (5) the culminating writing exercise (lesson06
    exercise06) is graded against a fixed two-sentence string with an
    internal comma -- decide whether more punctuation variants are needed;
    (6) confirm Sam's use of "sono convinto" (masculine) and Elena's
    "sono convinta" (feminine) are correctly gender-agreed throughout, and
    that Elena's position in lesson06 reads as a genuinely QUALIFIED
    disagreement (concedes a point, but "non necessariamente meglio"), not
    a flat no.
  notes: >-
    it B2 abstraction unit. Targets the CEFR B2 abstraction outcome
    (universal.b2.abstraction.discuss_abstract_ideas_and_values): give a
    QUALIFIED opinion on an abstract topic and respond directly to an
    opposing view, distinguishing a flat opinion from a qualified one and
    an agreement from a direct rebuttal. Theme: one coherent everyday
    abstract debate across all six lessons -- should cities limit mass
    tourism? -- pitting economy/livelihoods against culture/quality of
    life. Lesson arc: L01 opinion frames + abstract-value vocabulary
    (penso che / secondo me / sono convinto/a che; cultura, economia); L02
    QUALIFICATION -- softening an opinion (fino a un certo punto, in
    generale, in molti casi, non necessariamente, dipende); L03 RESPONDING
    to an opposing view (è vero ma..., capisco il tuo punto però..., (non)
    sono d'accordo perché...); L04 weighing two sides (da un lato...
    dall'altro..., vantaggio, svantaggio, società); L05 a short opinion
    READING that states a qualified stance (author's stance + what they
    concede); L06 the culminating production -- a Sam/Elena dialogue for
    the LISTENING requirement (identify each position + where they
    differ), a SPEAKING task (qualified opinion answering an opposing
    view), a WRITING task (qualified opinion responding to a stated
    opposing view), and a dialogue_response that directly answers a stated
    opposing view with a qualified opinion. Register: tu throughout, per
    the established it-lane canon; Sam and Elena continue their tu.
    Vocabulary is introduced self-contained within this file (each token is
    taught in this or an earlier lesson before it is tested). No
    sibling-direction file was consulted; no Dutch sentence was reused or
    adapted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    grading shapes (casefold, punctuation kept, distance-1 tolerance), YAML
    boolean coercion, option/word_bank jargon, learner-visible provenance
    text, every example_gloss against its example, and every comprehension
    answer against the audio/reading text. Fixes:
    it.b2.unit06.lesson04.exercise06.write_societa -- instruction
    (realization prompt + overlay) 'It's good for society.' -> 'It's
    positive for society.' so the one accepted answer (È positivo per la
    società) is determined; feedback adjusted.
    it.b2.unit06.lesson06.exercise06.write_qualified_response --
    prompt/instruction 'it's not good for culture' -> 'it's not positive for
    culture'; accepted variant with 'Secondo me,' comma added.
    it.b2.unit06.lesson06.exercise05.speak_qualified_opinion and
    it.b2.unit06.lesson06.exercise07.respond_qualified -- accepted 'È vero
    fino a un certo punto, ma ...' (with and without comma) added, the form
    the unit itself teaches. it.b2.unit06.lesson01.teach.grammar_opinione --
    overlay gloss now includes the fourth sentence 'It's a good idea.'.
    it.b2.unit06.lesson03.teach.capisco_il_tuo_punto -- introduced token
    'diversamente2' -> 'diversamente'. NATIVE FLAGS: predicative 'meglio'
    after a noun subject ('la città è meglio', 'una città con meno turisti è
    meglio per la cultura') -- confirm it is acceptable or accept 'migliore'
    too; lesson04.teach.vantaggio example 'Una città senza auto ha un grande
    vantaggio.' is off-topic (car-free city) and uses senza/auto, which are
    not introduced. DEFERRED: course.description in the overlay describes
    only this unit (course-wide decision across all en-it B2 overlays, owner
    call).

course:
  realization_key: it.b2
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Tu throughout (established it-lane canon). B2 abstraction layers
    opinion frames, qualification frames, and respond-to-opposing frames
    onto that register -- penso che, secondo me, sono convinto/a che, fino
    a un certo punto, non necessariamente, è vero ma, capisco il tuo punto
    però, (non) sono d'accordo -- while keeping everyday informal address.
    Sam and Elena continue the tu they use with each other.

