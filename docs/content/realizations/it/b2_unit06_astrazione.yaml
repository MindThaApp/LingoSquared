units:
  - content_key: it.b2.unit06.astrazione
    title: "Idee astratte"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.abstraction.discuss_abstract_ideas_and_values
    planned_lesson_count: 6

    lessons:
      - content_key: it.b2.unit06.lesson01.cosa_ne_pensi
        title: "Cosa ne pensi?"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: it.b2.unit06.lesson01.teach.citta
            kind: vocabulary
            target: {text: "la città", language_code: it, direction: ltr}
            introduced_tokens: [la, città, Vivo, vivere, in]
            example: {text: "Vivo in una città.", language_code: it, direction: ltr}
          - content_key: it.b2.unit06.lesson01.teach.turismo_di_massa
            kind: vocabulary
            target: {text: "il turismo di massa", language_code: it, direction: ltr}
            introduced_tokens: [il, turismo, di, massa, dovrebbero, dovere, limitare]
            example: {text: "Le città dovrebbero limitare il turismo di massa.", language_code: it, direction: ltr}
          - content_key: it.b2.unit06.lesson01.teach.cultura
            kind: vocabulary
            target: {text: "la cultura", language_code: it, direction: ltr}
            introduced_tokens: [cultura, è, essere, importante]
            example: {text: "La cultura è importante.", language_code: it, direction: ltr}
          - content_key: it.b2.unit06.lesson01.teach.economia
            kind: vocabulary
            target: {text: "l'economia", language_code: it, direction: ltr}
            introduced_tokens: [economia, conta, contare, anche]
            example: {text: "Anche l'economia conta.", language_code: it, direction: ltr}
          - content_key: it.b2.unit06.lesson01.teach.penso_che
            kind: phrase
            target: {text: "penso che", language_code: it, direction: ltr}
            introduced_tokens: [Penso, pensare, che, debbano, cambiare]
            example: {text: "Penso che le città debbano cambiare.", language_code: it, direction: ltr}
          - content_key: it.b2.unit06.lesson01.teach.secondo_me
            kind: phrase
            target: {text: "secondo me", language_code: it, direction: ltr}
            introduced_tokens: [secondo, me]
            example: {text: "Secondo me la cultura è importante.", language_code: it, direction: ltr}
          - content_key: it.b2.unit06.lesson01.teach.sono_convinto
            kind: phrase
            target: {text: "sono convinto / convinta che", language_code: it, direction: ltr}
            introduced_tokens: [sono, convinto, convinta, funzioni, funzionare, conti]
            example: {text: "Sono convinto che funzioni.", language_code: it, direction: ltr}
          - content_key: it.b2.unit06.lesson01.teach.grammar_opinione
            kind: grammar_note
            target: {text: "Penso che le città debbano cambiare. Secondo me la cultura è importante. Sono convinto che il turismo di massa sia un problema. È una buona idea.", language_code: it, direction: ltr}
            introduced_tokens: [buona, idea]
        exercises:
          - content_key: it.b2.unit06.lesson01.exercise01.recognize_cultura
            type: multiple_choice
            tested_text: cultura
            prompt: {target_blocks: [{text: cultura, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit06.lesson01.exercise02.listen_opinione_turismo
            type: listen_select
            tested_text: "Penso che le città debbano limitare il turismo di massa"
            media_asset_key: it.b2.audio.astrazione.opinione_turismo.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit06.lesson01.exercise03.match_opinion_words
            type: matching_pairs
            tested_text: "penso che secondo me sono convinto che cultura economia turismo di massa città"
            prompt: {target_blocks: []}
            pairs:
              - {left: "penso che", right: "I think that"}
              - {left: "secondo me", right: "in my opinion"}
              - {left: "sono convinto/a che", right: "I'm convinced that"}
              - {left: cultura, right: culture}
              - {left: economia, right: economy}
              - {left: "il turismo di massa", right: "mass tourism"}
              - {left: città, right: cities}
          - content_key: it.b2.unit06.lesson01.exercise04.order_penso_che
            type: word_order
            tested_text: "Penso che le città debbano cambiare"
            prompt: {target_blocks: []}
            word_bank: [Penso, che, le, città, debbano, cambiare]
          - content_key: it.b2.unit06.lesson01.exercise05.translate_secondo_me
            type: translation
            tested_text: "Secondo me la cultura è importante"
            prompt: {target_blocks: [{text: "Translate into Italian, using secondo me: In my opinion, culture is important.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson01.exercise06.speak_sono_convinto
            type: speak_response
            tested_text: "Sono convinto che l'economia conti"
            prompt: {target_blocks: [{text: "Say aloud in Italian, using sono convinto/a che: I'm convinced that the economy counts.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson01.exercise07.write_penso_che
            type: writing_prompt
            tested_text: "Penso che sia una buona idea"
            prompt: {target_blocks: [{text: "Write in Italian, using penso che: I think it's a good idea.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit06.lesson01.exercise08.dictation_opinione_turismo
            type: dictation
            tested_text: "Penso che le città debbano limitare il turismo di massa"
            media_asset_key: it.b2.audio.astrazione.opinione_turismo.01
            prompt: {target_blocks: []}

      - content_key: it.b2.unit06.lesson02.unopinione_sfumata
        title: "Un'opinione sfumata"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: it.b2.unit06.lesson02.teach.fino_a_un_certo_punto
