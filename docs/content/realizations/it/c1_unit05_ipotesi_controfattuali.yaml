    surrounding analysis, and that the culminating speaking and writing
    exercises each require the complete act: one past counterfactual, one mixed
    conditional with a present consequence, and one expression of regret. All
    listen/dictation exercises use dedicated single-sentence audio assets with
    tested_text matching the audio text.

