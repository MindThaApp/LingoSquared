          - {"content_key": "it.a2.unit88.lesson05.exercise03.abbina_lettura", "type": "matching_pairs", "tested_text": "la stazione la sveglia in fretta un altro treno alle dieci così", "prompt": {"target_blocks": []}, "pairs": [{"left": "la stazione", "right": "the station"}, {"left": "la sveglia", "right": "the alarm clock"}, {"left": "in fretta", "right": "in a hurry"}, {"left": "un altro treno", "right": "another train"}, {"left": "alle dieci", "right": "at ten"}, {"left": "così", "right": "so"}]}
          - {"content_key": "it.a2.unit88.lesson05.exercise04.ordina_fretta", "type": "word_order", "tested_text": "Sono uscito di casa in fretta", "prompt": {"target_blocks": []}, "word_bank": ["Sono", "uscito", "di", "casa", "in", "fretta"]}
