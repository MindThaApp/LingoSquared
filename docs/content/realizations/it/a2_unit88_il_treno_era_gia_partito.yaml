      - content_key: it.a2.unit88.lesson06.giulia_e_marco
        title: "Giulia e Marco alla festa"
        spine_outcome_id: universal.a2.past.explain_what_had_happened_before
        teaching:
          - {"content_key": "it.a2.unit88.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Marco, che cosa è successo? Sei molto in ritardo!", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Marco", "che", "cosa", "è", "successo", "Sei", "molto", "in", "ritardo"]}
          - {"content_key": "it.a2.unit88.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Scusa, Giulia! La sveglia non aveva suonato e mi sono svegliato tardi.", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Scusa", "Giulia", "La", "sveglia", "non", "aveva", "suonato", "e", "mi", "sono", "svegliato", "tardi"]}
          - {"content_key": "it.a2.unit88.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "E il treno? Non hai preso il treno delle sette?", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["E", "il", "treno", "Non", "hai", "preso", "delle", "sette"]}
          - {"content_key": "it.a2.unit88.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Sì, ma quando sono arrivato alla stazione, il treno era già partito. Ho aspettato un altro treno.", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Sì", "ma", "quando", "sono", "arrivato", "alla", "stazione", "il", "treno", "era", "già", "partito", "Ho", "aspettato", "un", "altro"]}
          - {"content_key": "it.a2.unit88.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Per fortuna sei qui! Noi avevamo già mangiato, ma la torta è ancora qui.", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Per", "fortuna", "sei", "qui", "Noi", "avevamo", "già", "mangiato", "ma", "la", "torta", "è", "ancora"]}
          - {"content_key": "it.a2.unit88.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Grazie, Giulia! Io non avevo ancora mangiato.", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Grazie", "Giulia", "Io", "non", "avevo", "ancora", "mangiato"]}
        exercises:
          - {"content_key": "it.a2.unit88.lesson06.exercise01.capisci_ritardo", "type": "dialogue_comprehension", "tested_text": "La sveglia non aveva suonato e mi sono svegliato tardi", "media_asset_key": "it.a2.audio.dialogue.il_treno_era_gia_partito.01", "prompt": {"target_blocks": [{"text": "Why was Marco late?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit88.lesson06.exercise02.capisci_treno", "type": "dialogue_comprehension", "tested_text": "Ho aspettato un altro treno", "media_asset_key": "it.a2.audio.dialogue.il_treno_era_gia_partito.01", "prompt": {"target_blocks": [{"text": "What did Marco do after the train had left?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit88.lesson06.exercise03.abbina_dialogo", "type": "matching_pairs", "tested_text": "Che cosa è successo Sei molto in ritardo La sveglia non aveva suonato Il treno era già partito Noi avevamo già mangiato Io non avevo ancora mangiato", "prompt": {"target_blocks": []}, "pairs": [{"left": "Che cosa è successo?", "right": "What happened?"}, {"left": "Sei molto in ritardo!", "right": "You are very late!"}, {"left": "La sveglia non aveva suonato.", "right": "The alarm clock had not rung."}, {"left": "Il treno era già partito.", "right": "The train had already left."}, {"left": "Noi avevamo già mangiato.", "right": "We had already eaten."}, {"left": "Io non avevo ancora mangiato.", "right": "I had not eaten yet."}]}
          - {"content_key": "it.a2.unit88.lesson06.exercise04.ordina_ancora", "type": "word_order", "tested_text": "Io non avevo ancora mangiato", "prompt": {"target_blocks": []}, "word_bank": ["Io", "non", "avevo", "ancora", "mangiato"]}
          - {"content_key": "it.a2.unit88.lesson06.exercise05.rispondi_treno", "type": "dialogue_response", "tested_text": "Quando sono arrivato alla stazione il treno era già partito", "prompt": {"target_blocks": [{"text": "Marco, che cosa è successo? Sei molto in ritardo!", "language_code": "it", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit88.lesson06.exercise06.traduci_torta", "type": "translation", "tested_text": "Avevamo già mangiato ma la torta è ancora qui", "prompt": {"target_blocks": [{"text": "We had already eaten, but the cake is still here.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit88.lesson06.exercise07.scrivi_due", "type": "writing_prompt", "tested_text": "Ero in ritardo perché la sveglia non aveva suonato Quando sono arrivato alla stazione il treno era già partito", "prompt": {"target_blocks": [{"text": "Write exactly two Italian sentences: (1) you were late because the alarm clock had not rung; (2) when you arrived at the station, the train had already left (a man speaking).", "language_code": "en", "direction": "ltr"}]}}
