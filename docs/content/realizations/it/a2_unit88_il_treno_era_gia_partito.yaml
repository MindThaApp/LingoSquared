        teaching:
          - {"content_key": "it.a2.unit88.lesson05.teach.parole", "kind": "vocabulary", "target": {"text": "molto, bene, così, un altro, alle dieci, aspettare", "language_code": "it", "direction": "ltr"}, "introduced_tokens": ["molto", "bene", "così", "un", "altro", "alle", "dieci", "aspettare", "Ho", "dormito", "aspettato", "treno", "Sono", "arrivato", "in", "ufficio"], "example": [{"text": "Ho dormito molto bene.", "language_code": "it", "direction": "ltr"}, {"text": "Ho aspettato un altro treno.", "language_code": "it", "direction": "ltr"}, {"text": "Sono arrivato in ufficio alle dieci.", "language_code": "it", "direction": "ltr"}]}
          - {"content_key": "it.a2.unit88.lesson05.teach.gn_lettura", "kind": "grammar_note", "target": {"text": "La sveglia non aveva suonato, e così mi sono svegliato alle otto.", "language_code": "it", "direction": "ltr"}, "introduced_tokens": ["La", "sveglia", "non", "aveva", "suonato", "e", "così", "mi", "sono", "svegliato", "alle", "otto"]}
          - {"content_key": "it.a2.unit88.lesson05.teach.lettura", "kind": "reading", "target": {"text": "Che mattina! Ero molto stanco perché non avevo dormito bene. La sveglia non aveva suonato, e così mi sono svegliato alle otto. Sono uscito di casa in fretta, ma quando sono arrivato alla stazione, il treno era già partito. Ho aspettato un altro treno e sono arrivato in ufficio alle dieci. Marco", "language_code": "it", "direction": "ltr"}, "introduced_tokens": ["Che", "mattina", "Ero", "molto", "stanco", "perché", "non", "avevo", "dormito", "bene", "La", "sveglia", "aveva", "suonato", "e", "così", "mi", "sono", "svegliato", "alle", "otto", "Sono", "uscito", "di", "casa", "in", "fretta", "ma", "quando", "arrivato", "alla", "stazione", "il", "treno", "era", "già", "partito", "Ho", "aspettato", "un", "altro", "ufficio", "dieci", "Marco"]}
        exercises:
