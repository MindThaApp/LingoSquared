units:
  - content_key: it.a1.unit20.weather
    title: "Che tempo fa?"
    section: speaking
    spine_outcome_ids: [universal.a1.weather.describe_basic_weather]
    planned_lesson_count: 2
    lessons:
      - content_key: it.a1.unit20.lesson01.il_tempo_oggi
        title: "Il tempo oggi"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: it.a1.unit20.lesson01.teach.fa_caldo_freddo
            kind: vocabulary
            target: {text: "fa caldo, fa freddo", language_code: it, direction: ltr}
            introduced_tokens: [fa, caldo, freddo]
            example:
              - {text: "Oggi fa caldo.", language_code: it, direction: ltr}
              - {text: "Oggi fa freddo.", language_code: it, direction: ltr}
          - content_key: it.a1.unit20.lesson01.teach.piove_sole
            kind: vocabulary
            target: {text: "piove, c'è il sole", language_code: it, direction: ltr}
            introduced_tokens: [piove, "c'è", il, sole]
            example:
              - {text: "Oggi piove.", language_code: it, direction: ltr}
              - {text: "Oggi c'è il sole.", language_code: it, direction: ltr}
          - {content_key: it.a1.unit20.lesson01.teach.che_tempo_fa, kind: phrase, target: {text: "Che tempo fa oggi?", language_code: it, direction: ltr}, introduced_tokens: [Che, tempo, fa, oggi], example: [{text: "Che tempo fa oggi a Milano?", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit20.lesson01.teach_oggi_piove, kind: phrase, target: {text: "Oggi piove.", language_code: it, direction: ltr}, introduced_tokens: [Oggi, piove], example: [{text: "Oggi piove a Milano.", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a1.unit20.lesson01.exercise01.choose_fa_caldo, type: multiple_choice, tested_text: "fa caldo", prompt: {target_blocks: []}}
          - {content_key: it.a1.unit20.lesson01.exercise02.listen_weather_words, type: listen_select, tested_text: "fa caldo fa freddo piove c'è il sole", media_asset_key: it.a1.audio.weather_vocab.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit20.lesson01.exercise03.choose_che_tempo, type: multiple_choice, tested_text: "Che tempo fa oggi", prompt: {target_blocks: []}}
          - content_key: it.a1.unit20.lesson01.exercise04.match_weather_words
            type: matching_pairs
            tested_text: "fa caldo fa freddo piove c'è il sole che tempo fa oggi oggi piove"
            prompt: {target_blocks: []}
            pairs:
              - {left: "it is hot", right: "fa caldo"}
              - {left: "it is cold", right: "fa freddo"}
              - {left: "it is raining", right: "piove"}
              - {left: "it is sunny", right: "c'è il sole"}
              - {left: "What is the weather like today?", right: "Che tempo fa oggi?"}
              - {left: "Today it is raining.", right: "Oggi piove."}
          - {content_key: it.a1.unit20.lesson01.exercise05.order_oggi_piove, type: word_order, tested_text: "Oggi piove", prompt: {target_blocks: []}, word_bank: [Oggi, piove]}
          - {content_key: it.a1.unit20.lesson01.exercise06.fill_freddo, type: fill_in_blank, tested_text: "freddo", prompt: {target_blocks: [{text: "Oggi fa ___.", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit20.lesson01.exercise07.write_weather_words, type: writing_prompt, tested_text: "fa caldo fa freddo piove c'è il sole", prompt: {target_blocks: [{text: "Scrivi quattro espressioni per il tempo.", language_code: it, direction: ltr}]}}

      - content_key: it.a1.unit20.lesson02.restiamo_a_casa
        title: "Restiamo a casa"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: it.a1.unit20.lesson02.teach_oggi_piove_freddo, kind: phrase, target: {text: "Oggi piove e fa freddo.", language_code: it, direction: ltr}, introduced_tokens: [Oggi, piove, e, fa, freddo], example: [{text: "Oggi piove e fa freddo a Milano.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit20.lesson02.teach_restiamo_a_casa, kind: phrase, target: {text: "Restiamo a casa.", language_code: it, direction: ltr}, introduced_tokens: [Restiamo, a, casa], example: [{text: "Oggi piove, restiamo a casa.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit20.lesson02.teach_andiamo_al_museo, kind: phrase, target: {text: "Andiamo al museo.", language_code: it, direction: ltr}, introduced_tokens: [Andiamo, al, museo], example: [{text: "C'è il sole, andiamo al museo.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit20.lesson02.teach_allora, kind: phrase, target: {text: "Allora restiamo a casa?", language_code: it, direction: ltr}, introduced_tokens: [Allora, restiamo, a, casa], example: [{text: "Piove, allora restiamo a casa?", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a1.unit20.lesson02.exercise01.choose_restiamo, type: multiple_choice, tested_text: "Restiamo a casa", prompt: {target_blocks: []}}
          - {content_key: it.a1.unit20.lesson02.exercise02.listen_oggi_piove, type: listen_select, tested_text: "Oggi piove restiamo a casa", media_asset_key: it.a1.audio.oggi_piove.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit20.lesson02.exercise03.choose_weather_plan, type: multiple_choice, tested_text: "Oggi piove e fa freddo", prompt: {target_blocks: []}}
          - content_key: it.a1.unit20.lesson02.exercise04.match_weather_plan
            type: matching_pairs
            tested_text: "oggi piove e fa freddo restiamo a casa andiamo al museo allora restiamo a casa che tempo fa oggi c'è il sole"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Today it is raining and cold.", right: "Oggi piove e fa freddo."}
              - {left: "Let's stay home.", right: "Restiamo a casa."}
              - {left: "Let's go to the museum.", right: "Andiamo al museo."}
              - {left: "So, shall we stay home?", right: "Allora restiamo a casa?"}
              - {left: "What is the weather like today?", right: "Che tempo fa oggi?"}
              - {left: "it is sunny", right: "c'è il sole"}
          - {content_key: it.a1.unit20.lesson02.exercise05.order_restiamo_a_casa, type: word_order, tested_text: "Restiamo a casa", prompt: {target_blocks: []}, word_bank: [Restiamo, a, casa]}
          - {content_key: it.a1.unit20.lesson02.exercise06.reply_tempo_oggi, type: dialogue_response, tested_text: "Oggi piove e fa freddo", prompt: {target_blocks: [{text: "Che tempo fa oggi?", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit20.lesson02.exercise07.listen_type_oggi_piove, type: listen_type, tested_text: "Oggi piove restiamo a casa", media_asset_key: it.a1.audio.oggi_piove.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit20.lesson02.exercise08.write_weather_note, type: writing_prompt, tested_text: "Oggi piove e fa freddo restiamo a casa", prompt: {target_blocks: [{text: "Scrivi il tempo di oggi e un piano semplice.", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit20.lesson02.exercise09.dictation_oggi_piove, type: dictation, tested_text: "Oggi piove, restiamo a casa", media_asset_key: it.a1.audio.oggi_piove.01, prompt: {target_blocks: []}}
