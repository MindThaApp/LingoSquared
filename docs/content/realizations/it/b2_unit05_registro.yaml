          - content_key: it.b2.unit05.lesson01.teach.messaggio
            kind: phrase
            target: {text: "Sam scrive un messaggio.", language_code: it, direction: ltr}
            introduced_tokens: [Sam, scrive, scrivere, un, messaggio]
          - content_key: it.b2.unit05.lesson01.teach.tu
            kind: vocabulary
            target: {text: "tu", language_code: it, direction: ltr}
            introduced_tokens: [tu]
            example: {text: "Tu hai tempo?", language_code: it, direction: ltr}
          - content_key: it.b2.unit05.lesson01.teach.lei
            kind: vocabulary
            target: {text: "Lei (formale)", language_code: it, direction: ltr}
            introduced_tokens: [Lei]
            example: {text: "Lei ha tempo?", language_code: it, direction: ltr}
          - content_key: it.b2.unit05.lesson01.teach.hai_tempo
            kind: phrase
            target: {text: "Hai tempo?", language_code: it, direction: ltr}
            introduced_tokens: [Hai, avere, tempo]
          - content_key: it.b2.unit05.lesson01.teach.ha_tempo
            kind: phrase
            target: {text: "Ha tempo?", language_code: it, direction: ltr}
            introduced_tokens: [Ha]
          - content_key: it.b2.unit05.lesson01.teach.puoi_aiutarmi
            kind: phrase
            target: {text: "Puoi aiutarmi?", language_code: it, direction: ltr}
            introduced_tokens: [Puoi, potere, aiutarmi, aiutare, mi]
          - content_key: it.b2.unit05.lesson01.teach.puo_aiutarmi
            kind: phrase
            target: {text: "Può aiutarmi?", language_code: it, direction: ltr}
            introduced_tokens: [Può]
          - content_key: it.b2.unit05.lesson01.teach.grammar_tu_lei
            kind: grammar_note
            target: {text: "Hai tempo? Ha tempo? Puoi aiutarmi? Può aiutarmi?", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit05.lesson01.exercise01.recognize_tu
            type: multiple_choice
            tested_text: tu
            prompt: {target_blocks: [{text: tu, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit05.lesson01.exercise02.listen_ha_tempo
            type: listen_select
            tested_text: "Ha tempo"
            media_asset_key: it.b2.audio.registro.ha_tempo.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit05.lesson01.exercise03.match_tu_lei
            type: matching_pairs
            tested_text: "tu Lei hai tempo ha tempo puoi aiutarmi può aiutarmi tempo"
            prompt: {target_blocks: []}
            pairs:
              - {left: tu, right: "you (informal, subject)"}
              - {left: Lei, right: "you (formal, subject)"}
              - {left: "hai tempo", right: "do you have time (informal)"}
              - {left: "ha tempo", right: "do you have time (formal)"}
              - {left: "puoi aiutarmi", right: "can you help me (informal)"}
              - {left: "può aiutarmi", right: "can you help me (formal)"}
              - {left: tempo, right: time}
          - content_key: it.b2.unit05.lesson01.exercise04.order_hai_tempo
            type: word_order
            tested_text: "Hai tempo"
            prompt: {target_blocks: []}
            word_bank: [Hai, tempo]
          - content_key: it.b2.unit05.lesson01.exercise05.translate_ha_tempo
            type: translation
            tested_text: "Ha tempo"
            prompt: {target_blocks: [{text: "Translate into Italian, formal (addressing the person as Lei): Do you have time?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit05.lesson01.exercise06.translate_puoi_aiutarmi
            type: translation
            tested_text: "Puoi aiutarmi"
            prompt: {target_blocks: [{text: "Translate into Italian, informal (addressing the person as tu): Can you help me?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit05.lesson01.exercise07.speak_puo_aiutarmi
            type: speak_response
            tested_text: "Può aiutarmi"
            prompt: {target_blocks: [{text: "Say aloud in Italian, formal (addressing the person as Lei): Can you help me?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit05.lesson01.exercise08.dictation_ha_tempo
            type: dictation
            tested_text: "Ha tempo"
            media_asset_key: it.b2.audio.registro.ha_tempo.01
