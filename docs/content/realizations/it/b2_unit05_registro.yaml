status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is it's fifth
    B2 unit (register -- adapting formality to the audience). No adaptable
    intermediate/upper-intermediate public-domain Italian source exists, so
    this was built from general Italian grammar/discourse knowledge, the
    same honest-disclosure precedent unit01-04 set. Sibling-isolation
    honored: the nl b2 unit05 realization/overlay was read once for the
    dispatch's required STRUCTURE mirror (spine outcome, 6-lesson arc shape,
    lesson-count pacing) but no Dutch text was consulted while writing any
    Italian sentence -- every phrase here is authored fresh. Character
    canon (grepped docs/content/realizations/it/*.yaml before writing): Sam
    is an American engineer from Chicago in Milan for work; Elena is an
    Italian teacher from Milan; tu register between them (established
    unit01-04 canon). REGISTER SPECIAL CASE, same shape as the exemplar:
    unlike the other B2 units, this unit DELIBERATELY teaches BOTH
    registers side by side -- informal tu (hai, puoi, per favore, Ciao/A
    presto) and formal Lei (ha, può, per cortesia, Gentile Signore/Signora,
    Cordiali saluti/Distinti saluti). Each individual exercise keeps a
    single internally consistent register; the contrast lives across
    exercise pairs, and the culminating exercise produces the SAME request
    in both. Theme: Sam needs to reschedule an appointment, asking Elena
    (tu) and a generic unnamed office (Lei) -- introduces no canon conflict
    (no new named character; the addressee of the formal side is
    deliberately institutional/unnamed, same technique as the exemplar's
    unnamed formal official).
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) the tu/Lei verb-form pairs -- confirm "Hai
    tempo?"/"Ha tempo?", "Puoi aiutarmi?"/"Può aiutarmi?", "Puoi farlo,
    per favore?"/"Potrebbe farlo, per cortesia?" and "Sarebbe possibile?"
    are all correct and read as the natural formal-Lei register (Lei takes
    the 3rd-person-singular verb form); (2) the two full request frames --
    informal "Possiamo spostare l'appuntamento?" and formal "Sarebbe
    possibile spostare l'appuntamento?" -- confirm both are idiomatic and
    that "spostare un appuntamento" is the everyday verb for rescheduling;
    (3) the closings ladder -- confirm Ciao/A presto (informal), Caro/Cara
    + name (neutral), Gentile Signore/Signora + Cordiali saluti (formal),
    and Distinti saluti (most formal) are ranked and used correctly, and
    that "Gentile Signore/Signora," is the standard salutation when the
    recipient is unknown; (4) "Ti va bene...?" vs "Le andrebbe bene...?"
    (lesson05) -- confirm the informal/formal contrast and that "andrebbe"
    (conditional of andare) is the natural formal-register choice here
    rather than a plain present; (5) the culminating writing exercises
    (lesson06 exercise06 the informal->formal rewrite, and exercise07
    producing both registers) are graded against fixed strings -- every
    internal/trailing punctuation combination (comma after the salutation,
    question marks) is supplied as a separate accepted variant, so confirm
    no natural correct answer falls outside the supplied set; (6) confirm
    "purtroppo", "la prossima settimana", "l'ufficio", and "scrivere
    diversamente" all read as current everyday Standard Italian.
  notes: >-
    Fifth Italian B2 unit; first register unit. Targets the CEFR B2
    register outcome (universal.b2.register.adapt_formality_to_audience):
    adapt formality to the audience -- deliver the same content
    appropriately to a close friend versus an institution. Theme: one
    everyday request -- rescheduling an appointment -- rendered both ways
    across all six lessons. Lesson arc: L01 the tu<->Lei pronoun/verb shift
    (hai -> ha, puoi -> può); L02 greetings and closings (Ciao/A presto vs
    Gentile Signore/Signora / Cordiali saluti / Distinti saluti); L03
    directness -- informal puoi + per favore vs formal Potrebbe / Sarebbe
    possibile + per cortesia; L04 the actual request (spostare
    l'appuntamento) rendered informally and formally; L05 a reading
    requirement -- two messages, same content, different register, identify
    the audience of each; L06 the culminating production -- a Sam/Elena
    dialogue for the listening requirement (judge whether the register fits
    the situation and what a mismatch would signal), a speaking task
    delivering the SAME request once to a friend and once to an office, a
    writing task rewriting the informal message as a formal one, and a
    culminating writing task producing the request in BOTH registers.
    Register: this unit teaches both; the established tu between Sam and
    Elena supplies the informal side, the institutional side is formal to
    an unnamed office. All vocabulary is introduced self-contained within
    this file (B2 is a separate Course row, so a B2 learner never sees
    A1/A2/B1 lexemes at runtime). No sibling-direction file was consulted;
    no Dutch sentence was reused or adapted.

course:
  realization_key: it.b2
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    informal tu register (the it lane default between Sam and Elena) and
    the formal Lei register, contrasting them. Each single exercise stays
    in one consistent register; the contrast is carried across exercise
    pairs and the culminating exercise. Informal: tu, hai, puoi, per
    favore, Ciao, A presto. Formal: Lei with the 3rd-person-singular verb
    (ha, può, andrebbe), per cortesia, Potrebbe, Sarebbe possibile, Gentile
    Signore/Signora, Cordiali saluti, Distinti saluti. Sam and Elena keep
    the informal tu they use with each other in unit01-04.

