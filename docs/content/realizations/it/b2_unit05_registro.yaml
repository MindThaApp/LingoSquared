units:
  - content_key: it.b2.unit05.registro
    title: "Il registro"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.register.adapt_formality_to_audience
    planned_lesson_count: 6

    lessons:
      - content_key: it.b2.unit05.lesson01.tu_o_lei
        title: "Tu o Lei?"
        spine_outcome_id: universal.b2.register.adapt_formality_to_audience
