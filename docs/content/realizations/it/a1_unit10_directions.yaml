  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. Unit VIII's
    front-desk direction-giving dialogue supplied "Fuori dell'albergo vada
    a sinistra, poi sempre diritto ... fino a che arriva in Piazza Fiume"
    and "Appena fuori, giri a sinistra e continui diritto finché arriva in
    ...", which this unit adapts into the "a sinistra / a destra / sempre
    dritto / all'incrocio" turn-by-turn vocabulary and the imperative
    "vada" / "giri" / "continui" direction-giving forms. The source's
    hotel-desk framing and specific Rome landmarks are dropped; this unit
    reframes the exchange around Elena and Sam asking a passerby for
    directions to the museum in their neighborhood, reusing farmacia/banca/
    stazione from Unit 9. All dialogue text, teaching notes, and exercises
    were freshly authored per AUTHORING_GUIDE.md §10; no source sentence
    appears unchanged.
