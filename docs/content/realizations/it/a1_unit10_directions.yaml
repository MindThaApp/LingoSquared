  dialect: it_IT_standard
  register_policy: >-
    Teach contemporary Standard Italian. Tu-register between Elena and Sam;
    both use the polite "Scusi" toward a stranger and the formal imperative
    (vada, giri, continui) that a stranger uses back toward them, matching
    the register already established in Unit 9's direction-asking exchange.

