course:
  realization_key: it.b2
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Tu throughout (established it-lane canon). B2 negotiation layers
    proposing, declining and conditional-concession frames onto that
    register -- propongo di, che ne dici di, purtroppo non posso, non sono
    d'accordo su questo, se...allora, a condizione che, purché, a meno
    che...non, sono d'accordo, affare fatto -- while keeping everyday
    informal address (tu, ti, tuo). Sam and Elena continue the tu they use
    with each other in earlier units.

