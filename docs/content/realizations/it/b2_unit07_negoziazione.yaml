  notes: >-
    it's B2 negotiation unit. Targets the CEFR B2 negotiation outcome
    (universal.b2.negotiation.negotiate_and_resolve_disagreement): negotiate
    and resolve a disagreement -- state terms, decline a term, offer a
    CONDITIONAL concession, reach agreement. Theme: one coherent everyday
    disagreement across all six lessons -- Sam and Elena are planning a
    weekend trip to the mountains and must divide the work (driving,
    booking lodging, cleaning the car) and split the cost. Lesson arc: L01
    making a proposal / stating terms (propongo di / che ne dici di /
    facciamo così / la mia proposta è); L02 declining politely (purtroppo
    non posso / non ce la faccio / non sono d'accordo su questo / preferirei
    di no); L03 the core act, a conditional concession (se...allora / ma
    solo se / a condizione che / purché / a meno che...non / sono
    d'accordo, ma solo se); L04 reaching agreement (affare fatto / va bene
    / perfetto / siamo d'accordo) plus splitting the bill; L05 a written
    EXCHANGE of terms for the reading requirement (identify what was agreed
    and what remains open); L06 the culminating production -- a Sam/Elena
    dialogue for the listening requirement (identify what each side
    proposes, refuses, and the conditional concession offered), a speaking
    task that requires the WHOLE negotiation move (state terms + decline
    one + conditional concession), and a writing task that proposes
    revised terms while attaching a condition to a concession. Register: tu
    throughout, per the it-lane canon; Sam and Elena continue their tu. All
