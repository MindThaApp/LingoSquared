generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. Lesson III ("At the
    Exchange Office")'s currency-exchange scene ("Vorrei cambiare dei
    dollari" / "Cento dollari sono...") supplied the number-and-money
    scaffold, modernized here: the source teaches changing US dollars for
    Italian lire at a 1990s exchange office, which is obsolete (Italy has
    used the euro since 1999 and dollar-cash exchange is no longer a
    common tourist task) — this unit instead teaches everyday euro prices
    at a caffè/newsstand, a genuinely current scenario. All dialogue text,
    character continuation (Elena/Sam), teaching notes, and exercises were
    freshly authored per AUTHORING_GUIDE.md §10; no source sentence
    appears unchanged.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    First-wave en-it A1 draft (units 1-3), authored by Claude adapting
    FSI Italian FAST Vol. 1 per AUTHORING_GUIDE.md §10. Continues the
    Elena/Sam workplace scenario from units 01-02; numbers 0-10 (plus
    "trent'anni" as a fixed age phrase) are the scope.

    2026-07-12: fresh-context review (Claude, isolated from authoring
    reasoning; validated against empty stub overlays, compiler 0 errors).
    Numbers, euro-price phrasing, and phone-number readout all correct;
    caffè-counter Lei register consistent. One fix applied: lesson01
    exercise04 match_digits_words expanded from 5 to the full 0-10 set
    (all digits are taught in this lesson, so this is genuine coverage,
    not padding — clears the §16 too-small warning). "Ho trent'anni"
    introduces 30 as a set phrase inside a 0-10 lesson; acceptable, the
    overlay gloss should treat it as a fixed expression. No other defects.
    Native-speaker review still planned.

course:
  realization_key: it.a1
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Teach contemporary Standard Italian. This unit is mostly tu-register
    (Sam and Elena are now on first-name/tu terms after unit02) with one
    formal exchange at a caffè counter, a realistic register a stranger
    customer would use with a barista.

