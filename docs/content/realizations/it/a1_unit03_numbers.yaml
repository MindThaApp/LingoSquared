    language: it
    text: >-
      Sam: Buongiorno, quanto costa un caffè? Barista: Costa un euro.
      Sam: E un cornetto? Barista: Un euro e cinquanta. Allora, sono due
      euro e cinquanta. Sam: Va bene, grazie. Elena: Sam, qual è il tuo
      numero di telefono? Ti chiamo domani per il caffè! Sam: Il mio
      numero è zero, tre, quattro, due, uno. Elena: Perfetto, grazie!
    voice_hint: three_adults_neutral_friendly
    status: pending_generation

