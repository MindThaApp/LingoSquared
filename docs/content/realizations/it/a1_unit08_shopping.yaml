      Venditore: Costano tre euro al chilo. Elena: Vorrei un chilo di mele,
      per favore. Sam: E quanto costa questo pomodoro? Venditore: Un euro e
      cinquanta. Sam: Va bene, lo prendo.
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

