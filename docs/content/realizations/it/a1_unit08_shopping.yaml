  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. Unit XIV's shoe-shop
    dialogue ("Quanto costano?" / "95.000 lire, ma c'è lo sconto di fine
    stagione del 10%." / "Va bene, li prendo.") supplied the "Quanto
    costa/costano?" price-asking pattern and the purchase-confirmation
    formula. The source's shoe-shop framing and lira prices are dropped;
    this unit reframes the pattern around Elena and Sam shopping for fruit
    and vegetables at a neighborhood market stall, using euros and simple
    per-kilo quantities. All dialogue text, teaching notes, and exercises
    were freshly authored per AUTHORING_GUIDE.md §10; no source sentence
    appears unchanged.
