  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. The source's
    passato-prossimo drills "Sono andato/a in ufficio", "Ho cambiato dei
    dollari ieri", "Ho visto (from vedere)... I saw, I have seen", and "Che
    giorno era ieri?" supplied the essere-auxiliary motion pattern
    ("Sono andato al cinema ieri"), the avere-auxiliary pattern with "ieri"
    ("Ho mangiato un panino"), and the irregular participle "visto" this
    unit teaches. The source's embassy/errand-running framing and
    formal/Lei register are dropped; this unit reframes the exchanges as
    Elena and Sam, already established as tu-register friends in earlier
    units, recounting what they did yesterday, reusing "il cinema" (unit12)
    and "il panino" (unit07) as the recent-event content. All dialogue
    text, teaching notes, and exercises were freshly authored per
    AUTHORING_GUIDE.md §10; no source sentence appears unchanged.
