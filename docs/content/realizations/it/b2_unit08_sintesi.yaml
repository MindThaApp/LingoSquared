          - content_key: it.b2.unit08.lesson03.exercise06.speak_dicono_lo_stesso
            type: speak_response
            tested_text: "Sul punto del cibo dicono lo stesso"
            prompt: {target_blocks: [{text: "Say aloud in Italian, using dicono lo stesso: On the point of the food, they say the same thing.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit08.lesson03.exercise07.write_daccordo_cibo
            type: writing_prompt
            tested_text: "Sono d'accordo sul cibo"
            prompt: {target_blocks: [{text: "Write in Italian, using essere d'accordo su: I agree about the food.", language_code: en, direction: ltr}]}

      - content_key: it.b2.unit08.lesson04.dove_non_sono_daccordo
        title: "Dove non sono d'accordo?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: it.b2.unit08.lesson04.teach.non_daccordo_su
            kind: phrase
            target: {text: "non essere d'accordo su", language_code: it, direction: ltr}
            introduced_tokens: [non]
