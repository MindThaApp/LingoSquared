      cibo è buono, questo è vero. Ma secondo me è troppo caro. Una pizza
      costa sedici euro. Elena: Eppure io non lo trovo caro. Sam: Siamo
      d'accordo sul cibo, dunque, ma non sul prezzo.
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: it.b2.unit08.sintesi
    title: "La sintesi"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    planned_lesson_count: 6

    lessons:
      - content_key: it.b2.unit08.lesson01.chi_dice_cosa
        title: "Chi dice cosa?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: it.b2.unit08.lesson01.teach.ristorante_setup
            kind: phrase
            target: {text: "La Bottega è un nuovo ristorante.", language_code: it, direction: ltr}
            introduced_tokens: [La, Bottega, è, un, nuovo, ristorante]
          - content_key: it.b2.unit08.lesson01.teach.recensione
            kind: vocabulary
            target: {text: "la recensione", language_code: it, direction: ltr}
            introduced_tokens: [la, recensione, recensioni, questa, quale]
            example: {text: "Quale recensione è questa?", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson01.teach.fonte
            kind: vocabulary
            target: {text: "la fonte", language_code: it, direction: ltr}
            introduced_tokens: [fonte, fonti]
            example: {text: "Una recensione è una fonte.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson01.teach.secondo
            kind: vocabulary
            target: {text: "secondo", language_code: it, direction: ltr}
            introduced_tokens: [secondo, Giulia, il, cibo, buono]
            example: {text: "Secondo Giulia, il cibo è buono.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson01.teach.prezzo
            kind: vocabulary
            target: {text: "il prezzo", language_code: it, direction: ltr}
            introduced_tokens: [prezzo, alto]
            example: {text: "Il prezzo è alto.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson01.teach.sostiene_che
            kind: vocabulary
            target: {text: "sostenere (sostiene) che", language_code: it, direction: ltr}
            introduced_tokens: [sostiene, sostenere, che, non, caro]
            example: {text: "Giulia sostiene che non sia caro.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson01.teach.afferma_che
            kind: vocabulary
            target: {text: "affermare (afferma) che", language_code: it, direction: ltr}
            introduced_tokens: [Marco, afferma, affermare, troppo]
            example: {text: "Marco afferma che è troppo caro.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson01.teach.si_capisce_che
            kind: phrase
            target: {text: "dalla recensione si capisce che", language_code: it, direction: ltr}
            introduced_tokens: [dalla, si, capisce, capire]
          - content_key: it.b2.unit08.lesson01.teach.grammar_attribuire
            kind: grammar_note
            target: {text: "Secondo Giulia, non è caro. Marco afferma che è troppo caro. Dalla recensione si capisce che il cibo è buono.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit08.lesson01.exercise01.recognize_secondo
            type: multiple_choice
            tested_text: secondo
            prompt: {target_blocks: [{text: secondo, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit08.lesson01.exercise02.listen_secondo_giulia
            type: listen_select
            tested_text: "Secondo Giulia, non è caro"
            media_asset_key: it.b2.audio.sintesi.secondo_giulia.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit08.lesson01.exercise03.match_attribution_words
            type: matching_pairs
            tested_text: "secondo sostiene afferma si capisce che recensione fonte cibo prezzo"
            prompt: {target_blocks: []}
            pairs:
              - {left: secondo, right: "according to"}
              - {left: sostiene, right: "maintains / asserts"}
              - {left: afferma, right: "states / claims"}
              - {left: "si capisce che", right: "it's understood that (from evidence)"}
              - {left: recensione, right: review}
              - {left: fonte, right: source}
              - {left: cibo, right: food}
              - {left: prezzo, right: price}
          - content_key: it.b2.unit08.lesson01.exercise04.order_secondo_giulia
            type: word_order
            tested_text: "Secondo Giulia il cibo è buono"
            prompt: {target_blocks: []}
            word_bank: [Secondo, Giulia, il, cibo, è, buono]
          - content_key: it.b2.unit08.lesson01.exercise05.translate_afferma
            type: translation
            tested_text: "Marco afferma che è troppo caro"
            prompt: {target_blocks: [{text: "Translate into Italian, using affermare: Marco claims that it is too expensive.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit08.lesson01.exercise06.speak_secondo_giulia
            type: speak_response
            tested_text: "Secondo Giulia non è caro"
            prompt: {target_blocks: [{text: "Say aloud in Italian, using secondo: According to Giulia, it isn't expensive.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit08.lesson01.exercise07.write_si_capisce_che
            type: writing_prompt
            tested_text: "Dalla recensione si capisce che il cibo è buono"
            prompt: {target_blocks: [{text: "Write in Italian, using dalla recensione si capisce che: The review shows that the food is good.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit08.lesson01.exercise08.dictation_secondo_giulia
            type: dictation
            tested_text: "Secondo Giulia, non è caro"
            media_asset_key: it.b2.audio.sintesi.secondo_giulia.01
            prompt: {target_blocks: []}

      - content_key: it.b2.unit08.lesson02.due_fonti_a_confronto
        title: "Due fonti a confronto"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: it.b2.unit08.lesson02.teach.entrambe
            kind: vocabulary
            target: {text: "entrambe", language_code: it, direction: ltr}
            introduced_tokens: [Entrambe, le]
            example: {text: "Entrambe le recensioni sono positive.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson02.teach.tutte_e_due
            kind: vocabulary
            target: {text: "tutte e due", language_code: it, direction: ltr}
            introduced_tokens: [tutte, e, due]
            example: {text: "Tutte e due dicono che è buono.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson02.teach.economico
            kind: vocabulary
            target: {text: "economico", language_code: it, direction: ltr}
            introduced_tokens: [economico]
            example: {text: "Giulia lo trova economico.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson02.teach.mentre
            kind: vocabulary
            target: {text: "mentre", language_code: it, direction: ltr}
            introduced_tokens: [mentre]
            example: {text: "Giulia lo trova economico, mentre Marco lo trova caro.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson02.teach.al_contrario
            kind: vocabulary
            target: {text: "al contrario", language_code: it, direction: ltr}
            introduced_tokens: [al, contrario, positiva, negativo]
            example: {text: "Giulia è positiva. Marco al contrario è negativo.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson02.teach.a_differenza_di
            kind: phrase
            target: {text: "a differenza di", language_code: it, direction: ltr}
            introduced_tokens: [a, differenza, di, lo, trova]
            example: {text: "A differenza di Giulia, Marco lo trova caro.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson02.teach.da_un_lato_dallaltro
            kind: phrase
            target: {text: "da un lato ... dall'altro ...", language_code: it, direction: ltr}
            introduced_tokens: [da, un, lato, dall, altro]
            example: {text: "Da un lato è buono, dall'altro è caro.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson02.teach.grammar_confronto
            kind: grammar_note
            target: {text: "Entrambe le recensioni dicono che il cibo è buono. Giulia lo trova economico, mentre Marco lo trova troppo caro.", language_code: it, direction: ltr}
            introduced_tokens: [dicono, dire]
        exercises:
          - content_key: it.b2.unit08.lesson02.exercise01.recognize_mentre
            type: multiple_choice
            tested_text: mentre
            prompt: {target_blocks: [{text: mentre, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit08.lesson02.exercise02.listen_entrambe_buono
            type: listen_select
            tested_text: "Entrambe le recensioni dicono che il cibo è buono"
            media_asset_key: it.b2.audio.sintesi.entrambe_buono.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit08.lesson02.exercise03.match_comparison_words
            type: matching_pairs
            tested_text: "entrambe tutte e due mentre al contrario a differenza di da un lato dall'altro economico"
            prompt: {target_blocks: []}
            pairs:
              - {left: entrambe, right: "both (of them)"}
              - {left: "tutte e due", right: "both (the two)"}
              - {left: mentre, right: whereas}
              - {left: "al contrario", right: "by contrast"}
              - {left: "a differenza di", right: "in contrast to"}
              - {left: "da un lato ... dall'altro", right: "on one hand ... on the other"}
              - {left: economico, right: "cheap / inexpensive"}
          - content_key: it.b2.unit08.lesson02.exercise04.order_entrambe_buono
            type: word_order
            tested_text: "Entrambe le recensioni dicono che il cibo è buono"
            prompt: {target_blocks: []}
            word_bank: [Entrambe, le, recensioni, dicono, che, il, cibo, è, buono]
          - content_key: it.b2.unit08.lesson02.exercise05.translate_mentre
            type: translation
            tested_text: "Giulia è positiva, mentre Marco è negativo"
            prompt: {target_blocks: [{text: "Translate into Italian, using mentre: Giulia is positive, whereas Marco is negative.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit08.lesson02.exercise06.translate_a_differenza_di
            type: translation
            tested_text: "A differenza di Giulia, Marco lo trova caro"
            prompt: {target_blocks: [{text: "Translate into Italian, using a differenza di: In contrast to Giulia, Marco finds it expensive.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit08.lesson02.exercise07.write_da_un_lato
            type: writing_prompt
            tested_text: "Da un lato è buono, dall'altro è caro"
            prompt: {target_blocks: [{text: "Write in Italian, using da un lato ... dall'altro ...: On one hand it's good, on the other hand it's expensive.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit08.lesson02.exercise08.dictation_entrambe_buono
            type: dictation
            tested_text: "Entrambe le recensioni dicono che il cibo è buono"
            media_asset_key: it.b2.audio.sintesi.entrambe_buono.01
            prompt: {target_blocks: []}

      - content_key: it.b2.unit08.lesson03.dove_sono_daccordo
        title: "Dove sono d'accordo?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: it.b2.unit08.lesson03.teach.daccordo_su
