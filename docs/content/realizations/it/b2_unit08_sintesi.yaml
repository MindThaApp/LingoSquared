schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: it
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is it's B2
    synthesis unit and the FINAL B2 unit for this direction. No adaptable
    intermediate/upper-intermediate public-domain Italian source exists, so
    this was built from general Italian grammar/discourse knowledge, the
    same honest-disclosure precedent unit01-07 set. Sibling-isolation
    honored: the nl b2 unit08 realization/overlay was read once for the
    dispatch's required STRUCTURE mirror (spine outcome, lesson-count
    pacing) but no Dutch text was consulted while writing any Italian
    sentence; the SCENARIO was also deliberately changed from the exemplar
    (two written restaurant reviews plus a Sam/Elena spoken discussion, not
    two Lotte/Omar spoken sources) to avoid a structurally-identical scene.
    Character canon (grepped docs/content/realizations/it/*.yaml before
    writing): Sam is an American engineer from Chicago in Milan for work;
    Elena is an Italian teacher from Milan; Marco is Elena's colleague
    (established in unit02_speculazione, where he speculates with Elena
    about Sam's lateness) -- reused here as one of the two named review
    authors, introducing no canon conflict (he is not given a new
    occupation or trait, just authorship of an opinion). Giulia is a new
    named review author local to this unit, verified unused corpus-wide
    before writing (grepped docs/content/realizations/it/*.yaml -- no
    prior "Giulia"). Theme: Sam and Elena discuss two online reviews (by
    Marco and Giulia) of a new trattoria in Milan, "La Bottega", that AGREE
    the food is good but CONFLICT on the price.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of the whole synthesis toolkit -- the
    attributing frames (secondo X, X sostiene/afferma che, dalla recensione
    si capisce che), the comparing connectives (entrambe, tutte e due,
    mentre, al contrario, a differenza di, da un lato/dall'altro), the
    agreement/conflict frames (essere d'accordo su, dicono lo stesso, non
    essere d'accordo su, la differenza, si contraddicono) and the judgement
    frames (il più convincente è, lo trovo più convincente, meglio motivato,
    tutto sommato) -- confirm each reads as current everyday Italian; (2)
    confirm "si contraddicono sul punto del prezzo" is idiomatic and that
    "sul punto di" is the natural collocation; (3) the culminating writing
    exercise (lesson06 exercise06) is graded against a fixed three-sentence
    string -- only the trailing-period and comma-before-'perché' variants
    are supplied, so decide whether more punctuation variants are needed;
    (4) confirm "la recensione", "la fonte", "motivato/a", "convincente",
    "economico" all read as natural everyday Italian; (5) confirm the
    deduction the unit rests on -- that Marco's view is 'better supported'
    BECAUSE he names a concrete price (sedici euro) while Giulia only
    asserts -- is a fair, single-answer reading of the two sources.
  notes: >-
    it's B2 synthesis unit and the FINAL B2 unit for en-it. Targets the
    CEFR B2 synthesis outcome
    (universal.b2.synthesis.summarize_and_evaluate_multiple_sources):
    summarize and evaluate multiple sources -- name where two sources
    agree, where they conflict, and give a reasoned judgement between them.
    Theme: one coherent everyday puzzle across all six lessons -- two
    online reviews of a new trattoria in Milan (La Bottega), one by Marco
    (Elena's established colleague) and one by Giulia (new), that AGREE the
    food is good but CONFLICT on the price. Lesson arc: L01 attributing a
    claim to a source (secondo / sostiene / afferma / dalla recensione si
    capisce che); L02 comparing two sources side by side (entrambe / tutte
    e due / mentre / al contrario / a differenza di / da un lato/
    dall'altro); L03 naming AGREEMENT (essere d'accordo su / lo stesso / sul
    punto di); L04 naming CONFLICT (non essere d'accordo su / la
    differenza / si contraddicono sul punto di); L05 a reading of BOTH
    review texts side by side -- identify the agreement, the conflict
    point, and which review backs its price claim with a reason; L06 the
    culminating production -- a Sam/Elena dialogue for the listening
    requirement (identify agreement, conflict, and which speaker is better
    supported), a speaking synthesis, and a writing synthesis that NAMES
    all three parts (agreement + conflict + reasoned judgement). Register:
    tu throughout, per the it-lane canon; Sam and Elena continue their tu.
    All vocabulary is introduced self-contained within this file (B2 is a
    separate Course row from B1, so a B2 learner never sees B1/A2 lexemes
    at runtime). No sibling-direction file was consulted; no Dutch sentence
    was reused or adapted.

course:
  realization_key: it.b2
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Tu throughout (established it-lane canon). B2 synthesis layers the
    attributing, comparing, agreement/conflict and judgement toolkit onto
    that register -- secondo, sostiene, afferma, dalla recensione si capisce
    che, entrambe, mentre, al contrario, a differenza di, sono d'accordo su,
    non sono d'accordo su, si contraddicono, il più convincente, meglio
    motivato, tutto sommato -- while keeping everyday informal address (tu,
    penso, siamo d'accordo). Sam and Elena continue the tu they use with
    each other.

