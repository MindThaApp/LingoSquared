            kind: phrase
            target: {text: "contraddirsi (si contraddicono)", language_code: it, direction: ltr}
            introduced_tokens: [si, contraddicono, contraddirsi]
            example: {text: "Su questo punto si contraddicono.", language_code: it, direction: ltr}
          - content_key: it.b2.unit08.lesson04.teach.sul_punto_del_prezzo
            kind: phrase
            target: {text: "si contraddicono sul punto del prezzo", language_code: it, direction: ltr}
            introduced_tokens: [del]
          - content_key: it.b2.unit08.lesson04.teach.eppure
            kind: vocabulary
            target: {text: "eppure", language_code: it, direction: ltr}
            introduced_tokens: [eppure]
