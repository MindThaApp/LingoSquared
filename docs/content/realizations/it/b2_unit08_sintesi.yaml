          - content_key: it.b2.unit08.lesson03.exercise03.match_agreement_words
            type: matching_pairs
            tested_text: "essere d'accordo su dicono lo stesso l'opinione sul punto di il punto prezzo"
            prompt: {target_blocks: []}
            pairs:
