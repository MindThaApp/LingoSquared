 fixes - re-checked answer keys, word orders, distractors vs audio, matching lefts, canon, cumulative vocab, boolean coercion, jargon; no learner-facing defects found. NATIVE FLAGS: unreferenced dialogue asset viaggio_roma still incoherent (see prior flag). DEFERRED: none."

