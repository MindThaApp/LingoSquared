units:
  - content_key: it.a1.unit19.travel
    title: "Alla stazione"
    section: speaking
    spine_outcome_ids: [universal.a1.travel.handle_basic_journey]
    planned_lesson_count: 2
    lessons:
      - content_key: it.a1.unit19.lesson01.treno_e_stazione
        title: "Il treno e la stazione"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: it.a1.unit19.lesson01.teach.treno_stazione
            kind: vocabulary
            target: {text: "il treno, la stazione", language_code: it, direction: ltr}
            introduced_tokens: [il, treno, la, stazione]
            example:
              - {text: "Il treno è alla stazione.", language_code: it, direction: ltr}
          - content_key: it.a1.unit19.lesson01.teach.binario_biglietto
            kind: vocabulary
            target: {text: "il binario, il biglietto", language_code: it, direction: ltr}
            introduced_tokens: [il, binario, biglietto]
            example:
              - {text: "Il biglietto è per Roma.", language_code: it, direction: ltr}
          - {content_key: it.a1.unit19.lesson01.teach.parte_alle_otto, kind: phrase, target: {text: "Parte alle otto.", language_code: it, direction: ltr}, introduced_tokens: [Parte, alle, otto], example: [{text: "Il treno parte alle otto.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit19.lesson01.teach.dal_binario_tre, kind: phrase, target: {text: "dal binario tre", language_code: it, direction: ltr}, introduced_tokens: [dal, binario, tre], example: [{text: "Parte dal binario tre.", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a1.unit19.lesson01.exercise01.choose_treno, type: multiple_choice, tested_text: "il treno", prompt: {target_blocks: []}}
          - {content_key: it.a1.unit19.lesson01.exercise02.listen_travel_words, type: listen_select, tested_text: "il treno la stazione il binario il biglietto", media_asset_key: it.a1.audio.travel_vocab.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit19.lesson01.exercise03.choose_parte_alle_otto, type: multiple_choice, tested_text: "Parte alle otto", prompt: {target_blocks: []}}
          - content_key: it.a1.unit19.lesson01.exercise04.match_travel_words
            type: matching_pairs
            tested_text: "il treno la stazione il binario il biglietto parte alle otto dal binario tre"
            prompt: {target_blocks: []}
            pairs:
              - {left: "train", right: "il treno"}
              - {left: "station", right: "la stazione"}
              - {left: "platform", right: "il binario"}
              - {left: "ticket", right: "il biglietto"}
              - {left: "It leaves at eight.", right: "Parte alle otto."}
              - {left: "from platform three", right: "dal binario tre"}
          - {content_key: it.a1.unit19.lesson01.exercise05.order_parte_alle_otto, type: word_order, tested_text: "Parte alle otto", prompt: {target_blocks: []}, word_bank: [Parte, alle, otto]}
          - {content_key: it.a1.unit19.lesson01.exercise06.fill_binario, type: fill_in_blank, tested_text: "binario", prompt: {target_blocks: [{text: "Il treno parte dal ___ tre.", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit19.lesson01.exercise07.write_travel_words, type: writing_prompt, tested_text: "il treno la stazione il binario il biglietto", prompt: {target_blocks: [{text: "Scrivi quattro parole della stazione.", language_code: it, direction: ltr}]}}

      - content_key: it.a1.unit19.lesson02.un_biglietto_per_roma
        title: "Un biglietto per Roma"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - {content_key: it.a1.unit19.lesson02.teach.a_che_ora_parte, kind: phrase, target: {text: "A che ora parte il treno?", language_code: it, direction: ltr}, introduced_tokens: [A, che, ora, parte, il, treno], example: [{text: "A che ora parte il treno per Roma?", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit19.lesson02.teach.vorrei_un_biglietto, kind: phrase, target: {text: "Vorrei un biglietto per Roma alle otto, per favore.", language_code: it, direction: ltr}, introduced_tokens: [Vorrei, un, biglietto, per, Roma, alle, otto, favore], example: [{text: "Alla stazione, vorrei un biglietto per Roma alle otto, per favore.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit19.lesson02.teach.il_treno_per_roma, kind: phrase, target: {text: "il treno per Roma", language_code: it, direction: ltr}, introduced_tokens: [il, treno, per, Roma], example: [{text: "Il treno per Roma parte alle otto.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit19.lesson02.teach.hai_il_biglietto, kind: phrase, target: {text: "Hai il biglietto?", language_code: it, direction: ltr}, introduced_tokens: [Hai, il, biglietto], example: [{text: "Hai il biglietto per Roma?", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a1.unit19.lesson02.exercise01.choose_biglietto_roma, type: multiple_choice, tested_text: "Vorrei un biglietto per Roma alle otto", prompt: {target_blocks: []}}
          - {content_key: it.a1.unit19.lesson02.exercise02.listen_biglietto_roma, type: listen_select, tested_text: "Vorrei un biglietto per Roma alle otto per favore", media_asset_key: it.a1.audio.un_biglietto_per_roma.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit19.lesson02.exercise03.choose_a_che_ora_parte, type: multiple_choice, tested_text: "A che ora parte il treno", prompt: {target_blocks: []}}
          - content_key: it.a1.unit19.lesson02.exercise04.match_journey_phrases
            type: matching_pairs
            tested_text: "a che ora parte il treno vorrei un biglietto per roma alle otto per favore il treno per roma hai il biglietto parte alle otto dal binario tre"
            prompt: {target_blocks: []}
            pairs:
              - {left: "What time does the train leave?", right: "A che ora parte il treno?"}
              - {left: "I would like a ticket to Rome at eight, please.", right: "Vorrei un biglietto per Roma alle otto, per favore."}
              - {left: "the train to Rome", right: "il treno per Roma"}
              - {left: "Do you have the ticket?", right: "Hai il biglietto?"}
              - {left: "It leaves at eight.", right: "Parte alle otto."}
              - {left: "from platform three", right: "dal binario tre"}
          - {content_key: it.a1.unit19.lesson02.exercise05.order_vorrei_biglietto, type: word_order, tested_text: "Vorrei un biglietto per Roma alle otto per favore", prompt: {target_blocks: []}, word_bank: [Vorrei, un, biglietto, per, Roma, alle, otto, per, favore]}
          - {content_key: it.a1.unit19.lesson02.exercise06.reply_biglietto_roma, type: dialogue_response, tested_text: "Vorrei un biglietto per Roma alle otto per favore", prompt: {target_blocks: [{text: "Biglietteria: Buongiorno, desidera?", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit19.lesson02.exercise07.listen_type_biglietto_roma, type: listen_type, tested_text: "Vorrei un biglietto per Roma alle otto per favore", media_asset_key: it.a1.audio.un_biglietto_per_roma.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit19.lesson02.exercise08.write_travel_request, type: writing_prompt, tested_text: "Vorrei un biglietto per Roma alle otto per favore", prompt: {target_blocks: [{text: "Scrivi una richiesta per un biglietto per Roma alle otto.", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit19.lesson02.exercise09.dictation_un_biglietto_per_roma, type: dictation, tested_text: "Vorrei un biglietto per Roma alle otto, per favore", media_asset_key: it.a1.audio.un_biglietto_per_roma.01, prompt: {target_blocks: []}}
