units:
  - content_key: it.a1.unit23.communication
    title: "Al telefono"
    section: speaking
    spine_outcome_ids: [universal.a1.communication.basic_phone_contact]
    planned_lesson_count: 2
    lessons:
      - content_key: it.a1.unit23.lesson01.pronto_chi_parla
        title: "Pronto, chi parla?"
        spine_outcome_id: universal.a1.communication.basic_phone_contact
        teaching:
          - content_key: it.a1.unit23.lesson01.teach_pronto_chi_parla
            kind: vocabulary
            target: {text: "Pronto, chi parla?", language_code: it, direction: ltr}
            introduced_tokens: [Pronto, chi, parla]
            example:
              - {text: "Pronto, sono Elena.", language_code: it, direction: ltr}
          - content_key: it.a1.unit23.lesson01.teach_telefono_messaggio
            kind: vocabulary
            target: {text: "il telefono, un messaggio", language_code: it, direction: ltr}
            introduced_tokens: [il, telefono, un, messaggio, mando]
            example:
              - {text: "Ti mando un messaggio.", language_code: it, direction: ltr}
          - {content_key: it.a1.unit23.lesson01.teach_sono_elena, kind: phrase, target: {text: "Sono Elena.", language_code: it, direction: ltr}, introduced_tokens: [Sono, Elena], example: [{text: "Pronto, sono Elena.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit23.lesson01.teach_ciao_sam, kind: phrase, target: {text: "Ciao Sam, sono Elena.", language_code: it, direction: ltr}, introduced_tokens: [Ciao, Sam, sono, Elena], example: [{text: "Ciao Sam, sono Elena al telefono.", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a1.unit23.lesson01.exercise01.choose_pronto, type: multiple_choice, tested_text: "Pronto", prompt: {target_blocks: []}}
          - {content_key: it.a1.unit23.lesson01.exercise02.listen_phone_words, type: listen_select, tested_text: "Pronto chi parla un messaggio il telefono", media_asset_key: it.a1.audio.phone_vocab.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit23.lesson01.exercise03.choose_ciao_sam, type: multiple_choice, tested_text: "Ciao Sam sono Elena", prompt: {target_blocks: []}}
          - content_key: it.a1.unit23.lesson01.exercise04.match_phone_words
            type: matching_pairs
            tested_text: "pronto chi parla il telefono un messaggio sono elena ciao sam sono elena"
            prompt: {target_blocks: []}
            pairs:
              - {left: "hello? (on the phone)", right: "Pronto?"}
              - {left: "who is speaking?", right: "chi parla?"}
              - {left: "the phone", right: "il telefono"}
              - {left: "a message", right: "un messaggio"}
              - {left: "I am Elena.", right: "Sono Elena."}
              - {left: "Hi Sam, it's Elena.", right: "Ciao Sam, sono Elena."}
          - {content_key: it.a1.unit23.lesson01.exercise05.order_chi_parla, type: word_order, tested_text: "Chi parla", prompt: {target_blocks: []}, word_bank: [Chi, parla]}
          - {content_key: it.a1.unit23.lesson01.exercise06.fill_messaggio, type: fill_in_blank, tested_text: "messaggio", prompt: {target_blocks: [{text: "Ti mando un ___.", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit23.lesson01.exercise07.write_phone_words, type: writing_prompt, tested_text: "Pronto chi parla il telefono un messaggio", prompt: {target_blocks: [{text: "Scrivi quattro parole o frasi del telefono.", language_code: it, direction: ltr}]}}

      - content_key: it.a1.unit23.lesson02.puoi_ripetere
        title: "Puoi ripetere?"
        spine_outcome_id: universal.a1.communication.basic_phone_contact
        teaching:
          - {content_key: it.a1.unit23.lesson02.teach_puoi_ripetere, kind: phrase, target: {text: "Puoi ripetere, per favore?", language_code: it, direction: ltr}, introduced_tokens: [Puoi, ripetere, per, favore], example: [{text: "Sam, puoi ripetere, per favore?", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit23.lesson02.teach_piu_piano, kind: phrase, target: {text: "Più piano, per favore.", language_code: it, direction: ltr}, introduced_tokens: [Più, piano, per, favore], example: [{text: "Parla più piano, per favore.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit23.lesson02.teach_ti_mando_un_messaggio, kind: phrase, target: {text: "Ti mando un messaggio.", language_code: it, direction: ltr}, introduced_tokens: [Ti, mando, un, messaggio], example: [{text: "Ciao Sam, ti mando un messaggio.", language_code: it, direction: ltr}]}
          - {content_key: it.a1.unit23.lesson02.teach_si_sono_elena, kind: phrase, target: {text: "Sì, sono Elena.", language_code: it, direction: ltr}, introduced_tokens: [Sì, sono, Elena], example: [{text: "Sì, sono Elena al telefono.", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a1.unit23.lesson02.exercise01.choose_puoi_ripetere, type: multiple_choice, tested_text: "Puoi ripetere per favore", prompt: {target_blocks: []}}
          - {content_key: it.a1.unit23.lesson02.exercise02.listen_puoi_ripetere, type: listen_select, tested_text: "Puoi ripetere per favore", media_asset_key: it.a1.audio.puoi_ripetere.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit23.lesson02.exercise03.choose_piu_piano, type: multiple_choice, tested_text: "Più piano per favore", prompt: {target_blocks: []}}
          - content_key: it.a1.unit23.lesson02.exercise04.match_clarification
            type: matching_pairs
            tested_text: "puoi ripetere per favore più piano ti mando un messaggio sì sono elena pronto chi parla"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Can you repeat, please?", right: "Puoi ripetere, per favore?"}
              - {left: "More slowly, please.", right: "Più piano, per favore."}
              - {left: "I will send you a message.", right: "Ti mando un messaggio."}
              - {left: "Yes, I am Elena.", right: "Sì, sono Elena."}
              - {left: "hello? (on the phone)", right: "Pronto?"}
              - {left: "who is speaking?", right: "chi parla?"}
          - {content_key: it.a1.unit23.lesson02.exercise05.order_puoi_ripetere, type: word_order, tested_text: "Puoi ripetere per favore", prompt: {target_blocks: []}, word_bank: [Puoi, ripetere, per, favore]}
          - {content_key: it.a1.unit23.lesson02.exercise06.reply_clarify_phone, type: dialogue_response, tested_text: "Puoi ripetere per favore", prompt: {target_blocks: [{text: "Ciao Sam, sono Elena.", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit23.lesson02.exercise07.listen_type_puoi_ripetere, type: listen_type, tested_text: "Puoi ripetere per favore", media_asset_key: it.a1.audio.puoi_ripetere.01, prompt: {target_blocks: []}}
          - {content_key: it.a1.unit23.lesson02.exercise08.write_text_message, type: writing_prompt, tested_text: "Ciao Sam ti mando un messaggio", prompt: {target_blocks: [{text: "Scrivi un messaggio breve a Sam.", language_code: it, direction: ltr}]}}
          - {content_key: it.a1.unit23.lesson02.exercise09.dictation_puoi_ripetere, type: dictation, tested_text: "Puoi ripetere, per favore", media_asset_key: it.a1.audio.puoi_ripetere.01, prompt: {target_blocks: []}}
