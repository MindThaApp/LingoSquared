generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. The source's market
    price drills ("Costano tre euro al chilo", "Un euro e cinquanta") and
    its "il più grande... il più piccolo" (the biggest... the smallest)
    superlative pattern supplied the comparative construction this unit
    adapts ("più... di", "meno... di"). No direct FSI dialogue teaches
    "più/meno... di" comparatives; that pattern is authored from
    established Standard Italian grammar conventions rather than a
    specific source sentence, per AUTHORING_GUIDE.md §10's
    established-conventions fallback. The unit reuses "le mele" and "i
    pomodori" (unit08) and "un euro" (unit03) as the compared items,
    keeping Elena and Sam's tu-register market-shopping frame. All
    dialogue text, teaching notes, and exercises were freshly authored;
    no source sentence appears unchanged.
review:
  status: reviewed
  required_next_reviewer: none
  notes: "Fresh-context review 2026-07-12: piu/meno...di comparatives (dei/delle contractions) and buone come agreement correct; demonstratives fine; glosses accurate; compiler 0 errors. No defects.\n\nSecond-pass review 2026-10-18: 3 fixes — L1 teach.di note: 'di plus an article' was false (the card's own example is 'più di due euro'); now explains di = than and the dei/delle contraction; L1ex07: instruction names the three words in order; L3ex06: added 'Sì, le mele sono buone come i pomodori' (instruction says 'reply that yes'). NATIVE FLAGS: dialogue 'Preferisco le mele, ma le mele sono buone come i pomodori!' — 'ma' reads oddly; L1 example 'Voglio più caffè, meno tè' uses untaught 'voglio' (glossed, not tested)."

