generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is it's second
    B2 unit (speculation). No adaptable intermediate/upper-intermediate
    public-domain Italian source exists, so this was built from general
    Italian grammar/discourse knowledge, the same honest-disclosure
    precedent unit01 set. Sibling-isolation honored: no other language's B2
    file was consulted for text; only the nl b2 exemplar's STRUCTURE was
    mirrored, per the dispatch instructions. Character canon (grepped
    docs/content/realizations/it/*.yaml before writing): Sam is an American
    engineer from Chicago in Milan for work; Elena is an Italian teacher
    from Milan; tu register between them. This unit introduces Marco as a
    minor new supporting character (a colleague of Elena's) for lesson06's
    dialogue -- Marco has no established facts elsewhere in the corpus to
    contradict, so this introduces no canon conflict. Each B2 unit is
    self-contained from the OTHER B2 units in this tier (re-teaches its own
    vocabulary even where unit01 already taught an overlapping word, e.g.
    "perché", "avere"), matching the nl b2 exemplar's own demonstrated
    pattern.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) the certainty scale ordering (forse <
    probabilmente < sarà < di sicuro < senza dubbio < sicuramente) reads
    correctly to a native ear, and that the EPISTEMIC FUTURE ("Sarà in
    ritardo." = "He's probably late") is unambiguous and not misread as a
    genuine future tense in context; (2) the deduction constructions "deve
    essere" / "non può essere" and the past-deduction clusters "deve aver
    perso", "deve essere successo", "deve essersi svegliato", "potrebbe
    aver perso", "potrebbe essersi svegliato" are all natural word order
    and correctly select avere vs. essere/essersi as the auxiliary; (3) the
    deduction-vs-guess distinction taught in lesson03/lesson06 (deduction =
    deve/non può + evidence via perché/quindi; guess = potrebbe/magari/
    immagino che/scommetto che, no firm evidence) matches how a native
    would frame it; (4) the culminating writing exercise (lesson06
    exercise06) is graded against a fixed two-sentence string -- only the
    all-periods and no-trailing-period variants are supplied; decide
    whether more variants are needed; (5) confirm "essere bloccato nel
    traffico", "l'ho visto poco fa", "la sua auto non c'è", and "ora di
    punta" all read as current everyday Standard Italian.
  notes: >-
    Second Italian B2 unit; first speculation unit. Targets the CEFR B2
    speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    speculate about causes and consequences with graded certainty -- say
    what may/might/must/cannot be the case in the PRESENT and the PAST, and
    distinguish deduction (evidence-based) from guesswork. Theme: Sam is
    late to meet Elena and her colleague Marco; they speculate why. Lesson
    arc: L01 the certainty scale (forse / probabilmente / sarà (epistemic
    future) / di sicuro / senza dubbio / sicuramente) applied to a present
    cause; L02 present deduction from evidence (deve essere / non può
    essere + perché/quindi); L03 tentative possibility and the
    deduction-vs-guess line (potrebbe essere / magari / immagino che /
    scommetto che / non ne sono sicuro); L04 PAST speculation (deve aver
    perso / deve essere successo / deve essersi svegliato / potrebbe aver
    perso); L05 a reading that separates asserted fact from speculation;
    L06 the culminating production -- an Elena/Marco dialogue for the
    listening requirement (rank certainty + deduce-vs-guess), a speaking
    task, and a writing task that requires speculating about a PAST cause
    AND a PRESENT cause at DIFFERENT certainty levels. Register: tu, per
    the established canon. All vocabulary is introduced self-contained
    within this file. No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    accepted-answer completeness and word-order variants, underdetermined
    prompts, matching_pairs discrimination and realization/overlay mirrors,
    learner-visible internal ids, grammar-note accuracy, example_gloss vs
    example, YAML booleans. Fixes: lesson01.teach.sara title +
    lesson01.exercise03.match_certainty_words pair (realization and overlay
    mirror) "is probably (future of certainty)" -> "is probably (future of
    probability)"; lesson01.exercise05 accepted + "Probabilmente è in
    ritardo"; lesson01.exercise06 accepted + "È senza dubbio in ritardo";
    lesson01.exercise07 accepted + "Sam non c'è ancora";
    lesson02.exercise05, lesson06.exercise05, lesson06.exercise07 accepted +
    elided "Dev'essere bloccato nel traffico"; lesson03.teach.immagino_che
    note: dropped the "(unit01)" internal id;
    lesson03.exercise06.speak_magari_ancora prompt (realization target_block
    + overlay instruction) pinned "guessing with magari";
    lesson03.exercise07.write_non_sicuro accepted + "Non ne sono sicura",
    "Non sono sicuro", "Non sono sicura" (gender rule) and feedback mentions
    sicura; lesson04.exercise06 accepted + "Dev'essere successo qualcosa",
    "Qualcosa deve essere successo"; lesson04.teach.grammar_passato note
    corrected (aver, or essere for verbs like succedere, essersi for
    reflexives); lesson06.exercise06 accepted + adverb-first and
    comma-joined variants (3); lesson06.exercise07.respond_speculate
    instruction pinned to "...a confident present deduction that he is stuck
    in traffic". NATIVE FLAGS: certainty-scale ranking (sarà vs
    probabilmente, sicuramente vs senza dubbio) and near-synonym rights for
    di sicuro/senza dubbio/sicuramente in match_certainty_words;
    lesson06.exercise06 train + traffic causes are mutually odd (coherence).
    DEFERRED: per-unit course.description under the shared "Italian B2"
    course (structural/compiler question).

course:
  realization_key: it.b2
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Tu throughout (established it-lane canon). B2 speculation layers modals
    and adverbs of deduction onto that register -- deve, non può essere,
    potrebbe, forse, probabilmente, sarà (epistemic future), sicuramente --
    while keeping everyday informal address.

