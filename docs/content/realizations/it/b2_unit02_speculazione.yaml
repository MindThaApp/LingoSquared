      bloccato nel traffico. È ora di punta. Elena: Potrebbe essersi
      svegliato tardi? Marco: No, non può essere. L'ho visto stamattina.
      Elena: Allora deve aver perso il treno. Marco: Forse. Non ne sono
      sicuro.
    voice_hint: two_adults_neutral_friendly
