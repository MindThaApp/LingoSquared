            type: listen_select
            prompt:
              target_blocks:
                - {text: "Elena has just finished a difficult project that went very well. She says this about it. What does 'Non è male' signal?", language_code: en, direction: ltr}
            correct_option: "Understatement of an accomplishment"
            options:
              - "Understatement of an accomplishment"
              - "Literal negative statement"
              - "Genuine praise"
            tested_text: "Non è male"
            media_asset_key: it.c1.audio.ironia.understatement.01

