            target: {text: "Rispondere con ironia", language_code: it, direction: ltr}
            introduced_tokens: [Rispondere, con, ironia]
            example: {text: "Quando critichi in modo indiretto, rispondi con ironia.", language_code: it, direction: ltr}

        exercises:
          - content_key: it.c1.unit02.lesson05.exercise01.speak_understatement
            type: dialogue_response
            prompt:
              target_blocks:
                - {text: "Your boss says you have too much free time at work. Reply ironically in Italian: 'Yes, of course, we have such a relaxing life.' Then say plainly in Italian: 'Life is not so relaxing.'", language_code: en, direction: ltr}
            tested_text: "Sì, naturalmente, abbiamo una vita così rilassante. La vita non è così rilassante."
            correct_response: "Sì, naturalmente, abbiamo una vita così rilassante. La vita non è così rilassante."
            feedback: "Good. You used irony to signal skepticism, then stated the unstated judgement."

