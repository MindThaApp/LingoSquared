    planned_lesson_count: 6

    lessons:
      - content_key: it.c1.unit02.lesson01.riconoscere_sottinteso
        title: "Riconoscere il sottinteso"
        spine_outcome_id: universal.c1.inference.infer_implicit_meaning
        teaching:
          - content_key: it.c1.unit02.lesson01.teach.non_male
            kind: phrase
            target: {text: "Non è male", language_code: it, direction: ltr}
            introduced_tokens: [Non, è, male]
            example: {text: "Non è male, per un inizio.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson01.teach.sottinteso
            kind: vocabulary
            target: {text: "il sottinteso", language_code: it, direction: ltr}
            introduced_tokens: [il, sottinteso]
            example: {text: "Il sottinteso è quello che intendi senza dirlo.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson01.teach.ironia
            kind: vocabulary
            target: {text: "l'ironia", language_code: it, direction: ltr}
            introduced_tokens: [l, ironia]
            example: {text: "L'ironia è dire il contrario di quello che pensi.", language_code: it, direction: ltr}

        exercises:
          - content_key: it.c1.unit02.lesson01.exercise01.recognize_understatement
            type: multiple_choice
            prompt:
              target_blocks:
                - {text: "Non è male", language_code: it, direction: ltr}
            correct_option: "Downplaying something quite good"
            options:
              - "Downplaying something quite good"
              - "Something genuinely bad"
              - "A literal statement"
            tested_text: "Non è male"

      - content_key: it.c1.unit02.lesson02.contesto_ironia
        title: "L'ironia nel contesto"
        spine_outcome_id: universal.c1.inference.infer_implicit_meaning
        teaching:
          - content_key: it.c1.unit02.lesson02.teach.contesto
            kind: vocabulary
            target: {text: "il contesto", language_code: it, direction: ltr}
            introduced_tokens: [il, contesto]
            example: {text: "Il contesto spiega se una frase è ironica.", language_code: it, direction: ltr}

        exercises:
          - content_key: it.c1.unit02.lesson02.exercise01.match_context
            type: matching_pairs
            prompt:
              pairs:
                - {left: "Non è male", right: "Understatement"}
                - {left: "L'ironia", right: "saying the opposite of what you mean"}
                - {left: "Il contesto", right: "Situation"}
            tested_text: "Non è male. L'ironia. Il contesto."

      - content_key: it.c1.unit02.lesson03.intenzione_letterale
        title: "L'intenzione vs. il significato letterale"
        spine_outcome_id: universal.c1.inference.infer_implicit_meaning
        teaching:
          - content_key: it.c1.unit02.lesson03.teach.intenzione
            kind: vocabulary
            target: {text: "l'intenzione", language_code: it, direction: ltr}
            introduced_tokens: [l, intenzione]
            example: {text: "L'intenzione di Sam non è lodarsi.", language_code: it, direction: ltr}

        exercises:
          - content_key: it.c1.unit02.lesson03.exercise01.infer_meaning
            type: multiple_choice
            prompt:
              target_blocks:
                - {text: "When someone says 'Non è male' about their impressive work, what do they really mean?", language_code: en, direction: ltr}
            correct_option: "They are downplaying it"
            options:
              - "They are downplaying it"
              - "It is actually bad"
              - "It is literally not negative"
            tested_text: "Non è male"

      - content_key: it.c1.unit02.lesson04.ascolto_implicito
        title: "Ascoltare l'implicito"
        spine_outcome_id: universal.c1.inference.infer_implicit_meaning
        teaching:
          - content_key: it.c1.unit02.lesson04.teach.indizio
            kind: vocabulary
            target: {text: "l'indizio", language_code: it, direction: ltr}
            introduced_tokens: [l, indizio]
            example: {text: "Il tono è un indizio dell'ironia.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson04.teach.sì
            kind: vocabulary
            target: {text: "sì", language_code: it, direction: ltr}
            introduced_tokens: [sì]
            example: {text: "Sì, naturalmente.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson04.teach.naturalmente
            kind: vocabulary
            target: {text: "naturalmente", language_code: it, direction: ltr}
            introduced_tokens: [naturalmente]
            example: {text: "Sì, naturalmente, abbiamo una vita così rilassante.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson04.teach.abbiamo
            kind: vocabulary
            target: {text: "abbiamo", language_code: it, direction: ltr}
            introduced_tokens: [abbiamo]
            example: {text: "Abbiamo una vita così rilassante.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson04.teach.vita
            kind: vocabulary
            target: {text: "la vita", language_code: it, direction: ltr}
            introduced_tokens: [la, vita]
            example: {text: "La vita è rilassante.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson04.teach.così
            kind: vocabulary
            target: {text: "così", language_code: it, direction: ltr}
            introduced_tokens: [così]
            example: {text: "La vita è così rilassante.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson04.teach.rilassante
            kind: vocabulary
            target: {text: "rilassante", language_code: it, direction: ltr}
            introduced_tokens: [rilassante]
            example: {text: "Una vita rilassante è quello che vogliamo.", language_code: it, direction: ltr}

        exercises:
