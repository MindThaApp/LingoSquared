            example: {text: "Questo progetto è davvero facile.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson06.teach.questo
            kind: vocabulary
            target: {text: "questo", language_code: it, direction: ltr}
            introduced_tokens: [questo]
            example: {text: "Questo è difficile.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson06.teach.davvero
            kind: vocabulary
            target: {text: "davvero", language_code: it, direction: ltr}
            introduced_tokens: [davvero]
            example: {text: "Questo progetto è davvero facile.", language_code: it, direction: ltr}
          - content_key: it.c1.unit02.lesson06.teach.facile
            kind: vocabulary
            target: {text: "facile", language_code: it, direction: ltr}
            introduced_tokens: [facile]
            example: {text: "Non è facile completarlo.", language_code: it, direction: ltr}

        exercises:
          - content_key: it.c1.unit02.lesson06.exercise01.comprehend_full
            type: reading_comprehension
            prompt:
              target_blocks:
                - {text: "Non è facile completarlo. Sì, naturalmente, questo progetto è davvero facile!", language_code: it, direction: ltr}
            correct_option: "No, the speaker is being ironic"
            options:
              - "No, the speaker is being ironic"
              - "Yes, the speaker means the project is easy"
              - "The speaker is unsure"
            tested_text: "Questo progetto è davvero facile"

          - content_key: it.c1.unit02.lesson06.exercise02.write_implicit_judgement
            type: writing_prompt
            prompt:
              target_blocks:
                - {text: "Write an ironic message in Italian, then state plainly what you mean: 'This project is really easy. The project is not really easy.'", language_code: en, direction: ltr}
            tested_text: "Questo progetto è davvero facile. Il progetto non è davvero facile."
            accepted_answers:
              - value: "Questo progetto è davvero facile. Il progetto non è davvero facile."
                status: correct
              - value: "Sì, naturalmente, questo progetto è davvero facile. Il progetto non è davvero facile."
                status: correct
              - value: "Questo progetto è davvero facile. Il progetto non è davvero facile"
                status: correct
            feedback: "You used irony to imply the opposite of the literal claim, then stated the unstated judgement."
