          - {"content_key": "it.a2.unit99.sai_dov_e.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "È vicino al museo. Sai se il treno per Roma parte alle nove?", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["È", "vicino", "al", "museo", "Sai", "se", "il", "treno", "per", "Roma", "parte", "alle", "nove"]}
          - {"content_key": "it.a2.unit99.sai_dov_e.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Non so a che ora parte, ma so quanto costa il biglietto.", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Non", "so", "a", "che", "ora", "parte", "ma", "quanto", "costa", "il", "biglietto"]}
