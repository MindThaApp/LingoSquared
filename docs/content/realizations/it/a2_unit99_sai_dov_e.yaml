          - {"content_key": "it.a2.unit99.sai_dov_e.lesson06.giulia_e_marco.exercise03.abbina", "type": "matching_pairs", "tested_text": "Sai dov'è la stazione È vicino al museo Sai se il treno per Roma parte alle nove So quanto costa il biglietto Sai perché Luca non viene con noi Non so perché", "prompt": {"target_blocks": []}, "pairs": [{"left": "Sai dov'è la stazione?", "right": "Do you know where the station is?"}, {"left": "È vicino al museo.", "right": "It is near the museum."}, {"left": "Sai se il treno per Roma parte alle nove?", "right": "Do you know if the train for Rome leaves at nine?"}, {"left": "So quanto costa il biglietto.", "right": "I know how much the ticket costs."}, {"left": "Sai perché Luca non viene con noi?", "right": "Do you know why Luca is not coming with us?"}, {"left": "Non so perché.", "right": "I do not know why."}]}
