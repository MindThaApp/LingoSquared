      - content_key: it.a2.unit93.dovresti_dormire_di_piu.lesson06.giulia_e_luca
        title: "Giulia e Luca parlano di soldi"
        spine_outcome_id: universal.a2.advice.give_simple_advice
        teaching:
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Giulia, spendo troppi soldi. Che cosa devo fare?", "language_code": "it", "direction": "ltr", "speaker": "Luca"}, "introduced_tokens": ["Giulia", "spendo", "troppi", "soldi", "Che", "cosa", "devo", "fare"]}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Dovresti risparmiare ogni mese.", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Dovresti", "risparmiare", "ogni", "mese"]}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Hai ragione, ma è difficile.", "language_code": "it", "direction": "ltr", "speaker": "Luca"}, "introduced_tokens": ["Hai", "ragione", "ma", "è", "difficile"]}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Sarebbe meglio non comprare cose inutili. Ti consiglio di scrivere le spese.", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Sarebbe", "meglio", "non", "comprare", "cose", "inutili", "Ti", "consiglio", "di", "scrivere", "le", "spese"]}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Buona idea! Scrivo le spese ogni giorno.", "language_code": "it", "direction": "ltr", "speaker": "Luca"}, "introduced_tokens": ["Buona", "idea", "Scrivo", "le", "spese", "ogni", "giorno"]}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Bravo! E non spendere troppo al bar!", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Bravo", "E", "non", "spendere", "troppo", "al", "bar"]}
        exercises:
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.exercise01.capisci_soldi", "type": "dialogue_comprehension", "tested_text": "Giulia spendo troppi soldi", "media_asset_key": "it.a2.audio.dialogue.dovresti_dormire_di_piu.01", "prompt": {"target_blocks": [{"text": "What is Luca's problem?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.exercise02.capisci_spese", "type": "dialogue_comprehension", "tested_text": "Ti consiglio di scrivere le spese", "media_asset_key": "it.a2.audio.dialogue.dovresti_dormire_di_piu.01", "prompt": {"target_blocks": [{"text": "What does Giulia advise Luca to write?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.exercise03.abbina_dialogo", "type": "matching_pairs", "tested_text": "Spendo troppi soldi Dovresti risparmiare ogni mese Hai ragione ma è difficile Non comprare cose inutili Buona idea Non spendere troppo al bar", "prompt": {"target_blocks": []}, "pairs": [{"left": "Spendo troppi soldi.", "right": "I spend too much money."}, {"left": "Dovresti risparmiare ogni mese.", "right": "You should save every month."}, {"left": "Hai ragione, ma è difficile.", "right": "You are right, but it is difficult."}, {"left": "Non comprare cose inutili.", "right": "Don't buy useless things."}, {"left": "Buona idea!", "right": "Good idea!"}, {"left": "Non spendere troppo al bar!", "right": "Don't spend too much at the bar!"}]}
          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.exercise04.ordina_risparmiare", "type": "word_order", "tested_text": "Dovresti risparmiare ogni mese", "prompt": {"target_blocks": []}, "word_bank": ["ogni", "mese", "risparmiare", "Dovresti"]}
