          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson05.exercise03.abbina_lettura", "type": "matching_pairs", "tested_text": "Sono sempre stanco Studio fino a tardi Dormo poco Dovresti dormire di più Ti consiglio di bere più acqua Fai una passeggiata", "prompt": {"target_blocks": []}, "pairs": [{"left": "Sono sempre stanco.", "right": "I am always tired."}, {"left": "Studio fino a tardi.", "right": "I study until late."}, {"left": "Dormo poco.", "right": "I sleep little."}, {"left": "Dovresti dormire di più.", "right": "You should sleep more."}, {"left": "Ti consiglio di bere più acqua.", "right": "I advise you to drink more water."}, {"left": "Fai una passeggiata.", "right": "Go for a walk."}]}
