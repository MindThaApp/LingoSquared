          - {"content_key": "it.a2.unit93.dovresti_dormire_di_piu.lesson06.exercise07.scrivi_tre", "type": "writing_prompt", "tested_text": "Dovresti risparmiare ogni mese Ti consiglio di scrivere le spese Buona idea", "prompt": {"target_blocks": [{"text": "Write exactly three Italian sentences: (1) you should save every month; (2) I advise you to write down your expenses; (3) good idea!", "language_code": "en", "direction": "ltr"}]}}
