  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. Unit XI's arrival
    dialogue ("È arrivata/o sola/o o con la famiglia? Siamo arrivati
    tutti insieme...") and Unit XII's family-and-children vocabulary
    drill ("marito", "moglie", "figlio", "Ho tre figli. Due maschi e una
    femmina.") supplied the family-member vocabulary and the "how many
    children" exchange. The source's diplomatic-posting framing is
    dropped; this unit keeps the family-relationship vocabulary and
    question patterns but reframes them around the ongoing Elena/Sam
    workplace scenario (Elena asking about Sam's family). All dialogue
    text, teaching notes, and exercises were freshly authored per
    AUTHORING_GUIDE.md §10; no source sentence appears unchanged.
review:
