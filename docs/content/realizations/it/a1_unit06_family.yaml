  notes: >-
    First draft, en-it A1 unit06 (family), authored by Claude adapting
    FSI Italian FAST Vol. 1 per AUTHORING_GUIDE.md §10. Continues the
    Elena/Sam scenario. Covers immediate-family vocabulary (madre,
    padre, fratello, sorella, moglie, marito, figlio/figlia), basic
    possessives (mio/mia), and a short "how many siblings/children"
    exchange. Fresh-context full review complete 2026-07-12 (new-language lane, no sampling); zero grammar/register/audio-containment defects, days/months lowercase, tu-register consistent.

    Second-pass review 2026-10-18: 4 fixes - write_family_words: underdetermined 'four family members' -> names mother/father/brother/sister in order, added article variant; write_family_sentence: underdetermined 'two or three sentences' -> one specified sentence (Italian prompt aligned), added valid variants; reply_siblings/write_siblings_answer: added natural 'Sì, ho un fratello e una sorella' variants. NATIVE FLAGS: none.

