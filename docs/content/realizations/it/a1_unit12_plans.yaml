    "Andiamo al cinema stasera?" / "Va bene, andiamo!" and the alternative
    "domani" scheduling exchange. The source's diplomatic/travel framing is
    dropped; this unit reframes the exchange as Elena and Sam making a
    simple plan to go to the cinema. All dialogue text, teaching notes, and
    exercises were freshly authored per AUTHORING_GUIDE.md §10; no source
    sentence appears unchanged.
