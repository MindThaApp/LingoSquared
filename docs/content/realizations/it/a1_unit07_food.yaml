  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. Unit VII's room-service
    breakfast dialogue ("Pronto, servizio camere. Desidera?" / "Un caffè e
    latte e un cornetto, per favore.") supplied the caffè/cornetto ordering
    vocabulary and the "Vorrei..., per favore" request pattern; Unit XIV's
    shop dialogue supplied the "Basta così, grazie" closing formula (adapted
    from the source's "Va bene, li prendo"). The source's hotel-room-service
    and shoe-shop framings are dropped; this unit reframes the vocabulary and
    patterns around Elena and Sam ordering at a neighborhood bar/caffè, the
    ordinary Italian way to get a coffee and a pastry. All dialogue text,
    teaching notes, and exercises were freshly authored per
    AUTHORING_GUIDE.md §10; no source sentence appears unchanged.
review:
  status: reviewed
  required_next_reviewer: null
  notes: "Fresh-context full review (new-language lane, no sampling), 2026-07-12. Zero defects. tu/Lei consistent (service staff use Lei; Elena/Sam tu); vorrei/quanto costa(no)/c'e/dov'e idiom correct; partitive un'acqua/ce n'e una correct; all listen_* audio contains the tested sentence; matching_pairs at 4 for dialogue-line sets (§16 soft-aim WARN only, matches reviewed units 1-3).\n\nSecond-pass review 2026-10-18: 3 fixes - write_food_words: underdetermined 'four foods or drinks' -> names coffee/croissant/sandwich/water in order, added article variant; reply_order_sandwich: instruction asks 'you would like' but 'Vorrei un panino e un'acqua, per favore' was not accepted -> added; write_bar_order: underdetermined 'two or three sentences' -> two specified sentences (Italian prompt aligned). NATIVE FLAGS: none."

