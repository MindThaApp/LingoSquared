    and no-trailing-period variants are supplied; decide whether more
    variants are needed; (6) confirm "eccome" and "non hai tutti i torti"
    -style colloquialisms read as current everyday Standard Italian.
  notes: >-
    Third Italian B2 unit; first discourse/nuance unit. Targets the CEFR B2
    discourse outcome
    (universal.b2.discourse.express_nuance_with_hedging_and_emphasis):
    express nuance by softening or strengthening a statement -- hedging,
    qualification, emphasis and focus constructions -- so the SAME content
    can be delivered tentatively, neutrally, or emphatically. Theme: Elena
    and Sam review a restaurant they tried, softening and strengthening the
    same claims. Lesson arc: L01 basic hedges (in realtà / abbastanza / un
    po' / piuttosto / secondo me / a mio parere); L02 more tentative
    framing (in un certo senso / sembra che / direi che / credo che /
    forse); L03 emphasis and degree (davvero / molto / estremamente /
    assolutamente / sicuramente, stacking them); L04 FOCUS constructions
    (the cleft "è ... che", the pseudo-cleft "quello che ... è ...", and
    proprio / eccome); L05 a reading that separates hedged claims from
    emphatic ones; L06 the culminating production -- an Elena/Sam dialogue
