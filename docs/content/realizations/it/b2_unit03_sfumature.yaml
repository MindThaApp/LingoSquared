            introduced_tokens: [alto]
            example: {text: "Il conto è alto.", language_code: it, direction: ltr}
          - content_key: it.b2.unit03.lesson06.teach.dialogue_elena_domanda
            kind: dialogue
            target: {text: "Cosa ne pensi del ristorante?", language_code: it, direction: ltr, speaker: Elena}
