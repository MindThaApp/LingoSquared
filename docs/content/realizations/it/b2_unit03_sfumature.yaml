          - content_key: it.b2.unit03.lesson06.teach.dialogue_sam_hedge
            kind: dialogue
            target: {text: "Il servizio è a mio parere abbastanza lento, in un certo senso.", language_code: it, direction: ltr, speaker: Sam}
            introduced_tokens: []
          - content_key: it.b2.unit03.lesson06.teach.dialogue_elena_emphasis
            kind: dialogue
            target: {text: "Sì, ma il cibo è davvero estremamente delizioso!", language_code: it, direction: ltr, speaker: Elena}
            introduced_tokens: []
          - content_key: it.b2.unit03.lesson06.teach.dialogue_sam_focus
            kind: dialogue
            target: {text: "È vero. È proprio il cibo che salva il ristorante.", language_code: it, direction: ltr, speaker: Sam}
            introduced_tokens: []
          - content_key: it.b2.unit03.lesson06.teach.dialogue_elena_hedge
            kind: dialogue
            target: {text: "Direi che ne vale la pena.", language_code: it, direction: ltr, speaker: Elena}
            introduced_tokens: []
          - content_key: it.b2.unit03.lesson06.teach.dialogue_sam_assolutamente
            kind: dialogue
            target: {text: "Assolutamente!", language_code: it, direction: ltr, speaker: Sam}
            introduced_tokens: []
          - content_key: it.b2.unit03.lesson06.teach.grammar_sfumature
            kind: grammar_note
            target: {text: "Il ristorante è buono. Il ristorante è a mio parere in realtà abbastanza buono. Il ristorante è davvero estremamente buono.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit03.lesson06.exercise01.classify_hedge
            type: dialogue_comprehension
            tested_text: "abbastanza lento in un certo senso"
            media_asset_key: it.b2.audio.sfumature.dialogo.recensione_ristorante.01
            prompt: {target_blocks: [{text: "Sam says the service is 'a mio parere abbastanza lento, in un certo senso'. Is he hedging, stating neutrally, or emphasizing -- and what does that say about his commitment?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson06.exercise02.classify_emphasis
            type: dialogue_comprehension
            tested_text: "davvero estremamente delizioso"
            media_asset_key: it.b2.audio.sfumature.dialogo.recensione_ristorante.01
            prompt: {target_blocks: [{text: "How does Elena present her claim about the food ('Sì, ma il cibo è davvero estremamente delizioso!')?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson06.exercise03.classify_focus
            type: dialogue_comprehension
            tested_text: "è proprio il cibo che salva il ristorante"
            media_asset_key: it.b2.audio.sfumature.dialogo.recensione_ristorante.01
            prompt: {target_blocks: [{text: "What does Sam do with 'È proprio il cibo che salva il ristorante.'?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson06.exercise04.speak_same_hedged
            type: speak_response
            tested_text: "A mio parere il ristorante è abbastanza buono"
            prompt: {target_blocks: [{text: "Deliver the claim 'The restaurant is good' as a HEDGE that lowers your commitment. Use a mio parere (opening), then abbastanza: The restaurant is, in my view, fairly good.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson06.exercise05.speak_same_emphatic
            type: speak_response
            tested_text: "Il ristorante è davvero estremamente buono"
            prompt: {target_blocks: [{text: "Now deliver the SAME claim as an EMPHATIC statement that raises your commitment, using davvero estremamente: The restaurant is really extremely good.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson06.exercise06.write_both_ways
            type: writing_prompt
            tested_text: "Il conto è un po' alto. Il conto è davvero molto alto."
            prompt: {target_blocks: [{text: "Write the SAME claim about the bill TWO ways, changing only the nuance, not the content. (1) HEDGED, lowering commitment, using un po': The bill is a bit high. (2) EMPHATIC, raising commitment, using davvero molto: The bill is really very high.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson06.exercise07.respond_emphatic
            type: dialogue_response
            tested_text: "Il cibo è davvero estremamente delizioso"
            prompt: {target_blocks: [{text: "Cosa ne pensi del cibo?", language_code: it, direction: ltr}]}
