            tested_text: "Il ristorante è davvero estremamente buono"
            media_asset_key: it.b2.audio.sfumature.davvero_estremamente.01
            prompt: {target_blocks: []}

      - content_key: it.b2.unit03.lesson04.mettere_in_focus
        title: "Mettere in focus"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: it.b2.unit03.lesson04.teach.cleft_che
            kind: phrase
            target: {text: "È il servizio che rende speciale il ristorante.", language_code: it, direction: ltr}
            introduced_tokens: [rende, rendere, speciale]
          - content_key: it.b2.unit03.lesson04.teach.quello_che_e
            kind: phrase
            target: {text: "Quello che è ottimo è il servizio.", language_code: it, direction: ltr}
            introduced_tokens: [quello, ottimo]
          - content_key: it.b2.unit03.lesson04.teach.proprio_questo
            kind: phrase
            target: {text: "È proprio questo il problema.", language_code: it, direction: ltr}
            introduced_tokens: [proprio, questo, problema]
          - content_key: it.b2.unit03.lesson04.teach.eccome
            kind: vocabulary
            target: {text: "eccome", language_code: it, direction: ltr}
            introduced_tokens: [eccome]
            example: {text: "Il ristorante è buono, eccome!", language_code: it, direction: ltr}
          - content_key: it.b2.unit03.lesson04.teach.grammar_focus
            kind: grammar_note
            target: {text: "Il servizio rende speciale il ristorante. È il servizio che rende speciale il ristorante.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit03.lesson04.exercise01.recognize_eccome
            type: multiple_choice
            tested_text: eccome
            prompt: {target_blocks: [{text: eccome, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit03.lesson04.exercise02.listen_cleft_servizio
            type: listen_select
            tested_text: "È il servizio che rende speciale il ristorante"
            media_asset_key: it.b2.audio.sfumature.cleft_servizio.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit03.lesson04.exercise03.match_focus
            type: matching_pairs
            tested_text: "è il servizio che quello che è è proprio eccome rende speciale ottimo il problema"
            prompt: {target_blocks: []}
            pairs:
              - {left: "è ... che", right: "it is ... that (cleft)"}
              - {left: "quello che ... è ...", right: "what ... is ..."}
              - {left: proprio, right: "precisely / just"}
              - {left: eccome, right: "and how / absolutely"}
              - {left: "rende speciale", right: "makes special"}
              - {left: ottimo, right: excellent}
              - {left: "il problema", right: "the problem"}
              - {left: "il servizio", right: "the service"}
          - content_key: it.b2.unit03.lesson04.exercise04.order_cleft_servizio
            type: word_order
            tested_text: "È il servizio che rende speciale il ristorante"
            prompt: {target_blocks: []}
            word_bank: [È, il, servizio, che, rende, speciale, il, ristorante]
          - content_key: it.b2.unit03.lesson04.exercise05.translate_quello_che_e
            type: translation
            tested_text: "Quello che è ottimo è il servizio"
            prompt: {target_blocks: [{text: "Translate into Italian, using the focus frame quello che... è...: What is excellent is the service.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson04.exercise06.write_eccome
            type: writing_prompt
            tested_text: "Il ristorante è buono, eccome"
            prompt: {target_blocks: [{text: "Someone doubts the restaurant is any good. Insist it is, using eccome (after the statement): The restaurant is good, and how!", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson04.exercise07.speak_cleft
            type: speak_response
            tested_text: "È il servizio che rende speciale il ristorante"
            prompt: {target_blocks: [{text: "Say aloud in Italian, using the cleft è ... che to put focus on the service: It is the service that makes the restaurant special.", language_code: en, direction: ltr}]}

      - content_key: it.b2.unit03.lesson05.leggere_recensione
        title: "Leggere una recensione"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: it.b2.unit03.lesson05.teach.testo
            kind: reading
            target:
              text: >-
                Il nuovo ristorante è a mio parere un po' caro. L'inizio
                del servizio è abbastanza lento. Ma il cibo è davvero
                estremamente delizioso. È proprio il cibo che salva il
                ristorante. Direi che ne vale la pena.
              language_code: it
              direction: ltr
            introduced_tokens: [nuovo, caro, l, inizio, del, ma, salva]
        exercises:
          - content_key: it.b2.unit03.lesson05.exercise01.read_hedge
            type: reading_comprehension
            tested_text: "un po' caro"
            prompt: {target_blocks: [{text: "Which opinion does the writer HEDGE -- present tentatively rather than assert flatly?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson05.exercise02.read_hedge_words
            type: reading_comprehension
            tested_text: "a mio parere un po'"
            prompt: {target_blocks: [{text: "Which words mark the writer's hedge about the restaurant being expensive?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson05.exercise03.read_emphasis
            type: reading_comprehension
            tested_text: "davvero estremamente delizioso"
            prompt: {target_blocks: [{text: "Which claim does the writer state most emphatically?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson05.exercise04.read_focus
            type: reading_comprehension
            tested_text: "è proprio il cibo che salva il ristorante"
            prompt: {target_blocks: [{text: "The writer uses the focus construction 'È proprio il cibo che salva il ristorante.' What does it single out?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson05.exercise05.match_reading
            type: matching_pairs
            tested_text: "nuovo caro l'inizio salva del ma"
            prompt: {target_blocks: []}
            pairs:
              - {left: nuovo, right: new}
              - {left: caro, right: expensive}
              - {left: "l'inizio", right: "the beginning"}
              - {left: salva, right: saves}
              - {left: del, right: "of the"}
              - {left: ma, right: but}
          - content_key: it.b2.unit03.lesson05.exercise06.translate_lento
            type: translation
            tested_text: "L'inizio del servizio è abbastanza lento"
            prompt: {target_blocks: [{text: "Translate into Italian, using abbastanza: The beginning of the service is fairly slow.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit03.lesson05.exercise07.write_hedge_caro
            type: writing_prompt
            tested_text: "A mio parere il ristorante è un po' caro"
            prompt: {target_blocks: [{text: "Soften this blunt statement into a hedged one. Blunt: The restaurant is expensive. Hedge it using a mio parere (opening) and un po': In my view, the restaurant is a bit expensive.", language_code: en, direction: ltr}]}

      - content_key: it.b2.unit03.lesson06.sfumature_in_conversazione
        title: "Sfumature in una conversazione"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: it.b2.unit03.lesson06.teach.cosa_ne_pensi
