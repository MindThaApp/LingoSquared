  dialect: it_IT_standard
  register_policy: >-
    Tu throughout (established it-lane canon). B2 discourse layers hedging
    adverbs/phrases (in realtà, abbastanza, un po', piuttosto, secondo me,
    a mio parere, in un certo senso, sembra che, direi che) and
    emphasis/focus devices (davvero, molto, estremamente, assolutamente,
    sicuramente, eccome, the cleft "è ... che" and pseudo-cleft "quello
    che ... è ...") onto that register.

