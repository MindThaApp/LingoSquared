    delizioso", "Il cibo è estremamente delizioso". NATIVE FLAGS: "il
    ristorante vale la pena" (natives may prefer "vale la pena andarci" /
    "il ristorante merita"); "davvero molto delizioso" and "assolutamente
    delizioso" naturalness; "il conto è un po' alto" (natives may prefer
