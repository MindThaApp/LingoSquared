    language: it
    text: >-
      Elena: Buongiorno! Lei è il nuovo collega, vero? Sam: Sì, buongiorno.
      Mi chiamo Sam. Elena: Piacere, io sono Elena. Come sta? Sam: Sto bene,
      grazie, e Lei? Elena: Bene anch'io, grazie. Benvenuto in ufficio! Sam:
      Grazie mille. Elena: A dopo, Sam. Sam: A dopo, Elena.
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
