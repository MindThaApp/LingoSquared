course:
  realization_key: it.a1
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Teach contemporary Standard Italian as spoken in Italy today. Use tu
    as the normal informal address among peers, classmates, and young
    colleagues; use Lei where respectful distance, a stranger, or a
    workplace hierarchy makes it natural (e.g. addressing a manager, a
    shopkeeper, or someone significantly older on first meeting). Keep
    each exercise's register explicit and preserve the corresponding verb
    form (tu stai / Lei sta; tu ti chiami / Lei si chiama).

