generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. Unit VIII's hotel-desk
    dialogue and drills supplied the "Dov'è...?" location question, "Scusi,
    dov'è la farmacia?" pattern, and the "C'è un/una... qui vicino?" /
    "Sì, ce n'è uno/a qui vicino." existence-and-proximity exchange (adapted
    from "C'è un parrucchiere/una farmacia qui vicino?"). The source's
    diplomatic-hotel framing is dropped; this unit reframes the vocabulary
    around Elena and Sam asking a passerby where common places (farmacia,
    banca, stazione, ufficio postale) are located in their neighborhood.
    All dialogue text, teaching notes, and exercises were freshly authored
    per AUTHORING_GUIDE.md §10; no source sentence appears unchanged.
