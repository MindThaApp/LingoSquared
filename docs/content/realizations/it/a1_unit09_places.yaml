  dialect: it_IT_standard
  register_policy: >-
    Teach contemporary Standard Italian. Tu-register between Elena and Sam;
    both use the polite "Scusi" (excuse me) toward a stranger when asking
    for directions, as is normal in this kind of public exchange.

