units:
  - content_key: it.b2.unit04.narrativa
    title: "Raccontare una storia"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.narrative.recount_complex_events_with_shifting_time
    planned_lesson_count: 6

    lessons:
      - content_key: it.b2.unit04.lesson01.lo_sfondo
        title: "Lo sfondo: com'era"
        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: it.b2.unit04.lesson01.teach.ero_stanco
            kind: phrase
            target: {text: "Ero stanco.", language_code: it, direction: ltr}
            introduced_tokens: [ero, essere, stanco]
          - content_key: it.b2.unit04.lesson01.teach.quella_mattina
            kind: vocabulary
            target: {text: "quella mattina", language_code: it, direction: ltr}
            introduced_tokens: [quella, mattina]
            example: {text: "Quella mattina ero stanco.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson01.teach.piovere
            kind: vocabulary
            target: {text: "piovere", language_code: it, direction: ltr}
            introduced_tokens: [piovere, pioveva]
            example: {text: "Pioveva quella mattina.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson01.teach.fuori
            kind: vocabulary
            target: {text: "fuori", language_code: it, direction: ltr}
            introduced_tokens: [fuori]
            example: {text: "Fuori pioveva.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson01.teach.freddo
            kind: vocabulary
            target: {text: "freddo", language_code: it, direction: ltr}
            introduced_tokens: [freddo]
            example: {text: "Fuori faceva freddo.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson01.teach.avere_fretta
            kind: phrase
            target: {text: "avevo fretta", language_code: it, direction: ltr}
            introduced_tokens: [avevo, avere, fretta]
          - content_key: it.b2.unit04.lesson01.teach.era_ancora_buio
            kind: phrase
            target: {text: "Era ancora buio.", language_code: it, direction: ltr}
            introduced_tokens: [era, ancora, buio]
          - content_key: it.b2.unit04.lesson01.teach.grammar_imperfetto
            kind: grammar_note
            target: {text: "Pioveva. Ero stanco. Avevo fretta.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit04.lesson01.exercise01.recognize_pioveva
            type: multiple_choice
            tested_text: pioveva
            prompt: {target_blocks: [{text: pioveva, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit04.lesson01.exercise02.listen_pioveva
            type: listen_select
            tested_text: "Pioveva quella mattina"
            media_asset_key: it.b2.audio.narrativa.pioveva_mattina.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit04.lesson01.exercise03.match_background_words
            type: matching_pairs
            tested_text: "quella mattina piovere ero stanco freddo fuori avevo fretta ancora buio"
            prompt: {target_blocks: []}
            pairs:
              - {left: "quella mattina", right: "that morning"}
              - {left: piovere, right: "to rain"}
              - {left: "Ero stanco.", right: "I was tired."}
              - {left: freddo, right: cold}
              - {left: fuori, right: outside}
              - {left: "avevo fretta", right: "I was in a hurry"}
              - {left: ancora, right: still}
              - {left: buio, right: dark}
          - content_key: it.b2.unit04.lesson01.exercise04.order_ancora_buio
            type: word_order
            tested_text: "Era ancora buio"
            prompt: {target_blocks: []}
            word_bank: [Era, ancora, buio]
          - content_key: it.b2.unit04.lesson01.exercise05.translate_pioveva
            type: translation
            tested_text: "Pioveva quella mattina"
            prompt: {target_blocks: [{text: "Translate into Italian, setting the background scene with the imperfetto: It was raining that morning.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson01.exercise06.write_ero_stanco
            type: writing_prompt
            tested_text: "Ero stanco"
            prompt: {target_blocks: [{text: "Write in Italian, using the imperfetto for background: I was tired.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson01.exercise07.speak_avevo_fretta
            type: speak_response
            tested_text: "Avevo fretta"
            prompt: {target_blocks: [{text: "Say aloud in Italian, using the imperfetto: I was in a hurry.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson01.exercise08.dictation_pioveva
            type: dictation
            tested_text: "Pioveva quella mattina"
            media_asset_key: it.b2.audio.narrativa.pioveva_mattina.01
            prompt: {target_blocks: []}

      - content_key: it.b2.unit04.lesson02.levento_e_lordine
        title: "L'evento e l'ordine"
        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: it.b2.unit04.lesson02.teach.perdere_il_volo
            kind: phrase
            target: {text: "perdere il volo", language_code: it, direction: ltr}
            introduced_tokens: [perdere, il, volo, perso]
          - content_key: it.b2.unit04.lesson02.teach.ho_perso_il_volo
            kind: phrase
            target: {text: "Ho perso il volo.", language_code: it, direction: ltr}
            introduced_tokens: [ho]
          - content_key: it.b2.unit04.lesson02.teach.arrivare_in_ritardo
            kind: phrase
            target: {text: "arrivare in ritardo", language_code: it, direction: ltr}
            introduced_tokens: [arrivare, sono, arrivato, in, ritardo]
          - content_key: it.b2.unit04.lesson02.teach.prima
            kind: vocabulary
            target: {text: "prima", language_code: it, direction: ltr}
            introduced_tokens: [prima]
            example: {text: "Prima pioveva.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson02.teach.poi
            kind: vocabulary
            target: {text: "poi", language_code: it, direction: ltr}
            introduced_tokens: [poi]
            example: {text: "Poi avevo fretta.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson02.teach.successivamente
            kind: vocabulary
            target: {text: "successivamente", language_code: it, direction: ltr}
            introduced_tokens: [successivamente]
            example: {text: "Successivamente ho perso il volo.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson02.teach.alla_fine
            kind: phrase
            target: {text: "alla fine", language_code: it, direction: ltr}
            introduced_tokens: [alla, fine]
          - content_key: it.b2.unit04.lesson02.teach.grammar_perfetto
            kind: grammar_note
            target: {text: "Ero stanco. Avevo fretta. Alla fine ho perso il volo.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit04.lesson02.exercise01.recognize_perso
            type: multiple_choice
            tested_text: perso
            prompt: {target_blocks: [{text: perso, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit04.lesson02.exercise02.listen_ho_perso_volo
            type: listen_select
            tested_text: "Ho perso il volo"
            media_asset_key: it.b2.audio.narrativa.ho_perso_volo.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit04.lesson02.exercise03.match_sequence_words
            type: matching_pairs
            tested_text: "prima poi successivamente alla fine il volo in ritardo perso arrivato"
            prompt: {target_blocks: []}
            pairs:
              - {left: prima, right: first}
              - {left: poi, right: "then / after that"}
              - {left: successivamente, right: subsequently}
              - {left: "alla fine", right: "in the end / eventually"}
              - {left: "il volo", right: "the flight"}
              - {left: "in ritardo", right: late}
              - {left: perso, right: missed}
              - {left: arrivato, right: arrived}
          - content_key: it.b2.unit04.lesson02.exercise04.order_arrivato_in_ritardo
            type: word_order
            tested_text: "Sono arrivato in ritardo"
            prompt: {target_blocks: []}
            word_bank: [Sono, arrivato, in, ritardo]
          - content_key: it.b2.unit04.lesson02.exercise05.translate_ho_perso
            type: translation
            tested_text: "Ho perso il volo"
            prompt: {target_blocks: [{text: "Translate into Italian, using the passato prossimo for the completed event: I missed the flight.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson02.exercise06.write_alla_fine
            type: writing_prompt
            tested_text: "Alla fine ho perso il volo"
            prompt: {target_blocks: [{text: "Write in Italian, starting with Alla fine (in the end): In the end I missed the flight.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson02.exercise07.write_poi
            type: writing_prompt
            tested_text: "Poi avevo fretta"
            prompt: {target_blocks: [{text: "Write in Italian, starting with Poi, using the imperfetto: After that I was in a hurry.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson02.exercise08.dictation_ho_perso_volo
            type: dictation
            tested_text: "Ho perso il volo"
            media_asset_key: it.b2.audio.narrativa.ho_perso_volo.01
            prompt: {target_blocks: []}

      - content_key: it.b2.unit04.lesson03.quando_mentre_se
        title: "Quando, mentre, se"
        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: it.b2.unit04.lesson03.teach.aeroporto
            kind: vocabulary
            target: {text: "l'aeroporto", language_code: it, direction: ltr}
            introduced_tokens: [l, aeroporto]
            example: {text: "Ero in aeroporto.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson03.teach.partire
            kind: vocabulary
            target: {text: "partire", language_code: it, direction: ltr}
            introduced_tokens: [partire, partiva]
            example: {text: "L'aereo partiva.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson03.teach.aereo
            kind: vocabulary
            target: {text: "l'aereo", language_code: it, direction: ltr}
            introduced_tokens: [aereo]
            example: {text: "L'aereo partiva.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson03.teach.quando
            kind: phrase
            target: {text: "Quando sono arrivato in aeroporto, l'aereo partiva.", language_code: it, direction: ltr}
            introduced_tokens: [quando]
          - content_key: it.b2.unit04.lesson03.teach.capo
            kind: vocabulary
            target: {text: "il capo", language_code: it, direction: ltr}
            introduced_tokens: [capo]
            example: {text: "Il capo ha chiamato.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson03.teach.vestirsi
            kind: vocabulary
            target: {text: "vestirsi", language_code: it, direction: ltr}
            introduced_tokens: [vestirsi, mi, vestivo]
            example: {text: "Mi vestivo quella mattina.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson03.teach.chiamare
            kind: vocabulary
            target: {text: "chiamare", language_code: it, direction: ltr}
            introduced_tokens: [chiamare, ha, chiamato]
            example: {text: "Il capo ha chiamato.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson03.teach.mentre
            kind: phrase
            target: {text: "Mentre mi vestivo, il capo ha chiamato.", language_code: it, direction: ltr}
            introduced_tokens: [mentre]
          - content_key: it.b2.unit04.lesson03.teach.se_abitudine
            kind: phrase
            target: {text: "Se sono in ritardo, chiamo sempre il capo.", language_code: it, direction: ltr}
            introduced_tokens: [se, chiamo, sempre]
          - content_key: it.b2.unit04.lesson03.teach.grammar_quando_mentre
            kind: grammar_note
            target: {text: "Quando sono arrivato, l'aereo partiva. Mentre mi vestivo, il capo ha chiamato. Se sono in ritardo, chiamo sempre il capo.", language_code: it, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: it.b2.unit04.lesson03.exercise01.recognize_quando
            type: multiple_choice
            tested_text: quando
            prompt: {target_blocks: [{text: quando, language_code: it, direction: ltr}]}
          - content_key: it.b2.unit04.lesson03.exercise02.listen_quando_aeroporto
            type: listen_select
            tested_text: "Quando sono arrivato in aeroporto, l'aereo partiva"
            media_asset_key: it.b2.audio.narrativa.quando_aeroporto.01
            prompt: {target_blocks: []}
          - content_key: it.b2.unit04.lesson03.exercise03.match_time_words
            type: matching_pairs
            tested_text: "quando mentre se partire vestirsi chiamare l'aeroporto il capo"
            prompt: {target_blocks: []}
            pairs:
              - {left: quando, right: "when (a single past moment)"}
              - {left: mentre, right: "while (at the same time)"}
              - {left: se, right: "if / whenever (a habit)"}
              - {left: partire, right: "to depart / leave"}
              - {left: vestirsi, right: "to get dressed"}
              - {left: chiamare, right: "to call (phone)"}
              - {left: "l'aeroporto", right: "the airport"}
              - {left: "il capo", right: "the boss"}
          - content_key: it.b2.unit04.lesson03.exercise04.order_aereo_partiva
            type: word_order
            tested_text: "L'aereo partiva"
            prompt: {target_blocks: []}
            word_bank: ["L'aereo", partiva]
          - content_key: it.b2.unit04.lesson03.exercise05.translate_quando
            type: translation
            tested_text: "Quando sono arrivato in aeroporto, l'aereo partiva"
            prompt: {target_blocks: [{text: "Translate into Italian, using quando for the single past interruption: When I arrived at the airport, the plane was leaving.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson03.exercise06.translate_mentre
            type: translation
            tested_text: "Mentre mi vestivo, il capo ha chiamato"
            prompt: {target_blocks: [{text: "Translate into Italian, using mentre for the ongoing action: While I was getting dressed, the boss called.", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit04.lesson03.exercise07.write_se_abitudine
            type: writing_prompt
            tested_text: "Se sono in ritardo, chiamo sempre il capo"
            prompt: {target_blocks: [{text: "Write in Italian, using se for a HABIT (not a one-time event): If I'm late, I always call the boss.", language_code: en, direction: ltr}]}

      - content_key: it.b2.unit04.lesson04.il_passato_prima_del_passato
        title: "Il passato prima del passato"
        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: it.b2.unit04.lesson04.teach.non
            kind: vocabulary
            target: {text: "non", language_code: it, direction: ltr}
            introduced_tokens: [non]
            example: {text: "Non ero stanco.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson04.teach.impostare_sveglia
            kind: phrase
            target: {text: "impostare la sveglia", language_code: it, direction: ltr}
            introduced_tokens: [impostare, la, sveglia, impostato]
          - content_key: it.b2.unit04.lesson04.teach.non_avevo_impostato
            kind: phrase
            target: {text: "Non avevo impostato la sveglia.", language_code: it, direction: ltr}
