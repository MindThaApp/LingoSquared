          - content_key: it.b2.unit04.lesson04.teach.gia_partito
            kind: phrase
            target: {text: "Il volo era già partito.", language_code: it, direction: ltr}
            introduced_tokens: [già, partito]
          - content_key: it.b2.unit04.lesson04.teach.prima_di
            kind: vocabulary
            target: {text: "prima di", language_code: it, direction: ltr}
            introduced_tokens: [di]
            example: {text: "Prima di partire, ero stanco.", language_code: it, direction: ltr}
          - content_key: it.b2.unit04.lesson04.teach.dopo_che
            kind: vocabulary
