status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is it's fourth
    B2 unit (narrative / shifting time reference). No adaptable
    intermediate/upper-intermediate public-domain Italian source exists, so
    this was built from general Italian grammar/discourse knowledge, the
    same honest-disclosure precedent unit01-03 set. Sibling-isolation
    honored: no other language's B2 file was consulted for text; only the
    nl b2 exemplar's STRUCTURE was mirrored, per the dispatch instructions.
    Character canon (grepped docs/content/realizations/it/*.yaml before
    writing): Sam is an American engineer from Chicago in Milan for work;
    Elena is an Italian teacher from Milan; tu register between them. This
    unit has Sam recount a missed business-trip flight, distinct from
    unit02's "late to meet a friend" scenario -- no canon conflict (Sam
    travelling for work is consistent with his established engineer role).
    Self-contained from the other B2 units, matching the nl b2 exemplar's
    own pattern. Fix round (fresh-context review, MAJOR-3): the original
    draft taught a dedicated "per quando" ("by the time that") phrase for
    lesson04 exercise07 -- a direct calque of a foreign source-language
    construction, not idiomatic Italian for this meaning. The
    teach.per_quando card was removed; lesson04 exercise07 now renders "by
    the time I arrived, the flight had already left" as plain "Quando sono
    arrivato, il volo era già partito" (the già + trapassato prossimo
    already carries the "by the time" meaning on its own, with no
    dedicated connective needed).
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of every past-tense time frame --
    that the imperfetto (background: "pioveva", "ero stanco", "avevo
    fretta"), passato prossimo (foreground event: "ho perso il volo",
    "sono arrivato in ritardo"), and trapassato prossimo (pre-past: "non
    avevo impostato la sveglia", "il volo era già partito") all read as
    natural everyday spoken Italian; (2) the interruptive "quando" vs
    ongoing "mentre" vs habitual "se" distinction taught in lesson03 --
    confirm "Quando sono arrivato in aeroporto, l'aereo partiva" (imperfetto
    for "was leaving/about to leave") and "Mentre mi vestivo, il capo ha
    chiamato" and "Se sono in ritardo, chiamo sempre il capo" each read
    correctly, and that a native would not require stare + gerundio
    ("stava partendo") instead of the plain imperfetto here; (3) auxiliary
    selection throughout -- avere for "ho perso"/"avevo impostato", essere
    for "sono arrivato"/"era partito", reflexive essere for "mi sono
    svegliato"; (4) the culminating writing exercise (lesson06 exercise06)
    is graded against a fixed three-sentence string -- only the
    all-periods and no-trailing-period variants are supplied; decide
    whether more punctuation variants are needed; (5) confirm "essere
    bloccato nel traffico" is NOT reused here (that was unit02), and that
    "ora di punta" is not needed in this unit (it wasn't used); confirm
    "impostare la sveglia" and "L'aereo partiva" read as current everyday
    Standard Italian, and that plain "quando ... già ... era partito"
    (lesson04 exercise07) is a natural, sufficient way to render "by the
    time" for a past pre-past event -- a dedicated "per quando" frame was
    dropped as a non-idiomatic calque (see generation_provenance.notes).
  notes: >-
    Fourth Italian B2 unit; first narrative / shifting-time-reference unit.
    Targets the CEFR B2 narrative outcome
    (universal.b2.narrative.recount_complex_events_with_shifting_time):
    recount a complex sequence with shifting time reference -- background
    vs foreground, events BEFORE other past events, interrupted/ongoing
    actions -- keeping the timeline unambiguous. Theme: Sam missed a flight
    for a business trip because of an earlier event (an unset alarm the
    night before -> oversleeping -> arriving to find the flight already
    gone), recounted non-linearly. Lesson arc: L01 the BACKGROUND with the
    imperfetto (pioveva, ero stanco, avevo fretta); L02 the FOREGROUND
    event with the passato prossimo plus sequence markers (ho perso il
    volo; prima / poi / successivamente / alla fine); L03 the interruptive
    "quando" vs ongoing "mentre" vs habitual "se"; L04 the PRE-PAST with il
    trapassato prossimo (avevo/ero + participio: non avevo impostato la
    sveglia, il volo era già partito; prima di / dopo che, plus a plain
    quando + già "by the time" frame -- a dedicated "per quando" teaching
    item was dropped as a non-idiomatic calque, see
    generation_provenance.notes); L05 a non-linear reading that must be
    re-ordered to find the EARLIEST
    (pre-past) event; L06 the culminating production -- an Elena/Sam
    dialogue for the listening requirement (an account told OUT OF ORDER;
    reconstruct the true chronology), a speaking task (recount with
    background + an interrupting event + a pre-past event) and a writing
    task (background + foregrounded event + an event that preceded both).
    Register: tu, per the established canon. All vocabulary is introduced
    self-contained within this file. No sibling-direction file was
    consulted.

course:
  realization_key: it.b2
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Tu throughout (established it-lane canon). B2 narrative layers the past
    tenses onto that register -- imperfetto for background, passato
    prossimo for the foregrounded event, il trapassato prossimo (avevo/ero
    + participio) for events before other past events.

