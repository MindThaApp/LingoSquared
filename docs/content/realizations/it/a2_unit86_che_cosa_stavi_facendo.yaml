          - {"content_key": "it.a2.unit86.lesson06.exercise03.abbina_dialogo", "type": "matching_pairs", "tested_text": "Che cosa stavi facendo Stavo tornando a casa Dove erano le chiavi Erano sul tavolo Io stavo cucinando Per fortuna Luca era in casa", "prompt": {"target_blocks": []}, "pairs": [{"left": "Che cosa stavi facendo?", "right": "What were you doing?"}, {"left": "Stavo tornando a casa.", "right": "I was coming back home."}, {"left": "Dove erano le chiavi?", "right": "Where were the keys?"}, {"left": "Erano sul tavolo.", "right": "They were on the table."}, {"left": "Io stavo cucinando.", "right": "I was cooking."}, {"left": "Per fortuna Luca era in casa.", "right": "Luckily Luca was at home."}]}
