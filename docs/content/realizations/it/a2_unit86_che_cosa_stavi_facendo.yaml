          - {"content_key": "it.a2.unit86.lesson06.exercise05.rispondi_ieri", "type": "dialogue_response", "tested_text": "Stavo tornando a casa quando hai chiamato", "prompt": {"target_blocks": [{"text": "Che cosa stavi facendo ieri sera quando ho chiamato?", "language_code": "it", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit86.lesson06.exercise06.traduci_parlavo", "type": "translation", "tested_text": "Mentre parlavo con te cercavo le chiavi nella borsa", "prompt": {"target_blocks": [{"text": "While I was talking with you, I was looking for the keys in the bag.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit86.lesson06.exercise07.scrivi_tre", "type": "writing_prompt", "tested_text": "Pioveva e faceva freddo Stavo tornando a casa È suonato il telefono", "prompt": {"target_blocks": [{"text": "Write exactly three Italian sentences: (1) it was raining and it was cold; (2) you were coming back home; (3) the phone rang.", "language_code": "en", "direction": "ltr"}]}}
