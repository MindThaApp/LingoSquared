          - {"content_key": "it.a2.unit86.lesson05.exercise02.leggi_chiavi", "type": "reading_comprehension", "tested_text": "Erano sul tavolo, a casa", "prompt": {"target_blocks": [{"text": "Where were the keys?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit86.lesson05.exercise03.abbina_lettura", "type": "matching_pairs", "tested_text": "pioveva era tardi stavo tornando le chiavi per fortuna ha aperto la porta", "prompt": {"target_blocks": []}, "pairs": [{"left": "pioveva", "right": "it was raining"}, {"left": "era tardi", "right": "it was late"}, {"left": "stavo tornando", "right": "I was coming back"}, {"left": "le chiavi", "right": "the keys"}, {"left": "per fortuna", "right": "luckily"}, {"left": "ha aperto la porta", "right": "he opened the door"}]}
          - {"content_key": "it.a2.unit86.lesson05.exercise04.ordina_tornando", "type": "word_order", "tested_text": "Stavo tornando a casa quando è suonato il telefono", "prompt": {"target_blocks": []}, "word_bank": ["Stavo", "tornando", "a", "casa", "quando", "è", "suonato", "il", "telefono"]}
