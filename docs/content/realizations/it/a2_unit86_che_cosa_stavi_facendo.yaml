        teaching:
          - {"content_key": "it.a2.unit86.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Ciao Marco! Che cosa stavi facendo ieri sera quando ho chiamato?", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Ciao", "Marco", "Che", "cosa", "stavi", "facendo", "ieri", "sera", "quando", "ho", "chiamato"]}
          - {"content_key": "it.a2.unit86.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Stavo tornando a casa. Pioveva e faceva freddo!", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Stavo", "tornando", "a", "casa", "Pioveva", "e", "faceva", "freddo"]}
          - {"content_key": "it.a2.unit86.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "E le chiavi? Dove erano?", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["E", "le", "chiavi", "Dove", "erano"]}
          - {"content_key": "it.a2.unit86.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Erano sul tavolo! Mentre parlavo con te, cercavo le chiavi nella borsa.", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Erano", "sul", "tavolo", "Mentre", "parlavo", "con", "te", "cercavo", "le", "chiavi", "nella", "borsa"]}
          - {"content_key": "it.a2.unit86.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Che serata! Io stavo cucinando e tu cercavi le chiavi.", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Che", "serata", "Io", "stavo", "cucinando", "e", "tu", "cercavi", "le", "chiavi"]}
          - {"content_key": "it.a2.unit86.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Sì, ma per fortuna Luca era in casa.", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Sì", "ma", "per", "fortuna", "Luca", "era", "in", "casa"]}
        exercises:
