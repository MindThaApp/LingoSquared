    title: "Registrarsi in comune"
    section: speaking
    spine_outcome_ids: [universal.a2.bureaucracy.register_with_authorities]
    planned_lesson_count: 2
    lessons:
      - content_key: it.a2.unit25.lesson01.documenti
        title: "I documenti"
        spine_outcome_id: universal.a2.bureaucracy.register_with_authorities
        teaching:
          - {content_key: it.a2.unit25.lesson01.teach_refresher_saluti, kind: phrase, target: {text: "Buongiorno, grazie.", language_code: it, direction: ltr}, introduced_tokens: [Buongiorno, buongiorno, grazie], example: [{text: "Buongiorno e grazie.", language_code: it, direction: ltr}]}
          - {content_key: it.a2.unit25.lesson01.teach_refresher_ho_e, kind: phrase, target: {text: "Ho un documento e il codice fiscale.", language_code: it, direction: ltr}, introduced_tokens: [Ho, ho, un, e], example: [{text: "Ho un documento e il modulo.", language_code: it, direction: ltr}]}
          - {content_key: it.a2.unit25.lesson01.teach_refresher_essere_vicino, kind: phrase, target: {text: "È vicino al lavoro. C'è la metropolitana.", language_code: it, direction: ltr}, introduced_tokens: [È, è, vicino, al, lavoro, "C'è", c], example: [{text: "Il comune è vicino al lavoro.", language_code: it, direction: ltr}]}
          - content_key: it.a2.unit25.lesson01.teach_documento_codice
            kind: vocabulary
            target: {text: "il documento d'identità, il codice fiscale", language_code: it, direction: ltr}
            introduced_tokens: [il, documento, "d'identità", codice, fiscale]
            example:
              - {text: "Ho un documento d'identità.", language_code: it, direction: ltr}
              - {text: "Il codice fiscale è necessario.", language_code: it, direction: ltr}
          - content_key: it.a2.unit25.lesson01.teach_contratto_modulo
            kind: vocabulary
            target: {text: "il contratto d'affitto, il modulo", language_code: it, direction: ltr}
            introduced_tokens: [contratto, "d'affitto", modulo]
            example:
              - {text: "Porto il contratto d'affitto.", language_code: it, direction: ltr}
              - {text: "Compilo il modulo oggi.", language_code: it, direction: ltr}
          - {content_key: it.a2.unit25.lesson01.teach_registrare_residenza, kind: phrase, target: {text: "registrare la residenza", language_code: it, direction: ltr}, introduced_tokens: [registrare, la, residenza], example: [{text: "Devo registrare la residenza a Milano.", language_code: it, direction: ltr}]}
          - {content_key: it.a2.unit25.lesson01.teach_entro_venerdi, kind: phrase, target: {text: "entro venerdì", language_code: it, direction: ltr}, introduced_tokens: [entro, venerdì], example: [{text: "Devo consegnare il modulo entro venerdì.", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a2.unit25.lesson01.exercise01.choose_codice, type: multiple_choice, tested_text: "il codice fiscale", prompt: {target_blocks: []}}
          - {content_key: it.a2.unit25.lesson01.exercise02.listen_documenti, type: listen_select, tested_text: "documento d'identità e codice fiscale", media_asset_key: it.a2.audio25.documento_codice_fiscale.01, prompt: {target_blocks: []}}
          - {content_key: it.a2.unit25.lesson01.exercise03.choose_residenza, type: multiple_choice, tested_text: "registrare la residenza", prompt: {target_blocks: []}}
          - content_key: it.a2.unit25.lesson01.exercise04.match_documenti
            type: matching_pairs
            tested_text: "documento identità codice fiscale contratto affitto modulo registrare residenza entro venerdì"
            prompt: {target_blocks: []}
            pairs:
              - {left: "identity document", right: "il documento d'identità"}
              - {left: "tax code", right: "il codice fiscale"}
              - {left: "rental contract", right: "il contratto d'affitto"}
              - {left: "form", right: "il modulo"}
              - {left: "register residence", right: "registrare la residenza"}
              - {left: "by Friday", right: "entro venerdì"}
          - {content_key: it.a2.unit25.lesson01.exercise05.order_codice_fiscale, type: word_order, tested_text: "il codice fiscale", prompt: {target_blocks: []}, word_bank: [il, codice, fiscale]}
          - {content_key: it.a2.unit25.lesson01.exercise06.fill_modulo, type: fill_in_blank, tested_text: "modulo", prompt: {target_blocks: [{text: "Compilo il ___.", language_code: it, direction: ltr}]}}
          - {content_key: it.a2.unit25.lesson01.exercise07.write_checklist, type: writing_prompt, tested_text: "documento d'identità codice fiscale contratto d'affitto modulo", prompt: {target_blocks: [{text: "Scrivi questi documenti: documento d'identità, codice fiscale, contratto d'affitto, modulo.", language_code: it, direction: ltr}]}}

      - content_key: it.a2.unit25.lesson02.appuntamento
        title: "L'appuntamento"
        spine_outcome_id: universal.a2.bureaucracy.register_with_authorities
        teaching:
          - {content_key: it.a2.unit25.lesson02.teach_vorrei_appuntamento, kind: phrase, target: {text: "Vorrei prendere un appuntamento.", language_code: it, direction: ltr}, introduced_tokens: [Vorrei, prendere, un, appuntamento], example: [{text: "Vorrei prendere un appuntamento in comune.", language_code: it, direction: ltr}]}
          - {content_key: it.a2.unit25.lesson02.teach_in_comune, kind: phrase, target: {text: "in comune", language_code: it, direction: ltr}, introduced_tokens: [in, comune], example: [{text: "Vorrei prendere un appuntamento in comune.", language_code: it, direction: ltr}]}
          - {content_key: it.a2.unit25.lesson02.teach_per_registrare, kind: phrase, target: {text: "per registrare la residenza", language_code: it, direction: ltr}, introduced_tokens: [per, registrare, la, residenza], example: [{text: "Vorrei un appuntamento per registrare la residenza.", language_code: it, direction: ltr}]}
          - {content_key: it.a2.unit25.lesson02.teach_porti_documenti, kind: phrase, target: {text: "Porti un documento d'identità.", language_code: it, direction: ltr}, introduced_tokens: [Porti, un, documento, "d'identità"], example: [{text: "Porti un documento d'identità, per favore.", language_code: it, direction: ltr}]}
          - {content_key: it.a2.unit25.lesson02.teach_entro_quando, kind: phrase, target: {text: "Entro quando devo consegnare il modulo?", language_code: it, direction: ltr}, introduced_tokens: [Entro, quando, devo, consegnare, il, modulo], example: [{text: "Entro quando devo consegnare il modulo al comune?", language_code: it, direction: ltr}]}
        exercises:
          - {content_key: it.a2.unit25.lesson02.exercise01.choose_appuntamento, type: multiple_choice, tested_text: "Vorrei prendere un appuntamento", prompt: {target_blocks: []}}
          - {content_key: it.a2.unit25.lesson02.exercise02.listen_appuntamento, type: listen_select, tested_text: "Vorrei prendere un appuntamento per registrare la residenza", media_asset_key: it.a2.audio25.appuntamento_residenza.01, prompt: {target_blocks: []}}
          - {content_key: it.a2.unit25.lesson02.exercise03.listen_requisiti, type: listen_select, tested_text: "Porti un documento d'identità il codice fiscale e il contratto d'affitto", media_asset_key: it.a2.audio25.porti_contratto.01, prompt: {target_blocks: []}}
          - content_key: it.a2.unit25.lesson02.exercise04.match_formal_exchange
            type: matching_pairs
            tested_text: "vorrei prendere appuntamento porti documento identità entro quando devo consegnare modulo in comune"
            prompt: {target_blocks: []}
            pairs:
              - {left: "I would like to make an appointment.", right: "Vorrei prendere un appuntamento."}
              - {left: "to register residence", right: "per registrare la residenza"}
              - {left: "Bring an identity document.", right: "Porti un documento d'identità."}
              - {left: "By when?", right: "Entro quando?"}
              - {left: "I must submit the form", right: "devo consegnare il modulo"}
              - {left: "at the town hall", right: "in comune"}
          - {content_key: it.a2.unit25.lesson02.exercise05.order_appuntamento, type: word_order, tested_text: "Vorrei prendere un appuntamento", prompt: {target_blocks: []}, word_bank: [Vorrei, prendere, un, appuntamento]}
          - {content_key: it.a2.unit25.lesson02.exercise06.reply_clarify_deadline, type: dialogue_response, tested_text: "Entro quando devo consegnare il modulo", prompt: {target_blocks: [{text: "Impiegata: Porti un documento d'identità e il modulo.", language_code: it, direction: ltr}]}}
          - {content_key: it.a2.unit25.lesson02.exercise07.write_registration_request, type: writing_prompt, tested_text: "Buongiorno vorrei prendere un appuntamento per registrare la residenza ho un documento d'identità e il codice fiscale grazie", prompt: {target_blocks: [{text: "Scrivi un messaggio formale: inizia con Buongiorno, chiedi un appuntamento per registrare la residenza, dì che hai documento d'identità e codice fiscale, e finisci con Grazie.", language_code: it, direction: ltr}]}}
          - {content_key: it.a2.unit25.lesson02.exercise08.dictation_appuntamento_residenza, type: dictation, tested_text: "Vorrei prendere un appuntamento per registrare la residenza", media_asset_key: it.a2.audio25.appuntamento_residenza.01, prompt: {target_blocks: []}}
