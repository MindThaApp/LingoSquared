  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. The hotel
    breakfast-service dialogue "Scusi, a che ora cominciate a servire la
    prima colazione? ... E a che ora finite? Finiamo alle dieci." and the
    arrival-time drills "Arriviamo alle otto o alle nove? Arriviamo alle
    otto." / "Io arrivo alle 10.00, e Lei? Anch'io arrivo alle dieci."
    supplied the "a che ora + verb" question pattern and the alle + hour
    time-of-day construction this unit reuses for daily-routine verbs
    (faccio colazione, vado al lavoro, torno a casa) instead of the
    source's hotel-service framing. All dialogue text, teaching notes, and
    exercises were freshly authored per AUTHORING_GUIDE.md §10 around
    Elena's and Sam's ordinary weekday routine; no source sentence appears
    unchanged.
