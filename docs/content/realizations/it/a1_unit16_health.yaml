  - content_key: it.a1.audio.dialogue.mi_fa_male_la_testa
    language: it
    text: >-
      Elena: Cosa hai? Sam: Mi fa male la testa e non mi sento bene. Ho
      anche la febbre e la tosse. Elena: Devi andare dal dottore! Sam: Sì,
      devo andare dal dottore. Prendo una medicina e riposo oggi.
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

