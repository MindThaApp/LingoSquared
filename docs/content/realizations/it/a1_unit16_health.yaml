generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    Authored from established Standard Italian conventions per
    AUTHORING_GUIDE.md §10's established-conventions fallback (no specific
    public-domain source page was verified for this topic before authoring,
    so no FSI/Peace Corps citation is claimed here). The unit continues
    Elena and Sam, already established as tu-register friends in units
    01-15, in a new health/symptoms scenario: Elena asks what's wrong, Sam
    describes symptoms and the visit to the doctor. Reuses "oggi"-style
    everyday framing and the tu-register established since unit01. All
    dialogue text, teaching notes, and exercises were freshly authored; no
    verbatim external source text appears anywhere in this file.
review:
  status: reviewed
  required_next_reviewer: none
  notes: "Fresh-context review 2026-07-12 (full review; it lane reset from 1-in-3 sampling after the ru 16-18 wave). 3 defects fixed: L2ex08 writing_prompt asked for 'a sentence' but only accepted a two-sentence answer (Italian block 'una frase'->'due frasi'); L3ex08 asked 'what you need to do' but its accepted answer is the doctor's 2sg imperative (block reframed to 'cosa dici tu e cosa dice il dottore'); L1ex07 list prompt accepted only one word order. Dialogue-audio speaker check: 4 turns, all attributed to the speaker who says them, no turn skipped, no word tested-but-untaught - CLEAN. No boolean coercion, no jargon, no duplicate matching_pairs LEFT."

course:
  realization_key: it.a1
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Teach contemporary Standard Italian. Tu-register throughout: Elena
    notices Sam isn't feeling well and asks about it, consistent with
    earlier units.

