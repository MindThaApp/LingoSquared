generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material: >-
    Adapted from the Foreign Service Institute "Italian Familiarization and
    Short-Term Training (FAST) Course, Volume I" (Randazzo-Woodrow et al.,
    1992), a US government work in the public domain. Unit XI's arrival
    dialogue ("Siamo arrivati tutti insieme giovedì pomeriggio") and its
    calendar drill ("Che giorno era avantieri? Avantieri era... (sabato).
    Che giorno sarà dopodomani? Dopodomani sarà... (mercoledì). Otto
    giorni oggi sarà... (lunedì)") supplied the days-of-week and
    relative-date scaffold; the source newspaper-dateline example
    ("giovedì 5 Gennaio 1989") supplied the day+date+month convention.
    This unit modernizes the framing (no obsolete currency/political
    content) and continues the Elena/Sam workplace scenario from units
    01-03 with a freshly authored planning-a-visit storyline. All
    dialogue text, teaching notes, and exercises were freshly authored
    per AUTHORING_GUIDE.md §10; no source sentence appears unchanged.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    First draft, en-it A1 unit04 (dates), authored by Claude adapting
    FSI Italian FAST Vol. 1 per AUTHORING_GUIDE.md §10. Continues the
    Elena/Sam scenario from units 01-03. Covers days of the week, "che
    giorno è oggi", and basic calendar dates (day + month, no year
    reading burden yet). Fresh-context full review complete 2026-07-12 (new-language lane, no sampling); zero grammar/register/audio-containment defects, days/months lowercase, tu-register consistent.

    Second-pass review 2026-10-18: 6 fixes — lesson01.exercise01 prompt 'Che giorno viene dopo mercoledì?' (untaught viene/dopo) -> 'lunedì, martedì, mercoledì, ___'; lesson01.exercise03 prompt 'Quale giorno è di weekend?' (ungrammatical, untaught) removed; lesson01.exercise07 and lesson02.exercise01 untaught Italian rubric prompts ('Scrivi i sette giorni...', 'Il primo mese dell'anno è:') removed; lesson02.exercise03 '5 gennaio si legge:' -> '5 gennaio'; lesson03.exercise01 'Quando arriva Sam a Roma?' (untaught arriva) -> 'Quando arrivi a Roma, Sam?'; English month/day pair lefts capitalized (January..April, Thursday..Saturday). NATIVE FLAGS: none.

