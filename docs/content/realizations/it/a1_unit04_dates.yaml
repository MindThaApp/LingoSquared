    language: it
    text: >-
      Elena: Sam, che giorno è oggi? Sam: Oggi è giovedì. Elena: Bene,
      allora domani è venerdì. Sam, quando arrivi a Roma per la
      riunione? Sam: Arrivo giovedì pomeriggio, il cinque gennaio.
      Elena: Perfetto, ci vediamo giovedì!
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

