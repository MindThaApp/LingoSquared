  notes: >-
    First-wave en-it A1 draft (units 1-3), authored by Claude adapting
    FSI Italian FAST Vol. 1 per AUTHORING_GUIDE.md §10. Continues the
    Elena/Sam workplace scenario from unit01.

    2026-07-12: fresh-context review (Claude, isolated from authoring
    reasoning; validated against empty stub overlays, compiler 0 errors).
    Italian correct, tu/Lei consistent with matching verb forms (parli/
    parla/parlo, vieni/viene). One fix applied: lesson03 exercise04
    match_dialogue_facts had an awkward learner-facing right-label
    ("due anni" -> "quanto resta Sam"); reworded to a clean Q->A pairing
    ("Quanto resta Sam a Milano?" -> "due anni"). No other defects.
    Native-speaker review still planned.

    Second-pass review 2026-10-18: 2 fixes — added teach.da_quanto_studi (lesson02.exercise06 prompt 'Da quanto studi?' used untaught quanto/studi); lesson03.exercise04.match_dialogue_facts left 'Quanto resta Sam a Milano?' (untaught quanto/resta) -> 'Sam è qui per...'. NATIVE FLAGS: comma in 'Di dov'è, Lei?' / 'Che lavoro fa, Lei?' (right-dislocated subject; standard written form has no comma); 'Parli italiano bene!' word order (more usual: 'Parli bene l'italiano!').

course:
  realization_key: it.a1
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Teach contemporary Standard Italian. Sam and Elena are workplace peers
    who quickly move to tu after the formal first introduction (a common,
    realistic pattern in young Italian workplaces); keep tu/Lei explicit
    per exercise and preserve the matching verb form (tu vieni / Lei viene;
    tu parli / Lei parla).

