    language: it
    text: >-
      Elena: Sam, di dove sei? Sam: Sono americano, di Chicago. E tu, di
      dove sei? Elena: Sono italiana, di Milano. Parli italiano bene! Sam:
      Grazie, parlo un po' d'italiano. Studio da un anno. Elena: Che lavoro
      fai qui? Sam: Sono ingegnere. Sono qui per lavoro, per due anni.
      Elena: Che bello, benvenuto a Milano!
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

