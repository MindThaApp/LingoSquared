            tested_text: "i vantaggi pesano di più degli svantaggi"
            prompt: {target_blocks: [{text: "What is the author's overall conclusion?", language_code: en, direction: ltr}]}
          - content_key: it.b2.unit01.lesson05.exercise05.match_reading_words
