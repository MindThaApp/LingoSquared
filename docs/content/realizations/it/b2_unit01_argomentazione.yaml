target_language: it
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is it's first B2
    unit. No adaptable intermediate/upper-intermediate public-domain Italian
    source exists (the it A1/A2/B1 lane was authored from contemporary
    Standard Italian conventions, not an FSI-style source), so this was
    built from general Italian grammar/discourse knowledge, the same
    honest-disclosure precedent nl's B2 tier set. Sibling-isolation honored:
    no other language's B2 file (nl/fa/prs/de) was consulted for text; only
    the nl b2 exemplar's STRUCTURE (lesson arc, exercise-type pacing, audio
    density) was used as a mirror per the dispatch instructions, which
    explicitly required this. Character canon (grepped
    docs/content/realizations/it/*.yaml before writing): Sam is an American
    engineer from Chicago in Milan for work; Elena is an Italian teacher
    from Milan; tu register between them (established since a1_unit02).
    matching_pairs orientation: the shipped it-b1 lane (b1_unit35 onward)
    consistently uses left=English/right=Italian, the OPPOSITE of the
    AUTHORING_GUIDE's stated "left = taught target-language item"
    convention. This file follows the explicit dispatch-prompt rule
    ("matching_pairs: left = the taught Italian item, right = clue")
    literally instead, matching the nl b2 structural exemplar. This is a
    deliberate, disclosed divergence from the it-b1 lane's own convention,
    not an oversight -- flagged here for the reviewer/coordinator to decide
    whether to normalize one way or the other across the whole it lane.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Italian confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) subjunctive triggers -- "credo che...sia", "sembra
    che...sia", "alcuni pensano che manchi", "ciò non toglie che...pesino/
    pesi" -- confirm every congiuntivo form and agreement (singular subject
    "il contatto"/"la libertà" -> manchi/pesi; plural "i vantaggi" ->
    pesino) is natural and correctly triggered; (2) "mancare" flipped
    subject/object ("ti mancano i colleghi" / "ti manca il contatto") reads
    naturally and the singular/plural agreement with the Italian subject
    (not the English "you miss X") is correct throughout; (3) "non hai
    tutti i torti" as a natural colloquial concession idiom; (4) the
    culminating writing exercise (lesson06 exercise06) is graded against a
    fixed four-sentence string -- only the all-periods and no-trailing-
    period variants are supplied; decide whether a learner who joins clauses
    slightly differently should also be accepted; (5) confirm "il tempo di
    viaggio" (vs. "il pendolarismo"/"il tragitto"), "sia bloccato"-style
    deduction phrasing choices, and "un buono sviluppo" (buono kept
    unelided before "sviluppo", s+consonant) all read as current everyday
    Standard Italian.
  notes: >-
    First Italian B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence): state a
    claim, support it with reasons/evidence, acknowledge the strongest
    opposing point, and rebut it without conceding. Theme: lavorare da
    remoto vs. lavorare in ufficio (remote work vs. office work), argued by
    Elena and Sam -- one coherent everyday debate across all six lessons.
    Lesson arc mirrors the argument structure: L01 stating a claim (Credo
    che + congiuntivo vs. Secondo me + indicativo), L02 supporting it
    (innanzitutto / inoltre / per esempio / una ricerca dimostra che), L03
    acknowledging the opposing point (da un lato...dall'altro / è vero che /
    alcuni pensano che / mancare), L04 rebutting without conceding (tuttavia
    / però / ciò non toglie che + congiuntivo / insomma), L05 an
    argumentative reading text, L06 the culminating production -- an
    Elena/Sam debate for the listening requirement plus a speaking task and
    a writing task that each require a FULL argument (claim + support +
    acknowledged objection + rebuttal). Register: tu throughout, per the
    established Elena/Sam canon. All vocabulary is introduced self-contained
    within this file (B2 is a separate Course row from A1/A2/B1, so a B2
    learner never sees earlier-tier lexemes at runtime; each B2 unit is
    additionally self-contained from the OTHER B2 units, re-teaching any
    word it needs even if an earlier B2 unit already taught it, matching
    the nl b2 exemplar's own demonstrated pattern). No sibling-direction
    file was consulted.

course:
  realization_key: it.b2
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Tu throughout between Elena and Sam (established it-lane canon). B2
    argumentation layers discourse connectives and signposting onto that
    register -- innanzitutto, inoltre, per esempio, una ricerca dimostra
    che, da un lato...dall'altro, è vero che, tuttavia, ciò non toglie che,
    insomma -- while keeping the everyday informal address (risparmi,
    pensi, mancano). Elena and Sam continue the tu they use with each other
    throughout the it lane.

