      - content_key: it.b2.unit01.lesson05.leggere_testo_argomentativo
        title: "Leggere un testo argomentativo"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: it.b2.unit01.lesson05.teach.testo
            kind: reading
            target:
              text: >-
                Sempre più persone lavorano da remoto. Credo che questo sia
                un buono sviluppo. Innanzitutto risparmi molto tempo di
                viaggio, e una ricerca dimostra che chi lavora da remoto è
                spesso più produttivo. Certo, alcuni dicono che a casa manca
                il contatto con i colleghi. È vero, ma ciò non toglie che si
                possa ancora telefonare e fare videochiamate. Insomma, i
                vantaggi pesano di più degli svantaggi.
              language_code: it
              direction: ltr
            introduced_tokens: [sempre, questo, buono, sviluppo, e, persone, lavorano, spesso, dicono, dire, si, possa, potere, ancora, telefonare, fare, videochiamate]
        exercises:
