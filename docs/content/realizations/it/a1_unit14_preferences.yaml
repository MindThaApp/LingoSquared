    1992), a US government work in the public domain. The source's currency
    exchange drills "Preferisce banconote di piccolo taglio?", "Preferisce
    andare in albergo o all'Ambasciata? Preferisco andare in albergo",
    and "lo preferisco Roma, e Lei? Anch'io preferisco Roma" supplied the
    "preferire" ask/state pattern and the "anch'io" (me too) agreement
    form this unit adapts. The source's banknote-denomination and
    hotel-vs-embassy framing is dropped; this unit reframes the pattern as
    Elena and Sam choosing between two familiar breakfast items ("il
    caffè", already taught in unit03/unit07), reusing "il caffè" and "il
    cornetto" as the preference content. All dialogue text, teaching
    notes, and exercises were freshly authored per AUTHORING_GUIDE.md §10;
    no source sentence appears unchanged.
