          - {"content_key": "it.a2.unit85.lesson05.teach.parole5", "kind": "vocabulary", "target": {"text": "il pomeriggio, tutti i giorni, ricordare, ma", "language_code": "it", "direction": "ltr"}, "introduced_tokens": ["il", "pomeriggio", "tutti", "i", "giorni", "ricordare", "ma", "Il", "giocavamo", "in", "giardino", "Tutti", "camminavo", "con", "nonno", "Ricordo", "ancora", "la", "casa", "Ero", "stanco", "felice"], "example": [{"text": "Il pomeriggio giocavamo in giardino.", "language_code": "it", "direction": "ltr"}, {"text": "Tutti i giorni camminavo con il nonno.", "language_code": "it", "direction": "ltr"}, {"text": "Ricordo ancora la casa.", "language_code": "it", "direction": "ltr"}, {"text": "Ero stanco, ma felice.", "language_code": "it", "direction": "ltr"}]}
          - {"content_key": "it.a2.unit85.lesson05.teach.gn_andare_presente", "kind": "grammar_note", "target": {"text": "vado, vai, va, andiamo, andate, vanno.", "language_code": "it", "direction": "ltr"}, "introduced_tokens": ["vado", "vai", "va", "andiamo", "andate", "vanno"]}
          - {"content_key": "it.a2.unit85.lesson05.teach.lettura", "kind": "reading", "target": {"text": "Da piccola andavo dai nonni ogni estate. La casa era grande e aveva un giardino. Il nonno leggeva il giornale e beveva un caffè. La nonna cucinava e noi mangiavamo in giardino. Dopo il pranzo dormivo, il pomeriggio giocavo e la sera facevamo una passeggiata. Ero sempre felice. Ora non vado più dai nonni, ma ricordo ancora la casa. Giulia", "language_code": "it", "direction": "ltr"}, "introduced_tokens": ["Da", "piccola", "andavo", "dai", "nonni", "ogni", "estate", "La", "casa", "era", "grande", "e", "aveva", "un", "giardino", "Il", "nonno", "leggeva", "il", "giornale", "beveva", "caffè", "nonna", "cucinava", "noi", "mangiavamo", "in", "Dopo", "pranzo", "dormivo", "pomeriggio", "giocavo", "la", "sera", "facevamo", "una", "passeggiata", "Ero", "sempre", "felice", "Ora", "non", "vado", "più", "ma", "ricordo", "ancora", "Giulia"]}
        exercises:
          - {"content_key": "it.a2.unit85.lesson05.exercise01.leggi_nonno", "type": "reading_comprehension", "tested_text": "Il nonno leggeva il giornale e beveva un caffè", "prompt": {"target_blocks": [{"text": "What did the grandfather use to do?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit85.lesson05.exercise02.leggi_ora", "type": "reading_comprehension", "tested_text": "Ora non vado più dai nonni, ma ricordo ancora la casa", "prompt": {"target_blocks": [{"text": "What does Giulia say about now?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit85.lesson05.exercise03.abbina_lettura", "type": "matching_pairs", "tested_text": "il pomeriggio la sera tutti i giorni ricordo sempre ancora", "prompt": {"target_blocks": []}, "pairs": [{"left": "il pomeriggio", "right": "in the afternoon"}, {"left": "la sera", "right": "in the evening"}, {"left": "tutti i giorni", "right": "every day"}, {"left": "ricordo", "right": "I remember"}, {"left": "sempre", "right": "always"}, {"left": "ancora", "right": "still"}]}
          - {"content_key": "it.a2.unit85.lesson05.exercise04.ordina_passeggiata", "type": "word_order", "tested_text": "La sera facevamo una passeggiata", "prompt": {"target_blocks": []}, "word_bank": ["facevamo", "una", "La", "passeggiata", "sera"]}
          - {"content_key": "it.a2.unit85.lesson05.exercise05.traduci_ricordo", "type": "translation", "tested_text": "Ricordo ancora la casa", "prompt": {"target_blocks": [{"text": "I still remember the house.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit85.lesson05.exercise06.detta_piccola", "type": "dictation", "tested_text": "Da piccola andavo dai nonni ogni estate.", "media_asset_key": "it.a2.audio.come_era_prima.piccola.01", "prompt": {"target_blocks": []}}
          - {"content_key": "it.a2.unit85.lesson05.exercise07.detta_passeggiata", "type": "dictation", "tested_text": "La sera facevamo una passeggiata.", "media_asset_key": "it.a2.audio.come_era_prima.passeggiata.01", "prompt": {"target_blocks": []}}
      - content_key: it.a2.unit85.lesson06.giulia_e_marco
        title: "Giulia e Marco parlano delle estati"
        spine_outcome_id: universal.a2.past.describe_past_habits
        teaching:
          - {"content_key": "it.a2.unit85.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Giulia, che cosa facevi in estate da piccola?", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Giulia", "che", "cosa", "facevi", "in", "estate", "da", "piccola"]}
          - {"content_key": "it.a2.unit85.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Andavo dai nonni ogni estate. La mattina giocavo in giardino.", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Andavo", "dai", "nonni", "ogni", "estate", "La", "mattina", "giocavo", "in", "giardino"]}
          - {"content_key": "it.a2.unit85.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Che bello! Io andavo spesso al mare con il nonno.", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Che", "bello", "Io", "andavo", "spesso", "al", "mare", "con", "il", "nonno"]}
          - {"content_key": "it.a2.unit85.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "E che cosa facevate al mare?", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["E", "che", "cosa", "facevate", "al", "mare"]}
          - {"content_key": "it.a2.unit85.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Facevamo il bagno e mangiavamo il gelato. Eravamo sempre felici!", "language_code": "it", "direction": "ltr", "speaker": "Marco"}, "introduced_tokens": ["Facevamo", "il", "bagno", "e", "mangiavamo", "gelato", "Eravamo", "sempre", "felici"]}
          - {"content_key": "it.a2.unit85.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Che estati felici! Io ricordo ancora la casa e il giardino.", "language_code": "it", "direction": "ltr", "speaker": "Giulia"}, "introduced_tokens": ["Che", "estati", "felici", "Io", "ricordo", "ancora", "la", "casa", "e", "il", "giardino"]}
        exercises:
          - {"content_key": "it.a2.unit85.lesson06.exercise01.capisci_nonni", "type": "dialogue_comprehension", "tested_text": "Andavo dai nonni ogni estate", "media_asset_key": "it.a2.audio.dialogue.come_era_prima.01", "prompt": {"target_blocks": [{"text": "Where did Giulia go every summer?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit85.lesson06.exercise02.capisci_bagno", "type": "dialogue_comprehension", "tested_text": "Facevamo il bagno e mangiavamo il gelato", "media_asset_key": "it.a2.audio.dialogue.come_era_prima.01", "prompt": {"target_blocks": [{"text": "What did Marco and his grandfather do at the sea?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit85.lesson06.exercise03.abbina_dialogo", "type": "matching_pairs", "tested_text": "Andavo dai nonni ogni estate Giocavo in giardino Andavo spesso al mare Che cosa facevate al mare Facevamo il bagno Eravamo sempre felici", "prompt": {"target_blocks": []}, "pairs": [{"left": "Andavo dai nonni ogni estate.", "right": "I used to go to my grandparents every summer."}, {"left": "Giocavo in giardino.", "right": "I used to play in the garden."}, {"left": "Andavo spesso al mare.", "right": "I often used to go to the sea."}, {"left": "Che cosa facevate al mare?", "right": "What did you (plural) use to do at the sea?"}, {"left": "Facevamo il bagno.", "right": "We used to go for a swim."}, {"left": "Eravamo sempre felici.", "right": "We were always happy."}]}
          - {"content_key": "it.a2.unit85.lesson06.exercise04.ordina_gelato", "type": "word_order", "tested_text": "Facevamo il bagno e mangiavamo il gelato", "prompt": {"target_blocks": []}, "word_bank": ["Facevamo", "il", "e", "bagno", "mangiavamo", "il", "gelato"]}
          - {"content_key": "it.a2.unit85.lesson06.exercise05.rispondi_estate", "type": "dialogue_response", "tested_text": "Andavo dai nonni ogni estate", "prompt": {"target_blocks": [{"text": "Che cosa facevi in estate da piccola?", "language_code": "it", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit85.lesson06.exercise06.traduci_mattina", "type": "translation", "tested_text": "La mattina giocavo in giardino", "prompt": {"target_blocks": [{"text": "In the morning I used to play in the garden.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "it.a2.unit85.lesson06.exercise07.scrivi_tre", "type": "writing_prompt", "tested_text": "Ogni estate andavo dai nonni Giocavo in giardino Ero sempre felice", "prompt": {"target_blocks": [{"text": "Write exactly three Italian sentences: (1) every summer you used to go to your grandparents; (2) you used to play in the garden; (3) you were always happy.", "language_code": "en", "direction": "ltr"}]}}
