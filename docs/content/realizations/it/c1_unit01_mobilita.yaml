schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: it
cefr_level: C1
status: unreviewed
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for Italian C1, the FIRST C1 unit in the it lane
    (it has A1-B2 only; this is brand-new bug-class territory). No usable
    public-domain source was found: a firecrawl search confirmed the only
    verified public-domain Italian source is the FSI Italian Fast Course
    (US government work, fsi-language-courses.org / livelingua), which caps
    at a basic/tourist level and contains no advanced C1 extended-discourse
    material -- no public-domain advanced/C1 Italian discourse source
    exists. This is established-conventions-only authoring, built from
    general knowledge of Italian discourse-structure conventions. The
    shipped de C1 unit01 (strukturierung) was used as the assigned
    structural exemplar for C1 pacing and exercise depth ONLY -- every word
    of actual Italian text is freshly authored, not translated from the
    German, and the scenario is unrelated. Sam and Elena continue as the
    established it-lane colleagues (informal tu register; Sam an American
    ingegnere working in an office in Milan, established a1_unit02; Elena
    an Italian insegnante, established a1_unit17). Sam delivers the
    sustained monologue. No sibling-direction file (it-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    First Italian C1 unit. Targets the CEFR C1 extended-discourse outcome
    (universal.c1.discourse.structure_extended_discourse): signpost the
    direction of a long contribution, develop linked points with a
    controlled digression and explicit return, and sustain cohesion so the
    listener or reader can follow the overall shape. Theme: andare al
    lavoro in bicicletta (commuting by bike) -- one coherent everyday
    proposal from Sam, sustained across all six lessons. Lesson arc mirrors
    the discourse structure itself: L01 announcing the direction (Parto
    da, prima di tutto, ti spiego, in linea di massima), L02 developing
    linked points (da una parte ... dall'altra, in concreto, vale a dire,
    inoltre), L03 making a bounded digression (apro una piccola parentesi,
    alcuni colleghi temono che, una preoccupazione comprensibile), L04
    returning explicitly (per tornare alla mia idea principale, le piste
    ciclabili, in tutta sicurezza), L05 sustaining reference and
    synthesizing (questa proposta, in definitiva, tutto sommato), L06 the
    culminating production -- a full Sam monologue for the listening
    requirement plus a speaking task and a writing task that each require
    the complete structured contribution, not just signpost drilling.
    Register: informal tu throughout, matching the it lane's established
    register (Elena and Sam, established colleagues, address each other
    with tu in every scene). All vocabulary is introduced self-contained
    within this file (C1 is a separate Course row from B2, so a C1 learner
    never sees A1-B2 lexemes at runtime). Priority checks for the
    fresh-context reviewer: (1) informal tu is consistent throughout and
    never slips into Lei; (2) the culminating monologue (lesson06) is
    graded against a fixed multi-sentence string -- confirm the
    accepted-answer punctuation variants are complete enough that a
    correct learner is never marked wrong; (3) the listening exercise
    (lesson06) and every dictation match their bound audio asset
    sentence-for-sentence; (4) confirm "Parto da un'idea semplice",
    "tiene in forma e riduce lo stress", "si rischi troppo nel traffico",
    "con le piste ciclabili si viaggia in tutta sicurezza", and "più
    salute e meno smog" read as natural current Standard Italian.

course:
  realization_key: it.c1
  target_language_first: true
  dialect: it_IT_standard
  register_policy: >-
    Informal tu throughout, matching the established it-lane canon: Elena
    and Sam, established colleagues (Sam the American ingegnere working in
    an office in Milan, Elena the Italian insegnante), address each other
    with tu in every scene. C1 layers extended-discourse structure onto
    that register -- Parto da, prima di tutto, ti spiego, da una parte ...
    dall'altra, in concreto, apro una piccola parentesi, per tornare alla
    mia idea principale, in definitiva -- while keeping the informal
    address consistent throughout and never switching to formal Lei.

