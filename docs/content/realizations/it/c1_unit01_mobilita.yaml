  - content_key: it.c1.audio.mobilita.contributo.01
    language: it
    text: >-
      Parto da un'idea semplice: andare al lavoro in bicicletta. Da una
      parte fa bene alla salute: in concreto, muoversi ogni giorno tiene in
      forma e riduce lo stress. Dall'altra fa bene all'ambiente, perché si
      inquina di meno. Apro una piccola parentesi: alcuni colleghi temono
      che in bicicletta si rischi troppo nel traffico, una preoccupazione
      comprensibile. Ma per tornare alla mia idea principale, con le piste
      ciclabili si viaggia in tutta sicurezza. In definitiva, andare in
      bicicletta significa più salute e meno smog.
    voice_hint: neutral_adult_thoughtful
    status: pending_generation

