            target: {text: "Es scheint, dass der Vorschlag einigermaßen überzeugend ist. Vermutlich ist er in gewisser Weise nützlich.", language_code: de, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: de.b2.unit03.lesson02.exercise01.recognize_einigermassen
            type: multiple_choice
            tested_text: einigermaßen
            prompt: {target_blocks: [{text: einigermaßen, language_code: de, direction: ltr}]}
          - content_key: de.b2.unit03.lesson02.exercise02.listen_es_scheint
            type: listen_select
            tested_text: "Es scheint, dass der Vorschlag funktioniert"
            media_asset_key: de.b2.audio.nuance.es_scheint_funktioniert.01
            prompt: {target_blocks: []}
          - content_key: de.b2.unit03.lesson02.exercise03.match_tentative
            type: matching_pairs
            tested_text: "einigermaßen in gewisser Weise es scheint dass vermutlich überzeugend nützlich"
            prompt: {target_blocks: []}
            pairs:
              - {left: einigermaßen, right: "somewhat / to some extent"}
              - {left: "in gewisser Weise", right: "in a certain way"}
              - {left: "es scheint, dass...", right: "it seems that..."}
              - {left: vermutlich, right: presumably}
              - {left: überzeugend, right: convincing}
              - {left: nützlich, right: useful}
          - content_key: de.b2.unit03.lesson02.exercise04.order_es_scheint
            type: word_order
            tested_text: "Es scheint dass der Vorschlag funktioniert"
            prompt: {target_blocks: []}
            word_bank: [Es, scheint, dass, der, Vorschlag, funktioniert]
          - content_key: de.b2.unit03.lesson02.exercise05.translate_vermutlich
            type: translation
            tested_text: "Der Vorschlag ist vermutlich nützlich"
            prompt: {target_blocks: [{text: "Translate into German, using vermutlich: The proposal is presumably useful.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit03.lesson02.exercise06.speak_in_gewisser_weise
            type: speak_response
            tested_text: "In gewisser Weise hat er recht"
            prompt: {target_blocks: [{text: "Say aloud in German, using in gewisser Weise: In a certain way, he's right.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit03.lesson02.exercise07.write_es_scheint_einigermassen
            type: writing_prompt
            tested_text: "Es scheint, dass der Vorschlag einigermaßen überzeugend ist"
            prompt: {target_blocks: [{text: "Write in German, hedging your opinion: It seems that the proposal is somewhat convincing.", language_code: en, direction: ltr}]}

      - content_key: de.b2.unit03.lesson03.betonen
