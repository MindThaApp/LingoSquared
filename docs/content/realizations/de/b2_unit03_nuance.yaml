units:
  - content_key: de.b2.unit03.nuance
    title: "Nuance"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.discourse.express_nuance_with_hedging_and_emphasis
    planned_lesson_count: 6

    lessons:
      - content_key: de.b2.unit03.lesson01.abschwaechen
        title: "Abschwächen"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: de.b2.unit03.lesson01.teach.base_claim
            kind: phrase
            target: {text: "Der Vorschlag ist gut.", language_code: de, direction: ltr}
            introduced_tokens: [Der, Vorschlag, ist, gut]
          - content_key: de.b2.unit03.lesson01.teach.eigentlich
            kind: vocabulary
            target: {text: "eigentlich", language_code: de, direction: ltr}
            introduced_tokens: [eigentlich]
            example: {text: "Der Vorschlag ist eigentlich gut.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson01.teach.ziemlich
            kind: vocabulary
            target: {text: "ziemlich", language_code: de, direction: ltr}
            introduced_tokens: [ziemlich]
            example: {text: "Der Vorschlag ist ziemlich gut.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson01.teach.ein_bisschen
            kind: phrase
            target: {text: "ein bisschen", language_code: de, direction: ltr}
            introduced_tokens: [ein, bisschen, kompliziert]
            example: {text: "Der Vorschlag ist ein bisschen kompliziert.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson01.teach.eher
            kind: vocabulary
            target: {text: "eher", language_code: de, direction: ltr}
            introduced_tokens: [eher, durchschnittlich]
            example: {text: "Der Vorschlag ist eher durchschnittlich.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson01.teach.ich_wuerde_sagen
            kind: phrase
            target: {text: "ich würde sagen", language_code: de, direction: ltr}
            introduced_tokens: [ich, würde, sagen, okay]
            example: {text: "Ich würde sagen, der Vorschlag ist okay.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson01.teach.grammar_abschwaechen
            kind: grammar_note
            target: {text: "Der Vorschlag ist eigentlich ziemlich gut, aber ein bisschen kompliziert. Ich würde sagen, er ist eher gut.", language_code: de, direction: ltr}
            introduced_tokens: [aber, er]
        exercises:
          - content_key: de.b2.unit03.lesson01.exercise01.recognize_eigentlich
            type: multiple_choice
            tested_text: eigentlich
            prompt: {target_blocks: [{text: eigentlich, language_code: de, direction: ltr}]}
          - content_key: de.b2.unit03.lesson01.exercise02.listen_eigentlich_ziemlich
            type: listen_select
            tested_text: "Der Vorschlag ist eigentlich ziemlich gut"
            media_asset_key: de.b2.audio.nuance.eigentlich_ziemlich_gut.01
            prompt: {target_blocks: []}
          - content_key: de.b2.unit03.lesson01.exercise03.match_hedges
            type: matching_pairs
            tested_text: "eigentlich ziemlich ein bisschen eher ich würde sagen kompliziert"
            prompt: {target_blocks: []}
            pairs:
              - {left: eigentlich, right: "actually / technically"}
              - {left: ziemlich, right: "fairly / quite"}
              - {left: "ein bisschen", right: "a little"}
              - {left: eher, right: "rather / more like"}
              - {left: "ich würde sagen", right: "I would say"}
              - {left: kompliziert, right: complicated}
          - content_key: de.b2.unit03.lesson01.exercise04.order_eigentlich_ziemlich
            type: word_order
            tested_text: "Der Vorschlag ist eigentlich ziemlich gut"
            prompt: {target_blocks: []}
            word_bank: [Der, Vorschlag, ist, eigentlich, ziemlich, gut]
          - content_key: de.b2.unit03.lesson01.exercise05.translate_eher
            type: translation
            tested_text: "Der Vorschlag ist eher durchschnittlich"
            prompt: {target_blocks: [{text: "Translate into German, using eher: The proposal is rather average.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit03.lesson01.exercise06.write_ein_bisschen
            type: writing_prompt
            tested_text: "Der Vorschlag ist ein bisschen kompliziert"
            prompt: {target_blocks: [{text: "Write in German, softening your opinion: The proposal is a little complicated.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit03.lesson01.exercise07.speak_ich_wuerde_sagen
            type: speak_response
            tested_text: "Ich würde sagen, der Vorschlag ist okay"
            prompt: {target_blocks: [{text: "Say aloud in German, using ich würde sagen: I would say the proposal is okay.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit03.lesson01.exercise08.dictation_eigentlich_ziemlich
            type: dictation
            tested_text: "Der Vorschlag ist eigentlich ziemlich gut"
            media_asset_key: de.b2.audio.nuance.eigentlich_ziemlich_gut.01
            prompt: {target_blocks: []}

      - content_key: de.b2.unit03.lesson02.vorsichtig_sein
        title: "Vorsichtig sein"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: de.b2.unit03.lesson02.teach.einigermassen
            kind: vocabulary
            target: {text: "einigermaßen", language_code: de, direction: ltr}
            introduced_tokens: [einigermaßen, überzeugend]
            example: {text: "Der Vorschlag ist einigermaßen überzeugend.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson02.teach.in_gewisser_weise
            kind: phrase
            target: {text: "in gewisser Weise", language_code: de, direction: ltr}
            introduced_tokens: [in, gewisser, Weise, hat, recht]
            example: {text: "In gewisser Weise hat er recht.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson02.teach.es_scheint_dass
            kind: phrase
            target: {text: "es scheint, dass...", language_code: de, direction: ltr}
            introduced_tokens: [es, scheint, dass, funktioniert]
            example: {text: "Es scheint, dass der Vorschlag funktioniert.", language_code: de, direction: ltr}
          - content_key: de.b2.unit03.lesson02.teach.vermutlich
            kind: vocabulary
            target: {text: "vermutlich", language_code: de, direction: ltr}
