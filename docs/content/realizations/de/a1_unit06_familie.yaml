    language: "de"
    text: "Felix: Ist das Ihre Familie? Anna: Ja. Das ist meine Mutter und das ist mein Vater. Felix: Wer ist das? Anna: Das ist meine Schwester. Meine Schwester ist Lehrerin. Felix: Haben Sie Brüder? Anna: Nein. Ich habe nur eine Schwester."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

