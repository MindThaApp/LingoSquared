review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Sixth German unit, continuing the Anna/Felix storyline (still on
    the formal Sie register from units 01-05). Scoped to exactly one
    spine outcome (universal.a1.family.describe_relationships) across
    all 4 lessons per AUTHORING_GUIDE §1; prerequisite
    universal.a1.introductions.exchange_identity is satisfied by unit02.

    The single trickiest real teaching point in this unit: German
    possessive adjectives (mein/meine, sein/seine, Ihr/Ihre) agree with
    the GRAMMATICAL GENDER of the noun being possessed, not the
    possessor -- unlike English's invariant "my/his/your." "der Vater"
    (masculine) takes "mein Vater," but "die Mutter" (feminine) takes
    "meine Mutter." This is taught explicitly with worked examples
    across both genders and the plural (meine Eltern), and
    lesson02.exercise04's multiple_choice deliberately includes a
    wrong-gender-agreement distractor ("Ihre Vater" -- Vater is
    masculine, so this is ungrammatical) specifically to test whether
    the agreement rule was internalized, not just the vocabulary.
    Also flagged: German splits "cousin" into two gendered nouns
    (Cousin = male cousin, Cousine = female cousin), unlike English's
    single gender-neutral word -- taught as its own explicit contrast.

    Deliberate scoping decision, same discipline as unit02's original
    er/sie deferral: this unit teaches "mein/meine" (my), "sein/seine"
    (his, third person about Felix -- no collision risk, "er"/"Er" has
    no competing meaning), and "Ihr/Ihre" (formal "your," capitalized,
    matching the established Sie register). It deliberately does NOT
    introduce lowercase "ihr/ihre" (her/their) in this file, since that
    would create the exact same capitalization homograph problem as
    Sie/sie (Ihre Schwester = "your-formal sister" vs ihre Schwester =
    "her sister," distinguishable only by case when not
    sentence-initial). The CODE-lane's 2026-07-07 case_sensitive
    grading flag (67ed7ae) now exists and could grade this correctly
    whenever a future unit deliberately introduces the contrast with
    proper scaffolding -- flagging this here the same way unit02
    flagged Sie/sie for whoever eventually authors that unit, rather
    than reaching for the flag prematurely in a unit not built around
    demonstrating the contrast. To keep the capstone dialogue
    contrastive without needing "her," the sister is referred to by
    repeating the noun ("Meine Schwester ist Lehrerin") rather than
    pronominalizing to "Sie ist Lehrerin," which would immediately
    recreate the deferred collision.

    lesson01's matching_pairs was widened to 6 pairs (adding Eltern and
    Geschwister as their own matched concepts, not just the 4
    individual terms) specifically to clear AUTHORING_GUIDE §16's 6-12
    floor comfortably rather than land at the shared en realization's
    bare 4. No fill_in_blank exercises, same ambiguity-avoidance
    discipline as every prior unit. Applied the hardcoded-English-
    target_blocks lesson from the start: every target_blocks in this
    file is empty or genuine German content only -- a repo-wide grep
    after authoring confirms zero language_code: "en" target_blocks
    anywhere in this file. Compiled and validated against the real
    compiler to confirm every exercise's tested_text is fully covered
    by this file's own cumulative introduced_tokens (including plural
    noun forms like "Schwestern"/"Brüder," which tokenize as distinct
    tokens from their singular forms and are declared separately where
    first tested).

    Fresh-context review (subagent, Codex still usage-exhausted; the
    review deliberately did not open any sibling-direction overlay,
    per the standing isolation rule) confirmed all possessive-adjective
    gender-agreement claims are genuinely correct standard German
    (including the deliberately-wrong distractors "Ihre Vater"/"seine
    Bruder"), the Cousin/Cousine gendered-noun split is real, zero
    hardcoded-English-target_blocks instances, and both word_order
    exercises' accepted_answers are correctly ordered (not copied from
    scrambled word_bank order). It found one real BLOCKING bug in this
    file: lesson04.exercise05.read_bildunterschrift's en-de instruction
    ("who is named besides Anna's mother and father?") didn't match
    its own correct answer (the full caption, which explicitly includes
    the excluded parents) -- fixed by narrowing both the realization's
    tested_text and the overlay's correct_option/accepted_answers to
    just "meine Schwester," matching what the instruction actually
    asks for; confirmed via the compiled output. Minor fixes also
    applied in the overlays: a §15 single-quote-instead-of-asterisk
    slip, two §12 missing conjunction-joined variants, and two
    grammar-note wording issues (a wrong-case citation and a conflated
    formality/gender explanation) in de-en's teaching notes. Also
    flagged, not fixed here: the paired en/a1_unit06_family.yaml
    realization's own match_family_words has only 4 pairs (below §16's
    6-12 floor) -- shared, already-reviewed content used by every X-en
    overlay pairing with it, out of scope for a unilateral edit.
    Re-verified clean after every fix: real compiler validate+compile
    for both en-de and de-en directions (0 errors/warnings), full
    scripts/verify.sh --content-only.

    2026-07-07 §19 retrofit: added `example:` to all 13 kind:vocabulary
    cards. Used the file's own already-established "Das ist mein/meine
    X" pattern (lesson03/04's dialogue already uses this exact
    construction) rather than inventing a new one, correctly agreeing
    gender for each noun (mein Vater/Bruder/Großvater/Onkel/Cousin
    masculine; meine Mutter/Schwester/Großmutter/Tante/Cousine
    feminine; "Das sind meine Eltern/Geschwister" plural, correctly
    using "sind" not "ist"). Deliberately did not use any possessive
    with lowercase "ihr" (her), consistent with this file's own
    standing deferral of that collision with formal "Ihr". Foto's
    example ("Ich habe ein Foto.") avoids exposing any case-agreement
    question since neuter "ein Foto" is identical in nominative and
    accusative. schema_version bumped to 1.1.

course:
  realization_key: "de.a1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch). Possessive adjectives agree with the grammatical gender of the possessed noun (mein Vater, meine Mutter, meine Eltern) -- flag this explicitly rather than assume learners will infer it from English's invariant 'my.' German also genders 'cousin' (Cousin/Cousine) where English has one word. Anna and Felix continue on the formal Sie register from units 01-05."

