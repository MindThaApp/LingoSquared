course:
  realization_key: de.b2
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    informal du register (used with Jonas, Felix's close friend) and the
    formal Sie register (used toward an unnamed institution), contrasting
    them directly. Each single exercise stays in one consistent register;
    the contrast is carried across exercise pairs and the culminating
    exercise. Informal: du/dich/dir/dein, direct requests, bitte, Hallo,
    Liebe Grüße. Formal: Sie/Ihnen/Ihr with the corresponding verb forms
    (haben Sie, können Sie, wären Sie), Wären Sie so freundlich, Wäre es
    möglich, Sehr geehrte Damen und Herren, Mit freundlichen Grüßen,
    Hochachtungsvoll.

