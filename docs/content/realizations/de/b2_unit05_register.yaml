    de.b2.unit05.lesson03.exercise03.match_directness pair {machen: 'to
    do / make'} -> {das: 'this / that'} and tested_text updated (tun and
    machen both meant 'to do', confusable lefts). Overlay
    en-de/b2_unit05 fixes are listed in its own review note. NATIVE
    FLAG: lesson05 teach.text_formell uses 'Ich kann am Montag leider
    nicht.' and 'Passt Ihnen nächste Woche?' inside a 'Sehr geehrte
    Damen und Herren' letter; a native check should confirm these suit
