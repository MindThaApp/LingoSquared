review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Fifth German B2 unit; first register unit. Targets the CEFR B2 register
    outcome (universal.b2.register.adapt_formality_to_audience): adapt
    formality to the audience -- deliver the same content appropriately to
    a close friend versus an institution. Theme: one everyday request --
    rescheduling an appointment -- rendered both ways across all six
    lessons. Lesson arc: L01 the du<->Sie pronoun/verb shift (du/dir/dein/
    dich vs Sie/Ihnen/Ihr; hast du -> haben Sie, kannst du -> können Sie);
    L02 salutations and closings (Hallo/Liebe Grüße vs Sehr geehrte Damen
    und Herren/Mit freundlichen Grüßen/Hochachtungsvoll); L03 directness --
    informal imperative-style request + bitte vs formal Wären Sie so
    freundlich/Wäre es möglich + bitte; L04 the actual request (den Termin
    verschieben) rendered informally and formally; L05 a reading
    requirement -- two messages, same content, different register, identify
    the audience of each; L06 the culminating production -- a Felix/Jonas
    dialogue for the listening requirement (judge whether the register fits
    the situation and what a mismatch would signal), a speaking task
    delivering the SAME request once to a friend and once to an
    institution, a writing task rewriting the informal message as a formal
    one, and a culminating writing task producing the request in BOTH
    registers. Register: this unit teaches both; Jonas (new, informal
    du) supplies the informal side, the institutional side is formal to an
    unnamed recipient (Sehr geehrte Damen und Herren). All vocabulary is
    introduced within this file OR carried forward from de.b2.unit01-04
    (same course row -- a B2 learner sees units 01-08 as one continuous
    course). No sibling-direction file was consulted. Priority checks for
    the fresh-context reviewer: (1) confirm "Sie" (formal you) is never
    confusable with "sie" (she/they) in any exercise that shows it as a
    bare word out of sentence context -- lesson01 exercise01 tests it
    capitalized only; (2) the Sie-conjugation forms -- confirm "Haben Sie
    Zeit?", "Können Sie helfen?", "Wären Sie so freundlich" all use the
    correct Sie-takes-the-plural-like-verb-form pattern; (3) dative usage
    of "Ihnen"/"dir" in lesson01 and lesson05's formal reading text
    ("Passt Ihnen nächste Woche?"); (4) the greetings/closings ladder --
    confirm Hallo + Liebe Grüße (informal), Sehr geehrte Damen und Herren +
    Mit freundlichen Grüßen (formal), and Hochachtungsvoll (most formal,
    reserved for very formal/legal correspondence) are ranked and glossed
    correctly; (5) the culminating writing exercises (lesson06 exercise06
    the informal->formal rewrite, and lesson06 exercise07 producing both
    registers) are graded against fixed strings -- confirm accepted-answer
    punctuation/umlaut-ASCII variants are complete enough that a correct
    learner is never marked wrong; (6) confirm "verschieben" (to reschedule/
    postpone) and "passen" (to suit/be convenient) read as current everyday
    German for this context.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grading-fit of every accepted answer against the taught
