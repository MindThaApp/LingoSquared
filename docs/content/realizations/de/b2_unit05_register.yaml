      - content_key: de.b2.unit05.lesson05.zwei_nachrichten
        title: "Zwei Nachrichten, zwei Leser"
        spine_outcome_id: universal.b2.register.adapt_formality_to_audience
        teaching:
          - content_key: de.b2.unit05.lesson05.teach.passen
            kind: vocabulary
            target: {text: "passen", language_code: de, direction: ltr}
            introduced_tokens: [passen, passt]
            example: {text: "Passt dir nächste Woche?", language_code: de, direction: ltr}
          - content_key: de.b2.unit05.lesson05.teach.text_informell
            kind: reading
            target:
              text: >-
                Hallo Jonas! Kannst du unseren Termin verschieben? Ich kann
                am Montag leider nicht. Passt dir nächste Woche? Liebe
                Grüße Felix
              language_code: de
              direction: ltr
            introduced_tokens: []
          - content_key: de.b2.unit05.lesson05.teach.text_formell
            kind: reading
            target:
              text: >-
                Sehr geehrte Damen und Herren, wäre es möglich, unseren
                Termin zu verschieben? Ich kann am Montag leider nicht.
                Passt Ihnen nächste Woche? Mit freundlichen Grüßen Felix
                Weber
              language_code: de
              direction: ltr
            introduced_tokens: [Ihnen, Weber]
        exercises:
          - content_key: de.b2.unit05.lesson05.exercise01.read_friend
            type: reading_comprehension
            tested_text: "Hallo Jonas"
            prompt: {target_blocks: [{text: "Hallo Jonas! Kannst du unseren Termin verschieben? Ich kann am Montag leider nicht. Passt dir nächste Woche? Liebe Grüße Felix", language_code: de, direction: ltr}, {text: "Sehr geehrte Damen und Herren, wäre es möglich, unseren Termin zu verschieben? Ich kann am Montag leider nicht. Passt Ihnen nächste Woche? Mit freundlichen Grüßen Felix Weber", language_code: de, direction: ltr}, {text: "Which message is written to a close friend?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit05.lesson05.exercise02.read_institution
            type: reading_comprehension
            tested_text: "Sehr geehrte Damen und Herren"
            prompt: {target_blocks: [{text: "Hallo Jonas! Kannst du unseren Termin verschieben? Ich kann am Montag leider nicht. Passt dir nächste Woche? Liebe Grüße Felix", language_code: de, direction: ltr}, {text: "Sehr geehrte Damen und Herren, wäre es möglich, unseren Termin zu verschieben? Ich kann am Montag leider nicht. Passt Ihnen nächste Woche? Mit freundlichen Grüßen Felix Weber", language_code: de, direction: ltr}, {text: "Which message is written to an institution?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit05.lesson05.exercise03.read_same_request
            type: reading_comprehension
            tested_text: "unseren Termin verschieben"
            prompt: {target_blocks: [{text: "Hallo Jonas! Kannst du unseren Termin verschieben? Ich kann am Montag leider nicht. Passt dir nächste Woche? Liebe Grüße Felix", language_code: de, direction: ltr}, {text: "Sehr geehrte Damen und Herren, wäre es möglich, unseren Termin zu verschieben? Ich kann am Montag leider nicht. Passt Ihnen nächste Woche? Mit freundlichen Grüßen Felix Weber", language_code: de, direction: ltr}, {text: "Both messages make the SAME request. What is it?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit05.lesson05.exercise04.read_signal
            type: reading_comprehension
            tested_text: "Ihnen"
            prompt: {target_blocks: [{text: "Hallo Jonas! Kannst du unseren Termin verschieben? Ich kann am Montag leider nicht. Passt dir nächste Woche? Liebe Grüße Felix", language_code: de, direction: ltr}, {text: "Sehr geehrte Damen und Herren, wäre es möglich, unseren Termin zu verschieben? Ich kann am Montag leider nicht. Passt Ihnen nächste Woche? Mit freundlichen Grüßen Felix Weber", language_code: de, direction: ltr}, {text: "Which word marks the second message as addressed formally?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit05.lesson05.exercise05.match_register_features
            type: matching_pairs
            tested_text: "Hallo Jonas Sehr geehrte Damen und Herren Liebe Grüße Mit freundlichen Grüßen passen nächste Woche"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Hallo Jonas", right: "informal greeting (to a friend)"}
              - {left: "Sehr geehrte Damen und Herren", right: "formal greeting (to an institution)"}
              - {left: "Liebe Grüße", right: "informal closing"}
              - {left: "Mit freundlichen Grüßen", right: "formal closing"}
              - {left: passen, right: "to suit / be convenient"}
              - {left: "nächste Woche", right: "next week"}
          - content_key: de.b2.unit05.lesson05.exercise06.translate_passt_ihnen
            type: translation
            tested_text: "Passt Ihnen nächste Woche"
            prompt: {target_blocks: [{text: "Translate into German, formal: Does next week suit you?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit05.lesson05.exercise07.write_passt_dir
            type: writing_prompt
            tested_text: "Passt dir nächste Woche"
            prompt: {target_blocks: [{text: "Write in German, informal: Does next week suit you?", language_code: en, direction: ltr}]}

