      - content_key: de.b2.unit06.lesson05.einen_meinungstext_lesen
        title: "Einen Meinungstext lesen"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: de.b2.unit06.lesson05.teach.meinungstext
            kind: reading
            target:
              text: >-
                Viele Menschen glauben, dass Erfolg vor allem Geld bedeutet.
                Im Allgemeinen sehe ich das anders: Für mich bedeutet Erfolg
                in erster Linie Zufriedenheit. Natürlich spielt Geld eine
                Rolle, aber nur bis zu einem gewissen Grad. Manche sagen,
                dass Status wichtiger ist als Zufriedenheit. Ich verstehe,
                was sie meinen, aber ich stimme nicht ganz zu, denn im
                Grunde genommen ist Zufriedenheit das, was bleibt.
              language_code: de
              direction: ltr
            introduced_tokens: [viele, glauben, vor, allem, in, erster, Linie, spielt, spielen, eine, Rolle, sie, wichtiger, das, was, bleibt, nur]
        exercises:
          - content_key: de.b2.unit06.lesson05.exercise01.read_claim
            type: reading_comprehension
            tested_text: Zufriedenheit
            prompt: {target_blocks: [{text: "What is the author's main claim about success?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit06.lesson05.exercise02.read_objection
            type: reading_comprehension
            tested_text: "Status wichtiger ist als Zufriedenheit"
            prompt: {target_blocks: [{text: "Which view does the author acknowledge before responding to it?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit06.lesson05.exercise03.read_response
            type: reading_comprehension
            tested_text: "ich stimme nicht ganz zu"
            prompt: {target_blocks: [{text: "How does the author respond to that view?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit06.lesson05.exercise04.read_qualification
            type: reading_comprehension
            tested_text: "bis zu einem gewissen Grad"
            prompt: {target_blocks: [{text: "To what degree does the author say money plays a role?", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit06.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "vor allem in erster Linie eine Rolle spielen wichtiger glauben bleibt"
            prompt: {target_blocks: []}
            pairs:
              - {left: "vor allem", right: "above all"}
              - {left: "in erster Linie", right: primarily}
              - {left: "eine Rolle spielen", right: "to play a role"}
              - {left: wichtiger, right: "more important"}
              - {left: glauben, right: "to believe"}
              - {left: bleibt, right: remains}
          - content_key: de.b2.unit06.lesson05.exercise06.translate_in_erster_linie
            type: translation
            tested_text: "Für mich bedeutet Erfolg in erster Linie Zufriedenheit"
            prompt: {target_blocks: [{text: "Translate into German: For me, success primarily means contentment.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit06.lesson05.exercise07.write_eine_rolle_spielen
            type: writing_prompt
            tested_text: "Natürlich spielt Geld eine Rolle, aber nur bis zu einem gewissen Grad"
            prompt: {target_blocks: [{text: "Write in German, using bis zu einem gewissen Grad: Of course money plays a role, but only to a certain degree.", language_code: en, direction: ltr}]}

