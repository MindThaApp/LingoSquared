  notes: >-
    Sixth German B2 unit; first abstraction unit. Targets the CEFR B2
    abstraction outcome (universal.b2.abstraction.discuss_abstract_ideas_
    and_values): discuss abstract topics -- ideas, values -- expressing an
    opinion with qualification and responding to another person's view
    rather than only stating your own. Theme: what does success (Erfolg)
    really mean -- money, status, or contentment -- argued by Felix Weber
    and Frau Vogel, continuing their established formal-Sie workplace
    register. Lesson arc: L01 stating a qualified opinion about success
    (Im Allgemeinen glaube ich, dass..., Für mich bedeutet...); L02
