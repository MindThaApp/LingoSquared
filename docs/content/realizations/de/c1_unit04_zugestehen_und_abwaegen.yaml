            target: {text: "Ich gebe zu, dass ein Großraumbüro lauter ist, aber es fördert den Austausch unter den Kollegen. Das stimmt, der Austausch ist ein echter Vorteil. Allerdings brauchen viele Kollegen Ruhe für ihre Arbeit, und die geht im Großraumbüro verloren. Auf der einen Seite sparen wir Kosten, auf der anderen Seite verlieren wir Ruhe. In der Gesamtabwägung überwiegen für mich dennoch die Vorteile. Ich verstehe Ihre Sicht, aber gute Arbeit verlangt Konzentration. Deshalb überwiegen für mich in der Gesamtabwägung die Nachteile. Dann sollten wir beide Seiten sorgfältig abwägen, bevor wir entscheiden. Einverstanden. Wichtig ist, dass wir keinen Einwand einfach beiseiteschieben.", language_code: de, direction: ltr}
