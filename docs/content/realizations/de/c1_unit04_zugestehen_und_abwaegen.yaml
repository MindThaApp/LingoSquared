  notes: >-
    Fourth German C1 unit. Targets
    universal.c1.argumentation.concede_and_counter_with_subtlety (argue with
    subtlety -- genuinely concede a valid opposing point, then qualify or
    rebut it, weighing competing considerations rather than dismissing them).
    Theme: management is considering moving the team into an open-plan office
    (das Grossraumbuero), and Felix Weber and Frau Vogel argue the move with
    genuine concession, proportionate counter, and an explicit final
    weighing. The lesson arc mirrors the outcome's four assessment
    requirements: L01 the concession (Zugegeben, ich gebe zu, dass, es
    stimmt, dass, das ist ein berechtigter Einwand), L02 the qualification
    and counter (allerdings, dennoch, trotzdem, Dagegen spricht, dass),
    L03 the weighing (einerseits ... andererseits, abwaegen, ueberwiegen,
    in der Gesamtabwaegung), L04 tracing a nuanced argument and mapping its
    moves (read_weighted_argument), L05 producing a response that concedes
    then qualifies (concede_and_counter), L06 the culminating full exchange
    covering all four requirements -- listening (follow an argument that
    grants a point before rebutting it), reading (map concession, counter,
    and weighing), speaking AND writing (each produce the same three-move
    argument: a genuine concession, a proportionate counter, and an explicit
    weighing, in that order). Register: formal Sie throughout, including
    inside disagreement. Priority checks for the fresh-context reviewer:
    (1) formal Sie is consistent and never slips into du, even in the
    emphatic counter lines; (2) the culminating speaking AND writing
    exercises (lesson06) BOTH require the full concession + counter +
    weighing sequence -- neither stops short of the counter move; (3) the
    dialogue cards and the dictation match their bound audio asset
    sentence-for-sentence, with internal punctuation identical; (4) the two
    dialogue-comprehension exercises in lesson06 agree with each other and
    with the bound audio on what each speaker actually says; (5) the
    accepted-answer variants for the multi-sentence model argument are
    complete (trailing-period and ascii-umlaut forms) so a correct learner
    is never marked wrong.

