    language: de
    text: "Allerdings leidet darunter die Konzentration, denn viele Kollegen brauchen Ruhe für ihre Arbeit."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: de.c1.audio.zugestehen_und_abwaegen.abwaegung.01
    language: de
    text: "In der Gesamtabwägung überwiegen für mich die Nachteile."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: de.c1.audio.zugestehen_und_abwaegen.diktat.01
    language: de
    text: "In der Gesamtabwägung überwiegen für mich die Nachteile."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: de.c1.audio.zugestehen_und_abwaegen.austausch.01
    language: de
    text: >-
      Frau Vogel: Ich gebe zu, dass ein Großraumbüro lauter ist, aber es
      fördert den Austausch unter den Kollegen. Felix: Das stimmt, der
      Austausch ist ein echter Vorteil. Allerdings brauchen viele Kollegen
      Ruhe für ihre Arbeit, und die geht im Großraumbüro verloren. Frau
      Vogel: Auf der einen Seite sparen wir Kosten, auf der anderen Seite
      verlieren wir Ruhe. In der Gesamtabwägung überwiegen für mich dennoch
      die Vorteile. Felix: Ich verstehe Ihre Sicht, aber gute Arbeit verlangt
      Konzentration. Deshalb überwiegen für mich in der Gesamtabwägung die
      Nachteile. Frau Vogel: Dann sollten wir beide Seiten sorgfältig
      abwägen, bevor wir entscheiden. Felix: Einverstanden. Wichtig ist,
      dass wir keinen Einwand einfach beiseiteschieben.
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

