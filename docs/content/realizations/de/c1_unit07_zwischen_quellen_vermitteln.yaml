    from general knowledge of German mediation register and reporting
    conventions. The structural template is de C1 unit05/unit06 (same tier,
    same lesson/exercise pacing, same formal-Sie register policy); every word
    of actual German text is freshly authored, not translated from any sibling
    file, and the scenario is unrelated. Felix Weber (Ingenieur, established
