    continue their formal-Sie workplace register. No sibling-direction file
    (de-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Seventh German C1 unit. Targets
    universal.c1.mediation.mediate_and_synthesize_complex_sources (mediate
    between sources and audiences -- distill complex or conflicting material
    and relay it accurately and appropriately for a specific listener or
    reader). Theme: two reports disagree about whether to launch a new
    software feature -- the technical report (Felix's side) says the system is
    not yet ready, the market report says launch now -- and Felix must relay a
    briefing to the non-specialist Geschäftsleitung. The lesson arc mirrors
    the outcome's four assessment requirements: L01 mediation verbs
    (vermitteln, zusammenfassen, darstellen, wiedergeben), L02 attribution and
    disagreement (laut, zufolge, sich widersprechen, einig), L03 resolving
    terminology for non-specialists (vereinfachen, das heißt, Fachbegriff),
    L04 reading two dense sources and deciding what to retain/explain/omit,
    L05 speaking the relay for the audience (a full multi-sentence briefing,
    not one sentence), L06 the culminating full delivery -- listening to two
    conflicting spoken accounts, writing the briefing, and a dictation.
    Register: formal Sie throughout. Priority checks for the fresh-context
    reviewer: (1) formal Sie is consistent and never slips into du; (2) the
    culminating speaking AND writing exercises (lesson05 exercise06/07 and
    lesson06 exercise05/06) BOTH deliver the FULL multi-sentence briefing
    synthesis (condense both sources + preserve disagreement), never a single
    isolated sentence; (3) the two dialogue-comprehension exercises agree with
    each other and with the bound audio on what each speaker says, with no
    contradictory characterization; (4) the dialogue cards and the dictation
    match their bound audio sentence-for-sentence with internal punctuation
    identical; (5) every tested word is traced to an earlier teaching card
    that genuinely displays that exact form.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    formal Sie (no du slips), dialogue cards and dictation vs bound audio
    (match), open-ended production prompts vs exact-match grading, accepted-
    answer coverage, learner-visible notes, YAML booleans. Fixes (realization
    + en-de overlay): lesson05.exercise06.speak_briefing,
    lesson05.exercise07.write_briefing, lesson06.exercise05.speak_vermittlung,
    lesson06.exercise06.write_vermittlung -- open-ended briefing tasks graded
    against one four-sentence string now give the English model text
    (einerseits/andererseits, das heißt, widersprechen sich, bleibt offen) in
    both copies; lesson05.exercise05.speak_kern -- 'technically not ready' ->
    'technically not ready yet' to match the required noch (both copies;
    overlay lesson05.teach.briefing gloss likewise);
    lesson02.exercise07.write_einig -- accepted Die beiden Berichte sind sich
    nicht einig; lesson04.exercise05.order_monate -- accepted Wir brauchen für
    umfassende Tests sechs Monate; lesson01.exercise07.write_darstellen --
    accepted Wir sollen die Situation darstellen; lesson04.teach.quelle_markt
    -- ungrammatical note 'the market is *wartet*' rewritten;
    lesson06.exercise01.listen_technik -- distractor 'The market is waiting.'
    (said by Felix in the audio) replaced with 'Testing is complete.'. NATIVE
    FLAGS: none open. DEFERRED: none.

course:
  realization_key: de.c1
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching the
    established de lane workplace register -- Felix Weber and Frau Vogel,
    established colleagues from the de B1/B2 tiers, address each other with
    Sie in every scene. C1 mediation layers reporting and attribution
    vocabulary (laut, zufolge, sich widersprechen, vereinfachen, das heißt)
    onto that register, all delivered in the same formal Sie address, never
    slipping into du.

