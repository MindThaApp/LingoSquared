            prompt: {target_blocks: []}
          - {content_key: "de.b1.unit53.lesson02.exercise05.order_anna_tisch_reserviert", type: "word_order", tested_text: "Der Tisch an dem wir sitzen ist reserviert", prompt: {target_blocks: []}, word_bank: ["Der", "Tisch,", "an", "dem", "wir", "sitzen,", "ist", "reserviert."]}
          - {content_key: "de.b1.unit53.lesson02.exercise06.write_anna_tisch_reserviert", type: "writing_prompt", tested_text: "Der Tisch an dem wir sitzen ist reserviert", prompt: {target_blocks: [{text: "As Anna, combine these two facts about the table into one sentence with a relative clause using the preposition an + dem, exactly with Der Tisch, an dem ..., ist reserviert.: it's the table; we're sitting at it.", language_code: "en", direction: "ltr"}]}}

