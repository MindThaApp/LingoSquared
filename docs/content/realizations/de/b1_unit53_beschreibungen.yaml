          - {content_key: "de.b1.unit53.lesson03.exercise06.write_full_descriptions", type: "writing_prompt", tested_text: "Der Kunde der jeden Tag Kaffee bestellt heißt Herr Braun Der Tisch an dem er sitzt ist sein Lieblingsplatz", prompt: {target_blocks: [{text: "Write two sentences, each combining two facts with a relative clause: (1) about Herr Braun using der ... der ... (nominative, agreeing with der Kunde): he's the customer; he orders coffee every day; (2) about his table using an dem (preposition + dative, agreeing with der Tisch): it's the table; he's sitting at it, and it's his favorite spot.", language_code: "en", direction: "ltr"}]}}
          - {content_key: de.b1.unit53.lesson03.exercise07.dictation_relative_kunde, type: dictation, tested_text: "Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.", media_asset_key: de.b1.audio.relative_kunde.neutral.01, prompt: {target_blocks: []}}
