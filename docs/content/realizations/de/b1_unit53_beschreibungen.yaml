review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Fifth and final unit of the de B1 completion wave (units 49-53), completing the 19-outcome de B1 tier through unit53. Introduces Herr Braun, a regular customer at Anna's cafe (established a1_unit18 Kellnerin), and reuses Frau Klein (established b1_unit37) as a colleague of Felix Weber -- no canon conflicts (grepped, no prior Braun). Formal Sie throughout. Teaches der/die + relative clause with nominative gender agreement (der Kunde, der ...; die Kollegin, die ...) and an dem + relative clause combining a preposition with the dative case (der Tisch, an dem ...), matching the spine outcome's requirement to combine two facts with a relative clause including gender/number agreement and preposition-plus-case cases. Needs fresh-context review."}

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie in
    learner-facing instructions; Anna and Felix's own dialogue about
    customers/colleagues stays in the established formal-Sie workplace
    register of this cafe storyline. Teach nominative relative clauses
    that agree in gender (der Kunde, der ...; die Kollegin, die ...), then
    a relative clause combining a preposition with the dative case (der
    Tisch, an dem ...), so the learner can combine two facts about a
    person or thing into one richer sentence with correct agreement.

