          - {content_key: "de.b1.unit53.lesson01.teach.felix_kollegin_klein", kind: "phrase", target: {text: "Die Kollegin, die im Büro arbeitet, heißt Frau Klein.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["Die", "Kollegin", "die", "im", "Büro", "arbeitet", "heißt", "Frau", "Klein"], example: {text: "Beschreibung: Die Kollegin, die im Büro arbeitet, heißt Frau Klein.", language_code: "de", direction: "ltr"}}
