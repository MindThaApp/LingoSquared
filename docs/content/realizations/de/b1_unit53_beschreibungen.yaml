  notes: "Fifth and final unit of the de B1 completion wave (units 49-53), completing the 19-outcome de B1 tier through unit53. Introduces Herr Braun, a regular customer at Anna's cafe (established a1_unit18 Kellnerin), and reuses Frau Klein (established b1_unit37) as a colleague of Felix Weber -- no canon conflicts (grepped, no prior Braun). Formal Sie throughout. Teaches der/die + relative clause with nominative gender agreement (der Kunde, der ...; die Kollegin, die ...) and an dem + relative clause combining a preposition with the dative case (der Tisch, an dem ...), matching the spine outcome's requirement to combine two facts with a relative clause including gender/number agreement and preposition-plus-case cases. Needs fresh-context review.\n\nFresh-context review 2026-10-11 (content-reviewer.md checklist): checked German accuracy, relative-pronoun agreement and preposition + dative, character canon, prompt determinacy, accepted-answer completeness (grading is case/punctuation-insensitive), matching pairs, distractors, learner-visible notes. Fixes: CANON -- Frau Klein is the Bürgeramt clerk of b1_unit35-37, not Felix's colleague (the note above saying b1_unit37 established her as a colleague is wrong); de.b1.unit53.lesson01.teach.felix_kollegin_klein and every use of it (exercise02 tested_text/prompt/options, exercise04 pair + tested_text, overlay gloss/example_gloss, overlay exercise01 distractor) now use Felix's established colleague Frau Vogel (b1_unit52): 'Die Kollegin, die im Büro arbeitet, heißt Frau Vogel.' / 'Ms. Vogel'; introduced token Klein dropped; content keys unchanged. CANON -- Anna is a waitress who only plans to open her own café (b1_unit48): de.b1.unit53.lesson02.teach.felix_cafe_beliebt 'Das Café, das Anna führt, ist sehr beliebt.' -> 'Das Café, in dem Anna arbeitet, ist sehr beliebt.' (gloss 'The cafe where Anna works is very popular.'), introduced_tokens führt -> in, dem; exercise01 tested_text/prompt/options updated (distractors now 'Das Café, in dem Felix arbeitet, ist sehr beliebt.', 'Der Tisch, an dem Anna arbeitet, ist sehr beliebt.', 'Das Café, in dem Anna arbeitet, ist nicht beliebt.'); exercise04 pair 'führen -> to run / manage' replaced by 'das Café -> the cafe' (realization + overlay); overlay note/feedback rewritten for in + dative dem. de.b1.unit53.lesson03.exercise06.write_full_descriptions prompt/instruction re-pinned to the frames Der Kunde, der ..., heißt Herr Braun. / Der Tisch, an dem ..., ist ... (every accepted answer needed 'heißt Herr Braun', which the given facts never supplied); overlay also accepts 'Herr Braun ist der Kunde, der jeden Tag Kaffee bestellt. Der Tisch, an dem er sitzt, ist sein Lieblingsplatz.' Overlay lesson03 teaching notes rewritten from lesson-construction text to language-point notes. NATIVE FLAG: none. DEFERRED: none.\n\nSecond-pass review 2026-10-19: 2 fixes (realization side; overlay has the rest) — lesson01.teach.anna_kunde_braun: added bestellen to introduced_tokens (tested as lesson01.exercise04 match pair, only bestellt shown); lesson02.exercise06.write_anna_tisch_reserviert prompt 'exactly with Der Tisch, an dem ..., ist reserviert.: it's the table; we're sitting at it.' -> 'exactly with Der Tisch, an dem ...: it's the table; we're sitting at it; it's reserved.' (the frame printed 6 of the answer's 8 words; existing accepted answers unchanged). NATIVE FLAGS: lesson03 dialogue — Felix asks 'Wer ist der Mann am Fenster?' and Anna answers 'Der Kunde, der jeden Tag Kaffee bestellt, heißt Herr Braun.', which names the regular rather than directly identifying the man ('Das ist Herr Braun, der Kunde, der ...' would answer more directly); left as is (ripples through audio, dictation, three exercises)."

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie in
    learner-facing instructions; Anna and Felix's own dialogue about
    customers/colleagues stays in the established formal-Sie workplace
    register of this cafe storyline. Teach nominative relative clauses
    that agree in gender (der Kunde, der ...; die Kollegin, die ...), then
    a relative clause combining a preposition with the dative case (der
    Tisch, an dem ...), so the learner can combine two facts about a
    person or thing into one richer sentence with correct agreement.

