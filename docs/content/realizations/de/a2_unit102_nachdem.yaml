          - {"content_key": "de.a2.unit102.lesson05.teach.gn_text", "kind": "grammar_note", "target": {"text": "Felix hatte die Fahrkarte vergessen. Er ging zurück. Als er ankam, war der Zug abgefahren.", "language_code": "de", "direction": "ltr"}, "introduced_tokens": ["Felix", "hatte", "die", "Fahrkarte", "vergessen", "Er", "ging", "zurück", "Als", "er", "ankam", "war", "der", "Zug", "abgefahren"]}
          - {"content_key": "de.a2.unit102.lesson05.teach.lesen_pech", "kind": "reading", "target": {"text": "Gestern wollte Felix seinen Onkel in Hamburg besuchen. Er hatte die Fahrkarte vergessen und ging zurück nach Hause. Nachdem er sie gefunden hatte, ging er wieder zum Bahnhof. Als er ankam, war der Zug schon abgefahren. Felix wartete eine halbe Stunde. Dann kam der nächste Zug. Später war er endlich in Hamburg.", "language_code": "de", "direction": "ltr"}, "introduced_tokens": ["Gestern", "wollte", "Felix", "seinen", "Onkel", "in", "Hamburg", "besuchen", "Er", "hatte", "die", "Fahrkarte", "vergessen", "und", "ging", "zurück", "nach", "Hause", "Nachdem", "er", "sie", "gefunden", "wieder", "zum", "Bahnhof", "Als", "ankam", "war", "der", "Zug", "schon", "abgefahren", "wartete", "eine", "halbe", "Stunde", "Dann", "kam", "nächste", "Später", "endlich", "dann"]}
        exercises:
          - {"content_key": "de.a2.unit102.lesson05.exercise01.lesen_vergessen", "type": "reading_comprehension", "tested_text": "Er hatte die Fahrkarte vergessen", "prompt": {"target_blocks": [{"text": "What had Felix forgotten?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit102.lesson05.exercise02.lesen_zug", "type": "reading_comprehension", "tested_text": "Als er ankam war der Zug schon abgefahren", "prompt": {"target_blocks": [{"text": "What was the situation when Felix arrived at the station?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit102.lesson05.exercise03.paare_geschichte", "type": "matching_pairs", "tested_text": "Er hatte die Fahrkarte vergessen Er ging zurück nach Hause Nachdem er sie gefunden hatte ging er wieder zum Bahnhof Der Zug war schon abgefahren Dann kam der nächste Zug Später war er endlich in Hamburg", "prompt": {"target_blocks": []}, "pairs": [{"left": "Er hatte die Fahrkarte vergessen.", "right": "He had forgotten the ticket."}, {"left": "Er ging zurück nach Hause.", "right": "He went back home."}, {"left": "Nachdem er sie gefunden hatte, ging er wieder zum Bahnhof.", "right": "After he had found it, he went to the station again."}, {"left": "Der Zug war schon abgefahren.", "right": "The train had already left."}, {"left": "Dann kam der nächste Zug.", "right": "Then the next train came."}, {"left": "Später war er endlich in Hamburg.", "right": "Later he was finally in Hamburg."}]}
          - {"content_key": "de.a2.unit102.lesson05.exercise04.ordnen_naechste", "type": "word_order", "tested_text": "Dann kam der nächste Zug", "prompt": {"target_blocks": []}, "word_bank": ["der", "Zug", "kam", "dann", "nächste"]}
          - {"content_key": "de.a2.unit102.lesson05.exercise05.uebersetzen_wiedergefunden", "type": "translation", "tested_text": "Nachdem er sie gefunden hatte ging er wieder zum Bahnhof", "prompt": {"target_blocks": [{"text": "After he had found it, he went to the station again.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit102.lesson05.exercise06.diktat_zug", "type": "dictation", "tested_text": "Als er ankam, war der Zug schon abgefahren.", "media_asset_key": "de.a2.audio.nachdem.diktat_zug.01", "prompt": {"target_blocks": []}}
          - {"content_key": "de.a2.unit102.lesson05.exercise07.diktat_fahrkarte", "type": "dictation", "tested_text": "Er hatte die Fahrkarte vergessen.", "media_asset_key": "de.a2.audio.nachdem.diktat_fahrkarte.01", "prompt": {"target_blocks": []}}
      - content_key: de.a2.unit102.lesson06.anna_am_telefon
        title: "Anna ruft an"
        spine_outcome_id: universal.a2.past.explain_what_had_happened_before
        teaching:
          - {"content_key": "de.a2.unit102.lesson06.teach.anna_frage", "kind": "dialogue", "target": {"text": "Hallo Felix! Bist du schon bei deinem Onkel?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Hallo", "Felix", "Bist", "du", "schon", "bei", "deinem", "Onkel"]}
          - {"content_key": "de.a2.unit102.lesson06.teach.felix_noch_nicht", "kind": "dialogue", "target": {"text": "Noch nicht. Als ich am Bahnhof ankam, war der Zug schon abgefahren.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Noch", "nicht", "Als", "ich", "am", "Bahnhof", "ankam", "war", "der", "Zug", "schon", "abgefahren"]}
          - {"content_key": "de.a2.unit102.lesson06.teach.anna_oh", "kind": "dialogue", "target": {"text": "Oh nein! Warum bist du so spät gekommen?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Oh", "nein", "Warum", "bist", "du", "so", "spät", "gekommen"]}
          - {"content_key": "de.a2.unit102.lesson06.teach.felix_fahrkarte", "kind": "dialogue", "target": {"text": "Ich hatte meine Fahrkarte vergessen. Nachdem ich sie gefunden hatte, bin ich wieder zum Bahnhof gegangen.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Ich", "hatte", "meine", "Fahrkarte", "vergessen", "Nachdem", "ich", "sie", "gefunden", "bin", "wieder", "zum", "Bahnhof", "gegangen"]}
          - {"content_key": "de.a2.unit102.lesson06.teach.anna_jetzt", "kind": "dialogue", "target": {"text": "Und jetzt? Wann kommst du an?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Und", "jetzt", "Wann", "kommst", "du", "an"]}
          - {"content_key": "de.a2.unit102.lesson06.teach.felix_zug", "kind": "dialogue", "target": {"text": "Ich sitze im nächsten Zug. Er kommt um zehn Uhr an.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Ich", "sitze", "im", "nächsten", "Zug", "Er", "kommt", "um", "zehn", "Uhr", "an"]}
        exercises:
          - {"content_key": "de.a2.unit102.lesson06.exercise01.hoeren_frage", "type": "listen_select", "tested_text": "Hallo Felix Bist du schon bei deinem Onkel", "media_asset_key": "de.a2.audio.dialogue.nachdem.01", "prompt": {"target_blocks": []}}
          - {"content_key": "de.a2.unit102.lesson06.exercise02.verstehen_grund", "type": "dialogue_comprehension", "tested_text": "Ich hatte meine Fahrkarte vergessen", "prompt": {"target_blocks": [{"text": "Why did Felix miss the first train?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "de.a2.audio.dialogue.nachdem.01"}
          - {"content_key": "de.a2.unit102.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Als ich ankam war der Zug schon abgefahren Ich hatte meine Fahrkarte vergessen Nachdem ich sie gefunden hatte bin ich wieder zum Bahnhof gegangen Wann kommst du an Ich sitze im nächsten Zug Er kommt um zehn Uhr an", "prompt": {"target_blocks": []}, "pairs": [{"left": "Als ich ankam, war der Zug schon abgefahren.", "right": "When I arrived, the train had already left."}, {"left": "Ich hatte meine Fahrkarte vergessen.", "right": "I had forgotten my ticket."}, {"left": "Nachdem ich sie gefunden hatte, bin ich wieder zum Bahnhof gegangen.", "right": "After I had found it, I went to the station again."}, {"left": "Wann kommst du an?", "right": "When do you arrive?"}, {"left": "Ich sitze im nächsten Zug.", "right": "I'm sitting in the next train."}, {"left": "Er kommt um zehn Uhr an.", "right": "It arrives at ten o'clock."}]}
          - {"content_key": "de.a2.unit102.lesson06.exercise04.ordnen_fahrkarte", "type": "word_order", "tested_text": "Ich hatte meine Fahrkarte vergessen", "prompt": {"target_blocks": []}, "word_bank": ["meine", "ich", "Fahrkarte", "hatte", "vergessen"]}
          - {"content_key": "de.a2.unit102.lesson06.exercise05.antwort_spaet", "type": "dialogue_response", "tested_text": "Ich hatte meine Fahrkarte vergessen", "prompt": {"target_blocks": [{"text": "Warum bist du so spät gekommen?", "language_code": "de", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit102.lesson06.exercise06.uebersetzen_ankam", "type": "translation", "tested_text": "Als ich am Bahnhof ankam war der Zug schon abgefahren", "prompt": {"target_blocks": [{"text": "When I arrived at the station, the train had already left.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit102.lesson06.exercise07.schreiben_dreisaetze", "type": "writing_prompt", "tested_text": "Ich hatte meine Fahrkarte vergessen Als ich ankam war der Zug schon abgefahren Nachdem ich gewartet hatte kam der nächste Zug", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences: (1) you had forgotten your ticket, starting with 'Ich hatte meine'; (2) when you arrived, the train had already left, starting with 'Als ich ankam'; (3) after you had waited, the next train came, starting with 'Nachdem ich'.", "language_code": "en", "direction": "ltr"}]}}
