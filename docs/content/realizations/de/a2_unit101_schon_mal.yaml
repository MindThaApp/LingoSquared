          - {"content_key": "de.a2.unit101.lesson05.teach.gn_text", "kind": "grammar_note", "target": {"text": "Ich habe schon oft Sushi gegessen, aber ich bin noch nie geflogen.", "language_code": "de", "direction": "ltr"}, "introduced_tokens": ["Ich", "habe", "schon", "oft", "Sushi", "gegessen", "aber", "ich", "bin", "noch", "nie", "geflogen"]}
          - {"content_key": "de.a2.unit101.lesson05.teach.lesen_nina", "kind": "reading", "target": {"text": "Hallo, ich bin Nina. Ich war schon in Berlin und in Hamburg. Ich habe schon oft Sushi gegessen, aber ich bin noch nie geflogen. Ich habe noch nie ein Konzert besucht. Ich habe schon einen Fragebogen geschrieben, aber ich habe die Antworten noch nicht gelesen.", "language_code": "de", "direction": "ltr"}, "introduced_tokens": ["Hallo", "ich", "bin", "Nina", "Ich", "war", "schon", "in", "Berlin", "und", "Hamburg", "habe", "oft", "Sushi", "gegessen", "aber", "noch", "nie", "geflogen", "ein", "Konzert", "besucht", "einen", "Fragebogen", "geschrieben", "die", "Antworten", "nicht", "gelesen"]}
        exercises:
