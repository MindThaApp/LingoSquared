          - {"content_key": "de.a2.unit101.lesson05.exercise02.lesen_noch_nie", "type": "reading_comprehension", "tested_text": "Ich bin noch nie geflogen", "prompt": {"target_blocks": [{"text": "What has Nina never done?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit101.lesson05.exercise03.paare_nina", "type": "matching_pairs", "tested_text": "Ich war schon in Berlin Ich habe schon oft Sushi gegessen Ich bin noch nie geflogen Ich habe noch nie ein Konzert besucht Ich habe einen Fragebogen geschrieben Ich habe die Antworten noch nicht gelesen", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ich war schon in Berlin.", "right": "I have been to Berlin."}, {"left": "Ich habe schon oft Sushi gegessen.", "right": "I have often eaten sushi."}, {"left": "Ich bin noch nie geflogen.", "right": "I have never flown."}, {"left": "Ich habe noch nie ein Konzert besucht.", "right": "I have never been to a concert."}, {"left": "Ich habe einen Fragebogen geschrieben.", "right": "I have written a questionnaire."}, {"left": "Ich habe die Antworten noch nicht gelesen.", "right": "I haven't read the answers yet."}]}
          - {"content_key": "de.a2.unit101.lesson05.exercise04.ordnen_konzert", "type": "word_order", "tested_text": "Ich habe noch nie ein Konzert besucht", "prompt": {"target_blocks": []}, "word_bank": ["nie", "ich", "habe", "besucht", "Konzert", "ein", "noch"]}
          - {"content_key": "de.a2.unit101.lesson05.exercise05.uebersetzen_antworten", "type": "translation", "tested_text": "Ich habe die Antworten noch nicht gelesen", "prompt": {"target_blocks": [{"text": "I haven't read the answers yet.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit101.lesson05.exercise06.diktat_nina", "type": "dictation", "tested_text": "Ich bin noch nie geflogen.", "media_asset_key": "de.a2.audio.schon_mal.diktat_nina.01", "prompt": {"target_blocks": []}}
          - {"content_key": "de.a2.unit101.lesson05.exercise07.diktat_berlin", "type": "dictation", "tested_text": "Ich war schon in Berlin und in Hamburg.", "media_asset_key": "de.a2.audio.schon_mal.diktat_berlin.01", "prompt": {"target_blocks": []}}
      - content_key: de.a2.unit101.lesson06.anna_und_felix
        title: "Anna fragt Felix"
        spine_outcome_id: universal.a2.experience.talk_about_life_experiences
        teaching:
          - {"content_key": "de.a2.unit101.lesson06.teach.anna_frage", "kind": "dialogue", "target": {"text": "Felix, warst du schon mal in Italien?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Felix", "warst", "du", "schon", "mal", "in", "Italien"]}
          - {"content_key": "de.a2.unit101.lesson06.teach.felix_nein", "kind": "dialogue", "target": {"text": "Nein, noch nie. Aber im August fahre ich nach Italien.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Nein", "noch", "nie", "Aber", "im", "August", "fahre", "ich", "nach", "Italien"]}
          - {"content_key": "de.a2.unit101.lesson06.teach.anna_super", "kind": "dialogue", "target": {"text": "Super! Ich war schon zweimal dort. Hast du schon ein Hotel gebucht?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Super", "Ich", "war", "schon", "zweimal", "dort", "Hast", "du", "ein", "Hotel", "gebucht"]}
          - {"content_key": "de.a2.unit101.lesson06.teach.felix_hotel", "kind": "dialogue", "target": {"text": "Ja, ich habe schon ein Hotel gebucht. Aber ich habe noch nicht gepackt.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Ja", "ich", "habe", "schon", "ein", "Hotel", "gebucht", "Aber", "noch", "nicht", "gepackt"]}
          - {"content_key": "de.a2.unit101.lesson06.teach.anna_pizza", "kind": "dialogue", "target": {"text": "Ich habe dort schon viel Pizza gegessen. Die Pizza ist toll!", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Ich", "habe", "dort", "schon", "viel", "Pizza", "gegessen", "Die", "ist", "toll"]}
          - {"content_key": "de.a2.unit101.lesson06.teach.felix_gespannt", "kind": "dialogue", "target": {"text": "Ich habe noch nie Pizza in Italien gegessen. Ich bin gespannt!", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Ich", "habe", "noch", "nie", "Pizza", "in", "Italien", "gegessen", "bin", "gespannt"]}
        exercises:
          - {"content_key": "de.a2.unit101.lesson06.exercise01.hoeren_frage", "type": "listen_select", "tested_text": "Felix warst du schon mal in Italien", "media_asset_key": "de.a2.audio.dialogue.schon_mal.01", "prompt": {"target_blocks": []}}
          - {"content_key": "de.a2.unit101.lesson06.exercise02.verstehen_hotel", "type": "dialogue_comprehension", "tested_text": "Ich habe schon ein Hotel gebucht Aber ich habe noch nicht gepackt", "prompt": {"target_blocks": [{"text": "What has Felix already done and what has he not done yet?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "de.a2.audio.dialogue.schon_mal.01"}
          - {"content_key": "de.a2.unit101.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Ich war schon zweimal dort Hast du schon ein Hotel gebucht Ich habe schon ein Hotel gebucht Ich habe noch nicht gepackt Ich habe dort schon viel Pizza gegessen Ich habe noch nie Pizza in Italien gegessen", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ich war schon zweimal dort.", "right": "I've been there twice."}, {"left": "Hast du schon ein Hotel gebucht?", "right": "Have you booked a hotel yet?"}, {"left": "Ich habe schon ein Hotel gebucht.", "right": "I've already booked a hotel."}, {"left": "Ich habe noch nicht gepackt.", "right": "I haven't packed yet."}, {"left": "Ich habe dort schon viel Pizza gegessen.", "right": "I've eaten a lot of pizza there."}, {"left": "Ich habe noch nie Pizza in Italien gegessen.", "right": "I've never eaten pizza in Italy."}]}
          - {"content_key": "de.a2.unit101.lesson06.exercise04.ordnen_gebucht", "type": "word_order", "tested_text": "Hast du schon ein Hotel gebucht", "prompt": {"target_blocks": []}, "word_bank": ["Hotel", "schon", "hast", "du", "ein", "gebucht"]}
          - {"content_key": "de.a2.unit101.lesson06.exercise05.antwort_italien", "type": "dialogue_response", "tested_text": "Nein noch nie", "prompt": {"target_blocks": [{"text": "Felix, warst du schon mal in Italien?", "language_code": "de", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit101.lesson06.exercise06.uebersetzen_gepackt", "type": "translation", "tested_text": "Ich habe noch nicht gepackt", "prompt": {"target_blocks": [{"text": "I haven't packed yet.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit101.lesson06.exercise07.schreiben_dreisaetze", "type": "writing_prompt", "tested_text": "Ich war schon in Berlin Ich habe schon Sushi gegessen Ich bin noch nie geflogen", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences: (1) you have already been to Berlin, starting with 'Ich war'; (2) you have already eaten sushi, starting with 'Ich habe schon'; (3) you have never flown, starting with 'Ich bin noch nie'.", "language_code": "en", "direction": "ltr"}]}}
