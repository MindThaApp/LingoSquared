          - content_key: "de.b1.unit44.lesson01.exercise04.match_um_zu"
            type: "matching_pairs"
            tested_text: "anna lernt deutsch um im büro zu arbeiten anna spart geld um eine reise zu machen"
            prompt: {target_blocks: []}
            pairs:
