        teaching:
          - {content_key: "de.b1.unit44.lesson01.teach.anna_lernt_um_zu", kind: "phrase", target: {text: "Anna lernt Deutsch, um im Büro zu arbeiten.", language_code: "de", direction: "ltr"}, introduced_tokens: ["lernt", "lernen", "Deutsch", "um", "im", "Büro", "zu", "arbeiten", "Anna"], example: {text: "Ziel: Anna lernt Deutsch, um im Büro zu arbeiten.", language_code: "de", direction: "ltr"}}
