review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Tenth de B1 unit. Uses Anna (Kellnerin, established a1_unit18) and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-43), continuing the cafe storyline. Formal Sie throughout, matching the de-en lane register pin. Teaches um...zu for a same-subject purpose clause (Anna studies German in order to work in an office) contrasted with damit for a different-subject purpose clause (Felix speaks slowly so that Anna can understand him), matching the standard German same-subject/different-subject distinction. Needs fresh-context review."}

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix, matching the established acquaintance-register
    precedent from a1_unit18 and the de-en lane pin. Teach um...zu for a
    purpose clause whose subject is the SAME as the main clause's subject
    (Anna lernt Deutsch, um im Buero zu arbeiten), then contrast it with
    damit for a purpose clause whose subject is DIFFERENT from the main
    clause's subject (Felix spricht langsam, damit Anna ihn versteht).

