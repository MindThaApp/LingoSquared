  notes: >-
    Eleventh German unit, continuing Anna and Felix as adult neighbors who use formal Sie
    with each other. Anna is German, 28, has a sister who is a teacher, and works part-time
    at a cafe; Felix is from England, 31. This unit adds no new biographical facts beyond
    a routine for a single weekday. It is scoped to universal.a1.routines.describe_daily_routine
    and culminates in producing several connected routine sentences with time expressions.

    Second-pass review 2026-10-19: 4 fixes -- lesson01.teach.fruehstuecken example 'Im
    Dialog: Wir frühstücken um sieben Uhr.' (not in the dialogue; its gloss said 'Then I
    have breakfast') -> 'Wann frühstücken Sie?' (overlay gloss updated to match);
    lesson02.teach.line04 example 'Im Dialog: Ja, ich lerne Deutsch und gehe um zehn Uhr
    schlafen.' (not the actual line; gloss said 'In the evening I study German') -> 'Im
    Dialog: Ja, ich arbeite am Nachmittag im Cafe.' (overlay gloss updated to match); lesson01.exercise03.match_aktivitaeten: German clues built from untaught
    words (aus dem Bett kommen, morgens essen, Deutsch üben, ins Bett gehen, danach) ->
    English clues, plus a 6th pair 'to do your job' = arbeiten (taught this lesson; clears
    the §16 warning); lesson02.exercise03.match_reihenfolge: German clues with untaught
    words (wacht auf, isst morgens, Frage nach der ersten Aktivität) -> English clues.
    NATIVE FLAGS: the course spells 'Cafe' here and in many later units but unit07 teaches
    'Café' ('Im Café bestellen', 'Café-Speisekarte'); a course-wide spelling decision is
    needed (overlay now accepts both in production answers). The 'Im Dialog:' prefix
    inside German example sentences is a course-wide pattern (units 11-24) and is read out
    as part of the sentence; left for a course-wide decision.
