  notes: "First unit of the de B1 completion wave (units 49-53), completing the 19-outcome de B1 tier. Uses Anna (Kellnerin, established a1_unit18) and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-48), continuing the cafe storyline directly after unit48's future-plans exchange. Formal Sie throughout, matching the de-en lane register pin. Teaches Der Hauptpunkt ist, dass ... for stating the main point of a summary and Zusammenfassend lässt sich sagen, dass ... / Außerdem erwähnt ... , dass ... to mark an additional supporting detail as distinct from the main point, matching the spine outcome's requirement to give main points in condensed, ordered form while distinguishing them from detail. Needs fresh-context review. Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked speaker attribution against the unit dialogue audio, production-prompt determinacy vs exact-match grading, matching_pairs discrimination, distractor validity, untaught tokens, YAML boolean coercion, learner-text jargon. Fixes: de.b1.unit49.lesson02.teach.felix_ausserdem speaker Felix -> Anna (in the dialogue and lesson03 anna_full_summary it is Anna, who read the article, who adds the breakfast detail; Felix then labels it nur ein Detail); media de.b1.audio.summary_ausserdem.neutral.01 voice_hint neutral_adult_male -> neutral_adult_female; lesson02.exercise03.listen_select_ausserdem prompt 'does Felix mention' -> 'does Anna mention'; lesson02.exercise06.write_felix_ausserdem prompt 'As Felix' -> 'As Anna' (internal content_keys containing felix_ausserdem left unchanged); lesson03.exercise06.write_full_summary_with_detail prompt dropped 'in your own words' (invited paraphrase that exact grading rejects) and pinned the detail frame to 'Außerdem erwähnt der Artikel, dass es ...'. NATIVE FLAG: lesson01 teaches 'Zusammenfassend lässt sich sagen, dass das Café jetzt auch Frühstück anbietet.' as a summary statement although lesson02/03 frame breakfast as only a detail -- consider making the zusammenfassend sentence carry the main point (opening hours). DEFERRED (owner decision): storyline canon spanning units 48-53 -- canon is Anna = Kellnerin, Felix Weber = Ingenieur (a1_unit18), but b1_unit48 has Anna planning her own cafe, unit 50 has Felix leading a second-location decision and unit 51 has Felix proposing 'dass wir früher schließen' (co-operator role), and unit 51's 'Wenn ich reich wäre, würde ich ein zweites Café eröffnen' is an unreal wish right after unit 50 plans a second location as a real project; needs a storyline decision before b1_unit52/53 consistency can be preserved."

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix. Teach Der Hauptpunkt ist, dass ... to name the main
    point of a summary, and Zusammenfassend lässt sich sagen, dass ... /
    Außerdem erwähnt der Artikel, dass ... to mark an additional detail as
    distinct from the main point, so the learner can summarize and retell
    content in condensed, ordered form while explicitly separating main
    points from supporting detail.

