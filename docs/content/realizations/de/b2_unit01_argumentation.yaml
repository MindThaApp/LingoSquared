    language: de
    text: >-
      Felix: Ich finde, dass Homeoffice besser ist, als im Büro zu
      arbeiten. Frau Vogel: Warum finden Sie das? Felix: Erstens spart man
      viel Pendelzeit, und Studien zeigen, dass man im Homeoffice
      produktiver ist. Frau Vogel: Andererseits vermisst man den Kontakt zu
      den Kollegen. Felix: Das stimmt, aber das ändert nichts daran, dass
      man Videoanrufe machen kann. Kurz gesagt, die Vorteile überwiegen.
      Frau Vogel: Da ist etwas dran.
    voice_hint: two_adults_neutral_friendly
