units:
  - content_key: de.b2.unit01.argumentation
    title: "Argumentation"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.argumentation.defend_a_position_with_evidence
    planned_lesson_count: 6

    lessons:
      - content_key: de.b2.unit01.lesson01.eine_position_vertreten
        title: "Eine Position vertreten"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: de.b2.unit01.lesson01.teach.homeoffice
            kind: vocabulary
            target: {text: "Homeoffice", language_code: de, direction: ltr}
            introduced_tokens: [Homeoffice]
            example: {text: "Homeoffice spart Zeit.", language_code: de, direction: ltr}
          - content_key: de.b2.unit01.lesson01.teach.im_buero_arbeiten
            kind: phrase
            target: {text: "im Büro arbeiten", language_code: de, direction: ltr}
            introduced_tokens: [im, Büro, arbeiten]
          - content_key: de.b2.unit01.lesson01.teach.eine_meinung
            kind: vocabulary
            target: {text: "eine Meinung", language_code: de, direction: ltr}
            introduced_tokens: [eine, Meinung]
            example: {text: "Ich habe eine klare Meinung.", language_code: de, direction: ltr}
          - content_key: de.b2.unit01.lesson01.teach.ich_finde_dass
            kind: phrase
            target: {text: "Ich finde, dass...", language_code: de, direction: ltr}
            introduced_tokens: [Ich, finde, dass]
          - content_key: de.b2.unit01.lesson01.teach.meiner_meinung_nach
            kind: phrase
            target: {text: "Meiner Meinung nach...", language_code: de, direction: ltr}
            introduced_tokens: [Meiner, nach]
          - content_key: de.b2.unit01.lesson01.teach.besser
            kind: vocabulary
            target: {text: "besser", language_code: de, direction: ltr}
            introduced_tokens: [besser]
            example: {text: "Diese Lösung ist besser.", language_code: de, direction: ltr}
          - content_key: de.b2.unit01.lesson01.teach.als
            kind: vocabulary
            target: {text: "als", language_code: de, direction: ltr}
            introduced_tokens: [als]
            example: {text: "Homeoffice ist besser als Pendeln.", language_code: de, direction: ltr}
          - content_key: de.b2.unit01.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Ich finde, dass Homeoffice besser ist, als im Büro zu arbeiten.", language_code: de, direction: ltr}
            introduced_tokens: [ist, zu]
          - content_key: de.b2.unit01.lesson01.teach.ich_stimme_dem_zu
            kind: phrase
            target: {text: "Ich stimme dem zu.", language_code: de, direction: ltr}
            introduced_tokens: [stimme, dem]
          - content_key: de.b2.unit01.lesson01.teach.grammar_position
            kind: grammar_note
            target: {text: "Ich finde, dass Homeoffice besser ist, als im Büro zu arbeiten. Meiner Meinung nach ist das besser.", language_code: de, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: de.b2.unit01.lesson01.exercise01.recognize_meinung
            type: multiple_choice
            tested_text: Meinung
            prompt: {target_blocks: [{text: Meinung, language_code: de, direction: ltr}]}
          - content_key: de.b2.unit01.lesson01.exercise02.listen_claim
            type: listen_select
            tested_text: "Ich finde, dass Homeoffice besser ist, als im Büro zu arbeiten"
            media_asset_key: de.b2.audio.argumentation.claim_homeoffice.01
            prompt: {target_blocks: []}
          - content_key: de.b2.unit01.lesson01.exercise03.match_claim_words
            type: matching_pairs
            tested_text: "Homeoffice im Büro arbeiten eine Meinung Ich finde dass Meiner Meinung nach besser als Ich stimme dem zu"
            prompt: {target_blocks: []}
            pairs:
              - {left: Homeoffice, right: "home office / working from home"}
              - {left: "im Büro arbeiten", right: "to work at the office"}
              - {left: "eine Meinung", right: "an opinion"}
              - {left: "Ich finde, dass...", right: "I think that..."}
              - {left: "Meiner Meinung nach...", right: "In my opinion..."}
              - {left: besser, right: better}
              - {left: als, right: than}
              - {left: "Ich stimme dem zu.", right: "I agree with it."}
          - content_key: de.b2.unit01.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Ich finde dass Homeoffice besser ist"
            prompt: {target_blocks: []}
            word_bank: [Ich, finde, dass, Homeoffice, besser, ist]
          - content_key: de.b2.unit01.lesson01.exercise05.translate_meiner_meinung_nach
            type: translation
            tested_text: "Meiner Meinung nach ist Homeoffice besser"
            prompt: {target_blocks: [{text: "In my opinion, home office is better.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit01.lesson01.exercise06.speak_stimme_zu
            type: speak_response
            tested_text: "Ich stimme dem zu"
            prompt: {target_blocks: [{text: "Say aloud in German: I agree with it.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit01.lesson01.exercise07.write_claim
            type: writing_prompt
            tested_text: "Ich finde, dass Homeoffice besser ist, als im Büro zu arbeiten"
            prompt: {target_blocks: [{text: "Write in German: I think that home office is better than working at the office.", language_code: en, direction: ltr}]}
          - content_key: de.b2.unit01.lesson01.exercise08.dictation_claim_homeoffice
            type: dictation
            tested_text: "Ich finde, dass Homeoffice besser ist, als im Büro zu arbeiten"
            media_asset_key: de.b2.audio.argumentation.claim_homeoffice.01
            prompt: {target_blocks: []}

      - content_key: de.b2.unit01.lesson02.gruende_und_belege_nennen
