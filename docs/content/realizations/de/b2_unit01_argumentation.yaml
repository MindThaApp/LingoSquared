generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is de's first
    B2 unit. Structural exemplar: the shipped nl B2 tier
    (docs/content/realizations/nl/b2_unit01_argumentatie.yaml) was used for
    unit/lesson/exercise SHAPE (lesson count, exercise-type pacing,
    matching-pair scale) only, per explicit task instruction -- no Dutch
    sentence was translated or consulted as source text; every German
    sentence was authored fresh. de's own established A1/B1 register and
    character (Felix Weber, Ingenieur, formal Sie workplace register) were
    consulted for voice continuity (docs/content/realizations/de/b1_*.yaml)
    -- this is de's OWN prior content, not a sibling-direction file, so
    consulting it does not violate sibling-isolation. Frau Vogel, Felix's
    established colleague (first introduced b1_unit52), continues here. No
    en-de sibling (de-en) overlay/realization was consulted.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    First German B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence): state a
    claim, support it with reasons/evidence, acknowledge the strongest
    opposing point, and rebut it without conceding. Theme: Homeoffice vs.
    Buero (working from home vs. the office) -- one coherent debatable
    everyday workplace issue across all six lessons, argued by Felix Weber
    and his established colleague Frau Vogel. Lesson arc mirrors the
    argument structure itself: L01 stating a claim (Ich finde, dass...,
    Meiner Meinung nach...), L02 supporting it (erstens/ausserdem/zum
    Beispiel/Studien zeigen, dass), L03 acknowledging the opposing point
    (einerseits ... andererseits / obwohl / natuerlich / das stimmt), L04
    rebutting without conceding (trotzdem / dagegen / aber / jedoch / das
    aendert nichts daran, dass / kurz gesagt), L05 an argumentative reading
    text (distinguish the author's claim from the objection answered), L06
    the culminating production -- a Felix/Frau Vogel debate for the
    listening requirement plus a speaking task and a writing task that each
    require a FULL argument (claim + support + acknowledged objection +
    rebuttal), not just connective drilling. Register: formal Sie
    throughout, matching the de lane's established workplace register
    (Felix and Frau Vogel, established colleagues, address each other
    formally per their b1_unit52 canon). All vocabulary is introduced
    self-contained within this file (B2 is a separate Course row from B1,
    so a B2 learner never sees B1 lexemes at runtime -- same
    self-containment precedent as de's B1 tier). No sibling-direction file
    was consulted. Priority checks for the fresh-context reviewer: (1)
    verb-final word order in every dass-clause and the "als + zu-infinitive"
    comparative in lesson01's claim; (2) whether "denn" (coordinating) vs
    "weil" (subordinating) are kept distinct and correctly ordered in
    lesson02; (3) the culminating writing exercise (lesson06 exercise06) is
    graded against a fixed multi-sentence string -- confirm the
    accepted-answer punctuation variants are complete enough that a correct
    learner is never marked wrong; (4) confirm "Homeoffice" used
    article-less as a general activity noun reads as natural current German
    (vs. "das Homeoffice" as a concrete noun), and that "ueberwiegen" used
    both transitively and absolutely (lesson04) is idiomatic.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked German accuracy, connective word order, register, prompt
    determinacy and accepted-answer completeness (grading is
    case/punctuation-insensitive), matching pairs, distractors,
    learner-visible grammar notes. Fixes:
    de.b2.unit01.lesson06.exercise05.speak_full_argument and
    lesson06.exercise06.write_full_argument prompts/instructions now
    name Ich finde, dass as a signpost and say 'I think that ...'
    (previously correct 'Ich finde, Homeoffice ist ...' / 'Meiner
    Meinung nach ...' answers were graded wrong); overlay accepted
    answers for both also take '... vermisst man die Kollegen manchmal
    ...' (umlaut + ASCII for the write task).
    de.b2.unit01.lesson03.exercise04.order_natuerlich_vermisst: added
    'Natürlich vermisst man die Kollegen manchmal' (the tiles build it;
    the compiler's alternative-order warning is expected).
    de.b2.unit01.lesson04.exercise07.write_kurz_gesagt: added the
    inverted 'Kurz gesagt überwiegen die Vorteile die Nachteile' (+ ue
    variant); lesson04.teach.kurz_gesagt note no longer implies
    inversion is wrong.
    de.b2.unit01.lesson05.exercise07.write_immer_mehr: added '...
    arbeiten von zu Hause' and '... arbeiten zu Hause'.
    de.b2.unit01.lesson05.exercise06.translate_ueberzeugt: added 'Ich
    bin überzeugt, dass das eine gute Entwicklung ist' (+ ue variant).
    de.b2.unit01.lesson04.teach.dagegen note corrected (dagegen follows
    the contrasted element zu Hause, not a subject). NATIVE FLAGS:
    lesson04 match_rebuttal_words pairs aber 'but' and jedoch 'however',
    which are near-synonyms (borderline confusable pair); article-less
    'Homeoffice' as a subject (vs 'das Homeoffice' / 'Arbeiten im
    Homeoffice'); lesson04 write_aendert_nichts 'dass die Freiheit
    überwiegt' may read oddly; lesson03 translate_obwohl -- 'schön' for
    'nice' is untaught and not accepted. DEFERRED: the orphaned
    b2_unit54_argumentation realization and en-de/b2_unit54 overlay (in
    no manifest) need an owner decision on deletion; untouched.

    Second-pass review 2026-10-19: 1 fix (realization side; overlay has
    the rest) — lesson05.exercise01-04
    (read_claim/read_objection/read_rebuttal/read_conclusion): the
    Kommentar text is now shown as the first de prompt.target_block (the
    questions asked about a text the learner never saw in the exercise).
    NATIVE FLAGS: as before (article-less Homeoffice; 'dass die Freiheit
    überwiegt').

course:
  realization_key: de.b2
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching
    the established de lane workplace register -- Felix Weber and Frau
    Vogel, established colleagues from the de B1 tier, address each other
    with Sie in every scene. B2 argumentation layers discourse connectives
    and signposting onto that register -- erstens, zum Beispiel, einerseits
    ... andererseits, trotzdem, jedoch, kurz gesagt -- while keeping the
    formal address consistent throughout.

