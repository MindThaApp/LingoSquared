      - content_key: de.c1.unit01.lesson06.der_vollstaendige_beitrag
        title: "Der vollständige Beitrag"
        spine_outcome_id: universal.c1.discourse.structure_extended_discourse
        teaching:
          - content_key: de.c1.unit01.lesson06.teach.frau_vogel_frage
            kind: dialogue
            target: {text: "Warum schlagen Sie ein papierloses Büro vor?", language_code: de, direction: ltr, speaker: "Frau Vogel"}
            introduced_tokens: [Warum, schlagen]
          - content_key: de.c1.unit01.lesson06.teach.beitrag_vollstaendig
            kind: dialogue
            target:
              text: >-
                Lassen Sie mich zunächst einen Vorschlag machen: Unser Büro
                soll papierlos werden. Zum einen sparen wir Zeit, konkret
                entfällt das mühsame Suchen in Aktenordnern. Zum anderen
                schützen wir die Umwelt, weil wir weniger drucken. Ich mache
                einen kleinen Exkurs: Einige Kollegen fürchten, dass digitale
                Dokumente unsicher sind, eine verständliche Sorge. Aber um
                auf meine Hauptthese zurückzukommen, gut verschlüsselte Daten
                sind nicht weniger sicher als Papier. Alles in allem bedeutet
                ein papierloses Büro weniger Zeitverlust und mehr
                Nachhaltigkeit.
              language_code: de
              direction: ltr
              speaker: Felix
            introduced_tokens: []
