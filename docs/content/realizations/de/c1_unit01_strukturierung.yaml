status: unreviewed
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation for German C1, the first C1 unit in the de lane
    (de has A1-B2 only; this is brand-new bug-class territory). No usable
    public-domain source was found: a firecrawl search confirmed the only
    verified public-domain German source is the FSI German Basic Course
    (US government work, fsi-language-courses.org), which caps at a basic /
    intermediate level and contains no advanced C1 extended-discourse
    material -- no public-domain advanced/C1 German discourse source exists.
    This is established-conventions-only authoring, built from general
    knowledge of German discourse-structure conventions. The shipped es C1
    unit01 (discurso_extenso) was used as the assigned structural exemplar
    for C1 pacing and exercise depth ONLY -- every word of actual German
    text is freshly authored, not translated from the Spanish, and the
    scenario is unrelated. Felix Weber and Frau Vogel continue as the
    established de B1/B2 colleagues (formal Sie workplace register, Felix
    an Ingenieur established a1_unit18; Frau Vogel his colleague first
    introduced b1_unit52); Felix delivers the sustained monologue. No
    sibling-direction file (de-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    First German C1 unit. Targets the CEFR C1 extended-discourse outcome
    (universal.c1.discourse.structure_extended_discourse): signpost the
    direction of a long contribution, develop linked points with a
    controlled digression and explicit return, and sustain cohesion so the
    listener or reader can follow the overall shape. Theme: das papierlose
    Buero (going paperless in the office) -- one coherent workplace proposal
    sustained across all six lessons. Lesson arc mirrors the discourse
    structure itself: L01 announcing the direction (Lassen Sie mich
    zunaechst, Zuerst ... dann, im Grossen und Ganzen), L02 developing
    linked points (zum einen ... zum anderen, konkret, das heisst, darueber
    hinaus), L03 making a bounded digression (ich mache einen kleinen
    Exkurs, einige Kollegen fuerchten, dass, eine verstaendliche Sorge), L04
    returning explicitly (um auf meine Hauptthese zurueckzukommen, gut
    verschluesselt, nicht weniger sicher als), L05 sustaining reference and
    synthesizing (dieser Vorschlag, alles in allem, zusammenfassend), L06
    the culminating production -- a full Felix monologue for the listening
    requirement plus a speaking task and a writing task that each require
    the complete structured contribution, not just signpost drilling.
    Register: formal Sie throughout, matching the de lane's established
    workplace register (Felix and Frau Vogel, established colleagues,
    address each other formally per their b1_unit52/b2 canon). All
    vocabulary is introduced self-contained within this file (C1 is a
    separate Course row from B2, so a C1 learner never sees B1/B2 lexemes
    at runtime). Priority checks for the fresh-context reviewer: (1) formal
    Sie is consistent throughout and never slips into du; (2) the
    culminating monologue (lesson06) is graded against a fixed
    multi-sentence string -- confirm the accepted-answer punctuation
    variants are complete enough that a correct learner is never marked
    wrong; (3) the listening exercise (lesson06) and every dictation match
    their bound audio asset sentence-for-sentence; (4) confirm "das
    muehsame Suchen in Aktenordnern", "gut verschluesselte Daten sind
    nicht weniger sicher als Papier", and "ein papierloses Buero" read as
    natural current German.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    realization + en-de overlay for answer completeness,
    audio/tested_text/accepted-answer mirrors, example/gloss alignment,
    register (formal Sie throughout), and orthography. Fix: capitalized the
    complete sentence after a colon per standard orthography (Duden) --
    'machen: unser Büro soll ...' -> 'machen: Unser Büro soll ...' and
    'Exkurs: einige Kollegen ...' -> 'Exkurs: Einige Kollegen ...' in media
    assets beitrag.01 and exkurs.01 (pending_generation; case-only), teach
    richtung/exkurs/beitrag_vollstaendig, and the tested_text of
    lesson01.exercise07, lesson03.exercise02/07 and lesson06.exercise05/06,
    mirrored in the overlay. Grading casefolds, so this was a model-text
    defect only. NATIVE FLAGS: (a) 'Aber um auf meine Hauptthese
    zurückzukommen, gut verschlüsselte Daten sind nicht weniger sicher als
    Papier' -- um-zu comment clause followed by an uninverted V2 clause is
    common in speech, but a C1 model may be better as '..., sind gut
    verschlüsselte Daten ...' or with a colon; used verbatim in 6+ places
    (audio, teach, tested_text, overlay answers), so any change must be
    coordinated. (b) 'Ich mache einen kleinen Exkurs' is understandable;
    'Erlauben Sie mir einen kleinen Exkurs' is the more idiomatic formal
    signpost (not a defect). DEFERRED: none.

    Second-pass review 2026-10-19: 4 fixes --
    lesson06.exercise02.lese_struktur: the reading question about Felix's full
    contribution showed no text; the full German contribution is now a de
    target_block before the question; lesson03.exercise07.write_exkurs: prompt
    printed 9 of the 13 answer words (answer leak) -> 'using the digression
    signpost taught in this lesson and the verb fürchten';
    lesson04.exercise06.speak_rueckkehr / exercise07.write_rueckkehr: prompt
    printed 9 of 15 answer words -> 'using the return signpost taught in this
    lesson' (overlay mirrored; overlay now also accepts the standard inverted
    '..., sind gut verschlüsselte Daten ...' form). NATIVE FLAGS: the model
    sentence 'Aber um auf meine Hauptthese zurückzukommen, gut verschlüsselte
    Daten sind ...' (uninverted main clause) is kept verbatim in
    audio/teach/tested_text; consider switching the model to the inverted
    form.

course:
  realization_key: de.c1
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching
    the established de lane workplace register -- Felix Weber and Frau
    Vogel, established colleagues from the de B1/B2 tiers, address each
    other with Sie in every scene. C1 layers extended-discourse structure
    onto that register -- Lassen Sie mich zunaechst, zum einen ... zum
    anderen, konkret, ich mache einen kleinen Exkurs, um auf meine
    Hauptthese zurueckzukommen, alles in allem -- while keeping the formal
    address consistent throughout and never switching to informal du.

