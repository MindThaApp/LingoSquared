  - content_key: de.c1.audio.strukturierung.preview.01
    language: de
    text: "Lassen Sie mich zunächst einen Vorschlag machen."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: de.c1.audio.strukturierung.punkt.01
    language: de
    text: "Zum einen sparen wir Zeit, konkret entfällt das mühsame Suchen in Aktenordnern."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: de.c1.audio.strukturierung.exkurs.01
    language: de
    text: "Ich mache einen kleinen Exkurs: Einige Kollegen fürchten, dass digitale Dokumente unsicher sind."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: de.c1.audio.strukturierung.beitrag.01
    language: de
    text: >-
      Lassen Sie mich zunächst einen Vorschlag machen: Unser Büro soll
      papierlos werden. Zum einen sparen wir Zeit, konkret entfällt das
      mühsame Suchen in Aktenordnern. Zum anderen schützen wir die Umwelt,
      weil wir weniger drucken. Ich mache einen kleinen Exkurs: Einige
      Kollegen fürchten, dass digitale Dokumente unsicher sind, eine
      verständliche Sorge. Aber um auf meine Hauptthese zurückzukommen, gut
      verschlüsselte Daten sind nicht weniger sicher als Papier. Alles in
      allem bedeutet ein papierloses Büro weniger Zeitverlust und mehr
      Nachhaltigkeit.
    voice_hint: neutral_adult_thoughtful
    status: pending_generation

