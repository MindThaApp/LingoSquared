        teaching:
          - {"content_key": "de.a2.unit110.lesson06.teach.anna_frage", "kind": "dialogue", "target": {"text": "Was machst du morgen früh?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Was", "machst", "du", "morgen", "früh"]}
