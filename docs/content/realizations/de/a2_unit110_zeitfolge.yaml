          - {"content_key": "de.a2.unit110.lesson06.exercise02.verstehen_einkaufen", "type": "dialogue_comprehension", "tested_text": "Nachdem ich gearbeitet habe gehe ich einkaufen", "prompt": {"target_blocks": [{"text": "What does Felix do after work?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "de.a2.audio.dialogue.zeitfolge.01"}
          - {"content_key": "de.a2.unit110.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Was machst du morgen früh Zuerst dusche ich dann frühstücke ich Und bevor du zur Arbeit gehst Bevor ich gehe rufe ich dich an Nachdem ich gearbeitet habe gehe ich einkaufen Wenn du fertig bist komme ich vorbei", "prompt": {"target_blocks": []}, "pairs": [{"left": "Was machst du morgen früh?", "right": "What are you doing tomorrow morning?"}, {"left": "Zuerst dusche ich, dann frühstücke ich.", "right": "First I shower, then I have breakfast."}, {"left": "Und bevor du zur Arbeit gehst?", "right": "And before you go to work?"}, {"left": "Bevor ich gehe, rufe ich dich an.", "right": "Before I leave, I'll call you."}, {"left": "Nachdem ich gearbeitet habe, gehe ich einkaufen.", "right": "After I have worked, I go shopping."}, {"left": "Wenn du fertig bist, komme ich vorbei.", "right": "When you are done, I'll come by."}]}
          - {"content_key": "de.a2.unit110.lesson06.exercise04.ordnen_anrufen", "type": "word_order", "tested_text": "Bevor ich gehe rufe ich dich an", "prompt": {"target_blocks": []}, "word_bank": ["an", "dich", "ich", "rufe", "gehe", "ich", "Bevor"]}
          - {"content_key": "de.a2.unit110.lesson06.exercise05.antwort_morgen", "type": "dialogue_response", "tested_text": "Zuerst dusche ich dann frühstücke ich", "prompt": {"target_blocks": [{"text": "Was machst du morgen früh?", "language_code": "de", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit110.lesson06.exercise06.uebersetzen_arbeit", "type": "translation", "tested_text": "Nachdem ich gearbeitet habe gehe ich einkaufen", "prompt": {"target_blocks": [{"text": "After I have worked, I go shopping.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit110.lesson06.exercise07.schreiben_dreisaetze", "type": "writing_prompt", "tested_text": "Ich frühstücke bevor ich zur Arbeit gehe Ich gehe einkaufen nachdem ich gearbeitet habe Ich bleibe zu Hause wenn es regnet", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences: (1) say you have breakfast before you go to work, using 'bevor'; (2) say you go shopping after you have worked, using 'nachdem'; (3) say you stay at home when it rains, using 'wenn'.", "language_code": "en", "direction": "ltr"}]}}
