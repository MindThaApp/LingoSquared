          - {"content_key": "de.a2.unit110.lesson06.teach.felix_anrufen", "kind": "dialogue", "target": {"text": "Bevor ich gehe, rufe ich dich an.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Bevor", "ich", "gehe", "rufe", "dich", "an"]}
          - {"content_key": "de.a2.unit110.lesson06.teach.anna_nachdem", "kind": "dialogue", "target": {"text": "Super! Und nachdem du gearbeitet hast?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Super", "Und", "nachdem", "du", "gearbeitet", "hast"]}
          - {"content_key": "de.a2.unit110.lesson06.teach.felix_einkaufen", "kind": "dialogue", "target": {"text": "Nachdem ich gearbeitet habe, gehe ich einkaufen.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Nachdem", "ich", "gearbeitet", "habe", "gehe", "einkaufen"]}
          - {"content_key": "de.a2.unit110.lesson06.teach.anna_vorbei", "kind": "dialogue", "target": {"text": "Gut. Wenn du fertig bist, komme ich vorbei.", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Gut", "Wenn", "du", "fertig", "bist", "komme", "ich", "vorbei"]}
        exercises:
