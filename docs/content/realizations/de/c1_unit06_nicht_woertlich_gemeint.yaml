review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Sixth German C1 unit. Targets
    universal.c1.idiom.use_idiomatic_and_figurative_language (understand and
    use idiomatic, collocational, and figurative language naturally, choosing
    register-appropriate idioms and avoiding literal calques). Theme: Felix
    Weber's draft status report is full of literal English calques, and Frau
    Vogel helps him rewrite it into natural idiomatic German -- they use
    idioms and collocations to talk about the project, and she flags one
    informal idiom that has no place in formal Sie register. The lesson arc
    mirrors the outcome's four assessment requirements: L01 idioms (literal
    vs. figurative meaning), L02 strong collocations (the fixed verb-noun
    pairings English calques break), L03 figurative language plus the
    informal-vs-formal register contrast, L04 reading (interpret how each
    idiom/metaphor/collocation contributes meaning and tone),
    L05 speaking (describe a situation using two taught idioms), L06 the
    culminating full delivery -- listening (interpret idioms in a natural
    exchange), writing (rewrite literal calques as natural German), and a
    dictation. Register: formal Sie throughout. Priority checks for the
    fresh-context reviewer: (1) formal Sie is consistent and never slips into
    du; (2) the informal register contrast (Das ist nicht mein Bier vs. the
    formal das faellt nicht in meinen Zustaendigkeitsbereich) is taught
    explicitly, not silently mixed; (3) every idiom is one a formal-Sie
    speaker would actually use (no du-only idiom smuggled in as neutral);
    (4) the calque-rewrite writing exercises each have exactly one correct
    answer that uses the taught collocation; (5) the dictation and the
    dialogue cards match their bound audio; (6) every tested word is traced
    to an earlier teaching card that genuinely displays it.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    formal Sie (no du slips), register contrast, dialogue cards and dictation
    vs bound audio (match), accepted-answer coverage, YAML booleans, learner-
    visible jargon. Fixes (realization + en-de overlay):
    lesson05.exercise05.speak_spiel_weichen and
    lesson05.exercise07.write_spiel_weichen -- instruction now pins the
    connector ('linking the two parts with deshalb') in both copies, and In
    diesem Projekt ... variants accepted; every 'You hit the nail on the head'
    / 'You are giving a presentation' prompt (lesson01.exercise05/06,
    lesson02.exercise06, lesson04.exercise05/06, lesson05.exercise06,
    lesson06.exercise05) now says 'addressing the person formally with Sie' in
    both copies; lesson04.exercise05.translate_lesen -- accepted Nächste Woche
    halten Sie einen Vortrag and Sie werden nächste Woche einen Vortrag
    halten; lesson06.exercise05.write_kalque_vortrag -- accepted Mit diesem
    Beispiel haben Sie den Nagel auf den Kopf getroffen. ...;
    lesson03.exercise05.translate_spiel and
    lesson06.exercise06.write_kalque_massnahmen -- accepted In diesem Projekt
    steht viel auf dem Spiel; lesson01.exercise05/06 and lesson04.exercise06
    -- accepted present Sie treffen and Präteritum Sie trafen den Nagel auf
    den Kopf (English 'You hit' is tense-ambiguous). NATIVE FLAGS: none open.
    DEFERRED: none.

course:
  realization_key: de.c1
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching the
    established de lane workplace register -- Felix Weber and Frau Vogel,
    established colleagues from the de B1/B2 tiers, address each other with
    Sie in every scene. C1 idiomatic language layers register-appropriate
    idioms and strong collocations onto that register: every idiom taught
    here is one a formal-Sie speaker would actually use in a meeting, and the
    single informal-register contrast (Das ist nicht mein Bier vs. the formal
    das faellt nicht in meinen Zustaendigkeitsbereich) is taught explicitly
    rather than silently mixed, never slipping into du.

