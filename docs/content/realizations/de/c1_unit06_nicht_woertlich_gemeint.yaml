    is de C1 unit05 (same tier, same lesson/exercise pacing, same formal-Sie
    register policy); every word of actual German text is freshly authored,
    not translated from any sibling file, and the scenario is unrelated.
    Felix Weber (Ingenieur, established a1_unit18) and Frau Vogel (his
    colleague, first introduced b1_unit52) continue their formal-Sie
