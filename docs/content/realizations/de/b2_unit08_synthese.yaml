            example: {text: "Ich vergleiche zwei Quellen.", language_code: de, direction: ltr}
          - content_key: de.b2.unit08.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Laut einer Studie ist Homeoffice produktiver.", language_code: de, direction: ltr}
            introduced_tokens: []
          - content_key: de.b2.unit08.lesson01.teach.grammar_quelle
            kind: grammar_note
            target: {text: "Laut einer Studie ist Homeoffice produktiver. Diese Quelle ist zuverlässig.", language_code: de, direction: ltr}
