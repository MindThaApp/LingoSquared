review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Eighth German B2 unit; first and capstone synthesis unit. Targets the
    CEFR B2 synthesis outcome (universal.b2.synthesis.summarize_and_
    evaluate_multiple_sources): combine information from more than one
    source into a coherent summary, note where the sources agree or
    conflict, and give a reasoned judgement about them. Theme: Felix has
    read two studies about home-office productivity that agree on one
    point but conflict on another, and synthesizes them for Frau Vogel.
    Lesson arc: L01 comparing sources (die Quelle, laut, eine Studie,
    vergleichen); L02 identifying agreement between sources
    (übereinstimmen, Beide Quellen stimmen überein, dass..., genauso
    wie); L03 identifying conflict between sources (widersprechen, Im
    Gegensatz dazu..., wohingegen, loben/kritisieren); L04 evaluating a
    source's credibility (glaubwürdig, überzeugender, besser belegt,
    beweisen); L05 a reading requirement -- two short study summaries
    (Quelle A / Quelle B) that agree on one point and conflict on
    another, with different sample sizes; L06 the culminating production
    -- a Felix/Frau Vogel dialogue for the listening requirement (Felix
    presents his synthesis), a speaking task presenting a synthesis with
    a reasoned judgement, and a writing task doing the same in writing.
    Register: formal Sie throughout, matching the established de lane
    workplace register. Vocabulary is introduced within this file OR
    carried forward from de.b2.unit01-07 (same course row). No
    sibling-direction file was consulted. Priority checks for the
    fresh-context reviewer: (1) confirm the two studies' claims and
    sample sizes (Quelle A: produktiver, befragte tausend Personen;
    Quelle B: Zusammenarbeit verschlechtert sich, befragte nur fünfzig
    Personen) are stated IDENTICALLY in lesson05's reading and lesson06's
    dialogue -- no cross-lesson fact drift (AUTHORING_GUIDE §11); (2)
    confirm "sie" (lowercase, she/it, referring to die Quelle, feminine)
    in lesson04's claim_model is unambiguous in context and not
    confusable with capitalized Sie; (3) the culminating writing
    exercise's accepted-answer punctuation/umlaut-ASCII variants are
    complete; (4) that this unit correctly closes the B2 tier -- confirm
    no further units are implied or required by the spine.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    realization + en-de overlay for answer completeness (word_order tile
    permutations, translate/speak/write variants), example/gloss alignment,
    cross-lesson fact consistency (Quelle A tausend/produktiver, Quelle B
    fünfzig/Zusammenarbeit), register, and notes. All fixes were
    overlay-side (see overlay notes): accepted variants added for
    lesson01.exercise04/05/07 (Homeoffice ist laut einer Studie
    produktiver), lesson05.exercise06 (... sind weniger abgelenkt),
    lesson05.exercise07 (Die Zusammenarbeit verschlechtert sich),
    lesson06.exercise05/06 (dass die Zusammenarbeit sich verschlechtert);
    lesson02.teach.zeitersparnis example_gloss corrected. No realization
    text changed. NATIVE FLAGS: (a) lesson06 dialogue 'Meiner Meinung nach
    die erste, weil sie besser belegt ist: Sie befragte tausend Personen' --
    capital Sie after the colon is orthographically right but means 'it'
    (the source), while lesson04's note tells learners capitalized Sie is
    formal 'you'; consider a period/dash plus 'Diese befragte ...' (would
    need audio + dialogue + feedback mirrors changed together). (b) the
    notes say the sources agree on one point, but the lesson05 Quelle A/B
    reading never states the shared time-saving point (only the lesson06
    dialogue does); no exercise grades it against the reading, so coherence
    gap only. DEFERRED: none.

    Second-pass review 2026-10-19: 1 fix -- lesson05.exercise01-04
    (read_claim_a/read_claim_b/read_conflict/read_sample_size): neither
    study text was shown -> both texts (labelled Quelle A / Quelle B,
    matching the questions) added as the first target_blocks.

course:
  realization_key: de.b2
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching
    the established de lane workplace register -- Felix Weber and Frau
    Vogel, established colleagues, address each other with Sie in every
    scene. B2 synthesis layers source-comparison and evaluation language
    onto that register -- laut einer Studie, beide Quellen stimmen
    überein, dass, im Gegensatz dazu, besser belegt -- while keeping the
    formal address consistent throughout.

