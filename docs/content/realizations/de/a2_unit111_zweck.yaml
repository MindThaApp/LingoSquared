          - {"content_key": "de.a2.unit111.lesson06.exercise06.uebersetzen_markt", "type": "translation", "tested_text": "Ich gehe zum Supermarkt um Brot zu kaufen", "prompt": {"target_blocks": [{"text": "I'm going to the supermarket to buy bread.", "language_code": "en", "direction": "ltr"}]}}
