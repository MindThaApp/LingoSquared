review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    First German (de) unit for this project -- opens the en<->de path.
    Follows the established Latin-script unit01 pattern (no script-ramp
    lesson needed, matching nl's approach; contrast fa/prs's script-intro
    lesson01 for non-Latin scripts). Scoped to exactly one spine outcome
    (universal.a1.greetings.open_close_exchange) across all 5 lessons per
    AUTHORING_GUIDE §1 -- introductions (names/identity) is deliberately
    left for a future unit02, not folded in here (unlike es/fr's own
    unit01, which combined both outcomes; this unit follows fa's cleaner
    one-outcome-per-unit precedent instead). Establishes a fresh
    Anna/Felix storyline (new apartment-building neighbors meeting for
    the first time) -- not reusing any other language's character names,
    since this is a genuinely new course direction. The Sie/du
    formal-informal distinction (a real German A1 grammar point with no
    direct English equivalent) is taught explicitly in lesson03 and
    exercised throughout; the neighbors use Sie with each other
    throughout lesson05's dialogue since they've just met (realistic
    register choice for strangers in German, not yet on du-terms).
    lesson04's "Bitte" is taught with its genuine dual sense (please /
    you're welcome) rather than oversimplified to one meaning, per
    AUTHORING_GUIDE §3's "don't overstate absolute rules." No
    fill_in_blank exercises -- a bare "Guten ___" blank would be
    genuinely ambiguous among Morgen/Tag/Abend with nothing in the frame
    to disambiguate which time of day is meant (AUTHORING_GUIDE §17),
    so multiple_choice/word_order/dialogue_response cover this vocabulary
    instead. lesson05's matching_pairs pools 9 distinct greeting/
    farewell/politeness words from across the whole unit, within
    AUTHORING_GUIDE §16's 6-12 target. Every multi-clause accepted-answer
    concern was checked at authoring time (no two-clause answers needing
    period/comma/conjunction variants arose -- every phrase here is a
    single clause). Compiled and validated against the real compiler
    (scripts/compile_content.py) to confirm every exercise's tested_text
    is fully covered by this file's own cumulative introduced_tokens. A
    fresh-context review (Codex was usage-exhausted; a no-prior-context
    subagent ran the equivalent review) found and this fixed: (1) many
    exercises' own prompt.target_blocks hardcoded an English-language
    instruction question, duplicating the overlay's instruction field --
    harmless for this unit's only current overlay (en-de, source=English)
    but wrong in principle, since a realization must stay source-agnostic
    (a hypothetical future fr-de or es-de overlay would have inherited
    stale hardcoded English). Every affected target_blocks emptied to []
    (or, where a real target-language cue adds value for a dialogue_
    response/speak_response exercise, replaced with actual German cue
    text instead of English). (2) de.a1.audio.guten_abend.neutral.01 was
    declared but never referenced -- added lesson01.exercise07.
    listen_evening to use it. (3) lesson05's dialogue had Felix close
    with "Tschüss, bis bald!" (casual) despite the unit just having
    established that Anna and Felix, as strangers who've just met, use
    the formal Sie register throughout -- changed to "Auf Wiedersehen,
    bis bald!" for consistency (lesson02's own reply_casual_farewell
    exercise, a genuinely different friend-context scenario, correctly
    keeps Tschüss). (4) lesson03's exercise01/02 (choose_formal_pronoun/
    choose_informal_pronoun) had Ihnen/dir as distractors for a
    nominative-form question, but both are also genuinely correct
    formal/informal "you" forms (dative case) given the instruction
    never restricted to the subject form -- swapped for unrelated
    distractors. (5) lesson03.exercise08's accepted_answers was missing
    the comma+"und" variant its sibling exercise07 (identical content)
    already had per §12 -- added. Re-validated and re-compiled clean (0
    errors/0 warnings) after every fix. Still pending an actual human
    (or Codex, once usage resets) reviewer per standard governance --
    this AI review does not itself satisfy §9.

    2026-07-07 §19 retrofit: added `example:` to all 5 kind:vocabulary
    cards (hallo, tschuss, danke, bitte, entschuldigung), each a
    genuinely natural sentence a speaker would say, not a dictionary
    frame. "bitte" got a 2-sentence list to demonstrate both its
    real, standard senses (please / you're welcome) distinctly, since
    the overlay's own note already flags this genuine dual meaning.
    Reused already-established vocabulary where natural (Felix as a
    transparent proper noun; "bis bald" from the same lesson).
    schema_version bumped to 1.1, locking the rule in for this file.

course:
  realization_key: "de.a1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch), not Swiss/Austrian regionalisms (no Grüß Gott/Servus in this introductory unit). Sie (formal 'you') and du (informal 'you') are a new grammatical distinction with no direct English equivalent -- introduce it explicitly rather than assuming learners already grasp it, and keep the two registers clearly separated in every exercise."

