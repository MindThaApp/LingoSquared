      Felix: Ich habe einen Entwurf, aber er klingt zu scharf. Die Lieferung
      ist schon wieder zu spät. Das kann so nicht weitergehen. Frau Vogel:
      Das ist deutlich, aber für eine Nachricht zu direkt. Felix: Ich würde
      vorschlagen, es diplomatischer zu formulieren. Wir wären Ihnen dankbar,
