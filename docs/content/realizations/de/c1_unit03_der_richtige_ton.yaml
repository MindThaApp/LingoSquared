review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Third German C1 unit. Targets
    universal.c1.register.control_tone_and_register_precisely (fine-grained
    control of tone and register, shifting between formal, diplomatic,
    ironic, and emphatic styles to suit audience and intent): the same core
    message -- the delivery is late again -- delivered in four registers,
    with the register variation carried lexically and prosodically, never by
    switching T/V. Theme: a supplier (Lieferant) has delivered late again,
    and Felix Weber and Frau Vogel choose HOW to say it. The lesson arc
    mirrors the outcome's four assessment requirements: L01 the
    formal/bureaucratic register (Sehr geehrte Damen und Herren, Bezug
    nehmend auf, fristgerecht, nicht fristgerecht eingegangen, Wir bitten um
    Verständnis), L02 the diplomatic/hedged register (Ich fürchte, später
    als vereinbart, Ich würde vorschlagen, Es wäre vielleicht sinnvoll, Wir
    wären Ihnen dankbar, gegebenenfalls), L03 the emphatic/direct register
    (Das ist inakzeptabel, Das kann so nicht weitergehen, Das kann doch
    nicht Ihr Ernst sein, schon wieder, zu spät), L04 reading and tone
    recognition -- compare the same goal expressed in different tones and
    read the register onto each sentence (read_tone_and_register), L05 the
    tone shift -- say the SAME message for two contrasting audiences, first
    diplomatically, then emphatically (shift_tone_precisely), L06 the
    culminating full exchange covering all four requirements -- listening
    (distinguish the tone of the dialogue turns), reading (match sentences
    to tone labels), speaking (shift the same message between registers),
    writing (rewrite the blunt draft in both a diplomatic and an emphatic
    version, rewrite_for_tone), and a dictation. Register: formal Sie
    throughout; the register variation is lexical/prosodic (bureaucratic vs
    conversational, blunt vs diplomatic, ironic understatement, emphatic
    Ausrufe) and never slips into du. Priority checks for the fresh-context
    reviewer: (1) formal Sie is consistent, including inside the blunt and
    ironic lines; (2) each register example reads as what a native
    formal-register German workplace speaker would actually write or say in
    that tone, not machine-translated; (3) the culminating speaking and
    writing exercises (lesson06) require BOTH registers of the same message,
    not one; (4) the dictation and every listen_select/dialogue_comprehension
    match their bound audio asset sentence-for-sentence; (5) the two
    dialogue-comprehension exercises in lesson06 agree with each other and
    with the bound audio on what each speaker actually says.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    course-scoped compile, YAML booleans, jargon/AI leaks, character canon,
    note accuracy, matching discriminability, prompt determinacy and accepted-
    answer completeness for unit03 realization + en-de overlay. Fixes:
    de.c1.unit03.lesson05.exercise06 and lesson06.exercise05
    speak_ton_wechseln prompt + instruction were underdetermined -> now name
    the forms (Ich fuerchte ... spaeter als vereinbart / schon wieder zu
    spaet) and give the English of both messages;
    de.c1.unit03.lesson04.exercise01.read_diplomatische_nachricht now shows
    the German message as a de target_block (it was never displayed) and the
    question no longer gives away the recipient ('Who is this message for, and
    what is its effect?', instruction mirrored);
    de.c1.unit03.lesson04.exercise05/06 (translate_ironisch, speak_ironisch)
    'wonderfully yet again' -> 'wonderfully again' and 'Na, das hat ja schon
    wieder wunderbar geklappt' (+period) accepted;
    de.c1.unit03.lesson06.exercise04.match_austausch confusable
    diplomatisch/nachdruecklich pairs replaced by der Entwurf=the draft,
    scharf=harsh (tested_text + accepted_answers updated);
    de.c1.unit03.lesson04.exercise03.match_toene confusable diplomatisch pair
    replaced by die Bestellung=the order (taught lesson01; reviewer's
    hoeflich=polite rejected as still confusable with the diplomatic register
    sentence); de.c1.unit03.lesson01.teach.sehr_geehrte_damen_und_herren note
    removed the false capital-S and never-spoken claims;
    de.c1.unit03.lesson03.teach.das_kann_so_nicht_weitergehen note corrected
    (after a modal weitergehen stays together; it separates only as finite
    verb); de.c1.unit03.lesson04.exercise07.write_diplomatisch was a duplicate
    of lesson02.exercise07 -> now an emphatic production 'Die Lieferung ist
    schon wieder zu spaet. Das kann so nicht weitergehen' (+period, ascii)
    with new instruction/feedback; content_key kept unchanged for progress
    stability. NATIVE FLAGS: lesson06 'Das ist deutlich, aber fuer eine
    Nachricht zu direkt' sounds unidiomatic and Felix's closing irony follows
    Frau Vogel's approval (would need the austausch.01 audio text changed
    too); 'Bezug nehmend auf ... ist die Lieferung ... eingegangen' dangling
    participle (authentic officialese); lesson01 exercise05/06 pluperfect 'war
    ... eingegangen' graded wrong; lesson03 exercise05/06 'verspaetet' graded
    wrong. DEFERRED: none.

course:
  realization_key: de.c1
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching the
    established de lane workplace register -- Felix Weber and Frau Vogel,
    established colleagues from the de B1/B2 tiers, address each other with
    Sie in every scene. The register variation in THIS unit is lexical and
    prosodic, not a T/V switch: the same core message (the delivery is late
    again) is delivered in a bureaucratic register (Bezug nehmend auf die
    Bestellung ist die Lieferung erneut nicht fristgerecht eingegangen), a
    diplomatic hedged register (Ich fürchte, die Lieferung kommt wieder
    später als vereinbart; Wir wären Ihnen dankbar, wenn Sie uns mitteilen
    könnten), an emphatic direct register (Die Lieferung ist schon wieder zu
    spät; Das kann so nicht weitergehen), and an ironic register (Na, das
    hat ja wieder wunderbar geklappt) -- all in the same formal Sie address,
    never slipping into du.

