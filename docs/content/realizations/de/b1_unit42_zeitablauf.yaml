  - content_key: "de.b1.audio.dialogue.zeitablauf_cafe.01"
    language: "de"
    text: >-
      Felix: Wenn ich Pause habe, trinke ich immer Kaffee. Anna: Ich auch!
      Als ich gestern Pause hatte, kam mein Bruder vorbei. Felix: Wirklich?
      Das ist schön.
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

