review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Eighth de B1 unit. Uses Anna (Kellnerin, established a1_unit18) and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-41), continuing the cafe/hike storyline. Formal Sie throughout, matching the de-en lane register pin. Teaches wenn for a habitual/repeated present time clause versus als for a single completed past event, distinguishing the two per the spine outcome's own wording. Needs fresh-context review."}

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix, matching the established acquaintance-register
    precedent from a1_unit18 and the de-en lane pin. Teach wenn as a
    habitual/repeated present-tense time clause ("whenever X happens, Y
    happens"), then contrast it with als marking a single, one-time
    completed past event ("when X happened [once], Y happened"), keeping
    the two connectors clearly distinguished by tense and repeatability.

