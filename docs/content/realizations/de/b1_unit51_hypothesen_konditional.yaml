  notes: "Third unit of the de B1 completion wave (units 49-53). Uses Anna (Kellnerin, established a1_unit18) and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-50). Distinct from unit37 (universal.b1.hypotheticals.express_hypothetical_conditions, wenn + Konjunktiv II + würde for hypothetical results): this unit teaches the same wenn + Konjunktiv II + würde construction for personal wishes about Anna's own life, AND additionally teaches würde used ALONE (no if-clause) to soften a suggestion or preference, matching the new spine outcome's explicit second requirement. All new sentences and vocabulary are distinct from unit37's dialogue content. Formal Sie throughout. Needs fresh-context review. Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked production-prompt determinacy vs exact-match grading, distractor validity against the lesson dialogue, matching_pairs discrimination, untaught tokens, YAML boolean coercion, learner-text jargon. Fixes: de.b1.unit51.lesson02.exercise06.write_felix_vorschlagen and lesson03.exercise06.write_full_hypothesis_and_suggestion prompts 'you would suggest closing earlier' -> 'you would suggest that we close earlier' (pins the dass-clause subject wir; 'dass das Café früher schließt' was a correct answer graded wrong). Overlay-side distractor fixes recorded in the en-de overlay note. NATIVE FLAG: lesson02.exercise01 distractor 'Ich schlage vor, dass wir früher schließen.' is a near-valid rendering of 'I would suggest ...'; kept because the prompt's 'would' targets the würde form -- native call. DEFERRED (owner decision): storyline canon spanning units 48-53 -- canon is Anna = Kellnerin, Felix Weber = Ingenieur (a1_unit18), but b1_unit48 has Anna planning her own cafe, unit 50 has Felix leading a second-location decision and unit 51 has Felix proposing 'dass wir früher schließen' (co-operator role), and unit 51's 'Wenn ich reich wäre, würde ich ein zweites Café eröffnen' is an unreal wish right after unit 50 plans a second location as a real project; needs a storyline decision before b1_unit52/53 consistency can be preserved."

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix. Teach wenn + Konjunktiv II (hätte/wäre) + würde for a
    hypothetical wish and its conditional result, then teach würde used
    ALONE, without any wenn-clause, to soften a suggestion or a
    preference, so the learner can both state a full hypothetical and use
    the conditional mood on its own to soften what they say.

