course:
  realization_key: de.c1
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching the
    established de lane workplace register -- Felix Weber and Frau Vogel,
    established colleagues from the de B1/B2/C1 tiers, address each other and
    the Geschäftsleitung with Sie in every scene. This unit is explicitly
    about persuasion and rhetoric, and a formal Sie-register persuasive appeal
    (Felix making his case to the management board) is the natural fit for the
    lane -- no register shift to du is needed or intended, unlike the nl/es
    tiers where persuasion sometimes shifted address forms. The rhetorical
    toolkit (rhetorische Frage, Parallelismus, Betonung, Appell) is layered
    onto that formal register throughout.

