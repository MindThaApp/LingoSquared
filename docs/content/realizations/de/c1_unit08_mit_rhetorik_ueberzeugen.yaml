review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Eighth German C1 unit. Targets
    universal.c1.persuasion.persuade_with_rhetorical_devices (persuade an
    audience using rhetorical devices -- rhetorical questions, parallelism,
    emphasis, and appeals -- modulating stance and intensity). Theme: Felix
    Weber must persuade the Geschäftsleitung to approve a six-month testing
    phase rather than launch the new feature prematurely, using all four
    devices. The lesson arc mirrors the outcome's four assessment requirements:
    L01 the four devices by name (rhetorische Frage, Parallelismus, Betonung,
    Appell, überzeugen, Publikum), L02 rhetorical questions (riskieren,
    wirklich, die Wahl), L03 parallelism (gründlich testen, Vertrauen
    gewinnen, schnell starten, Fehler in Kauf nehmen), L04 emphasis and appeal
    (Gerade jetzt, kommt es auf ... an, appellieren an, die Verantwortung,
    halten, was es verspricht), L05 reading the full persuasive speech and
    identifying each device in it, L06 the culminating delivery -- listening to
    a spoken preview of the appeal, speaking AND writing the complete speech,
    and a dictation. Register: formal Sie throughout. Priority checks for the
    fresh-context reviewer: (1) formal Sie is consistent and never slips into
    du; (2) the culminating speaking AND writing exercises (lesson06
    exercise05/06) BOTH deliver the FULL multi-sentence speech (all four
    devices recognizable), never a single isolated sentence; (3) the full
    speech teaching card (lesson05) and the speak/write tested_text are
    sentence-for-sentence identical (the trailing period is omitted from
    tested_text only); (4) the dictation's tested_text, its bound audio, and
    its overlay correct_response are byte-identical; (5) every tested word is
    traced to an earlier teaching card that genuinely displays that exact form;
    (6) the two dialogue-comprehension exercises agree with each other and
    with the bound audio on what each speaker says.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    character canon (Felix Weber / Frau Vogel, formal Sie, six-month testing
    phase), dialogue cards vs austausch.01 audio, dictation tested_text/audio/
    correct_response byte-identity, every example_gloss, learner-visible text
    for internals leaks, YAML booleans, accepted-answer completeness. Fixes:
    de.c1.unit08.lesson05.exercise03.read_betonung and
    lesson05.exercise04.read_appell -- target_blocks held only an English
    question, so the sentence to classify was never shown; now the German
    sentence ("Gerade jetzt kommt es auf Qualität an." / "Deshalb appelliere
    ich an Ihre Verantwortung."). lesson05.exercise01.read_frage -- same, now
    shows "Wollen wir wirklich riskieren, dass unsere Kunden die Daten
    ungeschützt erhalten?". Overlay: lesson04.exercise05.translate_appellieren
    and lesson04.exercise07.write_verantwortung accept deine/eure Verantwortung
    (English "your" is underdetermined); lesson04.exercise06.speak_qualitaet
