schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "de"
cefr_level: "B1"
status: "unreviewed"
generation_provenance: {method: "ai_generated", authoring_system: "claude", human_reviewed: false}
review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Second de B1 unit; continues unit35's Bürgeramt/Felix/Frau Klein scenario and vocabulary cumulatively. Needs fresh-context review."}

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Felix and Frau Klein, matching unit35. Teach müssen for present
    obligation, the fixed hätte...sollen construction for past regret about
    an unfulfilled obligation, and dürfen negated with nicht for prohibition
    -- flag explicitly that nicht müssen means "don't have to" (not
    forbidden), so prohibition requires nicht dürfen instead.

media_assets:
  - {content_key: "de.b1.audio.ich_muss_sagen.neutral.01", language: "de", text: "Ich muss sagen, dass das Formular fehlt.", voice_hint: "neutral_adult_female", status: "pending_generation"}
  - {content_key: "de.b1.audio.haette_abgeben_sollen.neutral.01", language: "de", text: "Ich hätte das Formular früher abgeben sollen.", voice_hint: "neutral_adult_male", status: "pending_generation"}
  - content_key: "de.b1.audio.dialogue.pflichten_buergeramt.01"
    language: "de"
    text: >-
      Frau Klein: Guten Tag, Felix. Sie müssen sagen, ob das Formular fertig
      ist. Felix: Ja, es ist fertig. Aber ich hätte es früher abgeben sollen.
      Frau Klein: Das stimmt. Sie dürfen das Formular aber nicht ohne
      Unterschrift abgeben. Felix: Gut, ich unterschreibe jetzt.
    voice_hint: "two_adults_formal"
    status: "pending_generation"

units:
  - content_key: "de.b1.unit36.pflichten"
    title: "Pflichten"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.necessity.express_obligation_with_subjunctive"
    planned_lesson_count: 3
    lessons:
      - content_key: "de.b1.unit36.lesson01.ich_muss_sagen_dass"
        title: "Ich muss sagen, dass..."
        spine_outcome_id: "universal.b1.necessity.express_obligation_with_subjunctive"
        teaching:
          - {content_key: "de.b1.unit36.lesson01.teach.ich_muss_sagen", kind: "phrase", target: {text: "Ich muss sagen, dass das Formular fehlt.", language_code: "de", direction: "ltr"}, introduced_tokens: ["muss", "das", "Formular", "fehlt"], example: {text: "Im Gespräch: Ich muss sagen, dass das Formular fehlt.", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit36.lesson01.teach.muessen_sie", kind: "phrase", target: {text: "Müssen Sie das Formular heute abgeben?", language_code: "de", direction: "ltr"}, introduced_tokens: ["Müssen", "müssen", "heute", "abgeben"], example: {text: "Im Gespräch: Müssen Sie das Formular heute abgeben?", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit36.lesson01.exercise01.recognize_ich_muss_sagen", type: "multiple_choice", tested_text: "ich muss sagen", prompt: {target_blocks: [{text: "I must say", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit36.lesson01.exercise02.recognize_dass_formular_fehlt", type: "multiple_choice", tested_text: "dass das Formular fehlt", prompt: {target_blocks: [{text: "that the form is missing", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit36.lesson01.exercise03.listen_select_present_necessity", type: "listen_select", tested_text: "Ich muss sagen dass das Formular fehlt", media_asset_key: "de.b1.audio.ich_muss_sagen.neutral.01", prompt: {target_blocks: [{text: "What must the speaker say?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit36.lesson01.exercise04.match_present_necessity"
            type: "matching_pairs"
            tested_text: "ich muss sagen dass das formular fehlt müssen sie heute abgeben"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Ich muss sagen", right: "I must say"}
              - {left: "dass das Formular fehlt", right: "that the form is missing"}
              - {left: "das Formular", right: "the form"}
              - {left: "Müssen Sie...?", right: "Must you...?"}
              - {left: "heute abgeben", right: "submit today"}
              - {left: "fehlt", right: "is missing"}
          - {content_key: "de.b1.unit36.lesson01.exercise05.order_present_necessity", type: "word_order", tested_text: "Ich muss sagen dass das Formular fehlt", prompt: {target_blocks: []}, word_bank: ["muss", "Ich", "fehlt", "dass", "sagen", "das", "Formular"]}
          - {content_key: "de.b1.unit36.lesson01.exercise06.write_present_necessity", type: "writing_prompt", tested_text: "Ich muss sagen dass das Formular fehlt", prompt: {target_blocks: [{text: "Write exactly this present-necessity sentence with an embedded dass-clause: I must say that the form is missing.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit36.lesson02.duerfen_nicht_haette_sollen"
        title: "Sie dürfen nicht... / Ich hätte... sollen"
        spine_outcome_id: "universal.b1.necessity.express_obligation_with_subjunctive"
        teaching:
          - {content_key: "de.b1.unit36.lesson02.teach.duerfen_nicht", kind: "phrase", target: {text: "Sie dürfen das Formular nicht ohne Unterschrift abgeben.", language_code: "de", direction: "ltr"}, introduced_tokens: ["dürfen", "nicht", "ohne", "Unterschrift"], example: {text: "Im Gespräch: Sie dürfen das Formular nicht ohne Unterschrift abgeben.", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit36.lesson02.teach.haette_sollen", kind: "phrase", target: {text: "Ich hätte das Formular früher abgeben sollen.", language_code: "de", direction: "ltr"}, introduced_tokens: ["hätte", "früher", "sollen"], example: {text: "Im Gespräch: Ich hätte das Formular früher abgeben sollen.", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit36.lesson02.exercise01.recognize_duerfen_nicht", type: "multiple_choice", tested_text: "dürfen nicht", prompt: {target_blocks: [{text: "must not / are not allowed to (prohibition)", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit36.lesson02.exercise02.recognize_haette_sollen", type: "multiple_choice", tested_text: "hätte abgeben sollen", prompt: {target_blocks: [{text: "should have submitted (past regret)", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit36.lesson02.exercise03.listen_select_past_regret", type: "listen_select", tested_text: "Ich hätte das Formular früher abgeben sollen", media_asset_key: "de.b1.audio.haette_abgeben_sollen.neutral.01", prompt: {target_blocks: [{text: "What does the speaker regret not doing?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit36.lesson02.exercise04.match_prohibition_regret"
            type: "matching_pairs"
            tested_text: "sie dürfen das formular nicht ohne unterschrift abgeben ich hätte das formular früher abgeben sollen"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Sie dürfen nicht...", right: "You must not..."}
              - {left: "ohne Unterschrift", right: "without a signature"}
              - {left: "abgeben", right: "submit"}
              - {left: "Ich hätte... sollen", right: "I should have..."}
              - {left: "früher", right: "earlier"}
              - {left: "die Unterschrift", right: "the signature"}
          - {content_key: "de.b1.unit36.lesson02.exercise05.order_prohibition", type: "word_order", tested_text: "Sie dürfen das Formular nicht ohne Unterschrift abgeben", prompt: {target_blocks: []}, word_bank: ["Sie", "dürfen", "das", "Formular", "nicht", "ohne", "Unterschrift", "abgeben"]}
          - {content_key: "de.b1.unit36.lesson02.exercise06.write_past_regret", type: "writing_prompt", tested_text: "Ich hätte das Formular früher abgeben sollen", prompt: {target_blocks: [{text: "Write exactly this past-regret sentence with hätte... sollen: I should have submitted the form earlier.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit36.lesson03.buergeramt_dialogue"
        title: "Dialog: Das Formular abgeben"
        spine_outcome_id: "universal.b1.necessity.express_obligation_with_subjunctive"
        teaching:
          - {content_key: "de.b1.unit36.lesson03.teach.klein_ask", kind: "dialogue", target: {text: "Guten Tag, Felix. Sie müssen sagen, ob das Formular fertig ist.", language_code: "de", direction: "ltr", speaker: "Frau Klein"}, introduced_tokens: ["fertig"]}
          - {content_key: "de.b1.unit36.lesson03.teach.felix_answer", kind: "dialogue", target: {text: "Ja, es ist fertig. Aber ich hätte es früher abgeben sollen.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["es"]}
          - {content_key: "de.b1.unit36.lesson03.teach.klein_prohibition", kind: "dialogue", target: {text: "Das stimmt. Sie dürfen das Formular aber nicht ohne Unterschrift abgeben.", language_code: "de", direction: "ltr", speaker: "Frau Klein"}, introduced_tokens: ["stimmt"]}
          - {content_key: "de.b1.unit36.lesson03.teach.felix_close", kind: "dialogue", target: {text: "Gut, ich unterschreibe jetzt.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["Gut", "gut", "unterschreibe", "jetzt"]}
        exercises:
          - {content_key: "de.b1.unit36.lesson03.exercise01.choose_embedded_necessity", type: "multiple_choice", tested_text: "Ich muss sagen dass das Formular fehlt", prompt: {target_blocks: [{text: "Which answer states a present necessity with an embedded dass-clause?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit36.lesson03.exercise02.dialogue_comprehension_necessity", type: "dialogue_comprehension", tested_text: "guten tag müssen sie sagen ob das formular fertig ist hätte es früher abgeben sollen dürfen nicht ohne unterschrift abgeben unterschreibe jetzt", media_asset_key: "de.b1.audio.dialogue.pflichten_buergeramt.01", prompt: {target_blocks: []}}
          - content_key: "de.b1.unit36.lesson03.exercise03.match_dialogue_necessity"
            type: "matching_pairs"
            tested_text: "sie müssen sagen ob das formular fertig ist ich hätte es früher abgeben sollen sie dürfen das formular nicht ohne unterschrift abgeben ich unterschreibe jetzt"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Sie müssen sagen, ob...", right: "You must say whether..."}
              - {left: "das Formular ist fertig", right: "the form is ready"}
              - {left: "Ich hätte es früher abgeben sollen", right: "I should have submitted it earlier"}
              - {left: "Das stimmt", right: "That's right"}
              - {left: "nicht ohne Unterschrift abgeben", right: "not submit without a signature"}
              - {left: "Ich unterschreibe jetzt", right: "I'll sign now"}
          - {content_key: "de.b1.unit36.lesson03.exercise04.order_prohibition_dialogue", type: "word_order", tested_text: "Sie dürfen das Formular aber nicht ohne Unterschrift abgeben", prompt: {target_blocks: []}, word_bank: ["Sie", "dürfen", "das", "Formular", "aber", "nicht", "ohne", "Unterschrift", "abgeben"]}
          - {content_key: "de.b1.unit36.lesson03.exercise05.reply_present_necessity", type: "dialogue_response", tested_text: "Ja es ist fertig", prompt: {target_blocks: [{text: "Frau Klein: Guten Tag, Felix. Sie müssen sagen, ob das Formular fertig ist.", language_code: "de", direction: "ltr"}]}}
          - {content_key: "de.b1.unit36.lesson03.exercise06.write_full_necessity_contrast", type: "writing_prompt", tested_text: "Ich muss sagen dass das Formular fehlt Ich hätte das Formular früher abgeben sollen Sie dürfen das Formular nicht ohne Unterschrift abgeben", prompt: {target_blocks: [{text: "As Felix, write a formal three-sentence note warning a colleague about the Bürgeramt form. Include a present-necessity sentence with muss sagen, dass; a past-regret sentence with hätte... sollen (your own delay); and a prohibition sentence with dürfen... nicht.", language_code: "en", direction: "ltr"}]}}
