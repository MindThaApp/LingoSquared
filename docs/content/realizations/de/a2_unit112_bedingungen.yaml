          - {"content_key": "de.a2.unit112.lesson06.exercise06.uebersetzen_park", "type": "translation", "tested_text": "Wenn das Wetter schön ist gehen wir in den Park", "prompt": {"target_blocks": [{"text": "If the weather is nice, we go to the park.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit112.lesson06.exercise07.schreiben_dreisaetze", "type": "writing_prompt", "tested_text": "Wenn es regnet bleibe ich zu Hause Wenn Sie bar bezahlen bekommen Sie Rabatt Ich muss gehen sonst verpasse ich den Bus", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences: (1) say that if it rains, you stay at home, starting with 'Wenn'; (2) say that if you (formal) pay cash, you get a discount, starting with 'Wenn Sie'; (3) say you have to go, otherwise you will miss the bus, using 'sonst'.", "language_code": "en", "direction": "ltr"}]}}
