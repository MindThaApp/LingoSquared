          - {"content_key": "de.a2.unit112.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Was machen wir am Samstag Wenn das Wetter schön ist gehen wir in den Park Und wenn es regnet Dann bleiben wir zu Hause und kochen zusammen Und wenn Nina Zeit hat Dann kommt sie mit", "prompt": {"target_blocks": []}, "pairs": [{"left": "Was machen wir am Samstag?", "right": "What are we doing on Saturday?"}, {"left": "Wenn das Wetter schön ist, gehen wir in den Park.", "right": "If the weather is nice, we go to the park."}, {"left": "Und wenn es regnet?", "right": "And if it rains?"}, {"left": "Dann bleiben wir zu Hause und kochen zusammen.", "right": "Then we stay at home and cook together."}, {"left": "Und wenn Nina Zeit hat?", "right": "And if Nina has time?"}, {"left": "Dann kommt sie mit.", "right": "Then she comes along."}]}
