          - {"content_key": "de.a2.unit112.lesson06.teach.anna_klar", "kind": "dialogue", "target": {"text": "Prima. Dann ist alles klar!", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Prima", "Dann", "ist", "alles", "klar"]}
