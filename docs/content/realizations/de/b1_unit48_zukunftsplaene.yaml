review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Fourteenth de B1 unit, completing the four-unit wave and the de B1 tier through unit48. Uses Anna (Kellnerin, established a1_unit18) and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-47), continuing the cafe storyline directly from unit47's regret/wish exchange. Formal Sie throughout, matching the de-en lane register pin. Teaches Ich habe vor, ... zu ... for a firm intention/plan, and contrasts werde + wahrscheinlich vs. vielleicht for predictions of differing certainty, matching the spine outcome's requirement to distinguish fixed plans/intentions from probable/uncertain predictions using explicit certainty markers. Needs fresh-context review."}

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix. Teach Ich habe vor, ... zu ... (infinitive clause) for
    a firm personal intention/plan, then contrast werde + wahrscheinlich
    (a likely prediction) with vielleicht + present tense (an uncertain
    prediction), so the learner can mark differing degrees of certainty
    explicitly rather than relying on tense alone.

media_assets:
  - {content_key: "de.b1.audio.plan_vorhaben.neutral.01", language: "de", text: "Ich habe vor, im Sommer nach Berlin zu ziehen.", voice_hint: "neutral_adult_female", status: "pending_generation"}
  - {content_key: "de.b1.audio.prediction_wahrscheinlich.neutral.01", language: "de", text: "Ich werde wahrscheinlich den Job wechseln.", voice_hint: "neutral_adult_male", status: "pending_generation"}
  - content_key: "de.b1.audio.dialogue.zukunftsplaene_cafe.01"
    language: "de"
    text: >-
      Anna: Ich habe vor, im Sommer nach Berlin zu ziehen. Felix: Das ist
      spannend! Ich werde wahrscheinlich den Job wechseln. Anna:
      Vielleicht arbeiten wir dann beide in Berlin. Felix: Das wäre
      schön.
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "de.b1.unit48.zukunftsplaene"
    title: "Zukunftspläne"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.future.describe_plans_intentions_and_predictions"
    planned_lesson_count: 3
    lessons:
      - content_key: "de.b1.unit48.lesson01.ich_habe_vor"
        title: "Ich habe vor, ... zu ..."
        spine_outcome_id: "universal.b1.future.describe_plans_intentions_and_predictions"
        teaching:
          - {content_key: "de.b1.unit48.lesson01.teach.anna_vorhaben_berlin", kind: "phrase", target: {text: "Ich habe vor, im Sommer nach Berlin zu ziehen.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: ["Ich", "habe", "vor", "im", "Sommer", "nach", "Berlin", "zu", "ziehen"], example: {text: "Vorhaben: Ich habe vor, im Sommer nach Berlin zu ziehen.", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit48.lesson01.teach.anna_vorhaben_cafe", kind: "phrase", target: {text: "Ich werde nächstes Jahr ein eigenes Café eröffnen.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: ["werde", "nächstes", "Jahr", "ein", "eigenes", "Café", "eröffnen"], example: {text: "Plan: Ich werde nächstes Jahr ein eigenes Café eröffnen.", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit48.lesson01.exercise01.recognize_anna_vorhaben_berlin", type: "multiple_choice", tested_text: "ich habe vor im sommer nach berlin zu ziehen", prompt: {target_blocks: [{text: "I'm planning to move to Berlin in the summer.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit48.lesson01.exercise02.recognize_anna_vorhaben_cafe", type: "multiple_choice", tested_text: "ich werde nächstes jahr ein eigenes café eröffnen", prompt: {target_blocks: [{text: "I will open my own cafe next year.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit48.lesson01.exercise03.listen_select_vorhaben", type: "listen_select", tested_text: "ich habe vor im sommer nach berlin zu ziehen", media_asset_key: "de.b1.audio.plan_vorhaben.neutral.01", prompt: {target_blocks: [{text: "Listen. What is Anna's plan?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit48.lesson01.exercise04.match_ich_habe_vor"
            type: "matching_pairs"
            tested_text: "ich habe vor im sommer nach berlin zu ziehen ich werde nächstes jahr ein eigenes café eröffnen"
            pairs:
              - {left: "Ich habe vor, im Sommer nach Berlin zu ziehen.", right: "I'm planning to move to Berlin in the summer."}
              - {left: "Ich werde nächstes Jahr ein eigenes Café eröffnen.", right: "I will open my own cafe next year."}
              - {left: "vorhaben", right: "to plan / intend"}
              - {left: "ziehen", right: "to move (relocate)"}
              - {left: "eröffnen", right: "to open"}
              - {left: "nächstes Jahr", right: "next year"}
            prompt: {target_blocks: []}
          - {content_key: "de.b1.unit48.lesson01.exercise05.order_anna_vorhaben_berlin", type: "word_order", tested_text: "Ich habe vor im Sommer nach Berlin zu ziehen", prompt: {target_blocks: []}, word_bank: ["Ich", "habe", "vor,", "im", "Sommer", "nach", "Berlin", "zu", "ziehen."]}
          - {content_key: "de.b1.unit48.lesson01.exercise06.write_anna_vorhaben_berlin", type: "writing_prompt", tested_text: "Ich habe vor im Sommer nach Berlin zu ziehen", prompt: {target_blocks: [{text: "As Anna, write exactly this intention with Ich habe vor, ... zu ...: I'm planning to move to Berlin in the summer.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit48.lesson02.wahrscheinlich_vielleicht"
        title: "Wahrscheinlich oder vielleicht?"
        spine_outcome_id: "universal.b1.future.describe_plans_intentions_and_predictions"
        teaching:
          - {content_key: "de.b1.unit48.lesson02.teach.felix_wahrscheinlich_job", kind: "phrase", target: {text: "Ich werde wahrscheinlich den Job wechseln.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["wahrscheinlich", "den", "Job", "wechseln"], example: {text: "Vorhersage: Ich werde wahrscheinlich den Job wechseln.", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit48.lesson02.teach.felix_vielleicht_umziehen", kind: "phrase", target: {text: "Vielleicht ziehe ich auch um.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["Vielleicht", "ziehe", "auch", "um", "umziehen"], example: {text: "Vorhersage: Vielleicht ziehe ich auch um.", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit48.lesson02.exercise01.recognize_felix_wahrscheinlich_job", type: "multiple_choice", tested_text: "ich werde wahrscheinlich den job wechseln", prompt: {target_blocks: [{text: "I will probably change jobs.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit48.lesson02.exercise02.recognize_felix_vielleicht_umziehen", type: "multiple_choice", tested_text: "vielleicht ziehe ich auch um", prompt: {target_blocks: [{text: "Maybe I'll move too.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit48.lesson02.exercise03.listen_select_wahrscheinlich", type: "listen_select", tested_text: "ich werde wahrscheinlich den job wechseln", media_asset_key: "de.b1.audio.prediction_wahrscheinlich.neutral.01", prompt: {target_blocks: [{text: "Listen. How certain does Felix sound about changing jobs?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit48.lesson02.exercise04.match_wahrscheinlich_vielleicht"
            type: "matching_pairs"
            tested_text: "ich werde wahrscheinlich den job wechseln vielleicht ziehe ich auch um"
            pairs:
              - {left: "Ich werde wahrscheinlich den Job wechseln.", right: "I will probably change jobs."}
              - {left: "Vielleicht ziehe ich auch um.", right: "Maybe I'll move too."}
              - {left: "wahrscheinlich", right: "probably"}
              - {left: "vielleicht", right: "maybe"}
              - {left: "wechseln", right: "to change / switch"}
              - {left: "umziehen", right: "to move (house)"}
            prompt: {target_blocks: []}
          - {content_key: "de.b1.unit48.lesson02.exercise05.order_felix_wahrscheinlich_job", type: "word_order", tested_text: "Ich werde wahrscheinlich den Job wechseln", prompt: {target_blocks: []}, word_bank: ["Ich", "werde", "wahrscheinlich", "den", "Job", "wechseln."]}
          - {content_key: "de.b1.unit48.lesson02.exercise06.write_felix_wahrscheinlich_job", type: "writing_prompt", tested_text: "Ich werde wahrscheinlich den Job wechseln", prompt: {target_blocks: [{text: "As Felix, write exactly this prediction with werde wahrscheinlich: I will probably change jobs.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit48.lesson03.cafe_dialogue"
        title: "Dialog: Vielleicht arbeiten wir dann beide in Berlin"
        spine_outcome_id: "universal.b1.future.describe_plans_intentions_and_predictions"
        teaching:
          - {content_key: "de.b1.unit48.lesson03.teach.anna_plan", kind: "dialogue", target: {text: "Ich habe vor, im Sommer nach Berlin zu ziehen.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: []}
          - {content_key: "de.b1.unit48.lesson03.teach.felix_react_and_predict", kind: "dialogue", target: {text: "Das ist spannend! Ich werde wahrscheinlich den Job wechseln.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["Das", "ist", "spannend"]}
          - {content_key: "de.b1.unit48.lesson03.teach.anna_predict_together", kind: "dialogue", target: {text: "Vielleicht arbeiten wir dann beide in Berlin.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: ["arbeiten", "wir", "dann", "beide"]}
          - {content_key: "de.b1.unit48.lesson03.teach.felix_close", kind: "dialogue", target: {text: "Das wäre schön.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["wäre", "schön"]}
        exercises:
          - {content_key: "de.b1.unit48.lesson03.exercise01.choose_anna_plan", type: "multiple_choice", tested_text: "ich habe vor im sommer nach berlin zu ziehen", prompt: {target_blocks: [{text: "What is Anna's fixed plan for the summer?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit48.lesson03.exercise02.choose_felix_react_predict", type: "multiple_choice", tested_text: "das ist spannend ich werde wahrscheinlich den job wechseln", prompt: {target_blocks: [{text: "How certain is Felix's own prediction about changing jobs?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit48.lesson03.exercise03.listen_dialogue_zukunftsplaene", type: "listen_select", tested_text: "ich habe vor im sommer nach berlin zu ziehen das ist spannend ich werde wahrscheinlich den job wechseln", media_asset_key: "de.b1.audio.dialogue.zukunftsplaene_cafe.01", prompt: {target_blocks: [{text: "Listen to the dialogue. What does Anna say might happen if Felix also moves?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit48.lesson03.exercise04.match_dialogue_zukunftsplaene"
            type: "matching_pairs"
            tested_text: "das ist spannend vielleicht arbeiten wir dann beide in berlin das wäre schön"
            pairs:
              - {left: "Das ist spannend!", right: "That's exciting!"}
              - {left: "Vielleicht arbeiten wir dann beide in Berlin.", right: "Maybe we'll both work in Berlin then."}
              - {left: "Das wäre schön.", right: "That would be nice."}
              - {left: "spannend", right: "exciting"}
              - {left: "beide", right: "both"}
              - {left: "dann", right: "then"}
            prompt: {target_blocks: []}
          - {content_key: "de.b1.unit48.lesson03.exercise05.order_anna_predict_together", type: "word_order", tested_text: "Vielleicht arbeiten wir dann beide in Berlin", prompt: {target_blocks: []}, word_bank: ["Vielleicht", "arbeiten", "wir", "dann", "beide", "in", "Berlin."]}
          - {content_key: "de.b1.unit48.lesson03.exercise06.write_full_plan_and_prediction", type: "writing_prompt", tested_text: "Ich habe vor im Sommer nach Berlin zu ziehen Ich werde wahrscheinlich den Job wechseln", prompt: {target_blocks: [{text: "Write two sentences: (1) as Anna, a fixed intention with Ich habe vor, ... zu ...: you're planning to move to Berlin in the summer; (2) as Felix, an uncertain-but-likely prediction with werde wahrscheinlich: you will probably change jobs.", language_code: "en", direction: "ltr"}]}}
          - {content_key: de.b1.unit48.lesson03.exercise07.dictation_plan_vorhaben, type: dictation, tested_text: "Ich habe vor, im Sommer nach Berlin zu ziehen.", media_asset_key: de.b1.audio.plan_vorhaben.neutral.01, prompt: {target_blocks: []}}
          - {content_key: de.b1.unit48.lesson03.exercise08.dictation_prediction, type: dictation, tested_text: "Ich werde wahrscheinlich den Job wechseln.", media_asset_key: de.b1.audio.prediction_wahrscheinlich.neutral.01, prompt: {target_blocks: []}}
