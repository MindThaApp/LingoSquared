  notes: >-
    From-scratch generation, not adapted from a source. Second de B2 unit.
    Structural exemplar: the shipped nl B2 tier
    (docs/content/realizations/nl/b2_unit02_speculatie.yaml) was used for
    unit/lesson/exercise SHAPE only, per explicit task instruction -- no
    Dutch sentence was translated or consulted as source text; every German
    sentence was authored fresh, mapping the outcome's certainty-scale/
    deduction/possibility/past-speculation structure onto German's own
    epistemic modal system (müssen/können/könnte, not a word-for-word port
    of Dutch moet/kan/zou kunnen). de's own established B1 character (Felix
    Weber, Ingenieur, formal Sie register) and his colleagues Frau Vogel
    (b1_unit52) and Frau Bauer (b1_unit39, Ingenieurin) continue here --
    de's own prior content, not a sibling-direction file. No en-de sibling
    (de-en) overlay/realization was consulted.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Second German B2 unit. Targets the CEFR B2 speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    speculate about causes/consequences with graded certainty -- may/
    might/must/cannot be the case, present and past, distinguishing
    deduction from guesswork. Theme: Frau Bauer (established colleague,
    Ingenieurin) is late for a meeting; Felix and Frau Vogel speculate
    about why. Lesson arc: L01 a certainty scale of adverbs (vielleicht /
    wahrscheinlich / bestimmt / wird wohl / zweifellos / sicher), L02
    present-tense deduction (muss = epistemic "must", kann nicht =
    epistemic "cannot be", denn/also), L03 tentative possibility (könnte,
    möglicherweise, vermuten vs. wissen), L04 past speculation (muss ...
    haben/sein, könnte ... haben -- modal + Partizip II + haben/sein), L05
    a reading distinguishing stated fact from speculation/deduction/guess,
    L06 the culminating Felix/Frau Vogel dialogue combining present and
    past speculation at different certainty levels. Register: formal Sie
    throughout, matching the established de lane workplace register.
    Vocabulary is self-contained but CUMULATIVE with unit01 (same B2
    course row) -- denn, dass, aber, sein, viel etc. from unit01 are
    reused without re-teaching; grep confirms every reused token was
    genuinely introduced in unit01. No sibling-direction file was
    consulted. Priority checks for the fresh-context reviewer: (1) the
    epistemic muss/kann-nicht/könnte system does not overload the everyday
    "must/can" senses already familiar to English speakers -- confirm the
    glosses make the deductive reading unambiguous; (2) "verschlafen" used
    non-reflexively (unlike some other Germanic languages) -- confirm this
    reads as correct standard German; (3) the culminating writing exercise
    (lesson06 exercise06) is graded against a fixed two-sentence string --
    confirm punctuation variants are complete; (4) no fact stated about
    Frau Bauer in this unit should contradict her b1_unit39 canon
    (Ingenieurin, colleague of Felix).

