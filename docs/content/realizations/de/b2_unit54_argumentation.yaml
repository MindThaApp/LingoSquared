  - {content_key: "de.b2.audio.argumentation.sentence.01", language: "de", text: "Ich räume ein, dass es ein Risiko gibt, aber die Zahlen überzeugen mich trotzdem.", voice_hint: "neutral_adult_female", status: "pending_generation"}
  - content_key: "de.b2.audio.dialogue.argumentation.01"
    language: "de"
    text: >-
      Anna: Ich finde, wir sollten das Café auch sonntags öffnen. Felix:
      Was ist dein stärkstes Argument dafür? Anna: Mein stärkstes
      Argument ist der Umsatz. Laut den Zahlen kommen sonntags die
      meisten Kunden. Felix: Aber das Personal braucht auch einen
      Ruhetag, und die Kosten steigen. Anna: Das ist ein berechtigter
      Einwand, aber die Zahlen zeigen etwas anderes. Obwohl die Kosten
      steigen, bleibt der Gewinn deutlich höher. Felix: Also meinst du,
      die Vorteile überwiegen die Risiken? Anna: Genau. Wir sollten die
      Öffnungszeiten anpassen, nicht die Idee aufgeben.
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

