course:
  realization_key: "de.b2"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch) at B2 level. Anna and Felix
    are close colleagues and co-owners of the cafe, so they use informal
    du with each other throughout. Teach defending a position in a
    discussion: stating a claim (die Behauptung), supporting it with
    evidence (der Beleg), acknowledging the strongest opposing point (der
    Einwand), and rebutting it (widerlegen) without conceding the claim,
    using correct verb-final word order in weil/obwohl/dass subordinate
    clauses.

