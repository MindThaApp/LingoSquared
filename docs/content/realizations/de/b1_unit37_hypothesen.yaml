  notes: "Third de B1 unit; continues unit35/36's Bürgeramt/Felix/Frau Klein scenario and vocabulary cumulatively. Needs fresh-context review.\n\nFresh-context review 2026-10-11 (content-reviewer.md checklist): checked realization + en-de overlay for unit37 (teaching-before-testing, prompt determinacy, accepted-answer completeness, distractor validity, matching-pair mirrors, register). Fixes: de.b1.unit37.lesson03.exercise06.write_full_conditional_contrast -- underdetermined capstone (result clauses unspecified) re-pinned in realization target_blocks and overlay instruction to the exact English sentences 'If the form is ready, I'll call you. If I had no time, I would call you tomorrow.' with formal Sie and tense constraints; de.b1.unit37.lesson01.exercise06.write_real_conditional and de.b1.unit37.lesson02.exercise06.write_unreal_conditional -- added 'formal Sie' pin so du-form translations are excluded by the prompt (both files). NATIVE FLAGS: dialogue turn klein_real_and_unreal shifts whose time is meant ('wenn Sie Zeit haben' answers Felix's question about Frau Klein's time) and 'wenn ich keine Zeit hätte, würde ich Sie morgen anrufen' is an odd counterfactual -- grammatical but not very coherent; listen_select answers 'Call Felix.'/'Help Felix.' infer the name from scenario (answerable). DEFERRED (owner): whether to pin '(formal Sie)' on every de B1 'Write exactly...' prompt course-wide or add du variants.\n\nSecond-pass review 2026-10-19: 1 fix -- lesson03 dialogue (audio de.b1.audio.dialogue.hypothesen_buergeramt.01, teach.klein_real_and_unreal, exercise02 tested_text): Frau Klein's answer 'Ja, wenn Sie Zeit haben, kann ich Ihnen helfen' did not answer Felix's question about HER time -> 'Ja, wenn ich Zeit habe, kann ich Ihnen helfen' (habe added to introduced_tokens; resolves the first earlier native flag). NATIVE FLAGS: the follow-up counterfactual 'Aber wenn ich keine Zeit hätte, würde ich Sie morgen anrufen' is grammatical but a native might prefer an indicative 'Falls ich keine Zeit habe, rufe ich Sie morgen an'."

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Felix and Frau Klein. Teach real/possible wenn-conditionals with present
    indicative in both clauses, then contrast with unreal/counterfactual
    Konjunktiv II conditionals using würde, hätte, and wäre explicitly.
    Keep Konjunktiv II subjects in the first person (ich) to avoid the
    separate formal-Sie subjunctive conjugation, which this unit does not
    teach.

