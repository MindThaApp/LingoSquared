  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch). Dates use the day.month numeric convention (7.7., not 7/7) -- flag this is the reverse of the US month.day convention taught in the shared English realization. Anna and Felix continue on the formal Sie register from units 01-03."

