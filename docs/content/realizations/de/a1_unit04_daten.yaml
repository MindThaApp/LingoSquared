review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Fourth German unit, continuing the Anna/Felix storyline (still on the
    formal Sie register established in unit01, unbroken through units
    02-03). Scoped to exactly one spine outcome
    (universal.a1.dates.exchange_calendar_dates) across all 4 lessons per
    AUTHORING_GUIDE §1; prerequisite universal.a1.numbers.use_basic_numbers
    is satisfied by unit03. Mirrors the existing reviewed en/
    a1_unit04_dates.yaml's 4-lesson structure (weekdays, months, stating
    a date, an in-context appointment-style dialogue) for structural
    parity, but with fully original German content and no shared
    character/scene reuse.

    Scoping decisions: German dates are stated with a fixed article +
    ordinal-adjective phrase ("der siebte Juli," "der dritte März")
    rather than deriving the full ordinal-suffix formation rule
    (-te/-ste plus case declension) -- taught as memorized whole
    phrases for exactly the two dates used (7th, 9th, 3rd), the same
    scoping discipline already used for other complex grammar this
    session (e.g. Sie/du taught as fixed usage, not derived). The
    written full-date convention "am Donnerstag, den neunten Juli"
    (dative weekday + accusative-declined date) is real, standard
    German and is deliberately taught as one fixed phrase rather than
    explained grammatically -- flagging this for whoever later authors
    a dedicated grammar/case unit. Numeric date form is explicitly
    flagged as day.month (7.7.), the reverse of the US month.day
    convention the shared en realization already flags as non-
    universal -- this unit makes the same disambiguation point from
    the other direction. lesson02 teaches 6 months (Januar, März, Mai,
    Juli, September, Dezember, evenly spread across the year) rather
    than en's 5, specifically so its matching_pairs clears
    AUTHORING_GUIDE §16's 6-12 minimum comfortably rather than landing
    at a bare 5. lesson01's matching_pairs pools all 7 weekdays. No
    fill_in_blank exercises, same ambiguity-avoidance discipline as
    prior units. Added an explicit reading_comprehension exercise
    (lesson04, reading a short "closed until..." note) after the
    coordinator's request to specifically check for gaps like unit02's
    earlier-found missing reading-modality coverage -- this unit's own
    spine outcome requires a read_date assessment (interpreting a
    written date unambiguously), so the dedicated exercise closes that
    requirement directly rather than relying on incidental textual
    exposure. Applied the hardcoded-English-target_blocks lesson from
    the start this time: every target_blocks in this file is either
    empty or genuine German target-language content (a dialogue cue or
    the reading note itself) -- never English instruction text: a
    repo-wide grep after authoring confirms zero
    language_code: "en" target_blocks anywhere in this file. No sie/Sie
    capitalization collision introduced (only capital Sie is used, no
    third-person lowercase sie), so the case_sensitive grading flag
    (landed 2026-07-07, CODE fix 67ed7ae) isn't needed for this unit's
    own content, though it is now available for whichever future unit
    finally introduces third-person sie. Compiled and validated against
    the real compiler to confirm every exercise's tested_text is fully
    covered by this file's own cumulative introduced_tokens.

    Fresh-context review (subagent, Codex still usage-exhausted)
    confirmed this file itself has zero hardcoded-English-target_blocks
    instances (the twice-recurring bug class) and zero correct_option/
    accepted_answers mismatches in either overlay. It found two blocking
    issues, both in the overlays, not this file: (1) a pervasive §15
    asterisk-marking gap across de-en/a1_unit04.yaml's teaching notes
    and several exercise feedback fields, plus 4 similar spots in
    en-de/a1_unit04.yaml -- fixed in both. (2) de-en/a1_unit04.yaml's
    original draft had been authored while consulting the existing
    nl-en/a1_unit04.yaml overlay (same target realization) for exercise-
    design conventions, a real breach of CLAUDE.md's strong sibling-
    isolation rule even without copying actual content -- remediated by
    a full independent rewrite (draft.2) using this project's own
    de-en/a1_unit01-03.yaml precedent instead. Minor findings also
    fixed: a missing unpunctuated §12 variant in de-en's speak_dates.
    One flagged gap is NOT fixable from this file or its overlays: the
    paired en/a1_unit04_dates.yaml realization's own match_days/
    match_months pairs (4 each) fall short of §16's 6-12 range -- this
    is shared, already-reviewed content used by every X-en overlay
    pairing with it (fa-en/nl-en/prs-en too), out of scope for a
    unilateral edit here. Re-verified clean after every fix: real
    compiler validate+compile for both en-de and de-en directions (0
    errors/warnings), full scripts/verify.sh --content-only.

course:
