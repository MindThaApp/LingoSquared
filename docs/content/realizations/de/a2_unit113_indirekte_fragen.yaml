          - {"content_key": "de.a2.unit113.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Weißt du wo die Post ist Ja sie ist neben dem Bahnhof Und weißt du wann sie öffnet Ich weiß nicht ob sie schon um acht öffnet Weißt du auch ob es einen Supermarkt gibt Ich zeige dir wo er ist", "prompt": {"target_blocks": []}, "pairs": [{"left": "Weißt du, wo die Post ist?", "right": "Do you know where the post office is?"}, {"left": "Ja, sie ist neben dem Bahnhof.", "right": "Yes, it is next to the station."}, {"left": "Und weißt du, wann sie öffnet?", "right": "And do you know when it opens?"}, {"left": "Ich weiß nicht, ob sie schon um acht öffnet.", "right": "I don't know whether it already opens at eight."}, {"left": "Weißt du auch, ob es einen Supermarkt gibt?", "right": "Do you also know whether there is a supermarket?"}, {"left": "Ich zeige dir, wo er ist.", "right": "I'll show you where it is."}]}
          - {"content_key": "de.a2.unit113.lesson06.exercise04.ordnen_wann", "type": "word_order", "tested_text": "Und weißt du wann sie öffnet", "prompt": {"target_blocks": []}, "word_bank": ["öffnet", "sie", "wann", "du", "weißt", "Und"]}
          - {"content_key": "de.a2.unit113.lesson06.exercise05.antwort_post", "type": "dialogue_response", "tested_text": "Ja sie ist neben dem Bahnhof", "prompt": {"target_blocks": [{"text": "Weißt du, wo die Post ist?", "language_code": "de", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit113.lesson06.exercise06.uebersetzen_acht", "type": "translation", "tested_text": "Ich weiß nicht ob die Post um acht öffnet", "prompt": {"target_blocks": [{"text": "I don't know whether the post office opens at eight.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit113.lesson06.exercise07.schreiben_dreisaetze", "type": "writing_prompt", "tested_text": "Weißt du wo die Post ist Ich weiß nicht ob Nina kommt Können Sie mir sagen wie viel das kostet", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences: (1) ask a friend whether he knows where the post office is, starting with 'Weißt du, wo'; (2) say you don't know whether Nina is coming, using 'ob'; (3) ask a stranger politely (formal) to tell you how much that costs, starting with 'Können Sie mir sagen'.", "language_code": "en", "direction": "ltr"}]}}
