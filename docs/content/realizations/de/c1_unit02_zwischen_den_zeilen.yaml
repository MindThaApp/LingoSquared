  notes: >-
    Second German C1 unit, continuing the de C1 tier after c1_unit01
    (strukturierung). No usable public-domain source was found: a web search
    surfaced only a proprietary commercial course page (Language Club's
    "Advanced German Irony & Humor" C1 course, no license/open-access status,
    categorically excluded per AUTHORING_GUIDE §10), and c1_unit01's firecrawl
    pass already established that the sole verified public-domain German source
    (the FSI German Basic Course, US government work) caps at a basic/
    intermediate level with no advanced C1 inference material. This is
    established-conventions-only authoring, built from general knowledge of
    German irony, understatement, and implication in formal workplace register.
    The structural template is de C1 unit01 (same tier, same lesson/exercise
    pacing, same formal-Sie register policy); every word of actual German text
    is freshly authored, not translated from any sibling file, and the scenario
    is unrelated. Felix Weber (Ingenieur, established a1_unit18) and Frau Vogel
    (his colleague, first introduced b1_unit52) continue their formal-Sie
    workplace register. No sibling-direction file (de-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Second German C1 unit. Targets universal.c1.inference.infer_implicit_meaning
    (inference, implication, irony, understatement): recognize what is meant
    beyond what is literally said, and convey it. Theme: the Geschaeftsleitung
    announces a new mandatory status meeting every Friday at four o'clock for a
    whole hour, and Felix Weber and Frau Vogel express their private scepticism
    entirely through irony and understatement -- nothing is said directly. The
    lesson arc mirrors the outcome's own modalities: L01 recognizing
    understatement (nicht restlos begeistert, nicht ganz ideal, ein bisschen
    viel, etwas optimistisch), L02 recognizing irony (das ist ja ein
    interessanter Vorschlag, aufschlussreich, na grossartig, das kann ja nur
    besser werden), L03 understanding implication (wenn Sie meinen, sicher gut
    gemeint, sicher gut beraten, dazu sage ich lieber nichts), L04 reading
    between the lines of a polite-but-dismissive written reply (mit Interesse
    zur Kenntnis genommen, im Hinterkopf behalten, zu gegebener Zeit),
    L05 producing an ironic or understated remark plus its explanation (damit
    meine ich, dass ...), L06 the culminating full exchange covering all four
    assessment requirements -- listening (infer the speaker's meaning and
    attitude and the cue), reading (distinguish literal from actual stance),
    speaking (produce a remark and explain the unstated judgement), and writing
    (a sceptical message conveyed through implication). Register: formal Sie
    throughout, including inside the ironic and understated remarks themselves.
    Priority checks for the fresh-context reviewer: (1) formal Sie is consistent
    and never slips into du, even in the ironic lines; (2) the irony and
    understatement remarks genuinely read as what a native formal-register
    German workplace speaker would say, not machine-translated; (3) the
    culminating speaking exercise (lesson06) requires BOTH the remark and its
    explanation, not the remark alone; (4) the listening exercise (lesson06)
    tests the inferred meaning, not just the literal words; (5) the two
    dialogue-comprehension exercises in lesson06 agree with each other and with
    the bound audio on what each speaker actually says and implies.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    course-scoped compile, YAML booleans, jargon/AI leaks, character canon
    (Felix Weber, Frau Vogel, formal Sie), note/gloss accuracy, prompt
    determinacy and accepted-answer completeness for unit02 realization + en-
    de overlay. Fixes: de.c1.unit02.lesson01.teach.untertreibung_muster note
    parentheticals said the opposite of the meaning ('not annoyed / not bad /
    not too much') -> 'really: annoyed / bad / far too much';
    de.c1.unit02.lesson04.exercise06.speak_zwischen_zeilen prompt +
    instruction 'keep it in mind' -> 'keep it (the proposal) in mind' (pins
    ihn); de.c1.unit02.lesson04.exercise05.translate_floskel prompt +
    instruction now pin 'using haben ... mit Interesse zur Kenntnis genommen'
    (Praeteritum/fronted variants were graded wrong);
    de.c1.unit02.lesson04.exercise07.write_zwischen_zeilen accepts the future
    'Zu gegebener Zeit werden wir die Umsetzung gerne pruefen' (+period,
    ascii); 'fuer eine Zeitverschwendung halte' variants (+period, ascii)
    added to lesson05.exercise05/06/07 and lesson06.exercise05. NATIVE FLAGS:
    lesson02 exercise05/07 accept only the ja-irony form though the prompt
    does not ask for ja; 'Seine Kritik ist eine Untertreibung' is an odd
    example of the device; 'Die Stunde ist nicht ganz ideal' (Die Uhrzeit more
    idiomatic). DEFERRED: none.

course:
  realization_key: de.c1
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching the
    established de lane workplace register -- Felix Weber and Frau Vogel,
    established colleagues from the de B1/B2 tiers, address each other with Sie
    in every scene. C1 layers implicit meaning onto that register: irony,
    understatement, and implication are all delivered in the same formal
    register (Das ist ja ein interessanter Vorschlag, ich bin nicht restlos
    begeistert, wenn Sie meinen), never slipping into casual du even when the
    remark is ironic or dismissive.

