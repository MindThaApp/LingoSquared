  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix, matching the established acquaintance-register
    precedent from a1_unit18 and the de-en lane pin. Teach two advice
    constructions: An Ihrer Stelle wuerde ich ... (a hedged "if I were
    you, I would ..." suggestion using the Konjunktiv II of werden plus
    an infinitive) and Sie sollten ... (a direct "you should ..." advice
    using the Konjunktiv II of sollen plus an infinitive), and teach a
    short accepting response, Das ist ein guter Rat, so the learner both
    gives and responds to advice.

