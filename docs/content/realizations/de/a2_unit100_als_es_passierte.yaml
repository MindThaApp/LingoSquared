          - {"content_key": "de.a2.unit100.lesson05.teach.gn_dunkel", "kind": "grammar_note", "target": {"text": "Als es plötzlich dunkel wurde, ...", "language_code": "de", "direction": "ltr"}, "introduced_tokens": ["Als", "es", "plötzlich", "dunkel", "wurde"]}
          - {"content_key": "de.a2.unit100.lesson05.teach.lesen_geschichte", "kind": "reading", "target": {"text": "Gestern Abend war Felix im Café. Er las die Zeitung, und Anna kochte Suppe. Draußen regnete es. Plötzlich ging das Licht aus. Alle warteten. Als Anna eine Kerze brachte, lachte Felix. Die Suppe war schon fertig, und sie aßen im Dunkeln.", "language_code": "de", "direction": "ltr"}, "introduced_tokens": ["Gestern", "Abend", "war", "Felix", "im", "Café", "Er", "las", "die", "Zeitung", "und", "Anna", "kochte", "Suppe", "Draußen", "regnete", "es", "Plötzlich", "ging", "das", "Licht", "aus", "Alle", "warteten", "Als", "eine", "Kerze", "brachte", "lachte", "Die", "schon", "fertig", "sie", "aßen", "Dunkeln"]}
        exercises:
          - {"content_key": "de.a2.unit100.lesson05.exercise01.lesen_was", "type": "reading_comprehension", "tested_text": "Plötzlich ging das Licht aus", "prompt": {"target_blocks": [{"text": "What happened suddenly?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit100.lesson05.exercise02.lesen_felix", "type": "reading_comprehension", "tested_text": "Er las die Zeitung", "prompt": {"target_blocks": [{"text": "What was Felix doing while Anna cooked?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit100.lesson05.exercise03.paare_geschichte", "type": "matching_pairs", "tested_text": "Er las die Zeitung Anna kochte Suppe Draußen regnete es Alle warteten Anna brachte eine Kerze Sie aßen im Dunkeln", "prompt": {"target_blocks": []}, "pairs": [{"left": "Er las die Zeitung.", "right": "He was reading the newspaper."}, {"left": "Anna kochte Suppe.", "right": "Anna was cooking soup."}, {"left": "Draußen regnete es.", "right": "Outside it was raining."}, {"left": "Alle warteten.", "right": "Everybody waited."}, {"left": "Anna brachte eine Kerze.", "right": "Anna brought a candle."}, {"left": "Sie aßen im Dunkeln.", "right": "They ate in the dark."}]}
          - {"content_key": "de.a2.unit100.lesson05.exercise04.ordnen_kerze", "type": "word_order", "tested_text": "Als Anna eine Kerze brachte lachte Felix", "prompt": {"target_blocks": []}, "word_bank": ["als", "Anna", "Felix", "eine", "Kerze", "lachte", "brachte"]}
          - {"content_key": "de.a2.unit100.lesson05.exercise05.uebersetzen_draussen", "type": "translation", "tested_text": "Draußen regnete es", "prompt": {"target_blocks": [{"text": "Outside it was raining.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit100.lesson05.exercise06.diktat_licht", "type": "dictation", "tested_text": "Plötzlich ging das Licht aus.", "media_asset_key": "de.a2.audio.als_es_passierte.diktat_licht.01", "prompt": {"target_blocks": []}}
          - {"content_key": "de.a2.unit100.lesson05.exercise07.diktat_kerze", "type": "dictation", "tested_text": "Als Anna eine Kerze brachte, lachte Felix.", "media_asset_key": "de.a2.audio.als_es_passierte.diktat_kerze.01", "prompt": {"target_blocks": []}}
      - content_key: de.a2.unit100.lesson06.felix_im_stau
        title: "Warum bist du nicht gekommen?"
        spine_outcome_id: universal.a2.past.tell_what_was_happening
        teaching:
          - {"content_key": "de.a2.unit100.lesson06.teach.anna_warum", "kind": "dialogue", "target": {"text": "Felix, warum bist du gestern nicht gekommen?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Felix", "warum", "bist", "du", "gestern", "nicht", "gekommen"]}
          - {"content_key": "de.a2.unit100.lesson06.teach.felix_bus", "kind": "dialogue", "target": {"text": "Ich wollte kommen, aber der Bus kam nicht. Es regnete und ich wartete an der Haltestelle.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Ich", "wollte", "kommen", "aber", "der", "Bus", "kam", "nicht", "Es", "regnete", "und", "ich", "wartete", "an", "Haltestelle"]}
          - {"content_key": "de.a2.unit100.lesson06.teach.anna_dann", "kind": "dialogue", "target": {"text": "Und was hast du dann gemacht?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Und", "was", "hast", "du", "dann", "gemacht"]}
          - {"content_key": "de.a2.unit100.lesson06.teach.felix_endlich", "kind": "dialogue", "target": {"text": "Als der Bus endlich kam, war es schon acht Uhr. Da bin ich nach Hause gegangen.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Als", "der", "Bus", "endlich", "kam", "war", "es", "schon", "acht", "Uhr", "Da", "bin", "ich", "nach", "Hause", "gegangen"]}
          - {"content_key": "de.a2.unit100.lesson06.teach.anna_schade", "kind": "dialogue", "target": {"text": "Schade! Ich kochte, während ich auf dich wartete.", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Schade", "Ich", "kochte", "während", "ich", "auf", "dich", "wartete"]}
          - {"content_key": "de.a2.unit100.lesson06.teach.felix_morgen", "kind": "dialogue", "target": {"text": "Entschuldigung! Morgen komme ich früher.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Entschuldigung", "Morgen", "komme", "ich", "früher"]}
        exercises:
          - {"content_key": "de.a2.unit100.lesson06.exercise01.hoeren_warum", "type": "listen_select", "tested_text": "Felix warum bist du gestern nicht gekommen", "media_asset_key": "de.a2.audio.dialogue.als_es_passierte.01", "prompt": {"target_blocks": []}}
          - {"content_key": "de.a2.unit100.lesson06.exercise02.verstehen_bus", "type": "dialogue_comprehension", "tested_text": "Ich wollte kommen aber der Bus kam nicht", "prompt": {"target_blocks": [{"text": "Why did Felix not come?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "de.a2.audio.dialogue.als_es_passierte.01"}
          - {"content_key": "de.a2.unit100.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Der Bus kam nicht Es regnete Ich wartete an der Haltestelle Als der Bus endlich kam war es schon acht Uhr Ich kochte während ich auf dich wartete Morgen komme ich früher", "prompt": {"target_blocks": []}, "pairs": [{"left": "Der Bus kam nicht.", "right": "The bus didn't come."}, {"left": "Es regnete.", "right": "It was raining."}, {"left": "Ich wartete an der Haltestelle.", "right": "I waited at the bus stop."}, {"left": "Als der Bus endlich kam, war es schon acht Uhr.", "right": "When the bus finally came, it was already eight o'clock."}, {"left": "Ich kochte, während ich auf dich wartete.", "right": "I was cooking while I waited for you."}, {"left": "Morgen komme ich früher.", "right": "Tomorrow I'll come earlier."}]}
          - {"content_key": "de.a2.unit100.lesson06.exercise04.ordnen_endlich", "type": "word_order", "tested_text": "Als der Bus endlich kam war es schon acht Uhr", "prompt": {"target_blocks": []}, "word_bank": ["als", "kam", "endlich", "war", "der", "es", "Uhr", "schon", "acht", "Bus"]}
          - {"content_key": "de.a2.unit100.lesson06.exercise05.antwort_warum", "type": "dialogue_response", "tested_text": "Der Bus kam nicht", "prompt": {"target_blocks": [{"text": "Felix, warum bist du gestern nicht gekommen?", "language_code": "de", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit100.lesson06.exercise06.uebersetzen_schade", "type": "translation", "tested_text": "Ich kochte während ich auf dich wartete", "prompt": {"target_blocks": [{"text": "I was cooking while I waited for you.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit100.lesson06.exercise07.schreiben_geschichte", "type": "writing_prompt", "tested_text": "Es regnete Ich wartete an der Haltestelle Als der Bus endlich kam ging ich nach Hause", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences in the simple past: (1) it was raining, starting with 'Es'; (2) you waited at the bus stop, starting with 'Ich'; (3) 'When the bus finally came, I went home', starting with 'Als'.", "language_code": "en", "direction": "ltr"}]}}
