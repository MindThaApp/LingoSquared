review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Third German unit, continuing the Anna/Felix storyline (still on
    the formal Sie register established in unit01, unbroken through
    unit02). Scoped to exactly one spine outcome
    (universal.a1.numbers.use_basic_numbers) across all 5 lessons per
    AUTHORING_GUIDE §1.

    Note per the coordinator's 2026-07-07 backend finding: grading is
    currently unconditionally case-insensitive (normalized() always
    casefolds; orthography_strict only affects typo distance, not
    case), so any future capitalization-only distinction (like unit02's
    deferred sie/Sie) genuinely cannot be graded correctly yet. This
    unit's content (numbers) has no such collision, so it's unaffected,
    but flagging here per the standing instruction to keep this
    constraint in mind for every future unit until the backend fix
    lands.

    Lesson breakdown: lesson01 (0-10), lesson02 (11-20), lesson03 (the
    tens 20-100, including the German compounding pattern --
    "einundzwanzig" = ones-digit + und + tens-digit, e.g. 21 =
    ein-und-zwanzig, reversed from English/most Romance-language order
    -- taught explicitly with two worked examples, not just asserted),
    lesson04 (asking and stating age, Sie/du forms), lesson05 (capstone
    dialogue -- Anna and Felix exchange ages, still on Sie). Verified
    every number spelling by hand against standard Hochdeutsch
    (including the two genuine irregular teen forms, sechzehn not
    sechszehn and siebzehn not siebenzehn, and dreißig not dreizig for
    30 -- the three most common places non-native spellings go wrong).
    lesson01/02's matching_pairs (digit-recognition, 8 and 10 pairs
    respectively) are within AUTHORING_GUIDE §16's 6-12 target. No
    fill_in_blank exercises (a bare numeral-to-word or word-to-numeral
    blank was considered but every case has a single unambiguous
    correct form at this vocabulary depth, so ordinary multiple_choice/
    translation/word_order cover it without the added risk). Anna is
    28 and Felix is 31 -- ages stated once in lesson05, consistent with
    them being adult neighbors, not contradicting anything from units
    01-02. Compiled and validated against the real compiler to confirm
    every exercise's tested_text is fully covered by this file's own
    cumulative introduced_tokens.

    Fresh-context review (subagent, Codex unavailable) found 5 issues,
    fixed: (1, real bug, recurrence of the unit01 anti-pattern) 5
    exercises hardcoded an English instruction directly in
    prompt.target_blocks (write_zehn, write_siebzehn,
    choose_zweiunddreissig, write_vierzig, choose_older_age) --
    duplicating the en-de overlay's own instruction field and breaking
    source-agnosticism; emptied all 5 to target_blocks: [] after
    confirming each overlay's instruction already carries the same cue
    on its own (verified against the compiled output: prompt.text_blocks
    now shows only the overlay's English instruction, answer_language_code
    "de", no duplication). (2) added the missing comma+"und" §12 variant
    to en-de's lesson05.exercise07 speak_alter_dialogue to match its
    sibling exercise06. (3) added a comma/and-joined variant to de-en's
    lesson04.exercise06 speak_prices. (4) reworded de-en's
    lesson01.exercise05 order_seven instruction from multiple-choice-style
    phrasing ("Wahlen Sie das Wort...") to word_order-appropriate phrasing
    ("Bilden Sie mit den Kacheln das Wort..."); its single-token
    accepted_answers shape was confirmed functionally correct (word_order
    grading canonicalizes both string and array shapes, and a one-word
    answer is identical either way) so left as-is. (5) reworded
    choose_older_age's instruction (was implying an exclusive
    achtundzwanzig-or-einunddreißig binary while 4 options were actually
    offered) to a framing consistent with the full option set. Re-verified
    clean: correct_option/accepted_answers consistency script, real
    compiler validate+compile for both en-de and de-en directions (0
    errors/warnings), full scripts/verify.sh --content-only green.

    Also noting the coordinator's 2026-07-07 backend fix (67ed7ae):
    grading now supports a case_sensitive overlay flag that correctly
    distinguishes case-only pairs (e.g. unit02's deferred sie/Sie) --
    this unit's own content has no such collision so nothing here
    changes, but the constraint is no longer standing for future units.

    2026-07-07 §19 retrofit: added `example:` (list-shaped, one
    sentence per merged number) to all 8 kind:vocabulary cards. Used 3
    varied, genuinely natural contexts rather than one repetitive
    pattern across all 29 numbers: "Ich habe [N] Äpfel" for 0-10
    (lesson01, simple countable-object counting), "Ich wohne in
    Hausnummer [N]" for 11-20 (lesson02, real house-number usage),
    "Das kostet [N] Euro" for 30-100 (lesson03, real price usage,
    previewing unit07's own Euro-pricing content). schema_version
    bumped to 1.1.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    Checked pacing, token coverage, accepted-answer completeness, number
    spelling, cue/dialogue consistency, and learner-visible wording,
    together with the en-de overlay. Fixes: lesson02.teach.elf_zwoelf /
    dreizehn_bis_sechzehn / siebzehn_bis_zwanzig examples "Ich wohne in
    Hausnummer N." -> "Meine Hausnummer ist N." (10 sentences; overlay
    example_gloss -> "My house number is N."); overlay
    lesson03.teach.dreissig_bis_fuenfzig note and
    lesson03.exercise01.choose_dreissig feedback no longer claim 30 is
    "the one irregular multiple of ten" (zwanzig is too);
    lesson05.teach.line02 note "unit02" -> "Unit 2". NATIVE FLAG: "Ich
    habe null Äpfel." is grammatical but unidiomatic (natives say "keine
    Äpfel") -- kept as a counting demo pending native judgment; the new
    "Meine Hausnummer ist N." examples also want a native glance.
    DEFERRED (pipeline, Codex/frontend lane): listen_select
    lesson05.exercise02 audio_text = tested_text over a full-dialogue
    asset (TTS fallback could speak "einunddreißig" alone).

course:
  realization_key: "de.a1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch). Numbers 21-99 compound in reverse order from English (ones-digit before tens-digit, joined by und, as one word: einundzwanzig, not zwanzig-eins) -- flag this explicitly rather than assume learners will infer it. Anna and Felix continue on the formal Sie register from units 01-02."

