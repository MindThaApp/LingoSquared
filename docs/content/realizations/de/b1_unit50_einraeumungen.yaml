  required_next_reviewer: "native_speaker_pass"
  notes: "Second unit of the de B1 completion wave (units 49-53). Uses Anna (Kellnerin, established a1_unit18) and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-49), continuing the cafe storyline as a debate about opening a second cafe location (Filiale). Formal Sie throughout. Teaches obwohl for a concessive clause before restating a position, zwar...aber to structure a multi-point argument, and trotzdem for a second concessive restatement, matching the spine outcome's requirement to concede a valid point with a concessive connector before restating one's position and to use a stronger contrastive connector than a simple but. Needs fresh-context review. Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked production-prompt determinacy vs exact-match grading, matching_pairs discrimination and lemma forms, distractor validity, untaught tokens, YAML boolean coercion, learner-text jargon. Fixes: de.b1.unit50.lesson03.exercise06.write_full_debate prompt now pins 'bin ich für eine zweite Filiale' (was 'bin ich für ...', so 'bin ich für die zweite Filiale' was a natural answer graded wrong); lesson02.exercise04.match_obwohl_trotzdem pair 'das Bedenken'/'the concern' -> 'die Bedenken'/'the concerns / reservations' (the unit uses the plural; mirrored in en-de overlay). NATIVE FLAG: 'Obwohl ich Bedenken habe, stimme ich Ihnen am Ende zu' -- 'am Ende' is understandable; 'letztendlich'/'im Endeffekt' may be more idiomatic. DEFERRED (owner decision): storyline canon spanning units 48-53 -- canon is Anna = Kellnerin, Felix Weber = Ingenieur (a1_unit18), but b1_unit48 has Anna planning her own cafe, unit 50 has Felix leading a second-location decision and unit 51 has Felix proposing 'dass wir früher schließen' (co-operator role), and unit 51's 'Wenn ich reich wäre, würde ich ein zweites Café eröffnen' is an unreal wish right after unit 50 plans a second location as a real project; needs a storyline decision before b1_unit52/53 consistency can be preserved."

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix. Teach obwohl + verb-final clause to concede a point
    before restating a position, zwar ... aber (with verb-subject
    inversion after zwar) to structure a multi-point argument more
    strongly than a simple aber, and trotzdem (with inversion) for a
    second concessive restatement, so the learner can debate with nuance
    rather than a flat agree/disagree.

