      - content_key: de.b2.unit04.lesson05.eine_geschichte_lesen
        title: "Eine Geschichte lesen"
        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: de.b2.unit04.lesson05.teach.text
            kind: reading
            target:
              text: >-
                Es regnete an diesem Morgen, und ich war müde. Ich hatte
                den Wecker am Abend zuvor nicht gestellt, also wachte ich
                spät auf. Zuerst habe ich den Bus verpasst. Dann bin ich
                zu Fuß zum Bahnhof gegangen. Als ich ankam, war der Zug
                schon weg -- er war schon abgefahren, bevor ich dort war.
                Während ich auf den nächsten wartete, rief mein Chef an.
                Schließlich bin ich zwei Stunden zu spät im Büro
                angekommen.
              language_code: de
              direction: ltr
            introduced_tokens: [wachte, auf, dort, weg, zwei, Stunden, im, Büro]
