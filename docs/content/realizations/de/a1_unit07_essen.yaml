review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Seventh German unit, continuing the Anna/Felix storyline (still on
    the formal Sie register from units 01-06). Scoped to exactly one
    spine outcome (universal.a1.food.order_simple_meal) across all 4
    lessons per AUTHORING_GUIDE §1; prerequisites
    universal.a1.greetings.open_close_exchange and
    universal.a1.numbers.use_basic_numbers are satisfied by units 01
    and 03. Introduces a new realistic detail consistent with (not
    contradicting) prior units: Anna works part-time at a cafe --
    Felix visits her there for the capstone dialogue, giving a natural
    barista/customer framing without inventing a third character.

    The single trickiest real teaching point in this unit: German's
    indefinite article changes for the ACCUSATIVE case (the direct
    object of "möchte") only for MASCULINE nouns -- "der Kaffee"
    becomes "einen Kaffee," but neuter "das Sandwich" stays "ein
    Sandwich" and feminine "die Suppe" stays "eine Suppe" (identical to
    their nominative forms). This is genuinely easy to over-generalize
    (a learner might assume every "ein" becomes "einen" after a verb).
    lesson02 deliberately teaches all three genders side by side
    (einen Kaffee / ein Sandwich / eine Suppe) specifically so the
    masculine-only change is visible by contrast, not asserted in
    isolation the way unit06 contrasted mein/meine and Ihr/Ihre for the
    same reason (grammatical gender agreement, not memorized vocabulary).

    Also flagged: German cafe prices use the Euro symbol placed AFTER
    the number with a space (3 €, not $3 or 3€) -- the reverse
    convention from the shared en realization's "$3" placement, flagged
    explicitly the same way unit04/05 flagged date/time convention
    differences rather than assumed self-evident. lesson03's menu was
    widened to 6 items (added Brot and Salat with their own prices,
    beyond the shared en realization's 4) specifically so
    match_speisekarte_preise clears AUTHORING_GUIDE §16's 6-12 floor
    without inheriting the same shortfall already flagged twice this
    session for the shared en realization's own matching_pairs
    (unit04's match_days/match_months, unit06's match_family_words).
    All 6 prices are distinct (1/2/3/4/5/6 EUR) specifically so
    "cheapest item" has one unambiguous answer (Brot at 1 EUR) rather
    than a tie. No fill_in_blank exercises, same ambiguity-avoidance
    discipline as every prior unit. Applied the hardcoded-English-
    target_blocks lesson from the start: every target_blocks in this
    file is empty or genuine German content only -- a repo-wide grep
    after authoring confirms zero language_code: "en" target_blocks
    anywhere in this file. Compiled and validated against the real
    compiler to confirm every exercise's tested_text is fully covered
    by this file's own cumulative introduced_tokens.

    Fresh-context review (zero access to the authoring reasoning above,
    a genuinely separate pass, per AUTHORING_GUIDE §9): resumed after a
    prior review pass on this same content stalled mid-fix, so every
    finding below was re-derived from scratch, not trusted from any
    prior self-report. Verified: register/storyline consistency against
    units 01/06 (Sie register held throughout, no stray du/dein/informal
    imperative; Anna's new part-time-cafe detail doesn't contradict
    anything established for her in prior units); the accusative-case
    teaching point (einen Kaffee / ein Sandwich / eine Suppe) is
    demonstrated correctly across all three genders; the capstone
    dialogue's price math is internally correct (Kaffee 3 € + Sandwich
    6 € = das macht neun Euro); every exercise's tested_text/word_bank
    traces to this file's own cumulative introduced_tokens (confirmed
    both by the real compiler's 0-error validation and by hand --
    investigated two apparent gaps, lowercase "zum" and the hyphenated
    "Hier-Essen" compound, both tested without their own literal
    introduced_tokens entry, but the compiler's tokenize() casefolds and
    splits on non-word characters, so both already resolve to tokens
    covered by "Zum"/"Hier"/"Essen" -- confirmed false positives, not
    fixed since there's nothing to fix). Sibling-isolation held for the
    de-en pairing (compared this content's own reply_as_leila-equivalent
    exercise against fa-en/nl-en/prs-en's versions of the same shared en
    realization for structural mirroring only, per the task's explicit
    instruction not to consult them for ideas -- wording, instruction
    phrasing, and accepted-answer variant sets all differ genuinely
    across all four, no evidence of templating). One mild stylistic
    observation, not fixed: Anna's capstone-dialogue "Hallo Felix!"
    opener is casual next to unit01's deliberate Guten-Tag-only Sie-
    register discipline (which explicitly swapped out a stray
    "Tschüss" for consistency) -- but native speakers routinely say
    "Hallo" to someone they otherwise address with Sie, so this reads as
    a realistic, legitimate register mix rather than an error, and
    "Hallo" is this lesson's own new-vocabulary teaching point
    (de.a1.unit07.lesson04.teach.hallo) -- left as authored. No jargon
    leaks, no bare yes/no/true/false YAML footguns, no untaught
    vocabulary tested. See the en-de/de-en overlay review notes for the
    §15/content-key fixes this same pass made in those files.

    2026-07-07 §19 retrofit: added `example:` to all 12 kind:vocabulary
    cards. Got the accusative-case gender rule genuinely right across
    the food items (einen Kaffee/Salat -- masculine; ein Wasser/
    Sandwich -- neuter; eine Suppe -- feminine), used article-free
    general statements for Tee/Brot ("Ich trinke gern Tee." / "Ich
    esse gern Brot.") for natural variety instead of repeating the
    same "Ich möchte einen/ein/eine X, bitte" frame for every item,
    and reused the lesson04 dialogue's own lines verbatim in context
    for Hallo/was_moechten_sie/macht_euro (natural, since those cards
    ARE effectively dialogue fragments even though tagged
    kind: vocabulary) -- didn't reclassify their kind, out of scope for
    this retrofit pass. schema_version bumped to 1.1.

    Correction, same day: this file's review.status had been left at
    "reviewed" after the retrofit added 12 new example: sentences --
    a real content addition needing its own fresh-context check,
