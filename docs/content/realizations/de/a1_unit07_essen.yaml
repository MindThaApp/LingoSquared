course:
  realization_key: "de.a1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch). The indefinite article after 'möchte' shifts to the accusative case for masculine nouns only (einen Kaffee), staying unchanged for neuter (ein Sandwich) and feminine (eine Suppe) -- flag this gender-dependent rule explicitly rather than assume learners will infer it. Cafe prices use the Euro symbol after the number with a space (3 €), the reverse of the shared English realization's '$3' placement. Anna and Felix continue on the formal Sie register from units 01-06."

