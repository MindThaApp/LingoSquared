          - {"content_key": "de.a2.unit98.lesson06.exercise02.verstehen_schluessel", "type": "dialogue_comprehension", "tested_text": "Ich habe den Schlüssel vergessen", "prompt": {"target_blocks": [{"text": "What did Felix not do for breakfast, and why?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "de.a2.audio.dialogue.hektischer_morgen.01"}
          - {"content_key": "de.a2.unit98.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Ich bin um halb sieben aufgestanden Ich habe schnell geduscht Ich habe den Schlüssel vergessen Ich bin schnell zur Haltestelle gegangen Um acht Uhr bin ich im Büro angekommen Ich habe frisches Brot eingekauft", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ich bin um halb sieben aufgestanden.", "right": "I got up at half past six."}, {"left": "Ich habe schnell geduscht.", "right": "I showered quickly."}, {"left": "Ich habe den Schlüssel vergessen.", "right": "I forgot the key."}, {"left": "Ich bin schnell zur Haltestelle gegangen.", "right": "I hurried to the bus stop."}, {"left": "Um acht Uhr bin ich im Büro angekommen.", "right": "At eight o'clock I arrived at the office."}, {"left": "Ich habe frisches Brot eingekauft.", "right": "I bought fresh bread."}]}
