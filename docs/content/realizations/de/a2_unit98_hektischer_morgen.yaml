          - {"content_key": "de.a2.unit98.lesson06.teach.anna_hunger", "kind": "dialogue", "target": {"text": "Dann hast du sicher Hunger! Ich habe frisches Brot eingekauft.", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Dann", "hast", "du", "sicher", "Hunger", "Ich", "habe", "frisches", "Brot", "eingekauft"]}
          - {"content_key": "de.a2.unit98.lesson06.teach.felix_danke", "kind": "dialogue", "target": {"text": "Super, danke! Ich komme nach der Arbeit.", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Super", "danke", "Ich", "komme", "nach", "der", "Arbeit"]}
