          - {"content_key": "de.a2.unit98.lesson06.exercise05.antwort_morgen", "type": "dialogue_response", "tested_text": "Ich bin um halb sieben aufgestanden", "prompt": {"target_blocks": [{"text": "Wie war dein Morgen?", "language_code": "de", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit98.lesson06.exercise06.uebersetzen_hunger", "type": "translation", "tested_text": "Dann hast du sicher Hunger", "prompt": {"target_blocks": [{"text": "Then you must be hungry.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit98.lesson06.exercise07.schreiben_nachricht", "type": "writing_prompt", "tested_text": "Ich bin um sieben Uhr aufgestanden Ich habe geduscht Ich habe die Tasche mitgenommen", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences in the perfect tense: (1) you got up at seven o'clock, starting with 'Ich bin'; (2) you showered, starting with 'Ich habe'; (3) you took the bag with you, starting with 'Ich habe'.", "language_code": "en", "direction": "ltr"}]}}
