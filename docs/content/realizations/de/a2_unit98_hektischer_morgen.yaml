          - {"content_key": "de.a2.unit98.lesson05.teach.lesen_nachricht", "kind": "reading", "target": {"text": "Hallo Anna, mein Morgen war hektisch! Um halb sieben bin ich aufgestanden. Zuerst habe ich schnell geduscht, aber ich habe nicht gefrühstückt. Danach habe ich die Tasche mitgenommen, aber ich habe den Schlüssel vergessen. Ich bin zur Haltestelle gegangen und in den Bus eingestiegen. Um acht Uhr bin ich im Büro angekommen. Viele Grüße, Felix", "language_code": "de", "direction": "ltr"}, "introduced_tokens": ["Hallo", "Anna", "mein", "Morgen", "war", "hektisch", "Um", "halb", "sieben", "bin", "ich", "aufgestanden", "Zuerst", "habe", "schnell", "geduscht", "aber", "nicht", "gefrühstückt", "Danach", "die", "Tasche", "mitgenommen", "den", "Schlüssel", "vergessen", "Ich", "zur", "Haltestelle", "gegangen", "und", "in", "Bus", "eingestiegen", "acht", "Uhr", "im", "Büro", "angekommen", "Viele", "Grüße", "Felix"]}
