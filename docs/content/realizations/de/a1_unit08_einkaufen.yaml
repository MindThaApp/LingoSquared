  - {content_key: "de.a1.audio.einkaufen.preisantwort.01", language: "de", text: "Sie kosten zwei Euro das Pfund.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "de.a1.audio.dialog.markt.01"
    language: "de"
    text: "Felix: Was kosten die Äpfel? Anna: Sie kosten zwei Euro das Pfund. Felix: Gut, kann ich zwei Pfund haben, bitte? Anna: Natürlich. Sonst noch etwas? Felix: Ja, auch ein Dutzend Eier. Anna: Das macht acht Euro."
    voice_hint: "two_adults_neutral_friendly"
