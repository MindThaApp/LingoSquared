review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Eighth German unit, continuing the Anna/Felix storyline (still on
    the formal Sie register from units 01-07). Authored from the start
    in the new AUTHORING_GUIDE §19 format (schema_version 1.1) rather
    than retrofitted -- every kind:vocabulary card carries a real
    example: sentence from first draft. Scoped to exactly one spine
    outcome (universal.a1.shopping.ask_prices_quantities) across all 4
    lessons per §1; prerequisites universal.a1.numbers.use_basic_numbers
    and universal.a1.greetings.open_close_exchange are satisfied by
    units 03 and 01.

    Mirrors the shared en/a1_unit08_shopping.yaml realization's own
    kind classification: quantity/price phrases are kind:"phrase" (full
    sentences already, exempt from §19's example requirement) rather
    than kind:"vocabulary" -- only "pro Pfund" (per pound) is a genuine
    short vocabulary card, and it carries a real example ("Äpfel kosten
    zwei Euro pro Pfund"). This mirrors, not reuses, the shared en
    realization's structure -- no English text was consulted for the
    German wording itself beyond the topical parallel (quantities,
    price-asking, price-label-reading, market dialogue).

    Capstone dialogue reuses the shared en realization's exact price
    arithmetic (Äpfel 2€/Pfund x 2 Pfund = 4€, Eier 4€/Dutzend x 1 = 4€,
    total 8€) -- double-checked by hand before writing, given this
    project's two prior real price-arithmetic bugs this session
    (unit07's German and shared-en versions, both since fixed). Felix
    and Anna don't gain a new implied occupation here (Anna already
    has a part-time cafe job from unit07; this scene doesn't add a
    second one) -- but a fresh-context review correctly noted the
    dialogue's actual phrasing ("Kann ich...haben, bitte?" followed by
    "Natürlich. Sonst noch etwas?") genuinely reads like a market-stall
    service exchange regardless of that intent, mirroring the shared
    en realization's own Leila/Daniel phrasing for the same scene.
    Left as authored since it doesn't contradict anything and matches
    the shared realization's own precedent, but flagging honestly
    rather than asserting the "just friends" framing resolves the
    tension it doesn't.

    lesson01's matching_pairs (7 pairs: Pfund/Dutzend/Flasche/Tüte/
    Kilo/Euro/frisch) and lesson03's (6 pairs: the 3 priced items plus
    Wasser/Tomaten/total) both clear AUTHORING_GUIDE §16's 6-12 floor.
    All 3 label prices (Äpfel 2€, Eier 4€, Reis 3€) are distinct so
    "cheapest item" (Äpfel) has one unambiguous answer -- learned from
    the shared en realization's own real bug here (Rice/$3 vs Apples/
    $2, already fixed there) rather than repeating it. No fill_in_blank
    exercises. Applied the hardcoded-English-target_blocks lesson from
    the start: every target_blocks in this file is empty or genuine
    German content only. Compiled and validated against the real
    compiler to confirm every exercise's tested_text is fully covered
    by this file's own cumulative introduced_tokens.

    Fresh-context review (subagent, Codex still usage-exhausted)
    confirmed correct_option/accepted_answers match throughout,
    word_order accepted_answers correctly re-derived (not copied from
    scrambled word_bank), price arithmetic genuinely correct, no
    hardcoded-English-target_blocks, and the overlay's teaching:
    section covers every content_key from the start (no gap like
    units 04-07's retrofit found). It found and fixed: (1) a false
    grammar claim in en-de's sie_kosten_zwei_euro note (claimed the
    verb disambiguates Sie/sie -- it doesn't, German conjugates both
    identically; fixed to correctly attribute disambiguation to
    context alone). (2) missing asterisk-wrapping in match_preisschilder's
    feedback (§15). (3) two forward-reference gaps in matching_pairs:
    lesson01's match_mengen tested "frisch" before lesson02 teaches
    it (removed, 6 pairs remain, still clears §16); lesson03's
    match_preisschilder tested the lesson04-only order total ("acht
    Euro," not establishable from lesson03's own content) --
    replaced with "teuerstes Produkt auf dem Schild" -> "Eier" (a new,
    non-redundant fact derivable entirely from lesson03's own price
    label). (4) added a gender-agreement caveat to ist_es_frisch's
    note (es only applies to neuter nouns; er/sie needed for
    masculine/feminine) to avoid teaching an overgeneralized rule.
    (5) removed an incomplete-paraphrase accepted_answers variant from
    reply_als_anna (dropped 2 of the reply's 4 required clauses).
    Also noted, not changed: the capstone dialogue's phrasing reads
    like a market-stall exchange despite the "just friends shopping"
    framing intent -- flagged honestly in this file's own notes above
    rather than asserted away, since it mirrors the shared en
    realization's own precedent for the same scene and doesn't
    contradict anything. Re-verified clean: real compiler validate
    for en-de (0 errors/warnings), full scripts/verify.sh
    --content-only.

course:
  realization_key: "de.a1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch). Use German-conventional quantity units (Pfund for a pound -- still common informally despite Germany's official metric system -- alongside genuinely metric Kilo). Prices use the Euro-after-number convention (2€, not €2) established in unit07. Anna and Felix continue on the formal Sie register from units 01-07."

