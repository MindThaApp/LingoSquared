review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Seventh German B2 unit; first negotiation unit. Targets the CEFR B2
    negotiation outcome (universal.b2.negotiation.negotiate_and_resolve_
    disagreement): propose terms, push back on unacceptable ones, offer a
    conditional concession, and reach or decline an agreement while
    keeping the relationship intact. Theme: Felix and Frau Vogel negotiate
    how many home-office days per week Felix will work. Lesson arc: L01
    proposing terms (vorschlagen, das Angebot, Ich schlage vor, dass...,
    drei Homeoffice-Tage pro Woche); L02 declining a term (ablehnen, Das
    geht nicht., Das kann ich nicht akzeptieren., reusing leider/möglich
    from unit05); L03 offering a conditional concession (bereit sein,
    zuzustimmen, wenn..., unter der Bedingung, dass..., vorausgesetzt,
    dass...); L04 reaching an agreement (die Einigung, einverstanden,
    Wir haben uns geeinigt., akzeptieren); L05 a reading requirement -- a
    narrated account of the negotiation's terms, refusal, condition, and
    final agreement; L06 the culminating production -- a Felix/Frau Vogel
    negotiation dialogue for the listening requirement, a speaking task
    negotiating aloud (propose, decline, concede conditionally), and a
    writing task doing the same in writing. Register: formal Sie
    throughout, matching the established de lane workplace register.
    Vocabulary is introduced within this file OR carried forward from
    de.b2.unit01-06 (same course row). No sibling-direction file was
    consulted. Priority checks for the fresh-context reviewer: (1) confirm
    "zuzustimmen" (zu + infinitive with the zu- prefix inserted before the
    separable-verb stem, from zustimmen) is correctly formed throughout;
    (2) confirm the final agreed number (two Homeoffice-Tage) is
    consistent across lesson05's reading and lesson06's dialogue -- both
    must agree on the SAME resolved number, not contradict each other;
    (3) the conditional word order after wenn (verb-final) in lesson03;
    (4) the culminating writing exercise's accepted-answer punctuation/
    umlaut-ASCII variants are complete.

