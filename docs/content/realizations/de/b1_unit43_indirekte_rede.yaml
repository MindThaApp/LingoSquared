units:
  - content_key: "de.b1.unit43.indirekte_rede"
    title: "Indirekte Rede"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.reported_speech.report_what_someone_said"
    planned_lesson_count: 3
    lessons:
      - content_key: "de.b1.unit43.lesson01.sagen_dass"
        title: "Er sagte, dass er ..."
        spine_outcome_id: "universal.b1.reported_speech.report_what_someone_said"
        teaching:
          - {content_key: "de.b1.unit43.lesson01.teach.original_frei", kind: "reading", target: {text: "Felix (zu Anna): Ich habe heute frei.", language_code: "de", direction: "ltr"}, introduced_tokens: ["frei"], example: {text: "Original: Felix sagt zu Anna: Ich habe heute frei.", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit43.lesson01.teach.reported_frei", kind: "phrase", target: {text: "Felix sagte, dass er heute frei hat.", language_code: "de", direction: "ltr"}, introduced_tokens: ["sagte", "dass", "er", "hat"], example: {text: "Erzählt: Felix sagte, dass er heute frei hat.", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit43.lesson01.exercise01.recognize_original_frei", type: "multiple_choice", tested_text: "ich habe heute frei", prompt: {target_blocks: [{text: "I have today off. (said directly by Felix to Anna)", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit43.lesson01.exercise02.recognize_reported_frei", type: "multiple_choice", tested_text: "felix sagte dass er heute frei hat", prompt: {target_blocks: [{text: "Felix said that he has today off. (Anna reporting Felix's words about himself)", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit43.lesson01.exercise03.listen_select_reported_frei", type: "listen_select", tested_text: "Felix sagte dass er heute frei hat", media_asset_key: "de.b1.audio.reported_statement_dass.neutral.01", prompt: {target_blocks: [{text: "According to the speaker, what did Felix say about himself?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit43.lesson01.exercise04.match_sagen_dass"
            type: "matching_pairs"
            tested_text: "ich habe heute frei felix sagte dass er heute frei hat"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Ich habe heute frei.", right: "I have today off. (said by Felix)"}
              - {left: "Felix sagte, dass er ...", right: "Felix said that he ..."}
              - {left: "frei", right: "off (free)"}
              - {left: "dass", right: "that"}
              - {left: "sagen", right: "to say"}
              - {left: "sagte", right: "said"}
          - {content_key: "de.b1.unit43.lesson01.exercise05.order_reported_frei", type: "word_order", tested_text: "Felix sagte dass er heute frei hat", prompt: {target_blocks: []}, word_bank: ["Felix", "sagte,", "dass", "er", "heute", "frei", "hat"]}
          - {content_key: "de.b1.unit43.lesson01.exercise06.write_reported_frei", type: "writing_prompt", tested_text: "Felix sagte dass er heute frei hat", prompt: {target_blocks: [{text: "Felix said: \"Ich habe heute frei.\" Report this as Anna telling a colleague what Felix said about himself: Felix said that he has today off.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit43.lesson02.fragen_ob"
        title: "Er fragte, ob ich ..."
        spine_outcome_id: "universal.b1.reported_speech.report_what_someone_said"
        teaching:
          - {content_key: "de.b1.unit43.lesson02.teach.original_question", kind: "reading", target: {text: "Felix (zu Anna): Haben Sie heute Zeit?", language_code: "de", direction: "ltr"}, introduced_tokens: ["Haben"], example: {text: "Original: Felix fragt Anna: Haben Sie heute Zeit?", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit43.lesson02.teach.reported_question", kind: "phrase", target: {text: "Felix fragte mich, ob ich heute Zeit habe.", language_code: "de", direction: "ltr"}, introduced_tokens: ["fragte", "mich", "ob"], example: {text: "Erzählt: Felix fragte mich, ob ich heute Zeit habe.", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit43.lesson02.exercise01.recognize_original_question", type: "multiple_choice", tested_text: "haben Sie heute Zeit", prompt: {target_blocks: [{text: "Do you have time today? (asked directly by Felix to Anna)", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit43.lesson02.exercise02.recognize_reported_question", type: "multiple_choice", tested_text: "felix fragte mich ob ich heute Zeit habe", prompt: {target_blocks: [{text: "Felix asked me whether I had time today. (Anna reporting Felix's question to her)", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit43.lesson02.exercise03.listen_select_reported_question", type: "listen_select", tested_text: "Felix fragte mich ob ich heute Zeit habe", media_asset_key: "de.b1.audio.reported_question_ob.neutral.01", prompt: {target_blocks: [{text: "According to the speaker, what did Felix ask her?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit43.lesson02.exercise04.match_fragen_ob"
            type: "matching_pairs"
            tested_text: "haben sie heute zeit felix fragte mich ob ich heute zeit habe"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Haben Sie heute Zeit?", right: "Do you have time today? (asked to Anna)"}
              - {left: "Felix fragte mich, ob ...", right: "Felix asked me whether ..."}
              - {left: "fragen", right: "to ask"}
              - {left: "ob", right: "whether"}
              - {left: "mich", right: "me"}
              - {left: "fragte", right: "asked"}
          - {content_key: "de.b1.unit43.lesson02.exercise05.order_reported_question", type: "word_order", tested_text: "Felix fragte mich ob ich heute Zeit habe", prompt: {target_blocks: []}, word_bank: ["Felix", "fragte", "mich,", "ob", "ich", "heute", "Zeit", "habe"]}
          - {content_key: "de.b1.unit43.lesson02.exercise06.write_reported_question", type: "writing_prompt", tested_text: "Felix fragte mich ob ich heute Zeit habe", prompt: {target_blocks: [{text: "Felix asked you: \"Haben Sie heute Zeit?\" Report this as Anna telling a colleague what Felix asked, shifting Sie to ich: Felix asked me whether I had time today.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit43.lesson03.cafe_dialogue"
        title: "Dialog: Was Felix gesagt und gefragt hat"
        spine_outcome_id: "universal.b1.reported_speech.report_what_someone_said"
        teaching:
          - {content_key: "de.b1.unit43.lesson03.teach.anna_report_statement", kind: "dialogue", target: {text: "Felix sagte, dass er heute frei hat.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: []}
          - {content_key: "de.b1.unit43.lesson03.teach.kollegin_ask", kind: "dialogue", target: {text: "Und was hat er gefragt?", language_code: "de", direction: "ltr", speaker: "Kollegin"}, introduced_tokens: ["gefragt", "Kollegin"]}
          - {content_key: "de.b1.unit43.lesson03.teach.anna_report_question", kind: "dialogue", target: {text: "Er fragte mich, ob ich heute Zeit habe.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: []}
          - {content_key: "de.b1.unit43.lesson03.teach.kollegin_followup", kind: "dialogue", target: {text: "Und haben Sie geantwortet?", language_code: "de", direction: "ltr", speaker: "Kollegin"}, introduced_tokens: ["geantwortet", "antworten"]}
        exercises:
          - {content_key: "de.b1.unit43.lesson03.exercise01.choose_anna_report_statement", type: "multiple_choice", tested_text: "felix sagte dass er heute frei hat", prompt: {target_blocks: [{text: "What does Anna report that Felix said about himself?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit43.lesson03.exercise02.choose_anna_report_question", type: "multiple_choice", tested_text: "er fragte mich ob ich heute Zeit habe", prompt: {target_blocks: [{text: "What does Anna report that Felix asked her?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit43.lesson03.exercise03.listen_dialogue_indirekte_rede", type: "listen_select", tested_text: "felix sagte dass er heute frei hat er fragte mich ob ich heute Zeit habe", media_asset_key: "de.b1.audio.dialogue.indirekte_rede_cafe.01", prompt: {target_blocks: [{text: "Listen to the dialogue. What did Felix say about himself, and what did he ask Anna?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit43.lesson03.exercise04.match_dialogue_indirekte_rede"
            type: "matching_pairs"
            tested_text: "und was hat er gefragt und haben sie geantwortet"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Und was hat er gefragt?", right: "And what did he ask?"}
              - {left: "Und haben Sie geantwortet?", right: "And did you answer?"}
              - {left: "die Kollegin", right: "the (female) colleague"}
              - {left: "gefragt", right: "asked"}
              - {left: "geantwortet", right: "answered"}
              - {left: "antworten", right: "to answer"}
          - {content_key: "de.b1.unit43.lesson03.exercise05.order_kollegin_ask", type: "word_order", tested_text: "Und was hat er gefragt", prompt: {target_blocks: []}, word_bank: ["Und", "was", "hat", "er", "gefragt?"]}
          - {content_key: "de.b1.unit43.lesson03.exercise06.write_full_indirekte_rede", type: "writing_prompt", tested_text: "Felix sagte dass er heute frei hat Er fragte mich ob ich heute Zeit habe", prompt: {target_blocks: [{text: "As Anna, tell a colleague two things about your conversation with Felix: (1) report what Felix said about himself, using dass (he said that he has today off); (2) report what Felix asked you, using ob and shifting Sie to ich (he asked me whether I had time today).", language_code: "en", direction: "ltr"}]}}
          - {content_key: de.b1.unit43.lesson03.exercise07.dictation_reported_statement, type: dictation, tested_text: "Felix sagte, dass er heute frei hat.", media_asset_key: de.b1.audio.reported_statement_dass.neutral.01, prompt: {target_blocks: []}}
          - {content_key: de.b1.unit43.lesson03.exercise08.dictation_reported_question, type: dictation, tested_text: "Felix fragte mich, ob ich heute Zeit habe.", media_asset_key: de.b1.audio.reported_question_ob.neutral.01, prompt: {target_blocks: []}}
