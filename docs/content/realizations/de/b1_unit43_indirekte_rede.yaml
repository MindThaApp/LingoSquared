review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: "Ninth de B1 unit. Uses Anna (Kellnerin, established a1_unit18) reporting what Felix Weber (Ingenieur, established a1_unit18/b1_unit35-42) told and asked her, continuing the cafe storyline. Formal Sie throughout in the original quotes, matching the de-en lane register pin. Teaches reported STATEMENTS with sagen, dass and a third-person subject (er hat -> distinct construction from unit40's first-person Sie->ich shift), then reported QUESTIONS with fragen, ob, which does require the Sie->ich person-deixis shift because the original question was addressed to the narrator (Anna) -- careful never to have Felix ask Anna about herself in third person mid-dialogue. Needs fresh-context review. Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked realization + en-de overlay for grading (accepted-answer coverage vs prompts, punctuation-normalized grading), distractor ambiguity, gloss/teaching accuracy, register, matching_pairs mirrors. Fixes: de.b1.unit43.lesson01.teach.reported_frei note and de.b1.unit43.lesson01.exercise02.recognize_reported_frei feedback no longer falsely claim 'no pronoun shift' (now explain ich -> er, habe -> hat); register_policy wording corrected to match; de.b1.unit43.lesson03.exercise06.write_full_indirekte_rede accepts the lesson02-taught 'Felix fragte mich, ...' second sentence; Konjunktiv forms ('dass er heute frei habe', 'ob ich heute Zeit haette') added as acceptable_with_note to lesson01.exercise06, lesson02.exercise06 and lesson03.exercise06. NATIVE FLAG: the Kollegin addresses her cafe coworker Anna with Sie ('Und haben Sie geantwortet?' in dialogue audio, teaching card, matching pair, overlay gloss) -- du is more natural between coworkers; left for native/owner decision.\n\nSecond-pass review 2026-10-19: 2 fixes (realization side; overlay has the rest) — de.b1.unit43.lesson03.teach.kollegin_ask: added Kollegin to introduced_tokens (tested in lesson03.exercise04 match pair 'die Kollegin', never taught in the course); de.b1.unit43.lesson03.teach.kollegin_followup: added antworten to introduced_tokens (tested as a match pair, never taught). Overlay notes on both cards now teach the words."

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix in the original quotes, matching the established
    acquaintance-register precedent from a1_unit18 and the de-en lane pin.
    Teach reported statements with sagen, dass and verb-final word order,
    shifting Felix's own ich to er (ich habe -> er hat) because Anna is
    reporting about him. Then teach reported questions with fragen, ob, where the
    original question was addressed to Anna with Sie, so the reported
    version correctly shifts the pronoun to ich, matching the deixis
    pattern already established in unit40.

