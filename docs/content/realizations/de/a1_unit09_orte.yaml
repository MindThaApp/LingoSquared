          - {content_key: "de.a1.unit09.lesson01.teach.restaurant", kind: "vocabulary", target: {text: "Restaurant", language_code: "de", direction: "ltr"}, introduced_tokens: ["Restaurant"], example: {text: "Dieses Restaurant hat gutes Essen.", language_code: "de", direction: "ltr"}}
        exercises:
