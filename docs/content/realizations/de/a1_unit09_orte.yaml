          - {content_key: "de.a1.unit09.lesson01.exercise02.choose_krankenhaus", type: "multiple_choice", tested_text: "Krankenhaus", prompt: {target_blocks: []}}
          - {content_key: "de.a1.unit09.lesson01.exercise03.choose_bank", type: "multiple_choice", tested_text: "Bank", prompt: {target_blocks: []}}
