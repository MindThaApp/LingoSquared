          - {content_key: "de.a1.unit09.lesson02.teach.vor", kind: "phrase", target: {text: "Der Park ist vor dem Krankenhaus.", language_code: "de", direction: "ltr"}, introduced_tokens: ["Der", "vor"]}
        exercises:
