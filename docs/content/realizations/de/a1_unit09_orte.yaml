review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Ninth German unit, continuing the Anna/Felix storyline (still on
    the formal Sie register from units 01-08). Authored from the start
    in the AUTHORING_GUIDE §19 format (schema_version 1.1) -- every
    kind:vocabulary card carries a real example: sentence from first
    draft. Scoped to exactly one spine outcome
    (universal.a1.places.locate_common_places) across all 4 lessons
    per §1; the spine entry itself has no prerequisites.

    The single trickiest real grammar point in this unit: German's
    location prepositions neben, zwischen, hinter, and vor are
    "two-way" (Wechselpräpositionen) that take the DATIVE case for
    static location (as used throughout this unit) but the accusative
    for motion; gegenüber (von) is dative-only, with no
    accusative/motion alternation, but has the same practical effect
    of always needing the dative form here -- not derived as an
    explicit rule here
    (out of scope for a vocabulary/location unit, matching this
    project's established pattern of teaching complex grammar as
    correct fixed phrases rather than deriving rules prematurely, e.g.
    Sie/du in unit01, the accusative-only-for-masculine rule in
    unit07). Every phrase in this file uses the correct dative article
    for its noun's gender (die Bank -> der Bank, das Krankenhaus ->
    dem Krankenhaus, die Apotheke -> der Apotheke, der Park -> dem
    Park, das Restaurant -> dem Restaurant), double-checked by hand
    against real gender assignments before writing.

    lesson01's matching_pairs was widened to 10 pairs (5 places + 5
    prepositions) mirroring the shared en realization's own 10-pair
    set, comfortably clearing AUTHORING_GUIDE §16's 6-12 floor.
    "gegenüber von" contracts colloquially to "gegenüber vom" (von +
    dem) in the capstone dialogue, the natural spoken form, flagged
    explicitly since it's a genuine contraction not a typo. Reuses
    "Entschuldigung" from unit01's polite-expressions lesson in the
    capstone's opening line, a deliberate callback consistent with
    this project's cross-unit vocabulary-reuse discipline. No
    fill_in_blank exercises. Applied the hardcoded-English-
    target_blocks lesson from the start: every target_blocks in this
    file is empty or genuine German content only. Compiled and
    validated against the real compiler to confirm every exercise's
    tested_text is fully covered by this file's own cumulative
    introduced_tokens.

    Fresh-context review (subagent, Codex still usage-exhausted)
    returned verdict: ship -- confirmed correct_option/accepted_answers
    match throughout, word_order accepted_answers correctly re-derived
    (not copied from scrambled word_bank), all noun genders and dative
    forms genuinely correct standard German, "gegenüber vom" a
    genuinely natural spoken contraction, §16 matching_pairs clears
    the floor with 10 real pairs, no hardcoded-English-target_blocks,
    and the overlay's teaching: section covers every content_key from
    the start (no gap like earlier units' retrofit found). It found 4
    minor/non-blocking issues, all fixed: (1) this file's own review
    notes mischaracterized gegenüber as a two-way (Wechselpräposition)
    preposition -- it's dative-only with no accusative/motion
    alternation, though it has the same practical dative-only effect
    here; corrected above. (2-3) two §15 asterisk-wrapping misses in
    the overlay (das Krankenhaus, Sie/sie). (4) a missing comma/
    conjunction-joined §12 variant on speak_wegbeschreibung, matching
    its dialogue_response sibling. Also noted, not changed: the
    capstone dialogue's media_assets entry bakes speaker name labels
    into one text block ("Felix: ... Anna: ...") -- confirmed this is
    the same pre-existing, consistent convention used across every
    prior German unit (01-08) and the shared en realizations, likely
    intended as a human-recording script rather than raw TTS input;
    changing this convention project-wide is out of scope for a single
    unit. Re-verified clean: real compiler validate for en-de (0
    errors/warnings), full scripts/verify.sh --content-only.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked spine scope, register, dative-preposition teaching, dialogue
    cards vs de.a1.audio.dialog.wegbeschreibung.01, character canon,
    token coverage. Fix: lesson04.nach_dem_weg_fragen_dialog title
    'Einen Fremden nach dem Weg fragen' -> 'Nach dem Weg fragen' (Felix
    asks Anna, his established neighbour, not a stranger). No NATIVE
    flags, nothing deferred for this file.

    Second-pass review 2026-10-19: 1 fix --
    lesson04.exercise03.choose_weit_antwort: prompt.target_blocks [] ->
    the lesson's dialogue text (the question asks about the dialogue,
    which was never shown on screen). Overlay-side fixes are recorded in
    the en-de overlay.

course:
  realization_key: "de.a1"
