          - {content_key: "de.a1.unit09.lesson01.teach.krankenhaus", kind: "vocabulary", target: {text: "Krankenhaus", language_code: "de", direction: "ltr"}, introduced_tokens: ["Krankenhaus"], example: {text: "Mein Freund ist im Krankenhaus.", language_code: "de", direction: "ltr"}}
