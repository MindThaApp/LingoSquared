            type: listen_select
            tested_text: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt"
            media_asset_key: de.c1.audio.was_waere_gewesen_wenn.vergangenheit.01
            prompt: {target_blocks: []}
          - content_key: de.c1.unit05.lesson01.exercise03.match_vergangenheit
            type: matching_pairs
            tested_text: "damals anders entschieden hätten gewusst hätte das teurere System die Entscheidung gekommen"
            prompt: {target_blocks: []}
            pairs:
              - {left: "damals", right: "back then (at that past time)"}
              - {left: "anders", right: "differently"}
              - {left: "entschieden hätten", right: "would have decided (unreal past)"}
              - {left: "gewusst hätte", right: "would have known (unreal past)"}
              - {left: "das teurere System", right: "the more expensive system"}
              - {left: "die Entscheidung", right: "the decision"}
          - content_key: de.c1.unit05.lesson01.exercise04.order_vergangenheit
            type: word_order
            tested_text: "Wenn wir uns damals anders entschieden hätten"
            prompt: {target_blocks: []}
            word_bank: [Wenn, wir, uns, damals, anders, entschieden, hätten]
          - content_key: de.c1.unit05.lesson01.exercise05.translate_vergangenheit
            type: translation
            tested_text: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt"
            prompt: {target_blocks: [{text: "Translate into German, using Wenn ... entschieden hätten, hätten ...: If we had decided on the more expensive system back then, we would not have had these problems.", language_code: en, direction: ltr}]}
          - content_key: de.c1.unit05.lesson01.exercise06.speak_vergangenheit
            type: speak_response
            tested_text: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt"
            prompt: {target_blocks: [{text: "Say aloud in German: If we had decided on the more expensive system back then, we would not have had these problems.", language_code: en, direction: ltr}]}
          - content_key: de.c1.unit05.lesson01.exercise07.write_vergangenheit
            type: writing_prompt
            tested_text: "Wenn ich das früher gewusst hätte, hätte ich anders entschieden"
            prompt: {target_blocks: [{text: "Write in German, using Wenn ich ... gewusst hätte, hätte ich ...: If I had known that earlier, I would have decided differently.", language_code: en, direction: ltr}]}

