            example: {text: "Das teurere System wäre besser.", language_code: de, direction: ltr}
          - content_key: de.c1.unit05.lesson01.teach.die_entscheidung
            kind: vocabulary
            target: {text: "die Entscheidung", language_code: de, direction: ltr}
            introduced_tokens: [Entscheidung]
            example: {text: "Die Entscheidung war falsch.", language_code: de, direction: ltr}
          - content_key: de.c1.unit05.lesson01.teach.vergangenheit_muster
            kind: grammar_note
            target: {text: "Wenn wir uns damals für das teurere System entschieden hätten, hätten wir diese Probleme nicht gehabt.", language_code: de, direction: ltr}
            introduced_tokens: [für]
        exercises:
