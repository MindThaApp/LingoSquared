  authoring_system: claude
  human_reviewed: false
  notes: >-
    Fifth German C1 unit, continuing the de C1 tier after c1_unit01
    (strukturierung), c1_unit02 (zwischen_den_zeilen), c1_unit03
    (der_richtige_ton), and c1_unit04 (zugestehen_und_abwaegen). No usable
    public-domain German C1 counterfactual-grammar source was found: a fresh
    firecrawl search returned only proprietary commercial and exam-prep pages
    (goethe.de, deutschakademie.de, sprachschule-aktiv.de, deutsch-perfekt.com),
    categorically excluded per AUTHORING_GUIDE §10, and the sole verified
    public-domain German source (the FSI German Basic Course, US government
    work) caps at a basic/intermediate level with no advanced C1 counterfactual
    material. This is established-conventions-only authoring, built from
    general knowledge of German Konjunktiv II counterfactual conventions. The
    structural template is de C1 unit04 (same tier, same lesson/exercise
    pacing, same formal-Sie register policy); every word of actual German text
    is freshly authored, not translated from any sibling file, and the scenario
    is unrelated. Felix Weber (Ingenieur, established a1_unit18) and Frau Vogel
    (his colleague, first introduced b1_unit52) continue their formal-Sie
    workplace register. No sibling-direction file (de-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Fifth German C1 unit. Targets
    universal.c1.hypothesis.reason_about_counterfactuals (reason about unreal
    and counterfactual situations -- mixed conditionals, hypothetical
    consequences, and regrets -- describing how things could or would have
    been different). Theme: the company chose the cheaper software system last
    year, and Felix Weber and Frau Vogel reason counterfactually about that
    decision -- what actually happened, what would have been different, and
    what they regret. The lesson arc mirrors the outcome's four assessment
    requirements: L01 the past unreal conditional (Wenn ... haette/waere +
    Partizip II, ... haette/waere + Partizip II), L02 the mixed conditional
    (past unreal condition -> present consequence, wären wir heute zufriedener),
    L03 regret expressions (bedauern, bereuen, es wäre besser gewesen, im
    Nachhinein), L04 tracing a counterfactual chain in reading (separating the
    real timeline from every hypothetical alternative), L05 reasoning
    counterfactually in speech (mixed counterfactual + regret), L06 the
    culminating full analysis -- listening (follow a chain of counterfactual
    reasoning), reading (already covered in L04), speaking AND writing (each
    produce the same analysis: one past counterfactual, one mixed conditional
    with a present consequence, and one expression of regret, in that order).
    Register: formal Sie throughout, including inside the regret lines. Priority
    checks for the fresh-context reviewer: (1) formal Sie is consistent and
    never slips into du; (2) the culminating speaking AND writing exercises
    (lesson06, and the speaking in lesson05) BOTH deliver the regret component
    -- the regret is genuinely expressed, never merely named in the instruction
    and absent from the accepted answer; (3) the two dialogue-comprehension
    exercises agree with each other and with the bound audio on what each
    speaker actually says, with no contradictory characterization of the same
    detail; (4) the dialogue cards and the dictation match their bound audio
    asset sentence-for-sentence, with internal punctuation identical; (5) the
    accepted-answer variants for the multi-sentence analysis are complete
    (trailing-period and ascii-umlaut forms) so a correct learner is never
    marked wrong.

course:
  realization_key: de.c1
  target_language_first: true
  dialect: de_DE_standard
  register_policy: >-
    Clear Standard German (Hochdeutsch). Formal Sie throughout, matching the
    established de lane workplace register -- Felix Weber and Frau Vogel,
    established colleagues from the de B1/B2 tiers, address each other with
    Sie in every scene. C1 counterfactual reasoning layers Konjunktiv II
    (haette/waere + Partizip II, mixed conditionals) and regret expressions
    (bedauern, es wäre besser gewesen) onto that register, all delivered in
    the same formal Sie address, never slipping into du.

