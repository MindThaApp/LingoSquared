review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Fifth German unit, continuing the Anna/Felix storyline (still on the
    formal Sie register between them established in units 01-04) and
    reusing the Bibliothek setting from unit04's capstone dialogue for
    unit05's own capstone (this time about the library's actual daily
    opening hours, not a one-off reopening date). Scoped to exactly one
    spine outcome (universal.a1.time.ask_tell_time) across all 4 lessons
    per AUTHORING_GUIDE §1; prerequisite
    universal.a1.numbers.use_basic_numbers is satisfied by unit03.

    The single trickiest real teaching point in this unit: German
    "halb vier" means HALF PAST THREE (3:30), not half past four --
    unlike English, German names the half-hour by the hour it is
    counting TOWARD, not the hour it just passed. This is a well-known,
    genuine trap for English-speaking learners (a literal word-for-word
    reading of "halb vier" naturally suggests 4:30). lesson01 teaches it
    explicitly as its own worked example rather than folding it in
    quietly next to "drei Uhr," and lesson01's multiple_choice exercise
    for it (in the en-de overlay) includes both "Es ist halb fünf"
    (4:30, an off-by-one slip in the correct direction) and "Es ist
    halb drei" (2:30, the genuine backward/calque reading a learner
    might reach for by treating "halb vier" like English "half four")
    as distractors, so the exercise actually probes the direction of
    the rule rather than just a worked example. Also flagged:
    German commonly states OFFICIAL/schedule hours on the 24-hour clock
    (achtzehn Uhr = 6 PM) even though everyday casual time-telling uses
    the 12-hour convention with Viertel nach/vor -- both conventions are
    real and co-exist, so lesson03/04's store and library hours use
    24-hour "Uhr" times deliberately, contrasted with lesson01/02's
    casual 12-hour phrasing, exactly the way English's shared
    en/a1_unit05_time.yaml explicitly flags its own 12-hour-vs-AM/PM
    convention rather than presenting one form as the only way.
    Standard nach/vor quarter-hour phrasing was used (not the regional
    southern-German/Austrian "viertel vier" = 3:15 form) to stay
    unambiguous and consistent with what most learners' materials teach.

    lesson03 teaches 6 day-part/time-of-day terms (Morgen, Mittag,
    Nachmittag, Abend, Nacht, Mitternacht) rather than only the 4 the
    shared en realization's equivalent lesson uses, specifically so its
    matching_pairs clears AUTHORING_GUIDE §16's 6-12 target comfortably
    (paired against approximate hour-ranges, e.g. 6-12 Uhr = Morgen).
    lesson04's capstone dialogue reuses "sie" (lowercase, third-person,
    referring to the feminine noun "die Bibliothek") exactly the way
    unit04's own capstone did -- flagged there by review as a real but
    non-blocking pedagogical note (it's ordinary correct German, not a
    collision with the Sie/formal-you distinction, and grading is
    unaffected since this file doesn't need the case_sensitive flag);
    continuing the same usage here consistently rather than avoiding it
    artificially. No fill_in_blank exercises, same ambiguity-avoidance
    discipline as every prior unit. Applied the hardcoded-English-
    target_blocks lesson from the start: every target_blocks in this
    file is empty or genuine German content only -- a repo-wide grep
    after authoring confirms zero language_code: "en" target_blocks
    anywhere in this file. Compiled and validated against the real
    compiler to confirm every exercise's tested_text is fully covered
    by this file's own cumulative introduced_tokens.

    Fresh-context review (subagent, Codex still usage-exhausted; the
    review deliberately did not open any sibling-direction overlay for
    this realization, per the standing isolation rule) confirmed this
    file itself has zero hardcoded-English-target_blocks instances, the
    "halb vier"/24-hour-schedule-convention claims are genuine standard
    German, §16 matching_pairs clears the floor, and read_schild is a
    genuinely distinct reading exercise, not a listening duplicate. It
    found one BLOCKING issue, in de-en/a1_unit05.yaml only (not this
    file): 3 word_order exercises had accepted_answers copied verbatim
    from the (deliberately scrambled) word_bank/tile order instead of
    the grammatically correct order, which would have marked a correct
    learner answer wrong -- fixed all 3. Minor fixes also applied: a
    §15 asterisk-marking slip (German words wrapped in asterisks inside
    German-language prose, where only target-language English should
    be wrapped) in de-en/a1_unit05.yaml's halb-vier explanation; a §12
    gap in en-de/a1_unit05.yaml's speak_oeffnungszeiten (missing the
    comma+"und" variant its typed sibling has); and the distractor-set
    improvement described above. Re-verified clean after every fix:
    real compiler validate+compile for both en-de and de-en directions
    (0 errors/warnings), full scripts/verify.sh --content-only.

course:
  realization_key: "de.a1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch). Casual time-telling uses the 12-hour convention with nach/vor for quarter hours and the reversed half-hour rule (halb vier = 3:30, naming the hour it's counting toward, not the hour just passed). Official/schedule hours (store and library opening times) use the 24-hour clock (achtzehn Uhr = 6 PM) -- both conventions are real and co-exist, flag this explicitly rather than presenting only one. Anna and Felix continue on the formal Sie register from units 01-04."

