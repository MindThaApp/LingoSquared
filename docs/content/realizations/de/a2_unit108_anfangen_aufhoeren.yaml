  notes: "Drafted by Claude Sonnet. Realizes universal.a2.habits.describe_starting_stopping_trying. Grammar: anfangen / aufhoeren / versuchen / vergessen with zu + infinitive (zu inside separable verbs: aufzustehen, einzukaufen, anzurufen), the perfect of these verbs (hat angefangen, hat aufgehoert, hat versucht, hat vergessen), present forms of anfangen and aufhoeren (separable, fange an), nicht mehr / wieder / seit. Canon: Felix started jogging, Jonas stopped playing on his phone in the evening, Nina tried to get up early, Anna forgot to buy bread. OPEN NATIVE QUESTIONS: (1) Commas: 'Ich habe angefangen zu joggen' without comma but 'Felix hat angefangen, Yoga zu machen' with a comma - consistent enough for A2 (optional comma with extended infinitive)? (2) 'am Handy spielen' - natural, or better 'mit dem Handy spielen'? (3) 'Jetzt schlafe ich besser' - fine? (4) 'Ich habe mit dem Rauchen aufgehoert' as a second structure at A2."
