review: {status: "unreviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Sixth de B1 unit. Uses Anna (Kellnerin, established a1_unit18) recounting a workday at the cafe, and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-39), matching established roles. Formal Sie throughout in dialogue, matching the de-en lane register pin. Teaches waehrend + Praeteritum for background-vs-mainline sequencing, contrasted with the Perfekt already used for simple past narration, plus reported speech with the person-deixis shift (Sie->ich) when a quote addressed to the narrator is reported. Needs fresh-context review."}

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Use formal Sie throughout the
    Anna/Felix dialogue, matching the established acquaintance-register
    precedent from a1_unit18 and the de-en lane pin. Teach während + Präteritum
    to mark a background action against a Präteritum main-line event with a
    sequencing connector (dann), contrasted with the Perfekt learners already
    know for simple past statements. Teach reported speech with sagte, dass,
    explicitly shifting the addressee pronoun from the original quote's Sie
    to ich when the narrator reports a statement that was addressed to them.

