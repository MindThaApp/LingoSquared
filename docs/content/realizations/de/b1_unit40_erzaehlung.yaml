slightly stilted ('Das glaube ich!' / 'Bestimmt!' more idiomatic); course spelling 'Cafe' vs Duden 'Café' (typed 'Café' likely grades only as almost). DEFERRED: none.\n\nSecond-pass review 2026-10-19: 3 fixes — de.b1.unit40.lesson03.exercise06.write_full_narrative: added accepted variants with 'Felix sagte' (taught lesson02 form) for sentence 3, 'klingelte das Telefon plötzlich' word order, and Duden spelling 'Café'; de.b1.unit40.lesson01.exercise06.write_waehrend: added main-clause-first order 'Das Telefon klingelte, während ich im Cafe arbeitete.' and 'Café' spelling variants; de.b1.unit40.lesson03.teach.friend_ask: 'Freundin' added to introduced_tokens and the note, since match_dialogue_cafe tests 'die Freundin' which had only appeared as a speaker label. NATIVE FLAGS: course-wide 'Cafe' vs Duden 'Café' (only these two writing prompts now accept Café); indicative 'dass ich ... bin' in reported speech rather than Konjunktiv I 'sei' (pinned by instruction, colloquially fine)."

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Use formal Sie throughout the
    Anna/Felix dialogue, matching the established acquaintance-register
    precedent from a1_unit18 and the de-en lane pin. Teach während + Präteritum
    to mark a background action against a Präteritum main-line event with a
    sequencing connector (dann), contrasted with the Perfekt learners already
    know for simple past statements. Teach reported speech with sagte, dass,
    explicitly shifting the addressee pronoun from the original quote's Sie
    to ich when the narrator reports a statement that was addressed to them.

