      - content_key: de.a2.unit99.lesson06.felix_und_anna
        title: "Felix und Anna"
        spine_outcome_id: universal.a2.past.describe_past_habits
        teaching:
          - {"content_key": "de.a2.unit99.lesson06.teach.felix_frage", "kind": "dialogue", "target": {"text": "Anna, was hast du früher gemacht?", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Anna", "was", "hast", "du", "früher", "gemacht"]}
          - {"content_key": "de.a2.unit99.lesson06.teach.anna_schule", "kind": "dialogue", "target": {"text": "Früher war ich Schülerin. Ich hatte viel Zeit und konnte lange schlafen.", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Früher", "war", "ich", "Schülerin", "Ich", "hatte", "viel", "Zeit", "und", "konnte", "lange", "schlafen"]}
          - {"content_key": "de.a2.unit99.lesson06.teach.felix_jetzt", "kind": "dialogue", "target": {"text": "Und jetzt?", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Und", "jetzt"]}
          - {"content_key": "de.a2.unit99.lesson06.teach.anna_jetzt", "kind": "dialogue", "target": {"text": "Jetzt arbeite ich im Café. Ich muss früh aufstehen, aber ich bin glücklich.", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Jetzt", "arbeite", "ich", "im", "Café", "Ich", "muss", "früh", "aufstehen", "aber", "bin", "glücklich"]}
          - {"content_key": "de.a2.unit99.lesson06.teach.anna_frage", "kind": "dialogue", "target": {"text": "Und du? Was wolltest du als Kind werden?", "language_code": "de", "direction": "ltr", "speaker": "Anna"}, "introduced_tokens": ["Und", "du", "Was", "wolltest", "als", "Kind", "werden"]}
          - {"content_key": "de.a2.unit99.lesson06.teach.felix_traum", "kind": "dialogue", "target": {"text": "Als Kind wollte ich Ingenieur werden. Jetzt bin ich Ingenieur!", "language_code": "de", "direction": "ltr", "speaker": "Felix"}, "introduced_tokens": ["Als", "Kind", "wollte", "ich", "Ingenieur", "werden", "Jetzt", "bin"]}
        exercises:
          - {"content_key": "de.a2.unit99.lesson06.exercise01.hoeren_frage", "type": "listen_select", "tested_text": "Anna was hast du früher gemacht", "media_asset_key": "de.a2.audio.dialogue.frueher_und_jetzt.01", "prompt": {"target_blocks": []}}
          - {"content_key": "de.a2.unit99.lesson06.exercise02.verstehen_anna", "type": "dialogue_comprehension", "tested_text": "Früher war ich Schülerin Ich hatte viel Zeit", "prompt": {"target_blocks": [{"text": "What was Anna's life like before?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "de.a2.audio.dialogue.frueher_und_jetzt.01"}
          - {"content_key": "de.a2.unit99.lesson06.exercise03.paare_dialog", "type": "matching_pairs", "tested_text": "Was hast du früher gemacht Ich hatte viel Zeit Ich konnte lange schlafen Ich muss früh aufstehen Was wolltest du als Kind werden Jetzt bin ich Ingenieur", "prompt": {"target_blocks": []}, "pairs": [{"left": "Was hast du früher gemacht?", "right": "What did you do before?"}, {"left": "Ich hatte viel Zeit.", "right": "I had a lot of time."}, {"left": "Ich konnte lange schlafen.", "right": "I could sleep late."}, {"left": "Ich muss früh aufstehen.", "right": "I have to get up early."}, {"left": "Was wolltest du als Kind werden?", "right": "What did you want to be as a child?"}, {"left": "Jetzt bin ich Ingenieur.", "right": "Now I am an engineer."}]}
          - {"content_key": "de.a2.unit99.lesson06.exercise04.ordnen_wolltest", "type": "word_order", "tested_text": "Was wolltest du als Kind werden", "prompt": {"target_blocks": []}, "word_bank": ["du", "Kind", "was", "werden", "wolltest", "als"]}
          - {"content_key": "de.a2.unit99.lesson06.exercise05.antwort_kind", "type": "dialogue_response", "tested_text": "Als Kind wollte ich Ingenieur werden", "prompt": {"target_blocks": [{"text": "Und du? Was wolltest du als Kind werden?", "language_code": "de", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit99.lesson06.exercise06.uebersetzen_glueck", "type": "translation", "tested_text": "Ich muss früh aufstehen aber ich bin glücklich", "prompt": {"target_blocks": [{"text": "I have to get up early, but I'm happy.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "de.a2.unit99.lesson06.exercise07.schreiben_dreisaetze", "type": "writing_prompt", "tested_text": "Früher war ich Schülerin Ich hatte viel Zeit Jetzt arbeite ich", "prompt": {"target_blocks": [{"text": "Write exactly three German sentences: (1) you used to be a school pupil, starting with 'Früher war ich' and ending with Schülerin; (2) you had a lot of time, starting with 'Ich hatte'; (3) now you work, starting with 'Jetzt arbeite'.", "language_code": "en", "direction": "ltr"}]}}
