          - {"content_key": "de.a2.unit99.lesson05.exercise03.paare_jonas", "type": "matching_pairs", "tested_text": "Ich hatte ein Fahrrad Ich musste jeden Tag zur Schule fahren Ich konnte nicht oft ins Kino gehen Jetzt studiere ich in der Stadt Ich habe viele Freunde Das Dorf besuche ich immer noch oft", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ich hatte ein Fahrrad.", "right": "I had a bike."}, {"left": "Ich musste jeden Tag zur Schule fahren.", "right": "I had to ride to school every day."}, {"left": "Ich konnte nicht oft ins Kino gehen.", "right": "I couldn't go to the cinema often."}, {"left": "Jetzt studiere ich in der Stadt.", "right": "Now I study in the city."}, {"left": "Ich habe viele Freunde.", "right": "I have lots of friends."}, {"left": "Das Dorf besuche ich immer noch oft.", "right": "I still visit the village often."}]}
