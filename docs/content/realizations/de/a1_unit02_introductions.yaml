    language: "de"
    text: "Felix: Guten Tag! Anna: Guten Tag! Wie heißen Sie? Felix: Ich heiße Felix. Und Sie? Anna: Ich heiße Anna. Freut mich. Felix: Ganz meinerseits. Woher kommen Sie? Anna: Ich komme aus Deutschland. Und Sie? Felix: Ich komme aus England. Anna: Auf Wiedersehen! Felix: Auf Wiedersehen!"
