review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Second German (de) unit, continuing the Anna/Felix storyline from
    unit01 (they met as neighbors in the stairwell, exchanged greetings
    and wellbeing, but parted without exchanging names). This unit opens
    a few days later at a bus stop -- a fresh, plausible second encounter
    rather than an implausible instant reunion, giving the "recurring
    characters keep running into each other" continuity texture other
    languages' storylines already use. Scoped to exactly one spine
    outcome (universal.a1.introductions.exchange_identity) across all 5
    lessons per AUTHORING_GUIDE §1, matching unit01's discipline and
    fa's clean one-outcome-per-unit precedent (no script-ramp lesson
    needed here either, since German is Latin-script).

    Deliberate A1 scoping decision: lesson02 teaches only first/second-
    person "ich bin / du bist" (matching the spine's actual can_do --
    "exchange names and basic identity information," which only requires
    self-identification and asking someone else, not describing a third
    party). Third-person er/sie ist is deliberately deferred to a later
    grammar-focused unit: introducing "sie" (she) here would create a
    genuine capitalization homograph with unit01's already-taught "Sie"
    (formal you) whenever it appears sentence-initially (German
    capitalizes every sentence-initial word regardless), which cannot be
    cleanly demonstrated in a lesson this short without added scaffolding
    vocabulary the spine doesn't call for. Avoiding it here is a real
    scoping choice, not an oversight -- flagging for whoever authors the
    later grammar unit that covers er/sie/es.

    lesson03's country list (Deutschland, England, Frankreich, Italien,
    Spanien, Russland) deliberately teaches the country NOUNS only, not
    the gendered nationality nouns (Deutscher/Deutsche, Engländer/
    Engländerin, etc.) or predicate-adjective forms -- "Ich komme aus
    +country" (lesson04) is grammatically regular and gender-free, a
    cleaner A1 first exposure than the irregular/gendered nationality
    noun system (Franzose/Französin is genuinely irregular), which is
    better suited to its own later unit. lesson03's matching_pairs pools
    all 6 countries, within AUTHORING_GUIDE §16's 6-12 target (deliberately
    widened from unit01's 4-item vocab lists specifically so this
    exercise clears the target comfortably, not left at a bare minimum).
    Anna is established as coming from Germany and Felix from England,
    consistent with their being neighbors in a German-speaking city
    (Felix as the foreign resident) -- a detail future units should not
    contradict. No fill_in_blank exercises, same ambiguity-avoidance
    discipline as unit01. Every multi-clause accepted-answer combination
    was authored with period/comma/conjunction-joined variants where a
    genuine two-clause reply exists (lesson01's name+pleasure exchange,
    lesson04's origin+return-question exchange). Compiled and validated
    against the real compiler to confirm every exercise's tested_text is
    fully covered by this file's own cumulative introduced_tokens (the
    per-file untaught-vocabulary check resets per file, so unit01's
    already-taught du/Sie/Guten Tag/etc. are deliberately re-listed here
    wherever actually tested). A fresh-context review (Codex was
    usage-exhausted; a no-prior-context subagent ran the equivalent
    review) found and this fixed: (1) a real spine-coverage gap -- no
    exercise tested read_basic_profile (reading modality) at all, only
    listening/speaking/writing were covered -- added lesson05.teach.
    steckbrief (a short written "Name: Felix. Land: England." profile
    card) plus two new reading_comprehension exercises extracting the
    name and country from it. (2) a register inconsistency in the
    de-en overlay (a different overlay, paired with the existing
    en/a1_unit02_introductions.yaml, not this file) where the Daniel/
    Leila library dialogue's teaching notes mixed du and Sie for the
    same fictional exchange -- fixed to a consistent Sie throughout,
    matching the exercise instruction that was already correct. (3) an
    isolated, out-of-context gloss ("Sie ist Ingenieurin.") that was
    itself an instance of the exact sie/Sie capitalization ambiguity
    this unit's own scoping decision exists to avoid -- clarified with
    an explicit referent. Re-validated and re-compiled clean (0 errors/
    0 warnings) after every fix, including the full project scripts/
    verify.sh --content-only. Still pending an actual human (or Codex,
    once usage resets) reviewer per standard governance -- this AI
    review does not itself satisfy §9.

    Follow-up 2026-07-07: after the same hardcoded-English-target_blocks
    anti-pattern recurred in unit03 (having already been fixed once in
    unit01), the coordinator asked for a targeted re-check of this unit
    specifically, since it predates unit03's review catching the bug
    class as recurring. Found 3 more instances that had escaped this
    unit's own earlier review: lesson02.exercise05.write_ich_bin,
    lesson03.exercise05.write_italien, lesson03.exercise06.write_spanien
    all hardcoded their en-de overlay's own instruction text directly
    into prompt.target_blocks. Confirmed each overlay's instruction
    already carries the identical cue on its own, then emptied all 3 to
    target_blocks: [] (matching every other exercise in the file) --
    verified against the compiled output that prompt.text_blocks for
    each now shows only the overlay's English instruction with no
    duplication. A repo-wide grep confirms zero remaining
    language_code: "en" target_blocks anywhere under
    docs/content/realizations/de/. Re-verified clean: real compiler
    validate+compile for en-de (0 errors/warnings), full scripts/
    verify.sh --content-only green.

    2026-07-07 §19 retrofit: added `example:` to all 6 kind:vocabulary
    cards (the 6 country names in lesson03), each using "Ich komme aus
    [Land]." -- a genuine, natural sentence that also directly previews
    lesson04's own "komme aus + country" grammar point, reinforcing
    rather than duplicating what's about to be taught. schema_version
    bumped to 1.1.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    Checked pacing, token coverage, accepted-answer completeness against
    taught forms, cue/dialogue consistency, register, and
    learner-visible wording, together with the en-de overlay. Fixes:
    de.a1.unit02.lesson05.exercise06.reply_as_anna and
    lesson05.exercise07.speak_bushaltestelle_dialogue
    prompt.target_blocks "Guten Tag! Wie heißen Sie? ... Ganz
    meinerseits. Woher kommen Sie?" -> "Ich heiße Felix. Und Sie?" (the
    cue opened with Anna's own line, and 'Ganz meinerseits' preceded the
    'Freut mich' the learner is asked to produce); overlay side:
    instructions now say "the formal goodbye" (Tschüss was taught), "Ich
    bin Anna. ..." variant (+ unpunctuated) accepted for both, 'heisse'
    variants added to exercise07 for parity with exercise06, exercise06
    instruction de-sequenced to match the cue;
    lesson01.exercise05.reply_and_pleased "A friend" -> "Someone your
    age"; internal token "unit01" -> "Unit 1" in 7 learner-visible
    overlay notes/feedback. No NATIVE flags. DEFERRED (pipeline,
    Codex/frontend lane): listen_select lesson05.exercise02 audio_text =
    tested_text over a full-dialogue asset (TTS fallback could speak
    only the answer).

    Second-pass review 2026-10-19 (course-wide consistency fix from the
    unit05-08 batch): 1 fix -- lesson05.exercise08.read_profile_name and
    exercise09.read_profile_country: target_blocks were empty, so the
    profile card the instructions say to read was never shown on screen
    (the compiler renders only instruction + target_blocks) -- added
    'Name: Felix. Land: England.' as the prompt's target block.

course:
  realization_key: "de.a1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: "Teach clear Standard German (Hochdeutsch). Continue unit01's Sie/du distinction: Anna and Felix stay on Sie throughout this unit too, since exchanging names on a second casual encounter doesn't by itself move German speakers to du -- that shift is a deliberate, separate social step, not automatic."

