review: {status: "reviewed", required_next_reviewer: "fresh_context_reviewer", notes: "Seventh de B1 unit. Uses Anna (Kellnerin, established a1_unit18) and Felix Weber (Ingenieur, established a1_unit18/b1_unit35-40) planning a Sunday hike, matching established roles. Formal Sie throughout, matching the de-en lane register pin. Teaches real/likely wenn-conditionals with present tense in both clauses (distinct from unit37's unreal Konjunktiv II wenn-conditionals and unit35's könnte-hedged wenn-clause), plus negating the condition with nicht to express \"if not.\" Needs fresh-context review."}

course:
  realization_key: "de.b1"
  target_language_first: true
  dialect: "de_DE_standard"
  register_policy: >-
    Teach clear Standard German (Hochdeutsch). Continue formal Sie between
    Anna and Felix, matching the established acquaintance-register
    precedent from a1_unit18 and the de-en lane pin. Teach real/likely
    wenn-conditionals with present tense in both clauses (condition +
    result), then negate the condition with nicht to express "if not,"
    contrasted with the unreal/counterfactual Konjunktiv II conditionals
    already taught in unit37.

media_assets:
  - {content_key: "de.b1.audio.real_conditional_positive.neutral.01", language: "de", text: "Wenn es morgen regnet, bleibe ich zu Hause.", voice_hint: "neutral_adult_female", status: "pending_generation"}
  - {content_key: "de.b1.audio.real_conditional_negated.neutral.01", language: "de", text: "Wenn es morgen nicht regnet, gehen wir wandern.", voice_hint: "neutral_adult_female", status: "pending_generation"}
  - content_key: "de.b1.audio.dialogue.bedingungen_wanderung.01"
    language: "de"
    text: >-
      Anna: Wenn es morgen regnet, bleibe ich zu Hause. Felix: Und wenn es
      nicht regnet? Anna: Wenn es nicht regnet, gehen wir wandern. Felix:
      Gut, wenn Sie Zeit haben, treffen wir uns um neun.
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "de.b1.unit41.bedingungen"
    title: "Bedingungen"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.conditions.express_real_conditions"
    planned_lesson_count: 3
    lessons:
      - content_key: "de.b1.unit41.lesson01.wenn_real_positive"
        title: "Wenn es regnet, ..."
        spine_outcome_id: "universal.b1.conditions.express_real_conditions"
        teaching:
          - {content_key: "de.b1.unit41.lesson01.teach.wenn_regnet_bleibe", kind: "phrase", target: {text: "Wenn es morgen regnet, bleibe ich zu Hause.", language_code: "de", direction: "ltr"}, introduced_tokens: ["regnet", "regnen", "morgen", "bleibe", "bleiben", "zu", "Hause"], example: {text: "Plan: Wenn es morgen regnet, bleibe ich zu Hause.", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit41.lesson01.teach.wenn_zeit_treffen", kind: "phrase", target: {text: "Wenn Sie Zeit haben, treffen wir uns um neun.", language_code: "de", direction: "ltr"}, introduced_tokens: ["treffen", "uns", "neun", "wir", "um"], example: {text: "Plan: Wenn Sie Zeit haben, treffen wir uns um neun.", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit41.lesson01.exercise01.recognize_wenn_regnet_bleibe", type: "multiple_choice", tested_text: "wenn es morgen regnet bleibe ich zu Hause", prompt: {target_blocks: [{text: "If it rains tomorrow, I'll stay home.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit41.lesson01.exercise02.recognize_wenn_zeit_treffen", type: "multiple_choice", tested_text: "wenn Sie Zeit haben treffen wir uns um neun", prompt: {target_blocks: [{text: "If you have time, we'll meet at nine.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit41.lesson01.exercise03.listen_select_wenn_regnet", type: "listen_select", tested_text: "Wenn es morgen regnet bleibe ich zu Hause", media_asset_key: "de.b1.audio.real_conditional_positive.neutral.01", prompt: {target_blocks: [{text: "Listen. What is the stated condition, and what will the speaker do if it occurs?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit41.lesson01.exercise04.match_wenn_real_positive"
            type: "matching_pairs"
            tested_text: "wenn es morgen regnet bleibe ich zu hause wenn sie zeit haben treffen wir uns um neun"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Wenn es morgen regnet, ...", right: "If it rains tomorrow, ..."}
              - {left: "bleibe ich zu Hause", right: "I'll stay home"}
              - {left: "Wenn Sie Zeit haben, ...", right: "If you have time, ..."}
              - {left: "treffen wir uns um neun", right: "we'll meet at nine"}
              - {left: "regnet", right: "rains"}
              - {left: "morgen", right: "tomorrow"}
          - {content_key: "de.b1.unit41.lesson01.exercise05.order_wenn_regnet_bleibe", type: "word_order", tested_text: "Wenn es morgen regnet bleibe ich zu Hause", prompt: {target_blocks: []}, word_bank: ["Wenn", "es", "morgen", "regnet,", "bleibe", "ich", "zu", "Hause"]}
          - {content_key: "de.b1.unit41.lesson01.exercise06.write_wenn_regnet_bleibe", type: "writing_prompt", tested_text: "Wenn es morgen regnet bleibe ich zu Hause", prompt: {target_blocks: [{text: "Write exactly this real/likely conditional sentence with wenn and present tense in both clauses: If it rains tomorrow, I'll stay home.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit41.lesson02.wenn_real_negated"
        title: "Wenn es nicht regnet, ..."
        spine_outcome_id: "universal.b1.conditions.express_real_conditions"
        teaching:
          - {content_key: "de.b1.unit41.lesson02.teach.wenn_nicht_regnet_wandern", kind: "phrase", target: {text: "Wenn es morgen nicht regnet, gehen wir wandern.", language_code: "de", direction: "ltr"}, introduced_tokens: ["nicht", "gehen", "wandern"], example: {text: "Plan: Wenn es morgen nicht regnet, gehen wir wandern.", language_code: "de", direction: "ltr"}}
          - {content_key: "de.b1.unit41.lesson02.teach.wenn_keine_zeit_allein", kind: "phrase", target: {text: "Wenn Sie keine Zeit haben, gehe ich allein.", language_code: "de", direction: "ltr"}, introduced_tokens: ["keine", "allein", "gehe"], example: {text: "Plan: Wenn Sie keine Zeit haben, gehe ich allein.", language_code: "de", direction: "ltr"}}
        exercises:
          - {content_key: "de.b1.unit41.lesson02.exercise01.recognize_wenn_nicht_regnet_wandern", type: "multiple_choice", tested_text: "wenn es morgen nicht regnet gehen wir wandern", prompt: {target_blocks: [{text: "If it doesn't rain tomorrow, we'll go hiking.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit41.lesson02.exercise02.recognize_wenn_keine_zeit_allein", type: "multiple_choice", tested_text: "wenn Sie keine Zeit haben gehe ich allein", prompt: {target_blocks: [{text: "If you don't have time, I'll go alone.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit41.lesson02.exercise03.listen_select_wenn_nicht_regnet", type: "listen_select", tested_text: "Wenn es morgen nicht regnet gehen wir wandern", media_asset_key: "de.b1.audio.real_conditional_negated.neutral.01", prompt: {target_blocks: [{text: "Listen. What is the negated condition, and what will happen if it holds?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit41.lesson02.exercise04.match_wenn_real_negated"
            type: "matching_pairs"
            tested_text: "wenn es morgen nicht regnet gehen wir wandern wenn sie keine zeit haben gehe ich allein"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Wenn es morgen nicht regnet, ...", right: "If it doesn't rain tomorrow, ..."}
              - {left: "gehen wir wandern", right: "we'll go hiking"}
              - {left: "Wenn Sie keine Zeit haben, ...", right: "If you don't have time, ..."}
              - {left: "gehe ich allein", right: "I'll go alone"}
              - {left: "nicht", right: "not"}
              - {left: "wandern", right: "to hike"}
          - {content_key: "de.b1.unit41.lesson02.exercise05.order_wenn_nicht_regnet_wandern", type: "word_order", tested_text: "Wenn es morgen nicht regnet gehen wir wandern", prompt: {target_blocks: []}, word_bank: ["Wenn", "es", "morgen", "nicht", "regnet,", "gehen", "wir", "wandern"]}
          - {content_key: "de.b1.unit41.lesson02.exercise06.write_wenn_nicht_regnet_wandern", type: "writing_prompt", tested_text: "Wenn es morgen nicht regnet gehen wir wandern", prompt: {target_blocks: [{text: "Write exactly this real/likely conditional sentence, negating the condition with nicht: If it doesn't rain tomorrow, we'll go hiking.", language_code: "en", direction: "ltr"}]}}

      - content_key: "de.b1.unit41.lesson03.wanderung_dialogue"
        title: "Dialog: Die Wanderung planen"
        spine_outcome_id: "universal.b1.conditions.express_real_conditions"
        teaching:
          - {content_key: "de.b1.unit41.lesson03.teach.anna_condition", kind: "dialogue", target: {text: "Wenn es morgen regnet, bleibe ich zu Hause.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: []}
          - {content_key: "de.b1.unit41.lesson03.teach.felix_ask", kind: "dialogue", target: {text: "Und wenn es nicht regnet?", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["Und"]}
          - {content_key: "de.b1.unit41.lesson03.teach.anna_negated_condition", kind: "dialogue", target: {text: "Wenn es nicht regnet, gehen wir wandern.", language_code: "de", direction: "ltr", speaker: "Anna"}, introduced_tokens: []}
          - {content_key: "de.b1.unit41.lesson03.teach.felix_confirm", kind: "dialogue", target: {text: "Gut, wenn Sie Zeit haben, treffen wir uns um neun.", language_code: "de", direction: "ltr", speaker: "Felix"}, introduced_tokens: ["Gut"]}
        exercises:
          - {content_key: "de.b1.unit41.lesson03.exercise01.choose_anna_condition", type: "multiple_choice", tested_text: "wenn es morgen regnet bleibe ich zu hause", prompt: {target_blocks: [{text: "What does Anna say she will do if it rains tomorrow?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit41.lesson03.exercise02.choose_anna_negated_condition", type: "multiple_choice", tested_text: "wenn es nicht regnet gehen wir wandern", prompt: {target_blocks: [{text: "What does Anna say will happen if it doesn't rain?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "de.b1.unit41.lesson03.exercise03.listen_dialogue_wanderung", type: "listen_select", tested_text: "und wenn es nicht regnet wenn es nicht regnet gehen wir wandern", media_asset_key: "de.b1.audio.dialogue.bedingungen_wanderung.01", prompt: {target_blocks: [{text: "Listen to the dialogue. What does Anna say will happen if it does not rain?", language_code: "en", direction: "ltr"}]}}
          - content_key: "de.b1.unit41.lesson03.exercise04.match_dialogue_wanderung"
            type: "matching_pairs"
            tested_text: "wenn es morgen regnet bleibe ich zu hause und wenn es nicht regnet wenn es nicht regnet gehen wir wandern gut wenn sie zeit haben treffen wir uns um neun"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Und wenn es nicht regnet?", right: "And if it doesn't rain?"}
              - {left: "Gut, wenn Sie Zeit haben, ...", right: "Good, if you have time, ..."}
              - {left: "wandern", right: "to hike"}
              - {left: "gut", right: "good"}
              - {left: "und", right: "and"}
              - {left: "um neun", right: "at nine"}
          - {content_key: "de.b1.unit41.lesson03.exercise05.order_felix_ask", type: "word_order", tested_text: "Und wenn es nicht regnet", prompt: {target_blocks: []}, word_bank: ["Und", "wenn", "es", "nicht", "regnet?"]}
          - {content_key: "de.b1.unit41.lesson03.exercise06.write_full_condition_contrast", type: "writing_prompt", tested_text: "Wenn es morgen regnet bleibe ich zu Hause Wenn es morgen nicht regnet gehen wir wandern", prompt: {target_blocks: [{text: "As Anna, write two sentences about tomorrow's weekend plan: a real condition (if it rains tomorrow, you'll stay home) and its negation (if it doesn't rain tomorrow, you'll go hiking).", language_code: "en", direction: "ltr"}]}}
