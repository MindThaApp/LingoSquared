sing a comma or و there would have been marked wrong despite it being equally natural; fixed by expanding to all 9 period/comma/و combinations across both boundaries for the primary headache+rest combination, adding 3 more for the fever+water combination, and loosening the instruction wording (was implicitly headache+rest only, several existing variants used fever+water instead, a real §5 instruction/answer mismatch) to explicitly allow either symptom+advice combination. Re-verified via actual compile (not just validate) that both fixes took effect: match_advice_vocab compiles with all 8 pairs, write_dialogue_summary compiles with 12 accepted variants. Also found and fixed a documentation-accuracy issue (not learner-facing): this file's own notes/register_policy had claimed شفاخانه/دواخانه (hospital/pharmacy) were reused in this unit's content -- the reviewer grepped and found neither word actually appears in any teaching item or exercise, only in the prose metadata itself; corrected the notes/register_policy to stop overclaiming rather than retrofitting unneeded vocabulary into the lesson content this late. Full project scripts/verify.sh --content-only re-run clean (0 errors/0 warnings) after all fixes, including the concurrent session's own new fa/prs unit16 (travel) content authored in parallel during this same session. New unit, prs's next uncovered outcome (universal.a1.health.describe_basic_problem, prerequisite: introductions, already covered in unit02). Note: unit16 (travel, the spine outcome immediately before this one) was already claimed and completed by a concurrent session during this authoring pass (confirmed both docs/content/realizations/prs/a1_unit16_travel.yaml and docs/content/overlays/en-prs/a1_unit16.yaml existed before this file was started) -- this unit deliberately picks up at the next genuinely unclaimed outcome instead. Six lessons: basic symptom vocabulary (سردرد/تب/دل‌درد), saying you feel unwell (مریض استم / حالم خوب نیست), asking for a doctor or medicine (داکتر می‌خواهم / دوا می‌خواهم), reading a short health-instruction note (استراحت کنین / آب زیاد بنوشین), reading a short message describing symptoms, and a dialogue with a doctor. Uses genuine Afghan Dari vocabulary distinct from Iranian Farsi: داکتر (doctor, web-verified as the standard Afghan spelling/pronunciation vs. Iranian دکتر), and داکتر صاحب as a genuine, web-verified Afghan honorific address form (صاحب appended to a profession/title, distinctively more prominent in Afghan/South-Asian-influenced Dari usage than in Iranian Farsi). CORRECTION (post-review): an earlier draft of this note claimed شفاخانه/دواخانه (hospital/pharmacy, established in unit05) were also reused in this unit's content -- a fresh-context review correctly caught that neither word actually appears anywhere in this unit's teaching items or exercises; the claim was inaccurate self-report and has been removed rather than retrofitting unneeded vocabulary into the content. Deliberately avoided the colloquialism ناجور (\"unwell\") after a web search came back inconclusive on its attested Dari usage -- used the safely-verifiable, standard مریض استم / حالم خوب نیست instead, per this guide's own instruction to flag uncertainty rather than guess. Uses full, uncontracted forms (می‌خواهم, استم, بنوشین, کنین) consistent with the established register policy from units 01-16. Authored independently of the fa realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere (understand_health_problem's listening requirement covered via reading_comprehension with instructions honestly saying \"Read,\" the established zero-prs-audio pattern from units 09/11/12/15/16), every matching_pairs exercise sized 4-7 pairs (lesson01 at a genuine 4-pair first-lesson ceiling, matching unit15's own precedent), and zero fill_in_blank exercises. The two open-ended writing_prompt exercises (write_health_message in lesson05, write_dialogue_summary in lesson06) carry multiple accepted model-answer variants, and both carry period-joined, comma-joined, and و-joined multi-clause variants per §12. Introduced tokens are cumulative and file-scoped per the established unit12/unit16 convention (بشیر, می‌خواهم, تشکر, etc. re-taught fresh within this file even though first introduced in earlier units). Cross-checked §11 facts: the lesson05 reading message (sick, headache + fever) and the lesson06 dialogue (sick, headache + fever, doctor advises rest + water) are two independent, clearly separate scenarios, each internally consistent across every exercise that touches it. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed. SECOND, FULLY INDEPENDENT FRESH-CONTEXT REVIEW, 2026-07-07: re-derived every check from scratch (no access to the prior reviewer's reasoning beyond this file's own committed text), re-read AUTHORING_GUIDE.md and the spine outcome's assessment_requirements directly, and independently confirmed all 4 requirements are genuinely covered, exercise pacing is correct in all 6 lessons, and the already-applied match_advice_vocab (8 pairs) and write_dialogue_summary (12 variants, either symptom+advice combination) fixes are both correct and internally consistent -- this reviewer independently spotted the identical write_dialogue_summary instruction/answer mismatch before discovering it had already been fixed. Ran fresh, independently-written Python scripts (not the prior reviewer's): a recursive yaml.safe_load stray-boolean scan (zero found beyond the two legitimate schema booleans), a same-script prompt-shows-answer scan across every multiple_choice/reading_comprehension/dialogue_comprehension exercise (zero leaks), a duplicate realization-prompt-vs-overlay-instruction text scan (zero matches), a content_key parity diff (exact both directions: 6 lessons/30 teaching/30 exercises), and a ZWNJ-aware, Persian-punctuation-stripping tokenizer checking every tested_text/prompt/pairs/word_bank value plus every overlay accepted_answers/correct_option/distractors value against cumulative file-scoped introduced_tokens (zero untaught-vocabulary violations). Independently web-verified (not just reasoned from training data) that دل‌درد is genuine, natural Dari/Afghan-Persian usage for stomachache and that تشکر standing alone (without می‌کنم) is genuine natural spoken Dari for \"thanks,\" distinct from the fuller متشکرم form. Confirmed all 7 exercise types used (multiple_choice/matching_pairs/translation/reading_comprehension/dialogue_comprehension/dialogue_response/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx. Re-ran the actual compiler (validate then compile, not just validate) as the final check: 0 errors/0 warnings, valid JSON output, and directly inspected the compiled exercise objects (all 30 have non-empty accepted answers; match_advice_vocab's compiled correct_response has all 8 pairs; write_dialogue_summary's compiled accepted list has all 12 variants) -- confirms the already-applied fixes hold through a real compile, not just on-disk YAML. No further issues found; this file is genuinely clean."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    full, uncontracted verb forms (می‌خواهم، بنوشین، کنین، استم kept as a
    separate word), consistent with units 01-16. Health vocabulary uses
    genuine Afghan Dari forms (داکتر، داکتر صاحب) rather than the Iranian
    Farsi equivalents (دکتر). This unit's own content does not use
    شفاخانه/دواخانه (already established as Afghan-correct in unit05).

