    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: prs.b1.unit04.sequencing
    title: زمان
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.sequencing.describe_events_with_time_clauses
    planned_lesson_count: 6

    lessons:
      - content_key: prs.b1.unit04.lesson01.present_time_clause_1st2nd
        title: وقتی که کار می‌کنم
        spine_outcome_id: universal.b1.sequencing.describe_events_with_time_clauses
        teaching:
          - content_key: prs.b1.unit04.lesson01.teach.vaqti_ke
            kind: vocabulary
            target: {text: وقتی که, language_code: prs, direction: rtl}
            introduced_tokens: [وقتی, که]
            example: {text: "وقتی که کار می‌کنم، خسته می‌شوم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson01.teach.kar_mikonam
            kind: vocabulary
            target: {text: کار می‌کنم, language_code: prs, direction: rtl}
            introduced_tokens: [کار, می‌کنم]
            example: {text: "وقتی که کار می‌کنم، خسته می‌شوم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson01.teach.khaste
            kind: vocabulary
            target: {text: خسته, language_code: prs, direction: rtl}
            introduced_tokens: [خسته]
            example: {text: "خسته می‌شوم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson01.teach.mishavam
            kind: vocabulary
            target: {text: می‌شوم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌شوم]
            example: {text: "وقتی که کار می‌کنم، خسته می‌شوم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson01.teach.grammar_vaqti
            kind: grammar_note
            target: {text: "وقتی (که) + clause states WHEN something happens, as a fact or habit -- unlike اگر, which states a hypothetical or possible condition. وقتی که کار می‌کنم، خسته می‌شوم = when(ever) I work, I get tired -- this always happens, it isn't conditional.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit04.lesson01.teach.kar_mikoni
            kind: vocabulary
            target: {text: کار می‌کنی, language_code: prs, direction: rtl}
            introduced_tokens: [می‌کنی]
            example: {text: "وقتی که کار می‌کنی، خسته می‌شوی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson01.teach.mishavi
            kind: vocabulary
            target: {text: می‌شوی, language_code: prs, direction: rtl}
            introduced_tokens: [می‌شوی]
            example: {text: "وقتی که کار می‌کنی، خسته می‌شوی؟", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit04.lesson01.exercise01.recognize_vaqti_ke
            type: multiple_choice
            tested_text: وقتی که
            prompt: {target_blocks: [{text: وقتی که, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit04.lesson01.exercise02.recognize_khaste
            type: multiple_choice
            tested_text: خسته
            prompt: {target_blocks: [{text: خسته, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit04.lesson01.exercise03.order_vaqti_kar_mikonam
            type: word_order
            tested_text: وقتی که کار می‌کنم خسته می‌شوم
            prompt: {target_blocks: []}
            word_bank: [وقتی, که, کار, می‌کنم, خسته, می‌شوم]
          - content_key: prs.b1.unit04.lesson01.exercise04.match_time_clause_words
            type: matching_pairs
            tested_text: وقتی که کار می‌کنم خسته می‌شوم کار می‌کنی می‌شوی
            prompt: {target_blocks: []}
            pairs:
              - {left: وقتی که, right: when}
              - {left: کار می‌کنم, right: "I work"}
              - {left: خسته, right: tired}
              - {left: می‌شوم, right: "I become"}
              - {left: کار می‌کنی, right: "you work"}
              - {left: می‌شوی, right: "you become"}
          - content_key: prs.b1.unit04.lesson01.exercise05.translate_do_you_get_tired
            type: translation
            tested_text: وقتی که کار می‌کنی، خسته می‌شوی؟
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit04.lesson01.exercise06.speak_i_get_tired
            type: speak_response
            tested_text: وقتی که کار می‌کنم، خسته می‌شوم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit04.lesson01.exercise07.write_do_you_get_tired
            type: writing_prompt
            tested_text: وقتی که کار می‌کنی، خسته می‌شوی؟
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit04.lesson02.present_time_clause_all_persons
        title: همه صیغه‌ها
        spine_outcome_id: universal.b1.sequencing.describe_events_with_time_clauses
        teaching:
          - content_key: prs.b1.unit04.lesson02.teach.kar_mikonad
            kind: vocabulary
            target: {text: کار می‌کند, language_code: prs, direction: rtl}
            introduced_tokens: [می‌کند]
            example: {text: "وقتی که همایون کار می‌کند، خسته می‌شود.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson02.teach.kar_mikonim
            kind: vocabulary
            target: {text: کار می‌کنیم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌کنیم]
            example: {text: "وقتی که کار می‌کنیم، خسته می‌شویم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson02.teach.kar_mikonid
            kind: vocabulary
            target: {text: کار می‌کنین, language_code: prs, direction: rtl}
            introduced_tokens: [می‌کنین]
            example: {text: "وقتی که کار می‌کنین، خسته می‌شین؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson02.teach.kar_mikonand
            kind: vocabulary
            target: {text: کار می‌کنند, language_code: prs, direction: rtl}
            introduced_tokens: [می‌کنند]
            example: {text: "وقتی که آنها کار می‌کنند، خسته می‌شوند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson02.teach.grammar_agreement
            kind: grammar_note
            target: {text: "کار می‌کنم، می‌کنی، می‌کند، می‌کنیم، می‌کنین، می‌کنند -- and می‌شوم، می‌شوی، می‌شود، می‌شویم، می‌شین، می‌شوند follow the same م/ی/د/یم/ین/ند person endings. The وقتی-clause and the result clause can have different subjects; each verb agrees with its own.", language_code: prs, direction: rtl}
            introduced_tokens: [می‌شود, می‌شویم, می‌شین, می‌شوند]
          - content_key: prs.b1.unit04.lesson02.teach.review_homayoun
            kind: vocabulary
            target: {text: همایون, language_code: prs, direction: rtl}
            introduced_tokens: [همایون]
            example: {text: "وقتی که همایون کار می‌کند، خسته می‌شود.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson02.teach.review_zarmina
            kind: vocabulary
            target: {text: زرمینه, language_code: prs, direction: rtl}
            introduced_tokens: [زرمینه]
            example: {text: "وقتی که زرمینه کار می‌کند، خسته می‌شود.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson02.teach.review_anha
            kind: vocabulary
            target: {text: آنها, language_code: prs, direction: rtl}
            introduced_tokens: [آنها]
            example: {text: "وقتی که آنها کار می‌کنند، خسته می‌شوند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson02.teach.ma
            kind: vocabulary
            target: {text: ما, language_code: prs, direction: rtl}
            introduced_tokens: [ما]
            example: {text: "وقتی که ما کار می‌کنیم، خسته می‌شویم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit04.lesson02.exercise01.recognize_kar_mikonad
            type: multiple_choice
            tested_text: کار می‌کند
            prompt: {target_blocks: [{text: کار می‌کند, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit04.lesson02.exercise02.recognize_kar_mikonand
            type: multiple_choice
            tested_text: کار می‌کنند
            prompt: {target_blocks: [{text: کار می‌کنند, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit04.lesson02.exercise03.order_vaqti_homayoun
            type: word_order
            tested_text: وقتی که همایون کار می‌کند خسته می‌شود
            prompt: {target_blocks: []}
            word_bank: [وقتی, که, همایون, کار, می‌کند, خسته, می‌شود]
          - content_key: prs.b1.unit04.lesson02.exercise04.match_person_forms
            type: matching_pairs
            tested_text: کار می‌کنم می‌کنی می‌کند می‌کنیم می‌کنین می‌کنند
            prompt: {target_blocks: []}
            pairs:
              - {left: "کار می‌کنم", right: "I work"}
              - {left: "کار می‌کنی", right: "you work"}
              - {left: "کار می‌کند", right: "he/she works"}
              - {left: "کار می‌کنیم", right: "we work"}
              - {left: "کار می‌کنین", right: "you (pl) work"}
              - {left: "کار می‌کنند", right: "they work"}
          - content_key: prs.b1.unit04.lesson02.exercise05.translate_they_get_tired
            type: translation
            tested_text: وقتی که آنها کار می‌کنند، خسته می‌شوند
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit04.lesson02.exercise06.speak_we_get_tired
            type: speak_response
            tested_text: وقتی که ما کار می‌کنیم، خسته می‌شویم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit04.lesson02.exercise07.write_homayoun_gets_tired
            type: writing_prompt
            tested_text: وقتی که همایون کار می‌کند، خسته می‌شود
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit04.lesson03.past_time_clause
        title: وقتی که رسیدم
        spine_outcome_id: universal.b1.sequencing.describe_events_with_time_clauses
        teaching:
          - content_key: prs.b1.unit04.lesson03.teach.residam
            kind: vocabulary
            target: {text: رسیدم, language_code: prs, direction: rtl}
            introduced_tokens: [رسیدم]
            example: {text: "وقتی که به خانه رسیدم، غذا پختم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson03.teach.pokhtam
            kind: vocabulary
            target: {text: پختم, language_code: prs, direction: rtl}
            introduced_tokens: [پختم]
            example: {text: "وقتی که به خانه رسیدم، غذا پختم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson03.teach.residi
            kind: vocabulary
            target: {text: رسیدی, language_code: prs, direction: rtl}
            introduced_tokens: [رسیدی]
            example: {text: "وقتی که به خانه رسیدی، چه کار کردی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson03.teach.kardi
            kind: vocabulary
            target: {text: کردی, language_code: prs, direction: rtl}
            introduced_tokens: [کردی]
            example: {text: "وقتی که به خانه رسیدی، چه کار کردی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson03.teach.grammar_past_time
            kind: grammar_note
            target: {text: "وقتی که + simple past states when a completed, one-time past event happened -- contrasted with lessons 1-2's present/habitual وقتی-clauses (کار می‌کنم, an ongoing habit). وقتی که رسیدم uses simple past رسیدم (I arrived, one specific time), not a habit.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit04.lesson03.teach.ghaza
            kind: vocabulary
            target: {text: غذا, language_code: prs, direction: rtl}
            introduced_tokens: [غذا]
            example: {text: "غذا پختم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson03.teach.review_ba
            kind: vocabulary
            target: {text: به, language_code: prs, direction: rtl}
            introduced_tokens: [به]
            example: {text: "به خانه رسیدم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson03.teach.review_khana
            kind: vocabulary
            target: {text: خانه, language_code: prs, direction: rtl}
            introduced_tokens: [خانه]
            example: {text: "به خانه رسیدم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit04.lesson03.teach.review_che
            kind: vocabulary
            target: {text: چه, language_code: prs, direction: rtl}
            introduced_tokens: [چه]
            example: {text: "چه کار کردی؟", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit04.lesson03.exercise01.recognize_residam
            type: multiple_choice
            tested_text: رسیدم
            prompt: {target_blocks: [{text: رسیدم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit04.lesson03.exercise02.recognize_pokhtam
            type: multiple_choice
            tested_text: پختم
            prompt: {target_blocks: [{text: پختم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit04.lesson03.exercise03.order_vaqti_residam_pokhtam
            type: word_order
            tested_text: وقتی که به خانه رسیدم غذا پختم
            prompt: {target_blocks: []}
            word_bank: [وقتی, که, به, خانه, رسیدم, غذا, پختم]
          - content_key: prs.b1.unit04.lesson03.exercise04.match_past_words
            type: matching_pairs
            tested_text: رسیدم پختم رسیدی کردی غذا خانه
            prompt: {target_blocks: []}
            pairs:
              - {left: رسیدم, right: "I arrived"}
              - {left: پختم, right: "I cooked"}
              - {left: رسیدی, right: "you arrived"}
              - {left: کردی, right: "you did"}
              - {left: غذا, right: food}
              - {left: خانه, right: house}
