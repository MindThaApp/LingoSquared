status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    prs's fourth B1 unit, second of four authored in this pass to close
    the real depth gap between en-prs's 61-unit A1 course and its
    previously-2-unit B1 course. Uses a NEW spine outcome,
    universal.b1.sequencing.describe_events_with_time_clauses, added
    under the standing delegated spine-authority precedent set by
    b1_unit01/b1_unit02/b1_unit03 (prerequisite:
    universal.b1.conditions.express_real_conditions, continuing the
    same complex-clause grammar arc). Teaches time-clause sentences with
    وقتی (که) (when) + a present/habitual clause and a matching result
    clause (lessons 1-2, all persons), then extends to PAST time clauses
    with simple-past verb forms (lesson03) -- explicitly contrasted with
    the present/habitual forms so a learner doesn't conflate "when(ever)
    I work, I get tired" (habitual fact) with "when I arrived home, I
    cooked" (one completed past event). Introduces the compound
    become-verb شدن (خسته می‌شوم = I get/become tired), a genuinely
    common, high-utility B1 construction not yet taught anywhere else
    in this corpus. Source-material check: `firecrawl --status` still
    showed 0/1,000 credits remaining partway through this pass (same
    outage flagged in b1_unit02/b1_unit03's provenance notes), so no
    fresh public-domain source search was attempted; this is
    established-conventions authoring (standard, well-documented
    Persian/Dari time-clause and become-verb grammar), the same honest
    fallback path used throughout this pass. All new regular verbs
    continue b1_unit03's explicit د/ند-ending-for-new-verbs convention
    (کار می‌کنم/کنی/کند/کنیم/کنید/کنند, می‌شوم/شوی/شود/شویم/شوید/شوند,
    رسیدم/رسیدی/رسید, پختم, کردی/کرد, خورد, آمد -- all standard-shape,
    no invented colloquial contractions), while the previously-
    established ه/ین/ن paradigm remains reserved for تانستن/خریدن only.
    Scenario is original: Zarmina and Homayoun (established recurring
    cast) discussing their after-work routines -- a fresh, concrete,
    daily-routine scenario distinct from b1_unit01's errands,
    b1_unit02's guests, and b1_unit03's weather/park plans. All
    vocabulary is introduced self-contained within this file
    (introduced_tokens are file-scoped per project convention, so
    already-established words like زرمینه/همایون/آنها/کار/به/خانه/بود/
    غذا/چای are re-taught here even though prior prs files already
    taught them). Word_order exercises omit the internal comma a
    written two-clause sentence would naturally carry, matching
    b1_unit03's established word_bank/accepted_answers multiset-parity
    handling; translation/writing/speak/dialogue_response exercises
    keep the natural comma. Every kind:vocabulary card carries a real
    example sentence per AUTHORING_GUIDE.md #19. No listen_type/
    listen_select/listen_order anywhere (AUTHORING_GUIDE.md #14 -- prs
    still has zero TTS/recorded-audio coverage). Every matching_pairs
    exercise uses 6 pairs (AUTHORING_GUIDE.md #16). STATUS: freshly
    authored this pass, NOT yet through the mandatory fresh-context
    review -- review.status is honestly left unreviewed below.
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Not yet reviewed. A fresh-context reviewer (zero access to this
    authoring's reasoning, per AUTHORING_GUIDE.md #9, and instructed not
    to open the prs-en sibling overlay per #8) should check in
    particular: (1) the وقتی (که) + present/habitual clause construction
    (lessons 1-2), including whether خسته می‌شوم genuinely reads as "I
    get/become tired" and not something else; (2) the PAST وقتی-clause
    construction (lesson03, simple past رسیدم/پختم/کردی) and whether
    the present-vs-past contrast is stated clearly and correctly; (3)
    whether the mix of standard د/ند-ending new-verb forms alongside
    b1_unit01/02's established ه/ین/ن-ending تانستن/خریدن forms (none of
    which are reused verbatim in this file, but the PATTERN is
    referenced in the grammar notes) reads as consistent; (4) script
    purity (Persian-range ک/ی only, no Arabic-range codepoints); (5) no
    internal-jargon leaks in learner-facing text; (6) every exercise
    type used (multiple_choice, word_order, matching_pairs, translation,
    speak_response, writing_prompt, dialogue_response) is registered in
    ExerciseRenderer.tsx; (7) cross-lesson fact consistency (the
    after-work-routine scenario in lesson04's dialogue and lesson05's
    reading agreeing about what Homayoun and Zarmina actually do); (8)
    that every word_order/listen_order word_bank multiset exactly
    matches its accepted-answer token multiset (hand-verified against
    validate_order_word_bank_answers before this note was written, but
    a fresh reviewer should re-confirm via a real compiler run, not
    trust the authoring self-report).

    2026-07-11 register-normalization pass: point (3) above's own flagged
    tension resolved by corpus-wide grep -- established Afghan کنین
    (کردن, 182 corpus-wide occurrences) heavily outweighs کار می‌کنید's
    standard-register instance here. Normalized کار می‌کنید -> کار
    می‌کنین (vocabulary card, grammar_note recap text and its "-ید"
    person-ending label, matching_pairs pair, tested_text, and the
    media_assets vocab.01 recording script). Also normalized the
    grammar_note's bundled خسته می‌شوید (شدن, same present-tense mood
    category, explicitly taught in the SAME card as "both follow the
    same person endings" as می‌کنید) -> می‌شین, for internal consistency
    within that one card -- شدن has no independent corpus precedent for
    this specific form, but leaving only شدن un-normalized would have
    made the card's own "both follow the same pattern" claim literally
    false. No accepted_answers list exists for either form (grading here
    is matching_pairs-only, no variant-acceptance mechanism), so no old
    form was kept as an accepted variant. review.status left as reviewed
    (targeted correction, not a re-review).

course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین-adjacent, fuller written-leaning
    register from prs's other units. New regular verbs continue
    b1_unit03's precedent of standard د/ید/ند-ending present-indicative
    and simple-past paradigms; the earlier ه/ین/ن colloquial paradigm
    remains specific to تانستن/خریدن and is not extended further.

