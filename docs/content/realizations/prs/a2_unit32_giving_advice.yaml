review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block C unit C4), realizing universal.a2.advice.give_simple_advice. Grammar target: giving and answering simple advice with the subjunctive. The subjunctive is re-taught here from scratch (the other new units are written in parallel): for a friend it is the command plus ی (برو: بروی, بخور: بخوری, بخواب: بخوابی, استراحت کن: استراحت کنی), with the full paradigm of رفتن (بروم، بروی، برود، برویم، بروین، بروند), the negative with ن- (نروی), the formal شما form with -ین, and the subjunctive of بودن (باشد) for softened advice. Patterns: بهتر است (که) + subjunctive (gentle; the written است is used, never بهتره), باید / نباید + subjunctive (firm), پیشنهاد می‌کنم (که) / پیشنهاد می‌کنیم که + subjunctive (polite suggestion), asking چه کار کنم؟ / به نظر شما چه کار کنم؟ / شما چه پیشنهاد می‌کنین؟, and responses (فکر خوبی است. همین کار را می‌کنم / درست است / شاید درست باشد / از پیشنهادت ممنون / نمی‌توانم، چون وقت ندارم). Vocabulary: health (داکتر، دوا، مریض، استراحت کردن، خوابیدن، سرم درد می‌کند, آب خوردن, دوا خوردن), study (درس، امتحان، کتاب، تکرار کردن، زود، دیر), money (پول، خرج کردن، پس‌انداز کردن، گران، ارزان، ماه). Lesson arc: L01 health, بهتر است که and the subjunctive; L02 study, باید / نباید; L03 money, پیشنهاد می‌کنم که; L04 asking for advice and answering it (two typed dialogue_response items); L05 dialogue 1 (health) plus a reading message and typed writing; L06 dialogue 2 (money), mixed and culminating three-sentence writing_prompt (one sentence each in health, study and money). Characters: two fresh friends جمیله and ذکریا (unused anywhere in docs/content/realizations/prs and overlays/en-prs at authoring time), informal تو-register. Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = Jamila has a headache and sleeps badly, Zakaria says go to the doctor and drink a lot of water, she plans tomorrow, he says go today, she agrees; the L05 message is Jamila''s later message (she went to the doctor today; rest three days, take medicine, do not go to bed late, no school tomorrow); dialogue 2 = Zakaria has little money and spends a lot, Jamila suggests saving a little every month, he says everything is expensive, she says do not buy expensive things, only important things, he agrees and starts today. Binding rulings applied: no future (no خواهم), no progressive, no perfect, modal only as نمی‌توانم with ZWNJ, no object clitics, 2pl -ین everywhere, Afghan lexicon (داکتر، دوا، مکتب، موتر), no listen_type, dictation or audio-only item; the two dialogue_comprehension items show the full transcript in the prompt (prs has no TTS) and carry media_asset_key entries with status pending_generation like unit 26. All words used in exercises are introduced in this unit''s own teaching cards (introduced_tokens), so the unit does not depend on other new units. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER (with the recommended answer): (1) Is بهتر است که + subjunctive the natural written way to give gentle advice in Kabul Dari, and is dropping که (بهتر است به داکتر بروی) equally natural? Rec: keep both, که optional. (2) Are باید + subjunctive and نباید + subjunctive without که (باید هر روز درس بخوانی، نباید دیر بخوابی) natural, or would a native add که (باید که ...)? Rec: keep without که. (3) Is پیشنهاد می‌کنم که the natural everyday verb for giving advice, or would a Kabuli speaker prefer مشوره می‌دهم / توصیه می‌کنم / صلاح می‌دانم? Rec: keep پیشنهاد می‌کنم. (4) Is چه کار کنم؟ the natural way to ask what should I do (vs چه باید بکنم؟ or چه کنم؟), and به نظر شما چه کار کنم؟ polite enough? Rec: keep چه کار کنم؟. (5) Are دوا خوردن and آب خوردن natural (vs آب نوشیدن), and سرم درد می‌کند natural (vs سردرد دارم)? Rec: keep. (6) The spelling and ZWNJ of پس‌انداز کردن, گفت‌وگو and شب‌ها, and چیزهای گران without ZWNJ. Rec: keep. (7) Is شاید بهتر باشد که ... and شاید درست باشد a natural soft advice and reaction, and ممکن است درست باشد? Rec: keep. (8) Are فکر خوبی است. همین کار را می‌کنم., درست است., از پیشنهادت ممنون., نمی‌توانم، چون وقت ندارم., از امروز شروع می‌کنم. natural replies? Rec: keep. (9) Is داکتر (rather than دکتر) right, and به داکتر رفتن vs پیش داکتر رفتن (the latter accepted as an extra answer)? Rec: keep داکتر, به داکتر. (10) Are the formal subjunctive forms بروین، بخورین، کنین natural for شما (accepted -ید variants as extras only)? Rec: yes. (11) Is نباید صبر کنی natural for do not wait, and the dialogue 1 line باید آب زیاد بخوری after بهتر است که به داکتر بروی? Rec: keep. (12) The teaching claim that 2sg subjunctive = command + ی (برو → بروی): any objection for beginners? Rec: keep, it is the simplest rule.'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین (بروین، بخورین، می‌کنین), no Tehrani colloquialisms. Friend dialogues between جمیله and ذکریا use the informal تو-register; the formal شما form is taught in one card. Advice is taught as بهتر است (که) + subjunctive, باید / نباید + subjunctive, and پیشنهاد می‌کنم که + subjunctive; the subjunctive is built as the command stem plus the personal ending (برو: بروم، بروی، برود، برویم، بروین، بروند).'
