  - content_key: prs.a1.unit35.audio.post.vocab.01
    language: prs
    text: "پُسته خانه، تکت پُستی، نامه، پارسل، بسته پُستی، روان می‌کنم، می‌رسد"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: prs.a1.unit35.audio.dialogue.post.01
    language: prs
    text: "نادیا: سلام، یک تکت پُستی می‌خواهم. رحیم: برای نامه یا پارسل؟ نادیا: برای یک نامه. رحیم: نامه به کجا می‌رود؟ نادیا: به هرات می‌رود. رحیم: خوب، نامه سه روزه می‌رسد."
    voice_hint: two_adults_neutral_formal
    status: pending_generation

