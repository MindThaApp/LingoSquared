generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: codex
  source_material: "Adapted in the Peace Corps Dari-course lane: post-office counter tasks, sending a letter or parcel, and asking about arrival were modernized into current beginner Kabul Dari rather than imported verbatim. Current Afghan Post Dari public pages were also checked for modern service vocabulary, including پُسته خانه, نامه ها, پارسلات, بسته های پُستی, and خدمات پُستی."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), cold read against the
    AUTHORING_GUIDE.md checklist, sibling fa/prs-en/fa-en files never
    opened. Found and fixed TWO real issues. (1) Character collision
    (explicitly checked this pass per instruction): this unit's postal
    clerk was originally named فرید/Farid, the same name as unit34's
    unrelated informal-register neighbor character, with zero shared
    characterization and an abrupt register jump (casual تو neighbor
    chat vs. formal شما/-ین counter service) between adjacent units --
    judged an accidental collision, not a deliberate recurring
    character. Fixed by renaming this unit's clerk to رحیم/Rahim
    throughout (dialogue speaker fields, introduced_tokens, the
    media_assets dialogue transcript, register_policy prose, and the
    overlay's three dialogue-line titles); confirmed via corpus grep
    that "رحیم" wasn't already in use elsewhere and unit34's own
    Farid/Laila pair is untouched. (2) §12 gap: lesson06 exercise05
    (translate "I like the post office, but I do not have time.") only
    accepted two comma-joined variants of the اما sentence, missing the
    bare (no-comma) and period-joined forms every sibling unit's
    equivalent wrap-up exercise already covers -- a real "marked wrong
    for a right answer" risk. Fixed by adding "پُسته خانه را دوست دارم
    اما وقت ندارم" (bare) and "پُسته خانه را دوست دارم. اما وقت ندارم."
    (period-joined) to accepted_answers, now 4 variants total. Also
    checked (clean): multiple_choice/dialogue distractors against the
    same speaker's other lines; stray YAML boolean coercion via a real
    recursive yaml.safe_load scan; matching_pairs/word_order answer
    shapes; cross-lesson fact consistency (Nadia sends a letter to
    Herat, arrives in three days, happy -- dialogue and reading passage
    agree); تکت پُستی/پُسته خانه verified via live web search as genuine
    current Afghan Dari postal vocabulary (Afghan Post's own materials
    and Kabul post-office listings use both پسته خانه and پست خانه;
    تکت پستی is the confirmed Afghan-Dari equivalent of Iranian تمبر
    پستی); jargon leaks (none); Unicode codepoints (Persian keheh/yeh
    throughout); §13/§14 (no fill_in_blank, no audio-only prs types);
    §16 (every matching_pairs exercise has 7 real pairs); §19 (every
    vocabulary card has a real example + example_gloss). Compiler
    re-validated clean (0 errors/0 warnings) after both fixes.

    Review 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in
    the overlay). NATIVE FLAGS: see overlay.

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established polite-first, full-uncontracted Dari register.
    Counter requests use formal شما/-ین forms. The short Nadia/Rahim dialogue
    uses polite public-service register. Vocabulary follows current Afghan
    postal usage where useful: پُسته خانه for post office, نامه for letter,
    پارسل for parcel, بسته پُستی for postal package, and تکت پُستی for stamp.

