target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain), modernized; no fetchable lesson-level free-time/hobbies content was found this pass (a targeted search of the Peace Corps Dari course landing pages turned up only structural lesson-type categories, no topic table of contents -- same search-and-disclose approach as the unit24 transportation and unit25 emotions precedents) -- authored from established prs conventions and vocabulary already taught earlier in this course instead, disclosed honestly rather than overclaiming source use."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude, zero access to the authoring reasoning). Checked: translation-exercise instructions (all already correctly name the specific sentence -- no bug here, unlike units 23/24), matching_pairs pair counts (6-7 throughout, compliant), reading-passage/dialogue fact consistency with unit24/25's established Homayoun (walks/near house, sometimes tired) and Zarmina (likes reading and music) facts -- consistent, bare-YAML-boolean grep, Persian-vs-Arabic codepoints, jargon leaks, exercise-type registration, and §19 vocabulary-card examples -- all clean. Found and fixed one real bug: lesson04's dialogue_comprehension exercise (exercise01, testing 'what does Zarmina like to do in her free time?') had a distractor 'She likes watching movies.' that is actually TRUE -- Zarmina's own later dialogue line literally says 'من هم فلم دیدن را دوست دارم' (I also like watching movies), so the exercise had two defensible correct answers depending on which of Zarmina's own lines the learner recalled. This is the same same-speaker-distractor bug class documented in CLAUDE.md's nl-unit44-50 footgun; it wasn't caught by the compiler's automated validate_same_speaker_dialogue_distractors check because that check only covers listen_select/dialogue_response types, not dialogue_comprehension, so it needed a manual read. Replaced the distractor with 'She dislikes reading.' (verifiably false, not spoken by anyone in the dialogue). Re-validated clean (0 errors/0 warnings) after the fix. Review 2026-10-20 (en-prs A1 pass): 2 fixes - example sentence word order fixed (جمعه روز رخصتی هفته است); reading passage reordered so the cooking line refers to Homayoun, matching the dialogue. NATIVE FLAGS: none beyond: پیاده‌روی vs قدم زدن for walking; فلم دیدن."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-25). The Zarmina/Homayoun dialogue (lesson04)
    uses the informal تو/-ی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 dialogue (رفتی/کردی). All hobby vocabulary (کتاب خواندن، موسیقی
    گوش کردن، فلم دیدن، پیاده‌روی، آشپزی) is standard, everyday Kabul Dari,
    shared with Farsi but not a borrowed Iranian-specific term -- no
    dialect-divergence risk here, unlike موتر/تکت in unit24.

