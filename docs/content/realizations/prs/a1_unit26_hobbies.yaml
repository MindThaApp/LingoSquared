review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New unit, prs's next uncovered A1 outcome found by exact-diffing every spine_outcome_id used across all prs realization files against every id: in docs/content/universal_spine.yaml (A1-level outcomes only): universal.a1.hobbies.describe_free_time_activities (prerequisite: universal.a1.preferences.express_preferences [unit14], already realized). This is the earliest unrealized A1 outcome by the spine file's own line order (line 809) among the ones prs has not yet covered -- appearance/animals/sports/technology/education/celebrations (lines 833-1032) all come later in file order and remain unrealized too, hobbies is simply the first gap. Six lessons: hobby/free-time vocabulary (سرگرمی, کتاب خواندن, موسیقی گوش کردن reusing unit14's موسیقی, فلم دیدن, پیاده‌روی, آشپزی), a 'what do you like to do in your free time?' question built from وقت (review, unit11) + new آزاد combined into وقت آزاد, reusing the established دوست دارم/دارین construction from unit14 (را object marker retained, consistent with unit14's own register decision), frequency phrases هر هفته and آخر هفته (both built from already-taught هفته, unit04/unit09) applied to the two genuine light-verb hobby collocations پیاده‌روی می‌کنم/آشپزی می‌کنم (کردن reused from its many prior collocational appearances -- سیف می‌کنم unit04, معرفی می‌کنم unit01, زندگی می‌کنم unit01 -- a real, existing pattern in this course, not a new grammar point), a Zarmina/Homayoun dialogue in the established informal تو/-ی register (matching the precedent set by unit20's رفتی/کردی informal past forms -- می‌کنی here is the exact same person-marking suffix applied to the present stem), a short third-person reading passage reusing او (unit25) and دارد (unit14) plus the widely-established 3rd-person می‌کند light-verb form (already used course-wide: زندگی می‌کند unit01/03, صحبت می‌کند unit07), and a wrap-up combining a hobby statement with اما (established unit24/25). Deliberately did NOT introduce می‌خوانم/می‌بینم (irregular present stems of خواندن/دیدن) to describe reading/watching in a full sentence -- kept those two activities strictly to the دوست دارم + gerund construction already established in unit14, reserving the می‌کنم/می‌کند light-verb pattern for the two activities (پیاده‌روی, آشپزی) that are genuine light-verb compounds in Dari -- a deliberate scope decision per AUTHORING_GUIDE.md §1 to avoid a verb-conjugation detour this outcome doesn't call for. Continues the established استم/استین full-uncontracted register policy outside the informal Zarmina/Homayoun dialogue lines. Every word re-declared via introduced_tokens within THIS file per the standing per-file untaught-vocabulary footgun, even for words taught many units earlier (موسیقی, هفته, هر روز, دوست, دارم, دارین, را, در, وقت, من, تو, هم, گاهی, و, دارد, او, می‌کند, اما all re-declared fresh here). Authored §14/§16/§17/§19-compliant from the start: no listen_type/listen_select/listen_order exercises (zero prs audio exists), every matching_pairs exercise sized 6-7 pairs, zero fill_in_blank, every kind:vocabulary card has a real example sentence built from already-taught words. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file -- fa's own a1_unit24_hobbies.yaml, which covers the same spine topic under a different unit number in that course, was not consulted). schema_version 1.1 from the start.

    STATUS: draft, review pending. This file has NOT yet been through the project's mandatory fresh-context review and must not be imported/shipped until that review completes and any findings are fixed. Compiler validation (schema/structure only) was run and is clean, but that is not a substitute for the linguistic/pedagogical review."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-25). The Zarmina/Homayoun dialogue (lesson04)
    uses the informal تو/-ی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 dialogue (رفتی/کردی). All hobby vocabulary (کتاب خواندن، موسیقی
    گوش کردن، فلم دیدن، پیاده‌روی، آشپزی) is standard, everyday Kabul Dari,
    shared with Farsi but not a borrowed Iranian-specific term -- no
    dialect-divergence risk here, unlike موتر/تکت in unit24.

