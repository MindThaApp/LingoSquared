review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered outcome (no prerequisites). Six lessons: everyday places vocabulary, civic/travel places, asking where something is with کجا (building on unit02's origin question), giving simple location answers (near/far/here/there), prepositions of place, and a dialogue asking for directions to a place in a Kabul neighborhood. Deliberately uses Afghan Dari-specific place vocabulary (شفاخانه, مکتب, دواخانه, میدان هوایی) rather than the Iranian Farsi equivalents, authored independently of the fa realization per the sibling-isolation rule. Adapted from Peace Corps Dari material with an active modernization pass. Fresh-context review completed 2026-07-05: verified شفاخانه/مکتب/دواخانه/میدان هوایی and تشکر زیاد/قابلی نداره against real Afghan Dari usage (all genuine, web-checked, not fabricated or overcorrected); fixed two listen_select exercises (lesson01/lesson02 exercise03) whose recorded audio listed every distractor word alongside the correct answer, making 'select what you hear' ungradeable in practice -- audio narrowed to the single tested word; fixed a lesson06 exercise-pacing violation (a listen_type production exercise sat before the lesson's matching_pairs/word_order drag items) by reordering; removed a standalone 'مستقیم بروید' (go straight) teaching card and its dedicated drill exercise that drifted toward the separate directions.ask_follow_basic_directions outcome -- the phrase still appears naturally inside the dialogue turn for scene realism, but is no longer taught/tested as its own objective under this unit's locate_common_places outcome; retargeted that exercise slot to test 'دواخانه دور نیست' (place-proximity content, squarely in scope) instead; corrected an overlay note that misattributed دفتر's prior introduction to the wrong earlier unit. Compiler validation clean (0 errors/0 warnings) after fixes. Audio remains pending generation; human native-speaker review still recommended before this ships, per project policy of no native-speaker review network for prs. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this review completed): a project-wide audit found 7 exercises in this unit (lesson01.exercise03, lesson02.exercise03, lesson03.exercise03, lesson04.exercise03/06, lesson05.exercise03, lesson06.exercise05) were listen_type or bare-prompt listen_select items -- genuinely unanswerable since fa/prs have zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (added the target Dari text as a real visible prompt, English-gloss correct_option/distractors), listen_type -> translation. MATCHING_PAIRS SCALE RETROFIT (§16, added same day, Ramin's direct feedback that 2-3 pair exercises are too small): expanded match_civic_places 4->10 pairs (pooled lesson01's 6 everyday places, all already taught earlier in this unit), match_where_questions 3->8 pairs (constructed 5 more '[place] کجاست؟' questions using already-taught place nouns from lesson01/lesson02 plus this lesson's own taught کجاست question form -- no untaught vocabulary introduced), match_prepositions 3->7 pairs (pooled lesson04's near/far/here/there, same spatial-vocabulary domain). Left match_everyday_places at 6 (already at the floor), match_location_words at 4, and match_dialogue_facts at 2 unchanged -- the latter two are genuine small closed sets (4 deictic location words; 2 specific facts from one dialogue) where expanding further would require padding with untaught or unrelated words, which §16 explicitly prohibits. Re-verified 0 remaining §14 violations and all new pairs use only already-taught vocabulary via script, content_key parity intact, validate+compile both clean after the retrofit."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy. This
    unit deliberately uses distinctively Afghan Dari place vocabulary rather
    than the Iranian Farsi equivalents a learner might otherwise encounter:
    شفاخانه (not بیمارستان) for hospital, مکتب (not مدرسه) for school,
    دواخانه (not داروخانه) for pharmacy, and میدان هوایی (not فرودگاه) for
    airport. Location questions build on چند/کجا question words already
    introduced in earlier units.

