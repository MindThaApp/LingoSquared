  notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 28-33 pass): read together with overlays/en-prs/a2_unit28.yaml and practice/en-prs/a2_unit28.yaml, every teaching card and every exercise. Mechanical sweeps clean (boolean walk, snake_case and jargon scan, title length, spine id, accepted_answers shape, Persian codepoints, rtl); check_dari_register.py reports nothing for this file. Facts are consistent across cards, readings, dialogues and items (Friday cold with maybe snow, Bamyan next week, bus on Friday at eight with passengers there at seven, Nader comes but may be late because of traffic and phones tonight). No Dari string changed in this file; 1 fix in the overlay (see there). NATIVE FLAGS: (a) فردا جلسه مهم است and امروز جلسه مهم است carry no written ezafe, so they also read as the meeting is important; confirm or write جلسهٔ مهم; (b) the overlay teaches احتمالاً with the plain present (probably card, ladder card, matching pair احتمالاً سرد است), while open question (4) below describes احتمالاً with the subjunctive; the learner-facing material is consistent, only the older note differs; (c) the older open questions (1)-(15) below still stand. Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block B unit B2), realizing universal.a2.future.make_predictions_and_promises. Grammar target: (a) predictions with the plain present می‌ plus a time word (فردا باران می‌بارد، امشب هوا سرد می‌شود، پس‌فردا آفتابی می‌شود), (b) uncertainty with شاید and احتمالاً plus the subjunctive (شاید برف ببارد، شاید او نیاید), ممکن است plus the subjunctive, with the subjunctive re-taught here (ب plus present stem, negative ن) because the other new units are written in parallel, (c) promises with حتماً plus the plain present and قول می‌دهم (حتماً امشب تیلفون می‌کنم، فراموش نمی‌کنم، دیگر دیر نمی‌آیم), (d) the written future خواهد plus the short infinitive for RECOGNITION ONLY (Q3 ruling 2026-11-15): it appears in one teaching card (L05 future_written), one forecast reading card, one notice reading card and the reading_comprehension prompts and matching pairs that show those texts; it is never in a typed answer, a word bank, a fill_in_blank, a translation or a dialogue, and the teaching note says to use the spoken forms. Eleven grammar_note cards (present plus time word, same form for plans, subjunctive paradigm, subjunctive of other verbs, negative subjunctive, sure versus maybe, promise form, negative promise, certainty ladder, maybe but promise, written future for recognition). Lesson arc: L01 weather words and the prediction form; L02 شاید, احتمالاً, ممکن است and the subjunctive; L03 promises with حتماً and قول می‌دهم; L04 choosing the strength of the statement and combining a maybe with a promise; L05 a forecast reading, a bus notice reading (with the written future) and a transcript-shown dialogue about the forecast; L06 a transcript-shown dialogue about a meeting plus mixed and culminating production. Spine: reading comprehension (forecast, notice), listening as dialogue_comprehension with the full transcript in the prompt (prs has no TTS), typed production as dialogue_response and writing_prompt, and a culminating writing_prompt that requires a prediction with a time word, a شاید sentence and a حتماً promise (AUTHORING_PREFLIGHT item 7). Characters: two one-off friends نادر and بصیره (both unused anywhere in docs/content/realizations/prs and overlays/en-prs at authoring time), informal تو register. Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = Basira and Nader read the forecast for Friday (cold, maybe snow), so maybe they will not go to Bamyan on Friday, they will go next week when it is sunny, Nader promises; the L05 forecast reading agrees (Friday cold in Bamyan, maybe snow, next week sunny) and the bus notice is for Bamyan next week (Friday at eight, be there at seven); dialogue 2 = tomorrow there is an important meeting, Nader will definitely come but may be late because of traffic, and promises to phone Basira tonight. Binding rulings applied: no progressive, no perfect, no modal beyond ممکن است, no clitics, Kabuli written Dari (copula است/استند, 2pl -ین including باشین, Afghan lexicon بس، تیلفون، ایستگاه). No listen_type, dictation or audio-only item; no خواهم in any exercise answer. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER (with recommended answers): (1) Is پیش‌بینی هوا the natural everyday phrase for a weather forecast, and هوای جمعه (with ezafe) natural after it? Rec: keep. (2) Are فردا هوا سرد می‌شود, امشب هوا ابری می‌شود and هوا آفتابی است natural predictions and descriptions, or would a speaker prefer آسمان ابری است / هوا صاف است? Rec: keep. (3) Is the plain می‌ present with a time word (فردا باران می‌بارد) the normal spoken prediction, with no other marker needed? Rec: yes, as in the Q3 ruling. (4) Is احتمالاً followed by the subjunctive (احتمالاً برف ببارد, احتمالاً سرد است) natural, or does a native prefer احتمالاً with the plain present (احتمالاً برف می‌بارد)? Rec: keep the subjunctive as in the plan, and accept the indicative as an extra if the reviewer prefers it (the unit uses احتمالاً only in two teaching items and one matching pair). (5) Is ممکن است برف ببارد (ممکن است + subjunctive) natural? Rec: keep. (6) Is the negative subjunctive نیاید (not نبیاید), نرویم, نبارد correct as taught? Rec: keep. (7) Is قول می‌دهم (که) می‌آیم the natural way to promise, or would a native say وعده می‌دهم / قول می‌کنم? Rec: keep قول می‌دهم. (8) Is حتماً + plain present natural as a promise (حتماً می‌آیم), and is فراموش نمی‌کنم natural for I will not forget (vs از یادم نمی‌رود)? Rec: keep both. (9) Are دیگر دیر نمی‌آیم and هرگز فراموش نمی‌کنم natural promises not to repeat something? Rec: keep. (10) Reading card only: are خواهد بود, خواهد بارید, حرکت خواهد کرد and the negative حرکت نخواهد کرد the right register for a forecast and a bus notice, and is the short infinitive after خواهد (بارید, کرد) correct? Rec: keep; these appear only in reading items and one recognition card, never in typed answers. (11) Is بس دیر حرکت نخواهد کرد natural for the bus will not leave late, or would a notice say بس به وقت حرکت خواهد کرد? Rec: keep. (12) Is تیلفون می‌کنی (course standard) fine, with زنگ می‌زنی as an extra accepted answer later? Rec: keep تیلفون کردن. (13) Is تو می‌آیی؟ (2sg, to a friend) a natural way to ask will you come, and does the answer without a verb ending change (بلی، حتماً) need to be accepted? Rec: keep; both are accepted. (14) Spelling of هفتهٔ آینده (ezafe hamza) versus هفته آینده and هفتۀ آینده; all three are accepted in the culminating item. Rec: keep هفتهٔ in teaching, accept the others. (15) Is جمعه ساعت هشت (no preposition) natural in the notice, and the position of the date phrase بس هفتهٔ آینده، جمعه ساعت هشت، از ایستگاه حرکت خواهد کرد? Rec: keep.'
