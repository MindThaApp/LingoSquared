review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, fills the unit02 gap between unit01 (greetings) and unit03 (family). Six lessons: name exchange, hometown/origin, occupation, introducing a third person, polite titles and register, and a full gathering dialogue. Adapted from FSI/Peace Corps Dari material with an active modernization pass -- no verbatim import. Authored independently from the fa realization per the sibling-isolation rule; dialect checked against Afghan Dari usage, not assumed from Farsi. Fresh-context review completed 2026-07-05: fixed an Iranian-colloquial contraction (می‌شه -> می‌تانین) that had leaked into lesson05, a lesson05/lesson06 exercise-pacing violation (recognition/drag/production reordered), six 'insert your own name/city/job' exercises whose accepted_answers were ungradeable blank templates (replaced with concrete taught-vocabulary examples matching this project's exact-string grading), a third-person/first-person pronoun mismatch in lesson06's write_profile answer, an illogical accepted reply in lesson04's dialogue_response_introduce, and one orphaned overlay teaching key (gathering_word). Compiler validation clean (0 errors/0 warnings) after fixes. Audio remains pending generation; human native-speaker review still recommended before this ships, per project policy of no native-speaker review network for prs. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this review completed): a project-wide audit found 9 exercises in this unit (lesson01.exercise03/06, lesson02.exercise03/06, lesson03.exercise03/06, lesson04.exercise03/06, lesson06.exercise06) were listen_type or bare-prompt listen_select items -- genuinely unanswerable since fa/prs have zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (added the target Dari text as a real visible prompt, English-gloss correct_option/distractors), listen_type -> translation (English instruction, same Dari accepted_answers). Re-verified 0 remaining §14 violations via script, content_key parity intact, validate+compile both clean after the retrofit. MATCHING_PAIRS SCALE RETROFIT 2026-07-06 (§16, Ramin's direct feedback): expanded match_intro_phrases 3->5 pairs (pooled دوست/همکار, the two relationship words taught earlier in the same lesson). Left match_name_forms (3), match_cities (4), match_occupations (4), match_titles_to_gender (2), and match_dialogue_facts (2) unchanged -- each is a genuine small closed set at this point in the unit (checked against every lesson's introduced_tokens up to that exercise; no further genuinely-taught, on-topic vocabulary exists to pool without violating §16's own 'don't pad with untaught or unrelated words' rule). POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by unit13's fresh-context reviewer flagging the same bug in units 11/12) found this file also had exercises where realization prompt.target_blocks duplicated the overlay's own instruction text verbatim in English -- the compiler would have rendered the same sentence twice to the learner. Fixed mechanically: every affected exercise's prompt set to target_blocks: []. Re-verified validate+compile clean (0 errors/0 warnings) and confirmed zero remaining instruction-duplicate target_blocks via a script comparing every exercise's target_blocks against its overlay instruction.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added a real example sentence to all 12 kind:vocabulary teaching cards, each a natural, comprehensible-from-gloss sentence using the card's own word, consistent with this course's full-form استم/استید register. schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    MATCHING_PAIRS §16 FOLLOW-UP, 2026-08-05: the 2026-07-06 retrofit's blanket-ceiling call on the other exercises still holds, but match_intro_phrases itself had one more genuinely-taught, unpooled item -- expanded 5->6 pairs, adding lesson04's own اجازه بدهین همکارم را معرفی کنم (introduce_formal phrase, taught earlier in the same lesson, not yet used in this exercise). Overlay accepted_answers synced. Re-ran validate+compile clean (0 errors/0 warnings).

    Review 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in the overlay). NATIVE FLAGS: see overlay."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues unit01's respectful-first register policy: teach استم/استین
    polite forms before تو/استی informal singular, and only introduce the
    informal pair with an explicit peer or close-friend context, exactly as
    unit01 does. Possessive clitics are written with a ZWNJ, as in نام‌تان
    and شهرتان, while spaced keyboard variants such as نام تان are accepted
    in production exercises. Occupation vocabulary reflects common Kabul
    urban usage (داکتر، معلم، مهندس، دوکاندار) rather than rural or regional
    variants. Polite third-person introductions use جناب and خانم before a
    name or title, matching everyday urban Afghan usage.

