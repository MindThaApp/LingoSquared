generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session, so real, direct WebFetch access was used instead, per this session's task instructions. WebFetch on the DLI Dari course's own index page (fsi-languages.yojik.eu/languages/DLI/DLI-Dari.html) confirmed -- as prior units already found for other topics -- that the index lists only semester/lesson-group PDF filenames with no per-lesson topic titles, and a second WebFetch asking specifically about lost items/lost and found/misplaced belongings content in the visible index confirmed no filename or title references any of those topics. Semester 1's two previously-untried student-textbook PDF ranges (DLI-Dari-Semester1-s33-36.pdf, s37-40.pdf -- unit40's session had already exhausted s21-24/s25-28/s29-32) were downloaded via curl and run through `pdftotext -layout`, which succeeded cleanly on both, yielding real, searchable Dari/English text (the same working method confirmed for this course's PDFs in units 39 and 40's own sessions). Neither range contains a dedicated lost-item-reporting lesson or dialogue, but their shared cumulative course glossary (repeated near-identically across all books, same as unit40's finding) was searched and found to genuinely contain: خریطه (bag), دستکول (purse -- not used in this unit, خریطه/کیف پول cover the needed items instead), عینک (glasses, already an established review word from unit27), پیدا کردن (to find), and پیدا شدن (to be found / to be available, used directly in this unit's گم شده pairing). Genuinely NOT found anywhere in the located glossary or lesson text: a dedicated word for 'lost'/'missing' (گم), a word for wallet (کیف پول), a word for key (کلید), or any dedicated lost-and-found dialogue/scenario. گم شده (is lost), کیف پول (wallet), and کلید (key) are therefore authored from established standard Afghan Dari usage -- all three are extremely common, everyday words, not obscure or dialect-uncertain choices -- NOT sourced from the located DLI material, flagged here honestly, the same way unit40's اطفائیه and unit24's موتر/تکت register choices were flagged. This unit's scenario, dialogue, and reading passage are authored fresh from already-established in-course conventions (unit17's دارم, unit27's عینک, unit38's رنگ/سیاه/سفید/و, unit15's بزرگ/کوچک, unit40's مه ره/می‌تانین/کنین/چه/تشکر زیاد, unit01's بلی/خواهش می‌کنم, unit02's دیدن root, and the established Homayoun/Zarmina dialogue throughline from units 20/21/22/25/27/37/38/39/40, here using their established informal-تو-register friendship per unit20/26/27's own precedent since this is a calm conversational scene, not an urgent emergency exclamation), extended with the new vocabulary above, modernized current spoken Kabul Dari register throughout, not a translation of any single source."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's realization. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans; no internal-jargon/snake_case leaks in learner-facing options/distractors/pairs; all matching_pairs exercises have 6-12 pairs per AUTHORING_GUIDE.md #16; all exercise types used (multiple_choice/matching_pairs/word_order/translation/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx; no listen_select/dialogue_response/other audio-dependent exercises exist (correctly following AUTHORING_GUIDE.md #14's prs no-TTS restriction, so the nl-unit44-50-style same-speaker-distractor bug class does not apply here -- this unit's multiple_choice exercises are pure text-translation recognition, not audio clip identification); every dialogue teaching-card title matches its own gloss exactly; cross-lesson facts (prices, times, character preferences, item colors/locations) are consistent everywhere referenced within the unit. Dari register/grammar read as sound, consistent Kabul Dari throughout, matching this course's established استم/استین uncontracted register and Afghan-not-Iranian vocabulary choices."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-40). Most of this unit's core sentences are
    1st-person statements (گم شده است، دارم) and 3rd-person state
    descriptions (است/دارد/می‌بیند) about a lost item, plus polite
    2nd-person-plural questions (دیدین؟) consistent with unit40's
    مه ره/می‌توانین/کنین pattern. The Homayoun/Zarmina dialogue
    (lesson04) continues their established informal تو-register
    friendship from units 20/21/22/25/27/37/38/39/40 -- unlike unit40's
    urgent emergency exclamation (which deliberately used no 2nd-person
    forms at all), this is a calm everyday conversation, so it uses the
    same informal register unit20's رفتی/کردی and unit27's برادرت
    already established, via 1st-person دیدم (I saw) rather than a
    2nd-person form directed at Homayoun. کیف پول (wallet) and کلید
    (key) are deliberate standard-Afghan-Dari vocabulary choices (both
    are the everyday, unmarked words for these items), not sourced from
    the DLI material located this session -- flagged the same way
    unit40's اطفائیه and unit24's موتر/تکت register choices were
    flagged.

