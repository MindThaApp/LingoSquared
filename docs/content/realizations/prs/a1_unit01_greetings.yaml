review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context review completed 2026-07-05. Confirmed the previously
    flagged jargon leaks (informal_singular, w_or_v, the_youngest_person)
    were still present and fixed them, plus two more of the same class found
    during this pass (thank_you, good_night as bare distractor values) --
    all replaced with natural learner-facing English phrases
    (lesson01.exercise04's matching pair now reads "w/v"/"y/long i";
    lesson04.exercise02 and lesson05.exercise07 now use full phrases like
    "informal, spoken to one person" and "the elders" instead of snake_case
    tokens). Fixed two "prompt literally displays the correct answer"
    instances in lesson01 (exercise02.recognize_che and
    exercise06.recognize_salam both showed the exact target Dari string as
    the prompt AND as the correct multiple_choice option, making them
    trivial visual-matching tasks instead of real sound/meaning recognition
    -- prompts now show an English cue ("ch" / "hello") per the
    English-cue-prompt convention already used elsewhere in this course,
    e.g. a1_unit04_numbers.yaml). Reordered exercises in lessons 02-06 to
    follow the recognition -> drag/matching -> production pacing the
    AUTHORING_GUIDE requires and that sibling units 02-05 already follow
    consistently -- lessons 02-05 previously interleaved typing/production
    items ahead of remaining recognition items (lesson03 even opened on a
    listen_type production exercise); lesson06 had no drag exercises so its
    3 dialogue_comprehension (recognition) items were moved ahead of all
    speak_response/listen_type/dialogue_response (production) items,
    preserving their internal relative order. Lesson01's own pacing (6+
    recognition/drag exercises before the single, last-positioned
    writing_prompt) was already correct and unchanged in shape. Verified:
    script purity (zero Arabic-range kaf/yeh codepoints U+0643/U+064A
    anywhere in the file, every keheh/yeh instance is the correct
    Persian-range U+06A9/U+06CC); dialect authenticity (استم/استین
    Afghan forms, تشکر as primary "thank you" with ممنون only as an
    accepted secondary variant, تو/استی informal register correctly scoped
    to peer/close-friend context per the course's register_policy, Afghan
    hospitality content -- اهل خانه، بالا بفرمایین، زنده باشین -- reads
    authentic and is explained rather than asserted); no ambiguous
    multiple-choice items (every distractor set checked against its own
    correct_option for unintended overlap); no blank-template
    unanswerable free-text exercises; no bare unquoted yes/no YAML
    footguns (lesson01.exercise07 already quotes "yes"/"no" correctly);
    every content_key in the realization has a matching overlay entry and
    vice versa (43 teaching + 50 exercise keys, zero mismatches, re-checked
    after all edits). Compiler validation clean before and after fixes (0
    errors/0 warnings). Audio remains pending generation (unrelated to this
    review). URGENT FOLLOW-UP 2026-07-05: live QA testing found the whole
    en-prs course failed to actually COMPILE (not just validate) --
    `scripts/compile_content.py compile` runs `validate_dialogue_teaching_card`,
    which only fires during real compilation, not `validate`, so this had
    been silently missed by every prior validate-only check including this
    review. Root cause: lesson06's 6 teaching cards (`lines01_02` through
    `lines11_12`) used the old single-text_block embedded-"Name:"-label
    dialogue format already banned for new/edited cards. Split into 12
    per-speaker-turn cards (`line01`-`line12`) with structured `speaker`
    fields, following the identical pattern already used to fix this same
    bug class in fa/a1_unit01_greetings.yaml and fa/a1_unit02_introductions.yaml.
    Re-verified with the actual `compile` command (not just `validate`) --
    now produces valid JSON output end-to-end.

    AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this
    review completed): a project-wide audit found 11 exercises in this
    unit (lesson02.exercise01/02, lesson03.exercise01/02/04/07,
    lesson04.exercise03/04, lesson06.exercise03/04/06) were listen_type
    or bare-prompt listen_select items -- genuinely unanswerable since
    fa/prs have zero working TTS/recorded audio. Converted: listen_select
    -> multiple_choice (added the target Dari text as a real visible
    prompt, English-gloss correct_option/distractors to avoid
    re-introducing the prompt-shows-answer bug), listen_type ->
    translation (English instruction, same Dari accepted_answers).
    Re-verified 0 remaining §14 violations in this file via script,
    content_key parity intact (49 teaching + 50 exercise keys, zero
    mismatches either direction, reconfirmed programmatically after the
    renames), `validate`+`compile` both clean after the retrofit.

    MATCHING_PAIRS SCALE RETROFIT 2026-07-06 (§16, Ramin's direct
    feedback that 2-3 pair exercises are too small): match_ke_gaf
    expanded 2->12 pairs and match_final_group expanded 4->8 pairs.
    Both are alphabet sound-recognition drills in this unit's
    script_ramp lesson, not vocabulary matchers -- expanded to
    cumulative reviews of every letter group taught so far (rather than
    just the newest pair), picking only letters with mutually distinct
    modern-Persian sounds within each exercise (avoiding true homophone
    pairs like س/ص or غ/ق appearing together, which would make the
    match ambiguous). Re-verified `validate`+`compile` clean after this
    change.


    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added a real example
    sentence to all 5 kind:vocabulary teaching cards, each a natural,
    comprehensible-from-gloss sentence using the card's own word, consistent
    with this course's full-form استم/استید register. schema_version bumped to
    1.1. Example sentences are Claude-authored and pending fresh-context
    review.
course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Teach respectful Afghan Dari forms first, including استم، استین and تشکر.
    Introduce informal singular استی only with an explicit peer or close-friend
    context. خواهش می‌کنم and روز خوش are taught as polite cross-regional forms,
    not uniquely Afghan colloquialisms. This course writes possessive clitics
    after nouns with a ZWNJ, as in نام‌تان and فامیل‌تان, while accepting spaced
    keyboard variants such as نام تان.

