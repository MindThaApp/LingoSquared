    lessons:
      - content_key: prs.a1.unit01.lesson01.script_ramp
        title: خط دری برای سلام و احوال‌پرسی
        spine_outcome_id: null
        module_kind: script_ramp
        teaching:
          - content_key: prs.a1.unit01.lesson01.teach.alef_be_te_dal
            kind: pronunciation_note
            target: {text: "ا، ب، ت، د", language_code: prs, direction: rtl}
            introduced_tokens: [ا, ب, ت, د]
          - content_key: prs.a1.unit01.lesson01.teach.re_ze
            kind: pronunciation_note
            target: {text: "ر، ز", language_code: prs, direction: rtl}
            introduced_tokens: [ر, ز]
          - content_key: prs.a1.unit01.lesson01.teach.sin_shin_sad
            kind: pronunciation_note
            target: {text: "س، ش، ص", language_code: prs, direction: rtl}
            introduced_tokens: [س, ش, ص]
          - content_key: prs.a1.unit01.lesson01.teach.jim_che_he_khe
            kind: pronunciation_note
            target: {text: "ج، چ، ح، خ", language_code: prs, direction: rtl}
            introduced_tokens: [ج, چ, ح, خ]
          - content_key: prs.a1.unit01.lesson01.teach.ayn_ghayn_fe_qaf
            kind: pronunciation_note
            target: {text: "ع، غ، ف، ق", language_code: prs, direction: rtl}
            introduced_tokens: [ع, غ, ف, ق]
          - content_key: prs.a1.unit01.lesson01.teach.ke_gaf_lam_mim
