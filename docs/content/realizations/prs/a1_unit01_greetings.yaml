            kind: pronunciation_note
            target: {text: "ن، و، ه، ی", language_code: prs, direction: rtl}
            introduced_tokens: [ن, و, ه, ی]
          - content_key: prs.a1.unit01.lesson01.teach.connected_salam
            kind: vocabulary
            target: {text: "سلام", language_code: prs, direction: rtl}
            introduced_tokens: [سلام]
