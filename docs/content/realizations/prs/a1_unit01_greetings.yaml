        exercises:
          - content_key: prs.a1.unit01.lesson01.exercise01.recognize_sin
            type: multiple_choice
            tested_text: سلام س
            prompt:
              target_blocks:
                - {text: "سلام", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit01.lesson01.exercise02.recognize_che
            type: multiple_choice
            tested_text: چ
            prompt:
              target_blocks:
                - {text: "ch", language_code: en, direction: ltr}
          - content_key: prs.a1.unit01.lesson01.exercise03.match_ke_gaf
            type: matching_pairs
            tested_text: ا ب ت د ر ز ش ج چ ف ک گ
            prompt: {target_blocks: []}
            pairs:
              - {left: ا, right: a}
              - {left: ب, right: b}
              - {left: ت, right: t}
              - {left: د, right: d}
              - {left: ر, right: r}
              - {left: ز, right: z}
              - {left: ش, right: sh}
              - {left: ج, right: j}
              - {left: چ, right: ch}
              - {left: ف, right: f}
              - {left: ک, right: k}
              - {left: گ, right: g}
          - content_key: prs.a1.unit01.lesson01.exercise04.match_final_group
            type: matching_pairs
            tested_text: خ ق ل م ن و ه ی
            prompt: {target_blocks: []}
            pairs:
              - {left: خ, right: kh}
              - {left: ق, right: "gh/q"}
              - {left: ل, right: l}
              - {left: م, right: m}
              - {left: ن, right: n}
              - {left: و, right: "w/v"}
              - {left: ه, right: h}
              - {left: ی, right: "y/long i"}
          - content_key: prs.a1.unit01.lesson01.exercise05.build_salam
            type: word_order
            tested_text: س ل ا م
            prompt: {target_blocks: []}
            word_bank: [س, ل, ا, م]
          - content_key: prs.a1.unit01.lesson01.exercise06.recognize_salam
