generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "`firecrawl search \"Dari باغ وحش zoo animals vocabulary phrasebook\"` was retried fresh for this unit and again returned HTTP 402 (0 credits), matching every recent unit's status this session -- confirmed by directly re-running the command rather than assuming it was still exhausted. Before falling back to established-conventions-only authoring, the shared scratchpad's already-cached DLI Dari corpus (`/private/tmp/claude-502/.../scratchpad/dli/*.txt`, `dli_search/*.txt`, `dli2/*.txt`, `dli_bike_search/*.txt`, plus the repo's own `.firecrawl/dli-dari-*.txt`) was searched fresh via English-keyword greps (zoo, elephant, lion, monkey, cage, wild animal) and direct Dari-script greps (باغ وحش، شیر، فیل، میمون) across the full corpus. Result, honestly disclosed: one genuine, real, independently attested find -- باغ وحش (zoo / zoological garden) appears as its own alphabetical-glossary entry at the end of three separate DLI Semester-1 lesson-block PDFs (`dli/s29-32.txt` line 1346/2102, `dli/s33-36.txt` line 1498, `dli/s37-40.txt` line 1664, all rendering the same word with minor PDF-extraction glyph-ordering noise, not a real spelling variant), confirming باغ وحش as genuine attested standard Dari for 'zoo,' not a guess -- but it is only a general end-of-book glossary entry, not part of any themed animal or zoo-visit lesson, so no themed vocabulary list, dialogue, or sign text was found alongside it. No attestation found anywhere in the corpus for lion (شیر), elephant (فیل), or monkey (میمون) specifically -- all three are authored from established Persian/Dari conventions: شیر, فیل, and میمون are basic, high-frequency, dialect-neutral Persian/Dari vocabulary shared identically with Iranian Farsi (no register/dialect-divergence risk of the kind unit24's موتر or unit28's پشک flagged, confirmed by the same reasoning already applied to this course's earlier animal words سگ/پرنده/ماهی in unit28, which carry no divergence risk either). شیر is a genuine Dari/Farsi homograph (lion / milk); this unit only ever uses it in unambiguous zoo/animal contexts (never adjacent to any food or drink vocabulary), so no learner-facing ambiguity arises. Four new content words this unit: باغ وحش (DLI-attested), شیر, فیل, میمون. Every other word is course-internal review, confirmed by grepping the full prs corpus for all candidate words before writing a single line of this file: این/است/در/خوب/به (multiple early units), از/تا/هشت/شش/صبح/شب/ساعت/پنجاه (unit04's number set), باز/بسته (unit50), بلیط/چند/افغانی (unit04/unit08/unit23/unit53), بزرگ/کوچک (unit15/unit28), هم/جالب (multiple units/unit14/unit52), بلی/عالی (unit01/unit09/unit10), دوست دارم/دوست دارد/را (unit03/unit14/unit26/unit29/unit39), او/رفت/بود/و (multiple earlier units), دید (unit53's own established 3rd-person 'saw' cell), اما (unit33/unit39-57), محبوب/کدام (unit29/unit39/unit09), and the -تان formal-possessive suffix (unit39-57's established precedent, applied here to محبوب the same way unit53's own بلیط‌تان attached it to an adjective/noun following the head noun). No new grammar beyond ordinary recombination: می‌خواهی/برویم (unit55/unit13's established informal-proposal pair, reused identically), دوست دارم/دوست دارد (unit14/unit39's established preference paradigm), رفت/دید/بود (unit20/unit53's established 3rd-person past-tense cells)."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude): checked against the full checklist (same-speaker-distractor risk in multiple_choice/dialogue_response, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, and exercise-type registration against ExerciseRenderer.tsx) -- no real bugs found in this unit. No listen_select/listen_type/dialogue_comprehension exercises exist in this file (prs has zero TTS/audio coverage per AUTHORING_GUIDE.md #14), so the same-speaker-distractor bug class doesn't structurally arise; every multiple_choice item shows the literal Dari text being translated, not audio, so distractor overlap with other same-speaker lines elsewhere in the dialogue can't create ambiguity the way it does for listen_select. matching_pairs accepted_answers use the established flat-dict shape and word_order accepted_answers use the established space-joined-string shape, both of which the compiler/grade() already canonicalize correctly. Compiler validation (grouped with the rest of the prs A1 corpus, per course-level Course-row scoping) is clean: 0 errors, 0 warnings. Re-verified against the file's own original self-report below, which is accurate. New en-prs A1 unit after unit57 (beach). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.zoo.visit_the_zoo as the next unrealized A1 outcome -- computed programmatically (not by eye): every spine_outcome_ids value across all 60 existing prs realization files was collected into a set and diffed against every universal.a1.* id in the spine file's own order, confirming zoo is the earliest gap and that both listed prerequisites -- universal.a1.animals.describe_pets_animals [unit28] and universal.a1.plans.make_simple_plans [unit13] -- are already realized in prs (the same two prerequisites the diff confirmed, matching this outcome's own declared prerequisites exactly). Matches all four of the outcome's own assessment_requirements: understand_zoo_description (listening substituted with reading-based multiple_choice recognition per AUTHORING_GUIDE.md §14's established no-prs-audio pattern, testing lesson02's hours/price sign reading and lesson05's reading-passage animal detail), describe_zoo_visit (speaking substituted the same way this whole corpus substitutes it -- production exercises across lesson04's propose-and-accept dialogue naming a real animal, plus writing_prompts in lesson01/03/05/06), read_zoo_sign (lesson02's combined opening-hours-and-ticket-price reading card, a genuine two-fact notice-style sentence, mirroring unit53 museum's own exhibition+price combined-reading precedent), and write_zoo_message (writing_prompt exercises across all six lessons). Six lessons, matching beach/museum's own established 6-lesson shape: zoo-and-lion vocabulary (باغ وحش, شیر new), a zoo sign giving opening hours and ticket price (pure recombination, zero new vocabulary, matching unit51-57's own established precedent that a reading/sign lesson doesn't always need fresh vocabulary of its own -- باغ وحش/باز/بسته/از/تا/هشت/شش/صبح/شب/ساعت/بلیط/چند/افغانی/پنجاه all reviewed, deliberately using different hours (8-6) and a different price (50 afghanis) than unit53 museum's 9-5/40 and unit57 beach's 7-5, so the sign lessons aren't near-verbatim duplicates across units), elephant-and-monkey vocabulary (فیل, میمون new), a Homayoun/Zarmina informal dialogue proposing a zoo visit and each naming a favorite animal (matching beach's own single-combined-dialogue shape, informal-تو/-ی friendship register since a zoo outing between friends has no service counter -- no ticket transaction is dramatized in the dialogue itself, the ticket fact lives only in the sign-reading lesson, matching unit55 park's own precedent that not every unit's dialogue needs a service-counter register), a third-person reading passage recapping the visit (رفت reviewed from unit20/unit57, دید reviewed from unit53, بود/او/به/و reviewed from multiple earlier units, no new grammar), and a wrap-up combining a two-character animal-preference contrast with اما (reusing unit39 seasons' own precedent of contrasting Homayoun's and Zarmina's stated preferences rather than a single-speaker vs.-fact contrast, since that is the pattern this unit's own dialogue facts actually support -- lesson04 established Zarmina likes lions and Homayoun likes elephants, and the wrap-up states exactly that, not a new or conflicting preference) and a formal تان-suffixed question introducing the wrap-up's only new-in-file combination, حیوان محبوب‌تان (your favorite animal, unit53's own established -تان-attaches-to-the-following-adjective pattern applied to a new noun phrase). Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit56/unit57's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در/خوب/به از multiple earlier units، باز/بسته از unit50، از/تا/هشت/شش/صبح/شب/ساعت/پنجاه از unit04، بلیط/چند/افغانی از unit04/unit08/unit23/unit53، بزرگ/کوچک از unit15/unit28، هم/جالب از unit14/unit52، بلی/عالی از unit01/unit09/unit10، می‌خواهی/برویم از unit55/unit13، دوست دارم/دوست دارد/را از unit03/unit14/unit26/unit29/unit39، او/رفت/بود/و از multiple earlier units، دید از unit53، اما از unit33/unit39-57، محبوب/کدام از unit29/unit39/unit09، حیوان از unit28. Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit41/unit47-57's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The wrap-up's اما-joined sentence (lesson06 exercise06's write target) uses a single canonical comma-اما form only (with/without a trailing period, both accepted), matching unit33/39-57's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading -- confirmed by explicit review, no other multi-clause translate/write target exists in this unit, so AUTHORING_GUIDE.md §12's multi-variant requirement doesn't otherwise arise. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md §13/§17 don't arise either. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md §14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's six dialogue lines and their speakers (همایون: 3 lines -- propose zoo / say he likes elephants / say monkeys are interesting too; زرمینه: 3 lines -- accept and say she likes lions / say elephants are big / agree and say let's go) were listed and cross-checked by hand before finalizing any multiple_choice distractor, applying the standing same-speaker-distractor rule to text-based recognition items too, not just audio ones -- every distractor for a tested همایون line is drawn exclusively from زرمینه's three lines and vice versa; no exercise in this lesson draws a distractor from the SAME character's other lines. Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md §16). Every vocabulary teaching card (باغ وحش, شیر, فیل, میمون) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md §19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: the zoo's stated opening-hours-and-price fact (از ساعت هشت صبح تا ساعت شش شب باز است؛ بلیط پنجاه افغانی است) is stated identically in lesson02 and never restated elsewhere; the animal-preference facts established in lesson04 (زرمینه likes شیر, همایون likes فیل) are never contradicted by lesson05's reading passage, which states only that Homayoun saw both a lion and an elephant and found the zoo interesting, consistent with (not contradicting) lesson04's stated preferences, and are restated identically (not reversed) in lesson06's wrap-up sentence; no two facts are ever summed or compared arithmetically. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

