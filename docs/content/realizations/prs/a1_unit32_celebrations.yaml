              - {left: هدیه, right: gift}
              - {left: تبریک, right: congratulations}
              - {left: "تولدت", right: "your birthday (informal)"}
              - {left: "تولدت مبارک!", right: "Happy birthday!"}
          - content_key: prs.a1.unit32.lesson01.exercise05.order_happy_birthday
            type: word_order
