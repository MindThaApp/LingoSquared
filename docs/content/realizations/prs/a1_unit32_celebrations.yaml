  - content_key: prs.a1.unit32.audio.celebration.vocab.01
    language: prs
    text: "تولد، جشن، کیک، هدیه، تبریک، تولدت مبارک"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: prs.a1.unit32.audio.dialogue.celebration.01
    language: prs
