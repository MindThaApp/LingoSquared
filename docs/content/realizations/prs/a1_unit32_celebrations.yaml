generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Searched this pass for a fetchable lesson-level celebrations/birthday unit in the Peace Corps Dari course (the same source already in active use for prs's other A1 units) and separately searched live for real Afghan Dari birthday/celebration phrasing: the Live Lingua/fsi-language-courses.org listing for the Peace Corps Dari Language Course again exposes only a single combined PDF with no browsable per-lesson table of contents (same honest search-and-disclose outcome as the unit18/unit24/unit26/unit28/unit29/unit30/unit31 precedents), so no per-lesson scaffold was fetchable for this specific topic either. Authored from established prs conventions and vocabulary already taught earlier in this course instead, with every new Dari word or phrase verified independently via live web search during authoring, not just reasoning: تولدت مبارک confirmed as the genuine, widely-used Dari/Persian birthday greeting (تولد 'birthday' + -ت informal 'your' possessive suffix + مبارک 'blessed/happy'), with تولدتان مبارک noted as the formal register variant (not tested in exercises, register-neutral fixed exclamation used here per the same precedent as other fixed greetings in this course); هدیه confirmed as the standard, everyday Dari/Persian word for a gift/present (تحفه also valid but هدیه is the more common everyday term, so used here); کیک confirmed as the standard loanword for cake in both Dari and Persian, no dialect-divergence risk; تبریک confirmed as the standard Dari/Persian noun for congratulations, paired with می‌گویم (I say) in the everyday light-verb phrase تبریک می‌گویم (I congratulate you)."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), cold read against the
    AUTHORING_GUIDE.md checklist, sibling fa/prs-en/fa-en files never
    opened. Checked: dialogue_comprehension distractors against the
    same speaker's other lines (exercise04's "Eight o'clock.",
    "Nine o'clock.", "Six o'clock." are never said by Basir or Maryam,
    no violation); stray YAML boolean coercion via a real recursive
    yaml.safe_load scan (clean, only the two legitimate schema
    booleans); matching_pairs/word_order answer shapes (correctly
    handled by grade()'s canonical_pairs()/canonical_order_tokens());
    cross-lesson fact consistency (party on Friday, seven o'clock,
    Maryam attending and bringing a gift, Basir happy -- dialogue and
    reading passage agree throughout); جشن/کیک/هدیه/تبریک/تولدت مبارک
    verified as genuine, current Dari/Persian celebration vocabulary,
    no Iranian-Farsi-isms; jargon leaks (none); Unicode codepoints
    (Persian keheh/yeh throughout, او not Pashto هغه/هغوی); §12
    (the اما wrap-up production target already carries bare/comma/
    period variants); §13/§14 (no fill_in_blank, no audio-only prs
    exercise types); §16 (every matching_pairs exercise has 7 real
    pairs); §19 (every vocabulary card has a real example +
    example_gloss). Compiler re-validated clean (0 errors/0 warnings)
    after the batch review pass across units 31-35. No bugs found
    specific to this file; marking reviewed.

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-31). The Basir/Maryam dialogue (lesson04)
    uses the informal تو/-ی register between two newly-introduced
    close-friend characters, matching the precedent set by unit20
    (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), unit28 (داری),
    unit29 (می‌کنی), unit30 (می‌کنی), and unit31 (می‌خوانی). تولدت مبارک
    specifically uses the genuine, widely-used informal Dari/Persian
    birthday greeting; هدیه and کیک are standard shared Persian/Dari
    words with no confirmed dialect-divergence risk.

