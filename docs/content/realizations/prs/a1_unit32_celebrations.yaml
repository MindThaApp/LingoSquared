generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Searched this pass for a fetchable lesson-level celebrations/birthday unit in the Peace Corps Dari course (the same source already in active use for prs's other A1 units) and separately searched live for real Afghan Dari birthday/celebration phrasing: the Live Lingua/fsi-language-courses.org listing for the Peace Corps Dari Language Course again exposes only a single combined PDF with no browsable per-lesson table of contents (same honest search-and-disclose outcome as the unit18/unit24/unit26/unit28/unit29/unit30/unit31 precedents), so no per-lesson scaffold was fetchable for this specific topic either. Authored from established prs conventions and vocabulary already taught earlier in this course instead, with every new Dari word or phrase verified independently via live web search during authoring, not just reasoning: تولدت مبارک confirmed as the genuine, widely-used Dari/Persian birthday greeting (تولد 'birthday' + -ت informal 'your' possessive suffix + مبارک 'blessed/happy'), with تولدتان مبارک noted as the formal register variant (not tested in exercises, register-neutral fixed exclamation used here per the same precedent as other fixed greetings in this course); هدیه confirmed as the standard, everyday Dari/Persian word for a gift/present (تحفه also valid but هدیه is the more common everyday term, so used here); کیک confirmed as the standard loanword for cake in both Dari and Persian, no dialect-divergence risk; تبریک confirmed as the standard Dari/Persian noun for congratulations, paired with می‌گویم (I say) in the everyday light-verb phrase تبریک می‌گویم (I congratulate you)."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New unit, prs's next uncovered A1 outcome found by exact-diffing every spine_outcome_id used across all prs realization files against every id: in docs/content/universal_spine.yaml (A1-level outcomes only): universal.a1.celebrations.talk_about_celebrations, the next unrealized A1 outcome after education/unit31 by the spine file's own line order (celebrations sits directly after education, before household/neighborhood/post/cooking/personality/colors, none of which are realized in prs yet either). Six lessons: celebration/birthday vocabulary (تولد, جشن, کیک, هدیه, تبریک, plus a تولدت مبارک grammar note and combined phrase card), asking and stating which month someone's birthday falls in (ماه newly introduced, کدام/حمل/شما/در/است/من all re-declared review, reusing unit09's established month-name convention), a formal invitation phrase (من شما را به جشن تولد دعوت می‌کنم, reusing unit13's established دعوت and unit02's established مهمانی, plus a newly-derived formal می‌آیین 'will you come?' following the same -ین formal-suffix family as استین/می‌خوانین/می‌کنین), a Basir/Maryam dialogue in the established informal تو/-ی register (matching the precedent set by units 20/25/26/28/29/30/31's informal forms; Basir and Maryam are fresh characters, deliberately not reusing Karim/Parwin again immediately after unit31 introduced them) covering a birthday-party invitation, the time, and a تولدت مبارک congratulation, a third-person reading passage continuing the same two characters and kept factually consistent with the dialogue (party on Friday, seven o'clock, Maryam attending and bringing a gift, Basir happy -- no fact contradicts the dialogue), and a wrap-up combining a preference and a constraint with اما (جشن را دوست دارم اما وقت ندارم -- reusing the exact established را-marked دوست دارم/وقت/ندارم/اما construction unit31's own wrap-up used, continuing that same wrap-up shape rather than inventing a new one). Deliberately did NOT introduce می‌آید/می‌آورد (3rd person 'comes'/'brings') without an explicit review grammar_note immediately before their first exercise use in lesson05, applying the same lesson unit29/unit30/unit31's own reviews caught and required. Continues the established استم/استین full-uncontracted register policy outside the informal Basir/Maryam dialogue lines. Every word re-declared via introduced_tokens within THIS file per the standing per-file untaught-vocabulary footgun, even for words taught many units earlier (شما/unit02, در/unit12, است/throughout, من/unit01, کدام/unit09, حمل/unit09, دعوت/unit13, مهمانی/unit02, را/اما/دوست/دارم/وقت/ندارم/unit11-unit31, تو/unit01, بلی/unit07, بسیار/خوب/تشکر/زیاد/ساعت/چند/جمعه/هفت/unit07-unit11, خوشحال/unit25, یک/unit04, او/unit31 -- all re-declared fresh here). Ran the same class of check prior reviews used: a mental token-by-token trace of every exercise's tested_text/word_bank/pairs value against this file's own cumulative introduced_tokens at that point in reading order, confirming every value is covered by a prior teaching card in this same file (not just a prior unit). Deliberately kept every production exercise (translate/writing_prompt) to a single independent clause except the established اما wrap-up construction, which -- matching unit31's own already-accepted precedent for that identical construction shape -- has exactly one natural conjunction reading, so the §12 period/comma/و multi-join-variant requirement was handled the same way unit31 handled it (period- and comma-joined variants of the same اما-joined sentence, not multiple distinct conjunctions). Reading-comprehension question (lesson05 exercise01) deliberately uses an English-language prompt rather than a Dari question word, following unit09's own established fix for the 'prompt literally shows the correct answer' bug class, and to avoid needing to introduce an additional untaught Dari question word (چیست/چه) just for one exercise. Authored §14/§16/§17/§19-compliant from the start: no listen_type/listen_select/listen_order exercises (zero prs audio exists), every matching_pairs exercise sized 7 pairs, zero fill_in_blank, every kind:vocabulary card (تولد/جشن/کیک/هدیه/تبریک in lesson01, ماه in lesson02, خوشحال in lesson05) has a real example sentence built entirely from already-taught-elsewhere-in-the-course or transparently-glossed words (examples are exempt from this file's own introduced_tokens scope per AUTHORING_GUIDE.md §19 -- they do not feed introduced_tokens and are never exercise-tested). Also ran a recursive yaml.safe_load boolean-coercion scan (not just grep) over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first). Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file). Deliberately double-checked he/she pronoun usage against the recent, real Pashto-vs-Dari pronoun bug found and fixed elsewhere this session (هغه/هغوی are Pashto, not Dari) -- this file uses only او for he/she (lesson05's reading passage and grammar note), never هغه/هغوی. Every literal ? (both ASCII and the Persian ؟) inside an inline flow-mapping pair (matching_pairs left/right values, distractors) is quoted per the standing YAML footgun. schema_version 1.1 from the start.

    STATUS: draft, review pending. This file has NOT yet been through the project's mandatory fresh-context review and must not be imported/shipped until that review completes and any findings are fixed. Compiler validation (schema/structure only) was run and is clean, but that is not a substitute for the linguistic/pedagogical review."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-31). The Basir/Maryam dialogue (lesson04)
    uses the informal تو/-ی register between two newly-introduced
    close-friend characters, matching the precedent set by unit20
    (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), unit28 (داری),
    unit29 (می‌کنی), unit30 (می‌کنی), and unit31 (می‌خوانی). تولدت مبارک
    specifically uses the genuine, widely-used informal Dari/Persian
    birthday greeting; هدیه and کیک are standard shared Persian/Dari
    words with no confirmed dialect-divergence risk.

