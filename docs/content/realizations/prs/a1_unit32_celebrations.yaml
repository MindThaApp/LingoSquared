units:
  - content_key: prs.a1.unit32.celebrations
    title: جشن و تولد
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.celebrations.talk_about_celebrations
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit32.lesson01.celebration_vocabulary
        title: واژه‌های جشن
        spine_outcome_id: universal.a1.celebrations.talk_about_celebrations
        teaching:
          - content_key: prs.a1.unit32.lesson01.teach.birthday_word
            kind: vocabulary
            target: {text: تولد, language_code: prs, direction: rtl}
            introduced_tokens: [تولد]
            example: {text: "تولد من در حمل است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit32.lesson01.teach.celebration_word
            kind: vocabulary
            target: {text: جشن, language_code: prs, direction: rtl}
            introduced_tokens: [جشن]
            example: {text: "جشن ما بزرگ است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit32.lesson01.teach.cake_word
            kind: vocabulary
            target: {text: کیک, language_code: prs, direction: rtl}
            introduced_tokens: [کیک]
            example: {text: "کیک خوشمزه است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit32.lesson01.teach.gift_word
            kind: vocabulary
            target: {text: هدیه, language_code: prs, direction: rtl}
            introduced_tokens: [هدیه]
            example: {text: "این هدیه برای شماست.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit32.lesson01.teach.congratulations_word
            kind: vocabulary
            target: {text: تبریک, language_code: prs, direction: rtl}
            introduced_tokens: [تبریک]
            example: {text: "تبریک می‌گویم!", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit32.lesson01.teach.review_mubarak
            kind: grammar_note
            target: {text: "تولدت (your birthday, informal) + مبارک (blessed) = تولدت مبارک (Happy birthday)", language_code: prs, direction: rtl}
            introduced_tokens: ["تولدت", مبارک]
          - content_key: prs.a1.unit32.lesson01.teach.happy_birthday_phrase
            kind: phrase
            target: {text: "تولدت مبارک!", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit32.lesson01.exercise01.recognize_birthday_word
            type: multiple_choice
            tested_text: تولد
            prompt: {target_blocks: [{text: تولد, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit32.lesson01.exercise02.recognize_gift_word
            type: multiple_choice
            tested_text: هدیه
            prompt: {target_blocks: [{text: هدیه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit32.lesson01.exercise03.recognize_happy_birthday_reading
            type: multiple_choice
            tested_text: "تولدت مبارک!"
