            target: {text: "دوکان (shop) / دوکاندار (shopkeeper) / دوچرخه (bicycle)", language_code: prs, direction: rtl}
            introduced_tokens: [دوکان, دوکاندار, دوچرخه]
          - content_key: prs.a1.unit48.lesson01.teach.rent_word
            kind: vocabulary
            target: {text: کرایه, language_code: prs, direction: rtl}
            introduced_tokens: [کرایه]
            example: {text: "این دوکان کرایه دوچرخه است.", language_code: prs, direction: rtl}
