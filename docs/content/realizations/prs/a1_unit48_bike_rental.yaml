generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits remain exhausted this session, so real, direct WebFetch/curl access plus local pdftotext extraction was used, per this task's own instructions. This task's specific job was to find the next unrealized A1 spine outcome after unit47 (personal_care): universal.a1.bike_rental.rent_a_bicycle ('rent a bicycle'). The DLI Dari course's top-level index (WebFetch on the site's own DLI-Dari.html listing) confirms Semester 1's full s1-40 range, Semester 2's both Student volumes, and Semester 3's both Student books were ALL already fully checked by prior units (most recently unit47's own provenance note) -- no re-check of those was done here. This task instead checked, for the first time this session, every remaining un-checked document in Semester 3's own 'Other documents' section: All conversations 2006 (292KB), All Scenarios 2006 (1.9MB), Discussion.pdf (272KB), Fill-ins 2006 (245KB), Short Stories 2006 (51MB, 73 pages), Cards 41-60 2006 (17MB, 40 pages), Cards 61-80 2006 (20MB, 40 pages), Performance Checks 2006 (289KB), and Comprehensive military topics (310KB) -- all nine downloaded via curl and cleanly extracted with pdftotext -layout, a genuine, substantive extension of source coverage beyond every prior unit's own disclosed search. A keyword grep (bicycle/bike/rental/rent a/hire a, plus direct Dari-script greps for دوچرخه and کرایه) across all nine extracted texts found NO dedicated bicycle-rental lesson or scenario anywhere. Two narrow, honestly disclosed near-hits were found: (1) Cards 61-80's Heavy Equipment card deck (Cards 66) lists 'H. ATV / quad bike' glossed against موترسیکل چهارعراده‌یی ('four-wheeled motorcycle') -- a military heavy-vehicle vocabulary item, not a civilian rental scenario, and not reused; (2) Performance Checks' description-practice prompt list (item c) includes 'Describe your computer / cell phone / car / bike / wallet / Christmas tree' glossed with بایسکل تان را ('your bicycle') -- confirming بایسکل (a English-loanword form of 'bicycle') as a real source-attested Dari word, though only as a one-word item in an unrelated description-practice list, not a rental scenario or sentence -- not reused verbatim, and deliberately NOT adopted as this unit's word for 'bicycle' in favor of staying consistent with this course's own already-established دوچرخه (unit24 transportation), which is the more course-consistent choice per AUTHORING_GUIDE.md's dialect-authenticity discipline (reuse this course's own prior vocabulary decisions rather than switching to a synonym mid-course). Given the DLI corpus (now checked in full across all three semesters and every 'Other documents' supplement) has no bicycle-rental content, this unit is authored FRESH per AUTHORING_GUIDE.md #10's own fallback provision, built entirely from this course's OWN already-established in-corpus vocabulary and grammar patterns: دوچرخه (bicycle, unit24 transportation), دوکان/دوکاندار (shop/shopkeeper, unit10 shopping, reused across many later units), بگیرم (subjunctive 'take/get', unit42 appointments and unit43 library -- its established 'X می‌خواهم Y بگیرم' pattern, e.g. library's 'یک کتاب قرض بگیرم' and appointments' 'یک قرار بگیرم', is directly extended here with a new object noun (کرایه) rather than a new grammar point), پس دادن (give back/return, unit43 library) whose 3rd-person indicative می‌دهد is independently already attested in unit18's own body text ('هر روز درس می‌دهد', teaches), and افغانی/چند/پنجاه/نود (currency and numbers, unit04/unit10/unit23). Three new content words: کرایه (rent/rental fee -- already independently attested inside this exact corpus at a2_unit09 bureaucracy's 'رسید کرایه خانه', house-rent receipt, confirming it as a real, already-course-attested Dari word, reused here for a different but cognate rental sense), روزانه (daily/per day -- standard, everyday modern Dari/Persian adverb, not source-derived, chosen over the more awkward 'در یک روز' for stating a daily rate), and تذکره (Afghan national ID card -- also already independently attested inside this exact corpus at a2_unit09's own ID-card-as-registration-proof usage, reused here for its equally real, common Afghan practice of leaving an ID card as rental-shop collateral rather than a cash deposit -- a genuinely authentic register/culture detail per AUTHORING_GUIDE.md #3, not a Western cash-deposit assumption). One expected paradigm cell: می‌خواهد (3rd-person 'wants'), the exact same already-established precedent unit47 itself set for introducing a 3rd-person cell of an already-taught 1st-person verb as low-complexity, not a new grammar point; بگیرد (3rd-person subjunctive 'so that he/she takes') and پس می‌دهم/پس می‌دهین (1st-person/2nd-person-polite 'give back') are introduced the same way unit47 folded اصلاح می‌کند into a bundled review bullet rather than a standalone vocabulary card -- pure mechanical -م/-ین/-د suffix substitution on an already-established verb stem, using the exact same suffix set (-م, -ین, -د) every other verb in this corpus already uses."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit47 (personal_care). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.bike_rental.rent_a_bicycle as the next unrealized A1 outcome (immediately after personal_care in the spine file's own line order; both listed prerequisites -- universal.a1.money.handle_basic_money_matters [unit23] and universal.a1.transportation.getting_around_town [unit24] -- are already realized). This unit covers renting a bicycle from a shop, asking the daily price, understanding that an ID card is needed as collateral, and agreeing a return time, matching all four of the outcome's own assessment_requirements: understand_rental_terms (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14), request_bike_rental (speaking substituted the same way this whole corpus substitutes it -- production exercises: translation/writing_prompt/word_order naming the rental request or return time), read_rental_notice (lesson05's reading passage recapping lesson04's own dialogue facts, price included, per AUTHORING_GUIDE.md #11), and write_rental_message (writing_prompt exercises across all six lessons). Six lessons: bike-rental-shop vocabulary (کرایه new; دوکان/دوکاندار/دوچرخه reviewed from unit10/unit24), asking to rent and the daily price (روزانه new; بگیرم/می‌خواهم/چند/افغانی/پنجاه reviewed from unit42/unit43/unit04/unit10/unit23), ID card as deposit and return time (تذکره new; پس دادن/کی/فردا reviewed from unit43/unit16/unit09; پس می‌دهم introduced as the expected 1st-person present form of the same already-taught پس دادن), a Homayoun/دوکاندار bike-rental-shop dialogue combining all of lessons 01-03's vocabulary (no new vocabulary in this lesson, pure recombination, matching the established pattern that a dialogue lesson doesn't always need fresh vocabulary of its own), a third-person reading passage recapping the same dialogue's facts (می‌خواهد new, the expected 3rd-person paradigm cell of already-taught می‌خواهم, matching unit47's own precedent for introducing an expected paradigm cell as low-complexity, not a new grammar point; بگیرد and پس می‌دهد bundled into a review grammar_note the same way unit47 folded اصلاح می‌کند in without a standalone vocabulary card), and a wrap-up contrasting a one-day rental price with a two-day rental price using اما plus a formal تان-suffixed rental question, mirroring unit39-47's own wrap-up shape (کرایه‌تان, 'your rental', reusing the same -تان suffix pattern as unit47's قرارتان and unit46's نسخه‌تان). Deliberately used a DIFFERENT quantity (two days at 90 afghanis) than lesson02/04/05's stated one-day rate (50 afghanis) to avoid any appearance of an AUTHORING_GUIDE.md #11 arithmetic conflict -- a bundled multi-day rate that isn't simply 2x the daily rate is a realistic bulk-discount detail, not a bug, and lesson06 is explicitly framed as a separate, generic second-person price-list question ('your rental'), not a restatement of Homayoun's specific one-day visit, the exact same framing device unit46/unit47's own lesson06 used for their own price contrasts. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (این/است/در از multiple earlier units, دوکان/دوکاندار از unit10 (reused unit18/unit23/unit34), دوچرخه از unit24, بگیرم از unit42/unit43, پس دادن از unit43, می‌دهد از unit18, کی از unit16, فردا از unit09, تشکر زیاد/بفرمایین/بسیار خوب از unit01/unit09/unit10/unit40/unit46/unit47, روز خوش از unit01, برای از unit42, افغانی/چند/پنجاه/نود از unit04/unit10/unit23, دو/روز/یک/را از unit04/unit09/unit14/unit26, بلی از unit01/unit03, اما از unit33/unit39-47, همایون/او از multiple earlier units). Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit47's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form only, matching unit33/39-47's own established precedent that this construction has exactly one natural conjunction reading -- no other multi-clause translate/write exercise exists in this unit, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead. Zero fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs). Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (کرایه, روزانه, تذکره, می‌خواهد) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. §11 cross-lesson fact check: lesson02/04/05's stated daily rate (روزانه پنجاه افغانی, 50 afghanis) is identical everywhere it's referenced; lesson06's wrap-up (90 afghanis for two days) is a clearly separate, generic multi-day price-list scenario framed with the formal 'your rental' question, not a restatement of Homayoun's specific one-day visit, so it does not conflict with lesson02/04/05's stated facts even though 90 isn't simply double 50 -- a bundled multi-day rate differing from a simple per-day multiple is realistic, not a bug, and framing keeps it unambiguous either way. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

