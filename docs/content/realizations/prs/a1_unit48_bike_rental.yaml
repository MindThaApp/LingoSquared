    established Homayoun character opposite a دوکاندار (shopkeeper) role,
    reusing the same polite-service register unit08's/unit10's
    دکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit46's
    دواساز, and unit47's دلاک exchanges already established -- not the
    informal-تو friendship register. Lesson05's reading passage uses a
    3rd-person statement naming همایون explicitly in its first sentence,
    then او in the following sentences, matching unit27/unit47's own
    reading-passage precedent, and lesson06's wrap-up uses the same formal
    شما-تان-suffixed question pattern unit39-47 already established.

