generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits remain exhausted this session, so real, direct WebFetch/curl access plus local pdftotext extraction was used, per this task's own instructions. This task's specific job was to find the next unrealized A1 spine outcome after unit47 (personal_care): universal.a1.bike_rental.rent_a_bicycle ('rent a bicycle'). The DLI Dari course's top-level index (WebFetch on the site's own DLI-Dari.html listing) confirms Semester 1's full s1-40 range, Semester 2's both Student volumes, and Semester 3's both Student books were ALL already fully checked by prior units (most recently unit47's own provenance note) -- no re-check of those was done here. This task instead checked, for the first time this session, every remaining un-checked document in Semester 3's own 'Other documents' section: All conversations 2006 (292KB), All Scenarios 2006 (1.9MB), Discussion.pdf (272KB), Fill-ins 2006 (245KB), Short Stories 2006 (51MB, 73 pages), Cards 41-60 2006 (17MB, 40 pages), Cards 61-80 2006 (20MB, 40 pages), Performance Checks 2006 (289KB), and Comprehensive military topics (310KB) -- all nine downloaded via curl and cleanly extracted with pdftotext -layout, a genuine, substantive extension of source coverage beyond every prior unit's own disclosed search. A keyword grep (bicycle/bike/rental/rent a/hire a, plus direct Dari-script greps for دوچرخه and کرایه) across all nine extracted texts found NO dedicated bicycle-rental lesson or scenario anywhere. Two narrow, honestly disclosed near-hits were found: (1) Cards 61-80's Heavy Equipment card deck (Cards 66) lists 'H. ATV / quad bike' glossed against موترسیکل چهارعراده‌یی ('four-wheeled motorcycle') -- a military heavy-vehicle vocabulary item, not a civilian rental scenario, and not reused; (2) Performance Checks' description-practice prompt list (item c) includes 'Describe your computer / cell phone / car / bike / wallet / Christmas tree' glossed with بایسکل تان را ('your bicycle') -- confirming بایسکل (a English-loanword form of 'bicycle') as a real source-attested Dari word, though only as a one-word item in an unrelated description-practice list, not a rental scenario or sentence -- not reused verbatim, and deliberately NOT adopted as this unit's word for 'bicycle' in favor of staying consistent with this course's own already-established دوچرخه (unit24 transportation), which is the more course-consistent choice per AUTHORING_GUIDE.md's dialect-authenticity discipline (reuse this course's own prior vocabulary decisions rather than switching to a synonym mid-course). Given the DLI corpus (now checked in full across all three semesters and every 'Other documents' supplement) has no bicycle-rental content, this unit is authored FRESH per AUTHORING_GUIDE.md #10's own fallback provision, built entirely from this course's OWN already-established in-corpus vocabulary and grammar patterns: دوچرخه (bicycle, unit24 transportation), دوکان/دوکاندار (shop/shopkeeper, unit10 shopping, reused across many later units), بگیرم (subjunctive 'take/get', unit42 appointments and unit43 library -- its established 'X می‌خواهم Y بگیرم' pattern, e.g. library's 'یک کتاب قرض بگیرم' and appointments' 'یک قرار بگیرم', is directly extended here with a new object noun (کرایه) rather than a new grammar point), پس دادن (give back/return, unit43 library) whose 3rd-person indicative می‌دهد is independently already attested in unit18's own body text ('هر روز درس می‌دهد', teaches), and افغانی/چند/پنجاه/نود (currency and numbers, unit04/unit10/unit23). Three new content words: کرایه (rent/rental fee -- already independently attested inside this exact corpus at a2_unit09 bureaucracy's 'رسید کرایه خانه', house-rent receipt, confirming it as a real, already-course-attested Dari word, reused here for a different but cognate rental sense), روزانه (daily/per day -- standard, everyday modern Dari/Persian adverb, not source-derived, chosen over the more awkward 'در یک روز' for stating a daily rate), and تذکره (Afghan national ID card -- also already independently attested inside this exact corpus at a2_unit09's own ID-card-as-registration-proof usage, reused here for its equally real, common Afghan practice of leaving an ID card as rental-shop collateral rather than a cash deposit -- a genuinely authentic register/culture detail per AUTHORING_GUIDE.md #3, not a Western cash-deposit assumption). One expected paradigm cell: می‌خواهد (3rd-person 'wants'), the exact same already-established precedent unit47 itself set for introducing a 3rd-person cell of an already-taught 1st-person verb as low-complexity, not a new grammar point; بگیرد (3rd-person subjunctive 'so that he/she takes') and پس می‌دهم/پس می‌دهین (1st-person/2nd-person-polite 'give back') are introduced the same way unit47 folded اصلاح می‌کند into a bundled review bullet rather than a standalone vocabulary card -- pure mechanical -م/-ین/-د suffix substitution on an already-established verb stem, using the exact same suffix set (-م, -ین, -د) every other verb in this corpus already uses."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's realization. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans; no internal-jargon/snake_case leaks in learner-facing options/distractors/pairs; all matching_pairs exercises have 6-12 pairs per AUTHORING_GUIDE.md #16; all exercise types used (multiple_choice/matching_pairs/word_order/translation/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx; no listen_select/dialogue_response/other audio-dependent exercises exist (correctly following AUTHORING_GUIDE.md #14's prs no-TTS restriction, so the nl-unit44-50-style same-speaker-distractor bug class does not apply here -- this unit's multiple_choice exercises are pure text-translation recognition, not audio clip identification); every dialogue teaching-card title matches its own gloss exactly; cross-lesson facts (prices, times, character preferences, item colors/locations) are consistent everywhere referenced within the unit. Dari register/grammar read as sound, consistent Kabul Dari throughout, matching this course's established استم/استین uncontracted register and Afghan-not-Iranian vocabulary choices.\n\nReview 2026-10-20 (en-prs A1 pass): 4 fixes - gloss Hello, please -> Hello, welcome (matches the other units); lesson03 title تذکره را برای کرایه fixed to تذکره برای کرایه; two-day price sentence changed from در دو روز (in two days) to برای دو روز (for two days) everywhere; pair English I want your ID card -> I need your ID card. NATIVE FLAGS: see overlay."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-47). Lesson04's dialogue introduces the
    established Homayoun character opposite a دوکاندار (shopkeeper) role,
    reusing the same polite-service register unit08's/unit10's
    دکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit46's
    دواساز, and unit47's دلاک exchanges already established -- not the
    informal-تو friendship register. Lesson05's reading passage uses a
    3rd-person statement naming همایون explicitly in its first sentence,
    then او in the following sentences, matching unit27/unit47's own
    reading-passage precedent, and lesson06's wrap-up uses the same formal
    شما-تان-suffixed question pattern unit39-47 already established.

