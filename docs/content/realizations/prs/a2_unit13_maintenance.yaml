        spine_outcome_id: universal.a2.housing.report_maintenance_problem
        teaching:
          - content_key: prs.a2.unit13.lesson01.teach.malfunction_word
            kind: vocabulary
            target: {text: خرابی, language_code: prs, direction: rtl}
            introduced_tokens: [خرابی]
            example: {text: "خرابی لوله را گزارش دادم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit13.lesson01.teach.pipe_word
            kind: vocabulary
            target: {text: لوله, language_code: prs, direction: rtl}
            introduced_tokens: [لوله]
            example: {text: "لولهٔ آشپزخانه چکه می‌کند.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit13.lesson01.teach.electricity_word
            kind: vocabulary
            target: {text: برق, language_code: prs, direction: rtl}
            introduced_tokens: [برق]
            example: {text: "برق اتاق خوابم کار نمی‌کند.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit13.lesson01.teach.leak_word
            kind: vocabulary
            target: {text: چکه, language_code: prs, direction: rtl}
            introduced_tokens: [چکه]
            example: {text: "چکهٔ لوله هر شب بدتر می‌شود.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit13.lesson01.teach.repair_word
            kind: vocabulary
            target: {text: تعمیر, language_code: prs, direction: rtl}
            introduced_tokens: [تعمیر]
            example: {text: "تعمیر لوله فردا می‌شود.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit13.lesson01.teach.worker_word
            kind: vocabulary
            target: {text: کارگر, language_code: prs, direction: rtl}
            introduced_tokens: [کارگر]
            example: {text: "صاحب خانه یک کارگر می‌فرستد.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit13.lesson01.teach.asap_grammar
            kind: grammar_note
            target: {text: "هر چه زودتر (as soon as possible)", language_code: prs, direction: rtl}
            introduced_tokens: [هر, چه, زودتر]
