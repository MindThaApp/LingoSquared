            type: multiple_choice
            tested_text: خرابی
            prompt: {target_blocks: [{text: خرابی, language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit13.lesson01.exercise02.recognize_pipe
            type: multiple_choice
            tested_text: لوله
            prompt: {target_blocks: [{text: لوله, language_code: prs, direction: rtl}]}
