  notes: 'Grammar-led A2 rebuild, Block A unit A5 (docs/A2_REBUILD_PLAN.md), realizing universal.a2.experience.talk_about_life_experiences. Grammar target: the present perfect = past participle (past stem + ه: رفته، خورده، دیده، پخته، کرده) + the short copula, taught in BOTH forms per ruling Q3 (2026-11-15): the formal written attached endings رفته‌ام، رفته‌ای، رفته است، رفته‌ایم، رفته‌اید، رفته‌اند, and the spoken Kabuli forms رفته استم، رفته استی، رفته است، رفته استیم، رفته استین، رفته استند; every production answer list accepts both. Negation نرفته‌ام / نرفته استم; words تا حال، هرگز، هیچ‌وقت، قبلا، هنوز، یک بار / دو بار / چند بار; contrast with the simple past (پارسال به هرات رفتم). Lesson arc: L01 vocabulary (places, dishes, travel) plus both paradigms, recognition and matching; L02 participle rule, more verbs, spoken forms in matching; L03 negative and present perfect vs simple past; L04 ever / never / already / not yet in the scenario; L05 reading profile plus transcript-shown listening; L06 dialogue plus mixed production and the culminating three-sentence message. 6 lessons, 40 exercises, 10 grammar_note cards. Spine delivery: reading (L05 profile), listening (two dialogues, full transcript shown because prs has no TTS), speaking-style exchange (dialogue_response in L04 and L06) and writing (L06 write_message_to_friend: two experiences, one question). Not taught: the future and خواهم رفت; object clitics; progressive. Characters: reuses زرمینه and همایون after grepping realizations/prs: همایون works in an office on weekdays and spends weekends with family (a2_unit17), زرمینه goes to the market with friends, likes movies and cooks (a1_unit26, a2_unit17, a2_unit19); nothing in the corpus pins travel history for either, so the trips and dishes here are new one-off facts. Fact table kept consistent across L04-L06: زرمینه has been to Herat (once) and Mazar-i-Sharif, never to Bamyan, has eaten mantu and qabili palaw, has cooked qabili palaw, has never flown; همایون has been to Mazar-i-Sharif twice, not yet to Herat, has not yet cooked qabili palaw but has eaten it, has flown once. Register: formal written Kabul Dari in notes and the reading, informal تو and spoken forms in friend dialogue; 2pl formal written رفته‌اید is used in the formal paradigm and was NOT flagged by scripts/check_dari_register.py, the spoken 2pl is رفته استین. Afghan lexicon: فلم، طیاره، بس، بلی/نخیر. Listening: distractors hand-checked so none is said or implied by the tested speaker; no listen_type, dictation or audio-only item. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Is رفته‌اید right for formal written 2pl or should the written form be رفته‌اید / رفته‌این in Kabul usage? (2) Is the spoken 3sg bare participle (او رفته) natural in Kabuli, and is رفته است also used in speech? (3) Is هرگز with a negative present perfect (به بامیان هرگز نرفته‌ام) natural, and how does it compare with هیچ‌وقت? (4) Is قبلا (spelled without tanwin, as elsewhere in the course) the natural word for already and before in قبلا به هرات رفته‌ام, and is هنوز نرفته‌ام natural for not yet? (5) Is آیا تا حال ... ؟ the natural everyday way to ask Have you ever...? (6) Is با طیاره سفر کردن the natural phrase for to fly, and سفر نکرده استم with the object omitted in dialogue? (7) Is پخته استم unambiguous as I have cooked, given پخته can also mean cooked or mature as an adjective? (8) Is the placement of هم in قابلی پلو هم پخته‌ام natural? (9) Is the hyphenated rendering of هیچ‌وقت versus هیچ وقت right? (10) Description of بامیان, هرات and مزار شریف in the notes: fine for a learner?'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari for narration, notes and the reading text: present perfect with attached endings (رفته‌ام), copula است/استم/استی/استیم/استین/استند, 2pl -ین in taught past and spoken forms, no Tehrani colloquialisms. Friend dialogue between زرمینه and همایون uses the informal تو-register and the spoken Kabuli present perfect (رفته استم). Both perfect forms are taught and accepted everywhere. The future is not taught.'
