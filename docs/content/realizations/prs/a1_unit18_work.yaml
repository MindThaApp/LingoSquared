review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered outcome (universal.a1.work.describe_job, prerequisites: introductions/unit02 and routines/unit12, both already covered). Note: fa already claimed and completed its own a1_unit18_work.yaml/en-fa overlay before this file was started (checked recent file activity first) -- this is prs's independently-authored own unit for the same spine outcome, per the sibling-isolation rule, not a copy. Six lessons: occupation vocabulary (معلم/مهندس/داکتر/دوکاندار, reusing unit02's established urban-occupation set and unit10's established دوکاندار), workplace vocabulary (دفتر/دوکان/شفاخانه/مکتب, reusing unit05's established Afghan place vocabulary), combining occupation+workplace and asking کجا کار می‌کنین؟ (where do you work), reading a short work profile, reading a longer profile that adds a daily work activity (هر روز درس می‌دهد), and a dialogue asking about someone's job. Uses full, uncontracted forms (کار می‌کنم، کار می‌کنین، کار می‌کند) consistent with the established register policy from units 01-17. Authored independently of the fa realization per the sibling-isolation rule -- the fa a1_unit18_work.yaml file was not opened at any point while authoring this file. Authored §14/§16/§17-compliant from the start, proactively applying the exact lesson learned from unit17's own fresh-context review: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6-8 pairs, zero fill_in_blank exercises. The three multi-clause production exercises (write_work_profile in lesson05, dialogue_response_own_job in lesson06, write_dialogue_summary in lesson06) all carry period-joined, comma-joined, and و-joined variants at EVERY clause boundary (not just the first), all marked status: correct -- this full-boundary-coverage discipline is applied from the start this time, directly informed by the exact §12 gap unit17's fresh-context review caught and required fixing after the fact.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-07 (Codex probed again, still usage-exhausted, same Jul 8 9:37 AM reset window -- fell back to a separate general-purpose subagent with zero access to this file's authoring reasoning, same contingency as unit17). Compiler validate re-run clean (0 errors/0 warnings). Independently re-verified and confirmed CLEAN: spine-outcome discipline (all 4 assessment_requirements genuinely covered across the 6 lessons); §14 (zero listen_type/listen_select/listen_order, every substitute instruction honestly says \"Read\"); §17 (zero fill_in_blank); jargon leaks; script purity (zero Arabic-range kaf/yeh); instruction/answer coherence; §11 cross-lesson fact consistency (Laila/Negar scenarios independently self-consistent); content_key parity (exact 1 unit/6 lessons/32 teaching/30 exercises both sides, programmatically diffed to empty). Most importantly, §12 multi-clause boundary coverage was independently re-derived from scratch via a full join-combination classification (not just spot-checked) and confirmed genuinely complete at every clause boundary in all three multi-clause exercises -- the unit17 gap does not recur here. Dialect claims (شفاخانه/مکتب vs Iranian equivalents) independently web-verified as genuinely distinct; داکتر and کار می‌کنم/کار می‌کنین/کار می‌کند forms confirmed correct/uncontracted throughout (37 occurrences checked, zero fused variants). Also independently re-verified the 4 stray-boolean fixes (بلی/yes in a pairs entry and 3 overlay fields) are genuinely fixed with zero remaining unexpected booleans in either file.

    Two minor, non-blocking documentation-accuracy nits the reviewer caught, corrected here rather than left overclaimed (the exact kind of self-report inflation unit17's review also caught -- this file's notes above have already been edited to remove the overclaim rather than describing then un-claiming it): this file's original draft said every matching_pairs exercise beyond lesson01 'pools already-taught review vocabulary from earlier lessons' -- lesson02's match_workplace_words is actually 6 pairs of entirely its own new vocabulary (still meets the 6-pair floor, just doesn't pool); and the register_policy's دوکاندار-vs-Iranian claim is directionally correct (Afghan Dari's standard term) but slightly overstated exclusivity (دوکاندار is also recognized, if non-standard, in Iranian Farsi) -- softened to 'the standard Afghan Dari term' rather than an absolute claim. Also flagged as a genuine but low-severity nuance, not fixed: lesson05/lesson06 place one reading_comprehension/dialogue_comprehension exercise after that lesson's matching_pairs exercise -- AUTHORING_GUIDE §2's taxonomy doesn't explicitly classify reading_comprehension/dialogue_comprehension as recognition- or production-tier, so this is a plausible-but-unaddressed edge case in the guide itself, not a clear violation. No other issues found. Recommends review: status: reviewed, which this file now reflects.

    SECOND, FULLY INDEPENDENT FRESH-CONTEXT REVIEW, 2026-07-07 (zero access to any prior reviewer's reasoning, sibling fa files never opened, dispatched separately after discovering this file had already been marked reviewed by a concurrent pass mid-task): re-derived every check from scratch against AUTHORING_GUIDE.md and universal_spine.yaml's describe_job outcome directly. Confirmed all 4 assessment_requirements genuinely covered, exercise pacing correct in all 6 lessons, §14/§16/§17 compliant (zero listen_type/select/order, matching_pairs sizes 6/6/7/6/8/6 confirmed programmatically, zero fill_in_blank), zero jargon leaks, zero Arabic-range kaf/yeh, zero stray YAML booleans beyond the 2 legitimate schema booleans (re-ran an independent recursive yaml.safe_load scan), zero duplicate realization-prompt-vs-overlay-instruction text, zero same-script prompt-shows-answer leakage across every multiple_choice/reading_comprehension/dialogue_comprehension exercise, and exact content_key parity both directions (1 unit/6 lessons/32 teaching/30 exercises). Ran a fresh ZWNJ-aware, Persian-punctuation-stripping Python tokenizer checking every tested_text/prompt.target_blocks/pairs.left value plus every overlay accepted_answers/correct_option/distractors value against cumulative file-scoped introduced_tokens (کار, استم, کجا, هر, روز, بلی, etc. all confirmed genuinely re-taught fresh in this file) -- zero untaught-vocabulary violations, confirming the file's own claim. Independently cross-checked unit02/unit10/unit05's own already-reviewed files directly: confirmed معلم/مهندس/داکتر/دوکاندار genuinely established in unit02 and دوکاندار in unit10, and دفتر/شفاخانه/مکتب genuinely established in unit05 -- but found and fixed a real documentation-accuracy bug the prior pass missed: the register_policy claimed دوکان (shop) was also established in unit05, when a direct grep of a1_unit05_places.yaml shows دوکان never appears there at all -- it is unit10's word (shopping unit, alongside دوکاندار), not unit05's. Corrected register_policy to attribute دوکان to unit10 instead. §11 fact cross-check confirmed Laila (teacher/school/daily) and Negar (doctor/hospital/daily) are genuinely independent, non-contradictory scenarios. §12 multi-clause coverage re-verified by explicit enumeration of every punctuation-join combination (not spot-check) in all three multi-clause exercises: write_work_profile and write_dialogue_summary both have complete 3x3 (period/comma/و at both boundaries) coverage for their primary scenario -- genuinely clean, confirming the prior pass's claim. FOUND AND FIXED a real bug the prior pass missed: dialogue_response_own_job's feedback claimed \"Any true occupation and workplace pairing from this unit's vocabulary...is equally accepted\" but its accepted_answers only covered 2 of the 4 taught occupation/workplace pairs (معلم/مکتب, داکتر/شفاخانه) -- a learner correctly answering with مهندس/دفتر or دوکاندار/دوکان (both genuinely taught in this unit) would have been marked wrong despite the feedback's own explicit promise; fixed by adding the 6 missing variants (both remaining pairs x period/comma/و) to the overlay, now matching write_work_profile's full 4-occupation coverage and making the feedback's claim actually true. Re-ran the actual compiler (validate then compile, not just validate) after both fixes: 0 errors/0 warnings, valid JSON output, dialogue_response_own_job's compiled accepted list confirmed to carry all 12 variants. This file is now genuinely clean; status: reviewed confirmed correct.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 15 kind:vocabulary teaching cards (1 merged card -- the names list -- given a positionally-matched list of examples), each a natural, comprehensible-from-gloss sentence built from vocabulary already taught in this same lesson or earlier in this file. The names card's example uses the well-established استم copula, matching units 12-17's own precedent. schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    full, uncontracted verb forms (کار می‌کنم، کار می‌کنین، کار می‌کند kept
    as separate words, not fused/contracted), consistent with units 01-17.
    Occupation/workplace vocabulary reuses this course's own established
    Afghan Dari terms (معلم، مهندس، داکتر from unit02؛ دوکاندار و دوکان
    from unit10؛ دفتر، شفاخانه، مکتب from unit05).

