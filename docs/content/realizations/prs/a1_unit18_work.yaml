            prompt: {target_blocks: [{text: مهندس, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit18.lesson01.exercise03.match_occupation_words
            type: matching_pairs
            tested_text: "معلم مهندس داکتر دوکاندار کار استم"
