            type: multiple_choice
            tested_text: استراحت
            prompt: {target_blocks: [{text: استراحت, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit11.lesson03.exercise02.recognize_namikonam
            type: multiple_choice
            tested_text: نمی‌کنم
            prompt: {target_blocks: [{text: نمی‌کنم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit11.lesson03.exercise03.order_daktar_porsid_esterahat
            type: word_order
            tested_text: داکتر پرسید که آیا استراحت نمی‌کنم
            prompt: {target_blocks: []}
            word_bank: [داکتر, پرسید, که, آیا, استراحت, نمی‌کنم]
          - content_key: prs.b1.unit11.lesson03.exercise04.match_negative_reported_words
            type: matching_pairs
            tested_text: "استراحت نمی‌کنم باید کنم بیشتر"
