    listen_order word_bank multiset exactly matches its accepted-answer
    token multiset.

course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین-adjacent, fuller written-leaning
    register from prs's other B1 units. Present/subjunctive/imperative
    2nd person plural/polite forms use -ین; simple past 2nd person plural
    correctly keeps -ید (گفتید), matching b1_unit05's own confirmed
    exception (no -ین counterpart exists anywhere in this corpus for any
    simple-past 2nd-plural verb).

