units:
  - content_key: prs.b1.unit11.communication
    title: گزارش
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.communication.report_what_someone_said
    planned_lesson_count: 6

    lessons:
      - content_key: prs.b1.unit11.lesson01.reported_yes_no_question
        title: پرسید که آیا
        spine_outcome_id: universal.b1.communication.report_what_someone_said
        teaching:
          - content_key: prs.b1.unit11.lesson01.teach.aya
            kind: vocabulary
            target: {text: آیا, language_code: prs, direction: rtl}
            introduced_tokens: [آیا]
            example: {text: "داکتر پرسید که آیا مریض استم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson01.teach.ke_aya
            kind: vocabulary
            target: {text: "که آیا", language_code: prs, direction: rtl}
            introduced_tokens: [که]
            example: {text: "داکتر پرسید که آیا مریض استم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson01.teach.grammar_reported_yesno
            kind: grammar_note
            target: {text: "A direct yes/no question ('Are you sick?') becomes reported speech with که آیا ('that whether'): شما مریض استین؟ (direct) -> داکتر پرسید که آیا مریض استم (reported: the doctor asked whether I was sick). Notice the pronoun shift: the direct question's شما (you) becomes من/استم (I) in the report, because the PERSON WHO WAS ASKED is now the one reporting it.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit11.lesson01.teach.porsid
            kind: vocabulary
            target: {text: پرسید, language_code: prs, direction: rtl}
            introduced_tokens: [پرسید]
            example: {text: "داکتر پرسید که آیا مریض استم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson01.teach.marize
            kind: vocabulary
            target: {text: مریض, language_code: prs, direction: rtl}
            introduced_tokens: [مریض]
            example: {text: "داکتر پرسید که آیا مریض استم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson01.teach.review_daktar
            kind: vocabulary
            target: {text: داکتر, language_code: prs, direction: rtl}
            introduced_tokens: [داکتر]
            example: {text: "داکتر پرسید که آیا مریض استم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson01.teach.review_astam
            kind: vocabulary
            target: {text: استم, language_code: prs, direction: rtl}
            introduced_tokens: [استم]
            example: {text: "داکتر پرسید که آیا مریض استم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit11.lesson01.exercise01.recognize_aya
            type: multiple_choice
            tested_text: آیا
            prompt: {target_blocks: [{text: آیا, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit11.lesson01.exercise02.recognize_marize
            type: multiple_choice
            tested_text: مریض
            prompt: {target_blocks: [{text: مریض, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit11.lesson01.exercise03.order_daktar_porsid_aya
            type: word_order
            tested_text: داکتر پرسید که آیا مریض استم
            prompt: {target_blocks: []}
            word_bank: [داکتر, پرسید, که, آیا, مریض, استم]
          - content_key: prs.b1.unit11.lesson01.exercise04.match_reported_question_words
            type: matching_pairs
            tested_text: "آیا که پرسید مریض داکتر استم"
            prompt: {target_blocks: []}
            pairs:
              - {left: آیا, right: whether}
              - {left: پرسید, right: asked}
              - {left: مریض, right: sick}
              - {left: داکتر, right: doctor}
              - {left: استم, right: "I am"}
              - {left: که, right: that}
          - content_key: prs.b1.unit11.lesson01.exercise05.translate_doctor_asked_whether
            type: translation
            tested_text: داکتر پرسید که آیا مریض استم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit11.lesson01.exercise06.speak_doctor_asked_whether
            type: speak_response
            tested_text: داکتر پرسید که آیا مریض استم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit11.lesson01.exercise07.write_doctor_asked_whether
            type: writing_prompt
            tested_text: داکتر پرسید که آیا مریض استم
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit11.lesson02.pronoun_shift_statement
        title: گفت که او
        spine_outcome_id: universal.b1.communication.report_what_someone_said
        teaching:
          - content_key: prs.b1.unit11.lesson02.teach.oo
            kind: vocabulary
            target: {text: او, language_code: prs, direction: rtl}
            introduced_tokens: [او]
            example: {text: "زرمینه گفت که او خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson02.teach.goft_ke_oo
            kind: vocabulary
            target: {text: "گفت که او", language_code: prs, direction: rtl}
            introduced_tokens: [گفت]
            example: {text: "زرمینه گفت که او خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson02.teach.grammar_pronoun_shift
            kind: grammar_note
            target: {text: "When a THIRD PARTY reports what someone else said, the 1st person (من) of the direct statement shifts to 3rd person (او): من خوب استم (direct: 'I am well') -> زرمینه گفت که او خوب است (reported: 'Zarmina said that she was well'). The copula also shifts: استم (I am) -> است (he/she is).", language_code: prs, direction: rtl}
            introduced_tokens: [است]
          - content_key: prs.b1.unit11.lesson02.teach.review_zarmina
            kind: vocabulary
            target: {text: زرمینه, language_code: prs, direction: rtl}
            introduced_tokens: [زرمینه]
            example: {text: "زرمینه گفت که او خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson02.teach.review_khoob
            kind: vocabulary
            target: {text: خوب, language_code: prs, direction: rtl}
            introduced_tokens: [خوب]
            example: {text: "زرمینه گفت که او خوب است.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit11.lesson02.exercise01.recognize_oo
            type: multiple_choice
            tested_text: او
            prompt: {target_blocks: [{text: او, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit11.lesson02.exercise02.recognize_goft
            type: multiple_choice
            tested_text: گفت
            prompt: {target_blocks: [{text: گفت, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit11.lesson02.exercise03.order_zarmina_goft_ke_oo
            type: word_order
            tested_text: زرمینه گفت که او خوب است
            prompt: {target_blocks: []}
            word_bank: [زرمینه, گفت, که, او, خوب, است]
          - content_key: prs.b1.unit11.lesson02.exercise04.match_pronoun_words
            type: matching_pairs
            tested_text: "او گفت خوب است زرمینه که"
            prompt: {target_blocks: []}
            pairs:
              - {left: او, right: "he / she"}
              - {left: گفت, right: said}
              - {left: خوب, right: well}
              - {left: است, right: is}
              - {left: زرمینه, right: Zarmina}
              - {left: که, right: that}
          - content_key: prs.b1.unit11.lesson02.exercise05.translate_zarmina_said_she_was_well
            type: translation
            tested_text: زرمینه گفت که او خوب است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit11.lesson02.exercise06.speak_zarmina_said_she_was_well
            type: speak_response
            tested_text: زرمینه گفت که او خوب است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit11.lesson02.exercise07.write_zarmina_said_she_was_well
            type: writing_prompt
            tested_text: زرمینه گفت که او خوب است
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit11.lesson03.negative_reported_question
        title: پرسید که آیا نمی‌کنم
        spine_outcome_id: universal.b1.communication.report_what_someone_said
        teaching:
          - content_key: prs.b1.unit11.lesson03.teach.esterahat
            kind: vocabulary
            target: {text: استراحت, language_code: prs, direction: rtl}
            introduced_tokens: [استراحت]
            example: {text: "داکتر پرسید که آیا استراحت نمی‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson03.teach.namikonam
            kind: vocabulary
            target: {text: نمی‌کنم, language_code: prs, direction: rtl}
            introduced_tokens: [نمی‌کنم]
            example: {text: "داکتر پرسید که آیا استراحت نمی‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit11.lesson03.teach.grammar_negative_reported
            kind: grammar_note
            target: {text: "A negative direct question also carries its negation into the reported form: شما استراحت نمی‌کنین؟ (direct: 'Don't you rest?') -> داکتر پرسید که آیا استراحت نمی‌کنم (reported: the doctor asked whether I don't rest). The negative prefix ن- stays exactly where it was, only the pronoun/person-ending shifts.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit11.lesson03.teach.review_bayad
