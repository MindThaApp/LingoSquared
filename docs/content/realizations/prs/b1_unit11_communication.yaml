  authoring_system: claude
  human_reviewed: false
  notes: >-
    Second-wave prs B1 unit (11 of 11, completing the two-wave 11-unit
    prs B1 coverage). Spine outcome
    universal.b1.communication.report_what_someone_said is adapted in
    part from a real public-domain source: .firecrawl/dli-dari-s17-20.txt
    (already scraped from the DLI Dari Basic Course in an earlier
    session; firecrawl itself currently returns HTTP 402, no new search/
    scrape attempted) Lesson 19's "Usage of particle آیا in indirect
    speech" section, which gives the exact که آیا construction for
    reported yes/no questions with real examples (کریم از فاروق می‌پرسد
    که آیا اتاقش تشناب دارد -- "Karim asks Farooq whether his room has a
    bathroom"). That source's own register/scenario (a formal hotel-
    booking dialogue) was NOT copied -- every sentence here is freshly
    authored in this course's established colloquial register and cast.
    Deliberately distinguished from b1_unit05 (this course's own EARLIER
    universal.b1.reported_speech.report_what_someone_said unit), which
    covered گفت که + wh-question/statement embedding without either (a)
    reported YES/NO questions specifically, or (b) explicit pronoun-shift
    transformation drills (direct quote -> reported quote with a
    1st<->2nd<->3rd person pronoun change) -- this unit's whole structure
    centers on exactly those two gaps: که آیا for yes/no questions, and
    paired direct/reported sentences that make the pronoun shift the
    actual object of instruction, not incidental. Full-circle continuity:
    pays off b1_unit01's original "Zarmina's doctor's appointment" setup
    (she could finally take the appointment) by having her actually GO
    and REPORT the visit. Register: continues شما+ین (چطور/شما
    established a1_unit01/a1_unit02) for present/subjunctive/imperative
    2nd-plural forms, but correctly keeps SIMPLE PAST 2nd-plural at -ید
    (گفتید) per the corpus-wide 2026-07-11 register-normalization
    finding that no -ین counterpart for any simple-past 2nd-plural verb
    exists anywhere in this corpus -- this is not an inconsistency, it's
    the same confirmed exception b1_unit05's own register-normalization
    note already documented.
    STATUS: draft, review pending -- has NOT yet been through the
    mandatory fresh-context review. Do not import/ship until that review
    completes.
