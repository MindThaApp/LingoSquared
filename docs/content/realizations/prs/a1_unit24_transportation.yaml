target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain), modernized; no fetchable lesson-level transportation content was found this pass (Live Lingua's Persian/Dari page lists only structural lesson-type categories, no topic table of contents) -- authored from established prs conventions instead, disclosed honestly rather than overclaiming source use, same as the fa unit21/22 precedent."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude, zero access to the authoring reasoning). Checked: same-speaker dialogue-distractor rule on lesson04's dialogue_comprehension exercise (no violation -- Homayoun's own line 'بس هم خوب است، ارزان است' is a general comment about the bus, never a first-person claim, so it doesn't overlap with any of the 3 first-person distractors), reading-passage/dialogue fact consistency (Homayoun's house is near so he walks, Zarmina takes a fast-but-not-cheap taxi daily and is saving for a car -- consistent throughout), matching_pairs pair counts (5 in lesson01 under the established first-lesson exception, 6 everywhere else), bare-YAML-boolean grep, Persian-vs-Arabic codepoints, jargon leaks, exercise-type registration, and §19 vocabulary-card examples -- all clean. Found and fixed two real bugs, both in the paired overlay file (no realization-side changes needed here beyond this note): (1) all 5 forward (English-to-Dari) translation exercises had a bare 'Translate into Dari.' instruction with an empty prompt -- unanswerable without already knowing the target sentence, the exact bug this unit's own sibling unit25 flagged as present here without fixing it (out of that unit's scope; fixed now). (2) lesson06's translate_wrap exercise was doubly broken: authored as type: translation (which per AUTHORING_GUIDE §6 must produce a target-language/Dari answer) but its accepted_answers were actually English, paired with the equally bare 'Translate into English.' instruction and an empty prompt -- converted to a normal, consistent English-to-Dari translation exercise. Re-validated clean (0 errors/0 warnings) after fixes."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy. موتر (car) is the genuine, common colloquial Afghan
    Dari term (not the more formal/Iranian ماشین); تکت (ticket) is a
    real, widely-used loanword in everyday Kabul speech, not an invented
    detail.

