            type: writing_prompt
            tested_text: اگر همایون پول داشت، موتر می‌خرید
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit07.lesson03.negative_and_softening
        title: نداشتم و درخواست نرم
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
        teaching:
