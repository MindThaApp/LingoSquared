course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین-adjacent, fuller written-leaning
    register from prs's other B1 units. New verb conditional/irrealis
    forms (داشتن، خریدن، کردن) use the standard د/ید/ند-ending paradigm,
    continuing b1_unit03/04/05's precedent; 2nd person plural/polite
    forms use -ین (داشتین، خریدین، کردین), never -ید, matching the
    corpus-wide 2026-07-11 register-normalization pass -- except simple
    past 2nd plural, which has no established -ین counterpart anywhere in
    this corpus and is not used in this unit at all. The earlier ه/ین/ن
    colloquial paradigm remains specific to تانستن/خریدن's ABILITY
    construction from b1_unit01 and is not extended to this unit's
    distinct خریدن-as-CONDITIONAL forms.

