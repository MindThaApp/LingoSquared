  notes: >-
    Second-wave prs B1 unit (7 of 11), bringing prs B1 to the same
    two-wave 11-unit coverage nl B1 has. Spine outcome
    universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
    is a from-scratch construction (no adaptable public-domain source found
    for the specific counterfactual/hypothetical "would" mood): checked
    .firecrawl/ for the DLI (Defense Language Institute) Dari Basic Course
    scrapes already on disk from an earlier session (firecrawl itself is
    currently returning HTTP 402, account credits exhausted, so no new
    search/scrape was attempted this pass) -- dli-dari-s25-28.txt Lesson 25
    covers real/likely اگر-conditionals (future-tense and imperative result
    clauses) but explicitly states "Conditional sentences containing past
    tenses will be introduced in future lessons" and the scraped set does
    not include that later lesson, so the specific counterfactual pattern
    this outcome targets (اگر + irrealis simple-past ... + می‌+past-stem
    conditional result, e.g. اگر پول داشتم، موتر می‌خریدم) is authored from
    general, well-established descriptive Persian/Dari grammar rather than
    adapted from that source. Deliberately distinguished from b1_unit03's
    real/likely-condition pattern (اگر + subjunctive: اگر وقت داشته باشم)
    -- this unit's irrealis if-clause uses plain simple past (داشتم, no
    می‌-prefix) specifically to avoid teaching the same surface pattern
    twice under two different outcome labels; lesson01's grammar note
    states the contrast explicitly. Continues the recurring Zarmina/
    Homayoun cast and both of their established unit06 goals (Homayoun
    saving for a موتر; Zarmina working toward better English and a
    کار خوب) reframed hypothetically -- neither goal is yet achieved, so
    treating them counterfactually ("if I had more money right now...")
    doesn't contradict unit06's own present-tense purpose-clause framing
    (کار می‌کنم تا پول جمع کنم, still in progress). Register: continues
    این پروژه's شما+ین convention (چطور/شما already established a1_unit01/
    a1_unit02) -- no تو anywhere, matching every other b1 unit's choice.
    New verb conditional/irrealis forms (داشتن، خریدن، کردن) use the
    regular د/ید/ند-ending paradigm per b1_unit03/04/05's precedent; the
    earlier ه/ین/ن colloquial paradigm remains specific to تانستن/خریدن's
    ABILITY construction from b1_unit01, a distinct construction from this
    unit's own خریدن CONDITIONAL forms, which use the regular
    می‌خریدم/خریدی/خرید/خریدیم/خریدین/خریدند paradigm.
    STATUS: draft, review pending -- has NOT yet been through the
    mandatory fresh-context review. Do not import/ship until that review
    completes.
