          - content_key: prs.b1.unit07.lesson03.teach.namikharidam
            kind: vocabulary
            target: {text: نمی‌خریدم, language_code: prs, direction: rtl}
            introduced_tokens: [نمی‌خریدم]
            example: {text: "اگر پول نداشتم، موتر نمی‌خریدم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson03.teach.grammar_negative
            kind: grammar_note
            target: {text: "Negate either clause the regular way: نداشتم (didn't have, ن- on داشتم) and نمی‌خریدم (wouldn't buy, ن- replacing the می‌ of می‌خریدم). اگر پول نداشتم، موتر نمی‌خریدم = if I didn't have money, I wouldn't buy a car.", language_code: prs, direction: rtl}
