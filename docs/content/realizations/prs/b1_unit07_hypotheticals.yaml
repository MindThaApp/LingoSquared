units:
  - content_key: prs.b1.unit07.hypotheticals
    title: اگر
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
    planned_lesson_count: 6

    lessons:
      - content_key: prs.b1.unit07.lesson01.present_hypothetical_1st2nd
        title: اگر داشتم
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
        teaching:
          - content_key: prs.b1.unit07.lesson01.teach.agar
            kind: vocabulary
            target: {text: اگر, language_code: prs, direction: rtl}
            introduced_tokens: [اگر]
            example: {text: "اگر پول داشتم، یک موتر می‌خریدم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.dashtam
            kind: vocabulary
            target: {text: داشتم, language_code: prs, direction: rtl}
            introduced_tokens: [داشتم]
            example: {text: "اگر پول داشتم، یک موتر می‌خریدم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.dashti
            kind: vocabulary
            target: {text: داشتی, language_code: prs, direction: rtl}
            introduced_tokens: [داشتی]
            example: {text: "اگر وقت داشتی، چه می‌کردی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.grammar_hypothetical
            kind: grammar_note
            target: {text: "اگر پول داشتم، موتر می‌خریدم = if I had money, I would buy a car. This is a HYPOTHETICAL that isn't true right now -- different from اگر وقت داشته باشم (b1_unit03's REAL/likely condition, with the باشم subjunctive). Here the اگر-clause uses the plain simple past (داشتم, no می‌-prefix) and the result clause uses می‌ + past stem (می‌خریدم) -- that combination is what marks the sentence as a hypothetical 'would', not a real possibility.", language_code: prs, direction: rtl}
            introduced_tokens: [که]
          - content_key: prs.b1.unit07.lesson01.teach.mikharidam
            kind: vocabulary
            target: {text: می‌خریدم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌خریدم]
            example: {text: "اگر پول داشتم، یک موتر می‌خریدم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.mikardi
            kind: vocabulary
            target: {text: می‌کردی, language_code: prs, direction: rtl}
            introduced_tokens: [می‌کردی]
            example: {text: "اگر وقت داشتی، چه می‌کردی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.review_pool
            kind: vocabulary
            target: {text: پول, language_code: prs, direction: rtl}
            introduced_tokens: [پول]
            example: {text: "پول کافی ندارم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.review_moter
            kind: vocabulary
            target: {text: موتر, language_code: prs, direction: rtl}
            introduced_tokens: [موتر]
            example: {text: "همایون می‌خواهد یک موتر بخرد.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.review_che
            kind: vocabulary
            target: {text: چه, language_code: prs, direction: rtl}
            introduced_tokens: [چه]
            example: {text: "چه می‌کردی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.review_yek
            kind: vocabulary
            target: {text: یک, language_code: prs, direction: rtl}
            introduced_tokens: [یک]
            example: {text: "یک موتر می‌خریدم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.review_waqt
            kind: vocabulary
            target: {text: وقت, language_code: prs, direction: rtl}
            introduced_tokens: [وقت]
            example: {text: "اگر وقت داشتی، چه می‌کردی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson01.teach.mirftam
            kind: vocabulary
            target: {text: می‌رفتم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌رفتم]
            example: {text: "اگر وقت داشتم، می‌رفتم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit07.lesson01.exercise01.recognize_agar
            type: multiple_choice
            tested_text: اگر
            prompt: {target_blocks: [{text: اگر, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit07.lesson01.exercise02.recognize_dashtam
            type: multiple_choice
            tested_text: داشتم
            prompt: {target_blocks: [{text: داشتم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit07.lesson01.exercise03.order_agar_pool_dashtam
            type: word_order
            tested_text: اگر پول داشتم یک موتر می‌خریدم
            prompt: {target_blocks: []}
            word_bank: [اگر, پول, داشتم, یک, موتر, می‌خریدم]
          - content_key: prs.b1.unit07.lesson01.exercise04.match_hypothetical_words
            type: matching_pairs
            tested_text: اگر داشتم داشتی می‌خریدم می‌کردی پول موتر
            prompt: {target_blocks: []}
            pairs:
              - {left: اگر, right: if}
              - {left: داشتم, right: "I had"}
              - {left: داشتی, right: "you had"}
              - {left: می‌خریدم, right: "I would buy"}
              - {left: پول, right: money}
              - {left: موتر, right: car}
          - content_key: prs.b1.unit07.lesson01.exercise05.translate_if_you_had_time
            type: translation
            tested_text: اگر وقت داشتی، چه می‌کردی؟
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit07.lesson01.exercise06.speak_if_i_had_money
            type: speak_response
            tested_text: اگر پول داشتم، یک موتر می‌خریدم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit07.lesson01.exercise07.write_if_i_had_time
            type: writing_prompt
            tested_text: اگر وقت داشتم، می‌رفتم
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit07.lesson02.present_hypothetical_all_persons
        title: همه صیغه‌ها
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
        teaching:
          - content_key: prs.b1.unit07.lesson02.teach.dasht
            kind: vocabulary
            target: {text: داشت, language_code: prs, direction: rtl}
            introduced_tokens: [داشت]
            example: {text: "اگر همایون پول داشت، موتر می‌خرید.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.mikharid
            kind: vocabulary
            target: {text: می‌خرید, language_code: prs, direction: rtl}
            introduced_tokens: [می‌خرید]
            example: {text: "اگر همایون پول داشت، موتر می‌خرید.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.dashtim
            kind: vocabulary
            target: {text: داشتیم, language_code: prs, direction: rtl}
            introduced_tokens: [داشتیم]
            example: {text: "اگر ما وقت داشتیم، به پارک می‌رفتیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.dashtin
            kind: vocabulary
            target: {text: داشتین, language_code: prs, direction: rtl}
            introduced_tokens: [داشتین]
            example: {text: "اگر شما پول داشتین، چه می‌خریدین؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.dashtand
            kind: vocabulary
            target: {text: داشتند, language_code: prs, direction: rtl}
            introduced_tokens: [داشتند]
            example: {text: "اگر آنها وقت داشتند، زودتر می‌آمدند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.grammar_agreement
            kind: grammar_note
            target: {text: "Both clauses agree with the SAME subject, exactly like the ability construction from b1_unit01: اگر همایون پول داشت، موتر می‌خرید (if Homayoun had money, he would buy a car) -- داشت and می‌خرید both track همایون. The full paradigm: داشتم/داشتی/داشت/داشتیم/داشتین/داشتند (irrealis 'had') and می‌خریدم/می‌خریدی/می‌خرید/می‌خریدیم/می‌خریدین/می‌خریدند (conditional 'would buy').", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit07.lesson02.teach.review_zoodtar
            kind: vocabulary
            target: {text: زودتر, language_code: prs, direction: rtl}
            introduced_tokens: [زودتر]
            example: {text: "اگر آنها وقت داشتند، زودتر می‌آمدند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.review_park
            kind: vocabulary
            target: {text: پارک, language_code: prs, direction: rtl}
            introduced_tokens: [پارک]
            example: {text: "اگر ما وقت داشتیم، به پارک می‌رفتیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.review_homayoun
            kind: vocabulary
            target: {text: همایون, language_code: prs, direction: rtl}
            introduced_tokens: [همایون]
            example: {text: "اگر همایون پول داشت، موتر می‌خرید.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.review_ba2
            kind: vocabulary
            target: {text: به, language_code: prs, direction: rtl}
            introduced_tokens: [به]
            example: {text: "به پارک می‌رفتیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.review_ma
            kind: vocabulary
            target: {text: ما, language_code: prs, direction: rtl}
            introduced_tokens: [ما]
            example: {text: "اگر ما وقت داشتیم، به پارک می‌رفتیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.miraftim
            kind: vocabulary
            target: {text: می‌رفتیم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌رفتیم]
            example: {text: "اگر ما وقت داشتیم، به پارک می‌رفتیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.review_anha
            kind: vocabulary
            target: {text: آنها, language_code: prs, direction: rtl}
            introduced_tokens: [آنها]
            example: {text: "اگر آنها وقت داشتند، زودتر می‌آمدند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit07.lesson02.teach.miamadand
            kind: vocabulary
            target: {text: می‌آمدند, language_code: prs, direction: rtl}
            introduced_tokens: [می‌آمدند]
            example: {text: "اگر آنها وقت داشتند، زودتر می‌آمدند.", language_code: prs, direction: rtl}
        exercises:
