target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "A newly-flagged source (DLI Dari Basic Course, fsi-languages.yojik.eu, 40-lesson Semester 1-3 S/T-book volumes) was checked before authoring this unit: the directory listing and the course's own 'Dari Program Overview.doc' syllabus were both readable, but the syllabus only breaks the course down by semester/week (elementary/intermediate/advanced), not by per-lesson topic, and lists no cooking/food/kitchen-specific lesson anywhere; the actual lesson PDFs (tried DLI-Dari-Semester1-s21-24.pdf as a sample) are scanned-image pages with no extractable text layer, the same dead end already hit with Peace Corps Dari. No usable cooking-specific source text was found there. Authored instead from established Afghan Dari conventions already used across prs units 01-35 (kitchen/food/onion/meat/salt/rice vocabulary, compound verbs with کردن, formal -ین imperative and second-person forms), modernized current spoken Kabul Dari, not a translation of any single source."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found and fixed ONE real bug (in the paired overlay, not this file). This file's own Dari content, compiler validation, matching_pairs pair counts, exercise-type registration, absence of audio-dependent exercises, dialogue structure, and cross-lesson fact consistency all checked clean. See the paired overlay's review notes for the fix (lesson04's dialogue_line6 title translation tense mismatch).\n\nReview 2026-10-20 (en-prs A1 pass): 2 fixes - replaced Iranian هستم with Afghan استم (example, teaching card, matching, tested_text, introduced_tokens); replaced the lesson02 title عملیات آشپزی (operations) with کارهای آشپزی. NATIVE FLAGS: دستور پخت vs طرز پخت for recipe steps in the lesson03 title."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established polite-first, full-uncontracted Dari register.
    The Nadia/Farid kitchen dialogue uses formal شما/-ین forms even between
    friends, matching every prior dialogue in this course. Vocabulary
    follows current Afghan household usage: آشپزخانه for kitchen, غذا for
    food/a meal, برنج for uncooked rice (distinct from the already-taught
    پلو, the cooked rice dish), and standard compound verbs with کردن/
    انداختن/ریختن for chop/add/pour.

