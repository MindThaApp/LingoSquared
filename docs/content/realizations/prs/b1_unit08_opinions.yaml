            target: {text: "هرچند تیل گران است، اما موتر می‌خرم = although petrol is expensive, I'll still buy a car. هرچند + clause1 CONCEDES a real, valid point; اما + clause2 then RESTATES your own actual position -- both halves must be true statements, not a fake concession.", language_code: prs, direction: rtl}
