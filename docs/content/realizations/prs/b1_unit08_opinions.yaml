            kind: grammar_note
            target: {text: "Review: concede a valid point with هرچند/اگرچه + clause, then restate your real position with اما + clause. Hold your point after what was just said with the stronger connector با این حال (nevertheless). موافق استم/مخالف استم states your position directly; می‌فهمم acknowledges the other person's reason even when you disagree.", language_code: prs, direction: rtl}
