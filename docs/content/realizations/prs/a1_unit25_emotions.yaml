target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain), modernized; no fetchable lesson-level emotions/feelings content was found this pass (same search-and-disclose approach as the unit24 transportation precedent) -- authored from established prs conventions and vocabulary already taught earlier in this course instead, disclosed honestly rather than overclaiming source use."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude, zero access to the authoring reasoning). Checked: every translation exercise's instruction (all already correctly name the specific English sentence, e.g. 'Translate into Dari: I am also sometimes tired after work.' -- confirmed this file does NOT repeat the bare-instruction bug it flagged in unit24; that bug has now been found and fixed separately in unit24's own review), same-speaker dialogue-distractor rule on lesson04's dialogue_comprehension exercise (no violation -- Zarmina's later 'I'm also happy after work' line is a different claim from the tested 'why is she tired,' and none of the 3 distractors literally restate anything either speaker says elsewhere in the dialogue), reading-passage/dialogue fact consistency (Homayoun happy about weather, Zarmina a bit tired from work and sometimes worried about workload -- consistent throughout, and consistent with unit24's established Homayoun/Zarmina facts), matching_pairs pair counts (6-7 throughout, compliant), bare-YAML-boolean grep, Persian-vs-Arabic codepoints, jargon leaks, exercise-type registration, and §19 vocabulary-card examples -- all clean. No real bugs found in this unit's own content; nothing needed fixing here. Re-validated clean (0 errors/0 warnings). Review 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in the overlay). NATIVE FLAGS: see overlay."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-24). The Zarmina/Homayoun dialogue (lesson04)
    uses the informal تو/استی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 dialogue. All feeling vocabulary (خوشحال، ناراحت، خسته، عصبانی،
    نگران) is standard, everyday Kabul Dari, shared with Farsi but not a
    borrowed Iranian-specific term -- no dialect-divergence risk here,
    unlike موتر/تکت in unit24.

