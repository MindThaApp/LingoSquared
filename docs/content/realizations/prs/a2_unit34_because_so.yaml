  notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 34-39 pass): 0 fixes. Read every teaching card and exercise together with overlays/en-prs/a2_unit34.yaml. Checked: register (formal written Kabul Dari, است/استم/استی, no 2pl -ید, no Tehrani contractions, Afghan lexicon موتر/بس/تیلفون/مصروف), Persian codepoints and rtl on every block, spine outcome id, boolean coercion, word banks against the accepted orders, and the facts across dialogue 1, the reading and dialogue 2 (headache and broken phone; meeting cancelled by snow and moved to Thursday; park trip moved to Friday) - all consistent. NATIVE FLAGS: (a) the vocabulary card teach.meeting_today shows the linked form جلسهٔ as its headword while the citation form جلسه is already introduced in lesson04; (b) در شب هوا سرد است may read better as شب‌ها هوا سرد است; (c) the twelve open questions below still stand. Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block D unit D1), realizing universal.a2.reasons.explain_reasons_and_consequences. Grammar target: reasons with چون (clause before or after the main clause, verbs unchanged), the written reason word زیرا (recognition only), results with به همین دلیل / برای همین, بنابراین (formal, recognition plus short production in reading), and به دلیل + noun. Eleven real grammar_note cards (چرا/چون, either order, the past and negative past of آمدن, به همین دلیل, برای همین, two ways to say the same thing, به دلیل + noun, بنابراین, زیرا, connector summary). Vocabulary: excuses (سردرد، خسته، مصروف، عذر، هوا، سرد، ماندن) and changes of plan (تغییر دادن). Lesson arc: L01 چرا/چون and excuse words; L02 clause order, آمدن/نیامدم, ماندن; L03 به همین دلیل / برای همین; L04 به دلیل + noun, بنابراین, زیرا, تغییر دادن; L05 reading (message from نیلوفر) plus listening-style dialogue 1 with the transcript shown in the prompt; L06 dialogue 2 (change of plan) plus typed production and a culminating writing_prompt that needs one چون reason sentence and one به همین دلیل / برای همین result sentence. Characters: the new pair مرجان and هارون (friends, informal تو), plus نیلوفر as the author of the reading message; none of these names occurs elsewhere in docs/content/realizations/prs or overlays/en-prs at authoring time. Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = yesterday Haroon did not come to the meeting because of a headache and did not phone because his phone was broken; reading = today''s meeting was cancelled because the manager did not come (the road was closed by snow) and is moved to Thursday; dialogue 2 = Wednesday trip to the park is dropped because of snow, Marjan has a meeting on Thursday (the meeting from the reading), they go on Friday. Binding rulings applied: no future خواهم, future as می‌ plus a day word, modal می‌توانم with ZWNJ, 2pl -ین (no typed 2pl answers), no object clitics, no ازش/باهاش/بهت/برات, copula است/استم/استی/استند, Afghan lexicon (موتر، بس، تیلفون، دروازه not needed). No progressive, no perfect. No listen_type, dictation or audio-only item; the two dialogue_comprehension items show the full transcript in the prompt. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER (with recommended answer): (1) Is زیرا correctly described as written-only and placed after the result and a comma (جلسه لغو شد، زیرا مدیر نیامد)? Rec: keep, recognition only. (2) Is بنابراین natural at the start of a sentence in a short written message, and is the register split (speech: برای همین / به همین دلیل; writing: بنابراین) right? Rec: keep. (3) Is برای همین natural in Kabuli speech, or do speakers say به خاطر همین / برای این؟ Should به خاطر / به خاطر همین be added as accepted answers? Rec: keep برای همین, no extra forms unless the reviewer asks. (4) Is عذر the right word for an excuse (عذر او سردرد بود) or should it be بهانه? Rec: keep عذر. (5) Is the note that چون and به همین دلیل are not combined in one sentence right, given that spoken Dari may say چون … برای همین …? Rec: keep the advice for learners. (6) Is the present tense for a forecast (چهارشنبه برف می‌بارد) natural, or is the خواهد-free future with a time word better written as چهارشنبه برف می‌بارد / برف خواهد بارید? Rec: keep. (7) Is حالا خوب استی؟ natural for are you well now? Rec: keep. (8) Is the spelling and teaching of نیامدم / نیامدی (ن + ی + آمد) correct? Rec: keep. (9) Is تغییر دادن with برنامه natural, or should عوض کردن be primary? Rec: keep تغییر دادن, عوض کردن is accepted in the translation exercise. (10) Is the linked form جلسهٔ امروز (hamza on the final ه) right in the reading, or would a native write جلسه امروز? Rec: keep the hamza in the reading and the note that it is often left out. (11) Are در خانه ماندم and جلسه دارم natural for I stayed at home and I have a meeting? Rec: keep. (12) Is به دلیل + noun placed first, middle or last (the word_order exercise accepts all three) natural? Rec: keep.'
