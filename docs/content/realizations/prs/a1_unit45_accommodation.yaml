            tested_text: "این کلید اتاق است."
            prompt: {target_blocks: [{text: "این کلید اتاق است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit45.lesson01.exercise04.match_hotel_room_vocab
            type: matching_pairs
            tested_text: "هوتل اتاق کلید در این هوتل است اتاق در هوتل است این کلید اتاق است"
