generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session, so real, direct WebFetch access plus local pdftotext extraction was used instead (per this session's task instructions). WebFetch on the DLI Dari course's own top-level index confirmed the site organizes into Semester 1/2/3 book directories. Re-checked (not just trusted from a prior unit's citation) Semester 2's Student Units 1-20 (S Book 1-20.pdf, 18MB) directly for this topic: pdftotext extracted real text, but a programmatic scan (Python regex over the Persian Unicode range) found the RTL text extracts as isolated, unjoined glyphs rather than connected words for this specific file, making keyword search unreliable -- zero hits for هتل/مهمان/اتاق/شب/صبحانه/کلید even though the acknowledgments/English front matter extracted cleanly, confirming this is a PDF-internal text-encoding-order issue for this file, not a missing-topic result. Also re-checked Semester 3's 'All conversations _2006_.pdf' (previously read title-by-title by an earlier unit and found to contain no hotel/lodging topic among its 40 conversations) with a fresh هتل keyword grep -- zero hits, confirming the earlier disclosure. The genuinely productive lead came from unit42's own provenance note, which had already located but not used (appointments, not lodging, was that unit's topic) Semester 1's s17-20.pdf, Lesson 19 'At a Hotel' -- downloaded and pdftotext-extracted cleanly this session (real connected Dari text, not glyph-isolated like the Semester 2 file above). This IS genuine, on-topic, cleanly extractable 2005 DLIFLC source material: a full lesson on 'Karim calls the Kabul Hotel to make a reservation,' with a real کارمند هوتل (hotel clerk) / traveler phone dialogue, room-vocabulary list (اتاق, یکنفری/دونفری, تشناب, شاور, ایرکندیشن, حوض آببازی, شامل, طبقه, نمره), and the verb ماندن (to stay, imperative/subjunctive-shortened in conversational Dari) used exactly for length-of-stay questions ('برای چند روز ده اینجه می‌مانین؟'). Used as a genuine adaptation scaffold per AUTHORING_GUIDE.md #10, not imported verbatim: the source dialogue is a phone reservation call using subjunctive mood, indirect آیا-questions, and B1-level grammar explicitly framed by the lesson's own stated grammar notes (Yes-No question formation, reported speech, short-form pronoun objects) -- all stripped out for this A1 unit, which uses only simple present-tense statements/questions with rising-intonation yes/no forms, matching this course's own A1 register throughout. Directly and independently confirmed from source, then reused: هوتل (hotel, spelled with a waw -- the genuine Afghan Dari spelling, distinct from Iranian Farsi's هتل, a real dialect detail worth preserving), ماندن/می‌مانم/می‌مانین (to stay), تشناب (bathroom, a real room-feature word matching the outcome's own 'ask about room features' can_do), شامل (included, used in the source's own natural 'X شامل اس؟' construction, reused here for breakfast), and چای صبح (literally 'morning tea,' the source's own idiom for breakfast -- kept as a more authentically Afghan-colloquial choice than the more formal-Persian صبحانه). Independently added, not sourced (the 1960s/2005-source lesson predates wifi and has no equivalent): وای‌فای (a necessary, honest modernization -- the outcome's own can_do text in universal_spine.yaml explicitly names 'breakfast, wifi, a key' as the three example lodging services), کلید (key, a plain everyday word, not obscure), رزرو (reservation, the more common modern written form of the source's ریزرف -- both are genuine loanword variants for 'to reserve,' رزرو chosen as the more current spelling per the modernization mandate), نمبر (room number -- Afghan colloquial loanword from English 'number,' a deliberate dialect choice over the source's own more formal نمره, consistent with this course's established Afghan-dialect conventions), and خروج (check-out/exit, a plain standard word for stating a check-out time, not sourced but not archaic either)."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit44 (waste disposal). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.accommodation.check_into_lodging as the next unrealized A1 outcome (immediately after waste_disposal in the spine file's own line order; all three listed prerequisites -- universal.a1.numbers.use_basic_numbers [unit04], universal.a1.dates.exchange_calendar_dates [unit09], and universal.a1.travel.handle_basic_journey [unit16] -- are already realized). This unit covers checking into a hotel, asking about room features (bathroom, breakfast, wifi) and a room key, stating length of stay, reading a short booking confirmation, and asking about check-out time, matching all four of the outcome's own assessment_requirements: understand_checkin_exchange (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14), request_room_or_service (speaking substituted the same way this whole corpus substitutes it -- production exercises: translation/writing_prompt/dialogue exchange asking for a room, a key, breakfast, wifi), read_booking_confirmation (lesson05's reading passage naming the guest, room number, and two-night stay with specific days), and write_accommodation_message (writing_prompt exercises across all six lessons). Six lessons: hotel/room/key vocabulary, bathroom and reservation vocabulary (with the source-verified 'اتاق تشناب دارد؟' yes/no room-feature question), room number and length-of-stay ('چند شب می‌مانین؟', extending the می‌مانم/می‌مانین verb family sourced from DLI Lesson 19's ماندن), a Homayoun/hotel-clerk check-in dialogue asking about breakfast and wifi, a third-person reading passage recapping a booking confirmation with a newly self-contained-introduced 3rd-person می‌ماند (matching unit33/unit44's own precedent of introducing a new 3rd-person conjugated form with an explicit review grammar_note immediately before its first exercise use), and a wrap-up contrasting breakfast time with check-out time using اما plus a formal شما-prefixed question, mirroring unit39-44's own wrap-up shape. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (این/است/در از unit04/unit09/unit43-44 throughout, دارم/دارین/دارد از unit03، چند از unit09، برای از unit07، می‌خواهم/یک از unit04/unit16، شب/دو/سه از unit04/unit11، چای/صبح از unit08/unit16، خوش آمدین/بفرمایین از unit01، کجاست از unit05، نام‌تان چیست/استم از unit01-02، بلی/هم از unit01/unit03/unit44، تشکر زیاد از unit01/unit06/unit09/unit40/unit43-44، اما/شما/ساعت/وقت از unit03/unit09/unit11-12/unit16/unit26/unit33/unit39-44، پنج/هفت/دوازده از unit04، دوشنبه/سه‌شنبه/و از unit09، چطور از unit09). Uses او (implicit via 3rd-person verb agreement only, no standalone او pronoun needed this unit -- the reading passage names همایون explicitly in every sentence rather than switching to a pronoun); no Pashto هغه/هغوی -- double-checked against the known Pashto-vs-Dari pronoun bug (moot this unit since no standalone 3rd-person pronoun is used, but checked anyway). No multi-clause translate/write exercise combines two natural clauses without an explicit single conjunction -- the one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form only, matching unit33/39-44's own established precedent that this construction has exactly one natural conjunction reading. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead. Zero fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs). Matching-pairs exercises use seven pairs each (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (هوتل, اتاق, کلید, تشناب, رزرو, نمبر, می‌مانم, شامل, وای‌فای, خروج) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field (چای صبح is authored as a phrase, not vocabulary, since both چای and صبح are individually already-taught words from unit08/unit16 -- only the collocation is new, matching this course's established phrase-card convention for combining known words). Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content, including every matching_pairs right: value (checked explicitly since this unit's dialogue uses بلی -> quoted \"Yes\" as a gloss in one matching_pairs list). Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched). NOTE for the next session/reviewer: scripts/content_manifest.txt showed as already modified (M, unrelated single-line diff) in git status before this task began, consistent with the CLAUDE.md-documented risk of concurrent sessions editing that shared file -- this task re-read the file fresh immediately before editing and touched only the en-prs line, per the task's own instruction; flagging in case a concurrent session's manifest edit needs separate reconciliation."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-44). Lessons 01-03's vocabulary/practice
    sentences are simple present-tense statements and yes/no questions
    formed by rising intonation alone (no formal آیا particle -- matching
    this course's consistently conversational-but-polite register, and
    explicitly simplifying DLI Lesson 19's own formal/conversational
    contrast down to the single conversational form appropriate at A1).
    Lesson04's dialogue introduces a new کارمند هوتل (hotel clerk)
    character opposite the established Homayoun, using the same
    polite-service register unit08's دکاندار/مشتری and unit42's
    داکتر/منشی exchanges already established -- not the informal-تو
    friendship register. Lesson05's reading passage uses 3rd-person
    verb agreement (می‌ماند) with همایون named explicitly throughout
    rather than switching to a pronoun, and lesson06's wrap-up uses the
    same formal شما-prefixed question pattern unit39-44 already
    established.

