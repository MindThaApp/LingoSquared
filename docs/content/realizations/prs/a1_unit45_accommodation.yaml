            kind: phrase
            target: {text: "کلید اتاق", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit45.lesson01.teach.this_is_room_key_phrase
            kind: phrase
            target: {text: "این کلید اتاق است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit45.lesson01.exercise01.recognize_hotel
            type: multiple_choice
            tested_text: هوتل
            prompt: {target_blocks: [{text: هوتل, language_code: prs, direction: rtl}]}
