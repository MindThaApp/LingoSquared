  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session, so real, direct WebFetch access plus local pdftotext extraction was used instead (per this session's task instructions). WebFetch on the DLI Dari course's own top-level index confirmed the site organizes into Semester 1/2/3 book directories. Re-checked (not just trusted from a prior unit's citation) Semester 2's Student Units 1-20 (S Book 1-20.pdf, 18MB) directly for this topic: pdftotext extracted real text, but a programmatic scan (Python regex over the Persian Unicode range) found the RTL text extracts as isolated, unjoined glyphs rather than connected words for this specific file, making keyword search unreliable -- zero hits for هتل/مهمان/اتاق/شب/صبحانه/کلید even though the acknowledgments/English front matter extracted cleanly, confirming this is a PDF-internal text-encoding-order issue for this file, not a missing-topic result. Also re-checked Semester 3's 'All conversations _2006_.pdf' (previously read title-by-title by an earlier unit and found to contain no hotel/lodging topic among its 40 conversations) with a fresh هتل keyword grep -- zero hits, confirming the earlier disclosure. The genuinely productive lead came from unit42's own provenance note, which had already located but not used (appointments, not lodging, was that unit's topic) Semester 1's s17-20.pdf, Lesson 19 'At a Hotel' -- downloaded and pdftotext-extracted cleanly this session (real connected Dari text, not glyph-isolated like the Semester 2 file above). This IS genuine, on-topic, cleanly extractable 2005 DLIFLC source material: a full lesson on 'Karim calls the Kabul Hotel to make a reservation,' with a real کارمند هوتل (hotel clerk) / traveler phone dialogue, room-vocabulary list (اتاق, یکنفری/دونفری, تشناب, شاور, ایرکندیشن, حوض آببازی, شامل, طبقه, نمره), and the verb ماندن (to stay, imperative/subjunctive-shortened in conversational Dari) used exactly for length-of-stay questions ('برای چند روز ده اینجه می‌مانین؟'). Used as a genuine adaptation scaffold per AUTHORING_GUIDE.md #10, not imported verbatim: the source dialogue is a phone reservation call using subjunctive mood, indirect آیا-questions, and B1-level grammar explicitly framed by the lesson's own stated grammar notes (Yes-No question formation, reported speech, short-form pronoun objects) -- all stripped out for this A1 unit, which uses only simple present-tense statements/questions with rising-intonation yes/no forms, matching this course's own A1 register throughout. Directly and independently confirmed from source, then reused: هوتل (hotel, spelled with a waw -- the genuine Afghan Dari spelling, distinct from Iranian Farsi's هتل, a real dialect detail worth preserving), ماندن/می‌مانم/می‌مانین (to stay), تشناب (bathroom, a real room-feature word matching the outcome's own 'ask about room features' can_do), شامل (included, used in the source's own natural 'X شامل اس؟' construction, reused here for breakfast), and چای صبح (literally 'morning tea,' the source's own idiom for breakfast -- kept as a more authentically Afghan-colloquial choice than the more formal-Persian صبحانه). Independently added, not sourced (the 1960s/2005-source lesson predates wifi and has no equivalent): وای‌فای (a necessary, honest modernization -- the outcome's own can_do text in universal_spine.yaml explicitly names 'breakfast, wifi, a key' as the three example lodging services), کلید (key, a plain everyday word, not obscure), رزرو (reservation, the more common modern written form of the source's ریزرف -- both are genuine loanword variants for 'to reserve,' رزرو chosen as the more current spelling per the modernization mandate), نمبر (room number -- Afghan colloquial loanword from English 'number,' a deliberate dialect choice over the source's own more formal نمره, consistent with this course's established Afghan-dialect conventions), and خروج (check-out/exit, a plain standard word for stating a check-out time, not sourced but not archaic either)."
