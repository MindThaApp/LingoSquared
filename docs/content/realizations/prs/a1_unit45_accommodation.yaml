course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-44). Lessons 01-03's vocabulary/practice
    sentences are simple present-tense statements and yes/no questions
    formed by rising intonation alone (no formal آیا particle -- matching
    this course's consistently conversational-but-polite register, and
    explicitly simplifying DLI Lesson 19's own formal/conversational
    contrast down to the single conversational form appropriate at A1).
    Lesson04's dialogue introduces a new کارمند هوتل (hotel clerk)
    character opposite the established Homayoun, using the same
    polite-service register unit08's دکاندار/مشتری and unit42's
    داکتر/منشی exchanges already established -- not the informal-تو
    friendship register. Lesson05's reading passage uses 3rd-person
    verb agreement (می‌ماند) with همایون named explicitly throughout
    rather than switching to a pronoun, and lesson06's wrap-up uses the
    same formal شما-prefixed question pattern unit39-44 already
    established.

