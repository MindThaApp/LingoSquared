            target: {text: "این (this) / است (is) / در (in)", language_code: prs, direction: rtl}
            introduced_tokens: [این, است, در]
          - content_key: prs.a1.unit45.lesson01.teach.hotel_word
            kind: vocabulary
            target: {text: هوتل, language_code: prs, direction: rtl}
            introduced_tokens: [هوتل]
            example: {text: "این هوتل است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit45.lesson01.teach.room_word
            kind: vocabulary
            target: {text: اتاق, language_code: prs, direction: rtl}
            introduced_tokens: [اتاق]
            example: {text: "اتاق در هوتل است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit45.lesson01.teach.room_in_hotel_phrase
