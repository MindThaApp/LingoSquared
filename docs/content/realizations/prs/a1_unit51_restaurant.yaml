units:
  - content_key: prs.a1.unit51.restaurant
    title: رستوران
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.restaurant.dine_at_restaurant
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit51.lesson01.restaurant_and_waiter_vocabulary
        title: رستوران و پیشخدمت
        spine_outcome_id: universal.a1.restaurant.dine_at_restaurant
        teaching:
          - content_key: prs.a1.unit51.lesson01.teach.review_this_is_in_good
            kind: grammar_note
            target: {text: "این (this) / است (is) / در (in) / خوب (good)", language_code: prs, direction: rtl}
            introduced_tokens: [این, است, در, خوب]
          - content_key: prs.a1.unit51.lesson01.teach.restaurant_word
            kind: vocabulary
            target: {text: رستوران, language_code: prs, direction: rtl}
            introduced_tokens: [رستوران]
            example: {text: "رستوران خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit51.lesson01.teach.waiter_word
            kind: vocabulary
            target: {text: پیشخدمت, language_code: prs, direction: rtl}
            introduced_tokens: [پیشخدمت]
            example: {text: "پیشخدمت خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit51.lesson01.teach.this_is_restaurant_phrase
            kind: phrase
            target: {text: "این رستوران است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit51.lesson01.teach.waiter_at_restaurant_phrase
            kind: phrase
            target: {text: "پیشخدمت در رستوران است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit51.lesson01.exercise01.recognize_restaurant_word
            type: multiple_choice
            tested_text: رستوران
            prompt: {target_blocks: [{text: رستوران, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit51.lesson01.exercise02.recognize_waiter_word
            type: multiple_choice
            tested_text: پیشخدمت
            prompt: {target_blocks: [{text: پیشخدمت, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit51.lesson01.exercise03.recognize_waiter_at_restaurant
            type: multiple_choice
            tested_text: "پیشخدمت در رستوران است."
            prompt: {target_blocks: [{text: "پیشخدمت در رستوران است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit51.lesson01.exercise04.match_restaurant_waiter_vocab
            type: matching_pairs
            tested_text: "رستوران پیشخدمت این است در این رستوران است. پیشخدمت در رستوران است."
            prompt: {target_blocks: []}
            pairs:
              - {left: رستوران, right: restaurant}
              - {left: پیشخدمت, right: waiter}
              - {left: این, right: this}
              - {left: است, right: is}
              - {left: در, right: in}
              - {left: "این رستوران است.", right: "This is a restaurant."}
              - {left: "پیشخدمت در رستوران است.", right: "The waiter is at the restaurant."}
          - content_key: prs.a1.unit51.lesson01.exercise05.order_waiter_at_restaurant
            type: word_order
            tested_text: "پیشخدمت در رستوران است"
            prompt: {target_blocks: []}
            word_bank: [پیشخدمت, در, رستوران, است]
          - content_key: prs.a1.unit51.lesson01.exercise06.translate_waiter_at_restaurant
            type: translation
            tested_text: "پیشخدمت در رستوران است."
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit51.lesson01.exercise07.write_restaurant
            type: writing_prompt
            tested_text: رستوران
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit51.lesson02.reading_the_menu
        title: خواندن مینو
        spine_outcome_id: universal.a1.restaurant.dine_at_restaurant
        teaching:
          - content_key: prs.a1.unit51.lesson02.teach.review_price_words
            kind: grammar_note
            target: {text: "چند (how much) / افغانی (afghani) / است (is) / صد (hundred) / پنجاه (fifty) / بیست (twenty) / و (and) / در (in) / خوش‌مزه (delicious) / چای (tea)", language_code: prs, direction: rtl}
            introduced_tokens: [چند, افغانی, است, صد, پنجاه, بیست, و, در, "خوش‌مزه", چای]
          - content_key: prs.a1.unit51.lesson02.teach.menu_word
            kind: vocabulary
            target: {text: مینو, language_code: prs, direction: rtl}
            introduced_tokens: [مینو]
            example: {text: "این مینو است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit51.lesson02.teach.kabab_word
            kind: vocabulary
            target: {text: کباب, language_code: prs, direction: rtl}
            introduced_tokens: [کباب]
            example: {text: "کباب خوش‌مزه است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit51.lesson02.teach.menu_reading
            kind: reading
            target: {text: "در مینو، کباب صد و پنجاه افغانی است و چای بیست افغانی است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit51.lesson02.teach.review_its_price
            kind: grammar_note
            target: {text: "قیمتش (its price)", language_code: prs, direction: rtl}
            introduced_tokens: [قیمتش]
          - content_key: prs.a1.unit51.lesson02.teach.ask_kabab_price_phrase
            kind: phrase
            target: {text: "کباب چند افغانی است؟", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit51.lesson02.teach.kabab_price_answer_phrase
            kind: phrase
            target: {text: "قیمتش صد و پنجاه افغانی است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit51.lesson02.exercise01.recognize_menu_word
            type: multiple_choice
            tested_text: مینو
            prompt: {target_blocks: [{text: مینو, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit51.lesson02.exercise02.recognize_kabab_word
            type: multiple_choice
            tested_text: کباب
            prompt: {target_blocks: [{text: کباب, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit51.lesson02.exercise03.reading_menu_kabab_price
            type: multiple_choice
            tested_text: "در مینو، کباب صد و پنجاه افغانی است و چای بیست افغانی است."
            prompt:
              target_blocks:
                - {text: "در مینو، کباب صد و پنجاه افغانی است و چای بیست افغانی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit51.lesson02.exercise04.match_menu_price_vocab
            type: matching_pairs
            tested_text: "مینو کباب چند افغانی قیمتش کباب چند افغانی است؟ قیمتش صد و پنجاه افغانی است."
            prompt: {target_blocks: []}
            pairs:
              - {left: مینو, right: menu}
              - {left: کباب, right: kabob}
              - {left: چند, right: "how much"}
              - {left: افغانی, right: afghani}
              - {left: قیمتش, right: "its price"}
              - {left: "کباب چند افغانی است؟", right: "How much is the kabob?"}
              - {left: "قیمتش صد و پنجاه افغانی است.", right: "Its price is 150 afghanis."}
          - content_key: prs.a1.unit51.lesson02.exercise05.order_kabab_price_question
            type: word_order
            tested_text: "کباب چند افغانی است"
            prompt: {target_blocks: []}
            word_bank: [کباب, چند, افغانی, است]
          - content_key: prs.a1.unit51.lesson02.exercise06.translate_kabab_price_question
            type: translation
            tested_text: "کباب چند افغانی است؟"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit51.lesson02.exercise07.write_kabab_price_answer
            type: writing_prompt
            tested_text: "قیمتش صد و پنجاه افغانی است"
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit51.lesson03.ordering_and_asking_for_bill
        title: سفارش دادن و خواستن بل
        spine_outcome_id: universal.a1.restaurant.dine_at_restaurant
        teaching:
          - content_key: prs.a1.unit51.lesson03.teach.review_ask_order_setup
            kind: grammar_note
            target: {text: "شما (you, formal) / چیست (what is) / من (I) / می‌خواهم (I want) / یک (one/a)", language_code: prs, direction: rtl}
            introduced_tokens: [شما, چیست, من, می‌خواهم, یک]
          - content_key: prs.a1.unit51.lesson03.teach.order_word
            kind: vocabulary
            target: {text: فرمایش, language_code: prs, direction: rtl}
            introduced_tokens: [فرمایش]
            example: {text: "فرمایش من یک کباب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit51.lesson03.teach.ask_your_order_phrase
            kind: phrase
            target: {text: "فرمایش شما چیست؟", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit51.lesson03.teach.want_kabab_phrase
