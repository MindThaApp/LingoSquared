generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "A fresh keyword search (English restaurant/waiter/menu/kabob, plus direct Dari-script greps for رستوران/پیشخدمت/مینو/فرمایش, Unicode-normalized since the raw pdftotext output uses Arabic presentation-form glyphs that don't match plain-Persian-range greps directly) was run against a locally cached extraction of the DLI Dari corpus (downloaded and pdftotext-extracted by earlier units this session, still present in the shared scratchpad -- Firecrawl was not re-checked this task since the local cache already covers the full Semester 1 student corpus). This found a genuine, on-topic, dedicated hit: DLI Dari Semester 1's own Lesson 13 is titled 'In a Restaurant' (s13-16.pdf), with a real lesson-vocabulary list glossing کباب as 'kabob', رستوران as 'restaurant', [مینو]=لست غذا as 'menu', and پیشخدمت as 'waiter' -- all four independently confirmed as genuine, source-attested Dari vocabulary for this exact scenario. The same lesson's cultural notes independently attest فرمایش as the noun 'order' via the vocabulary-list entry 'فرمایش دادن' (to order, lit. 'to give an order') and two model exchanges ('آغا جان، امروز چی دارین؟' / 'بی بی جان، تو چی ره میخایی فرمایش بتی؟'), plus a short narrative about 'رستوران عثمان' describing a restaurant with tables, chairs, a cook, and a waiter serving at the tables. Per AUTHORING_GUIDE.md #10, this is used as a real vocabulary scaffold, not imported verbatim: the source lesson's own grammar targets (the ‌خود reflexive pronoun, the 'بیا(یید) + subjunctive' Let's-construction, باید-dropping) are well past A1 and were not imported; the two source dialogue models use heavily contracted colloquial forms (فرمایش بتی/بتین, a colloquial contraction of بدهی/بدهین) inconsistent with this course's established استم/استین polite-first, full-uncontracted register (units 01-50) -- this unit instead builds a clean, uncontracted 'فرمایش شما چیست؟' by reusing this course's own already-established چیست pattern (نام‌تان چیست؟ unit01, کار شما چیست؟ unit02) applied to the newly-confirmed noun فرمایش, a genuine register adaptation per AUTHORING_GUIDE.md #10's mandatory-modernization requirement rather than a direct copy of the source's contracted phrasing. AUTHORING_GUIDE.md #3 itself lists 'رستورانت' as an illustrative example of Dari restaurant vocabulary, but the actual DLI-attested spelling found and used here is رستوران (no extra ت) -- both forms exist in real usage, and the directly source-verified spelling was preferred over the guide's own unverified illustrative example, disclosed honestly here. Built otherwise entirely from this course's own already-established in-corpus vocabulary and grammar: این/است/در/خوب (multiple earlier units), چند/افغانی/صد/پنجاه/بیست/قیمتش (unit04/unit10/unit21/unit23/unit46/unit47/unit48/unit49/unit50's own established price-asking pattern, صد itself already taught in unit04/unit23), خوش‌مزه (unit08's own established adjective, reused rather than re-sourcing a synonym), شما/چیست/من/می‌خواهم/یک (unit01/unit02/unit04's own established patterns), بل/را/لطفاً (unit01/unit02/unit08's own established tokens, بل itself unit08's genuine Dari-not-Iranian loanword-from-English choice), بسیار خوب/تشکر زیاد/خواهش می‌کنم/بفرمایین/سلام (units01/09/10/40/46/47/48/49/50's established politeness formulas), او/می‌خواهد (unit27/unit47/unit48/unit49/unit50's own established precedent for introducing a 3rd-person cell of an already-taught 1st-person verb), and اما (unit33/unit39-50's established contrast word). Three new content words beyond the four DLI-attested nouns (رستوران, پیشخدمت, مینو, کباب) themselves: بیارین (bring, imperative -- the exact same already-established polite -ین imperative family this course already uses for بروین/بپیچین/بدهین/بفرمایین/بگیرین/کنین/بنوشین/بگویین, applied here to a new verb stem, آوردن, not a new grammar point), and فرمایش (order/request, DLI-attested as described above). Deliberately kept the menu prices (کباب 150 afghanis, چای 20 afghanis) as two independently stated facts, and the dialogue's single-item order (one کباب) means the stated bill (150 afghanis) exactly equals the already-stated menu price for that same item rather than requiring any arithmetic sum -- per AUTHORING_GUIDE.md #11's own warning about comparative/total facts, this unit never asks the learner to add two prices together."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit50 (swimming_pool). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.restaurant.dine_at_restaurant as the next unrealized A1 outcome (immediately after swimming_pool in the spine file's own line order; both listed prerequisites -- universal.a1.food.order_simple_meal [unit08] and universal.a1.money.handle_basic_money_matters [unit23] -- are already realized). Deliberately differentiated from unit08's own food.order_simple_meal outcome (a چایخانه/teahouse ordering-and-bundled-bill scenario) per AUTHORING_GUIDE.md #1's spine-outcome discipline: this unit is a proper sit-down رستوران (restaurant) scenario with its own dedicated waiter role (پیشخدمت, distinct from unit08's دکاندار/مشتری چایخانه roles), a genuine two-item MENU reading with per-dish prices (unit08 never itemized prices, only a single bundled meal total), and a bill REQUEST as an imperative action (بل را بیارین، لطفاً) rather than unit08's bill-amount QUESTION (بل چند می‌شه؟) -- matching all four of the outcome's own assessment_requirements: understand_restaurant_exchange (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14, testing the waiter's price statements in lesson04 and the reading passage in lesson05), request_restaurant_order (speaking substituted the same way this whole corpus substitutes it -- production exercises ordering the kabob and requesting the bill), read_restaurant_menu (lesson02's reading card, a genuine two-dish menu with two different prices, distinct from a plain dialogue statement), and write_restaurant_message (writing_prompt exercises across all six lessons). Six lessons: restaurant-and-waiter vocabulary (رستوران, پیشخدمت both new, DLI-attested), reading the menu and asking a dish's price (مینو, کباب both new, DLI-attested; قیمتش/چند/افغانی/صد/پنجاه/بیست reviewed from unit04/unit10/unit21/unit23/unit46-50), ordering from the waiter and requesting the bill (فرمایش new, DLI-attested; بیارین new, the established -ین imperative family extended to a new verb stem; شما/چیست/می‌خواهم/بل/را/لطفاً reviewed), a Homayoun/پیشخدمت restaurant dialogue combining all of lessons 01-03's vocabulary (no new vocabulary in this lesson, pure recombination, matching unit48/unit49/unit50's own established precedent that a dialogue lesson doesn't always need fresh vocabulary of its own), a third-person reading passage recapping the same visit's facts (می‌خواهد re-declared fresh in this file as the expected 3rd-person paradigm cell of already-taught می‌خواهم, matching unit47-50's own precedent; کبابش introduced as the same mechanical -ش possessive-suffix extension this corpus's own قیمتش/کمدش pattern already establishes, applied here to a new noun), and a wrap-up contrasting the kabob's price with the tea's price using اما plus a formal تان-suffixed order question, mirroring unit39-50's own wrap-up shape (فرمایش‌تان, 'your order,' reusing the same -تان suffix pattern as unit50's بلیط‌تان and unit49's لباس شویی‌تان). Deliberately kept the kabob price (صد و پنجاه افغانی, 150 afghanis, stated identically in lesson02's menu, lesson04's dialogue order-and-bill, lesson05's reading passage, and lesson06's wrap-up contrast) and the tea price (بیست افغانی, 20 afghanis, stated identically in lesson02's menu and lesson06's wrap-up contrast) as two clearly distinct, never-summed facts -- the dialogue's single-item kabob order means its stated bill (150) exactly equals the already-stated per-item menu price for that same dish rather than requiring any arithmetic addition, avoiding any AUTHORING_GUIDE.md #11 risk. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (این/است/در/خوب از multiple earlier units, چند/افغانی از unit04/unit10/unit21/unit23/unit46/unit47/unit49/unit50، صد از unit04/unit23، پنجاه از unit04/unit48/unit49، بیست از unit04/unit50، قیمتش از unit10/unit21، خوش‌مزه از unit08، شما/چیست از unit01/unit02، من/یک از multiple earlier units، می‌خواهم از unit08/unit42/unit43/unit48/unit49/unit50، بل/را/لطفاً از unit01/unit02/unit08، سلام/بفرمایین/بسیار خوب/تشکر زیاد/خواهش می‌کنم از units01/09/10/40/46-50، او/می‌خواهد از unit27/unit47-50's own precedent، اما از unit33/unit39-50). Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit47-50's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form only, matching unit33/39-50's own established precedent that this construction has exactly one natural conjunction reading -- no other multi-clause translate/write exercise exists in this unit, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead. Zero fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs). Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (رستوران, پیشخدمت, مینو, کباب, بیارین, می‌خواهد, کبابش) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: lesson02's stated kabob price (صد و پنجاه افغانی, 150 afghanis) is identical everywhere referenced (lesson02/lesson04/lesson05/lesson06); lesson02's stated tea price (بیست افغانی, 20 afghanis) is identical everywhere referenced (lesson02/lesson06); the dialogue's single-item bill (lesson04) is never a sum of two prices, it equals the kabob's own already-stated menu price exactly. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-50). Lesson04's dialogue introduces a new
    پیشخدمت (waiter) role opposite the established Homayoun character,
    reusing the same polite-service register unit08's دکاندار/مشتری,
    unit42's داکتر/منشی, unit45's کارمند هوتل, unit46's دواساز, unit47's
    دلاک, unit48's/unit49's/unit50's دوکاندار/کارمند exchanges already
    established -- not the informal-تو friendship register. The source
    DLI lesson's own dialogue models use contracted colloquial forms
    (فرمایش بتین) not reused here; this unit's فرمایش شما چیست؟ instead
    extends this course's own established چیست question pattern.
    Lesson05's reading passage uses a 3rd-person statement naming
    همایون explicitly in its first sentence, then او in the following
    sentences, matching unit27/unit47-50's own reading-passage
    precedent, and lesson06's wrap-up uses the same formal
    شما-تان-suffixed question pattern unit39-50 already established.

