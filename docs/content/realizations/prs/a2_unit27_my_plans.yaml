  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block B unit B1), realizing universal.a2.future.announce_plans_and_intentions. Grammar target: plans are the plain present with a time word (می‌ + present stem: فردا می‌روم، هفتهٔ آینده می‌آیم، تابستان سفر می‌کنم), the full present paradigm and its negative (نمی‌روم), questions about plans (فردا چه می‌کنی؟); intention is می‌خواهم + the subjunctive (می‌خواهم به هرات بروم), the subjunctive paradigm re-taught here (بـ + present stem: بروم، بروی، برود، برویم، بروین، بروند; بیایم، بخرم، بگیرم، بمانم), the negative نمی‌خواهم بروم, a contrast card plan versus intention, and تصمیم دارم + subjunctive (قصد دارم, already in the course from a2_unit20, is mentioned). خواهم رفت is a RECOGNITION-ONLY card plus one multiple-choice item (ruling Q3); it is never produced. No progressive (در حال), no present perfect, no object clitic, no modal, no past tense. Twelve grammar_note cards (rule, paradigm, آمدن and other verbs, negative, questions, می‌خواهم + subjunctive, subjunctive paradigm, می‌خواهم paradigm, نمی‌خواهم, plan versus intention, تصمیم دارم, written future). Lesson arc: L01 time words and the present-for-future (introduces the pair مهتاب/لطیف); L02 persons, negative, questions, holiday words (رخصتی، سفر کردن، هوتل رزرو کردن); L03 intention with می‌خواهم + subjunctive plus course/university vocabulary; L04 تصمیم دارم, moving house (خانه عوض کردن، کرایه گرفتن), written future recognition; L05 reading message plus dialogue 1 (holiday plans, transcript shown in the prompt, no TTS) with matching and typed production; L06 dialogue 2 (moving house), dialogue_response and the culminating three-sentence writing_prompt (one plan with a time word, one intention with می‌خواهم + subjunctive, one decision with تصمیم دارم). Spine delivery: reading (L05 message), listening (dialogue_comprehension with full transcript in the prompt), speaking-style (dialogue_response in L02, L04, L06) and writing (writing_prompt in L04, L05, L06). Characters: two one-off friends مهتاب and لطیف (grepped docs/content/realizations/prs and overlays/en-prs: neither occurs anywhere; the established pairs زرمینه/همایون and نعمت/شکیبا are not reused), informal تو register. Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = Latif goes to Herat next week for a week, then wants to take an English course that starts next month; dialogue 2 = Mahtab moves house next month because her house is small, wants to rent a new house near the school, Latif comes to help tomorrow; the L05 message is a separate third-person account (tomorrow morning to Bamyan, two days, next week works in the office, next year intends to go to university). Binding rulings applied: Kabuli lexicon (رخصتی، پوهنتون، کورس، هوتل، تیلفون not needed), copula است/استند, 2pl -ین everywhere (می‌روین، می‌خواهین، بروین), modal not used; the -ید variants were NOT added as extra answers because check_dari_register.py flags them in the overlay (ruling conflict, see report), ZWNJ in می‌/نمی‌/خانه‌ام. No listen_type, dictation or audio-only item. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER (recommended answer in brackets): (1) Is خانه عوض کردن the natural phrase for moving house in Kabul, versus خانه را عوض کردن, کوچ کردن or اسباب‌کشی? [keep خانه عوض کردن; accept خانه را عوض کردن as an extra answer; do not teach کوچ]. (2) Is کرایه گرفتن (یک خانه کرایه بگیرم) the natural verb for renting a house, versus کرایه کردن? [keep]. (3) Is رخصتی the natural word for a holiday / time off, and برای رخصتی برنامه داری؟ natural, versus تعطیلات? [keep رخصتی, as in a2_unit20]. (4) Is the plain present with a time word (فردا می‌روم، هفتهٔ آینده می‌روم) fully natural for a firm plan with no extra marker? [yes]. (5) Is می‌خواهم + bare subjunctive (no که) right, and is the order می‌خواهم هفتهٔ آینده به هرات بروم / هفتهٔ آینده می‌خواهم به هرات بروم natural? [yes, both accepted]. (6) Is تصمیم دارم + subjunctive natural for I intend to, and is the claim that it is stronger than می‌خواهم fair? [keep; قصد دارم accepted as an alternative]. (7) Is کورس کی شروع می‌شود؟ and the short answer از ماه آینده natural? [keep]. (8) Is تشکر! natural as a short thank-you between friends, versus تشکر از شما or مننده؟ [keep]. (9) Is the learner note on خواهم رفت (written, notices and news, not spoken) accurate? [keep as recognition only]. (10) Is سفر کردن with به (به بامیان سفر می‌کنم) natural? [keep]. (11) Is جمعه به مکتب نمی‌روم natural for On Friday I am not going to school (Friday as the weekly day off)? [keep]. (12) Is نمی‌خواهم خانه عوض کنم natural for I do not want to move house? [keep]. (13) Are the 2pl subjunctive بروین and present می‌روین/می‌خواهین natural in writing (rather than -ید)? [yes per ruling Q3; the -ید variant is understood but not added as an accepted answer because the register checker flags it]. (14) Is the sequence بعد از آن چه می‌کنی؟ natural for what are you doing after that? [keep].'
