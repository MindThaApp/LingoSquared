review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered A1 outcome (universal.a1.past_events.describe_recent_event, prerequisites: routines/unit12 and time/unit11, both already covered). Authored by Claude (Session 2/CONTENT-equivalent worker) in an isolated git worktree, 2026-07-07, as part of a same-day multi-worker push. Six lessons introducing simple past tense on top of the present-tense forms already established in unit12 (بیدار می‌شوم -> شدم, به دفتر می‌روم -> رفتم, صبحانه می‌خورم -> خوردم): lesson01 دیروز/رفتم, lesson02 خوردم (retaught صبحانه), lesson03 کار/کردم, lesson04 a short reading combining all three first-person past forms, lesson05 a longer reading adding a specific time (ساعت هفت, reused from unit11/12) and a new شدن-family past form (خسته شدم), and lesson06 a Zarmina/Homayoun dialogue introducing the matching second-person past forms (رفتی/کردی) -- mirroring unit12's own established pacing precedent of introducing 1st person early and 2nd/3rd person only in the final dialogue lesson. Continues the established استم/استین register and full uncontracted verb forms (units 01-19). Reuses recurring characters Zarmina/Homayoun from units 11-12, consistent with their established facts (Homayoun wakes at 7, Zarmina at 6, both go to دفتر). Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere (zero prs audio exists), every matching_pairs exercise sized 6+ pairs with genuine cross-lesson pooling, zero fill_in_blank exercises. The multi-clause production exercises (writing_prompt in lesson05, dialogue_response/writing_prompt in lesson06) carry period-joined, comma-joined, and و-joined accepted-answer variants at every clause boundary, matching the pattern established in units 12/19's own reviews. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file). schema_version 1.1 from the start -- every kind:vocabulary teaching card has its own example/example_gloss.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-10 (Claude, zero access to the authoring reasoning above, sibling fa/prs-en files never opened). Checked and confirmed clean: same-speaker dialogue-distractor rule (lesson06's dialogue_comprehension/reading_comprehension distractors are English scenario glosses, never a line the tested speaker also says elsewhere in the dialogue); zero stray YAML booleans; zero Arabic-range kaf/yeh (only genuine Persian-range ک/ی throughout); every exercise type used (multiple_choice, matching_pairs, translation, reading_comprehension, writing_prompt, dialogue_comprehension, dialogue_response) is registered in ExerciseRenderer.tsx; zero fill_in_blank, zero listen_type/listen_select/listen_order per §14; every reading_comprehension/dialogue_comprehension exercise has real visible prompt text (no empty target_blocks on a comprehension check); §12 multi-clause boundary coverage independently re-derived and confirmed genuinely complete at every boundary for all three multi-clause production exercises (write_own_longer_yesterday in lesson05: full 3x3 boundary coverage; dialogue_response_own_yesterday and write_dialogue_summary in lesson06: full coverage for their boundary counts); §11 cross-lesson fact consistency (lesson04's short reading, lesson05's longer reading, and lesson06's dialogue about the same yesterday-activities scenario never contradict each other); §16 matching_pairs sizing (lesson01's 3-pair exercise is a genuine first-lesson ceiling -- only 3 words are taught in that lesson and all 3 are used -- unlike a later-found issue of the same shape in units 21/22; lessons 02-06 all reach 5-9 pairs with real cross-lesson pooling); no internal-jargon leaks in any learner-facing field. No bugs found -- this unit was clean on first read. Compiler validate re-run together with units 19/21/22 clean (0 errors/0 warnings).

    MATCHING_PAIRS §16 FOLLOW-UP, 2026-08-05: lesson01.exercise03.match_yesterday_words (3 pairs) and lesson02.exercise03.match_ate_words (5 pairs) were below the §16 aim; earlier-numbered A1 units supply on-topic time/place/food vocabulary for a past-events unit. lesson01: expanded 3->7, pooling امروز (today, unit09), فردا (tomorrow, unit16), ساعت (hour/clock, unit11), and خانه (house/home, unit19). lesson02: expanded 5->7, pooling نان (bread) and چای (tea), both unit08, natural breakfast items. Overlay accepted_answers synced for both. Re-ran validate+compile clean (0 errors/0 warnings)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    full, uncontracted forms (units 01-19). Simple past tense introduced
    here uses the standard regular past-stem + person-ending pattern
    (رفتم، خوردم، کردم، شدم), identical in formation to standard Iranian
    Farsi for these particular verbs -- no dialect-specific past-tense
    divergence claimed for this unit.

