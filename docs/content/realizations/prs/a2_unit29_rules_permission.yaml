review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block C unit C1), realizing universal.a2.modality.ask_permission_and_state_rules. Grammar target: obligation and prohibition with the subjunctive (باید / نباید + بروم، بروی، برود، برویم، بروین، بروند; the subjunctive is re-taught in lesson 01 from the present: drop می‌ and add ب-, with آمدن بیایم and کردن کنم as exceptions), the absence of obligation (لازم نیست, more formal ضرورت ندارد), and asking and giving permission (اجازه دارم ...؟ and می‌توانم ...؟ with the answers بلی، اجازه دارین / نخیر، اجازه ندارین / می‌توانین / نمی‌توانین / ممنوع است). Vocabulary: library, swimming pool, gym, rules, membership card, sports shoes, towel, food, quiet, forbidden, rubbish bin. Six lessons: L01 باید + subjunctive and the places; L02 نباید and ممنوع; L03 asking permission; L04 لازم نیست / ضرورت ندارد and the three-way contrast; L05 reading (a notice with the rules of a community centre) plus a transcript-shown listening item (library); L06 gym and pool conversation plus mixed and culminating production. Eight or more grammar_note cards. Characters: four one-off names unused anywhere in docs/content/realizations/prs and overlays/en-prs at authoring time: شکیلا (new library member) and نصیر (librarian) speak formally with the 2pl -ین; نازیلا (first time at the gym) and فهیم (her friend) use informal تو. Facts kept consistent (AUTHORING_GUIDE section 11): one community centre with a library, a swimming pool and a gym. Library: a membership card is needed to take books home, the card is free, books go back within two weeks, no eating, be quiet. Pool: shower first, no running. Gym: wear sports shoes, no need to bring a towel because the gym has towels, no talking on the phone. Rubbish goes in the bin. The notice, the two dialogues and the exercises all agree with these facts. Binding rulings applied: Kabuli written Dari, copula است/استند, 2pl -ین everywhere (no -ید forms anywhere, not even as accepted answers, because check_dari_register.py flags them), می‌توانم with ZWNJ, no future (فردا می‌روم plain present), no object clitics, no progressive, no perfect, no Tehrani contractions. No listen_type, dictation or audio-only item; the two listening items show the full transcript in the prompt. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Is قانون‌ها / قانون‌های مرکز the natural word for house rules, or would a native say مقررات or قوانین? (2) Is اجازه دارم ...؟ natural for asking permission, or is اجازه است؟ / اجازه هست؟ more usual? Recommended: keep اجازه دارم, accept the other as heard. (3) Is نخیر، اجازه ندارین a natural refusal, or would a native say اجازه نیست? Recommended: keep ندارین. (4) Is ممنوع است with an infinitive subject (غذا خوردن ممنوع است, سگرت کشیدن ممنوع است) natural on signs? (5) Is بلند صحبت کردن natural for talking loudly, or بلند حرف زدن? Recommended: keep صحبت (already in the course). (6) Is ضرورت ندارد natural on notices, or ضرورت نیست? Recommended: keep ضرورت ندارد, mention it is formal. (7) Is حوض آب‌بازی the right everyday name for a swimming pool (the course standard from the A1 unit)? (8) Is کتاب را پس دادن and the deadline تا دو هفته natural for returning a library book? (9) Is ساکت باشین the natural way to say be quiet, or آرام باشین? Recommended: keep ساکت, accept آرام. (10) Is the subjunctive spelling right in بیندازین, بدوین, بپوشین, بیاورین, بیایند, and is both کنم / بکنم accepted after باید? (11) Is سگرت کشیدن and the spelling سگرت right? (12) Is کارت عضویت the natural name for a library membership card? (13) Is اولین بار به باشگاه می‌روم natural for the first time? (14) Is باید ساکت هم باشین the natural position of هم? (15) Does a formal notice to everybody use the -ین form (بخورین) as ruled, or does a native expect -ید on printed notices? Recommended: keep -ین, accept -ید. (16) Is نباید + positive subjunctive (نباید بدوین) the usual pattern, and is it ever replaced by باید نکنین? Recommended: keep. (17) Process question: check_dari_register.py flags every -ید form even inside accepted_answers, so no -ید variants are listed; should the shared grader (PERSIAN_VARIANT_GROUPS) fold -ید to -ین instead? Recommended: yes.'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین, modal می‌توانم with ZWNJ, no Tehrani colloquialisms. The librarian and Samira use the formal شما (-ین); Nazila and Fahim are friends and use تو. Obligation = باید / نباید + subjunctive; absence of obligation = لازم نیست / ضرورت ندارد; permission = اجازه دارم ...؟ / می‌توانم ...؟.'
