units:
  - content_key: prs.a1.unit09.dates
    title: روزها و تاریخ
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.dates.exchange_calendar_dates
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit09.lesson01.days_of_the_week
        title: روزهای هفته
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: prs.a1.unit09.lesson01.teach.shanbe_yakshanbe
            kind: vocabulary
            target: {text: "شنبه، یکشنبه", language_code: prs, direction: rtl}
            introduced_tokens: [شنبه, یکشنبه]
            example:
              - {text: "امروز شنبه است.", language_code: prs, direction: rtl}
              - {text: "فردا یکشنبه است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson01.teach.doshanbe_seshanbe
            kind: vocabulary
            target: {text: "دوشنبه، سه‌شنبه", language_code: prs, direction: rtl}
            introduced_tokens: [دوشنبه, سه‌شنبه]
            example:
              - {text: "دوشنبه صنف دارم.", language_code: prs, direction: rtl}
              - {text: "سه‌شنبه ملاقات دارم.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe
            kind: vocabulary
            target: {text: "چهارشنبه، پنجشنبه", language_code: prs, direction: rtl}
            introduced_tokens: [چهارشنبه, پنجشنبه]
            example:
              - {text: "چهارشنبه کار می‌کنم.", language_code: prs, direction: rtl}
              - {text: "پنجشنبه شما را می‌بینم.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson01.teach.jomeh
            kind: vocabulary
            target: {text: جمعه, language_code: prs, direction: rtl}
            introduced_tokens: [جمعه]
            example: {text: "جمعه رخصتی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson01.teach.tarikh_word
            kind: vocabulary
            target: {text: تاریخ, language_code: prs, direction: rtl}
            introduced_tokens: [تاریخ]
            example: {text: "تاریخ امروز چیست؟", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: prs, direction: rtl}
            introduced_tokens: [و]
          - content_key: prs.a1.unit09.lesson01.teach.weekend_note
            kind: cultural_note
            target: {text: "جمعه روز رخصتی هفته است", language_code: prs, direction: rtl}
            introduced_tokens: [روز, رخصتی, هفته, است]
        exercises:
          - content_key: prs.a1.unit09.lesson01.exercise01.recognize_shanbe
            type: multiple_choice
            tested_text: شنبه
            prompt: {target_blocks: [{text: شنبه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit09.lesson01.exercise02.recognize_jomeh
            type: multiple_choice
            tested_text: جمعه
            prompt: {target_blocks: [{text: جمعه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit09.lesson01.exercise03.recognize_doshanbe
            type: multiple_choice
            tested_text: دوشنبه
            prompt: {target_blocks: [{text: دوشنبه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit09.lesson01.exercise04.match_days
            type: matching_pairs
            tested_text: شنبه یکشنبه دوشنبه سه‌شنبه چهارشنبه پنجشنبه جمعه
            prompt: {target_blocks: []}
            pairs:
              - {left: شنبه, right: Saturday}
              - {left: یکشنبه, right: Sunday}
              - {left: دوشنبه, right: Monday}
              - {left: سه‌شنبه, right: Tuesday}
              - {left: چهارشنبه, right: Wednesday}
              - {left: پنجشنبه, right: Thursday}
              - {left: جمعه, right: Friday}
          - content_key: prs.a1.unit09.lesson01.exercise05.order_days_sequence
            type: word_order
            tested_text: شنبه یکشنبه دوشنبه
            prompt: {target_blocks: []}
            word_bank: [شنبه, یکشنبه, دوشنبه]
          - content_key: prs.a1.unit09.lesson01.exercise06.translate_friday
            type: translation
            tested_text: جمعه
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit09.lesson01.exercise07.write_wednesday
            type: writing_prompt
            tested_text: چهارشنبه
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit09.lesson02.months
        title: ماه‌های سال
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: prs.a1.unit09.lesson02.teach.hamal
            kind: vocabulary
            target: {text: حمل, language_code: prs, direction: rtl}
            introduced_tokens: [حمل]
            example: {text: "حمل ماه اول سال است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson02.teach.sawr
            kind: vocabulary
            target: {text: ثور, language_code: prs, direction: rtl}
            introduced_tokens: [ثور]
            example: {text: "در ثور هوا خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson02.teach.jawza
            kind: vocabulary
            target: {text: جوزا, language_code: prs, direction: rtl}
            introduced_tokens: [جوزا]
            example: {text: "من در جوزا تولد شدم.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson02.teach.calendar_note
            kind: cultural_note
            target: {text: "افغانستان از تقویم هجری شمسی استفاده می‌کند", language_code: prs, direction: rtl}
            introduced_tokens: [افغانستان, از, تقویم, هجری, شمسی, استفاده, می‌کند]
        exercises:
          - content_key: prs.a1.unit09.lesson02.exercise01.recognize_hamal
            type: multiple_choice
            tested_text: حمل
            prompt: {target_blocks: [{text: "1st month", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit09.lesson02.exercise02.recognize_jawza
            type: multiple_choice
            tested_text: جوزا
            prompt: {target_blocks: [{text: "3rd month", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit09.lesson02.exercise03.recognize_sawr_reading
            type: multiple_choice
            tested_text: ثور
            prompt: {target_blocks: [{text: ثور, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit09.lesson02.exercise04.match_months
            type: matching_pairs
            tested_text: حمل ثور جوزا
            prompt: {target_blocks: []}
            pairs:
              - {left: حمل, right: "1st Hijri Shamsi month (~late March-April)"}
              - {left: ثور, right: "2nd Hijri Shamsi month (~April-May)"}
              - {left: جوزا, right: "3rd Hijri Shamsi month (~May-June)"}
          - content_key: prs.a1.unit09.lesson02.exercise05.order_months_sequence
            type: word_order
            tested_text: حمل ثور جوزا
            prompt: {target_blocks: []}
            word_bank: [حمل, ثور, جوزا]
          - content_key: prs.a1.unit09.lesson02.exercise06.calendar_check
            type: grammar_check
            tested_text: افغانستان تقویم هجری شمسی
            prompt:
              target_blocks:
                - {text: "افغانستان از تقویم هجری شمسی استفاده می‌کند", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit09.lesson02.exercise07.write_hamal
            type: writing_prompt
            tested_text: حمل
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit09.lesson03.asking_todays_date
        title: پرسیدن روز و تاریخ امروز
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: prs.a1.unit09.lesson03.teach.what_day_today
            kind: phrase
            target: {text: "امروز چند شنبه است؟", language_code: prs, direction: rtl}
            introduced_tokens: [امروز, چند, شنبه, است]
          - content_key: prs.a1.unit09.lesson03.teach.today_word
            kind: vocabulary
            target: {text: امروز, language_code: prs, direction: rtl}
            introduced_tokens: [امروز]
            example: {text: "امروز چندم است؟", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.a1.unit09.lesson03.exercise01.recognize_what_day
            type: multiple_choice
            tested_text: امروز چند شنبه است
            prompt: {target_blocks: [{text: "What day is today?", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit09.lesson03.exercise02.recognize_today_word
            type: multiple_choice
            tested_text: امروز
            prompt: {target_blocks: [{text: امروز, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit09.lesson03.exercise03.recognize_what_day_reading
            type: multiple_choice
            tested_text: امروز چند شنبه است
            prompt: {target_blocks: [{text: "امروز چند شنبه است؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit09.lesson03.exercise04.match_today_phrases
            type: matching_pairs
            tested_text: امروز چند شنبه است هفته روز رخصتی تاریخ
            prompt: {target_blocks: []}
            pairs:
              - {left: "امروز چند شنبه است؟", right: "What day is today?"}
              - {left: امروز, right: today}
              - {left: هفته, right: week}
              - {left: روز, right: day}
              - {left: رخصتی, right: "day off/holiday"}
              - {left: تاریخ, right: date}
          - content_key: prs.a1.unit09.lesson03.exercise05.order_what_day
            type: word_order
            tested_text: امروز چند شنبه است
            prompt: {target_blocks: []}
            word_bank: [امروز, چند, شنبه, است]
          - content_key: prs.a1.unit09.lesson03.exercise06.translate_what_day
            type: translation
            tested_text: امروز چند شنبه است
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit09.lesson03.exercise07.speak_ask_day
            type: speak_response
            tested_text: امروز چند شنبه است
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit09.lesson04.giving_a_date
        title: گفتن تاریخ
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: prs.a1.unit09.lesson04.teach.give_full_date
            kind: phrase
            target: {text: "امروز پنجشنبه، پانزدهم حمل است", language_code: prs, direction: rtl}
            introduced_tokens: [پنجشنبه, پانزدهم]
        exercises:
          - content_key: prs.a1.unit09.lesson04.exercise01.recognize_full_date
            type: multiple_choice
            tested_text: امروز پنجشنبه پانزدهم حمل است
            prompt: {target_blocks: [{text: "Today is Thursday, the 15th of Hamal.", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit09.lesson04.exercise02.recognize_ordinal
            type: multiple_choice
            tested_text: پانزدهم
            prompt: {target_blocks: [{text: "15th", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit09.lesson04.exercise03.recognize_full_date_reading
            type: multiple_choice
            tested_text: امروز پنجشنبه پانزدهم حمل است
            prompt: {target_blocks: [{text: "امروز پنجشنبه، پانزدهم حمل است", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit09.lesson04.exercise04.match_date_parts
            type: matching_pairs
            tested_text: پنجشنبه پانزدهم حمل شنبه دوشنبه ثور
            prompt: {target_blocks: []}
            pairs:
              - {left: پنجشنبه, right: Thursday}
              - {left: پانزدهم, right: "15th"}
              - {left: حمل, right: Hamal}
              - {left: شنبه, right: Saturday}
              - {left: دوشنبه, right: Monday}
              - {left: ثور, right: Sawr}
          - content_key: prs.a1.unit09.lesson04.exercise05.order_full_date
            type: word_order
            tested_text: امروز پنجشنبه پانزدهم حمل است
            prompt: {target_blocks: []}
            word_bank: [امروز, پنجشنبه, پانزدهم, حمل, است]
          - content_key: prs.a1.unit09.lesson04.exercise06.translate_full_date
            type: translation
            tested_text: امروز پنجشنبه پانزدهم حمل است
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit09.lesson04.exercise07.speak_give_date
            type: speak_response
            tested_text: امروز پنجشنبه پانزدهم حمل است
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit09.lesson05.asking_about_a_future_date
        title: پرسیدن دربارهٔ تاریخ آینده
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: prs.a1.unit09.lesson05.teach.which_day_meeting
            kind: phrase
            target: {text: "جلسه کدام روز است؟", language_code: prs, direction: rtl}
            introduced_tokens: [جلسه, کدام, روز, است]
          - content_key: prs.a1.unit09.lesson05.teach.which_date
            kind: phrase
            target: {text: "دوشنبه چندم حمل است؟", language_code: prs, direction: rtl}
            introduced_tokens: [دوشنبه, چندم, حمل, است]
        exercises:
          - content_key: prs.a1.unit09.lesson05.exercise01.recognize_which_day_meeting
            type: multiple_choice
            tested_text: جلسه کدام روز است
            prompt: {target_blocks: [{text: "What day is the meeting?", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit09.lesson05.exercise02.recognize_which_date
