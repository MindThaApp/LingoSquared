generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits remain exhausted this session, so real, direct WebFetch/curl access against a locally cached extraction of the DLI Dari corpus (downloaded and pdftotext-extracted by earlier units this same session, still present in the shared scratchpad) was used instead, per this task's own instructions. This task's job was to find the next unrealized A1 spine outcome after unit49 (laundry): universal.a1.swimming_pool.visit_swimming_pool ('visit a public swimming pool, buy an entry ticket, ask about a locker and opening hours, and understand basic pool rules'). A fresh, targeted keyword search (English swim/pool/swimming, plus direct Dari-script greps for حوض/آببازی/اوبازی/شنا, all Unicode-normalized since the raw pdftotext output uses Arabic presentation-form glyphs that don't match plain-Persian-range greps directly) was run across the full locally cached corpus: all 10 Semester 1 student-book PDFs (s1-4 through s37-40), both Semester 2 combined student books (Book 1-20, Book 21-40), both Semester 3 combined student books, and all nine Semester 3 'Other documents' supplements (All conversations, All Scenarios, Discussion, Fill-ins, Short Stories, Cards 41-60/61-80, Performance Checks, Comprehensive military topics). This found a genuine, real, repeated hit: حوض آببازی (also spelled حوض اَوبازی in the colloquial/diacritic-marked form) is the DLI corpus's own attested Dari term for 'swimming pool,' appearing in the alphabetical glossary of SIX different Semester 1 lesson blocks (s17-20, s21-24, s25-28, s29-32, s33-36, s37-40) and, most usefully, inside a real worked example in s17-20's Lesson 19 ('At a Hotel,' the same lesson unit45's own provenance note already used for hotel vocabulary): a genuine minimal-pair Yes-No-question grammar illustration built around 'هوتل حوض اَوبازی داره؟' / 'آیا هوتل حوض آببازی دارد؟' (both glossed 'Does the hotel have a swimming pool?', colloquial vs. formal registers of the same question) plus a follow-on sentence 'این مرد به حوض آببازی رهنمایی‌ات خواهد کرد' ('This man will guide you to the swimming pool'). This confirms حوض آببازی as authentic, well-attested Dari vocabulary for the pool itself, and independently corroborates unit45's own prior finding of the same term inside that same Lesson 19 hotel-room-vocabulary list. However, every one of these hits is in a HOTEL-AMENITY-QUESTION context ('does the hotel have a pool'), not a public-pool-visit scenario -- none of the source material covers buying an entry ticket, a locker, opening/closing hours, or pool rules, which are this outcome's own actual assessment_requirements. Given this, and per AUTHORING_GUIDE.md #10's own fallback provision, the pool-VISIT content (ticket, locker, hours, staff dialogue) is authored fresh, while the core vocabulary word for 'swimming pool' itself is the genuine DLI-attested حوض آببازی rather than an invented term -- built entirely from this course's OWN already-established in-corpus vocabulary and grammar otherwise: این/است/در (multiple earlier units), بلیط (ticket, unit16 travel), چند/افغانی/بیست (unit04/unit10/many later units), می‌خواهم/بگیرم (want + subjunctive 'get,' the exact same already-established 'X می‌خواهم Y بگیرم' pattern unit42/unit43/unit48/unit49 all already use, extended here with a new object, بلیط), کجاست (unit05 places' 'بازار کجاست؟' pattern, reused for the locker), نمبر/سه (phone-number vocabulary from unit04, reused for a locker number), کی/ساعت/پنج (time words from unit04/unit09/unit11/unit16/unit48/unit49), قیمتش-style -ش possessive suffix (already established course-wide, e.g. unit04/unit10/unit21/unit46/unit47/unit49's قیمتش 'its price,' extended here to a new noun, کمد, giving کمدش 'his/her locker,' the exact same mechanical low-complexity-extension precedent this corpus already uses repeatedly), اما (contrast, unit33/unit39-49), and -تان suffix (unit39-49's own established precedent: کرایه‌تان unit48, قرارتان unit47, نسخه‌تان unit46, لباس شویی‌تان unit49). Three new content words beyond حوض آببازی itself, none source-derived, all standard everyday modern Dari/Persian vocabulary chosen because the DLI corpus (now checked in full, including the Semester 3 'Other documents' supplements) has no locker/opening-hours vocabulary at all for this domain: کمد (locker/cabinet -- the standard modern Dari word for a cabinet or locker, a realistic and honest modernization since coin-operated public-pool lockers are a genuinely common Kabul-urban-facility detail, not a Western assumption), باز (open), and بسته (closed) -- both extremely common, basic modern Dari/Persian adjectives, and independently source-corroborated as natural Dari usage via s9-12's own unrelated 'تانک تیل باز است' ('the fuel tank is open') sentence, confirming the X-باز-است copula pattern this unit reuses is genuinely natural Dari phrasing, not invented. Deliberately scoped this unit tightly to the outcome's own four assessment_requirements (ticket price, locker, one hours fact, a notice) rather than inventing 'pool rules' vocabulary (e.g. swimwear-required signage) with no source attestation and no clear course-internal grammar to build it from cleanly at A1 -- per AUTHORING_GUIDE.md #1's spine-outcome discipline, since the outcome's own assessment_requirements text treats price/hours/a-stated-rule as three ALTERNATIVE ways to satisfy read_pool_notice, not three mandatory facts, price and hours alone genuinely satisfy it without scope creep."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's realization. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans; no internal-jargon/snake_case leaks in learner-facing options/distractors/pairs; all matching_pairs exercises have 6-12 pairs per AUTHORING_GUIDE.md #16; all exercise types used (multiple_choice/matching_pairs/word_order/translation/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx; no listen_select/dialogue_response/other audio-dependent exercises exist (correctly following AUTHORING_GUIDE.md #14's prs no-TTS restriction, so the nl-unit44-50-style same-speaker-distractor bug class does not apply here -- this unit's multiple_choice exercises are pure text-translation recognition, not audio clip identification); every dialogue teaching-card title matches its own gloss exactly; cross-lesson facts (prices, times, character preferences, item colors/locations) are consistent everywhere referenced within the unit. Dari register/grammar read as sound, consistent Kabul Dari throughout, matching this course's established استم/استین uncontracted register and Afghan-not-Iranian vocabulary choices.\n\nReview 2026-10-20 (en-prs A1 pass): 3 fixes - بلیط changed to تکت (Afghan word, as already taught in units 16 and 24); آببازی changed to آب‌بازی (missing ZWNJ); matching-pair gloss Hello, welcome. NATIVE FLAGS: confirm حوض آب‌بازی (swimming pool) is the everyday Kabuli term versus حوض شنا; کمد (locker) vs الماری; ساعت پنج بسته است read as closes at five."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-49). Lesson04's dialogue introduces a new
    کارمند (pool staff member) role opposite the established Homayoun
    character, reusing the same polite-service register unit08's/
    unit10's دکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل,
    unit46's دواساز, unit47's دلاک, unit48's/unit49's دوکاندار exchanges
    already established -- not the informal-تو friendship register.
    Lesson05's reading passage uses a 3rd-person statement naming
    همایون explicitly in its first sentence, then او in the following
    sentences, matching unit27/unit47/unit48/unit49's own reading-
    passage precedent, and lesson06's wrap-up uses the same formal
    شما-تان-suffixed question pattern unit39-49 already established.

