schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: prs
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Intermediate Dari for Peace Corps Volunteers" (M. Ehsen Enteser,
    Peace Corps, May 1966, ERIC ED131692), Unit I -- the modal-ability
    grammar pattern (می‌توانم که + subjunctive clause, present and past),
    modernized and converted from the source's own romanized
    transliteration to native Dari script. This is prs's first B1 unit;
    universal.b1.abilities.express_ability_with_embedded_clause is a new
    spine outcome added under the standing delegated spine-authority for
    this pass (prerequisite: universal.a2.bureaucracy.register_with_authorities).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude) found and fixed FOUR real bugs.
    (1) پوسته ("post office" in lesson04's dialogue/vocabulary/exercises) is
    actually the standard Persian/Dari word for "peel/shell/crust" (fruit
    skin), NOT "post office" -- confirmed via web search against multiple
    Persian dictionaries; the Pashto word for "post/mail" is coincidentally
    also پوسته, but that's a different language's lexeme, not Dari's real
    word for a post office, which is پسته خانه (posta khana) or اداره پست.
    Fixed by changing every occurrence (realization target/introduced_tokens/
    tested_text/word_bank/media_assets and overlay gloss/note/feedback/
    accepted_answers/matching_pairs) from پوسته to پسته خانه. (2) Four
    grammar-note instances (lesson03's teach.natanestam/teach.grammar_past,
    lesson06's teach.grammar_review, realization and overlay) incorrectly
    described نتانستم's negation morpheme as the prefix "نه-" -- the actual
    Persian/Dari verbal negation prefix is "ن-" (na-); "نه" is a different,
    standalone word meaning "no." Left uncorrected, this would have taught
    learners a real morphological error. Fixed all four instances to "ن-".
    (3) lesson01.teach.review_ketab/review_nama/review_in/review_ra and
    lesson02.teach.review_anha and lesson03.teach.review_diroz/review_daftar/
    review_beravam/ba and lesson05.teach.review_ast2/man's overlay `note`
    fields all ended with the literal internal-authoring phrase "-- reviewed
    vocabulary," an AUTHORING_GUIDE.md-flagged jargon-leak pattern (internal
    words like "reviewed" leaking into learner-facing text) -- fixed by
    rewriting each note into a plain, learner-facing "X means Y" sentence
    (11 instances). (4) lesson05.exercise06.write_reading_summary's overlay
    accepted a second variant, "...می‌تواند...", using the standard/literary
    verb form می‌تواند instead of this unit's own established colloquial
    می‌تانه -- inconsistent with the file's own explicitly stated register
    policy (این پروژه uses می‌تانم/می‌تانه throughout, deliberately not
    می‌توانم/می‌تواند) and never taught anywhere in the unit; removed the
    untaught variant, keeping only the correct می‌تانه form. Verified the
    fix against the compiler: 0 errors/0 warnings standalone and as part of
    the b1 course. Everything else checked clean: the می‌تانم/می‌تانی/
    می‌تانه/می‌تانیم/می‌تانین/می‌تانن paradigm and its که-subjunctive
    construction are real, correctly formed colloquial Kabul Dari; no stray
    YAML boolean coercion; no Pashto pronoun (هغه/هغوی) leakage; no
    same-speaker-distractor issues (lesson04's dialogue_response and
    multiple_choice items test literal shown text, not audio); every
    exercise type used (multiple_choice, word_order, matching_pairs,
    translation, speak_response, writing_prompt, dialogue_response) is
    registered in ExerciseRenderer.tsx; cross-lesson facts (Zarmina's
    doctor's-appointment story, the errand dialogue) are internally
    consistent. First prs B1 unit, genuinely exploratory. Source material
    check: the
    1966 source (titled "Advanced Farsi" internally despite its Dari/
    Afghan Peace Corps framing) drills می‌تانم که + subjunctive ("I can
    that I buy" = "I can buy") across many verbs/persons, contrasted
    with می‌تانستم که + subjunctive ("I could have"). This project's
    established colloquial-Dari verb form for "can" is می‌تانم (not the
    source's own more Iranian-leaning می‌توانم transliteration base),
    matching the precedent already set in a1_unit21_clothing.yaml's
    dialogue ("می‌تانم این را پرو کنم؟" / "می‌تانین پرو کنین"). Modernization:
    the source's own drill sentences are 1960s bureaucratic/embassy-visit
    register (passport offices, exam permits, embassy visits) -- kept
    the REGISTER (formal-ish, permission/errand-oriented, matching the
    new outcome's administrative-topic framing) but replaced the
    Cold-War-era specific scenarios (US embassy, draft-era exam
    permits) with contemporary equivalents (post office, a government
    ID office, a doctor's appointment) reusing already-established
    course vocabulary and the recurring cast (Zarmina, established
    units 11/12/20/21; Homayoun, established unit20) rather than
    inventing new characters. The که-clause construction itself (rather
    than the simpler, more common modern colloquial bare-subjunctive
    "می‌تانم بخرم" without که) is DELIBERATELY retained as the lesson's
    main target, since removing it would collapse this into an A1/A2
    "can + verb" pattern and defeat the reason this outcome is B1, not
    A2 -- lesson01's grammar note says so explicitly and mentions the
    simpler alternative exists, rather than pretending که is the only
    way to say this. STATUS: draft, review pending, not self-certified.
    Compiler validation (schema/structure only) is clean; the
    linguistic/pedagogical review still needs a fresh-context pass per
    the project's standing pipeline -- this is genuinely new territory
    (first B1 content anywhere in the project) so extra scrutiny is
    warranted, not less.

course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین full-uncontracted register
    policy and the full formal می‌توانم/می‌تواند/می‌توانین paradigm (Afghan
    -ین 2pl, never the Iranian -ید) as the standard Dari form of "can,"
    per the 2026-09-29 prs standardization decision. که-clause ability
    constructions are a genuine, still-used, somewhat more formal/
    deliberate register choice in Dari -- taught here as the main B1
    target precisely because of that added syntactic complexity, with
    an explicit note (lesson01) that a simpler bare-subjunctive
    alternative without که also exists in casual speech.

media_assets:
  - content_key: prs.b1.audio.abilities.vocab.01
    language: prs
    text: می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: prs.b1.audio.dialogue.errands.01
    language: prs
    text: "زرمینه: همایون، می‌توانی که این نامه را به پسته خانه ببری؟ همایون: بلی، می‌توانم. امروز وقت دارم. زرمینه: تشکر. راستی، دیروز می‌خواستم که به دفتر تذکره بروم، ولی نتوانستم. همایون: چرا نتوانستی؟ زرمینه: وقت نداشتم. فردا می‌توانم که بروم."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: prs.b1.unit01.abilities
    title: توانایی
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.abilities.express_ability_with_embedded_clause
    planned_lesson_count: 6

    lessons:
      - content_key: prs.b1.unit01.lesson01.present_ability_1st2nd
        title: می‌توانم که
        spine_outcome_id: universal.b1.abilities.express_ability_with_embedded_clause
        teaching:
          - content_key: prs.b1.unit01.lesson01.teach.mitanam
            kind: vocabulary
            target: {text: می‌توانم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌توانم]
            example: {text: "می‌توانم که این کتاب را بخرم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson01.teach.mitani
            kind: vocabulary
            target: {text: می‌توانی, language_code: prs, direction: rtl}
            introduced_tokens: [می‌توانی]
            example: {text: "می‌توانی که این نامه را بفرستی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson01.teach.grammar_ke_clause
            kind: grammar_note
            target: {text: "می‌توانم که بخرم = I can buy (lit. \"I can that I buy\"). که introduces a subjunctive clause: بخرم, ببینم, بفرستم change form with the subject, but می‌توانم itself stays fixed to the SPEAKER, not the action's doer in casual speech ('می‌توانم بخرم' without که) also exists and is common -- but می‌توانم که + subjunctive is a real, slightly more deliberate register still used, especially for formal requests or careful speech, and is what this unit focuses on.", language_code: prs, direction: rtl}
            introduced_tokens: [که, بخرم, ببینم, بفرستم]
          - content_key: prs.b1.unit01.lesson01.teach.review_ketab
            kind: vocabulary
            target: {text: کتاب, language_code: prs, direction: rtl}
            introduced_tokens: [کتاب]
            example: {text: "این کتاب من است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson01.teach.review_nama
            kind: vocabulary
            target: {text: نامه, language_code: prs, direction: rtl}
            introduced_tokens: [نامه]
            example: {text: "این نامه برای شما است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson01.teach.review_in
            kind: vocabulary
            target: {text: این, language_code: prs, direction: rtl}
            introduced_tokens: [این]
            example: {text: "این کتاب است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson01.teach.review_ra
            kind: vocabulary
            target: {text: را, language_code: prs, direction: rtl}
            introduced_tokens: [را]
            example: {text: "کتاب را می‌خرم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson01.teach.befresti
            kind: vocabulary
            target: {text: بفرستی, language_code: prs, direction: rtl}
            introduced_tokens: [بفرستی]
            example: {text: "می‌توانی که این نامه را بفرستی.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit01.lesson01.exercise01.recognize_mitanam
            type: multiple_choice
            tested_text: می‌توانم
            prompt: {target_blocks: [{text: می‌توانم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit01.lesson01.exercise02.recognize_mitani
            type: multiple_choice
            tested_text: می‌توانی
            prompt: {target_blocks: [{text: می‌توانی, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit01.lesson01.exercise03.order_mitanam_bokharam
            type: word_order
            tested_text: می‌توانم که این کتاب را بخرم
            prompt: {target_blocks: []}
            word_bank: [می‌توانم, که, این, کتاب, را, بخرم]
          - content_key: prs.b1.unit01.lesson01.exercise04.match_ability_words
            type: matching_pairs
            tested_text: می‌توانم می‌توانی کتاب نامه این را
            prompt: {target_blocks: []}
            pairs:
              - {left: می‌توانم, right: I can}
              - {left: می‌توانی, right: you can}
              - {left: کتاب, right: book}
              - {left: نامه, right: letter}
              - {left: این, right: this}
              - {left: را, right: (object marker)}
          - content_key: prs.b1.unit01.lesson01.exercise05.translate_can_send_letter
            type: translation
            tested_text: می‌توانی که این نامه را بفرستی؟
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit01.lesson01.exercise06.speak_can_buy_book
            type: speak_response
            tested_text: می‌توانم که این کتاب را بخرم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit01.lesson01.exercise07.write_ability_sentence
            type: writing_prompt
            tested_text: می‌توانم که این نامه را بفرستم
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit01.lesson02.present_ability_all_persons
        title: همه صیغه‌ها
        spine_outcome_id: universal.b1.abilities.express_ability_with_embedded_clause
        teaching:
          - content_key: prs.b1.unit01.lesson02.teach.mitana
            kind: vocabulary
            target: {text: می‌تواند, language_code: prs, direction: rtl}
            introduced_tokens: [می‌تواند]
            example: {text: "همایون می‌تواند که این نامه را ببرد.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson02.teach.mitanim
            kind: vocabulary
            target: {text: می‌توانیم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌توانیم]
            example: {text: "می‌توانیم که فردا برویم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson02.teach.mitanin
            kind: vocabulary
            target: {text: می‌توانین, language_code: prs, direction: rtl}
            introduced_tokens: [می‌توانین]
            example: {text: "شما می‌توانین که این کار را بکنین.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson02.teach.mitanan
            kind: vocabulary
            target: {text: می‌توانند, language_code: prs, direction: rtl}
            introduced_tokens: [می‌توانند]
            example: {text: "آنها می‌توانند که زود بیایند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson02.teach.grammar_agreement
            kind: grammar_note
            target: {text: "The modal changes with the SPEAKER/doer (می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند) and the embedded verb after که ALSO agrees with the same person: همایون می‌تواند که ببرد (he can that he-take = he can take), not a fixed form -- both halves of the sentence track the same subject.", language_code: prs, direction: rtl}
            introduced_tokens: [ببرد, برویم, بکنین, بیایند]
          - content_key: prs.b1.unit01.lesson02.teach.review_homayoun
            kind: vocabulary
            target: {text: همایون, language_code: prs, direction: rtl}
            introduced_tokens: [همایون]
            example: {text: "همایون امروز کار دارد.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson02.teach.review_anha
            kind: vocabulary
            target: {text: آنها, language_code: prs, direction: rtl}
            introduced_tokens: [آنها]
            example: {text: "آنها امروز می‌آیند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson02.teach.zud
            kind: vocabulary
            target: {text: زود, language_code: prs, direction: rtl}
            introduced_tokens: [زود]
            example: {text: "آنها زود می‌آیند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson02.teach.farda
            kind: vocabulary
            target: {text: فردا, language_code: prs, direction: rtl}
            introduced_tokens: [فردا]
            example: {text: "فردا می‌رویم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit01.lesson02.exercise01.recognize_mitana
            type: multiple_choice
            tested_text: می‌تواند
            prompt: {target_blocks: [{text: می‌تواند, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit01.lesson02.exercise02.recognize_mitanim
            type: multiple_choice
            tested_text: می‌توانیم
            prompt: {target_blocks: [{text: می‌توانیم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit01.lesson02.exercise03.order_homayoun_mitana
            type: word_order
            tested_text: همایون می‌تواند که این نامه را ببرد
            prompt: {target_blocks: []}
            word_bank: [همایون, می‌تواند, که, این, نامه, را, ببرد]
          - content_key: prs.b1.unit01.lesson02.exercise04.match_person_forms
            type: matching_pairs
            tested_text: می‌توانم می‌توانی می‌تواند می‌توانیم می‌توانین می‌توانند
            prompt: {target_blocks: []}
            pairs:
              - {left: می‌توانم, right: I can}
              - {left: می‌توانی, right: you (sg) can}
              - {left: می‌تواند, right: he/she can}
              - {left: می‌توانیم, right: we can}
              - {left: می‌توانین, right: you (pl/polite) can}
              - {left: می‌توانند, right: they can}
          - content_key: prs.b1.unit01.lesson02.exercise05.translate_they_can_come
            type: translation
            tested_text: آنها می‌توانند که زود بیایند
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit01.lesson02.exercise06.speak_we_can_go
            type: speak_response
            tested_text: می‌توانیم که فردا برویم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit01.lesson02.exercise07.write_homayoun_ability
            type: writing_prompt
            tested_text: همایون می‌تواند که این نامه را ببرد
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit01.lesson03.past_ability
        title: می‌توانستم که
        spine_outcome_id: universal.b1.abilities.express_ability_with_embedded_clause
        teaching:
          - content_key: prs.b1.unit01.lesson03.teach.mitanestam
            kind: vocabulary
            target: {text: می‌توانستم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌توانستم]
            example: {text: "دیروز می‌توانستم که این کتاب را بخرم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson03.teach.natanestam
            kind: vocabulary
            target: {text: نتوانستم, language_code: prs, direction: rtl}
            introduced_tokens: [نتوانستم]
            example: {text: "دیروز نتوانستم که به دفتر بروم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson03.teach.grammar_past
            kind: grammar_note
            target: {text: "می‌توانستم که بخرم = I could/was able to buy, about the PAST -- add -ستم to می‌توان to make the past stem (می‌توانستم، می‌توانستی، می‌توانست، می‌توانستیم، می‌توانستین، می‌توانستند), still followed by که + subjunctive. Negate with ن- on the simple past توانستم: نتوانستم = I could NOT / was not able to (colloquial: نتانستم).", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit01.lesson03.teach.review_diroz
            kind: vocabulary
            target: {text: دیروز, language_code: prs, direction: rtl}
            introduced_tokens: [دیروز]
            example: {text: "دیروز کار داشتم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson03.teach.review_daftar
            kind: vocabulary
            target: {text: دفتر, language_code: prs, direction: rtl}
            introduced_tokens: [دفتر]
            example: {text: "دفتر تذکره کجاست؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson03.teach.review_beravam
            kind: vocabulary
            target: {text: بروم, language_code: prs, direction: rtl}
            introduced_tokens: [بروم]
            example: {text: "می‌خواهم که بروم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson03.teach.ba
            kind: vocabulary
            target: {text: به, language_code: prs, direction: rtl}
            introduced_tokens: [به]
            example: {text: "به دفتر می‌روم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit01.lesson03.teach.mitanesti
            kind: vocabulary
            target: {text: می‌توانستی, language_code: prs, direction: rtl}
            introduced_tokens: [می‌توانستی]
            example: {text: "دیروز می‌توانستی که بروی؟", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit01.lesson03.exercise01.recognize_mitanestam
            type: multiple_choice
            tested_text: می‌توانستم
            prompt: {target_blocks: [{text: می‌توانستم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit01.lesson03.exercise02.recognize_natanestam
            type: multiple_choice
            tested_text: نتوانستم
            prompt: {target_blocks: [{text: نتوانستم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit01.lesson03.exercise03.order_diroz_natanestam
            type: word_order
            tested_text: دیروز نتوانستم که به دفتر بروم
            prompt: {target_blocks: []}
            word_bank: [دیروز, نتوانستم, که, به, دفتر, بروم]
          - content_key: prs.b1.unit01.lesson03.exercise04.match_past_present
            type: matching_pairs
            tested_text: می‌توانم می‌توانستم می‌توانی می‌توانستی نتوانستم دیروز
            prompt: {target_blocks: []}
            pairs:
              - {left: می‌توانم, right: I can (now)}
              - {left: می‌توانستم, right: I could (past)}
              - {left: می‌توانی, right: you can (now)}
              - {left: می‌توانستی, right: you could (past)}
              - {left: نتوانستم, right: I could not}
              - {left: دیروز, right: yesterday}
          - content_key: prs.b1.unit01.lesson03.exercise05.translate_could_not_go
            type: translation
            tested_text: دیروز نتوانستم که به دفتر بروم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit01.lesson03.exercise06.speak_could_buy
            type: speak_response
