target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Firecrawl-based research was actually run before authoring (not skipped): `firecrawl search \"DLI Dari Basic Course personality traits\"` and a follow-up search for Afghan/Dari personality-adjective vocabulary lists returned only Iranian-Farsi-oriented pages (PersianPod101, PersianPoetics) unsuitable as a Dari-specific source, plus the same fsi-languages.yojik.eu DLI Dari index already used for prior units. From that index, the Dari Program Overview syllabus doc was scraped again (no per-lesson topic breakdown, same dead end as unit36's search) and, going further than any prior unit's search this session, EIGHT actual Semester-1 lesson-volume PDFs were scraped directly and their full tables of contents read: Lessons 1-4 (People and Places / Afghans and Their Families / Afghans' Daily Life / Mealtime), 5-8 (Personal Belongings / In Kabul / In the Village / At the Bazaar), 9-12 (In the Province / A Friendly Chat / An Invitation / At the Roadside), 13-16 (In a Restaurant / A Medical Problem / At School / A Reasonable Plan), 17-20 (Doctor and Patient / Afghan Traditions / At a Hotel / Renting a House), 21-24 (In the Afghan Army / At the Information Desk / Various Businesses / A Cancellation), and 37-40 (Transportation / Afghan Manufacturing / Afghan Military / Afghan Refugees). Notably, several of these PDFs (unlike the single s21-24 sample unit36's own provenance note tried and found image-only) DID have a real extractable text layer this time -- worth flagging as a correction to that earlier finding, though it did not end up mattering here. None of the 40 lesson titles across these 8 volumes plus the syllabus is a personality/character-traits lesson -- this spine outcome has no DLI Dari counterpart at all, a genuine negative result from real investigation, not an unlooked-for gap. Authored instead from established Afghan Dari conventions already used across prs units 01-36 (مهربان/زحمتکش/باهوش/تنبل/شوخ/راستگو adjective vocabulary, او for he/she, است/استم/استین copula paradigm, چون-clauses reusing the causal pattern from unit25's emotions unit, دوست دارم extended to its regular دوست دارند third-person-plural form), modernized current spoken Kabul Dari register, not a translation of any single source."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit36. An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.personality.describe_basic_personality_traits as the next unrealized A1 outcome (immediately after cooking in spine file order, prerequisite universal.a1.appearance.describe_physical_appearance already realized as unit27). This unit covers basic personality-trait vocabulary (kind, hardworking, smart, lazy, funny, quiet, honest), asking what someone is like with چطور آدم است؟ (an established natural Dari/Farsi construction, literally 'what kind of person is [they]', verified against general Persian usage knowledge rather than a Dari-specific source since none was found -- flagged for reviewer attention), because-clauses reusing unit25's چون pattern, a two-speaker Homayoun/Zarmina dialogue about a third character (Karim, reused from unit15/unit27 for character continuity) discussing his personality, a short third-person reading passage about Homayoun's own personality (continuing the Homayoun/Zarmina throughline from units 25 and 27), and a wrap-up combining two traits with اما plus a formal direct question. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file. Uses او for he/she only; no Pashto هغه/هغوی. No موتر/پشک/پوهنتون-relevant vocabulary applies to a personality unit, but the same Kabul-dialect register conventions were followed throughout (Persian-Yeh/Persian-Keheh orthography, not Arabic-range codepoints; استم/استین uncontracted copula forms matching every prior unit). Dialogue turns use structured speaker fields only. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists). Matching-pairs exercises use seven pairs each (AUTHORING_GUIDE.md #16). Every vocabulary teaching card has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19). Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-36). The Homayoun/Zarmina dialogue (lesson04)
    continues their established informal تو-register friendship from
    unit20/unit25/unit27, discussing a third person (their colleague
    Karim, reused from unit15/unit27) in the formal-neutral 3rd-person
    است/دارد forms. All personality vocabulary (مهربان، زحمتکش، باهوش،
    تنبل، شوخ، کم‌حرف، راستگو) is standard everyday Kabul Dari, shared
    with Farsi but not a borrowed Iranian-specific term -- no
    dialect-divergence risk here, unlike موتر/تکت in unit24.

