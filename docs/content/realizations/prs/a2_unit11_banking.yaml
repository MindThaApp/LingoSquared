            kind: vocabulary
            target: {text: "حساب بانکی", language_code: prs, direction: rtl}
            introduced_tokens: [حساب, بانکی]
            example: {text: "همایون یک حساب بانکی می‌خواهد.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit11.lesson01.teach.card_word
            kind: vocabulary
            target: {text: "کارت بانکی", language_code: prs, direction: rtl}
            introduced_tokens: [کارت]
            example: {text: "کارت بانکی‌ام را گم کردم.", language_code: prs, direction: rtl}
