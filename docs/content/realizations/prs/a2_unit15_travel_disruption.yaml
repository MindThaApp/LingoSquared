  notes: >-
    First of 4 new prs A2 units closing the same 4-outcome spine gap nl and
    fa A2 already closed this session (universal.a2.travel.
    handle_travel_disruption, universal.a2.technology.
    discuss_online_habits, universal.a2.routines.describe_weekly_schedule,
    universal.a2.shopping.make_a_complaint) — this unit covers the travel
    outcome. Continues همایون, prs's established recurring character
    (a1_unit12 routines, a1_unit30 technology, a2_unit11 banking): he is
    travelling by intercity bus from Kabul to Mazar-i-Sharif and the
    9-o'clock departure is cancelled by snowfall on the route, so he asks
    station staff about alternatives. Own scenario, authored independently
    of the fa sibling realization of this same outcome (not consulted at
    all while drafting, including its top-level lesson-count/exercise-type
    scaffold shape, per AUTHORING_GUIDE §8's strong sibling-isolation
    rule — went further than §3's "structure only" allowance and treated
    the fa file as if it does not exist). A2-level grammar step: به دلیل
    (due to / because of, taking a noun phrase) introduced fresh alongside
    continued reuse of already-established اگر (if, from a2_unit11) and
    باید (need to). This is a fully self-contained realization file — the
    compiler's untaught-vocabulary validator (`validate_untaught_
    vocabulary`) checks each realization file independently, so every
    token any exercise here tests is introduced via this file's own
    `introduced_tokens`, not assumed from any other unit's prior teaching.
    Authored at schema_version 1.1 per AUTHORING_GUIDE §19 — every
    kind:vocabulary teaching item in lesson01/lesson03 carries a real
    example: sentence. Every fact (which bus is cancelled, the reason,
    whether an alternative route exists, when the next bus leaves) kept
    consistent across lesson03's reading notice and lesson04's dialogue
    per §11. No fill_in_blank used, sidestepping §13 entirely. No
    listen_type/listen_select/listen_order or audio-only dialogue_
    comprehension anywhere in this unit per §14 — prs has zero real
    recorded/TTS audio; every exercise has a genuine visible text prompt.
    A media_assets block is declared purely to pre-stage a future
    recording pass, unreferenced by any exercise here. Dialect: continues
    prs's established Afghan Dari register (استم/استین copula family,
    بلی/نخیر, می‌کنین/می‌توانین formal-plural verb endings for the
    station-staff dialogue, since a stranger addressing station staff is a
    formal register scene like the bank/office/clinic units) —
    deliberately never Iranian Farsi forms (no شغل, no چطوری، no -ید
    endings).

    Sourcing disclosure: firecrawl checked fresh before authoring this
    batch (`firecrawl --status`), still reporting 0/1000 credits (an
    account-wide exhaustion, not specific to this session) — authored
    from established conventions only (this realization's own prior
    A1/A2 units' verified Afghan vocabulary and grammar progression, plus
    real-world knowledge of Kabul–Mazar-i-Sharif intercity bus travel and
    winter road closures), not from any newly fetched external source,
    matching a2_unit09/10/11/12/13/14's own precedent honestly disclosed
    the same way. `status: unreviewed` — the mandatory fresh-context
    review per AUTHORING_GUIDE §9 has not yet run; do not treat this file
    as ship-ready until it has.

course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: >-
    Continues the established respectful-first Dari register (استم/استین
    copula family, بلی, می‌کنین/می‌توانین formal-plural verb endings) for
    the station-staff scene. Introduces به دلیل (due to) as this unit's
    A2-level causal connector, alongside continued reuse of
    already-established اگر (if) and باید (need to).

