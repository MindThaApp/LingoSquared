            target: {text: تاخیر, language_code: prs, direction: rtl}
            introduced_tokens: [تاخیر]
            example: {text: "بس امروز یک ساعت تاخیر دارد.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit15.lesson01.teach.cancellation_word
            kind: vocabulary
            target: {text: لغو, language_code: prs, direction: rtl}
            introduced_tokens: [لغو]
            example: {text: "بس ساعت نه لغو شده است.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit15.lesson01.teach.closed_word
            kind: vocabulary
            target: {text: بسته, language_code: prs, direction: rtl}
            introduced_tokens: [بسته, راه]
            example: {text: "راه کابل-مزار شریف بسته است.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit15.lesson01.teach.alternative_route_word
            kind: vocabulary
            target: {text: "مسیر بدیل", language_code: prs, direction: rtl}
            introduced_tokens: [مسیر, بدیل]
            example: {text: "مسیر بدیل وجود ندارد.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit15.lesson01.teach.snowfall_word
            kind: vocabulary
            target: {text: برفباری, language_code: prs, direction: rtl}
            introduced_tokens: [برفباری]
            example: {text: "به دلیل برفباری، راه بسته است.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit15.lesson01.teach.notice_word
            kind: vocabulary
            target: {text: اطلاعیه, language_code: prs, direction: rtl}
            introduced_tokens: [اطلاعیه]
            example: {text: "اطلاعیهٔ ایستگاه را خواندم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit15.lesson01.teach.due_to_grammar
            kind: grammar_note
            target: {text: "به دلیل برفباری، بس لغو شده است.", language_code: prs, direction: rtl}
            introduced_tokens: [به, دلیل, شده, است]
          - content_key: prs.a2.unit15.lesson01.teach.wait_phrase
            kind: phrase
            target: {text: "باید تا فردا صبح صبر کنین.", language_code: prs, direction: rtl}
            introduced_tokens: [باید, تا, فردا, صبح, صبر, کنین]
          - content_key: prs.a2.unit15.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: prs, direction: rtl}
            introduced_tokens: [و]
          - content_key: prs.a2.unit15.lesson01.teach.first_person_wait
