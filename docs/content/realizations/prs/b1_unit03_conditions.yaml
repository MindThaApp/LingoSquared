            prompt: {target_blocks: []}

      - content_key: prs.b1.unit03.lesson02.present_condition_all_persons
        title: اگر او وقت داشته باشد
        spine_outcome_id: universal.b1.conditions.express_real_conditions
        teaching:
          - content_key: prs.b1.unit03.lesson02.teach.dashte_bashad
