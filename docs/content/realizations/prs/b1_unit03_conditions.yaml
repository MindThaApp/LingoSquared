units:
  - content_key: prs.b1.unit03.conditions
    title: شرط
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.conditions.express_real_conditions
    planned_lesson_count: 6

    lessons:
      - content_key: prs.b1.unit03.lesson01.present_condition_1st2nd
        title: اگر وقت داشته باشم
        spine_outcome_id: universal.b1.conditions.express_real_conditions
        teaching:
          - content_key: prs.b1.unit03.lesson01.teach.agar
            kind: vocabulary
            target: {text: اگر, language_code: prs, direction: rtl}
            introduced_tokens: [اگر]
            example: {text: "اگر وقت داشته باشم، می‌آیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.dashte_basham
            kind: vocabulary
            target: {text: داشته باشم, language_code: prs, direction: rtl}
            introduced_tokens: [داشته, باشم]
            example: {text: "اگر وقت داشته باشم، به پارک می‌روم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.grammar_agar
            kind: grammar_note
            target: {text: "اگر + subjunctive introduces a real/likely condition: اگر وقت داشته باشم = if I have time. A conditional sentence always has TWO clauses: the اگر-clause states the condition, and the second clause (، می‌آیم) states the result -- never just one clause alone.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit03.lesson01.teach.dashte_bashi
            kind: vocabulary
            target: {text: داشته باشی, language_code: prs, direction: rtl}
            introduced_tokens: [داشته, باشی]
            example: {text: "اگر وقت داشته باشی، می‌آیی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.miayam
            kind: vocabulary
            target: {text: می‌آیم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌آیم]
            example: {text: "من به پارک می‌آیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.miayi
            kind: vocabulary
            target: {text: می‌آیی, language_code: prs, direction: rtl}
            introduced_tokens: [می‌آیی]
            example: {text: "اگر وقت داشته باشی، می‌آیی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.review_vaqt
            kind: vocabulary
            target: {text: وقت, language_code: prs, direction: rtl}
            introduced_tokens: [وقت]
            example: {text: "امروز وقت دارم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.park
            kind: vocabulary
            target: {text: پارک, language_code: prs, direction: rtl}
            introduced_tokens: [پارک]
            example: {text: "به پارک می‌روم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.miravam
            kind: vocabulary
            target: {text: می‌روم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌روم]
            example: {text: "به پارک می‌روم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson01.teach.review_ba
            kind: vocabulary
            target: {text: به, language_code: prs, direction: rtl}
            introduced_tokens: [به]
            example: {text: "به پارک می‌روم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit03.lesson01.exercise01.recognize_agar
            type: multiple_choice
            tested_text: اگر
            prompt: {target_blocks: [{text: اگر, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit03.lesson01.exercise02.recognize_dashte_basham
            type: multiple_choice
            tested_text: داشته باشم
            prompt: {target_blocks: [{text: داشته باشم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit03.lesson01.exercise03.order_agar_miayam
            type: word_order
            tested_text: اگر وقت داشته باشم می‌آیم
            prompt: {target_blocks: []}
            word_bank: [اگر, وقت, داشته, باشم, می‌آیم]
          - content_key: prs.b1.unit03.lesson01.exercise04.match_condition_words
            type: matching_pairs
            tested_text: اگر داشته باشم داشته باشی می‌آیم وقت پارک
            prompt: {target_blocks: []}
            pairs:
              - {left: اگر, right: if}
              - {left: داشته باشم, right: "if I have"}
              - {left: داشته باشی, right: "if you have"}
              - {left: می‌آیم, right: "I come"}
              - {left: وقت, right: time}
              - {left: پارک, right: park}
          - content_key: prs.b1.unit03.lesson01.exercise05.translate_will_you_come
            type: translation
            tested_text: اگر وقت داشته باشی، می‌آیی؟
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit03.lesson01.exercise06.speak_if_i_have_time
            type: speak_response
            tested_text: اگر وقت داشته باشم، می‌آیم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit03.lesson01.exercise07.write_if_i_have_time_park
            type: writing_prompt
