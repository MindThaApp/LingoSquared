          - content_key: prs.b1.unit03.lesson02.teach.ma
            kind: vocabulary
            target: {text: ما, language_code: prs, direction: rtl}
            introduced_tokens: [ما]
            example: {text: "اگر ما وقت داشته باشیم، می‌آییم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit03.lesson02.exercise01.recognize_dashte_bashad
            type: multiple_choice
            tested_text: داشته باشد
            prompt: {target_blocks: [{text: داشته باشد, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit03.lesson02.exercise02.recognize_dashte_bashand
