          - content_key: prs.b1.unit03.lesson02.exercise03.order_agar_homayoun
            type: word_order
            tested_text: اگر همایون وقت داشته باشد می‌آید
            prompt: {target_blocks: []}
            word_bank: [اگر, همایون, وقت, داشته, باشد, می‌آید]
          - content_key: prs.b1.unit03.lesson02.exercise04.match_person_forms
            type: matching_pairs
            tested_text: داشته باشم داشته باشی داشته باشد داشته باشیم داشته باشید داشته باشند
            prompt: {target_blocks: []}
            pairs:
              - {left: داشته باشم, right: "if I have"}
              - {left: داشته باشی, right: "if you have"}
              - {left: داشته باشد, right: "if he/she has"}
              - {left: داشته باشیم, right: "if we have"}
              - {left: داشته باشید, right: "if you (pl) have"}
              - {left: داشته باشند, right: "if they have"}
