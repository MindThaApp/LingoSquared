            example: {text: "اگر همایون وقت داشته باشد، می‌آید.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson02.teach.dashte_bashim
            kind: vocabulary
            target: {text: داشته باشیم, language_code: prs, direction: rtl}
            introduced_tokens: [داشته, باشیم]
            example: {text: "اگر ما وقت داشته باشیم، می‌آییم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson02.teach.dashte_bashid
            kind: vocabulary
            target: {text: داشته باشید, language_code: prs, direction: rtl}
            introduced_tokens: [داشته, باشید]
            example: {text: "اگر شما وقت داشته باشید، می‌آیید؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson02.teach.dashte_bashand
            kind: vocabulary
            target: {text: داشته باشند, language_code: prs, direction: rtl}
            introduced_tokens: [داشته, باشند]
            example: {text: "اگر آنها وقت داشته باشند، می‌آیند.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson02.teach.grammar_agreement
            kind: grammar_note
            target: {text: "داشته باشم، داشته باشی، داشته باشد، داشته باشیم، داشته باشید، داشته باشند -- the subjunctive of بودن (باشم/باشی/باشد...) follows the same م/ی/د/یم/ید/ند person endings as regular present-tense verbs. The result clause's verb (می‌آید، می‌آییم، می‌آیند) also agrees with its own subject, which may be a different person than the اگر-clause's subject.", language_code: prs, direction: rtl}
            introduced_tokens: [می‌آید, می‌آییم, می‌آیند]
          - content_key: prs.b1.unit03.lesson02.teach.review_homayoun
            kind: vocabulary
            target: {text: همایون, language_code: prs, direction: rtl}
            introduced_tokens: [همایون]
            example: {text: "اگر همایون وقت داشته باشد، می‌آید.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson02.teach.review_zarmina
            kind: vocabulary
            target: {text: زرمینه, language_code: prs, direction: rtl}
            introduced_tokens: [زرمینه]
            example: {text: "اگر زرمینه وقت داشته باشد، می‌آید.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit03.lesson02.teach.review_anha
            kind: vocabulary
