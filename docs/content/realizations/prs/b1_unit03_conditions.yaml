generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    prs's third B1 unit, first of four authored in this pass to close the
    real depth gap between en-prs's 61-unit A1 course and its then-2-unit
    B1 course. Uses a NEW spine outcome,
    universal.b1.conditions.express_real_conditions, added under the
    standing delegated spine-authority precedent set by b1_unit01
    (prerequisite: universal.b1.necessity.express_obligation_with_subjunctive,
    continuing the same modal/complex-clause grammar arc rather than
    branching to an unrelated point). Teaches real/likely conditional
    sentences with اگر (if) + compound subjunctive داشته باشم/باشی/باشد/
    باشیم/باشید/باشند (from داشتن) in the if-clause, plus present-indicative
    result clauses, then extends to a regular verb's own ب-subjunctive
    (باریدن -> ببارد) and its negation (نبارد) for "if it rains" / "if it
    doesn't rain." Source-material check: `firecrawl --status` showed
    0/1,000 credits remaining at the start of this pass (same outage
    flagged in b1_unit02's provenance note), so no fresh public-domain
    source search was attempted; this is established-conventions authoring
    (standard, well-documented Persian/Dari conditional-clause grammar),
    the same honest fallback path b1_unit02 used. Grammar-form decision,
    made explicitly rather than guessed: b1_unit01's own reviewed reading
    passage (lesson05) already used "اگر وقت داشته باشد" with the
    STANDARD د-ending subjunctive of بودن (باشد), not the colloquial
    ه-ending pattern established for می‌تانم/بخرم -- this file follows
    that exact precedent for بودن's subjunctive (باشم/باشی/باشد/باشیم/
    باشید/باشند, matching b1_unit01's own reviewed رفتن precedent برود
    also being د-ending) and extends the same د/ند-ending convention to
    every NEW regular verb introduced here (باریدن -> ببارد/نبارد,
    ماندن -> می‌مانم/می‌مانیم, آمدن -> می‌آیم/آیی/آید/آییم/آیند,
    رفتن -> رفتند/می‌رویم, نوشیدن -> نوشیدند/می‌نوشیم) rather than
    inventing new colloquial contractions with no shipped precedent to
    check against -- the ه/ین/ن colloquial paradigm is reserved for the
    two verbs it's already extensively established for (تانستن, خریدن)
    and is not extended to new verbs in this pass. Negative-subjunctive
    rule taught explicitly (lesson03): a regular verb's ب- subjunctive
    prefix is REPLACED by ن- for negation (ببارد -> نبارد), contrasted
    with the modal تانستن's negation (نتانستم), which simply prefixes
    ن- onto the whole conjugated form since تانستن never took a ب-
    prefix to begin with -- this distinction is real, previously implicit
    in the corpus, and made explicit here since it's exactly the kind of
    point a B1 learner needs stated plainly. Scenario is original:
    Zarmina and Homayoun (established recurring cast, prs units 11/12/20/
    21/b1_unit01/b1_unit02) planning a Friday outing to the park,
    contingent on the weather -- a fresh, concrete, weather-conditional
    scenario distinct from both b1_unit01's errands and b1_unit02's
    guests-tonight scenario. All vocabulary is introduced self-contained
    within this file (introduced_tokens are file-scoped per project
    convention, so already-established words like زرمینه/همایون/آنها/به/
    وقت are re-taught here). Word_order exercises deliberately omit the
    internal comma a written two-clause conditional would naturally carry
    (see AUTHORING_GUIDE.md's word_bank/accepted_answers multiset-parity
    rule -- WordOrder.tsx exposes one fixed tile set, so a comma would
    have to ship as its own tile, which no existing word_order exercise
    in this corpus does); translation/writing/speak/dialogue_response
    exercises keep the natural comma. Dialect: continues the same
    استم/استین-adjacent, fuller written-leaning register from prs's
    other units. Every kind:vocabulary card carries a real example
    sentence per AUTHORING_GUIDE.md #19. No listen_type/listen_select/
    listen_order anywhere (AUTHORING_GUIDE.md #14 -- prs still has zero
    TTS/recorded-audio coverage). Every matching_pairs exercise uses 6
    pairs (AUTHORING_GUIDE.md #16). STATUS: freshly authored this pass,
    NOT yet through the mandatory fresh-context review -- review.status
    is honestly left unreviewed below.
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Not yet reviewed. A fresh-context reviewer (zero access to this
    authoring's reasoning, per AUTHORING_GUIDE.md #9, and instructed not
    to open the prs-en sibling overlay per #8) should check in particular:
    (1) the اگر + داشته باشم/باشی/باشد/باشیم/باشید/باشند construction
    throughout (lessons 1-2); (2) the regular-verb ب-subjunctive
    (ببارد) and its negation (نبارد, ن- replacing ب-, NOT a separate
    "نه-" prefix -- verify this file never repeats the negation-prefix
    error b1_unit01's own review had to fix for نتانستم) in lesson03;
    (3) whether mixing standard د/ند-ending subjunctive forms for NEW
    verbs (باریدن، رفتن، آمدن) alongside the already-established
    ه/ین/ن-ending forms for تانستن/خریدن reads as a genuine, defensible
    dialectal pattern or as an inconsistency that should be flagged;
    (4) script purity (Persian-range ک/ی only, no Arabic-range
    codepoints); (5) no internal-jargon leaks in learner-facing text;
    (6) every exercise type used (multiple_choice, word_order,
    matching_pairs, translation, speak_response, writing_prompt,
    dialogue_response) is registered in ExerciseRenderer.tsx; (7)
    cross-lesson fact consistency (the Friday-park-if-sunny plan,
    lesson04's dialogue and lesson05's reading agreeing about what
    actually happened); (8) that every word_order/listen_order
    word_bank multiset exactly matches its accepted-answer token
    multiset (hand-verified against validate_order_word_bank_answers
    before this note was written, but a fresh reviewer should re-confirm
    via a real compiler run, not trust the authoring self-report).

course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین-adjacent, fuller written-leaning
    register from prs's other units. New regular verbs introduced from
    this unit onward use the standard د/ید/ند-ending present-indicative
    and ب-subjunctive paradigm (matching this course's own precedent for
    رفتن/بودن), while the previously-established ه/ین/ن colloquial
    paradigm remains specific to تانستن/خریدن and is not extended further
    without a new shipped precedent to check consistency against.

