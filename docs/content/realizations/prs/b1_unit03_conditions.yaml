          - content_key: prs.b1.unit03.lesson03.teach.grammar_negation
            kind: grammar_note
            target: {text: "A regular verb's subjunctive prefix ب- becomes ن- for negation: ببارد (it rains) -> نبارد (it doesn't rain). This is different from تانستن's negation (نتانستم), which just adds ن- directly, since تانستن never took a ب- prefix to begin with.", language_code: prs, direction: rtl}
            introduced_tokens: []
