generation_provenance:
  method: ai_generated_fresh
  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session, so real, direct WebFetch access plus local pdftotext extraction was used instead (per this session's task instructions). Confirmed via WebFetch that the DLI Dari course's top-level index has three semester directories; per prior units' own provenance notes, Semester 1 (all) and Semester 2 (Student Units 1-40) had already been checked and found not to cover this topic. This task additionally checked Semester 3 in full: Sem 3 Book Part 2's small text-extractable files (`All Scenarios _2006_.pdf`, downloaded via curl with proper percent-encoding and cleanly extracted with `pdftotext -layout`) turned out to be officer/military-linguist scenario prompts -- Scenario 1 is literally titled 'Establishing Rapport with the Locals and Setting up a Base Camp' and its task text does mention negotiating with a village spokesperson to have 'trash from camp removed regularly,' but this is a military-logistics negotiation task with only an English task prompt (no extractable Dari dialogue text -- the actual Dari is audio-only in the large S/T Book PDFs) and a register/scenario totally unrelated to an A1 household-waste-sorting outcome. Sem 3 Book Part 1's `All conversations _2006_.pdf` (286K, cleanly extracted) contains 40 full Dari conversations each with an English title; every one of the 40 titles was read (topics range from menu planning and nomad life to military commanders, prison conditions, deforestation, and nuclear science) and a grep of the extracted Dari text for زباله/بازیافت/سطل found zero hits -- no conversation covers household waste sorting, recycling, or collection schedules. The `Cards 41-60`/`Cards 61-80`/`Comprehensive military topics` files were not downloaded given the already-confirmed advanced military register of every other Semester 3 file checked and diminishing returns after this exhaustive a search. This unit is therefore authored fresh from already-established in-course conventions and vocabulary, the same honest disclosure pattern several earlier units used when the located DLI material didn't cover the specific topic. Every new word is a standard, everyday Dari word: زباله (waste/garbage), سطل (bin/bucket, a common everyday container word), پلاستیک (plastic, a standard loanword across Persian varieties), کاغذ (paper), شیشه (glass), دور (away, used in the standard دور انداختن 'to throw away' construction), and جمع‌آوری (collection/gathering, a plain everyday word, not internal jargon -- used the same way 'garbage collection' is used in English). Bin colors reuse this course's own already-taught colour vocabulary (سبز/آبی, unit38) rather than inventing new colour words, assigning green to general household waste and blue to paper/plastic/glass recyclables, a plausible and pedagogically simple two-bin system for an A1 learner."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit43 (library). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.waste_disposal.sort_household_waste as the next unrealized A1 outcome (immediately after library in the spine file's own line order; all three listed prerequisites -- universal.a1.household.describe_chores [unit33], universal.a1.colors.describe_colors [unit38], and universal.a1.dates.exchange_calendar_dates [unit09] -- are already realized). This unit covers sorting household waste into a green (general) or blue (recycling) bin, asking which bin an item belongs in, and understanding a simple two-item collection-day schedule, matching all four of the outcome's own assessment_requirements: understand_waste_sorting_exchange (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14), ask_which_bin (speaking substituted the same way this whole corpus substitutes it -- production exercises: translation/writing_prompt/dialogue exchange, plus lesson02/lesson04's explicit کدام سطل است؟ question-and-answer pairs), read_waste_schedule (lesson06's روز جمع‌آوری کاغذ/زباله schedule phrases, the same narrative-recap equivalence unit43 established for read_library_receipt via its return-date phrases), and write_waste_sorting_message (writing_prompt exercises across lessons01-06 stating the item and correct bin). Six lessons: waste/bin vocabulary building on unit38's colour words (زباله, سطل, پلاستیک, plus سطل سبز/سطل آبی combo phrases), paper and glass vocabulary with the کدام سطل است؟ question pattern (کاغذ, شیشه, reusing کدام from unit14/43), the دور انداختن 'throw away' construction extending unit36's می‌اندازم ('I add', there used for salt -- a genuine, non-stretched polysemy of انداختن covering both 'add/put' and 'throw/discard') plus its negative نمی‌اندازم, a Wahid/Shukria dialogue in the established informal تو register (reusing the exact pair unit33's household-chores unit introduced, a natural thematic continuation from chores to waste-sorting, and a deliberate change from the Homayoun-heavy register of units 37-43 for character variety) asking and confirming which bin the glass and the trash go in, a third-person reading passage continuing the same two characters with a newly self-contained-introduced 3rd-person می‌اندازد (matching unit33's own precedent of introducing a new 3rd-person conjugated form with an explicit review grammar_note immediately before its first exercise use, e.g. می‌شوید there), and a wrap-up introducing جمع‌آوری (collection) to state a two-item collection-day schedule contrasted with اما, plus a formal شما-prefixed question reusing the established -ین formal-suffix family (extending می‌خواهین/کنین/می‌خواهم the same way unit43's own می‌خواهین precedent did, to a new formal-plural می‌اندازین). Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (است/در از throughout, رنگ/سبز/آبی/خاکستری-family از unit38, کدام از unit14/43, را از unit14/26/36/43, می‌اندازم از unit36 [there glossed 'I add', extended here to its equally standard 'I put/throw' sense], این از unit04/43, بسیار/خوب/تشکر زیاد/خواهش می‌کنم از unit01/06/09/11/40/42/43, وحید/شکریه/تو/می‌کنی/هم/تشکر/زیاد از unit33, او/هر/روز/است از unit12/33/43, دوشنبه/سه‌شنبه از unit09/43, اما/شما از unit03/14/28/32/33/39-43). Uses او only for he/she (reading passage uses او as a standalone subject pronoun, same as unit33/43's own reading passages); no Pashto هغه/هغوی -- double-checked against the known Pashto-vs-Dari pronoun bug. No multi-clause translate/write exercise combines two natural clauses without an explicit single conjunction -- the one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form only, matching unit33/39-43's own established precedent that this construction has exactly one natural conjunction reading; there is no dialogue line in this unit that combines two clauses without a conjunction, so the AUTHORING_GUIDE.md #12 multi-variant question doesn't arise elsewhere in this file. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead. Zero fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs). Matching-pairs exercises use seven pairs each (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (سطل, زباله, پلاستیک, کاغذ, شیشه, دور, جمع‌آوری) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content, including every matching_pairs right: value. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-43). Lessons 01-03's vocabulary/practice
    sentences are 1st-person statements (می‌اندازم) building on the
    می‌اندازم/می‌اندازد conjugation family this course already established
    in unit36. Lesson04's dialogue deliberately returns to Wahid and
    Shukria (وحید و شکریه), the informal-تو household-chores pair unit33
    introduced, continuing the same friendship register (تو/می‌کنی/هم)
    rather than the Homayoun-heavy register of units 37-43. Lesson05's
    reading passage uses 3rd-person او + a newly self-contained-introduced
    می‌اندازد, matching unit33's own reading-passage shape exactly, and
    lesson06's wrap-up uses the same formal شما-prefixed question pattern
    unit39-43 already established, here extended to a new formal-plural
    می‌اندازین.

