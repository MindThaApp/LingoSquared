            kind: grammar_note
            target: {text: "است (is) / در (in)", language_code: prs, direction: rtl}
            introduced_tokens: [است, در]
          - content_key: prs.a1.unit44.lesson01.teach.review_colors
            kind: grammar_note
            target: {text: "رنگ (color) / سبز (green) / آبی (blue)", language_code: prs, direction: rtl}
            introduced_tokens: [رنگ, سبز, آبی]
          - content_key: prs.a1.unit44.lesson01.teach.bin_word
            kind: vocabulary
            target: {text: سطل, language_code: prs, direction: rtl}
            introduced_tokens: [سطل]
            example: {text: "سطل سبز است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit44.lesson01.teach.waste_word
            kind: vocabulary
            target: {text: زباله, language_code: prs, direction: rtl}
            introduced_tokens: [زباله]
            example: {text: "زباله در سطل است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit44.lesson01.teach.green_bin_phrase
            kind: phrase
            target: {text: "سطل سبز", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit44.lesson01.teach.plastic_word
            kind: vocabulary
            target: {text: پلاستیک, language_code: prs, direction: rtl}
            introduced_tokens: [پلاستیک]
            example: {text: "پلاستیک در سطل سبز است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit44.lesson01.teach.waste_in_green_bin_phrase
            kind: phrase
            target: {text: "زباله در سطل سبز است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit44.lesson01.exercise01.recognize_waste
            type: multiple_choice
            tested_text: زباله
            prompt: {target_blocks: [{text: زباله, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit44.lesson01.exercise02.recognize_bin
            type: multiple_choice
            tested_text: سطل
            prompt: {target_blocks: [{text: سطل, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit44.lesson01.exercise03.recognize_waste_in_green_bin
            type: multiple_choice
            tested_text: "زباله در سطل سبز است."
            prompt: {target_blocks: [{text: "زباله در سطل سبز است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit44.lesson01.exercise04.match_waste_bin_vocab
            type: matching_pairs
            tested_text: "زباله سطل پلاستیک سطل سبز در زباله در سطل است پلاستیک در سطل سبز است"
            prompt: {target_blocks: []}
            pairs:
              - {left: زباله, right: "waste / trash"}
              - {left: سطل, right: bin}
              - {left: پلاستیک, right: plastic}
              - {left: "سطل سبز", right: "green bin"}
              - {left: در, right: in}
              - {left: "زباله در سطل است.", right: "The trash is in the bin."}
              - {left: "پلاستیک در سطل سبز است.", right: "The plastic is in the green bin."}
