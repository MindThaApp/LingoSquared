            target: {text: می‌آیم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌آیم]
            example: {text: "گفتم که فردا می‌آیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit05.lesson01.teach.review_miayi
            kind: vocabulary
            target: {text: می‌آیی, language_code: prs, direction: rtl}
            introduced_tokens: [می‌آیی]
            example: {text: "گفتی که فردا می‌آیی؟", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit05.lesson01.exercise01.recognize_goftam
            type: multiple_choice
            tested_text: گفتم
            prompt: {target_blocks: [{text: گفتم, language_code: prs, direction: rtl}]}
