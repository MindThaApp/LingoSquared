        title: گفتم که
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - content_key: prs.b1.unit05.lesson01.teach.goftam
            kind: vocabulary
            target: {text: گفتم, language_code: prs, direction: rtl}
            introduced_tokens: [گفتم, که]
            example: {text: "گفتم که فردا می‌آیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit05.lesson01.teach.grammar_goft_ke
            kind: grammar_note
            target: {text: "گفت که + clause reports what someone said. Unlike English (which backshifts tense: \"she said she WOULD come\"), Dari keeps the clause's own natural tense: گفتم که فردا می‌آیم = I said that I'm coming tomorrow -- می‌آیم stays present, it doesn't change.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit05.lesson01.teach.gofti
            kind: vocabulary
            target: {text: گفتی, language_code: prs, direction: rtl}
            introduced_tokens: [گفتی]
            example: {text: "گفتی که فردا می‌آیی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit05.lesson01.teach.review_farda
