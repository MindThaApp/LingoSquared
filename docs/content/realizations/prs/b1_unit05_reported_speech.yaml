            tested_text: گفتم که فردا می‌آیم
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit05.lesson01.exercise07.write_i_said_tomorrow
            type: writing_prompt
            tested_text: گفتم که فردا می‌آیم
            prompt: {target_blocks: []}

