            kind: grammar_note
            target: {text: "پرسید (که) + a question reports what someone asked -- both a wh-question (پرسید که چه وقت می‌آیی؟ = he/she asked when you're coming) and a yes/no question (پرسید که می‌آیی؟ = he/she asked whether you're coming) embed the SAME way, directly after که, with no extra \"if/whether\" word needed like English uses.", language_code: prs, direction: rtl}
