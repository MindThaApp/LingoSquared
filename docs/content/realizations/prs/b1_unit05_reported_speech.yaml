generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    prs's fifth B1 unit, third of four authored in this pass to close
    the real depth gap between en-prs's 61-unit A1 course and its
    previously-2-unit B1 course. Uses a NEW spine outcome,
    universal.b1.reported_speech.report_what_someone_said, added under
    the standing delegated spine-authority precedent set by
    b1_unit01-04 (prerequisite:
    universal.b1.sequencing.describe_events_with_time_clauses,
    continuing the same complex-clause grammar arc). Teaches reported
    statements with گفت که + embedded clause (lessons 1-2, all persons)
    and reported questions with پرسید (که) + embedded question (lesson03,
    both a wh-question and a yes/no question) -- explicitly noting that
    Dari, unlike English, does not backshift tense inside the reported
    clause and embeds a reported question directly with no special
    "if/whether" word needed. Deliberately uses چه وقت ("what time") for
    "when" rather than the bare, ambiguous کی (which is a genuine
    who/when homograph in written Persian/Dari, disambiguated only by
    context or stress in speech) -- a specific choice made to avoid
    authoring an ambiguous vocabulary card. Source-material check:
    `firecrawl --status` still showed 0/1,000 credits remaining partway
    through this pass (same outage flagged in b1_unit02/03/04's
    provenance notes), so no fresh public-domain source search was
    attempted; this is established-conventions authoring (standard,
    well-documented Persian/Dari reported-speech grammar), the same
    honest fallback path used throughout this pass. All new regular
    verbs continue b1_unit03/04's explicit د/ند-ending-for-new-verbs
    convention (گفتم/گفتی/گفت/گفتیم/گفتید/گفتند, پرسیدم/پرسید, صحبت کرد،
    شنید -- all standard-shape, no invented colloquial contractions).
    Scenario is original: Zarmina and Homayoun (established recurring
    cast) discussing what their workplace manager (مدیر, a new,
    mentioned-but-not-appearing third party, following this course's
    established convention of introducing occasional named side
    characters) said about an important guest arriving -- a fresh,
    concrete, workplace scenario distinct from the previous three new
    units' errands/guests/weather/routine scenarios. All vocabulary is
    introduced self-contained within this file (introduced_tokens are
    file-scoped per project convention, so already-established words
    like زرمینه/همایون/آنها/فردا/باید/زود/دیروز/با/هم are re-taught
    here). Word_order exercises omit the internal comma a written
    two-clause sentence would naturally carry (matching the multi-word
    question-mark-attached-tile precedent already used in b1_unit01's
    own lesson04); translation/writing/speak/dialogue_response
    exercises keep natural punctuation. Every kind:vocabulary card
    carries a real example sentence per AUTHORING_GUIDE.md #19. No
    listen_type/listen_select/listen_order anywhere (AUTHORING_GUIDE.md
    #14 -- prs still has zero TTS/recorded-audio coverage). Every
    matching_pairs exercise uses 6 pairs (AUTHORING_GUIDE.md #16).
    STATUS: freshly authored this pass, NOT yet through the mandatory
    fresh-context review -- review.status is honestly left unreviewed
    below.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Not yet reviewed. A fresh-context reviewer (zero access to this
    authoring's reasoning, per AUTHORING_GUIDE.md #9, and instructed not
    to open the prs-en sibling overlay per #8) should check in
    particular: (1) the گفت که + embedded-clause reported-statement
    construction (lessons 1-2) for genuine grammatical accuracy and
    natural register; (2) the پرسید (که) + embedded-question construction
    (lesson03), specifically whether both the wh-question and yes/no
    forms read naturally and whether چه وقت is the right choice over کی
    for this project's register; (3) whether new-verb forms (گفت،
    پرسید، صحبت کرد، شنید) stay internally consistent with the
    established د/ند-ending pattern; (4) script purity (Persian-range
    ک/ی only, no Arabic-range codepoints); (5) no internal-jargon leaks
    in learner-facing text; (6) every exercise type used
    (multiple_choice, word_order, matching_pairs, translation,
    speak_response, writing_prompt, dialogue_response) is registered in
    ExerciseRenderer.tsx; (7) cross-lesson fact consistency (what the
    manager actually said, when the guest is arriving, agreeing between
    lesson04's dialogue and lesson05's reading); (8) that every
    word_order/listen_order word_bank multiset exactly matches its
    accepted-answer token multiset (hand-verified against
    validate_order_word_bank_answers before this note was written, but
    a fresh reviewer should re-confirm via a real compiler run, not
    trust the authoring self-report).

course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین-adjacent, fuller written-leaning
    register from prs's other units. New regular verbs continue
    b1_unit03/04's precedent of standard د/ید/ند-ending present-indicative
    and simple-past paradigms; the earlier ه/ین/ن colloquial paradigm
    remains specific to تانستن/خریدن and is not extended further.

