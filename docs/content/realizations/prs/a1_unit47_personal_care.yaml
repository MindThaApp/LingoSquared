generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits remain exhausted this session, so real, direct WebFetch access plus local pdftotext extraction was used, per this task's own instructions. This task's specific job was to find the next unrealized A1 spine outcome after unit46 (pharmacy): universal.a1.personal_care.get_haircut ('get a haircut'). Before authoring fresh, a genuinely thorough source check was run across every remaining un-checked DLI Dari volume, not just a repeat of the pharmacy-unit search: WebFetch confirmed the full DLI Dari Books index (Semester 1/2/3). Semester 1's s1-4 through s37-40 (all 40 lessons) had already been fully checked by prior units through unit46 -- no re-check needed. This task downloaded and pdftotext-extracted, for the first time this session, BOTH full Semester 2 combined student volumes (S Book 1-20.pdf, 18MB/99 pages; S Book 21-40.pdf, 24MB/47 pages) and BOTH Semester 3 student books (Dari Sem 3 S Book 1.pdf, Dari Sem 3 S Book 2.pdf) -- a real, substantive extension of source coverage beyond what unit46's own provenance note describes, not a repeat. A keyword grep (barber/salon/haircut/hair cut/beauty/comb/scissors/shave/trim, plus direct Dari-script greps for سلمانی/آرایشگاه/دلاک) across all four volumes found NO dedicated barbershop/salon lesson anywhere in the entire DLI Dari corpus. Two genuine, narrow hits were found and are honestly disclosed: (1) Semester 2 Unit 2's military walk-through-inspection barracks-commands drill lists 'موهای سرتان را اصلاح کنید!' glossed 'Get haircuts!' as one of seven plural-imperative commands -- confirming اصلاح کردن as a real, source-attested Dari verb meaning 'to trim/groom [hair]', though the sentence itself is a military command, not a customer-service phrase, and was not reused verbatim; (2) Semester 3 Book 1 lists تراشیدن ('to shave') in a vocabulary gloss and in a proverb ('He has soaked a hundred heads to prepare for shaving, but has not shaved a single one') -- confirming تراشیدن as a real source-attested verb, again not reused verbatim (the proverb itself is B2/C1-level idiom, entirely unusable at A1 and not adapted). No Peace Corps Dari re-check was done (CLAUDE.md's Secrets section already closed that investigation: PDF-only, no recordings, and the earlier accommodation/pharmacy units already found Peace Corps Dari repeatedly scanned-only/image-only for this kind of everyday-service topic). Given the DLI corpus is now genuinely exhausted for this specific topic (confirmed across all of Semester 1/2/3, not just Semester 1 as prior units checked), this unit is authored FRESH per AUTHORING_GUIDE.md #10's own fallback provision, using the two source-verified verb senses above as a genuine (if narrow) scaffold rather than inventing them from nothing. سلمانی (barbershop) and دلاک (traditional Afghan word for barber/barbershop) were independently verified via live web search (not DLI-sourced) as authentic Afghan Dari terms distinct from Iranian Persian's آرایشگاه -- a 2026-07-09 web search on Afghan barbershop terminology confirmed 'in Afghan Dari, a barbershop is traditionally called a dalak (دلاک), though salman/salmani (سلمانی) is also used, particularly as a more modern urban Kabul term' -- سلمانی was chosen for 'barbershop' (the more common modern Kabul-urban noun) and دلاک for 'barber' (the traditional Afghan person-noun), keeping both registers distinct and both genuinely Afghan rather than defaulting to the Iranian-Farsi-coded آرایشگاه. کوتاه‌تر (shorter) is a course-internal regular comparative built with the same -تر suffix this course already established in unit15 (بزرگ‌تر/کوچک‌تر/گران‌تر/ارزان‌تر), applied to the already-taught کوتاه (unit27) -- not a new grammar point, the expected paradigm cell. می‌خواهد (3rd-person 'wants') is likewise the expected paradigm cell of the already-taught می‌خواهم/می‌خواهین (1st/2nd-polite), matching the exact precedent unit27 itself set when it introduced ندارد as the expected 3rd-person cell of the already-taught دارم/ندارم."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit46 (pharmacy). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.personal_care.get_haircut as the next unrealized A1 outcome (immediately after pharmacy in the spine file's own line order; both listed prerequisites -- universal.a1.appointments.make_simple_appointment [unit42] and universal.a1.money.handle_basic_money_matters [unit23] -- are already realized). This unit covers asking for a haircut/trim at a barbershop, describing a simple style preference (shorter), asking for a beard trim/shave, and understanding a basic price/service exchange, matching all four of the outcome's own assessment_requirements: understand_service_exchange (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14), request_haircut_service (speaking substituted the same way this whole corpus substitutes it -- production exercises: translation/writing_prompt/word_order naming the service or style preference), read_salon_notice (lesson05's reading passage recapping lesson04's own dialogue facts, price included, per AUTHORING_GUIDE.md #11), and write_personal_care_message (writing_prompt exercises across all six lessons). Six lessons: barbershop/barber vocabulary (سلمانی, دلاک both new), hair/style-preference vocabulary (کوتاه‌تر new -- regular -تر comparative of unit27's already-taught کوتاه; اصلاح new, 'a trim/haircut' as a noun, DLI-source-verified verb sense اصلاح کردن reused as a noun per this course's already-established دوا-as-object-of-می‌خواهم pattern), beard/shaving vocabulary (می‌تراشم new, 'I shave', DLI-source-verified via Semester 3's تراشیدن vocabulary entry), a Homayoun/دلاک barbershop dialogue asking for a trim and a beard trim and hearing the price (no new vocabulary in this lesson -- pure recombination of lessons 01-03's new words plus review, matching the established pattern that a dialogue lesson doesn't always need fresh vocabulary of its own), a third-person reading passage recapping the same dialogue's facts (می‌خواهد new, the expected 3rd-person paradigm cell of already-taught می‌خواهم/می‌خواهین, matching unit27's own ندارد precedent for introducing an expected paradigm cell as low-complexity, not a new grammar point), and a wrap-up contrasting a haircut price with a beard-trim price using اما plus a formal تان-suffixed appointment question, mirroring unit39-46's own wrap-up shape (قرارتان, 'your appointment', reusing قرار from unit42/this unit's own lesson01, the same -تان suffix pattern as unit46's نسخه‌تان and unit04's تلفن‌تان). Deliberately used DIFFERENT prices in lesson06's wrap-up (شصت/60 for haircut, سی/30 for beard trim) than lesson04/05's combined-service total (صد/100 afghanis) to avoid even the appearance of an arithmetic §11 conflict -- lesson06 is explicitly framed as a separate, generic second-person salon price-list scenario (formal شما-تان register), not a restatement of Homayoun's specific bundled total, the exact same framing device unit46's own lesson06 used for its 'your prescription' contrast. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (این/است/در from unit04/unit09/unit43-46, قرار از unit42, مو/موی/کوتاه از unit27, نخیر از unit01/unit03, ریش از unit27, کدام از unit14/unit43, سلام از unit01, بلی/و/هم از multiple earlier units، کنین از unit07/unit17/unit21/unit23/unit35، بسیار/خوب از unit09/unit11/unit42/unit46، قیمتش/صد/افغانی از unit10/unit23، تشکر زیاد/خواهش می‌کنم از unit01/unit40/unit43/unit46، همایون/او از multiple earlier units، شصت/سی از unit04، چه/روز از unit01/unit12، اما از unit33/unit39-46). دلاک correctly re-declared once at first introduction (lesson01) and NOT re-listed in lesson04's dialogue_line2 speaker card, matching unit46's own exact precedent (دواساز was likewise not re-listed in its dialogue speaker card once already introduced). Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following two -- this is the same pattern unit27 itself established for its own reading passage about Karim; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form only, matching unit33/39-46's own established precedent that this construction has exactly one natural conjunction reading -- no other multi-clause translate/write exercise exists in this unit, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead. Zero fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs). Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (سلمانی, دلاک, کوتاه‌تر, اصلاح, می‌تراشم, می‌خواهد) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. §11 cross-lesson fact check: lesson04's dialogue (Homayoun, haircut plus beard trim, 100 afghanis total) and lesson05's reading passage recap the SAME facts (same location, same combined service, same total price) rather than inventing a conflicting number; lesson06's wrap-up (60 for a haircut alone, 30 for a beard trim alone) is a clearly separate, second-person ('your appointment') generic price-list scenario, not a restatement of Homayoun's specific bundled visit, so it does not conflict with lesson04/05's stated facts even though the numbers don't sum identically -- a bundled two-service price differing from the sum of two separate single-service prices is realistic, not a bug, and framing keeps it unambiguous either way. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched). Also independently confirmed: this task did NOT open the concurrently-authored fa/a1_unit46_personal_care.yaml noticed in scripts/content_manifest.txt's uncommitted state at task start -- fa and prs are separate realizations per universal_spine.yaml's own explicit invariant ('Farsi and Dari are separate realizations and must never be auto-merged'), and this file's own vocabulary/dialogue/register choices were made entirely independently."

