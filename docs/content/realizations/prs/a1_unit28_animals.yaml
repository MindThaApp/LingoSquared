  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain) were searched for a fetchable lesson-level pets/animals unit this pass; none was found (the Peace Corps Dari course's own table of contents does not include a dedicated animals topic, and general search results referencing an animals section belong to a different Peace Corps language's phrasebook template, not the actual Dari volume) -- disclosed honestly rather than overclaiming source use, same search-and-disclose approach as the unit24/unit26/unit27 precedents. Authored from established prs conventions and vocabulary already taught earlier in this course instead. Dialect terms verified independently via live web search (not just reasoning) during authoring: پشک confirmed as the genuine colloquial Dari/Afghan-Persian word for cat, distinct from Iranian Farsi's گربه (both descend from different Middle Persian roots per etymological sources) -- the exact same class of Dari-vs-Iranian lexical divergence as unit24's موتر/ماشین and unit24's تکت, deliberately reused here since this outcome offers another genuine instance of it. سگ (dog) confirmed as standard, shared Dari/Farsi vocabulary with no divergence risk."
