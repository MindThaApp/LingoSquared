            target: {text: "حیوان خانگی", language_code: prs, direction: rtl}
            introduced_tokens: [خانگی]
            example: {text: "سگ حیوان خانگی من است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit28.lesson01.teach.review_daram_dast
            kind: grammar_note
            target: {text: "دارم (I have) / دارین (you have, formal) / است (is)", language_code: prs, direction: rtl}
