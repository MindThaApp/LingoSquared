review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New unit, prs's next uncovered A1 outcome found by exact-diffing every spine_outcome_id used across all prs realization files against every id: in docs/content/universal_spine.yaml (A1-level outcomes only): universal.a1.animals.describe_pets_animals (prerequisite: universal.a1.preferences.express_preferences [unit14], already realized). This is the earliest unrealized A1 outcome by the spine file's own line order (line 857, immediately after appearance/unit27) among the ones prs has not yet covered -- sports/technology/education/celebrations/household/neighborhood (lines 881-1100) and the newly-added post outcome (appended after neighborhood, line 1103+, also unrealized) all come later in file order and remain unrealized too; transportation (line 905 in the pre-append file) was already realized as unit24, so animals is the genuine next gap, confirmed by re-checking the live spine file (which another session appended a new 'post' outcome to, after neighborhood, while this unit was being authored -- verified the append does not change animals' position or definition before proceeding). Six lessons: animal/pet vocabulary (حیوان, سگ, پشک, پرنده, ماهی, حیوان خانگی), a yes/no pet-ownership exchange (حیوان خانگی دارین؟ / بلی، سگ دارم / نخیر، حیوان خانگی ندارم) reusing the established دارم/دارین/ندارم/بلی/نخیر pattern from unit03's own sibling-count exchange, describing a pet's size and color (رنگ/سیاه/سفید/کوچک/بزرگ, all review from unit15/unit21/unit27), a Homayoun/Zarmina dialogue in the established informal تو/-ی register (تو حیوان خانگی داری؟, matching the precedent set by unit20's رفتی/کردی and unit26's می‌کنی informal forms) that also covers a basic care habit (هر روز به او غذا می‌دهی؟ / بلی، هر روز غذا می‌دهم, satisfying the spine outcome's 'name, age, or care habit' assessment requirement via the care-habit branch), a third-person reading passage continuing the same scenario (زرمینه یک پشک دارد...), and a wrap-up combining two animal facts with اما. Deliberately did NOT introduce a specific pet name (skipping the 'name' branch of the outcome's assessment requirement in favor of the 'care habit' branch, which the feeding exchange already covers) and did NOT introduce the irregular verb pair می‌روم/می‌بینم or any new tense -- kept firmly to already-established دارم/است/می‌دهم(new but a transparent, regular light-verb-adjacent gives-pattern already modeled by unit18's می‌دهد) to avoid a grammar detour this outcome doesn't call for, a deliberate scope decision per AUTHORING_GUIDE.md #1. Every word re-declared via introduced_tokens within THIS file per the standing per-file untaught-vocabulary footgun, even for words taught many units earlier (رنگ/unit21, سیاه/unit21, کوچک/unit15, بزرگ/unit15, بلی/unit03, نخیر/unit03, دارم/دارین/ندارم/unit03, تو/unit01, داری/unit04, چه/unit21, هر/unit24, روز/unit24, است/من/یک/او/و -- all re-declared fresh here). Authored §14/§16/§17/§19-compliant from the start: no listen_type/listen_select/listen_order exercises (zero prs audio exists), every matching_pairs exercise sized 6-8 pairs, zero fill_in_blank, every kind:vocabulary card has a real example sentence built from already-taught words. §12 multi-clause coverage applied to the wrap-up's اما-joined translation exercise (period/comma/no-comma variants). Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file). schema_version 1.1 from the start.

    STATUS: draft, review pending. This file has NOT yet been through the project's mandatory fresh-context review and must not be imported/shipped until that review completes and any findings are fixed. Compiler validation (schema/structure only) was run and is clean, but that is not a substitute for the linguistic/pedagogical review."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-27). The Homayoun/Zarmina dialogue (lesson04)
    uses the informal تو/-ی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 (رفتی/کردی), unit25 (خسته استی), and unit26 (می‌کنی) dialogues.
    پشک (cat) is a genuine, common colloquial Afghan Dari term (not the
    more formal/Iranian گربه) -- the same class of Dari-vs-Iranian lexical
    divergence as موتر/تکت in unit24, verified via web search (see
    generation_provenance). سگ (dog), پرنده (bird), and ماهی (fish) are
    standard, everyday vocabulary shared with Farsi, no divergence risk.

