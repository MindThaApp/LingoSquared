            introduced_tokens: [سگ]
            example: {text: "من سگ دارم.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit28.lesson01.teach.cat_word
            kind: vocabulary
            target: {text: پشک, language_code: prs, direction: rtl}
            introduced_tokens: [پشک]
            example: {text: "من پشک دارم.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit28.lesson01.teach.bird_word
