units:
  - content_key: prs.a2.unit10.opinions
    title: نظر دادن
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.opinions.give_opinions_with_reasons
    planned_lesson_count: 4

    lessons:
      - content_key: prs.a2.unit10.lesson01.opinions_vocabulary
        title: کلمات مربوط به نظر دادن
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: prs.a2.unit10.lesson01.teach.nazar_word
            kind: vocabulary
            target: {text: نظر, language_code: prs, direction: rtl}
            introduced_tokens: [نظر]
          - content_key: prs.a2.unit10.lesson01.teach.dalil_word
            kind: vocabulary
            target: {text: دلیل, language_code: prs, direction: rtl}
            introduced_tokens: [دلیل]
          - content_key: prs.a2.unit10.lesson01.teach.study_word
            kind: vocabulary
            target: {text: تحصیل, language_code: prs, direction: rtl}
            introduced_tokens: [تحصیل]
          - content_key: prs.a2.unit10.lesson01.teach.abroad_word
            kind: vocabulary
            target: {text: خارج, language_code: prs, direction: rtl}
            introduced_tokens: [خارج]
          - content_key: prs.a2.unit10.lesson01.teach.homeland_word
            kind: vocabulary
            target: {text: وطن, language_code: prs, direction: rtl}
            introduced_tokens: [وطن]
          - content_key: prs.a2.unit10.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: prs, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: prs.a2.unit10.lesson01.exercise01.recognize_nazar
            type: multiple_choice
            tested_text: نظر
            prompt: {target_blocks: [{text: نظر, language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit10.lesson01.exercise02.recognize_abroad
            type: multiple_choice
            tested_text: خارج
            prompt: {target_blocks: [{text: خارج, language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit10.lesson01.exercise03.match_opinions_words
            type: matching_pairs
            tested_text: نظر دلیل تحصیل خارج وطن
            prompt: {target_blocks: []}
            pairs:
              - {left: نظر, right: opinion}
              - {left: دلیل, right: reason}
              - {left: تحصیل, right: study}
              - {left: خارج, right: abroad}
              - {left: وطن, right: homeland}
          - content_key: prs.a2.unit10.lesson01.exercise04.order_nazar_dalil
            type: word_order
            tested_text: نظر و دلیل
            prompt: {target_blocks: []}
            word_bank: [نظر, و, دلیل]
          - content_key: prs.a2.unit10.lesson01.exercise05.write_abroad
            type: writing_prompt
            tested_text: خارج
            prompt: {target_blocks: []}

      - content_key: prs.a2.unit10.lesson02.giving_an_opinion
        title: بیان نظر
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: prs.a2.unit10.lesson02.teach.in_my_opinion_better
            kind: phrase
            target: {text: "به نظر من تحصیل در خارج بهتر است.", language_code: prs, direction: rtl}
            introduced_tokens: [به, نظر, من, در, بهتر, است]
          - content_key: prs.a2.unit10.lesson02.teach.because_universities_jobs
            kind: phrase
            target: {text: "چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", language_code: prs, direction: rtl}
            introduced_tokens: [چون, "پوهنتون‌های", فرصت, کار, بیشتر, دارد]
          - content_key: prs.a2.unit10.lesson02.teach.full_opinion_with_reason
            kind: phrase
            target: {text: "به نظر من تحصیل در خارج بهتر است، چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a2.unit10.lesson02.exercise01.recognize_opinion_phrase
            type: multiple_choice
            tested_text: "به نظر من تحصیل در خارج بهتر است"
            prompt: {target_blocks: [{text: "به نظر من تحصیل در خارج بهتر است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit10.lesson02.exercise02.order_because_universities
            type: word_order
            tested_text: "چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد"
            prompt: {target_blocks: []}
            word_bank: [چون, "پوهنتون‌های", بهتر, و, فرصت, کار, بیشتر, دارد]
          - content_key: prs.a2.unit10.lesson02.exercise03.dialogue_response_which_better
            type: dialogue_response
            tested_text: "به نظر من تحصیل در خارج بهتر است چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد"
            prompt: {target_blocks: [{text: "به نظر تو، تحصیل در خارج بهتر است یا در وطن؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit10.lesson02.exercise04.translate_opinion_with_reason
            type: translation
            tested_text: "به نظر من تحصیل در خارج بهتر است، چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد"
            prompt: {target_blocks: []}
          - content_key: prs.a2.unit10.lesson02.exercise05.write_opinion_with_reason
            type: writing_prompt
            tested_text: "به نظر من تحصیل در خارج بهتر است چون پوهنتون‌های بهتر و فرصت کار بیشتر دارد"
            prompt: {target_blocks: []}

      - content_key: prs.a2.unit10.lesson03.reading_an_opinion_message
        title: خواندن پیام حاوی نظر
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: prs.a2.unit10.lesson03.teach.message_word
            kind: vocabulary
            target: {text: پیام, language_code: prs, direction: rtl}
