review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second A2 unit for the prs realization (spine outcome: universal.a2.
    opinions.give_opinions_with_reasons). Own scenario, authored
    independently of the English/Dutch A2 units and of the fa sibling
    realization of this same outcome (not consulted while drafting, per
    AUTHORING_GUIDE §8): two students, پروین and احمد, discuss whether
    it's better to study abroad or to study in Afghanistan -- a
    genuinely current, widely-discussed topic among young Afghans (not
    an invented detail), which naturally produces an opinion-plus-reason
    exchange and a disagreement to respond to, exactly what the spine
    outcome requires. Deliberately a different topic from the fa
    realization's remote-work-vs-office debate, to avoid any structural
    templating even at the topic-choice level. A2-level step-up from
    A1: به نظر من ... چون ... (in my opinion ... because ...), و-joined
    compound reasons, and a polite-disagreement register (من فکر
    نمی‌کنم، ولی...). Every concrete fact (پروین's stated reasons:
    better universities and job opportunities abroad; احمد's stated
    reasons: wants to stay near family, thinks he can help his country
    more by staying) kept consistent across lesson02/03/04 per §11 --
    these are personal opinions, not objective facts, so paraphrase
    across turns is natural conversational variation, not a
    contradiction, and was checked for that distinction specifically.
    Multi-clause accepted_answers lists carry period/comma/و-joined
    forms per §12 where each is grammatically natural (see the matching
    overlay). No fill_in_blank used
    (§13 n/a). No listen_type/listen_select/listen_order or audio-only
    dialogue_comprehension anywhere in this unit per §14 -- every
    exercise has a genuine visible text prompt; a media_assets block is
    declared purely to pre-stage a future recording pass, unreferenced
    by any exercise here. Dialect: continues prs's established Afghan
    Dari register (استم/استی/استند copula family, بلی/نخیر), verified
    against shipped units 01-08, deliberately never Iranian Farsi forms.
    Pending fresh-context review; left unreviewed per AUTHORING_GUIDE §9.
    Fresh-context review completed 2026-07-06 (zero access to sibling fa
    files, per §8): confirmed spine-outcome discipline (all 4 lessons
    genuinely serve universal.a2.opinions.give_opinions_with_reasons, no
    drift), recognition-to-drag-to-production pacing in every lesson,
    zero Arabic-range kaf/yeh codepoints, zero internal-jargon leaks, full
    content_key parity both directions between this file and its
    overlay, and -- via a purpose-written Python script tokenizing on
    Persian-range Unicode only -- zero untaught-vocabulary gaps across
    every exercise's tested_text and the overlay's accepted_answers/
    word_bank/pairs values against cumulative introduced_tokens. Found
    and fixed one real gap: §12 multi-clause coverage was missing the
    period-joined variant on 4 accepted-answer sets (the two
    چون-reason exercises in lesson02 plus lesson04's ولی-concession
    exercise) despite this file's own notes claiming full period/comma/
    و-joined coverage -- added the missing period-joined forms to the
    matching overlay entries (و-joined correctly stays omitted on all
    of these: چون and ولی already carry the joining function, so a
    literal و immediately before either is genuinely ungrammatical, not
    just untested). Also fixed a same-typo "او-joined" (stray الف
    turning و into the pronoun "he/she") in these review notes. Verified
    compile with 0 errors/0 warnings and valid JSON output post-fix.

    POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by
    unit13's fresh-context reviewer flagging the same bug in units 11/12)
    found this file also had exercises where realization prompt.target_blocks
    duplicated the overlay's own instruction text verbatim in English -- the
    compiler would have rendered the same sentence twice to the learner. Fixed
    mechanically: every affected exercise's prompt set to target_blocks: [].
    Re-verified validate+compile clean (0 errors/0 warnings) and confirmed
    zero remaining instruction-duplicate target_blocks via a script comparing
    every exercise's target_blocks against its overlay instruction.

course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: >-
    Neutral-polite spoken Dari register for everyday conversation
    between two students. Introduces به نظر من ... (in my opinion...)
    as an opinion marker, چون for the supporting reason, and a polite
    disagreement form (من فکر نمی‌کنم، ولی...) as the A2-level step up
    from A1's simple preference statements.

