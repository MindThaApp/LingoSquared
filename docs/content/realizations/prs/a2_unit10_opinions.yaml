        exercises:
          - content_key: prs.a2.unit10.lesson03.exercise01.read_her_opinion
            type: reading_comprehension
            tested_text: "تحصیل در خارج خیلی بهتر است"
            prompt: {target_blocks: [{text: "نویسندهٔ این پیام دربارهٔ تحصیل در خارج چه نظری دارد؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit10.lesson03.exercise02.read_her_second_reason
