review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude, zero access to the authoring reasoning). Checked: same-speaker dialogue-distractor rule (no violation -- lesson04's listen_context multiple_choice options are scene-level English glosses, not lines any character actually says), price/rate consistency across the whole unit (100 dollars at 70 afghanis/dollar = 7000 afghanis, stated identically in lesson04/05/06, no contradiction), bare-YAML-boolean grep, Persian-vs-Arabic codepoints, internal-jargon leaks, exercise-type registration, and §19 vocabulary-card examples -- all clean. Found and fixed two real bugs: (1) lesson02/03/04's matching_pairs exercises had only 5 pairs each despite this file's own authoring notes claiming '6+ pairs except lesson01's first-lesson ceiling' -- added a 6th pair to each (یا/or in lesson02, چند/how much in lesson03, می‌خواهم/I want in lesson04) from vocabulary already taught in that same lesson, updated tested_text and the overlay's accepted_answers to match. (2) ALL SIX translation exercises in this unit had a bare 'Translate into Dari.' instruction paired with an empty prompt (target_blocks: []) -- since Translation.tsx renders only prompt.text_blocks, a real learner would see literally nothing indicating what English sentence to translate, an unanswerable-without-already-knowing-it exercise. Confirmed this against the corpus: units 25/27-33 already use the correct 'Translate into Dari: <sentence>.' convention, so this unit and unit24 (fixed separately, out of this file) were the outliers. Rewrote all six instructions to name the specific sentence. Also note for the coordinator: this file's overlay review notes previously described lesson04's dialogue as 'Homayoun voices the صرافی role' -- that is not actually true of the shipped content. The money-exchanger's dialogue turns are labeled with the generic speaker صرافی (money exchanger), never the personal name همایون, so unit23 does NOT establish Homayoun's job as money exchanger; Homayoun is only concretely established as a named character starting unit24. Re-validated clean (0 errors/0 warnings) after all fixes."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy. صرافی (money exchanger) reflects the real, common
    Afghan institution for currency exchange -- distinct from a formal
    بانک (bank) -- and دالر (dollar/USD) is included because USD is
    genuinely widely quoted and used alongside افغانی in everyday Afghan
    currency exchange, not an invented detail.

