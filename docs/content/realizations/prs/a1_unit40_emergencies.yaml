generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Firecrawl was unavailable this session (credits exhausted), so real, direct WebFetch access was used instead. WebFetch on the DLI Dari course's own index page (fsi-languages.yojik.eu/languages/DLI/DLI-Dari.html) confirmed -- as prior units already found for other topics -- that the index lists only semester/lesson-group PDF filenames with no per-lesson topic titles, and a second WebFetch asking specifically about emergency/police/fire/ambulance/help/accident content in the visible index confirmed no filename or title references any of those topics. Per this session's task instructions, three Semester 1 student-textbook PDFs adjacent to already-used ranges were downloaded via curl (DLI-Dari-Semester1-s21-24.pdf, s25-28.pdf, s29-32.pdf) and run through `pdftotext -layout` -- extraction succeeded cleanly on all three (the same working method confirmed for this course's PDFs in unit39's session), yielding real, searchable Dari/English text. None of the three lesson ranges contains a dedicated emergency-reporting lesson or dialogue (lessons 29-32's police content is a traffic-stop/vehicle-search scenario, not a citizen reporting an emergency), but their shared cumulative course glossary (repeated near-identically across all three books) was searched and found to genuinely contain: امبولانس (ambulance), کمک (help, already an established review word from unit07), the full sentence می‌تانین مه ره کمک کنین؟ (Can you help me?, used directly in lesson02 below), شفاخانه/شفاخانهء مرکزی (hospital/central hospital, already established review words from units 05 and 18), پولیس (police/policeman, appeared with two different Yeh-codepoint OCR renderings across the PDFs -- standard Persian-range codepoints used here per AUTHORING_GUIDE.md #3), مامموریت پولیس (police station, not used in this unit -- it appeared only inside the more advanced traffic-stop scenario, out of scope for an A1 unit), and زخمی / مجروح (injured, two real synonyms -- زخمی was chosen as the primary taught word) plus خون‌ریزی (bleeding). Genuinely NOT found anywhere in the located glossary or lesson text: a word for fire or fire brigade, or any dedicated emergency-reporting dialogue/scenario. آتش (fire) and اطفائیه (fire brigade) are therefore authored from established standard Afghan Dari usage (اطفائیه is the everyday Kabul term for the fire department, e.g. in local news coverage), NOT sourced from the located DLI material -- flagged here honestly, the same way unit24's موتر/تکت and unit39's خزان register choices were flagged. This unit's scenario, dialogue, and reading passage are authored fresh from already-established in-course conventions (unit07's می‌تانین/کمک/تلفن, unit17's می‌خواهم/دارم, unit12's زود, unit32's می‌آید/تشکر زیاد, unit29/unit18/unit30's می‌کند, unit24's شهر, unit03's نفر, and the established Homayoun/Zarmina dialogue throughline from units 20/21/22/25/27/37/38/39), extended with the new vocabulary above, modernized current spoken Kabul Dari register throughout, not a translation of any single source."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's realization. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans; no internal-jargon/snake_case leaks in learner-facing options/distractors/pairs; all matching_pairs exercises have 6-12 pairs per AUTHORING_GUIDE.md #16; all exercise types used (multiple_choice/matching_pairs/word_order/translation/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx; no listen_select/dialogue_response/other audio-dependent exercises exist (correctly following AUTHORING_GUIDE.md #14's prs no-TTS restriction, so the nl-unit44-50-style same-speaker-distractor bug class does not apply here -- this unit's multiple_choice exercises are pure text-translation recognition, not audio clip identification); every dialogue teaching-card title matches its own gloss exactly; cross-lesson facts (prices, times, character preferences, item colors/locations) are consistent everywhere referenced within the unit. Dari register/grammar read as sound, consistent Kabul Dari throughout, matching this course's established استم/استین uncontracted register and Afghan-not-Iranian vocabulary choices."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-39). This unit's core sentences are mostly
    urgent 1st-person statements (می‌خواهم), 3rd-person state descriptions
    (است/دارد/می‌کند/می‌آید), and plain polite imperatives (زنگ بزنین/
    بیایین/کنین) rather than 2nd-person conjugated forms -- an emergency
    exclamation or command doesn't need to pick تو vs شما the way a
    conversational question does, so none is forced in artificially. The
    Homayoun/Zarmina dialogue (lesson04) continues their established
    informal تو-register friendship from units 20/21/22/25/27/37/38/39,
    but (matching that same precedent) uses no 2nd-person verb forms at
    all -- only 1st-person می‌خواهم/زنگ می‌زنم and 3rd-person است/دارد/
    می‌آید, since an emergency exchange here is interjections and
    statements, not a question to the other person. اطفائیه (fire
    brigade) is a deliberate Afghan-Dari-specific vocabulary choice
    (the everyday Kabul term), not sourced from the DLI material located
    this session -- flagged the same way unit24's موتر/تکت and unit39's
    خزان register choices were flagged.

