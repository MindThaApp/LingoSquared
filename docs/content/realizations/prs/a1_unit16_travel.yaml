            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit16.lesson02.exercise01.recognize_herat
            type: multiple_choice
            tested_text: هرات
            prompt: {target_blocks: [{text: هرات, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit16.lesson02.exercise02.recognize_mikhaham
            type: multiple_choice
            tested_text: "می‌خواهم"
            prompt: {target_blocks: [{text: "می‌خواهم", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit16.lesson02.exercise03.match_ticket_vocab
            type: matching_pairs
            tested_text: "بلیط قطار هرات می‌خواهم به"
            prompt: {target_blocks: []}
            pairs:
