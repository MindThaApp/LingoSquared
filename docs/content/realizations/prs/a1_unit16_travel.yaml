              - {left: هرات, right: Herat}
              - {left: "می‌خواهم", right: "I want"}
              - {left: به, right: to}
              - {left: بس, right: bus}
          - content_key: prs.a1.unit16.lesson02.exercise04.word_order_belit_be_herat
            type: word_order
            tested_text: "یک بلیط به هرات می‌خواهم"
