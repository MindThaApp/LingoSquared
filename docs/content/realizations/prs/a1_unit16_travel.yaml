  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered outcome (universal.a1.travel.handle_basic_journey, prerequisites: numbers/unit04, time/unit11, directions/unit06, all already covered). Six lessons: basic travel vocabulary (بلیط/قطار/بس/میدان هوایی -- reusing unit05's established Afghan Dari میدان هوایی for airport, not Iranian فرودگاه), buying a ticket, asking about departure time and platform, reading a short schedule, a dialogue at the ticket counter, and confirming travel plans with تشکر زیاد/قابلی نداره/سفر خوش (all three already established in unit05/unit06's own reviewed dialogues). Uses full, uncontracted forms throughout (می‌خواهم not می‌خوام, حرکت می‌کند not می‌کنه, بسیار خوب not باشه), consistent with the established استم/استین full-form register policy from units 01-15. understand_travel_announcement's own success_criteria calls for listening 'without transcript-first support' -- since prs has zero working TTS/recorded audio, this unit follows the established read-substituting-for-listening pattern already used for the same reason in units 09/11/12/13/14/15. Authored independently of the fa realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6 pairs except lesson01's genuine 4-pair first-lesson ceiling, and zero fill_in_blank exercises. Learning proactively from the fa sibling unit's own authoring process (a validation error there caught یک/از/دو/سکوی needing early introduction), this unit teaches those same grammar tokens in lesson01 from the start. Multi-clause exercises include period-joined, comma-joined, and و-joined accepted variants per §12, and open-ended production exercises carry multiple accepted variants from the start. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-07 (zero prior context, fa sibling files never opened). Verified against universal.a1.travel.handle_basic_journey's own can_do/prerequisites/assessment_requirements in universal_spine.yaml -- all 4 covered (understand_travel_announcement via lesson04/05's reading_comprehension/dialogue_comprehension, read-substituting-for-listening per the established zero-prs-audio §14 pattern; request_travel_information via the translation/word_order/dialogue_response production exercises; read_ticket_schedule via the reading_comprehension exercises; write_travel_request via the writing_prompt exercises), every lesson genuinely serves the declared outcome. Exercise pacing (recognition -> drag/matching -> production) confirmed in all 6 lessons. §14 verified true by grep: zero listen_type/listen_select/listen_order anywhere. §16 verified: lesson01's matching_pairs is a genuine 4-pair ceiling (no earlier unit16 vocabulary to pool from), lessons02-06 all exactly 6 pairs. §17 verified true by grep (zero fill_in_blank) and by manually auditing every translation/dialogue_response/writing_prompt's accepted_answers, especially lesson04.exercise05 (write_own_travel_detail, 4 genuine variants covering time-only/platform-only/both, matching its 'and/or' instruction) and lesson06.exercise05 (write_travel_summary, see fix below) -- confirmed via direct code read of grade()/is_multi_answer_response() in backend/app/api/router.py that the generic accepted-list path checks every entry. Vocabulary independently checked: بلیط/قطار/میدان هوایی/سکو/حرکت می‌کند/کی/می‌خواهم/بسیار خوب all confirmed natural, correct, idiomatic Dari for this register; بس cross-checked as genuine common Afghan Dari usage for bus, not fabricated; یک بلیط به هرات می‌خواهم confirmed natural word order; سکوی دو confirmed correctly formed ezafe (سکو + -ی + دو); از confirmed used only as 'from' throughout this file (no 'than' ambiguity, that usage is confined to the separate comparisons unit); هرات confirmed a real, appropriate major Afghan destination city. Directly cross-checked میدان هوایی/تشکر زیاد/قابلی نداره/سفر خوش against a1_unit05_places.yaml/a1_unit06_directions.yaml's own reviewed dialogues -- all four genuinely reused, not merely claimed. Register cross-checked against the most recently reviewed units (14/15): full uncontracted verb forms and formal register consistent throughout, no colloquial contractions. Script purity clean (zero Arabic-range kaf/yeh codepoints, checked programmatically). No jargon leaks (checked programmatically against every learner-facing overlay string). Wrote and ran a real recursive yaml.safe_load-based Python script checking every dict value in both files for a stray Python bool -- found only the two legitimate schema booleans (human_reviewed, target_language_first). Wrote and ran a real Python script comparing every exercise's realization prompt.target_blocks (language_code: en) against that exercise's overlay instruction field -- zero duplicate-instruction-text matches found. Wrote and ran a ZWNJ-aware, Persian-punctuation-stripping Python tokenizer checking every tested_text/prompt.target_blocks(prs)/pairs.left/word_bank value and every overlay accepted_answers/correct_option/distractors Dari-script value against cumulative file-scoped introduced_tokens. FOUND AND FIXED a real untaught-vocabulary bug: lesson06.exercise05's (write_travel_summary) و-joined accepted-answer variant used و without it ever being taught in this file -- every other prs unit that uses و for multi-clause joining (units 01/04/05/07/08/09/10/11/12/13/14/15/17) explicitly introduces it via its own introduced_tokens; added a new lesson06 grammar_note teaching card (و, and) with introduced_tokens: [و] in both files, re-ran the tokenizer script afterward and confirmed zero remaining violations. FOUND AND FIXED a real §12/§11 completeness gap: write_travel_summary's period-joined accepted-answer variant ('قطار به هرات فردا صبح حرکت می‌کند. از سکوی دو حرکت می‌کند') silently dropped the ساعت هشت (eight o'clock) detail that the other three punctuation variants and the exercise's own instruction (destination + time + platform) all include -- fixed by adding ساعت هشت into the first sentence so all four accepted variants now carry the same complete fact set. Cross-checked §11 facts (Herat, tomorrow morning, 8am, platform two) across lesson04's schedule text, lesson05's dialogue, and lesson06's summary exercise -- fully consistent everywhere, including the media_assets audio text. Confirmed content_key parity exact both directions (1 unit/6 lessons/27 teaching/30 exercises each side, after the و teaching-card addition). Confirmed all 8 exercise types used (multiple_choice/matching_pairs/translation/word_order/reading_comprehension/dialogue_comprehension/dialogue_response/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx. Checked every multiple_choice/reading_comprehension/dialogue_comprehension exercise for the prompt-shows-answer bug -- all correct_option/distractors are English glosses against Dari-script prompts, no same-script leakage. A1-complexity judged appropriate (short phrases, 3rd-person-only verb forms, familiar vocabulary). Re-ran validate and compile (not just validate) as the final check after both fixes: 0 errors/0 warnings, compile output valid JSON, all 30 exercises' compiled correct_response non-empty, and write_travel_summary's compiled accepted list directly inspected to confirm all 4 variants now carry the complete fact set.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 10 kind:vocabulary teaching cards, each a natural, comprehensible-from-gloss sentence built from vocabulary already taught in this same lesson or earlier in this file/course (e.g. sekoo_word's example reuses حرکت می‌کند from the same lesson03's own grammar_note card; sobh_word's example reuses ساعت هشت from the same lesson04's schedule_text card). Avoided forward-referencing later-lesson vocabulary (e.g. belit_word/qatar_word/bas_word/maidan_hawayi_word's examples in lesson01 use the established خوب است/دارم constructs from earlier units rather than lesson02's می‌خواهم or lesson03's حرکت می‌کند). schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    MATCHING_PAIRS §16 FOLLOW-UP, 2026-08-05: this file's own prior review called lesson01.exercise03.match_travel_vocab's 4-pair size 'a genuine 4-pair first-lesson ceiling' -- that check only looked within this file; units 01 (greetings), 02 (introductions), and 06 (directions), all earlier-numbered A1 units, supply on-topic vocabulary for a travel exercise. Expanded 4->8 pairs, pooling کابل (Kabul, unit01), هرات (Herat, unit02), چپ (left, unit06), and راست (right, unit06). Overlay accepted_answers synced. Re-ran validate+compile clean (0 errors/0 warnings)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    full, uncontracted verb forms (می‌خواهم، حرکت می‌کند، بسیار خوب),
    consistent with units 01-15. Reuses تشکر زیاد/قابلی نداره/سفر خوش,
    already established in unit05/unit06.

media_assets:
  - content_key: prs.a1.audio.travel.ticket.01
    language: prs
    text: "یک بلیط به هرات می‌خواهم"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: prs.a1.audio.dialogue.travel.01
    language: prs
    text: "مسافر: یک بلیط به هرات می‌خواهم. فروشنده: کی می‌خواهین بروین؟ مسافر: فردا صبح. فروشنده: بسیار خوب، قطار ساعت هشت صبح از سکوی دو حرکت می‌کند."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: prs.a1.unit16.travel
    title: سفر
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.travel.handle_basic_journey
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit16.lesson01.basic_travel_vocab
        title: واژه‌های سفر
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: prs.a1.unit16.lesson01.teach.belit_word
            kind: vocabulary
            target: {text: بلیط, language_code: prs, direction: rtl}
            introduced_tokens: [بلیط]
            example: {text: "یک بلیط دارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit16.lesson01.teach.qatar_word
            kind: vocabulary
            target: {text: قطار, language_code: prs, direction: rtl}
            introduced_tokens: [قطار]
            example: {text: "قطار خوب است", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit16.lesson01.teach.bas_word
            kind: vocabulary
            target: {text: بس, language_code: prs, direction: rtl}
            introduced_tokens: [بس]
            example: {text: "بس خوب است", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit16.lesson01.teach.maidan_hawayi_word
            kind: vocabulary
            target: {text: "میدان هوایی", language_code: prs, direction: rtl}
            introduced_tokens: [میدان, هوایی]
            example: {text: "میدان هوایی خوب است", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit16.lesson01.teach.yak_word
            kind: grammar_note
            target: {text: "یک (a/one)", language_code: prs, direction: rtl}
            introduced_tokens: [یک]
          - content_key: prs.a1.unit16.lesson01.teach.az_word
            kind: grammar_note
            target: {text: "از (from)", language_code: prs, direction: rtl}
            introduced_tokens: [از]
          - content_key: prs.a1.unit16.lesson01.teach.doo_word
            kind: vocabulary
            target: {text: دو, language_code: prs, direction: rtl}
            introduced_tokens: [دو]
            example: {text: "دو بلیط دارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit16.lesson01.teach.sekooye_word
            kind: grammar_note
            target: {text: "سکوی دو (platform two)", language_code: prs, direction: rtl}
            introduced_tokens: [سکوی]
        exercises:
          - content_key: prs.a1.unit16.lesson01.exercise01.recognize_belit
            type: multiple_choice
            tested_text: بلیط
            prompt: {target_blocks: [{text: بلیط, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit16.lesson01.exercise02.recognize_qatar
            type: multiple_choice
            tested_text: قطار
            prompt: {target_blocks: [{text: قطار, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit16.lesson01.exercise03.match_travel_vocab
            type: matching_pairs
            tested_text: "بلیط قطار بس میدان هوایی"
            prompt: {target_blocks: []}
            pairs:
              - {left: بلیط, right: ticket}
              - {left: قطار, right: train}
              - {left: بس, right: bus}
              - {left: "میدان هوایی", right: airport}
              - {left: کابل, right: Kabul}
              - {left: هرات, right: Herat}
              - {left: چپ, right: left}
              - {left: راست, right: right}
          - content_key: prs.a1.unit16.lesson01.exercise04.translate_a_train_ticket
            type: translation
            tested_text: "یک بلیط قطار"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit16.lesson01.exercise05.translate_the_airport
            type: translation
            tested_text: "میدان هوایی"
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit16.lesson02.buying_a_ticket
        title: خریدن بلیط
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: prs.a1.unit16.lesson02.teach.herat_word
            kind: vocabulary
            target: {text: هرات, language_code: prs, direction: rtl}
