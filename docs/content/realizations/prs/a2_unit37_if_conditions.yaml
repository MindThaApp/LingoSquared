review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block D unit D4), realizing universal.a2.conditions.talk_about_real_conditions. Grammar target: real (open) conditions only. اگر plus the subjunctive in the condition (اگر هوا خوب باشد، اگر باران ببارد، اگر دوستم بیاید، اگر وقت داشته باشم), or the plain present for a state true now (اگر وقت داری، اگر سردت است); the main clause is the plain present with می‌ (which also covers the future: به پارک می‌روم, تیلفون می‌کنم) or an imperative (چتر بگیر، بیا، تیلفون کن، بیایین). Negative conditions (نروم، نیایم، نباشد، نبارد، نداشته باشین) and negative main clauses (نمی‌روم، نمی‌توانیم). No unreal conditionals (B1 keeps them), no خواهم future, no progressive, no perfect, no clitics. The subjunctive is re-taught here from scratch (ب- plus present stem, six endings, باشم paradigm, داشته باشم, ن- negative, imperative) because the other new units are written in parallel. Eleven real grammar_note cards (اگر pattern, subjunctive of رفتن, other verbs and آمدن, بودن/داشتن, negative, imperative, negative imperative, present for a current state, modal می‌توانم paradigm, shop rules with اگر, the negative shop rule). Lesson arc: L01 weather plans and the first اگر sentences; L02 more verbs, having time or money, negatives, plans with friends; L03 commands after اگر and the present for a current state; L04 shop policies (کالا, مشتری, رسید, عوض کردن, پس دادن, می‌توانیم); L05 reading (shop notice) plus transcript-shown listening (dialogue 1, weather plans); L06 shop dialogue (dialogue 2) and mixed plus culminating production. Spine: reading notice, listening as dialogue_comprehension with the full transcript in the prompt (prs has no TTS, no listen_type or dictation), speaking and writing as typed dialogue_response and writing_prompt; the culminating writing_prompt needs one weather condition and one shop condition. Characters: new one-off names زینب and شاهین (friends, informal تو register, dialogue 1: Shahin plans the park and football at ten if the weather is good and stays home if it rains; Zeynab comes if she has time, Shahin asks her to phone if she is late, Zeynab phones if it rains) and فریبا with a shop assistant (polite -ین register, dialogue 2: Fariba bought a broken umbrella yesterday, has the receipt, the shop exchanges it, and would refund if she does not want another; she takes another umbrella). None of these names occurred in docs/content/realizations/prs or overlays/en-prs at authoring time; the sibling new units were not visible, so a final collision grep across the merged tree is advisable. The shop notice is consistent with dialogue 2 (receipt means exchange within seven days, broken means refund, no receipt means no exchange). Binding rulings applied: Kabuli lexicon (دوکان, تیلفون), copula است/استم, 2pl -ین everywhere (the -ید forms are NOT listed as accepted answers because check_dari_register flags them and the grader''s distance-1 typo tolerance already accepts them for باشین/بیایین/می‌توانین), modal می‌توانم forms with ZWNJ, no ازش or similar, تیلفون کردن standard. Every multi-clause typed answer enumerates the comma, no-comma and swapped-clause forms (AUTHORING_GUIDE section 12). No listen_type, dictation or audio-only item. matching_pairs have 9 to 10 pairs with lefts distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Is اگر plus the subjunctive the natural default for possible future conditions (اگر باران ببارد، در خانه می‌مانم), and is the plain present in the condition natural for a state true now (اگر وقت داری، بیا؛ اگر سردت است)? Recommend: yes to both. (2) Is اگر وقت داشته باشم the natural way to say if I have time, and is the main clause می‌آیم natural for a future plan? Recommend: yes. (3) Is اگر برف ببارد natural for if it snows, with اگر برف بیاید as an alternative? Recommend: keep ببارد, accept بیاید. (4) Spelling دوکان versus دکان for shop (the course elsewhere uses دوکان). Recommend: keep دوکان. (5) Shop vocabulary: رسید for a receipt, عوض کردن for to exchange, پس دادن for to refund, کالا for goods, مشتریان in the notice (unit 18 raised the same words). Recommend: keep. (6) Is اگر رسید همراه‌تان باشد، می‌توانیم آن را عوض کنیم natural shop talk, and اگر تا هفت روز بیاورین for within seven days? Recommend: keep. (7) Is سردت است natural for you are cold (versus سردت شده/سرما می‌خوری)? Recommend: keep, and is the mention of سردم است correct? (8) Commands: بیا/بیایین, بپوش/بپوشین, بگیر/بگیرین, تیلفون کن/تیلفون کنین and negative نرو/نروین, نیا/نیایین, نکن/نکنین. Recommend: confirm. (9) Is بلی، رسید این است natural for yes, here is the receipt? Recommend: keep. (10) Is ساعت چند می‌روین؟ natural for the plural you, and is the opening ببخشین natural for a customer? Recommend: keep. (11) آخر هفته for the weekend in Afghanistan (Friday and Saturday are the usual days off); should the example mention جمعه instead? Recommend: keep آخر هفته. (12) Is هوا the natural word for weather (as in هوا سرد است)? Recommend: yes.'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین, no Tehrani colloquialisms. Friend dialogue between زینب and شاهین uses the informal تو-register; the shop dialogue between فریبا and the shop assistant uses the polite -ین register. Real conditions only: اگر plus the subjunctive (باشد، ببارد، برود) or, for a state true now, the plain present (اگر وقت داری); main clause in the plain present with می‌ (also for the future) or an imperative (بگیر، بیایین). Modal می‌توانم with ZWNJ. No unreal conditionals, no خواهم future.'
