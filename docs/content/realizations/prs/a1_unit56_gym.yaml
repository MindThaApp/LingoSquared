generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl (`firecrawl search`) was retried fresh for this unit and again returned no usable result (credits exhausted, matching every recent unit's status this session). Before falling back to established-conventions-only authoring, the already-downloaded DLI Dari corpus cached in this session's own scratchpad (`/private/tmp/claude-502/.../scratchpad/dli_search/*.txt`, `dli/*.txt`, `dli2/*.txt`, `dli_bike_search/*.txt`, plus `.firecrawl/dli-dari-*.txt`) was searched fresh via English-keyword and Dari-script greps for gym/membership/locker/equipment/weight/class vocabulary -- and this time found real, substantial, repeated attestation, a stronger sourcing position than several recent units. DLI Semester 1 Lesson 22 ('At the Information Desk', found across s21-24.txt/s25-28.txt/s29-32.txt/s33-36.txt/s37-40.txt -- the same lesson recurs verbatim across the semester's cumulative PDF exports, not five independent attestations) is a real scenario about a student named Mahnaz getting a membership card at a cultural center, and its own lesson vocabulary list directly glosses عضویت as 'membership' and کارت عضویت as 'membership card', with real worked sentences ('مهناز باید اولاً کارت عضویت مرکز فرهنگی را بگیرد' -- 'Mahnaz must get the membership card of the Cultural Center first.', and 'آنها شاید کورس های انگلیسی داشته باشند' -- 'They may have English classes.', which also confirms کورس as the DLI-attested word for 'course/class', applied in this unit to a gym exercise class rather than an English class -- a legitimate semantic extension of the same real word, not an invented sense). Two more real, independently attested finds: الماری, glossed 'locker / closet / cabinet' (s29-32.txt/s33-36.txt/s37-40.txt, with a real worked example about a locker between two beds), used here in preference to inventing an unattested loanword; and equipment itself, glossed identically across s33-36.txt/s37-40.txt as تجهیزات = وسایل = لوازم -- confirming وسایل (this course's own already-established household-items word from unit19's own lesson title) as a genuinely DLI-attested translation of 'equipment', not just an assumed synonym. 'Gym' itself was also found once, in a Performance Checks phrase list (`dli_bike_search/perf_checks.txt`, also duplicated in `S3_Book2.txt`) translating 'Direct me to the nearest gym' as 'به نزدیکترین ورزشگاه' -- ورزشگاه (varzeshgah, literally ورزش+گاه, 'sport-place') is a real, DLI-attested word for gym/stadium, but this course's own unit29 (sports) already established و taught باشگاه with the explicit gloss 'gym or sports club', so per AUTHORING_GUIDE.md's dialect-consistency discipline (reuse this course's own prior vocabulary decisions rather than switching to a newly-found synonym mid-course) باشگاه is reused here as review, not replaced -- ورزشگاه is disclosed for completeness but deliberately not adopted. Five new content words this unit, three DLI-attested (عضویت, وسایل confirmed via the equipment gloss cross-check even though it was already established, الماری), one DLI-attested but sense-extended (کورس, class/course -> gym class), and one built by established in-corpus pattern rather than direct source attestation: ماهانه (monthly), formed by the same -انه adverbial suffix this course's own unit48 already used to coin روزانه (daily) -- an established-conventions extension of a real precedent, not a fresh invention. No new grammar beyond ordinary recombination of already-taught patterns: می‌خواهم X بگیرم (unit42/unit43/unit48's own established 'I want to get X' pattern), گرفت (3rd-person past 'got/took', unit23), دارد (3rd-person 'has', unit03/unit04/unit14/unit19/unit21), and ساعت چند (unit42's own established 'what time' question shape) are all reused, not reintroduced."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude): found and fixed ONE real bug -- lesson02.exercise07.write_day_pass_price's realization tested_text was truncated to \"کارت روزانه صد افغانی\" (missing است), inconsistent with the overlay's own instruction/accepted_answers, which both correctly include است (\"کارت روزانه صد افغانی است\"). Since the compiler's untaught-vocabulary check runs against tested_text (not accepted_answers), this was a documentation/consistency gap, not a live grading bug -- fixed by adding است to the realization's tested_text so it matches what the exercise actually requires the learner to produce. Everything else in this unit checked clean against the full checklist (same-speaker-distractor risk, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, exercise-type registration). No listen_select/listen_type/dialogue_comprehension exercises exist in this file, so the same-speaker-distractor bug class doesn't structurally arise (every multiple_choice item shows literal Dari text, not audio). Re-validated clean after the fix: 0 errors/0 warnings standalone and as part of the full en-prs A1 corpus. Re-verified against the file's own original self-report below, which is otherwise accurate. New en-prs A1 unit after unit55 (park). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.gym.join_a_gym as the next unrealized A1 outcome, immediately after park (line 1629, right after park's own line 1604). Both listed prerequisites -- universal.a1.sports.talk_about_sports_exercise [unit29] and universal.a1.appointments.make_simple_appointment [unit42] -- are already realized in prs. Matches all four of the outcome's own assessment_requirements: understand_gym_information (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14, testing lesson02's day-pass price and lesson03/lesson04's class time), request_gym_membership (speaking substituted the same way this whole corpus substitutes it -- production exercises across lesson01/02/04's membership-card and locker requests), read_gym_schedule (lesson03's class-time phrase and lesson06's price-list contrast, pure recombination reading), and write_gym_message (writing_prompt exercises across all six lessons). Six lessons, matching bike_rental/park's own 6-lesson shape (this outcome's own can_do names four distinct sub-tasks -- membership/day pass, equipment, class, workout -- backed by two prerequisites rather than one, justifying the fuller shape over the 5-lesson museum/cinema/concert precedent): gym-and-equipment vocabulary (باشگاه reviewed from unit29 with its own explicit 'gym or sports club' gloss; عضویت, وسایل new, both DLI-attested -- see generation_provenance), asking about a membership card and the day-pass price (pure recombination of کارت/unit23, روزانه/unit48, چند/افغانی/صد/multiple earlier units, بگیرم/unit42-43-48, no new vocabulary in this lesson, matching the established precedent that a price-asking lesson doesn't always need fresh vocabulary of its own), class-time and locker vocabulary (کورس, الماری new, both DLI-attested), a Homayoun/کارمند باشگاه gym-reception dialogue combining all of lessons 01-03's vocabulary (no new vocabulary, pure recombination, matching bike_rental's own lesson04 precedent), a third-person reading passage recapping the same dialogue's facts (گرفت reviewed from unit23, دارد reviewed from unit03/unit04/unit14/unit19/unit21, no new grammar), and a wrap-up contrasting the day-pass price with a monthly-membership price using اما plus a formal تان-suffixed membership question (ماهانه new, formed by unit48's own established -انه adverbial-suffix precedent for روزانه; مبلغ کنتراست deliberately uses a different, larger figure -- یک هزار افغانی -- for the monthly price than the stated صد-افغانی day-pass price, both already-established number words with no new numeral introduced, avoiding any AUTHORING_GUIDE.md #11 arithmetic-consistency risk since 1000 is not stated or implied to be a simple multiple of 100 anywhere, it is presented as two independent, never-combined price facts exactly like unit48's own 50-vs-90 wrap-up precedent). Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit48/unit55's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در از multiple earlier units، باشگاه از unit29، کارت از unit23، روزانه از unit48، چند/افغانی/صد از unit04/unit10/unit23، هزار از unit23، یک از multiple earlier units، می‌خواهم/بگیرم از unit42/unit43/unit48، بسیار خوب از unit01/unit09/unit10/unit40/unit46/unit47/unit48، سلام/بفرمایین/تشکر زیاد/روز خوش از multiple earlier units، برای از unit42، ساعت/چند از unit42، پنج از unit04، او/رفت/دارد از multiple earlier units، گرفت از unit23، اما از unit33/unit39-55. Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit41/unit47-55's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The wrap-up's اما-joined contrast sentence (lesson06 exercise06's write target) uses a single canonical comma-اما form only (with/without a trailing period, both accepted), matching unit33/39-55's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise here -- confirmed by explicit review, no other multi-clause translate/write target exists in this unit. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md #13/#17 don't arise either. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's dialogue lines and their speakers (همایون: 3 lines -- want-membership-card / ask-class-time / ask-locker; کارمند باشگاه: 3 lines -- day-pass-price / class-time-answer / closing) were listed and cross-checked by hand before finalizing any multiple_choice distractor, applying the standing same-speaker-distractor rule to text-based recognition items too, not just audio ones. A first draft of lesson04's exercise02/exercise03 (both testing a کارمند باشگاه line) initially drew a distractor from ANOTHER کارمند باشگاه line -- caught on this exact re-check, not shipped -- and was fixed by re-drawing every distractor for a کارمند باشگاه-spoken tested line exclusively from همایون's three lines (and vice versa), so no exercise in this lesson now has a distractor spoken by the same character as its tested line. Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (عضویت, وسایل, کورس, الماری, ماهانه) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: the day-pass price (کارت روزانه صد افغانی است) is stated identically in lesson02 and restated identically (not contradicted) in lesson06's wrap-up; the class time (کورس ساعت پنج است) is stated identically in lesson03 and lesson04; the monthly-membership price (یک هزار افغانی) appears only once, in lesson06, and is never combined arithmetically with the day-pass figure. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched).\n\nReview 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in the overlay). NATIVE FLAGS: see overlay. Follow-up: English side of the سلام، بفرمایین matching pair changed to Hello, welcome (same as the overlay). Owner follow-up 2026-10-20: register_policy metadata spelling دکاندار changed to دوکاندار."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-55). Lesson04's dialogue introduces a
    کارمند باشگاه (gym staff) role opposite the established Homayoun
    character, reusing the same polite-service register unit08's/
    unit10's دوکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل,
    unit46's دواساز, unit47's دلاک, and unit48's دوکاندار exchanges
    already established -- not the informal-تو Zarmina friendship
    register, since a gym-reception exchange is a service-counter
    interaction. Lesson05's reading passage uses a 3rd-person statement
    naming همایون explicitly in its first sentence, then او in the
    following sentences, matching unit27/unit41/unit47-55's own
    reading-passage precedent, and lesson06's wrap-up uses the same
    formal شما-تان-suffixed question pattern unit39-55 already
    established.

