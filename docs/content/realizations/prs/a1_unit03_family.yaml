        spine_outcome_id: universal.a1.family.describe_relationships
        teaching:
          - content_key: prs.a1.unit03.lesson01.teach.mother
            kind: vocabulary
            target: {text: مادر, language_code: prs, direction: rtl}
            introduced_tokens: [مادر]
            example: {text: "مادر من مهربان است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit03.lesson01.teach.father
            kind: vocabulary
            target: {text: پدر, language_code: prs, direction: rtl}
            introduced_tokens: [پدر]
            example: {text: "پدر من داکتر است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit03.lesson01.teach.brother
            kind: vocabulary
            target: {text: برادر, language_code: prs, direction: rtl}
            introduced_tokens: [برادر]
            example: {text: "من یک برادر دارم.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit03.lesson01.teach.sister
            kind: vocabulary
            target: {text: خواهر, language_code: prs, direction: rtl}
            introduced_tokens: [خواهر]
            example: {text: "خواهر من معلم است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit03.lesson01.teach.parents
            kind: vocabulary
            target: {text: پدر و مادر, language_code: prs, direction: rtl}
            introduced_tokens: [پدر, و, مادر]
            example: {text: "پدر و مادر من در کابل زندگی می‌کنند.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit03.lesson01.teach.my_mother
            kind: phrase
            target: {text: این مادرم است, language_code: prs, direction: rtl}
            introduced_tokens: [این, من, او, مادرم, برادرم, خواهرم, است]
        exercises:
          - content_key: prs.a1.unit03.lesson01.exercise01.recognize_mother
            type: multiple_choice
            tested_text: مادر
            prompt: {target_blocks: [{text: مادر, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit03.lesson01.exercise02.recognize_siblings
            type: multiple_choice
            tested_text: برادر خواهر
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit03.lesson01.exercise03.match_immediate
            type: matching_pairs
            tested_text: مادر پدر برادر خواهر
            prompt: {target_blocks: []}
            pairs:
              - {left: مادر, right: mother}
              - {left: پدر, right: father}
              - {left: برادر, right: brother}
              - {left: خواهر, right: sister}
          - content_key: prs.a1.unit03.lesson01.exercise04.order_parents
            type: word_order
            tested_text: پدر و مادر
            prompt: {target_blocks: []}
            word_bank: [پدر, و, مادر]
          - content_key: prs.a1.unit03.lesson01.exercise05.translate_this_is_mother
            type: translation
            tested_text: این مادرم است
            prompt: {target_blocks: [{text: "This is my mother.", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit03.lesson01.exercise06.translate_sister
