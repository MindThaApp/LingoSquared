course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Teach respectful Afghan Dari forms first, including استم، استین and دارین.
    Use فامیل for family and شوهر for husband, and preserve the distinct
    paternal and maternal kinship terms کاکا، عمه، ماما and خاله. Introduce
    informal singular forms only in an explicit close-friend context. Write
    possessive clitics with a ZWNJ, as in مادرم and فامیل‌تان, while accepting
    common spaced keyboard variants in production exercises.

