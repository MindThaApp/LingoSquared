ialogue_comprehension exercise after that lesson's matching_pairs exercise -- the same guide-taxonomy ambiguity already accepted in unit18's review) -- not fixed, matching the prior unit's precedent that this is a guide gap, not a violation. No other issues found. Recommends review: status: reviewed, which this file now reflects.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 16 kind:vocabulary teaching cards (1 merged card -- the names list -- given a positionally-matched list of examples), each a natural, comprehensible-from-gloss sentence built from vocabulary already taught in this same lesson or earlier in this file (e.g. near_word's example reuses میز/کلکین from the same lesson02, one lesson earlier). The names card's example uses the well-established استم copula, matching units 12-18's own precedent. schema_version bumped to 1.1.

    2026-07-10 second fresh-context pass (Claude), specifically re-reviewing the §19 example/example_gloss retrofit the prior review sign-off had not yet covered (this file's notes had said 'pending fresh-context review' on that specific addition). Checked every one of the 16 examples individually: each is a natural, comprehensible-from-gloss sentence, genuinely contains the card's own word in its exact surface form, is built from vocabulary already taught in the same lesson or earlier in this unit, and its example_gloss on the paired overlay matches. No issues found in the examples themselves. While re-running the full standard checklist alongside this (same-speaker dialogue distractors, stray YAML booleans, script purity, matching_pairs/word_order answer shape, exercise-type registration, §11 cross-lesson fact consistency, §12 multi-clause boundary coverage, jargon leaks) nothing new was found beyond what the prior review already covered -- this unit remains clean. Compiler validate re-run together with units 20-22 clean (0 errors/0 warnings)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    full, uncontracted forms (دارم، دارد، است kept as separate words),
    consistent with units 01-18. Household vocabulary uses genuine Afghan
    Dari forms (چوکی، کلکین، تشناب), web-verified distinct from the
    Iranian Farsi equivalents (صندلی، پنجره، دستشویی).

