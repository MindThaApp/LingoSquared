  notes: 'Wave-0 pilot unit for the grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block A unit A1), realizing universal.a2.past.narrate_recent_weekend. Grammar target: the simple past as a system (past stem = infinitive minus -ن, plus -م/-ی/-/-یم/-ین/-ند) and the NEGATIVE past (ن + past verb: نرفتم، نخوردم، نکردم), including negation of verbs built with کردن (خرید نکردم) and the contrast with the present (می‌روم vs رفتم vs نرفتم). Seven real grammar_note cards (go paradigm, eat paradigm, five more verbs, negative paradigm, negative with other verbs, negation of compound verbs, past versus present) plus a sequencing note (اول/بعد/در آخر/ولی). Lesson arc: L01 recycled vocabulary (weekend, Thursday/Friday, bazaar, bank, park, shopping, visiting, family, errands, yesterday) plus form recognition; L02 drag and matching across seven verbs; L03 contrast (affirmative vs negative, past vs present); L04 production in the scenario; L05 reading plus one listening item; L06 dialogue plus mixed production. Recycling: the A2 course is a separate Course row, so every A1 domain used here (routines, past events, outings, errands) is re-established by L01/L02 vocabulary cards carrying introduced_tokens; the file is fully self-contained for the compiler''s untaught-vocabulary check regardless of where the manifest places it. Characters: continues زرمینه and همایون, the recurring friend pair (informal تو-register, as in a1_unit12, a1_unit20 and a2_unit17). Canon checked against the corpus: همایون works in an office on weekdays and sleeps in and spends time with his family at the weekend (a2_unit17), زرمینه goes to the market with friends at the weekend, likes movies and cooks (a1_unit26, a2_unit17); this unit''s last-weekend accounts keep to those profiles and add only one-off events. Facts kept consistent across lessons (per AUTHORING_GUIDE section 11): همایون = Thursday afternoon bank then bazaar (bread and fruit), Friday woke up late, breakfast, visited family, did NOT exercise, did NOT see a movie; زرمینه = Thursday saw a movie, Friday bazaar with friends but did NOT shop, in the L05 exchange she did not go to the bank on Thursday. Register: formal written Kabul Dari (copula است, 2pl -ین; the unit does not use the verb توانستن), no Tehrani colloquialisms; movie is spelled the Dari way, فلم. Listening: prs has no TTS, so the 3 dialogue_comprehension items show the full transcript in the prompt and no lesson depends on audio; distractors were hand-checked so none is anything the tested speaker says or implies. No listen_type, dictation or audio-only item. matching_pairs lefts are distinct in meaning. Authored from established conventions and this realization''s own prior A1/A2 units, not from a newly fetched external source. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR RAMIN (native Dari review; content unchanged for these): (1) Is Thursday afternoon as the start of the weekend accurate for Afghanistan as claimed in the thursday_friday note? (2) Is آخر هفتهٔ گذشته the natural Dari phrase for last weekend? (3) Is چند کار داشتم a natural way to say I had a few errands? (4) Tone of نخیر versus نی as a polite everyday no between friends. (5) Could فامیلم be read as my wife rather than my family or relatives? (6) In formal written Dari, is 2pl -ین correct or should it be -ید? (7) در بازار versus از بازار for buying in the bazaar (خرید). (8) صبحانه versus ناشتا for breakfast. Review 2026-10-19: 0 fixes in this file (fix is in the overlay). NATIVE FLAGS: the author''s open questions (1)-(8) above still stand; additionally نخیر is called the polite everyday no here but a more formal no in a2_unit15, and صبحانه (course-wide) vs ناشتا (used in a2_unit17).'
