            kind: grammar_note
            target: {text: "با (with/by) / حرکت می‌کند (it departs) / تکت (ticket) / چند (how much) / افغانی (afghani) / هفتاد (seventy) / است (is)", language_code: prs, direction: rtl}
            introduced_tokens: [با, "حرکت", "می‌کند", تکت, چند, افغانی, هفتاد, است]
          - content_key: prs.a1.unit59.lesson02.teach.boat_tour_sign_reading
            kind: reading
            target: {text: "گشت با قایق از ساعت ده صبح تا ساعت چهار عصر حرکت می‌کند. تکت هفتاد افغانی است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit59.lesson02.exercise01.recognize_sign_sentence
            type: multiple_choice
            tested_text: "گشت با قایق از ساعت ده صبح تا ساعت چهار عصر حرکت می‌کند. تکت هفتاد افغانی است."
            prompt:
              target_blocks:
                - {text: "گشت با قایق از ساعت ده صبح تا ساعت چهار عصر حرکت می‌کند. تکت هفتاد افغانی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit59.lesson02.exercise02.reading_operating_hours
            type: multiple_choice
            tested_text: "گشت با قایق از ساعت ده صبح تا ساعت چهار عصر حرکت می‌کند"
            prompt:
              target_blocks:
                - {text: "گشت با قایق از ساعت ده صبح تا ساعت چهار عصر حرکت می‌کند.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit59.lesson02.exercise03.reading_ticket_price
            type: multiple_choice
            tested_text: "تکت هفتاد افغانی است"
            prompt:
              target_blocks:
                - {text: "تکت هفتاد افغانی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit59.lesson02.exercise04.match_sign_vocab
            type: matching_pairs
            tested_text: "گشت با قایق تکت هفتاد افغانی گشت با قایق از ساعت ده صبح تا ساعت چهار عصر حرکت می‌کند. تکت هفتاد افغانی است."
            prompt: {target_blocks: []}
            pairs:
              - {left: گشت, right: tour}
              - {left: با, right: "with/by"}
              - {left: قایق, right: boat}
              - {left: تکت, right: ticket}
