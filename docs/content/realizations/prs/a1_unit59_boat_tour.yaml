generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "`firecrawl search \"Dari قایق boat tour cruise vocabulary phrasebook\"` returned HTTP 402 (insufficient credits) when retried fresh for this unit; `firecrawl scrape` against a known un-cached DLI Semester 1 lesson-block PDF (`DLI-Dari-Semester1-s33-36.pdf`, listed in the repo's own cached `.firecrawl/dli-dari-map.json` site map from an earlier crawl but never actually scraped) also returned the same HTTP 402 -- confirming credits are still exhausted this session, matching every recent unit's status. Before falling back to established-conventions-only authoring, the repo's own already-cached DLI Dari corpus (`.firecrawl/dli-dari-s9-12.txt`, `s17-20.txt`, `s21-24.txt`, `s25-28.txt`, `s29-32.md` -- the full set actually present in this session's `.firecrawl/` directory, confirmed by `ls` before searching, since no session-scratchpad-cached copies from any earlier session survived into this one) was searched fresh via English-keyword greps (boat, cruise, ferry, departure, dock, harbor, river, lake) and direct Dari-script greps (قایق، کشتی، گشت، رودخانه، دریا، دریاچه، کانال، بندر، اسکله، گردش) across the full cached corpus. Result, honestly disclosed: no boat-tour or river/lake-excursion scenario exists anywhere in this corpus. \"river\" (دریا) appears three times in `dli-dari-s9-12.txt` (a grammar-drill example about the Helmand River and a vocabulary-glossary entry), but only as a bare geography/grammar-drill word with no tour, boat, ticket, or departure-time content attached, and the on-page glyphs are Arabic Presentation-Forms ligatures from PDF extraction rather than a directly copy-pasteable standard-range string, so it was not reused verbatim. A handful of \"بندر\" (port) glyph sequences appear in `dli-dari-s29-32.md`'s OCR'd vocabulary-key table, but cross-checking their row context (paired against unrelated English glosses like \"before\"/\"to sit\"/\"to sing\") shows this is column-misaligned OCR noise, not a real attestation, so it was discarded rather than trusted. No attestation found anywhere in the corpus for boat (قایق), tour/excursion (گشت), lake (دریاچه), or beautiful (زیبا) specifically -- all four are authored from established Persian/Dari conventions, cross-checked the same way unit57 beach and unit58 zoo's own unattested nouns were: قایق (boat) and گشت (tour/excursion, here in the fixed compound گشت با قایق, \"an excursion by boat\") are basic, high-frequency, dialect-neutral Persian/Dari vocabulary shared identically with Iranian Farsi, no register/dialect-divergence risk of the kind unit24's موتر or unit28's پشک flagged; دریاچه (lake, transparently built from already-attested دریا \"river/large body of water\" + the diminutive/place suffix -چه, the standard Persian/Dari word for a lake, distinct from the DLI-seen دریا itself) and زیبا (beautiful) are likewise basic shared vocabulary. **Cultural-authenticity note, applied per AUTHORING_GUIDE.md's dialect/register-authenticity discipline (§3) and modernization discipline (§10), following unit57 beach's own identical precedent**: this unit deliberately does not name a specific real lake or river (e.g. Band-e-Amir's well-known lakes, which do have real boat tourism, or the Kabul River) -- the spine outcome's own can_do text lists 'such as a canal or harbor cruise' only as an illustrative example, not a mandatory fact, and naming a specific real site would be an unverified factual claim about that site's current tour operations, opening hours, or pricing that this session cannot independently confirm. دریاچه is instead framed generically as an unnamed lake, a genuine, common recreational day-trip context, matching unit57's own beach unit precedent exactly. Four new content words this unit: قایق, گشت, دریاچه, زیبا -- بلیط/چند/افغانی/از/تا/ساعت/صبح/شب/حرکت می‌کند/دقیقه/بیست/هفتاد/با/کارمند/سلام/بفرمایین/می‌خواهم/یک/تشکر زیاد/خواهش می‌کنم/این/است/در/خوب/اما/جالب/او/رفت/بود/به/کرد are all course-internal review, confirmed by grepping the full prs corpus for every candidate word before writing a single line of this file. No new grammar beyond ordinary recombination: گشت با قایق reuses unit24's own already-established با+vehicle/mode-of-transport pattern (با بس، با تکسی) applied to this unit's own new noun قایق rather than inventing a new preposition-less compound; حرکت می‌کند (departs/runs) reuses unit16 travel's own already-established departure-verb exactly, extended here from a single point-in-time departure to an operating-hours window, a natural paraphrase extension not a new grammar form; او با قایق گشت کرد (he took a boat tour) reuses the same X-را/با-Y-کرد light-verb-with-object pattern this course has used repeatedly (unit36's cooking می‌کنم, unit55's میله کردن, unit57's شنا کرد) applied to this unit's own new noun گشت, with کرد itself already established as the 3rd-person simple past of کردن since unit20."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude): checked against the full checklist (same-speaker-distractor risk in multiple_choice/dialogue_response, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, and exercise-type registration against ExerciseRenderer.tsx) -- no real bugs found in this unit. No listen_select/listen_type/dialogue_comprehension exercises exist in this file (prs has zero TTS/audio coverage per AUTHORING_GUIDE.md #14), so the same-speaker-distractor bug class doesn't structurally arise; every multiple_choice item shows the literal Dari text being translated, not audio, so distractor overlap with other same-speaker lines elsewhere in the dialogue can't create ambiguity the way it does for listen_select. matching_pairs accepted_answers use the established flat-dict shape and word_order accepted_answers use the established space-joined-string shape, both of which the compiler/grade() already canonicalize correctly. Compiler validation (grouped with the rest of the prs A1 corpus, per course-level Course-row scoping) is clean: 0 errors, 0 warnings. Re-verified against the file's own original self-report below, which is accurate. New en-prs A1 unit after unit58 (zoo). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.boat_tour.take_a_sightseeing_boat_tour as the next unrealized A1 outcome -- computed programmatically (not by eye): every spine_outcome_id value across all 61 existing prs realization files was collected into a set (via grep -rhoE) and diffed against every universal.a1.* id in the spine file's own order (grep -n '^  - id:' on universal_spine.yaml), confirming boat_tour (line 1704, immediately after zoo's own line 1679) is the earliest gap. Both listed prerequisites -- universal.a1.plans.make_simple_plans [unit13] and universal.a1.travel.handle_basic_journey [unit16] -- are already realized in prs, confirmed against the same collected spine_outcome_id set. Matches all four of the outcome's own assessment_requirements: understand_boat_tour_information (listening substituted with reading-based multiple_choice recognition per AUTHORING_GUIDE.md §14's established no-prs-audio pattern, testing lesson02's operating-hours-and-price sign and lesson04's dialogue statements of departure time/duration/price), request_boat_tour_ticket (speaking substituted the same way this whole corpus substitutes it -- production exercises across lesson04's ticket-counter dialogue asking for a ticket and asking about duration, plus writing_prompts in lessons01/02/03/05/06), read_boat_tour_schedule (lesson02's combined operating-hours-and-ticket-price reading card, a genuine two-fact notice-style sentence, mirroring unit53 museum's and unit58 zoo's own combined-reading precedent), and write_boat_tour_message (writing_prompt exercises across all six lessons). Six lessons, matching zoo/museum's own 6-lesson, service-counter-dialogue shape (distinct from beach/park's friend-outing shape, since this outcome's own assessment_requirements explicitly require buying a ticket and asking about departure/duration, a service transaction, not a friend proposal): boat-and-lake vocabulary (قایق, دریاچه new), a boat-tour sign giving operating hours and ticket price (پure recombination, zero new vocabulary beyond گشت -- از/تا/ده/چهار/صبح/شب/ساعت/حرکت می‌کند/بلیط/هفتاد/افغانی all reviewed, deliberately using different hours (10-4) and a different price (70 afghanis) than unit53 museum's 9-5/40 and unit58 zoo's 8-6/50, so the sign lessons aren't near-verbatim duplicates across units), a beautiful-lake description lesson (زیبا new), a Homayoun/کارمند formal ticket-counter dialogue (پure recombination -- گشت/با/قایق/بیست/دقیقه introduced earlier in-file, everything else review -- combining a ticket request, a departure-time statement, a duration question, and a combined duration+price answer, matching unit53 museum's own combine-two-facts-in-the-staff's-final-line shape), a third-person reading passage recapping the visit (کرد reviewed from unit20/unit36/unit55/unit57, رفت/بود/او/به reviewed from multiple earlier units, no new grammar), and a wrap-up combining a duration-but-interesting contrast with اما (reusing unit53 museum's own single-subject two-fact اما-contrast shape, applied here to duration+quality rather than open/closed hours, since this unit's two established facts -- duration and price -- don't have a natural open/closed-style antonym pair the way a physical venue's hours do) and a formal تان-suffixed question attached to this unit's OWN new noun گشت rather than reusing unit53's exact بلیط‌تان wording verbatim (avoiding a near-duplicate wrap-up sentence across units, per the same discipline unit58 zoo's own محبوب‌تان already applied). Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit57/unit58's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در/خوب از multiple earlier units، قایق/دریاچه از این فایل (لسون۰۱)، از/تا/ده/چهار/صبح/شب/ساعت از unit01/unit04/unit08، حرکت می‌کند از unit16، بلیط/چند/افغانی/هفتاد از unit01/unit02/unit04/unit08/unit16، گشت از این فایل (لسون۰۲)، زیبا از این فایل (لسون۰۳)، با از unit24، سلام/بفرمایین/تشکر زیاد/خواهش می‌کنم از units01/09/10/40/46-58، می‌خواهم/یک از unit01/unit02/unit04/unit08، او/رفت/بود/به از multiple earlier units، کرد از unit20/unit36/unit55/unit57، اما/جالب از unit14/unit33/unit39-58/unit52. Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit41/unit47-58's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md §13/§17 don't arise. No multi-clause period/comma/اما-joined accepted_answers exist beyond the single canonical comma-اما wrap-up sentence, matching unit33/39-58's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading -- confirmed by explicit review, so AUTHORING_GUIDE.md §12's multi-variant requirement doesn't otherwise arise. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md §14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's six dialogue lines and their speakers (همایون: 3 lines -- request the ticket / ask the duration / thank the staff; کارمند: 3 lines -- greet and state departure time / state duration and price / reply you're welcome) were listed and cross-checked by hand before finalizing any multiple_choice distractor, applying the standing same-speaker-distractor rule to text-based recognition items too, not just audio ones -- every distractor for a tested همایون line is drawn exclusively from کارمند's three lines and vice versa; no exercise in this lesson draws a distractor from the SAME character's other lines. Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md §16). Every vocabulary teaching card (قایق, دریاچه, گشت, زیبا) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md §19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: the boat tour's stated operating-hours-and-price fact (از ساعت ده صبح تا ساعت چهار شب حرکت می‌کند؛ بلیط هفتاد افغانی است) is stated identically in lesson02 and restated identically (never contradicted) in lesson04's dialogue (departure ساعت ده صبح matches the sign's window start; price هفتاد افغانی matches exactly); the duration fact (بیست دقیقه), introduced fresh in lesson04 since the sign itself never states a duration, is restated identically in lesson06's wrap-up; lesson05's reading passage states only that Homayoun went to the lake, took a boat tour, and that the lake was beautiful -- consistent with (not contradicting) any fact stated elsewhere; no two facts are ever summed or compared arithmetically. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched).\n\nReview 2026-10-20 (en-prs A1 pass): 3 fixes - بلیط replaced with تکت throughout (incl. lesson title); lesson title نشانی changed to تابلو; شب changed to عصر for the 4 pm end time. NATIVE FLAGS: گشت (tour) may be better as سیر; حرکت می‌کند for runs/departs. Follow-up: English side of the سلام، بفرمایین matching pair changed to Hello, welcome (same as the overlay). Owner follow-up 2026-10-20: register_policy metadata spelling دکاندار changed to دوکاندار."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-58). Lesson04's dialogue introduces the boat
    tour's ticket-counter کارمند role opposite the established Homayoun
    character, reusing the same polite-service register unit08's
    دوکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit50's pool
    کارمند, unit52's cinema کارمند, and unit53's museum کارمند exchanges
    already established -- not the informal-تو friendship register used
    for Homayoun/Zarmina outings elsewhere in this course. This unit's
    گشت با قایق extends unit24's own already-established با+mode-of-
    transport pattern to a new noun, its operating-hours sentence (گشت با
    قایق از ساعت ده صبح تا ساعت چهار عصر حرکت می‌کند) reuses unit16 travel's
    own established حرکت می‌کند departure verb extended to a window rather
    than a single point in time, and its wrap-up's گشت‌تان چند دقیقه است؟
    extends unit39-58's own established formal تان-suffix pattern to this
    unit's own new noun گشت rather than reusing unit53's exact تکت‌تان
    wording. Lesson05's reading passage uses a 3rd-person statement naming
    همایون explicitly in its first sentence, then او in the following
    sentences, matching unit27/unit41/unit47-58's own reading-passage
    precedent.

