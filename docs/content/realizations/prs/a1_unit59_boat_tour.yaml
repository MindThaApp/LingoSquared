units:
  - content_key: prs.a1.unit59.boat_tour
    title: گشت با قایق
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.boat_tour.take_a_sightseeing_boat_tour
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit59.lesson01.boat_and_lake_vocabulary
        title: قایق و دریاچه
        spine_outcome_id: universal.a1.boat_tour.take_a_sightseeing_boat_tour
        teaching:
          - content_key: prs.a1.unit59.lesson01.teach.review_this_is_in_good
            kind: grammar_note
            target: {text: "این (this) / است (is) / در (in) / خوب (good)", language_code: prs, direction: rtl}
            introduced_tokens: [این, است, در, خوب]
          - content_key: prs.a1.unit59.lesson01.teach.boat_word
            kind: vocabulary
            target: {text: قایق, language_code: prs, direction: rtl}
            introduced_tokens: [قایق]
            example: {text: "این قایق خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit59.lesson01.teach.lake_word
            kind: vocabulary
            target: {text: دریاچه, language_code: prs, direction: rtl}
            introduced_tokens: [دریاچه]
            example: {text: "قایق در دریاچه است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit59.lesson01.teach.boat_is_nice_phrase
            kind: phrase
            target: {text: "این قایق خوب است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit59.lesson01.teach.boat_at_lake_phrase
            kind: phrase
            target: {text: "قایق در دریاچه است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit59.lesson01.exercise01.recognize_boat_word
            type: multiple_choice
            tested_text: قایق
            prompt: {target_blocks: [{text: قایق, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit59.lesson01.exercise02.recognize_lake_word
            type: multiple_choice
            tested_text: دریاچه
            prompt: {target_blocks: [{text: دریاچه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit59.lesson01.exercise03.recognize_boat_at_lake
            type: multiple_choice
            tested_text: "قایق در دریاچه است."
            prompt: {target_blocks: [{text: "قایق در دریاچه است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit59.lesson01.exercise04.match_boat_lake_vocab
            type: matching_pairs
            tested_text: "قایق دریاچه این است در این قایق خوب است. قایق در دریاچه است."
            prompt: {target_blocks: []}
            pairs:
              - {left: قایق, right: boat}
              - {left: دریاچه, right: lake}
              - {left: این, right: this}
              - {left: است, right: is}
              - {left: در, right: in}
              - {left: "این قایق خوب است.", right: "This boat is nice."}
              - {left: "قایق در دریاچه است.", right: "The boat is on the lake."}
          - content_key: prs.a1.unit59.lesson01.exercise05.order_boat_at_lake
            type: word_order
            tested_text: "قایق در دریاچه است"
            prompt: {target_blocks: []}
            word_bank: [قایق, در, دریاچه, است]
          - content_key: prs.a1.unit59.lesson01.exercise06.translate_boat_at_lake
            type: translation
            tested_text: "قایق در دریاچه است."
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit59.lesson01.exercise07.write_boat
            type: writing_prompt
            tested_text: قایق
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit59.lesson02.boat_tour_sign
        title: تابلوی گشت با قایق
        spine_outcome_id: universal.a1.boat_tour.take_a_sightseeing_boat_tour
        teaching:
          - content_key: prs.a1.unit59.lesson02.teach.review_boat_hours_words
            kind: grammar_note
            target: {text: "قایق (boat) / از (from) / تا (until) / ده (ten) / صبح (morning) / چهار (four) / عصر (afternoon) / ساعت (o'clock)", language_code: prs, direction: rtl}
            introduced_tokens: [قایق, از, تا, ده, صبح, چهار, عصر, ساعت]
          - content_key: prs.a1.unit59.lesson02.teach.tour_word
            kind: vocabulary
            target: {text: گشت, language_code: prs, direction: rtl}
            introduced_tokens: [گشت]
