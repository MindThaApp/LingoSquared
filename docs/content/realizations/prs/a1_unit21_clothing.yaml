review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered A1 outcome (universal.a1.clothing.describe_buy_clothing, prerequisite: shopping/unit10, already covered). Authored by Claude (Session 2/CONTENT-equivalent worker) in an isolated git worktree, 2026-07-07, part of a same-day multi-worker push. Six lessons: clothing-item vocabulary, colors, sizes, trying on a garment, reading a clothing label + writing a request, and a full store dialogue reusing unit10's established دوکان/دوکاندار/قیمت/تخفیف shop vocabulary and Zarmina (recurring character from units 11/12/20) as the customer. Uses پطلون for trousers (the genuine Afghan Dari term, an English loanword via 'pantaloon', distinct from Iranian Farsi's شلوار) and پرو کردن for 'to try on' (standard in both Dari and Farsi, French loanword via 'épreuve' -- not an Iranian-specific form, safe to use). Colors use سرخ for red (the Dari/Classical-Persian form) rather than Iranian colloquial قرمز. Reuses بزرگ/کوچک (already taught, unit15 comparisons) rather than reteaching size adjectives from scratch -- only اندازه (size, the noun) and the fitting phrases are new. Continues the established استم/استین full-uncontracted register policy. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere (zero prs audio exists; speak_response exercises are fine since they require no audio playback, only mic input), every matching_pairs exercise sized 6+ pairs except lesson01's genuine first-lesson ceiling, zero fill_in_blank exercises. Multi-clause production exercises (writing_prompt in lesson04/lesson06, dialogue_response in lesson05) carry period-joined, comma-joined, and و-joined accepted-answer variants at every clause boundary, matching the pattern established in units 12/15/19/20's own reviews. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit20_clothing.yaml, known to exist from this same session's other concurrent work, was never opened while authoring this file). schema_version 1.1 from the start -- every kind:vocabulary teaching card has its own example/example_gloss.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-10 (Claude, zero access to the authoring reasoning above, sibling fa/prs-en files never opened). Found and fixed four real issues: (1) lesson01's matching_pairs exercise (match_clothing_words) claimed a 'genuine first-lesson ceiling' at 4 pairs, but the lesson actually teaches 6 vocabulary cards (است and گران were taught with real example sentences but left out of the pairs) -- the self-claimed ceiling didn't actually hold, the same class of pooling-claim failure flagged in unit18's own review; added است/گران to the pairs (now 6) and updated tested_text to match, in both this file and the paired overlay. (2) Two comprehension exercises had a completely empty prompt.target_blocks (lesson05.exercise02.recognize_color_chosen and lesson06.exercise02.reading_comprehension_price) -- every other reading/dialogue comprehension exercise in this unit and in units 19/20 always shows real visible text to read, so these two were genuinely unanswerable without the learner recalling text shown moments earlier from memory; fixed by adding the relevant dialogue line (turn04, for the color question) and the full summary reading (matching its own sibling exercise01, for the price question) respectively. (3) §12 multi-clause boundary coverage was incomplete on two 2-boundary production exercises (write_purchase_summary in lesson05 and write_own_purchase_summary in lesson06) -- both had only ~5 of the 9 systematic period/comma/و boundary combinations that units 19/20's own reviews established as the bar for this exact bug class (a missing comma-vs-period swap exceeds Phase C's distance-1 typo tolerance); expanded both to full 9-combination coverage in the paired overlay. (4) 16 learner-facing note fields (every review_* vocabulary card, e.g. 'گران (expensive) -- reviewed from the shopping unit.') used the internal-sounding word 'reviewed' -- these notes render directly on the teaching card in TeachingCardView.tsx, so this was a real instance of the standing 'reviewed leaking into learner-facing text' footgun; reworded to 'already familiar from the shopping unit' (and equivalent natural phrasing) throughout the paired overlay, keeping the same unit-name references (units are real, learner-visible course structure, unlike the word 'reviewed' itself). Everything else checked clean: same-speaker dialogue-distractor rule, zero stray YAML booleans, zero Arabic-range kaf/yeh, every exercise type used (multiple_choice, matching_pairs, translation, word_order, dialogue_response, writing_prompt, speak_response) registered in ExerciseRenderer.tsx, zero fill_in_blank, zero audio-only prompts per §14, §11 cross-lesson fact consistency (the label in lesson04, the dialogue purchase in lesson05, and the lesson06 summary all agree on white/big/500 afghanis), word_order/matching_pairs answer shapes match what grade() actually canonicalizes, dialect claims (پطلون/سرخ/پرو کردن) internally consistent with the register_policy's own reasoning. Compiler validate re-run together with units 19/20/22 clean (0 errors/0 warnings) after all fixes."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy. Reuses دوکان (shop) and دوکاندار (shopkeeper) from
    unit10. پطلون (trousers) is the genuine Afghan Dari term (English
    loanword via "pantaloon"), distinct from Iranian Farsi's شلوار.
    سرخ (red) is the Dari/Classical-Persian form, not Iranian colloquial
    قرمز. پرو کردن (to try on) is shared by both Dari and Farsi, safe to
    use.

