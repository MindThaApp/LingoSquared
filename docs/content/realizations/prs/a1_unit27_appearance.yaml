course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-26). The Homayoun/Zarmina dialogue (lesson04)
    uses the informal تو/-ت register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 (رفتی/کردی) and unit26 (می‌کنی) dialogues. All appearance
    vocabulary (قد بلند، قد کوتاه، مو، چشم، ریش، عینک، آبی، قهوه‌ای) is
    standard, everyday Kabul Dari, shared with Farsi but not a borrowed
    Iranian-specific term -- no dialect-divergence risk here, unlike
    موتر/تکت in unit24.

