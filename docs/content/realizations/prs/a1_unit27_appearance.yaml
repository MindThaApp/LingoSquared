target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain), modernized; no fetchable lesson-level physical-appearance content was found this pass (same search-and-disclose approach as the unit24/unit25/unit26 precedents) -- authored from established prs conventions and vocabulary already taught earlier in this course instead, disclosed honestly rather than overclaiming source use. Dialect terms verified independently via live web search (not just reasoning) during authoring: قهوه‌ای confirmed as the standard Persian/Dari word for brown (as in hair/eye color), عینک confirmed as glasses/eyeglasses, قیافه confirmed as the everyday word for a person's looks/appearance (e.g. خوش قیافه, 'good-looking') -- chosen over the ambiguous bare چطور است (which primarily reads as the health/wellbeing greeting 'how are you') specifically to avoid that ambiguity when asking what someone looks like."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude, zero access to the authoring
    reasoning, prs unit27 only -- units 23-26 reviewed separately in
    parallel per the coordinator's split). Checked against every item in
    the standing review checklist: same-speaker dialogue-distractor
    collisions (none -- the lesson04 Homayoun/Zarmina dialogue's
    dialogue_comprehension question has a single unambiguous correct
    answer, and every multiple_choice recognition exercise shows the
    literal target text directly, so there's no audio-matching ambiguity
    to begin with), stray YAML boolean coercion (a recursive
    yaml.safe_load scan found none beyond the two legitimate schema
    fields), Persian-range Unicode codepoints throughout (no Arabic kaf/
    yeh substitutions), matching_pairs/word_order answer shapes (correct
    per the established flat-dict/array-of-{left,right} and string/list
    conventions this codebase's grade() already canonicalizes), exercise
    types used (all pre-registered), no internal-jargon leaks, and Dari
    register/grammar (consistent استم/استین formal register outside the
    established Homayoun/Zarmina informal تو/-ت dialogue lines, correct
    light-verb and possessive-suffix constructions).

    Two real, if minor, gaps found and fixed. (1) lesson04's dialogue_line1
    target text uses زرمینه (Zarmina's name) but declared zero
    introduced_tokens for it -- inconsistent with every sibling unit in
    this same authoring batch (28/29/30), which all correctly declare a
    character's name at its first in-file appearance; fixed by adding
    زرمینه to that card's introduced_tokens. (2) lesson06's
    translate_wrap exercise was missing the period-joined multi-clause
    variant required by AUTHORING_GUIDE.md §12 for این-اما-joined
    sentences -- had only the no-punctuation and comma+period forms;
    added "من قد کوتاه استم. اما موی سیاه دارم." as a third accepted
    variant. Also tightened lesson02's qiyafa_word card to self-declare
    خوب (already used in its own example two lessons before its next
    formal mention) for consistency, though this was below the bar of a
    real bug given خوب's ubiquity elsewhere in the course.

    Cross-checked facts within this unit per AUTHORING_GUIDE.md §11:
    Zarmina's brother (dialogue, unnamed) is tall, has black hair, has a
    beard, and wears glasses -- self-consistent across lesson04's
    dialogue and its exercises. Karim (lesson05's reading passage, the
    established comparisons-unit character reused from unit15) is a
    different, explicitly named person -- tall, black hair, brown eyes,
    no beard, glasses -- no conflict with the brother since they're never
    conflated. Re-validated clean after the fixes: 0 errors/0 warnings,
    both standalone and as part of the full prs.a1.unit27-30 batch.

    Review 2026-10-20 (en-prs A1 pass): 1 fixes - comprehension question word order fixed (قد برادر زرمینه چطور است؟). NATIVE FLAGS: قیافه for looks; singular چشم for eyes; قهوه‌ای for hair color.

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-26). The Homayoun/Zarmina dialogue (lesson04)
    uses the informal تو/-ت register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 (رفتی/کردی) and unit26 (می‌کنی) dialogues. All appearance
    vocabulary (قد بلند، قد کوتاه، مو، چشم، ریش، عینک، آبی، قهوه‌ای) is
    standard, everyday Kabul Dari, shared with Farsi but not a borrowed
    Iranian-specific term -- no dialect-divergence risk here, unlike
    موتر/تکت in unit24.

