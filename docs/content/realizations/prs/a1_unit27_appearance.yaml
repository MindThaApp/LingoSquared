  notes: "New unit, prs's next uncovered A1 outcome found by exact-diffing every spine_outcome_id used across all prs realization files against every id: in docs/content/universal_spine.yaml (A1-level outcomes only): universal.a1.appearance.describe_physical_appearance (prerequisite: universal.a1.family.describe_relationships [unit03], already realized). This is the earliest unrealized A1 outcome by the spine file's own line order (line 833) among the ones prs has not yet covered -- animals/sports/technology/education/celebrations/household (lines 857-1056) all come later in file order and remain unrealized too; universal.a1.transportation.getting_around_town (line 905) was already realized as unit24, so appearance (immediately after hobbies at line 809/unit26) is the genuine next gap. Six lessons: physical-trait vocabulary (قد بلند/قد کوتاه reusing unit15's قد, مو, چشم, ریش, عینک), asking what someone looks like with قیافه‌اش چطور است؟ (deliberately NOT the bare چطور است؟ alone, which reads as the health greeting -- verified via web search, see generation_provenance), hair/eye color (رنگ مو/رنگ چشم, reusing unit21's رنگ/سیاه/سفید color-teaching pattern, adding two new colors آبی and قهوه‌ای verified authentic via web search), a Homayoun/Zarmina dialogue in the established informal تو/-ت register (Homayoun asks Zarmina what her brother looks like, matching the precedent set by unit20's رفتی/کردی and unit26's می‌کنی informal forms -- برادرت is the exact same informal possessive-suffix pattern), a third-person reading passage about Karim (reusing the established character from unit15's comparisons unit, extending his profile with a genuinely consistent new fact -- tall, black hair, brown eyes, no beard, glasses -- that does not contradict unit15's own facts about him per AUTHORING_GUIDE.md #11), and a wrap-up combining two appearance facts with اما (established unit24/25/26). Deliberately kept to five uncontroversial, easily-observable traits (height, hair, eyes, beard, glasses) and avoided any body-weight/size descriptor to keep the content respectful and avoid a subjective judgment call this outcome doesn't call for -- a deliberate scope decision, not an oversight. Introduced ندارد (3rd-person negative of دارد) in lesson05's reading passage as a natural, low-complexity extension of the already-taught دارد/ندارم pattern (unit03 already established ندارم; ندارد is the same negative suffix on the already-established 3rd-person دارد from unit26) -- not a new grammar point, just the expected paradigm cell. Every word re-declared via introduced_tokens within THIS file per the standing per-file untaught-vocabulary footgun, even for words taught many units earlier (قد and بلندتر's root بلند from unit15, رنگ/سیاه from unit21, پیر from unit03, دارد/او/می‌کند-family from unit26, است/استم/بلی/تشکر/چطور/هم/اما/و/من/تو from various earlier units -- all re-declared fresh here). Authored §14/§16/§17/§19-compliant from the start: no listen_type/listen_select/listen_order exercises (zero prs audio exists), every matching_pairs exercise sized 6-7 pairs, zero fill_in_blank, every kind:vocabulary card has a real example sentence built from already-taught words. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file). schema_version 1.1 from the start.

