          - content_key: prs.a1.unit06.lesson02.teach.turn_right
            kind: phrase
            target: {text: "به راست بپیچین", language_code: prs, direction: rtl}
            introduced_tokens: [راست]
        exercises:
          - content_key: prs.a1.unit06.lesson02.exercise01.recognize_go_straight
            type: multiple_choice
            tested_text: مستقیم بروین
            prompt: {target_blocks: [{text: "مستقیم بروین", language_code: prs, direction: rtl}]}
