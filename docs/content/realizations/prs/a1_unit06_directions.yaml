units:
  - content_key: prs.a1.unit06.directions
    title: نشانی دادن و راه یافتن
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.directions.ask_follow_basic_directions
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit06.lesson01.direction_words
        title: کلمات اساسی نشانی
        spine_outcome_id: universal.a1.directions.ask_follow_basic_directions
        teaching:
          - content_key: prs.a1.unit06.lesson01.teach.straight
            kind: vocabulary
            target: {text: مستقیم, language_code: prs, direction: rtl}
            introduced_tokens: [مستقیم]
          - content_key: prs.a1.unit06.lesson01.teach.left
            kind: vocabulary
            target: {text: چپ, language_code: prs, direction: rtl}
            introduced_tokens: [چپ]
          - content_key: prs.a1.unit06.lesson01.teach.right
            kind: vocabulary
            target: {text: راست, language_code: prs, direction: rtl}
            introduced_tokens: [راست]
          - content_key: prs.a1.unit06.lesson01.teach.turn_verb
            kind: vocabulary
            target: {text: "بپیچین", language_code: prs, direction: rtl}
            introduced_tokens: [بپیچین]
          - content_key: prs.a1.unit06.lesson01.teach.to_word
            kind: grammar_note
            target: {text: "به (to/toward)", language_code: prs, direction: rtl}
            introduced_tokens: [به]
        exercises:
          - content_key: prs.a1.unit06.lesson01.exercise01.recognize_straight
            type: multiple_choice
            tested_text: مستقیم
            prompt: {target_blocks: [{text: مستقیم, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit06.lesson01.exercise02.recognize_left_right
            type: multiple_choice
            tested_text: چپ راست
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit06.lesson01.exercise03.recognize_chap_reading
            type: multiple_choice
            tested_text: چپ
            prompt: {target_blocks: [{text: چپ, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit06.lesson01.exercise04.match_direction_words
            type: matching_pairs
            tested_text: مستقیم چپ راست بپیچین
            prompt: {target_blocks: []}
            pairs:
              - {left: مستقیم, right: straight}
              - {left: چپ, right: left}
              - {left: راست, right: right}
              - {left: "بپیچین", right: "turn (polite imperative)"}
          - content_key: prs.a1.unit06.lesson01.exercise05.order_turn_left
            type: word_order
            tested_text: به چپ بپیچین
            prompt: {target_blocks: []}
            word_bank: [به, چپ, بپیچین]
          - content_key: prs.a1.unit06.lesson01.exercise06.translate_right
            type: translation
            tested_text: راست
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit06.lesson01.exercise07.write_straight
            type: writing_prompt
            tested_text: مستقیم
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit06.lesson02.giving_turn_instructions
