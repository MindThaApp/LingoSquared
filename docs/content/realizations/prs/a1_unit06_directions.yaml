review:
  status: reviewed
  required_next_reviewer: null
  notes: "Fresh-context review completed 2026-07-05. Confirmed spine discipline (all 6 lessons genuinely serve universal.a1.directions.ask_follow_basic_directions, no drift), exercise pacing (recognition -> drag/matching -> production held in every lesson), script purity (no Arabic-range kaf/yeh found), and content_key parity with the overlay (25 teaching + 44 exercise keys match exactly). Found and fixed one significant dialect-authenticity bug (highest-priority check): 'گرد کنین' -- used throughout as the core 'turn left/right' verb -- is not genuine Dari/Persian for giving pedestrian directions; web-verified it's a mechanical/rotational term (screw-thread and motor-rotation direction, چپ‌گرد/راست‌گرد), while a Peace-Corps-derived Dari phrasebook and multiple Persian sources confirm پیچیدن ('به چپ/راست بپیچین') is the real verb. Replaced 'گرد کنین' with 'بپیچین' everywhere (teaching items, exercises, media_assets, word_banks, accepted_answers) in both this file and the overlay. Also fixed: an awkward calque-y lesson02 title ('دادن هدایت گشتن' -> 'پیچیدن به چپ و راست'); a listen_select exercise (lesson01.exercise03) whose recorded audio listed all 4 candidate words including every distractor, making 'select what you hear' ungradeable -- narrowed audio+tested_text to the single tested word, same fix pattern already used in unit05; a tested_text bug in lesson02.exercise08 that concatenated both turn-left and turn-right phrases though only turn-right was being tested. §11 (cross-lesson fact check): the lesson06 dialogue's two-step sequence (go straight, then turn left) and its landmark facts (pharmacy after the mosque, opposite the bank) are consistent across the teaching cards, matching_pairs, word_order, and writing/speaking exercises that reference them; also reworded an instruction that called a landmark fact a 'step' inconsistently with its own matching pairs. §12 (multi-clause forms): added the missing period-joined accepted-answer variant (previously only comma- and و-joined existed) to all 4 free-text exercises combining two direction clauses. §13: no fill_in_blank exercises exist in this unit, nothing to check. Untaught-vocabulary ordering re-verified cumulatively across the whole file after the گرد کنین -> بپیچین token changes: 0 violations. Also fixed two factually-wrong overlay notes (see overlay's own review notes). Compiler validation clean (0 errors/0 warnings) after fixes. Audio remains pending generation; human native-speaker review still recommended before this ships, per project policy of no native-speaker review network for prs. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this review completed): a project-wide audit found 9 exercises in this unit (lesson01.exercise03, lesson02.exercise03/06, lesson03.exercise03/06, lesson04.exercise03, lesson05.exercise03/06, lesson06.exercise05) were listen_type or bare-prompt listen_select items -- genuinely unanswerable since fa/prs have zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (added the target Dari text as a real visible prompt, English-gloss correct_option/distractors), listen_type -> translation. MATCHING_PAIRS SCALE RETROFIT (§16, same day, Ramin's direct feedback): expanded match_turn_instructions 3->7, match_sequence_words 2->6, match_asking_phrases 3->7, and match_landmark_words 2->6, all by pooling already-taught vocabulary from earlier in the unit (lesson01's 4 direction words reused across lessons02/03/04/05; lesson04's own دفتر; lesson05's own مسجد/بانک). match_direction_words (4) and match_dialogue_facts (3) left unchanged as genuine small closed sets. Re-verified 0 remaining §14 violations via script, content_key parity intact, validate+compile both clean after both retrofits. POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by unit13's fresh-context reviewer flagging the same bug in units 11/12) found this file also had exercises where realization prompt.target_blocks duplicated the overlay's own instruction text verbatim in English -- the compiler would have rendered the same sentence twice to the learner. Fixed mechanically: every affected exercise's prompt set to target_blocks: []. Re-verified validate+compile clean (0 errors/0 warnings) and confirmed zero remaining instruction-duplicate target_blocks via a script comparing every exercise's target_blocks against its overlay instruction."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    می‌تانین (not the Iranian-colloquial می‌شه) for polite requests,
    consistent with unit02's corrected register. Direction instructions use
    the polite imperative (بروین, بپیچین) appropriate for addressing a
    stranger.

