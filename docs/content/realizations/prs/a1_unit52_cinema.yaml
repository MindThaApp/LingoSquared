generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session (confirmed via `firecrawl --status`: 0/1000 credits, 0% left this cycle), so per this task's own fallback instruction, direct `curl` downloads plus local `pdftotext -layout` extraction were used instead of `firecrawl search`/`firecrawl scrape` -- the same fallback pattern earlier units in this corpus (e.g. unit50) already used under the same exhausted-quota condition. No cached DLI extraction covering the cinema/movie topic already existed in the shared scratchpad (only s13-16, the restaurant lesson, was previously cached), so four fresh Semester 1 student-book PDFs (s9-12, s17-20, s21-24, s25-28) were downloaded directly from https://fsi-languages.yojik.eu/languages/DLI/Dari/Books/Semester%201/ (URLs sourced from the already-cached dli-dari-map.json) and extracted with pdftotext. An English-keyword grep (\"cinema\", \"movie\") across all four found a genuine, dedicated hit in DLI Dari Semester 1's own Lesson 22, \"At the Information Desk\" (s21-24, lines 1873-2466): a real lesson-vocabulary list glossing سینما as \"cinema / theater\" and فلم as \"movie\", plus a worked grammar example \"مهناز میخواهد فلم امشب را ببیند\" (\"Mahnaz wants to see tonight's movie\") and a full ticket-counter-adjacent exchange model where Mahnaz says \"می‌خایم فلم امشوه ببینم\" (colloquial, \"I want to see the movie tonight\") at an American Cultural Center information desk, plus a role-play prompt (\"You and your Afghan friend discuss whether to rent and watch a movie tonight\"). This independently confirms سینما and فلم as genuine, source-attested Dari vocabulary for this scenario. Disclosed honestly: فلم was NOT newly sourced from this search -- it was already an established word in this course (introduced in a1_unit22_weather.yaml's dialogue \"خوب است، فلم می‌بینیم\" and reused in a1_unit26_hobbies.yaml's \"فلم دیدن\"), so this task's only genuinely NEW DLI-attested word is سینما itself. The source lesson's own scenario (a library/computer-lab/cultural-center membership-card registration desk) and grammar target (the subjunctive mood, e.g. ببیند/ببینم, well past A1) were NOT imported -- per AUTHORING_GUIDE.md #10's mandatory-modernization requirement, this unit instead builds a clean, uncontracted ticket-counter scenario (buying a cinema ticket, asking/stating a showtime and a film title) using only this course's own already-established grammar patterns (the same X-می‌خواهم-noun want-pattern, the same X-است price/time predicate pattern, the same کدام question word already taught in unit09, the same می‌خواهین formal-you-want form already taught in unit13), not the source's colloquial contracted forms (می‌خایم, امشوه) or its subjunctive verb forms. AUTHORING_GUIDE.md #3 itself doesn't list a cinema term, so no conflicting illustrative example existed to reconcile here. Built otherwise entirely from this course's own already-established in-corpus vocabulary and grammar: این/است/در/خوب (multiple earlier units), کارمند (unit50's own established generic staff/employee word, reused here for a cinema-counter role exactly as unit45's کارمند هوتل and unit50's own pool کارمند already established the pattern of کارمند + service context), فلم (unit22/unit26), برنامه (unit16/unit22's own established word for a plan/program, reused here in its equally natural \"schedule/program\" sense for a cinema's showtime listing), بلیط (unit16 travel's own established word for a ticket, extended here with the same mechanical -ش possessive suffix this corpus's own قیمتش/کمدش/کبابش pattern already establishes, giving بلیطش \"its ticket\"), چند/افغانی/سی/چهل/پنج/هشت (unit04's own established number words), کدام (unit09's own established \"which\" question word), می‌خواهین (unit13's own established formal \"you want\" form), جالب (unit14's own established \"interesting\" adjective), شما/چیست/من/می‌خواهم/یک (unit01/unit02/unit04/unit08's own established patterns), بلیط/را/لطفاً (unit01/unit02/unit08/unit16's own established tokens), بسیار خوب/تشکر زیاد/خواهش می‌کنم/بفرمایین/سلام (units01/09/10/40/46-51's established politeness formulas), او/می‌خواهد (unit27/unit47-51's own established precedent for introducing a 3rd-person cell of an already-taught 1st-person verb), and اما (unit33/unit39-51's established contrast word). Two genuinely new content items beyond the one DLI-attested new noun (سینما): آسمان (\"sky\", a real, common modern Dari/Persian word, chosen as the title of a fictional film shown in this unit -- disclosed honestly as an invented film, not a real one, so no factual claim about any actual movie is made) and بلیطش (\"its ticket\", the same mechanical -ش extension already established course-wide, applied here to the already-taught بلیط). Deliberately kept the two showtime/price facts (فلم آسمان at ساعت پنج / سی افغانی, and a second, unrelated 8 o'clock / 40-afghani showtime introduced only in the wrap-up lesson for contrast) as independently stated, never-summed facts, per AUTHORING_GUIDE.md #11's own warning about comparative/total facts -- this unit never asks the learner to add two prices or times together."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit51 (restaurant). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.cinema.go_to_the_cinema as the next unrealized A1 outcome, immediately after restaurant. Both listed prerequisites -- universal.a1.plans.make_simple_plans [unit13] and universal.a1.money.handle_basic_money_matters [unit23] -- are already realized in prs. Matches all four of the outcome's own assessment_requirements: understand_cinema_information (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14, testing the schedule reading in lesson02 and the staff member's showtime/price statement in lesson04), request_cinema_ticket (speaking substituted the same way this whole corpus substitutes it -- production exercises asking for a ticket and stating which film, lesson03/lesson04), read_cinema_schedule (lesson02's reading card, a genuine schedule-style sentence naming a film title, a showtime, and a ticket price together, distinct from a plain single-fact dialogue line), and write_cinema_message (writing_prompt exercises across all six lessons). Six lessons: cinema-and-staff vocabulary (سینما new, DLI-attested; کارمند reviewed from unit50), reading the cinema schedule and asking a film's ticket price (آسمان new, used as a fictional film title; بلیطش new, the established -ش possessive extension applied to unit16's بلیط; برنامه/فلم/چند/افغانی/سی reviewed), asking which film and requesting a ticket (pure recombination, zero new vocabulary, matching unit51 lesson03/unit48-50's own established precedent that a lesson doesn't always need fresh vocabulary -- کدام/می‌خواهین/بلیط/را/لطفاً/می‌خواهم/شما/چیست all reviewed), a Homayoun/کارمند cinema-counter dialogue combining all of lessons 01-03's vocabulary (no new vocabulary, pure recombination, same established precedent), a third-person reading passage recapping the same visit's facts (می‌خواهد re-declared fresh in this file as the expected 3rd-person paradigm cell of already-taught می‌خواهم, matching unit47-51's own precedent), and a wrap-up contrasting the 5 o'clock showtime's ticket price with an unrelated 8 o'clock showtime's ticket price using اما plus a formal تان-suffixed ticket-price question, mirroring unit39-51's own wrap-up shape (بلیط‌تان, \"your ticket\" -- the same exact -تان-suffixed noun unit50's own pool wrap-up already established for a different service context, reused here since it's still the same natural, correct construction for the same underlying noun بلیط, not a duplicate-content bug). Deliberately kept the two showtime/price facts (ساعت پنج/سی افغانی for the film Sky, stated identically in lesson02's schedule reading, lesson04's dialogue, and lesson05's reading passage; ساعت هشت/چهل افغانی, introduced only in lesson06 for contrast) as two clearly distinct, never-summed facts -- no arithmetic is ever asked of the learner. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (این/است/در/خوب از multiple earlier units، کارمند از unit50، فلم از unit22/unit26، برنامه از unit16/unit22، بلیط/را/لطفاً از unit01/unit02/unit08/unit16، چند/افغانی از multiple earlier units، سی/چهل/پنج/هشت از unit04، کدام از unit09، می‌خواهین از unit13، جالب از unit14، شما/چیست/من/می‌خواهم/یک از unit01/unit02/unit04/unit08، بسیار خوب/تشکر زیاد/خواهش می‌کنم/بفرمایین/سلام از units01/09/10/40/46-51، او/می‌خواهد از unit27/unit47-51's own precedent، اما از unit33/unit39-51). Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit47-51's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. No multi-clause (period/comma/اما-joined) accepted_answers exist beyond the single canonical comma-اما wrap-up sentence, matching unit33/39-51's own established precedent that this construction has exactly one natural conjunction reading, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md #13/#17 don't arise either. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; since no dialogue-audio exercise exists in this file at all, the same-speaker-distractor bug class (AUTHORING_GUIDE.md's dialogue-audio footgun) does not arise here, though lesson04's dialogue lines and their speakers were still listed and cross-checked by hand before writing any multiple_choice distractor to confirm no distractor is ambiguous about which line it paraphrases. Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (سینما, آسمان, بلیطش, می‌خواهد) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: lesson02's stated showtime (ساعت پنج) and ticket price (سی افغانی) for the film آسمان are identical everywhere referenced (lesson02/lesson04/lesson05); lesson06's second showtime/price pair (ساعت هشت / چهل افغانی) appears only in lesson06 and is never combined arithmetically with the first pair. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-51). Lesson04's dialogue introduces a new
    کارمند role at the cinema ticket counter opposite the established
    Homayoun character, reusing the same polite-service register unit08's
    دکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit50's pool
    کارمند, and unit51's پیشخدمت exchanges already established -- not the
    informal-تو friendship register. The source DLI lesson's own dialogue
    models use contracted colloquial forms (می‌خایم, امشوه) not reused
    here; this unit's کدام فلم می‌خواهین؟ instead extends this course's own
    already-established کدام (unit09) and می‌خواهین (unit13) forms.
    Lesson05's reading passage uses a 3rd-person statement naming همایون
    explicitly in its first sentence, then او in the following sentences,
    matching unit27/unit47-51's own reading-passage precedent, and
    lesson06's wrap-up uses the same formal شما-تان-suffixed question
    pattern unit39-51 already established.

