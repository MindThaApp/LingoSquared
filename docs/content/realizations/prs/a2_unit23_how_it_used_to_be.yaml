  notes: 'Grammar-led A2 unit (docs/A2_REBUILD_PLAN.md, Block A unit A3), realizing universal.a2.past.describe_past_habits. Grammar target: the habitual past / past continuous formed with می‌ + past stem + personal endings (می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند), its negation نمی‌ + past stem (نمی‌رفتم), the contrast with the simple past (one finished event: رفتم, یک روز) and with the present (حالا می‌روم), time words قبلاً، وقتی کوچک بودم، هر روز، همیشه، جمعه‌ها، حالا، دیگر ... نمی‌, plus بودم/داشتم as states. Seven grammar_note cards (habitual paradigm, ZWNJ spelling of می‌/نمی‌, eat paradigm, four more verbs incl. آمدن, be/have, simple-past versus habit versus present, negative paradigm, دیگر ... نمی‌). Lesson arc: L01 form recognition; L02 drag and matching across verbs; L03 contrast with the nearest confusables (رفتم / می‌رفتم / می‌روم, negatives); L04 production in the scenario (neighbourhood, school, grandmother, shop job); L05 reading plus transcript-shown listening; L06 dialogue plus a culminating then-and-now writing_prompt (two past habits plus a present contrast, as the spine write_past_habits requirement asks). Characters: new one-off friends سلیمه and جاوید (grepped docs/content/realizations/prs: neither name occurs anywhere; زرمینه/همایون deliberately not reused). Facts kept consistent across lessons: Javid lived in Herat as a child, walked to school every day except Friday, played football with friends in the street after school, visited his grandmother on Fridays; now lives in Kabul, goes to the office by bus, no longer plays football. Salima used to work in a shop and now works in an office. The progressive در حال construction is not used (unit A4). Object clitics, present perfect and the future are not used. Register: formal written Kabul Dari for narration and notes, friend dialogue with informal تو; copula است/استیم, 2pl -ین; full uncontracted forms with ZWNJ throughout. Listening: prs has no TTS, so the dialogue_comprehension items show the full transcript in the prompt; no listen_type, dictation or audio-only item. Distractors hand-checked so none is said or implied by the tested speaker. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Is مکتب به پیاده رفتن natural as پیاده به مکتب می‌رفتم, or would a Herati say با پا? (2) Is زندگی کردن the natural verb for living in a place, versus بودن? (3) Is جمعه‌ها (plural with ZWNJ) natural for ''on Fridays'' in speech and writing? (4) Is مادرکلان the natural everyday word for grandmother, or ننه/بی‌بی? (5) Is نی acceptable as an everyday no (accepted as an extra answer only)? (6) Is بعد از مکتب natural, or بعد از ختم مکتب? (7) Does دیگر ... نمی‌کنم read as ''no longer'' in Kabuli usage? (8) In the L02 note, is the claim that بودم/داشتم normally take no می‌ accurate for the habitual sense (داشتم vs می‌داشتم)? (9) RESOLVED by ruling 2026-11-15: 2pl ends in -ین everywhere (می‌رفتین), -ید forms are accepted as answers.'
