  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین, no Tehrani colloquialisms. Friend dialogue between سلیمه and جاوید uses the informal تو-register. Habitual past taught as می‌ + past stem + endings (-م, -ی, none, -یم, -ین, -ند), negative نمی‌ + past stem; contrast with the simple past and the present. The progressive در حال construction is not used in this unit.'
