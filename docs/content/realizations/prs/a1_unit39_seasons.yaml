    status: pending_generation

units:
  - content_key: prs.a1.unit39.seasons
    title: فصل‌ها
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.seasons.describe_seasons
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit39.lesson01.primary_seasons
        title: چهار فصل
        spine_outcome_id: universal.a1.seasons.describe_seasons
        teaching:
          - content_key: prs.a1.unit39.lesson01.teach.review_basics
            kind: grammar_note
            target: {text: "چهار (four) / است (is) / سال (year)", language_code: prs, direction: rtl}
            introduced_tokens: [چهار, است, سال]
          - content_key: prs.a1.unit39.lesson01.teach.review_weather_connectors
            kind: grammar_note
            target: {text: "هوا (weather) / گرم (hot) / سرد (cold) / خیلی (very) / امروز (today) / و (and) / اما (but)", language_code: prs, direction: rtl}
            introduced_tokens: [هوا, گرم, سرد, خیلی, امروز, و, اما]
          - content_key: prs.a1.unit39.lesson01.teach.fasl_word
            kind: vocabulary
            target: {text: فصل, language_code: prs, direction: rtl}
            introduced_tokens: [فصل]
            example: {text: "در سال چهار فصل است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit39.lesson01.teach.bahar_word
            kind: vocabulary
            target: {text: بهار, language_code: prs, direction: rtl}
            introduced_tokens: [بهار]
            example: {text: "بهار گرم است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit39.lesson01.teach.tabestan_word
            kind: vocabulary
            target: {text: تابستان, language_code: prs, direction: rtl}
            introduced_tokens: [تابستان]
            example: {text: "تابستان خیلی گرم است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit39.lesson01.teach.khonak_word
            kind: vocabulary
            target: {text: خنک, language_code: prs, direction: rtl}
            introduced_tokens: [خنک]
            example: {text: "امروز هوا خنک است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit39.lesson01.teach.khazan_word
            kind: vocabulary
            target: {text: خزان, language_code: prs, direction: rtl}
            introduced_tokens: [خزان]
            example: {text: "خزان خنک است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit39.lesson01.teach.zemestan_word
            kind: vocabulary
            target: {text: زمستان, language_code: prs, direction: rtl}
            introduced_tokens: [زمستان]
            example: {text: "زمستان سرد است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit39.lesson01.teach.warm_seasons_phrase
            kind: phrase
            target: {text: "بهار گرم است و تابستان خیلی گرم است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit39.lesson01.teach.cool_cold_contrast_phrase
            kind: phrase
            target: {text: "خزان خنک است، اما زمستان سرد است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit39.lesson01.exercise01.recognize_bahar
            type: multiple_choice
            tested_text: بهار
            prompt: {target_blocks: [{text: بهار, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit39.lesson01.exercise02.recognize_khazan
            type: multiple_choice
            tested_text: خزان
            prompt: {target_blocks: [{text: خزان, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit39.lesson01.exercise03.recognize_cool_cold_contrast
            type: multiple_choice
            tested_text: "خزان خنک است، اما زمستان سرد است."
            prompt: {target_blocks: [{text: "خزان خنک است، اما زمستان سرد است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit39.lesson01.exercise04.match_seasons
            type: matching_pairs
            tested_text: "فصل بهار تابستان خزان زمستان خنک خزان خنک است اما زمستان سرد است"
            prompt: {target_blocks: []}
            pairs:
              - {left: فصل, right: season}
              - {left: بهار, right: spring}
              - {left: تابستان, right: summer}
              - {left: خزان, right: autumn}
              - {left: زمستان, right: winter}
              - {left: خنک, right: cool}
              - {left: "خزان خنک است، اما زمستان سرد است.", right: "Autumn is cool, but winter is cold."}
          - content_key: prs.a1.unit39.lesson01.exercise05.order_spring_warm
            type: word_order
            tested_text: "بهار گرم است"
            prompt: {target_blocks: []}
            word_bank: [بهار, گرم, است]
          - content_key: prs.a1.unit39.lesson01.exercise06.translate_autumn
            type: translation
            tested_text: خزان
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit39.lesson01.exercise07.write_cool
            type: writing_prompt
            tested_text: خنک
