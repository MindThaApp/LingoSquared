generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Firecrawl was unavailable this session (credits exhausted) so real, direct WebSearch/WebFetch access was used instead. `WebSearch \"Peace Corps Dari seasons vocabulary lesson pdf\"` returned only general Peace Corps language-lesson material for other countries/languages (Hausa, Mooré, Indonesian, Arabic) with no Dari-specific seasons content. `WebSearch \"DLI Dari basic course seasons lesson fsi-languages.yojik.eu\"` surfaced the DLI Dari Basic Course (Defense Language Institute Foreign Language Center, Validation Edition 2005) hosted on the same fsi-languages.yojik.eu domain already used as this course's established source for other units; `WebFetch` on the course's own index page (fsi-languages.yojik.eu/languages/DLI/DLI-Dari.html) confirmed -- as prior units already found for other topics -- that the index lists only semester/lesson-group PDF filenames with no per-lesson topic titles, so no dedicated seasons lesson could be located from the index alone. Per this session's task instructions, when a WebFetch hits a binary/large PDF, `pdftotext` was tried as a local fallback: the Semester 1 Lessons 21-24 PDF (whose lesson titles -- \"In the Afghan Army,\" \"At the Information Desk,\" \"Various Businesses in Town,\" \"A Cancellation\" -- are NOT seasons-themed, confirmed by extracting the table of contents) was downloaded and run through `pdftotext -layout`, and its cumulative course glossary (not a dedicated lesson) was found to genuinely contain فصل (season), بهار (spring), تابستان (summer), خزان (fall/autumn), and زمستان (winter) as real, standard Dari vocabulary entries -- a genuine primary-source confirmation, not a guess, though (like unit38's colors search) it confirms vocabulary only, not a dedicated seasons lesson/dialogue scenario within the DLI course structure itself. This also gave a real primary-source confirmation that Afghan Dari's standard word for autumn/fall is خزان, distinct from Iranian Farsi's more common پاییز -- a genuine dialect-vocabulary divergence of the same kind already flagged for موتر/تکت in unit24, not a guess. Given no dedicated seasons lesson exists in the located DLI/Peace Corps material, this unit's scenario, dialogue, and reading passage are authored fresh from already-established in-course conventions (unit22's هوا/گرم/سرد/باران/برف/آفتابی/می‌شود/می‌بارد/امروز/فردا/در, unit14's دوست دارم/دارین/دارد/ندارم/کدام/را preference paradigm, unit29's محبوب, unit09's سال, unit04's چهار), extended with the six new season/weather words above plus خنک (cool), modernized current spoken Kabul Dari register throughout, not a translation of any single source."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's realization. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans; no internal-jargon/snake_case leaks in learner-facing options/distractors/pairs; all matching_pairs exercises have 6-12 pairs per AUTHORING_GUIDE.md #16; all exercise types used (multiple_choice/matching_pairs/word_order/translation/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx; no listen_select/dialogue_response/other audio-dependent exercises exist (correctly following AUTHORING_GUIDE.md #14's prs no-TTS restriction, so the nl-unit44-50-style same-speaker-distractor bug class does not apply here -- this unit's multiple_choice exercises are pure text-translation recognition, not audio clip identification); every dialogue teaching-card title matches its own gloss exactly; cross-lesson facts (prices, times, character preferences, item colors/locations) are consistent everywhere referenced within the unit. Dari register/grammar read as sound, consistent Kabul Dari throughout, matching this course's established استم/استین uncontracted register and Afghan-not-Iranian vocabulary choices.\n\nReview 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in the overlay). NATIVE FLAGS: see overlay."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-38), though this unit's season-description
    sentences are mostly 3rd-person (است/می‌شود/می‌بارد) since seasons and
    weather, not people, are being described -- no استم/استین forms are
    needed for that, and none are forced in artificially. The
    Homayoun/Zarmina dialogue (lesson04) continues their established
    informal تو-register friendship from units 20/21/22/25/27/37/38, here
    using the formal-neutral شما/دارین forms toward each other about
    their own preferences, matching the register already used in their
    unit22/unit38 dialogues. خزان (autumn/fall) is a deliberate
    Afghan-Dari-specific vocabulary choice over Iranian Farsi's more
    common پاییز, confirmed against the real DLI Dari course glossary
    during this unit's source research -- the same kind of
    dialect-divergence flag already documented for موتر/تکت in unit24.
    All other new season vocabulary (بهار، تابستان، زمستان، خنک) is
    standard everyday Kabul Dari, shared with Farsi, no register-specific
    substitution needed.

