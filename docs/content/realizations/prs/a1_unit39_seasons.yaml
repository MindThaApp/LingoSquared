              - {left: "در خزان هوا خنک می‌شود.", right: "In autumn the weather becomes cool."}
              - {left: "در زمستان برف می‌بارد.", right: "In winter it snows."}
              - {left: "تابستان آفتابی است.", right: "Summer is sunny."}
              - {left: "زمستان سرد است و برف می‌بارد.", right: "Winter is cold and it snows."}
