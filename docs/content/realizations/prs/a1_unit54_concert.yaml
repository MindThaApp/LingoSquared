          - content_key: prs.a1.unit54.lesson02.teach.ask_start_time_phrase
            kind: phrase
            target: {text: "کنسرت کی شروع می‌شود؟", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit54.lesson02.teach.answer_start_time_phrase
            kind: phrase
            target: {text: "کنسرت ساعت هشت شب شروع می‌شود.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit54.lesson02.exercise01.recognize_start_word
            type: multiple_choice
            tested_text: شروع
            prompt: {target_blocks: [{text: شروع, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit54.lesson02.exercise02.reading_who_sings
