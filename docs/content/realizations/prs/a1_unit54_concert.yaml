units:
  - content_key: prs.a1.unit54.concert
    title: کنسرت
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.concert.attend_a_concert
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit54.lesson01.concert_and_singer_vocabulary
        title: کنسرت و خواننده
        spine_outcome_id: universal.a1.concert.attend_a_concert
        teaching:
          - content_key: prs.a1.unit54.lesson01.teach.review_this_is_in_good
            kind: grammar_note
            target: {text: "این (this) / است (is) / در (in) / خوب (good)", language_code: prs, direction: rtl}
            introduced_tokens: [این, است, در, خوب]
          - content_key: prs.a1.unit54.lesson01.teach.concert_word
            kind: vocabulary
            target: {text: کنسرت, language_code: prs, direction: rtl}
            introduced_tokens: [کنسرت]
            example: {text: "این کنسرت خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit54.lesson01.teach.singer_word
            kind: vocabulary
            target: {text: خواننده, language_code: prs, direction: rtl}
            introduced_tokens: [خواننده]
            example: {text: "خواننده در کنسرت است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit54.lesson01.teach.this_is_concert_phrase
            kind: phrase
            target: {text: "این کنسرت است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit54.lesson01.teach.singer_at_concert_phrase
            kind: phrase
            target: {text: "خواننده در کنسرت است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit54.lesson01.exercise01.recognize_concert_word
            type: multiple_choice
            tested_text: کنسرت
            prompt: {target_blocks: [{text: کنسرت, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit54.lesson01.exercise02.recognize_singer_word
            type: multiple_choice
            tested_text: خواننده
            prompt: {target_blocks: [{text: خواننده, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit54.lesson01.exercise03.recognize_singer_at_concert
            type: multiple_choice
            tested_text: "خواننده در کنسرت است."
            prompt: {target_blocks: [{text: "خواننده در کنسرت است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit54.lesson01.exercise04.match_concert_singer_vocab
            type: matching_pairs
            tested_text: "کنسرت خواننده این است در این کنسرت است. خواننده در کنسرت است."
            prompt: {target_blocks: []}
            pairs:
              - {left: کنسرت, right: concert}
              - {left: خواننده, right: singer}
              - {left: این, right: this}
              - {left: است, right: is}
              - {left: در, right: in}
              - {left: "این کنسرت است.", right: "This is a concert."}
              - {left: "خواننده در کنسرت است.", right: "The singer is at the concert."}
          - content_key: prs.a1.unit54.lesson01.exercise05.order_singer_at_concert
            type: word_order
            tested_text: "خواننده در کنسرت است"
            prompt: {target_blocks: []}
            word_bank: [خواننده, در, کنسرت, است]
          - content_key: prs.a1.unit54.lesson01.exercise06.translate_singer_at_concert
            type: translation
            tested_text: "خواننده در کنسرت است."
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit54.lesson01.exercise07.write_concert
            type: writing_prompt
            tested_text: کنسرت
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit54.lesson02.concert_poster
        title: اعلان کنسرت
        spine_outcome_id: universal.a1.concert.attend_a_concert
        teaching:
          - content_key: prs.a1.unit54.lesson02.teach.review_price_and_time_words
            kind: grammar_note
            target: {text: "چند (how much) / افغانی (afghani) / است (is) / سی (thirty) / ساعت (o'clock) / هشت (eight) / شب (evening) / می‌شود (happens) / در (in) / بلیط (ticket)", language_code: prs, direction: rtl}
