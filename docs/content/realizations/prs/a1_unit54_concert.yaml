      - content_key: prs.a1.unit54.lesson03.proposing_to_go_to_a_concert
        title: پیشنهاد رفتن به کنسرت
        spine_outcome_id: universal.a1.concert.attend_a_concert
        teaching:
          - content_key: prs.a1.unit54.lesson03.teach.review_propose_words
            kind: grammar_note
            target: {text: "می‌خواهین (do you want, polite) / جمعه (Friday) / برویم (let's go)", language_code: prs, direction: rtl}
            introduced_tokens: ["می‌خواهین", جمعه, برویم]
