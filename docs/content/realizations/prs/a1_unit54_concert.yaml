generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits remain exhausted this session (confirmed fresh via `firecrawl search \"Dari کنسرت concert vocabulary phrasebook Afghan\"`, which returned HTTP 402 -- 0/1000 credits, 0% left this cycle, same status every prior unit this session already found). Before falling back, the shared scratchpad's already-cached DLI Dari corpus (`.firecrawl/dli-dari-s9-12.txt`, `s17-20.txt`, `s21-24.txt`, `s25-28.txt`, `s29-32.md` -- the subset of the full corpus still present in this session's scratchpad; earlier sessions' notes reference a larger cached set that isn't all still on disk) was searched fresh for this specific topic: an English-keyword grep (concert, singer, music, band) across all 5 cached files found zero occurrences of \"concert\" or کنسرت anywhere, but DID find a genuine, real hit for \"singer\": all 5 files' own vocabulary glossaries list singer as آوازخوان with خواننده given as a parenthetical synonym (‫آوازخوان )خانﻨده(‬ / ‫خانﻨده )آوازخوان(‬, ordering varies slightly by semester), and s17-20 additionally glosses a wedding-party passage mentioning \"music, and dancing\" (no Dari term extracted from that specific sentence in the OCR text). This independently confirms خواننده as genuine, source-attested Dari vocabulary for \"singer\" (not just an assumed Farsi-cognate guess), even though this course keeps خواننده rather than the more classical آوازخوان as the primary term, since خواننده is the plainer, more common modern word and matches this course's own established educated-colloquial register (unit53's own museum unit already established خواننده is not used, so this is genuinely this unit's own vocabulary choice, cross-checked against the DLI glossary after the fact, not copied from any earlier prs unit). No DLI attestation exists for \"concert\" itself in any cached file, so per AUTHORING_GUIDE.md #10's own fallback provision (used identically by several earlier units this session, e.g. unit50/unit52/unit53, when the located DLI material didn't cover the specific topic), کنسرت is authored fresh as a standard modern Dari/Farsi loanword (borrowed from English/French \"concert\" the same way this unit's own predecessor unit53 already borrowed موزیم from \"museum\"), disclosed honestly as a course-internal choice rather than a DLI-sourced word. Three genuinely new words needed, disclosed honestly: کنسرت (concert, standard modern loanword, not DLI-attested), شروع (start/beginning, standard everyday Dari/Persian word; the cached DLI glossary contains a garbled OCR row consistent with \"start / to begin\" existing as a glossary entry but not legibly spelled, so this is authored from established general Dari knowledge rather than a clean DLI citation), and سیما (Sima, a genuine, common Afghan female given name used here as an invented fictional singer's name, matching unit52's own precedent of inventing a fictional film title آسمان for the exact same read_concert_poster/read_cinema_schedule-style requirement -- disclosed honestly as invented, not a real performer). Built otherwise entirely from this course's own already-established vocabulary and grammar: این/است/در/خوب (multiple early units), کارمند (unit45/unit50/unit52/unit53's own established generic staff/employee word, reused here for the concert ticket counter exactly as those units already established the کارمند+service-context pattern), چند/افغانی/سی/هشت/ده/پنجاه (unit04's established number and unit08's established currency words), ساعت/شب (unit11/unit01's established time words), می‌شود (unit12/unit22/unit39's established light-verb form, reused here in the new combination شروع می‌شود \"it starts\"), کی (unit16's established \"when\" question word), شما/می‌خواهم/یک/بلیط/را/لطفاً/سلام/بفرمایین/تشکر زیاد/خواهش می‌کنم/بسیار خوب (units01/02/08/09/10/16/40/46-53's established patterns and politeness formulas), می‌خواهین/جمعه/برویم (unit13's established plan-proposing frame, reused here with a new noun exactly as unit53 itself reused unit50's باز/بسته opening-hours frame -- a legitimate same-course structure reuse per AUTHORING_GUIDE.md #3, not a copied sentence, since the underlying activity noun (کنسرت, not پارک) is genuinely different), بلی (unit03's established \"yes\"), عالی/قبول (unit13's established plan-accepting words), به (unit06's established \"to\"), او/رفت (unit20's established 3rd-person \"he/she\"/\"went\"), دید (unit53's own established 3rd-person \"saw\", now review since unit53 already shipped), بود (unit21's established \"was\"), اما (unit33/unit39-53's established contrast word), and بلیط‌تان (unit50/unit52/unit53's own established -تان possessive extension applied to بلیط). No new grammar item this unit -- رفت/دید/بود are all already-established 3rd-person past forms (unlike unit53, which needed to introduce دید's 3rd-person cell fresh), so this unit is pure vocabulary depth plus the same already-established plan-proposing/service-dialogue/read-a-notice/read-a-recap/wrap-up-contrast lesson shapes unit50-53 already use. Deliberately kept the two concrete fact pairs this unit states -- the primary showtime/price (ساعت هشت شب / سی افغانی, for سیما's concert, stated identically in lesson02's poster reading, lesson04's dialogue, and lesson05's reading passage) and the wrap-up's second, unrelated showtime/price (ساعت ده شب / پنجاه افغانی, introduced only in lesson06 for contrast) -- as independently stated, never-summed facts, per AUTHORING_GUIDE.md #11's own warning about comparative/total facts; this unit never asks the learner to add a price and a time together, and never restates سیما's identity as the concert's singer with any conflicting variant."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit53 (museum). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.concert.attend_a_concert as the next unrealized A1 outcome, immediately after museum. Both listed prerequisites -- universal.a1.plans.make_simple_plans [unit13] and universal.a1.money.handle_basic_money_matters [unit23] -- are already realized in prs. Matches all four of the outcome's own assessment_requirements: understand_concert_information (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14, testing the poster's start-time/singer facts in lesson02 and the staff member's statements in lesson04), request_concert_ticket (speaking substituted the same way this whole corpus substitutes it -- production exercises asking for a ticket in lesson04, matching unit51-53's own precedent), read_concert_poster (lesson02's reading card, a genuine notice-style sentence naming the singer, the start time, AND the ticket price together, matching unit52's own آسمان film-schedule precedent for this exact three-fact-together shape), and write_concert_message (writing_prompt exercises across all six lessons). Six lessons, one more than the two-fact museum/cinema shape because this outcome's own can_do explicitly names \"make plans\" as a distinct step (backed by its own plans.make_simple_plans prerequisite, unlike museum/cinema's can_do statements, which don't mention plan-making at all): concert-and-singer vocabulary (کنسرت/خواننده new), reading a concert poster giving the singer's name/start time/price (شروع/سیما new), proposing a plan to go to the concert on Friday and accepting it (pure recombination of unit13's own established می‌خواهین/جمعه/برویم/عالی است/قبول است frame applied to a new noun, plus بلی reviewed from unit03, ending in a dialogue_response production exercise matching unit13's own lesson02/03 shape), a Homayoun/کارمند concert-ticket-counter dialogue combining all of lessons 01-02's vocabulary (no new vocabulary, pure recombination, same established precedent unit51-53 already use), a third-person reading passage recapping the same visit (رفت/دید/بود all reviewed, not fresh, since unit53 already established دید's 3rd-person cell -- this unit needed no new grammar), and a wrap-up contrasting سیما's concert's showtime/price with an unrelated second showtime/price using اما plus a formal تان-suffixed ticket-price question, mirroring unit39-53's own wrap-up shape. Deliberately kept the two showtime/price facts (ساعت هشت شب / سی افغانی for سیما's concert, stated identically in lesson02/lesson04/lesson05; ساعت ده شب / پنجاه افغانی, introduced only in lesson06 for contrast) as two clearly distinct, never-summed facts -- no arithmetic is ever asked of the learner, and سیما's identity as the singer is restated identically everywhere it appears (lesson02/lesson04/lesson05), never with a conflicting variant. Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit53's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در/خوب از multiple earlier units، کارمند از unit45/unit50/unit52/unit53، چند/افغانی/سی/هشت/ده/پنجاه از unit04/unit08، ساعت/شب از unit01/unit11، می‌شود از unit12/unit22/unit39، کی از unit16، شما/می‌خواهم/یک/بلیط/را/لطفاً از unit01/unit02/unit08/unit16، سلام/بفرمایین/تشکر زیاد/خواهش می‌کنم/بسیار خوب از units01/09/10/40/46-53، می‌خواهین/جمعه/برویم/عالی/قبول از unit13، بلی از unit03، به از unit06، او/رفت از unit20، دید از unit53، بود از unit21، اما از unit33/unit39-53، بلیط‌تان از unit50/unit52/unit53. Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit41/unit47-53's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. No multi-clause (period/comma/اما-joined) accepted_answers exist beyond the single canonical comma-اما wrap-up sentence, matching unit33/39-53's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise -- confirmed by explicit review, not assumed. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md #13/#17 don't arise either. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's dialogue lines and their speakers (همایون: 3 lines; کارمند: 3 lines) were listed and cross-checked by hand before writing any multiple_choice distractor to confirm no distractor is an ambiguous paraphrase of the line actually being tested -- همایون's three lines (wanting a ticket / asking the price / thanking) and کارمند's three lines (welcoming with the showtime / stating the price / replying \"you're welcome\") are all topically distinct enough that no distractor risks being a line the tested speaker also says elsewhere. Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (کنسرت, خواننده, شروع, سیما) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: lesson02's stated showtime (ساعت هشت شب) and price (سی افغانی) for سیما's concert and their identical restatement in lesson04's dialogue and lesson05's reading passage are consistent; lesson06's second, unrelated showtime/price pair (ساعت ده شب / پنجاه افغانی) appears only in lesson06 and is never combined arithmetically with the first pair; سیما's identity as the singer is never contradicted anywhere in the unit. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-53). Lesson03's plan-proposing exchange reuses
    unit13's own established می‌خواهین (formal "do you want") frame applied
    to a new noun (کنسرت instead of پارک), not a copied sentence. Lesson04's
    dialogue introduces the concert ticket counter's کارمند role opposite
    the established Homayoun character, reusing the same polite-service
    register unit08's دکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند
    هوتل, unit50's pool کارمند, unit52's cinema کارمند, and unit53's
    museum کارمند exchanges already established -- not the informal-تو
    friendship register (lesson03's plan-proposing dialogue, by contrast,
    uses the same friendly-but-formal می‌خواهین register unit13 itself
    already established for that specific speech act, not informal-تو
    either). Lesson05's reading passage uses a 3rd-person statement naming
    همایون explicitly in its first sentence, then او in the following
    sentences, matching unit27/unit41/unit47-53's own reading-passage
    precedent, and lesson06's wrap-up uses the same formal شما-تان-suffixed
    question pattern unit39-53 already established.

