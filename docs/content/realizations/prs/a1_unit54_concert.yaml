            prompt:
              target_blocks:
                - {text: "سیما خواننده است. کنسرت ساعت هشت شب شروع می‌شود. بلیط سی افغانی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit54.lesson02.exercise03.reading_start_time
            type: multiple_choice
            tested_text: "کنسرت ساعت هشت شب شروع می‌شود"
            prompt:
              target_blocks:
                - {text: "سیما خواننده است. کنسرت ساعت هشت شب شروع می‌شود. بلیط سی افغانی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit54.lesson02.exercise04.match_poster_vocab
