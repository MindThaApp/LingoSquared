generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits remain exhausted this session, so real, direct WebFetch/curl access plus local pdftotext extraction was used, per this task's own instructions. This task's job was to find the next unrealized A1 spine outcome after unit48 (bike_rental): universal.a1.laundry.use_launderette ('use a launderette or laundry service'). Rather than only trusting prior units' own disclosed exhaustive-search claims, this task did fresh, targeted keyword greps (English laundry/launderette/washing machine/wash clothes/dry-clean, plus direct Dari-script greps for لباس شویی/لباس شستن/رخت شویی/رخت شستن/کالا شستن/خشکشویی) across a freshly re-downloaded corpus: all 10 Semester 1 student-book PDFs (s1-4 through s37-40, downloaded and pdftotext-extracted fresh this task since prior units' extracted text was not persisted across sessions), plus all 4 Semester 2/3 combined student-book PDFs (S Book 1-20, S Book 21-40, Sem 3 S Book 1, Sem 3 S Book 2) -- the 'Other documents' supplements (All conversations, All Scenarios, Discussion, Fill-ins, Short Stories, Cards 41-60/61-80, Performance Checks, Comprehensive military topics) were NOT re-downloaded this task, since unit48's own provenance note already discloses a full keyword-negative check of all nine of those files for a different topic and the two NEW hits this task found (see below) both came from the student-book corpus itself, not those supplements. Semester 1's full student corpus came back completely negative for every laundry-related keyword. Semester 2 Book 21-40's Unit 29 'Chores' flashcard set (a scrambled vocabulary-matching page) contains لباس شستن glossed as 'wash clothes' -- a genuine, real Dari phrase for the verb 'to wash clothes,' but as a chores-vocabulary item, not a launderette/laundry-service scenario (and this course's own unit33 household/chores unit, already realized, never used it -- unit33 only taught شستن/می‌شویم for washing DISHES, so لباس شستن does not collide with any already-shipped content). Semester 3 Book 1's B1-level 'Discussion' section (Topic 2, 'The Minimal Participation of Afghan Men in Housework') glosses کالا شویی = شستن لباسها as 'doing laundry' -- again a real, source-attested phrase confirming لباس شستن/شستن لباس as authentic modern Dari for 'to do laundry,' but as one vocabulary item in an advanced discussion-topic list about a social issue, not a launderette scenario with wash cycles, pricing, or pickup instructions. Neither hit provides a scaffold for this outcome's actual assessment_requirements (wash cycle/type, cost, pickup time, a launderette notice) -- the DLI corpus, now checked across BOTH its full Semester 1 student corpus (fresh, targeted keyword search, not just prior units' own topic-specific searches) and its Semester 2/3 combined student books, has no dedicated bicycle-rental-style laundry-shop lesson. Given this, and per AUTHORING_GUIDE.md #10's own fallback provision, this unit is authored FRESH, built entirely from this course's OWN already-established in-corpus vocabulary and grammar: لباس (clothes, unit21 clothing), دوکان/دوکاندار (shop/shopkeeper, unit10 shopping, reused across many later units), شستن/می‌شویم/می‌شوید (wash / I wash / he-she washes, unit33 household -- there taught for washing DISHES, extended here to a new object, clothes, the exact same low-complexity-extension precedent unit48 itself used for بگیرم), کیلو (kilo, unit10 shopping, reused for a different priced good), به (to/per, unit21/unit22), قیمتش/چند/افغانی/سی/پنجاه (price/how-much/afghani/thirty/fifty, unit04/unit10/unit23/unit46/unit47/unit48), کی/ساعت/پنج (when/o'clock/five, unit16/unit48 for کی, unit04/unit11 for ساعت and پنج), می‌خواهد (3rd-person 'wants,' the exact same already-established precedent unit47/unit48 both set for introducing a 3rd-person cell of an already-taught 1st-person verb as low-complexity, not a new grammar point, re-declared fresh in this file per the compiler's per-file taught-vocabulary check), and بسیار خوب/تشکر زیاد/خواهش می‌کنم/بفرمایین/سلام/بلی (established politeness formulas from many earlier units). Two new content words, both independently source-attested inside this exact DLI corpus this task freshly checked (not invented): لباس شویی (laundry / laundry service -- built compositionally from this course's own already-taught لباس plus the شویی root the DLI corpus itself glosses as 'washing' in both the Semester 2 Chores set and the Semester 3 Discussion vocabulary list, and reusing this course's own established لباس over the DLI Discussion list's more formal/administrative کالا 'goods,' matching AUTHORING_GUIDE.md's dialect-authenticity discipline of preferring this course's own prior vocabulary decisions), and تیار (ready -- standard, everyday modern Dari/Persian adjective for 'ready,' not source-derived, chosen for stating a pickup time, parallel to how unit48 needed پس دادن for a return time with no direct source hit either). One additional new content word, also standard modern Dari/Persian vocabulary and not source-derived: اتو (iron/ironing), used to model a realistic Afghan urban laundry/dry-cleaning service's two common price tiers (wash-only vs. wash-and-iron) -- Afghan launderettes are typically full-service drop-off shops rather than coin-operated self-service machines with cycle dials, so 'wash cycle' from the spine outcome's own can_do/assessment_requirements wording is modernized here into this authentic two-tier service-type choice rather than a literal machine-cycle-selector concept, per AUTHORING_GUIDE.md #10's mandatory-modernization requirement. One expected paradigm cell beyond می‌خواهد: بشویم (subjunctive 'so that I wash'), the exact same mechanical -ب-prefix subjunctive-formation pattern already used throughout this corpus (بگیرم from گرفتن, unit42/43/48) applied to the already-taught شستن/می‌شویم stem -- introduced as a bundled review grammar_note, the same low-complexity-extension treatment unit47/48 already gave similar forms (اصلاح می‌کند, بگیرد, پس می‌دهم), not a standalone vocabulary card."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit48 (bike_rental). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.laundry.use_launderette as the next unrealized A1 outcome (immediately after bike_rental in the spine file's own line order; both listed prerequisites -- universal.a1.money.handle_basic_money_matters [unit23] and universal.a1.household.describe_chores [unit33] -- are already realized). This unit covers using a laundry/dry-cleaning shop: dropping off clothes to be washed (or washed and ironed), asking the price per kilo, and understanding a pickup time -- matching all four of the outcome's own assessment_requirements: understand_laundry_instructions (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14, testing the shopkeeper's combined price-plus-pickup-time statement in lesson04/lesson05), request_laundry_service (speaking substituted the same way this whole corpus substitutes it -- production exercises: translation/writing_prompt/word_order naming the service request or wash-type choice), read_laundry_notice (lesson05's reading passage recapping lesson02/03's own dialogue-adjacent facts -- service type, price, ready time -- per AUTHORING_GUIDE.md #11), and write_laundry_message (writing_prompt exercises across all six lessons). Six lessons: laundry-shop vocabulary (لباس شویی new; لباس/دوکان/دوکاندار reviewed from unit21/unit10), asking to wash clothes and the per-kilo price for a plain wash (بشویم introduced as the expected subjunctive of already-taught شستن/می‌شویم, unit33; قیمتش/به/کیلو/چند/افغانی/سی reviewed from unit04/unit10/unit21/unit22/unit46/unit47/unit48), the wash-and-iron option and asking when it's ready (اتو new; تیار new; شستن/و/کی/ساعت/پنج reviewed), a Homayoun/دوکاندار laundry-shop dialogue combining all of lessons 01-03's vocabulary (no new vocabulary in this lesson, pure recombination, matching unit48's own established precedent that a dialogue lesson doesn't always need fresh vocabulary of its own), a third-person reading passage recapping the same visit's facts (می‌خواهد re-declared fresh in this file as the expected 3rd-person paradigm cell of already-taught می‌خواهم, matching unit47/unit48's own precedent for introducing an expected paradigm cell as low-complexity, not a new grammar point), and a wrap-up contrasting the wash-only price with the wash-and-iron price using اما plus a formal تان-suffixed rental-style question, mirroring unit39-48's own wrap-up shape (لباس شویی‌تان, 'your laundry,' reusing the same -تان suffix pattern as unit48's کرایه‌تان and unit47's قرارتان). Deliberately used two DIFFERENT flat per-kilo rates (30 afghanis for wash-only, 50 afghanis for wash-and-iron) that are never combined into a total/multiplied figure anywhere in the unit, precisely to avoid any AUTHORING_GUIDE.md #11 arithmetic-consistency risk -- both rates are stated identically every place they're referenced (lesson02/lesson06 for the 30-afghani rate; lesson03/lesson04/lesson05/lesson06 for the 50-afghani rate), cross-checked by hand. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (این/است/در از multiple earlier units, لباس از unit21, دوکان/دوکاندار از unit10 (reused unit18/unit23/unit34/unit48), شستن/می‌شویم/می‌شوید از unit33, کیلو از unit10, به از unit21/unit22, قیمتش/چند/افغانی از unit10/unit21/unit46/unit47, سی از unit04, پنجاه از unit10/unit23/unit48, کی از unit16/unit48, ساعت/پنج از unit04/unit11, بسیار خوب/تشکر زیاد/خواهش می‌کنم/بفرمایین/سلام/بلی از units01/09/10/40/46/47/48, اما از unit33/unit39-48, او از multiple earlier units, می‌خواهد از unit47/unit48's own precedent (re-declared fresh here per-file)). Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit47/unit48's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form only, matching unit33/39-48's own established precedent that this construction has exactly one natural conjunction reading -- no other multi-clause translate/write exercise exists in this unit, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead. Zero fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs). Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (لباس شویی, اتو, تیار) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. §11 cross-lesson fact check: lesson02/lesson06's stated wash-only rate (به کیلو سی افغانی, 30 afghanis/kilo) is identical everywhere it's referenced; lesson03/04/05/06's stated wash-and-iron rate (به کیلو پنجاه افغانی, 50 afghanis/kilo) is identical everywhere it's referenced; the two rates are never multiplied against a stated quantity anywhere, so no total-price arithmetic exists to conflict. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

