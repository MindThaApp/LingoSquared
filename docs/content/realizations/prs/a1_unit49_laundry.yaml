units:
  - content_key: prs.a1.unit49.laundry
    title: لباس شویی
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.laundry.use_launderette
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit49.lesson01.laundry_shop_vocabulary
        title: دوکان لباس شویی
        spine_outcome_id: universal.a1.laundry.use_launderette
        teaching:
          - content_key: prs.a1.unit49.lesson01.teach.review_this_is_in
            kind: grammar_note
            target: {text: "این (this) / است (is) / در (in)", language_code: prs, direction: rtl}
            introduced_tokens: [این, است, در]
          - content_key: prs.a1.unit49.lesson01.teach.review_clothes_shop_shopkeeper
            kind: grammar_note
            target: {text: "لباس (clothes) / دوکان (shop) / دوکاندار (shopkeeper)", language_code: prs, direction: rtl}
            introduced_tokens: [لباس, دوکان, دوکاندار]
          - content_key: prs.a1.unit49.lesson01.teach.laundry_word
            kind: vocabulary
            target: {text: "لباس شویی", language_code: prs, direction: rtl}
            introduced_tokens: ["لباس شویی"]
            example: {text: "این دوکان لباس شویی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit49.lesson01.teach.this_is_laundry_shop_phrase
            kind: phrase
            target: {text: "این دوکان لباس شویی است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit49.lesson01.teach.shopkeeper_at_shop_phrase
            kind: phrase
            target: {text: "دوکاندار در دوکان است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit49.lesson01.exercise01.recognize_laundry_word
            type: multiple_choice
            tested_text: "لباس شویی"
            prompt: {target_blocks: [{text: "لباس شویی", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit49.lesson01.exercise02.recognize_laundry_shop
            type: multiple_choice
            tested_text: "این دوکان لباس شویی است."
            prompt: {target_blocks: [{text: "این دوکان لباس شویی است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit49.lesson01.exercise03.recognize_shopkeeper_at_shop
            type: multiple_choice
            tested_text: "دوکاندار در دوکان است."
            prompt: {target_blocks: [{text: "دوکاندار در دوکان است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit49.lesson01.exercise04.match_laundry_shop_vocab
            type: matching_pairs
            tested_text: "لباس شویی لباس دوکان دوکاندار در این دوکان لباس شویی است. دوکاندار در دوکان است."
            prompt: {target_blocks: []}
            pairs:
              - {left: "لباس شویی", right: laundry}
              - {left: لباس, right: clothes}
              - {left: دوکان, right: shop}
              - {left: دوکاندار, right: shopkeeper}
              - {left: در, right: in}
              - {left: "این دوکان لباس شویی است.", right: "This is a laundry shop."}
              - {left: "دوکاندار در دوکان است.", right: "The shopkeeper is at the shop."}
          - content_key: prs.a1.unit49.lesson01.exercise05.order_shopkeeper_at_shop
            type: word_order
            tested_text: "دوکاندار در دوکان است"
            prompt: {target_blocks: []}
            word_bank: [دوکاندار, در, دوکان, است]
          - content_key: prs.a1.unit49.lesson01.exercise06.translate_shopkeeper_at_shop
            type: translation
            tested_text: "دوکاندار در دوکان است."
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit49.lesson01.exercise07.write_laundry
            type: writing_prompt
            tested_text: "لباس شویی"
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit49.lesson02.washing_clothes_and_price_per_kilo
        title: می‌خواهم لباس‌ها را بشویم — قیمت به کیلو
        spine_outcome_id: universal.a1.laundry.use_launderette
        teaching:
          - content_key: prs.a1.unit49.lesson02.teach.review_want_object_wash
            kind: grammar_note
            target: {text: "می‌خواهم (I want) / را (object marker) / بشویم (so that I wash — subjunctive of شستن)", language_code: prs, direction: rtl}
            introduced_tokens: [می‌خواهم, را, "بشویم"]
          - content_key: prs.a1.unit49.lesson02.teach.review_clothes_plural
            kind: grammar_note
            target: {text: "لباس‌ها (the clothes — plural of لباس)", language_code: prs, direction: rtl}
            introduced_tokens: ["لباس‌ها"]
          - content_key: prs.a1.unit49.lesson02.teach.want_to_wash_phrase
            kind: phrase
            target: {text: "می‌خواهم لباس‌ها را بشویم.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit49.lesson02.teach.review_price_per_kilo_price
            kind: grammar_note
            target: {text: "قیمتش (its price) / به (to / per) / کیلو (kilo) / چند (how much) / افغانی (afghani) / سی (thirty)", language_code: prs, direction: rtl}
            introduced_tokens: [قیمتش, به, کیلو, چند, افغانی, سی]
          - content_key: prs.a1.unit49.lesson02.teach.ask_price_per_kilo_phrase
            kind: phrase
            target: {text: "قیمتش به کیلو چند افغانی است؟", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit49.lesson02.teach.price_per_kilo_answer_phrase
            kind: phrase
            target: {text: "به کیلو سی افغانی است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit49.lesson02.exercise01.recognize_want_to_wash
            type: multiple_choice
            tested_text: "می‌خواهم لباس‌ها را بشویم."
            prompt: {target_blocks: [{text: "می‌خواهم لباس‌ها را بشویم.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit49.lesson02.exercise02.recognize_ask_price_per_kilo
            type: multiple_choice
            tested_text: "قیمتش به کیلو چند افغانی است؟"
            prompt: {target_blocks: [{text: "قیمتش به کیلو چند افغانی است؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit49.lesson02.exercise03.recognize_price_per_kilo_answer
            type: multiple_choice
            tested_text: "به کیلو سی افغانی است."
            prompt: {target_blocks: [{text: "به کیلو سی افغانی است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit49.lesson02.exercise04.match_wash_price_per_kilo
            type: matching_pairs
            tested_text: "لباس‌ها بشویم به کیلو می‌خواهم لباس‌ها را بشویم. قیمتش به کیلو چند افغانی است؟ به کیلو سی افغانی است."
            prompt: {target_blocks: []}
            pairs:
              - {left: "لباس‌ها", right: "the clothes"}
              - {left: بشویم, right: "so that I wash"}
              - {left: به, right: "to / per"}
              - {left: کیلو, right: kilo}
              - {left: سی, right: thirty}
              - {left: "می‌خواهم لباس‌ها را بشویم.", right: "I want to wash the clothes."}
              - {left: "به کیلو سی افغانی است.", right: "It's 30 afghanis per kilo."}
          - content_key: prs.a1.unit49.lesson02.exercise05.order_want_to_wash
            type: word_order
            tested_text: "می‌خواهم لباس‌ها را بشویم"
            prompt: {target_blocks: []}
            word_bank: [می‌خواهم, "لباس‌ها", را, بشویم]
          - content_key: prs.a1.unit49.lesson02.exercise06.translate_ask_price_per_kilo
            type: translation
            tested_text: "قیمتش به کیلو چند افغانی است؟"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit49.lesson02.exercise07.write_wash_subjunctive
            type: writing_prompt
            tested_text: بشویم
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit49.lesson03.wash_and_iron_and_ready_time
        title: شستن و اتو — کی تیار است؟
        spine_outcome_id: universal.a1.laundry.use_launderette
