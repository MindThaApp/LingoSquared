  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's realization. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans; no internal-jargon/snake_case leaks in learner-facing options/distractors/pairs; all matching_pairs exercises have 6-12 pairs per AUTHORING_GUIDE.md #16; all exercise types used (multiple_choice/matching_pairs/word_order/translation/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx; no listen_select/dialogue_response/other audio-dependent exercises exist (correctly following AUTHORING_GUIDE.md #14's prs no-TTS restriction, so the nl-unit44-50-style same-speaker-distractor bug class does not apply here -- this unit's multiple_choice exercises are pure text-translation recognition, not audio clip identification); every dialogue teaching-card title matches its own gloss exactly; cross-lesson facts (prices, times, character preferences, item colors/locations) are consistent everywhere referenced within the unit. Dari register/grammar read as sound, consistent Kabul Dari throughout, matching this course's established استم/استین uncontracted register and Afghan-not-Iranian vocabulary choices.\n\nReview 2026-10-20 (en-prs A1 pass): 1 fixes - Hello, welcome gloss for the shopkeeper greeting in the matching pair. NATIVE FLAGS: لباس (clothes) and لباس شویی (laundry): confirm these are natural in Kabuli speech or whether کالا / خشکشویی / رخت‌شویی would be preferred; confirm the spaced compound لباس شویی versus لباس‌شویی with ZWNJ; بفرمایین used as a shopkeeper greeting. Owner follow-up 2026-10-20: register_policy metadata spelling دکاندار changed to دوکاندار."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-48). Lesson04's dialogue introduces the
    established Homayoun character opposite a دوکاندار (shopkeeper) role,
    reusing the same polite-service register unit08's/unit10's
    دوکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit46's
    دواساز, unit47's دلاک, and unit48's دوکاندار exchanges already
    established -- not the informal-تو friendship register. Lesson05's
    reading passage uses a 3rd-person statement naming همایون explicitly
    in its first sentence, then او in the following sentences, matching
    unit27/unit47/unit48's own reading-passage precedent, and lesson06's
    wrap-up uses the same formal شما-تان-suffixed question pattern
    unit39-48 already established.

