          - content_key: prs.a1.unit49.lesson03.teach.want_wash_and_iron_phrase
            kind: phrase
            target: {text: "شستن و اتو می‌خواهم.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit49.lesson03.teach.ready_word
            kind: vocabulary
            target: {text: تیار, language_code: prs, direction: rtl}
