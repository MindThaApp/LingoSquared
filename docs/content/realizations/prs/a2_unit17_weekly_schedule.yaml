            type: translation
            tested_text: "در روزهای هفته اول به دفتر می‌روم بعد ورزش می‌کنم"
            prompt: {target_blocks: []}
          - content_key: prs.a2.unit17.lesson02.exercise05.write_weekend_activity
            type: writing_prompt
            tested_text: "در آخر هفته دیر بیدار می‌شوم و با فامیلم وقت می‌گذرانم"
