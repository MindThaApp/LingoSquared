            example: {text: "تفاوت زیادی بین روزهای هفته و آخر هفته است.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson03.teach.rest_word
            kind: vocabulary
            target: {text: "استراحت کردن", language_code: prs, direction: rtl}
