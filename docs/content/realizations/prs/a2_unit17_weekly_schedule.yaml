        exercises:
          - content_key: prs.a2.unit17.lesson02.exercise01.recognize_ask_weekly_schedule
            type: multiple_choice
            tested_text: "برنامهٔ هفتهٔ تو چطور است"
            prompt: {target_blocks: [{text: "برنامهٔ هفتهٔ تو چطور است؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit17.lesson02.exercise02.order_weekend_activity
            type: word_order
            tested_text: "در آخر هفته دیر بیدار می‌شوم"
