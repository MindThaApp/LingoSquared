            kind: phrase
            target: {text: "برنامهٔ هفتهٔ تو چطور است؟", language_code: prs, direction: rtl}
            introduced_tokens: ["برنامهٔ", "هفتهٔ", تو, چطور, است]
          - content_key: prs.a2.unit17.lesson02.teach.weekday_full_sentence
            kind: phrase
            target: {text: "در روزهای هفته اول به دفتر می‌روم، بعد ورزش می‌کنم.", language_code: prs, direction: rtl}
            introduced_tokens: [روزهای, هفته]
