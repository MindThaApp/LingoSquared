units:
  - content_key: prs.a2.unit17.weekly_schedule
    title: برنامهٔ هفتگی
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.routines.describe_weekly_schedule
    planned_lesson_count: 4

    lessons:
      - content_key: prs.a2.unit17.lesson01.weekly_schedule_vocabulary
        title: کلمات برنامهٔ هفتگی
        spine_outcome_id: universal.a2.routines.describe_weekly_schedule
        teaching:
          - content_key: prs.a2.unit17.lesson01.teach.week_word
            kind: vocabulary
            target: {text: هفته, language_code: prs, direction: rtl}
            introduced_tokens: [هفته]
            example: {text: "این هفته خیلی مصروف استم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson01.teach.weekend_word
            kind: vocabulary
            target: {text: "آخر هفته", language_code: prs, direction: rtl}
            introduced_tokens: [آخر]
            example: {text: "در آخر هفته استراحت می‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson01.teach.schedule_word
            kind: vocabulary
            target: {text: برنامه, language_code: prs, direction: rtl}
            introduced_tokens: [برنامه]
            example: {text: "برنامهٔ هفتهٔ من مصروف است.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson01.teach.first_word
            kind: vocabulary
            target: {text: اول, language_code: prs, direction: rtl}
            introduced_tokens: [اول]
            example: {text: "اول ناشتا می‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson01.teach.then_word
            kind: vocabulary
            target: {text: بعد, language_code: prs, direction: rtl}
            introduced_tokens: [بعد]
            example: {text: "بعد به دفتر می‌روم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson01.teach.finally_word
            kind: vocabulary
            target: {text: "در آخر", language_code: prs, direction: rtl}
            introduced_tokens: [در]
            example: {text: "در آخر کمی مطالعه می‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson01.teach.sequence_grammar
            kind: grammar_note
            target: {text: "در روزهای هفته، اول به دفتر می‌روم، بعد ورزش می‌کنم و در آخر کمی مطالعه می‌کنم.", language_code: prs, direction: rtl}
            introduced_tokens: [روزهای, به, دفتر, "می‌روم", ورزش, "می‌کنم", و, کمی, مطالعه]
          - content_key: prs.a2.unit17.lesson01.teach.days_word
            kind: vocabulary
            target: {text: "روزهای هفته", language_code: prs, direction: rtl}
            introduced_tokens: []
            example: {text: "روزهای هفته مصروف کار استم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.a2.unit17.lesson01.exercise01.recognize_week
            type: multiple_choice
            tested_text: هفته
            prompt: {target_blocks: [{text: هفته, language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit17.lesson01.exercise02.recognize_weekend
            type: multiple_choice
            tested_text: "آخر هفته"
            prompt: {target_blocks: [{text: "آخر هفته", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit17.lesson01.exercise03.match_schedule_words
            type: matching_pairs
            tested_text: "هفته آخر هفته برنامه اول بعد در آخر"
            prompt: {target_blocks: []}
            pairs:
              - {left: هفته, right: week}
              - {left: "آخر هفته", right: weekend}
              - {left: برنامه, right: schedule}
              - {left: اول, right: first}
              - {left: بعد, right: then}
              - {left: "در آخر", right: finally}
          - content_key: prs.a2.unit17.lesson01.exercise04.order_sequence_sentence
            type: word_order
            tested_text: "اول به دفتر می‌روم بعد ورزش می‌کنم"
            prompt: {target_blocks: []}
            word_bank: [اول, به, دفتر, "می‌روم", بعد, ورزش, "می‌کنم"]
          - content_key: prs.a2.unit17.lesson01.exercise05.write_finally
            type: writing_prompt
            tested_text: "در آخر"
            prompt: {target_blocks: []}

