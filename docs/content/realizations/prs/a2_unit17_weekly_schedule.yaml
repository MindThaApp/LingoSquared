            example: {text: "در آخر هفته استراحت می‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit17.lesson03.teach.comparison_text
            kind: reading
            target: {text: "در روزهای هفته، همایون صبح زود بیدار می‌شود و به دفتر می‌رود. اما در آخر هفته، او دیر بیدار می‌شود و استراحت می‌کند.", language_code: prs, direction: rtl}
            introduced_tokens: [همایون, صبح, زود, "می‌شود", "می‌رود", اما, او, "می‌کند"]
        exercises:
