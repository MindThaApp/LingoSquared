            kind: vocabulary
            target: {text: "یک، دو، سه", language_code: prs, direction: rtl}
            introduced_tokens: [یک, دو, سه]
          - content_key: prs.a1.unit04.lesson01.teach.four_to_six
            kind: vocabulary
            target: {text: "چهار، پنج، شش", language_code: prs, direction: rtl}
            introduced_tokens: [چهار, پنج, شش]
          - content_key: prs.a1.unit04.lesson01.teach.seven_eight
            kind: vocabulary
            target: {text: "هفت، هشت", language_code: prs, direction: rtl}
            introduced_tokens: [هفت, هشت]
          - content_key: prs.a1.unit04.lesson01.teach.nine_ten
            kind: vocabulary
            target: {text: "نه، ده", language_code: prs, direction: rtl}
            introduced_tokens: [نه, ده]
        exercises:
          - content_key: prs.a1.unit04.lesson01.exercise01.recognize_three
            type: multiple_choice
            tested_text: سه
            prompt: {target_blocks: [{text: "3", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit04.lesson01.exercise02.recognize_seven
            type: multiple_choice
            tested_text: هفت
            prompt: {target_blocks: [{text: "7", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit04.lesson01.exercise03.recognize_seh_reading
            type: multiple_choice
            tested_text: سه
            prompt: {target_blocks: [{text: سه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit04.lesson01.exercise04.match_one_to_ten
            type: matching_pairs
            tested_text: یک دو سه چهار پنج شش هفت هشت نه ده
            prompt: {target_blocks: []}
            pairs:
              - {left: یک, right: "1"}
              - {left: دو, right: "2"}
              - {left: سه, right: "3"}
              - {left: چهار, right: "4"}
              - {left: پنج, right: "5"}
              - {left: شش, right: "6"}
              - {left: هفت, right: "7"}
              - {left: هشت, right: "8"}
              - {left: نه, right: "9"}
              - {left: ده, right: "10"}
          - content_key: prs.a1.unit04.lesson01.exercise05.order_count_to_five
            type: word_order
            tested_text: یک دو سه چهار پنج
            prompt: {target_blocks: []}
            word_bank: [یک, دو, سه, چهار, پنج]
          - content_key: prs.a1.unit04.lesson01.exercise06.translate_number
            type: translation
            tested_text: هشت
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit04.lesson01.exercise07.write_number_word
            type: writing_prompt
            tested_text: ده
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit04.lesson02.numbers_eleven_to_twenty
