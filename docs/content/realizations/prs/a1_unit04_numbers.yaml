units:
  - content_key: prs.a1.unit04.numbers
    title: شمردن و شماره‌ها
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.numbers.use_basic_numbers
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit04.lesson01.numbers_one_to_ten
