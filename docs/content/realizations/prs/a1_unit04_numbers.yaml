  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered outcome (no prerequisites). Six lessons: numbers 1-10, 11-20, tens, asking age with chand, phone numbers, and a dialogue exchanging phone numbers and ages. Adapted from Peace Corps Dari material with an active modernization pass. Authored independently from the fa realization per the sibling-isolation rule -- Persian numerals are shared vocabulary across Dari and Farsi, but surrounding phrasing/exercises/pedagogical framing were originated independently, not templated. Fresh-context review completed 2026-07-05: fixed a lesson06 exercise-pacing violation (production items moved after drag/matching), 9 multiple_choice exercises whose prompt displayed the exact correct-answer text (defeating the point of the question -- prompts changed to show the digit instead), and a stray mixed-script typo in register_policy. Numerical accuracy, dialect (استم/استین/نمبر, not Iranian forms), script purity, and jargon-leak checks all clean. Compiler validation 0 errors/0 warnings before and after fixes, independently re-verified. Audio remains pending generation; human native-speaker review still recommended before this ships, per project policy of no native-speaker review network for prs. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this review completed): a project-wide audit found 10 exercises in this unit (lesson01.exercise03/06, lesson02.exercise03/06, lesson03.exercise03, lesson04.exercise03/06, lesson05.exercise03/06, lesson06.exercise03) were listen_type or bare-prompt listen_select items -- genuinely unanswerable since fa/prs have zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (added the target Dari number/phrase as a real visible prompt, English-gloss correct_option/distractors), listen_type -> translation (English instruction, same Dari accepted_answers). The 3 sequence-listening exercises (listen_numbers/listen_teens/listen_tens) originally tested recognizing one number among several spoken -- since no audio exists, simplified to single-number reading recognition (tested_text updated to match the one number actually shown/tested). Re-verified 0 remaining §14 violations via script, content_key parity intact, validate+compile both clean after the retrofit. MATCHING_PAIRS SCALE RETROFIT 2026-07-06 (§16, Ramin's direct feedback): found match_teens and match_tens each only tested a subset of numbers that were ALREADY fully taught in their own lesson's teaching cards (lesson02 teaches 11-20 but only matched 11-15; lesson03 teaches 20-100 by tens but only matched 20/30/40/50/100, skipping 60/70/80/90) -- expanded both to the complete already-taught set (match_teens 5->10 pairs, match_tens 5->9 pairs), zero new vocabulary introduced. Also expanded match_age_phrases 3->4 (added سال/year, taught earlier in the same lesson). Left match_phone_vocab (3) and match_dialogue_facts (2) unchanged as genuine small closed sets (only 3 standalone phone-related words and 2 dialogue-specific facts exist to draw from). POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by unit13's fresh-context reviewer flagging the same bug in units 11/12) found this file also had exercises where realization prompt.target_blocks duplicated the overlay's own instruction text verbatim in English -- the compiler would have rendered the same sentence twice to the learner. Fixed mechanically: every affected exercise's prompt set to target_blocks: []. Re-verified validate+compile clean (0 errors/0 warnings) and confirmed zero remaining instruction-duplicate target_blocks via a script comparing every exercise's target_blocks against its overlay instruction."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy. This
    unit's age question uses the polite چند ساله استین؟ before the informal
    چند ساله استی؟, following the same pattern as unit01's wellbeing
    questions. Phone numbers use نمبر, the everyday Afghan colloquial term
    (a Persian/English loanword), rather than the more formal شماره.

