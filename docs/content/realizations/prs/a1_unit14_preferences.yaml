  - content_key: prs.a1.audio.preferences.likes.01
    language: prs
    text: "قهوه را بیشتر دوست دارم چون خوش‌مزه است"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: prs.a1.audio.dialogue.preferences.01
    language: prs
    text: "کریم: چای یا قهوه، کدام را بیشتر دوست دارین؟ نگار: من قهوه را بیشتر دوست دارم چون خوش‌مزه است. شما چطور؟ کریم: من چای را دوست دارم چون گرم است. نگار: عالی است!"
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: prs.a1.unit14.preferences
    title: ترجیحات
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.preferences.express_preferences
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit14.lesson01.basic_likes
        title: دوست داشتن‌های ساده
        spine_outcome_id: universal.a1.preferences.express_preferences
        teaching:
          - content_key: prs.a1.unit14.lesson01.teach.doost_daram_phrase
            kind: phrase
            target: {text: "دوست دارم", language_code: prs, direction: rtl}
            introduced_tokens: ["دوست", دارم]
          - content_key: prs.a1.unit14.lesson01.teach.qahwa_word
            kind: vocabulary
            target: {text: قهوه, language_code: prs, direction: rtl}
            introduced_tokens: [قهوه]
            example: {text: "قهوه را دوست دارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit14.lesson01.teach.chai_word
            kind: vocabulary
            target: {text: چای, language_code: prs, direction: rtl}
            introduced_tokens: [چای]
            example: {text: "چای را دوست ندارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit14.lesson01.teach.doost_nadaram_phrase
            kind: phrase
            target: {text: "دوست ندارم", language_code: prs, direction: rtl}
            introduced_tokens: [ندارم]
          - content_key: prs.a1.unit14.lesson01.teach.man_word
            kind: vocabulary
            target: {text: من, language_code: prs, direction: rtl}
            introduced_tokens: [من]
            example: {text: "من قهوه را دوست دارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit14.lesson01.teach.ra_word
            kind: grammar_note
            target: {text: "را (formal object marker)", language_code: prs, direction: rtl}
            introduced_tokens: [را]
        exercises:
          - content_key: prs.a1.unit14.lesson01.exercise01.recognize_doost_daram
            type: multiple_choice
            tested_text: "دوست دارم"
            prompt: {target_blocks: [{text: "دوست دارم", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit14.lesson01.exercise02.recognize_qahwa
            type: multiple_choice
            tested_text: قهوه
            prompt: {target_blocks: [{text: قهوه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit14.lesson01.exercise03.match_likes_vocab
            type: matching_pairs
            tested_text: "دوست دارم دوست ندارم قهوه چای"
            prompt: {target_blocks: []}
            pairs:
              - {left: "دوست دارم", right: "I like"}
              - {left: "دوست ندارم", right: "I don't like"}
              - {left: قهوه, right: coffee}
              - {left: چای, right: tea}
          - content_key: prs.a1.unit14.lesson01.exercise04.translate_i_like_coffee
            type: translation
            tested_text: "قهوه را دوست دارم"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit14.lesson01.exercise05.translate_i_dont_like_tea
            type: translation
            tested_text: "چای را دوست ندارم"
            prompt: {target_blocks: []}

