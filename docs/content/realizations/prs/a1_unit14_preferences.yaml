              - {left: موسیقی, right: music}
              - {left: دارین, right: "you have/like"}
              - {left: "دوست دارم", right: "I like"}
              - {left: قهوه, right: coffee}
              - {left: چای, right: tea}
          - content_key: prs.a1.unit14.lesson02.exercise04.word_order_kodam_question
