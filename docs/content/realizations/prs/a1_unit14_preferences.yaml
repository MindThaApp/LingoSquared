            example: {text: "موسیقی را دوست دارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit14.lesson02.teach.darid_grammar
            kind: grammar_note
            target: {text: "دارین (you have/like, polite)", language_code: prs, direction: rtl}
            introduced_tokens: [دارین]
          - content_key: prs.a1.unit14.lesson02.teach.kodam_ra_question
            kind: phrase
            target: {text: "کدام را دوست دارین؟", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit14.lesson02.exercise01.recognize_kodam
