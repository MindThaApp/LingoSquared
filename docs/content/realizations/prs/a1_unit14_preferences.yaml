review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered outcome (universal.a1.preferences.express_preferences, no prerequisites). Six lessons: basic likes/dislikes (دوست دارم/دوست ندارم), asking about preferences, choosing between two options, giving a reason with چون, reading a short preference text (introducing the full-form 3rd-person دارد), and a dialogue comparing two people's preferences. Uses full, uncontracted verb forms (دوست دارین، خوش‌مزه است، جالب است، گرم است، عالی است) and the formal را object marker throughout -- deliberately NOT the fa sibling's colloquial رو/-e-contraction register -- consistent with the استم/استین full-form register policy established in units 01-13. Authored independently of the fa realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6 pairs (lesson01's 4-pair ceiling is a genuine first-lesson limit, no earlier vocabulary to pool from), and zero fill_in_blank exercises -- every completion-style moment uses translation/writing_prompt with an explicit English cue and multiple accepted phrasing variants instead. Learning directly from the fa sibling unit's own fresh-context review (which found two real bugs worth pre-empting here): (1) lesson05's reading text states the character dislikes music, not coffee/tea, so it cannot contradict lesson06's dialogue where the same character prefers coffee over tea; (2) both open-ended production exercises (write_own_preference, dialogue_response_own_preference) carry coffee/tea/music variants from the start, since the English cue doesn't force one specific topic. Multi-clause production exercises include period-joined, comma-joined, and و-joined accepted variants per §12. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-07 (zero prior context, fa sibling files never opened). Verified against universal.a1.preferences.express_preferences's own can_do/assessment_requirements (all 4 -- understand_preference via lesson05/lesson06's reading_comprehension/dialogue_comprehension, read-substituting-for-listening per the established zero-prs-audio pattern; exchange_preferences via the dialogue_response exercises; read_preference via the reading_comprehension exercises; write_preference via the writing_prompt/translation exercises -- all covered); exercise pacing (recognition -> drag/matching -> production confirmed in all 6 lessons); §14/§16/§17 self-claims verified true by direct grep and manual audit (zero listen_type/listen_select/listen_order; lesson01's matching_pairs is a genuine 4-pair ceiling, lessons02-06 all exactly 6 pairs; zero fill_in_blank anywhere in the file). Confirmed the pre-emptive §11 fix claim by directly reading lesson05's reading text against lesson06's dialogue: Negar dislikes music and likes tea (because it's warm) in lesson05, then in lesson06 prefers coffee over tea (because it's delicious) without ever contradicting the lesson05 statement -- liking tea while preferring coffee more, and disliking music, are mutually compatible; genuinely distinct from the fa sibling's original same-drink-liked-and-disliked bug. Verified lesson05.exercise05/lesson06.exercise04's claimed coffee/tea/music multi-topic acceptance is real (12 and 6 accepted variants respectively in the compiled output) and confirmed via direct code read of `grade()`/`is_multi_answer_response()` in backend/app/api/router.py that the generic multi-answer path iterates every entry in `accepted`, not just the first, so this is not a disguised bug. Grammar/dialect checked by hand and web-verified for the specific fa/prs divergence points named in this review's brief (کدام vs Iranian colloquial کدوم, formal را vs Dari's own colloquial ره/-a reduction vs Iranian رو, را retained with دوست داشتن even for generic nouns like coffee/tea) -- all confirmed authentic Afghan Dari, no Iranian-Farsi calques found; دارم/داری/دارد/داریم/دارین/دارند conjugation of داشتن verified regular and correctly applied to 1st/2nd-polite/3rd person throughout. Script purity clean (zero Arabic-range kaf/yeh, grepped both files). No jargon leaks (checked programmatically against every learner-facing string, not just grep). Wrote and ran a real Python script (yaml.safe_load, recursive) checking every dict value in both files for a stray Python bool -- found only the two legitimate schema booleans (human_reviewed, target_language_first). Wrote and ran a ZWNJ-aware, Persian-punctuation-stripping Python tokenizer checking every tested_text/prompt.target_blocks/pairs/word_bank value (realization) and every overlay accepted_answers/correct_option/distractors/feedback value against cumulative file-scoped introduced_tokens, including specifically confirming lesson01's را, lesson05's دارد/ندارد, and lesson06's من/شما چطور/عالی است were each taught before their first tested use -- zero untaught-vocabulary violations found. Confirmed content_key parity exact both directions (1 unit/6 lessons/29 teaching/30 exercises each side) and the overlay's flat top-level-dict schema is structurally correct. Confirmed all 8 exercise types used are registered in frontend/src/components/exercises/ExerciseRenderer.tsx. Checked every multiple_choice/reading_comprehension/dialogue_comprehension exercise for the prompt-shows-answer bug -- all correct_option/distractors are English glosses against Dari-script prompts, no same-script leakage. FOUND AND FIXED a real §5 instruction-answer-coherence bug: lesson06.exercise03 (reading_comprehension_who_likes_what) asked \"What does Karim like, and why?\" but its prompt text (\"من قهوه را بیشتر دوست دارم چون خوش‌مزه است. من چای را دوست دارم چون گرم است\") named neither Negar nor Karim, so the correct answer was undeterminable from the shown text alone -- fixed by prefixing each clause with its actual (already-taught) speaker name, نگار: and کریم:, resolving the ambiguity while keeping the original content and order. FOUND AND FIXED a real §12 gap: translate_like_coffee_because_delicious, translate_like_music_because_interesting, write_own_preference (all 3 topic variants), and dialogue_response_own_preference (both topic variants) each had comma-joined and و-joined forms but were missing the period-joined form (\"X. چون Y\", a natural stand-alone-because continuation) -- added as status:correct in the overlay; write_comparison_summary already had all three and needed no change. Judged the A1-complexity question honestly: 1st person in lesson01, 2nd-person-polite دارین in lesson02, 3rd person دارد/ندارد only in lesson05 is a gradual single-collocation buildup across 6 lessons, matching the established unit12 precedent for pacing multi-person verb introduction -- judged appropriate, not overreach. Re-verified via actual compile (not just validate) that every fix took effect: the reading_comprehension exercise's prompt and correct_response now cohere, and all 4 period-joined variants appear in the compiled correct_response.accepted lists. Both validate and compile re-run clean (0 errors/0 warnings) after every fix; compile output is valid JSON.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 12 kind:vocabulary teaching cards (1 merged card -- the names list -- given a positionally-matched list of examples), each a natural, comprehensible-from-gloss sentence built from vocabulary already taught in this same lesson or earlier in this file (e.g. qahwa_word/chai_word's examples reuse دوست دارم from the same lesson01, garm_ast_word's example anticipates the exact clause used in lesson05's own reading_text card). The names card's example uses the well-established استم copula (\"من کریم استم\" / \"من نگار استم\"), matching units 12/13's own precedent. schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    full, uncontracted verb forms (خوش‌مزه است، جالب است، گرم است، عالی است),
    consistent with units 01-13. Uses the formal را object marker
    throughout, distinct from the fa sibling's colloquial رو.

