  source_material: "Firecrawl credits remain exhausted this session (confirmed fresh via `firecrawl search \"Dari موزیم museum vocabulary phrasebook\"`, which returned HTTP 402 -- 0/1000 credits, 0% left this cycle, same status every prior unit this session already found). Before falling back, the shared scratchpad's already-cached DLI Dari corpus (downloaded and pdftotext-extracted by earlier units this session, covering all 10 Semester 1 lesson-block PDFs s1-4 through s37-40, both Semester 2 combined student books, both Semester 3 combined student books, and the Semester 3 'Other documents' supplements, plus a partial S3_Book2.txt with military-scenario content) was searched fresh for this specific topic: an English-keyword grep (museum, exhibit, gallery) across the full cached corpus found only three incidental, non-useful hits -- Semester 1 s37-40's own smuggling/anti-trafficking exercise asks where confiscated antiquities \"are intended to be exhibited\" (a military-topic sentence about stolen artifacts, not a museum-visit scenario), Semester 1 s5-8 lists \"upscale gallery\" once inside an antique-dealer vocabulary list (again an antique-trade context, not a museum-visit one), and S3_Book2.txt mentions a theft \"from the Kabul Museum\" inside an unrelated crime narrative plus a single exam-prompt reference to the Smithsonian Museum. None of these three hits cover buying an entrance ticket, an opening-hours notice, or an exhibition -- this outcome's own actual assessment_requirements -- so, per AUTHORING_GUIDE.md #10's own fallback provision (used identically by several earlier units this session, e.g. unit50 pool, unit53's own direct predecessor unit52 cinema, when the located DLI material didn't cover the specific topic), this unit is authored fresh from this course's own already-established in-corpus vocabulary and grammar rather than from any newly-sourced DLI text. Two genuinely new words were needed and neither is DLI-attested for this specific unit -- both are standard, everyday, non-obscure modern Dari words, disclosed honestly as course-internal inventions rather than externally sourced: موزیم (museum -- the standard Afghan Dari term, borrowed from English/French \"museum\" the same way Kabul urban usage actually renders it, distinct from Iranian Farsi's موزه \"muze\" from French \"musée\", following AUTHORING_GUIDE.md #3's standing instruction to verify the actual Dari term rather than assume the Farsi cognate) and نمایشگاه (exhibition, a standard Dari/Persian compound noun, نمایش \"a showing/display\" + گاه \"place\"). Built otherwise entirely from this course's own already-established vocabulary and grammar: این/است/در/خوب (multiple early units), کارمند (unit50's own generic staff/employee word, reused here for the museum ticket counter exactly as unit52's own cinema counter already reused it, and as unit45's کارمند هوتل first established the کارمند+service-context pattern), چند/افغانی/چهل (unit04's established number and unit08's established currency words), عکس (photo, unit30's own established word from \"عکس می‌گیرم\", reused here as the exhibition's subject matter), جالب (interesting, unit14/unit52), چیست (unit01/unit02/unit04/unit08/unit52's established \"what is\" question word), شما/من/می‌خواهم/یک (unit01/unit02/unit04/unit08's established patterns), بلیط/را/لطفاً (unit01/unit02/unit08/unit16's established tokens), بسیار خوب/تشکر زیاد/خواهش می‌کنم/بفرمایین/سلام (units01/09/10/40/46-52's established politeness formulas), از (unit01/unit02's established \"from\"), باز/بسته (unit50's own established open/closed adjective pair, reused here for the museum's own opening hours via the exact same X-از-ساعت-N-باز-است، اما-ساعت-M-بسته-است frame unit50 already established -- a legitimate same-course structure reuse per AUTHORING_GUIDE.md #3, not a cross-dialect text reuse, and a genuinely different subject noun (موزیم, not حوض آببازی) so this is not a duplicate sentence), نه/پنج (unit04's established numbers, reused here as the museum's opening/closing hour, a different concrete fact from unit50's own 9/5 pool hours -- coincidentally the same two numbers, disclosed honestly since Kabul public facilities plausibly do share common opening-hour conventions and no rule requires artificially varying reused numerals), او (he/she, unit27/unit41/unit47-52's own established precedent for introducing a 3rd-person reading-passage subject), and اما (unit33/unit39-52's established contrast word). One genuinely new grammar item beyond the two new nouns: دید (he/she saw), the bare 3rd-person-singular simple-past form of دیدن, following the EXACT same established paradigm unit20 already set for this verb class (رفتم/رفت, کردم/کرد, شدم/شد -- 1st person takes -م, 3rd person is the bare past stem with no suffix) and directly building on unit41's own already-established 1st-person دیدم (\"I saw\"); this is the same established \"introduce the 3rd-person cell of an already-taught verb, fresh, with its own review card\" precedent unit27/unit47-52 already used repeatedly for other verbs (most recently unit52's own می‌خواهد). Deliberately kept the two concrete facts this unit states -- the ticket price (چهل افغانی, 40 afghanis, stated identically in lesson02's reading and lesson04's dialogue) and the opening/closing hours (باز ساعت نه / بسته ساعت پنج, stated identically in lesson04's dialogue and lesson06's wrap-up) -- as independently stated, never-summed facts, per AUTHORING_GUIDE.md #11's own warning about comparative/total facts; this unit never asks the learner to add a price and a time together, and never restates the exhibition theme (نمایشگاه عکس, a photo exhibition, stated identically in lesson02/lesson03/lesson04/lesson05) with any conflicting variant."
