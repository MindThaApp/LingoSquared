struction for the same underlying noun بلیط, not a duplicate-content bug). Deliberately kept the ticket-price fact (چهل افغانی) and the opening/closing-hours fact (باز ساعت نه / بسته ساعت پنج) as two clearly distinct, never-summed facts -- no arithmetic is ever asked of the learner, and the exhibition theme (نمایشگاه عکس) is restated identically everywhere it appears (lesson02/lesson03/lesson04/lesson05), never with a conflicting variant. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (این/است/در/خوب از multiple earlier units، کارمند از unit50/unit52، چند/افغانی/چهل از unit04/unit08، عکس از unit30، جالب از unit14/unit52، چیست/شما/من/می‌خواهم/یک از unit01/unit02/unit04/unit08، بلیط/را/لطفاً از unit01/unit02/unit08/unit16، بسیار خوب/تشکر زیاد/خواهش می‌کنم/بفرمایین/سلام از units01/09/10/40/46-52، از از unit01/unit02، باز/بسته/نه/پنج از unit04/unit50، او از unit27/unit41/unit47-52، اما از unit33/unit39-52). Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit47-52's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. No multi-clause (period/comma/اما-joined) accepted_answers exist beyond the single canonical comma-اما wrap-up sentence, matching unit33/39-52's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading (اما itself is the conjunction; there is no separate period-only or bare-comma-only natural reading of the same contrast), so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise -- confirmed by explicit review, not assumed. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs