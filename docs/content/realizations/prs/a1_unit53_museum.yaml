    character, reusing the same polite-service register unit08's
    دکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit50's pool
    کارمند, and unit52's cinema کارمند exchanges already established -- not
    the informal-تو friendship register. This unit's نمایشگاه چیست؟ extends
    this course's own already-established چیست question pattern (unit01/
    unit02/unit04/unit08/unit52) to a new noun, and its opening-hours
    sentence (موزیم ساعت نه باز است، اما ساعت پنج بسته است) reuses unit50's
    own established X-از-ساعت-باز-است،-اما-ساعت-بسته-است frame with a new
    subject noun, not a copied sentence. Lesson05's reading passage uses a
    3rd-person statement naming همایون explicitly in its first sentence,
    then او in the following sentences, matching unit27/unit41/unit47-52's
    own reading-passage precedent, and lesson06's wrap-up uses the same
