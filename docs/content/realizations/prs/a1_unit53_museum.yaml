nd lesson06's identical restatement (ساعت نه باز / ساعت پنج بسته) are consistent; the exhibition theme (نمایشگاه عکس) is restated identically in lesson02/lesson03/lesson04/lesson05 with no conflicting variant; no two facts are ever summed or compared arithmetically. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

