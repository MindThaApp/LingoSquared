generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "`firecrawl search \"Dari فوتبال sports match ticket vocabulary phrasebook\"` returned HTTP 402 (insufficient credits) when retried fresh for this unit, matching every recent unit's confirmed-still-exhausted status. Before falling back to established-conventions-only authoring, the repo's own already-cached DLI Dari corpus (`.firecrawl/dli-dari-s9-12.txt`, `s17-20.txt`, `s21-24.txt`, `s25-28.txt`, `s29-32.md`) was searched via both English-keyword greps (football, soccer, match, stadium, score, kickoff, ticket+game, sport) and direct Dari-script greps (فوتبال، ورزش، مسابقه، میدان، گول، توپ، تیم، استدیوم) across the full corpus. Result, honestly disclosed as a genuine hit this time (unlike several recent units that found nothing usable): `dli-dari-s29-32.md` (Lesson 30, an Independence-Day narrative/exchange unit) contains real, attested content directly on-topic -- a narrative passage stating \"بعضی مردم به دیدن بزکشی میروند، درحالیکه بعضی دیگر مسابقات فوتبال ار تماشا می کنند\" (some people go to watch buzkashi, while others watch football matches) and a two-speaker exchange (Jamal and Timur) discussing plans to attend a buzkashi match, naming a ticket price (۵٠ افغانی, 50 afghanis) and a stadium (ستدیوم کابل, Kabul Stadium). This confirms مسابقه (match/contest, plural مسابقات) as genuine, source-attested Dari vocabulary for this topic -- not a guessed Farsi cognate. The source exchange itself was NOT copied: it is written in a strongly informal-تو, heavily contracted register (میخایم rather than می‌خواهم, ده rather than در, ره rather than را, قیمته rather than قیمت است) that directly conflicts with this course's established استم/استین polite-first, full-uncontracted register (AUTHORING_GUIDE.md §3), and its own price (50 afghanis) and venue framing (a real named stadium) were deliberately not reused verbatim to avoid an unverified factual claim and a near-duplicate price to this unit's own sign, per the same discipline unit59 boat_tour and unit57 beach already applied to their own DLI-adjacent-but-not-directly-usable finds. فوتبال (football/soccer) itself needed no fresh sourcing -- it is already established, course-internal vocabulary, introduced in unit29 sports (`introduced_tokens: [فوتبال]`) and reused there again in unit56 gym; کرکت (cricket) is likewise already established from the same unit29 sports card. Two new content words needed beyond مسابقه: تیم (team), a standard modern Dari/Farsi loanword (borrowed from English \"team\" the same way this course's unit53 already borrowed موزیم and unit54 borrowed کنسرت), used here as \"team + city name\" (تیم کابل, \"the Kabul team\") -- disclosed honestly as a generic civic-team construction, not a real specific football club, following unit54's own سیما-as-invented-performer precedent and unit57/unit59's own avoid-unverified-specific-real-facts discipline; and برد (won), the native Dari/Persian 3rd-person simple past of بردن \"to win/take,\" not DLI-attested for this specific sense in the searched corpus but standard, dialect-neutral, everyday vocabulary with no register/dialect-divergence risk of the kind unit24's موتر or unit28's پشک flagged. کابل itself is not new -- already established since unit01/unit02/unit16/unit31/unit35. Everything else this unit uses -- این/است/در/خوب/به (multiple early units), سلام/بفرمایین/تشکر زیاد/خواهش می‌کنم (units01/09/10/40/46-59), می‌خواهم/یک/بلیط/چند/افغانی (unit01/unit02/unit04/unit08/unit16), ساعت/شب/پنج/چهل/سه/بیست (unit01/unit04/unit11), شروع/می‌شود (unit54), می‌خواهین/جمعه/برویم/بلی/عالی/قبول (unit13/unit54), او/رفت/بود (multiple earlier units), جالب/اما (unit14/unit33/unit39-59) -- is confirmed course-internal review by grepping the full prs corpus for every candidate word before writing a single line of this file. No new grammar beyond ordinary recombination: برد slots into the same 3rd-person-simple-past paradigm already established by رفت/بود/کرد/دید (units 20/21/36/53/55/57/59); مسابقه‌تان (lesson06) extends the same formal -تان possessive-suffix pattern already used on بلیط‌تان (unit50/52/53/54) and گشت‌تان (unit59), applied here to this unit's own new noun rather than reusing an earlier unit's exact wording. Four new content words/forms this unit, disclosed honestly: مسابقه, تیم, برد, and the possessive form مسابقه‌تان (a combination of two already-declared morphemes, following the same convention گشت‌تان and بلیط‌تان already used)."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit59 (boat tour). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.sports_event.attend_a_sports_match as the next unrealized A1 outcome -- computed programmatically (not by eye): every spine_outcome_id value across all 62 existing prs realization files was collected via grep -rhoE and diffed against every universal.a1.* id in the spine file's own order (grep -n '^  - id:' on universal_spine.yaml), confirming sports_event (line 1729, immediately after boat_tour's own line 1704) is the earliest gap. Both listed prerequisites -- universal.a1.plans.make_simple_plans [unit13] and universal.a1.sports.talk_about_sports_exercise [unit29] -- are already realized in prs, confirmed against the same collected spine_outcome_id set. Matches all four of the outcome's own assessment_requirements: understand_sports_match_information (listening substituted with reading-based multiple_choice recognition per AUTHORING_GUIDE.md §14's established no-prs-audio pattern, testing lesson02's kickoff-time-and-price sign and lesson04's dialogue statements of the same two facts), request_sports_match_ticket (speaking substituted the same way this whole corpus substitutes it -- production exercises across lesson04's ticket-counter dialogue asking for a ticket and asking the price, plus writing_prompts in lessons01/02/04/05/06), read_sports_match_schedule (lesson02's combined kickoff-time-and-ticket-price reading card, mirroring unit53 museum's, unit58 zoo's, and unit59 boat_tour's own combined-reading precedent), and write_sports_match_message (writing_prompt exercises across all six lessons). Six lessons, matching unit54 concert's own six-lesson shape (not the plain five/six-lesson service-counter-only shape of museum/zoo/boat_tour) because this outcome's own can_do explicitly names \"make plans\" as a distinct step, backed by its own separate plans.make_simple_plans prerequisite: match-and-team vocabulary (مسابقه, تیم new), a football-match sign giving kickoff time and ticket price (پure recombination -- ساعت/پنج/شب/بلیط/چهل/افغانی all reviewed, deliberately using different hour (5pm) and price (40 afghanis) than unit53 museum's 9-5/40, unit58 zoo's 8-6/50, and unit59 boat_tour's 10-4/70, so the sign lessons aren't near-verbatim duplicates across units), a propose-and-accept-a-plan lesson reusing unit13's own established می‌خواهین/جمعه/برویم/بلی/عالی/قبول frame applied to this unit's own مسابقه فوتبال noun phrase (mirroring unit54 concert's own lesson03 precedent exactly, including its generic-phrase-not-named-dialogue shape -- no speaker attribution on this lesson's teaching cards, matching concert's own choice), a Homayoun/کارمند formal ticket-counter dialogue (پure recombination -- مسابقه/تیم introduced earlier in-file, everything else review -- combining a ticket request, a kickoff-time statement, a price question, and a price answer), a third-person reading passage recapping the visit AND stating the match's result (رفت/بود reviewed from multiple earlier units, برد introduced fresh here as this unit's third new word, needed specifically for the spine outcome's own \"talk simply about the score or result afterward\" requirement -- no other unit in this corpus has needed a win/result verb before), and a wrap-up combining a football-vs-cricket price/time contrast with اما (reusing unit53 museum's own single-subject two-fact اما-contrast shape, applied here across two different sports' matches rather than one venue's open/closed hours, since a single football match's own facts don't have a natural antonym pair the way a venue's hours do) and a formal تان-suffixed question attached to this unit's OWN new noun مسابقه rather than reusing unit50/52/53/54's exact بلیط‌تان or unit59's گشت‌تان wording verbatim (avoiding a near-duplicate wrap-up sentence across units, per the same discipline unit58 zoo's own محبوب‌تان and unit59 boat_tour's own گشت‌تان already applied). تیم کابل (\"the Kabul team\") is a generic civic-team construction built from two independently-established course words (تیم, new this unit; کابل, established since unit01/02/16/31/35) -- not a claim about a real specific football club's existence, name, or standing, matching the same disclosed-as-generic/invented discipline already applied to unit54's سیما (invented singer) and unit57's unnamed beach. Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit57/58/59's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در/خوب/به از multiple earlier units، فوتبال/کابل از unit29/unit02، مسابقه/تیم از این فایل (لسون۰۱)، ساعت/پنج/شب از unit01/unit04/unit11، شروع/می‌شود از unit54، بلیط/چهل/افغانی/چند از unit01/unit02/unit04/unit08/unit16، می‌خواهین/جمعه/برویم/بلی/عالی/قبول از unit13/unit54، سلام/یک/می‌خواهم/بفرمایین/تشکر زیاد/خواهش می‌کنم از units01/02/04/08/09/10/40/46-59، او/رفت/بود از multiple earlier units، جالب از unit14/unit33/unit39-59، برد از این فایل (لسون۰۵)، اما/کرکت/سه/بیست از unit14/unit33/unit39-59/unit29/unit04. Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او is NOT needed here since the second and third sentences name تیم کابل / مسابقه directly rather than pronominalizing همایون -- matching the option unit31/unit35's own reading passages already use when a passage's later sentences shift subject away from the named person rather than continuing to refer back to them; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug (او appears zero times as a bare pronoun in this specific passage, which is a valid, previously-used shape, not an oversight -- see §11 note below). No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md §13/§17 don't arise. No multi-clause period/comma/اما-joined accepted_answers exist beyond the single canonical comma-اما wrap-up sentence, matching unit33/39-59's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading -- confirmed by explicit review, so AUTHORING_GUIDE.md §12's multi-variant requirement doesn't otherwise arise. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md §14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's six dialogue lines and their speakers (همایون: 3 lines -- request the ticket / ask the price / thank the staff; کارمند: 3 lines -- greet and state kickoff time / state the price / reply you're welcome) were listed and cross-checked by hand before finalizing any multiple_choice distractor, applying the standing same-speaker-distractor rule to text-based recognition items too, not just audio ones -- every distractor for a tested همایون line is drawn exclusively from کارمند's three lines and vice versa; no exercise in this lesson draws a distractor from the SAME character's other lines (verified programmatically, see the standalone check script run during authoring). Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md §16). Every vocabulary teaching card (مسابقه, تیم, برد) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md §19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she where a pronoun is used at all, never هغه/هغوی. §11 cross-lesson fact check: the match's stated kickoff-time-and-price fact (مسابقه فوتبال ساعت پنج شب شروع می‌شود؛ بلیط چهل افغانی است) is stated identically in lesson02's sign and restated identically (never contradicted) in lesson04's dialogue (کارمند's start-time line matches the sign's ساعت پنج شب exactly; کارمند's price line matches چهل افغانی exactly); the result fact (تیم کابل برد), introduced fresh in lesson05 since neither the sign nor the dialogue states a result before the match happens, is never contradicted or restated with a conflicting value anywhere else; lesson06's second, unrelated cricket-match price/time pair (ساعت سه شب / بیست افغانی) is introduced only in lesson06 for contrast and is never combined arithmetically with the football match's own facts; no two facts are ever summed or compared beyond the single intentional اما contrast. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

