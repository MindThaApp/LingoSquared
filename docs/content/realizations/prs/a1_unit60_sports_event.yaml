  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-59). Lesson04's dialogue introduces the
    football-match ticket-counter کارمند role opposite the established
    Homayoun character, reusing the same polite-service register unit08's
    دکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit50's pool
    کارمند, unit52's cinema کارمند, unit53's museum کارمند, and unit54's
    concert کارمند exchanges already established -- not the informal-تو
    friendship register used for Homayoun/Zarmina outings elsewhere in this
    course. Lesson03's propose-and-accept-a-plan phrases reuse unit13's own
    established می‌خواهین/جمعه/برویم/بلی/عالی/قبول frame with no named
    speaker attribution, matching unit54 concert's own lesson03 precedent
    exactly. This unit's تیم کابل extends established کابل (a place name
    since unit01/02/16/31/35) with this unit's own new noun تیم rather than
    inventing an unrelated name; its wrap-up's مسابقه‌تان کی شروع می‌شود؟
    extends unit50/52/53/54's own established formal -تان-suffix pattern
    (and unit59's own گشت‌تان precedent) to this unit's own new noun
    مسابقه rather than reusing an earlier unit's exact wording. Lesson05's
    reading passage names همایون explicitly in its first sentence, then
    names تیم کابل and مسابقه directly in the following two sentences
    (rather than pronominalizing with او again), matching the option
    unit31/unit35's own reading passages already use when later sentences
    shift the grammatical subject away from the opening named person.

