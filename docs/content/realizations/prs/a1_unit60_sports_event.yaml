units:
  - content_key: prs.a1.unit60.sports_event
    title: مسابقه فوتبال
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.sports_event.attend_a_sports_match
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit60.lesson01.match_and_team_vocabulary
        title: مسابقه و تیم
        spine_outcome_id: universal.a1.sports_event.attend_a_sports_match
        teaching:
          - content_key: prs.a1.unit60.lesson01.teach.review_this_is_in_good
            kind: grammar_note
            target: {text: "این (this) / است (is) / در (in) / خوب (good)", language_code: prs, direction: rtl}
            introduced_tokens: [این, است, در, خوب]
          - content_key: prs.a1.unit60.lesson01.teach.review_football_kabul
            kind: grammar_note
            target: {text: "فوتبال (football/soccer) / کابل (Kabul)", language_code: prs, direction: rtl}
            introduced_tokens: [فوتبال, کابل]
          - content_key: prs.a1.unit60.lesson01.teach.match_word
            kind: vocabulary
            target: {text: مسابقه, language_code: prs, direction: rtl}
            introduced_tokens: [مسابقه]
            example: {text: "این مسابقه فوتبال است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit60.lesson01.teach.team_word
            kind: vocabulary
            target: {text: تیم, language_code: prs, direction: rtl}
            introduced_tokens: [تیم]
            example: {text: "تیم کابل خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit60.lesson01.teach.match_is_football_phrase
            kind: phrase
            target: {text: "این مسابقه فوتبال است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit60.lesson01.teach.team_is_good_phrase
            kind: phrase
            target: {text: "تیم کابل خوب است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit60.lesson01.exercise01.recognize_match_word
            type: multiple_choice
            tested_text: مسابقه
            prompt: {target_blocks: [{text: مسابقه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit60.lesson01.exercise02.recognize_team_word
            type: multiple_choice
            tested_text: تیم
            prompt: {target_blocks: [{text: تیم, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit60.lesson01.exercise03.recognize_match_is_football
            type: multiple_choice
            tested_text: "این مسابقه فوتبال است."
            prompt: {target_blocks: [{text: "این مسابقه فوتبال است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit60.lesson01.exercise04.match_vocab
            type: matching_pairs
            tested_text: "مسابقه تیم این است فوتبال این مسابقه فوتبال است. تیم کابل خوب است."
            prompt: {target_blocks: []}
            pairs:
              - {left: مسابقه, right: match}
              - {left: تیم, right: team}
              - {left: این, right: this}
              - {left: است, right: is}
              - {left: فوتبال, right: football}
              - {left: "این مسابقه فوتبال است.", right: "This is a football match."}
