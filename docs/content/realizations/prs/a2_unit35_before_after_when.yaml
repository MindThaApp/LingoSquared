review:
  status: reviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 34-39 pass): 0 fixes. Read every teaching card and exercise together with overlays/en-prs/a2_unit35.yaml. Checked: register (formal written Kabul Dari, است/استم, 2pl -ین only in the paradigm, no Tehrani contractions, Afghan lexicon تکت/طیاره/میدان هوایی/تیلفون/مکتب), Persian codepoints and rtl, spine outcome id, boolean coercion, every subjunctive after قبل از اینکه and every past or habit present after بعد از اینکه (all match the rule the unit teaches), word banks against the accepted orders, and the facts across the Akbar/Narges dialogue, the rice message and the Yusuf/Nasrin dialogue - consistent. NATIVE FLAGS: (a) دوش گرفتن for taking a shower (already taught in a2 unit22; Kabul speech may prefer شاور گرفتن); (b) جوش شدن for the water boiling (versus جوش آمدن); (c) the twelve open questions below still stand. Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block D unit D2), realizing universal.a2.sequencing.order_events_with_time_clauses. Grammar target: ordering events with time clauses: قبل از و بعد از + noun (قبل از صبحانه, بعد از مکتب), بعد از اینکه + simple past (and present with می‌ for habits), قبل از اینکه + subjunctive (برسم، برسی، برسد، برسیم، برسین، برسند; even in a past story: قبل از اینکه از خانه بروم، چمدانم را بستم), وقتی که + simple past / present habit / subjunctive for something still to come (فردا وقتی که برسم، تیلفون می‌کنم), and the linking words اول، بعد، بعد از آن، در آخر. The subjunctive is re-taught here (lesson 3) so the unit does not depend on any other new unit. Vocabulary: daily sequence (بیدار شدن, لباس پوشیدن, شام), travel logistics (تکت, چمدان, چمدان بستن), cooking (برنج, پیاز, خرد کردن, پختن, آب, جوش شدن, نمک, انداختن). Lesson arc: L01 before/after + noun and daily sequence; L02 بعد از اینکه + past and travel steps; L03 قبل از اینکه + subjunctive and cooking; L04 وقتی که (past, habit, future) and recipe steps; L05 reading (message about cooking rice) and a transcript-shown listening item (Akbar and Narges, trip to Herat); L06 dialogue (Yusuf and Nasrin, a morning routine), mixed items and a culminating three-sentence writing_prompt. Spine: reading comprehension, dialogue_comprehension with the full transcript in the prompt (prs has no TTS), typed production (translation, dialogue_response, writing_prompt). No listen_type, dictation or audio-only items. Characters: two one-off pairs, نرگس/اکبر and یوسف/نسرین (none occurs elsewhere in docs/content/realizations/prs or overlays/en-prs at authoring time); informal تو register. Facts kept consistent (AUTHORING_GUIDE section 11): Akbar flies to Herat tomorrow at ten, got his ticket yesterday, packs his suitcase before leaving for the airport and will phone Narges when he arrives; the reading is a separate account (Narges cooked rice yesterday: chopped the onion first, put in salt and rice after the water boiled, ate when the rice was ready, drank tea before sleeping); Yusuf wakes at six, showers, gets dressed, eats breakfast before going to the office at eight, and starts work first on arrival. Binding rulings applied: Kabuli written Dari; copula است/استم; 2pl -ین (the -ید subjunctive is only mentioned as understood, no -ید answers needed because no 2pl typed answer exists); no progressive; no perfect; future by می‌ plus a time word (no خواهم); no clitics (آن را only); no ازش/باهاش/بهت. Typed answers enumerate comma, no-comma and swapped-clause variants, optional من, and (where the course teaches it) وقتی alone (AUTHORING_GUIDE section 12). status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) After قبل از اینکه is the subjunctive (بروم، برسم) the natural form for both a past story and a future plan, and are the wrong forms قبل از اینکه رفتم / می‌روم really unacceptable? Recommend keep. (2) After بعد از اینکه is the simple past (رسیدم) natural for a past story and the present می‌ for a habit? Would a native prefer the subjunctive after بعد از اینکه for the future (بعد از اینکه برسم)? Recommend keep past and present, mention subjunctive only if the reviewer wants it. (3) Is وقتی که + subjunctive (وقتی که برسم، تیلفون می‌کنم) the natural way to say when I arrive, with فردا plus the present for the future? Recommend keep. (4) Is تکت the everyday Kabul word for a ticket (rather than بلیط) and تکت گرفتن natural for buying one? Recommend keep تکت, accept بلیط as an extra. (5) Is چمدان را بستن natural for packing a suitcase (also چمدان بستن), or would a native say چمدان آماده کردن / چمدان را جمع کردن? Recommend keep, accept جمع کردن. (6) Is خرد کردن the natural word for chopping onion, and is انداختن natural for adding salt and rice to boiling water (versus ریختن)? Recommend keep, accept ریختن. (7) Is پختن (می‌پزم, بپزم, پختم) the right verb for cooking rice (versus درست کردن or دم کردن)? Recommend keep پختن, accept درست کردن. (8) Is در آخر natural as finally (also آخرش), and بعد از آن for after that? Recommend keep, accept آخرش. (9) Is بیدار می‌شوم natural for I wake up, and خوابیدن/می‌خوابم for going to sleep (versus خواب رفتن)? Recommend keep. (10) Is به من تیلفون می‌کنی؟ natural for will you phone me (versus به من زنگ می‌زنی)? Recommend keep, accept زنگ زدن. (11) Does the clause-final order (چمدانم را بستم، بعد از اینکه تکت را گرفتم) sound natural, or should the subordinate clause only come first? Recommend keep as an accepted answer only. (12) Is the bare answer شام خوردم (without a وقتی clause) acceptable as a reply to وقتی که به خانه رسیدی، چه کردی؟ Recommend keep.'
