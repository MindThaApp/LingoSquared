none found; (5) instruction/answer-data coherence for every exercise, including a programmatic check that no multiple_choice instruction text leaks its own correct_option -- none found; (6) cross-checked every concrete fact (Farid calls Lima; Farid is Homayoun's colleague; the message is for Homayoun; the meeting is tomorrow at nine) across every exercise and teaching card referencing them -- all consistent; (7) multi-clause accepted_answers all have period/comma/و-joined forms as status:correct where two full clauses are genuinely being combined (short interjection-style confirmations, where a triple-و join would be unnatural, are correctly given only period/comma forms); (8) no fill_in_blank exercises exist in this unit, so §13 doesn't apply; (9) script purity confirmed clean (no Arabic-range kaf/yeh codepoints, only Persian keheh/yeh throughout); (10) no ambiguous multiple-choice items found; (11) confirmed a natural modern mobile-phone-era scenario throughout (text messaging alongside calls, no landline/operator-era framing); (12) no bare unquoted yes/no/true/false footguns; (13) content_key parity between realization and overlay reconfirmed programmatically (27/27 teaching keys, 43/43 exercise keys, both directions, no duplicates); (14) every tested_text/accepted_answers/pairs/word_bank token cross-checked programmatically against cumulative introduced_tokens -- found and fixed the زمان instance described above, zero remaining issues after the fix. Re-ran both `validate` and `compile` after all fixes: 0 errors/0 warnings both times. Audio remains pending generation; human native-speaker review still recommended before this ships, per project policy of no native-speaker review network for prs. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this review completed): a project-wide audit found 7 exercises in this unit (lesson01.exercise03/06, lesson02.exercise03, lesson03.exercise03/06, lesson04.exercise03, lesson06.exercise03) were listen_type or bare-prompt listen_select items -- genuinely unanswerable since fa/prs have zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (added the target Dari text as a real visible prompt, English-gloss correct_option/distractors), listen_type -> translation. MATCHING_PAIRS SCALE RETROFIT (§16, same day): checked all 6 matching_pairs exercises against every lesson's introduced_tokens -- match_phone_opening (3) and match_dialogue_facts (2) are genuine small closed sets (lesson01 teaches exactly 3 words; lesson06's facts are dialogue-specific) with nothing further to pool without violating §16's anti-padding rule; the other 4 (identity_phrases=6, clarification_phrases=5, message_phrases=5, message_vocab=6) were already reasonably sized, well past the 2-3 problem case, and already pool across lessons -- left unchanged. Re-verified 0 remaining §14 violations via script, content_key parity intact, validate+compile both clean after the retrofit. POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by unit13's fresh-context reviewer flagging the same bug in units 11/12) found this file also had exercises where realization prompt.target_blocks duplicated the overlay's own instruction text verbatim in English -- the compiler would have rendered the same sentence twice to the learner. Fixed mechanically: every affected exercise's prompt set to target_blocks: []. Re-verified validate+compile clean (0 errors/0 warnings) and confirmed zero remaining instruction-duplicate target_blocks via a script comparing every exercise's target_blocks against its overlay instruction.

