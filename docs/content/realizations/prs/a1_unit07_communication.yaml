course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy and
    می‌توانین (not می‌شه) for polite requests. Phone etiquette uses الو as
    the universal phone greeting (a French loanword shared across the
    Persian-speaking world, including Afghanistan) and بفرمایین ("please,
    go ahead") -- the same everyday polite invitation-to-continue already
    used elsewhere in this course -- as the natural way to respond after
    picking up, rather than a literal calque of "I'm listening."

