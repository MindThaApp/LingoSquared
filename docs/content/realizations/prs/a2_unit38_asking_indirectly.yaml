review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block D unit D5), realizing universal.a2.questions.ask_indirect_questions. Grammar target: the embedded (indirect) question. Frame می‌دانین که + the direct question unchanged (کجا، کی، ساعت چند، چند، چرا، کدام; same tense, same word order, no subjunctive); the statement frame می‌دانم که / نمی‌دانم که; yes or no embedded questions with یا نه (optional آیا); the polite request ببخشین، می‌توانین بگویین که ...؟; friend می‌دانی versus polite می‌دانین. Twelve real grammar_note cards (paradigm of می‌دانم, direct to indirect, friend or polite, know or do not know, verb unchanged, question words, yes or no with یا نه, negative whether, آیا, polite request, other embedded questions, polite answers). Lesson arc: L01 form (می‌دانین که ... کجاست؟, places); L02 نمی‌دانم که + question words (کی، چرا، کدام، چند, opens, closes, leaves); L03 yes or no, یا نه, آیا; L04 polite requests and typed answers; L05 reading (a message from the market) plus the museum dialogue shown as a transcript; L06 the station dialogue, mixed and culminating production. No TTS, no listen_type or dictation items; dialogue_comprehension items show the full transcript in the prompt. Characters: سمیر and ثمینه, one-off names not used in any other realization at authoring time; the clerk is the speaker کارمند. Facts: museum near the station (dialogue 1); bus to Mazar leaves at eight, ticket a thousand afghanis, office near the gate (dialogue 2); reading is a separate message from the market. Rulings applied: Kabuli lexicon (موزیم، بس، تیلفون کردن، دروازه، بلیت، افغانی); 2pl -ین everywhere, -ید forms deliberately NOT added as extra answers because check_dari_register.py flags them even in accepted-answer lists (reviewer may want a policy for this); no object clitics; future not used; modal می‌توانین with ZWNJ; all verb forms are present-tense می‌ forms. Open questions for a native Dari reviewer (recommended answer in brackets): (1) Is می‌دانین که ... کجاست؟ with که natural, and is dropping که equally fine in writing? [keep که taught, accept without]. (2) Is یا نه the right marker for whether, and is آیا after که (که آیا ... یا نه) acceptable or too formal? [keep as optional extra]. (3) موزیم for museum versus موزه / موزیم ملی; plural موزیم‌ها not used. [keep موزیم]. (4) بس به مزار versus بس مزار / بس مزارشریف in speech. [keep به]. (5) ببخشین، می‌توانین بگویین که ...؟ versus ببخشین، لطفاً بگویین که ...؟; is بگویین the right polite imperative of گفتن for 2pl? [keep, accept لطفاً variant if you agree]. (6) نه as a friendly no in dialogue 1 (نه، نمی‌دانم) beside نخیر. [keep; نخیر taught in L03]. (7) چند است for how much a ticket costs (بلیت چند است؟), and بلیت هزار افغانی است as a natural answer. [keep]. (8) کارمند as the speaker label and as the counter clerk. [keep]. (9) Is تشکر alone natural as thanks at a counter, or should it be تشکر از شما / ممنون? [keep تشکر, reviewer to confirm]. (10) نزدیک ایستگاه است / نزدیک دروازه است for near (no از). [keep]. (11) Hamza spelling in دربارهٔ in the L05 title and the question mark placement before a dropped که. [keep]. (12) باز می‌شود and بسته می‌شود for opens and closes (versus باز است از ساعت نه). [keep].'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین (می‌دانین, می‌توانین, بگویین, ببخشین; no -ید forms), no Tehrani colloquialisms. The friend dialogue between سمیر and ثمینه uses the informal تو-register (می‌دانی); the station dialogue uses the polite شما-register. Indirect questions: می‌دانین که + the direct question unchanged (verb, tense and word order as in the direct question), نمی‌دانم که ..., yes or no with یا نه (optional آیا), polite request می‌توانین بگویین که ... . No object clitics.'
