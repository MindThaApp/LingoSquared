generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Searched this pass for a fetchable lesson-level household-chores unit in the Peace Corps Dari course (the same source already in active use for prs's other A1 units); the Live Lingua/fsi-language-courses.org listing for the Peace Corps Dari Language Course again exposes only a single combined PDF with no browsable per-lesson table of contents (same honest search-and-disclose outcome as the unit18/24/26/28/29/30/31/32 precedents), so no per-lesson scaffold was fetchable for this specific topic either. Authored from established prs conventions and vocabulary already taught earlier in this course instead, with every new Dari word verified independently via live web search during authoring, not just reasoning: جاروب confirmed as the genuine, widely-used Dari/Afghan term for a broom/sweeping (a Facebook listing selling \"Afghan Broom جاروب\" alongside the separate Mazar-style جارو مزاری confirms جاروب is the standard Afghan household-broom term, distinct in currency from the more generically-Iranian جارو, though both exist in broader Persian dictionaries); ظرف (dishes), پاک (clean, adjective), کمک (help), and باید (must/need to) all confirmed as standard, everyday, dialect-neutral Dari/Persian vocabulary with no divergent Afghan-specific alternative to prefer -- no dialect-confusion risk for any of these five like the موتر/پشک/پوهنتون class of words."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), cold read against the
    AUTHORING_GUIDE.md checklist, sibling fa/prs-en/fa-en files never
    opened. Checked: dialogue_comprehension distractor for "What does
    Shukria wash?" (correct: "The dishes."; distractor "The room." is
    something Shukria says she CLEANS elsewhere, a distinct verb from
    "wash" and a distinct fact from the one being tested, so this is a
    legitimate wrong answer, not the same-speaker-alternate-truth bug
    class); verified می‌شویم (I wash) / می‌شوید (he/she washes) against
    real Dari/Persian شستن conjugation (present stem شوی, same paradigm
    as گفتن → می‌گویم/می‌گوید) -- both forms are grammatically correct,
    not a bug; verified باید + bare-subjunctive کنم (no بـ- prefix) is
    correct light-verb subjunctive formation for کردن-based compounds;
    stray YAML boolean coercion via a real recursive yaml.safe_load scan
    (clean); matching_pairs/word_order answer shapes (correctly handled
    by grade()'s canonicalization); cross-lesson fact consistency (Wahid
    sweeps every day, Shukria washes the dishes and also cleans the
    room, both happy -- dialogue and reading passage agree); جاروب
    confirmed as genuine Afghan household-broom vocabulary, not an
    Iranian-Farsi-ism; jargon leaks (none); Unicode codepoints (Persian
    keheh/yeh throughout, او not Pashto هغه/هغوی); §12 (the اما wrap-up
    production target already carries bare/comma/period variants);
    §13/§14 (no fill_in_blank, no audio-only prs exercise types); §16
    (every matching_pairs exercise has 7 real pairs); §19 (every
    vocabulary card has a real example + example_gloss). Compiler
    re-validated clean (0 errors/0 warnings) after the batch review pass
    across units 31-35. No bugs found specific to this file; marking
    reviewed.

    Review 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in
    the overlay). NATIVE FLAGS: see overlay.

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-32). The Wahid/Shukria dialogue (lesson04)
    uses the informal تو/-ی register between two newly-introduced
    housemate/sibling characters, matching the precedent set by unit20
    (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), unit28 (داری),
    unit29 (می‌کنی), unit30 (می‌کنی), unit31 (می‌خوانی), and unit32
    (می‌آیی). باید is deliberately paired only with کردن-based light verbs
    (جاروب کردن، پاک کردن), whose subjunctive drops the بـ- prefix, to
    avoid introducing a second subjunctive-prefix pattern in the same
    unit; جاروب، ظرف، پاک، کمک، and باید are all standard, dialect-neutral
    Dari/Persian words with no confirmed Afghan-specific alternative to
    prefer.

