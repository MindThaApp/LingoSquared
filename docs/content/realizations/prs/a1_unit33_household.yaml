  authoring_system: claude
  source_material: "Searched this pass for a fetchable lesson-level household-chores unit in the Peace Corps Dari course (the same source already in active use for prs's other A1 units); the Live Lingua/fsi-language-courses.org listing for the Peace Corps Dari Language Course again exposes only a single combined PDF with no browsable per-lesson table of contents (same honest search-and-disclose outcome as the unit18/24/26/28/29/30/31/32 precedents), so no per-lesson scaffold was fetchable for this specific topic either. Authored from established prs conventions and vocabulary already taught earlier in this course instead, with every new Dari word verified independently via live web search during authoring, not just reasoning: جاروب confirmed as the genuine, widely-used Dari/Afghan term for a broom/sweeping (a Facebook listing selling \"Afghan Broom جاروب\" alongside the separate Mazar-style جارو مزاری confirms جاروب is the standard Afghan household-broom term, distinct in currency from the more generically-Iranian جارو, though both exist in broader Persian dictionaries); ظرف (dishes), پاک (clean, adjective), کمک (help), and باید (must/need to) all confirmed as standard, everyday, dialect-neutral Dari/Persian vocabulary with no divergent Afghan-specific alternative to prefer -- no dialect-confusion risk for any of these five like the موتر/پشک/پوهنتون class of words."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New unit, prs's next uncovered A1 outcome found by exact-diffing every spine_outcome_id used across all prs realization files against every id: in docs/content/universal_spine.yaml (A1-level outcomes only): universal.a1.household.describe_chores (prerequisite: universal.a1.housing.describe_home [unit19], already realized), the next unrealized A1 outcome after celebrations/unit32 by the spine file's own line order (household sits directly after celebrations, before neighborhood/post/cooking/personality/colors/seasons, none of which are realized in prs yet either). Six lessons: chore vocabulary (کار خانه/جاروب/ظرف/پاک as vocabulary cards, plus a شستن+کردن light-verb review note and two combined phrase cards جاروب می‌کنم/ظرف می‌شویم), a باید (must/need to) + bare-subjunctive-کنم construction restricted deliberately to کردن-based light verbs only (جاروب کردن, پاک کردن -- both drop the بـ- subjunctive prefix that a simple verb like شستن would otherwise require, per standard Dari light-verb subjunctive formation) to state which chore needs doing today, without introducing a second subjunctive-prefix pattern in the same unit -- a deliberate scope decision per AUTHORING_GUIDE.md §1, matching unit25's and unit29's own precedent of deliberately deferring a grammar form the outcome doesn't strictly require, a lesson introducing کمک (help, genuinely new -- previously only appeared inside an example sentence in unit08, which per §19 does not feed introduced_tokens or count as taught) plus the formal لطفاً کمک کنین request (reusing the established -ین formal-imperative family from کنین/می‌کنین/می‌خوانین) and the already-established کی (who, unit07) combined with the already-established 3rd-person می‌کند (unit18/26/29/30) to ask کی جاروب می‌کند؟, a Wahid/Shukria dialogue in the established informal تو/-ی register (matching the precedent set by units 20/25/26/28/29/30/31/32's informal forms; وحید and شکریه are fresh characters, deliberately not reusing بصیر/مریم again immediately after unit32 introduced them) covering one person sweeping, the other washing dishes and cleaning the room, with kمک and تشکر زیاد exchanged, a third-person reading passage continuing the same two characters and kept factually consistent with the dialogue (Wahid sweeps every day, Shukria washes the dishes, they also help each other, Wahid is happy -- no fact contradicts the dialogue, and deliberately avoids a 3rd-person-plural verb form entirely by keeping every reading-passage sentence to a single 3rd-person-singular subject, introducing only the one new 3rd-person form the unit needs, می‌شوید, with an explicit review grammar_note immediately before its first exercise use, applying the same lesson unit29/unit30/unit31/unit32's own reviews required), and a wrap-up combining a chore preference and a constraint with اما (کار خانه را دوست دارم اما وقت ندارم -- reusing the exact established را-marked دوست دارم/وقت/ندارم/اما construction unit32's own wrap-up used, continuing that same wrap-up shape rather than inventing a new one). Every word re-declared via introduced_tokens within THIS file per the standing per-file untaught-vocabulary footgun, even for words taught many units earlier (خانه/unit19, کار/unit18, می‌کنم/unit01-unit32, لطفاً/unit07-unit08, کردن/unit01-unit32, من/unit01, کنین/unit07, کی/unit07, می‌کند/unit18-unit30, تو/unit01, می‌کنی/unit26, هم/unit26, تشکر/زیاد/unit06-unit32, اتاق/unit19, را/unit01-unit32, او/unit24-unit32, هر/روز/unit12, است/throughout, خوشحال/unit25, دوست/دارم/وقت/ندارم/اما/unit11-unit32, بلی/unit07 -- all re-declared fresh here). Ran the same class of check prior reviews used: a mental token-by-token trace of every exercise's tested_text/word_bank/pairs value against this file's own cumulative introduced_tokens at that point in reading order, confirming every value is covered by a prior teaching card in this same file (not just a prior unit). Deliberately kept every production exercise (translate/writing_prompt) to a single independent clause except the established اما wrap-up construction, which -- matching unit32's own already-accepted precedent for that identical construction shape -- has exactly one natural conjunction reading, so the §12 period/comma multi-join-variant requirement was handled the same way unit32 handled it (period- and comma-joined variants of the same اما-joined sentence, not multiple distinct conjunctions). Reading-comprehension question (lesson05 exercise01) deliberately uses an English-language prompt rather than a Dari question word, following unit09's/unit32's own established fix for the 'prompt literally shows the correct answer' bug class, and to avoid needing to introduce an additional untaught Dari question word just for one exercise. Authored §14/§16/§17/§19-compliant from the start: no listen_type/listen_select/listen_order exercises (zero prs audio exists), every matching_pairs exercise sized 7 pairs, zero fill_in_blank, every kind:vocabulary card (کار خانه/جاروب/ظرف/پاک in lesson01, کمک in lesson03) has a real example sentence built entirely from already-taught-elsewhere-in-the-course or transparently-glossed words (examples are exempt from this file's own introduced_tokens scope per AUTHORING_GUIDE.md §19 -- they do not feed introduced_tokens and are never exercise-tested). Also ran a recursive yaml.safe_load boolean-coercion scan (not just grep) over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first). Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file). Deliberately double-checked he/she pronoun usage against the recent, real Pashto-vs-Dari pronoun bug found and fixed elsewhere this session (هغه/هغوی are Pashto, not Dari) -- this file uses only او for he/she (lesson05's reading passage and grammar note), never هغه/هغوی. Every literal ؟ inside an inline flow-mapping pair (matching_pairs left/right values, distractors) is quoted per the standing YAML footgun. schema_version 1.1 from the start.

