units:
  - content_key: prs.b1.unit10.descriptions
    title: توصیف
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.narrative.combine_descriptions_with_relative_clauses
    planned_lesson_count: 6

    lessons:
      - content_key: prs.b1.unit10.lesson01.subject_relative_clause
        title: همکاری که
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: prs.b1.unit10.lesson01.teach.ke
            kind: vocabulary
            target: {text: که, language_code: prs, direction: rtl}
            introduced_tokens: [که]
            example: {text: "همکاری که در دفتر کار می‌کند، مهربان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson01.teach.grammar_relative_clause
            kind: grammar_note
            target: {text: "که (that/who/which) introduces a relative clause -- it combines two separate facts about a person, place, or thing into one richer sentence: همکاری که در دفتر کار می‌کند، مهربان است = the colleague who works in the office is kind. که is INVARIANT in Dari -- it never changes for gender or number, unlike some other languages' relative pronouns. The -ی on همکاری is an indefinite marker often used on the head noun right before که.", language_code: prs, direction: rtl}
            introduced_tokens: [است]
          - content_key: prs.b1.unit10.lesson01.teach.hamkari
            kind: vocabulary
            target: {text: همکاری, language_code: prs, direction: rtl}
            introduced_tokens: [همکاری]
            example: {text: "همکاری که در دفتر کار می‌کند، مهربان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson01.teach.dar_daftar
            kind: vocabulary
            target: {text: "در دفتر", language_code: prs, direction: rtl}
            introduced_tokens: [در, دفتر]
            example: {text: "همکاری که در دفتر کار می‌کند، مهربان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson01.teach.kar_mikonad
            kind: vocabulary
            target: {text: "کار می‌کند", language_code: prs, direction: rtl}
            introduced_tokens: [کار, می‌کند]
            example: {text: "همکاری که در دفتر کار می‌کند، مهربان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson01.teach.mehraban
            kind: vocabulary
            target: {text: مهربان, language_code: prs, direction: rtl}
            introduced_tokens: [مهربان]
            example: {text: "همکاری که در دفتر کار می‌کند، مهربان است.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit10.lesson01.exercise01.recognize_ke
            type: multiple_choice
            tested_text: که
            prompt: {target_blocks: [{text: که, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit10.lesson01.exercise02.recognize_mehraban
            type: multiple_choice
            tested_text: مهربان
            prompt: {target_blocks: [{text: مهربان, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit10.lesson01.exercise03.order_hamkari_ke_daftar
            type: word_order
            tested_text: همکاری که در دفتر کار می‌کند مهربان است
            prompt: {target_blocks: []}
            word_bank: [همکاری, که, در, دفتر, کار, می‌کند, مهربان, است]
          - content_key: prs.b1.unit10.lesson01.exercise04.match_relative_words
            type: matching_pairs
            tested_text: "که همکاری در دفتر کار می‌کند مهربان"
            prompt: {target_blocks: []}
            pairs:
              - {left: که, right: "that / who"}
              - {left: همکاری, right: "a colleague"}
              - {left: دفتر, right: office}
              - {left: "کار می‌کند", right: "works"}
              - {left: مهربان, right: kind}
              - {left: در, right: in}
          - content_key: prs.b1.unit10.lesson01.exercise05.translate_colleague_kind
            type: translation
            tested_text: همکاری که در دفتر کار می‌کند، مهربان است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit10.lesson01.exercise06.speak_colleague_kind
            type: speak_response
            tested_text: همکاری که در دفتر کار می‌کند، مهربان است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit10.lesson01.exercise07.write_colleague_kind
            type: writing_prompt
            tested_text: همکاری که در دفتر کار می‌کند، مهربان است
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit10.lesson02.object_relative_clause
        title: موتری که خرید
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: prs.b1.unit10.lesson02.teach.moteri_ke
            kind: vocabulary
            target: {text: "موتری که", language_code: prs, direction: rtl}
            introduced_tokens: [موتری]
            example: {text: "موتری که همایون خرید، ارزان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson02.teach.khared
            kind: vocabulary
            target: {text: خرید, language_code: prs, direction: rtl}
            introduced_tokens: [خرید]
            example: {text: "موتری که همایون خرید، ارزان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson02.teach.grammar_object_relative
            kind: grammar_note
            target: {text: "The relativized noun can also be the OBJECT of the embedded verb, not just its subject: موتری که همایون خرید، ارزان است = the car that Homayoun bought is cheap -- که stands for موتری as the object of خرید (bought), while همایون is still the subject of that same embedded clause.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit10.lesson02.teach.review_homayoun
            kind: vocabulary
            target: {text: همایون, language_code: prs, direction: rtl}
            introduced_tokens: [همایون]
            example: {text: "موتری که همایون خرید، ارزان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson02.teach.review_arzan
            kind: vocabulary
            target: {text: ارزان, language_code: prs, direction: rtl}
            introduced_tokens: [ارزان]
            example: {text: "موتری که همایون خرید، ارزان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson02.teach.kari_ke
            kind: vocabulary
            target: {text: "کاری که", language_code: prs, direction: rtl}
            introduced_tokens: [کاری]
            example: {text: "کاری که زرمینه پیدا کرد، خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson02.teach.peida_kard
            kind: vocabulary
            target: {text: "پیدا کرد", language_code: prs, direction: rtl}
            introduced_tokens: ["پیدا", کرد]
            example: {text: "کاری که زرمینه پیدا کرد، خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson02.teach.review_zarmina
            kind: vocabulary
            target: {text: زرمینه, language_code: prs, direction: rtl}
            introduced_tokens: [زرمینه]
            example: {text: "کاری که زرمینه پیدا کرد، خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson02.teach.review_khoob
            kind: vocabulary
            target: {text: خوب, language_code: prs, direction: rtl}
            introduced_tokens: [خوب]
            example: {text: "کاری که زرمینه پیدا کرد، خوب است.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit10.lesson02.exercise01.recognize_khared
            type: multiple_choice
            tested_text: خرید
            prompt: {target_blocks: [{text: خرید, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit10.lesson02.exercise02.recognize_peida_kard
            type: multiple_choice
            tested_text: "پیدا کرد"
            prompt: {target_blocks: [{text: "پیدا کرد", language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit10.lesson02.exercise03.order_moteri_ke_homayoun
            type: word_order
            tested_text: موتری که همایون خرید ارزان است
            prompt: {target_blocks: []}
            word_bank: [موتری, که, همایون, خرید, ارزان, است]
          - content_key: prs.b1.unit10.lesson02.exercise04.match_object_relative_words
            type: matching_pairs
            tested_text: "موتری کاری خرید پیدا کرد ارزان خوب"
            prompt: {target_blocks: []}
            pairs:
              - {left: موتری, right: "a car"}
              - {left: کاری, right: "a job"}
              - {left: خرید, right: bought}
              - {left: "پیدا کرد", right: found}
              - {left: ارزان, right: cheap}
              - {left: خوب, right: good}
          - content_key: prs.b1.unit10.lesson02.exercise05.translate_job_zarmina_found
            type: translation
            tested_text: کاری که زرمینه پیدا کرد، خوب است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit10.lesson02.exercise06.speak_car_homayoun_bought
            type: speak_response
            tested_text: موتری که همایون خرید، ارزان است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit10.lesson02.exercise07.write_job_zarmina_found
            type: writing_prompt
            tested_text: کاری که زرمینه پیدا کرد، خوب است
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit10.lesson03.preposition_relative_clause
        title: مدیری که با او
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: prs.b1.unit10.lesson03.teach.modiri_ke
            kind: vocabulary
            target: {text: "مدیری که", language_code: prs, direction: rtl}
            introduced_tokens: [مدیری]
            example: {text: "مدیری که همایون با او کار می‌کند، مهربان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson03.teach.ba_oo
            kind: vocabulary
            target: {text: "با او", language_code: prs, direction: rtl}
            introduced_tokens: [با, او]
            example: {text: "مدیری که همایون با او کار می‌کند، مهربان است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson03.teach.grammar_resumptive
            kind: grammar_note
            target: {text: "که alone cannot carry a PREPOSITION -- when the relativized noun needs one (with, in, to...), Dari repeats it inside the clause with a resumptive pronoun (او 'he/she/it', or آن 'it'): مدیری که همایون با او کار می‌کند = the manager THAT Homayoun works WITH HIM (= the manager Homayoun works with). Dropping با او and leaving just که همایون کار می‌کند would lose the 'with' relationship entirely.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit10.lesson03.teach.daftari_ke
            kind: vocabulary
            target: {text: "دفتری که", language_code: prs, direction: rtl}
            introduced_tokens: [دفتری]
            example: {text: "دفتری که همایون در آن کار می‌کند، نزدیک خانه است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson03.teach.dar_aan
            kind: vocabulary
            target: {text: "در آن", language_code: prs, direction: rtl}
            introduced_tokens: [آن]
            example: {text: "دفتری که همایون در آن کار می‌کند، نزدیک خانه است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson03.teach.nazdik
            kind: vocabulary
            target: {text: نزدیک, language_code: prs, direction: rtl}
            introduced_tokens: [نزدیک]
            example: {text: "دفتری که همایون در آن کار می‌کند، نزدیک خانه است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson03.teach.review_khana
            kind: vocabulary
            target: {text: خانه, language_code: prs, direction: rtl}
            introduced_tokens: [خانه]
            example: {text: "دفتری که همایون در آن کار می‌کند، نزدیک خانه است.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit10.lesson03.exercise01.recognize_ba_oo
            type: multiple_choice
            tested_text: "با او"
            prompt: {target_blocks: [{text: "با او", language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit10.lesson03.exercise02.recognize_nazdik
            type: multiple_choice
            tested_text: نزدیک
            prompt: {target_blocks: [{text: نزدیک, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit10.lesson03.exercise03.order_modiri_ke_ba_oo
            type: word_order
            tested_text: مدیری که همایون با او کار می‌کند مهربان است
            prompt: {target_blocks: []}
            word_bank: [مدیری, که, همایون, با, او, کار, می‌کند, مهربان, است]
          - content_key: prs.b1.unit10.lesson03.exercise04.match_preposition_words
            type: matching_pairs
            tested_text: "مدیری دفتری با او در آن نزدیک"
            prompt: {target_blocks: []}
            pairs:
              - {left: مدیری, right: "a manager"}
              - {left: دفتری, right: "an office"}
              - {left: "با او", right: "with him"}
              - {left: "در آن", right: "in it"}
              - {left: نزدیک, right: near}
              - {left: خانه, right: house}
          - content_key: prs.b1.unit10.lesson03.exercise05.translate_office_near_home
            type: translation
            tested_text: دفتری که همایون در آن کار می‌کند، نزدیک خانه است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit10.lesson03.exercise06.speak_manager_kind
            type: speak_response
            tested_text: مدیری که همایون با او کار می‌کند، مهربان است
            prompt: {target_blocks: []}
          - content_key: prs.b1.unit10.lesson03.exercise07.write_manager_kind
            type: writing_prompt
            tested_text: مدیری که همایون با او کار می‌کند، مهربان است
            prompt: {target_blocks: []}

      - content_key: prs.b1.unit10.lesson04.dialogue_new_car_job
        title: موتر و کار نو
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: prs.b1.unit10.lesson04.teach.khaste_ke
            kind: vocabulary
            target: {text: کوچک, language_code: prs, direction: rtl}
            introduced_tokens: [کوچک]
            example: {text: "موتری که خریدم، خوب است، هرچند کوچک است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson04.teach.aali
            kind: vocabulary
            target: {text: عالی, language_code: prs, direction: rtl}
            introduced_tokens: [عالی]
            example: {text: "کاری که پیدا کردم، عالی است.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson04.teach.khoshhalam_ke
            kind: vocabulary
            target: {text: "خوشحالم که", language_code: prs, direction: rtl}
            introduced_tokens: [خوشحالم]
            example: {text: "خوشحالم که هر دو خوشحال استیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson04.teach.khoshhal_astim
            kind: vocabulary
            target: {text: "خوشحال استیم", language_code: prs, direction: rtl}
            introduced_tokens: [خوشحال, استیم]
            example: {text: "هر دو خوشحال استیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson04.teach.review_har_do
            kind: vocabulary
            target: {text: "هر دو", language_code: prs, direction: rtl}
            introduced_tokens: [هر, دو]
            example: {text: "هر دو خوشحال استیم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit10.lesson04.teach.review_chetor
            kind: vocabulary
            target: {text: چطور, language_code: prs, direction: rtl}
            introduced_tokens: [چطور]
            example: {text: "این موتری که خریدی، چطور است؟", language_code: prs, direction: rtl}
