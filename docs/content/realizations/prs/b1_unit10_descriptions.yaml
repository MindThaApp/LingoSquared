generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    Second-wave prs B1 unit (10 of 11). Spine outcome
    universal.b1.narrative.combine_descriptions_with_relative_clauses is
    adapted in part from a real public-domain source: .firecrawl/
    dli-dari-s17-20.txt (already scraped from the DLI Dari Basic Course
    in an earlier session; firecrawl itself currently returns HTTP 402,
    no new search/scrape attempted) Lesson 20's "Relative clauses" grammar
    note confirms که ('that/who/which') as Dari's invariant relative
    marker with real example sentences (کریم که از شش سال به اینطرف در
    یک خانهء کرایی زندگی میکند، میخواهد یک خانهء نو بخرد -- "Karim, who
    has been living in a rental house for six years, wants to buy a new
    house"). The source's own register (embassy/diplomat-era formal
    written Dari) was NOT copied -- every sentence here is freshly
    authored in this course's established colloquial register and cast.
    The spine outcome's own English-centric phrasing ("cases where the
    relative pronoun must agree in gender/number") does not literally
    apply to Dari -- که is invariant, with no gender/number agreement at
    all, unlike French/German/Dutch equivalents. The genuinely comparable
    real complexity in Dari is the PREPOSITION+RESUMPTIVE-PRONOUN
    requirement when the relativized element is oblique (not the subject
    or a bare direct object of the embedded clause): مدیری که همایون با
    او کار می‌کند (the manager that Homayoun works WITH HIM) needs با او
    inside the clause, since که alone cannot carry a preposition the way
    English 'whom'/'which' can. Lesson03 teaches exactly this. Continues
    the recurring Zarmina/Homayoun cast, paying off two running
    storylines from this second wave: Homayoun bought the cheaper car
    unit08's debate resolved on, and Zarmina found the good job she and
    Homayoun wished for in unit07 -- both now described using this unit's
    relative-clause construction, not just restated as new facts.
    Register: continues شما+ین (چطور/شما established a1_unit01/
    a1_unit02), no تو; new regular-verb forms (خریدن، پیدا کردن) use the
    standard د/ید/ند-ending paradigm.
    STATUS: draft, review pending -- has NOT yet been through the
    mandatory fresh-context review. Do not import/ship until that review
    completes.
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    A fresh-context reviewer (zero access to this authoring's reasoning,
    per AUTHORING_GUIDE.md #9, and instructed not to open the prs-en
    sibling overlay per #8) should check in particular: (1) whether که's
    invariance (no gender/number marking) is explained clearly and
    accurately, and whether the indefinite -ی suffix on a head noun
    before a relative clause (همکاری که..., موتری که...) is used
    correctly throughout; (2) the با او/در آن resumptive-pronoun
    construction in lesson03 -- is it natural, and does the fresh
    reviewer's own Dari knowledge confirm که alone (without the
    resumptive pronoun) would genuinely be wrong or just less natural
    here; (3) script purity (Persian-range ک/ی only, no Arabic-range
    codepoints); (4) no internal-jargon leaks; (5) every exercise type
    used (multiple_choice, word_order, matching_pairs, translation,
    speak_response, writing_prompt, dialogue_response) is registered in
    ExerciseRenderer.tsx; (6) cross-lesson fact consistency (Homayoun's
    car and Zarmina's job agreeing between lesson04's dialogue and
    lesson05's reading, and both consistent with unit06/07/08's
    established goal-in-progress framing -- these are the first units
    where both goals are described as ACHIEVED, so double-check nothing
    upstream already assumed they weren't); (7) that every word_order/
    listen_order word_bank multiset exactly matches its accepted-answer
    token multiset.

