          - content_key: prs.a2.unit12.lesson01.teach.duration_word
            kind: vocabulary
            target: {text: مدت, language_code: prs, direction: rtl}
            introduced_tokens: [مدت]
            example: {text: "مدت مریضی‌ام دو روز است.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit12.lesson01.teach.severe_word
