    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit38.lesson01.primary_colors
        title: رنگ‌های اصلی
        spine_outcome_id: universal.a1.colors.describe_colors
        teaching:
          - content_key: prs.a1.unit38.lesson01.teach.review_basics
            kind: grammar_note
            target: {text: "رنگ (color) / است (is) / سیاه (black) / سفید (white) / سرخ (red)", language_code: prs, direction: rtl}
            introduced_tokens: [رنگ, است, سیاه, سفید, سرخ]
          - content_key: prs.a1.unit38.lesson01.teach.review_objects
            kind: grammar_note
            target: {text: "این (this) / پیراهن (shirt) / موتر (car) / کتاب (book) / من (I) / و (and) / اما (but)", language_code: prs, direction: rtl}
            introduced_tokens: [این, پیراهن, موتر, کتاب, من, و, اما]
          - content_key: prs.a1.unit38.lesson01.teach.abi_word
            kind: vocabulary
            target: {text: آبی, language_code: prs, direction: rtl}
            introduced_tokens: [آبی]
            example: {text: "موتر آبی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit38.lesson01.teach.zard_word
            kind: vocabulary
            target: {text: زرد, language_code: prs, direction: rtl}
            introduced_tokens: [زرد]
            example: {text: "این پیراهن زرد است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit38.lesson01.teach.sabz_word
            kind: vocabulary
            target: {text: سبز, language_code: prs, direction: rtl}
            introduced_tokens: [سبز]
            example: {text: "کتاب سبز است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit38.lesson01.teach.narenji_word
            kind: vocabulary
            target: {text: نارنجی, language_code: prs, direction: rtl}
            introduced_tokens: [نارنجی]
            example: {text: "این پیراهن نارنجی است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit38.lesson01.teach.blue_and_white_phrase
            kind: phrase
            target: {text: "پیراهن من آبی و سفید است.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.a1.unit38.lesson01.teach.black_but_orange_phrase
            kind: phrase
            target: {text: "موتر سیاه است، اما پیراهن نارنجی است.", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit38.lesson01.exercise01.recognize_blue
            type: multiple_choice
            tested_text: آبی
            prompt: {target_blocks: [{text: آبی, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit38.lesson01.exercise02.recognize_green
            type: multiple_choice
            tested_text: سبز
            prompt: {target_blocks: [{text: سبز, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit38.lesson01.exercise03.recognize_black_but_orange
            type: multiple_choice
            tested_text: "موتر سیاه است، اما پیراهن نارنجی است."
            prompt: {target_blocks: [{text: "موتر سیاه است، اما پیراهن نارنجی است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit38.lesson01.exercise04.match_primary_colors
            type: matching_pairs
            tested_text: "آبی زرد سبز نارنجی رنگ پیراهن من آبی و سفید است موتر سیاه است اما پیراهن نارنجی است"
            prompt: {target_blocks: []}
            pairs:
              - {left: آبی, right: blue}
              - {left: زرد, right: yellow}
              - {left: سبز, right: green}
              - {left: نارنجی, right: orange}
              - {left: رنگ, right: color}
              - {left: "پیراهن من آبی و سفید است.", right: "My shirt is blue and white."}
              - {left: "موتر سیاه است، اما پیراهن نارنجی است.", right: "The car is black, but the shirt is orange."}
          - content_key: prs.a1.unit38.lesson01.exercise05.order_yellow_shirt
