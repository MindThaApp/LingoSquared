generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Firecrawl was unavailable this session (0/1000 credits) so real, direct WebSearch/WebFetch access was used instead of falling straight back to established conventions. `WebSearch \"DLI Dari basic course colors lesson fsi-languages.yojik.eu\"` returned only the same Semester-1 lesson-group PDF links already catalogued by unit36/unit37's own provenance notes (introductory lessons, 1-4, 5-8, ..., 37-40), with no dedicated colors lesson visible in any title. `WebFetch` on the DLI Dari course index page itself (fsi-languages.yojik.eu/languages/DLI/DLI-Dari.html) was also run directly and confirmed no colors/object-description lesson topic appears anywhere on that index (only semester/lesson-group organizational links, consistent with what unit37's search already found for personality). A direct `WebFetch` of the introductory-lessons PDF (the most likely place basic color vocabulary would appear, since colors are typically taught as early core vocabulary) was attempted but the file exceeded the fetch tool's 10MB content limit and could not be retrieved this session -- a real tooling constraint, not a skipped search. `WebSearch \"Peace Corps Dari colors vocabulary lesson\"` likewise returned only the general Peace Corps Dari course description page (no lesson-level breakdown) with no dedicated colors section identifiable. Given unit37's own exhaustive 8-PDF full-table-of-contents scrape already found zero colors-adjacent lesson titles among all 40 Semester-1 lessons, and this unit's own fresh index-page fetch found nothing further, this spine outcome is treated as having no DLI Dari or Peace Corps Dari counterpart -- a genuine negative result from real investigation across two separate authoring sessions now, not an unlooked-for gap. A supplementary `WebSearch` for Dari/Persian color terms (سرخ/آبی/زرد) was also run purely to cross-check external usage and confirmed سرخ (red), آبی (blue), and زرد (yellow) as standard shared Dari/Persian color vocabulary, consistent with what this course already shipped in unit21's clothing/colors sub-lesson (رنگ/سیاه/سفید/سرخ). Authored from those already-established in-course conventions (unit21's رنگ/سیاه/سفید/سرخ, unit14's دوست دارم/دوست ندارم/کدام/را, unit19's اتاق/میز/خانه, unit24's موتر), extended with additional standard Kabul Dari color vocabulary (آبی/زرد/سبز/نارنجی/خاکستری/بنفش/قهوه‌یی) not previously taught, modernized current spoken Kabul Dari register throughout, not a translation of any single source."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit37 (personality). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.colors.describe_colors as the next unrealized A1 outcome (immediately after personality in spine file order, prerequisite universal.a1.shopping.ask_prices_quantities already realized as unit10). This unit covers identifying and describing the colors of everyday objects: core new colors (blue, yellow, green, orange, gray, purple, brown -- black/white/red and the base word رنگ were already taught in unit21's clothing colors sub-lesson and are re-declared here per the compiler's per-file taught-vocabulary check, not re-taught as new), asking چه رنگ است؟ (what color is it?) reusing unit21's own established question form, asking and stating color preference with کدام/را/دوست دارم/دوست دارین/دوست دارد (reusing unit14 preferences' established دوست داشتن paradigm rather than inventing a new one), a two-speaker Homayoun/Zarmina dialogue about the colors of her car and shirt (continuing the Homayoun/Zarmina throughline from units 20/25/27/37), a short third-person reading passage describing Zarmina's house/room/table colors (reusing unit19's اتاق/میز/خانه household vocabulary), and a wrap-up contrasting a liked and disliked color with اما plus a formal direct question. Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (رنگ/سیاه/سفید/سرخ from unit21, پیراهن from unit21, موتر from unit24, کتاب/خانه/اتاق/میز from unit19/elsewhere, دوست دارم/دارین/دارد/ندارم/کدام/را from unit14, چه/این/او/شما/من from many earlier units). Uses او for he/she only; no Pashto هغه/هغوی. Uses موتر (not ماشین) for car, consistent with unit24's established Afghan-Dari-specific choice. All colors taught (آبی/زرد/سبز/نارنجی/خاکستری/بنفش/قهوه‌یی, plus the redeclared سیاه/سفید/سرخ) are standard everyday Kabul Dari shared with Farsi, not borrowed Iranian-specific terms -- cross-checked against unit21's own register-policy note and an external web search confirming سرخ/آبی/زرد as standard Dari/Persian terms (see generation_provenance for the exact search/fetch attempts made this session). Dialogue turns use structured speaker fields only. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists). Matching-pairs exercises use seven pairs each (AUTHORING_GUIDE.md #16). Every vocabulary teaching card has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19); grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-37), though this unit's color-of-object
    sentences are mostly 3rd-person (است/دارد) since objects, not people,
    are being described -- no استم/استین forms are needed for that, and
    none are forced in artificially. The Homayoun/Zarmina dialogue
    (lesson04) continues their established informal تو-register
    friendship from units 20/25/27/37, here using the formal-neutral
    شما/است forms toward each other about their own possessions, matching
    the register already used in their unit37 dialogue. All new color
    vocabulary (آبی، زرد، سبز، نارنجی، خاکستری، بنفش، قهوه‌یی) is standard
    everyday Kabul Dari, shared with Farsi but not a borrowed
    Iranian-specific term -- no dialect-divergence risk here, unlike
    موتر/تکت in unit24.

