  notes: "New unit, prs's next uncovered outcome (universal.a1.comparisons.make_basic_comparisons, prerequisites: preferences and numbers, both already covered in unit14/unit04). Six lessons: basic comparative forms (بزرگ‌تر است/کوچک‌تر است), comparing prices (گران‌تر است/ارزان‌تر است), comparing people (قد بلندتر است/جوان‌تر است), giving a reason for a comparison (بهتر است/بدتر است + چون), reading a short comparison text, and a dialogue comparing two options while making a purchase decision. Uses full, uncontracted forms throughout (comparative + است kept as two words, not fused/contracted) and standard Dari spellings (کوچک not Iranian کوچیک, گران not گرون, ارزان not ارزون, جوان not جوون) -- deliberately distinct from the fa sibling's colloquial fused-contraction register, consistent with the established استم/استین full-form register policy from units 01-14. Authored independently of the fa realization per the sibling-isolation rule. Authored §14/§16/§17-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, every matching_pairs exercise sized 6 pairs except lesson01's genuine 4-pair first-lesson ceiling, and zero fill_in_blank exercises. Both open-ended production exercises (write_own_comparison, dialogue_response_own_comparison) carry multiple adjective/topic variants from the start, learned from the fa sibling unit's own review findings on unit14. Multi-clause reason exercises include period-joined, comma-joined, and و-joined accepted variants per §12. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-07 (zero prior context, fa sibling files never opened, this unit's/overlay's own authoring reasoning not consulted beyond the two files themselves). Verified against universal.a1.comparisons.make_basic_comparisons's own can_do/prerequisites/assessment_requirements in universal_spine.yaml -- all 4 covered (understand_comparison via lesson05/06's reading_comprehension/dialogue_comprehension, read-substituting-for-listening per the established zero-prs-audio §14 pattern; make_comparison via the translation/dialogue_response production exercises; read_comparison via the reading_comprehension exercises; write_comparison via the writing_prompt/translation exercises), every lesson genuinely serves the declared outcome, no drift. Exercise pacing (recognition -> drag/matching -> production) confirmed in all 6 lessons, matching unit13/14's own already-reviewed lesson06 precedent (an extra recognition-type exercise interleaved after the matching exercise, before production, in lesson06 -- not a violation, since production never precedes recognition/drag exposure). §14 verified true by grep: zero listen_type/listen_select/listen_order anywhere. §16 verified: lesson01's matching_pairs is a genuine 4-pair ceiling, lessons02-06 all exactly 6 pairs. §17 verified true by grep (zero fill_in_blank in either file) and by manually auditing every translation/dialogue_response/writing_prompt's accepted_answers, especially lesson05.exercise05/lesson06.exercise04/lesson06.exercise05, for the same underlying ambiguity in a different guise -- confirmed genuine multi-answer coverage (8, 4, and 4 accepted variants respectively), not a disguised bug, via direct code read of grade()/is_multi_answer_response() in backend/app/api/router.py confirming the generic accepted-list path checks every entry, not just the first. Grammar/dialect independently verified via live web search (not just reasoning): the X-از-Y-ADJ‌تر-است comparison construction, از as 'than' distinct from 'from', بزرگ‌تر/کوچک‌تر/گران‌تر/ارزان‌تر as regular comparatives, بهتر/بدتر as the genuine irregular/suppletive comparatives of خوب/بد, قد بلندتر است as a natural (non-calque) Dari idiom for 'taller', and all five claimed Dari-vs-Iranian-colloquial spelling pairs (کوچک/کوچیک, گران/گرون, ارزان/ارزون, جوان/جوون, آن/اون) were all confirmed correct against independent grammar/phonology sources. A1-complexity judged appropriate (3rd-person-only copula constructions, short 2-6-word phrases, familiar vocabulary, matching unit13/14's pacing). Script purity clean (zero Arabic-range kaf/yeh codepoints in either file, checked programmatically). No jargon leaks: ran a programmatic recursive check against every string value in the overlay -- the only snake_case-looking matches were in non-learner-facing metadata (status, generation_provenance.method, review.notes), zero leaks in any learner-facing field. Independently re-verified the pre-dispatch bali_word Yes/yes boolean-coercion fix is correct (both quoted, both parse as strings) and wrote and ran a fresh, real recursive yaml.safe_load-based Python script checking every dict value in both files for a stray Python bool -- found zero stray booleans anywhere (only the two legitimate schema booleans, human_reviewed/target_language_first, neither present in this pair), confirming no second instance exists. Wrote and ran a real Python script comparing every exercise's realization prompt.target_blocks (language_code: en) against that exercise's overlay instruction field for an exact case-insensitive match -- zero duplicate-instruction-text bugs found in this pair. Wrote and ran a ZWNJ-aware, Persian-punctuation-stripping Python tokenizer checking every tested_text/prompt.target_blocks(prs)/pairs.left/word_bank value and every overlay accepted_answers/correct_option/distractors Dari-script value against cumulative file-scoped introduced_tokens -- zero untaught-vocabulary violations. Checked every multiple_choice/reading_comprehension/dialogue_comprehension exercise for the prompt-shows-answer bug -- all correct_option/distractors are English glosses against Dari-script prompts, no same-script leakage. Confirmed content_key parity exact both directions (1 unit/6 lessons/20 teaching/30 exercises each side). Confirmed all 7 exercise types used (multiple_choice/matching_pairs/translation/reading_comprehension/dialogue_comprehension/dialogue_response/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx. Cross-checked §11 facts across every exercise/teaching card: Karim-taller/Negar-younger is stated identically in lesson03 and lesson05's reading text with no contradiction; lesson06's dialogue facts (this=more expensive but better, that=cheaper) are consistent across its comprehension, matching, dialogue-response, and summary exercises. Verified §12 multi-clause coverage: lesson04's two because-exercises and lesson06's write_comparison_summary all carry period-joined, comma-joined, and و-joined status:correct variants (the و-joined reason-clause variants substitute و for چون, e.g. 'این از آن بهتر است و ارزان‌تر است' -- confirmed this exact pattern is the established, already-reviewed convention from unit14's own fresh-context review, not a new gap). Re-ran validate and compile (not just validate) as the actual final check: 0 errors/0 warnings both times, compile output valid JSON, and directly inspected the compiled correct_response for all 30 exercises -- none empty, and the 5 multi-answer exercises (lesson04.exercise04/05, lesson05.exercise05, lesson06.exercise04/05) compiled with 4/4/8/4/4 accepted variants respectively, matching the overlay source exactly. No real bugs required fixing in this pair beyond the single pre-dispatch bali_word quoting fix (independently re-verified correct) -- this unit was genuinely authored clean from the start, proactively incorporating unit13/14's own prior review findings (multi-topic variants, §12 punctuation forms, §14/16/17 compliance) before this review ever ran.

