generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    prs's second B1 unit. Uses the ALREADY-EXISTING spine outcome
    universal.b1.necessity.express_obligation_with_subjunctive (no new
    spine outcome needed -- prerequisite universal.a2.opinions.
    give_opinions_with_reasons is already realized via
    prs/a2_unit10_opinions.yaml). Deliberately continues the same
    B1 modal-plus-subjunctive grammar arc as prs's b1_unit01 (ability,
    می‌توانم که + subjunctive) with a DIFFERENT invariant modal: باید
    (must/should) + bare subjunctive, no که-clause -- باید itself never
    conjugates, only the following verb changes with person
    (باید بخرم / باید بخری / باید بخره...), mirroring the person-ending
    pattern of می‌توانم in b1_unit01 (full form: م/ی/د/یم/ین/ند; this unit's
    باید verbs use colloquial ه in 3sg and ن in 3pl),
    which reinforces the paradigm rather than introducing an unrelated
    shape. Past/counterfactual obligation (باید می‌خریدم = "I should have
    bought," an unfulfilled-obligation construction using باید + the past
    imperfect stem) and negation (نباید = must not) are taught as the
    second half of the unit, mirroring b1_unit01's present/past structure.
    Source-material check: firecrawl had 0/1000 credits remaining this
    session (checked via `firecrawl --status` before starting), so no
    fresh public-domain source search was attempted for this specific
    pass; this is established-conventions authoring (general Persian/Dari
    grammar knowledge -- باید as an invariant modal particle followed by
    subjunctive agreement is standard, well-documented Persian/Dari
    grammar, not something requiring a source text to get right), the
    same honest fallback path used for fa's own b1_unit01 (necessity),
    which used the identical grammar pattern and passed its own
    fresh-context review. Scenario is original: Zarmina and Homayoun
    (established recurring cast, prs units 11/12/20/21/b1_unit01)
    preparing their home for guests arriving that evening -- a fresh
    scenario distinct from both b1_unit01's post-office/doctor errands
    and fa's b1_unit01's workplace-report-deadline scenario, while
    reusing the same character cast per the project's cast-continuity
    convention. All vocabulary is introduced self-contained within this
    file (introduced_tokens are file-scoped per project convention, so
    even already-established words like زرمینه/همایون/دیروز are re-taught
    here). Dialect: continues the same استم/استین-adjacent, fuller
    written-leaning register and colloquial ه/ن person-ending
    pattern for باید verbs (می‌توانم itself is the full form) established across prs units 01-b1_unit01 --
    باید itself has no register variant in spoken Dari (register-neutral,
    same word in casual and careful speech), stated explicitly in the
    lesson01 grammar note. Every kind:vocabulary card carries a real
    example sentence per AUTHORING_GUIDE.md #19. No listen_type/
    listen_select/listen_order anywhere (AUTHORING_GUIDE.md #14 -- prs
    still has zero TTS/recorded-audio coverage). Every matching_pairs
    exercise uses 6 pairs (AUTHORING_GUIDE.md #16). STATUS: freshly
    authored this pass, NOT yet through the mandatory fresh-context
    review -- review.status is honestly left unreviewed below.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Not yet reviewed. A fresh-context reviewer (zero access to this
    authoring's reasoning, per AUTHORING_GUIDE.md #9, and instructed not
    to open the prs-en sibling overlay per #8) should check in particular:
    (1) the باید-invariant + subjunctive-agreement grammar throughout
    (lessons 1-3, 6); (2) the باید + past-imperfect-stem past-regret
    construction (باید می‌خریدم, lesson03, reused in lesson05's reading
    and lesson06's wrap-up) for genuine grammatical accuracy, not just
    surface plausibility; (3) نباید's negation morpheme (ن- prefix, not
    نه-, matching the same fix b1_unit01's own review had to make for
    نتانستم -- verify this file never repeats that specific error); (4)
    script purity (Persian-range ک/ی only, no Arabic-range codepoints);
    (5) no internal-jargon leaks in learner-facing text; (6) every
    exercise type used (multiple_choice, word_order, matching_pairs,
    translation, speak_response, writing_prompt, dialogue_response) is
    registered in ExerciseRenderer.tsx; (7) cross-lesson fact consistency
    (Zarmina/Homayoun's guests-tonight scenario, the last-year-sick /
    this-year-well narrative in lesson05); (8) that every word_order/
    listen_order word_bank multiset exactly matches its accepted-answer
    token multiset (this file was authored with the new
    validate_order_word_bank_answers compiler check already active and
    was hand-verified against it before this note was written, but a
    fresh reviewer should re-confirm via a real compiler run, not trust
    the authoring self-report).

    Review 2026-10-19: 9 fixes - lesson03 matching_pairs glossed bare
    بخرم/می‌خریدم as 'I must buy'/'I should have bought' (wrong sense
    without باید), lefts now باید بخرم/باید می‌خریدم; بپزم/بپزد glossed
    '(will) cook' (subjunctive, not future) now '(should) cook'; بپزد note
    now explains its written -د ending vs colloquial بخره; باید note no
    longer claims it never changes form (نباید); 'past imperfect stem'
    corrected to 'past continuous form' (2 notes); چه کار داری example
    gloss made idiomatic; added full-form بخرد/بخرند variants (lesson02
    ex05/ex07), plural/polite بخرین variants for 'you' prompts (lesson01
    ex06, lesson03 ex05), and word-order variants (lesson05 ex05, lesson06
    ex03). NATIVE FLAGS: the unit mixes colloquial 3sg/3pl بخره/بخرن with
    written بپزد/می‌تواند/می‌کند; lesson05 ex02 prompt 'امسال زرمینه چه
    کار می‌تواند؟' lacks a following verb (same as b1_unit01; maybe چه کار
    کرده می‌تواند).

course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین-adjacent, fuller written-leaning
    register from prs's other units, and the same person-ending
    pattern b1_unit01 established for می‌توانم (م/ی/یم/ین; colloquial ه/ن
    in 3sg/3pl of the باید verbs), now applied to the subjunctive verb
    following باید. باید itself is invariant and
    register-neutral in spoken Dari -- used identically in casual and
    careful speech, unlike می‌توانم (full form canonical; contracted می‌تانم
    accepted only as a variant); this unit's grammar note (lesson01) states that explicitly.

