units:
  - content_key: prs.a1.unit13.plans
    title: پلان کردن
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.plans.make_simple_plans
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit13.lesson01.plan_vocabulary
        title: کلمات پلان کردن
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - content_key: prs.a1.unit13.lesson01.teach.plan_word
            kind: vocabulary
            target: {text: پلان, language_code: prs, direction: rtl}
            introduced_tokens: [پلان]
            example: {text: "من یک پلان دارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson01.teach.park_word
            kind: vocabulary
            target: {text: پارک, language_code: prs, direction: rtl}
            introduced_tokens: [پارک]
            example: {text: "من به پارک می‌روم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson01.teach.berawim_word
            kind: vocabulary
            target: {text: برویم, language_code: prs, direction: rtl}
            introduced_tokens: [برویم]
            example: {text: "برویم پارک", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson01.teach.chetor_ast_word
            kind: phrase
            target: {text: "چطور است؟", language_code: prs, direction: rtl}
            introduced_tokens: [چطور, "است؟"]
        exercises:
          - content_key: prs.a1.unit13.lesson01.exercise01.recognize_plan_reading
            type: multiple_choice
            tested_text: پلان
            prompt: {target_blocks: [{text: پلان, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit13.lesson01.exercise02.recognize_park_reading
            type: multiple_choice
            tested_text: پارک
            prompt: {target_blocks: [{text: پارک, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit13.lesson01.exercise03.match_plan_words
            type: matching_pairs
            tested_text: "پلان پارک برویم چطور است"
            prompt: {target_blocks: []}
            pairs:
              - {left: پلان, right: plan}
              - {left: پارک, right: park}
              - {left: برویم, right: "let's go"}
              - {left: "چطور است؟", right: "How about it?"}
              - {left: قرار, right: appointment}
              - {left: جمعه, right: Friday}
              - {left: امروز, right: today}
          - content_key: prs.a1.unit13.lesson01.exercise04.translate_plan
            type: translation
            tested_text: پلان
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit13.lesson01.exercise05.translate_lets_go
            type: translation
            tested_text: برویم
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit13.lesson02.proposing_a_plan
        title: پیشنهاد یک پلان
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - content_key: prs.a1.unit13.lesson02.teach.mikhahid_word
            kind: vocabulary
            target: {text: می‌خواهین, language_code: prs, direction: rtl}
            introduced_tokens: [می‌خواهین]
            example: {text: "می‌خواهین برویم پارک؟", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson02.teach.jomeh_review
            kind: vocabulary
            target: {text: جمعه, language_code: prs, direction: rtl}
            introduced_tokens: [جمعه]
            example: {text: "جمعه برویم پارک؟", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson02.teach.propose_phrase
            kind: phrase
            target: {text: "می‌خواهین جمعه برویم پارک؟", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit13.lesson02.exercise01.recognize_propose_reading
            type: multiple_choice
            tested_text: "می‌خواهین جمعه برویم پارک"
            prompt: {target_blocks: [{text: "می‌خواهین جمعه برویم پارک؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit13.lesson02.exercise02.match_propose_words
            type: matching_pairs
            tested_text: "می‌خواهین جمعه برویم پارک می‌خواهین جمعه برویم پارک چطور است"
            prompt: {target_blocks: []}
            pairs:
              - {left: "می‌خواهین جمعه برویم پارک؟", right: "Do you want to go to the park on Friday?"}
              - {left: می‌خواهین, right: "do you want (polite)"}
              - {left: جمعه, right: Friday}
              - {left: برویم, right: "let's go"}
              - {left: پارک, right: park}
              - {left: "چطور است؟", right: "How about it?"}
          - content_key: prs.a1.unit13.lesson02.exercise03.order_propose_plan
            type: word_order
            tested_text: "می‌خواهین جمعه برویم پارک"
            prompt: {target_blocks: [{text: "Do you want to go to the park on Friday?", language_code: en, direction: ltr}]}
            word_bank: [می‌خواهین, جمعه, برویم, پارک]
          - content_key: prs.a1.unit13.lesson02.exercise04.translate_propose_plan
            type: translation
            tested_text: "می‌خواهین جمعه برویم پارک"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit13.lesson02.exercise05.dialogue_response_propose
            type: dialogue_response
            tested_text: "می‌خواهین جمعه برویم پارک"
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit13.lesson03.accepting_a_plan
        title: قبول کردن پلان
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - content_key: prs.a1.unit13.lesson03.teach.khoob_ast_word
            kind: vocabulary
            target: {text: "خوب است", language_code: prs, direction: rtl}
            introduced_tokens: ["خوب", "است"]
            example: {text: "جمعه خوب است", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson03.teach.aali_ast_word
            kind: vocabulary
            target: {text: "عالی است", language_code: prs, direction: rtl}
            introduced_tokens: [عالی]
            example: {text: "پارک عالی است", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson03.teach.qabool_ast_word
            kind: vocabulary
            target: {text: "قبول است", language_code: prs, direction: rtl}
            introduced_tokens: [قبول]
            example: {text: "قبول است، جمعه برویم پارک", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson03.teach.aali_o_qabool
            kind: phrase
            target: {text: "عالی است و قبول است", language_code: prs, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: prs.a1.unit13.lesson03.exercise01.recognize_khoob_reading
            type: multiple_choice
            tested_text: "خوب است"
            prompt: {target_blocks: [{text: "خوب است", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit13.lesson03.exercise02.recognize_qabool_reading
            type: multiple_choice
            tested_text: "قبول است"
            prompt: {target_blocks: [{text: "قبول است", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit13.lesson03.exercise03.match_accepting_words
            type: matching_pairs
            tested_text: "خوب است عالی است قبول است"
            prompt: {target_blocks: []}
            pairs:
              - {left: "خوب است", right: okay}
              - {left: "عالی است", right: great}
              - {left: "قبول است", right: "it's a deal / agreed"}
              - {left: پلان, right: plan}
              - {left: پارک, right: park}
              - {left: برویم, right: "let's go"}
          - content_key: prs.a1.unit13.lesson03.exercise04.translate_okay_great
            type: translation
            tested_text: "خوب است، عالی است"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit13.lesson03.exercise05.dialogue_response_accept
            type: dialogue_response
            tested_text: "خوب است، عالی است! قبول است"
            prompt:
              target_blocks:
                - {text: "می‌خواهین جمعه برویم پارک؟", language_code: prs, direction: rtl}

      - content_key: prs.a1.unit13.lesson04.declining_a_plan
        title: رد کردن پلان
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - content_key: prs.a1.unit13.lesson04.teach.motasef_astam_word
            kind: vocabulary
            target: {text: "متأسف استم", language_code: prs, direction: rtl}
            introduced_tokens: [متأسف, استم]
            example: {text: "متأسف استم، کار دارم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson04.teach.nemitawanam_word
            kind: vocabulary
            target: {text: نمی‌توانم, language_code: prs, direction: rtl}
            introduced_tokens: [نمی‌توانم]
            example: {text: "متأسف استم، نمی‌توانم", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit13.lesson04.teach.kar_daram_word
            kind: phrase
            target: {text: "کار دارم", language_code: prs, direction: rtl}
            introduced_tokens: [کار, دارم]
        exercises:
          - content_key: prs.a1.unit13.lesson04.exercise01.recognize_motasef_reading
            type: multiple_choice
            tested_text: "متأسف استم"
            prompt: {target_blocks: [{text: "متأسف استم", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit13.lesson04.exercise02.recognize_nemitawanam_reading
            type: multiple_choice
            tested_text: نمی‌توانم
            prompt: {target_blocks: [{text: نمی‌توانم, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit13.lesson04.exercise03.match_declining_phrases
            type: matching_pairs
            tested_text: "متأسف استم نمی‌توانم کار دارم"
            prompt: {target_blocks: []}
            pairs:
              - {left: "متأسف استم", right: "I'm sorry"}
              - {left: نمی‌توانم, right: "I can't"}
              - {left: "کار دارم", right: "I have things to do"}
              - {left: کار, right: work}
              - {left: دارم, right: "I have"}
              - {left: پلان, right: plan}
          - content_key: prs.a1.unit13.lesson04.exercise04.order_decline_plan
            type: word_order
            tested_text: "متأسف استم نمی‌توانم کار دارم"
            prompt: {target_blocks: [{text: "I'm sorry, I can't, I have things to do.", language_code: en, direction: ltr}]}
            word_bank: [متأسف, استم, نمی‌توانم, کار, دارم]
          - content_key: prs.a1.unit13.lesson04.exercise05.translate_decline
            type: translation
            tested_text: "متأسف استم، نمی‌توانم"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit13.lesson04.exercise06.dialogue_response_decline
            type: dialogue_response
            tested_text: "متأسف استم، نمی‌توانم. کار دارم"
            prompt:
              target_blocks:
                - {text: "می‌خواهین جمعه برویم پارک؟", language_code: prs, direction: rtl}

      - content_key: prs.a1.unit13.lesson05.reading_an_invitation
        title: خواندن یک دعوت
        spine_outcome_id: universal.a1.plans.make_simple_plans
