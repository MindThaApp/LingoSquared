    for این pair in a1_unit12/a1_unit30, distinct from the formal
    می‌کنین/می‌توانین register used for stranger/customer-service scenes
    elsewhere in this course — deliberately never Iranian Farsi forms.

    Sourcing disclosure: firecrawl checked fresh before authoring this
