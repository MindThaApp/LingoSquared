          - content_key: prs.a2.unit16.lesson02.exercise04.translate_opinion
            type: translation
            tested_text: "به نظر من انترنت مفید است ولی بعضی اوقات وقت زیاد می‌گیرد"
            prompt: {target_blocks: []}
          - content_key: prs.a2.unit16.lesson02.exercise05.write_limit_use
            type: writing_prompt
            tested_text: "باید وقت خود را محدود کنیم"
            prompt: {target_blocks: []}

