    independently, so every token any exercise here tests is introduced
    via this file's own `introduced_tokens`, not assumed from any other
    unit's prior teaching (including a1_unit30, whose own vocabulary is
    NOT assumed carried over). Authored at schema_version 1.1 per
    AUTHORING_GUIDE §19 — every kind:vocabulary teaching item in
    lesson01/lesson03 carries a real example: sentence. Every fact
    (زرمینه's ~1hr/day mostly social media, همایون's ~2hrs/day mostly
    video, both agreeing to try to limit their use) kept consistent
    across lesson02/03/04 per §11. No fill_in_blank used, sidestepping
    §13 entirely. No listen_type/listen_select/listen_order or
    audio-only dialogue_comprehension anywhere in this unit per §14.
    Dialect: continues prs's established Afghan Dari register — this
    unit's dialogue is between two established friends, so it correctly
