course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: >-
    Continues the established informal تو-register already used for the
    همایون/زرمینه friend pair (a1_unit12, a1_unit30) — می‌کنی، می‌گذرانی،
    no formal-plural endings, since this is a conversation between
    friends, not a customer-service scene. Introduces معمولاً (usually)
    and بعضی اوقات (sometimes) as this unit's A2-level frequency adverbs,
    alongside continued reuse of already-established به نظر من (in my
    opinion).

