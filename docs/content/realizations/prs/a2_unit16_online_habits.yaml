units:
  - content_key: prs.a2.unit16.online_habits
    title: عادات استفاده از انترنت
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.technology.discuss_online_habits
    planned_lesson_count: 4

    lessons:
      - content_key: prs.a2.unit16.lesson01.online_habits_vocabulary
        title: کلمات استفاده از انترنت
        spine_outcome_id: universal.a2.technology.discuss_online_habits
        teaching:
          - content_key: prs.a2.unit16.lesson01.teach.social_media_word
            kind: vocabulary
            target: {text: "شبکهٔ اجتماعی", language_code: prs, direction: rtl}
            introduced_tokens: ["شبکهٔ", اجتماعی]
            example: {text: "زرمینه هر روز شبکهٔ اجتماعی می‌بیند.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit16.lesson01.teach.video_word
            kind: vocabulary
            target: {text: ویدیو, language_code: prs, direction: rtl}
            introduced_tokens: [ویدیو]
            example: {text: "همایون ویدیو دیدن را دوست دارد.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit16.lesson01.teach.download_word
            kind: vocabulary
            target: {text: "دانلود کردن", language_code: prs, direction: rtl}
            introduced_tokens: [دانلود, کردن]
            example: {text: "من موسیقی دانلود می‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit16.lesson01.teach.messaging_app_word
            kind: vocabulary
            target: {text: "پیام‌رسان", language_code: prs, direction: rtl}
            introduced_tokens: ["پیام‌رسان"]
            example: {text: "با پیام‌رسان به دوستانم پیام می‌فرستم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit16.lesson01.teach.computer_game_word
            kind: vocabulary
            target: {text: "بازی کمپیوتری", language_code: prs, direction: rtl}
            introduced_tokens: [بازی, کمپیوتری]
            example: {text: "همایون بازی کمپیوتری می‌کند.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit16.lesson01.teach.free_time_word
            kind: vocabulary
            target: {text: "وقت آزاد", language_code: prs, direction: rtl}
            introduced_tokens: [وقت, آزاد]
            example: {text: "در وقت آزاد شبکه‌های اجتماعی را می‌بینم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit16.lesson01.teach.usually_grammar
            kind: grammar_note
            target: {text: "من معمولاً در وقت آزاد شبکه‌های اجتماعی را می‌بینم.", language_code: prs, direction: rtl}
            introduced_tokens: [من, معمولاً, در, "شبکه‌های", را, "می‌بینم"]
          - content_key: prs.a2.unit16.lesson01.teach.sometimes_grammar
            kind: grammar_note
            target: {text: "بعضی اوقات وقت زیاد می‌گیرد.", language_code: prs, direction: rtl}
            introduced_tokens: [بعضی, اوقات, زیاد, "می‌گیرد"]
          - content_key: prs.a2.unit16.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: prs, direction: rtl}
            introduced_tokens: [و]
          - content_key: prs.a2.unit16.lesson01.teach.every_day_grammar
            kind: grammar_note
            target: {text: "من هر روز شبکه‌های اجتماعی را می‌بینم.", language_code: prs, direction: rtl}
            introduced_tokens: [هر, روز]
        exercises:
          - content_key: prs.a2.unit16.lesson01.exercise01.recognize_social_media
            type: multiple_choice
            tested_text: "شبکهٔ اجتماعی"
            prompt: {target_blocks: [{text: "شبکهٔ اجتماعی", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit16.lesson01.exercise02.recognize_download
            type: multiple_choice
            tested_text: "دانلود کردن"
            prompt: {target_blocks: [{text: "دانلود کردن", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit16.lesson01.exercise03.match_technology_words
            type: matching_pairs
            tested_text: "شبکهٔ اجتماعی ویدیو دانلود کردن پیام‌رسان بازی کمپیوتری وقت آزاد"
            prompt: {target_blocks: []}
            pairs:
              - {left: "شبکهٔ اجتماعی", right: "social media"}
              - {left: ویدیو, right: video}
              - {left: "دانلود کردن", right: "to download"}
              - {left: "پیام‌رسان", right: "messaging app"}
              - {left: "بازی کمپیوتری", right: "computer game"}
              - {left: "وقت آزاد", right: "free time"}
          - content_key: prs.a2.unit16.lesson01.exercise04.order_usually_sentence
            type: word_order
            tested_text: "من معمولاً در وقت آزاد شبکه‌های اجتماعی را می‌بینم"
            prompt: {target_blocks: []}
            word_bank: [من, معمولاً, در, وقت, آزاد, "شبکه‌های", اجتماعی, را, "می‌بینم"]
          - content_key: prs.a2.unit16.lesson01.exercise05.write_download
            type: writing_prompt
            tested_text: "دانلود کردن"
            prompt: {target_blocks: []}

      - content_key: prs.a2.unit16.lesson02.describing_and_giving_an_opinion
        title: توصیف و نظر دادن
        spine_outcome_id: universal.a2.technology.discuss_online_habits
        teaching:
          - content_key: prs.a2.unit16.lesson02.teach.ask_how_much_time
            kind: phrase
            target: {text: "تو چقدر وقت در شبکه‌های اجتماعی می‌گذرانی؟", language_code: prs, direction: rtl}
            introduced_tokens: [تو, چقدر, "می‌گذرانی"]
          - content_key: prs.a2.unit16.lesson02.teach.opinion_phrase
            kind: phrase
            target: {text: "به نظر من انترنت مفید است، ولی بعضی اوقات وقت زیاد می‌گیرد.", language_code: prs, direction: rtl}
            introduced_tokens: [به, نظر, انترنت, مفید, است, ولی]
          - content_key: prs.a2.unit16.lesson02.teach.limit_use_phrase
            kind: phrase
            target: {text: "باید وقت خود را محدود کنیم.", language_code: prs, direction: rtl}
            introduced_tokens: [باید, خود, محدود, کنیم]
          - content_key: prs.a2.unit16.lesson02.teach.mostly_word
            kind: grammar_note
            target: {text: "بیشتر (mostly)", language_code: prs, direction: rtl}
            introduced_tokens: [بیشتر]
        exercises:
          - content_key: prs.a2.unit16.lesson02.exercise01.recognize_ask_how_much_time
            type: multiple_choice
            tested_text: "تو چقدر وقت در شبکه‌های اجتماعی می‌گذرانی"
