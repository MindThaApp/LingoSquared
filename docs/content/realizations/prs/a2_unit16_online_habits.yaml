    technology (where همایون already asked زرمینه about her phone/
    computer use) — this unit is the natural A2 step-up of that exact
    scene into discussing frequency of use and giving a simple opinion
    about it. Own scenario, authored independently of the fa sibling
    realization of this same outcome (not consulted at all while
    drafting, per AUTHORING_GUIDE §8's strong sibling-isolation rule).
    A2-level grammar step: frequency adverbs معمولاً (usually) and بعضی
