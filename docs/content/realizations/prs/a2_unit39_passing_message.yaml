  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block D unit D6), realizing universal.a2.communication.pass_on_a_simple_message. Grammar target: reporting what someone says, asks or wants in the PRESENT tense only (past-shifted reported speech stays in B1): می‌گوید که + statement, می‌پرسد که + question (wh and yes/no), می‌خواهد که + subjunctive (بیایی، بروم، تیلفون کنی، کمپیوتر را بیاوری), person shift (من → او when passing on), به او می‌گویم که ..., در یادداشت می‌نویسد که .... Vocabulary: پیام، یادداشت، می‌نویسد، می‌فرستد. The subjunctive is re-taught in this unit (L03) because no other new unit is available when this one is validated. Lesson arc: L01 می‌گوید که (statement, person shift, they say); L02 می‌پرسد که (wh-question, yes/no question, who is asked); L03 می‌خواهد که and the subjunctive paradigms (رفتن، آمدن، کردن، آوردن، گفتن); L04 messages and notes (written messages, saying who is told, typed production); L05 a written note plus a transcript-shown listening item and a reading; L06 a second conversation, listening comprehension, typed production and a culminating writing_prompt that requires a statement, a question and a wish in three sentences. Characters: مینا and حشمت (housemates, conversation 1) and بهزاد and راحله (office, conversation 2) are one-off names, checked as absent from docs/content/realizations/prs and overlays/en-prs at authoring time; informal تو-register. Facts kept consistent (AUTHORING_GUIDE section 11): conversation 1 = the manager phoned, the meeting is tomorrow at nine, he asks whether Mina is coming and wants her to bring the computer, she says yes; conversation 2 = an employee of the doctor''s office phoned, Rahila''s appointment is Thursday at two, the employee asks whether she has her ID card and wants her to come at one; the L05 note is a separate account (a friend of Mina phoned at four, is not coming tomorrow because of work, asks about Friday, wants a phone call). Binding rulings applied: no progressive, no perfect, no future (no خواهم), no modal, no clitics or Tehrani forms, plain می‌ present only, 2pl -ین, standard تیلفون کردن. No listen_type, dictation or audio-only item; dialogue_comprehension items show the transcript. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Is the bare-present pattern می‌گوید که + statement / می‌پرسد که + question / می‌خواهد که + subjunctive natural Kabuli Dari for passing on a message right now? Recommended: yes; که is kept in all taught text and its omission is accepted in typed answers. (2) For a yes/no question is می‌پرسد که تو فردا می‌آیی natural without آیا or an if-word? Recommended: yes, with the answer بلی/نخیر; no آیا is taught. (3) Is در یادداشت می‌نویسد که the natural way to report what a written note says, or would a native say در یادداشت نوشته که / یادداشت می‌گوید که? (4) Is the plural می‌گویند (آن‌ها می‌گویند که جلسه ساعت ده است) fine as a bare impersonal they say, and is کارمند تیلفون کرد natural for someone at the doctor''s office phoned? (5) Is the subjunctive بیایی / بیاوری / تیلفون کنی / بگویی correct for 2sg, and are the full paradigms بروم، بروی، برود، برویم، بروین، بروند and بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند right for spoken Kabuli with 2pl -ین? (6) Is استی (you are, to a friend) the right Kabuli spelling in حشمت می‌پرسد که تو کجا استی؟ (7) Is به او می‌گویم که ... / به مینا می‌گوید که ... the natural way to say who is told, and is the plain بیایی natural in می‌خواهد که تو ساعت یک بیایی? (8) Is the phone-message wording (کی تیلفون کرد؟، پیام برای تو دارم، از دفتر داکتر) natural, and is دوست تو (rather than the clitic دوستت) acceptable as taught text? '
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین, no Tehrani colloquialisms. Friend and colleague dialogues use the informal تو-register. Reporting verbs می‌گوید/می‌پرسد/می‌خواهد که + clause in the present; the subjunctive is ب + present stem + ending (بروم, بروی, برود, برویم, بروین, بروند; کنم, کنی, کند).'
