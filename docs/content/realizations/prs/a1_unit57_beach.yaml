generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "`firecrawl search \"Dari ساحل beach sand swim vocabulary phrasebook\"` was retried fresh for this unit and returned HTTP 402 (0 credits), matching every recent unit's status this session -- confirmed by directly re-running the command rather than assuming it was still exhausted. Before falling back to established-conventions-only authoring, the shared scratchpad's already-cached DLI Dari corpus (`/private/tmp/claude-502/.../scratchpad/dli_search/*.txt`, `dli/*.txt`, `dli2/*.txt`, `dli_bike_search/*.txt`, plus the repo's own `.firecrawl/dli-dari-*.txt`) was searched fresh via English-keyword greps (beach, swim, sand, wave, umbrella, lake) and direct Dari-script greps (ساحل، دریا، شنا) across the full corpus. Result, honestly disclosed: no direct beach/coast scenario exists anywhere in this corpus (unsurprising -- Afghanistan is landlocked, and the DLI/Peace Corps materials are daily-life/hotel/travel-focused, not coastal-recreation-focused). One genuine, real, independently attested find: ریگ (sand) appears in DLI Semester 3 Book 1's own numbered vocabulary key (`dli_search/S3_Book1.txt`, item 19, alongside a worked idiom \"رﻳﮓ ﭘﻮل ﺧﺮج ﻣﻴﮑﺮدم\" -- \"I used to spend money like sand,\" a spendthrift idiom -- confirming ریگ as genuine attested Dari for 'sand,' not a guess). حوض آببازی (swimming pool, already this course's own established word from unit50) and شنا (swimming, already this course's own established word from unit29, including the exact می‌کنم light-verb pattern used here) both recur in the corpus but only in hotel-amenity or general-sport-vocabulary contexts, not a beach scene, so no additional attestation was gained from them beyond what unit29/unit50 already established. No attestation found anywhere in the corpus for beach/coast (ساحل), ocean wave (موج), or umbrella (چتر) specifically -- all three are authored from established Persian/Dari conventions: ساحل (beach/shore/coast) and موج (wave) are basic, high-frequency, dialect-neutral Persian/Dari vocabulary shared identically with Iranian Farsi (no register/dialect-divergence risk of the kind unit24's موتر or unit28's پشک flagged); چتر (umbrella) is likewise basic shared vocabulary, and چتر آفتابی ('sun umbrella,' literally umbrella+sunny) is a genuine, natural Persian/Dari compound for a sun/beach umbrella (paralleling چتر باران, 'rain umbrella'), built here by combining چتر with this course's own already-established آفتابی ('sunny,' unit22 weather) rather than inventing an unrelated new adjective. **Cultural-authenticity note, applied per AUTHORING_GUIDE.md's dialect/register-authenticity discipline (§3) and modernization discipline (§10)**: Afghanistan is landlocked, so this unit deliberately does not depict an ocean/sea beach (the spine outcome's own can_do text lists 'sea' only as an illustrative example, not a mandatory fact) -- ساحل is instead framed generically as a sandy shore of a lake or river, a genuine, common recreational context for Kabul-area day trips, without naming a specific real place (no specific location claim is made or needed, avoiding an unverified factual claim about any named site). Four new content words this unit: ساحل, ریگ (DLI-attested), موج, چتر -- شنا (swimming) is REVIEW, not new, already established in unit29 (sports) with the identical شنا می‌کنم light-verb pattern reused here, confirmed by grepping the full prs corpus for ساحل/ریگ/موج/چتر/شنا before writing a single line of this file. No new grammar beyond ordinary recombination: می‌خواهم X کنم (unit23's already-established subjunctive-light-verb frame, X = شنا here), شنا می‌کنم (unit29's own established form), می‌خواهی (unit55's established informal 2nd-person cell), برویم (unit13's established 1st-plural subjunctive of رفتن), کرد (unit20's established 3rd-person past of کردن), دارد (multiple earlier units), and the -تان formal-possessive suffix (unit39-56's established precedent) are all reused, not reintroduced."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude): checked against the full checklist (same-speaker-distractor risk in multiple_choice/dialogue_response, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, and exercise-type registration against ExerciseRenderer.tsx) -- no real bugs found in this unit. No listen_select/listen_type/dialogue_comprehension exercises exist in this file (prs has zero TTS/audio coverage per AUTHORING_GUIDE.md #14), so the same-speaker-distractor bug class doesn't structurally arise; every multiple_choice item shows the literal Dari text being translated, not audio, so distractor overlap with other same-speaker lines elsewhere in the dialogue can't create ambiguity the way it does for listen_select. matching_pairs accepted_answers use the established flat-dict shape and word_order accepted_answers use the established space-joined-string shape, both of which the compiler/grade() already canonicalize correctly. Compiler validation (grouped with the rest of the prs A1 corpus, per course-level Course-row scoping) is clean: 0 errors, 0 warnings. Re-verified against the file's own original self-report below, which is accurate. New en-prs A1 unit after unit56 (gym). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.beach.enjoy_a_day_at_the_beach as the next unrealized A1 outcome, immediately after gym (line 1654, right after gym's own line 1629). Both listed prerequisites -- universal.a1.weather.describe_basic_weather [unit22] and universal.a1.plans.make_simple_plans [unit13] -- are already realized in prs; these are the identical two prerequisites universal.a1.park.enjoy_a_park_outing [unit55] already has, making park this unit's closest structural precedent (confirmed by re-reading unit55's own file before drafting this one's skeleton, per AUTHORING_GUIDE.md §3's legitimate same-course structure-reuse allowance -- only the skeleton was reused, every sentence is freshly written for this unit's own vocabulary). Matches all four of the outcome's own assessment_requirements: understand_beach_description (listening substituted with reading-based multiple_choice recognition per AUTHORING_GUIDE.md §14's established no-prs-audio pattern, testing lesson03's wave/water sentence and lesson04's weather-and-activity dialogue), describe_beach_visit (speaking substituted the same way this whole corpus substitutes it -- production exercises across lesson04's propose-and-accept dialogue and lesson01/03/06's writing_prompts), read_beach_sign (lesson02's opening-hours reading card, a genuine notice-style sentence), and write_beach_message (writing_prompt exercises across all six lessons). Six lessons, matching gym's own 6-lesson shape and new-word distribution pattern (2 new in lesson01, 0 in lesson02, 1 new plus review in lesson03, 0 in lesson04/lesson05, 1 new in lesson06): beach-and-sand vocabulary (ساحل, ریگ new), reading a beach sign giving its opening and closing hours (pure recombination, zero new vocabulary, matching unit51-56's own established precedent that a reading/sign lesson doesn't always need fresh vocabulary of its own -- ساحل/باز/بسته/از/تا/هفت/پنج/صبح/شب/ساعت all reviewed, deliberately using different hours -- seven to five -- than park's six-to-eight so the two sign lessons aren't a near-verbatim duplicate across units), swimming-and-wave vocabulary (موج new; شنا correctly re-used as REVIEW from unit29, not reintroduced as new -- confirmed by grep before authoring), a Homayoun/Zarmina informal dialogue combining a weather comment, a propose-going exchange, and an activity choice into one six-line dialogue (matching gym's own single-combined-dialogue shape rather than park's two-separate-lesson shape, since this unit's remaining new-word budget was already spent in lesson01/lesson03 and lesson06, leaving nothing new to introduce mid-dialogue the way park's own میله was), a third-person reading passage recapping the visit (کرد reviewed from unit20, رفت/بود/او/به reviewed from multiple earlier units, no new grammar), and a wrap-up combining a preference-and-observation sentence with اما (reusing unit29's own established 'X را دوست دارم اما Y' shape, applied here to شنا/موج rather than فوتبال/وقت) and a formal تان-suffixed question introducing چتر, this unit's final new word, inside an already-established sentence frame (کجاست, unit50's precedent) -- the identical 'new word inside an established frame in the wrap-up lesson' move gym's own ماهانه used. Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit55/unit56's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در/خوب از multiple earlier units، ساحل/ریگ از این فایل، باز/بسته از unit50، از/تا/هفت/پنج/صبح/شب/ساعت از unit01/unit04/unit08، شنا از unit29، می‌خواهم/کنم از unit23، آب از unit08، امروز/دارد از unit17/multiple units، موج از این فایل، هوا/آفتابی از unit22، می‌خواهی/برویم از unit55/unit13، بلی/عالی/بسیار خوب از unit01/unit09/unit10/unit40/unit46-48/unit55، یا/میله از unit01/unit08/unit55، کرد از unit20، بود/او/به/رفت از multiple earlier units، دوست/دارم/را/اما از unit03/unit14/unit26/unit29، چتر از این فایل، کجاست از unit50. Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit41/unit47-56's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The wrap-up's اما-joined sentence (lesson06 exercise06's write target) uses a single canonical comma-اما form only (with/without a trailing period, both accepted), matching unit33/39-56's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading -- confirmed by explicit review, no other multi-clause translate/write target exists in this unit, so AUTHORING_GUIDE.md §12's multi-variant requirement doesn't otherwise arise. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md §13/§17 don't arise either. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md §14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's six dialogue lines and their speakers (همایون: 3 lines -- weather comment / accept-and-want-to-swim / swim-is-good; زرمینه: 3 lines -- propose-going / offer-swim-or-picnic / accept-and-go) were listed and cross-checked by hand before finalizing any multiple_choice distractor, applying the standing same-speaker-distractor rule to text-based recognition items too, not just audio ones -- every distractor for a tested همایون line is drawn exclusively from زرمینه's three lines and vice versa; no exercise in this lesson draws a distractor from the SAME character's other lines. Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md §16). Every vocabulary teaching card (ساحل, ریگ, موج, چتر) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md §19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: the beach's stated opening-hours fact (از ساعت هفت صبح تا ساعت پنج شب) is stated identically in lesson02 and never restated elsewhere; the swim-vs-picnic activity choice in lesson04 (شنا chosen) is never contradicted by lesson05's reading passage, which states only that he went to the beach, swam, and that the beach was nice, consistent with (not contradicting) that choice; the wrap-up's two statements (a preference/observation sentence and a location question) are independent facts, never combined arithmetically. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

