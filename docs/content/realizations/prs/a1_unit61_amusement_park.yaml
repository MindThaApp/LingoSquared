  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-60). Lesson04's dialogue introduces the
    amusement-park ticket-counter کارمند role opposite the established
    Homayoun character, reusing the same polite-service register unit08's
    دوکاندار/مشتری, unit42's داکتر/منشی, unit45's کارمند هوتل, unit50's pool
    کارمند, unit52's cinema کارمند, unit53's museum کارمند, unit54's concert
    کارمند, and unit60's sports-event کارمند exchanges already established --
    not the informal-تو friendship register used for Homayoun/Zarmina
    outings elsewhere in this course. Lesson03's propose-and-accept-a-plan
    phrases reuse unit13's own established می‌خواهین/برویم/بلی/عالی/قبول
    frame with no named speaker attribution, matching unit54/unit60's own
    lesson03 precedent exactly, applied here with a fresh day (یکشنبه)
    rather than repeating جمعه or شنبه verbatim. This unit's شهربازی is a
    genuinely standard Dari/Farsi word built transparently from two
    already-established course words (شهر, بازی) rather than an invented
    compound. قد (height) extends unit15's own established comparison
    vocabulary to its base, non-comparative sense (a person's own stature,
    the correct reading for an amusement-park minimum-height rule) rather
    than introducing an unrelated new word for the same concept. Lesson06's
    wrap-up contrasts this unit's own 60-afghani ticket against the
    already-established, separately-sourced 30-afghani cinema ticket from
    unit52 -- reused accurately, not altered -- and its formal تان-suffixed
    question (قدتان چند سانتی‌متر است؟) extends unit50/52/53/54/59/60's own
    established formal -تان-suffix pattern to this unit's own review noun
    قد rather than reusing an earlier unit's exact تکت‌تان/گشت‌تان/
    مسابقه‌تان wording verbatim. Lesson05's reading passage names همایون
    explicitly in its first sentence, then names شهربازی and بازی directly
    in the following two sentences (rather than pronominalizing with او
    again), matching the option unit31/unit35/unit55's own reading passages
    already use when later sentences shift the grammatical subject away
    from the opening named person.

