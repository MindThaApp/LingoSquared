g/health/housing (lines 684-785) and universal.b1.abilities/necessity (lines 929/981) sit between boat_tour/sports_event and amusement_park in file order but are A2/B1, not A1, so they are correctly skipped by this unit's own A1-only scope -- amusement_park (line 1754, immediately after sports_event's own line 1729) is the earliest unrealized A1-level outcome. Both listed prerequisites -- universal.a1.plans.make_simple_plans [unit13] and universal.a1.money.handle_basic_money_matters [unit23] -- are already realized in prs, confirmed against the same collected spine_outcome_id set. Matches all four of the outcome's own assessment_requirements: understand_amusement_park_information (listening substituted with reading-based multiple_choice recognition per AUTHORING_GUIDE.md §14's established no-prs-audio pattern, testing lesson02's combined hours/price/height-rule sign and lesson04's dialogue restating the price and height facts), request_amusement_park_ticket (speaking substituted the same way this whole corpus substitutes it -- production exercises across lesson04's ticket-counter dialogue asking for a ticket and asking/answering about the height rule, plus writing_prompts in lessons01/02/04/05/06), read_amusement_park_sign (lesson02's combined hours-price-height reading card, mirroring unit53 museum's, unit58 zoo's, unit59 boat_tour's, and unit60 sports_event's own combined-reading precedent, extended here to three stated facts instead of two), and write_amusement_park_message (writing_prompt exercises across all six lessons). Six lessons, matching unit54 concert's, unit55 park's, and unit60 sports_event's own six-lesson shape (not the plain five/six-lesson service-counter-only shape of museum/zoo/boat_tour) because this outcome's own can_do explicitly names 'make plans' as a distinct step, backed by its own separate plans.make_simple_plans prerequisite: amusement-park vocabulary (شهربازی new, پارک/بازی review), a sign giving opening hours, ticket price, AND a minimum-height rule (حداقل/سانتی‌متر new, قد review from unit15 -- pure recombination otherwise, deliberately using a fresh price (شصت, 60 afghanis) and a fresh height figure (صد و ده, 110 centimeters) not used as a price/measurement anywhere in units47-60, so this sign isn't a near-verbatim duplicate of an earlier one), a propose-and-accept-a-plan lesson reusing unit13's own established می‌خواهین/برویم/بلی/عالی/قبول frame with a fresh day (یکشنبه, Sunday, already established since unit09 and not reused from unit13/54/60's جمعه or unit55's شنبه) applied to this unit's own شهربازی noun phrase (mirroring unit54/unit60's own lesson03 precedent exactly, including its generic-phrase-not-named-dialogue shape -- no speaker attribution on this lesson's teaching cards), a Homayoun/کارمند formal ticket-counter dialogue (پure recombination -- شهربازی/حداقل/قد/سانتی‌متر introduced earlier in-file, everything else review -- combining a ticket request, a price statement, a minimum-height question, and a minimum-height answer), a third-person reading passage recapping the visit (او/رفت/بود reviewed from multiple earlier units, no new grammar needed, matching unit55 park's own precedent that a lesson05 recap doesn't always need a fresh word of its own), and a wrap-up combining a genuine cross-unit price contrast with اما (شهربازی's own 60-afghani ticket vs. the already-established cinema ticket price of 30 afghanis from unit52 -- reusing that fact ACCURATELY rather than inventing a new unrelated contrast, a deliberate variation from unit60's own within-file-only cricket contrast, still fully AUTHORING_GUIDE.md §11-consistent since the reused fact is restated identically, not altered) and a formal تان-suffixed question attached to this unit's OWN new-to-this-file review noun قد (قدتان چند سانتی‌متر است؟, extending the established بلیط‌تان/گشت‌تان/مسابقه‌تان pattern to a new noun per that same precedent, rather than a repeat 'your ticket' question). Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit58/59/60's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در/خوب/به از multiple earlier units، پارک از unit13/22/29/55، بازی از unit29، شهربازی از این فایل (لسون۰۱)، دوست/دارم/را از unit14/26/29، سلام/یک/بفرمایین/تشکر/زیاد/خواهش/می‌کنم از units01/09/10/40/46-60، بلیط/چند/افغانی از unit01/02/04/08/16، ساعت/صبح/شب/ده/نه/شصت/صد/و از unit01/04/11، از/تا/باز از unit55، قد/من از unit15/unit02، سانتی‌متر/حداقل از این فایل (لسون۰۲)، می‌خواهین/برویم/بلی/عالی/قبول از unit13/54/60، یکشنبه از unit09، او/رفت/بود از multiple earlier units، جالب از unit14/33/39-60، همایون از multiple earlier units، اما/سینما/سی از unit24/29/39-60/unit52/unit04. Uses او only in lesson05's reading passage as the pronoun for the third sentence's implicit continuation is instead avoided -- following the same option unit31/35/55's own reading passages already use when a passage's later sentences shift the grammatical subject away from the named person (همایون named once, then شهربازی/بازی are named directly as the subject of the following two sentences rather than pronominalized) -- او only appears once, in the grammar_note review card, not left dangling unused; no Pashto هغه/هغوی anywhere. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md §13/§17 don't arise. §12 multi-clause coverage applied to lesson04's combined price-and-height translation exercise (period-joined and comma-joined forms, matching unit60's own translate_kickoff_and_price precedent for two independent stated facts). No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md §14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's six dialogue lines and their speakers (همایون: 3 lines -- request the ticket / ask the minimum height / thank the staff; کارمند: 3 lines -- greet and state the price / state the minimum height / reply you're welcome) were listed and cross-checked by hand before finalizing any multiple_choice distractor, applying the standing same-speaker-distractor rule to text-based recognition items too, not just audio ones -- every distractor for a tested همایون line is drawn exclusively from کارمند's three lines and vice versa; no exercise in this lesson draws a distractor from the SAME character's other lines (verified programmatically, see the standalone check script run during authoring). Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md §16). Every vocabulary teaching card (شهربازی, سانتی‌متر, حداقل) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md §19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she where a pronoun is used at all, never هغه/هغوی. §11 cross-lesson fact check: the sign's three stated facts (شهربازی از ساعت ده صبح تا نه شب باز است؛ بلیط شصت افغانی است؛ حداقل قد صد و ده سانتی‌متر است) are stated only in lesson02 (hours) and re