  source_material: "`firecrawl search \"Dari شهربازی amusement park ride ticket vocabulary\"` returned HTTP 402 (insufficient credits), matching every recent unit's confirmed-still-exhausted status -- retried fresh for this unit before falling back, per standing instruction. Before authoring from established convention alone, the repo's own already-cached DLI Dari corpus was searched: both the repo-root `.firecrawl/dli-dari-s9-12.txt`/`s17-20.txt`/`s21-24.txt`/`s25-28.txt`/`s29-32.md` files AND the session scratchpad's fuller `dli_search/` cache (DLI-Dari-Semester1 s1-4 through s37-40, plus S2/S3 books) were grepped, case-insensitively and by Dari script, for amusement/park/ride/Ferris-wheel/height/queue terms (amusement, park, ride, Ferris, queue, شهربازی, چرخ و فلک, حداقل قد, صف). Result, disclosed honestly: no genuine on-topic hit. The only match at all was a single numbered glossary entry, \"6. entertainment / amusement\", in `dli_search/S3_Book1.txt` (a short story glossary about a mulberry tree and firewood, completely unrelated in content) -- it does not even show the underlying Dari word in context, so there is nothing attributable or usable there, unlike unit60's genuine buzkashi/football hit from the same corpus. This unit is therefore authored fresh from established Dari convention and course-internal vocabulary, not adapted from any newly found source text -- disclosed as such, not overstated as a source-backed unit. Every new word was still independently checked for currency/dialect-neutrality rather than merely assumed: شهربازی (amusement park) is standard modern Dari/Farsi vocabulary, transparently built from two words already established course-internally (شهر \"city\", unit02/unit24/unit40; بازی \"game/play\", unit29 sports) -- not an invented compound, a genuinely attested word for this exact concept in both Dari and Iranian Farsi. حداقل (minimum/at least) and سانتی‌متر (centimeter) are both standard, dialect-neutral, everyday formal-register Persian/Dari vocabulary with no Afghan-vs-Iranian divergence risk of the kind unit24's موتر or unit28's پشک flagged. قد (height/stature) is NOT new to this file's corpus-wide footprint -- it was already introduced in `a1_unit15_comparisons.yaml` (`قد بلندتر است`, \"taller\") and is reused here in its base sense (a person's own height/stature, the correct sense for an amusement-park minimum-height rule, which is about the RIDER's height, not the ride's), re-declared as review per this file's own per-file untaught-vocabulary requirement, not reintroduced as new. شهربازی itself is not new either in the abstract sense (it recombines two already-taught morphemes) but is the unit's own new lexical item and is taught as such via a dedicated vocabulary card. Genuinely new content this unit, disclosed honestly: شهربازی, حداقل, سانتی‌متر (three new words), plus the combined possessive form قدتان (lesson06) -- a combination of two already-declared morphemes (قد + the established formal -تان suffix already used on بلیط‌تان/گشت‌تان/مسابقه‌تان in units 50/52/53/54/59/60), not a fourth new word in its own right, following that exact precedent. Everything else this unit uses -- این/است/در/خوب/به (multiple early units), پارک (unit13/22/29/55), بازی (unit29), دوست/دارم/را (unit14/26/29), سلام/بفرمایین/تشکر زیاد/خواهش می‌کنم (units01/09/10/40/46-60), می‌خواهم/یک/بلیط/چند/افغانی (unit01/02/04/08/16), ساعت/صبح/شب/ده/نه/شصت/صد/و (unit01/04/11), از/تا/باز/بسته (unit55), می‌خواهین/برویم/بلی/عالی/قبول (unit13/54/60), یکشنبه (unit09), او/رفت/بود (multiple earlier units), جالب/اما (unit14/33/39-60), همایون (established character), سینما/سی (unit52) -- is confirmed course-internal review by grepping the full prs corpus for every candidate word before writing a single line of this file. No new grammar beyond ordinary recombination: قد's reuse in a minimum-height-rule sense is the same base noun already established (not a new sense requiring new grammar), and قدتان slots into the exact same formal-possessive -تان pattern already used four times in this corpus. Six new content words/forms this unit total (three new words plus one combined possessive form), disclosed honestly, matching the same disclosure discipline as unit55/unit60."
