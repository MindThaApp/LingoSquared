    language: prs
    text: "زرمینه: ببخشین، جلسه ساعت چند است؟ همایون: جلسه ساعت نه صبح است. زرمینه: ساعت نه؟ خوب است. من ساعت هشت و نیم می‌آیم. همایون: بسیار خوب، منتظر استم."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: prs.a1.unit11.time
    title: ساعت
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.time.ask_tell_time
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit11.lesson01.basic_time_vocabulary
        title: کلمات ساعت
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - content_key: prs.a1.unit11.lesson01.teach.saat_word
            kind: vocabulary
            target: {text: ساعت, language_code: prs, direction: rtl}
            introduced_tokens: [ساعت]
            example: {text: "ساعت چند است؟", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit11.lesson01.teach.daqiqa_word
            kind: vocabulary
            target: {text: دقیقه, language_code: prs, direction: rtl}
            introduced_tokens: [دقیقه]
            example: {text: "پنج دقیقه صبر کنید.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit11.lesson01.teach.nim_word
            kind: vocabulary
            target: {text: نیم, language_code: prs, direction: rtl}
            introduced_tokens: [نیم]
            example: {text: "ساعت هفت و نیم است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit11.lesson01.teach.rub_word
            kind: vocabulary
            target: {text: ربع, language_code: prs, direction: rtl}
            introduced_tokens: [ربع]
            example: {text: "ساعت یک ربع به هشت است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit11.lesson01.teach.numbers_review
            kind: vocabulary
            target: {text: "یک، دو، سه، چهار، پنج", language_code: prs, direction: rtl}
            introduced_tokens: [یک, دو, سه, چهار, پنج]
            example:
              - {text: "یک کتاب دارم.", language_code: prs, direction: rtl}
              - {text: "دو برادر دارم.", language_code: prs, direction: rtl}
              - {text: "سه خواهر دارم.", language_code: prs, direction: rtl}
              - {text: "چهار روز مانده.", language_code: prs, direction: rtl}
              - {text: "پنج دقیقه صبر کنید.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.a1.unit11.lesson01.exercise01.recognize_saat_reading
            type: multiple_choice
            tested_text: ساعت
            prompt: {target_blocks: [{text: ساعت, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit11.lesson01.exercise02.recognize_daqiqa_reading
            type: multiple_choice
            tested_text: دقیقه
            prompt: {target_blocks: [{text: دقیقه, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit11.lesson01.exercise03.recognize_nim_reading
            type: multiple_choice
            tested_text: نیم
            prompt: {target_blocks: [{text: نیم, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit11.lesson01.exercise04.match_time_words
            type: matching_pairs
            tested_text: ساعت دقیقه نیم ربع یک دو سه چهار پنج
            prompt: {target_blocks: []}
            pairs:
              - {left: ساعت, right: "hour / clock"}
              - {left: دقیقه, right: minute}
              - {left: نیم, right: half}
              - {left: ربع, right: quarter}
              - {left: یک, right: "1"}
              - {left: دو, right: "2"}
              - {left: سه, right: "3"}
              - {left: چهار, right: "4"}
              - {left: پنج, right: "5"}
          - content_key: prs.a1.unit11.lesson01.exercise05.translate_hour
            type: translation
            tested_text: ساعت
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit11.lesson01.exercise06.translate_quarter
            type: translation
            tested_text: ربع
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit11.lesson02.asking_the_time
        title: پرسیدن ساعت
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - content_key: prs.a1.unit11.lesson02.teach.chand_word
            kind: vocabulary
            target: {text: چند, language_code: prs, direction: rtl}
            introduced_tokens: [چند]
            example: {text: "ساعت چند است؟", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit11.lesson02.teach.saat_chand_ast
            kind: phrase
            target: {text: "ساعت چند است؟", language_code: prs, direction: rtl}
            introduced_tokens: [است]
          - content_key: prs.a1.unit11.lesson02.teach.register_note
            kind: cultural_note
            target: {text: "ساعت چند است؟ (polite/neutral, not the Iranian-colloquial ساعت چنده)", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit11.lesson02.exercise01.recognize_time_question_reading
            type: multiple_choice
            tested_text: "ساعت چند است"
            prompt: {target_blocks: [{text: "ساعت چند است؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit11.lesson02.exercise02.match_question_words
            type: matching_pairs
            tested_text: "ساعت چند است ساعت دقیقه نیم ربع"
            prompt: {target_blocks: []}
            pairs:
              - {left: "ساعت چند است؟", right: "What time is it?"}
              - {left: ساعت, right: "hour / clock"}
              - {left: چند, right: "how many / what"}
              - {left: دقیقه, right: minute}
              - {left: نیم, right: half}
              - {left: ربع, right: quarter}
          - content_key: prs.a1.unit11.lesson02.exercise03.order_time_question
            type: word_order
            tested_text: "ساعت چند است"
            prompt: {target_blocks: [{text: "What time is it?", language_code: en, direction: ltr}]}
            word_bank: [است, ساعت, چند]
          - content_key: prs.a1.unit11.lesson02.exercise04.translate_time_question
            type: translation
            tested_text: "ساعت چند است"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit11.lesson02.exercise05.dialogue_response_ask_time
            type: dialogue_response
            tested_text: "ساعت چند است"
            prompt: {target_blocks: []}

      - content_key: prs.a1.unit11.lesson03.telling_the_time
        title: گفتن ساعت
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - content_key: prs.a1.unit11.lesson03.teach.saat_se_ast
            kind: phrase
            target: {text: "ساعت سه است", language_code: prs, direction: rtl}
            introduced_tokens: [سه]
          - content_key: prs.a1.unit11.lesson03.teach.saat_se_o_nim
            kind: phrase
            target: {text: "ساعت سه و نیم است", language_code: prs, direction: rtl}
            introduced_tokens: [و]
          - content_key: prs.a1.unit11.lesson03.teach.saat_char_o_rub
            kind: phrase
            target: {text: "ساعت چهار و ربع است", language_code: prs, direction: rtl}
            introduced_tokens: []
        exercises:
          - content_key: prs.a1.unit11.lesson03.exercise01.recognize_three_oclock_reading
            type: multiple_choice
            tested_text: "ساعت سه است"
            prompt: {target_blocks: [{text: "ساعت سه است", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit11.lesson03.exercise02.recognize_half_past_reading
            type: multiple_choice
            tested_text: "ساعت سه و نیم است"
            prompt: {target_blocks: [{text: "ساعت سه و نیم است", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit11.lesson03.exercise03.match_time_expressions
            type: matching_pairs
            tested_text: "ساعت سه است ساعت سه و نیم است ساعت چهار و ربع است ساعت پنج است"
            prompt: {target_blocks: []}
            pairs:
              - {left: "ساعت سه است", right: "It's three o'clock."}
              - {left: "ساعت سه و نیم است", right: "It's three-thirty."}
              - {left: "ساعت چهار و ربع است", right: "It's a quarter past four."}
              - {left: "ساعت پنج است", right: "It's five o'clock."}
              - {left: "ساعت یک است", right: "It's one o'clock."}
              - {left: "ساعت دو و نیم است", right: "It's two-thirty."}
          - content_key: prs.a1.unit11.lesson03.exercise04.order_half_past
            type: word_order
            tested_text: "ساعت سه و نیم است"
            prompt: {target_blocks: [{text: "It's three-thirty.", language_code: en, direction: ltr}]}
            word_bank: [است, ساعت, سه, و, نیم]
          - content_key: prs.a1.unit11.lesson03.exercise05.translate_five_oclock
            type: translation
            tested_text: "ساعت پنج است"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit11.lesson03.exercise06.translate_quarter_past_four
            type: translation
            tested_text: "ساعت چهار و ربع است"
            prompt: {target_blocks: []}

