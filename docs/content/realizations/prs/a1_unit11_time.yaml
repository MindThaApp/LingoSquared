            kind: vocabulary
            target: {text: قرار, language_code: prs, direction: rtl}
            introduced_tokens: [قرار]
            example: {text: "من یک قرار دارم.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit11.lesson05.teach.qarar_saat_chand
            kind: phrase
            target: {text: "قرار شما ساعت چند است؟", language_code: prs, direction: rtl}
            introduced_tokens: [شما]
