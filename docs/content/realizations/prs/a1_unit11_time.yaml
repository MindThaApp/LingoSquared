            target: {text: هفت, language_code: prs, direction: rtl}
            introduced_tokens: [هفت]
            example: {text: "ساعت هفت می‌آیم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.a1.unit11.lesson04.exercise01.recognize_zohr_reading
            type: multiple_choice
            tested_text: ظهر
            prompt: {target_blocks: [{text: ظهر, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit11.lesson04.exercise02.recognize_nine_morning_reading
