            type: word_order
            tested_text: "قرار شما ساعت چند است"
            prompt: {target_blocks: [{text: "What time is your appointment?", language_code: en, direction: ltr}]}
            word_bank: [است, قرار, شما, ساعت, چند]
          - content_key: prs.a1.unit11.lesson05.exercise05.translate_appointment_answer
            type: translation
            tested_text: "قرار من ساعت هشت و نیم است"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit11.lesson05.exercise06.dialogue_response_own_appointment
            type: dialogue_response
            tested_text: "قرار من ساعت هشت و نیم است"
