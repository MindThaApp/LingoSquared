review:
  status: unreviewed
  required_next_reviewer: native
  notes: 'Grammar-led A2 unit A2 of the rebuild (docs/A2_REBUILD_PLAN.md, Block A, Separable verbs in the past adapted for Dari), realizing universal.a2.past.describe_a_busy_morning. Grammar target: compound verbs (noun or adjective plus a light verb: بیدار شدن، آماده شدن، باز کردن، دوش گرفتن، قدم زدن، حرف زدن، انتظار کشیدن، تیلفون کردن، سوار شدن، پیاده شدن، درست کردن، شروع کردن) in the simple past, their negation on the light verb (بیدار نشدم، تیلفون نکردم، قدم نزدم، دوش نگرفتم، انتظار نکشیدم), the position of را with a definite object before a compound verb (دروازه را باز کردم، دروازه را باز نکردم) versus no را with an indefinite object (چای درست کردم), the we ending -یم on the light verb (حرف زدیم), and the sequencing connectors اول، بعد، بعد از آن، در آخر (plus ولی). Builds on a2_unit19 (simple past endings and the negative past ن + past verb) and recycles it; plain simple past only, no progressive and no perfect. Seven real grammar_note cards (compound-verb rule, five light verbs, negation rule, negation with five light verbs, را placement, ordering connectors, we form). Lesson arc: L01 morning words and form recognition; L02 more compound verbs with drag and matching; L03 negation and را (contrast with the affirmative, with and without را); L04 production and connectors; L05 reading plus transcript-shown listening; L06 dialogue plus mixed and culminating production. Recycling: the A2 course is a separate Course row, so the A1 domains used here (routines, travel and transport, places) are re-established by L01 and L02 vocabulary cards with introduced_tokens; the unit depends on A2 unit 19 only for the simple-past system, which it also re-teaches in the grammar notes. Characters: new one-off characters نوید (office worker, goes by bus) and ثریا (goes to school on foot with a friend). Canon grep over docs/content/realizations/prs found neither name in any unit (مریم, a name already used in a1_unit03 and a2_unit20 with other facts, was deliberately not used); the established زرمینه and همایون were not needed because همایون walks to the office (a1_unit24) and زرمینه takes a taxi, which would contradict a bus commute. Facts kept consistent (AUTHORING_GUIDE section 11): ثریا = woke early, shower, clothes, breakfast, did NOT make tea, opened the gate, walked to school with a friend, talked on the way, arrived (reading and exchange 01 agree: she ate breakfast and did not make tea); نوید = woke up late, shower, clothes, did NOT eat breakfast, opened the gate, walked to the stop, waited, boarded the bus, did NOT phone ثریا, arrived at the office (dialogue 02, all lessons agree). Register: formal written Kabul Dari for notes, informal تو between the two friends (چه کار کردی، تیلفون کردی)، copula است, 2pl -ین, no Tehrani colloquialisms, بس/موتر/پیاده/دفتر/مکتب/دروازه/تیلفون Afghan lexicon; no train scenario. Spine: the unit delivers listening (two transcript-shown dialogue_comprehension items on the step sequence and the skipped step), speaking-equivalent production (dialogue_response and translation of step sequences), reading (three reading_comprehension items) and writing (a four-step account in order with one negated step, plus a three-step and a two-step account). prs has no TTS, so the 4 dialogue_comprehension items show the full transcript in the prompt; no listen_type, dictation or audio-only item. Distractors in the comprehension items were hand-checked so none is something the tested speaker says or implies (the NOT-questions necessarily list things the speaker did). matching_pairs lefts are distinct in meaning. Authored from established conventions and the realization''s own earlier units, not from a newly fetched external source. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER (content unchanged for these): (1) به بس سوار شدم versus در بس سوار شدم for boarding a bus (and از بس پیاده شدم for getting off). (2) چای درست کردن versus چای دم کردن / چای جوش دادن for making tea. (3) به وقت versus به موقع for on time. (4) Is قدم زدن a natural, current Kabuli verb for taking a walk, and is انتظار کشیدن natural for waiting at a stop (versus منتظر شدن / انتظار کردن)? (5) تیلفون کردن versus زنگ زدن for phoning. (6) صبحانه (course-wide) versus ناشتا for breakfast. (7) Is دوش گرفتن the usual way to say take a shower, or is دوش کردن / حمام کردن more natural in everyday Kabuli? (8) Position of را in compound verbs (دروازه را باز کردم) and the claim that an indefinite object (چای درست کردم) takes no را. (9) Is نی a natural friendly no beside نخیر? (10) Is دروازه the natural word for the gate or outer door of a home (versus در / حویلی دروازه)? (11) Is چه کار کردی natural for what did you do?'
