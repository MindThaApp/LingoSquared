review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New unit, prs's next uncovered A1 outcome found by exact-diffing every spine_outcome_id used across all prs realization files against every id: in docs/content/universal_spine.yaml (A1-level outcomes only): universal.a1.technology.describe_device_use. This is the next unrealized A1 outcome after sports/unit29 by the spine file's own line order -- confirmed independently against two other signals: the shared English realization (fa-en/nl-en/prs-en/de-en) reached the identical outcome next at its own unit35 immediately after unit34 sports, and nl's own separately-authored realization also reached the identical topic next at its unit34 ('technologie') -- three independent authoring passes converging on the same next gap, not an arbitrary pick. Six lessons: device vocabulary (تکنالوژی as the general topic word, موبایل, کمپیوتر, انترنت, اپلیکیشن, عکس, plus a استفاده+کردن light-verb review note and a combined از...استفاده می‌کنم sentence), phone-action phrases (پیام می‌فرستم -- a genuinely new verb, زنگ می‌زنم reused from unit07, عکس می‌گیرم reusing unit23's می‌گیرم, and a می‌خواهم+subjunctive دانلود کنم construction matching unit07's own می‌خواهم یک پیام بگذارم pattern exactly), a formal 'how many times a day do you use your mobile phone?' question (چند بار در روز از موبایل استفاده می‌کنین؟, reusing unit29's چند بار در هفته...می‌کنین frequency-question shape with هفته swapped for روز, both already-established unit04/unit09/unit12 words) answered with هر روز (unit12) + از...استفاده می‌کنم, a Homayoun/Zarmina dialogue in the established informal تو/-ی register (matching the precedent set by unit20/25/26/28/29's informal forms) covering mobile-phone use, photos, messages, and computer use at the office, a third-person reading passage continuing the same two characters and kept factually consistent with the dialogue (Zarmina: uses her phone a lot, takes photos, sends messages; Homayoun: uses a computer at the office, uses the internet every day -- neither figure contradicts the dialogue), and a wrap-up combining a preference and a constraint with اما (تکنالوژی را دوست دارم اما وقت ندارم -- reusing the established را-marked دوست دارم construction from unit14/unit26/unit29 and وقت/ندارم from unit11/unit26/unit03/unit28/unit29), continuing the exact wrap-up shape unit29 established rather than inventing a new one. Deliberately did NOT introduce می‌کند/می‌کنی (3rd/2nd person of استفاده کردن) or می‌گیرد/می‌فرستد (3rd person of می‌گیرم/می‌فرستم) without an explicit review grammar_note immediately before their first exercise use, applying the exact lesson unit29's own review caught and fixed (its lesson04 needed a review_mikonad note before a dialogue_comprehension prompt used می‌کند pre-emptively) -- checked proactively this time rather than needing a second pass. Continues the established استم/استین full-uncontracted register policy outside the informal Zarmina/Homayoun dialogue lines. Every word re-declared via introduced_tokens within THIS file per the standing per-file untaught-vocabulary footgun, even for words taught many units earlier (من/unit01, از/unit09, دفتر/unit12, هر/روز/unit12, چند/بار/unit29, در/unit02, تو/unit01, بلی/بفرمایین-family/unit07, زیاد/unit07, عالی/unit29, پیام/زنگ/می‌زنم/unit07, می‌گیرم/unit23, می‌خواهم/یک/unit07, این/unit03-unit15, دارم/unit19, خوب/unit07, آهسته/unit07, اما/unit24-unit29, دوست/دارم/را/وقت/ندارم/unit11-unit29, کجا/unit05 -- all re-declared fresh here). Ran the same class of check prior reviews used: a mental token-by-token trace of every exercise's tested_text/word_bank/pairs value against this file's own cumulative introduced_tokens at that point in reading order, confirming every value is covered by a prior teaching card in this same file (not just a prior unit). Authored §14/§16/§17/§19-compliant from the start: no listen_type/listen_select/listen_order exercises (zero prs audio exists), every matching_pairs exercise sized 7 pairs, zero fill_in_blank, every kind:vocabulary card (تکنالوژی/موبایل/کمپیوتر/انترنت/اپلیکیشن/عکس in lesson01, دانلود in lesson02) has a real example sentence built entirely from already-taught or transparently-glossed words. §12 multi-clause coverage applied to the wrap-up's اما-joined translation exercise (period/comma/no-comma variants, matching unit29's own precedent exactly). Also ran a recursive yaml.safe_load boolean-coercion scan (not just grep) over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first). Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file). Deliberately double-checked he/she pronoun usage against the recent, real Pashto-vs-Dari pronoun bug found and fixed elsewhere this session (هغه/هغوی are Pashto, not Dari) -- this file uses only او for he/she (lesson05's reading passage), never هغه/هغوی. schema_version 1.1 from the start.

    STATUS: draft, review pending. This file has NOT yet been through the project's mandatory fresh-context review and must not be imported/shipped until that review completes and any findings are fixed. Compiler validation (schema/structure only) was run and is clean, but that is not a substitute for the linguistic/pedagogical review."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-29). The Homayoun/Zarmina dialogue (lesson04)
    uses the informal تو/-ی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), unit28 (داری),
    and unit29 (می‌کنی) dialogues. تکنالوژی، موبایل، کمپیوتر، انترنت، and
    اپلیکیشن are standard, everyday shared Persian/Dari loanwords with no
    confirmed dialect-divergence risk. تکنالوژی specifically uses the
    genuine Afghan-government-standard spelling (verified via Afghanistan's
    own Ministry of Communications and Information Technology at
    mcit.gov.af), distinct from the Iranian تکنولوژی spelling -- the same
    class of authentic lexical divergence as موتر (unit24) and پشک
    (unit28), though here it is a spelling/orthography divergence rather
    than a different root word.

