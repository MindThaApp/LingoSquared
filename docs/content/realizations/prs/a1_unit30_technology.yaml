target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain) were searched for a fetchable lesson-level technology/device-use unit this pass; none was found -- the Peace Corps Dari course dates from the pre-smartphone/pre-internet era (like the FSI Persian Basic Course), so no dedicated technology topic exists in its table of contents, matching the same search-and-disclose outcome as the unit24/unit26/unit28/unit29 precedents (all confirmed via live web search this pass, not just reasoning). Authored from established prs conventions and vocabulary already taught earlier in this course instead. Every new Dari word verified independently via live web search during authoring, not just reasoning: تکنالوژی confirmed as the genuine Afghan-government-standard spelling (Afghanistan's own Ministry of Communications and Information Technology uses تکنالوژی at its own official domain mcit.gov.af and in its own Dari Wikipedia article title -- not the Iranian تکنولوژی spelling); موبایل confirmed as the standard Dari word for a mobile phone; دانلود کردن confirmed as the standard Dari light-verb construction for 'to download' (a genuine English loanword + کردن, the same light-verb pattern this course already uses throughout); انترنت, کمپیوتر, and اپلیکیشن are standard shared Persian/Dari loanwords with no confirmed dialect-divergence risk found."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude, zero access to the authoring
    reasoning, prs unit30 only -- units 23-26 reviewed separately in
    parallel per the coordinator's split). Full standing checklist
    applied: same-speaker dialogue-distractor collisions (none), stray
    YAML boolean coercion (a recursive yaml.safe_load scan found none
    beyond the two legitimate schema fields), Persian-range Unicode
    codepoints throughout, matching_pairs/word_order answer shapes
    (correct), exercise types used (all pre-registered), no
    internal-jargon leaks, and Dari register/grammar (consistent
    استم/استین formal register outside the Homayoun/Zarmina informal
    تو/-ی dialogue lines; تکنالوژی's Afghan-government-standard spelling
    verified plausible per the file's own generation_provenance).

    One real, significant bug found and fixed per AUTHORING_GUIDE.md
    §11: lesson05's reading passage originally read "...همایون از
    کمپیوتر در دفتر استفاده می‌کند و هر روز از انترنت استفاده می‌کند"
    (Homayoun uses a computer at the office and uses the internet every
    day) -- but the lesson04 dialogue this passage is meant to recap
    establishes the OPPOSITE attribution: it's ZARMINA who says "بلی، در
    دفتر از کمپیوتر استفاده می‌کنم" (Yes, I use a computer at the
    office) in direct response to Homayoun's own question "تو از
    کمپیوتر استفاده می‌کنی؟" (Do YOU use a computer?), while Homayoun's
    only self-stated fact is using the internet every day. The reading
    passage had silently swapped which character uses a computer at the
    office, and lesson05.exercise01/exercise04 both tested the wrong
    (dialogue-contradicting) version of this fact. Fixed by rewriting
    the reading passage to "...او در دفتر از کمپیوتر استفاده می‌کند.
    همایون هر روز از انترنت استفاده می‌کند." (splitting into two
    correctly-attributed sentences), updating exercise01's prompt from
    asking about همایون to زرمینه (with feedback text updated to match,
    correct_option/distractors unchanged since "At the office." is still
    the right answer to the corrected question), and updating
    exercise04's matching_pairs pairs/tested_text and the overlay's
    matching accepted_answers value mapping to swap the wrong sentence
    pair for two correctly-attributed ones (7 pairs total, still within
    §16's 6-12 guidance).

    Two smaller gaps also found and fixed via a token-by-token
    untaught-vocabulary trace of every teaching card's target/example
    text against this file's own cumulative introduced_tokens (stricter
    than the compiler's own tested_text-only check): (1) lesson02's
    download_word example ("این اپلیکیشن را دانلود می‌کنم.") used را
    (the definite direct-object marker) four full lessons before its
    only formal declaration (lesson06's wrap-up) -- fixed by rewriting
    the example to the bare-object form "اپلیکیشن دانلود می‌کنم." (I
    download an app), which needs no را and uses only already-available
    vocabulary; (2) lesson05.exercise06.translate_she_takes_sends ("او
    عکس می‌گیرد و پیام می‌فرستد.") had only one accepted_answers variant
    despite being a genuine two-clause و-joined sentence, missing §12's
    required comma-joined and period-joined forms -- added
    "او عکس می‌گیرد و پیام می‌فرستد" (no period), "او عکس می‌گیرد، پیام
    می‌فرستد" (comma, no و), and "او عکس می‌گیرد. پیام می‌فرستد." (period,
    no و) as three additional variants.

    Re-validated clean after all fixes: 0 errors/0 warnings, both
    standalone and as part of the full prs.a1.unit27-30 batch.

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-29). The Homayoun/Zarmina dialogue (lesson04)
    uses the informal تو/-ی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), unit28 (داری),
    and unit29 (می‌کنی) dialogues. تکنالوژی، موبایل، کمپیوتر، انترنت، and
    اپلیکیشن are standard, everyday shared Persian/Dari loanwords with no
    confirmed dialect-divergence risk. تکنالوژی specifically uses the
    genuine Afghan-government-standard spelling (verified via Afghanistan's
    own Ministry of Communications and Information Technology at
    mcit.gov.af), distinct from the Iranian تکنولوژی spelling -- the same
    class of authentic lexical divergence as موتر (unit24) and پشک
    (unit28), though here it is a spelling/orthography divergence rather
    than a different root word.

