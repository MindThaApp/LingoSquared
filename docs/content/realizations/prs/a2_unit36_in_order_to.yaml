review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block D unit D3), realizing universal.a2.purpose.say_why_you_do_things. Grammar target: purpose with برای + noun (برای خرید), برای + infinitive (برای فرستادن نامه), برای اینکه + subjunctive and تا + subjunctive, the subjunctive built as ب + present stem + ending (re-taught here in full, with the six persons, because other new units are written in parallel), the negative subjunctive (نرسم، گم نکنم، ندهم، نکنی) and purpose clauses with different subjects (کتابم را به تو می‌دهم تا پول خرج نکنی). Fourteen real grammar_note cards (the template has eight) (برای + noun, برای + infinitive, order and برای چه؟, subjunctive form, six persons, برای اینکه, more verbs and two-word verbs, تا, other persons, negative, negative of two-word verbs, learning clauses, saving clauses, کرایه دادن, different subjects). Lesson arc: L01 errands vocabulary and برای + noun or infinitive; L02 subjunctive and برای اینکه; L03 تا, other persons and the negative; L04 learning and saving-money vocabulary and clauses; L05 reading (message from فوزیه about saving for a bicycle) plus a transcript-shown listening item and the errands dialogue; L06 the learning conversation, then culminating typed production. Spine: reading comprehension, listening as dialogue_comprehension with the full transcript in the prompt (prs has no TTS), speaking and writing as typed production (dialogue_response, writing_prompt, translation), culminating writing_prompt with two purpose sentences. Characters: فروزان and عارف are one-off friends (informal تو), plus فوزیه as the writer of the message; none of the three occurs elsewhere in docs/content/realizations/prs or overlays/en-prs (grepped at authoring time). Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = Arif goes first to the post office to send a letter, then to the bank to get money, and walks to avoid paying the fare; dialogue 2 = Faroozan reads a book every night to learn English and to get a good mark in the exam, Arif finds the course expensive, and she gives him her book so that he does not spend money; the message is a separate account by Fozia (saves 2000 afghanis a month to buy a bicycle, wants to cycle to school to avoid fares, goes to the bank tomorrow to take her money). Binding rulings applied: Kabuli written Dari, copula است/استند, 2pl -ین (بخرین، بفرمایین style), modal not used, no object clitics (only را), future only as plain present plus فردا (no خواهم), no progressive, no perfect. No listen_type, dictation or audio-only item. matching_pairs lefts are distinct in meaning (6-9 pairs). Vocabulary reused from the course (تیلفون not needed here; بایسکل، کرایه، پس‌انداز، بانک، کورس، نمبر). New words introduced in this unit: پُسته خانه (spelling as a1_unit35), نامه، فرستادن، خرید، درس، امتحان، یاد گرفتن، گران، ارزان، خرج کردن. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER (recommended answer in brackets): (1) Is تا + subjunctive after the main clause the natural everyday way to say so that, and is the fronted order (تا نان بخریم به دوکان می‌رویم) acceptable? [yes after; fronted is accepted only as an extra answer in L03 ex03] (2) Is برای + infinitive with the object after the infinitive (برای فرستادن نامه، برای گرفتن پول) the natural order, or would speakers also say برای نامه فرستادن / برای پول گرفتن? [keep current] (3) Is برای اینکه + subjunctive natural in speech and writing, or does Dari prefer تا or برای + infinitive? [keep all three, accepted interchangeably] (4) Is پُسته خانه (with the short vowel, as in a1_unit35) the right word for the post office, versus پُست خانه or دفتر پُست? [keep] (5) Is کرایه دادن / کرایه ندهم natural for paying a fare, and is پیاده می‌روم natural for I walk? [keep] (6) Is در بانک چه کار داری؟ natural for what are you doing at the bank, and is the short answer می‌روم تا پول بگیرم natural? [keep] (7) Is نمبر خوب گرفتن the natural way to say get a good mark in an exam, and درس خواندن for to study? [keep] (8) Is خرج کردن / خرج نکنم right for spend (versus مصرف کردن)? [keep] (9) Are the subjunctives بفرستد، بگیرند، بخرین (6 persons) and the negatives نرسم، گم نکنم، نکنی spelled and formed correctly, and is یاد بگیرم correct for the subjunctive of یاد گرفتن? [yes] (10) Is a bare answer like برای اینکه انگلیسی یاد بگیرم (no main clause) natural in the dialogue? [yes] (11) Is برای چه؟ natural as a short follow-up, versus برای چی؟ [keep برای چه؟] (12) Is خرید دارم natural for I have shopping to do, and فرستادن نامه آسان است natural as an example? [keep] (13) In the message, is the plain present with فردا (فردا به بانک می‌روم) natural for a plan? [yes, per the Q3 future ruling]'
