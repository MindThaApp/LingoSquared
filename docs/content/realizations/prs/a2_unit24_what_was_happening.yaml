review:
  status: unreviewed
  required_next_reviewer: native
  notes: 'Block A unit A4 of the grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md), realizing universal.a2.past.tell_what_was_happening. Grammar target: the ongoing past with می‌ + past stem + endings (می‌رفتم, می‌کردم, می‌دیدم, می‌آمدم), its negative (نمی‌رفتم) contrasted with the finished negative (نرفتم), بودن in the past (بودم...), the optional emphasis form در حال ... بودم (with the present counterpart در حال ... استم shown in one note only), and the pattern وقتی که + ongoing past, then the interrupting event in the simple past, helped by ناگهان and همان وقت. Per Q3 (2026-11-15) the plain می‌ form is taught first and the در حال form is optional; both are accepted wherever natural (translation and dialogue_response items list both). The habitual می‌ + past stem is re-taught in its own grammar_note (L01) because unit A3 is not assumed known. Nine real grammar_note cards: imperfect paradigm (L01), more verbs (L02), بودن (L03), negative ongoing (L03), finished vs ongoing (L03), when + simple past vs when + می (L03), در حال emphasis (L03), and two in L04 (the وقتی که pattern, which verb has می). Lesson arc: L01 form recognition (weather, street, می‌رفتم paradigm); L02 more verbs and things, drag and matching; L03 contrast with the nearest confusable forms (رفتم vs می‌رفتم, نرفتم vs نمی‌رفتم, when + simple past vs when + می, plain vs در حال); L04 production in the scenario; L05 reading plus transcript-shown listening; L06 dialogue plus mixed production, ending with a two-sentence writing_prompt. Recycling: the A2 course is a separate Course row, so every A1 word used is either in an earlier en-prs-a2 unit or re-introduced by a card here. Characters: زرمینه and همایون (friend pair, informal تو). Canon checked in docs/content/realizations/prs: همایون works in an office on weekdays (so he goes to the دفتر in the reading and dialogue), زرمینه goes to the market with friends at the weekend (the Friday bazaar exchange), likes movies and cooks (the movie and cooking scenes). No fact claims a car for همایون: he is on the bus in the traffic scenes; generic first-person sentences mention موتر. Facts kept consistent: reading = yesterday morning, going to the office, heavy traffic, waiting in the bus when rain started, phone rang (a friend), arrived late; exchange 1 = Friday in the bazaar with friends, rain, no umbrella, got wet; conversation = last night, Zarmina watched a movie, power went off, friend phoned and she talked; Homayoun came home from the office by bus in heavy traffic and rain. Listening: prs has no TTS, so all 5 dialogue_comprehension items show the full speaker-labelled transcript in the prompt; distractors hand-checked against the transcripts at meaning level. No listen_type, dictation or audio-only item. Banned forms absent: no ازش/باهاش/دیدمش, no خواهم رفت, no contracted می‌تانم. Register: formal written Kabul Dari, 2pl -ین, copula استم/است. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) باران می‌بارید / برف می‌بارید and باران می‌بارد for rain and snow: natural, or is another verb preferred in Kabul? (2) باد زیاد است for windy weather versus باد می‌وزد. (3) برق رفت for a power cut (versus برق قطع شد). (4) در حال رفتن بودم and, with a noun + کردن, در حال آشپزی کردن بودم / در حال آشپزی بودم / در حال رانندگی کردن بودم / در حال رانندگی بودم: are all natural, and is در حال آمدن به خانه بودم fine? (5) منتظر بس بودم / در بس منتظر بودم with plain بودم (no می‌): natural, or should it be منتظر می‌بودم? (6) تیلفونم زنگ زد for my phone rang and به من زنگ زد for phoned me. (7) در بس بودم for I was in the bus. (8) وقتی که versus وقتی alone, and the comma after the background clause. (9) چه کار می‌کردی؟ versus چی می‌کردی؟ for what were you doing. (10) Spelling تیلفون (used in b1) versus تلفون. (11) Is دیشب (last night) and the exchange "جمعه در بازار چه شد؟" natural for asking what happened? (12) The note says the same می‌رفتم can mean used to go: confirm that this overlap is how Kabuli speakers experience it. status: unreviewed; the mandatory fresh-context review has not run.'
