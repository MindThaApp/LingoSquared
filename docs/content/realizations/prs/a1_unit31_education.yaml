target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Searched for a fetchable lesson-level education/studies unit in the Peace Corps Dari course this pass (the same source already in active use for prs's other A1 units): the Live Lingua/fsi-language-courses.org listing for the Peace Corps Dari Language Course exposes only a single combined PDF with no browsable per-lesson table of contents, and the one Peace Corps Dari source with a real, checkable unit structure findable this pass (ERIC ED131692, 'Intermediate Dari for Peace Corps Volunteers') is the intermediate-level source already claimed by b1_unit01_abilities.yaml, not an A1-appropriate school/education topic. Same honest search-and-disclose outcome as the unit18/unit24/unit26/unit28/unit29/unit30 precedents. Authored from established prs conventions and vocabulary already taught earlier in this course instead. Every new Dari word verified independently via live web search during authoring, not just reasoning: پوهنتون confirmed as the genuine Afghan-government-standard/official word for university (Kabul University's own official name and web presence use پوهنتون -- Dari-speaking students historically pushed back on the government's preference for پوهنتون over دانشگاه, the same class of authentic Afghan-vs-Iranian lexical divergence as unit30's تکنالوژی and unit24's موتر); رشته confirmed as the standard Persian/Dari word for a field of study or university major (used in real questions like 'برای چه رشته‌ای؟' -- for which field?); درس خواندن/درس می‌خوانم confirmed as the standard light-verb construction for 'to study' (literally 'to read a lesson'), a shared Persian/Dari construction with no confirmed dialect-divergence risk; محصل reuses unit03's own already-established Afghan Dari word for a university student (confirmed there as distinct from the Iranian دانشجو); طب/حقوق/اقتصاد/ادبیات (medicine/law/economics/literature) are standard shared Persian/Dari academic-field nouns with no confirmed dialect-divergence risk found."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), cold read against the
    AUTHORING_GUIDE.md checklist, sibling fa/prs-en/fa-en files never
    opened. Checked: dialogue_comprehension/dialogue_response distractors
    against the same speaker's other lines (none of exercise04's
    distractors -- "A school.", "A hospital.", "An office." -- are ever
    said by Parwin, no violation); stray YAML boolean coercion via a real
    recursive yaml.safe_load scan, not just grep (clean, only the two
    legitimate schema booleans); matching_pairs answer shape (flat
    left:right dict, correctly handled by grade()'s canonical_pairs()
    alongside the array-of-objects shape); word_order answer shape
    (space-joined strings, correctly handled by canonical_order_tokens());
    cross-lesson fact consistency (Parwin studies medicine at Kabul
    University, difficult but interesting; Karim studies at school --
    dialogue and reading passage agree throughout); jargon leaks (none);
    Dari-vs-Farsi register and Unicode codepoints (Persian keheh/yeh
    throughout, no Arabic-range contamination, او not Pashto
    هغه/هغوی); §12 multi-clause join-form coverage (the one اما-joined
    production target, lesson06's wrap-up, already carries bare/comma/
    period variants); §13 (no fill_in_blank used); §14 (no audio-only
    prs exercise types); §16 (every matching_pairs exercise has 7 real
    pairs); §19 (every vocabulary card has a real example + example_gloss).
    Compiler re-validated clean (0 errors/0 warnings) after the batch
    review pass across units 31-35. No bugs found specific to this file;
    marking reviewed.

    Review 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in the overlay). NATIVE FLAGS: see overlay.

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-30). The Karim/Parwin dialogue (lesson04)
    uses the informal تو/-ی register between two newly-introduced
    close-friend characters, matching the precedent set by unit20
    (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), unit28 (داری),
    unit29 (می‌کنی), and unit30 (می‌کنی). پوهنتون specifically uses the
    genuine Afghan-government-standard word (distinct from the Iranian
    دانشگاه), the same class of authentic lexical divergence as موتر
    (unit24), پشک (unit28), and تکنالوژی's spelling divergence (unit30).
    طب، حقوق، اقتصاد، and ادبیات are standard shared Persian/Dari academic
    nouns with no confirmed dialect-divergence risk.

