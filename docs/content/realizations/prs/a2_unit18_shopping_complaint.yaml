course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: >-
    Continues the established respectful-first Dari register (استم/استین
    copula family, بلی، می‌کنین/می‌توانین formal-plural verb endings)
    appropriate for a shopkeeper scene. Introduces ترجیح دادن (to prefer)
    as this unit's A2-level grammar step for choosing between two offered
    options, alongside continued reuse of already-established وقتی (when)
    and می‌خواهم (I want).

