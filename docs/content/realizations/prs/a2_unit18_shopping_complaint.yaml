        exercises:
          - content_key: prs.a2.unit18.lesson02.exercise01.recognize_state_item_broken
            type: multiple_choice
            tested_text: "این بخاری که دیروز خریدم خراب است"
            prompt: {target_blocks: [{text: "این بخاری که دیروز خریدم، خراب است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit18.lesson02.exercise02.order_request_exchange_or_refund
            type: word_order
            tested_text: "می‌خواهم آن را تعویض کنم یا پولم را پس بگیرم"
