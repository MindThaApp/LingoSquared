              - {left: "تعویض کردن", right: "to exchange"}
              - {left: بازپرداخت, right: refund}
              - {left: رسید, right: receipt}
              - {left: گارانتی, right: warranty}
              - {left: عیب, right: defect}
          - content_key: prs.a2.unit18.lesson01.exercise04.order_when_not_warm
