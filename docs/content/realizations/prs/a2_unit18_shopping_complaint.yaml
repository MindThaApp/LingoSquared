units:
  - content_key: prs.a2.unit18.shopping_complaint
    title: شکایت از خرید
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.shopping.make_a_complaint
    planned_lesson_count: 4

    lessons:
      - content_key: prs.a2.unit18.lesson01.complaint_vocabulary
        title: کلمات شکایت از خرید
        spine_outcome_id: universal.a2.shopping.make_a_complaint
        teaching:
          - content_key: prs.a2.unit18.lesson01.teach.broken_word
            kind: vocabulary
            target: {text: خراب, language_code: prs, direction: rtl}
            introduced_tokens: [خراب]
            example: {text: "این بخاری خراب است.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit18.lesson01.teach.exchange_word
            kind: vocabulary
            target: {text: "تعویض کردن", language_code: prs, direction: rtl}
            introduced_tokens: [تعویض, کردن]
            example: {text: "می‌خواهم بخاری را تعویض کنم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit18.lesson01.teach.refund_word
            kind: vocabulary
            target: {text: بازپرداخت, language_code: prs, direction: rtl}
            introduced_tokens: [بازپرداخت]
            example: {text: "بازپرداخت پول را می‌خواهم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit18.lesson01.teach.receipt_word
            kind: vocabulary
            target: {text: رسید, language_code: prs, direction: rtl}
            introduced_tokens: [رسید]
            example: {text: "رسید خرید را همراه دارم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit18.lesson01.teach.warranty_word
            kind: vocabulary
            target: {text: گارانتی, language_code: prs, direction: rtl}
            introduced_tokens: [گارانتی]
            example: {text: "این بخاری یک سال گارانتی دارد.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit18.lesson01.teach.defect_word
            kind: vocabulary
            target: {text: عیب, language_code: prs, direction: rtl}
            introduced_tokens: [عیب]
            example: {text: "این بخاری یک عیب دارد.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit18.lesson01.teach.when_grammar
            kind: grammar_note
            target: {text: "وقتی آن را روشن می‌کنم، گرم نمی‌شود.", language_code: prs, direction: rtl}
            introduced_tokens: [وقتی, آن, را, روشن, "می‌کنم", گرم, "نمی‌شود"]
          - content_key: prs.a2.unit18.lesson01.teach.heater_word
            kind: vocabulary
            target: {text: "بخاری برقی", language_code: prs, direction: rtl}
            introduced_tokens: [بخاری, برقی]
            example: {text: "بخاری برقی برای خانهٔ جدیدم خریدم.", language_code: prs, direction: rtl}
          - content_key: prs.a2.unit18.lesson01.teach.va_word
            kind: grammar_note
            target: {text: "و (and)", language_code: prs, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: prs.a2.unit18.lesson01.exercise01.recognize_broken
            type: multiple_choice
            tested_text: خراب
            prompt: {target_blocks: [{text: خراب, language_code: prs, direction: rtl}]}
          - content_key: prs.a2.unit18.lesson01.exercise02.recognize_refund
            type: multiple_choice
            tested_text: بازپرداخت
            prompt: {target_blocks: [{text: بازپرداخت, language_code: prs, direction: rtl}]}
