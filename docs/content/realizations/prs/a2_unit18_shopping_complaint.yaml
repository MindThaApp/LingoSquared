          - content_key: prs.a2.unit18.lesson03.teach.policy_text
            kind: reading
            target: {text: "اگر کالای خریداری شده خراب باشد، می‌توانین ظرف هفت روز آن را با رسید اصلی تعویض یا بازپرداخت کنین.", language_code: prs, direction: rtl}
