generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session, so real, direct WebFetch access was used instead, per this session's task instructions. WebFetch on the DLI Dari course's own top-level index confirmed the site organizes into Semester 1/2/3 book directories; checked several genuinely not-yet-tried ranges this session (prior units had already exhausted Semester 1's s21-24 through s37-40): Semester 1's s1-4/s5-8/s9-12/s13-16/s17-20 (each downloaded via curl and run through `pdftotext -layout`, which succeeded cleanly, yielding real searchable Dari/English text), and Semester 2's Student Units 1-20 (S Book 1-20.pdf, 18MB, also cleanly extractable). None contained a dedicated 'make an appointment' lesson naming a service, day, and time. The closest adjacent material found: Semester 1 s17-20's Lesson 19 'At a Hotel' teaches ریزرف کردن (to make a reservation) in a room-booking phone call, and Semester 2 Unit 3's 'At a Medical Clinic' military-commands lesson has clinic-processing vocabulary (منتظر داکتر باشید, etc.) -- both genuinely adjacent (hotel reservations belong to the separate future accommodation outcome; the medical-clinic commands are processing-procedure imperatives, not appointment-booking dialogue) but neither is a fit for this outcome, so neither was used as a direct source. This unit is therefore authored fresh from already-established in-course conventions rather than adapted from newly found source material, the same honest disclosure pattern as several recent units when the located DLI material didn't cover the specific topic. Genuinely useful and directly reused: this course's OWN prior units already established the exact vocabulary this outcome needs -- قرار (personal appointment) and the full 'قرار شما ساعت چند است؟ / قرار من ساعت هشت و نیم است' question-answer pattern from unit11 lesson05, and وقت (time/availability, as in 'جمعه مصروف استم') plus آزاد (free) from unit09 and unit26 respectively. داکتر دندان (dentist, literally 'tooth doctor') and منشی (receptionist/clerk, combined as منشی داکتر) were both independently web-verified as genuine, real-world Afghan usage (منشی داکتر confirmed via real Afghan clinic/job-posting contexts, though modern Kabul job ads increasingly also use the English loanword 'ریسیپشنیست' -- منشی itself remains standard, understood, non-archaic Dari, not a 1960s-source artifact, so no §10 modernization concern). وقت گرفتن/بگیرم (to get/take an appointment) is independently confirmed as genuine live Afghan/Dari usage (a real Instagram post from a Kabul dental clinic: 'وقت داکتر دندان است') and is also the exact construction this course's own a2_unit09 (bureaucracy) already uses for a different, later appointment (وقت بگیرم, 'to get an appointment [for a document change]') -- reusing the identical verb here for a dentist appointment is genuinely consistent cross-unit usage, not incidental. Every other new word (دندان, بگیرم, برای, منشی) is a standard, everyday Dari word, not obscure or source-sourced."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's realization. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans; no internal-jargon/snake_case leaks in learner-facing options/distractors/pairs; all matching_pairs exercises have 6-12 pairs per AUTHORING_GUIDE.md #16; all exercise types used (multiple_choice/matching_pairs/word_order/translation/writing_prompt) are registered in frontend/src/components/exercises/ExerciseRenderer.tsx; no listen_select/dialogue_response/other audio-dependent exercises exist (correctly following AUTHORING_GUIDE.md #14's prs no-TTS restriction, so the nl-unit44-50-style same-speaker-distractor bug class does not apply here -- this unit's multiple_choice exercises are pure text-translation recognition, not audio clip identification); every dialogue teaching-card title matches its own gloss exactly; cross-lesson facts (prices, times, character preferences, item colors/locations) are consistent everywhere referenced within the unit. Dari register/grammar read as sound, consistent Kabul Dari throughout, matching this course's established استم/استین uncontracted register and Afghan-not-Iranian vocabulary choices."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-41). Lessons 01-03's vocabulary/practice
    sentences are 1st-person statements (می‌خواهم، آزاد استم) and
    polite 2nd-person-plural questions (آزاد استین؟) consistent with
    unit09/unit11's own established patterns. The lesson04 dialogue is
    a NEW polite-service register exchange between Homayoun and a new
    receptionist character (منشی), using استین/می‌خواهم the same way
    unit08's دکاندار/مشتری shop exchange established polite-service
    register -- deliberately NOT the established informal-تو Homayoun/
    Zarmina friendship register from units 20/21/22/25/27/37/38/39/40/
    41, since a phone call to book an appointment is a different social
    context than a conversation between friends. Lesson05's reading
    passage uses 3rd-person او + دارد/است state descriptions, and
    lesson06's wrap-up uses the same formal شما-prefixed question
    pattern unit39/40/41 already established.

