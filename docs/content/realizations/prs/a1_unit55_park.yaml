  authoring_system: claude
  source_material: "Firecrawl was retried fresh for this unit (`firecrawl search \"Dari پارک park picnic vocabulary phrasebook Afghan\"`) and again returned HTTP 402, 0/1000 credits, matching every prior unit's status this session. Before falling back to established-conventions-only authoring, the shared scratchpad's already-cached DLI Dari corpus (`.firecrawl/dli-dari-s9-12.txt`, `s17-20.txt`, `s21-24.txt`, `s25-28.txt`, `s29-32.md`) was searched fresh for this specific topic via English-keyword greps (park, picnic, tree, flower, walk, stroll, beautiful) and this time found real, substantial, repeated attestation across multiple semester glossaries, not a near-miss like several recent units: پارک (park) appears in s21-24's and s25-28's own vocabulary glossaries, alongside a genuine worked example sentence in s21-24 ('بهتر است به پارک بروم و کمی گردش کنم.' -- 'I should go to the park and stroll a little.'); میله (picnic) and its light-verb collocation میله کردن ('to have a picnic') appear in all of s17-20/s21-24/s25-28's glossaries -- this is a real Afghan-Dari-specific sense (میله means 'festival/outdoor fete/picnic-outing' in Kabuli usage, distinct from and not to be confused with standard Iranian Farsi's میله 'rod/bar/pole'; independently cross-checked against the well-known real annual Mazar-e-Sharif event name میله گل سرخ, 'Red Flower Festival', confirming this sense is genuine regional usage, not a DLI transcription artifact); گردش کردن / قدم زدن ('to stroll/walk around') and پیاده رفتن ('to walk') both appear in s17-20/s21-24/s25-28; and درخت (tree, plural درخت‌ها/درختان) and گل (flower, plus the derived گل فروشی 'flower shop') appear repeatedly across s9-12/s17-20/s21-24/s25-28, including a real worked example ('چی دسته گل مقبولی!' -- 'What a beautiful flower bouquet!'). A raw-codepoint check on the OCR'd glossary lines (Python, not eyeballing) confirmed these are genuine Persian-range keheh/yeh underneath Arabic Presentation Forms-B ligature glyphs (e.g. پارک's ﮎ is U+FB8E, the isolated-form ligature of U+06A9 Persian keheh, not U+0643 Arabic kaf) -- an OCR rendering artifact, not a real script-confusion bug, consistent with the same finding on every other unit that has used this cached corpus. Given real, multi-source DLI attestation for the two core new nouns (پارک is already course-review from unit13/unit22/unit29 and did not need re-sourcing) plus میله, درخت, and گل, this unit's three genuinely new content words are all DLI-attested rather than freely invented, a stronger sourcing position than several recent units (concert/museum/cinema all had to fall back to unattested standard-loanword nouns). Deliberately did NOT introduce a separate 'to stroll' verb (گردش کردن/قدم زدن), even though DLI-attested, since this course's own unit26 already established پیاده‌روی (walking, as a noun with the می‌کنم light-verb pattern) for the same underlying concept -- introducing a near-synonym verb here would create exactly the AUTHORING_GUIDE.md #17 true-synonym-candidate risk with no disambiguating anchor, so پیاده‌روی is reused as review instead of adding a new but redundant word. Built otherwise entirely from this course's own already-established vocabulary and grammar: این/است/در/خوب (multiple early units), و (unit13), پارک (unit13/unit22/unit29), از/تا/شش/صبح/هشت/شب/ساعت (unit01/unit04/unit08's established time-and-range vocabulary), باز/بسته (unit50's established open/closed pair, reused here for the park's own opening hours via the same X-از-ساعت-N-تا-ساعت-M-باز-است frame unit50/unit52/unit53 already established -- a legitimate same-course structure reuse per AUTHORING_GUIDE.md #3, a genuinely different subject noun (پارک, not حوض آببازی/موزیم/سینما) so not a duplicate-content bug), می‌خواهین/برویم/بلی/عالی/قبول (unit13's established plan-proposing/accepting frame, reused with a new day -- شنبه, unit09's established weekday, instead of unit13's own جمعه -- so the sentence is structurally parallel but not a verbatim repeat of already-shipped unit13 content), زرمینه/چی/می‌کنیم/یا (unit05/unit08/unit01's established tokens, reused for the Homayoun/Zarmina friend dialogue continuing their established informal تو/-ی throughline from units 20/25/26/28/29/30/38), پیاده‌روی (unit26's established hobby word), دوست/دارم/را/اما/وقت/ندارم (unit03/unit11/unit14/unit24/unit26/unit29's established preference-and-constraint wrap-up construction, reused verbatim in shape from unit29's own 'X را دوست دارم اما وقت ندارم' precedent with a new subject, پیاده‌روی, not فوتبال), نزدیک/خانه (unit02/unit01's established tokens, combined into the -تان-suffixed خانه‌تان following unit48/unit49/unit50/unit52/unit53's own established -تان-suffix precedent applied to a new noun), او/رفت/دید/بود/به (unit03/unit20/unit41/unit53/unit06's established 3rd-person-past reading-passage paradigm, reused for the lesson05 recap with no new verb form needed since unit53 already introduced دید's 3rd-person cell). می‌خواهی (do you want, informal 2nd-singular) is introduced as the expected paradigm cell of the already-established می‌خواهم, matching unit26/unit29/unit30/unit47-53's own repeated precedent for introducing a verb's next person-marking cell fresh with its own review card rather than as new grammar. No new grammar item beyond that one expected paradigm-cell extension -- this unit is pure vocabulary-and-recombination depth, the same shape unit53/unit54's own provenance notes describe for their own units. Deliberately kept the park's stated opening-hours fact (از ساعت شش صبح تا ساعت هشت شب) stated identically wherever referenced (lesson02 only, never restated with a conflicting variant elsewhere) per AUTHORING_GUIDE.md #11's own warning about restated facts, and the wrap-up's preference-and-constraint sentence and location question are two independent, never-combined statements, avoiding any arithmetic-consistency risk entirely (this unit states only one hours-fact and one day-of-week, so no comparative/total-fact risk exists at all, unlike several recent units that had to manage two showtime/price pairs)."
