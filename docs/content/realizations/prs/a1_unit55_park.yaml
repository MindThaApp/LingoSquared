  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude): checked against the full checklist (same-speaker-distractor risk in multiple_choice/dialogue_response, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, and exercise-type registration against ExerciseRenderer.tsx) -- no real bugs found in this unit. No listen_select/listen_type/dialogue_comprehension exercises exist in this file (prs has zero TTS/audio coverage per AUTHORING_GUIDE.md #14), so the same-speaker-distractor bug class doesn't structurally arise; every multiple_choice item shows the literal Dari text being translated, not audio, so distractor overlap with other same-speaker lines elsewhere in the dialogue can't create ambiguity the way it does for listen_select. matching_pairs accepted_answers use the established flat-dict shape and word_order accepted_answers use the established space-joined-string shape, both of which the compiler/grade() already canonicalize correctly. Compiler validation (grouped with the rest of the prs A1 corpus, per course-level Course-row scoping) is clean: 0 errors, 0 warnings. Re-verified against the file's own original self-report below, which is accurate. New en-prs A1 unit after unit54 (concert). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml (in the spine file's own line order) found universal.a1.park.enjoy_a_park_outing as the next unrealized A1 outcome, immediately after concert (line 1604, right after concert's own line 1579). Both listed prerequisites -- universal.a1.plans.make_simple_plans [unit13] and universal.a1.weather.describe_basic_weather [unit22] -- are already realized in prs. Matches all four of the outcome's own assessment_requirements: understand_park_description (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14, testing lesson01's scenery sentences and lesson02's park-sign reading), suggest_park_activity (speaking substituted the same way this whole corpus substitutes it -- production exercises across lesson04's walk-or-picnic dialogue), read_park_sign (lesson02's reading card, a genuine notice-style sentence naming the park's opening and closing hours together), and write_park_message (writing_prompt exercises across all six lessons). Six lessons, matching concert's own 6-lesson shape (one more than the two-fact museum/cinema shape) because this outcome's own can_do explicitly names 'make plans' as a distinct step, backed by its own plans.make_simple_plans prerequisite: park-and-nature vocabulary (درخت/گل new; پارک reviewed from unit13/unit22/unit29), reading a park sign giving its opening and closing hours (pure recombination, zero new vocabulary, matching unit51-54's own established precedent that a reading lesson doesn't always need fresh vocabulary of its own -- پارک/باز/بسته/از/تا/شش/صبح/هشت/شب/ساعت all reviewed), proposing a plan to go to the park on Saturday and accepting it (reuses unit13's own established می‌خواهین/برویم/بلی/عالی/قبول frame applied with a new day, شنبه instead of جمعه, avoiding a verbatim repeat of already-shipped unit13 content while still legitimately reusing the same structural skeleton per AUTHORING_GUIDE.md #3), a Homayoun/Zarmina dialogue in the established informal تو/-ی register suggesting a walk or a picnic (میله new; پیاده‌روی reviewed from unit26; می‌خواهی introduced as the expected informal-2nd-person paradigm cell of the already-taught می‌خواهم, matching unit26/unit29/unit30/unit47-53's own precedent for this exact move), a third-person reading passage recapping the visit (او/رفت/دید/بود all reviewed, not fresh, since unit20/unit41/unit53 already established every cell needed -- this unit needed no new grammar), and a wrap-up combining a preference-and-constraint statement with اما (reusing unit29's own established 'X را دوست دارم اما وقت ندارم' shape with a new subject, پیاده‌روی) and a formal تان-suffixed location question (پارک نزدیک خانه‌تان است؟, reusing unit48-53's own established -تان-suffix precedent applied to a new noun, خانه). Re-declares all review vocabulary in-lesson before first exercise use because the compiler's taught-vocabulary check is per-file (following unit53/unit54's own precedent of redeclaring even within-file review words per lesson, not just once): این/است/در/خوب از multiple earلier units، و از unit13، پارک از unit13/unit22/unit29، از/تا/شش/صبح/هشت/شب/ساعت از unit01/unit04/unit08، باز/بسته از unit50، می‌خواهین/برویم/بلی/عالی/قبول از unit13، شنبه از unit09، زرمینه/چی/می‌کنیم/یا از unit05/unit08/unit01، پیاده‌روی از unit26، دوست/دارم/را/اما/وقت/ندارم از unit03/unit11/unit14/unit24/unit26/unit29، نزدیک/خانه از unit02/unit01، او/رفت/دید/بود/به از unit03/unit06/unit20/unit41/unit53. Uses او only in lesson05's reading passage naming همایون explicitly for the first sentence and switching to او for the following sentences -- the same pattern unit27/unit41/unit47-54's own reading passages already established; no Pashto هغه/هغوی anywhere -- double-checked against the known Pashto-vs-Dari pronoun bug. The wrap-up's اما-joined contrast sentence uses a single canonical form (with/without a trailing period, both accepted) matching unit33/39-54's own established precedent that this specific اما-joined-contrast construction has exactly one natural conjunction reading, so AUTHORING_GUIDE.md #12's multi-variant requirement doesn't otherwise arise -- confirmed by explicit review, not assumed; no other multi-clause accepted_answers exist in this unit. No fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs), so AUTHORING_GUIDE.md #13/#17 don't arise either. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead; lesson04's dialogue lines and their speakers (همایون: 2 lines; زرمینه: 2 lines) were listed and cross-checked by hand before writing any multiple_choice distractor to confirm no distractor is an ambiguous paraphrase of a line the tested speaker also says elsewhere -- همایون's two lines (asking what to do / approving the picnic idea) and زرمینه's two lines (offering the walk-or-picnic choice / confirming and proposing to go) are all topically distinct enough that no distractor risks being a line the tested speaker also says. Every matching_pairs exercise uses exactly 7 pairs (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (درخت, گل, میله) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built only from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) or a double-quoted scalar is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. A script-purity check (recursive scan for Arabic-range kaf/yeh codepoints U+0643/U+064A) found zero stray Arabic-range codepoints -- every keheh/yeh in this file is the Persian-range form (U+06A9/U+06CC). A Pashto-vs-Dari pronoun check found only او for he/she throughout, never هغه/هغوی. §11 cross-lesson fact check: lesson02's stated opening-hours fact (از ساعت شش صبح تا ساعت هشت شب) appears only in lesson02 and is never restated with a conflicting variant; the walk-or-picnic outcome (میله chosen, lesson04) is never contradicted by lesson05's reading passage, which states only that he saw trees and flowers and that the park was nice, consistent with (not contradicting) a picnic having taken place; the wrap-up's two statements (a preference/constraint sentence and a location question) are independent and never combined arithmetically. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

