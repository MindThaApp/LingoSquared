review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    First A2 unit for the prs realization (spine outcome: universal.a2.
    bureaucracy.register_with_authorities). Own scenario, authored
    independently of the English/Dutch A2 units and of the fa sibling
    realization of this same outcome (not consulted while drafting, per
    AUTHORING_GUIDE §8): کریم has moved to a new home in کابل and needs
    to register his new address at شاروالی (the municipality -- the
    genuinely Afghan-specific term, distinct from Iranian Farsi's
    شهرداری) so his تذکره (Afghan national ID booklet -- an Afghan-
    specific document, not the Iranian کارت ملی) reflects his current
    address. A2-level step-up from A1: چون (because) subordinate
    clauses, and the polite indirect-question forms می‌توانم...؟ and
    می‌شود بگویین...؟. Housing/phone-contact prerequisite vocabulary
    (خانه, آدرس, وقت گرفتن) taught inline within this unit rather than
    assumed from a prior A1 unit, per universal_spine.yaml's own "a
    realization may teach prerequisites concurrently" allowance -- prs
    has not yet authored a dedicated A1 housing unit (unit07's
    communication unit already covers basic phone contact, reused here
    without re-teaching). Every fact (moved-in date, required documents,
    deadline, appointment day/time, tracking code) kept consistent
    across lesson02/03/04 per §11. Every multi-clause accepted_answers
    list carries period/comma/او-joined forms per §12 (see the matching
    overlay). No fill_in_blank used, sidestepping §13 entirely. No
    listen_type/listen_select/listen_order or audio-only
    dialogue_comprehension anywhere in this unit per §14 -- prs has zero
    real recorded/TTS audio; every exercise has a genuine visible text
    prompt. A media_assets block is declared purely to pre-stage a
    future recording pass, unreferenced by any exercise here. Dialect:
    continues prs's established Afghan Dari register verified against
    shipped units 01/02/04 (استم/استی/استند copula family, بلی/نخیر,
    زنده باشین) -- deliberately never Iranian Farsi forms (هستم-family,
    بله/نه, کارت ملی/شهرداری). Fresh-context review completed 2026-07-06:
    checked spine-outcome discipline, exercise pacing, dialect
    authenticity (شاروالی/تذکره/نمبر/بلی confirmed genuinely Afghan, no
    Iranian forms leaked into learner-facing content), A2-level
    complexity, script purity (zero Arabic-range kaf/yeh), jargon leaks,
    content_key parity (perfect, 20 teaching + 21 exercise keys both
    sides), untaught vocabulary (ran a Persian-Unicode tokenizer script
    against cumulative introduced_tokens -- zero violations),
    prompt-shows-answer risk (none -- every multiple_choice/reading_
    comprehension/dialogue_comprehension prompt is Dari-script paired
    with English-script options, not solvable by visual matching), §11
    fact consistency, §12 multi-clause forms, and a real compile (0
    errors/0 warnings, valid JSON). No realization-side content bugs
    found; see the matching overlay file's review notes for the fixes
    actually made (all were on the overlay side).

    POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by
    unit13's fresh-context reviewer flagging the same bug in units 11/12)
    found this file also had exercises where realization prompt.target_blocks
    duplicated the overlay's own instruction text verbatim in English -- the
    compiler would have rendered the same sentence twice to the learner. Fixed
    mechanically: every affected exercise's prompt set to target_blocks: [].
    Re-verified validate+compile clean (0 errors/0 warnings) and confirmed
    zero remaining instruction-duplicate target_blocks via a script comparing
    every exercise's target_blocks against its overlay instruction.

course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: >-
    Continues the established respectful-first Dari register (استم/
    استین copula family, بلی/نخیر) appropriate for dealing with a
    municipality clerk. Introduces چون (because) clauses and the
    polite indirect forms می‌توانم...؟ (may I...?) and می‌شود بگویین...؟
    (would you say / could you tell me...?) as the A2-level step up
    from A1's direct requests.

