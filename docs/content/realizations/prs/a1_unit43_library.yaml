generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session, so real, direct WebFetch access was used instead, per this session's task instructions. WebFetch on the DLI Dari course's own top-level index confirmed three semester directories; per unit42's own provenance note, Semester 1's full range (s1-40) and Semester 2's Student Units 1-20 had already been checked by earlier units. This task additionally checked Semester 2's Student Units 21-40 (S Book 21-40.pdf, 24MB, downloaded via curl and cleanly extracted with `pdftotext -layout`) and briefly checked Semester 3 Part 1's small front-matter file (Dari Sem 3 Book 1.pdf, 202K -- extracted cleanly but contained no unit/lesson content, only front matter). Semester 2 units 21-40 turned out to be advanced narrative/EEI content (Unit 21 alone covers Afghanistan's education system and a refugee-border-crossing story, in a formal register well past A1) with zero library-related vocabulary anywhere in the extracted text (grepped for both \"library\" and کتابخانه, zero hits beyond unrelated photo-credit acknowledgments). Semester 3's large S/T Book PDFs (52-53MB each) were not downloaded and extracted given Semester 2's confirmed advanced register makes Semester 3 an even less likely fit for an A1 library-borrowing scenario, and diminishing returns given the exhaustive search already completed across two full semesters. This unit is therefore authored fresh from already-established in-course conventions, the same honest disclosure pattern as unit42 and several earlier units when the located DLI material didn't cover the specific topic. Genuinely useful and directly reused: this course's OWN prior units already established the exact vocabulary this outcome needs -- کتاب (book, from unit04/unit11/unit26), تاریخ (date, from unit09), کدام (which, from unit14), بگیرم (subjunctive \"get/take\", from unit42, re-taught fresh here per the per-file vocabulary rule), and می‌خواهین (polite plural \"you want\", from unit13). کتابدار (librarian, literally \"book-holder\") was formed on the exact same -دار (\"holder/keeper\") suffix pattern this course already established with دکاندار (\"shopkeeper\", unit08) -- not a new word-formation pattern, a direct parallel. قرض گرفتن (\"to borrow\", literally \"to take as a loan\") was deliberately chosen over the more bureaucratic-register امانت گرفتن (also valid Dari/Farsi for library borrowing, but more formal/administrative) to stay consistent with this unit's plain educated-colloquial register -- both are genuine, correct Dari; قرض is simply the more everyday choice a beginner course should teach first. Every other new word (کتابخانه, پس, دادن, بدهم, قرض) is a standard, everyday Dari word, not obscure or source-sourced."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit42 (appointments). An exact diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml (plus a2_unit09/10 and b1_unit01) against every outcome id in docs/content/universal_spine.yaml found universal.a1.library.borrow_return_item as the next unrealized A1 outcome (immediately after appointments in spine file order; all three listed prerequisites -- universal.a1.dates.exchange_calendar_dates [unit09], universal.a1.places.locate_common_places [unit05], and the hobbies outcome [unit26, though the spine's own prerequisite id string has a stale name mismatch against the outcome's real id -- not touched here, out of this task's scope] -- are already realized). This unit covers borrowing and returning a simple library item, asking for the due date, and understanding a basic library receipt/notice, matching all four of the outcome's own assessment_requirements: understand_library_exchange (listening substituted with reading-based multiple_choice recognition per the established no-prs-audio pattern, AUTHORING_GUIDE.md #14), request_library_service (speaking substituted the same way this whole corpus substitutes it -- production exercises: translation/writing_prompt/dialogue exchange), read_library_receipt (lesson05's reading passage recapping the borrowed item and its due date, the same narrative-recap equivalence unit42 already established for read_appointment_confirmation), and write_library_message (writing_prompt exercises across lessons01-06 stating the book/date/request). Six lessons: library/book vocabulary (کتابخانه, کتابدار both new; کتاب/دارم/است/می‌خواهم/یک reused), asking the return date (تاریخ پس دادن کتاب کدام روز است؟, reusing تاریخ from unit09, کدام from unit14, روز from unit09; new دو-word gerund پس دادن), borrowing and returning the book itself (بگیرم reused from unit42's own subjunctive pattern, extending می‌خواهم + subjunctive to a new verb بدهم for \"give back\", plus new noun قرض \"loan\"), a کتابخانه phone/counter exchange between Homayoun and a new librarian character (کتابدار) confirming a book and its Monday return date, a third-person reading passage recapping the same loan, and a wrap-up contrasting having a book one day with not having one another day using اما plus a formal شما-prefixed question -- mirroring unit39-42's own wrap-up shape exactly. Deliberately used the کتابدار role (already introduced as vocabulary in lesson01) as the dialogue's second speaker rather than folding this into the established Homayoun/Zarmina friendship throughline, for the same polite-service-register reason unit42 used a receptionist rather than Zarmina -- a library counter exchange is a different social register than a conversation between friends. Homayoun is again the requesting party, consistent with his established character across every polite-service-register dialogue this corpus has authored (unit08's shop, unit42's dental office, now the library). Re-declares all review vocabulary in-file before first exercise use because the compiler's taught-vocabulary check is per-file, including words taught in earlier units (کتاب از unit04/unit11/unit26, دارم/است از unit09/unit11, می‌خواهم/یک از unit04/unit17, تاریخ/روز/دوشنبه/سه‌شنبه از unit09, کدام از unit14, در از multiple earlier units, را از unit14/unit26, این از unit04, بسیار/خوب از unit09/unit11/unit42, تشکر زیاد/خواهش می‌کنم از unit01/unit40, سلام از unit01, همایون/او/دارد از unit09/unit11/unit16/unit20-42/unit03, خوشحال از unit02/unit25/unit42, اما/ندارم از unit03/unit14/unit28/unit32/unit39-42, شما از unit03/unit14/unit28/unit32/unit39-42, می‌خواهین از unit13). Uses او only for he/she (no possessive-suffix forms needed this unit since the reading passage uses او as a standalone subject pronoun throughout, same as unit42's own reading passage); no Pashto هغه/هغوی -- double-checked against the known Pashto-vs-Dari pronoun bug. No multi-clause translate/write exercise combines two natural clauses without an explicit single conjunction -- the one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form only, matching unit39-42's own established precedent that this construction has exactly one natural conjunction reading; there is no dialogue line in this unit that combines two clauses without a conjunction, so the AUTHORING_GUIDE.md #12 multi-variant question doesn't arise elsewhere in this file. No listen_type/listen_select/listen_order items are authored for prs (AUTHORING_GUIDE.md #14, zero prs audio/TTS coverage exists) -- listening-modality assessment coverage is provided via reading-based multiple_choice recognition instead. Zero fill_in_blank exercises anywhere in this unit (matching the established corpus-wide convention of avoiding that exercise type for prs). Matching-pairs exercises use seven pairs each (AUTHORING_GUIDE.md #16). Every vocabulary teaching card (کتابخانه, کتابدار, پس دادن, بگیرم, قرض, بدهم) has a real example sentence for schema_version 1.1 (AUTHORING_GUIDE.md #19), built from words already taught earlier in the same lesson or file; grammar_note/phrase/dialogue/reading cards are exempt and correctly carry no example field. Every literal Persian ؟ inside an inline flow-mapping pair (matching_pairs left/right) is inside a quoted string. A recursive yaml.safe_load boolean-coercion scan (not just grep) was run over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first); no bare Yes/No/True/False/On/Off values exist anywhere in this unit's content. Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file, and en-prs is the only direction this task covers -- prs-en was not touched)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-42). Lessons 01-03's vocabulary/practice
    sentences are 1st-person statements (می‌خواهم، دارم) and the same
    می‌خواهم + subjunctive construction unit42 established
    (می‌خواهم ... بگیرم). The lesson04 dialogue is a NEW polite-service
    register exchange between Homayoun and a new librarian character
    (کتابدار), using می‌خواهین the same way unit13's plan-proposal question
    and unit42's own receptionist exchange established polite-service
    register -- deliberately NOT the established informal-تو Homayoun/
    Zarmina friendship register from units 20/21/22/25/27/37/38/39/40/
    41, since a library counter exchange is a different social context
    than a conversation between friends. Lesson05's reading passage uses
    3rd-person او + دارد/است state descriptions, matching unit42's own
    reading-passage shape exactly, and lesson06's wrap-up uses the same
    formal شما-prefixed question pattern unit39-42 already established.

