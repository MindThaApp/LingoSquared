units:
  - content_key: prs.a1.unit10.shopping
    title: خرید و قیمت
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.shopping.ask_prices_quantities
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit10.lesson01.shopping_vocabulary
        title: کلمات خرید
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: prs.a1.unit10.lesson01.teach.dokan
            kind: vocabulary
            target: {text: دوکان, language_code: prs, direction: rtl}
            introduced_tokens: [دوکان]
          - content_key: prs.a1.unit10.lesson01.teach.qeymat
            kind: vocabulary
            target: {text: قیمت, language_code: prs, direction: rtl}
            introduced_tokens: [قیمت]
          - content_key: prs.a1.unit10.lesson01.teach.arzan
            kind: vocabulary
            target: {text: ارزان, language_code: prs, direction: rtl}
            introduced_tokens: [ارزان]
          - content_key: prs.a1.unit10.lesson01.teach.gran
            kind: vocabulary
            target: {text: گران, language_code: prs, direction: rtl}
            introduced_tokens: [گران]
          - content_key: prs.a1.unit10.lesson01.teach.takhfif
            kind: vocabulary
            target: {text: تخفیف, language_code: prs, direction: rtl}
            introduced_tokens: [تخفیف]
          - content_key: prs.a1.unit10.lesson01.teach.va_word
            kind: vocabulary
            target: {text: و, language_code: prs, direction: rtl}
            introduced_tokens: [و]
        exercises:
          - content_key: prs.a1.unit10.lesson01.exercise01.recognize_dokan
            type: multiple_choice
            tested_text: دوکان
            prompt: {target_blocks: [{text: دوکان, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson01.exercise02.recognize_takhfif
            type: multiple_choice
            tested_text: تخفیف
            prompt: {target_blocks: [{text: تخفیف, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson01.exercise03.listen_words
            type: listen_select
            tested_text: گران
            media_asset_key: prs.a1.audio.shopping.vocab.01
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson01.exercise04.match_words
            type: matching_pairs
            tested_text: دوکان قیمت ارزان گران تخفیف و
            prompt: {target_blocks: []}
            pairs:
              - {left: دوکان, right: shop}
              - {left: قیمت, right: price}
              - {left: ارزان, right: cheap}
              - {left: گران, right: expensive}
              - {left: تخفیف, right: discount}
              - {left: و, right: and}
          - content_key: prs.a1.unit10.lesson01.exercise05.order_arzan_gran
            type: word_order
            tested_text: ارزان گران
            prompt: {target_blocks: []}
            word_bank: [ارزان, گران]
          - content_key: prs.a1.unit10.lesson01.exercise06.translate_discount
            type: translation
            tested_text: تخفیف
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson01.exercise07.write_qeymat
            type: writing_prompt
            tested_text: قیمت
            prompt: {target_blocks: [{text: "Write the Dari word for price.", language_code: en, direction: ltr}]}

      - content_key: prs.a1.unit10.lesson02.asking_a_price
        title: پرسیدن قیمت
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: prs.a1.unit10.lesson02.teach.qeymatesh_chand
            kind: phrase
            target: {text: "قیمتش چند است؟", language_code: prs, direction: rtl}
            introduced_tokens: [قیمتش, چند, است]
          - content_key: prs.a1.unit10.lesson02.teach.sad_afghani
            kind: phrase
            target: {text: "صد افغانی است.", language_code: prs, direction: rtl}
            introduced_tokens: [صد, افغانی]
        exercises:
          - content_key: prs.a1.unit10.lesson02.exercise01.recognize_price_question
            type: multiple_choice
            tested_text: قیمتش چند است
            prompt: {target_blocks: [{text: "قیمتش چند است؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson02.exercise02.recognize_price_answer
            type: multiple_choice
            tested_text: صد افغانی است
            prompt: {target_blocks: [{text: "صد افغانی است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson02.exercise03.listen_price_question
            type: listen_select
            tested_text: قیمتش چند است
            media_asset_key: prs.a1.audio.shopping.price_question.01
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson02.exercise04.match_price_phrases
            type: matching_pairs
            tested_text: قیمتش چند است صد افغانی است دوکان قیمت ارزان گران تخفیف
            prompt: {target_blocks: []}
            pairs:
              - {left: "قیمتش چند است؟", right: "How much is it?"}
              - {left: "صد افغانی است.", right: "It's one hundred afghanis."}
              - {left: دوکان, right: shop}
              - {left: قیمت, right: price}
              - {left: ارزان, right: cheap}
              - {left: گران, right: expensive}
              - {left: تخفیف, right: discount}
          - content_key: prs.a1.unit10.lesson02.exercise05.order_price_question
            type: word_order
            tested_text: قیمتش چند است
            prompt: {target_blocks: []}
            word_bank: [قیمتش, چند, است]
          - content_key: prs.a1.unit10.lesson02.exercise06.translate_price_question
            type: translation
            tested_text: قیمتش چند است
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson02.exercise07.speak_ask_price
            type: speak_response
            tested_text: قیمتش چند است
            prompt: {target_blocks: [{text: "Ask the shopkeeper how much something costs.", language_code: en, direction: ltr}]}

      - content_key: prs.a1.unit10.lesson03.reading_a_price_label
        title: خواندن برچسب قیمت
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: prs.a1.unit10.lesson03.teach.sib
            kind: vocabulary
            target: {text: سیب, language_code: prs, direction: rtl}
            introduced_tokens: [سیب]
          - content_key: prs.a1.unit10.lesson03.teach.kilo
            kind: vocabulary
            target: {text: کیلو, language_code: prs, direction: rtl}
            introduced_tokens: [کیلو]
          - content_key: prs.a1.unit10.lesson03.teach.label_text
            kind: reading
            target: {text: "سیب: یک کیلو صد افغانی", language_code: prs, direction: rtl}
            introduced_tokens: [یک]
        exercises:
          - content_key: prs.a1.unit10.lesson03.exercise01.recognize_item
            type: multiple_choice
            tested_text: سیب
            prompt: {target_blocks: [{text: "What is being sold on the label?", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit10.lesson03.exercise02.recognize_price_on_label
            type: multiple_choice
            tested_text: صد افغانی
            prompt: {target_blocks: [{text: "What is the price per kilo on the label?", language_code: en, direction: ltr}]}
          - content_key: prs.a1.unit10.lesson03.exercise03.listen_label
            type: listen_select
            tested_text: سیب یک کیلو صد افغانی
            media_asset_key: prs.a1.audio.shopping.price_question.01
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson03.exercise04.match_label_parts
            type: matching_pairs
            tested_text: سیب کیلو صد افغانی دوکان قیمت ارزان گران تخفیف
            prompt: {target_blocks: []}
            pairs:
              - {left: سیب, right: apples}
              - {left: کیلو, right: kilo}
              - {left: "صد افغانی", right: "100 afghanis"}
              - {left: دوکان, right: shop}
              - {left: قیمت, right: price}
              - {left: ارزان, right: cheap}
              - {left: گران, right: expensive}
              - {left: تخفیف, right: discount}
          - content_key: prs.a1.unit10.lesson03.exercise05.order_label
            type: word_order
            tested_text: سیب یک کیلو صد افغانی
            prompt: {target_blocks: []}
            word_bank: [سیب, یک, کیلو, صد, افغانی]
          - content_key: prs.a1.unit10.lesson03.exercise06.translate_label
            type: translation
            tested_text: سیب یک کیلو صد افغانی
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson03.exercise07.write_own_label
            type: writing_prompt
            tested_text: سیب یک کیلو صد افغانی
            prompt: {target_blocks: [{text: "Write a price label: apples, one kilo, one hundred afghanis.", language_code: en, direction: ltr}]}

      - content_key: prs.a1.unit10.lesson04.asking_for_a_quantity
        title: خواستن مقدار
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: prs.a1.unit10.lesson04.teach.yak_kilo_sib
            kind: phrase
            target: {text: "یک کیلو سیب می‌خواهم", language_code: prs, direction: rtl}
            introduced_tokens: [می‌خواهم]
          - content_key: prs.a1.unit10.lesson04.teach.do_kilo
            kind: phrase
            target: {text: "دو کیلو می‌خواهم", language_code: prs, direction: rtl}
            introduced_tokens: [دو]
        exercises:
          - content_key: prs.a1.unit10.lesson04.exercise01.recognize_quantity_request
            type: multiple_choice
            tested_text: یک کیلو سیب می‌خواهم
            prompt: {target_blocks: [{text: "یک کیلو سیب می‌خواهم", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson04.exercise02.recognize_do_word
            type: multiple_choice
            tested_text: دو
            prompt: {target_blocks: [{text: دو, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson04.exercise03.listen_quantity
            type: listen_select
            tested_text: یک کیلو سیب می‌خواهم
            media_asset_key: prs.a1.audio.shopping.quantity.01
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson04.exercise04.match_quantity_phrases
            type: matching_pairs
            tested_text: یک کیلو سیب می‌خواهم دو کیلو می‌خواهم سیب کیلو صد افغانی دوکان قیمت
            prompt: {target_blocks: []}
            pairs:
              - {left: "یک کیلو سیب می‌خواهم", right: "I'd like a kilo of apples."}
              - {left: "دو کیلو می‌خواهم", right: "I'd like two kilos."}
              - {left: سیب, right: apples}
              - {left: کیلو, right: kilo}
              - {left: "صد افغانی", right: "100 afghanis"}
              - {left: دوکان, right: shop}
              - {left: قیمت, right: price}
          - content_key: prs.a1.unit10.lesson04.exercise05.order_do_kilo
            type: word_order
            tested_text: دو کیلو می‌خواهم
            prompt: {target_blocks: []}
            word_bank: [دو, کیلو, می‌خواهم]
          - content_key: prs.a1.unit10.lesson04.exercise06.translate_quantity
            type: translation
            tested_text: دو کیلو می‌خواهم
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson04.exercise07.speak_ask_quantity
            type: speak_response
            tested_text: دو کیلو می‌خواهم
            prompt: {target_blocks: [{text: "Tell the shopkeeper you'd like two kilos.", language_code: en, direction: ltr}]}

      - content_key: prs.a1.unit10.lesson05.bargaining_for_a_discount
        title: چانه‌زدن برای تخفیف
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: prs.a1.unit10.lesson05.teach.takhfif_mitanin
            kind: phrase
            target: {text: "تخفیف می‌تانین بتین؟", language_code: prs, direction: rtl}
            introduced_tokens: [می‌تانین, بتین]
          - content_key: prs.a1.unit10.lesson05.teach.baraye_shoma
            kind: phrase
            target: {text: "برای شما صد و هشتاد افغانی می‌شه", language_code: prs, direction: rtl}
            introduced_tokens: [برای, شما, هشتاد, می‌شه]
        exercises:
          - content_key: prs.a1.unit10.lesson05.exercise01.recognize_discount_request
            type: multiple_choice
            tested_text: تخفیف می‌تانین بتین
            prompt: {target_blocks: [{text: "تخفیف می‌تانین بتین؟", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson05.exercise02.recognize_discounted_price
            type: multiple_choice
            tested_text: صد و هشتاد افغانی
            prompt: {target_blocks: [{text: "صد و هشتاد افغانی", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit10.lesson05.exercise03.listen_discount_request
            type: listen_select
            tested_text: تخفیف می‌تانین بتین
            media_asset_key: prs.a1.audio.shopping.discount_request.01
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson05.exercise04.match_discount_phrases
            type: matching_pairs
            tested_text: تخفیف می‌تانین بتین برای شما هشتاد یک کیلو سیب می‌خواهم دو کیلو می‌خواهم سیب کیلو
            prompt: {target_blocks: []}
            pairs:
              - {left: "تخفیف می‌تانین بتین؟", right: "Can you give a discount?"}
              - {left: "برای شما صد و هشتاد افغانی می‌شه", right: "For you it comes to 180 afghanis."}
              - {left: "یک کیلو سیب می‌خواهم", right: "I'd like a kilo of apples."}
              - {left: "دو کیلو می‌خواهم", right: "I'd like two kilos."}
              - {left: سیب, right: apples}
              - {left: کیلو, right: kilo}
          - content_key: prs.a1.unit10.lesson05.exercise05.order_discount_request
            type: word_order
            tested_text: تخفیف می‌تانین بتین
            prompt: {target_blocks: []}
            word_bank: [تخفیف, می‌تانین, بتین]
          - content_key: prs.a1.unit10.lesson05.exercise06.translate_discount_request
            type: translation
            tested_text: تخفیف می‌تانین بتین
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson05.exercise07.speak_ask_discount
            type: speak_response
            tested_text: تخفیف می‌تانین بتین
            prompt: {target_blocks: [{text: "Politely ask the shopkeeper for a discount.", language_code: en, direction: ltr}]}

      - content_key: prs.a1.unit10.lesson06.market_dialogue
        title: گفت‌وگو در بازار
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: prs.a1.unit10.lesson06.teach.befarmayin
            kind: vocabulary
            target: {text: بفرمایین, language_code: prs, direction: rtl}
            introduced_tokens: [بفرمایین]
          - content_key: prs.a1.unit10.lesson06.teach.turn01
            kind: dialogue
            target: {text: "سلام، بفرمایین.", language_code: prs, direction: rtl, speaker: دوکاندار}
            introduced_tokens: [سلام, دوکاندار]
          - content_key: prs.a1.unit10.lesson06.teach.turn02
            kind: dialogue
            target: {text: "سلام. سیب‌ها قیمتش چند است؟", language_code: prs, direction: rtl, speaker: مشتری}
            introduced_tokens: [سیب‌ها, مشتری]
          - content_key: prs.a1.unit10.lesson06.teach.turn03
            kind: dialogue
            target: {text: "یک کیلو صد افغانی است.", language_code: prs, direction: rtl, speaker: دوکاندار}
            introduced_tokens: []
          - content_key: prs.a1.unit10.lesson06.teach.turn04
            kind: dialogue
            target: {text: "دو کیلو می‌خواهم. تخفیف می‌تانین بتین؟", language_code: prs, direction: rtl, speaker: مشتری}
            introduced_tokens: []
          - content_key: prs.a1.unit10.lesson06.teach.turn05
            kind: dialogue
            target: {text: "بلی، برای شما دو کیلو صد و هشتاد افغانی می‌شه.", language_code: prs, direction: rtl, speaker: دوکاندار}
            introduced_tokens: [بلی]
          - content_key: prs.a1.unit10.lesson06.teach.turn06
            kind: dialogue
            target: {text: "بسیار خوب، تشکر.", language_code: prs, direction: rtl, speaker: مشتری}
            introduced_tokens: [بسیار, خوب, تشکر]
        exercises:
          - content_key: prs.a1.unit10.lesson06.exercise01.listen_context
            type: dialogue_comprehension
            tested_text: مشتری دوکاندار سیب کیلو افغانی تخفیف
            media_asset_key: prs.a1.audio.dialogue.market_shopping.01
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit10.lesson06.exercise02.recognize_item_bought
            type: multiple_choice
            tested_text: سیب
            prompt:
              target_blocks:
                - {text: "What is the customer buying?", language_code: en, direction: ltr}
          - content_key: prs.a1.unit10.lesson06.exercise03.match_dialogue_facts
            type: matching_pairs
            tested_text: کیلو قیمت صد افغانی دو کیلو صد و هشتاد دوکان ارزان گران تخفیف سیب
            prompt: {target_blocks: []}
            pairs:
              - {left: "قیمت هر کیلو", right: "صد افغانی"}
              - {left: "قیمت با تخفیف برای دو کیلو", right: "صد و هشتاد افغانی"}
              - {left: دوکان, right: shop}
              - {left: ارزان, right: cheap}
              - {left: گران, right: expensive}
              - {left: تخفیف, right: discount}
              - {left: سیب, right: apples}
          - content_key: prs.a1.unit10.lesson06.exercise04.order_final_agreement
            type: word_order
            tested_text: بسیار خوب تشکر
            prompt: {target_blocks: []}
            word_bank: [بسیار, خوب, تشکر]
