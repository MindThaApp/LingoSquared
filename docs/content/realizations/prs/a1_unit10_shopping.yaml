review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered outcome (prerequisites: numbers already covered in unit04, greetings in unit01). Numbered unit10 to avoid a real collision with a separate concurrent session's own in-flight a1_unit09_dates.yaml, discovered still uncommitted at the time of authoring. Six lessons: shop and price vocabulary, asking a price politely, reading a price label, asking for a quantity, bargaining for a discount, and a full market dialogue. Uses افغانی as the currency (matching unit08's established convention), دوکان/دوکاندار for shop/shopkeeper (the genuine Afghan Dari terms, as distinct from Iranian Farsi's مغازه/فروشنده), and استم/استین verb endings consistently. Authored independently of the fa realization per the sibling-isolation rule. Proactively checked against AUTHORING_GUIDE §11-13 during authoring, including cross-checking the unit's price/discount arithmetic. Audio remains pending generation. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, discovered this unit was missed by the earlier project-wide audit -- it was authored but never actually reviewed): found 6 exercises (lesson01.exercise03, lesson02.exercise03, lesson03.exercise03, lesson04.exercise03, lesson05.exercise03, lesson06.exercise05) were listen_select/listen_type items -- genuinely unanswerable since prs has zero working TTS/recorded audio. Converted: listen_select -> multiple_choice (visible Dari prompt, English glosses), listen_type -> translation. MATCHING_PAIRS SCALE (§16) CHECK: all 6 matching_pairs exercises (6/7/8/7/6/7 pairs) already reasonably sized -- no changes needed. Re-verified 0 remaining §14 violations, validate+compile both clean. STILL NEEDS the standing fresh-context review before status can move to reviewed -- dispatching now. FRESH-CONTEXT REVIEW completed 2026-07-06 (zero prior context on this content): re-verified spine-outcome discipline (every lesson, including the bargaining lesson, genuinely serves universal.a1.shopping.ask_prices_quantities), recognition->drag->production pacing across all 6 lessons, content_key parity (22 teaching + 43 exercise keys, exact match both directions), script purity (zero Arabic-range kaf/yeh), no jargon leaks, §11 price/discount arithmetic (100 afghanis/kilo, 180 afghanis discounted total for 2 kilos, consistent everywhere it's referenced), and every exercise's tested_text plus every overlay accepted_answers/pairs/word_bank value checked programmatically against cumulative introduced_tokens via a Python script -- found and fixed real issues the prior retrofit missed: (1) lesson06.exercise01 was a genuine §14 violation the 2026-07-06 retrofit didn't catch because its type was dialogue_comprehension, not listen_select/listen_type -- it had empty target_blocks and only a pending-generation media_asset_key, so the compiled exercise had literally zero audio AND zero visible prompt text; fixed by adding the lesson's own six-turn dialogue as visible target_blocks and converting the type to multiple_choice, with the instruction reworded from 'Listen to' to 'Read the conversation'; (2) lesson06.exercise03's matching_pairs used two never-taught words (هر 'each/per', با 'with') in its Dari pair labels, and its overlay accepted_answers keyed on completely different English text ('Price per kilo'/'Discounted price for two kilos') than the realization's actual pairs.left values -- a real grading-mismatch that would have made the exercise ungradeable regardless of the learner's answer -- fixed by changing both files' pair labels to the already-taught یک کیلو/دو کیلو; (3) the coined imperative بتین ('give') had no attestable basis after a web search came back inconclusive, so it was replaced project-wide in this unit with بدهین, a safely-derived form following the same well-established -ید->-ین Dari suffix pattern already used for استین/می‌تانین; (4) lesson06.exercise06 and exercise08's multi-clause accepted_answers had period-joined and و-joined forms but were missing the comma-joined variant §12 requires -- added. Confirmed می‌شه in برای شما ... می‌شه is the same already-verified (unit08) 'stating a total' idiom, not the banned Iranian-colloquial polite-request pattern (which correctly uses می‌تانین here instead). validate and compile both run clean (0 errors/0 warnings) after all fixes, and compile produces valid JSON. POST-SHIP CORPUS-WIDE FIX, 2026-07-07: a project-wide sweep (prompted by unit13's fresh-context reviewer flagging the same bug in units 11/12) found this file also had exercises where realization prompt.target_blocks duplicated the overlay's own instruction text verbatim in English -- the compiler would have rendered the same sentence twice to the learner. Fixed mechanically: every affected exercise's prompt set to target_blocks: []. Re-verified validate+compile clean (0 errors/0 warnings) and confirmed zero remaining instruction-duplicate target_blocks via a script comparing every exercise's target_blocks against its overlay instruction.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added a real example sentence to all 9 kind:vocabulary teaching cards, each a natural, comprehensible-from-gloss sentence using the card's own word. schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    Review 2026-10-20 (en-prs A1 pass): 2 fixes - realization: price-label exercises lesson03 ex01/02 now show the label text they ask about; overlay: added accepted variants for label translate/write (colon and comma forms), من on quantity requests, full-sentence forms for total and purchase summary. NATIVE FLAGS: سیب‌ها قیمتش چند است؟ word order; می‌شه (contracted) next to full forms in this unit."
course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy.
    Uses دوکان (shop) and دوکاندار (shopkeeper) -- the genuine Afghan
    Dari terms for a small local shop, as distinct from Iranian Farsi's
    مغازه/فروشنده -- and افغانی as the currency, matching unit08's
    established convention. می‌توانین (you can) is used for polite
    requests, consistent with the Afghan register already established.

