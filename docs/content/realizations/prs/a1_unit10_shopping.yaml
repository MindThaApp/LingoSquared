  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain), modernized"
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: claude
  notes: "New unit, prs's next uncovered outcome (prerequisites: numbers already covered in unit04, greetings in unit01). Numbered unit10 to avoid a real collision with a separate concurrent session's own in-flight a1_unit09_dates.yaml, discovered still uncommitted at the time of authoring. Six lessons: shop and price vocabulary, asking a price politely, reading a price label, asking for a quantity, bargaining for a discount, and a full market dialogue. Uses افغانی as the currency (matching unit08's established convention), دوکان/دوکاندار for shop/shopkeeper (the genuine Afghan Dari terms, as distinct from Iranian Farsi's مغازه/فروشنده), and استم/استین verb endings consistently. Authored independently of the fa realization per the sibling-isolation rule. Proactively checked against AUTHORING_GUIDE §11-13 during authoring, including cross-checking the unit's price/discount arithmetic. Audio remains pending generation."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy.
    Uses دوکان (shop) and دوکاندار (shopkeeper) -- the genuine Afghan
    Dari terms for a small local shop, as distinct from Iranian Farsi's
    مغازه/فروشنده -- and افغانی as the currency, matching unit08's
    established convention. می‌تانین (you can) is used for polite
    requests, consistent with the Afghan register already established.

