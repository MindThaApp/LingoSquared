n the scenario; L05 reading (message about an office found closed) plus a transcript-shown listening item; L06 dialogue plus mixed and culminating production. Spine: reading note about a late arrival, listening (dialogue_comprehension with the full transcript in the prompt, because prs has no TTS), speaking and writing as typed production (dialogue_response, writing_prompt), culminating writing_prompt that requires one earlier event and one reference point. Characters: the established pair زرمینه/همایون was NOT reused (their profiles: همایون works in an office on weekdays; زرمینه goes to the market with friends at weekends, likes movies and cooks, per a2_unit17/a2_unit19); this unit uses two one-off friends نعمت and شکیبا (both unused anywhere in docs/content/realizations/prs and overlays/en-prs at authoring time), informal تو register. Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = yesterday Naimat went to the bus station for the Mazar bus, the bus left at eight, he arrived at nine, so he did not go and went back home; dialogue 2 = last week Shakiba had lost her passport and did not find it until ten, when she reached the airport the plane had left, she went home and phoned; the L05 message is from a third person and is a separate account (passport office closed at four, staff had left, car had broken down). No trains (Afghanistan has almost none): bus and plane only. Binding rulings applied: no progressive, no present perfect, no future (no خواهم), no modal, no object clitic except آن را (in dialogue 2). Register: formal written Kabul Dari (copula است/استند, 2pl -ین), Afghan lexicon (طیاره، میدان هوایی، موتر، بس، تیلفون). No listen_type, dictation or audio-only item. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Is نیامده (not نایامده) the right spelling and form of the negative participle of آمدن, and is نیامده بود natural? (2) After قبل از اینکه is the subjunctive (قبل از اینکه من برسم) the natural form for a past story, or would a native prefer another construction? (3) Is دفتر پاسپورت a natural name for the passport office, and is بسته شده بود natural for an office that had closed for the day? (4) Is چه شد؟ the natural way to ask what happened on arrival, and چه بد! the natural sympathy reaction? (5) Is تیلفون کردن natural for making a phone call, and is بس ساعت چند حرکت کرد؟ natural for what time did the bus leave? (6) Is تا ساعت ده آن را پیدا نکردم natural for I did not find it until ten? (7) Does the Dari past perfect with از قبل and قبلاً sound natural together with وقتی, and is the order وقتی رسیدم، بس رفته بود preferred over the reverse? (8) Is کارمندان in کارمندان رفته بودند natural, or would a native say کارمندها? (9) Is the written form of the two-word participle in گم کرده بودم and خراب شده بود correct as two separate words (رفته بودم written with a space, not joined)?'
