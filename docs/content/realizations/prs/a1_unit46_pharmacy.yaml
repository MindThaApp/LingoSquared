generation_provenance:
  method: adapted_from_public_domain
  authoring_system: claude
  source_material: "Firecrawl credits are exhausted this session, so real, direct WebFetch access plus local pdftotext extraction was used instead, per this task's own instructions. WebFetch on the DLI Dari course's own top-level index confirmed the site organizes into Semester 1/2/3 book directories (same site prior units this corpus have used). Downloaded and pdftotext-extracted all four remaining not-yet-checked Semester 1 student volumes this task hadn't personally verified (s25-28.pdf, s29-32.pdf, s33-36.pdf, s37-40.pdf) plus re-confirmed Semester 2's Student Units 1-20 combined file (same RTL glyph-isolation extraction problem noted by unit45's own provenance note -- re-checked, still unreliable for keyword search, not re-used). A plain-English keyword grep (pharmacy/medicine/medication/prescription/drugstore) across all four newly-downloaded volumes found a genuine, on-topic, cleanly-extractable hit: s33-36.pdf's own Table of Contents lists 'Lesson 34: At the Pharmacy' verbatim, and the lesson's real content (pages 19-31 of that volume) extracted as connected, readable Dari text, not glyph-isolated. This IS genuine 2005 DLIFLC source material: a full lesson built around 'Suraya asks the pharmacist for help' after cutting her hand, with a real دوا ساز (pharmacist) / customer exchange, a lesson-vocabulary list (سردردی/درد سر headache, دندان دردی toothache, شکم دردی/دل دردی stomachache, پلستر Band-Aid, دواﯼ مسکن pain reliever, تابلیت/قرص/گولی pill or tablet, شربت syrup, مرهم ointment, دوا ساز pharmacist, [دوا خانه]=داروخانه pharmacy, نسخه prescription, درد داشتن/درد کردن to hurt), and a second short exchange ('Ashraf is at the pharmacy') using the exact dosage-instruction pattern 'روز سه دانه بگیرین' (take three a day) this unit's own dialogue and reading passage directly reuse. Used as a genuine adaptation scaffold per AUTHORING_GUIDE.md #10, not imported verbatim: the source lesson's own stated grammar targets are B1/B2-level (comparative adverbs, past-conditional/contrary-to-fact clauses, transitive compound verbs requiring را) and its two model exchanges use heavily CONTRACTED spoken forms (میتانین/خوده/بریدیم/داره/میشه/میکنه/میتم/بری تان) that don't match this course's own established استم/استین polite-first, full-uncontracted register (units 01-45) -- all of that grammar and every contracted verb form was stripped out for this A1 unit, which uses only simple present-tense statements, one basic yes/no question, and the course's own already-established polite imperative -ین family (matching کنین/بنوشین from unit17, بگویین from unit02/07) for the dosage instruction, converting the source's contracted بگیرین is actually already the uncontracted/formal form in the source too (survives unchanged) -- confirmed by checking the source's own vocabulary-list entry for 'to give an injection'/'to take' patterns, which use the same -ین ending outside the two contracted dialogue models. Directly and independently confirmed from source, then reused: دوا خانه (written this course's established single-word compound style as دواخانه, parallel to this course's own precedent کتابخانه 'book-house' = library, unit43, the same -خانه 'house' suffix pattern), دوا ساز (pharmacist, written دواساز as a single token, matching the same compounding convention), قرص (tablet/pill -- chosen over the source's other two listed synonyms تابلیت/گولی as the plainer, non-loanword everyday option), شربت (syrup), نسخه (prescription), and the dosage phrase 'روز سه دانه بگیرین' (take three a day) almost verbatim from the source's own second exchange, with only its contracted 'میتم' (I'll give you) removed since this unit's dialogue doesn't need that particular line. دانه (piece/dose counter) is genuinely present in the source's own dosage phrase ('روز سه دانه') and reused directly, not invented. دندان‌درد (toothache) is a course-internal compound built from this course's own already-taught دندان (unit42) plus the compounding pattern this course already established with سردرد/دل‌درد (unit17) -- not sourced from the DLI vocabulary list's own دندان دردی (formal register with the ی suffix), a deliberate simplification to stay consistent with unit17's own established compound shape rather than introducing a second, differently-formed toothache word. Independently confirmed NOT reused from source (a deliberate simplification, not an oversight): the source's comparative-adverb sentence about pharmacy pricing, the past-conditional 'if I hadn't taken my medication' sentences, the allergy vocabulary (حساسیت), and both of the source's own model dialogues' exact wording -- all replaced with fresh A1-level sentences built from this unit's own new words plus already-taught review vocabulary."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: "2026-07-10 fresh-context review (Claude) found and fixed ONE real bug (in the paired overlay's English translations, not this file's Dari). Lesson05's reading passage \"این نسخه از همایون است\" uses از predicatively with است, a standard Dari possessive construction (\"this is Homayoun's prescription\") -- the Dari itself is correct and was left unchanged. Added a clarifying note to this file's own review_this_is_from grammar-note overlay entry explaining the possessive-predicate usage, since از literally glosses as \"from\" but is used here to mean \"belongs to,\" the same pattern as \"Whose is this? -- It's from me\" meaning \"It's mine.\" See the paired overlay's review notes for the English-translation fix. Also checked and confirmed clean: compiler validation, matching_pairs pair counts, exercise-type registration, and absence of audio-dependent exercises. [Correction 2026-07-23: this note previously closed with a parenthetical about a '100-afghani combined-service price in lesson04/05 vs. the separately-stated 60+30 individual prices in lesson06's wrap-up' being a deliberate, not-a-bug framing -- that content is misattributed to this file (a1_unit46 is the pharmacy unit and has no such prices; it describes a1_unit47_personal_care.yaml's barbershop unit instead) and has been removed. See a1_unit47_personal_care.yaml's own review notes: that unit's price mismatch was in fact real and has now been fixed there (lesson06 beard-trim price corrected to 40 afghanis so it sums to lesson04/05's established 100-afghani bundle price).]"

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    Dari register (units 01-45). Lessons 01-03's vocabulary/practice
    sentences are simple present-tense statements and yes/no questions
    formed by rising intonation alone. Lesson04's dialogue introduces
    the established Homayoun character opposite a new دواساز (pharmacist)
    role, using the same polite-service register unit08's دکاندار/مشتری,
    unit42's داکتر/منشی, and unit45's کارمند هوتل exchanges already
    established -- not the informal-تو friendship register, and NOT the
    source DLI lesson's own heavily contracted spoken forms
    (میتانین/خوده/بریدیم/داره/میشه/میکنه), which are simplified back to
    this course's uncontracted forms throughout. Lesson05's reading
    passage uses 3rd-person statements with همایون named explicitly
    throughout rather than switching to a pronoun, and lesson06's
    wrap-up uses the same formal شما-تان-suffixed question pattern
    unit39-45 already established.

