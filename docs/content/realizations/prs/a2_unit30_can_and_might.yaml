review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block C unit C2), realizing universal.a2.modality.state_ability_and_possibility. Grammar target: the modal می‌توانم + subjunctive with the full paradigm (می‌توانم/می‌توانی/می‌تواند/می‌توانیم/می‌توانین/می‌توانند, each with the matching subjunctive: بروم/بروی/برود/برویم/بروین/بروند), the negative نمی‌توانم ... (ن on the modal only), ممکن است + subjunctive, شاید + subjunctive (negatives نیاید/نیایند), the chain شاید بتوانم بیایم / شاید نتوانم بیایم, and availability (فردا می‌توانم بیایم, امشب نمی‌توانم بیایم, آزاد استم / مشغول استم, چون ..., ولی ...). Eleven real grammar_note cards in the arc: the modal, subjunctive formation (ب + present stem + ending), two-word verbs without ب, the full paradigm, two-word agreement (کنم ... کنند), the negative, time word + modal, replies with چون/ولی, ممکن است + subjunctive, شاید + subjunctive, شاید بتوانم. The subjunctive is re-taught in this unit (the unit is validated without the other new Block B/C/D units). Lesson arc: L01 skills and the 1sg modal (swim, paint, letter, Dari; formation; no ب in two-word verbs); L02 full paradigm, agreement, negative, questions; L03 free or busy, time word + modal, replies; L04 ممکن است / شاید and شاید بتوانم; L05 a written message plus dialogue 1 (transcript shown in the prompt, no TTS); L06 dialogue 2 plus mixed and culminating typed production. Characters: dialogue 1 = وحیده and سخی (friends, تو register), dialogue 2 = حمید and پلوشه (friends, تو register); the reading message is from a third writer (no name). All unused elsewhere in realizations/prs and overlays/en-prs at authoring time (checked by grep). Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = Leylma asks Sakhi to come tomorrow; Sakhi has work at the office in the morning and is free after five; her computer is broken; Sakhi says maybe he can fix it, the problem might be small. Dialogue 2 = Hamid asks Palwasha about the park on Friday; Palwasha says maybe, it might rain; Hamid can cook, Palwasha can make tea; if it rains they cannot stay in the park, so maybe they will eat at Hamid''s house (خانهٔ من, said by Hamid). The reading message is a separate account: the writer cannot come tomorrow (work in the morning), is free after five but might arrive late, maybe can come on Thursday. Binding Q3 rulings applied: Kabuli Dari, copula است/استم/استی, 2pl -ین everywhere (-ید only as extra accepted answers), full modal with ZWNJ (never می‌تانم), no progressive, no perfect, no future (no خواهم; the future is a time word), no object clitics (آن را only), no ازش/باهاش/بهت/برات, بلی/نخیر, تیلفون not used. No listen_type, dictation or audio-only item. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Is the subjunctive (not the indicative) after شاید and ممکن است the natural form in Kabul speech, e.g. شاید بیاید / ممکن است باران ببارد? (2) Is شاید بتوانم / شاید نتوانم بیایم natural for maybe I can / maybe I cannot, and is ممکن است بتواند بیاید natural? (3) Is نمی‌توانم بدون دومین فعل (answer صبح نمی‌توانم) natural in a short reply, as in dialogue 1? (4) Is مشغول استم the right everyday word for I am busy (versus کار دارم / مصروف استم), and is آزاد استم natural for I am free? (5) Is بعد از ساعت پنج (versus بعد از ساعت پنج بجه) the natural way to say after five o''clock? (6) Is فردا می‌توانم بیایم with a time word before the modal natural, and is می‌توانم فردا بیایم equally natural? (7) Is the 2pl subjunctive form بیایین / بروین / کنین / بمانیم the right written form, and is 2pl رانندگی کنین natural? (8) Is the reply بلی, می‌توانم (without repeating the second verb) natural? (9) Is the dialogue-2 sentence اگر باران ببارد، نمی‌توانیم در پارک بمانیم natural, and is پس شاید در خانهٔ من غذا بخوریم natural? (10) Is درست کردن natural for to fix a computer and for to make tea (چای درست کردن), or should the course use جور کردن / دم کردن? (11) Is ببارد the right subjunctive of باریدن, and is باران می‌بارد natural for it is raining? (12) Is نیستم in مطمئن نیستم and is استی in تو آزاد استی؟ natural?'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین (می‌توانین، بروین، کنین), no Tehrani colloquialisms. Friend dialogues use the informal تو-register. The modal is always the full form می‌توانم/می‌توانی/می‌تواند/می‌توانیم/می‌توانین/می‌توانند (negative نمی‌توانم ...), followed by the subjunctive; contracted spoken forms are not taught. Future meaning comes from a time word (فردا می‌توانم بیایم); no خواهم.'
