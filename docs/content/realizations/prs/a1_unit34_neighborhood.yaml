schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: prs
cefr_level: A1
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: codex
  source_material: "Adapted in the same Peace Corps Dari-course lane as the preceding prs A1 units: neighborhood/location exchange, nearby-place description, and neighbor-description functions were modernized into current Kabul Dari beginner content rather than copied verbatim. A live search during authoring did not surface a clean lesson-level Peace Corps Dari neighborhood page beyond the already-known combined-course listings, so the unit uses the public-domain course as a scenario scaffold only and follows established prs course conventions for dialect and register."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New en-prs A1 unit after unit33. Exact parsed diff of every spine_outcome_id used in docs/content/realizations/prs/a1_unit*.yaml against every id in docs/content/universal_spine.yaml found universal.a1.neighborhood.describe_neighborhood as the next unrealized A1 outcome. This unit keeps to that outcome: describing a neighborhood, a nearby place, and a neighbor. It re-declares review vocabulary in-file before use because the compiler's taught-vocabulary check is per-file. It uses او for he/she and never Pashto هغه/هغوی. Dialogue turns use structured speaker fields only. No listen_type/listen_select/listen_order items are authored for prs. Matching-pairs exercises use seven pairs. Every vocabulary card has an example sentence for schema_version 1.1."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established polite-first, full-uncontracted Dari register.
    The Farid/Laila dialogue uses informal تو/-ی forms between two neighbors,
    matching recent A1 dialogue precedent. Vocabulary prefers Afghan Dari
    forms where relevant: مکتب for school and دوکان for shop/store.

media_assets:
  - content_key: prs.a1.unit34.audio.neighborhood.vocab.01
    language: prs
    text: "محله، همسایه، نزدیک، دور، سرک، دوکان، مکتب"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: prs.a1.unit34.audio.dialogue.neighborhood.01
    language: prs
    text: "فرید: لیلا، خانه تو در کدام محله است؟ لیلا: خانه من در کارته نو است. فرید: دوکان نزدیک خانه تو است؟ لیلا: بلی، دوکان نزدیک است و مکتب دور نیست. فرید: همسایه تو چطور است؟ لیلا: همسایه ما بسیار خوب است."
    voice_hint: two_adults_neutral_informal
    status: pending_generation

