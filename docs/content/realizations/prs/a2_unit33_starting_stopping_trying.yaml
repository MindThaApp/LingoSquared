review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block C unit C5), realizing universal.a2.habits.describe_starting_stopping_trying. Grammar target: شروع کردن in three patterns (the thing + را: ورزش را شروع کردم; به + infinitive: به دویدن شروع کردم, with the other order شروع کردم به دویدن mentioned; که + subjunctive: شروع کردم که بدوم), ترک کردن with a habit + را (شیرینی خوردن را ترک کردم), دیگر + negative present (دیگر شیرینی نمی‌خورم), کوشش کردن که + subjunctive (کوشش می‌کنم که زود بخوابم), فراموش کردن که + subjunctive and فراموش نکردم که. The subjunctive is re-taught in this unit (ب + present stem + -م/-ی/-د/-یم/-ین/-ند, no ب on two-word verbs, ن instead of ب in the negative) because the other new units are written in parallel. Ten real grammar_note cards (start + را, start with به + infinitive, subjunctive formation, start and try with که, negative subjunctive, giving up a habit with ترک کردن, دیگر + negative, forgetting with که, forgetting negative, and a four-verbs summary). Lesson arc: L01 start with را and with به + infinitive (gym, running, half an hour, habit); L02 the subjunctive and start/try with که; L03 stopping (ترک کردن, دیگر, screen time); L04 forgetting (فراموش کردن که) and the four-verb summary; L05 reading (message about new habits) plus a transcript-shown listening item; L06 dialogue plus mixed and culminating production (start, give up, try). Spine: reading note, listening (dialogue_comprehension with the full transcript in the prompt because prs has no TTS), speaking and writing as typed production (dialogue_response, writing_prompt); the culminating writing_prompt needs one start, one give-up and one try sentence. Characters: یاسین and نجیبه (dialogues) and خالده (reading writer) are one-off names (خالده checked unused in docs/content/realizations/prs and overlays/en-prs; نجیبه also appears in a2_unit39, a different speaker); the established pairs from other units were not reused; informal تو register. Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = Yasin started exercising a month ago and runs in the gym for half an hour every morning, gave up eating sweets and no longer eats them, and tries to watch fewer videos at night; the L05 message is from a third person (Khalida) and is a separate account (started reading books two weeks ago, half an hour every night, gave up watching videos, tries to go to bed early, forgot to phone Najiba yesterday); dialogue 2 = Najiba did not come to the gym yesterday because she forgot to go to bed early and woke up late, she comes today at six and tries to go to bed early every night. Binding rulings applied: plain present first (no progressive), no present perfect, no future tense, modal not used, no object clitics (none needed), 2pl -ین (paradigm only), بهتر/ممکن not needed. Register: formal written Kabul Dari (copula است, Afghan lexicon: تیلفون، باشگاه). No listen_type, dictation or audio-only item. matching_pairs lefts are distinct in meaning. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER: (1) Which order of شروع کردن with به is natural in Kabul: به دویدن شروع کردم (taught first) or شروع کردم به دویدن (mentioned, accepted)? Recommended: keep both. (2) Is شروع کردم که بدوم natural for I started running, or does it sound more like I set about to run? Recommended: keep as an accepted second pattern. (3) Is کوشش کردن the natural verb for to try beside سعی کردن (accepted as an extra answer only)? Recommended: keep کوشش taught, accept سعی. (4) Is شیرینی خوردن را ترک کردم (ترک کردن with an infinitive phrase + را) natural, or would a native prefer another construction such as بس کردم or از شیرینی خوردن گذشتم? Recommended: keep. (5) Is دیگر شیرینی نمی‌خورم natural for I no longer eat sweets, and is the past form از آن روز دیگر شیرینی نخوردم (mentioned in one note only) natural? Recommended: keep. (6) Is فراموش کردم که تیلفون کنم natural for I forgot to phone, and فراموش نکردم که ... for I did not forget to? Is یادم رفت / از یادم رفت preferred in speech? Recommended: keep فراموش کردم که taught per the plan; do not add یادم رفت. (7) Is باشگاه the right word for a gym in Kabul, and is دویدن / می‌دوم natural for running in a gym? Recommended: keep. (8) Is ساعت‌ها (for hours) with ویدیو دیدن natural for screen time, and is نیم ساعت right for half an hour? Recommended: keep. (9) Is امروز می‌آیی؟ / امروز ساعت شش می‌آیم natural for a near-future plan with the plain present? Recommended: keep. (10) Is the sentence ending with the signature خالده acceptable in a short message, and is به تو تیلفون کنم natural (vs تیلفون کنم / به تو تیلفون بزنم)? Recommended: keep تیلفون کردن as the course standard.'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین, no Tehrani colloquialisms. Friend dialogues between یاسین and نجیبه use the informal تو-register. Patterns taught: شروع کردن (the thing + را, or به + infinitive, or که + subjunctive), ترک کردن (the habit + را) and دیگر + negative present, کوشش کردن که + subjunctive, فراموش کردن که + subjunctive; the subjunctive is ب + present stem + ending (two-word verbs have no ب), negative ن.'
