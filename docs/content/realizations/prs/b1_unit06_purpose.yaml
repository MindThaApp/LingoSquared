units:
  - content_key: prs.b1.unit06.purpose
    title: هدف
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.purpose.express_purpose_and_goals
    planned_lesson_count: 6

    lessons:
      - content_key: prs.b1.unit06.lesson01.present_purpose_1st2nd
        title: تا یاد بگیرم
        spine_outcome_id: universal.b1.purpose.express_purpose_and_goals
        teaching:
          - content_key: prs.b1.unit06.lesson01.teach.ta
            kind: vocabulary
            target: {text: تا, language_code: prs, direction: rtl}
            introduced_tokens: [تا]
            example: {text: "به مکتب می‌روم تا انگلیسی یاد بگیرم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.yad_begiram
            kind: vocabulary
            target: {text: یاد بگیرم, language_code: prs, direction: rtl}
            introduced_tokens: [یاد, بگیرم]
            example: {text: "به مکتب می‌روم تا انگلیسی یاد بگیرم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.maktab
            kind: vocabulary
            target: {text: مکتب, language_code: prs, direction: rtl}
            introduced_tokens: [مکتب]
            example: {text: "به مکتب می‌روم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.english
            kind: vocabulary
            target: {text: انگلیسی, language_code: prs, direction: rtl}
            introduced_tokens: [انگلیسی]
            example: {text: "انگلیسی یاد می‌گیرم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.grammar_ta
            kind: grammar_note
            target: {text: "تا + subjunctive states the PURPOSE or GOAL behind an action: به مکتب می‌روم تا انگلیسی یاد بگیرم = I go to school in order to learn English. The first clause is the action, تا introduces the goal.", language_code: prs, direction: rtl}
            introduced_tokens: []
          - content_key: prs.b1.unit06.lesson01.teach.jam_koni
            kind: vocabulary
            target: {text: جمع کنی, language_code: prs, direction: rtl}
            introduced_tokens: [جمع, کنی]
            example: {text: "کار می‌کنی تا پول جمع کنی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.pool
            kind: vocabulary
            target: {text: پول, language_code: prs, direction: rtl}
            introduced_tokens: [پول]
            example: {text: "پول جمع می‌کنم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.review_kar_mikoni
            kind: vocabulary
            target: {text: کار می‌کنی, language_code: prs, direction: rtl}
            introduced_tokens: [کار, می‌کنی]
            example: {text: "کار می‌کنی تا پول جمع کنی؟", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.review_ba
            kind: vocabulary
            target: {text: به, language_code: prs, direction: rtl}
            introduced_tokens: [به]
            example: {text: "به مکتب می‌روم.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson01.teach.review_miravam
            kind: vocabulary
            target: {text: می‌روم, language_code: prs, direction: rtl}
            introduced_tokens: [می‌روم]
            example: {text: "به مکتب می‌روم.", language_code: prs, direction: rtl}
        exercises:
          - content_key: prs.b1.unit06.lesson01.exercise01.recognize_ta
            type: multiple_choice
            tested_text: تا
            prompt: {target_blocks: [{text: تا, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit06.lesson01.exercise02.recognize_yad_begiram
            type: multiple_choice
            tested_text: یاد بگیرم
            prompt: {target_blocks: [{text: یاد بگیرم, language_code: prs, direction: rtl}]}
          - content_key: prs.b1.unit06.lesson01.exercise03.order_maktab_yad_begiram
