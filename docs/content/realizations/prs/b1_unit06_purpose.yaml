            target: {text: زرمینه, language_code: prs, direction: rtl}
            introduced_tokens: [زرمینه]
            example: {text: "زرمینه به مکتب می‌رود تا انگلیسی یاد بگیرد.", language_code: prs, direction: rtl}
          - content_key: prs.b1.unit06.lesson02.teach.review_miravad
