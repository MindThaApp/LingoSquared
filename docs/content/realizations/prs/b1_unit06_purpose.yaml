            target: {text: "یاد بگیرم، بگیری، بگیرد، بگیریم، بگیرید، بگیرند -- and جمع کنم، کنی، کند، کنیم، کنید، کنند -- follow the same م/ی/د/یم/ید/ند subjunctive endings. The تا-clause's verb agrees with the SAME subject as the main clause (unlike اگر/وقتی که, which can have different subjects).", language_code: prs, direction: rtl}
