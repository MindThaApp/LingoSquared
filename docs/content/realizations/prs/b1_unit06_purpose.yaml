generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    prs's sixth B1 unit, fourth and final of four authored in this pass
    to close the real depth gap between en-prs's 61-unit A1 course and
    its previously-2-unit B1 course (2 -> 6 units). Uses a NEW spine
    outcome, universal.b1.purpose.express_purpose_and_goals, added under
    the standing delegated spine-authority precedent set by
    b1_unit01-05 (prerequisite:
    universal.b1.reported_speech.report_what_someone_said, completing
    this pass's complex-clause grammar arc: ability -> necessity ->
    conditions -> time sequencing -> reported speech -> purpose).
    Teaches purpose-clause sentences with تا (in order to/so that) +
    subjunctive (lessons 1-2, all persons), then extends to NEGATIVE
    purpose ("so as not to," lesson03, reusing the ب-/ن- negative-
    subjunctive swap rule b1_unit03 established, applied here to a
    callback verb -- خسته نشوم, "so that I don't get tired," deliberately
    reuses b1_unit04's خسته می‌شوم construction rather than inventing an
    unrelated example, reinforcing prior-unit vocabulary meaningfully
    rather than just introducing more new words). Source-material check:
    `firecrawl --status` still showed 0/1,000 credits remaining
    throughout this pass (same outage flagged in b1_unit02-05's
    provenance notes), so no fresh public-domain source search was
    attempted; this is established-conventions authoring (standard,
    well-documented Persian/Dari purpose-clause grammar), the same
    honest fallback path used throughout this pass. All new regular
    verbs continue the established د/ند-ending-for-new-verbs convention
    (یاد بگیرم/بگیری/بگیرد/بگیریم/بگیرید/بگیرند, جمع کنم/کنی/کند...,
    پیدا کنم, می‌خواهد, تلاش می‌کنند -- all standard-shape). Scenario is
    original: Zarmina studying English to find a better job, and
    Homayoun saving money to buy a car -- reusing this course's
    established recurring cast (Zarmina, Homayoun) with fresh, concrete,
    goal-oriented content distinct from the previous four new units'
    errands/guests/weather/routine/workplace-news scenarios, and closing
    the pass with an explicit thematic tie-back (لesson03's "so as not to
    get tired" reuses b1_unit04's own vocabulary on purpose). All
    vocabulary is introduced self-contained within this file
    (introduced_tokens are file-scoped per project convention, so
    already-established words like زرمینه/همایون/کار/به/خوب/خسته/زود/
    کمی/استراحت می‌کنم are re-taught here). Word_order exercises omit
    the internal comma/connector complexity a written multi-clause
    sentence would naturally carry; translation/writing/speak/
    dialogue_response exercises keep natural punctuation and, per
    AUTHORING_GUIDE.md #12, the lesson04 dialogue_response offers both a
    period-joined and comma-joined variant for its two-clause answer.
    Every kind:vocabulary card carries a real example sentence per
    AUTHORING_GUIDE.md #19. No listen_type/listen_select/listen_order
    anywhere (AUTHORING_GUIDE.md #14 -- prs still has zero TTS/recorded-
    audio coverage). Every matching_pairs exercise uses 6 pairs
    (AUTHORING_GUIDE.md #16). STATUS: freshly authored this pass, NOT
    yet through the mandatory fresh-context review -- review.status is
    honestly left unreviewed below.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Not yet reviewed. A fresh-context reviewer (zero access to this
    authoring's reasoning, per AUTHORING_GUIDE.md #9, and instructed not
    to open the prs-en sibling overlay per #8) should check in
    particular: (1) the تا + subjunctive purpose-clause construction
    (lessons 1-2) for genuine grammatical accuracy and natural register;
    (2) the negative-purpose construction (lesson03, خسته نشوم) and
    whether it correctly reuses the ب-/ن- negation-swap rule from
    b1_unit03 rather than repeating the نه-prefix error already fixed
    once in b1_unit01's own review; (3) whether یاد گرفتن/جمع کردن/پیدا
    کردن (compound verbs used throughout) are conjugated correctly and
    consistently; (4) script purity (Persian-range ک/ی only, no
    Arabic-range codepoints); (5) no internal-jargon leaks in
    learner-facing text; (6) every exercise type used (multiple_choice,
    word_order, matching_pairs, translation, speak_response,
    writing_prompt, dialogue_response) is registered in
    ExerciseRenderer.tsx; (7) cross-lesson fact consistency (Zarmina's
    school/job goal and Homayoun's savings/car goal agreeing between
    lesson04's dialogue and lesson05's reading); (8) that every
    word_order/listen_order word_bank multiset exactly matches its
    accepted-answer token multiset (hand-verified against
    validate_order_word_bank_answers before this note was written, but
    a fresh reviewer should re-confirm via a real compiler run, not
    trust the authoring self-report). Once this unit's review completes,
    ALL SIX prs B1 units (b1_unit01-06) should get one additional pass:
    a corpus-wide check that no two units accidentally taught the same
    content_key-scoped vocabulary with conflicting glosses, since all
    six were authored independently across separate sessions/passes.
    FRESH-CONTEXT REVIEW (2026-07-11): reviewed, status set to reviewed.
    Grammar/script/distractors/word-bank-parity all verified clean. One
    FLAG left not-fixed (native-speaker/pedagogical arbitration, not a
    learner-graded-wrong bug): the lesson02/06 grammar note states the
    تا-clause subject is ALWAYS the same as the main clause and contrasts
    that with اگر/وقتی که -- a reasonable B1 scaffolding, but تا can in
    fact head a different-subject purpose clause (پول می‌دهم تا او بخرد).
    Left as-authored since every example in this unit is same-subject;
    a native/pedagogical pass may want to soften the absolute wording.

course:
  realization_key: prs.b1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین-adjacent, fuller written-leaning
    register from prs's other units. New regular verbs continue
    b1_unit03/04/05's precedent of standard د/ید/ند-ending present-
    indicative and subjunctive paradigms; the earlier ه/ین/ن colloquial
    paradigm remains specific to تانستن/خریدن and is not extended
    further.

