review:
  status: unreviewed
  required_next_reviewer: native_dari_reviewer
  notes: 'Grammar-led A2 rebuild (docs/A2_REBUILD_PLAN.md, Block C unit C3), realizing universal.a2.requests.make_polite_requests_and_offers. Grammar target: the polite request می‌شود که ...؟ + subjunctive (re-taught here: بدهم ... بدهین), لطفاً + imperative (-ین to شما, bare form to a friend), offers with the -م subjunctive (کمک کنم؟ چای بیاورم؟ می‌خواهین که کمک کنم؟), accepting and declining (بلی، لطفاً / نه، تشکر / لازم نیست / متأسفم، نمی‌توانم), and the NEGATIVE IMPERATIVE (نکنین، نروین، نگویین، ندهین، نیایین، نگذارین، نکشین; singular نکن، نرو ...). -ید forms (بدهید، نروید، نکنید، بیاورید) appear only as extra accepted answers, never in taught text or MCQ options. Lesson arc: L01 the request frame and the -ین subjunctive; L02 لطفاً + imperative (-ین and bare); L03 offers, accepting, declining; L04 the negative imperative; L05 neighbour dialogue (Masood asks Rahima to carry a table, offers tea, she declines) plus a written note (Nargis to Shafiq: key, water the flowers, do not leave the gate open); L06 shop phone call (Laila orders two breads and a milk, tea declined) plus mixed and culminating typed production. Spine: listening = dialogue_comprehension with the full transcript in the prompt (prs has no TTS); speaking = typed dialogue_response; reading = reading_comprehension; writing = writing_prompt. No listen_type, dictation or audio-only items. Characters: مسعود/رحیمه, فرزانه with an unnamed دوکاندار, and ماجده/شفیق were all unused anywhere in docs/content/realizations/prs and overlays/en-prs at authoring time. Facts kept consistent (AUTHORING_GUIDE section 11): dialogue 1 = table to the room, tea offered and declined; dialogue 2 = two breads and a milk sent to Laila''s house at five, tea offered and declined; the note is a separate account by a third pair. Binding rulings applied: no future (خواهم), no clitics (ازش/باهاش/بهت/برات), modal only with ZWNJ می‌توانم / می‌توانین, copula است/استم/استند, 2pl -ین everywhere. Because the only new words available are those in the existing en-prs A2 lexicon, every other word is introduced in this unit before its first use. status: unreviewed; the mandatory fresh-context review has not run. OPEN QUESTIONS FOR A NATIVE DARI REVIEWER (recommended answer after each): (1) Is می‌شود که + subjunctive (می‌شود که کمی نان بدهین؟) natural Kabuli for a polite request, and are the variants می‌شود کمی نان بدهین؟ (no که), می‌توانین ... بدهین؟ and ممکن است که ... بدهین؟ equally natural? Rec: keep می‌شود که as taught, accept the others. (2) Is بیاورین the right polite imperative of آوردن in everyday speech (accepted extras بیارین، بیارید، بیاورید)? Rec: keep بیاورین. (3) Is لطفاً زحمت نکشین the natural way to decline an offered tea, and is نه، تشکر. لازم نیست. natural beside it? Rec: keep. (4) Is خیلی تشکر natural for thank you very much, or would a native say تشکر زیاد / خیلی ممنون? Rec: keep خیلی تشکر. (5) Is نه، دیر نمی‌کنم a natural reply to لطفاً دیر نکنین (the نه agrees with the negative request), and is دیر کردن the right verb for being late with a delivery? Rec: keep. (6) Are the offers چای بیاورم؟ / کیسه هم بدهم؟ / چای هم بفرستم؟ natural, and می‌خواهین که کمک کنم؟ for Do you want me to help? Rec: keep. (7) Is بلی، تشکر. لطف می‌کنین. natural for accepting, and is تشکر از لطف شما natural at the end of a written note? Rec: keep. (8) Is پیش شما (not نزد شما) the better choice in می‌شود که کلید را پیش شما بگذارم؟ Rec: keep پیش, accept نزد. (9) Is به گل‌هایم آب بدهین the right way to say water my flowers (preposition به and plural گل‌ها)? Rec: keep. (10) Is دوکاندار natural for shopkeeper, and the phone opening الو، سلام. Rec: keep. (11) Is با من به اتاق ببرین natural for carry this to the room with me, or would a native say با هم? Rec: keep. (12) Are the title forms خانم رحیمه / آقای مسعود used correctly before first names? Rec: keep. (13) Is the negative imperative of آمدن نیایین (not نیاین) and of گذاشتن نگذارین correct in Kabuli speech? Rec: keep. (14) Is تا جمعه در خانه نیستم natural for I will not be at home until Friday? Rec: keep. (15) Is متأسفم، حالا نمی‌توانم a natural polite refusal beside ببخشین، نمی‌توانم? Rec: keep both.'
course:
  realization_key: prs.a2
  target_language_first: true
  dialect: prs_AF_kabuli_standard_a2
  register_policy: 'Formal written Kabul Dari as in the rest of prs A2: copula است/استم/استی/استیم/استین/استند, 2pl -ین (the -ید forms appear only as extra accepted answers), no Tehrani colloquialisms. Neighbours and the shopkeeper are addressed with the polite شما (-ین forms); the bare imperative is taught for friends only. Polite request = می‌شود که + subjunctive; command = لطفاً + imperative; negative command = نـ on the imperative (نکنین, نروین).'
