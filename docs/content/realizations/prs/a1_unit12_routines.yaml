review:
  status: reviewed
  required_next_reviewer: null
  notes: "New unit, prs's next uncovered outcome (prerequisite: time, already covered in unit11). Six lessons: daily routine verbs, describing a routine with times, parts of the day (re-taught within this file since introduced_tokens are file-scoped -- reusing the same صبح/ظهر/عصر/شب established in unit01/unit11), reading a short routine text, a writing task, and a dialogue comparing two people's routines. Uses استم/استین verb endings and full, uncontracted verb forms (می‌شوم، می‌روم، not the Iranian-colloquial می‌شم/میرم), consistent with the register established in units 01-11. Authored independently of the fa realization per the sibling-isolation rule. Authored §14/§16-compliant from the start: no listen_type/listen_select/listen_order exercises anywhere, and every matching_pairs exercise is sized by re-teaching relevant vocabulary within this file (numbers/time from unit11, parts of day from unit01) rather than left at 2-3. Proactively checked against AUTHORING_GUIDE §11-13 during authoring, including cross-checking every stated time across all 6 lessons for consistency. Compiler validation clean (0 errors/0 warnings). Awaiting the standing fresh-context review before status can move to reviewed.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-06 (zero prior context, sibling fa files never opened). Verified against universal.a1.routines.describe_daily_routine's own can_do/assessment_requirements (all 4 -- understand_routine via lesson06's read-as-text dialogue_comprehension honestly instructed as \"Read,\" describe_routine via dialogue_response, read_routine via lesson04's reading_comprehension, write_routine via writing_prompt/translation -- covered, matching unit11's established read-substitutes-for-listening pattern given zero prs audio); exercise pacing (recognition -> drag/matching -> production verified in all 6 lessons); script purity (zero Arabic-range kaf/yeh, grepped both files); no jargon leaks; §14/§16 self-claims verified true (zero listen_type/listen_select/listen_order; all 6 matching_pairs exercises sized exactly 6 pairs); all 8 exercise types used confirmed registered in frontend/src/components/exercises/ExerciseRenderer.tsx; content_key parity exact both directions (1 unit/6 lessons/24 teaching/32 exercises each side). Ran a Python tokenizer (ZWNJ-aware compound-word handling, Persian-punctuation-stripping) checking every tested_text/pairs/word_bank/prompt.target_blocks value in the realization AND every overlay accepted_answers/correct_option/distractors value against cumulative introduced_tokens up to that point in the lesson sequence, confirming the earlier-caught missing-teach-card fix for the third-person می‌شود form (lesson06.teach.mishavad_word) is complete with zero remaining untaught-vocabulary violations anywhere in the file. Cross-checked §11 facts: Homayoun wakes at 7, Zarmina at 6, stated consistently across the media_assets dialogue, all lesson06 teaching cards and exercises, and the final comparison-writing exercise (Zarmina correctly identified as waking earlier). §12 verified: write_comparison_summary already had all three period/comma/و-joined forms as status:correct; FOUND AND FIXED a real gap in write_own_routine, which had only the comma- and period-joined forms -- added the missing pure-و-joined variant (\"...بیدار می‌شوم و صبحانه می‌خورم و به دفتر می‌روم\") as status:correct. FOUND AND FIXED a real dialect-accuracy issue in this file's own register_policy and the paired overlay's teaching notes: the claim that spoken Dari simply lacks the Iranian-colloquial verb contraction (می‌شم/میرم) was linguistically inaccurate -- web-verified (Encyclopaedia Iranica's Kāboli article and other sources) that colloquial Kabuli Dari DOES contract these verbs too (e.g. میرم), just with a distinct Afghan -om vowel quality rather than the Iranian -am pronunciation of the same spelling. The actual authored choice (fuller می‌شوم/می‌روم forms throughout) remains linguistically defensible and was kept as-is, since it's a legitimate deliberate register choice consistent with this course's already-established استم/استین neutral/educated-colloquial convention (units 01-11) -- only the false absolute claim was corrected, not the content itself. Judged the A1-complexity question honestly: introducing 1st/2nd/3rd-person forms of بیدار شدن across the unit (1st in lesson01-02, 2nd in lesson02, 3rd only in lesson06) is a gradual, single-verb buildup spread across 6 lessons rather than a same-lesson cram, and 3rd person is genuinely load-bearing for the spine outcome's own comparison task -- judged appropriate pacing for A1, not overreach. FOUND AND FIXED a real duplicate-prompt-text bug (present via compile, not visible from validate alone), the same bug class already fixed in unit11's own review: all 4 of this file's dialogue_response/writing_prompt exercises had realization prompt.target_blocks containing the exact same English text as the overlay's own instruction, so compiled output showed the same sentence twice. Fixed via the same established pattern: reply-type prompts (lesson02.exercise06, lesson06.exercise05) now show the actual already-taught Dari question ساعت چند بیدار می‌شوی؟ being replied to instead of a duplicated English instruction; self-initiated prompts with no natural preceding cue (lesson05.exercise05, lesson06.exercise06) now use empty target_blocks, matching unit11's own precedent. FOUND AND FIXED a real YAML-footgun bug (AUTHORING_GUIDE §7): lesson06.exercise02's pairs entry {left: بلی, right: yes} had an unquoted bare \"yes\" that PyYAML silently coerced to the Python boolean True (confirmed by loading the file directly) -- quoted as \"yes\" in both this file's pairs and the paired overlay's matching accepted_answers dict value; note this specific bug class (a boolean hidden inside a nested dict value, not a bare list/scalar) is NOT caught by the compiler's own validate_no_stray_yaml_booleans check, which only recurses into lists, not dict values -- flagging as a tooling gap worth a follow-up fix in scripts/compile_content.py, separate from this content fix. Also applied the §15 target-language-asterisk convention to 42 previously-unwrapped note/feedback strings in the paired overlay (the file had almost none applied despite being freshly authored after the convention existed) and fixed a minor typo (\"this unit11's\" -> \"unit11's\") in one feedback string. Re-verified via actual compile (not just validate) that every fix took effect in the compiled JSON: بلی now compiles to the string \"yes\" not a boolean; write_own_routine's accepted list has all 3 clause-joining variants; the two self-initiated prompts compile with only their English instruction text_block (no duplicate); the two reply-type prompts compile with both the English instruction and the distinct Dari cue line, matching unit11's shipped precedent exactly. Both validate and compile re-run clean (0 errors/0 warnings) after every fix; compile output is valid JSON.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 9 kind:vocabulary teaching cards (1 merged card -- the names list -- given a positionally-matched list of examples), each a natural, comprehensible-from-gloss sentence built from vocabulary already taught earlier in this same file or in prior units (1-11), reusing already-established time/routine phrases (ساعت هفت بیدار می‌شوم, به دفتر می‌روم, صبحانه می‌خورم) rather than introducing anything new. The names card's example uses the well-established استم copula (\"من زرمینه استم\" / \"من همایون استم\") rather than the third-person می‌شود form, since that grammar note is only introduced later in this same lesson (teach.mishavad_word), one card after names -- avoided a forward-reference. schema_version bumped to 1.1. Example sentences are Claude-authored.

    2026-07-07: FRESH-CONTEXT REVIEW of the §19 retrofit (separate subagent, zero access to authoring reasoning, scoped to the new example:/example_gloss: content across prs units 12-19): compiler validation confirmed 0 errors/0 warnings across all 8 units together; script purity, stray-boolean, dialect-register, grammar, and vocabulary-scope checks all confirmed clean; zero genuine forward-references or gloss mismatches found. One minor word-order naturalness nit flagged and fixed here: haft_review's example reordered from \"به دفتر ساعت هفت می‌روم\" to \"ساعت هفت به دفتر می‌روم\", fronting the time phrase to match this file's own established ساعت هفت بیدار می‌شوم word-order pattern (marked-but-grammatical either way; the review found this the only non-blocking observation in the entire retrofit)."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first register policy.
    Uses the fuller, written-adjacent verb forms (می‌شوم، می‌روم)
    throughout, matching units 01-11's established neutral/educated-
    colloquial register. This is a deliberate register choice, not a
    claim that spoken Dari lacks its own colloquial contraction: Kabuli
    Dari does contract these verbs too (e.g. میرم), with a distinct
    Afghan -om vowel quality rather than the Iranian -am pronunciation
    of the same spelling.

media_assets:
  - content_key: prs.a1.audio.routines.verbs.01
    language: prs
    text: "از خواب بیدار می‌شوم، صبحانه می‌خورم، به دفتر می‌روم، شب می‌خوابم"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: prs.a1.audio.dialogue.comparing_routines.01
    language: prs
    text: "زرمینه: همایون، ساعت چند بیدار می‌شوی؟ همایون: ساعت هفت بیدار می‌شوم. تو چطور؟ زرمینه: من ساعت شش بیدار می‌شوم. همایون: زود بیدار می‌شوی! زرمینه: بلی، به دفتر زود می‌روم."
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: prs.a1.unit12.routines
    title: کارهای روزمره
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.routines.describe_daily_routine
    planned_lesson_count: 6

    lessons:
      - content_key: prs.a1.unit12.lesson01.routine_verbs
        title: افعال کارهای روزمره
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: prs.a1.unit12.lesson01.teach.bidar_mishawam
            kind: phrase
            target: {text: "از خواب بیدار می‌شوم", language_code: prs, direction: rtl}
            introduced_tokens: [از, خواب, بیدار, می‌شوم]
          - content_key: prs.a1.unit12.lesson01.teach.sobhana_mikhoram
            kind: phrase
            target: {text: "صبحانه می‌خورم", language_code: prs, direction: rtl}
            introduced_tokens: [صبحانه, می‌خورم]
          - content_key: prs.a1.unit12.lesson01.teach.daftar_miravam
            kind: phrase
            target: {text: "به دفتر می‌روم", language_code: prs, direction: rtl}
            introduced_tokens: [به, دفتر, می‌روم]
          - content_key: prs.a1.unit12.lesson01.teach.shab_mikhabam
            kind: phrase
            target: {text: "شب می‌خوابم", language_code: prs, direction: rtl}
            introduced_tokens: [شب, می‌خوابم]
        exercises:
          - content_key: prs.a1.unit12.lesson01.exercise01.recognize_bidar_reading
            type: multiple_choice
            tested_text: "از خواب بیدار می‌شوم"
            prompt: {target_blocks: [{text: "از خواب بیدار می‌شوم", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit12.lesson01.exercise02.recognize_daftar_reading
            type: multiple_choice
            tested_text: "به دفتر می‌روم"
            prompt: {target_blocks: [{text: "به دفتر می‌روم", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit12.lesson01.exercise03.match_routine_verbs
            type: matching_pairs
            tested_text: "بیدار می‌شوم صبحانه می‌خورم به دفتر می‌روم شب می‌خوابم"
            prompt: {target_blocks: []}
            pairs:
              - {left: "از خواب بیدار می‌شوم", right: "I wake up"}
              - {left: "صبحانه می‌خورم", right: "I eat breakfast"}
              - {left: "به دفتر می‌روم", right: "I go to the office"}
              - {left: "شب می‌خوابم", right: "I sleep at night"}
              - {left: صبحانه, right: breakfast}
              - {left: دفتر, right: office}
          - content_key: prs.a1.unit12.lesson01.exercise04.order_wake_up
            type: word_order
            tested_text: "از خواب بیدار می‌شوم"
            prompt: {target_blocks: [{text: "I wake up.", language_code: en, direction: ltr}]}
            word_bank: [از, خواب, بیدار, می‌شوم]
          - content_key: prs.a1.unit12.lesson01.exercise05.translate_breakfast
            type: translation
            tested_text: "صبحانه می‌خورم"
            prompt: {target_blocks: []}
          - content_key: prs.a1.unit12.lesson01.exercise06.translate_sleep
            type: translation
            tested_text: "شب می‌خوابم"
            prompt: {target_blocks: []}

