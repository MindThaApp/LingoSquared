              - {left: فوتبال, right: football}
              - {left: والیبال, right: volleyball}
              - {left: کرکت, right: cricket}
              - {left: شنا, right: swimming}
              - {left: بازی, right: game}
              - {left: "فوتبال یک ورزش است.", right: "Football is a sport."}
