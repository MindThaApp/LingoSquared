            kind: vocabulary
            target: {text: ورزش, language_code: prs, direction: rtl}
            introduced_tokens: [ورزش]
            example: {text: "شنا یک ورزش خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit29.lesson01.teach.football_word
            kind: vocabulary
            target: {text: فوتبال, language_code: prs, direction: rtl}
            introduced_tokens: [فوتبال]
            example: {text: "فوتبال یک ورزش خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit29.lesson01.teach.volleyball_word
            kind: vocabulary
            target: {text: والیبال, language_code: prs, direction: rtl}
            introduced_tokens: [والیبال]
            example: {text: "والیبال هم یک ورزش است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit29.lesson01.teach.cricket_word
            kind: vocabulary
            target: {text: کرکت, language_code: prs, direction: rtl}
            introduced_tokens: [کرکت]
            example: {text: "کرکت یک ورزش محبوب است.", language_code: prs, direction: rtl}
