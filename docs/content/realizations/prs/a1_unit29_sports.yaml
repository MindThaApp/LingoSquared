            type: multiple_choice
            tested_text: فوتبال
            prompt: {target_blocks: [{text: فوتبال, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit29.lesson01.exercise02.recognize_cricket_word
            type: multiple_choice
            tested_text: کرکت
            prompt: {target_blocks: [{text: کرکت, language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit29.lesson01.exercise03.recognize_combined_sentence_reading
            type: multiple_choice
            tested_text: "فوتبال یک ورزش است."
            prompt: {target_blocks: [{text: "فوتبال یک ورزش است.", language_code: prs, direction: rtl}]}
          - content_key: prs.a1.unit29.lesson01.exercise04.match_sport_words
            type: matching_pairs
            tested_text: "ورزش فوتبال والیبال کرکت شنا بازی فوتبال یک ورزش است"
