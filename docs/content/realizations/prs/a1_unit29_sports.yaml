generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain) were searched for a fetchable lesson-level sports/exercise unit this pass; none was found (the Peace Corps Dari course's own table of contents has no dedicated sports topic, matching the same search-and-disclose outcome as the unit24/unit26/unit28 precedents). Authored from established prs conventions and vocabulary already taught earlier in this course instead. Sport vocabulary verified independently via live web search (not just reasoning) during authoring: ورزش (varzesh) confirmed as the standard, shared Dari/Farsi word for both 'sport' and 'exercise' (no dialect-divergence risk); فوتبال and والیبال confirmed as standard loanwords used identically in both dialects; کرکت (cricket) confirmed as a genuinely popular, commonly-referenced sport specifically in Afghanistan (Afghanistan Cricket Board's own Dari name uses کرکت) -- included as an authentic cultural touch, not a lexical-divergence case like unit24's موتر/unit28's پشک, since the word itself is shared; شنا (swimming) and دویدن-family avoided (see register_policy) are standard shared vocabulary."
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude, zero access to the authoring
    reasoning, prs unit29 only -- units 23-26 reviewed separately in
    parallel per the coordinator's split). Full standing checklist
    applied: same-speaker dialogue-distractor collisions (none), stray
    YAML boolean coercion (a recursive yaml.safe_load scan found none
    beyond the two legitimate schema fields), Persian-range Unicode
    codepoints throughout, matching_pairs/word_order answer shapes
    (correct), exercise types used (all pre-registered), no
    internal-jargon leaks, and Dari register/grammar (consistent
    استم/استین formal register outside the Homayoun/Zarmina informal
    تو/-ی dialogue lines; کرکت's Afghanistan-popularity and ورزش's
    dual sport/exercise sense both plausible and consistent with the
    file's own generation_provenance).

    Ran a token-by-token untaught-vocabulary trace of every teaching
    card's target/example text against this file's own cumulative
    introduced_tokens (stricter than the compiler's own tested_text-only
    check). This pass found four real gaps the compiler
    itself does not catch (it only gates on tested_text, and none of
    these were exercise-tested, only used in teaching-card example
    sentences): lesson01's football_word example ("من فوتبال دوست
    دارم.") used دوست/دارم/من a full five lessons before their first
    formal declaration (lesson06's wrap-up) -- fixed by rewriting the
    example to "فوتبال یک ورزش خوب است." (Football is a good sport),
    reusing only same-lesson vocabulary; lesson01's volleyball_word/
    cricket_word/swimming_word examples used هم, محبوب, and خوب, none
    of which were declared as introduced_tokens ANYWHERE in this file
    (not just late -- genuinely never) -- fixed by adding all three to
    the lesson01 combined_sentence card's introduced_tokens, the
    existing same-lesson "review" recap slot already used for یک/است;
    and lesson03's bashgah_word example used بزرگ (already taught
    course-wide since unit15/unit28, but never redeclared in this file)
    -- fixed by adding it to bashgah_word's own introduced_tokens.

    Also found and fixed one §16 scale gap: lesson05's match_reading_words
    matching_pairs exercise had only 5 pairs, below the 6-12 guidance
    (every sibling matching_pairs exercise in this same unit has 6-8) --
    added باشگاه/gym and پارک/park pairs (both already-taught, already
    used in the reading passage's own sentences) to bring it to 7,
    updating both the realization pairs list and the overlay's
    accepted_answers value mapping.

    Cross-checked facts within this unit per AUTHORING_GUIDE.md §11:
    Zarmina (twice a week, volleyball, at the gym) and Homayoun (every
    week, football, at the park) are consistent across the lesson04
    dialogue and the lesson05 reading passage's own numbers -- no
    conflict. Re-validated clean after all fixes: 0 errors/0 warnings,
    both standalone and as part of the full prs.a1.unit27-30 batch.

    Review 2026-10-20 (en-prs A1 pass): 0 fixes in this file (fixes are in the overlay). NATIVE FLAGS: see overlay.

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-28). The Homayoun/Zarmina dialogue (lesson04)
    uses the informal تو/-ی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), and unit28
    (داری) dialogues. ورزش، فوتبال، والیبال، and شنا are standard,
    everyday Kabul Dari shared with Farsi, no dialect-divergence risk.
    کرکت (cricket) is genuinely popular specifically in Afghanistan
    (verified via web search, see generation_provenance) -- included as
    an authentic cultural touch, though the word itself is shared
    vocabulary, not a lexical-divergence case like موتر/تکت (unit24) or
    پشک (unit28). دویدن (to run) was deliberately avoided to keep every
    activity verb within the already-established کردن light-verb family
    rather than introducing a new irregular present-stem verb.

