generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: "Peace Corps Dari course materials (public domain) were searched for a fetchable lesson-level sports/exercise unit this pass; none was found (the Peace Corps Dari course's own table of contents has no dedicated sports topic, matching the same search-and-disclose outcome as the unit24/unit26/unit28 precedents). Authored from established prs conventions and vocabulary already taught earlier in this course instead. Sport vocabulary verified independently via live web search (not just reasoning) during authoring: ورزش (varzesh) confirmed as the standard, shared Dari/Farsi word for both 'sport' and 'exercise' (no dialect-divergence risk); فوتبال and والیبال confirmed as standard loanwords used identically in both dialects; کرکت (cricket) confirmed as a genuinely popular, commonly-referenced sport specifically in Afghanistan (Afghanistan Cricket Board's own Dari name uses کرکت) -- included as an authentic cultural touch, not a lexical-divergence case like unit24's موتر/unit28's پشک, since the word itself is shared; شنا (swimming) and دویدن-family avoided (see register_policy) are standard shared vocabulary."
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: "New unit, prs's next uncovered A1 outcome found by exact-diffing every spine_outcome_id used across all prs realization files against every id: in docs/content/universal_spine.yaml (A1-level outcomes only): universal.a1.sports.talk_about_sports_exercise (prerequisite: universal.a1.hobbies.describe_free_time_activities [unit26], already realized). This is the earliest unrealized A1 outcome by the spine file's own line order (line 881, immediately after animals/unit28) among the ones prs has not yet covered -- technology/education/celebrations/household/neighborhood/post/cooking all come later in file order (one new outcome, cooking, was appended by a concurrent session partway through this pass -- re-checked against the live spine file before finalizing and confirmed the append does not change sports' position or definition) and remain unrealized too; transportation (already used, unit24) sits between animals and sports in an OLDER version of the file's line order but was realized earlier under its own gap-finding pass, so sports is the genuine next gap now. Six lessons: sport/exercise vocabulary (ورزش as the general sport/exercise word, فوتبال, والیبال, کرکت -- a genuine Afghanistan-popular sport, deliberately included as an authentic local touch -- and شنا, plus a بازی+کردن light-verb grammar note), a formal 'how many times a week do you exercise?' question (چند بار در هفته ورزش می‌کنین؟) built from already-established چند (unit03/04) + new بار (time/occurrence) + review در/هفته (unit02/unit04/unit09, re-declared here), answered with the same بازی می‌کنم light-verb pattern applied to a specific sport (من دو بار در هفته فوتبال بازی می‌کنم), a location lesson introducing باشگاه (gym) and reusing پارک (review from unit13) to state where the activity happens, a Homayoun/Zarmina dialogue in the established informal تو/-ی register (تو چند بار در هفته ورزش می‌کنی؟, matching the precedent set by unit20's رفتی/کردی, unit25's استی, unit26's می‌کنی, and unit28's داری informal forms) that covers sport, frequency, AND location in one exchange -- satisfying the spine outcome's full 'which sport, how often, and where' can_do in a single natural conversation, a short third-person reading passage continuing the same two characters and kept factually consistent with the dialogue's own numbers per AUTHORING_GUIDE.md #11 (Zarmina: twice a week, volleyball, at the gym; Homayoun: every week, football, at the park -- neither figure contradicts the dialogue), and a wrap-up combining a preference and a constraint with اما (فوتبال را دوست دارم اما وقت ندارم -- reusing the established را-marked دوست دارم construction from unit14/unit26 and وقت/ندارم from unit11/unit26/unit03/unit28) rather than just two flat facts, giving the وقت ندارم construction a genuine payoff. Deliberately did NOT introduce دویدن (to run) or any irregular present-stem verb -- kept every sport-doing verb to the already-established کردن/بازی-کردن light-verb family (ورزش می‌کنم, بازی می‌کنم, شنا می‌کنم are all the same pattern already used course-wide: پیاده‌روی می‌کنم/آشپزی می‌کنم unit26, معرفی می‌کنم unit01, زندگی می‌کنم unit01/03, صحبت می‌کند unit07) -- a deliberate scope decision per AUTHORING_GUIDE.md §1 to keep the unit about the sports/exercise outcome, not a verb-conjugation detour. Continues the established استم/استین full-uncontracted register policy outside the informal Zarmina/Homayoun dialogue lines. Every word re-declared via introduced_tokens within THIS file per the standing per-file untaught-vocabulary footgun, even for words taught many units earlier (چند/unit03-04, در/unit02, هفته/unit04, دو/unit04, پارک/unit13, تو/unit01, کجا-as-standalone/new-but-related-to-unit05-06's کجاست, می‌کنی/unit26's pattern, هر/unit24, دوست/دارم/را/unit14, وقت/unit11, ندارم/unit03, اما/unit24, است/من/یک -- all re-declared fresh here, confirmed via a real recursive check, see below). Ran the same class of check prior reviews used: a Python tokenizer confirmed every exercise's tested_text (the field the compiler's validate_untaught_vocabulary actually gates on) only tests tokens present in this file's cumulative introduced_tokens at that point, AND additionally (a stricter, non-compiler-enforced check matching past reviewers' own practice) checked every prompt.target_blocks/pairs/word_bank value against the same cumulative set -- this second, stricter pass found one real gap the compiler itself did not catch (it only gates on tested_text): lesson04's dialogue_comprehension exercise's prompt asked زرمینه چند بار در هفته والیبال بازی می‌کند؟ using 3rd-person می‌کند before that form was introduced anywhere earlier in the file (it was only first taught in lesson05's reading passage) -- fixed by adding a small review grammar_note (teach.review_mikonad) earlier in lesson04, before the dialogue lines, introducing می‌کند as review ahead of this exercise's prompt; re-ran both the compiler and the stricter checker after the fix, both clean. Authored §14/§16/§17/§19-compliant from the start: no listen_type/listen_select/listen_order exercises (zero prs audio exists), every matching_pairs exercise sized 6-7 pairs, zero fill_in_blank, every kind:vocabulary card has a real example sentence built from already-taught or transparently-glossed words. §12 multi-clause coverage applied to the wrap-up's اما-joined translation exercise (period/comma/no-comma variants). Also ran a recursive yaml.safe_load boolean-coercion scan (not just grep) over both this file and its overlay -- zero stray Python bools found beyond the two legitimate schema fields (human_reviewed, target_language_first). Authored independently of the fa realization per the sibling-isolation rule (fa/a1_unit* files were never opened while authoring this file). Deliberately double-checked he/she pronoun usage against the recent, real Pashto-vs-Dari pronoun bug found and fixed elsewhere this session (هغه/هغوی are Pashto, not Dari) -- this file uses only او for he/she (lesson05's reading passage), never هغه/هغوی. schema_version 1.1 from the start.

    STATUS: draft, review pending. This file has NOT yet been through the project's mandatory fresh-context review and must not be imported/shipped until that review completes and any findings are fixed. Compiler validation (schema/structure only) was run and is clean, but that is not a substitute for the linguistic/pedagogical review."

course:
  realization_key: prs.a1
  target_language_first: true
  dialect: prs_AF_kabuli_educated_colloquial_intro
  register_policy: >-
    Continues the established استم/استین polite-first, full-uncontracted
    register policy (units 01-28). The Homayoun/Zarmina dialogue (lesson04)
    uses the informal تو/-ی register between the two established
    close-colleague characters, matching the precedent set by their own
    unit20 (رفتی/کردی), unit25 (خسته استی), unit26 (می‌کنی), and unit28
    (داری) dialogues. ورزش، فوتبال، والیبال، and شنا are standard,
    everyday Kabul Dari shared with Farsi, no dialect-divergence risk.
    کرکت (cricket) is genuinely popular specifically in Afghanistan
    (verified via web search, see generation_provenance) -- included as
    an authentic cultural touch, though the word itself is shared
    vocabulary, not a lexical-divergence case like موتر/تکت (unit24) or
    پشک (unit28). دویدن (to run) was deliberately avoided to keep every
    activity verb within the already-established کردن light-verb family
    rather than introducing a new irregular present-stem verb.

