            kind: vocabulary
            target: {text: شنا, language_code: prs, direction: rtl}
            introduced_tokens: [شنا]
            example: {text: "شنا ورزش خوب است.", language_code: prs, direction: rtl}
          - content_key: prs.a1.unit29.lesson01.teach.review_bazi_kardan
            kind: grammar_note
            target: {text: "بازی (game/play) + کردن (to do) = بازی می‌کنم (I play)", language_code: prs, direction: rtl}
            introduced_tokens: [بازی, کردن, می‌کنم]
          - content_key: prs.a1.unit29.lesson01.teach.combined_sentence
            kind: phrase
            target: {text: "فوتبال یک ورزش است.", language_code: prs, direction: rtl}
