generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-05
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- the same real extractable text
    layer, not a scan). Real sourced material, drawn from four different
    spots: Lesson 2's "Basic Expressions" table gives "Vă rog." (Please),
    "Mi-e foame." (I am hungry), and "Mi-e sete." (I am thirsty) verbatim;
    Lesson 4's basic questions/answers gives "Daţi-mi, vă rog, un suc."
    (Give me a juice, please), confirming "un suc" (a juice) and the
    vă rog construction together in one real sentence, plus "Unde pot să
    cumpăr cafea?"/"Cît costă o cafea?" both confirming "cafea" (coffee)
    as feminine with the indefinite article "o"; Lesson 14 "Food and
    Drinks" is a dedicated vocabulary table giving "pîine" (bread),
    "carne" (meat), "pui" (chicken), "fruct" (fruit, singularized here to
    the natural A1 plural "fructe"), "ceai" (tea), "apă" (water), and
    "mîncare" (food) among others; Lesson 18's listening-exercise dialogue
    gives the real ordering exchange "Doreşti cafea? / Nu, mulţumesc. Aş
    dori un ceai. / Da, desigur. / Mulţumesc mult." -- the sourced anchor
    for this unit's central "Aş dori ..." (I would like ...) ordering
    phrase, respelled "Aș dori" in modern orthography. As in every prior
    Romanian unit, the source uses the pre-1993 Moldovan/Communist-era
    î-everywhere and cedilla-diacritic spelling convention (mulţumesc,
    aş dori, pîine) rather than post-1993 standard Romanian orthography
    (mulțumesc, aș dori, pâine) -- every sourced word/phrase was respelled
    to modern standard orthography before use, the identical modernization
    already applied in units 01-05, not a dialect swap. Freshly authored,
    not sourced, and disclosed honestly per AUTHORING_GUIDE #10's "if the
    source doesn't cover the topic adequately, author fresh": "mâncare"
    used as a standalone generic vocabulary item (the source only shows it
    inside the Lesson 14 table header, not in a sentence of its own);
    "lapte" (milk) and "suc"/"ceai" as standalone teaching cards beyond
    their one sourced appearance; and, most notably, "te rog" (please,
    informal) -- the source only ever gives the formal "vă rog," so the
    informal tu-register counterpart is a fresh addition following this
    course's own established tu/dumneavoastră register-pairing convention
    (same precedent as unit02's ai/aveți and unit05's ai frați/aveți
    frați). Also freshly authored: every vocabulary example: sentence
    (AUTHORING_GUIDE #19), and lesson03's closing Ana/Mihai café dialogue
    -- a new scenario continuing the recurring characters, reusing this
    unit's own vocabulary only (pure recap, no new tokens beyond the
    reminder-declared bună/ziua/bine/la revedere/Ana/Mihai from earlier
    units), per the standing "untaught vocabulary must be re-declared
    per-file" convention. Authored at schema_version 1.1 from the start --
    every kind:vocabulary card carries a real example: sentence with a
    matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19). Checked clean: lesson03's
    dialogue_comprehension ("What does Ana want to drink?", correct
    "coffee") has no same-speaker distractor collision (Ana never says
    tea or juice anywhere in the dialogue -- tea is Mihai's line), no
    stray YAML booleans, matching_pairs/word_order shapes correct,
    every exercise type registered, no jargon leaks, correct and
    consistent diacritics, natural Romanian throughout. No real bugs
    found; no changes made to this unit.
    Sixth Romanian unit, first draft, continuing directly from unit05.
    Targets universal.a1.food.order_simple_meal, the spine outcome
    immediately following universal.a1.family.describe_relationships in
    universal_spine.yaml's own order -- confirmed by grepping
    universal_spine.yaml directly (family -> food -> shopping -> places
    in that order) and cross-checked against nl's and fa's own unit06,
    both also "food" (nl: a1_unit06_food.yaml, fa: a1_unit06_food.yaml),
    the same next-outcome-in-spine-order pattern this course's unit01-05
    has tracked at every step -- read only for topic/scope confirmation,
    not for structure or phrasing (this course's own established
    3-lesson bootstrap pace and Ana/Mihai characters are followed
    instead, matching units 01-05, not nl's fuller 6-lesson shape for
    the same topic). 3 lessons (bootstrap pace, matching units 01-05's
    own size). Deliberately scoped to drink vocabulary + the core
    "Aș dori ..." (I would like ...) ordering phrase (lesson01), food
    vocabulary + the vă rog/te rog politeness pair (lesson02), and a
    pure-recap café dialogue (lesson03) -- explicitly does NOT cover
    restaurant-specific vocabulary (menu, bill, waiter) or a wider food
    list (vegetables, tomatoes, potatoes, wine, beer), a real scope trim
    to keep this bootstrap unit to 3 lessons rather than a gap found
    late; "shopping" (unit07 in spine order) and a later
    "restaurant.dine_at_restaurant" spine outcome exist separately for
    that depth. Reuses unit01's "un"/"o" articles and unit05's "și"
    connector without a fresh reminder within the same lesson (already
    accumulated within this file per the standing per-file token-scoping
    convention), but DOES re-declare "mulțumesc"/"bine"/"da"/"nu" (from
    unit01/unit03) and "bună"/"ziua"/"la revedere"/"Ana"/"Mihai" (from
    unit01) via this file's own reminder grammar_note cards in lesson02
    and lesson03 respectively, before any exercise tests them. Lesson03's
    dialogue deliberately introduces zero brand-new vocabulary in its six
    lines (all reuse only tokens already taught earlier in this same unit
    or re-declared from an earlier unit), the same pure-recap style
    unit01's/unit04's/unit05's own lesson03s used, and closes with
    "Mulțumesc, Mihai! La revedere!" / "La revedere, Ana!" as a direct
    callback to unit01's and unit05's own established closing pattern.
    Needs a fresh-context content review before import, same as every
    other language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-05's register split and Ana/Mihai's own established
    dumneavoastră register with each other. This unit adds the informal
    "te rog" alongside the sourced formal "vă rog" (parallel to unit02's
    ai/aveți and unit05's ai frați/aveți frați register pairs); the
    closing café dialogue keeps Ana and Mihai's existing dumneavoastră-
    adjacent polite register intact (both use "vă rog" with each other,
    not "te rog").

