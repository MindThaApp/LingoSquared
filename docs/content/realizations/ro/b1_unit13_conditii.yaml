generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: true
  notes: >-
    Romanian's thirteenth B1 unit, continuing the b1_unit01-12 authoring
    pass. Source-material check redone for this specific topic before
    authoring: the same public-domain source used throughout ro's corpus
    ("Basic Romanian Language Lessons," US Peace Corps Moldova, public
    domain, https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for conditional markers (dacă, atunci) across the
    full 785-line extraction -- no dedicated real-conditional lesson
    found. This unit is therefore authored fresh from general standard
    Romanian grammar knowledge, matching b1_unit01-12's precedent.

    Teaches the spine outcome's full requirement (universal.b1.
    conditions.express_real_conditions): a real/likely if-clause
    construction with "dacă" ("if") pairing a condition clause with a
    result clause across two clauses (never a bare single statement),
    across two everyday planning topics -- finishing work in time to
    leave early, and weekend plans depending on the weather -- and the
    negated form "dacă nu" ("if not") to express the condition's
    negative. All exercises pair a full condition+result sentence, never
    a bare single clause, matching the outcome's literal requirement.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-12) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-12). Mihai is finishing a report today (a routine office
    task, consistent with his established inginer profession -- not a
    new job fact) and discusses his weekend plans with Ana, contingent
    on the weather; this introduces no new biographical fact and
    contradicts nothing previously established. Grepped the established
    character profiles before writing: Mihai remains inginer (a1_unit17,
    masculine-only "Sunt inginer"), Ana remains profesoară
    (feminine-only), Diana remains their office colleague
    (b1_unit04/06) -- no profession or biographical fact is contradicted
    here. All genuinely new vocabulary is introduced self-contained
    within this file; no other session's sibling-direction overlay was
    consulted while authoring.
review:
  status: reviewed
  required_next_reviewer: null
  notes: "Second-pass review 2026-10-19: 1 fix - lesson05 Diana card example said 'Mihai și Ana merg la munte', contradicting the dialogue (Ana wishes Mihai good weather and is not going); now 'Mihai merge la munte dacă nu plouă.' NATIVE FLAGS: dialogue line 'Bine, sper să nu plouă pentru dumneavoastră' may sound slightly unidiomatic ('pentru dumneavoastră')."

