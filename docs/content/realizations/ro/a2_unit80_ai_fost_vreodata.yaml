          - {"content_key": "ro.a2.unit80.lesson06.exercise05.raspunde_papanasi", "type": "dialogue_response", "tested_text": "Nu încă nu am mâncat", "prompt": {"target_blocks": [{"text": "Ai mâncat deja papanași?", "language_code": "ro", "direction": "ltr"}]}}
