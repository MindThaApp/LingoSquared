units:
  - content_key: ro.a2.unit25.probleme_locuinta
    title: "Probleme la locuință"
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.housing.report_maintenance_problem
    planned_lesson_count: 4

    lessons:
