            prompt: {target_blocks: []}
            word_bank: ["Robinetul", "din", "bucătărie", "curge", "de", "ieri"]
          - content_key: ro.a2.unit25.lesson01.exercise07.complete_robinetul_curge_de_ieri
            type: fill_in_blank
            tested_text: "ieri"
            prompt:
              target_blocks:
