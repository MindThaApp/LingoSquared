          - content_key: ro.a2.unit25.lesson01.teach.reminder_buna_multumesc_la_revedere_mihai_apartament
            kind: grammar_note
            target: {text: "Bună ziua · Mulțumesc · La revedere · Mihai · Apartament", language_code: ro, direction: ltr}
            introduced_tokens: [bună, ziua, mulțumesc, la, revedere, mihai, apartament, bucătărie]
          - content_key: ro.a2.unit25.lesson01.teach.robinet_vocab
            kind: vocabulary
            target: {text: "Robinet", language_code: ro, direction: ltr}
            introduced_tokens: [robinet, robinetul, din]
            example:
              - {text: "Robinetul din bucătărie.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit25.lesson01.teach.curge_vocab
            kind: vocabulary
            target: {text: "Curge", language_code: ro, direction: ltr}
            introduced_tokens: [curge]
            example:
              - {text: "Robinetul curge.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit25.lesson01.teach.de_ieri_vocab
            kind: vocabulary
            target: {text: "De ieri", language_code: ro, direction: ltr}
            introduced_tokens: [de, ieri]
            example:
              - {text: "Robinetul curge de ieri.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit25.lesson01.teach.robinetul_curge_de_ieri_phrase
            kind: phrase
            target: {text: "Robinetul curge de ieri.", language_code: ro, direction: ltr}
            introduced_tokens: [robinetul, curge, de, ieri]
        exercises:
          - content_key: ro.a2.unit25.lesson01.exercise01.choose_robinet
            type: multiple_choice
            tested_text: "robinet"
            prompt:
              target_blocks:
                - {text: "faucet", language_code: en, direction: ltr}
          - content_key: ro.a2.unit25.lesson01.exercise02.choose_curge
            type: multiple_choice
            tested_text: "curge"
            prompt:
              target_blocks:
                - {text: "leaks / flows", language_code: en, direction: ltr}
          - content_key: ro.a2.unit25.lesson01.exercise03.listen_robinetul_curge
            type: listen_select
            tested_text: "Robinetul curge de ieri"
            media_asset_key: ro.a2.audio.locuinta.robinetul_curge.01
            prompt: {target_blocks: []}
          - content_key: ro.a2.unit25.lesson01.exercise04.match_locuinta1
            type: matching_pairs
            tested_text: "robinet curge de ieri apartament bucătărie bună ziua mulțumesc"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Robinetul", right: "the faucet"}
              - {left: "Curge", right: "leaks / flows"}
              - {left: "De ieri", right: "since yesterday"}
              - {left: "Apartament", right: "apartment"}
              - {left: "Bucătărie", right: "kitchen"}
              - {left: "Robinetul curge de ieri.", right: "The faucet has been leaking since yesterday."}
              - {left: "Bună ziua.", right: "Good day."}
              - {left: "Mulțumesc.", right: "Thank you."}
          - content_key: ro.a2.unit25.lesson01.exercise05.order_robinetul_curge_de_ieri
            type: word_order
            tested_text: "Robinetul curge de ieri"
            prompt: {target_blocks: []}
            word_bank: ["Robinetul", "curge", "de", "ieri"]
          - content_key: ro.a2.unit25.lesson01.exercise06.listen_order_robinetul_din_bucatarie
