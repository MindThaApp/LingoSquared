schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain, the same PDF used for units 01-24,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was checked first for dedicated
    household-maintenance-report material. `firecrawl --status` still
    shows 0/1,000 credits, so this unit again falls back to
    established-conventions-only authoring. Grepped the existing
    785-line extraction for robinet/repar/încălzire/meșter and found no
    dedicated lesson content beyond unit18's own basic house-orientation
    vocabulary (dormitor, bucătărie, baie, fereastră) -- every word and
    phrase specific to this unit's maintenance-report scenario is
    authored fresh from general standard Romanian knowledge.

    Continues the A2 grammar progression with "de ieri" (since
    yesterday) as a second duration-marker pattern alongside unit24's
    "de trei zile," and "cât mai curând posibil" (as soon as possible)
    as a new fixed formal-request phrase. Switches protagonist to Mihai
    for this unit specifically: unit18 established Ana owns a house
    (casă) while Mihai has a smaller apartment (apartament) -- a
    maintenance problem reported to a landlord/building manager fits a
    renter, not an owner, so Mihai is the more consistent choice here
    rather than Ana. Introduces one new character, Administratorul
    Ionescu, the building manager -- a new named character for the same
    reason units 21/23/24 introduced Elena/Radu/Doctorița Vasile, since
    neither established job connects to building management.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Fifth Romanian A2 unit. Targets universal.a2.housing.
    report_maintenance_problem (confirmed by grepping
    universal_spine.yaml directly -- prerequisites are
    universal.a1.housing.describe_home, this course's own unit18 (where
    Mihai's apartment was established), and universal.a1.communication.
    basic_phone_contact, treated as satisfied by this unit's own
    building-office visit framing, the same latitude units 21/24 used
    for the identical prerequisite type). 4 lessons, each mapped to a
    distinct spine assessment_requirement: lesson01 (reporting the leak)
    covers report_household_problem's speaking half; lesson02 (asking
    about repair timing) completes report_household_problem; lesson03
    (reading a maintenance confirmation notice) covers
    read_maintenance_notice and previews write_problem_report via its
    writing_prompt; lesson04 (the full Mihai/Administrator dialogue)
    covers understand_problem_description and consolidates all four.

    Reuses unit01's bună/mulțumesc/la revedere/Mihai, unit18's
    apartament/fereastră (Mihai's own established home vocabulary),
    re-declared via a lesson-opening reminder card per the standing
    per-file token-scoping convention. Within this file, lesson02-04
    freely reuse lesson01's own robinet/curge/de ieri without a fresh
    reminder card, matching the established within-file-reuse
    precedent.

    Checked this choice against AUTHORING_GUIDE #11 before finalizing.
    Facts this unit newly states: Mihai's kitchen faucet has been
    leaking since yesterday; a repairman is scheduled to come the next
    day between nine and twelve o'clock. Grepped unit18 to confirm no
    conflict: unit18 states Mihai's apartment has a dormitor, o
    bucătărie, and a fereastră -- a leaking robinet (faucet) in the
    bucătărie (kitchen) is consistent with, not contradictory to, that
    established two-room layout (a kitchen naturally has a faucet;
    nothing in unit18 claims the plumbing is problem-free).

    Checked every fill_in_blank slot against AUTHORING_GUIDE #17: each
    blank's instruction explicitly states the target English meaning
    (lesson01's blank=ieri instruction names "since yesterday"
    explicitly; lesson02's blank=posibil instruction names "as soon as
    possible" explicitly). Checked every listen_select/dialogue_
    comprehension distractor against the standing same-speaker-audio
    rule for lesson04's dialogue -- the Administrator's and Mihai's own
    lines were listed before writing distractors, and every distractor
    is either something neither speaker says in that clip, or (for
    "who says this") genuinely said by the other speaker only.

    Verified every word_order/listen_order exercise's word_bank token
    multiset exactly matches its paired overlay correct_response token
    multiset (case- and diacritic-exact), and every exercise's
    tested_text tokens are covered by an earlier introduced_tokens
    entry in THIS SAME FILE (validate_untaught_vocabulary is scoped
    per realization file, not cross-file -- confirmed the hard way by
    units 21/23's own first-pass compiler errors, checked proactively
    here before running the compiler at all). Needs a fresh-context
    content review before import, same as every other language's
    content.

course:
  realization_key: ro.a2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Fully formal register throughout -- dumneavoastră with the building
    administrator (Mihai and Administratorul Ionescu have never met),
    matching units 21/23/24's identical convention for a first meeting
    with an official/professional.

