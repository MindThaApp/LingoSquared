generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's twelfth B1 unit, continuing the b1_unit01-11 authoring
    pass. Source-material check redone for this specific topic before
    authoring: the same public-domain source used throughout ro's corpus
    ("Basic Romanian Language Lessons," US Peace Corps Moldova, public
    domain, https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for purpose-clause markers (ca să, pentru ca, scop)
    across the full 785-line extraction -- zero hits. This unit is
    therefore authored fresh from general standard Romanian grammar
    knowledge, matching b1_unit01-11's precedent.

    Teaches the spine outcome's full requirement (universal.b1.purpose.
    express_purpose_and_goals): "ca să" + subjunctive ("in order to/so
    that"), a genuinely new purpose-clause construction, applied across
    the three domains the outcome's can_do literally names -- study
    ("studiază engleza ca să obțină o promovare" -- studies English in
    order to get a promotion), work ("lucrează mult ca să economisească
    bani" -- works a lot in order to save money), and saving money
    ("economisește bani ca să cumpere o casă" -- saves money in order to
    buy a house). Verified the subjunctive forms against a reference
    grammar before writing any accepted answer: for regular -a/-e/-i verbs
    the 1st-person-singular subjunctive is identical to the indicative
    (only 3rd person differs, e.g. cumpără -> cumpere), so no separate
    feminine/masculine first-person variant is required for any
    first-person tested_text in this file -- the subjunctive here does
    not gender-inflect. The culminating lesson05 exercises require the
    learner to produce a purpose-clause statement in the first person,
    correctly linking a real action to its stated goal with "ca să" --
    not just recognizing the construction in isolation.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-11) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-11). Introduces Diana studying English for a promotion and
    Mihai saving toward buying a house as new, non-contradicting facts
    about them (neither previously established biography is overwritten;
    Mihai's established profession, inginer, is untouched -- saving money
    is a separate goal, not a job change). Grepped the established
    character profiles before writing: Mihai remains inginer (a1_unit17,
    masculine-only "Sunt inginer"), Ana remains profesoară (feminine-
    only), Diana remains their office colleague (b1_unit04/06) -- no
    profession or biographical fact is contradicted here. All genuinely
    new vocabulary is introduced self-contained within this file; no
    other session's sibling-direction overlay was consulted while
    authoring.
  human_reviewed: true
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second-pass review 2026-10-19: 0 fixes. (The lesson02 grammar note's
    "doar persoana a treia se schimbă" holds for regular verbs; the overlay
    note now adds the a fi exception.)

course:
