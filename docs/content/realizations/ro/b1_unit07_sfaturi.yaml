generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's seventh B1 unit, continuing the b1_unit01-06 authoring pass.
    Source-material check redone for this specific topic before authoring:
    the same public-domain source used throughout ro's corpus ("Basic
    Romanian Language Lessons," US Peace Corps Moldova, public domain,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for advice/suggestion markers (în locul, ași putea,
    sfat, dacă aș fi) across the full 785-line extraction -- zero hits.
    This source is confirmed (a sixth time, on a sixth different B1 topic)
    to be beginner phrasebook-only with no advice/suggestion content.
    This unit is therefore authored fresh from general standard Romanian
    grammar knowledge, matching b1_unit01-06's precedent.

    Teaches the spine outcome's full requirement (universal.b1.social.
    give_advice_and_make_suggestions): (1) the "în locul dumneavoastră,
    eu aș..." idiom ("in your place, I would...") for giving advice, using
    the 1st-person conditional-optativ (aș + short infinitive) already
    introduced for hypotheticals in b1_unit03 but here repurposed for
    advice-giving rather than a hypothetical condition; (2) the 2nd-person
    formal conditional "ați putea să..." ("you could...") for a softer
    suggestion, which is genuinely new -- b1_unit03 only used 1st/3rd
    person conditional forms (aș, ar), never the 2sg-formal "ați" form,
    so this unit introduces that verb-paradigm slot self-contained; and
    (3) responding to advice by accepting ("bună idee, voi încerca asta"),
    declining with a reason ("am încercat deja, dar nu a funcționat"), or
    asking a follow-up ("ce ar trebui să fac dacă nu funcționează?") --
    the culminating lesson05 dialogue and its exercises require BOTH
    halves of the compound outcome (giving advice responsive to a stated
    problem, AND reacting to advice received) in the same exchange, not
    just isolated advice-giving in a vacuum.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-06) -- Mihai has a
    recurring computer problem and asks Ana for advice, matching the
    established dumneavoastră-formal register between them (pinned since
    b1_unit01, reconfirmed b1_unit06). No new characters introduced.
    Reuses "computerul" (established a1_unit17-adjacent office vocabulary)
    without re-teaching it as new; "IT" kept as an unadapted loanword,
    consistent with standard spoken Romanian office usage. Grammar note:
    the conditional-optativ verb form itself is invariant for gender (no
    participle agreement), so no feminine first-person variant is needed
    for "aș suna"/"aș vorbi"-type answers regardless of which character
    speaks them -- verified against a reference grammar before writing
    any accepted answer. All genuinely new vocabulary and the new "ați"
    conditional slot are introduced self-contained within this file; no
    other session's sibling-direction overlay was consulted while
    authoring.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second-pass review 2026-10-19: 0 fixes. NATIVE FLAGS: Ana is
    canonically a teacher at a school (a1_unit17); the provenance note's
    "same office" framing is course-wide drift, though no learner-facing
    line here contradicts her job. The grammar_advice_conditional target
    sentence embeds English labels ("1st person", "2nd person formal")
    inside Romanian text -- harmless, left as is.

course:
  realization_key: ro.b1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continues the established dumneavoastră-default register from ro
    A1/A2/B1 (units 01-26, b1_unit01-06): Ana and Mihai address each
    other formally (dumneavoastră) throughout, matching their existing
    corpus-wide office relationship. The advice construction "în locul
    dumneavoastră" and the 2nd-person-formal "ați putea" are the formal
    equivalents of the informal "în locul tău"/"ai putea" pattern, chosen
    to stay register-consistent with the whole ro corpus rather than
    introduce a one-off informal exception.

