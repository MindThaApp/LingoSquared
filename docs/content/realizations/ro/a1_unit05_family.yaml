schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-04
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- the same 18-page real extractable
    text layer, not a scan). Real sourced material, scattered across
    three different spots the same way unit04's time material was:
    Lesson 2's alphabet/pronunciation table gives "familie" (family) and
    "mamă" (mother) and "tată" (father) as its example words for F/M/T;
    Lesson 3 "Introductions" has "Ai copii?" (Do you have children?),
    "Am un fiu." (I have a son.), "Am o fiică." (I have a daughter.),
    "Tu ai fraţi? Surori?" (Do you have any brothers? Sisters?), "Eşti
    căsătorit?" (Are you married?), and the plain "Da."/"Nu." (Yes./No.)
    from Lesson 2's basic-expressions list; Lesson 8's grammar section
    (definite articles / possession) gives the real example "Fratele meu
    este doctor." (My brother is a doctor.), the sourced anchor for this
    unit's meu/mea possessive cards, and Lesson 8's own vocabulary list
    separately confirms "soră – sister" and "copil – child (m.)." As in
    every prior Romanian unit, the source uses the pre-1993 Moldovan/
    Communist-era î-everywhere and cedilla-diacritic spelling convention
    (Ai fraţi, Eşti căsătorit) rather than post-1993 standard Romanian
    orthography (Ai frați, Ești căsătorit) -- every sourced word/phrase
    was respelled to modern standard orthography before use, the
    identical modernization already applied in units 01-04, not a
    dialect swap. Freshly authored, not sourced, and disclosed honestly
    per AUTHORING_GUIDE #10's "if the source doesn't cover the topic
    adequately, author fresh" -- this source has no equivalent for
    "părinți" (parents), "frați"/"surori" as a plural vocabulary pair in
    their own right (only appears inside the one sourced question), or
    for a deliberately scoped-down unit that stops at parents/siblings/
    children/marital status rather than the wider extended-family tree
    (grandparents, aunts, uncles) some other languages' own family units
    cover -- a genuine bootstrap-pace scope decision, not an oversight,
    matching this course's established 3-lesson size over nl's fuller
    6-lesson shape for the same topic (see unit04's own review note for
    the same precedent). Also freshly authored: every vocabulary
    example: sentence (AUTHORING_GUIDE #19), and lesson03's closing
    Ana/Mihai family-conversation dialogue -- a new scenario continuing
    the recurring characters, reusing this unit's own vocabulary only
    (pure recap, no new tokens), per the standing "untaught vocabulary
    must be re-declared per-file" convention -- every token reused from
    an earlier ro unit (am, un, o, și, mare, câți, ai, aveți, doi, nu) is
    re-declared via this file's own reminder grammar_note cards before
    any exercise tests it. Authored at schema_version 1.1 from the
    start -- every kind:vocabulary card carries a real example: sentence
    with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Fifth Romanian unit, first draft, continuing directly from unit04.
    Targets universal.a1.family.describe_relationships, the spine
    outcome immediately following universal.a1.time.ask_tell_time in
    universal_spine.yaml's own order -- confirmed by reading
    nl/a1_unit05_family.yaml before authoring (nl's own unit05 is also
    "family," the same next-outcome pattern this course's unit01-04 has
    already tracked at every step; fa's own unit05 lands on "places"
    only because fa's unit04 already covered family, not because family
    isn't genuinely next in spine order for a course whose own unit04
    just finished "time," exactly as ro's does). 3 lessons (bootstrap
    pace, matching units 01-04's own size, not nl's fuller 6-lesson
    shape for the same topic). Deliberately scoped to parents, siblings,
    children, and marital status only -- explicitly does NOT cover
    grandparents/aunts/uncles, disclosed above, a real scope trim to
    keep this bootstrap unit to 3 lessons rather than a gap found late.
    Reuses unit02's tu/dumneavoastră-contrasted "ai"/"aveți" (I have/you
    have, first taught for age) for the parallel "do you have
    siblings/children" questions -- the same register-contrast grammar
    point, a new communicative use, not a new grammar point to teach
    from scratch. Lesson03's dialogue deliberately introduces zero
    brand-new vocabulary in its six lines (all reuse only tokens already
    taught earlier in this same unit or re-declared from an earlier
    unit), the same pure-recap style unit01's and unit04's own lesson03s
    used, and closes with "Și dumneavoastră?" / "La revedere!" as a
    direct callback to unit01's own established closing pattern. Needs a
    fresh-context content review before import, same as every other
    language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01/02/03/04's register split and Ana/Mihai's own
    established dumneavoastră register with each other. This unit adds
    the tu/dumneavoastră-paired "Ai frați?"/"Aveți frați?" and "Câți
    copii ai?"/"Câți copii aveți?" question pairs (parallel to unit02's
    own ai/aveți age questions); the closing dialogue keeps Ana and
    Mihai's existing dumneavoastră register intact.

media_assets:
  - content_key: ro.a1.audio.mama_mea.neutral.01
    language: ro
    text: "Mama mea."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.familie_mare.neutral.01
    language: ro
    text: "Am o familie mare."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.fiu_fiica.neutral.01
    language: ro
    text: "Am un fiu și o fiică."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.dialogue.familia.01
    language: ro
    text: "Ana: Aveți frați, Mihai?\nMihai: Da, am un frate și o soră. Dumneavoastră aveți copii?\nAna: Da, am o fiică. Și dumneavoastră?\nMihai: Am un fiu.\nAna: Bine! La revedere!\nMihai: La revedere, Ana!"
    voice_hint: adult_female_and_male_neutral_polite
    status: pending_generation

units:
  - content_key: ro.a1.unit05.family
    title: "Familia"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.family.describe_relationships
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit05.lesson01.familia_mea
        title: "Familia mea"
        spine_outcome_id: universal.a1.family.describe_relationships
        teaching:
          - content_key: ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare
            kind: grammar_note
            target: {text: "am · un · o · și · mare", language_code: ro, direction: ltr}
            introduced_tokens: [am, un, o, și, mare]
          - content_key: ro.a1.unit05.lesson01.teach.familie
            kind: vocabulary
            target: {text: "Familie", language_code: ro, direction: ltr}
            introduced_tokens: [familie]
            example: {text: "Am o familie mare.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson01.teach.mama
            kind: vocabulary
            target: {text: "Mamă", language_code: ro, direction: ltr}
            introduced_tokens: [mamă]
            example: {text: "Mihai are o mamă și un tată.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson01.teach.tata
            kind: vocabulary
            target: {text: "Tată", language_code: ro, direction: ltr}
            introduced_tokens: [tată]
            example: {text: "Tatăl meu este profesor.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson01.teach.parintii
            kind: vocabulary
            target: {text: "Părinți", language_code: ro, direction: ltr}
            introduced_tokens: [părinți]
            example: {text: "Părinții mei locuiesc în România.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson01.teach.meu_mea
            kind: grammar_note
            target: {text: "meu (masculin) · mea (feminin)", language_code: ro, direction: ltr}
            introduced_tokens: [meu, mea]
          - content_key: ro.a1.unit05.lesson01.teach.mama_mea
            kind: phrase
            target: {text: "Mama mea", language_code: ro, direction: ltr}
            introduced_tokens: [mama, mea]
          - content_key: ro.a1.unit05.lesson01.teach.tatal_meu
            kind: phrase
            target: {text: "Tatăl meu", language_code: ro, direction: ltr}
            introduced_tokens: [tatăl, meu]
          - content_key: ro.a1.unit05.lesson01.teach.mama_si_tatal
            kind: phrase
            target: {text: "Mama mea și tatăl meu.", language_code: ro, direction: ltr}
            introduced_tokens: [mama, mea, și, tatăl, meu]
        exercises:
          - content_key: ro.a1.unit05.lesson01.exercise01.choose_familie
            type: multiple_choice
            tested_text: "familie"
            prompt:
              target_blocks:
                - {text: "family", language_code: en, direction: ltr}
          - content_key: ro.a1.unit05.lesson01.exercise02.choose_tata
            type: multiple_choice
            tested_text: "tată"
            prompt:
              target_blocks:
                - {text: "father", language_code: en, direction: ltr}
          - content_key: ro.a1.unit05.lesson01.exercise03.listen_mama_mea
            type: listen_select
            tested_text: "Mama mea"
            media_asset_key: ro.a1.audio.mama_mea.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit05.lesson01.exercise04.match_family_core
            type: matching_pairs
            tested_text: "familie mamă tată părinți meu mea mama mea tatăl meu"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Familie", right: "family"}
              - {left: "Mamă", right: "mother"}
              - {left: "Tată", right: "father"}
              - {left: "Părinți", right: "parents"}
              - {left: "Meu", right: "my (masc.)"}
              - {left: "Mea", right: "my (fem.)"}
              - {left: "Mama mea", right: "My mother"}
              - {left: "Tatăl meu", right: "My father"}
          - content_key: ro.a1.unit05.lesson01.exercise05.order_mama_tatal
            type: word_order
            tested_text: "Mama mea și tatăl meu"
            prompt: {target_blocks: []}
            word_bank: ["Mama", "mea", "și", "tatăl", "meu"]
          - content_key: ro.a1.unit05.lesson01.exercise06.listen_order_familie_mare
            type: listen_order
            tested_text: "Am o familie mare"
            media_asset_key: ro.a1.audio.familie_mare.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["mare", "Am", "familie", "o"]
          - content_key: ro.a1.unit05.lesson01.exercise07.complete_tatal_meu
            type: fill_in_blank
            tested_text: "meu"
            prompt:
              target_blocks:
                - {text: "Tatăl ___ este profesor.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson01.exercise08.speak_mama_tatal
            type: speak_response
            tested_text: "mama mea și tatăl meu"
            prompt:
              target_blocks:
                - {text: "Say: my mother and my father.", language_code: en, direction: ltr}

      - content_key: ro.a1.unit05.lesson02.frati_si_copii
        title: "Frați și copii"
        spine_outcome_id: universal.a1.family.describe_relationships
        teaching:
          - content_key: ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu
            kind: grammar_note
            target: {text: "câți · ai · aveți · doi · nu", language_code: ro, direction: ltr}
            introduced_tokens: [câți, ai, aveți, doi, nu]
          - content_key: ro.a1.unit05.lesson02.teach.da
            kind: vocabulary
            target: {text: "Da", language_code: ro, direction: ltr}
            introduced_tokens: [da]
            example: {text: "Da, am un frate.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.teach.frate_sora
            kind: vocabulary
            target: {text: "Frate, soră", language_code: ro, direction: ltr}
            introduced_tokens: [frate, soră]
            example:
              - {text: "Am un frate.", language_code: ro, direction: ltr}
              - {text: "Am o soră.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.teach.frati_surori
            kind: vocabulary
            target: {text: "Frați, surori", language_code: ro, direction: ltr}
            introduced_tokens: [frați, surori]
            example: {text: "Ai frați sau surori?", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.teach.ai_frati
            kind: phrase
            target: {text: "Ai frați?", language_code: ro, direction: ltr}
            introduced_tokens: [ai, frați]
          - content_key: ro.a1.unit05.lesson02.teach.aveti_frati
            kind: phrase
            target: {text: "Aveți frați?", language_code: ro, direction: ltr}
            introduced_tokens: [aveți, frați]
          - content_key: ro.a1.unit05.lesson02.teach.copil_copii
            kind: vocabulary
            target: {text: "Copil, copii", language_code: ro, direction: ltr}
            introduced_tokens: [copil, copii]
            example: {text: "Am doi copii.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.teach.fiu_fiica
            kind: vocabulary
            target: {text: "Fiu, fiică", language_code: ro, direction: ltr}
            introduced_tokens: [fiu, fiică]
            example:
              - {text: "Am un fiu.", language_code: ro, direction: ltr}
              - {text: "Am o fiică.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.teach.cati_copii_ai
            kind: phrase
            target: {text: "Câți copii ai?", language_code: ro, direction: ltr}
            introduced_tokens: [câți, copii, ai]
          - content_key: ro.a1.unit05.lesson02.teach.casatorit
            kind: vocabulary
            target: {text: "Căsătorit", language_code: ro, direction: ltr}
            introduced_tokens: [căsătorit]
            example: {text: "Ești căsătorit?", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a1.unit05.lesson02.exercise01.choose_da
            type: multiple_choice
            tested_text: "da"
            prompt:
              target_blocks:
                - {text: "yes", language_code: en, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.exercise02.choose_frate
            type: multiple_choice
            tested_text: "frate"
            prompt:
              target_blocks:
                - {text: "brother", language_code: en, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.exercise03.listen_fiu_fiica
            type: listen_select
            tested_text: "Am un fiu și o fiică"
            media_asset_key: ro.a1.audio.fiu_fiica.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit05.lesson02.exercise04.match_frati_copii
            type: matching_pairs
            tested_text: "da frate soră copil copii fiu fiică căsătorit"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Da", right: "yes"}
              - {left: "Frate", right: "brother"}
              - {left: "Soră", right: "sister"}
              - {left: "Copil", right: "child"}
              - {left: "Copii", right: "children"}
              - {left: "Fiu", right: "son"}
              - {left: "Fiică", right: "daughter"}
              - {left: "Căsătorit", right: "married"}
          - content_key: ro.a1.unit05.lesson02.exercise05.order_cati_copii_ai
            type: word_order
            tested_text: "Câți copii ai"
            prompt: {target_blocks: []}
            word_bank: ["Câți", "copii", "ai"]
          - content_key: ro.a1.unit05.lesson02.exercise06.listen_order_fiu_fiica
            type: listen_order
            tested_text: "Am un fiu și o fiică"
            media_asset_key: ro.a1.audio.fiu_fiica.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["fiu", "Am", "un", "și", "o", "fiică"]
          - content_key: ro.a1.unit05.lesson02.exercise07.complete_ai_frati
            type: fill_in_blank
            tested_text: "frați"
            prompt:
              target_blocks:
                - {text: "Ai ___? Da, am un frate.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson02.exercise08.speak_doi_copii
            type: speak_response
            tested_text: "am doi copii"
            prompt:
              target_blocks:
                - {text: "Say: I have two children.", language_code: en, direction: ltr}

      - content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
        title: "O discuție despre familie"
        spine_outcome_id: universal.a1.family.describe_relationships
        teaching:
          - content_key: ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere
            kind: grammar_note
            target: {text: "bine · la revedere · Ana · Mihai", language_code: ro, direction: ltr}
            introduced_tokens: [bine, la, revedere, Ana, Mihai]
          - content_key: ro.a1.unit05.lesson03.teach.line01
            kind: dialogue
            target:
              text: "Aveți frați, Mihai?"
              language_code: ro
              direction: ltr
              speaker: Ana
            introduced_tokens: []
          - content_key: ro.a1.unit05.lesson03.teach.line02
            kind: dialogue
            target:
              text: "Da, am un frate și o soră. Dumneavoastră aveți copii?"
              language_code: ro
              direction: ltr
              speaker: Mihai
            introduced_tokens: []
          - content_key: ro.a1.unit05.lesson03.teach.line03
            kind: dialogue
            target:
              text: "Da, am o fiică. Și dumneavoastră?"
              language_code: ro
              direction: ltr
              speaker: Ana
            introduced_tokens: []
          - content_key: ro.a1.unit05.lesson03.teach.line04
            kind: dialogue
            target:
              text: "Am un fiu."
              language_code: ro
              direction: ltr
              speaker: Mihai
            introduced_tokens: []
          - content_key: ro.a1.unit05.lesson03.teach.line05
            kind: dialogue
            target:
              text: "Bine! La revedere!"
              language_code: ro
              direction: ltr
              speaker: Ana
            introduced_tokens: []
          - content_key: ro.a1.unit05.lesson03.teach.line06
            kind: dialogue
            target:
              text: "La revedere, Ana!"
              language_code: ro
              direction: ltr
              speaker: Mihai
            introduced_tokens: []
        exercises:
          - content_key: ro.a1.unit05.lesson03.exercise01.choose_who_has_fiica
            type: multiple_choice
            tested_text: "Ana"
            prompt:
              target_blocks:
                - {text: "Da, am o fiică. Și dumneavoastră?", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson03.exercise02.dialogue_comprehend_family
            type: dialogue_comprehension
            tested_text: "un fiu"
            media_asset_key: ro.a1.audio.dialogue.familia.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit05.lesson03.exercise03.reading_comprehend_mihai
            type: reading_comprehension
            tested_text: "un frate și o soră"
            prompt:
              target_blocks:
                - {text: "Mihai: Da, am un frate și o soră.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson03.exercise04.match_unit_review
            type: matching_pairs
            tested_text: "familie mamă tată frate soră copil copii fiu fiică căsătorit da"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Familie", right: "family"}
              - {left: "Mamă", right: "mother"}
              - {left: "Tată", right: "father"}
              - {left: "Frate", right: "brother"}
              - {left: "Soră", right: "sister"}
              - {left: "Copil", right: "child"}
              - {left: "Copii", right: "children"}
              - {left: "Fiu", right: "son"}
              - {left: "Fiică", right: "daughter"}
              - {left: "Căsătorit", right: "married"}
              - {left: "Da", right: "yes"}
          - content_key: ro.a1.unit05.lesson03.exercise05.order_am_un_fiu
            type: word_order
            tested_text: "Am un fiu"
            prompt: {target_blocks: []}
            word_bank: ["Am", "un", "fiu"]
          - content_key: ro.a1.unit05.lesson03.exercise06.complete_o_fiica
            type: fill_in_blank
            tested_text: "fiică"
            prompt:
              target_blocks:
                - {text: "Da, am o ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson03.exercise07.respond_as_ana
            type: dialogue_response
            tested_text: "da am o fiică"
            prompt:
              target_blocks:
                - {text: "Mihai: Dumneavoastră aveți copii?", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit05.lesson03.exercise08.speak_closing
            type: speak_response
            tested_text: "bine la revedere"
            prompt:
              target_blocks:
                - {text: "Say: Good! Goodbye!", language_code: en, direction: ltr}
