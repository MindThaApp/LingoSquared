target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-03
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- an 18-page, real extractable text
    layer, not a scan). Unlike units 01-03, this source has no single
    dedicated "Time" lesson -- clock-time phrases are scattered across
    Lesson 4 ("Some Basic Questions and Answers"), Lesson 8's vocabulary
    list ("Articles"), and Lesson 17's listening-exercise dialogues, so
    this unit adapts real scattered material rather than one continuous
    lesson, disclosed honestly per AUTHORING_GUIDE #10 ("if the source
    doesn't cover the topic adequately, author fresh, disclosed
    honestly" -- here the source covers PART of the topic, so this is a
    hybrid: real sourced anchors plus genuinely fresh material). Real
    sourced material: "oră -- hour (f.)" (Lesson 8's own vocabulary list)
    and its example "Maşina va veni peste o oră" (the car will come in an
    hour); "Cît este ora?" (Lesson 4, "What time is it?"); "La ce oră?"
    and "La ora 9." (Lesson 17's dialogue, "At what time?" / "At 9
    o'clock" -- the number was respelled from the digit to the word
    "nouă" for consistency with how every other number in this course is
    written, not a wording change); "Peste jumătate de oră" (Lesson 17,
    confirms "jumătate" = half); "Este tîrziu" (Lesson 4, "it is late");
    "seara" used adverbially in Lesson 17's "probabil pe la 7 seara"
    ("probably around 7 in the evening"); and "dimineaţa" / "Noapte bună"
    from Lesson 3's greeting list. As in units 01-03, the source uses the
    pre-1993 Moldovan/Communist-era î-everywhere and cedilla-diacritic
    spelling convention (Cît, tîrziu, dimineaţa with ţ) rather than
    post-1993 standard Romanian orthography (Cât, târziu, dimineața with
    ț) -- every sourced word was respelled to modern standard Romanian
    orthography before use, the identical modernization already applied
    in units 01-03, not a dialect swap. Freshly authored, not sourced,
    but independently verified for accuracy (WebSearch cross-referencing
    RomanianPod101 and Omniglot's own Romanian time-telling pages, not
    Firecrawl -- this is grammar-rule verification, not a content
    source): the full quarter-hour system (un sfert / și un sfert / fără
    un sfert), the genuine "ora unu" (never "ora una") vs "ora două"
    gender-agreement irregularity noted explicitly on its own card, and
    "după-amiaza" (afternoon, no equivalent anywhere in this PD source).
    Also freshly authored: every vocabulary example: sentence
    (AUTHORING_GUIDE #19), and lesson03's "cursul" (language class)
    scheduling scenario and its Ana/Mihai dialogue -- a new scenario
    continuing the recurring characters, deliberately NOT reusing
    unit03's "întâlnirea" (the meeting) to avoid a cross-file
    introduced_tokens dependency, per the standing "untaught vocabulary
    must be re-declared per-file" convention. Authored at schema_version
    1.1 from the start -- every kind:vocabulary card carries a real
    example: sentence with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19). Checked clean: no same-speaker
    distractor collisions, no stray YAML booleans, matching_pairs/
    word_order shapes correct (including the two listen_order exercises'
    word_bank/correct_response token sets), every exercise type
    registered, no jargon leaks, correct and consistent diacritics
    (including the "ora unu, not ora una" genuine irregularity note),
    natural Romanian throughout. No real bugs found; no changes made
    to this unit.
    Fourth Romanian unit, first draft, continuing directly from unit03.
    Targets universal.a1.time.ask_tell_time, the spine outcome
    immediately following universal.a1.dates.exchange_calendar_dates in
    universal_spine.yaml's own order -- confirmed by reading
    nl/a1_unit04_time.yaml before authoring (nl's own unit04 is also
    "time," the same next-outcome pattern units 01-03 already
    established; fa's and es's unit04/unit03 land on different topics
    only because their own unit01/02/03 split greetings/introductions/
    numbers differently, not because "time" isn't genuinely next in
    spine order for a course that already covered numbers in unit02 and
    dates in unit03, exactly as ro's does). 3 lessons (bootstrap pace,
    matching units 01-03's own size, not nl's fuller 6-lesson shape for
    the same topic). Deliberately keeps every clock-time phrase anchored
    on the explicit word "ora" (ora unu, ora două, ora trei, la ora
    nouă) rather than ever dropping it for a bare number -- some
    references show the bare-number form eliding "ora" and defaulting
    to masculine (e.g. "e doi și un sfert"), which would need its own
    separate gender-disambiguation note; staying with explicit "ora"
    throughout keeps this A1 unit's grading and grammar internally
    consistent and matches the one full sourced example ("La ora 9").
    Lesson03's dialogue deliberately introduces zero brand-new
    vocabulary in its four lines (all reuse only tokens already taught
    earlier in this same unit), the same pure-recap style unit01's and
    unit03's own lesson03s used.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01/02/03's register split and Ana/Mihai's own
    established dumneavoastră register with each other. Stating a time
    or asking "Cât este ora?" does not itself change with register
    (este is invariant, and this unit's new time vocabulary has no
    tu/dumneavoastră-sensitive forms), so this unit's new content is
    register-neutral; the closing dialogue keeps Ana and Mihai's
    existing polite register intact rather than introducing tu forms.

