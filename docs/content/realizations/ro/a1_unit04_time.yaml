units:
  - content_key: ro.a1.unit04.time
    title: "Spunem ora"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.time.ask_tell_time
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
        title: "Ora fixă și jumătate"
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - content_key: ro.a1.unit04.lesson01.teach.este
            kind: grammar_note
            target: {text: "este", language_code: ro, direction: ltr}
            introduced_tokens: [este]
          - content_key: ro.a1.unit04.lesson01.teach.ora
            kind: vocabulary
            target: {text: "Ora", language_code: ro, direction: ltr}
            introduced_tokens: [ora]
            example: {text: "Este ora unu.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit04.lesson01.teach.ora_unu
            kind: phrase
            target: {text: "Ora unu", language_code: ro, direction: ltr}
            introduced_tokens: [ora, unu]
          - content_key: ro.a1.unit04.lesson01.teach.ora_doua
            kind: phrase
            target: {text: "Ora două", language_code: ro, direction: ltr}
            introduced_tokens: [ora, două]
          - content_key: ro.a1.unit04.lesson01.teach.ora_gender_note
            kind: grammar_note
            target: {text: "ora unu (nu \"ora una\") · ora două (nu \"ora doi\")", language_code: ro, direction: ltr}
            introduced_tokens: []
          - content_key: ro.a1.unit04.lesson01.teach.ora_trei
            kind: phrase
            target: {text: "Ora trei", language_code: ro, direction: ltr}
            introduced_tokens: [ora, trei]
          - content_key: ro.a1.unit04.lesson01.teach.jumatate
            kind: vocabulary
            target: {text: "Jumătate", language_code: ro, direction: ltr}
            introduced_tokens: [jumătate]
            example: {text: "Ora unu și jumătate.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit04.lesson01.teach.ora_unu_jumatate
            kind: phrase
            target: {text: "Este ora unu și jumătate.", language_code: ro, direction: ltr}
            introduced_tokens: [este, ora, unu, și, jumătate]
          - content_key: ro.a1.unit04.lesson01.teach.cat_e_ora
            kind: phrase
            target: {text: "Cât este ora?", language_code: ro, direction: ltr}
            introduced_tokens: [cât, este, ora]
        exercises:
          - content_key: ro.a1.unit04.lesson01.exercise01.choose_ora_unu
            type: multiple_choice
            tested_text: "ora unu"
            prompt:
              target_blocks:
                - {text: "1:00", language_code: en, direction: ltr}
          - content_key: ro.a1.unit04.lesson01.exercise02.listen_ora_doua
            type: listen_select
            tested_text: "Este ora două"
            media_asset_key: ro.a1.audio.ora_doua.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit04.lesson01.exercise03.choose_ora_trei
            type: multiple_choice
            tested_text: "ora trei"
            prompt:
              target_blocks:
                - {text: "3:00", language_code: en, direction: ltr}
          - content_key: ro.a1.unit04.lesson01.exercise04.match_hours
            type: matching_pairs
            tested_text: "ora unu ora două ora trei jumătate cât este ora este ora unu și jumătate"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Ora unu", right: "1:00"}
              - {left: "Ora două", right: "2:00"}
              - {left: "Ora trei", right: "3:00"}
              - {left: "Jumătate", right: "half"}
              - {left: "Cât este ora?", right: "What time is it?"}
              - {left: "Este ora unu și jumătate.", right: "1:30"}
          - content_key: ro.a1.unit04.lesson01.exercise05.order_cat_e_ora
            type: word_order
            tested_text: "Cât este ora"
            prompt: {target_blocks: []}
            word_bank: ["Cât", "este", "ora"]
          - content_key: ro.a1.unit04.lesson01.exercise06.listen_order_ora_jumatate
            type: listen_order
            tested_text: "Este ora unu și jumătate"
            media_asset_key: ro.a1.audio.ora_unu_jumatate.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["jumătate", "Este", "unu", "și", "ora"]
          - content_key: ro.a1.unit04.lesson01.exercise07.speak_ora_trei
            type: speak_response
            tested_text: "Este ora trei"
            prompt:
              target_blocks:
                - {text: "3:00", language_code: en, direction: ltr}
          - content_key: ro.a1.unit04.lesson01.exercise08.listen_type_ora_doua
            type: listen_type
            tested_text: "Este ora două"
            media_asset_key: ro.a1.audio.ora_doua.neutral.01
            prompt: {target_blocks: []}

      - content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
        title: "Un sfert și cum întrebăm ora"
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
