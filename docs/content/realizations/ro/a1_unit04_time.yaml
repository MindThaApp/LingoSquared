          - content_key: ro.a1.unit04.lesson02.teach.sfert_rule
            kind: grammar_note
            target: {text: "și un sfert = +15 minute · fără un sfert = -15 minute", language_code: ro, direction: ltr}
            introduced_tokens: []
          - content_key: ro.a1.unit04.lesson02.teach.ora_doua_sfert
            kind: phrase
            target: {text: "Este ora două și un sfert.", language_code: ro, direction: ltr}
            introduced_tokens: [este, ora, două, și, un, sfert]
          - content_key: ro.a1.unit04.lesson02.teach.fara
            kind: vocabulary
            target: {text: "Fără", language_code: ro, direction: ltr}
            introduced_tokens: [fără]
            example: {text: "Este ora trei fără un sfert.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert
            kind: phrase
            target: {text: "Este ora trei fără un sfert.", language_code: ro, direction: ltr}
            introduced_tokens: [este, ora, trei, fără, un, sfert]
          - content_key: ro.a1.unit04.lesson02.teach.la_ce_ora
            kind: phrase
            target: {text: "La ce oră?", language_code: ro, direction: ltr}
            introduced_tokens: [la, ce, oră]
          - content_key: ro.a1.unit04.lesson02.teach.la_ora_noua
            kind: phrase
            target: {text: "La ora nouă.", language_code: ro, direction: ltr}
            introduced_tokens: [la, ora, nouă]
          - content_key: ro.a1.unit04.lesson02.teach.tarziu
            kind: vocabulary
            target: {text: "Târziu", language_code: ro, direction: ltr}
            introduced_tokens: [târziu]
            example: {text: "Este târziu!", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a1.unit04.lesson02.exercise01.choose_ora_doua_sfert
            type: multiple_choice
            tested_text: "ora două și un sfert"
            prompt:
              target_blocks:
                - {text: "2:15", language_code: en, direction: ltr}
          - content_key: ro.a1.unit04.lesson02.exercise02.listen_ora_trei_fara_sfert
            type: listen_select
            tested_text: "Este ora trei fără un sfert"
            media_asset_key: ro.a1.audio.ora_trei_fara_sfert.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit04.lesson02.exercise03.choose_la_ce_ora
            type: multiple_choice
            tested_text: "la ce oră"
            prompt:
              target_blocks:
                - {text: "At what time?", language_code: en, direction: ltr}
          - content_key: ro.a1.unit04.lesson02.exercise04.match_time_phrases
            type: matching_pairs
            tested_text: "ora două și un sfert ora trei fără un sfert la ce oră la ora nouă târziu un sfert"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Ora două și un sfert", right: "2:15"}
              - {left: "Ora trei fără un sfert", right: "2:45"}
              - {left: "La ce oră?", right: "At what time?"}
              - {left: "La ora nouă.", right: "At nine o'clock."}
              - {left: "Târziu", right: "late"}
              - {left: "Un sfert", right: "a quarter"}
          - content_key: ro.a1.unit04.lesson02.exercise05.order_la_ce_ora
            type: word_order
            tested_text: "La ce oră"
            prompt: {target_blocks: []}
            word_bank: ["La", "ce", "oră"]
          - content_key: ro.a1.unit04.lesson02.exercise06.listen_order_ora_doua_sfert
            type: listen_order
            tested_text: "Este ora două și un sfert"
            media_asset_key: ro.a1.audio.ora_doua_sfert.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["și", "Este", "sfert", "ora", "un", "două"]
          - content_key: ro.a1.unit04.lesson02.exercise07.complete_sfert
            type: fill_in_blank
            tested_text: "sfert"
            prompt:
              target_blocks:
                - {text: "Este ora trei fără un ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit04.lesson02.exercise08.speak_la_ora_noua
            type: speak_response
            tested_text: "La ora nouă"
            prompt:
              target_blocks:
                - {text: "At nine o'clock.", language_code: en, direction: ltr}

      - content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
