generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    Romanian's fourteenth B1 unit, continuing the b1_unit01-13 authoring
    pass. Source-material check redone for this specific topic before
    authoring: the same public-domain source used throughout ro's corpus
    ("Basic Romanian Language Lessons," US Peace Corps Moldova, public
    domain, https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for time-clause markers (când) across the full
    785-line extraction -- no dedicated habitual-vs-past time-clause
    lesson found. This unit is therefore authored fresh from general
    standard Romanian grammar knowledge, matching b1_unit01-13's
    precedent.

    Teaches the spine outcome's full requirement (universal.b1.
    sequencing.describe_events_with_time_clauses): a time-clause
    construction with "când" ("when") describing one event relative to
    another, across an everyday routine (a present/habitual time clause,
    "când ajung la birou, beau o cafea" -- when I arrive at the office, I
    drink a coffee) and a past narrative (a past time clause, "când am
    ajuns la birou, am băut o cafea" -- when I arrived at the office, I
    drank a coffee), with an explicit lesson distinguishing the habitual
    present form from the one-time past form -- matching the outcome's
    literal "distinguishing a habitual/present time clause from a past
    one" requirement.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-13) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-13). Mihai's daily office routine (arriving, having
    coffee) is a new, non-contradicting habit; Diana's meeting arrival
    yesterday reuses the established ședința despre proiectul nou
    (b1_unit05/11) as the past-narrative event, adding a new fact (when
    Diana arrived and what she did) without contradicting anything
    previously stated about that meeting. Grepped the established
    character profiles before writing: Mihai remains inginer
    (a1_unit17, masculine-only "Sunt inginer"), Ana remains profesoară
    (feminine-only), Diana remains their office colleague (b1_unit04/06)
    -- no profession or biographical fact is contradicted here. All
    genuinely new vocabulary is introduced self-contained within this
    file; no other session's sibling-direction overlay was consulted
    while authoring.
