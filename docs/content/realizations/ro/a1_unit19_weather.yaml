units:
  - content_key: ro.a1.unit19.weather
    title: "Vremea"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.weather.describe_basic_weather
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit19.lesson01.vremea_de_azi
        title: "Vremea de azi"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: ro.a1.unit19.lesson01.teach.reminder_ana_este
            kind: grammar_note
            target: {text: "Ana · Este · Și", language_code: ro, direction: ltr}
            introduced_tokens: [Ana, este, și]
          - content_key: ro.a1.unit19.lesson01.teach.reminder_astazi
            kind: grammar_note
            target: {text: "Astăzi", language_code: ro, direction: ltr}
            introduced_tokens: [astăzi]
          - content_key: ro.a1.unit19.lesson01.teach.vreme_vocab
            kind: vocabulary
            target: {text: "Vreme", language_code: ro, direction: ltr}
            introduced_tokens: [vreme, vremea]
            example:
              - {text: "Cum este vremea?", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase
            kind: phrase
            target: {text: "Cum este vremea?", language_code: ro, direction: ltr}
            introduced_tokens: [cum, este, vremea]
          - content_key: ro.a1.unit19.lesson01.teach.soare_vocab
            kind: vocabulary
            target: {text: "Soare", language_code: ro, direction: ltr}
            introduced_tokens: [soare]
            example:
              - {text: "Astăzi este soare.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson01.teach.cald_vocab
            kind: vocabulary
            target: {text: "Cald", language_code: ro, direction: ltr}
            introduced_tokens: [cald]
            example:
              - {text: "Astăzi este cald.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase
            kind: phrase
            target: {text: "Astăzi este soare. Este cald.", language_code: ro, direction: ltr}
            introduced_tokens: [astăzi, este, soare, cald]
        exercises:
          - content_key: ro.a1.unit19.lesson01.exercise01.choose_soare
            type: multiple_choice
            tested_text: "soare"
            prompt:
              target_blocks:
                - {text: "sun / sunny", language_code: en, direction: ltr}
          - content_key: ro.a1.unit19.lesson01.exercise02.choose_cald
            type: multiple_choice
            tested_text: "cald"
            prompt:
              target_blocks:
                - {text: "warm / hot", language_code: en, direction: ltr}
          - content_key: ro.a1.unit19.lesson01.exercise03.listen_astazi_este_soare
            type: listen_select
            tested_text: "Astăzi este soare"
            media_asset_key: ro.a1.audio.weather.astazi_este_soare.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit19.lesson01.exercise04.match_weather1
            type: matching_pairs
            tested_text: "vreme soare cald cum este vremea astăzi este soare astăzi este cald este"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Vreme", right: "weather"}
              - {left: "Soare", right: "sun / sunny"}
              - {left: "Cald", right: "warm / hot"}
              - {left: "Este", right: "is"}
              - {left: "Cum este vremea?", right: "How's the weather?"}
              - {left: "Astăzi este soare.", right: "Today it's sunny."}
              - {left: "Astăzi este cald.", right: "Today it's warm."}
          - content_key: ro.a1.unit19.lesson01.exercise05.order_astazi_soare_cald
            type: word_order
            tested_text: "Astăzi este soare și cald"
            prompt: {target_blocks: []}
            word_bank: ["este", "Astăzi", "și", "soare", "cald"]
          - content_key: ro.a1.unit19.lesson01.exercise06.listen_order_cum_este_vremea
            type: listen_order
            tested_text: "Cum este vremea"
            media_asset_key: ro.a1.audio.weather.cum_este_vremea.01
            prompt: {target_blocks: []}
            word_bank: ["este", "Cum", "vremea"]
          - content_key: ro.a1.unit19.lesson01.exercise07.complete_cum_este_vremea
            type: fill_in_blank
            tested_text: "vremea"
            prompt:
              target_blocks:
                - {text: "Cum este ___?", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson01.exercise08.speak_astazi_soare_cald
            type: speak_response
            tested_text: "astăzi este soare și cald"
            prompt:
              target_blocks:
                - {text: "Say: Today it's sunny and warm.", language_code: en, direction: ltr}

      - content_key: ro.a1.unit19.lesson02.vremea_de_maine
        title: "Vremea de mâine"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: ro.a1.unit19.lesson02.teach.reminder_mihai_maine
            kind: grammar_note
            target: {text: "Mihai · Mâine", language_code: ro, direction: ltr}
            introduced_tokens: [Mihai, mâine]
          - content_key: ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc
            kind: grammar_note
            target: {text: "Nu · Mergem · La parc", language_code: ro, direction: ltr}
            introduced_tokens: [nu, mergem, la, parc]
          - content_key: ro.a1.unit19.lesson02.teach.ploua_vocab
            kind: vocabulary
            target: {text: "Plouă", language_code: ro, direction: ltr}
            introduced_tokens: [plouă]
            example:
              - {text: "Mâine plouă.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson02.teach.vant_vocab
            kind: vocabulary
            target: {text: "Vânt", language_code: ro, direction: ltr}
            introduced_tokens: [vânt]
            example:
              - {text: "Mâine este vânt.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson02.teach.frig_vocab
            kind: vocabulary
            target: {text: "Frig", language_code: ro, direction: ltr}
            introduced_tokens: [frig]
            example:
              - {text: "Mâine este frig.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson02.teach.maine_ploua_phrase
            kind: phrase
            target: {text: "Mâine plouă. Este vânt și este frig.", language_code: ro, direction: ltr}
            introduced_tokens: [mâine, plouă, este, vânt, și, frig]
          - content_key: ro.a1.unit19.lesson02.teach.nu_mergem_phrase
            kind: phrase
            target: {text: "Nu mergem la parc mâine.", language_code: ro, direction: ltr}
            introduced_tokens: [nu, mergem, la, parc, mâine]
        exercises:
          - content_key: ro.a1.unit19.lesson02.exercise01.choose_vant
            type: multiple_choice
            tested_text: "vânt"
            prompt:
              target_blocks:
                - {text: "wind", language_code: en, direction: ltr}
          - content_key: ro.a1.unit19.lesson02.exercise02.choose_frig
            type: multiple_choice
            tested_text: "frig"
            prompt:
              target_blocks:
                - {text: "cold", language_code: en, direction: ltr}
          - content_key: ro.a1.unit19.lesson02.exercise03.listen_maine_ploua
            type: listen_select
            tested_text: "Mâine plouă"
            media_asset_key: ro.a1.audio.weather.maine_ploua.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit19.lesson02.exercise04.match_weather2
            type: matching_pairs
            tested_text: "plouă vânt frig mâine mâine plouă este vânt nu mergem la parc mâine"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Plouă", right: "it's raining"}
              - {left: "Vânt", right: "wind"}
              - {left: "Frig", right: "cold"}
              - {left: "Mâine", right: "tomorrow"}
              - {left: "Mâine plouă.", right: "Tomorrow it's raining."}
              - {left: "Este vânt.", right: "It's windy."}
              - {left: "Nu mergem la parc mâine.", right: "We don't go to the park tomorrow."}
          - content_key: ro.a1.unit19.lesson02.exercise05.order_maine_ploua_frig
            type: word_order
            tested_text: "Mâine plouă și este frig"
            prompt: {target_blocks: []}
            word_bank: ["plouă", "Mâine", "frig", "este", "și"]
          - content_key: ro.a1.unit19.lesson02.exercise06.listen_order_este_vant_frig
            type: listen_order
            tested_text: "Este vânt și este frig"
            media_asset_key: ro.a1.audio.weather.este_vant_si_frig.01
            prompt: {target_blocks: []}
            word_bank: ["vânt", "Este", "este", "și", "frig"]
          - content_key: ro.a1.unit19.lesson02.exercise07.complete_maine_ploua_frig
            type: fill_in_blank
            tested_text: "frig"
            prompt:
              target_blocks:
                - {text: "Mâine plouă. Este vânt și este ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit19.lesson02.exercise08.speak_maine_frig_nu_mergem
            type: speak_response
            tested_text: "mâine este frig nu mergem la parc"
            prompt:
              target_blocks:
                - {text: "Say: Tomorrow it's cold, so we don't go to the park.", language_code: en, direction: ltr}

      - content_key: ro.a1.unit19.lesson03.planul_de_sambata
        title: "Planul de sâmbătă"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc
