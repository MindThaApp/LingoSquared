generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-18
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl search "Peace Corps Moldova Basic
    Romanian Language Lessons weather vreme soare ploaie"`) but returned
    HTTP 402 (0 credits remaining, the same exhausted state every recent
    ro unit has hit), so this unit falls back to a fresh direct `curl` +
    `pdftotext -layout` re-fetch of the confirmed-working PDF (785-line
    extraction, matching every prior unit's own extraction length
    exactly -- confirmed byte-for-byte-equivalent line count, not a
    partial/truncated fetch). Grepped the full extracted text for
    vreme/soare/ploaie/plouă/zăpadă/vânt/nor/ninge/senin/însorit and
    found NO dedicated weather vocabulary anywhere in this source --
    unlike unit18's Lesson 15 "House Orientation," this PDF has no
    weather-themed lesson at all (its 19 numbered lessons cover
    greetings, introductions, questions, the alphabet, pronouns,
    to be/to have, articles, numbers, days, months, basic words, basic
    adverbs/adjectives, food and drink, house orientation, and four
    generic listening-exercise lessons with no topical theme). The
    closest hit is Lesson 13's "Basic Adverbs and Adjectives" table,
    which does genuinely include "warm = cald" and "cold = rece" and
    "beautiful = frumos" and "bad = rău" as general-purpose adjectives
    (not weather-specific) -- of these, only "cald" (warm) is used in
    this unit, source-confirmed from that exact table; "rece"/
    "frumos"/"rău" were considered but deliberately not used (see
    below). Every other new word this unit teaches (vreme, soare,
    plouă, vânt, frig) has NO attestation anywhere in this specific
    785-line extraction and is authored fresh from general standard
    Romanian knowledge -- these are the ordinary, high-frequency A1
    weather words a real course would teach (the everyday idiom "Cum
    este vremea?"/"How's the weather?", and the standard impersonal
    constructions "Este soare"/"Este cald"/"Plouă"/"Este vânt"/"Este
    frig", all attested general-audience Romanian, not invented
    calques), disclosed honestly here rather than overstated as
    source-confirmed. Deliberately did NOT use "rece" (cold, adjective)
    since it would be a true synonym of the fresh-authored "frig"
    (cold, impersonal noun-predicate) with no frame able to
    disambiguate the two in a fill_in_blank -- picked "frig" alone
    (AUTHORING_GUIDE #17). Deliberately did NOT use "frumos" (beautiful)
    or "rău" (bad) for a "nice/bad weather" description -- both would
    require feminine adjective agreement with "vreme" (frumoasă/rea,
    with "rău" additionally being irregular) that this unit's other
    four impersonal constructions (soare/cald/vânt/frig, all used as
    invariant predicates with "este") don't need, so adding them would
    introduce a real new agreement rule this unit's own scope (describe
    basic weather conditions, not comparative/descriptive adjective
    agreement) doesn't call for -- kept the unit's grammar load to the
    same already-established "este + invariant predicate" pattern
    throughout, all genuinely new content limited to: vreme, soare,
    cald, plouă, vânt, frig. "Astăzi"/"mâine" are direct within-course
    reuse from unit03/unit12's own already-taught today/tomorrow pair.
    "Mergem"/"la parc"/"sâmbătă"/"nu pot"-style "nu" are direct
    within-course reuse from unit11's plan-negotiation vocabulary,
    reused here to build the "suggest a simple resulting plan" half of
    the speaking assessment requirement ("Nu mergem la parc mâine" /
    "Mergem la parc sâmbătă?"). "Cum" is direct within-course reuse
    from unit01/unit09/unit12. This unit deliberately continues the
    same Ana/Mihai cast established since unit01, giving them a new,
    non-conflicting scenario (discussing tomorrow's forecast and
    deciding when to go to the park) that touches neither character's
    established home (unit18), job (unit17), food preference, nor any
    other prior fact. Authored at schema_version 1.1 from the start --
    every kind: vocabulary card carries a real example: sentence with a
    matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule,
    extended to the "real content, wrong timeframe" edge case --
    confirmed the "How's the weather tomorrow?" distractor deliberately
    uses "Ninge." (said by nobody) rather than the tempting "Este
    soare." (Ana's real line, but about Saturday, not tomorrow);
    AUTHORING_GUIDE #11 cross-lesson fact consistency with unit17/
    unit18's job/housing facts, #17 fill_in_blank ambiguity, including
    the deliberate exclusion of the true-synonym "rece" in favor of
    "frig" alone) against the actual dialogue/exercise content and
    confirm them accurate. Also confirmed no stray YAML booleans,
    matching_pairs/word_order shapes correct, every exercise type
    registered, no jargon leaks, correct and consistent diacritics,
    natural Romanian throughout. No real bugs found; no changes made
    to this unit. This is the last of the 19 ro A1 units in this
    review pass -- full corpus-wide compiler validation (all 19 ro
    units + overlays together) is clean: 0 errors/0 warnings.

    Nineteenth Romanian unit, first draft, continuing directly from
    unit18. Targets universal.a1.weather.describe_basic_weather --
    confirmed by grepping universal_spine.yaml directly: it's the entry
    immediately following universal.a1.housing.describe_home (unit18's
    own outcome) in spine order, has an empty prerequisites list, and
    its can_do text is "Describe current weather conditions and make a
    simple weather-related plan." This course's own established
    3-lesson bootstrap pace and Ana/Mihai characters are used, matching
    units 01-18. 3 lessons, each mapped to a distinct spine
    assessment_requirement: lesson01 (Ana describes today's sunny,
    warm weather) covers understand_weather_report; lesson02 (Mihai
    and Ana discuss tomorrow's rainy, windy, cold forecast and decide
    not to go to the park) covers describe_weather (weather + a
    resulting plan, in the same speak_response exercise); lesson03 (a
    dialogue between Ana and Mihai planning their Saturday around the
    forecast, plus a short reading note and a writing prompt) covers
    read_weather_forecast and write_weather_note, and consolidates all
    four.

    Reuses unit01's bună/ce/mai/faceți/bine/mulțumesc/cum/la/revedere/
    Ana/Mihai, unit03's astăzi/mâine, unit05's și, unit08's este,
    unit11's mergem/parc/nu/sâmbătă, all re-declared via lesson-opening
    reminder cards per the standing per-file token-scoping convention
    (lesson01 reminds Ana/este/și and astăzi in two cards; lesson02
    reminds Mihai/mâine and nu/mergem/la parc; lesson03 reminds
    bună/ce/mai/faceți/bine/mulțumesc in one card and sâmbătă/la/
    revedere in a second). Within this file, lesson02/03
    freely reuse lesson01's own vreme/vremea/cum/este/soare/cald without
    a fresh reminder card, and lesson03 freely reuses lesson02's own
    plouă/vânt/frig/nu/mergem/la parc/mâine, matching the exact
    within-file-reuse precedent already established by units 09/15/16/
    17/18.

    Checked this choice against AUTHORING_GUIDE #11 carefully before
    finalizing. Facts this unit newly states: today's weather is sunny
    and warm; tomorrow's forecast is rain, wind, and cold, so Ana and
    Mihai skip the park tomorrow; Saturday's forecast is sunny, so
    they'll go to the park then instead -- none of these touch any fact
    any earlier unit ever established (grepped every earlier ro
    realization file for vreme/soare/ploaie/plouă/vânt/frig/cald/rece/
    frumos and confirmed, after excluding false-positive substring
    matches inside unrelated English words like "precedent"/"nor," zero
    prior teaching-card or exercise usage of any of these as actual
    taught content). unit18 established Ana has a big house (three
    rooms) and Mihai a small apartment (two rooms, one window); unit17
    established Mihai works at an office and Ana at a school; this
    unit's weather/plan claims don't touch either fact -- nothing here
    restates or contradicts any earlier housing, job, food, family,
    date, price, preference, comparison, travel, or health claim. The
    only fact this unit reuses from an earlier unit is the bare
    vocabulary items astăzi/mâine/mergem/parc/sâmbătă/nu themselves
    (words, not claims) -- no earlier unit ever stated what the weather
    was on any day, so there is no pre-existing weather fact to
    conflict with.

    Checked every fill_in_blank slot's correct answer against
    AUTHORING_GUIDE #17's synonym-ambiguity concern. lesson01's "Cum
    este ___?" recalls "vremea" -- of this lesson's taught nouns/
    adjectives (vreme, soare, cald), only "vremea" fits this exact
    frame grammatically/idiomatically as the answer to "how is
    it?"; "soare"/"cald" don't complete "cum este soare"/"cum este
    cald" as sensible answers to their own question, so no real
    competing candidate exists. lesson02's "Mâine plouă. Este vânt și
    este ___." recalls "frig" -- this is the exact continuation already
    established verbatim by this lesson's own maine_ploua_phrase
    teaching card, so no other taught word completes this specific
    three-item weather list as authored. lesson03's "Cum este ___
    mâine?" recalls "vremea" via the same reasoning as lesson01's
    instance, with "mâine" added as an anchor that further narrows it
    to the already-established idiom. Deliberately did NOT build a
    fill_in_blank recalling "soare"/"cald"/"vânt"/"frig" directly once
    more than one is taught in the same lesson (e.g. a generic "Astăzi
    este ___." frame after both soare and cald are live would be
    genuinely ambiguous between them) -- tested those four instead via
    multiple_choice, word_order, listen_select, and listen_order in
    their own introducing lesson, before a competing same-slot
    candidate exists, avoiding the ambiguity entirely rather than
    trying to patch it with a weaker anchor, the same technique
    unit18's own notes already used.

    Checked the lesson03 dialogue exercises against the standing
    same-speaker-distractor rule (extended to the "real content, wrong
    attribution" edge case per the standing instruction). Listed every
    line each speaker actually says in the seven-line dialogue before
    writing distractors. Ana's four lines are "Bună, Mihai! Ce mai
    faceți?", "Mâine plouă. Este vânt și este frig.", "Sâmbătă este
    soare! Da, bine!", and "La revedere, Mihai!". Mihai's three lines
    are "Bine, mulțumesc! Cum este vremea mâine?", "Nu mergem la parc
    mâine. Mergem sâmbătă?", and "La revedere, Ana!". The
    dialogue_comprehension exercise asks "How's the weather tomorrow,
    according to Ana?" (correct: "Plouă.") with distractor "Ninge." --
    a word nobody says anywhere in this dialogue's audio at all,
    deliberately chosen instead of the tempting "Este soare." (which
    Ana genuinely says, but about Saturday, not tomorrow -- exactly the
    "technically real audio content, just attributed to the wrong
    timeframe" edge case this rule's extension exists to catch,
    mirroring unit18's identical "Două camere." near-miss). The
    reading_comprehension exercise (a standalone note, not tied to any
    dialogue audio: "Astăzi este soare și este cald. Mâine plouă și
    este frig." -- "What's the weather like today?", correct "Soare și
    cald.", distractors "Ploaie și frig."/"Vânt și soare.") deliberately
    uses "Ploaie și frig." as one distractor even though "frig" (and
    the same rain fact under "plouă") appears in the same note -- for a
    reading exercise (unlike a listening one) the learner can re-read
    the text at leisure, and the note explicitly attributes "plouă și
    frig" to tomorrow only, so distinguishing the two days' stated
    facts is the actual point of the check, the exact same reasoning
    unit17/unit18's own reading_comprehension exercises already used.
    This exercise has no media_asset_key at all (a pure reading text,
    matching unit15-18's own reading_comprehension exercise shape), so
    the same-speaker-audio concern doesn't apply to it in the first
    place. Both listen_select clips (lesson01/lesson02) use
    single-sentence audio, not multi-speaker dialogue audio, and their
    distractors were confirmed to be sentences from other, separate
    audio clips, never spoken in that specific clip. Needs a
    fresh-context content review before import, same as every other
    language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-18's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    formal register with each other). This unit's own new vocabulary
    (vreme, soare, cald, plouă, vânt, frig) is entirely used in
    person-invariant impersonal constructions ("Este soare," "Plouă,"
    "Este vânt," "Este frig," "Cum este vremea?") with no register
    distinction of any kind -- these forms don't change with tu/
    dumneavoastră. No new tu/dumneavoastră form is introduced this
    unit; the dialogue's own greeting/closing lines reuse unit01's
    already-established formal "faceți."

