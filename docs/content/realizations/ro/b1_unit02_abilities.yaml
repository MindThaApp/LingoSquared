    language: ro
    text: "Pot să vorbesc, poți să vorbești, poate să vorbească, putem să vorbim, puteți să vorbiți, pot să vorbească."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.b1.audio.dialogue.client_nou.01
    language: ro
    text: "Ana: Bună ziua, Mihai! Avem un client nou. Puteți să vorbiți engleză cu el? Mihai: Da, pot să vorbesc engleză bine. Nu este o problemă. Ana: Perfect! Anul trecut, nu am putut să ajut cu clienți străini, dar acum pot să vorbesc puțin franceză. Mihai: Putem să practicăm împreună mâine. Ana: Mulțumesc mult, Mihai! Mihai: Cu plăcere!"
    voice_hint: two_adults_neutral_polite
    status: pending_generation

