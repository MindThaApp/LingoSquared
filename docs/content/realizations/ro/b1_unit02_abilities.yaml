schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's second B1 unit, same authoring pass as b1_unit01_necessity
    (see that file's provenance note for the firecrawl-down/source-recheck
    detail -- the same conclusion applies here: the Peace Corps Moldova PD
    source has no dedicated ability-modal grammar content, so this unit is
    fresh-authored from general standard Romanian grammar knowledge).

    Teaches a putea (can/to be able) + să + conjunctiv as the main B1
    target -- deliberately a DIFFERENT grammatical shape than unit01's
    invariant trebuie: a putea genuinely conjugates for person (pot,
    poți, poate, putem, puteți, pot), the exact contrast the spine
    outcome asks for ("a modal-plus-embedded-clause construction, not
    just a bare modal + verb"). A real, worth-flagging irregular-verb
    fact used as this unit's own grammar point: "pot" is identically the
    1st-person-singular AND 3rd-person-plural indicativ/conjunctiv form
    (eu pot / ei pot), distinct from unit01's trebuie (which never
    conjugates at all) and from the regular a vorbi/a conduce pattern
    (where only 3rd person diverges from 1st/2nd). Past ability uses "am
    putut să..." (perfect compus, a completed past ability) contrasted
    with hypothetical "aș putea să..." (conditional-optative, a would-be
    ability) -- genuinely distinct moods for a genuinely distinct
    meaning, matching the spine outcome's "contrast present ability with
    past/hypothetical ability."

    Uses "a vorbi" (to speak) + language names as the demonstration verb
    throughout (engleză/franceză/spaniolă) -- a natural, real-world
    ability topic, and a light, unforced nod to this being a language
    app without being the actual subject of any exercise. Continues Ana
    and Mihai (same jobs/register as unit01) and introduces Diana
    (previously established in a2_unit26 as a job candidate Mihai
    interviewed) as now working at Mihai's office, consistent with that
    unit's interview outcome rather than contradicting it. All
    vocabulary is introduced self-contained within this file (a separate
    file from unit01, so tokens are redeclared here even where unit01
    already covered the same word).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context adversarial review completed 2026-07-11 (Opus, zero
    access to the authoring reasoning); all AUTHORING_GUIDE.md #20
    sweeps and grammar/register/character checks passed, compiler
    green. Ship-ready.

course:
  realization_key: ro.b1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continues the established dumneavoastră-default register from ro
    A1/A2/B1 (units 01-26, b1_unit01): Ana and Mihai address each other
    formally throughout.

