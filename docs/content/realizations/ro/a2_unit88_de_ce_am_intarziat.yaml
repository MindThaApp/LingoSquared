          - {"content_key": "ro.a2.unit88.lesson06.teach.d7", "kind": "dialogue", "target": {"text": "Atunci mergem mâine, deoarece mâine am timp.", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Atunci", "mergem", "mâine", "deoarece", "am", "timp"]}
        exercises:
          - {"content_key": "ro.a2.unit88.lesson06.exercise01.asculta_deschidere", "type": "listen_select", "tested_text": "Ana de ce ai întârziat azi", "media_asset_key": "ro.a2.audio.dialogue.de_ce_am_intarziat.01", "prompt": {"target_blocks": []}}
