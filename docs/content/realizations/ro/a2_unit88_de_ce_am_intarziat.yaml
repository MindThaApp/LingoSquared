          - {"content_key": "ro.a2.unit88.lesson06.exercise03.une_dialog", "type": "matching_pairs", "tested_text": "De ce ai întârziat azi Pentru că trenul a întârziat Telefonul nu merge așa că nu am sunat Vii la film diseară Nu pot pentru că sunt obosită Rămân acasă Atunci mergem mâine Mâine am timp", "prompt": {"target_blocks": []}, "pairs": [{"left": "De ce ai întârziat azi?", "right": "Why were you late today?"}, {"left": "Pentru că trenul a întârziat.", "right": "Because the train was late."}, {"left": "Telefonul nu merge, așa că nu am sunat.", "right": "The phone isn't working, so I didn't call."}, {"left": "Vii la film diseară?", "right": "Are you coming to the film tonight?"}, {"left": "Nu pot, pentru că sunt obosită.", "right": "I can't, because I'm tired."}, {"left": "Rămân acasă.", "right": "I'm staying home."}, {"left": "Atunci mergem mâine.", "right": "Then we'll go tomorrow."}, {"left": "Mâine am timp.", "right": "Tomorrow I have time."}]}
