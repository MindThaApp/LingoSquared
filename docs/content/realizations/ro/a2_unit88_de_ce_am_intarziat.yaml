          - {"content_key": "ro.a2.unit88.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Nu e nimic. Vii la film diseară?", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Nu", "e", "nimic", "Vii", "la", "film", "diseară"]}
