          - {"content_key": "ro.a2.unit88.lesson06.exercise05.raspunde_de_ce", "type": "dialogue_response", "tested_text": "Pentru că trenul a întârziat", "prompt": {"target_blocks": [{"text": "De ce ai întârziat azi?", "language_code": "ro", "direction": "ltr"}]}}
