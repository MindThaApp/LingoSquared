generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-14
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl search "Peace Corps Moldova Basic
    Romanian Language Lessons train ticket station travel"`) but
    returned HTTP 402 (0 credits remaining, the same exhausted state
    every recent ro unit has hit), so this unit falls back to the same
    direct `curl` + `pdftotext -layout` re-fetch of the confirmed-working
    PDF those units used. Grepped the full extracted text for
    train/ticket/station/travel/journey/departure/arrival/platform
    terms and found real, directly usable material: Lesson 7's own
    example sentence "Tu nu ai bilet." (You don't have a ticket.),
    listed in that lesson's own vocabulary as "bilet -- ticket"; Lesson
    8's possession-example "Trenul tău pleacă mîine." (Your train
    leaves tomorrow.), listed in that lesson's own vocabulary as "tren
    -- train (m.)"; and Lesson 17's "Day by day conversation" listening
    exercise, which has "Eu trebuie să plec astăzi la Chişinău." (I
    have to go to Chişinău today.) and closes with "Drum bun." (Have a
    safe trip.) / "Mulţumesc." (Thank you.) as a genuine departure
    farewell exchange. Note: this exact Lesson 17 exchange was already
    checked and partially used by ro's own unit10 (routines) --
    unit10's own provenance note explicitly says it found this
    exchange NOT reusable as first-person routine vocabulary and only
    lightly echoed "acasă" from it; unit10 never used "trebuie", "plec",
    "Chişinău", "bilet", "tren", or "Drum bun" as actual taught
    vocabulary (confirmed by grepping every existing ro realization
    file for these tokens before starting this unit -- zero hits
    outside unit10's own provenance prose, which only discusses the
    source text, never teaches it). This unit is the first to actually
    teach "bilet"/"tren"/"Drum bun" as real vocabulary. "Trenul tău
    pleacă mîine" respells to modern "mâine" per this course's standing
    modernization convention (see unit04's own provenance for the same
    î-to-â respelling of this exact word); "pleacă" itself needs no
    respelling, it was already modern-spelled in the source. "Chişinău"
    (Moldova's capital, cedilla ş) was deliberately NOT reused as this
    unit's destination city -- this course's own `dialect:
    ro_RO_standard` is standard Romania Romanian, not Moldovan
    Romanian, and no other ro unit has established any city name yet,
    so "București" (Romania's own capital) was chosen fresh instead as
    a dialect-appropriate destination, disclosed honestly as a
    substitution rather than a direct reuse of the source's city.
    "Trebuie" (must/have to) itself was deliberately NOT introduced in
    this unit despite being in the source's own most relevant sentence
    -- it's a genuinely separate modal-verb grammar point unit10 already
    considered and declined to teach, and this unit's own scope
    (tickets, destinations, platforms, departure times, per the spine
    outcome's own can_do text) doesn't need it. No sourced material
    covers train platforms at all -- grepped the full extracted text
    for "peron"/"platform" with zero hits -- so "peron" (platform) is
    freely authored fresh per AUTHORING_GUIDE #10's "if the source
    doesn't cover the topic adequately, author fresh": it's basic-tier,
    extremely common Romanian train-travel vocabulary with no plausible
    substitute, independently confidence-checked (standard Romanian
    word for a train platform, cognate with French "quai"-adjacent
    usage, not sourced from this specific PDF), and its definite form
    "peronul" follows the exact same "-ul" definite-article rule
    already established from this same source's own Lesson 8 (see
    unit08's/unit09's "gară"->"gara" pattern for a feminine noun;
    "peron" is masculine/consonant-ending, so it takes "-ul" the same
    way "magazin"->"magazinul" already does in unit08). "Aș dori" (I
    would like), "vă rog" (please, formal), "cât costă" (how much does
    it cost), and the "leu"/"lei" currency-plural rule are all direct
    within-course reuse from unit07 (shopping), not re-sourced from the
    PDF a second time -- see unit07's own realization file for their
    original provenance. "Gară" (train station) is direct within-course
    reuse from unit08/unit09 (places/directions), likewise not
    re-sourced. This unit deliberately continues the same Ana/Mihai
    cast established since unit01, this time with Mihai as the one
    traveling by train and Ana seeing him off -- a new scenario, not a
    repeat of any earlier one. Only three genuinely new content words
    beyond "bilet"/"tren"/"peron"/"Drum bun" are introduced: "pleacă"
    (leaves/departs, 3rd person singular of "a pleca"), "București"
    (the destination city), and "bun" (good, the second half of the
    "Drum bun" idiom, counted together with "drum" as one vocabulary
    item per the idiom's fixed-phrase status). Authored at schema_version
    1.1 from the start -- every kind:vocabulary card carries a real
    example: sentence with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule,
    AUTHORING_GUIDE #11 cross-lesson fact consistency -- confirmed the
    reused "la ora nouă" clock time attached to a different event
    (train departure vs. unit04's class) doesn't conflict, #17
    fill_in_blank ambiguity) against the actual dialogue/exercise
    content and confirm them accurate. Also confirmed no stray YAML
    booleans, matching_pairs/word_order shapes correct, every exercise
    type registered, no jargon leaks, correct and consistent
    diacritics, natural Romanian throughout. No real bugs found; no
    changes made to this unit.

    Fifteenth Romanian unit, first draft, continuing directly from
    unit14. Targets universal.a1.travel.handle_basic_journey --
    confirmed by grepping universal_spine.yaml directly: it's the entry
    immediately following universal.a1.comparisons.make_basic_comparisons
    (unit14's own outcome) in spine order, its prerequisites
    (universal.a1.numbers.use_basic_numbers,
    universal.a1.time.ask_tell_time,
    universal.a1.directions.ask_follow_basic_directions) are all
    already satisfied by unit02, unit04, and unit09 respectively, and
    its can_do text is "Handle basic transport information, tickets,
    destinations, and departure details." This course's own established
    3-lesson bootstrap pace and Ana/Mihai characters are used, matching
    units 01-14. 3 lessons, each mapped to a distinct spine
    assessment_requirement: lesson01 (tren/pleacă/peron, departure
    announcements) covers understand_travel_announcement; lesson02
    (bilet/București/aș dori/cât costă) covers request_travel_information
    and write_travel_request; lesson03 (Ana/Mihai's station dialogue,
    plus a short schedule-style reading text) covers read_ticket_schedule
    and consolidates all four. Reuses unit02's numbers, unit04's "la ce
    oră"/"la ora nouă" (the exact phrase unit04 already taught, now
    combined with this unit's own "trenul pleacă" rather than
    contradicted), unit07's shopping-payment language (aș dori/vă
    rog/cât costă/costă.../lei), and unit08/09's "gară" -- all
    re-declared via lesson-opening reminder cards per the standing
    per-file token-scoping convention (lesson01 reminds gară/este/la/
    ce/oră/ora/nouă; lesson02 reminds aș dori/vă rog/cât costă/costă/
    lei; lesson03 reminds bună/mulțumesc/la revedere/Ana/Mihai). Within
    this file, lesson02/03 freely reuse lesson01's own tren/pleacă/
    peron without a fresh reminder card, since that's within-file
    reuse, not cross-file, matching unit09's own established
    precedent.

    Checked this choice against AUTHORING_GUIDE #11 carefully before
    finalizing. Facts this unit newly states: the train leaves at nine
    o'clock (la ora nouă), from platform three (peronul trei), bound
    for București, and Mihai has the ticket -- none of these touch any
    fact any earlier unit ever established (grepped every earlier ro
    realization file for "tren"/"bilet"/"peron"/"București": zero
    prior hits outside this unit and unit10's own provenance prose
    discussing the source, confirmed above). Unit04's own established
    "la ora nouă" (Mihai's language class starts at nine, and a
    separate generic "La ora nouă." time-telling example) is reused
    here as a literal clock time attached to a DIFFERENT event (a train
    departure, not the language class) -- these don't conflict, since
    nothing says a class and a train can't share the same o'clock
    without more context tying them together, and this unit's own
    dialogue never mentions Mihai's class at all. No day/date, price
    (beyond this unit's own fresh "zece lei" ticket price, which no
    earlier unit's price list touches), family, preference, or
    comparison claim from any earlier unit is touched.

    Checked every fill_in_blank slot's correct answer against
    AUTHORING_GUIDE #17's synonym-ambiguity concern: lesson01's
    "Trenul ___ la ora nouă." recalls "pleacă" -- the sentence was
    already taught verbatim as this lesson's own phrase card
    immediately before the exercise, and no other verb this course has
    taught (este, costă, mergeți, etc.) makes sense substituted into
    this exact frame ("Trenul este la ora nouă" doesn't mean anything
    coherent in Romanian), so there's no real second candidate.
    lesson02's "Aș dori un ___ la București, vă rog." recalls "bilet"
    -- the only masculine noun this course has ever paired with "Aș
    dori un ___" is "bilet" itself (this course's other "aș dori"
    example, unit06's "Aș dori pâine și pui," uses different nouns in a
    different frame with a feminine/no-article shape, not a real
    competing candidate for this specific "un ___" slot). lesson03's
    "___, Mihai! La revedere!" recalls "Drum bun" -- the instruction
    explicitly anchors it as "Complete Ana's goodbye (have a safe
    trip)," and "Drum bun" was just taught as this lesson's own
    vocabulary card immediately before the dialogue, with no other
    taught phrase fitting that same slot-plus-gloss combination.

    Checked the lesson03 dialogue exercises against the standing
    same-speaker-distractor rule: listed every line each speaker
    actually says in the six-line dialogue before writing distractors.
    Ana's three lines are "Bună, Mihai! La ce oră pleacă trenul?", "De
    la ce peron?", and "Drum bun, Mihai! La revedere!". Mihai's three
    lines are "Trenul pleacă la ora nouă.", "De la peronul trei. Am un
    bilet la București.", and "Mulțumesc, Ana! La revedere!". The
    dialogue_comprehension exercise asks "From which platform does the
    train leave?" (correct: "Peronul trei.") with distractors "Peronul
    doi."/"Peronul unu." -- neither distractor is a line anyone
    actually says anywhere in the dialogue audio (only "peronul trei"
    is ever spoken), so there's no double-correct-option risk. The
    reading_comprehension exercise ("Trenul pleacă la ora nouă. Peronul
    trei. Bilet la București." -- "Where is the train going?", correct
    "București.", distractors "Peron."/"Gară.") draws its distractors
    from the same short text but neither is itself a place the train is
    "going to," so there's no ambiguity there either. Both
    listen_select clips (lesson01/lesson02) use single-sentence audio,
    not multi-speaker dialogue audio, and their distractors were
    confirmed to be sentences never spoken in that specific clip.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-14's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    formal register with each other, e.g. unit09's "Mergeți"). This
    unit's own new vocabulary (tren, pleacă, bilet, peron, București,
    Drum bun) is entirely person-invariant -- none of it carries a
    tu/dumneavoastră distinction of its own, and the lesson03 dialogue
    uses only first-person statements, impersonal questions ("La ce oră
    pleacă trenul?"), and the fixed idiom "Drum bun" rather than any
    directly-conjugated second-person verb, so no new register decision
    is introduced this unit.

