units:
  - content_key: ro.a1.unit15.travel
    title: "Călătoria"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.travel.handle_basic_journey
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit15.lesson01.trenul_pleaca
        title: "Trenul pleacă"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: ro.a1.unit15.lesson01.teach.reminder_gara_ora
            kind: grammar_note
            target: {text: "gară · este · la · ce · oră · ora · nouă", language_code: ro, direction: ltr}
            introduced_tokens: [gară, este, la, ce, oră, ora, nouă]
          - content_key: ro.a1.unit15.lesson01.teach.tren_vocab
            kind: vocabulary
            target: {text: "Tren", language_code: ro, direction: ltr}
            introduced_tokens: [tren]
            example:
              - {text: "Trenul este la gară.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit15.lesson01.teach.pleaca_vocab
            kind: vocabulary
            target: {text: "Pleacă", language_code: ro, direction: ltr}
            introduced_tokens: [pleacă]
            example:
              - {text: "Trenul pleacă.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase
            kind: phrase
            target: {text: "Trenul pleacă la ora nouă.", language_code: ro, direction: ltr}
            introduced_tokens: [trenul, pleacă, la, ora, nouă]
          - content_key: ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase
            kind: phrase
            target: {text: "La ce oră pleacă trenul?", language_code: ro, direction: ltr}
            introduced_tokens: [la, ce, oră, pleacă, trenul]
          - content_key: ro.a1.unit15.lesson01.teach.peron_vocab
            kind: vocabulary
            target: {text: "Peron", language_code: ro, direction: ltr}
            introduced_tokens: [peron, peronul]
            example:
              - {text: "Trenul este la peronul trei.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase
            kind: phrase
            target: {text: "De la ce peron pleacă trenul?", language_code: ro, direction: ltr}
            introduced_tokens: [de, la, ce, peron, pleacă, trenul]
        exercises:
          - content_key: ro.a1.unit15.lesson01.exercise01.choose_tren
            type: multiple_choice
            tested_text: "tren"
            prompt:
              target_blocks:
                - {text: "train", language_code: en, direction: ltr}
          - content_key: ro.a1.unit15.lesson01.exercise02.choose_pleaca
            type: multiple_choice
            tested_text: "pleacă"
            prompt:
              target_blocks:
                - {text: "leaves / departs", language_code: en, direction: ltr}
          - content_key: ro.a1.unit15.lesson01.exercise03.listen_trenul_pleaca_ora_noua
            type: listen_select
            tested_text: "Trenul pleacă la ora nouă"
            media_asset_key: ro.a1.audio.travel.trenul_pleaca_la_ora_noua.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit15.lesson01.exercise04.match_travel1
            type: matching_pairs
            tested_text: "tren pleacă peron gară la ce oră la ora nouă"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Tren", right: "train"}
              - {left: "Pleacă", right: "leaves / departs"}
              - {left: "Peron", right: "platform"}
              - {left: "Gară", right: "train station"}
              - {left: "La ce oră?", right: "At what time?"}
              - {left: "La ora nouă.", right: "At nine o'clock."}
          - content_key: ro.a1.unit15.lesson01.exercise05.order_la_ce_ora_pleaca_trenul
            type: word_order
            tested_text: "La ce oră pleacă trenul"
            prompt: {target_blocks: []}
            word_bank: ["pleacă", "La", "trenul", "ce", "oră"]
          - content_key: ro.a1.unit15.lesson01.exercise06.listen_order_de_la_ce_peron
            type: listen_order
            tested_text: "De la ce peron pleacă trenul"
            media_asset_key: ro.a1.audio.travel.de_la_ce_peron_pleaca_trenul.01
            prompt: {target_blocks: []}
            word_bank: ["peron", "De", "la", "ce", "pleacă", "trenul"]
          - content_key: ro.a1.unit15.lesson01.exercise07.complete_trenul_pleaca
            type: fill_in_blank
            tested_text: "pleacă"
            prompt:
              target_blocks:
                - {text: "Trenul ___ la ora nouă.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit15.lesson01.exercise08.speak_la_ce_ora_pleaca_trenul
            type: speak_response
            tested_text: "la ce oră pleacă trenul"
            prompt:
              target_blocks:
                - {text: "Say: What time does the train leave?", language_code: en, direction: ltr}

      - content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
        title: "Un bilet, vă rog"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa
            kind: grammar_note
            target: {text: "aș dori · vă rog · cât costă · costă · lei", language_code: ro, direction: ltr}
            introduced_tokens: [aș, dori, vă, rog, cât, costă, lei]
          - content_key: ro.a1.unit15.lesson02.teach.bilet_vocab
            kind: vocabulary
            target: {text: "Bilet", language_code: ro, direction: ltr}
            introduced_tokens: [bilet]
            example:
              - {text: "Am un bilet.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit15.lesson02.teach.bucuresti_vocab
            kind: vocabulary
            target: {text: "București", language_code: ro, direction: ltr}
            introduced_tokens: [București]
            example:
              - {text: "Trenul pleacă la București.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase
            kind: phrase
            target: {text: "Aș dori un bilet la București, vă rog.", language_code: ro, direction: ltr}
            introduced_tokens: [aș, dori, un, bilet, la, București, vă, rog]
          - content_key: ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase
            kind: phrase
            target: {text: "Cât costă un bilet la București?", language_code: ro, direction: ltr}
            introduced_tokens: [cât, costă, un, bilet, la, București]
          - content_key: ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase
            kind: phrase
            target: {text: "Costă zece lei.", language_code: ro, direction: ltr}
            introduced_tokens: [costă, zece, lei]
        exercises:
          - content_key: ro.a1.unit15.lesson02.exercise01.choose_bilet
            type: multiple_choice
            tested_text: "bilet"
            prompt:
              target_blocks:
                - {text: "ticket", language_code: en, direction: ltr}
          - content_key: ro.a1.unit15.lesson02.exercise02.choose_how_much_question
            type: multiple_choice
            tested_text: "cât costă un bilet"
            prompt:
              target_blocks:
                - {text: "How much does a ticket cost?", language_code: en, direction: ltr}
          - content_key: ro.a1.unit15.lesson02.exercise03.listen_as_dori_bilet_bucuresti
            type: listen_select
            tested_text: "Aș dori un bilet la București, vă rog"
            media_asset_key: ro.a1.audio.travel.as_dori_bilet_bucuresti.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit15.lesson02.exercise04.match_travel2
            type: matching_pairs
            tested_text: "bilet București aș dori vă rog cât costă costă lei tren peron"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Bilet", right: "ticket"}
              - {left: "București", right: "Bucharest"}
              - {left: "Aș dori", right: "I would like"}
              - {left: "Vă rog", right: "please"}
              - {left: "Cât costă?", right: "How much does it cost?"}
              - {left: "Lei", right: "lei (currency)"}
              - {left: "Tren", right: "train"}
              - {left: "Peron", right: "platform"}
          - content_key: ro.a1.unit15.lesson02.exercise05.order_cat_costa_bilet
            type: word_order
            tested_text: "Cât costă un bilet"
            prompt: {target_blocks: []}
            word_bank: ["costă", "Cât", "bilet", "un"]
          - content_key: ro.a1.unit15.lesson02.exercise06.listen_order_costa_zece_lei
            type: listen_order
            tested_text: "Costă zece lei"
            media_asset_key: ro.a1.audio.travel.costa_zece_lei.01
            prompt: {target_blocks: []}
            word_bank: ["zece", "Costă", "lei"]
          - content_key: ro.a1.unit15.lesson02.exercise07.complete_as_dori_bilet
            type: fill_in_blank
            tested_text: "bilet"
            prompt:
              target_blocks:
                - {text: "Aș dori un ___ la București, vă rog.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit15.lesson02.exercise08.speak_as_dori_bilet_bucuresti
            type: speak_response
            tested_text: "aș dori un bilet la bucurești vă rog"
            prompt:
              target_blocks:
                - {text: "Say: I would like a ticket to Bucharest, please.", language_code: en, direction: ltr}

          - {content_key: ro.a1.unit15.lesson02.exercise09.dictation_costa_zece_lei, type: dictation, tested_text: "Costă zece lei", media_asset_key: ro.a1.audio.travel.costa_zece_lei.01, prompt: {target_blocks: []}}
      - content_key: ro.a1.unit15.lesson03.la_gara
        title: "La gară"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: ro.a1.unit15.lesson03.teach.reminder_travel_words
            kind: grammar_note
            target: {text: "tren · pleacă · peron · bilet · București · trei · am", language_code: ro, direction: ltr}
            introduced_tokens: [tren, pleacă, peron, bilet, București, trei, am]
          - content_key: ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai
            kind: grammar_note
