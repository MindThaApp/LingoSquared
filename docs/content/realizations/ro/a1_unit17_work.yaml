generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-16
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl search "Peace Corps Moldova Basic
    Romanian Language Lessons job occupation work profession"`) but
    returned HTTP 402 (0 credits remaining, the same exhausted state
    every recent ro unit has hit), so this unit falls back to a fresh
    direct `curl` + `pdftotext -layout` re-fetch of the confirmed-working
    PDF (diffed byte-for-byte identical against an existing cached copy
    from an earlier session, confirming completeness -- both are the
    full 785-line extraction). Grepped the full extracted text for
    job/work/profession/occupation/profesor/inginer/doctor/fermier/
    student/salar/angaj and found two real, directly usable hits: line
    195's "I was a student / engineer / doctor / farmer / teacher... /
    Eu am fost student / inginer / doctor / fermier / profesor..." (a
    vocabulary list, already used once before by unit12 for its own
    "am fost" past-tense pattern, but not yet used for present-tense
    identity statements), and lines 656/663's "Sînt profesoară" (I am a
    teacher, modernized to "Sunt profesoară" per this course's standing
    î-to-â-adjacent modernization convention, see unit01's own
    provenance) / "Sînt fermier." (I am a farmer, not used this unit).
    Combining these two real hits -- the word "inginer" from the first
    list, and the "Sunt + [profession]" present-tense pattern
    confirmed live by "Sînt profesoară"/"Sînt fermier" -- gives a
    genuine, source-grounded "Sunt inginer." for Mihai, not a pure
    invention (per AUTHORING_GUIDE #10's "adapt, don't just reference":
    combining two real elements found in different parts of the same
    source into one new sentence is adaptation, not verbatim import).
    "Sunt profesoară." is used directly (only the sînt->sunt respelling
    applied) for Ana. Grepped the full extracted text separately for
    vânz/magazin/școal/birou/lucrează/lucrez/munc/meser/serviciu/angajat
    and found zero hits for any of them -- workplace nouns are not
    covered by this source at all, so "birou" (office) and "școală"
    (school) are freely authored fresh per AUTHORING_GUIDE #10: both
    are basic-tier, extremely common Romanian nouns with no plausible
    substitute for this unit's own scope, independently
    confidence-checked. An earlier draft considered "vânzător"
    (salesman) + "magazin" (store, already within-course reuse from
    unit08) for Mihai instead of inginer/birou, but the sourced
    inginer/profesoară pairing was preferred once found, since it
    needed less fresh invention. "Lucrează"/"lucrez" (works/I work) are
    direct within-course reuse from unit10, not re-sourced from the PDF
    a second time (unit10's own provenance already discloses these were
    freely authored there, the source not covering them either). The
    new formal second-person "lucrați" (you work, formal) is a regular,
    freely-authored conjugation of the same already-established "a
    lucra" verb, following the exact -ați/-eți formal-address ending
    already established by "aveți" (unit05) and "faceți" (unit01) --
    the same "extend a known verb by its regular, independently-verified
    conjugation pattern" technique unit12 already used for
    mâncat/băut. "Unde" (where), "este"/"sunt" (is/am), "la" (at, from
    unit04's "la ora nouă"), and "și dumneavoastră?" (and you, formal,
    verbatim from unit01) are all direct within-course reuse, likewise
    not re-sourced. This unit deliberately continues the same Ana/Mihai
    cast established since unit01, giving each character a distinct,
    non-conflicting occupation and workplace: Mihai is an engineer who
    works at an office, Ana is a teacher who works at a school -- a new
    scenario, not a repeat of any earlier one. Deliberately kept
    "inginer" masculine-only and "profesoară" feminine-only this unit
    (only Mihai ever says "Sunt inginer," only Ana ever says "Sunt
    profesoară"), avoiding a profession-noun gender-agreement grammar
    point this unit's own scope doesn't require -- the same deliberate
    scope-narrowing precedent unit16 already used for "bolnav"
    (masculine-only) and unit15 for declining "trebuie." Only genuinely
    new content words beyond "inginer"/"birou"/"profesoară"/"școală"/
    "lucrați" are introduced this unit; everything else is confirmed
    reuse (sourced or within-course). Authored at schema_version 1.1
    from the start -- every kind:vocabulary card carries a real
    example: sentence with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule --
    confirmed "inginer" is said by Mihai but never Ana in this
    dialogue's audio, so "What is Ana's job?" has no double-correct-
    option risk; AUTHORING_GUIDE #11 cross-lesson fact consistency
    (confirmed unit05's decorative "Tatăl meu este profesor." example
    doesn't commit either character's own occupation), #17
    fill_in_blank ambiguity) against the actual dialogue/exercise
    content and confirm them accurate. Also confirmed no stray YAML
    booleans, matching_pairs/word_order shapes correct, every exercise
    type registered, no jargon leaks, correct and consistent
    diacritics, natural Romanian throughout. No real bugs found; no
    changes made to this unit.

    Seventeenth Romanian unit, first draft, continuing directly from
    unit16. Targets universal.a1.work.describe_job -- confirmed by
    grepping universal_spine.yaml directly: it's the entry immediately
    following universal.a1.health.describe_basic_problem (unit16's own
    outcome) in spine order, its two prerequisites
    (universal.a1.introductions.exchange_identity and
    universal.a1.routines.describe_daily_routine) are already satisfied
    by unit01 and unit10 respectively, and its can_do text is "State a
    basic occupation, workplace, and simple work activity." This
    course's own established 3-lesson bootstrap pace and Ana/Mihai
    characters are used, matching units 01-16. 3 lessons, each mapped
    to a distinct spine assessment_requirement: lesson01 (Mihai este
    inginer, lucrează la birou) covers understand_work_description;
    lesson02 (Ana este profesoară, lucrează la școală, "Unde lucrați?")
    covers describe_work; lesson03 (Ana/Mihai's own dialogue about where
    they work, plus a short reading profile and a writing prompt) covers
    read_work_profile and write_work_profile, and consolidates all
    four. Reuses unit01's bună/ce/mai/faceți/bine/mulțumesc/și/
    dumneavoastră/la/revedere/Ana/Mihai, unit04's la (as a preposition),
    unit07/unit08's unde, and unit10's lucrez/lucrează -- all
    re-declared via lesson-opening reminder cards per the standing
    per-file token-scoping convention (lesson01 reminds este/la/Mihai
    and lucrez/lucrează; lesson02 reminds sunt/unde/Ana, "este" carried
    over within-file from lesson01 with no fresh reminder needed per
    the standing within-file-reuse precedent already established by
    unit09/unit15/unit16; lesson03 reminds bună/ce/mai/faceți/bine/
    mulțumesc in one card and și/dumneavoastră/la/revedere in a second).
    Within this file, lesson02/03 freely reuse lesson01's own este/la/
    Mihai without a fresh reminder card, matching that same precedent.

    Checked this choice against AUTHORING_GUIDE #11 carefully before
    finalizing. Facts this unit newly states: Mihai is an engineer who
    works at an office, Ana is a teacher who works at a school -- none
    of these touch any fact any earlier unit ever established (grepped
    every earlier ro realization file for "inginer"/"birou"/
    "profesoară"/"școală"/occupation-adjacent claims about either
    character: zero prior hits beyond unit05's own unrelated, generic,
    unattributed "Tatăl meu este profesor." example sentence -- that
    sentence is decorative flavor text on a "tată" vocabulary card, not
    a dialogue line spoken by Ana or Mihai about their own or each
    other's father, so it doesn't commit either character's own family
    to any occupation and doesn't conflict with this unit's own claims
    about Ana and Mihai themselves). unit10 established Mihai's own
    class ("cursul") starts at nine in the morning and he "lucrează
    seara" (works in the evening) before going to bed at night; this
    unit's own new claim that Mihai works "la birou" (at an office)
    doesn't touch the time-of-day fact at all (this unit never
    restates or contradicts "seara," it simply doesn't repeat it,
    leaving that fact exactly as unit10 left it -- the same "adds
    detail, doesn't re-litigate a time claim" reasoning unit11/unit12
    already used for their own cross-checks). No day/date, price,
    family, preference, comparison, travel, or health claim from any
    earlier unit is touched by this unit's own new material.

    Checked every fill_in_blank slot's correct answer against
    AUTHORING_GUIDE #17's synonym-ambiguity concern. lesson01's "Mihai
    este ___. Lucrează la birou." recalls "inginer" -- the only other
    occupation word this unit teaches, "profesoară," is ruled out by
    the second sentence's own "la birou" (this unit's own established
    fact ties profesoară specifically to "la școală," never "la
    birou"), so there's a real disambiguating anchor already in the
    frame, not just grammatical gender agreement alone. lesson02's
    "Ana este ___. Lucrează la școală." is the symmetric case, recalling
    "profesoară," ruled out for "inginer" the same way via "la școală."
    lesson03's "Bine! La ___, Mihai!" recalls "revedere" -- a single
    fixed collocation with "la," already used this exact way by every
    earlier unit's own closing line, no competing candidate exists
    anywhere in the course's taught vocabulary. Deliberately did NOT
    build a fill_in_blank recalling "lucrați" itself (e.g. "Unde
    ___?"): checked and found "mergeți" (from unit09's "Mergeți"
    imperative) is a real, independently plausible completion for a
    bare "Unde ___?" frame with zero disambiguating context ("Where are
    you going?" is just as coherent as "Where do you work?"), so
    "lucrați" is tested instead via multiple_choice, word_order, and
    speak_response in lesson02/03, none of which have this open-pool
    ambiguity problem.

    Checked the lesson03 dialogue exercises against the standing
    same-speaker-distractor rule: listed every line each speaker
    actually says in the six-line dialogue before writing distractors.
    Ana's three lines are "Bună, Mihai! Ce mai faceți?", "Lucrez la
    școală. Sunt profesoară. Și dumneavoastră?", and "Bine! La
    revedere, Mihai!". Mihai's three lines are "Bine, mulțumesc! Unde
    lucrați?", "Lucrez la birou. Sunt inginer.", and "La revedere,
    Ana!". The dialogue_comprehension exercise asks "What is Ana's
    job?" (correct: "Profesoară.") with distractor "Inginer." --
    "inginer" is taught in this unit's own lesson01 and is said by
    Mihai in this same six-line dialogue's audio, but never by Ana, so
    asking specifically about Ana's own job has no double-correct-option
    risk (Ana never claims to be an inginer). The reading_comprehension
    exercise (a standalone note, not tied to any dialogue audio: "Mihai
    este inginer. Lucrează la birou. Ana este profesoară. Lucrează la
    școală." -- "What is Mihai's job?", correct "Inginer.", distractors
    "Profesoară."/"Doctor.") deliberately uses "Profesoară." as one
    distractor even though it appears in the same note -- for a reading
    exercise (unlike a listening one) the learner can re-read the text
    at leisure, and the note explicitly attributes "profesoară" to Ana
    only, so distinguishing the two people's stated facts is the actual
    point of the check, not an ambiguity; "Doctor." is pulled from
    unit16's unrelated vocabulary as a second, uncontroversial
    distractor. This exercise has no media_asset_key at all (a pure
    reading text, matching unit15/unit16's own reading_comprehension
    exercise shape), so the same-speaker-audio concern doesn't apply to
    it in the first place. Both listen_select clips (lesson01/lesson02)
    use single-sentence audio, not multi-speaker dialogue audio, and
    their distractors were confirmed to be sentences never spoken in
    that specific clip. Needs a fresh-context content review before
    import, same as every other language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-16's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    formal register with each other, e.g. unit09's "Mergeți", unit16's
    "Aveți"/"Sunteți"-shaped forms). This unit's own new vocabulary
    (inginer, birou, profesoară, școală) is entirely person-invariant
    in the forms actually taught here -- "Sunt inginer"/"Sunt
    profesoară" are both fixed first-person statements (Mihai's and
    Ana's own, respectively). The one new conjugated verb form, "Unde
    lucrați?", reuses the already-established dumneavoastră -ați/-eți
    formal ending (aveți, faceți) rather than introducing a new
    register distinction. No informal-tu form is introduced this unit.

