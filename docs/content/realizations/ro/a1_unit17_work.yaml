units:
  - content_key: ro.a1.unit17.work
    title: "Munca"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.work.describe_job
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit17.lesson01.mihai_este_inginer
        title: "Mihai este inginer"
        spine_outcome_id: universal.a1.work.describe_job
        teaching:
          - content_key: ro.a1.unit17.lesson01.teach.reminder_este_la_mihai
            kind: grammar_note
            target: {text: "este · la · Mihai", language_code: ro, direction: ltr}
            introduced_tokens: [este, la, Mihai]
          - content_key: ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza
            kind: grammar_note
            target: {text: "lucrez · lucrează", language_code: ro, direction: ltr}
            introduced_tokens: [lucrez, lucrează]
          - content_key: ro.a1.unit17.lesson01.teach.inginer_vocab
            kind: vocabulary
            target: {text: "Inginer", language_code: ro, direction: ltr}
            introduced_tokens: [inginer]
            example:
              - {text: "Mihai este inginer.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit17.lesson01.teach.birou_vocab
            kind: vocabulary
            target: {text: "Birou", language_code: ro, direction: ltr}
            introduced_tokens: [birou]
            example:
              - {text: "Lucrează la birou.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase
            kind: phrase
            target: {text: "Mihai este inginer. Lucrează la birou.", language_code: ro, direction: ltr}
            introduced_tokens: [mihai, este, inginer, lucrează, la, birou]
        exercises:
          - content_key: ro.a1.unit17.lesson01.exercise01.choose_inginer
            type: multiple_choice
            tested_text: "inginer"
            prompt:
              target_blocks:
                - {text: "engineer", language_code: en, direction: ltr}
          - content_key: ro.a1.unit17.lesson01.exercise02.choose_birou
            type: multiple_choice
            tested_text: "birou"
            prompt:
              target_blocks:
                - {text: "office", language_code: en, direction: ltr}
          - content_key: ro.a1.unit17.lesson01.exercise03.listen_mihai_este_inginer
            type: listen_select
            tested_text: "Mihai este inginer"
            media_asset_key: ro.a1.audio.work.mihai_este_inginer.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit17.lesson01.exercise04.match_work1
            type: matching_pairs
            tested_text: "inginer birou lucrează este mihai este inginer lucrează la birou"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Inginer", right: "engineer"}
              - {left: "Birou", right: "office"}
              - {left: "Lucrează", right: "works"}
              - {left: "Este", right: "is"}
              - {left: "Mihai este inginer.", right: "Mihai is an engineer."}
              - {left: "Lucrează la birou.", right: "He works at the office."}
          - content_key: ro.a1.unit17.lesson01.exercise05.order_mihai_este_inginer
