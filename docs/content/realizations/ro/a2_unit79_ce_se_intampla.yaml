          - {"content_key": "ro.a2.unit79.lesson05.exercise06.dictare_ploua", "type": "dictation", "tested_text": "Ploua tare și era trafic mare", "media_asset_key": "ro.a2.audio.ce_se_intampla.ploua_tare_si_era_trafic_mare.01", "prompt": {"target_blocks": []}}
