          - {"content_key": "ro.a2.unit79.lesson05.teach.r1", "kind": "reading", "target": {"text": "Azi dimineață ploua tare și era trafic mare.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Azi", "dimineață", "ploua", "tare", "și", "era", "trafic", "mare"]}
          - {"content_key": "ro.a2.unit79.lesson05.teach.r2", "kind": "reading", "target": {"text": "Mergeam la serviciu cu autobuzul. Deodată autobuzul s-a oprit.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Mergeam", "la", "serviciu", "cu", "autobuzul", "Deodată", "s-a", "oprit"]}
          - {"content_key": "ro.a2.unit79.lesson05.teach.r3", "kind": "reading", "target": {"text": "Și ce ai făcut?", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Și", "ce", "ai", "făcut"]}
          - {"content_key": "ro.a2.unit79.lesson05.teach.r4", "kind": "reading", "target": {"text": "Am așteptat. Citeam o carte în timp ce oamenii se uitau pe geam.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Am", "așteptat", "Citeam", "o", "carte", "în", "timp", "ce", "oamenii", "se", "uitau", "pe", "geam"]}
          - {"content_key": "ro.a2.unit79.lesson05.teach.r5", "kind": "reading", "target": {"text": "Am ajuns la serviciu târziu.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Am", "ajuns", "la", "serviciu", "târziu"]}
