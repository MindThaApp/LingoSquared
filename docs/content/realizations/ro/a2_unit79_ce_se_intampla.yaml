          - {"content_key": "ro.a2.unit79.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Înțeleg. Eu mă uitam la televizor când am sunat.", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Înțeleg", "Eu", "mă", "uitam", "la", "televizor", "când", "am", "sunat"]}
          - {"content_key": "ro.a2.unit79.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Citeam o carte când ai sunat, dar nu am răspuns.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Citeam", "o", "carte", "când", "ai", "sunat", "dar", "nu", "am", "răspuns"]}
          - {"content_key": "ro.a2.unit79.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Nu e nimic. Vorbim mai târziu?", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Nu", "e", "nimic", "Vorbim", "mai", "târziu"]}
          - {"content_key": "ro.a2.unit79.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Da, vorbim mai târziu. Pa!", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Da", "vorbim", "mai", "târziu", "Pa"]}
        exercises:
          - {"content_key": "ro.a2.unit79.lesson06.exercise01.asculta_intrebare", "type": "listen_select", "tested_text": "Salut Ana Ce făceai când am sunat", "media_asset_key": "ro.a2.audio.dialogue.ce_se_intampla.01", "prompt": {"target_blocks": []}}
          - {"content_key": "ro.a2.unit79.lesson06.exercise02.intelege_autobuz", "type": "dialogue_comprehension", "tested_text": "Eram în autobuz", "media_asset_key": "ro.a2.audio.dialogue.ce_se_intampla.01", "prompt": {"target_blocks": [{"text": "Where was Ana when Mihai called?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit79.lesson06.exercise03.une_dialog", "type": "matching_pairs", "tested_text": "Ce făceai când am sunat Eram în autobuz Ploua tare Mă uitam la televizor Citeam o carte Nu am răspuns Nu e nimic Vorbim mai târziu", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ce făceai când am sunat?", "right": "What were you doing when I called?"}, {"left": "Eram în autobuz.", "right": "I was on the bus."}, {"left": "Ploua tare.", "right": "It was raining hard."}, {"left": "Mă uitam la televizor.", "right": "I was watching TV."}, {"left": "Citeam o carte.", "right": "I was reading a book."}, {"left": "Nu am răspuns.", "right": "I did not answer."}, {"left": "Nu e nimic.", "right": "It's nothing."}, {"left": "Vorbim mai târziu?", "right": "Shall we talk later?"}]}
          - {"content_key": "ro.a2.unit79.lesson06.exercise04.ordoneaza_citeam", "type": "word_order", "tested_text": "Citeam o carte când ai sunat", "prompt": {"target_blocks": []}, "word_bank": ["când", "carte", "Citeam", "ai", "o", "sunat"]}
          - {"content_key": "ro.a2.unit79.lesson06.exercise05.raspunde_citeam", "type": "dialogue_response", "tested_text": "Citeam o carte când ai sunat", "prompt": {"target_blocks": [{"text": "Ce făceai când am sunat?", "language_code": "ro", "direction": "ltr"}]}}
