          - {"content_key": "ro.a2.unit79.lesson05.exercise02.citeste_autobuz", "type": "reading_comprehension", "tested_text": "Mergeam la serviciu cu autobuzul", "prompt": {"target_blocks": [{"text": "What was Ana doing when the bus stopped?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit79.lesson05.exercise03.une_poveste", "type": "matching_pairs", "tested_text": "Ploua tare Era trafic mare Mergeam la serviciu Deodată autobuzul s-a oprit Am așteptat Citeam o carte Am ajuns la serviciu târziu", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ploua tare.", "right": "It was raining hard."}, {"left": "Era trafic mare.", "right": "There was heavy traffic."}, {"left": "Mergeam la serviciu.", "right": "I was going to work."}, {"left": "Deodată autobuzul s-a oprit.", "right": "Suddenly the bus stopped."}, {"left": "Am așteptat.", "right": "I waited."}, {"left": "Citeam o carte.", "right": "I was reading a book."}, {"left": "Am ajuns la serviciu târziu.", "right": "I arrived at work late."}]}
          - {"content_key": "ro.a2.unit79.lesson05.exercise04.ordoneaza_oprit", "type": "word_order", "tested_text": "Deodată autobuzul s-a oprit", "prompt": {"target_blocks": []}, "word_bank": ["oprit", "autobuzul", "Deodată", "s-a"]}
