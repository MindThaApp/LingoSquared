        teaching:
          - {"content_key": "ro.a2.unit79.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Salut, Ana! Ce făceai când am sunat?", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Salut", "Ana", "Ce", "făceai", "când", "am", "sunat"]}
