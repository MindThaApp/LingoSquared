generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's eleventh B1 unit, continuing the b1_unit01-10 authoring
    pass. Source-material check redone for this specific topic before
    authoring: the same public-domain source used throughout ro's corpus
    ("Basic Romanian Language Lessons," US Peace Corps Moldova, public
    domain, https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for summary/retelling markers (pe scurt, ideea
    principală, rezumat, detaliu) across the full 785-line extraction --
    zero hits. This unit is therefore authored fresh from general
    standard Romanian grammar/discourse knowledge, matching
    b1_unit01-10's precedent.

    Teaches the spine outcome's full requirement (universal.b1.
    communication.summarize_and_retell): (1) "pe scurt" ("in short/
    briefly," a discourse marker introducing a condensed retelling); (2)
    "ideea principală este că" ("the main idea is that," for stating the
    single most important point); (3) "acesta este doar un detaliu" ("this
    is just a detail," for explicitly flagging supporting detail that is
    NOT part of the main point) -- all three genuinely new. Reuses already-
    established cumulative vocabulary for the source material being
    summarized: "ședința" and "proiectul nou" from b1_unit05, "termenul
    limită" from b1_unit05. The culminating lesson05 exercise gives the
    learner a short passage with multiple details (who spoke, in what
    order, a side comment about the weather) and requires a genuinely
    condensed, ordered summary containing ONLY the main points (what was
    decided and by when) -- not a retelling of every detail -- matching
    the outcome's literal "give the main points... in a condensed,
    ordered form, distinguishing main points from detail" requirement.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-10) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-10). Reuses the "ședința despre proiectul nou" meeting
    established in b1_unit05 (Ana proposed an earlier meeting time for the
    new-project meeting; Diana was asked to send the report) as the
    real-world event Mihai narrates in full and Ana then summarizes --
    consistent with, not overwriting, b1_unit05's own resolution (that
    meeting was agreed to happen; this unit adds what was DECIDED at it,
    a new fact that unit never stated, so nothing is contradicted).
    Grepped the established character profiles before writing: Mihai
    remains inginer (a1_unit17, masculine-only "Sunt inginer"), Ana
    remains profesoară (feminine-only), Diana remains their office
    colleague (b1_unit04/06) -- no profession or biographical fact is
    contradicted here. All genuinely new vocabulary is introduced
    self-contained within this file; no other session's sibling-direction
    overlay was consulted while authoring.
  human_reviewed: true
review:
  status: reviewed
  required_next_reviewer: null
  notes: null

