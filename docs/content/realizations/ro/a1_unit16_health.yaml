units:
  - content_key: ro.a1.unit16.health
    title: "Sănătatea"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.health.describe_basic_problem
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit16.lesson01.ma_doare_capul
        title: "Mă doare capul"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - content_key: ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau
            kind: grammar_note
            target: {text: "mă · vă · ce · sau", language_code: ro, direction: ltr}
            introduced_tokens: [mă, vă, ce, sau]
          - content_key: ro.a1.unit16.lesson01.teach.doare_vocab
            kind: vocabulary
            target: {text: "Doare", language_code: ro, direction: ltr}
            introduced_tokens: [doare]
            example:
              - {text: "Mă doare.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit16.lesson01.teach.cap_vocab
            kind: vocabulary
            target: {text: "Cap", language_code: ro, direction: ltr}
            introduced_tokens: [cap, capul]
            example:
              - {text: "Mă doare capul.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit16.lesson01.teach.ce_va_doare_phrase
            kind: phrase
            target: {text: "Ce vă doare?", language_code: ro, direction: ltr}
            introduced_tokens: [ce, vă, doare]
          - content_key: ro.a1.unit16.lesson01.teach.stomac_vocab
            kind: vocabulary
            target: {text: "Stomac", language_code: ro, direction: ltr}
            introduced_tokens: [stomac, stomacul]
            example:
              - {text: "Mă doare stomacul.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase
            kind: phrase
            target: {text: "Mă doare capul sau stomacul?", language_code: ro, direction: ltr}
            introduced_tokens: [mă, doare, capul, sau, stomacul]
        exercises:
          - content_key: ro.a1.unit16.lesson01.exercise01.choose_cap
            type: multiple_choice
            tested_text: "cap"
            prompt:
              target_blocks:
                - {text: "head", language_code: en, direction: ltr}
          - content_key: ro.a1.unit16.lesson01.exercise02.choose_doare
            type: multiple_choice
            tested_text: "doare"
            prompt:
              target_blocks:
                - {text: "hurts", language_code: en, direction: ltr}
          - content_key: ro.a1.unit16.lesson01.exercise03.listen_ma_doare_capul
            type: listen_select
            tested_text: "Mă doare capul"
            media_asset_key: ro.a1.audio.health.ma_doare_capul.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit16.lesson01.exercise04.match_health1
            type: matching_pairs
            tested_text: "cap doare stomac mă doare capul mă doare stomacul ce vă doare"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Cap", right: "head"}
              - {left: "Doare", right: "hurts"}
              - {left: "Stomac", right: "stomach"}
              - {left: "Mă doare capul.", right: "My head hurts."}
              - {left: "Mă doare stomacul.", right: "My stomach hurts."}
              - {left: "Ce vă doare?", right: "What hurts you?"}
          - content_key: ro.a1.unit16.lesson01.exercise05.order_ma_doare_capul
            type: word_order
            tested_text: "Mă doare capul"
            prompt: {target_blocks: []}
            word_bank: ["doare", "Mă", "capul"]
          - content_key: ro.a1.unit16.lesson01.exercise06.listen_order_ce_va_doare
            type: listen_order
            tested_text: "Ce vă doare"
            media_asset_key: ro.a1.audio.health.ce_va_doare.01
            prompt: {target_blocks: []}
            word_bank: ["vă", "Ce", "doare"]
          - content_key: ro.a1.unit16.lesson01.exercise07.complete_ma_doare_capul
            type: fill_in_blank
            tested_text: "doare"
            prompt:
              target_blocks:
                - {text: "Mă ___ capul.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit16.lesson01.exercise08.speak_ma_doare_capul
            type: speak_response
            tested_text: "mă doare capul"
            prompt:
              target_blocks:
                - {text: "Say: My head hurts.", language_code: en, direction: ltr}

          - {content_key: ro.a1.unit16.lesson01.exercise09.dictation_ce_va_doare, type: dictation, tested_text: "Ce vă doare", media_asset_key: ro.a1.audio.health.ce_va_doare.01, prompt: {target_blocks: []}}
      - content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
        title: "Nu mă simt bine"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - content_key: ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de
            kind: grammar_note
            target: {text: "nu · bine · am · un · de", language_code: ro, direction: ltr}
            introduced_tokens: [nu, bine, am, un, de]
          - content_key: ro.a1.unit16.lesson02.teach.ma_simt_vocab
            kind: vocabulary
            target: {text: "Mă simt", language_code: ro, direction: ltr}
            introduced_tokens: [mă, simt]
            example:
              - {text: "Mă simt bine.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase
            kind: phrase
            target: {text: "Nu mă simt bine.", language_code: ro, direction: ltr}
            introduced_tokens: [nu, mă, simt, bine]
          - content_key: ro.a1.unit16.lesson02.teach.bolnav_vocab
            kind: vocabulary
            target: {text: "Bolnav", language_code: ro, direction: ltr}
            introduced_tokens: [sunt, bolnav]
            example:
              - {text: "Sunt bolnav.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase
            kind: phrase
            target: {text: "Am nevoie de un doctor.", language_code: ro, direction: ltr}
            introduced_tokens: [am, nevoie, de, un, doctor]
          - content_key: ro.a1.unit16.lesson02.teach.doctor_vocab
            kind: vocabulary
            target: {text: "Doctor", language_code: ro, direction: ltr}
            introduced_tokens: [doctor]
            example:
              - {text: "Am nevoie de un doctor.", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a1.unit16.lesson02.exercise01.choose_bolnav
            type: multiple_choice
            tested_text: "bolnav"
            prompt:
              target_blocks:
                - {text: "sick", language_code: en, direction: ltr}
          - content_key: ro.a1.unit16.lesson02.exercise02.choose_doctor
            type: multiple_choice
            tested_text: "doctor"
            prompt:
              target_blocks: []
          - content_key: ro.a1.unit16.lesson02.exercise03.listen_nu_ma_simt_bine
            type: listen_select
            tested_text: "Nu mă simt bine"
            media_asset_key: ro.a1.audio.health.nu_ma_simt_bine.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit16.lesson02.exercise04.match_health2
            type: matching_pairs
            tested_text: "mă simt nu mă simt bine bolnav sunt bolnav doctor am nevoie de un doctor"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Mă simt", right: "I feel"}
              - {left: "Nu mă simt bine.", right: "I don't feel well."}
              - {left: "Bolnav", right: "sick"}
              - {left: "Sunt bolnav.", right: "I am sick."}
              - {left: "Doctor", right: "doctor"}
              - {left: "Am nevoie de un doctor.", right: "I need a doctor."}
          - content_key: ro.a1.unit16.lesson02.exercise05.order_nu_ma_simt_bine
            type: word_order
            tested_text: "Nu mă simt bine"
            prompt: {target_blocks: []}
            word_bank: ["mă", "Nu", "bine", "simt"]
          - content_key: ro.a1.unit16.lesson02.exercise06.listen_order_am_nevoie_de_doctor
            type: listen_order
            tested_text: "Am nevoie de un doctor"
            media_asset_key: ro.a1.audio.health.am_nevoie_de_doctor.01
            prompt: {target_blocks: []}
            word_bank: ["nevoie", "Am", "de", "doctor", "un"]
          - content_key: ro.a1.unit16.lesson02.exercise07.complete_sunt_bolnav
            type: fill_in_blank
            tested_text: "bolnav"
            prompt:
              target_blocks:
                - {text: "Nu mă simt bine. Sunt ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit16.lesson02.exercise08.speak_am_nevoie_de_doctor
            type: speak_response
            tested_text: "am nevoie de un doctor"
            prompt:
              target_blocks:
                - {text: "Say: I need a doctor.", language_code: en, direction: ltr}

      - content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
        title: "Mihai este bolnav"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - content_key: ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da
            kind: grammar_note
