generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's
    sixth B2 unit (abstraction -- discussing abstract ideas and values).
    Built from general Romanian grammar/discourse knowledge, the same
    from-scratch disclosure the nl B2 lane set. Sibling isolation
    honored: the ro-en B2 abstraction realization and every other
    language's B2 file were treated as non-existent and were not opened;
    the nl B2 exemplar (b2_unit06_abstractie.yaml) informed structure
    only (lesson pacing, exercise-type sequencing: opinion -> nuance ->
    responding to a counterargument -> weighing pros/cons -> reading ->
    dialogue), never text -- the topic (whether volunteering should be
    mandatory in high school) was deliberately chosen fresh, distinct
    from both the Dutch exemplar's car-free-city topic and this course's
    own unit01 (public transport vs. car), to avoid thematic overlap; all
    Romanian content_keys and sentences were composed from scratch.
    Character canon: continues Ana (established profesoară,
    b1_unit01_necessity.yaml) and Mihai, ties the topic naturally to
    Ana's own profession (she teaches at a liceu), and keeps their
    established formal dumneavoastră register with each other. No
    sibling-direction file (ro-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority
    checks for the reviewer: (1) naturalness of the qualifying phrases
    (într-o anumită măsură, în general, în multe cazuri, nu neapărat,
    depinde de) and whether they read as genuine nuance-softeners to a
    native ear; (2) "Ar trebui voluntariatul să fie obligatoriu la
    liceu?" -- confirm this word order (subject after ar trebui) is
    natural, or whether "Voluntariatul ar trebui să fie obligatoriu la
    liceu" (statement order) should be the drilled default with the
    question as a variant; (3) "Înțeleg punctul dumneavoastră, dar nu
    sunt de acord" -- confirm this concession-then-disagreement frame
    reads naturally in the established formal register; (4) confirm
    "societate" and "sănătos" pair naturally with "pentru societate"/
    "sănătos pentru elevi" in the pros/cons lesson; (5) confirm
    "responsabilitate" and "comunitate" read as current everyday
    Romanian in this register.
  notes: >-
    Sixth Romanian B2 unit; first abstraction unit. Targets the CEFR B2
    abstraction outcome
    (universal.b2.abstraction.discuss_abstract_ideas_and_values):
    discuss abstract topics -- ideas, values, social issues -- expressing
    an opinion with qualification and responding to another person's
    view. Theme: one values debate across all six lessons -- should
    volunteering be mandatory in high school? Lesson arc: L01 stating an
    opinion (reuses unit01's cred că / în opinia mea, adds sunt
    convins/convinsă că, ar trebui); L02 qualifying it (într-o anumită
    măsură, în general, în multe cazuri, nu neapărat, depinde de); L03
    responding to a counterargument (reuses unit01's Este adevărat / Sunt
    de acord, adds Înțeleg punctul dumneavoastră, nu sunt de acord); L04
    weighing pros and cons (reuses unit01's pe de o parte / pe de altă
    parte / avantaje / dezavantaje, adds societate, sănătos); L05 a
    reading requirement -- an opinion piece that states a position,
    qualifies it, and weighs both sides; L06 the culminating production
    -- an Ana/Mihai discussion for the listening requirement, a speaking
    task and a writing task that each require a qualified opinion
    responding to a counterargument, not just connective drilling.
    Register: formal dumneavoastră throughout, continuing units 01-05.
    All vocabulary is introduced self-contained within the ro B2 course
    (cumulative with units 01-05 -- deliberately reuses unit01's
    argumentation vocabulary at the more abstract register-neutral
    values level this outcome targets). No sibling-direction file was
    consulted; the nl B2 exemplar informed structure only, not text.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every teaching card, gloss/example_gloss, option set,
    instruction and accepted-answer list here and in the en-ro overlay.
    Fixes (realization): lesson05.exercise01-04 (read_stance,
    read_qualification, read_concession, read_final_value) now show the
    reading passage in prompt.target_blocks before the question (it was
    never shown). Fixes (overlay):
    lesson01.exercise06.speak_sunt_convinsa and
    lesson05.exercise06.translate_o_idee_buna accepted only the feminine
    'Sunt convinsă că este o idee bună' -- now also accept masculine
    'Sunt convins...' and the 'e' forms (feedback names both genders);
    'e' alongside 'este' accepted in
    lesson04.exercise05.translate_sanatos,
    lesson04.exercise06.write_societate and lesson06.exercise05/06 (the
    unit teaches both); internal 'unit01' references removed from
    learner notes on teach.claim_model, grammar_forme_opinie,
    asta_e_adevarat_dar, nu_sunt_de_acord, pe_de_o_parte_alta;
    construction-language notes rewritten as language points on
    teach.voluntariatul ('the topic this whole unit debates'),
    claim_model ('model opinion for this unit') and
    grammar_opinie_completa ('what you produce in this lesson'). NATIVE
    FLAGS: 'Înțeleg punctul dumneavoastră' (and the reading's 'punctul
    celor care...') -- natural Romanian may require 'punctul
    dumneavoastră de vedere'; not changed (would touch audio, cards and
    many answers). DEFERRED: none.

    Second-pass review 2026-10-19: 0 fixes (2 overlay fixes, see en-ro
    b2_unit06). NATIVE FLAGS: 'Înțeleg punctul dumneavoastră' (vs '...
    punctul dumneavoastră de vedere') still open.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastră throughout (ro lane pin, continued from units
    01-05). Ana and Mihai discuss the topic formally with each other, per
    their established relationship. B2 abstraction layers qualifying and
    concession language onto that register -- într-o anumită măsură, în
    general, depinde de, Înțeleg punctul dumneavoastră -- while keeping
    the formal 2nd-person-plural verb forms (credeți, aveți) whenever Ana
    and Mihai address each other directly.

