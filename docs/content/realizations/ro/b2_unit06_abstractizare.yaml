        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: ro.b2.unit06.lesson01.teach.voluntariatul
            kind: vocabulary
            target: {text: "voluntariatul", language_code: ro, direction: ltr}
            introduced_tokens: [voluntariatul, voluntariat]
            example: {text: "Voluntariatul ajută comunitatea.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit06.lesson01.teach.obligatoriu
            kind: vocabulary
            target: {text: "obligatoriu", language_code: ro, direction: ltr}
            introduced_tokens: [obligatoriu]
            example: {text: "Cursul este obligatoriu.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit06.lesson01.teach.liceu
            kind: vocabulary
            target: {text: "liceu", language_code: ro, direction: ltr}
            introduced_tokens: [liceu]
            example: {text: "Ana predă la liceu.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit06.lesson01.teach.ar_trebui
            kind: vocabulary
            target: {text: "ar trebui", language_code: ro, direction: ltr}
            introduced_tokens: [ar, trebui]
            example: {text: "Elevii ar trebui să ajute.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit06.lesson01.teach.sunt_convinsa
            kind: vocabulary
            target: {text: "sunt convinsă / convins", language_code: ro, direction: ltr}
            introduced_tokens: [sunt, convinsă, convins]
            example: {text: "Sunt convinsă că voluntariatul ajută.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit06.lesson01.teach.o_idee_buna
            kind: phrase
            target: {text: "o idee bună", language_code: ro, direction: ltr}
            introduced_tokens: [o, idee, bună]
          - content_key: ro.b2.unit06.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Cred că voluntariatul ar trebui să fie obligatoriu la liceu.", language_code: ro, direction: ltr}
            introduced_tokens: [cred, că, să, fie, la]
          - content_key: ro.b2.unit06.lesson01.teach.grammar_forme_opinie
            kind: grammar_note
            target: {text: "Cred că voluntariatul ar trebui să fie obligatoriu la liceu. Sunt convinsă că este o idee bună.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit06.lesson01.exercise01.recognize_obligatoriu
            type: multiple_choice
            tested_text: "obligatoriu"
            prompt: {target_blocks: [{text: obligatoriu, language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit06.lesson01.exercise02.listen_claim_voluntariat
            type: listen_select
            tested_text: "Cred că voluntariatul ar trebui să fie obligatoriu la liceu"
            media_asset_key: ro.b2.audio.abstractizare.claim_voluntariat.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit06.lesson01.exercise03.match_opinion_words
            type: matching_pairs
            tested_text: "voluntariatul obligatoriu liceu ar trebui sunt convinsă o idee bună"
            prompt: {target_blocks: []}
            pairs:
