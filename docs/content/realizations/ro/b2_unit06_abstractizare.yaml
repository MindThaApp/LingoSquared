              - {left: liceu, right: "high school"}
              - {left: "ar trebui", right: should}
              - {left: "sunt convinsă", right: "I'm convinced (fem.)"}
              - {left: "o idee bună", right: "a good idea"}
          - content_key: ro.b2.unit06.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Voluntariatul ar trebui să fie obligatoriu la liceu"
            prompt: {target_blocks: []}
            word_bank: [Voluntariatul, ar, trebui, să, fie, obligatoriu, la, liceu]
          - content_key: ro.b2.unit06.lesson01.exercise05.translate_ar_trebui
