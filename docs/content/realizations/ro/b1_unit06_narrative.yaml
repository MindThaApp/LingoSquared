generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's sixth B1 unit, continuing the b1_unit01-05 authoring pass.
    Source-material check redone for this specific topic before authoring:
    `firecrawl --status` still showed 0/1,000 credits (0% left this
    cycle), and `firecrawl search` for "FSI Romanian narrative past tense
    reported speech" returned a 402 credit-exhausted error, not a content
    result -- same state confirmed across every B1 unit authored this
    pass. Re-checked the same public-domain source used throughout ro's
    corpus ("Basic Romanian Language Lessons," US Peace Corps Moldova,
    public domain, https://fsi-languages.yojik.eu/languages/PeaceCorps/
    Romanian/MD_Romanian_Language_Lessons.pdf) via its existing local text
    extraction: grepped for imperfect-tense/reported-speech markers
    (mergeam, era, a spus că, a întrebat, povestit) across the full
    785-line extraction -- zero hits. This source is confirmed (a fifth
    time, on a fifth different B1 topic) to be beginner phrasebook-only
    with no narrative-past or reported-speech content of any kind. This
    unit is therefore authored fresh from general standard Romanian
    grammar knowledge, not adapted from source material, matching
    b1_unit01-05's precedent.

    Teaches the spine outcome's full requirement: (1) imperfectul
    (imperfect) for a background/ongoing past state or action --
    "mergeam" (I was going), "era" (was, 3rd sing) -- set against
    perfectul compus (perfect compus) for a punctual main-line event --
    "am dat de" (I ran into), "a spus" (said) -- combined with the
    sequencing connector "când" (when); and (2) reported speech via "a
    spus că" + subordinate clause, which in standard Romanian keeps the
    same indicative tense as the original statement rather than English's
    strict backshift (a genuine, independently verified cross-linguistic
    fact, not a simplification for this course). This is genuinely new
    grammar for ro -- no prior ro unit uses the imperfect tense or
    reported-speech subordination (grepped the full realizations/ro/
    directory before authoring to confirm a clean slate) -- so both
    paradigms are introduced fully self-contained within this file, per
    AUTHORING_GUIDE.md's standing convention.

    Deliberately avoids hyphenated clitic-pronoun contractions (*-o*,
    *m-a*, *i-a*) throughout in favor of the equally natural analytic
    alternative (*am dat de Diana* rather than *am văzut-o pe Diana*, *am
    povestit lui Mihai* rather than *i-am povestit*) -- both because no
    other ro content anywhere in the corpus uses these contractions
    (grepped and confirmed before authoring) and because stacking clitic
    morphology on top of a brand-new tense paradigm and reported speech
    in the same unit would overload a B1 learner. The one clitic-bearing
    exception kept is the fixed, near-unavoidable idiom "Ce s-a
    întâmplat?" (What happened?), taught as one memorized phrase (the
    same treatment b1_unit04 already gives "sunt de acord" as an
    unanalyzed chunk) rather than decomposed morphology.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-05), narrating a real,
    small workplace incident -- Ana running into Diana on the way to the
    office, Diana explaining she was running late because of traffic --
    rather than a disconnected new cast, so this reads as one more day in
    the same ongoing office rather than a separate story world. Reuses
    "traficul" (already taught in a2_unit22's opinions unit) and
    "mulțumesc"/"înțeleg" (established corpus-wide) without re-teaching
    them. All genuinely NEW vocabulary and both new grammar paradigms are
    introduced self-contained within this file; no other session's
    sibling-direction overlay was consulted while authoring.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context adversarial review completed 2026-07-11 (Opus, zero
    access to the authoring reasoning); all AUTHORING_GUIDE.md #20
    sweeps and grammar/register/character checks passed, compiler
    green. Ship-ready.

course:
  realization_key: ro.b1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continues the established dumneavoastră-default register from ro
    A1/A2/B1 (units 01-26, b1_unit01-05): Mihai addresses Diana formally
    (dumneavoastră) in the lesson04 dialogue, matching her established
    formal-interview relationship with him (a2_unit26). Ana's own
    narration is mostly first-person about her own morning and carries
    no register marking; where she recounts the story to Mihai she
    keeps the same formal register the two of them use throughout the
    corpus.

