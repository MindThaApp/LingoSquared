            kind: dialogue
            target:
              text: "Aveți dreptate. Mulțumesc pentru părerea dumneavoastră!"
              language_code: ro
              direction: ltr
              speaker: Ana
            introduced_tokens: []
          - content_key: ro.a2.unit22.lesson04.teach.line06
            kind: dialogue
            target:
              text: "Cu plăcere, la revedere!"
              language_code: ro
              direction: ltr
              speaker: Mihai
            introduced_tokens: []
        exercises:
          - content_key: ro.a2.unit22.lesson04.exercise01.choose_who_gives_traffic_opinion
            type: multiple_choice
            tested_text: "Mihai"
            prompt:
              target_blocks:
                - {text: "Cred că traficul este prea aglomerat, pentru că sunt multe mașini.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson04.exercise02.dialogue_comprehend_traffic_opinion
            type: dialogue_comprehension
            tested_text: "prea aglomerat pentru că sunt multe mașini"
            media_asset_key: ro.a2.audio.dialogue.despre_oras.01
            prompt:
              target_blocks:
                - {text: "What is Mihai's opinion about traffic, and why?", language_code: en, direction: ltr}
