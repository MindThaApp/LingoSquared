          - content_key: ro.a2.unit22.lesson03.exercise06.write_opinion_with_reason
            type: writing_prompt
            tested_text: "cred că pentru că în opinia mea oraș parc"
            prompt: {target_blocks: []}

      - content_key: ro.a2.unit22.lesson04.despre_oras
        title: "Despre oraș"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: ro.a2.unit22.lesson04.teach.reminder_aveti_dreptate
            kind: grammar_note
            target: {text: "Aveți dreptate · Cu plăcere", language_code: ro, direction: ltr}
