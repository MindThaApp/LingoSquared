target_language: ro
cefr_level: A2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain, the same PDF used for units 01-21,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was checked first for any
    dedicated opinion-giving material. `firecrawl --status` still shows
    0/1,000 credits (unchanged since unit21's own check earlier today),
    so this unit again falls back to established-conventions-only
    authoring. Grepped the existing 785-line extraction for cred/
    părere/opinie/de acord/aglomerat and found only the single
    cognate-list hit already noted in unit21's own provenance ("opinie"
    appearing in a bare vocabulary-expansion list of Latin-derived
    words, not a lesson) -- confirmed again here rather than assumed:
    the source has zero dedicated opinion-exchange lesson content at
    any level. Every word and phrase here is authored fresh from
    general standard Romanian knowledge.

    Continues unit21's A2 grammar step-up with a new construction:
    "cred că" + clause (I think that...) as the standard opinion-frame,
    and "pentru că" + clause (because...) for the supporting reason --
    both genuinely new subordinate-clause conjunctions, building
    directly toward this unit's spine outcome (opinion + reason).
    Continues the established Ana/Mihai cast in their own established
    formal dumneavoastră register with each other (per unit01-21's
    register_policy) discussing the city's traffic and a nearby park --
    consistent with unit18's fact that Ana has a house (implying she
    lives in a residential part of the city) and doesn't touch any
    other established fact about either character.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Second Romanian A2 unit. Targets universal.a2.opinions.
    give_opinions_with_reasons (confirmed by grepping
    universal_spine.yaml directly -- prerequisites are
    universal.a1.preferences.express_preferences and
    universal.a1.comparisons.make_basic_comparisons, both already
    covered by this course's units 13/14). 4 lessons, each mapped to a
    distinct spine assessment_requirement: lesson01 (stating an opinion
    with a reason) covers give_and_support_opinion; lesson02 (agreeing/
    disagreeing) previews understand_opinion_and_reason's speaking-
    adjacent half and extends give_and_support_opinion to a contrasting
    opinion; lesson03 (reading a short opinion note) covers
    read_opinion_text and previews write_opinion_with_reason via its
    writing_prompt; lesson04 (the full Ana/Mihai conversation) covers
    understand_opinion_and_reason via its dialogue_comprehension items
    and consolidates all four.

    Reuses unit01's bună/mulțumesc/la revedere/Ana/Mihai, kept narrow
    (this unit's own new subordinate-clause grammar is the main
    cognitive load) and re-declared via a lesson-opening reminder card
    per the standing per-file token-scoping convention. Within this
    file, lesson02-04 freely reuse lesson01's own cred/că/pentru că/
    trafic/aglomerat without a fresh reminder card, matching the
    established within-file-reuse precedent.

    Checked this choice against AUTHORING_GUIDE #11 before finalizing.
    Facts this unit newly states: Ana thinks the city traffic is too
    congested because there are many cars; Mihai disagrees and thinks
    the nearby park is very beautiful instead; both agree the city
    itself is interesting overall. Grepped every earlier ro realization
    file for trafic/aglomerat/parc/frumos (park name, if any) and
    confirmed no prior unit states a conflicting opinion or fact about
    the city's traffic or parks -- unit19's own weather content
    ("Este soare," "E frig") is a factual weather statement, not an
    opinion about the city, so no conflict.

    Checked every fill_in_blank slot against AUTHORING_GUIDE #17: each
    blank's instruction explicitly states the target English meaning
    (lesson01's blank=aglomerat instruction names "too crowded"
    explicitly; lesson02's blank=acord instruction names "I agree"
    explicitly). Checked every listen_select/dialogue_comprehension
    distractor against the standing same-speaker-audio rule for
    lesson04's dialogue -- Mihai's and Ana's own lines were listed
    before writing distractors, and every distractor is either
    something neither speaker says in that clip, or (for "who says
    this") genuinely said by the other speaker only.

    Verified every word_order/listen_order exercise's word_bank token
    multiset exactly matches its paired overlay correct_response token
    multiset (case- and diacritic-exact) before finalizing, per the
    standing validate_order_word_bank_answers compiler check. Also
    verified every exercise's tested_text tokens are covered by some
    earlier introduced_tokens entry in this same file, per the standing
    validate_untaught_vocabulary compiler check (unit21 caught several
    real gaps of this exact kind -- checked proactively here rather
    than iterating against compiler errors). Needs a fresh-context
    content review before import, same as every other language's
    content.

course:
  realization_key: ro.a2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continues Ana and Mihai's own established formal dumneavoastră
    register with each other from units 01-21. New this unit:
    "cred că" (I think that) as the standard opinion-frame, "pentru că"
    (because) for a supporting reason, and "nu sunt de acord" (I don't
    agree) for a contrasting opinion.

media_assets:
  - content_key: ro.a2.audio.opinii.cred_ca_trafic.01
    language: ro
    text: "Cred că traficul este prea aglomerat, pentru că sunt multe mașini."
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: ro.a2.audio.opinii.care_parerea.01
    language: ro
    text: "Care este părerea dumneavoastră despre trafic?"
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: ro.a2.audio.opinii.nu_sunt_de_acord.01
    language: ro
    text: "Nu sunt de acord. Cred că parcul este foarte frumos."
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: ro.a2.audio.opinii.in_opinia_mea.01
    language: ro
    text: "În opinia mea, orașul este interesant, dar aglomerat."
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: ro.a2.audio.opinii.mesaj.01
    language: ro
    text: "Cred că parcul de lângă primărie este foarte frumos, dar mic. În opinia mea, orașul are nevoie de mai multe parcuri, pentru că sunt multe familii cu copii."
    voice_hint: neutral_adult_formal
    status: pending_generation
  - content_key: ro.a2.audio.dialogue.despre_oras.01
    language: ro
    text: "Ana: Bună ziua, Mihai! Care este părerea dumneavoastră despre trafic?\nMihai: Cred că traficul este prea aglomerat, pentru că sunt multe mașini.\nAna: Sunt de acord cu dumneavoastră. Dar parcul de lângă primărie este foarte frumos.\nMihai: Da, sunt de acord. În opinia mea, orașul este interesant, dar aglomerat.\nAna: Aveți dreptate. Mulțumesc pentru părerea dumneavoastră!\nMihai: Cu plăcere, la revedere!"
    voice_hint: adult_female_and_male_neutral_polite
    status: pending_generation

units:
  - content_key: ro.a2.unit22.opinii
    title: "Opinii"
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.opinions.give_opinions_with_reasons
    planned_lesson_count: 4

    lessons:
      - content_key: ro.a2.unit22.lesson01.cred_ca
        title: "Cred că..."
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: ro.a2.unit22.lesson01.teach.reminder_buna_multumesc_la_revedere_ana_mihai
            kind: grammar_note
            target: {text: "Bună ziua · Mulțumesc · La revedere · Ana · Mihai", language_code: ro, direction: ltr}
            introduced_tokens: [bună, ziua, mulțumesc, la, revedere, ana, mihai]
          - content_key: ro.a2.unit22.lesson01.teach.cred_grammar
            kind: grammar_note
            target: {text: "Cred că (I think that)", language_code: ro, direction: ltr}
            introduced_tokens: [cred, că]
          - content_key: ro.a2.unit22.lesson01.teach.trafic_vocab
            kind: vocabulary
            target: {text: "Trafic", language_code: ro, direction: ltr}
            introduced_tokens: [trafic, traficul]
            example:
              - {text: "Cred că traficul este prea aglomerat.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson01.teach.aglomerat_vocab
            kind: vocabulary
            target: {text: "Aglomerat", language_code: ro, direction: ltr}
            introduced_tokens: [aglomerat, prea, este]
            example:
              - {text: "Traficul este prea aglomerat.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson01.teach.pentru_ca_grammar
            kind: grammar_note
            target: {text: "Pentru că (because)", language_code: ro, direction: ltr}
            introduced_tokens: [pentru, că]
          - content_key: ro.a2.unit22.lesson01.teach.masini_vocab
            kind: vocabulary
            target: {text: "Mașini", language_code: ro, direction: ltr}
            introduced_tokens: [sunt, multe, mașini]
            example:
              - {text: "Sunt multe mașini în oraș.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson01.teach.cred_ca_trafic_phrase
            kind: phrase
            target: {text: "Cred că traficul este prea aglomerat, pentru că sunt multe mașini.", language_code: ro, direction: ltr}
            introduced_tokens: [cred, că, traficul, este, prea, aglomerat, pentru, sunt, multe, mașini]
        exercises:
          - content_key: ro.a2.unit22.lesson01.exercise01.choose_cred
            type: multiple_choice
            tested_text: "cred că"
            prompt:
              target_blocks:
                - {text: "I think that", language_code: en, direction: ltr}
          - content_key: ro.a2.unit22.lesson01.exercise02.choose_aglomerat
            type: multiple_choice
            tested_text: "aglomerat"
            prompt:
              target_blocks:
                - {text: "crowded", language_code: en, direction: ltr}
          - content_key: ro.a2.unit22.lesson01.exercise03.listen_cred_ca_trafic
            type: listen_select
            tested_text: "Cred că traficul este prea aglomerat, pentru că sunt multe mașini"
            media_asset_key: ro.a2.audio.opinii.cred_ca_trafic.01
            prompt: {target_blocks: []}
          - content_key: ro.a2.unit22.lesson01.exercise04.match_opinii1
            type: matching_pairs
            tested_text: "cred că trafic aglomerat pentru mașini bună ziua mulțumesc"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Cred că", right: "I think that"}
              - {left: "Trafic", right: "traffic"}
              - {left: "Aglomerat", right: "crowded"}
              - {left: "Pentru că", right: "because"}
              - {left: "Mașini", right: "cars"}
              - {left: "Prea", right: "too (excessively)"}
              - {left: "Bună ziua.", right: "Good day."}
              - {left: "Cred că traficul este prea aglomerat.", right: "I think the traffic is too crowded."}
          - content_key: ro.a2.unit22.lesson01.exercise05.order_cred_ca_trafic
            type: word_order
            tested_text: "Cred că traficul este prea aglomerat"
            prompt: {target_blocks: []}
            word_bank: ["Cred", "că", "traficul", "este", "prea", "aglomerat"]
          - content_key: ro.a2.unit22.lesson01.exercise06.listen_order_sunt_multe_masini
            type: listen_order
            tested_text: "Sunt multe mașini"
            media_asset_key: ro.a2.audio.opinii.cred_ca_trafic.01
            prompt: {target_blocks: []}
            word_bank: ["Sunt", "multe", "mașini"]
          - content_key: ro.a2.unit22.lesson01.exercise07.complete_cred_ca_trafic
            type: fill_in_blank
            tested_text: "aglomerat"
            prompt:
              target_blocks:
                - {text: "Complete the sentence, too crowded: Cred că traficul este prea ___.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson01.exercise08.write_opinion_reason
            type: writing_prompt
            tested_text: "cred că pentru că trafic aglomerat"
            prompt: {target_blocks: []}

      - content_key: ro.a2.unit22.lesson02.sunt_de_acord
        title: "Sunt de acord"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: ro.a2.unit22.lesson02.teach.parere_vocab
            kind: vocabulary
            target: {text: "Părere", language_code: ro, direction: ltr}
            introduced_tokens: [părere, care, este, părerea, dumneavoastră, despre]
            example:
              - {text: "Care este părerea dumneavoastră despre trafic?", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson02.teach.de_acord_vocab
            kind: vocabulary
            target: {text: "De acord", language_code: ro, direction: ltr}
            introduced_tokens: [sunt, de, acord, cu, nu]
            example:
              - {text: "Sunt de acord cu dumneavoastră.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson02.teach.parc_vocab
            kind: vocabulary
            target: {text: "Parc", language_code: ro, direction: ltr}
            introduced_tokens: [parc, parcul, foarte, frumos]
            example:
              - {text: "Parcul este foarte frumos.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson02.teach.care_parerea_phrase
            kind: phrase
            target: {text: "Care este părerea dumneavoastră despre trafic?", language_code: ro, direction: ltr}
            introduced_tokens: [care, este, părerea, dumneavoastră, despre, trafic]
          - content_key: ro.a2.unit22.lesson02.teach.nu_sunt_de_acord_phrase
            kind: phrase
            target: {text: "Nu sunt de acord. Cred că parcul este foarte frumos.", language_code: ro, direction: ltr}
            introduced_tokens: [nu, sunt, de, acord, cred, că, parcul, este, foarte, frumos]
        exercises:
          - content_key: ro.a2.unit22.lesson02.exercise01.choose_parere
            type: multiple_choice
            tested_text: "părere"
            prompt:
              target_blocks:
                - {text: "opinion", language_code: en, direction: ltr}
          - content_key: ro.a2.unit22.lesson02.exercise02.choose_de_acord
            type: multiple_choice
            tested_text: "de acord"
            prompt:
              target_blocks:
                - {text: "in agreement / agree", language_code: en, direction: ltr}
          - content_key: ro.a2.unit22.lesson02.exercise03.listen_care_parerea
            type: listen_select
            tested_text: "Care este părerea dumneavoastră despre trafic"
            media_asset_key: ro.a2.audio.opinii.care_parerea.01
            prompt: {target_blocks: []}
          - content_key: ro.a2.unit22.lesson02.exercise04.match_opinii2
            type: matching_pairs
            tested_text: "părere de acord parc frumos cred că trafic aglomerat"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Părere", right: "opinion"}
              - {left: "De acord", right: "in agreement / agree"}
              - {left: "Parc", right: "park"}
              - {left: "Frumos", right: "beautiful"}
              - {left: "Care este părerea dumneavoastră?", right: "What is your opinion?"}
              - {left: "Sunt de acord cu dumneavoastră.", right: "I agree with you."}
              - {left: "Nu sunt de acord.", right: "I don't agree."}
              - {left: "Cred că traficul este aglomerat.", right: "I think the traffic is crowded."}
          - content_key: ro.a2.unit22.lesson02.exercise05.order_nu_sunt_de_acord
            type: word_order
            tested_text: "Nu sunt de acord"
            prompt: {target_blocks: []}
            word_bank: ["Nu", "sunt", "de", "acord"]
          - content_key: ro.a2.unit22.lesson02.exercise06.listen_order_care_parerea
            type: listen_order
            tested_text: "Care este părerea dumneavoastră despre trafic"
            media_asset_key: ro.a2.audio.opinii.care_parerea.01
            prompt: {target_blocks: []}
            word_bank: ["Care", "este", "părerea", "dumneavoastră", "despre", "trafic"]
          - content_key: ro.a2.unit22.lesson02.exercise07.complete_nu_sunt_de_acord
            type: fill_in_blank
            tested_text: "acord"
            prompt:
              target_blocks:
                - {text: "Complete the sentence, I agree: Sunt de ___ cu dumneavoastră.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson02.exercise08.translate_i_dont_agree
            type: translation
            tested_text: "nu sunt de acord cred că parcul este foarte frumos"
            prompt:
              target_blocks:
                - {text: "I don't agree. I think the park is very beautiful.", language_code: en, direction: ltr}

      - content_key: ro.a2.unit22.lesson03.mesajul_despre_oras
        title: "Mesajul despre oraș"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: ro.a2.unit22.lesson03.teach.oras_vocab
            kind: vocabulary
            target: {text: "Oraș", language_code: ro, direction: ltr}
            introduced_tokens: [oraș, orașul, are, nevoie]
            example:
              - {text: "Orașul are nevoie de mai multe parcuri.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit22.lesson03.teach.in_opinia_mea_grammar
            kind: grammar_note
            target: {text: "În opinia mea (in my opinion)", language_code: ro, direction: ltr}
            introduced_tokens: [în, opinia, mea, dar, interesant]
          - content_key: ro.a2.unit22.lesson03.teach.in_opinia_mea_phrase
            kind: phrase
            target: {text: "În opinia mea, orașul este interesant, dar aglomerat.", language_code: ro, direction: ltr}
            introduced_tokens: [în, opinia, mea, orașul, este, interesant, dar, aglomerat]
          - content_key: ro.a2.unit22.lesson03.teach.mesaj_reading
            kind: reading
            target:
              text: "Cred că parcul de lângă primărie este foarte frumos, dar mic. În opinia mea, orașul are nevoie de mai multe parcuri, pentru că sunt multe familii cu copii."
              language_code: ro
              direction: ltr
            introduced_tokens: [lângă, primărie, mic, mai, multe, parcuri, familii, cu, copii]
        exercises:
          - content_key: ro.a2.unit22.lesson03.exercise01.read_park_opinion
            type: reading_comprehension
            tested_text: "parcul de lângă primărie este foarte frumos, dar mic"
