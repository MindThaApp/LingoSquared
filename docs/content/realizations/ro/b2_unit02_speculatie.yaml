      - content_key: ro.b2.unit02.lesson05.fapt_sau_speculatie
        title: "Fapt sau speculație?"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
          - content_key: ro.b2.unit02.lesson05.teach.text
            kind: reading
            target:
              text: >-
                Diana nu răspunde la telefon de dimineață. Poate este
                ocupată. Probabil este la o întâlnire, deci nu răspunde.
                Mașina ei este la birou. Trebuie să fie acolo. Nu poate fi
                acasă. S-ar putea să fi uitat telefonul.
              language_code: ro
              direction: ltr
            introduced_tokens: [dimineață, ei, acolo]
        exercises:
          - content_key: ro.b2.unit02.lesson05.exercise01.read_fact
            type: reading_comprehension
            tested_text: "Diana nu răspunde la telefon"
            prompt: {target_blocks: [{text: "Diana nu răspunde la telefon de dimineață. Poate este ocupată. Probabil este la o întâlnire, deci nu răspunde. Mașina ei este la birou. Trebuie să fie acolo. Nu poate fi acasă. S-ar putea să fi uitat telefonul.", language_code: ro, direction: ltr}, {text: "What is the one plain fact stated at the start of the text?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson05.exercise02.read_guess
            type: reading_comprehension
            tested_text: "Poate este ocupată"
            prompt: {target_blocks: [{text: "Diana nu răspunde la telefon de dimineață. Poate este ocupată. Probabil este la o întâlnire, deci nu răspunde. Mașina ei este la birou. Trebuie să fie acolo. Nu poate fi acasă. S-ar putea să fi uitat telefonul.", language_code: ro, direction: ltr}, {text: "Which sentence is a mere guess, with no evidence given?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson05.exercise03.read_deduction
            type: reading_comprehension
            tested_text: "trebuie să fie acolo"
            prompt: {target_blocks: [{text: "Diana nu răspunde la telefon de dimineață. Poate este ocupată. Probabil este la o întâlnire, deci nu răspunde. Mașina ei este la birou. Trebuie să fie acolo. Nu poate fi acasă. S-ar putea să fi uitat telefonul.", language_code: ro, direction: ltr}, {text: "Which sentence is a firm deduction, based on evidence?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson05.exercise04.read_evidence
            type: reading_comprehension
            tested_text: "Mașina ei este la birou"
            prompt: {target_blocks: [{text: "Diana nu răspunde la telefon de dimineață. Poate este ocupată. Probabil este la o întâlnire, deci nu răspunde. Mașina ei este la birou. Trebuie să fie acolo. Nu poate fi acasă. S-ar putea să fi uitat telefonul.", language_code: ro, direction: ltr}, {text: "What evidence does the text give for that deduction?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "dimineață ei acolo s-ar putea să fie trebuie să fie deci"
            prompt: {target_blocks: []}
            pairs:
              - {left: dimineață, right: morning}
              - {left: ei, right: her}
              - {left: acolo, right: there}
              - {left: "s-ar putea să fie", right: "it might be"}
              - {left: "trebuie să fie", right: "must be"}
              - {left: deci, right: "so / therefore"}
          - content_key: ro.b2.unit02.lesson05.exercise06.translate_trebuie_acolo
            type: translation
            tested_text: "Trebuie să fie acolo"
