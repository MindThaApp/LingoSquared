schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's
    second B2 unit (speculation). Built from general Romanian
    grammar/discourse knowledge, the same from-scratch disclosure the nl
    B2 lane set. Sibling isolation honored: the ro-en B2 speculation
    realization and every other language's B2 file were treated as
    non-existent and were not opened; the nl B2 exemplar informed
    structure only (lesson pacing, exercise-type sequencing), never text
    -- the scenario (a colleague, Diana, not answering her phone) and
    every Romanian sentence were composed from scratch. Character canon
    consulted directly from the ro b1 lane: Ana and Mihai continue their
    established formal dumneavoastra register with each other; Diana is
    the established colleague who works at Mihai's office and is learning
    English (pinned in b1_unit02_abilities.yaml: "Diana lucreaza acum la
    biroul lui Mihai"), reused here as the subject of the speculation, not
    a dialogue participant, so no new facts about her are asserted beyond
    what this unit itself needs (she works at Mihai's office; nothing
    about her English-learning is touched or contradicted). No
    sibling-direction file (ro-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of the graded-certainty scale
    (poate < probabil < sigur / cu siguranta < fara indoiala) and whether
    it reads in the intended order to a native ear; (2) the word order in
    the past-speculation clusters "trebuie sa fi uitat telefonul acasa"
    and "s-ar fi putut sa fi uitat" -- confirm "trebuie sa fi + participiu"
    is the natural spoken past-deduction form and that "s-ar putea sa fie"
    (present possibility) vs. "s-ar putea sa fi uitat" (past possibility)
    are both handled naturally; (3) confirm the deduction-vs-guess
    distinction taught in lesson03/lesson06 (deduction = trebuie sa fie +
    evidence via deci; guess = poate / s-ar putea sa fie / presupun, no
    firm evidence) matches how a native speaker would frame it; (4) note
    that "poate" is deliberately taught with two distinct grammatical
    functions in this unit -- the certainty adverb "maybe" (lesson01) and
    the 3rd-person verb "(he/she) can" inside "nu poate fi" (lesson02) --
    confirm this dual role is flagged clearly enough in the overlay notes
    that a learner is not confused; (5) confirm "ocupata", "birou", and
    "s-ar putea" all read as current everyday Romanian in this register.
  notes: >-
    Second Romanian B2 unit; first speculation unit. Targets the CEFR B2
    speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    speculate about causes and consequences with graded certainty -- say
    what may/might/must/cannot be the case in the PRESENT and the PAST,
    and distinguish deduction (evidence-based) from guesswork. Theme: one
    coherent everyday puzzle across all six lessons -- a colleague (Diana)
    is not answering her phone, and Ana and Mihai speculate why. Lesson
    arc: L01 the certainty scale (poate/probabil/sigur/cu siguranta/fara
    indoiala), L02 deduction with evidence (trebuie sa fie / nu poate fi,
    signposted with deci), L03 distinguishing a firm deduction from a mere
    guess (s-ar putea sa fie / posibil / a sti vs. a ghici), L04 the same
    distinction applied to the PAST (poate + perfectul compus vs. trebuie
    sa fi + participiu), L05 a short text separating stated fact from
    speculation, L06 the culminating production -- an Ana/Mihai
    speculation dialogue for the listening requirement plus a speaking
    task and a writing task that each require a chained speculation
    (guess -> deduction with evidence -> past deduction), not just
    connective drilling. Register: formal dumneavoastra between Ana and
    Mihai, per their established relationship; Diana (third person,
    subject of the speculation) needs no register decision of her own.
    All vocabulary is introduced self-contained within the ro B2 course
    (cumulative with unit01, per this course's own token accumulation --
    reuses "poate", "cred ca", "nu", "de ce", "o" etc. already taught in
    unit01). No sibling-direction file was consulted; the nl B2 exemplar
    informed structure only, not text.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every teaching card, gloss/example_gloss, option set,
    instruction and accepted-answer list here and in the en-ro overlay.
    Fixes (realization + overlay): ghicesc -> presupun throughout (a
    ghici = guess an answer/riddle; hedging 'I guess that...' is
    presupun că): teach.ghicesc target/introduced_tokens/example
    ('Presupun că este ocupată.'),
    lesson03.exercise03.match_possibility_words pair {presupun: 'I
    suppose / I guess'} + tested_text,
    lesson03.exercise07.write_nu_stiu_ghicesc
    tested_text/accepted/instruction/feedback ('Nu știu sigur, dar
    presupun că este acasă'); content keys kept unchanged.
    lesson01.exercise03.match_certainty_words pair sigur -> 'surely'
    (was 'certain / sure', confusable with cu siguranță = certainly) and
    teach.sigur title/gloss 'surely / sure'. lesson05.exercise01-04
    reading questions now show the reading passage in
    prompt.target_blocks. Overlay accepted answers widened:
    order_probabil_ocupata + 'Este probabil ocupată' (expected
    scrambled-permutation WARN), translate_probabil_intalnire + 'Este
    probabil la o întâlnire', translate_nu_poate_fi + 'Nu poate să fie
    acasă'. Added the 8 missing overlay teaching entries for lesson06
    (azi_dimineata, the six dialogue lines, grammar_speculatie_completa)
    -- they had no title/gloss. Construction notes ('lesson01',
    'lesson02', 'this whole unit') rewritten on teach.diana_nu_raspunde,
    poate, nu_poate_fi, s_ar_putea_sa_fie, trebuie_sa_fi. NATIVE FLAGS:
    presupun replacement to confirm; 'Poate a uitat telefonul' / 'Diana
    a uitat telefonul' -- natives often say 'și-a uitat'; consider
    accepting the reflexive form. DEFERRED: none.

    Second-pass review 2026-10-19: 5 fixes - 'azi dimineață' ->
    'azi-dimineață' (standard DOOM hyphenated adverb) in the dialogue
    audio, teach.azi_dimineata and dialogue_mihai_setup (overlay note
    updated); overlay accepted answers widened:
    lesson04.exercise05.translate_poate_uitat + 'Poate și-a uitat
    telefonul acasă', 'Poate că a uitat telefonul acasă', 'Poate că și-a
    uitat telefonul acasă'; lesson04.exercise06.translate_trebuie_sa_fi_uitat
    + 'Trebuie să-și fi uitat telefonul acasă';
    lesson04.exercise07.write_both_past + the reflexive pair;
    lesson01.exercise07.write_cu_siguranta + 'Este cu siguranță ocupată'.
    NATIVE FLAGS: 'Diana nu răspunde la telefon azi-dimineață' (present
    tense with a past time point; 'de azi-dimineață' = since this morning
    may be more natural); 'Trebuie să fi uitat telefonul' vs the more
    idiomatic reflexive 'să-și fi uitat telefonul' as the taught form.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastra throughout (ro lane pin, continued from unit01).
    Ana and Mihai address each other formally while speculating together
    about Diana (third person, no register of her own in this unit). B2
    speculation layers modals and certainty adverbs onto that register --
    trebuie sa fie, nu poate fi, s-ar putea sa fie, poate, probabil, cu
    siguranta, fara indoiala -- while keeping the formal 2nd-person-plural
    verb forms (credeti, aveti) whenever Ana and Mihai address each other
    directly.

media_assets:
  - content_key: ro.b2.audio.speculatie.probabil_ocupata.01
    language: ro
    text: "Probabil este ocupată."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: ro.b2.audio.speculatie.trebuie_intalnire.01
    language: ro
    text: "Trebuie să fie la o întâlnire."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: ro.b2.audio.speculatie.sar_putea_intalnire.01
    language: ro
    text: "S-ar putea să fie la o întâlnire."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: ro.b2.audio.speculatie.trebuie_uitat.01
    language: ro
    text: "Trebuie să fi uitat telefonul acasă."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: ro.b2.audio.speculatie.dialog.diana.01
    language: ro
    text: >-
      Mihai: Diana nu răspunde la telefon azi-dimineață. Ana: Poate este
      ocupată. Mihai: Mașina ei este la birou, deci trebuie să fie
      acolo. Ana: Nu poate fi acasă. Mihai: S-ar putea să fi uitat
      telefonul. Ana: Trebuie să fi uitat telefonul acasă.
    voice_hint: two_adults_formal_neutral
    status: pending_generation

units:
  - content_key: ro.b2.unit02.speculatie
    title: "Speculație"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.speculation.hypothesize_about_causes_and_consequences
    planned_lesson_count: 6

    lessons:
      - content_key: ro.b2.unit02.lesson01.certitudine
        title: "Gradul de certitudine"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
          - content_key: ro.b2.unit02.lesson01.teach.diana_nu_raspunde
            kind: phrase
            target: {text: "Diana nu răspunde la telefon.", language_code: ro, direction: ltr}
            introduced_tokens: [Diana, nu, răspunde, la, telefon, telefonul]
          - content_key: ro.b2.unit02.lesson01.teach.de_ce_nu_raspunde
            kind: phrase
            target: {text: "De ce nu răspunde?", language_code: ro, direction: ltr}
            introduced_tokens: [De, ce, nu, răspunde]
          - content_key: ro.b2.unit02.lesson01.teach.ocupata
            kind: vocabulary
            target: {text: "ocupată", language_code: ro, direction: ltr}
            introduced_tokens: [ocupată, ocupat]
            example: {text: "Diana este ocupată azi.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson01.teach.poate
            kind: vocabulary
            target: {text: "poate", language_code: ro, direction: ltr}
            introduced_tokens: [poate]
            example: {text: "Poate este ocupată.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson01.teach.probabil
            kind: vocabulary
            target: {text: "probabil", language_code: ro, direction: ltr}
            introduced_tokens: [probabil]
            example: {text: "Probabil este ocupată.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson01.teach.sigur
            kind: vocabulary
            target: {text: "sigur", language_code: ro, direction: ltr}
            introduced_tokens: [sigur]
            example: {text: "Sigur este ocupată.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson01.teach.cu_siguranta
            kind: vocabulary
            target: {text: "cu siguranță", language_code: ro, direction: ltr}
            introduced_tokens: [cu, siguranță]
            example: {text: "Cu siguranță este ocupată.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson01.teach.fara_indoiala
            kind: vocabulary
            target: {text: "fără îndoială", language_code: ro, direction: ltr}
            introduced_tokens: [fără, îndoială]
            example: {text: "Fără îndoială, este ocupată.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson01.teach.intalnire
            kind: vocabulary
            target: {text: "întâlnire", language_code: ro, direction: ltr}
            introduced_tokens: [întâlnire]
            example: {text: "Diana este la o întâlnire.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson01.teach.grammar_certitudine
            kind: grammar_note
            target: {text: "Poate este ocupată. Probabil este la o întâlnire. Cu siguranță răspunde mai târziu. Fără îndoială, este ceva important.", language_code: ro, direction: ltr}
            introduced_tokens: [mai, târziu, ceva, important]
        exercises:
          - content_key: ro.b2.unit02.lesson01.exercise01.recognize_poate
            type: multiple_choice
            tested_text: "poate"
            prompt: {target_blocks: [{text: "poate", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson01.exercise02.listen_probabil_ocupata
            type: listen_select
            tested_text: "Probabil este ocupată"
            media_asset_key: ro.b2.audio.speculatie.probabil_ocupata.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit02.lesson01.exercise03.match_certainty_words
            type: matching_pairs
            tested_text: "poate probabil sigur cu siguranță fără îndoială ocupată telefon întâlnire"
            prompt: {target_blocks: []}
            pairs:
              - {left: poate, right: maybe}
              - {left: probabil, right: probably}
              - {left: sigur, right: "surely"}
              - {left: "cu siguranță", right: certainly}
              - {left: "fără îndoială", right: undoubtedly}
              - {left: ocupată, right: busy}
              - {left: telefon, right: phone}
              - {left: întâlnire, right: meeting}
          - content_key: ro.b2.unit02.lesson01.exercise04.order_probabil_ocupata
            type: word_order
            tested_text: "Probabil este ocupată"
            prompt: {target_blocks: []}
            word_bank: [Probabil, este, ocupată]
          - content_key: ro.b2.unit02.lesson01.exercise05.translate_probabil_intalnire
            type: translation
            tested_text: "Probabil este la o întâlnire"
            prompt: {target_blocks: [{text: "She is probably at a meeting.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson01.exercise06.speak_fara_indoiala
            type: speak_response
            tested_text: "Fără îndoială, este ocupată"
            prompt: {target_blocks: [{text: "Say aloud in Romanian: Without a doubt, she is busy.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson01.exercise07.write_cu_siguranta
            type: writing_prompt
            tested_text: "Cu siguranță este ocupată"
            prompt: {target_blocks: [{text: "Write in Romanian: Certainly she is busy.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson01.exercise08.dictation_probabil_ocupata
            type: dictation
            tested_text: "Probabil este ocupată"
            media_asset_key: ro.b2.audio.speculatie.probabil_ocupata.01
            prompt: {target_blocks: []}

      - content_key: ro.b2.unit02.lesson02.deductie
        title: "Deducția: dovezi și concluzii"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
          - content_key: ro.b2.unit02.lesson02.teach.trebuie_sa_fie
            kind: phrase
            target: {text: "trebuie să fie", language_code: ro, direction: ltr}
            introduced_tokens: [trebuie, să, fie]
          - content_key: ro.b2.unit02.lesson02.teach.nu_poate_fi
            kind: phrase
            target: {text: "nu poate fi", language_code: ro, direction: ltr}
            introduced_tokens: [nu, poate, fi]
          - content_key: ro.b2.unit02.lesson02.teach.acasa
            kind: vocabulary
            target: {text: "acasă", language_code: ro, direction: ltr}
            introduced_tokens: [acasă]
            example: {text: "Diana nu este acasă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson02.teach.deci
            kind: vocabulary
            target: {text: "deci", language_code: ro, direction: ltr}
            introduced_tokens: [deci]
            example: {text: "Este ocupată, deci nu răspunde.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson02.teach.birou
            kind: vocabulary
            target: {text: "birou", language_code: ro, direction: ltr}
            introduced_tokens: [birou]
            example: {text: "Mihai este la birou.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson02.teach.a_suna
            kind: vocabulary
            target: {text: "sună", language_code: ro, direction: ltr}
            introduced_tokens: [sună]
            example: {text: "Diana sună la birou.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson02.teach.grammar_deductie
            kind: grammar_note
            target: {text: "Trebuie să fie la o întâlnire, deci nu răspunde. Nu poate fi acasă, pentru că este ocupată la birou.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit02.lesson02.exercise01.recognize_trebuie_sa_fie
            type: multiple_choice
            tested_text: "trebuie să fie"
            prompt: {target_blocks: [{text: "trebuie să fie", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson02.exercise02.listen_trebuie_intalnire
            type: listen_select
            tested_text: "Trebuie să fie la o întâlnire"
            media_asset_key: ro.b2.audio.speculatie.trebuie_intalnire.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit02.lesson02.exercise03.match_deduction_words
            type: matching_pairs
            tested_text: "trebuie să fie nu poate fi acasă deci birou sună ocupată întâlnire"
            prompt: {target_blocks: []}
            pairs:
              - {left: "trebuie să fie", right: "must be"}
              - {left: "nu poate fi", right: "cannot be"}
              - {left: acasă, right: home}
              - {left: deci, right: "so / therefore"}
              - {left: birou, right: office}
              - {left: sună, right: "rings / calls"}
              - {left: ocupată, right: busy}
              - {left: întâlnire, right: meeting}
          - content_key: ro.b2.unit02.lesson02.exercise04.order_trebuie_intalnire
            type: word_order
            tested_text: "Trebuie să fie la o întâlnire"
            prompt: {target_blocks: []}
            word_bank: [Trebuie, să, fie, la, o, întâlnire]
          - content_key: ro.b2.unit02.lesson02.exercise05.translate_nu_poate_fi
            type: translation
            tested_text: "Nu poate fi acasă"
            prompt: {target_blocks: [{text: "She cannot be home.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson02.exercise06.write_deci
            type: writing_prompt
            tested_text: "Trebuie să fie la o întâlnire, deci nu răspunde"
            prompt: {target_blocks: [{text: "Write in Romanian, using deci: She must be at a meeting, so she isn't answering.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson02.exercise07.translate_pentru_ca_birou
            type: translation
            tested_text: "Nu poate fi acasă, pentru că este ocupată la birou"
            prompt: {target_blocks: [{text: "She cannot be home, because she is busy at the office.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson02.exercise08.dictation_trebuie_intalnire
            type: dictation
            tested_text: "Trebuie să fie la o întâlnire"
            media_asset_key: ro.b2.audio.speculatie.trebuie_intalnire.01
            prompt: {target_blocks: []}

      - content_key: ro.b2.unit02.lesson03.presupunere
        title: "O presupunere sau o deducție?"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
          - content_key: ro.b2.unit02.lesson03.teach.s_ar_putea_sa_fie
            kind: phrase
            target: {text: "s-ar putea să fie", language_code: ro, direction: ltr}
            introduced_tokens: [s-ar, putea, să, fie]
          - content_key: ro.b2.unit02.lesson03.teach.posibil
            kind: vocabulary
            target: {text: "posibil", language_code: ro, direction: ltr}
            introduced_tokens: [posibil]
            example: {text: "Este posibil să fie ocupată.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson03.teach.stiu
            kind: vocabulary
            target: {text: "știu", language_code: ro, direction: ltr}
            introduced_tokens: [știu]
            example: {text: "Nu știu sigur.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson03.teach.ghicesc
            kind: vocabulary
            target: {text: "presupun", language_code: ro, direction: ltr}
            introduced_tokens: [presupun]
            example: {text: "Presupun că este ocupată.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit02.lesson03.teach.grammar_gok_vs_deductie
            kind: grammar_note
            target: {text: "Trebuie să fie la birou -- mașina este acolo, deci este o deducție. S-ar putea să fie ocupată -- nu știu sigur, deci este doar o presupunere.", language_code: ro, direction: ltr}
            introduced_tokens: [mașina, este, acolo, o, deducție, doar, presupunere]
        exercises:
          - content_key: ro.b2.unit02.lesson03.exercise01.recognize_posibil
            type: multiple_choice
            tested_text: "posibil"
            prompt: {target_blocks: [{text: "posibil", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson03.exercise02.listen_sar_putea_intalnire
            type: listen_select
            tested_text: "S-ar putea să fie la o întâlnire"
            media_asset_key: ro.b2.audio.speculatie.sar_putea_intalnire.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit02.lesson03.exercise03.match_possibility_words
            type: matching_pairs
            tested_text: "s-ar putea să fie posibil știu presupun trebuie să fie nu poate fi"
            prompt: {target_blocks: []}
            pairs:
              - {left: "s-ar putea să fie", right: "it might be"}
              - {left: posibil, right: possible}
              - {left: știu, right: "I know"}
              - {left: presupun, right: "I suppose / I guess"}
              - {left: "trebuie să fie", right: "must be"}
              - {left: "nu poate fi", right: "cannot be"}
          - content_key: ro.b2.unit02.lesson03.exercise04.order_sar_putea_intalnire
            type: word_order
            tested_text: "S-ar putea să fie la o întâlnire"
            prompt: {target_blocks: []}
            word_bank: [S-ar, putea, să, fie, la, o, întâlnire]
          - content_key: ro.b2.unit02.lesson03.exercise05.translate_sar_putea_ocupata
            type: translation
            tested_text: "S-ar putea să fie ocupată"
            prompt: {target_blocks: [{text: "She might be busy.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson03.exercise06.speak_posibil_ocupata
            type: speak_response
            tested_text: "Este posibil să fie ocupată"
            prompt: {target_blocks: [{text: "Say aloud in Romanian: It is possible that she is busy.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit02.lesson03.exercise07.write_nu_stiu_ghicesc
            type: writing_prompt
            tested_text: "Nu știu sigur, dar presupun că este acasă"
            prompt: {target_blocks: [{text: "Write in Romanian: I don't know for sure, but I guess she is home.", language_code: en, direction: ltr}]}

      - content_key: ro.b2.unit02.lesson04.trecutul
        title: "Speculând despre trecut"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
