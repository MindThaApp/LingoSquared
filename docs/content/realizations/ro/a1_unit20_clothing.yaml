status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-19
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl --status` confirmed 0/1,000 credits
    remaining, the same exhausted state every recent ro unit has hit), so
    this unit falls back to a fresh direct `curl` + `pdftotext -layout`
    re-fetch of the confirmed-working PDF (785-line extraction, matching
    every prior unit's own extraction length exactly). Grepped the full
    extracted text for cloth/shirt/pants/dress/shoe/size/wear/îmbrăc/
    haine/cămașă/pantaloni/rochie/pantof/pălărie and found NO dedicated
    clothing-shopping lesson anywhere in this source (confirmed by its
    own "Lesson N:" headers -- greetings, introductions, questions, the
    alphabet, pronouns, to be/to have, articles, numbers, days, months,
    basic words, basic adverbs/adjectives, food and drink, house
    orientation, four generic listening-exercise lessons -- the same
    scope already fully catalogued in unit18's/unit19's own provenance
    notes). The one real hit is Lesson 8's Definite Articles vocabulary
    list, which genuinely includes "tricou -- t-shirt (m.)" alongside its
    grammar-note example sentence "Tricoul este murdar." (The t-shirt is
    dirty.) -- source-confirmed from that exact list, respelled from the
    source's pre-1993 diacritics to modern standard orthography (no
    change needed here, "tricou" is spelled identically either way).
    "Murdar" (dirty) itself was deliberately NOT reused -- irrelevant to
    this unit's scope (identifying/buying clothing, not describing its
    condition). Every other new word this unit teaches (culoare, roșu,
    albastru, pantaloni, mărime) has NO attestation anywhere in this
    specific 785-line extraction and is authored fresh from general
    standard Romanian knowledge -- ordinary, high-frequency A1 clothing/
    shopping words a real course would teach, disclosed honestly here
    rather than overstated as source-confirmed. This unit deliberately
    reuses vreau/un (unit07/unit01), cât costă (unit07), ce (unit01),
    mic/mică/mare (unit14, a genuine within-course reminder exactly as
    unit14 itself flagged mare as a reminder from unit03/unit05), vă
    rog (unit06), bună/mulțumesc/bine/la revedere/și/Ana/Mihai (unit01/
    unit05), and zece/douăzeci/de/lei (unit02/unit07) -- all
    re-declared via lesson-opening reminder cards per the standing
    per-file token-scoping convention. Deliberately did NOT combine
    "mare" (invariant singular only) directly with the plural noun
    "pantaloni," which would require the untaught plural adjective form
    "mari" -- kept "mărime" (feminine, singular, invariant across which
    item is being discussed) as the sole noun that "mică"/"mare" modify
    throughout this unit, sidestepping a new plural-agreement rule this
    unit's own scope (identify/buy a clothing item by size and color,
    not adjective-noun plural agreement) doesn't call for, the same
    "avoid an unneeded new grammar point" technique unit19's own
    rece/frumos/rău exclusion already used. This unit deliberately
    continues the same Ana/Mihai cast established since unit01, with
    Mihai playing the shop-clerk role the exact same way he played the
    market-vendor role in unit07 (a situational role in one scene, not a
    stated occupation -- doesn't conflict with unit17's own "Mihai works
    at an office" fact, since no unit ever claims Mihai's shop-clerk
    turn is his real job, the identical non-conflict already established
    by unit07's own market scene predating unit17's own job content).
    Authored at schema_version 1.1 from the start -- every kind:
    vocabulary card carries a real example: sentence with a matching
    overlay example_gloss.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Twentieth Romanian unit, first draft, continuing directly from
    unit19 -- the first new ro unit since the full 19-unit review-debt
    burn-down completed. Targets universal.a1.clothing.
    describe_buy_clothing -- confirmed by grepping universal_spine.yaml
    directly: it's the entry immediately following universal.a1.weather.
    describe_basic_weather (unit19's own outcome) in spine order, its
    sole prerequisite is universal.a1.shopping.ask_prices_quantities
    (unit07, already covered), and its can_do text is "Identify common
    clothing items and complete a simple clothing purchase or exchange."
    This is also the exact outcome unit07's own review notes flagged as
    explicitly deferred ("explicitly does NOT cover clothing, sizes,
    colors ... those either belong to later spine outcomes
    (clothing.describe_buy_clothing)"), confirming this is the correct,
    intended next unit, not an arbitrary pick. This course's own
    established 3-lesson bootstrap pace and Ana/Mihai characters are
    used, matching units 01-19. 3 lessons, each mapped to a distinct
    spine assessment_requirement: lesson01 (Ana asks for a red t-shirt)
    covers understand_clothing_request; lesson02 (Ana asks about pants
    and sizes) covers request_clothing_item; lesson03 (a full Ana/Mihai
    shop dialogue, a clothing-label reading note, and a writing prompt)
    covers read_clothing_label and write_clothing_request, and
    consolidates all four.

    Reuses unit01's bună/mulțumesc/bine/la revedere/Ana/Mihai/ce,
    unit05's și, unit06's vă rog, unit07's vreau/un/cât costă, unit02's
    zece/douăzeci/de/lei, and unit14's mic/mică/mare, all re-declared via
    lesson-opening reminder cards per the standing per-file
    token-scoping convention (lesson01 reminds vreau/un/ce; lesson02
    reminds cât/costă/vă/rog and mic/mică/mare; lesson03 reminds
    bună/mulțumesc/bine/la/revedere/și/Ana/Mihai and zece/douăzeci/de/
    lei). Within this file, lesson02/03 freely reuse lesson01's own
    vreau/un/ce/tricou/culoare/roșu/albastru without a fresh reminder
    card, and lesson03 freely reuses lesson02's own cât/costă/mărime/
    mică/mare/pantaloni/vă/rog, matching the exact within-file-reuse
    precedent already established by units 09/15/16/17/18/19.

    Checked this choice against AUTHORING_GUIDE #11 carefully before
    finalizing. Facts this unit newly states: Ana buys a small red
    t-shirt for ten lei and a pair of pants for twenty lei from Mihai's
    shop counter. Grepped every earlier ro realization file for
    tricou/pantaloni/culoare/roșu/albastru/mărime and confirmed zero
    prior teaching-card or exercise usage of any of these as actual
    taught content -- no prior unit ever states a price for a t-shirt or
    pants, so there is no pre-existing fact to conflict with (unit07's
    own priced items are tomatoes and potatoes, a different product
    category entirely, and nothing in this course establishes a global
    "everything costs the same" fact that a differently-priced clothing
    item could contradict). unit17 established Mihai works at an office
    and Ana at a school; unit18 established Ana has a three-room house
    and Mihai a two-room apartment with one window -- this unit's shop
    scene doesn't touch any of those facts, the same non-conflicting
    "situational role, not a stated occupation" pattern unit07's own
    market scene already used successfully.

    Checked every fill_in_blank slot against AUTHORING_GUIDE #17's
    synonym-ambiguity concern, and confirmed every instruction states
    the target English meaning explicitly (the same disambiguating
    pattern every existing fill_in_blank in this course already uses,
    e.g. unit19's "Complete the forecast: Tomorrow it rains. It's windy
    and cold." for blank=frig): lesson01's "Vreau un tricou ___."
    (blank=roșu) pairs with instruction "Complete the sentence: I want a
    red t-shirt." -- roșu/albastru are genuinely different colors, not
    synonyms, and the instruction's own explicit "red" resolves any
    residual ambiguity the bare frame alone might have left. lesson02's
    "Ce ___?" (blank=mărime) pairs with instruction "Complete the
    question: What size?" and is also the exact continuation already
    established verbatim by this lesson's own ce_marime_phrase teaching
    card, the same "literal taught-phrase recall" reasoning unit19's own
    "frig" completion used. lesson03's "Pantalonii costă douăzeci de
    ___." (blank=lei) has no competing candidate -- lei is the only
    currency word this course has ever taught (unit07), identical to
    unit07's own "Costă cinci ___." precedent.

    Checked the lesson03 dialogue exercises against the standing
    same-speaker-distractor rule (extended to the "real content, wrong
    attribution" edge case, per unit18's "Două camere." and unit19's
    "Este soare." precedents). Listed every line each speaker actually
    says in the eight-line dialogue before writing distractors. Mihai's
    four lines are "Ce mărime?", "Zece lei.", "Pantalonii costă douăzeci
    de lei.", and "La revedere, Ana!". The dialogue_comprehension
    exercise asks "How much does the t-shirt cost?" (correct: "Zece
    lei.") with distractor "Cincisprezece lei." -- an amount nobody says
    anywhere in this dialogue's audio at all, deliberately chosen
    instead of the tempting "Douăzeci de lei." (which Mihai genuinely
    says, but about the pants, not the t-shirt -- exactly the "real
    audio content, wrong item" edge case this rule's extension exists to
    catch). The reading_comprehension exercise (a standalone clothing
    label, not tied to any dialogue audio: "Tricou albastru. Mărime
    mare." -- "What size is the t-shirt?", correct "Mare.", distractors
    "Mică."/"Albastru.") deliberately includes "Albastru." as a
    distractor even though it's genuinely stated in the same label --
    for a reading exercise the learner can re-read the label at leisure,
    and distinguishing "what size" from "what color" (a different fact
    stated in the same short text) is the actual point of the check, the
    same reasoning unit19's own reading_comprehension exercise already
    used for its two same-text distractors. This exercise has no
    media_asset_key at all (a pure reading text), so the same-speaker-
    audio concern doesn't apply to it in the first place. Both
    listen_select clips (lesson01/lesson02) use single-sentence audio,
    not multi-speaker dialogue audio, and their distractors were
    confirmed to be sentences from other, separate audio clips, never
    spoken in that specific clip.

    Verified every word_order/listen_order exercise's word_bank token
    multiset exactly matches its paired overlay correct_response token
    multiset (case- and diacritic-exact) before finalizing, per the
    standing instruction about the new validate_order_word_bank_answers
    compiler check and the real unit02 phone-number bug found and fixed
    the same day in this exact course. Needs a fresh-context content
    review before import, same as every other language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-19's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    formal register with each other -- "vă rog," not "te rog," reused
    via a reminder rather than re-taught). No new tu/dumneavoastră form
    is introduced this unit; the elliptical "Ce mărime?"/"Ce culoare?"
    shop-counter questions and the impersonal "Costă .../Pantalonii
    costă ..." price statements carry no register distinction of their
    own.

