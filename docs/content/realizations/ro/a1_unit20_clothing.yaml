            tested_text: "tricou culoare roșu albastru vreau un vreau un tricou roșu ce culoare"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Tricou", right: "t-shirt"}
              - {left: "Culoare", right: "color"}
              - {left: "Roșu", right: "red"}
              - {left: "Albastru", right: "blue"}
              - {left: "Vreau", right: "I want"}
              - {left: "Un", right: "a / an"}
              - {left: "Vreau un tricou roșu.", right: "I want a red t-shirt."}
              - {left: "Ce culoare?", right: "What color?"}
          - content_key: ro.a1.unit20.lesson01.exercise05.order_vreau_tricou_rosu
