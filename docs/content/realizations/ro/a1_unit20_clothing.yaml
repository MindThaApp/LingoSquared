    language: ro
    text: "Vreau un tricou roșu."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.clothing.ce_culoare.01
    language: ro
    text: "Ce culoare?"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.clothing.ce_marime.01
    language: ro
    text: "Ce mărime?"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.clothing.marime_mica_va_rog.01
    language: ro
    text: "Mărime mică, vă rog."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.dialogue.la_magazin.01
    language: ro
    text: "Ana: Bună, Mihai! Vreau un tricou roșu.\nMihai: Ce mărime?\nAna: Mărime mică, vă rog. Cât costă?\nMihai: Zece lei.\nAna: Bine! Vreau și pantaloni. Cât costă pantalonii?\nMihai: Pantalonii costă douăzeci de lei.\nAna: Mulțumesc, Mihai! La revedere!\nMihai: La revedere, Ana!"
    voice_hint: adult_female_and_male_neutral_polite
