    title: "Haine"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.clothing.describe_buy_clothing
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit20.lesson01.un_tricou_rosu
