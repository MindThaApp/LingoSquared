            prompt: {target_blocks: []}
            word_bank: ["culoare", "Ce"]
          - content_key: ro.a1.unit20.lesson01.exercise07.complete_vreau_tricou_rosu
            type: fill_in_blank
            tested_text: "roșu"
            prompt:
              target_blocks:
                - {text: "Vreau un tricou ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit20.lesson01.exercise08.speak_vreau_tricou_albastru
