            kind: grammar_note
            target: {text: "Vreau · Un · Ce", language_code: ro, direction: ltr}
            introduced_tokens: [vreau, un, ce]
          - content_key: ro.a1.unit20.lesson01.teach.tricou_vocab
            kind: vocabulary
            target: {text: "Tricou", language_code: ro, direction: ltr}
            introduced_tokens: [tricou]
            example:
              - {text: "Vreau un tricou.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit20.lesson01.teach.culoare_vocab
            kind: vocabulary
            target: {text: "Culoare", language_code: ro, direction: ltr}
            introduced_tokens: [culoare]
            example:
              - {text: "Ce culoare?", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit20.lesson01.teach.rosu_vocab
            kind: vocabulary
            target: {text: "Roșu", language_code: ro, direction: ltr}
            introduced_tokens: [roșu]
            example:
              - {text: "Vreau un tricou roșu.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit20.lesson01.teach.albastru_vocab
            kind: vocabulary
            target: {text: "Albastru", language_code: ro, direction: ltr}
            introduced_tokens: [albastru]
            example:
              - {text: "Vreau un tricou albastru.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase
            kind: phrase
            target: {text: "Vreau un tricou roșu.", language_code: ro, direction: ltr}
            introduced_tokens: [vreau, un, tricou, roșu]
        exercises:
          - content_key: ro.a1.unit20.lesson01.exercise01.choose_tricou
            type: multiple_choice
            tested_text: "tricou"
            prompt:
              target_blocks:
                - {text: "t-shirt", language_code: en, direction: ltr}
          - content_key: ro.a1.unit20.lesson01.exercise02.choose_rosu
            type: multiple_choice
            tested_text: "roșu"
