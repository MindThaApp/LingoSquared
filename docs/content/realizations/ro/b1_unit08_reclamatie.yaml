generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's eighth B1 unit, continuing the b1_unit01-07 authoring pass.
    Source-material check redone for this specific topic before authoring:
    the same public-domain source used throughout ro's corpus ("Basic
    Romanian Language Lessons," US Peace Corps Moldova, public domain,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for complaint/resolution markers (reclamație,
    deteriorat, rambursare, aș dori să) across the full 785-line
    extraction -- zero hits. This source is confirmed (a seventh time,
    on a seventh different B1 topic) to be beginner phrasebook-only with
    no complaint/service-resolution content. This unit is therefore
    authored fresh from general standard Romanian grammar knowledge,
    matching b1_unit01-07's precedent.

    Teaches the spine outcome's full requirement (universal.b1.services.
    make_complaint_and_resolve_problem): (1) describing what is wrong
    ("coletul a ajuns deteriorat", "lipsește o piesă"); (2) saying what
    already happened ("am sunat ieri, dar nimeni nu m-a ajutat", reusing
    the perfect-compus past tense established in b1_unit06's narrative
    unit); and (3) asking for a concrete resolution using the polite
    conditional-optativ "aș dori" ("I would like") -- a new, more formal
    register variant of the "aș" conditional already taught for advice
    in b1_unit07, here specifically for requesting a refund or
    replacement. The culminating lesson05 exercises require all three
    elements (problem + what already happened + requested resolution)
    combined in one complaint message, matching the outcome's compound
    can_do literally, not just each piece drilled separately.

    Scenario: Ana's office (established a1_unit17/a2_unit26/b1_unit02-07)
    ordered replacement office supplies that arrived damaged; Ana calls
    the supplier's customer-service line. The customer-service side is
    voiced by a generic, unnamed occupational role ("Agent," not a
    recurring character), deliberately avoiding any character-canon risk
    -- this is a one-off service call, not a corpus character, so no
    profile needed. Kept fully consistent with the ro corpus's formal
    dumneavoastră register: a complaint call to a business is formal in
    standard Romanian regardless of the general Ana/Mihai/Diana office
    register pin, so no register drift is introduced. All genuinely new
    vocabulary is introduced self-contained within this file; no other
    session's sibling-direction overlay was consulted while authoring.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second-pass review 2026-10-19: 2 fixes - lesson04 comprehension
    prompt "coletul lui Ana" corrected to the standard genitive "coletul
    Anei"; lesson05 complaint prompt "nimeni nu a ajutat" (missing
    object) corrected to "nimeni nu v-a ajutat". NATIVE FLAGS: the agent
    answers "my package arrived damaged" with "Ce lipsește exact?"
    although nothing missing was mentioned yet -- slight non-sequitur,
    left unchanged (ripples into several exercises); "Ce rezolvare
    doriți?" is understandable but "Ce soluție doriți?" may be more
    idiomatic.

course:
  realization_key: ro.b1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastră throughout, consistent with the ro corpus's
    default register (units 01-26, b1_unit01-07) and independently
    appropriate here since a complaint call to a business is formal in
    standard Romanian. Ana addresses the customer-service agent formally;
    the agent addresses Ana formally in return.

