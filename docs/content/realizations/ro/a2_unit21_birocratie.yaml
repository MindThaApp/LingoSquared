generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain, the same PDF used for units 01-20,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was checked first, per standing
    instruction, for any dedicated bureaucracy/registration-appointment
    material. `firecrawl --status` was re-checked today and still shows
    0/1,000 credits (the same exhausted state every recent ro unit has
    hit) -- tried anyway per instruction, still down, so this unit falls
    back to established-conventions-only authoring rather than a fresh
    source-adaptation pass. Grepped the existing 785-line extraction
    (already on disk from unit20's own fetch) for birocra/primărie/
    programare/înscri/formular/buletin/act and found zero dedicated
    lesson content -- the source's own scope is entirely A1 (greetings,
    introductions, numbers, days/months, food, house orientation, four
    generic listening drills), already fully catalogued in units
    18/19/20's own provenance notes, and has no A2-level civic/
    bureaucratic material at all. This is the first ro unit to open
    universal_spine.yaml's A2 tier -- every word and phrase here is
    authored fresh from general standard Romanian knowledge (ordinary,
    high-frequency A2 civic-registration vocabulary), disclosed honestly
    rather than overstated as source-confirmed.

    This unit is also the first to introduce genuinely A2-level grammar
    per the standing pacing instruction: the conditional mood ("aș
    dori," "ați putea") for polite formal requests, and the reflexive
    "să"-subjunctive construction ("să mă înscriu") for registering
    oneself -- both new to this course, building on but going beyond
    A1's "vreau"/imperative-only register. Continues the established
    Ana/Mihai cast (Ana as protagonist, consistent with her unit17
    fact "profesoară, lucrează la școală" and her unit18 fact "casă
    mare, trei camere" -- neither fact is touched by this unit's scene)
    and introduces one new character, funcționara Elena, a city-hall
    clerk -- a new named character rather than reusing Mihai for an
    official role, since Mihai's own established engineer/office job
    (unit17) has no plausible connection to municipal registration
    work.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    First Romanian A2 unit. Targets universal.a2.bureaucracy.
    register_with_authorities (confirmed by grepping
    universal_spine.yaml directly -- prerequisites are
    universal.a1.introductions.exchange_identity,
    universal.a1.housing.describe_home, and
    universal.a1.communication.basic_phone_contact; this course's A1
    units 01/18 cover the first two directly, and the phone-contact
    prerequisite is treated as satisfied by this unit's own
    appointment-booking framing rather than a literal phone call, the
    same latitude nl's a2_unit24 used for the identical outcome). 4
    lessons, each mapped to a distinct spine assessment_requirement:
    lesson01 (booking an appointment) covers
    understand_registration_requirements's listening half via its
    listen_select items and previews complete_registration_exchange;
    lesson02 (what documents are needed) covers
    understand_registration_requirements fully; lesson03 (reading a
    posted notice) covers read_registration_notice and previews
    write_registration_request via its writing_prompt; lesson04 (the
    full Ana/Elena appointment dialogue) covers
    complete_registration_exchange and consolidates all four.

    Reuses unit01's bună/mulțumesc/la revedere/Ana -- deliberately kept
    this unit's own reminder set narrow (bună ziua/mulțumesc/la revedere
    only) since the new conditional/subjunctive grammar is itself the
    main cognitive load this unit adds; re-declared via lesson-opening
    reminder cards per the standing per-file token-scoping convention.
    Within this file, lesson02-04 freely reuse lesson01's own aș dori/
    programare/mă înscriu without a fresh reminder card, matching the
    established within-file-reuse precedent from units 09/15-20.

    Checked this choice against AUTHORING_GUIDE #11 before finalizing.
    Facts this unit newly states: Ana has a ten o'clock appointment at
    the primărie to register at her new address, brings her buletin and
    actul de proprietate (property deed -- consistent with unit18's own
    "Ana are o casă mare," a house implies ownership rather than a
    rental, so "actul de proprietate" is the correct document choice,
    not a rental contract), and the appointment is confirmed complete
    with the confirmation to arrive by post. No prior unit states
    anything about Ana's registration status or any document she holds,
    so nothing here conflicts.

    Checked every fill_in_blank slot against AUTHORING_GUIDE #17: each
    blank's instruction states the target English meaning explicitly
    (lesson01's "Complete the sentence: I would like to register." for
    blank=înscriu; lesson02's "Complete the sentence: You need your ID
    and the property deed." for blank=proprietate; lesson03's fill blank
    on the posted-hours sentence explicitly names "nine to fifteen" in
    the instruction). Checked every listen_select/dialogue_comprehension
    distractor against the standing same-speaker-audio rule: Elena's
    dialogue lines were listed before writing lesson04's distractors,
    and every distractor is either a line neither speaker says in that
    clip, or (for the "who says this" multiple_choice) genuinely said by
    the OTHER speaker, never a line the tested speaker also says
    elsewhere in the same audio.

    Verified every word_order/listen_order exercise's word_bank token
    multiset exactly matches its paired overlay correct_response token
    multiset (case- and diacritic-exact) before finalizing, per the
    standing validate_order_word_bank_answers compiler check. Needs a
    fresh-context content review before import, same as every other
    language's content.

course:
  realization_key: ro.a2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Fully formal register throughout -- dumneavoastră with the city-hall
    clerk (Ana and Elena have never met), matching this course's
    existing formal-with-strangers convention from units 01-20. New this
    unit: the conditional "aș dori"/"ați putea" as the polite-request
    register step-up from A1's plain "vreau," and the reflexive
    "să mă înscriu" construction.

