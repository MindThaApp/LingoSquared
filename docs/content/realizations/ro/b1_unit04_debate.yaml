schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's fourth B1 unit, same authoring pass as b1_unit01-03 (see
    b1_unit01's provenance note for the firecrawl-down/source-recheck
    detail, which applies identically here -- fresh-authored, no
    adaptable debate/agreement-with-reasons content exists in the Peace
    Corps Moldova PD source used for ro's A1/A2 units).

    Teaches agreeing/disagreeing with a stated opinion and supporting
    your own position with a reason, referencing the other person's view
    via a subordinate clause -- "Sunt de acord cu ce ați spus" (I agree
    with what you said), "Sunt de acord cu dumneavoastră că..." (I agree
    with you that...), matching the spine outcome's "using a subordinate
    that-clause to report or reference the other person's view."
    Directly continues a2_unit22's opinions unit (its own spine
    prerequisite): reuses "cred că," "în opinia mea," "sunt de acord"/
    "nu sunt de acord," and "aveți dreptate," all first established
    there, now combined with a genuine reason clause and an explicit
    reference back to what the other speaker said -- the B1 step-up
    from A2's simpler "state an opinion" to "engage with someone else's
    opinion and justify your own." New grammar specifically introduced
    here: perfect-tense "ce ați spus" (what you said/have said, 2nd-
    person-formal perfect of a spune), extending unit02's overlay note
    that ro's A2 course already established a general perfect-compus
    pattern via "am lucrat."

    Unlike units 01-03's modal/mood-paradigm structure, this unit's
    lessons are organized by communicative function (agree+reason,
    disagree+reason, reference-what-was-said) rather than a person
    paradigm, since "de acord" itself doesn't conjugate -- only the
    copula *a fi* around it does, and that paradigm is already fully
    established from A1. Debate topic: remote work vs. office work, a
    natural, real-world B1 debate subject that also ties directly into
    Mihai's established office job (unit01/02) without contradicting
    anything about it. Continues Ana, Mihai, and Diana (established in
    unit02) with the same formal register. All vocabulary is introduced
    self-contained within this file.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Not yet reviewed. Needs the mandatory fresh-context review before
    being considered ship-ready, per AUTHORING_GUIDE.md #9.

course:
