  - content_key: ro.b1.audio.dialogue.lucru_de_acasa.01
    language: ro
    text: "Ana: Bună ziua, Mihai! Ce părere aveți despre lucrul de acasă? Mihai: Cred că lucrul de acasă este mai eficient, pentru că nu pierdem timp cu drumul. Ana: Sunt de acord cu ce ați spus, dar cred că este mai greu să comunicăm cu echipa. Mihai: Aveți dreptate, dar cred că ambele au avantaje. Ana: Nu sunt de acord complet, pentru că, în opinia mea, comunicarea directă este foarte importantă. Mihai: Înțeleg. Poate ambele variante sunt bune."
