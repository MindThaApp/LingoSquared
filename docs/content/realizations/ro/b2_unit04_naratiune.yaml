generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's
    fourth B2 unit (narrative: shifting time reference). Built from
    general Romanian grammar/discourse knowledge, the same from-scratch
    disclosure the nl B2 lane set. Sibling isolation honored: the ro-en B2
    narrative realization and every other language's B2 file were treated
    as non-existent and were not opened; the nl B2 exemplar informed
    structure only (lesson pacing, exercise-type sequencing), never text
    -- the scenario (Mihai's car breaking down on the way to a client
    meeting) was deliberately chosen to avoid the Dutch exemplar's own
    missed-train motif, and every Romanian sentence was composed from
    scratch. Character canon consulted directly from the ro corpus: Mihai
    (inginer) attending client meetings is already established
    (a2_unit26_interviul.yaml has Mihai conducting a job interview;
    b1_unit05/18 have Mihai in professional meetings), and Ana continues
    her established formal dumneavoastra register as Mihai's listener. No
    sibling-direction file (ro-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) confirm "Cand mergeam spre intalnire, masina
    s-a stricat" is the natural word order for an ongoing imperfect
    action interrupted by a perfectul-compus event, and that "in timp ce"
    is handled the same way; (2) confirm "nu mai fusese la service de
    mult" is the natural mai-mult-ca-perfectul (pluperfect) construction
    for "hadn't been serviced in a long time", and that "asa ca" is the
    right connective for the resulting consequence; (3) confirm
    "s-a stricat" (reflexive-passive, the car broke down BY ITSELF) is
    correct here rather than a transitive construction; (4) confirm the
    lesson06 shift from third-person narration (lessons 1-5, about Mihai)
    to first-person narration (lesson06, Mihai telling his own story) is
    grammatically clean -- specifically "am plecat", "mergeam", "am
    chemat", "am ajuns" -- and that a native speaker would tell this story
    in the first person the way this lesson assumes; (5) confirm "service"
    (the car-repair shop) reads as current everyday Romanian, not an
    anglicism that should be replaced.
  notes: >-
    Fourth Romanian B2 unit; first narrative unit. Targets the CEFR B2
    narrative outcome
    (universal.b2.narrative.recount_complex_events_with_shifting_time):
    recount a complex sequence of events with shifting time reference --
    background versus foreground, events before other past events, and
    interrupted or ongoing actions, keeping the timeline unambiguous.
    Theme: one coherent story across all six lessons -- Mihai's car
    breaks down on the way to an important client meeting. Lesson arc:
    L01 the background (imperfectul: era, ploua, se grăbea), L02 the
    foreground sequence (perfectul compus + mai întâi/apoi/în cele din
    urmă), L03 an ongoing action interrupted by an event (când/în timp ce
    + imperfectul, interrupted by perfectul compus), L04 the past before
    the past (mai mult ca perfectul: fusese, signposted with așa că), L05
    a short narrative text combining all four moves, L06 the culminating
    production -- Mihai retells his own story to Ana in the first person
    (a natural register shift for a first-person retelling) for the
    listening requirement plus a speaking task and a writing task that
    each require the FULL chain (background + prior fact + interrupted
    foreground + resolution), not just tense drilling. Register: formal
    dumneavoastra between Ana and Mihai, per their established
    relationship, even while Mihai narrates informally about his own
    morning. All vocabulary is introduced self-contained within the ro B2
    course (cumulative with units 01-03, per this course's own token
    accumulation -- reuses "dimineață", "s-a" pattern, "de", "că", "și"-
    adjacent connectives etc. already taught earlier in the course). No
    sibling-direction file was consulted; the nl B2 exemplar informed
    structure only, not text.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked teaching/exercise coverage, accepted answers vs prompts,
    distractor uniqueness, glosses, course-internal references and reading
    prompts. Fixes: lesson05.exercise05.match_reading_words pair lui:
    'his' -> "of / 's (Mihai's)" (genitive article in Mașina lui Mihai;
    overlay mirror and teach.text gloss updated); lesson05 exercise01-04
    (read_*) prompt.target_blocks now carry the reading passage (ro)
    before the question; overlay: lesson06 teaching entries added for all
    12 cards (with example_gloss for am_plecat, mergeam, am_chemat,
    am_ajuns), lesson03.exercise01.recognize_cand distractor 'while' ->
    'where' (when/while both valid for când), lesson03.teach.a_sunat gloss
    no longer mentions 'unit02'. NATIVE FLAGS: 'la service' glossed 'at
    the shop' (consider 'at the garage'); lesson01 exercise06 accepts only
    'Era dimineață devreme' -- confirm whether 'Era devreme dimineața'
    should be accepted. DEFERRED: none.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastra throughout (ro lane pin, continued from units
    01-03). Ana and Mihai address each other formally; lessons 01-05
    narrate Mihai's morning in the third person, and lesson06 shifts to
    Mihai recounting his own story in the first person while still
    speaking formally with Ana. B2 narrative layers shifting time
    reference onto that register -- era, se grăbea, a plecat, mai întâi,
    când mergea, nu mai fusese -- without changing the formal
    2nd-person-plural verb forms (credeți, ați) whenever Ana and Mihai
    address each other directly.

