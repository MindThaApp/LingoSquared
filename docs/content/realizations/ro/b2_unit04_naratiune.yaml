            type: multiple_choice
            tested_text: "ploua"
            prompt: {target_blocks: [{text: ploua, language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit04.lesson01.exercise02.listen_ploua_usor
            type: listen_select
            tested_text: "Ploua ușor"
            media_asset_key: ro.b2.audio.naratiune.ploua_usor.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit04.lesson01.exercise03.match_background_words
            type: matching_pairs
            tested_text: "era dimineață ploua ușor se grăbea spre importantă"
            prompt: {target_blocks: []}
            pairs:
              - {left: era, right: "it was"}
              - {left: dimineață, right: morning}
              - {left: ploua, right: "it was raining"}
              - {left: ușor, right: "lightly / easily"}
              - {left: "se grăbea", right: "was hurrying"}
              - {left: spre, right: towards}
              - {left: importantă, right: important}
          - content_key: ro.b2.unit04.lesson01.exercise04.order_se_grabea
