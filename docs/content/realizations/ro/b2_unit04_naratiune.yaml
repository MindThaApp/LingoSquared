            introduced_tokens: [Era, dimineață, devreme]
          - content_key: ro.b2.unit04.lesson01.teach.ploua
            kind: vocabulary
            target: {text: "ploua", language_code: ro, direction: ltr}
            introduced_tokens: [ploua]
            example: {text: "Afară ploua.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit04.lesson01.teach.usor
            kind: vocabulary
            target: {text: "ușor", language_code: ro, direction: ltr}
            introduced_tokens: [ușor]
            example: {text: "Ploua ușor azi dimineață.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit04.lesson01.teach.se_grabea
            kind: vocabulary
            target: {text: "se grăbea", language_code: ro, direction: ltr}
            introduced_tokens: [se, grăbea, Mihai]
            example: {text: "Mihai se grăbea dimineața.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit04.lesson01.teach.spre
            kind: vocabulary
            target: {text: "spre", language_code: ro, direction: ltr}
            introduced_tokens: [spre]
            example: {text: "Mergea spre birou.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit04.lesson01.teach.importanta
            kind: vocabulary
            target: {text: "importantă", language_code: ro, direction: ltr}
            introduced_tokens: [importantă, important]
            example: {text: "Avea o întâlnire importantă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit04.lesson01.teach.grammar_imperfect
            kind: grammar_note
            target: {text: "Era dimineață devreme. Ploua ușor. Mihai se grăbea spre o întâlnire importantă.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
