target_language: ro
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's
    seventh B2 unit (negotiation -- proposing, declining, conditioning,
    and agreeing). Built from general Romanian grammar/discourse
    knowledge, the same from-scratch disclosure the nl B2 lane set.
    Sibling isolation honored: the ro-en B2 negotiation realization and
    every other language's B2 file were treated as non-existent and were
    not opened; the nl B2 exemplar (b2_unit07_onderhandelen.yaml)
    informed structure only (lesson pacing: propose -> decline politely
    -> set a condition -> reach agreement -> reading -> dialogue), never
    text -- the scenario (organizing a small office celebration, who
    handles what) was chosen fresh, distinct from the Dutch exemplar's
    dinner-party-chores scenario, and every Romanian sentence and
    content_key was composed from scratch. Character canon: continues
    Ana and Mihai's established formal dumneavoastră register with each
    other (unlike unit05's deliberate register contrast with the new
    character Bogdan, this unit stays in the course's default formal
    register since Ana and Mihai are the ones negotiating). No
    sibling-direction file (ro-en) was consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority
    checks for the reviewer: (1) naturalness of "Ce-ar fi dacă ne
    ocupăm..." and "Ce ați spune despre..." as proposal openers; (2)
    "Nu merge" as a polite-enough refusal in the formal register --
    confirm it doesn't read as too blunt between Ana and Mihai, or
    whether a softer alternative should be preferred; (3) "cu condiția
    să" vs "doar dacă" -- confirm both are natural ways to set a
    condition and that the grammar note's contrast is accurate; (4)
    "Ne-am înțeles" as the natural way to seal an agreement; (5) confirm
    "bugetul", "decorațiunile", and "împărțim" read as current everyday
    Romanian in this workplace-planning context.
  notes: >-
    Seventh Romanian B2 unit; first negotiation unit. Targets the CEFR
    B2 negotiation outcome
    (universal.b2.negotiation.negotiate_and_resolve_disagreement):
    propose terms, push back on unacceptable ones, offer a conditional
    concession, and reach or decline an agreement while keeping the
    relationship intact. Theme: one everyday negotiation across all six
    lessons -- Ana and Mihai organize a small office celebration and
    negotiate who handles what. Lesson arc: L01 making a proposal
    (propun să, Ce ați spune despre, Ce-ar fi dacă); L02 politely
    declining part of it (nu merge, aș prefera, nu chiar tot); L03
    setting a condition (dacă...atunci, doar dacă, cu condiția să); L04
    reaching an agreement (Ne-am înțeles, Perfect de acord, împărțim
    bugetul); L05 a reading requirement -- a written summary of what was
    agreed, what stayed open, and what was declined; L06 the culminating
    production -- an Ana/Mihai negotiation dialogue for the listening
    requirement, a speaking task and a writing task that each require
    proposing a term, declining an unacceptable one, offering a
    conditional concession, and reaching agreement, not just connective
    drilling. Register: formal dumneavoastră throughout, continuing
    units 01-04/06. All vocabulary is introduced self-contained within
    the ro B2 course (cumulative with units 01-06 -- reuses "aș", "cred
    că", "sunt de acord", "chiar", "tot", "idee" etc. already taught
    earlier in the course). No sibling-direction file was consulted; the
    nl B2 exemplar informed structure only, not text.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every teaching card, gloss/example_gloss, option set,
    instruction and accepted-answer list here and in the en-ro overlay.
    Fixes (realization): lesson05.teach.text 'Ana s-a ocupat de mâncare,
    dar numai dacă...' (a completed action cannot be conditional) ->
    'Ana a acceptat să se ocupe de mâncare, dar numai dacă Mihai se
    ocupa de decorațiuni.' (introduced_tokens s-a/ocupat ->
    acceptat/ocupe); lesson05.exercise04.read_declined tested_text 'nu
    chiar cu tot' (said of Ana in the text, not Mihai) -> 'Mihai a
    preferat să nu se ocupe de toată mâncarea'; lesson05.exercise01-04
    now show the reading passage in prompt.target_blocks before the
    question. Fixes (overlay): all eight lesson06 teaching cards
    (buna_idee, inteleg, five dialogue cards,
    grammar_negociere_completa) had no English overlay entry --
    titles/glosses/example_gloss/note added; read_declined feedback no
    longer attributes 'nu chiar cu tot' to Mihai; lesson05 text gloss +
    glosses updated for the new sentence; speak_ce_ar_fi_daca accepts
    'Ce-ar fi dacă am face asta luna asta' and the unhyphenated 'Ce ar
    fi dacă...' forms; speak_conditional accepts 'Vin doar dacă este
    sigur'; translate_cu_conditia and write_full_negotiation accept the
    comma/no-comma variant (grader already ignores internal commas;
    added for parity); teach.petrecerea note no longer describes the
    unit's construction. NATIVE FLAGS: 'Perfect de acord.' alone vs
    'Sunt perfect de acord'; grammar_refuz 'toată mâncarea -- nu chiar
    tot' (tot after a feminine noun); 'Vin doar dacă e sigur' glossed
    'safe' where 'sigur' most naturally reads 'certain'; the reading's
    'Ana a fost de acord, dar nu chiar cu tot' does not match the
    dialogue (Mihai is the one who declines part of the deal); lesson05
    matching left 'ea' is introduced but never appears in the passage.
    DEFERRED: none.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastră throughout (ro lane pin, continued from units
    01-06). Ana and Mihai negotiate formally with each other, per their
    established relationship. B2 negotiation layers proposal, refusal,
    and conditional language onto that register -- propun să, Ce ați
    spune despre, aș prefera, cu condiția să, Ne-am înțeles -- while
    keeping the formal 2nd-person-plural verb forms (ați, dumneavoastră)
    whenever Ana and Mihai address each other directly.

