            example: {text: "Ana organizează o petrecere.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit07.lesson01.teach.propun
            kind: vocabulary
            target: {text: "propun", language_code: ro, direction: ltr}
            introduced_tokens: [propun]
