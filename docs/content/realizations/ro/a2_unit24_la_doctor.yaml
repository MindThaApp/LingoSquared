generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain, the same PDF used for units 01-23,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was checked first for a doctor-
    appointment lesson beyond the basic-symptom vocabulary this
    course's own unit16 already adapted from it. `firecrawl --status`
    still shows 0/1,000 credits, so this unit again falls back to
    established-conventions-only authoring for its NEW A2-level
    vocabulary (duration/severity phrasing, treatment/prescription
    words) -- unit16's own already-adapted A1 words (doare, cap,
    stomac, bolnav, doctor) are reused directly via reminder, not
    re-sourced.

    This unit deliberately builds on unit16's health A1 content rather
    than starting fresh: Mihai was the patient in unit16's own
    dialogue ("Mihai este bolnav," a headache); this unit switches to
    Ana as the patient on a different, later occasion, avoiding any
    "who is sick when" continuity conflict while reusing the same
    doare/cap A1 vocabulary as a genuine A2 depth extension (duration
    "de trei zile," severity "foarte tare," and real treatment/
    prescription vocabulary) rather than re-teaching the same A1
    content under a new unit number. Introduces one new character,
    Doctorița Vasile, a doctor -- a new named character for the same
    reason units 21/23 introduced Elena/Radu, since neither Ana's nor
    Mihai's established jobs connect to medical work.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fourth Romanian A2 unit. Targets universal.a2.health.
    attend_doctor_appointment (confirmed by grepping
    universal_spine.yaml directly -- prerequisites are
    universal.a1.health.describe_basic_problem, this course's own
    unit16, and universal.a1.communication.basic_phone_contact, treated
    as satisfied by this unit's own appointment-booking framing, the
    same latitude unit21 already used for the identical prerequisite
    type). 4 lessons, each mapped to a distinct spine
    assessment_requirement: lesson01 (describing the symptom with
    duration) covers describe_symptom_in_detail's speaking half;
    lesson02 (severity and a follow-up question) completes
    describe_symptom_in_detail; lesson03 (reading an appointment
    confirmation) covers read_appointment_confirmation and previews
    write_appointment_request via its writing_prompt; lesson04 (the
    full Ana/Doctorița Vasile consultation) covers
    understand_doctor_instructions and consolidates all four.

    Reuses unit01's bună/mulțumesc/la revedere/Ana, unit16's mă doare/
    cap/bolnav/doctor (this course's own A1 health vocabulary, the
    natural foundation for this A2 extension), re-declared via a
    lesson-opening reminder card per the standing per-file
    token-scoping convention. Within this file, lesson02-04 freely
    reuse lesson01's own de trei zile/foarte tare without a fresh
    reminder card, matching the established within-file-reuse
    precedent.

    Checked this choice against AUTHORING_GUIDE #11 before finalizing.
    Facts this unit newly states: Ana has had a headache for three
    days, describes it as very bad when asked, and is prescribed
    rest and medication to take twice a day for five days by
    Doctorița Vasile. Grepped unit16 to confirm this doesn't conflict:
    unit16's own dialogue has MIHAI as the patient with a headache on
    an earlier, separate occasion, resolved with rest and water, no
    doctor visit shown -- this unit is a genuinely different, later
    scene with ANA as the patient, seeing an actual doctor, which is a
    natural progression rather than a contradiction (nothing in unit16
    claims headaches never happen again, and the two are different
    people on different days).

    Checked every fill_in_blank slot against AUTHORING_GUIDE #17: each
    blank's instruction explicitly states the target English meaning
    (lesson01's blank=trei instruction names "three days" explicitly;
    lesson02's blank=tare instruction names "very badly"
    explicitly). Checked every listen_select/dialogue_comprehension
    distractor against the standing same-speaker-audio rule for
    lesson04's dialogue -- Doctorița Vasile's and Ana's own lines were
    listed before writing distractors, and every distractor is either
    something neither speaker says in that clip, or (for "who says
    this") genuinely said by the other speaker only.

    Verified every word_order/listen_order exercise's word_bank token
    multiset exactly matches its paired overlay correct_response token
    multiset (case- and diacritic-exact), and every exercise's
    tested_text tokens are covered by an earlier introduced_tokens
    entry in this same file (both checked proactively before running
    the compiler). Needs a fresh-context content review before import,
    same as every other language's content.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked answer shapes, grading of every accepted_answers set,
    distractors vs audio, open writing prompts, learner-visible notes
    for internal ids/construction meta, example_gloss accuracy (all 7
    correct), character canon. Fixes: 'quite severely' -> 'very badly'
    for foarte tare (foarte = very) in teach.foarte_tare_vocab
    title/gloss/example_gloss, teach.doare_foarte_tare_phrase title,
    line03 gloss, lesson02.exercise01.choose_foarte_tare
    prompt+instruction, exercise04.match_doctor2 pair (realization +
    overlay mirror), exercise07.complete_doare_foarte_tare
    prompt+instruction, exercise08.translate_it_hurts_severely prompt;
    lesson03.exercise01/02 read_* realization prompt.target_blocks now
    carry the confirmation passage (ro) before the question;
    listen_select distractors in all three listen exercises had final
    punctuation stripped so they match the unpunctuated correct option
    (form give-away); lesson03.exercise06.write_appointment_request
    pinned to 'Write: I would like an appointment, because my head has
    hurt for three days.'; lesson04.exercise07.write_visit_summary
    pinned to 'Write: My head has hurt for three days.', accepted ['Mă
    doare capul de trei zile.'] (old answers used untaught a mers / i-a
    recomandat / să ia); teach.doare_foarte_tare_phrase and
    teach.confirmare_reading notes 'spine outcome' removed;
    teach.reminder_recomand_medicament_control title 'Reminder:' -> 'New
    words:'; unit-number/lesson-id references rewritten in plain wording
    in notes of reminder_ma_doare_capul_bolnav_doctor,
    de_trei_zile_vocab, ma_doare_de_trei_zile_phrase,
    reminder_recomand_medicament_control, line01, line02, line03,
    line05, line06, line07. NATIVE FLAG: vocative 'Bună ziua,
    Doctoriță!' / 'Mulțumesc mult, Doctoriță!' and mid-sentence 'la
    Doctorița Vasile' -- standard polite address is 'doamna doctor' /
    'la doamna doctor Vasile'; needs a native decision (touches
    dialogue, audio text, matching pairs and the who-says-this option).
    DEFERRED: course.description unit-specific blurb on the shared
    course; writing_prompt exact-match grading model (owner decision).

    Second-pass review 2026-10-19: 0 fixes. (All fixes for this unit
    were in the en-ro overlay.)

course:
  realization_key: ro.a2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Fully formal register throughout -- dumneavoastră with the doctor
    (Ana and Doctorița Vasile have never met), matching unit21/23's
    identical convention for a first meeting with a professional.

media_assets:
  - content_key: ro.a2.audio.doctor.ma_doare_de_trei_zile.01
    language: ro
    text: "Mă doare capul de trei zile."
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: ro.a2.audio.doctor.cat_de_tare.01
    language: ro
    text: "Cât de tare vă doare?"
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: ro.a2.audio.doctor.doare_foarte_tare.01
    language: ro
    text: "Mă doare foarte tare, mai ales dimineața."
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: ro.a2.audio.doctor.tratament.01
    language: ro
    text: "Vă recomand odihnă și acest medicament, de două ori pe zi, timp de cinci zile."
    voice_hint: neutral_adult_formal
    status: pending_generation
  - content_key: ro.a2.audio.doctor.confirmare.01
    language: ro
    text: "Programarea dumneavoastră este confirmată pentru miercuri, ora unsprezece, la Doctorița Vasile. Vă rugăm să veniți cu cincisprezece minute mai devreme."
    voice_hint: neutral_adult_formal
    status: pending_generation
  - content_key: ro.a2.audio.dialogue.la_doctor.01
    language: ro
    text: "Ana: Bună ziua, Doctoriță! Mă doare capul de trei zile.\nDoctorița Vasile: Bună ziua! Cât de tare vă doare?\nAna: Mă doare foarte tare, mai ales dimineața.\nDoctorița Vasile: Înțeleg. Vă recomand odihnă și acest medicament, de două ori pe zi, timp de cinci zile.\nAna: Trebuie să mă întorc pentru un control?\nDoctorița Vasile: Doar dacă durerea nu trece în cinci zile.\nAna: Mulțumesc mult, Doctoriță!\nDoctorița Vasile: Cu plăcere. Însănătoșire grabnică!"
    voice_hint: adult_female_and_female_neutral_polite
    status: pending_generation

units:
  - content_key: ro.a2.unit24.la_doctor
    title: "La doctor"
    section: reading_writing
    spine_outcome_ids:
      - universal.a2.health.attend_doctor_appointment
    planned_lesson_count: 4

    lessons:
      - content_key: ro.a2.unit24.lesson01.de_trei_zile
        title: "Mă doare de trei zile"
        spine_outcome_id: universal.a2.health.attend_doctor_appointment
        teaching:
          - content_key: ro.a2.unit24.lesson01.teach.reminder_ma_doare_capul_bolnav_doctor
            kind: grammar_note
            target: {text: "Mă doare capul · Bolnav · Doctor", language_code: ro, direction: ltr}
            introduced_tokens: [bună, ziua, mă, doare, capul, sunt, bolnav, un, doctor]
          - content_key: ro.a2.unit24.lesson01.teach.de_trei_zile_vocab
            kind: vocabulary
            target: {text: "De trei zile", language_code: ro, direction: ltr}
            introduced_tokens: [de, trei, zile]
            example:
              - {text: "Mă doare capul de trei zile.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit24.lesson01.teach.ma_doare_de_trei_zile_phrase
            kind: phrase
            target: {text: "Mă doare capul de trei zile.", language_code: ro, direction: ltr}
            introduced_tokens: [mă, doare, capul, de, trei, zile]
          - content_key: ro.a2.unit24.lesson01.teach.doctorita_vocab
            kind: vocabulary
            target: {text: "Doctoriță", language_code: ro, direction: ltr}
            introduced_tokens: [doctoriță]
            example:
              - {text: "Bună ziua, Doctoriță!", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a2.unit24.lesson01.exercise01.choose_de_trei_zile
            type: multiple_choice
            tested_text: "de trei zile"
            prompt:
              target_blocks:
                - {text: "for three days", language_code: en, direction: ltr}
          - content_key: ro.a2.unit24.lesson01.exercise02.choose_doctorita
            type: multiple_choice
            tested_text: "doctoriță"
            prompt:
              target_blocks:
                - {text: "female doctor", language_code: en, direction: ltr}
          - content_key: ro.a2.unit24.lesson01.exercise03.listen_ma_doare_de_trei_zile
            type: listen_select
            tested_text: "Mă doare capul de trei zile"
            media_asset_key: ro.a2.audio.doctor.ma_doare_de_trei_zile.01
            prompt: {target_blocks: []}
          - content_key: ro.a2.unit24.lesson01.exercise04.match_doctor1
            type: matching_pairs
            tested_text: "de trei zile mă doare capul doctoriță bolnav bună ziua"
            prompt: {target_blocks: []}
            pairs:
              - {left: "De trei zile", right: "for three days"}
              - {left: "Mă doare capul.", right: "My head hurts."}
              - {left: "Doctoriță", right: "female doctor"}
              - {left: "Bolnav", right: "sick"}
              - {left: "Mă doare capul de trei zile.", right: "My head has hurt for three days."}
              - {left: "Bună ziua, Doctoriță!", right: "Good day, Doctor!"}
          - content_key: ro.a2.unit24.lesson01.exercise05.order_ma_doare_de_trei_zile
            type: word_order
            tested_text: "Mă doare capul de trei zile"
            prompt: {target_blocks: []}
            word_bank: ["Mă", "doare", "capul", "de", "trei", "zile"]
          - content_key: ro.a2.unit24.lesson01.exercise06.listen_order_ma_doare_de_trei_zile
            type: listen_order
            tested_text: "Mă doare capul de trei zile"
            media_asset_key: ro.a2.audio.doctor.ma_doare_de_trei_zile.01
            prompt: {target_blocks: []}
            word_bank: ["Mă", "doare", "capul", "de", "trei", "zile"]
          - content_key: ro.a2.unit24.lesson01.exercise07.complete_ma_doare_de_trei_zile
            type: fill_in_blank
            tested_text: "trei"
            prompt:
              target_blocks:
                - {text: "Complete the sentence, three days: Mă doare capul de ___ zile.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit24.lesson01.exercise08.speak_ma_doare_de_trei_zile
            type: speak_response
            tested_text: "mă doare capul de trei zile"
            prompt:
              target_blocks:
                - {text: "Say: My head has hurt for three days.", language_code: en, direction: ltr}

      - content_key: ro.a2.unit24.lesson02.cat_de_tare
        title: "Cât de tare vă doare?"
        spine_outcome_id: universal.a2.health.attend_doctor_appointment
        teaching:
          - content_key: ro.a2.unit24.lesson02.teach.cat_de_tare_grammar
            kind: grammar_note
            target: {text: "Cât de tare (how severely)", language_code: ro, direction: ltr}
            introduced_tokens: [cât, de, tare, vă]
          - content_key: ro.a2.unit24.lesson02.teach.foarte_tare_vocab
            kind: vocabulary
            target: {text: "Foarte tare", language_code: ro, direction: ltr}
            introduced_tokens: [foarte, tare]
            example:
              - {text: "Mă doare foarte tare.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit24.lesson02.teach.mai_ales_dimineata_vocab
            kind: vocabulary
            target: {text: "Mai ales dimineața", language_code: ro, direction: ltr}
            introduced_tokens: [mai, ales, dimineața]
            example:
              - {text: "Mă doare mai ales dimineața.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit24.lesson02.teach.cat_de_tare_va_doare_phrase
            kind: phrase
            target: {text: "Cât de tare vă doare?", language_code: ro, direction: ltr}
            introduced_tokens: [cât, de, tare, vă, doare]
          - content_key: ro.a2.unit24.lesson02.teach.doare_foarte_tare_phrase
            kind: phrase
            target: {text: "Mă doare foarte tare, mai ales dimineața.", language_code: ro, direction: ltr}
            introduced_tokens: [mă, doare, foarte, tare, mai, ales, dimineața]
        exercises:
