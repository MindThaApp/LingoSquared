          - content_key: ro.a2.unit24.lesson02.exercise02.choose_dimineata
            type: multiple_choice
            tested_text: "dimineața"
            prompt:
              target_blocks:
                - {text: "morning", language_code: en, direction: ltr}
          - content_key: ro.a2.unit24.lesson02.exercise03.listen_cat_de_tare
            type: listen_select
            tested_text: "Cât de tare vă doare"
            media_asset_key: ro.a2.audio.doctor.cat_de_tare.01
            prompt: {target_blocks: []}
          - content_key: ro.a2.unit24.lesson02.exercise04.match_doctor2
            type: matching_pairs
            tested_text: "cât de tare foarte tare mai ales dimineața de trei zile mă doare capul"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Cât de tare?", right: "How severely?"}
              - {left: "Foarte tare", right: "very badly"}
              - {left: "Mai ales dimineața", right: "especially in the morning"}
              - {left: "De trei zile", right: "for three days"}
              - {left: "Mă doare capul.", right: "My head hurts."}
              - {left: "Cât de tare vă doare?", right: "How severely does it hurt?"}
          - content_key: ro.a2.unit24.lesson02.exercise05.order_cat_de_tare_va_doare
            type: word_order
            tested_text: "Cât de tare vă doare"
            prompt: {target_blocks: []}
            word_bank: ["Cât", "de", "tare", "vă", "doare"]
          - content_key: ro.a2.unit24.lesson02.exercise06.listen_order_doare_foarte_tare
            type: listen_order
            tested_text: "Mă doare foarte tare"
            media_asset_key: ro.a2.audio.doctor.doare_foarte_tare.01
            prompt: {target_blocks: []}
            word_bank: ["Mă", "doare", "foarte", "tare"]
          - content_key: ro.a2.unit24.lesson02.exercise07.complete_doare_foarte_tare
            type: fill_in_blank
            tested_text: "tare"
            prompt:
              target_blocks:
                - {text: "Complete the sentence, very badly: Mă doare foarte ___, mai ales dimineața.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit24.lesson02.exercise08.translate_it_hurts_severely
            type: translation
            tested_text: "mă doare foarte tare mai ales dimineața"
            prompt:
              target_blocks:
                - {text: "It hurts very badly, especially in the morning.", language_code: en, direction: ltr}

          - {content_key: ro.a2.unit24.lesson02.exercise09.dictation_cat_de_tare_va_doare, type: dictation, tested_text: "Cât de tare vă doare", media_asset_key: ro.a2.audio.doctor.cat_de_tare.01, prompt: {target_blocks: []}}
      - content_key: ro.a2.unit24.lesson03.confirmarea_programarii
        title: "Confirmarea programării"
        spine_outcome_id: universal.a2.health.attend_doctor_appointment
        teaching:
