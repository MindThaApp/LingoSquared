generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-13
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl search "Peace Corps Moldova Basic
    Romanian Language Lessons comparative bigger smaller more than"`)
    but returned HTTP 402 (0 credits remaining, the same exhausted state
    every recent ro unit has hit), so this unit falls back to the same
    direct `curl` + `pdftotext -layout` re-fetch of the confirmed-working
    PDF those units used. The source genuinely covers part of this
    unit's core vocabulary: its own adjective vocabulary list (a
    "Lesson 13" section) directly lists "big: mare" and "little: puţin",
    and a separate grammar-notes example sentence, "Am o mică problemă.
    (I have a small problem.)", directly confirms the feminine small-
    adjective form *mică* used in this unit (that same list's "little:
    puţin" is a different word -- an adverb of degree, "a little/a bit",
    already used elsewhere in the source for "I speak a little Romanian"
    -- not the physical-size adjective this unit teaches, so it was not
    used here despite superficially looking like a match). *mare* (big)
    itself was already established as real course vocabulary back in
    ro's own unit03 ("literă mare", capital letter) and unit05 ("o
    familie mare", a big family) -- this unit treats it as a REMINDER,
    not new vocabulary, and does not re-teach it as a fresh card. No
    source hit covers the comparative construction at all -- grepped the
    full extracted text for "decât"/"mai mare"/"mai mic"/comparative
    forms with zero matches beyond *mai* the unrelated month name ("mai"
    = May) and the unrelated idiom "Ce mai faceţi?" (how are you) already
    used in ro's own unit01 -- so *mai* (here, the comparative particle
    "more"/"-er") and *decât* (than) are both freshly authored, disclosed
    honestly per AUTHORING_GUIDE #10's "if the source doesn't cover the
    topic adequately, author fresh": *mai + adjective (+ decât + noun)*
    is the standard, universally-taught Romanian comparative
    construction (independently confidence-checked, not sourced) and
    *decât* is basic-tier, extremely common vocabulary with no plausible
    substitute. This unit deliberately reuses unit13's definite nouns
    (cafeaua/ceaiul/pâinea) as the comparison objects rather than
    inventing a new scenario, continuing the same Ana/Mihai coffee-shop
    cast established in unit06/unit12/unit13. Only four genuinely new
    vocabulary items are introduced: mic/mică (small, a paired
    masculine-neuter/feminine form, counted as one item per unit05's own
    precedent for meu/mea), mai (comparative particle), and decât (than)
    -- mare itself is a pure reminder. Authored at schema_version 1.1
    from the start -- every kind:vocabulary card carries a real example:
    sentence with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule --
    confirmed neither "Mai mare."/"Mare." is a verbatim line either
    speaker says about the bread specifically; AUTHORING_GUIDE #11
    cross-lesson fact consistency with unit06/unit12/unit13's
    established coffee/tea/bread preferences, confirming this unit's
    new size claims never touch them, #17 fill_in_blank ambiguity)
    against the actual dialogue/exercise content and confirm them
    accurate. Also confirmed no stray YAML booleans, matching_pairs/
    word_order shapes correct, every exercise type registered, no
    jargon leaks, correct and consistent diacritics, natural Romanian
    throughout. No real bugs found; no changes made to this unit.

    Fourteenth Romanian unit, first draft, continuing directly from
    unit13. Targets universal.a1.comparisons.make_basic_comparisons --
    confirmed by grepping universal_spine.yaml directly: it's the entry
    immediately following universal.a1.preferences.express_preferences
    (unit13's own outcome) in spine order, its prerequisites
    (universal.a1.preferences.express_preferences,
    universal.a1.numbers.use_basic_numbers) are both already satisfied by
    unit13 and unit02 respectively, and its can_do text is "Make and
    understand basic comparisons between familiar people, objects, or
    options." This course's own established 3-lesson bootstrap pace and
    Ana/Mihai characters are used, matching units 01-13. 3 lessons:
    lesson01 teaches mic/mică (small) against a reminder of mare (big,
    already known from unit03/unit05) using unit13's own cafeaua/
    ceaiul/pâinea as the described objects; lesson02 teaches the
    comparative construction itself (mai + adjective, decât "than");
    lesson03 is Ana and Mihai's dialogue applying all of it together,
    structurally continuing the same Ana/Mihai coffee-shop cast unit06/
    unit12/unit13 already established, this time comparing the SIZE of
    the coffee/tea/bread rather than restating who orders or prefers
    what.

    Checked this choice against AUTHORING_GUIDE #11 carefully: (1)
    Existing facts to protect -- unit06's restaurant dialogue (Mihai
    orders pâine/pui/ceai, Ana orders cafea), unit12's Sunday recap
    (same pattern restated), and unit13's preference dialogue (Ana
    prefers cafeaua and dislikes ceaiul; Mihai likes ceaiul/pâinea and
    dislikes cafeaua) are never touched -- this unit's dialogue makes
    no claim at all about who orders, prefers, likes, or dislikes
    anything; it only describes the physical SIZE of the coffee, tea,
    and bread, a dimension no earlier unit has ever addressed for these
    three items (confirmed by grepping every earlier ro realization file
    for "mare"/"mic": zero hits describing cafea/ceai/pâine by size
    anywhere before this unit). (2) No day/schedule/price/family claim
    of any kind is made, so unit10's routine facts, unit11's Sunday-park
    facts, and unit07's shopping-price facts are all untouched. (3) No
    possessive forms (meu/mea/tău) or numbers are needed or used, so
    unit02's/unit05's established facts there are untouched too.

    Checked every fill_in_blank slot's correct answer against
    AUTHORING_GUIDE #17's synonym-ambiguity concern: lesson01's "Pâinea
    e ___." recalls "mică" -- the only other candidate in this lesson's
    pool is "mare" (already-known, antonym not synonym: opposite
    meaning, not the same meaning under a different word), and the
    instruction explicitly asks the learner to complete "The bread is
    small," which rules out "mare" on meaning grounds, not availability
    grounds -- an ordinary vocabulary-recall slot, not the ambiguity
    class the rule targets (that class is about true synonyms like
    je/jij meaning literally the same thing). lesson02's "Cafeaua e ___
    mare decât ceaiul." recalls "mai" -- the only other candidate token
    this course has ever used spelled "mai" is the unrelated month name
    (May) and the unrelated "Ce mai faceţi?" idiom particle, neither of
    which fits this slot's grammatical position (adjective-comparative
    frame) at all, so there is no real second candidate. lesson03's
    "Pâinea e mai ___ decât cafeaua." recalls "mică" for the same
    single-candidate reason as lesson01's slot.

    Checked the lesson03 dialogue_comprehension exercise against the
    standing same-speaker-distractor rule: listed every line each
    speaker actually says in the six-line dialogue before writing
    distractors -- Mihai's three lines are "Bună, Ana! Cafeaua e mare
    sau mică?", "Cafeaua e mai mare decât ceaiul?", and "Da, pâinea e
    mică! Mulțumesc, Ana! La revedere!"; Ana's three lines are "Cafeaua
    e mare! Ceaiul e mic.", "Da! Și pâinea e mai mică decât cafeaua.",
    and "La revedere, Mihai!". The exercise asks "Is the bread bigger
    or smaller than the coffee?" (correct: "Mai mică.") with distractors
    "Mai mare."/"Mare." -- neither distractor is a verbatim line either
    speaker actually says about the bread specifically (Ana's own line
    about the bread is exclusively "mai mică", never "mare" or "mai
    mare" applied to pâinea anywhere in the dialogue), so there is no
    double-correct-option risk. The reading_comprehension exercise
    ("Cafeaua e mare. Ceaiul e mic. Pâinea e mai mică decât cafeaua." --
    "What is bigger, the coffee or the tea?", correct "Cafeaua.",
    distractors "Ceaiul."/"Pâinea.") is a plain 3-way selection over the
    exact same closed word set unit13's own reading_comprehension
    exercise used, the same safe pattern. lesson01/lesson02's
    listen_select exercises use single-sentence audio clips (not
    multi-speaker dialogue audio), and distractors were confirmed to be
    sentences never spoken in that specific clip.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-13's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    dumneavoattră register with each other). This unit's own new
    vocabulary (mic/mică, mai, decât) is entirely person-invariant --
    no new register decision is introduced; the dialogue's existing Vă
    place...? question from unit13 is not reused here.

