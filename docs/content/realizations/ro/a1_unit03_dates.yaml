schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), Lesson 10 "Days" and Lesson 11 "Months"
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, fetched via curl + pdftotext -layout,
    the same real extractable text layer used for units 01/02 -- a cached
    copy from that earlier fetch was reused for this unit rather than
    re-downloading). Real sourced material: the seven weekday names
    (luni through duminică), the week/today/yesterday/tomorrow/this-week/
    last-week/next-week vocabulary set, all twelve month names (ianuarie
    through decembrie -- these needed no orthography fix, unlike the
    weekday set below), and the source's own explanatory note that the
    first day of a month is called întâi rather than the plain cardinal
    unu (e.g. "the first of August is întâi August"), which is the basis
    of this unit's cardinal-number-states-the-date-except-for-the-1st
    rule. The source uses the pre-1993 Moldovan/Communist-era spelling
    convention for several of these words (Mîine, Marţi, Sîmbătă,
    Săptămînă, Săptămîna, întîi) rather than post-1993 standard Romanian
    orthography (Mâine, Marți, Sâmbătă, Săptămână, Săptămâna, întâi) --
    every sourced word was respelled to modern standard Romanian
    orthography before use, the identical modernization already applied
    in units 01/02 (see those files' own provenance notes), not a dialect
    swap. Freshly authored, not sourced: every phrase for asking the day/
    date (Ce zi este astăzi?/Ce dată este astăzi?), the lowercase-writing
    grammar notes for weekdays and months (a genuine Romanian orthography
    rule, independently known, with no equivalent content in the source),
    the "La mulți ani!" expression (common-knowledge Romanian birthday/
    New Year greeting, not sourced from this PDF, chosen because it
    naturally reuses "ani" already taught in unit02's age content), every
    vocabulary example: sentence (AUTHORING_GUIDE #19), and lesson03's
    Ana/Mihai scheduling dialogue (a new scenario continuing unit01/02's
    recurring characters, not copied from the source, which has no
    equivalent short dialogue). Authored at schema_version 1.1 from the
    start -- every kind:vocabulary card carries a real example: sentence
    with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Third Romanian unit, first draft, continuing directly from unit02.
    Targets the single spine outcome that comes immediately after
    universal.a1.numbers.use_basic_numbers in universal_spine.yaml's own
    order (universal.a1.dates.exchange_calendar_dates, whose own
    prerequisites list is exactly that numbers outcome) -- matches the
    "next spine outcome" pattern nl's own unit03 (calendar dates) already
    follows, confirmed by reading nl/a1_unit03_dates.yaml,
    fa/a1_unit03_numbers.yaml, and es/a1_unit03_family.yaml before
    authoring (fa and es/fr both authored numbers/family as their own
    unit03 because their unit01/02 split greetings/introductions/numbers
    differently; ro already covered numbers in unit02, so dates is
    genuinely next for this course specifically, not a mismatched choice).
    3 lessons (bootstrap pace, matching unit01/02's own size, not the
    fuller 6-lesson nl shape for the same topic). Weekday and month names
    are deliberately taught via 2-3-word-per-card vocabulary bundles
    (mirroring unit02's own teens/tens grammar_note consolidation
    precedent, flagged there for the same reason) to keep per-lesson
    card counts in line with unit01/02 while still making every day/month
    individually testable. Lesson03's dialogue deliberately introduces
    zero brand-new vocabulary in its dialogue lines (all four lines reuse
    only tokens already taught earlier in this same unit), the same
    pure-recap style unit01's own lesson03 used. Needs a fresh-context
    content review before import, same as every other language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01/02's register split and Ana/Mihai's own established
    dumneavoastră register with each other. Stating a day or date does
    not itself change with register (este is invariant), so this unit's
    new content is largely register-neutral; the closing dialogue keeps
    Ana and Mihai's existing polite register intact rather than
    introducing tu forms.

