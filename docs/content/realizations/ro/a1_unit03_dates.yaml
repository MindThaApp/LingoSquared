units:
  - content_key: ro.a1.unit03.dates
    title: "Zile și date"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.dates.exchange_calendar_dates
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit03.lesson01.zilele_saptamanii
        title: "Zilele săptămânii"
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - content_key: ro.a1.unit03.lesson01.teach.este
            kind: grammar_note
            target: {text: "este", language_code: ro, direction: ltr}
            introduced_tokens: [este]
          - content_key: ro.a1.unit03.lesson01.teach.astazi_maine
            kind: vocabulary
            target: {text: "Astăzi, mâine", language_code: ro, direction: ltr}
            introduced_tokens: [astăzi, mâine]
            example:
              - {text: "Astăzi este luni.", language_code: ro, direction: ltr}
              - {text: "Mâine este marți.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit03.lesson01.teach.luni_marti
            kind: vocabulary
            target: {text: "Luni, marți", language_code: ro, direction: ltr}
            introduced_tokens: [luni, marți]
            example:
              - {text: "Este luni astăzi.", language_code: ro, direction: ltr}
              - {text: "Este marți mâine.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit03.lesson01.teach.miercuri_joi
            kind: vocabulary
            target: {text: "Miercuri, joi", language_code: ro, direction: ltr}
            introduced_tokens: [miercuri, joi]
            example:
              - {text: "Astăzi este miercuri.", language_code: ro, direction: ltr}
              - {text: "Mâine este joi.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit03.lesson01.teach.vineri_sambata
            kind: vocabulary
            target: {text: "Vineri, sâmbătă", language_code: ro, direction: ltr}
            introduced_tokens: [vineri, sâmbătă]
            example:
              - {text: "Astăzi este vineri.", language_code: ro, direction: ltr}
              - {text: "Mâine este sâmbătă.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit03.lesson01.teach.duminica
            kind: vocabulary
            target: {text: "Duminică", language_code: ro, direction: ltr}
            introduced_tokens: [duminică]
            example: {text: "Astăzi este duminică.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit03.lesson01.teach.ce_zi_e_azi
            kind: phrase
            target: {text: "Ce zi este astăzi?", language_code: ro, direction: ltr}
            introduced_tokens: [ce, zi, este, astăzi]
          - content_key: ro.a1.unit03.lesson01.teach.saptamana_ieri
            kind: grammar_note
            target: {text: "săptămână / ieri / săptămâna trecută / săptămâna viitoare", language_code: ro, direction: ltr}
            introduced_tokens: [săptămână, ieri, săptămâna, trecută, viitoare]
          - content_key: ro.a1.unit03.lesson01.teach.lowercase_zile
            kind: grammar_note
            target: {text: "Zilele nu se scriu cu literă mare: luni, vineri.", language_code: ro, direction: ltr}
            introduced_tokens: [zilele, nu, se, scriu, cu, literă, mare]
        exercises:
          - content_key: ro.a1.unit03.lesson01.exercise01.listen_luni
            type: listen_select
            tested_text: "luni"
            media_asset_key: ro.a1.audio.luni.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit03.lesson01.exercise02.choose_vineri
            type: multiple_choice
            tested_text: "vineri"
            prompt:
              target_blocks:
                - {text: "Friday", language_code: en, direction: ltr}
          - content_key: ro.a1.unit03.lesson01.exercise03.match_weekdays
            type: matching_pairs
            tested_text: "luni marți miercuri joi vineri sâmbătă duminică"
            prompt: {target_blocks: []}
            pairs:
              - {left: "luni", right: "Monday"}
              - {left: "marți", right: "Tuesday"}
              - {left: "miercuri", right: "Wednesday"}
              - {left: "joi", right: "Thursday"}
              - {left: "vineri", right: "Friday"}
              - {left: "sâmbătă", right: "Saturday"}
              - {left: "duminică", right: "Sunday"}
          - content_key: ro.a1.unit03.lesson01.exercise04.order_day_question
            type: word_order
            tested_text: "Ce zi este astăzi"
