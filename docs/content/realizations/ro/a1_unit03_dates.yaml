          - content_key: ro.a1.unit03.lesson02.teach.ce_data
            kind: phrase
            target: {text: "Ce dată este astăzi?", language_code: ro, direction: ltr}
            introduced_tokens: [ce, dată, este, astăzi]
          - content_key: ro.a1.unit03.lesson02.teach.raspuns_data
            kind: phrase
            target: {text: "Astăzi este trei aprilie.", language_code: ro, direction: ltr}
            introduced_tokens: [trei, aprilie]
          - content_key: ro.a1.unit03.lesson02.teach.la_multi_ani
