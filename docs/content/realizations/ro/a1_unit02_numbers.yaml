units:
  - content_key: ro.a1.unit02.numbers
    title: "Numerele"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.numbers.use_basic_numbers
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit02.lesson01.zero_to_ten
        title: "Numerele de la zero la zece"
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: ro.a1.unit02.lesson01.teach.zero
            kind: vocabulary
            target: {text: "Zero", language_code: ro, direction: ltr}
            introduced_tokens: [zero]
            example: {text: "Zero, unu, doi.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.unu
            kind: vocabulary
            target: {text: "Unu", language_code: ro, direction: ltr}
            introduced_tokens: [unu]
            example: {text: "Unu, doi, trei.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.doi
            kind: vocabulary
            target: {text: "Doi", language_code: ro, direction: ltr}
            introduced_tokens: [doi]
            example: {text: "Doi, trei, patru.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.doi_doua_gender
            kind: grammar_note
            target: {text: "doi / două", language_code: ro, direction: ltr}
            introduced_tokens: [două]
          - content_key: ro.a1.unit02.lesson01.teach.trei
            kind: vocabulary
            target: {text: "Trei", language_code: ro, direction: ltr}
            introduced_tokens: [trei]
            example: {text: "Trei, patru, cinci.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.patru
            kind: vocabulary
            target: {text: "Patru", language_code: ro, direction: ltr}
            introduced_tokens: [patru]
            example: {text: "Patru, cinci, șase.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.cinci
            kind: vocabulary
            target: {text: "Cinci", language_code: ro, direction: ltr}
            introduced_tokens: [cinci]
            example: {text: "Cinci, șase, șapte.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.sase
            kind: vocabulary
            target: {text: "Șase", language_code: ro, direction: ltr}
            introduced_tokens: [șase]
            example: {text: "Șase, șapte, opt.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.sapte
            kind: vocabulary
            target: {text: "Șapte", language_code: ro, direction: ltr}
            introduced_tokens: [șapte]
            example: {text: "Șapte, opt, nouă.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.opt
            kind: vocabulary
            target: {text: "Opt", language_code: ro, direction: ltr}
            introduced_tokens: [opt]
            example: {text: "Opt, nouă, zece.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.noua
            kind: vocabulary
            target: {text: "Nouă", language_code: ro, direction: ltr}
            introduced_tokens: [nouă]
            example: {text: "Nouă, zece... gata!", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.teach.zece
            kind: vocabulary
            target: {text: "Zece", language_code: ro, direction: ltr}
            introduced_tokens: [zece]
            example: {text: "Zece! Bravo!", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a1.unit02.lesson01.exercise01.listen_run_zero_five
            type: listen_select
            tested_text: "zero unu doi trei patru cinci"
            media_asset_key: ro.a1.audio.numere_0_5.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit02.lesson01.exercise02.choose_sapte
            type: multiple_choice
            tested_text: "șapte"
            prompt:
              target_blocks:
                - {text: "seven", language_code: en, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.exercise03.match_digits
            type: matching_pairs
            tested_text: "zero unu doi trei patru cinci șase șapte opt nouă zece"
            prompt: {target_blocks: []}
            pairs:
              - {left: "zero", right: "0"}
              - {left: "unu", right: "1"}
              - {left: "doi", right: "2"}
              - {left: "trei", right: "3"}
              - {left: "patru", right: "4"}
              - {left: "cinci", right: "5"}
              - {left: "șase", right: "6"}
              - {left: "șapte", right: "7"}
              - {left: "opt", right: "8"}
              - {left: "nouă", right: "9"}
              - {left: "zece", right: "10"}
          - content_key: ro.a1.unit02.lesson01.exercise04.order_run_three_five
            type: word_order
            tested_text: "trei patru cinci"
            prompt: {target_blocks: []}
            word_bank: ["Trei,", "patru,", "cinci."]
          - content_key: ro.a1.unit02.lesson01.exercise05.doua_feminine_form
            type: grammar_check
            tested_text: "două"
            prompt:
              target_blocks:
                - {text: "Masculin: doi → Feminin: ___", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.exercise06.listen_type_opt
            type: listen_type
            tested_text: "opt"
            media_asset_key: ro.a1.audio.numar_opt.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit02.lesson01.exercise07.complete_run
            type: fill_in_blank
            tested_text: "trei"
            prompt:
              target_blocks:
                - {text: "Unu, doi, ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson01.exercise08.speak_count_zero_five
            type: speak_response
            tested_text: "zero unu doi trei patru cinci"
            prompt: {target_blocks: []}

      - content_key: ro.a1.unit02.lesson02.eleven_to_hundred
        title: "Numerele de la unsprezece la o sută"
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: ro.a1.unit02.lesson02.teach.unsprezece
            kind: vocabulary
            target: {text: "Unsprezece", language_code: ro, direction: ltr}
            introduced_tokens: [unsprezece]
            example: {text: "Zece, unsprezece, doisprezece.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson02.teach.teens_pattern
            kind: grammar_note
            target: {text: "doisprezece, treisprezece, paisprezece... (12-19)", language_code: ro, direction: ltr}
            introduced_tokens: [doisprezece, treisprezece, paisprezece, cincisprezece, șaisprezece, șaptesprezece, optsprezece, nouăsprezece]
          - content_key: ro.a1.unit02.lesson02.teach.douazeci
            kind: vocabulary
            target: {text: "Douăzeci", language_code: ro, direction: ltr}
            introduced_tokens: [douăzeci]
            example: {text: "Nouăsprezece, douăzeci...", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson02.teach.douazeci_si_unu
            kind: vocabulary
            target: {text: "Douăzeci și unu", language_code: ro, direction: ltr}
            introduced_tokens: [și]
            example: {text: "Douăzeci, douăzeci și unu, douăzeci și doi.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson02.teach.tens_pattern
            kind: grammar_note
            target: {text: "treizeci, patruzeci, cincizeci... (30-90)", language_code: ro, direction: ltr}
            introduced_tokens: [treizeci, patruzeci, cincizeci, șaizeci, șaptezeci, optzeci, nouăzeci]
          - content_key: ro.a1.unit02.lesson02.teach.o_suta
            kind: vocabulary
            target: {text: "O sută", language_code: ro, direction: ltr}
            introduced_tokens: [o, sută]
            example: {text: "Nouăzeci, o sută!", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a1.unit02.lesson02.exercise01.listen_unsprezece
            type: listen_select
            tested_text: "unsprezece"
            media_asset_key: ro.a1.audio.numar_unsprezece.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit02.lesson02.exercise02.choose_nouasprezece
            type: multiple_choice
            tested_text: "nouăsprezece"
            prompt:
              target_blocks:
                - {text: "nouăsprezece", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson02.exercise03.match_tens
            type: matching_pairs
            tested_text: "douăzeci treizeci patruzeci cincizeci șaizeci șaptezeci optzeci nouăzeci o sută"
            prompt: {target_blocks: []}
            pairs:
              - {left: "douăzeci", right: "20"}
              - {left: "treizeci", right: "30"}
              - {left: "patruzeci", right: "40"}
              - {left: "cincizeci", right: "50"}
              - {left: "șaizeci", right: "60"}
              - {left: "șaptezeci", right: "70"}
              - {left: "optzeci", right: "80"}
              - {left: "nouăzeci", right: "90"}
              - {left: "o sută", right: "100"}
          - content_key: ro.a1.unit02.lesson02.exercise04.order_douazeci_si_unu
            type: word_order
            tested_text: "douăzeci și unu"
            prompt: {target_blocks: []}
            word_bank: ["Douăzeci", "și", "unu"]
          - content_key: ro.a1.unit02.lesson02.exercise05.paisprezece_pattern
            type: grammar_check
            tested_text: "paisprezece"
            prompt:
              target_blocks:
                - {text: "patru → ___ (14)", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson02.exercise06.listen_type_treizeci
            type: listen_type
            tested_text: "treizeci"
            media_asset_key: ro.a1.audio.numar_treizeci.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit02.lesson02.exercise07.complete_o_suta
            type: fill_in_blank
            tested_text: "o sută"
            prompt:
              target_blocks:
                - {text: "Nouăzeci, ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson02.exercise08.speak_tens_twenty_hundred
            type: speak_response
            tested_text: "douăzeci treizeci patruzeci cincizeci șaizeci șaptezeci optzeci nouăzeci o sută"
            prompt: {target_blocks: []}

      - content_key: ro.a1.unit02.lesson03.age_and_phone
        title: "Vârsta și numărul de telefon"
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: ro.a1.unit02.lesson03.teach.cati_ani_ai
            kind: phrase
            target: {text: "Câți ani ai?", language_code: ro, direction: ltr}
            introduced_tokens: [câți, ani, ai]
          - content_key: ro.a1.unit02.lesson03.teach.am_nouasprezece_ani
            kind: phrase
            target: {text: "Am nouăsprezece ani.", language_code: ro, direction: ltr}
            introduced_tokens: [am]
          - content_key: ro.a1.unit02.lesson03.teach.cati_ani_aveti
            kind: phrase
            target: {text: "Câți ani aveți?", language_code: ro, direction: ltr}
            introduced_tokens: [aveți]
          - content_key: ro.a1.unit02.lesson03.teach.am_treizeci_de_ani
            kind: phrase
            target: {text: "Am treizeci de ani.", language_code: ro, direction: ltr}
            introduced_tokens: [de]
          - content_key: ro.a1.unit02.lesson03.teach.de_insertion_rule
            kind: grammar_note
            target: {text: "2-19: fără „de” · 20+: cu „de”", language_code: ro, direction: ltr}
            introduced_tokens: []
          - content_key: ro.a1.unit02.lesson03.teach.care_e_numarul_tau
            kind: phrase
            target: {text: "Care e numărul tău de telefon?", language_code: ro, direction: ltr}
            introduced_tokens: [care, e, numărul, tău, telefon]
          - content_key: ro.a1.unit02.lesson03.teach.care_este_numarul_dvs
            kind: phrase
            target: {text: "Care este numărul dumneavoastră de telefon?", language_code: ro, direction: ltr}
            introduced_tokens: [este, dumneavoastră]
          - content_key: ro.a1.unit02.lesson03.teach.raspuns_telefon
            kind: phrase
            target: {text: "Este: zero, șapte, doi, unu, patru, cinci, șase, șapte, opt, nouă.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.a1.unit02.lesson03.exercise01.listen_cati_ani_ai
            type: listen_select
            tested_text: "câți ani ai"
            media_asset_key: ro.a1.audio.cati_ani_ai.informal.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit02.lesson03.exercise02.choose_meaning
            type: multiple_choice
            tested_text: "am treizeci de ani"
            prompt:
              target_blocks:
                - {text: "Am treizeci de ani.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson03.exercise03.match_teens_review
            type: matching_pairs
            tested_text: "unsprezece doisprezece treisprezece paisprezece cincisprezece șaisprezece șaptesprezece optsprezece nouăsprezece"
            prompt: {target_blocks: []}
            pairs:
              - {left: "unsprezece", right: "11"}
              - {left: "doisprezece", right: "12"}
              - {left: "treisprezece", right: "13"}
              - {left: "paisprezece", right: "14"}
              - {left: "cincisprezece", right: "15"}
              - {left: "șaisprezece", right: "16"}
              - {left: "șaptesprezece", right: "17"}
              - {left: "optsprezece", right: "18"}
              - {left: "nouăsprezece", right: "19"}
          - content_key: ro.a1.unit02.lesson03.exercise04.order_phone_question
            type: word_order
            tested_text: "care e numărul tău de telefon"
            prompt: {target_blocks: []}
            word_bank: ["Care", "e", "numărul", "tău", "de", "telefon?"]
          - content_key: ro.a1.unit02.lesson03.exercise05.polite_form_choice
            type: grammar_check
            tested_text: "aveți"
            prompt:
              target_blocks:
                - {text: "Câți ani ___? (adult necunoscut)", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson03.exercise06.listen_type_phone
            type: listen_type
            tested_text: "zero șapte doi unu patru cinci șase opt nouă"
            media_asset_key: ro.a1.audio.numar_telefon_exemplu.neutral.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit02.lesson03.exercise07.complete_de_rule
            type: fill_in_blank
            tested_text: "de"
            prompt:
              target_blocks:
                - {text: "Am treizeci ___ ani.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit02.lesson03.exercise08.respond_as_mihai
            type: dialogue_response
            tested_text: "am douăzeci și opt de ani"
            prompt:
              target_blocks:
                - {text: "Ana: Câți ani ai?", language_code: ro, direction: ltr}
