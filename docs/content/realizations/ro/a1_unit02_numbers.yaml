schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), Lesson 9 "Numbers"
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, fetched via curl + pdftotext -layout,
    the same real extractable text layer used for unit01). Real sourced
    material: the core cardinal numbers 1-20 (unu through douăzeci), the
    "douăzeci și unu" compound pattern for 21, and the decade words
    treizeci/patruzeci/cincizeci/șaizeci (30/40/50/60) plus o sută (100).
    The source lists numbers up to only 60 before jumping to 100 (its own
    table skips 70/80/90) -- șaptezeci (70), optzeci (80), and nouăzeci
    (90) were extrapolated by regularly applying the exact same "[digit
    root] + -zeci" combining rule the source itself states governs
    Romanian number formation ("a limited set of words and combining
    rules... can be applied to generate the name of any number"), not
    guessed independently; these three and "zero" (not in the source's
    table, which starts at 1) are disclosed as freshly extrapolated/
    authored rather than directly sourced. The source also uses the
    pre-1993 Moldovan/Communist-era cedilla spelling (şase, şapte) rather
    than post-1993 standard Romanian orthography (șase, șapte) -- every
    sourced number word was respelled with the modern comma-below
    diacritics before use, the identical modernization already applied in
    unit01 (see that file's own provenance note), not a dialect swap.
    Freshly authored, not sourced: every teens-pattern (11-19) and
    tens-pattern (30-90) grammar_note explanation, the doi/două gender
    contrast note, every vocabulary example: sentence (AUTHORING_GUIDE
    #19), lesson03's age (câți ani ai/aveți, am + [number] + ani) and
    phone-number (care e/este numărul .../de telefon) phrases and the
    "de" 2-19-vs-20+ insertion rule (a real, independently-known standard
    Romanian grammar point with no equivalent in the source material,
    which has no age or phone-number content at all), and the continued
    use of unit01's Ana/Mihai names in lesson03's closing exercise.
    Authored at schema_version 1.1 from the start -- every kind:vocabulary
    card carries a real example: sentence with a matching overlay
    example_gloss.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Second Romanian unit, first draft, continuing directly from unit01.
    Targets the single spine outcome every other language's own unit02
    uses for numbers (universal.a1.numbers.use_basic_numbers), confirmed
    against nl/fa/fr/es's own unit02 files before authoring. 3 lessons
    (bootstrap pace, matching unit01's own size, not the fuller 6-lesson
    fr/es numbers-unit shape). Teens (12-19) and the higher tens
    (30-90) are deliberately taught via a single consolidated
    grammar_note per pattern rather than one card per number, to keep
    density in line with unit01's per-lesson teaching-card counts while
    still making every number available to test -- flag this
    consolidation choice specifically during fresh-context review in
    case the reviewer prefers one-card-per-number density instead. Needs
    a fresh-context content review before import, same as every other
    language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01's register split: dumneavoastră as the safe default
    with unfamiliar adults, tu with friends/peers. Numbers themselves do
    not change with register, but lesson03's surrounding questions
    (asking someone's age, asking for a phone number) do, the same way
    unit01's greeting questions did.

