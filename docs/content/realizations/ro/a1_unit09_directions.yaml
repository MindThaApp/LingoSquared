          - content_key: ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri
            kind: grammar_note
            target: {text: "unde · este · gară · magazin · bancă · aproape", language_code: ro, direction: ltr}
            introduced_tokens: [unde, este, gară, magazin, bancă, aproape]
          - content_key: ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung
            kind: phrase
            target: {text: "Cum pot să ajung...?", language_code: ro, direction: ltr}
            introduced_tokens: [cum, pot, să, ajung]
          - content_key: ro.a1.unit09.lesson01.teach.mergeti_vocab
            kind: vocabulary
            target: {text: "Mergeți", language_code: ro, direction: ltr}
            introduced_tokens: [mergeți]
            example:
              - {text: "Mergeți înainte.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit09.lesson01.teach.inainte_vocab
            kind: vocabulary
            target: {text: "Înainte", language_code: ro, direction: ltr}
            introduced_tokens: [înainte]
            example:
              - {text: "Mergeți înainte.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase
            kind: phrase
            target: {text: "Mergeți înainte.", language_code: ro, direction: ltr}
            introduced_tokens: [mergeți, înainte]
          - content_key: ro.a1.unit09.lesson01.teach.cum_ajung_gara
            kind: phrase
            target: {text: "Cum pot să ajung la gară?", language_code: ro, direction: ltr}
            introduced_tokens: [cum, pot, să, ajung, la, gară]
          - content_key: ro.a1.unit09.lesson01.teach.cum_ajung_banca
            kind: phrase
            target: {text: "Cum pot să ajung la bancă?", language_code: ro, direction: ltr}
            introduced_tokens: [cum, pot, să, ajung, la, bancă]
        exercises:
          - content_key: ro.a1.unit09.lesson01.exercise01.choose_cum_pot_sa_ajung
            type: multiple_choice
            tested_text: "cum pot să ajung"
            prompt:
              target_blocks:
                - {text: "How can I get to...?", language_code: en, direction: ltr}
          - content_key: ro.a1.unit09.lesson01.exercise02.choose_inainte
            type: multiple_choice
            tested_text: "înainte"
            prompt:
              target_blocks:
                - {text: "straight ahead", language_code: en, direction: ltr}
          - content_key: ro.a1.unit09.lesson01.exercise03.listen_mergeti_inainte
            type: listen_select
            tested_text: "Mergeți înainte"
            media_asset_key: ro.a1.audio.directions.mergeti_inainte.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit09.lesson01.exercise04.match_directions1
            type: matching_pairs
            tested_text: "cum pot să ajung mergeți înainte gară magazin bancă"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Cum pot să ajung...?", right: "How can I get to...?"}
              - {left: "Mergeți", right: "Go"}
              - {left: "Înainte", right: "Straight ahead"}
              - {left: "Gară", right: "train station"}
              - {left: "Magazin", right: "store"}
              - {left: "Bancă", right: "bank"}
          - content_key: ro.a1.unit09.lesson01.exercise05.order_cum_ajung_banca
            type: word_order
            tested_text: "Cum pot să ajung la bancă"
            prompt: {target_blocks: []}
            word_bank: ["la", "bancă", "Cum", "ajung", "pot", "să"]
          - content_key: ro.a1.unit09.lesson01.exercise06.listen_order_cum_ajung_gara
            type: listen_order
            tested_text: "Cum pot să ajung la gară"
            media_asset_key: ro.a1.audio.directions.cum_ajung_gara.01
            prompt: {target_blocks: []}
            word_bank: ["gară", "Cum", "ajung", "la", "pot", "să"]
          - content_key: ro.a1.unit09.lesson01.exercise07.complete_mergeti
            type: fill_in_blank
            tested_text: "înainte"
            prompt:
              target_blocks:
                - {text: "Mergeți ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit09.lesson01.exercise08.speak_cum_ajung_magazin
