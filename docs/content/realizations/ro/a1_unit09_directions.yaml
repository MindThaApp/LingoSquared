generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-08
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- confirmed still a real
    extractable text layer, not a scan; firecrawl was tried first per
    standing instruction but the direct re-fetch of this already-
    confirmed-working PDF was faster and just as reliable, so firecrawl
    was not separately re-run against the same document). Lesson 4
    "Some Basic Questions and Answers" has the real, directly usable
    direction-asking material that unit08's own provenance note
    explicitly flagged as checked-but-deliberately-withheld for this
    later unit: "Cum pot să ajung la hotel?" (How can I get to the
    hotel?), "Mergeți înainte." (Go straight.), and the two continuation
    fragments "... la dreapta." / "... la stînga." (to the right / to
    the left) -- used here as the sourced anchors for this unit's core
    "Cum pot să ajung ...?" direction-asking question (lesson01) and its
    mergeți înainte / la dreapta / la stânga vocabulary (lesson01/02).
    The source spells the two turn words with the pre-1993-reform "î"
    (stînga); modernized here to the standard post-reform "â" mid-word
    spelling (stânga), matching every other ro unit's modern-orthography
    convention (gară, bancă, poștă, etc. all already use â/ă, not the
    older î-only convention). The source gives "... la dreapta."/"...
    la stînga." only as bare continuation fragments following "Mergeți
    înainte" or the "Cum pot să ajung" question, not as standalone
    "Mergeți la dreapta."/"Mergeți la stânga." sentences -- completing
    them into full standalone sentences here is a light, natural fresh
    construction, disclosed honestly rather than presented as a direct
    quote. Lesson 13 "Some Basic Adverbs and Adjectives" has "aici"
    (here) and "acolo" (there) in its adverb list -- real sourced items,
    reused here as this unit's proximity-pointing pair, distinct from
    unit08's aproape/departe (near/far) pair. No sourced material exists
    for combining two direction steps into one instruction (the source
    never joins "înainte" and "la dreapta"/"la stânga" into a single
    sentence) -- "apoi" (then), used to join two steps in lesson03's
    dialogue and its matching exercises, is honestly authored fresh per
    AUTHORING_GUIDE #10's "if the source doesn't cover the topic
    adequately, author fresh." gară/magazin/bancă are this unit's own
    unit08 place nouns, reused directly (see unit08's own realization
    file for their original provenance) as the destinations in this
    unit's direction-asking questions and examples, re-declared via a
    lesson01 reminder card per the standing per-file token-scoping
    convention. Every vocabulary example: sentence (AUTHORING_GUIDE
    #19) was checked against unit08's own established facts per
    AUTHORING_GUIDE #11 before being finalized: an earlier draft of
    lesson02's aici/acolo examples used "Banca este aici." (the bank is
    here), which would have directly contradicted unit08's own
    established "Banca este departe." (the bank is far, part of
    unit08's single consistent neighborhood map, see unit08's own
    provenance note and docs/BUILD_LOG.md) -- caught before finalizing
    and replaced with "Magazinul este aici." (compatible with unit08's
    own "Magazinul este aproape.", since "here" and "near" are not in
    tension the way "here" and "far" are). Lesson01's own "Cum pot să
    ajung la bancă?" (asking how to get to the bank) was checked the
    same way and is fine as-is -- asking directions to a place doesn't
    itself claim anything about that place's distance, and if anything
    reinforces unit08's "Banca este departe." (you'd naturally ask how
    to get somewhere that isn't obviously close). Lesson03's closing
    Ana/Mihai dialogue is a new scenario continuing the recurring
    characters, reusing only this unit's own vocabulary plus the
    reminder-declared bună/mulțumesc/la revedere/da/Ana/Mihai from
    earlier units, per the standing per-file token-scoping convention.
    Authored at schema_version 1.1 from the start -- every
    kind:vocabulary card carries a real example: sentence with a
    matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule,
    AUTHORING_GUIDE #11 cross-lesson fact consistency, #17 fill_in_blank
    ambiguity) against the actual dialogue/exercise content and confirm
    them accurate. Also confirmed no stray YAML booleans, matching_pairs/
    word_order shapes correct, every exercise type registered, no
    jargon leaks, correct and consistent diacritics, natural Romanian
    throughout. No real bugs found; no changes made to this unit. Full
    corpus-wide compiler validation (all 19 ro units + overlays
    together) is clean: 0 errors/0 warnings.

    Ninth Romanian unit, first draft, continuing directly from unit08.
    Targets universal.a1.directions.ask_follow_basic_directions --
    confirmed by grepping universal_spine.yaml directly: it's the entry
    immediately following universal.a1.places.locate_common_places
    (unit08's own outcome) in spine order, its own prerequisites list
    names universal.a1.places.locate_common_places explicitly, and its
    can_do text is "Ask for and follow short directions to a nearby
    place." This course's own established 3-lesson bootstrap pace and
    Ana/Mihai characters are used, matching units 01-08. 3 lessons.
    Deliberately scoped to the core "Cum pot să ajung ...?" (How can I
    get to ...?) question plus "Mergeți înainte." (go straight) and this
    unit's own gară/bancă destination examples (lesson01); "la
    dreapta"/"la stânga" (to the right/left) plus "aici"/"acolo"
    (here/there) (lesson02); and a pure-recap direction-giving Ana/Mihai
    dialogue combining two steps with "apoi" (then) (lesson03) --
    explicitly does NOT cover multi-block-away routes, street names,
    numbered addresses, "în fața"/"în spatele" (would require genitive
    noun forms not yet taught, same trim already noted in unit08), or
    any turn beyond a single left/right choice per step, a real scope
    trim to keep this bootstrap unit to 3 lessons and to A1-appropriate
    "one or two basic direction steps" per the spine's own
    assessment_requirements wording. Reuses this file's own lesson01
    vocabulary directly in lesson02/03 without a fresh reminder, since
    that's within-file reuse, not cross-file -- but DOES re-declare
    "unde/este/gară/magazin/bancă/aproape" (from unit03/unit04/unit07/
    unit08) via a lesson01 reminder card, and "bună/mulțumesc/la
    revedere/da/Ana/Mihai" (from unit01/unit05/unit06/unit07/unit08) via
    a lesson03 reminder card, before any exercise tests them, per the
    standing per-file token-scoping convention. Lesson03's dialogue
    deliberately introduces only one brand-new token in its own teaching
    (apoi, taught via its own vocabulary card immediately before the
    dialogue), then the six dialogue lines themselves introduce zero new
    tokens (all reuse only tokens already taught earlier in this same
    unit or re-declared from an earlier unit), the same pure-recap style
    unit01's/unit04's/.../unit08's own lesson03s used, and closes with
    "Mulțumesc, Mihai! La revedere!" / "La revedere, Ana!" as a direct
    callback to those units' own established closing pattern. Checked
    every fact this unit states or implies against unit08's own
    established neighborhood-map facts per AUTHORING_GUIDE #11 (see the
    aici/acolo note in generation_provenance above for the one real
    conflict this caught and fixed before finalizing). Every
    fill_in_blank slot's correct answer is disambiguated either by being
    the only candidate taught so far in the file (lesson01's "Mergeți
    ___.") or by anchoring to a specific already-established taught fact
    (lesson02's "Magazinul este ___." recalls the specific fact "aici"
    from this lesson's own teaching card; lesson03's "..., apoi la
    ___." recalls the specific two-step direction the dialogue itself
    states) rather than leaving a genuine free choice between la
    dreapta/la stânga with nothing to prefer one over the other, per
    AUTHORING_GUIDE #17's synonym/candidate-ambiguity concern (that
    section is written for fill_in_blank specifically, but the same
    reasoning applies to any blank with more than one grammatically
    valid candidate). Checked every listen_select/dialogue_comprehension
    exercise against the standing same-speaker-distractor rule (see
    docs/BUILD_LOG.md and CLAUDE.md's footgun entry): lesson03's
    dialogue_comprehension distractors ("Mergeți la stânga.", "Este
    departe.") were deliberately chosen as phrases genuinely never
    spoken by anyone in that lesson's dialogue audio clip -- "la
    stânga" never appears at all (only "la dreapta" does, inside
    Mihai's actual combined "Mergeți înainte, apoi la dreapta." line),
    and "departe" never appears (only "aproape" does) -- neither
    distractor is a fragment of anything actually said in the clip.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-08's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    dumneavoastră register with each other). This unit introduces the
    course's first imperative form, "Mergeți" (go) -- the dumneavoastră/
    formal-plural imperative, deliberately chosen over the informal
    tu-register "Mergi" to match the established default and the
    natural real-world scenario (asking a stranger, or a still-not-yet-
    informal acquaintance, for directions). No tu-register imperative is
    taught in this unit; that split is left for whenever the course
    introduces tu more broadly. Ana and Mihai's closing direction
    dialogue keeps their existing polite register intact, matching
    unit06/unit07/unit08.

