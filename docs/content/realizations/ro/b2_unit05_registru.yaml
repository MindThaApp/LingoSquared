status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's
    fifth B2 unit (register -- adapting formality to the audience). Built
    from general Romanian grammar/discourse knowledge, the same
    from-scratch disclosure the nl B2 lane set. Sibling isolation
    honored: the ro-en B2 register realization and every other language's
    B2 file were treated as non-existent and were not opened; the nl B2
    exemplar (b2_unit05_register.yaml) informed structure only (lesson
    pacing, exercise-type sequencing, the register-contrast device of
    rendering one request twice), never text -- every Romanian sentence
    and content_key was composed from scratch, using Romanian's own
    tu/dumneavoastră distinction (not a translation of Dutch je/u).
    Character canon: Mihai (established, inginer) continues; his
    workplace colleagues Ana and Diana are established as ALWAYS formal
    with him (dumneavoastră), so this unit's informal register needed a
    genuinely new relationship -- introduces Bogdan, a close friend of
    Mihai's outside the workplace (verified unused corpus-wide via grep
    before use), matching this unit's register-contrast need without any
    canon conflict. The formal side addresses an unnamed primărie
    (city hall) official, reusing the same institution ro's A2 tier
    already established (a2_unit21_birocratie.yaml, a2_unit22_opinii.yaml)
    as the corpus's default formal-institution scenario -- thematically
    consistent, though B2's own vocabulary is authored fully
    self-contained per this course's own token accumulation, not assuming
    A2 lexemes. No sibling-direction file (ro-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority
    checks for the reviewer: (1) the tu/dumneavoastră verb-agreement
    pairs -- confirm "ai timp"/"aveți timp" and "poți să mă ajuți"/
    "puteți să mă ajutați" are natural and correctly conjugated (2sg vs
    2pl-for-polite-singular); (2) the closings ladder -- confirm "Cu
    stimă" and "Cu deosebit respect" are correctly ranked (the second
    more formal than the first) and that "Stimate domn/Stimată doamnă" is
    the standard salutation when the recipient's gender is unknown; (3)
    "Ar fi posibil să reprogramăm întâlnirea?" and "V-ar conveni
    săptămâna viitoare?" -- confirm both are idiomatic formal-register
    requests and that "a reprograma" is the natural everyday verb for
    rescheduling an appointment (rather than a more bureaucratic
    alternative); (4) word order in "Nu pot lunea asta" -- confirm this
    is the natural placement, or whether an alternative order is
    preferred; (5) confirm "convine/conveni", "altfel", and "nicio
    problemă" all read as current everyday Romanian in both registers
    where used.
  notes: >-
    Fifth Romanian B2 unit; first register unit. Targets the CEFR B2
    register outcome (universal.b2.register.adapt_formality_to_audience):
    adapt formality to the audience -- deliver the same content
    appropriately to a close friend versus an institution. Theme: one
    everyday request -- rescheduling a meeting -- rendered both ways
    across all six lessons. Lesson arc: L01 the tu<->dumneavoastră
    pronoun/verb shift (tu/tău/te vs dumneavoastră; ai -> aveți, poți ->
    puteți); L02 greetings and closings (Salut/Pa vs Stimate domn/Stimată
    doamnă / Cu stimă / Cu deosebit respect); L03 directness -- informal
    direct + te rog vs formal indirect Ați putea / Ar fi posibil să + vă
    rog; L04 the actual request (reprograma întâlnirea) rendered
    informally and formally; L05 a reading requirement -- two messages,
    same content, different register, identify the audience of each; L06
    the culminating production -- a Mihai/Bogdan dialogue for the
    listening requirement (judge whether the register fits and what a
    mismatch would signal), a speaking task delivering the SAME request
    once to a friend and once to an institution, a writing task
    rewriting the informal message as a formal one, and a culminating
    writing task producing the request in BOTH registers. Register: this
    unit teaches both; Bogdan supplies the informal tu side, an unnamed
    primărie official the formal dumneavoastră side. All vocabulary is
    introduced self-contained within the ro B2 course (cumulative with
    units 01-04 -- reuses "trebuie", "poate", "sigur", "ar fi", "când",
    "aveți" etc. already taught earlier in the course). No
    sibling-direction file was consulted; the nl B2 exemplar informed
    structure only, not text.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    formal dumneavoastră register (the ro lane default, continued from
    units 01-04) and the informal tu register, contrasting them. Each
    single exercise stays in one consistent register; the contrast is
    carried across exercise pairs and the culminating exercise. Informal:
    tu/tău/te, direct questions, te rog, Salut/Pa. Formal: dumneavoastră
    with the 2nd-person-plural verb (aveți, puteți), Ați putea, Ar fi
    posibil să, vă rog, Stimate domn/Stimată doamnă, Cu stimă, Cu
    deosebit respect. Mihai keeps the formal dumneavoastră he uses with
    Ana and Diana; Bogdan (new this unit) is a close friend addressed
    with tu.

