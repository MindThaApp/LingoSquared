          - content_key: ro.b2.unit05.lesson01.teach.puteti_ajuta
            kind: phrase
            target: {text: "Puteți să mă ajutați?", language_code: ro, direction: ltr}
            introduced_tokens: [puteți, ajutați]
          - content_key: ro.b2.unit05.lesson01.teach.grammar_tu_dvs
            kind: grammar_note
            target: {text: "Ai timp? Aveți timp? Poți să mă ajuți? Puteți să mă ajutați?", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit05.lesson01.exercise01.recognize_dumneavoastra
            type: multiple_choice
            tested_text: "dumneavoastră"
            prompt: {target_blocks: [{text: "dumneavoastră", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit05.lesson01.exercise02.listen_aveti_timp
            type: listen_select
            tested_text: "Aveți timp"
            media_asset_key: ro.b2.audio.registru.aveti_timp.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit05.lesson01.exercise03.match_pronouns
            type: matching_pairs
            tested_text: "tu tău te dumneavoastră poți puteți ai timp aveți timp"
            prompt: {target_blocks: []}
            pairs:
              - {left: tu, right: "you (informal, subject)"}
              - {left: tău, right: "your (informal)"}
              - {left: te, right: "you (informal, object)"}
              - {left: dumneavoastră, right: "you (formal)"}
              - {left: "poți să mă ajuți", right: "can you help me (informal)"}
              - {left: "puteți să mă ajutați", right: "can you help me (formal)"}
              - {left: "ai timp", right: "do you have time (informal)"}
              - {left: "aveți timp", right: "do you have time (formal)"}
          - content_key: ro.b2.unit05.lesson01.exercise04.order_ai_timp
