            example: {text: "Te rog să mă asculți.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit05.lesson01.teach.dumneavoastra
            kind: vocabulary
            target: {text: "dumneavoastră", language_code: ro, direction: ltr}
