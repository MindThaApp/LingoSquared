            tested_text: "Aveți timp"
            prompt: {target_blocks: [{text: "Translate into Romanian, formal (addressing the person as dumneavoastră): Do you have time?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit05.lesson01.exercise06.translate_poti_ajuta
            type: translation
            tested_text: "Poți să mă ajuți"
            prompt: {target_blocks: [{text: "Translate into Romanian, informal (addressing the person as tu): Can you help me?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit05.lesson01.exercise07.speak_puteti_ajuta
