    language: ro
    text: "Ana: Bună ziua, Mihai! Trebuie să plecați deja? Mihai: Da, trebuie să termin un raport important la birou. Ana: Ar fi trebuit să terminați raportul ieri? Mihai: Da, dar sunt ocupat. Nu trebuie să întârzii azi. Ana: Înțeleg. Trebuie să plec și eu, la școală. Mihai: Mulțumesc, Ana! La revedere! Ana: La revedere, Mihai!"
