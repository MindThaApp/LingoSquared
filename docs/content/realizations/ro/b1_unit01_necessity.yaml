generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's first-ever B1/intermediate unit. `firecrawl --status`
    confirmed still 0/1,000 credits at authoring time, so the same public-
    domain source used for ro's A1/A2 units ("Basic Romanian Language
    Lessons," US Peace Corps Moldova, public domain,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was re-checked directly via
    curl + pdftotext -layout rather than firecrawl. Grepped the full
    785-line extraction for trebuie/subjunctive/conjunctiv/conditional/
    dacă/putea/de acord: only two scattered example phrases containing
    "trebuie să" exist ("Ce trebuie să fac?", "Eu trebuie să plec astăzi
    la Chişinău"), no dedicated subjunctive/conditional grammar lesson of
    any kind -- this source is confirmed beginner-phrasebook-only, the
    same conclusion a2_unit26's own provenance note already reached for
    this exact source on a different topic. This unit is therefore
    authored fresh from general standard Romanian grammar knowledge, not
    adapted from source material.

    Teaches trebuie (invariant "must/should") + să + conjunctiv-prezent
    as the main B1 target, directly paralleling fa/prs's own first B1
    units' modal-plus-embedded-clause pattern -- but this is a genuine,
    independently-verified feature of Romanian grammar (a real Balkan-
    sprachbund trait: Romanian lost the productive infinitive and uses
    a periphrastic "să + conjugated verb" construction after modals,
    the same typological shape as Persian's باید), not copied from
    either language's content. Person-marking lands on the verb after
    trebuie, never on trebuie itself, which stays fixed in every
    sentence -- and a real, worth-flagging Romanian-specific fact used
    as the unit's own grammar point: conjunctiv-prezent is identical in
    form to indicativ-prezent for 1st/2nd person but diverges at 3rd
    person (indicativ "el pleacă" vs conjunctiv "el să plece"), and the
    3rd-person singular and plural conjunctiv forms are themselves
    identical ("el să plece" / "ei să plece") -- distinguishable only by
    the subject, not the verb form. Past regret/unfulfilled obligation
    uses "ar fi trebuit să..." (itself also invariant, mirroring
    trebuie's own invariance), and negation "nu trebuie să..." is taught
    with its prohibition ("must not") sense specifically, flagged in the
    grammar note as one of two real readings context can select between
    (the other being "don't have to") -- English speakers' likely
    interference risk is assuming trebuie itself conjugates the way
    English modals don't, when it's actually the periphrastic verb that
    carries person-marking.

    Continues Ana (profesoară, lucrează la școală) and Mihai (inginer,
    lucrează la birou) from the A1/A2 course, and their established
    formal dumneavoastră register with each other (per unit01-26's
    register_policy) -- the voi-conjugated verb form used for
    dumneavoastră (e.g. "plecați") is the same form used for literal
    plural "you," a genuine double-duty fact folded into lesson02's
    grammar note rather than treated as a separate topic. Lesson04's
    workplace-deadline dialogue between Ana and Mihai is a new scenario,
    not reused text from any other unit or language, but is consistent
    with their established jobs. All vocabulary is introduced
    self-contained within this file, matching the established per-file
    convention (avoids the known per-file untaught-vocabulary compiler
    check gotcha).
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context adversarial review completed 2026-07-11 (Opus, zero
    access to the authoring reasoning); all AUTHORING_GUIDE.md #20
    sweeps and grammar/register/character checks passed, compiler
    green. Ship-ready.

    Second-pass review 2026-10-19: 2 fixes - lesson04 exercise01
    comprehension question was circular/unanswerable (asked why Mihai must
    finish the report; the dialogue gives no reason) -> now asks what he
    must finish at the office; lesson05 exercise02 question 'Cine ajută
    Ana' was ungrammatical -> 'Cine o ajută pe Ana anul acesta?'
    (anul_acesta example now teaches o/pe).
course:
  realization_key: ro.b1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continues the established dumneavoastră-default register from ro
    A1/A2 (units 01-26): Ana and Mihai address each other formally
    throughout, matching their existing corpus-wide relationship.

