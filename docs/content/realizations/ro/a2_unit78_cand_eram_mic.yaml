          - {"content_key": "ro.a2.unit78.lesson06.ana_si_mihai.exercise02.intelege_vara", "type": "dialogue_comprehension", "tested_text": "Mergeam la unchiul meu", "media_asset_key": "ro.a2.audio.dialogue.cand_eram_mic.01", "prompt": {"target_blocks": [{"text": "Where did Mihai use to go every summer?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit78.lesson06.ana_si_mihai.exercise03.une_dialog", "type": "matching_pairs", "tested_text": "Ce făceai când erai mic Mă jucam mult afară Îți plăcea școala Da, îmi plăcea Citeam mult Ce făceai în fiecare vară Mergeam la unchiul meu Pe atunci era frumos", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ce făceai când erai mic?", "right": "What did you use to do when you were little?"}, {"left": "Mă jucam mult afară.", "right": "I played outside a lot."}, {"left": "Îți plăcea școala?", "right": "Did you like school?"}, {"left": "Da, îmi plăcea.", "right": "Yes, I liked it."}, {"left": "Citeam mult.", "right": "I read a lot."}, {"left": "Ce făceai în fiecare vară?", "right": "What did you do every summer?"}, {"left": "Mergeam la unchiul meu.", "right": "I used to go to my uncle's."}, {"left": "Pe atunci era frumos!", "right": "Back then it was nice!"}]}
          - {"content_key": "ro.a2.unit78.lesson06.ana_si_mihai.exercise04.ordoneaza_jucam", "type": "word_order", "tested_text": "Mă jucam mult afară cu prietenii", "prompt": {"target_blocks": []}, "word_bank": ["Mă", "jucam", "mult", "afară", "cu", "prietenii"]}
          - {"content_key": "ro.a2.unit78.lesson06.ana_si_mihai.exercise05.raspunde_scoala", "type": "dialogue_response", "tested_text": "Da îmi plăcea", "prompt": {"target_blocks": [{"text": "Îți plăcea școala?", "language_code": "ro", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit78.lesson06.ana_si_mihai.exercise06.tradu_citeam", "type": "translation", "tested_text": "Când eram mic, citeam mult", "prompt": {"target_blocks": [{"text": "When I was little, I read a lot.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit78.lesson06.ana_si_mihai.exercise07.scrie_copilarie", "type": "writing_prompt", "tested_text": "Când eram mic, mă jucam afară Îmi plăcea foarte mult", "prompt": {"target_blocks": [{"text": "Write two Romanian sentences about your childhood: (1) When you were little, you played outside. (2) You liked it very much.", "language_code": "en", "direction": "ltr"}]}}
