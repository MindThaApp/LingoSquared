      - content_key: ro.a2.unit78.lesson05.vara_la_bunici
        title: "Vara la bunici"
        spine_outcome_id: universal.a2.past.describe_past_habits
        teaching:
          - {"content_key": "ro.a2.unit78.lesson05.teach.cuvinte", "kind": "vocabulary", "target": {"text": "sat, grădină, copii, ziua, dimineața, bunicii", "language_code": "ro", "direction": "ltr"}, "introduced_tokens": ["sat", "grădină", "copii", "ziua", "dimineața", "bunicii", "Mergeam", "la", "în", "fiecare", "vară", "Bunicii", "aveau", "o", "mare", "Ziua", "mă", "jucam", "cu", "copiii", "Dimineața", "trezeam", "devreme"], "example": [{"text": "Mergeam la sat în fiecare vară.", "language_code": "ro", "direction": "ltr"}, {"text": "Bunicii aveau o grădină mare.", "language_code": "ro", "direction": "ltr"}, {"text": "Ziua mă jucam cu copiii.", "language_code": "ro", "direction": "ltr"}, {"text": "Dimineața mă trezeam devreme.", "language_code": "ro", "direction": "ltr"}]}
          - {"content_key": "ro.a2.unit78.lesson05.teach.intrebari", "kind": "phrase", "target": {"text": "Cum era vara la bunici? Ce făceai acolo? Unde mergeai?", "language_code": "ro", "direction": "ltr"}, "introduced_tokens": ["Cum", "era", "vara", "la", "bunici", "Ce", "făceai", "acolo", "Unde", "mergeai"]}
          - {"content_key": "ro.a2.unit78.lesson05.teach.lectura_ana", "kind": "reading", "target": {"text": "Maria, cum era vara la bunici, când erai mică?", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Maria", "cum", "era", "vara", "la", "bunici", "când", "erai", "mică"]}
          - {"content_key": "ro.a2.unit78.lesson05.teach.lectura_maria1", "kind": "reading", "target": {"text": "Mergeam în fiecare vară la bunici, la sat. Bunicii aveau o grădină mare.", "language_code": "ro", "direction": "ltr", "speaker": "Maria"}, "introduced_tokens": ["Mergeam", "în", "fiecare", "vară", "la", "bunici", "sat", "Bunicii", "aveau", "o", "grădină", "mare"]}
          - {"content_key": "ro.a2.unit78.lesson05.teach.lectura_maria2", "kind": "reading", "target": {"text": "Dimineața mă trezeam devreme. Ziua mă jucam cu copiii din sat. Seara mâncam în curte.", "language_code": "ro", "direction": "ltr", "speaker": "Maria"}, "introduced_tokens": ["Dimineața", "mă", "trezeam", "devreme", "Ziua", "jucam", "cu", "copiii", "din", "sat", "Seara", "mâncam", "în", "curte"]}
          - {"content_key": "ro.a2.unit78.lesson05.teach.lectura_maria3", "kind": "reading", "target": {"text": "Îmi plăcea foarte mult. Acum nu mai merg la sat în fiecare vară.", "language_code": "ro", "direction": "ltr", "speaker": "Maria"}, "introduced_tokens": ["Îmi", "plăcea", "foarte", "mult", "Acum", "nu", "mai", "merg", "la", "sat", "în", "fiecare", "vară"]}
        exercises:
          - {"content_key": "ro.a2.unit78.lesson05.vara_la_bunici.exercise01.citeste_sat", "type": "reading_comprehension", "tested_text": "Mergeam în fiecare vară la bunici", "prompt": {"target_blocks": [{"text": "Where did Maria go every summer?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit78.lesson05.vara_la_bunici.exercise02.citeste_gradina", "type": "reading_comprehension", "tested_text": "Bunicii aveau o grădină mare", "prompt": {"target_blocks": [{"text": "What did Maria's grandparents have?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit78.lesson05.vara_la_bunici.exercise03.une_lectura", "type": "matching_pairs", "tested_text": "Cum era vara la bunici Mergeam în fiecare vară la bunici Bunicii aveau o grădină mare Dimineața mă trezeam devreme Ziua mă jucam cu copiii din sat Seara mâncam în curte Îmi plăcea foarte mult Acum nu mai merg la sat", "prompt": {"target_blocks": []}, "pairs": [{"left": "Cum era vara la bunici?", "right": "What was summer at your grandparents' like?"}, {"left": "Mergeam în fiecare vară la bunici.", "right": "Every summer I went to my grandparents."}, {"left": "Bunicii aveau o grădină mare.", "right": "My grandparents had a big garden."}, {"left": "Dimineața mă trezeam devreme.", "right": "In the morning I woke up early."}, {"left": "Ziua mă jucam cu copiii din sat.", "right": "During the day I played with the village children."}, {"left": "Seara mâncam în curte.", "right": "In the evening we used to eat in the yard."}, {"left": "Îmi plăcea foarte mult.", "right": "I liked it very much."}, {"left": "Acum nu mai merg la sat.", "right": "Now I no longer go to the village."}]}
          - {"content_key": "ro.a2.unit78.lesson05.vara_la_bunici.exercise04.ordoneaza_bunicii", "type": "word_order", "tested_text": "Bunicii aveau o grădină mare", "prompt": {"target_blocks": []}, "word_bank": ["Bunicii", "aveau", "o", "grădină", "mare"]}
          - {"content_key": "ro.a2.unit78.lesson05.vara_la_bunici.exercise05.tradu_nu_mai", "type": "translation", "tested_text": "Acum nu mai merg la sat în fiecare vară", "prompt": {"target_blocks": [{"text": "Now I no longer go to the village every summer.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit78.lesson05.vara_la_bunici.exercise06.dicteaza_mergeam", "type": "dictation", "tested_text": "Mergeam în fiecare vară la bunici.", "media_asset_key": "ro.a2.audio.cand_eram_mic.mergeam_la_bunici.01", "prompt": {"target_blocks": []}}
          - {"content_key": "ro.a2.unit78.lesson05.vara_la_bunici.exercise07.dicteaza_gradina", "type": "dictation", "tested_text": "Bunicii aveau o grădină mare.", "media_asset_key": "ro.a2.audio.cand_eram_mic.gradina_mare.01", "prompt": {"target_blocks": []}}
      - content_key: ro.a2.unit78.lesson06.ana_si_mihai
