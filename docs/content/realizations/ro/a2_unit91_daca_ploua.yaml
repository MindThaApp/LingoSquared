          - {"content_key": "ro.a2.unit91.lesson06.teach.d7", "kind": "dialogue", "target": {"text": "Bine! Dacă nu poți, nu e nimic.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Bine", "Dacă", "nu", "poți", "e", "nimic"]}
