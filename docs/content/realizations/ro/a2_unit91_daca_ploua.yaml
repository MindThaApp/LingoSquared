          - {"content_key": "ro.a2.unit91.lesson06.exercise03.une_dialog", "type": "matching_pairs", "tested_text": "Ce facem sâmbătă Dacă e soare mergem în parc Și dacă plouă Dacă plouă rămânem acasă și gătim Dacă ai timp vino la mine dimineața Dacă termin lucrul vin Dacă nu te sun Dacă nu poți nu e nimic", "prompt": {"target_blocks": []}, "pairs": [{"left": "Ce facem sâmbătă?", "right": "What are we doing on Saturday?"}, {"left": "Dacă e soare, mergem în parc.", "right": "If it's sunny, we go to the park."}, {"left": "Și dacă plouă?", "right": "And if it rains?"}, {"left": "Dacă plouă, rămânem acasă și gătim.", "right": "If it rains, we stay home and cook."}, {"left": "Dacă ai timp, vino la mine dimineața.", "right": "If you have time, come to my place in the morning."}, {"left": "Dacă termin lucrul, vin.", "right": "If I finish work, I'll come."}, {"left": "Dacă nu, te sun.", "right": "If not, I'll call you."}, {"left": "Dacă nu poți, nu e nimic.", "right": "If you can't, it's nothing."}]}
          - {"content_key": "ro.a2.unit91.lesson06.exercise04.ordine_ploua", "type": "word_order", "tested_text": "Dacă plouă rămânem acasă și gătim", "prompt": {"target_blocks": []}, "word_bank": ["gătim", "și", "acasă", "rămânem", "plouă", "Dacă"]}
          - {"content_key": "ro.a2.unit91.lesson06.exercise05.raspunde_ploua", "type": "dialogue_response", "tested_text": "Dacă plouă rămânem acasă și gătim", "prompt": {"target_blocks": [{"text": "Și dacă plouă?", "language_code": "ro", "direction": "ltr"}]}}
