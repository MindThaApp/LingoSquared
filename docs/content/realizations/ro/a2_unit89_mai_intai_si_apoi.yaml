          - {"content_key": "ro.a2.unit89.lesson05.exercise03.une_ziua", "type": "matching_pairs", "tested_text": "Mai întâi beau cafea După ce beau cafea merg la serviciu Înainte să plec sun acasă Când ajung acasă mănânc Citesc puțin Mă spăl pe dinți înainte să mă culc După ce mănânc spăl vasele", "prompt": {"target_blocks": []}, "pairs": [{"left": "Mai întâi beau cafea.", "right": "First I drink coffee."}, {"left": "După ce beau cafea, merg la serviciu.", "right": "After I drink coffee, I go to work."}, {"left": "Înainte să plec, sun acasă.", "right": "Before I leave, I call home."}, {"left": "Când ajung acasă, mănânc.", "right": "When I get home, I eat."}, {"left": "Citesc puțin.", "right": "I read a little."}, {"left": "Mă spăl pe dinți înainte să mă culc.", "right": "I brush my teeth before I go to bed."}, {"left": "După ce mănânc, spăl vasele.", "right": "After I eat, I wash the dishes."}]}
