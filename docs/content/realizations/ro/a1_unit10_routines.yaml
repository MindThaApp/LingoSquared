schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-09
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- firecrawl was tried first per
    standing instruction but returned 0/1000 credits remaining this
    cycle, so the direct re-fetch of this already-confirmed-working PDF
    was used instead, matching unit09's own precedent for the identical
    situation). Checked this source specifically for daily-routine
    material (grepped the full extracted text for wake/breakfast/
    morning/work/sleep-related terms) and found it does NOT have a
    dedicated daily-routine lesson or vocabulary list at all -- the
    closest real material is scattered across Lesson 17's "Day by day
    conversation" listening exercise ("Bună dimineaţa!", "Eu trebuie să
    plec astăzi la Chişinău." / "La ce oră?" / "La ora 9." / "La ce oră
    vei veni acasă?" / "probabil pe la 7 seara", and a second exchange
    "Peste jumătate de oră vom lua cina." / "Ce avem astăzi la cină?")
    and Lesson 15's house-vocabulary list (casă, dormitor, bucătărie,
    baie). None of this is genuine present-tense first-person routine
    vocabulary (wake up, eat breakfast, go to work, go to bed) -- it's
    a one-off travel-departure exchange and a future-tense dinner
    exchange, not reusable as-is for an A1 "describe your daily
    routine" unit. Per AUTHORING_GUIDE #10 ("if the source doesn't
    cover the topic adequately, author fresh, disclosed honestly"),
    this unit's core routine verbs (mă trezesc "I wake up", mănânc "I
    eat", beau "I drink", lucrez "I work", merg "I go", mă culc "I go
    to bed") and the connective phrases built from them are freshly
    authored, not sourced -- independently verified for accuracy
    against standard A1 Romanian reference material (WebSearch
    cross-referencing RomanianPod101's and Clozemaster's own Romanian
    daily-routine vocabulary lists, not Firecrawl -- this is grammar/
    vocabulary verification, not a content source). "Acasă" (home) is
    a light real echo of the source's own "veni acasă" (Lesson 17), used
    here as this unit's own standalone vocabulary item. This unit
    deliberately reuses several already-established facts from unit04
    rather than inventing a separate routine: unit04's Ana/Mihai
    dialogue already established "Cursul începe la ora nouă,
    dimineața." (Mihai's language class starts at nine in the morning)
    and its own example sentence "Mihai lucrează seara." (Mihai works
    in the evening) -- this unit's lesson03 dialogue has Mihai restate
    both facts in the first person ("Cursul începe la ora nouă,
    dimineața." reused verbatim; "Lucrez seara." as the first-person
    form of the already-established "lucrează seara"), giving a single
    coherent full-day account (class in the morning, work in the
    evening, bed at night) instead of contradicting or duplicating
    unit04's own established facts -- checked deliberately per
    AUTHORING_GUIDE #11 before finalizing, see the review notes below
    for the full cross-check. Unit06's dialogue also already
    established Ana ordering "o cafea" and Mihai ordering "un ceai" at
    a cafe; this unit's own "Beau cafea dimineața." vocabulary example
    is deliberately left unattributed to either character (a generic
    "I" statement used only in teaching cards/exercises, never spoken
    by Ana or Mihai in this unit's own dialogue) specifically so it
    cannot contradict Mihai's established tea preference -- if a
    future unit ever puts this sentence in Mihai's own mouth, it should
    say "ceai," not "cafea." "Apoi" (then), taught in unit09, is
    reused in this unit's lesson03 dialogue to join two of Mihai's
    routine actions and is re-declared via a reminder card per the
    standing per-file token-scoping convention, matching how unit09
    itself re-declared unit03/04/07/08 tokens. Authored at
    schema_version 1.1 from the start -- every kind:vocabulary card
    carries a real example: sentence with a matching overlay
    example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule,
    AUTHORING_GUIDE #11 cross-lesson fact consistency with unit04/
    unit06, #17 fill_in_blank ambiguity) against the actual dialogue/
    exercise content and confirm them accurate. Also confirmed no
    stray YAML booleans, matching_pairs/word_order shapes correct,
    every exercise type registered, no jargon leaks, correct and
    consistent diacritics, natural Romanian throughout. No real bugs
    found; no changes made to this unit.

    Tenth Romanian unit, first draft, continuing directly from unit09.
    Targets universal.a1.routines.describe_daily_routine -- confirmed by
    grepping universal_spine.yaml directly: it's the entry immediately
    following universal.a1.directions.ask_follow_basic_directions
    (unit09's own outcome) in spine order, its own prerequisites list
    names universal.a1.time.ask_tell_time explicitly (satisfied by
    unit04, already complete), and its can_do text is "Describe a
    simple daily routine using common activities and times." This
    course's own established 3-lesson bootstrap pace and Ana/Mihai
    characters are used, matching units 01-09. 3 lessons. Deliberately
    scoped to first-person routine statements built from six new verbs
    (mă trezesc, mănânc, beau, lucrez, merg, mă culc) plus one new
    vocabulary item (acasă) and one reused cross-unit connective (apoi,
    from unit09) -- explicitly does NOT cover reflexive verb
    conjugation for other persons (vă treziți, se trezește, etc.), a
    getting-dressed/hygiene vocabulary set (mă spăl, mă îmbrac), or any
    routine-comparison/frequency language (always, usually, on
    weekdays) -- a real scope trim to keep this bootstrap unit to 3
    lessons and to A1-appropriate "describe several ordinary daily
    activities" per the spine's own assessment_requirements wording,
    the same trim discipline unit08/unit09 already applied to their own
    topics. Ties this unit's own reflexive/first-person verb forms
    directly to unit04's and unit06's already-established facts rather
    than inventing a separate, disconnected routine -- see the
    generation_provenance note above for the full detail: Mihai's
    lesson03 dialogue restates unit04's own "Cursul începe la ora nouă,
    dimineața." verbatim and gives the first-person form of unit04's
    own "Mihai lucrează seara." ("Lucrez seara."), and this unit's
    generic "Beau cafea dimineața." example is deliberately kept
    unattributed to avoid contradicting unit06's own established fact
    that Mihai orders ceai, not cafea. Checked every fact this unit
    states or implies against unit04's and unit06's own established
    facts per AUTHORING_GUIDE #11 -- no other conflict found (Ana's
    "Și seara?" / Mihai's "Lucrez seara, apoi mă culc noaptea." line
    was cross-checked against unit04's "Ana doarme noaptea." example
    too, and is compatible -- both characters being asleep at night is
    not in tension, unlike the "here" vs. "far" conflict unit09 found
    and fixed). Every fill_in_blank slot's correct answer is
    disambiguated by being the only candidate with nothing else taught
    so far to compete with it, per AUTHORING_GUIDE #17's
    synonym/candidate-ambiguity concern (written for fill_in_blank
    templates specifically, but applied here too as a matter of
    authoring discipline even though the hard compiler check is
    template-only): lesson01's "Mă ___ dimineața." recalls "trezesc,"
    the only wake-up verb taught in the whole course; lesson02's
    "Lucrez seara ___ merg acasă noaptea." recalls "și," the only
    connective word taught so far at that point in the unit (apoi isn't
    introduced until lesson03, so no synonym competes yet); lesson03's
    "Cursul ___ la ora nouă, dimineața." recalls "începe," the only
    "starts" verb taught in the course -- deliberately NOT a blank on
    "apoi"/"și" in the "Lucrez seara, ___ mă culc noaptea." position,
    since both words are independently taught by that point in the unit
    and would genuinely both fit grammatically, which is exactly the
    ambiguity this section warns against. Checked every
    listen_select/dialogue_comprehension exercise against the standing
    same-speaker-distractor rule (see docs/BUILD_LOG.md and CLAUDE.md's
    footgun entry): lesson01's and lesson02's listen_select exercises
    use single-sentence audio clips (not multi-speaker dialogue audio),
    so the rule's core concern doesn't directly apply, but distractors
    were still chosen to be different sentences never spoken in that
    specific clip. Lesson03's dialogue_comprehension distractors ("La
    ora șapte, seara.", "La ora trei, după-amiaza.") were verified
    against the full six-line dialogue transcript below -- neither
    "șapte," "trei," nor "după-amiaza" is said by Ana or Mihai anywhere
    in that audio clip, so neither distractor is a fragment of anything
    either speaker actually says.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-09's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    dumneavoastră register with each other). This unit's new verbs are
    all first-person singular (mă trezesc, mănânc, beau, lucrez, merg,
    mă culc) and therefore register-neutral -- Romanian's first-person
    verb form doesn't change with tu/dumneavoastră, only second-person
    forms do, and this unit introduces none of those. Ana and Mihai's
    closing dialogue keeps their existing polite register intact,
    matching unit06/unit07/unit08/unit09.

