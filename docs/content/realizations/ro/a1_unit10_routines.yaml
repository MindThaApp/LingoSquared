          - content_key: ro.a1.unit10.lesson02.exercise04.match_routines2
            type: matching_pairs
            tested_text: "mă trezesc mănânc beau lucrez merg acasă dimineața seara noaptea"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Mă trezesc", right: "I wake up"}
              - {left: "Mănânc", right: "I eat"}
              - {left: "Beau", right: "I drink"}
              - {left: "Lucrez", right: "I work"}
              - {left: "Merg", right: "I go"}
              - {left: "Acasă", right: "home"}
              - {left: "Dimineața", right: "in the morning"}
              - {left: "Seara", right: "in the evening"}
              - {left: "Noaptea", right: "at night"}
          - content_key: ro.a1.unit10.lesson02.exercise05.order_lucrez_merg_acasa
