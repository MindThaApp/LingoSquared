units:
  - content_key: ro.a1.unit10.routines
    title: "Rutina zilnică"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.routines.describe_daily_routine
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit10.lesson01.dimineata
        title: "Dimineața"
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine
            kind: grammar_note
            target: {text: "dimineața · seara · noaptea · cafea · pâine", language_code: ro, direction: ltr}
            introduced_tokens: [dimineața, seara, noaptea, cafea, pâine]
          - content_key: ro.a1.unit10.lesson01.teach.ma_trezesc_vocab
            kind: vocabulary
            target: {text: "Mă trezesc", language_code: ro, direction: ltr}
            introduced_tokens: [mă, trezesc]
            example:
              - {text: "Mă trezesc dimineața.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit10.lesson01.teach.ma_trezesc_phrase
            kind: phrase
            target: {text: "Mă trezesc dimineața.", language_code: ro, direction: ltr}
            introduced_tokens: [mă, trezesc, dimineața]
          - content_key: ro.a1.unit10.lesson01.teach.mananc_vocab
            kind: vocabulary
            target: {text: "Mănânc", language_code: ro, direction: ltr}
            introduced_tokens: [mănânc]
            example:
              - {text: "Mănânc pâine dimineața.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit10.lesson01.teach.beau_vocab
            kind: vocabulary
            target: {text: "Beau", language_code: ro, direction: ltr}
            introduced_tokens: [beau]
            example:
              - {text: "Beau cafea dimineața.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit10.lesson01.teach.mananc_beau_phrase
            kind: phrase
            target: {text: "Mănânc pâine și beau cafea dimineața.", language_code: ro, direction: ltr}
            introduced_tokens: [mănânc, pâine, și, beau, cafea, dimineața]
        exercises:
          - content_key: ro.a1.unit10.lesson01.exercise01.choose_ma_trezesc
            type: multiple_choice
            tested_text: "mă trezesc"
            prompt:
              target_blocks:
                - {text: "I wake up", language_code: en, direction: ltr}
          - content_key: ro.a1.unit10.lesson01.exercise02.choose_mananc
            type: multiple_choice
            tested_text: "mănânc"
            prompt:
              target_blocks:
                - {text: "I eat", language_code: en, direction: ltr}
          - content_key: ro.a1.unit10.lesson01.exercise03.listen_ma_trezesc_dimineata
            type: listen_select
            tested_text: "Mă trezesc dimineața"
            media_asset_key: ro.a1.audio.routines.ma_trezesc_dimineata.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit10.lesson01.exercise04.match_routines1
            type: matching_pairs
            tested_text: "mă trezesc mănânc beau cafea pâine dimineața seara noaptea"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Mă trezesc", right: "I wake up"}
              - {left: "Mănânc", right: "I eat"}
              - {left: "Beau", right: "I drink"}
              - {left: "Cafea", right: "coffee"}
              - {left: "Pâine", right: "bread"}
              - {left: "Dimineața", right: "in the morning"}
              - {left: "Seara", right: "in the evening"}
              - {left: "Noaptea", right: "at night"}
          - content_key: ro.a1.unit10.lesson01.exercise05.order_mananc_paine_dimineata
            type: word_order
            tested_text: "Mănânc pâine dimineața"
            prompt: {target_blocks: []}
            word_bank: ["dimineața", "Mănânc", "pâine"]
          - content_key: ro.a1.unit10.lesson01.exercise06.listen_order_beau_cafea_dimineata
            type: listen_order
            tested_text: "Beau cafea dimineața"
            media_asset_key: ro.a1.audio.routines.beau_cafea_dimineata.01
            prompt: {target_blocks: []}
            word_bank: ["cafea", "Beau", "dimineața"]
          - content_key: ro.a1.unit10.lesson01.exercise07.complete_ma_trezesc
            type: fill_in_blank
            tested_text: "trezesc"
            prompt:
              target_blocks:
                - {text: "Mă ___ dimineața.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit10.lesson01.exercise08.speak_beau_cafea
            type: speak_response
            tested_text: "beau cafea dimineața"
            prompt:
              target_blocks:
