            type: dialogue_comprehension
            tested_text: "La ora nouă, dimineața."
            media_asset_key: ro.a1.audio.dialogue.rutina_mihai.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit10.lesson03.exercise03.reading_comprehend_rutina
            type: reading_comprehension
            tested_text: "mă culc"
            prompt:
