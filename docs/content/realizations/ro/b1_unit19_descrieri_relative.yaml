          - content_key: ro.b1.unit19.lesson03.teach.grammar_al_carui_a_carei_agreement
            kind: grammar_note
            target: {text: "Mihai, al cărui birou este lângă al meu, este inginer. Diana, a cărei carte preferată este despre proiecte, învață mult. \"Al cărui\"/\"a cărei\" au două părți care se acordă cu lucruri diferite: \"cărui\"/\"cărei\" (și pluralul \"căror\") se acordă cu genul POSESORULUI -- Mihai e masculin, deci \"cărui\"; Diana e feminin, deci \"cărei\" -- în timp ce \"al\"/\"a\" (și pluralul \"ai\"/\"ale\") se acordă cu genul lucrului POSEDAT -- \"birou\" e neutru (la singular se acordă ca un masculin), deci \"al\"; \"carte\" e feminin, deci \"a\". În aceste două exemple, genul posesorului și genul lucrului posedat coincid din întâmplare, dar cele două părți urmăresc două lucruri diferite, nu același gen.", language_code: ro, direction: ltr}
