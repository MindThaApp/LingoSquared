generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: true
  notes: >-
    Romanian's nineteenth B1 unit, continuing the b1_unit01-18 authoring
    pass. This is the final unit of the 17-19 span and COMPLETES the
    canonical 19-outcome B1 tier for ro. Authored fresh from general
    standard Romanian grammar knowledge (matching b1_unit01-18
    precedent; the Peace Corps Moldova source used throughout ro's
    corpus was re-checked and has no dedicated relative-clause lesson).

    Teaches universal.b1.narrative.combine_descriptions_with_relative_
    clauses: combining two facts about a person, place, or thing into
    one richer sentence with a relative clause. Covers three Romanian
    relative-pronoun forms in increasing complexity: (1) plain "care"
    as subject (invariant for gender, agrees only in number: "care" vs
    "care" -- actually invariant, but the ANTECEDENT'S number/gender
    governs verb agreement); (2) "care" combined with a preposition
    ("cu care", "despre care", "în care" -- the "preposition + relative
    pronoun" requirement); (3) the possessive relative "al cărui" (masc/
    neuter possessed noun) vs "a cărei" (feminine possessed noun) --
    genuinely GENDER-AGREEING relative pronoun forms, satisfying the
    outcome's explicit "must agree in gender/number" requirement (plain
    "care" itself does not decline for gender, so "al cărui"/"a cărei"
    is the construction that demonstrates this).

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-18), dumneavoastră-formal
    register. Ana describes Mihai and Diana using relative clauses
    combining two established facts about each (Mihai's profession/his
    office; Diana's role/her report from unit18) -- no new fact
    contradicts anything established previously. All genuinely new
    vocabulary is introduced self-contained within this file; no
    sibling-direction overlay was consulted while authoring.
review:
  status: reviewed
  required_next_reviewer: null
  notes: "Second-pass review 2026-10-19: 2 fixes - lesson03 grammar note labelled birou \"masculin/neutru\"; corrected to neuter (agrees like a masculine in the singular); lesson01 writing prompt English corrected to \"has worked ... for ten years\". NATIVE FLAGS: Diana's line \"Și eu, a cărei carte preferată este despre proiecte, învăț mult de la el\" (1st-person antecedent + odd content) reads stilted and should be checked by a native speaker; lesson01 note calls the combined sentence a \"propoziție\" (school grammar: \"frază\"); lesson03 introduced_tokens list does not match the rewritten note text (not learner-facing)."

