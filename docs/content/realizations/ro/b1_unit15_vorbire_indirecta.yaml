  human_reviewed: true
  notes: >-
    Romanian's fifteenth B1 unit, continuing the b1_unit01-14 authoring
    pass. Source-material check redone for this specific topic before
    authoring: the same public-domain source used throughout ro's corpus
    ("Basic Romanian Language Lessons," US Peace Corps Moldova, public
    domain, https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for reported-speech markers (a spus că, a întrebat
    dacă) across the full 785-line extraction -- no dedicated reported-
    speech lesson found. This unit is therefore authored fresh from
    general standard Romanian grammar knowledge, matching b1_unit01-14's
    precedent.

    Teaches the spine outcome's full requirement (universal.b1.
    reported_speech.report_what_someone_said): an embedded-clause
    reported-speech construction with "a spus că" ("said that") for
    reporting a statement, and "a întrebat dacă" ("asked whether") for
    reporting a yes/no question, across an everyday message (Mihai's
    text message about being late) and a workplace topic (Diana's
    question about the deadline) -- neither requiring the learner to
    reproduce the original speaker's exact words, matching the outcome's
    literal requirement.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-14) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-14). Mihai sends a message saying he will be late (a new,
    non-contradicting one-off event); Diana asks whether there is enough
    time for the report, tying back to the established termenul limită
    (deadline) from b1_unit05/11. Grepped the established character
    profiles before writing: Mihai remains inginer (a1_unit17,
    masculine-only "Sunt inginer"), Ana remains profesoară
    (feminine-only), Diana remains their office colleague
    (b1_unit04/06) -- no profession or biographical fact is contradicted
    here. All genuinely new vocabulary is introduced self-contained
    within this file; no other session's sibling-direction overlay was
    consulted while authoring.
