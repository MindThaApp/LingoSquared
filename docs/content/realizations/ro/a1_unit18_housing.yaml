            prompt: {target_blocks: []}
          - content_key: ro.a1.unit18.lesson01.exercise04.match_housing1
            type: matching_pairs
            tested_text: "casă cameră dormitor bucătărie baie mare ana are o casă mare casa are trei camere"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Casă", right: "house"}
