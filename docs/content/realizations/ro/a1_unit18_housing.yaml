            target: {text: "Ana are o casă mare. Casa are trei camere: un dormitor, o bucătărie și o baie.", language_code: ro, direction: ltr}
            introduced_tokens: [ana, are, o, casă, mare, casa, trei, camere, un, dormitor, bucătărie, și, baie]
        exercises:
          - content_key: ro.a1.unit18.lesson01.exercise01.choose_casa
