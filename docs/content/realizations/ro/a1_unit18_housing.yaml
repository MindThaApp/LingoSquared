          - content_key: ro.a1.unit18.lesson01.teach.are_vocab
            kind: grammar_note
            target: {text: "Are", language_code: ro, direction: ltr}
            introduced_tokens: [are]
          - content_key: ro.a1.unit18.lesson01.teach.casa_vocab
            kind: vocabulary
            target: {text: "Casă", language_code: ro, direction: ltr}
            introduced_tokens: [casă]
            example:
              - {text: "Ana are o casă mare.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit18.lesson01.teach.camera_vocab
