generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-17
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl search "Peace Corps Moldova Basic
    Romanian Language Lessons house rooms apartment"`) but returned HTTP
    402 (0 credits remaining, the same exhausted state every recent ro
    unit has hit), so this unit falls back to a fresh direct `curl` +
    `pdftotext -layout` re-fetch of the confirmed-working PDF (785-line
    extraction, matching every prior unit's own extraction length).
    Grepped the full extracted text for casă/cameră/dormitor/bucătărie/
    baie/apartament/living/balcon/etaj/curte/grădină and found a real,
    directly usable, on-topic hit: "Lesson 15: House Orientation" (a
    dedicated vocabulary-and-pronunciation table), giving casă (house),
    dormitor (bedroom), baie (bathroom), bucătărie (kitchen), cameră
    (room), toaletă (toilet), fereastră (window), the fixed question
    "Unde este baia?" (Where is the bathroom?), and apă rece/apă caldă
    (cold/hot water, not used this unit -- out of this unit's scope,
    which is rooms/objects/quantity/location, not plumbing). unit08's
    own provenance note already recorded checking this exact Lesson 15
    table and deliberately NOT using it there (it's interior-room
    vocabulary, not the common public-places vocabulary
    universal.a1.places.locate_common_places actually needed) -- so
    every one of these words is still genuinely fresh for the course,
    confirmed by grepping every prior ro realization file for casă/
    cameră/dormitor/bucătărie/baie/apartament and finding zero prior
    teaching-card or exercise usage (unit10's own provenance mentions
    checking the same Lesson 15 list purely as an "acasă" cross-check,
    never actually using casă/dormitor/bucătărie/baie as taught
    vocabulary). Separately grepped for apartament/vînz/etaj and found
    one more real, directly usable hit in Lesson 7's "a avea" (to have)
    conjugation table: "Radu are un apartament." (Radu has an
    apartment.) -- giving both the word "apartament" and a live,
    real-sentence attestation of "are" (he/she/it has), the one
    genuinely new verb form this unit introduces (the paradigm's other
    forms -- am, ai, aveți -- are already established from units 02/05).
    "Toaletă" and "apă rece"/"apă caldă" were checked but deliberately
    NOT used -- this unit's own scope (rooms, objects, quantity,
    location per the spine's own can_do text) is adequately covered by
    casă/apartament/cameră/dormitor/bucătărie/baie/fereastră without
    needing a second near-synonym for "bathroom" (baie/toaletă) that
    would only invite exactly the true-synonym fill_in_blank-ambiguity
    problem AUTHORING_GUIDE #17 warns against. "Două" (two, feminine)
    is direct within-course reuse of unit02's already-taught doi/două
    gender pair, applied here to count camere for the first time. "Mea"
    (my, feminine) is direct within-course reuse from unit05's own
    "Mama mea". "Aproape" (near/close by) is direct within-course reuse
    from unit08/unit09, used the exact same way both of those units
    already used it -- as the answer to an "Unde este...?" question,
    avoiding the need to invent any new directional/locative vocabulary
    this outcome's own scope doesn't call for (turn-by-turn directions
    belong to a different, already-realized outcome). "Mare"/"mic" are
    direct within-course reuse from units 05/14. Only genuinely new
    content words this unit introduces: are, casă, cameră/camere,
    dormitor, bucătărie, baie, apartament, fereastră -- everything else
    is confirmed reuse (sourced or within-course). This unit deliberately
    continues the same Ana/Mihai cast established since unit01, giving
    each character a distinct, non-conflicting home: Ana has a big house
    with three rooms, Mihai has a small apartment with two rooms -- a
    new scenario (a home visit), not a repeat of any earlier one.
    Authored at schema_version 1.1 from the start -- every kind:
    vocabulary card carries a real example: sentence with a matching
    overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule,
    extended to the "real content, wrong attribution" edge case --
    confirmed the "How many rooms does Ana's house have?" distractor
    deliberately uses "Patru camere." (said by nobody) rather than the
    tempting "Două camere." (Mihai's real line, about his own
    apartment, elsewhere in the same clip); AUTHORING_GUIDE #11
    cross-lesson fact consistency with unit17's job/workplace facts,
    #17 fill_in_blank ambiguity) against the actual dialogue/exercise
    content and confirm them accurate. Also confirmed no stray YAML
    booleans, matching_pairs/word_order shapes correct, every exercise
    type registered, no jargon leaks, correct and consistent
    diacritics, natural Romanian throughout. No real bugs found; no
    changes made to this unit.

    Eighteenth Romanian unit, first draft, continuing directly from
    unit17. Targets universal.a1.housing.describe_home -- confirmed by
    grepping universal_spine.yaml directly: it's the entry immediately
    following universal.a1.work.describe_job (unit17's own outcome) in
    spine order, its two prerequisites
    (universal.a1.places.locate_common_places and
    universal.a1.numbers.use_basic_numbers) are already satisfied by
    unit08 and unit02 respectively, and its can_do text is "Describe a
    basic home, rooms, household objects, and location." This course's
    own established 3-lesson bootstrap pace and Ana/Mihai characters are
    used, matching units 01-17. 3 lessons, each mapped to a distinct
    spine assessment_requirement: lesson01 (Ana are o casă mare, cu trei
    camere) covers understand_home_description; lesson02 (Mihai are un
    apartament mic, "Unde este baia?") covers describe_home; lesson03
    (a home-visit dialogue between Ana and Mihai, plus a short reading
    profile and a writing prompt) covers read_housing_description and
    write_home_description, and consolidates all four.

    Reuses unit01's bună/ce/mai/faceți/bine/mulțumesc/la/revedere/Ana/
    Mihai, unit02's trei/două, unit05's un/o/și/mare/mea, unit08's
    unde/este/aproape, and unit14's mic -- all re-declared via
    lesson-opening reminder cards per the standing per-file
    token-scoping convention (lesson01 reminds Ana/mare and
    un/o/și/trei; lesson02 reminds Mihai/mic and unde/este/două;
    lesson03 reminds bună/ce/mai/faceți/bine/mulțumesc in one card and
    la/revedere/mea/aproape/am in a second). Within this file, lesson02/
    03 freely reuse lesson01's own are/o/un/și/casă/casa/cameră/camere/
    dormitor/bucătărie/baie without a fresh reminder card, and lesson03
    freely reuses lesson02's own apartament/apartamentul/mic/unde/este/
    două/baia, matching the exact within-file-reuse precedent already
    established by units 09/15/16/17.

    Checked this choice against AUTHORING_GUIDE #11 carefully before
    finalizing. Facts this unit newly states: Ana has a big house with
    three rooms (a bedroom, a kitchen, and a bathroom); Mihai has a
    small apartment with two rooms (a bedroom and a kitchen) and one
    big window -- none of these touch any fact any earlier unit ever
    established (grepped every earlier ro realization file for "casă"/
    "cameră"/"dormitor"/"bucătărie"/"baie"/"apartament"/housing-adjacent
    claims about either character: zero prior hits -- unit08's own
    provenance explicitly recorded checking and declining to use this
    same Lesson 15 vocabulary, and unit10's brief "acasă" cross-check
    against the same source list never actually taught or claimed
    anything about either character's own home). unit17 established
    Mihai works at an office (birou) and Ana works at a school (școală);
    this unit's own new housing claims don't touch either workplace fact
    at all -- Ana's house and Mihai's apartment are both new, additive
    details about where they live, not where they work, and nothing
    here restates or contradicts unit17's own claims. No day/date,
    price, family, preference, comparison, travel, health, or work
    claim from any earlier unit is touched by this unit's own new
    material.

    Checked every fill_in_blank slot's correct answer against
    AUTHORING_GUIDE #17's synonym-ambiguity concern. lesson01's "Casa
    are un ___, o bucătărie și o baie." recalls "dormitor" -- at this
    point in the course (before lesson02 introduces "apartament," the
    only other masculine/neuter noun this unit teaches), "dormitor" is
    the only taught noun that both fits the masculine indefinite article
    "un" and completes a three-item room enumeration whose other two
    members are already given -- no real competing candidate exists
    within lesson01's own taught-so-far vocabulary. lesson02's
    "Apartamentul are ___ camere: un dormitor și o bucătărie." recalls
    "două" -- of the numbers taught so far (unu-douăzeci, treizeci-o
    sută), only "două" both gender-agrees with feminine "camere" and
    matches the literal count of the two items just enumerated (a
    counting/comprehension anchor, the same technique this unit's own
    lesson01 fill_in_blank already used for its three-item enumeration).
    lesson03's "Bine! La ___, Mihai!" recalls "revedere" -- the same
    single fixed collocation with "la" every earlier unit's own closing
    line has already used, no competing candidate exists anywhere in
    the course's taught vocabulary. Deliberately did NOT build a
    fill_in_blank recalling "casă" or "apartament" themselves once both
    are taught (by lesson02/03, both would be live candidates for any
    generic "[Person] are un/o ___" frame with no anchor forcing one
    over the other) -- tested instead via multiple_choice, word_order,
    and listen_order/matching_pairs in their own introducing lesson,
    before the competing noun exists in the taught pool, avoiding the
    ambiguity entirely rather than trying to patch it with a weaker
    anchor.

    Checked the lesson03 dialogue exercises against the standing
    same-speaker-distractor rule: listed every line each speaker
    actually says in the six-line dialogue before writing distractors.
    Mihai's three lines are "Bună, Ana! Ce mai faceți?", "Unde este
    baia?", and "Am un apartament mic. Are două camere. La revedere,
    Ana!". Ana's three lines are "Bine, mulțumesc! Casa mea este mare.
    Are trei camere.", "Baia este aproape.", and "La revedere, Mihai!".
    The dialogue_comprehension exercise asks "How many rooms does Ana's
    house have?" (correct: "Trei camere.") with distractor "Patru
    camere." -- a number nobody says anywhere in this dialogue's audio
    at all, deliberately chosen instead of the tempting "Două camere."
    (which Mihai genuinely says, about his own apartment, elsewhere in
    this same clip) specifically to avoid even the narrower "technically
    real audio content, just attributed to the wrong person" edge case,
    not just the literal same-speaker case the rule names. The
    reading_comprehension exercise (a standalone note, not tied to any
    dialogue audio: "Ana are o casă mare. Casa are trei camere. Mihai
    are un apartament mic. Apartamentul are două camere." -- "How many
    rooms does Mihai's apartment have?", correct "Două camere.",
    distractors "Trei camere."/"Cinci camere.") deliberately uses "Trei
    camere." as one distractor even though it appears in the same note
    -- for a reading exercise (unlike a listening one) the learner can
    re-read the text at leisure, and the note explicitly attributes
    "trei camere" to Ana's house only, so distinguishing the two
    people's stated facts is the actual point of the check, the exact
    same reasoning unit17's own reading_comprehension exercise already
    used for its "Profesoară."/"Doctor." distractors. This exercise has
    no media_asset_key at all (a pure reading text, matching unit15/16/
    17's own reading_comprehension exercise shape), so the same-speaker-
    audio concern doesn't apply to it in the first place. Both
    listen_select clips (lesson01/lesson02) use single-sentence audio,
    not multi-speaker dialogue audio, and their distractors were
    confirmed to be sentences from other, separate audio clips, never
    spoken in that specific clip.

    Second-pass review 2026-10-19: 2 fixes - lesson03.exercise06
    prompt 'Bine! La ___, Mihai!' -> 'La ___, Mihai!' (Ana's goodbye
    in this dialogue has no 'Bine!'); lesson01.exercise08 tested_text
    'casa' -> 'casă'. NATIVE FLAGS: 'Casa are trei camere: un
    dormitor, o bucătărie și o baie' / Mihai's 'două camere: un
    dormitor și o bucătărie' count the kitchen and bathroom as
    'camere', which Romanian housing usage normally does not (camere =
    living rooms/bedrooms) - left unchanged pending a native call,
    since fixing it means rewriting the unit's counting facts.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-17's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    formal register with each other). This unit's own new vocabulary
    (casă, apartament, cameră, dormitor, bucătărie, baie, fereastră) is
    entirely person-invariant in the forms actually taught here -- "Ana
    are..."/"Mihai are..." both use the same third-person "are" with no
    register distinction. No new tu/dumneavoastră form is introduced
    this unit; "Unde este baia?" and "Casa mea este mare" are both
    register-neutral statements/questions, not addressed to a specific
    formality level.

