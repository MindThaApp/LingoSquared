              - {text: "Ana are o cameră mare.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit18.lesson01.teach.camere_plural
            kind: grammar_note
            target: {text: "cameră · camere", language_code: ro, direction: ltr}
            introduced_tokens: [camere]
          - content_key: ro.a1.unit18.lesson01.teach.dormitor_vocab
            kind: vocabulary
            target: {text: "Dormitor", language_code: ro, direction: ltr}
            introduced_tokens: [dormitor]
            example:
              - {text: "Ana are un dormitor.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit18.lesson01.teach.bucatarie_vocab
            kind: vocabulary
            target: {text: "Bucătărie", language_code: ro, direction: ltr}
