        spine_outcome_id: universal.a1.housing.describe_home
        teaching:
          - content_key: ro.a1.unit18.lesson01.teach.reminder_ana_mare
            kind: grammar_note
            target: {text: "Ana · mare", language_code: ro, direction: ltr}
            introduced_tokens: [Ana, mare]
          - content_key: ro.a1.unit18.lesson01.teach.reminder_articole_trei
            kind: grammar_note
            target: {text: "un · o · și · trei", language_code: ro, direction: ltr}
