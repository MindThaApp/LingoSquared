          - content_key: ro.a1.unit18.lesson01.exercise02.choose_dormitor
            type: multiple_choice
            tested_text: "dormitor"
            prompt:
              target_blocks:
                - {text: "bedroom", language_code: en, direction: ltr}
          - content_key: ro.a1.unit18.lesson01.exercise03.listen_ana_are_casa_mare
            type: listen_select
            tested_text: "Ana are o casă mare"
