  dialect: ro_RO_standard
  register_policy: >-
    Continues the established dumneavoastră-default register from ro
    A1/A2/B1 (units 01-26, b1_unit01-08): Ana, Mihai, and Diana address
    each other formally (dumneavoastră) throughout, matching the existing
    corpus-wide office relationship (also matching b1_unit06's precedent
    of Mihai addressing Diana formally).

