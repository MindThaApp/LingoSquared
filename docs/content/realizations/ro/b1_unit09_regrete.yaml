generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's ninth B1 unit, continuing the b1_unit01-08 authoring pass.
    Source-material check redone for this specific topic before authoring:
    the same public-domain source used throughout ro's corpus ("Basic
    Romanian Language Lessons," US Peace Corps Moldova, public domain,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for regret/past-wish markers (ar fi trebuit, aș fi
    vrut, îmi pare rău că nu am, regret) across the full 785-line
    extraction -- zero hits. This source is confirmed (an eighth time,
    on an eighth different B1 topic) to be beginner phrasebook-only with
    no past-hypothetical/regret content. This unit is therefore authored
    fresh from general standard Romanian grammar knowledge, matching
    b1_unit01-08's precedent.

    Teaches the spine outcome's full requirement (universal.b1.
    hypotheticals.express_regret_and_past_wishes): (1) "ar fi trebuit
    să..." ("should have...") -- already introduced in b1_unit01 for an
    unfulfilled obligation, here re-taught with fresh example sentences
    in a genuinely different pragmatic use (personal regret about one's
    own past action, not a stated deadline/obligation) since the
    construction is grammatically identical but the communicative
    function is new; (2) "aș fi vrut să..." ("I would have wanted to.../
    I wish I had...") -- the conditional-perfect wish construction,
    genuinely new for ro, for wishing a past event had gone differently
    rather than naming a missed obligation. Both are conditional-optativ-
    perfect forms (invariant for gender, no participle agreement needed
    on the auxiliary "fi"), verified against a reference grammar before
    writing any accepted answer -- so no feminine first-person variant
    was required for any tested_text in this file. The culminating
    lesson05 exercises require BOTH pieces of the outcome's can_do (what
    actually happened AND what the speaker wishes had happened instead)
    in the same production answer, not just the construction drilled in
    isolation.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-08) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-08). Reuses the traffic/lateness incident from b1_unit06's
    narrative unit as the regret's real-world grounding (Diana was late
    because of traffic, established fact, not contradicted here) --
    Diana now reflects that she should have left earlier and wishes she
    had checked the traffic report first, which is a new reflection
    consistent with, not overwriting, the b1_unit06 narrative's own
    internal timeline (that lesson never resolved whether Diana felt
    regret about it, so this unit is free to add that without
    presupposing an outcome that lesson left open). All genuinely new
    vocabulary is introduced self-contained within this file; no other
    session's sibling-direction overlay was consulted while authoring.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: null

course:
  realization_key: ro.b1
