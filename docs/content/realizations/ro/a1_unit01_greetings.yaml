schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), Lesson 2 "Basic Expressions" and Lesson 3 "Introductions"
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, fetched via curl + pdftotext -layout,
    a real 4201-word extractable text layer, not a scan). This is
    Romanian's first-ever unit for this app -- bootstrapped from scratch,
    with fr/a1_unit01_greetings.yaml as the structural template per the
    standing "closest existing precedent for a brand-new Latin-script
    target language" convention. Real sourced material: the register
    contrast (tu vs. the polite dumneavoastră form used with "faceți"),
    the core greeting/farewell set (Bună, Salut, Bună ziua, La revedere),
    and the name-exchange pair (Cum vă numiți? / Cum te cheamă?, Îmi pare
    bine!). The source is Peace Corps MOLDOVA material and uses the
    pre-1993 Moldovan/Communist-era î-everywhere spelling convention
    (sînt, cîte) rather than the post-1993 standard Romanian orthography
    used in Romania today (sunt, câte) -- every sourced phrase was
    respelled to modern standard Romanian orthography before use, per
    AUTHORING_GUIDE.md #10's "adapt, don't just reference, and never
    import verbatim" rule; this is a spelling modernization, not a
    dialect swap (Moldovan and standard Romanian share the same core
    A1 vocabulary and grammar used here). Freshly authored, not sourced:
    every example: sentence (AUTHORING_GUIDE #19), the "Ana"/"Mihai"
    recurring names used in those examples, lesson03's short reading
    dialogue (a new scenario combining the two lessons' material, not
    copied from the source, which has no equivalent short dialogue),
    and the register_choice cultural note. Authored at schema_version
    1.1 from the start -- every kind:vocabulary card carries a real
    example: sentence with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), covering the full ro A1
    course (units 01-19) as one pass. Unit01 itself checked clean: no
    same-speaker distractor collisions in lesson03's dialogue
    (role_selection/comprehend_register/comprehend_names all ask about
    facts, not verbatim lines the tested speaker also says elsewhere),
    no stray YAML boolean coercion, matching_pairs/word_order answer
    shapes correct (matching_pairs' flat-dict correct_response in the
    overlay matches the compiler's supported shape), every exercise
    type used has a registered ExerciseRenderer case, no jargon leaks,
    diacritics (ă/â/î/ș/ț) used correctly and consistently throughout,
    and the Romanian reads naturally with a consistently-maintained
    tu/dumneavoastră register split. Full corpus-wide compiler
    validation (all 19 ro units + overlays together) is clean: 0
    errors/0 warnings. Two real bugs were found and fixed elsewhere in
    the course (unit02's listen_type_phone tested_text/audio_text
    mismatch, unit08's self-referential "lângă bibliotecă" distractor)
    -- see those units' own review notes for detail; unit01 itself
    needed no changes. First Romanian unit, first draft, scoped to
    exactly the two spine outcomes every other language's unit01 uses
    (universal.a1.greetings.open_close_exchange,
    universal.a1.introductions.exchange_identity), 3 lessons (bootstrap
    size per explicit dispatch instruction, not the fuller 6-lesson
    fr/es shape).

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Teach standard Romanian as spoken in Romania. Present dumneavoastră
    as the safe default with unfamiliar adults and tu for friends,
    children, and explicitly informal settings -- the same tu/polite-you
    contrast English speakers need help with in French or Spanish, here
    realized with dumneavoastră instead of a second singular-only
    pronoun. Teach neutral standard pronunciation without regional
    (Moldovan, Transylvanian, Oltenian) markers.

