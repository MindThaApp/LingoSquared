generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's tenth B1 unit, continuing the b1_unit01-09 authoring pass.
    Source-material check redone for this specific topic before authoring:
    the same public-domain source used throughout ro's corpus ("Basic
    Romanian Language Lessons," US Peace Corps Moldova, public domain,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for future-plan/intention/prediction markers (am de
    gând, intenționez, probabil, sigur, voi) across the full 785-line
    extraction -- only "probabil" and the bare future "voi" auxiliary
    turned up (both already taught: "probabil" in b1_unit03, "voi
    verifica" in b1_unit09), no dedicated plans/intentions material. This
    unit is therefore authored fresh from general standard Romanian
    grammar knowledge, matching b1_unit01-09's precedent, while reusing
    the two already-established cumulative tokens rather than re-teaching
    them.

    Teaches the spine outcome's full requirement (universal.b1.future.
    describe_plans_intentions_and_predictions): distinguishing three
    degrees of future certainty in Romanian -- (1) "voi + infinitive-base"
    (simple future, already introduced b1_unit09 for a firm future
    intention -- re-taught here for a genuinely different pragmatic use,
    a FIXED prior arrangement/plan, e.g. a scheduled meeting) that
    contrasts with (2) "am de gând să" ("I intend to/I'm planning to" --
    genuinely new, an intention not yet fixed as an arrangement) and (3)
    "probabil" + prezent/viitor ("probably" -- reusing the already-taught
    discourse marker from b1_unit03, here combined with the future tense
    specifically for uncertain predictions, a new combination). The
    culminating lesson05 exercises require the learner to produce all
    three certainty levels about a single topic (Mihai's weekend) in one
    answer, matching the outcome's literal "distinguish fixed
    arrangements, intentions, and probable or uncertain predictions"
    requirement -- not just drilling one construction in isolation.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-09) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-09) for the office-meeting frame in lessons01-04; lesson05's
    wrap-up keeps the same formal register applied to a new topic (Mihai's
    weekend plans) to avoid presupposing informal-register content this
    corpus has not established. Grepped the established character
    profiles before writing: Mihai remains inginer (a1_unit17, masculine-
    only "Sunt inginer"), Ana remains profesoară (feminine-only), Diana
    remains their office colleague (b1_unit04/06) -- no profession or
    biographical fact is contradicted here. All genuinely new vocabulary
    is introduced self-contained within this file; no other session's
    sibling-direction overlay was consulted while authoring.
  human_reviewed: true
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second-pass review 2026-10-19: 0 fixes.

