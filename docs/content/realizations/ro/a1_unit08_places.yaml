          - content_key: ro.a1.unit08.lesson03.exercise04.match_unit_review
            type: matching_pairs
            tested_text: "gară magazin bancă spital poștă bibliotecă stație de autobuz aproape departe lângă vizavi de între"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Gară", right: "train station"}
              - {left: "Magazin", right: "store"}
              - {left: "Bancă", right: "bank"}
              - {left: "Spital", right: "hospital"}
              - {left: "Poștă", right: "post office"}
              - {left: "Bibliotecă", right: "library"}
              - {left: "Stație de autobuz", right: "bus stop"}
              - {left: "Aproape", right: "close / near"}
              - {left: "Departe", right: "far"}
              - {left: "Lângă", right: "next to"}
          - content_key: ro.a1.unit08.lesson03.exercise05.order_biblioteca_aproape_gara
            type: word_order
            tested_text: "Biblioteca este aproape de gară"
            prompt: {target_blocks: []}
            word_bank: ["Biblioteca", "este", "aproape", "de", "gară"]
          - content_key: ro.a1.unit08.lesson03.exercise06.complete_spitalul
            type: fill_in_blank
            tested_text: "vizavi"
            prompt:
              target_blocks:
                - {text: "Spitalul este ___ de magazin.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit08.lesson03.exercise07.respond_as_mihai
            type: dialogue_response
            tested_text: "poșta este între magazin și spital"
            prompt:
