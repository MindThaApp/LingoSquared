  - content_key: ro.a1.audio.places.magazinul_aproape.01
    language: ro
    text: "Magazinul este aproape."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.places.unde_este_gara.01
    language: ro
    text: "Unde este gara?"
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.places.spitalul_vizavi_magazin.01
    language: ro
    text: "Spitalul este vizavi de magazin."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.places.posta_intre.01
    language: ro
    text: "Poșta este între magazin și spital."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: ro.a1.audio.dialogue.cartier.01
    language: ro
    text: "Ana: Bună, Mihai! Unde este poșta?\nMihai: Poșta este între magazin și spital.\nAna: Bine. Și biblioteca? Este aproape?\nMihai: Da, biblioteca este aproape de gară. Stația de autobuz este lângă bibliotecă.\nAna: Mulțumesc, Mihai! La revedere!\nMihai: La revedere, Ana!"
    voice_hint: adult_female_and_male_neutral_polite
    status: pending_generation

units:
  - content_key: ro.a1.unit08.places
    title: "Locuri în cartier"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.places.locate_common_places
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit08.lesson01.unde_este
        title: "Unde este...?"
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - content_key: ro.a1.unit08.lesson01.teach.reminder_unde_este
            kind: grammar_note
            target: {text: "unde · este", language_code: ro, direction: ltr}
            introduced_tokens: [unde, este]
          - content_key: ro.a1.unit08.lesson01.teach.unde_este_phrase
            kind: phrase
            target: {text: "Unde este...?", language_code: ro, direction: ltr}
            introduced_tokens: [unde, este]
          - content_key: ro.a1.unit08.lesson01.teach.gara_magazin_banca
            kind: vocabulary
            target: {text: "Gară, magazin, bancă", language_code: ro, direction: ltr}
            introduced_tokens: [gară, magazin, bancă]
            example:
              - {text: "Unde este gara?", language_code: ro, direction: ltr}
              - {text: "Magazinul este aproape.", language_code: ro, direction: ltr}
              - {text: "Banca este departe.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit08.lesson01.teach.aproape_departe
            kind: vocabulary
            target: {text: "Aproape, departe", language_code: ro, direction: ltr}
            introduced_tokens: [aproape, departe]
            example:
              - {text: "Magazinul este aproape.", language_code: ro, direction: ltr}
              - {text: "Banca este departe.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit08.lesson01.teach.magazinul_aproape
            kind: phrase
            target: {text: "Magazinul este aproape.", language_code: ro, direction: ltr}
            introduced_tokens: [magazinul, este, aproape]
          - content_key: ro.a1.unit08.lesson01.teach.banca_departe
            kind: phrase
            target: {text: "Banca este departe.", language_code: ro, direction: ltr}
            introduced_tokens: [banca, este, departe]
          - content_key: ro.a1.unit08.lesson01.teach.unde_este_gara
            kind: phrase
            target: {text: "Unde este gara?", language_code: ro, direction: ltr}
            introduced_tokens: [unde, este, gara]
        exercises:
          - content_key: ro.a1.unit08.lesson01.exercise01.choose_unde_este
            type: multiple_choice
            tested_text: "unde este"
            prompt:
              target_blocks:
                - {text: "Where is...?", language_code: en, direction: ltr}
          - content_key: ro.a1.unit08.lesson01.exercise02.choose_aproape
            type: multiple_choice
            tested_text: "aproape"
            prompt:
              target_blocks:
                - {text: "close / near", language_code: en, direction: ltr}
          - content_key: ro.a1.unit08.lesson01.exercise03.listen_magazinul_aproape
            type: listen_select
            tested_text: "Magazinul este aproape"
            media_asset_key: ro.a1.audio.places.magazinul_aproape.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit08.lesson01.exercise04.match_locuri
            type: matching_pairs
            tested_text: "gară magazin bancă aproape departe unde este"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Gară", right: "train station"}
              - {left: "Magazin", right: "store"}
              - {left: "Bancă", right: "bank"}
              - {left: "Aproape", right: "close / near"}
              - {left: "Departe", right: "far"}
              - {left: "Unde este...?", right: "Where is...?"}
          - content_key: ro.a1.unit08.lesson01.exercise05.order_banca_departe
            type: word_order
            tested_text: "Banca este departe"
            prompt: {target_blocks: []}
            word_bank: ["Banca", "este", "departe"]
          - content_key: ro.a1.unit08.lesson01.exercise06.listen_order_unde_este_gara
            type: listen_order
            tested_text: "Unde este gara"
            media_asset_key: ro.a1.audio.places.unde_este_gara.01
            prompt: {target_blocks: []}
            word_bank: ["este", "Unde", "gara"]
          - content_key: ro.a1.unit08.lesson01.exercise07.complete_magazinul
            type: fill_in_blank
            tested_text: "aproape"
            prompt:
              target_blocks:
                - {text: "Magazinul este ___.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit08.lesson01.exercise08.speak_unde_este_banca
            type: speak_response
            tested_text: "unde este banca"
            prompt:
              target_blocks:
                - {text: "Say: Where is the bank?", language_code: en, direction: ltr}

      - content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
        title: "Lângă, vizavi de, între"
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - content_key: ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie
            kind: vocabulary
            target: {text: "Spital, poștă, bibliotecă, stație de autobuz", language_code: ro, direction: ltr}
            introduced_tokens: [spital, poștă, bibliotecă, biblioteca, stație, de, autobuz]
            example:
              - {text: "Spitalul este vizavi de magazin.", language_code: ro, direction: ltr}
              - {text: "Poșta este între magazin și spital.", language_code: ro, direction: ltr}
              - {text: "Biblioteca este aproape de gară.", language_code: ro, direction: ltr}
              - {text: "Stația de autobuz este lângă bibliotecă.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit08.lesson02.teach.langa_vizavi_intre
            kind: vocabulary
            target: {text: "Lângă, vizavi de, între", language_code: ro, direction: ltr}
            introduced_tokens: [lângă, vizavi, între]
            example:
              - {text: "Magazinul este lângă gară.", language_code: ro, direction: ltr}
              - {text: "Spitalul este vizavi de magazin.", language_code: ro, direction: ltr}
              - {text: "Poșta este între magazin și spital.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit08.lesson02.teach.magazinul_langa_gara
            kind: phrase
            target: {text: "Magazinul este lângă gară.", language_code: ro, direction: ltr}
            introduced_tokens: [magazinul, este, lângă, gară]
          - content_key: ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin
            kind: phrase
            target: {text: "Spitalul este vizavi de magazin.", language_code: ro, direction: ltr}
            introduced_tokens: [spitalul, este, vizavi, de, magazin]
          - content_key: ro.a1.unit08.lesson02.teach.posta_intre
            kind: phrase
            target: {text: "Poșta este între magazin și spital.", language_code: ro, direction: ltr}
            introduced_tokens: [poșta, este, între, magazin, și, spital]
          - content_key: ro.a1.unit08.lesson02.teach.statia_langa_biblioteca
            kind: phrase
            target: {text: "Stația de autobuz este lângă bibliotecă.", language_code: ro, direction: ltr}
            introduced_tokens: [stația, de, autobuz, este, lângă, bibliotecă]
        exercises:
          - content_key: ro.a1.unit08.lesson02.exercise01.choose_langa
            type: multiple_choice
            tested_text: "lângă"
            prompt:
              target_blocks:
                - {text: "next to", language_code: en, direction: ltr}
          - content_key: ro.a1.unit08.lesson02.exercise02.choose_vizavi
            type: multiple_choice
            tested_text: "vizavi de"
            prompt:
              target_blocks:
                - {text: "opposite / across from", language_code: en, direction: ltr}
          - content_key: ro.a1.unit08.lesson02.exercise03.listen_spitalul_vizavi_magazin
            type: listen_select
            tested_text: "Spitalul este vizavi de magazin"
            media_asset_key: ro.a1.audio.places.spitalul_vizavi_magazin.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit08.lesson02.exercise04.match_locuri2
            type: matching_pairs
            tested_text: "spital poștă bibliotecă stație de autobuz lângă vizavi de între"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Spital", right: "hospital"}
              - {left: "Poștă", right: "post office"}
              - {left: "Bibliotecă", right: "library"}
              - {left: "Stație de autobuz", right: "bus stop"}
              - {left: "Lângă", right: "next to"}
              - {left: "Vizavi de", right: "opposite / across from"}
              - {left: "Între", right: "between"}
          - content_key: ro.a1.unit08.lesson02.exercise05.order_magazinul_langa_gara
            type: word_order
            tested_text: "Magazinul este lângă gară"
            prompt: {target_blocks: []}
            word_bank: ["Magazinul", "este", "lângă", "gară"]
          - content_key: ro.a1.unit08.lesson02.exercise06.listen_order_posta_intre
            type: listen_order
            tested_text: "Poșta este între magazin și spital"
            media_asset_key: ro.a1.audio.places.posta_intre.01
            prompt: {target_blocks: []}
            word_bank: ["între", "Poșta", "este", "magazin", "și", "spital"]
          - content_key: ro.a1.unit08.lesson02.exercise07.complete_statia
            type: fill_in_blank
            tested_text: "lângă"
            prompt:
              target_blocks:
                - {text: "Stația de autobuz este ___ bibliotecă.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit08.lesson02.exercise08.speak_unde_este_posta
            type: speak_response
            tested_text: "unde este poșta"
            prompt:
              target_blocks:
                - {text: "Say: Where is the post office?", language_code: en, direction: ltr}

      - content_key: ro.a1.unit08.lesson03.in_cartier
        title: "În cartier"
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - content_key: ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da
            kind: grammar_note
            target: {text: "bună · mulțumesc · la revedere · da · Ana · Mihai", language_code: ro, direction: ltr}
            introduced_tokens: [bună, mulțumesc, la, revedere, da, Ana, Mihai]
          - content_key: ro.a1.unit08.lesson03.teach.line01
            kind: dialogue
            target:
              text: "Bună, Mihai! Unde este poșta?"
              language_code: ro
              direction: ltr
              speaker: Ana
            introduced_tokens: []
          - content_key: ro.a1.unit08.lesson03.teach.line02
            kind: dialogue
            target:
              text: "Poșta este între magazin și spital."
              language_code: ro
              direction: ltr
              speaker: Mihai
            introduced_tokens: []
          - content_key: ro.a1.unit08.lesson03.teach.line03
            kind: dialogue
            target:
              text: "Bine. Și biblioteca? Este aproape?"
              language_code: ro
              direction: ltr
              speaker: Ana
            introduced_tokens: []
          - content_key: ro.a1.unit08.lesson03.teach.line04
            kind: dialogue
            target:
              text: "Da, biblioteca este aproape de gară. Stația de autobuz este lângă bibliotecă."
              language_code: ro
              direction: ltr
              speaker: Mihai
            introduced_tokens: []
          - content_key: ro.a1.unit08.lesson03.teach.line05
            kind: dialogue
            target:
              text: "Mulțumesc, Mihai! La revedere!"
              language_code: ro
              direction: ltr
