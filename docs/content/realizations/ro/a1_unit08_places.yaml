          - content_key: ro.a1.unit08.lesson03.exercise02.dialogue_comprehend_cartier
            type: dialogue_comprehension
            tested_text: "aproape de gară"
            media_asset_key: ro.a1.audio.dialogue.cartier.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit08.lesson03.exercise03.reading_comprehend_posta
            type: reading_comprehension
            tested_text: "între magazin și spital"
            prompt:
              target_blocks:
