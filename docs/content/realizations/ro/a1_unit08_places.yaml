            introduced_tokens: []
          - content_key: ro.a1.unit08.lesson03.teach.line06
            kind: dialogue
            target:
              text: "La revedere, Ana!"
              language_code: ro
              direction: ltr
              speaker: Mihai
            introduced_tokens: []
        exercises:
          - content_key: ro.a1.unit08.lesson03.exercise01.choose_who_says_intre
            type: multiple_choice
            tested_text: "Mihai"
            prompt:
              target_blocks:
