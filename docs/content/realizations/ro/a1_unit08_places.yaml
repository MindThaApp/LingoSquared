schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-07
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- the same real extractable text
    layer, not a scan). Lesson 4 "Some Basic Questions and Answers"
    has real, directly usable location material: "Unde este Internet
    Cafe?" (Where is the Internet Café?), the bare "Unde?" (Where?)
    question word (already introduced in unit07's "Unde pot să cumpăr
    ...?"), and a real, minimal-pair location-status exchange --
    "Hotelul este aproape." (The hotel is close.) / "Restaurantul este
    departe." (The restaurant is far.) -- used here as the sourced
    anchors for this unit's core "Unde este ...?" question (lesson01)
    and its aproape/departe (close/far) vocabulary pair, generalized
    from "Hotelul"/"Restaurantul" to this unit's own place nouns
    (Magazinul este aproape. / Banca este departe.). Lesson 4's "la
    dreapta"/"la stînga" (to the right/left) and "Mergeți înainte" (Go
    straight) were checked but deliberately NOT used here -- those are
    turn-by-turn navigation, which belongs to
    universal.a1.directions.ask_follow_basic_directions (this unit's
    own spine successor, not yet authored), not to
    universal.a1.places.locate_common_places's narrower "identify and
    state the location of" scope. Lesson 15 "House Orientation" was
    also checked (grepped for casă/dormitor/baie/bucătărie and every
    other room word) and found to be interior-room vocabulary (bedroom,
    kitchen, bathroom), not the common public places/facilities this
    outcome actually calls for -- not used. No sourced material exists
    for "next to," "opposite," "between," or any of the specific
    facility nouns this unit needs (grepped the full extracted text for
    lângă/vizavi/între/magazin/spital/bancă/poștă/bibliotecă/gară/
    stație, confirmed zero real hits beyond the two already-used
    Lesson-4 anchors and one incidental "bancă" in an unrelated word
    list on the last page) -- honestly authored fresh per
    AUTHORING_GUIDE #10's "if the source doesn't cover the topic
    adequately, author fresh": gară, magazin, bancă, spital, poștă,
    bibliotecă, and stație de autobuz (the seven common-place nouns);
    lângă, vizavi de, and între (the three prepositions, deliberately
    scoped to ones that take a bare/accusative complement with no
    genitive case-marking, since "în fața"/"în spatele" would require
    genitive noun forms this A1 unit doesn't teach); every vocabulary
    example: sentence (AUTHORING_GUIDE #19); and lesson03's closing
    Ana/Mihai neighborhood dialogue, a new scenario continuing the
    recurring characters, reusing only this unit's own vocabulary plus
    the reminder-declared bună/mulțumesc/la revedere/da/Ana/Mihai from
    earlier units, per the standing "untaught vocabulary must be
    re-declared per-file" convention. All of this unit's location
    facts (magazin lângă gară; spital vizavi de magazin; poșta între
    magazin și spital; bibliotecă aproape de gară; stație de autobuz
    lângă bibliotecă; bancă departe de gară) form one single consistent
    neighborhood map, checked against every lesson and exercise in this
    unit per AUTHORING_GUIDE #11 -- no lesson or exercise states a
    conflicting location for the same place. Authored at schema_version
    1.1 from the start -- every kind:vocabulary card carries a real
    example: sentence with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19). Found and fixed ONE real quality bug
    (in the paired overlay, not this realization file): lesson03's
    dialogue_comprehend_cartier exercise ("Listen to the dialogue.
    Where is the library?") had a self-referential distractor, "lângă
    bibliotecă" (near the library) -- nonsensical as an answer to
    "where is the library" (a place cannot be "near itself"), even
    though it's not the exact bug class the same-speaker-distractor
    rule targets (it's not genuinely ambiguous/secretly-correct, just a
    weak/confusing wrong option). Fixed in the overlay by changing that
    distractor to "lângă magazin" (near the store) -- a real place from
    the same dialogue, genuinely NOT where the library is per this
    unit's own established neighborhood map (magazin lângă gară;
    spital vizavi de magazin; poșta între magazin și spital; biblioteca
    aproape de gară; stație de autobuz lângă bibliotecă), so still a
    valid, unambiguous wrong answer. Everything else in this
    realization file checked clean: no other same-speaker distractor
    collisions, no stray YAML booleans, matching_pairs/word_order
    shapes correct, every exercise type registered, no jargon leaks,
    correct and consistent diacritics, natural Romanian throughout, and
    the unit's own single consistent neighborhood-facts map (documented
    in this file's own provenance note) holds up under a fresh check.
    Eighth Romanian unit, first draft, continuing directly from unit07.
    Targets universal.a1.places.locate_common_places, the spine outcome
    immediately following universal.a1.shopping.ask_prices_quantities in
    universal_spine.yaml's own order -- confirmed by grepping
    universal_spine.yaml directly (shopping -> places -> directions in
    that order) and cross-checked against nl's own unit08
    (a1_unit08_places.yaml, same topic and the same position in nl's
    spine-order sequence as this unit is in ro's) for topic/scope
    confirmation only -- nl's own fuller 6-lesson shape was read but NOT
    followed; this course's own established 3-lesson bootstrap pace and
    Ana/Mihai characters are used instead, matching units 01-07. 3
    lessons. Deliberately scoped to the core "Unde este ...?" location
    question plus aproape/departe (close/far) and three starter place
    nouns -- gară, magazin, bancă (lesson01); three more place nouns --
    spital, poștă, bibliotecă, stație de autobuz -- plus the lângă/
    vizavi de/între prepositions (lesson02); and a pure-recap
    neighborhood dialogue (lesson03) -- explicitly does NOT cover
    turn-by-turn directions (la dreapta/la stânga/drept înainte -- that
    is universal.a1.directions.ask_follow_basic_directions, this unit's
    own spine successor) or "în fața"/"în spatele" (would require
    genitive noun forms not yet taught), a real scope trim to keep this
    bootstrap unit to 3 lessons and to A1-appropriate grammar. Reuses
    this file's own lesson01 vocabulary (gară, magazin, bancă, aproape,
    departe, unde este, este) directly in lesson02/03 without a fresh
    reminder, since that's within-file reuse, not cross-file -- but DOES
    re-declare "unde" (from unit07) and "este" (from unit03/unit04) via
    a lesson01 reminder card, and "bună/mulțumesc/la revedere/da/Ana/
    Mihai" (from unit01/unit05/unit06/unit07) via a lesson03 reminder
    card, before any exercise tests them, per the standing per-file
    token-scoping convention. Lesson03's dialogue deliberately introduces
    zero brand-new vocabulary in its six lines (all reuse only tokens
    already taught earlier in this same unit or re-declared from an
    earlier unit), the same pure-recap style unit01's/unit04's/unit05's/
    unit06's/unit07's own lesson03s used, and closes with "Mulțumesc,
    Mihai! La revedere!" / "La revedere, Ana!" as a direct callback to
    those units' own established closing pattern. Needs a fresh-context
    content review before import, same as every other language's
    content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-07's register split. This unit's core sentences use
    only the invariant third-person "este" (is), which does not change
    with tu or dumneavoastră (same note already established in unit03/
    unit04), so no new register-sensitive forms are introduced. Ana and
    Mihai's closing neighborhood dialogue keeps their existing polite
    register intact, matching unit06/unit07.

