    language: ro
    text: >-
      Mihai: Am citit ambele recenzii despre restaurant. Ana afirmă că
      mâncarea este excelentă. Ana: Da, iar prețul este accesibil.
      Mihai: Diana consideră la fel despre mâncare, dar spune că
      serviciul este lent. Ana: Deci suntem de acord despre mâncare.
      Mihai: Da, dar în privința prețului, dumneavoastră și Diana vă
      contraziceți.
    voice_hint: two_adults_formal_neutral
    status: pending_generation

units:
  - content_key: ro.b2.unit08.sinteza
    title: "Sinteză"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    planned_lesson_count: 6

    lessons:
      - content_key: ro.b2.unit08.lesson01.cine_spune_ce
        title: "Cine spune ce?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: ro.b2.unit08.lesson01.teach.recenzia
            kind: vocabulary
            target: {text: "recenzia", language_code: ro, direction: ltr}
            introduced_tokens: [recenzia, recenzie]
            example: {text: "Ana scrie o recenzie.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson01.teach.sursa
            kind: vocabulary
            target: {text: "sursa", language_code: ro, direction: ltr}
            introduced_tokens: [sursa, sursă]
            example: {text: "Sursa este clară.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson01.teach.afirma
            kind: vocabulary
            target: {text: "afirmă", language_code: ro, direction: ltr}
            introduced_tokens: [afirmă]
            example: {text: "Ana afirmă că este bine.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson01.teach.considera
            kind: vocabulary
            target: {text: "consideră", language_code: ro, direction: ltr}
            introduced_tokens: [consideră]
            example: {text: "Diana consideră că este scump.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson01.teach.reiese_ca
            kind: phrase
            target: {text: "reiese că...", language_code: ro, direction: ltr}
            introduced_tokens: [reiese, că]
          - content_key: ro.b2.unit08.lesson01.teach.pretul
            kind: vocabulary
            target: {text: "prețul", language_code: ro, direction: ltr}
            introduced_tokens: [prețul, preț]
            example: {text: "Prețul este bun.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson01.teach.excelenta
            kind: vocabulary
            target: {text: "excelentă", language_code: ro, direction: ltr}
            introduced_tokens: [excelentă, excelent]
            example: {text: "Mâncarea este excelentă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson01.teach.grammar_attributeren
            kind: grammar_note
            target: {text: "Ana afirmă că mâncarea este excelentă. Diana consideră că prețul este mare. Din recenzii reiese că restaurantul este bun.", language_code: ro, direction: ltr}
            introduced_tokens: [mâncarea, mare, din, recenzii, restaurantul, bun]
        exercises:
          - content_key: ro.b2.unit08.lesson01.exercise01.recognize_afirma
            type: multiple_choice
            tested_text: "afirmă"
            prompt: {target_blocks: [{text: afirmă, language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson01.exercise02.listen_ana_afirma
            type: listen_select
            tested_text: "Ana afirmă că mâncarea este excelentă"
            media_asset_key: ro.b2.audio.sinteza.ana_afirma.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit08.lesson01.exercise03.match_attribution_words
            type: matching_pairs
            tested_text: "recenzia sursa afirmă consideră reiese că prețul excelentă"
            prompt: {target_blocks: []}
            pairs:
              - {left: recenzia, right: "the review"}
              - {left: sursa, right: "the source"}
              - {left: afirmă, right: "states / asserts"}
              - {left: consideră, right: "considers / finds"}
              - {left: "reiese că...", right: "it emerges that..."}
              - {left: prețul, right: "the price"}
              - {left: excelentă, right: excellent}
          - content_key: ro.b2.unit08.lesson01.exercise04.order_ana_afirma
            type: word_order
            tested_text: "Ana afirmă că mâncarea este excelentă"
            prompt: {target_blocks: []}
            word_bank: [Ana, afirmă, că, mâncarea, este, excelentă]
          - content_key: ro.b2.unit08.lesson01.exercise05.translate_considera
            type: translation
            tested_text: "Diana consideră că prețul este mare"
            prompt: {target_blocks: [{text: "Translate into Romanian, using consideră: Diana considers that the price is high.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson01.exercise06.speak_ana_afirma
            type: speak_response
            tested_text: "Ana afirmă că mâncarea este excelentă"
            prompt: {target_blocks: [{text: "Say aloud in Romanian, using afirmă: Ana states that the food is excellent.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson01.exercise07.write_reiese
            type: writing_prompt
            tested_text: "Din recenzii reiese că restaurantul este bun"
            prompt: {target_blocks: [{text: "Write in Romanian, using reiese că: From the reviews it emerges that the restaurant is good.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson01.exercise08.dictation_ana_afirma
            type: dictation
            tested_text: "Ana afirmă că mâncarea este excelentă"
            media_asset_key: ro.b2.audio.sinteza.ana_afirma.01
            prompt: {target_blocks: []}

      - content_key: ro.b2.unit08.lesson02.doua_surse
        title: "Două surse, față în față"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: ro.b2.unit08.lesson02.teach.ambele
            kind: vocabulary
            target: {text: "ambele", language_code: ro, direction: ltr}
            introduced_tokens: [ambele]
            example: {text: "Ambele recenzii sunt pozitive.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson02.teach.pozitiv_negativ
            kind: vocabulary
            target: {text: "pozitiv / negativ", language_code: ro, direction: ltr}
            introduced_tokens: [pozitiv, pozitivă, pozitive, negativ, negativă]
            example: {text: "Recenzia este pozitivă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson02.teach.serviciul
            kind: vocabulary
            target: {text: "serviciul", language_code: ro, direction: ltr}
            introduced_tokens: [serviciul, serviciu]
            example: {text: "Serviciul este lent.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson02.teach.pe_cand
            kind: vocabulary
            target: {text: "pe când", language_code: ro, direction: ltr}
            introduced_tokens: [pe, când]
            example: {text: "Ana este mulțumită, pe când Diana nu este.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson02.teach.dimpotriva
            kind: vocabulary
            target: {text: "dimpotrivă", language_code: ro, direction: ltr}
            introduced_tokens: [dimpotrivă]
            example: {text: "Nu este scump, dimpotrivă, este accesibil.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson02.teach.spre_deosebire_de
            kind: phrase
            target: {text: "spre deosebire de...", language_code: ro, direction: ltr}
            introduced_tokens: [spre, deosebire, de]
          - content_key: ro.b2.unit08.lesson02.teach.grammar_comparatie
            kind: grammar_note
            target: {text: "Ana este pozitivă, pe când Diana este negativă despre serviciu. Spre deosebire de Ana, Diana consideră prețul mare.", language_code: ro, direction: ltr}
            introduced_tokens: [este, despre, consideră]
        exercises:
          - content_key: ro.b2.unit08.lesson02.exercise01.recognize_pe_cand
            type: multiple_choice
            tested_text: "pe când"
            prompt: {target_blocks: [{text: "pe când", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson02.exercise02.listen_pe_cand
            type: listen_select
            tested_text: "Ana este pozitivă, pe când Diana este negativă despre serviciu"
            media_asset_key: ro.b2.audio.sinteza.pe_cand.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit08.lesson02.exercise03.match_comparison_words
            type: matching_pairs
            tested_text: "ambele pozitiv negativ serviciul pe când dimpotrivă spre deosebire de"
            prompt: {target_blocks: []}
            pairs:
              - {left: ambele, right: both}
              - {left: pozitiv, right: positive}
              - {left: negativ, right: negative}
              - {left: serviciul, right: "the service"}
              - {left: "pe când", right: whereas}
              - {left: dimpotrivă, right: "on the contrary"}
              - {left: "spre deosebire de...", right: "unlike... / in contrast to..."}
          - content_key: ro.b2.unit08.lesson02.exercise04.order_pe_cand
            type: word_order
            tested_text: "Ana este pozitivă pe când Diana este negativă"
            prompt: {target_blocks: []}
            word_bank: [Ana, este, pozitivă, pe, când, Diana, este, negativă]
          - content_key: ro.b2.unit08.lesson02.exercise05.translate_pe_cand
            type: translation
            tested_text: "Ana este pozitivă, pe când Diana este negativă despre serviciu"
            prompt: {target_blocks: [{text: "Translate into Romanian, using pe când: Ana is positive, whereas Diana is negative about the service.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson02.exercise06.translate_spre_deosebire
            type: translation
            tested_text: "Spre deosebire de Ana, Diana consideră prețul mare"
            prompt: {target_blocks: [{text: "Translate into Romanian, using spre deosebire de: Unlike Ana, Diana considers the price high.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson02.exercise07.write_ambele_pozitive
            type: writing_prompt
            tested_text: "Ambele recenzii sunt pozitive"
            prompt: {target_blocks: [{text: "Write in Romanian: Both reviews are positive.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson02.exercise08.dictation_pe_cand
            type: listen_type
            tested_text: "Ana este pozitivă, pe când Diana este negativă despre serviciu"
            media_asset_key: ro.b2.audio.sinteza.pe_cand.01
            prompt: {target_blocks: []}

      - content_key: ro.b2.unit08.lesson03.unde_sunt_de_acord
        title: "Unde sunt de acord?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: ro.b2.unit08.lesson03.teach.sunt_de_acord_ca
