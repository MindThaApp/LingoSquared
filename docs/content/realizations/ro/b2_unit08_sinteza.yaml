          - content_key: ro.b2.unit08.lesson03.exercise05.translate_sunt_de_acord
            type: translation
            tested_text: "Ana și Diana sunt de acord că mâncarea este excelentă"
            prompt: {target_blocks: [{text: "Translate into Romanian, using sunt de acord că: Ana and Diana agree that the food is excellent.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson03.exercise06.speak_amandoua
            type: speak_response
            tested_text: "Amândouă cred la fel despre mâncare"
            prompt: {target_blocks: [{text: "Say aloud in Romanian, using amândouă and la fel: Both think the same about the food.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit08.lesson03.exercise07.write_sunt_de_acord
            type: writing_prompt
            tested_text: "Ana și Diana sunt de acord că mâncarea este excelentă"
