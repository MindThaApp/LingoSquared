            prompt: {target_blocks: []}
          - content_key: ro.b2.unit08.lesson03.exercise03.match_agreement_words
            type: matching_pairs
            tested_text: "sunt de acord că părerea la fel amândouă recenzia excelentă"
            prompt: {target_blocks: []}
            pairs:
