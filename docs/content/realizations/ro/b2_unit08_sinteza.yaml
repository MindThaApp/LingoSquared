          - content_key: ro.b2.unit08.lesson03.teach.parerea
            kind: vocabulary
            target: {text: "părerea", language_code: ro, direction: ltr}
            introduced_tokens: [părerea, părere]
            example: {text: "Părerea Anei este clară.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit08.lesson03.teach.la_fel
            kind: vocabulary
            target: {text: "la fel", language_code: ro, direction: ltr}
