      - content_key: ro.b2.unit08.lesson04.unde_se_contrazic
        title: "Unde se contrazic?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: ro.b2.unit08.lesson04.teach.difera
