schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's
    eighth B2 unit (synthesis -- combining and evaluating multiple
    sources), completing the 8-unit tier. Built from general Romanian
    grammar/discourse knowledge, the same from-scratch disclosure the nl
    B2 lane set. Sibling isolation honored: the ro-en B2 synthesis
    realization and every other language's B2 file were treated as
    non-existent and were not opened; the nl B2 exemplar
    (b2_unit08_synthese.yaml) informed structure only (lesson pacing:
    attribution -> comparing two sources -> agreement -> conflict ->
    reading two reviews -> dialogue), never text -- the scenario (Ana and
    Diana each review the same new restaurant) was chosen fresh, and
    every Romanian sentence and content_key was composed from scratch,
    using Romanian's own attribution/comparison vocabulary (afirmă,
    consideră, pe când, spre deosebire de), not translations of Dutch
    volgens/beweren/terwijl/daarentegen. Character canon: continues Ana
    (established profesoară) and Diana (established colleague of Mihai's,
    b1_unit02_abilities.yaml) as the two reviewers, and Mihai as the
    synthesizer comparing their two reviews in lesson06 -- all three
    keep their established formal dumneavoastră register. No
    sibling-direction file (ro-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority
    checks for the reviewer: (1) naturalness of "pe când" as a
    contrastive "whereas" distinct from unit04's temporal "în timp ce" --
    confirm the semantic split this unit's grammar note draws is
    accurate; (2) "afirmă" vs "consideră" vs "susține" as attribution
    verbs -- confirm they carry the shades of meaning (states/asserts vs
    finds/considers vs maintains/claims) the overlay glosses them with;
    (3) "se contrazic" (reflexive-reciprocal, they contradict EACH
    OTHER) -- confirm this is the natural construction rather than a
    transitive one; (4) "spre deosebire de Ana" word order -- confirm
    this fronted contrastive phrase is natural; (5) confirm "accesibil"
    (affordable) and "lent" (slow) read as current everyday Romanian in
    a restaurant-review register.
  notes: >-
    Eighth Romanian B2 unit; first synthesis unit -- completes the
    8-unit B2 tier. Targets the CEFR B2 synthesis outcome
    (universal.b2.synthesis.summarize_and_evaluate_multiple_sources):
    combine information from more than one source into a coherent
    summary, note where the sources agree or conflict, and give a
    reasoned judgement about them. Theme: one comparison across all six
    lessons -- Ana and Diana each write a review of the same new
    restaurant, and the sources must be attributed, compared, checked
    for agreement, and checked for conflict. Lesson arc: L01 attributing
    a claim to its source (afirmă, consideră, reiese că); L02 comparing
    two sources side by side (ambele, pe când, dimpotrivă, spre
    deosebire de); L03 identifying where sources agree (sunt de acord,
    la fel, amândouă); L04 identifying where sources conflict (diferă,
    se contrazic, în privința); L05 a reading requirement -- two full
    reviews side by side, with the same shape and content the earlier
    lessons drilled; L06 the culminating production -- a Mihai dialogue
    synthesizing what Ana and Diana each said, a speaking task and a
    writing task that each require naming the point of agreement AND
    the point of conflict between two sources, not just connective
    drilling. Register: formal dumneavoastră throughout, continuing
    units 01-07. All vocabulary is introduced self-contained within the
    ro B2 course (cumulative with units 01-07 -- reuses "sunt de acord",
    "punctul", "totuși", "scrie" etc. already taught earlier in the
    course). No sibling-direction file was consulted; the nl B2 exemplar
    informed structure only, not text.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastră throughout (ro lane pin, continued from units
    01-07). Ana, Diana, and Mihai keep their established formal
    dumneavoastră relationship. B2 synthesis layers attribution and
    comparison language onto that register -- afirmă, consideră, pe
    când, spre deosebire de, sunt de acord, se contrazic -- without
    changing the formal 2nd-person-plural verb forms (dumneavoastră,
    ați) wherever the characters address each other directly.

