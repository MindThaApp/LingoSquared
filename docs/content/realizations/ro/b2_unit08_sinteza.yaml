              - {left: părerea, right: "the opinion"}
              - {left: "la fel", right: "the same / likewise"}
              - {left: amândouă, right: both}
              - {left: recenzia, right: "the review"}
              - {left: excelentă, right: excellent}
          - content_key: ro.b2.unit08.lesson03.exercise04.order_sunt_de_acord
