            type: word_order
            tested_text: "În privința prețului Ana și Diana se contrazic"
            prompt: {target_blocks: []}
            word_bank: [În, privința, prețului, Ana, și, Diana, se, contrazic]
          - content_key: ro.b2.unit08.lesson04.exercise05.translate_difera
