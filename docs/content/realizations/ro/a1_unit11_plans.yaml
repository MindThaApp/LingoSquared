generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-10
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- firecrawl was tried first per
    standing instruction (`firecrawl search`) but returned HTTP 402
    (0 credits remaining, same exhausted state unit10 hit), so the
    direct re-fetch of this already-confirmed-working PDF was used
    instead, matching unit09/unit10's own precedent for the identical
    situation). Checked this source specifically for plan-making/
    invitation material (grepped the full extracted text for plan/
    invit/propose/"shall we"/"let's go"/mergem/cinema/parc/weekend/
    "are you free"/"free time" and confirmed there is no dedicated
    lesson at all through the document's own table of contents --
    Lessons 1-19 cover greetings, introductions, questions, the
    alphabet, pronouns, to be/have, articles, numbers, days, months,
    basic words/adverbs, food, house orientation, and four generic
    "Listening Exercises" lessons, none of which is an invitation/
    plan-negotiation dialogue). The one genuinely relevant hit is
    Lesson 19's "list of similar words" (English-Romanian cognates),
    which confirms "cinema," "parc," "restaurant," "film," and
    "mesaj" as real attested Romanian words matching their English
    cognates -- used here as a vocabulary-choice cross-check, not as
    dialogue source material, since the list is bare word pairs with
    no sentence context at all. Per AUTHORING_GUIDE #10 ("if the
    source doesn't cover the topic adequately, author fresh, disclosed
    honestly"), this unit's core plan-negotiation vocabulary and
    phrasing (mergem "let's go/we go," atunci "then/in that case,"
    sigur "sure," and the nu pot "I can't" decline pattern) are
    freshly authored, not sourced -- independently verified via
    WebSearch (not Firecrawl -- grammar/usage verification, not a
    content source) cross-referencing RomanianPod101 and general
    Romanian-English dictionary/usage sources: "Mergem la cinema?" is
    a confirmed natural invitation form ("Ce-ar fi să mergem la
    cinema?" = "How about going to the movies?" uses the same verb),
    "atunci" is confirmed to mean "then" in the alternative-time-frame
    sense needed here (not just the sequential "apoi" sense already
    taught in unit09), and "Sigur!" is confirmed as a common,
    standalone affirmative/confirmation response ("sure/of course").
    This unit deliberately reuses a large amount of already-established
    vocabulary rather than inventing a separate scenario: unit02's
    numbers (patru), unit03's days of the week (sâmbătă, duminică) and
    astăzi/mâine set, unit04's time-telling pattern (la ce oră / la ora
    + number), unit06's da/bine/nu/mulțumesc, and unit09's pot ("I can,"
    from "cum pot să ajung") are all combined into this unit's new
    plan-negotiation phrases -- only mergem, cinema, parc, atunci, and
    sigur are genuinely new vocabulary items, five words total, the
    smallest new-vocabulary footprint of any unit so far, by design:
    the "plans" outcome is almost entirely a combinatorial reuse of
    prior units' days/times/response words, which is the pedagogically
    correct shape for this specific outcome (per its own spine
    prerequisites: universal.a1.time.ask_tell_time and
    universal.a1.dates.exchange_calendar_dates, both already complete).
    Authored at schema_version 1.1 from the start -- every
    kind:vocabulary card carries a real example: sentence with a
    matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule,
    AUTHORING_GUIDE #11 cross-lesson fact consistency with unit03/
    unit06, #17 fill_in_blank ambiguity, including the deliberate
    decision not to fill_in_blank on "atunci") against the actual
    dialogue/exercise content and confirm them accurate. Also confirmed
    no stray YAML booleans, matching_pairs/word_order shapes correct,
    every exercise type registered, no jargon leaks, correct and
    consistent diacritics, natural Romanian throughout. No real bugs
    found; no changes made to this unit.

    Eleventh Romanian unit, first draft, continuing directly from
    unit10. Targets universal.a1.plans.make_simple_plans -- confirmed
    by grepping universal_spine.yaml directly: it's the entry
    immediately following universal.a1.routines.describe_daily_routine
    (unit10's own outcome) in spine order, its own prerequisites list
    names universal.a1.time.ask_tell_time and
    universal.a1.dates.exchange_calendar_dates explicitly (both
    satisfied by unit04 and unit03 respectively, already complete),
    and its can_do text is "Propose, accept, decline, and schedule a
    simple near-future plan." This course's own established 3-lesson
    bootstrap pace and Ana/Mihai characters are used, matching units
    01-10. 3 lessons, deliberately scoped to first-person-plural
    proposals (mergem), a single decline pattern (nu pot, reusing
    unit09's pot), a single reschedule connective (atunci), and a
    single confirmation word (sigur) -- explicitly does NOT cover
    second-person "would you like" forms (vrei/vreți), open-ended
    activity vocabulary beyond cinema/parc, or explicit calendar-date
    scheduling (that's unit03's own already-covered lane; this unit
    reuses bare day-of-week names only) -- the same trim discipline
    unit09/unit10 already applied to their own topics, and the correct
    scope per the outcome's own assessment_requirements wording
    ("propose a simple activity," not a wide activity vocabulary).
    Followed unit10's own precedent for avoiding cross-lesson fact
    contradictions: lesson01 and lesson02's practice sentences are
    deliberately left unattributed to either character (generic first-
    person-plural statements, never spoken by Ana or Mihai in this
    unit's own dialogue) so they cannot pre-empt or contradict
    lesson03's actual dialogue outcome -- only lesson03's dialogue
    itself puts a specific day/time in the characters' mouths (park,
    Sunday, four o'clock). Checked this specific combination against
    every previously-established fact per AUTHORING_GUIDE #11: unit04/
    unit10 establish Mihai's class starts at nine in the morning and he
    works "seara" (evening) before going to bed at night -- a Sunday
    4pm park meeting sits between a morning class and an evening work
    slot with no stated day-of-week restriction on either, so there is
    no contradiction (the same reasoning unit10 itself used for its own
    night-sleep cross-check). unit03 separately established a work
    "întâlnire" (meeting) on "vineri, întâi august" (Friday, August
    1st) for an unrelated calendar-dates exercise -- deliberately did
    NOT reuse Friday anywhere in this unit's own day negotiation
    (chose sâmbătă/duminică instead) specifically to avoid any reader
    confusion between that already-fixed specific date and this unit's
    own generic day-of-week negotiation, even though the two facts
    don't technically contradict (different specific dates, no stated
    recurrence). unit06 established Ana orders cafea and Mihai orders
    ceai -- not referenced anywhere in this unit, no conflict. Checked
    every fill_in_blank slot's correct answer against
    AUTHORING_GUIDE #17's synonym-ambiguity concern: lesson01's
    "___ la cinema?" recalls "Mergem," the only first-person-plural
    "go" verb taught in the whole course (merg/mergeți are different
    grammatical persons, so they don't compete once the English gloss
    specifies "we"); lesson02's "Nu ___ sâmbătă." recalls "pot," the
    only "can" verb taught in the course; lesson03's "La ora ___?"
    gives the target number's meaning directly in the English
    instruction ("At four o'clock?"), so only "patru" fits regardless
    of how many other numbers the course has taught elsewhere.
    Deliberately did NOT fill_in_blank on "atunci" anywhere, even
    though it's a new word this unit teaches -- "Apoi" (unit09's
    sequential "then") is a plausible-sounding alternate fit in a bare
    "___, duminică?" slot with no further disambiguation, which is
    exactly the synonym-competition trap #17 warns against; "atunci"
    is instead tested via multiple_choice and matching_pairs only,
    both of which have no single-answer-recall ambiguity concern.
    Checked every listen_select/dialogue_comprehension exercise against
    the standing same-speaker-distractor rule: lesson01's and
    lesson02's listen_select exercises use single-sentence audio clips
    (not multi-speaker dialogue audio) -- distractors were still
    confirmed to be sentences never spoken in that specific clip.
    Lesson03's dialogue_comprehension distractors ("La ora nouă.",
    "La ora trei.") were verified against the full six-line dialogue
    transcript below -- neither "nouă" nor "trei" is said by Ana or
    Mihai anywhere in that audio clip, so neither distractor is a
    fragment of anything either speaker actually says.

    Second-pass review 2026-10-19: 0 fixes.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-10's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    dumneavoastră register with each other). This unit's new words are
    all register-neutral by construction: mergem is first-person
    plural (no tu/dumneavoastră distinction in Romanian), nu pot is
    first-person singular (same), and atunci/sigur are invariant
    connective/response words with no person marking at all -- this
    unit introduces no new second-person verb forms, so Ana and
    Mihai's dialogue keeps their existing polite register intact
    without needing any new register decision, matching
    unit06/unit07/unit08/unit09/unit10.

