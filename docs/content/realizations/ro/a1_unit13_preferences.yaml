generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-12
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl search "Peace Corps Moldova Basic
    Romanian Language Lessons like prefer a placea"`) but returned HTTP
    402 (0 credits remaining, the same exhausted state units 09-12 all
    hit), so this unit falls back to the same direct `curl` + `pdftotext
    -layout` re-fetch of the confirmed-working PDF those units used.
    The source genuinely covers this unit's core grammar with real,
    directly relevant hits: "Do you like Moldova? / Îţi place Moldova?"
    and "Yes, I like it very much. / Da, îmi place foarte mult." (a
    basic-greetings section); a grammar-notes page explicitly teaching
    the generic-liking construction with the definite article --
    "Îmi place cafeaua foarte mult. (I like coffee very much.)" -- which
    directly confirms this unit's own "Îmi place cafeaua"/"Îmi place
    ceaiul"/"Nu-mi place pâinea" pattern (definite noun, not the bare
    indefinite form already taught in unit06); and a real four-exchange
    drill block ("Îţi place cafeaua? / Da, foarte mult." "Îţi place
    vinul? / Da, îmi place." "Îţi place brînza? / Nu, nu-mi place."
    "Îţi place laptele? / Nu, nu-mi place.") that directly confirms both
    the question form and, critically, the natural contracted negative
    "nu-mi place" (used in this unit instead of an uncontracted "nu îmi
    place," which the source never actually uses). Per AUTHORING_GUIDE
    #10 ("adapt, don't just reference"), the question form was actively
    re-registered rather than copied verbatim: the source's own question
    examples all use the informal Îţi place (tu), but this course's
    Ana/Mihai have used dumneavoastră with each other since unit01 --
    so this unit teaches Vă place...? (the regular tu-to-dumneavoastră
    dative swap, Îţi -> Vă) instead, matching the register this course
    has kept consistent for twelve units running. No source hit covers
    "prefer" (to prefer) or "sau" (or) at all -- grepped the full
    extracted text for prefer/alege/sau/choice/vrei with zero matches --
    so both are freshly authored, disclosed honestly per AUTHORING_GUIDE
    #10's "if the source doesn't cover the topic adequately, author
    fresh": *a prefera* -> *eu prefer* is a transparent Latinate cognate
    verb in standard everyday use (independently confidence-checked, not
    sourced), and *sau* is basic-tier, extremely common vocabulary. This
    unit deliberately reuses a large amount of already-established
    vocabulary rather than inventing a new scenario: unit06's cafea/
    ceai/pâine (now extended to their definite forms cafeaua/ceaiul/
    pâinea, a genuinely new but transparent inflection of already-known
    roots) plus unit06's own established fact that Ana orders cafea and
    Mihai orders pâine and ceai (reused deliberately below, see the
    review notes' AUTHORING_GUIDE #11 cross-check), and unit06/unit07's
    vă (already seen inside vă rog). Only six genuinely new vocabulary
    items are introduced: îmi place, nu-mi place, vă place, prefer, sau,
    and the three definite noun forms cafeaua/ceaiul/pâinea (counted as
    one inflectional extension, not three separate new roots). Authored
    at schema_version 1.1 from the start -- every kind:vocabulary card
    carries a real example: sentence with a matching overlay
    example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19): independently re-verified this unit's
    own self-documented checks below (same-speaker-distractor rule --
    confirmed the "What does Ana prefer to drink?" question, phrased
    around Ana's one explicit *Prefer* statement, correctly avoids the
    double-correct-option risk even though the bare words ceaiul/
    pâinea appear elsewhere in her own turns as a dislike/question, not
    a preference; AUTHORING_GUIDE #11 cross-lesson fact consistency
    with unit06/unit12's established drink preferences, #17
    fill_in_blank ambiguity) against the actual dialogue/exercise
    content and confirm them accurate. Also confirmed no stray YAML
    booleans, matching_pairs/word_order shapes correct, every exercise
    type registered, no jargon leaks, correct and consistent
    diacritics, natural Romanian throughout. No real bugs found; no
    changes made to this unit.

    Thirteenth Romanian unit, first draft, continuing directly from
    unit12. Targets universal.a1.preferences.express_preferences --
    confirmed by grepping universal_spine.yaml directly: it's the entry
    immediately following universal.a1.past_events.describe_recent_event
    (unit12's own outcome) in spine order, its own prerequisites list is
    empty (no gate to satisfy), and its can_do text is "Express and ask
    about basic likes, dislikes, wants, and choices." Unlike unit12, this
    outcome's own speaking assessment_requirement (exchange_preferences:
    "Ask about and state a simple preference... completes both turns
    intelligibly") explicitly requires teaching BOTH a question and an
    answer form, not just a statement -- so this unit does introduce a
    second-person form (Vă place...?), a deliberate scope difference from
    unit11/unit12's choice to avoid second-person forms where the spine
    outcome didn't require it. This course's own established 3-lesson
    bootstrap pace and Ana/Mihai characters are used, matching units
    01-12. 3 lessons: lesson01 teaches Îmi place/Nu-mi place (basic
    like/dislike) generically with cafeaua/ceaiul/pâinea; lesson02 teaches
    Vă place...? (the formal question), Prefer (I prefer), and Sau (or,
    for offering a choice); lesson03 is Ana and Mihai's dialogue applying
    all of it together, structurally continuing the same Ana/Mihai
    coffee-shop cast unit06 and unit12 already established, this time as
    a coffee-or-tea preference exchange. Checked this choice against
    AUTHORING_GUIDE #11 carefully: (1) Existing fact to protect --
    unit06's own restaurant dialogue has Mihai order "pâine și pui" and
    "un ceai" while Ana orders "o cafea" (Mihai never orders coffee; Ana
    never orders bread or tea), reinforced again by unit12's Sunday recap
    (Mihai: "am mâncat pâine și am băut ceai"; Ana: "am băut cafea!").
    This unit's lesson03 dialogue deliberately keeps that same pattern:
    Ana says "Prefer cafeaua!" and Mihai says "Îmi place ceaiul!" and
    "îmi place pâinea!" -- no character is ever given a stated preference
    that contradicts an established order. (2) New, non-contradictory
    detail -- the dialogue also has each character state a DISLIKE for
    the other's drink (Ana: "Nu-mi place ceaiul"; Mihai: "Nu-mi place
    cafeaua"), which unit06/unit12 never addressed either way (both units
    only ever recorded what each character ordered/drank, never what they
    disliked) -- same "nothing was stated either way" reasoning unit10/
    unit11/unit12 already used for their own cross-checks, so this adds
    detail without risking a silent contradiction. (3) No day/schedule
    claim -- this unit makes no time-of-day or day-of-week claim at all,
    so unit10's routine facts and unit11's Sunday-park facts are
    untouched. Checked every fill_in_blank slot's correct answer against
    AUTHORING_GUIDE #17's synonym-ambiguity concern: lesson01's "Îmi ___
    cafeaua." recalls "place," the only verb form taught in either
    direction (îmi place/nu-mi place share the identical verb form, so
    there is no second candidate); lesson02's "Cafea ___ ceai?" recalls
    "sau," and while unit10/unit12's already-taught "și" (and) is also a
    real Romanian conjunction, the instruction explicitly asks the
    learner to complete "Coffee OR tea?" in English, which rules out "și"
    (a different meaning, not a true synonym of "sau" the way je/jij are
    synonyms of each other) -- an ordinary vocabulary-recall slot, not
    the ambiguity class the rule targets; lesson03's "Nu-mi ___ ceaiul."
    recalls "place" for the same single-candidate reason as lesson01.
    Checked the lesson03 dialogue_comprehension exercise against the
    standing same-speaker-distractor rule: listed every line each speaker
    actually says in the six-line dialogue before writing distractors --
    Mihai's three lines are "Bună, Ana! Vă place cafeaua sau ceaiul?",
    "Îmi place ceaiul! Nu-mi place cafeaua.", and "Da, îmi place pâinea!
    Mulțumesc, Ana! La revedere!"; Ana's three lines are "Prefer cafeaua!
    Nu-mi place ceaiul.", "Și pâinea? Vă place pâinea?", and "La
    revedere, Mihai!". The exercise asks "What does Ana prefer to
    drink?" (correct: "Cafea.") with distractors "Ceai."/"Pâine." --
    deliberately phrased around Ana's own single explicit *Prefer*
    statement (only ever said about cafeaua) rather than a generic
    "what does she mention" question, since Ana does also say the words
    ceaiul/pâinea elsewhere in her own lines (as a stated dislike and a
    question, not a preference) -- phrasing the question around the one
    thing she actually PREFERS keeps exactly one line-truthful answer,
    avoiding the double-correct-option failure mode even though the bare
    words appear elsewhere in her own turns. lesson01/lesson02's
    listen_select exercises use single-sentence audio clips (not
    multi-speaker dialogue audio), and distractors were confirmed to be
    sentences never spoken in that specific clip.

    Second-pass review 2026-10-19: 0 fixes.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-12's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    dumneavoattră register with each other). This unit's new question
    form (Vă place...?) uses the formal dative vă, matching Mihai's own
    established faceți/aveți-style formal endings rather than the
    source material's informal Îţi place -- the first genuinely new
    second-person form since unit05's ai/aveți pair, deliberately
    introduced here because this outcome's own exchange_preferences
    assessment_requirement requires a real question-and-answer exchange,
    unlike unit11/unit12 which could stay entirely first-person.

