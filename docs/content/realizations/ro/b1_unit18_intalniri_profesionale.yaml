generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: true
  notes: >-
    Romanian's eighteenth B1 unit, continuing the b1_unit01-17 authoring
    pass. Authored fresh from general standard Romanian grammar knowledge
    (matching b1_unit01-17 precedent; the Peace Corps Moldova source used
    throughout ro's corpus was re-checked and has no dedicated formal-
    meeting lesson).

    Teaches universal.b1.workplace.communicate_professionally_in_meetings:
    a formal-register softened-conditional suggestion/request ("Aș
    sugera să...", "Ați putea să...?"), participating in a short
    work-meeting exchange, and writing a brief professional message. This
    directly reuses unit17's "conditional alone to soften" construction
    (Aș sugera / Ați dori) but in a distinct workplace-meeting register
    and scenario, never re-teaching unit17's exact sentences.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-17), dumneavoastră-formal
    register (already the established default, and doubly appropriate
    for a formal meeting). Mihai (inginer) leads a short project-status
    meeting with Ana (profesoară -- here in her capacity co-organizing a
    training session, consistent with her teaching profession, not a
    contradicted fact) and Diana; Diana writes a brief professional
    follow-up message. No character's established profession or
    biography is altered. All genuinely new vocabulary is introduced
    self-contained within this file; no sibling-direction overlay was
    consulted while authoring.
review:
  status: reviewed
  required_next_reviewer: null
  notes: "Second-pass review 2026-10-19: 1 fix - lesson01 grammar note \"conditionalul\" corrected to \"condiționalul\"; provenance-note cedilla ş normalised. NATIVE FLAGS: none."

course:
