  register_policy: >-
    Continues the established dumneavoastră-default register from ro
    A1/A2/B1 (units 01-26, b1_unit01-17): Ana, Mihai, and Diana address
    each other formally (dumneavoastră) throughout, with extra care taken
    here since the scenario is an explicitly formal work meeting.

