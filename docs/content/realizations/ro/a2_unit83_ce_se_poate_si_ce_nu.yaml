          - {"content_key": "ro.a2.unit83.lesson06.exercise03.une_dialog", "type": "matching_pairs", "tested_text": "Pot să iau cartea acasă Da poți Trebuie să aduci cartea Trebuie să plătesc Nu e nevoie să plătești Pot să mănânc aici Nu ai voie să mănânci aici Poți să mănânci afară", "prompt": {"target_blocks": []}, "pairs": [{"left": "Pot să iau cartea acasă?", "right": "Can I take the book home?"}, {"left": "Da, poți.", "right": "Yes, you can."}, {"left": "Trebuie să aduci cartea.", "right": "You have to bring the book."}, {"left": "Trebuie să plătesc?", "right": "Do I have to pay?"}, {"left": "Nu e nevoie să plătești.", "right": "You don't have to pay."}, {"left": "Pot să mănânc aici?", "right": "May I eat here?"}, {"left": "Nu ai voie să mănânci aici.", "right": "You are not allowed to eat here."}, {"left": "Poți să mănânci afară.", "right": "You can eat outside."}]}
          - {"content_key": "ro.a2.unit83.lesson06.exercise04.ordine_afara", "type": "word_order", "tested_text": "Poți să mănânci afară", "prompt": {"target_blocks": []}, "word_bank": ["afară", "mănânci", "să", "Poți"]}
          - {"content_key": "ro.a2.unit83.lesson06.exercise05.raspunde_plata", "type": "dialogue_response", "tested_text": "Nu nu e nevoie să plătești", "prompt": {"target_blocks": [{"text": "Trebuie să plătesc?", "language_code": "ro", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit83.lesson06.exercise06.traduce_foame", "type": "translation", "tested_text": "Mi-e foame Pot să mănânc aici", "prompt": {"target_blocks": [{"text": "I'm hungry. May I eat here?", "language_code": "en", "direction": "ltr"}]}}
