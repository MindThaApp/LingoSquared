          - {"content_key": "ro.a2.unit83.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Pot să mănânc aici? Mi-e foame.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Pot", "să", "mănânc", "aici", "Mi", "e", "foame"]}
          - {"content_key": "ro.a2.unit83.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Nu, nu ai voie să mănânci aici. Poți să mănânci afară.", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Nu", "nu", "ai", "voie", "să", "mănânci", "aici", "Poți", "afară"]}
          - {"content_key": "ro.a2.unit83.lesson06.teach.d7", "kind": "dialogue", "target": {"text": "Bine, atunci mâncăm afară!", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Bine", "atunci", "mâncăm", "afară"]}
