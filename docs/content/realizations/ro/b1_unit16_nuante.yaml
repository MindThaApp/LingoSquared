  authoring_system: claude
  human_reviewed: true
  notes: >-
    Romanian's sixteenth B1 unit, continuing the b1_unit01-15 authoring
    pass. Source-material check redone for this specific topic before
    authoring: the same public-domain source used throughout ro's corpus
    ("Basic Romanian Language Lessons," US Peace Corps Moldova, public
    domain, https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was grepped via its existing local
    text extraction for concessive markers (deşi, cu toate acestea)
    across the full 785-line extraction -- no dedicated concession/
    nuance debate lesson found. This unit is therefore authored fresh
    from general standard Romanian grammar knowledge, matching
    b1_unit01-15's precedent.

    Teaches the spine outcome's full requirement (universal.b1.
    opinions.debate_with_concession_and_nuance): a concessive connector,
    "deşi" ("although"/"even though"), for conceding a valid point on
    the other side before restating one's own position, and a stronger
    contrastive connector than a simple "dar" ("but"), "cu toate
    acestea" ("nevertheless/however"), to structure a multi-point
    argument -- both applied to the established office's working-from-
    home-vs-office debate topic (an everyday workplace-adjacent opinion
    topic, matching this outcome's "debate a topic with nuance"
    requirement).

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-15) and the established
    dumneavoastră-formal register (pinned since b1_unit01, reconfirmed
    b1_unit06-15). Ana prefers working from the office, Mihai prefers
    working from home some days -- an opinion difference, not a
    contradicted fact, and consistent with Mihai's established inginer
    profession (a job compatible with either arrangement) and Ana's
    established profesoară profession. Grepped the established
    character profiles before writing: Mihai remains inginer
    (a1_unit17, masculine-only "Sunt inginer"), Ana remains profesoară
    (feminine-only), Diana remains their office colleague
    (b1_unit04/06) -- no profession or biographical fact is contradicted
    here. All genuinely new vocabulary is introduced self-contained
    within this file; no other session's sibling-direction overlay was
    consulted while authoring.
