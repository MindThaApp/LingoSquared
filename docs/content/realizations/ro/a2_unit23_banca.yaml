schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: A2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain, the same PDF used for units 01-22,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was checked first for dedicated
    banking material. `firecrawl --status` still shows 0/1,000 credits
    (unchanged since units 21/22's own checks), so this unit again
    falls back to established-conventions-only authoring. Grepped the
    existing 785-line extraction for cont/bancă/card/deschide and found
    only the earlier-noted bare "bancă" cognate-list hit (already
    flagged in unit21's provenance) -- no dedicated lesson content.
    Every word and phrase here is authored fresh from general standard
    Romanian knowledge.

    Continues the A2 grammar progression: reuses unit21's conditional
    "aș dori" for the account-opening request, and introduces "e nevoie
    de" (it's necessary to have / there is need of) as a second
    impersonal-necessity construction alongside unit21's "vă trebuie."
    Continues Ana as protagonist (consistent with her unit18 fact of
    owning a house, so she brings the property deed already established
    as her go-to proof-of-address document in unit21) and introduces
    one new character, bancherul Radu, a bank clerk -- a new named
    character for the same reason unit21 introduced Elena rather than
    reusing Mihai, since neither Ana's nor Mihai's established jobs
    connect to bank-teller work. This unit's own scene explicitly has
    Ana bring her already-registered address confirmation from unit21
    (the spine's own prerequisite chain: universal.a2.banking.
    open_bank_account lists universal.a2.bureaucracy.
    register_with_authorities as a prerequisite), giving this course's
    first cross-unit A2 narrative continuity beyond the shared
    Ana/Mihai cast.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Third Romanian A2 unit. Targets universal.a2.banking.
    open_bank_account (confirmed by grepping universal_spine.yaml
    directly -- prerequisites are universal.a1.money.
    handle_basic_money_matters, already covered by this course's unit07
    shopping content, and universal.a2.bureaucracy.
    register_with_authorities, this course's own unit21). 4 lessons,
    each mapped to a distinct spine assessment_requirement: lesson01
    (requesting to open an account) covers request_bank_account's
    speaking half; lesson02 (documents and account features) covers
    understand_account_requirements; lesson03 (reading an account
    leaflet) covers read_account_information and previews
    write_account_request via its writing_prompt; lesson04 (the full
    Ana/Radu bank-counter dialogue) covers request_bank_account fully
    and consolidates all four.

    Reuses unit01's bună/mulțumesc/la revedere/Ana, unit21's aș dori/
    buletin/actul de proprietate (Ana's own established documents),
    re-declared via a lesson-opening reminder card per the standing
    per-file token-scoping convention. Within this file, lesson02-04
    freely reuse lesson01's own cont/deschid/aș dori without a fresh
    reminder card, matching the established within-file-reuse
    precedent.

    Checked this choice against AUTHORING_GUIDE #11 before finalizing.
    Facts this unit newly states: Ana opens a checking account (cont
    curent) at the bank using her buletin and actul de proprietate
    (the same two documents unit21 already established she carries,
    no new conflicting document introduced), receives a card that
    arrives by post within five business days, consistent with unit21's
    own "confirmation arrives by post" precedent for official
    processes in this course. No prior unit states anything about Ana
    having or not having a bank account, so nothing conflicts.

    Checked every fill_in_blank slot against AUTHORING_GUIDE #17: each
    blank's instruction explicitly states the target English meaning
    (lesson01's blank=curent instruction names "checking account"
    explicitly; lesson02's blank=cinci instruction names "five business
    days" explicitly). Checked every listen_select/dialogue_
    comprehension distractor against the standing same-speaker-audio
    rule for lesson04's dialogue -- Radu's and Ana's own lines were
    listed before writing distractors, and every distractor is either
    something neither speaker says in that clip, or (for "who says
    this") genuinely said by the other speaker only.

    Verified every word_order/listen_order exercise's word_bank token
    multiset exactly matches its paired overlay correct_response token
    multiset (case- and diacritic-exact), and every exercise's
    tested_text tokens are covered by an earlier introduced_tokens
    entry in this same file (both checked proactively before running
    the compiler, per the real gaps units 21/22 found) -- per the
    standing validate_order_word_bank_answers and
    validate_untaught_vocabulary compiler checks. Needs a fresh-context
    content review before import, same as every other language's
    content.

course:
  realization_key: ro.a2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Fully formal register throughout -- dumneavoastră with the bank
    clerk (Ana and Radu have never met), matching unit21's identical
    convention for the city-hall clerk. Continues unit21's "aș dori" as
    the polite-request form.

