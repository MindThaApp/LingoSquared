            prompt: {target_blocks: []}
          - content_key: ro.a2.unit23.lesson01.exercise04.match_banca1
            type: matching_pairs
            tested_text: "cont curent bancă deschid aș dori bună ziua mulțumesc la revedere"
            prompt: {target_blocks: []}
            pairs:
