              - {left: "Aș dori să deschid un cont curent.", right: "I would like to open a checking account."}
              - {left: "Bună ziua.", right: "Good day."}
              - {left: "Mulțumesc.", right: "Thank you."}
          - content_key: ro.a2.unit23.lesson01.exercise05.order_as_dori_deschid
