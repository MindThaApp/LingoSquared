            target: {text: "Să deschid (that I open)", language_code: ro, direction: ltr}
            introduced_tokens: [să, deschid, deschis]
          - content_key: ro.a2.unit23.lesson01.teach.as_dori_deschid_phrase
            kind: phrase
            target: {text: "Aș dori să deschid un cont curent.", language_code: ro, direction: ltr}
            introduced_tokens: [aș, dori, să, deschid, un, cont, curent]
          - content_key: ro.a2.unit23.lesson01.teach.banca_vocab
            kind: vocabulary
            target: {text: "Bancă", language_code: ro, direction: ltr}
            introduced_tokens: [la, bancă]
            example:
              - {text: "Aș dori să deschid un cont curent la bancă.", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a2.unit23.lesson01.exercise01.choose_cont
            type: multiple_choice
            tested_text: "cont"
            prompt:
