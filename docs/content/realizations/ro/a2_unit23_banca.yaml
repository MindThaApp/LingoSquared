          - content_key: ro.a2.unit23.lesson01.teach.cont_vocab
            kind: vocabulary
            target: {text: "Cont", language_code: ro, direction: ltr}
            introduced_tokens: [un, cont]
            example:
              - {text: "Aș dori un cont.", language_code: ro, direction: ltr}
          - content_key: ro.a2.unit23.lesson01.teach.curent_vocab
            kind: vocabulary
            target: {text: "Cont curent", language_code: ro, direction: ltr}
            introduced_tokens: [curent]
            example:
              - {text: "Aș dori un cont curent.", language_code: ro, direction: ltr}
