          - content_key: ro.b2.unit01.lesson02.teach.in_primul_al_doilea_rand
            kind: phrase
            target: {text: "în primul rând, în al doilea rând", language_code: ro, direction: ltr}
            introduced_tokens: [în, primul, rând, al, doilea]
          - content_key: ro.b2.unit01.lesson02.teach.in_plus
