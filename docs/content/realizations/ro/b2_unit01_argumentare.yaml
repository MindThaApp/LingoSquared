schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's first
    B2 unit. Built from general Romanian grammar/discourse knowledge, the
    same honest from-scratch disclosure the nl B2 lane set. Sibling
    isolation honored: the ro-en B2 argumentation realization and every
    other language's B2 file were treated as non-existent and were not
    opened; the nl B2 exemplar was consulted ONLY for structural shape
    (lesson pacing, exercise-type sequencing, media-asset conventions) per
    the dispatch instructions, never for its actual Dutch text -- every
    Romanian sentence in this file was composed from scratch around a
    fresh debate topic (public transport vs. the private car) chosen
    specifically to avoid textual/thematic overlap with the Dutch
    remote-work exemplar. Character canon consulted directly from the ro
    b1 lane: Ana (profesoara, lucreaza la scoala) and Mihai (inginer,
    lucreaza la birou), established in a1_unit17_work.yaml and reused
    through the b1 tier, continue here with their established formal
    dumneavoastra register with each other (pinned explicitly in
    b1_unit01_necessity.yaml's register_policy and consistent since
    a1/a2). No sibling-direction file (ro-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness/idiom of every connective (pe de o
    parte / pe de alta parte, deoarece vs. pentru ca, asta nu inseamna ca,
    pe scurt) and that the formal dumneavoastra register (credeti, aveti)
    is correctly conjugated and consistent throughout every Ana/Mihai
    exchange; (2) the culminating writing exercise (lesson06 exercise06)
    is graded against a fixed four-sentence string -- confirm the
    accepted-answer punctuation variants are complete enough that a
    correct learner is never marked wrong; (3) whether "se economisesc
    bani" (impersonal reflexive-passive) reads as the most natural way to
    express the generic "you save money" here, or whether a reviewer would
    prefer a different generic-subject construction; (4) confirm
    "incomod", "contorizeaza" -- sorry, "conteaza" -- and "in schimb" read
    as current everyday Romanian in this register; (5) confirm the
    deoarece/pentru ca register distinction taught in lesson02 (deoarece
    as the more formal, sentence-opening causal connective; pentru ca as
    the everyday mid-clause one) matches how a native speaker would
    actually characterize the difference.
  notes: >-
    First Romanian B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence): state a
    claim, support it with reasons/evidence, acknowledge the strongest
    opposing point, and rebut it without conceding. Theme: public
    transport vs. the private car -- one coherent debatable everyday issue
    across all six lessons. Lesson arc mirrors the argument structure
    itself: L01 stating a claim, L02 supporting it (in primul rand /
    de exemplu / studiile arata ca), L03 acknowledging the opposing point
    (pe de o parte ... pe de alta parte / desi / desigur / este adevarat),
    L04 rebutting without conceding (totusi / in schimb / asta nu
    inseamna ca / pe scurt), L05 an argumentative reading text
    (distinguish the author's claim from the objection answered), L06 the
    culminating production -- an Ana/Mihai debate for the listening
    requirement plus a speaking task and a writing task that each require
    a FULL argument (claim + support + acknowledged objection +
    rebuttal), not just connective drilling. Register: formal
    dumneavoastra throughout (ro lane's established convention), per Ana
    and Mihai's own corpus-wide relationship. All vocabulary is introduced
    self-contained within this file (B2 is a separate Course row from B1,
    so a B2 learner never sees B1 lexemes at runtime -- same
    self-containment precedent as the nl B2 lane). No sibling-direction
    file was consulted; the nl B2 exemplar informed structure only, not
    text.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastra throughout (ro lane pin, established since the
    A1/A2 tier and continued through B1). Ana and Mihai address each
    other formally, matching their established corpus-wide relationship
    (b1_unit01_necessity.yaml's register_policy). B2 argumentation layers
    discourse connectives onto that register -- in primul rand, de
    exemplu, studiile arata ca, pe de o parte ... pe de alta parte,
    desigur, totusi, pe scurt -- while keeping the formal 2nd-person-
    plural verb forms (credeti, aveti) whenever Ana and Mihai address
    each other directly.

