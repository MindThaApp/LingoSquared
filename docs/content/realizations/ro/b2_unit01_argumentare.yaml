            example: {text: "Mulți preferă transportul în comun.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson02.teach.timp
            kind: vocabulary
            target: {text: "timp", language_code: ro, direction: ltr}
            introduced_tokens: [timp]
            example: {text: "Transportul în comun economisește timp.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson02.teach.grammar_argumente
            kind: grammar_note
            target: {text: "În primul rând se economisesc bani. În plus, studiile arată că este mai ecologic. Deoarece este mai ecologic, mulți preferă transportul în comun.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit01.lesson02.exercise01.recognize_pentru_ca
            type: multiple_choice
            tested_text: "pentru că"
            prompt: {target_blocks: [{text: "pentru că", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson02.exercise02.listen_motiv_bani
            type: listen_select
            tested_text: "În primul rând se economisesc bani"
