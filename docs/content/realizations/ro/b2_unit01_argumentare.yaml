units:
  - content_key: ro.b2.unit01.argumentare
    title: "Argumentare"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.argumentation.defend_a_position_with_evidence
    planned_lesson_count: 6

    lessons:
      - content_key: ro.b2.unit01.lesson01.opinia
        title: "Exprimarea unei opinii"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: ro.b2.unit01.lesson01.teach.transportul_in_comun
            kind: vocabulary
            target: {text: "transportul în comun", language_code: ro, direction: ltr}
            introduced_tokens: [transportul, în, comun]
            example: {text: "Transportul în comun este ieftin.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson01.teach.masina_personala
            kind: vocabulary
            target: {text: "mașina personală", language_code: ro, direction: ltr}
            introduced_tokens: [mașina, personală]
            example: {text: "Mulți oameni preferă mașina personală.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson01.teach.un_punct_de_vedere
            kind: vocabulary
            target: {text: "un punct de vedere", language_code: ro, direction: ltr}
            introduced_tokens: [un, punct, de, vedere]
            example: {text: "Am un punct de vedere clar.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson01.teach.cred_ca
            kind: phrase
            target: {text: "Cred că...", language_code: ro, direction: ltr}
            introduced_tokens: [cred, că]
          - content_key: ro.b2.unit01.lesson01.teach.in_opinia_mea
            kind: phrase
            target: {text: "În opinia mea...", language_code: ro, direction: ltr}
            introduced_tokens: [în, opinia, mea]
          - content_key: ro.b2.unit01.lesson01.teach.mai_bun
            kind: vocabulary
            target: {text: "mai bun", language_code: ro, direction: ltr}
            introduced_tokens: [mai, bun]
            example: {text: "Transportul în comun este mai bun.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson01.teach.decat
            kind: vocabulary
            target: {text: "decât", language_code: ro, direction: ltr}
            introduced_tokens: [decât]
            example: {text: "Transportul în comun este mai bun decât mașina personală.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Cred că transportul în comun este mai bun decât mașina personală.", language_code: ro, direction: ltr}
            introduced_tokens: [este]
          - content_key: ro.b2.unit01.lesson01.teach.sunt_de_acord
            kind: phrase
            target: {text: "Sunt de acord cu asta.", language_code: ro, direction: ltr}
            introduced_tokens: [sunt, de, acord, cu, asta]
          - content_key: ro.b2.unit01.lesson01.teach.grammar_pozitie
            kind: grammar_note
            target: {text: "Cred că transportul în comun este mai bun decât mașina personală. În opinia mea, este mai bun.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit01.lesson01.exercise01.recognize_punct_de_vedere
            type: multiple_choice
            tested_text: "un punct de vedere"
            prompt: {target_blocks: [{text: "un punct de vedere", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson01.exercise02.listen_claim
            type: listen_select
            tested_text: "Cred că transportul în comun este mai bun decât mașina personală"
            media_asset_key: ro.b2.audio.argumentare.claim_transport.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit01.lesson01.exercise03.match_claim_words
            type: matching_pairs
            tested_text: "transportul în comun mașina personală un punct de vedere Cred că În opinia mea mai bun decât Sunt de acord cu asta"
            prompt: {target_blocks: []}
            pairs:
              - {left: "transportul în comun", right: "public transport"}
              - {left: "mașina personală", right: "the private car"}
              - {left: "un punct de vedere", right: "a position / viewpoint"}
              - {left: "Cred că...", right: "I think that..."}
              - {left: "În opinia mea...", right: "In my opinion..."}
              - {left: "mai bun", right: better}
              - {left: decât, right: than}
              - {left: "Sunt de acord cu asta.", right: "I agree with that."}
          - content_key: ro.b2.unit01.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Cred că transportul în comun este mai bun"
            prompt: {target_blocks: []}
            word_bank: [Cred, că, transportul, în, comun, este, mai, bun]
          - content_key: ro.b2.unit01.lesson01.exercise05.translate_opinia_mea
            type: translation
            tested_text: "În opinia mea, transportul în comun este mai bun"
            prompt: {target_blocks: [{text: "In my opinion, public transport is better.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson01.exercise06.speak_sunt_de_acord
            type: speak_response
            tested_text: "Sunt de acord cu asta"
            prompt: {target_blocks: [{text: "Say aloud in Romanian: I agree with that.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson01.exercise07.write_claim
            type: writing_prompt
            tested_text: "Cred că transportul în comun este mai bun decât mașina personală"
            prompt: {target_blocks: [{text: "Write in Romanian: I think that public transport is better than the private car.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson01.exercise08.dictation_claim_transport
            type: dictation
            tested_text: "Cred că transportul în comun este mai bun decât mașina personală"
            media_asset_key: ro.b2.audio.argumentare.claim_transport.01
            prompt: {target_blocks: []}

      - content_key: ro.b2.unit01.lesson02.argumente
