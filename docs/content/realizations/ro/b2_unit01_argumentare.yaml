            word_bank: [Asta, nu, înseamnă, că, avantajele, contează, mai, puțin]
          - content_key: ro.b2.unit01.lesson06.exercise05.speak_full_argument
            type: speak_response
            tested_text: "Cred că transportul în comun este mai bun decât mașina personală. În primul rând se economisesc bani. Desigur, mașina personală este uneori mai confortabilă. Totuși, avantajele contează mai mult"
            prompt: {target_blocks: [{text: "Defend a position aloud in Romanian with a full argument. Say these four sentences, using în primul rând, desigur and totuși as signposts: (1) I think public transport is better than the private car. (2) Firstly, money is saved. (3) Of course, the private car is sometimes more comfortable. (4) Still, the advantages count for more.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson06.exercise06.write_full_argument
            type: writing_prompt
            tested_text: "Cred că transportul în comun este mai bun decât mașina personală. În primul rând se economisesc bani. Desigur, mașina personală este uneori mai confortabilă. Totuși, avantajele contează mai mult."
            prompt: {target_blocks: [{text: "Write a full argument in Romanian defending your position. Write these four sentences, using în primul rând, desigur and totuși as signposts: (1) I think public transport is better than the private car. (2) Firstly, money is saved. (3) Of course, the private car is sometimes more comfortable. (4) Still, the advantages count for more.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson06.exercise07.respond_defend
            type: multiple_choice
            tested_text: "În primul rând se economisesc bani, iar studiile arată că este mai ecologic"
            prompt: {target_blocks: [{text: "De ce credeți că transportul în comun este mai bun?", language_code: ro, direction: ltr}]}
