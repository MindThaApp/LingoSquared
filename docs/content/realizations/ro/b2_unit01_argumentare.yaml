          - content_key: ro.b2.unit01.lesson02.teach.ecologic
            kind: vocabulary
            target: {text: "ecologic", language_code: ro, direction: ltr}
            introduced_tokens: [ecologic]
            example: {text: "Bicicleta este ecologică.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson02.teach.multi
            kind: vocabulary
            target: {text: "mulți", language_code: ro, direction: ltr}
            introduced_tokens: [mulți]
            example: {text: "Mulți oameni preferă bicicleta.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson02.teach.prefera
