          - content_key: ro.b2.unit01.lesson06.teach.grammar_argument_complet
            kind: grammar_note
            target: {text: "Cred că transportul în comun este mai bun decât mașina personală. În primul rând se economisesc bani. Desigur, mașina personală este uneori mai confortabilă. Totuși, avantajele contează mai mult.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit01.lesson06.exercise01.comprehend_claim
            type: dialogue_comprehension
