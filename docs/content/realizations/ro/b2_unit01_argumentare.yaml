            tested_text: "pentru că deoarece în primul rând în al doilea rând în plus de exemplu studiile arată că bani"
            prompt: {target_blocks: []}
            pairs:
              - {left: "pentru că", right: because}
              - {left: deoarece, right: "because (more formal)"}
              - {left: "în primul rând", right: firstly}
