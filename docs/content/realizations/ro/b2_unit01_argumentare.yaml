          - content_key: ro.b2.unit01.lesson03.exercise07.write_unii_cred
            type: writing_prompt
            tested_text: "Unii cred că transportul în comun este incomod"
            prompt: {target_blocks: [{text: "Write in Romanian: Some think that public transport is uncomfortable.", language_code: en, direction: ltr}]}

      - content_key: ro.b2.unit01.lesson04.combaterea
        title: "Combaterea argumentelor"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: ro.b2.unit01.lesson04.teach.totusi
            kind: vocabulary
            target: {text: "totuși", language_code: ro, direction: ltr}
            introduced_tokens: [totuși]
            example: {text: "Este scump, totuși cumpăr.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.in_schimb
            kind: vocabulary
            target: {text: "în schimb", language_code: ro, direction: ltr}
            introduced_tokens: [în, schimb]
            example: {text: "Mașina este comodă; transportul în comun, în schimb, este mai ieftin.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.dar
            kind: vocabulary
            target: {text: "dar", language_code: ro, direction: ltr}
            introduced_tokens: [dar]
            example: {text: "Este util, dar nu perfect.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.insa
            kind: vocabulary
            target: {text: "însă", language_code: ro, direction: ltr}
            introduced_tokens: [însă]
            example: {text: "Transportul în comun este lent, este confortabil însă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.asta_nu_inseamna_ca
            kind: phrase
            target: {text: "asta nu înseamnă că...", language_code: ro, direction: ltr}
            introduced_tokens: [asta, nu, înseamnă, că]
          - content_key: ro.b2.unit01.lesson04.teach.pe_scurt
            kind: vocabulary
            target: {text: "pe scurt", language_code: ro, direction: ltr}
            introduced_tokens: [pe, scurt]
            example: {text: "Pe scurt, transportul în comun este mai bun.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.avantaje
            kind: vocabulary
            target: {text: "avantaje", language_code: ro, direction: ltr}
            introduced_tokens: [avantaje, avantajele]
            example: {text: "Transportul în comun are multe avantaje.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.dezavantaje
            kind: vocabulary
            target: {text: "dezavantaje", language_code: ro, direction: ltr}
            introduced_tokens: [dezavantaje, dezavantajele]
            example: {text: "Are și câteva dezavantaje.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.conteaza
            kind: vocabulary
            target: {text: "contează", language_code: ro, direction: ltr}
            introduced_tokens: [contează]
            example: {text: "Timpul contează mult.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.mai_mult
            kind: vocabulary
            target: {text: "mai mult", language_code: ro, direction: ltr}
            introduced_tokens: [mult]
            example: {text: "Avantajele contează mai mult.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.mai_putin
            kind: vocabulary
            target: {text: "mai puțin", language_code: ro, direction: ltr}
            introduced_tokens: [puțin]
            example: {text: "Dezavantajele contează mai puțin.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson04.teach.are_avantaje
            kind: phrase
            target: {text: "are avantaje", language_code: ro, direction: ltr}
            introduced_tokens: [are]
          - content_key: ro.b2.unit01.lesson04.teach.grammar_combatere
            kind: grammar_note
            target: {text: "Este adevărat, dar asta nu înseamnă că banii economisiți contează mai puțin. Pe scurt, avantajele contează mai mult decât dezavantajele.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit01.lesson04.exercise01.recognize_totusi
            type: multiple_choice
            tested_text: "totuși"
            prompt: {target_blocks: [{text: "totuși", language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson04.exercise02.listen_combatere_avantaje
            type: listen_select
            tested_text: "Totuși, avantajele contează mai mult decât dezavantajele"
            media_asset_key: ro.b2.audio.argumentare.combatere_avantaje.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit01.lesson04.exercise03.match_rebuttal_words
            type: matching_pairs
            tested_text: "totuși în schimb dar însă asta nu înseamnă că pe scurt avantaje dezavantaje"
            prompt: {target_blocks: []}
            pairs:
              - {left: totuși, right: "still / yet"}
              - {left: "în schimb", right: "by contrast / instead"}
              - {left: dar, right: but}
              - {left: însă, right: however}
              - {left: "asta nu înseamnă că...", right: "that does not mean that..."}
              - {left: "pe scurt", right: "in short"}
              - {left: avantaje, right: advantages}
              - {left: dezavantaje, right: disadvantages}
          - content_key: ro.b2.unit01.lesson04.exercise04.order_combatere_avantaje
            type: word_order
            tested_text: "Totuși avantajele contează mai mult"
            prompt: {target_blocks: []}
            word_bank: [Totuși, avantajele, contează, mai, mult]
          - content_key: ro.b2.unit01.lesson04.exercise05.translate_are_dar
            type: translation
            tested_text: "Transportul în comun are avantaje, dar mașina personală este mai confortabilă"
            prompt: {target_blocks: [{text: "Public transport has advantages, but the private car is more comfortable.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson04.exercise06.write_asta_nu_inseamna
            type: writing_prompt
            tested_text: "Asta nu înseamnă că banii economisiți contează mai puțin"
            prompt: {target_blocks: [{text: "Write in Romanian, using asta nu înseamnă că: That does not mean that the money saved counts for less.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson04.exercise07.write_pe_scurt
            type: writing_prompt
            tested_text: "Pe scurt, avantajele contează mai mult decât dezavantajele"
            prompt: {target_blocks: [{text: "Write in Romanian, using pe scurt: In short, the advantages count for more than the disadvantages.", language_code: en, direction: ltr}]}

      - content_key: ro.b2.unit01.lesson05.text_argumentativ
        title: "Citirea unui text argumentativ"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: ro.b2.unit01.lesson05.teach.text
            kind: reading
            target:
              text: >-
                Tot mai mulți oameni preferă transportul în comun. Cred că
                este o alegere bună. În primul rând se economisesc bani,
                iar studiile arată că este mai ecologic decât mașina
                personală. Desigur, unii cred că transportul în comun este
                incomod. Este adevărat, dar asta nu înseamnă că avantajele
                contează mai puțin. Pe scurt, transportul în comun este
                mai bun decât mașina personală.
              language_code: ro
              direction: ltr
            introduced_tokens: [tot, oameni, o, alegere, bună, iar]
        exercises:
          - content_key: ro.b2.unit01.lesson05.exercise01.read_claim
            type: reading_comprehension
            tested_text: "o alegere bună"
            prompt: {target_blocks: [{text: "What is the author's main claim about public transport?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson05.exercise02.read_objection
            type: reading_comprehension
            tested_text: "transportul în comun este incomod"
            prompt: {target_blocks: [{text: "Which objection does the author acknowledge before answering it?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson05.exercise03.read_rebuttal
            type: reading_comprehension
            tested_text: "asta nu înseamnă că avantajele contează mai puțin"
            prompt: {target_blocks: [{text: "How does the author answer that objection?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson05.exercise04.read_conclusion
            type: reading_comprehension
            tested_text: "transportul în comun este mai bun decât mașina personală"
            prompt: {target_blocks: [{text: "What is the author's overall conclusion?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "tot mai mulți oameni alegere iar incomod pe scurt"
            prompt: {target_blocks: []}
            pairs:
              - {left: "tot mai mulți", right: "more and more"}
              - {left: oameni, right: people}
              - {left: alegere, right: choice}
              - {left: iar, right: "and / whereas"}
              - {left: incomod, right: uncomfortable}
              - {left: "pe scurt", right: "in short"}
          - content_key: ro.b2.unit01.lesson05.exercise06.translate_alegere_buna
            type: translation
            tested_text: "Cred că este o alegere bună"
            prompt: {target_blocks: [{text: "I think that it is a good choice.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson05.exercise07.write_tot_mai_multi
            type: writing_prompt
            tested_text: "Tot mai mulți oameni preferă transportul în comun"
            prompt: {target_blocks: [{text: "Write in Romanian: More and more people prefer public transport.", language_code: en, direction: ltr}]}

