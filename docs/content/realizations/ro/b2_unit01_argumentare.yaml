            introduced_tokens: [studiile, arată, că]
          - content_key: ro.b2.unit01.lesson02.teach.bani
            kind: vocabulary
            target: {text: "bani", language_code: ro, direction: ltr}
            introduced_tokens: [bani, banii]
            example: {text: "Economisesc bani.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit01.lesson02.teach.se_economisesc
