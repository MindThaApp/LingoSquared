            media_asset_key: ro.b2.audio.argumentare.dialog.transport.01
            prompt: {target_blocks: [{text: "Which objection does Mihai raise against Ana's claim?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson06.exercise03.comprehend_rebuttal
            type: dialogue_comprehension
            tested_text: "asta nu înseamnă că avantajele contează mai puțin"
            media_asset_key: ro.b2.audio.argumentare.dialog.transport.01
            prompt: {target_blocks: [{text: "How does Ana answer Mihai's objection?", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit01.lesson06.exercise04.order_rebuttal
            type: word_order
            tested_text: "Asta nu înseamnă că avantajele contează mai puțin"
