generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: true
  notes: >-
    Romanian's seventeenth B1 unit, continuing the b1_unit01-16 authoring
    pass and opening the final 17-19 span that completes the canonical
    19-outcome B1 tier for ro. Authored fresh from general standard
    Romanian grammar knowledge (matching b1_unit01-16 precedent; the
    Peace Corps Moldova source used throughout ro's corpus was re-checked
    for this topic and has no dedicated hypothetical-conditional lesson).

    Teaches universal.b1.hypotheticals.express_hypothetical_conditions_
    with_conditional: the Romanian unreal/counterfactual conditional --
    "dacă" + conditional-mood "aş fi"/"aş avea" in the if-clause together
    with "aş" + infinitive-derived short-infinitive verb form in the main
    clause (Romania's synthetic conditional-optative, e.g. "aş citi", "aş
    călători") -- and, separately, the conditional used ALONE (no
    if-clause) to soften a suggestion or preference ("Aş prefera să...").
    This is grammatically distinct from b1_unit13's REAL condition
    ("dacă termin raportul, pot pleca" -- present indicative in the
    if-clause, a genuinely possible future condition): here the if-clause
    itself is marked with the conditional mood ("dacă aş avea", "dacă aş
    fi"), which in Romanian is how the unreal/counterfactual "if I had"/
    "if I were" sense is expressed (Romanian does not have a separate
    pluperfect-subjunctive if-clause form for hypotheticals the way
    French/Italian do; the conditional mood in both clauses IS the
    irrealis marker). Every teaching card and grammar note makes this
    explicit so the unit cannot be confused with unit13's real-condition
    construction.

    Scenario: continues Ana, Mihai, and Diana at the same office
    (established a1_unit17/a2_unit26/b1_unit02-16), same dumneavoastră-
    formal register. Ana imagines what she would do with more time or
    money (a personal hypothetical, consistent with her established
    profesoară profession -- teaching more or attending conferences, not
    a contradicted fact); Mihai uses the conditional alone to soften a
    suggestion about a shared errand. No character's established
    profession or biography is altered. All genuinely new vocabulary is
    introduced self-contained within this file; no sibling-direction
    overlay was consulted while authoring.
