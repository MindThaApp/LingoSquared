        teaching:
          - {"content_key": "ro.a2.unit90.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Mihai, de ce mergi la piață?", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Mihai", "de", "ce", "mergi", "la", "piață"]}
          - {"content_key": "ro.a2.unit90.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Ca să cumpăr fructe. Vrei ceva?", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Ca", "să", "cumpăr", "fructe", "Vrei", "ceva"]}
          - {"content_key": "ro.a2.unit90.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Da, pâine. Îți scriu lista ca să nu uiți.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Da", "pâine", "Îți", "scriu", "lista", "ca", "să", "nu", "uiți"]}
          - {"content_key": "ro.a2.unit90.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Mulțumesc. Iau autobuzul ca să ajung repede.", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Mulțumesc", "Iau", "autobuzul", "ca", "să", "ajung", "repede"]}
          - {"content_key": "ro.a2.unit90.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Bine. Îți dau banii ca să plătești.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Bine", "Îți", "dau", "banii", "ca", "să", "plătești"]}
          - {"content_key": "ro.a2.unit90.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Nu e nevoie! Ies acum ca să nu întârzii.", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Nu", "e", "nevoie", "Ies", "acum", "ca", "să", "nu", "întârzii"]}
          - {"content_key": "ro.a2.unit90.lesson06.teach.d7", "kind": "dialogue", "target": {"text": "Atunci pa! Te sun diseară ca să vorbim.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Atunci", "pa", "Te", "sun", "diseară", "ca", "să", "vorbim"]}
        exercises:
          - {"content_key": "ro.a2.unit90.lesson06.exercise01.asculta_deschidere", "type": "listen_select", "tested_text": "Mihai de ce mergi la piață", "media_asset_key": "ro.a2.audio.dialogue.ca_sa.01", "prompt": {"target_blocks": []}}
          - {"content_key": "ro.a2.unit90.lesson06.exercise02.intelege_fructe", "type": "dialogue_comprehension", "tested_text": "Ca să cumpăr fructe", "media_asset_key": "ro.a2.audio.dialogue.ca_sa.01", "prompt": {"target_blocks": [{"text": "Why does Mihai go to the market?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit90.lesson06.exercise03.une_dialog", "type": "matching_pairs", "tested_text": "De ce mergi la piață Ca să cumpăr fructe Îți scriu lista ca să nu uiți Iau autobuzul ca să ajung repede Îți dau banii ca să plătești Ies acum ca să nu întârzii Nu e nevoie Te sun diseară ca să vorbim", "prompt": {"target_blocks": []}, "pairs": [{"left": "De ce mergi la piață?", "right": "Why are you going to the market?"}, {"left": "Ca să cumpăr fructe.", "right": "To buy fruit."}, {"left": "Îți scriu lista ca să nu uiți.", "right": "I'll write you the list so that you don't forget."}, {"left": "Iau autobuzul ca să ajung repede.", "right": "I take the bus to arrive quickly."}, {"left": "Îți dau banii ca să plătești.", "right": "I'll give you the money so that you can pay."}, {"left": "Ies acum ca să nu întârzii.", "right": "I'm going out now so that I won't be late."}, {"left": "Nu e nevoie!", "right": "No need!"}, {"left": "Te sun diseară ca să vorbim.", "right": "I'll call you tonight so that we can talk."}]}
          - {"content_key": "ro.a2.unit90.lesson06.exercise04.ordine_autobuz", "type": "word_order", "tested_text": "Iau autobuzul ca să ajung repede", "prompt": {"target_blocks": []}, "word_bank": ["repede", "ajung", "să", "ca", "autobuzul", "Iau"]}
          - {"content_key": "ro.a2.unit90.lesson06.exercise05.raspunde_piata", "type": "dialogue_response", "tested_text": "Ca să cumpăr fructe", "prompt": {"target_blocks": [{"text": "De ce mergi la piață?", "language_code": "ro", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit90.lesson06.exercise06.traduce_sun", "type": "translation", "tested_text": "Te sun diseară ca să vorbim", "prompt": {"target_blocks": [{"text": "I'll call you tonight so that we can talk.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit90.lesson06.exercise07.scrie_doua", "type": "writing_prompt", "tested_text": "Ies devreme ca să nu întârzii Îți dau banii ca să plătești", "prompt": {"target_blocks": [{"text": "Write two Romanian sentences, in order: (1) I leave early so that I won't be late. (2) I give you the money so that you can pay.", "language_code": "en", "direction": "ltr"}]}}
