          - {"content_key": "ro.a2.unit90.lesson05.exercise03.une_mesaje", "type": "matching_pairs", "tested_text": "Sâmbătă merg la piață ca să cumpăr fructe Iau autobuzul ca să ajung repede Scriu o listă ca să nu uit Vrei ceva Îți dau banii ca să plătești Eu rămân acasă ca să lucrez Cumpăr pâine și lapte", "prompt": {"target_blocks": []}, "pairs": [{"left": "Sâmbătă merg la piață ca să cumpăr fructe.", "right": "On Saturday I go to the market to buy fruit."}, {"left": "Iau autobuzul ca să ajung repede.", "right": "I take the bus to arrive quickly."}, {"left": "Scriu o listă ca să nu uit.", "right": "I write a list so that I don't forget."}, {"left": "Vrei ceva?", "right": "Do you want something?"}, {"left": "Îți dau banii ca să plătești.", "right": "I give you the money so that you can pay."}, {"left": "Eu rămân acasă ca să lucrez.", "right": "I stay home to work."}, {"left": "Cumpăr pâine și lapte.", "right": "I buy bread and milk."}]}
