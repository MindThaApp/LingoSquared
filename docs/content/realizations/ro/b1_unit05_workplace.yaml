generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's fifth B1 unit, continuing the b1_unit01-04 authoring pass.
    Source-material check redone for this specific topic before authoring:
    `firecrawl --status` still showed 0/1,000 credits (0% left this cycle,
    same state as b1_unit01's original check), so `firecrawl search` for
    "FSI Romanian workplace meetings" was attempted anyway to confirm
    (returned a 402 credit-exhausted error, not a content result). Fell
    back to re-checking the same public-domain source used for ro's A1/A2
    units and b1_unit01-04 ("Basic Romanian Language Lessons," US Peace
    Corps Moldova, public domain,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) via its existing local text
    extraction: grepped for meeting/workplace-proposal vocabulary
    (ședință, întâlnire, propun, sugerez, ordinea de zi, reuniune) across
    the full 785-line extraction -- zero hits. This source is confirmed
    (a fourth time, on a fourth different B1 topic) to be beginner
    phrasebook-only with no workplace-meeting or professional-register
    content of any kind. This unit is therefore authored fresh from
    general standard Romanian grammar knowledge, not adapted from source
    material, matching b1_unit01-04's precedent.

    Teaches the spine outcome's "softened conditional form" for
    formal-register workplace suggestions and requests: conditional-
    optativ "aș propune" (I would propose), "ați putea" (could you,
    softened from the flatter imperative/present "puteți"), and "v-aș
    ruga" (I would ask you to) -- three genuinely distinct softened
    request/suggestion constructions rather than one pattern repeated,
    matching the spine's "a formal-register suggestion, request, or
    proposal" framing broadly rather than narrowly. All three reuse the
    conditional-optativ mood already established in b1_unit03's
    hypotheticals unit (its own spine prerequisite via
    universal.a1.work.describe_job -> this outcome's actual prerequisite
    is describe_job, but the GRAMMAR itself continues unit03's mood
    directly), now repurposed from counterfactual conditions to polite
    workplace register -- a genuine, independently real function of the
    Romanian conditional (softening directness), not an invented pattern.

    Scenario: a project-status meeting at Mihai's office (established
    workplace from a1_unit17/a2_unit26/b1_unit02-04), continuing Ana,
    Mihai, and Diana with the same formal dumneavoastră register
    established corpus-wide for this office. Ana proposes an earlier
    meeting time and a schedule; Mihai and Diana respond with requests
    of their own about the status report and the agenda; lesson05's
    reading is a short follow-up professional email from Mihai recapping
    the meeting's decisions, giving the "read a short professional email
    or meeting note" assessment requirement a genuine written artifact
    rather than only spoken dialogue. Deliberately reuses "sunt de acord"/
    "de acord" (b1_unit04) and "echipa"/"raportul"-adjacent office
    vocabulary already established, so this unit reads as a continuation
    of the same ongoing workplace, not a disconnected new scenario. All
    vocabulary is introduced self-contained within this file; no other
    session's sibling-direction overlay was consulted while authoring.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fresh-context adversarial review completed 2026-07-11 (Opus, zero
    access to the authoring reasoning); all AUTHORING_GUIDE.md #20
    sweeps and grammar/register/character checks passed, compiler
    green. Ship-ready.

course:
  realization_key: ro.b1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continues the established dumneavoastră-default register from ro
    A1/A2/B1 (units 01-26, b1_unit01-04): Ana, Mihai, and Diana all
    address each other formally throughout, matching the existing
    corpus-wide office relationship.

