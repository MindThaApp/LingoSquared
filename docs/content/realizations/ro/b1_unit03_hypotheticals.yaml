generation_provenance:
  method: ai_generated
  authoring_system: claude
  notes: >-
    Romanian's third B1 unit, same authoring pass as b1_unit01/b1_unit02
    (see b1_unit01's provenance note for the firecrawl-down/source-recheck
    detail, which applies identically here -- fresh-authored from general
    standard Romanian grammar knowledge, no adaptable source content
    exists for conditional-mood grammar in the Peace Corps Moldova PD
    source).

    Teaches the real/possible vs unreal/counterfactual conditional
    contrast the spine outcome asks for: "dacă + prezent, + viitor" for
    a real condition ("Dacă am timp, voi merge la birou" -- if I have
    time, I will go to the office) vs "dacă + condițional-optativ, +
    condițional-optativ" for an unreal one ("Dacă aș avea timp, aș merge
    la birou" -- if I had time, I would go to the office) -- both
    clauses genuinely share the same mood in each type, matching the
    spine outcome's "condition and result clause in the correct matching
    mood/tense pairing" requirement exactly, not an approximation.
    Builds on unit01's necessity unit as its own spine prerequisite.

    Two real, worth-flagging Romanian facts used as this unit's own
    grammar points: (1) viitor (future) and condițional-optativ both use
    an INVARIANT short-infinitive main verb (merge for every person)
    with all person-marking on the auxiliary instead (voi/vei/va/vom/
    veți/vor for future; aș/ai/ar/am/ați/ar for conditional) -- the
    reverse distribution from unit01/02's să-clauses, where the
    auxiliary/modal was the fixed part and the embedded verb conjugated;
    (2) a genuine homograph pair that's a real interference risk:
    future-auxiliary "voi" (1st-person-singular "I will") is spelled
    identically to the pronoun "voi" (2nd-person-plural "you all," used
    for dumneavoastră) -- resolved only by whether it's followed by a
    bare verb stem or stands as a subject; flagged explicitly in the
    lesson01 grammar note and overlay note since this is a real,
    non-obvious ambiguity for a learner. Also flagged: conditional
    "ai" (2nd-sg auxiliary, "you would...") is spelled identically to
    indicativ-prezent "ai" (tu ai = "you have"), and "poate" recurs with
    a second meaning here (adverb "maybe," distinct from unit02's modal
    verb "poate" = "he/she can") -- both genuine homographs, both
    resolved by context, both worth a learner's attention.

    Continues Ana, Mihai, and Diana (established in unit02) with the
    same formal register. Lesson04's weekend-plans dialogue and
    lesson05's Diana reading are new scenarios, not reused text from any
    other unit or language. All vocabulary is introduced self-contained
    within this file.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Not yet reviewed. Needs the mandatory fresh-context review before
    being considered ship-ready, per AUTHORING_GUIDE.md #9.

course:
