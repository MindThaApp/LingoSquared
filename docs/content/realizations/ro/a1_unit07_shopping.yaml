          - content_key: ro.a1.unit07.lesson02.exercise08.speak_unde_pot_sa_cumpar_rosii
            type: speak_response
            tested_text: "unde pot să cumpăr roșii"
            prompt:
              target_blocks:
                - {text: "Say: Where can I buy tomatoes?", language_code: en, direction: ltr}

      - content_key: ro.a1.unit07.lesson03.la_piata
        title: "La piață"
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere
            kind: grammar_note
            target: {text: "bună · ziua · mulțumesc · bine · la revedere · Ana · Mihai", language_code: ro, direction: ltr}
