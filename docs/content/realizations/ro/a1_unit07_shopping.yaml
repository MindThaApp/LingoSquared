units:
  - content_key: ro.a1.unit07.shopping
    title: "Cumpărături"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.shopping.ask_prices_quantities
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit07.lesson01.cat_costa
        title: "Cât costă?"
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: ro.a1.unit07.lesson01.teach.reminder_un_numere
            kind: grammar_note
            target: {text: "un · doi · cinci · zece · douăzeci", language_code: ro, direction: ltr}
            introduced_tokens: [un, doi, cinci, zece, douăzeci]
          - content_key: ro.a1.unit07.lesson01.teach.cat_costa
            kind: phrase
            target: {text: "Cât costă?", language_code: ro, direction: ltr}
            introduced_tokens: [cât, costă]
          - content_key: ro.a1.unit07.lesson01.teach.leu
            kind: vocabulary
            target: {text: "Leu", language_code: ro, direction: ltr}
            introduced_tokens: [leu]
            example: {text: "Costă un leu.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson01.teach.costa_cinci_lei
            kind: phrase
            target: {text: "Costă cinci lei.", language_code: ro, direction: ltr}
            introduced_tokens: [costă, cinci, lei]
          - content_key: ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei
            kind: phrase
            target: {text: "Costă douăzeci de lei.", language_code: ro, direction: ltr}
            introduced_tokens: [costă, douăzeci, de, lei]
          - content_key: ro.a1.unit07.lesson01.teach.leu_lei_de_rule
            kind: grammar_note
            target: {text: "leu → lei · 2-19 fără „de” · 20+ cu „de”", language_code: ro, direction: ltr}
            introduced_tokens: []
          - content_key: ro.a1.unit07.lesson01.teach.scump
            kind: vocabulary
            target: {text: "Scump", language_code: ro, direction: ltr}
            introduced_tokens: [scump]
            example: {text: "Cinci lei? Scump!", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson01.teach.ieftin
            kind: vocabulary
            target: {text: "Ieftin", language_code: ro, direction: ltr}
            introduced_tokens: [ieftin]
            example: {text: "Un leu? Ieftin!", language_code: ro, direction: ltr}
        exercises:
          - content_key: ro.a1.unit07.lesson01.exercise01.choose_cat_costa
            type: multiple_choice
            tested_text: "cât costă"
            prompt:
              target_blocks:
                - {text: "How much does it cost?", language_code: en, direction: ltr}
          - content_key: ro.a1.unit07.lesson01.exercise02.choose_scump
            type: multiple_choice
            tested_text: "scump"
            prompt:
              target_blocks:
                - {text: "expensive", language_code: en, direction: ltr}
          - content_key: ro.a1.unit07.lesson01.exercise03.listen_costa_cinci_lei
            type: listen_select
            tested_text: "Costă cinci lei"
            media_asset_key: ro.a1.audio.shopping.costa_cinci_lei.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit07.lesson01.exercise04.match_pret
            type: matching_pairs
            tested_text: "cât costă leu scump ieftin doi cinci zece douăzeci"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Cât costă?", right: "How much does it cost?"}
              - {left: "Leu", right: "currency (lei)"}
              - {left: "Scump", right: "expensive"}
              - {left: "Ieftin", right: "cheap"}
              - {left: "doi", right: "two"}
              - {left: "cinci", right: "five"}
              - {left: "zece", right: "ten"}
              - {left: "douăzeci", right: "twenty"}
          - content_key: ro.a1.unit07.lesson01.exercise05.order_costa_un_leu
            type: word_order
            tested_text: "Costă un leu"
            prompt: {target_blocks: []}
            word_bank: ["Costă", "un", "leu"]
          - content_key: ro.a1.unit07.lesson01.exercise06.listen_order_costa_douazeci_de_lei
            type: listen_order
            tested_text: "Costă douăzeci de lei"
            media_asset_key: ro.a1.audio.shopping.costa_douazeci_de_lei.01
            prompt: {target_blocks: []}
            word_bank: ["douăzeci", "de", "Costă", "lei"]
          - content_key: ro.a1.unit07.lesson01.exercise07.complete_scump
            type: fill_in_blank
            tested_text: "Scump"
            prompt:
              target_blocks:
                - {text: "Cinci lei? ___!", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson01.exercise08.speak_cat_costa
            type: speak_response
            tested_text: "cât costă"
            prompt:
              target_blocks:
                - {text: "Say: How much does it cost?", language_code: en, direction: ltr}

      - content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
        title: "Roșii și cartofi"
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog
            kind: grammar_note
            target: {text: "un · o · și · aș dori · vă rog · te rog", language_code: ro, direction: ltr}
            introduced_tokens: [un, o, și, aș, dori, vă, te, rog]
          - content_key: ro.a1.unit07.lesson02.teach.piata
            kind: vocabulary
            target: {text: "Piață", language_code: ro, direction: ltr}
            introduced_tokens: [piață]
            example: {text: "Cât costă la piață?", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson02.teach.rosii
            kind: vocabulary
            target: {text: "Roșii", language_code: ro, direction: ltr}
            introduced_tokens: [roșii]
            example: {text: "Aș dori roșii.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson02.teach.cartofi
            kind: vocabulary
            target: {text: "Cartofi", language_code: ro, direction: ltr}
            introduced_tokens: [cartofi]
            example: {text: "Aș dori cartofi.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson02.teach.kilogram
            kind: vocabulary
            target: {text: "Kilogram", language_code: ro, direction: ltr}
            introduced_tokens: [kilogram]
            example: {text: "Un kilogram de roșii.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson02.teach.vreau
            kind: vocabulary
            target: {text: "Vreau", language_code: ro, direction: ltr}
            introduced_tokens: [vreau]
            example: {text: "Vreau cartofi.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar
            kind: phrase
            target: {text: "Unde pot să cumpăr roșii?", language_code: ro, direction: ltr}
            introduced_tokens: [unde, pot, să, cumpăr, roșii]
          - content_key: ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii
            kind: phrase
            target: {text: "Cât costă un kilogram de roșii?", language_code: ro, direction: ltr}
            introduced_tokens: [cât, costă, un, kilogram, de, roșii]
          - content_key: ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi
            kind: phrase
            target: {text: "Vreau un kilogram de cartofi.", language_code: ro, direction: ltr}
            introduced_tokens: [vreau, un, kilogram, de, cartofi]
        exercises:
          - content_key: ro.a1.unit07.lesson02.exercise01.choose_piata
            type: multiple_choice
            tested_text: "piață"
            prompt:
              target_blocks:
                - {text: "market", language_code: en, direction: ltr}
          - content_key: ro.a1.unit07.lesson02.exercise02.choose_unde_pot_sa_cumpar
            type: multiple_choice
            tested_text: "unde pot să cumpăr"
            prompt:
              target_blocks:
                - {text: "Where can I buy ...?", language_code: en, direction: ltr}
          - content_key: ro.a1.unit07.lesson02.exercise03.listen_vreau_kilogram_cartofi
            type: listen_select
            tested_text: "Vreau un kilogram de cartofi"
            media_asset_key: ro.a1.audio.shopping.vreau_kilogram_cartofi.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit07.lesson02.exercise04.match_piata
            type: matching_pairs
            tested_text: "piață roșii cartofi kilogram vreau aș dori unde pot să cumpăr vă rog"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Piață", right: "market"}
              - {left: "Roșii", right: "tomatoes"}
              - {left: "Cartofi", right: "potatoes"}
              - {left: "Kilogram", right: "kilogram"}
              - {left: "Vreau", right: "I want"}
              - {left: "Aș dori", right: "I would like"}
              - {left: "Unde pot să cumpăr ...?", right: "Where can I buy ...?"}
              - {left: "Vă rog", right: "please (formal)"}
          - content_key: ro.a1.unit07.lesson02.exercise05.order_vreau_kilogram_cartofi
            type: word_order
            tested_text: "Vreau un kilogram de cartofi"
            prompt: {target_blocks: []}
