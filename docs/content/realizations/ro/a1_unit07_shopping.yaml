generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-06
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf, freshly re-fetched via curl +
    pdftotext -layout for this unit -- the same real extractable text
    layer, not a scan). The source has NO dedicated shopping/market
    lesson -- confirmed by grepping every "Lesson N:" header (8
    Articles, 9 Numbers, 11 Months, 13 Adverbs/Adjectives, 14 Food and
    Drinks, 16 Listening Exercises) and every occurrence of
    piață/cumpăr/leu/preț/cost/magazin/bani/dolar/scump/ieftin in the
    full extracted text: only two real hits, both from the same Lesson
    4 "basic questions and answers" block already used for unit06's own
    sourcing ("Unde pot să cumpăr cafea?" / "Cît costă o cafea?"). Both
    are used here as real sourced anchors, respelled from the source's
    pre-1993 Moldovan/Communist-era î-everywhere and cedilla-diacritic
    spelling (cumpăr/costă were already unmarked; "Cît" -> "Cât") to
    modern standard Romanian orthography, the identical modernization
    already applied in units 01-06, not a dialect swap: "Cît costă o
    cafea?" generalizes to this unit's core "Cât costă ...?" (How much
    does ... cost?) question phrase (lesson01), and "Unde pot să cumpăr
    cafea?" generalizes to "Unde pot să cumpăr ...?" (Where can I buy
    ...?) (lesson02). Everything else is freshly authored and honestly
    disclosed as such, per AUTHORING_GUIDE #10's "if the source doesn't
    cover the topic adequately, author fresh": the leu/lei currency
    vocabulary and its 2-19-fără-"de"/20+-cu-"de" counting rule (a real,
    independently-known standard Romanian grammar point, deliberately
    built as the same pattern already taught for ani in unit02, not
    re-sourced); scump/ieftin; piață; roșii and cartofi as market-item
    vocabulary (explicitly scoped out of unit06's own food unit for this
    reason, per that file's own provenance note); kilogram and the
    partitive "kilogram de ..." quantity construction; vreau as a
    plainer alternative to unit06's aș dori; every vocabulary example:
    sentence (AUTHORING_GUIDE #19); and lesson03's closing Ana/Mihai
    market dialogue, a new scenario continuing the recurring characters,
    reusing only this unit's own vocabulary plus the reminder-declared
    bună/ziua/mulțumesc/bine/la revedere/Ana/Mihai from earlier units,
    per the standing "untaught vocabulary must be re-declared per-file"
    convention. Authored at schema_version 1.1 from the start -- every
    kind:vocabulary card carries a real example: sentence with a
    matching overlay example_gloss.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude), part of the full ro A1
    course review (units 01-19). Checked clean: lesson03's
    dialogue_comprehension ("How much do the tomatoes cost?", correct
    "cinci lei") has no same-speaker collision (the distractor "zece
    lei" is the potatoes' real, different price, spoken by the same
    speaker about a different item, not an ambiguous re-attribution of
    the tomato price), no stray YAML booleans, matching_pairs/
    word_order shapes correct, every exercise type registered, no
    jargon leaks, correct and consistent diacritics, natural Romanian
    throughout. No real bugs found; no changes made to this unit.
    Seventh Romanian unit, first draft, continuing directly from unit06.
    Targets universal.a1.shopping.ask_prices_quantities, the spine
    outcome immediately following universal.a1.food.order_simple_meal in
    universal_spine.yaml's own order -- confirmed by grepping
    universal_spine.yaml directly (food -> shopping -> places in that
    order) and cross-checked against nl's own unit07
    (a1_unit07_shopping.yaml, same topic) and fa's unit08_shopping (fa's
    unit07 is "weather" instead, since fa's spine-outcome sequencing
    diverges slightly from nl's after food) -- read only for topic/scope
    confirmation, not for structure or phrasing (this course's own
    established 3-lesson bootstrap pace and Ana/Mihai characters are
    followed instead, matching units 01-06, not nl's fuller shape for
    the same topic). 3 lessons. Deliberately scoped to the core "Cât
    costă ...?" price question + leu/lei currency + scump/ieftin
    (lesson01), market-item vocabulary (piață, roșii, cartofi, kilogram,
    vreau) plus the sourced "Unde pot să cumpăr ...?" phrase (lesson02),
    and a pure-recap market dialogue (lesson03) -- explicitly does NOT
    cover clothing, sizes, colors, or a wider produce list, a real scope
    trim to keep this bootstrap unit to 3 lessons; those either belong
    to later spine outcomes (clothing.describe_buy_clothing) or would
    overload a first pass at "ask prices and quantities." Reuses this
    file's own lesson01 vocabulary (cât costă, leu, lei, de, numbers)
    directly in lesson02/03 without a fresh reminder, since that's
    within-file reuse, not cross-file -- but DOES re-declare "un/o/și"
    (from unit01/unit04) and "aș dori/vă rog/te rog" (from unit06) via a
    lesson02 reminder card, and "bună/ziua/mulțumesc/bine/la
    revedere/Ana/Mihai" (from unit01/unit03) via a lesson03 reminder
    card, before any exercise tests them, per the standing per-file
    token-scoping convention. Lesson03's dialogue deliberately introduces
    zero brand-new vocabulary in its six lines (all reuse only tokens
    already taught earlier in this same unit or re-declared from an
    earlier unit), the same pure-recap style unit01's/unit04's/unit05's/
    unit06's own lesson03s used, and closes with "Mulțumesc, Mihai! La
    revedere!" / "La revedere, Ana!" as a direct callback to unit01's,
    unit05's, and unit06's own established closing pattern.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-06's register split and Ana/Mihai's own established
    dumneavoastră register with each other. This unit reuses unit06's
    vă rog (formal)/te rog (informal) pair via a reminder rather than
    re-teaching it; the closing market dialogue keeps Ana and Mihai's
    existing polite register intact (vă rog, not te rog, between them).
    "Vreau" (I want, plain) is introduced alongside the already-taught
    "aș dori" (I would like, polite) as a genuine register/directness
    contrast, not a synonym pair -- both are accepted where an exercise
    doesn't specifically name one.

