          - {"content_key": "ro.a2.unit82.lesson05.exercise05.traduce_sigur_vin", "type": "translation", "tested_text": "Sigur o să vin la timp promit", "prompt": {"target_blocks": [{"text": "I will definitely come on time, I promise.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit82.lesson05.exercise06.sigur_o_sa_vin", "type": "dictation", "tested_text": "Sigur o să vin la timp, promit.", "media_asset_key": "ro.a2.audio.ce_va_fi_maine.sigur_o_sa_vin.01", "prompt": {"target_blocks": []}}
          - {"content_key": "ro.a2.unit82.lesson05.exercise07.seara_probabil_va_ploua", "type": "dictation", "tested_text": "Seara probabil va ploua.", "media_asset_key": "ro.a2.audio.ce_va_fi_maine.seara_probabil_va_ploua.01", "prompt": {"target_blocks": []}}
      - content_key: ro.a2.unit82.lesson06.ana_si_mihai_vorbesc
        title: "Ana și Mihai vorbesc"
        spine_outcome_id: universal.a2.future.make_predictions_and_promises
        teaching:
          - {"content_key": "ro.a2.unit82.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Mihai, cum o să fie vremea mâine?", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Mihai", "cum", "o", "să", "fie", "vremea", "mâine"]}
          - {"content_key": "ro.a2.unit82.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Probabil o să fie soare, dar seara poate o să plouă.", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Probabil", "o", "să", "fie", "soare", "dar", "seara", "poate", "plouă"]}
          - {"content_key": "ro.a2.unit82.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Atunci sigur o să mergem în parc. Vii și tu?", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Atunci", "sigur", "o", "să", "mergem", "în", "parc", "Vii", "și", "tu"]}
          - {"content_key": "ro.a2.unit82.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Nu sunt sigur. Probabil o să fiu la muncă.", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Nu", "sunt", "sigur", "Probabil", "o", "să", "fiu", "la", "muncă"]}
          - {"content_key": "ro.a2.unit82.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Bine. Atunci o să te sun seara.", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Bine", "Atunci", "o", "să", "te", "sun", "seara"]}
          - {"content_key": "ro.a2.unit82.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Și eu o să te sun, promit!", "language_code": "ro", "direction": "ltr", "speaker": "Mihai"}, "introduced_tokens": ["Și", "eu", "o", "să", "te", "sun", "promit"]}
          - {"content_key": "ro.a2.unit82.lesson06.teach.d7", "kind": "dialogue", "target": {"text": "Perfect! Pe mâine!", "language_code": "ro", "direction": "ltr", "speaker": "Ana"}, "introduced_tokens": ["Perfect", "Pe", "mâine"]}
        exercises:
          - {"content_key": "ro.a2.unit82.lesson06.exercise01.asculta_deschidere", "type": "listen_select", "tested_text": "Mihai cum o să fie vremea mâine", "media_asset_key": "ro.a2.audio.dialogue.ce_va_fi_maine.01", "prompt": {"target_blocks": []}}
          - {"content_key": "ro.a2.unit82.lesson06.exercise02.intelege_vreme", "type": "dialogue_comprehension", "tested_text": "probabil o să fie soare dar seara poate o să plouă", "media_asset_key": "ro.a2.audio.dialogue.ce_va_fi_maine.01", "prompt": {"target_blocks": [{"text": "What does Mihai say about tomorrow's weather?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit82.lesson06.exercise03.une_dialog", "type": "matching_pairs", "tested_text": "Cum o să fie vremea mâine Probabil o să fie soare Seara poate o să plouă Sigur o să mergem în parc Nu sunt sigur Probabil o să fiu la muncă O să te sun seara Și eu o să te sun promit", "prompt": {"target_blocks": []}, "pairs": [{"left": "Cum o să fie vremea mâine?", "right": "What will the weather be like tomorrow?"}, {"left": "Probabil o să fie soare.", "right": "It will probably be sunny."}, {"left": "Seara poate o să plouă.", "right": "Maybe it will rain in the evening."}, {"left": "Sigur o să mergem în parc.", "right": "We will definitely go to the park."}, {"left": "Nu sunt sigur.", "right": "I'm not sure."}, {"left": "Probabil o să fiu la muncă.", "right": "I will probably be at work."}, {"left": "O să te sun seara.", "right": "I will call you in the evening."}, {"left": "Și eu o să te sun, promit!", "right": "I will call you too, I promise!"}]}
          - {"content_key": "ro.a2.unit82.lesson06.exercise04.ordine_sun", "type": "word_order", "tested_text": "Atunci o să te sun seara", "prompt": {"target_blocks": []}, "word_bank": ["seara", "sun", "te", "să", "o", "Atunci"]}
          - {"content_key": "ro.a2.unit82.lesson06.exercise05.raspunde_parc", "type": "dialogue_response", "tested_text": "Nu sunt sigur Probabil o să fiu la muncă", "prompt": {"target_blocks": [{"text": "Vii și tu în parc?", "language_code": "ro", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit82.lesson06.exercise06.traduce_sun", "type": "translation", "tested_text": "Mâine seara o să te sun promit", "prompt": {"target_blocks": [{"text": "Tomorrow evening I will call you, I promise.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ro.a2.unit82.lesson06.exercise07.scrie_doua", "type": "writing_prompt", "tested_text": "Seara poate o să plouă Promit că o să te sun", "prompt": {"target_blocks": [{"text": "Write two Romanian sentences, in order: (1) Maybe it will rain in the evening. (2) I promise I will call you.", "language_code": "en", "direction": "ltr"}]}}
