            target: {text: "cam", language_code: ro, direction: ltr}
            introduced_tokens: [cam]
            example: {text: "Este cam târziu.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.oarecum
            kind: vocabulary
            target: {text: "oarecum", language_code: ro, direction: ltr}
            introduced_tokens: [oarecum]
            example: {text: "Este oarecum dificil.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.lunga
            kind: vocabulary
            target: {text: "lungă", language_code: ro, direction: ltr}
            introduced_tokens: [lungă, lung]
            example: {text: "Introducerea este lungă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.scurta
            kind: vocabulary
            target: {text: "scurtă", language_code: ro, direction: ltr}
            introduced_tokens: [scurtă, scurt]
            example: {text: "Concluzia este scurtă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.concluzia
            kind: vocabulary
            target: {text: "concluzia", language_code: ro, direction: ltr}
            introduced_tokens: [concluzia, concluzie]
            example: {text: "Concluzia este scurtă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.neclara
            kind: vocabulary
            target: {text: "neclară", language_code: ro, direction: ltr}
            introduced_tokens: [neclară, neclar]
            example: {text: "Ideea este neclară.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.personal_cred_ca
            kind: phrase
            target: {text: "Personal, cred că...", language_code: ro, direction: ltr}
            introduced_tokens: [Personal, cred, că]
          - content_key: ro.b2.unit03.lesson01.teach.mi_se_pare_ca
            kind: phrase
            target: {text: "mi se pare că...", language_code: ro, direction: ltr}
            introduced_tokens: [mi, se, pare, că]
          - content_key: ro.b2.unit03.lesson01.teach.grammar_atenuare
            kind: grammar_note
            target: {text: "Introducerea este cam lungă. Mi se pare că este oarecum lungă. Personal, cred că concluzia este scurtă.", language_code: ro, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ro.b2.unit03.lesson01.exercise01.recognize_cam
            type: multiple_choice
            tested_text: "cam"
            prompt: {target_blocks: [{text: cam, language_code: ro, direction: ltr}]}
          - content_key: ro.b2.unit03.lesson01.exercise02.listen_introducerea_lunga
            type: listen_select
            tested_text: "Introducerea este cam lungă"
            media_asset_key: ro.b2.audio.nuante.introducerea_lunga.01
            prompt: {target_blocks: []}
          - content_key: ro.b2.unit03.lesson01.exercise03.match_hedge_words
            type: matching_pairs
            tested_text: "raportul introducerea cam oarecum lungă scurtă personal cred că mi se pare că"
            prompt: {target_blocks: []}
            pairs:
              - {left: raportul, right: "the report"}
              - {left: introducerea, right: "the introduction"}
              - {left: cam, right: "rather / somewhat"}
              - {left: oarecum, right: somewhat}
              - {left: lungă, right: long}
              - {left: scurtă, right: short}
              - {left: "Personal, cred că...", right: "Personally, I think that..."}
              - {left: "mi se pare că...", right: "it seems to me that..."}
          - content_key: ro.b2.unit03.lesson01.exercise04.order_introducerea_lunga
            type: word_order
            tested_text: "Introducerea este cam lungă"
            prompt: {target_blocks: []}
            word_bank: [Introducerea, este, cam, lungă]
          - content_key: ro.b2.unit03.lesson01.exercise05.translate_oarecum_neclara
            type: translation
            tested_text: "Concluzia este oarecum neclară"
            prompt: {target_blocks: [{text: "The conclusion is somewhat unclear.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit03.lesson01.exercise06.speak_personal_cred
            type: speak_response
            tested_text: "Personal, cred că introducerea este cam lungă"
            prompt: {target_blocks: [{text: "Say aloud in Romanian: Personally, I think the introduction is rather long.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit03.lesson01.exercise07.write_mi_se_pare
            type: writing_prompt
            tested_text: "Mi se pare că concluzia este oarecum neclară"
            prompt: {target_blocks: [{text: "Write in Romanian: It seems to me that the conclusion is somewhat unclear.", language_code: en, direction: ltr}]}
          - content_key: ro.b2.unit03.lesson01.exercise08.dictation_introducerea_lunga
            type: dictation
            tested_text: "Introducerea este cam lungă"
            media_asset_key: ro.b2.audio.nuante.introducerea_lunga.01
            prompt: {target_blocks: []}

      - content_key: ro.b2.unit03.lesson02.formulare_prudenta
