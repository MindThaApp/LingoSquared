        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: ro.b2.unit03.lesson01.teach.raportul
            kind: vocabulary
            target: {text: "raportul", language_code: ro, direction: ltr}
            introduced_tokens: [raportul, raport]
            example: {text: "Raportul Dianei este bun.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.introducerea
            kind: vocabulary
            target: {text: "introducerea", language_code: ro, direction: ltr}
            introduced_tokens: [introducerea, introducere]
            example: {text: "Introducerea este scurtă.", language_code: ro, direction: ltr}
          - content_key: ro.b2.unit03.lesson01.teach.cam
