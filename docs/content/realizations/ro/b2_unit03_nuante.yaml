schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ro
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ro's
    third B2 unit (discourse: hedging and emphasis). Built from general
    Romanian grammar/discourse knowledge, the same from-scratch disclosure
    the nl B2 lane set. Sibling isolation honored: the ro-en B2 nuance
    realization and every other language's B2 file were treated as
    non-existent and were not opened; the nl B2 exemplar informed
    structure only (lesson pacing, exercise-type sequencing), never text
    -- the scenario (Mihai giving Diana feedback on her report) and every
    Romanian sentence were composed from scratch. Character canon
    consulted directly from the ro corpus: "raportul" (the report) as a
    recurring workplace object is already established
    (b1_unit05_workplace.yaml, b1_unit18_intalniri_profesionale.yaml --
    Diana is repeatedly asked about a report's status), and every
    Ana/Mihai/Diana exchange in the corpus (a2_unit26, b1_unit05/06/09/
    10/12/14/15/18/19) uses formal dumneavoastra with each other without
    exception, including toward Diana -- continued here unchanged. No
    sibling-direction file (ro-en) was consulted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Romanian confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of the hedging words (cam, oarecum,
    relativ, "pana la un punct") and whether they read as genuinely
    softening criticism to a native ear, not just literal translations of
    "somewhat/rather"; (2) the emphasis-stacking sentence "chiar foarte
    buna" -- confirm stacking two emphasis words this way is natural
    spoken Romanian and not overdone; (3) the cleft/focus construction
    "Ceea ce mi-a placut cel mai mult a fost analiza" and "Tocmai
    concluzia este partea cea mai reusita" -- confirm both read as
    natural focus constructions, not calques; (4) confirm the formal
    dumneavoastra register toward Diana (established corpus-wide) is
    conjugated correctly in every line addressed to her (credeti, v-a
    placut); (5) confirm "reusit/reusita", "neclara", and "impresionanta"
    read as current everyday Romanian workplace-feedback vocabulary.
  notes: >-
    Third Romanian B2 unit; first nuance unit. Targets the CEFR B2
    discourse-nuance outcome
    (universal.b2.discourse.express_nuance_with_hedging_and_emphasis):
    soften or strengthen a statement (hedging, qualification, emphasis,
    and focus constructions) so the same content can be delivered
    tentatively, neutrally, or emphatically. Theme: one coherent workplace
    scenario across all six lessons -- Mihai reviews Diana's report and
    gives feedback that hedges criticism and emphasizes praise. Lesson
    arc: L01 softening a criticism (cam, oarecum, personal cred că, mi se
    pare că), L02 formulating cautiously (aș spune că, s-ar putea spune
    că, până la un punct, relativ), L03 emphasizing praise (chiar, foarte,
    extrem de, absolut, într-adevăr, and stacking two for extra force),
    L04 focus/cleft constructions (ceea ce ... a fost, tocmai), L05 a
    short written feedback note combining both moves, L06 the culminating
    production -- a Mihai/Diana feedback conversation for the listening
    requirement plus a speaking task and a writing task that each require
    BOTH a hedge and an emphasis in the same short passage, not just
    connective drilling. Register: formal dumneavoastra throughout,
    including Mihai/Diana (established corpus-wide). All vocabulary is
    introduced self-contained within the ro B2 course (cumulative with
    units 01-02, per this course's own token accumulation -- reuses
    "raport"-adjacent structure, "s-ar putea", "cred că", "parte", "mai",
    "bun/bună" etc. already taught earlier in the course). No
    sibling-direction file was consulted; the nl B2 exemplar informed
    structure only, not text.

course:
  realization_key: ro.b2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Formal dumneavoastra throughout (ro lane pin, continued from units
    01-02). Mihai addresses Diana formally, and Diana addresses Mihai
    formally, matching every established Ana/Mihai/Diana exchange in the
    corpus. B2 nuance layers hedging and emphasis onto that register --
    cam, oarecum, aș spune că, chiar, foarte, într-adevăr -- while keeping
    the formal 2nd-person-plural verb forms (credeți, v-a plăcut)
    whenever Mihai and Diana address each other directly.

