units:
  - content_key: ro.a1.unit12.past_events
    title: "Ieri"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.past_events.describe_recent_event
    planned_lesson_count: 3

    lessons:
      - content_key: ro.a1.unit12.lesson01.am_fost_la_parc
        title: "Am fost la parc"
        spine_outcome_id: universal.a1.past_events.describe_recent_event
        teaching:
          - content_key: ro.a1.unit12.lesson01.teach.reminder_parc_cinema
            kind: grammar_note
            target: {text: "parc · cinema", language_code: ro, direction: ltr}
            introduced_tokens: [parc, cinema]
          - content_key: ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata
            kind: grammar_note
            target: {text: "astăzi · mâine · duminică · sâmbătă", language_code: ro, direction: ltr}
            introduced_tokens: [astăzi, mâine, duminică, sâmbătă]
          - content_key: ro.a1.unit12.lesson01.teach.am_fost_vocab
            kind: vocabulary
            target: {text: "Am fost", language_code: ro, direction: ltr}
            introduced_tokens: [am, fost]
            example:
              - {text: "Am fost la parc.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit12.lesson01.teach.am_fost_parc_phrase
            kind: phrase
            target: {text: "Am fost la parc.", language_code: ro, direction: ltr}
            introduced_tokens: [am, fost, la, parc]
          - content_key: ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase
            kind: phrase
            target: {text: "Am fost la cinema.", language_code: ro, direction: ltr}
            introduced_tokens: [am, fost, la, cinema]
          - content_key: ro.a1.unit12.lesson01.teach.ieri_vocab
            kind: vocabulary
            target: {text: "Ieri", language_code: ro, direction: ltr}
            introduced_tokens: [ieri]
            example:
              - {text: "Ieri am fost la parc.", language_code: ro, direction: ltr}
          - content_key: ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase
            kind: phrase
            target: {text: "Ieri am fost la parc.", language_code: ro, direction: ltr}
            introduced_tokens: [ieri, am, fost, la, parc]
        exercises:
          - content_key: ro.a1.unit12.lesson01.exercise01.choose_am_fost
            type: multiple_choice
            tested_text: "am fost"
            prompt:
              target_blocks:
                - {text: "I was / I went", language_code: en, direction: ltr}
          - content_key: ro.a1.unit12.lesson01.exercise02.choose_ieri
            type: multiple_choice
            tested_text: "ieri"
            prompt:
              target_blocks:
                - {text: "yesterday", language_code: en, direction: ltr}
          - content_key: ro.a1.unit12.lesson01.exercise03.listen_am_fost_la_parc
            type: listen_select
            tested_text: "Am fost la parc"
            media_asset_key: ro.a1.audio.past_events.am_fost_la_parc.01
            prompt: {target_blocks: []}
          - content_key: ro.a1.unit12.lesson01.exercise04.match_past_events1
            type: matching_pairs
            tested_text: "am fost ieri parc cinema astăzi mâine duminică sâmbătă"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Am fost", right: "I was / I went"}
              - {left: "Ieri", right: "yesterday"}
              - {left: "Parc", right: "the park"}
              - {left: "Cinema", right: "the cinema"}
              - {left: "Astăzi", right: "today"}
              - {left: "Mâine", right: "tomorrow"}
              - {left: "Duminică", right: "Sunday"}
              - {left: "Sâmbătă", right: "Saturday"}
          - content_key: ro.a1.unit12.lesson01.exercise05.order_am_fost_la_parc
            type: word_order
            tested_text: "Am fost la parc"
            prompt: {target_blocks: []}
            word_bank: ["la", "Am", "fost", "parc"]
          - content_key: ro.a1.unit12.lesson01.exercise06.listen_order_ieri_am_fost_la_cinema
            type: listen_order
            tested_text: "Ieri am fost la cinema"
            media_asset_key: ro.a1.audio.past_events.ieri_am_fost_la_cinema.01
            prompt: {target_blocks: []}
            word_bank: ["am", "Ieri", "la", "fost", "cinema"]
          - content_key: ro.a1.unit12.lesson01.exercise07.complete_am_fost_parc
            type: fill_in_blank
            tested_text: "fost"
            prompt:
              target_blocks:
