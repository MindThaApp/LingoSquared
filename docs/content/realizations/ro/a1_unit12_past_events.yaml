generation_provenance:
  method: ai_adapted_from_public_domain_source
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain), the same PDF used for units 01-11
    (https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf). Firecrawl was tried first per
    standing instruction (`firecrawl search "Peace Corps Moldova Basic
    Romanian Language Lessons past tense perfect compus"`) but
    returned HTTP 402 (0 credits remaining, the same exhausted state
    unit09/unit10/unit11 all hit), so this unit falls back to the same
    direct `curl` + `pdftotext -layout` re-fetch of the confirmed-
    working PDF those units used. This time the source genuinely DOES
    cover the target grammar, unlike unit11's plans search: grepping
    the full extracted text for past/yesterday/perfect/trecut/"am
    fost"/"am mers"/ieri surfaced three directly relevant, real hits --
    "What did you do in America? / Ce ai lucrat în America?" (line 195
    of the extracted text, confirming the ai + past-participle perfect
    compus pattern with lucrat, the participle of a lucra, already
    established in this course as unit10's lucrez), "I was a student /
    engineer / doctor / farmer / teacher... / Eu am fost student /
    inginer / doctor / fermier / profesor..." (same block, directly
    confirming am fost as the real 1st-person perfect compus of a fi,
    exactly the "am + participle" formation this unit teaches), and the
    week/date vocabulary table's own "Yesterday / Ieri" entry
    (confirming ieri as the plain, standard word for yesterday). A
    further real hit, a genuine two-line mini-dialogue -- "A: Cum a fost
    ziua? / How was your day? B: A fost bine. / It was fine." -- is the
    direct structural ancestor of this unit's lesson03 "Cum a fost
    duminică? / A fost bine!" exchange: reused as a STRUCTURE (the
    cum a fost...?/a fost bine! formulaic question-answer pair), not
    imported verbatim -- adapted to duminică instead of ziua and
    combined with this unit's own am fost/am mâncat/am băut material,
    per AUTHORING_GUIDE #10's "adapt, don't just reference." Per
    AUTHORING_GUIDE #10 ("if the source doesn't cover the topic
    adequately, author fresh, disclosed honestly"), the extension of
    the am + participle pattern to am mâncat/am băut (source doesn't
    give these two specific participles) is freshly authored, built
    from mânca/bea's already-regular -at/neregular participle pattern
    and independently verified via WebSearch (not Firecrawl -- grammar
    verification, not a content source) against general Romanian
    usage/dictionary sources: mâncat is the standard, fully regular
    participle of a mânca (already taught as mănânc, unit10); băut is
    the standard participle of a bea (already taught as beau, unit10);
    both combine with the invariant 1st-person am exactly like the
    sourced am fost does. This unit deliberately reuses a large amount
    of already-established vocabulary and grammar-adjacent material
    rather than inventing new scenario words: unit03's duminică/
    sâmbătă/astăzi/mâine, unit06's cafea/ceai/pâine (plus its own
    established fact that Ana orders cafea and Mihai orders pâine and
    ceai, reused deliberately below, see the review notes'
    AUTHORING_GUIDE #11 cross-check), unit09/unit01's already-taught
    cum (never re-taught as new vocabulary here, only reused), unit10's
    mănânc/beau/lucrez verb roots, and unit11's parc/cinema/duminică/
    sâmbătă/bine/mulțumesc/la revedere. Only five genuinely new
    vocabulary items are introduced: ieri, and the three new perfect-
    compus chunks am fost, am mâncat, am băut, plus the 3rd-person a
    fost (bine) formulaic pair used only in fixed-phrase form in
    lesson03, not as a full paradigm. Authored at schema_version 1.1
    from the start -- every kind:vocabulary card carries a real
    example: sentence with a matching overlay example_gloss.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: codex_fresh_context
  notes: >-
    Twelfth Romanian unit, first draft, continuing directly from
    unit11. Targets universal.a1.past_events.describe_recent_event --
    confirmed by grepping universal_spine.yaml directly: it's the
    entry immediately following universal.a1.plans.make_simple_plans
    (unit11's own outcome) in spine order, its own prerequisites list
    names universal.a1.routines.describe_daily_routine and
    universal.a1.time.ask_tell_time explicitly (both satisfied by
    unit10 and unit04 respectively, already complete), and its can_do
    text is "Give a short, basic account of a recent completed event."
    This course's own established 3-lesson bootstrap pace and Ana/
    Mihai characters are used, matching units 01-11. 3 lessons,
    deliberately scoped to first-person perfect compus (am + past
    participle) with three verbs (fost, mâncat, băut) plus the fixed
    3rd-person a fost/a fost bine formulaic chunk for lesson03's "how
    was it?" exchange -- explicitly does NOT cover second-person past
    forms (ai/ați + participle, confirmed present in the source itself
    via "Ce ai lucrat"), third-person plural (au + participle), or any
    verb beyond the three chosen -- the same trim discipline unit11
    already applied to its own topic, and the correct scope per the
    outcome's own assessment_requirements wording ("state one or more
    simple completed actions," not a full tense paradigm). This unit's
    narrative choice: rather than invent a new scenario, it gives the
    COMPLETED, past-tense version of unit11's own Sunday-park plan --
    lesson01/02 build the am+participle grammar generically (parc/
    cinema examples, then food/drink examples), and lesson03's dialogue
    is Ana and Mihai the day after, recapping how it went. Checked this
    specific choice against AUTHORING_GUIDE #11 carefully, since it is
    exactly the class of cross-lesson fact risk the guide warns about:
    (1) Redundancy check -- unit11's own dialogue already established
    BOTH Ana and Mihai attended the park together (Ana proposed
    "Mergem la parc duminică?", Mihai accepted and confirmed a time),
    so having one "inform" the other of the bare fact they went would
    be redundant/illogical. Resolved by making lesson03's opening line
    ("Cum a fost duminică?", "How was Sunday?") a natural shared-
    reminiscence opener rather than an information request -- people
    who both attended an event routinely still say "so, how was it?"
    to each other as a conversational opener, and the actual NEW
    information exchanged is what they ate/drank, which unit11's own
    dialogue never mentioned at all (no contradiction, just added
    detail -- same "nothing was stated either way" reasoning unit10/
    unit11 already used for their own cross-checks). (2) Food/drink
    attribution -- unit06 established a specific, real fact worth
    protecting: in that unit's own restaurant dialogue, Mihai orders
    "pâine și pui" and "un ceai," while Ana orders "o cafea" (Ana never
    orders bread or tea in that scene; Mihai never orders coffee).
    This unit's lesson03 dialogue deliberately assigns the SAME
    pattern to the Sunday recap -- Mihai says "Am mâncat pâine și am
    băut ceai," Ana says "Am băut cafea!" -- reinforcing unit06's
    established preferences rather than risking a silent contradiction
    (e.g. having Mihai casually say he drank coffee, which would
    contradict his own established tea order). (3) Day/schedule check
    -- unit10 established Mihai's class starts at nine in the morning
    and he works "seara" (evening) before bed at night; unit11 already
    verified a Sunday afternoon park meeting doesn't conflict with
    either fact (no stated Sunday restriction on class or work). This
    unit adds no new time-of-day claim beyond reusing "duminică" as
    the day already fixed by unit11's own dialogue, so the same
    reasoning still holds with nothing new to re-check. (4) No fixed
    "today" -- unit03's own teaching examples use inconsistent days
    across different practice sentences ("Este luni astăzi," "Mâine
    este sâmbătă") purely as decorative vocabulary drills, not a fixed
    course-wide calendar, confirmed by re-reading that unit directly --
    so this unit's own generic ieri (yesterday) carries no risk of
    contradicting an established "today." Checked every fill_in_blank
    slot's correct answer against AUTHORING_GUIDE #17's synonym-
    ambiguity concern: lesson01's "Am ___ la parc." recalls "fost," the
    only past participle taught anywhere in the course by that point in
    the lesson sequence (mâncat/băut are taught later, in lesson02, so
    they aren't live competing candidates yet when this exercise is
    reached); lesson02's "Am mâncat pâine și am ___ ceai." recalls
    "băut," and the English instruction ("...and I drank tea") plus the
    semantic mismatch of "mâncat" with a beverage rule out the other
    taught participle; lesson03's "A fost ___!" recalls "bine," the
    only positive-response word taught in the whole course with no
    antonym or near-synonym ever introduced. Checked every listen_
    select/dialogue_comprehension exercise against the standing same-
    speaker-distractor rule: lesson01's and lesson02's listen_select
    exercises use single-sentence audio clips (not multi-speaker
    dialogue audio), and distractors were confirmed to be sentences
    never spoken in that specific clip. Lesson03's dialogue_
    comprehension asks "What did Ana drink?" (correct: "Cafea.");
    listed every line each speaker actually says in the six-line
    dialogue before writing distractors -- Mihai's three lines are
    "Bună, Ana! Cum a fost duminică?", "Am mâncat pâine și am băut
    ceai.", and "Mulțumesc, Ana! La revedere!"; Ana's three lines are
    "A fost bine! Am fost la parc.", "Am băut cafea!", and "La
    revedere, Mihai!" -- the distractors "Ceai." and "Pâine." are both
    things ONLY Mihai says, never Ana, so neither is a fragment of
    anything the queried speaker (Ana) actually says herself. Needs a
    fresh-context content review before import, same as every other
    language's content.

course:
  realization_key: ro.a1
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Continue unit01-11's register split (dumneavoastră as the safe
    default with unfamiliar adults; Ana and Mihai's own established
    dumneavoattră register with each other). This unit's new grammar is
    entirely 1st-person (am fost/am mâncat/am băut, invariant for
    singular and plural, matching mergem/nu pot's own person-neutral
    shape from unit11) plus one fixed 3rd-person formulaic chunk (Cum a
    fost...?/A fost bine!) used only as an unanalyzed set phrase, not a
    taught paradigm -- this unit introduces no new second-person verb
    forms (the source material's own "Ce ai lucrat" 2nd-person example
    was deliberately NOT adapted, matching unit11's own precedent of
    excluding 2nd-person forms), so Ana and Mihai's dialogue keeps their
    existing polite register intact, matching unit06/unit07/unit08/
    unit09/unit10/unit11.

