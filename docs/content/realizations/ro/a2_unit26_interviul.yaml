generation_provenance:
  method: ai_generated
  authoring_system: claude
  source_material: >-
    "Basic Romanian Language Lessons" (US Peace Corps Moldova, public
    domain, the same PDF used for units 01-25,
    https://fsi-languages.yojik.eu/languages/PeaceCorps/Romanian/
    MD_Romanian_Language_Lessons.pdf) was checked first for dedicated
    job-interview material. `firecrawl --status` still shows 0/1,000
    credits, so this unit again falls back to established-conventions-
    only authoring. Grepped the existing 785-line extraction for
    experiență/interviu/disponibil/angajare and found no dedicated
    lesson content beyond unit17's own basic job/workplace vocabulary
    (inginer, birou, profesoară, școală) -- every word and phrase
    specific to this unit's interview scenario is authored fresh from
    general standard Romanian knowledge.

    Continues the A2 grammar progression with the perfect tense ("am
    lucrat," I have worked) as a second past-tense form alongside this
    course's existing simple-past dialogue narration, needed to
    describe past work experience naturally. Switches to Mihai as
    interviewer for this unit specifically: unit17 established Mihai
    as an inginer (engineer) who lucrează la birou (works at an
    office), a natural fit for conducting an engineering-adjacent
    interview at his own workplace, while Ana's established teaching
    job (unit17) has no interview-conducting angle. Introduces one new
    character, Diana, a job candidate -- a new named character rather
    than reusing Ana, since Ana already has an established teaching
    job (unit17) and having her separately interview for an unrelated
    position would need its own new, unestablished narrative reason
    this unit doesn't need to invent.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Sixth Romanian A2 unit, completing this course's A2 tier (all six
    of universal_spine.yaml's current A2 outcomes are now realized in
    Romanian, matching nl's own A2 coverage). Targets universal.a2.
    employment.attend_job_interview (confirmed by grepping
    universal_spine.yaml directly -- prerequisites are
    universal.a1.work.describe_job, this course's own unit17, and
    universal.a2.opinions.give_opinions_with_reasons, this course's own
    unit22). 4 lessons, each mapped to a distinct spine
    assessment_requirement: lesson01 (asking about/describing
    experience) covers answer_interview_question's experience half;
    lesson02 (asking about availability) completes
    answer_interview_question; lesson03 (reading a job posting) covers
    read_job_posting and previews write_availability_note via its
    writing_prompt; lesson04 (the full Mihai/Diana interview dialogue)
    covers understand_interview_question and consolidates all four.

    Reuses unit01's bună/mulțumesc/la revedere/Mihai, unit17's
    inginer/birou (Mihai's own established workplace), re-declared via
    a lesson-opening reminder card per the standing per-file
    token-scoping convention. Within this file, lesson02-04 freely
    reuse lesson01's own experiență/am lucrat without a fresh reminder
    card, matching the established within-file-reuse precedent.

    Checked this choice against AUTHORING_GUIDE #11 before finalizing.
    Facts this unit newly states: Diana has two years of experience as
    a technician (tehniciană), is available starting Monday, and asks
    a clarifying question about the role's schedule; Mihai, in his own
    established capacity as an inginer at his birou, conducts the
    interview. Grepped unit17 to confirm no conflict: unit17 states
    Mihai lucrează la birou as an inginer with no claim about hiring
    authority or team size, so him conducting one interview at that
    same office doesn't contradict anything already established, and
    Diana is a genuinely new character with no prior appearance to
    conflict with.

    Checked every fill_in_blank slot against AUTHORING_GUIDE #17: each
    blank's instruction explicitly states the target English meaning
    (lesson01's blank=doi instruction names "two years" explicitly;
    lesson02's blank=luni instruction names "from Monday" explicitly).
    Checked every listen_select/dialogue_comprehension distractor
    against the standing same-speaker-audio rule for lesson04's
    dialogue -- Mihai's and Diana's own lines were listed before
    writing distractors, and every distractor is either something
    neither speaker says in that clip, or (for "who says this")
    genuinely said by the other speaker only.

    Verified every word_order/listen_order exercise's word_bank token
    multiset exactly matches its paired overlay correct_response token
    multiset (case- and diacritic-exact), and every exercise's
    tested_text tokens are covered by an earlier introduced_tokens
    entry in THIS SAME FILE (per-file scoping, confirmed the hard way
    by units 21/23's own first-pass compiler errors, checked
    proactively here before running the compiler at all). Needs a
    fresh-context content review before import, same as every other
    language's content.

course:
  realization_key: ro.a2
  target_language_first: true
  dialect: ro_RO_standard
  register_policy: >-
    Fully formal register throughout -- dumneavoastră between Mihai and
    Diana (a job interview between strangers), matching units 21/23/
    24/25's identical convention for a first professional meeting.

