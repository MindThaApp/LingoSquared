generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    No public-domain source material was consulted for this unit within
    this authoring pass's research budget -- FSI Modern Written Arabic
    Vol 1's early lessons (the only source read for this dispatch; see
    a1_unit01/a1_unit02's own provenance notes and
    docs/content/SOURCES_ARABIC_MSA.md) do not cover numbers, and no
    further pages were sampled specifically hunting for a numbers lesson
    given the scope of this dispatch. Standard MSA cardinal numbers 1-10
    and established-conventions original authoring throughout, disclosed
    honestly rather than folded into an undifferentiated "researched"
    claim. A future authoring pass covering later FSI Vol 1 lessons
    should re-check for a genuine numbers lesson before assuming none
    exists in the source.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_review
  notes: >-
    Third of three first-ever Modern Standard Arabic units (en-ar
    bootstrap). Cardinal numbers are taught in their independent citation
    form (واحد، اثنان، ثلاثة...); MSA's gender-polarity agreement rules
    for numbers modifying a counted noun (e.g. 3-10 take the OPPOSITE
    grammatical gender of the counted noun) are a genuine A2+ topic and
    are deliberately NOT taught here -- this unit stays at simple
    counting/reading digits, not noun-counting constructions. Flagged
    explicitly so a reviewer doesn't mistake the omission for an
    oversight. Same no-tashkeel-in-tested-text policy as a1_unit01/02.
    Pending fresh-context review.

