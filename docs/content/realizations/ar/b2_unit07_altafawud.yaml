generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (same
    honest-disclosure precedent as units01-06 of this wave). Sibling-
    isolation honored: the X->ar B2 realization and every nl/fa/prs/de
    B2 file were treated as non-existent and were NOT opened; only ar's
    OWN units01-06 of this same wave were consulted for character
    canon and register (not a sibling-direction violation). Character
    canon checked against units01-06 and the ar B1 tier: ليلى is from
    مصر (Egypt); يوسف is from لبنان (Lebanon), works as مهندس (engineer)
    in مكتب (office), office colleague of ليلى. This unit has يوسف
    ويوسف negotiate a project deadline, which touches no established
    job/nationality/relationship fact (both are already established
    office colleagues who could reasonably co-own a project). Register:
    Modern Standard Arabic (fusha), professional register between
    colleagues, unchanged from units 01-06. Arabic ك (U+0643) / ي
    (U+064A) used throughout, never Persian ك/ی/پ/چ/ژ/گ. No diacritics
    (harakat) or tanwin marks used in any tested_text/correct_response
    -- accusative tanwin nunation is written with the plain
    orthographic alif only, matching everyday unvocalized MSA writing
    and the fix applied to unit01's أيضا. This unit is authored
    self-contained (all its own vocabulary introduced within this
    file), the same precedent units01-06 of this wave set.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Seventh Arabic B2 unit (3 of 4 authored this wave -- second half of
    the tier, units 05-08). Targets
    universal.b2.negotiation.negotiate_and_resolve_disagreement:
    negotiate an outcome -- propose terms, push back on unacceptable
    ones, offer a conditional concession, and reach or decline an
    agreement while keeping the relationship intact. Theme: ليلى
    ويوسف negotiate a project deadline, across all six lessons,
    mirroring the shipped nl B2 unit07 as the structural exemplar. L01
    proposing terms (أقترح أن، ما رأيك لو), L02 refusing/pushing back
    on a term (لا أستطيع الموافقة على، هذا غير ممكن بالنسبة لي), L03
    the conditional concession (يمكنني أن...، بشرط أن...), L04 reaching
    or declining agreement (اتفقنا، لم نتوصل إلى اتفاق), L05 a reading
    of the written exchange of terms (proposal -> refusal -> conditional
    concession -> agreement, reusing the unit's own established model
    sentences with zero new vocabulary, since the reading's job here is
    synthesis of already-taught terms, not new content), L06 the
    culminating production -- a يوسف/ليلى negotiation dialogue that
    dramatizes the same exchange as spoken turns, plus a speaking task
    and a writing task that each require a proposal, a refusal, AND a
    conditional concession, the literal shape of the spine outcome's
    negotiate_aloud assessment requirement. B2 is a separate Course row
    from B1 and this unit is authored self-contained, same precedent as
    units 01-06. Dictation used exactly twice (lessons 01 and 02), at
    the unit cap, and both dictation sentences are single-clause with
    NO internal punctuation (tested_text/correct_response/media_asset
    all byte-identical after only boundary-punctuation trimming).
    Review 2026-10-19: 6 fixes - the concession 'I can finish on Friday,
    provided I get extra time' was circular (moving Thursday to Friday
    already is the extra time), condition changed to بشرط أن أحصل على
    مساعدة ('provided I get help') across audio, cards, reading,
    exercises and overlay; يمكنني أن gloss/note falsely claimed it marks
    a negotiated concession rather than general ability (it is the
    ordinary 'I can'); comprehend_proposal distractor 'Finishing the
    project on Friday' clashed with Yusuf's own agreement to Friday
    (replaced); added accepted answers without يوم (اتفقنا على الجمعة)
    to write_agree and translate_agree_friday; Arabic commas in two
    examples; provenance note typo يوسف ويوسف -> ليلى ويوسف. NATIVE
    FLAGS: whether أحصل على مساعدة is the most natural condition here;
    ما رأيك لو + past and its English rendering 'What do you think if we
    postponed'.

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, professional register
    between colleagues -- the same register pin as units 01-06 and the
    ar B1 tier. B2 negotiation layers proposal/refusal/concession
    connectives onto that register -- أقترح أن، ما رأيك لو، لا أستطيع
    الموافقة على، يمكنني أن، بشرط أن، اتفقنا -- while ليلى ويوسف keep
    the same professional-colleague footing established earlier.

