  notes: 'Original Modern Standard Arabic C1 authoring for en-ar. Character canon checked in ar B1/B2: ليلى is from مصر, يوسف is from لبنان and works as مهندس with ليلى. Professional/fusha register retained. Arabic ك and ي codepoints used; Persian letters and harakat avoided in tested Arabic.'
review:
  status: reviewed
  required_next_reviewer: null
  notes: 'Targets universal.c1.hypothesis.reason_about_counterfactuals. Review naturalness of MSA register and accepted answer coverage. Review 2026-10-19: 7 fixes - 36 move-card titles/glosses glossed the Arabic label with its example sentence (now the label''s own meaning, example moved to note); hamza-less spellings normalised to course convention (أكثر، لأن، الأرقام، أن) in tested text/tiles/models (hamza-less forms kept as accepted answers); lesson02 model ''لكان القرار اليوم اكثر دقة'' was a bare jawab with no لو-clause (ungrammatical standalone) - now ''لو حدث ذلك لكان القرار اليوم أكثر دقة'', English ''If that had happened, the decision today would be more precise'' (present result = would be, also in the full passage); lesson06 word_order was a fragment ending in ''ولكان'' (now the complete conditional sentence); fixed ''.?'' typo and missing comma in lesson06 recognize prompt; replaced ''unit model'' wording in learner prompts/titles and made the matching instruction describe the actual label-to-example task; added accepted variants (SVO ليلى تندم / يوسف يربط, كان من الممكن / كان بإمكاننا أن نختار). NATIVE FLAGS: ''تندم ليلى لأن الفريق لم يراجع الأرقام'' (ندم normally takes على and one''s own act; تأسف ليلى لأن or ليت الفريق راجع الأرقام may be more natural).'
course:
  realization_key: ar.c1
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: Modern Standard Arabic (fusha) throughout, professional register between colleagues ليلى and يوسف.
