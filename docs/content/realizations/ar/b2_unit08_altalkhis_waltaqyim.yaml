target_language: ar
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (same
    honest-disclosure precedent as units01-07 of this wave). Sibling-
    isolation honored: the X->ar B2 realization and every nl/fa/prs/de
    B2 file were treated as non-existent and were NOT opened; only ar's
    OWN units01-07 of this same wave were consulted for character
    canon and register (not a sibling-direction violation). Character
    canon checked against units01-07 and the ar B1 tier: ليلى is from
    مصر (Egypt); يوسف is from لبنان (Lebanon), works as مهندس (engineer)
    in مكتب (office), office colleague of ليلى. This unit has ليلى
    ويوسف synthesize two (invented, generic) studies about coffee's
    effect on focus and sleep, which touches no established job/
    nationality/relationship fact. Register: Modern Standard Arabic
    (fusha), professional register between colleagues, unchanged from
    units 01-07. Arabic ك (U+0643) / ي (U+064A) used throughout, never
    Persian ك/ی/پ/چ/ژ/گ. No diacritics (harakat) or tanwin marks used
    in any tested_text/correct_response -- accusative tanwin nunation
    is written with the plain orthographic alif only, matching everyday
    unvocalized MSA writing and the fix applied to unit01's أيضا. This
    unit is authored self-contained (all its own vocabulary introduced
    within this file), the same precedent units01-07 of this wave set.
    GRAMMAR NOTE ON DUAL AGREEMENT: "الدراستان" (the two studies) is a
    dual-feminine noun; per standard MSA agreement rules, a VERB-INITIAL
    clause naming the dual subject explicitly (تتفق الدراستان) takes a
    feminine-SINGULAR verb (gender-only agreement in VSO order), while
    an anaphoric continuation with no repeated subject noun (لكن
    تختلفان) takes the full DUAL verb form -- both forms used correctly
    and deliberately in lesson03/lesson04.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Arabic (MSA) fresh-context review needed. This is a DRAFT.
    Priority checks: (1) confirm the dual-agreement pattern described
    above (تتفق الدراستان vs. plain تختلفان with no following subject)
    is correct and natural, not merely grammatical; (2) whether "تضر
    بالنوم" (harms sleep, verb+preposition) is the most natural MSA
    phrasing, or a reviewer prefers an alternative; (3) whether "أكثر
    إقناعا لأنها تعتمد على عينة أكبر" reads as a genuine reasoned
    judgement (not just a restated preference); (4) the culminating
    lesson06 writing/speaking answer is graded against fixed strings --
    confirm the supplied period/no-period and comma/no-comma variants
    are complete given Arabic's byte-strict grading (zero typo
    tolerance, no internal-punctuation stripping).
  notes: >-
    Eighth Arabic B2 unit (4 of 4 authored this wave -- completes the
    second half of the tier, units 05-08, and the full 8-unit ar B2
    tier). Targets
    universal.b2.synthesis.summarize_and_evaluate_multiple_sources:
    combine information from more than one source into a coherent
    summary, note where the sources agree or conflict, and give a
    reasoned judgement about them. Theme: two studies about coffee's
    effect on focus and sleep, across all six lessons, mirroring the
    shipped nl B2 unit08 as the structural exemplar. L01 presenting the
    first source (تقول الدراسة الأولى إن), L02 presenting the second,
    contrasting source (تشير الدراسة الثانية إلى أن، بينما), L03
    points of agreement between the two sources (تتفق الدراستان على
    أن), L04 points of conflict and a reasoned judgement (لكن تختلفان
    في، في رأيي...أكثر إقناعا لأن), L05 a reading presenting both
    sources together (reusing the unit's own established model
    sentences with zero new vocabulary, since the reading's job here is
    synthesis of already-taught claims, not new content, mirroring
    unit07's L05 for the same structural reason), L06 the culminating
    production -- a ليلى/يوسف dialogue that synthesizes both sources,
    plus a speaking task and a writing task that each require naming
    the sources' agreement, their conflict, AND a reasoned judgement,
    the literal shape of the spine outcome's present_a_synthesis
    assessment requirement. B2 is a separate Course row from B1 and
    this unit is authored self-contained, same precedent as units
    01-07. Dictation used exactly twice (lessons 01 and 02), at the
    unit cap, and both dictation sentences are single-clause with NO
    internal punctuation (tested_text/correct_response/media_asset all
    byte-identical after only boundary-punctuation trimming).

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, professional register
    between colleagues -- the same register pin as units 01-07 and the
    ar B1 tier. B2 synthesis layers source-attribution and evaluation
    connectives onto that register -- تقول الدراسة...أن، تشير
    الدراسة...إلى أن، تتفق...على أن، تختلفان في، في رأيي...أكثر إقناعا
    لأن -- while ليلى ويوسف keep the same professional-colleague
    footing established earlier.

