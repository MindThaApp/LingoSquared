  notes: >-
    Second of the ar B1 50-53 span. Teaches the لو + past + لـ+past
    unreal-past conditional in lesson01 (if we had had more time, we
    would have finished the project), a softened conditional-alone
    suggestion in lesson02 (لو + past used alone to soften a
    preference, without a stated result clause), and lesson03 combines
    both in a short dialogue between يوسف and ليلى, per
    universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional.
    Needs fresh-context review, in particular for the
    law-conditional grammar per root CLAUDE.md footgun #6.
    Review 2026-10-19: 9 fixes - lesson02 relabelled from "softened
    suggestion" to a wish/regret (لو + past with the result left unsaid =
    "if only we had...", which is what the line means after the
    unreal-past reflection; contrasts with ليتني from unit47); English
    "If only we focused" corrected to "If only we had focused" in pairs
    and prompts; match_law_kana glossed لدينا as "we had" (past comes from
    كان) and overlapped with كان "was/had" - now "we have (lit. with
    us)" / "was (past)"; law_rakkazna audio voice_hint was female for a
    Yusuf line; reply prompt now pins the content; Laila -> Layla in the
    overlay. NATIVE FLAGS: none.
