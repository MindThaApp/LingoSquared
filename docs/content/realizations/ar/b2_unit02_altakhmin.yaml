generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (same
    honest-disclosure precedent as this wave's unit01). Sibling-
    isolation honored: the X->ar B2 realization and every nl/fa/prs/de
    B2 file were treated as non-existent and were NOT opened; only ar's
    OWN unit01 of this same wave was consulted for character canon and
    register (not a sibling-direction violation). Character canon
    checked against unit01 and the ar B1 tier: ليلى is from مصر
    (Egypt); يوسف is from لبنان (Lebanon), works as مهندس (engineer) in
    مكتب (office), office colleague of ليلى. كريم is reused from
    ar/b1_unit53 (established there as "الزميل الذي يعمل في المكتب" --
    the colleague who works in the office) as the absent colleague this
    unit speculates about; no established fact about any of the three
    is touched, added to, or contradicted. Register: Modern Standard
    Arabic (fusha), professional register between colleagues, unchanged
    from unit01 and the B1 tier. Arabic ك (U+0643) / ي (U+064A) used
    throughout, never Persian ك/ی/پ/چ/ژ/گ. No diacritics (harakat) or
    tanwin marks used in any tested_text/correct_response -- accusative
    tanwin nunation is written with the plain orthographic alif only
    (e.g. مشغولا، جدا، متأكدا), matching everyday unvocalized MSA
    writing and the fix applied to unit01's أيضا.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second Arabic B2 unit (2 of 4 authored this wave). Targets
    universal.b2.speculation.hypothesize_about_causes_and_consequences:
    speculate about causes and consequences with graded certainty --
    say what may/might, must, or cannot be the case (present and
    past), and distinguish deduction from guesswork. Theme: reused
    colleague كريم hasn't arrived at the office; ليلى ويوسف speculate
    why, across all six lessons. Lesson arc, mirroring the shipped nl
    B2 unit02 as the structural exemplar: L01 basic present speculation
    (قد / ربما + مضارع), L02 strong present certainty (لا بد أن / من
    المستحيل أن), L03 speculating about the past (لا بد أن + ماضي,
    ربما + ماضي), L04 distinguishing deduction-from-evidence (أستنتج
    أن...لأن) from pure guesswork (أخمّن أن...لكنني لست متأكدا) plus a
    consequence connective (لذلك), L05 a speculative reading text, L06
    the culminating production -- a ليلى/يوسف dialogue for the
    listening requirement plus a speaking task and a writing task that
    each require speculating about BOTH a present cause (قد, weak) AND
    a past cause (لا بد أن, strong), the literal shape of the spine
    outcome's write_speculation/speak_speculation assessment
    requirements. B2 is a separate Course row from B1 (a B2 learner
    never sees B1 lexemes at runtime) and this unit is authored
    self-contained, same precedent as unit01. Dictation used exactly
    twice (lessons 01 and 02), at the unit cap.
    Review 2026-10-19: 8 fixes - the name after أن was left nominative
    (أن كريم مشغول) although the subject of أنّ is accusative and the
    course writes accusative tanwin with alif (مشغولا), so every أن كريم
    became أن كريما (models, tested_text, word banks, audio text,
    overlay answers/feedback; the old forms are kept as accepted
    answers) and the lesson02 note that called this a plain nominal
    sentence was corrected; الاتصال matching gloss 'the call' now
    'calling / the call' to fit حاول الاتصال; write_simple 'I guess it's
    simple' was underdetermined (أنه بسيط) and now asks for 'the matter
    is simple'; added ربما هو مشغول, ربما هو في اجتماع طوال اليوم, VSO
    لم يصل الزميل بعد, and feminine متأكدة variants of the guess
    sentence. NATIVE FLAGS: confirm كريما after أن reads right to a
    native editor (the uninflected form stays accepted); whether فاتته
    الحافلة is the preferred idiom; the reading/dialogue line لا بد أنه
    حاول الاتصال، لكن هاتفه مغلق is slightly odd logically (he tried to
    call, yet his phone is off).

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, professional register
    between colleagues -- the same register pin as unit01 and the ar
    B1 tier. B2 speculation layers modal-certainty connectives onto
    that register -- قد، ربما، لا بد أن، من المستحيل أن، أستنتج أن،
    أخمّن أن، لذلك -- while ليلى ويوسف keep the same professional-
    colleague footing established earlier.

