  notes: 'Original Modern Standard Arabic C1 authoring for en-ar. Character canon checked in ar B1/B2: ليلى is from مصر, يوسف is from لبنان and works as مهندس with ليلى. Professional/fusha register retained. Arabic ك and ي codepoints used; Persian letters and harakat avoided in tested Arabic.'
review:
  status: reviewed
  required_next_reviewer: null
  notes: 'Targets universal.c1.idiom.use_idiomatic_and_figurative_language. Review naturalness of MSA register and accepted answer coverage. Review 2026-10-19: 9 fixes - 36 move-card titles/glosses glossed the Arabic label with its example sentence (now the label''s own meaning, example moved to note); hamza-less spellings normalised (label أثر الأسلوب, أقوى, أن) in tested text/tiles/models/titles (hamza-less forms kept as accepted answers); lesson03/06 calque ''المشروع يسير على خيط رفيع بسبب الوقت'' replaced by the established idiom ''المشروع معلق بخيط رفيع بسبب ضيق الوقت'' (English ''hanging by a thread because time is short'') everywhere; lesson04 English gloss ''We say he takes a decision, not he makes a decision'' was confusing in English - now names the two Arabic verbs with transliteration; lesson04 word_order cut mid-clause at ''في'' and lesson06 word_order cut at ''يسير على'' (both now complete sentences); fixed ''.?'' typo in lesson06 recognize prompt; replaced ''unit model'' wording and made the matching instruction describe the label-to-example task; added SVO accepted variants for lessons 01-02. NATIVE FLAGS: ملازمة طبيعية as the label for ''collocation'' (standard term is التلازم اللفظي / المتلازمات اللفظية); the lesson04 claim that one does not say يصنع قرارا (صنع القرار is common MSA for ''decision-making''; the contrast holds only for the verb phrase).'
