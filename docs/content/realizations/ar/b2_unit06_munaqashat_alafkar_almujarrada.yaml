generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (same
    honest-disclosure precedent as units01-05 of this wave). Sibling-
    isolation honored: the X->ar B2 realization and every nl/fa/prs/de
    B2 file were treated as non-existent and were NOT opened; only ar's
    OWN units01-05 of this same wave were consulted for character
    canon and register (not a sibling-direction violation). Character
    canon checked against units01-05 and the ar B1 tier: ليلى is from
    مصر (Egypt); يوسف is from لبنان (Lebanon), works as مهندس (engineer)
    in مكتب (office), office colleague of ليلى. This unit has ليلى
    ويوسف discuss what "success" means -- an abstract topic that safely
    touches their established nationalities only as generic cultural
    color (e.g. family as a value "in Egypt"), never asserting a new
    personal fact about either character. Register: Modern Standard
    Arabic (fusha), professional register between colleagues, unchanged
    from units 01-05. Arabic ك (U+0643) / ي (U+064A) used throughout,
    never Persian ك/ی/پ/چ/ژ/گ. No diacritics (harakat) or tanwin marks
    used in any tested_text/correct_response -- accusative tanwin
    nunation is written with the plain orthographic alif only, matching
    everyday unvocalized MSA writing and the fix applied to unit01's
    أيضا. This unit is authored self-contained (all its own vocabulary
    introduced within this file), the same precedent units01-05 of this
    wave set.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Sixth Arabic B2 unit (2 of 4 authored this wave -- second half of
    the tier, units 05-08). Targets
    universal.b2.abstraction.discuss_abstract_ideas_and_values: discuss
    abstract topics -- ideas, values, cultural differences, and social
    issues -- expressing an opinion with qualification and responding
    to another person's view rather than only stating your own. Theme:
    the concept of "success" (النجاح), across all six lessons, mirroring
    the shipped nl B2 unit06 as the structural exemplar. L01 expressing
    a qualified opinion (أعتقد أن...، وإن كنت أتفهم أن...), L02
    concrete vocabulary for values/culture (القيم، الثقافة، تختلف), L03
    responding directly to another's view (ردا على ما قلت، بخصوص، على
    الرغم من), L04 elaborating the qualified stance further (في
    الواقع، لكن في الوقت نفسه، يعتمد على), L05 a short text discussing
    the abstract topic, L06 the culminating production -- a
    ليلى/يوسف discussion in which يوسف offers an opposing view (money is
    essential to success) and ليلى responds directly to it, plus a
    speaking task and a writing task that each require a qualified
    opinion FOLLOWED BY a direct response to an opposing view, the
    literal shape of the spine outcome's discuss_an_abstract_topic
    assessment requirement. B2 is a separate Course row from B1 and
    this unit is authored self-contained, same precedent as units
    01-05. Dictation used exactly twice (lessons 01 and 02), at the
    unit cap, and both dictation sentences are single-clause with NO
    internal punctuation (tested_text/correct_response/media_asset all
    byte-identical after only boundary-punctuation trimming).
    Review 2026-10-19: 5 fixes - على الرغم من glossed 'although' (it is
    'despite / in spite of'; 'although' needs على الرغم من أن); يعتمد
    على note rewritten (it implied a preposition contrast with English
    that does not exist); added accepted answers يربط البعض النجاح
    بالمال (VSO), الناس يفهمون النجاح بطرق مختلفة (SVO) and the comma
    variant في مصر، العائلة... to dictation_culture. NATIVE FLAGS:
    whether وإن كنت أتفهم أن reads as a natural concessive qualifier;
    whether the Egypt-family example is a fair, non-stereotyping
    illustration.

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, professional register
    between colleagues -- the same register pin as units 01-05 and the
    ar B1 tier. B2 abstraction layers qualified-opinion and direct-
    response connectives onto that register -- أعتقد أن، وإن كنت
    أتفهم أن، ردا على ما قلت، بخصوص، على الرغم من، في الواقع -- while
    ليلى ويوسف keep the same professional-colleague footing established
    earlier.

