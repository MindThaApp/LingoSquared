    language: ar
    text: >-
      يوسف: ما رأيك في النجاح؟ ليلى: أعتقد أن النجاح يعني تحقيق
      أهدافك، وإن كنت أتفهم أن البعض يربط النجاح بالمال. يوسف:
      بالنسبة لي، المال جزء أساسي من النجاح. ليلى: ردا على ما قلت،
