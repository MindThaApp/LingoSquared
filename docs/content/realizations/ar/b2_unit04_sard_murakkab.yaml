status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (same
    honest-disclosure precedent as units01-03 of this wave). Sibling-
    isolation honored: the X->ar B2 realization and every nl/fa/prs/de
    B2 file were treated as non-existent and were NOT opened; only ar's
    OWN units01-03 of this same wave were consulted for character
    canon and register (not a sibling-direction violation). Character
    canon checked against units01-03 and the ar B1 tier: ليلى is from
    مصر (Egypt); يوسف is from لبنان (Lebanon), works as مهندس (engineer)
    in مكتب (office), office colleague of ليلى. This unit has يوسف
    recount to ليلى why he was late to the office one morning -- a
    fresh everyday scenario that touches no established job/
    nationality/relationship fact (distinct from unit02's scenario,
    where a different colleague, كريم, was the one late). Register:
    Modern Standard Arabic (fusha), professional register between
    colleagues, unchanged from units 01-03. Arabic ك (U+0643) / ي
    (U+064A) used throughout, never Persian ك/ی/پ/چ/ژ/گ. No diacritics
    (harakat) or tanwin marks used in any tested_text/correct_response
    -- accusative tanwin nunation is written with the plain
    orthographic alif only (e.g. متأخرا), matching everyday unvocalized
    MSA writing and the fix applied to unit01's أيضا. This unit is
    authored self-contained (all its own vocabulary introduced within
    this file), the same precedent units01-03 of this wave set; no
    token from units01-03 is assumed available here.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fourth Arabic B2 unit (4 of 4 authored this wave; completes units
    01-04 of the 8-unit B2 tier). Targets
    universal.b2.narrative.recount_complex_events_with_shifting_time:
    recount a complex sequence of events with shifting time reference
    -- background versus foreground, events before other past events,
    and interrupted or ongoing actions, keeping the timeline
    unambiguous. Theme: يوسف recounts to ليلى why he was late to the
    office this morning, across all six lessons, mirroring the shipped
    nl B2 unit04 as the structural exemplar. L01 background vs.
    foreground (كنت + مضارع vs. plain ماضي, بينما), L02 the pre-past /
    pluperfect (كنت قد + ماضي), L03 interrupted actions (عندما, في تلك
    اللحظة), L04 sequencing complex events (ثم، بعد ذلك، أخيرا), L05 a
    complex narrative reading text told NON-LINEARLY (opens with the
    result -- arriving late -- then flashes back through the cause
    chain, so the reader must identify the true earliest event), L06
    the culminating production -- a يوسف/ليلى dialogue in which يوسف's
    account is deliberately told OUT OF chronological order (satisfying
    the listening requirement's "reconstruct the true chronological
    order of a spoken account whose events are not told in order")
    plus a speaking task and a writing task that each require
    background + an interrupting event + a pre-past event, the literal
    shape of the spine outcome's speak_complex_narrative/
    write_complex_narrative assessment requirements. B2 is a separate
    Course row from B1 and this unit is authored self-contained, same
    precedent as units 01-03. Dictation used exactly twice (lessons 01
    and 02), at the unit cap.
    Review 2026-10-19: 8 fixes - pluperfect note falsely said Arabic has
    no periphrastic form (كنت قد نسيت is one), rewritten; وصلت was
    glossed only as feminine 'it arrived' while lesson04/05 use the same
    spelling for 'I arrived', and the gloss and a note now cover both;
    interrupt_model audio had a female voice_hint for Yusuf's own line,
    now male; added valid order variants to translate_foreground (رنّ
    الهاتف فجأة), speak_combined, translate_moment, translate_sequence2
    and translate_arrived_late. NATIVE FLAGS: the narrative is muddled
    -- lesson04 models أخيرا، وصلت في الوقت المناسب ('finally, I arrived
    on time') inside a story about arriving late, and the bus arrives
    while he searches but he then runs to the station; whether بعد ذلك
    sits naturally mid-clause in بينما كنت أسير في الشارع بعد ذلك.

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, professional register
    between colleagues -- the same register pin as units 01-03 and the
    ar B1 tier. B2 narrative layers shifting-time-reference constructions
    onto that register -- كنت + مضارع (background), كنت قد + ماضي
    (pre-past), بينما / عندما (interruption), ثم / بعد ذلك / أخيرا
    (sequencing) -- while ليلى ويوسف keep the same professional-
    colleague footing established earlier.

