    language: ar
    text: >-
      ليلى: لماذا تأخرت هذا الصباح؟ يوسف: كنت أبحث عن المفتاح عندما
      وصلت الحافلة. قبل ذلك، كنت قد نسيت مفتاح المنزل، لذلك رجعت
      لآخذه. بينما كنت أسير في الشارع بعد ذلك، رنّ الهاتف فجأة. وجدت
      المفتاح أخيرا، ثم ركضت إلى المحطة. ليلى: يا له من صباح مزدحم!
    voice_hint: adult_female_and_male_neutral
    status: pending_generation

