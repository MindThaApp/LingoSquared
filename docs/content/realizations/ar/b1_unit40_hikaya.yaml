    Needs fresh-context review.
course: {realization_key: ar.b1, target_language_first: true, dialect: msa_standard_formal, register_policy: "Modern Standard Arabic (fusha) throughout. This unit continues the B1 tier opened in unit35. نور recounts to her brother يوسف a past afternoon: she was waiting for the bus when she ran into an old friend, they went for coffee and talked, and the friend told her she is moving to another city."}
