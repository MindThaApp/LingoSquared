generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (same
    honest-disclosure precedent as units01-04 of this wave). Sibling-
    isolation honored: the X->ar B2 realization and every nl/fa/prs/de
    B2 file were treated as non-existent and were NOT opened; only ar's
    OWN units01-04 of this same wave were consulted for character
    canon and register (not a sibling-direction violation). Character
    canon checked against units01-04 and the ar B1 tier: ليلى is from
    مصر (Egypt); يوسف is from لبنان (Lebanon), works as مهندس (engineer)
    in مكتب (office), office colleague of ليلى. This unit has ليلى
    reschedule an appointment, rendering the same request once casually
    (to her friend يوسف) and once formally (to an institution), which
    touches no established job/nationality/relationship fact. Register:
    THIS UNIT DELIBERATELY teaches BOTH a casual and a formal MSA
    register side by side (MSA has no colloquial layer in this course,
    so "casual" here means short, direct, everyday-correspondence MSA
    -- ممكن، مرحبا، مع تحياتي -- contrasted with formal/institutional
    MSA -- هل يمكن، تحية طيبة وبعد، سيادتكم، وتفضلوا بقبول فائق
    الاحترام). Each individual exercise keeps a single internally
    consistent register; the contrast lives across exercise pairs, and
    the culminating exercise produces the SAME request in both. Arabic
    ك (U+0643) / ي (U+064A) used throughout, never Persian ك/ی/پ/چ/ژ/گ.
    No diacritics (harakat) or tanwin marks used in any tested_text/
    correct_response -- accusative tanwin nunation is written with the
    plain orthographic alif only, matching everyday unvocalized MSA
    writing and the fix applied to unit01's أيضا. This unit is authored
    self-contained (all its own vocabulary introduced within this
    file), the same precedent units01-04 of this wave set.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Arabic (MSA) fresh-context review needed. This is a DRAFT.
    Priority checks: (1) whether "ممكن نغيّر الموعد؟" genuinely reads as
    casual-register written MSA (as opposed to colloquial) to a native
    ear, and whether "هل يمكن تغيير الموعد؟" reads as meaningfully more
    formal than it, given MSA itself is already a formal variety; (2)
    whether "تحية طيبة وبعد،" and "وتفضلوا بقبول فائق الاحترام" are used
    correctly as an opening/closing pair in real institutional Arabic
    correspondence, and whether "سيادتكم" is the right honorific for an
    unspecified institution (vs. "حضرتكم" or a named title); (3) the
    proverb "لكل مقام مقال" (lesson06) -- confirm it lands naturally as
    a closing line for a register-contrast lesson; (4) the culminating
    lesson06 writing/speaking answer is graded against fixed strings --
    confirm the supplied period/no-period and comma/no-comma variants
    are complete given Arabic's byte-strict grading (zero typo
    tolerance, no internal-punctuation stripping).
  notes: >-
    Fifth Arabic B2 unit (1 of 4 authored this wave -- second half of
    the tier, units 05-08). Targets
    universal.b2.register.adapt_formality_to_audience: convey the same
    message appropriately to a friend, a colleague, and an institution,
    recognizing which forms are too casual or too stiff for a given
    setting. Theme: ليلى needs to reschedule an appointment, rendering
    that one request across all six lessons, mirroring the shipped nl
    B2 unit05 as the structural exemplar. L01 direct vs. indirect
    request forms (ممكن...؟ vs. هل يمكن...؟ / أرجو), L02 the
    greeting/closing ladder (مرحبا / مع تحياتي vs. تحية طيبة وبعد /
    وتفضلوا بقبول فائق الاحترام), L03 addressing a friend (casual
    register drilling), L04 addressing an institution (formal register
    drilling), L05 a reading pairing two short messages side by side
    (same request, two registers, each cited by a register feature),
    L06 the culminating production -- a ليلى/يوسف dialogue in which
    ليلى explicitly demonstrates both registers, plus a speaking task
    and a writing task that each require delivering the SAME request
    once to a friend and once to an institution, the literal shape of
    the spine outcome's shift_register assessment requirement. B2 is a
    separate Course row from B1 and this unit is authored self-
    contained, same precedent as units 01-04. Dictation used exactly
    twice (lessons 01 and 02), at the unit cap, and both dictation
    sentences are single-clause with NO internal punctuation (tested_
    text/correct_response/media_asset all byte-identical after only
    boundary-punctuation trimming).

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout -- the same register pin
    as units 01-04 and the ar B1 tier. This unit is the one deliberate
    exception that teaches TWO force levels within MSA side by side:
    casual/everyday correspondence (ممكن، مرحبا، مع تحياتي) versus
    formal/institutional correspondence (هل يمكن، أرجو، سيادتكم، تحية
    طيبة وبعد، وتفضلوا بقبول فائق الاحترام), while ليلى ويوسف keep the
    same professional-colleague footing established earlier.

