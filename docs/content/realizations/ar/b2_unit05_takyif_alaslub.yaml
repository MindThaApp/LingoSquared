      يوسف: ماذا تحتاجين أن تفعلي؟ ليلى: أحتاج أن أغيّر الموعد. بأسلوب
      غير رسمي: يا صديقي، ممكن نغيّر الموعد؟ بأسلوب رسمي: تحية طيبة
