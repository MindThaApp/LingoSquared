          - {"content_key": "ar.a2.unit76.law_samaht.lesson05.exercise02.read_decline", "type": "reading_comprehension", "tested_text": "هَلْ تُرِيدُ الْخُبْز قُلْتُ لَا شُكْرًا أَنَا بِخَيْر", "prompt": {"target_blocks": [{"text": "How does Yusuf answer the offer of bread?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ar.a2.unit76.law_samaht.lesson05.exercise03.match_text", "type": "matching_pairs", "tested_text": "أَنَا فِي الْمَطْعَم لَوْ سَمَحْتَ هَلْ يُمْكِنُكَ أَنْ تُحْضِرَ الْمَاء بِكُلِّ سُرُور هَلْ تُرِيدُ الْخُبْز لَا شُكْرًا أَنَا بِخَيْر", "prompt": {"target_blocks": []}, "pairs": [{"left": "أَنَا فِي الْمَطْعَم.", "right": "I am at the restaurant."}, {"left": "لَوْ سَمَحْتَ.", "right": "Excuse me."}, {"left": "هَلْ يُمْكِنُكَ أَنْ تُحْضِرَ الْمَاء؟", "right": "Can you bring the water?"}, {"left": "بِكُلِّ سُرُور!", "right": "With pleasure!"}, {"left": "هَلْ تُرِيدُ الْخُبْز؟", "right": "Do you want the bread?"}, {"left": "لَا شُكْرًا، أَنَا بِخَيْر.", "right": "No thanks, I am fine."}]}
