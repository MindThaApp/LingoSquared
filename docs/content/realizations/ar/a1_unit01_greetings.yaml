schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ar
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    FSI Modern Written Arabic Vol 1 (public domain, US FSI, see
    docs/content/SOURCES_ARABIC_MSA.md) was fetched and read page-by-page
    (front matter pp.i-xiv, Lessons 1-2, pp.1-11) as the required research
    pass for this bootstrap unit. Its actual content opens with formal
    written-Arabic equational sentences about countries and political
    systems ("لبنان جمهورية" / lubnaan jumhuuriyya, "Lebanon [is] a
    republic") with full case-ending grammar, and explicitly states the
    student is expected to already know the Arabic writing system and
    pronunciation before starting -- it is not a beginner
    greetings/introductions course and has no spoken-greeting material to
    adapt for this specific unit. This unit's greeting/farewell/politeness
    content is therefore established-conventions original authoring
    (standard Modern Standard Arabic forms any modern course teaches),
    not FSI-adapted -- disclosed honestly rather than folded into an
    undifferentiated "researched" claim. FSI Vol 1's country-name
    vocabulary IS adapted into a1_unit02 (introductions); see that file's
    own provenance note.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_review
  notes: >-
    First-ever Modern Standard Arabic content for this project (en-ar
    bootstrap, alongside a1_unit02/a1_unit03). Authored without full
    tashkeel (vowel diacritics) in any tested/typed text, per standing
    project decision -- the virtual keyboard has no harakat input, so
    accepted_answers must stay unvocalized; pronunciation is instead
    given via Latin transliteration in overlay notes, the same pattern
    already used for fa. Arabic-range codepoints used throughout (kaf
    U+0643, yeh U+064A) -- never the Persian-range keheh/farsi-yeh, since
    those letters don't exist in Arabic at all. Pending fresh-context
    review.

course:
  realization_key: ar.a1
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout -- MSA has no informal
    register of its own (that lives in the spoken dialects, out of scope
    for this course); politeness variation here is expressed through word
    choice, not a formal/informal split. Gendered second-person forms
    (m. أنتَ / f. أنتِ) are noted where relevant but the unvocalized
    written forms used for grading are gender-neutral by construction.

