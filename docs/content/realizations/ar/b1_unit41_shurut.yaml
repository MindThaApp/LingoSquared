  source: "Original MSA authoring. No sibling-language units were used. Character canon checked: ليلى is from مصر, يوسف is from لبنان and works as مهندس (a1_unit18_work) in مكتب, office colleague of ليلى (established b1_unit35/b1_unit39). This unit reuses يوسف and ليلى discussing personal weekend plans (a new, non-work topic between them; no conflicting canon). إذا + س-marked result for a real/possible condition was taught in b1_unit37 (contrasted there with لو for an unreal condition); this unit reuses the same إذا + س pattern and adds its negation with إذا لم + jussive to express 'if not', per universal.b1.conditions.express_real_conditions. Arabic ك (U+0643) / ي (U+064A) used throughout, never Persian ك/ي."
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Seventh unit of the ar B1 opening tier. Standalone chain -- basics
    re-taught via refresher teaching cards in lesson01. Teaches إذا +
    س-marked real/possible condition (reusing the pattern from unit37)
    and its negation with إذا لم + jussive to express "if not" in
    lesson02, then combines both in a single speaker's plan in lesson03.
    Needs fresh-context review. Review 2026-10-19: 2 fixes in this file -
    the write_negated_condition and write_full_condition_and_negation
    prompts called the verb after لم a subjunctive (لم governs the
    jussive, مجزوم) - corrected, here and in these notes; the
    write_full_condition_and_negation prompt also did not name the
    results (stay home / go to the park) or the we-form, so any other
    plan was graded wrong - now pinned. Overlay-side fixes listed in the
    overlay. NATIVE FLAGS: the result clauses are written without the
    jawab fa (إذا أمطرت، سنبقى) as in unit37; prescriptive grammar
    requires فسنبقى / فسنذهب when the result starts with س - the
    fa-variants are now accepted, but a native should decide whether
    the taught model lines should carry ف. Review 2026-10-19 (consistency):
    resolved - the jawab fa is now canonical (فسنبقى / فسنذهب) in all three
    audio texts (all pending_generation), teaching targets/examples,
    tested_text (13 exercises), word_bank tiles, matching pairs and write
    prompts; فسنبقى / فسنذهب added to the model-line cards' introduced_tokens.
