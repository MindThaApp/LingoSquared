  notes: >-
    Third unit of the ar B1 45-49 span, following b1_unit46. Standalone
    chain -- basics re-taught via refresher teaching cards in lesson01.
    Teaches ليتني + past-tense verb for a past wish in lesson01, كان
    يجب أن + subjunctive present for a should-have-done regret in
    lesson02 (كان يجب أن requires the SUBJUNCTIVE PRESENT after أن, not
    a past-tense verb -- distinct from the قبل أن/بعد أن pair, neither
    of which appears in this unit), and lesson03 combines both in a
    single act of expressing regret, per
    universal.b1.hypotheticals.express_regret_and_past_wishes. Needs
