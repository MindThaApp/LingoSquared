  notes: >-
    Fourth unit of the ar B1 opening tier. Standalone chain -- basics
    re-taught via a refresher teaching card in lesson01. Teaches
    أوافقك الرأي في أن + clause to agree while explicitly referencing the
    other person's stated opinion, contrasted with لا أوافقك الرأي في أن +
    clause to disagree the same way, both always paired with a لأن reason.
    Needs fresh-context review.
