  source: "Original MSA authoring. No sibling-language units were used. Character canon checked: ليلى is from مصر, يوسف is from لبنان and works as مهندس (a1_unit18_work) in مكتب, نور is يوسف's sister (a2_unit30, job-interview candidate, no occupation/outcome established; b1_unit37 leaves her interview outcome unresolved and this unit does not touch it). This unit reuses يوسف and ليلى as office colleagues (established b1_unit35) and reuses the أعتقد أن / لأن / أوافقك الرأي / لا أوافقك الرأي opinion-and-reason vocabulary already taught in a2_unit26_araa, extending it with the B1 في أن construction that explicitly references the other speaker's stated view. Arabic ك (U+0643) / ي (U+064A) used throughout, never Persian ك/ي."
