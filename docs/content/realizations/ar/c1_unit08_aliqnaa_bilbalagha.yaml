  notes: 'Targets universal.c1.persuasion.persuade_with_rhetorical_devices. Review naturalness of MSA register and accepted answer coverage. Review 2026-10-19: 8 fixes - 36 move-card titles/glosses glossed the Arabic label with its example sentence (now the label''s own meaning, example moved to note); hamza-less spellings normalised (unit title الإقناع, أيدينا, إلى/وإلى) and sentence-initial ''ان هذا القرار'' corrected to إنّ (إن هذا القرار), not أن (hamza-less forms kept as accepted answers); lesson02 word_order cut at dangling ''والى'' (now the full parallel sentence); lesson06 word_order spanned a sentence boundary (''...أيدينا نحتاج'') - now ''إن هذا القرار مهم حقا لمستقبل الفريق''; English ''lost from our hands'' calque replaced by ''slips through our fingers''; fixed ''.?'' typo in lesson06 recognize prompt; replaced ''unit model'' wording and made the matching instruction describe the label-to-example task; added SVO accepted variant for lesson05. NATIVE FLAGS: ''زملائي هذا وقت العمل'' would normally carry a vocative comma (زملائي، هذا ...); تصعيد الحدة as the label for building up the force of an appeal.'
