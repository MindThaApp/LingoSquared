status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (same
    honest-disclosure precedent as units01-02 of this wave). Sibling-
    isolation honored: the X->ar B2 realization and every nl/fa/prs/de
    B2 file were treated as non-existent and were NOT opened; only ar's
    OWN unit01/unit02 of this same wave were consulted for character
    canon and register (not a sibling-direction violation). Character
    canon checked against unit01/unit02 and the ar B1 tier: ليلى is
    from مصر (Egypt); يوسف is from لبنان (Lebanon), works as مهندس
    (engineer) in مكتب (office), office colleague of ليلى. This unit
    has them compare opinions about a film they watched together, a
    fresh everyday topic that touches no established job/nationality/
    relationship fact. Register: Modern Standard Arabic (fusha),
    professional register between colleagues, unchanged from units
    01-02. Arabic ك (U+0643) / ي (U+064A) used throughout, never
    Persian ك/ی/پ/چ/ژ/گ. No diacritics (harakat) or tanwin marks used
    in any tested_text/correct_response -- accusative tanwin nunation
    is written with the plain orthographic alif only (e.g. نوعا،
    فعلا، حقا، تماما، رائعا، مقصودا), matching everyday unvocalized MSA
    writing and the fix applied to unit01's أيضا.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Third Arabic B2 unit (3 of 4 authored this wave). Targets
    universal.b2.discourse.express_nuance_with_hedging_and_emphasis:
    soften or strengthen a statement (hedging, qualification, emphasis,
    focus constructions) so the same content can be delivered
    tentatively, neutrally, or emphatically. Theme: ليلى ويوسف compare
    opinions about a film they watched, across all six lessons,
    mirroring the shipped nl B2 unit03 as the structural exemplar. L01
    basic hedging (نوعا ما / إلى حد ما), L02 more hedging (من الممكن أن
    / في الغالب), L03 basic emphasis (بالتأكيد / فعلا / حقا), L04
    stronger emphasis and a focus/cleft construction (ما...إلا /
    الذي...هو), L05 a text mixing hedged and emphatic claims, L06 the
    culminating production -- a ليلى/يوسف dialogue for the listening
    requirement plus a speaking task and a writing task that each
    require delivering the SAME claim twice, once hedged and once
    emphasized, the literal shape of the spine outcome's
    modulate_a_statement assessment requirement. B2 is a separate
    Course row from B1 and this unit is authored self-contained, same
    precedent as units 01-02. Dictation used exactly twice (lessons 01
    and 02), at the unit cap.
    Review 2026-10-19: 7 fixes - lesson03 matching had فعلا='really' and
    حقا='truly', two interchangeable rights, so the حقا pair became
    أعجبني الفيلم حقا = 'I truly liked the film'; the cleft note falsely
    said the pronoun هو is grammatically required, now says to keep it
    in this construction; speak_hedge3 accepts feminine متأكدة; added
    الفيلم جيد في الغالب, الفيلم جيد حقا (for 'really good'), كان
    التمثيل رائعا فعلا/حقا and التمثيل كان رائعا حقا, and a حقا variant
    for both lesson06 hedge-then-emphasis tasks. NATIVE FLAGS: ما هذا
    الفيلم إلا رائع may sound too literary for a casual colleague chat;
    whether the hedged جيد and the emphatic رائع count as the same claim
    at different force levels (the lesson06 premise).

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, professional register
    between colleagues -- the same register pin as units 01-02 and the
    ar B1 tier. B2 nuance layers hedging and emphasis connectives onto
    that register -- نوعا ما، إلى حد ما، من الممكن أن، في الغالب،
    بالتأكيد، فعلا، حقا، ما...إلا -- while ليلى ويوسف keep the same
    professional-colleague footing established earlier.

