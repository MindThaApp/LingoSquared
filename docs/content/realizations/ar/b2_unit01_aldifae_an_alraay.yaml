            prompt: {target_blocks: [{text: "Write a full argument in Arabic defending your position. Write these four sentences, using أولاً, من ناحية أخرى and مع ذلك as signposts: (1) I think social media sites are more useful than harmful. (2) Firstly, these sites facilitate communication between friends and family. (3) On the other hand, these sites waste a lot of time. (4) Nevertheless, the benefits outweigh the harms.", language_code: en, direction: ltr}]}
