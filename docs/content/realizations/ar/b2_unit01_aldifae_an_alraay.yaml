            type: writing_prompt
            tested_text: باختصار الفوائد تفوق الأضرار
            prompt: {target_blocks: [{text: "Write in Arabic, using باختصار to signpost the conclusion: In short, the benefits outweigh the harms.", language_code: en, direction: ltr}]}

      - content_key: ar.b2.unit01.lesson05.qiraat_nass_hijaji
        title: قراءة نص حجاجي
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: ar.b2.unit01.lesson05.teach.nass_hijaji
            kind: reading
            target:
              text: >-
                يتزايد استخدام مواقع التواصل الاجتماعي بين الناس. أرى أن
                هذا تطور جيد. أولاً، تسهّل هذه المواقع التواصل بين
                الأصدقاء والعائلة. بالإضافة إلى ذلك، تشير الدراسات إلى
                أن هذه المواقع مفيدة للتعلم أيضا. صحيح أن البعض يرى أنها
                تضيّع الكثير من الوقت. هذا لا يغير حقيقة أن الفوائد تفوق
                الأضرار. باختصار، مواقع التواصل الاجتماعي مفيدة أكثر
                مما هي ضارة.
              language_code: ar
              direction: rtl
            introduced_tokens: [يتزايد, استخدام, الناس, تطور, جيد, أيضا, أنها]
        exercises:
          - content_key: ar.b2.unit01.lesson05.exercise01.read_claim
            type: reading_comprehension
            tested_text: هذا تطور جيد
            prompt: {target_blocks: [{text: "What is the author's main claim about social media?", language_code: en, direction: ltr}]}
          - content_key: ar.b2.unit01.lesson05.exercise02.read_objection
            type: reading_comprehension
            tested_text: البعض يرى أنها تضيّع الكثير من الوقت
            prompt: {target_blocks: [{text: "Which objection does the author acknowledge before answering it?", language_code: en, direction: ltr}]}
          - content_key: ar.b2.unit01.lesson05.exercise03.read_rebuttal
            type: reading_comprehension
            tested_text: الفوائد تفوق الأضرار
            prompt: {target_blocks: [{text: "How does the author answer that objection?", language_code: en, direction: ltr}]}
          - content_key: ar.b2.unit01.lesson05.exercise04.read_conclusion
            type: reading_comprehension
            tested_text: مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة
            prompt: {target_blocks: [{text: "What is the author's overall conclusion?", language_code: en, direction: ltr}]}
          - content_key: ar.b2.unit01.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: يتزايد استخدام الناس تطور جيد أيضا أنها
            prompt: {target_blocks: []}
            pairs:
              - {left: يتزايد, right: increases}
              - {left: استخدام, right: use}
              - {left: الناس, right: people}
              - {left: تطور, right: development}
              - {left: جيد, right: good}
              - {left: أيضا, right: also}
              - {left: أنها, right: "that it"}
          - content_key: ar.b2.unit01.lesson05.exercise06.translate_use
            type: translation
            tested_text: يتزايد استخدام مواقع التواصل الاجتماعي بين الناس
            prompt: {target_blocks: [{text: "The use of social media sites is increasing among people.", language_code: en, direction: ltr}]}
          - content_key: ar.b2.unit01.lesson05.exercise07.write_good_development
            type: writing_prompt
            tested_text: أرى أن هذا تطور جيد
            prompt: {target_blocks: [{text: "Write in Arabic: I think this is a good development.", language_code: en, direction: ltr}]}

