  - content_key: ar.b2.audio.dialogue.aldifae.01
    language: ar
    text: >-
      ليلى: أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة.
      يوسف: لماذا ترين ذلك؟ ليلى: أولاً، تسهّل هذه المواقع التواصل بين
      الأصدقاء والعائلة. بالإضافة إلى ذلك، تشير الدراسات إلى أن هذه
