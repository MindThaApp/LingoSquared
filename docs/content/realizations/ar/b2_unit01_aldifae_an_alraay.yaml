status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Original MSA authoring, from scratch. No adaptable intermediate/
    upper-intermediate public-domain Arabic source was located (the ar
    B1 tier was itself built without such a source; no upper-level FSI/
    Peace Corps Arabic volume was surfaced). Sibling-isolation honored:
    the X->ar B2 realization and every nl/fa/prs/de B2 file were treated
    as non-existent and were NOT opened; only ar's OWN earlier B1
    realization content was consulted for character canon. Character
    canon checked by grepping every ar/b1_*.yaml for the two names used
    here: ليلى is established as from مصر (Egypt); يوسف is established
    as from لبنان (Lebanon), works as مهندس (engineer) in مكتب (office),
    office colleague of ليلى (b1_unit35/38/39/41/45/46/47/48/49/50/51/
    52/53). Register policy across the B1 tier is Modern Standard
    Arabic (fusha), professional register between colleagues -- carried
    forward unchanged. This unit has ليلى and يوسف debate an everyday
    opinion (social media use) using B2 argumentation connectives; no
    established job/nationality/relationship fact is touched, added to,
    or contradicted. Arabic ك (U+0643) / ي (U+064A) used throughout,
    never Persian ك/ی/پ/چ/ژ/گ. No diacritics (harakat) used in any
    tested_text/correct_response, matching the unvocalized MSA
    orthography convention already established across the ar B1 tier.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Arabic (MSA) fresh-context review needed. This is a DRAFT.
    Priority checks: (1) gender agreement throughout -- مواقع (broken
    plural, non-human) consistently takes feminine-singular agreement
    (مفيدة، ضارة، تسهّل، تضيّع، هي) and الدراسات/الفوائد/الأضرار (feminine
    plurals) consistently take feminine-singular verb agreement in
    verb-initial (VSO) position; (2) naturalness of every connective
    (أرى أن / من وجهة نظري, أولاً / بالإضافة إلى ذلك / تشير الدراسات إلى
    أن, من ناحية...من ناحية أخرى, لكن / إلا أن / هذا لا يغير حقيقة أن /
    باختصار) to a native ear, and that none reads as an English calque;
    (3) whether "في هذا شيء من الصحة" (there's something to that) is the
    most natural MSA idiom for a partial concession, or whether a
    reviewer prefers an alternative; (4) the culminating lesson06
    writing/speaking answer (four sentences) is graded against fixed
    strings -- confirm the supplied period/no-trailing-period and
    comma/no-comma variants are complete enough that a correct learner
    is never marked wrong, given Arabic is graded fully byte-strict
    (script='arabic', zero distance-1 typo tolerance) with no
    internal-punctuation stripping.
  notes: >-
    First Arabic B2 unit (1 of 4 authored this wave, units 01-04).
    Targets universal.b2.argumentation.defend_a_position_with_evidence:
    state a claim, support it with reasons/evidence, acknowledge the
    strongest opposing point, and rebut it without conceding. Theme:
    استخدام مواقع التواصل الاجتماعي (social media use) -- one coherent
    debatable everyday issue across all six lessons, chosen fresh
    (distinct from the B1 tier's "work from home" debate topic) even
    though ليلى ويوسف are the same established colleagues, per the
    reused-characters-new-topic precedent the nl B2 lane also used.
    Lesson arc mirrors the argument structure itself, following the
    shipped nl B2 unit01 as the structural exemplar: L01 stating a
    claim (أرى أن / من وجهة نظري), L02 supporting it (أولاً / بالإضافة
    إلى ذلك / تشير الدراسات إلى أن), L03 acknowledging the opposing
    point (من ناحية...من ناحية أخرى / صحيح أن / البعض يرى أن), L04
    rebutting without conceding (لكن / هذا لا يغير حقيقة أن / باختصار),
    L05 an argumentative reading text (distinguish the author's claim
    from the objection answered), L06 the culminating production -- a
    ليلى/يوسف debate for the listening requirement plus a speaking task
    and a writing task that each require a FULL argument (claim +
    support + acknowledged objection + rebuttal), not just connective
    drilling. B2 is a separate Course row from B1, so a B2 learner never
    sees B1 lexemes at runtime -- all vocabulary is introduced
    self-contained within this file, the same precedent nl's first B2
    unit set. Dictation used exactly twice (lessons 01 and 02), at the
    unit cap.

course:
  realization_key: ar.b2
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, professional register
    between colleagues -- the same register pin as the ar B1 tier. B2
    argumentation layers discourse connectives onto that register --
    أرى أن، من وجهة نظري، أولاً، بالإضافة إلى ذلك، تشير الدراسات إلى أن،
    من ناحية...من ناحية أخرى، صحيح أن، لكن، هذا لا يغير حقيقة أن،
    باختصار -- while ليلى ويوسف keep the same professional-colleague
    footing established in the B1 tier.

