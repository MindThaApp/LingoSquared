            tested_text: مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة
            media_asset_key: ar.b2.audio.dialogue.aldifae.01
            prompt: {target_blocks: [{text: "What is Layla's main claim?", language_code: en, direction: ltr}]}
          - content_key: ar.b2.unit01.lesson06.exercise02.comprehend_objection
