            tested_text: أرى أن مواقع التواصل الاجتماعي مفيدة أكثر مما هي ضارة أولاً تسهّل هذه المواقع التواصل بين الأصدقاء والعائلة من ناحية أخرى تضيّع هذه المواقع الكثير من الوقت مع ذلك الفوائد تفوق الأضرار
            prompt: {target_blocks: [{text: "Defend a position aloud in Arabic with a full argument. Say these four sentences, using أولاً, من ناحية أخرى and مع ذلك as signposts: (1) I think social media sites are more useful than harmful. (2) Firstly, these sites facilitate communication between friends and family. (3) On the other hand, these sites waste a lot of time. (4) Nevertheless, the benefits outweigh the harms.", language_code: en, direction: ltr}]}
