  source: "Original MSA authoring. No sibling-language units were used. Character canon checked: ليلى is from مصر, يوسف is from لبنان and works as مهندس in مكتب, office colleague of ليلى (b1_unit35/b1_unit39). نور is يوسف's sister (a2_unit30 established her as a job-interview candidate; المديرة is a fresh, unnamed interviewer role from that unit, not a recurring canon character). This unit has يوسف report to ليلى, in reported-speech form, two lines from نور's a2_unit30 interview dialogue: نور's own statement 'عملت في هذا المجال لمدة سنتين' (first person -> reported with person shift to إنها عملت) and المديرة's question to نور 'هل أنت متاحة للعمل في عطلة نهاية الأسبوع؟' (second person -> reported with person shift to إذا كانت متاحة). Neither the interview's outcome nor نور's occupation is asserted or resolved here, consistent with a2_unit30/b1_unit37/b1_unit40's established silence on that point. Arabic ك (U+0643) / ي (U+064A) used throughout, never Persian ك/ي."
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Ninth unit of the ar B1 opening tier. Standalone chain -- basics
    re-taught via refresher teaching cards in lesson01. Teaches قال/قالت
    إن + person shift to report a statement in lesson01, and سأل/سألت
    إذا + person shift to report a yes/no question in lesson02, then
    lesson03 combines both in one act of reporting, per
    universal.b1.reported_speech.report_what_someone_said. Needs
    fresh-context review. Review 2026-10-19: 1 fix in this file -
    match_reported_question paired نهاية الأسبوع "the weekend" with عطلة
    نهاية الأسبوع "the weekend holiday" (near-interchangeable meanings);
    the first pair is now عطلة "holiday / day off". Overlay-side fixes
    listed in the overlay. NATIVE FLAGS: سأل + إذا for a reported yes/no
    question is the common modern usage; stricter MSA prefers إن or هل
    (سألتها إن كانت / هل هي) - kept as authored.
