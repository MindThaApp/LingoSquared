  - content_key: ar.a1.audio.dialogue.first_meeting.01
    language: ar
    text: >-
      يوسف: مرحبا. ليلى: مرحبا. يوسف: ما اسمك؟ ليلى: اسمي ليلى. وأنت؟
      يوسف: اسمي يوسف. تشرفنا. ليلى: تشرفنا. يوسف: من أين أنت؟
      ليلى: أنا من مصر. وأنت؟ يوسف: أنا من لبنان. ليلى: سعدت بلقائك.
      يوسف: مرحبا بك دائما. مع السلامة. ليلى: مع السلامة.
    voice_hint: adult_male_and_female_neutral
    status: pending_generation

