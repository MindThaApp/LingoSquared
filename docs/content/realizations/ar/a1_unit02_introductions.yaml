schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ar
cefr_level: A1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source: >-
    Country-name vocabulary (لبنان، مصر، الأردن، المغرب، سوريا، العراق) is
    adapted from FSI Modern Written Arabic Vol 1, Lessons 1-2 (pp.1-9,
    see docs/content/SOURCES_ARABIC_MSA.md and the paired a1_unit01
    realization's own provenance note for the full research description).
    That is the actual FSI content genuinely relevant to this unit. FSI's
    own presentation is formal written-Arabic equational-sentence grammar
    with full case endings (e.g. "لبنان جمهورية" / lubnaan jumhuuriyya,
    literally "Lebanon [is-a] republic") aimed at a learner who already
    reads Arabic -- modernized here into natural unvocalized spoken A1
    self-introduction frames ("أنا من لبنان", "I'm from Lebanon") per
    AUTHORING_GUIDE.md §10's modernization requirement, not copied
    verbatim; no FSI sentence reads the same after this adaptation. The
    name-exchange/introduction phrases (ما اسمك، اسمي، تشرفنا، من أين
    أنت) have no counterpart in the FSI Vol 1 material actually read for
    this pass and are established-conventions original authoring.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second of three first-ever Modern Standard Arabic units (en-ar
    bootstrap). Same no-tashkeel-in-tested-text policy as a1_unit01.
    lesson04's dialogue reuses مع السلامة from a1_unit01 (already taught,
    cross-unit reuse is expected). Fresh-context reviewed 2026-07-12: MSA (fusha) verified correct and natural; compiler clean (0 errors). NOTE: a frontend blocker is flagged separately -- "ar" is missing from packages/shared LANGUAGE_SCRIPT and the shared "arabic" virtual keyboard is Perso-Arabic (Persian keheh/yeh, not Arabic kaf U+0643 / yeh U+064A), so Arabic-typing exercises cannot yet be typed/graded until the frontend/infra lane adds a true-Arabic keyboard layout.
    Review 2026-10-19: 0 fixes in this realization (10 fixes in the paired en-ar overlay). NATIVE FLAGS: line11 مرحبا بك دائما as a first-meeting farewell - check naturalness.

course:
  realization_key: ar.a1
  target_language_first: true
  dialect: msa_standard_formal
  register_policy: >-
    Modern Standard Arabic (fusha) throughout, matching a1_unit01. The
    self-introduction dialogue uses two Arabic names (ليلى، يوسف) and a
    natural first-meeting sequence.

media_assets:
