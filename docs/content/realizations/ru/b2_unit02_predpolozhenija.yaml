units:
  - content_key: ru.b2.unit02.predpolozhenija
    title: "Предположения"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.speculation.hypothesize_about_causes_and_consequences
    planned_lesson_count: 6

    lessons:
      - content_key: ru.b2.unit02.lesson01.shkala_uverennosti
        title: "Насколько ты уверен?"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
          - content_key: ru.b2.unit02.lesson01.teach.mozhet_byt
            kind: vocabulary
            target: {text: "может быть", language_code: ru, direction: ltr}
            introduced_tokens: [может, быть]
            example: {text: "Может быть, она опаздывает.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit02.lesson01.teach.vozmozhno
            kind: vocabulary
            target: {text: "возможно", language_code: ru, direction: ltr}
            introduced_tokens: [возможно]
            example: {text: "Возможно, автобус задерживается.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit02.lesson01.teach.navernoe
            kind: vocabulary
            target: {text: "наверное", language_code: ru, direction: ltr}
            introduced_tokens: [наверное]
            example: {text: "Наверное, она забыла телефон.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit02.lesson01.teach.dolzhno_byt
            kind: phrase
            target: {text: "должно быть", language_code: ru, direction: ltr}
            introduced_tokens: [должно]
          - content_key: ru.b2.unit02.lesson01.teach.ne_mozhet_byt_chto
            kind: phrase
            target: {text: "не может быть, что...", language_code: ru, direction: ltr}
            introduced_tokens: []
          - content_key: ru.b2.unit02.lesson01.teach.ona
            kind: vocabulary
            target: {text: "она", language_code: ru, direction: ltr}
            introduced_tokens: [она]
            example: {text: "Она обычно приходит вовремя.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit02.lesson01.teach.zastryala_v_probke
            kind: phrase
            target: {text: "застряла в пробке", language_code: ru, direction: ltr}
            introduced_tokens: [застряла, пробке]
          - content_key: ru.b2.unit02.lesson01.teach.oli_eshcho_net
            kind: phrase
            target: {text: "Оли ещё нет.", language_code: ru, direction: ltr}
            introduced_tokens: [Оли, ещё, нет]
          - content_key: ru.b2.unit02.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Оли ещё нет. Наверное, она застряла в пробке.", language_code: ru, direction: ltr}
            introduced_tokens: []
          - content_key: ru.b2.unit02.lesson01.teach.grammar_shkala
            kind: grammar_note
            target: {text: "может быть < возможно < наверное < должно быть < не может быть, что", language_code: ru, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ru.b2.unit02.lesson01.exercise01.recognize_navernoe
            type: multiple_choice
            tested_text: "наверное"
            prompt: {target_blocks: [{text: "наверное", language_code: ru, direction: ltr}]}
