            prompt: {target_blocks: []}
          - content_key: ru.b2.unit02.lesson01.exercise03.match_certainty_words
            type: matching_pairs
            tested_text: "может быть возможно наверное должно быть не может быть что застряла в пробке Оли ещё нет"
            prompt: {target_blocks: []}
            pairs:
              - {left: "может быть", right: "maybe"}
              - {left: "возможно", right: "possibly"}
              - {left: "наверное", right: "probably"}
              - {left: "должно быть", right: "it must be"}
              - {left: "не может быть, что...", right: "it can't be that..."}
