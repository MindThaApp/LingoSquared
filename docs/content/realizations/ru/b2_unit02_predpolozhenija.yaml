target_language: ru
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ru's
    second B2 unit (speculation). No adaptable intermediate/upper-level
    public-domain Russian source exists for this topic, so this was built
    from general Russian grammar/discourse knowledge, the same
    honest-disclosure precedent this unit's own B2 unit01 set.
    Sibling-isolation honored: the X->en B2 speculation realization and
    every nl/fa/prs/de B2 file were treated as non-existent and were NOT
    opened; only ru's OWN earlier realization content (the Настя/Дима
    pair) was consulted for character canon. Настя and Дима speculate
    together here about a mutual friend, Оля, who is late, which
    introduces no canon conflict (Оля has no prior established facts in
    the corpus). Gender-agreement footgun deliberately designed around,
    as in unit01: every past-tense deduction sentence about Оля
    consistently uses feminine agreement (she is a named, known-gender
    third party, not the learner), so no exercise ever asks the learner to
    choose their OWN speaker-gendered form.
review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Second Russian B2 unit; first speculation unit. Targets the CEFR B2
    speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    speculate about causes and consequences with graded certainty -- say
    what may/might/must/cannot be the case in the present and the past,
    and distinguish deduction (evidence-based) from guesswork. Theme: one
    coherent everyday puzzle across all six lessons -- a friend, Оля, is
    late, and Настя and Дима speculate about why. Lesson arc: L01 the
    certainty scale (может быть / возможно / наверное / должно быть / не
    может быть, что); L02 deduction from evidence (должно быть + потому
    что, значит, судя по всему); L03 contrasting a guess with a deduction;
    L04 speculating about a past cause; L05 a reading passage separating
    asserted fact from speculation; L06 the culminating dialogue where
    Настя and Дима speculate together and the puzzle resolves. No
    sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grading-safety of every free-text accepted answer against
    the strict Cyrillic grader (no ё/е equivalence, em dash kept as a
    token, 3-letter tokens get no spoken tolerance), prompt/key
    determinacy, collocation naturalness, reading-question answerability
    and learner-visible notes. Fixes:
    lesson01.exercise06.speak_ne_mozhet_byt tested_text + key "Не может
    быть, что она застряла" -> "... застряла в пробке" (prompt says
    'stuck in traffic'; also accepts the normative "Не может быть, чтобы
    она застряла в пробке"); е-spelling variants added for every
    free-text accepted answer containing ё (lesson01.exercise07,
    lesson05.exercise07, lesson06.exercise05/06);
    lesson05.exercise07.write_slomalas_mashina also accepts the natural
    order "у неё машина сломалась"; заняты -> загружены (busy roads
    collocation) in lesson02 teach.potomu_chto example,
    teach.grammar_dedukcija target + introduced_tokens, exercise05/06
    tested_text + keys + feedback; lesson05.exercise02.read_weak_guess
    instruction -> "Which of these sentences is only a guess, not a fact
    or a deduction?" (the old 'weakest guess' wording contradicted the
    unit's own scale) + feedback; lesson04.exercise06 prompt pinned to
    "using не могла"; reading passage added to the target_blocks of all
    four lesson05 reading_comprehension prompts; overlay notes for
    teach.sudya_po_vsemu and teach.grammar_dedukcija no longer cite
    internal lesson numbers. NATIVE FLAGS: "Не может быть, что +
    indicative" vs normative "чтобы + past" (lesson01/04/06); lesson06
    dialogue "Может быть, а может быть, что-то случилось" reads awkward
    ("Может быть. А может, ..."?); the "судя по тому, что она всегда
    пишет заранее" deduction lacks its premise ("а сегодня не
    написала"), and lesson03.exercise04 drops должно быть;
    adverb-after-subject orders ("Она, наверное, ...") are not accepted
    (systemic). DEFERRED: dictation ё/е (lesson01.exercise08) and a
    grader-level ё/е fold + dash stripping for ru in
    backend/app/review/grading.py (Codex/owner decision); audio dialogue
    text unchanged.

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты between Настя and Дима (continuing the ru B1 lane canon:
    Дима is an engineer, Настя is a teacher; see unit01). B2 speculation
    layers graded-certainty modal frames onto that register -- может
    быть, возможно, наверное, должно быть, значит -- while keeping
    everyday informal address. Learner-facing production items avoid
    forcing a speaker-gender choice; past-tense deduction about a named
    third party (Оля) consistently uses feminine agreement.

