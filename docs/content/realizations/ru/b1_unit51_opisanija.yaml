              - {left: "работаю над проектом", right: "I work on the project"}
              - {left: "подруга, с которой", right: "the friend, with whom"}
              - {left: "хожу в кино", right: "I go to the cinema"}
              - {left: "творительном падеже", right: "the instrumental case"}
              - {left: "предлог", right: "a preposition"}
          - content_key: ru.b1.unit51.lesson02.exercise05.order_s_kotoroj_podruga
            type: word_order
            tested_text: "Это подруга с которой я хожу в кино"
            prompt: {target_blocks: []}
            word_bank: ["Это", "подруга", "с", "которой", "я", "хожу", "в", "кино"]
          - content_key: ru.b1.unit51.lesson02.exercise06.write_s_kotorym_kollega
            type: writing_prompt
            tested_text: "Это коллега с которым я работаю над проектом"
            prompt: {target_blocks: [{text: "Write exactly this sentence using с которым (relative pronoun combined with a preposition, instrumental case, masculine): This is the colleague I work on the project with.", language_code: en, direction: ltr}]}

      - content_key: ru.b1.unit51.lesson03.opisanija_kollegi
        title: "Описания коллег"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
