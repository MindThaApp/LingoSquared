            tested_text: "это моя коллега с которой я работаю над новым проектом проект о котором вы говорите интересный"
            prompt: {target_blocks: [{text: "Which answer combines two facts about a colleague into one sentence using a gender-agreeing который that also combines with a preposition?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit51.lesson03.exercise02.dialogue_comprehension_opisanija
            type: dialogue_comprehension
            tested_text: "это дима который работает инженером а это моя коллега с которой я работаю над новым проектом приятно познакомиться проект о котором вы говорите интересный да очень"
