          - {content_key: ru.b1.unit51.lesson03.teach.dima_intro_kollega, kind: dialogue, target: {text: "А это моя коллега, с которой я работаю над новым проектом.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [А, моя, новым]}
