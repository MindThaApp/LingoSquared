            type: listen_select
            tested_text: "Это коллега с которым я работаю над проектом"
            media_asset_key: ru.b1.audio.eto_kollega_s_kotorym.neutral.01
            prompt: {target_blocks: [{text: "Listen. Who is described, and how?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit51.lesson02.exercise04.match_s_kotorym_words
            type: matching_pairs
            tested_text: "коллега с которым работаю над проектом подруга с которой хожу в кино"
            prompt: {target_blocks: []}
            pairs:
