          - content_key: ru.b1.unit51.lesson03.exercise04.order_dima_intro_kollega
            type: word_order
            tested_text: "А это моя коллега с которой я работаю над новым проектом"
            prompt: {target_blocks: []}
            word_bank: ["А", "это", "моя", "коллега", "с", "которой", "я", "работаю", "над", "новым", "проектом"]
          - content_key: ru.b1.unit51.lesson03.exercise05.reply_ask_proekt
            type: dialogue_response
            tested_text: "Да очень"
            prompt: {target_blocks: [{text: "Настя: Проект, о котором вы говорите, интересный?", language_code: ru, direction: ltr}]}
          - content_key: ru.b1.unit51.lesson03.exercise06.write_full_description
            type: writing_prompt
            tested_text: "Это моя коллега с которой я работаю над новым проектом"
            prompt: {target_blocks: [{text: "Combine these two facts into one sentence using с которой (feminine relative pronoun combined with a preposition, instrumental case): \"She is my colleague.\" + \"I work with her on a new project.\"", language_code: en, direction: ltr}]}
