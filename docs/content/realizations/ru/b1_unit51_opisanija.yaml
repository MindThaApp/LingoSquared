  notes: "New Claude-authored B1 draft. Needs fresh-context review.\n\nFresh-context review 2026-10-11 (content-reviewer.md checklist): Checked token coverage against earlier en-ru units (course-scoped), character canon (Дима engineer, Настя teacher, friends on ты), every example_gloss against its example, teaching-card/overlay coverage, dialogue cards vs audio turn by turn with speakers, listen_select distractors vs audio, YAML boolean lookalikes, learner-visible internal notes, and ё/е spelling of free-text answers (grader has no ё/е fold). Fixes (en-ru overlay): ru.b1.unit51.lesson03.exercise06.write_full_description accepted the literal 'Она моя коллега, с которой я работаю над новым проектом.' (the prompt gives 'She is my colleague'); ru.b1.unit51.lesson02.teach.s_kotorym_grammar note 'the instrumental (creative) case' -> 'the instrumental case (творительный падеж)'. NATIVE FLAG: lesson03 dialogue (audio + cards) - Настя introduces Дима apparently to the colleague he already works with, then asks 'Проект, о котором вы говорите, интересный?' with вы although Настя and Дима are on ты; it reads as plural вы to Дима and the colleague (grammatical), but the scene logic is muddled; if meant for Дима alone it should be 'о котором ты говоришь' (говоришь would need introducing). Left for a native/owner decision. No ё in free-text answers.\n\nFresh-context review 2026-10-17 (round 2, backlog it/ru): 0 fixes. NATIVE FLAGS: carried over from prior review (unit51 lesson03 вы vs ты scene logic; unit52 comma after в итоге; unit53 тем не менее 'stronger than но' simplification). DEFERRED: unit53 lesson03 Dima's 4th turn logic (carried over); grammatical metalanguage registered as learner vocabulary (known ru B1 defect)."

course:
  realization_key: ru.b1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Use contemporary standard Russian. Use formal вы in offices and with staff
    and colleagues; use informal ты between recurring friends Настя and Дима.
    Canon: Дима is an engineer and Настя is a teacher.

media_assets:
  - {content_key: ru.b1.audio.eto_dima_kotoryi_rabotaet.neutral.01, language: ru, text: "Это Дима, который работает инженером.", voice_hint: neutral_adult_female, status: pending_generation}
  - {content_key: ru.b1.audio.eto_kollega_s_kotorym.neutral.01, language: ru, text: "Это коллега, с которым я работаю над проектом.", voice_hint: neutral_adult_male, status: pending_generation}
  - content_key: ru.b1.audio.dialogue.opisanija_kollegi.01
    language: ru
    text: >-
      Настя: Это Дима, который работает инженером. Дима: А это моя коллега, с
      которой я работаю над новым проектом. Настя: Приятно познакомиться!
      Проект, о котором вы говорите, интересный? Дима: Да, очень.
    voice_hint: two_adults_informal
    status: pending_generation

units:
  - content_key: ru.b1.unit51.opisanija
    title: "Описания"
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.narrative.combine_descriptions_with_relative_clauses
    planned_lesson_count: 3
    lessons:
      - content_key: ru.b1.unit51.lesson01.kotoryi_kotoraja
        title: "который / которая"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - {content_key: ru.b1.unit51.lesson01.teach.eto_dima_kotoryi, kind: phrase, target: {text: "Это Дима, который работает инженером.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [Это, Дима, который, работает, инженером]}
          - {content_key: ru.b1.unit51.lesson01.teach.eto_nastja_kotoraja, kind: phrase, target: {text: "Это Настя, которая работает учительницей.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [Настя, которая, учительницей]}
          - {content_key: ru.b1.unit51.lesson01.teach.kotoryi_grammar, kind: grammar_note, target: {text: "который / которая / которое / которые = относительное местоимение, согласуется в роде и числе", language_code: ru, direction: ltr}, introduced_tokens: [которое, которые, относительное, местоимение, согласуется, роде, числе], example: {text: "который для мужского рода, которая для женского: Это Дима, который работает инженером. Это Настя, которая работает учительницей.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.b1.unit51.lesson01.exercise01.recognize_kotoryi_dima
            type: multiple_choice
            tested_text: "это дима который работает инженером"
            prompt: {target_blocks: [{text: "which Russian sentence means \"this is Dima, who works as an engineer\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit51.lesson01.exercise02.recognize_kotoraja_nastja
            type: multiple_choice
            tested_text: "это настя которая работает учительницей"
            prompt: {target_blocks: [{text: "which Russian sentence means \"this is Nastya, who works as a teacher\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit51.lesson01.exercise03.listen_select_kotoryi_dima
            type: listen_select
            tested_text: "Это Дима который работает инженером"
            media_asset_key: ru.b1.audio.eto_dima_kotoryi_rabotaet.neutral.01
            prompt: {target_blocks: [{text: "Listen. Which relative pronoun form is used, and why?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit51.lesson01.exercise04.match_kotoryi_words
            type: matching_pairs
            tested_text: "это дима который работает инженером настя которая учительницей относительное местоимение"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Это Дима, который", right: "This is Dima, who"}
              - {left: "работает инженером", right: "works as an engineer"}
              - {left: "Это Настя, которая", right: "This is Nastya, who"}
              - {left: "работает учительницей", right: "works as a teacher"}
              - {left: "относительное местоимение", right: "a relative pronoun"}
              - {left: "согласуется в роде и числе", right: "agrees in gender and number"}
          - content_key: ru.b1.unit51.lesson01.exercise05.order_kotoraja_nastja
            type: word_order
            tested_text: "Это Настя которая работает учительницей"
            prompt: {target_blocks: []}
            word_bank: ["Это", "Настя", "которая", "работает", "учительницей"]
          - content_key: ru.b1.unit51.lesson01.exercise06.write_kotoryi_dima
            type: writing_prompt
            tested_text: "Это Дима который работает инженером"
            prompt: {target_blocks: [{text: "Write exactly this sentence combining two facts with the masculine relative pronoun который: This is Dima, who works as an engineer.", language_code: en, direction: ltr}]}

          - {content_key: ru.b1.unit51.lesson01.kotoryi_kotoraja.exercise07.dictation, type: dictation, tested_text: "Это Дима, который работает инженером.", media_asset_key: ru.b1.audio.eto_dima_kotoryi_rabotaet.neutral.01, prompt: {target_blocks: []}}
      - content_key: ru.b1.unit51.lesson02.s_kotorym_s_kotoroj
        title: "с которым / с которой"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - {content_key: ru.b1.unit51.lesson02.teach.eto_kollega_s_kotorym, kind: phrase, target: {text: "Это коллега, с которым я работаю над проектом.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [коллега, с, которым, я, работаю, над, проектом]}
          - {content_key: ru.b1.unit51.lesson02.teach.eto_podruga_s_kotoroj, kind: phrase, target: {text: "Это подруга, с которой я хожу в кино.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [подруга, которой, хожу, в, кино]}
          - {content_key: ru.b1.unit51.lesson02.teach.s_kotorym_grammar, kind: grammar_note, target: {text: "с которым / с которой = который + предлог в творительном падеже", language_code: ru, direction: ltr}, introduced_tokens: [предлог, творительном, падеже], example: {text: "Который может сочетаться с предлогом: Это коллега, с которым я работаю над проектом.", language_code: ru, direction: ltr}}
