            prompt: {target_blocks: [{text: "which Russian sentence means \"this is the colleague I work on the project with\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit51.lesson02.exercise02.recognize_s_kotoroj
            type: multiple_choice
            tested_text: "это подруга с которой я хожу в кино"
            prompt: {target_blocks: [{text: "which Russian sentence means \"this is the friend I go to the cinema with\"", language_code: en, direction: ltr}]}
