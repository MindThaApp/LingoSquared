generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    Russian C1 unit 03 on fine-grained control of tone and register:
    delivering the same core message (a delayed report) in formal, diplomatic,
    ironic, and emphatic styles for different audiences. From-scratch
    generation from established Russian register conventions; no adaptable
    intermediate/upper-level public-domain Russian source exists for this
    specific topic, so no external source was consulted. Sibling isolation
    honored: the X->en realization and every nl/fa/prs/de file were treated as
    non-existent and NOT opened; the it C1 unit05 file named in the dispatch
    prompt was used ONLY for unit shape (schema 1.1, 6 lessons, exercise-type
    vocabulary), never for content. Character canon checked in
    docs/content/realizations/ru/: Настя is a teacher (feminine forms) and
    Дима is an engineer (masculine forms), an established pair who use
    informal ты with each other. This unit keeps informal register between its
    characters; formal вы appears only inside the model message addressed to a
    superior (Иван Петрович), never between Настя and Дима. The culminating
    speaking/writing model is authored gender-neutral (no gendered past-tense
    or short-adjective forms tied to the speaker — готов agrees with отчёт),
    so a learner of either gender can reproduce it verbatim.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.register.control_tone_and_register_precisely.
    Priority checks for the reviewer: (1) confirm the four tones — formal,
    diplomatic, ironic, emphatic — are each taught with a distinct lexical
    cue (Уважаемый/сообщаю, к сожалению/надеюсь на понимание, ну конечно/
    как всегда, честно говоря/просто необходимо) and that no two are
    confusable in the recognition/matching exercises; (2) confirm the
    culminating speaking and writing exercises each require the WHOLE act —
    the same core message first in a formal/diplomatic style, then in an
    emphatic style; (3) confirm the model is fully gender-neutral (no
    gendered past tense of я, no gendered short adjectives bound to the
    speaker; готов agrees with отчёт); (4) confirm every tested token is
    introduced earlier in the unit (ru C1 is its own Course row, so no
    A1-B2 vocabulary is available; this unit introduces all of its own
    vocabulary); (5) confirm matching_pairs lefts discriminate on real
    meaning and no two lefts share a gloss; (6) confirm formal вы appears
    only inside the message to the superior, never between Настя and Дима;
    (7) confirm listen/dictation exercises each use a dedicated asset whose
    text matches tested_text byte-for-byte.

course:
  realization_key: ru.c1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты throughout, matching the established ru-lane pin (Настя and
    Дима use informal ты with each other). Formal вы appears only inside the
    model message addressed to a superior (Иван Петрович) — that is the
    unit's taught CONTENT, not dialogue between Настя and Дима. The
    culminating model is first-person and gender-neutral so no learner is
    forced into a speaker-gender choice.

