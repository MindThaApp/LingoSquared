  notes: "Realizes universal.a2.purpose.say_why_you_do_things. Canon: Настя and Дима, friends using ты. Reading and dialogue agree: tomorrow Настя gets up early so as not to be late, goes to the shop to buy a present for a friend and to the post office to send a letter, and Дима asks her to call in the evening. OPEN NATIVE QUESTIONS: (1) 'для' + genitive is taught as fixed chunks (Насти, Димы, друга, ужина, работы) without case names; (2) 'зачем' glossed as 'what for' and kept distinct from 'почему'; (3) 'чтобы' + infinitive only for the same subject (no 'чтобы он пришёл' at A2); (4) 'Позвони мне вечером!' / 'Позвоню!' as a natural pair; (5) 'ставить будильник' is natural."
