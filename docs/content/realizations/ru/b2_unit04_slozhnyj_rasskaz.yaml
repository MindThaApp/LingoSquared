status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ru's
    fourth B2 unit (narrative / shifting time reference). No adaptable
    intermediate/upper-level public-domain Russian source exists for this
    topic, so this was built from general Russian grammar/discourse
    knowledge, the same honest-disclosure precedent this unit's own B2
    unit01-03 set. Sibling-isolation honored: the X->en B2 narrative
    realization and every nl/fa/prs/de B2 file were treated as
    non-existent and were NOT opened; only ru's OWN earlier realization
    content (the Настя/Дима pair, and this unit's own b2_unit02 shape) was
    consulted, which is not a sibling-direction violation. Дима recounts
    to Настя why he was late for work, which introduces no canon
    conflict. Gender-agreement footgun: unlike unit01-03, this unit's core
    outcome genuinely requires first-person past-tense narration
    (masculine, since the narrator is Дима), which cannot be avoided the
    way unit01-03 avoided it -- so EVERY exercise that produces this
    first-person narration is explicitly framed in its instruction as
    "Dima's account" / "retell Dima's story", never as the learner's own
    open self-expression, so the learner is reproducing a fixed
    third-party account rather than choosing their own speaker gender.
review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fourth Russian B2 unit; first narrative / shifting-time-reference
    unit. Targets the CEFR B2 narrative outcome
    (universal.b2.narrative.recount_complex_events_with_shifting_time):
    recount a complex sequence with shifting time reference -- background
    vs foreground, an event BEFORE other past events, keeping the
    timeline unambiguous. Theme: ONE coherent everyday incident recounted
    non-linearly across all six lessons -- Дима was late for work because
    he forgot to charge his phone the night before (pre-past), so he
    missed the message that the bus schedule had changed, and stood
    waiting in the rain (background) until an overcrowded bus finally
    arrived (interrupting foreground event). Lesson arc: L01 background
    (пока, imperfective) vs the interrupting foreground event (когда,
    perfective); L02 the pre-past event (накануне вечером + perfective,
    since Russian has no separate pluperfect); L03 adding как только (as
    soon as) for immediate sequence, contrasted with пока/когда; L04
    sequencing the whole chain with сначала/потом/в итоге; L05 a reading
    passage (Dima's message to Nastya) that requires identifying the
    earliest event; L06 the culminating dialogue where Dima recounts the
    full story to Nastya. No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grading-safety of free-text accepted answers against the
    strict Cyrillic grader (no ё/е equivalence, em dash kept as a token,
    3-letter шёл gets no spoken tolerance), prompt/key determinacy,
    timeline coherence, reading-question answerability and
    learner-visible notes. Fixes: lesson03.exercise07.speak_full_lesson
    tested_text + keys: the em dash removed from the spoken answer ("не
    успел — автобус" -> "не успел, автобус"), since a speech transcript
    can never contain it; lesson06.exercise05.speak_full_narrative
    dash-variant keys dropped (comma variants remain); е-spelling
    variants added for every free-text accepted answer containing ё
    (lesson01.exercise05/06/07, lesson03.exercise07,
    lesson04.exercise07, lesson06.exercise05/06);
    lesson05.exercise06.translate_prishlos_zhdat also accepts "Мне
    пришлось ждать следующий" and the genitive "(Мне) пришлось ждать
    следующего"; lesson04.exercise05.translate_snachala also accepts
    "... зарядить свой телефон"; reading passage added to the
    target_blocks of all four lesson05 reading_comprehension prompts;
    overlay notes for lesson02 teach.claim_model, lesson03
    teach.grammar_tri_svyazki and lesson04 teach.grammar_polnyj_rasskaz
    no longer cite internal lesson numbers or task structure. NATIVE
    FLAGS: "Накануне вечером" in a same-day conversation ("Вчера
    вечером" more natural); dialogue "Когда он наконец пришёл" --
    nearest masculine antecedent is дождь ("Когда автобус наконец
    пришёл" safer, needs audio change); reading "не успел сесть" vs "не
    смог сесть / не влез"; genitive/word-order variants ("ждал
    автобуса", "не увидел сообщения", "Автобус уже был переполнен") not
    accepted (systemic). DEFERRED: lesson03
    teach.claim_model/claim_model_2 timeline contradiction ("Как только
    автобус пришёл, я вошёл внутрь" followed by "Но сегодня я не успел")
    -- a rewrite needs the kak_tolko_voshel audio asset and listen ex02
    / word_order ex04 / matching ex03 / speak ex07 changed, owner/native
    decision; dictation ё/е (lesson01.exercise08) and the grader-level
    ё/е fold + dash stripping (backend/app/review/grading.py,
    Codex/owner decision).

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты between Настя and Дима (continuing the ru B1 lane canon:
    Дима is an engineer, Настя is a teacher; see unit01-03). B2 narrative
    layers time-reference connectives onto that register -- пока, когда,
    как только, накануне вечером, сначала, потом, в итоге. This unit's
    core outcome requires first-person masculine narration (Dima's own
    story); every such exercise is explicitly framed as reproducing
    Dima's fixed account, never the learner's own open self-expression
    (see generation_provenance note).

