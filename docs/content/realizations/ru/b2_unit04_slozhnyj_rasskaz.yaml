            target: {text: "шёл дождь", language_code: ru, direction: ltr}
            introduced_tokens: [шёл, дождь]
          - content_key: ru.b2.unit04.lesson01.teach.poka
            kind: vocabulary
            target: {text: "пока", language_code: ru, direction: ltr}
            introduced_tokens: [пока]
            example: {text: "Пока я готовил завтрак, шёл дождь.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit04.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Я ждал автобус. Шёл дождь.", language_code: ru, direction: ltr}
            introduced_tokens: []
          - content_key: ru.b2.unit04.lesson01.teach.nakonets_prishel
            kind: phrase
            target: {text: "наконец пришёл", language_code: ru, direction: ltr}
            introduced_tokens: [наконец, пришёл]
          - content_key: ru.b2.unit04.lesson01.teach.perepolnen
            kind: vocabulary
            target: {text: "переполнен", language_code: ru, direction: ltr}
            introduced_tokens: [переполнен]
            example: {text: "Утренний автобус часто переполнен.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit04.lesson01.teach.kogda_naprimer
            kind: phrase
            target: {text: "Когда автобус наконец пришёл, он был переполнен.", language_code: ru, direction: ltr}
            introduced_tokens: [когда, он, был]
          - content_key: ru.b2.unit04.lesson01.teach.grammar_fon_sobytie
            kind: grammar_note
            target: {text: "Пока — фон, продолжается: пока я ждал. Когда — одно событие, прерывает фон: когда автобус пришёл.", language_code: ru, direction: ltr}
            introduced_tokens: [фон, продолжается, событие, прерывает]
        exercises:
