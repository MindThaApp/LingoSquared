        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: ru.b2.unit04.lesson01.teach.utrom
            kind: vocabulary
            target: {text: "утром", language_code: ru, direction: ltr}
            introduced_tokens: [утром]
            example: {text: "Утром я обычно пью кофе.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit04.lesson01.teach.avtobus
            kind: vocabulary
            target: {text: "автобус", language_code: ru, direction: ltr}
            introduced_tokens: [автобус]
            example: {text: "Автобус приходит каждые десять минут.", language_code: ru, direction: ltr}
