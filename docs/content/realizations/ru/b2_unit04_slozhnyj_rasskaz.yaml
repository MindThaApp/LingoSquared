            prompt: {target_blocks: []}
          - content_key: ru.b2.unit04.lesson01.exercise03.match_fon_words
            type: matching_pairs
            tested_text: "пока когда шёл дождь ждал наконец пришёл переполнен"
            prompt: {target_blocks: []}
            pairs:
              - {left: "пока", right: "while (ongoing background)"}
              - {left: "когда", right: "when (a single point)"}
              - {left: "шёл дождь", right: "it was raining"}
