generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    Russian C1 unit 05 on counterfactual reasoning: the modal "надо было"
    (should have), third-type conditionals ("если бы" + past), mixed
    conditionals linking a past unreal condition to a present consequence,
    and expressions of regret. From-scratch generation from established
    Russian counterfactual conventions; no adaptable public-domain Russian
    source exists for this specific topic, so no external source was
    consulted. Sibling isolation honored: the X->en discourse realization
    and every nl/fa/prs/de/it file were treated as non-existent and NOT
    opened; the it C1 unit05 file named in the dispatch prompt was used ONLY
    for unit shape (schema 1.1, 6 lessons, exercise-type vocabulary), never
    for content. Character canon checked in docs/content/realizations/ru/:
    Настя is a teacher (feminine forms) and Дима is an engineer (masculine
    forms), an established pair who use informal ты with each other. This
    unit keeps informal first-person register, and deliberately authors
    every learner-facing production model gender-neutrally: the counterfactual
    conditions use the impersonal "мне ... предложили" (third-person plural)
    or "надо было + infinitive", and the results use the neuter "всё ... было
    бы / сложилось бы", so a learner of either gender reproduces the exact
    taught strings without a speaker-gender choice.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Targets universal.c1.hypothesis.reason_about_counterfactuals. Priority
    checks for the reviewer: (1) confirm every counterfactual keeps its time
    reference straight — "если бы ... предложили ... всё сложилось бы иначе"
    is a past counterfactual (past unreal condition + past hypothetical
    result), "если бы не мои сомнения ... сейчас всё было бы иначе" is a
    mixed conditional (past condition + present consequence), and "не надо
    было так долго тянуть с решением" is a genuine regret with no result
    clause; (2) confirm the culminating speaking and writing exercises each
    require the WHOLE act — one past counterfactual, one mixed conditional
    with a present consequence, and one expression of regret — and that their
    accepted answers are the exact taught model (with and without the final
    period); (3) confirm the production models are fully gender-neutral (no
    gendered past-tense "я" verb or short adjective); (4) confirm every
    tested token is introduced earlier in the unit (C1 is its own Course row,
    so no A1-B2 vocabulary is available); (5) confirm the matching_pairs
    lefts discriminate on real meaning and no two lefts share a gloss; (6)
    confirm listen/dictation exercises each use a dedicated single-sentence
    asset whose text matches tested_text byte-for-byte, and no dictation
    asset is reused for a different sentence.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    time reference of each counterfactual, grading behavior (spoken 'все'
    for 'всё' is a 3-letter token graded INCORRECT), matching_pairs, meta
    text. No realization-side defects; overlay fixes recorded in the en-ru
    overlay review. NATIVE FLAG: narrative coherence -- 'Если бы мне тогда
    предложили эту работу' says no offer was made, while 'Надо было тогда
    согласиться' and 'Не надо было так долго тянуть с решением' imply an
    offer and a decision existed; the story contradicts itself (rewriting is
    a content/owner decision touching every copy and audio asset). DEFERRED:
    dictation_smeshannyj (orthography_strict, 'всё') marks an е-typing
    learner wrong -- needs the ru ё/е grader-folding owner decision
    (backend/app/review/grading.py, Codex lane); English target_blocks
    duplicating overlay instructions (structural, owner decision).

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 3 fixes
    (word_order alternates) -- overlay order_nado_bylo, order_tretiy_tip,
    order_smeshannyj, order_sozhalenie: added valid word-order variants
    (Тогда надо было / ...согласиться тогда; тогда мне / мне предложили
    тогда; всё сейчас / сейчас всё бы; тянуть с решением так долго). Written
    and typed ё/е answers re-checked: OK. NATIVE FLAGS: carried over
    narrative-coherence flag (offer vs no offer). DEFERRED:
    dictation_smeshannyj ё/е (grader folding, owner decision).

course:
  realization_key: ru.c1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal first-person register throughout, matching the established
    ru-lane pin (Настя and Дима use informal ты with each other). This unit
    is a first-person reflection on a past decision; it uses no second-person
    address, so no formal вы appears anywhere. The reflection's grammar is
    deliberately gender-neutral (impersonal "мне ... предложили", "надо было
    + infinitive", neuter "всё ... было бы / сложилось бы"), so a learner of
    either gender can reproduce the model verbatim.

