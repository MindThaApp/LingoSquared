          - {"content_key": "ru.a2.unit70.lesson06.exercise03.match_dialogue", "type": "matching_pairs", "tested_text": "Что ты делал когда я позвонила Шёл дождь и была пробка Я звонила но ты не ответил Автобус стоял и я слушал музыку Пока ты стоял в пробке я готовила ужин Автобус уже поехал", "prompt": {"target_blocks": []}, "pairs": [{"left": "Что ты делал, когда я позвонила?", "right": "What were you doing when I called?"}, {"left": "Шёл дождь, и была пробка.", "right": "It was raining and there was a traffic jam."}, {"left": "Я звонила, но ты не ответил.", "right": "I was calling, but you did not answer."}, {"left": "Автобус стоял, и я слушал музыку.", "right": "The bus was standing and I was listening to music."}, {"left": "Пока ты стоял в пробке, я готовила ужин.", "right": "While you were standing in the traffic jam, I was cooking dinner."}, {"left": "Автобус уже поехал.", "right": "The bus has already set off."}]}
