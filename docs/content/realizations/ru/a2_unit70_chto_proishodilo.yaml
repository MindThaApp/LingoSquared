          - {"content_key": "ru.a2.unit70.lesson05.exercise02.read_bus", "type": "reading_comprehension", "tested_text": "Пока автобус стоял я смотрел в окно и слушал музыку", "prompt": {"target_blocks": [{"text": "What did Dima do while the bus was standing?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit70.lesson05.exercise03.match_words", "type": "matching_pairs", "tested_text": "сообщение привет вдруг пробка окно вечером телефон музыку", "prompt": {"target_blocks": []}, "pairs": [{"left": "сообщение", "right": "message"}, {"left": "привет", "right": "hi"}, {"left": "вдруг", "right": "suddenly"}, {"left": "пробка", "right": "traffic jam"}, {"left": "окно", "right": "window"}, {"left": "вечером", "right": "in the evening"}, {"left": "телефон", "right": "telephone"}, {"left": "музыку", "right": "music (object)"}]}
