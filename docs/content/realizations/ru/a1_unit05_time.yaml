schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf.
    Lesson 10's time-telling section supplied the vocabulary set and
    grammar pattern: the "Когда?" vs "В котором часу?" distinction, the
    parts-of-day answers (утром, днём, вечером, ночью), and the на-час
    construction ("В час.", "В два/три/четыре (часа).", "В пять/шесть/
    семь (часов).", "В восемь/девять/десять (часов)."). This unit keeps
    to the on-the-hour forms from that table (skipping the source's
    24-hour-clock partial-hour material, which is out of scope for A1);
    every example sentence, exercise, and dialogue here was freshly
    authored for a natural 2026 everyday-use context (asking the time,
    stating when something happens, arranging to meet at a stated hour),
    not imported verbatim from the source (AUTHORING_GUIDE §10). Combining
    acute-accent stress marks were stripped from every learner-facing
    string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: native_speaker
  notes: >-
    Fresh-context full review complete 2026-07-12 (new-language lane, no sampling); zero grammar/case-agreement/audio-containment defects, no stress diacritics, days/months lowercase. Every listen_select/
    listen_order media_asset_key points to a dedicated pending_generation
    asset whose recorded text literally contains the tested_text sentence
    (no reuse of a general numbers/hour-list overview asset for a
    single-sentence test) -- this was the exact bug class found and fixed
    in ru unit03 review. "Час" is irregular after "в" for 1 o'clock
    (В час, not В один час); часа is used for 2-4 (genitive singular),
    часов for 5-10 and 0 (genitive plural) -- matches unit03's established
    один/два-четыре/пять+ numeral-agreement pattern, now applied to
    "час/часа/часов". Native-speaker review still pending.

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit is time-focused; вы is used for the train-station dialogue scene
    (asking a stranger/clerk for a departure time).

media_assets:
  - {content_key: ru.a1.audio.kotoryy_chas.formal.01, language: ru, text: "Который час?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.seychas_tri_chasa.neutral.01, language: ru, text: "Сейчас три часа.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.seychas_desyat_chasov.neutral.01, language: ru, text: "Сейчас десять часов.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.v_kotorom_chasu.formal.01, language: ru, text: "В котором часу?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.v_dva_chasa_dnya.neutral.01, language: ru, text: "В два часа дня.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.v_sem_chasov_vechera.neutral.01, language: ru, text: "В семь часов вечера.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.poezd_v_vosem.neutral.01, language: ru, text: "Поезд отходит в восемь часов утра.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.kogda_otkhodit_poezd.formal.01, language: ru, text: "Когда отходит поезд?", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.station_time.01
    language: ru
    text: >-
      Пассажир: Скажите, пожалуйста, который час? Кассир: Сейчас семь
      часов утра. Пассажир: А когда отходит поезд? Кассир: В восемь
      часов утра.
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit05.time
    title: "Который час?"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.time.ask_tell_time
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
        title: "Сколько сейчас времени"
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - {content_key: ru.a1.unit05.lesson01.teach.kotoryy_chas, kind: phrase, target: {text: "Который час?", language_code: ru, direction: ltr}, introduced_tokens: [Который, час]}
          - content_key: ru.a1.unit05.lesson01.teach.seychas_chas
            kind: phrase
            target: {text: "Сейчас час.", language_code: ru, direction: ltr}
            introduced_tokens: [Сейчас, час]
            example: {text: "Который час? — Сейчас час.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit05.lesson01.teach.dva_tri_chasa
            kind: vocabulary
            target: {text: "два часа, три часа", language_code: ru, direction: ltr}
            introduced_tokens: [часа, два, три]
            example:
              - {text: "Сейчас два часа.", language_code: ru, direction: ltr}
              - {text: "Сейчас три часа.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit05.lesson01.teach.pyat_desyat_chasov
            kind: vocabulary
            target: {text: "пять часов, десять часов", language_code: ru, direction: ltr}
            introduced_tokens: [часов, пять, десять]
            example:
              - {text: "Сейчас пять часов.", language_code: ru, direction: ltr}
              - {text: "Сейчас десять часов.", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit05.lesson01.exercise01.recognize_tri_chasa
            type: multiple_choice
            tested_text: "три часа"
            prompt: {target_blocks: [{text: "3 o'clock", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson01.exercise02.recognize_desyat_chasov
            type: multiple_choice
            tested_text: "десять часов"
            prompt: {target_blocks: [{text: "10 o'clock", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson01.exercise03.listen_select_time
            type: listen_select
            tested_text: "Который час"
            media_asset_key: ru.a1.audio.kotoryy_chas.formal.01
            prompt: {target_blocks: [{text: "What is the person asking?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson01.exercise04.match_hours
            type: matching_pairs
            tested_text: "час два часа три часа пять часов десять часов"
            prompt: {target_blocks: []}
            pairs:
              - {left: "час", right: "1 o'clock"}
              - {left: "два часа", right: "2 o'clock"}
              - {left: "три часа", right: "3 o'clock"}
              - {left: "пять часов", right: "5 o'clock"}
              - {left: "десять часов", right: "10 o'clock"}
          - content_key: ru.a1.unit05.lesson01.exercise05.order_three_oclock
            type: word_order
            tested_text: "Сейчас три часа"
            prompt: {target_blocks: []}
            word_bank: ["часа", "три", "Сейчас"]
          - content_key: ru.a1.unit05.lesson01.exercise06.listen_order_ten_oclock
            type: listen_order
            tested_text: "Сейчас десять часов"
            media_asset_key: ru.a1.audio.seychas_desyat_chasov.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["часов", "десять", "Сейчас"]
          - content_key: ru.a1.unit05.lesson01.exercise07.complete_time
            type: fill_in_blank
            tested_text: "Сейчас три часа"
            prompt: {target_blocks: [{text: "Который час? — Сейчас ___ часа. (3)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson01.exercise08.write_time
            type: writing_prompt
            tested_text: "Сейчас пять часов"
            prompt: {target_blocks: [{text: "Write a sentence saying it is now 5 o'clock, using \"Сейчас ...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit05.lesson02.chasti_dnya
        title: "В котором часу: части дня"
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - {content_key: ru.a1.unit05.lesson02.teach.v_kotorom_chasu, kind: phrase, target: {text: "В котором часу?", language_code: ru, direction: ltr}, introduced_tokens: [В, котором, часу]}
          - content_key: ru.a1.unit05.lesson02.teach.utrom_dnem
            kind: vocabulary
            target: {text: "утром, днём", language_code: ru, direction: ltr}
            introduced_tokens: [утром, днём]
            example:
              - {text: "Утром я пью кофе.", language_code: ru, direction: ltr}
              - {text: "Днём я работаю.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit05.lesson02.teach.vecherom_nochyu
            kind: vocabulary
            target: {text: "вечером, ночью", language_code: ru, direction: ltr}
            introduced_tokens: [вечером, ночью]
            example:
              - {text: "Вечером я дома.", language_code: ru, direction: ltr}
              - {text: "Ночью я сплю.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit05.lesson02.teach.v_dva_chasa_dnya
            kind: phrase
            target: {text: "В два часа дня.", language_code: ru, direction: ltr}
            introduced_tokens: [В, дня, два]
            example: {text: "В котором часу встреча? — В два часа дня.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit05.lesson02.teach.v_sem_chasov_vechera, kind: phrase, target: {text: "В семь часов вечера.", language_code: ru, direction: ltr}, introduced_tokens: [вечера, семь], example: {text: "Магазин закрывается в семь часов вечера.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit05.lesson02.exercise01.recognize_vecherom
            type: multiple_choice
            tested_text: "вечером"
            prompt: {target_blocks: [{text: "in the evening", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson02.exercise02.recognize_utrom
            type: multiple_choice
            tested_text: "утром"
            prompt: {target_blocks: [{text: "in the morning", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson02.exercise03.listen_select_when
            type: listen_select
            tested_text: "В котором часу"
            media_asset_key: ru.a1.audio.v_kotorom_chasu.formal.01
            prompt: {target_blocks: [{text: "What is the person asking?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson02.exercise04.match_parts_of_day
            type: matching_pairs
            tested_text: "утром днём вечером ночью"
            prompt: {target_blocks: []}
            pairs:
              - {left: "утром", right: "in the morning"}
              - {left: "днём", right: "in the daytime"}
              - {left: "вечером", right: "in the evening"}
              - {left: "ночью", right: "at night"}
          - content_key: ru.a1.unit05.lesson02.exercise05.order_two_pm
            type: word_order
            tested_text: "В два часа дня"
            prompt: {target_blocks: []}
            word_bank: ["дня", "часа", "два", "В"]
          - content_key: ru.a1.unit05.lesson02.exercise06.listen_order_seven_pm
            type: listen_order
            tested_text: "В семь часов вечера"
            media_asset_key: ru.a1.audio.v_sem_chasov_vechera.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["вечера", "часов", "семь", "В"]
          - content_key: ru.a1.unit05.lesson02.exercise07.complete_when
            type: fill_in_blank
            tested_text: "В два часа дня"
            prompt: {target_blocks: [{text: "В ___ часа дня. (2)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson02.exercise08.listen_type_evening_time
            type: listen_type
            tested_text: "Сейчас три часа"
            media_asset_key: ru.a1.audio.seychas_tri_chasa.neutral.01
            prompt: {target_blocks: []}

      - content_key: ru.a1.unit05.lesson03.na_vokzale
        title: "На вокзале: когда отходит поезд"
        spine_outcome_id: universal.a1.time.ask_tell_time
        teaching:
          - {content_key: ru.a1.unit05.lesson03.teach.skazhite_pozhaluysta, kind: phrase, target: {text: "Скажите, пожалуйста, который час?", language_code: ru, direction: ltr}, introduced_tokens: [Скажите, пожалуйста]}
          - {content_key: ru.a1.unit05.lesson03.teach.kogda_otkhodit, kind: phrase, target: {text: "Когда отходит поезд?", language_code: ru, direction: ltr}, introduced_tokens: [Когда, отходит, поезд]}
          - {content_key: ru.a1.unit05.lesson03.teach.passazhir_vopros, kind: dialogue, target: {text: "Пассажир: Скажите, пожалуйста, который час?", language_code: ru, direction: ltr}, introduced_tokens: [Пассажир]}
          - {content_key: ru.a1.unit05.lesson03.teach.kassir_sem, kind: dialogue, target: {text: "Кассир: Сейчас семь часов утра.", language_code: ru, direction: ltr}, introduced_tokens: [Кассир, семь, утра]}
          - {content_key: ru.a1.unit05.lesson03.teach.passazhir_kogda, kind: dialogue, target: {text: "Пассажир: А когда отходит поезд?", language_code: ru, direction: ltr}, introduced_tokens: [А]}
          - {content_key: ru.a1.unit05.lesson03.teach.kassir_vosem, kind: dialogue, target: {text: "Кассир: В восемь часов утра.", language_code: ru, direction: ltr}, introduced_tokens: [восемь]}
        exercises:
          - content_key: ru.a1.unit05.lesson03.exercise01.choose_ask_time_polite
            type: multiple_choice
            tested_text: "Скажите, пожалуйста, который час"
            prompt: {target_blocks: [{text: "You want to politely ask a stranger for the time.", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson03.exercise02.listen_select_departure
            type: listen_select
            tested_text: "Поезд отходит в восемь часов утра"
            media_asset_key: ru.a1.audio.poezd_v_vosem.neutral.01
            prompt: {target_blocks: [{text: "What time does the train leave?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson03.exercise03.dialogue_comprehension_station
            type: dialogue_comprehension
            tested_text: "семь часов утра восемь часов утра"
            media_asset_key: ru.a1.audio.dialogue.station_time.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit05.lesson03.exercise04.match_station_times
            type: matching_pairs
            tested_text: "семь часов утра восемь часов утра"
            prompt: {target_blocks: []}
            pairs:
              - {left: "семь часов утра", right: "7am"}
              - {left: "восемь часов утра", right: "8am"}
              - {left: "три часа", right: "3 o'clock"}
              - {left: "десять часов", right: "10 o'clock"}
              - {left: "два часа дня", right: "2pm"}
              - {left: "семь часов вечера", right: "7pm"}
          - content_key: ru.a1.unit05.lesson03.exercise05.order_eight_am
            type: word_order
            tested_text: "В восемь часов утра"
            prompt: {target_blocks: []}
            word_bank: ["утра", "часов", "восемь", "В"]
          - content_key: ru.a1.unit05.lesson03.exercise06.listen_type_when_train
            type: listen_type
            tested_text: "Когда отходит поезд"
            media_asset_key: ru.a1.audio.kogda_otkhodit_poezd.formal.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit05.lesson03.exercise07.reply_when_train
            type: dialogue_response
            tested_text: "В восемь часов утра"
            prompt: {target_blocks: [{text: "Когда отходит поезд?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson03.exercise08.complete_departure
            type: fill_in_blank
            tested_text: "Поезд отходит в восемь часов утра"
            prompt: {target_blocks: [{text: "Поезд отходит в ___ часов утра. (8)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit05.lesson03.exercise09.write_station_exchange
            type: writing_prompt
            tested_text: "который час поезд отходит утра"
            prompt: {target_blocks: [{text: "Write a short exchange at a train station: ask the time and ask when a train leaves.", language_code: en, direction: ltr}]}
