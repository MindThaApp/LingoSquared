schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. The
    attested comparative proverb "В гостях хорошо, а дома лучше"
    ("There's no place like home", lit. "Visiting is nice, but home is
    better") supplied the "лучше, чем" comparative pattern used
    throughout this unit. Every example sentence, exercise, and
    dialogue here was freshly authored for a natural 2026 everyday-use
    context (comparing two familiar cafes/drinks), not imported
    verbatim from the source (AUTHORING_GUIDE §10). Combining
    acute-accent stress marks were stripped from every learner-facing
    string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: none
  notes: "Fresh-context review 2026-07-12: comparatives (luchshe/huzhe/bolshe/menshe, chem) and demonstrative agreement (eto/etot kafe/dom, kakoe/kakoy) correct; no stress diacritics; glosses accurate; compiler 0 errors. No defects.\n\nSecond-pass review 2026-10-18: 0 fixes in this file. NATIVE FLAGS: none."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit covers making and understanding basic comparisons between two
    familiar things (cafes, drinks), using "лучше/хуже/больше/меньше,
    чем", in an informal ты register between friends.

media_assets:
  - {content_key: ru.a1.audio.kofe_luchshe_chem_chay.neutral.01, language: ru, text: "Кофе лучше, чем чай.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.eto_kafe_bolshe.neutral.01, language: ru, text: "Это кафе больше, чем то.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.kakoye_kafe_luchshe.neutral.01, language: ru, text: "Какое кафе лучше?", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.kakoye_kafe_luchshe.01
    language: ru
    text: >-
      Настя: Какое кафе лучше? Дима: Это кафе лучше, чем то. Настя: А
      это кафе больше? Дима: Да, это кафе больше, чем то.
    voice_hint: two_adults_neutral
    status: pending_generation

units:
  - content_key: ru.a1.unit15.comparisons
    title: "Кофе лучше, чем чай"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.comparisons.make_basic_comparisons
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit15.lesson01.luchshe_huzhe
        title: "Лучше и хуже"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: ru.a1.unit15.lesson01.teach.kofe_luchshe_chem_chay, kind: phrase, target: {text: "Кофе лучше, чем чай.", language_code: ru, direction: ltr}, introduced_tokens: [Кофе, лучше, чем, чай]}
          - {content_key: ru.a1.unit15.lesson01.teach.huzhe, kind: vocabulary, target: {text: "хуже", language_code: ru, direction: ltr}, introduced_tokens: [хуже], example: {text: "Чай хуже, чем кофе.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit15.lesson01.teach.kakoy, kind: vocabulary, target: {text: "какой / какое", language_code: ru, direction: ltr}, introduced_tokens: [какой, какое], example: {text: "Какой кофе лучше?", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit15.lesson01.exercise01.recognize_luchshe
            type: multiple_choice
            tested_text: "лучше"
            prompt: {target_blocks: [{text: "better", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson01.exercise02.recognize_huzhe
            type: multiple_choice
            tested_text: "хуже"
            prompt: {target_blocks: [{text: "worse", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson01.exercise03.listen_select_kofe_luchshe
            type: listen_select
            tested_text: "Кофе лучше, чем чай"
            media_asset_key: ru.a1.audio.kofe_luchshe_chem_chay.neutral.01
            prompt: {target_blocks: [{text: "Which drink does the speaker say is better?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson01.exercise04.match_comparison_words
            type: matching_pairs
            tested_text: "лучше хуже чем кофе чай какой"
            prompt: {target_blocks: []}
            pairs:
              - {left: "лучше", right: "better"}
              - {left: "хуже", right: "worse"}
              - {left: "чем", right: "than"}
              - {left: "какой", right: "which/what kind of"}
              - {left: "кофе", right: "coffee"}
              - {left: "чай", right: "tea"}
              - {left: "Кофе лучше, чем чай.", right: "Coffee is better than tea."}
              - {left: "Чай хуже, чем кофе.", right: "Tea is worse than coffee."}
          - content_key: ru.a1.unit15.lesson01.exercise05.order_kofe_luchshe_chem_chay
            type: word_order
            tested_text: "Кофе лучше чем чай"
            prompt: {target_blocks: []}
            word_bank: ["лучше", "Кофе", "чем", "чай"]
          - content_key: ru.a1.unit15.lesson01.exercise06.listen_order_kofe_luchshe
            type: listen_order
            tested_text: "Кофе лучше чем чай"
            media_asset_key: ru.a1.audio.kofe_luchshe_chem_chay.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["чем", "Кофе", "лучше", "чай"]
          - content_key: ru.a1.unit15.lesson01.exercise07.complete_chay_huzhe
            type: fill_in_blank
            tested_text: "Чай хуже чем кофе"
            prompt: {target_blocks: [{text: "Чай ___, чем кофе. (worse)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson01.exercise08.write_a_comparison
            type: writing_prompt
            tested_text: "Кофе лучше чем чай"
            prompt: {target_blocks: [{text: "Write a sentence comparing coffee and tea, using \"лучше, чем\".", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit15.lesson01.luchshe_huzhe.exercise09.dictation_kofe_luchshe_chem_chay_neutral, type: dictation, tested_text: "Кофе лучше, чем чай", media_asset_key: ru.a1.audio.kofe_luchshe_chem_chay.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit15.lesson02.bolshe_menshe
        title: "Больше и меньше"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: ru.a1.unit15.lesson02.teach.eto_kafe_bolshe, kind: phrase, target: {text: "Это кафе больше, чем то.", language_code: ru, direction: ltr}, introduced_tokens: [Это, кафе, больше, то]}
          - {content_key: ru.a1.unit15.lesson02.teach.menshe, kind: vocabulary, target: {text: "меньше", language_code: ru, direction: ltr}, introduced_tokens: [меньше], example: {text: "То кафе меньше, чем это.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit15.lesson02.teach.dom, kind: vocabulary, target: {text: "дом", language_code: ru, direction: ltr}, introduced_tokens: [дом, этот, тот], example: {text: "Этот дом больше, чем тот.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit15.lesson02.exercise01.recognize_bolshe
            type: multiple_choice
            tested_text: "больше"
            prompt: {target_blocks: [{text: "bigger / more", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson02.exercise02.recognize_menshe
            type: multiple_choice
            tested_text: "меньше"
            prompt: {target_blocks: [{text: "smaller / less", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson02.exercise03.listen_select_eto_kafe_bolshe
            type: listen_select
            tested_text: "Это кафе больше, чем то"
            media_asset_key: ru.a1.audio.eto_kafe_bolshe.neutral.01
            prompt: {target_blocks: [{text: "Which cafe does the speaker say is bigger?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson02.exercise04.match_size_words
            type: matching_pairs
            tested_text: "больше меньше это то кафе дом лучше хуже чем"
            prompt: {target_blocks: []}
            pairs:
              - {left: "больше", right: "bigger / more"}
              - {left: "меньше", right: "smaller / less"}
              - {left: "это кафе", right: "this cafe"}
              - {left: "то кафе", right: "that cafe"}
              - {left: "этот дом", right: "this house"}
              - {left: "лучше", right: "better"}
              - {left: "хуже", right: "worse"}
              - {left: "Это кафе больше, чем то.", right: "This cafe is bigger than that one."}
          - content_key: ru.a1.unit15.lesson02.exercise05.order_eto_kafe_bolshe_chem_to
            type: word_order
            tested_text: "Это кафе больше чем то"
            prompt: {target_blocks: []}
            word_bank: ["больше", "Это", "кафе", "чем", "то"]
          - content_key: ru.a1.unit15.lesson02.exercise06.listen_order_etot_dom_bolshe
            type: listen_order
            tested_text: "Это кафе больше чем то"
            media_asset_key: ru.a1.audio.eto_kafe_bolshe.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["кафе", "Это", "чем", "больше", "то"]
          - content_key: ru.a1.unit15.lesson02.exercise07.complete_to_kafe_menshe
            type: fill_in_blank
            tested_text: "То кафе меньше чем это"
            prompt: {target_blocks: [{text: "То кафе ___, чем это. (smaller)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson02.exercise08.write_size_comparison
            type: writing_prompt
            tested_text: "Этот дом больше чем тот"
            prompt: {target_blocks: [{text: "Write a sentence comparing the size of two familiar things, using \"больше, чем\" or \"меньше, чем\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit15.lesson03.kakoye_kafe_luchshe
        title: "Диалог: какое кафе лучше?"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: ru.a1.unit15.lesson03.teach.nastya_kakoye_kafe_luchshe, kind: dialogue, target: {text: "Настя: Какое кафе лучше?", language_code: ru, direction: ltr}, introduced_tokens: [Настя]}
          - {content_key: ru.a1.unit15.lesson03.teach.dima_eto_kafe_luchshe, kind: dialogue, target: {text: "Дима: Это кафе лучше, чем то.", language_code: ru, direction: ltr}, introduced_tokens: [Дима]}
          - {content_key: ru.a1.unit15.lesson03.teach.nastya_a_bolshe, kind: dialogue, target: {text: "Настя: А это кафе больше? Дима: Да, это кафе больше, чем то.", language_code: ru, direction: ltr}, introduced_tokens: [Да]}
        exercises:
          - content_key: ru.a1.unit15.lesson03.exercise01.choose_ask_which_better
            type: multiple_choice
            tested_text: "Какое кафе лучше"
            prompt: {target_blocks: [{text: "You want to ask which cafe is better. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson03.exercise02.listen_select_kakoye_kafe_luchshe
            type: listen_select
            tested_text: "Какое кафе лучше"
            media_asset_key: ru.a1.audio.kakoye_kafe_luchshe.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson03.exercise03.dialogue_comprehension_kakoye_kafe_luchshe
            type: dialogue_comprehension
            tested_text: "кафе лучше больше то это"
            media_asset_key: ru.a1.audio.dialogue.kakoye_kafe_luchshe.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit15.lesson03.exercise04.match_dialogue_lines
            type: matching_pairs
            tested_text: "какое кафе лучше это то больше да"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Какое кафе лучше?", right: "Which cafe is better?"}
              - {left: "Это кафе лучше, чем то.", right: "This cafe is better than that one."}
              - {left: "А это кафе больше?", right: "And is this cafe bigger?"}
              - {left: "Да, это кафе больше, чем то.", right: "Yes, this cafe is bigger than that one."}
              - {left: "лучше", right: "better"}
              - {left: "больше", right: "bigger / more"}
          - content_key: ru.a1.unit15.lesson03.exercise05.order_eto_kafe_luchshe_chem_to
            type: word_order
            tested_text: "Это кафе лучше чем то"
            prompt: {target_blocks: []}
            word_bank: ["лучше", "Это", "кафе", "чем", "то"]
          - content_key: ru.a1.unit15.lesson03.exercise06.reply_kakoye_kafe_luchshe
            type: dialogue_response
            tested_text: "Это кафе лучше чем то"
            prompt: {target_blocks: [{text: "Какое кафе лучше?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson03.exercise07.complete_eto_kafe_bolshe
            type: fill_in_blank
            tested_text: "Это кафе больше чем то"
            prompt: {target_blocks: [{text: "Это кафе ___, чем то. (bigger)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit15.lesson03.exercise08.write_cafe_comparison
            type: writing_prompt
            tested_text: "Это кафе лучше чем то"
            prompt: {target_blocks: [{text: "Write two sentences comparing two cafes: which is better and which is bigger.", language_code: en, direction: ltr}]}
