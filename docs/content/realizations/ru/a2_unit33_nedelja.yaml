    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 4 fixes - word_order lesson01.exercise05, lesson02.exercise05, lesson03.exercise04 accept the subject-first order (Я работаю в будни / Я хожу на курсы после работы / Я встречаюсь с друзьями в выходные); lesson02.exercise06.write_sequence accepts pronoun-less хожу/ужинаю variants (as lesson03.exercise06 already does). NATIVE FLAGS: none new. DEFERRED: none."

