generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ru's B2
    abstraction unit (discussing abstract ideas and values), the second of
    the second-half wave (units 05-08). No adaptable intermediate/upper-
    level public-domain Russian source exists for this topic, so this was
    built from general Russian grammar/discourse knowledge, the same
    honest-disclosure precedent this unit's own B2 unit01-05 set.
    Sibling-isolation honored: the X->en B2 realization and every nl/fa/prs/
    de B2 file were treated as non-existent and were NOT opened; the nl
    exemplar named in the dispatch prompt was consulted ONLY for unit shape
    (6 lessons, 44 exercises, spine outcome mapping), never for its
    content -- this unit deliberately debates a DIFFERENT everyday abstract
    question (remote work vs. office work, not the Dutch exemplar's
    car-free cities) and every Russian sentence was authored fresh from
    first principles, not translated or calqued. Only ru's OWN earlier
    realization content (the Настя/Дима pair, established as Дима=engineer,
    Настя=teacher, informal ты register; see unit01-05) was consulted for
    character canon, which is not a sibling-direction violation. Настя
    argues for remote work (freedom), Дима offers a qualified, hedged
    pushback (teamwork) -- consistent with their established personalities
    in earlier B2 units (Настя direct and opinionated, Дима measured), and
    introduces no canon conflict, since neither character's job requires
    remote/office status to be pinned. GENDER-AGREEMENT FOOTGUN (same
    pattern as unit04's narrative unit): Russian short-form predicate
    adjectives agree with the speaker's grammatical gender (я убеждён for a
    male speaker, я убеждена for a female speaker; я согласен / я
    согласна). Every production exercise that requires one of these forms
    is explicitly attributed in its instruction to a named speaker (Настя
    or Дима), never left to the learner's own open self-expression, so the
    learner reproduces a fixed, gender-pinned line rather than choosing
    their own gendered form.
review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Sixth Russian B2 unit; abstraction unit; second of the second-half wave
    (units 05-08), building on units 01-05 within the same B2 course.
    Targets the CEFR B2 abstraction outcome
    (universal.b2.abstraction.discuss_abstract_ideas_and_values): give a
    QUALIFIED opinion on an abstract topic and respond directly to an
    opposing view, distinguishing a flat opinion from a qualified one and
    an agreement from a direct rebuttal. Theme: one coherent everyday
    abstract debate across all six lessons -- should everyone be allowed to
    work remotely (удалённая работа)? -- pitting individual freedom against
    team cohesion/efficiency. Lesson arc: L01 opinion frames + the
    abstract-value vocabulary (я считаю, что / по-моему / я убеждён(а),
    что; свобода, командная работа); L02 QUALIFICATION -- softening an
    opinion (до некоторой степени, в целом, не обязательно, это зависит,
    ответственность); L03 RESPONDING to an opposing view (это правда,
    но...; я понимаю твою мысль, но всё же...; я (не) согласен(на), потому
    что...); L04 weighing two sides (с одной стороны...с другой
    стороны...; плюс, минус, общество, эффективность); L05 a short opinion
    READING that states a qualified stance (author's stance + what they
    concede); L06 the culminating production -- a Настя/Дима dialogue for
    the LISTENING requirement (identify each position + where they
    differ), a SPEAKING task (qualified opinion answering an opposing
    view), a WRITING task (qualified opinion responding to a stated
    opposing view), and a dialogue_response that directly answers a stated
    opposing view with a qualified opinion. Register: informal ты
    throughout, per the ru lane pin; Настя and Дима continue their
    established informal register. All vocabulary needed for this unit's
    own exercises is introduced within units 01-06 of this course (B2 is a
    separate Course row, so a B2 learner never sees A1/A2/B1 lexemes at
    runtime). No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked token coverage course-wide, character canon, dialogue cards
    vs audio, listen/dialogue distractors, example_glosses, overlay
    coverage, YAML booleans, internal-jargon notes, ё/е and word-order
    grading gaps. Fixes (realization + en-ru overlay):
    lesson01.teach.po_moemu gloss "in my opinion / my way" -> "in my
    opinion"; lesson01.teach.grammar_mneniya note ordering fixed (casual
    по-моему, neutral я считаю, что, firm я убеждён/убеждена, что);
    lesson02.exercise05.translate_v_celom +удаленная and
    "Удалённая/Удаленная работа в целом лучше" variants;
    lesson03.exercise07.write_ponimayu_mysl +"все же" variant;
    lesson04.teach.minus example "Есть и минус." -> "Это большой минус."
    with большой moved into its introduced_tokens (was only nominally
    introduced on grammar_vzveshivanie, whose text lacks it),
    example_gloss "That's a big disadvantage.", note glosses большой;
    lesson05.exercise01-04 read_* now show the reading passage as a ru
    target_block before the question;
    lesson06.exercise05.speak_qualified_opinion +"До некоторой степени
    это правда, но..." order and удаленная variants;
    lesson06.exercise06.write_qualified_response +"не всем это подходит"
    (taught chunk) and удаленная variants;
    lesson06.exercise07.respond_qualified instruction pinned to the
    exact content ("That is true to a certain extent, but in my opinion
    remote work is better for freedom.") +taught-order and удаленная
    variants. NATIVE FLAGS: free-standing "Это зависит" (vs "Смотря как"
    / "Это зависит от ситуации"); speak_ubezhdena puts "командная работа
    важнее" in Настя's mouth while she argues for remote work elsewhere
    (stance inconsistency, not a grading defect). DEFERRED: dictation
    lesson01.exercise08 requires "удалённая" byte-exact (dictation ё
    policy, owner decision); grader-level ё/е fold (Codex lane).

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты throughout (ru lane pin). B2 abstraction layers opinion
    frames, qualification frames, and respond-to-opposing frames onto that
    register -- я считаю, что / по-моему / я убеждён(а), что / до некоторой
    степени / не обязательно / это правда, но / я (не) согласен(на) --
    while keeping everyday informal address. Настя and Дима continue the
    informal ты they use with each other in unit01-05. GENDER FOOTGUN:
    short-form predicate adjectives (убеждён/убеждена, согласен/согласна)
    agree with the speaker's grammatical gender -- every production
    exercise requiring one names its speaker explicitly (Настя or Дима).

