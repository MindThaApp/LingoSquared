            prompt: {target_blocks: [{text: "Я считаю, что удалённая работа — это хорошо. С одной стороны, это лучше для свободы, с другой стороны, я понимаю, что не всем это подходит. До некоторой степени это правда. Всё же я убеждён, что командная работа от этого не страдает. Это не обязательно легко, но это того стоит.", language_code: ru, direction: ltr}, {text: "What is the author's overall opinion?", language_code: en, direction: ltr}]}
