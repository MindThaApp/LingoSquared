units:
  - content_key: ru.b2.unit06.abstrakcija
    title: "Абстрактные идеи и ценности"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.abstraction.discuss_abstract_ideas_and_values
    planned_lesson_count: 6

    lessons:
      - content_key: ru.b2.unit06.lesson01.chto_ty_dumaesh
        title: "Что ты думаешь?"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: ru.b2.unit06.lesson01.teach.rabota_udalyonno
            kind: phrase
            target: {text: "Многие хотят работать удалённо.", language_code: ru, direction: ltr}
            introduced_tokens: [Многие, хотят, хотеть, работать, удалённо, удалённая, это, хорошо]
          - content_key: ru.b2.unit06.lesson01.teach.ya_schitayu
            kind: vocabulary
            target: {text: "я считаю, что", language_code: ru, direction: ltr}
            introduced_tokens: [считаю, считать, что, хорошая, идея]
            example: {text: "Я считаю, что это хорошая идея.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit06.lesson01.teach.svoboda
            kind: vocabulary
            target: {text: "свобода", language_code: ru, direction: ltr}
            introduced_tokens: [свобода, важна, важно]
            example: {text: "Свобода важна.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit06.lesson01.teach.po_moemu
            kind: phrase
            target: {text: "по-моему", language_code: ru, direction: ltr}
            introduced_tokens: [по-моему]
          - content_key: ru.b2.unit06.lesson01.teach.ya_ubezhdyon
            kind: phrase
            target: {text: "я убеждён / убеждена, что", language_code: ru, direction: ltr}
            introduced_tokens: [убеждён, убеждена]
          - content_key: ru.b2.unit06.lesson01.teach.komanda
            kind: vocabulary
            target: {text: "командная работа", language_code: ru, direction: ltr}
            introduced_tokens: [командная, работа]
            example: {text: "Командная работа важна.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit06.lesson01.teach.grammar_mneniya
            kind: grammar_note
            target: {text: "Я считаю, что удалённая работа — это хорошо. По-моему, свобода важна. Я убеждён/убеждена, что командная работа важнее.", language_code: ru, direction: ltr}
            introduced_tokens: [важнее]
        exercises:
          - content_key: ru.b2.unit06.lesson01.exercise01.recognize_svoboda
            type: multiple_choice
            tested_text: "свобода"
            prompt: {target_blocks: [{text: "свобода", language_code: ru, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson01.exercise02.listen_schitayu
            type: listen_select
            tested_text: "Я считаю что удалённая работа это хорошо"
            media_asset_key: ru.b2.audio.abstrakcija.schitayu.01
            prompt: {target_blocks: []}
          - content_key: ru.b2.unit06.lesson01.exercise03.match_opinion_words
            type: matching_pairs
            tested_text: "я считаю что по-моему я убеждён я убеждена свобода командная работа удалённо"
            prompt: {target_blocks: []}
            pairs:
              - {left: "я считаю, что", right: "I consider that / I think that"}
              - {left: "по-моему", right: "in my opinion"}
              - {left: "я убеждён", right: "I'm convinced (male speaker)"}
              - {left: "я убеждена", right: "I'm convinced (female speaker)"}
              - {left: "свобода", right: "freedom"}
              - {left: "командная работа", right: "teamwork"}
              - {left: "удалённо", right: "remotely"}
          - content_key: ru.b2.unit06.lesson01.exercise04.order_schitayu
            type: word_order
            tested_text: "Я считаю что удалённая работа это хорошо"
            prompt: {target_blocks: []}
            word_bank: ["Я", "считаю", "что", "удалённая", "работа", "это", "хорошо"]
          - content_key: ru.b2.unit06.lesson01.exercise05.translate_po_moemu
            type: translation
            tested_text: "По-моему свобода важна"
            prompt: {target_blocks: [{text: "Translate into Russian, using по-моему: In my opinion, freedom is important.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson01.exercise06.speak_ubezhdena
            type: speak_response
            tested_text: "Я убеждена что командная работа важнее"
            prompt: {target_blocks: [{text: "This is Настя's opinion. Say aloud in Russian, using я убеждена: I'm convinced that teamwork matters more.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson01.exercise07.write_schitayu
            type: writing_prompt
            tested_text: "Я считаю что это хорошая идея"
            prompt: {target_blocks: [{text: "Write in Russian, using я считаю: I think it's a good idea.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson01.exercise08.dictation_schitayu
            type: dictation
            tested_text: "Я считаю, что удалённая работа — это хорошо"
            media_asset_key: ru.b2.audio.abstrakcija.schitayu.01
            prompt: {target_blocks: []}

      - content_key: ru.b2.unit06.lesson02.vzveshennoe_mnenie
        title: "Взвешенное мнение"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: ru.b2.unit06.lesson02.teach.do_nekotoroy_stepeni
            kind: phrase
            target: {text: "до некоторой степени", language_code: ru, direction: ltr}
            introduced_tokens: [до, некоторой, степени]
          - content_key: ru.b2.unit06.lesson02.teach.v_celom
            kind: phrase
            target: {text: "в целом", language_code: ru, direction: ltr}
            introduced_tokens: [в, целом]
          - content_key: ru.b2.unit06.lesson02.teach.ne_vsegda
            kind: vocabulary
            target: {text: "не всегда", language_code: ru, direction: ltr}
            introduced_tokens: [всегда]
            example: {text: "Это не всегда так.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit06.lesson02.teach.ne_obyazatelno
            kind: vocabulary
            target: {text: "не обязательно", language_code: ru, direction: ltr}
            introduced_tokens: [обязательно, плохо]
            example: {text: "Это не обязательно плохо.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit06.lesson02.teach.eto_zavisit
            kind: phrase
            target: {text: "это зависит", language_code: ru, direction: ltr}
            introduced_tokens: [зависит, зависеть]
          - content_key: ru.b2.unit06.lesson02.teach.otvetstvennost
            kind: vocabulary
            target: {text: "ответственность", language_code: ru, direction: ltr}
            introduced_tokens: [ответственность, каждого]
            example: {text: "У каждого есть ответственность.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit06.lesson02.teach.grammar_nyuans
            kind: grammar_note
            target: {text: "До некоторой степени это правда. В целом это хорошо. Это зависит.", language_code: ru, direction: ltr}
            introduced_tokens: [правда, лучше]
        exercises:
          - content_key: ru.b2.unit06.lesson02.exercise01.recognize_otvetstvennost
            type: multiple_choice
            tested_text: "ответственность"
            prompt: {target_blocks: [{text: "ответственность", language_code: ru, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson02.exercise02.listen_do_nekotoroy_stepeni
            type: listen_select
            tested_text: "До некоторой степени это правда"
            media_asset_key: ru.b2.audio.abstrakcija.do_nekotoroy_stepeni.01
            prompt: {target_blocks: []}
          - content_key: ru.b2.unit06.lesson02.exercise03.match_nyuans_words
            type: matching_pairs
            tested_text: "до некоторой степени в целом не обязательно это зависит ответственность не всегда"
            prompt: {target_blocks: []}
            pairs:
              - {left: "до некоторой степени", right: "to a certain extent"}
              - {left: "в целом", right: "in general"}
              - {left: "не обязательно", right: "not necessarily"}
              - {left: "это зависит", right: "that depends"}
              - {left: "ответственность", right: "responsibility"}
              - {left: "не всегда", right: "not always"}
          - content_key: ru.b2.unit06.lesson02.exercise04.order_ne_obyazatelno
            type: word_order
            tested_text: "Это не обязательно плохо"
            prompt: {target_blocks: []}
            word_bank: ["Это", "не", "обязательно", "плохо"]
