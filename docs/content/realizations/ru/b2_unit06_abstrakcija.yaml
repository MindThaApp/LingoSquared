          - content_key: ru.b2.unit06.lesson02.exercise06.write_eto_zavisit
            type: writing_prompt
            tested_text: "Это зависит"
            prompt: {target_blocks: [{text: "Write in Russian: That depends.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson02.exercise07.translate_do_nekotoroy_stepeni
            type: translation
            tested_text: "До некоторой степени это правда"
            prompt: {target_blocks: [{text: "Translate into Russian, using до некоторой степени: That is true to a certain extent.", language_code: en, direction: ltr}]}

      - content_key: ru.b2.unit06.lesson03.otvet_na_vozrazhenie
        title: "Ответ на возражение"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
