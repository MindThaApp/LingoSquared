            prompt: {target_blocks: [{text: "Я считаю, что удалённая работа — это хорошо. С одной стороны, это лучше для свободы, с другой стороны, я понимаю, что не всем это подходит. До некоторой степени это правда. Всё же я убеждён, что командная работа от этого не страдает. Это не обязательно легко, но это того стоит.", language_code: ru, direction: ltr}, {text: "What does the author CONCEDE to the opposing side?", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson05.exercise03.read_final_value
            type: reading_comprehension
            tested_text: "командная работа от этого не страдает"
            prompt: {target_blocks: [{text: "Я считаю, что удалённая работа — это хорошо. С одной стороны, это лучше для свободы, с другой стороны, я понимаю, что не всем это подходит. До некоторой степени это правда. Всё же я убеждён, что командная работа от этого не страдает. Это не обязательно легко, но это того стоит.", language_code: ru, direction: ltr}, {text: "On what basis does the author still support remote work?", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit06.lesson05.exercise04.read_hedge
            type: reading_comprehension
            tested_text: "не обязательно легко"
            prompt: {target_blocks: [{text: "Я считаю, что удалённая работа — это хорошо. С одной стороны, это лучше для свободы, с другой стороны, я понимаю, что не всем это подходит. До некоторой степени это правда. Всё же я убеждён, что командная работа от этого не страдает. Это не обязательно легко, но это того стоит.", language_code: ru, direction: ltr}, {text: "Does the author claim it would be easy?", language_code: en, direction: ltr}]}
