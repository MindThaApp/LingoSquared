    language: ru
    text: >-
      Дима: Здравствуйте! У меня болит голова и горло. Доктор: Что у вас
      болит? Голова и горло? Дима: Да, и ещё температура. Доктор: Вам
      нужно отдыхать и пить много воды.
    voice_hint: two_adults_neutral
    status: pending_generation

units:
  - content_key: ru.a1.unit16.health
    title: "У меня болит голова"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.health.describe_basic_problem
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
        title: "У меня болит голова"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - {content_key: ru.a1.unit16.lesson01.teach.u_menya_bolit_golova, kind: phrase, target: {text: "У меня болит голова.", language_code: ru, direction: ltr}, introduced_tokens: [У, меня, болит, голова]}
          - {content_key: ru.a1.unit16.lesson01.teach.zhivot, kind: vocabulary, target: {text: "живот", language_code: ru, direction: ltr}, introduced_tokens: [живот], example: {text: "У меня болит живот.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit16.lesson01.teach.gorlo, kind: vocabulary, target: {text: "горло", language_code: ru, direction: ltr}, introduced_tokens: [горло], example: {text: "У меня болит горло.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit16.lesson01.exercise01.recognize_bolit
            type: multiple_choice
            tested_text: "болит"
            prompt: {target_blocks: [{text: "hurts / aches", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson01.exercise02.recognize_golova
            type: multiple_choice
            tested_text: "голова"
            prompt: {target_blocks: [{text: "head", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson01.exercise03.listen_select_u_menya_bolit_golova
            type: listen_select
            tested_text: "У меня болит голова"
            media_asset_key: ru.a1.audio.u_menya_bolit_golova.neutral.01
            prompt: {target_blocks: [{text: "What hurts?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson01.exercise04.match_body_words
            type: matching_pairs
            tested_text: "у меня болит голова живот горло"
            prompt: {target_blocks: []}
            pairs:
              - {left: "у меня", right: "I have (at me)"}
              - {left: "болит", right: "hurts"}
              - {left: "голова", right: "head"}
              - {left: "живот", right: "stomach"}
              - {left: "горло", right: "throat"}
              - {left: "У меня болит голова.", right: "My head hurts."}
          - content_key: ru.a1.unit16.lesson01.exercise05.order_u_menya_bolit_golova
            type: word_order
            tested_text: "У меня болит голова"
            prompt: {target_blocks: []}
            word_bank: ["болит", "У", "меня", "голова"]
          - content_key: ru.a1.unit16.lesson01.exercise06.listen_order_u_menya_bolit_golova
            type: listen_order
            tested_text: "У меня болит голова"
            media_asset_key: ru.a1.audio.u_menya_bolit_golova.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["меня", "У", "болит", "голова"]
          - content_key: ru.a1.unit16.lesson01.exercise07.complete_bolit_golova
            type: fill_in_blank
            tested_text: "У меня болит голова"
            prompt: {target_blocks: [{text: "У меня ___ голова. (hurts)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson01.exercise08.write_stomach_hurts
            type: writing_prompt
            tested_text: "У меня болит живот"
            prompt: {target_blocks: [{text: "Write a sentence saying your stomach hurts, using \"болит\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit16.lesson02.u_menya_temperatura
        title: "У меня температура"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - {content_key: ru.a1.unit16.lesson02.teach.u_menya_temperatura, kind: phrase, target: {text: "У меня температура.", language_code: ru, direction: ltr}, introduced_tokens: [температура]}
          - {content_key: ru.a1.unit16.lesson02.teach.prostuda, kind: vocabulary, target: {text: "простуда", language_code: ru, direction: ltr}, introduced_tokens: [простуда], example: {text: "У меня простуда.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit16.lesson02.teach.mne_ploho, kind: phrase, target: {text: "Мне плохо.", language_code: ru, direction: ltr}, introduced_tokens: [Мне, плохо]}
        exercises:
          - content_key: ru.a1.unit16.lesson02.exercise01.recognize_temperatura
            type: multiple_choice
            tested_text: "температура"
            prompt: {target_blocks: [{text: "fever / temperature", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson02.exercise02.recognize_ploho
            type: multiple_choice
            tested_text: "плохо"
            prompt: {target_blocks: [{text: "bad(ly) / unwell", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson02.exercise03.listen_select_u_menya_temperatura
            type: listen_select
            tested_text: "У меня температура"
            media_asset_key: ru.a1.audio.u_menya_temperatura.neutral.01
            prompt: {target_blocks: [{text: "What's wrong with the speaker?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson02.exercise04.match_symptom_words
            type: matching_pairs
            tested_text: "температура простуда плохо болит голова живот"
            prompt: {target_blocks: []}
            pairs:
              - {left: "температура", right: "fever"}
              - {left: "простуда", right: "a cold"}
              - {left: "Мне плохо.", right: "I feel bad."}
              - {left: "болит голова", right: "head hurts"}
              - {left: "живот", right: "stomach"}
              - {left: "У меня температура.", right: "I have a fever."}
          - content_key: ru.a1.unit16.lesson02.exercise05.order_u_menya_temperatura
            type: word_order
            tested_text: "У меня температура"
            prompt: {target_blocks: []}
            word_bank: ["температура", "У", "меня"]
          - content_key: ru.a1.unit16.lesson02.exercise06.listen_order_u_menya_temperatura
            type: listen_order
            tested_text: "У меня температура"
            media_asset_key: ru.a1.audio.u_menya_temperatura.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["меня", "температура", "У"]
          - content_key: ru.a1.unit16.lesson02.exercise07.complete_prostuda
            type: fill_in_blank
            tested_text: "У меня простуда"
            prompt: {target_blocks: [{text: "У меня ___. (a cold)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson02.exercise08.write_have_fever
            type: writing_prompt
            tested_text: "У меня температура"
            prompt: {target_blocks: [{text: "Write a sentence saying you have a fever.", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit16.lesson03.u_vracha
        title: "Диалог: у врача"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - {content_key: ru.a1.unit16.lesson03.teach.dima_zdravstvuyte_bolit, kind: dialogue, target: {text: "Здравствуйте! У меня болит голова и горло.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [Здравствуйте, и]}
          - {content_key: ru.a1.unit16.lesson03.teach.doktor_chto_u_vas_bolit, kind: dialogue, target: {text: "Что у вас болит? Голова и горло?", language_code: ru, direction: ltr, speaker: "Доктор"}, introduced_tokens: [Что, у, вас]}
          - {content_key: ru.a1.unit16.lesson03.teach.dima_da_i_eshchyo_temperatura, kind: dialogue, target: {text: "Да, и ещё температура.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [Да, ещё]}
          - {content_key: ru.a1.unit16.lesson03.teach.doktor_vam_nuzhno_otdyhat, kind: dialogue, target: {text: "Вам нужно отдыхать и пить много воды.", language_code: ru, direction: ltr, speaker: "Доктор"}, introduced_tokens: [Вам, нужно, отдыхать, пить, много, воды]}
        exercises:
          - content_key: ru.a1.unit16.lesson03.exercise01.choose_tell_doctor_hurts
            type: multiple_choice
            tested_text: "У меня болит голова и горло"
            prompt: {target_blocks: [{text: "You want to tell the doctor your head and throat hurt. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson03.exercise02.listen_select_chto_u_vas_bolit
            type: listen_select
            tested_text: "Что у вас болит"
            media_asset_key: ru.a1.audio.chto_u_vas_bolit.neutral.01
            prompt: {target_blocks: [{text: "What is the doctor asking?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson03.exercise03.dialogue_comprehension_u_vracha
            type: dialogue_comprehension
            tested_text: "болит голова горло температура отдыхать воды"
            media_asset_key: ru.a1.audio.dialogue.u_vracha.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit16.lesson03.exercise04.match_dialogue_lines
            type: matching_pairs
            tested_text: "здравствуйте болит голова горло температура отдыхать воды"
            prompt: {target_blocks: []}
            pairs:
              - {left: "У меня болит голова и горло.", right: "My head and throat hurt."}
              - {left: "Что у вас болит?", right: "What hurts?"}
              - {left: "И ещё температура.", right: "And also a fever."}
              - {left: "Вам нужно отдыхать.", right: "You need to rest."}
              - {left: "Пить много воды.", right: "Drink a lot of water."}
              - {left: "Здравствуйте!", right: "Hello! (formal)"}
          - content_key: ru.a1.unit16.lesson03.exercise05.order_vam_nuzhno_otdyhat
            type: word_order
            tested_text: "Вам нужно отдыхать"
            prompt: {target_blocks: []}
            word_bank: ["нужно", "Вам", "отдыхать"]
          - content_key: ru.a1.unit16.lesson03.exercise06.reply_chto_u_vas_bolit
            type: dialogue_response
            tested_text: "У меня болит голова и горло"
            prompt: {target_blocks: [{text: "Что у вас болит?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson03.exercise07.complete_vam_nuzhno_otdyhat
            type: fill_in_blank
            tested_text: "Вам нужно отдыхать и пить много воды"
            prompt: {target_blocks: [{text: "Вам нужно ___ и пить много воды. (rest)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit16.lesson03.exercise08.write_symptoms_and_advice
            type: writing_prompt
            tested_text: "У меня болит горло и температура"
            prompt: {target_blocks: [{text: "Write two or three sentences telling a doctor what hurts and that you have a fever.", language_code: en, direction: ltr}]}
