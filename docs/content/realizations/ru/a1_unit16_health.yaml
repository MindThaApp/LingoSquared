  source: >-
    No direct public-domain source was consulted for this unit. Vocabulary
    (голова, живот, горло, температура, простуда), the "у меня болит..."
    construction, and the doctor-patient scene were authored fresh using
    standard contemporary Russian, following the exact structure, exercise
    mix, and register conventions already established and reviewed
    zero-defect in a1_unit13/14/15 of this same course.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: none
  notes: "Fresh-context review 2026-07-12 (AUTHORING_GUIDE §20): formal вы doctor register verified consistent (Здравствуйте / Что у вас болит? / Вам нужно + infinitive); у меня болит + nominative body part correct; every multiple_choice/listen_select has exactly one defensible answer and no distractor is said in the tested clip; matching_pairs have unique lefts and unique glosses. One defect fixed: lesson03's teaching stack omitted Дима's audio turn \"Да, и ещё температура.\", leaving ещё untaught while it appears in the lesson03 matching pair — the turn was added as a dialogue card. Flagged for a native eye: \"У меня болит голова и горло\" uses singular болит with a coordinated subject (normal in speech, prescriptively болят)."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian. Lessons 1-2 use the informal "у
    меня болит..." construction anyone would use describing their own
    symptoms. Lesson 3 is a doctor's-office dialogue using the formal вы
    register between a patient and a doctor who are strangers, contrasting
    correctly with the informal ты register used in units 11-15.

