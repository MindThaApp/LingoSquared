schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: unreviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. Lesson 9's
    "Как дойти до американского посольства?" dialogue supplied the "Как
    дойти до...?" (how do I get to...?) request pattern and the direction
    vocabulary направо/налево/прямо/повернуть/квартал, drawn also from its
    "Вариант диалога №5" (Canadian Embassy) variant. Every example
    sentence, exercise, and dialogue here was freshly authored for a
    natural 2026 everyday-use context (asking for and following short
    directions to a nearby place), not imported verbatim from the source
    (AUTHORING_GUIDE §10). Combining acute-accent stress marks were
    stripped from every learner-facing string.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: ""

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit covers asking for and following short directions to a nearby
    place; a polite вы register is used throughout, appropriate for
    strangers asking each other for directions on the street.

media_assets:
  - {content_key: ru.a1.audio.kak_doyti_do_muzeya.neutral.01, language: ru, text: "Как дойти до музея?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.idite_pryamo_potom_napravo.neutral.01, language: ru, text: "Идите прямо, потом направо.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.kak_doyti_do_bank.neutral.01, language: ru, text: "Как дойти до банка?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.povernite_nalevo_za_uglom.neutral.01, language: ru, text: "Поверните налево за углом.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.eto_daleko.neutral.01, language: ru, text: "Это далеко отсюда?", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.k_muzeyu.01
    language: ru
    text: >-
      Турист: Простите, как дойти до музея? Прохожий: Это очень просто.
      Идите прямо два квартала, потом поверните направо. Турист: Это
      далеко отсюда? Прохожий: Нет, пять минут пешком. Турист: Спасибо
      большое. Прохожий: Пожалуйста.
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit10.directions
    title: "Как пройти?"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.directions.ask_follow_basic_directions
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit10.lesson01.kak_doyti
        title: "Как дойти до...?"
        spine_outcome_id: universal.a1.directions.ask_follow_basic_directions
        teaching:
          - {content_key: ru.a1.unit10.lesson01.teach.kak_doyti, kind: phrase, target: {text: "Как дойти до...?", language_code: ru, direction: ltr}, introduced_tokens: [Как, дойти, до]}
          - {content_key: ru.a1.unit10.lesson01.teach.muzeya, kind: vocabulary, target: {text: "музей", language_code: ru, direction: ltr}, introduced_tokens: [музей, музея], example: {text: "Как дойти до музея?", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit10.lesson01.teach.pryamo, kind: vocabulary, target: {text: "прямо", language_code: ru, direction: ltr}, introduced_tokens: [прямо, Идите, идите], example: {text: "Идите прямо.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit10.lesson01.teach.napravo, kind: vocabulary, target: {text: "направо", language_code: ru, direction: ltr}, introduced_tokens: [направо, потом], example: {text: "Идите прямо, потом направо.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit10.lesson01.exercise01.recognize_pryamo
            type: multiple_choice
            tested_text: "прямо"
            prompt: {target_blocks: [{text: "straight ahead", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson01.exercise02.recognize_napravo
            type: multiple_choice
            tested_text: "направо"
            prompt: {target_blocks: [{text: "to the right", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson01.exercise03.listen_select_kak_doyti_muzeya
            type: listen_select
            tested_text: "Как дойти до музея"
            media_asset_key: ru.a1.audio.kak_doyti_do_muzeya.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson01.exercise04.match_direction_words
            type: matching_pairs
            tested_text: "как дойти музей прямо направо потом"
            prompt: {target_blocks: []}
            pairs:
              - {left: "как дойти", right: "how to get"}
              - {left: "музей", right: "museum"}
              - {left: "прямо", right: "straight ahead"}
              - {left: "направо", right: "to the right"}
              - {left: "потом", right: "then"}
              - {left: "до", right: "to/until"}
          - content_key: ru.a1.unit10.lesson01.exercise05.order_kak_doyti_do_muzeya
            type: word_order
            tested_text: "Как дойти до музея"
            prompt: {target_blocks: []}
            word_bank: ["дойти", "Как", "до", "музея"]
          - content_key: ru.a1.unit10.lesson01.exercise06.listen_order_idite_pryamo_napravo
            type: listen_order
            tested_text: "Идите прямо потом направо"
            media_asset_key: ru.a1.audio.idite_pryamo_potom_napravo.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["прямо", "Идите", "потом", "направо"]
          - content_key: ru.a1.unit10.lesson01.exercise07.complete_kak_doyti_do_muzeya
            type: fill_in_blank
            tested_text: "Как дойти до музея"
            prompt: {target_blocks: [{text: "Как дойти ___ музея? (to)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson01.exercise08.write_ask_way_to_museum
            type: writing_prompt
            tested_text: "Как дойти до музея"
            prompt: {target_blocks: [{text: "Write a question asking how to get to the museum, using \"Как дойти до...?\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit10.lesson02.povorachivayte
        title: "Поверните налево"
        spine_outcome_id: universal.a1.directions.ask_follow_basic_directions
        teaching:
          - content_key: ru.a1.unit10.lesson02.teach.nalevo
            kind: vocabulary
            target: {text: "налево", language_code: ru, direction: ltr}
            introduced_tokens: [налево]
            example: {text: "Поверните налево.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit10.lesson02.teach.povernite
            kind: vocabulary
            target: {text: "поверните", language_code: ru, direction: ltr}
            introduced_tokens: [поверните, за, углом]
            example: {text: "Поверните налево за углом.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit10.lesson02.teach.kvartal_daleko
            kind: vocabulary
            target: {text: "квартал, далеко", language_code: ru, direction: ltr}
            introduced_tokens: [квартал, квартала, далеко, отсюда, Это, это, два, банка]
            example:
              - {text: "Идите два квартала.", language_code: ru, direction: ltr}
              - {text: "Это далеко отсюда?", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit10.lesson02.exercise01.recognize_povernite
            type: multiple_choice
            tested_text: "поверните"
            prompt: {target_blocks: [{text: "turn (polite command)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson02.exercise02.recognize_daleko
            type: multiple_choice
            tested_text: "далеко"
            prompt: {target_blocks: [{text: "far", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson02.exercise03.listen_select_eto_daleko
            type: listen_select
            tested_text: "Это далеко отсюда"
            media_asset_key: ru.a1.audio.eto_daleko.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson02.exercise04.match_more_direction_phrases
            type: matching_pairs
            tested_text: "поверните налево квартал далеко за углом"
            prompt: {target_blocks: []}
            pairs:
              - {left: "поверните", right: "turn"}
              - {left: "налево", right: "to the left"}
              - {left: "квартал", right: "block"}
              - {left: "далеко", right: "far"}
              - {left: "за углом", right: "around the corner"}
              - {left: "отсюда", right: "from here"}
          - content_key: ru.a1.unit10.lesson02.exercise05.order_povernite_nalevo_za_uglom
            type: word_order
            tested_text: "Поверните налево за углом"
            prompt: {target_blocks: []}
            word_bank: ["налево", "Поверните", "за", "углом"]
          - content_key: ru.a1.unit10.lesson02.exercise06.listen_order_povernite_nalevo
            type: listen_order
            tested_text: "Поверните налево за углом"
            media_asset_key: ru.a1.audio.povernite_nalevo_za_uglom.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["за", "Поверните", "налево", "углом"]
          - content_key: ru.a1.unit10.lesson02.exercise07.complete_eto_daleko
            type: fill_in_blank
            tested_text: "Это далеко отсюда"
            prompt: {target_blocks: [{text: "Это ___ отсюда? (far)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson02.exercise08.write_directions_to_bank
            type: writing_prompt
            tested_text: "Идите прямо потом поверните налево"
            prompt: {target_blocks: [{text: "Write one or two direction steps: go straight, then turn left, using \"Идите\" and \"Поверните\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
        title: "Диалог: к музею"
        spine_outcome_id: universal.a1.directions.ask_follow_basic_directions
        teaching:
          - {content_key: ru.a1.unit10.lesson03.teach.tourist_prostite, kind: dialogue, target: {text: "Турист: Простите, как дойти до музея?", language_code: ru, direction: ltr}, introduced_tokens: [Турист, Простите]}
          - {content_key: ru.a1.unit10.lesson03.teach.prokhozhiy_eto_prosto, kind: dialogue, target: {text: "Прохожий: Это очень просто. Идите прямо два квартала, потом поверните направо.", language_code: ru, direction: ltr}, introduced_tokens: [Прохожий, очень, просто]}
          - {content_key: ru.a1.unit10.lesson03.teach.tourist_daleko, kind: dialogue, target: {text: "Турист: Это далеко отсюда?", language_code: ru, direction: ltr}, introduced_tokens: []}
          - {content_key: ru.a1.unit10.lesson03.teach.prokhozhiy_pyat_minut, kind: dialogue, target: {text: "Прохожий: Нет, пять минут пешком.", language_code: ru, direction: ltr}, introduced_tokens: [пять, минут, пешком]}
          - {content_key: ru.a1.unit10.lesson03.teach.tourist_spasibo, kind: dialogue, target: {text: "Турист: Спасибо большое.", language_code: ru, direction: ltr}, introduced_tokens: []}
        exercises:
          - content_key: ru.a1.unit10.lesson03.exercise01.choose_ask_way_to_museum
            type: multiple_choice
            tested_text: "Простите как дойти до музея"
            prompt: {target_blocks: [{text: "You want to politely ask a stranger how to get to the museum. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson03.exercise02.listen_select_kak_doyti_do_bank
            type: listen_select
            tested_text: "Как дойти до банка"
            media_asset_key: ru.a1.audio.kak_doyti_do_bank.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson03.exercise03.dialogue_comprehension_k_muzeyu
            type: dialogue_comprehension
            tested_text: "квартал направо пять минут пешком"
            media_asset_key: ru.a1.audio.dialogue.k_muzeyu.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit10.lesson03.exercise04.match_dialogue_phrases
            type: matching_pairs
            tested_text: "простите как дойти квартал поверните направо пешком"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Простите, как дойти до музея?", right: "Excuse me, how do I get to the museum?"}
              - {left: "Идите прямо два квартала.", right: "Go straight two blocks."}
              - {left: "Поверните направо.", right: "Turn right."}
              - {left: "Это далеко отсюда?", right: "Is it far from here?"}
              - {left: "Пять минут пешком.", right: "Five minutes on foot."}
              - {left: "Спасибо большое.", right: "Thank you very much."}
          - content_key: ru.a1.unit10.lesson03.exercise05.order_idite_pryamo_dva_kvartala
            type: word_order
            tested_text: "Идите прямо два квартала"
            prompt: {target_blocks: []}
            word_bank: ["прямо", "Идите", "два", "квартала"]
          - content_key: ru.a1.unit10.lesson03.exercise06.reply_kak_doyti_do_banka
            type: dialogue_response
            tested_text: "Идите прямо потом направо"
            prompt: {target_blocks: [{text: "Как дойти до банка?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson03.exercise07.complete_pyat_minut_peshkom
            type: fill_in_blank
            tested_text: "Пять минут пешком"
            prompt: {target_blocks: [{text: "Пять минут ___. (on foot)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit10.lesson03.exercise08.write_directions_dialogue
            type: writing_prompt
            tested_text: "Идите прямо два квартала потом поверните направо"
            prompt: {target_blocks: [{text: "Write two or three sentences giving someone directions to a nearby place.", language_code: en, direction: ltr}]}
