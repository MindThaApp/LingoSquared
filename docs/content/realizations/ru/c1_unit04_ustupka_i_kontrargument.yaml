  human_reviewed: false
  notes: >-
    Russian C1 unit 04 on conceding and countering with subtlety: conceding an
    opposing point's strongest valid claim, narrowing its scope with a
    qualification, presenting a proportionate counterargument, and weighing the
    competing considerations. From-scratch generation from established Russian
    argumentation conventions; no adaptable public-domain Russian upper-level
    source exists for this specific topic, so no external source was consulted.
    Sibling isolation honored: the X->en argumentation realization and every
    nl/fa/prs/de file were treated as non-existent and NOT opened; the it C1
    unit05 file named in the dispatch prompt was used ONLY for unit shape
    (schema 1.1, 6 lessons, exercise-type vocabulary), never for content.
    Character canon checked by grepping docs/content/realizations/ru/: Настя is
    a teacher (feminine forms) and Дима is an engineer (masculine forms), an
    established pair who use informal ты with each other. This unit keeps
    informal register and deliberately authors its single model argument in a
    first-person gender-neutral voice (present-tense and impersonal forms only,
    no gendered past tense of я, no gendered short adjective agreeing with the
    speaker), so the culminating speaking and writing model is reproducible
    verbatim by a learner of either gender.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Targets universal.c1.argumentation.concede_and_counter_with_subtlety.
    Priority checks for the reviewer: (1) confirm the culminating model covers
    all four required moves in order -- concession, qualification,
    counterargument, final weighing -- and that the speaking and writing
    exercises each require the WHOLE act; (2) confirm the model is fully
    gender-neutral (no gendered past tense of я, no gendered short adjective
    agreeing with the speaker), so a learner of either gender can reproduce it
    exactly; (3) confirm the concession marker (Признаю, что), the
    qualification (Однако), the counterargument (Тем не менее), and the
    weighing (В итоге) are each characterized consistently wherever the passage
    is framed; (4) confirm every tested token is introduced earlier in the unit
    (C1 is its own Course row, so no A1-B2 vocabulary is available); (5)
    confirm the matching_pairs lefts discriminate on real meaning and no two
    lefts share a gloss; (6) confirm every listen/dictation exercise uses a
    dedicated asset whose text matches tested_text byte-for-byte.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    grading behavior, prompt/answer consistency, matching_pairs,
    distractors, meta text. No realization-side defects; overlay fixes (е
    variants, translation variants, note de-meta) recorded in the en-ru
    overlay review. NATIVE FLAGS: (a) 'Тем не менее, ...' and 'Вместе с тем,
    ...' -- per Rosental these connectors are not parenthetical and take no
    comma (teaching-only; grading ignores internal commas); (b) argument
    logic: 'Тем не менее' follows a sentence that is already pro-decision,
    so the contrast reads oddly ('Кроме того' would fit), and the
    qualification/counterargument labels for sentences 2-3 are debatable.
    DEFERRED: English target_blocks duplicating the overlay instruction
    (structural ru-C1 pattern, owner decision).

    Fresh-context review 2026-10-17 (round 2, backlog it/ru): 3 fixes - lesson04.exercise01.recognize_vzveshivanie: instruction was underdetermined (distractor 'Стабильность перевешивает свободу' also states a weighing outcome), now asks for the sentence stating that freedom wins (realization target_block + overlay); lesson01.exercise04.order_ustupka: added valid order 'Признаю что рискованно открыть свою школу'; lesson02.exercise04.order_ogovorka: added valid order 'Однако когда есть чёткий план риск оправдан'. NATIVE FLAGS: prior flags stand. DEFERRED: none.

