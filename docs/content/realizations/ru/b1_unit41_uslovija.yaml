            tested_text: "если будет дождь мы останемся дома если погода будет хорошая мы пойдём в парк если у меня не будет времени утром я позвоню тебе позже"
            prompt: {target_blocks: [{text: "Which answer states a real condition and consequence, AND a negated condition and its consequence?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit41.lesson03.exercise02.dialogue_comprehension_plan
            type: dialogue_comprehension
            tested_text: "что будешь делать если дождь останемся дома если погода хорошая пойдём в парк если не будет времени позвоню позже"
            media_asset_key: ru.b1.audio.dialogue.plan_na_vykhodnye.01
            prompt: {target_blocks: []}
