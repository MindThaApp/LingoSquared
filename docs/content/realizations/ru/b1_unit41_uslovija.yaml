            type: writing_prompt
            tested_text: "Если будет дождь мы останемся дома Если погода будет хорошая мы пойдём в парк Если у меня не будет времени утром я позвоню тебе позже"
            prompt: {target_blocks: [{text: "As Дима, write three sentences about the weekend plan: a real condition with its consequence (rain -> stay home), another real condition with its consequence (good weather -> go to the park), and one NEGATED condition with its consequence (no time in the morning -> call later).", language_code: en, direction: ltr}]}
