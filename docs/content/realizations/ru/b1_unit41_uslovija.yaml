          - {content_key: ru.b1.unit41.lesson03.teach.dima_no_time, kind: dialogue, target: {text: "Если у меня не будет времени утром, я позвоню тебе позже.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: []}
