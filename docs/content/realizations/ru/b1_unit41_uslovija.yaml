          - content_key: ru.b1.unit41.lesson03.exercise05.reply_what_you_do
            type: dialogue_response
            tested_text: "Если будет дождь мы останемся дома Если погода будет хорошая мы пойдём в парк"
            prompt: {target_blocks: [{text: "Настя: Дима, что ты будешь делать, если будет дождь?", language_code: ru, direction: ltr}]}
