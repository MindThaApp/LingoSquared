review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Third Russian B2 unit; first discourse/nuance unit. Targets the CEFR
    B2 discourse outcome
    (universal.b2.discourse.express_nuance_with_hedging_and_emphasis):
    express nuance by softening or strengthening a statement -- hedging,
    qualification, emphasis, and focus constructions -- so the SAME
    content can be delivered tentatively, neutrally, or emphatically.
    Theme: one coherent everyday topic across all six lessons -- Настя and
    Дима have watched a film and give their opinions, softening and
    strengthening the same claims. Lesson arc: L01 basic hedges that
    soften an opinion (вроде бы / довольно / немного / мне кажется, что);
    L02 more tentative framing (в каком-то смысле / как мне кажется); L03
    emphasis and degree words (действительно / совершенно / безусловно);
    L04 the focus particle именно and fronting; L05 a reading passage
    mixing hedges and emphasis; L06 the culminating dialogue where Настя
    delivers the same opinion about the music once hedged and once
    emphasized. No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked grading-safety of free-text accepted answers against the
    strict Cyrillic grader, prompt/key determinacy, reading-question
    answerability and learner-visible notes. Fixes:
    lesson05.exercise07.write_imenno_ona tested_text "Именно она делает
    фильм особенным" -> "Именно музыка делает фильм особенным" (the
    prompt names the music; the она form stays accepted) + feedback;
    lesson01.exercise07.write_claim also accepts "Мне кажется, что фильм
    довольно хороший"; lesson04.exercise05.translate_iz_za_kontsovki
    also accepts the end-focus order "Фильм всем понравился именно из-за
    концовки"; reading passage added to the target_blocks of all four
    lesson05 reading_comprehension prompts; overlay notes for lesson02
    teach.grammar_ostorozhnost, lesson03 teach.grammar_usilenie and
    lesson06 teach.grammar_modulyacija no longer cite internal lesson
    numbers or task structure. No free-text accepted answer in this unit
    contains ё. NATIVE FLAG: sentence-initial "Совершенно точно, ..."
    (lesson03 example + exercise07) may be less natural than "Музыка
    совершенно точно потрясающая". DEFERRED: none beyond the systemic ru
    grader items (ё/е fold, dash stripping) noted for unit02.

    Second-pass review 2026-10-18: 5 fixes — вроде бы was glossed 'kind
    of / sort of' (a degree hedge); it is an evidential 'it seems /
    seemingly', so teach.vrode_by title/gloss/note/example_gloss, the
    lesson01.exercise03 pair (both files), the
    grammar_smyagchenie/grammar_ostorozhnost/grammar_usilenie titles and
    the reading gloss now say 'seemingly';
    lesson01.exercise06.speak_vrode_by and
    lesson05.exercise06.translate_zatyanutyy_seredine prompts now read
    'seems' and pin 'using вроде бы'; безусловно parenthetical commas
    restored in the dialogue audio text, lesson06
    dialogue_nastya_emphasize card, lesson06.exercise07 tested_text and
    feedback; lesson03.exercise05 accepts 'Безусловно, это лучший
    фильм'; lesson03.exercise07 accepts 'Музыка совершенно точно
    потрясающая'. NATIVE FLAGS: coherence -- both Nastya (dialogue) and
    the review author call the film 'довольно неплохой' and then
    'безусловно лучший фильм (этого года)', contradictory strengths in
    one breath; sentence-initial 'Совершенно точно, ...' (carried over);
    'А по-твоему, музыка какая?' word order.

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты between Настя and Дима (continuing the ru B1 lane canon:
    Дима is an engineer, Настя is a teacher; see unit01/unit02). B2
    discourse layers hedging and emphasis frames onto that register --
    мне кажется, вроде бы, довольно, немного, действительно, совершенно,
    безусловно, именно -- while keeping everyday informal address.
    Gendered short-form adjectives/past-tense verbs only appear attributed
    to a named speaker in dialogue, never as open learner production.

