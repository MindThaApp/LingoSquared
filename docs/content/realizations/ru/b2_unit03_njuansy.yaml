    realization and every nl/fa/prs/de B2 file were treated as
    non-existent and were NOT opened; only ru's OWN earlier realization
    content (the Настя/Дима pair) was consulted for character canon.
    Настя and Дима compare hedged and emphatic opinions of a film they
    watched, which introduces no canon conflict (no pinned taste-opinion
    facts exist on record for either). Token reuse note: this unit reuses
    several already-accumulated B2 tokens from unit01/unit02 (по-моему,
    очень, точно, мне, этом) since B2 tokens accumulate course-wide across
    units in manifest order, not just within a single unit -- confirmed
