      офис. Коллега: А вы спросили, когда? Настя: Да, я спросила, придёт ли он
      сегодня. Он сказал, что придёт после обеда.
    voice_hint: two_adults_informal
    status: pending_generation

units:
  - content_key: ru.b1.unit43.kosvennaja_rech
    title: "Косвенная речь"
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.reported_speech.report_what_someone_said
    planned_lesson_count: 3
    lessons:
      - content_key: ru.b1.unit43.lesson01.chto_skazal_dima
        title: "Что сказал Дима"
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - {content_key: ru.b1.unit43.lesson01.teach.dima_skazal_chto, kind: phrase, target: {text: "Дима сказал, что он придёт в офис.", language_code: ru, direction: ltr}, introduced_tokens: [придёт], example: {text: "Сегодня Дима сказал, что он придёт в офис.", language_code: ru, direction: ltr}}
          - {content_key: ru.b1.unit43.lesson01.teach.original_tense, kind: grammar_note, target: {text: "сказал, что он придёт = без изменения времени", language_code: ru, direction: ltr}, introduced_tokens: [без, изменения, времени], example: {text: "Русский язык передаёт косвенную речь без изменения времени.", language_code: ru, direction: ltr}}
          - {content_key: ru.b1.unit43.lesson01.teach.nastya_skazala, kind: phrase, target: {text: "Настя сказала, что Дима придёт позже.", language_code: ru, direction: ltr}, introduced_tokens: [], example: {text: "Настя сказала коллеге, что Дима придёт позже.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.b1.unit43.lesson01.exercise01.recognize_reported_statement
            type: multiple_choice
            tested_text: "дима сказал что он придёт в офис"
            prompt: {target_blocks: [{text: "which Russian sentence means \"Dima said that he will come to the office\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson01.exercise02.recognize_pridet
            type: multiple_choice
            tested_text: "он придёт"
            prompt: {target_blocks: [{text: "which Russian word means \"he will come\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson01.exercise03.listen_select_reported_statement
            type: listen_select
            tested_text: "Дима сказал что он придёт в офис"
            media_asset_key: ru.b1.audio.dima_skazal_pridet.neutral.01
            prompt: {target_blocks: [{text: "What did Dima say he would do?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson01.exercise04.match_reported_statement
            type: matching_pairs
            tested_text: "сказал что придёт офис без изменения времени позже"
            prompt: {target_blocks: []}
            pairs:
              - {left: "сказал", right: "said"}
              - {left: "что", right: "that"}
              - {left: "придёт", right: "will come"}
              - {left: "без изменения времени", right: "without changing the tense"}
              - {left: "офис", right: "office"}
              - {left: "позже", right: "later"}
          - content_key: ru.b1.unit43.lesson01.exercise05.order_reported_statement
            type: word_order
            tested_text: "Дима сказал что он придёт в офис"
            prompt: {target_blocks: []}
            word_bank: ["Дима", "сказал", "что", "он", "придёт", "в", "офис"]
          - content_key: ru.b1.unit43.lesson01.exercise06.write_reported_statement
            type: writing_prompt
            tested_text: "Дима сказал что он придёт в офис"
            prompt: {target_blocks: [{text: "Write exactly this reported-speech sentence with сказал, что: Dima said that he will come to the office. (Keep the original future tense — do not backshift it.)", language_code: en, direction: ltr}]}

      - content_key: ru.b1.unit43.lesson02.nastya_sprosila
        title: "Настя спросила"
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - {content_key: ru.b1.unit43.lesson02.teach.sprosila_li, kind: phrase, target: {text: "Настя спросила, придёт ли он.", language_code: ru, direction: ltr}, introduced_tokens: [спросила, ли], example: {text: "Вчера Настя спросила, придёт ли он.", language_code: ru, direction: ltr}}
          - {content_key: ru.b1.unit43.lesson02.teach.sprosila_chto_delaet, kind: phrase, target: {text: "Она спросила, что он делает.", language_code: ru, direction: ltr}, introduced_tokens: [делает], example: {text: "Она спросила коллегу, что он делает.", language_code: ru, direction: ltr}}
          - {content_key: ru.b1.unit43.lesson02.teach.li_word_order, kind: grammar_note, target: {text: "придёт ли он = ли стоит после глагола", language_code: ru, direction: ltr}, introduced_tokens: [стоит, после, глагола], example: {text: "В вопросе с ли частица ли стоит после глагола: придёт ли он.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.b1.unit43.lesson02.exercise01.recognize_reported_yesno_question
            type: multiple_choice
            tested_text: "настя спросила придёт ли он"
            prompt: {target_blocks: [{text: "which Russian sentence means \"Nastya asked whether he would come\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson02.exercise02.recognize_sprosila_chto
            type: multiple_choice
            tested_text: "она спросила что он делает"
            prompt: {target_blocks: [{text: "which Russian sentence means \"she asked what he is doing\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson02.exercise03.listen_select_reported_question
            type: listen_select
            tested_text: "Настя спросила придёт ли он"
            media_asset_key: ru.b1.audio.nastya_sprosila_li.neutral.01
            prompt: {target_blocks: [{text: "What did Nastya ask?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson02.exercise04.match_reported_question
            type: matching_pairs
            tested_text: "спросила ли делает стоит после глагола"
            prompt: {target_blocks: []}
            pairs:
              - {left: "спросила", right: "asked"}
              - {left: "ли", right: "whether"}
              - {left: "делает", right: "is doing"}
              - {left: "стоит после глагола", right: "comes after the verb"}
              - {left: "придёт ли он", right: "whether he would come"}
              - {left: "что он делает", right: "what he is doing"}
          - content_key: ru.b1.unit43.lesson02.exercise05.order_reported_question
            type: word_order
            tested_text: "Настя спросила придёт ли он"
            prompt: {target_blocks: []}
            word_bank: ["Настя", "спросила", "придёт", "ли", "он"]
          - content_key: ru.b1.unit43.lesson02.exercise06.write_reported_question
            type: writing_prompt
            tested_text: "Настя спросила придёт ли он"
            prompt: {target_blocks: [{text: "Write exactly this reported yes/no question with ли: Nastya asked whether he would come.", language_code: en, direction: ltr}]}

      - content_key: ru.b1.unit43.lesson03.chto_skazal_dima_dialog
        title: "Что сказал Дима — разговор"
        spine_outcome_id: universal.b1.reported_speech.report_what_someone_said
        teaching:
          - {content_key: ru.b1.unit43.lesson03.teach.kollega_question, kind: dialogue, target: {text: "Настя, что сказал Дима?", language_code: ru, direction: ltr, speaker: "Коллега"}, introduced_tokens: [Коллега]}
          - {content_key: ru.b1.unit43.lesson03.teach.nastya_reports, kind: dialogue, target: {text: "Дима сказал, что он придёт в офис.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: []}
          - {content_key: ru.b1.unit43.lesson03.teach.kollega_asked_when, kind: dialogue, target: {text: "А вы спросили, когда?", language_code: ru, direction: ltr, speaker: "Коллега"}, introduced_tokens: []}
          - {content_key: ru.b1.unit43.lesson03.teach.nastya_asked_li, kind: dialogue, target: {text: "Да, я спросила, придёт ли он сегодня.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: []}
          - {content_key: ru.b1.unit43.lesson03.teach.nastya_after_lunch, kind: dialogue, target: {text: "Он сказал, что придёт после обеда.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [после, обеда]}
        exercises:
          - content_key: ru.b1.unit43.lesson03.exercise01.choose_complete_reported_speech
            type: multiple_choice
            tested_text: "дима сказал что он придёт в офис я спросила придёт ли он сегодня он сказал что придёт после обеда"
            prompt: {target_blocks: [{text: "Which answer reports both what Dima said AND what Nastya asked him, in indirect speech without backshifting the tense?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson03.exercise02.dialogue_comprehension_reported_speech
            type: dialogue_comprehension
            tested_text: "что сказал дима придёт в офис спросила когда придёт ли сегодня сказал после обеда"
            media_asset_key: ru.b1.audio.dialogue.chto_skazal_dima.01
            prompt: {target_blocks: []}
          - content_key: ru.b1.unit43.lesson03.exercise03.match_dialogue_reported_speech
            type: matching_pairs
            tested_text: "что сказал дима придёт в офис спросила придёт ли сегодня после обеда"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Что сказал Дима?", right: "What did Dima say?"}
              - {left: "Дима сказал, что он придёт в офис.", right: "Dima said that he will come to the office."}
              - {left: "А вы спросили, когда?", right: "And did you ask when?"}
              - {left: "я спросила, придёт ли он сегодня", right: "I asked whether he would come today"}
              - {left: "он сказал, что придёт после обеда", right: "he said that he'll come after lunch"}
              - {left: "после обеда", right: "after lunch"}
          - content_key: ru.b1.unit43.lesson03.exercise04.order_after_lunch
            type: word_order
            tested_text: "Он сказал что придёт после обеда"
            prompt: {target_blocks: []}
            word_bank: ["Он", "сказал", "что", "придёт", "после", "обеда"]
          - content_key: ru.b1.unit43.lesson03.exercise05.reply_what_dima_said
            type: dialogue_response
            tested_text: "Дима сказал что он придёт в офис"
            prompt: {target_blocks: [{text: "Коллега: Настя, что сказал Дима?", language_code: ru, direction: ltr}]}
          - content_key: ru.b1.unit43.lesson03.exercise06.write_full_reported_exchange
            type: writing_prompt
            tested_text: "Дима сказал что он придёт в офис Я спросила придёт ли он сегодня Он сказал что придёт после обеда"
            prompt: {target_blocks: [{text: "As Настя, write three sentences reporting the exchange: report what Dima said (he will come to the office), report the yes/no question you asked him (whether he would come today) using ли, and report his answer (he'll come after lunch). Keep the original tense in every что-clause.", language_code: en, direction: ltr}]}
