schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: unreviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. Lesson
    3 ("Давайте познакомимся!" — Let's get acquainted) supplied the
    scaffold: the "Как вас зовут? / Меня зовут ..." name-exchange pattern,
    the вы/ты formality distinction and when each is used, and the
    "Давайте перейдём на ты" register-shift phrase. Vocabulary selection
    and grammar sequencing came from the source; every sentence, the
    dialogue, exercises, and teaching notes were freshly authored/
    modernized for a 2026 conversational register, not imported verbatim
    (AUTHORING_GUIDE §10). The source's Russian-patronymic-system detail
    was deliberately simplified out of this A1 wave (still real and
    accurate, but too much for a first introductions unit) rather than
    presented in a diluted/inaccurate form; a fuller treatment belongs in
    a later unit. Combining acute-accent stress marks were stripped from
    every learner-facing string.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    First en-ru A1 wave, units 1-3. Pending mandatory fresh-context review
    per the tiered review policy (new language = full review, not sampled).
    Native-speaker review also not yet done.

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. Use the
    formal вы and informal ты distinction explicitly and consistently:
    вы for strangers, work settings, and anyone owed respect or distance;
    ты for friends, family, children, and peers once a relationship allows
    it. Keep each exercise's register explicit and never let a ты-register
    sentence use a вы-conjugated verb form or vice versa.

media_assets:
  - {content_key: ru.a1.audio.kak_vas_zovut.formal.01, language: ru, text: "Как вас зовут?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.kak_tebya_zovut.informal.01, language: ru, text: "Как тебя зовут?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: ru.a1.audio.menya_zovut_viktor.neutral.01, language: ru, text: "Меня зовут Виктор.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.davayte_poznakomimsya.neutral.01, language: ru, text: "Давайте познакомимся.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.ochen_priyatno.neutral.01, language: ru, text: "Очень приятно.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.mozhno_na_ty.neutral.01, language: ru, text: "Можно на ты?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: ru.a1.audio.davayte_pereydyom_na_ty.neutral.01, language: ru, text: "Давайте перейдём на ты.", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.office_intro.01
    language: ru
    text: >-
      Ирина Петровна: Здравствуйте! Давайте познакомимся. Меня зовут
      Ирина Петровна. Джон: Очень приятно. Меня зовут Джон.
      Ирина Петровна: Откуда вы, Джон? Джон: Я из Канады. А вы откуда?
      Ирина Петровна: Я из Москвы.
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit02.introductions
    title: "Знакомство"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.introductions.exchange_identity
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit02.lesson01.kak_vas_zovut
        title: "Как вас зовут?"
        spine_outcome_id: universal.a1.introductions.exchange_identity
        teaching:
          - content_key: ru.a1.unit02.lesson01.teach.kak_vas_zovut
            kind: vocabulary
            target: {text: "Как вас зовут?, Как тебя зовут?", language_code: ru, direction: ltr}
            introduced_tokens: [Как, вас, зовут, тебя]
            example:
              - {text: "Здравствуйте! Как вас зовут?", language_code: ru, direction: ltr}
              - {text: "Привет! Как тебя зовут?", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit02.lesson01.teach.menya_zovut, kind: phrase, target: {text: "Меня зовут Виктор.", language_code: ru, direction: ltr}, introduced_tokens: [Меня, зовут, Виктор]}
          - {content_key: ru.a1.unit02.lesson01.teach.menya_zovut_anna, kind: phrase, target: {text: "Меня зовут Анна.", language_code: ru, direction: ltr}, introduced_tokens: [Меня, зовут, Анна]}
          - content_key: ru.a1.unit02.lesson01.teach.register_note
            kind: grammar_note
            target: {text: "Как вас зовут? — вежливо или незнакомым людям. Как тебя зовут? — с друзьями, детьми, ровесниками.", language_code: ru, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ru.a1.unit02.lesson01.exercise01.choose_formal_question
            type: multiple_choice
            tested_text: "Как вас зовут"
            prompt: {target_blocks: [{text: "You are meeting your new manager for the first time.", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson01.exercise02.listen_select_informal_question
            type: listen_select
            tested_text: "Как тебя зовут"
            media_asset_key: ru.a1.audio.kak_tebya_zovut.informal.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit02.lesson01.exercise03.choose_natural_answer
            type: multiple_choice
            tested_text: "Меня зовут Виктор"
            prompt: {target_blocks: [{text: "Как вас зовут?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson01.exercise04.match_question_register
            type: matching_pairs
            tested_text: "Как вас зовут Как тебя зовут"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Как вас зовут?", right: "formal / polite"}
              - {left: "Как тебя зовут?", right: "informal"}
          - content_key: ru.a1.unit02.lesson01.exercise05.order_name_statement
            type: word_order
            tested_text: "Меня зовут Анна"
            prompt: {target_blocks: []}
            word_bank: ["зовут", "Анна", "Меня"]
          - content_key: ru.a1.unit02.lesson01.exercise06.listen_order_formal_name
            type: listen_order
            tested_text: "Меня зовут Виктор"
            media_asset_key: ru.a1.audio.menya_zovut_viktor.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["Виктор", "зовут", "Меня"]
          - content_key: ru.a1.unit02.lesson01.exercise07.complete_name_answer
            type: fill_in_blank
            tested_text: "Меня зовут Анна"
            prompt: {target_blocks: [{text: "Как тебя зовут? — ___ зовут Анна.", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson01.exercise08.write_self_name
            type: writing_prompt
            tested_text: "Меня зовут"
            prompt: {target_blocks: [{text: "Write a sentence giving your own name in Russian, using \"Меня зовут ...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit02.lesson02.vy_i_ty
        title: "Вы и ты"
        spine_outcome_id: universal.a1.introductions.exchange_identity
        teaching:
          - content_key: ru.a1.unit02.lesson02.teach.vy_ty
            kind: vocabulary
            target: {text: "вы, ты", language_code: ru, direction: ltr}
            introduced_tokens: [вы, ты]
            example:
              - {text: "Откуда вы?", language_code: ru, direction: ltr}
              - {text: "Откуда ты?", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit02.lesson02.teach.vy_ty_rule
            kind: grammar_note
            target: {text: "Вы — формально, с незнакомыми людьми, на работе, со старшими. Ты — неформально, с друзьями, семьёй, детьми.", language_code: ru, direction: ltr}
            introduced_tokens: []
          - {content_key: ru.a1.unit02.lesson02.teach.mozhno_na_ty, kind: phrase, target: {text: "Можно на ты?", language_code: ru, direction: ltr}, introduced_tokens: [Можно, на, ты]}
          - {content_key: ru.a1.unit02.lesson02.teach.davayte_pereydyom, kind: phrase, target: {text: "Давайте перейдём на ты.", language_code: ru, direction: ltr}, introduced_tokens: [Давайте, перейдём, на, ты]}
          - {content_key: ru.a1.unit02.lesson02.teach.otkuda_vy, kind: phrase, target: {text: "Откуда вы?", language_code: ru, direction: ltr}, introduced_tokens: [Откуда, вы]}
          - {content_key: ru.a1.unit02.lesson02.teach.otkuda_ty, kind: phrase, target: {text: "Откуда ты?", language_code: ru, direction: ltr}, introduced_tokens: [Откуда, ты]}
          - {content_key: ru.a1.unit02.lesson02.teach.ya_iz_kanady, kind: phrase, target: {text: "Я из Канады.", language_code: ru, direction: ltr}, introduced_tokens: [Я, из, Канады, Канада]}
          - {content_key: ru.a1.unit02.lesson02.teach.ya_iz_moskvy, kind: phrase, target: {text: "Я из Москвы.", language_code: ru, direction: ltr}, introduced_tokens: [Я, из, Москвы, Москва]}
        exercises:
          - content_key: ru.a1.unit02.lesson02.exercise01.choose_formal_pronoun
            type: multiple_choice
            tested_text: "вы"
            prompt: {target_blocks: [{text: "You are speaking with your new landlord, whom you have never met.", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson02.exercise02.choose_informal_pronoun
            type: multiple_choice
            tested_text: "ты"
            prompt: {target_blocks: [{text: "You are speaking with your younger cousin.", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson02.exercise03.listen_select_shift_offer
            type: listen_select
            tested_text: "Давайте перейдём на ты"
            media_asset_key: ru.a1.audio.davayte_pereydyom_na_ty.neutral.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit02.lesson02.exercise04.match_register_use
            type: matching_pairs
            tested_text: "вы ты Можно на ты"
            prompt: {target_blocks: []}
            pairs:
              - {left: "вы", right: "a stranger, a boss, an elderly person"}
              - {left: "ты", right: "a close friend, a child, a sibling"}
              - {left: "Можно на ты?", right: "Can we switch to informal ты?"}
          - content_key: ru.a1.unit02.lesson02.exercise05.order_origin_question_formal
            type: word_order
            tested_text: "Откуда вы"
            prompt: {target_blocks: []}
            word_bank: ["вы", "Откуда"]
          - content_key: ru.a1.unit02.lesson02.exercise06.listen_order_origin_answer
            type: listen_order
            tested_text: "Я из Канады"
            media_asset_key: ru.a1.audio.kak_vas_zovut.formal.01
            prompt: {target_blocks: []}
            word_bank: ["Канады", "из", "Я"]
          - content_key: ru.a1.unit02.lesson02.exercise07.complete_origin
            type: fill_in_blank
            tested_text: "Я из Москвы"
            prompt: {target_blocks: [{text: "Откуда вы? — Я ___ Москвы.", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson02.exercise08.write_origin_sentence
            type: writing_prompt
            tested_text: "Я из"
            prompt: {target_blocks: [{text: "Write a sentence saying where you are from, using \"Я из ...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
        title: "Давайте познакомимся!"
        spine_outcome_id: universal.a1.introductions.exchange_identity
        teaching:
          - {content_key: ru.a1.unit02.lesson03.teach.davayte_poznakomimsya, kind: phrase, target: {text: "Давайте познакомимся.", language_code: ru, direction: ltr}, introduced_tokens: [Давайте, познакомимся]}
          - content_key: ru.a1.unit02.lesson03.teach.ochen_priyatno
            kind: vocabulary
            target: {text: "Очень приятно", language_code: ru, direction: ltr}
            introduced_tokens: [Очень, приятно]
            example: {text: "Меня зовут Джон. — Очень приятно.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit02.lesson03.teach.irina_greeting, kind: dialogue, target: {text: "Ирина Петровна: Здравствуйте! Давайте познакомимся. Меня зовут Ирина Петровна.", language_code: ru, direction: ltr}, introduced_tokens: [Ирина, Петровна, Здравствуйте, Давайте, познакомимся, Меня, зовут]}
          - {content_key: ru.a1.unit02.lesson03.teach.john_reply, kind: dialogue, target: {text: "Джон: Очень приятно. Меня зовут Джон.", language_code: ru, direction: ltr}, introduced_tokens: [Джон, Очень, приятно, Меня, зовут]}
          - {content_key: ru.a1.unit02.lesson03.teach.irina_question, kind: dialogue, target: {text: "Ирина Петровна: Откуда вы, Джон?", language_code: ru, direction: ltr}, introduced_tokens: [Ирина, Петровна, Откуда, вы, Джон]}
          - {content_key: ru.a1.unit02.lesson03.teach.john_answer, kind: dialogue, target: {text: "Джон: Я из Канады. А вы откуда?", language_code: ru, direction: ltr}, introduced_tokens: [Джон, Я, из, Канады, А, вы, откуда]}
          - {content_key: ru.a1.unit02.lesson03.teach.irina_answer, kind: dialogue, target: {text: "Ирина Петровна: Я из Москвы.", language_code: ru, direction: ltr}, introduced_tokens: [Ирина, Петровна, Я, из, Москвы]}
        exercises:
          - content_key: ru.a1.unit02.lesson03.exercise01.choose_meeting_reply
            type: multiple_choice
            tested_text: "Очень приятно"
            prompt: {target_blocks: [{text: "Меня зовут Джон.", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson03.exercise02.listen_select_opener
            type: listen_select
            tested_text: "Давайте познакомимся"
            media_asset_key: ru.a1.audio.davayte_poznakomimsya.neutral.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit02.lesson03.exercise03.dialogue_comprehension_origins
            type: dialogue_comprehension
            tested_text: "Джон Канада Ирина Петровна Москва"
            media_asset_key: ru.a1.audio.dialogue.office_intro.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit02.lesson03.exercise04.match_intro_lines
            type: matching_pairs
            tested_text: "Давайте познакомимся Очень приятно Откуда вы Как вас зовут Меня зовут"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Давайте познакомимся.", right: "Let's get acquainted."}
              - {left: "Очень приятно.", right: "Nice to meet you."}
              - {left: "Откуда вы?", right: "Where are you from? (formal)"}
              - {left: "Я из Канады.", right: "I am from Canada."}
              - {left: "Как вас зовут?", right: "What is your name? (formal)"}
              - {left: "Меня зовут Джон.", right: "My name is John."}
          - content_key: ru.a1.unit02.lesson03.exercise05.order_meeting_reply
            type: word_order
            tested_text: "Меня зовут Джон"
            prompt: {target_blocks: []}
            word_bank: ["зовут", "Джон", "Меня"]
          - content_key: ru.a1.unit02.lesson03.exercise06.listen_order_pleasure
            type: listen_order
            tested_text: "Очень приятно"
            media_asset_key: ru.a1.audio.ochen_priyatno.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["приятно", "Очень"]
          - content_key: ru.a1.unit02.lesson03.exercise07.reply_to_introduction
            type: dialogue_response
            tested_text: "Очень приятно Меня зовут"
            prompt: {target_blocks: [{text: "Здравствуйте! Давайте познакомимся. Меня зовут Ирина Петровна.", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson03.exercise08.complete_reciprocal_question
            type: fill_in_blank
            tested_text: "А вы откуда"
            prompt: {target_blocks: [{text: "Я из Канады. ___ вы откуда?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit02.lesson03.exercise09.write_full_introduction
            type: writing_prompt
            tested_text: "Меня зовут Очень приятно Я из"
            prompt: {target_blocks: [{text: "Write a short formal introduction: give your name, say nice to meet you, and say where you are from.", language_code: en, direction: ltr}]}
