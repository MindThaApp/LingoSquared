    Russian C1 unit 06 on idiomatic, collocational, and figurative language:
    recognizing the non-literal meaning of set expressions, describing a
    familiar situation with taught idioms, interpreting a short text that
    mixes idiom and metaphor, and rewriting literal phrasing as natural
    idiomatic Russian. From-scratch generation from established Russian idiom
    conventions; no adaptable public-domain Russian source was consulted for
    this specific topic. Sibling isolation honored: no sibling-direction
    overlay (nl-en/fa-en/prs-en/de-en) and no other-language realization was
    opened; the it C1 unit05 file named in the dispatch prompt was used ONLY
    for unit shape (schema 1.1, 6 lessons, exercise-type vocabulary), never
    for content. Character canon checked in docs/content/realizations/ru/:
    Настя is a teacher (feminine forms) and Дима is an engineer (masculine
    forms), an established pair who use informal ты with each other (see
    a2_unit26, b1_unit36, b1_unit42). This unit keeps informal register
    throughout, uses ты where a character addresses the other (e.g. "Дима, у
    тебя золотые руки"), never вы, and authors the culminating speaking and
    writing models in a gender-neutral voice (мы + plural past, or verbs whose
    past form agrees with a noun, never with я) so a learner of either gender
    reproduces them verbatim.
