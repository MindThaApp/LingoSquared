generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    Russian C1 unit 07 on mediation: relaying two complex or partially
    conflicting sources to a non-specialist audience while preserving
    attribution, agreement, disagreement, and uncertainty. From-scratch
    generation from established Russian discourse conventions; no adaptable
    public-domain Russian source exists for this specific topic, so no
    external source was consulted. Sibling isolation honored: the X->en
    mediation realization and every nl/fa/prs/de file were treated as
    non-existent and NOT opened; the it C1 unit05 file named in the dispatch
    prompt was used ONLY for unit shape (schema 1.1, 6 lessons, exercise-type
    vocabulary), never for content. Character canon checked in
    docs/content/realizations/ru/: Настя is a teacher (feminine forms) and
    Дима is an engineer (masculine forms), an established pair who use
    informal ты with each other. This unit's culminating speaking/writing
    model is a third-person mediation, deliberately gender-neutral (no
    first-person gendered past-tense or agreement forms), so a learner of
    either gender can reproduce it verbatim.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.mediation.mediate_and_synthesize_complex_sources.
    Priority checks for the reviewer: (1) confirm the culminating model covers
    every required mediation move in order -- first source's claim, second
    source's contrasting claim, the point of agreement, the point of
    disagreement, and the preserved uncertainty -- and that the speaking and
    writing exercises each require the WHOLE act; (2) confirm the model is
    third-person and gender-neutral so a learner of either gender can
    reproduce it exactly (no first-person gendered past tense); (3) confirm
    "польза ... не доказана" is natural and its short adjective agrees with
    польза (not the speaker); (4) confirm every tested token is introduced
    earlier in the unit (C1 is its own Course row, so no A1-B2 vocabulary is
    available; rich Russian morphology means each inflected surface form --
    источник/источника/источниками, задания/заданий, слово/словом/словами,
    простой/простым/простыми -- must be introduced as its own token); (5)
    confirm the matching_pairs lefts discriminate on real meaning and no two
    lefts share a gloss; (6) confirm listen/dictation exercises each use a
    dedicated asset whose text matches tested_text byte-for-byte.

course:
  realization_key: ru.c1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal register throughout, matching the established ru-lane pin
