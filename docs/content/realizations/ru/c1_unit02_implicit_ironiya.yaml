  notes: >-
    Russian C1 unit 02 on implicit meaning: irony, implication, and
    understatement, and how to read between the lines. From-scratch
    generation from established Russian discourse conventions; no adaptable
    public-domain Russian source exists for this specific C1 topic, so no
    external source was consulted. Sibling isolation honored: the X->en
    realization and every nl/fa/prs/de file were treated as non-existent and
    NOT opened; the it C1 unit05 file named in the dispatch prompt was used
    ONLY for unit shape (schema 1.1, 6 lessons, exercise-type vocabulary),
    never for content. Character canon checked in docs/content/realizations/ru/:
    Настя is a teacher (feminine forms) and Дима is an engineer (masculine
    forms), an established pair who use informal ты with each other. This unit
    keeps informal register throughout. The culminating speaking and writing
    models are deliberately gender-neutral for the learner: they describe a
    third-person colleague (он), so no gendered first-person form forces a
    learner of either gender to be graded wrong.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Targets universal.c1.inference.infer_implicit_meaning. Priority checks
    for the reviewer: (1) confirm the culminating speaking model delivers the
    whole convey_implicit_meaning act -- an ironic remark plus an explanation
    of the unstated judgement -- and the culminating writing model delivers
    the whole write_with_implication act -- a context plus an understated
    message; (2) confirm both production models are gender-neutral for the
    learner (the subject is the third-person он, never я); (3) confirm the
    ironic markers reverse their literal sense in context (Ну да, конечно =
    disbelief, not agreement); (4) confirm every tested token is introduced
    in an earlier lesson of THIS unit (C1 is its own course row); (5) confirm
    matching_pairs lefts discriminate on real meaning and no two share a
    gloss; (6) confirm listen/dictation exercises use dedicated
    single-sentence assets whose text matches tested_text byte-for-byte.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    irony/understatement models, gender neutrality, grading against allowed
    variants, MC defensibility, character canon. Fixes: lesson04.exercise04
    translate_kontekst -- added 'отчет' (е) spelling plus 'опять отчёт/отчет
    не прислал' and 'снова не прислал отчёт/отчет' variants;
    lesson06.exercise03 write_s_podtekstom -- added the 'отчет' spelling;
