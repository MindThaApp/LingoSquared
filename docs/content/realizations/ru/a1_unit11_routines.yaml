schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. The
    course's introductory clock-time material (Lesson 5, reused here
    from a1_unit05_time's "который час"/"в ... часов" pattern already
    established in this course) supplied the time-expression scaffolding
    combined with everyday reflexive-verb routine vocabulary
    (просыпаться, вставать, ложиться спать). Every example sentence,
    exercise, and dialogue here was freshly authored for a natural 2026
    everyday-use context (describing a simple daily routine), not
    imported verbatim from the source (AUTHORING_GUIDE §10). Combining
    acute-accent stress marks were stripped from every learner-facing
    string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: "Fresh-context review 2026-07-12: grammar/register/idiom verified; pooled matching_pairs to §16 aim; compiler 0 errors."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit covers describing a simple daily routine using common
    reflexive verbs and time expressions, in a neutral register suitable
    for describing one's own day to a friend or classmate.

media_assets:
  - {content_key: ru.a1.audio.ya_vstayu_v_sem.neutral.01, language: ru, text: "Я встаю в семь часов.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.kogda_vy_vstayete.neutral.01, language: ru, text: "Когда вы встаёте?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.ya_zavtrakayu_v_vosem.neutral.01, language: ru, text: "Я завтракаю в восемь часов.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.ya_lozhus_spat_v_odinnadtsat.neutral.01, language: ru, text: "Я ложусь спать в одиннадцать часов.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.chto_vy_delayete_utrom.neutral.01, language: ru, text: "Что вы делаете утром?", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.moy_den.01
    language: ru
    text: >-
      Олег: Что вы делаете утром? Мария: Я встаю в семь часов, потом
      завтракаю в восемь. Олег: А когда вы работаете? Мария: Я работаю с
      девяти до пяти. Вечером я ужинаю и ложусь спать в одиннадцать
      часов. Олег: Понятно, спасибо.
    voice_hint: two_adults_neutral
    status: pending_generation

units:
  - content_key: ru.a1.unit11.routines
    title: "Мой распорядок дня"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.routines.describe_daily_routine
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
        title: "Вставать, завтракать"
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - {content_key: ru.a1.unit11.lesson01.teach.vstayu, kind: vocabulary, target: {text: "встаю", language_code: ru, direction: ltr}, introduced_tokens: [встаю, встаёте, Я, я, в, семь, часов], example: {text: "Я встаю в семь часов.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit11.lesson01.teach.zavtrakayu, kind: vocabulary, target: {text: "завтракаю", language_code: ru, direction: ltr}, introduced_tokens: [завтракаю, восемь, и], example: {text: "Я завтракаю в восемь часов.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit11.lesson01.teach.kogda, kind: phrase, target: {text: "Когда вы встаёте?", language_code: ru, direction: ltr}, introduced_tokens: [Когда, когда, Вы, вы]}
        exercises:
          - content_key: ru.a1.unit11.lesson01.exercise01.recognize_vstayu
            type: multiple_choice
            tested_text: "встаю"
            prompt: {target_blocks: [{text: "I get up", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson01.exercise02.recognize_zavtrakayu
            type: multiple_choice
            tested_text: "завтракаю"
            prompt: {target_blocks: [{text: "I have breakfast", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson01.exercise03.listen_select_kogda_vstayete
            type: listen_select
            tested_text: "Когда вы встаёте"
            media_asset_key: ru.a1.audio.kogda_vy_vstayete.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson01.exercise04.match_morning_words
            type: matching_pairs
            tested_text: "встаю завтракаю когда часов я в семь вы встаёте"
            prompt: {target_blocks: []}
            pairs:
              - {left: "встаю", right: "I get up"}
              - {left: "завтракаю", right: "I have breakfast"}
              - {left: "когда", right: "when"}
              - {left: "часов", right: "o'clock"}
              - {left: "Я встаю в семь часов.", right: "I get up at seven o'clock."}
              - {left: "Когда вы встаёте?", right: "When do you get up?"}
          - content_key: ru.a1.unit11.lesson01.exercise05.order_ya_vstayu_v_sem
            type: word_order
            tested_text: "Я встаю в семь часов"
            prompt: {target_blocks: []}
            word_bank: ["встаю", "Я", "в", "семь", "часов"]
          - content_key: ru.a1.unit11.lesson01.exercise06.listen_order_ya_vstayu
            type: listen_order
            tested_text: "Я встаю в семь часов"
            media_asset_key: ru.a1.audio.ya_vstayu_v_sem.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["в", "Я", "встаю", "семь", "часов"]
          - content_key: ru.a1.unit11.lesson01.exercise07.complete_ya_zavtrakayu
            type: fill_in_blank
            tested_text: "Я завтракаю в восемь часов"
            prompt: {target_blocks: [{text: "Я ___ в восемь часов. (have breakfast)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson01.exercise08.write_morning_routine
            type: writing_prompt
            tested_text: "Я встаю в семь часов и завтракаю в восемь"
            prompt: {target_blocks: [{text: "Write a sentence about when you get up and have breakfast.", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat.exercise09.dictation_kogda_vy_vstayete_neutral, type: dictation, tested_text: "Когда вы встаёте", media_asset_key: ru.a1.audio.kogda_vy_vstayete.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
        title: "Работать, ужинать"
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - content_key: ru.a1.unit11.lesson02.teach.rabotayu
            kind: vocabulary
            target: {text: "работаю", language_code: ru, direction: ltr}
            introduced_tokens: [работаю, с, до, девяти, пяти]
            example: {text: "Я работаю с девяти до пяти.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit11.lesson02.teach.uzhinayu
            kind: vocabulary
            target: {text: "ужинаю", language_code: ru, direction: ltr}
            introduced_tokens: [ужинаю, вечером]
            example: {text: "Вечером я ужинаю.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit11.lesson02.teach.lozhus_spat
            kind: vocabulary
            target: {text: "ложусь спать", language_code: ru, direction: ltr}
            introduced_tokens: [ложусь, спать, одиннадцать]
            example: {text: "Я ложусь спать в одиннадцать часов.", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit11.lesson02.exercise01.recognize_rabotayu
            type: multiple_choice
            tested_text: "работаю"
            prompt: {target_blocks: [{text: "I work", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson02.exercise02.recognize_uzhinayu
            type: multiple_choice
            tested_text: "ужинаю"
            prompt: {target_blocks: [{text: "I have dinner", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson02.exercise03.listen_select_ya_lozhus_spat
            type: listen_select
            tested_text: "Я ложусь спать в одиннадцать"
            media_asset_key: ru.a1.audio.ya_lozhus_spat_v_odinnadtsat.neutral.01
            prompt: {target_blocks: [{text: "What is being described?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson02.exercise04.match_evening_words
            type: matching_pairs
            tested_text: "работаю ужинаю ложусь спать вечером я с девяти до пяти в одиннадцать часов"
            prompt: {target_blocks: []}
            pairs:
              - {left: "работаю", right: "I work"}
              - {left: "ужинаю", right: "I have dinner"}
              - {left: "ложусь спать", right: "I go to bed"}
              - {left: "вечером", right: "in the evening"}
              - {left: "Я работаю с девяти до пяти.", right: "I work from nine to five."}
              - {left: "Я ложусь спать в одиннадцать часов.", right: "I go to bed at eleven o'clock."}
          - content_key: ru.a1.unit11.lesson02.exercise05.order_ya_rabotayu_s_devyati
            type: word_order
            tested_text: "Я работаю с девяти до пяти"
            prompt: {target_blocks: []}
            word_bank: ["работаю", "Я", "с", "девяти", "до", "пяти"]
          - content_key: ru.a1.unit11.lesson02.exercise06.listen_order_lozhus_spat
            type: listen_order
            tested_text: "Я ложусь спать в одиннадцать часов"
            media_asset_key: ru.a1.audio.ya_lozhus_spat_v_odinnadtsat.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["спать", "Я", "ложусь", "в", "одиннадцать", "часов"]
          - content_key: ru.a1.unit11.lesson02.exercise07.complete_vecherom_ya_uzhinayu
            type: fill_in_blank
            tested_text: "Вечером я ужинаю"
            prompt: {target_blocks: [{text: "___ я ужинаю. (in the evening)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson02.exercise08.write_evening_routine
            type: writing_prompt
            tested_text: "Вечером я ужинаю и ложусь спать в одиннадцать часов"
            prompt: {target_blocks: [{text: "Write a sentence about what you do in the evening and when you go to bed.", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit11.lesson03.moy_den
        title: "Диалог: мой день"
        spine_outcome_id: universal.a1.routines.describe_daily_routine
        teaching:
          - {content_key: ru.a1.unit11.lesson03.teach.oleg_chto_delayete, kind: dialogue, target: {text: "Олег: Что вы делаете утром?", language_code: ru, direction: ltr}, introduced_tokens: [Олег, Что, что, делаете, утром]}
          - {content_key: ru.a1.unit11.lesson03.teach.mariya_vstayu_zavtrakayu, kind: dialogue, target: {text: "Мария: Я встаю в семь часов, потом завтракаю в восемь.", language_code: ru, direction: ltr}, introduced_tokens: [Мария, потом]}
          - {content_key: ru.a1.unit11.lesson03.teach.oleg_kogda_rabotayete, kind: dialogue, target: {text: "Олег: А когда вы работаете?", language_code: ru, direction: ltr}, introduced_tokens: [А, а, работаете]}
          - {content_key: ru.a1.unit11.lesson03.teach.mariya_rabotayu_uzhinayu, kind: dialogue, target: {text: "Мария: Я работаю с девяти до пяти. Вечером я ужинаю и ложусь спать в одиннадцать часов.", language_code: ru, direction: ltr}, introduced_tokens: []}
          - {content_key: ru.a1.unit11.lesson03.teach.oleg_ponyatno, kind: dialogue, target: {text: "Олег: Понятно, спасибо.", language_code: ru, direction: ltr}, introduced_tokens: [Понятно]}
        exercises:
          - content_key: ru.a1.unit11.lesson03.exercise01.choose_ask_morning_routine
            type: multiple_choice
            tested_text: "Что вы делаете утром"
            prompt: {target_blocks: [{text: "You want to ask someone what they do in the morning. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson03.exercise02.listen_select_zavtrakayu_v_vosem
            type: listen_select
            tested_text: "Я завтракаю в восемь часов"
            media_asset_key: ru.a1.audio.ya_zavtrakayu_v_vosem.neutral.01
            prompt: {target_blocks: [{text: "What is being described?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson03.exercise03.dialogue_comprehension_moy_den
            type: dialogue_comprehension
            tested_text: "семь восемь девяти пяти одиннадцать"
            media_asset_key: ru.a1.audio.dialogue.moy_den.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit11.lesson03.exercise04.match_daily_routine_phrases
            type: matching_pairs
            tested_text: "что делаете утром работаю с до вечером ложусь спать"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Что вы делаете утром?", right: "What do you do in the morning?"}
              - {left: "Я встаю в семь часов.", right: "I get up at seven o'clock."}
              - {left: "Я работаю с девяти до пяти.", right: "I work from nine to five."}
              - {left: "Вечером я ужинаю.", right: "In the evening I have dinner."}
              - {left: "Я ложусь спать в одиннадцать часов.", right: "I go to bed at eleven o'clock."}
              - {left: "Понятно, спасибо.", right: "I understand, thank you."}
          - content_key: ru.a1.unit11.lesson03.exercise05.order_ya_uzhinayu_i_lozhus
            type: word_order
            tested_text: "Я ужинаю и ложусь спать"
            prompt: {target_blocks: []}
            word_bank: ["ужинаю", "Я", "и", "ложусь", "спать"]
          - content_key: ru.a1.unit11.lesson03.exercise06.reply_chto_vy_delayete_utrom
            type: dialogue_response
            tested_text: "Я встаю в семь часов и завтракаю в восемь"
            prompt: {target_blocks: [{text: "Что вы делаете утром?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson03.exercise07.complete_kogda_vy_rabotayete
            type: fill_in_blank
            tested_text: "Когда вы работаете"
            prompt: {target_blocks: [{text: "___ вы работаете? (when)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit11.lesson03.exercise08.write_full_daily_routine
            type: writing_prompt
            tested_text: "Я встаю в семь часов работаю с девяти до пяти и ложусь спать в одиннадцать часов"
            prompt: {target_blocks: [{text: "Write several connected sentences describing your daily routine: when you get up, work, and go to bed.", language_code: en, direction: ltr}]}
