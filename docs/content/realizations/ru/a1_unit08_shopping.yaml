schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. Lesson 7
    ("Мы идём в магазин! / В магазине") supplied the shopping vocabulary
    and price-asking phrases used here: магазин, сколько, стоит, рубль,
    килограмм, полкило, штука, "Дайте, пожалуйста, ...", "Сколько
    стоит...?", and the produce vocabulary (помидоры, огурцы, картофель,
    капуста, яблоки, апельсины) with the "У вас есть...?"/"Сколько стоит
    кило...?" market dialogue pattern. Every example sentence, exercise,
    and dialogue here was freshly authored for a natural 2026
    everyday-use context (buying groceries and asking prices/quantities),
    not imported verbatim from the source (AUTHORING_GUIDE §10).
    Combining acute-accent stress marks were stripped from every
    learner-facing string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: "Fresh-context full review (new-language lane, no sampling), 2026-07-12. Case agreement correct (accusative bors/salat = nom; genitive after skolko/kilo/numerals: sto rubley, kilo yablok, pyat shtuk); no stress diacritics; e/yo consistent (idyom has yo); polite vy register throughout. Fixed one unrealistic price in the unit08 market dialogue (6000->200 rubles/kg apples). All listen_* audio contains tested sentence."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit is shopping-focused; a polite register is used between customer
    and shopkeeper (вы-forms, пожалуйста).

media_assets:
  - {content_key: ru.a1.audio.skolko_stoit_khleb.neutral.01, language: ru, text: "Сколько стоит хлеб?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.khleb_stoit_sto_rubley.neutral.01, language: ru, text: "Хлеб стоит сто рублей.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.dayte_kilogramm_pozhaluysta.neutral.01, language: ru, text: "Дайте килограмм, пожалуйста.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.dayte_pyat_shtuk_pozhaluysta.neutral.01, language: ru, text: "Дайте пять штук, пожалуйста.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.skolko_stoit_kilo_yablok.neutral.01, language: ru, text: "Сколько стоит кило яблок?", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.magazin_pomidory.01
    language: ru
    text: >-
      Покупатель: У вас есть помидоры? Продавец: Да, есть. Покупатель:
      Сколько стоит кило яблок? Продавец: Двести рублей. Покупатель:
      Дайте килограмм яблок, пожалуйста. Продавец: Хорошо, пожалуйста.
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit08.shopping
    title: "Покупки"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.shopping.ask_prices_quantities
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit08.lesson01.skolko_stoit
        title: "Сколько стоит?"
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - {content_key: ru.a1.unit08.lesson01.teach.magazin, kind: vocabulary, target: {text: "магазин", language_code: ru, direction: ltr}, introduced_tokens: [магазин], example: {text: "Мы идём в магазин.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit08.lesson01.teach.skolko, kind: vocabulary, target: {text: "сколько", language_code: ru, direction: ltr}, introduced_tokens: [сколько], example: {text: "Сколько стоит хлеб?", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit08.lesson01.teach.stoit, kind: vocabulary, target: {text: "стоит", language_code: ru, direction: ltr}, introduced_tokens: [стоит], example: {text: "Хлеб стоит сто рублей.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit08.lesson01.teach.rubl, kind: vocabulary, target: {text: "рубль", language_code: ru, direction: ltr}, introduced_tokens: [рубль, рублей, сто], example: {text: "Хлеб стоит сто рублей.", language_code: ru, direction: ltr}}
          - content_key: ru.a1.unit08.lesson01.teach.khleb_moloko
            kind: vocabulary
            target: {text: "хлеб, молоко", language_code: ru, direction: ltr}
            introduced_tokens: [хлеб, молоко]
            example:
              - {text: "Сколько стоит хлеб?", language_code: ru, direction: ltr}
              - {text: "Сколько стоит молоко?", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit08.lesson01.exercise01.recognize_magazin
            type: multiple_choice
            tested_text: "магазин"
            prompt: {target_blocks: [{text: "store", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson01.exercise02.recognize_skolko
            type: multiple_choice
            tested_text: "сколько"
            prompt: {target_blocks: [{text: "how much", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson01.exercise03.listen_select_skolko_stoit_khleb
            type: listen_select
            tested_text: "Сколько стоит хлеб"
            media_asset_key: ru.a1.audio.skolko_stoit_khleb.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson01.exercise04.match_price_words
            type: matching_pairs
            tested_text: "магазин сколько стоит рубль"
            prompt: {target_blocks: []}
            pairs:
              - {left: "магазин", right: "store"}
              - {left: "сколько", right: "how much"}
              - {left: "стоит", right: "costs"}
              - {left: "рубль", right: "ruble"}
          - content_key: ru.a1.unit08.lesson01.exercise05.order_skolko_stoit_khleb
            type: word_order
            tested_text: "Сколько стоит хлеб"
            prompt: {target_blocks: []}
            word_bank: ["стоит", "Сколько", "хлеб"]
          - content_key: ru.a1.unit08.lesson01.exercise06.listen_order_khleb_sto_rubley
            type: listen_order
            tested_text: "Хлеб стоит сто рублей"
            media_asset_key: ru.a1.audio.khleb_stoit_sto_rubley.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["рублей", "Хлеб", "сто", "стоит"]
          - content_key: ru.a1.unit08.lesson01.exercise07.complete_skolko_stoit_moloko
            type: fill_in_blank
            tested_text: "Сколько стоит молоко"
            prompt: {target_blocks: [{text: "___ стоит молоко? (How much)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson01.exercise08.write_ask_price_bread
            type: writing_prompt
            tested_text: "Сколько стоит хлеб"
            prompt: {target_blocks: [{text: "Write a question asking how much the bread costs, using \"Сколько стоит...?\".", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit08.lesson01.skolko_stoit.exercise09.dictation_skolko_stoit_khleb_neutral, type: dictation, tested_text: "Сколько стоит хлеб", media_asset_key: ru.a1.audio.skolko_stoit_khleb.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit08.lesson02.kolichestvo
        title: "Дайте, пожалуйста..."
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - {content_key: ru.a1.unit08.lesson02.teach.dayte_pozhaluysta, kind: phrase, target: {text: "Дайте, пожалуйста, ...", language_code: ru, direction: ltr}, introduced_tokens: [Дайте, пожалуйста]}
          - {content_key: ru.a1.unit08.lesson02.teach.kilogramm, kind: vocabulary, target: {text: "килограмм", language_code: ru, direction: ltr}, introduced_tokens: [килограмм], example: {text: "Дайте килограмм, пожалуйста.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit08.lesson02.teach.polkilo, kind: vocabulary, target: {text: "полкило", language_code: ru, direction: ltr}, introduced_tokens: [полкило], example: {text: "Дайте полкило, пожалуйста.", language_code: ru, direction: ltr}}
          - content_key: ru.a1.unit08.lesson02.teach.shtuka
            kind: vocabulary
            target: {text: "штука", language_code: ru, direction: ltr}
            introduced_tokens: [штука, штуку, штук, пять]
            example:
              - {text: "Дайте одну штуку, пожалуйста.", language_code: ru, direction: ltr}
              - {text: "Дайте пять штук, пожалуйста.", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit08.lesson02.exercise01.recognize_kilogramm
            type: multiple_choice
            tested_text: "килограмм"
            prompt: {target_blocks: [{text: "kilogram", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson02.exercise02.recognize_shtuka
            type: multiple_choice
            tested_text: "штука"
            prompt: {target_blocks: [{text: "piece (item)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson02.exercise03.listen_select_dayte_kilogramm
            type: listen_select
            tested_text: "Дайте килограмм пожалуйста"
            media_asset_key: ru.a1.audio.dayte_kilogramm_pozhaluysta.neutral.01
            prompt: {target_blocks: [{text: "What quantity is being requested?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson02.exercise04.match_quantity_words
            type: matching_pairs
            tested_text: "килограмм полкило штука дайте"
            prompt: {target_blocks: []}
            pairs:
              - {left: "килограмм", right: "kilogram"}
              - {left: "полкило", right: "half a kilo"}
              - {left: "штука", right: "piece"}
              - {left: "дайте", right: "give me"}
          - content_key: ru.a1.unit08.lesson02.exercise05.order_dayte_kilogramm
            type: word_order
            tested_text: "Дайте килограмм пожалуйста"
            prompt: {target_blocks: []}
            word_bank: ["килограмм", "Дайте", "пожалуйста"]
          - content_key: ru.a1.unit08.lesson02.exercise06.listen_order_pyat_shtuk
            type: listen_order
            tested_text: "Дайте пять штук пожалуйста"
            media_asset_key: ru.a1.audio.dayte_pyat_shtuk_pozhaluysta.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["штук", "Дайте", "пожалуйста", "пять"]
          - content_key: ru.a1.unit08.lesson02.exercise07.complete_dayte_kilogramm
            type: fill_in_blank
            tested_text: "Дайте пожалуйста килограмм"
            prompt: {target_blocks: [{text: "Дайте, пожалуйста, ___. (a kilogram)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson02.exercise08.write_ask_half_kilo
            type: writing_prompt
            tested_text: "Дайте полкило пожалуйста"
            prompt: {target_blocks: [{text: "Write a request for half a kilo of something, using \"Дайте, пожалуйста, ...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit08.lesson03.na_rynke
        title: "На рынке"
        spine_outcome_id: universal.a1.shopping.ask_prices_quantities
        teaching:
          - content_key: ru.a1.unit08.lesson03.teach.pomidory_ogurtsy
            kind: vocabulary
            target: {text: "помидоры, огурцы", language_code: ru, direction: ltr}
            introduced_tokens: [помидоры, огурцы]
            example:
              - {text: "У вас есть помидоры?", language_code: ru, direction: ltr}
              - {text: "У вас есть огурцы?", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit08.lesson03.teach.kartofel_kapusta
            kind: vocabulary
            target: {text: "картофель, капуста", language_code: ru, direction: ltr}
            introduced_tokens: [картофель, капуста]
            example:
              - {text: "У вас есть картофель?", language_code: ru, direction: ltr}
              - {text: "У вас есть капуста?", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit08.lesson03.teach.yabloki_apelsiny
            kind: vocabulary
            target: {text: "яблоки, апельсины", language_code: ru, direction: ltr}
            introduced_tokens: [яблоки, яблок, апельсины, апельсинов, помидоров, кило]
            example:
              - {text: "Сколько стоит кило яблок?", language_code: ru, direction: ltr}
              - {text: "Сколько стоит кило апельсинов?", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit08.lesson03.teach.u_vas_est, kind: phrase, target: {text: "У вас есть ...?", language_code: ru, direction: ltr}, introduced_tokens: [У, у, вас, есть]}
          - {content_key: ru.a1.unit08.lesson03.teach.da_u_menya_est, kind: phrase, target: {text: "Да, у меня есть ...", language_code: ru, direction: ltr}, introduced_tokens: [Да, да, меня]}
        exercises:
          - content_key: ru.a1.unit08.lesson03.exercise01.choose_ask_have_tomatoes
            type: multiple_choice
            tested_text: "У вас есть помидоры"
            prompt: {target_blocks: [{text: "You want to ask if the shop has any tomatoes. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson03.exercise02.listen_select_kilo_yablok
            type: listen_select
            tested_text: "Сколько стоит кило яблок"
            media_asset_key: ru.a1.audio.skolko_stoit_kilo_yablok.neutral.01
            prompt: {target_blocks: [{text: "What is the shopper asking the price of?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson03.exercise03.dialogue_comprehension_magazin_pomidory
            type: dialogue_comprehension
            tested_text: "помидоры яблоки килограмм"
            media_asset_key: ru.a1.audio.dialogue.magazin_pomidory.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit08.lesson03.exercise04.match_produce_words
            type: matching_pairs
            tested_text: "помидоры огурцы картофель капуста яблоки апельсины"
            prompt: {target_blocks: []}
            pairs:
              - {left: "помидоры", right: "tomatoes"}
              - {left: "огурцы", right: "cucumbers"}
              - {left: "картофель", right: "potatoes"}
              - {left: "капуста", right: "cabbage"}
              - {left: "яблоки", right: "apples"}
              - {left: "апельсины", right: "oranges"}
          - content_key: ru.a1.unit08.lesson03.exercise05.order_u_vas_est_pomidory
            type: word_order
            tested_text: "У вас есть помидоры"
            prompt: {target_blocks: []}
            word_bank: ["вас", "У", "есть", "помидоры"]
          - content_key: ru.a1.unit08.lesson03.exercise06.reply_have_tomatoes
            type: dialogue_response
            tested_text: "Да у меня есть помидоры"
            prompt: {target_blocks: [{text: "У вас есть помидоры?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson03.exercise07.complete_skolko_stoit_kilo
            type: fill_in_blank
            tested_text: "Сколько стоит кило яблок"
            prompt: {target_blocks: [{text: "Сколько стоит ___ яблок? (a kilo)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit08.lesson03.exercise08.write_ask_produce_price
            type: writing_prompt
            tested_text: "У вас есть помидоры Сколько стоит кило помидоров"
            prompt: {target_blocks: [{text: "Write two sentences: ask if the shop has tomatoes, then ask how much a kilo of tomatoes costs.", language_code: en, direction: ltr}]}
