schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. The
    course's past-tense paradigm table ("я работал / я работала / мы
    работали") and the attested past-tense sentences "Дети ходили в
    кино" ("The children went to the movies") and "Мы ездили туда на
    машине" ("We went there by car") supplied the gendered-past-tense
    and "ходил/ходила в кино" patterns used throughout this unit. Every
    example sentence, exercise, and dialogue here was freshly authored
    for a natural 2026 everyday-use context (recounting what one did
    yesterday), not imported verbatim from the source (AUTHORING_GUIDE
    §10). Combining acute-accent stress marks were stripped from every
    learner-facing string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: none
  notes: "Fresh-context review 2026-07-12: gendered past tense (byl/byla, hodil/hodila, smotrel) agrees with subject; no stress diacritics; glosses accurate; compiler 0 errors (15-unit en-ru validate). No defects."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit covers giving a short account of a recent completed event
    (what you did yesterday), using an informal ты register between
    friends, with correct masculine/feminine past-tense verb agreement.

media_assets:
  - {content_key: ru.a1.audio.vchera_ya_byl_doma.neutral.01, language: ru, text: "Вчера я был дома.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.vchera_ya_hodil_v_kino.neutral.01, language: ru, text: "Вчера я ходил в кино.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.chto_ty_delal_vchera.neutral.01, language: ru, text: "Что ты делал вчера?", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.chto_ty_delal.01
    language: ru
    text: >-
      Настя: Что ты делал вчера? Дима: Я ходил в кино. Смотрел хороший
      фильм. А ты? Настя: Я была дома. Отдыхала.
    voice_hint: two_adults_neutral
    status: pending_generation

units:
  - content_key: ru.a1.unit13.past_events
    title: "Что ты делал вчера?"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.past_events.describe_recent_event
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit13.lesson01.vchera_byl_doma
        title: "Вчера я был дома"
        spine_outcome_id: universal.a1.past_events.describe_recent_event
        teaching:
          - {content_key: ru.a1.unit13.lesson01.teach.vchera_byl, kind: phrase, target: {text: "Вчера я был дома.", language_code: ru, direction: ltr}, introduced_tokens: [Вчера, я, был, дома]}
          - {content_key: ru.a1.unit13.lesson01.teach.byla, kind: vocabulary, target: {text: "была", language_code: ru, direction: ltr}, introduced_tokens: [была, она], example: {text: "Вчера она была дома.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit13.lesson01.teach.vecherom, kind: vocabulary, target: {text: "вечером", language_code: ru, direction: ltr}, introduced_tokens: [вечером], example: {text: "Вчера вечером я был дома.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit13.lesson01.exercise01.recognize_vchera
            type: multiple_choice
            tested_text: "вчера"
            prompt: {target_blocks: [{text: "yesterday", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson01.exercise02.recognize_byl
            type: multiple_choice
            tested_text: "был"
            prompt: {target_blocks: [{text: "was (said by a man)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson01.exercise03.listen_select_vchera_byl_doma
            type: listen_select
            tested_text: "Вчера я был дома"
            media_asset_key: ru.a1.audio.vchera_ya_byl_doma.neutral.01
            prompt: {target_blocks: [{text: "What happened yesterday?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson01.exercise04.match_past_words
            type: matching_pairs
            tested_text: "вчера был была дома вечером она"
            prompt: {target_blocks: []}
            pairs:
              - {left: "вчера", right: "yesterday"}
              - {left: "был", right: "was (a man)"}
              - {left: "была", right: "was (a woman)"}
              - {left: "дома", right: "at home"}
              - {left: "вечером", right: "in the evening"}
              - {left: "Вчера я был дома.", right: "Yesterday I was home."}
          - content_key: ru.a1.unit13.lesson01.exercise05.order_vchera_byl_doma
            type: word_order
            tested_text: "Вчера я был дома"
            prompt: {target_blocks: []}
            word_bank: ["был", "Вчера", "я", "дома"]
          - content_key: ru.a1.unit13.lesson01.exercise06.listen_order_vchera_vecherom
            type: listen_order
            tested_text: "Вчера я был дома"
            media_asset_key: ru.a1.audio.vchera_ya_byl_doma.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["я", "Вчера", "был", "дома"]
          - content_key: ru.a1.unit13.lesson01.exercise07.complete_byl_doma
            type: fill_in_blank
            tested_text: "Вчера я был дома"
            prompt: {target_blocks: [{text: "Вчера я ___ дома. (was, said by a man)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson01.exercise08.write_where_you_were
            type: writing_prompt
            tested_text: "Вчера я был дома"
            prompt: {target_blocks: [{text: "Write a sentence saying you were home yesterday, using \"был\" or \"была\".", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit13.lesson01.vchera_byl_doma.exercise09.dictation_vchera_ya_byl_doma_neutral, type: dictation, tested_text: "Вчера я был дома", media_asset_key: ru.a1.audio.vchera_ya_byl_doma.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit13.lesson02.hodil_v_kino
        title: "Я ходил в кино"
        spine_outcome_id: universal.a1.past_events.describe_recent_event
        teaching:
          - {content_key: ru.a1.unit13.lesson02.teach.hodil_v_kino, kind: phrase, target: {text: "Вчера я ходил в кино.", language_code: ru, direction: ltr}, introduced_tokens: [ходил, в, кино]}
          - {content_key: ru.a1.unit13.lesson02.teach.hodila, kind: vocabulary, target: {text: "ходила", language_code: ru, direction: ltr}, introduced_tokens: [ходила], example: {text: "Вчера она ходила в кино.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit13.lesson02.teach.smotrel_film, kind: vocabulary, target: {text: "смотрел фильм", language_code: ru, direction: ltr}, introduced_tokens: [смотрел, смотрела, фильм], example: {text: "Я смотрел фильм.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit13.lesson02.exercise01.recognize_hodil
            type: multiple_choice
            tested_text: "ходил"
            prompt: {target_blocks: [{text: "went (on foot, said by a man)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson02.exercise02.recognize_film
            type: multiple_choice
            tested_text: "фильм"
            prompt: {target_blocks: [{text: "film / movie", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson02.exercise03.listen_select_hodil_v_kino
            type: listen_select
            tested_text: "Вчера я ходил в кино"
            media_asset_key: ru.a1.audio.vchera_ya_hodil_v_kino.neutral.01
            prompt: {target_blocks: [{text: "What did the speaker do?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson02.exercise04.match_activity_words
            type: matching_pairs
            tested_text: "вчера был была ходил ходила смотрел фильм кино дома"
            prompt: {target_blocks: []}
            pairs:
              - {left: "ходил", right: "went (a man)"}
              - {left: "ходила", right: "went (a woman)"}
              - {left: "смотрел фильм", right: "watched a film"}
              - {left: "кино", right: "the movies"}
              - {left: "был", right: "was (a man)"}
              - {left: "была", right: "was (a woman)"}
              - {left: "дома", right: "at home"}
              - {left: "Вчера я ходил в кино.", right: "Yesterday I went to the movies."}
          - content_key: ru.a1.unit13.lesson02.exercise05.order_hodil_v_kino
            type: word_order
            tested_text: "Вчера я ходил в кино"
            prompt: {target_blocks: []}
            word_bank: ["ходил", "Вчера", "я", "в", "кино"]
          - content_key: ru.a1.unit13.lesson02.exercise06.listen_order_smotrel_film
            type: listen_order
            tested_text: "Вчера я ходил в кино"
            media_asset_key: ru.a1.audio.vchera_ya_hodil_v_kino.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["я", "Вчера", "в", "ходил", "кино"]
          - content_key: ru.a1.unit13.lesson02.exercise07.complete_hodil_v_kino
            type: fill_in_blank
            tested_text: "Вчера я ходил в кино"
            prompt: {target_blocks: [{text: "Вчера я ___ в кино. (went, said by a man)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson02.exercise08.write_what_you_did
            type: writing_prompt
            tested_text: "Вчера я ходил в кино"
            prompt: {target_blocks: [{text: "Write a sentence about going to the movies yesterday, using \"ходил\" or \"ходила\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit13.lesson03.chto_ty_delal
        title: "Диалог: что ты делал вчера?"
        spine_outcome_id: universal.a1.past_events.describe_recent_event
        teaching:
          - {content_key: ru.a1.unit13.lesson03.teach.nastya_chto_ty_delal, kind: dialogue, target: {text: "Настя: Что ты делал вчера?", language_code: ru, direction: ltr}, introduced_tokens: [Настя, Что, ты, делал]}
          - {content_key: ru.a1.unit13.lesson03.teach.dima_hodil_smotrel, kind: dialogue, target: {text: "Дима: Я ходил в кино. Смотрел хороший фильм. А ты?", language_code: ru, direction: ltr}, introduced_tokens: [Дима, хороший, А]}
          - {content_key: ru.a1.unit13.lesson03.teach.nastya_byla_otdyhala, kind: dialogue, target: {text: "Настя: Я была дома. Отдыхала.", language_code: ru, direction: ltr}, introduced_tokens: [Отдыхала, отдыхала]}
        exercises:
          - content_key: ru.a1.unit13.lesson03.exercise01.choose_ask_what_you_did
            type: multiple_choice
            tested_text: "Что ты делал вчера"
            prompt: {target_blocks: [{text: "You want to ask a friend what he did yesterday. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson03.exercise02.listen_select_hodil_smotrel
            type: listen_select
            tested_text: "Что ты делал вчера"
            media_asset_key: ru.a1.audio.chto_ty_delal_vchera.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson03.exercise03.dialogue_comprehension_chto_ty_delal
            type: dialogue_comprehension
            tested_text: "делал ходил фильм была отдыхала"
            media_asset_key: ru.a1.audio.dialogue.chto_ty_delal.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit13.lesson03.exercise04.match_dialogue_lines
            type: matching_pairs
            tested_text: "что делал ходил фильм была отдыхала хороший"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Что ты делал вчера?", right: "What did you do yesterday?"}
              - {left: "Я ходил в кино.", right: "I went to the movies."}
              - {left: "Смотрел хороший фильм.", right: "I watched a good film."}
              - {left: "Я была дома.", right: "I was home."}
              - {left: "Отдыхала.", right: "I rested (a woman)."}
              - {left: "А ты?", right: "And you?"}
          - content_key: ru.a1.unit13.lesson03.exercise05.order_smotrel_horoshiy_film
            type: word_order
            tested_text: "Смотрел хороший фильм"
            prompt: {target_blocks: []}
            word_bank: ["хороший", "Смотрел", "фильм"]
          - content_key: ru.a1.unit13.lesson03.exercise06.reply_chto_ty_delal_vchera
            type: dialogue_response
            tested_text: "Я ходил в кино"
            prompt: {target_blocks: [{text: "Что ты делал вчера?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson03.exercise07.complete_ya_byla_doma
            type: fill_in_blank
            tested_text: "Я была дома"
            prompt: {target_blocks: [{text: "Я ___ дома. (was, said by a woman)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit13.lesson03.exercise08.write_recent_event
            type: writing_prompt
            tested_text: "Вчера я ходил в кино"
            prompt: {target_blocks: [{text: "Write two or three sentences about what you did yesterday.", language_code: en, direction: ltr}]}
