            example: {text: "В этом вопросе они согласны.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson03.teach.v_voprose
            kind: phrase
            target: {text: "в вопросе ...", language_code: ru, direction: ltr}
            introduced_tokens: []
            example: {text: "Они сходятся в вопросе кофе.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson03.teach.govoryat
            kind: vocabulary
            target: {text: "говорят", language_code: ru, direction: ltr}
            introduced_tokens: [говорят, говорить, одинаково]
            example: {text: "Оба одинаково говорят, что кофе вкусный.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson03.teach.to_zhe_samoe
            kind: vocabulary
            target: {text: "то же самое", language_code: ru, direction: ltr}
            introduced_tokens: [же, самое]
