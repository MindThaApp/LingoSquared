    language: ru
    text: >-
      Настя: Мне нравится «Зёрна». Кофе там вкусный, и это недорого. Дима:
      Кофе вкусный, это правда. Но, по-моему, там слишком дорого. Одна
      чашка стоит триста рублей. Настя: И всё же, по-моему, это недорого.
      Дима: Значит, мы сходимся во мнении о кофе, но расходимся во мнении
      о цене.
    voice_hint: two_adults_informal
    status: pending_generation

units:
  - content_key: ru.b2.unit08.sintez
    title: "Синтез"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    planned_lesson_count: 6

    lessons:
      - content_key: ru.b2.unit08.lesson01.kto_chto_govorit
        title: "Кто что говорит?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: ru.b2.unit08.lesson01.teach.zyorna
            kind: phrase
            target: {text: "«Зёрна» — новая кофейня.", language_code: ru, direction: ltr}
            introduced_tokens: [Зёрна, новая, кофейня]
          - content_key: ru.b2.unit08.lesson01.teach.recenzija
            kind: vocabulary
            target: {text: "рецензия", language_code: ru, direction: ltr}
            introduced_tokens: [рецензия, рецензии, эта, какая]
            example: {text: "Какая это рецензия?", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson01.teach.istochnik
            kind: vocabulary
            target: {text: "источник", language_code: ru, direction: ltr}
            introduced_tokens: [источник, источники]
            example: {text: "Рецензия — это источник.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson01.teach.po_slovam
            kind: vocabulary
            target: {text: "по словам", language_code: ru, direction: ltr}
            introduced_tokens: [по, словам, Ольги, кофе, вкусный, там]
            example: {text: "По словам Ольги, кофе там вкусный.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson01.teach.cena
            kind: vocabulary
            target: {text: "цена", language_code: ru, direction: ltr}
            introduced_tokens: [цена, высокая]
            example: {text: "Цена высокая.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson01.teach.utverzhdaet
            kind: vocabulary
            target: {text: "утверждает", language_code: ru, direction: ltr}
            introduced_tokens: [Ольга, утверждает, утверждать, недорого]
            example: {text: "Ольга утверждает, что это недорого.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson01.teach.schitaet
            kind: vocabulary
            target: {text: "считает", language_code: ru, direction: ltr}
            introduced_tokens: [Павел, считает, дорого]
            example: {text: "Павел считает, что это дорого.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson01.teach.sudya_po
            kind: phrase
            target: {text: "судя по ..., можно сказать, что", language_code: ru, direction: ltr}
            introduced_tokens: [судя, можно, сказать]
            example: {text: "Судя по рецензии, можно сказать, что кофе хороший.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson01.teach.grammar_atributirovanie
            kind: grammar_note
            target: {text: "По словам Ольги, это недорого. Павел утверждает, что это дорого. Судя по рецензии, можно сказать, что кофе хороший.", language_code: ru, direction: ltr}
            introduced_tokens: [хороший]
        exercises:
          - content_key: ru.b2.unit08.lesson01.exercise01.recognize_po_slovam
            type: multiple_choice
            tested_text: "по словам"
            prompt: {target_blocks: [{text: "по словам", language_code: ru, direction: ltr}]}
          - content_key: ru.b2.unit08.lesson01.exercise02.listen_po_slovam_olgi
            type: listen_select
            tested_text: "По словам Ольги это недорого"
            media_asset_key: ru.b2.audio.sintez.po_slovam_olgi.01
            prompt: {target_blocks: []}
          - content_key: ru.b2.unit08.lesson01.exercise03.match_attribution_words
            type: matching_pairs
            tested_text: "по словам утверждает считает судя по рецензия источник кофе цена"
            prompt: {target_blocks: []}
            pairs:
              - {left: "по словам", right: "according to"}
              - {left: "утверждает", right: "claims / asserts"}
              - {left: "считает", right: "thinks / holds"}
              - {left: "судя по", right: "judging by"}
              - {left: "рецензия", right: "review"}
              - {left: "источник", right: "source"}
              - {left: "кофе", right: "coffee"}
              - {left: "цена", right: "price"}
          - content_key: ru.b2.unit08.lesson01.exercise04.order_po_slovam_olgi
            type: word_order
            tested_text: "По словам Ольги кофе там вкусный"
            prompt: {target_blocks: []}
            word_bank: ["По", "словам", "Ольги", "кофе", "там", "вкусный"]
          - content_key: ru.b2.unit08.lesson01.exercise05.translate_utverzhdaet
            type: translation
            tested_text: "Павел утверждает что это дорого"
            prompt: {target_blocks: [{text: "Translate into Russian, using утверждать: Pavel claims that it is expensive.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit08.lesson01.exercise06.speak_po_slovam_olgi
            type: speak_response
            tested_text: "По словам Ольги это недорого"
            prompt: {target_blocks: [{text: "Say aloud in Russian, using по словам: According to Olga, it isn't expensive.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit08.lesson01.exercise07.write_sudya_po
            type: writing_prompt
            tested_text: "Судя по рецензии можно сказать что кофе хороший"
            prompt: {target_blocks: [{text: "Write in Russian, using судя по ..., можно сказать, что: Judging by the review, one can say that the coffee is good.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit08.lesson01.exercise08.dictation_po_slovam_olgi
            type: dictation
            tested_text: "По словам Ольги, это недорого"
            media_asset_key: ru.b2.audio.sintez.po_slovam_olgi.01
            prompt: {target_blocks: []}

      - content_key: ru.b2.unit08.lesson02.sravnenie
        title: "Два источника рядом"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: ru.b2.unit08.lesson02.teach.oba
            kind: vocabulary
            target: {text: "оба", language_code: ru, direction: ltr}
            introduced_tokens: [оба, они]
            example: {text: "Оба считают, что кофе вкусный.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.oba_istochnika
            kind: vocabulary
            target: {text: "оба источника", language_code: ru, direction: ltr}
            introduced_tokens: [источника]
            example: {text: "Оба источника считают, что кофе там хороший.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.nedorogo
            kind: vocabulary
            target: {text: "недорого", language_code: ru, direction: ltr}
            introduced_tokens: []
            example: {text: "Ольга считает, что там недорого.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.v_to_vremya_kak
            kind: vocabulary
            target: {text: "в то время как", language_code: ru, direction: ltr}
            introduced_tokens: [в, то, время, как]
            example: {text: "Ольга считает, что там недорого, в то время как Павел считает это дорогим.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.polozhitelno
            kind: vocabulary
            target: {text: "положительно", language_code: ru, direction: ltr}
            introduced_tokens: [положительно, настроена, настроен]
            example: {text: "Ольга настроена положительно.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.otricatelno
            kind: vocabulary
            target: {text: "отрицательно", language_code: ru, direction: ltr}
            introduced_tokens: [отрицательно]
            example: {text: "Павел настроен отрицательно.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.naprotiv
            kind: vocabulary
            target: {text: "напротив", language_code: ru, direction: ltr}
            introduced_tokens: [напротив]
            example: {text: "Ольга настроена положительно. Павел, напротив, настроен отрицательно.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.v_otlichie_ot
            kind: phrase
            target: {text: "в отличие от", language_code: ru, direction: ltr}
            introduced_tokens: [отличие, от]
            example: {text: "В отличие от Ольги, Павел считает это дорогим.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.s_odnoy_i_s_drugoy
            kind: phrase
            target: {text: "с одной стороны ... с другой стороны ...", language_code: ru, direction: ltr}
            introduced_tokens: [вкусно]
            example: {text: "С одной стороны, это вкусно, с другой стороны, это дорого.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit08.lesson02.teach.grammar_sravnenie
            kind: grammar_note
            target: {text: "Оба источника считают, что кофе там хороший. Ольга считает, что там недорого, в то время как Павел считает это дорогим.", language_code: ru, direction: ltr}
            introduced_tokens: [дорогим]
        exercises:
          - content_key: ru.b2.unit08.lesson02.exercise01.recognize_v_to_vremya_kak
            type: multiple_choice
            tested_text: "в то время как"
            prompt: {target_blocks: [{text: "в то время как", language_code: ru, direction: ltr}]}
          - content_key: ru.b2.unit08.lesson02.exercise02.listen_oba_horosho
            type: listen_select
            tested_text: "Оба источника считают что кофе там хороший"
            media_asset_key: ru.b2.audio.sintez.oba_horosho.01
            prompt: {target_blocks: []}
          - content_key: ru.b2.unit08.lesson02.exercise03.match_comparison_words
            type: matching_pairs
            tested_text: "оба в то время как напротив в отличие от положительно отрицательно"
            prompt: {target_blocks: []}
            pairs:
              - {left: "оба", right: "both (of them)"}
              - {left: "в то время как", right: "whereas"}
              - {left: "напротив", right: "on the contrary"}
              - {left: "в отличие от", right: "unlike"}
              - {left: "положительно", right: "positively"}
              - {left: "отрицательно", right: "negatively"}
          - content_key: ru.b2.unit08.lesson02.exercise04.order_oba_horosho
            type: word_order
            tested_text: "Оба источника считают что кофе там хороший"
            prompt: {target_blocks: []}
            word_bank: ["Оба", "источника", "считают", "что", "кофе", "там", "хороший"]
          - content_key: ru.b2.unit08.lesson02.exercise05.translate_v_to_vremya
            type: translation
            tested_text: "Ольга настроена положительно в то время как Павел настроен отрицательно"
            prompt: {target_blocks: [{text: "Translate into Russian, using в то время как: Olga is positive, whereas Pavel is negative.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit08.lesson02.exercise06.translate_v_otlichie_ot
            type: translation
            tested_text: "В отличие от Ольги Павел считает это дорогим"
            prompt: {target_blocks: [{text: "Translate into Russian, using в отличие от: In contrast to Olga, Pavel finds it expensive.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit08.lesson02.exercise07.write_s_odnoy_storony
