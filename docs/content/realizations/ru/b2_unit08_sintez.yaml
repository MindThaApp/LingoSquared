generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ru's B2
    synthesis unit (the FINAL B2 unit for this direction), the fourth and
    last of the second-half wave (units 05-08). No adaptable intermediate/
    upper-level public-domain Russian source exists for this topic, so
    this was built from general Russian grammar/discourse knowledge, the
    same honest-disclosure precedent this unit's own B2 unit01-07 set.
    Sibling-isolation honored: the X->en B2 synthesis realization and
    every nl/fa/prs/de B2 file were treated as non-existent and were NOT
    opened; the nl exemplar named in the dispatch prompt was consulted
    ONLY for unit shape (6 lessons, 44 exercises, spine outcome mapping),
    never for its content -- this unit deliberately synthesizes TWO
    reviews of a DIFFERENT everyday subject (a new coffee shop, not the
    Dutch exemplar's restaurant) and every Russian sentence was authored
    fresh from first principles. Only ru's OWN earlier realization content
    (the Настя/Дима pair, established as Дима=engineer, Настя=teacher,
    informal ты register; see unit01-07) was consulted for character
    canon, which is not a sibling-direction violation. Настя and Дима act
    as two spoken sources discussing the coffee shop in lesson06, which
    introduces no canon conflict. Ольга and Павел are new named review
    authors local to this unit (the two written sources), confirmed unused
    elsewhere in the B2 course before introduction.
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  notes: >-
    Eighth Russian B2 unit; synthesis unit; the FINAL unit of the
    second-half wave (units 05-08) and of en-ru B2 overall. Targets the
    CEFR B2 synthesis outcome
    (universal.b2.synthesis.summarize_and_evaluate_multiple_sources):
    summarize and evaluate multiple sources -- name where two sources
    agree, where they conflict, and give a reasoned judgement between
    them. Theme: one coherent everyday puzzle across all six lessons --
    two online reviews of a new coffee shop ("Зёрна"), one by Ольга and
    one by Павел, that AGREE the coffee is good but CONFLICT on the price,
    and one of which is better supported. Lesson arc: L01 attributing a
    claim to a source (по словам / утверждает / считает / судя по ...
    можно сказать, что); L02 comparing two sources side by side (оба /
    оба источника / в то время как / напротив / в отличие от / с одной
    стороны ... с другой стороны); L03 naming AGREEMENT (они сходятся во
    мнении о / одинаково считают / в вопросе); L04 naming CONFLICT (они
    расходятся во мнении о / противоречат друг другу в вопросе /
    разница); L05 a reading of BOTH review texts side by side -- identify
    the agreement, the conflict point, and which review backs its price
    claim with a reason; L06 the culminating production -- a Настя/Дима
    dialogue for the listening requirement (identify agreement, conflict,
    and which speaker is better supported), a speaking synthesis, and a
    writing synthesis that NAMES all three parts (agreement + conflict +
    reasoned judgement). Register: informal ты throughout, per the ru lane
    pin; Настя and Дима continue their established informal register from
    unit01-07. All vocabulary needed for this unit's own exercises is
    introduced within units 01-08 of this course (B2 is a separate Course
    row, so a B2 learner never sees A1/A2/B1 lexemes at runtime). No
    sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist): checked
    naturalness of the synthesis toolkit, grading (accepted answers vs every
    variant the prompts allow), matching_pairs discrimination,
    reading/listening answerability, learner-visible notes and glosses. Fixes:
    lesson05.exercise01-04 (read_*) -- the two reviews were never shown in the
    exercise; both review texts (Ольга, Павел) now prepended as a ru
    target_block before each English question; lesson02.teach.naprotiv example
    'Ольга положительна. Павел, напротив, отрицателен.' (wrong sense:
    character judgement) -> 'Ольга настроена положительно. Павел, напротив,
    настроен отрицательно.'; lesson04.teach.vsyo_zhe example 'Ольга считает
    недорого; и всё же Павел считает дорого.' (ungrammatical) -> 'Кофе
    вкусный, и всё же это дорого.' (overlay example_gloss updated);
    lesson02.exercise03 matching pairs напротив 'by contrast' / в отличие от
    'in contrast to' (near-synonyms) -> 'on the contrary' / 'unlike'
    (realization + overlay); lesson03.exercise07 duplicated the ex05 item
    'They agree about the coffee' -> now 'Write in Russian, using то же самое:
    They think the same thing.' = 'Они считают то же самое' (+ 'Они думают то
    же самое'), content_key kept; lesson03.exercise06 prompt and
    teach.govoryat / grammar_soglasie glosses 'They both say the same that...'
    -> 'They both say the same thing: that...'; overlay: added missing
    teaching entry lesson06.teach.kto_ubeditelnee; teach.v_voprose note no
    longer cites 'lesson 4'; teach.zyorna and teach.grammar_polnyj_sintez
    notes no longer describe the unit/tasks; accepted answers widened:
    lesson06.exercise05 speak_sintez (two-sentence form without но, 'но они
    расходятся', and 'Дима наиболее убедителен' order), lesson06.exercise04
    word order ['Дима','наиболее','убедителен'] (compiler warns: intended
    alternate order), lesson06.exercise06 and exercise07 'Дима наиболее
    убедителен, потому что...', lesson02.exercise06 'В отличие от Ольги, Павел
    считает, что это дорого', lesson05.exercise06 'За эту цену я жду
    большего', lesson03.exercise06 'Они оба одинаково говорят, что кофе
    вкусный'. NATIVE FLAGS: 'Мне нравится «Зёрна»' (name declined as plural
    elsewhere -- нравятся? or 'кофейня «Зёрна»'; also in audio
    ru.b2.audio.dialogue.sintez.zyorna.01); 'Они сходятся в вопросе кофе' and
    'противоречат друг другу в вопросе цены' may read stilted ('в вопросе о
    цене'); 'Обе рецензии считают, что' (personified reviews; 'В обеих
    рецензиях говорится' more natural). DEFERRED: none in this file beyond
    native flags (the same unshown-passage reading pattern exists in ru
    b2_unit07 lesson05, outside this batch).

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты throughout (ru lane pin). B2 synthesis layers the
    attributing, comparing, agreement/conflict and judgement toolkit onto
    that register -- по словам, утверждает, считает, оба источника, в то
    время как, они сходятся во мнении, они расходятся во мнении,
    наиболее убедителен, лучше обоснован -- while keeping everyday
    informal address. Настя and Дима continue the informal ты they use
    with each other in unit01-07.

