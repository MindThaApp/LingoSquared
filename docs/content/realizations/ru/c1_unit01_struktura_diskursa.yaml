  notes: >-
    Russian C1 unit 01 on extended-discourse structure: announcing a
    direction, signposting linked points, making a controlled digression,
    returning explicitly to the main line, and closing with a synthesis.
    From-scratch generation from established Russian discourse conventions;
    no adaptable intermediate/upper-level public-domain Russian source exists
    for this specific topic, so no external source was consulted. Sibling
    isolation honored: the X->en discourse realization and every nl/fa/prs/de
    file were treated as non-existent and NOT opened; the it C1 unit05 file
    named in the dispatch prompt was used ONLY for unit shape (schema 1.1,
    6 lessons, exercise-type vocabulary), never for content. Character canon
    checked in docs/content/realizations/ru/: Настя is a teacher (feminine
    forms) and Дима is an engineer (masculine forms), an established pair who
    use informal ты with each other. This unit keeps informal register and
    deliberately authors its single extended contribution in a first-person
    gender-neutral voice (no gendered past-tense or agreement forms that would
    force a learner of either gender to be graded wrong), so the culminating
    speaking/writing model is reproducible verbatim by any learner.
