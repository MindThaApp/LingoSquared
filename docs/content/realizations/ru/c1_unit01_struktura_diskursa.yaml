  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.discourse.structure_extended_discourse. Priority
    checks for the reviewer: (1) confirm the culminating model covers every
    required move in order -- announce direction, first linked point, second
    linked point, controlled digression, explicit return, synthesis -- and
    that the speaking and writing exercises each require the WHOLE act;
    (2) confirm the model is fully gender-neutral so a learner of either
    gender can reproduce it exactly (no gendered past tense of я, no gendered
    short adjectives); (3) confirm "цена сначала меня смущала" is natural
    and its verb agrees with цена (not the speaker); (4) confirm every tested
    token is introduced earlier in the unit (C1 is its own Course row, so no
    A1-B2 vocabulary is available); (5) confirm the matching_pairs lefts
    discriminate on real meaning and no two lefts share a gloss; (6) confirm
    listen/dictation exercises each use a dedicated asset whose text matches
    tested_text byte-for-byte.

