  notes: >-
    Russian C1 unit 08 on persuasion through rhetorical devices: a rhetorical
    question (Неужели...?), a parallel structure (Здесь... здесь... здесь...),
    deliberate emphasis (Именно...), and an audience appeal / call to action
    (Поддержите... подпишите...), modulating intensity from a calm opening
    question up to an urgent imperative. From-scratch generation from
    established Russian public-speaking conventions; no adaptable public-domain
    Russian source exists for this specific topic, so no external source was
    consulted. Sibling isolation honored: every nl/fa/prs/de/en-other file was
    treated as non-existent and NOT opened; the it C1 unit05 file named in the
    dispatch prompt was used ONLY for unit shape (schema 1.1, 6 lessons,
    exercise-type vocabulary), never for content. Character canon checked in
    docs/content/realizations/ru/: Настя is a teacher (feminine forms) and Дима
    is an engineer (masculine forms), an established pair who use informal ты
    with each other. This unit deliberately contains no Настя–Дима dialogue:
    the persuasive appeal is a public monologue addressed to an audience, so no
    ты/вы register choice between the two characters arises. The appeal uses
    inclusive мы and plural audience вы (Поддержите), and is fully
    gender-neutral — no first-person singular gendered past-tense or
    agreement forms — so a learner of either gender reproduces it verbatim.
