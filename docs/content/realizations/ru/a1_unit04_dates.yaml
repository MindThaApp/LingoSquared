schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. The
    "Days of the week" and "Months of the year" vocabulary lists
    (preceding Lesson 6, page ~133: понедельник, вторник, среда, четверг,
    пятница, суббота, воскресенье; январь, февраль, март, апрель, май,
    июнь, июль, август, сентябрь, октябрь, ноябрь, декабрь) and Lesson
    10's ordinal-date construction note ("Сегодня десятое [число]
    апреля" and the ordinal/cardinal correspondence table: первый/один,
    второй/два, третий/три, четвёртый/четыре, пятый/пять...) supplied the
    vocabulary set and grammar pattern; every example sentence, exercise,
    and dialogue here was freshly authored for a natural 2026 everyday-use
    context (asking the day of the week, stating a calendar date,
    arranging a meeting day), not imported verbatim from the source
    (AUTHORING_GUIDE §10). Combining acute-accent stress marks were
    stripped from every learner-facing string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: native_speaker
  notes: >-
    Fresh-context full review complete 2026-07-12 (new-language lane, no sampling); zero grammar/case-agreement/audio-containment defects, no stress diacritics, days/months lowercase. Every listen_select/
    listen_order media_asset_key points to a dedicated pending_generation
    asset whose recorded text literally contains the tested_text sentence
    (no reuse of the day-list/month-list overview audio for a
    single-sentence test) -- this was the exact bug class found and fixed
    in ru unit03 review. Ordinal date forms use neuter agreement with the
    understood noun число (первое, второе, третье, четвёртое, пятое,
    шестое, седьмое, восьмое, девятое, десятое); months after a date are
    genitive (апреля, октября, января). Native-speaker review still pending.

    Second-pass review 2026-10-18: 1 fix -- lesson03.exercise09.write_arrange_meeting: underdetermined prompt now names the date (Tuesday, January 9th). NATIVE FLAGS: none.

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit is calendar-focused; вы is used for the scheduling-dialogue
    scene (coworkers arranging a meeting).

media_assets:
  - {content_key: ru.a1.audio.days_mon_wed.neutral.01, language: ru, text: "понедельник, вторник, среда", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.segodnya_subbota.neutral.01, language: ru, text: "Сегодня суббота.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.kakoy_segodnya_den.formal.01, language: ru, text: "Какой сегодня день?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.segodnya_desyatoe_aprelya.neutral.01, language: ru, text: "Сегодня десятое апреля.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.segodnya_tretye_yanvarya.neutral.01, language: ru, text: "Сегодня третье января.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.kakoe_segodnya_chislo.formal.01, language: ru, text: "Какое сегодня число?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.vstrecha_vo_vtornik.neutral.01, language: ru, text: "Встреча во вторник, девятого января.", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.arrange_meeting.01
    language: ru
    text: >-
      Анна: Какой сегодня день? Виктор: Сегодня среда, третье января.
      Анна: Хорошо. Встреча во вторник? Виктор: Да, во вторник, девятого
      января.
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit04.dates
    title: "Даты и дни недели"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.dates.exchange_calendar_dates
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit04.lesson01.dni_nedeli
        title: "Дни недели"
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - {content_key: ru.a1.unit04.lesson01.teach.kakoy_den, kind: phrase, target: {text: "Какой сегодня день?", language_code: ru, direction: ltr}, introduced_tokens: [Какой, сегодня, день]}
          - content_key: ru.a1.unit04.lesson01.teach.ponedelnik_vtornik
            kind: vocabulary
            target: {text: "понедельник, вторник", language_code: ru, direction: ltr}
            introduced_tokens: [понедельник, вторник]
            example:
              - {text: "Сегодня понедельник.", language_code: ru, direction: ltr}
              - {text: "Сегодня вторник.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit04.lesson01.teach.sreda_chetverg
            kind: vocabulary
            target: {text: "среда, четверг", language_code: ru, direction: ltr}
            introduced_tokens: [среда, четверг]
            example:
              - {text: "Сегодня среда.", language_code: ru, direction: ltr}
              - {text: "Сегодня четверг.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit04.lesson01.teach.pyatnitsa_subbota
            kind: vocabulary
            target: {text: "пятница, суббота", language_code: ru, direction: ltr}
            introduced_tokens: [пятница, суббота]
            example:
              - {text: "Сегодня пятница.", language_code: ru, direction: ltr}
              - {text: "Сегодня суббота.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit04.lesson01.teach.voskresenye, kind: vocabulary, target: {text: "воскресенье", language_code: ru, direction: ltr}, introduced_tokens: [воскресенье], example: {text: "Сегодня воскресенье.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit04.lesson01.teach.segodnya, kind: phrase, target: {text: "Сегодня ...", language_code: ru, direction: ltr}, introduced_tokens: [Сегодня]}
        exercises:
          - content_key: ru.a1.unit04.lesson01.exercise01.recognize_sreda
            type: multiple_choice
            tested_text: "среда"
            prompt: {target_blocks: [{text: "Wednesday", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson01.exercise02.recognize_subbota
            type: multiple_choice
            tested_text: "суббота"
            prompt: {target_blocks: [{text: "Saturday", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson01.exercise03.listen_select_first_day
            type: listen_select
            tested_text: "понедельник"
            media_asset_key: ru.a1.audio.days_mon_wed.neutral.01
            prompt: {target_blocks: [{text: "Which day is first in the recording?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson01.exercise04.match_days
            type: matching_pairs
            tested_text: "понедельник вторник среда четверг пятница суббота воскресенье"
            prompt: {target_blocks: []}
            pairs:
              - {left: "понедельник", right: "Monday"}
              - {left: "вторник", right: "Tuesday"}
              - {left: "среда", right: "Wednesday"}
              - {left: "четверг", right: "Thursday"}
              - {left: "пятница", right: "Friday"}
              - {left: "суббота", right: "Saturday"}
              - {left: "воскресенье", right: "Sunday"}
          - content_key: ru.a1.unit04.lesson01.exercise05.order_today_friday
            type: word_order
            tested_text: "Сегодня пятница"
            prompt: {target_blocks: []}
            word_bank: ["пятница", "Сегодня"]
          - content_key: ru.a1.unit04.lesson01.exercise06.listen_order_today_saturday
            type: listen_order
            tested_text: "Сегодня суббота"
            media_asset_key: ru.a1.audio.segodnya_subbota.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["суббота", "Сегодня"]
          - content_key: ru.a1.unit04.lesson01.exercise07.complete_day
            type: fill_in_blank
            tested_text: "Сегодня среда"
            prompt: {target_blocks: [{text: "What day is it? — ___ среда. (today)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson01.exercise08.write_today
            type: writing_prompt
            tested_text: "Сегодня воскресенье"
            prompt: {target_blocks: [{text: "Write a sentence saying today is Sunday, using \"Сегодня ...\".", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit04.lesson01.dni_nedeli.exercise09.dictation_segodnya_subbota_neutral, type: dictation, tested_text: "Сегодня суббота", media_asset_key: ru.a1.audio.segodnya_subbota.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
        title: "Месяцы и числа месяца"
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - {content_key: ru.a1.unit04.lesson02.teach.kakoe_chislo, kind: phrase, target: {text: "Какое сегодня число?", language_code: ru, direction: ltr}, introduced_tokens: [Какое, сегодня, число]}
          - content_key: ru.a1.unit04.lesson02.teach.pervoe_tretye
            kind: vocabulary
            target: {text: "первое, третье", language_code: ru, direction: ltr}
            introduced_tokens: [первое, третье]
            example:
              - {text: "Сегодня первое января.", language_code: ru, direction: ltr}
              - {text: "Сегодня третье января.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit04.lesson02.teach.pyatoe_desyatoe
            kind: vocabulary
            target: {text: "пятое, десятое", language_code: ru, direction: ltr}
            introduced_tokens: [пятое, десятое]
            example:
              - {text: "Сегодня пятое октября.", language_code: ru, direction: ltr}
              - {text: "Сегодня десятое апреля.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit04.lesson02.teach.yanvar_aprel
            kind: vocabulary
            target: {text: "января, апреля", language_code: ru, direction: ltr}
            introduced_tokens: [января, апреля]
            example:
              - {text: "Сегодня третье января.", language_code: ru, direction: ltr}
              - {text: "Сегодня десятое апреля.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit04.lesson02.teach.oktyabrya, kind: vocabulary, target: {text: "октября", language_code: ru, direction: ltr}, introduced_tokens: [октября], example: {text: "Сегодня пятое октября.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit04.lesson02.exercise01.recognize_desyatoe
            type: multiple_choice
            tested_text: "десятое"
            prompt: {target_blocks: [{text: "10th (neuter ordinal, used for a date)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson02.exercise02.recognize_aprelya
            type: multiple_choice
            tested_text: "апреля"
            prompt: {target_blocks: [{text: "of April (genitive, used after a date)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson02.exercise03.listen_select_date
            type: listen_select
            tested_text: "Сегодня десятое апреля"
            media_asset_key: ru.a1.audio.segodnya_desyatoe_aprelya.neutral.01
            prompt: {target_blocks: [{text: "Which date is stated in the recording?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson02.exercise04.match_ordinals
            type: matching_pairs
            tested_text: "первое третье пятое десятое"
            prompt: {target_blocks: []}
            pairs:
              - {left: "первое", right: "1st"}
              - {left: "третье", right: "3rd"}
              - {left: "пятое", right: "5th"}
              - {left: "десятое", right: "10th"}
              - {left: "января", right: "of January"}
              - {left: "апреля", right: "of April"}
              - {left: "октября", right: "of October"}
          - content_key: ru.a1.unit04.lesson02.exercise05.order_fifth_october
            type: word_order
            tested_text: "Сегодня пятое октября"
            prompt: {target_blocks: []}
            word_bank: ["октября", "пятое", "Сегодня"]
          - content_key: ru.a1.unit04.lesson02.exercise06.listen_order_third_january
            type: listen_order
            tested_text: "Сегодня третье января"
            media_asset_key: ru.a1.audio.segodnya_tretye_yanvarya.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["января", "третье", "Сегодня"]
          - content_key: ru.a1.unit04.lesson02.exercise07.complete_date
            type: fill_in_blank
            tested_text: "Сегодня десятое апреля"
            prompt: {target_blocks: [{text: "Сегодня ___ апреля. (10th)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson02.exercise08.write_date
            type: writing_prompt
            tested_text: "Сегодня первое января"
            prompt: {target_blocks: [{text: "Write today's date as January 1st, using \"Сегодня ...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
        title: "Назначаем встречу"
        spine_outcome_id: universal.a1.dates.exchange_calendar_dates
        teaching:
          - {content_key: ru.a1.unit04.lesson03.teach.kakoe_segodnya_chislo, kind: phrase, target: {text: "Какое сегодня число?", language_code: ru, direction: ltr}, introduced_tokens: [Какое, сегодня, число]}
          - {content_key: ru.a1.unit04.lesson03.teach.vo_vtornik, kind: phrase, target: {text: "во вторник", language_code: ru, direction: ltr}, introduced_tokens: [во, вторник]}
          - {content_key: ru.a1.unit04.lesson03.teach.vstrecha, kind: vocabulary, target: {text: "встреча", language_code: ru, direction: ltr}, introduced_tokens: [встреча], example: {text: "Встреча во вторник.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit04.lesson03.teach.anna_kakoy_den, kind: dialogue, target: {text: "Анна: Какой сегодня день?", language_code: ru, direction: ltr}, introduced_tokens: [Анна, Какой, сегодня, день]}
          - {content_key: ru.a1.unit04.lesson03.teach.viktor_sreda, kind: dialogue, target: {text: "Виктор: Сегодня среда, третье января.", language_code: ru, direction: ltr}, introduced_tokens: [Виктор, Сегодня, среда, третье, января]}
          - {content_key: ru.a1.unit04.lesson03.teach.anna_khorosho, kind: dialogue, target: {text: "Анна: Хорошо. Встреча во вторник?", language_code: ru, direction: ltr}, introduced_tokens: [Хорошо, Встреча, во, вторник]}
          - {content_key: ru.a1.unit04.lesson03.teach.viktor_da, kind: dialogue, target: {text: "Виктор: Да, во вторник, девятого января.", language_code: ru, direction: ltr}, introduced_tokens: [Да, девятого]}
        exercises:
          - content_key: ru.a1.unit04.lesson03.exercise01.choose_ask_day
            type: multiple_choice
            tested_text: "Какой сегодня день"
            prompt: {target_blocks: [{text: "You want to ask what day of the week it is today.", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson03.exercise02.listen_select_meeting
            type: listen_select
            tested_text: "Встреча во вторник, девятого января"
            media_asset_key: ru.a1.audio.vstrecha_vo_vtornik.neutral.01
            prompt: {target_blocks: [{text: "Which day and date is the meeting on?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson03.exercise03.dialogue_comprehension_meeting
            type: dialogue_comprehension
            tested_text: "среда третье января вторник девятого января"
            media_asset_key: ru.a1.audio.dialogue.arrange_meeting.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit04.lesson03.exercise04.match_day_date
            type: matching_pairs
            tested_text: "среда третье января вторник девятого января"
            prompt: {target_blocks: []}
            pairs:
              - {left: "среда, третье января", right: "Wednesday, January 3rd"}
              - {left: "вторник, девятого января", right: "Tuesday, January 9th"}
              - {left: "среда", right: "Wednesday"}
              - {left: "вторник", right: "Tuesday"}
              - {left: "третье", right: "3rd"}
              - {left: "января", right: "of January"}
          - content_key: ru.a1.unit04.lesson03.exercise05.order_meeting_tuesday
            type: word_order
            tested_text: "Встреча во вторник"
            prompt: {target_blocks: []}
            word_bank: ["вторник", "во", "Встреча"]
          - content_key: ru.a1.unit04.lesson03.exercise06.listen_type_meeting_question
            type: listen_type
            tested_text: "Какое сегодня число"
            media_asset_key: ru.a1.audio.kakoe_segodnya_chislo.formal.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit04.lesson03.exercise07.reply_ask_day
            type: dialogue_response
            tested_text: "Сегодня среда, третье января"
            prompt: {target_blocks: [{text: "Какой сегодня день?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson03.exercise08.complete_meeting_date
            type: fill_in_blank
            tested_text: "Встреча во вторник, девятого января"
            prompt: {target_blocks: [{text: "Встреча во вторник, ___ января. (9th)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit04.lesson03.exercise09.write_arrange_meeting
            type: writing_prompt
            tested_text: "Встреча во вторник января"
            prompt: {target_blocks: [{text: "Write a sentence arranging a meeting: say the meeting is on Tuesday, January 9th.", language_code: en, direction: ltr}]}
