schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. Lesson 8
    ("В ресторане") supplied the restaurant vocabulary and phrases used
    here: меню, официант(ка), стол/столик, свободен, "Этот столик
    свободен?", "Да, садитесь, пожалуйста. Вот меню.", "Что будете
    заказывать?", "Принесите, пожалуйста, меню.", and the food/drink and
    dessert-ordering vocabulary (чай, кофе, хлеб, борщ, салат, мороженое,
    "Я хочу...", "На сладкое принесите..."). Every example sentence,
    exercise, and dialogue here was freshly authored for a natural
    2026 everyday-use context (ordering a simple meal at a restaurant),
    not imported verbatim from the source (AUTHORING_GUIDE §10).
    Combining acute-accent stress marks were stripped from every
    learner-facing string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: "Fresh-context full review (new-language lane, no sampling), 2026-07-12. Case agreement correct (accusative bors/salat = nom; genitive after skolko/kilo/numerals: sto rubley, kilo yablok, pyat shtuk); no stress diacritics; e/yo consistent (idyom has yo); polite vy register throughout. Fixed one unrealistic price in the unit08 market dialogue (6000->200 rubles/kg apples). All listen_* audio contains tested sentence.\n\nSecond-pass review 2026-10-18: 1 fix — lesson03: added dialogue card teach.ofitsiantka_khorosho for the restoran_zakaz audio's final turn (Официантка: Хорошо. Спасибо.), which no card taught. NATIVE FLAGS: Я хочу ... as the taught restaurant-ordering frame is understandable but blunt; Мне, пожалуйста, ... / Я буду ... are the more natural ordering forms."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit is restaurant-focused; a polite formal register is used between
    customer and waiter/waitress throughout (пожалуйста everywhere,
    вы-forms in dialogue).

media_assets:
  - {content_key: ru.a1.audio.etot_stolik_svoboden.neutral.01, language: ru, text: "Этот столик свободен?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.da_saditites_pozhaluysta.neutral.01, language: ru, text: "Да, садитесь, пожалуйста.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.ya_khochu_chay.neutral.01, language: ru, text: "Я хочу чай.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.ya_khochu_borshch_i_salat.neutral.01, language: ru, text: "Я хочу борщ и салат.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.na_sladkoe_morozhenoe.neutral.01, language: ru, text: "На сладкое принесите мороженое, пожалуйста.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.chto_budete_zakazyvat.neutral.01, language: ru, text: "Что будете заказывать?", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.restoran_zakaz.01
    language: ru
    text: >-
      Официантка: Что будете заказывать? Турист: Я хочу борщ и салат.
      Официантка: Что будете пить? Турист: Я хочу чай. Официантка: А
      на сладкое? Турист: На сладкое принесите мороженое, пожалуйста.
      Официантка: Хорошо. Спасибо.
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit07.food
    title: "Еда"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.food.order_simple_meal
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit07.lesson01.v_restorane
        title: "В ресторане"
        spine_outcome_id: universal.a1.food.order_simple_meal
        teaching:
          - {content_key: ru.a1.unit07.lesson01.teach.menyu, kind: vocabulary, target: {text: "меню", language_code: ru, direction: ltr}, introduced_tokens: [меню], example: {text: "Вот меню.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit07.lesson01.teach.ofitsiant, kind: vocabulary, target: {text: "официант, официантка", language_code: ru, direction: ltr}, introduced_tokens: [официант, официантка], example: {text: "Официантка работает в ресторане.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit07.lesson01.teach.stol_svoboden, kind: phrase, target: {text: "Этот столик свободен?", language_code: ru, direction: ltr}, introduced_tokens: [Этот, столик, стол, свободен]}
          - {content_key: ru.a1.unit07.lesson01.teach.da_saditites, kind: phrase, target: {text: "Да, садитесь, пожалуйста.", language_code: ru, direction: ltr}, introduced_tokens: [Да, садитесь, пожалуйста]}
          - {content_key: ru.a1.unit07.lesson01.teach.chto_budete_zakazyvat, kind: phrase, target: {text: "Что будете заказывать?", language_code: ru, direction: ltr}, introduced_tokens: [Что, будете, заказывать]}
        exercises:
          - content_key: ru.a1.unit07.lesson01.exercise01.recognize_menyu
            type: multiple_choice
            tested_text: "меню"
            prompt: {target_blocks: [{text: "menu", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson01.exercise02.recognize_ofitsiant
            type: multiple_choice
            tested_text: "официант"
            prompt: {target_blocks: [{text: "waiter", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson01.exercise03.listen_select_stolik_svoboden
            type: listen_select
            tested_text: "Этот столик свободен"
            media_asset_key: ru.a1.audio.etot_stolik_svoboden.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson01.exercise04.match_restaurant_basics
            type: matching_pairs
            tested_text: "меню официант стол свободен"
            prompt: {target_blocks: []}
            pairs:
              - {left: "меню", right: "menu"}
              - {left: "официант", right: "waiter"}
              - {left: "стол", right: "table"}
              - {left: "свободен", right: "free (vacant)"}
          - content_key: ru.a1.unit07.lesson01.exercise05.order_stolik_svoboden
            type: word_order
            tested_text: "Этот столик свободен"
            prompt: {target_blocks: []}
            word_bank: ["столик", "Этот", "свободен"]
          - content_key: ru.a1.unit07.lesson01.exercise06.listen_order_saditites
            type: listen_order
            tested_text: "Да садитесь пожалуйста"
            media_asset_key: ru.a1.audio.da_saditites_pozhaluysta.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["пожалуйста", "Да", "садитесь"]
          - content_key: ru.a1.unit07.lesson01.exercise07.complete_stolik_svoboden
            type: fill_in_blank
            tested_text: "Этот столик свободен"
            prompt: {target_blocks: [{text: "Этот столик ___? (free)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson01.exercise08.write_ask_table_free
            type: writing_prompt
            tested_text: "Этот столик свободен"
            prompt: {target_blocks: [{text: "Write a question asking if this table is free, using \"Этот столик...?\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit07.lesson02.zakaz_edy
        title: "Заказ еды и напитков"
        spine_outcome_id: universal.a1.food.order_simple_meal
        teaching:
          - {content_key: ru.a1.unit07.lesson02.teach.ya_khochu, kind: phrase, target: {text: "Я хочу ...", language_code: ru, direction: ltr}, introduced_tokens: [Я, хочу]}
          - content_key: ru.a1.unit07.lesson02.teach.chay_kofe
            kind: vocabulary
            target: {text: "чай, кофе", language_code: ru, direction: ltr}
            introduced_tokens: [чай, кофе]
            example:
              - {text: "Я хочу чай.", language_code: ru, direction: ltr}
              - {text: "Я хочу кофе.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit07.lesson02.teach.khleb_borshch
            kind: vocabulary
            target: {text: "хлеб, борщ", language_code: ru, direction: ltr}
            introduced_tokens: [хлеб, борщ]
            example:
              - {text: "У вас есть хлеб?", language_code: ru, direction: ltr}
              - {text: "Я хочу борщ.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit07.lesson02.teach.salat, kind: vocabulary, target: {text: "салат", language_code: ru, direction: ltr}, introduced_tokens: [салат, и], example: {text: "Я хочу борщ и салат.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit07.lesson02.exercise01.recognize_chay
            type: multiple_choice
            tested_text: "чай"
            prompt: {target_blocks: [{text: "tea", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson02.exercise02.recognize_borshch
            type: multiple_choice
            tested_text: "борщ"
            prompt: {target_blocks: [{text: "borscht (beet soup)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson02.exercise03.listen_select_khochu_chay
            type: listen_select
            tested_text: "Я хочу чай"
            media_asset_key: ru.a1.audio.ya_khochu_chay.neutral.01
            prompt: {target_blocks: [{text: "What does the speaker want to drink?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson02.exercise04.match_food_drink_words
            type: matching_pairs
            tested_text: "чай кофе хлеб борщ салат"
            prompt: {target_blocks: []}
            pairs:
              - {left: "чай", right: "tea"}
              - {left: "кофе", right: "coffee"}
              - {left: "хлеб", right: "bread"}
              - {left: "борщ", right: "borscht"}
              - {left: "салат", right: "salad"}
          - content_key: ru.a1.unit07.lesson02.exercise05.order_ya_khochu_kofe
            type: word_order
            tested_text: "Я хочу кофе"
            prompt: {target_blocks: []}
            word_bank: ["хочу", "Я", "кофе"]
          - content_key: ru.a1.unit07.lesson02.exercise06.listen_order_borshch_salat
            type: listen_order
            tested_text: "Я хочу борщ и салат"
            media_asset_key: ru.a1.audio.ya_khochu_borshch_i_salat.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["салат", "борщ", "и", "хочу", "Я"]
          - content_key: ru.a1.unit07.lesson02.exercise07.complete_ya_khochu
            type: fill_in_blank
            tested_text: "Я хочу чай"
            prompt: {target_blocks: [{text: "Я ___ чай. (want)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson02.exercise08.write_order_food_drink
            type: writing_prompt
            tested_text: "Я хочу борщ и чай"
            prompt: {target_blocks: [{text: "Write a sentence ordering one food and one drink, using \"Я хочу...\".", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit07.lesson02.zakaz_edy.exercise09.dictation_ya_khochu_chay_neutral, type: dictation, tested_text: "Я хочу чай", media_asset_key: ru.a1.audio.ya_khochu_chay.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit07.lesson03.zakaz_dialog
        title: "Диалог: заказ в ресторане"
        spine_outcome_id: universal.a1.food.order_simple_meal
        teaching:
          - {content_key: ru.a1.unit07.lesson03.teach.morozhenoe, kind: vocabulary, target: {text: "мороженое", language_code: ru, direction: ltr}, introduced_tokens: [мороженое], example: {text: "На сладкое принесите мороженое.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit07.lesson03.teach.prinesite, kind: phrase, target: {text: "Принесите, пожалуйста, ...", language_code: ru, direction: ltr}, introduced_tokens: [Принесите]}
          - {content_key: ru.a1.unit07.lesson03.teach.spasibo, kind: phrase, target: {text: "Спасибо.", language_code: ru, direction: ltr}, introduced_tokens: [Спасибо, спасибо]}
          - {content_key: ru.a1.unit07.lesson03.teach.ofitsiantka_chto_budete, kind: dialogue, target: {text: "Официантка: Что будете заказывать?", language_code: ru, direction: ltr}, introduced_tokens: []}
          - {content_key: ru.a1.unit07.lesson03.teach.turist_ya_khochu_borshch, kind: dialogue, target: {text: "Турист: Я хочу борщ и салат.", language_code: ru, direction: ltr}, introduced_tokens: [Турист]}
          - {content_key: ru.a1.unit07.lesson03.teach.ofitsiantka_chto_pit, kind: dialogue, target: {text: "Официантка: Что будете пить?", language_code: ru, direction: ltr}, introduced_tokens: [пить]}
          - {content_key: ru.a1.unit07.lesson03.teach.turist_ya_khochu_chay, kind: dialogue, target: {text: "Турист: Я хочу чай.", language_code: ru, direction: ltr}, introduced_tokens: []}
          - {content_key: ru.a1.unit07.lesson03.teach.ofitsiantka_a_na_sladkoe, kind: dialogue, target: {text: "Официантка: А на сладкое?", language_code: ru, direction: ltr}, introduced_tokens: [на, сладкое]}
          - {content_key: ru.a1.unit07.lesson03.teach.turist_na_sladkoe, kind: dialogue, target: {text: "Турист: На сладкое принесите мороженое, пожалуйста.", language_code: ru, direction: ltr}, introduced_tokens: []}
          - {content_key: ru.a1.unit07.lesson03.teach.ofitsiantka_khorosho, kind: dialogue, target: {text: "Официантка: Хорошо. Спасибо.", language_code: ru, direction: ltr}, introduced_tokens: []}
        exercises:
          - content_key: ru.a1.unit07.lesson03.exercise01.choose_ask_menu
            type: multiple_choice
            tested_text: "Принесите пожалуйста меню"
            prompt: {target_blocks: [{text: "You want the waiter to bring you a menu. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson03.exercise02.listen_select_dessert
            type: listen_select
            tested_text: "На сладкое принесите мороженое"
            media_asset_key: ru.a1.audio.na_sladkoe_morozhenoe.neutral.01
            prompt: {target_blocks: [{text: "What dessert is ordered?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson03.exercise03.dialogue_comprehension_restoran_zakaz
            type: dialogue_comprehension
            tested_text: "борщ салат чай мороженое"
            media_asset_key: ru.a1.audio.dialogue.restoran_zakaz.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit07.lesson03.exercise04.match_order_phrases
            type: matching_pairs
            tested_text: "заказывать принесите хочу сладкое спасибо меню"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Что будете заказывать?", right: "What will you be ordering?"}
              - {left: "Принесите, пожалуйста, меню.", right: "Bring me a menu, please."}
              - {left: "Я хочу борщ.", right: "I want borscht."}
              - {left: "На сладкое принесите мороженое.", right: "For dessert, bring ice cream."}
              - {left: "Спасибо.", right: "Thank you."}
              - {left: "Вот меню.", right: "Here's the menu."}
          - content_key: ru.a1.unit07.lesson03.exercise05.order_na_sladkoe_morozhenoe
            type: word_order
            tested_text: "На сладкое принесите мороженое"
            prompt: {target_blocks: []}
            word_bank: ["мороженое", "На", "принесите", "сладкое"]
          - content_key: ru.a1.unit07.lesson03.exercise06.reply_chto_budete_zakazyvat
            type: dialogue_response
            tested_text: "Я хочу борщ и чай"
            prompt: {target_blocks: [{text: "Что будете заказывать?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson03.exercise07.complete_a_na_sladkoe
            type: fill_in_blank
            tested_text: "На сладкое принесите мороженое"
            prompt: {target_blocks: [{text: "На сладкое ___ мороженое, пожалуйста. (bring)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit07.lesson03.exercise08.write_full_order
            type: writing_prompt
            tested_text: "Я хочу борщ и чай На сладкое принесите мороженое"
            prompt: {target_blocks: [{text: "Write two or three sentences ordering a main dish, a drink, and a dessert.", language_code: en, direction: ltr}]}
