    language: ru
    text: "Я предлагаю, чтобы торт испекла я"
    voice_hint: neutral_adult_female
    status: pending_generation
  - content_key: ru.b2.audio.peregovory.ne_poluchitsya.01
    language: ru
    text: "К сожалению, это не получится"
    voice_hint: neutral_adult_male
    status: pending_generation
  - content_key: ru.b2.audio.peregovory.no_tolko_esli.01
    language: ru
    text: "Я могу испечь торт, но только если ты купишь украшения"
    voice_hint: neutral_adult_female
    status: pending_generation
  - content_key: ru.b2.audio.peregovory.podelim_schyot.01
    language: ru
    text: "Давай поделим счёт поровну"
    voice_hint: neutral_adult_female
    status: pending_generation
  - content_key: ru.b2.audio.dialogue.peregovory.den_rozhdeniya.01
    language: ru
    text: >-
      Настя: Давай вместе устроим день рождения. Дима: Хорошая идея. Я
      предлагаю, чтобы торт испекла ты. Настя: А украшения купишь ты
      тогда? Дима: К сожалению, это не получится. Но я согласен, при
      условии, что ты уберёшь после. Настя: Договорились. И счёт поделим
      поровну. Дима: Хорошо.
    voice_hint: two_adults_informal
    status: pending_generation

units:
  - content_key: ru.b2.unit07.peregovory
    title: "Переговоры"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.negotiation.negotiate_and_resolve_disagreement
    planned_lesson_count: 6

    lessons:
      - content_key: ru.b2.unit07.lesson01.predlozhenie
        title: "Сделать предложение"
        spine_outcome_id: universal.b2.negotiation.negotiate_and_resolve_disagreement
        teaching:
          - content_key: ru.b2.unit07.lesson01.teach.den_rozhdeniya
            kind: phrase
            target: {text: "Мы вместе устраиваем день рождения.", language_code: ru, direction: ltr}
            introduced_tokens: [Мы, вместе, устраиваем, устраивать, день, рождения, рождение]
          - content_key: ru.b2.unit07.lesson01.teach.torta
            kind: vocabulary
            target: {text: "торт", language_code: ru, direction: ltr}
            introduced_tokens: [торт, испечь, испеку]
            example: {text: "Я хочу испечь торт.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit07.lesson01.teach.ukrashenija
            kind: vocabulary
            target: {text: "украшения", language_code: ru, direction: ltr}
            introduced_tokens: [украшения, купить, куплю, купишь]
            example: {text: "Я куплю украшения.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit07.lesson01.teach.ya_predlagayu
            kind: phrase
            target: {text: "я предлагаю, чтобы ...", language_code: ru, direction: ltr}
            introduced_tokens: [предлагаю, предлагать, чтобы, торт, испекла]
          - content_key: ru.b2.unit07.lesson01.teach.davay
            kind: phrase
            target: {text: "давай ...?", language_code: ru, direction: ltr}
            introduced_tokens: [давай, устроим, устроить]
            example: {text: "Давай устроим день рождения?", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit07.lesson01.teach.chto_esli_my
            kind: phrase
            target: {text: "что если мы ...?", language_code: ru, direction: ltr}
            introduced_tokens: [что, если, разделим, разделить, расходы]
            example: {text: "Что если мы разделим расходы?", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit07.lesson01.teach.moyo_predlozhenie
            kind: phrase
            target: {text: "моё предложение — ...", language_code: ru, direction: ltr}
            introduced_tokens: [моё, предложение, испечёшь]
            example: {text: "Моё предложение — торт испечёшь ты.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit07.lesson01.teach.grammar_predlozhenie
            kind: grammar_note
            target: {text: "Я предлагаю, чтобы торт испекла я. Давай устроим день рождения? Что если мы разделим расходы?", language_code: ru, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ru.b2.unit07.lesson01.exercise01.recognize_predlagayu
            type: multiple_choice
            tested_text: "предлагаю"
            prompt: {target_blocks: [{text: "я предлагаю", language_code: ru, direction: ltr}]}
          - content_key: ru.b2.unit07.lesson01.exercise02.listen_predlagayu_ispech
            type: listen_select
            tested_text: "Я предлагаю чтобы торт испекла я"
            media_asset_key: ru.b2.audio.peregovory.predlagayu_ispech.01
            prompt: {target_blocks: []}
          - content_key: ru.b2.unit07.lesson01.exercise03.match_proposing
            type: matching_pairs
            tested_text: "я предлагаю чтобы давай что если мы моё предложение торт украшения расходы"
            prompt: {target_blocks: []}
            pairs:
              - {left: "я предлагаю, чтобы", right: "I propose that"}
              - {left: "давай", right: "let's / shall we"}
              - {left: "что если мы", right: "what if we"}
              - {left: "моё предложение", right: "my proposal is"}
              - {left: "торт", right: "cake"}
              - {left: "украшения", right: "decorations"}
              - {left: "расходы", right: "costs / expenses"}
          - content_key: ru.b2.unit07.lesson01.exercise04.order_predlagayu
            type: word_order
            tested_text: "Я предлагаю чтобы торт испекла я"
            prompt: {target_blocks: []}
            word_bank: ["Я", "предлагаю", "чтобы", "торт", "испекла", "я"]
          - content_key: ru.b2.unit07.lesson01.exercise05.translate_chto_esli
            type: translation
            tested_text: "Что если мы разделим расходы"
            prompt: {target_blocks: [{text: "Translate into Russian, proposing with что если мы: What if we split the costs?", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit07.lesson01.exercise06.speak_moyo_predlozhenie
            type: speak_response
            tested_text: "Моё предложение торт испечёшь ты"
            prompt: {target_blocks: [{text: "Say aloud in Russian, stating a term with моё предложение: My proposal is that you bake the cake.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit07.lesson01.exercise07.write_den_rozhdeniya
            type: writing_prompt
            tested_text: "Мы вместе устраиваем день рождения"
