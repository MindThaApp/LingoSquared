generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ru's B2
    negotiation unit, the third of the second-half wave (units 05-08). No
    adaptable intermediate/upper-level public-domain Russian source exists
    for this topic, so this was built from general Russian grammar/
    discourse knowledge, the same honest-disclosure precedent this unit's
    own B2 unit01-06 set. Sibling-isolation honored: the X->en B2
    realization and every nl/fa/prs/de B2 file were treated as
    non-existent and were NOT opened; the nl exemplar named in the dispatch
    prompt was consulted ONLY for unit shape (6 lessons, 44 exercises,
    spine outcome mapping), never for its content -- this unit
    deliberately negotiates a DIFFERENT everyday disagreement (organizing a
    friend's birthday party, not the Dutch exemplar's dinner-party-for-two)
    and every Russian sentence was authored fresh from first principles.
    Only ru's OWN earlier realization content (the Настя/Дима pair,
    established as Дима=engineer, Настя=teacher, informal ты register; see
    unit01-06) was consulted for character canon, which is not a
    sibling-direction violation. Настя and Дима are jointly organizing a
    birthday party for a mutual friend and must divide the work (baking
    the cake, buying decorations, cleaning up afterward); this introduces
    no canon conflict, since neither task is tied to either character's
    established profession.
review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Seventh Russian B2 unit; negotiation unit; third of the second-half
    wave (units 05-08), building on units 01-06 within the same B2 course.
    Targets the CEFR B2 negotiation outcome
    (universal.b2.negotiation.negotiate_and_resolve_disagreement):
    negotiate and resolve a disagreement -- state terms, decline a term,
    offer a CONDITIONAL concession, reach agreement. Theme: one coherent
    everyday disagreement across all six lessons -- Настя and Дима are
    jointly organizing a birthday party for a mutual friend and must
    divide the work (baking the cake, buying decorations, cleaning up) and
    split the cost. Lesson arc: L01 making a proposal / stating terms (я
    предлагаю, чтобы / давай / что если мы / моё предложение); L02
    declining politely (к сожалению, это не получится / я не могу / я не
    могу с этим согласиться / лучше не надо); L03 the core act, a
    conditional concession (если...то / но только если / при условии, что
    / разве что); L04 reaching agreement (договорились / хорошо /
    полностью согласен(на)) plus splitting the cost; L05 a written
    EXCHANGE of terms for the reading requirement (identify what was
    agreed and what remains open); L06 the culminating production -- a
    Настя/Дима dialogue for the listening requirement (identify what each
    side proposes, refuses, and the conditional concession offered), a
    speaking task that requires the WHOLE negotiation move (state terms +
    decline one + conditional concession), and a writing task that
    proposes revised terms while attaching a condition to a concession.
    Register: informal ты throughout, per the ru lane pin; Настя and Дима
    continue their established informal register. All vocabulary needed
    for this unit's own exercises is introduced within units 01-07 of this
    course (B2 is a separate Course row, so a B2 learner never sees
    A1/A2/B1 lexemes at runtime). No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked token coverage course-wide, character canon, dialogue cards
    vs audio, listen/dialogue distractors, example_glosses, overlay
    coverage, YAML booleans, internal-jargon notes, ё/е, pronoun and
    word-order grading gaps. Fixes (realization + en-ru overlay):
    lesson06.teach.sam_khochesh overlay entry added (title/gloss/note,
    сам vs сама); lesson06.exercise05.speak_full_move realization
    target_blocks aligned with the overlay instruction (learner plays
    Дима, so the male согласен key is determined) +"Я лучше не буду
    покупать украшения" order and уберешь variants;
    lesson06.exercise06.write_revised_terms prompt (realization +
    overlay) pinned to "a reply to Дима" so сам is determined;
    lesson04.teach.prishli_k_soglasheniyu title/gloss and
    lesson04.exercise03.match_agreeing pair right "we reach" -> "we
    reached an agreement" (realization + overlay);
    lesson05.exercise01-04 read_* now show the exchange as a ru
    target_block before the question; accepted answers widened:
    lesson01.exercise06.speak_moyo_predlozhenie (+"ты испечёшь торт"
    order, е variants), lesson01.exercise07.write_den_rozhdeniya
    (+"...день рождения вместе"),
    lesson02.exercise06.write_luchshe_ne_nado (+"Лучше не надо это/этого
    делать"), lesson02.exercise07.translate_ne_vsyo (+все and "не могу
    всё сделать" order), lesson03.exercise05.translate_pri_uslovii
    (+испечешь), lesson03.exercise07.write_ya_soglasen and
    lesson06.exercise07.respond_negotiate (+уберешь),
    lesson04.exercise06.write_polnostyu_soglasna (+"Я полностью
    согласна"), lesson04.exercise07.translate_podelim_schyot (+разделим
    and счет variants), lesson05.exercise06.translate_nekogda (+"Я не
    куплю украшения..."), lesson05.exercise07.write_zavtra (+3 natural
    word orders). NATIVE FLAGS: разве что + present "хочешь"
    (teach.razve_chto, sam_khochesh, write_revised_terms) may need
    "захочешь" / "если только ты сам не хочешь", and the note calling
    разве что "the negative conditional" needs checking; "Это лучше не
    надо делать" is colloquial. DEFERRED (owner/author decision, needs
    new audio): lesson06 dialogue logic -- Дима declines the decorations
    and "concedes" only by asking Настя to also clean up, so the
    showcase conditional concession gives nothing back (dialogue audio,
    teach.dialogue_dima_decline_concede, comprehend_condition,
    speak_full_move, grammar_polnyj); grader-level ё/е fold and ru
    optional subject pronouns (Codex lane).

    Second-pass review 2026-10-18: 5 fixes — lesson02.teach.ubirat: example
    word праздника added to introduced_tokens (it was used untaught) +
    overlay note glosses после праздника; lesson03.teach.razve_chto overlay
    note 'the negative conditional' -> 'unless (perhaps)', naming a possible
    exception, verb stays positive; lesson06.exercise03.comprehend_condition
    question 'What CONDITIONAL concession does Дима offer in return?' -> 'On
    what CONDITION does Дима agree to the plan?' (he gives nothing back in
    the audio; realization + overlay, feedback aligned);
    lesson05.exercise06.translate_nekogda +'Украшения я не буду покупать,
    потому что мне некогда' (the reading's own order);
    lesson06.exercise07.respond_negotiate +pronoun-drop 'Испеку торт, при
    условии, что ты уберёшь/уберешь после'. NATIVE FLAGS: разве что +
    present хочешь (захочешь? если только ты сам не хочешь?); same-subject
    'Я предлагаю, чтобы торт испекла я'; 'Это лучше не надо делать' (carried
    over). OWNER FLAG: the lesson06 dialogue's 'Но я согласен, при
    условии...' is a conditional agreement, not a give-back concession, yet
    speak_full_move and grammar_polnyj still call it a conditional
    concession.

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты throughout (ru lane pin). B2 negotiation layers proposing,
    declining and conditional-concession frames onto that register -- я
    предлагаю, чтобы / давай / к сожалению, это не получится / если...то /
    при условии, что / но только если / разве что / договорились -- while
    keeping everyday informal address. Настя and Дима continue the
    informal ты they use with each other in unit01-06.

