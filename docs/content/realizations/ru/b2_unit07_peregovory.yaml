          - content_key: ru.b2.unit07.lesson02.teach.ubirat
            kind: vocabulary
            target: {text: "убирать", language_code: ru, direction: ltr}
            introduced_tokens: [убирать, должен, должна, праздника]
            example: {text: "Я должен убирать после праздника.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit07.lesson02.teach.ne_vsyo
