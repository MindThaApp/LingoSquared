schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. Lesson
    4's "Numbers from 1-10" table (один, два, три, четыре, пять, шесть,
    семь, восемь, девять, десять) supplied the vocabulary set and its
    teaching order; every example sentence, exercise, dialogue snippet,
    and teaching note here was freshly authored for a natural 2026
    everyday-use context (counting objects, exchanging a phone number),
    not imported verbatim from the source (AUTHORING_GUIDE §10). Combining
    acute-accent stress marks were stripped from every learner-facing
    string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: native_speaker
  notes: >-
    Fresh-context full review (new-language lane, no sampling), 2026-07-12.
    Numeral-noun case agreement all correct: один брат / два брата / три
    книги / четыре книги / пять рублей / восемь книг / девять книг / Мне
    десять лет / один рубль / два рубля / пять рублей. listen_select
    "which number is last/second" prompts match the recorded number lists.
    Fixed 2 defects: listen_order_two_brothers and listen_order_nine_books
    pointed at the number-list audio (numbers_1_5 / numbers_6_10), which do
    not contain the tested sentences — added
    ru.a1.audio.u_menya_dva_brata.neutral.01 and
    ru.a1.audio.u_menya_devyat_knig.neutral.01 and repointed. matching_pairs
    §16 warnings (5-pair 1-5 set in the 1-5 lesson; 3-pair price set) are
    genuine per-lesson ceilings, not padded. Native-speaker review pending.

    Second-pass review 2026-10-18: 3 fixes -- lesson01.exercise03.listen_select_five and lesson02.exercise03.listen_select_seven: prompt asked for the last/second number but the audio is a single word, now "Which number do you hear?"; lesson03.exercise09.write_market_exchange: underdetermined prompt now names question and price (five rubles). NATIVE FLAGS: market prices (apples 3 rubles, bread 6 rubles) are unrealistically low for present-day Russia.

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit is number-focused; the вы/ты distinction still applies to any
    surrounding dialogue (вы for the shop clerk/stranger scenes here).

media_assets:
  - {content_key: ru.a1.audio.numbers_1_5.neutral.01, language: ru, text: "один, два, три, четыре, пять", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.numbers_6_10.neutral.01, language: ru, text: "шесть, семь, восемь, девять, десять", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.number_five.neutral.01, language: ru, text: "пять", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.number_seven.neutral.01, language: ru, text: "семь", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.skolko_stoit.formal.01, language: ru, text: "Сколько это стоит?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.pyat_rubley.neutral.01, language: ru, text: "Пять рублей.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.skolko_vam_let.formal.01, language: ru, text: "Сколько вам лет?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.mne_desyat_let.neutral.01, language: ru, text: "Мне десять лет.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.u_menya_dva_brata.neutral.01, language: ru, text: "У меня два брата.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.u_menya_devyat_knig.neutral.01, language: ru, text: "У меня девять книг.", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.market_stall.01
    language: ru
    text: >-
      Покупатель: Здравствуйте! Сколько стоят яблоки? Продавец: Три
      рубля. Покупатель: А сколько стоит хлеб? Продавец: Шесть рублей.
      Покупатель: Хорошо, спасибо!
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit03.numbers
    title: "Числа"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.numbers.use_basic_numbers
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit03.lesson01.chisla_1_5
        title: "Числа от одного до пяти"
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - {content_key: ru.a1.unit03.lesson01.teach.u_menya, kind: phrase, target: {text: "У меня ...", language_code: ru, direction: ltr}, introduced_tokens: [У, меня]}
          - content_key: ru.a1.unit03.lesson01.teach.odin_dva
            kind: vocabulary
            target: {text: "один, два", language_code: ru, direction: ltr}
            introduced_tokens: [один, два]
            example:
              - {text: "У меня один брат.", language_code: ru, direction: ltr}
              - {text: "У меня два брата.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit03.lesson01.teach.tri_chetyre
            kind: vocabulary
            target: {text: "три, четыре", language_code: ru, direction: ltr}
            introduced_tokens: [три, четыре]
            example:
              - {text: "У меня три книги.", language_code: ru, direction: ltr}
              - {text: "У меня четыре книги.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit03.lesson01.teach.pyat
            kind: vocabulary
            target: {text: "пять", language_code: ru, direction: ltr}
            introduced_tokens: [пять]
            example: {text: "У меня пять рублей.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit03.lesson01.teach.brat_bratya, kind: vocabulary, target: {text: "брат, брата", language_code: ru, direction: ltr}, introduced_tokens: [брат, брата], example: {text: "У меня два брата.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit03.lesson01.teach.kniga_knigi, kind: vocabulary, target: {text: "книга, книги", language_code: ru, direction: ltr}, introduced_tokens: [книга, книги], example: {text: "У меня три книги.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit03.lesson01.teach.rubl_rubley, kind: vocabulary, target: {text: "рубль, рублей", language_code: ru, direction: ltr}, introduced_tokens: [рубль, рублей], example: {text: "У меня пять рублей.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit03.lesson01.exercise01.recognize_two
            type: multiple_choice
            tested_text: "два"
            prompt: {target_blocks: [{text: "2", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson01.exercise02.recognize_four
            type: multiple_choice
            tested_text: "четыре"
            prompt: {target_blocks: [{text: "4", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson01.exercise03.listen_select_five
            type: listen_select
            tested_text: "пять"
            media_asset_key: ru.a1.audio.number_five.neutral.01
            prompt: {target_blocks: [{text: "Which number do you hear?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson01.exercise04.match_digits
            type: matching_pairs
            tested_text: "один два три четыре пять"
            prompt: {target_blocks: []}
            pairs:
              - {left: "один", right: "1"}
              - {left: "два", right: "2"}
              - {left: "три", right: "3"}
              - {left: "четыре", right: "4"}
              - {left: "пять", right: "5"}
          - content_key: ru.a1.unit03.lesson01.exercise05.order_three_books
            type: word_order
            tested_text: "У меня три книги"
            prompt: {target_blocks: []}
            word_bank: ["книги", "три", "У", "меня"]
          - content_key: ru.a1.unit03.lesson01.exercise06.listen_order_two_brothers
            type: listen_order
            tested_text: "У меня два брата"
            media_asset_key: ru.a1.audio.u_menya_dva_brata.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["брата", "два", "У", "меня"]
          - content_key: ru.a1.unit03.lesson01.exercise07.complete_number
            type: fill_in_blank
            tested_text: "У меня пять рублей"
            prompt: {target_blocks: [{text: "У меня ___ рублей. (5)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson01.exercise08.write_count
            type: writing_prompt
            tested_text: "У меня четыре"
            prompt: {target_blocks: [{text: "Write a sentence saying you have four of something, using \"У меня четыре ...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit03.lesson02.chisla_6_10
        title: "Числа от шести до десяти"
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - content_key: ru.a1.unit03.lesson02.teach.shest_sem
            kind: vocabulary
            target: {text: "шесть, семь", language_code: ru, direction: ltr}
            introduced_tokens: [шесть, семь]
            example:
              - {text: "Сейчас шесть часов.", language_code: ru, direction: ltr}
              - {text: "У меня семь рублей.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit03.lesson02.teach.vosem_devyat
            kind: vocabulary
            target: {text: "восемь, девять", language_code: ru, direction: ltr}
            introduced_tokens: [восемь, девять]
            example:
              - {text: "У меня восемь книг.", language_code: ru, direction: ltr}
              - {text: "У меня девять рублей.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit03.lesson02.teach.desyat
            kind: vocabulary
            target: {text: "десять", language_code: ru, direction: ltr}
            introduced_tokens: [десять]
            example: {text: "Мне десять лет.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit03.lesson02.teach.kniga_genitive_plural, kind: vocabulary, target: {text: "книг", language_code: ru, direction: ltr}, introduced_tokens: [книг], example: {text: "У меня девять книг.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit03.lesson02.teach.mne_let, kind: phrase, target: {text: "Мне десять лет.", language_code: ru, direction: ltr}, introduced_tokens: [Мне, лет]}
          - {content_key: ru.a1.unit03.lesson02.teach.skolko_vam_let, kind: phrase, target: {text: "Сколько вам лет?", language_code: ru, direction: ltr}, introduced_tokens: [Сколько, вам, лет]}
        exercises:
          - content_key: ru.a1.unit03.lesson02.exercise01.recognize_eight
            type: multiple_choice
            tested_text: "восемь"
            prompt: {target_blocks: [{text: "8", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson02.exercise02.recognize_ten
            type: multiple_choice
            tested_text: "десять"
            prompt: {target_blocks: [{text: "10", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson02.exercise03.listen_select_seven
            type: listen_select
            tested_text: "семь"
            media_asset_key: ru.a1.audio.number_seven.neutral.01
            prompt: {target_blocks: [{text: "Which number do you hear?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson02.exercise04.match_digits_high
            type: matching_pairs
            tested_text: "один два три четыре пять шесть семь восемь девять десять"
            prompt: {target_blocks: []}
            pairs:
              - {left: "один", right: "1"}
              - {left: "два", right: "2"}
              - {left: "три", right: "3"}
              - {left: "четыре", right: "4"}
              - {left: "пять", right: "5"}
              - {left: "шесть", right: "6"}
              - {left: "семь", right: "7"}
              - {left: "восемь", right: "8"}
              - {left: "девять", right: "9"}
              - {left: "десять", right: "10"}
          - content_key: ru.a1.unit03.lesson02.exercise05.order_age_sentence
            type: word_order
            tested_text: "Мне десять лет"
            prompt: {target_blocks: []}
            word_bank: ["лет", "десять", "Мне"]
          - content_key: ru.a1.unit03.lesson02.exercise06.listen_order_nine_books
            type: listen_order
            tested_text: "У меня девять книг"
            media_asset_key: ru.a1.audio.u_menya_devyat_knig.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["книг", "девять", "У", "меня"]
          - content_key: ru.a1.unit03.lesson02.exercise07.complete_age
            type: fill_in_blank
            tested_text: "Сколько вам лет"
            prompt: {target_blocks: [{text: "___ вам лет? (How old are you? — formal)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson02.exercise08.listen_type_age
            type: listen_type
            tested_text: "Мне десять лет"
            media_asset_key: ru.a1.audio.mne_desyat_let.neutral.01
            prompt: {target_blocks: []}
          - {content_key: ru.a1.unit03.lesson02.chisla_6_10.exercise09.dictation_mne_desyat_let_neutral, type: dictation, tested_text: "Мне десять лет", media_asset_key: ru.a1.audio.mne_desyat_let.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit03.lesson03.na_rynke
        title: "На рынке: считаем деньги"
        spine_outcome_id: universal.a1.numbers.use_basic_numbers
        teaching:
          - {content_key: ru.a1.unit03.lesson03.teach.skolko_stoit, kind: phrase, target: {text: "Сколько это стоит?", language_code: ru, direction: ltr}, introduced_tokens: [Сколько, это, стоит]}
          - {content_key: ru.a1.unit03.lesson03.teach.skolko_stoyat, kind: phrase, target: {text: "Сколько стоят яблоки?", language_code: ru, direction: ltr}, introduced_tokens: [Сколько, стоят, яблоки]}
          - content_key: ru.a1.unit03.lesson03.teach.rubley
            kind: vocabulary
            target: {text: "рубль, рубля, рублей", language_code: ru, direction: ltr}
            introduced_tokens: [рубль, рубля, рублей]
            example:
              - {text: "Это стоит один рубль.", language_code: ru, direction: ltr}
              - {text: "Это стоит два рубля.", language_code: ru, direction: ltr}
              - {text: "Это стоит пять рублей.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit03.lesson03.teach.pokupatel_greeting, kind: dialogue, target: {text: "Покупатель: Здравствуйте! Сколько стоят яблоки?", language_code: ru, direction: ltr}, introduced_tokens: [Покупатель, Здравствуйте, Сколько, стоят, яблоки]}
          - {content_key: ru.a1.unit03.lesson03.teach.prodavets_apples, kind: dialogue, target: {text: "Продавец: Три рубля.", language_code: ru, direction: ltr}, introduced_tokens: [Продавец, Три, рубля]}
          - {content_key: ru.a1.unit03.lesson03.teach.pokupatel_bread, kind: dialogue, target: {text: "Покупатель: А сколько стоит хлеб?", language_code: ru, direction: ltr}, introduced_tokens: [Покупатель, А, сколько, стоит, хлеб]}
          - {content_key: ru.a1.unit03.lesson03.teach.prodavets_bread, kind: dialogue, target: {text: "Продавец: Шесть рублей.", language_code: ru, direction: ltr}, introduced_tokens: [Продавец, Шесть, рублей]}
          - {content_key: ru.a1.unit03.lesson03.teach.pokupatel_close, kind: dialogue, target: {text: "Покупатель: Хорошо, спасибо!", language_code: ru, direction: ltr}, introduced_tokens: [Покупатель, Хорошо, спасибо]}
        exercises:
          - content_key: ru.a1.unit03.lesson03.exercise01.choose_price_question
            type: multiple_choice
            tested_text: "Сколько это стоит"
            prompt: {target_blocks: [{text: "You want to ask the price of an item at a market stall.", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson03.exercise02.listen_select_price_question
            type: listen_select
            tested_text: "Сколько это стоит"
            media_asset_key: ru.a1.audio.skolko_stoit.formal.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit03.lesson03.exercise03.dialogue_comprehension_prices
            type: dialogue_comprehension
            tested_text: "яблоки три рубля хлеб шесть рублей"
            media_asset_key: ru.a1.audio.dialogue.market_stall.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit03.lesson03.exercise04.match_prices
            type: matching_pairs
            tested_text: "один рубль два рубля пять рублей"
            prompt: {target_blocks: []}
            pairs:
              - {left: "один рубль", right: "1 ruble"}
              - {left: "два рубля", right: "2 rubles"}
              - {left: "пять рублей", right: "5 rubles"}
          - content_key: ru.a1.unit03.lesson03.exercise05.order_price_answer
            type: word_order
            tested_text: "Пять рублей"
            prompt: {target_blocks: []}
            word_bank: ["рублей", "Пять"]
          - content_key: ru.a1.unit03.lesson03.exercise06.listen_order_price
            type: listen_order
            tested_text: "Пять рублей"
            media_asset_key: ru.a1.audio.pyat_rubley.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["рублей", "Пять"]
          - content_key: ru.a1.unit03.lesson03.exercise07.reply_price_question
            type: dialogue_response
            tested_text: "Три рубля"
            prompt: {target_blocks: [{text: "Сколько стоят яблоки?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson03.exercise08.complete_price
            type: fill_in_blank
            tested_text: "Шесть рублей"
            prompt: {target_blocks: [{text: "Сколько стоит хлеб? — ___ рублей. (6)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit03.lesson03.exercise09.write_market_exchange
            type: writing_prompt
            tested_text: "Сколько это стоит рублей"
            prompt: {target_blocks: [{text: "Write a short market exchange: ask how much this costs (Сколько это стоит?) and answer that it costs five rubles.", language_code: en, direction: ltr}]}
