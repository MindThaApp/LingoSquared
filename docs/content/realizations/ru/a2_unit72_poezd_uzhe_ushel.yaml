          - {"content_key": "ru.a2.unit72.lesson05.teach.reading", "kind": "reading", "target": {"text": "Привет, Настя! Я опоздал на поезд. Я забыл телефон дома, поэтому не позвонил тебе раньше. Когда я пришёл на вокзал, поезд уже ушёл. После того как поезд ушёл, я купил билет на другой поезд. Ты ещё не пришла домой? Дима", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Привет", "привет", "Настя", "настя", "Я", "я", "опоздал", "на", "поезд", "забыл", "телефон", "дома", "поэтому", "не", "позвонил", "тебе", "раньше", "Когда", "когда", "пришёл", "вокзал", "уже", "ушёл", "После", "после", "того", "как", "купил", "билет", "другой", "Ты", "ты", "ещё", "пришла", "домой", "Дима", "дима"]}
        exercises:
          - {"content_key": "ru.a2.unit72.lesson05.exercise01.read_why", "type": "reading_comprehension", "tested_text": "Я забыл телефон дома поэтому не позвонил тебе раньше", "prompt": {"target_blocks": [{"text": "Why did Dima not call Nastya earlier?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit72.lesson05.exercise02.read_what", "type": "reading_comprehension", "tested_text": "Когда я пришёл на вокзал поезд уже ушёл", "prompt": {"target_blocks": [{"text": "What had already happened when Dima reached the station?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit72.lesson05.exercise03.match_message", "type": "matching_pairs", "tested_text": "Привет опоздал на поезд забыл телефон дома вокзал другой билет ещё не домой", "prompt": {"target_blocks": []}, "pairs": [{"left": "Привет", "right": "Hi"}, {"left": "опоздал на поезд", "right": "was late for the train"}, {"left": "забыл телефон дома", "right": "forgot his phone at home"}, {"left": "вокзал", "right": "station"}, {"left": "другой", "right": "other, another"}, {"left": "билет", "right": "ticket"}, {"left": "ещё не", "right": "not yet"}, {"left": "домой", "right": "home (going there)"}]}
