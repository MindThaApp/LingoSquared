          - {"content_key": "ru.a2.unit72.lesson06.exercise02.comprehend_train", "type": "dialogue_comprehension", "tested_text": "Когда я пришёл поезд уже ушёл", "prompt": {"target_blocks": [{"text": "What had already happened when Dima arrived at the station?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "ru.a2.audio.dialogue.poezd_uzhe_ushel.01"}
          - {"content_key": "ru.a2.unit72.lesson06.exercise03.match_dialogue", "type": "matching_pairs", "tested_text": "Где ты Я на вокзале Поезд уже ушёл Ой как жаль Я уже ушла домой Ничего Я уже купил билет на другой поезд Почему ты не позвонил раньше", "prompt": {"target_blocks": []}, "pairs": [{"left": "Где ты?", "right": "Where are you?"}, {"left": "Я на вокзале.", "right": "I am at the station."}, {"left": "Поезд уже ушёл.", "right": "The train has already left."}, {"left": "Ой, как жаль!", "right": "Oh, what a pity!"}, {"left": "Я уже ушла домой.", "right": "I (a woman) have already gone home."}, {"left": "Ничего.", "right": "Never mind."}, {"left": "Я уже купил билет на другой поезд.", "right": "I (a man) have already bought a ticket for another train."}, {"left": "Почему ты не позвонил раньше?", "right": "Why did you not call earlier?"}]}
          - {"content_key": "ru.a2.unit72.lesson06.exercise04.order_ticket", "type": "word_order", "tested_text": "Я уже купил билет на другой поезд", "prompt": {"target_blocks": []}, "word_bank": ["я", "уже", "купил", "билет", "на", "другой", "поезд"]}
          - {"content_key": "ru.a2.unit72.lesson06.exercise05.respond_why", "type": "dialogue_response", "tested_text": "Я забыл телефон дома", "prompt": {"target_blocks": [{"text": "Почему ты не позвонил раньше?", "language_code": "ru", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit72.lesson06.exercise06.translate_bought", "type": "translation", "tested_text": "Я уже купил билет", "prompt": {"target_blocks": [{"text": "I have already bought a ticket.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit72.lesson06.exercise07.write_story", "type": "writing_prompt", "tested_text": "Когда я пришёл поезд уже ушёл Потом я позвонил Насте", "prompt": {"target_blocks": [{"text": "Write two Russian sentences as Dima: (1) When you arrived, the train had already left. (2) Then you called Nastya.", "language_code": "en", "direction": "ltr"}]}}
