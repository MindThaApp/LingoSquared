          - {"content_key": "ru.a2.unit72.lesson06.teach.t4_bilet", "kind": "dialogue", "target": {"text": "Ничего. Я уже купил билет на другой поезд.", "language_code": "ru", "direction": "ltr", "speaker": "Дима"}, "introduced_tokens": ["Ничего", "ничего", "Я", "я", "уже", "купил", "билет", "на", "другой", "поезд"]}
          - {"content_key": "ru.a2.unit72.lesson06.teach.t5_pochemu", "kind": "dialogue", "target": {"text": "Хорошо. А почему ты не позвонил раньше?", "language_code": "ru", "direction": "ltr", "speaker": "Настя"}, "introduced_tokens": ["Хорошо", "хорошо", "А", "а", "почему", "ты", "не", "позвонил", "раньше"]}
          - {"content_key": "ru.a2.unit72.lesson06.teach.t6_telefon", "kind": "dialogue", "target": {"text": "Я забыл телефон дома. Сейчас я звоню с другого телефона.", "language_code": "ru", "direction": "ltr", "speaker": "Дима"}, "introduced_tokens": ["Я", "я", "забыл", "телефон", "дома", "Сейчас", "сейчас", "звоню", "с", "другого", "телефона"]}
        exercises:
