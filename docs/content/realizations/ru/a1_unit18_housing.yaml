  notes: "Fresh-context review 2026-07-12 (AUTHORING_GUIDE §20): prepositions of place verified — в + prepositional (в спальне / в гостиной / в квартире) and the на кухне idiom (kitchen takes на, not в) are both correct as taught; Две комнаты (feminine две + genitive singular) correct; сколько комнат genitive plural correct. One defect fixed: lesson03's second teaching card attributed Дима's audio line \"Сколько комнат в квартире?\" to Настя (making her ask how many rooms are in her own apartment, contradicting the dialogue audio) — split into a Настя card (Я живу в квартире.) and a Дима card (Сколько комнат в квартире?). Flagged for the content lane: the ванная card's example \"Ванная рядом со спальней.\" is correct Russian but leans on рядом с + instrumental, which the course never teaches (AUTHORING_GUIDE §19 prefers an example needing no second explanation)."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian for describing a home: rooms,
    furniture, and basic prepositions of place. Continues the informal ты
    register between friends Настя and Дима established in units 11-15/17.

media_assets:
  - {content_key: ru.a1.audio.eto_moya_kvartira.neutral.01, language: ru, text: "Это моя квартира.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.divan_v_gostinoy.neutral.01, language: ru, text: "Диван в гостиной.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.gde_ty_zhivyosh.neutral.01, language: ru, text: "Настя, где ты живёшь?", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.moya_kvartira.01
    language: ru
    text: >-
      Дима: Настя, где ты живёшь? Настя: Я живу в квартире. Дима: Сколько
      комнат в квартире? Настя: Две комнаты: спальня и гостиная. Кухня и
      ванная тоже есть.
    voice_hint: two_adults_neutral
    status: pending_generation

units:
  - content_key: ru.a1.unit18.housing
    title: "Это моя квартира"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.housing.describe_home
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
        title: "Это моя квартира"
        spine_outcome_id: universal.a1.housing.describe_home
        teaching:
          - {content_key: ru.a1.unit18.lesson01.teach.eto_moya_kvartira, kind: phrase, target: {text: "Это моя квартира.", language_code: ru, direction: ltr}, introduced_tokens: [Это, моя, квартира]}
          - {content_key: ru.a1.unit18.lesson01.teach.kuhnya, kind: vocabulary, target: {text: "кухня", language_code: ru, direction: ltr}, introduced_tokens: [кухня, стол, на, кухне], example: {text: "На кухне стол.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit18.lesson01.teach.spalnya, kind: vocabulary, target: {text: "спальня", language_code: ru, direction: ltr}, introduced_tokens: [спальня, кровать, в, спальне], example: {text: "В спальне кровать.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit18.lesson01.exercise01.recognize_kvartira
            type: multiple_choice
            tested_text: "квартира"
            prompt: {target_blocks: [{text: "apartment", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson01.exercise02.recognize_kuhnya
            type: multiple_choice
            tested_text: "кухня"
            prompt: {target_blocks: [{text: "kitchen", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson01.exercise03.listen_select_eto_moya_kvartira
            type: listen_select
            tested_text: "Это моя квартира"
            media_asset_key: ru.a1.audio.eto_moya_kvartira.neutral.01
            prompt: {target_blocks: [{text: "What is the speaker showing?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson01.exercise04.match_room_words
            type: matching_pairs
            tested_text: "квартира кухня спальня стол кровать"
            prompt: {target_blocks: []}
            pairs:
              - {left: "квартира", right: "apartment"}
              - {left: "кухня", right: "kitchen"}
              - {left: "спальня", right: "bedroom"}
              - {left: "стол", right: "table"}
              - {left: "кровать", right: "bed"}
              - {left: "Это моя квартира.", right: "This is my apartment."}
          - content_key: ru.a1.unit18.lesson01.exercise05.order_eto_moya_kvartira
            type: word_order
            tested_text: "Это моя квартира"
            prompt: {target_blocks: []}
            word_bank: ["моя", "Это", "квартира"]
          - content_key: ru.a1.unit18.lesson01.exercise06.listen_order_eto_moya_kvartira
            type: listen_order
            tested_text: "Это моя квартира"
            media_asset_key: ru.a1.audio.eto_moya_kvartira.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["квартира", "Это", "моя"]
          - content_key: ru.a1.unit18.lesson01.exercise07.complete_na_kuhne_stol
            type: fill_in_blank
            tested_text: "На кухне стол"
            prompt: {target_blocks: [{text: "На ___ стол. (in the kitchen)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson01.exercise08.write_about_bedroom
            type: writing_prompt
            tested_text: "В спальне кровать"
            prompt: {target_blocks: [{text: "Write a sentence saying there is a bed in the bedroom, using \"В спальне\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
        title: "Диван в гостиной"
        spine_outcome_id: universal.a1.housing.describe_home
        teaching:
          - {content_key: ru.a1.unit18.lesson02.teach.divan_v_gostinoy, kind: phrase, target: {text: "Диван в гостиной.", language_code: ru, direction: ltr}, introduced_tokens: [Диван, гостиной, гостиная]}
          - {content_key: ru.a1.unit18.lesson02.teach.stol_na_kuhne, kind: vocabulary, target: {text: "на", language_code: ru, direction: ltr}, introduced_tokens: [на], example: {text: "Стол на кухне.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit18.lesson02.teach.vannaya, kind: vocabulary, target: {text: "ванная", language_code: ru, direction: ltr}, introduced_tokens: [ванная], example: {text: "Ванная рядом со спальней.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit18.lesson02.exercise01.recognize_divan
            type: multiple_choice
            tested_text: "диван"
            prompt: {target_blocks: [{text: "sofa", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson02.exercise02.recognize_gostinaya
            type: multiple_choice
            tested_text: "гостиной"
            prompt: {target_blocks: [{text: "living room", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson02.exercise03.listen_select_divan_v_gostinoy
            type: listen_select
            tested_text: "Диван в гостиной"
            media_asset_key: ru.a1.audio.divan_v_gostinoy.neutral.01
            prompt: {target_blocks: [{text: "Where is the sofa?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson02.exercise04.match_furniture_words
            type: matching_pairs
            tested_text: "диван гостиной стол кухне ванная кровать"
            prompt: {target_blocks: []}
            pairs:
              - {left: "диван", right: "sofa"}
              - {left: "гостиная", right: "living room"}
              - {left: "стол", right: "table"}
              - {left: "ванная", right: "bathroom"}
              - {left: "Стол на кухне.", right: "The table is in the kitchen."}
              - {left: "Диван в гостиной.", right: "The sofa is in the living room."}
          - content_key: ru.a1.unit18.lesson02.exercise05.order_divan_v_gostinoy
            type: word_order
            tested_text: "Диван в гостиной"
            prompt: {target_blocks: []}
            word_bank: ["в", "Диван", "гостиной"]
          - content_key: ru.a1.unit18.lesson02.exercise06.listen_order_divan_v_gostinoy
            type: listen_order
            tested_text: "Диван в гостиной"
            media_asset_key: ru.a1.audio.divan_v_gostinoy.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["гостиной", "Диван", "в"]
          - content_key: ru.a1.unit18.lesson02.exercise07.complete_stol_na_kuhne
            type: fill_in_blank
            tested_text: "Стол на кухне"
            prompt: {target_blocks: [{text: "Стол ___ кухне. (on/at)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson02.exercise08.write_where_sofa_is
            type: writing_prompt
            tested_text: "Диван в гостиной"
            prompt: {target_blocks: [{text: "Write a sentence saying the sofa is in the living room.", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit18.lesson02.divan_v_gostinoy.exercise09.dictation_divan_v_gostinoy_neutral, type: dictation, tested_text: "Диван в гостиной", media_asset_key: ru.a1.audio.divan_v_gostinoy.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
        title: "Диалог: моя квартира"
        spine_outcome_id: universal.a1.housing.describe_home
        teaching:
          - {content_key: ru.a1.unit18.lesson03.teach.dima_gde_ty_zhivyosh, kind: dialogue, target: {text: "Настя, где ты живёшь?", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [где, живёшь, ты]}
          - {content_key: ru.a1.unit18.lesson03.teach.nastya_zhivu_v_kvartire, kind: dialogue, target: {text: "Я живу в квартире.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [живу, я, квартире]}
          - {content_key: ru.a1.unit18.lesson03.teach.dima_skolko_komnat, kind: dialogue, target: {text: "Сколько комнат в квартире?", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [Сколько, комнат]}
          - {content_key: ru.a1.unit18.lesson03.teach.nastya_dve_komnaty, kind: dialogue, target: {text: "Две комнаты: спальня и гостиная. Кухня и ванная тоже есть.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [Две, комнаты, тоже, есть, и, гостиная]}
        exercises:
          - content_key: ru.a1.unit18.lesson03.exercise01.choose_ask_where_live
            type: multiple_choice
            tested_text: "где ты живёшь"
            prompt: {target_blocks: [{text: "You want to ask a friend where they live. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson03.exercise02.listen_select_gde_ty_zhivyosh
            type: listen_select
            tested_text: "где ты живёшь"
            media_asset_key: ru.a1.audio.gde_ty_zhivyosh.neutral.01
            prompt: {target_blocks: [{text: "What is Dima asking?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson03.exercise03.dialogue_comprehension_moya_kvartira
            type: dialogue_comprehension
            tested_text: "живу комнат спальня гостиная кухня ванная"
            media_asset_key: ru.a1.audio.dialogue.moya_kvartira.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit18.lesson03.exercise04.match_dialogue_lines
            type: matching_pairs
            tested_text: "живёшь живу комнат спальня гостиная кухня ванная"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Настя, где ты живёшь?", right: "Nastya, where do you live?"}
              - {left: "Я живу в квартире.", right: "I live in an apartment."}
              - {left: "Сколько комнат в квартире?", right: "How many rooms in the apartment?"}
              - {left: "Две комнаты: спальня и гостиная.", right: "Two rooms: a bedroom and a living room."}
              - {left: "Кухня и ванная тоже есть.", right: "There's also a kitchen and a bathroom."}
              - {left: "Это моя квартира.", right: "This is my apartment."}
          - content_key: ru.a1.unit18.lesson03.exercise05.order_ya_zhivu_v_kvartire
            type: word_order
            tested_text: "Я живу в квартире"
            prompt: {target_blocks: []}
            word_bank: ["живу", "Я", "в", "квартире"]
          - content_key: ru.a1.unit18.lesson03.exercise06.reply_gde_ty_zhivyosh
            type: dialogue_response
            tested_text: "Я живу в квартире"
            prompt: {target_blocks: [{text: "Где ты живёшь?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson03.exercise07.complete_dve_komnaty
            type: fill_in_blank
            tested_text: "Две комнаты: спальня и гостиная"
            prompt: {target_blocks: [{text: "___ комнаты: спальня и гостиная. (two)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit18.lesson03.exercise08.write_describe_your_home
            type: writing_prompt
            tested_text: "Я живу в квартире"
            prompt: {target_blocks: [{text: "Write two or three sentences describing your home: what kind of home it is and what rooms it has.", language_code: en, direction: ltr}]}
