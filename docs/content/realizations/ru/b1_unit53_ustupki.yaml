course:
  realization_key: ru.b1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Use contemporary standard Russian. Use formal вы in offices and with staff
    and colleagues; use informal ты between recurring friends Настя и Дима.
    Canon: Дима is an engineer and Настя is a teacher.

