schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. The
    line "Завтра мы пойдём в музей" ("Tomorrow we'll go to the museum")
    supplied the future-plan pattern (пойдём + destination + завтра),
    combined with the "Давайте..." (let's...) proposal construction
    common throughout the course's invitational exchanges. Every example
    sentence, exercise, and dialogue here was freshly authored for a
    natural 2026 everyday-use context (proposing, accepting, declining,
    and scheduling a simple near-future plan), not imported verbatim
    from the source (AUTHORING_GUIDE §10). Combining acute-accent stress
    marks were stripped from every learner-facing string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: "Fresh-context review 2026-07-12: grammar/register/idiom verified; pooled matching_pairs to §16 aim; compiler 0 errors.\n\nSecond-pass review 2026-10-18: 6 fixes — lesson03.exercise08.write_plan_message: open-ended 'what day and time' -> names Saturday at seven, plus е/ё and word-order variants; lesson03.exercise06 reply: added female 'согласна' and 'Я согласен/согласна' variants (feedback notes согласна); lesson02.exercise08: added согласна, bare 'Я согласен/Я не могу' variants; lesson01.exercise08: added 'Давай завтра пойдём в кино' and пойдем variants; word_order lesson01.exercise05 'Давай завтра пойдём в кино' and lesson02.exercise05 'Я, к сожалению, не могу' alternates. NATIVE FLAGS: none"

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit covers proposing, accepting, declining, and scheduling a simple
    near-future plan, using an informal ты register appropriate between
    friends making plans.

media_assets:
  - {content_key: ru.a1.audio.davay_poydyom_v_kino.neutral.01, language: ru, text: "Давай пойдём в кино завтра.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.horosho_soglasen.neutral.01, language: ru, text: "Хорошо, я согласен.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.k_sozhaleniyu_ne_mogu.neutral.01, language: ru, text: "К сожалению, я не могу.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.vo_skolko_vstretimsya.neutral.01, language: ru, text: "Во сколько мы встретимся?", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.davay_v_sem_chasov.neutral.01, language: ru, text: "Давай в семь часов.", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.plany_na_subbotu.01
    language: ru
    text: >-
      Настя: Давай пойдём в кино в субботу. Дима: Хорошо, я согласен. Во
      сколько мы встретимся? Настя: Давай в семь часов, у кинотеатра.
      Дима: Отлично, до субботы.
    voice_hint: two_adults_neutral
    status: pending_generation

units:
  - content_key: ru.a1.unit12.plans
    title: "Наши планы"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.plans.make_simple_plans
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit12.lesson01.davay_poydyom
        title: "Давай пойдём..."
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - {content_key: ru.a1.unit12.lesson01.teach.davay, kind: phrase, target: {text: "Давай пойдём...", language_code: ru, direction: ltr}, introduced_tokens: [Давай, пойдём]}
          - {content_key: ru.a1.unit12.lesson01.teach.kino, kind: vocabulary, target: {text: "кино", language_code: ru, direction: ltr}, introduced_tokens: [кино, в], example: {text: "Давай пойдём в кино.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit12.lesson01.teach.zavtra_subbotu, kind: vocabulary, target: {text: "завтра, в субботу", language_code: ru, direction: ltr}, introduced_tokens: [завтра, субботу], example: {text: "Давай пойдём в кино завтра.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit12.lesson01.exercise01.recognize_davay
            type: multiple_choice
            tested_text: "давай"
            prompt: {target_blocks: [{text: "let's (informal proposal)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson01.exercise02.recognize_zavtra
            type: multiple_choice
            tested_text: "завтра"
            prompt: {target_blocks: [{text: "tomorrow", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson01.exercise03.listen_select_davay_poydyom
            type: listen_select
            tested_text: "Давай пойдём в кино завтра"
            media_asset_key: ru.a1.audio.davay_poydyom_v_kino.neutral.01
            prompt: {target_blocks: [{text: "What is being proposed?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson01.exercise04.match_plan_words
            type: matching_pairs
            tested_text: "давай пойдём кино завтра субботу"
            prompt: {target_blocks: []}
            pairs:
              - {left: "давай", right: "let's"}
              - {left: "пойдём", right: "let's go"}
              - {left: "кино", right: "the movies"}
              - {left: "завтра", right: "tomorrow"}
              - {left: "в субботу", right: "on Saturday"}
              - {left: "Давай пойдём в кино.", right: "Let's go to the movies."}
          - content_key: ru.a1.unit12.lesson01.exercise05.order_davay_poydyom_v_kino
            type: word_order
            tested_text: "Давай пойдём в кино завтра"
            prompt: {target_blocks: []}
            word_bank: ["пойдём", "Давай", "в", "кино", "завтра"]
          - content_key: ru.a1.unit12.lesson01.exercise06.listen_order_davay_poydyom
            type: listen_order
            tested_text: "Давай пойдём в кино завтра"
            media_asset_key: ru.a1.audio.davay_poydyom_v_kino.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["в", "Давай", "пойдём", "кино", "завтра"]
          - content_key: ru.a1.unit12.lesson01.exercise07.complete_davay_poydyom
            type: fill_in_blank
            tested_text: "Давай пойдём в кино"
            prompt: {target_blocks: [{text: "___ пойдём в кино. (let's, informal)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson01.exercise08.write_propose_plan
            type: writing_prompt
            tested_text: "Давай пойдём в кино завтра"
            prompt: {target_blocks: [{text: "Write a sentence proposing to go to the movies tomorrow, using \"Давай пойдём...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
        title: "Согласен / не могу"
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - content_key: ru.a1.unit12.lesson02.teach.soglasen
            kind: phrase
            target: {text: "Хорошо, я согласен.", language_code: ru, direction: ltr}
            introduced_tokens: [Хорошо, согласен, Я, я]
          - content_key: ru.a1.unit12.lesson02.teach.ne_mogu
            kind: phrase
            target: {text: "К сожалению, я не могу.", language_code: ru, direction: ltr}
            introduced_tokens: [К, к, сожалению, не, могу]
          - content_key: ru.a1.unit12.lesson02.teach.vo_skolko
            kind: phrase
            target: {text: "Во сколько мы встретимся?", language_code: ru, direction: ltr}
            introduced_tokens: [Во, сколько, мы, встретимся, семь, часов]
            example: {text: "Давай в семь часов.", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit12.lesson02.exercise01.recognize_soglasen
            type: multiple_choice
            tested_text: "согласен"
            prompt: {target_blocks: [{text: "agreed (male speaker)", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson02.exercise02.recognize_ne_mogu
            type: multiple_choice
            tested_text: "не могу"
            prompt: {target_blocks: [{text: "I can't", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson02.exercise03.listen_select_vo_skolko
            type: listen_select
            tested_text: "Во сколько мы встретимся"
            media_asset_key: ru.a1.audio.vo_skolko_vstretimsya.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson02.exercise04.match_response_phrases
            type: matching_pairs
            tested_text: "хорошо согласен сожалению не могу во сколько встретимся"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Хорошо, я согласен.", right: "Okay, I agree."}
              - {left: "К сожалению, я не могу.", right: "Unfortunately, I can't."}
              - {left: "Во сколько мы встретимся?", right: "What time will we meet?"}
              - {left: "Давай в семь часов.", right: "Let's say seven o'clock."}
              - {left: "Давай пойдём в кино.", right: "Let's go to the movies."}
              - {left: "завтра", right: "tomorrow"}
          - content_key: ru.a1.unit12.lesson02.exercise05.order_k_sozhaleniyu_ne_mogu
            type: word_order
            tested_text: "К сожалению я не могу"
            prompt: {target_blocks: []}
            word_bank: ["сожалению", "К", "я", "не", "могу"]
          - content_key: ru.a1.unit12.lesson02.exercise06.listen_order_davay_v_sem
            type: listen_order
            tested_text: "Давай в семь часов"
            media_asset_key: ru.a1.audio.davay_v_sem_chasov.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["семь", "Давай", "в", "часов"]
          - content_key: ru.a1.unit12.lesson02.exercise07.complete_ya_soglasen
            type: fill_in_blank
            tested_text: "Хорошо я согласен"
            prompt: {target_blocks: [{text: "Хорошо, я ___. (agreed, said by a man)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson02.exercise08.write_accept_or_decline
            type: writing_prompt
            tested_text: "Хорошо я согласен"
            prompt: {target_blocks: [{text: "Write a sentence accepting a plan or a sentence declining a plan, using \"Я согласен\" or \"Я не могу\".", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu.exercise09.dictation_davay_v_sem_chasov_neutral, type: dictation, tested_text: "Давай в семь часов", media_asset_key: ru.a1.audio.davay_v_sem_chasov.neutral.01, prompt: {target_blocks: []}}

      - content_key: ru.a1.unit12.lesson03.plany_na_subbotu
        title: "Диалог: планы на субботу"
        spine_outcome_id: universal.a1.plans.make_simple_plans
        teaching:
          - {content_key: ru.a1.unit12.lesson03.teach.nastya_davay_poydyom, kind: dialogue, target: {text: "Настя: Давай пойдём в кино в субботу.", language_code: ru, direction: ltr}, introduced_tokens: [Настя]}
          - {content_key: ru.a1.unit12.lesson03.teach.dima_horosho_soglasen, kind: dialogue, target: {text: "Дима: Хорошо, я согласен. Во сколько мы встретимся?", language_code: ru, direction: ltr}, introduced_tokens: [Дима]}
          - {content_key: ru.a1.unit12.lesson03.teach.nastya_davay_v_sem, kind: dialogue, target: {text: "Настя: Давай в семь часов, у кинотеатра.", language_code: ru, direction: ltr}, introduced_tokens: [кинотеатра, у]}
          - {content_key: ru.a1.unit12.lesson03.teach.dima_otlichno, kind: dialogue, target: {text: "Дима: Отлично, до субботы.", language_code: ru, direction: ltr}, introduced_tokens: [Отлично, до, субботы]}
        exercises:
          - content_key: ru.a1.unit12.lesson03.exercise01.choose_propose_saturday_plan
            type: multiple_choice
            tested_text: "Давай пойдём в кино в субботу"
            prompt: {target_blocks: [{text: "You want to propose going to the movies on Saturday. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson03.exercise02.listen_select_ne_mogu
            type: listen_select
            tested_text: "К сожалению я не могу"
            media_asset_key: ru.a1.audio.k_sozhaleniyu_ne_mogu.neutral.01
            prompt: {target_blocks: [{text: "What is being said?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson03.exercise03.dialogue_comprehension_plany_na_subbotu
            type: dialogue_comprehension
            tested_text: "кино субботу семь кинотеатра"
            media_asset_key: ru.a1.audio.dialogue.plany_na_subbotu.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit12.lesson03.exercise04.match_dialogue_lines
            type: matching_pairs
            tested_text: "давай пойдём субботу согласен встретимся кинотеатра отлично"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Давай пойдём в кино в субботу.", right: "Let's go to the movies on Saturday."}
              - {left: "Хорошо, я согласен.", right: "Okay, I agree."}
              - {left: "Во сколько мы встретимся?", right: "What time will we meet?"}
              - {left: "Давай в семь часов, у кинотеатра.", right: "Let's say seven o'clock, at the movie theater."}
              - {left: "Отлично, до субботы.", right: "Great, see you Saturday."}
              - {left: "К сожалению, я не могу.", right: "Unfortunately, I can't."}
          - content_key: ru.a1.unit12.lesson03.exercise05.order_davay_v_sem_u_kinoteatra
            type: word_order
            tested_text: "Давай в семь часов у кинотеатра"
            prompt: {target_blocks: []}
            word_bank: ["семь", "Давай", "в", "часов", "у", "кинотеатра"]
          - content_key: ru.a1.unit12.lesson03.exercise06.reply_davay_poydyom_v_kino
            type: dialogue_response
            tested_text: "Хорошо я согласен"
            prompt: {target_blocks: [{text: "Давай пойдём в кино в субботу.", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson03.exercise07.complete_do_subboty
            type: fill_in_blank
            tested_text: "Отлично до субботы"
            prompt: {target_blocks: [{text: "Отлично, ___ субботы. (until/see you)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit12.lesson03.exercise08.write_plan_message
            type: writing_prompt
            tested_text: "Давай пойдём в кино в субботу в семь часов"
            prompt: {target_blocks: [{text: "Write a message proposing to go to the movies on Saturday at seven o'clock, using \"Давай пойдём...\".", language_code: en, direction: ltr}]}
