      - content_key: ru.a2.unit68.lesson05.pismo_nasti
        title: "Письмо Насти"
        spine_outcome_id: universal.a2.past.describe_a_busy_morning
        teaching:
          - {"content_key": "ru.a2.unit68.lesson05.teach.slova_pismo", "kind": "vocabulary", "target": {"text": "привет, пока, очень, поздно, но, чай", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["привет", "пока", "очень", "поздно", "но", "чай", "Привет", "Дима", "дима", "Пока", "Настя", "настя", "Утро", "утро", "было", "занятое", "Автобус", "автобус", "приехал", "я", "приехала", "Я", "выпила"], "example": [{"text": "Привет, Дима!", "language_code": "ru", "direction": "ltr"}, {"text": "Пока, Настя!", "language_code": "ru", "direction": "ltr"}, {"text": "Утро было очень занятое.", "language_code": "ru", "direction": "ltr"}, {"text": "Автобус приехал поздно, но я приехала.", "language_code": "ru", "direction": "ltr"}, {"text": "Я выпила чай.", "language_code": "ru", "direction": "ltr"}]}
          - {"content_key": "ru.a2.unit68.lesson05.teach.gn_do_v", "kind": "grammar_note", "target": {"text": "Я дошла до остановки. Я доехала до школы. Я приехала в школу.", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Я", "я", "дошла", "до", "остановки", "доехала", "школы", "приехала", "в", "школу"]}
          - {"content_key": "ru.a2.unit68.lesson05.teach.pismo", "kind": "reading", "target": {"text": "Привет! В понедельник утро было очень занятое. Сначала я проснулась в шесть часов и быстро умылась. Потом я оделась и выпила кофе. После этого я вышла из дома и дошла до остановки. Автобус приехал поздно, но я села в автобус и приехала в школу в восемь часов. В конце я зашла в кафе и выпила чай. Пока, Настя", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Привет", "привет", "В", "в", "понедельник", "утро", "было", "очень", "занятое", "Сначала", "сначала", "я", "проснулась", "шесть", "часов", "и", "быстро", "умылась", "Потом", "потом", "оделась", "выпила", "кофе", "После", "после", "этого", "вышла", "из", "дома", "дошла", "до", "остановки", "Автобус", "автобус", "приехал", "поздно", "но", "села", "приехала", "школу", "восемь", "конце", "зашла", "кафе", "чай", "Пока", "пока", "Настя", "настя"]}
        exercises:
          - {"content_key": "ru.a2.unit68.lesson05.exercise01.chtenie_kogda", "type": "reading_comprehension", "tested_text": "Я проснулась в шесть часов", "prompt": {"target_blocks": [{"text": "When did Nastya wake up?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit68.lesson05.exercise02.chtenie_kak", "type": "reading_comprehension", "tested_text": "Я села в автобус и приехала в школу", "prompt": {"target_blocks": [{"text": "How did Nastya get to school?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit68.lesson05.exercise03.slova", "type": "matching_pairs", "tested_text": "привет пока очень поздно но чай", "prompt": {"target_blocks": []}, "pairs": [{"left": "привет", "right": "hi"}, {"left": "пока", "right": "bye"}, {"left": "очень", "right": "very"}, {"left": "поздно", "right": "late"}, {"left": "но", "right": "but"}, {"left": "чай", "right": "tea"}]}
          - {"content_key": "ru.a2.unit68.lesson05.exercise04.poryadok_avtobus", "type": "word_order", "tested_text": "Автобус приехал поздно", "prompt": {"target_blocks": []}, "word_bank": ["автобус", "приехал", "поздно"]}
          - {"content_key": "ru.a2.unit68.lesson05.exercise05.perevod_avtobus", "type": "translation", "tested_text": "Автобус приехал поздно", "prompt": {"target_blocks": [{"text": "The bus arrived late.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit68.lesson05.exercise06.diktant_dom", "type": "dictation", "tested_text": "Я вышла из дома и дошла до остановки.", "media_asset_key": "ru.a2.audio.zanyatoe_utro.vyshla_iz_doma.01", "prompt": {"target_blocks": []}}
          - {"content_key": "ru.a2.unit68.lesson05.exercise07.diktant_snachala", "type": "dictation", "tested_text": "Сначала я умылась, потом оделась.", "media_asset_key": "ru.a2.audio.zanyatoe_utro.snachala_umylas.01", "prompt": {"target_blocks": []}}
      - content_key: ru.a2.unit68.lesson06.dima_i_nastya
        title: "Дима и Настя говорят об утре"
        spine_outcome_id: universal.a2.past.describe_a_busy_morning
        teaching:
          - {"content_key": "ru.a2.unit68.lesson06.teach.vopros", "kind": "dialogue", "target": {"text": "Привет, Настя! Как прошло твоё утро?", "language_code": "ru", "direction": "ltr", "speaker": "Дима"}, "introduced_tokens": ["Привет", "привет", "Настя", "настя", "Как", "как", "прошло", "твоё", "утро"]}
          - {"content_key": "ru.a2.unit68.lesson06.teach.nastya1", "kind": "dialogue", "target": {"text": "Привет, Дима! Очень занятое! Сначала я проснулась в шесть часов и быстро оделась.", "language_code": "ru", "direction": "ltr", "speaker": "Настя"}, "introduced_tokens": ["Привет", "привет", "Дима", "дима", "Очень", "очень", "занятое", "Сначала", "сначала", "я", "проснулась", "в", "шесть", "часов", "и", "быстро", "оделась"]}
          - {"content_key": "ru.a2.unit68.lesson06.teach.zavtrak", "kind": "dialogue", "target": {"text": "Ты позавтракала?", "language_code": "ru", "direction": "ltr", "speaker": "Дима"}, "introduced_tokens": ["Ты", "ты", "позавтракала"]}
          - {"content_key": "ru.a2.unit68.lesson06.teach.kofe", "kind": "dialogue", "target": {"text": "Да, я выпила кофе. Потом я вышла из дома и дошла до остановки.", "language_code": "ru", "direction": "ltr", "speaker": "Настя"}, "introduced_tokens": ["Да", "да", "я", "выпила", "кофе", "Потом", "потом", "вышла", "из", "дома", "и", "дошла", "до", "остановки"]}
          - {"content_key": "ru.a2.unit68.lesson06.teach.avtobus", "kind": "dialogue", "target": {"text": "Ты села в автобус?", "language_code": "ru", "direction": "ltr", "speaker": "Дима"}, "introduced_tokens": ["Ты", "ты", "села", "в", "автобус"]}
          - {"content_key": "ru.a2.unit68.lesson06.teach.shkola", "kind": "dialogue", "target": {"text": "Да. Я приехала в школу в восемь часов.", "language_code": "ru", "direction": "ltr", "speaker": "Настя"}, "introduced_tokens": ["Да", "да", "Я", "я", "приехала", "в", "школу", "восемь", "часов"]}
          - {"content_key": "ru.a2.unit68.lesson06.teach.dima", "kind": "dialogue", "target": {"text": "А я приехал на работу в девять часов.", "language_code": "ru", "direction": "ltr", "speaker": "Дима"}, "introduced_tokens": ["А", "а", "я", "приехал", "на", "работу", "в", "девять", "часов"]}
        exercises:
          - {"content_key": "ru.a2.unit68.lesson06.exercise01.slushat_vopros", "type": "listen_select", "tested_text": "Привет Настя Как прошло твоё утро", "media_asset_key": "ru.a2.audio.dialogue.zanyatoe_utro.01", "prompt": {"target_blocks": []}}
          - {"content_key": "ru.a2.unit68.lesson06.exercise02.ponyat_kogda", "type": "dialogue_comprehension", "tested_text": "Я приехала в школу в восемь часов", "media_asset_key": "ru.a2.audio.dialogue.zanyatoe_utro.01", "prompt": {"target_blocks": [{"text": "When did Nastya arrive at school?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit68.lesson06.exercise03.replika", "type": "matching_pairs", "tested_text": "Как прошло твоё утро? Я проснулась в шесть часов. Ты позавтракала? Я выпила кофе. Я дошла до остановки. Я приехал на работу в девять часов.", "prompt": {"target_blocks": []}, "pairs": [{"left": "Как прошло твоё утро?", "right": "How was your morning?"}, {"left": "Я проснулась в шесть часов.", "right": "I woke up at six o'clock."}, {"left": "Ты позавтракала?", "right": "Did you have breakfast?"}, {"left": "Я выпила кофе.", "right": "I drank coffee."}, {"left": "Я дошла до остановки.", "right": "I walked to the stop."}, {"left": "Я приехал на работу в девять часов.", "right": "I arrived at work at nine o'clock."}]}
          - {"content_key": "ru.a2.unit68.lesson06.exercise04.poryadok_shkola", "type": "word_order", "tested_text": "Я приехала в школу в восемь часов", "prompt": {"target_blocks": []}, "word_bank": ["я", "приехала", "в", "школу", "в", "восемь", "часов"]}
          - {"content_key": "ru.a2.unit68.lesson06.exercise05.otvet_kofe", "type": "dialogue_response", "tested_text": "Да я выпила кофе", "prompt": {"target_blocks": [{"text": "Ты позавтракала?", "language_code": "ru", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit68.lesson06.exercise06.perevod_ostanovka", "type": "translation", "tested_text": "Я дошла до остановки и села в автобус", "prompt": {"target_blocks": [{"text": "I walked to the stop and got on the bus.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit68.lesson06.exercise07.pismo_utro", "type": "writing_prompt", "tested_text": "Я проснулась в семь часов Потом я вышла из дома Я приехала в школу в восемь часов", "prompt": {"target_blocks": [{"text": "Write exactly three Russian sentences: (1) you woke up at seven o'clock; (2) then you left the house; (3) you arrived at school at eight o'clock.", "language_code": "en", "direction": "ltr"}]}}
