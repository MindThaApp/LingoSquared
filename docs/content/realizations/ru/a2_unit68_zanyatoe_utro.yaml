          - {"content_key": "ru.a2.unit68.lesson04.teach.slova_dni", "kind": "vocabulary", "target": {"text": "в понедельник, вчера, сегодня", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["в", "понедельник", "вчера", "сегодня", "В", "Настя", "настя", "встала", "рано", "Вчера", "я", "проснулся", "поздно", "Сегодня", "мы", "позавтракали", "быстро"], "example": [{"text": "В понедельник Настя встала рано.", "language_code": "ru", "direction": "ltr"}, {"text": "Вчера я проснулся поздно.", "language_code": "ru", "direction": "ltr"}, {"text": "Сегодня мы позавтракали быстро.", "language_code": "ru", "direction": "ltr"}]}
          - {"content_key": "ru.a2.unit68.lesson04.teach.gn_posledovatelnost", "kind": "grammar_note", "target": {"text": "Сначала Дима умылся. Потом он оделся. После этого он позавтракал.", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Сначала", "сначала", "Дима", "дима", "умылся", "Потом", "потом", "он", "оделся", "После", "после", "этого", "позавтракал"]}
          - {"content_key": "ru.a2.unit68.lesson04.teach.gn_poryadok_slov", "kind": "grammar_note", "target": {"text": "Сначала я умылась, потом оделась. Я сначала умылась, потом оделась.", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Сначала", "сначала", "я", "умылась", "потом", "оделась", "Я"]}
          - {"content_key": "ru.a2.unit68.lesson04.teach.gn_i", "kind": "grammar_note", "target": {"text": "Настя встала, умылась и оделась. Дима встал, умылся и позавтракал.", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Настя", "настя", "встала", "умылась", "и", "оделась", "Дима", "дима", "встал", "умылся", "позавтракал"]}
          - {"content_key": "ru.a2.unit68.lesson04.teach.obrazec", "kind": "phrase", "target": {"text": "Сначала я проснулась и умылась. Потом я оделась и позавтракала. После этого я вышла из дома. В конце я приехала в школу.", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Сначала", "сначала", "я", "проснулась", "и", "умылась", "Потом", "потом", "оделась", "позавтракала", "После", "после", "этого", "вышла", "из", "дома", "В", "в", "конце", "приехала", "школу"]}
        exercises:
