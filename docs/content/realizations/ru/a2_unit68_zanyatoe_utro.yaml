          - {"content_key": "ru.a2.unit68.lesson04.exercise05.propusk_potom", "type": "fill_in_blank", "tested_text": "Сначала Дима умылся потом оделся", "prompt": {"target_blocks": [{"text": "Сначала Дима умылся, ___ оделся.", "language_code": "ru", "direction": "ltr"}]}}
