          - {"content_key": "ru.a2.unit68.lesson04.exercise02.vybor_posle", "type": "multiple_choice", "tested_text": "После этого Настя вышла из дома", "prompt": {"target_blocks": [{"text": "After that Nastya left the house.", "language_code": "en", "direction": "ltr"}]}}
