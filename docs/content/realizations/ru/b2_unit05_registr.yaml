generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ru's fifth
    B2 unit (register -- adapting formality to the audience), the first of
    the second-half wave (units 05-08). No adaptable intermediate/upper-
    level public-domain Russian source exists for this topic, so this was
    built from general Russian grammar/discourse knowledge, the same
    honest-disclosure precedent this unit's own B2 unit01-04 set.
    Sibling-isolation honored: the X->en B2 register realization and every
    nl/fa/prs/de B2 file were treated as non-existent and were NOT opened;
    the nl exemplar named in the dispatch prompt was consulted ONLY for
    unit shape (6 lessons, 44 exercises, spine outcome mapping), never for
    Russian text or phrasing -- every Russian sentence was authored fresh
    from first principles, not translated or calqued from the Dutch
    exemplar. Only ru's OWN earlier realization content (the Настя/Дима
    pair, established as Дима=engineer, Настя=teacher, informal ты
    register; see unit01-04) was consulted for character canon, which is
    not a sibling-direction violation. Here Настя needs to reschedule an
    appointment and the unit renders that one request both informally (to
    her friend Дима) and formally (to an unnamed clinic administration),
    which introduces no canon conflict -- Дима and Настя's own established
    informal ты register is preserved throughout their exchange; only the
    unnamed institutional audience receives the formal Вы register.
    REGISTER SPECIAL CASE: unlike other units, this unit DELIBERATELY
    teaches BOTH registers side by side (informal ты/тебя/тебе/твой,
    ты-imperative, пожалуйста, Привет/Пока vs formal Вы/вас/вам/ваш, не
    могли бы Вы, будьте добры, Уважаемая администрация/С уважением). Each
    individual exercise keeps a single internally consistent register; the
    contrast lives across the exercise pairs, and the culminating exercise
    produces the SAME request in both. A genuine Russian-specific nuance
    used here (not present in the Dutch exemplar, since Dutch has no
    equivalent): Настя signs informally with the short form "Настя" but
    formally with her full given name "Анастасия" -- taught explicitly as
    its own register marker.
review:
  status: reviewed
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fifth Russian B2 unit; first register unit; opens the second-half wave
    (units 05-08), building on units 01-04 (already committed) within the
    same B2 course. Targets the CEFR B2 register outcome
    (universal.b2.register.adapt_formality_to_audience): adapt formality to
    the audience -- deliver the same content appropriately to a close
    friend versus an institution. Theme: one everyday request -- rescheduling
    an appointment -- rendered both ways across all six lessons. Lesson arc:
    L01 the ты<->Вы pronoun/verb shift (ты/тебя/тебе/твой vs Вы/вас/вам/ваш;
    можешь -> можете); L02 greetings and closings (Привет/Пока vs
    Здравствуйте (neutral) vs Уважаемая администрация / С уважением, plus
    Настя's full formal name Анастасия); L03 directness -- informal
    ты-imperative + пожалуйста vs formal Не могли бы Вы / Будьте добры; L04
    the actual request (перенести встречу vs перенести приём) rendered
    informally and formally; L05 a reading requirement -- two messages, same
    content, different register, identify the audience of each; L06 the
    culminating production -- a Настя/Дима dialogue for the listening
    requirement (judge whether the register fits the situation and what a
    mismatch would signal), a speaking task delivering the SAME request once
    to a friend and once to the clinic, a writing task rewriting the
    informal message as a formal one, and a culminating writing task
    producing the request in BOTH registers. Register: this unit teaches
    both; the established Настя/Дима informal ты pair supply the informal
    side (see unit01-04), the institutional side is formal to an unnamed
    clinic administration. All vocabulary needed for this unit's own
    exercises is introduced within units 01-05 of this course (B2 is a
    separate Course row, so a B2 learner never sees A1/A2/B1 lexemes at
    runtime). No sibling-direction file was consulted.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked token coverage course-wide, character canon (Дима engineer,
    Настя teacher, ты), dialogue cards vs audio, listen/dialogue
    distractors, example_glosses, overlay coverage, YAML booleans,
    internal-jargon notes, ё/е and subject-pronoun grading gaps. Fixes
    (realization + en-ru overlay): lesson01.exercise06.translate_mozhesh
    +"Ты можешь помочь"; lesson01.exercise07.speak_mozhete +"Вы можете
    помочь"; lesson01.exercise03.match_pronouns вы pair right "you
    (formal)" -> "you (formal, subject)" (realization + overlay);
    lesson03.teach.ne_mogli_by_vy note no longer claims formal Russian
    avoids the imperative altogether (now "often prefers an indirect
    question"); lesson04.teach.vstrecha title/gloss/note re-taught as
    register-neutral "meeting / get-together" (was "informal meetup"),
    priyom and perenesti notes aligned;
    lesson04.exercise03.match_appointment_words pair rights встреча ->
    "meeting / get-together", приём -> "appointment (at a clinic or
    office)" (realization + overlay);
    lesson04.exercise05.translate_informal_request +"Мы можем перенести
    встречу"; lesson04.exercise06.translate_formal_request and
    lesson06.exercise05.speak_formal +прием (е) variant;
    lesson05.exercise01-04 read_* now show both messages as ru
    target_blocks before the question;
    lesson05.exercise03.read_same_request correct option "To reschedule
    the appointment." -> "To reschedule a planned meeting." (distractor
    paralleled); lesson06.exercise01.comprehend_register_fit options no
    longer claim Настя uses ты (she never does in the audio) -- now
    "Informally -- and it fits, because Дима is a close friend." with
    parallel distractors and feedback;
    lesson06.exercise04.speak_informal +"Ты можешь перенести встречу";
    lesson06.exercise06.write_rewrite_formal prompt (realization +
    overlay) pinned to "Не могли бы Вы and мой приём (my appointment)",
    +прием variant; lesson06.exercise07.write_both_registers +прием and
    "Ты можешь..." variants. NATIVE FLAGS: the Будьте добры note
    ("reserved for a formal request to an institution") vs its common
    spoken service use; "Удобно ли на следующей неделе?" vs "Будет ли
    Вам удобно...". DEFERRED: grader-level ё/е fold and ru optional
    subject pronouns (grading.py, Codex lane, owner decision);
    reading-passage-not-shown renderer decision (fixed locally here).

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    informal ты register (the ru lane default between Настя and Дима, see
    unit01-04) and the formal Вы register, contrasting them. Each single
    exercise stays in one consistent register; the contrast is carried
    across exercise pairs and the culminating exercise. Informal:
    ты/тебя/тебе/твой, ты-imperative (Сделай), пожалуйста, Привет, Пока.
    Formal: Вы/вас/вам/ваш with the corresponding verb form (можете, не
    могли бы Вы), Будьте добры, Уважаемая администрация, С уважением,
    Анастасия (full form of Настя). Настя and Дима keep the informal ты
    they use with each other in unit01-04.

