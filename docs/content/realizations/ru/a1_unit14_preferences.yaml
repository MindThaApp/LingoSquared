schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: unreviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. The
    attested dative-subject "liking" sentences "Этот самовар мне
    нравится" ("I like that samovar"), "Нам нравится наш преподаватель"
    ("We like our teacher"), and "Детям не нравится учительница" ("The
    kids don't like their teacher"), together with the recurring
    "хочу" ("I want") construction ("Я хочу купить...", "Я хочу есть /
    пить"), supplied the core "мне (не) нравится" / "я (не) хочу"
    patterns used throughout this unit. Every example sentence,
    exercise, and dialogue here was freshly authored for a natural 2026
    everyday-use context (stating and asking about simple drink
    preferences), not imported verbatim from the source (AUTHORING_GUIDE
    §10). Combining acute-accent stress marks were stripped from every
    learner-facing string.
  human_reviewed: false
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: "Drafted 2026-07-12; pending fresh-context review. Not self-reviewed."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit covers expressing and asking about basic likes, dislikes, and
    wants, using the dative "мне нравится" construction and "я хочу",
    in an informal ты register between friends.

media_assets:
  - {content_key: ru.a1.audio.mne_nravitsya_kofe.neutral.01, language: ru, text: "Мне нравится кофе.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.ya_hochu_chay.neutral.01, language: ru, text: "Я хочу чай.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.tebe_nravitsya_kofe.neutral.01, language: ru, text: "Тебе нравится кофе?", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.tebe_nravitsya_kofe.01
    language: ru
    text: >-
      Настя: Тебе нравится кофе? Дима: Да, мне нравится кофе. А тебе?
      Настя: Мне не нравится кофе. Я хочу чай. Дима: Хорошо, я хочу сок.
    voice_hint: two_adults_neutral
    status: pending_generation

units:
  - content_key: ru.a1.unit14.preferences
    title: "Мне нравится..."
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.preferences.express_preferences
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit14.lesson01.mne_nravitsya
        title: "Мне нравится кофе"
        spine_outcome_id: universal.a1.preferences.express_preferences
        teaching:
          - {content_key: ru.a1.unit14.lesson01.teach.mne_nravitsya_kofe, kind: phrase, target: {text: "Мне нравится кофе.", language_code: ru, direction: ltr}, introduced_tokens: [Мне, нравится, кофе]}
          - {content_key: ru.a1.unit14.lesson01.teach.ne_nravitsya, kind: vocabulary, target: {text: "не нравится", language_code: ru, direction: ltr}, introduced_tokens: [не], example: {text: "Мне не нравится чай.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit14.lesson01.teach.chay, kind: vocabulary, target: {text: "чай", language_code: ru, direction: ltr}, introduced_tokens: [чай], example: {text: "Мне нравится чай.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit14.lesson01.exercise01.recognize_nravitsya
            type: multiple_choice
            tested_text: "нравится"
            prompt: {target_blocks: [{text: "is pleasing to (used for \"like\")", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson01.exercise02.recognize_chay
            type: multiple_choice
            tested_text: "чай"
            prompt: {target_blocks: [{text: "tea", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson01.exercise03.listen_select_mne_nravitsya_kofe
            type: listen_select
            tested_text: "Мне нравится кофе"
            media_asset_key: ru.a1.audio.mne_nravitsya_kofe.neutral.01
            prompt: {target_blocks: [{text: "What does the speaker like?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson01.exercise04.match_liking_words
            type: matching_pairs
            tested_text: "мне нравится не кофе чай"
            prompt: {target_blocks: []}
            pairs:
              - {left: "мне", right: "to me"}
              - {left: "нравится", right: "is pleasing (like)"}
              - {left: "не нравится", right: "don't like"}
              - {left: "кофе", right: "coffee"}
              - {left: "чай", right: "tea"}
              - {left: "Мне нравится кофе.", right: "I like coffee."}
          - content_key: ru.a1.unit14.lesson01.exercise05.order_mne_nravitsya_kofe
            type: word_order
            tested_text: "Мне нравится кофе"
            prompt: {target_blocks: []}
            word_bank: ["нравится", "Мне", "кофе"]
          - content_key: ru.a1.unit14.lesson01.exercise06.listen_order_mne_ne_nravitsya_chay
            type: listen_order
            tested_text: "Мне нравится кофе"
            media_asset_key: ru.a1.audio.mne_nravitsya_kofe.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["Мне", "нравится", "кофе"]
          - content_key: ru.a1.unit14.lesson01.exercise07.complete_mne_nravitsya_chay
            type: fill_in_blank
            tested_text: "Мне нравится чай"
            prompt: {target_blocks: [{text: "Мне ___ чай. (I like tea)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson01.exercise08.write_a_preference
            type: writing_prompt
            tested_text: "Мне нравится кофе"
            prompt: {target_blocks: [{text: "Write a sentence saying you like coffee or tea, using \"Мне нравится...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit14.lesson02.ya_hochu
        title: "Я хочу чай"
        spine_outcome_id: universal.a1.preferences.express_preferences
        teaching:
          - {content_key: ru.a1.unit14.lesson02.teach.ya_hochu_chay, kind: phrase, target: {text: "Я хочу чай.", language_code: ru, direction: ltr}, introduced_tokens: [Я, хочу]}
          - {content_key: ru.a1.unit14.lesson02.teach.ne_hochu, kind: vocabulary, target: {text: "не хочу", language_code: ru, direction: ltr}, introduced_tokens: [не хочу], example: {text: "Я не хочу кофе.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit14.lesson02.teach.sok, kind: vocabulary, target: {text: "сок", language_code: ru, direction: ltr}, introduced_tokens: [сок], example: {text: "Я хочу сок.", language_code: ru, direction: ltr}}
        exercises:
          - content_key: ru.a1.unit14.lesson02.exercise01.recognize_hochu
            type: multiple_choice
            tested_text: "хочу"
            prompt: {target_blocks: [{text: "I want", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson02.exercise02.recognize_sok
            type: multiple_choice
            tested_text: "сок"
            prompt: {target_blocks: [{text: "juice", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson02.exercise03.listen_select_ya_hochu_chay
            type: listen_select
            tested_text: "Я хочу чай"
            media_asset_key: ru.a1.audio.ya_hochu_chay.neutral.01
            prompt: {target_blocks: [{text: "What does the speaker want?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson02.exercise04.match_wanting_words
            type: matching_pairs
            tested_text: "мне нравится не кофе чай я хочу сок"
            prompt: {target_blocks: []}
            pairs:
              - {left: "я хочу", right: "I want"}
              - {left: "не хочу", right: "don't want"}
              - {left: "сок", right: "juice"}
              - {left: "кофе", right: "coffee"}
              - {left: "чай", right: "tea"}
              - {left: "мне нравится", right: "I like"}
              - {left: "Я хочу чай.", right: "I want tea."}
              - {left: "Мне нравится кофе.", right: "I like coffee."}
          - content_key: ru.a1.unit14.lesson02.exercise05.order_ya_hochu_sok
            type: word_order
            tested_text: "Я хочу сок"
            prompt: {target_blocks: []}
            word_bank: ["хочу", "Я", "сок"]
          - content_key: ru.a1.unit14.lesson02.exercise06.listen_order_ya_hochu_chay
            type: listen_order
            tested_text: "Я хочу чай"
            media_asset_key: ru.a1.audio.ya_hochu_chay.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["хочу", "Я", "чай"]
          - content_key: ru.a1.unit14.lesson02.exercise07.complete_ya_hochu_sok
            type: fill_in_blank
            tested_text: "Я хочу сок"
            prompt: {target_blocks: [{text: "Я ___ сок. (I want juice)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson02.exercise08.write_what_you_want
            type: writing_prompt
            tested_text: "Я хочу чай"
            prompt: {target_blocks: [{text: "Write a sentence saying what you want to drink, using \"Я хочу...\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
        title: "Диалог: тебе нравится кофе?"
        spine_outcome_id: universal.a1.preferences.express_preferences
        teaching:
          - {content_key: ru.a1.unit14.lesson03.teach.nastya_tebe_nravitsya, kind: dialogue, target: {text: "Настя: Тебе нравится кофе?", language_code: ru, direction: ltr}, introduced_tokens: [Настя, Тебе]}
          - {content_key: ru.a1.unit14.lesson03.teach.dima_da_mne_nravitsya, kind: dialogue, target: {text: "Дима: Да, мне нравится кофе. А тебе?", language_code: ru, direction: ltr}, introduced_tokens: [Дима, Да, тебе]}
          - {content_key: ru.a1.unit14.lesson03.teach.nastya_ne_nravitsya_hochu_chay, kind: dialogue, target: {text: "Настя: Мне не нравится кофе. Я хочу чай.", language_code: ru, direction: ltr}, introduced_tokens: []}
        exercises:
          - content_key: ru.a1.unit14.lesson03.exercise01.choose_ask_if_liked
            type: multiple_choice
            tested_text: "Тебе нравится кофе"
            prompt: {target_blocks: [{text: "You want to ask a friend if they like coffee. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson03.exercise02.listen_select_tebe_nravitsya
            type: listen_select
            tested_text: "Тебе нравится кофе"
            media_asset_key: ru.a1.audio.tebe_nravitsya_kofe.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson03.exercise03.dialogue_comprehension_tebe_nravitsya_kofe
            type: dialogue_comprehension
            tested_text: "нравится кофе хочу чай сок"
            media_asset_key: ru.a1.audio.dialogue.tebe_nravitsya_kofe.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit14.lesson03.exercise04.match_dialogue_lines
            type: matching_pairs
            tested_text: "тебе нравится кофе да мне не хочу чай сок"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Тебе нравится кофе?", right: "Do you like coffee?"}
              - {left: "Да, мне нравится кофе.", right: "Yes, I like coffee."}
              - {left: "Мне не нравится кофе.", right: "I don't like coffee."}
              - {left: "Я хочу чай.", right: "I want tea."}
              - {left: "Я хочу сок.", right: "I want juice."}
              - {left: "А тебе?", right: "And you?"}
          - content_key: ru.a1.unit14.lesson03.exercise05.order_mne_ne_nravitsya_kofe
            type: word_order
            tested_text: "Мне не нравится кофе"
            prompt: {target_blocks: []}
            word_bank: ["не", "Мне", "нравится", "кофе"]
          - content_key: ru.a1.unit14.lesson03.exercise06.reply_tebe_nravitsya_kofe
            type: dialogue_response
            tested_text: "Да мне нравится кофе"
            prompt: {target_blocks: [{text: "Тебе нравится кофе?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson03.exercise07.complete_ya_hochu_chay
            type: fill_in_blank
            tested_text: "Я хочу чай"
            prompt: {target_blocks: [{text: "Мне не нравится кофе. Я ___ чай. (I want)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit14.lesson03.exercise08.write_preference_exchange
            type: writing_prompt
            tested_text: "Тебе нравится кофе"
            prompt: {target_blocks: [{text: "Write a short exchange: ask if a friend likes coffee, then answer with your own preference.", language_code: en, direction: ltr}]}
