course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian for talking about one's job.
    Continues the informal ты register between friends Настя and Дима
    established in units 11-15, used consistently across all three
    lessons since talking about one's own profession is a plain
    first-person statement regardless of who is asked.

