          - {"content_key": "ru.a2.unit69.lesson05.exercise02.read_everyday", "type": "reading_comprehension", "tested_text": "Каждый день я вставал рано и играл во дворе", "prompt": {"target_blocks": [{"text": "What did Dima do every day as a child?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit69.lesson05.exercise03.match_pismo", "type": "matching_pairs", "tested_text": "У нас был большой дом Рядом было озеро Каждый день я вставал рано По воскресеньям мы ездили к бабушке Теперь я живу в городе Я работаю дома", "prompt": {"target_blocks": []}, "pairs": [{"left": "У нас был большой дом.", "right": "We had a big house."}, {"left": "Рядом было озеро.", "right": "There was a lake nearby."}, {"left": "Каждый день я вставал рано.", "right": "Every day I got up early."}, {"left": "По воскресеньям мы ездили к бабушке.", "right": "On Sundays we went to grandmother's."}, {"left": "Теперь я живу в городе.", "right": "Now I live in a city."}, {"left": "Я работаю дома.", "right": "I work at home."}]}
          - {"content_key": "ru.a2.unit69.lesson05.exercise04.order_vstaval", "type": "word_order", "tested_text": "Каждый день я вставал рано", "prompt": {"target_blocks": []}, "word_bank": ["каждый", "день", "я", "вставал", "рано"]}
          - {"content_key": "ru.a2.unit69.lesson05.exercise05.translate_dom", "type": "translation", "tested_text": "Теперь я живу в городе и работаю дома", "prompt": {"target_blocks": [{"text": "Now I live in a city and work at home.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit69.lesson05.exercise06.dictation_vstaval", "type": "dictation", "tested_text": "Каждый день я вставал рано и играл во дворе.", "prompt": {"target_blocks": []}, "media_asset_key": "ru.a2.audio.ranshe_i_teper.kazhdyj_den_vstaval.01"}
