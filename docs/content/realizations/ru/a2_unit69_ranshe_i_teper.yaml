          - {"content_key": "ru.a2.unit69.lesson05.teach.reading", "kind": "reading", "target": {"text": "Привет, Настя! В детстве я жил в маленькой деревне. У нас был большой дом, а рядом было озеро. Каждый день я вставал рано и играл во дворе. По воскресеньям мы ездили к бабушке. Теперь я живу в городе и работаю дома. Пока! Дима", "language_code": "ru", "direction": "ltr"}, "introduced_tokens": ["Привет", "Настя", "В", "детстве", "я", "жил", "в", "маленькой", "деревне", "У", "нас", "был", "большой", "дом", "а", "рядом", "было", "озеро", "Каждый", "день", "вставал", "рано", "и", "играл", "во", "дворе", "По", "воскресеньям", "мы", "ездили", "к", "бабушке", "Теперь", "живу", "городе", "работаю", "дома", "Пока", "Дима"]}
        exercises:
