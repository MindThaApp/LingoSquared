          - {"content_key": "ru.a2.unit69.lesson06.teach.da", "kind": "dialogue", "target": {"text": "Да, теперь я живу в городе и работаю дома.", "language_code": "ru", "direction": "ltr", "speaker": "Дима"}, "introduced_tokens": ["Да", "теперь", "я", "живу", "в", "городе", "и", "работаю", "дома"]}
