          - {"content_key": "ru.a2.unit69.lesson06.exercise03.match_dialogue", "type": "matching_pairs", "tested_text": "Раньше я жил в деревне У нас был дом и сад А что ты делал каждый день Я вставал рано и играл во дворе А теперь ты живёшь в городе Теперь я живу в городе и работаю дома", "prompt": {"target_blocks": []}, "pairs": [{"left": "Раньше я жил в деревне.", "right": "Before, I lived in a village."}, {"left": "У нас был дом и сад.", "right": "We had a house and a garden."}, {"left": "А что ты делал каждый день?", "right": "And what did you do every day?"}, {"left": "Я вставал рано и играл во дворе.", "right": "I got up early and played in the yard."}, {"left": "А теперь ты живёшь в городе?", "right": "And now do you live in a city?"}, {"left": "Теперь я живу в городе и работаю дома.", "right": "Now I live in a city and work at home."}]}
          - {"content_key": "ru.a2.unit69.lesson06.exercise04.order_teper", "type": "word_order", "tested_text": "Теперь я живу в городе и работаю дома", "prompt": {"target_blocks": []}, "word_bank": ["теперь", "я", "живу", "в", "городе", "и", "работаю", "дома"]}
          - {"content_key": "ru.a2.unit69.lesson06.exercise05.respond_gde", "type": "dialogue_response", "tested_text": "Раньше я жил в деревне", "prompt": {"target_blocks": [{"text": "Где ты жил раньше?", "language_code": "ru", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit69.lesson06.exercise06.translate_dom", "type": "translation", "tested_text": "Раньше у меня был большой дом", "prompt": {"target_blocks": [{"text": "Before, I had a big house.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "ru.a2.unit69.lesson06.exercise07.write_gorod", "type": "writing_prompt", "tested_text": "Раньше я жил в городе Теперь я живу в деревне", "prompt": {"target_blocks": [{"text": "Write exactly two Russian sentences: (1) before, you lived in a city; (2) now you live in a village.", "language_code": "en", "direction": "ltr"}]}}
