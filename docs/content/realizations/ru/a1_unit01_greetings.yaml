schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf (a
    derivative presentation of the same public-domain text; only the
    typesetting/scanning is the community's work, the underlying course
    content itself is the original PD FSI material). Lesson 1's Cyrillic
    alphabet-introduction sequencing and Lesson 3's greetings vocabulary,
    time-of-day greeting distinctions, and "Как дела?"/farewell phrase
    inventory were used as scaffold: vocabulary selection and topic/grammar
    sequencing came from the source; every sentence, dialogue, exercise,
    and teaching note here was freshly authored/modernized for a 2026
    conversational register (the 1990s source itself is a Peace Corps-era
    modernization of the original 1960s-70s FSI corpus, but was still
    adapted further here, not imported verbatim, per AUTHORING_GUIDE §10).
    Combining acute-accent stress marks present in the source (a
    pronunciation aid, not standard orthography) were stripped from every
    learner-facing string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: native_speaker
  notes: >-
    Fresh-context full review (new-language lane, no sampling), 2026-07-12.
    Russian correctness verified: numeral-case agreement (один брат / два
    брата / пять рублей), вы/ты consistency, ё retention consistent, no
    combining stress marks present. Fixed 1 defect: exercise06
    listen_order_and_you pointed at the "Привет! Как дела?" audio, which
    does not contain the tested sentence "А у тебя?" — added a dedicated
    ru.a1.audio.a_u_tebya.informal.01 asset and repointed. Script ramp
    teaches exactly the letter subset of Здравствуйте. matching_pairs §16
    warning on match_times (3 pairs) is a genuine time-of-day ceiling, not
    padded. Native-speaker review still pending.

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. Use the
    formal вы and informal ты distinction explicitly and consistently:
    вы for strangers, work settings, and anyone owed respect or distance;
    ты for friends, family, children, and peers once a relationship allows
    it. Keep each exercise's register explicit and never let a ты-register
    sentence use a вы-conjugated verb form or vice versa.

media_assets:
  - {content_key: ru.a1.audio.zdravstvuyte.neutral.01, language: ru, text: "Здравствуйте!", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.privet.informal.01, language: ru, text: "Привет!", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: ru.a1.audio.dobroe_utro.neutral.01, language: ru, text: "Доброе утро!", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.dobryy_den.neutral.01, language: ru, text: "Добрый день!", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.dobryy_vecher.neutral.01, language: ru, text: "Добрый вечер!", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.kak_dela_informal.01, language: ru, text: "Привет! Как дела?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: ru.a1.audio.a_u_tebya.informal.01, language: ru, text: "А у тебя?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: ru.a1.audio.kak_pozhivaete_formal.01, language: ru, text: "Здравствуйте! Как поживаете?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.horosho_spasibo.neutral.01, language: ru, text: "Хорошо, спасибо.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.tak_sebe.neutral.01, language: ru, text: "Так себе.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.do_svidaniya.neutral.01, language: ru, text: "До свидания!", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.poka.informal.01, language: ru, text: "Пока!", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: ru.a1.audio.do_zavtra.neutral.01, language: ru, text: "До завтра!", voice_hint: neutral_adult, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.hallway_greeting.01
    language: ru
    text: >-
      Анна: Добрый день! Как дела? Максим: Хорошо, спасибо. А у тебя?
      Анна: Тоже хорошо. Ну, до завтра! Максим: До завтра!
    voice_hint: two_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: ru.a1.unit01.greetings
    title: "Приветствия"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.greetings.open_close_exchange
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit01.lesson01.script_ramp
        title: "Знакомство с кириллицей"
        spine_outcome_id: null
        module_kind: script_ramp
        teaching:
          - content_key: ru.a1.unit01.lesson01.teach.direction
            kind: pronunciation_note
            target: {text: "Русский алфавит читается слева направо, как английский.", language_code: ru, direction: ltr}
            introduced_tokens: []
          - content_key: ru.a1.unit01.lesson01.teach.letter_z
            kind: pronunciation_note
            target: {text: "З з", language_code: ru, direction: ltr}
            introduced_tokens: [З]
          - content_key: ru.a1.unit01.lesson01.teach.letter_d
            kind: pronunciation_note
            target: {text: "Д д", language_code: ru, direction: ltr}
            introduced_tokens: [Д]
          - content_key: ru.a1.unit01.lesson01.teach.letter_r
            kind: pronunciation_note
            target: {text: "Р р", language_code: ru, direction: ltr}
            introduced_tokens: [Р]
          - content_key: ru.a1.unit01.lesson01.teach.letter_a
            kind: pronunciation_note
            target: {text: "А а", language_code: ru, direction: ltr}
            introduced_tokens: [А]
          - content_key: ru.a1.unit01.lesson01.teach.letter_v
            kind: pronunciation_note
            target: {text: "В в", language_code: ru, direction: ltr}
            introduced_tokens: [В]
          - content_key: ru.a1.unit01.lesson01.teach.letter_s
            kind: pronunciation_note
            target: {text: "С с", language_code: ru, direction: ltr}
            introduced_tokens: [С]
          - content_key: ru.a1.unit01.lesson01.teach.letter_t
            kind: pronunciation_note
            target: {text: "Т т", language_code: ru, direction: ltr}
            introduced_tokens: [Т]
          - content_key: ru.a1.unit01.lesson01.teach.letter_u
            kind: pronunciation_note
            target: {text: "У у", language_code: ru, direction: ltr}
            introduced_tokens: [У]
          - content_key: ru.a1.unit01.lesson01.teach.letter_ye
            kind: pronunciation_note
            target: {text: "Е е", language_code: ru, direction: ltr}
            introduced_tokens: [Е]
          - content_key: ru.a1.unit01.lesson01.teach.hard_sign_note
            kind: grammar_note
            target: {text: "Твёрдый знак ъ и мягкий знак ь не имеют собственного звука: они меняют произношение соседней буквы.", language_code: ru, direction: ltr}
            introduced_tokens: [ъ, ь]
          - content_key: ru.a1.unit01.lesson01.teach.letter_short_i
            kind: pronunciation_note
            target: {text: "Й й", language_code: ru, direction: ltr}
            introduced_tokens: [Й]
          - content_key: ru.a1.unit01.lesson01.teach.zdravstvuyte_shape
            kind: vocabulary
            target: {text: "Здравствуйте", language_code: ru, direction: ltr}
            introduced_tokens: [Здравствуйте]
            example: {text: "Здравствуйте! Меня зовут Виктор.", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit01.lesson01.exercise01.recognize_z
            type: multiple_choice
            tested_text: "З"
            prompt: {target_blocks: [{text: "З", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson01.exercise02.recognize_d
            type: multiple_choice
            tested_text: "Д"
            prompt: {target_blocks: [{text: "Д", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson01.exercise03.recognize_r
            type: multiple_choice
            tested_text: "Р"
            prompt: {target_blocks: [{text: "Р", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson01.exercise04.match_letters_sounds
            type: matching_pairs
            tested_text: "З Д Р А В С Т У Е"
            prompt: {target_blocks: []}
            pairs:
              - {left: "З", right: "\"z\" as in zoo"}
              - {left: "Д", right: "\"d\" as in door"}
              - {left: "Р", right: "rolled \"r\""}
              - {left: "А", right: "\"a\" as in father"}
              - {left: "В", right: "\"v\" as in van"}
              - {left: "С", right: "\"s\" as in sun"}
              - {left: "Т", right: "\"t\" as in top"}
              - {left: "У", right: "\"oo\" as in moon"}
              - {left: "Е", right: "\"ye\" as in yes"}
          - content_key: ru.a1.unit01.lesson01.exercise05.order_letters
            type: word_order
            tested_text: "З Д Р А В С Т В У Й Т Е"
            prompt: {target_blocks: [{text: "Arrange the letters to spell the word for \"Hello\" (formal).", language_code: en, direction: ltr}]}
            word_bank: ["З", "Д", "Р", "А", "В", "С", "Т", "В", "У", "Й", "Т", "Е"]
          - content_key: ru.a1.unit01.lesson01.exercise06.listen_select_word
            type: listen_select
            tested_text: "Здравствуйте"
            media_asset_key: ru.a1.audio.zdravstvuyte.neutral.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit01.lesson01.exercise07.copy_word
            type: fill_in_blank
            tested_text: "Здравствуйте"
            prompt: {target_blocks: [{text: "Copy the word you hear: ___ (Hello, formal)", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit01.lesson02.vremya_dnya
        title: "Приветствия в разное время дня"
        spine_outcome_id: universal.a1.greetings.open_close_exchange
        teaching:
          - content_key: ru.a1.unit01.lesson02.teach.zdravstvuyte_privet
            kind: vocabulary
            target: {text: "Здравствуйте, Привет", language_code: ru, direction: ltr}
            introduced_tokens: [Здравствуйте, Привет]
            example:
              - {text: "Здравствуйте! Как поживаете?", language_code: ru, direction: ltr}
              - {text: "Привет! Как дела?", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit01.lesson02.teach.dobroe_utro, kind: phrase, target: {text: "Доброе утро!", language_code: ru, direction: ltr}, introduced_tokens: [Доброе, утро]}
          - {content_key: ru.a1.unit01.lesson02.teach.dobryy_den, kind: phrase, target: {text: "Добрый день!", language_code: ru, direction: ltr}, introduced_tokens: [Добрый, день]}
          - {content_key: ru.a1.unit01.lesson02.teach.dobryy_vecher, kind: phrase, target: {text: "Добрый вечер!", language_code: ru, direction: ltr}, introduced_tokens: [Добрый, вечер]}
          - content_key: ru.a1.unit01.lesson02.teach.register_note
            kind: grammar_note
            target: {text: "Здравствуйте подходит для любого времени суток и для вежливого общения. Привет — неформальное приветствие среди друзей.", language_code: ru, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ru.a1.unit01.lesson02.exercise01.choose_morning
            type: multiple_choice
            tested_text: "Доброе утро"
            prompt: {target_blocks: [{text: "08:30", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson02.exercise02.choose_evening
            type: multiple_choice
            tested_text: "Добрый вечер"
            prompt: {target_blocks: [{text: "20:00", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson02.exercise03.listen_select_formal
            type: listen_select
            tested_text: "Здравствуйте"
            media_asset_key: ru.a1.audio.zdravstvuyte.neutral.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit01.lesson02.exercise04.match_times
            type: matching_pairs
            tested_text: "Доброе утро Добрый день Добрый вечер"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Доброе утро", right: "08:30"}
              - {left: "Добрый день", right: "14:00"}
              - {left: "Добрый вечер", right: "20:00"}
          - content_key: ru.a1.unit01.lesson02.exercise05.order_good_evening
            type: word_order
            tested_text: "Добрый вечер"
            prompt: {target_blocks: []}
            word_bank: ["вечер", "Добрый"]
          - content_key: ru.a1.unit01.lesson02.exercise06.listen_order_morning
            type: listen_order
            tested_text: "Доброе утро"
            media_asset_key: ru.a1.audio.dobroe_utro.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["утро", "Доброе"]
          - content_key: ru.a1.unit01.lesson02.exercise07.complete_greeting
            type: fill_in_blank
            tested_text: "Добрый день"
            prompt: {target_blocks: [{text: "Добрый ___! (it is 2 PM)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson02.exercise08.write_informal_greeting
            type: writing_prompt
            tested_text: "Привет"
            prompt: {target_blocks: [{text: "Write the informal greeting you would use with a close friend.", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
        title: "Как дела? и прощание"
        spine_outcome_id: universal.a1.greetings.open_close_exchange
        teaching:
          - {content_key: ru.a1.unit01.lesson03.teach.kak_dela, kind: phrase, target: {text: "Как дела?", language_code: ru, direction: ltr}, introduced_tokens: [Как, дела]}
          - {content_key: ru.a1.unit01.lesson03.teach.kak_pozhivaete, kind: phrase, target: {text: "Как поживаете?", language_code: ru, direction: ltr}, introduced_tokens: [Как, поживаете]}
          - content_key: ru.a1.unit01.lesson03.teach.horosho_spasibo
            kind: vocabulary
            target: {text: "Хорошо, спасибо", language_code: ru, direction: ltr}
            introduced_tokens: [Хорошо, спасибо]
            example: {text: "Как дела? — Хорошо, спасибо.", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit01.lesson03.teach.tak_sebe
            kind: vocabulary
            target: {text: "Так себе", language_code: ru, direction: ltr}
            introduced_tokens: [Так, себе]
            example: {text: "Как дела? — Так себе.", language_code: ru, direction: ltr}
          - {content_key: ru.a1.unit01.lesson03.teach.a_u_tebya, kind: phrase, target: {text: "А у тебя?", language_code: ru, direction: ltr}, introduced_tokens: [А, у, тебя]}
          - {content_key: ru.a1.unit01.lesson03.teach.do_svidaniya, kind: phrase, target: {text: "До свидания!", language_code: ru, direction: ltr}, introduced_tokens: [До, свидания]}
          - {content_key: ru.a1.unit01.lesson03.teach.poka, kind: phrase, target: {text: "Пока!", language_code: ru, direction: ltr}, introduced_tokens: [Пока]}
          - {content_key: ru.a1.unit01.lesson03.teach.do_zavtra, kind: phrase, target: {text: "До завтра!", language_code: ru, direction: ltr}, introduced_tokens: [До, завтра]}
          - {content_key: ru.a1.unit01.lesson03.teach.anna, kind: dialogue, target: {text: "Анна: Добрый день! Как дела?", language_code: ru, direction: ltr}, introduced_tokens: [Анна, Добрый, день, Как, дела]}
          - {content_key: ru.a1.unit01.lesson03.teach.maksim_reply, kind: dialogue, target: {text: "Максим: Хорошо, спасибо. А у тебя?", language_code: ru, direction: ltr}, introduced_tokens: [Максим, Хорошо, спасибо, А, у, тебя]}
          - {content_key: ru.a1.unit01.lesson03.teach.anna_close, kind: dialogue, target: {text: "Анна: Тоже хорошо. Ну, до завтра!", language_code: ru, direction: ltr}, introduced_tokens: [Анна, Тоже, хорошо, Ну, до, завтра]}
          - {content_key: ru.a1.unit01.lesson03.teach.maksim_close, kind: dialogue, target: {text: "Максим: До завтра!", language_code: ru, direction: ltr}, introduced_tokens: [Максим, До, завтра]}
        exercises:
          - content_key: ru.a1.unit01.lesson03.exercise01.choose_reply_informal
            type: multiple_choice
            tested_text: "Хорошо спасибо"
            prompt: {target_blocks: [{text: "Привет! Как дела?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson03.exercise02.listen_select_farewell
            type: listen_select
            tested_text: "До свидания"
            media_asset_key: ru.a1.audio.do_svidaniya.neutral.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit01.lesson03.exercise03.choose_casual_bye
            type: multiple_choice
            tested_text: "Пока"
            prompt: {target_blocks: [{text: "You are saying goodbye to a close friend.", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson03.exercise04.match_responses
            type: matching_pairs
            tested_text: "Хорошо спасибо Так себе До свидания Пока Здравствуйте Привет Доброе утро Добрый вечер"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Хорошо, спасибо.", right: "Fine, thanks."}
              - {left: "Так себе.", right: "So-so."}
              - {left: "До свидания!", right: "Goodbye! (neutral/formal)"}
              - {left: "Пока!", right: "Bye! (informal)"}
              - {left: "Здравствуйте!", right: "Hello! (formal/neutral)"}
              - {left: "Привет!", right: "Hi! (informal)"}
              - {left: "Доброе утро!", right: "Good morning!"}
              - {left: "Добрый вечер!", right: "Good evening!"}
          - content_key: ru.a1.unit01.lesson03.exercise05.order_how_are_things
            type: word_order
            tested_text: "Как дела"
            prompt: {target_blocks: []}
            word_bank: ["дела", "Как"]
          - content_key: ru.a1.unit01.lesson03.exercise06.listen_order_and_you
            type: listen_order
            tested_text: "А у тебя"
            media_asset_key: ru.a1.audio.a_u_tebya.informal.01
            prompt: {target_blocks: []}
            word_bank: ["тебя", "А", "у"]
          - content_key: ru.a1.unit01.lesson03.exercise07.dialogue_comprehension_names
            type: dialogue_comprehension
            tested_text: "Анна Максим"
            media_asset_key: ru.a1.audio.dialogue.hallway_greeting.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit01.lesson03.exercise08.reply_how_are_you
            type: dialogue_response
            tested_text: "Хорошо спасибо А у тебя"
            prompt: {target_blocks: [{text: "Привет! Как дела?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson03.exercise09.complete_farewell
            type: fill_in_blank
            tested_text: "До завтра"
            prompt: {target_blocks: [{text: "До ___! (see you tomorrow)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit01.lesson03.exercise10.write_short_exchange
            type: writing_prompt
            tested_text: "Привет Как дела Хорошо спасибо"
            prompt: {target_blocks: [{text: "Write a short informal greeting exchange: say hi, ask how things are, and answer.", language_code: en, direction: ltr}]}
          - {content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie.exercise11.dictation_poka_informal, type: dictation, tested_text: "Пока", media_asset_key: ru.a1.audio.poka.informal.01, prompt: {target_blocks: []}}
