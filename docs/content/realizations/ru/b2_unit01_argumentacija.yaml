realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is ru's first
    B2 unit. No adaptable intermediate/upper-level public-domain Russian
    source was consulted for this unit; it was built from general Russian
    grammar/discourse knowledge, the same honest-disclosure precedent the
    ru B1 lane set. Sibling-isolation honored: the X->en B2 argumentation
    realization and every nl/fa/prs/de B2 file were treated as
    non-existent and were NOT opened; only ru's OWN earlier realization
    content (the Настя/Дима pair established across the ru A2/B1 lane) was
    consulted for character canon, which is not a sibling-direction
    violation. Настя (teacher) and Дима (engineer) continue their
    established informal ты register from the B1 lane; no canon conflict.
    All vocabulary is introduced self-contained within this file (B2 is a
    separate Course row from B1, so a B2 learner never sees B1 lexemes at
    runtime -- same self-containment precedent as the nl B2 exemplar).
    Gender-agreement footgun deliberately designed around: every
    learner-produced (typed/spoken) sentence in this file avoids
    first-person short-form adjectives/past-tense verbs that would force a
    speaker-gender choice (e.g. no "согласен/согласна", "убеждён/убеждена"
    asked of the learner); gendered forms only appear attributed to a
    named speaker in dialogue cards, never as open learner production.
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    First Russian B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence): state a
    claim, support it with reasons/evidence, acknowledge the strongest
    opposing point, and rebut it without conceding. Theme: работа из дома
    (working from home) -- one coherent debatable everyday issue across
    all six lessons, continuing Настя (teacher) and Дима (engineer) from
    the ru B1 lane. Lesson arc mirrors the argument structure itself: L01
    stating a claim, L02 supporting it (во-первых / например /
    исследования показывают, что), L03 acknowledging the opposing point
    (с одной стороны ... с другой стороны / хотя / конечно / это правда),
    L04 rebutting without conceding (но / однако / тем не менее / это не
    меняет того, что / короче говоря), L05 an argumentative reading text
    (distinguish the author's claim from the objection answered), L06 the
    culminating production -- a Настя/Дима debate for the listening
    requirement plus a speaking task and a writing task that each require
    a FULL argument (claim + support + acknowledged objection + rebuttal),
    not just connective drilling. No sibling-direction file was consulted.

    Prior reviewer brief (superseded): Fresh-context review needed.
    This is a DRAFT. Priority checks for the reviewer: (1)
    naturalness/idiom of every connective frame (во-первых / кроме того
    / с одной стороны ... с другой стороны / тем не менее / короче
    говоря) and that the informal ты register between Настя and Дима is
    consistent and correctly conjugated throughout; (2) the culminating
    writing exercise (lesson06 exercise06) is graded against a fixed
    multi-sentence string -- confirm the accepted-answer punctuation
    variants are complete enough that a correct learner is never marked
    wrong; (3) whether "мне не хватает общения с коллегами" and "можно
    созваниваться по видеосвязи" read as current everyday spoken
    Russian; (4) confirm "продуктивнее", "перевешивают", and
    "плюсы/минусы" read as natural in an everyday argument register (not
    overly bureaucratic); (5) explicitly re-check the gender-neutrality
    design choice above -- confirm no exercise silently requires the
    learner to pick a speaker-gendered form.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked naturalness, register, answer-key completeness, ё/е,
    gendered forms, prompt determinacy, reading-passage visibility and
    gloss accuracy across all six lessons. Fixes:
    ru.b2.unit01.lesson05.exercise07.write_vsyo_bolshe accepted_answers
    widened with е-spelling "Все больше..." and singular agreement
    "...работает из дома" (all combinations, with/without period).
    ru.b2.unit01.lesson05.exercise01-04
    (read_claim/read_objection/read_rebuttal/read_conclusion): the
    reading passage was never shown with the questions -- the full
    Russian passage is now the first prompt.target_block of each.
    ru.b2.unit01.lesson01.exercise07.write_claim and
    lesson05.exercise06.translate_horosheye_yavlenie: instructions
    pinned "using я считаю, что" (я думаю, что was an equally correct,
    unaccepted translation).
    ru.b2.unit01.lesson06.exercise05.speak_full_argument /
    exercise06.write_full_argument: instructions now name я считаю, что
    as a required signpost and (3) reads "sometimes I miss the contact
    with colleagues"; "Конечно, мне иногда не хватает..." word-order
    variants added.
    ru.b2.unit01.lesson03.exercise07.write_konechno_obshcheniya:
    "Конечно, мне иногда не хватает общения с коллегами" (+period)
    accepted. ru.b2.unit01.lesson03.exercise05.translate_hotya:
    "...иногда тебе не хватает общения" and "...иногда мне не хватает
    общения" accepted.
    ru.b2.unit01.lesson04.exercise06.write_eto_ne_menyaet: "the freedom
    outweighs it" (invited a transitive object) -> "freedom tips the
    balance" (instruction, realization prompt, feedback).
    ru.b2.unit01.lesson01.teach.grammar_tochka_zreniya: tautological
    "По-моему, это моя точка зрения" -> "Это моя точка зрения" (target +
    title/gloss). ru.b2.unit01.lesson04.teach.tem_ne_menee example
    misused тем не менее -> "Работа из дома имеет минусы. Тем не менее,
    плюсы перевешивают." / gloss updated.
    ru.b2.unit01.lesson03.teach.hotya non-sequitur gendered example ->
    "Хотя это удобно, иногда не хватает общения." / gloss updated.
    ru.b2.unit01.lesson06.teach.dialogue_nastya_rebuttal truncated
    title/gloss completed ("...outweigh the disadvantages").
    ru.b2.unit01.lesson06.exercise07.respond_defend instruction/feedback
    no longer claim "evidence" ("two signposted reasons"). NATIVE FLAGS:
    lesson03 exercise06 model "С одной стороны работа из дома удобна, с
    другой стороны мне..." lacks parenthetical commas; sentence-initial
    "Тем не менее, ..." comma; "Работа в офисе имеет плюсы" is slightly
    bookish ("У работы в офисе есть плюсы"). DEFERRED: respond_defend
    options are all English, so the exercise never tests its Russian
    tested_text (exercise reshaping); the passage-not-shown reading
    pattern also exists in ru b2_unit02 and likely other ru B2/C1 units
    (corpus sweep, out of batch); owner policy on whether self-contained
    B2 keys should accept B1-taught synonyms (я думаю) -- avoided here
    by pinning instructions.

course:
  realization_key: ru.b2
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Informal ты between Настя and Дима (continuing the ru B1 lane canon:
    Дима is an engineer, Настя is a teacher). B2 argumentation layers
    discourse connectives and signposting onto that register --
    во-первых, кроме того, с одной стороны ... с другой стороны, тем не
    менее, короче говоря -- while keeping everyday informal address.
    Learner-facing production items are authored to avoid forcing a
    speaker-gender choice (see generation_provenance note).

media_assets:
  - content_key: ru.b2.audio.argumentacija.claim_rabota_doma.01
    language: ru
    text: "Я считаю, что работа из дома лучше, чем работа в офисе."
    voice_hint: neutral_adult_female
    status: pending_generation
  - content_key: ru.b2.audio.argumentacija.vo_pervyh_vremya.01
    language: ru
    text: "Во-первых, ты экономишь много времени."
    voice_hint: neutral_adult_male
    status: pending_generation
  - content_key: ru.b2.audio.argumentacija.konechno_kollegi.01
    language: ru
    text: "Конечно, иногда мне не хватает общения с коллегами."
    voice_hint: neutral_adult_female
    status: pending_generation
  - content_key: ru.b2.audio.argumentacija.tem_ne_menee_plyusy.01
    language: ru
    text: "Тем не менее, плюсы перевешивают минусы."
    voice_hint: neutral_adult_male
    status: pending_generation
  - content_key: ru.b2.audio.dialogue.argumentacija.rabota_doma.01
    language: ru
    text: >-
      Настя: Я считаю, что работа из дома лучше, чем работа в офисе. Дима:
      Почему ты так думаешь? Настя: Во-первых, ты экономишь время на
      дорогу. Кроме того, ты продуктивнее. Дима: С другой стороны, мне не
      хватает общения с коллегами. Настя: Это правда, но это не меняет
      того, что можно созваниваться по видеосвязи. Короче говоря, плюсы
      перевешивают минусы. Дима: В этом что-то есть.
    voice_hint: two_adults_informal
    status: pending_generation

units:
  - content_key: ru.b2.unit01.argumentacija
    title: "Аргументация"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.argumentation.defend_a_position_with_evidence
    planned_lesson_count: 6

    lessons:
      - content_key: ru.b2.unit01.lesson01.tochka_zreniya
        title: "Высказать точку зрения"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: ru.b2.unit01.lesson01.teach.rabota_iz_doma
            kind: vocabulary
            target: {text: "работа из дома", language_code: ru, direction: ltr}
            introduced_tokens: [работа, из, дома]
            example: {text: "Работа из дома экономит время.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson01.teach.rabota_v_ofise
            kind: phrase
            target: {text: "работа в офисе", language_code: ru, direction: ltr}
            introduced_tokens: [в, офисе]
          - content_key: ru.b2.unit01.lesson01.teach.tochka_zreniya
            kind: vocabulary
            target: {text: "точка зрения", language_code: ru, direction: ltr}
            introduced_tokens: [точка, зрения]
            example: {text: "У меня есть чёткая точка зрения.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson01.teach.ya_schitayu_chto
            kind: phrase
            target: {text: "я считаю, что...", language_code: ru, direction: ltr}
            introduced_tokens: [я, считаю, что]
          - content_key: ru.b2.unit01.lesson01.teach.po_moemu
            kind: phrase
            target: {text: "по-моему...", language_code: ru, direction: ltr}
            introduced_tokens: [по-моему]
          - content_key: ru.b2.unit01.lesson01.teach.luchshe
            kind: vocabulary
            target: {text: "лучше", language_code: ru, direction: ltr}
            introduced_tokens: [лучше]
            example: {text: "Этот способ лучше.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson01.teach.chem
            kind: vocabulary
            target: {text: "чем", language_code: ru, direction: ltr}
            introduced_tokens: [чем]
            example: {text: "Работа из дома лучше, чем работа в офисе.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Я считаю, что работа из дома лучше, чем работа в офисе.", language_code: ru, direction: ltr}
            introduced_tokens: []
          - content_key: ru.b2.unit01.lesson01.teach.eto_moya_tochka_zreniya
            kind: phrase
            target: {text: "Это моя точка зрения.", language_code: ru, direction: ltr}
            introduced_tokens: [это, моя]
          - content_key: ru.b2.unit01.lesson01.teach.grammar_tochka_zreniya
            kind: grammar_note
            target: {text: "Я считаю, что работа из дома лучше, чем работа в офисе. Это моя точка зрения.", language_code: ru, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: ru.b2.unit01.lesson01.exercise01.recognize_tochka_zreniya
            type: multiple_choice
            tested_text: "точка зрения"
            prompt: {target_blocks: [{text: "точка зрения", language_code: ru, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson01.exercise02.listen_claim
            type: listen_select
            tested_text: "Я считаю, что работа из дома лучше, чем работа в офисе"
            media_asset_key: ru.b2.audio.argumentacija.claim_rabota_doma.01
            prompt: {target_blocks: []}
          - content_key: ru.b2.unit01.lesson01.exercise03.match_claim_words
            type: matching_pairs
            tested_text: "работа из дома работа в офисе точка зрения я считаю что по-моему лучше чем это моя точка зрения"
            prompt: {target_blocks: []}
            pairs:
              - {left: "работа из дома", right: "working from home"}
              - {left: "работа в офисе", right: "working at the office"}
              - {left: "точка зрения", right: "a point of view / position"}
              - {left: "я считаю, что...", right: "I think that..."}
              - {left: "по-моему...", right: "in my opinion..."}
              - {left: "лучше", right: "better"}
              - {left: "чем", right: "than"}
              - {left: "Это моя точка зрения.", right: "This is my point of view."}
          - content_key: ru.b2.unit01.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Я считаю что работа из дома лучше"
            prompt: {target_blocks: []}
            word_bank: ["Я", "считаю", "что", "работа", "из", "дома", "лучше"]
          - content_key: ru.b2.unit01.lesson01.exercise05.translate_po_moemu
            type: translation
            tested_text: "По-моему, работа из дома лучше"
            prompt: {target_blocks: [{text: "In my opinion, working from home is better.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson01.exercise06.speak_eto_moya_tochka_zreniya
            type: speak_response
            tested_text: "Это моя точка зрения"
            prompt: {target_blocks: [{text: "Say aloud in Russian: This is my point of view.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson01.exercise07.write_claim
            type: writing_prompt
            tested_text: "Я считаю, что работа из дома лучше, чем работа в офисе"
            prompt: {target_blocks: [{text: "Write in Russian, using я считаю, что: I think that working from home is better than working at the office.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson01.exercise08.dictation_claim_rabota_doma
            type: dictation
            tested_text: "Я считаю, что работа из дома лучше, чем работа в офисе"
            media_asset_key: ru.b2.audio.argumentacija.claim_rabota_doma.01
            prompt: {target_blocks: []}

      - content_key: ru.b2.unit01.lesson02.dovody_i_fakty
        title: "Приводить доводы и факты"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: ru.b2.unit01.lesson02.teach.vo_pervyh_vtorykh
            kind: phrase
            target: {text: "во-первых, во-вторых", language_code: ru, direction: ltr}
            introduced_tokens: ["во-первых", "во-вторых"]
          - content_key: ru.b2.unit01.lesson02.teach.ekonomit_vremya
            kind: phrase
            target: {text: "экономить время", language_code: ru, direction: ltr}
            introduced_tokens: [экономить, экономишь, время, времени]
            example: {text: "Работа из дома помогает экономить время.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson02.teach.ty
            kind: vocabulary
            target: {text: "ты", language_code: ru, direction: ltr}
            introduced_tokens: [ты]
            example: {text: "Ты экономишь много времени.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson02.teach.mnogo
            kind: vocabulary
            target: {text: "много", language_code: ru, direction: ltr}
            introduced_tokens: [много]
            example: {text: "Ты экономишь много времени.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson02.teach.naprimer
            kind: vocabulary
            target: {text: "например", language_code: ru, direction: ltr}
            introduced_tokens: [например]
            example: {text: "Ты экономишь время, например время на дорогу.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson02.teach.vremya_na_dorogu
            kind: phrase
            target: {text: "время на дорогу", language_code: ru, direction: ltr}
            introduced_tokens: [на, дорогу]
            example: {text: "Во-первых, ты экономишь время на дорогу.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson02.teach.issledovaniya_pokazyvayut
            kind: phrase
            target: {text: "исследования показывают, что...", language_code: ru, direction: ltr}
            introduced_tokens: [исследования, показывают]
          - content_key: ru.b2.unit01.lesson02.teach.produktivnee
            kind: vocabulary
            target: {text: "продуктивнее", language_code: ru, direction: ltr}
            introduced_tokens: [продуктивнее]
            example: {text: "Дома ты продуктивнее.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson02.teach.doma
            kind: vocabulary
            target: {text: "дома", language_code: ru, direction: ltr}
            introduced_tokens: [дома]
            example: {text: "Я работаю дома по пятницам.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson02.teach.grammar_dovody
            kind: grammar_note
            target: {text: "Во-первых, ты экономишь время на дорогу. Кроме того, ты продуктивнее.", language_code: ru, direction: ltr}
            introduced_tokens: [кроме, того]
        exercises:
          - content_key: ru.b2.unit01.lesson02.exercise01.recognize_vo_pervyh
            type: multiple_choice
            tested_text: "во-первых"
            prompt: {target_blocks: [{text: "во-первых", language_code: ru, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson02.exercise02.listen_vo_pervyh_vremya
            type: listen_select
            tested_text: "Во-первых, ты экономишь много времени"
            media_asset_key: ru.b2.audio.argumentacija.vo_pervyh_vremya.01
            prompt: {target_blocks: []}
          - content_key: ru.b2.unit01.lesson02.exercise03.match_argument_words
            type: matching_pairs
            tested_text: "во-первых во-вторых кроме того например исследования показывают что время на дорогу продуктивнее экономишь"
            prompt: {target_blocks: []}
            pairs:
              - {left: "во-первых", right: "firstly"}
              - {left: "во-вторых", right: "secondly"}
              - {left: "кроме того", right: "in addition"}
              - {left: "например", right: "for example"}
              - {left: "исследования показывают, что...", right: "research shows that..."}
              - {left: "время на дорогу", right: "commute time"}
              - {left: "продуктивнее", right: "more productive"}
              - {left: "экономишь", right: "(you) save"}
          - content_key: ru.b2.unit01.lesson02.exercise04.order_vo_pervyh
            type: word_order
            tested_text: "Во-первых ты экономишь много времени"
            prompt: {target_blocks: []}
            word_bank: ["Во-первых", "ты", "экономишь", "много", "времени"]
          - content_key: ru.b2.unit01.lesson02.exercise05.translate_naprimer
            type: translation
            tested_text: "Например, ты экономишь время на дорогу"
            prompt: {target_blocks: [{text: "For example, you save commute time.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson02.exercise06.translate_issledovaniya
            type: translation
            tested_text: "Исследования показывают, что работа из дома продуктивнее"
            prompt: {target_blocks: [{text: "Research shows that working from home is more productive.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson02.exercise07.write_two_reasons
            type: writing_prompt
            tested_text: "Во-первых, ты экономишь время на дорогу. Кроме того, ты продуктивнее"
            prompt: {target_blocks: [{text: "Write these two sentences in Russian, using во-первых and кроме того: Firstly, you save commute time. In addition, you are more productive.", language_code: en, direction: ltr}]}
          - content_key: ru.b2.unit01.lesson02.exercise08.dictation_vo_pervyh
            type: dictation
            tested_text: "Во-первых, ты экономишь много времени"
            media_asset_key: ru.b2.audio.argumentacija.vo_pervyh_vremya.01
            prompt: {target_blocks: []}

      - content_key: ru.b2.unit01.lesson03.drugaya_storona
        title: "Признавать другую сторону"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: ru.b2.unit01.lesson03.teach.s_odnoy_storony
            kind: phrase
            target: {text: "с одной стороны... с другой стороны...", language_code: ru, direction: ltr}
            introduced_tokens: [с, одной, стороны, другой]
          - content_key: ru.b2.unit01.lesson03.teach.hotya
            kind: vocabulary
            target: {text: "хотя", language_code: ru, direction: ltr}
            introduced_tokens: [хотя]
            example: {text: "Хотя это удобно, иногда не хватает общения.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson03.teach.konechno
            kind: vocabulary
            target: {text: "конечно", language_code: ru, direction: ltr}
            introduced_tokens: [конечно]
            example: {text: "Конечно, это правда.", language_code: ru, direction: ltr}
          - content_key: ru.b2.unit01.lesson03.teach.eto_pravda
            kind: phrase
