schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: ru
cefr_level: A1
status: reviewed
generation_provenance:
  method: ai_adapted
  authoring_system: claude
  source: >-
    The Russian FAST Course (Foreign Service Institute, US government,
    public domain), community re-OCR'd/re-typeset edition hosted at
    fsi-languages.yojik.eu/yazik/Downloads/FSI-book-stressed.pdf. Lesson 6
    supplied the "Где (находится) магазин? -Магазин на Тверской улице."
    location-asking pattern and the common-places vocabulary (магазин,
    ресторан, банк, аптека, вокзал, гостиница, библиотека) drawn from its
    "Что есть на вашей улице?" exercise. Every example sentence, exercise,
    and dialogue here was freshly authored for a natural 2026
    everyday-use context (asking where common places are located and
    describing what is on one's street), not imported verbatim from the
    source (AUTHORING_GUIDE §10). Combining acute-accent stress marks
    were stripped from every learner-facing string.
  human_reviewed: false
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: "Fresh-context full review (new-language lane, no sampling), 2026-07-12. Case agreement correct (accusative bors/salat = nom; genitive after skolko/kilo/numerals: sto rubley, kilo yablok, pyat shtuk); no stress diacritics; e/yo consistent (idyom has yo); polite vy register throughout. Fixed one unrealistic price in the unit08 market dialogue (6000->200 rubles/kg apples). All listen_* audio contains tested sentence."

course:
  realization_key: ru.a1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Teach contemporary standard Russian as spoken in Russia today. This
    unit covers asking for and giving locations of common places around
    town; a polite вы register is used throughout, appropriate for
    strangers asking each other for directions.

media_assets:
  - {content_key: ru.a1.audio.gde_nakhoditsya_magazin.neutral.01, language: ru, text: "Где находится магазин?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.magazin_na_tverskoy.neutral.01, language: ru, text: "Магазин на Тверской улице.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.gde_nakhoditsya_apteka.neutral.01, language: ru, text: "Где находится аптека?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: ru.a1.audio.apteka_na_ulitse_chaykovskogo.neutral.01, language: ru, text: "Аптека на улице Чайковского.", voice_hint: neutral_adult, status: pending_generation}
  - {content_key: ru.a1.audio.chto_est_na_vashey_ulitse.neutral.01, language: ru, text: "Что есть на вашей улице?", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: ru.a1.audio.dialogue.moya_ulitsa.01
    language: ru
    text: >-
      Анна: Что есть на вашей улице? Виктор: На моей улице есть магазин,
      библиотека и банк. Анна: А где находится банк? Виктор: Банк на
      улице Пушкина. Анна: Спасибо большое. Виктор: Пожалуйста.
    voice_hint: two_adults_neutral_polite
    status: pending_generation

units:
  - content_key: ru.a1.unit09.places
    title: "Места в городе"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.places.locate_common_places
    planned_lesson_count: 3
    lessons:
      - content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
        title: "Где находится...?"
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - {content_key: ru.a1.unit09.lesson01.teach.gde, kind: vocabulary, target: {text: "где", language_code: ru, direction: ltr}, introduced_tokens: [где], example: {text: "Где магазин?", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit09.lesson01.teach.nakhoditsya, kind: vocabulary, target: {text: "находится", language_code: ru, direction: ltr}, introduced_tokens: [находится], example: {text: "Где находится магазин?", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit09.lesson01.teach.ulitsa, kind: vocabulary, target: {text: "улица", language_code: ru, direction: ltr}, introduced_tokens: [улица, улице, на, Тверской], example: {text: "Магазин на Тверской улице.", language_code: ru, direction: ltr}}
          - {content_key: ru.a1.unit09.lesson01.teach.gde_nakhoditsya_magazin, kind: phrase, target: {text: "Где находится магазин?", language_code: ru, direction: ltr}, introduced_tokens: [магазин]}
        exercises:
          - content_key: ru.a1.unit09.lesson01.exercise01.recognize_gde
            type: multiple_choice
            tested_text: "где"
            prompt: {target_blocks: [{text: "where", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson01.exercise02.recognize_ulitsa
            type: multiple_choice
            tested_text: "улица"
            prompt: {target_blocks: [{text: "street", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson01.exercise03.listen_select_gde_magazin
            type: listen_select
            tested_text: "Где находится магазин"
            media_asset_key: ru.a1.audio.gde_nakhoditsya_magazin.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson01.exercise04.match_location_words
            type: matching_pairs
            tested_text: "где находится улица магазин"
            prompt: {target_blocks: []}
            pairs:
              - {left: "где", right: "where"}
              - {left: "находится", right: "is located"}
              - {left: "улица", right: "street"}
              - {left: "магазин", right: "store"}
          - content_key: ru.a1.unit09.lesson01.exercise05.order_gde_nakhoditsya_magazin
            type: word_order
            tested_text: "Где находится магазин"
            prompt: {target_blocks: []}
            word_bank: ["находится", "Где", "магазин"]
          - content_key: ru.a1.unit09.lesson01.exercise06.listen_order_magazin_na_tverskoy
            type: listen_order
            tested_text: "Магазин на Тверской улице"
            media_asset_key: ru.a1.audio.magazin_na_tverskoy.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["улице", "Магазин", "на", "Тверской"]
          - content_key: ru.a1.unit09.lesson01.exercise07.complete_gde_nakhoditsya
            type: fill_in_blank
            tested_text: "Где находится магазин"
            prompt: {target_blocks: [{text: "___ находится магазин? (Where)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson01.exercise08.write_ask_where_store
            type: writing_prompt
            tested_text: "Где находится магазин"
            prompt: {target_blocks: [{text: "Write a question asking where the store is, using \"Где находится...?\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit09.lesson02.mesta_v_gorode
        title: "Места в городе"
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - content_key: ru.a1.unit09.lesson02.teach.bank_apteka
            kind: vocabulary
            target: {text: "банк, аптека", language_code: ru, direction: ltr}
            introduced_tokens: [банк, аптека]
            example:
              - {text: "Где находится банк?", language_code: ru, direction: ltr}
              - {text: "Где находится аптека?", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit09.lesson02.teach.vokzal_gostinitsa
            kind: vocabulary
            target: {text: "вокзал, гостиница", language_code: ru, direction: ltr}
            introduced_tokens: [вокзал, гостиница]
            example:
              - {text: "Где находится вокзал?", language_code: ru, direction: ltr}
              - {text: "Где находится гостиница?", language_code: ru, direction: ltr}
          - content_key: ru.a1.unit09.lesson02.teach.restoran_biblioteka
            kind: vocabulary
            target: {text: "ресторан, библиотека", language_code: ru, direction: ltr}
            introduced_tokens: [ресторан, библиотека, Чайковского, Горького, Пушкина]
            example:
              - {text: "Где находится ресторан?", language_code: ru, direction: ltr}
              - {text: "Где находится библиотека?", language_code: ru, direction: ltr}
        exercises:
          - content_key: ru.a1.unit09.lesson02.exercise01.recognize_apteka
            type: multiple_choice
            tested_text: "аптека"
            prompt: {target_blocks: [{text: "pharmacy", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson02.exercise02.recognize_vokzal
            type: multiple_choice
            tested_text: "вокзал"
            prompt: {target_blocks: [{text: "train station", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson02.exercise03.listen_select_gde_apteka
            type: listen_select
            tested_text: "Где находится аптека"
            media_asset_key: ru.a1.audio.gde_nakhoditsya_apteka.neutral.01
            prompt: {target_blocks: [{text: "What place is being asked about?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson02.exercise04.match_places_around_town
            type: matching_pairs
            tested_text: "банк аптека вокзал гостиница ресторан библиотека"
            prompt: {target_blocks: []}
            pairs:
              - {left: "банк", right: "bank"}
              - {left: "аптека", right: "pharmacy"}
              - {left: "вокзал", right: "train station"}
              - {left: "гостиница", right: "hotel"}
              - {left: "ресторан", right: "restaurant"}
              - {left: "библиотека", right: "library"}
          - content_key: ru.a1.unit09.lesson02.exercise05.order_gde_nakhoditsya_bank
            type: word_order
            tested_text: "Где находится банк"
            prompt: {target_blocks: []}
            word_bank: ["находится", "Где", "банк"]
          - content_key: ru.a1.unit09.lesson02.exercise06.listen_order_apteka_na_ulitse
            type: listen_order
            tested_text: "Аптека на улице Чайковского"
            media_asset_key: ru.a1.audio.apteka_na_ulitse_chaykovskogo.neutral.01
            prompt: {target_blocks: []}
            word_bank: ["улице", "Аптека", "на", "Чайковского"]
          - content_key: ru.a1.unit09.lesson02.exercise07.complete_gde_nakhoditsya_biblioteka
            type: fill_in_blank
            tested_text: "Где находится библиотека"
            prompt: {target_blocks: [{text: "Где ___ библиотека? (is located)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson02.exercise08.write_ask_where_library
            type: writing_prompt
            tested_text: "Где находится библиотека"
            prompt: {target_blocks: [{text: "Write a question asking where the library is, using \"Где находится...?\".", language_code: en, direction: ltr}]}

      - content_key: ru.a1.unit09.lesson03.moya_ulitsa
        title: "Диалог: моя улица"
        spine_outcome_id: universal.a1.places.locate_common_places
        teaching:
          - {content_key: ru.a1.unit09.lesson03.teach.chto_est_na_vashey_ulitse, kind: phrase, target: {text: "Что есть на вашей улице?", language_code: ru, direction: ltr}, introduced_tokens: [Что, есть, вашей, спасибо, пожалуйста, магазин]}
          - {content_key: ru.a1.unit09.lesson03.teach.anna_chto_est, kind: dialogue, target: {text: "Анна: Что есть на вашей улице?", language_code: ru, direction: ltr}, introduced_tokens: [Анна]}
          - {content_key: ru.a1.unit09.lesson03.teach.viktor_na_moey_ulitse, kind: dialogue, target: {text: "Виктор: На моей улице есть магазин, библиотека и банк.", language_code: ru, direction: ltr}, introduced_tokens: [Виктор, моей, и]}
          - {content_key: ru.a1.unit09.lesson03.teach.anna_a_gde_bank, kind: dialogue, target: {text: "Анна: А где находится банк?", language_code: ru, direction: ltr}, introduced_tokens: []}
          - {content_key: ru.a1.unit09.lesson03.teach.viktor_bank_na_pushkina, kind: dialogue, target: {text: "Виктор: Банк на улице Пушкина.", language_code: ru, direction: ltr}, introduced_tokens: [Пушкина]}
          - {content_key: ru.a1.unit09.lesson03.teach.anna_spasibo_bolshoe, kind: dialogue, target: {text: "Анна: Спасибо большое.", language_code: ru, direction: ltr}, introduced_tokens: [большое]}
        exercises:
          - content_key: ru.a1.unit09.lesson03.exercise01.choose_ask_whats_on_street
            type: multiple_choice
            tested_text: "Что есть на вашей улице"
            prompt: {target_blocks: [{text: "You want to ask someone what places are on their street. What do you say?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson03.exercise02.listen_select_chto_est
            type: listen_select
            tested_text: "Что есть на вашей улице"
            media_asset_key: ru.a1.audio.chto_est_na_vashey_ulitse.neutral.01
            prompt: {target_blocks: [{text: "What is being asked?", language_code: en, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson03.exercise03.dialogue_comprehension_moya_ulitsa
            type: dialogue_comprehension
            tested_text: "магазин библиотека банк Пушкина"
            media_asset_key: ru.a1.audio.dialogue.moya_ulitsa.01
            prompt: {target_blocks: []}
          - content_key: ru.a1.unit09.lesson03.exercise04.match_street_phrases
            type: matching_pairs
            tested_text: "банк находится улице спасибо пожалуйста магазин"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Где находится банк?", right: "Where is the bank?"}
              - {left: "Банк на улице Пушкина.", right: "The bank is on Pushkin Street."}
              - {left: "Что есть на вашей улице?", right: "What is on your street?"}
              - {left: "На моей улице есть магазин.", right: "On my street there's a store."}
              - {left: "Спасибо большое.", right: "Thank you very much."}
              - {left: "Пожалуйста.", right: "You're welcome."}
          - content_key: ru.a1.unit09.lesson03.exercise05.order_bank_na_ulitse_pushkina
            type: word_order
            tested_text: "Банк на улице Пушкина"
            prompt: {target_blocks: []}
            word_bank: ["улице", "Банк", "на", "Пушкина"]
          - content_key: ru.a1.unit09.lesson03.exercise06.reply_gde_nakhoditsya_restoran
            type: dialogue_response
            tested_text: "Ресторан на улице Горького"
            prompt: {target_blocks: [{text: "Где находится ресторан?", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson03.exercise07.complete_na_moey_ulitse
            type: fill_in_blank
            tested_text: "На моей улице есть магазин"
            prompt: {target_blocks: [{text: "На ___ улице есть магазин. (my)", language_code: ru, direction: ltr}]}
          - content_key: ru.a1.unit09.lesson03.exercise08.write_describe_street
            type: writing_prompt
            tested_text: "На моей улице есть магазин библиотека и банк"
            prompt: {target_blocks: [{text: "Write two or three sentences describing what places are on your street.", language_code: en, direction: ltr}]}
