generation_provenance:
  method: ai_generated
  authoring_system: claude
  source: >-
    No direct public-domain source was consulted. The unit was freshly
    authored for B1 Russian hypothetical conditionals: "если бы + прошедшее
    время, ... бы + прошедшее время" for an unreal condition and result, and
    bare "бы + прошедшее время" to soften a request or preference, ending in
    a dialogue that uses both. Continuing the ru B1 lane.
  human_reviewed: false
review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: "New Claude-authored B1 draft. Needs fresh-context review.\n\nFresh-context review 2026-10-11 (content-reviewer.md checklist): Checked token coverage against earlier en-ru units (course-scoped), character canon (Дима engineer, Настя teacher, friends on ты), every example_gloss against its example, teaching-card/overlay coverage, dialogue cards vs audio turn by turn with speakers, listen_select distractors vs audio, YAML boolean lookalikes, learner-visible internal notes, and ё/е spelling of free-text answers (grader has no ё/е fold). Fixes (en-ru overlay): ru.b1.unit49.lesson03.exercise02.dialogue_comprehension_hypothetical correct_option + accepted value 'Dima asks Nastya to explain what's needed for the report' -> 'Dima asks Nastya to help with the report' (the old key was false: Nastya asks Dima to explain); ru.b1.unit49.lesson02.exercise06.write_ty_by_mog accepted answers widened with Ты бы могла / Вы бы могли and the мог бы / могла бы / могли бы orders (prompt does not fix addressee), feedback names the variants; ru.b1.unit49.lesson03.exercise06.write_full_hypothetical widened with могла / Вы бы могли requests and the 'я бы больше путешествовал(а)' order; ru.b1.unit49.lesson01.exercise06.write_esli_by_vremeni widened with 'я бы больше путешествовал(а)' and 'я путешествовал(а) бы больше'; ru.b1.unit49.lesson02.exercise05.order_ja_by_khotela added the 'Я хотела бы чашку кофе, пожалуйста' order; ru.b1.unit49.lesson01.exercise05.order_esli_by_deneg added the '...я купил бы новую машину' order; ru.b1.unit49.lesson03.exercise01.choose_full_hypothetical two distractors made two-sentence (one bare-бы-only pair, one если-бы-only pair) so the answer no longer shows by form. NATIVE FLAG: lesson03 exercise04 tiles also allow less natural orders such as 'я не просил бы' (not accepted; native to judge). DEFERRED: grader-level ё/е equivalence (backend/app/review/grading.py, Codex lane, owner decision).\n\nFresh-context review 2026-10-17 (round 2, backlog it/ru): 0 fixes. Checked audio vs cards turn by turn, distractors, accepted answers (gender, ты/вы, orders), canon. NATIVE FLAGS: none new. DEFERRED: grammar-card jargon tokens (прошедшее, время, нереальное, условие, смягчённая, просьба) register as learner vocabulary, noted only (known ru B1 defect)."

course:
  realization_key: ru.b1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Use contemporary standard Russian. Use formal вы in offices and with staff
    and colleagues; use informal ты between recurring friends Настя and Дима.
    Canon: Дима is an engineer and Настя is a teacher.

media_assets:
  - {content_key: ru.b1.audio.esli_by_bolshe_vremeni.neutral.01, language: ru, text: "Если бы у меня было больше времени, я бы путешествовал больше.", voice_hint: neutral_adult_male, status: pending_generation}
  - {content_key: ru.b1.audio.ty_by_mog_pomoch.neutral.01, language: ru, text: "Ты бы мог помочь мне с этим?", voice_hint: neutral_adult_female, status: pending_generation}
  - content_key: ru.b1.audio.dialogue.esli_by_i_prosba.01
    language: ru
    text: >-
      Настя: Если бы у меня было больше времени, я бы путешествовала больше.
      Дима: Понимаю. А сейчас у тебя есть время помочь мне с этим отчётом?
      Настя: Ты бы мог сначала объяснить, что нужно сделать? Дима: Конечно.
      Если бы это было просто, я бы не просил.
    voice_hint: two_adults_informal
    status: pending_generation

units:
  - content_key: ru.b1.unit49.gipoteza_uslovie
    title: "Гипотеза и условие"
    section: reading_writing
    spine_outcome_ids:
      - universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
    planned_lesson_count: 3
    lessons:
      - content_key: ru.b1.unit49.lesson01.esli_by_bolshe_vremeni
        title: "Если бы у меня было..."
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
        teaching:
          - {content_key: ru.b1.unit49.lesson01.teach.esli_by_bolshe_vremeni, kind: phrase, target: {text: "Если бы у меня было больше времени, я бы путешествовал больше.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [Если, бы, у, меня, было, больше, времени, я, путешествовал, больше]}
          - {content_key: ru.b1.unit49.lesson01.teach.esli_by_grammar, kind: grammar_note, target: {text: "если бы + прошедшее время, ... бы + прошедшее время = нереальное условие", language_code: ru, direction: ltr}, introduced_tokens: [прошедшее, время, нереальное, условие], example: {text: "Если бы у меня было больше денег, я бы купил новую машину.", language_code: ru, direction: ltr}}
          - {content_key: ru.b1.unit49.lesson01.teach.esli_by_bolshe_deneg, kind: phrase, target: {text: "Если бы у меня было больше денег, я бы купил новую машину.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [денег, купил, новую, машину]}
        exercises:
          - content_key: ru.b1.unit49.lesson01.exercise01.recognize_esli_by_vremeni
            type: multiple_choice
            tested_text: "если бы у меня было больше времени я бы путешествовал больше"
            prompt: {target_blocks: [{text: "which Russian sentence means \"if I had more time, I would travel more\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson01.exercise02.recognize_esli_by_deneg
            type: multiple_choice
            tested_text: "если бы у меня было больше денег я бы купил новую машину"
            prompt: {target_blocks: [{text: "which Russian sentence means \"if I had more money, I would buy a new car\"", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson01.exercise03.listen_select_esli_by
            type: listen_select
            tested_text: "Если бы у меня было больше времени я бы путешествовал больше"
            media_asset_key: ru.b1.audio.esli_by_bolshe_vremeni.neutral.01
            prompt: {target_blocks: [{text: "Listen. What is the hypothetical condition and result?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson01.exercise04.match_esli_by_words
            type: matching_pairs
            tested_text: "если бы у меня было больше времени я бы путешествовал денег купил новую машину"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Если бы", right: "If"}
              - {left: "у меня было больше времени", right: "I had more time"}
              - {left: "я бы путешествовал больше", right: "I would travel more"}
              - {left: "больше денег", right: "more money"}
              - {left: "я бы купил", right: "I would buy"}
              - {left: "новую машину", right: "a new car"}
          - content_key: ru.b1.unit49.lesson01.exercise05.order_esli_by_deneg
            type: word_order
            tested_text: "Если бы у меня было больше денег я бы купил новую машину"
            prompt: {target_blocks: []}
            word_bank: ["Если", "бы", "у", "меня", "было", "больше", "денег", "я", "бы", "купил", "новую", "машину"]
          - content_key: ru.b1.unit49.lesson01.exercise06.write_esli_by_vremeni
            type: writing_prompt
            tested_text: "Если бы у меня было больше времени я бы путешествовал больше"
            prompt: {target_blocks: [{text: "Write exactly this hypothetical sentence using если бы + past tense for the condition and бы + past tense for the result: If I had more time, I would travel more.", language_code: en, direction: ltr}]}

          - {content_key: ru.b1.unit49.lesson01.esli_by_bolshe_vremeni.exercise07.dictation, type: dictation, tested_text: "Если бы у меня было больше времени, я бы путешествовал больше.", media_asset_key: ru.b1.audio.esli_by_bolshe_vremeni.neutral.01, prompt: {target_blocks: []}}
      - content_key: ru.b1.unit49.lesson02.ty_by_mog_pomoch
        title: "Ты бы мог помочь..."
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
        teaching:
          - {content_key: ru.b1.unit49.lesson02.teach.ty_by_mog_pomoch, kind: phrase, target: {text: "Ты бы мог помочь мне с этим?", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [Ты, мог, помочь, мне, с, этим]}
          - {content_key: ru.b1.unit49.lesson02.teach.bare_by_grammar, kind: grammar_note, target: {text: "бы + прошедшее время (без если) = смягчённая просьба", language_code: ru, direction: ltr}, introduced_tokens: [без, смягчённая, просьба], example: {text: "Ты бы мог помочь мне с этим? — это смягчённая просьба, без если.", language_code: ru, direction: ltr}}
          - {content_key: ru.b1.unit49.lesson02.teach.ja_by_khotela_kofe, kind: phrase, target: {text: "Я бы хотела чашку кофе, пожалуйста.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [хотела, чашку, кофе, пожалуйста]}
        exercises:
          - content_key: ru.b1.unit49.lesson02.exercise01.recognize_ty_by_mog
            type: multiple_choice
            tested_text: "ты бы мог помочь мне с этим"
            prompt: {target_blocks: [{text: "which Russian sentence means \"could you help me with this?\" (a softened request, no если)", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson02.exercise02.recognize_ja_by_khotela
            type: multiple_choice
            tested_text: "я бы хотела чашку кофе пожалуйста"
            prompt: {target_blocks: [{text: "which Russian sentence means \"I would like a cup of coffee, please\" (a softened preference)", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson02.exercise03.listen_select_ty_by_mog
            type: listen_select
            tested_text: "Ты бы мог помочь мне с этим"
            media_asset_key: ru.b1.audio.ty_by_mog_pomoch.neutral.01
            prompt: {target_blocks: [{text: "Listen. What softened request is made?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson02.exercise04.match_bare_by_words
            type: matching_pairs
            tested_text: "ты бы мог помочь мне с этим я бы хотела чашку кофе пожалуйста"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Ты бы мог", right: "Could you"}
              - {left: "помочь мне", right: "help me"}
              - {left: "с этим", right: "with this"}
              - {left: "Я бы хотела", right: "I would like"}
              - {left: "чашку кофе", right: "a cup of coffee"}
              - {left: "смягчённая просьба", right: "a softened request"}
          - content_key: ru.b1.unit49.lesson02.exercise05.order_ja_by_khotela
            type: word_order
            tested_text: "Я бы хотела чашку кофе пожалуйста"
            prompt: {target_blocks: []}
            word_bank: ["Я", "бы", "хотела", "чашку", "кофе", "пожалуйста"]
          - content_key: ru.b1.unit49.lesson02.exercise06.write_ty_by_mog
            type: writing_prompt
            tested_text: "Ты бы мог помочь мне с этим"
            prompt: {target_blocks: [{text: "Write exactly this softened request using бы alone (no если): Could you help me with this?", language_code: en, direction: ltr}]}

      - content_key: ru.b1.unit49.lesson03.esli_by_i_prosba
        title: "Если бы... и просьба"
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
        teaching:
          - {content_key: ru.b1.unit49.lesson03.teach.nastya_hypothetical, kind: dialogue, target: {text: "Если бы у меня было больше времени, я бы путешествовала больше.", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [путешествовала]}
          - {content_key: ru.b1.unit49.lesson03.teach.dima_ask_time, kind: dialogue, target: {text: "Понимаю. А сейчас у тебя есть время помочь мне с этим отчётом?", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [Понимаю, А, сейчас, тебя, есть, время, отчётом]}
          - {content_key: ru.b1.unit49.lesson03.teach.nastya_soft_request, kind: dialogue, target: {text: "Ты бы мог сначала объяснить, что нужно сделать?", language_code: ru, direction: ltr, speaker: "Настя"}, introduced_tokens: [сначала, объяснить, что, нужно, сделать]}
          - {content_key: ru.b1.unit49.lesson03.teach.dima_hypothetical_reply, kind: dialogue, target: {text: "Конечно. Если бы это было просто, я бы не просил.", language_code: ru, direction: ltr, speaker: "Дима"}, introduced_tokens: [Конечно, это, просто, не, просил]}
        exercises:
          - content_key: ru.b1.unit49.lesson03.exercise01.choose_full_hypothetical
            type: multiple_choice
            tested_text: "если бы у меня было больше времени я бы путешествовала больше ты бы мог сначала объяснить что нужно сделать"
            prompt: {target_blocks: [{text: "Which answer states a hypothetical condition-and-result with если бы AND uses бы alone to soften a request, all in one exchange?", language_code: en, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson03.exercise02.dialogue_comprehension_hypothetical
            type: dialogue_comprehension
            tested_text: "если бы у меня было больше времени я бы путешествовала больше понимаю а сейчас у тебя есть время помочь мне с этим отчётом ты бы мог сначала объяснить что нужно сделать конечно если бы это было просто я бы не просил"
            media_asset_key: ru.b1.audio.dialogue.esli_by_i_prosba.01
            prompt: {target_blocks: []}
          - content_key: ru.b1.unit49.lesson03.exercise03.match_dialogue_hypothetical
            type: matching_pairs
            tested_text: "если бы у меня было больше времени я бы путешествовала больше а сейчас у тебя есть время помочь мне с этим отчётом ты бы мог сначала объяснить что нужно сделать если бы это было просто я бы не просил"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Если бы у меня было больше времени, я бы путешествовала больше.", right: "If I had more time, I would travel more."}
              - {left: "А сейчас у тебя есть время помочь мне с этим отчётом?", right: "Do you have time right now to help me with this report?"}
              - {left: "Ты бы мог сначала объяснить, что нужно сделать?", right: "Could you first explain what needs to be done?"}
              - {left: "Если бы это было просто, я бы не просил.", right: "If it were simple, I wouldn't be asking."}
              - {left: "отчётом", right: "report"}
              - {left: "нереальное условие", right: "an unreal condition"}
          - content_key: ru.b1.unit49.lesson03.exercise04.order_dima_hypothetical_reply
            type: word_order
            tested_text: "Если бы это было просто я бы не просил"
            prompt: {target_blocks: []}
            word_bank: ["Если", "бы", "это", "было", "просто", "я", "бы", "не", "просил"]
          - content_key: ru.b1.unit49.lesson03.exercise05.reply_ask_for_time
            type: dialogue_response
            tested_text: "Ты бы мог сначала объяснить что нужно сделать"
            prompt: {target_blocks: [{text: "Дима: Понимаю. А сейчас у тебя есть время помочь мне с этим отчётом?", language_code: ru, direction: ltr}]}
          - content_key: ru.b1.unit49.lesson03.exercise06.write_full_hypothetical
            type: writing_prompt
            tested_text: "Если бы у меня было больше времени я бы путешествовал больше Ты бы мог помочь мне с этим"
            prompt: {target_blocks: [{text: "Write two sentences: (1) a hypothetical condition-and-result using если бы + past tense and бы + past tense that if you had more time, you would travel more; (2) a separate softened request using бы alone (no если): Could you help me with this?", language_code: en, direction: ltr}]}
