  notes: "New Claude-authored B1 draft. Needs fresh-context review.\n\nFresh-context review 2026-10-11 (content-reviewer.md checklist): checked realization + en-ru overlay for dialogue/audio speaker match, character canon, distractors, accepted-answer completeness (incl. ё/е spelling and first-person gender), YAML boolean/jargon leaks, overlay coverage of every teaching card, and example_gloss accuracy. Fixes: ru.b1.unit46.lesson01.exercise06.write_master_prihodil — added е-spelling answer (все еще течет); ru.b1.unit46.lesson03.exercise06.write_full_complaint — prompt/instruction re-pinned to two sentences with optional greeting, added е-spelling answers and Здравствуйте-prefixed answers (ё and е) for both the хочу, чтобы and Пришлите forms; ru.b1.unit46.lesson01.teach.no_vsyo_eshcho_grammar and ru.b1.unit46.lesson02.teach.hochu_chtoby_grammar — example_gloss now translates the example sentence. NATIVE FLAG: ru.b1.unit46.lesson02.teach.hochu_chtoby_grammar / ru.b1.unit46.lesson02.teach.hochu_chtoby_vy_prislali present Я хочу, чтобы вы... as a polite request (вежливая просьба); natively it is a firm, direct demand — consider просьба/требование and a note saying it states firmly what you want. DEFERRED: ru.b1.unit46.lesson01.master_prihodil.exercise07.dictation is orthography_strict with ё in its single correct_response, so an е-typist fails; needs ё/е equivalence in canonical_text() (backend/app/review/grading.py, Codex lane, owner decision), which would also cover mixed spellings like всё еще.\n\nFresh-context review 2026-10-17 (round 2, backlog it/ru): 0 fixes - reviewed realization and overlay against the 9 bug classes; no learner-facing defects found. NATIVE FLAGS: Я хочу, чтобы вы прислали... is taught as a polite request (вежливая просьба) but natively reads as a firm direct demand (carried from the 2026-10-11 review, still open); mixed-spelling answers such as \"всё еще течёт\" are not accepted (no ё/е folding in grading); metalanguage tokens (вежливая, просьба, проблема не решена) registered as vocabulary (known HANDOVER defect). DEFERRED: ё/е folding in dictation (backend).\n\nSecond-pass review 2026-10-18: 2 fixes — lesson03.exercise06.write_full_complaint: instruction no longer prints the imperative answer verbatim (now \"the polite imperative with пожалуйста\"), realization prompt aligned with overlay instruction (names both accepted forms); lesson03.exercise05.reply_what_do_you_want: added \"Я хочу, чтобы вы сегодня прислали другого мастера.\" and pronoun-less \"Хочу, чтобы…\". NATIVE FLAGS: grammar note calls хочу, чтобы вы + past a \"вежливая просьба\" (it is closer to a firm, direct request)."

course:
  realization_key: ru.b1
  target_language_first: true
  dialect: ru_RU_standard
  register_policy: >-
    Use contemporary standard Russian. Use formal вы in offices and with staff
    and colleagues; use informal ты between recurring friends Настя and Дима.
    Canon: Дима is an engineer and Настя is a teacher. The building manager
    (Управляющий) is addressed with вы, as established in a2_unit29_remont.

