course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Color language stays in simple present tense with fixed adjective-plus-noun or noun-phrase collocations that must be memorized: dark blue, light green, goes well with, too bright, What's your favorite color? Keep the register casual and warm, appropriate for describing everyday objects, clothing, and personal preferences to a friend or coworker, not a design/art-critique register."

media_assets:
  - {content_key: "en.a1.audio.colors.words.black.01", language: "en", text: "black", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.colors.phrases.dark_blue.01", language: "en", text: "dark blue", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.colors.01"
    language: "en"
    text: "Daniel: I need a new shirt for our presentation next week. Can you help me choose a color? Mia: Sure! What colors do you like? Daniel: I like blue and green, but I'm not sure what looks professional. Mia: Dark blue is a great choice. It looks professional, and it goes well with black pants. Daniel: What about this yellow one? Mia: Yellow is a fun color, but it's too bright for a presentation. I'd choose the dark blue shirt. Daniel: Thanks, Mia. Dark blue it is!"
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
