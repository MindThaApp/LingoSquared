        teaching:
          - {content_key: "en.a1.unit43.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "I need a new shirt for our presentation next week. Can you help me choose a color?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I", "need", "a", "new", "shirt", "for", "our", "presentation", "next", "week", "Can", "you", "help", "me", "choose", "color"], media_asset_key: "en.a1.audio.dialogue.colors.01"}
          - {content_key: "en.a1.unit43.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Sure! What colors do you like?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Sure", "What", "colors", "do", "you", "like"]}
          - {content_key: "en.a1.unit43.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "I like blue and green, but I'm not sure what looks professional.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I", "like", "blue", "and", "green", "but", "I'm", "not", "sure", "what", "looks", "professional"]}
          - {content_key: "en.a1.unit43.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Dark blue is a great choice. It looks professional, and it goes well with black pants.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Dark", "blue", "is", "a", "great", "choice", "It", "looks", "professional", "and", "goes", "well", "with", "black", "pants"]}
          - {content_key: "en.a1.unit43.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "What about this yellow one?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "about", "this", "yellow", "one"]}
          - {content_key: "en.a1.unit43.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Yellow is a fun color, but it's too bright for a presentation. I'd choose the dark blue shirt.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Yellow", "is", "a", "fun", "color", "but", "it's", "too", "bright", "for", "presentation", "I'd", "choose", "the", "dark", "blue", "shirt"]}
          - {content_key: "en.a1.unit43.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Thanks, Mia. Dark blue it is!", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thanks", "Mia", "Dark", "blue", "it", "is"]}
