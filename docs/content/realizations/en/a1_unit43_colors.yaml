          - {content_key: "en.a1.unit43.lesson02.exercise05.translate_favorite_color_question", type: "translation", tested_text: "What's your favorite color?", prompt: {target_blocks: [{text: "Translate: \"What's your favorite color?\"", language_code: "en", direction: "ltr"}]}}

