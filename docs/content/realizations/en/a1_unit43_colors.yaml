          - {content_key: "en.a1.unit43.lesson01.exercise04.order_white_sentence", type: "word_order", tested_text: "Her shirt is white.", word_bank: ["Her", "shirt", "is", "white."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
