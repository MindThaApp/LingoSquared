          - {content_key: "en.a1.unit43.lesson02.teach.whats_your_favorite_color", kind: "phrase", target: {text: "What's your favorite color?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What's", "your", "favorite", "color"]}
