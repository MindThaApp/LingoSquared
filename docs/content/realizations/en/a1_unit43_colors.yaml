    title: "Describing colors"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.colors.describe_colors"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit43.lesson01.colors_vocabulary"
        title: "Words for colors"
        spine_outcome_id: "universal.a1.colors.describe_colors"
        teaching:
          - {content_key: "en.a1.unit43.lesson01.teach.red", kind: "vocabulary", target: {text: "red", language_code: "en", direction: "ltr"}, introduced_tokens: ["red", "My", "car", "is"], example: {text: "My car is red.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit43.lesson01.teach.blue", kind: "vocabulary", target: {text: "blue", language_code: "en", direction: "ltr"}, introduced_tokens: ["blue", "The", "sky", "is"], example: {text: "The sky is blue.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit43.lesson01.teach.green", kind: "vocabulary", target: {text: "green", language_code: "en", direction: "ltr"}, introduced_tokens: ["green", "The", "grass", "is"], example: {text: "The grass is green.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit43.lesson01.teach.yellow", kind: "vocabulary", target: {text: "yellow", language_code: "en", direction: "ltr"}, introduced_tokens: ["yellow", "The", "sun", "is"], example: {text: "The sun is yellow.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit43.lesson01.teach.black", kind: "vocabulary", target: {text: "black", language_code: "en", direction: "ltr"}, introduced_tokens: ["black", "His", "shoes", "are"], example: {text: "His shoes are black.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit43.lesson01.teach.white", kind: "vocabulary", target: {text: "white", language_code: "en", direction: "ltr"}, introduced_tokens: ["white", "Her", "shirt", "is"], example: {text: "Her shirt is white.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit43.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "black", media_asset_key: "en.a1.audio.colors.words.black.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit43.lesson01.exercise02.choose_yellow_meaning", type: "multiple_choice", tested_text: "yellow", prompt: {target_blocks: [{text: "Which color is the color of the sun?", language_code: "en", direction: "ltr"}]}}
