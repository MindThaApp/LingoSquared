        teaching:
          - {content_key: "en.a1.unit43.lesson02.teach.dark_blue", kind: "phrase", target: {text: "dark blue", language_code: "en", direction: "ltr"}, introduced_tokens: ["dark", "blue", "He's", "wearing", "a", "shirt"], example: {text: "He's wearing a dark blue shirt.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit43.lesson02.teach.light_green", kind: "phrase", target: {text: "light green", language_code: "en", direction: "ltr"}, introduced_tokens: ["light", "green", "She", "painted", "her", "bedroom"], example: {text: "She painted her bedroom light green.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit43.lesson02.teach.goes_well_with", kind: "phrase", target: {text: "goes well with", language_code: "en", direction: "ltr"}, introduced_tokens: ["goes", "well", "with", "This", "blue", "shirt", "black", "pants"], example: {text: "This blue shirt goes well with black pants.", language_code: "en", direction: "ltr"}}
