course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: expressing regret and wishes about the past -- what you wish had happened, what you should have done, and what would have been different -- using past-hypothetical constructions (wish + past perfect, should have + past participle, if + past perfect / would have + past participle), in a reflective, honest everyday register between colleagues."

media_assets:
  - {content_key: "en.b1.audio.regret.phrase.hindsight.01", language: "en", text: "hindsight", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.regret.sentence.01", language: "en", text: "I wish I had asked for help sooner.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.regret.01"
    language: "en"
    text: "Daniel: Looking back, I wish I had asked for help sooner. Leila: What happened? Daniel: I should have talked to my manager earlier about the workload. By the time I did, I had already missed one deadline. Leila: That's a fair regret, but you fixed it in the end. Daniel: True. If I had asked Mia for help in week one, I would have finished both projects on time. Leila: Well, now you know for next time."
    voice_hint: "two_adults_neutral_reflective"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit17.regret"
    title: "I wish I had asked for help sooner"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.hypotheticals.express_regret_and_past_wishes"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit17.lesson01.regret_vocabulary"
        title: "Words for regret and wishes"
        spine_outcome_id: "universal.b1.hypotheticals.express_regret_and_past_wishes"
        teaching:
          - {content_key: "en.b1.unit17.lesson01.teach.regret", kind: "vocabulary", target: {text: "regret", language_code: "en", direction: "ltr"}, introduced_tokens: ["regret"], example: {text: "Daniel felt regret about missing the deadline.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit17.lesson01.teach.wish", kind: "vocabulary", target: {text: "wish", language_code: "en", direction: "ltr"}, introduced_tokens: ["wish"], example: {text: "Daniel had one wish about the past week.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit17.lesson01.teach.mistake", kind: "vocabulary", target: {text: "mistake", language_code: "en", direction: "ltr"}, introduced_tokens: ["mistake"], example: {text: "Waiting so long to ask for help was a mistake.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit17.lesson01.teach.hindsight", kind: "vocabulary", target: {text: "hindsight", language_code: "en", direction: "ltr"}, introduced_tokens: ["hindsight"], example: {text: "In hindsight, Daniel should have spoken up sooner.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit17.lesson01.teach.procrastinate", kind: "vocabulary", target: {text: "procrastinate", language_code: "en", direction: "ltr"}, introduced_tokens: ["procrastinate"], example: {text: "Daniel tends to procrastinate when a task feels difficult.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit17.lesson01.teach.delay", kind: "vocabulary", target: {text: "delay", language_code: "en", direction: "ltr"}, introduced_tokens: ["delay"], example: {text: "The delay caused Daniel to miss his first deadline.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit17.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "hindsight", media_asset_key: "en.b1.audio.regret.phrase.hindsight.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit17.lesson01.exercise02.choose_regret", type: "multiple_choice", tested_text: "regret", prompt: {target_blocks: [{text: "Which word means a feeling of sadness about something you did or did not do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson01.exercise03.choose_procrastinate", type: "multiple_choice", tested_text: "procrastinate", prompt: {target_blocks: [{text: "Which word means to delay doing something you should be doing?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson01.exercise04.match_regret_words", type: "matching_pairs", tested_text: "regret wish mistake hindsight procrastinate delay", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "regret", right: "a feeling of sadness about something you did or did not do"}, {left: "wish", right: "a desire for something to be different from how it actually was"}, {left: "mistake", right: "a wrong action caused by poor judgment"}, {left: "hindsight", right: "understanding of a past event only now that it is over"}, {left: "procrastinate", right: "to delay doing something you should be doing"}, {left: "delay", right: "a period of time by which something is made later than planned"}]}
          - {content_key: "en.b1.unit17.lesson01.exercise05.write_mistake", type: "writing_prompt", tested_text: "mistake", prompt: {target_blocks: [{text: "Write the word that means a wrong action caused by poor judgment.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit17.lesson02.past_hypothetical_forms"
        title: "I wish I had asked for help sooner"
        spine_outcome_id: "universal.b1.hypotheticals.express_regret_and_past_wishes"
        teaching:
          - {content_key: "en.b1.unit17.lesson02.teach.wish_had_asked", kind: "phrase", target: {text: "I wish I had asked for help sooner.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "wish", "had", "asked", "for", "help", "sooner"], media_asset_key: "en.b1.audio.regret.sentence.01"}
          - {content_key: "en.b1.unit17.lesson02.teach.should_have_talked", kind: "phrase", target: {text: "I should have talked to my manager earlier.", language_code: "en", direction: "ltr"}, introduced_tokens: ["should", "have", "talked", "to", "my", "manager", "earlier"]}
          - {content_key: "en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished", kind: "phrase", target: {text: "If I had asked Mia for help in week one, I would have finished on time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["If", "Mia", "in", "week", "one", "would", "finished", "on", "time"]}
          - {content_key: "en.b1.unit17.lesson02.teach.grammar_past_hypothetical", kind: "grammar_note", target: {text: "To express regret about the past, use wish + past perfect (I wish I had asked...), should have + past participle (I should have talked...), or if + past perfect with would have + past participle (If I had asked..., I would have finished...). All three describe what did not really happen.", language_code: "en", direction: "ltr"}, introduced_tokens: ["To", "express", "regret", "about", "the", "past", "use", "wish", "past", "perfect", "should", "have", "past", "participle", "or", "if", "with", "would", "have", "past", "participle", "All", "three", "describe", "what", "did", "not", "really", "happen"]}
        exercises:
          - {content_key: "en.b1.unit17.lesson02.exercise01.choose_wish_had_asked", type: "multiple_choice", tested_text: "I wish I had asked for help sooner.", prompt: {target_blocks: [{text: "Which sentence expresses a wish about something that did not happen in the past?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson02.exercise02.choose_should_have_talked", type: "multiple_choice", tested_text: "I should have talked to my manager earlier.", prompt: {target_blocks: [{text: "Which sentence says what the speaker now believes was the right action to take earlier?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson02.exercise03.order_should_have_talked", type: "word_order", tested_text: "I should have talked to my manager earlier", prompt: {target_blocks: []}, word_bank: ["should", "have", "talked", "to", "my", "manager", "earlier", "I"]}
          - {content_key: "en.b1.unit17.lesson02.exercise04.reply_express_regret", type: "dialogue_response", tested_text: "I wish I had asked for help sooner", prompt: {target_blocks: [{text: "Express regret that you did not ask for help sooner, starting with 'I wish I had'.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson02.exercise05.write_if_had_asked_would_have_finished", type: "writing_prompt", tested_text: "If I had asked Mia for help in week one, I would have finished on time.", prompt: {target_blocks: [{text: "Write a sentence saying that if you had asked Mia for help in week one, you would have finished on time, starting with 'If I had asked Mia'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit17.lesson03.reading_a_reflective_message"
        title: "Reading: looking back on a busy month"
        spine_outcome_id: "universal.b1.hypotheticals.express_regret_and_past_wishes"
        teaching:
          - {content_key: "en.b1.unit17.lesson03.teach.looking_back", kind: "phrase", target: {text: "looking back", language_code: "en", direction: "ltr"}, introduced_tokens: ["looking", "back"], example: {text: "Looking back, Daniel wishes he had asked for help sooner.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit17.lesson03.teach.missed_deadline", kind: "vocabulary", target: {text: "missed deadline", language_code: "en", direction: "ltr"}, introduced_tokens: ["missed", "deadline"], example: {text: "Daniel missed one deadline before he asked for help.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit17.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Hi Leila, looking back, I wish I had asked for help sooner. I should have talked to my manager earlier about the workload. By the time I did, I had already missed one deadline. If I had asked Mia for help in week one, I would have finished both projects on time. It was a mistake to wait so long. Daniel", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Hi", "By", "the", "time", "did", "already", "one", "both", "projects", "It", "was", "a", "wait", "so", "long"]
        exercises:
          - {content_key: "en.b1.unit17.lesson03.exercise01.comprehend_what_happened", type: "reading_comprehension", tested_text: "I had already missed one deadline", prompt: {target_blocks: [{text: "What actually happened before Daniel talked to his manager?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson03.exercise02.comprehend_wished_for", tested_text: "asked Mia for help in week one", type: "reading_comprehension", prompt: {target_blocks: [{text: "What does Daniel wish he had done differently?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson03.exercise03.recognize_missed_deadline", type: "multiple_choice", tested_text: "missed deadline", prompt: {target_blocks: [{text: "Which phrase means a due date that was not met in time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson03.exercise04.order_looking_back_wish", type: "word_order", tested_text: "Looking back I wish I had asked for help sooner", prompt: {target_blocks: []}, word_bank: ["back", "I", "wish", "I", "had", "asked", "for", "help", "sooner", "Looking"]}
          - {content_key: "en.b1.unit17.lesson03.exercise05.write_mistake_to_wait", type: "writing_prompt", tested_text: "It was a mistake to wait so long.", prompt: {target_blocks: [{text: "Write a sentence saying it was a mistake to wait so long, starting with 'It was a mistake'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit17.lesson04.the_regret_dialogue"
        title: "If I had asked Mia sooner..."
        spine_outcome_id: "universal.b1.hypotheticals.express_regret_and_past_wishes"
        teaching:
          - {content_key: "en.b1.unit17.lesson04.teach.q_wish_asked_sooner", kind: "dialogue", target: {text: "Looking back, I wish I had asked for help sooner.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: [], media_asset_key: "en.b1.audio.dialogue.regret.01"}
          - {content_key: "en.b1.unit17.lesson04.teach.a_what_happened", kind: "dialogue", target: {text: "What happened?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["What", "happened"]}
          - {content_key: "en.b1.unit17.lesson04.teach.q_should_have_talked_missed", kind: "dialogue", target: {text: "I should have talked to my manager earlier about the workload. By the time I did, I had already missed one deadline.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.b1.unit17.lesson04.teach.a_fair_regret_fixed", kind: "dialogue", target: {text: "That's a fair regret, but you fixed it in the end.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["fair", "but", "you", "fixed", "it", "in", "the", "end"]}
          - {content_key: "en.b1.unit17.lesson04.teach.q_true_if_had_asked", kind: "dialogue", target: {text: "True. If I had asked Mia for help in week one, I would have finished both projects on time.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["True"]}
          - {content_key: "en.b1.unit17.lesson04.teach.a_now_you_know", kind: "dialogue", target: {text: "Well, now you know for next time.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Well", "now", "know", "next"]}
        exercises:
          - {content_key: "en.b1.unit17.lesson04.exercise01.listen_wish_asked_sooner", type: "dialogue_comprehension", tested_text: "I wish I had asked for help sooner", media_asset_key: "en.b1.audio.dialogue.regret.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit17.lesson04.exercise02.listen_missed_deadline", type: "listen_select", tested_text: "I had already missed one deadline", media_asset_key: "en.b1.audio.dialogue.regret.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit17.lesson04.exercise03.choose_would_have_finished", type: "multiple_choice", tested_text: "I would have finished both projects on time.", prompt: {target_blocks: [{text: "What does Daniel say would have happened if he had asked Mia for help in week one?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit17.lesson04.exercise04.order_now_you_know", type: "word_order", tested_text: "Well now you know for next time", prompt: {target_blocks: []}, word_bank: ["now", "you", "know", "for", "next", "time", "Well"]}
          - content_key: "en.b1.unit17.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "If I had asked Mia for help in week one, I would have finished both projects on time."
            prompt: {target_blocks: [{text: "That's a fair regret, but you fixed it in the end.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit17.lesson04.exercise06.speak_regret_dialogue"
            type: "speak_response"
            tested_text: "I should have talked to my manager earlier about the workload."
            prompt: {target_blocks: [{text: "What happened?", language_code: "en", direction: "ltr"}]}
