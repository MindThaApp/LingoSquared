course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Appointment-making uses a simple, polite phone/spoken register: I'd like to make an appointment for ___., Are you available on ___?, What time works for you?, That time works for me., Can we reschedule for ___?, Your appointment is confirmed. Core vocabulary (appointment/available/book/confirm/reschedule) is deliberately service-neutral -- it applies to any kind of appointment (vet, dentist, salon, office) without teaching one profession's specialized vocabulary, since booking the appointment (not attending it) is this unit's scope."

media_assets:
  - {content_key: "en.a1.audio.appointments.words.01", language: "en", text: "appointment, available, book, confirm, reschedule", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.appointments.phrases.01", language: "en", text: "I'd like to make an appointment. Are you available on Friday? What time works for you? That time works for me. Can we reschedule for Monday? Your appointment is confirmed.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.appointments.01"
    language: "en"
    text: "Mia: Leila, is Max okay? He seems a little tired lately. Leila: He's fine, don't worry. He's just due for his yearly checkup. I should call the vet. Leila: Hi, I'd like to make an appointment for my dog's checkup. Mia: What did they say? Leila: They're available on Thursday at 3pm. Mia: Does that time work for you? Leila: Yes, that works for me. Thursday at 3pm -- thank you! Max's appointment is confirmed."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

