schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "B1"
generation_provenance:
  method: "authored_from_scratch_established_conventions"
  authoring_system: "codex"
  human_reviewed: false
  source_note: >-
    Continued from the interrupted untracked unit07 draft in this working
    tree after structural assessment; the draft was coherent and was kept
    with provenance polish rather than rewritten. Authored from scratch from
    universal_spine.yaml's universal.b1.conditions.express_real_conditions
    outcome and the shared English B1 realization conventions established in
    units 01-06. Not adapted from external course material.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    2026-07-12 fresh-context review (Codex). Verified: real future
    conditions use present-tense if/unless clauses with will-result clauses
    correctly; if not/unless meaning is accurate; meeting-plan facts are
    internally consistent; Mia, Daniel, and Leila continuity stays within the
    workplace/update pattern established in B1 units 05-06. Realization-only
    structural audit passed: YAML parses cleanly, spine reference resolves,
    content_keys are unique, text-block directions are correct, no stray YAML
    booleans or learner-facing snake_case leaks, vocabulary examples present,
    media references declared, all word_order items are buildable in sentence
    order, matching_pairs has 6 pairs, and dialogue teaching cards use
    structured target.speaker with no Name:-in-text. Fixed lesson01
    exercise01's listen_select audio from a whole vocabulary-list clip to
    single-target-word audio so future distractors are not spoken in the same
    clip. LIMITATION: no X-to-en overlays exist for this unit yet, so
    accepted_answers, contraction/punctuation variants, and overlay-authored
    listen distractors could not be machine-checked.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: real and likely conditions using if + present/simple present and will/imperative result clauses, including if not/unless, in everyday planning and appointment contexts."

media_assets:
  - {content_key: "en.b1.audio.conditions.word.unless.01", language: "en", text: "unless", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.conditions.sentence.01", language: "en", text: "If the meeting starts late, I will send everyone a message.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.conditions.01"
    language: "en"
    text: "Mia: Daniel, what should we do if the meeting starts late? Daniel: If it starts late, I will send everyone a message. Mia: And if Leila cannot join? Daniel: Unless she joins by ten, we will move her update to tomorrow. Mia: That sounds fair. If the room is still busy, should we meet online? Daniel: Yes, if the room is busy, we will meet online instead."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit07.conditions"
    title: "If this happens, we will do that"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.conditions.express_real_conditions"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit07.lesson01.condition_vocabulary"
        title: "If, unless, condition, and result"
        spine_outcome_id: "universal.b1.conditions.express_real_conditions"
        teaching:
          - {content_key: "en.b1.unit07.lesson01.teach.if", kind: "vocabulary", target: {text: "if", language_code: "en", direction: "ltr"}, introduced_tokens: ["if"], example: {text: "If the bus is late, I will call you.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit07.lesson01.teach.unless", kind: "vocabulary", target: {text: "unless", language_code: "en", direction: "ltr"}, introduced_tokens: ["unless", "meet"], example: {text: "Unless the plan changes, we will meet at ten.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit07.lesson01.teach.condition", kind: "vocabulary", target: {text: "condition", language_code: "en", direction: "ltr"}, introduced_tokens: ["condition"], example: {text: "The condition is clear: we start if everyone arrives.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit07.lesson01.teach.result", kind: "vocabulary", target: {text: "result", language_code: "en", direction: "ltr"}, introduced_tokens: ["result"], example: {text: "The result is that we meet online.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit07.lesson01.teach.delay", kind: "vocabulary", target: {text: "delay", language_code: "en", direction: "ltr"}, introduced_tokens: ["delay"], example: {text: "A delay can make everyone late.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit07.lesson01.teach.reschedule", kind: "vocabulary", target: {text: "reschedule", language_code: "en", direction: "ltr"}, introduced_tokens: ["reschedule"], example: {text: "If the doctor is busy, we will reschedule the appointment.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit07.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "unless", media_asset_key: "en.b1.audio.conditions.word.unless.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit07.lesson01.exercise02.choose_condition_word", type: "multiple_choice", tested_text: "condition", prompt: {target_blocks: [{text: "Which word means the situation that must happen first?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson01.exercise03.choose_reschedule_word", type: "multiple_choice", tested_text: "reschedule", prompt: {target_blocks: [{text: "Which word means to choose a new time for a meeting or appointment?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson01.exercise04.match_condition_words", type: "matching_pairs", tested_text: "if unless condition result delay reschedule", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "if", right: "condition"}, {left: "unless", right: "means if not, except if"}, {left: "condition", right: "the situation that must happen first"}, {left: "result", right: "what happens because of a condition"}, {left: "delay", right: "behind schedule"}, {left: "reschedule", right: "appointment + delay"}]}
          - {content_key: "en.b1.unit07.lesson01.exercise05.write_unless", type: "writing_prompt", tested_text: "unless", prompt: {target_blocks: [{text: "Write the word that means \"if not\" or \"except if\".", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit07.lesson02.real_conditions"
        title: "If it starts late, I will send a message"
        spine_outcome_id: "universal.b1.conditions.express_real_conditions"
        teaching:
          - {content_key: "en.b1.unit07.lesson02.teach.if_meeting_late", kind: "phrase", target: {text: "If the meeting starts late, I will send everyone a message.", language_code: "en", direction: "ltr"}, introduced_tokens: ["If", "the", "meeting", "starts", "late", "I", "will", "send", "everyone", "a", "message"], media_asset_key: "en.b1.audio.conditions.sentence.01"}
          - {content_key: "en.b1.unit07.lesson02.teach.if_not_ready", kind: "phrase", target: {text: "If the report is not ready, we will reschedule the review.", language_code: "en", direction: "ltr"}, introduced_tokens: ["report", "is", "not", "ready", "we", "review"]}
          - {content_key: "en.b1.unit07.lesson02.teach.grammar_real_condition", kind: "grammar_note", target: {text: "Use present tense after if for a real future condition: If it starts late, I will send a message.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Use", "present", "tense", "after", "for", "real", "future"]}
        exercises:
          - {content_key: "en.b1.unit07.lesson02.exercise01.choose_meeting_condition", type: "multiple_choice", tested_text: "If the meeting starts late, I will send everyone a message.", prompt: {target_blocks: [{text: "Which sentence gives a real condition and its result?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson02.exercise02.choose_if_not_ready", type: "multiple_choice", tested_text: "If the report is not ready, we will reschedule the review.", prompt: {target_blocks: [{text: "Which sentence uses a negated condition?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson02.exercise03.order_if_meeting_starts_late", type: "word_order", tested_text: "If the meeting starts late I will send everyone a message", prompt: {target_blocks: []}, word_bank: ["the", "meeting", "starts", "late", "I", "will", "send", "everyone", "a", "message", "If"]}
          - {content_key: "en.b1.unit07.lesson02.exercise04.reply_late_meeting", type: "dialogue_response", tested_text: "If the meeting starts late I will send everyone a message", prompt: {target_blocks: [{text: "What will you do if the meeting starts late?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson02.exercise05.write_if_not_ready", type: "writing_prompt", tested_text: "If the report is not ready, we will reschedule the review.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit07.lesson03.reading_a_meeting_plan"
        title: "Reading: the backup plan"
        spine_outcome_id: "universal.b1.conditions.express_real_conditions"
        teaching:
          - {content_key: "en.b1.unit07.lesson03.teach.backup_plan", kind: "vocabulary", target: {text: "backup plan", language_code: "en", direction: "ltr"}, introduced_tokens: ["backup", "plan", "need"], example: {text: "We need a backup plan if the room is busy.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit07.lesson03.teach.move_update", kind: "vocabulary", target: {text: "move the update", language_code: "en", direction: "ltr"}, introduced_tokens: ["move", "update", "her", "to"], example: {text: "If Leila is late, we will move the update to tomorrow.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit07.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Daniel writes a backup plan for the team meeting. If the conference room is free, the team will meet there at ten. If the room is busy, they will meet online. Unless Leila joins by ten, Daniel will move her update to tomorrow. If the report is not ready, Mia will send a shorter update instead.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Daniel", "writes", "team", "conference", "room", "free", "there", "at", "ten", "busy", "they", "online", "Leila", "joins", "by", "tomorrow", "Mia", "shorter", "instead"]
        exercises:
          - {content_key: "en.b1.unit07.lesson03.exercise01.comprehend_if_room_free", type: "reading_comprehension", tested_text: "the team will meet there at ten", prompt: {target_blocks: [{text: "What will the team do if the conference room is free?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson03.exercise02.comprehend_unless_leila_joins", type: "reading_comprehension", tested_text: "Daniel will move her update to tomorrow", prompt: {target_blocks: [{text: "What will happen unless Leila joins by ten?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson03.exercise03.recognize_backup_plan", type: "multiple_choice", tested_text: "backup plan", prompt: {target_blocks: [{text: "Which phrase means an extra plan you can use if the first plan fails?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson03.exercise04.order_unless_leila_joins", type: "word_order", tested_text: "Unless Leila joins by ten Daniel will move her update", prompt: {target_blocks: []}, word_bank: ["Leila", "joins", "by", "ten", "Daniel", "will", "move", "her", "update", "Unless"]}
          - {content_key: "en.b1.unit07.lesson03.exercise05.write_backup_plan", type: "writing_prompt", tested_text: "We need a backup plan if the room is busy.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit07.lesson04.the_meeting_plan_dialogue"
        title: "If the room is busy, we will meet online"
        spine_outcome_id: "universal.b1.conditions.express_real_conditions"
        teaching:
          - {content_key: "en.b1.unit07.lesson04.teach.q_if_meeting_late", kind: "dialogue", target: {text: "Daniel, what should we do if the meeting starts late?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Daniel", "what", "should", "we", "do", "if", "meeting", "starts", "late"], media_asset_key: "en.b1.audio.dialogue.conditions.01"}
          - {content_key: "en.b1.unit07.lesson04.teach.a_send_message", kind: "dialogue", target: {text: "If it starts late, I will send everyone a message.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["If", "it", "will", "send", "everyone", "message"]}
          - {content_key: "en.b1.unit07.lesson04.teach.q_if_leila_cannot_join", kind: "dialogue", target: {text: "And if Leila cannot join?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["And", "Leila", "cannot", "join"]}
          - {content_key: "en.b1.unit07.lesson04.teach.a_unless_she_joins", kind: "dialogue", target: {text: "Unless she joins by ten, we will move her update to tomorrow.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Unless", "she", "joins", "by", "ten", "move", "her", "update", "tomorrow"]}
          - {content_key: "en.b1.unit07.lesson04.teach.q_room_busy", kind: "dialogue", target: {text: "That sounds fair. If the room is still busy, should we meet online?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["That", "sounds", "fair", "room", "still", "busy", "meet", "online"]}
          - {content_key: "en.b1.unit07.lesson04.teach.a_meet_online", kind: "dialogue", target: {text: "Yes, if the room is busy, we will meet online instead.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "room", "busy", "instead"]}
        exercises:
          - {content_key: "en.b1.unit07.lesson04.exercise01.listen_if_meeting_late", type: "dialogue_comprehension", tested_text: "I will send everyone a message", media_asset_key: "en.b1.audio.dialogue.conditions.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit07.lesson04.exercise02.listen_if_room_busy", type: "listen_select", tested_text: "we will meet online instead", media_asset_key: "en.b1.audio.dialogue.conditions.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit07.lesson04.exercise03.choose_unless_result", type: "multiple_choice", tested_text: "we will move her update to tomorrow", prompt: {target_blocks: [{text: "What will happen unless Leila joins by ten?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit07.lesson04.exercise04.order_if_room_busy", type: "word_order", tested_text: "If the room is busy we will meet online instead", prompt: {target_blocks: []}, word_bank: ["the", "room", "is", "busy", "we", "will", "meet", "online", "instead", "If"]}
          - content_key: "en.b1.unit07.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "If it starts late I will send everyone a message"
            prompt: {target_blocks: [{text: "Daniel, what should we do if the meeting starts late?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit07.lesson04.exercise06.speak_conditions_dialogue"
            type: "speak_response"
            tested_text: "Unless she joins by ten we will move her update to tomorrow"
            prompt: {target_blocks: [{text: "And if Leila cannot join?", language_code: "en", direction: "ltr"}]}
