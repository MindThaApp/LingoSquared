    language: "en"
    text: "Mia: I think we should keep the hybrid schedule for the next quarter. Daniel: What is your strongest reason? Mia: The strongest reason is retention. In the staff survey, people who worked hybrid were less likely to say they were looking for another job. Daniel: Some managers say collaboration is weaker when people are not in the office every day. Mia: That is a fair concern. However, the project data does not support it. The hybrid teams delivered their work on time, and their review scores were slightly higher. Daniel: So your position is that the benefits outweigh the risks? Mia: Exactly. We should improve meeting routines, not abandon the schedule."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

