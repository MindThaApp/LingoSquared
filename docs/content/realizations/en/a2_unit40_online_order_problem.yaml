schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    No public-domain source material was consulted: AUTHORING_GUIDE §10's
    verified PD map covers the LEARNER-side languages, and the FSI-era
    corpora it lists predate online ordering entirely, so there is no
    adaptable source. Authored from established ESL A2 conventions
    against universal.a2.shopping.make_a_complaint, whose can_do covers
    explaining what is wrong with a purchase and requesting a refund or
    replacement, and whose write_complaint_message requirement is a
    WRITTEN channel a2_unit34 (an in-store return) only lightly serves.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Sixth of 6 new A2 units (unit35-unit40) authored 2026-07-22 to close
    the publish-gate teaching-hours gap on the shared English
    realization. Spine outcome REUSED from a2_unit34_shopping_complaint
    (see a2_unit35_prescription's review note for why reuse rather than
    new spine outcomes). Scenario is deliberately NON-overlapping with
    unit34: unit34 is an in-store return of a blender with a receipt,
    resolved with a refund; this unit is an online order that arrived
    damaged, resolved with a replacement, and adds the order number, the
    parcel, and the return-by-post instructions. Character canon checked
    before writing (AUTHORING_PREFLIGHT §6): Leila made the unit34
    in-store return, so she is the established complaint character at
    this level and no new biographical fact is pinned to her. Mia was
    deliberately NOT used here even though the scenario would suit her:
    b1_unit15_complaints already pins a very similar online complaint to
    Mia (a desk chair, resolved with a replacement), and reusing her here
    would create a near-duplicate storyline across two course levels. The
    Agent is an unnamed role speaker, consistent with the corpus's Clerk
    / Manager / Teller convention. Every exercise's tested_text is
    covered by this file's own or the A2 chain's earlier
    introduced_tokens. PENDING a fresh-context review per AUTHORING_GUIDE
    §9.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked against the nl-en overlay: answer keys,
    listen_select/dialogue_response distractors absent from audio, speaker
    attribution vs audio, character canon (Daniel weekdays, unit29 repair
    6180/kitchen sink/2pm-4pm, Mia at Bright Path Marketing, Leila units
    33-34), course-wide vocabulary coverage of matching_pairs tested_text,
    YAML boolean quoting, no internal jargon. Fixes:
    en.a2.unit40.lesson01.exercise02.choose_damaged_word prompt "a box
    that was hurt on the way" -> "a box that got a little broken on the
    way" (hurt is for people/animals);
    en.a2.unit40.lesson01.exercise04.match_online_order_words
    pairs[3].right "hurt on the way, but perhaps still usable" -> "a
    little broken on the way, but perhaps still usable" (overlays carry
    their own source-language rights; left word unchanged, no mirror
    change). No native flags.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at the polite customer-service register a2_unit34 established (I'd like to..., Could I have...?), plus instead of for choosing between two offered resolutions."

media_assets:
  - {content_key: "en.a2.audio.online_order.words.delivery.01", language: "en", text: "delivery", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.online_order.question.01", language: "en", text: "The lamp arrived broken.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.online_order.description.01", language: "en", text: "Thank you for your message. We are sorry that your lamp arrived broken. Please put the lamp back in the box and bring it to the post office. A new lamp will be sent within three working days. Order number 8154.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.online_order.01"
    language: "en"
    text: "Leila: Hello, I'd like to report a problem with my order. Agent: I'm sorry to hear that. What is the problem? Leila: The lamp arrived broken. The box was damaged. Agent: I see. Could you tell me your order number? Leila: My order number is 8154. Agent: Thank you. Would you like a refund or a replacement? Leila: Could I have a replacement instead of a refund? Agent: Of course. A new lamp will be sent within three working days. Leila: Thank you very much."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit40.online_order_problem"
    title: "A problem with an online order"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.shopping.make_a_complaint"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit40.lesson01.online_order_vocabulary"
        title: "Orders, deliveries, and damaged parcels"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit40.lesson01.teach.order", kind: "vocabulary", target: {text: "order", language_code: "en", direction: "ltr"}, introduced_tokens: ["order"], example: {text: "My order arrived two days late.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit40.lesson01.teach.delivery", kind: "vocabulary", target: {text: "delivery", language_code: "en", direction: "ltr"}, introduced_tokens: ["delivery"], example: {text: "The delivery came on Tuesday morning.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit40.lesson01.teach.parcel", kind: "vocabulary", target: {text: "parcel", language_code: "en", direction: "ltr"}, introduced_tokens: ["parcel"], example: {text: "The parcel was left outside my door.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit40.lesson01.teach.damaged", kind: "vocabulary", target: {text: "damaged", language_code: "en", direction: "ltr"}, introduced_tokens: ["damaged"], example: {text: "The box was damaged when it arrived.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit40.lesson01.teach.broken", kind: "vocabulary", target: {text: "broken", language_code: "en", direction: "ltr"}, introduced_tokens: ["broken"], example: {text: "The lamp inside the parcel was broken.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit40.lesson01.teach.replacement", kind: "vocabulary", target: {text: "replacement", language_code: "en", direction: "ltr"}, introduced_tokens: ["replacement"], example: {text: "I asked for a replacement instead of a refund.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit40.lesson01.teach.grammar_arrived", kind: "grammar_note", target: {text: "My order arrived yesterday. My order has not arrived yet.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "order", "arrived", "yesterday", "has", "not", "yet"]}
        exercises:
          - {content_key: "en.a2.unit40.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "delivery", media_asset_key: "en.a2.audio.online_order.words.delivery.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit40.lesson01.exercise02.choose_damaged_word", type: "multiple_choice", tested_text: "damaged", prompt: {target_blocks: [{text: "Which word describes a box that got a little broken on the way but is still usable?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson01.exercise03.choose_replacement_word", type: "multiple_choice", tested_text: "replacement", prompt: {target_blocks: [{text: "Which word means a new item sent to you in place of a broken one?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit40.lesson01.exercise04.match_online_order_words"
            type: "matching_pairs"
            tested_text: "order delivery parcel damaged broken replacement refund exchange"
            prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}
            pairs:
              - {left: "order", right: "the things you asked a shop to send you"}
              - {left: "delivery", right: "the moment your things are brought to your home"}
              - {left: "parcel", right: "the wrapped box that is brought to your door"}
              - {left: "damaged", right: "a little broken on the way, but perhaps still usable"}
              - {left: "broken", right: "in pieces, and no longer working"}
              - {left: "replacement", right: "a new item sent in place of a bad one"}
              - {left: "refund", right: "your money given back to you"}
              - {left: "exchange", right: "the same item swapped for a different size or color"}
          - {content_key: "en.a2.unit40.lesson01.exercise05.write_replacement", type: "writing_prompt", tested_text: "replacement", prompt: {target_blocks: [{text: "Write the word for a new item sent in place of a bad one.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit40.lesson02.explaining_the_problem"
        title: "Explaining the problem and asking for a replacement"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit40.lesson02.teach.report_order_problem", kind: "phrase", target: {text: "I'd like to report a problem with my order.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'd", "like", "to", "report", "a", "problem", "with", "my", "order"]}
          - {content_key: "en.a2.unit40.lesson02.teach.lamp_arrived_broken", kind: "phrase", target: {text: "The lamp arrived broken.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "lamp", "arrived", "broken"]}
          - {content_key: "en.a2.unit40.lesson02.teach.ask_for_replacement", kind: "phrase", target: {text: "Could I have a replacement instead of a refund?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Could", "I", "have", "replacement", "instead", "of", "refund"]}
          - {content_key: "en.a2.unit40.lesson02.teach.my_order_number", kind: "phrase", target: {text: "My order number is 8154.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "order", "number", "is", "8154"]}
          - {content_key: "en.a2.unit40.lesson02.teach.grammar_instead_of", kind: "grammar_note", target: {text: "Could I have a replacement instead of a refund? I would like a refund instead of an exchange.", language_code: "en", direction: "ltr"}, introduced_tokens: ["would", "an", "exchange"]}
        exercises:
          - {content_key: "en.a2.unit40.lesson02.exercise01.listen_the_problem", type: "listen_select", tested_text: "The lamp arrived broken", media_asset_key: "en.a2.audio.online_order.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit40.lesson02.exercise02.choose_opening_line", type: "multiple_choice", tested_text: "I'd like to report a problem with my order.", prompt: {target_blocks: [{text: "You are calling an online shop about a bad delivery. What do you say first?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson02.exercise03.choose_ask_replacement", type: "multiple_choice", tested_text: "Could I have a replacement instead of a refund?", prompt: {target_blocks: [{text: "You want a new lamp, not your money back. How do you ask, politely?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson02.exercise04.order_lamp_arrived_broken", type: "word_order", tested_text: "The lamp arrived broken", prompt: {target_blocks: []}, word_bank: ["lamp", "arrived", "broken", "The"]}
          - {content_key: "en.a2.unit40.lesson02.exercise05.order_ask_replacement", type: "word_order", tested_text: "Could I have a replacement instead of a refund", prompt: {target_blocks: []}, word_bank: ["I", "have", "a", "replacement", "instead", "of", "a", "refund", "Could"]}
          - {content_key: "en.a2.unit40.lesson02.exercise06.reply_ask_replacement", type: "dialogue_response", tested_text: "Could I have a replacement instead of a refund", prompt: {target_blocks: [{text: "Would you like a refund or a replacement?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson02.exercise07.write_order_problem", type: "writing_prompt", tested_text: "I'd like to report a problem with my order.", prompt: {target_blocks: []}}

      - content_key: "en.a2.unit40.lesson03.reading_a_return_message"
        title: "Reading the shop's answer"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit40.lesson03.teach.box", kind: "vocabulary", target: {text: "box", language_code: "en", direction: "ltr"}, introduced_tokens: ["box"], example: {text: "Please keep the box until the new lamp arrives.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit40.lesson03.teach.return_message", kind: "reading", target: {text: "Thank you for your message. We are sorry that your lamp arrived broken. Please put the lamp back in the box and bring it to the post office. A new lamp will be sent within three working days. Order number 8154.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Thank", "you", "for", "your", "message", "We", "are", "sorry", "that", "lamp", "arrived", "broken", "Please", "put", "the", "back", "in", "box", "and", "bring", "it", "to", "post", "office", "A", "new", "will", "be", "sent", "within", "three", "working", "days", "Order", "number", "8154"]}
          - {content_key: "en.a2.unit40.lesson03.teach.put_it_back_in_the_box", kind: "phrase", target: {text: "Please put the lamp back in the box and bring it to the post office.", language_code: "en", direction: "ltr"}, introduced_tokens: ["put", "back", "box", "bring", "post", "office"]}
        exercises:
          - {content_key: "en.a2.unit40.lesson03.exercise01.read_what_to_do", type: "reading_comprehension", tested_text: "put the lamp back in the box", prompt: {target_blocks: [{text: "What does the shop ask Leila to do with the broken lamp?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson03.exercise02.read_where_to_bring_it", type: "reading_comprehension", tested_text: "to the post office", prompt: {target_blocks: [{text: "Where should Leila bring the parcel?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson03.exercise03.read_when_new_lamp", type: "reading_comprehension", tested_text: "within three working days", prompt: {target_blocks: [{text: "When will the new lamp be sent?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson03.exercise04.choose_order_number", type: "multiple_choice", tested_text: "8154", prompt: {target_blocks: [{text: "What is the order number in the message?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson03.exercise05.order_new_lamp_sentence", type: "word_order", tested_text: "A new lamp will be sent within three working days", prompt: {target_blocks: []}, word_bank: ["new", "lamp", "will", "be", "sent", "within", "three", "working", "days", "A"]}
          - {content_key: "en.a2.unit40.lesson03.exercise06.write_put_it_back", type: "writing_prompt", tested_text: "Please put the lamp back in the box and bring it to the post office.", prompt: {target_blocks: [{text: "Write the shop's instruction, beginning with Please put.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit40.lesson04.online_order_dialogue"
        title: "Calling about the broken lamp"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit40.lesson04.teach.q_report_a_problem", kind: "dialogue", target: {text: "Hello, I'd like to report a problem with my order.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hello"]}
          - {content_key: "en.a2.unit40.lesson04.teach.a_what_is_the_problem", kind: "dialogue", target: {text: "I'm sorry to hear that. What is the problem?", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["I'm", "sorry", "hear", "that", "What"]}
          - {content_key: "en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged", kind: "dialogue", target: {text: "The lamp arrived broken. The box was damaged.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["was", "damaged"]}
          - {content_key: "en.a2.unit40.lesson04.teach.a_ask_order_number", kind: "dialogue", target: {text: "I see. Could you tell me your order number?", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["see", "you", "tell", "me", "your"]}
          - {content_key: "en.a2.unit40.lesson04.teach.q_order_number_8154", kind: "dialogue", target: {text: "My order number is 8154.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit40.lesson04.teach.a_refund_or_replacement", kind: "dialogue", target: {text: "Thank you. Would you like a refund or a replacement?", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["or"]}
          - {content_key: "en.a2.unit40.lesson04.teach.q_replacement_please", kind: "dialogue", target: {text: "Could I have a replacement instead of a refund?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit40.lesson04.teach.a_new_lamp_three_days", kind: "dialogue", target: {text: "Of course. A new lamp will be sent within three working days.", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["Of", "course"]}
          - {content_key: "en.a2.unit40.lesson04.teach.q_thank_you", kind: "dialogue", target: {text: "Thank you very much.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["very", "much"]}
        exercises:
          - {content_key: "en.a2.unit40.lesson04.exercise01.listen_the_problem", type: "dialogue_comprehension", tested_text: "The lamp arrived broken", media_asset_key: "en.a2.audio.dialogue.online_order.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit40.lesson04.exercise02.listen_resolution", type: "listen_select", tested_text: "within three working days", media_asset_key: "en.a2.audio.dialogue.online_order.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit40.lesson04.exercise03.choose_what_leila_asks_for", type: "multiple_choice", tested_text: "a replacement instead of a refund", prompt: {target_blocks: [{text: "What does Leila ask for?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit40.lesson04.exercise04.order_order_number", type: "word_order", tested_text: "My order number is 8154", prompt: {target_blocks: []}, word_bank: ["order", "number", "is", "8154", "My"]}
          - {content_key: "en.a2.unit40.lesson04.exercise05.reply_order_number", type: "dialogue_response", tested_text: "My order number is 8154", prompt: {target_blocks: [{text: "Could you tell me your order number?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit40.lesson04.exercise06.speak_online_order_dialogue"
            type: "speak_response"
            tested_text: "I'd like to report a problem with my order. The lamp arrived broken. Could I have a replacement instead of a refund?"
            prompt: {target_blocks: [{text: "You are Leila, calling the online shop.", language_code: "en", direction: "ltr"}]}
