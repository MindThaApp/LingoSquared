  - content_key: "en.b2.audio.dialogue.abstraction.01"
    language: "en"
    text: "Amara: I think a city should protect quiet public spaces, even if that limits some commercial activity. Leo: I value quiet too, but businesses need flexibility to survive. Amara: That is fair, and I am not arguing for silence everywhere. My point is that shared spaces should not be shaped only by profit. Leo: So the value you are prioritizing is fairness, not just comfort? Amara: Exactly. In principle, convenience matters, but fairness should carry more weight when a space belongs to everyone. Leo: I can accept that if the rules are limited and transparent."
    voice_hint: "two_adults_neutral_reflective"
    status: "pending_generation"

