  status: "unreviewed"
  required_next_reviewer: "codex_fresh_context"
  notes: >-
    Draft depth unit for shared English A1. Topic: simple apologies and
    excuses for everyday lateness or mistakes. Authored from English
    conventions and the recent four-lesson realization pattern; no
    self-review performed.

course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English for brief apologies and simple excuses: saying sorry, explaining lateness, accepting an apology, and naming a small mistake."

media_assets:
  - {content_key: "en.a1.audio.apologies_excuses.words.01", language: "en", text: "sorry, late, excuse, traffic, mistake, problem", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.apologies_excuses.phrases.01", language: "en", text: "I'm sorry. I'm late. The bus is late. That's okay. No problem. I made a mistake.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.apologies_excuses.01"
    language: "en"
    text: "Daniel: Hi Mia. I'm sorry I'm late. Mia: That's okay. Daniel: The bus is late. Mia: No problem. We can wait. Daniel: I made a mistake with the time. Mia: It's okay. The class starts at three. Daniel: Thank you for waiting."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit61.apologies_excuses"
    title: "Apologies and excuses"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.emotions.express_basic_feelings"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit61.lesson01.apology_words"
        title: "Words for apologies"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit61.lesson01.teach.sorry", kind: "vocabulary", target: {text: "sorry", language_code: "en", direction: "ltr"}, introduced_tokens: ["sorry", "I'm"], example: {text: "I'm sorry.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit61.lesson01.teach.late", kind: "vocabulary", target: {text: "late", language_code: "en", direction: "ltr"}, introduced_tokens: ["late", "I", "am"], example: {text: "I am late.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit61.lesson01.teach.excuse", kind: "vocabulary", target: {text: "excuse", language_code: "en", direction: "ltr"}, introduced_tokens: ["excuse", "This", "is", "my"], example: {text: "This is my excuse.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit61.lesson01.teach.traffic", kind: "vocabulary", target: {text: "traffic", language_code: "en", direction: "ltr"}, introduced_tokens: ["traffic", "The", "bad"], example: {text: "The traffic is bad.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit61.lesson01.teach.mistake", kind: "vocabulary", target: {text: "mistake", language_code: "en", direction: "ltr"}, introduced_tokens: ["mistake", "made", "a"], example: {text: "I made a mistake.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit61.lesson01.teach.problem", kind: "vocabulary", target: {text: "problem", language_code: "en", direction: "ltr"}, introduced_tokens: ["problem", "No"], example: {text: "No problem.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit61.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "sorry", media_asset_key: "en.a1.audio.apologies_excuses.words.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit61.lesson01.exercise02.choose_late_meaning", type: "multiple_choice", tested_text: "late", prompt: {target_blocks: [{text: "Which word means not on time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson01.exercise03.match_apology_words", type: "matching_pairs", tested_text: "sorry late excuse traffic mistake problem", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "what you say after doing something wrong", right: "sorry"}, {left: "not on time", right: "late"}, {left: "a reason for a problem", right: "excuse"}, {left: "many cars on the road", right: "traffic"}, {left: "something done wrong", right: "mistake"}, {left: "something that is wrong or difficult", right: "problem"}]}
          - {content_key: "en.a1.unit61.lesson01.exercise04.order_sorry_sentence", type: "word_order", tested_text: "I'm sorry.", word_bank: ["I'm", "sorry."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson01.exercise05.write_mistake", type: "writing_prompt", tested_text: "mistake", prompt: {target_blocks: [{text: "Write the word for something done wrong.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit61.lesson02.apology_phrases"
        title: "Phrases for apologies"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit61.lesson02.teach.im_sorry", kind: "phrase", target: {text: "I'm sorry.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "sorry"]}
          - {content_key: "en.a1.unit61.lesson02.teach.im_late", kind: "phrase", target: {text: "I'm late.", language_code: "en", direction: "ltr"}, introduced_tokens: ["late"]}
          - {content_key: "en.a1.unit61.lesson02.teach.bus_is_late", kind: "phrase", target: {text: "The bus is late.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "bus", "is"]}
          - {content_key: "en.a1.unit61.lesson02.teach.thats_okay", kind: "phrase", target: {text: "That's okay.", language_code: "en", direction: "ltr"}, introduced_tokens: ["That's", "okay"]}
          - {content_key: "en.a1.unit61.lesson02.teach.no_problem", kind: "phrase", target: {text: "No problem.", language_code: "en", direction: "ltr"}, introduced_tokens: ["No", "problem"]}
          - {content_key: "en.a1.unit61.lesson02.teach.made_mistake", kind: "phrase", target: {text: "I made a mistake.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "made", "a", "mistake"]}
        exercises:
          - {content_key: "en.a1.unit61.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "The bus is late.", media_asset_key: "en.a1.audio.apologies_excuses.phrases.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit61.lesson02.exercise02_choose_apology", type: "multiple_choice", tested_text: "I'm sorry.", prompt: {target_blocks: [{text: "Which phrase is a simple apology?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson02.exercise03_choose_acceptance", type: "multiple_choice", tested_text: "That's okay.", prompt: {target_blocks: [{text: "Which phrase accepts an apology?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson02.exercise04.order_bus_sentence", type: "word_order", tested_text: "The bus is late.", word_bank: ["The", "bus", "is", "late."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson02.exercise05.translate_no_problem", type: "translation", tested_text: "No problem.", prompt: {target_blocks: [{text: "Translate: \"No problem.\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit61.lesson03.dialogue_saying_sorry"
        title: "Dialogue: Saying sorry"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit61.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hi Mia. I'm sorry I'm late.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Hi", "Mia"], media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01"}
          - {content_key: "en.a1.unit61.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "That's okay.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01"}
          - {content_key: "en.a1.unit61.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "The bus is late.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01"}
          - {content_key: "en.a1.unit61.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "No problem. We can wait.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["We", "can", "wait"], media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01"}
          - {content_key: "en.a1.unit61.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "I made a mistake with the time.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["with", "the", "time"], media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01"}
          - {content_key: "en.a1.unit61.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "It's okay. The class starts at three.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["It's", "class", "starts", "at", "three"], media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01"}
          - {content_key: "en.a1.unit61.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Thank you for waiting.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thank", "you", "for", "waiting"], media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01"}
        exercises:
          - {content_key: "en.a1.unit61.lesson03.exercise01.comprehension_reason", type: "multiple_choice", tested_text: "The bus is late.", prompt: {target_blocks: [{text: "According to the dialogue, why is Daniel late?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson03.exercise02.comprehension_class_time", type: "multiple_choice", tested_text: "three", prompt: {target_blocks: [{text: "According to the dialogue, what time does the class start?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson03.exercise03.listen_dialogue_apology", type: "listen_select", tested_text: "I'm sorry I'm late.", media_asset_key: "en.a1.audio.dialogue.apologies_excuses.01", prompt: {target_blocks: [{text: "Which apology does Daniel say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson03.exercise04.respond_own_apology", type: "speak_response", tested_text: "I'm sorry I'm late.", accepted_answers: ["I'm sorry I'm late", "I'm sorry I'm late.", "The bus is late", "The bus is late.", "That's okay", "That's okay.", "No problem", "No problem."], prompt: {target_blocks: [{text: "Say an apology, give an excuse, or accept an apology.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit61.lesson04.late_for_class"
        title: "Reading: Late for class"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit61.lesson04.teach.class_note", kind: "reading", target: {text: "Class note: The class starts at 3:00. Please come on time. If you are late, send a message.", language_code: "en", direction: "ltr"}, introduced_tokens: ["note", "3:00", "come", "If", "are", "send", "message"]}
          - {content_key: "en.a1.unit61.lesson04.teach.reading_passage", kind: "reading", target: {text: "An Apology Before Class: Daniel was late for class because the bus was late. He met Mia outside the classroom. Daniel said he was sorry. He also said he made a mistake with the time. Mia said it was okay because the class started at 3:00. Daniel sent a short message to the teacher. The message said, I'm sorry I'm late. The bus is late.", language_code: "en", direction: "ltr"}, introduced_tokens: ["An", "Apology", "Before", "Class", "Daniel", "was", "because", "He", "met", "outside", "classroom", "said", "he", "also", "it", "started", "sent", "short", "teacher"]}
        exercises:
          - {content_key: "en.a1.unit61.lesson04.exercise01.note_class_time", type: "multiple_choice", tested_text: "3:00", prompt: {target_blocks: [{text: "According to the note, what time does the class start?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson04.exercise02.note_late_action", type: "multiple_choice", tested_text: "send a message", prompt: {target_blocks: [{text: "According to the note, what should you do if you are late?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson04.exercise03.reading_reason", type: "multiple_choice", tested_text: "the bus was late", prompt: {target_blocks: [{text: "According to the reading, why was Daniel late?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson04.exercise04.reading_who_waited", type: "multiple_choice", tested_text: "Mia", prompt: {target_blocks: [{text: "According to the reading, who met Daniel outside the classroom?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit61.lesson04.exercise05.write_own_apology_message", type: "writing_prompt", tested_text: "I'm sorry I'm late. The bus is late.", prompt: {target_blocks: [{text: "Write a short message: apologize for being late, and give the reason.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I'm sorry I'm late. The bus is late.", "I'm sorry I'm late, and the bus is late.", "I'm sorry I'm late and the bus is late."]}
