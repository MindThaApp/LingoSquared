course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Cooking language stays in simple present tense with fixed verb+object collocations that must be memorized: make dinner, follow a recipe, chop the onions, boil the pasta, add some salt. Keep the register casual and cooperative, appropriate for one friend teaching another a basic home recipe, not professional culinary-school register."

