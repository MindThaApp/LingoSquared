schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "adapted_from_public_domain_source"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    The formal account-opening interview pattern (asking what documents
    are needed, confirming identity and address, describing basic
    account features) is scaffolded from the FSI banking-and-finance
    module (Foreign Service Institute, US Department of State -- public
    domain, no attribution required per docs/content/AUTHORING_GUIDE.md
    §10). The source frames this around a 1960s-70s teller-window
    interaction with dated vocabulary; the specific institution,
    features, and vocabulary here (debit card, online banking, monthly
    fee, direct deposit) reflect current 2020s US retail banking and
    are freshly authored, not translated or lightly edited from the
    source.
status: "complete_draft"
review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Third A2 unit for the shared English realization (spine outcome:
    universal.a2.banking.open_bank_account), continuing the Leila/
    Daniel storyline -- Daniel opens a checking account now that he has
    a permanent address (unit24) and has registered it with the DMV
    (unit25). Reuses unit25's document vocabulary (photo ID, proof of
    residency) rather than re-teaching it, and reuses unit15's money
    vocabulary (dollars, cents) for the monthly-fee discussion. A2-level
    complexity continues: polite formal register, subordinate clauses
    (if you keep a minimum balance), and indirect questions (I was
    wondering what documents I would need). The specific account
    feature facts (no monthly fee if balance stays above $500, debit
    card arrives in 5-7 business days) are stated consistently between
    lesson03's reading text and lesson04's dialogue per AUTHORING_GUIDE
    §11. Every multi-clause accepted_answers list authored with period/
    comma/conjunction-joined forms per §12. Checked every fill_in_blank-
    adjacent construction for AUTHORING_GUIDE §17 (this unit has no
    fill_in_blank exercises at all, and every word_order word_bank uses
    entirely distinct vocabulary -- no true-synonym or register-variant
    pairs that could occupy the same slot ambiguously).

    2026-07-07 §19 retrofit (part of the German content lane's
    project-wide vocabulary-example rollout): added `example:` to all
    6 kind:vocabulary cards (checking_account, debit_card, monthly_fee,
    minimum_balance, direct_deposit, business_days), each a natural
    declarative sentence previewing facts this unit's own later lessons
    state explicitly (the $500 minimum balance, the 5-7 business day
    card arrival) rather than inventing unrelated ones, consistent with
    §11's cross-lesson fact-consistency rule. This file is shared by
    fa-en/nl-en/prs-en; nl-en's overlay was given matching example_gloss
    this pass (fa-en/prs-en still need a follow-up). schema_version
    bumped to 1.1.

    Fresh-context review correction, same day: business_days' example
    originally said "The card will arrive in five business days,"
    contradicting this same file's own "five to seven business days"
    stated in 4 other places (the media asset, lesson03's features_text
    reading passage, lesson04's dialogue, and multiple exercise
    answers) -- exactly the §11 cross-lesson-consistency bug the
    original retrofit note above claimed was avoided. Fixed to "five
    to seven business days," matching everywhere else; nl-en's
    example_gloss updated to match.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at a formal register appropriate for a bank appointment, continuing unit25's polite indirect-question conventions (I was wondering..., Could you tell me...)."

media_assets:
  - {content_key: "en.a2.audio.banking.words.minimum_balance.01", language: "en", text: "minimum balance", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.banking.question.01", language: "en", text: "I was wondering what documents I would need to open an account.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.banking.description.01", language: "en", text: "There is no monthly fee if you keep a minimum balance of 500 dollars. Your debit card will arrive in five to seven business days.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.opening_an_account.01"
    language: "en"
    text: "Daniel: I was wondering what documents I would need to open a checking account. Teller: You'll need a photo ID and one proof of residency, just like at the DMV. Daniel: I have both with me. Is there a monthly fee? Teller: There's no monthly fee if you keep a minimum balance of 500 dollars. Daniel: That sounds good. When will I get my debit card? Teller: It will arrive in five to seven business days."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit27.banking"
    title: "Opening a bank account"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.banking.open_bank_account"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit27.lesson01.banking_vocabulary"
        title: "Accounts and cards"
        spine_outcome_id: "universal.a2.banking.open_bank_account"
        teaching:
          - {content_key: "en.a2.unit27.lesson01.teach.checking_account", kind: "vocabulary", target: {text: "checking account", language_code: "en", direction: "ltr"}, introduced_tokens: ["checking", "account"], example: {text: "I'd like to open a checking account.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit27.lesson01.teach.debit_card", kind: "vocabulary", target: {text: "debit card", language_code: "en", direction: "ltr"}, introduced_tokens: ["debit", "card"], example: {text: "I use my debit card to pay for groceries.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit27.lesson01.teach.monthly_fee", kind: "vocabulary", target: {text: "monthly fee", language_code: "en", direction: "ltr"}, introduced_tokens: ["monthly", "fee"], example: {text: "There is no monthly fee on this account.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit27.lesson01.teach.minimum_balance", kind: "vocabulary", target: {text: "minimum balance", language_code: "en", direction: "ltr"}, introduced_tokens: ["minimum", "balance"], example: {text: "You must keep a minimum balance of 500 dollars.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit27.lesson01.teach.direct_deposit", kind: "vocabulary", target: {text: "direct deposit", language_code: "en", direction: "ltr"}, introduced_tokens: ["direct", "deposit"], example: {text: "My paycheck comes by direct deposit.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a2.unit27.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "minimum balance", media_asset_key: "en.a2.audio.banking.words.minimum_balance.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit27.lesson01.exercise02.choose_bank_card_word", type: "multiple_choice", tested_text: "debit card", prompt: {target_blocks: [{text: "Which phrase means the card you use to spend money directly from your account?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson01.exercise03.choose_monthly_charge_word", type: "multiple_choice", tested_text: "monthly fee", prompt: {target_blocks: [{text: "Which phrase means a charge the bank takes every month?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson01.exercise04.match_banking_words", type: "matching_pairs", tested_text: "checking account debit card monthly fee minimum balance direct deposit", prompt: {target_blocks: [{text: "Match each English banking word or phrase to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "checking account", right: "a bank service for bills and daily spending"}, {left: "debit card", right: "the card you use to spend money directly from your account"}, {left: "monthly fee", right: "a charge the bank takes every month"}, {left: "minimum balance", right: "the smallest amount of money you must keep in your account to avoid a fee"}, {left: "direct deposit", right: "a paycheck sent straight into your bank account"}, {left: "photo ID", right: "identification with your photo on it"}, {left: "proof of residency", right: "a document that shows where you live"}]}
          - {content_key: "en.a2.unit27.lesson01.exercise05.write_direct_deposit", type: "writing_prompt", tested_text: "direct deposit", prompt: {target_blocks: [{text: "Write the phrase for a paycheck sent straight into your bank account.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit27.lesson02.asking_about_opening_an_account"
        title: "Asking about opening an account"
        spine_outcome_id: "universal.a2.banking.open_bank_account"
        teaching:
          - {content_key: "en.a2.unit27.lesson02.teach.i_was_wondering_what_documents", kind: "phrase", target: {text: "I was wondering what documents I would need to open an account.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "was", "wondering", "what", "documents", "would", "need", "to", "open", "an"]}
          - {content_key: "en.a2.unit27.lesson02.teach.same_as_dmv", kind: "phrase", target: {text: "You'll need a photo ID and one proof of residency, just like at the DMV.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You'll", "a", "photo", "ID", "and", "one", "proof", "of", "residency", "just", "like", "at", "the", "DMV"]}
        exercises:
          - {content_key: "en.a2.unit27.lesson02.exercise01.listen_question", type: "listen_select", tested_text: "I was wondering what documents I would need", media_asset_key: "en.a2.audio.banking.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit27.lesson02.exercise02.choose_polite_documents_question", type: "multiple_choice", tested_text: "I was wondering what documents I would need to open an account.", prompt: {target_blocks: [{text: "You are asking a bank employee, formally, what you need to open an account. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson02.exercise03.order_same_as_dmv", type: "word_order", tested_text: "You'll need a photo ID and one proof of residency", prompt: {target_blocks: []}, word_bank: ["need", "a", "photo", "ID", "and", "one", "proof", "of", "residency", "You'll"]}
          - {content_key: "en.a2.unit27.lesson02.exercise04.reply_what_documents", type: "dialogue_response", tested_text: "I was wondering what documents I would need to open an account", prompt: {target_blocks: [{text: "How do you politely ask a bank employee what documents you need?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson02.exercise05.write_documents_needed", type: "writing_prompt", tested_text: "You'll need a photo ID and one proof of residency.", prompt: {target_blocks: [{text: "Write that you'll need a photo ID and one proof of residency.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit27.lesson03.reading_about_account_features"
        title: "Reading about account features"
        spine_outcome_id: "universal.a2.banking.open_bank_account"
        teaching:
          - {content_key: "en.a2.unit27.lesson03.teach.business_days", kind: "vocabulary", target: {text: "business days", language_code: "en", direction: "ltr"}, introduced_tokens: ["business", "days"], example: {text: "The card will arrive in five to seven business days.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit27.lesson03.teach.features_text", kind: "reading", target: {text: "There is no monthly fee if you keep a minimum balance of 500 dollars. Your debit card will arrive in five to seven business days.", language_code: "en", direction: "ltr"}, introduced_tokens: ["There", "is", "no", "if", "you", "keep", "a", "of", "500", "dollars", "Your", "will", "arrive", "in", "five", "to", "seven", "with"]}
        exercises:
          - {content_key: "en.a2.unit27.lesson03.exercise01.read_fee_condition", type: "reading_comprehension", tested_text: "keep a minimum balance of 500 dollars", prompt: {target_blocks: [{text: "What must you do to avoid the monthly fee?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson03.exercise02.read_card_arrival", type: "reading_comprehension", tested_text: "five to seven business days", prompt: {target_blocks: [{text: "How long until the debit card arrives?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson03.exercise03.choose_true_statement", type: "multiple_choice", tested_text: "There is no monthly fee with a $500 minimum balance.", prompt: {target_blocks: [{text: "Which statement is true according to the text?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson03.exercise04.order_card_arrival", type: "word_order", tested_text: "Your debit card will arrive in five to seven business days", prompt: {target_blocks: []}, word_bank: ["debit", "card", "will", "arrive", "in", "five", "to", "seven", "business", "days", "Your"]}
          - {content_key: "en.a2.unit27.lesson03.exercise05.write_own_fee_statement", type: "writing_prompt", tested_text: "There is no monthly fee if you keep a minimum balance of 500 dollars.", prompt: {target_blocks: [{text: "Write that there is no monthly fee if you keep a minimum balance of 500 dollars.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit27.lesson04.opening_an_account_dialogue"
        title: "At the bank"
        spine_outcome_id: "universal.a2.banking.open_bank_account"
        teaching:
          - {content_key: "en.a2.unit27.lesson04.teach.that_sounds_good", kind: "phrase", target: {text: "That sounds good.", language_code: "en", direction: "ltr"}, introduced_tokens: ["That", "sounds", "good"]}
          - {content_key: "en.a2.unit27.lesson04.teach.q_what_documents", kind: "dialogue", target: {text: "I was wondering what documents I would need to open a checking account.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit27.lesson04.teach.a_id_and_proof", kind: "dialogue", target: {text: "You'll need a photo ID and one proof of residency, just like at the DMV.", language_code: "en", direction: "ltr", speaker: "Teller"}, introduced_tokens: ["Teller"]}
          - {content_key: "en.a2.unit27.lesson04.teach.q_is_there_fee", kind: "dialogue", target: {text: "I have both with me. Is there a monthly fee?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I", "have", "both", "with", "me", "Is", "there"]}
          - {content_key: "en.a2.unit27.lesson04.teach.a_no_fee_condition", kind: "dialogue", target: {text: "There's no monthly fee if you keep a minimum balance of 500 dollars.", language_code: "en", direction: "ltr", speaker: "Teller"}, introduced_tokens: ["There's"]}
          - {content_key: "en.a2.unit27.lesson04.teach.q_when_card", kind: "dialogue", target: {text: "That sounds good. When will I get my debit card?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["When", "will", "get", "my"]}
          - {content_key: "en.a2.unit27.lesson04.teach.a_five_to_seven_days", kind: "dialogue", target: {text: "It will arrive in five to seven business days.", language_code: "en", direction: "ltr", speaker: "Teller"}, introduced_tokens: ["It"]}
        exercises:
          - {content_key: "en.a2.unit27.lesson04.exercise01.listen_documents_needed", type: "dialogue_comprehension", tested_text: "a photo ID and one proof of residency", media_asset_key: "en.a2.audio.dialogue.opening_an_account.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit27.lesson04.exercise02.listen_fee_condition", type: "listen_select", tested_text: "no monthly fee with a minimum balance of 500 dollars", media_asset_key: "en.a2.audio.dialogue.opening_an_account.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit27.lesson04.exercise03.choose_card_arrival_time", type: "multiple_choice", tested_text: "five to seven business days", prompt: {target_blocks: [{text: "When will Daniel's debit card arrive?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit27.lesson04.exercise04.order_is_there_fee", type: "word_order", tested_text: "Is there a monthly fee", prompt: {target_blocks: []}, word_bank: ["there", "a", "monthly", "fee", "Is"]}
          - content_key: "en.a2.unit27.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I have both with me Is there a monthly fee That sounds good When will I get my debit card"
            prompt: {target_blocks: [{text: "You'll need a photo ID and one proof of residency, just like at the DMV. There's no monthly fee if you keep a minimum balance of 500 dollars.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit27.lesson04.exercise06.speak_banking_dialogue"
            type: "speak_response"
            tested_text: "I have both with me Is there a monthly fee That sounds good When will I get my debit card"
            prompt: {target_blocks: [{text: "You'll need a photo ID and one proof of residency, just like at the DMV. There's no monthly fee if you keep a minimum balance of 500 dollars.", language_code: "en", direction: "ltr"}]}
