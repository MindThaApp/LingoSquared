units:
  - content_key: "en.a1.unit60.invitations"
    title: "Invitations"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.plans.make_simple_plans"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit60.lesson01.invitation_words"
        title: "Words for invitations"
        spine_outcome_id: "universal.a1.plans.make_simple_plans"
        teaching:
          - {content_key: "en.a1.unit60.lesson01.teach.invitation", kind: "vocabulary", target: {text: "invitation", language_code: "en", direction: "ltr"}, introduced_tokens: ["invitation", "Thank", "you", "for", "the"], example: {text: "Thank you for the invitation.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit60.lesson01.teach.party", kind: "vocabulary", target: {text: "party", language_code: "en", direction: "ltr"}, introduced_tokens: ["party", "The", "is", "on", "Saturday"], example: {text: "The party is on Saturday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit60.lesson01.teach.dinner", kind: "vocabulary", target: {text: "dinner", language_code: "en", direction: "ltr"}, introduced_tokens: ["dinner", "Come", "to"], example: {text: "Come to dinner.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit60.lesson01.teach.picnic", kind: "vocabulary", target: {text: "picnic", language_code: "en", direction: "ltr"}, introduced_tokens: ["picnic", "We", "can", "have", "a"], example: {text: "We can have a picnic.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit60.lesson01.teach.bring", kind: "vocabulary", target: {text: "bring", language_code: "en", direction: "ltr"}, introduced_tokens: ["bring", "Please", "drink"], example: {text: "Please bring a drink.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit60.lesson01.teach.free", kind: "vocabulary", target: {text: "free", language_code: "en", direction: "ltr"}, introduced_tokens: ["free", "Are", "you"], example: {text: "Are you free?", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit60.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "invitation", media_asset_key: "en.a1.audio.invitations.words.invitation.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit60.lesson01.exercise02.choose_free_meaning", type: "multiple_choice", tested_text: "free", prompt: {target_blocks: [{text: "Which word means available and not busy?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson01.exercise03.match_invitation_words", type: "matching_pairs", tested_text: "invitation party dinner picnic bring free", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a message asking someone to come", right: "invitation"}, {left: "a friendly event with people", right: "party"}, {left: "the evening meal", right: "dinner"}, {left: "a meal outside", right: "picnic"}, {left: "take something with you", right: "bring"}, {left: "available and not busy", right: "free"}]}
          - {content_key: "en.a1.unit60.lesson01.exercise04.order_party_sentence", type: "word_order", tested_text: "The party is on Saturday.", word_bank: ["The", "party", "is", "on", "Saturday."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson01.exercise05.write_picnic", type: "writing_prompt", tested_text: "picnic", prompt: {target_blocks: [{text: "Write the word for a meal outside.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit60.lesson02.invitation_phrases"
        title: "Phrases for invitations"
        spine_outcome_id: "universal.a1.plans.make_simple_plans"
        teaching:
          - {content_key: "en.a1.unit60.lesson02.teach.are_you_free", kind: "phrase", target: {text: "Are you free on Saturday?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Are", "you", "free", "on", "Saturday"]}
          - {content_key: "en.a1.unit60.lesson02.teach.would_you_like_dinner", kind: "phrase", target: {text: "Would you like to come to dinner?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Would", "like", "to", "come", "dinner"]}
          - {content_key: "en.a1.unit60.lesson02.teach.bring_a_drink", kind: "phrase", target: {text: "Please bring a drink.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Please", "bring", "a", "drink"]}
          - {content_key: "en.a1.unit60.lesson02.teach.i_can_come", kind: "phrase", target: {text: "I can come.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "can", "come"]}
          - {content_key: "en.a1.unit60.lesson02.teach.cant_come", kind: "phrase", target: {text: "Sorry, I can't come.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Sorry", "can't"]}
          - {content_key: "en.a1.unit60.lesson02.teach.see_you_at_six", kind: "phrase", target: {text: "See you at six.", language_code: "en", direction: "ltr"}, introduced_tokens: ["See", "at", "six"]}
        exercises:
          - {content_key: "en.a1.unit60.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "Would you like to come to dinner?", media_asset_key: "en.a1.audio.invitations.phrases.would_you_like_to_come_to_dinner.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit60.lesson02.exercise02.choose_invitation_question", type: "multiple_choice", tested_text: "Would you like to come to dinner?", prompt: {target_blocks: [{text: "Which phrase invites someone to dinner?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson02.exercise03.choose_acceptance", type: "multiple_choice", tested_text: "I can come.", prompt: {target_blocks: [{text: "Which phrase accepts an invitation?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson02.exercise04.order_bring_sentence", type: "word_order", tested_text: "Please bring a drink.", word_bank: ["Please", "bring", "a", "drink."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson02.exercise05.translate_see_you", type: "translation", tested_text: "See you at six.", prompt: {target_blocks: [{text: "Translate: \"See you at six.\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit60.lesson03.dialogue_inviting_a_friend"
        title: "Dialogue: Inviting a friend"
        spine_outcome_id: "universal.a1.plans.make_simple_plans"
        teaching:
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hi Daniel! Are you free on Saturday?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hi", "Daniel"], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Yes, I am free.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "am"], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "Would you like to come to dinner?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Yes, I'd love to.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I'd", "love"], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Please bring a drink.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Sure. What time?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Sure", "What", "time"], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "See you at six.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
          - {content_key: "en.a1.unit60.lesson03.teach.dialogue_line8", kind: "dialogue", target: {text: "Great. Thank you for the invitation.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Great"], media_asset_key: "en.a1.audio.dialogue.invitations.01"}
        exercises:
          - {content_key: "en.a1.unit60.lesson03.exercise01.comprehension_day", type: "multiple_choice", tested_text: "Saturday", prompt: {target_blocks: [{text: "According to the dialogue, what day does Leila name?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson03.exercise02.comprehension_time", type: "multiple_choice", tested_text: "six", prompt: {target_blocks: [{text: "According to the dialogue, what time does Leila say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson03.exercise03.listen_dialogue_invitation", type: "listen_select", tested_text: "Would you like to come to dinner?", media_asset_key: "en.a1.audio.dialogue.invitations.01", prompt: {target_blocks: [{text: "Which invitation does Leila say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson03.exercise04.respond_own_invitation", type: "speak_response", tested_text: "Would you like to come to dinner?", accepted_answers: ["Would you like to come to dinner", "Would you like to come to dinner?", "I can come", "I can come.", "Please bring a drink", "Please bring a drink.", "See you at six", "See you at six."], prompt: {target_blocks: [{text: "Invite someone, accept, or say what to bring.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit60.lesson04.dinner_invitation"
        title: "Reading: A dinner invitation"
        spine_outcome_id: "universal.a1.plans.make_simple_plans"
        teaching:
          - {content_key: "en.a1.unit60.lesson04.teach.invitation_message", kind: "reading", target: {text: "Dinner invitation: Saturday at 6:00. Please bring a drink. Address: 18 Park Street.", language_code: "en", direction: "ltr"}, introduced_tokens: ["6:00", "Address", "18", "Park", "Street"]}
          - {content_key: "en.a1.unit60.lesson04.teach.reading_passage", kind: "reading", target: {text: "Dinner at Leila's Home: Leila invited Daniel to dinner on Saturday. She asked him to bring a drink. Daniel said he could come. The invitation said dinner was at 6:00 at 18 Park Street. Daniel wrote the address in his phone. He wanted to arrive on time. Leila was happy because her friend could come.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Home", "Leila", "invited", "She", "asked", "him", "Daniel", "said", "he", "could", "invitation", "was", "wrote", "address", "in", "his", "phone", "He", "wanted", "arrive", "happy", "because", "her", "friend"]}
        exercises:
          - {content_key: "en.a1.unit60.lesson04.exercise01.message_day", type: "multiple_choice", tested_text: "Saturday", prompt: {target_blocks: [{text: "According to the invitation, what day is dinner?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson04.exercise02.message_time", type: "multiple_choice", tested_text: "6:00", prompt: {target_blocks: [{text: "According to the invitation, what time is dinner?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson04.exercise03.message_address", type: "multiple_choice", tested_text: "18 Park Street", prompt: {target_blocks: [{text: "According to the invitation, what is the address?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson04.exercise04.reading_what_to_bring", type: "multiple_choice", tested_text: "a drink", prompt: {target_blocks: [{text: "According to the reading, what should Daniel bring?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit60.lesson04.exercise05.write_own_invitation_message", type: "writing_prompt", tested_text: "Dinner is at 6:00. Please bring a drink.", prompt: {target_blocks: [{text: "Write a short message: say the dinner time, and say what to bring.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["Dinner is at 6:00. Please bring a drink.", "Dinner is at 6:00, and please bring a drink.", "Dinner is at 6:00 and please bring a drink."]}
