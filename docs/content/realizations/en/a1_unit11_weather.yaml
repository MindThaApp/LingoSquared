course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Weather descriptions use everyday spoken forms (It's sunny / It's raining), not meteorological register."

media_assets:
  - {content_key: "en.a1.audio.weather.conditions.cloudy.01", language: "en", text: "cloudy", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.weather.question.01", language: "en", text: "What's the weather like today?", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.weather.forecast.01", language: "en", text: "Tomorrow will be sunny and warm. It will rain on Saturday.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.weather_plan.01"
    language: "en"
    text: "Leila: What's the weather like today? Daniel: It's sunny and warm. Leila: Great, let's go to the park. Daniel: Good idea. But it's going to rain tomorrow, so let's go today."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit11.weather"
    title: "Talking about the weather"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.weather.describe_basic_weather"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit11.lesson01.weather_words"
        title: "Common weather words"
        spine_outcome_id: "universal.a1.weather.describe_basic_weather"
        teaching:
          - {content_key: "en.a1.unit11.lesson01.teach.sunny", kind: "vocabulary", target: {text: "sunny", language_code: "en", direction: "ltr"}, introduced_tokens: ["sunny"], example: {text: "It's sunny today.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit11.lesson01.teach.rainy", kind: "vocabulary", target: {text: "rainy", language_code: "en", direction: "ltr"}, introduced_tokens: ["rainy"], example: {text: "I don't like rainy days.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit11.lesson01.teach.cloudy", kind: "vocabulary", target: {text: "cloudy", language_code: "en", direction: "ltr"}, introduced_tokens: ["cloudy"], example: {text: "The sky is cloudy.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit11.lesson01.teach.cold", kind: "vocabulary", target: {text: "cold", language_code: "en", direction: "ltr"}, introduced_tokens: ["cold"], example: {text: "It's very cold outside.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit11.lesson01.teach.hot", kind: "vocabulary", target: {text: "hot", language_code: "en", direction: "ltr"}, introduced_tokens: ["hot"], example: {text: "It's hot in summer.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit11.lesson01.teach.windy", kind: "vocabulary", target: {text: "windy", language_code: "en", direction: "ltr"}, introduced_tokens: ["windy"], example: {text: "It's windy today.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit11.lesson01.exercise01.listen_condition", type: "listen_select", tested_text: "cloudy", media_asset_key: "en.a1.audio.weather.conditions.cloudy.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit11.lesson01.exercise02.choose_hot"
            type: "multiple_choice"
            tested_text: "hot"
            prompt: {target_blocks: [{text: "The opposite of cold is...", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit11.lesson01.exercise03.choose_rainy"
            type: "multiple_choice"
            tested_text: "rainy"
            prompt: {target_blocks: [{text: "Which word describes weather with a lot of rain?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit11.lesson01.exercise04.match_weather_words", type: "matching_pairs", tested_text: "sunny rainy cold windy", prompt: {target_blocks: []}, pairs: [{left: "sunny", right: "clear sky, lots of sun"}, {left: "rainy", right: "a lot of rain"}, {left: "cold", right: "low temperature"}, {left: "windy", right: "strong moving air"}, {left: "cloudy", right: "full of clouds, little or no sun"}, {left: "hot", right: "high temperature"}]}
          - {content_key: "en.a1.unit11.lesson01.exercise05.write_cloudy", type: "writing_prompt", tested_text: "cloudy", prompt: {target_blocks: [{text: "Write the word for a sky full of clouds.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit11.lesson02.describing_todays_weather"
        title: "Describing today's weather"
        spine_outcome_id: "universal.a1.weather.describe_basic_weather"
        teaching:
          - {content_key: "en.a1.unit11.lesson02.teach.whats_weather_like", kind: "phrase", target: {text: "What's the weather like today?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What's", "the", "weather", "like", "today"]}
          - {content_key: "en.a1.unit11.lesson02.teach.its_sunny", kind: "phrase", target: {text: "It's sunny and warm.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "sunny", "and", "warm"]}
          - {content_key: "en.a1.unit11.lesson02.teach.its_raining", kind: "phrase", target: {text: "It's raining.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "raining"]}
          - {content_key: "en.a1.unit11.lesson02.teach.take_umbrella", kind: "phrase", target: {text: "You should take an umbrella.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "should", "take", "an", "umbrella"]}
        exercises:
          - {content_key: "en.a1.unit11.lesson02.exercise01.listen_weather_question", type: "listen_select", tested_text: "What's the weather like today", media_asset_key: "en.a1.audio.weather.question.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit11.lesson02.exercise02.choose_weather_answer"
            type: "multiple_choice"
            tested_text: "It's sunny and warm."
            prompt: {target_blocks: [{text: "What's the weather like today?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit11.lesson02.exercise03.order_its_raining", type: "word_order", tested_text: "It's raining", prompt: {target_blocks: []}, word_bank: ["It's", "raining"]}
          - content_key: "en.a1.unit11.lesson02.exercise04.reply_umbrella"
            type: "dialogue_response"
            tested_text: "It's raining You should take an umbrella"
            prompt: {target_blocks: [{text: "It's raining. What should I take?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit11.lesson02.exercise05.write_weather", type: "writing_prompt", tested_text: "It's sunny and warm", prompt: {target_blocks: [{text: "Write that today is sunny and warm.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit11.lesson03.reading_a_forecast"
        title: "Reading a weather forecast"
        spine_outcome_id: "universal.a1.weather.describe_basic_weather"
        teaching:
          - {content_key: "en.a1.unit11.lesson03.teach.tomorrow", kind: "vocabulary", target: {text: "tomorrow", language_code: "en", direction: "ltr"}, introduced_tokens: ["tomorrow"], example: {text: "I will see you tomorrow.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit11.lesson03.teach.forecast_text", kind: "reading", target: {text: "Tomorrow will be sunny and warm. It will rain on Saturday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Tomorrow", "will", "be", "sunny", "and", "warm", "It", "rain", "on", "Saturday"]}
        exercises:
          - content_key: "en.a1.unit11.lesson03.exercise01.read_tomorrow_weather"
            type: "reading_comprehension"
            tested_text: "sunny and warm"
            prompt: {target_blocks: [{text: "What will the weather be like tomorrow?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit11.lesson03.exercise02.read_rain_day"
            type: "reading_comprehension"
            tested_text: "Saturday"
            prompt: {target_blocks: [{text: "Which day will it rain?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit11.lesson03.exercise03.choose_umbrella_day"
            type: "multiple_choice"
            tested_text: "Saturday"
            prompt: {target_blocks: [{text: "On which day should you take an umbrella, based on the forecast?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit11.lesson03.exercise04.order_forecast_sentence", type: "word_order", tested_text: "It will rain on Saturday", prompt: {target_blocks: []}, word_bank: ["will", "rain", "on", "Saturday", "It"]}
          - {content_key: "en.a1.unit11.lesson03.exercise05.write_forecast", type: "writing_prompt", tested_text: "Tomorrow will be sunny and warm", prompt: {target_blocks: [{text: "Write that tomorrow will be sunny and warm.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit11.lesson04.weather_plan_dialogue"
        title: "Making a plan based on the weather"
        spine_outcome_id: "universal.a1.weather.describe_basic_weather"
        teaching:
          - {content_key: "en.a1.unit11.lesson04.teach.lets_go", kind: "phrase", target: {text: "Let's go to the park.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Let's", "go", "to", "the", "park"]}
          - {content_key: "en.a1.unit11.lesson04.teach.q_weather", kind: "dialogue", target: {text: "What's the weather like today?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit11.lesson04.teach.a_sunny_warm", kind: "dialogue", target: {text: "It's sunny and warm.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a1.unit11.lesson04.teach.suggest_park", kind: "dialogue", target: {text: "Great, let's go to the park.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Great"]}
          - {content_key: "en.a1.unit11.lesson04.teach.agree_rain_tomorrow", kind: "dialogue", target: {text: "Good idea. But it's going to rain tomorrow, so let's go today.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Good", "idea", "But", "it's", "going", "to", "rain", "tomorrow", "so", "let's", "go", "today"]}
        exercises:
          - {content_key: "en.a1.unit11.lesson04.exercise01.listen_todays_weather", type: "dialogue_comprehension", tested_text: "It's sunny and warm", media_asset_key: "en.a1.audio.dialogue.weather_plan.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit11.lesson04.exercise02.listen_tomorrow_weather", type: "listen_select", tested_text: "it's going to rain tomorrow", media_asset_key: "en.a1.audio.dialogue.weather_plan.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit11.lesson04.exercise03.choose_reason_go_today"
            type: "multiple_choice"
            tested_text: "it's going to rain tomorrow"
            prompt: {target_blocks: [{text: "Why do they decide to go to the park today instead of tomorrow?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit11.lesson04.exercise04.order_suggest_park", type: "word_order", tested_text: "let's go to the park", prompt: {target_blocks: []}, word_bank: ["go", "to", "the", "park", "let's"]}
          - content_key: "en.a1.unit11.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "It's sunny and warm Good idea But it's going to rain tomorrow so let's go today"
            prompt: {target_blocks: [{text: "What's the weather like today? ... Great, let's go to the park.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit11.lesson04.exercise06.speak_weather_plan"
            type: "speak_response"
            tested_text: "It's sunny and warm Good idea But it's going to rain tomorrow so let's go today"
            prompt: {target_blocks: [{text: "What's the weather like today? ... Great, let's go to the park.", language_code: "en", direction: "ltr"}]}
