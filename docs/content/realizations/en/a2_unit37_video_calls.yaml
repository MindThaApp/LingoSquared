schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    No public-domain source material was consulted: AUTHORING_GUIDE §10's
    verified PD map covers the LEARNER-side languages, and the FSI-era
    corpora it lists predate video calling entirely, so there is no
    adaptable source for this topic. Authored from established ESL A2
    conventions against
    universal.a2.technology.discuss_online_habits, whose can_do covers
    describing how you use the internet in daily life plus a simple
    opinion about it. Facts reuse a2_unit33 (Leila's online classes) and
    a1_unit23 (Daniel's meetings at a small company) per §11 rather than
    inventing new routines.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Third of 6 new A2 units (unit35-unit40) authored 2026-07-22 to close
    the publish-gate teaching-hours gap on the shared English
    realization. Spine outcome REUSED from a2_unit32_online_habits (see
    a2_unit35_prescription's review note for why reuse rather than new
    spine outcomes). Deliberately NON-overlapping with unit32: unit32
    teaches social media, screen time, notifications, messaging and
    sharing photos; this unit teaches synchronous video calling (camera,
    microphone, mute, connection, headphones, face to face) and the
    prefer-X-to-Y comparison. Character canon checked before writing
    (AUTHORING_PREFLIGHT §6): Leila has online classes on Mondays and
    Wednesdays (a2_unit33) -- reused as the reason she is on video calls;
    Daniel is an engineer at a small company downtown who goes to
    meetings after checking his email (a1_unit23, a2_unit33) -- reused as
    his reason. No new biographical fact is pinned to either. Every
    exercise's tested_text is covered by this file's own or the A2
    chain's earlier introduced_tokens. PENDING a fresh-context review per
    AUTHORING_GUIDE §9.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked against the nl-en overlay: answer keys,
    listen_select/dialogue_response distractors absent from audio, speaker
    attribution vs audio, character canon (Daniel weekdays, unit29 repair
    6180/kitchen sink/2pm-4pm, Mia at Bright Path Marketing, Leila units
    33-34), course-wide vocabulary coverage of matching_pairs tested_text,
    YAML boolean quoting, no internal jargon. Fix:
    en.a2.unit37.lesson02.exercise07.write_opinion_with_reason prompt
    target_block "Write your opinion about video calls, using I think and
    but I prefer." -> "Write the opinion sentence from this lesson about
    video calls, using I think and but I prefer." (the exercise grades one
    exact sentence; the prompt now pins it for all four directions).
    NATIVE FLAGS: lesson02.teach.you_were_on_mute / exercise03 -- for
    someone talking right now while muted, "Sorry, you're on mute." is the
    usual phrase; lesson01.exercise04 camera gloss "the part that shows
    your picture" (sends/takes may be more accurate); nl-en overlay "face
    to face" glossed as "in levenden lijve" still awaits Ramin's native
    pass.
    Shared-en fix 2026-10-20: the first-person key quotes the message but the question asked about the character in the third person. The question now asks which words from the text give the answer (realization prompt and nl/fa/prs instructions); keys unchanged. A third-person key was not used because she/her/he/his are not introduced anywhere in the A2 course (the token check fails). Persian/Dari distractors moved to first person to match the quoted options.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English in the informal peer register a2_unit26/a2_unit32 use between Leila, Daniel and Mia -- opinions with I think / I prefer, and simple comparison with more/less ... than."

media_assets:
  - {content_key: "en.a2.audio.video_calls.words.microphone.01", language: "en", text: "microphone", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.video_calls.question.01", language: "en", text: "Can you turn on your camera?", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.video_calls.description.01", language: "en", text: "My online classes are all video calls now. I turn on my camera, but I mute my microphone until the teacher asks a question. I use headphones because my connection is better with them. I think video calls save a lot of time, but I still prefer meeting my classmates face to face.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.video_calls.01"
    language: "en"
    text: "Leila: Do you have a lot of video calls at work? Daniel: Yes, I have a video call with my team every Monday. Leila: Do you turn on your camera? Daniel: Always, but I mute my microphone when I am not speaking. Leila: My online classes are all video calls now. Daniel: What do you think about them? Leila: I think video calls are useful, but I prefer meeting people face to face. Daniel: I agree. A video call is faster than a visit, but it is less personal. Leila: Exactly."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit37.video_calls"
    title: "Talking about video calls"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.technology.discuss_online_habits"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit37.lesson01.video_call_vocabulary"
        title: "Cameras, microphones, and connections"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit37.lesson01.teach.video_call", kind: "vocabulary", target: {text: "video call", language_code: "en", direction: "ltr"}, introduced_tokens: ["video", "call"], example: {text: "I have a video call with my team every Monday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit37.lesson01.teach.camera", kind: "vocabulary", target: {text: "camera", language_code: "en", direction: "ltr"}, introduced_tokens: ["camera"], example: {text: "Please turn on your camera before the meeting starts.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit37.lesson01.teach.microphone", kind: "vocabulary", target: {text: "microphone", language_code: "en", direction: "ltr"}, introduced_tokens: ["microphone"], example: {text: "My microphone was off, so the others didn't hear me.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit37.lesson01.teach.connection", kind: "vocabulary", target: {text: "connection", language_code: "en", direction: "ltr"}, introduced_tokens: ["connection"], example: {text: "The connection was bad, so the video stopped.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit37.lesson01.teach.mute", kind: "vocabulary", target: {text: "mute", language_code: "en", direction: "ltr"}, introduced_tokens: ["mute"], example: {text: "I mute my microphone when I am not speaking.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit37.lesson01.teach.face_to_face", kind: "vocabulary", target: {text: "face to face", language_code: "en", direction: "ltr"}, introduced_tokens: ["face"], example: {text: "Some meetings are better face to face than online.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit37.lesson01.teach.grammar_comparison", kind: "grammar_note", target: {text: "A video call is faster than a visit. A video call is less personal than a meeting face to face.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "video", "call", "is", "faster", "than", "a", "visit", "less", "personal", "meeting", "face", "to"]}
        exercises:
          - {content_key: "en.a2.unit37.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "microphone", media_asset_key: "en.a2.audio.video_calls.words.microphone.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit37.lesson01.exercise02.choose_mute_word", type: "multiple_choice", tested_text: "mute", prompt: {target_blocks: [{text: "Which word means to turn your sound off so the others can't hear you?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson01.exercise03.choose_connection_word", type: "multiple_choice", tested_text: "connection", prompt: {target_blocks: [{text: "Which word means the link between your computer and the internet?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit37.lesson01.exercise04.match_video_call_words"
            type: "matching_pairs"
            tested_text: "video call camera microphone connection mute face to face online meeting"
            prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}
            pairs:
              - {left: "video call", right: "a call where you can see the other people"}
              - {left: "camera", right: "the part that shows your picture"}
              - {left: "microphone", right: "the part that carries your voice"}
              - {left: "connection", right: "the link between your computer and the internet"}
              - {left: "mute", right: "to turn your sound off"}
              - {left: "face to face", right: "in the same room, not on a screen"}
              - {left: "online", right: "happening on the internet"}
              - {left: "meeting", right: "when people come together to talk about work"}
          - {content_key: "en.a2.unit37.lesson01.exercise05.write_microphone", type: "writing_prompt", tested_text: "microphone", prompt: {target_blocks: [{text: "Write the word for the part that carries your voice.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit37.lesson02.describing_your_video_calls"
        title: "Describing your video calls and what you prefer"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit37.lesson02.teach.video_call_every_monday", kind: "phrase", target: {text: "I have a video call with my team every Monday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "have", "a", "video", "call", "with", "my", "team", "every", "Monday"]}
          - {content_key: "en.a2.unit37.lesson02.teach.turn_on_your_camera", kind: "phrase", target: {text: "Can you turn on your camera?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Can", "you", "turn", "on", "your", "camera"]}
          - {content_key: "en.a2.unit37.lesson02.teach.you_were_on_mute", kind: "phrase", target: {text: "Sorry, you were on mute.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Sorry", "were", "mute"]}
          - {content_key: "en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face", kind: "phrase", target: {text: "I think video calls are useful, but I prefer meeting people face to face.", language_code: "en", direction: "ltr"}, introduced_tokens: ["think", "calls", "are", "useful", "but", "prefer", "meeting", "people", "face", "to"]}
          - {content_key: "en.a2.unit37.lesson02.teach.grammar_prefer", kind: "grammar_note", target: {text: "I prefer video calls to phone calls. I prefer face-to-face meetings to video calls.", language_code: "en", direction: "ltr"}, introduced_tokens: ["prefer", "phone", "meetings"]}
        exercises:
          - {content_key: "en.a2.unit37.lesson02.exercise01.listen_camera_request", type: "listen_select", tested_text: "Can you turn on your camera", media_asset_key: "en.a2.audio.video_calls.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit37.lesson02.exercise02.choose_weekly_call_answer", type: "multiple_choice", tested_text: "I have a video call with my team every Monday.", prompt: {target_blocks: [{text: "Someone asks how often you have video calls at work. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson02.exercise03.choose_mute_reply", type: "multiple_choice", tested_text: "Sorry, you were on mute.", prompt: {target_blocks: [{text: "Someone speaks in a video call, but the others can't hear them. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson02.exercise04.order_turn_on_camera", type: "word_order", tested_text: "Can you turn on your camera", prompt: {target_blocks: []}, word_bank: ["you", "turn", "on", "your", "camera", "Can"]}
          - {content_key: "en.a2.unit37.lesson02.exercise05.order_video_call_monday", type: "word_order", tested_text: "I have a video call with my team every Monday", prompt: {target_blocks: []}, word_bank: ["have", "a", "video", "call", "with", "my", "team", "every", "Monday", "I"]}
          - {content_key: "en.a2.unit37.lesson02.exercise06.reply_opinion_video_calls", type: "dialogue_response", tested_text: "I think video calls are useful but I prefer meeting people face to face", prompt: {target_blocks: [{text: "What do you think about video calls?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson02.exercise07.write_opinion_with_reason", type: "writing_prompt", tested_text: "I think video calls are useful, but I prefer meeting people face to face.", prompt: {target_blocks: [{text: "Write the opinion sentence from this lesson about video calls, using I think and but I prefer.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit37.lesson03.reading_about_video_calls"
        title: "Reading about someone's video calls"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit37.lesson03.teach.headphones", kind: "vocabulary", target: {text: "headphones", language_code: "en", direction: "ltr"}, introduced_tokens: ["headphones"], example: {text: "I use headphones so my family can't hear the meeting.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit37.lesson03.teach.leilas_message", kind: "reading", target: {text: "My online classes are all video calls now. I turn on my camera, but I mute my microphone until the teacher asks a question. I use headphones because my connection is better with them. I think video calls save a lot of time, but I still prefer meeting my classmates face to face.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "online", "classes", "are", "all", "video", "calls", "now", "I", "turn", "on", "camera", "but", "mute", "microphone", "until", "the", "teacher", "asks", "a", "question", "use", "headphones", "because", "connection", "is", "better", "with", "them", "think", "save", "lot", "of", "time", "still", "prefer", "meeting", "my", "classmates", "face", "to"]}
          - {content_key: "en.a2.unit37.lesson03.teach.mute_until_question", kind: "phrase", target: {text: "I mute my microphone until the teacher asks a question.", language_code: "en", direction: "ltr"}, introduced_tokens: ["until", "teacher", "asks", "question"]}
        exercises:
          - {content_key: "en.a2.unit37.lesson03.exercise01.read_camera_habit", type: "reading_comprehension", tested_text: "turn on my camera", prompt: {target_blocks: [{text: "What does Leila do at the start of an online class?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson03.exercise02.read_headphones_reason", type: "reading_comprehension", tested_text: "my connection is better with them", prompt: {target_blocks: [{text: "Which words in Leila's message explain why she uses headphones?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson03.exercise03.choose_leilas_opinion", type: "multiple_choice", tested_text: "video calls save a lot of time", prompt: {target_blocks: [{text: "What is Leila's opinion about video calls?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson03.exercise04.choose_what_she_prefers", type: "multiple_choice", tested_text: "meeting my classmates face to face", prompt: {target_blocks: [{text: "Which words in Leila's message say what she still prefers?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson03.exercise05.order_mute_until_question", type: "word_order", tested_text: "I mute my microphone until the teacher asks a question", prompt: {target_blocks: []}, word_bank: ["mute", "my", "microphone", "until", "the", "teacher", "asks", "a", "question", "I"]}
          - {content_key: "en.a2.unit37.lesson03.exercise06.write_own_video_call_message", type: "writing_prompt", tested_text: "I use headphones because my connection is better with them.", prompt: {target_blocks: [{text: "Write Leila's sentence about headphones, using because.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit37.lesson04.video_calls_dialogue"
        title: "Talking with a friend about video calls"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit37.lesson04.teach.q_lot_of_video_calls", kind: "dialogue", target: {text: "Do you have a lot of video calls at work?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Do", "at", "work"]}
          - {content_key: "en.a2.unit37.lesson04.teach.a_call_every_monday", kind: "dialogue", target: {text: "Yes, I have a video call with my team every Monday.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes"]}
          - {content_key: "en.a2.unit37.lesson04.teach.q_turn_on_camera", kind: "dialogue", target: {text: "Do you turn on your camera?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit37.lesson04.teach.a_always_but_mute", kind: "dialogue", target: {text: "Always, but I mute my microphone when I am not speaking.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Always", "when", "am", "not", "speaking"]}
          - {content_key: "en.a2.unit37.lesson04.teach.q_classes_are_video_calls", kind: "dialogue", target: {text: "My online classes are all video calls now.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit37.lesson04.teach.a_what_do_you_think", kind: "dialogue", target: {text: "What do you think about them?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "about", "them"]}
          - {content_key: "en.a2.unit37.lesson04.teach.q_useful_but_prefer", kind: "dialogue", target: {text: "I think video calls are useful, but I prefer meeting people face to face.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit37.lesson04.teach.a_agree_faster_less_personal", kind: "dialogue", target: {text: "I agree. A video call is faster than a visit, but it is less personal.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["agree", "faster", "than", "visit", "it", "less", "personal"]}
          - {content_key: "en.a2.unit37.lesson04.teach.q_exactly", kind: "dialogue", target: {text: "Exactly.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Exactly"]}
        exercises:
          - {content_key: "en.a2.unit37.lesson04.exercise01.listen_call_day", type: "dialogue_comprehension", tested_text: "a video call with my team every Monday", media_asset_key: "en.a2.audio.dialogue.video_calls.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit37.lesson04.exercise02.listen_camera_habit", type: "listen_select", tested_text: "I mute my microphone when I am not speaking", media_asset_key: "en.a2.audio.dialogue.video_calls.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit37.lesson04.exercise03.choose_daniels_opinion", type: "multiple_choice", tested_text: "faster than a visit", prompt: {target_blocks: [{text: "What does Daniel say about a video call?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit37.lesson04.exercise04.order_what_do_you_think", type: "word_order", tested_text: "What do you think about them", prompt: {target_blocks: []}, word_bank: ["do", "you", "think", "about", "them", "What"]}
          - {content_key: "en.a2.unit37.lesson04.exercise05.reply_opinion_as_leila", type: "dialogue_response", tested_text: "I think video calls are useful but I prefer meeting people face to face", prompt: {target_blocks: [{text: "What do you think about them?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit37.lesson04.exercise06.speak_video_calls_dialogue"
            type: "speak_response"
            tested_text: "My online classes are all video calls now. I think video calls are useful, but I prefer meeting people face to face."
            prompt: {target_blocks: [{text: "You are Leila. Daniel asks what you think about video calls.", language_code: "en", direction: "ltr"}]}
