schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "B1"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Firecrawl was unavailable this session (402, out of credits, per
    standing instruction not to retry). Authored directly from established
    ESL B1 conventions (universal_spine.yaml's
    universal.b1.abilities.express_ability_with_embedded_clause node,
    whose prerequisite is universal.a2.bureaucracy.register_with_
    authorities) and this corpus's established Daniel/Leila/Mia
    storyline, not adapted from any specific public-domain course.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude). Verified: be able to /
    manage to / was (not) able to / would be able to are all correct
    embedded-clause ability English; present vs past ability contrast is
    accurate; every word_order accepted_answers is in correct sentence
    order with a buildable word_bank; no boolean coercion, jargon leaks,
    over-length titles, or unquoted yes/no; spine outcome exists. Mia used
    only as a neutral anecdote ("friend Mia" renewed her license in ten
    minutes), no occupation stated -- consistent with the a2_unit30 flag.
    No objective bugs found; the overlay gained a natural "I'm able to"
    contraction variant for grading safety. FLAG (corpus-wide, NOT fixed):
    lesson01 exercise01 listen_select whole-vocab-list-audio ambiguity,
    same as unit01/a2_unit30. FLAG (scope): 4-lesson B1 template vs
    fa/ro/hi's 6-lesson one.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: present and past ability using the modal-plus-embedded-clause construction (be able to, manage to), contrasted with the bare can/could already taught at A1/A2, in an everyday bureaucratic-errand context (renewing a license)."

media_assets:
  - {content_key: "en.b1.audio.abilities.words.license.01", language: "en", text: "license", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.abilities.sentence.01", language: "en", text: "I managed to finish the form in ten minutes.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.abilities.01"
    language: "en"
    text: "Leila: Were you able to renew your license online? Daniel: No, I wasn't able to. I had to go to the office in person. Leila: Really? I managed to do it online in ten minutes. Daniel: Next time, I would be able to save time if I did it online too. Leila: I would be able to help you next time, if you want. Daniel: Thanks, I'd like that."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit02.abilities"
    title: "What I am able to do"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.abilities.express_ability_with_embedded_clause"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit02.lesson01.ability_vocabulary"
        title: "Be able to and manage to"
        spine_outcome_id: "universal.b1.abilities.express_ability_with_embedded_clause"
        teaching:
          - {content_key: "en.b1.unit02.lesson01.teach.be_able_to", kind: "vocabulary", target: {text: "be able to", language_code: "en", direction: "ltr"}, introduced_tokens: ["be", "able", "to"], example: {text: "I am able to renew my license online.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit02.lesson01.teach.manage_to", kind: "vocabulary", target: {text: "manage to", language_code: "en", direction: "ltr"}, introduced_tokens: ["manage", "to"], example: {text: "I managed to finish the form in ten minutes.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit02.lesson01.teach.renew", kind: "vocabulary", target: {text: "renew", language_code: "en", direction: "ltr"}, introduced_tokens: ["renew"], example: {text: "I need to renew my driver's license.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit02.lesson01.teach.license", kind: "vocabulary", target: {text: "license", language_code: "en", direction: "ltr"}, introduced_tokens: ["license"], example: {text: "My driver's license expires this month.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit02.lesson01.teach.online", kind: "vocabulary", target: {text: "online", language_code: "en", direction: "ltr"}, introduced_tokens: ["online"], example: {text: "You can renew it online now.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit02.lesson01.teach.in_person", kind: "vocabulary", target: {text: "in person", language_code: "en", direction: "ltr"}, introduced_tokens: ["in", "person"], example: {text: "Last year, I had to go in person.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit02.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "license", media_asset_key: "en.b1.audio.abilities.words.license.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit02.lesson01.exercise02.choose_get_new_document_word", type: "multiple_choice", tested_text: "renew", prompt: {target_blocks: [{text: "Which word means to get a document extended before it expires?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson01.exercise03.choose_by_going_yourself_phrase", type: "multiple_choice", tested_text: "in person", prompt: {target_blocks: [{text: "Which phrase means by going somewhere yourself, not online?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson01.exercise04.match_ability_words", type: "matching_pairs", tested_text: "be able to license online in person", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "be able to", right: "to have the ability or opportunity to do something"}, {left: "license", right: "an official document that lets you drive"}, {left: "online", right: "using the internet, not in a physical place"}, {left: "in person", right: "by going somewhere yourself"}]}
          - {content_key: "en.b1.unit02.lesson01.exercise05.write_renew", type: "writing_prompt", tested_text: "renew", prompt: {target_blocks: [{text: "Write the word for getting a document extended before it expires.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit02.lesson02.present_and_past_ability"
        title: "I am able to, I was able to"
        spine_outcome_id: "universal.b1.abilities.express_ability_with_embedded_clause"
        teaching:
          - {content_key: "en.b1.unit02.lesson02.teach.am_able_to_renew_online", kind: "phrase", target: {text: "I am able to renew my license online now.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "am", "able", "to", "renew", "my", "license", "online", "now"]}
          - {content_key: "en.b1.unit02.lesson02.teach.was_not_able_to_last_year", kind: "phrase", target: {text: "Last year, I was not able to do it online.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Last", "year", "was", "not", "do", "it"]}
          - {content_key: "en.b1.unit02.lesson02.teach.managed_to_finish", kind: "phrase", target: {text: "I managed to finish the form in ten minutes.", language_code: "en", direction: "ltr"}, introduced_tokens: ["managed", "finish", "the", "form", "in", "ten", "minutes"], media_asset_key: "en.b1.audio.abilities.sentence.01"}
          - {content_key: "en.b1.unit02.lesson02.teach.grammar_present_past", kind: "grammar_note", target: {text: "I am able to renew it. I was able to renew it. I would be able to help you.", language_code: "en", direction: "ltr"}, introduced_tokens: ["would", "be", "help", "you"]}
        exercises:
          - {content_key: "en.b1.unit02.lesson02.exercise01.choose_present_ability", type: "multiple_choice", tested_text: "I am able to renew my license online now.", prompt: {target_blocks: [{text: "Which sentence says you CAN renew your license online now, in the present?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson02.exercise02.choose_past_ability", type: "multiple_choice", tested_text: "Last year, I was not able to do it online.", prompt: {target_blocks: [{text: "Which sentence talks about last year, in the past?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson02.exercise03.order_managed_to_finish", type: "word_order", tested_text: "I managed to finish the form in ten minutes", prompt: {target_blocks: []}, word_bank: ["managed", "to", "finish", "the", "form", "in", "ten", "minutes", "I"]}
          - {content_key: "en.b1.unit02.lesson02.exercise04.reply_were_you_able_to_renew", type: "dialogue_response", tested_text: "I am able to renew my license online now", prompt: {target_blocks: [{text: "Are you able to renew your license online now?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson02.exercise05.write_managed_to_finish", type: "writing_prompt", tested_text: "I managed to finish the form in ten minutes.", prompt: {target_blocks: [{text: "Write that you managed to finish the form in ten minutes.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit02.lesson03.reading_the_new_system"
        title: "Reading: the new online system"
        spine_outcome_id: "universal.b1.abilities.express_ability_with_embedded_clause"
        teaching:
          - {content_key: "en.b1.unit02.lesson03.teach.friend", kind: "vocabulary", target: {text: "friend", language_code: "en", direction: "ltr"}, introduced_tokens: ["friend"], example: {text: "My friend renewed her license last week.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit02.lesson03.teach.system", kind: "vocabulary", target: {text: "system", language_code: "en", direction: "ltr"}, introduced_tokens: ["system"], example: {text: "The new system is much faster.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit02.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Last year, people were not able to renew their licenses online. Everyone had to go to the office in person. This year, the system changed. Now people are able to renew everything from home. My friend Mia was able to finish hers in ten minutes.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["people", "were", "their", "licenses", "Everyone", "had", "go", "office", "This", "changed", "everything", "from", "home", "Mia", "hers"]
        exercises:
          - {content_key: "en.b1.unit02.lesson03.exercise01.comprehend_last_year", type: "reading_comprehension", tested_text: "go to the office in person", prompt: {target_blocks: [{text: "Last year, what did everyone have to do to renew their license?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson03.exercise02.comprehend_mia_time", type: "reading_comprehension", tested_text: "ten minutes", prompt: {target_blocks: [{text: "How long did it take Mia to finish renewing hers?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson03.exercise03.recognize_system", type: "multiple_choice", tested_text: "system", prompt: {target_blocks: [{text: "Which word means an organized way of doing something?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson03.exercise04.order_mia_was_able_to_finish", type: "word_order", tested_text: "Mia was able to finish hers in ten minutes", prompt: {target_blocks: []}, word_bank: ["was", "able", "to", "finish", "hers", "in", "ten", "minutes", "Mia"]}
          - {content_key: "en.b1.unit02.lesson03.exercise05.write_friend_renewed", type: "writing_prompt", tested_text: "My friend was able to finish it online.", prompt: {target_blocks: [{text: "Write that your friend was able to finish it online.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit02.lesson04.the_license_dialogue"
        title: "Were you able to renew it?"
        spine_outcome_id: "universal.b1.abilities.express_ability_with_embedded_clause"
        teaching:
          - {content_key: "en.b1.unit02.lesson04.teach.q_were_you_able", kind: "dialogue", target: {text: "Were you able to renew your license online?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Were", "you", "able", "to", "renew", "your", "license", "online"], media_asset_key: "en.b1.audio.dialogue.abilities.01"}
          - {content_key: "en.b1.unit02.lesson04.teach.a_wasnt_able_office", kind: "dialogue", target: {text: "No, I wasn't able to. I had to go to the office in person.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["No", "wasn't", "able", "had", "go", "the", "office", "in", "person"]}
          - {content_key: "en.b1.unit02.lesson04.teach.q_really_managed", kind: "dialogue", target: {text: "Really? I managed to do it online in ten minutes.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Really", "managed", "do", "it", "online", "in", "ten", "minutes"]}
          - {content_key: "en.b1.unit02.lesson04.teach.a_next_time_save", kind: "dialogue", target: {text: "Next time, I would be able to save time if I did it online too.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Next", "time", "would", "be", "able", "to", "save", "if", "did", "too"]}
          - {content_key: "en.b1.unit02.lesson04.teach.q_would_help", kind: "dialogue", target: {text: "I would be able to help you next time, if you want.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["would", "be", "able", "to", "help", "you", "next", "time", "want"]}
          - {content_key: "en.b1.unit02.lesson04.teach.a_thanks", kind: "dialogue", target: {text: "Thanks, I'd like that.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thanks", "I'd", "like", "that"]}
        exercises:
          - {content_key: "en.b1.unit02.lesson04.exercise01.listen_daniel_couldnt_online", type: "dialogue_comprehension", tested_text: "go to the office in person", media_asset_key: "en.b1.audio.dialogue.abilities.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit02.lesson04.exercise02.listen_leilas_time", type: "listen_select", tested_text: "ten minutes", media_asset_key: "en.b1.audio.dialogue.abilities.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit02.lesson04.exercise03.choose_leilas_offer", type: "multiple_choice", tested_text: "I would be able to help you next time, if you want.", prompt: {target_blocks: [{text: "What does Leila offer to do next time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit02.lesson04.exercise04.order_i_wasnt_able_to", type: "word_order", tested_text: "I wasn't able to do it online", prompt: {target_blocks: []}, word_bank: ["wasn't", "able", "to", "do", "it", "online", "I"]}
          - content_key: "en.b1.unit02.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "No I wasn't able to I had to go to the office in person"
            prompt: {target_blocks: [{text: "Were you able to renew your license online?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit02.lesson04.exercise06.speak_ability_dialogue"
            type: "speak_response"
            tested_text: "Next time I would be able to save time if I did it online too"
            prompt: {target_blocks: [{text: "Really? I managed to do it online in ten minutes.", language_code: "en", direction: "ltr"}]}
