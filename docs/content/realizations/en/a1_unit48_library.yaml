        teaching:
          - {content_key: "en.a1.unit48.lesson01.teach.library", kind: "vocabulary", target: {text: "library", language_code: "en", direction: "ltr"}, introduced_tokens: ["library", "I", "go", "to", "the", "every", "week"], example: {text: "I go to the library every week.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit48.lesson01.teach.borrow", kind: "vocabulary", target: {text: "borrow", language_code: "en", direction: "ltr"}, introduced_tokens: ["borrow", "I'd", "like", "this", "book"], example: {text: "I'd like to borrow this book.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit48.lesson01.teach.return", kind: "vocabulary", target: {text: "return", language_code: "en", direction: "ltr"}, introduced_tokens: ["return", "Can"], example: {text: "Can I return this book?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit48.lesson01.teach.due", kind: "vocabulary", target: {text: "due", language_code: "en", direction: "ltr"}, introduced_tokens: ["due", "When", "is", "it"], example: {text: "When is it due?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit48.lesson01.teach.card", kind: "vocabulary", target: {text: "library card", language_code: "en", direction: "ltr"}, introduced_tokens: ["card", "This", "my"], example: {text: "This is my library card.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit48.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "borrow", media_asset_key: "en.a1.audio.library_visit.words.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit48.lesson01.exercise02.choose_return_meaning", type: "multiple_choice", tested_text: "return", prompt: {target_blocks: [{text: "Which word means to give something back?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson01.exercise03.match_library_words", type: "matching_pairs", tested_text: "library borrow return due card", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a place where you can borrow books", right: "library"}, {left: "to take something and bring it back later", right: "borrow"}, {left: "to give something back", right: "return"}, {left: "the day something needs to be given back", right: "due"}, {left: "a card that lets you borrow library items", right: "card"}]}
          - {content_key: "en.a1.unit48.lesson01.exercise04.order_borrow_sentence", type: "word_order", tested_text: "I'd like to borrow this book.", word_bank: ["I'd", "like", "to", "borrow", "this", "book."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson01.exercise05.write_return_word", type: "writing_prompt", tested_text: "return", prompt: {target_blocks: [{text: "Write the word that means to give something back.", language_code: "en", direction: "ltr"}]}}

