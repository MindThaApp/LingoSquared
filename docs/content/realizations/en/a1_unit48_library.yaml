        spine_outcome_id: "universal.a1.library.borrow_return_item"
        teaching:
          - {content_key: "en.a1.unit48.lesson04.teach.reading_passage", kind: "reading", target: {text: "Visiting the Library: Most libraries let you borrow books, and sometimes other items, for a few weeks at a time. To borrow something, you usually need a library card. When you borrow a book, the librarian will tell you the due date -- the day you need to return it. If you're not finished by then, you can often ask the librarian for more time. Since Leila moved to her new apartment, she doesn't own as many books as she used to, so she started borrowing them from the library instead. Last week, she returned a book and picked up a new one, and her friend Daniel came along. He had never borrowed a library book before, so he got his own library card and checked out a cookbook to help him practice the recipes Mia has been teaching him. The librarian reminded them both to bring their books back before the due date. Mia doesn't visit the library often, but she once borrowed a photography book for her class.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Visiting", "the", "Library", "Most", "libraries", "let", "you", "borrow", "books", "and", "sometimes", "other", "items", "for", "a", "few", "weeks", "at", "time", "To", "something", "usually", "need", "library", "card", "When", "book", "librarian", "will", "tell", "due", "date", "day", "If", "you're", "not", "finished", "by", "then", "can", "often", "ask", "more", "Since", "Leila", "moved", "to", "her", "new", "apartment", "she", "doesn't", "own", "as", "many", "used", "so", "started", "borrowing", "them", "from", "instead", "Last", "week", "returned", "picked", "up", "one", "friend", "Daniel", "came", "along", "He", "had", "never", "before", "got", "his", "checked", "out", "cookbook", "help", "him", "practice", "recipes", "Mia", "has", "been", "teaching", "The", "reminded", "both", "bring", "their", "back", "once", "photography"]}
        exercises:
          - {content_key: "en.a1.unit48.lesson04.exercise01.reading_why_leila_borrows", type: "multiple_choice", tested_text: "she doesn't own as many books as she used to", prompt: {target_blocks: [{text: "According to the reading, why does Leila borrow books from the library now?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson04.exercise02.reading_what_daniel_checked_out", type: "multiple_choice", tested_text: "a cookbook", prompt: {target_blocks: [{text: "According to the reading, what did Daniel check out?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson04.exercise03.reading_what_to_do_if_late", type: "multiple_choice", tested_text: "ask the librarian for more time", prompt: {target_blocks: [{text: "According to the reading, what should you do if you're not finished with a book by the due date?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson04.exercise04.write_own_library_message", type: "writing_prompt", tested_text: "I'd like to borrow this book. Do I need a library card?", prompt: {target_blocks: [{text: "Write a short message: say you'd like to borrow a book and ask whether you need a library card.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I'd like to borrow this book. Do I need a library card?", "I'd like to borrow this book. Do I need a library card.", "I'd like to borrow this book, do I need a library card?", "I'd like to borrow this book, and do I need a library card?", "I'd like to borrow a book. Do I need a library card?", "I'd like to borrow a book. Do I need a library card."]}
