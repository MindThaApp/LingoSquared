          - {content_key: "en.a1.unit48.lesson02.teach.when_is_this_book_due", kind: "phrase", target: {text: "When is this book due?", language_code: "en", direction: "ltr"}, introduced_tokens: []}
          - {content_key: "en.a1.unit48.lesson02.teach.can_i_return_this_book", kind: "phrase", target: {text: "Can I return this book?", language_code: "en", direction: "ltr"}, introduced_tokens: []}
          - {content_key: "en.a1.unit48.lesson02.teach.your_book_is_due_on_friday", kind: "phrase", target: {text: "Your book is due on Friday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Your", "on", "Friday"]}
        exercises:
          - {content_key: "en.a1.unit48.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "Do you have a library card?", media_asset_key: "en.a1.audio.library_visit.phrases.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit48.lesson02.exercise02.choose_borrow_meaning", type: "multiple_choice", tested_text: "I'd like to borrow this book.", prompt: {target_blocks: [{text: "Which phrase do you say to ask to take a book home?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson02.exercise03.choose_due_friday_meaning", type: "multiple_choice", tested_text: "Your book is due on Friday.", prompt: {target_blocks: [{text: "Which phrase tells you when you need to return your book?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson02.exercise04.order_return_sentence", type: "word_order", tested_text: "Can I return this book?", word_bank: ["Can", "I", "return", "this", "book?"], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit48.lesson02.exercise05.translate_when_due", type: "translation", tested_text: "When is this book due?", prompt: {target_blocks: [{text: "Translate: \"When is this book due?\"", language_code: "en", direction: "ltr"}]}}

