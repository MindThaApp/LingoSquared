course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Library register is a simple, polite spoken exchange: I'd like to borrow this book., Do you have a library card?, When is this book due?, Can I return this book?, Your book is due on Friday. Core vocabulary (library/borrow/return/due/card) is deliberately generic to any public-library visit, not specialized reference-desk or late-fee language, since this unit's scope is a routine borrow-and-return errand, not a complex library-services register."

media_assets:
  - {content_key: "en.a1.audio.library_visit.words.01", language: "en", text: "library, borrow, return, due, card", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.library_visit.phrases.01", language: "en", text: "Do you have a library card? Yes, here's my library card. I'd like to borrow this book. When is this book due? Can I return this book? Your book is due on Friday.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.library_visit.01"
    language: "en"
    text: "Leila: I need to return this book at the library. Do you want to come with me? Daniel: Sure! I don't think I've ever borrowed a book from a library before. Leila: Hi, I'd like to return this book, and I'd like to borrow a new one too. Librarian: Great, thank you. Do you have your library card? Leila: Yes, here it is. Librarian: Perfect. This new book is due back in three weeks. Daniel: Can I get a library card too? I'd like to borrow a cookbook. Librarian: Of course! Just fill out this form."
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

