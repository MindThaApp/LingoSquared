cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    No public-domain source material was consulted: AUTHORING_GUIDE §10's
    verified PD map covers the LEARNER-side languages, not
    English-as-target A2 tenancy material, and firecrawl was not used
    this session. Authored from established ESL A2 conventions against
    universal.a2.housing.report_maintenance_problem, whose can_do
    explicitly includes "and arrange for a repair" -- the half
    a2_unit29_maintenance (reporting the problem) leaves undelivered.
    Facts are deliberately continuous with a2_unit29 per §11: the same
    leaking kitchen sink, the same building manager, the same repair
    number 6180 and the same 2pm-4pm window, which this unit moves.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Fourth of 6 new A2 units (unit35-unit40) authored 2026-07-22 to close
    the publish-gate teaching-hours gap on the shared English
    realization. Spine outcome REUSED from a2_unit29_maintenance (see
    a2_unit35_prescription's review note for why reuse rather than new
    spine outcomes). Scenario is new and strictly downstream of unit29:
    Daniel cannot be home for the 2pm-4pm window he was given, so he
    calls to move the visit to the morning and leaves the key with a
    neighbor. Character canon checked before writing (AUTHORING_PREFLIGHT
    §6): Daniel is an engineer at a small company downtown who works on
    weekdays (a1_unit23, a2_unit33) -- which is exactly why he cannot be
    home in the afternoon; his apartment's leaking kitchen sink, the
    building manager, the plumber and repair number 6180 all come from
    a2_unit29 unchanged. The neighbor is deliberately left unnamed to
    avoid pinning a new character. Every exercise's tested_text is
    covered by this file's own or the A2 chain's earlier
    introduced_tokens. PENDING a fresh-context review per AUTHORING_GUIDE
    §9.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked against the nl-en overlay: answer keys,
    listen_select/dialogue_response distractors absent from audio, speaker
    attribution vs audio, character canon (Daniel weekdays, unit29 repair
    6180/kitchen sink/2pm-4pm, Mia at Bright Path Marketing, Leila units
    33-34), course-wide vocabulary coverage of matching_pairs tested_text,
    YAML boolean quoting, no internal jargon. Fix:
    en.a2.unit38.lesson04.exercise03.choose_reason had a first-person key
    ("because I am at work") under a third-person question with
    third-person distractors (grammar giveaway). The reviewer suggested
    keying "because he is at work", but neither "he" nor "Daniel" is an
    introduced token in the English chain (validator error), so instead
    the prompt became "Why can't Daniel be home between 2pm and 4pm? What
    does he say?" (key stays Daniel's own words) and the distractors in
    the nl-en, fa-en and prs-en a2_unit38 overlays were made first person
    (English strings only): "because he is not at home in the morning" ->
    "because I am not at home in the morning", "because his neighbor has
    the key" -> "because my neighbor has the key". Overlay
    instructions/feedback unchanged and still correct ("Daniel says
    *because I am at work*"). No native flags.

    Review 2026-10-22 (shared-en r3): 2 fixes - alternative tile orders added to
    fa/prs; accepted_answers made consistent (cannot/can't, I'm/I am, have to).
    NATIVE FLAGS: none.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at the same polite tenant-to-building-manager register a2_unit29 established (I'd like to..., Would it be possible to...?), plus can't / won't for stating unavailability."

media_assets:
  - {content_key: "en.a2.audio.repair_visit.words.neighbor.01", language: "en", text: "neighbor", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.repair_visit.question.01", language: "en", text: "I need to reschedule the repair.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.repair_visit.description.01", language: "en", text: "Repair 6180 has been rescheduled. The plumber will come tomorrow between 9am and 11am. Your neighbor will open the door. Please confirm this new time by message today.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.repair_visit.01"
    language: "en"
    text: "Daniel: Hello, I need to reschedule the repair. Manager: No problem. Which repair is it? Daniel: Repair 6180, the leak under my kitchen sink. Manager: I see. Why can't you be home? Daniel: I can't be home between 2pm and 4pm because I am at work. Would it be possible to come in the morning instead? Manager: Yes, the plumber can come between 9am and 11am. Daniel: Thank you. I will leave the key with my neighbor. Manager: Good. Please confirm this new time by message today. Daniel: I will confirm it this afternoon."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit38.repair_visit"
    title: "Arranging and confirming a repair visit"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.housing.report_maintenance_problem"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit38.lesson01.repair_visit_vocabulary"
        title: "Rescheduling, keys, and neighbors"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit38.lesson01.teach.reschedule", kind: "vocabulary", target: {text: "reschedule", language_code: "en", direction: "ltr"}, introduced_tokens: ["reschedule"], example: {text: "I have to reschedule the repair because I will be at work.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit38.lesson01.teach.neighbor", kind: "vocabulary", target: {text: "neighbor", language_code: "en", direction: "ltr"}, introduced_tokens: ["neighbor"], example: {text: "My neighbor can open the door for the plumber.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit38.lesson01.teach.key", kind: "vocabulary", target: {text: "key", language_code: "en", direction: "ltr"}, introduced_tokens: ["key"], example: {text: "I will leave the key with my neighbor.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit38.lesson01.teach.leak", kind: "vocabulary", target: {text: "leak", language_code: "en", direction: "ltr"}, introduced_tokens: ["leak"], example: {text: "The leak under my kitchen sink is getting worse.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit38.lesson01.teach.fixed", kind: "vocabulary", target: {text: "fixed", language_code: "en", direction: "ltr"}, introduced_tokens: ["fixed"], example: {text: "The sink is fixed now, and the water has stopped.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit38.lesson01.teach.afternoon", kind: "vocabulary", target: {text: "afternoon", language_code: "en", direction: "ltr"}, introduced_tokens: ["afternoon"], example: {text: "The plumber came in the afternoon, not in the morning.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit38.lesson01.teach.grammar_cant_wont", kind: "grammar_note", target: {text: "I can't be home between 2pm and 4pm. I won't be home in the afternoon.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "can't", "be", "home", "between", "2pm", "and", "4pm", "won't", "in", "the", "afternoon"]}
        exercises:
          - {content_key: "en.a2.unit38.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "neighbor", media_asset_key: "en.a2.audio.repair_visit.words.neighbor.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit38.lesson01.exercise02.choose_reschedule_word", type: "multiple_choice", tested_text: "reschedule", prompt: {target_blocks: [{text: "Which word means to move an appointment to another time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson01.exercise03.choose_neighbor_word", type: "multiple_choice", tested_text: "neighbor", prompt: {target_blocks: [{text: "Which word means the person who lives next to you?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit38.lesson01.exercise04.match_repair_visit_words"
            type: "matching_pairs"
            tested_text: "reschedule neighbor key leak fixed afternoon plumber repair"
            prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}
            pairs:
              - {left: "reschedule", right: "to move an appointment to another time"}
              - {left: "neighbor", right: "the person who lives next to you"}
              - {left: "key", right: "the small metal thing that opens your door"}
              - {left: "leak", right: "water coming out of a pipe where it shouldn't"}
              - {left: "fixed", right: "not broken any more"}
              - {left: "afternoon", right: "the part of the day after 12 o'clock"}
              - {left: "plumber", right: "the person who fixes water problems"}
              - {left: "repair", right: "the work of making something broken work again"}
          - {content_key: "en.a2.unit38.lesson01.exercise05.write_neighbor", type: "writing_prompt", tested_text: "neighbor", prompt: {target_blocks: [{text: "Write the word for the person who lives next to you.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit38.lesson02.moving_the_appointment"
        title: "Moving the appointment to another time"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit38.lesson02.teach.need_to_reschedule", kind: "phrase", target: {text: "I need to reschedule the repair.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "need", "to", "reschedule", "the", "repair"]}
          - {content_key: "en.a2.unit38.lesson02.teach.possible_in_the_morning", kind: "phrase", target: {text: "Would it be possible to come in the morning instead?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Would", "it", "be", "possible", "come", "in", "morning", "instead"]}
          - {content_key: "en.a2.unit38.lesson02.teach.leave_key_with_neighbor", kind: "phrase", target: {text: "I will leave the key with my neighbor.", language_code: "en", direction: "ltr"}, introduced_tokens: ["will", "leave", "key", "with", "my", "neighbor"]}
          - {content_key: "en.a2.unit38.lesson02.teach.is_the_leak_fixed", kind: "phrase", target: {text: "Is the leak fixed now?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Is", "leak", "fixed", "now"]}
          - {content_key: "en.a2.unit38.lesson02.teach.grammar_because_reason", kind: "grammar_note", target: {text: "I can't be home between 2pm and 4pm because I am at work.", language_code: "en", direction: "ltr"}, introduced_tokens: ["can't", "home", "between", "2pm", "and", "4pm", "because", "am", "at", "work"]}
        exercises:
          - {content_key: "en.a2.unit38.lesson02.exercise01.listen_reschedule_request", type: "listen_select", tested_text: "I need to reschedule the repair", media_asset_key: "en.a2.audio.repair_visit.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit38.lesson02.exercise02.choose_reschedule_request", type: "multiple_choice", tested_text: "I need to reschedule the repair.", prompt: {target_blocks: [{text: "You are calling the building manager because the repair time does not work for you. What do you say first?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson02.exercise03.choose_polite_morning_request", type: "multiple_choice", tested_text: "Would it be possible to come in the morning instead?", prompt: {target_blocks: [{text: "You want the plumber to come in the morning. How do you ask, formally?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson02.exercise04.order_leave_key", type: "word_order", tested_text: "I will leave the key with my neighbor", prompt: {target_blocks: []}, word_bank: ["will", "leave", "the", "key", "with", "my", "neighbor", "I"]}
          - {content_key: "en.a2.unit38.lesson02.exercise05.order_cant_be_home", type: "word_order", tested_text: "I can't be home between 2pm and 4pm", prompt: {target_blocks: []}, word_bank: ["can't", "be", "home", "between", "2pm", "and", "4pm", "I"]}
          - {content_key: "en.a2.unit38.lesson02.exercise06.reply_ask_for_morning", type: "dialogue_response", tested_text: "Would it be possible to come in the morning instead", prompt: {target_blocks: [{text: "The plumber can come between 2pm and 4pm.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson02.exercise07.write_reschedule_request", type: "writing_prompt", tested_text: "I need to reschedule the repair.", prompt: {target_blocks: []}}

      - content_key: "en.a2.unit38.lesson03.reading_a_rescheduling_message"
        title: "Reading a rescheduling message"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit38.lesson03.teach.message", kind: "vocabulary", target: {text: "message", language_code: "en", direction: "ltr"}, introduced_tokens: ["message"], example: {text: "I got a message about the new repair time.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit38.lesson03.teach.rescheduling_text", kind: "reading", target: {text: "Repair 6180 has been rescheduled. The plumber will come tomorrow between 9am and 11am. Your neighbor will open the door. Please confirm this new time by message today.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Repair", "6180", "has", "been", "rescheduled", "The", "plumber", "will", "come", "tomorrow", "between", "9am", "and", "11am", "Your", "neighbor", "open", "the", "door", "Please", "confirm", "this", "new", "time", "by", "message", "today"]}
          - {content_key: "en.a2.unit38.lesson03.teach.confirm_by_message", kind: "phrase", target: {text: "Please confirm this new time by message today.", language_code: "en", direction: "ltr"}, introduced_tokens: ["confirm", "new", "time", "by", "today"]}
        exercises:
          - {content_key: "en.a2.unit38.lesson03.exercise01.read_new_time", type: "reading_comprehension", tested_text: "tomorrow between 9am and 11am", prompt: {target_blocks: [{text: "When will the plumber come now?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson03.exercise02.read_who_opens_the_door", type: "reading_comprehension", tested_text: "your neighbor", prompt: {target_blocks: [{text: "Who will open the door for the plumber?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson03.exercise03.read_what_you_must_do", type: "reading_comprehension", tested_text: "confirm this new time by message today", prompt: {target_blocks: [{text: "What does the message ask you to do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson03.exercise04.choose_true_statement", type: "multiple_choice", tested_text: "Repair 6180 has been rescheduled", prompt: {target_blocks: [{text: "Which statement is true according to the message?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson03.exercise05.order_plumber_new_window", type: "word_order", tested_text: "The plumber will come tomorrow between 9am and 11am", prompt: {target_blocks: []}, word_bank: ["plumber", "will", "come", "tomorrow", "between", "9am", "and", "11am", "The"]}
          - {content_key: "en.a2.unit38.lesson03.exercise06.write_confirm_request", type: "writing_prompt", tested_text: "Please confirm this new time by message today.", prompt: {target_blocks: [{text: "Write the message's request, beginning with Please confirm.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit38.lesson04.repair_visit_dialogue"
        title: "Calling to move the repair"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit38.lesson04.teach.q_need_to_reschedule", kind: "dialogue", target: {text: "Hello, I need to reschedule the repair.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Hello"]}
          - {content_key: "en.a2.unit38.lesson04.teach.a_which_repair", kind: "dialogue", target: {text: "No problem. Which repair is it?", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["No", "problem", "Which", "is", "it"]}
          - {content_key: "en.a2.unit38.lesson04.teach.q_repair_6180", kind: "dialogue", target: {text: "Repair 6180, the leak under my kitchen sink.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["under", "kitchen", "sink"]}
          - {content_key: "en.a2.unit38.lesson04.teach.a_why_cant_you_be_home", kind: "dialogue", target: {text: "I see. Why can't you be home?", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["see", "Why", "you"]}
          - {content_key: "en.a2.unit38.lesson04.teach.q_at_work_ask_morning", kind: "dialogue", target: {text: "I can't be home between 2pm and 4pm because I am at work. Would it be possible to come in the morning instead?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit38.lesson04.teach.a_plumber_can_come_morning", kind: "dialogue", target: {text: "Yes, the plumber can come between 9am and 11am.", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["Yes", "can", "9am", "11am"]}
          - {content_key: "en.a2.unit38.lesson04.teach.q_leave_key", kind: "dialogue", target: {text: "Thank you. I will leave the key with my neighbor.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thank"]}
          - {content_key: "en.a2.unit38.lesson04.teach.a_please_confirm", kind: "dialogue", target: {text: "Good. Please confirm this new time by message today.", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["Good"]}
          - {content_key: "en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon", kind: "dialogue", target: {text: "I will confirm it this afternoon.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.a2.unit38.lesson04.exercise01.listen_new_window", type: "dialogue_comprehension", tested_text: "between 9am and 11am", media_asset_key: "en.a2.audio.dialogue.repair_visit.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit38.lesson04.exercise02.listen_key_arrangement", type: "listen_select", tested_text: "I will leave the key with my neighbor", media_asset_key: "en.a2.audio.dialogue.repair_visit.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit38.lesson04.exercise03.choose_reason", type: "multiple_choice", tested_text: "because I am at work", prompt: {target_blocks: [{text: "Why can't Daniel be home between 2pm and 4pm? What does he say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit38.lesson04.exercise04.order_possible_morning", type: "word_order", tested_text: "Would it be possible to come in the morning instead", prompt: {target_blocks: []}, word_bank: ["it", "be", "possible", "to", "come", "in", "the", "morning", "instead", "Would"]}
          - {content_key: "en.a2.unit38.lesson04.exercise05.reply_why_cant_you_be_home", type: "dialogue_response", tested_text: "I can't be home between 2pm and 4pm because I am at work", prompt: {target_blocks: [{text: "Why can't you be home?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit38.lesson04.exercise06.speak_repair_visit_dialogue"
            type: "speak_response"
            tested_text: "I need to reschedule the repair. I can't be home between 2pm and 4pm because I am at work. Would it be possible to come in the morning instead?"
            prompt: {target_blocks: [{text: "You are Daniel, calling the building manager.", language_code: "en", direction: "ltr"}]}
