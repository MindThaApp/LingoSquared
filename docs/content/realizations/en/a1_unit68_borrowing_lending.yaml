          - {content_key: "en.a1.unit68.lesson04.exercise05.write_own_borrowing_note", type: "writing_prompt", tested_text: "I borrowed your umbrella. I will return it tomorrow.", prompt: {target_blocks: [{text: "Write a short note: say you borrowed an umbrella, and say when you will return it.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I borrowed your umbrella. I will return it tomorrow.", "I borrowed your umbrella, and I will return it tomorrow.", "I borrowed your umbrella and I will return it tomorrow."]}
