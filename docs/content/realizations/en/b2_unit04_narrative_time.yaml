    language: "en"
    text: "Harper: Can you walk me through what happened at the venue? Simon: Sure. When I arrived, the volunteers were setting up the chairs, but the coordinator had already moved the equipment inside because rain was expected. Harper: So the equipment was safe before you got there? Simon: Exactly. Then, while I was checking the sound system, the power went out. Harper: What did you do after that? Simon: I called the building manager, and she told me a repair crew had been working nearby earlier that morning. Harper: And the event? Simon: We delayed the start by twenty minutes, but by the time guests entered, the lights had come back on."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

