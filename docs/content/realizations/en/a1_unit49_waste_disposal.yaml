course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Waste-sorting register is a simple, everyday spoken exchange between roommates or friends: Which bin does this go in?, This goes in the recycling bin., The green bin is for glass., Can you take out the trash?, Collection day is on Tuesday., What about paper and food waste? Core vocabulary (sort/bin/recycle/trash/collection day) is deliberately generic to any household waste-sorting system, not a specific city's official recycling-program terminology, since this unit's scope is a routine household task, not municipal policy language."

