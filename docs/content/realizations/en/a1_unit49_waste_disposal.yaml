  - {content_key: "en.a1.audio.waste_disposal.phrases.this_goes_in_the_recycling_bin.01", language: "en", text: "This goes in the recycling bin.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.waste_disposal.01"
    language: "en"
    text: "Mia: Wait, that glass jar doesn't go in the trash! Daniel: Oh no, sorry! Which bin does it go in? Mia: It goes in the green bin. We recycle glass here. Daniel: What about paper and food waste? Mia: Paper goes in the blue bin, and food waste goes in the brown bin. Daniel: Got it. When is collection day? Mia: The recycling bins go out on Tuesdays, and the trash goes out on Fridays. Daniel: Thanks! I'll sort everything correctly next time."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

