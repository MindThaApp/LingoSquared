    language: "en"
    text: "Daniel: I'm a little overwhelmed. I'm leading two projects, and I still have my evening class three times a week. Leila: If I were you, I would talk to your manager about the workload. Daniel: That's a good idea, but I don't want to seem like I can't handle it. Leila: You should prioritize the project with the closer deadline first. How about asking a colleague to help with the other one? Daniel: I like that. I'll ask Mia if she has time this week. Leila: That sounds like a solid plan."
    voice_hint: "two_adults_neutral_supportive"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit16.advice"
    title: "If I were you, I would..."
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.social.give_advice_and_make_suggestions"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit16.lesson01.advice_vocabulary"
        title: "Words for giving advice"
        spine_outcome_id: "universal.b1.social.give_advice_and_make_suggestions"
        teaching:
          - {content_key: "en.b1.unit16.lesson01.teach.advice", kind: "vocabulary", target: {text: "advice", language_code: "en", direction: "ltr"}, introduced_tokens: ["advice"], example: {text: "Leila gave Daniel some helpful advice.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit16.lesson01.teach.suggest", kind: "vocabulary", target: {text: "suggest", language_code: "en", direction: "ltr"}, introduced_tokens: ["suggest"], example: {text: "Leila suggested a way to manage his workload.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit16.lesson01.teach.overwhelmed", kind: "vocabulary", target: {text: "overwhelmed", language_code: "en", direction: "ltr"}, introduced_tokens: ["overwhelmed"], example: {text: "Daniel felt overwhelmed by his two projects.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit16.lesson01.teach.prioritize", kind: "vocabulary", target: {text: "prioritize", language_code: "en", direction: "ltr"}, introduced_tokens: ["prioritize"], example: {text: "Daniel decided to prioritize the project with the closer deadline.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit16.lesson01.teach.workload", kind: "vocabulary", target: {text: "workload", language_code: "en", direction: "ltr"}, introduced_tokens: ["workload"], example: {text: "Daniel's workload grew after he joined the team in March.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit16.lesson01.teach.decline", kind: "vocabulary", target: {text: "decline", language_code: "en", direction: "ltr"}, introduced_tokens: ["decline"], example: {text: "Daniel could accept the advice or decline it politely.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit16.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "overwhelmed", media_asset_key: "en.b1.audio.advice.phrase.overwhelmed.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit16.lesson01.exercise02.choose_prioritize", type: "multiple_choice", tested_text: "prioritize", prompt: {target_blocks: [{text: "Which word means to deal with the most important task first?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson01.exercise03.choose_decline", type: "multiple_choice", tested_text: "decline", prompt: {target_blocks: [{text: "Which word means to politely refuse a suggestion?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson01.exercise04.match_advice_words", type: "matching_pairs", tested_text: "advice suggest overwhelmed prioritize workload decline", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "an opinion offered about what someone should do", right: "advice"}, {left: "to propose an idea for someone to consider", right: "suggest"}, {left: "feeling that you have more to deal with than you can manage", right: "overwhelmed"}, {left: "to deal with the most important task first", right: "prioritize"}, {left: "the total amount of work a person has to do", right: "workload"}, {left: "to politely refuse a suggestion or offer", right: "decline"}]}
          - {content_key: "en.b1.unit16.lesson01.exercise05.write_workload", type: "writing_prompt", tested_text: "workload", prompt: {target_blocks: [{text: "Write the word that means the total amount of work a person has to do.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit16.lesson02.advice_forms"
        title: "If I were you, I would talk to your manager"
        spine_outcome_id: "universal.b1.social.give_advice_and_make_suggestions"
        teaching:
          - {content_key: "en.b1.unit16.lesson02.teach.if_i_were_you", kind: "phrase", target: {text: "If I were you, I would talk to your manager.", language_code: "en", direction: "ltr"}, introduced_tokens: ["If", "I", "were", "you", "would", "talk", "to", "your", "manager"], media_asset_key: "en.b1.audio.advice.sentence.01"}
          - {content_key: "en.b1.unit16.lesson02.teach.you_should_prioritize", kind: "phrase", target: {text: "You should prioritize the project with the closer deadline.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "should", "the", "project", "with", "closer", "deadline"]}
          - {content_key: "en.b1.unit16.lesson02.teach.how_about", kind: "phrase", target: {text: "How about asking a colleague to help?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "about", "asking", "a", "colleague", "help"]}
          - {content_key: "en.b1.unit16.lesson02.teach.grammar_advice_forms", kind: "grammar_note", target: {text: "Advice and suggestions use several forms: If I were you, I would... (an unreal hypothetical), You should... (a direct recommendation), and How about + -ing...? (a softer suggestion). Choose a stronger or softer form depending on how confident you want to sound.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Advice", "and", "suggestions", "use", "several", "forms", "an", "unreal", "hypothetical", "direct", "recommendation", "softer", "suggestion", "Choose", "stronger", "or", "form", "depending", "on", "how", "confident", "want", "sound"]}
        exercises:
          - {content_key: "en.b1.unit16.lesson02.exercise01.choose_if_i_were_you", type: "multiple_choice", tested_text: "If I were you, I would talk to your manager.", prompt: {target_blocks: [{text: "Which sentence gives advice using the unreal hypothetical form 'If I were you'?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson02.exercise02.choose_how_about", type: "multiple_choice", tested_text: "How about asking a colleague to help?", prompt: {target_blocks: [{text: "Which sentence makes a soft suggestion using 'How about'?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson02.exercise03.order_you_should_prioritize", type: "word_order", tested_text: "You should prioritize the project with the closer deadline", prompt: {target_blocks: []}, word_bank: ["should", "prioritize", "the", "project", "with", "the", "closer", "deadline", "You"]}
          - {content_key: "en.b1.unit16.lesson02.exercise04.reply_advise_daniel", type: "dialogue_response", tested_text: "If I were you, I would talk to your manager", prompt: {target_blocks: [{text: "Give Daniel advice about his workload, starting with 'If I were you'.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson02.exercise05.write_how_about", type: "writing_prompt", tested_text: "How about asking a colleague to help?", prompt: {target_blocks: [{text: "Write a soft suggestion asking whether a colleague could help, starting with 'How about'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit16.lesson03.reading_advice_between_friends"
        title: "Reading: advice about a heavy workload"
        spine_outcome_id: "universal.b1.social.give_advice_and_make_suggestions"
        teaching:
          - {content_key: "en.b1.unit16.lesson03.teach.deadline", kind: "vocabulary", target: {text: "deadline", language_code: "en", direction: "ltr"}, introduced_tokens: ["deadline"], example: {text: "Daniel's closer deadline is next Friday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit16.lesson03.teach.that_makes_sense", kind: "phrase", target: {text: "That makes sense. I'll try it.", language_code: "en", direction: "ltr"}, introduced_tokens: ["That", "makes", "sense", "I'll", "try", "it"], example: {text: "That makes sense. I'll try it this week.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit16.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Hi Leila, I'm feeling overwhelmed this week. I'm leading two projects, and my evening class is on top of that. Any advice? Hi Daniel, if I were you, I would talk to your manager about the workload. You should also prioritize the project with the closer deadline. How about asking Mia to help with the other one? Thanks, that makes sense. I'll try it and let you know how it goes.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Hi", "feeling", "this", "on", "top", "of", "that", "Any", "also", "asking", "with", "other", "one", "Thanks", "let", "know", "how", "goes"]
        exercises:
          - {content_key: "en.b1.unit16.lesson03.exercise01.comprehend_problem", type: "reading_comprehension", tested_text: "leading two projects, and my evening class is on top of that", prompt: {target_blocks: [{text: "What problem does Daniel describe to Leila?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson03.exercise02.comprehend_daniels_response", type: "reading_comprehension", tested_text: "that makes sense. I'll try it", prompt: {target_blocks: [{text: "How does Daniel respond to Leila's advice?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson03.exercise03.recognize_deadline", type: "multiple_choice", tested_text: "deadline", prompt: {target_blocks: [{text: "Which word means the date by which something must be finished?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson03.exercise04.order_that_makes_sense", type: "word_order", tested_text: "That makes sense I'll try it", prompt: {target_blocks: []}, word_bank: ["makes", "sense", "I'll", "try", "it", "That"]}
          - {content_key: "en.b1.unit16.lesson03.exercise05.write_ask_mia_help", type: "writing_prompt", tested_text: "How about asking Mia to help with the other one?", prompt: {target_blocks: [{text: "Write a soft suggestion asking whether Mia could help with the other one, starting with 'How about'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit16.lesson04.the_advice_dialogue"
        title: "You should prioritize the closer deadline"
        spine_outcome_id: "universal.b1.social.give_advice_and_make_suggestions"
        teaching:
          - {content_key: "en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects", kind: "dialogue", target: {text: "I'm a little overwhelmed. I'm leading two projects, and I still have my evening class three times a week.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["little", "leading", "still", "have", "my", "evening", "class", "three", "times", "week"], media_asset_key: "en.b1.audio.dialogue.advice.01"}
          - {content_key: "en.b1.unit16.lesson04.teach.a_talk_to_manager", kind: "dialogue", target: {text: "If I were you, I would talk to your manager about the workload.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["about"]}
          - {content_key: "en.b1.unit16.lesson04.teach.q_dont_want_to_seem", kind: "dialogue", target: {text: "That's a good idea, but I don't want to seem like I can't handle it.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That's", "good", "idea", "but", "don't", "want", "seem", "like", "can't", "handle"]}
          - {content_key: "en.b1.unit16.lesson04.teach.a_prioritize_and_how_about", kind: "dialogue", target: {text: "You should prioritize the project with the closer deadline first. How about asking a colleague to help with the other one?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["first"]}
          - {content_key: "en.b1.unit16.lesson04.teach.q_ask_mia_this_week", kind: "dialogue", target: {text: "I like that. I'll ask Mia if she has time this week.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["like", "that", "ask", "if", "she", "has", "time", "this"]}
          - {content_key: "en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan", kind: "dialogue", target: {text: "That sounds like a solid plan.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["sounds", "solid", "plan"]}
        exercises:
          - {content_key: "en.b1.unit16.lesson04.exercise01.listen_overwhelmed_two_projects", type: "dialogue_comprehension", tested_text: "leading two projects, and I still have my evening class three times a week", media_asset_key: "en.b1.audio.dialogue.advice.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit16.lesson04.exercise02.listen_talk_to_manager", type: "listen_select", tested_text: "talk to your manager about the workload", media_asset_key: "en.b1.audio.dialogue.advice.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit16.lesson04.exercise03.choose_leilas_second_suggestion", type: "multiple_choice", tested_text: "How about asking a colleague to help with the other one?", prompt: {target_blocks: [{text: "What does Leila suggest after telling Daniel to prioritize his closer deadline?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit16.lesson04.exercise04.order_ask_mia_this_week", type: "word_order", tested_text: "I'll ask Mia if she has time this week", prompt: {target_blocks: []}, word_bank: ["ask", "Mia", "if", "she", "has", "time", "this", "week", "I'll"]}
          - content_key: "en.b1.unit16.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I like that. I'll ask Mia if she has time this week."
            prompt: {target_blocks: [{text: "You should prioritize the project with the closer deadline first. How about asking a colleague to help with the other one?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit16.lesson04.exercise06.speak_advice_dialogue"
            type: "speak_response"
            tested_text: "If I were you, I would talk to your manager about the workload."
            prompt: {target_blocks: [{text: "I'm a little overwhelmed. I'm leading two projects, and I still have my evening class three times a week.", language_code: "en", direction: "ltr"}]}
