          - {content_key: "en.b2.unit05.lesson03.exercise03_match_audience", type: "matching_pairs", tested_text: "casual professional formal appropriate stiff register", prompt: {target_blocks: [{text: "Match each text feature to the correct audience or judgement.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "friend version", right: "Can you move it to Friday?"}, {left: "colleague version", right: "Could we move the appointment to Friday if that still works for you?"}, {left: "clinic version", right: "I would be grateful if you could confirm whether my appointment can be moved to Friday."}, {left: "too formal for a close friend", right: "stiff"}, {left: "fits the audience", right: "appropriate"}, {left: "changes across the three texts", right: "register"}]}
          - content_key: "en.b2.unit05.lesson03.exercise04_write_same_content"
