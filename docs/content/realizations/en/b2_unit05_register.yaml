    language: "en"
    text: "Nina: I need to ask about moving my appointment. Can I write, can you move it? Oscar: To a friend, yes. To the clinic, that sounds too casual. Nina: What would you write to a colleague? Oscar: I would write, could we move the appointment to Friday if that still works for you? Nina: And to the clinic? Oscar: I would write, I would be grateful if you could confirm whether my appointment can be moved to Friday. Nina: Same message, different register. Oscar: Exactly. The content stays the same, but the level of formality changes."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

