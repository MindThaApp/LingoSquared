            prompt: {target_blocks: [{text: "Write the professional colleague version exactly: 'Could we move the appointment to Friday if that still works for you?'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "Could we move the appointment to Friday if that still works for you?", status: "correct"}
              - {value: "Could we move the appointment to Friday, if that still works for you?", status: "correct"}
          - content_key: "en.b2.unit05.lesson02.exercise05_write_formal_request"
            type: "writing_prompt"
            tested_text: "I would be grateful if you could confirm whether my appointment can be moved to Friday."
            prompt: {target_blocks: [{text: "Write the formal institution version exactly: 'I would be grateful if you could confirm whether my appointment can be moved to Friday.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday.", status: "correct"}
              - {value: "I would be grateful if you could confirm whether my appointment can be moved to Friday", status: "correct"}

