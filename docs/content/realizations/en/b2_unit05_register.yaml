          - {content_key: "en.b2.unit05.lesson02.teach.casual_request", kind: "phrase", target: {text: "Can you move it to Friday?", language_code: "en", direction: "ltr"}, introduced_tokens: ["move", "Friday"]}
          - {content_key: "en.b2.unit05.lesson02.teach.professional_request", kind: "phrase", target: {text: "Could we move the appointment to Friday if that still works for you?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Could", "works"]}
          - {content_key: "en.b2.unit05.lesson02.teach.to_whom", kind: "phrase", target: {text: "To whom it may concern", language_code: "en", direction: "ltr"}, introduced_tokens: ["To", "whom", "concern"], media_asset_key: "en.b2.audio.register.phrase.to_whom_it_may_concern.01"}
          - {content_key: "en.b2.unit05.lesson02.teach.grammar_register_shift", kind: "grammar_note", target: {text: "Keep the content the same when you shift register. Casual English can use direct questions. Professional English often uses could. Formal English often uses I would be grateful if you could.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Keep", "content", "same", "shift", "English", "direct", "questions"]}
        exercises:
          - {content_key: "en.b2.unit05.lesson02.exercise01_choose_formal", type: "multiple_choice", tested_text: "I would be grateful if you could confirm whether my appointment can be moved.", prompt: {target_blocks: [{text: "Which sentence is the formal version for an institution?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit05.lesson02.exercise02_choose_casual", type: "multiple_choice", tested_text: "Can you move it to Friday?", prompt: {target_blocks: [{text: "Which sentence is the casual version for a friend?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit05.lesson02.exercise03_order_formal_request", type: "word_order", tested_text: "I would be grateful if you could confirm whether my appointment can be moved", prompt: {target_blocks: []}, word_bank: ["I", "would", "be", "grateful", "if", "you", "could", "confirm", "whether", "my", "appointment", "can", "be", "moved"]}
          - content_key: "en.b2.unit05.lesson02.exercise04_reply_professional"
