          - {content_key: "en.b2.unit05.lesson03.teach.appropriate", kind: "vocabulary", target: {text: "appropriate", language_code: "en", direction: "ltr"}, introduced_tokens: ["appropriate"], example: {text: "An appropriate message fits the audience.", language_code: "en", direction: "ltr"}}
