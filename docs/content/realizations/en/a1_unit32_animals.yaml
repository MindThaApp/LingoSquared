course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Pet ownership uses simple present tense with have/has (I have a dog) and the core question Do you have any pets?"

media_assets:
  - {content_key: "en.a1.audio.animals.pets.cat.01", language: "en", text: "cat", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.animals.question.01", language: "en", text: "Do you have any pets?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.animals.01"
    language: "en"
    text: "Daniel: Mia, do you have any pets? Mia: Yes, I have a cat. Her name is Luna. Daniel: That's nice! Does she like to play? Mia: Yes, she loves to play with a ball. What about you? Daniel: I have a small fish, but I want a dog."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit32.animals"
    title: "Talking about pets and animals"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.animals.describe_pets_animals"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit32.lesson01.pet_vocabulary"
        title: "Pets"
        spine_outcome_id: "universal.a1.animals.describe_pets_animals"
        teaching:
          - {content_key: "en.a1.unit32.lesson01.teach.dog", kind: "vocabulary", target: {text: "dog", language_code: "en", direction: "ltr"}, introduced_tokens: ["dog", "I", "have", "a"], example: {text: "I have a dog.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit32.lesson01.teach.cat", kind: "vocabulary", target: {text: "cat", language_code: "en", direction: "ltr"}, introduced_tokens: ["cat", "My", "sister's"], example: {text: "My sister's cat is gray.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit32.lesson01.teach.fish", kind: "vocabulary", target: {text: "fish", language_code: "en", direction: "ltr"}, introduced_tokens: ["fish", "has"], example: {text: "He has a fish.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit32.lesson01.teach.bird", kind: "vocabulary", target: {text: "bird", language_code: "en", direction: "ltr"}, introduced_tokens: ["bird", "We"], example: {text: "We have a bird.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit32.lesson01.teach.pet", kind: "vocabulary", target: {text: "pet", language_code: "en", direction: "ltr"}, introduced_tokens: ["pet", "pets", "any", "Do", "you"], example: {text: "Do you have any pets?", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit32.lesson01.exercise01.listen_animal", type: "listen_select", tested_text: "cat", media_asset_key: "en.a1.audio.animals.pets.cat.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit32.lesson01.exercise02.choose_swims_meaning", type: "multiple_choice", tested_text: "fish", prompt: {target_blocks: [{text: "Which animal usually lives in water?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson01.exercise03.match_animals", type: "matching_pairs", tested_text: "dog cat fish bird pet", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "dog", right: "the pet you walk"}, {left: "cat", right: "says meow"}, {left: "fish", right: "lives in water"}, {left: "bird", right: "can fly and sing"}, {left: "pet", right: "dog or cat"}]}
          - {content_key: "en.a1.unit32.lesson01.exercise04.order_dog_sentence", type: "word_order", tested_text: "I have a dog.", word_bank: ["I", "have", "a", "dog."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson01.exercise05.write_pet_word", type: "writing_prompt", tested_text: "bird", prompt: {target_blocks: [{text: "Write the word for an animal that can fly and sing.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit32.lesson02.describing_pets"
        title: "What your pet is like"
        spine_outcome_id: "universal.a1.animals.describe_pets_animals"
        teaching:
          - {content_key: "en.a1.unit32.lesson02.teach.name_is", kind: "phrase", target: {text: "Her name is Luna.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Her", "name", "is", "Luna."]}
          - {content_key: "en.a1.unit32.lesson02.teach.play", kind: "vocabulary", target: {text: "play", language_code: "en", direction: "ltr"}, introduced_tokens: ["play", "likes", "to"], example: {text: "My dog likes to play.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit32.lesson02.teach.walk", kind: "vocabulary", target: {text: "walk", language_code: "en", direction: "ltr"}, introduced_tokens: ["walk", "every", "day"], example: {text: "I walk my dog every day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit32.lesson02.teach.friendly", kind: "vocabulary", target: {text: "friendly", language_code: "en", direction: "ltr"}, introduced_tokens: ["friendly"], example: {text: "Her cat is very friendly.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit32.lesson02.teach.small", kind: "vocabulary", target: {text: "small", language_code: "en", direction: "ltr"}, introduced_tokens: ["small"], example: {text: "The fish is small.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit32.lesson02.exercise01.listen_question", type: "listen_select", tested_text: "Do you have any pets?", media_asset_key: "en.a1.audio.animals.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit32.lesson02.exercise02.choose_friendly_meaning", type: "multiple_choice", tested_text: "friendly", prompt: {target_blocks: [{text: "Which word means an animal that is nice to people?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson02.exercise03.choose_walk_meaning", type: "multiple_choice", tested_text: "walk", prompt: {target_blocks: [{text: "Which word means taking your dog outside for exercise?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson02.exercise04.order_play_sentence", type: "word_order", tested_text: "My dog likes to play.", word_bank: ["My", "dog", "likes", "to", "play."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson02.exercise05.translate_walk_dog", type: "translation", tested_text: "I walk my dog every day.", prompt: {target_blocks: [{text: "Translate: \"I walk my dog every day.\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit32.lesson03.dialogue_mias_cat"
        title: "Dialogue: Mia's cat"
        spine_outcome_id: "universal.a1.animals.describe_pets_animals"
        teaching:
          - {content_key: "en.a1.unit32.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Mia, do you have any pets?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Mia,", "do"], media_asset_key: "en.a1.audio.dialogue.animals.01"}
          - {content_key: "en.a1.unit32.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Yes, I have a cat. Her name is Luna.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Yes,", "Luna."]}
          - {content_key: "en.a1.unit32.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "That's nice! Does she like to play?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That's", "nice!", "Does", "she"]}
          - {content_key: "en.a1.unit32.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Yes, she loves to play with a ball. What about you?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["loves", "with", "ball.", "What", "about"]}
          - {content_key: "en.a1.unit32.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "I have a small fish, but I want a dog.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["want"]}
        exercises:
          - {content_key: "en.a1.unit32.lesson03.exercise01.comprehension_cat_name", type: "multiple_choice", tested_text: "Luna", prompt: {target_blocks: [{text: "According to the dialogue, what is Mia's cat's name?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson03.exercise02.comprehension_daniel_wants", type: "multiple_choice", tested_text: "a dog", prompt: {target_blocks: [{text: "According to the dialogue, what does Daniel want?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson03.exercise03.listen_dialogue_toy", type: "listen_select", tested_text: "ball", media_asset_key: "en.a1.audio.dialogue.animals.01", prompt: {target_blocks: [{text: "According to the dialogue, what does Luna like to play with?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson03.exercise04.respond_own_pet", type: "speak_response", tested_text: "I have a dog", accepted_answers: ["I have a dog", "I have a dog.", "I have a cat", "I have a cat.", "I have a fish", "I have a fish.", "I have a bird", "I have a bird.", "I don't have any pets", "I don't have any pets.", "I do not have any pets", "I do not have any pets."], prompt: {target_blocks: [{text: "Say whether you have a pet, and what kind.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit32.lesson04.two_pet_owners"
        title: "Reading: Two pet owners"
        spine_outcome_id: "universal.a1.animals.describe_pets_animals"
        teaching:
          - {content_key: "en.a1.unit32.lesson04.teach.reading_passage", kind: "reading", target: {text: "Leila has a dog named Max. He is big and very friendly. She walks him every morning. Daniel doesn't have a dog, but he has a small fish. The fish doesn't need walks, but Daniel still likes to watch it swim.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Leila", "named", "Max.", "and", "big", "very", "morning.", "doesn't", "need", "walks,", "still", "watch", "it", "swim."]}
        exercises:
          - {content_key: "en.a1.unit32.lesson04.exercise01.reading_max_size", type: "multiple_choice", tested_text: "big and very friendly", prompt: {target_blocks: [{text: "According to the reading, what is Max like?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson04.exercise02.reading_who_walks_dog", type: "multiple_choice", tested_text: "Leila", prompt: {target_blocks: [{text: "According to the reading, who walks their dog every morning?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson04.exercise03.reading_daniels_pet", type: "multiple_choice", tested_text: "a fish", prompt: {target_blocks: [{text: "According to the reading, what pet does Daniel have?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit32.lesson04.exercise04.write_own_pet_sentence", type: "writing_prompt", tested_text: "have", prompt: {target_blocks: [{text: "Write one sentence about a pet you have or want, using \"I have\" or \"I want\".", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I have a dog", "I have a dog.", "I have a cat", "I have a cat.", "I have a fish", "I have a fish.", "I have a bird", "I have a bird.", "I want a dog", "I want a dog.", "I want a cat", "I want a cat."]}
