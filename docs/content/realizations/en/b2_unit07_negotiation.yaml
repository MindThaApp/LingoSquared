  - {content_key: "en.b2.audio.negotiation.sentence.01", language: "en", text: "I can agree to the earlier deadline on condition that the scope is reduced.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b2.audio.dialogue.negotiation.01"
    language: "en"
    text: "Priya: We can deliver the report by Thursday if the scope stays as planned. Marcus: Thursday is too late for the client. Can you deliver it by Tuesday? Priya: I cannot agree to Tuesday with the full scope. That would risk the quality. Marcus: What would make Tuesday possible? Priya: I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Marcus: I can accept that if the full appendix follows next week. Priya: Agreed. Tuesday for the summary and charts, and next week for the appendix."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

units:
  - content_key: "en.b2.unit07.negotiation"
    title: "On condition that the scope is reduced"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b2.negotiation.negotiate_and_resolve_disagreement"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b2.unit07.lesson01_terms_and_concessions"
        title: "Terms, refusals, and concessions"
        spine_outcome_id: "universal.b2.negotiation.negotiate_and_resolve_disagreement"
        teaching:
          - {content_key: "en.b2.unit07.lesson01.teach.term", kind: "vocabulary", target: {text: "term", language_code: "en", direction: "ltr"}, introduced_tokens: ["term", "agreement"], example: {text: "A term is one part of an agreement.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit07.lesson01.teach.proposal", kind: "vocabulary", target: {text: "proposal", language_code: "en", direction: "ltr"}, introduced_tokens: ["proposal"], example: {text: "A proposal suggests possible terms.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit07.lesson01.teach.refusal", kind: "vocabulary", target: {text: "refusal", language_code: "en", direction: "ltr"}, introduced_tokens: ["refusal"], example: {text: "A refusal says that a term is not acceptable.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit07.lesson01.teach.concession", kind: "vocabulary", target: {text: "concession", language_code: "en", direction: "ltr"}, introduced_tokens: ["concession"], example: {text: "A concession gives up part of a position.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit07.lesson01.teach.scope", kind: "vocabulary", target: {text: "scope", language_code: "en", direction: "ltr"}, introduced_tokens: ["scope"], example: {text: "The scope is the amount of work included.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit07.lesson01.teach.condition", kind: "vocabulary", target: {text: "condition", language_code: "en", direction: "ltr"}, introduced_tokens: [], example: {text: "A condition must be met before the agreement works.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b2.unit07.lesson01.exercise01_choose_concession", type: "multiple_choice", tested_text: "concession", prompt: {target_blocks: [{text: "Which word means giving up part of your position in a negotiation?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson01.exercise02_choose_scope", type: "multiple_choice", tested_text: "scope", prompt: {target_blocks: [{text: "Which word means the amount of work included?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson01.exercise03_match_terms", type: "matching_pairs", tested_text: "term proposal refusal concession scope condition", prompt: {target_blocks: [{text: "Match each negotiation word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "one part of an agreement", right: "term"}, {left: "suggested terms", right: "proposal"}, {left: "saying a term is not acceptable", right: "refusal"}, {left: "giving up part of a position", right: "concession"}, {left: "amount of work included", right: "scope"}, {left: "something that must be met", right: "condition"}]}
          - {content_key: "en.b2.unit07.lesson01.exercise04_write_refusal", type: "writing_prompt", tested_text: "refusal", prompt: {target_blocks: [{text: "Write the word that means saying a term is not acceptable.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson01.exercise05_write_proposal", type: "writing_prompt", tested_text: "proposal", prompt: {target_blocks: [{text: "Write the word that means suggested terms.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b2.unit07.lesson02_conditional_terms"
        title: "I can agree on condition that..."
        spine_outcome_id: "universal.b2.negotiation.negotiate_and_resolve_disagreement"
        teaching:
          - {content_key: "en.b2.unit07.lesson02.teach.condition_deadline", kind: "phrase", target: {text: "I can agree to the earlier deadline on condition that the scope is reduced.", language_code: "en", direction: "ltr"}, introduced_tokens: ["earlier", "deadline", "reduced"], media_asset_key: "en.b2.audio.negotiation.sentence.01"}
          - {content_key: "en.b2.unit07.lesson02.teach.cannot_agree", kind: "phrase", target: {text: "I cannot agree to Tuesday with the full scope.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Tuesday", "full"]}
          - {content_key: "en.b2.unit07.lesson02.teach.accept_if", kind: "phrase", target: {text: "I can accept that if the full appendix follows next week.", language_code: "en", direction: "ltr"}, introduced_tokens: ["if", "appendix", "follows", "week"]}
          - {content_key: "en.b2.unit07.lesson02.teach.grammar_concession", kind: "grammar_note", target: {text: "Use I cannot agree to push back clearly. Use I can agree on condition that to offer a conditional concession.", language_code: "en", direction: "ltr"}, introduced_tokens: ["push", "back", "clearly", "offer", "conditional"]}
        exercises:
          - {content_key: "en.b2.unit07.lesson02.exercise01_choose_refusal", type: "multiple_choice", tested_text: "I cannot agree to Tuesday with the full scope.", prompt: {target_blocks: [{text: "Which sentence refuses an unacceptable term clearly?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson02.exercise02_choose_condition", type: "multiple_choice", tested_text: "I can agree to the earlier deadline on condition that the scope is reduced.", prompt: {target_blocks: [{text: "Which sentence offers a conditional concession?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson02.exercise03_order_condition", type: "word_order", tested_text: "I can agree to the earlier deadline on condition that the scope is reduced", prompt: {target_blocks: []}, word_bank: ["I", "can", "agree", "to", "the", "earlier", "deadline", "on", "condition", "that", "the", "scope", "is", "reduced"]}
          - content_key: "en.b2.unit07.lesson02.exercise04_reply_refusal"
            type: "dialogue_response"
            tested_text: "I cannot agree to Tuesday with the full scope."
            prompt: {target_blocks: [{text: "Write exactly this refusal: 'I cannot agree to Tuesday with the full scope.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "I cannot agree to Tuesday with the full scope.", status: "correct"}
              - {value: "I cannot agree to Tuesday with the full scope", status: "correct"}
              - {value: "I can't agree to Tuesday with the full scope.", status: "correct"}
              - {value: "I can't agree to Tuesday with the full scope", status: "correct"}
          - content_key: "en.b2.unit07.lesson02.exercise05_write_conditional"
            type: "writing_prompt"
            tested_text: "I can agree to the earlier deadline on condition that the scope is reduced."
            prompt: {target_blocks: [{text: "Write exactly this conditional concession: 'I can agree to the earlier deadline on condition that the scope is reduced.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "I can agree to the earlier deadline on condition that the scope is reduced.", status: "correct"}
              - {value: "I can agree to the earlier deadline on condition that the scope is reduced", status: "correct"}

      - content_key: "en.b2.unit07.lesson03.reading_revised_terms"
        title: "Reading: what was agreed?"
        spine_outcome_id: "universal.b2.negotiation.negotiate_and_resolve_disagreement"
        teaching:
          - {content_key: "en.b2.unit07.lesson03.teach.executive_summary", kind: "vocabulary", target: {text: "executive summary", language_code: "en", direction: "ltr"}, introduced_tokens: ["executive", "summary"], example: {text: "An executive summary gives the main points of a report.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit07.lesson03.teach.charts", kind: "vocabulary", target: {text: "charts", language_code: "en", direction: "ltr"}, introduced_tokens: ["charts"], example: {text: "Charts show information visually.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b2.unit07.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Priya first proposed Thursday for the full report. Marcus pushed back because the client needed something earlier. Priya refused Tuesday with the full scope because it would risk quality. She then offered a conditional concession: Tuesday was possible if the scope was reduced to the executive summary and the charts. Marcus accepted that condition, but added one term: the full appendix should follow next week. The agreed outcome was Tuesday for the summary and charts, and next week for the appendix.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Priya", "first", "proposed", "Thursday", "Marcus", "client", "needed", "something", "quality", "She", "then", "offered", "possible", "outcome", "agreed"]
        exercises:
          - {content_key: "en.b2.unit07.lesson03.exercise01_choose_refused_term", type: "multiple_choice", tested_text: "Tuesday with the full scope", prompt: {target_blocks: [{text: "Which term did Priya refuse?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson03.exercise02_choose_agreed_outcome", type: "multiple_choice", tested_text: "Tuesday for the summary and charts, and next week for the appendix", prompt: {target_blocks: [{text: "Which outcome was agreed?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson03.exercise03_match_negotiation_roles", type: "matching_pairs", tested_text: "proposal refusal concession condition agreement scope", prompt: {target_blocks: [{text: "Match each negotiation role to the term from the reading.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "Priya's first proposal", right: "Thursday for the full report"}, {left: "Marcus's requested deadline", right: "Tuesday"}, {left: "Priya's refusal", right: "not Tuesday with the full scope"}, {left: "Priya's condition", right: "scope reduced to the summary and charts"}, {left: "Marcus's added term", right: "the appendix follows next week"}, {left: "final agreement", right: "Tuesday for the summary and charts"}]}
          - content_key: "en.b2.unit07.lesson03.exercise04_write_agreed_outcome"
            type: "writing_prompt"
            tested_text: "The agreed outcome was Tuesday for the summary and charts, and next week for the appendix."
            prompt: {target_blocks: [{text: "Write exactly: 'The agreed outcome was Tuesday for the summary and charts, and next week for the appendix.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "The agreed outcome was Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
              - {value: "The agreed outcome was Tuesday for the summary and charts and next week for the appendix.", status: "correct"}
          - content_key: "en.b2.unit07.lesson03.exercise05_write_open_condition"
            type: "writing_prompt"
            tested_text: "Tuesday is possible if the scope is reduced to the executive summary and the charts."
            prompt: {target_blocks: [{text: "Write exactly: 'Tuesday is possible if the scope is reduced to the executive summary and the charts.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts.", status: "correct"}
              - {value: "Tuesday is possible if the scope is reduced to the executive summary and the charts", status: "correct"}

      - content_key: "en.b2.unit07.lesson04.the_negotiation_dialogue"
        title: "Agreed, with a condition"
        spine_outcome_id: "universal.b2.negotiation.negotiate_and_resolve_disagreement"
        teaching:
          - {content_key: "en.b2.unit07.lesson04.teach.q_thursday", kind: "dialogue", target: {text: "We can deliver the report by Thursday if the scope stays as planned.", language_code: "en", direction: "ltr", speaker: "Priya"}, introduced_tokens: ["deliver", "report", "stays", "planned"], media_asset_key: "en.b2.audio.dialogue.negotiation.01"}
          - {content_key: "en.b2.unit07.lesson04.teach.a_tuesday", kind: "dialogue", target: {text: "Thursday is too late for the client. Can you deliver it by Tuesday?", language_code: "en", direction: "ltr", speaker: "Marcus"}, introduced_tokens: ["late"]}
          - {content_key: "en.b2.unit07.lesson04.teach.q_cannot_tuesday", kind: "dialogue", target: {text: "I cannot agree to Tuesday with the full scope. That would risk the quality.", language_code: "en", direction: "ltr", speaker: "Priya"}, introduced_tokens: ["risk"]}
          - {content_key: "en.b2.unit07.lesson04.teach.a_what_possible", kind: "dialogue", target: {text: "What would make Tuesday possible?", language_code: "en", direction: "ltr", speaker: "Marcus"}, introduced_tokens: ["make"]}
          - {content_key: "en.b2.unit07.lesson04.teach.q_condition", kind: "dialogue", target: {text: "I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts.", language_code: "en", direction: "ltr", speaker: "Priya"}, introduced_tokens: []}
          - {content_key: "en.b2.unit07.lesson04.teach.a_accept_appendix", kind: "dialogue", target: {text: "I can accept that if the full appendix follows next week.", language_code: "en", direction: "ltr", speaker: "Marcus"}, introduced_tokens: []}
          - {content_key: "en.b2.unit07.lesson04.teach.q_agreed", kind: "dialogue", target: {text: "Agreed. Tuesday for the summary and charts, and next week for the appendix.", language_code: "en", direction: "ltr", speaker: "Priya"}, introduced_tokens: ["Agreed"]}
        exercises:
          - {content_key: "en.b2.unit07.lesson04.exercise01_choose_refusal", type: "multiple_choice", tested_text: "I cannot agree to Tuesday with the full scope.", media_asset_key: "en.b2.audio.dialogue.negotiation.01", prompt: {target_blocks: [{text: "Which sentence is Priya's refusal?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b2.unit07.lesson04.exercise02_listen_condition", type: "listen_select", tested_text: "the scope is reduced to the executive summary and the charts", media_asset_key: "en.b2.audio.dialogue.negotiation.01", prompt: {target_blocks: []}}
          - {content_key: "en.b2.unit07.lesson04.exercise03_order_agreed", type: "word_order", tested_text: "Tuesday for the summary and charts and next week for the appendix", prompt: {target_blocks: []}, word_bank: ["Tuesday", "for", "the", "summary", "and", "charts", "and", "next", "week", "for", "the", "appendix"]}
          - content_key: "en.b2.unit07.lesson04.exercise04_reply_as_priya"
            type: "dialogue_response"
            tested_text: "I cannot agree to Tuesday with the full scope. That would risk the quality."
            prompt: {target_blocks: [{text: "Reply with Priya's refusal and reason: 'I cannot agree to Tuesday with the full scope. That would risk the quality.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "I cannot agree to Tuesday with the full scope. That would risk the quality.", status: "correct"}
              - {value: "I can't agree to Tuesday with the full scope. That would risk the quality.", status: "correct"}
          - content_key: "en.b2.unit07.lesson04.exercise05_speak_negotiate"
            type: "speak_response"
            tested_text: "I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix."
            prompt: {target_blocks: [{text: "Negotiate the deadline: refuse Tuesday with the full scope, offer a conditional concession, and reach the final agreement.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b2.unit07.lesson04.exercise06_write_negotiation_reply"
            type: "writing_prompt"
            tested_text: "I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix."
            prompt: {target_blocks: [{text: "Write this complete negotiation reply with a refusal, a conditional concession, and the final agreement: 'I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
              - {value: "I cannot agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
              - {value: "I can't agree to Tuesday with the full scope. I can agree to the earlier deadline on condition that the scope is reduced to the executive summary and the charts. Agreed: Tuesday for the summary and charts, and next week for the appendix.", status: "correct"}
