        title: "Phrases at the bank"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit59.lesson02.teach.i_need_cash", kind: "phrase", target: {text: "I need cash.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "need", "cash"]}
          - {content_key: "en.a1.unit59.lesson02.teach.where_is_the_atm", kind: "phrase", target: {text: "Where is the ATM?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Where", "is", "the", "ATM"]}
          - {content_key: "en.a1.unit59.lesson02.teach.check_my_balance", kind: "phrase", target: {text: "I want to check my balance.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "want", "to", "check", "my", "balance"]}
          - {content_key: "en.a1.unit59.lesson02.teach.can_i_use_this_card", kind: "phrase", target: {text: "Can I use this card?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Can", "use", "this", "card"]}
          - {content_key: "en.a1.unit59.lesson02.teach.enter_your_pin", kind: "phrase", target: {text: "Please enter your PIN.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Please", "enter", "your", "PIN"]}
          - {content_key: "en.a1.unit59.lesson02.teach.atm_outside", kind: "phrase", target: {text: "The ATM is outside.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "outside"]}
        exercises:
          - {content_key: "en.a1.unit59.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "I want to check my balance.", media_asset_key: "en.a1.audio.banking_basics.phrases.i_want_to_check_my_balance.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit59.lesson02.exercise02.choose_atm_question", type: "multiple_choice", tested_text: "Where is the ATM?", prompt: {target_blocks: [{text: "Which phrase asks where the cash machine is?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson02.exercise03.choose_card_question", type: "multiple_choice", tested_text: "Can I use this card?", prompt: {target_blocks: [{text: "Which phrase asks if a card works here?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson02.exercise04.order_atm_sentence", type: "word_order", tested_text: "The ATM is outside.", word_bank: ["The", "ATM", "is", "outside."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson02.exercise05.translate_need_cash", type: "translation", tested_text: "I need cash.", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit59.lesson03.dialogue_at_the_bank"
        title: "Dialogue: At the bank"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hi! Where is the ATM?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Hi"], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "The ATM is outside.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "Can I use this card?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Yes, you can use that card.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["Yes", "you", "can", "that"], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "I want to check my balance.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Please enter your PIN.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "I need cash too.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["too"], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line8", kind: "dialogue", target: {text: "You can take out twenty dollars.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["You", "take", "out", "twenty", "dollars"], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
          - {content_key: "en.a1.unit59.lesson03.teach.dialogue_line9", kind: "dialogue", target: {text: "Thank you! This is helpful.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Thank", "helpful"], media_asset_key: "en.a1.audio.dialogue.banking_basics.01"}
        exercises:
          - {content_key: "en.a1.unit59.lesson03.exercise01.comprehension_atm_place", type: "multiple_choice", tested_text: "outside", prompt: {target_blocks: [{text: "According to the dialogue, where is the ATM?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson03.exercise02.comprehension_cash_amount", type: "multiple_choice", tested_text: "twenty dollars", prompt: {target_blocks: [{text: "According to the dialogue, how much cash can Leila take out?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson03.exercise03.listen_dialogue_pin", type: "listen_select", tested_text: "Please enter your PIN.", media_asset_key: "en.a1.audio.dialogue.banking_basics.01", prompt: {target_blocks: [{text: "Which sentence does the clerk say to Mia?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson03.exercise04.respond_own_bank_statement", type: "speak_response", tested_text: "The ATM is outside.", accepted_answers: ["The ATM is outside", "The ATM is outside.", "I want to check my balance", "I want to check my balance.", "Please enter your PIN", "Please enter your PIN.", "I need cash", "I need cash.", "I need some cash", "I'd like to check my balance", "I would like to check my balance", "It's outside", "The ATM is outside the bank"], prompt: {target_blocks: [{text: "Say where the ATM is, ask to check your balance, or say you need cash.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit59.lesson04.bank_notice"
        title: "Reading: A bank notice"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit59.lesson04.teach.bank_notice", kind: "reading", target: {text: "Bank notice: Open 9:00 to 4:00. ATM outside. Cash limit today: $100. Cards accepted.", language_code: "en", direction: "ltr"}, introduced_tokens: ["notice", "Open", "9:00", "to", "4:00", "limit", "today", "$100", "Cards", "accepted"]}
          - {content_key: "en.a1.unit59.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Quick Stop at the Bank: One morning, Mia and Leila went to the bank together. Mia wanted to check her balance, and Leila needed cash. The clerk said the ATM was outside. Leila used her card and took out twenty dollars. Mia entered her PIN and checked her balance. Before they left, they read the notice. The bank was open from 9:00 to 4:00, and the cash limit was $100. Mia said the visit was easy.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Quick", "Stop", "at", "One", "morning", "Mia", "and", "Leila", "went", "together", "wanted", "her", "needed", "clerk", "said", "was", "used", "took", "entered", "checked", "Before", "they", "left", "read", "from", "visit", "easy"]}
        exercises:
          - {content_key: "en.a1.unit59.lesson04.exercise01.notice_opening_time", type: "multiple_choice", tested_text: "9:00", prompt: {target_blocks: [{text: "According to the notice, what time does the bank open?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson04.exercise02.notice_cash_limit", type: "multiple_choice", tested_text: "$100", prompt: {target_blocks: [{text: "According to the notice, what is the cash limit today?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson04.exercise03.reading_cash_amount", type: "multiple_choice", tested_text: "twenty dollars", prompt: {target_blocks: [{text: "According to the reading, how much cash did Leila take out?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson04.exercise04.reading_who_checked_balance", type: "multiple_choice", tested_text: "Mia", prompt: {target_blocks: [{text: "According to the reading, who checked her balance?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson04.exercise05.write_own_bank_message", type: "writing_prompt", tested_text: "The ATM is outside. The cash limit is $100.", prompt: {target_blocks: [{text: "Write a short message: say where the ATM is, and say the cash limit.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["The ATM is outside. The cash limit is $100.", "The ATM is outside, and the cash limit is $100.", "The ATM is outside and the cash limit is $100.", "The ATM is outside. The limit is $100.", "The ATM is outside, and the limit is $100.", "The ATM is outside. The cash limit today is $100.", "The ATM is outside, and the cash limit today is $100.", "The ATM is outside. The cash limit is 100 dollars.", "The ATM is outside, and the cash limit is 100 dollars.", "The ATM is outside. The cash limit is one hundred dollars.", "The ATM is outside, and the cash limit is one hundred dollars."]}
