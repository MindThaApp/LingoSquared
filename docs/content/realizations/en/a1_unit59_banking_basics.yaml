units:
  - content_key: "en.a1.unit59.banking_basics"
    title: "Banking basics"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.money.handle_basic_money_matters"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit59.lesson01.banking_words"
        title: "Words for banking"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit59.lesson01.teach.bank", kind: "vocabulary", target: {text: "bank", language_code: "en", direction: "ltr"}, introduced_tokens: ["bank", "The", "is", "near", "here"], example: {text: "The bank is near here.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit59.lesson01.teach.account", kind: "vocabulary", target: {text: "account", language_code: "en", direction: "ltr"}, introduced_tokens: ["account", "I", "have", "a"], example: {text: "I have a bank account.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit59.lesson01.teach.card", kind: "vocabulary", target: {text: "card", language_code: "en", direction: "ltr"}, introduced_tokens: ["card", "This", "works"], example: {text: "This card works here.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit59.lesson01.teach.cash", kind: "vocabulary", target: {text: "cash", language_code: "en", direction: "ltr"}, introduced_tokens: ["cash", "need"], example: {text: "I need cash.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit59.lesson01.teach.atm", kind: "vocabulary", target: {text: "ATM", language_code: "en", direction: "ltr"}, introduced_tokens: ["ATM", "outside"], example: {text: "The ATM is outside.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit59.lesson01.teach.balance", kind: "vocabulary", target: {text: "balance", language_code: "en", direction: "ltr"}, introduced_tokens: ["balance", "want", "to", "check", "my"], example: {text: "I want to check my balance.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit59.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "cash", media_asset_key: "en.a1.audio.banking_basics.words.cash.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit59.lesson01.exercise02.choose_atm_meaning", type: "multiple_choice", tested_text: "ATM", prompt: {target_blocks: [{text: "Which word means a machine where you can get cash?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson01.exercise03.match_banking_words", type: "matching_pairs", tested_text: "bank account card cash ATM balance", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "bank", right: "a place that keeps your money safe"}, {left: "account", right: "a record of your money at a bank"}, {left: "card", right: "a small plastic item you use to pay"}, {left: "cash", right: "paper money and coins"}, {left: "ATM", right: "a machine where you can get cash"}, {left: "balance", right: "the money in your account"}]}
          - {content_key: "en.a1.unit59.lesson01.exercise04.order_cash_sentence", type: "word_order", tested_text: "I need cash.", word_bank: ["I", "need", "cash."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit59.lesson01.exercise05.write_balance", type: "writing_prompt", tested_text: "balance", prompt: {target_blocks: [{text: "Write the word for the money in your account.", language_code: "en", direction: "ltr"}]}}

