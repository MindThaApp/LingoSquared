status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    2026-07-12 fresh-context review (Codex). Verified: unreal present
    conditionals (if + past/were, would + base), unreal past conditionals (if
    + past perfect, would have + past participle), would rather, and softened
    hypothetical questions are correct and natural B1 English; Leila's design
    course/money-saving facts continue unit10 consistently. Realization-only
    structural audit passed: YAML parses cleanly, spine reference resolves,
    content_keys are unique, text-block directions are correct, no stray YAML
    booleans or learner-facing snake_case leaks, vocabulary examples present,
    media references declared, all word_order items are buildable in sentence
    order, matching_pairs has 6 pairs, and dialogue teaching cards use
    structured target.speaker with no Name:-in-text. Fixed lesson01
    exercise01's listen_select audio from a whole vocabulary-list clip to
    single-target-phrase audio so future distractors are not spoken in the
    same clip. LIMITATION: no X-to-en overlays exist for this unit yet, so
    accepted_answers, contraction/punctuation variants, and overlay-authored
    listen distractors could not be machine-checked.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: unreal present and past hypotheticals with would, would have, and if + past/past perfect, plus softened conditional requests and preferences."

media_assets:
  - {content_key: "en.b1.audio.unreal_hypotheticals.phrase.would_rather.01", language: "en", text: "would rather", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.unreal_hypotheticals.sentence.01", language: "en", text: "If I had more time, I would take a design course.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.unreal_hypotheticals.01"
    language: "en"
    text: "Mia: Leila, would you take the design course if it were cheaper? Leila: Definitely. If it were cheaper, I would sign up today. Mia: What if Daniel joined too? Leila: If Daniel joined, I would feel more confident. Mia: I would rather take the weekend class than the evening class. Leila: Me too. If I had known about it sooner, I would have saved more money."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit11.unreal_hypotheticals"
    title: "If it were cheaper, I would sign up"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit11.lesson01.unreal_hypothetical_vocabulary"
        title: "Would, if I were, and regret"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional"
        teaching:
          - {content_key: "en.b1.unit11.lesson01.teach.would", kind: "vocabulary", target: {text: "would", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "would"], example: {text: "I would join if I had more time.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit11.lesson01.teach.would_rather", kind: "vocabulary", target: {text: "would rather", language_code: "en", direction: "ltr"}, introduced_tokens: ["rather"], example: {text: "I would rather take the weekend class.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit11.lesson01.teach.if_i_were", kind: "vocabulary", target: {text: "if I were", language_code: "en", direction: "ltr"}, introduced_tokens: ["if", "were"], example: {text: "If I were free tonight, I would go.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit11.lesson01.teach.opportunity", kind: "vocabulary", target: {text: "opportunity", language_code: "en", direction: "ltr"}, introduced_tokens: ["opportunity"], example: {text: "This course is a good opportunity for Leila.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit11.lesson01.teach.regret", kind: "vocabulary", target: {text: "regret", language_code: "en", direction: "ltr"}, introduced_tokens: ["regret"], example: {text: "She has one regret: she did not save money sooner.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit11.lesson01.teach.take_a_chance", kind: "vocabulary", target: {text: "take a chance", language_code: "en", direction: "ltr"}, introduced_tokens: ["take", "a", "chance"], example: {text: "If the course were cheaper, she would take a chance.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit11.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "would rather", media_asset_key: "en.b1.audio.unreal_hypotheticals.phrase.would_rather.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit11.lesson01.exercise02.choose_opportunity", type: "multiple_choice", tested_text: "opportunity", prompt: {target_blocks: [{text: "Which word means a good chance to do something?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson01.exercise03.choose_regret", type: "multiple_choice", tested_text: "regret", prompt: {target_blocks: [{text: "Which word means sadness about a past choice?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson01.exercise04.match_unreal_words", type: "matching_pairs", tested_text: "would would rather opportunity regret", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "would", right: "marks an imagined result or polite preference"}, {left: "would rather", right: "means would prefer to"}, {left: "opportunity", right: "a good chance to do something"}, {left: "regret", right: "sadness about a past choice"}]}
          - {content_key: "en.b1.unit11.lesson01.exercise05.write_would_rather", type: "writing_prompt", tested_text: "would rather", prompt: {target_blocks: [{text: "Write the phrase that means \"would prefer to\".", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit11.lesson02.unreal_present"
        title: "If I had more time, I would"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional"
        teaching:
          - {content_key: "en.b1.unit11.lesson02.teach.more_time_course", kind: "phrase", target: {text: "If I had more time, I would take a design course.", language_code: "en", direction: "ltr"}, introduced_tokens: ["If", "I", "had", "more", "time", "would", "take", "a", "design", "course"], media_asset_key: "en.b1.audio.unreal_hypotheticals.sentence.01"}
          - {content_key: "en.b1.unit11.lesson02.teach.cheaper_sign_up", kind: "phrase", target: {text: "If it were cheaper, I would sign up today.", language_code: "en", direction: "ltr"}, introduced_tokens: ["it", "were", "cheaper", "sign", "up", "today"]}
          - {content_key: "en.b1.unit11.lesson02.teach.grammar_unreal_present", kind: "grammar_note", target: {text: "Use past tense after if for an unreal present situation: If it were cheaper, I would sign up.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Use", "past", "tense", "after", "unreal", "present", "situation"]}
        exercises:
          - {content_key: "en.b1.unit11.lesson02.exercise01.choose_more_time", type: "multiple_choice", tested_text: "If I had more time, I would take a design course.", prompt: {target_blocks: [{text: "Which sentence imagines a different present situation?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson02.exercise02.choose_cheaper_course", type: "multiple_choice", tested_text: "If it were cheaper, I would sign up today.", prompt: {target_blocks: [{text: "Which sentence imagines what would happen if the course cost less?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson02.exercise03.order_if_more_time", type: "word_order", tested_text: "If I had more time I would take a design course", prompt: {target_blocks: []}, word_bank: ["I", "had", "more", "time", "I", "would", "take", "a", "design", "course", "If"]}
          - {content_key: "en.b1.unit11.lesson02.exercise04.reply_if_more_time", type: "dialogue_response", tested_text: "If I had more time I would take a design course", prompt: {target_blocks: [{text: "What would you do if you had more time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson02.exercise05.write_if_cheaper", type: "writing_prompt", tested_text: "If it were cheaper, I would sign up today.", prompt: {target_blocks: [{text: "Write that if it were cheaper, you would sign up today.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit11.lesson03.reading_a_missed_opportunity"
        title: "Reading: a missed opportunity"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional"
        teaching:
          - {content_key: "en.b1.unit11.lesson03.teach.sooner", kind: "vocabulary", target: {text: "sooner", language_code: "en", direction: "ltr"}, introduced_tokens: ["sooner", "she", "have"], example: {text: "If she had known sooner, she would have saved more money.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit11.lesson03.teach.confident", kind: "vocabulary", target: {text: "confident", language_code: "en", direction: "ltr"}, introduced_tokens: ["confident", "feel"], example: {text: "If Daniel joined, Leila would feel more confident.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit11.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Leila found a design course that she really wants to take. It is useful, but it is expensive. If it were cheaper, she would sign up today. If Daniel joined the class too, she would feel more confident. Her only regret is timing: if she had known about the course sooner, she would have saved more money.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Leila", "found", "really", "wants", "useful", "but", "expensive", "Daniel", "joined", "class", "too", "feel", "only", "timing", "known", "about", "saved", "money"]
        exercises:
          - {content_key: "en.b1.unit11.lesson03.exercise01.comprehend_if_cheaper", type: "reading_comprehension", tested_text: "she would sign up today", prompt: {target_blocks: [{text: "What would Leila do if the course were cheaper?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson03.exercise02.comprehend_if_known_sooner", type: "reading_comprehension", tested_text: "she would have saved more money", prompt: {target_blocks: [{text: "What would Leila have done if she had known about the course sooner?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson03.exercise03.recognize_confident", type: "multiple_choice", tested_text: "confident", prompt: {target_blocks: [{text: "Which word means feeling sure that you can do something well?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson03.exercise04.order_if_known_sooner", type: "word_order", tested_text: "If she had known sooner she would have saved more money", prompt: {target_blocks: []}, word_bank: ["she", "had", "known", "sooner", "she", "would", "have", "saved", "more", "money", "If"]}
          - {content_key: "en.b1.unit11.lesson03.exercise05.write_would_have_saved", type: "writing_prompt", tested_text: "If I had known sooner, I would have saved more money.", prompt: {target_blocks: [{text: "Write that if you had known sooner, you would have saved more money.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit11.lesson04.the_design_course_dialogue"
        title: "Would you take the course?"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional"
        teaching:
          - {content_key: "en.b1.unit11.lesson04.teach.q_take_if_cheaper", kind: "dialogue", target: {text: "Leila, would you take the design course if it were cheaper?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Leila", "would", "you", "take", "the", "design", "course", "if", "it", "were", "cheaper"], media_asset_key: "en.b1.audio.dialogue.unreal_hypotheticals.01"}
          - {content_key: "en.b1.unit11.lesson04.teach.a_sign_up_today", kind: "dialogue", target: {text: "Definitely. If it were cheaper, I would sign up today.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Definitely", "sign", "up", "today"]}
          - {content_key: "en.b1.unit11.lesson04.teach.q_daniel_joined", kind: "dialogue", target: {text: "What if Daniel joined too?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["What", "Daniel", "joined", "too"]}
          - {content_key: "en.b1.unit11.lesson04.teach.a_more_confident", kind: "dialogue", target: {text: "If Daniel joined, I would feel more confident.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["feel", "more", "confident"]}
          - {content_key: "en.b1.unit11.lesson04.teach.q_would_rather_weekend", kind: "dialogue", target: {text: "I would rather take the weekend class than the evening class.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["rather", "weekend", "than", "evening"]}
          - {content_key: "en.b1.unit11.lesson04.teach.a_known_sooner", kind: "dialogue", target: {text: "Me too. If I had known about it sooner, I would have saved more money.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Me", "known", "about", "sooner", "have", "saved", "money"]}
        exercises:
          - {content_key: "en.b1.unit11.lesson04.exercise01.listen_if_cheaper", type: "dialogue_comprehension", tested_text: "I would sign up today", media_asset_key: "en.b1.audio.dialogue.unreal_hypotheticals.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit11.lesson04.exercise02.listen_what_mia_prefers", type: "listen_select", tested_text: "the weekend class", media_asset_key: "en.b1.audio.dialogue.unreal_hypotheticals.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit11.lesson04.exercise03.choose_if_daniel_joined", type: "multiple_choice", tested_text: "I would feel more confident", prompt: {target_blocks: [{text: "How would Leila feel if Daniel joined too?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit11.lesson04.exercise04.order_if_daniel_joined", type: "word_order", tested_text: "If Daniel joined I would feel more confident", prompt: {target_blocks: []}, word_bank: ["Daniel", "joined", "I", "would", "feel", "more", "confident", "If"]}
          - content_key: "en.b1.unit11.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "If it were cheaper I would sign up today"
            prompt: {target_blocks: [{text: "Leila, would you take the design course if it were cheaper?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit11.lesson04.exercise06.speak_unreal_hypothetical_dialogue"
            type: "speak_response"
            tested_text: "If I had known about it sooner I would have saved more money"
            prompt: {target_blocks: [{text: "I would rather take the weekend class than the evening class.", language_code: "en", direction: "ltr"}]}
