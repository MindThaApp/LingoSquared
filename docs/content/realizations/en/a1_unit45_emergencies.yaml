          - {content_key: "en.a1.unit45.lesson01.teach.police", kind: "vocabulary", target: {text: "police", language_code: "en", direction: "ltr"}, introduced_tokens: ["police", "Call", "the"], example: {text: "Call the police!", language_code: "en", direction: "ltr"}}
