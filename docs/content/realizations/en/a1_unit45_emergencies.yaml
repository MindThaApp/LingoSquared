          - {content_key: "en.a1.unit45.lesson02.teach.send_an_ambulance", kind: "phrase", target: {text: "Send an ambulance, please.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Send", "an", "ambulance", "please"]}
          - {content_key: "en.a1.unit45.lesson02.teach.theres_a_fire", kind: "phrase", target: {text: "There's a fire!", language_code: "en", direction: "ltr"}, introduced_tokens: ["There's", "a", "fire"]}
          - {content_key: "en.a1.unit45.lesson02.teach.whats_your_emergency", kind: "phrase", target: {text: "What's your emergency?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What's", "your", "emergency"]}
        exercises:
          - {content_key: "en.a1.unit45.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "There's a fire!", media_asset_key: "en.a1.audio.emergencies.phrases.theres_a_fire.01", prompt: {target_blocks: []}}
