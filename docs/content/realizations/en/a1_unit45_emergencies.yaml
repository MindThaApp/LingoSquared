    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit45.lesson01.emergency_vocabulary"
        title: "Words for emergencies"
        spine_outcome_id: "universal.a1.emergencies.handle_basic_emergency"
        teaching:
          - {content_key: "en.a1.unit45.lesson01.teach.emergency", kind: "vocabulary", target: {text: "emergency", language_code: "en", direction: "ltr"}, introduced_tokens: ["emergency", "This", "is", "an"], example: {text: "This is an emergency!", language_code: "en", direction: "ltr"}}
