          - {content_key: "en.a1.unit45.lesson04.exercise02.reading_use_instead_of_elevator", type: "multiple_choice", tested_text: "the stairs", prompt: {target_blocks: [{text: "According to the notice, what should you use instead of the elevator?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit45.lesson04.exercise03.reading_who_checked_on_them", type: "multiple_choice", tested_text: "Mia", prompt: {target_blocks: [{text: "According to the reading, who came to check on Daniel and Leila afterward?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit45.lesson04.exercise04.write_own_emergency_message", type: "writing_prompt", tested_text: "There's a fire. Send the fire department.", prompt: {target_blocks: [{text: "Write a short message: say there is an emergency and what help you need.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["There's a fire. Send the fire department.", "There's a fire. Send the fire department, please.", "There's a fire, send the fire department.", "There's a fire, and send the fire department.", "I need help. Send an ambulance.", "I need help. Send an ambulance, please.", "I need help, send an ambulance.", "I need help, and send an ambulance.", "There's an emergency. Send the police.", "There's an emergency. Send the police, please.", "There's an emergency, send the police.", "There's an emergency, and send the police."]}
