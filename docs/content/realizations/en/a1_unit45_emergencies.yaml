course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Emergency language stays in simple present/imperative forms with fixed collocations that must be memorized: Call 911!, I need help!, Send the police/an ambulance, please., There's a fire!, What's your emergency? Use \"fire department\" (not \"fire brigade\") and \"911\" (not \"112\" or \"999\"), consistent with this realization's established American register. Keep the register urgent but clear -- short, direct sentences appropriate for a real emergency, not a calm narrative register."

media_assets:
  - {content_key: "en.a1.audio.emergencies.words.police.01", language: "en", text: "police", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.emergencies.phrases.theres_a_fire.01", language: "en", text: "There's a fire!", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.emergencies.01"
    language: "en"
    text: "Leila: Daniel, is something burning? I smell smoke! Daniel: Oh no, the pan caught fire! I was cooking dinner. Leila: Stay calm. Turn off the stove! I'll call for help. Daniel: Hurry, the fire is getting bigger! Leila: Hello, this is an emergency. There's a fire in my friend's kitchen. Please send the fire department. Daniel: Thank goodness. I think it's out now, but let's wait outside just in case. Leila: Good idea. It's safer to wait outside until they arrive."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

