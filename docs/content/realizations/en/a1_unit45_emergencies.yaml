          - {content_key: "en.a1.unit45.lesson02.exercise03.choose_whats_your_emergency_meaning", type: "multiple_choice", tested_text: "What's your emergency?", prompt: {target_blocks: [{text: "Which phrase does an emergency operator usually ask first when you call for help?", language_code: "en", direction: "ltr"}]}}
