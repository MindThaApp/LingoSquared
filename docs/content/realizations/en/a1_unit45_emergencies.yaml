          - {content_key: "en.a1.unit45.lesson03.exercise04.respond_own_emergency_request", type: "speak_response", tested_text: "I need help", accepted_answers: ["I need help", "I need help.", "Call the police", "Call the police.", "Call an ambulance", "Call an ambulance.", "There's a fire", "There's a fire.", "Send the fire department", "Send the fire department.", "What's your emergency?"], prompt: {target_blocks: [{text: "Say that you need help, or say which service should be sent.", language_code: "en", direction: "ltr"}]}}

