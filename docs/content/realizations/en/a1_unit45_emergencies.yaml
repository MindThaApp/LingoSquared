          - {content_key: "en.a1.unit45.lesson01.teach.fire_department", kind: "vocabulary", target: {text: "fire department", language_code: "en", direction: "ltr"}, introduced_tokens: ["fire", "department", "The", "is", "here"], example: {text: "The fire department is here.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit45.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "police", media_asset_key: "en.a1.audio.emergencies.words.police.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit45.lesson01.exercise02.choose_ambulance_meaning", type: "multiple_choice", tested_text: "ambulance", prompt: {target_blocks: [{text: "Which word means the vehicle that takes injured people to the hospital?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit45.lesson01.exercise03.match_emergency_words", type: "matching_pairs", tested_text: "emergency help police ambulance fire department", prompt: {target_blocks: [{text: "Match each description to its word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "emergency", right: "a sudden, dangerous situation that needs quick action"}, {left: "help", right: "what you ask for when you need someone to come quickly"}, {left: "police", right: "who you call about a crime"}, {left: "ambulance", right: "the vehicle that takes injured people to the hospital"}, {left: "fire department", right: "who you call to put out a fire"}]}
          - {content_key: "en.a1.unit45.lesson01.exercise04.order_ambulance_sentence", type: "word_order", tested_text: "We need an ambulance.", word_bank: ["We", "need", "an", "ambulance."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit45.lesson01.exercise05.write_help_word", type: "writing_prompt", tested_text: "help", prompt: {target_blocks: [{text: "Write the word for what you shout when you need someone to come quickly.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit45.lesson02.asking_for_help"
        title: "Asking for help"
        spine_outcome_id: "universal.a1.emergencies.handle_basic_emergency"
        teaching:
          - {content_key: "en.a1.unit45.lesson02.teach.call_911", kind: "phrase", target: {text: "Call 911!", language_code: "en", direction: "ltr"}, introduced_tokens: ["Call", "911"]}
