        title: "Dialogue: A fire in the kitchen"
        spine_outcome_id: "universal.a1.emergencies.handle_basic_emergency"
        teaching:
          - {content_key: "en.a1.unit45.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Daniel, is something burning? I smell smoke!", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Daniel", "is", "something", "burning", "I", "smell", "smoke"], media_asset_key: "en.a1.audio.dialogue.emergencies.01"}
