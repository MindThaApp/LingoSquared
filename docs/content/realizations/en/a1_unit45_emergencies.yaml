          - {content_key: "en.a1.unit45.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "Stay calm. Turn off the stove! I'll call for help.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Stay", "calm", "Turn", "off", "the", "stove", "I'll", "call", "for", "help"]}
          - {content_key: "en.a1.unit45.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Hurry, the fire is getting bigger!", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Hurry", "the", "fire", "is", "getting", "bigger"]}
          - {content_key: "en.a1.unit45.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Hello, this is an emergency. There's a fire in my friend's kitchen. Please send the fire department.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hello", "this", "is", "an", "emergency", "There's", "a", "fire", "in", "my", "friend's", "kitchen", "Please", "send", "the", "department"]}
          - {content_key: "en.a1.unit45.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Thank goodness. I think it's out now, but let's wait outside just in case.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thank", "goodness", "I", "think", "it's", "out", "now", "but", "let's", "wait", "outside", "just", "in", "case"]}
          - {content_key: "en.a1.unit45.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Good idea. It's safer to wait outside until they arrive.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Good", "idea", "It's", "safer", "to", "wait", "outside", "until", "they", "arrive"]}
