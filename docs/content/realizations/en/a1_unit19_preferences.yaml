units:
  - content_key: "en.a1.unit19.preferences"
    title: "Expressing likes and preferences"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.preferences.express_preferences"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit19.lesson01.like_and_dislike_verbs"
        title: "Like, love, hate, and prefer"
        spine_outcome_id: "universal.a1.preferences.express_preferences"
        teaching:
          - {content_key: "en.a1.unit19.lesson01.teach.like", kind: "vocabulary", target: {text: "like", language_code: "en", direction: "ltr"}, introduced_tokens: ["like"], example: {text: "I like coffee.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit19.lesson01.teach.dont_like", kind: "vocabulary", target: {text: "don't like", language_code: "en", direction: "ltr"}, introduced_tokens: ["don't"], example: {text: "I don't like tea.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit19.lesson01.teach.prefer", kind: "vocabulary", target: {text: "prefer", language_code: "en", direction: "ltr"}, introduced_tokens: ["prefer"], example: {text: "I prefer coffee.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit19.lesson01.teach.love", kind: "vocabulary", target: {text: "love", language_code: "en", direction: "ltr"}, introduced_tokens: ["love"], example: {text: "I love my family.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit19.lesson01.teach.hate", kind: "vocabulary", target: {text: "hate", language_code: "en", direction: "ltr"}, introduced_tokens: ["hate"], example: {text: "I hate being late.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit19.lesson01.exercise01.listen_verb", type: "listen_select", tested_text: "prefer", media_asset_key: "en.a1.audio.preferences.verbs.prefer.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit19.lesson01.exercise02.choose_opposite_of_love", type: "multiple_choice", tested_text: "hate", prompt: {target_blocks: [{text: "What is the opposite of 'love'?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson01.exercise03.choose_negative_form", type: "multiple_choice", tested_text: "don't like", prompt: {target_blocks: [{text: "How do you say you do NOT like something?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson01.exercise04.match_preference_words", type: "matching_pairs", tested_text: "like love hate prefer", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "like", right: "coffee makes you happy"}, {left: "love", right: "coffee is number one for you"}, {left: "hate", right: "the opposite of love"}, {left: "prefer", right: "a stronger preference between two choices"}, {left: "don't like", right: "coffee makes you sad"}, {left: "think", right: "to have an opinion about something"}, {left: "strong", right: "having a powerful, intense taste"}, {left: "calmer", right: "more relaxing, less intense"}]}
          - {content_key: "en.a1.unit19.lesson01.exercise05.write_prefer", type: "writing_prompt", tested_text: "prefer", prompt: {target_blocks: [{text: "Write the word for a stronger preference between two choices.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit19.lesson02.asking_about_preferences"
        title: "Asking what someone likes"
        spine_outcome_id: "universal.a1.preferences.express_preferences"
        teaching:
          - {content_key: "en.a1.unit19.lesson02.teach.do_you_like_or", kind: "phrase", target: {text: "Do you like coffee or tea?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "coffee", "or", "tea"]}
          - {content_key: "en.a1.unit19.lesson02.teach.i_prefer_tea", kind: "phrase", target: {text: "I prefer tea.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I"]}
          - {content_key: "en.a1.unit19.lesson02.teach.because_reason", kind: "phrase", target: {text: "I like tea because it's calmer.", language_code: "en", direction: "ltr"}, introduced_tokens: ["because", "it's", "calmer"]}
        exercises:
          - {content_key: "en.a1.unit19.lesson02.exercise01.listen_question", type: "listen_select", tested_text: "Do you like coffee or tea", media_asset_key: "en.a1.audio.preferences.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit19.lesson02.exercise02.choose_prefer_answer", type: "multiple_choice", tested_text: "I prefer tea.", prompt: {target_blocks: [{text: "Someone asks if you like coffee or tea, and you like tea more. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson02.exercise03.order_because_calmer", type: "word_order", tested_text: "I like tea because it's calmer", prompt: {target_blocks: []}, word_bank: ["like", "tea", "because", "it's", "calmer", "I"]}
          - {content_key: "en.a1.unit19.lesson02.exercise04.reply_coffee_or_tea", type: "dialogue_response", tested_text: "I prefer tea", prompt: {target_blocks: [{text: "Do you like coffee or tea?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson02.exercise05.write_preference_reason", type: "writing_prompt", tested_text: "I like tea because it's calmer.", prompt: {target_blocks: [{text: "Write that you like tea because it's calmer.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit19.lesson03.reading_a_preference_message"
        title: "Reading about someone's preferences"
        spine_outcome_id: "universal.a1.preferences.express_preferences"
        teaching:
          - {content_key: "en.a1.unit19.lesson03.teach.very_much", kind: "vocabulary", target: {text: "very much", language_code: "en", direction: "ltr"}, introduced_tokens: ["very", "much"], example: {text: "I like coffee very much.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit19.lesson03.teach.preference_text", kind: "reading", target: {text: "I like tea, but I don't like coffee. I prefer tea because it's calmer.", language_code: "en", direction: "ltr"}, introduced_tokens: ["but", "don't", "coffee", "prefer", "because", "it's", "calmer"]}
        exercises:
          - {content_key: "en.a1.unit19.lesson03.exercise01.read_liked_drink", type: "reading_comprehension", tested_text: "tea", prompt: {target_blocks: [{text: "Which drink does the writer like?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson03.exercise02.read_disliked_drink", type: "reading_comprehension", tested_text: "coffee", prompt: {target_blocks: [{text: "Which drink does the writer NOT like?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson03.exercise03.choose_reason", type: "multiple_choice", tested_text: "it's calmer", prompt: {target_blocks: [{text: "Why does the writer prefer tea?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson03.exercise04.order_dont_like_coffee", type: "word_order", tested_text: "I don't like coffee very much", prompt: {target_blocks: []}, word_bank: ["don't", "like", "coffee", "very", "much", "I"]}
          - {content_key: "en.a1.unit19.lesson03.exercise05.write_own_preference", type: "writing_prompt", tested_text: "I prefer tea because it's calmer.", prompt: {target_blocks: [{text: "Write that you prefer tea because it's calmer.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit19.lesson04.preference_dialogue"
        title: "Talking about preferences"
        spine_outcome_id: "universal.a1.preferences.express_preferences"
        teaching:
          - {content_key: "en.a1.unit19.lesson04.teach.too_strong", kind: "phrase", target: {text: "It's too strong.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "too", "strong"]}
          - {content_key: "en.a1.unit19.lesson04.teach.q_coffee_or_tea", kind: "dialogue", target: {text: "Do you like coffee or tea?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit19.lesson04.teach.a_prefer_tea_not_much", kind: "dialogue", target: {text: "I prefer tea. I don't like coffee very much.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a1.unit19.lesson04.teach.q_why_not", kind: "dialogue", target: {text: "Why not?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Why", "not"]}
          - {content_key: "en.a1.unit19.lesson04.teach.a_too_strong_calmer", kind: "dialogue", target: {text: "I think it's too strong. I like tea because it's calmer.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I", "think"]}
          - {content_key: "en.a1.unit19.lesson04.teach.he_prefers_thinks", kind: "phrase", target: {text: "He prefers tea. He thinks it's too strong.", language_code: "en", direction: "ltr"}, introduced_tokens: ["He", "prefers", "thinks"]}
        exercises:
          - {content_key: "en.a1.unit19.lesson04.exercise01.listen_daniels_preference", type: "dialogue_comprehension", tested_text: "prefers tea", media_asset_key: "en.a1.audio.dialogue.preferences.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit19.lesson04.exercise02.listen_reason", type: "listen_select", tested_text: "It's too strong", media_asset_key: "en.a1.audio.dialogue.preferences.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit19.lesson04.exercise03.choose_why_not_coffee", type: "multiple_choice", tested_text: "He thinks it's too strong.", prompt: {target_blocks: [{text: "Why doesn't Daniel like coffee very much?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit19.lesson04.exercise04.order_why_not", type: "word_order", tested_text: "Why not", prompt: {target_blocks: []}, word_bank: ["not", "Why"]}
          - content_key: "en.a1.unit19.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I prefer tea I don't like coffee very much I think it's too strong I like tea because it's calmer"
            prompt: {target_blocks: [{text: "Do you like coffee or tea? Why not?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit19.lesson04.exercise06.speak_preference_dialogue"
            type: "speak_response"
            tested_text: "I prefer tea I don't like coffee very much I think it's too strong I like tea because it's calmer"
            prompt: {target_blocks: [{text: "Do you like coffee or tea? Why not?", language_code: "en", direction: "ltr"}]}
