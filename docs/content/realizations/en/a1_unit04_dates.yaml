course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Dates use the US month-day-year convention (July 5, 2026 / 7/5/2026) — flag this is not universal if a learner has seen day-month-year elsewhere."

media_assets:
  - {content_key: "en.a1.audio.dates.weekdays.wednesday.01", language: "en", text: "Wednesday", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.dates.months.september.01", language: "en", text: "September", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.dates.question.01", language: "en", text: "What's today's date?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.appointment.01"
    language: "en"
    text: "Daniel: What's today's date? Leila: It's Tuesday, July 7th. Daniel: When's the library open again? Leila: It opens on Thursday, July 9th. Daniel: Great, see you then."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit04.dates"
    title: "Days, months, and calendar dates"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.dates.exchange_calendar_dates"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit04.lesson01.weekdays"
        title: "Days of the week"
        spine_outcome_id: "universal.a1.dates.exchange_calendar_dates"
        teaching:
          - {content_key: "en.a1.unit04.lesson01.teach.monday", kind: "vocabulary", target: {text: "Monday", language_code: "en", direction: "ltr"}, introduced_tokens: ["Monday"], example: {text: "I have time on Monday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson01.teach.tuesday", kind: "vocabulary", target: {text: "Tuesday", language_code: "en", direction: "ltr"}, introduced_tokens: ["Tuesday"], example: {text: "I have time on Tuesday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson01.teach.wednesday", kind: "vocabulary", target: {text: "Wednesday", language_code: "en", direction: "ltr"}, introduced_tokens: ["Wednesday"], example: {text: "I have time on Wednesday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson01.teach.thursday", kind: "vocabulary", target: {text: "Thursday", language_code: "en", direction: "ltr"}, introduced_tokens: ["Thursday"], example: {text: "I have time on Thursday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson01.teach.friday", kind: "vocabulary", target: {text: "Friday", language_code: "en", direction: "ltr"}, introduced_tokens: ["Friday"], example: {text: "I have time on Friday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson01.teach.saturday", kind: "vocabulary", target: {text: "Saturday", language_code: "en", direction: "ltr"}, introduced_tokens: ["Saturday"], example: {text: "I have time on Saturday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson01.teach.sunday", kind: "vocabulary", target: {text: "Sunday", language_code: "en", direction: "ltr"}, introduced_tokens: ["Sunday"], example: {text: "I have time on Sunday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson01.teach.what_day", kind: "phrase", target: {text: "What day is it today?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "day", "is", "it", "today"]}
        exercises:
          - {content_key: "en.a1.unit04.lesson01.exercise01.listen_weekday", type: "listen_select", tested_text: "Wednesday", media_asset_key: "en.a1.audio.dates.weekdays.wednesday.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit04.lesson01.exercise02.choose_weekend"
            type: "multiple_choice"
            tested_text: "Saturday"
            prompt: {target_blocks: [{text: "Which day is a weekend day?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit04.lesson01.exercise03.match_days", type: "matching_pairs", tested_text: "Monday Tuesday Wednesday Thursday", prompt: {target_blocks: []}, pairs: [{left: "Monday", right: "1st weekday"}, {left: "Tuesday", right: "2nd weekday"}, {left: "Wednesday", right: "3rd weekday"}, {left: "Thursday", right: "4th weekday"}, {left: "Friday", right: "5th weekday"}, {left: "Saturday", right: "1st weekend day"}, {left: "Sunday", right: "2nd weekend day"}]}
          - {content_key: "en.a1.unit04.lesson01.exercise04.order_question", type: "word_order", tested_text: "What day is it today", prompt: {target_blocks: []}, word_bank: ["day", "is", "it", "today", "What"]}
          - {content_key: "en.a1.unit04.lesson01.exercise05.write_friday", type: "writing_prompt", tested_text: "Friday", prompt: {target_blocks: [{text: "Write the day that comes after Thursday.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit04.lesson02.months"
        title: "Months of the year"
        spine_outcome_id: "universal.a1.dates.exchange_calendar_dates"
        teaching:
          - {content_key: "en.a1.unit04.lesson02.teach.january", kind: "vocabulary", target: {text: "January", language_code: "en", direction: "ltr"}, introduced_tokens: ["January"], example: {text: "My birthday is in January.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson02.teach.march", kind: "vocabulary", target: {text: "March", language_code: "en", direction: "ltr"}, introduced_tokens: ["March"], example: {text: "My birthday is in March.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson02.teach.july", kind: "vocabulary", target: {text: "July", language_code: "en", direction: "ltr"}, introduced_tokens: ["July"], example: {text: "My birthday is in July.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson02.teach.september", kind: "vocabulary", target: {text: "September", language_code: "en", direction: "ltr"}, introduced_tokens: ["September"], example: {text: "My birthday is in September.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson02.teach.december", kind: "vocabulary", target: {text: "December", language_code: "en", direction: "ltr"}, introduced_tokens: ["December"], example: {text: "My birthday is in December.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson02.teach.which_month", kind: "phrase", target: {text: "Which month is it?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Which", "month", "is", "it"]}
        exercises:
          - {content_key: "en.a1.unit04.lesson02.exercise01.listen_month", type: "listen_select", tested_text: "September", media_asset_key: "en.a1.audio.dates.months.september.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit04.lesson02.exercise02.choose_summer_month"
            type: "multiple_choice"
            tested_text: "July"
            prompt: {target_blocks: [{text: "Which month is a summer month in the US?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit04.lesson02.exercise03.match_months", type: "matching_pairs", tested_text: "January March July December", prompt: {target_blocks: []}, pairs: [{left: "January", right: "1st month"}, {left: "March", right: "3rd month"}, {left: "July", right: "7th month"}, {left: "December", right: "12th month"}, {left: "September", right: "9th month"}, {left: "Monday", right: "1st weekday"}, {left: "Tuesday", right: "2nd weekday"}, {left: "Wednesday", right: "3rd weekday"}, {left: "Thursday", right: "4th weekday"}, {left: "Friday", right: "5th weekday"}, {left: "Saturday", right: "1st weekend day"}, {left: "Sunday", right: "2nd weekend day"}]}
          - {content_key: "en.a1.unit04.lesson02.exercise04.order_month_question", type: "word_order", tested_text: "Which month is it", prompt: {target_blocks: []}, word_bank: ["month", "is", "it", "Which"]}
          - {content_key: "en.a1.unit04.lesson02.exercise05.write_december", type: "writing_prompt", tested_text: "December", prompt: {target_blocks: [{text: "Write the last month of the year.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit04.lesson03.calendar_dates"
        title: "Asking for and stating the date"
        spine_outcome_id: "universal.a1.dates.exchange_calendar_dates"
        teaching:
          - {content_key: "en.a1.unit04.lesson03.teach.whats_the_date", kind: "phrase", target: {text: "What's today's date?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What's", "today's", "date"]}
          - {content_key: "en.a1.unit04.lesson03.teach.its_july_7", kind: "phrase", target: {text: "It's July 7th.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "July", "7th"]}
          - {content_key: "en.a1.unit04.lesson03.teach.its_tuesday_july_7", kind: "phrase", target: {text: "It's Tuesday, July 7th.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "Tuesday", "July", "7th"]}
          - {content_key: "en.a1.unit04.lesson03.teach.numeric_form", kind: "phrase", target: {text: "You can also write it as 7/7.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "can", "also", "write", "it", "as"]}
          - {content_key: "en.a1.unit04.lesson03.teach.birthday_question", kind: "phrase", target: {text: "When's your birthday?", language_code: "en", direction: "ltr"}, introduced_tokens: ["When's", "your", "birthday"]}
          - {content_key: "en.a1.unit04.lesson03.teach.birthday_answer", kind: "phrase", target: {text: "My birthday is March 3rd.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "birthday", "is", "March", "3rd"]}
        exercises:
          - {content_key: "en.a1.unit04.lesson03.exercise01.listen_date_question", type: "listen_select", tested_text: "What's today's date", media_asset_key: "en.a1.audio.dates.question.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit04.lesson03.exercise02.choose_date_answer"
            type: "multiple_choice"
            tested_text: "It's Tuesday, July 7th."
            prompt: {target_blocks: [{text: "What's today's date?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit04.lesson03.exercise03.order_birthday_question", type: "word_order", tested_text: "When's your birthday", prompt: {target_blocks: []}, word_bank: ["your", "birthday", "When's"]}
          - content_key: "en.a1.unit04.lesson03.exercise04.reply_birthday"
            type: "dialogue_response"
            tested_text: "When's your birthday My birthday is March 3rd"
            prompt: {target_blocks: [{text: "When's your birthday?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit04.lesson03.exercise05.write_date", type: "writing_prompt", tested_text: "It's July 7th", prompt: {target_blocks: [{text: "Write today's date in words: July 7.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit04.lesson04.appointment_dialogue"
        title: "Making an appointment: dates in context"
        spine_outcome_id: "universal.a1.dates.exchange_calendar_dates"
        teaching:
          - {content_key: "en.a1.unit04.lesson04.teach.opens", kind: "vocabulary", target: {text: "opens", language_code: "en", direction: "ltr"}, introduced_tokens: ["opens"], example: {text: "The library opens on Thursday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson04.teach.again", kind: "vocabulary", target: {text: "again", language_code: "en", direction: "ltr"}, introduced_tokens: ["again"], example: {text: "See you again soon!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit04.lesson04.teach.q_date", kind: "dialogue", target: {text: "What's today's date?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a1.unit04.lesson04.teach.a_date", kind: "dialogue", target: {text: "It's Tuesday, July 7th.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit04.lesson04.teach.q_library", kind: "dialogue", target: {text: "When's the library open again?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["When's", "the", "library", "open", "again"]}
          - {content_key: "en.a1.unit04.lesson04.teach.a_library", kind: "dialogue", target: {text: "It opens on Thursday, July 9th.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["It", "opens", "on", "Thursday", "July", "9th"]}
          - {content_key: "en.a1.unit04.lesson04.teach.closing", kind: "dialogue", target: {text: "Great, see you then.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Great", "see", "you", "then"]}
        exercises:
          - {content_key: "en.a1.unit04.lesson04.exercise01.listen_today_date", type: "dialogue_comprehension", tested_text: "It's Tuesday, July 7th", media_asset_key: "en.a1.audio.dialogue.appointment.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit04.lesson04.exercise02.listen_open_date", type: "listen_select", tested_text: "It opens on Thursday, July 9th", media_asset_key: "en.a1.audio.dialogue.appointment.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit04.lesson04.exercise03.choose_reopen_date"
            type: "multiple_choice"
            tested_text: "Thursday, July 9th"
            prompt: {target_blocks: [{text: "When does the library open again?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit04.lesson04.exercise04.order_reopen_question", type: "word_order", tested_text: "When's the library open again", prompt: {target_blocks: []}, word_bank: ["the", "library", "open", "again", "When's"]}
          - content_key: "en.a1.unit04.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "It's Tuesday, July 7th It opens on Thursday, July 9th"
            prompt: {target_blocks: [{text: "What's today's date? When's the library open again?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit04.lesson04.exercise06.speak_dates"
            type: "speak_response"
            tested_text: "It's Tuesday July 7th It opens on Thursday July 9th"
            prompt: {target_blocks: [{text: "What's today's date? When's the library open again?", language_code: "en", direction: "ltr"}]}
