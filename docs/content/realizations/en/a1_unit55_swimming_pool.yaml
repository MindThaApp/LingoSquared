  - {content_key: "en.a1.audio.swimming_pool.phrases.01", language: "en", text: "I'd like to buy a ticket, please. Where are the lockers? What time do you open? It's five dollars for one ticket. Do I need a swim cap? We close at eight o'clock.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.swimming_pool.01"
    language: "en"
    text: "Lifeguard: Hi! Are you here to swim today? Daniel: Yes, two tickets, please. Lifeguard: Sure! It's five dollars for one ticket. Mia: Do we need a swim cap? Lifeguard: Yes, swim caps are required in the pool. Daniel: Where are the lockers? Lifeguard: The lockers are near the entrance. Lifeguard: They need a dollar coin. Mia: What time do you close? Lifeguard: We close at eight o'clock."
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

