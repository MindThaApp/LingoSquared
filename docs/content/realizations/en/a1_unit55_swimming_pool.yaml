course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Swimming-pool register is a simple, everyday spoken exchange between two friends and a pool lifeguard about visiting a public community pool: buying entry tickets, asking whether a swim cap is required, finding the lockers and what they need to open, and understanding what time the pool closes. Core vocabulary (swimming pool/ticket/locker/swim cap/rules/lifeguard) is deliberately generic to a routine public-pool visit, not a private club or a swim-lesson/sport-team register (a different, more complex register than this A1 outcome's own can_do line covers) and not the exercise/hobby sense of swimming already covered in unit34 -- this unit is specifically about the pool-visit setting."

