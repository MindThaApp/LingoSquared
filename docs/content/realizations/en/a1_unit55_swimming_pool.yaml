      - content_key: "en.a1.unit55.lesson04.a_trip_to_the_swimming_pool"
        title: "Reading: A trip to the swimming pool"
        spine_outcome_id: "universal.a1.swimming_pool.visit_swimming_pool"
        teaching:
          - {content_key: "en.a1.unit55.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Trip to the Swimming Pool: One hot afternoon in July, Daniel and Mia decided to cool off at the community swimming pool. Near the entrance, a sign listed the pool rules: no running, and swim caps are required in the pool. They asked the lifeguard for two tickets. It was five dollars for one ticket. The lifeguard explained that the lockers were near the entrance and needed a dollar coin. Daniel and Mia put their bags in a locker and swam for almost two hours. Before they left, they checked the sign again: the pool closes at eight o'clock. Mia said she wants to come back next weekend and try the diving board.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Trip", "to", "the", "Swimming", "Pool", "One", "hot", "afternoon", "in", "July", "Daniel", "and", "Mia", "decided", "cool", "off", "at", "community", "swimming", "pool", "Near", "entrance", "a", "sign", "listed", "rules", "no", "running", "swim", "caps", "are", "required", "They", "asked", "lifeguard", "for", "two", "tickets", "It", "was", "five", "dollars", "one", "ticket", "explained", "that", "lockers", "were", "needed", "dollar", "coin", "put", "their", "bags", "in", "locker", "swam", "almost", "hours", "Before", "left", "checked", "again", "closes", "eight", "o'clock", "said", "she", "wants", "come", "back", "next", "weekend", "try", "diving", "board"]}
        exercises:
          - {content_key: "en.a1.unit55.lesson04.exercise01.reading_reason", type: "multiple_choice", tested_text: "to cool off", prompt: {target_blocks: [{text: "According to the reading, why did Daniel and Mia go to the swimming pool?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit55.lesson04.exercise02.reading_locker_payment", type: "multiple_choice", tested_text: "a dollar coin", prompt: {target_blocks: [{text: "According to the reading, what do the lockers need?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit55.lesson04.exercise03.reading_close_time", type: "multiple_choice", tested_text: "eight o'clock", prompt: {target_blocks: [{text: "According to the reading, what time does the pool close?", language_code: "en", direction: "ltr"}]}}
