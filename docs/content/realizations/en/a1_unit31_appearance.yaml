          - {content_key: "en.a1.unit31.lesson03.exercise03.listen_dialogue_height", type: "listen_select", tested_text: "tall", media_asset_key: "en.a1.audio.dialogue.appearance.01", prompt: {target_blocks: [{text: "According to the dialogue, what is Mia's height?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit31.lesson03.exercise04.respond_describe_someone", type: "speak_response", tested_text: "She has brown hair", accepted_answers: ["She has brown hair", "She has brown hair.", "She has blond hair", "She has blond hair.", "She has black hair", "She has black hair.", "She has curly hair", "She has curly hair.", "She has long hair", "She has long hair.", "She has short hair", "She has short hair.", "She has blue eyes", "She has blue eyes.", "She has green eyes", "She has green eyes.", "She has brown eyes", "She has brown eyes.", "She is tall", "She is tall.", "She's tall", "She's tall.", "She is short", "She is short.", "She's short", "She's short.", "She wears glasses", "She wears glasses.", "He has brown hair", "He has brown hair.", "He has blond hair", "He has blond hair.", "He has black hair", "He has black hair.", "He has curly hair", "He has curly hair.", "He has long hair", "He has long hair.", "He has short hair", "He has short hair.", "He has blue eyes", "He has blue eyes.", "He has green eyes", "He has green eyes.", "He has brown eyes", "He has brown eyes.", "He is tall", "He is tall.", "He's tall", "He's tall.", "He is short", "He is short.", "He's short", "He's short.", "He wears glasses", "He wears glasses."], prompt: {target_blocks: [{text: "Describe what a friend or family member looks like in one sentence.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit31.lesson04.comparing_appearances"
        title: "Reading: Two friends"
        spine_outcome_id: "universal.a1.appearance.describe_physical_appearance"
        teaching:
          - {content_key: "en.a1.unit31.lesson04.teach.reading_passage", kind: "reading", target: {text: "Daniel and Leila are good friends, but they don't look the same. Daniel is tall and has short, black hair. He wears glasses. Leila is short and has long, curly, brown hair. She has blue eyes, and Daniel has brown eyes. They both like to laugh a lot.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "Leila", "good", "friends", "but", "they", "don't", "look", "same", "black", "wears", "laugh", "a", "lot"]}
        exercises:
