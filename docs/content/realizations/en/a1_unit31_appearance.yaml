          - {content_key: "en.a1.unit31.lesson02.exercise03.choose_eye_color", type: "multiple_choice", tested_text: "blue", prompt: {target_blocks: [{text: "Which of these is an eye color?", language_code: "en", direction: "ltr"}]}}
