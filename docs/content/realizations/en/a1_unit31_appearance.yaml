          - {content_key: "en.a1.unit31.lesson04.exercise04.write_own_description", type: "writing_prompt", tested_text: "has", prompt: {target_blocks: [{text: "Write one sentence describing what you look like, using \"I have\" or \"I am\".", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I have brown hair", "I have brown hair.", "I have black hair", "I have black hair.", "I have blond hair", "I have blond hair.", "I have curly hair", "I have curly hair.", "I have long hair", "I have long hair.", "I have short hair", "I have short hair.", "I have blue eyes", "I have blue eyes.", "I have green eyes", "I have green eyes.", "I have brown eyes", "I have brown eyes.", "I am tall", "I am tall.", "I'm tall", "I'm tall.", "I am short", "I am short.", "I'm short", "I'm short."]}
