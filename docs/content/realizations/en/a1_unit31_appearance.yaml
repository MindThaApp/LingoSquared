          - {content_key: "en.a1.unit31.lesson02.teach.brown", kind: "vocabulary", target: {text: "brown", language_code: "en", direction: "ltr"}, introduced_tokens: ["brown"], example: {text: "My eyes are brown.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit31.lesson02.teach.green", kind: "vocabulary", target: {text: "green", language_code: "en", direction: "ltr"}, introduced_tokens: ["green"], example: {text: "He has green eyes.", language_code: "en", direction: "ltr"}}
