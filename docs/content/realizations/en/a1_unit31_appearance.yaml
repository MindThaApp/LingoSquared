          - {content_key: "en.a1.unit31.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Okay, I think I see her at the door now.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Okay", "I", "think", "see", "at", "the", "door", "now"]}
