          - {content_key: "en.a1.unit31.lesson01.exercise02.choose_short_meaning", type: "multiple_choice", tested_text: "short", prompt: {target_blocks: [{text: "Which word describes someone who is not tall?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit31.lesson01.exercise03.match_traits", type: "matching_pairs", tested_text: "tall short hair blond curly", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "tall", right: "having a big height"}, {left: "short", right: "having a small height"}, {left: "hair", right: "grows on your head"}, {left: "blond", right: "a light yellow hair color"}, {left: "curly", right: "hair with lots of small circles or waves"}]}
          - {content_key: "en.a1.unit31.lesson01.exercise04.order_hair_sentence", type: "word_order", tested_text: "She has long hair.", word_bank: ["She", "has", "long", "hair."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit31.lesson01.exercise05.write_trait", type: "writing_prompt", tested_text: "tall", prompt: {target_blocks: [{text: "Write the word that means someone has a big height.", language_code: "en", direction: "ltr"}]}}

