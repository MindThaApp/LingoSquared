      - content_key: "en.a1.unit31.lesson01.height_and_hair"
        title: "Height and hair"
        spine_outcome_id: "universal.a1.appearance.describe_physical_appearance"
        teaching:
          - {content_key: "en.a1.unit31.lesson01.teach.tall", kind: "vocabulary", target: {text: "tall", language_code: "en", direction: "ltr"}, introduced_tokens: ["tall", "My", "brother", "is"], example: {text: "My brother is tall.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit31.lesson01.teach.short", kind: "vocabulary", target: {text: "short", language_code: "en", direction: "ltr"}, introduced_tokens: ["short", "My", "sister"], example: {text: "My sister is short.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit31.lesson01.teach.hair", kind: "vocabulary", target: {text: "hair", language_code: "en", direction: "ltr"}, introduced_tokens: ["hair", "She", "has", "long"], example: {text: "She has long hair.", language_code: "en", direction: "ltr"}}
