  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English for returning or exchanging a simple shop item: saying it is too small, showing a receipt, asking for another size, and receiving a refund."

media_assets:
  - {content_key: "en.a1.audio.returns_exchanges.words.01", language: "en", text: "return, exchange, receipt, size, refund, small", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.returns_exchanges.phrases.01", language: "en", text: "I want to return this. Can I exchange it? Do you have the receipt? This size is too small. I need a larger size. You can get a refund.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.returns_exchanges.01"
    language: "en"
    text: "Daniel: Hi. I want to return this shirt. Clerk: Do you have the receipt? Daniel: Yes, here it is. The size is too small. Clerk: Can I exchange it for a larger size? Daniel: Yes, please. Clerk: We have a larger size in blue. Daniel: Great. I do not need a refund."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit65.returns_exchanges"
    title: "Returns and exchanges"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.shopping.ask_prices_quantities"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit65.lesson01.return_words"
        title: "Words for returns"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit65.lesson01.teach.return", kind: "vocabulary", target: {text: "return", language_code: "en", direction: "ltr"}, introduced_tokens: ["return", "I", "want", "to", "this"], example: {text: "I want to return this.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit65.lesson01.teach.exchange", kind: "vocabulary", target: {text: "exchange", language_code: "en", direction: "ltr"}, introduced_tokens: ["exchange", "Can", "it"], example: {text: "Can I exchange it?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit65.lesson01.teach.receipt", kind: "vocabulary", target: {text: "receipt", language_code: "en", direction: "ltr"}, introduced_tokens: ["receipt", "Do", "you", "have", "the"], example: {text: "Do you have the receipt?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit65.lesson01.teach.size", kind: "vocabulary", target: {text: "size", language_code: "en", direction: "ltr"}, introduced_tokens: ["size", "larger"], example: {text: "I need a larger size.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit65.lesson01.teach.refund", kind: "vocabulary", target: {text: "refund", language_code: "en", direction: "ltr"}, introduced_tokens: ["refund", "get", "a"], example: {text: "You can get a refund.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit65.lesson01.teach.small", kind: "vocabulary", target: {text: "small", language_code: "en", direction: "ltr"}, introduced_tokens: ["small", "too"], example: {text: "This size is too small.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit65.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "receipt", media_asset_key: "en.a1.audio.returns_exchanges.words.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit65.lesson01.exercise02.choose_refund_meaning", type: "multiple_choice", tested_text: "refund", prompt: {target_blocks: [{text: "Which word means money you get back from a shop?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson01.exercise03.match_return_words", type: "matching_pairs", tested_text: "return exchange receipt size refund small", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "take an item back to a shop", right: "return"}, {left: "change one item for another", right: "exchange"}, {left: "paper that shows you paid", right: "receipt"}, {left: "how big or small clothing is", right: "size"}, {left: "money you get back", right: "refund"}, {left: "not large", right: "small"}]}
          - {content_key: "en.a1.unit65.lesson01.exercise04.order_return_sentence", type: "word_order", tested_text: "I want to return this.", word_bank: ["I", "want", "to", "return", "this."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson01.exercise05.write_receipt", type: "writing_prompt", tested_text: "receipt", prompt: {target_blocks: [{text: "Write the word for the paper that shows you paid.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit65.lesson02.return_phrases"
        title: "Phrases for returns"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit65.lesson02.teach.want_return", kind: "phrase", target: {text: "I want to return this.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "want", "to", "return", "this"]}
          - {content_key: "en.a1.unit65.lesson02.teach.can_exchange", kind: "phrase", target: {text: "Can I exchange it?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Can", "exchange", "it"]}
          - {content_key: "en.a1.unit65.lesson02.teach.have_receipt", kind: "phrase", target: {text: "Do you have the receipt?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "have", "the", "receipt"]}
          - {content_key: "en.a1.unit65.lesson02.teach.too_small", kind: "phrase", target: {text: "This size is too small.", language_code: "en", direction: "ltr"}, introduced_tokens: ["size", "is", "too", "small"]}
          - {content_key: "en.a1.unit65.lesson02.teach.larger_size", kind: "phrase", target: {text: "I need a larger size.", language_code: "en", direction: "ltr"}, introduced_tokens: ["need", "a", "larger"]}
          - {content_key: "en.a1.unit65.lesson02.teach.get_refund", kind: "phrase", target: {text: "You can get a refund.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "can", "get", "refund"]}
        exercises:
          - {content_key: "en.a1.unit65.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "Can I exchange it?", media_asset_key: "en.a1.audio.returns_exchanges.phrases.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit65.lesson02.exercise02.choose_return_request", type: "multiple_choice", tested_text: "I want to return this.", prompt: {target_blocks: [{text: "Which phrase says you want to take an item back?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson02.exercise03.choose_receipt_question", type: "multiple_choice", tested_text: "Do you have the receipt?", prompt: {target_blocks: [{text: "Which phrase asks for proof of payment?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson02.exercise04.order_small_sentence", type: "word_order", tested_text: "This size is too small.", word_bank: ["This", "size", "is", "too", "small."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson02.exercise05.translate_refund", type: "translation", tested_text: "You can get a refund.", prompt: {target_blocks: [{text: "Translate: \"You can get a refund.\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit65.lesson03.dialogue_at_the_returns_desk"
        title: "Dialogue: At the returns desk"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit65.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hi. I want to return this shirt.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Hi", "shirt"], media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01"}
          - {content_key: "en.a1.unit65.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Do you have the receipt?", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01"}
          - {content_key: "en.a1.unit65.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "Yes, here it is. The size is too small.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "here"], media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01"}
          - {content_key: "en.a1.unit65.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Can I exchange it for a larger size?", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["for"], media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01"}
          - {content_key: "en.a1.unit65.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Yes, please.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["please"], media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01"}
          - {content_key: "en.a1.unit65.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "We have a larger size in blue.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["We", "blue"], media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01"}
          - {content_key: "en.a1.unit65.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Great. I do not need a refund.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Great", "do", "not"], media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01"}
        exercises:
          - {content_key: "en.a1.unit65.lesson03.exercise01.comprehension_item", type: "multiple_choice", tested_text: "shirt", prompt: {target_blocks: [{text: "According to the dialogue, what does Daniel want to return?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson03.exercise02.comprehension_problem", type: "multiple_choice", tested_text: "too small", prompt: {target_blocks: [{text: "According to the dialogue, what is the problem with the size?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson03.exercise03.listen_dialogue_receipt", type: "listen_select", tested_text: "Do you have the receipt?", media_asset_key: "en.a1.audio.dialogue.returns_exchanges.01", prompt: {target_blocks: [{text: "Which question does the clerk ask?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson03.exercise04.respond_own_return", type: "speak_response", tested_text: "I want to return this.", accepted_answers: ["I want to return this", "I want to return this.", "Can I exchange it", "Can I exchange it?", "This size is too small", "This size is too small.", "I need a larger size", "I need a larger size."], prompt: {target_blocks: [{text: "Ask to return or exchange something, or explain the size problem.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit65.lesson04.a_return_receipt"
        title: "Reading: A return receipt"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit65.lesson04.teach.return_note", kind: "reading", target: {text: "Return note: Blue shirt. Size small. Exchange for larger size. Receipt required.", language_code: "en", direction: "ltr"}, introduced_tokens: ["note", "required"]}
          - {content_key: "en.a1.unit65.lesson04.teach.reading_passage", kind: "reading", target: {text: "An Exchange at the Shop: Daniel bought a blue shirt, but the size was too small. He went back to the shop with the receipt. The clerk asked for the receipt and offered a larger size. Daniel exchanged the shirt. He did not need a refund because the larger blue shirt was fine.", language_code: "en", direction: "ltr"}, introduced_tokens: ["An", "Exchange", "at", "Shop", "bought", "but", "was", "He", "went", "back", "with", "asked", "offered", "exchanged", "did", "not", "because", "fine"]}
        exercises:
          - {content_key: "en.a1.unit65.lesson04.exercise01.note_item", type: "multiple_choice", tested_text: "Blue shirt", prompt: {target_blocks: [{text: "According to the note, what is the item?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson04.exercise02.note_action", type: "multiple_choice", tested_text: "Exchange", prompt: {target_blocks: [{text: "According to the note, what should happen?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson04.exercise03.reading_what_needed", type: "multiple_choice", tested_text: "the receipt", prompt: {target_blocks: [{text: "According to the reading, what did Daniel take to the shop?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson04.exercise04.reading_refund", type: "multiple_choice", tested_text: "He did not need a refund", prompt: {target_blocks: [{text: "According to the reading, did Daniel need a refund?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit65.lesson04.exercise05.write_own_return_message", type: "writing_prompt", tested_text: "I want to exchange this. The size is too small.", prompt: {target_blocks: [{text: "Write a short message: ask to exchange something, and explain the size problem.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I want to exchange this. The size is too small.", "Can I exchange this? The size is too small.", "I want to return this. The size is too small."]}
