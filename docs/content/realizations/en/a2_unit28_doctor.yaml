schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "adapted_from_public_domain_source"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    The formal appointment-request-and-consultation pattern (asking for
    an appointment, describing a symptom's duration and severity in
    more detail than a bare complaint, understanding a course of
    treatment) is scaffolded from the health-and-welfare module of the
    FSI Basic Course material (Foreign Service Institute, US Department
    of State -- public domain, no attribution required per
    docs/content/AUTHORING_GUIDE.md §10). The source frames this around
    a 1960s-70s clinic-visit exchange with dated vocabulary and register;
    the specific scenario, vocabulary (insurance card, follow-up
    appointment, confirmation number), and every example sentence here
    reflect current 2020s US outpatient-care conventions and are freshly
    authored, not translated or lightly edited from the source.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fourth A2 unit for the shared English realization (spine outcome:
    universal.a2.health.attend_doctor_appointment, the second health
    outcome -- extends unit22's A1 basic_problem outcome), continuing
    the Leila/Daniel storyline with a direct narrative payoff: unit22's
    dialogue ended with Leila telling Daniel "If it doesn't get better,
    you should see a doctor" -- this unit opens with exactly that
    happening (his cold didn't get better, so he calls to make an
    appointment). Reuses, explicitly: unit22's symptom vocabulary
    (headache, sore throat, fever -- recapped in lesson01's teach.
    reused_symptoms card and pooled into lesson01's matching_pairs
    pool per AUTHORING_GUIDE §16), unit22's exact phrase "What's
    wrong?" (now asked by the doctor instead of Leila) and the "if it
    doesn't get better" conditional (now the learner's own line, asking
    the doctor whether to come back), and unit25's own formal-register
    phone-appointment-request pattern ("I was wondering whether I could
    make an appointment" -> here "I'd like to make an appointment to
    see a doctor") and present-perfect duration pattern ("Since when
    have you lived..." -> here "I've had ... for three days") --
    unit14's phone content is casual register, not the actual
    precedent for this unit's formal phone call. New A2 material:
    describing symptom duration/severity in a
    single multi-clause sentence, and a simple non-alarming diagnosis
    ("a bad cold") plus a two-part treatment instruction (medicine
    dosage, a conditional follow-up) -- kept deliberately mundane and
    common per unit22's non-diagnostic register policy's spirit; nothing
    here is real medical advice or a serious/alarming condition.
    Every concrete fact (three-day duration, 3pm appointment time,
    confirmation number 7724, five-day medicine course, one-week
    follow-up window) is stated once and never contradicted elsewhere
    in the unit per AUTHORING_GUIDE §11. No fill_in_blank exercises
    (matching this realization's existing A2 units' pattern of avoiding
    the type entirely rather than risking §17 ambiguity). lesson01's
    matching_pairs exercise uses 8 distinct pairs, comfortably within
    the AUTHORING_GUIDE §16 6-12 target. Every word_order word_bank
    uses entirely distinct new+reused vocabulary -- no true-synonym
    pair could occupy the same slot ambiguously. Compiled and validated
    against the real compiler (scripts/compile_content.py) to confirm
    every exercise's tested_text is fully covered by this file's own
    cumulative introduced_tokens (the per-file untaught-vocabulary
    check), not just eyeballed. A fresh-context review (Codex was
    usage-exhausted at authoring time, so a fresh no-prior-context
    subagent ran the equivalent review instead) found and all three
    overlays were then fixed for: (1) a systemic §15 violation --
    every teach.note/exercise.feedback field mixing English words
    inline with source-language text was missing the required
    *asterisk* wrapping, now applied throughout; (2) a fabricated Dari
    word ("ورز" used for "day" in the prs-en draft where "روز" -- also
    used correctly elsewhere in the same file for "daily" -- was
    always the real word) corrected to روز; (3) a §12 gap where
    lesson04's reply_as_daniel/speak_doctor_dialogue accepted_answers
    only had the comma-joined form while lesson02's equivalent
    duration+severity sentence correctly had all three (comma/no-comma/
    period-split) -- the missing two variants added to all three
    overlays. Still pending an actual human (or Codex, once usage
    resets) reviewer per standard governance -- this AI review does
    not itself satisfy §9.

    2026-07-07 §19 retrofit (part of the project-wide vocabulary-
    example rollout, picked up after a different agent hit an
    infrastructure failure on this task before any edits landed --
    confirmed no partial work existed to recover, started fresh):
    added `example:` to all 7 kind:vocabulary cards, reusing the
    Daniel/Leila doctor's-office narrative already established in this
    file (a doctor giving medicine/a prescription, scheduling a
    follow-up, a worsening headache, bringing an insurance card,
    arriving early). reused_symptoms (a merged 3-word card) got a
    3-item example list, one sentence per symptom. This file is
    shared by fa-en/nl-en/prs-en; nl-en's overlay was given matching
    example_gloss this pass (fa-en/prs-en still need a follow-up).
    schema_version bumped to 1.1.

    Fresh-context review correction, same day: follow_up_appointment's
    example originally read "The doctor scheduled a follow-up
    appointment for next week" -- a fixed, pre-scheduled appointment
    that softly diverges from this file's own established storyline,
    where the follow-up is explicitly conditional ("come back if it
    doesn't get better," not a scheduled fixed date). Fixed to "If it
    doesn't get better, you'll need a follow-up appointment," matching
    the conditional framing; nl-en's example_gloss updated to match.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every exercise against the position-matched
    nl-en/fa-en/prs-en overlays for accepted-answer completeness,
    distractor validity, prompt/answer coherence, dialogue speaker
    attribution against the audio, listen distractors against the full
    audio, boolean coercion, and Leila/Daniel character canon against
    units 22/25/28. Fixed:
    en.a2.unit28.lesson04.exercise05.reply_as_daniel and
    exercise06.speak_doctor_dialogue -- the prompt already contained the
    doctor's medicine instruction before the expected answer asked
    'Should I take any medicine?'; the prompt is now a speaker-labelled
    transcript (Doctor 'What's wrong?' / Daniel gap / Doctor 'I see. You
    have a bad cold.' / Daniel gap / Doctor medicine instruction /
    Daniel gap), matching the audio order (answers and instructions
    unchanged). en.a2.unit28.lesson01.exercise04.match_doctor_words --
    realization rights 'headache or fever' -> 'something you take to
    feel better' (medicine) and 'document + medicine' -> 'the doctor's
    written order for medicine' (prescription); lefts unchanged, all
    overlays override the rights. NATIVE FLAG:
    lesson01.exercise02.choose_medicine_word prompt 'something a doctor
    gives you to help you get better' could arguably also describe the
    distractor 'prescription'. DEFERRED (owner decision): the lesson04
    dialogue_response/speak_response items still expect the learner's
    whole multi-turn part as one answer (the shared units 26-29
    pattern); splitting them into single-turn items like unit25/unit35
    would change tested_text and the accepted_answers and instructions
    in all overlay sets, including the Persian/Dari instructions.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at a formal-but-caring register appropriate for a doctor's office, continuing unit25/unit27's polite conventions. Diagnoses and instructions stay deliberately simple and non-alarming (a common cold, a twice-daily medicine, a conditional follow-up) -- never real medical advice or a serious condition, extending unit22's non-diagnostic spirit to the one common, mundane diagnosis this A2 outcome requires the learner to understand."

media_assets:
  - {content_key: "en.a2.audio.doctor.words.prescription.01", language: "en", text: "prescription", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.doctor.question.01", language: "en", text: "I'd like to make an appointment to see a doctor, please.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.doctor.description.01", language: "en", text: "Your appointment is confirmed for 3pm today. Please bring your insurance card and arrive ten minutes early. The confirmation number is 7724.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.doctor_appointment.01"
    language: "en"
    text: "Doctor: What's wrong? Daniel: I've had a headache and a sore throat for three days, and it's getting worse. Doctor: I see. You have a bad cold. Daniel: Should I take any medicine? Doctor: Yes, take this medicine twice a day for five days, and drink plenty of water. Daniel: Should I come back if it doesn't get better? Doctor: Yes, come back for a follow-up appointment if it doesn't get better within a week."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit28.doctor"
    title: "Attending a doctor's appointment"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.health.attend_doctor_appointment"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit28.lesson01.health_followup_vocabulary"
        title: "Medicine and appointments"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit28.lesson01.teach.medicine", kind: "vocabulary", target: {text: "medicine", language_code: "en", direction: "ltr"}, introduced_tokens: ["medicine"], example: {text: "The doctor gave me some medicine for my headache.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit28.lesson01.teach.prescription", kind: "vocabulary", target: {text: "prescription", language_code: "en", direction: "ltr"}, introduced_tokens: ["prescription"], example: {text: "The doctor wrote me a prescription for the medicine.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit28.lesson01.teach.follow_up_appointment", kind: "vocabulary", target: {text: "follow-up appointment", language_code: "en", direction: "ltr"}, introduced_tokens: ["follow", "up", "appointment"], example: {text: "If it doesn't get better, you'll need a follow-up appointment.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit28.lesson01.teach.getting_worse", kind: "vocabulary", target: {text: "getting worse", language_code: "en", direction: "ltr"}, introduced_tokens: ["getting", "worse"], example: {text: "My headache is getting worse, not better.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit28.lesson01.teach.insurance_card", kind: "vocabulary", target: {text: "insurance card", language_code: "en", direction: "ltr"}, introduced_tokens: ["insurance", "card"], example: {text: "Please bring your insurance card to the appointment.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit28.lesson01.teach.reused_symptoms", kind: "vocabulary", target: {text: "headache, sore throat, fever", language_code: "en", direction: "ltr"}, introduced_tokens: ["headache", "sore", "throat", "fever"], example: [{text: "I have a headache.", language_code: "en", direction: "ltr"}, {text: "I have a sore throat.", language_code: "en", direction: "ltr"}, {text: "I have a fever.", language_code: "en", direction: "ltr"}]}
        exercises:
          - {content_key: "en.a2.unit28.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "prescription", media_asset_key: "en.a2.audio.doctor.words.prescription.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit28.lesson01.exercise02.choose_medicine_word", type: "multiple_choice", tested_text: "medicine", prompt: {target_blocks: [{text: "Which word means something a doctor gives you to help you get better?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson01.exercise03.choose_insurance_card_phrase", type: "multiple_choice", tested_text: "insurance card", prompt: {target_blocks: [{text: "Which phrase means the card that helps pay for your doctor visit?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson01.exercise04.match_doctor_words", type: "matching_pairs", tested_text: "medicine prescription follow-up appointment getting worse insurance card headache sore throat fever", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "medicine", right: "something you take to feel better"}, {left: "prescription", right: "the doctor's written order for medicine"}, {left: "follow-up appointment", right: "another appointment to check how you're doing"}, {left: "getting worse", right: "a symptom that is becoming more serious"}, {left: "insurance card", right: "the card that helps pay for your doctor visit"}, {left: "headache", right: "pain in your head"}, {left: "sore throat", right: "pain in your throat when you swallow"}, {left: "fever", right: "when your body is too hot"}]}
          - {content_key: "en.a2.unit28.lesson01.exercise05.write_prescription", type: "writing_prompt", tested_text: "prescription", prompt: {target_blocks: [{text: "Write the word for a doctor's written order for medicine.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit28.lesson02.calling_to_make_an_appointment"
        title: "Calling to make an appointment"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit28.lesson02.teach.appointment_request", kind: "phrase", target: {text: "I'd like to make an appointment to see a doctor, please.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'd", "like", "to", "make", "an", "appointment", "see", "a", "doctor", "please"]}
          - {content_key: "en.a2.unit28.lesson02.teach.symptom_duration", kind: "phrase", target: {text: "I've had a headache and a sore throat for three days, and it's getting worse.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I've", "had", "a", "headache", "and", "sore", "throat", "for", "three", "days", "it's", "getting", "worse"]}
        exercises:
          - {content_key: "en.a2.unit28.lesson02.exercise01.listen_request", type: "listen_select", tested_text: "I'd like to make an appointment to see a doctor", media_asset_key: "en.a2.audio.doctor.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit28.lesson02.exercise02.choose_polite_appointment_request", type: "multiple_choice", tested_text: "I'd like to make an appointment to see a doctor, please.", prompt: {target_blocks: [{text: "You are calling a doctor's office, formally, to ask for an appointment. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson02.exercise03.order_symptom_duration", type: "word_order", tested_text: "I've had a headache and a sore throat for three days", prompt: {target_blocks: []}, word_bank: ["had", "a", "headache", "and", "a", "sore", "throat", "for", "three", "days", "I've"]}
          - {content_key: "en.a2.unit28.lesson02.exercise04.reply_symptom_duration", type: "dialogue_response", tested_text: "I've had a headache and a sore throat for three days and it's getting worse", prompt: {target_blocks: [{text: "The receptionist asks how long you've had your symptoms and whether they're getting worse. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson02.exercise05.write_appointment_request", type: "writing_prompt", tested_text: "I'd like to make an appointment to see a doctor, please.", prompt: {target_blocks: [{text: "Write that you'd like to make an appointment to see a doctor.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit28.lesson03.reading_an_appointment_confirmation"
        title: "Reading an appointment confirmation"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit28.lesson03.teach.arrive_early", kind: "vocabulary", target: {text: "arrive ten minutes early", language_code: "en", direction: "ltr"}, introduced_tokens: ["arrive", "ten", "minutes", "early"], example: {text: "Please arrive ten minutes early for your appointment.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit28.lesson03.teach.confirmation_text", kind: "reading", target: {text: "Your appointment is confirmed for 3pm today. Please bring your insurance card and arrive ten minutes early. The confirmation number is 7724.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Your", "appointment", "is", "confirmed", "for", "3pm", "today", "Please", "bring", "your", "insurance", "card", "and", "arrive", "ten", "minutes", "early", "The", "confirmation", "number", "7724"]}
        exercises:
          - {content_key: "en.a2.unit28.lesson03.exercise01.read_appointment_time", type: "reading_comprehension", tested_text: "3pm today", prompt: {target_blocks: [{text: "What time is the appointment confirmed for?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson03.exercise02.read_arrival_time", type: "reading_comprehension", tested_text: "ten minutes early", prompt: {target_blocks: [{text: "How early should you arrive?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson03.exercise03.choose_true_statement", type: "multiple_choice", tested_text: "The confirmation number is 7724.", prompt: {target_blocks: [{text: "Which statement is true according to the text?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson03.exercise04.order_bring_insurance_card", type: "word_order", tested_text: "Please bring your insurance card and arrive ten minutes early", prompt: {target_blocks: []}, word_bank: ["bring", "your", "insurance", "card", "and", "arrive", "ten", "minutes", "early", "Please"]}
          - {content_key: "en.a2.unit28.lesson03.exercise05.write_appointment_time", type: "writing_prompt", tested_text: "Your appointment is confirmed for 3pm today.", prompt: {target_blocks: [{text: "Write that your appointment is confirmed for 3pm today.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit28.lesson04.doctor_appointment_dialogue"
        title: "At the doctor's office"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit28.lesson04.teach.i_see", kind: "phrase", target: {text: "I see.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "see"]}
          - {content_key: "en.a2.unit28.lesson04.teach.q_whats_wrong", kind: "dialogue", target: {text: "What's wrong?", language_code: "en", direction: "ltr", speaker: "Doctor"}, introduced_tokens: ["What's", "wrong"]}
          - {content_key: "en.a2.unit28.lesson04.teach.a_symptoms_duration", kind: "dialogue", target: {text: "I've had a headache and a sore throat for three days, and it's getting worse.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit28.lesson04.teach.a_bad_cold", kind: "dialogue", target: {text: "I see. You have a bad cold.", language_code: "en", direction: "ltr", speaker: "Doctor"}, introduced_tokens: ["You", "have", "bad", "cold"]}
          - {content_key: "en.a2.unit28.lesson04.teach.q_medicine", kind: "dialogue", target: {text: "Should I take any medicine?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Should", "take", "any"]}
          - {content_key: "en.a2.unit28.lesson04.teach.a_medicine_instructions", kind: "dialogue", target: {text: "Yes, take this medicine twice a day for five days, and drink plenty of water.", language_code: "en", direction: "ltr", speaker: "Doctor"}, introduced_tokens: ["Yes", "this", "twice", "day", "five", "drink", "plenty", "water"]}
          - {content_key: "en.a2.unit28.lesson04.teach.q_follow_up", kind: "dialogue", target: {text: "Should I come back if it doesn't get better?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["come", "back", "if", "doesn't", "get", "better"]}
          - {content_key: "en.a2.unit28.lesson04.teach.a_followup_appointment", kind: "dialogue", target: {text: "Yes, come back for a follow-up appointment if it doesn't get better within a week.", language_code: "en", direction: "ltr", speaker: "Doctor"}, introduced_tokens: ["within", "week"]}
        exercises:
          - {content_key: "en.a2.unit28.lesson04.exercise01.listen_diagnosis", type: "dialogue_comprehension", tested_text: "a bad cold", media_asset_key: "en.a2.audio.dialogue.doctor_appointment.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit28.lesson04.exercise02.listen_medicine_instructions", type: "listen_select", tested_text: "take this medicine twice a day for five days", media_asset_key: "en.a2.audio.dialogue.doctor_appointment.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit28.lesson04.exercise03.choose_followup_condition", type: "multiple_choice", tested_text: "come back for a follow-up appointment if it doesn't get better within a week", prompt: {target_blocks: [{text: "What does the doctor say to do if the cold doesn't get better?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit28.lesson04.exercise04.order_bad_cold", type: "word_order", tested_text: "You have a bad cold", prompt: {target_blocks: []}, word_bank: ["have", "a", "bad", "cold", "You"]}
          - content_key: "en.a2.unit28.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I've had a headache and a sore throat for three days and it's getting worse Should I take any medicine Should I come back if it doesn't get better"
            prompt: {target_blocks: [{text: "What's wrong?", language_code: "en", direction: "ltr", speaker: "Doctor"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "I see. You have a bad cold.", language_code: "en", direction: "ltr", speaker: "Doctor"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "Yes, take this medicine twice a day for five days, and drink plenty of water.", language_code: "en", direction: "ltr", speaker: "Doctor"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Daniel"}]}
          - content_key: "en.a2.unit28.lesson04.exercise06.speak_doctor_dialogue"
            type: "speak_response"
            tested_text: "I've had a headache and a sore throat for three days and it's getting worse Should I take any medicine Should I come back if it doesn't get better"
            prompt: {target_blocks: [{text: "What's wrong?", language_code: "en", direction: "ltr", speaker: "Doctor"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "I see. You have a bad cold.", language_code: "en", direction: "ltr", speaker: "Doctor"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "Yes, take this medicine twice a day for five days, and drink plenty of water.", language_code: "en", direction: "ltr", speaker: "Doctor"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Daniel"}]}
