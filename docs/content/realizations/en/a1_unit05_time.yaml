course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Clock times use the everyday spoken 12-hour convention (it's three o'clock / it's half past three / it's a quarter to four) with AM/PM for disambiguation, not the 24-hour clock."

media_assets:
  - {content_key: "en.a1.audio.time.question.01", language: "en", text: "What time is it?", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.time.oclock.01", language: "en", text: "It's three o'clock. It's half past three. It's a quarter to four.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.time.day_parts.01", language: "en", text: "morning, afternoon, evening, night", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.schedule.01"
    language: "en"
    text: "Daniel: What time does the library open? Leila: It opens at nine in the morning. Daniel: And what time does it close? Leila: It closes at six in the evening. Daniel: Great, see you at nine!"
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit05.time"
    title: "Telling the time"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.time.ask_tell_time"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit05.lesson01.oclock_and_half"
        title: "Hours and half hours"
        spine_outcome_id: "universal.a1.time.ask_tell_time"
        teaching:
          - {content_key: "en.a1.unit05.lesson01.teach.what_time", kind: "phrase", target: {text: "What time is it?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "time", "is", "it"]}
          - {content_key: "en.a1.unit05.lesson01.teach.three_oclock", kind: "phrase", target: {text: "It's three o'clock.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "three", "o'clock"]}
          - {content_key: "en.a1.unit05.lesson01.teach.half_past", kind: "phrase", target: {text: "It's half past three.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "half", "past", "three"]}
          - {content_key: "en.a1.unit05.lesson01.teach.five_oclock", kind: "phrase", target: {text: "It's five o'clock.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "five", "o'clock"]}
        exercises:
          - {content_key: "en.a1.unit05.lesson01.exercise01.listen_time_question", type: "listen_select", tested_text: "What time is it", media_asset_key: "en.a1.audio.time.question.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit05.lesson01.exercise02.choose_three_oclock"
            type: "multiple_choice"
            tested_text: "It's three o'clock."
            prompt: {target_blocks: [{text: "3:00", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit05.lesson01.exercise03.choose_half_past"
            type: "multiple_choice"
            tested_text: "It's half past three."
            prompt: {target_blocks: [{text: "3:30", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit05.lesson01.exercise04.order_five", type: "word_order", tested_text: "It's five o'clock", prompt: {target_blocks: [{text: "5:00", language_code: "en", direction: "ltr"}]}, word_bank: ["five", "It's", "o'clock"]}
          - {content_key: "en.a1.unit05.lesson01.exercise05.write_time", type: "writing_prompt", tested_text: "It's three o'clock", prompt: {target_blocks: [{text: "Write the time in words: 3:00.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit05.lesson02.quarter_times"
        title: "Quarter past and quarter to"
        spine_outcome_id: "universal.a1.time.ask_tell_time"
        teaching:
          - {content_key: "en.a1.unit05.lesson02.teach.quarter_past", kind: "phrase", target: {text: "It's a quarter past three.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "a", "quarter", "past", "three"]}
          - {content_key: "en.a1.unit05.lesson02.teach.quarter_to", kind: "phrase", target: {text: "It's a quarter to four.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "a", "quarter", "to", "four"]}
          - {content_key: "en.a1.unit05.lesson02.teach.ten_past", kind: "phrase", target: {text: "It's ten past four.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "ten", "past", "four"]}
          - {content_key: "en.a1.unit05.lesson02.teach.ten_to", kind: "phrase", target: {text: "It's ten to five.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "ten", "to", "five"]}
        exercises:
          - {content_key: "en.a1.unit05.lesson02.exercise01.listen_quarter", type: "listen_select", tested_text: "It's a quarter to four", media_asset_key: "en.a1.audio.time.oclock.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit05.lesson02.exercise02.choose_quarter_past"
            type: "multiple_choice"
            tested_text: "It's a quarter past three."
            prompt: {target_blocks: [{text: "3:15", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit05.lesson02.exercise03.choose_quarter_to"
            type: "multiple_choice"
            tested_text: "It's a quarter to four."
            prompt: {target_blocks: [{text: "3:45", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit05.lesson02.exercise04.order_ten_past", type: "word_order", tested_text: "It's ten past four", prompt: {target_blocks: [{text: "4:10", language_code: "en", direction: "ltr"}]}, word_bank: ["ten", "It's", "past", "four"]}
          - {content_key: "en.a1.unit05.lesson02.exercise05.write_ten_to", type: "writing_prompt", tested_text: "It's ten to five", prompt: {target_blocks: [{text: "Write the time in words: 4:50.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit05.lesson03.day_parts_schedules"
        title: "Parts of the day and simple schedules"
        spine_outcome_id: "universal.a1.time.ask_tell_time"
        teaching:
          - {content_key: "en.a1.unit05.lesson03.teach.morning", kind: "vocabulary", target: {text: "morning", language_code: "en", direction: "ltr"}, introduced_tokens: ["morning"], example: {text: "Good morning, Daniel!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit05.lesson03.teach.afternoon", kind: "vocabulary", target: {text: "afternoon", language_code: "en", direction: "ltr"}, introduced_tokens: ["afternoon"], example: {text: "I work in the afternoon.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit05.lesson03.teach.evening", kind: "vocabulary", target: {text: "evening", language_code: "en", direction: "ltr"}, introduced_tokens: ["evening"], example: {text: "Good evening, Leila!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit05.lesson03.teach.night", kind: "vocabulary", target: {text: "night", language_code: "en", direction: "ltr"}, introduced_tokens: ["night"], example: {text: "Good night, Daniel!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit05.lesson03.teach.at_nine_am", kind: "phrase", target: {text: "The store opens at nine in the morning.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "store", "opens", "at", "nine", "in", "the", "morning"]}
          - {content_key: "en.a1.unit05.lesson03.teach.at_six_pm", kind: "phrase", target: {text: "The store closes at six in the evening.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "store", "closes", "at", "six", "in", "the", "evening"]}
        exercises:
          - {content_key: "en.a1.unit05.lesson03.exercise01.listen_day_part", type: "listen_select", tested_text: "evening", media_asset_key: "en.a1.audio.time.day_parts.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit05.lesson03.exercise02.choose_open_time"
            type: "multiple_choice"
            tested_text: "The store opens at nine in the morning."
            prompt: {target_blocks: [{text: "When does the store open?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit05.lesson03.exercise03.choose_close_time"
            type: "multiple_choice"
            tested_text: "The store closes at six in the evening."
            prompt: {target_blocks: [{text: "When does the store close?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit05.lesson03.exercise04.match_day_parts", type: "matching_pairs", tested_text: "morning afternoon evening night", prompt: {target_blocks: []}, pairs: [{left: "6 AM - 12 PM", right: "morning"}, {left: "12 PM - 5 PM", right: "afternoon"}, {left: "5 PM - 9 PM", right: "evening"}, {left: "9 PM - 6 AM", right: "night"}]}
          - {content_key: "en.a1.unit05.lesson03.exercise05.write_open_time", type: "writing_prompt", tested_text: "The store opens at nine in the morning", prompt: {target_blocks: [{text: "Write when the store opens (9 AM).", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit05.lesson04.schedule_dialogue"
        title: "Library hours: a real schedule conversation"
        spine_outcome_id: "universal.a1.time.ask_tell_time"
        teaching:
          - {content_key: "en.a1.unit05.lesson04.teach.opens_at", kind: "vocabulary", target: {text: "opens at", language_code: "en", direction: "ltr"}, introduced_tokens: ["opens", "at"], example: {text: "The library opens at nine.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit05.lesson04.teach.closes_at", kind: "vocabulary", target: {text: "closes at", language_code: "en", direction: "ltr"}, introduced_tokens: ["closes", "at"], example: {text: "The library closes at six.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit05.lesson04.teach.q_open", kind: "dialogue", target: {text: "What time does the library open?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "time", "does", "the", "library", "open"]}
          - {content_key: "en.a1.unit05.lesson04.teach.a_open", kind: "dialogue", target: {text: "It opens at nine in the morning.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["It", "opens", "at", "nine", "in", "the", "morning"]}
          - {content_key: "en.a1.unit05.lesson04.teach.q_close", kind: "dialogue", target: {text: "And what time does it close?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["And", "what", "time", "does", "it", "close"]}
          - {content_key: "en.a1.unit05.lesson04.teach.a_close", kind: "dialogue", target: {text: "It closes at six in the evening.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["It", "closes", "at", "six", "in", "the", "evening"]}
          - {content_key: "en.a1.unit05.lesson04.teach.closing", kind: "dialogue", target: {text: "Great, see you at nine!", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Great", "see", "you", "at", "nine"]}
        exercises:
          - {content_key: "en.a1.unit05.lesson04.exercise01.listen_open_time", type: "dialogue_comprehension", tested_text: "It opens at nine in the morning", media_asset_key: "en.a1.audio.dialogue.schedule.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit05.lesson04.exercise02.listen_close_time", type: "listen_select", tested_text: "It closes at six in the evening", media_asset_key: "en.a1.audio.dialogue.schedule.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit05.lesson04.exercise03.choose_open_question"
            type: "multiple_choice"
            tested_text: "What time does the library open"
            prompt: {target_blocks: [{text: "Ask what time the library opens.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit05.lesson04.exercise04.order_close_question", type: "word_order", tested_text: "what time does it close", prompt: {target_blocks: []}, word_bank: ["time", "does", "it", "close", "what"]}
          - content_key: "en.a1.unit05.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "It opens at nine in the morning It closes at six in the evening"
            prompt: {target_blocks: [{text: "What time does the library open? And what time does it close?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit05.lesson04.exercise06.speak_hours"
            type: "speak_response"
            tested_text: "It opens at nine in the morning It closes at six in the evening"
            prompt: {target_blocks: [{text: "What time does the library open? And what time does it close?", language_code: "en", direction: "ltr"}]}
