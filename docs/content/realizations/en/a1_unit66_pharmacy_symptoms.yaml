course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English for describing simple symptoms to a pharmacist and asking for basic help without diagnosis or emergency language."

media_assets:
  - {content_key: "en.a1.audio.pharmacy_symptoms.words.cough.01", language: "en", text: "cough", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.pharmacy_symptoms.phrases.my_throat_hurts.01", language: "en", text: "My throat hurts.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"
    language: "en"
    text: "Leila: Hello. I have a cough. Pharmacist: Do you have a fever? Leila: No, I do not have a fever. My throat hurts. Pharmacist: Do you have a headache? Leila: Yes, I have a headache. Pharmacist: Take this medicine with water. Please ask a doctor if you feel worse. Leila: Thank you."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit66.pharmacy_symptoms"
    title: "Symptoms at a pharmacy"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.pharmacy.buy_basic_medicine"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit66.lesson01.symptom_words"
        title: "Words for symptoms"
        spine_outcome_id: "universal.a1.pharmacy.buy_basic_medicine"
        teaching:
          - {content_key: "en.a1.unit66.lesson01.teach.symptom", kind: "vocabulary", target: {text: "symptom", language_code: "en", direction: "ltr"}, introduced_tokens: ["symptom", "This", "is", "a"], example: {text: "This is a symptom.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit66.lesson01.teach.cough", kind: "vocabulary", target: {text: "cough", language_code: "en", direction: "ltr"}, introduced_tokens: ["cough", "I", "have"], example: {text: "I have a cough.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit66.lesson01.teach.fever", kind: "vocabulary", target: {text: "fever", language_code: "en", direction: "ltr"}, introduced_tokens: ["fever", "Do", "you"], example: {text: "Do you have a fever?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit66.lesson01.teach.throat", kind: "vocabulary", target: {text: "throat", language_code: "en", direction: "ltr"}, introduced_tokens: ["throat", "My", "hurts"], example: {text: "My throat hurts.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit66.lesson01.teach.headache", kind: "vocabulary", target: {text: "headache", language_code: "en", direction: "ltr"}, introduced_tokens: ["headache"], example: {text: "I have a headache.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit66.lesson01.teach.medicine", kind: "vocabulary", target: {text: "medicine", language_code: "en", direction: "ltr"}, introduced_tokens: ["medicine", "Take", "this"], example: {text: "Take this medicine.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit66.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "cough", media_asset_key: "en.a1.audio.pharmacy_symptoms.words.cough.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit66.lesson01.exercise02.choose_throat_meaning", type: "multiple_choice", tested_text: "throat", prompt: {target_blocks: [{text: "Which word means the part inside your neck?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson01.exercise03.match_symptom_words", type: "matching_pairs", tested_text: "symptom cough fever throat headache medicine", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a health problem you feel", right: "symptom"}, {left: "air comes out loudly from your chest", right: "cough"}, {left: "your body is too hot because you are sick", right: "fever"}, {left: "the part inside your neck", right: "throat"}, {left: "pain in your head", right: "headache"}, {left: "something you take when you are sick", right: "medicine"}]}
          - {content_key: "en.a1.unit66.lesson01.exercise04.order_cough_sentence", type: "word_order", tested_text: "I have a cough.", word_bank: ["I", "have", "a", "cough."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson01.exercise05.write_headache", type: "writing_prompt", tested_text: "headache", prompt: {target_blocks: [{text: "Write the word for pain in your head.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit66.lesson02.symptom_phrases"
        title: "Phrases for symptoms"
        spine_outcome_id: "universal.a1.pharmacy.buy_basic_medicine"
        teaching:
          - {content_key: "en.a1.unit66.lesson02.teach.have_cough", kind: "phrase", target: {text: "I have a cough.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "have", "a", "cough"]}
          - {content_key: "en.a1.unit66.lesson02.teach.throat_hurts", kind: "phrase", target: {text: "My throat hurts.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "throat", "hurts"]}
          - {content_key: "en.a1.unit66.lesson02.teach.have_headache", kind: "phrase", target: {text: "I have a headache.", language_code: "en", direction: "ltr"}, introduced_tokens: ["headache"]}
          - {content_key: "en.a1.unit66.lesson02.teach.have_medicine", kind: "phrase", target: {text: "Do you have medicine?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "medicine"]}
          - {content_key: "en.a1.unit66.lesson02.teach.with_water", kind: "phrase", target: {text: "Take this with water.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Take", "this", "with", "water"]}
          - {content_key: "en.a1.unit66.lesson02.teach.ask_doctor", kind: "phrase", target: {text: "Please ask a doctor.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Please", "ask", "doctor"]}
        exercises:
          - {content_key: "en.a1.unit66.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "My throat hurts.", media_asset_key: "en.a1.audio.pharmacy_symptoms.phrases.my_throat_hurts.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit66.lesson02.exercise02.choose_symptom_statement", type: "multiple_choice", tested_text: "I have a headache.", prompt: {target_blocks: [{text: "Which phrase says you have pain in your head?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson02.exercise03.choose_medicine_question", type: "multiple_choice", tested_text: "Do you have medicine?", prompt: {target_blocks: [{text: "Which phrase asks for medicine?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson02.exercise04.order_throat_sentence", type: "word_order", tested_text: "My throat hurts.", word_bank: ["My", "throat", "hurts."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson02.exercise05.translate_water", type: "translation", tested_text: "Take this with water.", prompt: {target_blocks: [{text: "Translate: \"Take this with water.\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit66.lesson03.dialogue_at_the_pharmacy"
        title: "Dialogue: At the pharmacy"
        spine_outcome_id: "universal.a1.pharmacy.buy_basic_medicine"
        teaching:
          - {content_key: "en.a1.unit66.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hello. I have a cough.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hello"], media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"}
          - {content_key: "en.a1.unit66.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Do you have a fever?", language_code: "en", direction: "ltr", speaker: "Pharmacist"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"}
          - {content_key: "en.a1.unit66.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "No, I do not have a fever. My throat hurts.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["No", "do", "not"], media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"}
          - {content_key: "en.a1.unit66.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Do you have a headache?", language_code: "en", direction: "ltr", speaker: "Pharmacist"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"}
          - {content_key: "en.a1.unit66.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Yes, I have a headache.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes"], media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"}
          - {content_key: "en.a1.unit66.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Take this medicine with water. Please ask a doctor if you feel worse.", language_code: "en", direction: "ltr", speaker: "Pharmacist"}, introduced_tokens: ["if", "feel", "worse"], media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"}
          - {content_key: "en.a1.unit66.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Thank you.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Thank"], media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01"}
        exercises:
          - {content_key: "en.a1.unit66.lesson03.exercise01.comprehension_first_symptom", type: "multiple_choice", tested_text: "cough", prompt: {target_blocks: [{text: "According to the dialogue, what symptom does Leila say first?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson03.exercise02.comprehension_fever", type: "multiple_choice", tested_text: "No, I do not have a fever", prompt: {target_blocks: [{text: "According to the dialogue, does Leila have a fever?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson03.exercise03.listen_dialogue_throat", type: "listen_select", tested_text: "My throat hurts.", media_asset_key: "en.a1.audio.dialogue.pharmacy_symptoms.01", prompt: {target_blocks: [{text: "Which symptom does Leila say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson03.exercise04.respond_own_symptom", type: "speak_response", tested_text: "I have a cough.", accepted_answers: ["I have a cough", "I have a cough.", "My throat hurts", "My throat hurts.", "I have a headache", "I have a headache.", "Do you have medicine", "Do you have medicine?"], prompt: {target_blocks: [{text: "Describe a symptom or ask for medicine.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit66.lesson04.pharmacy_note"
        title: "Reading: A pharmacy note"
        spine_outcome_id: "universal.a1.pharmacy.buy_basic_medicine"
        teaching:
          - {content_key: "en.a1.unit66.lesson04.teach.pharmacy_note", kind: "reading", target: {text: "Pharmacy note: Cough and sore throat. No fever. Take medicine with water. Ask a doctor if worse.", language_code: "en", direction: "ltr"}, introduced_tokens: ["note", "sore"]}
          - {content_key: "en.a1.unit66.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Visit to the Pharmacy: Leila went to the pharmacy because she had a cough and her throat hurt. The pharmacist asked if she had a fever. Leila said she did not have a fever, but she had a headache. The pharmacist gave her medicine and said to take it with water. The note said to ask a doctor if she felt worse.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Visit", "to", "went", "because", "she", "had", "her", "hurt", "The", "pharmacist", "asked", "said", "but", "gave", "her", "it", "felt"]}
        exercises:
          - {content_key: "en.a1.unit66.lesson04.exercise01.note_symptom", type: "multiple_choice", tested_text: "Cough", prompt: {target_blocks: [{text: "According to the note, what symptom is named?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson04.exercise02.note_fever", type: "multiple_choice", tested_text: "No fever", prompt: {target_blocks: [{text: "According to the note, does Leila have a fever?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson04.exercise03.reading_medicine", type: "multiple_choice", tested_text: "with water", prompt: {target_blocks: [{text: "According to the reading, how should Leila take the medicine?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson04.exercise04.reading_who_helped", type: "multiple_choice", tested_text: "the pharmacist", prompt: {target_blocks: [{text: "According to the reading, who helped Leila?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit66.lesson04.exercise05.write_own_pharmacy_message", type: "writing_prompt", tested_text: "I have a cough. My throat hurts.", prompt: {target_blocks: [{text: "Write a short message: say you have a cough, and say your throat hurts.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I have a cough. My throat hurts.", "I have a cough, and my throat hurts.", "I have a cough and my throat hurts."]}
