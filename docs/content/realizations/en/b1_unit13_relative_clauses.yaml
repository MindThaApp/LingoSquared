schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "B1"
generation_provenance:
  method: "authored_from_scratch_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Authored from scratch from universal_spine.yaml's
    universal.b1.narrative.combine_descriptions_with_relative_clauses outcome
    and the shared English B1 realization conventions established in units
    01-12. Not adapted from external course material.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    2026-07-12 fresh-context review (Claude Opus). Verified: the comma rule in
    the lesson02 grammar note is stated correctly (defining = no commas,
    identifies which one; non-defining = commas, adds extra information about
    someone already identified) and the teaching sentences model both correctly
    ("The colleague who sits next to Mia is very organized." / "Daniel, who
    joined the team in March, already leads two projects." / "Their office,
    which is on the fifth floor, ..."); who/which/that/whose/where are each
    used accurately; Mia/Leila/Daniel continuity holds against units 09-11
    (Daniel's evening class and work reports, Leila's design course) with no
    contradictions; matching_pairs has 6 pairs with no duplicate left or right
    values; no YAML booleans or snake_case leaks; dialogue cards all use
    target.speaker. Fixed 1 defect: lesson02.exercise04's prompt asked "Which
    colleague always meets her deadlines?" while the expected answer is "The
    colleague who sits next to Mia is very organized" -- the answer does not
    answer the question (AUTHORING_GUIDE §5), and *deadline* is not introduced
    until lesson03; the prompt is now "Which colleague is very organized?".
    OPEN (flagged, not changed): two defining relative clauses use *which*
    where American style prefers *that* ("The design course which Leila chose
    starts in June.", "...the project which won the award last month?") --
    grammatical, but the unit is en_US_neutral and its own matching gloss ties
    *that* to defining clauses; a coordinator ruling on how prescriptive to be
    is wanted. LIMITATION: no X-to-en overlays exist yet, so distractors and
    accepted_answers could not be machine-checked; lesson04.exercise03 must not
    take "the person whose desk is near the window" as a distractor (it is also
    a true description of the new coworker).
    Review 2026-10-22 (shared-en r3): 3 fixes - lesson03 exercise01 prompt
    reworded ('already done' did not fit 'leads'); listen distractors heard in
    the audio replaced; accepted answers made consistent (who/that, co-
    worker/colleague, contractions). NATIVE FLAGS: none.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: combining two facts about a person, place, or thing with a relative clause (who/which/that/whose/where), distinguishing defining clauses (no commas) from non-defining clauses (commas)."

media_assets:
  - {content_key: "en.b1.audio.relative_clauses.phrase.coworker.01", language: "en", text: "coworker", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.relative_clauses.sentence.01", language: "en", text: "The colleague who sits next to Mia is very organized.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.relative_clauses.01"
    language: "en"
    text: "Mia: Leila, have you met the woman who just joined our team? Leila: Not yet. Is she the person whose desk is near the window? Mia: Yes, that is her. She is the designer who finished the logo project. Leila: Oh, I remember. Is that the project which won the award last month? Mia: Exactly. The office where she used to work was much smaller than ours. Leila: That explains why she loves the kitchen where everyone eats lunch together."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit13.relative_clauses"
    title: "The colleague who sits next to Mia"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.narrative.combine_descriptions_with_relative_clauses"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit13.lesson01.relative_clause_vocabulary"
        title: "Who, which, that, whose, and where"
        spine_outcome_id: "universal.b1.narrative.combine_descriptions_with_relative_clauses"
        teaching:
          - {content_key: "en.b1.unit13.lesson01.teach.who", kind: "vocabulary", target: {text: "who", language_code: "en", direction: "ltr"}, introduced_tokens: ["who"], example: {text: "Daniel, who joined the team in March, already leads two projects.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit13.lesson01.teach.which", kind: "vocabulary", target: {text: "which", language_code: "en", direction: "ltr"}, introduced_tokens: ["which"], example: {text: "The design course which Leila chose starts in June.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit13.lesson01.teach.that_relative", kind: "vocabulary", target: {text: "that", language_code: "en", direction: "ltr"}, introduced_tokens: ["that", "called", "wants", "meeting"], example: {text: "The client that called this morning wants a meeting.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit13.lesson01.teach.whose", kind: "vocabulary", target: {text: "whose", language_code: "en", direction: "ltr"}, introduced_tokens: ["whose", "project", "already", "approved", "design"], example: {text: "The client whose project they are finishing has already approved the design.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit13.lesson01.teach.where", kind: "vocabulary", target: {text: "where", language_code: "en", direction: "ltr"}, introduced_tokens: ["where", "downtown"], example: {text: "The office where Daniel works is downtown.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit13.lesson01.teach.coworker", kind: "vocabulary", target: {text: "coworker", language_code: "en", direction: "ltr"}, introduced_tokens: ["coworker", "studies", "Spanish", "evening"], example: {text: "Mia has a coworker who studies Spanish in the evening.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit13.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "coworker", media_asset_key: "en.b1.audio.relative_clauses.phrase.coworker.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit13.lesson01.exercise02.choose_whose", type: "multiple_choice", tested_text: "whose", prompt: {target_blocks: [{text: "Which word shows possession inside a relative clause?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson01.exercise03.choose_where", type: "multiple_choice", tested_text: "where", prompt: {target_blocks: [{text: "Which word refers to a place inside a relative clause?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson01.exercise04.match_relative_words", type: "matching_pairs", tested_text: "who which that whose where coworker", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "who", right: "refers to a person in a relative clause"}, {left: "which", right: "refers to a thing in a relative clause"}, {left: "that", right: "refers to a person or thing in a defining relative clause"}, {left: "whose", right: "shows possession inside a relative clause"}, {left: "where", right: "refers to a place inside a relative clause"}, {left: "coworker", right: "someone you work with"}]}
          - {content_key: "en.b1.unit13.lesson01.exercise05.write_coworker", type: "writing_prompt", tested_text: "coworker", prompt: {target_blocks: [{text: "Write the word that means someone you work with.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit13.lesson02.defining_and_nondefining"
        title: "Defining and non-defining clauses"
        spine_outcome_id: "universal.b1.narrative.combine_descriptions_with_relative_clauses"
        teaching:
          - {content_key: "en.b1.unit13.lesson02.teach.colleague_organized", kind: "phrase", target: {text: "The colleague who sits next to Mia is very organized.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "colleague", "sits", "next", "to", "Mia", "is", "very", "organized"], media_asset_key: "en.b1.audio.relative_clauses.sentence.01"}
          - {content_key: "en.b1.unit13.lesson02.teach.daniel_leads_projects", kind: "phrase", target: {text: "Daniel, who joined the team in March, already leads two projects.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "joined", "team", "in", "March", "already", "leads", "two", "projects"]}
          - {content_key: "en.b1.unit13.lesson02.teach.grammar_defining", kind: "grammar_note", target: {text: "Use a defining relative clause with no commas to say exactly which person or thing you mean: The colleague who sits next to Mia is organized. Use a non-defining relative clause with commas to add extra information about someone already identified: Daniel, who joined in March, already leads two projects.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Use", "defining", "relative", "clause", "with", "no", "commas", "say", "exactly", "person", "thing", "mean", "non-defining", "add", "extra", "information", "about", "someone", "identified"]}
        exercises:
          - {content_key: "en.b1.unit13.lesson02.exercise01.choose_defining_clause", type: "multiple_choice", tested_text: "The colleague who sits next to Mia is very organized.", prompt: {target_blocks: [{text: "Which sentence uses a defining relative clause with no commas?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson02.exercise02.choose_nondefining_clause", type: "multiple_choice", tested_text: "Daniel, who joined the team in March, already leads two projects.", prompt: {target_blocks: [{text: "Which sentence uses a non-defining relative clause with commas to add extra information?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson02.exercise03.order_colleague_organized", type: "word_order", tested_text: "The colleague who sits next to Mia is very organized", prompt: {target_blocks: []}, word_bank: ["colleague", "who", "sits", "next", "to", "Mia", "is", "very", "organized", "The"]}
          - {content_key: "en.b1.unit13.lesson02.exercise04.reply_which_colleague", type: "dialogue_response", tested_text: "The colleague who sits next to Mia is very organized", prompt: {target_blocks: [{text: "Which colleague is very organized?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson02.exercise05.write_daniel_leads", type: "writing_prompt", tested_text: "Daniel, who joined the team in March, already leads two projects.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit13.lesson03.reading_the_new_office"
        title: "Reading: the new office"
        spine_outcome_id: "universal.b1.narrative.combine_descriptions_with_relative_clauses"
        teaching:
          - {content_key: "en.b1.unit13.lesson03.teach.deadline", kind: "vocabulary", target: {text: "deadline", language_code: "en", direction: "ltr"}, introduced_tokens: ["deadline", "meets", "her", "deadlines"], example: {text: "The colleague who sits next to Mia always meets her deadlines.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit13.lesson03.teach.approve", kind: "vocabulary", target: {text: "approve", language_code: "en", direction: "ltr"}, introduced_tokens: ["approve", "first"], example: {text: "The client has already approved the first design.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit13.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Mia works with several people who make her job easier. Daniel, who joined the team in March, already leads two projects. The colleague who sits next to Mia is very organized and always meets deadlines. Their office, which is on the fifth floor, has a small kitchen where everyone eats lunch together. The client whose project they are finishing has already approved the first design.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["works", "with", "several", "people", "make", "job", "easier", "Their", "office", "a", "on", "fifth", "floor", "has", "small", "kitchen", "everyone", "eats", "lunch", "together", "they", "finishing", "has already"]
        exercises:
          - {content_key: "en.b1.unit13.lesson03.exercise01.comprehend_daniel_leads", type: "reading_comprehension", tested_text: "already leads two projects", prompt: {target_blocks: [{text: "What does the text say about Daniel, who joined the team in March?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson03.exercise02.comprehend_client_approved", type: "reading_comprehension", tested_text: "has already approved the first design", prompt: {target_blocks: [{text: "What has the client, whose project they are finishing, already done?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson03.exercise03.recognize_deadline", type: "multiple_choice", tested_text: "deadline", prompt: {target_blocks: [{text: "Which word means the date or time by which something must be finished?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson03.exercise04.order_office_kitchen", type: "word_order", tested_text: "Their office which is on the fifth floor has a small kitchen", prompt: {target_blocks: []}, word_bank: ["office", "which", "is", "on", "the", "fifth", "floor", "has", "a", "small", "kitchen", "Their"]}
          - {content_key: "en.b1.unit13.lesson03.exercise05.write_colleague_organized", type: "writing_prompt", tested_text: "The colleague who sits next to Mia is very organized.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit13.lesson04.the_new_coworker_dialogue"
        title: "The woman who just joined our team"
        spine_outcome_id: "universal.b1.narrative.combine_descriptions_with_relative_clauses"
        teaching:
          - {content_key: "en.b1.unit13.lesson04.teach.q_met_the_woman", kind: "dialogue", target: {text: "Leila, have you met the woman who just joined our team?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["have", "you", "met", "woman", "just", "joined", "our", "team"], media_asset_key: "en.b1.audio.dialogue.relative_clauses.01"}
          - {content_key: "en.b1.unit13.lesson04.teach.a_whose_desk", kind: "dialogue", target: {text: "Not yet. Is she the person whose desk is near the window?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Not", "yet", "Is", "she", "person", "desk", "near", "window"]}
          - {content_key: "en.b1.unit13.lesson04.teach.q_the_designer_who", kind: "dialogue", target: {text: "Yes, that is her. She is the designer who finished the logo project.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Yes", "that", "her", "She", "designer", "finished", "logo", "project"]}
          - {content_key: "en.b1.unit13.lesson04.teach.a_which_won_award", kind: "dialogue", target: {text: "Oh, I remember. Is that the project which won the award last month?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Oh", "remember", "won", "award", "last", "month"]}
          - {content_key: "en.b1.unit13.lesson04.teach.q_office_smaller", kind: "dialogue", target: {text: "Exactly. The office where she used to work was much smaller than ours.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Exactly", "office", "where", "used", "work", "was", "much", "smaller", "than", "ours"]}
          - {content_key: "en.b1.unit13.lesson04.teach.a_kitchen_where", kind: "dialogue", target: {text: "That explains why she loves the kitchen where everyone eats lunch together.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["explains", "why", "loves", "kitchen", "everyone", "eats", "lunch", "together"]}
        exercises:
          - {content_key: "en.b1.unit13.lesson04.exercise01.listen_who_joined_team", type: "dialogue_comprehension", tested_text: "the woman who just joined our team", media_asset_key: "en.b1.audio.dialogue.relative_clauses.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit13.lesson04.exercise02.listen_desk_location", type: "listen_select", tested_text: "whose desk is near the window", media_asset_key: "en.b1.audio.dialogue.relative_clauses.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit13.lesson04.exercise03.choose_who_the_new_coworker_is", type: "multiple_choice", tested_text: "the designer who finished the logo project", prompt: {target_blocks: [{text: "Who is the new coworker Mia describes?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit13.lesson04.exercise04.order_office_smaller", type: "word_order", tested_text: "The office where she used to work was much smaller than ours", prompt: {target_blocks: []}, word_bank: ["office", "where", "she", "used", "to", "work", "was", "much", "smaller", "than", "ours", "The"]}
          - content_key: "en.b1.unit13.lesson04.exercise05.reply_as_mia"
            type: "dialogue_response"
            tested_text: "She is the designer who finished the logo project"
            prompt: {target_blocks: [{text: "Not yet. Is she the person whose desk is near the window?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit13.lesson04.exercise06.speak_relative_clause_dialogue"
            type: "speak_response"
            tested_text: "That explains why she loves the kitchen where everyone eats lunch together"
            prompt: {target_blocks: [{text: "Exactly. The office where she used to work was much smaller than ours.", language_code: "en", direction: "ltr"}]}
