course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Talking about household chores stays in simple present tense with fixed verb+object collocations that must be memorized: wash the dishes, do the laundry, take out the trash, clean the bathroom, vacuum the living room. Keep the register casual and cooperative, appropriate for friends or roommates splitting chores or helping each other clean, not a formal chore chart."

