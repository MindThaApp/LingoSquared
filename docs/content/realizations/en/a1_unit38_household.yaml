  - content_key: "en.a1.audio.dialogue.household.01"
    language: "en"
    text: "Mia: My apartment is a mess. I have people coming over this weekend. Daniel: Do you want some help cleaning it? Mia: Yes, please! I need to vacuum the living room and wash the dishes. Daniel: I can vacuum for you. You can wash the dishes. Mia: Thanks! I still need to do the laundry too. Daniel: I don't have time for that today, but I can take out the trash before I leave. Mia: That would help a lot. Thank you so much!"
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

