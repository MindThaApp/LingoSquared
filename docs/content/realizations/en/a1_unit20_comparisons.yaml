units:
  - content_key: "en.a1.unit20.comparisons"
    title: "Making basic comparisons"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.comparisons.make_basic_comparisons"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit20.lesson01.comparative_adjectives"
        title: "Comparative adjectives"
        spine_outcome_id: "universal.a1.comparisons.make_basic_comparisons"
        teaching:
          - {content_key: "en.a1.unit20.lesson01.teach.bigger", kind: "vocabulary", target: {text: "bigger", language_code: "en", direction: "ltr"}, introduced_tokens: ["bigger"], example: {text: "This jacket is bigger than that one.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit20.lesson01.teach.smaller", kind: "vocabulary", target: {text: "smaller", language_code: "en", direction: "ltr"}, introduced_tokens: ["smaller"], example: {text: "This shirt is smaller than that one.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit20.lesson01.teach.cheaper", kind: "vocabulary", target: {text: "cheaper", language_code: "en", direction: "ltr"}, introduced_tokens: ["cheaper"], example: {text: "This shirt is cheaper than that one.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit20.lesson01.teach.more_expensive", kind: "vocabulary", target: {text: "more expensive", language_code: "en", direction: "ltr"}, introduced_tokens: ["more", "expensive"], example: {text: "This jacket is more expensive than that one.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit20.lesson01.teach.faster", kind: "vocabulary", target: {text: "faster", language_code: "en", direction: "ltr"}, introduced_tokens: ["faster"], example: {text: "My car is faster than his car.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit20.lesson01.exercise01.listen_adjective", type: "listen_select", tested_text: "cheaper", media_asset_key: "en.a1.audio.comparisons.adjectives.cheaper.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit20.lesson01.exercise02.choose_opposite_of_bigger", type: "multiple_choice", tested_text: "smaller", prompt: {target_blocks: [{text: "What is the opposite of 'bigger'?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson01.exercise03.choose_comparative_of_expensive", type: "multiple_choice", tested_text: "more expensive", prompt: {target_blocks: [{text: "What is the comparative form of 'expensive'?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson01.exercise04.match_comparatives", type: "matching_pairs", tested_text: "bigger smaller cheaper faster", prompt: {target_blocks: [{text: "Match each comparative to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "bigger", right: "big"}, {left: "smaller", right: "small"}, {left: "cheaper", right: "cheap"}, {left: "faster", right: "fast"}, {left: "more expensive", right: "expensive"}]}
          - {content_key: "en.a1.unit20.lesson01.exercise05.write_faster", type: "writing_prompt", tested_text: "faster", prompt: {target_blocks: [{text: "Write the comparative form of 'fast'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit20.lesson02.comparing_with_than"
        title: "Comparing two things with 'than'"
        spine_outcome_id: "universal.a1.comparisons.make_basic_comparisons"
        teaching:
          - {content_key: "en.a1.unit20.lesson02.teach.which_is_cheaper", kind: "phrase", target: {text: "Which bag is cheaper, the small one or the big one?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Which", "bag", "is", "the", "small", "one", "or", "big"]}
          - {content_key: "en.a1.unit20.lesson02.teach.small_cheaper_than_big", kind: "phrase", target: {text: "The small bag is cheaper than the big bag.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "than"]}
          - {content_key: "en.a1.unit20.lesson02.teach.big_bag_nicer", kind: "phrase", target: {text: "The big bag is nicer than the small bag.", language_code: "en", direction: "ltr"}, introduced_tokens: ["nicer"]}
        exercises:
          - {content_key: "en.a1.unit20.lesson02.exercise01.listen_question", type: "listen_select", tested_text: "Which bag is cheaper", media_asset_key: "en.a1.audio.comparisons.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit20.lesson02.exercise02.choose_correct_comparison", type: "multiple_choice", tested_text: "The small bag is cheaper than the big bag.", prompt: {target_blocks: [{text: "The small bag costs less than the big bag. How do you say this?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson02.exercise03.order_nicer_than", type: "word_order", tested_text: "The big bag is nicer than the small bag", prompt: {target_blocks: []}, word_bank: ["big", "bag", "is", "nicer", "than", "the", "small", "bag", "The"]}
          - {content_key: "en.a1.unit20.lesson02.exercise04.reply_which_bag", type: "dialogue_response", tested_text: "The small bag is cheaper than the big bag", prompt: {target_blocks: [{text: "Which bag is cheaper, the small one or the big one?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson02.exercise05.write_comparison", type: "writing_prompt", tested_text: "The big bag is nicer than the small bag.", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit20.lesson03.reading_a_comparison"
        title: "Reading a comparison of three cars"
        spine_outcome_id: "universal.a1.comparisons.make_basic_comparisons"
        teaching:
          - {content_key: "en.a1.unit20.lesson03.teach.cheapest", kind: "vocabulary", target: {text: "cheapest", language_code: "en", direction: "ltr"}, introduced_tokens: ["cheapest"], example: {text: "This is the cheapest shirt in the store.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit20.lesson03.teach.car_comparison_text", kind: "reading", target: {text: "The red car is faster than the blue car, but the blue car is cheaper. The white car is the cheapest of the three.", language_code: "en", direction: "ltr"}, introduced_tokens: ["red", "car", "faster", "blue", "but", "cheaper", "white", "cheapest", "of", "three"]}
        exercises:
          - {content_key: "en.a1.unit20.lesson03.exercise01.read_fastest_car", type: "reading_comprehension", tested_text: "the red car", prompt: {target_blocks: [{text: "Which car is faster, the red car or the blue car?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson03.exercise02.read_cheapest_car", type: "reading_comprehension", tested_text: "the white car", prompt: {target_blocks: [{text: "Which car is the cheapest?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson03.exercise03.choose_true_statement", type: "multiple_choice", tested_text: "The blue car is cheaper than the red car.", prompt: {target_blocks: [{text: "Which statement is true?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson03.exercise04.order_cheapest_of_three", type: "word_order", tested_text: "The white car is the cheapest of the three", prompt: {target_blocks: []}, word_bank: ["white", "car", "is", "the", "cheapest", "of", "the", "three", "The"]}
          - {content_key: "en.a1.unit20.lesson03.exercise05.write_fastest_statement", type: "writing_prompt", tested_text: "The red car is faster than the blue car.", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit20.lesson04.comparison_dialogue"
        title: "Comparing two bags in a conversation"
        spine_outcome_id: "universal.a1.comparisons.make_basic_comparisons"
        teaching:
          - {content_key: "en.a1.unit20.lesson04.teach.how_much_cheaper", kind: "phrase", target: {text: "How much cheaper?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "much"]}
          - {content_key: "en.a1.unit20.lesson04.teach.by_five_dollars", kind: "phrase", target: {text: "cheaper by five dollars", language_code: "en", direction: "ltr"}, introduced_tokens: ["by", "five", "dollars"]}
          - {content_key: "en.a1.unit20.lesson04.teach.q_which_bag", kind: "dialogue", target: {text: "Which bag do you like, the small one or the big one?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["do", "you", "like"]}
          - {content_key: "en.a1.unit20.lesson04.teach.a_big_nicer_small_cheaper", kind: "dialogue", target: {text: "The big one is nicer, but the small one is cheaper.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["one"]}
          - {content_key: "en.a1.unit20.lesson04.teach.q_how_much_cheaper", kind: "dialogue", target: {text: "How much cheaper?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit20.lesson04.teach.a_ten_fifteen_dollars", kind: "dialogue", target: {text: "The small one is ten dollars, and the big one is fifteen dollars.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["ten", "dollars", "and", "fifteen"]}
          - {content_key: "en.a1.unit20.lesson04.teach.a_cheaper_by_five", kind: "dialogue", target: {text: "Okay, the small one is cheaper by five dollars. I'll get the small one.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Okay", "I'll", "get"]}
        exercises:
          - {content_key: "en.a1.unit20.lesson04.exercise01.listen_which_is_nicer", type: "dialogue_comprehension", tested_text: "the big bag", media_asset_key: "en.a1.audio.dialogue.comparing_bags.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit20.lesson04.exercise02.listen_price_difference", type: "listen_select", tested_text: "five dollars", media_asset_key: "en.a1.audio.dialogue.comparing_bags.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit20.lesson04.exercise03.choose_which_bag_leila_buys", type: "multiple_choice", tested_text: "the small bag", prompt: {target_blocks: [{text: "Which bag does Leila decide to buy?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit20.lesson04.exercise04.order_how_much_cheaper", type: "word_order", tested_text: "How much cheaper", prompt: {target_blocks: []}, word_bank: ["much", "cheaper", "How"]}
