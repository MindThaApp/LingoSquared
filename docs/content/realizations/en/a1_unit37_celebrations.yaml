        spine_outcome_id: "universal.a1.celebrations.talk_about_celebrations"
        teaching:
          - {content_key: "en.a1.unit37.lesson02.teach.invite_someone_to", kind: "phrase", target: {text: "invite someone to", language_code: "en", direction: "ltr"}, introduced_tokens: ["invite", "someone", "to", "I", "my", "coworkers", "birthday", "party"], example: {text: "I invite my coworkers to my birthday party.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson02.teach.congratulate_someone_on", kind: "phrase", target: {text: "congratulate someone on", language_code: "en", direction: "ltr"}, introduced_tokens: ["congratulate", "someone", "on", "We", "him", "his", "promotion"], example: {text: "We congratulate him on his promotion.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson02.teach.wish_someone_happy_birthday", kind: "phrase", target: {text: "wish someone a happy birthday", language_code: "en", direction: "ltr"}, introduced_tokens: ["wish", "someone", "a", "happy", "birthday", "I", "want", "to", "you"], example: {text: "I want to wish you a happy birthday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson02.teach.surprise_party", kind: "vocabulary", target: {text: "surprise party", language_code: "en", direction: "ltr"}, introduced_tokens: ["surprise", "party", "They", "are", "planning", "a", "for", "her"], example: {text: "They are planning a surprise party for her.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson02.teach.have_a_party", kind: "phrase", target: {text: "have a party", language_code: "en", direction: "ltr"}, introduced_tokens: ["have", "a", "party", "We", "every", "year", "in", "October"], example: {text: "We have a party every year in October.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson02.teach.come_to_my_party_question", kind: "phrase", target: {text: "Do you want to come to my party?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "want", "to", "come", "my", "party"]}
        exercises:
