    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit37.lesson01.celebration_vocabulary"
        title: "Birthdays and celebrations"
        spine_outcome_id: "universal.a1.celebrations.talk_about_celebrations"
        teaching:
          - {content_key: "en.a1.unit37.lesson01.teach.birthday", kind: "vocabulary", target: {text: "birthday", language_code: "en", direction: "ltr"}, introduced_tokens: ["birthday", "My", "is", "in", "October"], example: {text: "My birthday is in October.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson01.teach.party", kind: "vocabulary", target: {text: "party", language_code: "en", direction: "ltr"}, introduced_tokens: ["party", "We", "are", "having", "a", "on", "Saturday"], example: {text: "We are having a party on Saturday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson01.teach.gift", kind: "vocabulary", target: {text: "gift", language_code: "en", direction: "ltr"}, introduced_tokens: ["gift", "I", "bought", "her", "a", "nice"], example: {text: "I bought her a nice gift.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson01.teach.invite", kind: "vocabulary", target: {text: "invite", language_code: "en", direction: "ltr"}, introduced_tokens: ["invite", "I", "want", "to", "my", "friends"], example: {text: "I want to invite my friends.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson01.teach.celebrate", kind: "vocabulary", target: {text: "celebrate", language_code: "en", direction: "ltr"}, introduced_tokens: ["celebrate", "Let's", "together"], example: {text: "Let's celebrate together!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit37.lesson01.teach.congratulations", kind: "vocabulary", target: {text: "congratulations", language_code: "en", direction: "ltr"}, introduced_tokens: ["congratulations", "Congratulations", "on", "your", "new", "job"], example: {text: "Congratulations on your new job!", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit37.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "party", media_asset_key: "en.a1.audio.celebrations.words.party.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit37.lesson01.exercise02.choose_gift_meaning", type: "multiple_choice", tested_text: "gift", prompt: {target_blocks: [{text: "Which word means something you give someone to celebrate an occasion?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson01.exercise03.match_celebration_words", type: "matching_pairs", tested_text: "birthday party gift invite celebrate congratulations", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "the day of the year you were born, celebrated every year", right: "birthday"}, {left: "a gathering with friends or family to celebrate something", right: "party"}, {left: "something you give someone to celebrate an occasion", right: "gift"}, {left: "to ask someone to come to an event", right: "invite"}, {left: "to do something enjoyable to mark a special occasion", right: "celebrate"}, {left: "words you say to praise someone for a happy event or success", right: "congratulations"}]}
          - {content_key: "en.a1.unit37.lesson01.exercise04.order_party_sentence", type: "word_order", tested_text: "We are having a party on Saturday.", word_bank: ["We", "are", "having", "a", "party", "on", "Saturday."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson01.exercise05.write_gift_word", type: "writing_prompt", tested_text: "gift", prompt: {target_blocks: [{text: "Write the word for something you give someone to celebrate an occasion.", language_code: "en", direction: "ltr"}]}}

