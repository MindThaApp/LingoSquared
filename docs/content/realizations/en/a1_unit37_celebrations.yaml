          - {content_key: "en.a1.unit37.lesson02.exercise04.order_have_a_party_sentence", type: "word_order", tested_text: "We have a party every year in October.", word_bank: ["We", "have", "a", "party", "every", "year", "in", "October."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson02.exercise05.translate_come_to_party", type: "translation", tested_text: "Do you want to come to my party?", prompt: {target_blocks: [{text: "Translate: \"Do you want to come to my party?\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit37.lesson03.dialogue_surprise_party"
        title: "Dialogue: Planning a surprise party"
        spine_outcome_id: "universal.a1.celebrations.talk_about_celebrations"
        teaching:
          - {content_key: "en.a1.unit37.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Did you know Daniel's birthday is October 12th?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Did", "you", "know", "Daniel's", "birthday", "is", "October", "12th"], media_asset_key: "en.a1.audio.dialogue.celebrations.01"}
          - {content_key: "en.a1.unit37.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "No, I didn't! That's next Friday.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["No", "I", "didn't", "That's", "next", "Friday"]}
          - {content_key: "en.a1.unit37.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "Let's have a surprise party for him at the office.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Let's", "have", "a", "surprise", "party", "for", "him", "at", "the", "office"]}
          - {content_key: "en.a1.unit37.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Great idea! I can invite the rest of the team.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Great", "idea", "I", "can", "invite", "the", "rest", "of", "team"]}
          - {content_key: "en.a1.unit37.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Perfect. I'll buy him a gift -- maybe new running shoes, since he loves running.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Perfect", "I'll", "buy", "him", "a", "gift", "maybe", "new", "running", "shoes", "since", "he", "loves"]}
          - {content_key: "en.a1.unit37.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "That's a great idea. Should we get a cake too?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["That's", "a", "great", "idea", "Should", "we", "get", "cake", "too"]}
          - {content_key: "en.a1.unit37.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Yes, definitely! We'll all congratulate him together.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "definitely", "We'll", "all", "congratulate", "him", "together"]}
        exercises:
          - {content_key: "en.a1.unit37.lesson03.exercise01.comprehension_daniel_birthday", type: "multiple_choice", tested_text: "October 12th", prompt: {target_blocks: [{text: "According to the dialogue, when is Daniel's birthday?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson03.exercise02.comprehension_leila_gift", type: "multiple_choice", tested_text: "running shoes", prompt: {target_blocks: [{text: "According to the dialogue, what gift does Leila plan to buy Daniel?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson03.exercise03.listen_dialogue_plan", type: "listen_select", tested_text: "a surprise party", media_asset_key: "en.a1.audio.dialogue.celebrations.01", prompt: {target_blocks: [{text: "According to the dialogue, what are Leila and Mia planning for Daniel?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson03.exercise04.respond_own_wish", type: "speak_response", tested_text: "Congratulations", accepted_answers: ["Congratulations!", "Congratulations", "Happy birthday!", "Happy birthday", "Do you want to come to my party?", "Do you want to come to my party.", "I want to invite you to my party", "I want to invite you to my party.", "Congratulations on your promotion", "Congratulations on your promotion."], prompt: {target_blocks: [{text: "Say something you could say to invite someone to a celebration or to congratulate them.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit37.lesson04.the_surprise_party"
        title: "Reading: The surprise party"
        spine_outcome_id: "universal.a1.celebrations.talk_about_celebrations"
        teaching:
          - {content_key: "en.a1.unit37.lesson04.teach.reading_passage", kind: "reading", target: {text: "Daniel didn't know that Leila and Mia were planning a surprise party for him. On October 12th, his birthday, he arrived at work and found balloons and a cake in the break room. Everyone said \"Happy birthday!\" and congratulated him. Leila gave him a new pair of running shoes. Mia gave him a framed photo of the three coworkers together, one she took herself. Daniel was very happy and thanked everyone for the wonderful surprise.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "didn't", "know", "that", "Leila", "and", "Mia", "were", "planning", "a", "surprise", "party", "for", "him", "On", "October", "12th", "his", "birthday", "he", "arrived", "at", "work", "and", "found", "balloons", "a", "cake", "in", "the", "break", "room", "Everyone", "said", "Happy", "birthday", "and", "congratulated", "him", "Leila", "gave", "him", "a", "new", "pair", "of", "running", "shoes", "Mia", "gave", "him", "a", "framed", "photo", "of", "the", "three", "coworkers", "together", "one", "she", "took", "herself", "Daniel", "was", "very", "happy", "and", "thanked", "everyone", "for", "the", "wonderful", "surprise"]}
        exercises:
          - {content_key: "en.a1.unit37.lesson04.exercise01.reading_daniel_date", type: "multiple_choice", tested_text: "October 12th", prompt: {target_blocks: [{text: "According to the reading, what is the date of Daniel's birthday?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson04.exercise02.reading_leila_gift", type: "multiple_choice", tested_text: "running shoes", prompt: {target_blocks: [{text: "According to the reading, what gift did Leila give Daniel?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson04.exercise03.reading_mia_gift", type: "multiple_choice", tested_text: "a framed photo", prompt: {target_blocks: [{text: "According to the reading, what gift did Mia give Daniel?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit37.lesson04.exercise04.write_own_celebration_sentence", type: "writing_prompt", tested_text: "invite", prompt: {target_blocks: [{text: "Write one sentence inviting someone to a celebration or congratulating them, using \"Do you want to come to\", \"Happy birthday\", or \"Congratulations on\".", language_code: "en", direction: "ltr"}]}, accepted_answers: ["Do you want to come to my party?", "Do you want to come to my party.", "Happy birthday!", "Happy birthday", "Congratulations on your new job", "Congratulations on your new job.", "Congratulations on your promotion", "Congratulations on your promotion."]}
