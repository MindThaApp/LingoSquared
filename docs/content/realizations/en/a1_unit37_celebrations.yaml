course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Talking about celebrations stays in simple present tense with fixed collocations that must be memorized: invite someone to a party, congratulate someone on something, wish someone a happy birthday, have a party. Keep the register warm and casual, appropriate for coworkers celebrating a birthday together, not formal event planning."

media_assets:
  - {content_key: "en.a1.audio.celebrations.words.party.01", language: "en", text: "party", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.celebrations.phrases.congratulate_someone_on.01", language: "en", text: "congratulate someone on", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.celebrations.01"
    language: "en"
    text: "Leila: Did you know Daniel's birthday is October 12th? Mia: No, I didn't! That's next Friday. Leila: Let's have a surprise party for him at the office. Mia: Great idea! I can invite the rest of the team. Leila: Perfect. I'll buy him a gift -- maybe new running shoes, since he loves running. Mia: That's a great idea. Should we get a cake too? Leila: Yes, definitely! We'll all congratulate him together."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

