schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    No public-domain source material was consulted: AUTHORING_GUIDE §10's
    verified PD map covers the LEARNER-side languages, not
    English-as-target A2 employment material, and firecrawl was not used
    this session. Authored from established ESL A2 conventions against
    universal.a2.employment.attend_job_interview, whose
    write_availability_note assessment requirement explicitly names
    "following up after an interview" -- the half a2_unit30_job_interview
    (the interview itself) does not deliver. Facts are deliberately
    continuous with a2_unit30 per §11: Mia, Bright Path Marketing, the
    marketing-coordinator role and her "available to start next Monday"
    are all reused unchanged.
status: "complete_draft"
review:
  status: "unreviewed"
  required_next_reviewer: "fresh_context"
  notes: >-
    Fifth of 6 new A2 units (unit35-unit40) authored 2026-07-22 to close
    the publish-gate teaching-hours gap on the shared English
    realization. Spine outcome REUSED from a2_unit30_job_interview (see
    a2_unit35_prescription's review note for why reuse rather than new
    spine outcomes). Scenario is new and strictly downstream of unit30:
    the follow-up message after the interview, the written offer, and the
    call where Mia asks about the start date and accepts. Character canon
    checked before writing (AUTHORING_PREFLIGHT §6): Mia has two years of
    experience in social media marketing, managed a small team, is
    organized, meets deadlines, and told the interviewer she is available
    to start next Monday (a2_unit30); Bright Path Marketing was hiring a
    marketing coordinator and asked candidates to bring a resume
    (a2_unit30's job posting). Everything here is consistent with that,
    including the Monday start date. The Interviewer is the same unnamed
    role speaker a2_unit30 uses. Every exercise's tested_text is covered
    by this file's own or the A2 chain's earlier introduced_tokens.
    PENDING a fresh-context review per AUTHORING_GUIDE §9.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at the formal employment register a2_unit30 established, plus indirect polite questions (Could you tell me...?) and would like to for accepting an offer."

media_assets:
  - {content_key: "en.a2.audio.after_the_interview.words.offer.01", language: "en", text: "offer", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.after_the_interview.question.01", language: "en", text: "I would like to accept the offer.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.after_the_interview.description.01", language: "en", text: "Dear Mia, thank you for coming in on Tuesday. We would like to offer you the position of marketing coordinator. The contract is full time, and the start date is Monday. Please reply by Friday. Bright Path Marketing.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.after_the_interview.01"
    language: "en"
    text: "Interviewer: Hello Mia, I am calling about the interview on Tuesday. Mia: Thank you for calling. I am still very interested in the position. Interviewer: Good, because we would like to offer you the job. Mia: That is great news. Could you tell me the start date? Interviewer: The start date is Monday, and the contract is full time. Mia: Could you tell me about the working hours? Interviewer: From nine to five, with one hour for lunch. Mia: Thank you. I would like to accept the offer. Interviewer: Wonderful. We will send you the contract today."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit39.after_the_interview"
    title: "Following up after a job interview"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.employment.attend_job_interview"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit39.lesson01.offer_vocabulary"
        title: "Offers, contracts, and start dates"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit39.lesson01.teach.offer", kind: "vocabulary", target: {text: "offer", language_code: "en", direction: "ltr"}, introduced_tokens: ["offer"], example: {text: "I got a job offer from Bright Path Marketing.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit39.lesson01.teach.contract", kind: "vocabulary", target: {text: "contract", language_code: "en", direction: "ltr"}, introduced_tokens: ["contract"], example: {text: "The contract is for one year.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit39.lesson01.teach.salary", kind: "vocabulary", target: {text: "salary", language_code: "en", direction: "ltr"}, introduced_tokens: ["salary"], example: {text: "We can talk about the salary next week.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit39.lesson01.teach.accept", kind: "vocabulary", target: {text: "accept", language_code: "en", direction: "ltr"}, introduced_tokens: ["accept"], example: {text: "I would like to accept the position.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit39.lesson01.teach.start_date", kind: "vocabulary", target: {text: "start date", language_code: "en", direction: "ltr"}, introduced_tokens: ["start", "date"], example: {text: "The start date is the first Monday of the month.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit39.lesson01.teach.reply", kind: "vocabulary", target: {text: "reply", language_code: "en", direction: "ltr"}, introduced_tokens: ["reply"], example: {text: "I sent a reply on the same day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit39.lesson01.teach.grammar_would_like_to", kind: "grammar_note", target: {text: "I would like to accept the offer. I would like to start on Monday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "would", "like", "to", "accept", "the", "offer", "start", "on", "Monday"]}
        exercises:
          - {content_key: "en.a2.unit39.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "offer", media_asset_key: "en.a2.audio.after_the_interview.words.offer.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit39.lesson01.exercise02.choose_contract_word", type: "multiple_choice", tested_text: "contract", prompt: {target_blocks: [{text: "Which word means the written agreement between you and your new company?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson01.exercise03.choose_start_date_phrase", type: "multiple_choice", tested_text: "start date", prompt: {target_blocks: [{text: "Which phrase means the first day of your new job?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit39.lesson01.exercise04.match_offer_words"
            type: "matching_pairs"
            tested_text: "offer contract salary accept start date reply interview position"
            prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}
            pairs:
              - {left: "offer", right: "when a company says it wants to give you the job"}
              - {left: "contract", right: "the written agreement between you and the company"}
              - {left: "salary", right: "the money you get for your work each month"}
              - {left: "accept", right: "to say yes to something you are given"}
              - {left: "start date", right: "the first day of your new job"}
              - {left: "reply", right: "an answer to a message"}
              - {left: "interview", right: "the meeting where a company asks about your experience"}
              - {left: "position", right: "the job you do inside a company"}
          - {content_key: "en.a2.unit39.lesson01.exercise05.write_contract", type: "writing_prompt", tested_text: "contract", prompt: {target_blocks: [{text: "Write the word for the written agreement between you and the company.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit39.lesson02.following_up"
        title: "Following up and accepting"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit39.lesson02.teach.thank_you_for_the_interview", kind: "phrase", target: {text: "Thank you for the interview yesterday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Thank", "you", "for", "the", "interview", "yesterday"]}
          - {content_key: "en.a2.unit39.lesson02.teach.still_interested", kind: "phrase", target: {text: "I am still very interested in the position.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "am", "still", "very", "interested", "in", "position"]}
          - {content_key: "en.a2.unit39.lesson02.teach.could_you_tell_me_start_date", kind: "phrase", target: {text: "Could you tell me the start date?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Could", "tell", "me", "start", "date"]}
          - {content_key: "en.a2.unit39.lesson02.teach.would_like_to_accept", kind: "phrase", target: {text: "I would like to accept the offer.", language_code: "en", direction: "ltr"}, introduced_tokens: ["would", "like", "to", "accept", "offer"]}
          - {content_key: "en.a2.unit39.lesson02.teach.grammar_indirect_questions", kind: "grammar_note", target: {text: "Could you tell me the start date? Could you tell me about the working hours?", language_code: "en", direction: "ltr"}, introduced_tokens: ["about", "working", "hours"]}
        exercises:
          - {content_key: "en.a2.unit39.lesson02.exercise01.listen_acceptance", type: "listen_select", tested_text: "I would like to accept the offer", media_asset_key: "en.a2.audio.after_the_interview.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit39.lesson02.exercise02.choose_follow_up_opening", type: "multiple_choice", tested_text: "Thank you for the interview yesterday.", prompt: {target_blocks: [{text: "You are writing a short message the day after your interview. How do you begin?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson02.exercise03.choose_ask_start_date", type: "multiple_choice", tested_text: "Could you tell me the start date?", prompt: {target_blocks: [{text: "You want to know which day the job begins. How do you ask, formally?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson02.exercise04.order_still_interested", type: "word_order", tested_text: "I am still very interested in the position", prompt: {target_blocks: []}, word_bank: ["am", "still", "very", "interested", "in", "the", "position", "I"]}
          - {content_key: "en.a2.unit39.lesson02.exercise05.order_accept_the_offer", type: "word_order", tested_text: "I would like to accept the offer", prompt: {target_blocks: []}, word_bank: ["would", "like", "to", "accept", "the", "offer", "I"]}
          - {content_key: "en.a2.unit39.lesson02.exercise06.reply_accept_the_offer", type: "dialogue_response", tested_text: "I would like to accept the offer", prompt: {target_blocks: [{text: "The company can offer you the position.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson02.exercise07.write_follow_up_message", type: "writing_prompt", tested_text: "Thank you for the interview yesterday. I am still very interested in the position.", prompt: {target_blocks: [{text: "Write a short follow-up message: thank them for yesterday's interview, then say you are still very interested in the position.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit39.lesson03.reading_an_offer_message"
        title: "Reading a job offer"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit39.lesson03.teach.full_time", kind: "vocabulary", target: {text: "full time", language_code: "en", direction: "ltr"}, introduced_tokens: ["full", "time"], example: {text: "The position is full time, not two days a week.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit39.lesson03.teach.offer_message", kind: "reading", target: {text: "Dear Mia, thank you for coming in on Tuesday. We would like to offer you the position of marketing coordinator. The contract is full time, and the start date is Monday. Please reply by Friday. Bright Path Marketing.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Dear", "Mia", "thank", "you", "for", "coming", "in", "on", "Tuesday", "We", "would", "like", "to", "offer", "the", "position", "of", "marketing", "coordinator", "The", "contract", "is", "full", "time", "and", "start", "date", "Monday", "Please", "reply", "by", "Friday", "Bright", "Path", "Marketing"]}
          - {content_key: "en.a2.unit39.lesson03.teach.please_reply_by_friday", kind: "phrase", target: {text: "Please reply by Friday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Please", "reply", "by", "Friday"]}
        exercises:
          - {content_key: "en.a2.unit39.lesson03.exercise01.read_which_position", type: "reading_comprehension", tested_text: "marketing coordinator", prompt: {target_blocks: [{text: "Which position is Mia offered?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson03.exercise02.read_start_date", type: "reading_comprehension", tested_text: "Monday", prompt: {target_blocks: [{text: "What is the start date in the message?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson03.exercise03.read_reply_deadline", type: "reading_comprehension", tested_text: "by Friday", prompt: {target_blocks: [{text: "When does Mia have to reply?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson03.exercise04.choose_contract_type", type: "multiple_choice", tested_text: "full time", prompt: {target_blocks: [{text: "What kind of contract does the message describe?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson03.exercise05.order_offer_sentence", type: "word_order", tested_text: "We would like to offer you the position of marketing coordinator", prompt: {target_blocks: []}, word_bank: ["would", "like", "to", "offer", "you", "the", "position", "of", "marketing", "coordinator", "We"]}
          - {content_key: "en.a2.unit39.lesson03.exercise06.write_reply_deadline", type: "writing_prompt", tested_text: "Please reply by Friday.", prompt: {target_blocks: [{text: "Write the message's request about replying, beginning with Please reply.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit39.lesson04.offer_call_dialogue"
        title: "The call with the offer"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit39.lesson04.teach.q_calling_about_interview", kind: "dialogue", target: {text: "Hello Mia, I am calling about the interview on Tuesday.", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: ["Hello", "calling"]}
          - {content_key: "en.a2.unit39.lesson04.teach.a_still_interested", kind: "dialogue", target: {text: "Thank you for calling. I am still very interested in the position.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: []}
          - {content_key: "en.a2.unit39.lesson04.teach.q_offer_you_the_job", kind: "dialogue", target: {text: "Good, because we would like to offer you the job.", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: ["Good", "because", "we", "job"]}
          - {content_key: "en.a2.unit39.lesson04.teach.a_great_news_ask_start_date", kind: "dialogue", target: {text: "That is great news. Could you tell me the start date?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["That", "great", "news"]}
          - {content_key: "en.a2.unit39.lesson04.teach.q_start_date_and_contract", kind: "dialogue", target: {text: "The start date is Monday, and the contract is full time.", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: []}
          - {content_key: "en.a2.unit39.lesson04.teach.a_ask_working_hours", kind: "dialogue", target: {text: "Could you tell me about the working hours?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: []}
          - {content_key: "en.a2.unit39.lesson04.teach.q_nine_to_five", kind: "dialogue", target: {text: "From nine to five, with one hour for lunch.", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: ["From", "nine", "five", "with", "one", "hour", "lunch"]}
          - {content_key: "en.a2.unit39.lesson04.teach.a_accept_the_offer", kind: "dialogue", target: {text: "Thank you. I would like to accept the offer.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: []}
          - {content_key: "en.a2.unit39.lesson04.teach.q_send_the_contract", kind: "dialogue", target: {text: "Wonderful. We will send you the contract today.", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: ["Wonderful", "will", "send", "today"]}
        exercises:
          - {content_key: "en.a2.unit39.lesson04.exercise01.listen_start_date", type: "dialogue_comprehension", tested_text: "The start date is Monday", media_asset_key: "en.a2.audio.dialogue.after_the_interview.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit39.lesson04.exercise02.listen_working_hours", type: "listen_select", tested_text: "From nine to five", media_asset_key: "en.a2.audio.dialogue.after_the_interview.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit39.lesson04.exercise03.choose_what_mia_does", type: "multiple_choice", tested_text: "I would like to accept the offer.", prompt: {target_blocks: [{text: "What does Mia say at the end of the call?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit39.lesson04.exercise04.order_ask_working_hours", type: "word_order", tested_text: "Could you tell me about the working hours", prompt: {target_blocks: []}, word_bank: ["you", "tell", "me", "about", "the", "working", "hours", "Could"]}
          - {content_key: "en.a2.unit39.lesson04.exercise05.reply_accept_as_mia", type: "dialogue_response", tested_text: "I would like to accept the offer", prompt: {target_blocks: [{text: "From nine to five, with one hour for lunch.", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit39.lesson04.exercise06.speak_offer_call_dialogue"
            type: "speak_response"
            tested_text: "I am still very interested in the position. Could you tell me the start date? I would like to accept the offer."
            prompt: {target_blocks: [{text: "You are Mia on the phone with Bright Path Marketing.", language_code: "en", direction: "ltr"}]}
