          - {content_key: "en.a1.unit35.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Yes, please send me the names!", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Yes", "please", "send", "me", "the", "names"]}
