  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Technology and device use stays in simple present tense with fixed verb+object collocations that must be memorized: call/text + a person, download + an app, look something up online, take a photo, use my phone/laptop/tablet for + activity. Keep phrasing casual and everyday, never technical jargon."

