          - {content_key: "en.a1.unit35.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "I use my phone to call my parents every weekend. I also use a lot of apps.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["use", "my", "phone", "to", "call", "parents", "every", "weekend", "also", "a", "lot", "of", "apps"]}
