          - {content_key: "en.a1.unit35.lesson04.exercise03.reading_mia_photos", type: "multiple_choice", tested_text: "photos", prompt: {target_blocks: [{text: "According to the reading, what does Mia take a lot of and send to her family?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit35.lesson04.exercise04.write_own_phone_sentence", type: "writing_prompt", tested_text: "use", prompt: {target_blocks: [{text: "Write one sentence about how you use your phone, using \"I call\", \"I text\", or \"I use an app\".", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I call my friends", "I call my friends.", "I text my friends", "I text my friends.", "I use an app", "I use an app.", "I use a map app", "I use a map app."]}
