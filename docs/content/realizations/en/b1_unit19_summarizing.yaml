course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: summarizing and retelling in your own words -- giving the main points of a short passage, meeting, or event in a condensed, ordered form, and distinguishing main points from supporting detail -- in the context of a colleague briefing another colleague on a meeting they missed."

media_assets:
  - {content_key: "en.b1.audio.summarizing.phrase.main_point.01", language: "en", text: "main point", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.summarizing.sentence.01", language: "en", text: "In summary, the meeting covered the budget and the new client.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.summarizing.01"
    language: "en"
    text: "Daniel: I missed the meeting. Can you tell me what happened? Mia: Of course. In short, we talked about the budget and the new client. Daniel: What was the main point about the budget? Mia: The main point was that we are under budget this month. Daniel: Good. Were there any other details? Mia: Just one small detail -- the client meeting was moved to next week. Daniel: Thanks for the summary. That's very helpful."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit19.summarizing"
    title: "In summary, the meeting covered..."
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.communication.summarize_and_retell"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit19.lesson01.summarizing_vocabulary"
        title: "Words for summarizing"
        spine_outcome_id: "universal.b1.communication.summarize_and_retell"
        teaching:
          - {content_key: "en.b1.unit19.lesson01.teach.main_point", kind: "vocabulary", target: {text: "main point", language_code: "en", direction: "ltr"}, introduced_tokens: ["main", "point"], example: {text: "The main point of the meeting was the budget.", language_code: "en", direction: "ltr"}, media_asset_key: "en.b1.audio.summarizing.phrase.main_point.01"}
          - {content_key: "en.b1.unit19.lesson01.teach.detail", kind: "vocabulary", target: {text: "detail", language_code: "en", direction: "ltr"}, introduced_tokens: ["detail"], example: {text: "Mia added one small detail about the schedule.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit19.lesson01.teach.in_summary", kind: "vocabulary", target: {text: "in summary", language_code: "en", direction: "ltr"}, introduced_tokens: ["in", "summary"], example: {text: "In summary, the project will finish next month.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit19.lesson01.teach.in_short", kind: "vocabulary", target: {text: "in short", language_code: "en", direction: "ltr"}, introduced_tokens: ["in", "short"], example: {text: "In short, the team agreed on the plan.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit19.lesson01.teach.in_your_own_words", kind: "vocabulary", target: {text: "in your own words", language_code: "en", direction: "ltr"}, introduced_tokens: ["your", "own", "words"], example: {text: "Please explain the plan in your own words.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit19.lesson01.exercise01.listen_main_point", type: "listen_select", tested_text: "main point", media_asset_key: "en.b1.audio.summarizing.phrase.main_point.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit19.lesson01.exercise02.choose_detail", type: "multiple_choice", tested_text: "detail", prompt: {target_blocks: [{text: "Which word means a small piece of extra information, not the most important idea?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson01.exercise03.choose_in_your_own_words", type: "multiple_choice", tested_text: "in your own words", prompt: {target_blocks: [{text: "Which phrase asks someone to explain something using different words than the original, not by repeating it exactly?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson01.exercise04.match_summary_words", type: "matching_pairs", tested_text: "main point detail in summary in short in your own words", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "the single most important idea in a passage or conversation", right: "main point"}, {left: "a small piece of extra information that supports the main point", right: "detail"}, {left: "introduces a condensed summary at the end of a longer explanation", right: "in summary"}, {left: "introduces the same kind of condensed summary using fewer words", right: "in short"}, {left: "asks for an explanation that does not copy the original wording", right: "in your own words"}]}
          - {content_key: "en.b1.unit19.lesson01.exercise05.write_main_point", type: "writing_prompt", tested_text: "main point", prompt: {target_blocks: [{text: "Write the phrase that means the single most important idea in a passage or conversation.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit19.lesson02.giving_a_summary"
        title: "In summary, we are under budget"
        spine_outcome_id: "universal.b1.communication.summarize_and_retell"
        teaching:
          - {content_key: "en.b1.unit19.lesson02.teach.in_summary_budget_client", kind: "phrase", target: {text: "In summary, the meeting covered the budget and the new client.", language_code: "en", direction: "ltr"}, introduced_tokens: ["the", "meeting", "covered", "budget", "and", "new", "client"], media_asset_key: "en.b1.audio.summarizing.sentence.01"}
          - {content_key: "en.b1.unit19.lesson02.teach.main_point_under_budget", kind: "phrase", target: {text: "The main point was that we are under budget this month.", language_code: "en", direction: "ltr"}, introduced_tokens: ["was", "that", "we", "are", "under", "this", "month"]}
          - {content_key: "en.b1.unit19.lesson02.teach.grammar_summary_structure", kind: "grammar_note", target: {text: "Start a summary with a phrase like In summary or In short, then give only the main points in order, keeping the sentence short. Use The main point was that... to highlight the single most important idea, separately from any smaller details.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Start", "with", "phrase", "like", "then", "give", "only", "points", "order", "keeping", "sentence", "short", "Use", "was", "that", "to", "highlight", "single", "most", "important", "idea", "separately", "from", "any", "smaller", "details"]}
        exercises:
          - {content_key: "en.b1.unit19.lesson02.exercise01.choose_in_summary_budget_client", type: "multiple_choice", tested_text: "In summary, the meeting covered the budget and the new client.", prompt: {target_blocks: [{text: "Which sentence gives a condensed summary of what the meeting covered?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson02.exercise02.choose_main_point_under_budget", type: "multiple_choice", tested_text: "The main point was that we are under budget this month.", prompt: {target_blocks: [{text: "Which sentence states the single main point about the budget, separately from any smaller details?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson02.exercise03.order_in_summary_budget_client", type: "word_order", tested_text: "In summary the meeting covered the budget and the new client", prompt: {target_blocks: []}, word_bank: ["summary", "the", "meeting", "covered", "the", "budget", "and", "the", "new", "client", "In"]}
          - {content_key: "en.b1.unit19.lesson02.exercise04.reply_summarize_meeting", type: "dialogue_response", tested_text: "In summary the meeting covered the budget and the new client", prompt: {target_blocks: [{text: "I missed the meeting. Can you tell me what happened, in summary?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson02.exercise05.write_main_point_under_budget", type: "writing_prompt", tested_text: "The main point was that we are under budget this month.", prompt: {target_blocks: [{text: "Write that the main point was that the team is under budget this month, starting with 'The main point was that'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit19.lesson03.reading_a_short_article"
        title: "Reading: summarizing a short article"
        spine_outcome_id: "universal.b1.communication.summarize_and_retell"
        teaching:
          - {content_key: "en.b1.unit19.lesson03.teach.condensed", kind: "vocabulary", target: {text: "condensed", language_code: "en", direction: "ltr"}, introduced_tokens: ["condensed"], example: {text: "Mia gave Daniel a condensed summary of the meeting.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit19.lesson03.teach.original_article", kind: "vocabulary", target: {text: "original article", language_code: "en", direction: "ltr"}, introduced_tokens: ["original", "article"], example: {text: "Leila's summary matched the original article closely.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit19.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Leila read a long article about workplace communication for her design course. The original article had many examples and background information, but Leila only needed the main points. In her own words, she wrote a condensed summary: workplace communication works best when messages are clear and short, and when people ask questions instead of guessing. She left out most of the examples, since they were details, not main points. Her teacher said the summary kept the important ideas in the right order.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Leila", "read", "long", "article", "about", "workplace", "communication", "for", "her", "design", "course", "The", "had", "many", "examples", "background", "information", "but", "only", "needed", "In", "own", "she", "wrote", "works", "best", "when", "messages", "are", "clear", "and", "short", "people", "ask", "questions", "instead", "of", "guessing", "She", "left", "out", "most", "since", "they", "were", "not", "Her", "teacher", "said", "kept", "important", "ideas", "right", "order"]
        exercises:
          - {content_key: "en.b1.unit19.lesson03.exercise01.comprehend_condensed_summary", type: "reading_comprehension", tested_text: "workplace communication works best when messages are clear and short, and when people ask questions instead of guessing", prompt: {target_blocks: [{text: "What are the main points Leila kept in her condensed summary?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson03.exercise02.comprehend_left_out_examples", type: "reading_comprehension", tested_text: "she left out most of the examples", prompt: {target_blocks: [{text: "What did Leila leave out of her summary, since they were details rather than main points?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson03.exercise03.recognize_condensed", type: "multiple_choice", tested_text: "condensed", prompt: {target_blocks: [{text: "Which word describes a summary that has been made shorter while keeping the main points?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson03.exercise04.order_summary_kept_important_ideas", type: "word_order", tested_text: "The summary kept the important ideas in the right order", prompt: {target_blocks: []}, word_bank: ["summary", "kept", "the", "important", "ideas", "in", "the", "right", "order", "The"]}
          - {content_key: "en.b1.unit19.lesson03.exercise05.write_summary_workplace_communication", type: "writing_prompt", tested_text: "Workplace communication works best when messages are clear and short.", prompt: {target_blocks: [{text: "Write the main point of Leila's summary: that workplace communication works best when messages are clear and short.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit19.lesson04.the_briefing_dialogue"
        title: "Can you tell me what happened?"
        spine_outcome_id: "universal.b1.communication.summarize_and_retell"
        teaching:
          - {content_key: "en.b1.unit19.lesson04.teach.q_missed_meeting", kind: "dialogue", target: {text: "I missed the meeting. Can you tell me what happened?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I", "missed", "the", "meeting", "Can", "you", "tell", "me", "what", "happened"], media_asset_key: "en.b1.audio.dialogue.summarizing.01"}
          - {content_key: "en.b1.unit19.lesson04.teach.a_in_short_budget_client", kind: "dialogue", target: {text: "Of course. In short, we talked about the budget and the new client.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Of", "course", "In", "short", "we", "talked", "about", "the", "budget", "and", "new", "client"]}
          - {content_key: "en.b1.unit19.lesson04.teach.q_main_point_budget", kind: "dialogue", target: {text: "What was the main point about the budget?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "was", "the", "main", "point", "about", "budget"]}
          - {content_key: "en.b1.unit19.lesson04.teach.a_under_budget_this_month", kind: "dialogue", target: {text: "The main point was that we are under budget this month.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["The", "main", "point", "was", "that", "we", "are", "under", "budget", "this", "month"]}
          - {content_key: "en.b1.unit19.lesson04.teach.q_other_details", kind: "dialogue", target: {text: "Good. Were there any other details?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Good", "Were", "there", "any", "other", "details"]}
          - {content_key: "en.b1.unit19.lesson04.teach.a_client_meeting_moved", kind: "dialogue", target: {text: "Just one small detail -- the client meeting was moved to next week.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Just", "one", "small", "detail", "the", "client", "meeting", "was", "moved", "to", "next", "week"]}
          - {content_key: "en.b1.unit19.lesson04.teach.q_thanks_for_summary", kind: "dialogue", target: {text: "Thanks for the summary. That's very helpful.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thanks", "for", "the", "summary", "That's", "very", "helpful"]}
        exercises:
          - {content_key: "en.b1.unit19.lesson04.exercise01.listen_in_short_budget_client", type: "dialogue_comprehension", tested_text: "In short, we talked about the budget and the new client.", media_asset_key: "en.b1.audio.dialogue.summarizing.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit19.lesson04.exercise02.listen_under_budget_this_month", type: "listen_select", tested_text: "we are under budget this month", media_asset_key: "en.b1.audio.dialogue.summarizing.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit19.lesson04.exercise03.choose_client_meeting_moved", type: "multiple_choice", tested_text: "the client meeting was moved to next week", prompt: {target_blocks: [{text: "What small detail does Mia mention about the client meeting?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit19.lesson04.exercise04.order_other_details", type: "word_order", tested_text: "Were there any other details", prompt: {target_blocks: []}, word_bank: ["there", "any", "other", "details", "Were"]}
          - content_key: "en.b1.unit19.lesson04.exercise05.reply_as_mia"
            type: "dialogue_response"
            tested_text: "The main point was that we are under budget this month"
            prompt: {target_blocks: [{text: "What was the main point about the budget?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit19.lesson04.exercise06.speak_summarizing_dialogue"
            type: "speak_response"
            tested_text: "Thanks for the summary. That's very helpful."
            prompt: {target_blocks: [{text: "Just one small detail -- the client meeting was moved to next week.", language_code: "en", direction: "ltr"}]}
