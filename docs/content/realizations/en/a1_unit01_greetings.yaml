units:
  - content_key: "en.a1.unit01.greetings"
    title: "Greetings and short social exchanges"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.greetings.open_close_exchange"
    planned_lesson_count: 3
    lessons:
      - content_key: "en.a1.unit01.lesson01.everyday_greetings"
        title: "Everyday greetings"
        spine_outcome_id: "universal.a1.greetings.open_close_exchange"
        teaching:
          - {content_key: "en.a1.unit01.lesson01.teach.hello", kind: "vocabulary", target: {text: "Hello", language_code: "en", direction: "ltr"}, introduced_tokens: ["Hello"], example: {text: "Hello, Daniel!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit01.lesson01.teach.hi", kind: "vocabulary", target: {text: "Hi", language_code: "en", direction: "ltr"}, introduced_tokens: ["Hi"], example: {text: "Hi, Leila!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit01.lesson01.teach.good_morning", kind: "phrase", target: {text: "Good morning", language_code: "en", direction: "ltr"}, introduced_tokens: ["Good", "morning"]}
          - {content_key: "en.a1.unit01.lesson01.teach.good_afternoon", kind: "phrase", target: {text: "Good afternoon", language_code: "en", direction: "ltr"}, introduced_tokens: ["Good", "afternoon"]}
          - {content_key: "en.a1.unit01.lesson01.teach.good_evening", kind: "phrase", target: {text: "Good evening", language_code: "en", direction: "ltr"}, introduced_tokens: ["Good", "evening"]}
          - {content_key: "en.a1.unit01.lesson01.teach.goodbye", kind: "vocabulary", target: {text: "Goodbye", language_code: "en", direction: "ltr"}, introduced_tokens: ["Goodbye"], example: {text: "Goodbye, see you tomorrow!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit01.lesson01.teach.bye", kind: "vocabulary", target: {text: "Bye", language_code: "en", direction: "ltr"}, introduced_tokens: ["Bye"], example: {text: "Bye, see you soon!", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit01.lesson01.exercise01.listen_hello", type: "listen_select", tested_text: "Hello", media_asset_key: "en.a1.audio.hello.neutral.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit01.lesson01.exercise02.choose_informal"
            type: "multiple_choice"
            tested_text: "Hi"
            prompt: {target_blocks: [{text: "Hi", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit01.lesson01.exercise04.order_afternoon", type: "word_order", tested_text: "Good afternoon", prompt: {target_blocks: []}, word_bank: ["afternoon", "Good"]}
          - content_key: "en.a1.unit01.lesson01.exercise06.goodbye_meaning"
            type: "multiple_choice"
            tested_text: "Goodbye"
            prompt: {target_blocks: [{text: "Goodbye", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit01.lesson01.exercise07.listen_order", type: "listen_order", tested_text: "Good afternoon", media_asset_key: "en.a1.audio.good_afternoon.neutral.01", prompt: {target_blocks: []}, word_bank: ["afternoon", "Good"]}
          - {content_key: "en.a1.unit01.lesson01.exercise03.listen_morning", type: "listen_type", tested_text: "Good morning", media_asset_key: "en.a1.audio.good_morning.neutral.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit01.lesson01.exercise08.speak_bye", type: "speak_response", tested_text: "Bye", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit01.lesson03.wellbeing"
        title: "Ask and answer how someone is"
        spine_outcome_id: "universal.a1.greetings.open_close_exchange"
        teaching:
          - {content_key: "en.a1.unit01.lesson03.teach.how_are_you", kind: "phrase", target: {text: "How are you?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "are", "you"]}
          - {content_key: "en.a1.unit01.lesson03.teach.im_fine", kind: "phrase", target: {text: "I'm fine, thanks.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "fine", "thanks"]}
          - {content_key: "en.a1.unit01.lesson03.teach.im_good", kind: "phrase", target: {text: "I'm good, thanks.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "good", "thanks"]}
          - {content_key: "en.a1.unit01.lesson03.teach.not_bad", kind: "phrase", target: {text: "Not bad, thanks.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Not", "bad", "thanks"]}
          - {content_key: "en.a1.unit01.lesson03.teach.and_you", kind: "phrase", target: {text: "And you?", language_code: "en", direction: "ltr"}, introduced_tokens: ["And", "you"]}
          - {content_key: "en.a1.unit01.lesson03.teach.are_you_okay", kind: "phrase", target: {text: "Are you okay?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Are", "you", "okay"]}
        exercises:
          - {content_key: "en.a1.unit01.lesson03.exercise01.listen_question", type: "listen_select", tested_text: "How are you", media_asset_key: "en.a1.audio.how_are_you.neutral.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit01.lesson03.exercise05.return_question"
            type: "multiple_choice"
            tested_text: "And you"
            prompt: {target_blocks: [{text: "I'm fine, thanks. _", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit01.lesson03.exercise02.order_question", type: "word_order", tested_text: "How are you", prompt: {target_blocks: []}, word_bank: ["you", "How", "are"]}
          - content_key: "en.a1.unit01.lesson03.exercise06.be_question_order"
            type: "multiple_choice"
            tested_text: "Are you okay"
            prompt: {target_blocks: [{text: "Are you okay?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit01.lesson03.exercise03.reply_fine"
            type: "dialogue_response"
            tested_text: "How are you I'm fine thanks"
            prompt: {target_blocks: [{text: "How are you?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit01.lesson03.exercise08.speak_exchange"
            type: "speak_response"
            tested_text: "I'm good thanks And you"
            prompt: {target_blocks: [{text: "How are you?", language_code: "en", direction: "ltr"}]}

      - content_key: "en.a1.unit01.lesson05.noun_phrases_and_closings"
        title: "Friendly closings"
        spine_outcome_id: "universal.a1.greetings.open_close_exchange"
        teaching:
          - {content_key: "en.a1.unit01.lesson05.teach.nice_to_meet_you", kind: "phrase", target: {text: "Nice to meet you.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Nice", "to", "meet", "you"]}
          - {content_key: "en.a1.unit01.lesson05.teach.nice_to_meet_you_too", kind: "phrase", target: {text: "Nice to meet you too.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Nice", "to", "meet", "you", "too"]}
          - {content_key: "en.a1.unit01.lesson05.teach.see_you_later", kind: "phrase", target: {text: "See you later.", language_code: "en", direction: "ltr"}, introduced_tokens: ["See", "you", "later"]}
          - {content_key: "en.a1.unit01.lesson05.teach.have_a_good_day", kind: "phrase", target: {text: "Have a good day.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Have", "a", "good", "day"]}
        exercises:
          - content_key: "en.a1.unit01.lesson05.exercise06.choose_later"
            type: "multiple_choice"
            tested_text: "See you later"
            prompt: {target_blocks: [{text: "See you later.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit01.lesson05.exercise07.order_good_day", type: "word_order", tested_text: "Have a good day", prompt: {target_blocks: []}, word_bank: ["day", "good", "a", "Have"]}
          - {content_key: "en.a1.unit01.lesson05.exercise04.listen_nice", type: "listen_type", tested_text: "Nice to meet you", media_asset_key: "en.a1.audio.nice_to_meet_you.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit01.lesson05.exercise05.reply_nice"
            type: "dialogue_response"
            tested_text: "Nice to meet you Nice to meet you too"
            prompt: {target_blocks: [{text: "Nice to meet you.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit01.lesson05.exercise08.speak_closing", type: "speak_response", tested_text: "Have a good day", prompt: {target_blocks: []}}
