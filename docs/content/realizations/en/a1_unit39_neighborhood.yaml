course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Talking about neighborhoods stays in simple present tense with fixed verb+object collocations that must be memorized: live in a neighborhood, get along with your neighbors, say hello to your neighbor. Keep the register warm and casual, appropriate for coworkers/friends comparing where they live, not formal real-estate or housing-application register."

media_assets:
  - {content_key: "en.a1.audio.neighborhood.words.neighbor.01", language: "en", text: "neighbor", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.neighborhood.phrases.close_to.01", language: "en", text: "close to", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.neighborhood.01"
    language: "en"
    text: "Leila: I might move soon. What's your neighborhood like, Mia? Mia: I really like it. It's quiet, and there's a park nearby. Leila: That sounds nice. Is it close to a grocery store? Mia: Yes, there's one just a five-minute walk from my building. Leila: What about your neighbors? Are they friendly? Mia: Very friendly! My neighbor Mr. Lopez waters my plants when I'm away. Leila: That's so nice. I think I'd like to live near you!"
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

