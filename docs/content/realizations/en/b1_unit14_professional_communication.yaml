status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    2026-07-12 fresh-context review (Claude Opus). Verified: the four softened
    request forms are natural, contemporary and consistently formal; the
    lesson02 grammar note teaches the softened-conditional rule the exercises
    test; American spelling is consistent (*afterward*); the role-based
    "Manager" speaker follows the existing corpus convention; Mia/Daniel
    continuity holds against units 09-11 (Daniel's English-for-work evening
    class and workplace writing) with no contradictions; matching_pairs has 6
    pairs with no duplicate left or right values; no YAML booleans or
    snake_case leaks; dialogue cards all use target.speaker. Fixed 4 defects:
    (1) lesson01.exercise04's matching_pairs was genuinely unanswerable -- the
    four request-form glosses ("a polite way to ask for a change" / "…to ask
    someone to do something" / "…to suggest a small change to a plan" / "…to
    make a formal request") are mutually interchangeable, with nothing to
    prefer one mapping over another (AUTHORING_GUIDE §16 confusability, §17
    true-synonym class); the lefts now discriminate on each form's actual
    meaning (possibility / indirect thought / joint we-request / gratitude);
    (2, 3, 4) three production prompts were underdetermined -- "Write a polite
    request asking to move the meeting to Thursday" (lesson02.exercise05), the
    same for the agenda (lesson03.exercise05), and "How would you politely ask
    a colleague to review your report today?" (lesson02.exercise04) are all
    satisfied by any of the four taught forms, but each is graded against one
    exact string, so three of four correct answers would be marked wrong; each
    prompt now names the form to use. Also reworded lesson03.exercise01, whose
    question ("What does Mia ask Daniel to add to the agenda?") already
    contained its own answer span. LIMITATION: no X-to-en overlays exist yet,
    so distractors and accepted_answers could not be machine-checked; the
    lesson04 listen_select needs its overlay distractors checked against
    everything Mia says in that dialogue clip.
    Review 2026-10-22 (shared-en r3): 0 realization changes; accepted_answers gaps fixed in overlays. NATIVE FLAGS: none.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: making formal-register suggestions and requests in a workplace meeting using softened conditional forms (Would it be possible to..., I was wondering if..., Could we possibly..., I would appreciate it if...), and writing a brief professional message."

media_assets:
  - {content_key: "en.b1.audio.professional_communication.phrase.agenda.01", language: "en", text: "agenda", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.professional_communication.sentence.01", language: "en", text: "Would it be possible to move the meeting to Thursday?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.professional_communication.01"
    language: "en"
    text: "Manager: Good morning, Mia. Would it be possible to start with the budget update today? Mia: Of course. I was wondering if we could also add the new client to the agenda. Manager: Good idea. Could we possibly keep this meeting under thirty minutes? Mia: I'll do my best. I would appreciate it if everyone sent questions in advance next time. Manager: That's a fair request. I'll follow up with a reminder before the next meeting. Mia: Thank you. I'll send the updated agenda this afternoon."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit14.professional_communication"
    title: "Would it be possible to..."
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.workplace.communicate_professionally_in_meetings"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit14.lesson01.professional_communication_vocabulary"
        title: "Polite requests for the workplace"
        spine_outcome_id: "universal.b1.workplace.communicate_professionally_in_meetings"
        teaching:
          - {content_key: "en.b1.unit14.lesson01.teach.would_it_be_possible_to", kind: "vocabulary", target: {text: "would it be possible to", language_code: "en", direction: "ltr"}, introduced_tokens: ["Would", "it", "be", "possible", "to"], example: {text: "Would it be possible to move the meeting to Thursday?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit14.lesson01.teach.i_was_wondering_if", kind: "vocabulary", target: {text: "I was wondering if", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "was", "wondering", "if"], example: {text: "I was wondering if you could review my report today.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit14.lesson01.teach.could_we_possibly", kind: "vocabulary", target: {text: "could we possibly", language_code: "en", direction: "ltr"}, introduced_tokens: ["Could", "we", "possibly"], example: {text: "Could we possibly start the meeting five minutes later?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit14.lesson01.teach.i_would_appreciate_it_if", kind: "vocabulary", target: {text: "I would appreciate it if", language_code: "en", direction: "ltr"}, introduced_tokens: ["would", "appreciate"], example: {text: "I would appreciate it if you could send the notes soon.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit14.lesson01.teach.agenda", kind: "vocabulary", target: {text: "agenda", language_code: "en", direction: "ltr"}, introduced_tokens: ["agenda"], example: {text: "Daniel added one more item to the agenda.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit14.lesson01.teach.follow_up", kind: "vocabulary", target: {text: "follow up", language_code: "en", direction: "ltr"}, introduced_tokens: ["follow", "up"], example: {text: "Mia will follow up by email after the meeting.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit14.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "agenda", media_asset_key: "en.b1.audio.professional_communication.phrase.agenda.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit14.lesson01.exercise02.choose_follow_up", type: "multiple_choice", tested_text: "follow up", prompt: {target_blocks: [{text: "Which phrase means to contact someone again after a meeting or task?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson01.exercise03.choose_agenda", type: "multiple_choice", tested_text: "agenda", prompt: {target_blocks: [{text: "Which word means a list of topics to discuss in a meeting?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson01.exercise04.match_professional_phrases", type: "matching_pairs", tested_text: "would it be possible to I was wondering if could we possibly I would appreciate it if agenda follow up", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "would it be possible to", right: "asks politely whether something can be done at all"}, {left: "I was wondering if", right: "introduces a request indirectly, as something you have been thinking about"}, {left: "could we possibly", right: "asks politely for something you and the other person would do together"}, {left: "I would appreciate it if", right: "says you would be grateful if someone did something"}, {left: "agenda", right: "a list of topics to discuss in a meeting"}, {left: "follow up", right: "to contact someone again after a meeting or task"}]}
          - {content_key: "en.b1.unit14.lesson01.exercise05.write_agenda", type: "writing_prompt", tested_text: "agenda", prompt: {target_blocks: [{text: "Write the word that means a list of topics to discuss in a meeting.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit14.lesson02.softened_requests"
        title: "Would it be possible to move the meeting?"
        spine_outcome_id: "universal.b1.workplace.communicate_professionally_in_meetings"
        teaching:
          - {content_key: "en.b1.unit14.lesson02.teach.move_meeting_thursday", kind: "phrase", target: {text: "Would it be possible to move the meeting to Thursday?", language_code: "en", direction: "ltr"}, introduced_tokens: ["move", "the", "meeting", "to", "Thursday"], media_asset_key: "en.b1.audio.professional_communication.sentence.01"}
          - {content_key: "en.b1.unit14.lesson02.teach.review_report_today", kind: "phrase", target: {text: "I was wondering if you could review my report today.", language_code: "en", direction: "ltr"}, introduced_tokens: ["you", "could", "review", "my", "report", "today"]}
          - {content_key: "en.b1.unit14.lesson02.teach.grammar_softened_requests", kind: "grammar_note", target: {text: "In formal workplace requests, use a softened conditional form such as Would it be possible to... or I was wondering if... instead of a direct command. These forms sound more polite than Move the meeting or Review my report.", language_code: "en", direction: "ltr"}, introduced_tokens: ["In", "formal", "workplace", "requests", "use", "softened", "conditional", "form", "such", "as", "instead", "of", "direct", "command", "These", "forms", "sound", "more", "polite", "than"]}
        exercises:
          - {content_key: "en.b1.unit14.lesson02.exercise01.choose_move_meeting", type: "multiple_choice", tested_text: "Would it be possible to move the meeting to Thursday?", prompt: {target_blocks: [{text: "Which sentence politely asks to change the meeting day?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson02.exercise02.choose_review_report", type: "multiple_choice", tested_text: "I was wondering if you could review my report today.", prompt: {target_blocks: [{text: "Which sentence politely asks a colleague to review a report?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson02.exercise03.order_move_meeting", type: "word_order", tested_text: "Would it be possible to move the meeting to Thursday", prompt: {target_blocks: []}, word_bank: ["it", "be", "possible", "to", "move", "the", "meeting", "to", "Thursday", "Would"]}
          - {content_key: "en.b1.unit14.lesson02.exercise04.reply_ask_report_review", type: "dialogue_response", tested_text: "I was wondering if you could review my report today", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit14.lesson02.exercise05.write_move_meeting", type: "writing_prompt", tested_text: "Would it be possible to move the meeting to Thursday?", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit14.lesson03.reading_a_message_before_the_meeting"
        title: "Reading: a message before the meeting"
        spine_outcome_id: "universal.b1.workplace.communicate_professionally_in_meetings"
        teaching:
          - {content_key: "en.b1.unit14.lesson03.teach.budget_update", kind: "vocabulary", target: {text: "budget update", language_code: "en", direction: "ltr"}, introduced_tokens: ["budget", "update"], example: {text: "Daniel prepared the budget update for the meeting.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit14.lesson03.teach.afterward", kind: "vocabulary", target: {text: "afterward", language_code: "en", direction: "ltr"}, introduced_tokens: ["afterward"], example: {text: "We can review the notes afterward.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit14.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Hi Daniel, I hope you are doing well. Would it be possible to add the budget update to the agenda for tomorrow's meeting? I would appreciate it if you could bring the latest numbers with you. Could we possibly start ten minutes early so we have time for questions afterward? Thank you, Mia", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Hi", "hope", "doing", "well", "add", "for", "tomorrow's", "bring", "latest", "numbers", "with", "start", "ten", "minutes", "early", "so", "have", "time", "questions", "Thank"]
        exercises:
          - {content_key: "en.b1.unit14.lesson03.exercise01.comprehend_add_budget_update", type: "reading_comprehension", tested_text: "add the budget update to the agenda", prompt: {target_blocks: [{text: "What does Mia ask Daniel to do with the budget update?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson03.exercise02.comprehend_bring_numbers", type: "reading_comprehension", tested_text: "bring the latest numbers with you", prompt: {target_blocks: [{text: "What does Mia say she would appreciate?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson03.exercise03.recognize_budget_update", type: "multiple_choice", tested_text: "budget update", prompt: {target_blocks: [{text: "Which phrase means a report on how money is being spent?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson03.exercise04.order_start_ten_minutes_early", type: "word_order", tested_text: "Could we possibly start ten minutes early", prompt: {target_blocks: []}, word_bank: ["we", "possibly", "start", "ten", "minutes", "early", "Could"]}
          - {content_key: "en.b1.unit14.lesson03.exercise05.write_add_budget_update", type: "writing_prompt", tested_text: "Would it be possible to add the budget update to the agenda?", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit14.lesson04.the_meeting_dialogue"
        title: "Could we possibly keep this short?"
        spine_outcome_id: "universal.b1.workplace.communicate_professionally_in_meetings"
        teaching:
          - {content_key: "en.b1.unit14.lesson04.teach.q_start_budget_update", kind: "dialogue", target: {text: "Good morning, Mia. Would it be possible to start with the budget update today?", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["Good", "morning", "start", "with", "budget", "update", "today"], media_asset_key: "en.b1.audio.dialogue.professional_communication.01"}
          - {content_key: "en.b1.unit14.lesson04.teach.a_add_new_client", kind: "dialogue", target: {text: "Of course. I was wondering if we could also add the new client to the agenda.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Of", "course", "we", "could", "also", "add", "new", "client", "agenda"]}
          - {content_key: "en.b1.unit14.lesson04.teach.q_keep_thirty_minutes", kind: "dialogue", target: {text: "Good idea. Could we possibly keep this meeting under thirty minutes?", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["idea", "keep", "this", "under", "thirty", "minutes"]}
          - {content_key: "en.b1.unit14.lesson04.teach.a_questions_in_advance", kind: "dialogue", target: {text: "I'll do my best. I would appreciate it if everyone sent questions in advance next time.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["I'll", "do", "my", "best", "everyone", "sent", "questions", "advance", "next", "time"]}
          - {content_key: "en.b1.unit14.lesson04.teach.q_fair_request_followup", kind: "dialogue", target: {text: "That's a fair request. I'll follow up with a reminder before the next meeting.", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["That's", "fair", "request", "follow", "up", "reminder", "before"]}
          - {content_key: "en.b1.unit14.lesson04.teach.a_send_updated_agenda", kind: "dialogue", target: {text: "Thank you. I'll send the updated agenda this afternoon.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Thank", "you", "send", "updated", "agenda", "this", "afternoon"]}
        exercises:
          - {content_key: "en.b1.unit14.lesson04.exercise01.listen_start_budget_update", type: "dialogue_comprehension", tested_text: "start with the budget update today", media_asset_key: "en.b1.audio.dialogue.professional_communication.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit14.lesson04.exercise02.listen_add_new_client", type: "listen_select", tested_text: "add the new client to the agenda", media_asset_key: "en.b1.audio.dialogue.professional_communication.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit14.lesson04.exercise03.choose_meeting_length_request", type: "multiple_choice", tested_text: "keep this meeting under thirty minutes", prompt: {target_blocks: [{text: "What does the manager ask about the length of the meeting?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit14.lesson04.exercise04.order_keep_thirty_minutes", type: "word_order", tested_text: "Could we possibly keep this meeting under thirty minutes", prompt: {target_blocks: []}, word_bank: ["we", "possibly", "keep", "this", "meeting", "under", "thirty", "minutes", "Could"]}
          - content_key: "en.b1.unit14.lesson04.exercise05.reply_as_mia"
            type: "dialogue_response"
            tested_text: "I would appreciate it if everyone sent questions in advance next time"
            prompt: {target_blocks: [{text: "Good idea. Could we possibly keep this meeting under thirty minutes?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit14.lesson04.exercise06.speak_professional_dialogue"
            type: "speak_response"
            tested_text: "I'll send the updated agenda this afternoon"
            prompt: {target_blocks: [{text: "That's a fair request. I'll follow up with a reminder before the next meeting.", language_code: "en", direction: "ltr"}]}
