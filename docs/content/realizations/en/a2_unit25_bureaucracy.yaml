schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "adapted_from_public_domain_source"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    The formal register-and-documents pattern for an official appointment
    (asking what to bring, confirming an appointment, stating how long
    you've lived somewhere) is scaffolded from the official-interactions
    module of the FSI English-for-foreign-officers material (Foreign
    Service Institute, US Department of State -- public domain, no
    attribution required per docs/content/AUTHORING_GUIDE.md §10). The
    source frames this around a 1960s-70s consular/registration
    interview with no modern equivalent; the specific institution,
    documents, and vocabulary here (DMV address update, proof of
    residency, appointment confirmation number) reflect current 2020s
    US civic administration and are freshly authored, not translated or
    lightly edited from the source.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    First A2 unit for the shared English realization (spine outcome:
    universal.a2.bureaucracy.register_with_authorities, mirroring the
    Dutch lane's a2_unit24_gemeente.yaml this same session), continuing
    the Leila/Daniel storyline -- now that Daniel has a new apartment
    (unit24), he needs to update his address at the DMV. A2-level
    complexity deliberately exceeds A1: subordinate clauses (because/
    since), the polite conditional (could you tell me / would it be
    possible), and indirect/formal questions (I was wondering whether,
    what do I need to bring). The specific fact (Daniel has lived at
    the new address "since last month") is stated consistently between
    lesson03's teaching example and lesson04's dialogue per
    AUTHORING_GUIDE §11. Every multi-clause accepted_answers list
    authored with period/comma/conjunction-joined forms per §12. Every
    fill_in_blank frame retains visible surrounding text per §13.
    Pending fresh-context review.

    2026-07-07 §19 retrofit: added `example:` to all 7 kind:vocabulary
    cards (appointment, document, proof of residency, form,
    confirmation number, photo ID, utility bill), each a genuinely
    natural A2-register sentence consistent with this unit's DMV
    setting -- confirmation_number's example reuses the exact figure
    (4471) already stated in lesson04's dialogue per §11 cross-fact
    consistency, and proof_of_residency's example forward-references
    utility_bill (taught later in lesson03), an established acceptable
    pattern this session. schema_version bumped to 1.1. This file is
    shared by fa-en/nl-en/prs-en; example_gloss added to one paired
    overlay as part of this same pass (see that overlay's own notes).

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every teaching card, the dialogue/reading for cross-fact
    consistency, every exercise prompt against its accepted answers in the
    nl-en/fa-en/prs-en overlays, word banks and register. Fixes:
    en.a2.unit25.lesson02.exercise04.reply_why_update_address -- prompt
    "Why update my address?" (a first-person self-question) -> "Why do you
    need to update your address?" (nl-en instruction updated to "Waarom
    moet je je adres bijwerken?"), and "Because I moved last month(.)" /
    "I moved last month." added to the nl-en/fa-en/prs-en accepted
    answers; en.a2.unit25.lesson03.exercise04.order_bring_photo_id --
    added the equally-correct tile orders "bring a photo ID and one proof
    of residency please", "please bring one photo ID and a proof of
    residency" and "bring one photo ID and a proof of residency please" in
    the three overlays; en.a2.unit25.lesson04.dmv_appointment_dialogue
    title "At the appointment" -> "Booking the appointment" (nl-en "Bij de
    afspraak" -> "De afspraak maken"). NATIVE FLAG: "Since when have you
    lived at the new address?" (lesson04.teach.q_since_when, the dialogue
    audio, lesson04.exercise04 word bank, exercise05/06 prompts,
    lesson03.exercise03) sounds incredulous in English and is a
    Dutch/German calque -- a clerk says "How long have you lived at the
    new address?"; "Friday at 10am" would be "10 a.m." in US style.
    DEFERRED: (1) Since when -> How long rewrite (structural: realization,
    audio, word_order answers and the fa-en/prs-en instructions/glosses);
    (2) lesson03.teach.notice_text is illogical for a generic notice ("You
    have lived at your new address since last month, so please also bring
    your lease") -- suggested "If you have lived at your new address for
    less than three months, please also bring your lease.", which requires
    reworking lesson03.exercise03 and the fa/prs glosses; (3)
    lesson04.exercise05/06 reply_as_daniel/speak_bureaucracy_dialogue are
    underdetermined ("What do I need to bring?" / "Can I come this
    Friday?" also satisfy the instruction), answer the clerk's single
    question with three separate dialogue turns, and duplicate each other
    -- needs exercise reshaping; (4) fa-en/prs-en instruction for
    reply_why_update_address and their lesson04 title still carry the old
    first-person / "at the appointment" wording (Persian/Dari text).

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at a formal register appropriate for an official appointment. Introduce subordinate clauses (because, since, if) and polite indirect questions (I was wondering whether..., Could you tell me...) as the A2-level step up from A1's direct-question register."

media_assets:
  - {content_key: "en.a2.audio.bureaucracy.words.proof_of_residency.01", language: "en", text: "proof of residency", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.bureaucracy.question.01", language: "en", text: "I was wondering whether I could make an appointment to update my address.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.bureaucracy.description.01", language: "en", text: "I need to update my address because I moved last month. Could you tell me what documents I should bring?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.dmv_appointment.01"
    language: "en"
    text: "Daniel: Hello, I was wondering whether I could make an appointment to update my address. Clerk: Of course. How long have you lived at the new address? Daniel: Since last month. Clerk: I see. Daniel: Could you tell me what I need to bring? Clerk: You'll need a photo ID and one proof of residency, like a utility bill. Daniel: Would it be possible to come this Friday? Clerk: Yes, Friday at 10am works. Your confirmation number is 4471. Daniel: Thank you very much."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit25.bureaucracy"
    title: "Registering with local authorities"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.bureaucracy.register_with_authorities"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit25.lesson01.registration_vocabulary"
        title: "Appointments and documents"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit25.lesson01.teach.appointment", kind: "vocabulary", target: {text: "appointment", language_code: "en", direction: "ltr"}, introduced_tokens: ["appointment"], example: {text: "I have an appointment at the DMV on Friday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit25.lesson01.teach.document", kind: "vocabulary", target: {text: "document", language_code: "en", direction: "ltr"}, introduced_tokens: ["document"], example: {text: "Please bring one document as proof of residency.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit25.lesson01.teach.proof_of_residency", kind: "vocabulary", target: {text: "proof of residency", language_code: "en", direction: "ltr"}, introduced_tokens: ["proof", "of", "residency"], example: {text: "A utility bill can be used as proof of residency.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit25.lesson01.teach.form", kind: "vocabulary", target: {text: "form", language_code: "en", direction: "ltr"}, introduced_tokens: ["form"], example: {text: "Please fill out this form before your appointment.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit25.lesson01.teach.confirmation_number", kind: "vocabulary", target: {text: "confirmation number", language_code: "en", direction: "ltr"}, introduced_tokens: ["confirmation", "number"], example: {text: "Your confirmation number is 4471.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a2.unit25.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "proof of residency", media_asset_key: "en.a2.audio.bureaucracy.words.proof_of_residency.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit25.lesson01.exercise02.choose_scheduled_visit_word", type: "multiple_choice", tested_text: "appointment", prompt: {target_blocks: [{text: "Which word means a scheduled time to visit an office?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson01.exercise03.choose_paper_that_shows_address", type: "multiple_choice", tested_text: "proof of residency", prompt: {target_blocks: [{text: "Which phrase means a document that shows where you live?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson01.exercise05.write_confirmation_number", type: "writing_prompt", tested_text: "confirmation number", prompt: {target_blocks: [{text: "Write the phrase for the number that confirms your appointment.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit25.lesson02.making_a_formal_appointment"
        title: "Making a formal appointment by phone"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit25.lesson02.teach.i_was_wondering_whether", kind: "phrase", target: {text: "I was wondering whether I could make an appointment.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "was", "wondering", "whether", "could", "make", "an"]}
          - {content_key: "en.a2.unit25.lesson02.teach.would_it_be_possible", kind: "phrase", target: {text: "Would it be possible to come this Friday?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Would", "it", "be", "possible", "to", "come", "this", "Friday"]}
          - {content_key: "en.a2.unit25.lesson02.teach.because_i_moved", kind: "phrase", target: {text: "I need to update my address because I moved last month.", language_code: "en", direction: "ltr"}, introduced_tokens: ["need", "update", "my", "address", "because", "moved", "last", "month"]}
        exercises:
          - {content_key: "en.a2.unit25.lesson02.exercise01.listen_request", type: "listen_select", tested_text: "I was wondering whether I could make an appointment", media_asset_key: "en.a2.audio.bureaucracy.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit25.lesson02.exercise02.choose_polite_appointment_request", type: "multiple_choice", tested_text: "I was wondering whether I could make an appointment.", prompt: {target_blocks: [{text: "You are calling an office formally to ask for an appointment. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson02.exercise03.order_would_it_be_possible", type: "word_order", tested_text: "Would it be possible to come this Friday", prompt: {target_blocks: []}, word_bank: ["it", "be", "possible", "to", "come", "this", "Friday", "Would"]}
          - {content_key: "en.a2.unit25.lesson02.exercise04.reply_why_update_address", type: "dialogue_response", tested_text: "I need to update my address because I moved last month", prompt: {target_blocks: [{text: "Why do you need to update your address?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson02.exercise05.write_formal_reason", type: "writing_prompt", tested_text: "I need to update my address because I moved last month.", prompt: {target_blocks: []}}

      - content_key: "en.a2.unit25.lesson03.reading_a_registration_notice"
        title: "Reading a registration notice"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit25.lesson03.teach.photo_id", kind: "vocabulary", target: {text: "photo ID", language_code: "en", direction: "ltr"}, introduced_tokens: ["photo", "ID"], example: {text: "You'll need a photo ID and one proof of residency.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit25.lesson03.teach.utility_bill", kind: "vocabulary", target: {text: "utility bill", language_code: "en", direction: "ltr"}, introduced_tokens: ["utility", "bill"], example: {text: "A utility bill is a common example of proof of residency.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit25.lesson03.teach.notice_text", kind: "reading", target: {text: "To update your address, please bring a photo ID and one proof of residency, such as a utility bill. You have lived at your new address since last month, so please also bring your lease.", language_code: "en", direction: "ltr"}, introduced_tokens: ["To", "your", "please", "bring", "a", "and", "one", "such", "as", "You", "have", "lived", "at", "new", "since", "so", "also", "lease"]}
          - {content_key: "en.a2.unit25.lesson03.teach.i_will_bring", kind: "phrase", target: {text: "I will bring a photo ID.", language_code: "en", direction: "ltr"}, introduced_tokens: ["will"]}
        exercises:
          - {content_key: "en.a2.unit25.lesson01.exercise04.match_registration_words", type: "matching_pairs", tested_text: "appointment document form confirmation number", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "appointment", right: "a scheduled time to visit an office"}, {left: "document", right: "official paper you provide as evidence"}, {left: "form", right: "a paper you fill out with your information"}, {left: "confirmation number", right: "the number that confirms your appointment"}, {left: "proof of residency", right: "a document that shows where you live"}, {left: "photo ID", right: "identification with your photo on it"}, {left: "utility bill", right: "a bill, such as for electricity, used as an example of proof of residency"}, {left: "because", right: "used to give a reason"}]}
          - {content_key: "en.a2.unit25.lesson03.exercise01.read_required_id", type: "reading_comprehension", tested_text: "a photo ID", prompt: {target_blocks: [{text: "What kind of identification is required?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson03.exercise02.read_example_proof", type: "reading_comprehension", tested_text: "a utility bill", prompt: {target_blocks: [{text: "What is given as an example of proof of residency?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson03.exercise03.choose_since_when", type: "multiple_choice", tested_text: "since last month", prompt: {target_blocks: [{text: "How long has the reader lived at the new address?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson03.exercise04.order_bring_photo_id", type: "word_order", tested_text: "please bring a photo ID and one proof of residency", prompt: {target_blocks: []}, word_bank: ["bring", "a", "photo", "ID", "and", "one", "proof", "of", "residency", "please"]}
          - {content_key: "en.a2.unit25.lesson03.exercise05.write_own_notice_reply", type: "writing_prompt", tested_text: "I will bring a photo ID and a utility bill.", prompt: {target_blocks: []}}

      - content_key: "en.a2.unit25.lesson04.dmv_appointment_dialogue"
        title: "Booking the appointment"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit25.lesson04.teach.could_you_tell_me", kind: "phrase", target: {text: "Could you tell me what I need to bring?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Could", "you", "tell", "me", "what", "need", "bring"]}
          - {content_key: "en.a2.unit25.lesson04.teach.q_since_when", kind: "dialogue", target: {text: "How long have you lived at the new address?", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["How", "long", "have", "you", "lived", "at", "the", "new", "address"]}
          - {content_key: "en.a2.unit25.lesson04.teach.a_since_last_month", kind: "dialogue", target: {text: "Since last month.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["last", "month"]}
          - {content_key: "en.a2.unit25.lesson04.teach.q_would_it_be_possible", kind: "dialogue", target: {text: "Would it be possible to come this Friday?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit25.lesson04.teach.a_friday_works_confirmation", kind: "dialogue", target: {text: "Yes, Friday at 10am works. Your confirmation number is 4471.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["Yes", "Friday", "at", "10am", "works", "Your", "confirmation", "number", "is", "4471"]}
        exercises:
          - {content_key: "en.a2.unit25.lesson04.exercise01.listen_since_when_answer", type: "dialogue_comprehension", tested_text: "since last month", media_asset_key: "en.a2.audio.dialogue.dmv_appointment.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit25.lesson04.exercise02.listen_required_documents", type: "listen_select", tested_text: "a photo ID and one proof of residency", media_asset_key: "en.a2.audio.dialogue.dmv_appointment.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit25.lesson04.exercise03.choose_appointment_day", type: "multiple_choice", tested_text: "Friday at 10am", prompt: {target_blocks: [{text: "When is Daniel's appointment?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit25.lesson04.exercise04.order_since_when_question", type: "word_order", tested_text: "How long have you lived at the new address", prompt: {target_blocks: []}, word_bank: ["long", "have", "you", "lived", "at", "the", "new", "address", "How"]}
          - content_key: "en.a2.unit25.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "Since last month Could you tell me what I need to bring Would it be possible to come this Friday"
            prompt: {target_blocks: [{text: "How long have you lived at the new address?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit25.lesson04.exercise06.speak_bureaucracy_dialogue"
            type: "speak_response"
            tested_text: "Since last month Could you tell me what I need to bring Would it be possible to come this Friday"
            prompt: {target_blocks: [{text: "How long have you lived at the new address?", language_code: "en", direction: "ltr"}]}
