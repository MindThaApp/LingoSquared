        spine_outcome_id: "universal.a1.clothing.describe_buy_clothing"
        teaching:
          - {content_key: "en.a1.unit12.lesson01.teach.shirt", kind: "vocabulary", target: {text: "shirt", language_code: "en", direction: "ltr"}, introduced_tokens: ["shirt"], example: {text: "I need a new shirt.", language_code: "en", direction: "ltr"}}
