          - {content_key: "en.a1.unit12.lesson04.teach.q_medium", kind: "dialogue", target: {text: "Excuse me, do you have this shirt in a medium?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Excuse", "me", "shirt"]}
          - {content_key: "en.a1.unit12.lesson04.teach.a_here_you_go", kind: "dialogue", target: {text: "Yes, here you go.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes"]}
          - {content_key: "en.a1.unit12.lesson04.teach.q_blue", kind: "dialogue", target: {text: "Great. Do you have it in blue?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Great"]}
          - {content_key: "en.a1.unit12.lesson04.teach.a_yes_we_do", kind: "dialogue", target: {text: "Yes, we do.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["we", "do"]}
          - {content_key: "en.a1.unit12.lesson04.teach.closing_ill_take_it", kind: "dialogue", target: {text: "I'll take it, thanks.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.a1.unit12.lesson04.exercise01.listen_size_available", type: "dialogue_comprehension", tested_text: "Yes, here you go", media_asset_key: "en.a1.audio.dialogue.clothing_store.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit12.lesson04.exercise02.listen_color_available", type: "listen_select", tested_text: "Yes, we do", media_asset_key: "en.a1.audio.dialogue.clothing_store.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit12.lesson04.exercise03.choose_final_response"
            type: "multiple_choice"
            tested_text: "I'll take it, thanks."
            prompt: {target_blocks: [{text: "Leila decides to buy the shirt. What does she say?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit12.lesson04.exercise04.order_q_medium", type: "word_order", tested_text: "do you have this shirt in a medium", prompt: {target_blocks: []}, word_bank: ["you", "have", "this", "shirt", "in", "a", "medium", "do"]}
          - content_key: "en.a1.unit12.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "Excuse me do you have this shirt in a medium Great Do you have it in blue I'll take it thanks"
            prompt: {target_blocks: [{text: "Ask for the shirt in medium, then ask if it comes in blue, then decide to buy it.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit12.lesson04.exercise06.speak_shopping"
            type: "speak_response"
            tested_text: "Excuse me do you have this shirt in a medium Great Do you have it in blue I'll take it thanks"
            prompt: {target_blocks: [{text: "Ask for the shirt in medium, then ask if it comes in blue, then decide to buy it.", language_code: "en", direction: "ltr"}]}
