            type: "multiple_choice"
            tested_text: "shoes"
            prompt: {target_blocks: [{text: "Which word means what you wear on your feet?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit12.lesson01.exercise03.choose_dress"
            type: "multiple_choice"
            tested_text: "dress"
            prompt: {target_blocks: [{text: "Which word means a one-piece item women often wear?", language_code: "en", direction: "ltr"}]}
