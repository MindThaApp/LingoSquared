          - {content_key: "en.a1.unit12.lesson02.teach.large", kind: "vocabulary", target: {text: "large", language_code: "en", direction: "ltr"}, introduced_tokens: ["large"], example: {text: "This jacket is a large.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit12.lesson02.teach.blue", kind: "vocabulary", target: {text: "blue", language_code: "en", direction: "ltr"}, introduced_tokens: ["blue"], example: {text: "The shirt is blue.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit12.lesson02.teach.black", kind: "vocabulary", target: {text: "black", language_code: "en", direction: "ltr"}, introduced_tokens: ["black"], example: {text: "She has black shoes.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit12.lesson02.teach.do_you_have_in_medium", kind: "phrase", target: {text: "Do you have this in a medium?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "have", "this", "in", "a", "medium"]}
          - {content_key: "en.a1.unit12.lesson02.teach.do_you_have_in_blue", kind: "phrase", target: {text: "Do you have it in blue?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "have", "it", "in", "blue"]}
        exercises:
          - {content_key: "en.a1.unit12.lesson02.exercise01.listen_size_question", type: "listen_select", tested_text: "Do you have this in a medium", media_asset_key: "en.a1.audio.clothing.size_question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit12.lesson02.exercise02.listen_color_question", type: "listen_select", tested_text: "Do you have it in blue", media_asset_key: "en.a1.audio.clothing.color_question.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit12.lesson02.exercise03.choose_large"
            type: "multiple_choice"
            tested_text: "large"
            prompt: {target_blocks: [{text: "Which size is bigger than medium?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit12.lesson02.exercise04.order_color_question", type: "word_order", tested_text: "Do you have it in blue", prompt: {target_blocks: []}, word_bank: ["you", "have", "it", "in", "blue", "Do"]}
          - {content_key: "en.a1.unit12.lesson02.exercise05.write_size_request", type: "writing_prompt", tested_text: "Do you have this in a medium?", prompt: {target_blocks: [{text: "Write how you ask if a medium size is available.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit12.lesson03.reading_a_label"
        title: "Reading a clothing label"
        spine_outcome_id: "universal.a1.clothing.describe_buy_clothing"
        teaching:
          - {content_key: "en.a1.unit12.lesson03.teach.size", kind: "vocabulary", target: {text: "size", language_code: "en", direction: "ltr"}, introduced_tokens: ["size"], example: {text: "What size is this shirt?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit12.lesson03.teach.color", kind: "vocabulary", target: {text: "color", language_code: "en", direction: "ltr"}, introduced_tokens: ["color"], example: {text: "What color is the jacket?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit12.lesson03.teach.label_text", kind: "reading", target: {text: "Shirt. Size: Medium. Color: Blue. Price: $20.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Shirt", "Size", "Medium", "Color", "Blue", "Price", "20"]}
          - {content_key: "en.a1.unit12.lesson03.teach.label_summary_sentence", kind: "phrase", target: {text: "The shirt is a medium and it's blue.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "shirt", "is", "a", "medium", "and", "it's", "blue"]}
        exercises:
          - content_key: "en.a1.unit12.lesson03.exercise01.read_size"
            type: "reading_comprehension"
            tested_text: "Medium"
            prompt: {target_blocks: [{text: "What size is the shirt?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit12.lesson03.exercise02.read_color"
            type: "reading_comprehension"
            tested_text: "Blue"
            prompt: {target_blocks: [{text: "What color is the shirt?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit12.lesson03.exercise03.choose_price"
            type: "multiple_choice"
            tested_text: "$20"
            prompt: {target_blocks: [{text: "How much does the shirt cost?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit12.lesson03.exercise04.match_label_fields", type: "matching_pairs", tested_text: "Size Color Price", prompt: {target_blocks: []}, pairs: [{left: "Size", right: "Medium"}, {left: "Color", right: "Blue"}, {left: "Price", right: "$20"}, {left: "Item", right: "Shirt"}, {left: "The clothing size bigger than medium", right: "Large"}, {left: "The color with no light at all, opposite of white", right: "Black"}]}
          - {content_key: "en.a1.unit12.lesson03.exercise05.write_label_summary", type: "writing_prompt", tested_text: "The shirt is a medium and it's blue", prompt: {target_blocks: [{text: "Write the shirt's size and color.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit12.lesson04.clothing_store_dialogue"
        title: "At the clothing store"
        spine_outcome_id: "universal.a1.clothing.describe_buy_clothing"
        teaching:
          - {content_key: "en.a1.unit12.lesson04.teach.here_you_go", kind: "phrase", target: {text: "Here you go.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Here", "you", "go"]}
