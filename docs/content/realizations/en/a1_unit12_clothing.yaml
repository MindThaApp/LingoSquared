          - {content_key: "en.a1.unit12.lesson01.exercise05.write_dress", type: "writing_prompt", tested_text: "dress", prompt: {target_blocks: [{text: "Write the word for a one-piece item of clothing.", language_code: "en", direction: "ltr"}]}}

