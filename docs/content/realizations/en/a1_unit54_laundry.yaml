          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hi! Do you need a washing machine?", language_code: "en", direction: "ltr", speaker: "Attendant"}, introduced_tokens: ["Hi"], media_asset_key: "en.a1.audio.dialogue.laundry.01"}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Yes, please. My washing machine at home is broken.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "My", "at", "home", "broken"]}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "I have a small load too. Can I use a machine as well?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["small", "too", "Can", "use", "as", "well"]}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Sure! The machines take quarters.", language_code: "en", direction: "ltr", speaker: "Attendant"}, introduced_tokens: ["Sure"]}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Yes, I have quarters.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "The wash cycle takes thirty minutes.", language_code: "en", direction: "ltr", speaker: "Attendant"}, introduced_tokens: ["takes", "thirty", "minutes"]}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "And how much does it cost?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["And", "much", "it", "cost"]}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line8", kind: "dialogue", target: {text: "It's three dollars for one load.", language_code: "en", direction: "ltr", speaker: "Attendant"}, introduced_tokens: []}
          - {content_key: "en.a1.unit54.lesson03.teach.dialogue_line9", kind: "dialogue", target: {text: "The laundromat closes at nine, so please pick up your laundry before then.", language_code: "en", direction: "ltr", speaker: "Attendant"}, introduced_tokens: ["closes", "so", "before", "then"]}
        exercises:
          - {content_key: "en.a1.unit54.lesson03.exercise01.comprehension_reason", type: "multiple_choice", tested_text: "washing machine at home is broken", prompt: {target_blocks: [{text: "According to the dialogue, why does Leila need to use the laundromat?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit54.lesson03.exercise02.comprehension_daniel_load_size", type: "multiple_choice", tested_text: "small", prompt: {target_blocks: [{text: "According to the dialogue, what size load does Daniel have?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit54.lesson03.exercise03.listen_dialogue_cost", type: "listen_select", tested_text: "three dollars", media_asset_key: "en.a1.audio.dialogue.laundry.01", prompt: {target_blocks: [{text: "According to the dialogue, how much does the wash cost?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit54.lesson03.exercise04.respond_own_laundry_statement", type: "speak_response", tested_text: "nine o'clock", accepted_answers: ["The laundromat closes at nine", "The laundromat closes at nine.", "The laundromat closes at nine o'clock", "The laundromat closes at nine o'clock.", "It's three dollars for one load", "It's three dollars for one load.", "The wash cycle takes thirty minutes", "The wash cycle takes thirty minutes."], prompt: {target_blocks: [{text: "Say what time the laundromat closes, how much the wash costs, or how long the cycle takes.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit54.lesson04.a_trip_to_the_laundromat"
        title: "Reading: A trip to the laundromat"
        spine_outcome_id: "universal.a1.laundry.use_launderette"
        teaching:
          - {content_key: "en.a1.unit54.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Trip to the Laundromat: One afternoon, the washing machine in Leila's apartment building broke. She decided to go to the laundromat down the street. Daniel came along because he had a small load of laundry too. At the laundromat, the attendant explained that the machines take quarters, and the wash cycle takes thirty minutes. It cost three dollars for one load. While their clothes washed, Daniel and Leila talked and had coffee at a cafe next door. The laundromat closes at nine o'clock, so they made sure to pick up their laundry before then. Leila was thankful that Daniel kept her company, and she said the machine at home would probably be fixed by the weekend.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Trip", "to", "the", "Laundromat", "One", "afternoon", "washing", "machine", "in", "Leila", "apartment", "building", "broke", "She", "decided", "go", "down", "street", "Daniel", "came", "along", "because", "he", "had", "a", "small", "load", "of", "laundry", "too", "At", "attendant", "explained", "that", "machines", "take", "quarters", "and", "wash", "cycle", "takes", "thirty", "minutes", "It", "cost", "three", "dollars", "for", "one", "While", "their", "clothes", "washed", "talked", "had", "coffee", "at", "a", "cafe", "next", "door", "closes", "nine", "o'clock", "so", "they", "made", "sure", "pick", "up", "before", "then", "was", "thankful", "kept", "her", "company", "said", "would", "probably", "be", "fixed", "by", "weekend"]}
        exercises:
          - {content_key: "en.a1.unit54.lesson04.exercise01.reading_break_reason", type: "multiple_choice", tested_text: "Leila's washing machine broke", prompt: {target_blocks: [{text: "According to the reading, why did Leila go to the laundromat?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit54.lesson04.exercise02.reading_daniel_reason", type: "multiple_choice", tested_text: "he had a small load of laundry too", prompt: {target_blocks: [{text: "According to the reading, why did Daniel come along?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit54.lesson04.exercise03.reading_closing_time", type: "multiple_choice", tested_text: "nine o'clock", prompt: {target_blocks: [{text: "According to the reading, what time does the laundromat close?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit54.lesson04.exercise04.write_own_laundromat_message", type: "writing_prompt", tested_text: "Leila's washing machine broke, and the laundromat closes at nine.", prompt: {target_blocks: [{text: "Write a short message: say why Leila went to the laundromat, and say what time it closes.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["Leila's washing machine broke, and the laundromat closes at nine.", "Leila's washing machine broke. The laundromat closes at nine.", "Leila's washing machine broke and the laundromat closes at nine.", "Leila's washing machine broke, and the laundromat closes at nine o'clock.", "Leila's washing machine broke. The laundromat closes at nine o'clock.", "Leila's washing machine broke and the laundromat closes at nine o'clock."]}
