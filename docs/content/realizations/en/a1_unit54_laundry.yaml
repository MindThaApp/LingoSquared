  - {content_key: "en.a1.audio.laundry.phrases.how_long_does_the_wash_cycle_take.01", language: "en", text: "How long does the wash cycle take?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.laundry.01"
    language: "en"
    text: "Attendant: Hi! Do you need a washing machine? Leila: Yes, please. My washing machine at home is broken. Daniel: I have a small load too. Can I use a machine as well? Attendant: Sure! The machines take quarters. Leila: Yes, I have quarters. Attendant: The wash cycle takes thirty minutes. Daniel: And how much does it cost? Attendant: It's three dollars for one load. Attendant: The laundromat closes at nine, so please pick up your laundry before then."
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

