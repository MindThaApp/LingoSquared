course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Laundromat register is a simple, everyday spoken exchange between two friends and a laundromat attendant about using self-service machines: asking to wash a load, understanding that machines take quarters, understanding the wash cycle's length and cost, and understanding a closing/pickup-time instruction. Core vocabulary (laundromat/washing machine/dryer/quarters/detergent/load) is deliberately generic to a routine self-service laundromat visit, not a drop-off wash-and-fold service (a different, more complex register than this A1 outcome's own can_do line covers) and not laundry as a household chore in general (already covered in unit38 -- this unit is specifically about the launderette/laundromat setting)."

