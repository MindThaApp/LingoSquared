            prompt: {target_blocks: [{text: "You don't look well. What's wrong? Do you have a fever?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit22.lesson04.exercise06.speak_health_dialogue"
            type: "speak_response"
            tested_text: "I have a headache and a sore throat I'm not sure but I feel hot Okay thank you I'll rest today"
            prompt: {target_blocks: [{text: "You don't look well. What's wrong? Do you have a fever?", language_code: "en", direction: "ltr"}]}
