units:
  - content_key: "en.a1.unit64.compliments"
    title: "Compliments"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.emotions.express_basic_feelings"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit64.lesson01.compliment_words"
        title: "Words for compliments"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit64.lesson01.teach.nice", kind: "vocabulary", target: {text: "nice", language_code: "en", direction: "ltr"}, introduced_tokens: ["nice", "That", "is"], example: {text: "That is nice.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit64.lesson01.teach.great", kind: "vocabulary", target: {text: "great", language_code: "en", direction: "ltr"}, introduced_tokens: ["great", "You", "look"], example: {text: "You look great.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit64.lesson01.teach.lovely", kind: "vocabulary", target: {text: "lovely", language_code: "en", direction: "ltr"}, introduced_tokens: ["lovely", "What", "a"], example: {text: "What a lovely smile.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit64.lesson01.teach.kind", kind: "vocabulary", target: {text: "kind", language_code: "en", direction: "ltr"}, introduced_tokens: ["kind", "very"], example: {text: "That is very kind.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit64.lesson01.teach.smile", kind: "vocabulary", target: {text: "smile", language_code: "en", direction: "ltr"}, introduced_tokens: ["smile"], example: {text: "What a lovely smile.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit64.lesson01.teach.jacket", kind: "vocabulary", target: {text: "jacket", language_code: "en", direction: "ltr"}, introduced_tokens: ["jacket", "I", "like", "your"], example: {text: "I like your jacket.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit64.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "lovely", media_asset_key: "en.a1.audio.compliments.words.lovely.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit64.lesson01.exercise02.choose_kind_meaning", type: "multiple_choice", tested_text: "kind", prompt: {target_blocks: [{text: "Which word means friendly and good to someone?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson01.exercise03.match_compliment_words", type: "matching_pairs", tested_text: "nice great lovely kind smile jacket", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "nice", right: "good and pleasant"}, {left: "great", right: "very good"}, {left: "lovely", right: "beautiful or very nice"}, {left: "kind", right: "friendly and good to someone"}, {left: "smile", right: "a happy face"}, {left: "jacket", right: "clothing for your upper body"}]}
          - {content_key: "en.a1.unit64.lesson01.exercise04.order_jacket_sentence", type: "word_order", tested_text: "I like your jacket.", word_bank: ["I", "like", "your", "jacket."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson01.exercise05.write_smile", type: "writing_prompt", tested_text: "smile", prompt: {target_blocks: [{text: "Write the word for a happy face.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit64.lesson02.compliment_phrases"
        title: "Phrases for compliments"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit64.lesson02.teach.that_is_nice", kind: "phrase", target: {text: "That is nice.", language_code: "en", direction: "ltr"}, introduced_tokens: ["That", "is", "nice"]}
          - {content_key: "en.a1.unit64.lesson02.teach.you_look_great", kind: "phrase", target: {text: "You look great.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "look", "great"]}
          - {content_key: "en.a1.unit64.lesson02.teach.like_your_jacket", kind: "phrase", target: {text: "I like your jacket.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "like", "your", "jacket"]}
          - {content_key: "en.a1.unit64.lesson02.teach.lovely_smile", kind: "phrase", target: {text: "What a lovely smile.", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "a", "lovely", "smile"]}
          - {content_key: "en.a1.unit64.lesson02.teach.very_kind", kind: "phrase", target: {text: "That is very kind.", language_code: "en", direction: "ltr"}, introduced_tokens: ["very", "kind"]}
          - {content_key: "en.a1.unit64.lesson02.teach.thank_you_much", kind: "phrase", target: {text: "Thank you very much.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Thank", "you", "much"]}
        exercises:
          - {content_key: "en.a1.unit64.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "You look great.", media_asset_key: "en.a1.audio.compliments.phrases.you_look_great.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit64.lesson02.exercise02.choose_compliment", type: "multiple_choice", tested_text: "I like your jacket.", prompt: {target_blocks: [{text: "Which phrase gives a compliment about clothing?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson02.exercise03.choose_thanks", type: "multiple_choice", tested_text: "Thank you very much.", prompt: {target_blocks: [{text: "Which phrase is a polite answer to a compliment?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson02.exercise04.order_great_sentence", type: "word_order", tested_text: "You look great.", word_bank: ["You", "look", "great."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson02.exercise05.translate_nice", type: "translation", tested_text: "That is nice.", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit64.lesson03.dialogue_giving_compliments"
        title: "Dialogue: Giving compliments"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit64.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hi Leila. You look great today.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Hi", "Leila", "today"], media_asset_key: "en.a1.audio.dialogue.compliments.01"}
          - {content_key: "en.a1.unit64.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Thank you, Mia.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Mia"], media_asset_key: "en.a1.audio.dialogue.compliments.01"}
          - {content_key: "en.a1.unit64.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "I like your green jacket.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["green"], media_asset_key: "en.a1.audio.dialogue.compliments.01"}
          - {content_key: "en.a1.unit64.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "That is very kind.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.compliments.01"}
          - {content_key: "en.a1.unit64.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "What a lovely smile too. Look, this is my photo.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["too"], media_asset_key: "en.a1.audio.dialogue.compliments.01"}
          - {content_key: "en.a1.unit64.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Thank you very much. Your photo is nice.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Your", "photo"], media_asset_key: "en.a1.audio.dialogue.compliments.01"}
          - {content_key: "en.a1.unit64.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Thanks. It is for Daniel.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Thanks", "It", "for", "Daniel"], media_asset_key: "en.a1.audio.dialogue.compliments.01"}
        exercises:
          - {content_key: "en.a1.unit64.lesson03.exercise01.comprehension_clothing", type: "multiple_choice", tested_text: "green jacket", prompt: {target_blocks: [{text: "According to the dialogue, what does Mia like?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson03.exercise02.comprehension_photo", type: "multiple_choice", tested_text: "nice", prompt: {target_blocks: [{text: "According to the dialogue, how is Mia's photo?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson03.exercise03.listen_dialogue_compliment", type: "listen_select", tested_text: "I like your green jacket.", media_asset_key: "en.a1.audio.dialogue.compliments.01", prompt: {target_blocks: [{text: "Which compliment does Mia say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson03.exercise04.respond_own_compliment", type: "speak_response", tested_text: "I like your jacket.", accepted_answers: ["I like your jacket", "I like your jacket.", "You look great", "You look great.", "That is nice", "That is nice.", "Thank you very much", "Thank you very much."], prompt: {target_blocks: [{text: "Give a simple compliment or answer a compliment.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit64.lesson04.a_kind_message"
        title: "Reading: A kind message"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit64.lesson04.teach.message", kind: "reading", target: {text: "Kind message: Your green jacket is lovely. Your photo is nice. Thank you for being kind.", language_code: "en", direction: "ltr"}, introduced_tokens: ["message", "being"]}
          - {content_key: "en.a1.unit64.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Compliment for a Friend: Mia saw Leila in a green jacket. Mia said Leila looked great. She also said Leila had a lovely smile. Leila thanked Mia. Then Leila looked at Mia's photo and said it was nice. Mia was happy because the photo was for Daniel. Later, Leila wrote a short message: Your green jacket is lovely.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Compliment", "Friend", "saw", "in", "said", "looked", "She", "also", "had", "thanked", "Then", "looked", "at", "Mia's", "was", "happy", "because", "Later", "wrote", "short"]}
        exercises:
          - {content_key: "en.a1.unit64.lesson04.exercise01.message_jacket", type: "multiple_choice", tested_text: "lovely", prompt: {target_blocks: [{text: "According to the message, how is the green jacket?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson04.exercise02.message_photo", type: "multiple_choice", tested_text: "nice", prompt: {target_blocks: [{text: "According to the message, how is the photo?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson04.exercise03.reading_who_wore_jacket", type: "multiple_choice", tested_text: "Leila", prompt: {target_blocks: [{text: "According to the reading, who wore the green jacket?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson04.exercise04.reading_who_photo_for", type: "multiple_choice", tested_text: "Daniel", prompt: {target_blocks: [{text: "According to the reading, who was the photo for?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit64.lesson04.exercise05.write_own_kind_message", type: "writing_prompt", tested_text: "Your jacket is lovely. Thank you.", prompt: {target_blocks: [{text: "Write a short message: compliment a jacket, and say thank you.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["Your jacket is lovely. Thank you.", "Your jacket is nice. Thank you.", "I like your jacket. Thank you.", "Your jacket is lovely, thank you.", "Your jacket is nice, thank you.", "I like your jacket, thank you."]}
