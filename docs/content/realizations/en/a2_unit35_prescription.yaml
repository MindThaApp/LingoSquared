schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    No public-domain source material was consulted for this unit: the
    verified PD source map in AUTHORING_GUIDE §10 covers the LEARNER's
    languages (FSI Persian/Dari/Dutch), not English-as-target A2
    pharmacy material, and firecrawl was not used. Authored directly
    from established ESL A2 conventions against the spine outcome
    universal.a2.health.attend_doctor_appointment, whose can_do
    explicitly includes "understand simple treatment and follow-up
    instructions" -- the half a2_unit28_doctor (the consultation
    itself) does not deliver. Facts are deliberately continuous with
    a2_unit28_doctor per AUTHORING_GUIDE §11: Daniel's bad cold, the
    doctor's "take this medicine twice a day for five days" and the
    one-week follow-up rule are reused verbatim as the prescription
    this unit picks up, rather than inventing a conflicting illness.
status: "complete_draft"
review:
  status: "unreviewed"
  required_next_reviewer: "fresh_context"
  notes: >-
    First of 6 new A2 units (unit35-unit40) authored 2026-07-22 to close
    the publish-gate teaching-hours gap on the shared English
    realization consumed by nl-en / fa-en / prs-en. Spine outcome
    universal.a2.health.attend_doctor_appointment is REUSED from
    a2_unit28_doctor -- an established pattern in this corpus (9 spine
    outcomes already carry 2-3 en units) -- because all 10 A2 spine
    outcomes were already claimed by units 25-34 and adding new spine
    outcomes would leave every other language path with newly-uncovered
    outcomes. The SCENARIO is new and does not duplicate unit28: unit28
    is calling for an appointment and the consultation; this unit is the
    pharmacy counter afterwards -- dose, frequency, duration, side
    effects, and the label. Character canon checked before writing
    (AUTHORING_PREFLIGHT §6): Daniel = engineer at a small company
    downtown (a1_unit23), had a headache and a sore throat for three
    days and was diagnosed with a bad cold, told to take medicine twice
    a day for five days (a2_unit28); nothing here contradicts that. The
    Pharmacist is an unnamed role speaker, consistent with the corpus's
    Clerk / Doctor / Manager / Teller convention (a1_unit51's
    "Pharmacist" is a different course level and carries no pinned
    facts). Every exercise's tested_text is covered by this file's own
    or the A2 chain's earlier introduced_tokens. No fill_in_blank
    exercises (matching this realization's A2 pattern of avoiding the
    type rather than risking §17 ambiguity). PENDING a fresh-context
    review per AUTHORING_GUIDE §9 -- do not flip to reviewed without it.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at the polite service-counter register unit25/unit27/unit28/unit29 already use (I'd like to..., Are there any...?), plus should/shouldn't for instructions and frequency expressions (once/twice/three times a day)."

media_assets:
  - {content_key: "en.a2.audio.prescription.words.pharmacist.01", language: "en", text: "pharmacist", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.prescription.question.01", language: "en", text: "I'd like to pick up a prescription.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.prescription.description.01", language: "en", text: "Cold medicine. Take one tablet twice a day with food, for five days. Do not stop taking the tablets early. Possible side effects: you may feel tired. Refills: one.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.prescription.01"
    language: "en"
    text: "Daniel: Hi, I'd like to pick up a prescription. Pharmacist: Of course. What's your name? Daniel: Daniel. The doctor gave me medicine for a bad cold. Pharmacist: Here it is. Take one tablet twice a day with food. Daniel: How many days should I take it? Pharmacist: For five days. Do not stop taking the tablets early. Daniel: Are there any side effects? Pharmacist: You may feel tired, but that's all. Daniel: Thank you very much."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit35.prescription"
    title: "Picking up a prescription"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.health.attend_doctor_appointment"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit35.lesson01.pharmacy_vocabulary"
        title: "Tablets, doses, and side effects"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit35.lesson01.teach.pharmacy", kind: "vocabulary", target: {text: "pharmacy", language_code: "en", direction: "ltr"}, introduced_tokens: ["pharmacy"], example: {text: "There is a pharmacy next to the doctor's office.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit35.lesson01.teach.pharmacist", kind: "vocabulary", target: {text: "pharmacist", language_code: "en", direction: "ltr"}, introduced_tokens: ["pharmacist"], example: {text: "The pharmacist explained how to take the medicine.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit35.lesson01.teach.tablet", kind: "vocabulary", target: {text: "tablet", language_code: "en", direction: "ltr"}, introduced_tokens: ["tablet"], example: {text: "I take one tablet in the morning and one in the evening.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit35.lesson01.teach.dose", kind: "vocabulary", target: {text: "dose", language_code: "en", direction: "ltr"}, introduced_tokens: ["dose"], example: {text: "The dose is one tablet twice a day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit35.lesson01.teach.refill", kind: "vocabulary", target: {text: "refill", language_code: "en", direction: "ltr"}, introduced_tokens: ["refill"], example: {text: "I need a refill because my tablets are almost finished.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit35.lesson01.teach.side_effects", kind: "vocabulary", target: {text: "side effects", language_code: "en", direction: "ltr"}, introduced_tokens: ["side", "effects"], example: {text: "The pharmacist told me about the side effects of this medicine.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit35.lesson01.teach.grammar_frequency", kind: "grammar_note", target: {text: "once a day, twice a day, three times a day, every eight hours", language_code: "en", direction: "ltr"}, introduced_tokens: ["once", "eight", "hours"]}
        exercises:
          - {content_key: "en.a2.unit35.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "pharmacist", media_asset_key: "en.a2.audio.prescription.words.pharmacist.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit35.lesson01.exercise02.choose_dose_word", type: "multiple_choice", tested_text: "dose", prompt: {target_blocks: [{text: "Which word means how much medicine you take each time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson01.exercise03.choose_side_effects_phrase", type: "multiple_choice", tested_text: "side effects", prompt: {target_blocks: [{text: "Which phrase means the extra things a medicine can do to you?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit35.lesson01.exercise04.match_pharmacy_words"
            type: "matching_pairs"
            tested_text: "pharmacy pharmacist tablet dose refill side effects medicine prescription"
            prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}
            pairs:
              - {left: "the shop where you get medicine", right: "pharmacy"}
              - {left: "the person who gives you your medicine", right: "pharmacist"}
              - {left: "one small round piece of medicine", right: "tablet"}
              - {left: "how much medicine you take each time", right: "dose"}
              - {left: "a new supply of the same medicine", right: "refill"}
              - {left: "the extra things a medicine can do to you", right: "side effects"}
              - {left: "what a doctor tells you to take when you are ill", right: "medicine"}
              - {left: "the doctor's written order for your medicine", right: "prescription"}
          - {content_key: "en.a2.unit35.lesson01.exercise05.write_pharmacist", type: "writing_prompt", tested_text: "pharmacist", prompt: {target_blocks: [{text: "Write the word for the person who gives you your medicine.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit35.lesson02.asking_at_the_counter"
        title: "Asking about the dose and the side effects"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit35.lesson02.teach.pick_up_prescription", kind: "phrase", target: {text: "I'd like to pick up a prescription.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'd", "like", "to", "pick", "up", "a", "prescription"]}
          - {content_key: "en.a2.unit35.lesson02.teach.take_one_tablet", kind: "phrase", target: {text: "Take one tablet twice a day with food.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Take", "one", "tablet", "twice", "a", "day", "with", "food"]}
          - {content_key: "en.a2.unit35.lesson02.teach.ask_how_many_days", kind: "phrase", target: {text: "How many days should I take it?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "many", "days", "should", "I", "take", "it"]}
          - {content_key: "en.a2.unit35.lesson02.teach.ask_side_effects", kind: "phrase", target: {text: "Are there any side effects?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Are", "there", "any", "side", "effects"]}
          - {content_key: "en.a2.unit35.lesson02.teach.grammar_should", kind: "grammar_note", target: {text: "You should take it with food. You shouldn't stop early.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "should", "shouldn't", "stop", "early"]}
        exercises:
          - {content_key: "en.a2.unit35.lesson02.exercise01.listen_request", type: "listen_select", tested_text: "I'd like to pick up a prescription", media_asset_key: "en.a2.audio.prescription.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit35.lesson02.exercise02.choose_counter_request", type: "multiple_choice", tested_text: "I'd like to pick up a prescription.", prompt: {target_blocks: [{text: "You are at the pharmacy counter with a prescription from your doctor. What do you say first?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson02.exercise03.choose_ask_side_effects", type: "multiple_choice", tested_text: "Are there any side effects?", prompt: {target_blocks: [{text: "You want to know what else the medicine can do to you. What do you ask?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson02.exercise04.order_take_one_tablet", type: "word_order", tested_text: "Take one tablet twice a day with food", prompt: {target_blocks: []}, word_bank: ["one", "tablet", "twice", "a", "day", "with", "food", "Take"]}
          - {content_key: "en.a2.unit35.lesson02.exercise05.order_how_many_days", type: "word_order", tested_text: "How many days should I take it", prompt: {target_blocks: []}, word_bank: ["many", "days", "should", "I", "take", "it", "How"]}
          - {content_key: "en.a2.unit35.lesson02.exercise06.reply_ask_side_effects", type: "dialogue_response", tested_text: "Are there any side effects", prompt: {target_blocks: [{text: "Take one tablet twice a day with food.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson02.exercise07.write_counter_request", type: "writing_prompt", tested_text: "I'd like to pick up a prescription.", prompt: {target_blocks: [{text: "Write that you'd like to pick up a prescription.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit35.lesson03.reading_a_pharmacy_label"
        title: "Reading a pharmacy label"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit35.lesson03.teach.before_bed", kind: "vocabulary", target: {text: "before bed", language_code: "en", direction: "ltr"}, introduced_tokens: ["before", "bed"], example: {text: "Some medicine works better if you take it before bed.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit35.lesson03.teach.label_text", kind: "reading", target: {text: "Cold medicine. Take one tablet twice a day with food, for five days. Do not stop taking the tablets early. Possible side effects: you may feel tired. Refills: one.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Cold", "medicine", "Take", "one", "tablet", "twice", "a", "day", "with", "food", "for", "five", "days", "Do", "not", "stop", "taking", "the", "tablets", "early", "Possible", "side", "effects", "you", "may", "feel", "tired", "Refills"]}
          - {content_key: "en.a2.unit35.lesson03.teach.do_not_stop_early", kind: "phrase", target: {text: "Do not stop taking the tablets early.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "not", "stop", "taking", "tablets", "early"]}
        exercises:
          - {content_key: "en.a2.unit35.lesson03.exercise01.read_how_to_take", type: "reading_comprehension", tested_text: "one tablet twice a day with food", prompt: {target_blocks: [{text: "How should you take this medicine, according to the label?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson03.exercise02.read_how_long", type: "reading_comprehension", tested_text: "for five days", prompt: {target_blocks: [{text: "How long should you keep taking the medicine?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson03.exercise03.read_side_effect", type: "reading_comprehension", tested_text: "you may feel tired", prompt: {target_blocks: [{text: "Which side effect does the label mention?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson03.exercise04.choose_refill_count", type: "multiple_choice", tested_text: "one refill", prompt: {target_blocks: [{text: "How many refills does the label allow?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson03.exercise05.order_do_not_stop", type: "word_order", tested_text: "Do not stop taking the tablets early", prompt: {target_blocks: []}, word_bank: ["not", "stop", "taking", "the", "tablets", "early", "Do"]}
          - {content_key: "en.a2.unit35.lesson03.exercise06.write_do_not_stop", type: "writing_prompt", tested_text: "Do not stop taking the tablets early.", prompt: {target_blocks: [{text: "Write the label's warning, beginning with Do not.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit35.lesson04.pharmacy_dialogue"
        title: "At the pharmacy counter"
        spine_outcome_id: "universal.a2.health.attend_doctor_appointment"
        teaching:
          - {content_key: "en.a2.unit35.lesson04.teach.q_pick_up", kind: "dialogue", target: {text: "Hi, I'd like to pick up a prescription.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Hi"]}
          - {content_key: "en.a2.unit35.lesson04.teach.a_what_is_your_name", kind: "dialogue", target: {text: "Of course. What's your name?", language_code: "en", direction: "ltr", speaker: "Pharmacist"}, introduced_tokens: ["Of", "course", "What's", "your", "name"]}
          - {content_key: "en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine", kind: "dialogue", target: {text: "Daniel. The doctor gave me medicine for a bad cold.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["gave"]}
          - {content_key: "en.a2.unit35.lesson04.teach.a_here_it_is", kind: "dialogue", target: {text: "Here it is. Take one tablet twice a day with food.", language_code: "en", direction: "ltr", speaker: "Pharmacist"}, introduced_tokens: ["Here"]}
          - {content_key: "en.a2.unit35.lesson04.teach.q_how_many_days", kind: "dialogue", target: {text: "How many days should I take it?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit35.lesson04.teach.a_five_days_no_stopping", kind: "dialogue", target: {text: "For five days. Do not stop taking the tablets early.", language_code: "en", direction: "ltr", speaker: "Pharmacist"}, introduced_tokens: []}
          - {content_key: "en.a2.unit35.lesson04.teach.q_any_side_effects", kind: "dialogue", target: {text: "Are there any side effects?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit35.lesson04.teach.a_you_may_feel_tired", kind: "dialogue", target: {text: "You may feel tired, but that's all.", language_code: "en", direction: "ltr", speaker: "Pharmacist"}, introduced_tokens: ["but", "that's", "all"]}
          - {content_key: "en.a2.unit35.lesson04.teach.q_thank_you", kind: "dialogue", target: {text: "Thank you very much.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.a2.unit35.lesson04.exercise01.listen_dose", type: "dialogue_comprehension", tested_text: "one tablet twice a day with food", media_asset_key: "en.a2.audio.dialogue.prescription.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit35.lesson04.exercise02.listen_side_effect", type: "listen_select", tested_text: "You may feel tired", media_asset_key: "en.a2.audio.dialogue.prescription.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit35.lesson04.exercise03.choose_how_long", type: "multiple_choice", tested_text: "for five days", prompt: {target_blocks: [{text: "How long should Daniel take the medicine?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit35.lesson04.exercise04.order_any_side_effects", type: "word_order", tested_text: "Are there any side effects", prompt: {target_blocks: []}, word_bank: ["there", "any", "side", "effects", "Are"]}
          - {content_key: "en.a2.unit35.lesson04.exercise05.reply_how_many_days", type: "dialogue_response", tested_text: "How many days should I take it", prompt: {target_blocks: [{text: "Here it is. Take one tablet twice a day with food.", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit35.lesson04.exercise06.speak_pharmacy_dialogue"
            type: "speak_response"
            tested_text: "I'd like to pick up a prescription. How many days should I take it? Are there any side effects?"
            prompt: {target_blocks: [{text: "You are Daniel at the pharmacy counter.", language_code: "en", direction: "ltr"}]}
