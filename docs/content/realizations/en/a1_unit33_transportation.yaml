units:
  - content_key: "en.a1.unit33.transportation"
    title: "Getting around town"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.transportation.getting_around_town"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit33.lesson01.transport_vocabulary"
        title: "Ways to travel"
        spine_outcome_id: "universal.a1.transportation.getting_around_town"
        teaching:
          - {content_key: "en.a1.unit33.lesson01.teach.bus", kind: "vocabulary", target: {text: "bus", language_code: "en", direction: "ltr"}, introduced_tokens: ["bus", "I", "take", "the"], example: {text: "I take the bus.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit33.lesson01.teach.train", kind: "vocabulary", target: {text: "train", language_code: "en", direction: "ltr"}, introduced_tokens: ["train"], example: {text: "She takes the train.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit33.lesson01.teach.car", kind: "vocabulary", target: {text: "car", language_code: "en", direction: "ltr"}, introduced_tokens: ["car", "drive", "my"], example: {text: "I drive my car to work.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit33.lesson01.teach.bike", kind: "vocabulary", target: {text: "bike", language_code: "en", direction: "ltr"}, introduced_tokens: ["bike", "ride"], example: {text: "I ride my bike to work every day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit33.lesson01.teach.walk", kind: "vocabulary", target: {text: "walk", language_code: "en", direction: "ltr"}, introduced_tokens: ["walk", "to", "work"], example: {text: "I walk to work.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit33.lesson01.exercise01.listen_mode", type: "listen_select", tested_text: "train", media_asset_key: "en.a1.audio.transportation.modes.train.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit33.lesson01.exercise02.choose_fastest", type: "multiple_choice", tested_text: "car", prompt: {target_blocks: [{text: "Which is usually the fastest way to travel a long distance in a city?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson01.exercise03.match_modes", type: "matching_pairs", tested_text: "bus train car bike walk", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "bus", right: "a large public vehicle with many seats"}, {left: "train", right: "travels on tracks"}, {left: "car", right: "you drive it yourself"}, {left: "bike", right: "you pedal it"}, {left: "walk", right: "go with no bus, train, car, or bike"}]}
          - {content_key: "en.a1.unit33.lesson01.exercise04.order_car_sentence", type: "word_order", tested_text: "I drive my car to work.", word_bank: ["I", "drive", "my", "car", "to", "work."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson01.exercise05.write_transport_word", type: "writing_prompt", tested_text: "bike", prompt: {target_blocks: [{text: "Write the word for a vehicle you pedal.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit33.lesson02.describing_commutes"
        title: "How you get there"
        spine_outcome_id: "universal.a1.transportation.getting_around_town"
        teaching:
          - {content_key: "en.a1.unit33.lesson02.teach.how_get_to", kind: "phrase", target: {text: "How do you get to work?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "do", "you", "get", "work?"]}
          - {content_key: "en.a1.unit33.lesson02.teach.usually", kind: "vocabulary", target: {text: "usually", language_code: "en", direction: "ltr"}, introduced_tokens: ["usually"], example: {text: "I usually take the bus.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit33.lesson02.teach.minutes", kind: "vocabulary", target: {text: "minutes", language_code: "en", direction: "ltr"}, introduced_tokens: ["minutes", "It", "takes", "twenty"], example: {text: "It takes twenty minutes.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit33.lesson02.teach.late", kind: "vocabulary", target: {text: "late", language_code: "en", direction: "ltr"}, introduced_tokens: ["late", "often", "is"], example: {text: "The bus is often late.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit33.lesson02.teach.faster", kind: "vocabulary", target: {text: "faster", language_code: "en", direction: "ltr"}, introduced_tokens: ["faster", "than"], example: {text: "The train is faster than the bus.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit33.lesson02.exercise01.listen_question", type: "listen_select", tested_text: "How do you get to work?", media_asset_key: "en.a1.audio.transportation.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit33.lesson02.exercise02.choose_late_meaning", type: "multiple_choice", tested_text: "late", prompt: {target_blocks: [{text: "Which word means arriving after the expected time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson02.exercise03.choose_faster_meaning", type: "multiple_choice", tested_text: "faster", prompt: {target_blocks: [{text: "Which word means \"takes less time\" when comparing two things?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson02.exercise04.order_takes_sentence", type: "word_order", tested_text: "It takes twenty minutes.", word_bank: ["It", "takes", "twenty", "minutes."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson02.exercise05.translate_usually_bus", type: "translation", tested_text: "I usually take the bus.", prompt: {target_blocks: [{text: "Translate: \"I usually take the bus.\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit33.lesson03.dialogue_commute_talk"
        title: "Dialogue: Talking about commutes"
        spine_outcome_id: "universal.a1.transportation.getting_around_town"
        teaching:
          - {content_key: "en.a1.unit33.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "How do you get to work, Daniel?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Daniel?"], media_asset_key: "en.a1.audio.dialogue.transportation.01"}
          - {content_key: "en.a1.unit33.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "I usually take the bus. It takes about twenty minutes.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["about"]}
          - {content_key: "en.a1.unit33.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "Do you like it?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Do", "like", "it?"]}
          - {content_key: "en.a1.unit33.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "It's okay, but it's often late. How about you?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["It's", "okay,", "but", "How", "about"]}
          - {content_key: "en.a1.unit33.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "I drive. It's faster, but parking is difficult.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["parking", "difficult."]}
        exercises:
          - {content_key: "en.a1.unit33.lesson03.exercise01.comprehension_daniel_mode", type: "multiple_choice", tested_text: "the bus", prompt: {target_blocks: [{text: "According to the dialogue, how does Daniel usually get to work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson03.exercise02.comprehension_leila_problem", type: "multiple_choice", tested_text: "parking is difficult", prompt: {target_blocks: [{text: "According to the dialogue, what problem does Leila mention about driving?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson03.exercise03.listen_dialogue_time", type: "listen_select", tested_text: "twenty minutes", media_asset_key: "en.a1.audio.dialogue.transportation.01", prompt: {target_blocks: [{text: "According to the dialogue, about how long does Daniel's bus ride take?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson03.exercise04.respond_own_commute", type: "speak_response", tested_text: "I take the bus", accepted_answers: ["I take the bus", "I take the bus.", "I take the train", "I take the train.", "I drive", "I drive.", "I ride my bike", "I ride my bike.", "I walk", "I walk."], prompt: {target_blocks: [{text: "Say how you usually get to work or school.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit33.lesson04.two_commuters"
        title: "Reading: Two different commutes"
        spine_outcome_id: "universal.a1.transportation.getting_around_town"
        teaching:
          - {content_key: "en.a1.unit33.lesson04.teach.reading_passage", kind: "reading", target: {text: "Leila drives to work every day. The drive takes about fifteen minutes, but parking near her office is difficult. Daniel doesn't have a car, so he takes the bus. His bus ride takes twenty minutes and is sometimes late, but he doesn't need to worry about parking.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Leila", "drives", "The", "fifteen", "but", "near", "her", "office.", "doesn't", "have", "so", "His", "ride", "sometimes", "worry", "about", "every"]}
        exercises:
          - {content_key: "en.a1.unit33.lesson04.exercise01.reading_leila_problem", type: "multiple_choice", tested_text: "parking near her office is difficult", prompt: {target_blocks: [{text: "According to the reading, what is difficult for Leila?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson04.exercise02.reading_daniel_mode", type: "multiple_choice", tested_text: "the bus", prompt: {target_blocks: [{text: "According to the reading, how does Daniel get to work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson04.exercise03.reading_who_faster", type: "multiple_choice", tested_text: "Leila", prompt: {target_blocks: [{text: "According to the reading, whose commute takes less time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit33.lesson04.exercise04.write_own_commute_sentence", type: "writing_prompt", tested_text: "take", prompt: {target_blocks: [{text: "Write one sentence about how you get to work or school.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I take the bus", "I take the bus.", "I take the train", "I take the train.", "I drive", "I drive.", "I ride my bike", "I ride my bike.", "I walk", "I walk."]}
