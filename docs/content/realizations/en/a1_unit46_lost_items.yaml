          - {content_key: "en.a1.unit46.lesson01.teach.found", kind: "vocabulary", target: {text: "found", language_code: "en", direction: "ltr"}, introduced_tokens: ["found", "your"], example: {text: "I found your keys!", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit46.lesson01.teach.keys", kind: "vocabulary", target: {text: "keys", language_code: "en", direction: "ltr"}, introduced_tokens: ["keys", "These", "are"], example: {text: "These are my keys.", language_code: "en", direction: "ltr"}}
