course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Keep the register practical and mildly urgent but not alarmed -- losing a personal item is a common everyday inconvenience, not an emergency (unit45's fixed emergency-service phrasing is a different, more urgent register and is not reused here). Core fixed collocations: I lost my ___., Have you seen my ___?, Has anyone found a ___?, It's [color] with a [detail]., Where's the lost and found?"

media_assets:
  - {content_key: "en.a1.audio.lost_items.words.keys.01", language: "en", text: "keys", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.lost_items.phrases.wheres_the_lost_and_found.01", language: "en", text: "Where's the lost and found?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.lost_items.01"
    language: "en"
    text: "Daniel: Mia, where's your backpack? You had it by the fountain. Mia: Oh no, you're right! I don't have it. My camera is inside! Daniel: Don't worry, let's call the park office and ask. Daniel: Hello, we lost a black backpack near the fountain. Has anyone found one? Mia: What did they say? Daniel: They found it! It's black with a yellow strap, right? They're holding it at the front desk. Mia: Yes, that's it! Let's go get it right now. Thank goodness."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

