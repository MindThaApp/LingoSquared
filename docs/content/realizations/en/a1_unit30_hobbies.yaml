    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit30.lesson01.free_time_activities"
        title: "Free-time activities"
        spine_outcome_id: "universal.a1.hobbies.describe_free_time_activities"
        teaching:
          - {content_key: "en.a1.unit30.lesson01.teach.reading", kind: "vocabulary", target: {text: "reading", language_code: "en", direction: "ltr"}, introduced_tokens: ["reading"], example: {text: "Reading is my favorite hobby.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson01.teach.cooking", kind: "vocabulary", target: {text: "cooking", language_code: "en", direction: "ltr"}, introduced_tokens: ["cooking"], example: {text: "My sister loves cooking.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson01.teach.painting", kind: "vocabulary", target: {text: "painting", language_code: "en", direction: "ltr"}, introduced_tokens: ["painting"], example: {text: "She spends the weekend painting.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson01.teach.running", kind: "vocabulary", target: {text: "running", language_code: "en", direction: "ltr"}, introduced_tokens: ["running", "He", "goes", "every", "morning"], example: {text: "He goes running every morning.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson01.teach.video_games", kind: "vocabulary", target: {text: "video games", language_code: "en", direction: "ltr"}, introduced_tokens: ["video", "games"], example: {text: "My brother plays video games after school.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit30.lesson01.exercise01.listen_hobby", type: "listen_select", tested_text: "painting", media_asset_key: "en.a1.audio.hobbies.activities.painting.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit30.lesson01.exercise02.choose_reading_meaning", type: "multiple_choice", tested_text: "reading", prompt: {target_blocks: [{text: "Which hobby means looking at a book and understanding the words?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson01.exercise03.match_hobbies", type: "matching_pairs", tested_text: "reading cooking painting", prompt: {target_blocks: [{text: "Match each hobby to its description.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "looking at a book and understanding the words", right: "reading"}, {left: "preparing food to eat", right: "cooking"}, {left: "making pictures with a brush", right: "painting"}]}
          - {content_key: "en.a1.unit30.lesson01.exercise04.order_running_sentence", type: "word_order", tested_text: "He goes running every morning.", word_bank: ["He", "goes", "running", "every", "morning"], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson01.exercise05.write_hobby", type: "writing_prompt", tested_text: "cooking", prompt: {target_blocks: [{text: "Write the hobby that means preparing food to eat.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit30.lesson02.how_often"
        title: "How often? Frequency adverbs"
        spine_outcome_id: "universal.a1.hobbies.describe_free_time_activities"
        teaching:
          - {content_key: "en.a1.unit30.lesson02.teach.always", kind: "vocabulary", target: {text: "always", language_code: "en", direction: "ltr"}, introduced_tokens: ["always"], example: {text: "I always go running on Saturdays.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson02.teach.often", kind: "vocabulary", target: {text: "often", language_code: "en", direction: "ltr"}, introduced_tokens: ["often", "She", "cooks", "dinner", "for", "her", "family"], example: {text: "She often cooks dinner for her family.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson02.teach.sometimes", kind: "vocabulary", target: {text: "sometimes", language_code: "en", direction: "ltr"}, introduced_tokens: ["sometimes"], example: {text: "We sometimes play video games together.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson02.teach.rarely", kind: "vocabulary", target: {text: "rarely", language_code: "en", direction: "ltr"}, introduced_tokens: ["rarely"], example: {text: "He rarely goes painting in winter.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson02.teach.never", kind: "vocabulary", target: {text: "never", language_code: "en", direction: "ltr"}, introduced_tokens: ["never"], example: {text: "I never watch video games late at night.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit30.lesson02.teach.free_time_question", kind: "phrase", target: {text: "What do you do in your free time?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "do", "you", "in", "your", "free", "time"]}
        exercises:
          - {content_key: "en.a1.unit30.lesson02.exercise01.listen_frequency", type: "listen_select", tested_text: "often", media_asset_key: "en.a1.audio.hobbies.frequency.often.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit30.lesson02.exercise02.choose_never_meaning", type: "multiple_choice", tested_text: "never", prompt: {target_blocks: [{text: "Which word means zero times, not ever?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson02.exercise03.choose_most_frequent", type: "multiple_choice", tested_text: "always", prompt: {target_blocks: [{text: "Which word means every single time, 100% of the time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson02.exercise04.order_frequency_sentence", type: "word_order", tested_text: "She often cooks dinner for her family.", word_bank: ["She", "often", "cooks", "dinner", "for", "her", "family"], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson02.exercise05.translate_free_time_question", type: "translation", tested_text: "What do you do in your free time?", prompt: {target_blocks: [{text: "Translate: \"What do you do in your free time?\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit30.lesson03.dialogue_free_time"
        title: "Dialogue: Free time"
        spine_outcome_id: "universal.a1.hobbies.describe_free_time_activities"
        teaching:
          - {content_key: "en.a1.unit30.lesson03.teach.i_like_pattern", kind: "phrase", target: {text: "I like reading.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "like"]}
          - {content_key: "en.a1.unit30.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "What do you do in your free time, Daniel?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Daniel"], media_asset_key: "en.a1.audio.dialogue.hobbies.01"}
          - {content_key: "en.a1.unit30.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "I often go running. And I sometimes cook. What about you?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["And", "about"]}
          - {content_key: "en.a1.unit30.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "I love painting. I paint almost every weekend.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["love", "paint", "almost", "weekend"]}
          - {content_key: "en.a1.unit30.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "That's great! Do you ever play video games?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That's", "great", "Do", "ever", "play"]}
          - {content_key: "en.a1.unit30.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Rarely. I prefer reading a book.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["prefer", "a", "book"]}
        exercises:
          - {content_key: "en.a1.unit30.lesson03.exercise01.comprehension_daniel_hobby", type: "multiple_choice", tested_text: "running", prompt: {target_blocks: [{text: "According to the dialogue, what does Daniel often do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson03.exercise02.comprehension_leila_frequency", type: "multiple_choice", tested_text: "Rarely", prompt: {target_blocks: [{text: "How often does Leila play video games?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson03.exercise03.listen_dialogue_leila_hobby", type: "listen_select", tested_text: "painting", media_asset_key: "en.a1.audio.dialogue.hobbies.01", prompt: {target_blocks: [{text: "What does Leila love doing?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson03.exercise04.respond_to_question", type: "speak_response", tested_text: "I like reading", accepted_answers: ["I like reading", "I like reading.", "I like cooking", "I like cooking.", "I like painting", "I like painting.", "I like running", "I like running.", "I like video games", "I like video games."], prompt: {target_blocks: [{text: "Answer: What do you do in your free time?", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit30.lesson04.comparing_hobbies"
        title: "Comparing hobbies"
        spine_outcome_id: "universal.a1.hobbies.describe_free_time_activities"
        teaching:
          - {content_key: "en.a1.unit30.lesson04.teach.reading_passage", kind: "reading", target: {text: "Daniel and Leila have different hobbies. Daniel always goes running on Saturday mornings, and he sometimes cooks dinner for his friends. Leila never goes running, but she often paints on the weekend. They both like video games, but they only play together sometimes.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "and", "Leila", "have", "different", "hobbies", "always", "goes", "running", "on", "Saturday", "mornings", "he", "sometimes", "cooks", "dinner", "for", "his", "friends", "never", "but", "she", "often", "paints", "the", "weekend", "They", "both", "like", "video", "games", "only", "play", "together"]}
        exercises:
          - {content_key: "en.a1.unit30.lesson04.exercise01.reading_who_runs", type: "multiple_choice", tested_text: "Daniel", prompt: {target_blocks: [{text: "According to the reading, who goes running?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson04.exercise02.reading_leila_frequency", type: "multiple_choice", tested_text: "never", prompt: {target_blocks: [{text: "How often does Leila go running?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson04.exercise03.reading_shared_hobby", type: "multiple_choice", tested_text: "video games", prompt: {target_blocks: [{text: "Which hobby do both Daniel and Leila enjoy?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit30.lesson04.exercise04.write_own_hobby", type: "writing_prompt", tested_text: "I like", prompt: {target_blocks: [{text: "Write one sentence about a hobby you enjoy, using \"I like\" or \"I love\".", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I like reading", "I like reading.", "I like cooking", "I like cooking.", "I like painting", "I like painting.", "I like running", "I like running.", "I like video games", "I like video games.", "I love reading", "I love reading.", "I love cooking", "I love cooking.", "I love painting", "I love painting.", "I love running", "I love running.", "I love video games", "I love video games."]}
