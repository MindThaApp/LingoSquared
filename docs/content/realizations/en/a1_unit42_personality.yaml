          - {content_key: "en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor", kind: "phrase", target: {text: "have a great sense of humor", language_code: "en", direction: "ltr"}, introduced_tokens: ["have", "a", "great", "sense", "of", "humor", "Daniel", "has"], example: {text: "Daniel has a great sense of humor.", language_code: "en", direction: "ltr"}}
