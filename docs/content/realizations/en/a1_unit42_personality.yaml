          - {content_key: "en.a1.unit42.lesson02.teach.warm_up_quickly", kind: "phrase", target: {text: "warm up quickly", language_code: "en", direction: "ltr"}, introduced_tokens: ["warm", "up", "quickly", "He's", "shy", "but", "he", "warms", "once", "knows", "you"], example: {text: "He's shy, but he warms up quickly once he knows you.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit42.lesson02.teach.whats_he_like_question", kind: "phrase", target: {text: "What's he like?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What's", "he", "like"]}
        exercises:
