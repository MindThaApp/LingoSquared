        title: "Dialogue: What is Daniel like?"
        spine_outcome_id: "universal.a1.personality.describe_basic_personality_traits"
        teaching:
          - {content_key: "en.a1.unit42.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "I'm starting a new project with Daniel next week. What's he like?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["I'm", "starting", "a", "new", "project", "with", "Daniel", "next", "week", "What's", "he", "like"], media_asset_key: "en.a1.audio.dialogue.personality.01"}
          - {content_key: "en.a1.unit42.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "He's very friendly, and he's really funny too.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["He's", "very", "friendly", "and", "really", "funny", "too"]}
          - {content_key: "en.a1.unit42.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "That's good to hear! Is he easy to work with?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["That's", "good", "to", "hear", "Is", "he", "easy", "work", "with"]}
          - {content_key: "en.a1.unit42.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Yes, he's also very hardworking. He always finishes his tasks on time.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "he's", "also", "very", "hardworking", "He", "always", "finishes", "his", "tasks", "on", "time"]}
