          - {content_key: "en.a1.unit42.lesson04.exercise04.write_own_personality_sentence", type: "writing_prompt", tested_text: "friendly", prompt: {target_blocks: [{text: "Write one sentence about your own personality, using \"I'm...\" or \"I am...\".", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I'm friendly", "I'm friendly.", "I am friendly", "I am friendly.", "I'm funny", "I'm funny.", "I'm hardworking", "I'm hardworking.", "I'm a little shy", "I'm a little shy.", "I'm calm", "I'm calm.", "I'm talkative", "I'm talkative."]}
