        teaching:
          - {content_key: "en.a1.unit42.lesson02.teach.a_little_shy", kind: "phrase", target: {text: "a little shy", language_code: "en", direction: "ltr"}, introduced_tokens: ["a", "little", "shy", "He's", "at", "first", "but", "he", "warms", "up", "quickly"], example: {text: "He's a little shy at first, but he warms up quickly.", language_code: "en", direction: "ltr"}}
