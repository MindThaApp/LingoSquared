          - {content_key: "en.a1.unit42.lesson01.exercise03.match_personality_words", type: "matching_pairs", tested_text: "friendly funny hardworking shy calm talkative", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "friendly", right: "kind and easy to talk to"}, {left: "funny", right: "makes people laugh"}, {left: "hardworking", right: "works hard and doesn't give up easily"}, {left: "shy", right: "nervous or quiet around new people"}, {left: "calm", right: "quiet in a noisy place"}, {left: "talkative", right: "talks a lot"}]}
          - {content_key: "en.a1.unit42.lesson01.exercise04.order_hardworking_sentence", type: "word_order", tested_text: "She is a hardworking employee.", word_bank: ["She", "is", "a", "hardworking", "employee."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit42.lesson01.exercise05.write_calm_word", type: "writing_prompt", tested_text: "calm", prompt: {target_blocks: [{text: "Write the word for someone who doesn't get upset or nervous easily.", language_code: "en", direction: "ltr"}]}}

