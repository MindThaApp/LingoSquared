    title: "Describing personality"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.personality.describe_basic_personality_traits"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit42.lesson01.personality_vocabulary"
        title: "Words for personality"
        spine_outcome_id: "universal.a1.personality.describe_basic_personality_traits"
        teaching:
          - {content_key: "en.a1.unit42.lesson01.teach.friendly", kind: "vocabulary", target: {text: "friendly", language_code: "en", direction: "ltr"}, introduced_tokens: ["friendly", "My", "neighbor", "is", "very"], example: {text: "My neighbor is very friendly.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit42.lesson01.teach.funny", kind: "vocabulary", target: {text: "funny", language_code: "en", direction: "ltr"}, introduced_tokens: ["funny", "My", "brother", "is", "really"], example: {text: "My brother is really funny.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit42.lesson01.teach.hardworking", kind: "vocabulary", target: {text: "hardworking", language_code: "en", direction: "ltr"}, introduced_tokens: ["hardworking", "She", "is", "a", "employee"], example: {text: "She is a hardworking employee.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit42.lesson01.teach.shy", kind: "vocabulary", target: {text: "shy", language_code: "en", direction: "ltr"}, introduced_tokens: ["shy", "He's", "a", "little", "at", "first"], example: {text: "He's a little shy at first.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit42.lesson01.teach.calm", kind: "vocabulary", target: {text: "calm", language_code: "en", direction: "ltr"}, introduced_tokens: ["calm", "My", "mother", "is", "very"], example: {text: "My mother is very calm.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit42.lesson01.teach.talkative", kind: "vocabulary", target: {text: "talkative", language_code: "en", direction: "ltr"}, introduced_tokens: ["talkative", "My", "sister", "is", "very"], example: {text: "My sister is very talkative.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit42.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "hardworking", media_asset_key: "en.a1.audio.personality.words.hardworking.01", prompt: {target_blocks: []}}
