          - {content_key: "en.a1.unit42.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "A little, but he gets more comfortable once he knows you.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["A", "little", "but", "he", "gets", "more", "comfortable", "once", "knows", "you"]}
          - {content_key: "en.a1.unit42.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Thanks, Leila. Now I feel more relaxed about the project.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Thanks", "Leila", "Now", "I", "feel", "more", "relaxed", "about", "the", "project"]}
