      - content_key: "en.a1.unit42.lesson04.three_friends_three_personalities"
        title: "Reading: Three friends, three personalities"
        spine_outcome_id: "universal.a1.personality.describe_basic_personality_traits"
        teaching:
          - {content_key: "en.a1.unit42.lesson04.teach.reading_passage", kind: "reading", target: {text: "Daniel, Leila, and Mia are close friends, but they have very different personalities. Daniel is friendly and funny -- he always makes his friends laugh. He's a little shy when he meets new people, but he warms up quickly. Leila is calm and creative. She loves painting because it helps her relax, and she rarely gets upset about anything. Mia is outgoing and organized. She likes making plans for the group, and she's very patient when she teaches her friends something new -- she taught Daniel how to cook. Even though they are all different, they get along with everyone and enjoy spending time together.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "Leila", "and", "Mia", "are", "close", "friends", "but", "they", "have", "very", "different", "personalities", "is", "friendly", "funny", "he", "always", "makes", "his", "laugh", "He's", "a", "little", "shy", "when", "meets", "new", "people", "warms", "up", "quickly", "calm", "creative", "She", "loves", "painting", "because", "it", "helps", "her", "relax", "rarely", "gets", "upset", "about", "anything", "outgoing", "organized", "likes", "making", "plans", "for", "the", "group", "very", "patient", "teaches", "friends", "something", "taught", "how", "to", "cook", "Even", "though", "all", "get", "along", "with", "everyone", "enjoy", "spending", "time", "together"]}
