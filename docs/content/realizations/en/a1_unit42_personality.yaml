course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Personality language stays in simple present tense with fixed adjective-plus-modifier collocations that must be memorized: a little shy, very hardworking, have a great sense of humor, get along with everyone, warm up quickly. Keep the register casual and warm, appropriate for describing a friend or coworker to another friend, not a clinical or psychological register."

media_assets:
  - {content_key: "en.a1.audio.personality.words.hardworking.01", language: "en", text: "hardworking", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.personality.phrases.get_along_with_everyone.01", language: "en", text: "get along with everyone", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.personality.01"
    language: "en"
    text: "Mia: I'm starting a new project with Daniel next week. What's he like? Leila: He's very friendly, and he's really funny too. Mia: That's good to hear! Is he easy to work with? Leila: Yes, he's also very hardworking. He always finishes his tasks on time. Mia: Is he ever shy in meetings? Leila: A little, but he gets more comfortable once he knows you. Mia: Thanks, Leila. Now I feel more relaxed about the project."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

