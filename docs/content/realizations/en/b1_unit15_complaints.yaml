  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: making a polite written and spoken complaint about a damaged or faulty product -- naming the problem, saying what already happened, and requesting a specific resolution (refund or replacement) -- in a courteous but firm customer-service register."

media_assets:
  - {content_key: "en.b1.audio.complaints.phrase.damaged.01", language: "en", text: "damaged", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.complaints.sentence.01", language: "en", text: "I'm writing to complain about a damaged product.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.complaints.01"
    language: "en"
    text: "Mia: Hello, I'm calling to complain about a desk chair I ordered. Agent: I'm sorry to hear that. What's the issue with it? Mia: It arrived with a broken wheel, so I can't use it. Agent: I understand. Would you like a refund or a replacement? Mia: I would prefer a replacement, if that's possible. Agent: Of course. We'll resolve this and send a new chair by Friday."
    voice_hint: "two_adults_neutral_customer_service"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit15.complaints"
    title: "I'm writing to complain about..."
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.services.make_complaint_and_resolve_problem"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit15.lesson01.complaints_vocabulary"
        title: "Words for making a complaint"
        spine_outcome_id: "universal.b1.services.make_complaint_and_resolve_problem"
        teaching:
          - {content_key: "en.b1.unit15.lesson01.teach.complain", kind: "vocabulary", target: {text: "complain", language_code: "en", direction: "ltr"}, introduced_tokens: ["complain"], example: {text: "Mia decided to complain about the damaged chair.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit15.lesson01.teach.damaged", kind: "vocabulary", target: {text: "damaged", language_code: "en", direction: "ltr"}, introduced_tokens: ["damaged"], example: {text: "The chair arrived damaged.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit15.lesson01.teach.refund", kind: "vocabulary", target: {text: "refund", language_code: "en", direction: "ltr"}, introduced_tokens: ["refund"], example: {text: "Mia asked for a refund.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit15.lesson01.teach.replacement", kind: "vocabulary", target: {text: "replacement", language_code: "en", direction: "ltr"}, introduced_tokens: ["replacement"], example: {text: "The company offered a replacement instead.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit15.lesson01.teach.resolve", kind: "vocabulary", target: {text: "resolve", language_code: "en", direction: "ltr"}, introduced_tokens: ["resolve"], example: {text: "The agent promised to resolve the issue quickly.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit15.lesson01.teach.issue", kind: "vocabulary", target: {text: "issue", language_code: "en", direction: "ltr"}, introduced_tokens: ["issue"], example: {text: "Mia explained the issue clearly.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit15.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "damaged", media_asset_key: "en.b1.audio.complaints.phrase.damaged.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit15.lesson01.exercise02.choose_complain", type: "multiple_choice", tested_text: "complain", prompt: {target_blocks: [{text: "Which word means to say formally that something is wrong or unsatisfactory?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson01.exercise03.choose_issue", type: "multiple_choice", tested_text: "issue", prompt: {target_blocks: [{text: "Which word means a problem that needs to be dealt with?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson01.exercise04.match_complaint_words", type: "matching_pairs", tested_text: "complain damaged replacement resolve issue", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "to say formally that something is wrong or unsatisfactory", right: "complain"}, {left: "reason for a replacement", right: "damaged"}, {left: "a new item given in place of a faulty one", right: "replacement"}, {left: "to fix or settle a problem completely", right: "resolve"}, {left: "a problem that needs to be dealt with", right: "issue"}]}
          - {content_key: "en.b1.unit15.lesson01.exercise05.write_issue", type: "writing_prompt", tested_text: "issue", prompt: {target_blocks: [{text: "Write the word that means a problem that needs to be dealt with.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit15.lesson02.complaint_sentences"
        title: "I'm writing to complain about a damaged product"
        spine_outcome_id: "universal.b1.services.make_complaint_and_resolve_problem"
        teaching:
          - {content_key: "en.b1.unit15.lesson02.teach.writing_to_complain", kind: "phrase", target: {text: "I'm writing to complain about a damaged product.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "writing", "to", "about", "a", "product"], media_asset_key: "en.b1.audio.complaints.sentence.01"}
          - {content_key: "en.b1.unit15.lesson02.teach.would_like_refund", kind: "phrase", target: {text: "I would like a refund for this item.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "would", "like", "for", "this", "item"]}
          - {content_key: "en.b1.unit15.lesson02.teach.grammar_complaint_structure", kind: "grammar_note", target: {text: "A polite written complaint usually has three parts: name the problem (I'm writing to complain about...), say what already happened (it arrived damaged / it stopped working), and ask for a specific resolution (I would like a refund / I would like a replacement).", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "polite", "written", "complaint", "usually", "has", "three", "parts", "name", "the", "problem", "say", "what", "already", "happened", "it", "arrived", "stopped", "working", "ask", "specific", "resolution"]}
        exercises:
          - {content_key: "en.b1.unit15.lesson02.exercise01.choose_writing_to_complain", type: "multiple_choice", tested_text: "I'm writing to complain about a damaged product.", prompt: {target_blocks: [{text: "Which sentence politely opens a written complaint about a damaged product?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson02.exercise02.choose_would_like_refund", type: "multiple_choice", tested_text: "I would like a refund for this item.", prompt: {target_blocks: [{text: "Which sentence politely asks for money back for an item?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson02.exercise03.order_writing_to_complain", type: "word_order", tested_text: "I'm writing to complain about a damaged product", prompt: {target_blocks: []}, word_bank: ["writing", "to", "complain", "about", "a", "damaged", "product", "I'm"]}
          - {content_key: "en.b1.unit15.lesson02.exercise04.reply_complain_desk_chair", type: "dialogue_response", tested_text: "I'm writing to complain about a damaged product", prompt: {target_blocks: [{text: "Politely open a written complaint about a damaged product, starting with 'I'm writing to complain about'.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson02.exercise05.write_would_like_refund", type: "writing_prompt", tested_text: "I would like a refund for this item.", prompt: {target_blocks: [{text: "Write a polite request asking for a refund for this item, starting with 'I would like a refund for'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit15.lesson03.reading_a_complaint_email"
        title: "Reading: a complaint about a desk chair"
        spine_outcome_id: "universal.b1.services.make_complaint_and_resolve_problem"
        teaching:
          - {content_key: "en.b1.unit15.lesson03.teach.desk_chair", kind: "vocabulary", target: {text: "desk chair", language_code: "en", direction: "ltr"}, introduced_tokens: ["desk", "chair"], example: {text: "Mia ordered a new desk chair for her home office.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit15.lesson03.teach.as_soon_as_possible", kind: "phrase", target: {text: "as soon as possible", language_code: "en", direction: "ltr"}, introduced_tokens: ["as", "soon", "as", "possible"], example: {text: "Mia asked for a replacement as soon as possible.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit15.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Dear GreenDesk team, I'm writing to complain about a damaged product. I ordered a desk chair for my home office last week, but it arrived with a broken wheel. I would like a replacement as soon as possible. Please let me know how to proceed. Thank you, Mia", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Dear", "team", "ordered", "last", "week", "but", "it", "arrived", "with", "broken", "wheel", "Please", "let", "know", "how", "proceed", "Thank"]
        exercises:
          - {content_key: "en.b1.unit15.lesson03.exercise01.comprehend_broken_wheel", type: "reading_comprehension", tested_text: "it arrived with a broken wheel", prompt: {target_blocks: [{text: "What is wrong with the desk chair Mia ordered?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson03.exercise02.comprehend_wants_replacement", type: "reading_comprehension", tested_text: "a replacement as soon as possible", prompt: {target_blocks: [{text: "What resolution does Mia ask for, and how soon?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson03.exercise03.recognize_desk_chair", type: "multiple_choice", tested_text: "desk chair", prompt: {target_blocks: [{text: "Which phrase names the piece of furniture Mia ordered?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson03.exercise04.order_replacement_soon", type: "word_order", tested_text: "I would like a replacement as soon as possible", prompt: {target_blocks: []}, word_bank: ["would", "like", "a", "replacement", "as", "soon", "as", "possible", "I"]}
          - {content_key: "en.b1.unit15.lesson03.exercise05.write_ordered_desk_chair", type: "writing_prompt", tested_text: "I ordered a desk chair for my home office.", prompt: {target_blocks: [{text: "Write a sentence saying you ordered a desk chair for your home office, starting with 'I ordered'.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit15.lesson04.the_complaint_call_dialogue"
        title: "Would you like a refund or a replacement?"
        spine_outcome_id: "universal.b1.services.make_complaint_and_resolve_problem"
        teaching:
          - {content_key: "en.b1.unit15.lesson04.teach.q_calling_to_complain", kind: "dialogue", target: {text: "Hello, I'm calling to complain about a desk chair I ordered.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Hello", "calling", "chair", "ordered"], media_asset_key: "en.b1.audio.dialogue.complaints.01"}
          - {content_key: "en.b1.unit15.lesson04.teach.a_whats_the_issue", kind: "dialogue", target: {text: "I'm sorry to hear that. What's the issue with it?", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["sorry", "hear", "that", "What's", "with", "it"]}
          - {content_key: "en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use", kind: "dialogue", target: {text: "It arrived with a broken wheel, so I can't use it.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["so", "can't", "use"]}
          - {content_key: "en.b1.unit15.lesson04.teach.a_refund_or_replacement", kind: "dialogue", target: {text: "I understand. Would you like a refund or a replacement?", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["understand", "Would", "you", "or"]}
          - {content_key: "en.b1.unit15.lesson04.teach.q_prefer_replacement", kind: "dialogue", target: {text: "I would prefer a replacement, if that's possible.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["prefer", "if", "that's"]}
          - {content_key: "en.b1.unit15.lesson04.teach.a_resolve_send_friday", kind: "dialogue", target: {text: "Of course. We'll resolve this and send a new chair by Friday.", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["Of", "course", "We'll", "this", "and", "send", "new", "by", "Friday"]}
        exercises:
          - {content_key: "en.b1.unit15.lesson04.exercise01.listen_calling_to_complain", type: "dialogue_comprehension", tested_text: "calling to complain about a desk chair I ordered", media_asset_key: "en.b1.audio.dialogue.complaints.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit15.lesson04.exercise02.listen_broken_wheel", type: "listen_select", tested_text: "It arrived with a broken wheel", media_asset_key: "en.b1.audio.dialogue.complaints.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit15.lesson04.exercise03.choose_agent_offer", type: "multiple_choice", tested_text: "Would you like a refund or a replacement?", prompt: {target_blocks: [{text: "What does the agent offer Mia?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit15.lesson04.exercise04.order_prefer_replacement", type: "word_order", tested_text: "I would prefer a replacement if that's possible", prompt: {target_blocks: []}, word_bank: ["would", "prefer", "a", "replacement", "if", "that's", "possible", "I"]}
          - content_key: "en.b1.unit15.lesson04.exercise05.reply_as_mia"
            type: "dialogue_response"
            tested_text: "I would prefer a replacement if that's possible"
            prompt: {target_blocks: [{text: "I understand. Would you like a refund or a replacement?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit15.lesson04.exercise06.speak_complaint_dialogue"
            type: "speak_response"
            tested_text: "It arrived with a broken wheel, so I can't use it."
            prompt: {target_blocks: [{text: "I'm sorry to hear that. What's the issue with it?", language_code: "en", direction: "ltr"}]}
