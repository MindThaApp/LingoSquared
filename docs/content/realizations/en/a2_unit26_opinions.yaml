schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "adapted_from_public_domain_source"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Opinion-and-reason sentence patterns (stating a view, supporting it
    with a reason, agreeing/disagreeing, presenting a contrasting
    point) are a standard drill type in the FSI Basic Course material
    (Foreign Service Institute, US Department of State -- public
    domain, no attribution required per docs/content/AUTHORING_GUIDE.md
    §10), scaffolding the connector vocabulary (because, on the other
    hand) used here. The source drills these connectors around
    generic, dated topics with no continuous scenario; the actual
    discussion topic here (a new dog park in the neighborhood), the
    Leila/Daniel dialogue, and every example sentence are freshly
    authored, not copied or lightly edited from the source.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Second A2 unit for the shared English realization (spine outcome:
    universal.a2.opinions.give_opinions_with_reasons), continuing the
    Leila/Daniel storyline with a natural, opinion-inviting topic (a
    new dog park in their neighborhood) -- mirroring the Dutch lane's
    a2_unit25_meningen.yaml (bike path topic) in structure and
    A2-complexity target, not in content: independently authored
    scenario, characters, and example sentences. A2-level complexity:
    subordinate because-clauses, the discourse connector "on the other
    hand," and agree/disagree formulas. The specific opinion positions
    (Daniel: good idea, dogs need space to run; Leila: too close to the
    playground) are stated consistently between lesson03's reading
    text and lesson04's dialogue per AUTHORING_GUIDE §11. Every
    multi-clause accepted_answers list authored with period/comma/
    conjunction-joined forms per §12. Every fill_in_blank frame retains
    visible surrounding text per §13.

    2026-07-07 §19 retrofit (part of the German content lane's
    project-wide vocabulary-example rollout): added `example:` to the
    unit's one kind:vocabulary card ("because" -> "I like the dog park
    because it's close to my house.", reusing this unit's own topic).
    This file is shared by fa-en/nl-en/prs-en; nl-en's overlay was
    given matching example_gloss this pass (fa-en/prs-en still need a
    follow-up). schema_version bumped to 1.1.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every exercise against the position-matched
    nl-en/fa-en/prs-en overlays for accepted-answer completeness,
    distractor validity, prompt/answer coherence, dialogue speaker
    attribution against the audio, listen distractors against the full
    audio, boolean coercion, and Leila/Daniel character canon against
    units 22/25/28. Fixed:
    en.a2.unit26.lesson04.exercise05.reply_as_leila and
    exercise06.speak_opinion_dialogue -- the prompt ran Daniel's two
    turns together, so 'Maybe they should move it a little farther away'
    came before Leila had raised the playground concern; the prompt is
    now a speaker-labelled transcript (Daniel turn / Leila gap / Daniel
    'That's a fair point. Maybe they should move it a little farther
    away.' / Leila gap), so the expected answer fills Leila's two turns
    in order (answers and instructions unchanged in every overlay).
    Overlay-side (English accepted answers, all of nl-en/fa-en/prs-en):
    lesson02.exercise05.write_opinion_with_reason -- added 'I think it
    is a good idea...' variants; lesson03.exercise05.write_own_opinion
    -- added 'In my opinion the dog park...' (no comma) and '...the new
    dog park...' variants; nl-en instruction re-pinned to 'naar jouw
    mening' (fa/prs instructions already say 'in your opinion'). NATIVE
    FLAG: the realization's matching_pairs rights for 'I think' ('a way
    to say what you believe') and 'in my opinion' ('another way to
    introduce your own view') are interchangeable; every overlay
    overrides the right-hand side, so learners do not see them. DEFERRED
    (owner decision): the lesson04 dialogue_response/speak_response
    items still expect the learner's whole multi-turn part as one answer
    (the shared units 26-29 pattern); splitting them into single-turn
    items like unit25/unit35 would change tested_text and the
    accepted_answers and instructions in all overlay sets, including the
    Persian/Dari instructions.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Leila and Daniel remain friends speaking informally throughout this unit, unlike unit25's formal DMV register -- an opinion exchange between friends stays casual."

media_assets:
  - {content_key: "en.a2.audio.opinions.words.on_the_other_hand.01", language: "en", text: "on the other hand", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.opinions.question.01", language: "en", text: "What do you think about the new dog park?", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.opinions.description.01", language: "en", text: "In my opinion, the new dog park is a good idea because dogs need space to run. On the other hand, it's very close to the playground.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.dog_park_opinion.01"
    language: "en"
    text: "Leila: What do you think about the new dog park? Daniel: I think it's a good idea because dogs need space to run. What about you? Leila: I agree that dogs need space, but on the other hand, it's very close to the playground. Daniel: That's a fair point. Maybe they should move it a little farther away. Leila: Yes, I think that would be better."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit26.opinions"
    title: "Giving opinions with reasons"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.opinions.give_opinions_with_reasons"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit26.lesson01.opinion_phrases"
        title: "Saying what you think"
        spine_outcome_id: "universal.a2.opinions.give_opinions_with_reasons"
        teaching:
          - {content_key: "en.a2.unit26.lesson01.teach.i_think", kind: "phrase", target: {text: "I think", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "think"]}
          - {content_key: "en.a2.unit26.lesson01.teach.in_my_opinion", kind: "phrase", target: {text: "in my opinion", language_code: "en", direction: "ltr"}, introduced_tokens: ["in", "my", "opinion"]}
          - {content_key: "en.a2.unit26.lesson01.teach.because", kind: "vocabulary", target: {text: "because", language_code: "en", direction: "ltr"}, introduced_tokens: ["because"], example: {text: "I like the dog park because it's close to my house.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit26.lesson01.teach.on_the_other_hand", kind: "phrase", target: {text: "on the other hand", language_code: "en", direction: "ltr"}, introduced_tokens: ["on", "the", "other", "hand"]}
          - {content_key: "en.a2.unit26.lesson01.teach.i_agree", kind: "phrase", target: {text: "I agree", language_code: "en", direction: "ltr"}, introduced_tokens: ["agree"]}
        exercises:
          - {content_key: "en.a2.unit26.lesson01.exercise01.listen_phrase", type: "listen_select", tested_text: "on the other hand", media_asset_key: "en.a2.audio.opinions.words.on_the_other_hand.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit26.lesson01.exercise02.choose_agreement_phrase", type: "multiple_choice", tested_text: "I agree", prompt: {target_blocks: [{text: "Which phrase means you have the same opinion as someone else?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson01.exercise03.choose_contrast_connector", type: "multiple_choice", tested_text: "on the other hand", prompt: {target_blocks: [{text: "Which phrase introduces a contrasting point?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson01.exercise04.match_opinion_phrases", type: "matching_pairs", tested_text: "I think in my opinion because on the other hand", prompt: {target_blocks: [{text: "Match each meaning to the correct English phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "I think", right: "a way to say what you believe"}, {left: "in my opinion", right: "another way to introduce your own view"}, {left: "because", right: "used to give a reason"}, {left: "on the other hand", right: "used to introduce a contrasting point"}, {left: "I agree", right: "a way to say you have the same opinion as someone else"}]}
          - {content_key: "en.a2.unit26.lesson01.exercise05.write_because", type: "writing_prompt", tested_text: "because", prompt: {target_blocks: [{text: "Write the word for giving a reason.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit26.lesson02.giving_an_opinion_with_a_reason"
        title: "Giving an opinion with a reason"
        spine_outcome_id: "universal.a2.opinions.give_opinions_with_reasons"
        teaching:
          - {content_key: "en.a2.unit26.lesson02.teach.what_do_you_think_about", kind: "phrase", target: {text: "What do you think about the new dog park?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "do", "you", "about", "the", "new", "dog", "park"]}
          - {content_key: "en.a2.unit26.lesson02.teach.good_idea_because", kind: "phrase", target: {text: "I think it's a good idea because dogs need space to run.", language_code: "en", direction: "ltr"}, introduced_tokens: ["it's", "a", "good", "idea", "dogs", "need", "space", "to", "run"]}
        exercises:
          - {content_key: "en.a2.unit26.lesson02.exercise01.listen_question", type: "listen_select", tested_text: "What do you think about the new dog park", media_asset_key: "en.a2.audio.opinions.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit26.lesson02.exercise02.choose_opinion_with_reason", type: "multiple_choice", tested_text: "I think it's a good idea because dogs need space to run.", prompt: {target_blocks: [{text: "Someone asks what you think about the new dog park, and you support it. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson02.exercise03.order_good_idea_because", type: "word_order", tested_text: "it's a good idea because dogs need space to run", prompt: {target_blocks: []}, word_bank: ["a", "good", "idea", "because", "dogs", "need", "space", "to", "run", "it's"]}
          - {content_key: "en.a2.unit26.lesson02.exercise04.reply_what_do_you_think", type: "dialogue_response", tested_text: "I think it's a good idea because dogs need space to run", prompt: {target_blocks: [{text: "What do you think about the new dog park?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson02.exercise05.write_opinion_with_reason", type: "writing_prompt", tested_text: "I think it's a good idea because dogs need space to run.", prompt: {target_blocks: []}}

      - content_key: "en.a2.unit26.lesson03.reading_a_written_opinion"
        title: "Reading a written opinion"
        spine_outcome_id: "universal.a2.opinions.give_opinions_with_reasons"
        teaching:
          - {content_key: "en.a2.unit26.lesson03.teach.very_close_to", kind: "phrase", target: {text: "very close to the playground", language_code: "en", direction: "ltr"}, introduced_tokens: ["very", "close", "playground"]}
          - {content_key: "en.a2.unit26.lesson03.teach.opinion_text", kind: "reading", target: {text: "In my opinion, the new dog park is a good idea because dogs need space to run. On the other hand, it's very close to the playground.", language_code: "en", direction: "ltr"}, introduced_tokens: ["In", "opinion", "dog", "park", "is", "On", "other", "hand"]}
        exercises:
          - {content_key: "en.a2.unit26.lesson03.exercise01.read_stated_opinion", type: "reading_comprehension", tested_text: "the dog park is a good idea", prompt: {target_blocks: [{text: "What is the writer's opinion about the dog park?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson03.exercise02.read_given_reason", type: "reading_comprehension", tested_text: "dogs need space to run", prompt: {target_blocks: [{text: "What reason does the writer give?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson03.exercise03.choose_contrasting_point", type: "multiple_choice", tested_text: "it's very close to the playground", prompt: {target_blocks: [{text: "What contrasting point does the writer mention?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson03.exercise04.order_very_close_to_playground", type: "word_order", tested_text: "it's very close to the playground", prompt: {target_blocks: []}, word_bank: ["very", "close", "to", "the", "playground", "it's"]}
          - {content_key: "en.a2.unit26.lesson03.exercise05.write_own_opinion", type: "writing_prompt", tested_text: "In my opinion, the dog park is a good idea.", prompt: {target_blocks: []}}

      - content_key: "en.a2.unit26.lesson04.opinion_dialogue"
        title: "Discussing an opinion"
        spine_outcome_id: "universal.a2.opinions.give_opinions_with_reasons"
        teaching:
          - {content_key: "en.a2.unit26.lesson04.teach.fair_point", kind: "phrase", target: {text: "That's a fair point.", language_code: "en", direction: "ltr"}, introduced_tokens: ["That's", "a", "fair", "point"]}
          - {content_key: "en.a2.unit26.lesson04.teach.q_what_about_you", kind: "dialogue", target: {text: "What about you?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "about", "you"]}
          - {content_key: "en.a2.unit26.lesson04.teach.a_agree_but_contrast", kind: "dialogue", target: {text: "I agree that dogs need space, but on the other hand, it's very close to the playground.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["that", "need", "space", "but"]}
          - {content_key: "en.a2.unit26.lesson04.teach.a_maybe_move_it", kind: "dialogue", target: {text: "Maybe they should move it a little farther away.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Maybe", "they", "should", "move", "it", "a", "little", "farther", "away"]}
          - {content_key: "en.a2.unit26.lesson04.teach.a_yes_better", kind: "dialogue", target: {text: "Yes, I think that would be better.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "that", "would", "be", "better"]}
        exercises:
          - {content_key: "en.a2.unit26.lesson04.exercise01.listen_daniels_opinion", type: "dialogue_comprehension", tested_text: "it's a good idea", media_asset_key: "en.a2.audio.dialogue.dog_park_opinion.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit26.lesson04.exercise02.listen_leilas_concern", type: "listen_select", tested_text: "very close to the playground", media_asset_key: "en.a2.audio.dialogue.dog_park_opinion.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit26.lesson04.exercise03.choose_proposed_solution", type: "multiple_choice", tested_text: "move it a little farther away", prompt: {target_blocks: [{text: "What solution does Daniel suggest?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit26.lesson04.exercise04.order_what_about_you", type: "word_order", tested_text: "What about you", prompt: {target_blocks: []}, word_bank: ["about", "you", "What"]}
          - content_key: "en.a2.unit26.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "I agree that dogs need space but on the other hand it's very close to the playground Yes I think that would be better"
            prompt: {target_blocks: [{text: "I think it's a good idea because dogs need space to run. What about you?", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Leila"}, {text: "That's a fair point. Maybe they should move it a little farther away.", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Leila"}]}
          - content_key: "en.a2.unit26.lesson04.exercise06.speak_opinion_dialogue"
            type: "speak_response"
            tested_text: "I agree that dogs need space but on the other hand it's very close to the playground Yes I think that would be better"
            prompt: {target_blocks: [{text: "I think it's a good idea because dogs need space to run. What about you?", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Leila"}, {text: "That's a fair point. Maybe they should move it a little farther away.", language_code: "en", direction: "ltr", speaker: "Daniel"}, {text: "…", language_code: "en", direction: "ltr", speaker: "Leila"}]}
