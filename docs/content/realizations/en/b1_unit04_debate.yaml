course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: agreeing or disagreeing with a stated opinion and giving a reason, using a that-clause to reference the other person's view (I agree/disagree that... because...), in a casual conversation between friends."

media_assets:
  - {content_key: "en.b1.audio.debate.words.opinion.01", language: "en", text: "opinion", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.debate.sentence.01", language: "en", text: "I agree that working from home is better because you save time.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.debate.01"
    language: "en"
    text: "Daniel: Do you think working from home is better than the office? Leila: I disagree that it's better. I think you miss important conversations with coworkers. Daniel: That's a fair point, but I agree that it saves a lot of time. Leila: I agree that it saves time, but I still prefer the office. Daniel: That makes sense. Everyone has a different opinion."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit04.debate"
    title: "I agree, I disagree, because"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.debate.agree_disagree_with_reasons"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit04.lesson01.debate_vocabulary"
        title: "Agree, disagree, and opinion"
        spine_outcome_id: "universal.b1.debate.agree_disagree_with_reasons"
        teaching:
          - {content_key: "en.b1.unit04.lesson01.teach.agree", kind: "vocabulary", target: {text: "agree", language_code: "en", direction: "ltr"}, introduced_tokens: ["agree"], example: {text: "I agree with you.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit04.lesson01.teach.disagree", kind: "vocabulary", target: {text: "disagree", language_code: "en", direction: "ltr"}, introduced_tokens: ["disagree"], example: {text: "I disagree with that opinion.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit04.lesson01.teach.opinion", kind: "vocabulary", target: {text: "opinion", language_code: "en", direction: "ltr"}, introduced_tokens: ["opinion"], example: {text: "Everyone has a different opinion.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit04.lesson01.teach.believe", kind: "vocabulary", target: {text: "believe", language_code: "en", direction: "ltr"}, introduced_tokens: ["believe"], example: {text: "I believe that it's a good idea.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit04.lesson01.teach.reason", kind: "vocabulary", target: {text: "reason", language_code: "en", direction: "ltr"}, introduced_tokens: ["reason"], example: {text: "What is your reason for thinking that?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit04.lesson01.teach.save_time", kind: "vocabulary", target: {text: "save time", language_code: "en", direction: "ltr"}, introduced_tokens: ["save", "time"], example: {text: "Working from home helps me save time.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit04.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "opinion", media_asset_key: "en.b1.audio.debate.words.opinion.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit04.lesson01.exercise02.choose_disagree_word", type: "multiple_choice", tested_text: "disagree", prompt: {target_blocks: [{text: "Which word means you think someone is wrong?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson01.exercise03.choose_reason_word", type: "multiple_choice", tested_text: "reason", prompt: {target_blocks: [{text: "Which word means the explanation behind your opinion?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson01.exercise04.match_debate_words", type: "matching_pairs", tested_text: "opinion reason save time", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a personal view about something", right: "opinion"}, {left: "the explanation behind an opinion", right: "reason"}, {left: "to not waste time", right: "save time"}]}
          - {content_key: "en.b1.unit04.lesson01.exercise05.write_opinion", type: "writing_prompt", tested_text: "opinion", prompt: {target_blocks: [{text: "Write the word for a personal view about something.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit04.lesson02.agreeing_and_disagreeing"
        title: "I agree that, I disagree that"
        spine_outcome_id: "universal.b1.debate.agree_disagree_with_reasons"
        teaching:
          - {content_key: "en.b1.unit04.lesson02.teach.agree_that_saves_time", kind: "phrase", target: {text: "I agree that working from home is better because you save time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "agree", "that", "working", "from", "home", "is", "better", "because", "you", "save", "time"], media_asset_key: "en.b1.audio.debate.sentence.01"}
          - {content_key: "en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers", kind: "phrase", target: {text: "I disagree that it's better because you miss your coworkers.", language_code: "en", direction: "ltr"}, introduced_tokens: ["disagree", "it's", "miss", "your", "coworkers"]}
          - {content_key: "en.b1.unit04.lesson02.teach.grammar_agree_disagree_that", kind: "grammar_note", target: {text: "I agree that it's better. I disagree that it's better.", language_code: "en", direction: "ltr"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.b1.unit04.lesson02.exercise01.choose_agree_sentence", type: "multiple_choice", tested_text: "I agree that working from home is better because you save time.", prompt: {target_blocks: [{text: "Which sentence agrees with an opinion and gives a reason?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson02.exercise02.choose_disagree_sentence", type: "multiple_choice", tested_text: "I disagree that it's better because you miss your coworkers.", prompt: {target_blocks: [{text: "Which sentence disagrees with an opinion and gives a reason?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson02.exercise03.order_agree_that_saves_time", type: "word_order", tested_text: "I agree that working from home is better", prompt: {target_blocks: []}, word_bank: ["agree", "that", "working", "from", "home", "is", "better", "I"]}
          - {content_key: "en.b1.unit04.lesson02.exercise04.reply_do_you_agree", type: "dialogue_response", tested_text: "I agree that working from home is better because you save time", prompt: {target_blocks: [{text: "Do you agree that working from home is better?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson02.exercise05.write_disagree_coworkers", type: "writing_prompt", tested_text: "I disagree that it's better because you miss your coworkers.", prompt: {target_blocks: [{text: "Write that you disagree because you miss your coworkers.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit04.lesson03.reading_two_opinions"
        title: "Reading: two different opinions"
        spine_outcome_id: "universal.b1.debate.agree_disagree_with_reasons"
        teaching:
          - {content_key: "en.b1.unit04.lesson03.teach.focus", kind: "vocabulary", target: {text: "focus", language_code: "en", direction: "ltr"}, introduced_tokens: ["focus"], example: {text: "She can focus more easily at home.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit04.lesson03.teach.respect", kind: "vocabulary", target: {text: "respect", language_code: "en", direction: "ltr"}, introduced_tokens: ["respect"], example: {text: "They respect each other's opinion.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit04.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Mia thinks that working from home is better because she can focus more easily. Leila disagrees. She believes that going to the office is better because she likes seeing her coworkers every day. They don't agree, but they respect each other's opinion.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Mia", "thinks", "she", "can", "more", "easily", "Leila", "disagrees", "She", "believes", "going", "office", "likes", "seeing", "her", "every", "day", "They", "don't", "but", "respect", "each", "other's"]
        exercises:
          - {content_key: "en.b1.unit04.lesson03.exercise01.comprehend_mias_opinion", type: "reading_comprehension", tested_text: "working from home is better", prompt: {target_blocks: [{text: "What does Mia think is better?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson03.exercise02.comprehend_leilas_reason", type: "reading_comprehension", tested_text: "she likes seeing her coworkers every day", prompt: {target_blocks: [{text: "What is Leila's reason for preferring the office?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson03.exercise03.recognize_focus", type: "multiple_choice", tested_text: "focus", prompt: {target_blocks: [{text: "Which word means to pay close attention to your work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson03.exercise04.order_they_respect_each_others", type: "word_order", tested_text: "They respect each other's opinion", prompt: {target_blocks: []}, word_bank: ["respect", "each", "other's", "opinion", "They"]}
          - {content_key: "en.b1.unit04.lesson03.exercise05.write_leila_disagrees", type: "writing_prompt", tested_text: "Leila disagrees.", prompt: {target_blocks: [{text: "Write that Leila disagrees.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit04.lesson04.the_remote_work_dialogue"
        title: "Everyone has a different opinion"
        spine_outcome_id: "universal.b1.debate.agree_disagree_with_reasons"
        teaching:
          - {content_key: "en.b1.unit04.lesson04.teach.q_working_from_home", kind: "dialogue", target: {text: "Do you think working from home is better than the office?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Do", "you", "think", "working", "from", "home", "is", "better", "than", "the", "office"], media_asset_key: "en.b1.audio.dialogue.debate.01"}
          - {content_key: "en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers", kind: "dialogue", target: {text: "I disagree that it's better. I think you miss important conversations with coworkers.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["disagree", "that", "it's", "I", "think", "you", "miss", "important", "conversations", "with", "coworkers"]}
          - {content_key: "en.b1.unit04.lesson04.teach.q_fair_point_saves_time", kind: "dialogue", target: {text: "That's a fair point, but I agree that it saves a lot of time.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That's", "a", "fair", "point", "but", "agree", "saves", "lot", "of", "time"]}
          - {content_key: "en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office", kind: "dialogue", target: {text: "I agree that it saves time, but I still prefer the office.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["agree", "saves", "time", "but", "still", "prefer", "the", "office"]}
          - {content_key: "en.b1.unit04.lesson04.teach.q_everyone_different_opinion", kind: "dialogue", target: {text: "That makes sense. Everyone has a different opinion.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That", "makes", "sense", "Everyone", "has", "a", "different", "opinion"]}
        exercises:
          - {content_key: "en.b1.unit04.lesson04.exercise01.listen_what_leila_disagrees_with", type: "dialogue_comprehension", tested_text: "working from home is better than the office", media_asset_key: "en.b1.audio.dialogue.debate.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit04.lesson04.exercise02.listen_leilas_reason", type: "listen_select", tested_text: "you miss important conversations with coworkers", media_asset_key: "en.b1.audio.dialogue.debate.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit04.lesson04.exercise03.choose_what_daniel_agrees_with", type: "multiple_choice", tested_text: "it saves a lot of time", prompt: {target_blocks: [{text: "What does Daniel agree with about working from home?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit04.lesson04.exercise04.order_everyone_has_different_opinion", type: "word_order", tested_text: "Everyone has a different opinion", prompt: {target_blocks: []}, word_bank: ["has", "a", "different", "opinion", "Everyone"]}
          - content_key: "en.b1.unit04.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "I disagree that it's better I think you miss important conversations with coworkers"
            prompt: {target_blocks: [{text: "Do you think working from home is better than the office?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit04.lesson04.exercise06.speak_debate_dialogue"
            type: "speak_response"
            tested_text: "I agree that it saves time but I still prefer the office"
            prompt: {target_blocks: [{text: "That's a fair point, but I agree that it saves a lot of time.", language_code: "en", direction: "ltr"}]}
