course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Cinema register is a simple, everyday spoken exchange between two friends and a cashier about going to see a film: asking when it starts, buying tickets, buying popcorn, asking for the total price, and reacting to the film afterward. Core vocabulary (cinema/ticket/showtime/seat/screen/popcorn) is deliberately generic to a routine multiplex visit, not a formal premiere or festival register."

media_assets:
  - {content_key: "en.a1.audio.cinema.words.ticket.01", language: "en", text: "ticket", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.cinema.phrases.what_time_does_the_film_start.01", language: "en", text: "What time does the film start?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.cinema.01"
    language: "en"
    text: "Daniel: Hi! What time does the film start? Cashier: The next show is at seven o'clock. Daniel: Great. Can we have two tickets, please? Cashier: Of course. That's sixteen dollars. Leila: Can we have some popcorn, please? Cashier: Sure. The popcorn is four dollars. Daniel: How much is that in total? Cashier: That's twenty dollars, please. Leila: Thank you! I can't wait to watch it."
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

