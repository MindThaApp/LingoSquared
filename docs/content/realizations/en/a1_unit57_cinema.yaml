          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "The next show is at seven o'clock.", language_code: "en", direction: "ltr", speaker: "Cashier"}, introduced_tokens: ["next"]}
          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "Great. Can we have two tickets, please?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Great"]}
          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Of course. That's sixteen dollars.", language_code: "en", direction: "ltr", speaker: "Cashier"}, introduced_tokens: ["Of", "course", "sixteen"]}
          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Can we have some popcorn, please?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Sure. The popcorn is four dollars.", language_code: "en", direction: "ltr", speaker: "Cashier"}, introduced_tokens: ["Sure", "four"]}
          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "How much is that in total?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line8", kind: "dialogue", target: {text: "That's twenty dollars, please.", language_code: "en", direction: "ltr", speaker: "Cashier"}, introduced_tokens: []}
          - {content_key: "en.a1.unit57.lesson03.teach.dialogue_line9", kind: "dialogue", target: {text: "Thank you! I can't wait to watch it.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Thank", "you", "can't", "wait", "watch"]}
        exercises:
          - {content_key: "en.a1.unit57.lesson03.exercise01.comprehension_ticket_count", type: "multiple_choice", tested_text: "two", prompt: {target_blocks: [{text: "According to the dialogue, how many tickets did Daniel and Leila buy?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit57.lesson03.exercise02.comprehension_showtime", type: "multiple_choice", tested_text: "seven o'clock", prompt: {target_blocks: [{text: "According to the dialogue, what time is the next show?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit57.lesson03.exercise03.listen_dialogue_popcorn_price", type: "listen_select", tested_text: "four dollars", media_asset_key: "en.a1.audio.dialogue.cinema.01", prompt: {target_blocks: [{text: "According to the dialogue, how much is the popcorn?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit57.lesson03.exercise04.respond_own_cinema_statement", type: "speak_response", tested_text: "the next show is at seven o'clock", accepted_answers: ["The next show is at seven o'clock", "The next show is at seven o'clock.", "That's sixteen dollars", "That's sixteen dollars.", "That's twenty dollars", "That's twenty dollars.", "That's twenty dollars, please", "That's twenty dollars, please.", "The show starts at seven o'clock", "The show starts at seven o'clock.", "The film starts at seven o'clock", "The film starts at seven o'clock.", "The tickets are sixteen dollars", "The tickets are sixteen dollars.", "The tickets cost sixteen dollars", "The tickets cost sixteen dollars.", "The total was twenty dollars", "The total was twenty dollars.", "The total is twenty dollars", "The total is twenty dollars."], prompt: {target_blocks: [{text: "Say what time the show starts, how much the tickets cost, or how much the total was.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit57.lesson04.an_evening_at_the_cinema"
        title: "Reading: An evening at the cinema"
        spine_outcome_id: "universal.a1.cinema.go_to_the_cinema"
        teaching:
          - {content_key: "en.a1.unit57.lesson04.teach.cinema_schedule", kind: "reading", target: {text: "Cinema Schedule: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Cinema", "Schedule", "Star", "Journey", "7:00", "$8", "The", "Great", "Race", "5:00", "$10", "Funny", "Family", "9:00", "$6"]}
          - {content_key: "en.a1.unit57.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Trip to the Cinema: One evening, Daniel and Leila decided to watch a film at the cinema. They asked what time it started, and the cashier said the next show, Star Journey, was at seven o'clock. They bought two tickets for sixteen dollars and a bag of popcorn for four dollars. That was twenty dollars in total. They watched the film together, and it was about space explorers. It was very funny. When it finished, Leila said she really liked it, and Daniel said he wants to watch the next one too.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Trip", "to", "the", "Cinema", "One", "evening", "Daniel", "and", "Leila", "decided", "watch", "a", "film", "at", "They", "asked", "what", "time", "it", "started", "cashier", "said", "next", "show", "Star", "Journey", "was", "seven", "o'clock", "bought", "two", "tickets", "for", "sixteen", "dollars", "bag", "of", "popcorn", "four", "That", "twenty", "in", "total", "watched", "together", "about", "space", "explorers", "very", "funny", "When", "finished", "she", "really", "liked", "he", "wants", "one", "too"]}
        exercises:
          - {content_key: "en.a1.unit57.lesson04.exercise01.schedule_seven_oclock_film", type: "multiple_choice", tested_text: "Star Journey", prompt: {target_blocks: [{text: "According to the schedule, which film starts at seven o'clock?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit57.lesson04.exercise02.schedule_cheapest_film", type: "multiple_choice", tested_text: "Funny Family", prompt: {target_blocks: [{text: "According to the schedule, which film is the cheapest?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit57.lesson04.exercise03.reading_ticket_count", type: "multiple_choice", tested_text: "two", prompt: {target_blocks: [{text: "According to the reading, how many tickets did they buy?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit57.lesson04.exercise04.reading_total_bill", type: "multiple_choice", tested_text: "twenty dollars", prompt: {target_blocks: [{text: "According to the reading, how much was the total?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit57.lesson04.exercise05.write_own_cinema_message", type: "writing_prompt", tested_text: "They watched Star Journey, and the total was twenty dollars.", prompt: {target_blocks: [{text: "Write a short message: say what film they watched, and say how much the total was.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["They watched Star Journey, and the total was twenty dollars.", "They watched Star Journey. The total was twenty dollars.", "They watched Star Journey and the total was twenty dollars."]}
