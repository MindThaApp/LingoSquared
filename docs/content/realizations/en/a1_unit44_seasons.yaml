course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Season language stays in simple present tense with fixed collocations that must be memorized: in the summer, the leaves change color, it snows a lot, flowers bloom, What's your favorite season? Use \"fall\" (not \"autumn\"), consistent with this realization's established American register. Keep the register casual and warm, appropriate for describing the seasons and personal preferences to a friend, not a meteorological or literary register."

