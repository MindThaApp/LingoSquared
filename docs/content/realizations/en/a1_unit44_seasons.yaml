          - {content_key: "en.a1.unit44.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "That sounds nice. My favorite season is spring.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["That", "sounds", "nice", "My", "favorite", "season", "is", "spring"]}
