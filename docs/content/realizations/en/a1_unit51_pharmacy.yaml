      - content_key: "en.a1.unit51.lesson04.a_trip_to_the_pharmacy"
        title: "Reading: A trip to the pharmacy"
        spine_outcome_id: "universal.a1.pharmacy.buy_basic_medicine"
        teaching:
          - {content_key: "en.a1.unit51.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Trip to the Pharmacy: A few days after their trip to the mountains, Leila caught a cold. She had a bad cough and a runny nose, and her throat felt sore too. Daniel walked with her to the pharmacy near her apartment. The pharmacist listened to Leila's symptoms and recommended cough syrup and tablets. She said to take the cough syrup before bed and one tablet every four hours. Leila paid nine dollars for both. On the way home, Daniel bought a box of tissues for her too. Leila took the medicine that night, and by the weekend, her cough was much better.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Trip", "to", "Pharmacy", "few", "days", "after", "their", "mountains", "Leila", "caught", "cold", "She", "had", "her", "felt", "Daniel", "walked", "near", "apartment", "listened", "symptoms", "recommended", "said", "paid", "On", "way", "home", "bought", "box", "of", "tissues", "night", "by", "weekend", "was", "better"]}
        exercises:
          - {content_key: "en.a1.unit51.lesson04.exercise01.reading_price", type: "multiple_choice", tested_text: "nine dollars", prompt: {target_blocks: [{text: "According to the reading, how much did Leila pay for the medicine?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit51.lesson04.exercise02.reading_syrup_dosage", type: "multiple_choice", tested_text: "before bed", prompt: {target_blocks: [{text: "According to the reading, when should Leila take the cough syrup?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit51.lesson04.exercise03.reading_what_daniel_bought", type: "multiple_choice", tested_text: "tissues", prompt: {target_blocks: [{text: "According to the reading, what did Daniel buy for Leila on the way home?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit51.lesson04.exercise04.write_own_pharmacy_message", type: "writing_prompt", tested_text: "She had a cough and a runny nose. She paid nine dollars.", prompt: {target_blocks: [{text: "Write a short message: say what symptoms Leila had, and say how much she paid.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["She had a cough and a runny nose. She paid nine dollars.", "She had a cough and a runny nose, and she paid nine dollars.", "She had a cough and a runny nose, she paid nine dollars."]}
