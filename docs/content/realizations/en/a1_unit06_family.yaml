course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Use gender-neutral 'parents'/'siblings' alongside gendered terms (mother/father, brother/sister) and cover both immediate and extended family."

media_assets:
  - {content_key: "en.a1.audio.family.immediate.mother.01", language: "en", text: "mother", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.family.extended.grandmother.01", language: "en", text: "grandmother", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.family.who_is.01", language: "en", text: "Who is this?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.family_photo.01"
    language: "en"
    text: "Leila: Is this your family? Daniel: Yes. This is my mother and this is my father. Leila: Who is this? Daniel: This is my sister. She's a teacher. Leila: Do you have any brothers? Daniel: No, I don't. I just have one sister."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit06.family"
    title: "Family members and relationships"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.family.describe_relationships"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit06.lesson01.immediate_family"
        title: "Immediate family"
        spine_outcome_id: "universal.a1.family.describe_relationships"
        teaching:
          - {content_key: "en.a1.unit06.lesson01.teach.mother", kind: "vocabulary", target: {text: "mother", language_code: "en", direction: "ltr"}, introduced_tokens: ["mother"], example: {text: "This is my mother.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson01.teach.father", kind: "vocabulary", target: {text: "father", language_code: "en", direction: "ltr"}, introduced_tokens: ["father"], example: {text: "This is my father.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson01.teach.brother", kind: "vocabulary", target: {text: "brother", language_code: "en", direction: "ltr"}, introduced_tokens: ["brother"], example: {text: "This is my brother.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson01.teach.sister", kind: "vocabulary", target: {text: "sister", language_code: "en", direction: "ltr"}, introduced_tokens: ["sister"], example: {text: "This is my sister.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson01.teach.parents", kind: "vocabulary", target: {text: "parents", language_code: "en", direction: "ltr"}, introduced_tokens: ["parents"], example: {text: "These are my parents.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson01.teach.siblings", kind: "vocabulary", target: {text: "siblings", language_code: "en", direction: "ltr"}, introduced_tokens: ["siblings"], example: {text: "These are my siblings.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit06.lesson01.exercise01.listen_mother", type: "listen_select", tested_text: "mother", media_asset_key: "en.a1.audio.family.immediate.mother.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit06.lesson01.exercise02.choose_brother"
            type: "multiple_choice"
            tested_text: "brother"
            prompt: {target_blocks: [{text: "A male sibling is called a...", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit06.lesson01.exercise03.choose_parents"
            type: "multiple_choice"
            tested_text: "parents"
            prompt: {target_blocks: [{text: "Your mother and father together are your...", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit06.lesson01.exercise04.match_family_words", type: "matching_pairs", tested_text: "mother father brother sister", prompt: {target_blocks: []}, pairs: [{left: "mother", right: "female parent"}, {left: "father", right: "male parent"}, {left: "brother", right: "male sibling"}, {left: "sister", right: "female sibling"}, {left: "parents", right: "mother and father together"}, {left: "siblings", right: "brother and sister"}, {left: "aunt", right: "your mother's sister"}, {left: "grandmother", right: "your mother's or father's mother"}, {left: "grandfather", right: "your mother's or father's father"}, {left: "uncle", right: "your father's brother"}, {left: "cousin", right: "your aunt or uncle's child"}]}
          - {content_key: "en.a1.unit06.lesson01.exercise05.write_siblings", type: "writing_prompt", tested_text: "siblings", prompt: {target_blocks: [{text: "Write the word for brothers and sisters together.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit06.lesson02.extended_family_possessives"
        title: "Extended family and possessives"
        spine_outcome_id: "universal.a1.family.describe_relationships"
        teaching:
          - {content_key: "en.a1.unit06.lesson02.teach.grandmother", kind: "vocabulary", target: {text: "grandmother", language_code: "en", direction: "ltr"}, introduced_tokens: ["grandmother"], example: {text: "This is my grandmother.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson02.teach.grandfather", kind: "vocabulary", target: {text: "grandfather", language_code: "en", direction: "ltr"}, introduced_tokens: ["grandfather"], example: {text: "This is my grandfather.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson02.teach.aunt", kind: "vocabulary", target: {text: "aunt", language_code: "en", direction: "ltr"}, introduced_tokens: ["aunt"], example: {text: "This is my aunt.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson02.teach.uncle", kind: "vocabulary", target: {text: "uncle", language_code: "en", direction: "ltr"}, introduced_tokens: ["uncle"], example: {text: "This is my uncle.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson02.teach.cousin", kind: "vocabulary", target: {text: "cousin", language_code: "en", direction: "ltr"}, introduced_tokens: ["cousin"], example: {text: "This is my cousin.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson02.teach.my_mother", kind: "phrase", target: {text: "my mother", language_code: "en", direction: "ltr"}, introduced_tokens: ["my", "mother"]}
          - {content_key: "en.a1.unit06.lesson02.teach.your_father", kind: "phrase", target: {text: "your father", language_code: "en", direction: "ltr"}, introduced_tokens: ["your", "father"]}
          - {content_key: "en.a1.unit06.lesson02.teach.his_sister", kind: "phrase", target: {text: "his sister", language_code: "en", direction: "ltr"}, introduced_tokens: ["his", "sister"]}
          - {content_key: "en.a1.unit06.lesson02.teach.her_brother", kind: "phrase", target: {text: "her brother", language_code: "en", direction: "ltr"}, introduced_tokens: ["her", "brother"]}
        exercises:
          - {content_key: "en.a1.unit06.lesson02.exercise01.listen_extended", type: "listen_select", tested_text: "grandmother", media_asset_key: "en.a1.audio.family.extended.grandmother.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit06.lesson02.exercise02.choose_aunt"
            type: "multiple_choice"
            tested_text: "aunt"
            prompt: {target_blocks: [{text: "Your mother's sister is your...", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit06.lesson02.exercise03.choose_his"
            type: "multiple_choice"
            tested_text: "his sister"
            prompt: {target_blocks: [{text: "Daniel is a man. This is _ sister.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit06.lesson02.exercise04.choose_her"
            type: "multiple_choice"
            tested_text: "her brother"
            prompt: {target_blocks: [{text: "Leila is a woman. This is _ brother.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit06.lesson02.exercise05.order_your_father", type: "word_order", tested_text: "your father", prompt: {target_blocks: [{text: "Name the father of the person you are talking to, using the family photo.", language_code: "en", direction: "ltr"}]}, word_bank: ["father", "your"]}
          - {content_key: "en.a1.unit06.lesson02.exercise06.write_cousin", type: "writing_prompt", tested_text: "cousin", prompt: {target_blocks: [{text: "Write the word for your aunt or uncle's child.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit06.lesson03.describing_family"
        title: "Describing your family"
        spine_outcome_id: "universal.a1.family.describe_relationships"
        teaching:
          - {content_key: "en.a1.unit06.lesson03.teach.this_is_my_sister", kind: "phrase", target: {text: "This is my sister.", language_code: "en", direction: "ltr"}, introduced_tokens: ["This", "is", "my", "sister"]}
          - {content_key: "en.a1.unit06.lesson03.teach.she_is_20", kind: "phrase", target: {text: "She's twenty years old.", language_code: "en", direction: "ltr"}, introduced_tokens: ["She's", "twenty", "years", "old"]}
          - {content_key: "en.a1.unit06.lesson03.teach.i_have_two_brothers", kind: "phrase", target: {text: "I have two brothers.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "have", "two", "brothers"]}
          - {content_key: "en.a1.unit06.lesson03.teach.do_you_have_siblings", kind: "phrase", target: {text: "Do you have any siblings?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "have", "any", "siblings"]}
          - {content_key: "en.a1.unit06.lesson03.teach.no_i_dont", kind: "phrase", target: {text: "No, I don't. I'm an only child.", language_code: "en", direction: "ltr"}, introduced_tokens: ["No", "I", "don't", "I'm", "an", "only", "child"]}
        exercises:
          - content_key: "en.a1.unit06.lesson03.exercise01.choose_this_is"
            type: "multiple_choice"
            tested_text: "This is my sister."
            prompt: {target_blocks: [{text: "Introduce your sister in a photo.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit06.lesson03.exercise02.order_have_siblings", type: "word_order", tested_text: "Do you have any siblings", prompt: {target_blocks: []}, word_bank: ["you", "have", "any", "siblings", "Do"]}
          - content_key: "en.a1.unit06.lesson03.exercise03.reply_siblings"
            type: "dialogue_response"
            tested_text: "Do you have any siblings I have two brothers"
            prompt: {target_blocks: [{text: "Do you have any siblings?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit06.lesson03.exercise04.reply_only_child"
            type: "dialogue_response"
            tested_text: "Do you have any siblings No I don't I'm an only child"
            prompt: {target_blocks: [{text: "Do you have any siblings?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit06.lesson03.exercise05.write_sister_age", type: "writing_prompt", tested_text: "She's twenty years old", prompt: {target_blocks: [{text: "Write your sister's age: she is 20.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit06.lesson04.family_photo_dialogue"
        title: "Looking at a family photo"
        spine_outcome_id: "universal.a1.family.describe_relationships"
        teaching:
          - {content_key: "en.a1.unit06.lesson04.teach.photo", kind: "vocabulary", target: {text: "photo", language_code: "en", direction: "ltr"}, introduced_tokens: ["photo"], example: {text: "I have a photo.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit06.lesson04.teach.q_family", kind: "dialogue", target: {text: "Is this your family?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Is", "this", "your", "family"]}
          - {content_key: "en.a1.unit06.lesson04.teach.a_parents", kind: "dialogue", target: {text: "Yes. This is my mother and this is my father.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "This", "is", "my", "mother", "and", "father"]}
          - {content_key: "en.a1.unit06.lesson04.teach.q_who", kind: "dialogue", target: {text: "Who is this?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Who", "is", "this"]}
          - {content_key: "en.a1.unit06.lesson04.teach.a_sister_teacher", kind: "dialogue", target: {text: "This is my sister. She's a teacher.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["This", "is", "my", "sister", "She's", "a", "teacher"]}
          - {content_key: "en.a1.unit06.lesson04.teach.q_brothers", kind: "dialogue", target: {text: "Do you have any brothers?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Do", "you", "have", "any", "brothers"]}
          - {content_key: "en.a1.unit06.lesson04.teach.a_no_one_sister", kind: "dialogue", target: {text: "No, I don't. I just have one sister.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["No", "I", "don't", "just", "have", "one", "sister"]}
        exercises:
          - {content_key: "en.a1.unit06.lesson04.exercise01.listen_parents", type: "dialogue_comprehension", tested_text: "This is my mother and this is my father", media_asset_key: "en.a1.audio.dialogue.family_photo.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit06.lesson04.exercise02.listen_sister_job", type: "listen_select", tested_text: "She's a teacher", media_asset_key: "en.a1.audio.dialogue.family_photo.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit06.lesson04.exercise03.choose_brothers_answer"
            type: "multiple_choice"
            tested_text: "No, I don't. I just have one sister."
            prompt: {target_blocks: [{text: "Does Daniel have any brothers?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit06.lesson04.exercise04.order_who_question", type: "word_order", tested_text: "Who is this", prompt: {target_blocks: []}, word_bank: ["is", "this", "Who"]}
          - content_key: "en.a1.unit06.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "This is my mother and this is my father This is my sister She's a teacher"
            prompt: {target_blocks: [{text: "Is this your family? Who is this?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit06.lesson04.exercise06.speak_family"
            type: "speak_response"
            tested_text: "This is my mother and this is my father This is my sister She's a teacher No I don't I just have one sister"
            prompt: {target_blocks: [{text: "Is this your family? Who is this? Do you have any brothers?", language_code: "en", direction: "ltr"}]}
