course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: describing future plans, intentions, and predictions with three distinct forms and their certainty markers -- the present continuous for fixed arrangements (I am meeting... on Friday), going to for intentions/decisions already made (I am going to...), and will for predictions and on-the-spot decisions, paired with certainty markers (definitely, probably, might) -- in the context of everyday workplace and personal planning."

media_assets:
  - {content_key: "en.b1.audio.future_plans.phrase.probably.01", language: "en", text: "probably", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.future_plans.sentence.01", language: "en", text: "I am meeting Leila for lunch on Friday.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.future_plans.01"
    language: "en"
    text: "Mia: Daniel, what are your plans for next month? Daniel: I am going to start a new project with the design team. Mia: That sounds exciting. Are you meeting them this week? Daniel: Yes, I am meeting them on Friday morning. Mia: Do you think the project will finish on time? Daniel: I'm not sure, but it will probably take about two months. Mia: Well, I'm sure it will go well. Daniel: Thanks. I might ask Leila to join the team too."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit18.future_plans"
    title: "I am going to start a new project"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.future.describe_plans_intentions_and_predictions"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit18.lesson01.future_plans_vocabulary"
        title: "Talking about the future"
        spine_outcome_id: "universal.b1.future.describe_plans_intentions_and_predictions"
        teaching:
          - {content_key: "en.b1.unit18.lesson01.teach.arrangement", kind: "vocabulary", target: {text: "arrangement", language_code: "en", direction: "ltr"}, introduced_tokens: ["arrangement"], example: {text: "Mia has an arrangement to meet Leila on Friday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit18.lesson01.teach.intention", kind: "vocabulary", target: {text: "intention", language_code: "en", direction: "ltr"}, introduced_tokens: ["intention"], example: {text: "Daniel's intention is to finish the project early.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit18.lesson01.teach.prediction", kind: "vocabulary", target: {text: "prediction", language_code: "en", direction: "ltr"}, introduced_tokens: ["prediction"], example: {text: "My prediction is that the project will finish on time.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit18.lesson01.teach.definitely", kind: "vocabulary", target: {text: "definitely", language_code: "en", direction: "ltr"}, introduced_tokens: ["definitely"], example: {text: "Daniel will definitely finish the report today.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit18.lesson01.teach.probably", kind: "vocabulary", target: {text: "probably", language_code: "en", direction: "ltr"}, introduced_tokens: ["probably", "months"], example: {text: "The project will probably take two months.", language_code: "en", direction: "ltr"}, media_asset_key: "en.b1.audio.future_plans.phrase.probably.01"}
          - {content_key: "en.b1.unit18.lesson01.teach.might", kind: "vocabulary", target: {text: "might", language_code: "en", direction: "ltr"}, introduced_tokens: ["might"], example: {text: "Daniel might ask Leila to join the team.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit18.lesson01.exercise01.listen_probably", type: "listen_select", tested_text: "probably", media_asset_key: "en.b1.audio.future_plans.phrase.probably.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit18.lesson01.exercise02.choose_definitely", type: "multiple_choice", tested_text: "definitely", prompt: {target_blocks: [{text: "Which word describes the highest level of certainty about a future event?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson01.exercise03.choose_might", type: "multiple_choice", tested_text: "might", prompt: {target_blocks: [{text: "Which word describes a future possibility that is not certain at all?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson01.exercise04.match_future_words", type: "matching_pairs", tested_text: "arrangement intention prediction definitely probably might", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a plan already fixed with another person, such as a meeting time", right: "arrangement"}, {left: "something you have decided to do, but have not yet fixed a time for with anyone else", right: "intention"}, {left: "a guess about what will happen, based on evidence", right: "prediction"}, {left: "shows you are completely certain something will happen", right: "definitely"}, {left: "shows you are fairly confident but not completely certain", right: "probably"}, {left: "shows the event is only a weak possibility", right: "might"}]}
          - {content_key: "en.b1.unit18.lesson01.exercise05.write_probably", type: "writing_prompt", tested_text: "probably", prompt: {target_blocks: [{text: "Write the word that shows you are fairly confident but not completely certain about something.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit18.lesson02.fixed_arrangements_and_intentions"
        title: "I am meeting Leila on Friday"
        spine_outcome_id: "universal.b1.future.describe_plans_intentions_and_predictions"
        teaching:
          - {content_key: "en.b1.unit18.lesson02.teach.meeting_leila_friday", kind: "phrase", target: {text: "I am meeting Leila for lunch on Friday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "am", "meeting", "Leila", "for", "lunch", "on", "Friday"], media_asset_key: "en.b1.audio.future_plans.sentence.01"}
          - {content_key: "en.b1.unit18.lesson02.teach.going_to_start_project", kind: "phrase", target: {text: "I am going to start a new project with the design team.", language_code: "en", direction: "ltr"}, introduced_tokens: ["going", "to", "start", "a", "new", "project", "with", "the", "design", "team"]}
          - {content_key: "en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions", kind: "grammar_note", target: {text: "Use the present continuous (I am meeting Leila on Friday) for a fixed arrangement -- a specific time already agreed with someone else. Use going to (I am going to start a new project) for an intention or decision you have already made, even without a fixed time yet.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Use", "present", "continuous", "fixed", "already", "agreed", "someone", "else", "decision", "made", "even", "without", "time", "yet"]}
        exercises:
          - {content_key: "en.b1.unit18.lesson02.exercise01.choose_meeting_leila", type: "multiple_choice", tested_text: "I am meeting Leila for lunch on Friday.", prompt: {target_blocks: [{text: "Which sentence describes a fixed arrangement with a specific time already agreed?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson02.exercise02.choose_going_to_start", type: "multiple_choice", tested_text: "I am going to start a new project with the design team.", prompt: {target_blocks: [{text: "Which sentence describes a decision Daniel has already made, without naming a fixed time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson02.exercise03.order_meeting_leila", type: "word_order", tested_text: "I am meeting Leila for lunch on Friday", prompt: {target_blocks: []}, word_bank: ["am", "meeting", "Leila", "for", "lunch", "on", "Friday", "I"]}
          - {content_key: "en.b1.unit18.lesson02.exercise04.reply_going_to_start", type: "dialogue_response", tested_text: "I am going to start a new project with the design team", prompt: {target_blocks: [{text: "Daniel, what are your plans for next month?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson02.exercise05.write_meeting_leila", type: "writing_prompt", tested_text: "I am meeting Leila for lunch on Friday.", prompt: {target_blocks: [{text: "Write that you are meeting Leila for lunch on Friday, using the present continuous.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit18.lesson03.reading_daniels_plans"
        title: "Reading: Daniel's plans for next month"
        spine_outcome_id: "universal.b1.future.describe_plans_intentions_and_predictions"
        teaching:
          - {content_key: "en.b1.unit18.lesson03.teach.on_time", kind: "vocabulary", target: {text: "on time", language_code: "en", direction: "ltr"}, introduced_tokens: ["on", "time"], example: {text: "Daniel thinks the project will finish on time.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit18.lesson03.teach.confident", kind: "vocabulary", target: {text: "confident", language_code: "en", direction: "ltr"}, introduced_tokens: ["confident"], example: {text: "Daniel feels confident about the new project.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit18.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Daniel is going to start a new project with the design team next month. He is meeting them on Friday morning to plan the first steps. Daniel feels confident about the project, but he is not completely sure it will finish on time. He predicts it will probably take about two months. He might ask Leila to join the team, since she has useful design experience. If she agrees, the project will definitely move faster.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["He", "morning", "plan", "first", "steps", "feels", "but", "he", "not", "completely", "sure", "it", "predicts", "since", "she", "has", "useful", "experience", "If", "agrees", "move", "faster"]
        exercises:
          - {content_key: "en.b1.unit18.lesson03.exercise01.comprehend_start_project", type: "reading_comprehension", tested_text: "start a new project with the design team", prompt: {target_blocks: [{text: "What is Daniel going to do next month?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson03.exercise02.comprehend_probably_two_months", type: "reading_comprehension", tested_text: "it will probably take about two months", prompt: {target_blocks: [{text: "What does Daniel predict about how long the project will take?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson03.exercise03.recognize_confident", type: "multiple_choice", tested_text: "confident", prompt: {target_blocks: [{text: "Which word means feeling sure that things will go well?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson03.exercise04.order_meeting_friday_morning", type: "word_order", tested_text: "He is meeting them on Friday morning", prompt: {target_blocks: []}, word_bank: ["is", "meeting", "them", "on", "Friday", "morning", "He"]}
          - {content_key: "en.b1.unit18.lesson03.exercise05.write_might_ask_leila", type: "writing_prompt", tested_text: "Daniel might ask Leila to join the team.", prompt: {target_blocks: [{text: "Write that Daniel might ask Leila to join the team, using 'might' to show a weak possibility.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit18.lesson04.the_planning_dialogue"
        title: "It will probably take two months"
        spine_outcome_id: "universal.b1.future.describe_plans_intentions_and_predictions"
        teaching:
          - {content_key: "en.b1.unit18.lesson04.teach.q_plans_next_month", kind: "dialogue", target: {text: "Daniel, what are your plans for next month?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Daniel", "what", "are", "your", "plans", "for", "next", "month"], media_asset_key: "en.b1.audio.dialogue.future_plans.01"}
          - {content_key: "en.b1.unit18.lesson04.teach.a_going_to_start", kind: "dialogue", target: {text: "I am going to start a new project with the design team.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["am", "going", "to", "start", "a", "new", "project", "with", "the", "design", "team"]}
          - {content_key: "en.b1.unit18.lesson04.teach.q_meeting_this_week", kind: "dialogue", target: {text: "That sounds exciting. Are you meeting them this week?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["That", "sounds", "exciting", "Are", "you", "meeting", "them", "this", "week"]}
          - {content_key: "en.b1.unit18.lesson04.teach.a_meeting_friday_morning", kind: "dialogue", target: {text: "Yes, I am meeting them on Friday morning.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "I", "am", "meeting", "them", "on", "Friday", "morning"]}
          - {content_key: "en.b1.unit18.lesson04.teach.q_finish_on_time", kind: "dialogue", target: {text: "Do you think the project will finish on time?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Do", "you", "think", "the", "project", "will", "finish", "on", "time"]}
          - {content_key: "en.b1.unit18.lesson04.teach.a_probably_two_months", kind: "dialogue", target: {text: "I'm not sure, but it will probably take about two months.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I'm", "not", "sure", "but", "it", "will", "probably", "take", "about", "two", "months"]}
          - {content_key: "en.b1.unit18.lesson04.teach.q_sure_it_will_go_well", kind: "dialogue", target: {text: "Well, I'm sure it will go well.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Well", "sure", "it", "will", "go", "well"]}
          - {content_key: "en.b1.unit18.lesson04.teach.a_might_ask_leila", kind: "dialogue", target: {text: "Thanks. I might ask Leila to join the team too.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thanks", "I", "might", "ask", "Leila", "to", "join", "the", "team", "too"]}
        exercises:
          - {content_key: "en.b1.unit18.lesson04.exercise01.listen_going_to_start", type: "dialogue_comprehension", tested_text: "I am going to start a new project with the design team", media_asset_key: "en.b1.audio.dialogue.future_plans.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit18.lesson04.exercise02.listen_meeting_friday_morning", type: "listen_select", tested_text: "I am meeting them on Friday morning", media_asset_key: "en.b1.audio.dialogue.future_plans.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit18.lesson04.exercise03.choose_probably_two_months", type: "multiple_choice", tested_text: "it will probably take about two months", prompt: {target_blocks: [{text: "What does Daniel say about how long the project will probably take?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit18.lesson04.exercise04.order_might_ask_leila", type: "word_order", tested_text: "I might ask Leila to join the team too", prompt: {target_blocks: []}, word_bank: ["might", "ask", "Leila", "to", "join", "the", "team", "too", "I"]}
          - content_key: "en.b1.unit18.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I am meeting them on Friday morning"
            prompt: {target_blocks: [{text: "That sounds exciting. Are you meeting them this week?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit18.lesson04.exercise06.speak_future_plans_dialogue"
            type: "speak_response"
            tested_text: "I might ask Leila to join the team too"
            prompt: {target_blocks: [{text: "Well, I'm sure it will go well.", language_code: "en", direction: "ltr"}]}
