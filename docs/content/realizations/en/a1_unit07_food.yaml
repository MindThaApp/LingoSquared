course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Ordering phrases use polite everyday register (I'd like.../Can I have...) appropriate for a cafe or restaurant, not formal written English."

media_assets:
  - {content_key: "en.a1.audio.food.items.01", language: "en", text: "coffee, tea, water, bread, soup, salad", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.food.order_phrase.01", language: "en", text: "I'd like a coffee, please.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.food.followup.01", language: "en", text: "Anything else? For here or to go?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.cafe.01"
    language: "en"
    text: "Leila: Hi, I'd like a coffee and a sandwich, please. Daniel: Sure. Anything else? Leila: No, that's all, thanks. Daniel: For here or to go? Leila: For here, please. Daniel: OK, that's nine dollars."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit07.food"
    title: "Food, drink, and ordering"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.food.order_simple_meal"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit07.lesson01.food_drink_vocabulary"
        title: "Common food and drink"
        spine_outcome_id: "universal.a1.food.order_simple_meal"
        teaching:
          - {content_key: "en.a1.unit07.lesson01.teach.coffee", kind: "vocabulary", target: {text: "coffee", language_code: "en", direction: "ltr"}, introduced_tokens: ["coffee"], example: {text: "I'd like a coffee, please.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson01.teach.tea", kind: "vocabulary", target: {text: "tea", language_code: "en", direction: "ltr"}, introduced_tokens: ["tea"], example: {text: "I like drinking tea.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson01.teach.water", kind: "vocabulary", target: {text: "water", language_code: "en", direction: "ltr"}, introduced_tokens: ["water"], example: {text: "I'd like a water, please.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson01.teach.bread", kind: "vocabulary", target: {text: "bread", language_code: "en", direction: "ltr"}, introduced_tokens: ["bread"], example: {text: "I like eating bread.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson01.teach.soup", kind: "vocabulary", target: {text: "soup", language_code: "en", direction: "ltr"}, introduced_tokens: ["soup"], example: {text: "I'd like a soup, please.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson01.teach.salad", kind: "vocabulary", target: {text: "salad", language_code: "en", direction: "ltr"}, introduced_tokens: ["salad"], example: {text: "I'd like a salad, please.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson01.teach.sandwich", kind: "vocabulary", target: {text: "sandwich", language_code: "en", direction: "ltr"}, introduced_tokens: ["sandwich"], example: {text: "I'd like a sandwich, please.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit07.lesson01.exercise01.listen_food", type: "listen_select", tested_text: "soup", media_asset_key: "en.a1.audio.food.items.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit07.lesson01.exercise02.choose_drink"
            type: "multiple_choice"
            tested_text: "coffee"
            prompt: {target_blocks: [{text: "Which of these is a hot drink?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit07.lesson01.exercise03.choose_bread"
            type: "multiple_choice"
            tested_text: "bread"
            prompt: {target_blocks: [{text: "Which word means bread?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit07.lesson01.exercise04.match_food_words", type: "matching_pairs", tested_text: "coffee tea water bread", prompt: {target_blocks: []}, pairs: [{left: "hot drink", right: "coffee"}, {left: "hot drink with leaves", right: "tea"}, {left: "drink with no taste", right: "water"}, {left: "baked food", right: "bread"}, {left: "warm liquid food", right: "soup"}, {left: "mixed vegetable dish", right: "salad"}, {left: "bread with something inside", right: "sandwich"}]}
          - {content_key: "en.a1.unit07.lesson01.exercise05.write_sandwich", type: "writing_prompt", tested_text: "sandwich", prompt: {target_blocks: [{text: "Write the word for bread with something inside it.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit07.lesson02.ordering_phrases"
        title: "Ordering politely"
        spine_outcome_id: "universal.a1.food.order_simple_meal"
        teaching:
          - {content_key: "en.a1.unit07.lesson02.teach.id_like", kind: "phrase", target: {text: "I'd like a coffee, please.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'd", "like", "a", "coffee", "please"]}
          - {content_key: "en.a1.unit07.lesson02.teach.can_i_have", kind: "phrase", target: {text: "Can I have a sandwich, please?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Can", "I", "have", "a", "sandwich", "please"]}
          - {content_key: "en.a1.unit07.lesson02.teach.anything_else", kind: "phrase", target: {text: "Anything else?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Anything", "else"]}
          - {content_key: "en.a1.unit07.lesson02.teach.thats_all", kind: "phrase", target: {text: "No, that's all, thanks.", language_code: "en", direction: "ltr"}, introduced_tokens: ["No", "that's", "all", "thanks"]}
          - {content_key: "en.a1.unit07.lesson02.teach.for_here_or_to_go", kind: "phrase", target: {text: "For here or to go?", language_code: "en", direction: "ltr"}, introduced_tokens: ["For", "here", "or", "to", "go"]}
        exercises:
          - {content_key: "en.a1.unit07.lesson02.exercise01.listen_order_phrase", type: "listen_select", tested_text: "I'd like a coffee, please", media_asset_key: "en.a1.audio.food.order_phrase.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit07.lesson02.exercise02.choose_order"
            type: "multiple_choice"
            tested_text: "Can I have a sandwich, please?"
            prompt: {target_blocks: [{text: "Politely ask for a sandwich.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit07.lesson02.exercise03.order_id_like", type: "word_order", tested_text: "I'd like a coffee please", prompt: {target_blocks: []}, word_bank: ["like", "I'd", "a", "coffee", "please"]}
          - content_key: "en.a1.unit07.lesson02.exercise04.reply_anything_else"
            type: "dialogue_response"
            tested_text: "Anything else No that's all thanks"
            prompt: {target_blocks: [{text: "Anything else?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit07.lesson02.exercise05.write_order", type: "writing_prompt", tested_text: "I'd like a coffee, please", prompt: {target_blocks: [{text: "Write how you would politely order a coffee.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit07.lesson03.reading_a_menu"
        title: "Reading a simple menu"
        spine_outcome_id: "universal.a1.food.order_simple_meal"
        teaching:
          - {content_key: "en.a1.unit07.lesson03.teach.menu", kind: "vocabulary", target: {text: "menu", language_code: "en", direction: "ltr"}, introduced_tokens: ["menu"], example: {text: "I'm reading the menu.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson03.teach.price", kind: "vocabulary", target: {text: "price", language_code: "en", direction: "ltr"}, introduced_tokens: ["price"], example: {text: "The price is good.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit07.lesson03.teach.menu_text", kind: "reading", target: {text: "Cafe Menu: Coffee - $3. Tea - $2. Soup - $5. Sandwich - $6.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Cafe", "Menu", "Coffee", "Tea", "Soup", "Sandwich", "3", "2", "5", "6"]}
        exercises:
          - content_key: "en.a1.unit07.lesson03.exercise01.read_coffee_price"
            type: "reading_comprehension"
            tested_text: "Coffee $3"
            prompt: {target_blocks: [{text: "How much is the coffee?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit07.lesson03.exercise02.read_soup_price"
            type: "reading_comprehension"
            tested_text: "Soup $5"
            prompt: {target_blocks: [{text: "How much is the soup?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit07.lesson03.exercise03.choose_cheapest"
            type: "multiple_choice"
            tested_text: "Tea"
            prompt: {target_blocks: [{text: "Which item on the menu is the cheapest?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit07.lesson03.exercise04.match_menu_prices", type: "matching_pairs", tested_text: "Coffee Tea Soup Sandwich", prompt: {target_blocks: []}, pairs: [{left: "Coffee", right: "$3"}, {left: "Tea", right: "$2"}, {left: "Soup", right: "$5"}, {left: "Sandwich", right: "$6"}]}
          - {content_key: "en.a1.unit07.lesson03.exercise05.write_menu_item", type: "writing_prompt", tested_text: "Sandwich $6", prompt: {target_blocks: [{text: "Write the most expensive item and its price.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit07.lesson04.cafe_dialogue"
        title: "Ordering at a cafe"
        spine_outcome_id: "universal.a1.food.order_simple_meal"
        teaching:
          - {content_key: "en.a1.unit07.lesson04.teach.thats_x_dollars", kind: "phrase", target: {text: "That's nine dollars.", language_code: "en", direction: "ltr"}, introduced_tokens: ["That's", "nine", "dollars"]}
          - {content_key: "en.a1.unit07.lesson04.teach.q_order", kind: "dialogue", target: {text: "Hi, I'd like a coffee and a sandwich, please.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hi", "I'd", "like", "a", "coffee", "and", "sandwich", "please"]}
          - {content_key: "en.a1.unit07.lesson04.teach.a_anything_else", kind: "dialogue", target: {text: "Sure. Anything else?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Sure", "Anything", "else"]}
          - {content_key: "en.a1.unit07.lesson04.teach.reply_thats_all", kind: "dialogue", target: {text: "No, that's all, thanks.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["No", "that's", "all", "thanks"]}
          - {content_key: "en.a1.unit07.lesson04.teach.q_for_here", kind: "dialogue", target: {text: "For here or to go?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["For", "here", "or", "to", "go"]}
          - {content_key: "en.a1.unit07.lesson04.teach.reply_for_here", kind: "dialogue", target: {text: "For here, please.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["For", "here", "please"]}
          - {content_key: "en.a1.unit07.lesson04.teach.closing_price", kind: "dialogue", target: {text: "OK, that's nine dollars.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["OK", "that's", "nine", "dollars"]}
        exercises:
          - {content_key: "en.a1.unit07.lesson04.exercise01.listen_order", type: "dialogue_comprehension", tested_text: "I'd like a coffee and a sandwich, please", media_asset_key: "en.a1.audio.dialogue.cafe.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit07.lesson04.exercise02.listen_price", type: "listen_select", tested_text: "That's nine dollars", media_asset_key: "en.a1.audio.dialogue.cafe.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit07.lesson04.exercise03.choose_for_here_reply"
            type: "multiple_choice"
            tested_text: "For here, please."
            prompt: {target_blocks: [{text: "Leila wants to eat in the cafe, not take the food away. What does she say?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit07.lesson04.exercise04.order_for_here_question", type: "word_order", tested_text: "For here or to go", prompt: {target_blocks: []}, word_bank: ["here", "or", "to", "go", "For"]}
          - content_key: "en.a1.unit07.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "I'd like a coffee and a sandwich please No that's all thanks For here please"
            prompt: {target_blocks: [{text: "Order a coffee and a sandwich, say that's all, and say you'll eat here.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit07.lesson04.exercise06.speak_order"
            type: "speak_response"
            tested_text: "I'd like a coffee and a sandwich please No that's all thanks For here please"
            prompt: {target_blocks: [{text: "Order a coffee and a sandwich, say that's all, and say you'll eat here.", language_code: "en", direction: "ltr"}]}
