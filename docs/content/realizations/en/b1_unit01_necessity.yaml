schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "B1"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Firecrawl was unavailable this session (402, out of credits, per standing
    instruction not to retry) and no cached scrape existed for B1-level
    English modal-necessity teaching material. Authored directly from
    established ESL B1 conventions (the can-do statement and
    assessment_requirements in universal_spine.yaml's
    universal.b1.necessity.express_obligation_with_subjunctive node) and
    this corpus's own established Daniel/Leila/Mia storyline pattern, not
    adapted from any specific public-domain course. This is the shared
    English realization's first B1 unit -- the en/a1-a2 units it continues
    from were reviewed and mature; this file has not yet had its own
    fresh-context review.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    2026-07-11 fresh-context review (Claude). Verified: modal-necessity
    grammar all correct English (must/have to/should, has-to 3sg
    agreement, should-have + past participle past regret, must-not
    prohibition vs don't-have-to lack-of-necessity); every word_order
    accepted_answers is in correct sentence order (not word_bank order)
    with a buildable word_bank; no boolean coercion, snake_case/jargon
    leaks, over-length titles, or unquoted yes/no; spine outcome exists.
    Continuity holds: Daniel=engineer (a1_unit23), Leila drives/coworker
    (a1_unit31/33), Mia's occupation not referenced. No objective bugs
    found; the overlay gained natural should've contraction variants for
    grading safety (see its review note). FLAG (corpus-wide, NOT fixed):
    lesson01 exercise01 listen_select plays the whole 6-word vocab-list
    audio while 3 distractors are other words spoken in that same clip
    (every option is technically said) -- the same established pattern
    a2_unit30's review already flagged; needs a corpus-wide per-word-audio
    fix, not a per-unit one. FLAG (scope, NOT a defect): these first
    English B1 units are 4 lessons each vs fa/ro/hi's 6-lesson B1
    template.
    Review 2026-10-22 (shared-en r3): 1 fixes - reply_what_must_you_do prompt now 'What do you have to pay by Friday?' (was stilted 'must you pay'). NATIVE FLAGS: none.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: present necessity/obligation (must, have to, should), prohibition and lack of necessity (must not, don't have to), and past regret about an unfulfilled obligation (should have + past participle), in everyday conversational register between friends."

media_assets:
  - {content_key: "en.b1.audio.necessity.words.appointment.01", language: "en", text: "appointment", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.necessity.sentence.01", language: "en", text: "She has to make an appointment.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.necessity.01"
    language: "en"
    text: "Leila: Daniel, did you renew your gym membership? Daniel: Oh no, I forgot! I should have done that last week. Leila: You must call them today, or you'll pay a late fee. Daniel: You're right. I also have to pay the rent by Friday, and I should call the dentist too. Leila: You don't have to do everything today. But you must not forget the gym again. Daniel: I know. I must be more organized this month."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit01.necessity"
    title: "Things I must, have to, and should do"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.necessity.express_obligation_with_subjunctive"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit01.lesson01.necessity_vocabulary"
        title: "Must, have to, and should"
        spine_outcome_id: "universal.b1.necessity.express_obligation_with_subjunctive"
        teaching:
          - {content_key: "en.b1.unit01.lesson01.teach.must", kind: "vocabulary", target: {text: "must", language_code: "en", direction: "ltr"}, introduced_tokens: ["must"], example: {text: "I must finish this task today.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson01.teach.have_to", kind: "vocabulary", target: {text: "have to", language_code: "en", direction: "ltr"}, introduced_tokens: ["have", "to"], example: {text: "I have to pay the rent by Friday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson01.teach.should", kind: "vocabulary", target: {text: "should", language_code: "en", direction: "ltr"}, introduced_tokens: ["should"], example: {text: "You should call the dentist soon.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson01.teach.task", kind: "vocabulary", target: {text: "task", language_code: "en", direction: "ltr"}, introduced_tokens: ["task"], example: {text: "I have one more task to finish.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson01.teach.rent", kind: "vocabulary", target: {text: "rent", language_code: "en", direction: "ltr"}, introduced_tokens: ["rent"], example: {text: "The rent is due on Friday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson01.teach.appointment", kind: "vocabulary", target: {text: "appointment", language_code: "en", direction: "ltr"}, introduced_tokens: ["appointment"], example: {text: "I have a dentist appointment this week.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit01.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "appointment", media_asset_key: "en.b1.audio.necessity.words.appointment.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit01.lesson01.exercise02.choose_must_do_word", type: "multiple_choice", tested_text: "task", prompt: {target_blocks: [{text: "Which word means something you have to do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson01.exercise03.choose_meeting_time_word", type: "multiple_choice", tested_text: "appointment", prompt: {target_blocks: [{text: "Which word means a fixed time to meet someone, like a doctor?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson01.exercise04.match_necessity_words", type: "matching_pairs", tested_text: "must have to should task rent appointment", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "must", right: "a strong personal obligation"}, {left: "have to", right: "an obligation, often from outside"}, {left: "should", right: "a recommendation, not a strict obligation"}, {left: "task", right: "a job or thing you need to do"}, {left: "rent", right: "money you pay to live somewhere"}, {left: "appointment", right: "a fixed time to meet someone"}]}
          - {content_key: "en.b1.unit01.lesson01.exercise05.write_rent", type: "writing_prompt", tested_text: "rent", prompt: {target_blocks: [{text: "Write the word for money you pay to live somewhere.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit01.lesson02.saying_what_you_must_do"
        title: "I must, I have to, she has to"
        spine_outcome_id: "universal.b1.necessity.express_obligation_with_subjunctive"
        teaching:
          - {content_key: "en.b1.unit01.lesson02.teach.must_finish_task", kind: "phrase", target: {text: "I must finish this task today.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "must", "finish", "this", "task", "today"]}
          - {content_key: "en.b1.unit01.lesson02.teach.have_to_pay_rent", kind: "phrase", target: {text: "I have to pay the rent by Friday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["have", "to", "pay", "the", "rent", "by", "Friday"]}
          - {content_key: "en.b1.unit01.lesson02.teach.she_has_to_make", kind: "phrase", target: {text: "She has to make an appointment.", language_code: "en", direction: "ltr"}, introduced_tokens: ["She", "has", "make", "an", "appointment"], media_asset_key: "en.b1.audio.necessity.sentence.01"}
          - {content_key: "en.b1.unit01.lesson02.teach.you_should_call", kind: "phrase", target: {text: "You should call and confirm the appointment.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "should", "call", "and", "confirm"]}
          - {content_key: "en.b1.unit01.lesson02.teach.grammar_agreement", kind: "grammar_note", target: {text: "I have to go. She has to go. We have to go. They have to go.", language_code: "en", direction: "ltr"}, introduced_tokens: ["go", "We", "They"]}
        exercises:
          - {content_key: "en.b1.unit01.lesson02.exercise01.choose_daniels_task", type: "multiple_choice", tested_text: "I must finish this task today.", prompt: {target_blocks: [{text: "Daniel says he has to finish something today. What does he say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson02.exercise02.choose_correct_agreement", type: "multiple_choice", tested_text: "She has to make an appointment.", prompt: {target_blocks: [{text: "Which sentence uses the correct verb form for \"she\"?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson02.exercise03.order_have_to_pay_rent", type: "word_order", tested_text: "I have to pay the rent by Friday", prompt: {target_blocks: []}, word_bank: ["have", "to", "pay", "the", "rent", "by", "Friday", "I"]}
          - {content_key: "en.b1.unit01.lesson02.exercise04.reply_what_must_you_do", type: "dialogue_response", tested_text: "I have to pay the rent by Friday", prompt: {target_blocks: [{text: "What payment is due by Friday?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson02.exercise05.write_she_has_to", type: "writing_prompt", tested_text: "She has to make an appointment.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit01.lesson03.past_regret_and_prohibition"
        title: "Should have, must not, don't have to"
        spine_outcome_id: "universal.b1.necessity.express_obligation_with_subjunctive"
        teaching:
          - {content_key: "en.b1.unit01.lesson03.teach.should_have_called", kind: "vocabulary", target: {text: "should have called", language_code: "en", direction: "ltr"}, introduced_tokens: ["should", "have", "called", "earlier"], example: {text: "I should have called earlier.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson03.teach.must_not", kind: "vocabulary", target: {text: "must not", language_code: "en", direction: "ltr"}, introduced_tokens: ["must", "not"], example: {text: "You must not forget again.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson03.teach.dont_have_to", kind: "vocabulary", target: {text: "don't have to", language_code: "en", direction: "ltr"}, introduced_tokens: ["don't", "have", "to"], example: {text: "You don't have to come if you're busy.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit01.lesson03.teach.grammar_past_regret", kind: "grammar_note", target: {text: "I should have called. I forgot. You must not forget again. You don't have to come.", language_code: "en", direction: "ltr"}, introduced_tokens: ["forgot", "forget", "again", "if", "come", "you're", "busy"]}
          - content_key: "en.b1.unit01.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Yesterday, Daniel forgot to renew his gym membership. He should have set a reminder on his phone. Now he must pay a late fee. He must not forget again next month.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Yesterday", "Daniel", "renew", "his", "gym", "membership", "He", "set", "a", "reminder", "on", "phone", "Now", "pay", "late", "fee", "next", "month"]
        exercises:
          - {content_key: "en.b1.unit01.lesson03.exercise01.comprehend_what_daniel_forgot", type: "reading_comprehension", tested_text: "renew his gym membership", prompt: {target_blocks: [{text: "What did Daniel forget to do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson03.exercise02.comprehend_what_he_should_have_done", type: "reading_comprehension", tested_text: "set a reminder on his phone", prompt: {target_blocks: [{text: "What should Daniel have done?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson03.exercise03.recognize_should_have", type: "multiple_choice", tested_text: "should have called", prompt: {target_blocks: [{text: "Which phrase describes a mistake or regret about the past?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson03.exercise04.order_must_not_forget", type: "word_order", tested_text: "He must not forget again", prompt: {target_blocks: []}, word_bank: ["must", "not", "forget", "again", "He"]}
          - {content_key: "en.b1.unit01.lesson03.exercise05.write_should_have_called", type: "writing_prompt", tested_text: "I should have called earlier.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit01.lesson04.the_gym_membership_dialogue"
        title: "You must not forget again"
        spine_outcome_id: "universal.b1.necessity.express_obligation_with_subjunctive"
        teaching:
          - {content_key: "en.b1.unit01.lesson04.teach.q_renew_gym", kind: "dialogue", target: {text: "Daniel, did you renew your gym membership?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["did", "you", "renew", "your", "gym", "membership"], media_asset_key: "en.b1.audio.dialogue.necessity.01"}
          - {content_key: "en.b1.unit01.lesson04.teach.a_forgot_should_have", kind: "dialogue", target: {text: "Oh no, I forgot! I should have done that last week.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Oh", "no", "forgot", "done", "that", "last", "week"]}
          - {content_key: "en.b1.unit01.lesson04.teach.q_call_today", kind: "dialogue", target: {text: "You must call them today, or you'll pay a late fee.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["must", "call", "them", "today", "or", "you'll", "pay", "a", "late", "fee"]}
          - {content_key: "en.b1.unit01.lesson04.teach.a_also_pay_rent", kind: "dialogue", target: {text: "You're right. I also have to pay the rent by Friday, and I should call the dentist too.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["You're", "right", "also", "have", "to", "pay", "the", "rent", "by", "Friday", "and", "should", "call", "dentist", "too"]}
          - {content_key: "en.b1.unit01.lesson04.teach.q_dont_have_to", kind: "dialogue", target: {text: "You don't have to do everything today. But you must not forget the gym again.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["don't", "have", "to", "do", "everything", "today", "But", "must", "not", "forget", "the", "gym", "again"]}
          - {content_key: "en.b1.unit01.lesson04.teach.a_more_organized", kind: "dialogue", target: {text: "I know. I must be more organized this month.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["know", "must", "be", "more", "organized", "this", "month"]}
        exercises:
          - {content_key: "en.b1.unit01.lesson04.exercise01.listen_what_daniel_forgot", type: "dialogue_comprehension", tested_text: "renew your gym membership", media_asset_key: "en.b1.audio.dialogue.necessity.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit01.lesson04.exercise02.listen_when_daniel_should_have_done_it", type: "listen_select", tested_text: "last week", media_asset_key: "en.b1.audio.dialogue.necessity.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit01.lesson04.exercise03.choose_leilas_warning", type: "multiple_choice", tested_text: "you must not forget the gym again", prompt: {target_blocks: [{text: "According to the dialogue, what does Leila warn Daniel not to do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit01.lesson04.exercise04.order_must_be_more_organized", type: "word_order", tested_text: "I must be more organized this month", prompt: {target_blocks: []}, word_bank: ["must", "be", "more", "organized", "this", "month", "I"]}
          - content_key: "en.b1.unit01.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "Oh no I forgot I should have done that last week"
            prompt: {target_blocks: [{text: "Daniel, did you renew your gym membership?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit01.lesson04.exercise06.speak_necessity_dialogue"
            type: "speak_response"
            tested_text: "You're right I also have to pay the rent by Friday and I should call the dentist too"
            prompt: {target_blocks: [{text: "You must call them today, or you'll pay a late fee.", language_code: "en", direction: "ltr"}]}
