course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Restaurant register is a simple, everyday spoken exchange between two friends and a waiter about dining out: asking for a table, looking at the menu, ordering food, asking prices, and asking for the bill. Core vocabulary (restaurant/waiter/table/menu/order/bill) is deliberately generic to a routine casual sit-down meal, not a formal fine-dining register."

media_assets:
  - {content_key: "en.a1.audio.restaurant.words.menu.01", language: "en", text: "menu", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.restaurant.phrases.is_this_table_free.01", language: "en", text: "Is this table free?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.restaurant.01"
    language: "en"
    text: "Leila: Hi! Is this table free? Waiter: Yes, please sit here. Mia: Could I see the menu, please? Waiter: Of course, here you are. Leila: I'd like the chicken, please. Mia: I'd like the salad, please. Waiter: Great choice! Enjoy your meal! Leila: How much is the chicken? Waiter: The chicken is twelve dollars. Mia: How much is the salad? Waiter: The salad is seven dollars. Leila: Could we have the bill, please? Waiter: That's nineteen dollars, please."
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

