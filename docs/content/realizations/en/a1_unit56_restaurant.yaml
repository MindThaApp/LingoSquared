      - content_key: "en.a1.unit56.lesson04.a_meal_at_the_restaurant"
        title: "Reading: A meal at the restaurant"
        spine_outcome_id: "universal.a1.restaurant.dine_at_restaurant"
        teaching:
          - {content_key: "en.a1.unit56.lesson04.teach.restaurant_menu", kind: "reading", target: {text: "Restaurant Menu: Chicken - $12. Salad - $7. Pizza - $10. Juice - $3.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Pizza", "Juice"]}
          - {content_key: "en.a1.unit56.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Trip to the Restaurant: One evening, Leila and Mia decided to try a new restaurant downtown. A waiter showed them to a table by the window. He brought them a menu with chicken, salad, pizza, and juice. Leila ordered the chicken, and Mia ordered the salad. The chicken was twelve dollars, and the salad was seven dollars. While they ate, they talked about Mia's photography class. When they finished, the waiter brought the bill. It was nineteen dollars for both of them. Leila said the restaurant was excellent, and Mia said she wants to bring Daniel here next time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Trip", "to", "the", "Restaurant", "One", "evening", "Leila", "and", "Mia", "decided", "try", "a", "new", "restaurant", "downtown", "waiter", "showed", "them", "table", "by", "window", "He", "brought", "menu", "with", "chicken", "salad", "pizza", "juice", "ordered", "was", "twelve", "dollars", "While", "they", "ate", "talked", "about", "Mia's", "photography", "class", "When", "finished", "It", "for", "both", "of", "said", "excellent", "she", "wants", "bring", "Daniel", "here", "next", "time", "nineteen", "bill"]}
        exercises:
          - {content_key: "en.a1.unit56.lesson04.exercise01.menu_pizza_price", type: "multiple_choice", tested_text: "pizza", prompt: {target_blocks: [{text: "According to the menu, which item costs ten dollars?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit56.lesson04.exercise02.menu_cheapest_item", type: "multiple_choice", tested_text: "juice", prompt: {target_blocks: [{text: "According to the menu, which item is the cheapest?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit56.lesson04.exercise03.reading_chicken_price", type: "multiple_choice", tested_text: "twelve dollars", prompt: {target_blocks: [{text: "According to the reading, how much did the chicken cost?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit56.lesson04.exercise04.reading_total_bill", type: "multiple_choice", tested_text: "nineteen dollars", prompt: {target_blocks: [{text: "According to the reading, how much was the total bill?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit56.lesson04.exercise05.write_own_restaurant_message", type: "writing_prompt", tested_text: "Leila ordered the chicken, and Mia ordered the salad.", prompt: {target_blocks: [{text: "Write a short message: say what Leila ordered, and say what Mia ordered.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["Leila ordered the chicken, and Mia ordered the salad.", "Leila ordered the chicken. Mia ordered the salad.", "Leila ordered the chicken and Mia ordered the salad.", "Mia ordered the salad, and Leila ordered the chicken.", "Leila ordered chicken, and Mia ordered salad.", "Leila ordered chicken. Mia ordered salad.", "Leila ordered the chicken, and Mia ordered a salad.", "Leila ordered chicken and Mia ordered salad."]}
