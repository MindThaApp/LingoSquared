          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Of course, here you are.", language_code: "en", direction: "ltr", speaker: "Waiter"}, introduced_tokens: ["Of", "course", "you", "are"]}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "I'd like the chicken, please.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "I'd like the salad, please.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: []}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Great choice! Enjoy your meal!", language_code: "en", direction: "ltr", speaker: "Waiter"}, introduced_tokens: ["Great", "choice"]}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line8", kind: "dialogue", target: {text: "How much is the chicken?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line9", kind: "dialogue", target: {text: "The chicken is twelve dollars.", language_code: "en", direction: "ltr", speaker: "Waiter"}, introduced_tokens: ["twelve"]}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line10", kind: "dialogue", target: {text: "How much is the salad?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: []}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line11", kind: "dialogue", target: {text: "The salad is seven dollars.", language_code: "en", direction: "ltr", speaker: "Waiter"}, introduced_tokens: ["seven"]}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line12", kind: "dialogue", target: {text: "Could we have the bill, please?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit56.lesson03.teach.dialogue_line13", kind: "dialogue", target: {text: "That's nineteen dollars, please.", language_code: "en", direction: "ltr", speaker: "Waiter"}, introduced_tokens: ["That's", "nineteen"]}
