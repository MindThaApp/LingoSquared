  method: "authored_from_scratch_established_conventions"
  authoring_system: "codex"
  human_reviewed: false
  source_note: >-
    Authored from scratch from universal_spine.yaml's
    universal.b1.purpose.express_purpose_and_goals outcome and the shared
    English B1 realization conventions established in units 01-06. Not
    adapted from external course material.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    2026-07-12 fresh-context review (Codex). Verified: purpose clauses with
    to/in order to/so that are correct and natural B1 English; so that is
    followed by full clauses; Daniel's English-for-work goal and Leila's
    design-course goal are internally consistent and fit reviewed character
    continuity. Realization-only structural audit passed: YAML parses cleanly,
    spine reference resolves, content_keys are unique, text-block directions
    are correct, no stray YAML booleans or learner-facing snake_case leaks,
    vocabulary examples present, media references declared, all word_order
    items are buildable in sentence order, matching_pairs has 6 pairs, and
    dialogue teaching cards use structured target.speaker with no
    Name:-in-text. Fixed lesson01 exercise01's listen_select audio from a
    whole vocabulary-list clip to single-target-phrase audio so future
    distractors are not spoken in the same clip. LIMITATION: no X-to-en
    overlays exist for this unit yet, so accepted_answers,
    contraction/punctuation variants, and overlay-authored listen distractors
    could not be machine-checked.
    Review 2026-10-22 (shared-en r3): 1 fixes - accepted answers made
    consistent (Yes + I am/I'm, helps you to). NATIVE FLAGS: none.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: explaining purpose and goals with to, in order to, and so that, across study, work, and money-saving contexts."

media_assets:
  - {content_key: "en.b1.audio.purpose.phrase.in_order_to.01", language: "en", text: "in order to", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.purpose.sentence.01", language: "en", text: "I am taking an evening class in order to improve my English.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.purpose.01"
    language: "en"
    text: "Leila: Daniel, why are you taking an evening class? Daniel: I'm taking it in order to improve my English for work. Leila: That makes sense. Are you studying every night? Daniel: I study for thirty minutes so that I can remember more vocabulary. Leila: Good plan. I'm saving money so that I can take a design course next year. Daniel: Then we both have clear goals."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit10.purpose"
    title: "Why I do it"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.purpose.express_purpose_and_goals"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit10.lesson01.purpose_vocabulary"
        title: "In order to, so that, and goal"
        spine_outcome_id: "universal.b1.purpose.express_purpose_and_goals"
        teaching:
          - {content_key: "en.b1.unit10.lesson01.teach.in_order_to", kind: "vocabulary", target: {text: "in order to", language_code: "en", direction: "ltr"}, introduced_tokens: ["in", "order", "to"], example: {text: "I study in order to improve my English.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit10.lesson01.teach.so_that", kind: "vocabulary", target: {text: "so that", language_code: "en", direction: "ltr"}, introduced_tokens: ["so", "that"], example: {text: "I write notes so that I can remember new words.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit10.lesson01.teach.goal", kind: "vocabulary", target: {text: "goal", language_code: "en", direction: "ltr"}, introduced_tokens: ["goal", "take", "a", "design", "course"], example: {text: "Her goal is to take a design course.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit10.lesson01.teach.improve", kind: "vocabulary", target: {text: "improve", language_code: "en", direction: "ltr"}, introduced_tokens: ["improve"], example: {text: "Daniel wants to improve his writing at work.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit10.lesson01.teach.save_money", kind: "vocabulary", target: {text: "save money", language_code: "en", direction: "ltr"}, introduced_tokens: ["save", "money", "for"], example: {text: "Leila saves money for her next course.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit10.lesson01.teach.prepare", kind: "vocabulary", target: {text: "prepare", language_code: "en", direction: "ltr"}, introduced_tokens: ["prepare"], example: {text: "I prepare questions before every meeting.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit10.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "in order to", media_asset_key: "en.b1.audio.purpose.phrase.in_order_to.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit10.lesson01.exercise02.choose_goal_word", type: "multiple_choice", tested_text: "goal", prompt: {target_blocks: [{text: "Which word means something you want to achieve?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson01.exercise03.choose_prepare_word", type: "multiple_choice", tested_text: "prepare", prompt: {target_blocks: [{text: "Which word means to get ready for something?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson01.exercise04.match_purpose_words", type: "matching_pairs", tested_text: "in order to so that goal improve save money prepare", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "in order to", right: "shows the purpose of an action"}, {left: "so that", right: "shows the result or goal you want"}, {left: "goal", right: "something you want to achieve"}, {left: "improve", right: "to make something better"}, {left: "save money", right: "to keep money for later instead of spending it"}, {left: "prepare", right: "to get ready for something"}]}
          - {content_key: "en.b1.unit10.lesson01.exercise05.write_goal", type: "writing_prompt", tested_text: "goal", prompt: {target_blocks: [{text: "Write the word for something you want to achieve.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit10.lesson02.purpose_clauses"
        title: "I study in order to improve"
        spine_outcome_id: "universal.b1.purpose.express_purpose_and_goals"
        teaching:
          - {content_key: "en.b1.unit10.lesson02.teach.evening_class", kind: "phrase", target: {text: "I am taking an evening class in order to improve my English.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "am", "taking", "an", "evening", "class", "in", "order", "to", "improve", "my", "English"], media_asset_key: "en.b1.audio.purpose.sentence.01"}
          - {content_key: "en.b1.unit10.lesson02.teach.study_so_that", kind: "phrase", target: {text: "I study every night so that I can remember more vocabulary.", language_code: "en", direction: "ltr"}, introduced_tokens: ["study", "every", "night", "so", "that", "can", "remember", "more", "vocabulary"]}
          - {content_key: "en.b1.unit10.lesson02.teach.grammar_purpose", kind: "grammar_note", target: {text: "Use in order to before a verb. Use so that before a full clause: I study so that I can remember more.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Use", "before", "verb", "full", "clause"]}
        exercises:
          - {content_key: "en.b1.unit10.lesson02.exercise01.choose_in_order_to", type: "multiple_choice", tested_text: "I am taking an evening class in order to improve my English.", prompt: {target_blocks: [{text: "Which sentence explains the purpose of taking an evening class?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson02.exercise02.choose_so_that", type: "multiple_choice", tested_text: "I study every night so that I can remember more vocabulary.", prompt: {target_blocks: [{text: "Which sentence uses \"so that\" before a full clause?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson02.exercise03.order_evening_class", type: "word_order", tested_text: "I am taking an evening class in order to improve my English", prompt: {target_blocks: []}, word_bank: ["am", "taking", "an", "evening", "class", "in", "order", "to", "improve", "my", "English", "I"]}
          - {content_key: "en.b1.unit10.lesson02.exercise04.reply_why_class", type: "dialogue_response", tested_text: "I am taking an evening class in order to improve my English", prompt: {target_blocks: [{text: "Are you taking an evening class to improve your English?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson02.exercise05.write_so_that", type: "writing_prompt", tested_text: "I study every night so that I can remember more vocabulary.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit10.lesson03.reading_clear_goals"
        title: "Reading: clear goals"
        spine_outcome_id: "universal.b1.purpose.express_purpose_and_goals"
        teaching:
          - {content_key: "en.b1.unit10.lesson03.teach.design_course", kind: "vocabulary", target: {text: "design course", language_code: "en", direction: "ltr"}, introduced_tokens: ["design", "course"], example: {text: "Leila is saving money for a design course.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit10.lesson03.teach.clear_goal", kind: "vocabulary", target: {text: "clear goal", language_code: "en", direction: "ltr"}, introduced_tokens: ["clear", "A", "helps", "you", "choose", "what", "do", "next"], example: {text: "A clear goal helps you choose what to do next.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit10.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Daniel and Leila both have clear goals. Daniel is taking an evening class in order to improve his English for work. He practices writing short updates so that he can sound more professional. Leila is saving money so that she can take a design course next year. She reads course descriptions in order to choose the right program.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Daniel", "Leila", "both", "have", "clear", "goals", "he", "his", "work", "practices", "writing", "short", "updates", "sound", "professional", "she", "next", "year", "reads", "descriptions", "choose", "right", "program"]
        exercises:
          - {content_key: "en.b1.unit10.lesson03.exercise01.comprehend_daniel_goal", type: "reading_comprehension", tested_text: "to improve his English for work", prompt: {target_blocks: [{text: "Why is Daniel taking an evening class?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson03.exercise02.comprehend_leila_goal", type: "reading_comprehension", tested_text: "so that she can take a design course next year", prompt: {target_blocks: [{text: "Why is Leila saving money?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson03.exercise03.recognize_design_course", type: "multiple_choice", tested_text: "design course", prompt: {target_blocks: [{text: "Which phrase means a class about planning how things look and work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson03.exercise04.order_practices_writing", type: "word_order", tested_text: "He practices writing updates so that he can sound more professional", prompt: {target_blocks: []}, word_bank: ["practices", "writing", "updates", "so", "that", "he", "can", "sound", "more", "professional", "He"]}
          - {content_key: "en.b1.unit10.lesson03.exercise05.write_clear_goal", type: "writing_prompt", tested_text: "A clear goal helps you choose what to do next.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit10.lesson04.the_goals_dialogue"
        title: "So that I can remember more"
        spine_outcome_id: "universal.b1.purpose.express_purpose_and_goals"
        teaching:
          - {content_key: "en.b1.unit10.lesson04.teach.q_why_evening_class", kind: "dialogue", target: {text: "Daniel, why are you taking an evening class?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Daniel", "why", "are", "you", "taking", "evening", "class"], media_asset_key: "en.b1.audio.dialogue.purpose.01"}
          - {content_key: "en.b1.unit10.lesson04.teach.a_improve_english", kind: "dialogue", target: {text: "I'm taking it in order to improve my English for work.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["I'm", "taking", "it", "in", "order", "to", "improve", "English", "work"]}
          - {content_key: "en.b1.unit10.lesson04.teach.q_studying_every_night", kind: "dialogue", target: {text: "That makes sense. Are you studying every night?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["That", "makes", "sense", "studying", "every", "night"]}
          - {content_key: "en.b1.unit10.lesson04.teach.a_remember_vocabulary", kind: "dialogue", target: {text: "I study for thirty minutes so that I can remember more vocabulary.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["study", "for", "thirty", "minutes", "so", "that", "can", "remember", "more", "vocabulary"]}
          - {content_key: "en.b1.unit10.lesson04.teach.q_saving_money", kind: "dialogue", target: {text: "Good plan. I'm saving money so that I can take a design course next year.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Good", "plan", "saving", "money", "take", "design", "course", "next", "year"]}
          - {content_key: "en.b1.unit10.lesson04.teach.a_clear_goals", kind: "dialogue", target: {text: "Then we both have clear goals.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Then", "we", "both", "have", "clear", "goals"]}
        exercises:
          - {content_key: "en.b1.unit10.lesson04.exercise01.listen_why_class", type: "dialogue_comprehension", tested_text: "to improve my English for work", media_asset_key: "en.b1.audio.dialogue.purpose.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit10.lesson04.exercise02.listen_why_daniel_studies", type: "listen_select", tested_text: "so that I can remember more vocabulary", media_asset_key: "en.b1.audio.dialogue.purpose.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit10.lesson04.exercise03.choose_leila_goal", type: "multiple_choice", tested_text: "take a design course next year", prompt: {target_blocks: [{text: "What is Leila saving money for?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit10.lesson04.exercise04.order_saving_money", type: "word_order", tested_text: "I'm saving money so that I can take a design course", prompt: {target_blocks: []}, word_bank: ["saving", "money", "so", "that", "I", "can", "take", "a", "design", "course", "I'm"]}
          - content_key: "en.b1.unit10.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I'm taking it in order to improve my English for work"
            prompt: {target_blocks: [{text: "Daniel, why are you taking an evening class?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit10.lesson04.exercise06.speak_purpose_dialogue"
            type: "speak_response"
            tested_text: "I study for thirty minutes so that I can remember more vocabulary"
            prompt: {target_blocks: [{text: "Are you studying every night?", language_code: "en", direction: "ltr"}]}
