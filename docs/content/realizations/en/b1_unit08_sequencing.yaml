course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: sequencing two events with when, before, after, as soon as, and by the time across everyday routines and past narrative contexts."

media_assets:
  - {content_key: "en.b1.audio.sequencing.phrase.as_soon_as.01", language: "en", text: "as soon as", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.sequencing.sentence.01", language: "en", text: "As soon as I get home, I will call you.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.sequencing.01"
    language: "en"
    text: "Leila: Daniel, can you call me when you get home? Daniel: Sure. As soon as I get home, I will call you. Leila: Please check the mail before you go upstairs. Daniel: I will. After I check the mail, I will lock the front door. Leila: Great. By the time Mia arrives, everything should be ready. Daniel: Then we can start dinner when she gets here."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit08.sequencing"
    title: "Before, after, and as soon as"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.sequencing.describe_events_with_time_clauses"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit08.lesson01.sequencing_vocabulary"
        title: "Before, after, and by the time"
        spine_outcome_id: "universal.b1.sequencing.describe_events_with_time_clauses"
        teaching:
          - {content_key: "en.b1.unit08.lesson01.teach.before", kind: "vocabulary", target: {text: "before", language_code: "en", direction: "ltr"}, introduced_tokens: ["before"], example: {text: "Wash your hands before you cook.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit08.lesson01.teach.after", kind: "vocabulary", target: {text: "after", language_code: "en", direction: "ltr"}, introduced_tokens: ["after"], example: {text: "Call me after you finish work.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit08.lesson01.teach.as_soon_as", kind: "vocabulary", target: {text: "as soon as", language_code: "en", direction: "ltr"}, introduced_tokens: ["as", "soon"], example: {text: "As soon as I arrive, I will text you.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit08.lesson01.teach.by_the_time", kind: "vocabulary", target: {text: "by the time", language_code: "en", direction: "ltr"}, introduced_tokens: ["by", "the", "time"], example: {text: "By the time Mia arrives, dinner will be ready.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit08.lesson01.teach.check_in", kind: "vocabulary", target: {text: "check in", language_code: "en", direction: "ltr"}, introduced_tokens: ["check", "in"], example: {text: "Please check in when you reach the hotel.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit08.lesson01.teach.lock_up", kind: "vocabulary", target: {text: "lock up", language_code: "en", direction: "ltr"}, introduced_tokens: ["lock", "up"], example: {text: "I lock up before I leave the office.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit08.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "as soon as", media_asset_key: "en.b1.audio.sequencing.phrase.as_soon_as.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit08.lesson01.exercise02.choose_before_word", type: "multiple_choice", tested_text: "before", prompt: {target_blocks: [{text: "Which word means earlier than another event?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson01.exercise03.choose_lock_up_phrase", type: "multiple_choice", tested_text: "lock up", prompt: {target_blocks: [{text: "Which phrase means to close and secure a room or building?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson01.exercise04.match_sequencing_words", type: "matching_pairs", tested_text: "before after as soon as by the time lock up", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "before", right: "earlier than another event"}, {left: "after", right: "later than another event"}, {left: "as soon as", right: "immediately when something happens"}, {left: "by the time", right: "not later than the moment when something happens"}, {left: "lock up", right: "to close and secure a room or building"}]}
          - {content_key: "en.b1.unit08.lesson01.exercise05.write_after", type: "writing_prompt", tested_text: "after", prompt: {target_blocks: [{text: "Write the word that means later than another event.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit08.lesson02.present_and_future_sequences"
        title: "When I get home, I will call"
        spine_outcome_id: "universal.b1.sequencing.describe_events_with_time_clauses"
        teaching:
          - {content_key: "en.b1.unit08.lesson02.teach.as_soon_as_home", kind: "phrase", target: {text: "As soon as I get home, I will call you.", language_code: "en", direction: "ltr"}, introduced_tokens: ["As", "soon", "as", "I", "get", "home", "will", "call", "you"], media_asset_key: "en.b1.audio.sequencing.sentence.01"}
          - {content_key: "en.b1.unit08.lesson02.teach.before_upstairs", kind: "phrase", target: {text: "Before you go upstairs, please check the mail.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Before", "go", "upstairs", "please", "mail"]}
          - {content_key: "en.b1.unit08.lesson02.teach.grammar_future_time_clause", kind: "grammar_note", target: {text: "Use present tense in a future time clause: When I get home, I will call you.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Use", "present", "tense", "future", "clause"]}
        exercises:
          - {content_key: "en.b1.unit08.lesson02.exercise01.choose_as_soon_as", type: "multiple_choice", tested_text: "As soon as I get home, I will call you.", prompt: {target_blocks: [{text: "Which sentence says one action will happen immediately after another?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson02.exercise02.choose_before_sentence", type: "multiple_choice", tested_text: "Before you go upstairs, please check the mail.", prompt: {target_blocks: [{text: "Which sentence asks someone to do one thing first?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson02.exercise03.order_as_soon_as_home", type: "word_order", tested_text: "As soon as I get home I will call you", prompt: {target_blocks: []}, word_bank: ["soon", "as", "I", "get", "home", "I", "will", "call", "you", "As"]}
          - {content_key: "en.b1.unit08.lesson02.exercise04.reply_when_home", type: "dialogue_response", tested_text: "As soon as I get home I will call you", prompt: {target_blocks: [{text: "Can you call me when you get home?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson02.exercise05.write_before_upstairs", type: "writing_prompt", tested_text: "Before you go upstairs, please check the mail.", prompt: {target_blocks: [{text: "Write that before someone goes upstairs, they should check the mail.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit08.lesson03.reading_an_evening_routine"
        title: "Reading: the evening plan"
        spine_outcome_id: "universal.b1.sequencing.describe_events_with_time_clauses"
        teaching:
          - {content_key: "en.b1.unit08.lesson03.teach.front_door", kind: "vocabulary", target: {text: "front door", language_code: "en", direction: "ltr"}, introduced_tokens: ["front", "door", "Daniel", "locks", "he", "checks"], example: {text: "Daniel locks the front door after he checks the mail.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit08.lesson03.teach.ready", kind: "vocabulary", target: {text: "ready", language_code: "en", direction: "ltr"}, introduced_tokens: ["ready", "is"], example: {text: "By the time Mia arrives, dinner will be ready.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit08.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Daniel has a careful evening routine. When he gets home, he checks the mail first. After he checks the mail, he locks the front door. Before he starts dinner, he washes his hands and clears the table. By the time Mia arrives, the kitchen is ready and the food is warm.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Daniel", "has", "careful", "evening", "routine", "first", "starts", "dinner", "washes", "his", "hands", "clears", "table", "Mia", "arrives", "kitchen", "food", "warm"]
        exercises:
          - {content_key: "en.b1.unit08.lesson03.exercise01.comprehend_first_action", type: "reading_comprehension", tested_text: "he checks the mail first", prompt: {target_blocks: [{text: "What does Daniel do when he gets home?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson03.exercise02.comprehend_after_mail", type: "reading_comprehension", tested_text: "he locks the front door", prompt: {target_blocks: [{text: "What does Daniel do after he checks the mail?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson03.exercise03.recognize_ready", type: "multiple_choice", tested_text: "ready", prompt: {target_blocks: [{text: "Which word means prepared or available to use?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson03.exercise04.order_after_mail_lock_door", type: "word_order", tested_text: "After he checks the mail he locks the front door", prompt: {target_blocks: []}, word_bank: ["he", "checks", "the", "mail", "he", "locks", "the", "front", "door", "After"]}
          - {content_key: "en.b1.unit08.lesson03.exercise05.write_by_the_time", type: "writing_prompt", tested_text: "By the time Mia arrives, the kitchen is ready.", prompt: {target_blocks: [{text: "Write that by the time Mia arrives, the kitchen is ready.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit08.lesson04.the_evening_plan_dialogue"
        title: "As soon as I get home"
        spine_outcome_id: "universal.b1.sequencing.describe_events_with_time_clauses"
        teaching:
          - {content_key: "en.b1.unit08.lesson04.teach.q_call_when_home", kind: "dialogue", target: {text: "Daniel, can you call me when you get home?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Daniel", "can", "you", "call", "me", "when", "get", "home"], media_asset_key: "en.b1.audio.dialogue.sequencing.01"}
          - {content_key: "en.b1.unit08.lesson04.teach.a_as_soon_as_home", kind: "dialogue", target: {text: "Sure. As soon as I get home, I will call you.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Sure", "As", "soon", "as", "I", "will"]}
          - {content_key: "en.b1.unit08.lesson04.teach.q_check_mail", kind: "dialogue", target: {text: "Please check the mail before you go upstairs.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Please", "check", "mail", "before", "go", "upstairs"]}
          - {content_key: "en.b1.unit08.lesson04.teach.a_after_mail_lock", kind: "dialogue", target: {text: "I will. After I check the mail, I will lock the front door.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["After", "lock", "front", "door"]}
          - {content_key: "en.b1.unit08.lesson04.teach.q_by_the_time_mia", kind: "dialogue", target: {text: "Great. By the time Mia arrives, everything should be ready.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Great", "By", "time", "Mia", "arrives", "everything", "should", "be", "ready"]}
          - {content_key: "en.b1.unit08.lesson04.teach.a_start_dinner", kind: "dialogue", target: {text: "Then we can start dinner when she gets here.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Then", "we", "start", "dinner", "she", "gets", "here"]}
        exercises:
          - {content_key: "en.b1.unit08.lesson04.exercise01.listen_when_daniel_will_call", type: "dialogue_comprehension", tested_text: "As soon as I get home", media_asset_key: "en.b1.audio.dialogue.sequencing.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit08.lesson04.exercise02.listen_before_upstairs", type: "listen_select", tested_text: "check the mail", media_asset_key: "en.b1.audio.dialogue.sequencing.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit08.lesson04.exercise03.choose_after_mail", type: "multiple_choice", tested_text: "I will lock the front door", prompt: {target_blocks: [{text: "What will Daniel do after he checks the mail?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit08.lesson04.exercise04.order_when_she_gets_here", type: "word_order", tested_text: "We can start dinner when she gets here", prompt: {target_blocks: []}, word_bank: ["can", "start", "dinner", "when", "she", "gets", "here", "We"]}
          - content_key: "en.b1.unit08.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "As soon as I get home I will call you"
            prompt: {target_blocks: [{text: "Daniel, can you call me when you get home?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit08.lesson04.exercise06.speak_sequencing_dialogue"
            type: "speak_response"
            tested_text: "After I check the mail I will lock the front door"
            prompt: {target_blocks: [{text: "Please check the mail before you go upstairs.", language_code: "en", direction: "ltr"}]}
