course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Lodging check-in register is a simple, everyday spoken exchange between a guest and a front-desk receptionist: Do you have a reservation?, I have a reservation for two nights., Does the room have wifi?, What time is check-out?, Breakfast is included., Here's your key. Core vocabulary (hotel/room/reservation/wifi/breakfast/check-out) is deliberately generic to any short-term lodging (hotel, guesthouse, hostel), not a specific brand or booking-platform's terminology, since this unit's scope is a routine check-in exchange, not hospitality-industry jargon."

media_assets:
  - {content_key: "en.a1.audio.accommodation.words.wifi.01", language: "en", text: "wifi", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.accommodation.phrases.does_the_room_have_wifi.01", language: "en", text: "Does the room have wifi?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.accommodation.01"
    language: "en"
    text: "Mia: Hi, we have a reservation for two nights. Receptionist: Welcome! What's the name on the reservation? Leila: It's under my name, Leila. Receptionist: Perfect. Here's your key. Your room has two beds. Mia: Does the room have wifi? Receptionist: Yes, and breakfast is downstairs from seven to ten. Leila: Thank you! What time is check-out? Receptionist: Check-out is at eleven o'clock."
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

