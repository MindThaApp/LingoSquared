      - content_key: "en.a1.unit50.lesson04.a_weekend_at_the_guesthouse"
        title: "Reading: A weekend at the guesthouse"
        spine_outcome_id: "universal.a1.accommodation.check_into_lodging"
        teaching:
          - {content_key: "en.a1.unit50.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Weekend at the Guesthouse: Mia and Leila took a short trip to the mountains for the weekend. Mia loves taking photos, and Leila loves painting, so it was the perfect place to relax. When they arrived at the guesthouse, they told the receptionist they had a reservation for two nights, from November 14th to November 16th. The receptionist asked for the name on the reservation, and Leila said it was under her name. Their room had two beds and wifi, and breakfast was included every morning from seven to ten. Check-out was at eleven o'clock. Mia took many photos of the mountains, and Leila painted a small picture of the view from their window. Daniel stayed home that weekend and cooked dinner for himself, using a recipe from the cookbook he borrowed from the library. When Mia and Leila came back, they showed him their photos and the painting, and he loved them.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Weekend", "Guesthouse", "took", "short", "trip", "to", "mountains", "weekend", "loves", "taking", "photos", "painting", "so", "it", "was", "perfect", "place", "relax", "When", "they", "arrived", "guesthouse", "told", "receptionist", "had", "from", "November", "14th", "16th", "asked", "said", "her", "Their", "every", "morning", "many", "of", "painted", "small", "picture", "view", "window", "Daniel", "that", "stayed", "cooked", "dinner", "himself", "using", "recipe", "cookbook", "he", "borrowed", "library", "came", "back", "showed", "him", "loved", "them"]}
        exercises:
          - {content_key: "en.a1.unit50.lesson04.exercise01.reading_nights_stayed", type: "multiple_choice", tested_text: "two nights", prompt: {target_blocks: [{text: "According to the reading, how many nights did Mia and Leila stay at the guesthouse?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit50.lesson04.exercise02.reading_checkout_time", type: "multiple_choice", tested_text: "eleven o'clock", prompt: {target_blocks: [{text: "According to the reading, what time was check-out?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit50.lesson04.exercise03.reading_who_painted", type: "multiple_choice", tested_text: "Leila", prompt: {target_blocks: [{text: "According to the reading, who painted a picture of the view?", language_code: "en", direction: "ltr"}]}}
