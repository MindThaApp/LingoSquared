  notes: >-
    2026-07-12 fresh-context review (Claude Opus). Verified: concession grammar
    is correct and correctly distinguished (although/even though + full clause,
    despite + noun/-ing, however as a sentence-level adverb after a period);
    the grammar note matches what the exercises test; Mia/Leila/Daniel
    continuity holds against units 09-11 (Daniel's work reports, Leila's design
    course) with no contradictions; matching_pairs has 6 pairs with no
    duplicate left or right values; no YAML booleans or snake_case leaks;
    dialogue cards all use target.speaker with no Name:-in-text. Fixed 4
    defects: (1) lesson01.exercise04 matching left for *although* read
    "introduces a contrast within one sentence", which is equally true of
    *despite* and *even though* (§16 confusability) — now "…using a full
    clause inside one sentence"; (2) lesson02.exercise04's prompt asked "how
    does Daniel manage…" while the expected answer merely restates the
    despite-clause, and used *noise*, not introduced until lesson03 (§5) — now
    "What does Daniel do despite the distractions?"; (3) lesson03.exercise01
    asked "Why does Mia work from home…" while the passage gives TWO valid
    reasons ("because it is quiet and comfortable" AND "she gets more work
    done at home"), so the graded answer was one of two defensible ones — the
    prompt now targets the intended clause; (4) lesson03.exercise05 told the
    learner to write "both Mia and Leila agree…" while tested_text is "Both
    agree that flexibility is important." — a guaranteed false negative;
    prompt now matches the answer. LIMITATION: no X-to-en overlays exist for
    this unit yet, so distractors, accepted_answers and punctuation variants
    could not be machine-checked; the lesson04 listen_select on the full
    dialogue audio needs its overlay distractors checked against everything
    Leila says in that clip.

course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: expressing concession and contrast with although, even though, despite, and however, in the context of a friendly workplace debate."

media_assets:
  - {content_key: "en.b1.audio.concession.phrase.convince.01", language: "en", text: "convince", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.concession.sentence.01", language: "en", text: "Although the office is quiet, Mia prefers working from home.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.concession.01"
    language: "en"
    text: "Mia: Leila, although the office is nice, I get more work done at home. Leila: I understand, but despite the noise, I really enjoy talking to people during breaks. Mia: That is a valid point. However, I still think I focus better alone. Leila: Even though I prefer the office, I cannot convince you to change your mind, can I? Mia: Probably not! However, we can agree that flexibility matters most. Leila: Despite our different preferences, we finish everything on time."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit12.concession"
    title: "Although it's nice, I prefer home"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.opinions.debate_with_concession_and_nuance"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit12.lesson01.concession_vocabulary"
        title: "Although, despite, and however"
        spine_outcome_id: "universal.b1.opinions.debate_with_concession_and_nuance"
        teaching:
          - {content_key: "en.b1.unit12.lesson01.teach.although", kind: "vocabulary", target: {text: "although", language_code: "en", direction: "ltr"}, introduced_tokens: ["although"], example: {text: "Although the office is quiet, Mia prefers working from home.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit12.lesson01.teach.even_though", kind: "vocabulary", target: {text: "even though", language_code: "en", direction: "ltr"}, introduced_tokens: ["even", "though"], example: {text: "Leila stays focused even though her apartment is small.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit12.lesson01.teach.despite", kind: "vocabulary", target: {text: "despite", language_code: "en", direction: "ltr"}, introduced_tokens: ["despite", "distractions"], example: {text: "Despite the distractions, Daniel finishes his report on time.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit12.lesson01.teach.however", kind: "vocabulary", target: {text: "however", language_code: "en", direction: "ltr"}, introduced_tokens: ["however"], example: {text: "The office is quiet. However, Mia prefers working from home.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit12.lesson01.teach.valid_point", kind: "vocabulary", target: {text: "valid point", language_code: "en", direction: "ltr"}, introduced_tokens: ["valid", "point"], example: {text: "That is a valid point about focus.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit12.lesson01.teach.convince", kind: "vocabulary", target: {text: "convince", language_code: "en", direction: "ltr"}, introduced_tokens: ["convince"], example: {text: "Leila tried to convince Mia to come back to the office.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit12.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "convince", media_asset_key: "en.b1.audio.concession.phrase.convince.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit12.lesson01.exercise02.choose_despite", type: "multiple_choice", tested_text: "despite", prompt: {target_blocks: [{text: "Which word introduces a contrast using a noun or -ing form, not a full clause?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson01.exercise03.choose_however", type: "multiple_choice", tested_text: "however", prompt: {target_blocks: [{text: "Which word introduces a contrast as a separate sentence?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson01.exercise04.match_concession_words", type: "matching_pairs", tested_text: "although even though despite however valid point convince", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "although", right: "introduces a contrast using a full clause inside one sentence"}, {left: "even though", right: "emphasizes a stronger contrast than although"}, {left: "despite", right: "introduces a contrast using a noun or -ing form, not a full clause"}, {left: "however", right: "introduces a contrast as a separate sentence"}, {left: "valid point", right: "a reasonable point someone makes"}, {left: "convince", right: "to persuade someone to agree with you"}]}
          - {content_key: "en.b1.unit12.lesson01.exercise05.write_convince", type: "writing_prompt", tested_text: "convince", prompt: {target_blocks: [{text: "Write the word that means to persuade someone to agree with you.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit12.lesson02.concession_clauses"
        title: "Although, despite, and a full clause"
        spine_outcome_id: "universal.b1.opinions.debate_with_concession_and_nuance"
        teaching:
          - {content_key: "en.b1.unit12.lesson02.teach.office_quiet_home", kind: "phrase", target: {text: "Although the office is quiet, Mia prefers working from home.", language_code: "en", direction: "ltr"}, introduced_tokens: ["the", "office", "is", "quiet", "Mia", "prefers", "working", "from", "home"], media_asset_key: "en.b1.audio.concession.sentence.01"}
          - {content_key: "en.b1.unit12.lesson02.teach.distractions_report", kind: "phrase", target: {text: "Despite the distractions, Daniel finishes his report on time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "finishes", "his", "report", "on", "time"]}
          - {content_key: "en.b1.unit12.lesson02.teach.grammar_concession", kind: "grammar_note", target: {text: "Although and even though start a full clause: Although the office is quiet, Mia prefers home. Despite is followed by a noun or -ing form, not a clause: Despite the distractions, Daniel finishes his report. However starts a new sentence after a period or semicolon: The office is quiet. However, Mia prefers home.", language_code: "en", direction: "ltr"}, introduced_tokens: ["start", "full", "clause", "followed", "by", "noun", "form", "not", "starts", "new", "sentence", "after", "period", "semicolon"]}
        exercises:
          - {content_key: "en.b1.unit12.lesson02.exercise01.choose_although_clause", type: "multiple_choice", tested_text: "Although the office is quiet, Mia prefers working from home.", prompt: {target_blocks: [{text: "Which sentence uses although to introduce a full clause of contrast?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson02.exercise02.choose_despite_noun", type: "multiple_choice", tested_text: "Despite the distractions, Daniel finishes his report on time.", prompt: {target_blocks: [{text: "Which sentence uses despite before a noun phrase?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson02.exercise03.order_although_office", type: "word_order", tested_text: "Although the office is quiet Mia prefers working from home", prompt: {target_blocks: []}, word_bank: ["the", "office", "is", "quiet", "Mia", "prefers", "working", "from", "home", "Although"]}
          - {content_key: "en.b1.unit12.lesson02.exercise04.reply_why_finish_on_time", type: "dialogue_response", tested_text: "Despite the distractions Daniel finishes his report on time", prompt: {target_blocks: [{text: "What does Daniel do despite the distractions?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson02.exercise05.write_despite_report", type: "writing_prompt", tested_text: "Despite the distractions, Daniel finishes his report on time.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit12.lesson03.reading_where_to_work"
        title: "Reading: where to work"
        spine_outcome_id: "universal.b1.opinions.debate_with_concession_and_nuance"
        teaching:
          - {content_key: "en.b1.unit12.lesson03.teach.flexibility", kind: "vocabulary", target: {text: "flexibility", language_code: "en", direction: "ltr"}, introduced_tokens: ["flexibility"], example: {text: "Both Mia and Leila agree that flexibility is important.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit12.lesson03.teach.teamwork", kind: "vocabulary", target: {text: "teamwork", language_code: "en", direction: "ltr"}, introduced_tokens: ["teamwork", "builds"], example: {text: "Leila thinks the office builds better teamwork.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit12.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Mia and Leila disagree about where to work. Mia works from home because it is quiet and comfortable. Although she misses seeing her coworkers, she gets more work done at home. Leila prefers the office. Despite the noise, she likes talking to colleagues during breaks. Even though Mia makes a valid point about focus, Leila still thinks the office builds better teamwork. However, both agree that flexibility is important.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["disagree", "about", "where", "to", "work", "because", "it", "comfortable", "she", "misses", "seeing", "her", "coworkers", "gets", "more", "done", "at", "likes", "talking", "colleagues", "during", "breaks", "noise", "makes", "still", "thinks", "both", "agree", "that", "important", "better"]
        exercises:
          - {content_key: "en.b1.unit12.lesson03.exercise01.comprehend_mia_home", type: "reading_comprehension", tested_text: "she gets more work done at home", prompt: {target_blocks: [{text: "Although Mia misses seeing her coworkers, what does she get done at home?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson03.exercise02.comprehend_leila_teamwork", type: "reading_comprehension", tested_text: "the office builds better teamwork", prompt: {target_blocks: [{text: "Why does Leila still prefer the office, even though Mia makes a valid point about focus?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson03.exercise03.recognize_flexibility", type: "multiple_choice", tested_text: "flexibility", prompt: {target_blocks: [{text: "Which word means the ability to change plans or a working style easily?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson03.exercise04.order_despite_noise", type: "word_order", tested_text: "Despite the noise she likes talking to colleagues during breaks", prompt: {target_blocks: []}, word_bank: ["the", "noise", "she", "likes", "talking", "to", "colleagues", "during", "breaks", "Despite"]}
          - {content_key: "en.b1.unit12.lesson03.exercise05.write_flexibility_important", type: "writing_prompt", tested_text: "Both agree that flexibility is important.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit12.lesson04.the_workplace_debate_dialogue"
        title: "That's a valid point, however..."
        spine_outcome_id: "universal.b1.opinions.debate_with_concession_and_nuance"
        teaching:
          - {content_key: "en.b1.unit12.lesson04.teach.q_although_nice_home", kind: "dialogue", target: {text: "Leila, although the office is nice, I get more work done at home.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Leila", "although", "nice", "I", "get", "more", "work", "done", "at", "home"], media_asset_key: "en.b1.audio.dialogue.concession.01"}
          - {content_key: "en.b1.unit12.lesson04.teach.a_despite_noise_breaks", kind: "dialogue", target: {text: "I understand, but despite the noise, I really enjoy talking to people during breaks.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["understand", "but", "despite", "noise", "really", "enjoy", "talking", "people", "during", "breaks"]}
          - {content_key: "en.b1.unit12.lesson04.teach.q_valid_point_however", kind: "dialogue", target: {text: "That is a valid point. However, I still think I focus better alone.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["That", "a", "valid", "point", "However", "still", "think", "focus", "better", "alone"]}
          - {content_key: "en.b1.unit12.lesson04.teach.a_even_though_convince", kind: "dialogue", target: {text: "Even though I prefer the office, I cannot convince you to change your mind, can I?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Even", "though", "prefer", "cannot", "convince", "change", "your", "mind", "can"]}
          - {content_key: "en.b1.unit12.lesson04.teach.q_however_flexibility", kind: "dialogue", target: {text: "Probably not! However, we can agree that flexibility matters most.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Probably", "not", "we", "agree", "flexibility", "matters", "most"]}
          - {content_key: "en.b1.unit12.lesson04.teach.a_despite_preferences_time", kind: "dialogue", target: {text: "Despite our different preferences, we finish everything on time.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["our", "different", "preferences", "finish", "everything", "on", "time"]}
        exercises:
          - {content_key: "en.b1.unit12.lesson04.exercise01.listen_mia_opinion", type: "dialogue_comprehension", tested_text: "I get more work done at home", media_asset_key: "en.b1.audio.dialogue.concession.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit12.lesson04.exercise02.listen_why_leila_likes_office", type: "listen_select", tested_text: "I really enjoy talking to people during breaks", media_asset_key: "en.b1.audio.dialogue.concession.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit12.lesson04.exercise03.choose_what_they_agree_on", type: "multiple_choice", tested_text: "flexibility matters most", prompt: {target_blocks: [{text: "What do Mia and Leila finally agree matters most?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit12.lesson04.exercise04.order_despite_preferences", type: "word_order", tested_text: "Despite our different preferences we finish everything on time", prompt: {target_blocks: []}, word_bank: ["our", "different", "preferences", "we", "finish", "everything", "on", "time", "Despite"]}
          - content_key: "en.b1.unit12.lesson04.exercise05.reply_as_mia"
            type: "dialogue_response"
            tested_text: "That is a valid point However I still think I focus better alone"
            prompt: {target_blocks: [{text: "I understand, but despite the noise, I really enjoy talking to people during breaks.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit12.lesson04.exercise06.speak_concession_dialogue"
            type: "speak_response"
            tested_text: "Despite our different preferences we finish everything on time"
            prompt: {target_blocks: [{text: "Probably not! However, we can agree that flexibility matters most.", language_code: "en", direction: "ltr"}]}
