schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    No public-domain source material was consulted: AUTHORING_GUIDE §10's
    verified PD map covers the LEARNER-side languages, not
    English-as-target A2 civil-registration material, and firecrawl was
    not used this session. Authored from established ESL A2 conventions
    against universal.a2.bureaucracy.register_with_authorities, whose
    can_do covers understanding "what is required" at an official
    appointment. Continuous with a2_unit25_bureaucracy per §11 (the same
    registration-office setting and formal register) but a different
    task: unit25 books and attends the registration appointment; this
    unit deals with an error on the certificate that appointment
    produced.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Second of 6 new A2 units (unit35-unit40) authored 2026-07-22 to close
    the publish-gate teaching-hours gap on the shared English
    realization. Spine outcome REUSED from a2_unit25_bureaucracy (see
    a2_unit35_prescription's review note for why reuse rather than new
    spine outcomes). Scenario is new: a misspelled last name on a
    registration certificate, asking for it to be corrected, and reading
    the correction notice. Character canon checked before writing
    (AUTHORING_PREFLIGHT §6): Leila has online classes on Mondays and
    Wednesdays, studies at the library, meets friends for coffee on
    Fridays and visits her parents at the weekend (a2_unit33); nothing
    here contradicts that, and no new biographical fact is pinned to her
    beyond "her registered last name was misspelled". The Clerk is the
    same unnamed role speaker a2_unit25 uses for the registration office.
    Every exercise's tested_text is covered by this file's own or the A2
    chain's earlier introduced_tokens. PENDING a fresh-context review per
    AUTHORING_GUIDE §9.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked against the nl-en overlay: answer keys,
    listen_select/dialogue_response distractors absent from audio, speaker
    attribution vs audio, character canon (Daniel weekdays, unit29 repair
    6180/kitchen sink/2pm-4pm, Mia at Bright Path Marketing, Leila units
    33-34), course-wide vocabulary coverage of matching_pairs tested_text,
    YAML boolean quoting, no internal jargon. No fixes applied in this
    file. DEFERRED: en.a2.unit36.lesson04.teach.a_within_five_working_days
    (and the same Clerk line in media asset
    en.a2.audio.dialogue.document_correction.01) ends with "Please bring
    your passport and this notice to the office.", a sentence lifted from
    the lesson 3 written notice that does not fit the counter dialogue (no
    notice exists in the scene); fix is to cut it to "Within five working
    days." in card + audio text, but the fa-en and prs-en a2_unit36
    glosses repeat that sentence in Persian/Dari and must change in the
    same edit, so the whole fix is deferred to keep all four directions
    consistent (files: this file, overlays nl-en/fa-en/prs-en
    a2_unit36.yaml). NATIVE FLAGS:
    lesson02.exercise02.choose_report_mistake distractor "My last name is
    spelled wrong." arguably also reports the certificate wrong (prompt's
    "formally" probably separates them); lesson01.exercise04 matching
    gloss for document ("any official paper with information on it") also
    fits certificate (solvable by elimination).

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at the formal official-counter register a2_unit25 established (Could you...?, Would it be possible to...?), plus there is / there are for stating what is wrong."

media_assets:
  - {content_key: "en.a2.audio.document_correction.words.certificate.01", language: "en", text: "certificate", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.document_correction.question.01", language: "en", text: "My last name is spelled wrong.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.document_correction.description.01", language: "en", text: "Correction request received. Your registration certificate will be corrected within five working days. Please bring your passport and this notice to the office. Reference number 3092.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.document_correction.01"
    language: "en"
    text: "Leila: Hello, there is a mistake on my registration certificate. Clerk: I see. What is wrong with it? Leila: My last name is spelled wrong. Could you correct it, please? Clerk: Of course. Do you have your passport with you? Leila: Yes, here it is. Clerk: Thank you. I will make a copy and send the correction today. Leila: How long will the correction take? Clerk: Within five working days. Please bring your passport and this notice to the office. Leila: Thank you very much."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit36.document_correction"
    title: "Correcting a mistake on an official document"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.bureaucracy.register_with_authorities"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit36.lesson01.document_vocabulary"
        title: "Certificates, mistakes, and copies"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit36.lesson01.teach.certificate", kind: "vocabulary", target: {text: "certificate", language_code: "en", direction: "ltr"}, introduced_tokens: ["certificate"], example: {text: "My registration certificate arrived two weeks after the appointment.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit36.lesson01.teach.mistake", kind: "vocabulary", target: {text: "mistake", language_code: "en", direction: "ltr"}, introduced_tokens: ["mistake"], example: {text: "There is a mistake in my address on this form.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit36.lesson01.teach.spelled", kind: "vocabulary", target: {text: "spelled", language_code: "en", direction: "ltr"}, introduced_tokens: ["spelled"], example: {text: "My name is spelled with one L, not two.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit36.lesson01.teach.correct", kind: "vocabulary", target: {text: "correct", language_code: "en", direction: "ltr"}, introduced_tokens: ["correct"], example: {text: "The clerk can correct my last name today.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit36.lesson01.teach.copy", kind: "vocabulary", target: {text: "copy", language_code: "en", direction: "ltr"}, introduced_tokens: ["copy"], example: {text: "The office keeps a copy of every document.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit36.lesson01.teach.passport", kind: "vocabulary", target: {text: "passport", language_code: "en", direction: "ltr"}, introduced_tokens: ["passport"], example: {text: "I always bring my passport to an official appointment.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit36.lesson01.teach.grammar_there_is_there_are", kind: "grammar_note", target: {text: "There is a mistake on my certificate. There are two mistakes on my certificate.", language_code: "en", direction: "ltr"}, introduced_tokens: ["There", "is", "a", "mistake", "on", "my", "certificate", "are", "two", "mistakes"]}
        exercises:
          - {content_key: "en.a2.unit36.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "certificate", media_asset_key: "en.a2.audio.document_correction.words.certificate.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit36.lesson01.exercise02.choose_mistake_word", type: "multiple_choice", tested_text: "mistake", prompt: {target_blocks: [{text: "Which word means something that is written wrong?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson01.exercise03.choose_copy_word", type: "multiple_choice", tested_text: "copy", prompt: {target_blocks: [{text: "Which word means a second, identical version of a document?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit36.lesson01.exercise04.match_document_words"
            type: "matching_pairs"
            tested_text: "certificate mistake spelled correct copy passport document form"
            prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}
            pairs:
              - {left: "certificate", right: "the official paper the office gives you"}
              - {left: "mistake", right: "something that is written wrong"}
              - {left: "spelled", right: "written with these letters, in this order"}
              - {left: "correct", right: "to change something wrong into something right"}
              - {left: "copy", right: "a second, identical version of a document"}
              - {left: "passport", right: "the travel document with your photo in it"}
              - {left: "document", right: "any official paper with information on it"}
              - {left: "form", right: "the paper you fill in with your details"}
          - {content_key: "en.a2.unit36.lesson01.exercise05.write_certificate", type: "writing_prompt", tested_text: "certificate", prompt: {target_blocks: [{text: "Write the word for the official paper the office gives you.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit36.lesson02.asking_for_a_correction"
        title: "Asking for a correction"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit36.lesson02.teach.there_is_a_mistake", kind: "phrase", target: {text: "There is a mistake on my registration certificate.", language_code: "en", direction: "ltr"}, introduced_tokens: ["There", "is", "a", "mistake", "on", "my", "registration", "certificate"]}
          - {content_key: "en.a2.unit36.lesson02.teach.name_spelled_wrong", kind: "phrase", target: {text: "My last name is spelled wrong.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "last", "name", "is", "spelled", "wrong"]}
          - {content_key: "en.a2.unit36.lesson02.teach.could_you_correct_it", kind: "phrase", target: {text: "Could you correct it, please?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Could", "you", "correct", "it", "please"]}
          - {content_key: "en.a2.unit36.lesson02.teach.how_long_correction", kind: "phrase", target: {text: "How long will the correction take?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "long", "will", "the", "correction", "take"]}
          - {content_key: "en.a2.unit36.lesson02.teach.grammar_polite_request", kind: "grammar_note", target: {text: "Could you correct it, please? Would it be possible to get a new certificate?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Would", "be", "possible", "to", "get", "new"]}
        exercises:
          - {content_key: "en.a2.unit36.lesson02.exercise01.listen_problem", type: "listen_select", tested_text: "My last name is spelled wrong", media_asset_key: "en.a2.audio.document_correction.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit36.lesson02.exercise02.choose_report_mistake", type: "multiple_choice", tested_text: "There is a mistake on my registration certificate.", prompt: {target_blocks: [{text: "You are at the registration office. How do you say, formally, that your certificate is wrong?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson02.exercise03.choose_ask_how_long", type: "multiple_choice", tested_text: "How long will the correction take?", prompt: {target_blocks: [{text: "The clerk agrees to change it. You want to know how much time it needs. What do you ask?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson02.exercise04.order_name_spelled_wrong", type: "word_order", tested_text: "My last name is spelled wrong", prompt: {target_blocks: []}, word_bank: ["last", "name", "is", "spelled", "wrong", "My"]}
          - {content_key: "en.a2.unit36.lesson02.exercise05.order_could_you_correct_it", type: "word_order", tested_text: "Could you correct it please", prompt: {target_blocks: []}, word_bank: ["you", "correct", "it", "please", "Could"]}
          - {content_key: "en.a2.unit36.lesson02.exercise06.reply_ask_how_long", type: "dialogue_response", tested_text: "How long will the correction take", prompt: {target_blocks: [{text: "I will make a copy and send the correction today.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson02.exercise07.write_there_is_a_mistake", type: "writing_prompt", tested_text: "There is a mistake on my registration certificate.", prompt: {target_blocks: []}}

      - content_key: "en.a2.unit36.lesson03.reading_a_correction_notice"
        title: "Reading a correction notice"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit36.lesson03.teach.working_days", kind: "vocabulary", target: {text: "working days", language_code: "en", direction: "ltr"}, introduced_tokens: ["working", "days"], example: {text: "The office answers every letter within five working days.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit36.lesson03.teach.notice_text", kind: "reading", target: {text: "Correction request received. Your registration certificate will be corrected within five working days. Please bring your passport and this notice to the office. Reference number 3092.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Correction", "request", "received", "Your", "registration", "certificate", "will", "be", "corrected", "within", "five", "working", "days", "Please", "bring", "your", "passport", "and", "this", "notice", "to", "the", "office", "Reference", "number", "3092"]}
          - {content_key: "en.a2.unit36.lesson03.teach.bring_passport_and_notice", kind: "phrase", target: {text: "Please bring your passport and this notice to the office.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Please", "bring", "your", "passport", "and", "this", "notice", "to", "the", "office"]}
        exercises:
          - {content_key: "en.a2.unit36.lesson03.exercise01.read_how_long", type: "reading_comprehension", tested_text: "within five working days", prompt: {target_blocks: [{text: "How long will the correction take, according to the notice?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson03.exercise02.read_what_to_bring", type: "reading_comprehension", tested_text: "your passport and this notice", prompt: {target_blocks: [{text: "What does the notice ask you to bring to the office?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson03.exercise03.read_reference_number", type: "reading_comprehension", tested_text: "3092", prompt: {target_blocks: [{text: "What is the reference number on the notice?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson03.exercise04.choose_true_statement", type: "multiple_choice", tested_text: "Correction request received", prompt: {target_blocks: [{text: "Which statement is true according to the notice?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson03.exercise05.order_bring_passport", type: "word_order", tested_text: "Please bring your passport and this notice to the office", prompt: {target_blocks: []}, word_bank: ["bring", "your", "passport", "and", "this", "notice", "to", "the", "office", "Please"]}
          - {content_key: "en.a2.unit36.lesson03.exercise06.write_corrected_within_five_days", type: "writing_prompt", tested_text: "Your registration certificate will be corrected within five working days.", prompt: {target_blocks: [{text: "Write the notice's sentence about when the certificate will be corrected.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit36.lesson04.correction_dialogue"
        title: "At the registration office"
        spine_outcome_id: "universal.a2.bureaucracy.register_with_authorities"
        teaching:
          - {content_key: "en.a2.unit36.lesson04.teach.q_there_is_a_mistake", kind: "dialogue", target: {text: "Hello, there is a mistake on my registration certificate.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hello"]}
          - {content_key: "en.a2.unit36.lesson04.teach.a_what_is_wrong", kind: "dialogue", target: {text: "I see. What is wrong with it?", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["I", "see", "What", "wrong", "with"]}
          - {content_key: "en.a2.unit36.lesson04.teach.q_name_spelled_wrong", kind: "dialogue", target: {text: "My last name is spelled wrong. Could you correct it, please?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit36.lesson04.teach.a_do_you_have_passport", kind: "dialogue", target: {text: "Of course. Do you have your passport with you?", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["Of", "course", "Do", "have"]}
          - {content_key: "en.a2.unit36.lesson04.teach.q_here_it_is", kind: "dialogue", target: {text: "Yes, here it is.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "here"]}
          - {content_key: "en.a2.unit36.lesson04.teach.a_copy_and_send", kind: "dialogue", target: {text: "Thank you. I will make a copy and send the correction today.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["Thank", "make", "send", "today"]}
          - {content_key: "en.a2.unit36.lesson04.teach.q_how_long", kind: "dialogue", target: {text: "How long will the correction take?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit36.lesson04.teach.a_within_five_working_days", kind: "dialogue", target: {text: "Within five working days. Please bring your passport and this notice to the office.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["Within"]}
          - {content_key: "en.a2.unit36.lesson04.teach.q_thank_you", kind: "dialogue", target: {text: "Thank you very much.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["very", "much"]}
        exercises:
          - {content_key: "en.a2.unit36.lesson04.exercise01.listen_the_problem", type: "dialogue_comprehension", tested_text: "My last name is spelled wrong", media_asset_key: "en.a2.audio.dialogue.document_correction.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit36.lesson04.exercise02.listen_how_long", type: "listen_select", tested_text: "Within five working days", media_asset_key: "en.a2.audio.dialogue.document_correction.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit36.lesson04.exercise03.choose_what_clerk_does", type: "multiple_choice", tested_text: "make a copy", prompt: {target_blocks: [{text: "What does the clerk do with Leila's passport?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit36.lesson04.exercise04.order_how_long_correction", type: "word_order", tested_text: "How long will the correction take", prompt: {target_blocks: []}, word_bank: ["long", "will", "the", "correction", "take", "How"]}
          - {content_key: "en.a2.unit36.lesson04.exercise05.reply_here_it_is", type: "dialogue_response", tested_text: "Yes here it is", prompt: {target_blocks: [{text: "Of course. Do you have your passport with you?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit36.lesson04.exercise06.speak_correction_dialogue"
            type: "speak_response"
            tested_text: "There is a mistake on my registration certificate. My last name is spelled wrong. Could you correct it, please?"
            prompt: {target_blocks: [{text: "You are Leila at the registration office.", language_code: "en", direction: "ltr"}]}
