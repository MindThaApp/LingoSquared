course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English with common spoken contractions."

media_assets:
  - {content_key: "en.a1.audio.whats_your_name.01", language: "en", text: "What's your name?", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.identity_profiles.01", language: "en", text: "I am a student. Are you a teacher? Yes, I am. Are you a new member? No, I'm a student.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.library.01"
    language: "en"
    text: "Daniel: Good afternoon. I'm Daniel. I work at the library. What's your name? Leila: Hi. I'm Leila. I'm a student. Nice to meet you. Daniel: Nice to meet you too. Are you a new member? Leila: Yes, I am. Daniel: Welcome to the library. Leila: Thank you."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit02.introductions"
    title: "Names and basic identity"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.introductions.exchange_identity"
    planned_lesson_count: 3
    lessons:
      - content_key: "en.a1.unit02.lesson01.exchange_names"
        title: "Ask for and give a name"
        spine_outcome_id: "universal.a1.introductions.exchange_identity"
        teaching:
          - {content_key: "en.a1.unit02.lesson01.teach.whats_your_name", kind: "phrase", target: {text: "What's your name?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "is", "What's", "your", "name"]}
          - {content_key: "en.a1.unit02.lesson01.teach.my_name_is", kind: "phrase", target: {text: "My name is Leila.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "name", "is", "Leila"]}
          - {content_key: "en.a1.unit02.lesson01.teach.im_leila", kind: "phrase", target: {text: "I'm Leila.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "Leila"]}
          - {content_key: "en.a1.unit02.lesson01.teach.nice_to_meet_you", kind: "phrase", target: {text: "Nice to meet you.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Nice", "to", "meet", "you"]}
        exercises:
          - {content_key: "en.a1.unit02.lesson01.exercise01.listen_name_question", type: "listen_select", tested_text: "What is your name", media_asset_key: "en.a1.audio.whats_your_name.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit02.lesson01.exercise02.choose_name_answer"
            type: "multiple_choice"
            tested_text: "My name is Leila"
            prompt: {target_blocks: [{text: "What's your name?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit02.lesson01.exercise03.order_name", type: "word_order", tested_text: "My name is Leila", prompt: {target_blocks: []}, word_bank: ["Leila", "is", "name", "My"]}
          - content_key: "en.a1.unit02.lesson01.exercise04.reply_name"
            type: "dialogue_response"
            tested_text: "What's your name I'm Leila"
            prompt: {target_blocks: [{text: "What's your name?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit02.lesson01.exercise05.write_intro", type: "writing_prompt", tested_text: "My name is Leila", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit02.lesson02.exchange_roles"
        title: "Ask for and give a role or membership"
        spine_outcome_id: "universal.a1.introductions.exchange_identity"
        teaching:
          - {content_key: "en.a1.unit02.lesson02.teach.i_am_student", kind: "phrase", target: {text: "I am a student.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "am", "a", "student"]}
          - {content_key: "en.a1.unit02.lesson02.teach.are_you_teacher", kind: "phrase", target: {text: "Are you a teacher?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Are", "you", "a", "teacher"]}
          - {content_key: "en.a1.unit02.lesson02.teach.yes_i_am", kind: "phrase", target: {text: "Yes, I am.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Yes", "I", "am"]}
          - {content_key: "en.a1.unit02.lesson02.teach.no_im_student", kind: "phrase", target: {text: "No, I'm a student.", language_code: "en", direction: "ltr"}, introduced_tokens: ["No", "I'm", "a", "student"]}
          - {content_key: "en.a1.unit02.lesson02.teach.are_you_member", kind: "phrase", target: {text: "Are you a new member?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Are", "you", "a", "new", "member"]}
          - {content_key: "en.a1.unit02.lesson02.teach.he_is_teacher", kind: "phrase", target: {text: "He is a teacher.", language_code: "en", direction: "ltr"}, introduced_tokens: ["He", "is", "a", "teacher"]}
          - {content_key: "en.a1.unit02.lesson02.teach.she_is_engineer", kind: "phrase", target: {text: "She is an engineer.", language_code: "en", direction: "ltr"}, introduced_tokens: ["She", "is", "an", "engineer"]}
        exercises:
          - content_key: "en.a1.unit02.lesson02.exercise01.choose_i"
            type: "multiple_choice"
            tested_text: "I am a student"
            prompt: {target_blocks: [{text: "_ am a student.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit02.lesson02.exercise02.choose_role_question"
            type: "multiple_choice"
            tested_text: "Are you a teacher"
            prompt: {target_blocks: [{text: "Ask the other person about their role.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit02.lesson02.exercise03.choose_he"
            type: "multiple_choice"
            tested_text: "He is a teacher"
            prompt: {target_blocks: [{text: "Omid is a man. _ is a teacher.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit02.lesson02.exercise04.choose_she"
            type: "multiple_choice"
            tested_text: "She is an engineer"
            prompt: {target_blocks: [{text: "Leila is a woman. _ is an engineer.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit02.lesson02.exercise05.order_member", type: "word_order", tested_text: "Are you a new member", prompt: {target_blocks: []}, word_bank: ["member", "new", "a", "you", "Are"]}
          - content_key: "en.a1.unit02.lesson02.exercise06.reply_teacher"
            type: "dialogue_response"
            tested_text: "Are you a teacher No I'm a student"
            prompt: {target_blocks: [{text: "Are you a teacher?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit02.lesson02.exercise07.write_identity", type: "writing_prompt", tested_text: "I am a student", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit02.lesson03.library_dialogue"
        title: "Exchange names, roles, and membership at a library"
        spine_outcome_id: "universal.a1.introductions.exchange_identity"
        teaching:
          - {content_key: "en.a1.unit02.lesson03.teach.library", kind: "vocabulary", target: {text: "library", language_code: "en", direction: "ltr"}, introduced_tokens: ["library"], example: {text: "I'm at the library.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit02.lesson03.teach.library_assistant", kind: "phrase", target: {text: "library assistant", language_code: "en", direction: "ltr"}, introduced_tokens: ["library", "assistant"]}
          - {content_key: "en.a1.unit02.lesson03.teach.opening", kind: "dialogue", target: {text: "Daniel: Good afternoon. I'm Daniel.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "Good", "afternoon", "I'm"]}
          - {content_key: "en.a1.unit02.lesson03.teach.request", kind: "dialogue", target: {text: "Daniel: What's your name?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "What's", "your", "name"]}
          - {content_key: "en.a1.unit02.lesson03.teach.names", kind: "dialogue", target: {text: "Leila: Hi. I'm Leila. I'm a student. Nice to meet you.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Leila", "Hi", "I'm", "a", "student", "Nice", "to", "meet", "you"]}
          - {content_key: "en.a1.unit02.lesson03.teach.room_and_member", kind: "dialogue", target: {text: "Daniel: Nice to meet you too. Are you a new member? Leila: Yes, I am.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "Nice", "to", "meet", "you", "too", "Are", "a", "new", "member", "Leila", "Yes", "I", "am"]}
          - {content_key: "en.a1.unit02.lesson03.teach.role", kind: "dialogue", target: {text: "Daniel: I work at the library.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "I", "work", "at", "the", "library"]}
          - {content_key: "en.a1.unit02.lesson03.teach.closing", kind: "dialogue", target: {text: "Daniel: Welcome to the library. Leila: Thank you.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "Welcome", "to", "the", "library", "Leila", "Thank", "you"]}
        exercises:
          - {content_key: "en.a1.unit02.lesson03.exercise01.listen_names", type: "dialogue_comprehension", tested_text: "Daniel Leila", media_asset_key: "en.a1.audio.dialogue.library.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit02.lesson03.exercise02.listen_role", type: "listen_select", tested_text: "I work at the library", media_asset_key: "en.a1.audio.dialogue.library.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit02.lesson03.exercise03.choose_name_question"
            type: "multiple_choice"
            tested_text: "What's your name"
            prompt: {target_blocks: [{text: "Ask Leila for her name.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit02.lesson03.exercise04.order_member_question", type: "word_order", tested_text: "Are you a new member", prompt: {target_blocks: []}, word_bank: ["member", "new", "a", "you", "Are"]}
          - content_key: "en.a1.unit02.lesson03.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "Are you a new member Yes I am I'm Leila"
            prompt: {target_blocks: [{text: "Are you a new member? What's your name?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit02.lesson03.exercise06.who_is_daniel"
            type: "dialogue_comprehension"
            tested_text: "Daniel library"
            media_asset_key: "en.a1.audio.dialogue.library.01"
            prompt: {target_blocks: []}
          - content_key: "en.a1.unit02.lesson03.exercise07.speak_exchange"
            type: "speak_response"
            tested_text: "I'm Leila I'm a student I'm a new member"
            prompt: {target_blocks: [{text: "Good afternoon. I'm Daniel. I work at the library. What's your name? Are you a new member?", language_code: "en", direction: "ltr"}]}
