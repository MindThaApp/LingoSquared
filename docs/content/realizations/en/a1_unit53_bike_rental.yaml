course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Bicycle rental register is a simple, everyday spoken exchange between two customers and a rental-shop clerk about renting bikes for a short leisure ride: asking to rent, naming a size, understanding the hourly price and deposit, and understanding a return-time instruction. Core vocabulary (rent/deposit/return/hour/size/helmet) is deliberately generic to a routine short-term bicycle rental, not cycling-technique or traffic-rule vocabulary (no discussion of gears, brakes, bike lanes, or road rules) and not a long-term or online reservation (that would be a different, more complex register than this A1 outcome's own can_do line covers)."

media_assets:
  - {content_key: "en.a1.audio.bike_rental.words.01", language: "en", text: "rent, deposit, return, hour, size, helmet", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.bike_rental.phrases.01", language: "en", text: "I'd like to rent a bike, please. How much does it cost per hour? I need a small bike. Can I have a helmet, please? When do I need to return it? It's ten dollars an hour.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.bike_rental.01"
    language: "en"
    text: "Rental Clerk: Hi! How can I help you today? Mia: We'd like to rent two bikes. We want to ride along the river. Rental Clerk: Sure. What size do you need? Leila: I need a small one. Mia: And I need a medium one. Rental Clerk: Great, here are your bikes. It's ten dollars an hour, and the deposit is twenty dollars. Mia: When do we need to return them? Rental Clerk: Please return them by five o'clock. Leila: Great, thank you!"
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

