          - {content_key: "en.a1.unit53.lesson03.teach.dialogue_line9", kind: "dialogue", target: {text: "Great, thank you!", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["thank"]}
        exercises:
          - {content_key: "en.a1.unit53.lesson03.exercise01.comprehension_reason", type: "multiple_choice", tested_text: "to ride along the river", prompt: {target_blocks: [{text: "According to the dialogue, why do Mia and Leila want to rent bikes?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit53.lesson03.exercise02.comprehension_leila_size", type: "multiple_choice", tested_text: "small", prompt: {target_blocks: [{text: "According to the dialogue, what size bike does Leila need?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit53.lesson03.exercise03.listen_dialogue_deposit", type: "listen_select", tested_text: "twenty dollars", media_asset_key: "en.a1.audio.dialogue.bike_rental.01", prompt: {target_blocks: [{text: "According to the dialogue, how much is the deposit?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit53.lesson03.exercise04.respond_own_bike_statement", type: "speak_response", tested_text: "I need a small one", accepted_answers: ["I need a small one", "I need a small one.", "I need a medium one", "I need a medium one.", "It's ten dollars an hour", "It's ten dollars an hour.", "The deposit is twenty dollars", "The deposit is twenty dollars.", "Please return them by five o'clock", "Please return them by five o'clock."], prompt: {target_blocks: [{text: "Say what size Leila or Mia needs, or say how much the deposit costs.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit53.lesson04.a_bike_ride_along_the_river"
        title: "Reading: A bike ride along the river"
        spine_outcome_id: "universal.a1.bike_rental.rent_a_bicycle"
        teaching:
          - {content_key: "en.a1.unit53.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Bike Ride Along the River: One warm afternoon, Mia invited Leila to ride bikes along the river near her apartment. Neither of them owned a bike, so they went to a rental shop together. The clerk asked what size they needed, and Leila took a small bike while Mia took a medium one. The rental cost ten dollars an hour, and the deposit was twenty dollars for both bikes. They had to return the bikes by five o'clock. The ride along the river was beautiful, and they saw people walking their dogs and enjoying the sunny weather. They returned the bikes right on time and got their deposit back. Afterward, they told Daniel about the ride, and he said he wanted to join them next time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Bike", "Ride", "Along", "the", "River", "One", "warm", "afternoon", "Mia", "invited", "Leila", "to", "bikes", "near", "her", "apartment", "Neither", "of", "them", "owned", "so", "they", "went", "rental", "shop", "together", "clerk", "asked", "what", "size", "needed", "and", "took", "small", "while", "medium", "cost", "ten", "dollars", "an", "hour", "deposit", "was", "twenty", "for", "both", "had", "return", "by", "five", "o'clock", "beautiful", "saw", "people", "walking", "their", "dogs", "enjoying", "sunny", "weather", "returned", "right", "on", "time", "got", "back", "Afterward", "told", "Daniel", "about", "he", "said", "wanted", "join", "next"]}
        exercises:
          - {content_key: "en.a1.unit53.lesson04.exercise01.reading_rental_reason", type: "multiple_choice", tested_text: "neither of them owned a bike", prompt: {target_blocks: [{text: "According to the reading, why did Mia and Leila go to a rental shop?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit53.lesson04.exercise02.reading_return_time", type: "multiple_choice", tested_text: "five o'clock", prompt: {target_blocks: [{text: "According to the reading, what time did they need to return the bikes?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit53.lesson04.exercise03.reading_told_daniel", type: "multiple_choice", tested_text: "Daniel", prompt: {target_blocks: [{text: "According to the reading, who did they tell about the ride?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit53.lesson04.exercise04.write_own_bike_ride_message", type: "writing_prompt", tested_text: "Leila took a small bike, and they returned the bikes by five o'clock.", prompt: {target_blocks: [{text: "Write a short message: say what size bike Leila took, and say what time they returned the bikes.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["Leila took a small bike, and they returned the bikes by five o'clock.", "Leila took a small bike. They returned the bikes by five o'clock.", "Leila took a small bike and they returned the bikes by five o'clock."]}
