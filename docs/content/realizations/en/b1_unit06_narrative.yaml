course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: recounting a past experience as a sequence of events, using past continuous with while/when to mark background action against a main-line event, past perfect for something already done before another past event, and reported speech to report what someone else said."

media_assets:
  - {content_key: "en.b1.audio.narrative.words.stranger.01", language: "en", text: "stranger", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.narrative.sentence.01", language: "en", text: "While I was driving to work, my tire went flat.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.narrative.01"
    language: "en"
    text: "Daniel: You're late! What happened? Leila: While I was driving to work, my tire suddenly went flat. Daniel: Oh no! What did you do? Leila: I pulled over, and a stranger stopped to help me. Daniel: That was kind of him. Did you call a mechanic? Leila: Yes, I had already called one before he arrived. The mechanic said that he could fix it in ten minutes, and he did!"
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit06.narrative"
    title: "The flat tire story"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.narrative.recount_past_experience_with_sequencing"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit06.lesson01.narrative_vocabulary"
        title: "While, flat tire, and stranger"
        spine_outcome_id: "universal.b1.narrative.recount_past_experience_with_sequencing"
        teaching:
          - {content_key: "en.b1.unit06.lesson01.teach.while", kind: "vocabulary", target: {text: "while", language_code: "en", direction: "ltr"}, introduced_tokens: ["while"], example: {text: "While I was driving, it started to rain.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit06.lesson01.teach.flat_tire", kind: "vocabulary", target: {text: "flat tire", language_code: "en", direction: "ltr"}, introduced_tokens: ["flat", "tire"], example: {text: "My tire went flat on the highway.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit06.lesson01.teach.pull_over", kind: "vocabulary", target: {text: "pull over", language_code: "en", direction: "ltr"}, introduced_tokens: ["pull", "over"], example: {text: "I had to pull over immediately.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit06.lesson01.teach.stranger", kind: "vocabulary", target: {text: "stranger", language_code: "en", direction: "ltr"}, introduced_tokens: ["stranger"], example: {text: "A stranger stopped to help me.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit06.lesson01.teach.mechanic", kind: "vocabulary", target: {text: "mechanic", language_code: "en", direction: "ltr"}, introduced_tokens: ["mechanic"], example: {text: "The mechanic fixed my tire quickly.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit06.lesson01.teach.said_that", kind: "vocabulary", target: {text: "said that", language_code: "en", direction: "ltr"}, introduced_tokens: ["said", "that"], example: {text: "He said that he could help.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit06.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "stranger", media_asset_key: "en.b1.audio.narrative.words.stranger.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit06.lesson01.exercise02.choose_stop_car_phrase", type: "multiple_choice", tested_text: "pull over", prompt: {target_blocks: [{text: "Which phrase means to stop your car by the side of the road?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson01.exercise03.choose_someone_you_dont_know_word", type: "multiple_choice", tested_text: "stranger", prompt: {target_blocks: [{text: "Which word means someone you don't know?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson01.exercise04.match_narrative_words", type: "matching_pairs", tested_text: "while flat tire pull over stranger mechanic said that", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "at the same time as something else happens", right: "while"}, {left: "a tire with no air, that stopped working", right: "flat tire"}, {left: "to stop your car by the side of the road", right: "pull over"}, {left: "someone you don't know", right: "stranger"}, {left: "someone who fixes cars", right: "mechanic"}, {left: "reporting what someone else said", right: "said that"}]}
          - {content_key: "en.b1.unit06.lesson01.exercise05.write_mechanic", type: "writing_prompt", tested_text: "mechanic", prompt: {target_blocks: [{text: "Write the word for someone who fixes cars.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit06.lesson02.sequencing_with_while_and_when"
        title: "While I was driving, when I pulled over"
        spine_outcome_id: "universal.b1.narrative.recount_past_experience_with_sequencing"
        teaching:
          - {content_key: "en.b1.unit06.lesson02.teach.while_driving_tire_went_flat", kind: "phrase", target: {text: "While I was driving to work, my tire went flat.", language_code: "en", direction: "ltr"}, introduced_tokens: ["While", "I", "was", "driving", "to", "work", "my", "tire", "went", "flat"], media_asset_key: "en.b1.audio.narrative.sentence.01"}
          - {content_key: "en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped", kind: "phrase", target: {text: "When I pulled over, a stranger stopped to help.", language_code: "en", direction: "ltr"}, introduced_tokens: ["When", "pulled", "over", "a", "stranger", "stopped", "help"]}
          - {content_key: "en.b1.unit06.lesson02.teach.grammar_while_when_sequencing", kind: "grammar_note", target: {text: "While I was driving, my tire went flat. When I pulled over, a stranger helped me.", language_code: "en", direction: "ltr"}, introduced_tokens: ["helped", "me"]}
        exercises:
          - {content_key: "en.b1.unit06.lesson02.exercise01.choose_background_action", type: "multiple_choice", tested_text: "While I was driving to work, my tire went flat.", prompt: {target_blocks: [{text: "Which sentence uses \"while\" to mark a background action interrupted by another event?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson02.exercise02.choose_when_sentence", type: "multiple_choice", tested_text: "When I pulled over, a stranger stopped to help.", prompt: {target_blocks: [{text: "Which sentence uses \"when\" to introduce the next event in the story?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson02.exercise03.order_while_driving_tire_went_flat", type: "word_order", tested_text: "While I was driving to work my tire went flat", prompt: {target_blocks: []}, word_bank: ["I", "was", "driving", "to", "work", "my", "tire", "went", "flat", "While"]}
          - {content_key: "en.b1.unit06.lesson02.exercise04.reply_what_happened", type: "dialogue_response", tested_text: "While I was driving to work my tire went flat", prompt: {target_blocks: [{text: "What happened on your way to work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson02.exercise05.write_when_pulled_over", type: "writing_prompt", tested_text: "When I pulled over, a stranger stopped to help.", prompt: {target_blocks: [{text: "Write that when you pulled over, a stranger stopped to help.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit06.lesson03.reading_the_flat_tire_story"
        title: "Reading: the flat tire story"
        spine_outcome_id: "universal.b1.narrative.recount_past_experience_with_sequencing"
        teaching:
          - {content_key: "en.b1.unit06.lesson03.teach.had_already_called", kind: "vocabulary", target: {text: "had already called", language_code: "en", direction: "ltr"}, introduced_tokens: ["had", "already", "called"], example: {text: "By the time he arrived, I had already called Daniel.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit06.lesson03.teach.kept_his_word", kind: "vocabulary", target: {text: "kept his word", language_code: "en", direction: "ltr"}, introduced_tokens: ["kept", "his", "word"], example: {text: "He kept his word and fixed it in ten minutes.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit06.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Yesterday morning, while Leila was driving to work, her tire suddenly went flat. She pulled over on a quiet street. A stranger stopped his car and offered to help. By the time the mechanic arrived, Leila had already called Daniel to say she would be late. The mechanic said that he could fix the tire in ten minutes. He kept his word, and Leila got to work only twenty minutes late.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Yesterday", "morning", "Leila", "her", "suddenly", "She", "on", "a", "quiet", "street", "stopped", "car", "offered", "By", "the", "time", "arrived", "Daniel", "say", "would", "be", "late", "said", "that", "he", "could", "fix", "in", "ten", "minutes", "and", "got", "to", "work", "only", "twenty"]
        exercises:
          - {content_key: "en.b1.unit06.lesson03.exercise01.comprehend_what_happened_first", type: "reading_comprehension", tested_text: "her tire suddenly went flat", prompt: {target_blocks: [{text: "What happened while Leila was driving to work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson03.exercise02.comprehend_what_mechanic_said", type: "reading_comprehension", tested_text: "he could fix the tire in ten minutes", prompt: {target_blocks: [{text: "What did the mechanic say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson03.exercise03.recognize_had_already", type: "multiple_choice", tested_text: "had already called", prompt: {target_blocks: [{text: "Which phrase describes something that happened before another past event?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson03.exercise04.order_stranger_offered_to_help", type: "word_order", tested_text: "A stranger stopped his car and offered to help", prompt: {target_blocks: []}, word_bank: ["stranger", "stopped", "his", "car", "and", "offered", "to", "help", "A"]}
          - {content_key: "en.b1.unit06.lesson03.exercise05.write_he_kept_his_word", type: "writing_prompt", tested_text: "He kept his word.", prompt: {target_blocks: [{text: "Write that he kept his word.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit06.lesson04.telling_daniel_the_story"
        title: "You're late! What happened?"
        spine_outcome_id: "universal.b1.narrative.recount_past_experience_with_sequencing"
        teaching:
          - {content_key: "en.b1.unit06.lesson04.teach.q_youre_late_what_happened", kind: "dialogue", target: {text: "You're late! What happened?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["You're", "late", "What", "happened"], media_asset_key: "en.b1.audio.dialogue.narrative.01"}
          - {content_key: "en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly", kind: "dialogue", target: {text: "While I was driving to work, my tire suddenly went flat.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["While", "I", "was", "driving", "to", "work", "my", "tire", "suddenly", "went", "flat"]}
          - {content_key: "en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do", kind: "dialogue", target: {text: "Oh no! What did you do?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Oh", "no", "What", "did", "you", "do"]}
          - {content_key: "en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped", kind: "dialogue", target: {text: "I pulled over, and a stranger stopped to help me.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["pulled", "over", "and", "a", "stranger", "stopped", "to", "help", "me"]}
          - {content_key: "en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic", kind: "dialogue", target: {text: "That was kind of him. Did you call a mechanic?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That", "was", "kind", "of", "him", "Did", "you", "call", "a", "mechanic"]}
          - {content_key: "en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said", kind: "dialogue", target: {text: "Yes, I had already called one before he arrived. The mechanic said that he could fix it in ten minutes, and he did!", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "had", "already", "called", "one", "before", "he", "arrived", "The", "mechanic", "said", "that", "could", "fix", "it", "in", "ten", "minutes", "and", "did"]}
        exercises:
          - {content_key: "en.b1.unit06.lesson04.exercise01.listen_what_happened_to_leila", type: "dialogue_comprehension", tested_text: "my tire suddenly went flat", media_asset_key: "en.b1.audio.dialogue.narrative.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit06.lesson04.exercise02.listen_who_helped_leila", type: "listen_select", tested_text: "a stranger stopped to help me", media_asset_key: "en.b1.audio.dialogue.narrative.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit06.lesson04.exercise03.choose_what_mechanic_said", type: "multiple_choice", tested_text: "he could fix it in ten minutes", prompt: {target_blocks: [{text: "What did the mechanic say he could do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit06.lesson04.exercise04.order_youre_late_what_happened", type: "word_order", tested_text: "You're late What happened", prompt: {target_blocks: []}, word_bank: ["late", "What", "happened", "You're"]}
          - content_key: "en.b1.unit06.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "While I was driving to work my tire suddenly went flat"
            prompt: {target_blocks: [{text: "You're late! What happened?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit06.lesson04.exercise06.speak_narrative_dialogue"
            type: "speak_response"
            tested_text: "Yes I had already called one before he arrived The mechanic said that he could fix it in ten minutes and he did"
            prompt: {target_blocks: [{text: "That was kind of him. Did you call a mechanic?", language_code: "en", direction: "ltr"}]}
