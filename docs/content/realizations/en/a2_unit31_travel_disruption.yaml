schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Firecrawl was unavailable this session (402, out of credits) and no
    cached scrape existed in .firecrawl/ for A2 ESL travel-disruption
    material. Authored directly from established ESL A2 conventions
    (universal_spine.yaml's universal.a2.travel.handle_travel_disruption
    node) and this unit's own predecessor pattern (a2_unit25_bureaucracy's
    formal-register scaffold), not adapted from any specific
    public-domain course. Deliberately reuses the exact facts already
    established in a1_unit21_travel.yaml (Daniel's round-trip ticket to
    Boston, platform 4, 9:15 outbound) as the return leg of that same
    trip, per AUTHORING_GUIDE §11 cross-fact consistency -- a genuine
    story continuation, not a coincidence.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Second of 5 new A2 units closing the en-realization gap against fa/prs's
    a2_unit14-18 -- spine outcome universal.a2.travel.handle_travel_disruption.
    Daniel's return train from Boston (established a1_unit21) is delayed
    by a signal problem; he asks a station Agent about alternatives.
    Facts kept consistent across lesson03's written notice and
    lesson04's dialogue/announcement per §11 (5:15 original departure,
    signal problem, new departure 6:00, alternative bus at 5:30).
    Every multi-clause accepted_answers entry authored with
    period/conjunction-joined forms per §12.

    2026-07-11 fresh-context review (Claude, zero access to authoring
    reasoning). Continuity verified against a1_unit21 (Daniel's round-trip
    Boston ticket, platform 4, 9:15 outbound) -- this unit's 5:15/6:00/5:30
    return-leg facts are a genuine, non-conflicting continuation. One real §11
    internal inconsistency found and FIXED: lesson01 teach.delay's vocab example
    said "a thirty-minute delay on the 5:15 train", but every other fact in the
    unit (notice, announcement, dialogue) puts the same 5:15 train's new
    departure at 6:00 -- a 45-minute delay. Changed the example to
    "forty-five-minute delay" (en) and its fa gloss to "چهل و پنج دقیقه" to
    match. Also fixed in the fa-en overlay: all 3 word_order accepted_answers
    were in scrambled word_bank order rather than correct sentence order (see
    overlay note). listen_select distractors checked: lesson04 ex02 (bus time
    5:30, distractor 6:00 is the train's new time) is a legitimate comprehension
    distractor referring to a different referent, not an unanswerable
    same-utterance repeat -- left as-is.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at a polite register for asking station/airline staff about a disruption and its alternatives (Excuse me, could you tell me..., Is there another way to...)."

media_assets:
  - {content_key: "en.a2.audio.travel_disruption.words.01", language: "en", text: "delay, cancelled, alternative, notice, signal problem", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.travel_disruption.announcement.01", language: "en", text: "Attention passengers: the 5:15 train has been delayed because of a signal problem. The new departure time is 6:00.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.travel_disruption.description.01", language: "en", text: "The train has been delayed because of a signal problem, so I'm going to take the bus instead.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.travel_disruption.01"
    language: "en"
    text: "Agent: Can I help you? Daniel: Yes, I was wondering why the train is delayed. Agent: There's a signal problem on the tracks. The new departure time is 6:00. Daniel: Is there another way to get home tonight? Agent: There's a bus that leaves at 5:30 from outside the station. Daniel: Thank you. I'll take the bus instead."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit31.travel_disruption"
    title: "Handling a travel disruption"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.travel.handle_travel_disruption"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit31.lesson01.disruption_vocabulary"
        title: "Delays, cancellations, and alternatives"
        spine_outcome_id: "universal.a2.travel.handle_travel_disruption"
        teaching:
          - {content_key: "en.a2.unit31.lesson01.teach.delay", kind: "vocabulary", target: {text: "delay", language_code: "en", direction: "ltr"}, introduced_tokens: ["delay"], example: {text: "There is a forty-five-minute delay on the 5:15 train.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit31.lesson01.teach.cancelled", kind: "vocabulary", target: {text: "cancelled", language_code: "en", direction: "ltr"}, introduced_tokens: ["cancelled"], example: {text: "The 5:15 train wasn't cancelled, only delayed.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit31.lesson01.teach.alternative", kind: "vocabulary", target: {text: "alternative", language_code: "en", direction: "ltr"}, introduced_tokens: ["alternative"], example: {text: "The agent offered an alternative: a bus at 5:30.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit31.lesson01.teach.notice", kind: "vocabulary", target: {text: "notice", language_code: "en", direction: "ltr"}, introduced_tokens: ["notice"], example: {text: "I read a notice about the delay at the station.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit31.lesson01.teach.signal_problem", kind: "vocabulary", target: {text: "signal problem", language_code: "en", direction: "ltr"}, introduced_tokens: ["signal", "problem"], example: {text: "The delay is because of a signal problem on the tracks.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a2.unit31.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "signal problem", media_asset_key: "en.a2.audio.travel_disruption.words.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit31.lesson01.exercise02.choose_no_longer_happening_word", type: "multiple_choice", tested_text: "cancelled", prompt: {target_blocks: [{text: "Which word means a train or bus is no longer happening at all?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson01.exercise03.choose_different_option_word", type: "multiple_choice", tested_text: "alternative", prompt: {target_blocks: [{text: "Which word means a different option?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson01.exercise04.match_disruption_words", type: "matching_pairs", tested_text: "delay cancelled alternative notice signal problem", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a wait longer than planned", right: "delay"}, {left: "no longer happening at all", right: "cancelled"}, {left: "a different option", right: "alternative"}, {left: "a written announcement posted for passengers", right: "notice"}, {left: "a problem with the tracks that causes delays", right: "signal problem"}, {left: "the time a train or bus is supposed to leave", right: "departure time"}, {left: "a change to which platform a train leaves from", right: "platform change"}, {left: "words used to apologize for a problem", right: "We're sorry for the inconvenience"}]}
          - {content_key: "en.a2.unit31.lesson01.exercise05.write_alternative", type: "writing_prompt", tested_text: "alternative", prompt: {target_blocks: [{text: "Write the word for a different option.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit31.lesson02.asking_about_alternatives"
        title: "Asking about alternatives"
        spine_outcome_id: "universal.a2.travel.handle_travel_disruption"
        teaching:
          - {content_key: "en.a2.unit31.lesson02.teach.wondering_why_delayed", kind: "phrase", target: {text: "I was wondering why the train is delayed.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "was", "wondering", "why", "the", "train", "is", "delayed"]}
          - {content_key: "en.a2.unit31.lesson02.teach.another_way_home", kind: "phrase", target: {text: "Is there another way to get home tonight?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Is", "there", "another", "way", "to", "get", "home", "tonight"]}
          - {content_key: "en.a2.unit31.lesson02.teach.delayed_because_signal", kind: "phrase", target: {text: "The train has been delayed because of a signal problem.", language_code: "en", direction: "ltr"}, introduced_tokens: ["has", "been", "delayed", "because", "of", "a", "signal", "problem"]}
        exercises:
          - {content_key: "en.a2.unit31.lesson02.exercise01.listen_reason_for_delay", type: "listen_select", tested_text: "delayed because of a signal problem", media_asset_key: "en.a2.audio.travel_disruption.description.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit31.lesson02.exercise02.choose_polite_delay_question", type: "multiple_choice", tested_text: "I was wondering why the train is delayed.", prompt: {target_blocks: [{text: "You want to ask a station agent, politely, why your train is delayed. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson02.exercise03.order_another_way_home", type: "word_order", tested_text: "Is there another way to get home tonight", prompt: {target_blocks: []}, word_bank: ["there", "another", "way", "to", "get", "home", "tonight", "Is"]}
          - {content_key: "en.a2.unit31.lesson02.exercise04.reply_why_delayed", type: "dialogue_response", tested_text: "The train has been delayed because of a signal problem", prompt: {target_blocks: [{text: "Why is the train delayed?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson02.exercise05.write_delay_reason", type: "writing_prompt", tested_text: "The train has been delayed because of a signal problem.", prompt: {target_blocks: [{text: "Write that the train has been delayed because of a signal problem.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit31.lesson03.reading_a_disruption_notice"
        title: "Reading a disruption notice"
        spine_outcome_id: "universal.a2.travel.handle_travel_disruption"
        teaching:
          - {content_key: "en.a2.unit31.lesson03.teach.departure_time", kind: "vocabulary", target: {text: "departure time", language_code: "en", direction: "ltr"}, introduced_tokens: ["departure", "time"], example: {text: "The new departure time is 6:00.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit31.lesson03.teach.notice_text", kind: "reading", target: {text: "Notice: The 5:15 train has been delayed because of a signal problem. The new departure time is 6:00. A bus is available at 5:30 outside the station.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Notice", "The", "5:15", "train", "has", "been", "delayed", "because", "of", "a", "signal", "problem", "new", "departure", "time", "is", "6:00", "bus", "available", "at", "5:30", "outside", "the", "station"]}
          - {content_key: "en.a2.unit31.lesson03.teach.i_will_take_the_bus", kind: "phrase", target: {text: "I will take the bus instead.", language_code: "en", direction: "ltr"}, introduced_tokens: ["will", "take", "bus", "instead"]}
        exercises:
          - {content_key: "en.a2.unit31.lesson03.exercise01.read_disruption_reason", type: "reading_comprehension", tested_text: "a signal problem", prompt: {target_blocks: [{text: "Why has the 5:15 train been delayed?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson03.exercise02.read_new_departure_time", type: "reading_comprehension", tested_text: "6:00", prompt: {target_blocks: [{text: "What is the new departure time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson03.exercise03.choose_alternative_time", type: "multiple_choice", tested_text: "5:30", prompt: {target_blocks: [{text: "What time does the alternative bus leave?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson03.exercise04.order_new_departure_sentence", type: "word_order", tested_text: "The new departure time is 6:00", prompt: {target_blocks: []}, word_bank: ["new", "departure", "time", "is", "6:00", "The"]}
          - {content_key: "en.a2.unit31.lesson03.exercise05.write_take_bus_instead", type: "writing_prompt", tested_text: "I will take the bus instead.", prompt: {target_blocks: [{text: "Write that you will take the bus instead.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit31.lesson04.station_dialogue"
        title: "At the station"
        spine_outcome_id: "universal.a2.travel.handle_travel_disruption"
        teaching:
          - {content_key: "en.a2.unit31.lesson04.teach.q_can_i_help", kind: "dialogue", target: {text: "Can I help you?", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["Can", "I", "help", "you"]}
          - {content_key: "en.a2.unit31.lesson04.teach.a_wondering_why_delayed", kind: "dialogue", target: {text: "Yes, I was wondering why the train is delayed.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes"]}
          - {content_key: "en.a2.unit31.lesson04.teach.q_signal_problem_new_time", kind: "dialogue", target: {text: "There's a signal problem on the tracks. The new departure time is 6:00.", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["There's", "a", "signal", "problem", "on", "the", "tracks", "new", "departure", "time", "is", "6:00"]}
          - {content_key: "en.a2.unit31.lesson04.teach.a_another_way_home_tonight", kind: "dialogue", target: {text: "Is there another way to get home tonight?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit31.lesson04.teach.q_bus_at_530", kind: "dialogue", target: {text: "There's a bus that leaves at 5:30 from outside the station.", language_code: "en", direction: "ltr", speaker: "Agent"}, introduced_tokens: ["bus", "that", "leaves", "at", "5:30", "from", "outside", "the", "station"]}
          - {content_key: "en.a2.unit31.lesson04.teach.a_thank_you_take_bus", kind: "dialogue", target: {text: "Thank you. I'll take the bus instead.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thank", "you", "I'll", "take", "the", "bus", "instead"]}
        exercises:
          - {content_key: "en.a2.unit31.lesson04.exercise01.listen_reason_for_delay_dialogue", type: "dialogue_comprehension", tested_text: "a signal problem on the tracks", media_asset_key: "en.a2.audio.dialogue.travel_disruption.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit31.lesson04.exercise02.listen_bus_departure_time", type: "listen_select", tested_text: "5:30", media_asset_key: "en.a2.audio.dialogue.travel_disruption.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit31.lesson04.exercise03.choose_new_train_time", type: "multiple_choice", tested_text: "6:00", prompt: {target_blocks: [{text: "What is the new departure time for the train?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit31.lesson04.exercise04.order_can_i_help_question", type: "word_order", tested_text: "Can I help you", prompt: {target_blocks: []}, word_bank: ["I", "help", "you", "Can"]}
          - content_key: "en.a2.unit31.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I was wondering why the train is delayed Is there another way to get home tonight Thank you I'll take the bus instead"
            prompt: {target_blocks: [{text: "Can I help you?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit31.lesson04.exercise06.speak_disruption_dialogue"
            type: "speak_response"
            tested_text: "I was wondering why the train is delayed Is there another way to get home tonight Thank you I'll take the bus instead"
            prompt: {target_blocks: [{text: "Can I help you?", language_code: "en", direction: "ltr"}]}
