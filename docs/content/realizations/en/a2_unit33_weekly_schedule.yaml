schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Firecrawl was unavailable this session (402, out of credits) and no
    cached scrape existed in .firecrawl/ for A2 ESL weekly-schedule
    material. Authored directly from established ESL A2 conventions
    (universal_spine.yaml's universal.a2.routines.describe_weekly_schedule
    node, which requires sequencing connectors and a weekday/weekend
    contrast beyond the A1 daily-routine prerequisite) and this unit's
    own predecessor pattern, not adapted from any specific public-domain
    course. Deliberately reuses the exact facts already established in
    a1_unit34_sports.yaml (Daniel's running habit, Saturday soccer with
    coworkers) and a1_unit23_work.yaml (Daniel's engineer job) per
    AUTHORING_GUIDE §11, rather than inventing a new, potentially
    conflicting routine.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Fourth of 5 new A2 units closing the en-realization gap against fa/prs's
    a2_unit14-18 -- spine outcome
    universal.a2.routines.describe_weekly_schedule. Leila asks Daniel to
    describe his typical week; his answer sequences weekday work,
    Tuesday/Thursday morning runs, and Saturday soccer with connectors
    (first...then, on the weekend), consistent with a1_unit23/a1_unit34.
    Lesson03's reading passage is Leila's own weekly schedule message
    (online classes, library, coffee with friends, visiting parents) --
    a fresh, non-conflicting routine for her since no prior unit fixes
    her weekly schedule. Facts kept internally consistent per §11.
    Every multi-clause accepted_answers entry authored with
    period/conjunction-joined forms per §12.

    2026-07-11 fresh-context review (Claude, zero access to authoring
    reasoning). Continuity verified: Daniel engineer/company + email + meetings
    (a1_unit23), Saturday soccer with coworkers (a1_unit34); the Tue/Thu-morning
    running is a compatible new elaboration on a1_unit34's "running is my
    favorite" (no day was previously pinned). Two real bugs found and FIXED: (1)
    lesson02 exercise03's word_bank was missing a second "I" tile, so the taught
    sentence "First I check my email then I go to meetings" (two "I"s) was
    mechanically unbuildable -- added the tile in this realization. (2) In the
    fa-en overlay, lesson02 exercise01 (listen_select) used the distractor "On
    weekdays, I work at my company.", which is spoken VERBATIM as the first
    sentence of this exercise's own audio (question.01) -- an unanswerable
    same-audio repeat per the listen_select rule; replaced with a non-spoken
    sentence. Also in the overlay: all 3 word_order accepted_answers were in
    scrambled word_bank order rather than sentence order (fixed).
    Shared-en fix 2026-10-20: the first-person key quotes the message but the question asked about the character in the third person. The question now asks which words from the text give the answer (realization prompt and nl/fa/prs instructions); keys unchanged. A third-person key was not used because she/her/he/his are not introduced anywhere in the A2 course (the token check fails). Persian/Dari distractors moved to first person to match the quoted options.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English using sequencing connectors (first, then, after that) and a weekday/weekend contrast to describe a multi-activity week -- the A2 step up from a1's single daily-routine sentences."

media_assets:
  - {content_key: "en.a2.audio.weekly_schedule.words.after_that.01", language: "en", text: "after that", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.weekly_schedule.question.first_i_check_my_email_then_i_go_to_meetings.01", language: "en", text: "First, I check my email, then I go to meetings", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.weekly_schedule.description.01", language: "en", text: "On Tuesday and Thursday mornings, I go running before work. On Saturdays, I play soccer with my coworkers, and on Sundays, I relax and see my friends.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.weekly_schedule.01"
    language: "en"
    text: "Leila: What does your week usually look like? Daniel: On weekdays, I work at my company. First, I check my email, then I go to meetings. Leila: What about the mornings? Daniel: On Tuesday and Thursday mornings, I go running before work. Leila: And on the weekend? Daniel: On Saturdays, I play soccer with my coworkers. On Sundays, I relax and see my friends."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit33.weekly_schedule"
    title: "Describing your weekly schedule"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.routines.describe_weekly_schedule"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit33.lesson01.weekly_schedule_vocabulary"
        title: "Weekdays, weekends, and schedules"
        spine_outcome_id: "universal.a2.routines.describe_weekly_schedule"
        teaching:
          - {content_key: "en.a2.unit33.lesson01.teach.weekday", kind: "vocabulary", target: {text: "weekday", language_code: "en", direction: "ltr"}, introduced_tokens: ["weekday"], example: {text: "On weekdays, I work at my company.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit33.lesson01.teach.weekend", kind: "vocabulary", target: {text: "weekend", language_code: "en", direction: "ltr"}, introduced_tokens: ["weekend"], example: {text: "On the weekend, I relax and see my friends.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit33.lesson01.teach.schedule", kind: "vocabulary", target: {text: "schedule", language_code: "en", direction: "ltr"}, introduced_tokens: ["schedule"], example: {text: "My schedule is busy on weekdays.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit33.lesson01.teach.after_that", kind: "vocabulary", target: {text: "after that", language_code: "en", direction: "ltr"}, introduced_tokens: ["after", "that"], example: {text: "I check my email. After that, I go to meetings.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit33.lesson01.teach.finally", kind: "vocabulary", target: {text: "finally", language_code: "en", direction: "ltr"}, introduced_tokens: ["finally"], example: {text: "Finally, I go home and relax.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a2.unit33.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "after that", media_asset_key: "en.a2.audio.weekly_schedule.words.after_that.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit33.lesson01.exercise02.choose_monday_to_friday_word", type: "multiple_choice", tested_text: "weekday", prompt: {target_blocks: [{text: "Which word describes Monday through Friday?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson01.exercise03.choose_saturday_sunday_word", type: "multiple_choice", tested_text: "weekend", prompt: {target_blocks: [{text: "Which word describes Saturday and Sunday?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson01.exercise04.match_schedule_words", type: "matching_pairs", tested_text: "weekday weekend schedule after that finally", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "weekday", right: "Monday through Friday"}, {left: "weekend", right: "Saturday and Sunday"}, {left: "schedule", right: "a plan of activities and their times"}, {left: "after that", right: "used to say what happens next"}, {left: "finally", right: "used to say what happens last"}]}
          - {content_key: "en.a2.unit33.lesson01.exercise05.write_weekend", type: "writing_prompt", tested_text: "weekend", prompt: {target_blocks: [{text: "Write the word for Saturday and Sunday.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit33.lesson02.describing_your_week"
        title: "Describing your week with connectors"
        spine_outcome_id: "universal.a2.routines.describe_weekly_schedule"
        teaching:
          - {content_key: "en.a2.unit33.lesson02.teach.weekdays_work_company", kind: "phrase", target: {text: "On weekdays, I work at my company.", language_code: "en", direction: "ltr"}, introduced_tokens: ["On", "weekdays", "I", "work", "at", "my", "company"]}
          - {content_key: "en.a2.unit33.lesson02.teach.first_then_email_meetings", kind: "phrase", target: {text: "First, I check my email, then I go to meetings.", language_code: "en", direction: "ltr"}, introduced_tokens: ["First", "check", "my", "email", "then", "go", "to", "meetings"]}
          - {content_key: "en.a2.unit33.lesson02.teach.weekend_relax_friends", kind: "phrase", target: {text: "On the weekend, I relax and see my friends.", language_code: "en", direction: "ltr"}, introduced_tokens: ["On", "the", "weekend", "relax", "and", "see", "my", "friends"]}
        exercises:
          - {content_key: "en.a2.unit33.lesson02.exercise01.listen_weekday_routine", type: "listen_select", tested_text: "First, I check my email, then I go to meetings", media_asset_key: "en.a2.audio.weekly_schedule.question.first_i_check_my_email_then_i_go_to_meetings.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit33.lesson02.exercise02.choose_weekday_answer", type: "multiple_choice", tested_text: "On weekdays, I work at my company.", prompt: {target_blocks: [{text: "Someone asks what you do on weekdays. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson02.exercise03.order_first_then_sentence", type: "word_order", tested_text: "First I check my email then I go to meetings", prompt: {target_blocks: []}, word_bank: ["I", "check", "my", "email", "then", "I", "go", "to", "meetings", "First"]}
          - {content_key: "en.a2.unit33.lesson02.exercise04.reply_weekend_activity", type: "dialogue_response", tested_text: "On the weekend, I relax and see my friends", prompt: {target_blocks: [{text: "What do you do on the weekend?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson02.exercise05.write_weekly_schedule_message", type: "writing_prompt", tested_text: "On weekdays, I work at my company, and on the weekend, I relax and see my friends.", prompt: {target_blocks: [{text: "Write about your weekdays and your weekend, using at least three activities.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit33.lesson03.reading_a_weekly_schedule"
        title: "Reading a weekly schedule message"
        spine_outcome_id: "universal.a2.routines.describe_weekly_schedule"
        teaching:
          - {content_key: "en.a2.unit33.lesson03.teach.online_class", kind: "vocabulary", target: {text: "online class", language_code: "en", direction: "ltr"}, introduced_tokens: ["online", "class"], example: {text: "I have an online class on Monday mornings.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit33.lesson03.teach.leilas_schedule", kind: "reading", target: {text: "My week: On Mondays and Wednesdays, I have online classes in the morning. After that, I study at the library. On Fridays, I meet friends for coffee. On the weekend, I visit my parents.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "week", "On", "Mondays", "and", "Wednesdays", "I", "have", "online", "classes", "in", "the", "morning", "After", "that", "study", "at", "library", "Fridays", "meet", "friends", "for", "coffee", "weekend", "visit", "my", "parents"]}
          - {content_key: "en.a2.unit33.lesson03.teach.i_visit_my_parents", kind: "phrase", target: {text: "On the weekend, I visit my parents.", language_code: "en", direction: "ltr"}, introduced_tokens: ["visit", "parents"]}
        exercises:
          - {content_key: "en.a2.unit33.lesson03.exercise01.read_monday_wednesday_activity", type: "reading_comprehension", tested_text: "online classes in the morning", prompt: {target_blocks: [{text: "What does Leila do on Mondays and Wednesdays?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson03.exercise02.read_after_class_activity", type: "reading_comprehension", tested_text: "study at the library", prompt: {target_blocks: [{text: "What does Leila do after her online classes?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson03.exercise03.choose_friday_activity", type: "multiple_choice", tested_text: "meet friends for coffee", prompt: {target_blocks: [{text: "What does Leila do on Fridays, according to her message?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson03.exercise04.order_visit_parents_sentence", type: "word_order", tested_text: "On the weekend I visit my parents", prompt: {target_blocks: []}, word_bank: ["the", "weekend", "I", "visit", "my", "parents", "On"]}
          - {content_key: "en.a2.unit33.lesson03.exercise05.write_own_schedule_reply", type: "writing_prompt", tested_text: "On Mondays and Wednesdays, I have online classes, and on the weekend, I visit my parents.", prompt: {target_blocks: [{text: "Write your own weekly schedule using at least three activities, like Leila's message.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit33.lesson04.weekly_schedule_dialogue"
        title: "Talking about your week"
        spine_outcome_id: "universal.a2.routines.describe_weekly_schedule"
        teaching:
          - {content_key: "en.a2.unit33.lesson04.teach.q_week_look_like", kind: "dialogue", target: {text: "What does your week usually look like?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["What", "does", "your", "week", "usually", "look", "like"]}
          - {content_key: "en.a2.unit33.lesson04.teach.a_weekdays_email_meetings", kind: "dialogue", target: {text: "On weekdays, I work at my company. First, I check my email, then I go to meetings.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit33.lesson04.teach.q_what_about_mornings", kind: "dialogue", target: {text: "What about the mornings?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["What", "about", "the", "mornings"]}
          - {content_key: "en.a2.unit33.lesson04.teach.a_tuesday_thursday_running", kind: "dialogue", target: {text: "On Tuesday and Thursday mornings, I go running before work.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["On", "Tuesday", "and", "Thursday", "mornings", "I", "go", "running", "before", "work"]}
          - {content_key: "en.a2.unit33.lesson04.teach.q_what_about_weekend", kind: "dialogue", target: {text: "And on the weekend?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["And", "on", "the", "weekend"]}
          - {content_key: "en.a2.unit33.lesson04.teach.a_saturday_soccer_sunday_relax", kind: "dialogue", target: {text: "On Saturdays, I play soccer with my coworkers. On Sundays, I relax and see my friends.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Saturdays", "play", "soccer", "with", "coworkers", "Sundays"]}
        exercises:
          - {content_key: "en.a2.unit33.lesson04.exercise01.listen_running_days", type: "dialogue_comprehension", tested_text: "Tuesday and Thursday mornings", media_asset_key: "en.a2.audio.dialogue.weekly_schedule.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit33.lesson04.exercise02.listen_saturday_activity", type: "listen_select", tested_text: "soccer with my coworkers", media_asset_key: "en.a2.audio.dialogue.weekly_schedule.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit33.lesson04.exercise03.choose_sunday_activity", type: "multiple_choice", tested_text: "relax and see my friends", prompt: {target_blocks: [{text: "Which words does Daniel use to say what he does on Sundays?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit33.lesson04.exercise04.order_week_look_like_question", type: "word_order", tested_text: "What does your week usually look like", prompt: {target_blocks: []}, word_bank: ["does", "your", "week", "usually", "look", "like", "What"]}
          - content_key: "en.a2.unit33.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "On weekdays, I work at my company. On Tuesday and Thursday mornings, I go running before work. On Saturdays, I play soccer with my coworkers. On Sundays, I relax and see my friends."
            prompt: {target_blocks: [{text: "What does your week usually look like?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit33.lesson04.exercise06.speak_weekly_schedule_dialogue"
            type: "speak_response"
            tested_text: "On weekdays, I work at my company. On Tuesday and Thursday mornings, I go running before work. On Saturdays, I play soccer with my coworkers. On Sundays, I relax and see my friends."
            prompt: {target_blocks: [{text: "What does your week usually look like?", language_code: "en", direction: "ltr"}]}
