schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "adapted_from_public_domain_source"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    The formal problem-report-and-repair-scheduling pattern (describing
    what's wrong, stating how long it's been happening, asking about
    repair timing, confirming a reference number) is scaffolded from
    the housing/tenant-relations module of the FSI Basic Course material
    (Foreign Service Institute, US Department of State -- public domain,
    no attribution required per docs/content/AUTHORING_GUIDE.md §10).
    The source frames this around a 1960s-70s landlord relationship with
    dated register; the specific scenario (a leaking kitchen sink, a
    building manager, a scheduled plumber visit, a repair reference
    number) reflects current 2020s US rental-housing conventions and is
    freshly authored, not translated or lightly edited from the source.
status: "complete_draft"
review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Fifth A2 unit for the shared English realization (spine outcome:
    universal.a2.housing.report_maintenance_problem, the second housing
    outcome -- extends unit24's A1 describe_home outcome), continuing
    the Leila/Daniel storyline: the small kitchen next to the living
    room that Daniel described in unit24 is where the problem shows up
    (the kitchen sink starts leaking), giving a concrete, established-
    fact callback rather than an unrelated new detail. Reuses,
    explicitly: unit24's home vocabulary (kitchen, apartment, bathroom
    -- recapped in lesson01's teach.reused_home_words card and pooled
    into lesson01's matching_pairs pool per AUTHORING_GUIDE §16),
    unit28's "I'd like to..." formal-request register and present-
    perfect duration pattern ("It's been leaking since this morning,"
    paralleling "I've had ... for three days"), and unit22's "What's
    wrong?" question shape (here "What's wrong with the sink?" -- the
    same discourse move applied to a different domain, a deliberate
    narrative echo rather than a coincidence). Mirrors the Dutch lane's
    a2_unit28_probleem_melden.yaml in scenario shape (a household
    problem reported to a building contact, a scheduled repair visit
    with a time window, a written confirmation with a reference number)
    per the established cross-language skeleton-share convention (see
    unit26's review notes for the same precedent) -- structure only,
    not text: independently authored scenario specifics (a sink, not
    heating), characters, and every sentence. Every concrete fact
    (leaking since this morning, plumber tomorrow between 2pm and 4pm,
    repair number 6180) is stated once and never contradicted elsewhere
    in the unit per AUTHORING_GUIDE §11 -- verified against every other
    unit's stated facts too (no reused confirmation numbers: unit25 used
    4471, unit28 used 7724, this unit uses 6180, kept as a distractor-
    only cross-reference in lesson03's exercise03, never as this unit's
    own correct answer). No fill_in_blank exercises (matching this
    realization's existing A2 units' pattern of avoiding the type
    entirely rather than risking §17 ambiguity). lesson01's
    matching_pairs exercise uses 8 distinct pairs, within the
    AUTHORING_GUIDE §16 6-12 target. Every word_order word_bank uses
    entirely distinct new+reused vocabulary -- no true-synonym pair
    could occupy the same slot ambiguously. Compiled and validated
    against the real compiler (scripts/compile_content.py) to confirm
    every exercise's tested_text is fully covered by this file's own
    cumulative introduced_tokens (the per-file untaught-vocabulary
    check), not just eyeballed. A fresh-context review (Codex was
    usage-exhausted; a no-prior-context subagent ran the equivalent
    review) found and this fixed two real spine-fidelity gaps: (1) the
    spine's read_maintenance_notice requirement needs the reader to
    identify BOTH the reported problem and the repair details, but the
    original lesson03 reading text only stated status/time/number, never
    naming the problem itself -- fixed by adding "a leaking kitchen sink"
    to the reading text and a new exercise01.read_problem_type testing
    it. (2) the spine's report_household_problem speaking requirement
    explicitly requires the learner to describe the problem AND ask
    about repair timing, but the original dialogue had the manager
    volunteer the repair window unprompted -- Daniel never actually
    asked about timing anywhere. Fixed by adding a new taught phrase
    ("When can someone come to fix it?", lesson02.teach.
    ask_repair_timing) and folding it into lesson04's dialogue (Daniel's
    turn now combines the duration statement with the timing question)
    and into both of lesson04's production exercises
    (reply_as_daniel/speak_maintenance_dialogue). Also fixed: a missed
    §15 asterisk-marking instance and one misapplied asterisk (wrapping
    a Farsi word instead of the English span) in the overlays -- see
    each overlay's own review notes. Re-validated and re-compiled clean
    (0 errors/0 warnings) after all fixes, including the full 5-unit A2
    course together. Still pending an actual human (or Codex, once usage
    resets) reviewer per standard governance -- this AI review does not
    itself satisfy §9.

    2026-07-07 §19 retrofit (part of the project-wide vocabulary-
    example rollout, picked up after a different agent hit an
    infrastructure failure on this task before any edits landed --
    confirmed no partial work existed to recover, started fresh):
    added `example:` to all 7 kind:vocabulary cards, reusing this
    file's own leaking-kitchen-sink narrative (a sink leaking, water
    dripping, calling the building manager, a plumber sent to fix it,
    a scheduled repair, the 2-4pm arrival window). reused_home_words
    (a merged 3-word card) got a 3-item example list, one sentence per
    word, each tied to the same maintenance scenario. This file is
    shared by fa-en/nl-en/prs-en; nl-en's overlay was given matching
    example_gloss this pass (fa-en/prs-en still need a follow-up).
    schema_version bumped to 1.1.

    Fresh-context review correction, same day: reused_home_words'
    third example originally read "There's water on the bathroom
    floor too" -- introducing a second leak location this file's own
    storyline never establishes (only the kitchen sink is ever
    reported or repaired). Fixed to "The bathroom is right next to
    the kitchen," a neutral layout fact that doesn't imply an
    unestablished second problem; nl-en's example_gloss updated to
    match.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at a formal register appropriate for reporting a problem to a building manager, continuing unit25/unit27/unit28's polite conventions (I'd like to..., present-perfect duration statements like It's been leaking since...)."

media_assets:
  - {content_key: "en.a2.audio.maintenance.words.plumber.01", language: "en", text: "plumber", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.maintenance.question.01", language: "en", text: "I'd like to report a problem with my kitchen sink.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.maintenance.description.01", language: "en", text: "Your repair request has been received. A plumber will come tomorrow between 2pm and 4pm. The repair number is 6180.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.maintenance_report.01"
    language: "en"
    text: "Daniel: I'd like to report a problem with my kitchen sink. Manager: What's wrong with the sink? Daniel: It's been leaking since this morning. When can someone come to fix it? Manager: I see. I'll send a plumber tomorrow between 2pm and 4pm. Daniel: Do I need to be home? Manager: Yes, please be home between 2pm and 4pm. Here's your repair number: 6180. Daniel: Thank you very much."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit29.maintenance"
    title: "Reporting a maintenance problem"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.housing.report_maintenance_problem"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit29.lesson01.repair_vocabulary"
        title: "Sinks and repairs"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit29.lesson01.teach.leaking", kind: "vocabulary", target: {text: "leaking", language_code: "en", direction: "ltr"}, introduced_tokens: ["leaking"], example: {text: "The kitchen sink is leaking.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit29.lesson01.teach.sink", kind: "vocabulary", target: {text: "sink", language_code: "en", direction: "ltr"}, introduced_tokens: ["sink"], example: {text: "Water is dripping from the sink.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit29.lesson01.teach.building_manager", kind: "vocabulary", target: {text: "building manager", language_code: "en", direction: "ltr"}, introduced_tokens: ["building", "manager"], example: {text: "I need to call the building manager about the leak.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit29.lesson01.teach.plumber", kind: "vocabulary", target: {text: "plumber", language_code: "en", direction: "ltr"}, introduced_tokens: ["plumber"], example: {text: "The building manager sent a plumber to fix it.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit29.lesson01.teach.repair", kind: "vocabulary", target: {text: "repair", language_code: "en", direction: "ltr"}, introduced_tokens: ["repair"], example: {text: "The repair will happen tomorrow afternoon.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit29.lesson01.teach.reused_home_words", kind: "vocabulary", target: {text: "kitchen, apartment, bathroom", language_code: "en", direction: "ltr"}, introduced_tokens: ["kitchen", "apartment", "bathroom"], example: [{text: "The leak is in the kitchen.", language_code: "en", direction: "ltr"}, {text: "My apartment has two bedrooms.", language_code: "en", direction: "ltr"}, {text: "The bathroom is right next to the kitchen.", language_code: "en", direction: "ltr"}]}
        exercises:
          - {content_key: "en.a2.unit29.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "plumber", media_asset_key: "en.a2.audio.maintenance.words.plumber.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit29.lesson01.exercise02.choose_leaking_word", type: "multiple_choice", tested_text: "leaking", prompt: {target_blocks: [{text: "Which word describes water coming out where it shouldn't?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson01.exercise03.choose_building_manager_phrase", type: "multiple_choice", tested_text: "building manager", prompt: {target_blocks: [{text: "Which phrase means the person who takes care of the building?", language_code: "en", direction: "ltr"}]}}
          - content_key: "en.a2.unit29.lesson01.exercise04.match_repair_words"
            type: "matching_pairs"
            tested_text: "sink building manager plumber repair kitchen apartment bathroom"
            prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}
            pairs:
              - {left: "sink", right: "where you wash dishes"}
              - {left: "building manager", right: "the person who takes care of the building"}
              - {left: "plumber", right: "the person who fixes water problems"}
              - {left: "repair", right: "fixing something that's broken"}
              - {left: "kitchen", right: "the room for cooking"}
              - {left: "apartment", right: "the whole home you live in"}
              - {left: "bathroom", right: "the room with a shower or bath"}
          - {content_key: "en.a2.unit29.lesson01.exercise05.write_plumber", type: "writing_prompt", tested_text: "plumber", prompt: {target_blocks: [{text: "Write the word for the person who fixes water problems.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit29.lesson02.calling_to_report_a_problem"
        title: "Calling to report a problem"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit29.lesson02.teach.report_problem", kind: "phrase", target: {text: "I'd like to report a problem with my kitchen sink.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'd", "like", "to", "report", "a", "problem", "with", "my", "kitchen", "sink"]}
          - {content_key: "en.a2.unit29.lesson02.teach.leaking_since_morning", kind: "phrase", target: {text: "It's been leaking since this morning.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "been", "leaking", "since", "this", "morning"]}
          - {content_key: "en.a2.unit29.lesson02.teach.ask_repair_timing", kind: "phrase", target: {text: "When can someone come to fix it?", language_code: "en", direction: "ltr"}, introduced_tokens: ["When", "can", "someone", "come", "to", "fix", "it", "and"]}
        exercises:
          - {content_key: "en.a2.unit29.lesson02.exercise01.listen_request", type: "listen_select", tested_text: "I'd like to report a problem with my kitchen sink", media_asset_key: "en.a2.audio.maintenance.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit29.lesson02.exercise02.choose_polite_report_request", type: "multiple_choice", tested_text: "I'd like to report a problem with my kitchen sink.", prompt: {target_blocks: [{text: "You are calling the building manager, formally, to report a problem. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson02.exercise03.choose_ask_repair_timing", type: "multiple_choice", tested_text: "When can someone come to fix it?", prompt: {target_blocks: [{text: "You've described the problem. Now you want to know when it will be fixed. What do you ask?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson02.exercise04.order_leaking_since_morning", type: "word_order", tested_text: "It's been leaking since this morning", prompt: {target_blocks: []}, word_bank: ["been", "leaking", "since", "this", "morning", "It's"]}
          - {content_key: "en.a2.unit29.lesson02.exercise05.order_ask_repair_timing", type: "word_order", tested_text: "When can someone come to fix it", prompt: {target_blocks: []}, word_bank: ["can", "someone", "come", "to", "fix", "it", "When"]}
          - {content_key: "en.a2.unit29.lesson02.exercise06.reply_leaking_since_morning_and_ask_timing", type: "dialogue_response", tested_text: "It's been leaking since this morning and when can someone come to fix it", prompt: {target_blocks: [{text: "The building manager asks what's wrong. Describe the problem and ask when someone can come fix it.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson02.exercise07.write_report_request", type: "writing_prompt", tested_text: "I'd like to report a problem with my kitchen sink.", prompt: {target_blocks: [{text: "Write that you'd like to report a problem with your kitchen sink.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit29.lesson03.reading_a_repair_notice"
        title: "Reading a repair notice"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit29.lesson03.teach.between_2_4", kind: "vocabulary", target: {text: "between 2pm and 4pm", language_code: "en", direction: "ltr"}, introduced_tokens: ["between", "2pm", "and", "4pm"], example: {text: "The plumber will arrive between 2pm and 4pm.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit29.lesson03.teach.confirmation_text", kind: "reading", target: {text: "Your report of a leaking kitchen sink has been received. A plumber will come tomorrow between 2pm and 4pm. The repair number is 6180.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Your", "report", "of", "leaking", "kitchen", "sink", "has", "been", "received", "A", "plumber", "will", "come", "tomorrow", "between", "2pm", "and", "4pm", "The", "repair", "number", "is", "6180"]}
        exercises:
          - {content_key: "en.a2.unit29.lesson03.exercise01.read_problem_type", type: "reading_comprehension", tested_text: "a leaking kitchen sink", prompt: {target_blocks: [{text: "What problem was reported?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson03.exercise02.read_repair_time", type: "reading_comprehension", tested_text: "tomorrow between 2pm and 4pm", prompt: {target_blocks: [{text: "When will the plumber come?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson03.exercise03.read_request_status", type: "reading_comprehension", tested_text: "has been received", prompt: {target_blocks: [{text: "What does the notice say has happened to your report?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson03.exercise04.choose_true_statement", type: "multiple_choice", tested_text: "The repair number is 6180.", prompt: {target_blocks: [{text: "Which statement is true according to the text?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson03.exercise05.order_plumber_come_tomorrow", type: "word_order", tested_text: "A plumber will come tomorrow between 2pm and 4pm", prompt: {target_blocks: []}, word_bank: ["plumber", "will", "come", "tomorrow", "between", "2pm", "and", "4pm", "A"]}
          - {content_key: "en.a2.unit29.lesson03.exercise06.write_request_received", type: "writing_prompt", tested_text: "Your report of a leaking kitchen sink has been received.", prompt: {target_blocks: [{text: "Write that your report of a leaking kitchen sink has been received.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit29.lesson04.maintenance_dialogue"
        title: "Reporting the leak"
        spine_outcome_id: "universal.a2.housing.report_maintenance_problem"
        teaching:
          - {content_key: "en.a2.unit29.lesson04.teach.q_report_problem", kind: "dialogue", target: {text: "I'd like to report a problem with my kitchen sink.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit29.lesson04.teach.q_whats_wrong_sink", kind: "dialogue", target: {text: "What's wrong with the sink?", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["What's", "wrong", "the"]}
          - {content_key: "en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing", kind: "dialogue", target: {text: "It's been leaking since this morning. When can someone come to fix it?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a2.unit29.lesson04.teach.a_send_plumber", kind: "dialogue", target: {text: "I see. I'll send a plumber tomorrow between 2pm and 4pm.", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["I", "see", "I'll", "send"]}
          - {content_key: "en.a2.unit29.lesson04.teach.q_need_to_be_home", kind: "dialogue", target: {text: "Do I need to be home?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Do", "need", "be", "home"]}
          - {content_key: "en.a2.unit29.lesson04.teach.a_confirm_window_number", kind: "dialogue", target: {text: "Yes, please be home between 2pm and 4pm. Here's your repair number: 6180.", language_code: "en", direction: "ltr", speaker: "Manager"}, introduced_tokens: ["Yes", "please", "Here's", "your"]}
          - {content_key: "en.a2.unit29.lesson04.teach.a_thank_you", kind: "dialogue", target: {text: "Thank you very much.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thank", "you", "very", "much"]}
        exercises:
          - {content_key: "en.a2.unit29.lesson04.exercise01.listen_problem_description", type: "dialogue_comprehension", tested_text: "leaking since this morning", media_asset_key: "en.a2.audio.dialogue.maintenance_report.01", prompt: {target_blocks: [{text: "What problem does Daniel describe, and since when?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson04.exercise02.listen_plumber_schedule", type: "listen_select", tested_text: "I'll send a plumber tomorrow between 2pm and 4pm", media_asset_key: "en.a2.audio.dialogue.maintenance_report.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit29.lesson04.exercise03.choose_home_instruction", type: "multiple_choice", tested_text: "Yes please be home between 2pm and 4pm", prompt: {target_blocks: [{text: "What does the manager ask Daniel to do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit29.lesson04.exercise04.order_whats_wrong_sink", type: "word_order", tested_text: "What's wrong with the sink", prompt: {target_blocks: []}, word_bank: ["wrong", "with", "the", "sink", "What's"]}
          - content_key: "en.a2.unit29.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "It's been leaking since this morning When can someone come to fix it Do I need to be home Thank you very much"
            prompt: {target_blocks: [{text: "What's wrong with the sink? I see. I'll send a plumber tomorrow between 2pm and 4pm. Yes, please be home between 2pm and 4pm. Here's your repair number: 6180.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit29.lesson04.exercise06.speak_maintenance_dialogue"
            type: "speak_response"
            tested_text: "It's been leaking since this morning When can someone come to fix it Do I need to be home Thank you very much"
            prompt: {target_blocks: [{text: "What's wrong with the sink? I see. I'll send a plumber tomorrow between 2pm and 4pm. Yes, please be home between 2pm and 4pm. Here's your repair number: 6180.", language_code: "en", direction: "ltr"}]}
