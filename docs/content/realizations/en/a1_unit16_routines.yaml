units:
  - content_key: "en.a1.unit16.routines"
    title: "Describing a daily routine"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.routines.describe_daily_routine"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit16.lesson01.routine_verbs"
        title: "Common daily routine actions"
        spine_outcome_id: "universal.a1.routines.describe_daily_routine"
        teaching:
          - {content_key: "en.a1.unit16.lesson01.teach.wake_up", kind: "phrase", target: {text: "wake up", language_code: "en", direction: "ltr"}, introduced_tokens: ["wake", "up"]}
          - {content_key: "en.a1.unit16.lesson01.teach.get_dressed", kind: "phrase", target: {text: "get dressed", language_code: "en", direction: "ltr"}, introduced_tokens: ["get", "dressed"]}
          - {content_key: "en.a1.unit16.lesson01.teach.go_to_work", kind: "phrase", target: {text: "go to work", language_code: "en", direction: "ltr"}, introduced_tokens: ["go", "to", "work"]}
          - {content_key: "en.a1.unit16.lesson01.teach.have_dinner", kind: "phrase", target: {text: "have dinner", language_code: "en", direction: "ltr"}, introduced_tokens: ["have", "dinner"]}
          - {content_key: "en.a1.unit16.lesson01.teach.go_to_bed", kind: "phrase", target: {text: "go to bed", language_code: "en", direction: "ltr"}, introduced_tokens: ["go", "to", "bed"]}
        exercises:
          - {content_key: "en.a1.unit16.lesson01.exercise01.listen_action", type: "listen_select", tested_text: "go to work", media_asset_key: "en.a1.audio.routines.verbs.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit16.lesson01.exercise02.choose_wake_up"
            type: "multiple_choice"
            tested_text: "wake up"
            prompt: {target_blocks: [{text: "Which phrase means to stop sleeping in the morning?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit16.lesson01.exercise03.choose_go_to_bed"
            type: "multiple_choice"
            tested_text: "go to bed"
            prompt: {target_blocks: [{text: "Which phrase means to start sleeping at night?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit16.lesson01.exercise04.match_routine_verbs", type: "matching_pairs", tested_text: "wake up get dressed go work have dinner", prompt: {target_blocks: []}, pairs: [{left: "wake up", right: "stop sleeping"}, {left: "get dressed", right: "shirt + pants"}, {left: "have dinner", right: "the evening meal"}, {left: "go to bed", right: "start sleeping"}, {left: "go to work", right: "leave home to do your job"}, {left: "have breakfast", right: "coffee and bread in the morning"}, {left: "then", right: "next in a sequence of events"}, {left: "morning", right: "the part of the day right after you wake up"}]}
          - {content_key: "en.a1.unit16.lesson01.exercise05.write_get_dressed", type: "writing_prompt", tested_text: "get dressed", prompt: {target_blocks: [{text: "Write the phrase for putting on your clothes.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit16.lesson02.routine_with_times"
        title: "Describing when you do things"
        spine_outcome_id: "universal.a1.routines.describe_daily_routine"
        teaching:
          - {content_key: "en.a1.unit16.lesson02.teach.what_time_wake_up", kind: "phrase", target: {text: "What time do you wake up?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "time", "do", "you", "wake", "up"]}
          - {content_key: "en.a1.unit16.lesson02.teach.i_wake_up_at", kind: "phrase", target: {text: "I wake up at seven every day.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "wake", "up", "at", "seven", "every", "day"]}
          - {content_key: "en.a1.unit16.lesson02.teach.in_the_morning", kind: "phrase", target: {text: "I get dressed in the morning.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "get", "dressed", "in", "the", "morning"]}
          - {content_key: "en.a1.unit16.lesson02.teach.usually_at_night", kind: "phrase", target: {text: "I usually go to bed at eleven.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "usually", "go", "to", "bed", "at", "eleven"]}
        exercises:
          - {content_key: "en.a1.unit16.lesson02.exercise01.listen_wake_question", type: "listen_select", tested_text: "What time do you wake up", media_asset_key: "en.a1.audio.routines.question.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit16.lesson02.exercise02.choose_wake_answer"
            type: "multiple_choice"
            tested_text: "I wake up at seven every day."
            prompt: {target_blocks: [{text: "What time do you wake up?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit16.lesson02.exercise03.order_usually_bed", type: "word_order", tested_text: "I usually go to bed at eleven", prompt: {target_blocks: []}, word_bank: ["usually", "I", "go", "to", "bed", "at", "eleven"]}
          - content_key: "en.a1.unit16.lesson02.exercise04.reply_wake_time"
            type: "dialogue_response"
            tested_text: "What time do you wake up I wake up at seven every day"
            prompt: {target_blocks: [{text: "What time do you wake up?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit16.lesson02.exercise05.write_morning_routine", type: "writing_prompt", tested_text: "I get dressed in the morning", prompt: {target_blocks: [{text: "Write that you get dressed in the morning.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit16.lesson03.reading_a_routine"
        title: "Reading about someone's routine"
        spine_outcome_id: "universal.a1.routines.describe_daily_routine"
        teaching:
          - {content_key: "en.a1.unit16.lesson03.teach.then", kind: "vocabulary", target: {text: "then", language_code: "en", direction: "ltr"}, introduced_tokens: ["then"], example: {text: "I eat breakfast, then I go to work.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit16.lesson03.teach.routine_text", kind: "reading", target: {text: "Every day, I wake up at seven. Then I get dressed and have breakfast.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Every", "day", "I", "wake", "up", "at", "seven", "Then", "get", "dressed", "and", "have", "breakfast"]}
        exercises:
          - content_key: "en.a1.unit16.lesson03.exercise01.read_wake_time"
            type: "reading_comprehension"
            tested_text: "seven"
            prompt: {target_blocks: [{text: "What time does the writer wake up?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit16.lesson03.exercise02.read_order_of_events"
            type: "reading_comprehension"
            tested_text: "wake up then get dressed then have breakfast"
            prompt: {target_blocks: [{text: "What is the order of activities in the morning?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit16.lesson03.exercise03.choose_first_activity"
            type: "multiple_choice"
            tested_text: "wake up"
            prompt: {target_blocks: [{text: "Which activity happens first?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit16.lesson03.exercise04.order_then_sentence", type: "word_order", tested_text: "Then I get dressed and have breakfast", prompt: {target_blocks: []}, word_bank: ["I", "get", "dressed", "and", "have", "breakfast", "Then"]}
          - {content_key: "en.a1.unit16.lesson03.exercise05.write_routine_sentence", type: "writing_prompt", tested_text: "Every day, I wake up at seven", prompt: {target_blocks: [{text: "Write that you wake up at seven every day.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit16.lesson04.routine_dialogue"
        title: "Talking about your daily routine"
        spine_outcome_id: "universal.a1.routines.describe_daily_routine"
        teaching:
          - {content_key: "en.a1.unit16.lesson04.teach.after_that", kind: "phrase", target: {text: "What do you do after that?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "do", "you", "do", "after", "that"]}
          - {content_key: "en.a1.unit16.lesson04.teach.q_wake_time", kind: "dialogue", target: {text: "What time do you wake up?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit16.lesson04.teach.a_wake_seven", kind: "dialogue", target: {text: "I wake up at seven every day.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a1.unit16.lesson04.teach.q_after_that", kind: "dialogue", target: {text: "What do you do after that?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit16.lesson04.teach.a_full_routine", kind: "dialogue", target: {text: "I get dressed, have breakfast, and go to work. I usually go to bed at eleven.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.a1.unit16.lesson04.exercise01.listen_wake_time_dialogue", type: "dialogue_comprehension", tested_text: "I wake up at seven every day", media_asset_key: "en.a1.audio.dialogue.daily_routine.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit16.lesson04.exercise02.listen_bed_time", type: "listen_select", tested_text: "I usually go to bed at eleven", media_asset_key: "en.a1.audio.dialogue.daily_routine.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit16.lesson04.exercise03.choose_morning_activities"
            type: "multiple_choice"
            tested_text: "get dressed, have breakfast, and go to work"
            prompt: {target_blocks: [{text: "What does Daniel do after waking up?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit16.lesson04.exercise04.order_after_that_question", type: "word_order", tested_text: "What do you do after that", prompt: {target_blocks: []}, word_bank: ["do", "you", "do", "after", "that", "What"]}
          - content_key: "en.a1.unit16.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I wake up at seven every day I get dressed have breakfast and go to work I usually go to bed at eleven"
            prompt: {target_blocks: [{text: "What time do you wake up? What do you do after that?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit16.lesson04.exercise06.speak_routine"
            type: "speak_response"
            tested_text: "I wake up at seven every day I get dressed have breakfast and go to work I usually go to bed at eleven"
            prompt: {target_blocks: [{text: "What time do you wake up? What do you do after that?", language_code: "en", direction: "ltr"}]}
