course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Work descriptions use simple present tense for occupation and workplace, with basic activity verbs (answer phones, write reports, help customers)."

media_assets:
  - {content_key: "en.a1.audio.work.jobs.nurse.01", language: "en", text: "nurse", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.work.question.01", language: "en", text: "What do you do? Where do you work?", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.work.description.01", language: "en", text: "I'm a nurse. I work at a hospital. I help patients and write reports every day.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.work_profile.01"
    language: "en"
    text: "Leila: What do you do, Daniel? Daniel: I'm an engineer. I work at a small company downtown. Leila: What do you do every day? Daniel: I write reports and answer emails. Sometimes I meet with clients. Leila: Do you like your job? Daniel: Yes, I do. It's interesting work."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit23.work"
    title: "Describing a job"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.work.describe_job"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit23.lesson01.occupation_words"
        title: "Common occupations"
        spine_outcome_id: "universal.a1.work.describe_job"
        teaching:
          - {content_key: "en.a1.unit23.lesson01.teach.teacher", kind: "vocabulary", target: {text: "teacher", language_code: "en", direction: "ltr"}, introduced_tokens: ["teacher"], example: {text: "My sister is a teacher.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit23.lesson01.teach.nurse", kind: "vocabulary", target: {text: "nurse", language_code: "en", direction: "ltr"}, introduced_tokens: ["nurse"], example: {text: "I'm a nurse.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit23.lesson01.teach.engineer", kind: "vocabulary", target: {text: "engineer", language_code: "en", direction: "ltr"}, introduced_tokens: ["engineer"], example: {text: "Daniel is an engineer.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit23.lesson01.teach.cook", kind: "vocabulary", target: {text: "cook", language_code: "en", direction: "ltr"}, introduced_tokens: ["cook"], example: {text: "My brother is a cook.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit23.lesson01.teach.driver", kind: "vocabulary", target: {text: "driver", language_code: "en", direction: "ltr"}, introduced_tokens: ["driver"], example: {text: "He's a bus driver.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit23.lesson01.exercise01.listen_job", type: "listen_select", tested_text: "nurse", media_asset_key: "en.a1.audio.work.jobs.nurse.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit23.lesson01.exercise02.choose_job_who_teaches", type: "multiple_choice", tested_text: "teacher", prompt: {target_blocks: [{text: "Which word describes someone who teaches students?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson01.exercise03.choose_job_who_drives", type: "multiple_choice", tested_text: "driver", prompt: {target_blocks: [{text: "Which word describes someone who drives for work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson01.exercise04.match_jobs", type: "matching_pairs", tested_text: "teacher nurse engineer cook driver", prompt: {target_blocks: [{text: "Match each meaning to the correct English job word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "teacher", right: "someone who teaches students"}, {left: "nurse", right: "someone who cares for sick people"}, {left: "engineer", right: "someone who designs and builds things"}, {left: "cook", right: "someone who prepares food"}, {left: "driver", right: "someone who drives for work"}]}
          - {content_key: "en.a1.unit23.lesson01.exercise05.write_engineer", type: "writing_prompt", tested_text: "engineer", prompt: {target_blocks: [{text: "Write the word for someone who designs and builds things.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit23.lesson02.what_do_you_do"
        title: "Asking about someone's job"
        spine_outcome_id: "universal.a1.work.describe_job"
        teaching:
          - {content_key: "en.a1.unit23.lesson02.teach.what_do_you_do", kind: "phrase", target: {text: "What do you do?", language_code: "en", direction: "ltr"}, introduced_tokens: ["What", "do", "you"]}
          - {content_key: "en.a1.unit23.lesson02.teach.im_a_nurse", kind: "phrase", target: {text: "I'm a nurse.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "a"]}
          - {content_key: "en.a1.unit23.lesson02.teach.where_do_you_work", kind: "phrase", target: {text: "Where do you work?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Where", "work"]}
        exercises:
          - {content_key: "en.a1.unit23.lesson02.exercise01.listen_question", type: "listen_select", tested_text: "What do you do", media_asset_key: "en.a1.audio.work.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit23.lesson02.exercise02.choose_nurse_answer", type: "multiple_choice", tested_text: "I'm a nurse.", prompt: {target_blocks: [{text: "Someone asks what you do, and you are a nurse. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson02.exercise03.order_where_do_you_work", type: "word_order", tested_text: "Where do you work", prompt: {target_blocks: []}, word_bank: ["do", "you", "work", "Where"]}
          - {content_key: "en.a1.unit23.lesson02.exercise04.reply_what_do_you_do", type: "dialogue_response", tested_text: "I'm a nurse", prompt: {target_blocks: [{text: "What do you do?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson02.exercise05.write_im_a_nurse", type: "writing_prompt", tested_text: "I'm a nurse.", prompt: {target_blocks: [{text: "Write that you are a nurse.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit23.lesson03.reading_a_work_profile"
        title: "Reading a work profile"
        spine_outcome_id: "universal.a1.work.describe_job"
        teaching:
          - {content_key: "en.a1.unit23.lesson03.teach.patients", kind: "vocabulary", target: {text: "patients", language_code: "en", direction: "ltr"}, introduced_tokens: ["patients"], example: {text: "I help patients every day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit23.lesson03.teach.profile_text", kind: "reading", target: {text: "I'm a nurse. I work at a hospital. I help patients and write reports every day.", language_code: "en", direction: "ltr"}, introduced_tokens: ["at", "hospital", "help", "and", "write", "reports", "every", "day"]}
        exercises:
          - {content_key: "en.a1.unit23.lesson03.exercise01.read_occupation", type: "reading_comprehension", tested_text: "a nurse", prompt: {target_blocks: [{text: "What is the writer's job?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson03.exercise02.read_workplace", type: "reading_comprehension", tested_text: "a hospital", prompt: {target_blocks: [{text: "Where does the writer work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson03.exercise03.choose_daily_activity", type: "multiple_choice", tested_text: "help patients and write reports", prompt: {target_blocks: [{text: "What does the writer do every day?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson03.exercise04.order_help_patients", type: "word_order", tested_text: "I help patients and write reports", prompt: {target_blocks: []}, word_bank: ["help", "patients", "and", "write", "reports", "I"]}
          - {content_key: "en.a1.unit23.lesson03.exercise05.write_own_profile", type: "writing_prompt", tested_text: "I work at a hospital.", prompt: {target_blocks: [{text: "Write that you work at a hospital.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit23.lesson04.work_profile_dialogue"
        title: "Talking about work"
        spine_outcome_id: "universal.a1.work.describe_job"
        teaching:
          - {content_key: "en.a1.unit23.lesson04.teach.interesting_work", kind: "phrase", target: {text: "It's interesting work.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "interesting"]}
          - {content_key: "en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel", kind: "dialogue", target: {text: "What do you do, Daniel?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Daniel"]}
          - {content_key: "en.a1.unit23.lesson04.teach.a_engineer_small_company", kind: "dialogue", target: {text: "I'm an engineer. I work at a small company downtown.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["an", "small", "company", "downtown"]}
          - {content_key: "en.a1.unit23.lesson04.teach.q_what_every_day", kind: "dialogue", target: {text: "What do you do every day?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit23.lesson04.teach.a_reports_emails_clients", kind: "dialogue", target: {text: "I write reports and answer emails. Sometimes I meet with clients.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["answer", "emails", "Sometimes", "meet", "with", "clients"]}
          - {content_key: "en.a1.unit23.lesson04.teach.q_like_your_job", kind: "dialogue", target: {text: "Do you like your job?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Do", "like", "your", "job"]}
          - {content_key: "en.a1.unit23.lesson04.teach.a_yes_interesting", kind: "dialogue", target: {text: "Yes, I do. It's interesting work.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes"]}
        exercises:
          - {content_key: "en.a1.unit23.lesson04.exercise01.listen_daniels_job", type: "dialogue_comprehension", tested_text: "an engineer", media_asset_key: "en.a1.audio.dialogue.work_profile.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit23.lesson04.exercise02.listen_daily_tasks", type: "listen_select", tested_text: "write reports and answer emails", media_asset_key: "en.a1.audio.dialogue.work_profile.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit23.lesson04.exercise03.choose_workplace_location", type: "multiple_choice", tested_text: "a small company downtown", prompt: {target_blocks: [{text: "Where does Daniel work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit23.lesson04.exercise04.order_do_you_like_job", type: "word_order", tested_text: "Do you like your job", prompt: {target_blocks: []}, word_bank: ["you", "like", "your", "job", "Do"]}
          - content_key: "en.a1.unit23.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I'm an engineer I work at a small company downtown I write reports and answer emails Sometimes I meet with clients Yes I do It's interesting work"
            prompt: {target_blocks: [{text: "What do you do, Daniel? What do you do every day? Do you like your job?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit23.lesson04.exercise06.speak_work_dialogue"
            type: "speak_response"
            tested_text: "I'm an engineer I work at a small company downtown I write reports and answer emails Sometimes I meet with clients Yes I do It's interesting work"
            prompt: {target_blocks: [{text: "What do you do, Daniel? What do you do every day? Do you like your job?", language_code: "en", direction: "ltr"}]}
