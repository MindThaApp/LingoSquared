        teaching:
          - {content_key: "en.b2.unit02.lesson01.teach.may", kind: "vocabulary", target: {text: "may", language_code: "en", direction: "ltr"}, introduced_tokens: ["may"], example: {text: "This may be true.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit02.lesson01.teach.might", kind: "vocabulary", target: {text: "might", language_code: "en", direction: "ltr"}, introduced_tokens: ["might"], example: {text: "This might be true.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit02.lesson01.teach.must", kind: "vocabulary", target: {text: "must", language_code: "en", direction: "ltr"}, introduced_tokens: ["must"], example: {text: "This must be true.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit02.lesson01.teach.cannot", kind: "vocabulary", target: {text: "cannot", language_code: "en", direction: "ltr"}, introduced_tokens: ["cannot"], example: {text: "This cannot be true.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit02.lesson01.teach.deduction", kind: "vocabulary", target: {text: "deduction", language_code: "en", direction: "ltr"}, introduced_tokens: ["deduction"], example: {text: "Mia's deduction is based on evidence.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b2.unit02.lesson01.teach.guesswork", kind: "vocabulary", target: {text: "guesswork", language_code: "en", direction: "ltr"}, introduced_tokens: ["guesswork"], example: {text: "Without evidence, the explanation would be guesswork.", language_code: "en", direction: "ltr"}}
