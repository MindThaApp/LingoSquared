          - {content_key: "en.b2.unit02.lesson01.exercise04.write_deduction", type: "writing_prompt", tested_text: "deduction", prompt: {target_blocks: [{text: "Write the word that means reasoning from evidence.", language_code: "en", direction: "ltr"}]}}
