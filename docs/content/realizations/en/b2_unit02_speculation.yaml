  - {content_key: "en.b2.audio.speculation.phrase.must_have.01", language: "en", text: "must have", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b2.audio.speculation.sentence.01", language: "en", text: "The server must have gone down overnight because no reports were generated.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b2.audio.dialogue.speculation.01"
    language: "en"
    text: "Daniel: None of the overnight reports were generated. Mia: The server must have gone down overnight. Daniel: It might have been a permission issue instead. Mia: Maybe, but the monitoring page is blank too, so it cannot have been only a report problem. Daniel: What consequences should we expect? Mia: The finance team may be missing the morning numbers, and the client dashboard might show old data. Daniel: So that is a deduction, not just a guess? Mia: Yes. The evidence is limited, but it points to a system outage."
    voice_hint: "two_adults_neutral_analytical"
    status: "pending_generation"

