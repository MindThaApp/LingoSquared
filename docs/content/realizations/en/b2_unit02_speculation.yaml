          - {content_key: "en.b2.unit02.lesson01.exercise02.choose_cannot", type: "multiple_choice", tested_text: "cannot", prompt: {target_blocks: [{text: "Which modal shows that the speaker believes something is impossible or nearly impossible?", language_code: "en", direction: "ltr"}]}}
