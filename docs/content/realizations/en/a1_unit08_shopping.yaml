units:
  - content_key: "en.a1.unit08.shopping"
    title: "Shopping: prices and quantities"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.shopping.ask_prices_quantities"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit08.lesson01.quantities"
        title: "Common shopping quantities"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit08.lesson01.teach.a_pound_of", kind: "phrase", target: {text: "a pound of apples", language_code: "en", direction: "ltr"}, introduced_tokens: ["a", "pound", "of", "apples"]}
          - {content_key: "en.a1.unit08.lesson01.teach.a_dozen", kind: "phrase", target: {text: "a dozen eggs", language_code: "en", direction: "ltr"}, introduced_tokens: ["a", "dozen", "eggs"]}
          - {content_key: "en.a1.unit08.lesson01.teach.a_bottle_of", kind: "phrase", target: {text: "a bottle of water", language_code: "en", direction: "ltr"}, introduced_tokens: ["a", "bottle", "of", "water"]}
          - {content_key: "en.a1.unit08.lesson01.teach.a_bag_of", kind: "phrase", target: {text: "a bag of rice", language_code: "en", direction: "ltr"}, introduced_tokens: ["a", "bag", "of", "rice"]}
          - {content_key: "en.a1.unit08.lesson01.teach.a_kilo_of", kind: "phrase", target: {text: "a kilo of tomatoes", language_code: "en", direction: "ltr"}, introduced_tokens: ["a", "kilo", "of", "tomatoes"]}
        exercises:
          - {content_key: "en.a1.unit08.lesson01.exercise01.listen_quantity", type: "listen_select", tested_text: "a dozen eggs", media_asset_key: "en.a1.audio.shopping.quantities.a_dozen_eggs.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit08.lesson01.exercise02.choose_dozen"
            type: "multiple_choice"
            tested_text: "a dozen"
            prompt: {target_blocks: [{text: "Twelve eggs together are called...", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit08.lesson01.exercise03.choose_bottle"
            type: "multiple_choice"
            tested_text: "a bottle of water"
            prompt: {target_blocks: [{text: "Which phrase means one container of water?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit08.lesson01.exercise04.match_quantities", type: "matching_pairs", tested_text: "pound dozen bottle bag", prompt: {target_blocks: []}, pairs: [{left: "pound", right: "weight unit for apples"}, {left: "dozen", right: "twelve of something"}, {left: "bottle", right: "container for water"}, {left: "bag", right: "container for rice"}, {left: "kilo", right: "weight unit for tomatoes"}]}
          - {content_key: "en.a1.unit08.lesson01.exercise05.write_kilo", type: "writing_prompt", tested_text: "a kilo of tomatoes", prompt: {target_blocks: [{text: "Write how you ask for one kilo of tomatoes.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit08.lesson02.asking_prices"
        title: "Asking about prices"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit08.lesson02.teach.how_much_are", kind: "phrase", target: {text: "How much are the apples?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "much", "are", "the", "apples"]}
          - {content_key: "en.a1.unit08.lesson02.teach.two_dollars_a_pound", kind: "phrase", target: {text: "They're two dollars a pound.", language_code: "en", direction: "ltr"}, introduced_tokens: ["They're", "two", "dollars", "a", "pound"]}
          - {content_key: "en.a1.unit08.lesson02.teach.can_i_have_two_pounds", kind: "phrase", target: {text: "Can I have two pounds, please?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Can", "I", "have", "two", "pounds", "please"]}
          - {content_key: "en.a1.unit08.lesson02.teach.is_it_fresh", kind: "phrase", target: {text: "Is it fresh?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Is", "it", "fresh"]}
        exercises:
          - {content_key: "en.a1.unit08.lesson02.exercise01.listen_price_question", type: "listen_select", tested_text: "How much are the apples", media_asset_key: "en.a1.audio.shopping.price_question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit08.lesson02.exercise02.listen_price_answer", type: "listen_select", tested_text: "They're two dollars a pound", media_asset_key: "en.a1.audio.shopping.price_answer.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit08.lesson02.exercise03.order_price_question", type: "word_order", tested_text: "How much are the apples", prompt: {target_blocks: []}, word_bank: ["much", "are", "the", "apples", "How"]}
          - content_key: "en.a1.unit08.lesson02.exercise04.reply_price"
            type: "dialogue_response"
            tested_text: "How much are the apples They're two dollars a pound"
            prompt: {target_blocks: [{text: "How much are the apples?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit08.lesson02.exercise05.write_request", type: "writing_prompt", tested_text: "Can I have two pounds, please?", prompt: {target_blocks: [{text: "Write how you ask for two pounds politely.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit08.lesson03.reading_price_labels"
        title: "Reading price and quantity labels"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit08.lesson03.teach.per_pound", kind: "vocabulary", target: {text: "per pound", language_code: "en", direction: "ltr"}, introduced_tokens: ["per", "pound"], example: {text: "Apples are two dollars per pound.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit08.lesson03.teach.label_text", kind: "reading", target: {text: "Apples: $2 per pound. Eggs: $4 a dozen. Rice: $3 a bag.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Apples", "per", "pound", "Eggs", "a", "dozen", "Rice", "bag", "2", "4", "3"]}
        exercises:
          - content_key: "en.a1.unit08.lesson03.exercise01.read_apple_price"
            type: "reading_comprehension"
            tested_text: "Apples $2 per pound"
            prompt: {target_blocks: [{text: "How much are apples per pound?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit08.lesson03.exercise02.read_egg_price"
            type: "reading_comprehension"
            tested_text: "Eggs $4 a dozen"
            prompt: {target_blocks: [{text: "How much is a dozen eggs?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit08.lesson03.exercise03.choose_cheapest_item"
            type: "multiple_choice"
            tested_text: "Apples"
            prompt: {target_blocks: [{text: "Which item is the cheapest?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit08.lesson03.exercise04.match_labels", type: "matching_pairs", tested_text: "Apples Eggs Rice pound", prompt: {target_blocks: []}, pairs: [{left: "Apples", right: "$2 per pound"}, {left: "Eggs", right: "$4 a dozen"}, {left: "Rice", right: "$3 a bag"}, {left: "Water", right: "sold by the bottle"}, {left: "Tomatoes", right: "sold by the kilo"}, {left: "the total price", right: "eight dollars"}]}
          - {content_key: "en.a1.unit08.lesson03.exercise05.write_apple_total", type: "writing_prompt", tested_text: "Apples are $2 per pound", prompt: {target_blocks: [{text: "Write the price of apples per pound.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit08.lesson04.market_dialogue"
        title: "At the market"
        spine_outcome_id: "universal.a1.shopping.ask_prices_quantities"
        teaching:
          - {content_key: "en.a1.unit08.lesson04.teach.thats_x_dollars", kind: "phrase", target: {text: "That's eight dollars.", language_code: "en", direction: "ltr"}, introduced_tokens: ["That's", "eight", "dollars"]}
          - {content_key: "en.a1.unit08.lesson04.teach.q_price", kind: "dialogue", target: {text: "How much are the apples?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a1.unit08.lesson04.teach.a_price", kind: "dialogue", target: {text: "They're two dollars a pound.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit08.lesson04.teach.q_two_pounds", kind: "dialogue", target: {text: "OK, can I have two pounds, please?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["OK"]}
          - {content_key: "en.a1.unit08.lesson04.teach.a_sure_anything_else", kind: "dialogue", target: {text: "Sure. Anything else?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Sure", "Anything", "else"]}
          - {content_key: "en.a1.unit08.lesson04.teach.q_eggs_too", kind: "dialogue", target: {text: "Yes, a dozen eggs too.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "too"]}
          - {content_key: "en.a1.unit08.lesson04.teach.a_total", kind: "dialogue", target: {text: "That's eight dollars.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.a1.unit08.lesson04.exercise01.listen_apple_price", type: "dialogue_comprehension", tested_text: "They're two dollars a pound", media_asset_key: "en.a1.audio.dialogue.market_shopping.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit08.lesson04.exercise02.listen_total", type: "listen_select", tested_text: "That's eight dollars", media_asset_key: "en.a1.audio.dialogue.market_shopping.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit08.lesson04.exercise03.choose_extra_item"
            type: "multiple_choice"
            tested_text: "a dozen eggs"
            prompt: {target_blocks: [{text: "What else does Daniel buy besides apples?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit08.lesson04.exercise04.order_two_pounds_request", type: "word_order", tested_text: "Can I have two pounds please", prompt: {target_blocks: []}, word_bank: ["I", "have", "two", "pounds", "please", "Can"]}
          - content_key: "en.a1.unit08.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "They're two dollars a pound Sure Anything else That's eight dollars"
            prompt: {target_blocks: [{text: "How much are the apples? Can I have two pounds, please? Yes, a dozen eggs too.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit08.lesson04.exercise06.speak_shopping"
            type: "speak_response"
            tested_text: "They're two dollars a pound Sure Anything else That's eight dollars"
            prompt: {target_blocks: [{text: "How much are the apples? Can I have two pounds, please? Yes, a dozen eggs too.", language_code: "en", direction: "ltr"}]}
