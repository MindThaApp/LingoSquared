  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Personal-care service register is a simple, everyday spoken exchange between a customer and a hairdresser about a basic haircut or trim: asking for the service, describing a simple style preference (the same style, a little shorter), and asking the price. Core vocabulary (haircut/hairdresser/trim/shorter/style/wash) is deliberately generic to a routine haircut or trim, not hairstyling-technique jargon (no discussion of specific cuts, coloring, or salon-industry terminology) and not a formal appointment-booking call (that register belongs to unit47's appointment outcome; this unit is a walk-in-style in-person request, per the spine's own can_do line)."

