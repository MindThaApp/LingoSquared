          - {content_key: "en.a1.unit52.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Trip to the Hairdresser: Daniel's sister was coming to visit from Chicago next week, so he decided to get a haircut. Mia recommended her favorite hairdresser, a small salon near her apartment, and went with him. The hairdresser asked what style he wanted, and he said the same style, just a little shorter. She washed his hair first, and the wash was included with the haircut. The haircut cost twenty dollars. When they finished, Mia said his hair looked great. On their way home, they met Leila for coffee. She was feeling much better after her cold, and she loved Daniel's new haircut too.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Trip", "to", "Daniel", "was", "coming", "visit", "from", "Chicago", "so", "he", "decided", "get", "Mia", "recommended", "her", "favorite", "small", "salon", "near", "apartment", "went", "him", "asked", "wanted", "said", "washed", "When", "they", "finished", "looked", "On", "their", "way", "home", "met", "Leila", "for", "coffee", "feeling", "better", "after", "cold", "loved", "new", "too"]}
        exercises:
          - {content_key: "en.a1.unit52.lesson04.exercise01.reading_haircut_reason", type: "multiple_choice", tested_text: "his sister was visiting", prompt: {target_blocks: [{text: "According to the reading, why did Daniel decide to get a haircut?", language_code: "en", direction: "ltr"}]}}
