units:
  - content_key: "en.a1.unit13.emotions"
    title: "Talking about feelings"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.emotions.express_basic_feelings"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit13.lesson01.feeling_words"
        title: "Common feeling words"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit13.lesson01.teach.happy", kind: "vocabulary", target: {text: "happy", language_code: "en", direction: "ltr"}, introduced_tokens: ["happy"], example: {text: "I'm happy today.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit13.lesson01.teach.sad", kind: "vocabulary", target: {text: "sad", language_code: "en", direction: "ltr"}, introduced_tokens: ["sad"], example: {text: "She looks sad.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit13.lesson01.teach.tired", kind: "vocabulary", target: {text: "tired", language_code: "en", direction: "ltr"}, introduced_tokens: ["tired"], example: {text: "I'm very tired.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit13.lesson01.teach.excited", kind: "vocabulary", target: {text: "excited", language_code: "en", direction: "ltr"}, introduced_tokens: ["excited"], example: {text: "I'm excited about tomorrow.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit13.lesson01.teach.worried", kind: "vocabulary", target: {text: "worried", language_code: "en", direction: "ltr"}, introduced_tokens: ["worried"], example: {text: "He's worried about tomorrow.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit13.lesson01.exercise01.listen_feeling", type: "listen_select", tested_text: "tired", media_asset_key: "en.a1.audio.emotions.feelings.tired.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit13.lesson01.exercise02.choose_sad"
            type: "multiple_choice"
            tested_text: "sad"
            prompt: {target_blocks: [{text: "The opposite of happy is...", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit13.lesson01.exercise03.choose_worried"
            type: "multiple_choice"
            tested_text: "worried"
            prompt: {target_blocks: [{text: "Which word describes feeling nervous about something that might happen?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit13.lesson01.exercise04.match_feeling_words", type: "matching_pairs", tested_text: "happy sad tired excited", prompt: {target_blocks: []}, pairs: [{left: "happy", right: "feeling good"}, {left: "sad", right: "feeling bad"}, {left: "tired", right: "needing rest"}, {left: "excited", right: "looking forward to something"}, {left: "today", right: "the day you are in right now"}, {left: "tomorrow", right: "the day right after today"}]}
          - {content_key: "en.a1.unit13.lesson01.exercise05.write_worried", type: "writing_prompt", tested_text: "worried", prompt: {target_blocks: [{text: "Write the word for feeling nervous about something that might happen.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit13.lesson02.expressing_feelings_with_reasons"
        title: "Saying how you feel and why"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit13.lesson02.teach.how_are_you_feeling", kind: "phrase", target: {text: "How are you feeling today?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "are", "you", "feeling", "today"]}
          - {content_key: "en.a1.unit13.lesson02.teach.im_worried_because", kind: "phrase", target: {text: "I'm a little worried because I have a big test tomorrow.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "a", "little", "worried", "because", "I", "have", "big", "test", "tomorrow"]}
          - {content_key: "en.a1.unit13.lesson02.teach.im_happy_because", kind: "phrase", target: {text: "I'm happy because the class is almost over.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "happy", "because", "the", "class", "is", "almost", "over"]}
        exercises:
          - {content_key: "en.a1.unit13.lesson02.exercise01.listen_feeling_question", type: "listen_select", tested_text: "How are you feeling today", media_asset_key: "en.a1.audio.emotions.question.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit13.lesson02.exercise02.choose_feeling_answer"
            type: "multiple_choice"
            tested_text: "I'm a little worried because I have a big test tomorrow."
            prompt: {target_blocks: [{text: "How are you feeling today?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit13.lesson02.exercise03.order_happy_because", type: "word_order", tested_text: "I'm happy because the class is almost over", prompt: {target_blocks: []}, word_bank: ["happy", "I'm", "because", "the", "class", "is", "almost", "over"]}
          - content_key: "en.a1.unit13.lesson02.exercise04.reply_feeling_reason"
            type: "dialogue_response"
            tested_text: "How are you feeling today I'm a little worried because I have a big test tomorrow"
            prompt: {target_blocks: [{text: "How are you feeling today?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit13.lesson02.exercise05.write_feeling", type: "writing_prompt", tested_text: "I'm happy because the class is almost over", prompt: {target_blocks: [{text: "Write that you are happy because the class is almost over.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit13.lesson03.reading_a_message"
        title: "Reading a message about feelings"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit13.lesson03.teach.message_text", kind: "reading", target: {text: "Hi, I'm a little worried because I have a big test tomorrow. But I'm also excited because it's the last one this year!", language_code: "en", direction: "ltr"}, introduced_tokens: ["Hi", "I'm", "a", "little", "worried", "because", "I", "have", "big", "test", "tomorrow", "But", "also", "excited", "it's", "the", "last", "one", "this", "year"]}
          - {content_key: "en.a1.unit13.lesson03.teach.writer_summary", kind: "phrase", target: {text: "The writer is worried and excited.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "writer", "is", "worried", "and", "excited"]}
        exercises:
          - content_key: "en.a1.unit13.lesson03.exercise01.read_worry_reason"
            type: "reading_comprehension"
            tested_text: "big test tomorrow"
            prompt: {target_blocks: [{text: "Why is the writer worried?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit13.lesson03.exercise02.read_excited_reason"
            type: "reading_comprehension"
            tested_text: "it's the last one this year"
            prompt: {target_blocks: [{text: "Why is the writer also excited?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit13.lesson03.exercise03.choose_both_feelings"
            type: "multiple_choice"
            tested_text: "worried and excited"
            prompt: {target_blocks: [{text: "Which two feelings does the writer mention?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit13.lesson03.exercise04.order_message_sentence", type: "word_order", tested_text: "I have a big test tomorrow", prompt: {target_blocks: []}, word_bank: ["have", "a", "big", "test", "tomorrow", "I"]}
          - {content_key: "en.a1.unit13.lesson03.exercise05.write_message_summary", type: "writing_prompt", tested_text: "The writer is worried and excited", prompt: {target_blocks: [{text: "Write the two feelings the writer has, in one sentence.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit13.lesson04.feelings_check_dialogue"
        title: "Checking in on someone's feelings"
        spine_outcome_id: "universal.a1.emotions.express_basic_feelings"
        teaching:
          - {content_key: "en.a1.unit13.lesson04.teach.i_understand", kind: "phrase", target: {text: "Oh, I understand.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Oh", "I", "understand"]}
          - {content_key: "en.a1.unit13.lesson04.teach.q_feeling", kind: "dialogue", target: {text: "How are you feeling today?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit13.lesson04.teach.a_worried_test", kind: "dialogue", target: {text: "I'm a little worried because I have a big test tomorrow.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: []}
          - {content_key: "en.a1.unit13.lesson04.teach.acknowledge_and_ask", kind: "dialogue", target: {text: "Oh, I understand. Are you excited too?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Are", "you", "excited", "too"]}
          - {content_key: "en.a1.unit13.lesson04.teach.a_yes_happy_class", kind: "dialogue", target: {text: "Yes, a little. I'm happy the class is almost over.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "a", "little", "I'm", "happy", "the", "class", "is", "almost", "over"]}
        exercises:
          - {content_key: "en.a1.unit13.lesson04.exercise01.listen_daniels_feeling", type: "dialogue_comprehension", tested_text: "I'm a little worried because I have a big test tomorrow", media_asset_key: "en.a1.audio.dialogue.feelings_check.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit13.lesson04.exercise02.listen_happy_reason", type: "listen_select", tested_text: "the class is almost over", media_asset_key: "en.a1.audio.dialogue.feelings_check.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit13.lesson04.exercise03.choose_leila_response"
            type: "multiple_choice"
            tested_text: "Oh, I understand. Are you excited too?"
            prompt: {target_blocks: [{text: "After hearing Daniel is worried, what does Leila say?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit13.lesson04.exercise04.order_q_feeling", type: "word_order", tested_text: "how are you feeling today", prompt: {target_blocks: []}, word_bank: ["are", "you", "feeling", "today", "how"]}
          - content_key: "en.a1.unit13.lesson04.exercise05.reply_as_daniel"
            type: "dialogue_response"
            tested_text: "I'm a little worried because I have a big test tomorrow Yes a little I'm happy the class is almost over"
            prompt: {target_blocks: [{text: "How are you feeling today? Are you excited too?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit13.lesson04.exercise06.speak_feelings"
            type: "speak_response"
            tested_text: "I'm a little worried because I have a big test tomorrow Yes a little I'm happy the class is almost over"
            prompt: {target_blocks: [{text: "How are you feeling today? Are you excited too?", language_code: "en", direction: "ltr"}]}
