  - {content_key: "en.a1.audio.post.phrases.express_mail.01", language: "en", text: "express mail", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.post.01"
    language: "en"
    text: "Daniel: Hi, I'd like to send this package, please. Clerk: Sure! Where is it going? Daniel: To Chicago. It's a birthday gift for my sister. Clerk: Do you want regular or express mail? Express takes about two days. Daniel: I'll take express, please. How much is that? Clerk: That's twelve dollars. Here's your receipt. Daniel: Thank you! Have a good day."
    voice_hint: "two_adults_neutral_polite"
    status: "pending_generation"

