        title: "Reading: Three trips to the post office"
        spine_outcome_id: "universal.a1.post.send_receive_mail"
        teaching:
          - {content_key: "en.a1.unit40.lesson04.teach.reading_passage", kind: "reading", target: {text: "Daniel, Leila, and Mia all know their way around the post office. Last week, Daniel sent a birthday package to his sister in Chicago. He paid for express mail because he wanted it to arrive quickly, and it took only two days. Leila is getting ready to move near Mia, so she went to the post office to send some old books to her parents. The clerk weighed the package and gave her a stamp for it. Leila asked how long the package would take, and the clerk said about a week, since she chose regular mail. Mia doesn't send packages very often, but she always buys a stamp for the letters she writes to her grandmother. She says a letter with a stamp feels more personal than a text message.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Daniel", "Leila", "and", "Mia", "all", "know", "their", "way", "around", "the", "post", "office", "Last", "week", "sent", "a", "birthday", "package", "his", "sister", "in", "Chicago", "He", "paid", "for", "express", "mail", "because", "he", "wanted", "it", "to", "arrive", "quickly", "took", "only", "two", "days", "is", "getting", "ready", "move", "near", "so", "she", "went", "some", "old", "books", "her", "parents", "The", "clerk", "weighed", "gave", "stamp", "asked", "how", "long", "would", "said", "about", "a", "week", "since", "chose", "regular", "doesn't", "send", "packages", "very", "often", "but", "always", "buys", "letters", "writes", "grandmother", "says", "letter", "with", "feels", "more", "personal", "than", "text", "message"]}
        exercises:
