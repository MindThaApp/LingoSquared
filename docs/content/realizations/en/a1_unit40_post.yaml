          - {content_key: "en.a1.unit40.lesson04.exercise03.reading_mia_stamp_habit", type: "multiple_choice", tested_text: "stamp", prompt: {target_blocks: [{text: "According to the reading, what does Mia always buy for the letters she writes to her grandmother?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit40.lesson04.exercise04.write_own_mail_sentence", type: "writing_prompt", tested_text: "package", prompt: {target_blocks: [{text: "Write one sentence about sending a letter or package, using \"I send/sent a ...\" or \"I need a stamp for ...\".", language_code: "en", direction: "ltr"}]}, accepted_answers: ["I send a package", "I send a package.", "I sent a package", "I sent a package.", "I need a stamp for this letter", "I need a stamp for this letter.", "I need a stamp for this postcard", "I need a stamp for this postcard."]}
