course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Post-office language stays in simple present/future tense with fixed verb+object collocations that must be memorized: send a letter, buy a stamp, write the address. Keep the register polite and transactional, appropriate for a customer speaking with a post-office clerk, not formal courier/customs/business-shipping register."

