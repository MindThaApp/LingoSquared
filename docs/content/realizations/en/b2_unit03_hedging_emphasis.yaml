    language: "en"
    text: "Leila: The new review policy seems reasonable overall. Daniel: That sounds a little cautious. Are you saying it isn't fully ready? Leila: Exactly. It may be workable, but it needs clearer deadlines. Daniel: I agree. What worries me is the extra work for the team. Leila: Exactly. The policy does create better quality checks, but it also adds another approval step. Daniel: So we should support it with conditions? Leila: Yes. I would say it is broadly useful, provided the timeline is adjusted."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

