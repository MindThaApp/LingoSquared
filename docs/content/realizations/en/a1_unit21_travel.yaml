          - {content_key: "en.a1.unit21.lesson02.exercise05.write_ticket_request", type: "writing_prompt", tested_text: "One ticket to Boston, please.", prompt: {target_blocks: [{text: "Write that you want one ticket to Boston.", language_code: "en", direction: "ltr"}]}}

