          - {content_key: "en.a1.unit21.lesson02.exercise02.choose_ticket_request", type: "multiple_choice", tested_text: "One ticket to Boston, please.", prompt: {target_blocks: [{text: "You want to buy a ticket to Boston. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit21.lesson02.exercise03.order_one_way_or_round_trip", type: "word_order", tested_text: "One way or round trip", prompt: {target_blocks: []}, word_bank: ["way", "or", "round", "trip", "One"]}
