          - {content_key: "en.a1.unit21.lesson04.teach.a_forty_platform_915", kind: "dialogue", target: {text: "That's forty dollars. Your train leaves from platform 4 at 9:15.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["Your"]}
          - {content_key: "en.a1.unit21.lesson04.teach.q_what_time_arrive", kind: "dialogue", target: {text: "What time does it arrive in Boston?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "time", "does", "arrive", "in"]}
          - {content_key: "en.a1.unit21.lesson04.teach.a_arrives_1130", kind: "dialogue", target: {text: "It arrives at 11:30.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: []}
        exercises:
