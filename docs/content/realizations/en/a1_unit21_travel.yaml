          - {content_key: "en.a1.unit21.lesson01.teach.train", kind: "vocabulary", target: {text: "train", language_code: "en", direction: "ltr"}, introduced_tokens: ["train"], example: {text: "The train is late.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit21.lesson01.teach.departure", kind: "vocabulary", target: {text: "departure", language_code: "en", direction: "ltr"}, introduced_tokens: ["departure"], example: {text: "The departure time is 9:15.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit21.lesson01.teach.arrival", kind: "vocabulary", target: {text: "arrival", language_code: "en", direction: "ltr"}, introduced_tokens: ["arrival"], example: {text: "The arrival time is 11:30.", language_code: "en", direction: "ltr"}}
        exercises:
