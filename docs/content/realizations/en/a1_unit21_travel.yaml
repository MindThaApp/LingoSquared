            prompt: {target_blocks: [{text: "The clerk asks: One way or round trip? That's forty dollars. Your train leaves from platform 4 at 9:15.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit21.lesson04.exercise06.speak_ticket_dialogue"
            type: "speak_response"
            tested_text: "One ticket to Boston please Round trip please What time does it arrive in Boston"
            prompt: {target_blocks: [{text: "The clerk asks: One way or round trip? That's forty dollars. Your train leaves from platform 4 at 9:15.", language_code: "en", direction: "ltr"}]}
