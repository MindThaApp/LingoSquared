          - {content_key: "en.a1.unit21.lesson01.exercise03.choose_opposite_of_departure", type: "multiple_choice", tested_text: "arrival", prompt: {target_blocks: [{text: "What is the opposite of 'departure'?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit21.lesson01.exercise04.match_travel_words", type: "matching_pairs", tested_text: "ticket platform train departure arrival", prompt: {target_blocks: [{text: "Match each meaning to the correct English travel word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "what you need to show before boarding a train", right: "ticket"}, {left: "where you wait to get on a train", right: "platform"}, {left: "the vehicle that runs on rails", right: "train"}, {left: "the time a train leaves", right: "departure"}, {left: "the opposite of departure", right: "arrival"}, {left: "a ticket to travel somewhere and come back", right: "round trip"}, {left: "a ticket to travel somewhere without coming back", right: "one way"}, {left: "what a train does when it exits from a platform", right: "leaves from"}]}
          - {content_key: "en.a1.unit21.lesson01.exercise05.write_platform", type: "writing_prompt", tested_text: "platform", prompt: {target_blocks: [{text: "Write the word for where you wait to get on a train.", language_code: "en", direction: "ltr"}]}}

