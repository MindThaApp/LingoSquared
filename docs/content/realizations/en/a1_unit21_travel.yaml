          - {content_key: "en.a1.unit21.lesson03.exercise02.read_platform_number", type: "reading_comprehension", tested_text: "platform 4", prompt: {target_blocks: [{text: "Which platform does the train leave from?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit21.lesson03.exercise03.choose_arrival_time", type: "multiple_choice", tested_text: "11:30", prompt: {target_blocks: [{text: "What time does the train arrive in Boston?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit21.lesson03.exercise04.order_leaves_from_platform", type: "word_order", tested_text: "It leaves from platform 4", prompt: {target_blocks: []}, word_bank: ["leaves", "from", "platform", "4", "It"]}
          - {content_key: "en.a1.unit21.lesson03.exercise05.write_ticket_summary", type: "writing_prompt", tested_text: "My ticket is for the 9:15 train to Boston.", prompt: {target_blocks: [{text: "Write that your ticket is for the 9:15 train to Boston.", language_code: "en", direction: "ltr"}]}}

