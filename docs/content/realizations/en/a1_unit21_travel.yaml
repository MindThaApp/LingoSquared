        title: "Tickets, platforms, and trains"
        spine_outcome_id: "universal.a1.travel.handle_basic_journey"
        teaching:
          - {content_key: "en.a1.unit21.lesson01.teach.ticket", kind: "vocabulary", target: {text: "ticket", language_code: "en", direction: "ltr"}, introduced_tokens: ["ticket"], example: {text: "I need a ticket to Boston.", language_code: "en", direction: "ltr"}}
