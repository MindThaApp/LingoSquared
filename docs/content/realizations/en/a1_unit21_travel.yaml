        spine_outcome_id: "universal.a1.travel.handle_basic_journey"
        teaching:
          - {content_key: "en.a1.unit21.lesson03.teach.leaves_from", kind: "vocabulary", target: {text: "leaves from", language_code: "en", direction: "ltr"}, introduced_tokens: ["leaves", "from"], example: {text: "The train leaves from platform 4.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit21.lesson03.teach.ticket_text", kind: "reading", target: {text: "My ticket is for the 9:15 train to Boston. It leaves from platform 4 and arrives at 11:30.", language_code: "en", direction: "ltr"}, introduced_tokens: ["My", "is", "for", "the", "9:15", "train", "Boston", "It", "leaves", "from", "platform", "4", "and", "arrives", "at", "11:30"]}
        exercises:
