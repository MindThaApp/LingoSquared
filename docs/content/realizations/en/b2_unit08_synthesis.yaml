          - {content_key: "en.b2.unit08.lesson01.exercise05_write_judgement", type: "writing_prompt", tested_text: "judgment", prompt: {target_blocks: [{text: "Write the word that means a reasoned decision about support.", language_code: "en", direction: "ltr"}]}}

