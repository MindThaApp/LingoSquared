          - content_key: "en.b2.unit08.lesson03.teach.source_b"
            kind: "reading"
            target: {text: "Source B: The operator report agrees that demand increased after the hospital opened, but it identifies driver shortages as the main cause of late service. The report includes staffing records for the same period.", language_code: "en", direction: "ltr"}
