          - {content_key: "en.b2.unit08.lesson01.teach.evaluate", kind: "vocabulary", target: {text: "evaluate", language_code: "en", direction: "ltr"}, introduced_tokens: ["evaluate"], example: {text: "To evaluate is to judge how strong something is.", language_code: "en", direction: "ltr"}}
