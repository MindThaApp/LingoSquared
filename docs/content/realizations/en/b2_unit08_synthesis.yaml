    language: "en"
    text: "Tessa: I read two accounts of the late bus service. The passenger survey says demand increased after the new hospital opened. Rowan: The operator report agrees that demand increased, but it says the main problem was driver shortages. Tessa: So the sources agree on higher demand but conflict about the cause. Rowan: Which account is better supported? Tessa: The survey has many passenger comments, but the operator report includes staffing records. Rowan: Then your judgment? Tessa: The operator report is better supported on the cause, although the survey is useful for showing the passenger experience."
    voice_hint: "two_adults_neutral_analytical"
    status: "pending_generation"

units:
