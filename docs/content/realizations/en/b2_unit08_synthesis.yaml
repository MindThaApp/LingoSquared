          - {content_key: "en.b2.unit08.lesson02.teach_by_contrast", kind: "phrase", target: {text: "By contrast, the operator report includes staffing records.", language_code: "en", direction: "ltr"}, introduced_tokens: ["operator", "includes", "staffing", "records"], media_asset_key: "en.b2.audio.synthesis.phrase.by_contrast.01"}
          - {content_key: "en.b2.unit08.lesson02.teach_better_supported", kind: "phrase", target: {text: "The operator report is better supported on the cause.", language_code: "en", direction: "ltr"}, introduced_tokens: ["better", "supported"]}
