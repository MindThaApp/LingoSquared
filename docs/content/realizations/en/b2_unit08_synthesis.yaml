          - {content_key: "en.b2.unit08.lesson01.exercise02_choose_conflict", type: "multiple_choice", tested_text: "conflict", prompt: {target_blocks: [{text: "Which word means the sources disagree?", language_code: "en", direction: "ltr"}]}}
