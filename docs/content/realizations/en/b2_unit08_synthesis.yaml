            tested_text: "Both sources agree that demand increased, but they disagree about the cause."
            prompt: {target_blocks: [{text: "Write exactly this synthesis sentence: 'Both sources agree that demand increased, but they disagree about the cause.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
