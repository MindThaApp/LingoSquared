          - {content_key: "en.b2.unit08.lesson04.exercise02_listen_judgement", type: "listen_select", tested_text: "The operator report is better supported on the cause", media_asset_key: "en.b2.audio.dialogue.synthesis.01", prompt: {target_blocks: []}}
