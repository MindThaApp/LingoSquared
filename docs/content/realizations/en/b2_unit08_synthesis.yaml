              - {value: "Both sources agree that demand increased but they disagree about the cause.", status: "correct"}
          - content_key: "en.b2.unit08.lesson02.exercise05_write_judgement"
            type: "writing_prompt"
            tested_text: "The operator report is better supported on the cause."
            prompt: {target_blocks: [{text: "Write exactly this judgment: 'The operator report is better supported on the cause.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
