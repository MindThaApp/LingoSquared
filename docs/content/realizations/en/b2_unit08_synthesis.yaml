          - {content_key: "en.b2.unit08.lesson01.teach.judgement", kind: "vocabulary", target: {text: "judgment", language_code: "en", direction: "ltr"}, introduced_tokens: ["judgment"], example: {text: "A judgment explains which source is stronger.", language_code: "en", direction: "ltr"}}
