          - content_key: "en.b2.unit08.lesson03.exercise04_write_agreement"
            type: "writing_prompt"
            tested_text: "Both sources agree that demand increased after the hospital opened."
            prompt: {target_blocks: [{text: "Write exactly: 'Both sources agree that demand increased after the hospital opened.'", language_code: "en", direction: "ltr"}]}
            accepted_answers:
