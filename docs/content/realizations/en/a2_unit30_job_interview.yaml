schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Firecrawl was unavailable this session (402, out of credits) and no
    cached scrape existed in .firecrawl/ for A2 ESL job-interview material.
    Authored directly from established ESL A2 conventions (the can-do
    statement and assessment_requirements in universal_spine.yaml's
    universal.a2.employment.attend_job_interview node) and this unit's
    own predecessor pattern (en/a2_unit25_bureaucracy.yaml's formal-
    register scaffold), not adapted from any specific public-domain
    course. Not previously established in the shared corpus: Mia's
    occupation. This unit introduces her looking for a NEW job
    (marketing coordinator) so it does not assert or contradict any
    prior stated occupation for her -- flagging explicitly for the
    fresh-context review per AUTHORING_GUIDE §11.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    First of 5 new A2 units closing the en-realization gap against fa/prs's
    a2_unit14-18 (job interview, travel disruption, online habits, weekly
    schedule, shopping complaint) -- spine outcome
    universal.a2.employment.attend_job_interview. Continues the
    Daniel/Leila/Mia storyline: Mia is interviewing for a marketing
    coordinator role. Checked Mia's established facts (a1_unit42
    "about to start a new work project with Daniel" is vague enough not
    to conflict with her now interviewing for a different position
    elsewhere) before drafting. Every multi-clause accepted_answers
    entry authored with period/conjunction-joined forms per §12. Every
    fact (2 years' experience, "next Monday" start date, "Bright Path
    Marketing") stated consistently across lesson03's job posting and
    lesson04's dialogue per §11.

    2026-07-11 fresh-context review (Claude, zero access to the authoring
    reasoning): realization content reads clean and internally consistent; no
    realization-level edit needed for this unit. MIA-OCCUPATION VERDICT
    (judgment-flag, deliberately NOT changed -- resolving it would be authoring,
    not reviewing): the corpus firmly establishes Mia as a current coworker of
    Daniel and Leila (a1_unit31 "a new coworker starting today. Her name is Mia",
    a1_unit34 "Mia is new to the team", a1_unit37 "the three coworkers",
    a1_unit42/43 "a new work project with Daniel"). Casting her here as a
    candidate interviewing for a marketing-coordinator role at a DIFFERENT
    company (Bright Path Marketing) is not an outright factual contradiction --
    she can job-hunt while employed and her "two years in social media
    marketing" background is compatible with a marketing role -- but it sits in
    mild tension with the ongoing three-coworkers storyline. The author's
    provenance note justified only against a1_unit42's vagueness and missed
    a1_unit31's explicit "coworker" establishment. A native/content pass should
    decide whether to reframe this as an internal move/promotion or accept the
    job-change arc. Separately, a real grading bug WAS found and fixed in the
    fa-en overlay for this unit (all 3 word_order accepted_answers were authored
    in scrambled word_bank order rather than correct sentence order -- see the
    overlay's review note).

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at a formal interview register: describing experience and availability, stating a strength, and asking one polite clarifying question about the role."

media_assets:
  - {content_key: "en.a2.audio.job_interview.words.availability.01", language: "en", text: "availability", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.job_interview.question.01", language: "en", text: "I have two years of experience in social media marketing.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.job_interview.description.01", language: "en", text: "One of my strengths is being organized, and I'm available to start next Monday.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.job_interview.01"
    language: "en"
    text: "Interviewer: Thank you for coming in today. Can you tell me about your experience? Mia: I have two years of experience in social media marketing. I also managed a small team. Interviewer: That's great. What is one of your strengths? Mia: I'm very organized, and I meet deadlines. Interviewer: When are you available to start? Mia: I'm available to start next Monday. Interviewer: Do you have any questions about the role? Mia: Yes, I was wondering what a typical week looks like in this position. Interviewer: Great question. I'll follow up with you by email this week. Mia: Thank you very much."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit30.job_interview"
    title: "Attending a job interview"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.employment.attend_job_interview"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit30.lesson01.interview_vocabulary"
        title: "Experience, position, and strengths"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit30.lesson01.teach.experience", kind: "vocabulary", target: {text: "experience", language_code: "en", direction: "ltr"}, introduced_tokens: ["experience"], example: {text: "I have two years of experience in marketing.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit30.lesson01.teach.position", kind: "vocabulary", target: {text: "position", language_code: "en", direction: "ltr"}, introduced_tokens: ["position"], example: {text: "This position is for a marketing coordinator.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit30.lesson01.teach.availability", kind: "vocabulary", target: {text: "availability", language_code: "en", direction: "ltr"}, introduced_tokens: ["availability"], example: {text: "The interviewer asked about my availability.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit30.lesson01.teach.strength", kind: "vocabulary", target: {text: "strength", language_code: "en", direction: "ltr"}, introduced_tokens: ["strength"], example: {text: "One of my strengths is being organized.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit30.lesson01.teach.requirement", kind: "vocabulary", target: {text: "requirement", language_code: "en", direction: "ltr"}, introduced_tokens: ["requirement"], example: {text: "Two years of experience is a requirement for this position.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a2.unit30.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "availability", media_asset_key: "en.a2.audio.job_interview.words.availability.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit30.lesson01.exercise02.choose_role_at_company_word", type: "multiple_choice", tested_text: "position", prompt: {target_blocks: [{text: "Which word means a job or role at a company?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson01.exercise03.choose_free_to_start_word", type: "multiple_choice", tested_text: "availability", prompt: {target_blocks: [{text: "Which word means the times you are free to start working?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson01.exercise04.match_interview_words", type: "matching_pairs", tested_text: "experience position availability strength requirement", prompt: {target_blocks: [{text: "Match each meaning to the correct English word.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a time you have done a job or related activity", right: "experience"}, {left: "a job or role at a company", right: "position"}, {left: "the times you are free to start or work", right: "availability"}, {left: "something you are good at", right: "strength"}, {left: "something the employer needs you to have", right: "requirement"}, {left: "having the right skills or experience for a job", right: "qualified"}, {left: "a document listing your experience and education", right: "resume"}, {left: "a date or time something must be finished by", right: "deadline"}]}
          - {content_key: "en.a2.unit30.lesson01.exercise05.write_strength", type: "writing_prompt", tested_text: "strength", prompt: {target_blocks: [{text: "Write the word for something you are good at.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit30.lesson02.talking_about_experience_and_availability"
        title: "Talking about your experience and availability"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit30.lesson02.teach.two_years_experience", kind: "phrase", target: {text: "I have two years of experience in social media marketing.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "have", "two", "years", "of", "experience", "in", "social", "media", "marketing"]}
          - {content_key: "en.a2.unit30.lesson02.teach.one_strength_organized", kind: "phrase", target: {text: "One of my strengths is being organized.", language_code: "en", direction: "ltr"}, introduced_tokens: ["One", "my", "strengths", "is", "being", "organized"]}
          - {content_key: "en.a2.unit30.lesson02.teach.available_next_monday", kind: "phrase", target: {text: "I'm available to start next Monday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "available", "to", "start", "next", "Monday"]}
        exercises:
          - {content_key: "en.a2.unit30.lesson02.exercise01.listen_experience", type: "listen_select", tested_text: "I have two years of experience in social media marketing", media_asset_key: "en.a2.audio.job_interview.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit30.lesson02.exercise02.choose_answer_about_experience", type: "multiple_choice", tested_text: "I have two years of experience in social media marketing.", prompt: {target_blocks: [{text: "The interviewer asks about your experience. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson02.exercise03.order_one_strength", type: "word_order", tested_text: "One of my strengths is being organized", prompt: {target_blocks: []}, word_bank: ["of", "my", "strengths", "is", "being", "organized", "One"]}
          - {content_key: "en.a2.unit30.lesson02.exercise04.reply_when_available", type: "dialogue_response", tested_text: "I'm available to start next Monday", prompt: {target_blocks: [{text: "When are you available to start?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson02.exercise05.write_availability_note", type: "writing_prompt", tested_text: "I'm available to start next Monday.", prompt: {target_blocks: [{text: "Write that you are available to start next Monday.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit30.lesson03.reading_a_job_posting"
        title: "Reading a job posting"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit30.lesson03.teach.resume", kind: "vocabulary", target: {text: "resume", language_code: "en", direction: "ltr"}, introduced_tokens: ["resume"], example: {text: "Please bring your resume to the interview.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit30.lesson03.teach.deadline", kind: "vocabulary", target: {text: "deadline", language_code: "en", direction: "ltr"}, introduced_tokens: ["deadline"], example: {text: "I always meet my deadlines at work.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit30.lesson03.teach.posting_text", kind: "reading", target: {text: "Bright Path Marketing is looking for a marketing coordinator. Requirements: two years of experience, strong writing skills, and availability to start immediately. Please bring your resume to the interview.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Bright", "Path", "Marketing", "is", "looking", "for", "a", "marketing", "coordinator", "Requirements", "two", "years", "of", "experience", "strong", "writing", "skills", "and", "availability", "to", "start", "immediately", "Please", "bring", "your", "resume", "the", "interview"]}
          - {content_key: "en.a2.unit30.lesson03.teach.i_meet_deadlines", kind: "phrase", target: {text: "I meet deadlines, and I work well in a team.", language_code: "en", direction: "ltr"}, introduced_tokens: ["meet", "deadlines", "work", "well", "team"]}
        exercises:
          - {content_key: "en.a2.unit30.lesson03.exercise01.read_required_experience", type: "reading_comprehension", tested_text: "two years of experience", prompt: {target_blocks: [{text: "How much experience does the posting ask for?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson03.exercise02.read_required_skill", type: "reading_comprehension", tested_text: "strong writing skills", prompt: {target_blocks: [{text: "What skill does the posting ask for?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson03.exercise03.choose_what_to_bring", type: "multiple_choice", tested_text: "your resume", prompt: {target_blocks: [{text: "What should you bring to the interview?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson03.exercise04.order_bring_resume", type: "word_order", tested_text: "Please bring your resume to the interview", prompt: {target_blocks: []}, word_bank: ["bring", "your", "resume", "to", "the", "interview", "Please"]}
          - {content_key: "en.a2.unit30.lesson03.exercise05.write_meet_deadlines", type: "writing_prompt", tested_text: "I meet deadlines, and I work well in a team.", prompt: {target_blocks: [{text: "Write that you meet deadlines and work well in a team.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit30.lesson04.interview_dialogue"
        title: "The interview"
        spine_outcome_id: "universal.a2.employment.attend_job_interview"
        teaching:
          - {content_key: "en.a2.unit30.lesson04.teach.q_tell_me_experience", kind: "dialogue", target: {text: "Thank you for coming in today. Can you tell me about your experience?", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: ["Thank", "you", "for", "coming", "in", "today", "Can", "tell", "me", "about", "your", "experience"]}
          - {content_key: "en.a2.unit30.lesson04.teach.a_two_years_managed_team", kind: "dialogue", target: {text: "I have two years of experience in social media marketing. I also managed a small team.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["also", "managed", "a", "small", "team"]}
          - {content_key: "en.a2.unit30.lesson04.teach.q_what_strength", kind: "dialogue", target: {text: "That's great. What is one of your strengths?", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: ["That's", "great", "What", "is", "one", "of", "your", "strengths"]}
          - {content_key: "en.a2.unit30.lesson04.teach.a_organized_deadlines", kind: "dialogue", target: {text: "I'm very organized, and I meet deadlines.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["very", "organized", "meet", "deadlines"]}
          - {content_key: "en.a2.unit30.lesson04.teach.q_have_questions", kind: "dialogue", target: {text: "Do you have any questions about the role?", language_code: "en", direction: "ltr", speaker: "Interviewer"}, introduced_tokens: ["Do", "you", "have", "any", "questions", "about", "the", "role"]}
          - {content_key: "en.a2.unit30.lesson04.teach.a_wondering_typical_week", kind: "dialogue", target: {text: "Yes, I was wondering what a typical week looks like in this position.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Yes", "I", "was", "wondering", "what", "a", "typical", "week", "looks", "like", "in", "this", "position"]}
        exercises:
          - {content_key: "en.a2.unit30.lesson04.exercise01.listen_mias_experience", type: "dialogue_comprehension", tested_text: "two years of experience in social media marketing", media_asset_key: "en.a2.audio.dialogue.job_interview.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit30.lesson04.exercise02.listen_start_date", type: "listen_select", tested_text: "next Monday", media_asset_key: "en.a2.audio.dialogue.job_interview.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit30.lesson04.exercise03.choose_mias_question", type: "multiple_choice", tested_text: "what a typical week looks like in this position", prompt: {target_blocks: [{text: "What does Mia ask the interviewer?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit30.lesson04.exercise04.order_what_strength_question", type: "word_order", tested_text: "What is one of your strengths", prompt: {target_blocks: []}, word_bank: ["is", "one", "of", "your", "strengths", "What"]}
          - content_key: "en.a2.unit30.lesson04.exercise05.reply_as_mia"
            type: "dialogue_response"
            tested_text: "I have two years of experience in social media marketing I also managed a small team I'm very organized and I meet deadlines I'm available to start next Monday"
            prompt: {target_blocks: [{text: "Thank you for coming in today. Can you tell me about your experience?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit30.lesson04.exercise06.speak_interview_dialogue"
            type: "speak_response"
            tested_text: "I have two years of experience in social media marketing I also managed a small team I'm very organized and I meet deadlines I'm available to start next Monday"
            prompt: {target_blocks: [{text: "Thank you for coming in today. Can you tell me about your experience?", language_code: "en", direction: "ltr"}]}
