course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Payment vocabulary reflects everyday US retail conventions (cash/card, tax often added at register) without going into banking-register vocabulary."

media_assets:
  - {content_key: "en.a1.audio.money.payment_methods.01", language: "en", text: "credit card", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.money.payment_question.01", language: "en", text: "Do you take credit cards?", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.money.total_question.01", language: "en", text: "How much is the total?", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.paying.01"
    language: "en"
    text: "Leila: How much is the total? Daniel: It's fifteen dollars. Leila: Do you take credit cards? Daniel: Yes, we do. Leila: Great, I'll pay by card."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit15.money"
    title: "Handling money and payments"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.money.handle_basic_money_matters"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit15.lesson01.payment_words"
        title: "Common payment words"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit15.lesson01.teach.cash", kind: "vocabulary", target: {text: "cash", language_code: "en", direction: "ltr"}, introduced_tokens: ["cash"], example: {text: "I have some cash.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit15.lesson01.teach.card", kind: "vocabulary", target: {text: "card", language_code: "en", direction: "ltr"}, introduced_tokens: ["card"], example: {text: "My card is blue.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit15.lesson01.teach.credit_card", kind: "phrase", target: {text: "credit card", language_code: "en", direction: "ltr"}, introduced_tokens: ["credit", "card"]}
          - {content_key: "en.a1.unit15.lesson01.teach.debit_card", kind: "phrase", target: {text: "debit card", language_code: "en", direction: "ltr"}, introduced_tokens: ["debit", "card"]}
          - {content_key: "en.a1.unit15.lesson01.teach.total", kind: "vocabulary", target: {text: "total", language_code: "en", direction: "ltr"}, introduced_tokens: ["total"], example: {text: "What is the total?", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit15.lesson01.exercise01.listen_payment_method", type: "listen_select", tested_text: "credit card", media_asset_key: "en.a1.audio.money.payment_methods.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit15.lesson01.exercise02.choose_cash"
            type: "multiple_choice"
            tested_text: "cash"
            prompt: {target_blocks: [{text: "Which word means paper money and coins?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit15.lesson01.exercise03.choose_total"
            type: "multiple_choice"
            tested_text: "total"
            prompt: {target_blocks: [{text: "Which word means the full amount you owe?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit15.lesson01.exercise04.match_payment_words", type: "matching_pairs", tested_text: "cash card credit debit", prompt: {target_blocks: []}, pairs: [{left: "cash", right: "paper money and coins"}, {left: "card", right: "general word for a plastic payment method"}, {left: "credit", right: "borrowed money you pay back later"}, {left: "debit", right: "money taken directly from your account"}, {left: "total", right: "the full amount you owe"}, {left: "dollars", right: "the money unit used in the US"}]}
          - {content_key: "en.a1.unit15.lesson01.exercise05.write_total", type: "writing_prompt", tested_text: "total", prompt: {target_blocks: [{text: "Write the word for the full amount you owe.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit15.lesson02.asking_about_payment"
        title: "Asking about accepted payment methods"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit15.lesson02.teach.do_you_take_cards", kind: "phrase", target: {text: "Do you take credit cards?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Do", "you", "take", "credit", "cards"]}
          - {content_key: "en.a1.unit15.lesson02.teach.cash_only", kind: "phrase", target: {text: "Sorry, cash only.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Sorry", "cash", "only"]}
          - {content_key: "en.a1.unit15.lesson02.teach.ill_pay_by_card", kind: "phrase", target: {text: "Yes, I'll pay by card.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Yes", "I'll", "pay", "by", "card"]}
        exercises:
          - {content_key: "en.a1.unit15.lesson02.exercise01.listen_payment_question", type: "listen_select", tested_text: "Do you take credit cards", media_asset_key: "en.a1.audio.money.payment_question.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit15.lesson02.exercise02.choose_cash_only_response"
            type: "multiple_choice"
            tested_text: "Sorry, cash only."
            prompt: {target_blocks: [{text: "The store doesn't accept cards. What does the cashier say?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit15.lesson02.exercise03.order_payment_question", type: "word_order", tested_text: "Do you take credit cards", prompt: {target_blocks: []}, word_bank: ["you", "take", "credit", "cards", "Do"]}
          - content_key: "en.a1.unit15.lesson02.exercise04.reply_pay_by_card"
            type: "dialogue_response"
            tested_text: "Do you take credit cards Yes I'll pay by card"
            prompt: {target_blocks: [{text: "Ask if they take credit cards, then say you'll pay by card.", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit15.lesson02.exercise05.write_payment_question", type: "writing_prompt", tested_text: "Do you take credit cards?", prompt: {target_blocks: [{text: "Write how you ask if a store accepts credit cards.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit15.lesson03.reading_a_receipt"
        title: "Reading a receipt"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit15.lesson03.teach.tax", kind: "vocabulary", target: {text: "tax", language_code: "en", direction: "ltr"}, introduced_tokens: ["tax"], example: {text: "The tax is one dollar.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit15.lesson03.teach.receipt_text", kind: "reading", target: {text: "Coffee: $3. Sandwich: $6. Tax: $1. Total: $10.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Coffee", "3", "Sandwich", "6", "Tax", "1", "Total", "10"]}
          - {content_key: "en.a1.unit15.lesson03.teach.total_summary_sentence", kind: "phrase", target: {text: "The total is $10.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "total", "is", "10"]}
        exercises:
          - content_key: "en.a1.unit15.lesson03.exercise01.read_tax_amount"
            type: "reading_comprehension"
            tested_text: "$1"
            prompt: {target_blocks: [{text: "How much is the tax?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit15.lesson03.exercise02.read_total_amount"
            type: "reading_comprehension"
            tested_text: "$10"
            prompt: {target_blocks: [{text: "What is the total amount?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit15.lesson03.exercise03.choose_most_expensive_item"
            type: "multiple_choice"
            tested_text: "Sandwich"
            prompt: {target_blocks: [{text: "Which single item costs the most on the receipt?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit15.lesson03.exercise04.match_receipt_fields", type: "matching_pairs", tested_text: "Coffee Sandwich Tax Total", prompt: {target_blocks: []}, pairs: [{left: "Coffee", right: "$3"}, {left: "Sandwich", right: "$6"}, {left: "Tax", right: "$1"}, {left: "Total", right: "$10"}]}
          - {content_key: "en.a1.unit15.lesson03.exercise05.write_total_amount", type: "writing_prompt", tested_text: "The total is $10", prompt: {target_blocks: [{text: "Write a full sentence that gives the total on the receipt.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit15.lesson04.paying_dialogue"
        title: "Paying at the register"
        spine_outcome_id: "universal.a1.money.handle_basic_money_matters"
        teaching:
          - {content_key: "en.a1.unit15.lesson04.teach.q_total", kind: "dialogue", target: {text: "How much is the total?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["How", "much", "is", "the", "total"]}
          - {content_key: "en.a1.unit15.lesson04.teach.a_fifteen", kind: "dialogue", target: {text: "It's fifteen dollars.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["It's", "fifteen", "dollars"]}
          - {content_key: "en.a1.unit15.lesson04.teach.q_cards", kind: "dialogue", target: {text: "Do you take credit cards?", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit15.lesson04.teach.a_yes_we_do", kind: "dialogue", target: {text: "Yes, we do.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Yes", "we", "do"]}
          - {content_key: "en.a1.unit15.lesson04.teach.closing_pay_by_card", kind: "dialogue", target: {text: "Great, I'll pay by card.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Great"]}
        exercises:
          - {content_key: "en.a1.unit15.lesson04.exercise01.listen_total_amount", type: "dialogue_comprehension", tested_text: "It's fifteen dollars", media_asset_key: "en.a1.audio.dialogue.paying.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit15.lesson04.exercise02.listen_cards_accepted", type: "listen_select", tested_text: "Yes, we do", media_asset_key: "en.a1.audio.dialogue.paying.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit15.lesson04.exercise03.choose_final_payment_choice"
            type: "multiple_choice"
            tested_text: "Great, I'll pay by card."
            prompt: {target_blocks: [{text: "Leila decides how to pay. What does she say?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit15.lesson04.exercise04.order_q_total", type: "word_order", tested_text: "How much is the total", prompt: {target_blocks: []}, word_bank: ["much", "is", "the", "total", "How"]}
          - content_key: "en.a1.unit15.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "How much is the total Do you take credit cards Great I'll pay by card"
            prompt: {target_blocks: [{text: "Ask the total, ask if they take credit cards, then decide to pay by card.", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit15.lesson04.exercise06.speak_paying"
            type: "speak_response"
            tested_text: "How much is the total Do you take credit cards Great I'll pay by card"
            prompt: {target_blocks: [{text: "Ask the total, ask if they take credit cards, then decide to pay by card.", language_code: "en", direction: "ltr"}]}
