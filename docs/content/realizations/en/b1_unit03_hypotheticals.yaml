course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: real/possible future conditionals (if + present, will + base verb) contrasted with unreal/counterfactual present conditionals (if + past, would + base verb) and unreal past conditionals (if + past perfect, would have + past participle), in an everyday weekend-plans and hobby context."

media_assets:
  - {content_key: "en.b1.audio.hypotheticals.words.weekend.01", language: "en", text: "weekend", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.hypotheticals.sentence.01", language: "en", text: "If I have free time this weekend, I will paint.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.hypotheticals.01"
    language: "en"
    text: "Daniel: What are your plans for the weekend? Leila: If it doesn't rain, I will go for a walk. If it rains, I will stay home and paint. Daniel: That sounds nice. Did you take that painting class last month? Leila: No, I didn't. If I had known about it earlier, I would have signed up. Daniel: That's too bad. If there's another one, you should join. Leila: You're right. If I see one, I will sign up immediately."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit03.hypotheticals"
    title: "If it rains, if I had time"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.hypotheticals.express_hypothetical_conditions"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit03.lesson01.conditional_vocabulary"
        title: "If, rain, and free time"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions"
        teaching:
          - {content_key: "en.b1.unit03.lesson01.teach.if", kind: "vocabulary", target: {text: "if", language_code: "en", direction: "ltr"}, introduced_tokens: ["if"], example: {text: "If it rains, we will stay home.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit03.lesson01.teach.rain", kind: "vocabulary", target: {text: "rain", language_code: "en", direction: "ltr"}, introduced_tokens: ["rain"], example: {text: "It might rain this weekend.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit03.lesson01.teach.stay_home", kind: "vocabulary", target: {text: "stay home", language_code: "en", direction: "ltr"}, introduced_tokens: ["stay", "home"], example: {text: "If it rains, we will stay home.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit03.lesson01.teach.weekend", kind: "vocabulary", target: {text: "weekend", language_code: "en", direction: "ltr"}, introduced_tokens: ["weekend"], example: {text: "What are your plans for the weekend?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit03.lesson01.teach.free_time", kind: "vocabulary", target: {text: "free time", language_code: "en", direction: "ltr"}, introduced_tokens: ["free", "time"], example: {text: "I don't have much free time these days.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit03.lesson01.teach.paint", kind: "vocabulary", target: {text: "paint", language_code: "en", direction: "ltr"}, introduced_tokens: ["paint"], example: {text: "Leila loves to paint on weekends.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit03.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "weekend", media_asset_key: "en.b1.audio.hypotheticals.words.weekend.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit03.lesson01.exercise02.choose_water_from_sky_word", type: "multiple_choice", tested_text: "rain", prompt: {target_blocks: [{text: "Which word means water falling from the sky?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson01.exercise03.choose_hours_not_working_phrase", type: "multiple_choice", tested_text: "free time", prompt: {target_blocks: [{text: "Which phrase means hours when you are not working or busy?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson01.exercise04.match_conditional_words", type: "matching_pairs", tested_text: "if rain weekend paint", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "introduces a condition", right: "if"}, {left: "water falling from the sky", right: "rain"}, {left: "Saturday and Sunday", right: "weekend"}, {left: "to make a picture with color", right: "paint"}]}
          - {content_key: "en.b1.unit03.lesson01.exercise05.write_weekend", type: "writing_prompt", tested_text: "weekend", prompt: {target_blocks: [{text: "Write the word for Saturday and Sunday.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit03.lesson02.real_conditions"
        title: "If it rains, we will stay home"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions"
        teaching:
          - {content_key: "en.b1.unit03.lesson02.teach.if_rains_stay_home", kind: "phrase", target: {text: "If it rains tomorrow, we will stay home.", language_code: "en", direction: "ltr"}, introduced_tokens: ["If", "it", "rains", "tomorrow", "we", "will", "stay", "home"]}
          - {content_key: "en.b1.unit03.lesson02.teach.if_have_free_time_paint", kind: "phrase", target: {text: "If I have free time this weekend, I will paint.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "have", "free", "time", "this", "weekend", "will", "paint"], media_asset_key: "en.b1.audio.hypotheticals.sentence.01"}
          - {content_key: "en.b1.unit03.lesson02.teach.grammar_real_condition", kind: "grammar_note", target: {text: "If it rains, we will stay home. If I have time, I will paint.", language_code: "en", direction: "ltr"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.b1.unit03.lesson02.exercise01.choose_rain_result", type: "multiple_choice", tested_text: "If it rains tomorrow, we will stay home.", prompt: {target_blocks: [{text: "Which sentence says what will happen if it rains tomorrow?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson02.exercise02.choose_free_time_result", type: "multiple_choice", tested_text: "If I have free time this weekend, I will paint.", prompt: {target_blocks: [{text: "Which sentence says what will happen if you have free time this weekend?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson02.exercise03.order_if_rains_stay_home", type: "word_order", tested_text: "If it rains tomorrow we will stay home", prompt: {target_blocks: []}, word_bank: ["it", "rains", "tomorrow", "we", "will", "stay", "home", "If"]}
          - {content_key: "en.b1.unit03.lesson02.exercise04.reply_weekend_plans", type: "dialogue_response", tested_text: "If I have free time this weekend I will paint", prompt: {target_blocks: [{text: "Will you paint if you have free time this weekend?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson02.exercise05.write_if_rains", type: "writing_prompt", tested_text: "If it rains tomorrow, we will stay home.", prompt: {target_blocks: [{text: "Write that if it rains tomorrow, you will stay home.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit03.lesson03.reading_more_free_time"
        title: "Reading: if she had more free time"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions"
        teaching:
          - {content_key: "en.b1.unit03.lesson03.teach.would", kind: "vocabulary", target: {text: "would", language_code: "en", direction: "ltr"}, introduced_tokens: ["would"], example: {text: "If I had more time, I would paint every day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit03.lesson03.teach.class", kind: "vocabulary", target: {text: "class", language_code: "en", direction: "ltr"}, introduced_tokens: ["class"], example: {text: "There was a painting class near her house.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit03.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Leila loves to paint, but she doesn't have much free time. If she had more free time, she would paint every day. Last month, there was a painting class near her house. If she had known about it earlier, she would have signed up. Now she checks for new classes every week.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["loves", "doesn't", "much", "she", "had", "more", "every", "day", "Last", "month", "there", "was", "a", "near", "her", "house", "known", "about", "it", "earlier", "have", "signed", "up", "Now", "checks", "for", "new", "week"]
        exercises:
          - {content_key: "en.b1.unit03.lesson03.exercise01.comprehend_if_more_time", type: "reading_comprehension", tested_text: "she would paint every day", prompt: {target_blocks: [{text: "What would Leila do if she had more free time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson03.exercise02.comprehend_if_known_earlier", type: "reading_comprehension", tested_text: "she would have signed up", prompt: {target_blocks: [{text: "What would Leila have done if she had known about the class earlier?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson03.exercise03.recognize_class", type: "multiple_choice", tested_text: "class", prompt: {target_blocks: [{text: "Which word means an organized lesson with a teacher?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson03.exercise04.order_would_paint_every_day", type: "word_order", tested_text: "She would paint every day", prompt: {target_blocks: []}, word_bank: ["would", "paint", "every", "day", "She"]}
          - {content_key: "en.b1.unit03.lesson03.exercise05.write_if_had_known", type: "writing_prompt", tested_text: "If I had known about it earlier, I would have signed up.", prompt: {target_blocks: [{text: "Write that if you had known about it earlier, you would have signed up.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit03.lesson04.the_weekend_plans_dialogue"
        title: "If there's another one, you should join"
        spine_outcome_id: "universal.b1.hypotheticals.express_hypothetical_conditions"
        teaching:
          - {content_key: "en.b1.unit03.lesson04.teach.q_weekend_plans", kind: "dialogue", target: {text: "What are your plans for the weekend?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "are", "your", "plans", "for", "the", "weekend"], media_asset_key: "en.b1.audio.dialogue.hypotheticals.01"}
          - {content_key: "en.b1.unit03.lesson04.teach.a_walk_or_stay_home", kind: "dialogue", target: {text: "If it doesn't rain, I will go for a walk. If it rains, I will stay home and paint.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["If", "it", "doesn't", "rain", "I", "will", "go", "for", "a", "walk", "rains", "stay", "home", "and", "paint"]}
          - {content_key: "en.b1.unit03.lesson04.teach.q_take_class", kind: "dialogue", target: {text: "That sounds nice. Did you take that painting class last month?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That", "sounds", "nice", "Did", "you", "take", "painting", "class", "last", "month"]}
          - {content_key: "en.b1.unit03.lesson04.teach.a_would_have_signed_up", kind: "dialogue", target: {text: "No, I didn't. If I had known about it earlier, I would have signed up.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["No", "didn't", "had", "known", "about", "earlier", "would", "have", "signed", "up"]}
          - {content_key: "en.b1.unit03.lesson04.teach.q_should_join", kind: "dialogue", target: {text: "That's too bad. If there's another one, you should join.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["That's", "too", "bad", "there's", "another", "one", "should", "join"]}
          - {content_key: "en.b1.unit03.lesson04.teach.a_will_sign_up", kind: "dialogue", target: {text: "You're right. If I see one, I will sign up immediately.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["You're", "right", "see", "one", "sign", "up", "immediately"]}
        exercises:
          - {content_key: "en.b1.unit03.lesson04.exercise01.listen_leilas_rain_plan", type: "dialogue_comprehension", tested_text: "stay home and paint", media_asset_key: "en.b1.audio.dialogue.hypotheticals.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit03.lesson04.exercise02.listen_when_class_was", type: "listen_select", tested_text: "last month", media_asset_key: "en.b1.audio.dialogue.hypotheticals.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit03.lesson04.exercise03.choose_leilas_regret", type: "multiple_choice", tested_text: "If I had known about it earlier, I would have signed up.", prompt: {target_blocks: [{text: "What does Leila say she would have done if she had known about the class earlier?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit03.lesson04.exercise04.order_if_there_is_another", type: "word_order", tested_text: "If there's another one you should join", prompt: {target_blocks: []}, word_bank: ["there's", "another", "one", "you", "should", "join", "If"]}
          - content_key: "en.b1.unit03.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "If it doesn't rain I will go for a walk If it rains I will stay home and paint"
            prompt: {target_blocks: [{text: "What are your plans for the weekend?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit03.lesson04.exercise06.speak_hypotheticals_dialogue"
            type: "speak_response"
            tested_text: "No I didn't If I had known about it earlier I would have signed up"
            prompt: {target_blocks: [{text: "That sounds nice. Did you take that painting class last month?", language_code: "en", direction: "ltr"}]}
