schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Firecrawl was unavailable this session (402, out of credits) and no
    cached scrape existed in .firecrawl/ for A2 ESL online-habits/social-
    media material. Authored directly from established ESL A2
    conventions (universal_spine.yaml's
    universal.a2.technology.discuss_online_habits node, which requires
    the A1 prerequisite universal.a1.technology.describe_device_use and
    an opinion per universal.a2.opinions.give_opinions_with_reasons) and
    this unit's own predecessor pattern (a2_unit26_opinions's "I think /
    in my opinion / but" scaffold), not adapted from any specific
    public-domain course. Deliberately reuses the exact phone-habit
    facts already established in a1_unit35_technology.yaml (Leila:
    maps/cooking app, calls parents weekly; Mia: photos, texts her
    sister) per AUTHORING_GUIDE §11 -- a genuine continuation, not
    invented facts that could conflict with the existing corpus.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Third of 5 new A2 units closing the en-realization gap against fa/prs's
    a2_unit14-18 -- spine outcome
    universal.a2.technology.discuss_online_habits. Daniel asks Leila
    about her online habits; her answer (checks social media twice a
    day, mostly uses messaging apps for family and a cooking app) is
    consistent with a1_unit35. Lesson03's reading passage reuses Mia's
    established photo/texting habits from the same unit for the same
    reason. Facts (twice a day, "many times a day" for Mia) kept
    consistent within this file per §11. Every multi-clause
    accepted_answers entry authored with period/conjunction-joined
    forms per §12.

    2026-07-11 fresh-context review (Claude, zero access to authoring
    reasoning). Continuity verified against a1_unit35 (Leila: messaging/cooking
    app, calls parents; Mia: photos, texts family) -- consistent. One real
    realization bug found and FIXED: lesson02 exercise03's word_bank was missing
    a second "to" tile, so the taught sentence "I mostly use messaging apps to
    talk to my family" (two "to"s) was mechanically unbuildable -- added the
    tile. Also fixed in the fa-en overlay: all 3 word_order accepted_answers were
    in scrambled word_bank order rather than correct sentence order (see overlay
    note). listen_select distractors (lesson04) checked clean.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English for describing a habit plus a simple opinion (I think..., in my opinion..., but it can...) -- the A2 step up from a1_unit35's plain habit statements."

media_assets:
  - {content_key: "en.a2.audio.online_habits.words.notification.01", language: "en", text: "notification", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.online_habits.question.01", language: "en", text: "I check social media twice a day, in the morning and in the evening.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.online_habits.description.01", language: "en", text: "In my opinion, social media is useful for staying in touch, but it can waste a lot of time.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.online_habits.01"
    language: "en"
    text: "Daniel: How much time do you spend on your phone every day? Leila: I check social media twice a day, in the morning and the evening. Daniel: What do you use it for? Leila: I mostly use messaging apps to talk to my family, and I use a cooking app almost every day. Daniel: Do you think social media is a good thing? Leila: In my opinion, it's useful for staying in touch, but it can waste a lot of time."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit32.online_habits"
    title: "Talking about online habits"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.technology.discuss_online_habits"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit32.lesson01.online_habits_vocabulary"
        title: "Social media and screen time"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit32.lesson01.teach.social_media", kind: "vocabulary", target: {text: "social media", language_code: "en", direction: "ltr"}, introduced_tokens: ["social", "media"], example: {text: "I check social media twice a day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit32.lesson01.teach.screen_time", kind: "vocabulary", target: {text: "screen time", language_code: "en", direction: "ltr"}, introduced_tokens: ["screen", "time"], example: {text: "Too much screen time can be tiring.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit32.lesson01.teach.messaging_app", kind: "vocabulary", target: {text: "messaging app", language_code: "en", direction: "ltr"}, introduced_tokens: ["messaging", "app"], example: {text: "I use a messaging app to talk to my family.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit32.lesson01.teach.notification", kind: "vocabulary", target: {text: "notification", language_code: "en", direction: "ltr"}, introduced_tokens: ["notification"], example: {text: "I check my notifications many times a day.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit32.lesson01.teach.download", kind: "vocabulary", target: {text: "download", language_code: "en", direction: "ltr"}, introduced_tokens: ["download"], example: {text: "Can you download that cooking app for me?", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a2.unit32.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "notification", media_asset_key: "en.a2.audio.online_habits.words.notification.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit32.lesson01.exercise02.choose_app_for_messages_word", type: "multiple_choice", tested_text: "messaging app", prompt: {target_blocks: [{text: "Which phrase means an app you use to send messages?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson01.exercise03.choose_time_on_screen_word", type: "multiple_choice", tested_text: "screen time", prompt: {target_blocks: [{text: "Which phrase means the time you spend looking at a phone or computer?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson01.exercise04.match_online_habit_words", type: "matching_pairs", tested_text: "social media screen time messaging app notification download", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "social media", right: "apps and sites for sharing photos and messages with others"}, {left: "screen time", right: "the time you spend looking at a phone or computer"}, {left: "messaging app", right: "an app you use to send messages"}, {left: "notification", right: "a small alert from an app on your phone"}, {left: "download", right: "to add an app or file to your phone"}]}
          - {content_key: "en.a2.unit32.lesson01.exercise05.write_notification", type: "writing_prompt", tested_text: "notification", prompt: {target_blocks: [{text: "Write the word for a small alert from an app on your phone.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit32.lesson02.describing_your_own_habits"
        title: "Describing your own online habits"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit32.lesson02.teach.check_twice_a_day", kind: "phrase", target: {text: "I check social media twice a day, in the morning and in the evening.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "check", "social", "media", "twice", "a", "day", "in", "the", "morning", "and", "evening"]}
          - {content_key: "en.a2.unit32.lesson02.teach.messaging_family_cooking_app", kind: "phrase", target: {text: "I mostly use messaging apps to talk to my family, and I use a cooking app almost every day.", language_code: "en", direction: "ltr"}, introduced_tokens: ["mostly", "use", "messaging", "apps", "to", "talk", "my", "family", "cooking", "app", "almost", "every", "day"]}
          - {content_key: "en.a2.unit32.lesson02.teach.useful_but_waste_time", kind: "phrase", target: {text: "In my opinion, it's useful for staying in touch, but it can waste a lot of time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["In", "my", "opinion", "it's", "useful", "for", "staying", "touch", "but", "can", "waste", "a", "lot", "of", "time"]}
        exercises:
          - {content_key: "en.a2.unit32.lesson02.exercise01.listen_check_frequency", type: "listen_select", tested_text: "twice a day", media_asset_key: "en.a2.audio.online_habits.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit32.lesson02.exercise02.choose_how_often_answer", type: "multiple_choice", tested_text: "I check social media twice a day, in the morning and in the evening.", prompt: {target_blocks: [{text: "Someone asks how often you check social media. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson02.exercise03.order_messaging_family_sentence", type: "word_order", tested_text: "I mostly use messaging apps to talk to my family", prompt: {target_blocks: []}, word_bank: ["mostly", "use", "messaging", "apps", "to", "talk", "to", "my", "family", "I"]}
          - {content_key: "en.a2.unit32.lesson02.exercise04.reply_opinion_on_social_media", type: "dialogue_response", tested_text: "In my opinion, it's useful for staying in touch, but it can waste a lot of time", prompt: {target_blocks: [{text: "Is social media good?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson02.exercise05.write_online_habit_message", type: "writing_prompt", tested_text: "I check social media twice a day, but it can waste a lot of time.", prompt: {target_blocks: [{text: "Write how often you check social media and one opinion about it.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit32.lesson03.reading_about_online_habits"
        title: "Reading about someone's online habits"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit32.lesson03.teach.too_much", kind: "phrase", target: {text: "I know it's too much screen time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I", "know", "it's", "too", "much", "screen", "time"]}
          - {content_key: "en.a2.unit32.lesson03.teach.mias_message", kind: "reading", target: {text: "Hi! I use my phone a lot every day. I post photos on social media almost every evening, and I check notifications many times a day. I know it's too much screen time, but I enjoy sharing photos with my friends.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Hi", "I", "use", "my", "phone", "a", "lot", "every", "day", "post", "photos", "on", "social", "media", "almost", "evening", "and", "check", "notifications", "many", "times", "know", "it's", "too", "much", "screen", "time", "but", "enjoy", "sharing", "with", "friends"]}
          - {content_key: "en.a2.unit32.lesson03.teach.i_enjoy_sharing_photos", kind: "phrase", target: {text: "I enjoy sharing photos with my friends.", language_code: "en", direction: "ltr"}, introduced_tokens: ["enjoy", "sharing", "photos", "with", "my", "friends"]}
        exercises:
          - {content_key: "en.a2.unit32.lesson03.exercise01.read_notification_frequency", type: "reading_comprehension", tested_text: "many times a day", prompt: {target_blocks: [{text: "How often does Mia check her notifications?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson03.exercise02.read_mias_opinion", type: "reading_comprehension", tested_text: "too much screen time", prompt: {target_blocks: [{text: "What does Mia think about her own screen time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson03.exercise03.choose_why_mia_keeps_using_it", type: "multiple_choice", tested_text: "I enjoy sharing photos with my friends", prompt: {target_blocks: [{text: "According to her message, why does Mia keep using social media even though it's too much screen time?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson03.exercise04.order_enjoy_sharing_photos", type: "word_order", tested_text: "I enjoy sharing photos with my friends", prompt: {target_blocks: []}, word_bank: ["enjoy", "sharing", "photos", "with", "my", "friends", "I"]}
          - {content_key: "en.a2.unit32.lesson03.exercise05.write_own_online_habit_opinion", type: "writing_prompt", tested_text: "I know it's too much screen time, but I enjoy sharing photos with my friends.", prompt: {target_blocks: [{text: "Write that you know it's too much screen time, but you enjoy sharing photos with your friends.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit32.lesson04.online_habits_dialogue"
        title: "Talking with a friend about phone use"
        spine_outcome_id: "universal.a2.technology.discuss_online_habits"
        teaching:
          - {content_key: "en.a2.unit32.lesson04.teach.q_how_much_time_phone", kind: "dialogue", target: {text: "How much time do you spend on your phone every day?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["How", "much", "time", "do", "you", "spend", "on", "your", "phone", "every", "day"]}
          - {content_key: "en.a2.unit32.lesson04.teach.a_twice_a_day", kind: "dialogue", target: {text: "I check social media twice a day, in the morning and the evening.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit32.lesson04.teach.q_what_use_it_for", kind: "dialogue", target: {text: "What do you use it for?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "do", "you", "use", "it", "for"]}
          - {content_key: "en.a2.unit32.lesson04.teach.a_messaging_and_cooking_app", kind: "dialogue", target: {text: "I mostly use messaging apps to talk to my family, and I use a cooking app almost every day.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit32.lesson04.teach.q_good_thing", kind: "dialogue", target: {text: "Do you think social media is a good thing?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Do", "you", "think", "social", "media", "is", "a", "good", "thing"]}
          - {content_key: "en.a2.unit32.lesson04.teach.a_useful_but_waste_time", kind: "dialogue", target: {text: "In my opinion, it's useful for staying in touch, but it can waste a lot of time.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.a2.unit32.lesson04.exercise01.listen_leilas_frequency", type: "dialogue_comprehension", tested_text: "twice a day, in the morning and the evening", media_asset_key: "en.a2.audio.dialogue.online_habits.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit32.lesson04.exercise02.listen_what_leila_uses_it_for", type: "listen_select", tested_text: "messaging apps to talk to my family", media_asset_key: "en.a2.audio.dialogue.online_habits.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit32.lesson04.exercise03.choose_leilas_opinion", type: "multiple_choice", tested_text: "it's useful for staying in touch, but it can waste a lot of time", prompt: {target_blocks: [{text: "What is Leila's opinion about social media?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit32.lesson04.exercise04.order_how_much_time_question", type: "word_order", tested_text: "How much time do you spend on your phone every day", prompt: {target_blocks: []}, word_bank: ["much", "time", "do", "you", "spend", "on", "your", "phone", "every", "day", "How"]}
          - content_key: "en.a2.unit32.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "I check social media twice a day, in the morning and the evening. I mostly use messaging apps to talk to my family, and I use a cooking app almost every day. In my opinion, it's useful for staying in touch, but it can waste a lot of time."
            prompt: {target_blocks: [{text: "How much time do you spend on your phone every day?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit32.lesson04.exercise06.speak_online_habits_dialogue"
            type: "speak_response"
            tested_text: "I check social media twice a day, in the morning and the evening. I mostly use messaging apps to talk to my family, and I use a cooking app almost every day. In my opinion, it's useful for staying in touch, but it can waste a lot of time."
            prompt: {target_blocks: [{text: "How much time do you spend on your phone every day?", language_code: "en", direction: "ltr"}]}
