course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: describing job responsibilities, giving a colleague a status update on a work task (on schedule / behind schedule), and asking a colleague for professional help, in appropriately professional (but still warm, not stiff) workplace register."

media_assets:
  - {content_key: "en.b1.audio.workplace.words.deadline.01", language: "en", text: "deadline", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.workplace.sentence.01", language: "en", text: "I'm a little behind schedule, but I'll finish by Friday.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.workplace.01"
    language: "en"
    text: "Daniel: Mia, could you help me review this report before I send it? Mia: Of course. What do you need help with? Daniel: I want to make sure the numbers are correct. Mia: No problem. I'll check it this afternoon and send you my notes. Daniel: Thank you, I really appreciate it. Mia: You're welcome. Let me know if you need anything else."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit05.workplace"
    title: "My responsibilities and status updates"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.workplace.describe_responsibilities_and_updates"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit05.lesson01.workplace_vocabulary"
        title: "Responsible for, update, and deadline"
        spine_outcome_id: "universal.b1.workplace.describe_responsibilities_and_updates"
        teaching:
          - {content_key: "en.b1.unit05.lesson01.teach.responsible_for", kind: "vocabulary", target: {text: "responsible for", language_code: "en", direction: "ltr"}, introduced_tokens: ["responsible", "for"], example: {text: "I'm responsible for the monthly report.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit05.lesson01.teach.update", kind: "vocabulary", target: {text: "update", language_code: "en", direction: "ltr"}, introduced_tokens: ["update"], example: {text: "I give my team a weekly update.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit05.lesson01.teach.deadline", kind: "vocabulary", target: {text: "deadline", language_code: "en", direction: "ltr"}, introduced_tokens: ["deadline"], example: {text: "The deadline for the report is Friday.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit05.lesson01.teach.report", kind: "vocabulary", target: {text: "report", language_code: "en", direction: "ltr"}, introduced_tokens: ["report"], example: {text: "I write a sales report every month.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit05.lesson01.teach.on_schedule", kind: "vocabulary", target: {text: "on schedule", language_code: "en", direction: "ltr"}, introduced_tokens: ["on", "schedule"], example: {text: "The project is on schedule.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit05.lesson01.teach.behind_schedule", kind: "vocabulary", target: {text: "behind schedule", language_code: "en", direction: "ltr"}, introduced_tokens: ["behind"], example: {text: "We are a little behind schedule this week.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit05.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "deadline", media_asset_key: "en.b1.audio.workplace.words.deadline.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit05.lesson01.exercise02.choose_in_charge_of_phrase", type: "multiple_choice", tested_text: "responsible for", prompt: {target_blocks: [{text: "Which phrase means it is your job to take care of something?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson01.exercise03.choose_late_phrase", type: "multiple_choice", tested_text: "behind schedule", prompt: {target_blocks: [{text: "Which phrase means a task is going slower than planned?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson01.exercise04.match_workplace_words", type: "matching_pairs", tested_text: "responsible for deadline report on schedule behind schedule", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "responsible for", right: "it is your job to take care of this"}, {left: "deadline", right: "the date something must be finished by"}, {left: "report", right: "an update in a document"}, {left: "on schedule", right: "going as planned, not late"}, {left: "behind schedule", right: "going slower than planned"}]}
          - {content_key: "en.b1.unit05.lesson01.exercise05.write_deadline", type: "writing_prompt", tested_text: "deadline", prompt: {target_blocks: [{text: "Write the word for the date something must be finished by.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit05.lesson02.giving_a_status_update"
        title: "I'm responsible for, I'm behind schedule"
        spine_outcome_id: "universal.b1.workplace.describe_responsibilities_and_updates"
        teaching:
          - {content_key: "en.b1.unit05.lesson02.teach.responsible_for_report", kind: "phrase", target: {text: "I'm responsible for the monthly report.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'm", "responsible", "for", "the", "monthly", "report"]}
          - {content_key: "en.b1.unit05.lesson02.teach.project_on_schedule", kind: "phrase", target: {text: "The project is on schedule.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "project", "is", "on", "schedule"]}
          - {content_key: "en.b1.unit05.lesson02.teach.behind_schedule_finish_friday", kind: "phrase", target: {text: "I'm a little behind schedule, but I'll finish by Friday.", language_code: "en", direction: "ltr"}, introduced_tokens: ["a", "little", "behind", "but", "I'll", "finish", "by", "Friday"], media_asset_key: "en.b1.audio.workplace.sentence.01"}
          - {content_key: "en.b1.unit05.lesson02.teach.grammar_status_update", kind: "grammar_note", target: {text: "I'm responsible for the report. The project is on schedule. I'm behind schedule.", language_code: "en", direction: "ltr"}, introduced_tokens: []}
        exercises:
          - {content_key: "en.b1.unit05.lesson02.exercise01.choose_daniels_responsibility", type: "multiple_choice", tested_text: "I'm responsible for the monthly report.", prompt: {target_blocks: [{text: "Which sentence describes a responsibility at work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson02.exercise02.choose_status_update", type: "multiple_choice", tested_text: "I'm a little behind schedule, but I'll finish by Friday.", prompt: {target_blocks: [{text: "Which sentence gives a status update about being a bit late?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson02.exercise03.order_project_on_schedule", type: "word_order", tested_text: "The project is on schedule", prompt: {target_blocks: []}, word_bank: ["project", "is", "on", "schedule", "The"]}
          - {content_key: "en.b1.unit05.lesson02.exercise04.reply_what_are_you_responsible_for", type: "dialogue_response", tested_text: "I'm responsible for the monthly report", prompt: {target_blocks: [{text: "What are you responsible for at work?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson02.exercise05.write_behind_schedule", type: "writing_prompt", tested_text: "I'm a little behind schedule, but I'll finish by Friday.", prompt: {target_blocks: [{text: "Write that you're a little behind schedule but will finish by Friday.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit05.lesson03.reading_a_weekly_update"
        title: "Reading: Daniel's weekly update"
        spine_outcome_id: "universal.b1.workplace.describe_responsibilities_and_updates"
        teaching:
          - {content_key: "en.b1.unit05.lesson03.teach.team", kind: "vocabulary", target: {text: "team", language_code: "en", direction: "ltr"}, introduced_tokens: ["team"], example: {text: "He gives his team a short update every week.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit05.lesson03.teach.technical_problem", kind: "vocabulary", target: {text: "technical problem", language_code: "en", direction: "ltr"}, introduced_tokens: ["technical", "problem"], example: {text: "He is behind schedule because of a technical problem.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit05.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Daniel is responsible for the monthly sales report. Every week, he gives his team a short update. This week, he is a little behind schedule because of a technical problem, but he expects to finish by Friday. He always tells his team the truth about delays.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["Daniel", "sales", "Every", "week", "he", "gives", "his", "short", "This", "because", "of", "expects", "to", "always", "tells", "truth", "about", "delays"]
        exercises:
          - {content_key: "en.b1.unit05.lesson03.exercise01.comprehend_daniels_responsibility", type: "reading_comprehension", tested_text: "the monthly sales report", prompt: {target_blocks: [{text: "What is Daniel responsible for?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson03.exercise02.comprehend_why_hes_behind", type: "reading_comprehension", tested_text: "a technical problem", prompt: {target_blocks: [{text: "Why is Daniel a little behind schedule this week?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson03.exercise03.recognize_team", type: "multiple_choice", tested_text: "team", prompt: {target_blocks: [{text: "Which word means a group of people who work together?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson03.exercise04.order_he_gives_his_team_update", type: "word_order", tested_text: "He gives his team a short update", prompt: {target_blocks: []}, word_bank: ["gives", "his", "team", "a", "short", "update", "He"]}
          - {content_key: "en.b1.unit05.lesson03.exercise05.write_daniel_always_tells_truth", type: "writing_prompt", tested_text: "He always tells his team the truth about delays.", prompt: {target_blocks: [{text: "Write that he always tells his team the truth about delays.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit05.lesson04.asking_a_colleague_for_help"
        title: "Could you help me review this?"
        spine_outcome_id: "universal.b1.workplace.describe_responsibilities_and_updates"
        teaching:
          - {content_key: "en.b1.unit05.lesson04.teach.q_could_you_help_review", kind: "dialogue", target: {text: "Mia, could you help me review this report before I send it?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Mia", "could", "you", "help", "me", "review", "this", "report", "before", "I", "send", "it"], media_asset_key: "en.b1.audio.dialogue.workplace.01"}
          - {content_key: "en.b1.unit05.lesson04.teach.a_of_course_what_help", kind: "dialogue", target: {text: "Of course. What do you need help with?", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Of", "course", "What", "do", "need", "help", "with"]}
          - {content_key: "en.b1.unit05.lesson04.teach.q_make_sure_numbers", kind: "dialogue", target: {text: "I want to make sure the numbers are correct.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["want", "to", "make", "sure", "the", "numbers", "are", "correct"]}
          - {content_key: "en.b1.unit05.lesson04.teach.a_check_this_afternoon", kind: "dialogue", target: {text: "No problem. I'll check it this afternoon and send you my notes.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["No", "problem", "I'll", "check", "it", "this", "afternoon", "and", "send", "you", "my", "notes"]}
          - {content_key: "en.b1.unit05.lesson04.teach.q_thank_you_appreciate", kind: "dialogue", target: {text: "Thank you, I really appreciate it.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Thank", "you", "really", "appreciate", "it"]}
          - {content_key: "en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know", kind: "dialogue", target: {text: "You're welcome. Let me know if you need anything else.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["You're", "welcome", "Let", "me", "know", "if", "you", "need", "anything", "else"]}
        exercises:
          - {content_key: "en.b1.unit05.lesson04.exercise01.listen_what_daniel_asks_for", type: "dialogue_comprehension", tested_text: "help me review this report", media_asset_key: "en.b1.audio.dialogue.workplace.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit05.lesson04.exercise02.listen_when_mia_will_check", type: "listen_select", tested_text: "this afternoon", media_asset_key: "en.b1.audio.dialogue.workplace.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit05.lesson04.exercise03.choose_what_daniel_wants_checked", type: "multiple_choice", tested_text: "the numbers are correct", prompt: {target_blocks: [{text: "What does Daniel want Mia to check?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit05.lesson04.exercise04.order_could_you_help_me_review", type: "word_order", tested_text: "Could you help me review this report", prompt: {target_blocks: []}, word_bank: ["you", "help", "me", "review", "this", "report", "Could"]}
          - content_key: "en.b1.unit05.lesson04.exercise05.reply_as_mia"
            type: "dialogue_response"
            tested_text: "Of course What do you need help with"
            prompt: {target_blocks: [{text: "Mia, could you help me review this report before I send it?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit05.lesson04.exercise06.speak_workplace_dialogue"
            type: "speak_response"
            tested_text: "No problem I'll check it this afternoon and send you my notes"
            prompt: {target_blocks: [{text: "I want to make sure the numbers are correct.", language_code: "en", direction: "ltr"}]}
