        spine_outcome_id: "universal.a1.museum.visit_a_museum"
        teaching:
          - {content_key: "en.a1.unit58.lesson01.teach.museum", kind: "vocabulary", target: {text: "museum", language_code: "en", direction: "ltr"}, introduced_tokens: ["museum", "This", "is", "very", "old"], example: {text: "This museum is very old.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit58.lesson01.teach.ticket", kind: "vocabulary", target: {text: "ticket", language_code: "en", direction: "ltr"}, introduced_tokens: ["ticket", "I", "need", "one", "please"], example: {text: "I need one ticket, please.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit58.lesson01.teach.exhibition", kind: "vocabulary", target: {text: "exhibition", language_code: "en", direction: "ltr"}, introduced_tokens: ["exhibition", "There", "a", "new"], example: {text: "There is a new exhibition.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit58.lesson01.teach.painting", kind: "vocabulary", target: {text: "painting", language_code: "en", direction: "ltr"}, introduced_tokens: ["painting", "really", "like"], example: {text: "I really like this painting.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit58.lesson01.teach.sculpture", kind: "vocabulary", target: {text: "sculpture", language_code: "en", direction: "ltr"}, introduced_tokens: ["sculpture", "too"], example: {text: "This sculpture is very old too.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit58.lesson01.teach.guide", kind: "vocabulary", target: {text: "guide", language_code: "en", direction: "ltr"}, introduced_tokens: ["guide", "today"], example: {text: "Is there a guide today?", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit58.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "ticket", media_asset_key: "en.a1.audio.museum.words.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit58.lesson01.exercise02.choose_sculpture_meaning", type: "multiple_choice", tested_text: "sculpture", prompt: {target_blocks: [{text: "Which word means a statue made of stone, wood, or metal?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit58.lesson01.exercise03.match_museum_words", type: "matching_pairs", tested_text: "museum ticket exhibition painting sculpture guide", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "a building where you can see art and historical objects", right: "museum"}, {left: "the card or paper you buy to enter", right: "ticket"}, {left: "a collection of art or objects on display", right: "exhibition"}, {left: "a picture made with paint", right: "painting"}, {left: "a statue made of stone, wood, or metal", right: "sculpture"}, {left: "a person who shows visitors around and explains things", right: "guide"}]}
          - {content_key: "en.a1.unit58.lesson01.exercise04.order_museum_sentence", type: "word_order", tested_text: "This museum is very old.", word_bank: ["This", "museum", "is", "very", "old."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit58.lesson01.exercise05.write_guide", type: "writing_prompt", tested_text: "guide", prompt: {target_blocks: [{text: "Write the word for a person who shows visitors around a museum.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit58.lesson02.phrases_for_the_museum"
        title: "Phrases for the museum"
        spine_outcome_id: "universal.a1.museum.visit_a_museum"
        teaching:
