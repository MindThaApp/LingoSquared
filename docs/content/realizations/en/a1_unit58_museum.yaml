course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English. Museum register is a simple, everyday spoken exchange between two friends and a clerk about visiting a museum: asking when it closes, buying tickets, asking about a guide for the current exhibition, and reacting to what they saw afterward. Core vocabulary (museum/ticket/exhibition/painting/sculpture/guide) is deliberately generic to a routine local-museum visit, not an art-history or docent-tour register."

media_assets:
  - {content_key: "en.a1.audio.museum.words.01", language: "en", text: "museum, ticket, exhibition, painting, sculpture, guide", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.museum.phrases.01", language: "en", text: "What time does the museum open? What time does the museum close? Two tickets, please. Is there a guide for the exhibition? The museum is open every day. I really enjoyed the paintings!", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.museum.01"
    language: "en"
    text: "Daniel: Hi! What time does the museum close? Clerk: We close at five o'clock. Mia: Great. Can we have two tickets, please? Clerk: Of course. That's twelve dollars. Daniel: Is there a guide for the exhibition? Clerk: Yes, there's a guide near the entrance. Mia: What is the exhibition called? Clerk: It's called Colors of the City. Daniel: Thank you! I can't wait to see the paintings."
    voice_hint: "three_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit58.museum"
    title: "Visiting a museum"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.museum.visit_a_museum"
    planned_lesson_count: 4
    lessons:
