          - {content_key: "en.a1.unit58.lesson02.teach.what_time_does_the_museum_close", kind: "phrase", target: {text: "What time does the museum close?", language_code: "en", direction: "ltr"}, introduced_tokens: ["close"]}
          - {content_key: "en.a1.unit58.lesson02.teach.two_tickets_please", kind: "phrase", target: {text: "Two tickets, please.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Two", "tickets"]}
