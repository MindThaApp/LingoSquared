      - content_key: "en.a1.unit58.lesson04.an_afternoon_at_the_museum"
        title: "Reading: An afternoon at the museum"
        spine_outcome_id: "universal.a1.museum.visit_a_museum"
        teaching:
          - {content_key: "en.a1.unit58.lesson04.teach.museum_notice", kind: "reading", target: {text: "City Museum: Open every day, 9:00 to 5:00. Adult ticket: $6. Current exhibition: Colors of the City, Room 2.", language_code: "en", direction: "ltr"}, introduced_tokens: ["9:00", "to", "5:00", "Adult", "$6", "Current", "Room", "2"]}
          - {content_key: "en.a1.unit58.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Visit to the Museum: One Saturday afternoon, Daniel and Mia decided to visit the City Museum together. At the entrance, the clerk told them the museum closes at five o'clock. They bought two tickets for twelve dollars. Mia asked about a guide, and the clerk said there was one near the entrance. They visited the exhibition, Colors of the City, and saw many beautiful paintings in Room 2. Daniel liked a painting of the old town square, and Mia liked a painting of the river at sunset. When they left, Mia said she wants to visit the sculpture exhibition next time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Visit", "Saturday", "afternoon", "Daniel", "and", "Mia", "decided", "together", "clerk", "told", "them", "closes", "They", "bought", "asked", "about", "said", "was", "visited", "saw", "many", "beautiful", "in", "liked", "town", "square", "river", "sunset", "When", "left", "she", "wants", "next"]}
        exercises:
          - {content_key: "en.a1.unit58.lesson04.exercise01.notice_closing_time", type: "multiple_choice", tested_text: "5:00", prompt: {target_blocks: [{text: "According to the notice, what time does the museum close?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit58.lesson04.exercise02.notice_ticket_price", type: "multiple_choice", tested_text: "$6", prompt: {target_blocks: [{text: "According to the notice, how much is an adult ticket?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit58.lesson04.exercise03.notice_exhibition_room", type: "multiple_choice", tested_text: "Room 2", prompt: {target_blocks: [{text: "According to the notice, which room has the current exhibition?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit58.lesson04.exercise04.reading_ticket_count", type: "multiple_choice", tested_text: "two", prompt: {target_blocks: [{text: "According to the reading, how many tickets did Daniel and Mia buy?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit58.lesson04.exercise05.write_own_museum_message", type: "writing_prompt", tested_text: "They saw Colors of the City. That's twelve dollars.", prompt: {target_blocks: [{text: "Write a short message: say which exhibition they saw, and say how much the tickets cost.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["They saw Colors of the City. That's twelve dollars.", "They saw Colors of the City, and that's twelve dollars.", "They saw Colors of the City and that's twelve dollars."]}
