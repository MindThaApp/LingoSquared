          - {content_key: "en.a1.unit58.lesson02.teach.the_museum_is_open_every_day", kind: "phrase", target: {text: "The museum is open every day.", language_code: "en", direction: "ltr"}, introduced_tokens: ["The", "every", "day"]}
          - {content_key: "en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings", kind: "phrase", target: {text: "I really enjoyed the paintings!", language_code: "en", direction: "ltr"}, introduced_tokens: ["enjoyed", "paintings"]}
        exercises:
