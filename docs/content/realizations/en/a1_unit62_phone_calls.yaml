course:
  realization_key: "en.a1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English for basic phone calls: saying who is calling, asking to speak to someone, asking for repetition, and leaving or returning a short message."

media_assets:
  - {content_key: "en.a1.audio.phone_calls.words.voicemail.01", language: "en", text: "voicemail", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a1.audio.phone_calls.phrases.please_repeat_that.01", language: "en", text: "Please repeat that.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a1.audio.dialogue.phone_calls.01"
    language: "en"
    text: "Mia: Hello, this is Mia. Leila: Hi Mia, this is Leila. Leila: I can't hear you well. Please speak slowly. Mia: Sure. The meeting is at four. Leila: Please repeat that. Mia: Four o'clock. Leila: Thank you. I'll call back later."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a1.unit62.phone_calls"
    title: "Phone calls"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.communication.basic_phone_contact"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit62.lesson01.phone_words"
        title: "Words for phone calls"
        spine_outcome_id: "universal.a1.communication.basic_phone_contact"
        teaching:
          - {content_key: "en.a1.unit62.lesson01.teach.phone", kind: "vocabulary", target: {text: "phone", language_code: "en", direction: "ltr"}, introduced_tokens: ["phone", "My", "is", "here"], example: {text: "My phone is here.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit62.lesson01.teach.call", kind: "vocabulary", target: {text: "call", language_code: "en", direction: "ltr"}, introduced_tokens: ["call", "I", "can", "you"], example: {text: "I can call you.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit62.lesson01.teach.message", kind: "vocabulary", target: {text: "message", language_code: "en", direction: "ltr"}, introduced_tokens: ["message", "Leave", "a"], example: {text: "Leave a message.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit62.lesson01.teach.voicemail", kind: "vocabulary", target: {text: "voicemail", language_code: "en", direction: "ltr"}, introduced_tokens: ["voicemail", "The", "short"], example: {text: "The voicemail is short.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit62.lesson01.teach.repeat", kind: "vocabulary", target: {text: "repeat", language_code: "en", direction: "ltr"}, introduced_tokens: ["repeat", "Please", "that"], example: {text: "Please repeat that.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a1.unit62.lesson01.teach.slowly", kind: "vocabulary", target: {text: "slowly", language_code: "en", direction: "ltr"}, introduced_tokens: ["slowly", "speak"], example: {text: "Please speak slowly.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit62.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "voicemail", media_asset_key: "en.a1.audio.phone_calls.words.voicemail.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit62.lesson01.exercise02.choose_repeat_meaning", type: "multiple_choice", tested_text: "repeat", prompt: {target_blocks: [{text: "Which word means say again?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson01.exercise03.match_phone_words", type: "matching_pairs", tested_text: "phone call message voicemail repeat slowly", prompt: {target_blocks: [{text: "Match each word to its meaning.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "phone", right: "a device for talking to someone far away"}, {left: "call", right: "a phone conversation"}, {left: "message", right: "short information you send or leave"}, {left: "voicemail", right: "a recorded phone message"}, {left: "repeat", right: "say again"}, {left: "slowly", right: "not quickly"}]}
          - {content_key: "en.a1.unit62.lesson01.exercise04.order_repeat_sentence", type: "word_order", tested_text: "Please repeat that.", word_bank: ["Please", "repeat", "that."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson01.exercise05.write_message", type: "writing_prompt", tested_text: "message", prompt: {target_blocks: [{text: "Write the word for short information you send or leave.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit62.lesson02.phone_phrases"
        title: "Phrases on the phone"
        spine_outcome_id: "universal.a1.communication.basic_phone_contact"
        teaching:
          - {content_key: "en.a1.unit62.lesson02.teach.this_is_leila", kind: "phrase", target: {text: "Hello, this is Leila.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Hello", "this", "Leila"]}
          - {content_key: "en.a1.unit62.lesson02.teach.speak_to_mia", kind: "phrase", target: {text: "Can I speak to Mia?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Can", "I", "speak", "to", "Mia"]}
          - {content_key: "en.a1.unit62.lesson02.teach.repeat_that", kind: "phrase", target: {text: "Please repeat that.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Please", "repeat", "that"]}
          - {content_key: "en.a1.unit62.lesson02.teach.speak_slowly", kind: "phrase", target: {text: "Please speak slowly.", language_code: "en", direction: "ltr"}, introduced_tokens: ["slowly"]}
          - {content_key: "en.a1.unit62.lesson02.teach.leave_message", kind: "phrase", target: {text: "Leave a message.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Leave", "a", "message"]}
          - {content_key: "en.a1.unit62.lesson02.teach.call_back_later", kind: "phrase", target: {text: "I'll call back later.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'll", "back", "later"]}
        exercises:
          - {content_key: "en.a1.unit62.lesson02.exercise01.listen_phrase", type: "listen_select", tested_text: "Please repeat that.", media_asset_key: "en.a1.audio.phone_calls.phrases.please_repeat_that.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit62.lesson02.exercise02.choose_repeat_request", type: "multiple_choice", tested_text: "Please repeat that.", prompt: {target_blocks: [{text: "Which phrase asks someone to say something again?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson02.exercise03.choose_speak_to_mia", type: "multiple_choice", tested_text: "Can I speak to Mia?", prompt: {target_blocks: [{text: "Which phrase asks for Mia on the phone?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson02.exercise04.order_call_back_sentence", type: "word_order", tested_text: "I'll call back later.", word_bank: ["I'll", "call", "back", "later."], prompt: {target_blocks: [{text: "Put the words in the correct order.", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson02.exercise05.translate_speak_slowly", type: "translation", tested_text: "Please speak slowly.", prompt: {target_blocks: [{text: "Translate: \"Please speak slowly.\"", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit62.lesson03.dialogue_on_the_phone"
        title: "Dialogue: On the phone"
        spine_outcome_id: "universal.a1.communication.basic_phone_contact"
        teaching:
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line1", kind: "dialogue", target: {text: "Hello, this is Mia.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line2", kind: "dialogue", target: {text: "Hi Mia, this is Leila.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hi"], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line3", kind: "dialogue", target: {text: "I can't hear you well.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["can't", "hear", "well"], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line4", kind: "dialogue", target: {text: "Please speak slowly.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line5", kind: "dialogue", target: {text: "Sure. The meeting is at four.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["Sure", "meeting", "at", "four"], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line6", kind: "dialogue", target: {text: "Please repeat that.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: [], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line7", kind: "dialogue", target: {text: "Four o'clock.", language_code: "en", direction: "ltr", speaker: "Mia"}, introduced_tokens: ["o'clock"], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
          - {content_key: "en.a1.unit62.lesson03.teach.dialogue_line8", kind: "dialogue", target: {text: "Thank you. I'll call back later.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Thank", "you"], media_asset_key: "en.a1.audio.dialogue.phone_calls.01"}
        exercises:
          - {content_key: "en.a1.unit62.lesson03.exercise01.comprehension_caller", type: "multiple_choice", tested_text: "Leila", prompt: {target_blocks: [{text: "According to the dialogue, who is calling Mia?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson03.exercise02.comprehension_meeting_time", type: "multiple_choice", tested_text: "four", prompt: {target_blocks: [{text: "According to the dialogue, what time is the meeting?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson03.exercise03.listen_dialogue_repeat", type: "listen_select", tested_text: "Please repeat that.", media_asset_key: "en.a1.audio.dialogue.phone_calls.01", prompt: {target_blocks: [{text: "Which phrase asks for repetition?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson03.exercise04.respond_own_phone_call", type: "speak_response", tested_text: "Please repeat that.", accepted_answers: ["Please repeat that", "Please repeat that.", "Please speak slowly", "Please speak slowly.", "Hello, this is Leila", "Hello, this is Leila.", "I'll call back later", "I'll call back later."], prompt: {target_blocks: [{text: "Answer a phone call, ask for repetition, or say you will call later.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit62.lesson04.phone_message"
        title: "Reading: A phone message"
        spine_outcome_id: "universal.a1.communication.basic_phone_contact"
        teaching:
          - {content_key: "en.a1.unit62.lesson04.teach.phone_note", kind: "reading", target: {text: "Phone message: Mia called at 4:00. Meeting in Room 5. Please call back.", language_code: "en", direction: "ltr"}, introduced_tokens: ["called", "4:00", "Meeting", "in", "Room", "5"]}
          - {content_key: "en.a1.unit62.lesson04.teach.reading_passage", kind: "reading", target: {text: "A Short Phone Call: Leila called Mia in the afternoon. The sound was not clear, so Leila asked Mia to speak slowly. Mia said the meeting was at four o'clock in Room 5. Leila asked Mia to repeat the time. Later, Leila wrote a phone message. The message said Mia called at 4:00 and asked her to call back.", language_code: "en", direction: "ltr"}, introduced_tokens: ["A", "Short", "Phone", "Call", "afternoon", "The", "sound", "was", "not", "clear", "so", "asked", "said", "time", "Later", "wrote", "her"]}
        exercises:
          - {content_key: "en.a1.unit62.lesson04.exercise01.message_time", type: "multiple_choice", tested_text: "4:00", prompt: {target_blocks: [{text: "According to the message, what time did Mia call?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson04.exercise02.message_room", type: "multiple_choice", tested_text: "Room 5", prompt: {target_blocks: [{text: "According to the message, where is the meeting?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson04.exercise03.reading_why_slowly", type: "multiple_choice", tested_text: "The sound was not clear", prompt: {target_blocks: [{text: "According to the reading, why did Leila ask Mia to speak slowly?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson04.exercise04.reading_repeat_detail", type: "multiple_choice", tested_text: "the time", prompt: {target_blocks: [{text: "According to the reading, what did Leila ask Mia to repeat?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a1.unit62.lesson04.exercise05.write_own_phone_message", type: "writing_prompt", tested_text: "Mia called at 4:00. Please call back.", prompt: {target_blocks: [{text: "Write a short phone message: say who called and what to do.", language_code: "en", direction: "ltr"}]}, accepted_answers: ["Mia called at 4:00. Please call back.", "Mia called at 4:00, and please call back.", "Mia called at 4:00 and please call back."]}
