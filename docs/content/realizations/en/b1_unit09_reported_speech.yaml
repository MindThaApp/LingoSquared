course:
  realization_key: "en.b1"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at B1 level: reporting what someone said or asked with said that, told me that, asked whether, and asked if, in everyday messages and workplace coordination."

media_assets:
  - {content_key: "en.b1.audio.reported_speech.word.available.01", language: "en", text: "available", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.b1.audio.reported_speech.sentence.01", language: "en", text: "Mia said that she was available after lunch.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.b1.audio.dialogue.reported_speech.01"
    language: "en"
    text: "Daniel: Did Mia reply about the review? Leila: Yes, she said that she was available after lunch. Daniel: Great. Did she ask anything else? Leila: She asked if we needed the full report today. Daniel: What did you tell her? Leila: I told her that a short summary was enough. Daniel: Perfect. I will tell the team that we can meet at two."
    voice_hint: "two_adults_neutral_professional"
    status: "pending_generation"

units:
  - content_key: "en.b1.unit09.reported_speech"
    title: "She said that she was available"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.b1.reported_speech.report_what_someone_said"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.b1.unit09.lesson01.reported_speech_vocabulary"
        title: "Said that, asked if, and message"
        spine_outcome_id: "universal.b1.reported_speech.report_what_someone_said"
        teaching:
          - {content_key: "en.b1.unit09.lesson01.teach.said_that", kind: "vocabulary", target: {text: "said that", language_code: "en", direction: "ltr"}, introduced_tokens: ["said", "that"], example: {text: "She said that she was busy.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit09.lesson01.teach.told_me_that", kind: "vocabulary", target: {text: "told me that", language_code: "en", direction: "ltr"}, introduced_tokens: ["told", "me"], example: {text: "He told me that the meeting was canceled.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit09.lesson01.teach.asked_whether", kind: "vocabulary", target: {text: "asked whether", language_code: "en", direction: "ltr"}, introduced_tokens: ["asked", "whether"], example: {text: "Mia asked whether we needed help.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit09.lesson01.teach.asked_if", kind: "vocabulary", target: {text: "asked if", language_code: "en", direction: "ltr"}, introduced_tokens: ["if"], example: {text: "Mia asked if we needed help.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit09.lesson01.teach.message", kind: "vocabulary", target: {text: "message", language_code: "en", direction: "ltr"}, introduced_tokens: ["message"], example: {text: "Leila sent a message after lunch.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit09.lesson01.teach.confirm", kind: "vocabulary", target: {text: "confirm", language_code: "en", direction: "ltr"}, introduced_tokens: ["confirm"], example: {text: "Please confirm the time before you leave.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit09.lesson01.teach.available", kind: "vocabulary", target: {text: "available", language_code: "en", direction: "ltr"}, introduced_tokens: ["available"], example: {text: "Mia is available after lunch.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.b1.unit09.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "available", media_asset_key: "en.b1.audio.reported_speech.word.available.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit09.lesson01.exercise02.choose_said_that", type: "multiple_choice", tested_text: "said that", prompt: {target_blocks: [{text: "Which phrase reports a statement someone made?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson01.exercise03.choose_available", type: "multiple_choice", tested_text: "available", prompt: {target_blocks: [{text: "Which word means free or able to meet?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson01.exercise04.match_reported_speech_words", type: "matching_pairs", tested_text: "said that told me that asked whether asked if message confirm available", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "said that", right: "reports a statement someone made"}, {left: "told me that", right: "reports information someone gave to you"}, {left: "asked whether", right: "reports a yes-or-no question, slightly formal"}, {left: "asked if", right: "reports a yes-or-no question in everyday speech"}, {left: "message", right: "a short written or spoken note"}, {left: "confirm", right: "to say that something is definite or correct"}, {left: "available", right: "free or able to meet"}]}
          - {content_key: "en.b1.unit09.lesson01.exercise05.write_confirm", type: "writing_prompt", tested_text: "confirm", prompt: {target_blocks: [{text: "Write the word that means to say something is definite or correct.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.b1.unit09.lesson02.reporting_statements"
        title: "Mia said that she was available"
        spine_outcome_id: "universal.b1.reported_speech.report_what_someone_said"
        teaching:
          - {content_key: "en.b1.unit09.lesson02.teach.mia_available", kind: "phrase", target: {text: "Mia said that she was available after lunch.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Mia", "said", "that", "she", "was", "available", "after", "lunch"], media_asset_key: "en.b1.audio.reported_speech.sentence.01"}
          - {content_key: "en.b1.unit09.lesson02.teach.leila_told_me", kind: "phrase", target: {text: "Leila told me that the office was busy.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Leila", "told", "me", "the", "office", "busy"]}
          - {content_key: "en.b1.unit09.lesson02.teach.grammar_backshift", kind: "grammar_note", target: {text: "Mia says, \"I am available.\" Mia said that she was available.", language_code: "en", direction: "ltr"}, introduced_tokens: ["says", "am"]}
        exercises:
          - {content_key: "en.b1.unit09.lesson02.exercise01.choose_mia_available", type: "multiple_choice", tested_text: "Mia said that she was available after lunch.", prompt: {target_blocks: [{text: "Which sentence reports what Mia said?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson02.exercise02.choose_room_busy", type: "multiple_choice", tested_text: "Leila told me that the office was busy.", prompt: {target_blocks: [{text: "Which sentence reports information Leila gave to the speaker?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson02.exercise03.order_mia_said_available", type: "word_order", tested_text: "Mia said that she was available after lunch", prompt: {target_blocks: []}, word_bank: ["said", "that", "she", "was", "available", "after", "lunch", "Mia"]}
          - {content_key: "en.b1.unit09.lesson02.exercise04.reply_what_did_mia_say", type: "dialogue_response", tested_text: "Mia said that she was available after lunch", prompt: {target_blocks: [{text: "What did Mia say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson02.exercise05.write_leila_told_me", type: "writing_prompt", tested_text: "Leila told me that the office was busy.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit09.lesson03.reading_the_message_chain"
        title: "Reading: the message chain"
        spine_outcome_id: "universal.b1.reported_speech.report_what_someone_said"
        teaching:
          - {content_key: "en.b1.unit09.lesson03.teach.short_summary", kind: "vocabulary", target: {text: "short summary", language_code: "en", direction: "ltr"}, introduced_tokens: ["short", "summary", "A", "a", "enough"], example: {text: "A short summary is enough for today's meeting.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.b1.unit09.lesson03.teach.full_report", kind: "vocabulary", target: {text: "full report", language_code: "en", direction: "ltr"}, introduced_tokens: ["full", "report", "the"], example: {text: "Mia asked whether we needed the full report.", language_code: "en", direction: "ltr"}}
          - content_key: "en.b1.unit09.lesson03.teach.reading_passage"
            kind: "reading"
            target: {text: "Leila read Mia's message and called Daniel. She said that Mia was available after lunch. She also said that Mia had finished the numbers. Mia asked whether the team needed the full report today. Daniel told Leila that a short summary was enough, because the meeting was only fifteen minutes long.", language_code: "en", direction: "ltr"}
            introduced_tokens: ["read", "Mia's", "called", "Daniel", "also", "had", "finished", "numbers", "team", "needed", "today", "because", "only", "fifteen", "minutes", "long"]
        exercises:
          - {content_key: "en.b1.unit09.lesson03.exercise01.comprehend_mia_available", type: "reading_comprehension", tested_text: "Mia was available after lunch", prompt: {target_blocks: [{text: "What did Leila say about Mia?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson03.exercise02.comprehend_mia_asked", type: "reading_comprehension", tested_text: "whether the team needed the full report today", prompt: {target_blocks: [{text: "What did Mia ask?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson03.exercise03.recognize_short_summary", type: "multiple_choice", tested_text: "short summary", prompt: {target_blocks: [{text: "Which phrase means a brief version with only the main points?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson03.exercise04.order_mia_asked_whether", type: "word_order", tested_text: "Mia asked whether the team needed the full report today", prompt: {target_blocks: []}, word_bank: ["asked", "whether", "the", "team", "needed", "the", "full", "report", "today", "Mia"]}
          - {content_key: "en.b1.unit09.lesson03.exercise05.write_short_summary", type: "writing_prompt", tested_text: "Daniel said that a short summary was enough.", prompt: {target_blocks: []}}

      - content_key: "en.b1.unit09.lesson04.the_reported_message_dialogue"
        title: "She asked whether we needed the full report"
        spine_outcome_id: "universal.b1.reported_speech.report_what_someone_said"
        teaching:
          - {content_key: "en.b1.unit09.lesson04.teach.q_mia_reply", kind: "dialogue", target: {text: "Did Mia reply about the review?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Did", "Mia", "reply", "about", "review"], media_asset_key: "en.b1.audio.dialogue.reported_speech.01"}
          - {content_key: "en.b1.unit09.lesson04.teach.a_she_said_available", kind: "dialogue", target: {text: "Yes, she said that she was available after lunch.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "she", "said", "that", "was", "available", "after", "lunch"]}
          - {content_key: "en.b1.unit09.lesson04.teach.q_anything_else", kind: "dialogue", target: {text: "Great. Did she ask anything else?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Great", "ask", "anything", "else"]}
          - {content_key: "en.b1.unit09.lesson04.teach.a_asked_if_report", kind: "dialogue", target: {text: "She asked if we needed the full report today.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["asked", "if", "we", "needed", "full", "report", "today"]}
          - {content_key: "en.b1.unit09.lesson04.teach.q_what_tell_her", kind: "dialogue", target: {text: "What did you tell her?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["What", "tell", "her"]}
          - {content_key: "en.b1.unit09.lesson04.teach.a_short_summary_enough", kind: "dialogue", target: {text: "I told her that a short summary was enough.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["I", "told", "a", "short", "summary", "enough"]}
          - {content_key: "en.b1.unit09.lesson04.teach.q_tell_team", kind: "dialogue", target: {text: "Perfect. I will tell the team that we can meet at two.", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Perfect", "the", "team", "can", "meet", "at", "two"]}
        exercises:
          - {content_key: "en.b1.unit09.lesson04.exercise01.listen_what_mia_said", type: "dialogue_comprehension", tested_text: "she was available after lunch", media_asset_key: "en.b1.audio.dialogue.reported_speech.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit09.lesson04.exercise02.listen_what_mia_asked", type: "listen_select", tested_text: "if we needed the full report today", media_asset_key: "en.b1.audio.dialogue.reported_speech.01", prompt: {target_blocks: []}}
          - {content_key: "en.b1.unit09.lesson04.exercise03.choose_what_leila_told_mia", type: "multiple_choice", tested_text: "a short summary was enough", prompt: {target_blocks: [{text: "What did Leila tell Mia?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.b1.unit09.lesson04.exercise04.order_told_her_summary", type: "word_order", tested_text: "I told her that a short summary was enough", prompt: {target_blocks: []}, word_bank: ["told", "her", "that", "a", "short", "summary", "was", "enough", "I"]}
          - content_key: "en.b1.unit09.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "She said that she was available after lunch"
            prompt: {target_blocks: [{text: "Did Mia reply about the review?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.b1.unit09.lesson04.exercise06.speak_reported_speech_dialogue"
            type: "speak_response"
            tested_text: "She asked if we needed the full report today"
            prompt: {target_blocks: [{text: "Great. Did she ask anything else?", language_code: "en", direction: "ltr"}]}
