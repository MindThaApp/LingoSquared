schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: "en"
cefr_level: "A2"
generation_provenance:
  method: "authored_from_established_conventions"
  authoring_system: "claude"
  human_reviewed: false
  source_note: >-
    Firecrawl was unavailable this session (402, out of credits) and no
    cached scrape existed in .firecrawl/ for A2 ESL shopping-complaint/
    return-and-refund material. Authored directly from established ESL
    A2 conventions (universal_spine.yaml's
    universal.a2.shopping.make_a_complaint node, which requires the A1
    shopping prerequisite and an opinion/reason per
    universal.a2.opinions.give_opinions_with_reasons) and this unit's
    own predecessor pattern (a2_unit25_bureaucracy's formal-register
    scaffold), not adapted from any specific public-domain course.
    Introduces a new item (a blender) and a new generic "Store Clerk"
    role -- no prior unit fixes a specific purchase for Leila, so this
    does not conflict with established facts.
status: "complete_draft"
review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Last of 5 new A2 units closing the en-realization gap against fa/prs's
    a2_unit14-18 -- spine outcome universal.a2.shopping.make_a_complaint.
    Leila returns a blender that stopped working after one use; the
    Store Clerk asks for a receipt and offers a refund or exchange.
    Facts (bought last week, $35 refund, 30-day return window) kept
    consistent across lesson03's return-policy notice and lesson04's
    dialogue per §11. Every multi-clause accepted_answers entry
    authored with period/conjunction-joined forms per §12.

    2026-07-11 fresh-context review (Claude, zero access to authoring
    reasoning). Internal facts consistent ($35 refund, 30-day window, bought
    last week); new "Store Clerk" role and blender purchase introduce no
    corpus conflict. listen_select/dialogue_comprehension distractors all checked
    clean (none spoken by the tested speaker in-audio). Fixed in the fa-en
    overlay: all 3 word_order accepted_answers were in scrambled word_bank order
    rather than correct sentence order (see overlay note). No realization-level
    edit needed for this unit.

course:
  realization_key: "en.a2"
  target_language_first: true
  dialect: "en_US_neutral"
  register_policy: "Teach clear, neutral American English at a polite register for returning an item and requesting a refund or exchange (I'd like to..., Would you like..., I'm sorry to hear that)."

media_assets:
  - {content_key: "en.a2.audio.shopping_complaint.words.defective.01", language: "en", text: "defective", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.shopping_complaint.question.01", language: "en", text: "I'd like to return this blender. It stopped working after one use.", voice_hint: "neutral_adult", status: "pending_generation"}
  - {content_key: "en.a2.audio.shopping_complaint.description.01", language: "en", text: "Items can be returned within 30 days with a receipt. Defective items can be exchanged or refunded at any time.", voice_hint: "neutral_adult", status: "pending_generation"}
  - content_key: "en.a2.audio.dialogue.shopping_complaint.01"
    language: "en"
    text: "Leila: Hi, I'd like to return this blender. It stopped working after one use. Clerk: I'm sorry to hear that. Do you have your receipt? Leila: Yes, here it is. I bought it last week. Clerk: Thank you. Would you like a refund or an exchange? Leila: I'd like a refund, please. Clerk: No problem. Here's your refund of thirty-five dollars. Leila: Thank you very much."
    voice_hint: "two_adults_neutral_friendly"
    status: "pending_generation"

units:
  - content_key: "en.a2.unit34.shopping_complaint"
    title: "Making a complaint about a purchase"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a2.shopping.make_a_complaint"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a2.unit34.lesson01.complaint_vocabulary"
        title: "Refunds, exchanges, and receipts"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit34.lesson01.teach.refund", kind: "vocabulary", target: {text: "refund", language_code: "en", direction: "ltr"}, introduced_tokens: ["refund"], example: {text: "I'd like a refund for this blender.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit34.lesson01.teach.exchange", kind: "vocabulary", target: {text: "exchange", language_code: "en", direction: "ltr"}, introduced_tokens: ["exchange"], example: {text: "Would you like a refund or an exchange?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit34.lesson01.teach.receipt", kind: "vocabulary", target: {text: "receipt", language_code: "en", direction: "ltr"}, introduced_tokens: ["receipt"], example: {text: "Do you have your receipt?", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit34.lesson01.teach.return_policy", kind: "vocabulary", target: {text: "return policy", language_code: "en", direction: "ltr"}, introduced_tokens: ["return", "policy"], example: {text: "The store's return policy allows 30 days.", language_code: "en", direction: "ltr"}}
          - {content_key: "en.a2.unit34.lesson01.teach.defective", kind: "vocabulary", target: {text: "defective", language_code: "en", direction: "ltr"}, introduced_tokens: ["defective"], example: {text: "The blender was defective, so I returned it.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a2.unit34.lesson01.exercise01.listen_word", type: "listen_select", tested_text: "defective", media_asset_key: "en.a2.audio.shopping_complaint.words.defective.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit34.lesson01.exercise02.choose_money_back_word", type: "multiple_choice", tested_text: "refund", prompt: {target_blocks: [{text: "Which word means getting your money back?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson01.exercise03.choose_proof_of_purchase_word", type: "multiple_choice", tested_text: "receipt", prompt: {target_blocks: [{text: "Which word means the paper that proves you bought something?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson01.exercise04.match_complaint_words", type: "matching_pairs", tested_text: "refund exchange receipt return policy defective", prompt: {target_blocks: [{text: "Match each meaning to the correct English word or phrase.", language_code: "en", direction: "ltr"}]}, pairs: [{left: "refund", right: "getting your money back"}, {left: "exchange", right: "trading an item for a different one"}, {left: "receipt", right: "the paper that proves you bought something"}, {left: "return policy", right: "a store's rules about returning items"}, {left: "defective", right: "broken or not working correctly"}, {left: "problem", right: "what's wrong with an item"}]}
          - {content_key: "en.a2.unit34.lesson01.exercise05.write_exchange", type: "writing_prompt", tested_text: "exchange", prompt: {target_blocks: [{text: "Write the word for trading an item for a different one.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit34.lesson02.making_a_complaint"
        title: "Explaining the problem and requesting a refund"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit34.lesson02.teach.return_blender_stopped_working", kind: "phrase", target: {text: "I'd like to return this blender. It stopped working after one use.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'd", "like", "to", "return", "this", "blender", "It", "stopped", "working", "after", "one", "use"]}
          - {content_key: "en.a2.unit34.lesson02.teach.refund_or_exchange_question", kind: "phrase", target: {text: "Would you like a refund or an exchange?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Would", "you", "like", "a", "refund", "or", "an", "exchange"]}
          - {content_key: "en.a2.unit34.lesson02.teach.id_like_a_refund", kind: "phrase", target: {text: "I'd like a refund, please.", language_code: "en", direction: "ltr"}, introduced_tokens: ["I'd", "like", "a", "refund", "please"]}
        exercises:
          - {content_key: "en.a2.unit34.lesson02.exercise01.listen_return_request", type: "listen_select", tested_text: "I'd like to return this blender", media_asset_key: "en.a2.audio.shopping_complaint.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit34.lesson02.exercise02.choose_polite_return_request", type: "multiple_choice", tested_text: "I'd like to return this blender. It stopped working after one use.", prompt: {target_blocks: [{text: "You want to return a broken item to a store. What do you say?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson02.exercise03.order_refund_or_exchange_question", type: "word_order", tested_text: "Would you like a refund or an exchange", prompt: {target_blocks: []}, word_bank: ["you", "like", "a", "refund", "or", "an", "exchange", "Would"]}
          - {content_key: "en.a2.unit34.lesson02.exercise04.reply_refund_or_exchange", type: "dialogue_response", tested_text: "I'd like a refund, please", prompt: {target_blocks: [{text: "Would you like a refund or an exchange?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson02.exercise05.write_complaint_message", type: "writing_prompt", tested_text: "I'd like to return this blender. It stopped working after one use.", prompt: {target_blocks: [{text: "Write that you'd like to return a blender because it stopped working after one use.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit34.lesson03.reading_a_return_policy"
        title: "Reading a return policy notice"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit34.lesson03.teach.within_30_days", kind: "phrase", target: {text: "Items can be returned within 30 days with a receipt.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Items", "can", "be", "returned", "within", "30", "days", "with", "a", "receipt"]}
          - {content_key: "en.a2.unit34.lesson03.teach.policy_text", kind: "reading", target: {text: "Return Policy: Items can be returned within 30 days with a receipt. Defective items can be exchanged or refunded at any time.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Return", "Policy", "Items", "can", "be", "returned", "within", "30", "days", "with", "a", "receipt", "Defective", "items", "exchanged", "or", "refunded", "at", "any", "time"]}
          - {content_key: "en.a2.unit34.lesson03.teach.i_have_my_receipt", kind: "phrase", target: {text: "I have my receipt from last week.", language_code: "en", direction: "ltr"}, introduced_tokens: ["have", "my", "receipt", "from", "last", "week"]}
        exercises:
          - {content_key: "en.a2.unit34.lesson03.exercise01.read_return_window", type: "reading_comprehension", tested_text: "within 30 days", prompt: {target_blocks: [{text: "How long can you return an item, according to the notice?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson03.exercise02.read_return_requirement", type: "reading_comprehension", tested_text: "a receipt", prompt: {target_blocks: [{text: "What do you need to return an item?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson03.exercise03.choose_defective_item_rule", type: "multiple_choice", tested_text: "exchanged or refunded at any time", prompt: {target_blocks: [{text: "According to the notice, what happens with a defective item?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson03.exercise04.order_items_returned_sentence", type: "word_order", tested_text: "Items can be returned within 30 days", prompt: {target_blocks: []}, word_bank: ["can", "be", "returned", "within", "30", "days", "Items"]}
          - {content_key: "en.a2.unit34.lesson03.exercise05.write_have_receipt", type: "writing_prompt", tested_text: "I have my receipt from last week.", prompt: {target_blocks: [{text: "Write that you have your receipt from last week.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a2.unit34.lesson04.store_dialogue"
        title: "Returning the blender"
        spine_outcome_id: "universal.a2.shopping.make_a_complaint"
        teaching:
          - {content_key: "en.a2.unit34.lesson04.teach.q_return_blender", kind: "dialogue", target: {text: "Hi, I'd like to return this blender. It stopped working after one use.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Hi"]}
          - {content_key: "en.a2.unit34.lesson04.teach.a_sorry_do_you_have_receipt", kind: "dialogue", target: {text: "I'm sorry to hear that. Do you have your receipt?", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["I'm", "sorry", "to", "hear", "that", "Do", "you", "have", "your", "receipt"]}
          - {content_key: "en.a2.unit34.lesson04.teach.q_yes_bought_last_week", kind: "dialogue", target: {text: "Yes, here it is. I bought it last week.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["Yes", "here", "it", "is", "I", "bought", "last", "week"]}
          - {content_key: "en.a2.unit34.lesson04.teach.a_refund_or_exchange", kind: "dialogue", target: {text: "Thank you. Would you like a refund or an exchange?", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["Thank", "you"]}
          - {content_key: "en.a2.unit34.lesson04.teach.q_id_like_a_refund", kind: "dialogue", target: {text: "I'd like a refund, please.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a2.unit34.lesson04.teach.a_refund_thirty_five", kind: "dialogue", target: {text: "No problem. Here's your refund of thirty-five dollars.", language_code: "en", direction: "ltr", speaker: "Clerk"}, introduced_tokens: ["No", "problem", "Here's", "your", "refund", "of", "thirty-five", "dollars"]}
        exercises:
          - {content_key: "en.a2.unit34.lesson04.exercise01.listen_whats_wrong", type: "dialogue_comprehension", tested_text: "It stopped working after one use", media_asset_key: "en.a2.audio.dialogue.shopping_complaint.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit34.lesson04.exercise02.listen_refund_amount", type: "listen_select", tested_text: "thirty-five dollars", media_asset_key: "en.a2.audio.dialogue.shopping_complaint.01", prompt: {target_blocks: []}}
          - {content_key: "en.a2.unit34.lesson04.exercise03.choose_clerk_offer", type: "multiple_choice", tested_text: "a refund or an exchange", prompt: {target_blocks: [{text: "What does the clerk offer Leila?", language_code: "en", direction: "ltr"}]}}
          - {content_key: "en.a2.unit34.lesson04.exercise04.order_do_you_have_receipt_question", type: "word_order", tested_text: "Do you have your receipt", prompt: {target_blocks: []}, word_bank: ["you", "have", "your", "receipt", "Do"]}
          - content_key: "en.a2.unit34.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "Hi, I'd like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I'd like a refund, please."
            prompt: {target_blocks: [{text: "Can I help you?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a2.unit34.lesson04.exercise06.speak_complaint_dialogue"
            type: "speak_response"
            tested_text: "Hi, I'd like to return this blender. It stopped working after one use. Yes, here it is. I bought it last week. I'd like a refund, please."
            prompt: {target_blocks: [{text: "Can I help you?", language_code: "en", direction: "ltr"}]}
