units:
  - content_key: "en.a1.unit10.directions"
    title: "Asking for and following directions"
    section: "reading_writing"
    spine_outcome_ids:
      - "universal.a1.directions.ask_follow_basic_directions"
    planned_lesson_count: 4
    lessons:
      - content_key: "en.a1.unit10.lesson01.basic_direction_words"
        title: "Basic direction words"
        spine_outcome_id: "universal.a1.directions.ask_follow_basic_directions"
        teaching:
          - {content_key: "en.a1.unit10.lesson01.teach.turn_left", kind: "phrase", target: {text: "Turn left.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Turn", "left"]}
          - {content_key: "en.a1.unit10.lesson01.teach.turn_right", kind: "phrase", target: {text: "Turn right.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Turn", "right"]}
          - {content_key: "en.a1.unit10.lesson01.teach.go_straight", kind: "phrase", target: {text: "Go straight.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Go", "straight"]}
          - {content_key: "en.a1.unit10.lesson01.teach.stop_here", kind: "phrase", target: {text: "Stop here.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Stop", "here"]}
          - {content_key: "en.a1.unit10.lesson01.teach.corner", kind: "vocabulary", target: {text: "corner", language_code: "en", direction: "ltr"}, introduced_tokens: ["corner"], example: {text: "Turn left at the corner.", language_code: "en", direction: "ltr"}}
        exercises:
          - {content_key: "en.a1.unit10.lesson01.exercise01.listen_direction", type: "listen_select", tested_text: "Turn left", media_asset_key: "en.a1.audio.directions.basic.turn_left.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit10.lesson01.exercise02.choose_right"
            type: "multiple_choice"
            tested_text: "Turn right."
            prompt: {target_blocks: [{text: "The opposite direction of left is...", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit10.lesson01.exercise03.choose_straight"
            type: "multiple_choice"
            tested_text: "Go straight."
            prompt: {target_blocks: [{text: "Which instruction means keep going without turning?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit10.lesson01.exercise04.match_directions", type: "matching_pairs", tested_text: "left right straight here", prompt: {target_blocks: []}, pairs: [{left: "Turn left.", right: "opposite of right"}, {left: "Turn right.", right: "opposite of left"}, {left: "Go straight.", right: "no left or right"}, {left: "Stop here.", right: "stop at this exact spot"}, {left: "corner", right: "where two streets meet"}, {left: "Is it far?", right: "asking whether the place is a long way away"}, {left: "It's just two minutes from here.", right: "very close, a short walk"}, {left: "You can't miss it.", right: "very easy to find"}]}
          - {content_key: "en.a1.unit10.lesson01.exercise05.write_corner", type: "writing_prompt", tested_text: "corner", prompt: {target_blocks: [{text: "Write the word for where two streets meet.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit10.lesson02.asking_how_to_get"
        title: "Asking how to get somewhere"
        spine_outcome_id: "universal.a1.directions.ask_follow_basic_directions"
        teaching:
          - {content_key: "en.a1.unit10.lesson02.teach.how_do_i_get_to", kind: "phrase", target: {text: "How do I get to the bank?", language_code: "en", direction: "ltr"}, introduced_tokens: ["How", "do", "I", "get", "to", "the", "bank"]}
          - {content_key: "en.a1.unit10.lesson02.teach.go_straight_then_left", kind: "phrase", target: {text: "Go straight, then turn left at the corner.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Go", "straight", "then", "turn", "left", "at", "the", "corner"]}
          - {content_key: "en.a1.unit10.lesson02.teach.is_it_far", kind: "phrase", target: {text: "Is it far?", language_code: "en", direction: "ltr"}, introduced_tokens: ["Is", "it", "far"]}
          - {content_key: "en.a1.unit10.lesson02.teach.two_minutes", kind: "phrase", target: {text: "It's just two minutes from here.", language_code: "en", direction: "ltr"}, introduced_tokens: ["It's", "just", "two", "minutes", "from", "here"]}
          - {content_key: "en.a1.unit10.lesson02.teach.cant_miss_it", kind: "phrase", target: {text: "You can't miss it.", language_code: "en", direction: "ltr"}, introduced_tokens: ["You", "can't", "miss", "it"]}
        exercises:
          - {content_key: "en.a1.unit10.lesson02.exercise01.listen_how_question", type: "listen_select", tested_text: "How do I get to the bank", media_asset_key: "en.a1.audio.directions.question.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit10.lesson02.exercise02.listen_route_answer", type: "listen_select", tested_text: "Go straight, then turn left at the corner", media_asset_key: "en.a1.audio.directions.answer.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit10.lesson02.exercise03.order_how_question", type: "word_order", tested_text: "How do I get to the bank", prompt: {target_blocks: []}, word_bank: ["do", "I", "get", "to", "the", "bank", "How"]}
          - content_key: "en.a1.unit10.lesson02.exercise04.choose_cant_miss_it"
            type: "multiple_choice"
            tested_text: "You can't miss it."
            prompt: {target_blocks: [{text: "The place is very easy to find. What might someone say?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit10.lesson02.exercise05.write_two_minutes", type: "writing_prompt", tested_text: "It's just two minutes from here", prompt: {target_blocks: [{text: "Write that the place is only two minutes away.", language_code: "en", direction: "ltr"}]}}

      - content_key: "en.a1.unit10.lesson03.reading_a_route"
        title: "Reading simple written directions"
        spine_outcome_id: "universal.a1.directions.ask_follow_basic_directions"
        teaching:
          - {content_key: "en.a1.unit10.lesson03.teach.first_street", kind: "phrase", target: {text: "Take the first street on the left.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Take", "the", "first", "street", "on", "the", "left"]}
          - {content_key: "en.a1.unit10.lesson03.teach.second_street", kind: "phrase", target: {text: "Take the second street on the right.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Take", "the", "second", "street", "on", "the", "right"]}
          - {content_key: "en.a1.unit10.lesson03.teach.route_text", kind: "reading", target: {text: "Directions to the pharmacy: Go straight. Take the first street on the left. The pharmacy is on the right.", language_code: "en", direction: "ltr"}, introduced_tokens: ["Directions", "to", "the", "pharmacy", "Go", "straight", "Take", "first", "street", "on", "left", "is", "right"]}
        exercises:
          - content_key: "en.a1.unit10.lesson03.exercise01.read_first_step"
            type: "reading_comprehension"
            tested_text: "Go straight"
            prompt: {target_blocks: [{text: "What is the first step in the directions?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit10.lesson03.exercise02.read_turn_step"
            type: "reading_comprehension"
            tested_text: "Take the first street on the left"
            prompt: {target_blocks: [{text: "Which street do you take?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit10.lesson03.exercise03.choose_pharmacy_side"
            type: "multiple_choice"
            tested_text: "on the right"
            prompt: {target_blocks: [{text: "Which side of the street is the pharmacy on?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit10.lesson03.exercise04.order_second_street", type: "word_order", tested_text: "Take the second street on the right", prompt: {target_blocks: []}, word_bank: ["the", "second", "street", "on", "the", "right", "Take"]}
          - {content_key: "en.a1.unit10.lesson03.exercise05.write_route_step", type: "writing_prompt", tested_text: "Take the first street on the left", prompt: {target_blocks: []}}

      - content_key: "en.a1.unit10.lesson04.giving_directions_dialogue"
        title: "Giving directions to a stranger"
        spine_outcome_id: "universal.a1.directions.ask_follow_basic_directions"
        teaching:
          - {content_key: "en.a1.unit10.lesson04.teach.q_bank", kind: "dialogue", target: {text: "Excuse me, how do I get to the bank?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["Excuse", "me"]}
          - {content_key: "en.a1.unit10.lesson04.teach.a_route", kind: "dialogue", target: {text: "Go straight, then turn left at the corner.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: []}
          - {content_key: "en.a1.unit10.lesson04.teach.confirm_route", kind: "dialogue", target: {text: "Turn left at the corner, OK. Is it far?", language_code: "en", direction: "ltr", speaker: "Daniel"}, introduced_tokens: ["OK"]}
          - {content_key: "en.a1.unit10.lesson04.teach.a_close_cant_miss", kind: "dialogue", target: {text: "No, it's just two minutes from here. You can't miss it.", language_code: "en", direction: "ltr", speaker: "Leila"}, introduced_tokens: ["No"]}
        exercises:
          - {content_key: "en.a1.unit10.lesson04.exercise01.listen_route_given", type: "dialogue_comprehension", tested_text: "Go straight, then turn left at the corner", media_asset_key: "en.a1.audio.dialogue.giving_directions.01", prompt: {target_blocks: []}}
          - {content_key: "en.a1.unit10.lesson04.exercise02.listen_close_by", type: "listen_select", tested_text: "It's just two minutes from here", media_asset_key: "en.a1.audio.dialogue.giving_directions.01", prompt: {target_blocks: []}}
          - content_key: "en.a1.unit10.lesson04.exercise03.choose_confirm"
            type: "multiple_choice"
            tested_text: "Turn left at the corner, OK."
            prompt: {target_blocks: [{text: "Daniel repeats the direction back to make sure he understood. What does he say?", language_code: "en", direction: "ltr"}]}
          - {content_key: "en.a1.unit10.lesson04.exercise04.order_q_bank", type: "word_order", tested_text: "how do I get to the bank", prompt: {target_blocks: []}, word_bank: ["do", "I", "get", "to", "the", "bank", "how"]}
          - content_key: "en.a1.unit10.lesson04.exercise05.reply_as_leila"
            type: "dialogue_response"
            tested_text: "Go straight then turn left at the corner No it's just two minutes from here You can't miss it"
            prompt: {target_blocks: [{text: "Excuse me, how do I get to the bank? Is it far?", language_code: "en", direction: "ltr"}]}
          - content_key: "en.a1.unit10.lesson04.exercise06.speak_directions"
            type: "speak_response"
            tested_text: "Go straight then turn left at the corner No it's just two minutes from here You can't miss it"
            prompt: {target_blocks: [{text: "Excuse me, how do I get to the bank? Is it far?", language_code: "en", direction: "ltr"}]}
