        new, in the formal vous register the source dialogue never uses,
        with modern account-opening vocabulary (une carte bancaire, un
        justificatif de domicile, un justificatif de revenus, un découvert
        autorisé) that has no equivalent in the 1960s source at all. No FSI
        sentence or dialogue line is reused verbatim.
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    First-ever French A2 unit. Continues the Ines/Mathieu storyline: Ines
    has moved to Lyon to start a salaried patisserie apprenticeship and
    needs her first real checking account so her employer can pay her.
    Deliberately written a full register step up from the A1 tu-register
    workshop scenes: the entire unit uses formal vous with a bank advisor
    (Camille), with genuine A2 grammar load -- conditional politeness
    (je voudrais / j'aimerais / pourriez-vous) and subjunctive after
    il faudrait que / avant que / pour que, not just harder vocabulary on
    an A1 sentence shape. Every kind:vocabulary card carries a real example
    sentence per schema_version 1.1. Covers all four spine modalities:
    listening (dialogue_comprehension extracting the requested documents),
    speaking (speak_response requesting the account), reading
    (reading_comprehension on a short account-features notice), writing
    (writing_prompt: a short formal information request). Not yet
    fresh-context reviewed. Authored independently of the other five
    parallel A2 units (bureaucracy/opinions/health/housing/employment) --
    no sibling file was consulted for scenario or phrasing, only the
    a1_unit14 realization/overlay pair (per this task's own instructions)
    and the compiler/frontend source for exercise-type prompt shapes.

