    language: fr
    text: "Inès : Bonjour Madame, j'aimerais ouvrir un compte courant, s'il vous plaît.\nCamille : Bonjour Mademoiselle. Bien sûr, est-ce votre premier compte dans notre banque ?\nInès : Oui, je viens de commencer un apprentissage de pâtissière ici à Lyon, et mon employeur a besoin de faire un virement pour mon salaire.\nCamille : Félicitations pour votre apprentissage. Il faudrait que vous ameniez une pièce d'identité, un justificatif de domicile et votre contrat de travail.\nInès : J'ai ma carte d'identité et mon contrat avec moi. Pourriez-vous m'expliquer si les frais de tenue de compte sont élevés ?\nCamille : Non, ils restent raisonnables, et la carte bancaire est gratuite la première année. Vous aurez aussi un découvert autorisé de deux cents euros.\nInès : Parfait. Combien de temps faut-il pour que le compte soit actif ?\nCamille : Le compte sera actif avant que vous ne receviez votre carte, donc dans deux ou trois jours."
    voice_hint: two_adults_formal_professional
    status: pending_generation

