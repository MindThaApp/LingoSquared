  notes: 'Drafted by Claude Sonnet. Grammar target: si + présent with a result in the présent, the futur simple or the impératif, elision s''il (but si elle, si on), real conditions only (no si + imparfait). Canon reused: Camille and Mathieu are friends using tu; Camille plans a picnic in the park (NEW scenario). Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) ''Si le temps est mauvais, on reste chez moi'' is natural but ''S''il pleut'' is more common; confirm; (2) ''on vous rembourse'' for a shop policy at A2; (3) ''Appelle-moi'' imperative with a pronoun is taught only as a chunk.'
