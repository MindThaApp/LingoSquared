  text: 'Camille: Mathieu, tu viens samedi ? Mathieu: Oui, si je suis libre. Qu''est-ce qu''on fait ? Camille: S''il fait beau, nous faisons un pique-nique au parc. Mathieu: Et s''il pleut ? Camille: S''il pleut, on reste chez moi. Si tu viens, je prépare un gâteau. Mathieu: Super ! Si j''ai le temps, j''apporte du pain.'
