- content_key: fr.a2.audio.dialogue.parce_que_donc.01
  language: fr
  text: 'Camille: Mathieu, pourquoi tu n''es pas à la fête ? Mathieu: Je suis malade, donc je reste à la maison. Camille: Ah non ! Pourquoi tu es malade ? Mathieu: Parce que j''ai attendu le bus sous la pluie. Camille: Pauvre Mathieu ! Je viens demain avec une soupe, car tu es seul. Mathieu: Merci Camille ! Je suis content parce que tu viens.'
  voice_hint: two_young_adults_casual
  status: pending_generation
