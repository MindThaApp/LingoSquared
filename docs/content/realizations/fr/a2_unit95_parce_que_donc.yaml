  notes: 'Drafted by Claude Sonnet. Grammar target: pourquoi / parce que (with elision parce qu''il, parce qu''elle), car, donc and alors for the consequence, and cause-first versus result-first order. Present tense, with a few passé composé forms already taught in Block A. Canon reused: Camille and Mathieu are friends using tu; Mathieu is ill after waiting for the bus in the rain (NEW fact, check against canon). Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) ''donc'' after a comma versus ''alors'' at A2 register; (2) ''Pauvre Mathieu !'' naturalness; (3) ''car'' taught as a recognised written variant only.'
