    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: fr.b2.unit08.audio.synthese.comparaison_prix.01
    language: fr
    text: "Le premier avis est positif sur le prix, tandis que le deuxième est négatif."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: fr.b2.unit08.audio.synthese.accord_croissants.01
    language: fr
    text: "Les deux avis sont d'accord sur les croissants."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: fr.b2.unit08.audio.synthese.conflit_prix.01
    language: fr
    text: "Le deuxième avis affirme qu'un croissant coûte trois euros cinquante."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: fr.b2.unit08.audio.synthese.dialogue.avis.01
    language: fr
    text: >-
      Mathieu : Alors, les deux avis sont d'accord ? Inès : Sur les
      croissants, oui : les deux avis disent qu'ils sont délicieux.
      Mathieu : Et sur le prix ? Inès : Là, ils ne sont pas d'accord. Le
      premier dit que c'est raisonnable ; le deuxième affirme que c'est
      trop cher. Mathieu : Qui a raison, à ton avis ? Inès : Le deuxième
      avis, je pense. Il est plus précis : il donne un prix exact, trois
      euros cinquante. Le premier ne donne pas de détail. Donc, le
      deuxième avis est le plus convaincant.
    voice_hint: young_man_and_young_woman
    status: pending_generation

units:
  - content_key: fr.b2.unit08.synthese
    title: "Synthèse"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    planned_lesson_count: 6

    lessons:
      - content_key: fr.b2.unit08.lesson01.qui_dit_quoi
        title: "Qui dit quoi ?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: fr.b2.unit08.lesson01.teach.deux_avis
            kind: phrase
            target: {text: "Il y a deux avis en ligne sur la boutique.", language_code: fr, direction: ltr}
            introduced_tokens: [Il, y, a, deux, avis, en, ligne, sur]
          - content_key: fr.b2.unit08.lesson01.teach.premier_deuxieme
            kind: vocabulary
            target: {text: "le premier avis / le deuxième avis", language_code: fr, direction: ltr}
            introduced_tokens: [premier, deuxième]
            example:
              - {text: "Le premier avis parle des croissants.", language_code: fr, direction: ltr}
              - {text: "Le deuxième avis parle du prix.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson01.teach.le_prix
            kind: vocabulary
            target: {text: "le prix", language_code: fr, direction: ltr}
            introduced_tokens: [le, prix]
            example: {text: "Le prix d'un croissant est important.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson01.teach.delicieux
            kind: vocabulary
            target: {text: "délicieux", language_code: fr, direction: ltr}
            introduced_tokens: [délicieux]
            example: {text: "Les croissants sont délicieux.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson01.teach.raisonnable
            kind: vocabulary
            target: {text: "raisonnable", language_code: fr, direction: ltr}
            introduced_tokens: [raisonnable, raisonnables]
            example: {text: "Le prix est raisonnable.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson01.teach.cher
            kind: vocabulary
            target: {text: "cher", language_code: fr, direction: ltr}
            introduced_tokens: [cher, chers]
            example: {text: "Les prix sont trop chers.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson01.teach.dire
            kind: vocabulary
            target: {text: "dire (dit)", language_code: fr, direction: ltr}
            introduced_tokens: [dit, que, dire]
            example: {text: "Le premier avis dit que les croissants sont délicieux.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson01.teach.affirmer
            kind: vocabulary
            target: {text: "affirmer (affirme)", language_code: fr, direction: ltr}
            introduced_tokens: [affirme, affirmer]
            example: {text: "Le deuxième avis affirme que les prix sont trop chers.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Le premier avis dit que les croissants sont délicieux. Le deuxième avis affirme que les prix sont trop chers.", language_code: fr, direction: ltr}
            introduced_tokens: []
          - content_key: fr.b2.unit08.lesson01.teach.grammar_attribuer
            kind: grammar_note
            target: {text: "Selon, dire que et affirmer que permettent d'attribuer une affirmation à sa source, sans l'assumer soi-même. C'est le premier geste de la synthèse : rapporter qui dit quoi.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit08.lesson01.exercise01.recognize_avis
            type: multiple_choice
            tested_text: avis
            prompt: {target_blocks: [{text: avis, language_code: fr, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson01.exercise02.listen_premier_avis
            type: listen_select
            tested_text: "Le premier avis dit que les croissants sont délicieux"
            media_asset_key: fr.b2.unit08.audio.synthese.premier_avis.01
            prompt: {target_blocks: []}
          - content_key: fr.b2.unit08.lesson01.exercise03.match_attribution_words
            type: matching_pairs
            tested_text: "avis en ligne prix raisonnable cher délicieux dit que affirme que"
            prompt: {target_blocks: []}
            pairs:
              - {left: avis, right: review}
              - {left: "en ligne", right: online}
              - {left: prix, right: price}
              - {left: raisonnable, right: reasonable}
              - {left: cher, right: expensive}
              - {left: délicieux, right: delicious}
              - {left: "dit que", right: "says that"}
              - {left: "affirme que", right: "claims that"}
          - content_key: fr.b2.unit08.lesson01.exercise04.order_premier_avis
            type: word_order
            tested_text: "Le premier avis dit que les croissants sont délicieux"
            prompt: {target_blocks: []}
            word_bank: [Le, premier, avis, dit, que, les, croissants, sont, délicieux]
          - content_key: fr.b2.unit08.lesson01.exercise05.translate_affirme
            type: translation
            tested_text: "Le deuxième avis affirme que les prix sont trop chers"
            prompt: {target_blocks: [{text: "Translate into French, using affirmer: The second review claims that the prices are too expensive.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson01.exercise06.speak_premier_avis
            type: speak_response
            tested_text: "Le premier avis dit que les croissants sont délicieux"
            prompt: {target_blocks: [{text: "Say aloud in French: The first review says that the croissants are delicious.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson01.exercise07.write_prix_raisonnables
            type: writing_prompt
            tested_text: "Les prix sont raisonnables"
            prompt: {target_blocks: [{text: "Write in French: The prices are reasonable.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson01.exercise08.dictation_premier_avis
            type: dictation
            tested_text: "Le premier avis dit que les croissants sont délicieux"
            media_asset_key: fr.b2.unit08.audio.synthese.premier_avis.01
            prompt: {target_blocks: []}

      - content_key: fr.b2.unit08.lesson02.comparer_les_avis
        title: "Comparer les deux avis"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: fr.b2.unit08.lesson02.teach.compare_a
            kind: vocabulary
            target: {text: "comparé à", language_code: fr, direction: ltr}
            introduced_tokens: [comparé]
            example: {text: "Comparé au premier avis, le deuxième est différent.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson02.teach.contrairement_a
            kind: vocabulary
            target: {text: "contrairement à", language_code: fr, direction: ltr}
            introduced_tokens: [contrairement]
            example: {text: "Contrairement au premier avis, le deuxième donne un prix exact.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson02.teach.aimer
            kind: vocabulary
            target: {text: "vanter (vantent)", language_code: fr, direction: ltr}
            introduced_tokens: [vantent, vanter]
            example: {text: "Les deux avis vantent les croissants.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson02.teach.meme_facon
            kind: vocabulary
            target: {text: "de la même façon", language_code: fr, direction: ltr}
            introduced_tokens: [même, façon]
            example: {text: "De la même façon, les deux avis vantent les croissants.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson02.teach.tandis_que
            kind: vocabulary
            target: {text: "tandis que", language_code: fr, direction: ltr}
            introduced_tokens: [tandis]
            example: {text: "Le premier avis est positif, tandis que le deuxième est négatif.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson02.teach.positif
            kind: vocabulary
            target: {text: "positif", language_code: fr, direction: ltr}
            introduced_tokens: [positif]
            example: {text: "Le premier avis est positif sur le prix.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson02.teach.negatif
            kind: vocabulary
            target: {text: "négatif", language_code: fr, direction: ltr}
            introduced_tokens: [négatif]
            example: {text: "Le deuxième avis est négatif sur le prix.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson02.teach.claim_model
            kind: phrase
            target: {text: "Le premier avis est positif sur le prix, tandis que le deuxième est négatif.", language_code: fr, direction: ltr}
            introduced_tokens: []
          - content_key: fr.b2.unit08.lesson02.teach.grammar_comparer
            kind: grammar_note
            target: {text: "Comparé à et contrairement à mettent deux avis en regard. Tandis que marque une opposition simultanée : son verbe reste à sa place normale, mais l'idée est celle du contraste.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit08.lesson02.exercise01.recognize_tandis_que
            type: multiple_choice
            tested_text: "tandis que"
            prompt: {target_blocks: [{text: "tandis que", language_code: fr, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson02.exercise02.listen_comparaison_prix
            type: listen_select
            tested_text: "Le premier avis est positif sur le prix, tandis que le deuxième est négatif"
            media_asset_key: fr.b2.unit08.audio.synthese.comparaison_prix.01
            prompt: {target_blocks: []}
          - content_key: fr.b2.unit08.lesson02.exercise03.match_comparison_words
            type: matching_pairs
            tested_text: "comparé à contrairement à de la même façon tandis que positif négatif vanter"
            prompt: {target_blocks: []}
            pairs:
              - {left: "comparé à", right: "compared to"}
              - {left: "contrairement à", right: "contrary to / unlike"}
              - {left: "de la même façon", right: "in the same way"}
              - {left: "tandis que", right: whereas}
              - {left: positif, right: positive}
              - {left: négatif, right: negative}
              - {left: vanter, right: "to praise"}
          - content_key: fr.b2.unit08.lesson02.exercise04.order_meme_facon
            type: word_order
            tested_text: "De la même façon les deux avis vantent les croissants"
            prompt: {target_blocks: []}
            word_bank: [De, la, même, façon, les, deux, avis, vantent, les, croissants]
          - content_key: fr.b2.unit08.lesson02.exercise05.translate_meme_facon
            type: translation
            tested_text: "De la même façon, les deux avis vantent les croissants"
            prompt: {target_blocks: [{text: "Translate into French, using de la même façon: In the same way, the two reviews praise the croissants.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson02.exercise06.translate_tandis_que
            type: translation
            tested_text: "Le premier avis est positif sur le prix, tandis que le deuxième est négatif"
            prompt: {target_blocks: [{text: "Translate into French, using tandis que: The first review is positive about the price, whereas the second is negative.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson02.exercise07.write_contrairement_a
            type: writing_prompt
            tested_text: "Contrairement au premier avis, le deuxième est négatif sur le prix"
            prompt: {target_blocks: [{text: "Write in French, using contrairement à: Contrary to the first review, the second is negative about the price.", language_code: en, direction: ltr}]}

      - content_key: fr.b2.unit08.lesson03.ou_sont_ils_daccord
        title: "Où sont-ils d'accord ?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: fr.b2.unit08.lesson03.teach.etre_daccord_sur
            kind: phrase
            target: {text: "être d'accord sur", language_code: fr, direction: ltr}
            introduced_tokens: [accord]
            example: {text: "Les deux avis sont d'accord sur les croissants.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit08.lesson03.teach.souligner
            kind: vocabulary
            target: {text: "souligner (soulignent)", language_code: fr, direction: ltr}
            introduced_tokens: [souligne, soulignent, souligner]
