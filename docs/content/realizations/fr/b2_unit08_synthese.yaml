          - content_key: fr.b2.unit08.lesson03.teach.claim_model
            kind: phrase
            target: {text: "Les deux avis sont d'accord sur les croissants : ils soulignent qu'ils sont délicieux.", language_code: fr, direction: ltr}
            introduced_tokens: []
          - content_key: fr.b2.unit08.lesson03.teach.grammar_accord
            kind: grammar_note
            target: {text: "être d'accord sur X et souligner que... nomment un point d'accord entre deux sources : le deuxième geste de la synthèse.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit08.lesson03.exercise01.recognize_daccord
            type: multiple_choice
            tested_text: "d'accord"
            prompt: {target_blocks: [{text: "d'accord", language_code: fr, direction: ltr}]}
          - content_key: fr.b2.unit08.lesson03.exercise02.listen_accord_croissants
            type: listen_select
            tested_text: "Les deux avis sont d'accord sur les croissants"
            media_asset_key: fr.b2.unit08.audio.synthese.accord_croissants.01
            prompt: {target_blocks: []}
          - content_key: fr.b2.unit08.lesson03.exercise03.match_agreement_words
            type: matching_pairs
            tested_text: "être d'accord sur souligner le point sur ce point les deux avis ils"
            prompt: {target_blocks: []}
            pairs:
              - {left: "être d'accord sur", right: "to agree on"}
              - {left: souligner, right: "to underline / emphasize"}
              - {left: "le point", right: "the point"}
              - {left: "sur ce point", right: "on this point"}
              - {left: "les deux avis", right: "the two reviews"}
              - {left: ils, right: they}
          - content_key: fr.b2.unit08.lesson03.exercise04.order_accord_croissants
            type: word_order
