generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is fr's B2
    synthesis unit and the LAST unit of the fr B2 tier (units01-08 complete
    the course once this ships). No adaptable upper-intermediate
    public-domain French source exists for this outcome, so this was built
    from general French grammar/discourse knowledge, following the shipped
    nl B2 synthesis unit (b2_unit08_synthese) as the STRUCTURAL exemplar
    only -- its lesson arc, its exercise-type pacing, and its "two written
    reviews that agree on one point and conflict on another, with one
    better supported" scenario shape. No French text was calqued from the
    Dutch file; every French sentence in this unit was authored fresh from
    first principles, per explicit coordinator instruction. This is one of
    four parallel dispatches (fr b2 units05/06/07 by other agents); no
    sibling unit's output was seen or referenced. Sibling-isolation
    otherwise honored: no en-fr overlay for another unit was consulted
    beyond units01-04 for character-canon/vocabulary-accumulation purposes,
    no fr-en direction was opened. Established fr B2 character canon
    (Inès/Mathieu, tu register, pâtisserie setting in Lyon, apprentice
    under Monsieur Lefebvre) and this course's own units01-04 were
    consulted for vocabulary accumulation and canon consistency.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) that the attributing toolkit (selon, dire que,
    affirmer que) reads as natural, idiomatic French register for reporting
    a written review, not stilted; (2) that "tandis que" is used correctly
    as the contrastive (not purely temporal) conjunction in lesson02, and
    that its subordinate clause is grammatical; (3) that "être d'accord
    sur" / "ne pas être d'accord sur" / "par contre" / "en revanche" are
    natural collocations for naming agreement/conflict between two written
    sources, not calques; (4) confirm the deduction the unit rests on --
    that the second review is more convincing BECAUSE it gives a concrete
    price (trois euros cinquante) while the first only asserts "raisonnable"
    with no figure -- is a fair, single-answer reading of the two reviews;
    (5) the culminating lesson06 writing/speaking exercises are graded
    against a fixed three-part string -- only trailing-period variants are
    supplied, so decide whether more punctuation variants are needed; (6)
    confirm the pâtisserie-reviews scenario does not contradict any pinned
    Inès/Mathieu B1/B2 fact.
  notes: >-
    Eighth and final French B2 unit. Targets the CEFR B2 synthesis outcome
    (universal.b2.synthesis.summarize_and_evaluate_multiple_sources):
    combine information from more than one source into a coherent summary,
    note where the sources agree or conflict, and give a reasoned judgement
    about them. Theme: one coherent scenario across all six lessons -- two
    anonymous online customer reviews ("le premier avis" / "le deuxième
    avis") of Inès's pâtisserie (referred to as "la boutique", consistent
    with unit04's established term for the same shop) that AGREE the
    croissants are delicious but CONFLICT on the price (the first review
    calls the prices "raisonnables" with no supporting detail; the second
    calls them "trop chers" and backs this with a concrete price -- a
    croissant costs three euros fifty -- making the second review better
    supported). Lesson arc: L01 attributing a claim to a source (selon /
    dire que / affirmer que); L02 comparing two sources side by side
    (comparé à / contrairement à / de la même façon / tandis que /
    positif / négatif); L03 naming AGREEMENT (être d'accord sur / souligner
    que / sur ce point); L04 naming CONFLICT (ne pas être d'accord sur /
    en revanche / par contre), culminating in the concrete price detail;
    L05 a reading of both full review texts side by side -- identify the
    agreement, the conflict, and which review gives a concrete reason; L06
    the culminating production -- an Inès/Mathieu dialogue discussing the
    two reviews (delivers the listening requirement: agreement, conflict,
    which is better supported), a speaking synthesis, and a writing
    synthesis that names all three required parts (agreement + conflict +
    reasoned judgement). Register: the two reviews are neutral,
    third-person, unaddressed customer text (no register marker needed,
    consistent throughout); Inès and Mathieu discuss them using their
    established informal tu register. Cumulative with fr b2 units01-04
    within the same fr.b2 course (vocabulary accumulates across this
    course's own units per the compiler's multi-file validation order).
    No sibling-direction file and no sibling-unit (05/06/07) file was
    consulted.


    Fresh-context review 2026-10-17 (content-reviewer.md checklist): checked with the en-fr b2_unit08 overlay -- French correctness/naturalness, CEFR fit, answer keys, distractors, dialogue cards vs audio (all 6 turns match, speakers correct), canon (Inès is an employee at Lefebvre's shop, tu with Mathieu), course-scoped vocabulary, YAML booleans, jargon. Fixes here: lesson05 exercise01-04 read_* prompt.target_blocks showed only the English question and never the two reviews -> target_blocks now carry both review texts; lesson04.exercise03 pair en revanche right 'however / by contrast' vs par contre 'however / on the other hand' were interchangeable synonyms -> both now share the right 'however / on the other hand' (many-lefts-to-one-right); lesson04.exercise07 prompt pinned to spelling the price in words (numerals 3,50 € would fail); lesson06.exercise05/06 prompts said 'the second says' and 'The most convincing is the second review' while the key needs affirme and 'Le deuxième avis est le plus convaincant' -> prompts now give the exact English sentences and name affirmer. NATIVE FLAGS: (1) 'les deux avis aiment les croissants' personifies the reviews -- a native may prefer apprécient or a rewording; (2) grammar_comparer's 'son verbe reste à sa place normale' is an odd remark for tandis que. DEFERRED: none.

    Language review 2026-10-24 (session 10): 0 French fixes in the realization
    (attribution verbs, tandis que, être d'accord sur, par contre/en revanche
    and the dialogue re-read and correct); 1 paired-overlay fix --
    lesson06.exercise05/06 (fixed three-part synthesis) now also accept colons
    without the French space and the semicolon between the two reviews' claims.
    Answers to the native-check questions: (1) selon / dire que / affirmer que
    are natural for reporting a written review. (2) tandis que is correctly
    contrastive, with the indicative ("tandis que le deuxième est négatif"). (3)
    être d'accord sur, ne pas être d'accord sur, par contre (more informal) and
    en revanche are natural collocations. (4) Reading the second review as
    better supported because it gives a figure is fair and single-answer; note
    that "Qui a raison ?" is answered with "le plus convaincant", which is about
    support, not truth, and the text says so. (5) Punctuation variants for the
    fixed three-part string are now complete enough (period/no period,
    spaced/unspaced colon, comma or semicolon); grading tolerates boundary
    punctuation. (6) The scenario does not contradict Inès/Mathieu canon
    (reviews of the shop where Inès works). Native flags: "Les deux avis aiment
    les croissants" (teach.aimer, lesson02.exercise03/04/05) personifies the
    reviews oddly; "Les deux avis sont positifs sur les croissants" or
    "apprécient" would be smoother, but the verb is taught and tested in several
    items, so left as an owner question.

    Owner decisions 2026-10-24 (PR #88 follow-up): 'Les deux avis aiment les croissants' is now 'Les
    deux avis vantent les croissants' (a review praises; it does not like). teach.aimer now teaches
    vanter (vantent); lesson02 exercises 03/04/05 are updated ('louent' also accepted in exercise05);
    keys unchanged.
course:
  realization_key: fr.b2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Informal tu throughout for Inès and Mathieu, consistent with fr b2
    units01-04 and the established fr lane register. The two customer
    reviews themselves are neutral third-person text (unaddressed,
    anonymous), a distinct but consistent register choice for this unit
    only.

