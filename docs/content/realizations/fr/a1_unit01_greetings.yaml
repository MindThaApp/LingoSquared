    2026-07-10 fresh-context review (Claude), part of the standing "es/fr:
    finish in-flight units, then park until nl is done" scope -- reviewed
    all 3 existing fr units cold. This unit itself had no new bugs beyond
    what its overlay's own already-reviewed pass had found: no
    same-speaker listen_select/dialogue_comprehension distractor
    collisions in the workshop dialogue (its dialogue_comprehension
    exercises test facts via English answer options, not literal
    same-speaker quote picks, so the nl units44-50 bug class doesn't
    apply), no stray YAML boolean coercion, matching_pairs/word_order
    answer shapes are correct, every exercise type used is registered in
    ExerciseRenderer.tsx, no internal jargon leaks, and the recognition ->
    drag -> production pacing holds in every lesson (verified
    programmatically). The lesson01/lesson03 grammar_check exercises that
    present a blanked prompt ("Comment allez-___ ?") rather than a wrong
    full sentence are an established corpus convention (the same pattern
    is already used in ro's shipped units), not a new deviation, so left
    as-is. Compiler validates 0 errors (only the expected schema_version
    1.0 "no example sentence" warnings). Initial six-lesson French draft,
    audio remains pending generation.

course:
  realization_key: fr.a1
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Teach contemporary standard Metropolitan French. Present vous as the safe
    default with unfamiliar adults and tu for friends, children, and explicitly
    informal settings. Teach neutral everyday pronunciation without highly
    marked regional or youth slang.

