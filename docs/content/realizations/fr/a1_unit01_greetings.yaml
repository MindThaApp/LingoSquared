            introduced_tokens: [comment, vas-tu]
          - content_key: fr.a1.unit01.lesson01.teach.register_choice
            kind: cultural_note
            target: {text: "Bonjour + vous / Salut + tu", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.a1.unit01.lesson01.exercise01.listen_bonjour
            type: listen_select
            tested_text: "bonjour"
            media_asset_key: fr.a1.audio.bonjour.neutral.01
            prompt: {target_blocks: []}
