units:
  - content_key: fr.b1.unit43.descriptions
    title: "Décrire avec des pronoms relatifs"
    section: speaking
    spine_outcome_ids:
      - universal.b1.narrative.combine_descriptions_with_relative_clauses
    planned_lesson_count: 2

    lessons:
      - content_key: fr.b1.unit43.lesson01.qui_que
        title: "Qui et que : sujet et objet"
        spine_outcome_id: universal.b1.narrative.combine_descriptions_with_relative_clauses
        teaching:
          - content_key: fr.b1.unit43.lesson01.teach.qui_lefebvre
            kind: vocabulary
            target: {text: "monsieur lefebvre, qui m'a appris cette recette, est très patient", language_code: fr, direction: ltr}
            introduced_tokens: ["Monsieur", "Lefebvre", "qui", "m'a", "appris", "cette", "recette", "est", "très", "patient"]
            example: {text: "Monsieur Lefebvre, qui m'a appris cette recette, est très patient avec les débutants.", language_code: fr, direction: ltr}
          - content_key: fr.b1.unit43.lesson01.teach.que_recette
            kind: vocabulary
            target: {text: "la recette que j'ai apprise est difficile", language_code: fr, direction: ltr}
            introduced_tokens: ["la", "recette", "que", "j'ai", "apprise", "est", "difficile"]
            example: {text: "La recette que j'ai apprise est difficile, mais je progresse.", language_code: fr, direction: ltr}
          - content_key: fr.b1.unit43.lesson01.teach.pattern
            kind: grammar_note
            target: {text: "qui remplace le sujet ; que remplace l'objet direct (accord du participe passé)", language_code: fr, direction: ltr}
            introduced_tokens: ["sujet", "objet", "direct", "accord", "participe", "passé"]
        exercises:
          - content_key: fr.b1.unit43.lesson01.exercise01.select_qui
            type: multiple_choice
            tested_text: "Monsieur Lefebvre qui m'a appris cette recette est très patient"
            prompt:
              target_blocks:
                - {text: "Dans cette phrase, que remplace \"qui\" ?", language_code: fr, direction: ltr}
          - content_key: fr.b1.unit43.lesson01.exercise02.listen_qui
            type: listen_select
            tested_text: "Monsieur Lefebvre, qui m'a appris cette recette, est très patient."
            media_asset_key: fr.b1.unit43.audio.recette_apprise.neutral.01
            prompt: {target_blocks: []}
          - content_key: fr.b1.unit43.lesson01.exercise03.match_qui_que_phrases
            type: matching_pairs
            tested_text: "qui m'a appris cette recette la recette que j'ai apprise est difficile"
            prompt: {target_blocks: []}
            pairs:
              - {left: "qui m'a appris cette recette", right: "who taught me this recipe"}
              - {left: "la recette que j'ai apprise", right: "the recipe that I learned"}
              - {left: "est très patient", right: "is very patient"}
              - {left: "est difficile", right: "is difficult"}
              - {left: "cette recette", right: "this recipe"}
              - {left: "j'ai apprise", right: "I learned"}
          - content_key: fr.b1.unit43.lesson01.exercise04.order_que
            type: word_order
            tested_text: "La recette que j'ai apprise est difficile"
            prompt: {target_blocks: []}
            word_bank: ["La", "recette", "que", "j'ai", "apprise", "est", "difficile"]
          - content_key: fr.b1.unit43.lesson01.exercise05.write_que
            type: writing_prompt
            tested_text: "La recette que j'ai apprise est difficile"
            prompt:
              target_blocks:
                - {text: "Écris exactement cette phrase avec \"que\" comme objet direct, accordé au féminin avec \"recette\" : La recette que j'ai apprise est difficile.", language_code: fr, direction: ltr}

      - content_key: fr.b1.unit43.lesson02.dont
