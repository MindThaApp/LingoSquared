              - {left: "pour la réussir", right: "to get it right"}
              - {left: "il ne parle jamais", right: "he never talks"}
              - {left: "quelle recette exactement", right: "which recipe exactly"}
          - content_key: fr.b1.unit43.lesson02.exercise04.order_dont
