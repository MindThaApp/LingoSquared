    text: "Mathieu : Monsieur Lefebvre a l'air sévère, non ?\nInès : Non, pas du tout. Monsieur Lefebvre, qui m'a appris cette recette, est très patient.\nMathieu : Il t'a appris quelle recette exactement ?\nInès : La recette que j'ai apprise est difficile, c'est celle de la tarte au citron.\nMathieu : Il a un secret pour la réussir ?\nInès : Oui, c'est un secret dont il ne parle jamais.\nMathieu : Même pas à toi ?\nInès : Même pas à moi !"
    voice_hint: young_woman_and_young_man
