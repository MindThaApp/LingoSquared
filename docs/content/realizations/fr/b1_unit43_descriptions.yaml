            tested_text: "Monsieur Lefebvre a un secret Il ne parle jamais de ce secret C'est un secret dont il ne parle jamais"
            prompt:
              target_blocks:
                - {text: "Monsieur Lefebvre a un secret. Il ne parle jamais de ce secret. Combine ces deux faits en une seule phrase avec le pronom relatif \"dont\" : C'est un secret dont il ne parle jamais.", language_code: fr, direction: ltr}
