review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    B1 relative-clause unit -- COMPLETES the fr B1 tier (19th outcome).
    Inès and Mathieu (tu register) describe Monsieur Lefebvre and a
    recipe. Lesson 1 teaches "qui" (subject relative) contrasted with
    "que" (object relative, requiring past-participle agreement: "la
    recette que j'ai apprise", feminine because "recette" is feminine).
    Lesson 2 teaches "dont" (relative pronoun replacing a de-complement)
    plus the full dialogue. The culminating exercise requires combining
    two facts about "un secret" into one sentence with "dont" -- the
    preposition-combining case -- while lesson 1's "que" sentence already
    delivers the gender-agreement case, together covering
    universal.b1.narrative.combine_descriptions_with_relative_clauses's
    "agree in gender/number or must combine with a preposition" clause
    read literally. Canon check: Inès remains a pâtisserie apprentice in
    Lyon under Monsieur Lefebvre; Mathieu remains her peer, tu register
    throughout (matches units 25/28/29/34/37/38/39/40/41). Monsieur
    Lefebvre is discussed only in the THIRD person by Inès and Mathieu
    between themselves -- he is never present as an interlocutor in this
    dialogue, so no person-deixis risk.

