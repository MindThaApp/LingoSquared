            introduced_tokens: ["c'est", "un", "secret", "dont", "il", "ne", "parle", "jamais"]
            example: {text: "C'est un secret dont il ne parle jamais, même avec ses apprentis.", language_code: fr, direction: ltr}
          - content_key: fr.b1.unit43.lesson02.teach.pattern
            kind: grammar_note
            target: {text: "dont remplace un complément introduit par de", language_code: fr, direction: ltr}
