- content_key: fr.a2.audio.dialogue.comme_avant.01
  language: fr
  text: 'Mathieu: Camille, tu habitais où quand tu étais petite ? Camille: J''habitais à la campagne, dans une grande maison avec un jardin. Mathieu: Qu''est-ce que tu faisais le week-end ? Camille: Nous allions chez mes grands-parents. Je jouais dehors avec mon frère. Mathieu: Et maintenant ? Camille: Maintenant, j''habite en ville, et je ne joue plus dehors !'
  voice_hint: two_young_adults_casual
  status: pending_generation
