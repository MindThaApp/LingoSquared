    - name: "None found -- established-conventions-only authoring"
      license: n/a
      usage: >-
        firecrawl was at 0/1000 credits this cycle (confirmed via
        `firecrawl --status` before starting). Ran a WebSearch for FSI
        French Basic Course material specifically covering opinion-giving
        constructions ("à mon avis," "je trouve que," giving opinions with
        reasons) -- results only surfaced the same FSI Vol.1/Vol.2 PDFs
        already used for a1_unit14 (comparatives/superlatives, Vol.1 Unit
        9), with no indication either volume has a dedicated
        opinion-giving/debate lesson; the 1960s-70s FSI diplomatic/tourist
        register is a poor match for this topic regardless. Did not
        download and search the PDFs page-by-page given how unlikely a hit
        was and how well-established the target constructions are outside
        any single source (à mon avis / je trouve que / par contre / même
        si + indicative / il vaudrait mieux que + subjunctive are all
        standard, textbook-independent A2 opinion-giving forms). Authored
        from established French pedagogical conventions instead, not
        copied or adapted from any single text. Honest disclosure per
        AUTHORING_GUIDE.md #10: no usable public-domain source found for
        this specific unit, not a substitute for one.
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    First-ever French A2 unit. Continues the Inès/Mathieu storyline: Inès
    has just moved to Lyon to start a professional pâtisserie
    apprenticeship (new throughline for the A2 units). This unit: a phone
    call where Inès and Mathieu genuinely disagree about whether she
    should specialize in pâtisserie (pastry) or boulangerie (bread) at
    her apprenticeship -- a concrete, familiar, opinion-worthy topic tied
    directly to the ongoing storyline, not an abstract debate. tu-register
    throughout (peer register between the two friends, per the
    established a1 pattern). Targets universal.a2.opinions.
    give_opinions_with_reasons: opinion+reason connectors (à mon avis, je
    trouve que, parce que, c'est pour ça que, par contre, je ne suis pas
    d'accord parce que) in lesson01; the disagreement/contrast register in
    lesson02, including même si + INDICATIVE (a real, useful correction of
    the common learner assumption that "even though" needs subjunctive
    like bien que does) and a genuine subjunctive trigger, il vaudrait
    mieux que + subjunctive (choisir: tu choisis indicative vs. que tu
    choisisses subjunctive -- a visibly different form, chosen
    deliberately over a verb whose subjunctive/indicative forms coincide),
    plus il est possible que + subjunctive (être: que tu sois) as a second
    trigger; lesson03 is the full 8-line phone-call dialogue putting every
    connector to real use, ending in genuine unresolved-but-amicable
    disagreement ("chacun son avis"). Every kind:vocabulary card carries a
    real example sentence per schema_version 1.1. Deliberately exceeds
    a1_unit14's sentence complexity: multi-clause opinion+reason
    constructions, a real subjunctive trigger, and contrastive connectors
    (par contre, d'un côté... de l'autre côté) that a1 never used. Not yet
    fresh-context reviewed. Authored as one of six parallel new A2 units
    (bureaucracy/banking/health/housing/employment authored separately,
    not referenced here) -- self-contained, no cross-unit dependency
    beyond the shared Inès/Mathieu characters already established in
    a1_unit01-14.

