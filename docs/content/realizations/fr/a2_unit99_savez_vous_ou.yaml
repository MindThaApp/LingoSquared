  notes: 'Drafted by drafting tool A. Grammar target: indirect questions after savez-vous / tu sais / je ne sais pas / je voudrais savoir / pouvez-vous me dire with où, quand, à quelle heure, combien, comment + infinitive and si (s''il), statement word order in the embedded clause (no est-ce que, no inversion). Canon reused: Camille asks an employee (L''employé, a minor role like Le serveur) using vous; Camille and Mathieu stay tu with each other. Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) ''où est la gare'' keeps the verb-subject order after où (taught as a fixed pattern) while ''à quelle heure le train part'' uses statement order: confirm that the notes describe this accurately for A2; (2) ''Les billets sont là-bas, à droite'' naturalness; (3) ''Merci d''avance'' in a first email.'
