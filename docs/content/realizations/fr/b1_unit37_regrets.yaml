  notes: >-
    B1 regret-and-past-wishes unit. Inès (pâtisserie apprentice under
    Monsieur Lefebvre) talks to Mathieu (her peer/friend, tu register)
    about a pastry competition she did not do well in. Lesson 1 teaches
    the real past event and "j'aurais dû + infinitif" (should have
    done). Lesson 2 teaches "je regrette de ne pas avoir + participe
    passé" (regret not having done) and the full dialogue. The
    culminating exercise requires all three parts together: what
    actually happened, what she should have done, and what she regrets
    not having done -- the full past-hypothetical regret, per
    universal.b1.hypotheticals.express_regret_and_past_wishes read
    literally. Canon check: Inès remains a pâtisserie apprentice in Lyon
    under Monsieur Lefebvre; Mathieu remains her peer, tu register
    throughout (matches units 25/28/29/34).

