generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    French C1 unit 04 on conceding and counter-arguing with subtlety: granting
    a valid opposing point, qualifying its scope, presenting a proportionate
    counterargument, and weighing competing considerations. Authored from
    established French discourse conventions, with no sibling-direction overlay
    consulted. Character canon was checked in docs/content/realizations/fr/:
    Inès is the pâtisserie apprentice in Lyon under Monsieur Lefebvre (young
    woman); Mathieu is her peer and friend, and the two address each other
    with informal tu. This unit keeps that register throughout: Inès delivers
    a single-voice monologue to Mathieu using tu ("tu as raison"), never vous.
    The argument topic is whether the pâtisserie should start home delivery
    (livrer à domicile): Inès concedes Mathieu's strongest point, qualifies it
    with the cost objection, counters with the loyal-clientele point, and
    weighs the two considerations in favour of consolidating what works.
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.argumentation.concede_and_counter_with_subtlety. Verify
    that every concession is genuinely granted before it is qualified (not
    dismissed), that the qualification narrows the conceded point rather than
    contradicting it, that the counterargument is proportionate, and that the
    final weighing follows from the considerations actually raised. The
    culminating speaking and writing exercises each require the complete act:
    concede, qualify, counter, and weigh. All listen/dictation exercises use
    dedicated single-sentence audio assets whose script is byte-identical to
    tested_text; the complete-argument listening exercise uses a dedicated
    single-voice monologue (Inès) of the full argument, not a shared
    multi-turn dialogue asset.

