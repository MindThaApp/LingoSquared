  notes: 'Drafted by drafting tool A. Grammar target: pour + infinitive for purpose, aller + place + pour + infinitive, pour + noun or stressed pronoun, pour ne pas + infinitive, and the contrast between pour (aim) and parce que (cause). No subjunctive (pour que is left to B1). Canon reused: Camille and Mathieu are friends using tu; Mathieu saves for a bike (NEW fact, check against canon). Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) ''Pour quoi faire ?'' is the natural spoken form; confirm; (2) ''Je vais au supermarché pour acheter du pain'' is plausible although bread is usually bought at the bakery, kept for a clear partitive; (3) ''Un café pour moi, s''il vous plaît'' as a model for pour + stressed pronoun.'
