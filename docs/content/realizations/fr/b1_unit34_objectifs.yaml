review:
  status: reviewed
  required_next_reviewer: fresh_context
  notes: >-
    B1 purpose-clause unit. Canon check: Inès is a recent pâtisserie
    apprentice under Monsieur Lefebvre, and Mathieu is her peer/friend
    (per a1/a2/b1 units 27-35) -- an earlier draft wrongly cast Inès as
    Mathieu's trainer, which contradicts that. Fixed: Lesson 1 teaches
    "pour + infinitif" for a same-subject purpose (Inès saving to take
    an advanced pastry course -- her own goal, fitting her apprentice
    status). Lesson 2 teaches "pour que + subjonctif" for a
    different-subject purpose (the chef training Inès so that she can
    work alone); Mathieu stays a peer who asks about her progress, never
    her trainee. The culminating exercise requires one
    "pour + infinitif" sentence and one "pour que + subjonctif"
    sentence, covering the everyday/work topic and the different-subject
    range named in the spine outcome.

