generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Same provenance
    basis as fr b2 unit01 (no adaptable upper-intermediate public-domain
    French source exists); built from standard French grammar knowledge,
    following the shipped nl B2 tier as the structural exemplar (topic
    scaffold, lesson arc, exercise-type pacing). Sibling-isolation
    honored: no en-fr overlay, no fr-en direction, and no other language's
    B2 file was opened; only fr's own established B1 character canon
    (Inès/Mathieu, tu register) and this file's own unit01 were consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) that devoir (present deduction, "il doit être")
    vs pouvoir (possibility, "il peut être") vs ne pas pouvoir
    (impossibility) are used with correct certainty force throughout; (2)
    the past-deduction construction "il a dû + infinitive" (dû is
    devoir's irregular past participle) and "il a peut-être + past
    participle" are correctly formed everywhere they appear; (3) that
    "Mathieu" being late/absent for one lesson does not contradict his
    established B1 canon (peer of Inès, pâtisserie apprentice) -- he is
    never shown as unreliable, just realistically delayed once, resolved
    by a mundane bike problem; (4) confirm "Ça peut être ça", "à cause
    de", and "en fait" read as current everyday French.
  notes: >-
    Second French B2 unit. Targets the CEFR B2 speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    speculate about causes and consequences with graded certainty -- say
    what may, might, must, or cannot be the case (present and past), and
    distinguish deduction from guesswork. Theme: Mathieu has not arrived
    at the bakery one morning; Inès and a colleague speculate about why,
    with the mystery resolved (a flat bike tire) in the reading and
    culminating dialogue. Lesson arc: L01 the certainty scale (peut-être /
    probablement / sans doute / certainement), L02 present deduction with
    devoir (il doit être...), L03 present possibility/impossibility with
    pouvoir / ne pas pouvoir, L04 past deduction (il a dû + infinitive,
    il a peut-être + past participle), L05 a reading distinguishing stated
    fact from speculation and resolving the mystery, L06 the culminating
    dialogue requiring speculation at multiple certainty levels. Register:
    informal tu throughout (Inès's own speech); Mathieu appears only via a
    colleague's third-person report and a brief phone call in the closing
    dialogue, so no register conflict. Cumulative with fr b2 unit01 within
    the same fr.b2 course (self-contained course; vocabulary accumulates
    across this course's own units, per the compiler's multi-file
    validation order -- confirmed by compiling unit01+unit02 together).
    No sibling-direction file was consulted.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked realization + en-fr overlay for unit02 (answer keys,
    gender/synonym variants, matching-pair discriminability,
    listen/dialogue distractors vs audio, dialogue cards vs audio
    script, Mathieu canon (pâtisserie peer, Lyon -- no conflict),
    course-scoped token coverage, YAML booleans, learner-visible
    notes). Fixes: lesson01.exercise03.match_certainty_words: 'sans
    doute'/'almost certainly' pair dropped (contradicted the teaching
    gloss 'no doubt / probably' and was interchangeable with
    probablement) -> 'en retard'/late in pairs, tested_text and
    overlay value; lesson01.teach.sans_doute note corrected (everyday
    sans doute = 'probably', not 'undoubtedly'; sans aucun doute for
    certainty) and grammar_certitude note scale now 'probablement /
    sans doute (about equally strong)'; lesson01.exercise05 accepts
    'Mathieu est sans doute en retard'; lesson01.exercise06 accepts
    'Peut-être qu'il est en retard'; lesson05.exercise01 'What is one
    thing Inès speculates...' -> 'What is one speculation the text
    makes...' and lesson05.exercise04 'How do Inès and her colleague
    finally learn...' -> 'How is the real reason finally learned?' /
    'Mathieu calls.' (Inès never appears in the reading);
    lesson05.exercise01-04 reading_comprehension prompts now carry the
    French passage as the first target_block; lesson05.exercise06
    accepts 'Son collègue pense...' (English 'his colleague' does not
    pin gender); lesson04.exercise05/07 accept 'manqué le bus';
    lesson03.exercise06 pinned 'using pouvoir' and
    lesson06.exercise05/06 pinned 'using devoir, pouvoir and avoir dû'
    (Il est peut-être dans les embouteillages was an ungraded valid
    'simple possibility'). NATIVE FLAGS: 'Il peut être dans les
    embouteillages' for a specific present possibility ('Il est
    peut-être...' / 'Il se peut qu'il soit...' are more idiomatic);
    grammar_certitude French target still lists sans doute above
    probablement; example 'Sans doute, il arrive bientôt.' ('Il arrive
    sans doute bientôt' more natural). DEFERRED: none.

course:
