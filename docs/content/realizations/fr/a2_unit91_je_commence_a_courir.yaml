  notes: 'Drafted by drafting tool A. Grammar target: commencer à / continuer à + infinitive, arrêter de + infinitive and ne ... plus, essayer de + infinitive, oublier de / n''oublie pas de, with présent and passé composé. Canon reused: Camille and Mathieu are friends using tu; Mathieu now runs and has stopped coffee in the evening (NEW facts that follow his tiredness in the advice unit 90). Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) ''continuer à'' vs ''continuer de'' (the unit teaches à only); (2) ''trois fois par semaine'' naturalness; (3) ''Repose-toi'' style imperative is avoided here; confirm ''Tu as arrêté ?'' in the dialogue is natural.'
