  notes: >-
    French C1 unit 08 on persuasion through rhetorical devices: the rhetorical
    question, parallelism, emphasis (mise en relief), appeals to logic, emotion
    and values, modulating intensity, and a call to action. Authored from
    established French discourse conventions, with no sibling-direction overlay
    consulted. Character canon was checked in docs/content/realizations/fr/:
    Inès is the pâtisserie apprentice in Lyon under Monsieur Lefebvre (young
    woman); Mathieu is her peer and friend, and the two address each other with
    informal tu. This unit keeps that register throughout: Inès delivers a
    persuasive appeal to Mathieu using tu ("peux-tu", "rejoins-moi"), never
    vous, and Monsieur Lefebvre does not appear.
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.persuasion.persuade_with_rhetorical_devices. Verify
    that the rhetorical question genuinely expects no answer, that the
    parallelism is a real repeated structure ("Chaque jour ... Chaque soir"),
    that the emphasis uses a true mise en relief (c'est ... qui / c'est ... que),
    that each appeal is attributed to its correct type (logic vs emotion vs
    values), and that the culminating speaking and writing exercises each
    require the complete act: one rhetorical question, one parallel structure,
    deliberate emphasis, an audience-appropriate appeal, and a clear call to
    action. All listen/dictation exercises use dedicated single-sentence audio
    assets whose script is byte-identical to tested_text; the full-appeal
    listening exercise uses a dedicated single-voice monologue (Inès).

