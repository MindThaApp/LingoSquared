- content_key: fr.a2.audio.dialogue.tu_devrais.01
  language: fr
  text: 'Mathieu: Camille, je suis très fatigué. Qu''est-ce que je devrais faire ? Camille: Tu devrais dormir plus. Il vaut mieux ne pas boire de café le soir. Mathieu: Tu as raison. Mais c''est difficile, je travaille beaucoup. Camille: Alors va chez le médecin et demande conseil. Mathieu: Bonne idée ! Je vais le faire demain. Camille: Bravo ! Repose-toi bien.'
  voice_hint: two_young_adults_casual
  status: pending_generation
