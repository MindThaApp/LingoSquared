  notes: 'Drafted by drafting tool A. Grammar target: tu devrais / vous devriez + infinitive (the conditional of devoir taught as a fixed polite form), il vaut mieux (ne pas) + infinitive, imperative tu and vous (regular -er, va, bois, dors), asking and answering advice (qu''est-ce que je devrais faire, bonne idée, tu as raison). Canon reused: Camille and Mathieu are friends using tu; Mathieu is tired this week (NEW fact). Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) ''Je dors mal'' vs ''je ne dors pas bien''; (2) ''demande conseil'' vs ''demande un conseil''; (3) ''cette semaine'' placement in the reading.'
