  - content_key: fr.a2.unit18.audio.dialogue.chez_le_medecin.01
    language: fr
    text: "Dr Lambert : Bonjour Inès, qu'est-ce qui ne va pas aujourd'hui ?\nInès : Bonjour Docteur. J'ai mal à la gorge depuis trois jours, et la douleur est de plus en plus forte.\nDr Lambert : Vous avez d'autres symptômes ? De la fièvre, par exemple ?\nInès : Un peu de fièvre le soir, et je suis épuisée, surtout le matin. Depuis que j'ai commencé mon apprentissage, je me lève à quatre heures et je reste debout toute la journée près des fours.\nDr Lambert : Je vois. Ouvrez la bouche, s'il vous plaît... Ce n'est pas une angine, mais vos cordes vocales sont irritées par la chaleur des fours.\nDr Lambert : Il faudrait que vous vous reposiez la voix autant que possible, et je vous conseille de boire beaucoup d'eau chaude avec du miel. Je vais aussi vous prescrire un sirop : il faut que vous le preniez trois fois par jour.\nInès : D'accord, Docteur. Et si ça ne s'améliore pas ?\nDr Lambert : Revenez me voir dans une semaine. Je veux que vous reveniez avant ça si la douleur empire."
    voice_hint: two_adults_neutral_professional_formal
    status: pending_generation

