generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material:
    - name: "FSI French Basic Course (Revised), Volume 2, Leçon 19 -- Dialogue: \"La visite du docteur\""
      license: public_domain
      usage: >-
        Downloaded from livelingua.com (Fsi-FrenchBasicCourserevised-Volume2-
        StudentText.pdf) and text-extracted via pdftotext -layout (firecrawl
        still at 0/1000 credits this cycle; WebSearch + curl + pdftotext used
        instead). Confirmed genuine via the volume's own preface (Foreign
        Service Institute, Monique Cossard and Robert Salazar, 1976). Leçon
        19's dialogue is a doctor's house call for a feverish cold, and its
        grammar points are Point de grammaire 2 and 5, both "le subjonctif" --
        directly relevant to this unit's A2 target of doctor's-advice-register
        subjunctive. Adapted, not copied: the source's specific situation (a
        1970s house call, a generic feverish cold, a diplomat needing to
        travel the following Monday) was replaced with this course's own
        Inès storyline (a pâtisserie-apprentice's kitchen-heat-irritated sore
        throat, an in-clinic appointment, not a house call). What was reused
        as scaffolding, not text: the overall consultation shape (greeting ->
        symptom description with duration -> follow-up questions ->
        examination -> diagnosis -> advice with a softened/obligatory
        register split -> a conditional return instruction), several attested
        MOTS UTILES health idioms modernized into this unit's own sentences
        (e.g. source "J'ai mal à la tête" / "j'ai mal à la gorge" underlie
        this unit's "j'ai mal à la gorge" vocabulary, and source "Je vous
        conseille de garder la chambre" / "tant que vous aurez de la fièvre"
        directly informed this unit's own, differently-worded "Je vous
        conseille de boire beaucoup d'eau chaude" and "revenez me voir" -
        style advice phrases), and the genuine attested use of "il faut que"
        + subjunctive for a doctor's medical instruction, which this unit's
        A2 complexity bar specifically targets. No FSI sentence, drill item,
        or dialogue line is reused verbatim; every sentence in this unit was
        newly composed for the Inès storyline and its own A2 duration/
        severity/formal-register teaching goals, which the 1976 source does
        not itself teach (its own grammar points are the imperfect vs.
        passé composé subjunctive triggers generally, not duration/severity
        constructions specifically).
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    First-ever French A2 unit (fr's first content past A1), topic: health /
    attending a doctor's appointment, continuing the Inès storyline into her
    new pâtisserie apprenticeship in Lyon. Scoped to 3 lessons: lesson01
    teaches duration/severity vocabulary for describing a symptom in more
    detail than A1 ("Ça fait... que...", "de plus en plus", "surtout le
    matin", etc.); lesson02 teaches the formal vous-register conditional/
    subjunctive advice pattern doctors naturally use ("il faudrait que",
    "je vous conseille de", "il faut que", "je veux que" + subjunctive);
    lesson03 is a full 8-turn doctor/patient dialogue plus a short
    appointment-confirmation reading card, covering all four spine
    modalities (a reading_comprehension exercise for the confirmation
    message, two dialogue_comprehension exercises for the consultation
    audio, a word_order/dialogue_response/speak_response set for
    production). A writing_prompt in lesson01 and the reading_comprehension
    in lesson03 were added specifically to serve the spine outcome's
    writing/reading assessment_requirements, which the dispatch's baseline
    3-lesson sketch (mostly listening/speaking-shaped exercise types) didn't
    otherwise cover. Every kind:vocabulary card carries a real example
    sentence per schema_version 1.1; kind:phrase/dialogue/reading cards are
    exempt and don't repeat one. Sentence complexity was checked directly
    against fr/a1_unit14_comparisons.yaml (this course's own A1 reference
    point) and visibly exceeds it: multi-clause duration/severity
    constructions ("Ça fait trois jours que...", "Depuis que j'ai commencé
    mon apprentissage..."), sustained formal vous register throughout (no
    tu at all, unlike unit14's peer-register tu with Mathieu), and genuine
    subjunctive after "il faut que"/"je veux que" rather than only the
    comparative/superlative morphology unit14 targets. Not yet fresh-context
    reviewed. Authored in isolation from the five sibling A2 units being
    authored in parallel (bureaucracy/opinions/banking/housing/employment) -
    no sibling-direction overlay or other A2 unit's file was opened while
    authoring this one.

course:
  realization_key: fr.a2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    This unit is Inès's first sustained formal-register content: every line
    with the doctor uses vous, with no tu at all (unlike unit01-14's tu with
    Mathieu and other peers). This matches real French medical-appointment
    register -- a patient and doctor who don't know each other socially
    always use vous, regardless of the patient's age.

