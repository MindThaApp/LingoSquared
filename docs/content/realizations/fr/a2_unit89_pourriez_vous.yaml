  notes: 'Drafted by drafting tool A. Grammar target: je voudrais / nous voudrions, pouvez-vous / pourriez-vous + infinitive (polite vous), tu peux for friends, offers with je peux vous aider and voulez-vous, accepting and declining (volontiers, avec plaisir, non merci, ça va). Canon reused: Mathieu from Camille''s circle, now speaking formal vous to a café waiter; Camille coaches him with tu. The café scene is NEW. Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) pourriez-vous taught as a polite fixed form (conditional not named); (2) whether ''Voulez-vous aussi un croissant ?'' is better as ''Vous voulez aussi un croissant ?'' in a café; (3) ''Un instant'' vs ''Un moment'' for the waiter.'
