generation_provenance:
  method: ai_generated
  authoring_system: codex
  human_reviewed: false
  source_material:
    - name: "Established-conventions-only authoring"
      license: n/a
      usage: >-
        Authored from standard contemporary French travel-disruption
        conventions for stations and public transport. No other language's
        unit for this outcome was opened or used.
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    Continues Inès's Lyon apprenticeship storyline. Inès is travelling
    from Lyon to Paris to see Mathieu after work, but her train is delayed
    and she has to ask a station employee about alternatives, then text
    Mathieu that she will be late. Register follows the established fr
    lane: tu with Mathieu, vous with station staff. Covers the spine's
    listening, reading, speaking, and writing requirements, with the final
    writing prompt requiring a short disruption-and-consequence message.

course:
  realization_key: fr.a2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Tu remains the norm between Inès and Mathieu. Inès uses vous with the
    station employee because this is a brief public-service interaction.

media_assets:
  - content_key: fr.a2.audio.retard_vingt_minutes.neutral.01
    language: fr
    text: "Le train pour Paris a vingt minutes de retard."
    voice_hint: station_announcement
    status: pending_generation
  - content_key: fr.a2.audio.dialogue.voyage_perturbe.01
    language: fr
    text: "Inès : Bonjour, excusez-moi, mon train pour Paris est annoncé avec quarante minutes de retard. Est-ce qu'il y a une autre option ?\nAgent : Oui, vous pouvez prendre le train pour Dijon, puis une correspondance pour Paris à dix-neuf heures vingt.\nInès : Est-ce que mon billet est valable pour cette correspondance ?\nAgent : Oui, à cause du retard, votre billet reste valable aujourd'hui.\nInès : Très bien, merci. Je vais prévenir mon ami que j'arriverai plus tard.\nAgent : Bonne soirée, madame."
    voice_hint: young_woman_and_station_agent
    status: pending_generation

units:
