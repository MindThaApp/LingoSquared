            example: {text: "Le train partira de la voie numéro six.", language_code: fr, direction: ltr}
          - content_key: fr.a2.unit21.lesson01.teach.correspondance
            kind: vocabulary
            target: {text: "une correspondance", language_code: fr, direction: ltr}
            introduced_tokens: ["une", "correspondance", "Je", "vais", "prendre", "pour", "Paris", "à", "Dijon"]
            example: {text: "Je vais prendre une correspondance à Dijon pour Paris.", language_code: fr, direction: ltr}
          - content_key: fr.a2.unit21.lesson01.teach.billet_valable
