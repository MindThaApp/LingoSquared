            introduced_tokens: ["un", "billet", "valable", "Mon", "reste", "aujourd'hui"]
            example: {text: "Mon billet reste valable aujourd'hui.", language_code: fr, direction: ltr}
          - content_key: fr.a2.unit21.lesson01.teach.notice
            kind: reading
            target:
              text: "Avis aux voyageurs : le train de 18h40 pour Paris est retardé de quarante minutes. Les voyageurs peuvent prendre la correspondance par Dijon avec le même billet."
              language_code: fr
              direction: ltr
