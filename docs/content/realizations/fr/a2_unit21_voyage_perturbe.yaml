        title: "Comprendre une perturbation"
        spine_outcome_id: universal.a2.travel.handle_travel_disruption
        teaching:
          - content_key: fr.a2.unit21.lesson01.teach.retard
            kind: vocabulary
            target: {text: "un retard", language_code: fr, direction: ltr}
            introduced_tokens: ["un", "retard", "Le", "train", "pour", "Paris", "a", "vingt", "minutes", "de"]
            example: {text: "Le train pour Paris a vingt minutes de retard.", language_code: fr, direction: ltr}
          - content_key: fr.a2.unit21.lesson01.teach.annule
            kind: vocabulary
            target: {text: "annulé", language_code: fr, direction: ltr}
            introduced_tokens: ["annulé", "Le", "train", "est", "à", "cause", "d'un", "problème", "technique"]
            example: {text: "Le train est annulé à cause d'un problème technique.", language_code: fr, direction: ltr}
          - content_key: fr.a2.unit21.lesson01.teach.voie
            kind: vocabulary
            target: {text: "la voie", language_code: fr, direction: ltr}
