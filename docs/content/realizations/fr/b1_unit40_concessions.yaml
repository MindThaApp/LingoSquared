  notes: >-
    B1 debate-with-concession-and-nuance unit. Inès (pâtisserie
    apprentice under Monsieur Lefebvre) and Mathieu (her peer/friend, tu
    register) debate whether to use the electric mixer or hand-kneading
    for a competition entry. Lesson 1 teaches the concessive clause
    ("même si Mathieu a raison de dire que...") immediately followed by
    Inès restating her own position. Lesson 2 teaches a stronger
    contrastive connector than "mais" ("cependant") used to add a second
    argument point, plus the full dialogue. The culminating exercise
    requires both together: the concession-then-restated-position
    sentence AND the second point structured with "cependant", per
    universal.b1.opinions.debate_with_concession_and_nuance read
    literally. Canon check: Inès remains a pâtisserie apprentice in Lyon
    under Monsieur Lefebvre; Mathieu remains her peer, tu register
    throughout (matches units 25/28/29/34/37/38/39).

