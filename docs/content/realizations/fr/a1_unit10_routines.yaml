    answers widened with the taught d'abord/ensuite, ensuite, puis and
    'et' variants. reply_saturday_routine - instruction pinned to the
    taught Saturday routine; 'ensuite' variants accepted.
    speak_describe_saturday - answer key was untaught 3rd-person (il se
    réveille / il va) and mismatched the 1st-person tested_text; now
    'Take Mathieu's role' with 1st-person accepted answers (plain, puis,
    d'abord/ensuite, ensuite, 'et'); realization French prompt changed
    to 'Tu es Mathieu : raconte ton samedi.' fill_dhabitude -
    instruction now 'Complete the word for "usually": D'___' so the
    learner types only the missing part.
    select_what_mathieu_does_after_breakfast - distractor 'He rests'
    (also true after breakfast) replaced with 'He goes to bed'. Notes
    rewritten to remove course-construction wording:
    teach.quest_ce_que_tu_fais, teach.line06,
    teach.ma_routine_du_samedi. NATIVE FLAG (owner/canon, shared with
    units 08-12): unit08 calls 22 March the workshop's last session
    while units10-12 treat it as ongoing; narrative tension only.
    DEFERRED: none.

    Second-pass review 2026-10-19: 2 fixes —
