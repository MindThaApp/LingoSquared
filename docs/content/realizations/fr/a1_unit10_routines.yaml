  notes: >-
    New unit, continuing the Inès/Mathieu cooking-workshop narrative: Inès
    asks Mathieu what his Saturday looks like before the workshop. Scoped
    to 3 lessons like units04-09. Every kind:vocabulary card carries a real
    example sentence per schema_version 1.1. Not yet fresh-context
    reviewed.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    Checked unit10 realization + en-fr overlay together: grading keys vs
    prompts, taught-token coverage, gendered first-person answers,
    option parallelism, learner-visible notes. Fixes (overlay unless
    noted): speak_morning_routine - open 'describe your routine' prompt
    pinned to 'Say these three steps in order: you wake up, you get up,
    you get dressed'; realization French prompt re-pinned to 'Dis dans
