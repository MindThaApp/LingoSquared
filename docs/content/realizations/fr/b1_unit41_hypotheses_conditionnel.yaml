  notes: >-
    B1 hypothetical-conditional unit. Inès (pâtisserie apprentice under
    Monsieur Lefebvre, Lyon) and Mathieu (her peer/friend, tu register)
    talk about her dream of her own workshop. Lesson 1 teaches the unreal
    "si + imparfait, conditionnel présent" construction. Lesson 2 teaches
    the conditional used ALONE to soften a request (rehearsed as a quote
    of what Inès will say to Monsieur Lefebvre -- never addressed to a
    present interlocutor in third person, so no person-deixis violation),
    plus the full dialogue. The culminating exercise requires both
    together per universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
    read literally: the unreal if-conditional sentence AND the
    conditional-alone softened request. Canon check: Inès remains a
    pâtisserie apprentice in Lyon under Monsieur Lefebvre; Mathieu
    remains her peer, tu register throughout (matches units
    25/28/29/34/37/38/39/40).

