target_language: fr
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Same provenance basis
    as fr b2 units01-04 (no adaptable upper-intermediate public-domain French
    source exists); built from standard French grammar knowledge, following
    the shipped nl B2 abstraction unit (nl.b2.unit06.abstractie) as the
    STRUCTURAL exemplar only (topic scaffold, 6-lesson arc, exercise-type
    pacing) -- no French text was calqued from the Dutch file; every French
    sentence in this unit was composed independently. Sibling-isolation
    honored: this unit was authored as one of four parallel B2 dispatches
    (units05/07/08); no sibling file was opened or referenced. Character
    canon (Inès/Mathieu, tu register, pâtisserie apprentices in Lyon under
    Monsieur Lefebvre) was confirmed by grepping fr b2 units01-04 before
    writing any new dialogue; no established fact is contradicted.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) naturalness of every qualifying connector in everyday
    spoken French -- dans une certaine mesure, il faut reconnaître que, d'un
    côté ... de l'autre, d'une part ... d'autre part -- and that the intended
    softening reads correctly to a native ear; (2) naturalness of the
    respond-to-counterargument frames -- certes ... mais, je comprends ton
    point cependant, tu n'as pas tort mais -- and that each reads as a real
    concession-then-hold-position move, not a flat "but"; (3) that Mathieu's
    counterargument (cost, hygiene rules, staff time) reads as a genuinely
    defensible practical objection and not a strawman -- confirm his final
    line ("dans une certaine mesure tu as raison") is a real qualified
    concession, not a capitulation that undercuts his own point; (4) that
    "le gaspillage alimentaire", "les invendus", "donner les invendus" are
    the natural way a French bakery worker would talk about unsold-pastry
    donation, and that no specific legal claim is overstated (this draft
    deliberately does not cite a specific law, per the coordinator's
    guidance to keep any legal reference vague/general -- confirm this
    omission reads as natural rather than conspicuously avoidant); (5)
    confirm the culminating lesson06 writing/speaking answers accept the
    punctuation variants a correct learner would actually produce; (6)
    confirm this unit does not duplicate unit03's café-review hedging
    scenario -- this is a different, deeper topic (a social/values issue,
    not a product review).
  notes: >-
    Fifth French B2 unit (unit06; unit05 authored in parallel by a sibling
    dispatch, not consulted). Targets the CEFR B2 abstraction outcome
    (universal.b2.abstraction.discuss_abstract_ideas_and_values): discuss an
    abstract topic -- ideas, values, social issues -- expressing an opinion
    with qualification and responding directly to another person's view.
    Theme: food waste at the pâtisserie (le gaspillage alimentaire) --
    Inès holds a strong value-driven opinion that unsold pastries should be
    donated rather than thrown away; Mathieu raises a real, non-strawman
    practical counterpoint (it costs money, hygiene rules apply, staff are
    already short on time). Lesson arc: L01 stating an opinion (je trouve
    que / je pense que / qu'est-ce que tu en penses ?, core vocab gaspillage/
    problème/important), ending in dictation; L02 a QUALIFIED opinion (dans
    une certaine mesure, il faut reconnaître que, d'un côté ... de l'autre --
    distinct connectors from unit03's own hedges); L03 responding to
    Mathieu's counterargument (certes ... mais, je comprends ton point
    cependant, tu n'as pas tort mais); L04 weighing pros and cons
    (l'avantage/l'inconvénient -- reused from unit01's own vocabulary --
    d'une part/d'autre part), ending in dictation; L05 a reading (an opinion
    piece Inès read on food waste) with chronology/stance-resolution
    questions; L06 the culminating dialogue where Inès and Mathieu each
    state a position and differ on how decisive the practical cost is,
    delivering the listening requirement (follow_abstract_discussion), a
    speak_response delivering a qualified opinion that directly answers
    Mathieu (discuss_an_abstract_topic), a two-sentence writing_prompt doing
    the same in writing (write_abstract_opinion), and a dialogue_response
    answering a restated opposing view. Register: informal tu throughout
    (Inès and Mathieu; unlike unit05, this unit stays in one register).
    Vocabulary is self-contained: every token tested anywhere in this file
    was introduced either in fr b2 units01-04 (confirmed by a corpus-wide
    introduced_tokens grep before writing, e.g. avantage/inconvénient/
    cependant/côté/de l'autre were already taught and reused) or earlier in
    this unit's own lesson sequence -- no forward references. No
    sibling-direction file was consulted.

course:
  realization_key: fr.b2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Informal tu throughout, consistent with fr b2 units01-04 and the
    established fr lane register for Inès and Mathieu. This unit layers
    opinion frames, qualifying connectors, and respond-to-counterargument
    frames onto that same everyday informal register.

