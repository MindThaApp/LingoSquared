      - content_key: fr.b2.unit06.lesson05.lire_un_point_de_vue
        title: "Lire un point de vue"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: fr.b2.unit06.lesson05.teach.texte
            kind: reading
            target:
              text: >-
                Le gaspillage alimentaire est un problème important dans une
                boutique. Certes, ça coûte de l'argent et il y a des règles
                d'hygiène. Les employés manquent parfois de temps.
                Cependant, il faut reconnaître que jeter la nourriture n'est
                pas une bonne solution. D'une part, donner les invendus est
                important. D'autre part, c'est aussi bon pour l'image de la
                boutique. Ce n'est pas toujours facile, mais c'est
                important.
              language_code: fr
              direction: ltr
            introduced_tokens: [solution, aussi, image, toujours, facile]
        exercises:
          - content_key: fr.b2.unit06.lesson05.exercise01.read_stance
            type: reading_comprehension
            tested_text: "le gaspillage alimentaire est un problème important"
            prompt: {target_blocks: [{text: "What is the author's overall stance on food waste?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson05.exercise02.read_concession
            type: reading_comprehension
            tested_text: "ça coûte de l'argent et il y a des règles d'hygiène"
            prompt: {target_blocks: [{text: "What does the author CONCEDE to the practical objection?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson05.exercise03.read_final_position
            type: reading_comprehension
            tested_text: "il faut reconnaître que jeter la nourriture n'est pas une bonne solution"
            prompt: {target_blocks: [{text: "Despite conceding the practical cost, what does the author still conclude?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson05.exercise04.read_hedge
            type: reading_comprehension
            tested_text: "ce n'est pas toujours facile mais c'est important"
            prompt: {target_blocks: [{text: "Does the author claim the solution is always easy?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "solution aussi l'image toujours facile une bonne solution"
            prompt: {target_blocks: []}
            pairs:
              - {left: solution, right: solution}
              - {left: aussi, right: also}
              - {left: "l'image", right: "the image"}
              - {left: toujours, right: always}
              - {left: facile, right: easy}
              - {left: "une bonne solution", right: "a good solution"}
          - content_key: fr.b2.unit06.lesson05.exercise06.translate_toujours_facile
            type: translation
            tested_text: "Ce n'est pas toujours facile"
            prompt: {target_blocks: [{text: "Translate into French: It's not always easy.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson05.exercise07.write_important
            type: writing_prompt
            tested_text: "C'est aussi bon pour l'image de la boutique"
            prompt: {target_blocks: [{text: "Write in French: It's also good for the shop's image.", language_code: en, direction: ltr}]}

      - content_key: fr.b2.unit06.lesson06.en_discussion
        title: "En discussion : une opinion nuancée"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: fr.b2.unit06.lesson06.teach.societe
            kind: vocabulary
            target: {text: "la société", language_code: fr, direction: ltr}
            introduced_tokens: [société]
            example: {text: "C'est important pour la société.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit06.lesson06.teach.dialogue_ines_open
            kind: dialogue
            target: {text: "Je trouve que le gaspillage alimentaire est un problème important. Il faut donner les invendus.", language_code: fr, direction: ltr, speaker: Inès}
            introduced_tokens: []
          - content_key: fr.b2.unit06.lesson06.teach.dialogue_mathieu_concede
            kind: dialogue
            target: {text: "Certes, mais ça coûte de l'argent et il y a des règles d'hygiène.", language_code: fr, direction: ltr, speaker: Mathieu}
            introduced_tokens: []
          - content_key: fr.b2.unit06.lesson06.teach.dialogue_ines_understand
            kind: dialogue
            target: {text: "Je comprends ton point, cependant c'est aussi important pour la société.", language_code: fr, direction: ltr, speaker: Inès}
            introduced_tokens: []
          - content_key: fr.b2.unit06.lesson06.teach.dialogue_mathieu_practical
            kind: dialogue
            target: {text: "Tu n'as pas tort, mais les employés manquent de temps.", language_code: fr, direction: ltr, speaker: Mathieu}
            introduced_tokens: []
          - content_key: fr.b2.unit06.lesson06.teach.dialogue_ines_weigh
            kind: dialogue
            target: {text: "Je pense que d'une part, c'est bon pour la société, d'autre part, c'est aussi bon pour l'image de la boutique.", language_code: fr, direction: ltr, speaker: Inès}
            introduced_tokens: []
          - content_key: fr.b2.unit06.lesson06.teach.dialogue_mathieu_qualify
            kind: dialogue
            target: {text: "D'accord, dans une certaine mesure tu as raison. Ce n'est pas toujours facile, mais c'est important.", language_code: fr, direction: ltr, speaker: Mathieu}
            introduced_tokens: []
          - content_key: fr.b2.unit06.lesson06.teach.grammar_recap
            kind: grammar_note
            target: {text: "Une discussion abstraite complète mélange une opinion (je trouve que / je pense que), une nuance (dans une certaine mesure / il faut reconnaître que), et une réponse directe à l'autre (certes ... mais / je comprends ton point, cependant). C'est exactement ce que tu produis dans les exercices d'expression orale et écrite qui suivent.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit06.lesson06.exercise01.comprehend_ines_position
            type: dialogue_comprehension
            tested_text: "le gaspillage alimentaire est un problème important il faut donner les invendus"
            media_asset_key: fr.b2.unit06.audio.abstraction.dialogue.gaspillage_debat.01
            prompt: {target_blocks: [{text: "What is Inès's position?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson06.exercise02.comprehend_mathieu_position
            type: dialogue_comprehension
            tested_text: "ça coûte de l'argent et il y a des règles d'hygiène"
            media_asset_key: fr.b2.unit06.audio.abstraction.dialogue.gaspillage_debat.01
            prompt: {target_blocks: [{text: "What is Mathieu's practical counterpoint?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson06.exercise03.comprehend_difference
            type: dialogue_comprehension
            tested_text: "les employés manquent de temps"
            media_asset_key: fr.b2.unit06.audio.abstraction.dialogue.gaspillage_debat.01
            prompt: {target_blocks: [{text: "Where do Inès and Mathieu mainly DIFFER?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson06.exercise04.order_je_comprends
            type: word_order
            tested_text: "Je comprends ton point cependant c'est important"
            prompt: {target_blocks: []}
            word_bank: [Je, comprends, ton, point, cependant, "c'est", important]
          - content_key: fr.b2.unit06.lesson06.exercise05.speak_qualified_response
            type: speak_response
            tested_text: "Je comprends ton point. Cependant, dans une certaine mesure, il faut donner les invendus."
            prompt: {target_blocks: [{text: "Mathieu says donating unsold pastries costs money and takes staff time. Respond aloud in French with a QUALIFIED opinion that answers him directly, using je comprends ton point and dans une certaine mesure: I understand your point. However, to a certain extent, we have to give away the unsold items.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson06.exercise06.write_qualified_opinion
            type: writing_prompt
            tested_text: "Certes, ça coûte de l'argent. Mais dans une certaine mesure, il faut reconnaître que c'est un problème important."
            prompt: {target_blocks: [{text: "Mathieu argues that donating unsold pastries costs money and takes extra time. Write TWO French sentences responding with a QUALIFIED opinion that answers him directly. (1) Concede his point, using certes: Granted, it costs money. (2) Give your own qualified opinion, using dans une certaine mesure and il faut reconnaître que: But to a certain extent, it must be acknowledged that it's an important problem.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit06.lesson06.exercise07.respond_qualified
            type: dialogue_response
            tested_text: "Dans une certaine mesure, tu as raison, mais je pense que c'est un problème important."
            prompt: {target_blocks: [{text: "Ça coûte de l'argent et les employés manquent de temps.", language_code: fr, direction: ltr}]}
