  - content_key: fr.b2.unit06.audio.abstraction.dialogue.gaspillage_debat.01
    language: fr
    text: >-
      Inès : Je trouve que le gaspillage alimentaire est un problème
      important. Il faut donner les invendus. Mathieu : Certes, mais ça
      coûte de l'argent et il y a des règles d'hygiène. Inès : Je comprends
      ton point, cependant c'est aussi important pour la société. Mathieu :
      Tu n'as pas tort, mais les employés manquent de temps. Inès : Je pense
      que d'une part, c'est bon pour la société, d'autre part, c'est aussi
      bon pour l'image de la boutique. Mathieu : D'accord, dans une certaine
      mesure tu as raison. Ce n'est pas toujours facile, mais c'est
      important.
    voice_hint: young_man_and_young_woman
    status: pending_generation

