  notes: >-
    B1 advice/suggestion unit. Lesson 1 teaches "tu devrais + infinitif"
    (you should). Lesson 2 teaches "si j'étais toi, je" + conditionnel
    (if I were you), plus Mathieu accepting the advice in dialogue. The
    culminating exercise requires one "tu devrais" sentence, one
    "si j'étais toi" sentence, and one accepting RESPONSE to the advice
    ("Tu as raison, je vais essayer cette semaine."), covering both the
    "give advice" and the "respond to advice" range named in the spine
    outcome.

    Second-pass review 2026-10-19: 1 fix — lesson02.exercise05.speak_si_jetais_toi: prompt printed the full French answer -> prompt is only Mathieu's cue "Je n'ose pas lui demander directement.".

