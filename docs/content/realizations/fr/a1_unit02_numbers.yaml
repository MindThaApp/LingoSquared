review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Initial six-lesson draft, continuing unit01's Inès/Mathieu cooking-
    workshop narrative into numbers. Deliberately covers the 70/80/90
    vigesimal-remnant forms (soixante-dix, quatre-vingts, quatre-vingt-dix)
    as their own dedicated vocabulary items rather than glossing over them,
    since they're the single biggest real footgun in French numbers. Audio
    remains pending generation. Fresh-context review (2026-07-06) found
    and fixed real bugs: several exercises silently dropped required
    elided pronouns/articles (j'/c'/d') to dodge the untaught-token
    check, producing grammatically broken "correct" answers (J'ai,
    C'est, d'œufs restored); an exercise mistyped as dialogue_comprehension
    when it had no audio; a grammar overstatement claiming 71 follows the
    same "et" pattern as 21/31 (it's soixante et onze, not "soixante et
    un" -- 70-79 continues counting through the teens); stray literal
    quote characters; and a near-total miss on the §15 asterisk
    convention.

    2026-07-10 second fresh-context review (Claude), cold: re-checked
    every item on the current review checklist rather than trusting the
    earlier pass's self-report. No further bugs found in THIS file: no
    same-speaker distractor collisions in the recipe-count dialogue
    (Mathieu's own phone number 07-2-0-4-1-8-9 stays consistent between
    the teaching dialogue and the word_order/matching exercises that
    reuse it), no stray YAML booleans, matching_pairs pairs are correctly
    array-of-{left,right}, word_order correct_response values are token
    lists, ages (Mathieu 28 / Inès 31) stay consistent with unit03's
    reuse of the same facts, every exercise type used is registered, and
    pacing holds programmatically. Compiler validates 0 errors (only
    expected schema_version 1.0 "no example sentence" warnings). Now
    genuinely reviewed and ship-ready.

course:
  realization_key: fr.a1
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Continue unit01's register split: tu with Mathieu and other peers at the
    workshop, vous for the instructor or unfamiliar adults. This unit uses
    Metropolitan French numbers throughout (soixante-dix/quatre-vingts/
    quatre-vingt-dix), not Belgian or Swiss septante/huitante/nonante, per
    unit01's own dialect declaration.

