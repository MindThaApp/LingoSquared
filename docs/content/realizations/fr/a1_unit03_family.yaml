review:
  status: unreviewed
  required_next_reviewer: claude
  notes: >-
    Initial six-lesson draft, continuing unit01/02's Inès/Mathieu cooking-
    workshop narrative into family. Covers the mon/ma/mes possessive-
    adjective agreement (with masculine/feminine/plural family nouns) as its
    own dedicated grammar point. Audio remains pending generation.
    Fresh-context review (2026-07-06) found and fixed real bugs: a fact
    inconsistency (Inès's parents were wrongly placed in Lyon -- that's
    Mathieu's home city, established in unit01; Inès is from Lille and
    her parents' location has been corrected throughout), an arithmetic
    inconsistency (the stated household headcount didn't actually add
    up against the parents + siblings + Inès it was supposed to total,
    fixed from cinq/five to six/six everywhere the refrain appears), a
    media_asset_key pointing at the wrong audio clip (added a real
    matching asset), an incoherent/ligature-inconsistent prompt, and a
    near-total miss on the §15 asterisk convention. Left status
    unreviewed per standing process; re-verified 0 errors/0 warnings
    via real compile after every fix.

course:
  realization_key: fr.a1
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Continues unit01/02's register split: tu with Mathieu and other peers at
    the workshop, vous for unfamiliar adults. Possessive adjectives (mon/ma/
    mes, ton/ta/tes, son/sa/ses) agree with the GENDER OF THE NOUN THEY
    MODIFY, not the gender of the owner -- a genuine A1 footgun this unit
    addresses directly rather than glossing over.

