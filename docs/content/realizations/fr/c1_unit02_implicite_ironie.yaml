  notes: >-
    French C1 unit 02 on implicit meaning: inference, implication, irony, and
    understatement — grasping what is meant beyond what is literally said.
    Authored from established French discourse conventions, with no
    sibling-direction overlay consulted. Character canon was checked in
    docs/content/realizations/fr/: Inès is the pâtisserie apprentice in Lyon
    under Monsieur Lefebvre (young woman); Mathieu is her peer and friend;
    the two address each other with informal tu. This unit keeps that
    register throughout: Inès comments on Mathieu's disastrous week with
    understatement ("C'est pas mal du tout, ton gâteau") and irony ("Tu
    parles d'une réussite !"), never vous.
review:
  status: unreviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.inference.infer_implicit_meaning. Verify that every
    ironic or understated utterance names the opposite of its literal wording
    and that the decisive cue (intonation, "Tu parles !", "au second degré")
    is stated, that no distractor in a meaning-inference question is also
    defensible, and that the culminating writing and speaking exercises each
    require the complete act: write a context plus an understated message, and
    produce an ironic or understated remark AND explain the unstated judgement
    it conveys. All listen/dictation exercises use dedicated single-sentence
    audio assets byte-identical to tested_text.

