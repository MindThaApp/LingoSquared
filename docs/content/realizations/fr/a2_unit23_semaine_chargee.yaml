    Continues Inès and Mathieu's peer storyline in informal tu. Inès
    explains a typical busy apprenticeship week in Lyon, contrasting
    weekdays with the weekend and ordering activities with d'abord,
    ensuite, puis, and le week-end. Final writing and speaking exercises
    require a multi-activity weekly schedule with sequencing.

    Second-pass review 2026-10-19: 2 fixes -- lesson02.exercise05:
    French prompt 'Dis : <answer>' printed the answer (A2 leak) -> cue
    question 'Ta semaine est comment, en général ?' only;
    lesson02.exercise06: 'Écris : <answer>' printed the whole schedule to
    copy -> empty prompt; the overlay instruction names the content. NATIVE FLAGS:
    teach.puis example 'Puis, je fais les courses...' -- a comma after
    sentence-initial puis is unusual; 'Puis je fais...' is the more
    standard punctuation.

