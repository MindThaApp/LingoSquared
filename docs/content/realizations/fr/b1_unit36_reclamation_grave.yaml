  notes: >-
    B1 complaint-and-resolution unit. Inès, writing as a private
    customer about an oven she bought for her own apartment, sends a
    polite complaint to the retailer (le fournisseur) using vous, the
    register appropriate for a customer-to-business complaint (a
    register shift from the peer tu used with Mathieu elsewhere in the
    lane, and named explicitly in the register_policy below). Canon
    check: Inès remains a pâtisserie apprentice under Monsieur Lefebvre
    (per a1/a2/b1 units 27-35) -- this complaint is about her own
    personal purchase, not a business-to-business order for the
    pâtisserie, so it does not touch her apprentice role. Lesson 1
    teaches naming the problem and what already happened; Lesson 2
    teaches requesting a concrete resolution and the supplier's reply.
    The culminating exercise requires all three parts together: the
    problem, what already happened, and the resolution requested.

course:
  realization_key: fr.b1
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Standard metropolitan French. This unit is a complaint from Inès,
    writing as a private customer about an oven she bought for her own
    apartment, to the retailer she bought it from, so Inès uses the
    polite vous register throughout, unlike the informal tu she uses
    with Mathieu elsewhere in the lane.

