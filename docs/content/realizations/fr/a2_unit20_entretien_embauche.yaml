generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_material:
    - name: "FSI French Basic Course (Revised) -- checked for job-interview/employment material, none found"
      license: public_domain
      usage: >-
        firecrawl showed 0/1000 credits remaining this cycle (as expected,
        not re-investigated). Used WebSearch instead to check whether the
        FSI French Basic Course (24 units, 1960s-70s diplomatic/tourist
        material -- greetings, hotels, train tickets, shopping) has any
        unit covering job interviews, employment, or professional
        apprenticeships. It does not: the course's real units cover travel
        and social situations, not workplace/interview register. This
        matches the authoring guide's own expectation that a 1960s
        diplomatic course is unlikely to cover this A2 "attend a job
        interview" topic well, confirmed rather than assumed. No FSI (or
        other public-domain) source material was usable for this unit --
        authored from established A2 conventions instead (formal
        vouvoiement register, conditional politeness forms, subjunctive
        after "il faudrait que"/"avant que", all independently verified
        against standard French grammar, not machine-translated or
        copied from any single external source).
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    First-ever French A2 unit. Explains why Inès moved to Lyon: this is
    the job interview for her pâtisserie apprenticeship, interviewed by
    Monsieur Lefebvre (chef-patron of Pâtisserie Lefebvre). Backstory
    built to be plausible for landing a real apprenticeship: since the
    A1 unit14 cooking workshop with Mathieu, Inès did a two-week bakery
    internship (stage) on top of the workshop -- referenced across
    lessons as her claimed relevant experience. Deliberately exceeds
    A1 unit14's sentence complexity throughout (multi-clause sentences,
    formal vous register, conditional politeness "Est-ce que je
    pourrais...?"/"J'aimerais savoir si...", and genuine subjunctive
    after "il faudrait que"/"avant que" -- checked against standard
    French grammar, not forced where unnatural). Covers all four spine
    modalities: reading via the job-posting card + reading_comprehension
    exercise, listening via dialogue_comprehension, speaking via
    dialogue_response/speak_response, writing via the writing_prompt
    exercise confirming availability. Every kind:vocabulary card carries
    a real example sentence per schema_version 1.1. Not yet fresh-context
    reviewed. Six parallel A2 units are being authored simultaneously by
    other sessions (bureaucracy/opinions/banking/health/housing) -- this
    unit was authored in isolation from all of them, no sibling files
    were opened.

course:
  realization_key: fr.a2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    First A2 unit: introduces the formal vouvoiement register for a job
    interview (Monsieur Lefebvre), distinct from unit01-14's tu with
    Mathieu and other peers -- the register itself is a teaching point
    of lesson02.

