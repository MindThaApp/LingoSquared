    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fr.a2.audio.il_faudrait_que_je_sois_disponible.neutral.01
    language: fr
    text: "Il faudrait que je sois disponible tous les matins."
    voice_hint: neutral_adult
    status: pending_generation
  - content_key: fr.a2.audio.dialogue.entretien_lefebvre.01
    language: fr
    text: "M. Lefebvre : Bonjour Inès, merci d'être venue. Parlez-moi un peu de votre expérience en pâtisserie.\nInès : Bonjour Monsieur Lefebvre. Je me suis toujours intéressée à la pâtisserie, et j'ai récemment suivi un atelier de cuisine avec un ami qui m'a vraiment donné envie d'aller plus loin.\nM. Lefebvre : C'est un bon début, mais avez-vous une expérience un peu plus professionnelle ?\nInès : Oui, j'ai aussi fait un stage de deux semaines dans une boulangerie, où j'ai appris à préparer des viennoiseries tous les matins.\nM. Lefebvre : Très bien. Et question disponibilité, quand pourriez-vous commencer, et seriez-vous libre le dimanche ?\nInès : Je suis disponible à partir du mois prochain, mais il faudrait que je sois libre le dimanche pour voir ma famille.\nM. Lefebvre : Ça ne pose aucun problème, nous sommes fermés le dimanche. Avez-vous une question pour moi ?\nInès : Oui : est-ce que je pourrais vous poser une question sur l'apprentissage ? J'aimerais savoir qui serait mon formateur ici.\nM. Lefebvre : Ce serait moi, la plupart du temps. Vous travailleriez avec moi tous les matins avant l'ouverture.\nInès : Parfait, c'est exactement ce que j'espérais. Merci beaucoup pour cet entretien."
    voice_hint: two_adults_formal_interview
    status: pending_generation

