      - content_key: fr.b2.unit05.lesson02.formules_de_politesse
        title: "Formules de politesse"
        spine_outcome_id: universal.b2.register.adapt_formality_to_audience
        teaching:
          - content_key: fr.b2.unit05.lesson02.teach.salut
