units:
  - content_key: fr.b2.unit05.registre
    title: "Le registre"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.register.adapt_formality_to_audience
    planned_lesson_count: 6

    lessons:
      - content_key: fr.b2.unit05.lesson01.tu_ou_vous
        title: "Tu ou vous ?"
        spine_outcome_id: universal.b2.register.adapt_formality_to_audience
        teaching:
          - content_key: fr.b2.unit05.lesson01.teach.ines_ecrit
            kind: phrase
            target: {text: "Inès écrit un message.", language_code: fr, direction: ltr}
            introduced_tokens: [Inès, écrit, écrire, un, message]
          - content_key: fr.b2.unit05.lesson01.teach.tu
            kind: vocabulary
            target: {text: "tu / te / ton, ta, tes", language_code: fr, direction: ltr}
            introduced_tokens: [tu, te, ton, ta, tes]
            example: {text: "Tu as le temps ?", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit05.lesson01.teach.vous
            kind: vocabulary
            target: {text: "vous / votre, vos", language_code: fr, direction: ltr}
            introduced_tokens: [vous, votre, vos]
            example: {text: "Avez-vous le temps ?", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit05.lesson01.teach.tu_as_le_temps
            kind: phrase
            target: {text: "Tu as le temps ?", language_code: fr, direction: ltr}
            introduced_tokens: [as, le, temps]
          - content_key: fr.b2.unit05.lesson01.teach.avez_vous_le_temps
            kind: phrase
            target: {text: "Avez-vous le temps ?", language_code: fr, direction: ltr}
            introduced_tokens: [Avez, avez]
          - content_key: fr.b2.unit05.lesson01.teach.tu_peux_maider
            kind: phrase
            target: {text: "Tu peux m'aider ?", language_code: fr, direction: ltr}
            introduced_tokens: [peux, pouvoir, "m'aider"]
          - content_key: fr.b2.unit05.lesson01.teach.pouvez_vous_maider
            kind: phrase
            target: {text: "Pouvez-vous m'aider ?", language_code: fr, direction: ltr}
            introduced_tokens: [Pouvez, pouvez]
          - content_key: fr.b2.unit05.lesson01.teach.grammar_tu_vous
            kind: grammar_note
            target: {text: "Tu as le temps ? / Avez-vous le temps ? Tu peux m'aider ? / Pouvez-vous m'aider ? Le verbe change avec vous : as -> avez, peux -> pouvez.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit05.lesson01.exercise01.recognize_vous
            type: multiple_choice
            tested_text: vous
            prompt: {target_blocks: [{text: vous, language_code: fr, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson01.exercise02.listen_avez_vous
            type: listen_select
            tested_text: "Avez-vous le temps"
            media_asset_key: fr.b2.unit05.audio.registre.avez_vous_temps.01
            prompt: {target_blocks: []}
          - content_key: fr.b2.unit05.lesson01.exercise03.match_pronouns
            type: matching_pairs
            tested_text: "tu te ton ta tes vous votre vos peux pouvez le temps"
            prompt: {target_blocks: []}
            pairs:
              - {left: tu, right: "you (informal, subject)"}
              - {left: te, right: "you (informal, object)"}
              - {left: "ton / ta / tes", right: "your (informal)"}
              - {left: vous, right: "you (formal)"}
              - {left: "votre / vos", right: "your (formal)"}
              - {left: peux, right: "can (informal tu form)"}
              - {left: pouvez, right: "can (formal vous form)"}
              - {left: "le temps", right: "the time"}
          - content_key: fr.b2.unit05.lesson01.exercise04.order_tu_as_temps
            type: word_order
            tested_text: "Tu as le temps"
            prompt: {target_blocks: []}
            word_bank: [Tu, as, le, temps]
          - content_key: fr.b2.unit05.lesson01.exercise05.translate_avez_vous
            type: translation
            tested_text: "Avez-vous le temps"
            prompt: {target_blocks: [{text: "Translate into French, formal, addressing la mairie as vous: Do you have time?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson01.exercise06.translate_tu_peux
            type: translation
            tested_text: "Tu peux m'aider"
            prompt: {target_blocks: [{text: "Translate into French, informal, addressing Mathieu as tu: Can you help me?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson01.exercise07.speak_pouvez_vous
            type: speak_response
            tested_text: "Pouvez-vous m'aider"
            prompt: {target_blocks: [{text: "Say aloud in French, formal, addressing la mairie as vous: Can you help me?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson01.exercise08.dictation_avez_vous
            type: dictation
            tested_text: "Avez-vous le temps ?"
            media_asset_key: fr.b2.unit05.audio.registre.avez_vous_temps.01
