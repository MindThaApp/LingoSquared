generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is fr's fifth
    B2 unit (register -- adapting formality to the audience). No adaptable
    upper-intermediate public-domain French source exists (fr b2 units01-04
    are all from-scratch, same basis), so this was built from standard
    French grammar/discourse knowledge, using the shipped nl B2 register
    unit (nl.b2.unit05.register) as the STRUCTURAL exemplar only -- its
    6-lesson arc, exercise-type pacing, and how it splits one register
    outcome across lessons. No French text was calqued from the Dutch file;
    every French sentence here was authored fresh from French grammar
    knowledge, per explicit coordinator instruction. Sibling-isolation
    honored: no en-fr overlay, no fr-en direction, and no other language's
    B2 register file was opened; only fr's own established B1/B2 character
    canon (Inès/Mathieu, tu register, pâtisserie apprenticeship under
    Monsieur Lefebvre in Lyon) and this course's own units01-04 were
    consulted. REGISTER SPECIAL CASE: like the Dutch exemplar, this unit
    DELIBERATELY teaches BOTH registers side by side -- informal tu/te/
    toi/ton-ta-tes (Inès to Mathieu) and formal vous/votre-vos (Inès to
    la mairie, the town hall, about an administrative appointment
    concerning the pâtisserie's licence/permit -- a plausible everyday
    extension of Inès's established apprenticeship at the shop, asserting
    no new fact about ownership or her role). Each individual exercise
    keeps a single internally consistent register; the contrast lives
    across the exercise pairs, and the culminating exercise produces the
    SAME request in both. Any register mixing across characters (Inès
    formal-to-la-mairie vs informal-to-Mathieu) is intentional, not a bug.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) the vous-conjugation forms -- confirm "Avez-vous le
    temps ?", "Pouvez-vous m'aider ?", "Pourriez-vous m'aider, s'il vous
    plaît ?" and "Serait-il possible de m'aider ?" all read as natural,
    correctly formed formal requests; (2) the two full request frames --
    informal "Tu peux déplacer notre rendez-vous ?" and formal "Serait-il
    possible de déplacer notre rendez-vous ?" -- confirm both are idiomatic
    and that "déplacer" (rather than "reporter") is the natural everyday
    verb for rescheduling an appointment in this context; (3) adverb
    placement in "Et je dois encore écrire poliment à la mairie." and "À la
    mairie, on écrit autrement." -- confirm natural word order; (4) the
    greetings/closings ladder -- confirm Salut/Coucou + Bises/À bientôt
    (informal), Bonjour + Cordialement (intended as a neutral-ish middle
    ground) and Madame, Monsieur + Veuillez agréer, Madame, Monsieur,
    l'expression de mes salutations distinguées. (most formal) are ranked
    correctly. FLAGGED, not asserted with confidence: whether "Cordialement"
    genuinely reads as neutral-professional here or is itself already a
    fairly formal/standard register in most everyday French correspondence
    -- this needs a native call, the lesson02 grammar note phrases it as a
    judgment call rather than an absolute rule; (5) the culminating writing
    exercises (lesson06 write_rewrite_formal and write_both_registers) are
    graded against fixed strings -- every internal/trailing punctuation
    combination is supplied as a separate accepted variant, so confirm no
    natural correct answer falls outside the supplied set; (6) confirm
    "convenir / conviendrait-elle" (would suit), "disponible" vs "libre",
    "la mairie", and "un rendez-vous" all read as current everyday French
    in an administrative-appointment context.
  notes: >-
    Fifth French B2 unit; first register unit. Targets the CEFR B2 register
    outcome (universal.b2.register.adapt_formality_to_audience): adapt
    register to audience and purpose -- convey the same message
    appropriately to a friend, a colleague, and an institution, recognizing
    which forms are too casual or too stiff for a given setting. Theme: one
    everyday request -- rescheduling an appointment ("un rendez-vous") about
    the pâtisserie's licence/permit at la mairie -- rendered both ways
    across all six lessons. Lesson arc: L01 the tu<->vous pronoun/verb shift
    (tu/te/ton-ta-tes vs vous/votre-vos; "Tu as le temps ?" -> "Avez-vous le
    temps ?", "Tu peux m'aider ?" -> "Pouvez-vous m'aider ?"); L02 greetings
    and closings (Salut/Coucou ... Bises/À bientôt vs Bonjour ...
    Cordialement as a neutral middle ground vs Madame, Monsieur, ...
    Veuillez agréer, Madame, Monsieur, l'expression de mes salutations
    distinguées. as the most formal); L03 directness -- informal imperative
    + s'il te plaît vs formal indirect Pourriez-vous...?/Serait-il possible
    de...? + s'il vous plaît; L04 the actual request (déplacer le
    rendez-vous) rendered informally and formally, with a reason
    (unavailable on a given day) and a proposed alternative (next week); L05
    a reading requirement -- two messages, same content, different
    register, identify the audience of each (delivers the spine's
    read_register assessment requirement); L06 the culminating production --
    an Inès/Mathieu dialogue for the listening requirement (judge whether
    the register fits the situation and what a mismatch would signal --
    delivers judge_register), a speaking task delivering the SAME request
    once to Mathieu and once to la mairie (delivers shift_register), a
    writing task rewriting the informal message as a formal one (delivers
    write_in_register), and a culminating writing task producing the
    request in BOTH registers. Register: this unit teaches both; the
    recurring Inès/Mathieu pair supply the informal tu side (their
    established informal tu from units01-04), the institutional side (la
    mairie) is formal vous to an unnamed official. All vocabulary is
    introduced self-contained within this file, cumulative with fr b2
    units01-04 within the same fr.b2 course (a B2 learner never sees
    A1/A2/B1 lexemes at runtime; confirmed by compiling units01-05
    together). No sibling-direction file was consulted.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked register teaching, audio script vs dialogue cards (4 turns
    correctly attributed), comprehension distractors vs audio, Mathieu
    canon (friend, tu), course-scoped vocabulary, YAML booleans,
    jargon/leaks. Fixes: lesson05.exercise01-04 reading_comprehension
    prompts never showed the two messages -> target_blocks now carry both
    French messages (informal first, formal second, matching 'the second
    message' wording); lesson02.exercise06 prompt gave the answer away
    ('...: Bises, Inès.') -> asks for the closing that literally means
    'kisses'; lesson06.exercise04/exercise07 prompts 'reschedule the
    appointment' vs keyed 'notre rendez-vous' -> 'our appointment'. NATIVE
    FLAGS: 'notre rendez-vous' in the letter to la mairie (mon rendez-vous
    may be more natural); lesson04 grammar note's libre (tu) / disponible
    (vous) split is a tendency, not a rule; Cordialement neutral vs formal
    (already flagged). DEFERRED: none.

course:
  realization_key: fr.b2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    informal tu register (the fr lane default, established units01-04) and
    the formal vous register, contrasting them. Each single exercise stays
    in one consistent register; the contrast is carried across exercise
    pairs and the culminating exercise. Informal: tu/te/toi/ton-ta-tes,
    direct imperative + s'il te plaît, "Tu peux...?". Formal: vous/votre-vos
    with the inverted question form (Avez-vous, Pouvez-vous, Pourriez-vous),
    Serait-il possible de..., s'il vous plaît, Madame, Monsieur, Veuillez
    agréer, Madame, Monsieur, l'expression de mes salutations distinguées.
    Inès and Mathieu keep the informal tu they use with each other in
    units01-04.

