          - content_key: fr.b2.unit05.lesson03.exercise06.translate_aide_moi
            type: translation
            tested_text: "Aide-moi, s'il te plaît"
            prompt: {target_blocks: [{text: "Translate into French, informal, addressing Mathieu as tu (imperative): Help me, please.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson03.exercise07.speak_serait_il_possible
            type: speak_response
            tested_text: "Serait-il possible de m'aider"
            prompt: {target_blocks: [{text: "Say aloud in French, formal, addressing la mairie as vous, using Serait-il possible de: Would it be possible to help me?", language_code: en, direction: ltr}]}

      - content_key: fr.b2.unit05.lesson04.le_rendez_vous
        title: "Déplacer le rendez-vous"
        spine_outcome_id: universal.b2.register.adapt_formality_to_audience
        teaching:
          - content_key: fr.b2.unit05.lesson04.teach.rendez_vous
            kind: vocabulary
            target: {text: "le rendez-vous", language_code: fr, direction: ltr}
            introduced_tokens: ["rendez-vous"]
            example: {text: "Le rendez-vous est à dix heures.", language_code: fr, direction: ltr}
