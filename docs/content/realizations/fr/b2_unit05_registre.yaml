          - content_key: fr.b2.unit05.lesson02.teach.veuillez_agreer
            kind: phrase
            target: {text: "Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.", language_code: fr, direction: ltr}
            introduced_tokens: [Veuillez, agréer, "l'expression", de, mes, salutations, distinguées]
          - content_key: fr.b2.unit05.lesson02.teach.cordialement
            kind: vocabulary
            target: {text: "Cordialement", language_code: fr, direction: ltr}
            introduced_tokens: [Cordialement]
            example: {text: "Cordialement, Inès", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit05.lesson02.teach.bonjour
            kind: vocabulary
            target: {text: "Bonjour", language_code: fr, direction: ltr}
            introduced_tokens: [Bonjour]
            example: {text: "Bonjour Madame,", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit05.lesson02.teach.grammar_formules
            kind: grammar_note
            target: {text: "Salut / Coucou ... Bises / À bientôt (informel) ; Bonjour ... Cordialement (registre neutre) ; Madame, Monsieur, ... Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées. (très formel).", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit05.lesson02.exercise01.recognize_madame_monsieur
            type: multiple_choice
            tested_text: "Madame, Monsieur,"
            prompt: {target_blocks: [{text: "Madame, Monsieur,", language_code: fr, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson02.exercise02.listen_cordialement
            type: listen_select
            tested_text: Cordialement
            media_asset_key: fr.b2.unit05.audio.registre.cordialement.01
            prompt: {target_blocks: []}
          - content_key: fr.b2.unit05.lesson02.exercise03.match_openers_closers
            type: matching_pairs
            tested_text: "Salut Coucou Bises À bientôt Madame Monsieur Veuillez agréer Cordialement Bonjour"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Salut / Coucou", right: "informal 'hi'"}
              - {left: Bises, right: "informal closing (love / take care)"}
              - {left: "À bientôt", right: "informal closing (see you soon)"}
              - {left: "Madame, Monsieur,", right: "formal salutation (recipient unknown)"}
              - {left: "Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.", right: "most formal closing (yours faithfully register)"}
              - {left: Cordialement, right: "neutral-professional closing (kind regards)"}
              - {left: Bonjour, right: "neutral 'hello' opener"}
          - content_key: fr.b2.unit05.lesson02.exercise04.order_a_bientot
            type: word_order
            tested_text: "À bientôt Mathieu"
            prompt: {target_blocks: []}
            word_bank: [À, bientôt, Mathieu]
          - content_key: fr.b2.unit05.lesson02.exercise05.translate_madame_monsieur
            type: translation
            tested_text: "Madame, Monsieur,"
            prompt: {target_blocks: [{text: "Write the formal French salutation for a letter to la mairie, whose recipient you don't know by name: Dear Sir or Madam,", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson02.exercise06.write_bises
            type: writing_prompt
            tested_text: "Bises, Inès"
            prompt: {target_blocks: [{text: "Write an informal French sign-off to a friend, from Inès, using the closing that literally means 'kisses'.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit05.lesson02.exercise07.recognize_most_formal
            type: multiple_choice
            tested_text: "Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées."
            prompt: {target_blocks: [{text: "Which closing is the MOST formal?", language_code: en, direction: ltr}]}

      - content_key: fr.b2.unit05.lesson03.direct_ou_poli
        title: "Direct ou poli ?"
        spine_outcome_id: universal.b2.register.adapt_formality_to_audience
        teaching:
