generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    French C1 unit 05 on counterfactual reasoning: the past conditional
    (conditionnel passé), the past unreal conditional (si + plus-que-parfait,
    conditionnel passé), the mixed conditional (si + plus-que-parfait,
    conditionnel présent), and regret. Authored from established French
    discourse conventions, with no sibling-direction overlay consulted.
    Character canon was checked in docs/content/realizations/fr/: Inès is the
    pâtisserie apprentice in Lyon under Monsieur Lefebvre (young woman),
    originally from Lille; Mathieu is her peer and friend, and the two address
    each other with informal tu. This unit keeps that register throughout
    while Inès reflects aloud, to Mathieu, on her past decision to leave Paris
    and take the apprenticeship in Lyon.
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.hypothesis.reason_about_counterfactuals. Verify that
    every counterfactual keeps its time reference straight (plus-que-parfait
    for the past unreal condition, conditionnel passé for the past hypothetical
    result, conditionnel présent for a present consequence), that the regret
    sentence is a genuine regret and not contradicted by the surrounding
    analysis, and that the culminating speaking and writing exercises each
    require the complete act: one past counterfactual, one mixed conditional
    with a present consequence, and one expression of regret. All
    listen/dictation exercises use dedicated single-sentence audio assets with
    tested_text matching the audio text. Past participles agree in gender with
    the female speaker Inès (partie, restée, venue, contente).

course:
