  authoring_system: claude
  human_reviewed: false
  notes: >-
    French C1 unit 01 on structuring an extended spoken or written
    contribution: announcing its direction, developing two linked points,
    making a controlled digression, explicitly returning to the main line,
    and closing with a synthesis. Authored from established French
    discourse conventions, with no sibling-direction overlay consulted.
    Character canon was checked in docs/content/realizations/fr/: Inès is
    the pâtisserie apprentice in Lyon under Monsieur Lefebvre (young
    woman); Mathieu is her peer and friend, and the two address each other
    with informal tu. This unit keeps that register throughout: Inès
    delivers the extended contribution to Mathieu using tu ("je vais te
    présenter mon projet"), never vous.
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.discourse.structure_extended_discourse. Verify that
    every signpost is attributed to its true discourse function (announce vs
    develop vs digress vs return vs conclude), that the two points are
    genuinely linked and the digression is clearly bounded by its return
    signal, and that the culminating speaking and writing exercises each
    require the complete act: preview the direction, develop two linked
    points, digress, return, and close with a synthesis. All
    listen/dictation exercises use dedicated audio assets whose script is
    byte-identical to tested_text; the extended-contribution listening
    exercise uses a dedicated single-voice monologue (Inès) of the full
    contribution, not a shared multi-turn dialogue asset.

    Language review 2026-10-24 (session 10): 0 fixes in the realization (every
    signpost, the conditionals and tu register re-read and correct; the
    monologue stays coherent with the established Inès/Mathieu canon); 4
    accepted-answer additions in the paired overlay -- comma-less variants after
    the signposts (Tout d'abord je vais..., D'une part une nouvelle gamme...)
    for lesson01.exercise05, lesson02.exercise05, lesson04.exercise05 and
    lesson06.exercise05. Native flags: none; "en d'autres termes" is a
    reformulation marker rather than a conclusion marker but is glossed
    correctly.

