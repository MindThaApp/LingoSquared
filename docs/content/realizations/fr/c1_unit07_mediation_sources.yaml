generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    French C1 unit 07 on mediating between sources and audiences: distilling
    two partially conflicting accounts (a town-hall communiqué and a
    shopkeepers' association statement about pedestrianizing the street where
    Inès works) and relaying a synthesis to a non-specialist listener.
    Authored from established French discourse conventions, with no
    sibling-direction overlay consulted. Character canon was checked in
    docs/content/realizations/fr/: Inès is the pâtisserie apprentice in Lyon
    under Monsieur Lefebvre, and Mathieu is her peer and friend; the two
    address each other with informal tu. This unit keeps that register
    throughout — Inès relays the synthesis to Mathieu using tu ("je te
    résume les deux sources"), never vous. The sources themselves are
    reported in third person (la mairie / l'association), which is the
    register of attribution, not a formal-vous slip.
review:
  status: reviewed
  required_next_reviewer: fresh_context_reviewer
  notes: >-
    Targets universal.c1.mediation.mediate_and_synthesize_complex_sources.
    Verify that every claim is attributed to its true source (d'après la
    mairie vs l'association affirme), that the unresolved conflict (whether
    the concertation happened) is preserved rather than resolved, that
    specialist terminology (piétonnisation) is resolved in plain terms for
    the non-specialist listener, and that the culminating speaking and
    writing exercises each require the complete act: condense two sources,
    attribute each claim, preserve the disagreement, resolve terminology,
    and express uncertainty. All listen/dictation exercises use dedicated
    single-voice audio assets whose script is byte-identical to tested_text;
    the full-relay audio is Inès's own single-voice monologue, not a shared
    multi-turn dialogue asset.

course:
  realization_key: fr.c1
  target_language_first: true
  dialect: fr_FR_standard
  register_policy: >-
    Informal tu throughout, matching the established fr-lane canon: Inès and
    Mathieu are workplace peers in Lyon who address each other with tu. No
    formal vous is taught or used in this unit. The two mediated sources are
    third-person reported speech, which is attribution, not register drift.

