  human_reviewed: false
  source_material:
    - name: "established-conventions-only, no genuinely on-topic public-domain source found"
      license: n/a
      usage: >-
        Real attempt made before falling back: firecrawl CLI showed 0/1000
        credits this cycle (as expected -- moved on per standing instruction).
        WebSearch for "FSI French Basic Course mairie / carte de séjour /
        administration / changement d'adresse" and a follow-up search for
        Volume 2's unit topics ("post office" / "police" / "town hall" /
        government office) returned only general FSI download-hub pages and
        confirmed (via a WebFetch of the course's own unit-overview page and
        a second targeted search) that FSI French Basic Course's actual
        situational units cover hotel check-in, train tickets, and shopping
        -- 1960s diplomatic/tourist material, not modern town-hall
        address-registration bureaucracy. No genuinely on-topic public-domain
        source was found for this specific scenario (registering a change of
        address at a French mairie), so this unit is authored from
        established real-world conventions (how a French changement
        d'adresse appointment actually works: pièce d'identité,
        justificatif de domicile, a formulaire, a 30-day customary window)
        rather than adapted from any single source text.
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    First-ever French A2 unit. Opens the Inès storyline's new arc: she has
    just moved to Lyon for a pâtisserie apprenticeship and must register her
    new address at the mairie. Genuine A2 step-up from a1_unit14: formal
    *vous* register throughout (first unit to leave the tu-with-peers
    register), conditional (*j'aimerais*, *Pourriez-vous*, *il faudrait
    que*) and subjunctive (*il faut que*, *avant que*) used naturally for
    the bureaucratic-register scenario, longer multi-clause sentences.
    3 lessons: lesson01 core registration vocabulary, lesson02 the formal
    conditional/subjunctive grammar point (incl. a reading_comprehension on
    a short official notice and a writing_prompt formal message, covering
    the spine outcome's reading/writing assessment requirements), lesson03
    a full dialogue with the mairie clerk (M. Bernard) covering listening
    and speaking. Every kind:vocabulary card carries a real example sentence
    per schema_version 1.1. Not yet fresh-context reviewed. Mathieu does not
    appear in this unit (the scenario is Inès handling her own French
    citizen address-registration errand, not something that naturally
    involves him) -- flagging in case a fresh reviewer expects him per the
    ongoing storyline; he can pick back up in a later A2 unit.

course:
  realization_key: fr.a2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    First unit to shift out of unit01-14's tu-with-peers register: Inès
    addresses the mairie clerk (M. Bernard) with vous throughout, and he
    addresses her with vous in return -- the genuine new formal-register
    skill this unit teaches, paired with the conditional/subjunctive forms
    that register naturally uses.

