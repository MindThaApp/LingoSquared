review:
  status: reviewed
  required_next_reviewer: fresh_context
  notes: >-
    B1 reported-speech unit. Lesson 1 teaches present-tense reporting
    (dire que / demander si + indicatif présent, no backshift needed
    since the reporting verb is present). Lesson 2 teaches concordance
    des temps explicitly: a past reporting verb (a dit que / a demandé
    si) backshifts the reported present to imparfait (est -> était,
    il faut -> il fallait). The culminating exercise requires one
    reported STATEMENT (present tense, dire que) and one reported
    QUESTION (past tense, backshifted demander si) in the same message,
    matching the outcome's can_do ("said that..." and "asked
    whether...") in full.

course:
  realization_key: fr.b1
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Standard metropolitan French. Inès and Mathieu use informal tu with
    each other in peer dialogue.

