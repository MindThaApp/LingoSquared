      usage: >-
        The FSI French Basic Course (used as scaffold for units04-05) has no
        dedicated early-unit "telling time" dialogue -- clock-time
        expressions appear scattered across scheduling contexts rather than
        as their own topic. Rather than force-fit an unrelated FSI dialogue,
        this unit is authored directly from established A1 clock-time
        conventions (il est / heure(s) / et quart / et demie / moins le
        quart), continuing the Inès/Mathieu narrative. Firecrawl remained at
        zero credits this cycle (confirmed once already for unit04); no
        further external search was attempted for this specific unit since
        the topic doesn't map to a distinct FSI unit worth chasing.
