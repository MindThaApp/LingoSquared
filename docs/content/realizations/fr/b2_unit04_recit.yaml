generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Same provenance
    basis as fr b2 units01-03 (no adaptable upper-intermediate
    public-domain French source exists); built from standard French
    grammar knowledge, following the shipped nl B2 tier as the structural
    exemplar (topic scaffold, lesson arc, exercise-type pacing).
    Sibling-isolation honored: no en-fr overlay, no fr-en direction, and
    no other language's B2 file was opened; only fr's own established B1
    character canon (Inès/Mathieu, tu register, pâtisserie setting in
    Lyon) and this course's own units01-03 were consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) that imparfait (background/description) is
    consistently distinguished from passé composé (foreground event)
    throughout, matching the exact contrast this unit teaches; (2) that
    "entrer" correctly conjugates with être in the passé composé
    (est entré) while "casser"/"préparer" correctly conjugate with avoir,
    and that this être/avoir split is clearly enough flagged for an
    English speaker with no equivalent distinction; (3) that the
    plus-que-parfait (avais + past participle) is correctly formed and
    genuinely expresses an event before another past event, not just
    "further in the past" vaguely; (4) confirm the pâtisserie-mishap
    scenario is consistent with Inès's established B1 canon (apprentice
    under Monsieur Lefebvre) and does not contradict any pinned fact.
  notes: >-
    Fourth French B2 unit. Targets the CEFR B2 narrative outcome
    (universal.b2.narrative.recount_complex_events_with_shifting_time):
    recount a complex sequence of events with shifting time reference --
    background versus foreground, events before other past events, and
    interrupted or ongoing actions, keeping the timeline unambiguous.
    Theme: a hectic morning at the pâtisserie -- a calm opening, an
    interrupting event (a customer breaks a cup), and something that had
    already happened beforehand (the dough was already prepared). Lesson
    arc: L01 background/description with imparfait (il était, il faisait,
    il y avait), L02 foreground events with passé composé (soudain, un
    client est entré, il a cassé), L03 interrupted/simultaneous action
    (pendant que + imparfait, quand + passé composé), L04 the
    pre-past with plus-que-parfait (j'avais déjà préparé), L05 a reading
    combining all three time layers with chronology-resolution questions,
    L06 the culminating dialogue where Inès recounts the whole incident to
    Mathieu using all three tenses correctly. Register: informal tu
    throughout (Inès and Mathieu). Cumulative with fr b2 units01-03 within
    the same fr.b2 course (vocabulary accumulates across this course's own
    units per the compiler's multi-file validation order -- confirmed by
    compiling units01-04 together). No sibling-direction file was
    consulted.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked tense teaching (imparfait / passé composé / plus-que-parfait),
    audio scripts vs dialogue cards (all 8 turns correctly attributed),
    comprehension distractors vs the audio, Inès/Mathieu canon,
    course-scoped vocabulary, YAML booleans, jargon/leaks. Fix:
    lesson05.exercise01-04 reading_comprehension prompts showed only the
    English question and never the text -> target_blocks now carry the
    French reading passage (question stays in the overlay instruction).
    NATIVE FLAGS: lesson01.teach.occupe example 'L'après-midi était
    occupé' (chargé may read more naturally for a time period); 'Pendant
    que je préparais les croissants, le téléphone a sonné' vs the more
    idiomatic interruption frame 'Je préparais... quand le téléphone a
    sonné'. DEFERRED: none.

    Second-pass review 2026-10-19: 1 fix -- lesson06.exercise05/06 prompt
    label '(pendant que + passé composé)' was false (the pendant que
    clause is imparfait; the passé composé is the interrupting event) ->
    '(pendant que + imparfait, interrupted by a passé composé)'; mirrored
    in the overlay instructions.

