review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    First French A2 housing unit, one of six new A2 units authored in
    parallel this round. Continues the Inès/Mathieu storyline (Inès has
    just moved to Lyon for a pâtisserie apprenticeship): her new
    apartment's oven breaks the evening before she wants to practice
    recipes at home (a deliberate ironic touch given her trade), and she
    calls her landlord, M. Girard, to report it and arrange a repair
    time. Register shift from a1's peer tu (Mathieu) to formal vous with
    the landlord is the deliberate A2 step-up alongside genuine
    multi-clause sentences, the conditional politeness pattern
    (pourriez-vous / est-ce qu'il serait possible de), and two real
    subjunctive triggers (il faudrait que + vienne, il faut que + soit).
    Scoped to 3 lessons like fr's a1 units. Every kind:vocabulary card
    carries a real example sentence per schema_version 1.1; lesson03
    adds a kind:reading confirmation-note card to cover the outcome's
    reading modality explicitly, alongside the dialogue. Targets
    universal.a2.housing.report_maintenance_problem. Not yet
    fresh-context reviewed. Did not open or reference any other
    language's A2 units while authoring, per AUTHORING_GUIDE.md #8's
    sibling-isolation spirit -- only checked this project's own
    established fr a1/a2 course-block conventions (realization_key,
    dialect, register_policy phrasing) for internal consistency.

course:
  realization_key: fr.a2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Continues the a1 register split: tu between Inès and Mathieu, both
    peers in their early twenties. This unit adds the formal vous
    register for the first time, used throughout with M. Girard, Inès's
    landlord -- an appropriately formal register shift for reporting a
    problem and requesting a repair from someone in that role.

