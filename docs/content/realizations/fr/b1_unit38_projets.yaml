  notes: >-
    B1 plans/intentions/predictions unit. Inès (pâtisserie apprentice
    under Monsieur Lefebvre) talks to Mathieu (her peer/friend, tu
    register) about her upcoming pastry exam. Lesson 1 teaches a fixed
    arrangement (the exam date, present tense) and an intention (avoir
    l'intention de + infinitif). Lesson 2 teaches a prediction with a
    certainty marker (futur simple + probablement) and the full
    dialogue. The culminating exercise requires all three together: a
    fixed plan, an intention, and a prediction with appropriate
    certainty, per universal.b1.future.describe_plans_intentions_and_predictions
    read literally. Canon check: Inès remains a pâtisserie apprentice in
    Lyon under Monsieur Lefebvre; Mathieu remains her peer, tu register
    throughout (matches units 25/28/29/34/37).

    Second-pass review 2026-10-19: 3 fixes — lesson02.exercise01.select_prediction: prompt showed only a French question (with untaught "prédit") and never Inès's words -> shows "Je réussirai probablement, mais je suis un peu nerveuse."; lesson02.exercise05.speak_prediction: prompt printed the full French answer -> prompt is only Mathieu's cue "Tu penses réussir ?"; lesson02.teach.pattern: "prédiction avec certitude" taught that probablement marks certainty -> "prédiction assez sûre".

