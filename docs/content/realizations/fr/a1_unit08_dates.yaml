        remained at zero credits this cycle throughout this whole authoring
        session (confirmed once at the start, see a1_unit04_shopping.yaml's
        provenance note); no further external search was attempted for this
        specific unit since the topic doesn't map to a distinct FSI unit
        worth chasing.
