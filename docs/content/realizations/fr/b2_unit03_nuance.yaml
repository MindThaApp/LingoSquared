            tested_text: "C'est un peu trop sucré"
            prompt: {target_blocks: [{text: "Say aloud in French: It's a bit too sweet.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson01.exercise07.write_il_me_semble
            type: writing_prompt
            tested_text: "Il me semble que le gâteau est un peu trop sucré"
            prompt: {target_blocks: [{text: "Write in French: It seems to me that the cake is a bit too sweet.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson01.exercise08.dictation_claim
            type: dictation
            tested_text: "Le gâteau était un peu trop sucré"
            media_asset_key: fr.b2.unit03.audio.nuance.gateau_sucre.01
            prompt: {target_blocks: []}

      - content_key: fr.b2.unit03.lesson02.formuler_avec_prudence
        title: "Formuler avec prudence"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
