          - content_key: fr.b2.unit03.lesson02.teach.grammar_prudence
            kind: grammar_note
            target: {text: "On dirait que et j'ai l'impression que introduisent une observation prudente, pas un fait certain.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
