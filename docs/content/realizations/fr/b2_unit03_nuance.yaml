schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fr
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. Same provenance
    basis as fr b2 units01-02 (no adaptable upper-intermediate
    public-domain French source exists); built from standard French
    grammar knowledge, following the shipped nl B2 tier as the structural
    exemplar (topic scaffold, lesson arc, exercise-type pacing).
    Sibling-isolation honored: no en-fr overlay, no fr-en direction, and
    no other language's B2 file was opened; only fr's own established B1
    character canon (Inès/Mathieu, tu register) and this course's own
    unit01/unit02 were consulted.
review:
  status: reviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) that the hedging scale (un peu / plutôt / il me
    semble que / on dirait que / légèrement / apparemment) is correctly
    graded from weakest to strongest qualification; (2) that "vraiment"
    reads naturally both as a hedge-negator ("pas vraiment") and as an
    emphasis intensifier ("vraiment excellent") without the dual role
    being confusing -- the grammar note in lesson03 needs a native check;
    (3) that the cleft constructions ("c'est...qui/que", "ce qui...c'est")
    are correctly formed and idiomatic in lesson04; (4) confirm "dommage"
    and "on dirait un bon endroit" read as current everyday spoken French.
  notes: >-
    Third French B2 unit. Targets the CEFR B2 discourse outcome
    (universal.b2.discourse.express_nuance_with_hedging_and_emphasis):
    express nuance -- soften or strengthen a statement (hedging,
    qualification, emphasis, and focus constructions) so the same content
    can be delivered tentatively, neutrally, or emphatically. Theme: a
    review of a new café Inès tried -- one coherent scenario across all
    six lessons that naturally produces both hedged criticism (the cake)
    and emphatic praise (the service), satisfying the spine's
    modulate_a_statement requirement (same claim, delivered both hedged
    and emphasized) directly in lesson06. Lesson arc: L01 softening a
    criticism (un peu / plutôt / il me semble que / pas vraiment /
    assez), L02 more cautious hedges (on dirait que / j'ai l'impression
    que / légèrement / apparemment), L03 emphasis (vraiment / absolument /
    tout à fait / particulièrement), L04 cleft/focus constructions
    (c'est...qui, ce qui...c'est), L05 a review text mixing hedge and
    emphasis, L06 the culminating dialogue requiring the same claim
    delivered once hedged and once emphasized. Register: informal tu
    throughout (Inès and Mathieu). Cumulative with fr b2 units01-02 within
    the same fr.b2 course (vocabulary accumulates across this course's own
    units per the compiler's multi-file validation order -- confirmed by
    compiling units01-03 together). No sibling-direction file was
    consulted.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    checked realization + en-fr overlay for unit03 (answer keys,
    gender/synonym variants, matching-pair discriminability,
    listen/dialogue distractors vs audio, dialogue cards vs audio
    script, Inès/Mathieu canon (café near the pâtisserie --
    consistent), course-scoped token coverage, YAML booleans,
    learner-visible notes). Fixes:
    lesson01.exercise03.match_hedge_words: assez/'quite / rather' pair
    (interchangeable with plutôt/rather) -> trop/'too (much)' in
    pairs, tested_text and overlay value;
    lesson03.exercise03.match_emphasis_words +
    lesson03.teach.tout_a_fait: 'completely / absolutely' (collided
    with absolument/absolutely) -> 'completely / entirely';
    lesson03.teach.grammar_emphase note falsely said absolument/tout à
    fait 'only ever intensify' -> notes pas tout à fait = 'not quite'
    hedges; lesson04.teach.plaire note wrong cross-reference 'manquer
    (unit02)' (manquer is taught in unit01) -> plain 'like manquer';
    lesson06.teach.grammar_recap title/gloss 'Same speaker'
    mistranslated 'Même sujet' -> 'Same topic'; lesson01.exercise05
    accepts 'Le gâteau était assez sucré' (assez glossed 'rather');
    lesson03.exercise05/07 accept 'tout à fait parfait';
    lesson04.exercise05 instruction pinned 'using ce qui...c'est';
    lesson04.exercise06 accepts feminine agreement 'm'a le plus
    impressionnée' (impressionnée introduced, agreement note added on
    lesson04.teach.impressionner); lesson05.exercise01-04
    reading_comprehension prompts now carry the French passage as the
    first target_block. NATIVE FLAGS: example 'Ça va sembler bizarre,
    mais c'est vrai.' ('paraître' more usual); reading glosses key
    'Hier' is capitalized while the other keys are lowercase.
    DEFERRED: none.

    Language review 2026-10-24 (session 10): 1 fix in the realization --
    lesson03.teach.grammar_emphase said vraiment softens or strengthens "selon
    sa position" (wrong: it is the negation in pas vraiment that softens) ->
    "selon le contexte", and "renforcent encore plus fort" -> "encore
    davantage". 3 paired-overlay fixes -- the same wording in the
    grammar_emphase title, gloss and note, and the teach.et_alors note (flat "Et
    alors ?" can sound like "so what?"). Answers to the native-check questions:
    (1) The hedges are graded sensibly: un peu < assez < plutôt for degree, il
    me semble que / j'ai l'impression que = personal opinion, on dirait que =
    observation, légèrement and apparemment = further downtoners; they are not
    one strict scale and the unit does not claim it is. (2) vraiment is one
    adverb; it softens only inside pas vraiment (the negation does the work),
    otherwise it intensifies -- the grammar note is now accurate. (3)
    C'est...qui / ce qui...c'est are correctly formed; "m'a impressionné" needs
    -ée for a woman (already noted on teach.impressionner). (4) "C'est dommage"
    and "On dirait un bon endroit" are current; "Ça a l'air d'être un bon
    endroit" would be the more common phrasing. Native flags: lesson06 Mathieu's
    flat "Et alors ?" (see above; "Et alors, c'était comment ?" is warmer, but
    tested in teaching/audio); "Ça va sembler bizarre" ("paraître" more usual,
    flagged earlier).

