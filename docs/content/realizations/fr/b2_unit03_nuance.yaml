          - content_key: fr.b2.unit03.lesson01.exercise05.translate_plutot_sucre
            type: translation
            tested_text: "Le gâteau était plutôt sucré"
            prompt: {target_blocks: [{text: "The cake was rather sweet.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson01.exercise06.speak_un_peu_trop
