            prompt: {target_blocks: []}
          - content_key: fr.b2.unit03.lesson02.exercise03.match_prudent_words
            type: matching_pairs
            tested_text: "on dirait que j'ai l'impression que légèrement apparemment sembler le service lent"
            prompt: {target_blocks: []}
            pairs:
              - {left: "on dirait que...", right: "it looks like..."}
              - {left: "j'ai l'impression que...", right: "I have the impression that..."}
