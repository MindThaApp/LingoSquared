      - content_key: fr.b2.unit03.lesson05.lire_une_critique
        title: "Lire une critique"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: fr.b2.unit03.lesson05.teach.texte
            kind: reading
            target:
              text: >-
                Hier, j'ai testé un nouveau café près de la pâtisserie. Le
                gâteau était un peu trop sucré, mais il me semble que
                c'est un détail mineur. En revanche, le service était
                vraiment excellent, absolument parfait. Ce qui m'a le
                plus plu, c'est l'ambiance chaleureuse. Je recommande
                particulièrement ce café.
              language_code: fr
              direction: ltr
            introduced_tokens: [hier, "j'ai", testé, nouveau, café, près, détail, mineur, "l'ambiance", chaleureuse, recommande]
        exercises:
          - content_key: fr.b2.unit03.lesson05.exercise01.read_hedge
            type: reading_comprehension
            tested_text: "un peu trop sucré"
            prompt: {target_blocks: [{text: "Hier, j'ai testé un nouveau café près de la pâtisserie. Le gâteau était un peu trop sucré, mais il me semble que c'est un détail mineur. En revanche, le service était vraiment excellent, absolument parfait. Ce qui m'a le plus plu, c'est l'ambiance chaleureuse. Je recommande particulièrement ce café.", language_code: fr, direction: ltr}, {text: "What does the author hedge about the cake?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson05.exercise02.read_qualify
            type: reading_comprehension
            tested_text: "un détail mineur"
            prompt: {target_blocks: [{text: "Hier, j'ai testé un nouveau café près de la pâtisserie. Le gâteau était un peu trop sucré, mais il me semble que c'est un détail mineur. En revanche, le service était vraiment excellent, absolument parfait. Ce qui m'a le plus plu, c'est l'ambiance chaleureuse. Je recommande particulièrement ce café.", language_code: fr, direction: ltr}, {text: "How does the author qualify that criticism?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson05.exercise03.read_emphasis
            type: reading_comprehension
            tested_text: "vraiment excellent"
            prompt: {target_blocks: [{text: "Hier, j'ai testé un nouveau café près de la pâtisserie. Le gâteau était un peu trop sucré, mais il me semble que c'est un détail mineur. En revanche, le service était vraiment excellent, absolument parfait. Ce qui m'a le plus plu, c'est l'ambiance chaleureuse. Je recommande particulièrement ce café.", language_code: fr, direction: ltr}, {text: "What does the author emphasize about the service?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson05.exercise04.read_favorite
            type: reading_comprehension
            tested_text: "l'ambiance chaleureuse"
            prompt: {target_blocks: [{text: "Hier, j'ai testé un nouveau café près de la pâtisserie. Le gâteau était un peu trop sucré, mais il me semble que c'est un détail mineur. En revanche, le service était vraiment excellent, absolument parfait. Ce qui m'a le plus plu, c'est l'ambiance chaleureuse. Je recommande particulièrement ce café.", language_code: fr, direction: ltr}, {text: "What did the author like most?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "hier nouveau café près de détail ambiance"
            prompt: {target_blocks: []}
            pairs:
              - {left: hier, right: yesterday}
              - {left: nouveau, right: new}
              - {left: café, right: café}
              - {left: "près de", right: near}
              - {left: détail, right: detail}
              - {left: "l'ambiance", right: atmosphere}
          - content_key: fr.b2.unit03.lesson05.exercise06.translate_teste
            type: translation
            tested_text: "J'ai testé un nouveau café"
            prompt: {target_blocks: [{text: "I tried a new café.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson05.exercise07.write_recommande
            type: writing_prompt
            tested_text: "Je recommande particulièrement ce café"
            prompt: {target_blocks: [{text: "Write in French: I particularly recommend this café.", language_code: en, direction: ltr}]}

