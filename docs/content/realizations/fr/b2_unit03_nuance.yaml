      - content_key: fr.b2.unit03.lesson01.adoucir_une_critique
        title: "Adoucir une critique"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: fr.b2.unit03.lesson01.teach.un_peu
            kind: vocabulary
            target: {text: "un peu", language_code: fr, direction: ltr}
            introduced_tokens: [un, peu]
            example: {text: "C'est un peu cher.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit03.lesson01.teach.plutot
            kind: vocabulary
            target: {text: "plutôt", language_code: fr, direction: ltr}
            introduced_tokens: [plutôt]
            example: {text: "C'est plutôt bon.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit03.lesson01.teach.il_me_semble_que
            kind: phrase
            target: {text: "il me semble que...", language_code: fr, direction: ltr}
            introduced_tokens: [me, semble]
          - content_key: fr.b2.unit03.lesson01.teach.pas_vraiment
            kind: phrase
            target: {text: "pas vraiment", language_code: fr, direction: ltr}
            introduced_tokens: [vraiment]
          - content_key: fr.b2.unit03.lesson01.teach.assez
            kind: vocabulary
            target: {text: "assez", language_code: fr, direction: ltr}
            introduced_tokens: [assez]
            example: {text: "C'est assez sucré.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit03.lesson01.teach.le_gateau
            kind: vocabulary
            target: {text: "le gâteau", language_code: fr, direction: ltr}
            introduced_tokens: [gâteau]
            example: {text: "Le gâteau est délicieux.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit03.lesson01.teach.etait
            kind: vocabulary
            target: {text: "était", language_code: fr, direction: ltr}
            introduced_tokens: [était]
            example: {text: "Le repas était bon.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit03.lesson01.teach.trop
            kind: vocabulary
            target: {text: "trop", language_code: fr, direction: ltr}
            introduced_tokens: [trop]
            example: {text: "C'est trop sucré.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit03.lesson01.teach.sucre
            kind: vocabulary
            target: {text: "sucré", language_code: fr, direction: ltr}
            introduced_tokens: [sucré]
            example: {text: "Ce dessert est très sucré.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit03.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Le gâteau était un peu trop sucré.", language_code: fr, direction: ltr}
            introduced_tokens: []
          - content_key: fr.b2.unit03.lesson01.teach.grammar_adoucir
            kind: grammar_note
            target: {text: "Un peu, plutôt, assez adoucissent une critique. Il me semble que et pas vraiment font la même chose.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit03.lesson01.exercise01.recognize_sucre
            type: multiple_choice
            tested_text: sucré
            prompt: {target_blocks: [{text: sucré, language_code: fr, direction: ltr}]}
          - content_key: fr.b2.unit03.lesson01.exercise02.listen_claim
            type: listen_select
            tested_text: "Le gâteau était un peu trop sucré"
            media_asset_key: fr.b2.unit03.audio.nuance.gateau_sucre.01
            prompt: {target_blocks: []}
          - content_key: fr.b2.unit03.lesson01.exercise03.match_hedge_words
            type: matching_pairs
            tested_text: "un peu plutôt il me semble que pas vraiment trop le gâteau sucré"
            prompt: {target_blocks: []}
            pairs:
              - {left: "un peu", right: "a bit / a little"}
              - {left: plutôt, right: rather}
              - {left: "il me semble que...", right: "it seems to me that..."}
              - {left: "pas vraiment", right: "not really"}
              - {left: trop, right: "too (much)"}
              - {left: "le gâteau", right: "the cake"}
              - {left: sucré, right: sweet}
          - content_key: fr.b2.unit03.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Le gâteau était un peu trop sucré"
            prompt: {target_blocks: []}
