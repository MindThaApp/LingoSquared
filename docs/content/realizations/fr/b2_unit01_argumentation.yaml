  - content_key: fr.b2.unit01.audio.argumentation.pourtant_avantages.01
    language: fr
    text: "Pourtant, les avantages pèsent plus lourd que les inconvénients."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: fr.b2.unit01.audio.argumentation.dialogue.teletravail.01
    language: fr
    text: >-
      Inès : Je pense que le télétravail est meilleur que le travail au
      bureau. Mathieu : Pourquoi tu penses ça ? Inès : Premièrement, tu
      économises beaucoup de temps de trajet, et une étude montre que les
      télétravailleurs sont plus productifs. Mathieu : De l'autre côté,
      tes collègues te manquent. Inès : C'est vrai, mais cela n'empêche
      pas que tu peux faire des visioconférences. Bref, les avantages
      pèsent plus lourd. Mathieu : Ça se tient.
    voice_hint: young_woman_and_young_man
    status: pending_generation

units:
