            tested_text: "Je pense que le télétravail est meilleur que le travail au bureau"
            media_asset_key: fr.b2.unit01.audio.argumentation.claim_teletravail.01
            prompt: {target_blocks: []}
          - content_key: fr.b2.unit01.lesson01.exercise03.match_claim_words
            type: matching_pairs
            tested_text: "le télétravail le travail au bureau une opinion je pense que selon moi meilleur je suis d'accord"
            prompt: {target_blocks: []}
            pairs:
              - {left: "le télétravail", right: "remote work / working from home"}
              - {left: "le travail au bureau", right: "working at the office"}
              - {left: "une opinion", right: "an opinion"}
              - {left: "Je pense que...", right: "I think that..."}
              - {left: "Selon moi...", right: "In my opinion..."}
              - {left: meilleur, right: better}
              - {left: "Je suis d'accord.", right: "I agree."}
          - content_key: fr.b2.unit01.lesson01.exercise04.order_claim
