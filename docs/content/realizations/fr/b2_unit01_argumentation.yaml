schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: fr
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is fr's first
    B2 unit. The FSI French Basic Course (used as scaffold reference for
    fr's A1/A2/B1 lane) is beginner/lower-intermediate only, the same gap
    nl's first B2 unit documented for Dutch, so this was built from
    standard French grammar/discourse knowledge, following the shipped nl
    B2 tier as the structural exemplar (topic scaffold, lesson arc,
    exercise-type pacing, audio-asset declaration style) per explicit
    dispatch instruction. Sibling-isolation honored: no en-fr overlay, no
    fr-en direction, and no other language's B2 file was opened; only fr's
    own established B1 character canon (Inès/Mathieu, tu register,
    fr_FR_standard_metropolitan) was consulted, which is not a
    sibling-direction violation.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness/idiom of every connective frame
    (d'un côté / de l'autre côté, cela n'empêche pas que, bref, en
    revanche) and that the informal tu register is consistent and
    correctly conjugated throughout; (2) the "manquer" reversed-subject
    construction (tes collègues te manquent) is correctly formed and
    naturally glossed for English speakers, who reliably get this backward
    on first exposure; (3) parce que vs car and the "que" elision before a
    vowel (qu'on) are handled correctly everywhere they appear; (4) the
    culminating writing exercise (lesson06 exercise06) is graded against a
    fixed multi-sentence string -- confirm the accepted-answer punctuation
    variants are complete enough that a correct learner is never marked
    wrong; (5) confirm "télétravailleurs", "visioconférences", and "Ça se
    tient" read as current everyday French.
  notes: >-
    First French B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence): state a
    claim, support it with reasons/evidence, acknowledge the strongest
    opposing point, and rebut it without conceding. Theme: le télétravail
    (remote work) -- one coherent debatable everyday issue across all six
    lessons, mirroring the nl B2 exemplar's topic scaffold with entirely
    fresh French text. Lesson arc mirrors the argument structure itself:
    L01 stating a claim, L02 supporting it (premièrement / par exemple /
    une étude montre que), L03 acknowledging the opposing point (d'un côté
    ... de l'autre côté / bien que / évidemment / c'est vrai), L04
    rebutting without conceding (pourtant / en revanche / cependant / cela
    n'empêche pas que / bref), L05 an argumentative reading text
    (distinguish the author's claim from the objection answered), L06 the
    culminating production -- an Inès/Mathieu debate for the listening
    requirement plus a speaking task and a writing task that each require
    a FULL argument (claim + support + acknowledged objection + rebuttal).
    Register: informal tu throughout; Inès and Mathieu continue their
    established tu register and character canon from the fr B1 lane
    (pâtisserie apprentice / peer, Lyon). All vocabulary is introduced
    self-contained within this file (B2 is a separate Course row from B1,
    so a B2 learner never sees B1 lexemes at runtime -- same
    self-containment precedent as nl's first B2 unit). No sibling-direction
    file was consulted.

course:
  realization_key: fr.b2
  target_language_first: true
  dialect: fr_FR_standard_metropolitan
  register_policy: >-
    Informal tu throughout, consistent with the established fr lane
    register for Inès and Mathieu. B2 argumentation layers discourse
    connectives and signposting onto that register -- premièrement, par
    exemple, d'un côté ... de l'autre côté, pourtant, en revanche, bref --
    while keeping everyday informal address (tu économises, tes
    collègues).

