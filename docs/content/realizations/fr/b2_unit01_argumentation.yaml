      - content_key: fr.b2.unit01.lesson05.lire_un_texte_argumentatif
        title: "Lire un texte argumentatif"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: fr.b2.unit01.lesson05.teach.texte
            kind: reading
            target:
              text: >-
                De plus en plus de gens travaillent à la maison. Je suis
                convaincu que c'est une bonne évolution. Premièrement, tu
                économises beaucoup de temps de trajet, et une étude
                montre que les télétravailleurs sont souvent plus
                productifs. Évidemment, certains disent qu'à la maison,
                tes collègues te manquent. C'est vrai, mais cela n'empêche
                pas que tu peux encore appeler et faire des
                visioconférences. Bref, les avantages pèsent plus lourd
                que les inconvénients.
              language_code: fr
              direction: ltr
            introduced_tokens: [à, la, maison, en, gens, travaillent, convaincu, bonne, évolution, et, télétravailleurs, sont, souvent, productifs, disent, "qu'à", peux, encore, appeler, faire, des, visioconférences]
        exercises:
          - content_key: fr.b2.unit01.lesson05.exercise01.read_claim
            type: reading_comprehension
            tested_text: "une bonne évolution"
            prompt: {target_blocks: [{text: "What is the author's main claim about working from home?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson05.exercise02.read_objection
            type: reading_comprehension
            tested_text: "tes collègues te manquent"
            prompt: {target_blocks: [{text: "Which objection does the author acknowledge before answering it?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson05.exercise03.read_rebuttal
            type: reading_comprehension
            tested_text: "appeler et faire des visioconférences"
            prompt: {target_blocks: [{text: "How does the author answer that objection?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson05.exercise04.read_conclusion
            type: reading_comprehension
            tested_text: "les avantages pèsent plus lourd"
            prompt: {target_blocks: [{text: "What is the author's overall conclusion?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "de plus en plus gens convaincu évolution télétravailleurs visioconférences"
            prompt: {target_blocks: []}
            pairs:
              - {left: "de plus en plus", right: "more and more"}
              - {left: gens, right: people}
              - {left: convaincu, right: convinced}
              - {left: évolution, right: development}
              - {left: télétravailleurs, right: "people who work remotely"}
              - {left: visioconférences, right: "video calls"}
          - content_key: fr.b2.unit01.lesson05.exercise06.translate_convaincu
            type: translation
            tested_text: "Je suis convaincu que c'est une bonne évolution"
            prompt: {target_blocks: [{text: "I am convinced that this is a good development.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson05.exercise07.write_de_plus_en_plus
            type: writing_prompt
            tested_text: "De plus en plus de gens travaillent à la maison"
            prompt: {target_blocks: [{text: "Write in French: More and more people work from home.", language_code: en, direction: ltr}]}

