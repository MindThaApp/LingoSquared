            example: {text: "Ce plan est meilleur.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit01.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Je pense que le télétravail est meilleur que le travail au bureau.", language_code: fr, direction: ltr}
            introduced_tokens: [est]
          - content_key: fr.b2.unit01.lesson01.teach.je_suis_daccord
            kind: phrase
            target: {text: "Je suis d'accord.", language_code: fr, direction: ltr}
            introduced_tokens: [suis, "d'accord"]
          - content_key: fr.b2.unit01.lesson01.teach.grammar_position
            kind: grammar_note
            target: {text: "Je pense que le télétravail est meilleur que le travail au bureau. Je suis d'accord.", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
