          - content_key: fr.b2.unit01.lesson01.exercise05.translate_selon_moi
            type: translation
            tested_text: "Selon moi, le télétravail est meilleur"
            prompt: {target_blocks: [{text: "In my opinion, remote work is better.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson01.exercise06.speak_daccord
