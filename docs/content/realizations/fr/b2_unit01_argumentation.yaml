          - content_key: fr.b2.unit01.lesson06.exercise05.speak_full_argument
            type: speak_response
            tested_text: "Je pense que le télétravail est meilleur que le travail au bureau. Premièrement, tu économises beaucoup de temps de trajet. Évidemment, tes collègues te manquent parfois. Pourtant, les avantages pèsent plus lourd"
            prompt: {target_blocks: [{text: "Defend a position aloud in French with a full argument. Say these four sentences, using premièrement, évidemment and pourtant as signposts: (1) I think remote work is better than working at the office. (2) Firstly, you save a lot of commute time. (3) Of course, you sometimes miss your colleagues. (4) Yet, the advantages weigh heavier.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson06.exercise06.write_full_argument
            type: writing_prompt
            tested_text: "Je pense que le télétravail est meilleur que le travail au bureau. Premièrement, tu économises beaucoup de temps de trajet. Évidemment, tes collègues te manquent parfois. Pourtant, les avantages pèsent plus lourd."
            prompt: {target_blocks: [{text: "Write a full argument in French defending your position. Write these four sentences, using premièrement, évidemment and pourtant as signposts: (1) I think remote work is better than working at the office. (2) Firstly, you save a lot of commute time. (3) Of course, you sometimes miss your colleagues. (4) Yet, the advantages weigh heavier.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit01.lesson06.exercise07.respond_defend
            type: multiple_choice
            tested_text: "Premièrement, tu économises beaucoup de temps de trajet, et une étude montre que les télétravailleurs sont plus productifs"
            prompt: {target_blocks: [{text: "Pourquoi tu penses ça ?", language_code: fr, direction: ltr}]}
