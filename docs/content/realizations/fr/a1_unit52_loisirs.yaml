  text: 'Camille: On se promène souvent ensemble. Mais qu''est-ce que tu fais d''autre pendant ton temps libre, Mathieu ? Mathieu: J''aime cuisiner, même à la maison. Et je fais souvent du sport. Camille: Tu cuisines aussi à la maison ? Tu cuisines déjà toute la journée au travail ! Mathieu: Oui, mais cuisiner, je trouve ça relaxant. Et toi, qu''est-ce que tu aimes faire ? Camille: J''aime lire et j''écoute souvent de la musique. Mathieu: Tu joues aussi aux jeux vidéo ? Camille: Non, je ne joue jamais aux jeux vidéo. Mais je dessine parfois !'
