    B1 summarize-and-retell unit. Inès (pâtisserie apprentice under
    Monsieur Lefebvre) attended a workshop where Monsieur Lefebvre
    explained a bread recipe; she retells it to Mathieu (her peer/friend,
    tu register), who missed the workshop. Lesson 1 teaches the three
    recipe steps (the main points). Lesson 2 teaches "en résumé," and an
    explicit non-important detail (an anecdote), then the dialogue where
    Inès distinguishes the main points from that detail. The culminating
    exercise requires the full condensed, ordered retelling of the three
    main points in one message, per
