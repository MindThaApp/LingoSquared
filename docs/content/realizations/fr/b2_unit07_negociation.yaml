      - content_key: fr.b2.unit07.lesson05.quest_ce_qui_est_regle
        title: "Qu'est-ce qui est réglé ?"
        spine_outcome_id: universal.b2.negotiation.negotiate_and_resolve_disagreement
        teaching:
          - content_key: fr.b2.unit07.lesson05.teach.texte
            kind: reading
            target:
              text: >-
                Inès, voici ce que nous avons décidé. Vous pouvez suivre le
                cours du soir le jeudi, pendant les huit semaines, à
                condition que vous rattrapiez les heures le samedi matin.
                Le dernier jeudi du cours tombe pendant les soldes ; nous
                n'avons pas encore décidé si vous pourrez partir plus tôt
                ce jour-là. Nous en reparlerons la semaine prochaine.
              language_code: fr
              direction: ltr
            introduced_tokens: [voici, avons, décidé, pouvez, dernier, tombe, soldes, encore, pourrez, reparlerons, semaine, prochaine]
        exercises:
          - content_key: fr.b2.unit07.lesson05.exercise01.read_agreed
            type: reading_comprehension
            tested_text: "vous pouvez suivre le cours du soir le jeudi à condition que vous rattrapiez les heures le samedi matin"
            prompt: {target_blocks: [{text: "What has been AGREED for most weeks of the course?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson05.exercise02.read_condition
            type: reading_comprehension
            tested_text: "vous rattrapiez les heures le samedi matin"
            prompt: {target_blocks: [{text: "On what CONDITION is the course approved?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson05.exercise03.read_open
            type: reading_comprehension
            tested_text: "le dernier jeudi du cours tombe pendant les soldes"
            prompt: {target_blocks: [{text: "Which point about the course is still OPEN, not yet decided?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson05.exercise04.read_next_step
            type: reading_comprehension
            tested_text: "nous en reparlerons la semaine prochaine"
            prompt: {target_blocks: [{text: "What will happen about the still-open point?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "voici décidé dernier soldes encore la semaine prochaine"
            prompt: {target_blocks: []}
            pairs:
              - {left: voici, right: "here is"}
              - {left: décidé, right: decided}
              - {left: dernier, right: last}
              - {left: soldes, right: "the sales / clearance sale"}
              - {left: encore, right: "yet / still"}
              - {left: "la semaine prochaine", right: "next week"}
          - content_key: fr.b2.unit07.lesson05.exercise06.translate_pas_encore_decide
            type: translation
            tested_text: "Nous n'avons pas encore décidé"
            prompt: {target_blocks: [{text: "Translate into French: We haven't decided yet.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson05.exercise07.write_reparlerons
            type: writing_prompt
            tested_text: "Nous en reparlerons la semaine prochaine"
            prompt: {target_blocks: [{text: "Write in French: We'll talk about it again next week.", language_code: en, direction: ltr}]}

      - content_key: fr.b2.unit07.lesson06.negocier_en_conversation
        title: "Négocier en conversation"
        spine_outcome_id: universal.b2.negotiation.negotiate_and_resolve_disagreement
        teaching:
          - content_key: fr.b2.unit07.lesson06.teach.le_dimanche
            kind: vocabulary
            target: {text: "le dimanche", language_code: fr, direction: ltr}
            introduced_tokens: [dimanche]
            example: {text: "Le dimanche, la boutique est fermée.", language_code: fr, direction: ltr}
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_ines_propose
            kind: dialogue
            target: {text: "Monsieur Lefebvre, je voudrais vous proposer quelque chose.", language_code: fr, direction: ltr, speaker: Inès}
            introduced_tokens: []
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_lefebvre_ecoute
            kind: dialogue
            target: {text: "Je vous écoute.", language_code: fr, direction: ltr, speaker: Lefebvre}
            introduced_tokens: [écoute]
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_ines_terms
            kind: dialogue
            target: {text: "J'aimerais suivre un cours du soir, le jeudi, pendant huit semaines, pour perfectionner le travail du chocolat. Serait-il possible de partir plus tôt ce jour-là ?", language_code: fr, direction: ltr, speaker: Inès}
            introduced_tokens: []
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_lefebvre_decline_counter
            kind: dialogue
            target: {text: "Je crains que ce ne soit pas possible. Le jeudi soir est notre soir le plus chargé. Et si vous rattrapiez les heures le dimanche ?", language_code: fr, direction: ltr, speaker: Lefebvre}
            introduced_tokens: []
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_ines_decline_concede
            kind: dialogue
            target: {text: "Le dimanche, ça ne serait malheureusement pas possible pour moi. Mais je pourrais les rattraper le samedi matin.", language_code: fr, direction: ltr, speaker: Inès}
            introduced_tokens: [serait]
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_lefebvre_accept
            kind: dialogue
            target: {text: "Dans ce cas, je peux accepter, à condition que ce soit bien le samedi matin, pendant les huit semaines du cours.", language_code: fr, direction: ltr, speaker: Lefebvre}
            introduced_tokens: [cas]
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_ines_conclu
            kind: dialogue
            target: {text: "Marché conclu. Merci beaucoup, Monsieur Lefebvre.", language_code: fr, direction: ltr, speaker: Inès}
            introduced_tokens: [merci, beaucoup]
          - content_key: fr.b2.unit07.lesson06.teach.dialogue_lefebvre_plaisir
            kind: dialogue
            target: {text: "Avec plaisir, Inès.", language_code: fr, direction: ltr, speaker: Lefebvre}
            introduced_tokens: [plaisir, Inès]
          - content_key: fr.b2.unit07.lesson06.teach.grammar_recap
            kind: grammar_note
            target: {text: "Toute la négociation en un mouvement : Inès pose un terme (je voudrais vous proposer), Lefebvre refuse et explique pourquoi (je crains que ce ne soit pas possible... notre soir le plus chargé), une option est écartée (le dimanche, ce ne serait pas possible), puis Inès offre une concession conditionnelle (je pourrais les rattraper le samedi matin) que Lefebvre accepte à condition précise (à condition que ce soit bien le samedi matin, pendant les huit semaines du cours).", language_code: fr, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: fr.b2.unit07.lesson06.exercise01.comprehend_proposal
            type: dialogue_comprehension
            tested_text: "j'aimerais suivre un cours du soir le jeudi pendant huit semaines pour perfectionner le travail du chocolat"
            media_asset_key: fr.b2.unit07.audio.negociation.dialogue.01
            prompt: {target_blocks: [{text: "What does Inès PROPOSE?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson06.exercise02.comprehend_refusal
            type: dialogue_comprehension
            tested_text: "je crains que ce ne soit pas possible le jeudi soir est notre soir le plus chargé"
            media_asset_key: fr.b2.unit07.audio.negociation.dialogue.01
            prompt: {target_blocks: [{text: "What does Lefebvre REFUSE, and why?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson06.exercise03.comprehend_condition
            type: dialogue_comprehension
            tested_text: "à condition que ce soit bien le samedi matin pendant les huit semaines du cours"
            media_asset_key: fr.b2.unit07.audio.negociation.dialogue.01
            prompt: {target_blocks: [{text: "What CONDITION does Lefebvre attach to his agreement?", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson06.exercise04.order_rattraper_samedi
            type: word_order
            tested_text: "Je pourrais les rattraper le samedi matin"
            prompt: {target_blocks: []}
            word_bank: [Je, pourrais, les, rattraper, le, samedi, matin]
          - content_key: fr.b2.unit07.lesson06.exercise05.speak_full_negotiation
            type: speak_response
            tested_text: "J'aimerais suivre un cours du soir le jeudi, pour perfectionner le travail du chocolat. Le dimanche, ça ne serait malheureusement pas possible pour moi, mais je pourrais rattraper les heures le samedi matin"
            prompt: {target_blocks: [{text: "You are Inès, negotiating with Monsieur Lefebvre. In ONE reply (vous register), do all three: STATE your terms (propose the evening course on Thursdays, to perfect chocolate work), DECLINE Sunday as a make-up day (using ça ne serait malheureusement pas possible pour moi), and OFFER A CONDITIONAL CONCESSION (Saturday morning instead).", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson06.exercise06.write_revised_terms
            type: writing_prompt
            tested_text: "Je voudrais vous proposer de rattraper les heures le samedi matin, à condition que ce soit seulement pendant les huit semaines du cours"
            prompt: {target_blocks: [{text: "Write in French (vous register), proposing your terms for the make-up time and attaching a condition to your own concession: I would like to propose making up the hours on Saturday morning, on condition that it's only for the eight weeks of the course.", language_code: en, direction: ltr}]}
          - content_key: fr.b2.unit07.lesson06.exercise07.respond_negotiate
            type: dialogue_response
            tested_text: "Marché conclu. Merci beaucoup, Monsieur Lefebvre"
            prompt: {target_blocks: [{text: "Je peux accepter, à condition que vous rattrapiez les heures le samedi matin.", language_code: fr, direction: ltr}]}
