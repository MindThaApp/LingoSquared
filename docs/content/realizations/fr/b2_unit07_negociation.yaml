    language: fr
    text: "Je peux accepter, à condition que vous rattrapiez les heures le samedi matin."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: fr.b2.unit07.audio.negociation.accord.01
    language: fr
    text: "Marché conclu. Vous partez plus tôt le jeudi, et vous rattrapez les heures le samedi matin, pendant les huit semaines du cours."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: fr.b2.unit07.audio.negociation.dialogue.01
    language: fr
    text: >-
      Inès : Monsieur Lefebvre, je voudrais vous proposer quelque chose.
      Lefebvre : Je vous écoute. Inès : J'aimerais suivre un cours du soir,
      le jeudi, pendant huit semaines, pour perfectionner le travail du
      chocolat. Serait-il possible de partir plus tôt ce jour-là ? Lefebvre :
      Je crains que ce ne soit pas possible. Le jeudi soir est notre soir le
      plus chargé. Et si vous rattrapiez les heures le dimanche ? Inès : Le
      dimanche, ça ne serait malheureusement pas possible pour moi. Mais je
      pourrais les rattraper le samedi matin. Lefebvre : Dans ce cas, je
      peux accepter, à condition que ce soit bien le samedi matin, pendant
      les huit semaines du cours. Inès : Marché conclu. Merci beaucoup,
      Monsieur Lefebvre. Lefebvre : Avec plaisir, Inès.
    voice_hint: young_woman_and_older_man
    status: pending_generation

