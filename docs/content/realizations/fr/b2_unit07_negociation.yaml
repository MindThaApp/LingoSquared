    French text was calqued from the Dutch; every French sentence in this
    file was composed independently from first principles. Sibling-isolation
    honored: no en-fr overlay for THIS unit was opened while drafting the
    realization, no other language's B2 file besides the structural exemplar
    was consulted, and units05/06/08 (authored in parallel by other agents)
    were never seen.

    CANON CORRECTION (important, read before review): the dispatch brief for
    this task assumed Monsieur Lefebvre had never spoken in any committed
    fr unit and asked this file to establish an ASYMMETRIC register (Inès
    vous / Lefebvre tu). That assumption was checked against disk and found
    FALSE: Lefebvre already has committed, REVIEWED dialogue in
    a2_unit20_entretien_embauche.yaml (the hiring interview) and
    b1_unit42_reunions.yaml (status: reviewed) -- both use MUTUAL formal
    vous (Lefebvre asks Inès "avez-vous une suggestion", "proposeriez-vous",
    "Pouvez-vous confirmer", i.e. vous TOWARD Inès, not tu). Per
    AUTHORING_GUIDE.md's canon-check rule ("grep the established character
    profiles before writing any new dialogue" -- a cross-unit
    character-canon violation is explicitly the least catchable bug class,
    no validator or single-file review sees it), this file uses the
    ESTABLISHED mutual-vous professional register instead of the
    dispatch-suggested asymmetric one, to avoid contradicting shipped,
    reviewed content. Both Inès and Lefebvre address each other with vous
    throughout this unit; every vous-conjugated verb form (rattrapiez,
    rattrapez, partez, pouvez, pourrez, etc.) is consistently 2nd-person
    formal in both directions. This deviation is deliberate and should be
    treated as a correction, not a defect.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-French confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) the CANON CORRECTION above -- confirm mutual vous
    (both directions) is indeed the right call given a2_unit20/b1_unit42,
    and that no line anywhere in this file drifts into tu; (2) the
    conditional-concession grammar that is this unit's core teaching point:
    "Si vous rattrapez les heures le samedi matin, alors je pourrais
    accepter" (si + présent, ... conditionnel) and "Je peux accepter, à
    condition que vous rattrapiez les heures le samedi matin" (à condition
    que + subjonctif -- rattrapiez, not rattrapez) in lesson03 -- confirm
    both patterns are correctly formed and that the unit never mixes them
    incorrectly (e.g. "à condition que vous rattrapez" would be wrong); (3)
    "Je crains que ce ne soit pas possible" in lesson02 -- confirm the
    expletive "ne" after craindre que is natural and not overcorrected out;
    (4) cross-check the negotiated facts (§11): the course is chocolate
    work, meets Thursday evenings, runs eight weeks, the clash is that
    Thursday evening is the shop's busiest closing period, Sunday was
    considered and declined (shop closed), and the final agreed make-up
    time is Saturday morning -- confirm these stay identical across every
    lesson and exercise that touches them; (5) confirm the L06 dialogue's
    two consecutive-turn merges (Lefebvre's decline+counter-offer in one
    turn, Inès's decline+concession in one turn) read as natural spoken
    turns, not run-on.
  notes: >-
    Seventh French B2 unit (part of a 4-way parallel dispatch alongside
    units05/06/08, authored independently, never opened by this file).
    Targets the CEFR B2 negotiation outcome
    (universal.b2.negotiation.negotiate_and_resolve_disagreement): negotiate
    an outcome -- propose terms, push back on unacceptable ones, offer a
    conditional concession, and reach or decline an agreement while keeping
    the relationship intact. Theme: Inès wants to enroll in a weekly evening
    course to perfect chocolate work (le travail du chocolat), which meets
    Thursday evenings and would require her to leave the pâtisserie earlier
    that day. Monsieur Lefebvre initially declines the Thursday timing
    (Thursday evening is the shop's busiest closing period); Sunday is
    floated and declined (the shop is closed); the negotiation resolves on
    a conditional concession -- Inès may leave early on Thursdays for the
    eight weeks of the course, provided she makes up the hours on Saturday
    mornings. Lesson arc: L01 making a proposal (je voudrais vous proposer,
    serait-il possible de, j'aimerais), L02 declining politely (je crains
    que ce ne soit pas possible, malheureusement, ça va être compliqué
    parce que), L03 the grammatical heart -- setting/accepting a condition
    (si...alors + conditionnel, à condition que + subjonctif), L04 reaching
    agreement and confirming the final terms (nous sommes d'accord, marché
    conclu), L05 a written note from Lefebvre summarizing what's agreed vs.
    still open, L06 the culminating negotiation dialogue (listening),
    a speak_response requiring the learner to state terms, decline a term,
    and offer a conditional concession in one reply (speaking), and a
    writing_prompt proposing terms with an attached condition (writing).
    Register: mutual formal vous throughout (see CANON CORRECTION above).
    All vocabulary either reuses tokens already introduced_tokens in fr.b2
    units01-04 (validated as part of the same course-scoped compile) or is
    freshly introduced within this file's own lesson progression -- no
    forward references. Dictation quota: exactly 2 (lesson01, lesson04), per
    this unit's own scope. No sibling-direction file and no other parallel
    unit05/06/08 was consulted.

