  notes: 'Drafted by drafting tool A. Grammar target: dire que + clause, demander si / où / quand / à quelle heure / pourquoi, pronoun and possessive shift (je to il, tu to je, mon to son), all in the present (no tense shift, no passé composé in the reported clause). Canon reused: Camille and Mathieu are friends using tu; Camille passes on messages from Mathieu''s neighbour and mother (unnamed minor characters; NEW facts, check against canon). Every exercise token is introduced earlier in this unit. OPEN NATIVE QUESTIONS: (1) ''a téléphoné'' is used only to introduce the message (passé composé already taught in Block A); (2) ''Elle demande où elle peut dormir'' reflexive subject ambiguity (elle = the mother); (3) guillemets and colon spacing for direct speech examples.'
