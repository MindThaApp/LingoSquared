- content_key: fr.a2.audio.dialogue.il_dit_que.01
  language: fr
  text: 'Camille: Mathieu, ton voisin a téléphoné. Mathieu: Ah oui ? Qu''est-ce qu''il dit ? Camille: Il dit que la musique est trop forte. Il demande si tu peux la baisser. Mathieu: Désolé ! Je baisse la musique maintenant. Camille: Et ta mère dit qu''elle arrive samedi. Elle demande où elle peut dormir. Mathieu: Elle peut dormir chez moi. Je l''appelle ce soir.'
  voice_hint: two_young_adults_casual
  status: pending_generation
