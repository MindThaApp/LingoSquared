    cascaded through lesson05.exercise02's tested_text/correct_option/
    distractors/accepted_answers/feedback (both realization and overlay)
    and lesson05.exercise04's matching_pairs pair (both files). Re-ran
    compiler validate after the fix: 0 errors, 0 warnings, confirming the
    edit didn't break compilation. Checked same-speaker
    listen_select/dialogue_comprehension distractors against both
    dialogue transcripts (cooking_keuken.01, cooking_sander.01) -- one
