    tests "what does Omar suggest" (a speech-act distinction) against a
    later factual statement he makes, not two options both correct for
    the same question -- only one answer is actually a suggestion.
    Calendar fact verified by direct computation: 2026-04-26 is a real
    Sunday, consistent with the claimed "+2 days" continuation from
    unit39's Friday 24 April. Recursive YAML boolean-coercion scan found
