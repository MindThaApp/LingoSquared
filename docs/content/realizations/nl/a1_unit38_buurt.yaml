review:
  status: unreviewed
  required_next_reviewer: claude
  notes: >-
    New A1 neighborhood unit (file-numbered unit38, next after unit37),
    realizing a NEW spine outcome
    universal.a1.neighborhood.describe_neighborhood (prerequisite:
    universal.a1.places.locate_common_places, realized in unit08). An
    exact spine_outcome_id diff across all 37 existing nl realization
    files (direct YAML parse of every `id` in universal_spine.yaml
    against every spine_outcome_id/spine_outcome_ids value used anywhere
    in docs/content/realizations/nl/*.yaml, not eyeballed) confirmed all
    33 A1 outcomes and 5 A2 outcomes were already realized by nl -- only
    the two B1 outcomes (abilities, necessity) were unrealized, out of
    scope for this A1 volume-growth task. So one new sensible A1 topic
    was required under the standing delegated spine-authority; checked
    git log first (`git log --oneline -- docs/content/universal_spine.yaml`)
    and confirmed the most recent spine addition was household chores
    (already realized by unit37 the same session), so no other session
    had just added an outcome nl hadn't caught up to yet. "Neighborhood"
    (naming nearby places, neighbors, greeting them) was chosen as a
    natural, commonly-taught A1 topic with no existing spine coverage
    (distinct from universal.a1.places.locate_common_places, which is
    about naming/locating places in general, and from
    universal.a1.housing.describe_home/household.describe_chores, which
    are about the home's own interior, not the surrounding street/
    neighbors) and a clean narrative hook (see below). Sanity-checked
    the new outcome via direct YAML parse: no duplicate id (41 total
    outcomes after adding), valid prerequisite reference, all 4
    modalities present, exactly 4 assessment_requirements with 4
    success_criteria, same shape as every neighboring entry.

    Continues the established Lotte/Omar/Sander/Fenna/Nina taalcafé
    storyline a few days after unit37's household-chores Sunday: Sunday
    19 April 2026 (unit37) + 3 days = Wednesday 22 April 2026
    (calendar-true, confirmed via direct date computation -- both
    weekdays independently verified against the real-world 2026
    calendar). Reuses unit18's already-established fact that Omar's
    apartment is in Utrecht (checked directly: unit18 lesson05/06,
    "Appartement in Utrecht") and unit08's already-taught "de
    supermarkt" as the nearby landmark, introducing no contradicting
    facts. Introduces two brand-new named characters this session:
    Peter (Omar's buurman, a speaking role in lesson04/06) and Anna
    (Omar's buurvrouw, named but non-speaking, mirroring how unit05's
    Jan/Marieke were named without ever becoming speaking characters) --
    checked directly against every existing character name used in nl
    content (Lotte, Omar, Sander, Fenna, Jan, Marieke, Nina, Opa) to
    confirm neither Peter nor Anna collides with an established
    identity. Register is informal jij/je throughout, matching every
    other A1 unit -- every scene is Lotte visiting Omar in Utrecht, the
    same established pair from unit18/unit37, with Peter joining as a
    new speaking role in lesson04/06 only.

    Six lessons, recognition->drag->production pacing (§2): 01 teaches
    "de buurt" (the neighborhood) and "dichtbij" (nearby), plus a
    combined phrase reusing unit08's already-taught "de supermarkt"
    (re-declared as a review token on first use in this file per the
    standing per-file cross-file gotcha -- see below); 02 teaches "de
    buurman" (male neighbor), "kennen" (to know [a person]), and "de
    buurvrouw" (female neighbor), introducing both Peter and Anna by
    name directly on the vocabulary cards' own example sentences (the
    same "introduce a new fact inside the example, not a separate
    fact-only card" pattern already used for unit35/36/37's own new
    words); 03 teaches "vriendelijk" (friendly) and "groeten" (to
    greet), reusing unit21/22's already-taught "heel" (very) and
    unit22's "terug"-precedent register for a natural closing phrase
    ("Peter is vriendelijk en hij groet me graag," reusing unit22/37's
    already-taught "me" object pronoun rather than introducing the
    stressed "mij" form, to avoid adding an eighth new word this unit
    does not need); 04 is a dialogue (still Wednesday 22 April 2026)
    where Lotte meets Peter for the first time in Omar's hallway,
    reusing unit30's already-taught "Leuk je te zien" and unit31/32's
    already-taught "al" (already/al lang = "for a long time") frequency/
    duration precedent; 05 is a reading recapping who Peter and Anna are
    ("Peter is de buurman van Omar en Anna is de buurvrouw van Omar"),
    mirroring unit35/36/37's own "wie is wie" comprehension shape,
    reusing unit15's already-taught possessive "van"; 06 is the wrap-up
    dialogue where Lotte says she likes the neighborhood and Omar/Lotte
    go for coffee, deliberately echoing unit37's own closing "Zullen we
    koffie drinken? / Ja, lekker!" beat as a direct callback rather than
    a coincidence.

    Grammar-scope check: no new tense introduced, present tense
    throughout, matching unit35/36/37's own scope discipline. No new
    grammar point needed a dedicated grammar_note this unit (unlike
    unit37's separable-verb note) -- "kennen" is a regular weak verb
    with no irregularity worth flagging at A1, and the possessive "van"
    construction directly reuses unit15's already-taught preposition
    rather than introducing new grammar.

    Every kind: vocabulary card has a real example built only from
    vocabulary already taught in this unit (or, for common function/
    content words already taught in an EARLIER nl file -- Ik, woon, in,
    een, leuke, Utrecht, de, is, supermarkt, Mijn, heet, goed, heel,
    elke, dag, me, graag, Hoi, ben, Leuk, je, te, zien, al, lang, van,
    kent, Fijn, vind, leuk, Zullen, we, koffie, drinken, Ja, lekker,
    Wie, dat, Hij -- re-declared as review tokens on first use in THIS
    file per the standing cross-file gotcha, since the compiler's
    untaught-vocabulary check accumulates across an entire realization
    FILE, not per-lesson, but resets at each new file). Total new
    nouns/verbs/adjectives taught: de buurt, dichtbij, de buurman,
    kennen, de buurvrouw, vriendelijk, groeten (7) -- within the
    established 6-10 "don't pad" range.

    fill_in_blank deliberately NOT used anywhere in this unit (§13/§17
    checked and consciously avoided rather than force-fit): every
    candidate blank slot in this unit's sentences had at least one
    other taught word that could plausibly fill the same grammatical
    slot (e.g. "Ik ___ Peter goed" could take either "ken" or "groet"
    without breaking the sentence's surface grammar), which is exactly
    the ambiguity §13/§17 warn against -- translation/writing_prompt
    used instead for those production checks.

    Every multi-clause accepted_answers list is authored with
    period-joined, comma-joined, and no-final-period variants per §12
    where the answer is a genuine two-clause utterance (lesson04's
    "Hoi Peter! Ik ben Lotte." response gets four variants: exclamation-
    plus-period, exclamation-no-period, comma-joined-plus-period, and
    comma-joined-no-period); single-clause answers with only an
    internal comma (e.g. "Ja, lekker!", matching unit37's own precedent
    exactly) only get the trailing-period/no-period pair, not a
    fabricated second joining form.

    Matching_pairs pairs checked for duplicate right-hand text within
    each exercise -- no two pairs in any single exercise share
    identical left or right text. All exercises use exactly 6 pairs,
    within the established 6-12 range.

    Grepped this file and its overlay for bare unquoted yes/no/true/
    false/ja/nee values before finalizing (the real German B1
    boolean-coercion bug from earlier this session): the only bare
    Dutch "Ja" tokens are all explicitly double-quoted ("Ja") exactly
    like every prior nl unit's own precedent; no bare "yes"/"no"/
    "true"/"false" (English) appears anywhere in this file. Confirmed
    empirically that PyYAML's default (YAML 1.1) boolean-keyword set
    does NOT include the Dutch "ja"/"nee" tokens at all (only y/yes/n/
    no/on/off/true/false, case-insensitively) -- direct interpreter
    check: `yaml.safe_load("ja")` returns the string `'ja'`, not a
    bool -- so the Dutch words were never actually at risk here, but
    every "Ja" is still quoted anyway to match the codebase's existing
    convention and stay safe against any other/future YAML loader.

    Audio assets declared for generation. Pending fresh-context review
    and Ramin's native-speaker pass.

