    confirming a simple appointment, distinct from unit11's friend plans,
    unit22's basic phone contact, and unit16's health-problem description.
    Story continuity: this happens the next morning after unit44/unit45's
    Tuesday 12 May 2026 fire-alarm and lost-phone sequence. The date was
    verified with Python weekday math: 2026-05-13 is Wednesday. Nina books a
    quiet library computer-help appointment at the desk, with Omar helping.
