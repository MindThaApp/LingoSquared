course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina and
    Omar are established taalcafe friends and use informal jij/je with each
    other. The library staff member speaks in neutral service language; the
    authored exchange avoids formal pronoun production.

