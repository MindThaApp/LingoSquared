  human_reviewed: false
  source_note: >-
    `firecrawl --status` checked first, still at 0/1000 credits this
    cycle (same as unit74/unit73's provenance notes). No FSI/Peace
    Corps course from the 1960s-70s would plausibly contain a
    social-media/screen-time lesson (the concept didn't exist yet), so
    no search attempt was made for this specific unit -- genuinely
    nothing plausible to look for, not a skipped step. This unit is
    `ai_generated` from established modern Dutch conventions: het
    scherm, de schermtijd, sociale media, chatten, een app gebruiken
    are all standard, current, everyday Dutch terms a native speaker
    uses unselfconsciously (schermtijd in particular is a common topic
    in real Dutch parenting/health journalism), not invented or
    calqued from English.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  reviewer_notes: >-
    Fresh-context review 2026-07-11 (AUTHORING_GUIDE §20). All mechanical
    sweeps clean (boolean-coercion type-walk, accepted_answers value-key
    shape, title<200, spine outcome universal.a2.technology.discuss_
    online_habits exists verbatim, no snake_case/jargon in option
    values). Informal jij/je register held consistently across Omar/Lotte
    throughout. listen_select single-line media assets and
    dialogue_comprehension distractors checked at the meaning level --
    no collisions with what the tested speaker says. word_order/
    listen_order word_banks verified for duplicate-token coverage
    (lesson03 ex05 "Ik ... ik" both present). No objective bugs found.
    Systemic flag (applies corpus-wide, matches already-reviewed units
    73/25, NOT unique to this unit): production answers using "zij"
    (ex08 summary) have no "ze" variant, so a learner writing the
    equally-correct "ze" grades incorrect; likewise je/jij. This is the
    established convention across reviewed nl units, so left as-is rather
    than diverging in only these four -- a project-level call for Ramin.
  notes: >-
    Second of four new Dutch A2 units extending beyond
    universal_spine.yaml's original 6 base A2 outcomes. Realizes the
    new universal.a2.technology.discuss_online_habits outcome, added
    to universal_spine.yaml in the same authoring pass as this file.
    Continues the Lotte/Omar storyline as a peer conversation about
    phone and social-media habits -- the same informal-register shape
    as unit25's opinion exchange, and genuinely reuses the
    opinion-with-reason construction (vinden dat, volgens mij, ben het
    mee eens) unit25 already taught, applied to a new topic rather
    than re-teaching the same grammar point from scratch. Follows the
    established 6-lesson A2 pattern and every AUTHORING_GUIDE.md rule:
    recognition-before-production pacing (§2), informal jij/je register
    matching unit25's precedent for a friend-to-friend exchange (§3),
    every vocabulary card carries a real example sentence (§19), every
    fill_in_blank frame keeps visible surrounding text (§13), every
    listen_select/listen_order/dialogue_comprehension media_asset_key
    text cross-checked against its tested_text, and the lesson06
    dialogue's listen_select distractors checked against every line
    the tested speaker (Omar) actually says elsewhere in the same clip.
    Cross-checked facts within the lesson (§11): Lotte's stated screen
    time ("drie uur per dag" in the lesson06 dialogue) is consistent
    with the general "meer dan vier uur per dag" figure in lesson05's
    reading being a population-wide average, not a claim about Lotte
    specifically -- no contradiction, since the reading never states
    Lotte's own figure. Pending the mandatory fresh-context review and
    Ramin's native-speaker pass; not yet compiled or imported.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other throughout
    this unit -- a conversation about personal phone habits between
    friends stays informal, the same convention as unit25's opinion
    exchange.

