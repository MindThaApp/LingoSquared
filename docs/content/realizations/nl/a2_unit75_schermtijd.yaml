  - {content_key: nl.a2.audio.schermtijd.mening_minder.01, language: nl, text: "Volgens mij moet je minder tijd op je telefoon doorbrengen.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a2.audio.schermtijd.blog.01
    language: nl
    text: >-
      Veel mensen gebruiken hun telefoon meer dan vier uur per dag.
      Sociale media zijn leuk, maar te veel schermtijd is niet gezond.
      Probeer elke avond een uur zonder telefoon door te brengen. Dat
      is goed voor je ogen en je slaap.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.schermtijd.omar_vraag.01
    language: nl
    text: "Hoe vaak gebruik jij sociale media, Lotte?"
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.schermtijd.01
    language: nl
    text: >-
      Omar: Hoe vaak gebruik jij sociale media, Lotte? Lotte: Eigenlijk
      best vaak. Ik kijk wel drie uur per dag naar mijn scherm. Omar:
      Dat is best veel. Vind je dat niet te veel? Lotte: Jawel, ik vind
      het eigenlijk te veel. Ik wil minder tijd op mijn telefoon
      doorbrengen. Omar: Misschien kun je 's avonds je telefoon
      wegleggen. Lotte: Goed idee. Dat probeer ik vanaf vandaag.
    voice_hint: two_young_adults_casual
    status: pending_generation

