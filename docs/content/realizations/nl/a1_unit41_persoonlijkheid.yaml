    real traits Omar states elsewhere in the SAME clip but attributed to
    the WRONG person (Sander's "funny" offered as a Lotte distractor and
    vice versa) -- this tests correct speaker/subject attribution, not
    two options both technically correct for the same question, since
    the trait is only ever asserted about one specific person. Calendar
    fact verified by direct computation: 2026-04-28 is a real Tuesday,
    consistent with the claimed "+2 days" continuation from unit40's
