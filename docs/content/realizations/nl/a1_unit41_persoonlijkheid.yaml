    use the correct {left,right}[] shape, all six-pair sets have unique
    left/right text. No snake_case/internal-jargon leaks found in any
    learner-facing string. Dutch read for register/grammar/naturalness:
    the "Ik vind [persoon] [eigenschap]" opinion construction correctly
    reuses the already-taught vind/vinden verb, no issues found.

    New A1 personality unit (file-numbered unit41, next after unit40's
    cooking), realizing a NEW spine outcome
    universal.a1.personality.describe_basic_personality_traits
    (prerequisite: universal.a1.appearance.describe_physical_appearance,
    realized in unit30). An exact spine_outcome_id diff across all 40
    existing nl realization files (direct read of every `id` in
    universal_spine.yaml against every spine_outcome_id/spine_outcome_ids
    value used anywhere in docs/content/realizations/nl/*.yaml, not
    eyeballed) confirmed all 36 A1 outcomes and 5 A2 outcomes were already
    realized by nl -- only the two B1 outcomes (abilities, necessity) were
    unrealized, out of scope for this A1 volume-growth task. So one new
    sensible A1 topic was required under the standing delegated
    spine-authority; checked git log first (`git log --oneline --
    docs/content/universal_spine.yaml`) and confirmed the most recent
    spine addition was cooking (already realized by unit40 the same
    lineage of sessions), so no other session had just added an outcome
