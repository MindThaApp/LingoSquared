    chosen as a natural, commonly-taught A1 topic with no existing spine
    coverage (distinct from universal.a1.appearance.describe_physical_
    appearance, which covers physical traits like height/hair/eyes, and
    from universal.a1.emotions.express_basic_feelings, which covers
    transient feelings with a cause, not a stable character trait) and a
    clean narrative hook: Nina joined the taalcafé friend group at the end
    of unit30 but has never been told what the regulars are actually
    like, so this unit gives her that natural onboarding moment. Sanity-
    checked the new outcome via direct read: no duplicate id (44 total
    outcomes after adding), valid prerequisite reference, all 4 modalities
    present, exactly 4 assessment_requirements with 4 success_criteria,
    same shape as every neighboring entry (built closely off the
    appearance outcome's own shape, the most thematically adjacent
    existing entry).

    Continues the established Lotte/Omar/Sander/Fenna/Nina taalcafé
    storyline two days after unit40's Sunday dinner: Sunday 26 April 2026
    (unit40) + 2 days = Tuesday 28 April 2026 (calendar-true, confirmed
    via direct date computation -- both weekdays independently verified
    against the real-world 2026 calendar). Setting is the taalcafé itself
    (already established across units 29/30/36/38 as the group's regular
    meetup, not a new location). No new characters introduced -- Nina
    (established in unit30, not new) is the one asking, Omar answers.
    Reuses established facts without contradiction (checked directly
    against unit17/unit23/unit30/unit32/unit35/unit36/unit38): Lotte is a
    verpleegkundige (nurse, unit17) who does yoga and "houdt van rustig
    bewegen" (unit32) -- given "aardig" (kind) and "rustig" (calm) here,
    both a natural fit, not new facts about her job/hobbies; Sander takes
    an evening Spanish course (unit35) -- given "grappig" (funny) here, a
    fresh trait that doesn't touch his established study facts; Fenna
    "leert graag nieuwe dingen" (likes learning new things, unit35) --
    given "nieuwsgierig" (curious) here, a direct, non-contradicting
    extension of that established fact; Omar is given "rustig" also
    (shared trait, not exclusive -- realistic, two people can both be
    calm) tied to his now-confident cooking persona (established across
    unit21's initial nervousness resolving into unit29/unit40's calm,
    capable cooking); Nina is given "verlegen" (a little shy) and
    "nieuwsgierig" for herself in the closing lesson -- not contradicting
    unit30's established fact that she confidently greeted Omar first
    ("Nina: Hoi, ben jij Omar?"), since a person can be shy in general
    while still managing a direct greeting to someone she'd heard about
    in advance. Reuses the already-established "Ik vind X Y" opinion
    construction (unit13/unit29, "Ik vind koffie lekker" / "koken vind ik
    ontspannend") productively for personality opinions rather than
    teaching a new grammar point.

    Six lessons, recognition->drag->production pacing (§2): 01 teaches
    "aardig" (kind/nice) and "grappig" (funny) via "Lotte is aardig." /
    "Sander is grappig."; 02 teaches "rustig" (calm, personality sense --
    re-declared per the standing cross-file gotcha since it was taught in
    unit32's own file, in the "calm movement" sense, not automatically
    known in this new file) and "geduldig" (patient), applied to Omar and
    Lotte respectively, plus the question phrase "Hoe is + [naam]?" (What
    is [name] like?), directly parallel to unit30's own "Hoe ziet + [naam]
    + eruit?" pattern; 03 teaches "nieuwsgierig" (curious) and "verlegen"
    (shy), plus an explicit grammar_note on the "Ik vind [persoon]
    [eigenschap]" opinion construction, reusing the already-taught
    vind/vinden verb from unit13/unit29 rather than introducing new
    grammar; 04 is a dialogue (still Tuesday 28 April 2026, at the
    taalcafé) where Nina asks Omar what Lotte and Sander are like; 05 is a
    reading recapping everyone's traits, mirroring unit35-40's own "recap
    what happened" comprehension shape; 06 is the wrap-up dialogue where
    the group turns the question back on Nina, who describes her own
    personality, closing on "Welkom bij ons taalcafé!" (Welcome to our
    language café!) -- a genuinely fresh, natural Dutch closing wish,
    deliberately NOT another "Eet smakelijk!"/"Zullen we ...?" callback
    (unit40's own review note already flagged repeat-callback fatigue as a
    risk to actively avoid).

    Grammar-scope check: no new tense introduced, present tense
    throughout, matching unit35-40's own scope discipline. The "Ik vind
    [persoon] [eigenschap]" construction is the only grammar point given
    an explicit note this unit, and it's a productive reuse of
    already-taught vind/vinden, not a new verb or new tense.

    Every kind: vocabulary teaching card has a real example built only
    from vocabulary already taught in this unit (or, for common
    function/content words already taught in an EARLIER nl file -- Ik,
    is, en, je, jij, we, al, ja, Sander, Omar, Lotte, Fenna, Nina, vind,
    graag, nieuwe, dingen, houdt, van -- re-declared as review tokens on
    first use in THIS file per the standing cross-file gotcha, since the
