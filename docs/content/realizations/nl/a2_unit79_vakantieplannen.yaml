      - content_key: nl.a2.unit79.lesson06.lotte_en_omar_plannen
        title: "Lotte en Omar maken plannen"
        spine_outcome_id: universal.a2.future.announce_plans_and_intentions
        teaching:
          - {"content_key": "nl.a2.unit79.lesson06.teach.lotte_vraag", "kind": "dialogue", "target": {"text": "Hoi Omar! Heb je al plannen voor de zomervakantie?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Hoi", "Omar", "Heb", "je", "al", "plannen", "voor", "de", "zomervakantie"]}
          - {"content_key": "nl.a2.unit79.lesson06.teach.omar_duitsland", "kind": "dialogue", "target": {"text": "Ja! In augustus ga ik naar Duitsland. Ik ga een hotel boeken.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Ja", "In", "augustus", "ga", "ik", "naar", "Duitsland", "Ik", "een", "hotel", "boeken"]}
          - {"content_key": "nl.a2.unit79.lesson06.teach.lotte_met_wie", "kind": "dialogue", "target": {"text": "Leuk! Met wie ga je?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Leuk", "Met", "wie", "ga", "je"]}
          - {"content_key": "nl.a2.unit79.lesson06.teach.omar_oom", "kind": "dialogue", "target": {"text": "Met mijn oom. We gaan een week blijven.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Met", "mijn", "oom", "We", "gaan", "een", "week", "blijven"]}
          - {"content_key": "nl.a2.unit79.lesson06.teach.lotte_later", "kind": "dialogue", "target": {"text": "En later? Wat ben je van plan?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["En", "later", "Wat", "ben", "je", "van", "plan"]}
          - {"content_key": "nl.a2.unit79.lesson06.teach.omar_cursus", "kind": "dialogue", "target": {"text": "Volgend jaar ben ik van plan om een cursus te volgen. En jij?", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Volgend", "jaar", "ben", "ik", "van", "plan", "om", "een", "cursus", "te", "volgen", "En", "jij"]}
          - {"content_key": "nl.a2.unit79.lesson06.teach.lotte_antwoord", "kind": "dialogue", "target": {"text": "Ik ga in juli werken. Misschien ga ik daarna naar mijn ouders.", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Ik", "ga", "in", "juli", "werken", "Misschien", "ik", "daarna", "naar", "mijn", "ouders"]}
        exercises:
