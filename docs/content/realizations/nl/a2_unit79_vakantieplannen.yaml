      - content_key: nl.a2.unit79.lesson05.noors_vakantie_lezen
        title: "Noors vakantie"
        spine_outcome_id: universal.a2.future.announce_plans_and_intentions
        teaching:
          - {"content_key": "nl.a2.unit79.lesson05.teach.noor_bericht", "kind": "reading", "target": {"text": "Hoi Lotte! Binnenkort heb ik vakantie. In augustus ga ik met mijn zus naar België. We gaan een week in een hotel blijven. Daarna ga ik twee dagen naar mijn ouders. Volgend jaar ben ik van plan om een cursus te volgen. Misschien ga ik dan ook verhuizen. Wat ga jij doen?", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Hoi", "Lotte", "Binnenkort", "heb", "ik", "vakantie", "In", "augustus", "ga", "met", "mijn", "zus", "naar", "België", "We", "gaan", "een", "week", "in", "hotel", "blijven", "Daarna", "twee", "dagen", "ouders", "Volgend", "jaar", "ben", "van", "plan", "om", "cursus", "te", "volgen", "Misschien", "dan", "ook", "verhuizen", "Wat", "jij", "doen"]}
        exercises:
          - {"content_key": "nl.a2.unit79.lesson05.exercise01.read_when", "type": "reading_comprehension", "tested_text": "In augustus ga ik met mijn zus naar België", "prompt": {"target_blocks": [{"text": "When does Noor go on holiday?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit79.lesson05.exercise02.read_who", "type": "reading_comprehension", "tested_text": "In augustus ga ik met mijn zus naar België", "prompt": {"target_blocks": [{"text": "Who is Noor going to Belgium with?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit79.lesson05.exercise03.read_where_stay", "type": "reading_comprehension", "tested_text": "We gaan een week in een hotel blijven", "prompt": {"target_blocks": [{"text": "Where is Noor going to stay in Belgium?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit79.lesson05.exercise04.listen_hotel", "type": "listen_select", "tested_text": "We gaan een week in een hotel blijven", "media_asset_key": "nl.a2.audio.vakantieplannen.noor_hotel.01", "prompt": {"target_blocks": []}}
          - {"content_key": "nl.a2.unit79.lesson05.exercise05.match_noor_plans", "type": "matching_pairs", "tested_text": "binnenkort augustus daarna volgend jaar misschien", "prompt": {"target_blocks": []}, "pairs": [{"left": "binnenkort", "right": "has a holiday"}, {"left": "in augustus", "right": "goes to Belgium with her sister"}, {"left": "daarna", "right": "goes to her parents for two days"}, {"left": "volgend jaar", "right": "plans to take a course"}, {"left": "misschien", "right": "may move house"}]}
