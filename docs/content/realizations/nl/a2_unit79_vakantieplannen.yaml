          - {"content_key": "nl.a2.unit79.lesson06.exercise02.comprehend_where", "type": "dialogue_comprehension", "tested_text": "In augustus ga ik naar Duitsland", "media_asset_key": "nl.a2.audio.dialogue.vakantieplannen.01", "prompt": {"target_blocks": [{"text": "Where is Omar going in August?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit79.lesson06.exercise03.comprehend_who", "type": "dialogue_comprehension", "tested_text": "Met mijn oom We gaan een week blijven", "media_asset_key": "nl.a2.audio.dialogue.vakantieplannen.01", "prompt": {"target_blocks": [{"text": "Who is Omar going with?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit79.lesson06.exercise04.comprehend_intention", "type": "dialogue_comprehension", "tested_text": "Volgend jaar ben ik van plan om een cursus te volgen", "media_asset_key": "nl.a2.audio.dialogue.vakantieplannen.01", "prompt": {"target_blocks": [{"text": "What does Omar plan to do next year?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit79.lesson06.exercise05.order_maybe_parents", "type": "word_order", "tested_text": "Misschien ga ik daarna naar mijn ouders", "prompt": {"target_blocks": []}, "word_bank": ["ga", "misschien", "ik", "daarna", "naar", "mijn", "ouders"]}
          - {"content_key": "nl.a2.unit79.lesson06.exercise06.respond_with_uncle", "type": "dialogue_response", "tested_text": "Met mijn oom", "prompt": {"target_blocks": [{"text": "Leuk! Met wie ga je?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit79.lesson06.exercise07.respond_later", "type": "dialogue_response", "tested_text": "Volgend jaar ben ik van plan om een cursus te volgen", "prompt": {"target_blocks": [{"text": "En later? Wat ben je van plan?", "language_code": "nl", "direction": "ltr"}]}}
