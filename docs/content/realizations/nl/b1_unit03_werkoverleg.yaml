schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, same honest-disclosure precedent as
    b1_unit01/02 (firecrawl HTTP 402, no genuine intermediate-level
    Dutch public-domain source found). nl's third B1 unit, self-
    contained independently of units 01/02.
review:
  status: unreviewed
  required_next_reviewer: null
  notes: >-
    Targets formal workplace register: *u* (formal "you", contrasted
    directly with Lotte/Omar's established informal *jij*/*je* from the
    other B1/A2 units), *zou u ... kunnen* as a softened formal request,
    *zou willen voorstellen dat* as a softened formal suggestion, and
    standard meeting-structuring phrases (*als eerste punt*, *zijn er
    nog vragen*). Introduces a new character, meneer Bakker (Lotte's
    manager), specifically to give a real reason to contrast *u* against
    Lotte's own established informal register with Omar elsewhere --
    the same person using both registers with different people is more
    pedagogically honest than inventing entirely separate characters
    who only ever use one register each. No sibling-direction file was
    consulted. All vocabulary, including basic function words, is
    introduced self-contained within this file. Pending the mandatory
    fresh-context review before status: reviewed.

course:
  realization_key: nl.b1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Formal *u*-register throughout, the workplace counterpart to
    unit24_gemeente's bureaucratic *u*-register but for colleague/
    manager speech rather than government-office speech -- softer and
    more collaborative in tone (*zou u kunnen*, *zou willen
    voorstellen*) rather than purely transactional.

