    status: pending_generation
  - content_key: nl.b1.audio.werkoverleg.voorstellen_morgen.01
    language: nl
    text: "Ik zou willen voorstellen dat we morgen beginnen."
    voice_hint: neutral_adult_professional
    status: pending_generation
  - content_key: nl.b1.audio.werkoverleg.eerste_punt.01
    language: nl
    text: "Als eerste punt bespreken we het rapport."
    voice_hint: neutral_adult_professional
    status: pending_generation
  - content_key: nl.b1.audio.werkoverleg.bakker_open.01
    language: nl
    text: "Lotte, zou u het rapport voor vrijdag kunnen afronden?"
    voice_hint: neutral_adult_professional
    status: pending_generation
  - content_key: nl.b1.audio.werkoverleg.dialogue.overleg.01
    language: nl
    text: >-
      Meneer Bakker: Lotte, zou u het rapport voor vrijdag kunnen
      afronden? Lotte: Ja, dat zou moeten lukken. Ik heb nog een paar
      vragen. Meneer Bakker: Natuurlijk, ga je gang. Lotte: Zou ik de
      cijfers van vorige maand kunnen krijgen? Meneer Bakker: Die
      stuur ik u vandaag nog.
    voice_hint: two_adults_neutral_professional
    status: pending_generation

