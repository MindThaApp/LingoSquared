          - {"content_key": "nl.a2.unit93.lesson04.exercise05.fill_regent", "type": "fill_in_blank", "tested_text": "Wanneer het regent neem ik de bus", "prompt": {"target_blocks": [{"text": "Wanneer het ___, neem ik de bus.", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson04.exercise06.tr_honger", "type": "translation", "tested_text": "Als ik honger heb eet ik een broodje", "prompt": {"target_blocks": [{"text": "When I am hungry, I eat a sandwich.", "language_code": "en", "direction": "ltr"}]}}
