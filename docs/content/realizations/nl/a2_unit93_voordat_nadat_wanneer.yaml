      - content_key: nl.a2.unit93.lesson05.een_reisdag
        title: "Een reisdag"
        spine_outcome_id: universal.a2.sequencing.order_events_with_time_clauses
        teaching:
          - {"content_key": "nl.a2.unit93.lesson05.teach.lezen", "kind": "reading", "target": {"text": "Noor gaat morgen met de trein. Voordat ze vertrekt, pakt ze haar koffer in. Nadat ze haar koffer ingepakt heeft, ontbijt ze. Ze gaat naar het station en koopt een kaartje. Voordat de trein vertrekt, drinkt ze koffie. Wanneer ze aankomt, belt ze Lotte.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Noor", "gaat", "morgen", "met", "de", "trein", "Voordat", "ze", "vertrekt", "pakt", "haar", "koffer", "in", "Nadat", "ingepakt", "heeft", "ontbijt", "Ze", "naar", "het", "station", "en", "koopt", "een", "kaartje", "drinkt", "koffie", "Wanneer", "aankomt", "belt", "Lotte"]}
        exercises:
          - {"content_key": "nl.a2.unit93.lesson05.exercise01.lees_voor", "type": "reading_comprehension", "tested_text": "Voordat ze vertrekt pakt ze haar koffer in", "prompt": {"target_blocks": [{"text": "What does Noor do first?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson05.exercise02.lees_ontbijt", "type": "reading_comprehension", "tested_text": "Nadat ze haar koffer ingepakt heeft ontbijt ze", "prompt": {"target_blocks": [{"text": "When does Noor have breakfast?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson05.exercise03.lees_koffie", "type": "reading_comprehension", "tested_text": "Voordat de trein vertrekt drinkt ze koffie", "prompt": {"target_blocks": [{"text": "When does Noor drink coffee?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson05.exercise04.match_lezen", "type": "matching_pairs", "tested_text": "voordat ze vertrekt nadat ze haar koffer ingepakt heeft voordat de trein vertrekt wanneer ze aankomt ze koopt een kaartje ze belt Lotte", "prompt": {"target_blocks": []}, "pairs": [{"left": "voordat ze vertrekt", "right": "before she leaves"}, {"left": "nadat ze haar koffer ingepakt heeft", "right": "after she has packed her suitcase"}, {"left": "voordat de trein vertrekt", "right": "before the train leaves"}, {"left": "wanneer ze aankomt", "right": "when she arrives"}, {"left": "ze koopt een kaartje", "right": "she buys a ticket"}, {"left": "ze belt Lotte", "right": "she calls Lotte"}]}
          - {"content_key": "nl.a2.unit93.lesson05.exercise05.order_noor", "type": "word_order", "tested_text": "Nadat ze haar koffer ingepakt heeft ontbijt ze", "prompt": {"target_blocks": []}, "word_bank": ["nadat", "ze", "haar", "koffer", "ingepakt", "heeft", "ontbijt", "ze"]}
          - {"content_key": "nl.a2.unit93.lesson05.exercise06.tr_koffie", "type": "translation", "tested_text": "Voordat de trein vertrekt drinkt ze koffie", "prompt": {"target_blocks": [{"text": "Before the train leaves, she drinks coffee.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson05.exercise07.dict_vertrekt", "type": "dictation", "tested_text": "Voordat ze vertrekt, pakt ze haar koffer in.", "media_asset_key": "nl.a2.audio.voordat_nadat_wanneer.vertrekt_koffer.01", "prompt": {"target_blocks": []}}
          - {"content_key": "nl.a2.unit93.lesson05.exercise08.dict_ontbijt", "type": "dictation", "tested_text": "Nadat ze haar koffer ingepakt heeft, ontbijt ze.", "media_asset_key": "nl.a2.audio.voordat_nadat_wanneer.koffer_ontbijt.01", "prompt": {"target_blocks": []}}

      - content_key: nl.a2.unit93.lesson06.lotte_en_omar
        title: "Lotte en Omar plannen een reis"
        spine_outcome_id: universal.a2.sequencing.order_events_with_time_clauses
        teaching:
          - {"content_key": "nl.a2.unit93.lesson06.teach.lotte_vertrek", "kind": "dialogue", "target": {"text": "Hoi Omar, hoe laat vertrek je morgen?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Hoi", "Omar", "hoe", "laat", "vertrek", "je", "morgen"]}
          - {"content_key": "nl.a2.unit93.lesson06.teach.omar_koffer", "kind": "dialogue", "target": {"text": "Om negen uur. Voordat ik vertrek, pak ik mijn koffer in.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Om", "negen", "uur", "Voordat", "ik", "vertrek", "pak", "mijn", "koffer", "in"]}
          - {"content_key": "nl.a2.unit93.lesson06.teach.lotte_bel", "kind": "dialogue", "target": {"text": "Bel je mij, nadat je aangekomen bent?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Bel", "je", "mij", "nadat", "aangekomen", "bent"]}
          - {"content_key": "nl.a2.unit93.lesson06.teach.omar_ja", "kind": "dialogue", "target": {"text": "Ja, nadat ik aangekomen ben, bel ik jou.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Ja", "nadat", "ik", "aangekomen", "ben", "bel", "jou"]}
          - {"content_key": "nl.a2.unit93.lesson06.teach.lotte_te_laat", "kind": "dialogue", "target": {"text": "Wat doe je als de trein te laat is?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Wat", "doe", "je", "als", "de", "trein", "te", "laat", "is"]}
          - {"content_key": "nl.a2.unit93.lesson06.teach.omar_koffie", "kind": "dialogue", "target": {"text": "Als de trein te laat is, drink ik koffie.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Als", "de", "trein", "te", "laat", "is", "drink", "ik", "koffie"]}
        exercises:
          - {"content_key": "nl.a2.unit93.lesson06.exercise01.luister_vraag", "type": "listen_select", "tested_text": "Hoi Omar hoe laat vertrek je morgen", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.voordat_nadat_wanneer.dialogue.01"}
          - {"content_key": "nl.a2.unit93.lesson06.exercise02.begrijp_voor", "type": "dialogue_comprehension", "tested_text": "Voordat ik vertrek pak ik mijn koffer in", "prompt": {"target_blocks": [{"text": "What does Omar do before he leaves?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "nl.a2.audio.voordat_nadat_wanneer.dialogue.01"}
          - {"content_key": "nl.a2.unit93.lesson06.exercise03.match_dialoog", "type": "matching_pairs", "tested_text": "hoe laat vertrek je morgen voordat ik vertrek nadat ik aangekomen ben als de trein te laat is bel ik jou pak ik mijn koffer in", "prompt": {"target_blocks": []}, "pairs": [{"left": "hoe laat vertrek je morgen?", "right": "what time are you leaving tomorrow?"}, {"left": "voordat ik vertrek", "right": "before I leave"}, {"left": "nadat ik aangekomen ben", "right": "after I have arrived"}, {"left": "als de trein te laat is", "right": "if the train is late"}, {"left": "bel ik jou", "right": "I call you"}, {"left": "pak ik mijn koffer in", "right": "I pack my suitcase"}]}
          - {"content_key": "nl.a2.unit93.lesson06.exercise04.order_aangekomen", "type": "word_order", "tested_text": "Nadat ik aangekomen ben bel ik jou", "prompt": {"target_blocks": []}, "word_bank": ["nadat", "ik", "aangekomen", "ben", "bel", "ik", "jou"]}
          - {"content_key": "nl.a2.unit93.lesson06.exercise05.antwoord_te_laat", "type": "dialogue_response", "tested_text": "Als de trein te laat is drink ik koffie", "prompt": {"target_blocks": [{"text": "Wat doe je als de trein te laat is?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson06.exercise06.tr_te_laat", "type": "translation", "tested_text": "Als de trein te laat is bel ik Lotte", "prompt": {"target_blocks": [{"text": "Whenever the train is late, I call Lotte.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson06.exercise07.write_twee", "type": "writing_prompt", "tested_text": "Voordat ik vertrek ontbijt ik Nadat ik aangekomen ben bel ik Lotte", "prompt": {"target_blocks": [{"text": "Write exactly two Dutch sentences: (1) Before I leave, I have breakfast, using voordat. (2) After I have arrived, I call Lotte, using nadat.", "language_code": "en", "direction": "ltr"}]}}
