          - {"content_key": "nl.a2.unit93.lesson04.teach.gn_wanneer_regel", "kind": "grammar_note", "target": {"text": "Met wanneer of als vertel je wat steeds gebeurt of wat later gebeurt. Het werkwoord staat achteraan, en de hoofdzin begint met de persoonsvorm.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Met", "wanneer", "of", "als", "vertel", "je", "wat", "steeds", "gebeurt", "Het", "werkwoord", "staat", "achteraan", "en", "de", "hoofdzin", "begint", "met", "persoonsvorm"]}
          - {"content_key": "nl.a2.unit93.lesson04.teach.gn_toen", "kind": "grammar_note", "target": {"text": "Toen ik thuiskwam, belde Lotte. Als ik thuiskom, bel ik Lotte.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Toen", "ik", "thuiskwam", "belde", "Lotte", "Als", "thuiskom", "bel"]}
          - {"content_key": "nl.a2.unit93.lesson04.teach.gn_toen_regel", "kind": "grammar_note", "target": {"text": "Toen gebruik je voor één moment in het verleden. Wanneer of als gebruik je voor een gewoonte of voor het heden.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Toen", "gebruik", "je", "voor", "één", "moment", "in", "het", "verleden", "Wanneer", "of", "als", "een", "gewoonte", "heden"]}
        exercises:
          - {"content_key": "nl.a2.unit93.lesson04.exercise01.kies_moe", "type": "multiple_choice", "tested_text": "Als ik moe ben ga ik vroeg naar bed", "prompt": {"target_blocks": [{"text": "When I am tired, I go to bed early.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson04.exercise02.kies_regent", "type": "multiple_choice", "tested_text": "Wanneer het regent neem ik de bus", "prompt": {"target_blocks": [{"text": "Whenever it rains, I take the bus.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit93.lesson04.exercise03.match_wanneer", "type": "matching_pairs", "tested_text": "wanneer ik moe ben als ik honger heb als het regent wanneer ik naar mijn werk ga als ik thuiskom toen ik thuiskwam", "prompt": {"target_blocks": []}, "pairs": [{"left": "wanneer ik moe ben", "right": "whenever I am tired"}, {"left": "als ik honger heb", "right": "when I am hungry"}, {"left": "als het regent", "right": "when it rains"}, {"left": "wanneer ik naar mijn werk ga", "right": "when I go to work"}, {"left": "als ik thuiskom", "right": "when I get home"}, {"left": "toen ik thuiskwam", "right": "when I got home"}]}
