    language: nl
    text: >-
      Rekening: twee hoofdgerechten en twee koffies. Totaal:
      vijfendertig euro. Betaald met pin.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a1.audio.dialogue.rekening_vragen.01
    language: nl
    text: >-
      Lotte: Zullen we de rekening vragen? Omar: Ja, goed idee.
      Hoeveel kost het in totaal? Lotte: Het is vijfendertig euro.
      Zullen we delen? Omar: Nee, laat mij het vandaag betalen. Jij
      hebt mij zo geholpen. Lotte: Dat is lief van je! Dank je wel.
      Omar: Kan ik hier pinnen?
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

