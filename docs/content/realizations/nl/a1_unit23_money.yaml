schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic payment vocabulary is scaffolded from the FSI Dutch Basic
    Course (Foreign Service Institute, US Department of State --
    public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents these as isolated
    currency-exchange substitution drills reflecting a pre-euro,
    mostly-cash economy, with no continuous scenario; every sentence,
    exercise, and the Lotte/Omar storyline in this unit (paying for a
    celebratory dinner after Omar's good first shift) are freshly
    authored in modern colloquial register (contemporary Dutch card-
    payment culture: pinnen, splitting a bill), not copied or lightly
    edited from any 1960s-70s source text.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Initial six-lesson Dutch money draft (spine outcome:
    universal.a1.money.handle_basic_money_matters), continuing the
    Lotte/Omar storyline -- dinner to celebrate Omar's good first
    shift (unit22). Lessons 1-4's generic price examples (25 euros)
    deliberately use a different amount from lesson05/06's specific
    dinner bill (35 euros) so the two never conflict, per
    AUTHORING_GUIDE §11. Every multi-clause accepted_answers list
    authored with period/comma/conjunction-joined forms per §12. Every
    fill_in_blank frame retains visible surrounding text per §13.
    A fresh-context review ran and found: one exercise (lesson06's
    "asking for the bill" listening exercise) wired to the wrong audio
    clip (it played "Zullen we de rekening delen?", splitting the
    bill -- listed elsewhere in the SAME exercise as a distractor --
    instead of "Zullen we de rekening vragen?") -- fixed with a new
    dedicated audio asset; one matching_pairs exercise tested untaught
    vocabulary ("niet nodig", never introduced -- the unit only
    teaches "geen wisselgeld nodig") -- fixed to match what's actually
    taught; "Wilt u contant of pinnen betalen?" read as awkward/
    redundant since pinnen is itself a full verb, not an adverb
    parallel to contant -- reworded to "Wilt u contant betalen of
    pinnen?" throughout (teaching card, audio, exercises, overlay);
    "twee koffie" pluralized to "twee koffies" to match the correctly-
    pluralized "hoofdgerechten" beside it; two listen-and-type
    exercises' accepted_answers missing the comma-joined variant of an
    exclamation-split answer -- added. No grammar errors, spine drift,
    or jargon leaks found otherwise. Re-validated (0 errors/0 warnings
    across the full nl course, including the real compile step). Still
    needs Ramin's native-speaker pass before status: reviewed. Audio
    assets are declared for generation.

    2026-07-06 density/note-markup pass: merged lesson02's two
    single-word/short vocabulary cards (pinnen, contant betalen) into
    one combined vocabulary card -- lesson02 now has 3 teaching cards
    instead of 4. Every other lesson in this unit already had
    acceptable density (1-3 phrase cards, or only one standalone
    vocabulary card with no sibling to merge with, or a dialogue/
    reading/grammar_note lesson excluded from merging by design), so
    was left unchanged. Also wrapped every inline Dutch word/phrase in
    the overlay's teaching notes in single asterisks per
    AUTHORING_GUIDE §15. Re-validated after both changes, 0 errors/0
    warnings.

    2026-07-07 AUTHORING_GUIDE §16 retrofit (this unit was explicitly
    named one of the worst offenders in a whole-course curriculum
    review, along with units 17/21): all four matching_pairs exercises
    expanded using already-taught vocabulary from that lesson and
    earlier lessons in the unit -- match_total_words (3->5, capped by
    being the unit's first lesson), match_payment_methods (3->6),
    match_bill_words (3->6), match_change_words (3->6). Also found and
    fixed a systemic ungradable-pair bug: ALL FOUR overlay entries were
    missing one of the realization's 3 original pairs each (same bug
    class found repeatedly tonight, but notably consistent across
    every lesson in this one unit). Lesson05 (reading-comprehension)
    is exempt. Re-validated/compiled clean.

    2026-07-07 AUTHORING_GUIDE §19 retrofit (units 21/22/23/24 batch):
    the unit's four vocabulary cards (lesson02's merged
    pinnen_contant, lesson03's rekening, lesson04's wisselgeld,
    lesson05's vijfendertig) gained example sentence(s) built from this
    unit's own taught material; schema_version bumped to 1.1 (missing
    examples are now a hard compiler error for this file). Also found
    and fixed, strictly as a prerequisite for this retrofit: the
    overlay had no teaching entry at all for
    teach.vijfendertig -- added title/gloss/note alongside its new
    example_gloss. Example sentences are Claude-authored and pending
    fresh-context review.

    2026-07-10 fresh-context review (independent scan of nl A1 units
    21-23/29-35): lesson06's dialogue-audio distractors checked
    exhaustively -- clean, including confirming the previously-fixed
    "asking for the bill" listen_select now correctly points at
    rekening_vragen.01 (not the sibling rekening_delen.01 clip). §11
    price-consistency re-checked: lessons 1-2's 25-euro generic example
    and lessons 5-6's 35-euro dinner bill never conflict, as the unit's
    own notes claim. Recursive YAML boolean scan: clean.
    matching_pairs/word_order answer shapes correct. No jargon leaks.
    All exercise `type:` values registered in ExerciseRenderer.tsx.
    Grammar/register read as natural, idiomatic Dutch throughout.
    Batch-compiled with units 21/22/29-35 and the full en-nl course: 0
    errors introduced by this unit. Marking status: reviewed per
    AUTHORING_GUIDE §9.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other; the
    unnamed server/cashier in lessons 2 and 4 is addressed with the
    formal u, the same register distinction introduced in unit01.

