  - {content_key: nl.a1.audio.money.rekening_delen.01, language: nl, text: "Zullen we de rekening delen?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.money.rekening_vragen.01, language: nl, text: "Zullen we de rekening vragen?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.money.wisselgeld.01, language: nl, text: "Hier is uw wisselgeld.", voice_hint: neutral_adult_polite, status: pending_generation}
