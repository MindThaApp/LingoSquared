          - {content_key: nl.a1.unit22.lesson02.exercise02.listen_who_speaking, type: listen_select, tested_text: "Met wie spreek ik", media_asset_key: nl.a1.audio.communication.met_wie_spreek_ik.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit22.lesson02.exercise03.match_phone_identity, type: matching_pairs, tested_text: "Met wie spreek ik U spreekt met bellen", prompt: {target_blocks: []}, pairs: [{left: "Met wie spreek ik?", right: "Who am I speaking with?"}, {left: "U spreekt met Lotte.", right: "You're speaking with Lotte."}, {left: bellen, right: "to call"}, {left: "Ik bel je.", right: "I'll call you."}, {left: "Hallo, met Omar.", right: "Hello, this is Omar."}, {left: "Hallo, met Lotte.", right: "Hello, this is Lotte."}]}
