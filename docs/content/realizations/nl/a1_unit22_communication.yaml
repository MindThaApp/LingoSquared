          - {content_key: nl.a1.unit22.lesson02.exercise05.complete_who_speaking, type: fill_in_blank, tested_text: "Met wie spreek ik", prompt: {target_blocks: [{text: "Met ___ spreek ik?", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit22.lesson02.exercise06.respond_who_speaking, type: dialogue_response, tested_text: "U spreekt met Lotte", prompt: {target_blocks: [{text: "Met wie spreek ik?", language_code: nl, direction: ltr}]}}

      - content_key: nl.a1.unit22.lesson03.kun_je_dat_herhalen
        title: "Kun je dat herhalen?"
        spine_outcome_id: universal.a1.communication.basic_phone_contact
        teaching:
          - {content_key: nl.a1.unit22.lesson03.teach.kun_je_herhalen, kind: phrase, target: {text: "Kun je dat herhalen?", language_code: nl, direction: ltr}, introduced_tokens: [Kun, je, dat, herhalen]}
