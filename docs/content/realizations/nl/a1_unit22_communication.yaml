    language: nl
    text: >-
      Omar: Hoi Lotte, kun je me bellen? Ik moet je iets vertellen.
      Lotte: Ja natuurlijk, ik bel je over vijf minuten terug.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation
  - content_key: nl.a1.audio.dialogue.telefoontje_na_dienst.01
    language: nl
    text: >-
      Omar: Hallo, met Omar. Lotte: Hoi Omar, met Lotte. Omar: Fijn dat
      je belt! Lotte: Hoe was je eerste dienst? Omar: Het ging heel goed,
      beter dan ik dacht. Lotte: Wat fijn om te horen! Ik ben trots op
      je. Omar: Dank je wel, dat betekent veel voor me.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.a1.unit22.communication
    title: "Telefoneren en sms'en"
    section: reading_writing
    spine_outcome_ids: [universal.a1.communication.basic_phone_contact]
    planned_lesson_count: 6
    lessons:
      - content_key: nl.a1.unit22.lesson01.ik_bel_je
        title: "Ik bel je"
        spine_outcome_id: universal.a1.communication.basic_phone_contact
        teaching:
          - content_key: nl.a1.unit22.lesson01.teach.bellen
            kind: vocabulary
            target: {text: "bellen", language_code: nl, direction: ltr}
            introduced_tokens: [bellen]
            example: {text: "Ik moet je bellen.", language_code: nl, direction: ltr}
          - {content_key: nl.a1.unit22.lesson01.teach.ik_bel_je, kind: phrase, target: {text: "Ik bel je.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, bel, je]}
          - {content_key: nl.a1.unit22.lesson01.teach.met_lotte, kind: phrase, target: {text: "Hallo, met Lotte.", language_code: nl, direction: ltr}, introduced_tokens: [Hallo, met, Lotte]}
          - {content_key: nl.a1.unit22.lesson01.teach.met_omar, kind: phrase, target: {text: "Hallo, met Omar.", language_code: nl, direction: ltr}, introduced_tokens: [Hallo, met, Omar]}
        exercises:
          - {content_key: nl.a1.unit22.lesson01.exercise01.choose_calling, type: multiple_choice, tested_text: "Ik bel je", prompt: {target_blocks: [{text: "I'll call you.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit22.lesson01.exercise02.listen_answer_call, type: listen_select, tested_text: "Hallo met Omar", media_asset_key: nl.a1.audio.communication.hallo_met_omar.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit22.lesson01.exercise03.match_call_phrases, type: matching_pairs, tested_text: "bellen met Lotte met Omar", prompt: {target_blocks: []}, pairs: [{left: bellen, right: "to call"}, {left: "Hallo, met Lotte.", right: "Hello, this is Lotte."}, {left: "Hallo, met Omar.", right: "Hello, this is Omar."}, {left: "Ik bel je.", right: "I'll call you."}]}
          - {content_key: nl.a1.unit22.lesson01.exercise04.order_answer_call, type: word_order, tested_text: "Hallo met Omar", prompt: {target_blocks: []}, word_bank: [Omar, Hallo, met]}
          - {content_key: nl.a1.unit22.lesson01.exercise05.listen_order_calling, type: listen_order, tested_text: "Ik bel je", media_asset_key: nl.a1.audio.communication.ik_bel_je.01, prompt: {target_blocks: []}, word_bank: [je, Ik, bel]}
          - {content_key: nl.a1.unit22.lesson01.exercise06.complete_answer_call, type: fill_in_blank, tested_text: "Hallo met Omar", prompt: {target_blocks: [{text: "Hallo, ___ Omar.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit22.lesson01.exercise07.write_calling, type: writing_prompt, tested_text: "Ik bel je", prompt: {target_blocks: [{text: "Write in Dutch: say you'll call someone.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit22.lesson01.exercise08.dictation_ik_bel_je, type: dictation, tested_text: "Ik bel je", media_asset_key: nl.a1.audio.communication.ik_bel_je.01, prompt: {target_blocks: []}}

      - content_key: nl.a1.unit22.lesson02.met_wie_spreek_ik
        title: "Met wie spreek ik?"
        spine_outcome_id: universal.a1.communication.basic_phone_contact
        teaching:
          - {content_key: nl.a1.unit22.lesson02.teach.met_wie, kind: phrase, target: {text: "Met wie spreek ik?", language_code: nl, direction: ltr}, introduced_tokens: [Met, wie, spreek, ik]}
          - {content_key: nl.a1.unit22.lesson02.teach.u_spreekt_met, kind: phrase, target: {text: "U spreekt met Lotte.", language_code: nl, direction: ltr}, introduced_tokens: [U, spreekt, met, Lotte]}
        exercises:
