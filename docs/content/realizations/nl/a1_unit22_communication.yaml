        spine_outcome_id: universal.a1.communication.basic_phone_contact
        teaching:
          - {content_key: nl.a1.unit22.lesson06.teach.lotte_open_call, kind: dialogue, target: {text: "Omar: Hallo, met Omar.", language_code: nl, direction: ltr}, introduced_tokens: [Omar, Hallo, met]}
