          - {content_key: nl.a1.unit22.lesson03.exercise02.listen_hear_badly, type: listen_select, tested_text: "Ik hoor je niet goed", media_asset_key: nl.a1.audio.communication.hoor_je_niet_goed.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit22.lesson03.exercise03.match_clarification_phrases, type: matching_pairs, tested_text: "herhalen snel hoor niet goed bellen wie spreek", prompt: {target_blocks: []}, pairs: [{left: "Kun je dat herhalen?", right: "Can you repeat that?"}, {left: "Spreek niet zo snel.", right: "Don't speak so fast."}, {left: "Ik hoor je niet goed.", right: "I can't hear you well."}, {left: "Met wie spreek ik?", right: "Who am I speaking with?"}, {left: bellen, right: "to call"}, {left: "Ik bel je.", right: "I'll call you."}]}
          - {content_key: nl.a1.unit22.lesson03.exercise04.order_repeat_request, type: word_order, tested_text: "Kun je dat herhalen", prompt: {target_blocks: []}, word_bank: [herhalen, Kun, je, dat]}
          - {content_key: nl.a1.unit22.lesson03.exercise05.complete_speak_slowly, type: fill_in_blank, tested_text: "Spreek niet zo snel alsjeblieft", prompt: {target_blocks: [{text: "Spreek niet zo ___, alsjeblieft.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit22.lesson03.exercise06.translate_repeat_request, type: translation, tested_text: "Kun je dat herhalen", prompt: {target_blocks: [{text: "Can you repeat that?", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit22.lesson04.een_sms_sturen
