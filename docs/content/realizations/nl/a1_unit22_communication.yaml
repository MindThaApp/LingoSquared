target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic telephone-etiquette vocabulary is scaffolded from the FSI
    Dutch Basic Course (Foreign Service Institute, US Department of
    State -- public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents these as isolated
    phone-greeting substitution drills built around a rotary-era
    switchboard scenario, with no continuous scenario; every sentence,
    exercise, and the Lotte/Omar storyline in this unit (Lotte calls
    Omar to hear how his first shift went) are freshly authored in
    modern colloquial register (mobile calls and text messages, not a
    landline switchboard), not copied or lightly edited from any
    1960s-70s source text.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Initial six-lesson Dutch communication draft (spine outcome:
    universal.a1.communication.basic_phone_contact), continuing the
    Lotte/Omar storyline -- Lotte calls Omar after his first shift
    (unit21). Omar's outcome (it went well) is stated consistently in
    lesson06's dialogue only (no earlier lesson pre-states this
    specific outcome, avoiding any AUTHORING_GUIDE §11 fact-consistency
    risk). Every multi-clause accepted_answers list authored with
    period/comma/conjunction-joined forms per §12. Every fill_in_blank
    frame retains visible surrounding text per §13. A fresh-context
    review ran and found: one exercise's accepted_answers missing the
    comma-joined variant of an exclamation-split multi-clause answer
    -- added. No grammar errors, spine drift, jargon leaks, or audio
    mismatches found. Re-validated (0 errors/0 warnings across the
    full nl course, including the real compile step). Still needs
    Ramin's native-speaker pass before status: reviewed. Audio assets
    are declared for generation.

    2026-07-07: a whole-course curriculum review (Fable) flagged
    lesson06 as testing untaught simple past (was/ging/dacht) in
    PRODUCTION exercises (word_order, dialogue_response, writing_
    prompt) -- correct: unit12 ("De gewone gesproken verleden tijd")
    only teaches the perfect tense (hebben/zijn + voltooid deelwoord,
    e.g. "Ik heb gewerkt," "Ik ben gegaan"), a structurally different
    construction from the bare simple-past forms was/ging/dacht used
    here. The overlay's existing notes claiming this "reuses the
    past-tense pattern from unit12" were themselves inaccurate and are
    fixed alongside this. Resolved per the coordinator's first offered
    option (add an explicit recognition note treating these as fixed
    phrases) rather than restructuring the three production exercises
    into comprehension types, since word_order/dialogue_response/
    writing_prompt at this point in the lesson only ever ask the
    learner to reproduce the exact fixed phrases just seen in the
    dialogue (not to freely conjugate any new subject/verb
    combination), and this unit doesn't attempt to teach simple-past
    formation as a productive rule. Added a new grammar_note
    (teach.simple_past_note, positioned right after the dialogue turn
    that introduces ging/dacht, ahead of every exercise) mapping was/
    ging/dacht to their infinitives zijn/gaan/denken; the overlay's
    English gloss/note on this new card explicitly frames them as
    memorize-as-fixed-phrases for now, full past-tense conjugation
    deferred to a later level. Re-validated/compiled clean.

    2026-07-06 density/note-markup pass: reviewed every lesson's
    teaching-card count against the "too many one-word cards" density
    problem found elsewhere in nl A1. No lesson here has two or more
    consecutive single-word vocabulary cards to merge -- each lesson
    has at most one standalone vocabulary card (bellen, sms) alongside
    2-3 already-multi-word phrase cards, or is a dialogue/reading/
    grammar_note lesson (excluded from merging by design) -- so no
    teaching-card merges were made. Wrapped every inline Dutch word/
    phrase in the overlay's teaching notes in single asterisks per
    AUTHORING_GUIDE §15. Re-validated, 0 errors/0 warnings.

    2026-07-07 AUTHORING_GUIDE §16 retrofit: lesson02's
    match_phone_identity (2->6), lesson03's match_clarification_phrases
    (3->6), and lesson04's match_message_words (3->6) expanded using
    already-taught vocabulary from those lessons and lesson01. Also
    found and fixed a real ungradable-pair bug while touching
    match_message_words: the overlay was missing one of the
    realization's original 3 pairs (same bug class found repeatedly
    tonight). Lesson01 (already 4 pairs) and lesson05 (reading-
    comprehension) left untouched. Re-validated/compiled clean.

    2026-07-07 AUTHORING_GUIDE §19 retrofit (units 21/22/23/24 batch):
    the unit's two vocabulary cards (lesson01's bellen, lesson04's sms)
    gained example sentence(s) built from this unit's own taught
    material; schema_version bumped to 1.1 (missing examples are now a
    hard compiler error for this file). Example sentences are
    Claude-authored and pending fresh-context review.

    2026-07-10 fresh-context review (independent scan of nl A1 units
    21-23/29-35): lesson06's dialogue-audio distractors checked
    exhaustively against the same-speaker-distractor bug class -- clean,
    every distractor is either the other speaker's line or invented, not
    a line the tested speaker also says elsewhere in this clip.
    Recursive YAML boolean scan: clean. matching_pairs/word_order answer
    shapes correct. No jargon leaks. All exercise `type:` values
    registered in ExerciseRenderer.tsx. Grammar/register read as
    natural, idiomatic Dutch throughout (including the simple-past
    was/ging/dacht fixed-phrase framing from the 2026-07-07 fix above,
    which correctly avoids overclaiming productive conjugation).
    Batch-compiled with units 21/23/29-35 and the full en-nl course: 0
    errors introduced by this unit. Marking status: reviewed per
    AUTHORING_GUIDE §9.

    Language review 2026-10-20 (session 9, en-nl): 4 fixes in the realization -- dialogue.telefoontje_na_dienst asset text and teach cards lesson06.teach.lotte_open_call / omar_answer_glad reordered so the callee (Omar) answers first and Lotte, the caller, identifies herself; lesson06.exercise01.listen_open_call tested_text now Hallo met Omar (matches asset); (4 fixes in the en-nl overlay). Practice file practice/en-nl/a1_unit22.yaml references this asset by key only and was not touched; if it quotes the old opening line it needs a follow-up. NATIVE FLAGS: none.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other; the
    unfamiliar-caller phone convention in lesson02 uses the formal u,
    the same register distinction introduced in unit01.

