generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, same honest-disclosure precedent as
    b1_unit01 (firecrawl HTTP 402, no genuine intermediate-level Dutch
    public-domain source found). nl's second B1 unit, self-contained
    independently of b1_unit01 -- the compiler validates each
    realization/overlay pair separately, so no vocabulary is assumed
    carried over from unit01.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Steps up from the A2 opinions unit (a2_unit25_meningen.yaml,
    universal.a2.opinions.give_opinions_with_reasons) to genuine B1
    nuance: concessive subordinators *hoewel* and *ondanks dat*
    ("although"/"despite the fact that"), and stronger written-register
    contrast connectors *toch*/*echter* ("still/nevertheless"/"however")
    that trigger V2 inversion when they open a clause, plus
    *enerzijds...anderzijds* ("on one hand...on the other hand") as a
    capstone. Continues Lotte and Omar's storyline and informal jij/je
    register with a new topic (eating less meat) chosen specifically to
    avoid restating a2_unit25's own bike-path facts. No sibling-
    direction file was consulted. All vocabulary, including basic
    function words, is introduced self-contained within this file.
    Fresh-context review 2026-07-11: fixed one real YAML
    boolean-coercion bug (lesson04 matching pair `right: true`,
    unquoted, silently became the Python boolean True -- the exact
    compiler-gap footgun documented in CLAUDE.md); overlay-side fixes
    (an authoring artifact shipped as a literal distractor, and a
    distractor referencing a character not in this unit) recorded in
    the overlay's own review notes. Dutch text verified natural,
    hoewel/ondanks dat/toch/echter usage and V2 inversion correct.

    Language review 2026-10-20 (session 9, en-nl): 0 fixes in the
    realization; (8 fixes in the en-nl overlay). NATIVE FLAGS: ondanks dat
    as a conjunction (prescriptive guides prefer ondanks het feit dat);
    echter placement.

course:
  realization_key: nl.b1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Continues Lotte and Omar's established informal jij/je register.
    *Hoewel*/*ondanks dat*/*toch*/*echter* are neutral-to-slightly-
    written-register connectors used in both speech and writing among
    Dutch speakers discussing a real opinion, not formal/bureaucratic
    register (contrast with unit24_gemeente's *u*-register).

