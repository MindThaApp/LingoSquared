course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Use jij/je
    as the normal informal address among peers and in many everyday settings;
    use u where respectful distance or an explicitly formal relationship makes
    it natural. Keep each exercise's register explicit and preserve the
    corresponding verb form.

