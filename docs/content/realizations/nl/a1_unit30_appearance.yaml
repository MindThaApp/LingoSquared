    agreement notes are accurate). Batch-compiled with units 21-23/29/
    31-35 and the full en-nl course: 0 errors introduced by this unit.
    Marking status: reviewed per AUTHORING_GUIDE §9.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte,
    Omar, and new taalcafé member Nina all use informal jij/je throughout
    this unit -- no formal u appears, matching every other A1 unit's
    register_policy. Distinguish general appearance adjectives (lang,
    klein, oud, jong) from the same words' other established senses
    (numeric age, object length/size) with explicit grammar_notes rather
    than silently overloading them.

