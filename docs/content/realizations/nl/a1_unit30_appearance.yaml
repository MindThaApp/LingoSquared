  notes: >-
    New A1 appearance unit (file-numbered unit30, the highest-numbered file
    in the nl corpus so far, appended as the A1 course's next unit after
    unit29 in scripts/content_manifest.txt's en-nl line -- the number jump
    reflects file-numbering across the whole corpus, not a level change;
    this unit is still A1, same course as units 1-23/29), realizing the new
    spine outcome universal.a1.appearance.describe_physical_appearance
    (prerequisite: universal.a1.family.describe_relationships, realized in
    unit05). Genuinely new volume growth, not a retrofit -- authored fresh
    at schema_version 1.1 from the start per AUTHORING_GUIDE §19, every
    kind: vocabulary card carries a real example from day one.

    Continues the established storyline directly: rather than inventing
    unnamed characters, this unit describes the ACTUAL people unit05
    (family) and unit29 (hobbies) already established -- Lotte (siblings
    Sander/Fenna, parents Jan/Marieke, grandparents in Rotterdam), Omar
    (parents in Egypte, uncle in Amsterdam, established in unit29 as
    someone who cooks often and exercises often), Sander, Fenna, and Opa.
    A brand-new taalcafé member, Nina, is introduced in lesson04/06 as the
    one genuinely new character -- required by the outcome's own
    communicative point (describing someone so another person can
    recognize them), which only works for someone Omar hasn't already met.
    Register is informal jij/je throughout, matching every prior A1 unit
    and the Lotte/Omar/Nina taalcafé dynamic -- no formal u appears.

    No physical-appearance facts existed anywhere in the corpus before this
    unit for any of these characters, so every fact below is freshly
    established here and cross-checked for INTERNAL consistency (AUTHORING_
    GUIDE §11) across all six lessons -- no two people share an identical
    full hair-description (length+color), avoiding any risk of a
    matching_pairs exercise pairing two visually-identical answer tiles:
    - Lotte: lang blond haar, blauwe ogen.
    - Omar: kort zwart haar, bruine ogen; already established (unit29) as
      a young adult -- reused here as the "jong" example rather than
      inventing a new fact.
    - Sander (Lotte's brother): klein, kort bruin haar, bruine ogen.
    - Fenna (Lotte's sister): lang (taller than Sander, the direct
      lesson05 comparison pair), lang bruin haar, groene ogen.
    - Opa (Lotte's grandfather, established unit05 living in Rotterdam,
      already established there as extremely old -- oma is
      negenennegentig jaar): oud, grijs haar -- a natural continuity
      callback, not a new invented trait.
    - Nina (new taalcafé member, lesson04/06 only): klein, kort blond
      haar, groene ogen.
    Sander and Omar share bruine ogen; Fenna and Nina share groene ogen --
    both are realistic shared traits between DIFFERENT people never
    listed together in the same matching_pairs exercise, so no tile-
    duplication risk (see below).

    Six lessons, recognition->drag->production pacing throughout (§2):
    01 teaches lang/klein (general height impression) and oud/jong
    (general age impression, WITH a grammar_note distinguishing this from
    unit02's numeric "Hoe oud ben je?" -- a real risk flagged by the task
    brief, resolved by making the distinction explicit rather than
    silently overloading the same word); 02 teaches haar (the noun) plus
    hair-color vocabulary (blond, bruin, grijs -- new; zwart reused from
    unit20 clothing) and hair-length (kort -- new; lang reused from
    lesson01), with a grammar_note on the real Dutch homonym *haar*
    (hair, this lesson) vs *haar* (her, unit05's possessive) so learners
    aren't blindsided later; 03 teaches eye-color vocabulary (groen --
    new; blauw reused from unit20, bruin reused from lesson02) plus the
    outcome's core question Hoe ziet ... eruit?; 04 is a taalcafé dialogue
    where Lotte describes new member Nina to Omar so he can recognize her
    (the outcome's own "ask/describe for a real purpose" scenario) --
    deliberately kept in present tense throughout, avoiding any past-tense
    drift per §1 scope discipline; 05 is a reading comparing Sander and
    Fenna's appearance, explicitly reusing unit14's already-taught
    comparative pattern (adjective + er + dan) applied to people for the
    first time, ending with the outcome's "ask someone about theirs"
    requirement; 06 is a short wrap-up dialogue where Omar actually
    recognizes Nina at the taalcafé using Lotte's lesson04 description,
    closing the loop.

    Every kind: vocabulary card has a real example built only from
    vocabulary already taught in this unit or earlier, reusing established
    characters throughout (list-shaped, one sentence per member, for every
    merged card). Total new adjectives taught: lang, klein, oud, jong,
    kort, blond, bruin, grijs, groen (9), plus zwart/blauw reused from
    unit20 -- within the "6-10, don't pad" range the task specified,
    genuinely supported by real vocabulary, not padded.

    fill_in_blank ambiguity (§13/§17) was checked carefully per the task's
    specific warning about lang/kort and oud/jong: blanking any of these
    adjectives directly (e.g. "Opa is ___") would be genuinely ambiguous,
    since BOTH members of each taught pair are grammatically valid
    completions and only one is factually correct per this unit's own
    established facts -- exactly the risk class §17 warns against for
    fill_in_blank (no true synonymy, but no in-frame disambiguation
    either, unlike unit14's comparative case below). Resolved by NOT
    authoring any fill_in_blank on these adjective pairs at all: lesson01
    uses a translation exercise for its production slot instead. Lessons
    02 and 03's fill_in_blank instead blank a structural noun/particle
    with only one sensible completion given the surrounding taught
    vocabulary (haar in "Lotte heeft lang blond ___", eruit in "Hoe ziet
    Lotte ___?") -- matching unit29's own resolution of the identical risk
    class (blanking boek/vrienden/vrije rather than the interchangeable
    hobby verbs/frequency adverbs). Lesson05's comparative sentences
    ("Fenna is langer dan Sander") were NOT given a fill_in_blank either
    (that lesson uses reading_comprehension/matching/listen_select/
    writing_prompt only, mirroring unit29 lesson05's own reading-lesson
    shape exactly) -- had one been authored, blanking the comparative
    adjective itself would actually have been safe by the SAME logic
    unit14 already shipped (a single factually-correct comparative given
    an established fact, not a free choice between synonyms), but it
    wasn't needed here. Lessons 04 and 06 (dialogue lessons) have no
    fill_in_blank at all, again matching unit29's own lesson04/06 shape.

    Every multi-clause accepted_answers list (lesson05's write_own_and_ask,
    lesson06's write_two_people) is authored with period-joined,
    comma-joined, and conjunction-joined variants per §12.

    Matching_pairs pairs pool forward within each exercise and were
    checked for duplicate right-hand text (a real risk this unit's shared
    traits -- Sander/Omar's bruine ogen, Fenna/Nina's groene ogen --
    could have caused, since two visually-identical tiles in the same
    exercise would make a learner's correct-looking swap grade as wrong):
    lessons01-03 use word/phrase-to-translation pairs plus a handful of
    unique full example sentences (6-8 pairs each); lesson05's 4-pair
    exercise (the reading-comprehension structural exemption, matching
    unit29's own precedent) uses full per-person summary strings, each
    one unique in total even where individual words overlap. No two
    pairs in any single exercise share identical left or right text.

    Audio assets are declared for generation. Pending fresh-context review
    and Ramin's native-speaker pass.

    2026-07-10 fresh-context review (independent scan of nl A1 units
    21-23/29-35, this unit's first real independent review since
