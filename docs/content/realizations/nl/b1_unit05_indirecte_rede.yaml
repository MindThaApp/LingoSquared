schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, same honest-disclosure precedent as
    b1_unit01/02/03/04 (firecrawl HTTP 402, no genuine intermediate-
    level Dutch public-domain source found). nl's fifth B1 unit, self-
    contained independently of units 01-04.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Targets Dutch reported/indirect speech: *zei dat* (reporting a
    statement, present-to-past tense shift), reported future using
    *zou* + infinitive (the same conditional-mood word taught for
    hypotheticals in b1_unit01, now doing double duty as the reported-
    future tense-shift marker -- flagged as a real cross-grammar
    connection in lesson02's note even though the token itself is
    re-taught fresh in this self-contained file), *vroeg of* (reporting
    a yes/no question, tense-shifted modal *kon*), and *vroeg wat/
    wanneer* (reporting a wh-question) at the wrap-up. Continues Lotte
    and Omar's storyline (with a new character, Sara, as the person
    Lotte reports Omar's call to) and informal jij/je register. No
    sibling-direction file was consulted. All vocabulary, including
    basic function words, is introduced self-contained within this
    file. Fresh-context review 2026-07-11: Dutch verified natural and
    grammatical (zei dat + backshift, zou reported future, vroeg of +
    tense-shifted kon all correct); Sara consistent with her b1_unit04
    introduction. Overlay-side fixes (one fragile listen_select
    distractor that was a defensible alternate translation of the
    correct audio, missing ze/zij accepted-answer variants) recorded
    in the overlay's own review notes.

course:
  realization_key: nl.b1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Continues Lotte and Omar's established informal jij/je register.

