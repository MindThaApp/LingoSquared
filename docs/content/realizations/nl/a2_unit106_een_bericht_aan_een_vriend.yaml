          - {"content_key": "nl.a2.unit106.lesson06.teach.lotte_plan", "kind": "dialogue", "target": {"text": "Wat leuk! En wat ga je volgende week doen?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Wat", "leuk", "En", "ga", "je", "volgende", "week", "doen"]}
          - {"content_key": "nl.a2.unit106.lesson06.teach.omar_oom", "kind": "dialogue", "target": {"text": "Ik ga mijn oom in Amsterdam bezoeken, omdat ik tijd heb.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Ik", "ga", "mijn", "oom", "in", "Amsterdam", "bezoeken", "omdat", "tijd", "heb"]}
          - {"content_key": "nl.a2.unit106.lesson06.teach.lotte_bellen", "kind": "dialogue", "target": {"text": "Gezellig! Ik zal je bellen. Tot snel!", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Gezellig", "Ik", "zal", "je", "bellen", "Tot", "snel"]}
        exercises:
          - {"content_key": "nl.a2.unit106.lesson06.exercise01.luister_vraag", "type": "listen_select", "tested_text": "Hoi Omar hoe was je weekend", "media_asset_key": "nl.a2.audio.dialogue.een_bericht_aan_een_vriend.01", "prompt": {"target_blocks": []}}
          - {"content_key": "nl.a2.unit106.lesson06.exercise02.begrijp_oom", "type": "dialogue_comprehension", "tested_text": "Ik ga mijn oom in Amsterdam bezoeken omdat ik tijd heb", "media_asset_key": "nl.a2.audio.dialogue.een_bericht_aan_een_vriend.01", "prompt": {"target_blocks": [{"text": "Why is Omar going to visit his uncle?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit106.lesson06.exercise03.match_onderdelen", "type": "matching_pairs", "tested_text": "Hoi Lotte Ik ben gisteren naar het feestje gegaan Morgen ga ik naar de dierentuin want ik heb tijd Groetjes Omar Bedankt voor je bericht", "prompt": {"target_blocks": []}, "pairs": [{"left": "Hoi Lotte,", "right": "opening"}, {"left": "Ik ben gisteren naar het feestje gegaan.", "right": "what happened"}, {"left": "Morgen ga ik naar de dierentuin.", "right": "what is next"}, {"left": "want ik heb tijd", "right": "the reason"}, {"left": "Groetjes, Omar", "right": "closing"}, {"left": "Bedankt voor je bericht!", "right": "thanks for the message"}]}
          - {"content_key": "nl.a2.unit106.lesson06.exercise04.volgorde_zaterdag", "type": "word_order", "tested_text": "Ik ben zaterdag naar het feestje gegaan", "prompt": {"target_blocks": []}, "word_bank": ["gegaan", "zaterdag", "ik", "naar", "ben", "feestje", "het"]}
          - {"content_key": "nl.a2.unit106.lesson06.exercise05.antwoord_weekend", "type": "dialogue_response", "tested_text": "Ik ben gisteren naar het feestje gegaan", "prompt": {"target_blocks": [{"text": "Hoe was je weekend?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit106.lesson06.exercise06.vertaal_dus", "type": "translation", "tested_text": "Ik was ziek dus ik ben niet naar het feestje gegaan", "prompt": {"target_blocks": [{"text": "I was ill, so I did not go to the party. Use dus and the present perfect for the second part.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit106.lesson06.exercise07.schrijf_bericht", "type": "writing_prompt", "tested_text": "Ik ben gisteren naar de dierentuin gegaan Morgen ga ik mijn oom bezoeken want ik heb tijd", "prompt": {"target_blocks": [{"text": "Write exactly two Dutch sentences for a message to a friend: (1) say that you went to the zoo yesterday, using ben plus gegaan; (2) say that you are going to visit your uncle tomorrow, using gaan, with the reason 'because I have time' using want.", "language_code": "en", "direction": "ltr"}]}}
