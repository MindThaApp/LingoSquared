      - content_key: nl.a2.unit106.lesson05.berichten_lezen
        title: "Berichten lezen"
        spine_outcome_id: universal.a2.communication.write_informal_message
        teaching:
          - {"content_key": "nl.a2.unit106.lesson05.teach.leeswoorden", "kind": "vocabulary", "target": {"text": "het kaartje, al, erg, veel, ook, maar, dat, hij, wonen", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["het", "kaartje", "al", "erg", "veel", "ook", "maar", "dat", "hij", "wonen", "Ik", "heb", "gedanst", "feestje", "was", "gezellig", "Mijn", "oom", "woont", "in", "Amsterdam", "is", "park", "kom", "niet"], "example": [{"text": "Ik heb veel gedanst.", "language_code": "nl", "direction": "ltr"}, {"text": "Het feestje was erg gezellig.", "language_code": "nl", "direction": "ltr"}, {"text": "Mijn oom woont in Amsterdam.", "language_code": "nl", "direction": "ltr"}, {"text": "Hij is ook in het park.", "language_code": "nl", "direction": "ltr"}, {"text": "Ik kom, maar dat is niet erg.", "language_code": "nl", "direction": "ltr"}]}
          - {"content_key": "nl.a2.unit106.lesson05.teach.gn_voltooid_verleden", "kind": "grammar_note", "target": {"text": "Ik had al een kaartje gekocht. Lotte had Omar al gebeld.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Ik", "had", "al", "een", "kaartje", "gekocht", "Lotte", "Omar", "gebeld"]}
          - {"content_key": "nl.a2.unit106.lesson05.teach.lees_noor", "kind": "reading", "target": {"text": "Hoi Lotte, bedankt voor je bericht! Gisteren ben ik naar het feestje gegaan. Het was erg gezellig en ik heb veel gedanst. Morgen ga ik naar de dierentuin, want ik heb tijd. Misschien ga ik volgende week naar de film. Tot snel, Noor", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Hoi", "Lotte", "bedankt", "voor", "je", "bericht", "Gisteren", "ben", "ik", "naar", "het", "feestje", "gegaan", "was", "erg", "gezellig", "en", "heb", "veel", "gedanst", "Morgen", "ga", "de", "dierentuin", "want", "tijd", "Misschien", "volgende", "week", "film", "Tot", "snel", "Noor"]}
          - {"content_key": "nl.a2.unit106.lesson05.teach.lees_omar", "kind": "reading", "target": {"text": "Hé Lotte, hoe gaat het met je? Ik was gisteren ziek, dus ik ben niet naar de film gegaan. Ik had al een kaartje gekocht, maar dat was niet erg. Volgende week ga ik mijn oom bezoeken. Hij woont in Amsterdam. Ik zal je morgen bellen. Groetjes, Omar", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Hé", "Lotte", "hoe", "gaat", "het", "met", "je", "Ik", "was", "gisteren", "ziek", "dus", "ben", "niet", "naar", "de", "film", "gegaan", "had", "al", "een", "kaartje", "gekocht", "maar", "dat", "erg", "Volgende", "week", "ga", "mijn", "oom", "bezoeken", "Hij", "woont", "in", "Amsterdam", "zal", "morgen", "bellen", "Groetjes", "Omar"]}
        exercises:
          - {"content_key": "nl.a2.unit106.lesson05.exercise01.lees_noor_gisteren", "type": "reading_comprehension", "tested_text": "Gisteren ben ik naar het feestje gegaan", "prompt": {"target_blocks": [{"text": "Read Noor's message. What did Noor do yesterday?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit106.lesson05.exercise02.lees_noor_reden", "type": "reading_comprehension", "tested_text": "Morgen ga ik naar de dierentuin want ik heb tijd", "prompt": {"target_blocks": [{"text": "Why is Noor going to the zoo tomorrow?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit106.lesson05.exercise03.lees_omar_reden", "type": "reading_comprehension", "tested_text": "Ik was gisteren ziek dus ik ben niet naar de film gegaan", "prompt": {"target_blocks": [{"text": "Why did Omar not go to the film?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit106.lesson05.exercise04.lees_omar_kaartje", "type": "reading_comprehension", "tested_text": "Ik had al een kaartje gekocht", "prompt": {"target_blocks": [{"text": "What had Omar already done before the film?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit106.lesson05.exercise05.volgorde_dierentuin", "type": "word_order", "tested_text": "Morgen ga ik naar de dierentuin", "prompt": {"target_blocks": []}, "word_bank": ["ga", "naar", "dierentuin", "morgen", "de", "ik"]}
          - {"content_key": "nl.a2.unit106.lesson05.exercise06.dictee_feestje", "type": "dictation", "tested_text": "Gisteren ben ik naar het feestje gegaan.", "media_asset_key": "nl.a2.audio.een_bericht_aan_een_vriend.gisteren_feestje.01", "prompt": {"target_blocks": []}}
          - {"content_key": "nl.a2.unit106.lesson05.exercise07.dictee_ziek", "type": "dictation", "tested_text": "Ik was gisteren ziek, dus ik ben niet naar de film gegaan.", "media_asset_key": "nl.a2.audio.een_bericht_aan_een_vriend.ziek_dus.01", "prompt": {"target_blocks": []}}
      - content_key: nl.a2.unit106.lesson06.een_bericht_schrijven
        title: "Een bericht schrijven"
        spine_outcome_id: universal.a2.communication.write_informal_message
        teaching:
          - {"content_key": "nl.a2.unit106.lesson06.teach.lotte_vraag", "kind": "dialogue", "target": {"text": "Hoi Omar, hoe was je weekend?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Hoi", "Omar", "hoe", "was", "je", "weekend"]}
