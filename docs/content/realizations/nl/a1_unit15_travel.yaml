schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Vocabulary progression (buying a ticket, asking departure time and
    platform, understanding a delay announcement, asking for directions
    at a station) is scaffolded from the transportation/travel module of
    the FSI Dutch Basic Course (Foreign Service Institute, US Department
    of State -- public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents these as isolated
    substitution drills built around a generic ticket counter, with no
    continuous scenario and dated station conventions; every sentence,
    exercise, and the Lotte/Omar train-trip storyline in this unit are
    freshly authored in modern colloquial register (contemporary Dutch
    rail vocabulary: kaartje, perron, vertraging), not copied or lightly
    edited from any 1960s-70s source text.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Initial six-lesson Dutch travel draft (spine outcome:
    universal.a1.travel.handle_basic_journey), continuing the
    Lotte/Omar storyline from unit14 -- the backpack Omar bought is
    for this trip. A fresh-context review (zero access to the
    authoring reasoning) ran and found: one calqued, non-native-
    sounding closing line ("Utrecht, hier komen we!", a direct
    word-for-word translation of "here we come") -- replaced with the
    natural "Utrecht, we komen eraan!" everywhere it appeared (teaching
    text, exercise tested_text, both audio asset transcripts); one
    exercise (lesson06 comprehend_arrival_platform) whose "arrive"
    wording collided with the "aankomen"/"aankomst" sense taught
    earlier in the unit for the Utrecht destination, creating a real
    ambiguity -- reworded to "pull into"; the same lesson05
    exercise-ordering wrinkle as unit14 -- reordered; one writing_prompt
    instruction narrowed to match its single accepted answer. No
    grammar errors, spine drift, jargon leaks, or YAML footguns found.
    Fixes applied and re-validated (0 errors/0 warnings across the
    full nl course). Still needs Ramin's native-speaker pass before
    status: reviewed.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte and
    Omar continue to use informal jij/je with each other while traveling.
    At the ticket counter, an unfamiliar station employee is addressed with
    the formal u, the same register distinction introduced in unit01 --
    keep each exercise's register explicit and preserve the corresponding
    verb form.

media_assets:
  - {content_key: nl.a1.audio.travel.enkele_of_retour.01, language: nl, text: "Wilt u een enkele reis of een retour?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a1.audio.travel.retour_alstublieft.01, language: nl, text: "Een retour, alstublieft.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.travel.vertrektijd_perron.01, language: nl, text: "De trein vertrekt om kwart voor tien van perron vijf.", voice_hint: neutral_adult_clear, status: pending_generation}
  - {content_key: nl.a1.audio.travel.trein_komt_aan.01, language: nl, text: "De trein komt om elf uur aan.", voice_hint: neutral_adult_clear, status: pending_generation}
  - {content_key: nl.a1.audio.travel.vertraging_perron.01, language: nl, text: "De trein vertrekt van perron drie in plaats van perron vijf.", voice_hint: neutral_adult_announcement, status: pending_generation}
  - {content_key: nl.a1.audio.travel.let_op_vertraging.01, language: nl, text: "Let op: de trein naar Utrecht heeft vertraging.", voice_hint: neutral_adult_announcement, status: pending_generation}
  - {content_key: nl.a1.audio.travel.rechtdoor_rechts.01, language: nl, text: "Rechtdoor en dan rechts.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.travel.waar_perron_zeven.01, language: nl, text: "Waar is perron zeven?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.travel.kaartje_lezen.01
    language: nl
    text: >-
      Kaartje: Amsterdam Centraal naar Utrecht Centraal. Vertrek: tien over
      tien, perron zeven. Aankomst: tien voor elf. Retour. Prijs: twaalf
      euro veertig.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - {content_key: nl.a1.audio.travel.dialogue_open.01, language: nl, text: "We moeten naar perron zeven.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.travel.dialogue_close.01, language: nl, text: "Kom, we stappen in. Utrecht, we komen eraan!", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.dialogue.trein_naar_utrecht.01
    language: nl
    text: >-
      Omar: We moeten naar perron zeven. De trein vertrekt om tien over
      tien. Lotte: Kijk, daar staat het bord: vertraging, tien minuten.
      Omar: Geen probleem, we hebben nog tijd voor een koffie. Lotte: Goed
      idee. O, daar is de trein al. Perron zeven, precies! Omar: Kom, we
      stappen in. Utrecht, we komen eraan!
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.a1.unit15.travel
    title: "Op reis met de trein"
    section: reading_writing
    spine_outcome_ids: [universal.a1.travel.handle_basic_journey]
    planned_lesson_count: 6
    lessons:
      - content_key: nl.a1.unit15.lesson01.een_kaartje_kopen
        title: "Een kaartje kopen"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - {content_key: nl.a1.unit15.lesson01.teach.kaartje, kind: vocabulary, target: {text: "het kaartje", language_code: nl, direction: ltr}, introduced_tokens: [het, kaartje]}
          - {content_key: nl.a1.unit15.lesson01.teach.wil_graag, kind: phrase, target: {text: "Ik wil graag een kaartje naar Utrecht.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, wil, graag, een, kaartje, naar, Utrecht]}
          - {content_key: nl.a1.unit15.lesson01.teach.enkele_of_retour, kind: phrase, target: {text: "Wilt u een enkele reis of een retour?", language_code: nl, direction: ltr}, introduced_tokens: [Wilt, u, een, enkele, reis, of, retour]}
          - {content_key: nl.a1.unit15.lesson01.teach.retour_alstublieft, kind: phrase, target: {text: "Een retour, alstublieft.", language_code: nl, direction: ltr}, introduced_tokens: [Een, retour, alstublieft]}
          - {content_key: nl.a1.unit15.lesson01.teach.register_note, kind: grammar_note, target: {text: "Bij de balie gebruik je meestal de beleefde vorm u.", language_code: nl, direction: ltr}, introduced_tokens: [Bij, de, balie, gebruik, je, meestal, beleefde, vorm, u]}
        exercises:
          - {content_key: nl.a1.unit15.lesson01.exercise01.choose_ticket_request, type: multiple_choice, tested_text: "Ik wil graag een kaartje naar Utrecht", prompt: {target_blocks: [{text: "I would like a ticket to Utrecht.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson01.exercise02.listen_ticket_type, type: listen_select, tested_text: "Wilt u een enkele reis of een retour", media_asset_key: nl.a1.audio.travel.enkele_of_retour.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit15.lesson01.exercise03.match_ticket_types, type: matching_pairs, tested_text: "enkele reis retour kaartje", prompt: {target_blocks: []}, pairs: [{left: "een enkele reis", right: "a one-way ticket"}, {left: "een retour", right: "a return ticket"}]}
          - {content_key: nl.a1.unit15.lesson01.exercise04.order_ticket_request, type: word_order, tested_text: "Ik wil graag een kaartje naar Utrecht", prompt: {target_blocks: []}, word_bank: [naar, Ik, kaartje, graag, wil, een, Utrecht]}
          - {content_key: nl.a1.unit15.lesson01.exercise05.listen_order_retour, type: listen_order, tested_text: "Een retour alstublieft", media_asset_key: nl.a1.audio.travel.retour_alstublieft.01, prompt: {target_blocks: []}, word_bank: [alstublieft, Een, retour]}
          - {content_key: nl.a1.unit15.lesson01.exercise06.complete_ticket_request, type: fill_in_blank, tested_text: "Ik wil graag een kaartje naar Utrecht", prompt: {target_blocks: [{text: "Ik wil ___ een kaartje naar Utrecht.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson01.exercise07.respond_counter, type: dialogue_response, tested_text: "Een retour naar Utrecht alstublieft", prompt: {target_blocks: [{text: "Enkele reis of retour?", language_code: nl, direction: ltr}]}}

      - content_key: nl.a1.unit15.lesson02.vertrektijd_en_perron
        title: "Hoe laat vertrekt de trein?"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - {content_key: nl.a1.unit15.lesson02.teach.perron, kind: vocabulary, target: {text: "het perron", language_code: nl, direction: ltr}, introduced_tokens: [het, perron]}
          - {content_key: nl.a1.unit15.lesson02.teach.welk_perron, kind: phrase, target: {text: "Van welk perron vertrekt de trein naar Utrecht?", language_code: nl, direction: ltr}, introduced_tokens: [Van, welk, perron, vertrekt, de, trein, naar, Utrecht]}
          - {content_key: nl.a1.unit15.lesson02.teach.vertrektijd, kind: phrase, target: {text: "De trein vertrekt om kwart voor tien van perron vijf.", language_code: nl, direction: ltr}, introduced_tokens: [De, trein, vertrekt, om, kwart, voor, tien, van, perron, vijf]}
          - {content_key: nl.a1.unit15.lesson02.teach.hoe_laat_aan, kind: phrase, target: {text: "Hoe laat komt de trein aan?", language_code: nl, direction: ltr}, introduced_tokens: [Hoe, laat, komt, de, trein, aan]}
          - {content_key: nl.a1.unit15.lesson02.teach.aankomsttijd, kind: phrase, target: {text: "De trein komt om elf uur aan.", language_code: nl, direction: ltr}, introduced_tokens: [De, trein, komt, om, elf, uur, aan]}
        exercises:
          - {content_key: nl.a1.unit15.lesson02.exercise01.choose_platform_question, type: multiple_choice, tested_text: "Van welk perron vertrekt de trein naar Utrecht", prompt: {target_blocks: [{text: "From which platform does the train to Utrecht leave?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson02.exercise02.listen_departure, type: listen_select, tested_text: "De trein vertrekt om kwart voor tien van perron vijf", media_asset_key: nl.a1.audio.travel.vertrektijd_perron.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit15.lesson02.exercise03.match_travel_verbs, type: matching_pairs, tested_text: "vertrekt komt aan perron", prompt: {target_blocks: []}, pairs: [{left: vertrekt, right: departs}, {left: "komt aan", right: arrives}, {left: "het perron", right: "the platform"}]}
          - {content_key: nl.a1.unit15.lesson02.exercise04.order_arrival_question, type: word_order, tested_text: "Hoe laat komt de trein aan", prompt: {target_blocks: []}, word_bank: [de, laat, aan, trein, Hoe, komt]}
          - {content_key: nl.a1.unit15.lesson02.exercise05.listen_order_arrival, type: listen_order, tested_text: "De trein komt om elf uur aan", media_asset_key: nl.a1.audio.travel.trein_komt_aan.01, prompt: {target_blocks: []}, word_bank: [uur, De, komt, om, aan, trein, elf]}
          - {content_key: nl.a1.unit15.lesson02.exercise06.complete_platform, type: fill_in_blank, tested_text: "De trein vertrekt van perron vijf", prompt: {target_blocks: [{text: "De trein vertrekt van perron ___.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson02.exercise07.write_platform_question, type: writing_prompt, tested_text: "Van welk perron vertrekt de trein naar Utrecht", prompt: {target_blocks: [{text: "Write in Dutch: ask from which platform the train to Utrecht departs.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit15.lesson03.vertraging
        title: "Vertraging"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - {content_key: nl.a1.unit15.lesson03.teach.op_tijd, kind: vocabulary, target: {text: "op tijd", language_code: nl, direction: ltr}, introduced_tokens: [op, tijd]}
          - {content_key: nl.a1.unit15.lesson03.teach.de_vertraging, kind: vocabulary, target: {text: "de vertraging", language_code: nl, direction: ltr}, introduced_tokens: [de, vertraging]}
          - {content_key: nl.a1.unit15.lesson03.teach.let_op, kind: phrase, target: {text: "Let op: de trein naar Utrecht heeft vertraging.", language_code: nl, direction: ltr}, introduced_tokens: [Let, op, de, trein, naar, Utrecht, heeft, vertraging]}
          - {content_key: nl.a1.unit15.lesson03.teach.niet_op_tijd, kind: phrase, target: {text: "De trein vertrekt niet op tijd.", language_code: nl, direction: ltr}, introduced_tokens: [De, trein, vertrekt, niet, op, tijd]}
          - {content_key: nl.a1.unit15.lesson03.teach.ander_perron, kind: phrase, target: {text: "De trein vertrekt van perron drie in plaats van perron vijf.", language_code: nl, direction: ltr}, introduced_tokens: [De, trein, vertrekt, van, perron, drie, in, plaats, vijf]}
          - {content_key: nl.a1.unit15.lesson03.teach.tien_minuten_vertraging, kind: phrase, target: {text: "De trein heeft tien minuten vertraging.", language_code: nl, direction: ltr}, introduced_tokens: [De, trein, heeft, tien, minuten, vertraging]}
        exercises:
          - {content_key: nl.a1.unit15.lesson03.exercise01.choose_delayed, type: multiple_choice, tested_text: "De trein naar Utrecht heeft vertraging", prompt: {target_blocks: [{text: "The train to Utrecht is delayed.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson03.exercise02.listen_new_platform, type: listen_select, tested_text: "De trein vertrekt van perron drie in plaats van perron vijf", media_asset_key: nl.a1.audio.travel.vertraging_perron.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit15.lesson03.exercise03.match_delay_terms, type: matching_pairs, tested_text: "op tijd vertraging", prompt: {target_blocks: []}, pairs: [{left: "op tijd", right: "on time"}, {left: "de vertraging", right: "the delay"}]}
          - {content_key: nl.a1.unit15.lesson03.exercise04.order_not_on_time, type: word_order, tested_text: "De trein vertrekt niet op tijd", prompt: {target_blocks: []}, word_bank: [tijd, De, niet, vertrekt, op, trein]}
          - {content_key: nl.a1.unit15.lesson03.exercise05.listen_order_announcement, type: listen_order, tested_text: "Let op de trein naar Utrecht heeft vertraging", media_asset_key: nl.a1.audio.travel.let_op_vertraging.01, prompt: {target_blocks: []}, word_bank: [naar, Let, heeft, Utrecht, de, op, trein, vertraging]}
          - {content_key: nl.a1.unit15.lesson03.exercise06.complete_not_on_time, type: fill_in_blank, tested_text: "De trein vertrekt niet op tijd", prompt: {target_blocks: [{text: "De trein vertrekt niet ___ tijd.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson03.exercise07.write_delay, type: writing_prompt, tested_text: "De trein heeft tien minuten vertraging", prompt: {target_blocks: [{text: "Write in Dutch: The train has a ten-minute delay.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit15.lesson04.de_weg_op_het_station
        title: "De weg op het station"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - {content_key: nl.a1.unit15.lesson04.teach.ingang, kind: vocabulary, target: {text: "de ingang", language_code: nl, direction: ltr}, introduced_tokens: [de, ingang]}
          - {content_key: nl.a1.unit15.lesson04.teach.uitgang, kind: vocabulary, target: {text: "de uitgang", language_code: nl, direction: ltr}, introduced_tokens: [de, uitgang]}
          - {content_key: nl.a1.unit15.lesson04.teach.wachtruimte, kind: vocabulary, target: {text: "de wachtruimte", language_code: nl, direction: ltr}, introduced_tokens: [de, wachtruimte]}
          - {content_key: nl.a1.unit15.lesson04.teach.waar_perron_zeven, kind: phrase, target: {text: "Waar is perron zeven?", language_code: nl, direction: ltr}, introduced_tokens: [Waar, is, perron, zeven]}
          - {content_key: nl.a1.unit15.lesson04.teach.rechtdoor_rechts, kind: phrase, target: {text: "Rechtdoor en dan rechts.", language_code: nl, direction: ltr}, introduced_tokens: [Rechtdoor, en, dan, rechts]}
          - {content_key: nl.a1.unit15.lesson04.teach.waar_wachtruimte, kind: phrase, target: {text: "Waar is de wachtruimte?", language_code: nl, direction: ltr}, introduced_tokens: [Waar, is, de, wachtruimte]}
        exercises:
          - {content_key: nl.a1.unit15.lesson04.exercise01.choose_platform_location, type: multiple_choice, tested_text: "Waar is perron zeven", prompt: {target_blocks: [{text: "Where is platform seven?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson04.exercise02.listen_directions, type: listen_select, tested_text: "Rechtdoor en dan rechts", media_asset_key: nl.a1.audio.travel.rechtdoor_rechts.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit15.lesson04.exercise03.match_station_places, type: matching_pairs, tested_text: "ingang uitgang wachtruimte", prompt: {target_blocks: []}, pairs: [{left: "de ingang", right: "the entrance"}, {left: "de uitgang", right: "the exit"}, {left: "de wachtruimte", right: "the waiting room"}]}
          - {content_key: nl.a1.unit15.lesson04.exercise04.order_waiting_room, type: word_order, tested_text: "Waar is de wachtruimte", prompt: {target_blocks: []}, word_bank: [wachtruimte, Waar, de, is]}
          - {content_key: nl.a1.unit15.lesson04.exercise05.listen_order_platform, type: listen_order, tested_text: "Waar is perron zeven", media_asset_key: nl.a1.audio.travel.waar_perron_zeven.01, prompt: {target_blocks: []}, word_bank: [zeven, Waar, perron, is]}
          - {content_key: nl.a1.unit15.lesson04.exercise06.complete_directions, type: fill_in_blank, tested_text: "Rechtdoor en dan rechts", prompt: {target_blocks: [{text: "___ en dan rechts.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson04.exercise07.respond_platform_directions, type: dialogue_response, tested_text: "Perron zeven is rechtdoor en dan rechts", prompt: {target_blocks: [{text: "Waar is perron zeven?", language_code: nl, direction: ltr}]}}

      - content_key: nl.a1.unit15.lesson05.een_kaartje_lezen
        title: "Een treinkaartje lezen"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - content_key: nl.a1.unit15.lesson05.teach.kaartje_tekst
            kind: reading
            target:
              text: >-
                Kaartje: Amsterdam Centraal naar Utrecht Centraal. Vertrek:
                tien over tien, perron zeven. Aankomst: tien voor elf.
                Retour. Prijs: twaalf euro veertig.
              language_code: nl
              direction: ltr
            introduced_tokens: [Kaartje, Amsterdam, Centraal, naar, Utrecht, Vertrek, tien, over, perron, zeven, Aankomst, voor, elf, Retour, Prijs, twaalf, euro, veertig]
        exercises:
          - {content_key: nl.a1.unit15.lesson05.exercise01.read_platform, type: reading_comprehension, tested_text: "perron zeven", prompt: {target_blocks: [{text: "From which platform does the train leave?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson05.exercise02.read_arrival_time, type: reading_comprehension, tested_text: "tien voor elf", prompt: {target_blocks: [{text: "What time does the train arrive in Utrecht?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson05.exercise03.read_ticket_type, type: reading_comprehension, tested_text: "Retour", prompt: {target_blocks: [{text: "Is this a one-way ticket or a return ticket?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit15.lesson05.exercise04.listen_ticket, type: listen_select, tested_text: "Vertrek tien over tien perron zeven", media_asset_key: nl.a1.audio.travel.kaartje_lezen.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit15.lesson05.exercise05.match_ticket_fields, type: matching_pairs, tested_text: "Vertrek Aankomst Prijs", prompt: {target_blocks: []}, pairs: [{left: Vertrek, right: "tien over tien"}, {left: Aankomst, right: "tien voor elf"}, {left: Prijs, right: "twaalf euro veertig"}]}
          - {content_key: nl.a1.unit15.lesson05.exercise06.write_ticket_request, type: writing_prompt, tested_text: "Ik wil graag een retour naar Utrecht", prompt: {target_blocks: [{text: "Write in Dutch, using Ik wil graag ..., that you would like a return ticket to Utrecht.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit15.lesson06.lotte_en_omar_op_reis
        title: "Lotte en Omar op reis"
        spine_outcome_id: universal.a1.travel.handle_basic_journey
        teaching:
          - {content_key: nl.a1.unit15.lesson06.teach.omar_open, kind: dialogue, target: {text: "Omar: We moeten naar perron zeven. De trein vertrekt om tien over tien.", language_code: nl, direction: ltr}, introduced_tokens: [Omar, We, moeten, naar, perron, zeven, De, trein, vertrekt, om, tien, over]}
          - {content_key: nl.a1.unit15.lesson06.teach.lotte_sign, kind: dialogue, target: {text: "Lotte: Kijk, daar staat het bord: vertraging, tien minuten.", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Kijk, daar, staat, het, bord, vertraging, tien, minuten]}
          - {content_key: nl.a1.unit15.lesson06.teach.omar_coffee, kind: dialogue, target: {text: "Omar: Geen probleem, we hebben nog tijd voor een koffie.", language_code: nl, direction: ltr}, introduced_tokens: [Omar, Geen, probleem, we, hebben, nog, tijd, voor, een, koffie]}
          - {content_key: nl.a1.unit15.lesson06.teach.lotte_train_arrives, kind: dialogue, target: {text: "Lotte: Goed idee. O, daar is de trein al. Perron zeven, precies!", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Goed, idee, O, daar, is, de, trein, al, Perron, zeven, precies]}
