    piece."/"Five euros per piece."/"It doesn't say." instead. lesson06's
    clip has Nina saying "Hoe was de bloemist?" and "Zullen we volgende
    week samen naar de boekwinkel gaan?", and Omar saying "Heel goed! De
    rozen waren mooi." and "Ja, leuk! Tot volgende week, Nina!" -- ex01
