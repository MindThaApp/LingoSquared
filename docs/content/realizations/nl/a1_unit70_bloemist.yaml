    multi-turn dialogues (lesson05's toonbank_bloemist and lesson06's
    na_de_bloemist) was checked by hand against every line every speaker
    says in that same clip, not just the tested speaker's: lesson05's clip
    has de medewerker saying "Goedemiddag! Wat wilt u?", "Natuurlijk. Dat
    is tien euro." and "Ja, één euro per stuk.", Lotte saying "Goedemiddag.
    Wij willen graag vijf rozen.", and Omar saying "Hebt u ook tulpen?" --
    ex01 tests Lotte's request line and its three distractors ("We would
    like five tulips."/"We would like one rose."/"Do you have roses?")
    match none of those five lines' English meanings; ex02 tests de
    medewerker's "Dat is tien euro" (the rose total) and deliberately
