course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina,
    Omar, and Lotte are established taalcafe friends and use informal
    jij/je with each other throughout. This unit has no service-role
    staff character (a park is free and public), so the entire unit
    stays in the friends' informal register -- unlike unit50-58's
    venues, which each had a neutral-polite "u"-register staff member.

