review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    First Dutch B1 unit. Targets the genuine CEFR B1 hallmark of Dutch
    hypothetical/irrealis constructions: *zou* (singular) / *zouden*
    (plural) + infinitive as the conditional mood, combined with an unreal
    *als*-clause using the imperfectum (*had*, *was*, *kon*) -- Dutch's
    closest structural equivalent to a subjunctive, and a genuine
    complexity step up from the A2 course's simple present/past narration.
    Continues the Lotte/Omar storyline established in nl's A2 opinions
    unit (a2_unit25_meningen.yaml) for lesson04's dialogue, keeping their
    established informal jij/je register -- no sibling-direction file was
    consulted while authoring this (nl-en overlay does not exist for this
    unit yet), only nl's OWN prior realization content, which is not a
    sibling-isolation violation (that rule is about two overlay
    directions of the SAME content, not about a language's own earlier
    units). All vocabulary is introduced self-contained within this file,
    including basic pronouns (ik, jij/je, zij/ze), per the established
    fa/prs B1 precedent for a from-scratch-generated first B1 unit.
    Fresh-context review 2026-07-11: renamed the lesson05 reading's
    nurse from Sanne to Anouk (Sanne is an established A1 character,
    the unit53 wasserette staff member -- reusing the name for a
    different person contradicted the corpus); overlay-side fixes to
    two ambiguous bare-word distractors and missing accepted-answer
    variants recorded in the overlay's own review notes. Dutch text
    verified natural and grammatical; Lotte/Omar facts consistent
    with a1_unit17/a2_unit25.

course:
  realization_key: nl.b1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Continues Lotte and Omar's established informal jij/je register from
    the A2 opinions unit for personal, everyday hypotheticals (winning
    the lottery, a free year, a different career). Natural spoken Dutch
    prefers the reduced *je* over the emphatic *jij* by default; *jij* is
    used only for genuine contrastive emphasis ("En wat zou JIJ doen?"),
    matching real usage -- both forms are taught together since they are
    the same word in two registers, not two different words.

