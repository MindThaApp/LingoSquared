    outcome for Dutch -- all 45 were already realized. Git history was
    checked first (git log -- docs/content/universal_spine.yaml and the
    nl realizations directory); the most recent additions were nl unit50
    (pharmacy) and, in the same commit, the
    universal.a1.pharmacy.buy_basic_medicine spine outcome itself -- no
    other session had added a newer, still-unrealized A1 outcome since.
    This unit therefore adds a new delegated A1 spine outcome,
    universal.a1.personal_care.get_haircut, distinct from unit20's
    clothing purchases and unit46's generic appointment-booking
    mechanics (naming a service, day, and time in the abstract): the
    transactional hairdresser/barber visit itself (describing a style
    preference, understanding a service offer, reading a salon price
    list) is a distinct, practically important A1 survival topic for
    living in the Netherlands and was not yet covered anywhere in the
    spine. Story continuity: Wednesday 20 May 2026, two days after
    unit50's Monday 18 May 2026 pharmacy visit (verified with Python
    datetime.date(2026,5,20).strftime("%A") == "Wednesday"). Nina's hair
    has gotten too long; she books and attends a haircut at Kapsalon
    Bloem, and in the closing scene runs into Lotte (her established
    taalcafe-friend from units 37/38/47/48/49), who compliments the new
    haircut -- consistent with Lotte's recurring role and giving her a
    reappearance after unit50 focused on Omar. Every vocabulary teaching
    card includes a real example sentence with a matching overlay
    example_gloss. Prior words (including "ik heb"/"een"/basic modal-verb
    constructions and the present-perfect "ben ... geweest" pattern from
    earlier units) are re-declared as introduced_tokens at first use in
    this file because the untaught-vocabulary validator is per-file.

