generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation. Checked firecrawl search/scrape for an
    intermediate-level public-domain Dutch course first (per
    AUTHORING_GUIDE.md §10) -- firecrawl is still returning HTTP 402
    (account credits exhausted, a standing outage as of this dispatch),
    and no genuine FSI/Peace-Corps-equivalent intermediate Dutch source is
    known to exist. Built from general Dutch grammar knowledge, not
    adapted from a source. nl's tenth B1 unit, the fourth of five closing
    the outcome-coverage gap documented in b1_unit06/07/08/09's own
    provenance notes. Targets universal.b1.workplace.describe_
    responsibilities_and_updates, the fifth of six first-wave outcomes
    shared with fa/ro/hi/prs.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    nl's tenth B1 unit. Targets universal.b1.workplace.describe_
    responsibilities_and_updates -- describing job responsibilities,
    giving a colleague a status update on a task, and asking a colleague
    for professional help, in professional register. DIFFERENT from nl's
    own existing b1_unit03 (universal.b1.workplace.communicate_
    professionally_in_meetings), which taught formal *u*-register meeting
    phrases (*zou u ... kunnen*, *zou willen voorstellen dat*) with
    meneer Bakker over a rapport/cijfers/jaarverslag framing -- this unit
    reuses the SAME established meneer Bakker/*u*-register dynamic
    (deliberately, for continuity and because switching Lotte's
    established manager relationship to a different register mid-course
    would be a real inconsistency) but targets three narrower, distinct
    speech acts unit03 didn't cover: describing your own responsibilities
    as a standalone statement (lesson01, no interlocutor), giving a
    status update that explicitly names a task's progress state --
    almost-done-but-running-late, not unit03's simple future-tense
    "I'll finish it by Friday" (lesson02), and asking a colleague/manager
    for help with a specific task (lesson03) -- reusing unit03's *zou u
    ... kunnen* construction for the new specific act of a HELP request
    rather than a meeting-agenda request. Kept Lotte's established
    hospital/nurse profile (a1_unit17: verpleegkundige, ziekenhuis)
    hospital-compatible per b1_unit03's own review note ("future
    workplace units should keep her workplace hospital-compatible") --
    her responsibility is patient medication, and the "rapport"/"de
    planning" she's working on for meneer Bakker are the same office-
    admin-side hospital tasks (schedules, reports) unit03 already
    established managers and hospitals both plausibly have. No sibling-
    direction file (nl-en) was consulted. All vocabulary, including basic
    function words, is introduced self-contained within this file.
    Word_order exercises use shorter core clauses where the full sentence
    would make an unreasonably long tile set; translation/speak/write
    exercises use the full sentence. Fresh-context review 2026-07-11
    (AUTHORING_GUIDE.md §20) complete: Dutch verified grammatical and
    natural -- verantwoordelijk voor, the *duren* status update, the
    zou-u-kunnen-helpen polite request, the reading's er ... mee split
    ("er bijna klaar mee") and separable langskomen (komt ... langs)
    all correct; mutual formal u with meneer Bakker consistent with
    b1_unit03, and Lotte's nurse/medication responsibility consistent
    with a1_unit17. word_order accepted_answers correctly comma-free;
    no listen_select distractor collisions. Mechanical sweeps clean.
    No objective bugs found.

course:
  realization_key: nl.b1
  target_language_first: true
