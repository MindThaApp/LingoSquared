course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. This unit
    contrasts formal ordering (u, wilt) at a counter with informal ordering
    (je, wil) between friends, continuing the jij/je vs u distinction from
    unit01.

