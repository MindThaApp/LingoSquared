          - {content_key: nl.a1.unit34.lesson02.exercise04.order_lotte_stuurt, type: word_order, tested_text: "Lotte stuurt een bericht naar de app", prompt: {target_blocks: []}, word_bank: [Lotte, stuurt, een, bericht, naar, de, app]}
