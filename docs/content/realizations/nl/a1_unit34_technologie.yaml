          - {content_key: nl.a1.unit34.lesson01.exercise02.listen_omar_telefoon, type: listen_select, tested_text: "Omar heeft een telefoon", media_asset_key: nl.a1.audio.technologie.omar_telefoon.01, prompt: {target_blocks: []}}
