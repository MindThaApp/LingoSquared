review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  reviewer_notes: >-
    2026-07-11 independent fresh-context review (Opus, no access to the
    authoring session; realization+overlay read together, backend
    grading._normalize semantics applied before judging accepted_answers).
    Ran every mechanical sweep clean: boolean-coercion type-walk,
    snake_case/jargon scan of learner-facing fields, accepted_answers value-
    key shape, title-length, and spine-outcome existence. Spine outcome
    universal.a1.technology.describe_device_use confirmed. Checked by hand:
    word_order/listen_order duplicate-token coverage (none needed); the two
    multi-turn dialogue clips (technologie_plan, technologie_wrapup) against
    every dialogue_comprehension distractor at the meaning level --
    distractors that appear in-audio are attributed to a DIFFERENT speaker
    than the one each item tests, so all remain answerable; single-line
    listen_select assets vs their tested_text; character tech-habit facts vs
    unit05/17/21/30/32. No objective grading bug found. Only open item is
    the already-flagged 'sturen een bericht naar de app' phrasing (an app is
    not a natural message recipient the way lesson05's 'naar Lotte' is) -- a
    native-naturalness call recurring across a teaching card, a phrase card
    and 4 exercises, left for Ramin rather than silently rewritten.
  flagged_issues:
    - >-
      2026-07-10 genuine fresh-context review: lesson02's central
      pattern "sturen een bericht naar de app" ("send a message to the
      app," lesson02.teach.bericht's example, teach.lotte_stuurt_bericht,
      and 4 exercises: choose_lotte_stuurt/listen_lotte_stuurt/
      order_lotte_stuurt/write_send_message) reads as questionable
      Dutch to this reviewer -- "sturen ... naar X" naturally takes a
      PERSON as X (a real recipient), which this SAME unit confirms
      elsewhere: lesson05's "Fenna stuurt vaak een bericht naar Lotte"
      uses the identical construction correctly, with a person as the
      object. An app isn't a message recipient the way a person is; a
      more natural phrasing would likely be "sturen een bericht via de
      app" (send a message via/through the app) or simply "appen"
      (the attested colloquial verb). Not confident enough to silently
      rewrite this myself since it recurs across a teaching card,
      a phrase card, and 4 exercises (tested_text/word_bank/
      accepted_answers would all need coordinated updates), and the
      "correct" replacement affects introduced_tokens too. Everything
      else in this unit (lessons 01/03-06, dialogue-audio distractors,
      §11 facts, boolean/jargon scans, matching_pairs shapes,
      fill_in_blank ambiguity avoidance) checked clean. Needs Ramin's
      native-speaker judgment call on the correct phrasing before this
      unit can be marked reviewed.
  notes: >-
    New A1 technology/devices unit (file-numbered unit34, next after
    unit32), realizing the new spine outcome
    universal.a1.technology.describe_device_use (prerequisite:
    universal.a1.communication.basic_phone_contact, realized in
    unit22). This outcome was added fresh in this same task under the
    standing delegated spine-authority -- an exact spine_outcome_id
    diff across all 32 existing nl realization files confirmed every
    existing spine outcome (32 of 32) was already realized by nl, so
    one new sensible A1 topic was required to continue volume growth.
    Sanity-checked per the standing authority: no duplicate id (34
    total outcomes after adding, confirmed via direct parse), valid
    prerequisite reference, all 4 modalities present, exactly 4
    assessment_requirements with 4 success_criteria (checked for the
    exact duplicate-key bug this project hit once before when adding a
    spine entry -- confirmed 136 total success_criteria lines
    corpus-wide, 34*4, no duplication).

    Continues the established storyline directly from unit32's
    cliffhanger ("Dan proberen we deze week iets van ons alle vier!").
    Unit32 established Lotte does yoga, Omar plays football, Sander
    runs, Fenna swims -- this unit has the same four characters use
    their phones to actually arrange the plan, closing that loop in
    lesson06. No new facts about existing characters' appearance, job,
    or family are introduced (checked against unit05/17/21/30 for
    contradiction risk); the only new facts are their tech habits
    (Lotte calls rather than messaging, Omar has no computer at home
    but uses internet on his phone, Sander looks up the weather
    forecast every morning, Fenna often messages Lotte), none of which
    conflict with anything previously established. Register is
    informal jij/je throughout, matching every other A1 unit.

    Six lessons, recognition->drag->production pacing (§2): 01 teaches
    "gebruiken" (to use, not separable) plus "de telefoon", "de
    computer", "het internet"; 02 teaches "de app" and "het bericht"
    (a message), explicitly calling out the compound tie to unit19's
    already-taught "het weerbericht" (weer + bericht) via a
    grammar_note, and reuses unit22's already-taught "sturen" (to
    send) rather than re-teaching it; 03 teaches the separable verb
    "opzoeken" (to look up) via a grammar_note that explicitly
    contrasts it with unit10's original opstaan/aankleden/afwassen
    separable-verb set AND unit32's hardlopen non-separable note,
    reusing unit19's "het weerbericht" and unit32's "hardlopen" in the
    same example to bridge the technology and sports units together;
    04 is a taalcafé dialogue where Lotte proposes Saturday 10am in
    the park via the group's messaging habit and Omar looks up the
    forecast, reusing unit13's "Goed idee", unit04's "... uur" time
    pattern, unit19's "zonnig", and unit01's "Tot ziens!" extended to
    "Tot zaterdag!" via a grammar_note; 05 is a reading comparing all
    four characters' device habits ("wie gebruikt wat") mirroring
    unit32 lesson05's "wie doet welke sport" shape; 06 is a wrap-up
    taalcafé dialogue where the group confirms the Saturday plan,
    closing BOTH unit32's sports-plan loop and this unit's
    messaging-thread loop in the same scene.

    Grammar-scope check: perfect tense (already taught, unit12) was
    deliberately NOT combined with the new separable verb "opzoeken"
    anywhere in this unit -- the corpus has no precedent yet for a
    separable verb's past participle (would be "opgezocht"), so every
    reference to opzoeken in this unit stays present tense to avoid
    introducing untaught grammar under an unrelated unit's outcome.
    Lesson06's Lotte line "Ik zie het bericht" deliberately reuses
    lesson04's exact sentence in present tense rather than a perfect
    "Ik heb het bericht gezien" for the same reason.

    Every kind: vocabulary card has a real example built only from
    vocabulary already taught in this unit or earlier. Total new
    nouns/verbs taught: gebruiken, de telefoon, de computer, het
    internet, de app, het bericht, opzoeken (7) -- within the
    established 6-10 "don't pad" range.

    fill_in_blank ambiguity (§13/§17) checked per the established
    pattern: lesson01/02 avoid fill_in_blank entirely (translation +
    dialogue_response/writing_prompt instead, since every candidate
    verb taught so far -- gebruiken, sturen, lezen -- would be a
    semantically different but still grammatically valid completion of
    "Ik ___ mijn telefoon" style frames). Lesson03's single
    fill_in_blank blanks only the separable particle "op" in "Ik zoek
    het weerbericht ___." -- no other taught particle (aan/uit/in)
    produces a sensible completion of this specific sentence, so it
    has exactly one correct candidate. Lessons04/06 (dialogue) and 05
    (reading) have no fill_in_blank, matching unit32's own shape.

    Every multi-clause accepted_answers list is authored with
    period-joined, comma-joined, and conjunction-joined variants per
    §12.

    Matching_pairs pairs checked for duplicate right-hand text within
    each exercise -- no two pairs in any single exercise share
    identical left or right text. All exercises use 6-7 pairs, within
    the established 6-12 range.

    Audio assets declared for generation. Pending fresh-context review
    and Ramin's native-speaker pass.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte,
    Omar, Sander, and Fenna all use informal jij/je throughout this
    unit -- no formal u appears, matching every other A1 unit's
    register_policy.

