generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation. Checked firecrawl search/scrape for an
    intermediate-level public-domain Dutch course first (per
    AUTHORING_GUIDE.md §10) -- firecrawl is still returning HTTP 402
    (account credits exhausted, a standing outage as of this dispatch),
    and no genuine FSI/Peace-Corps-equivalent intermediate Dutch source is
    known to exist. Built from general Dutch grammar knowledge, not
    adapted from a source. nl's ninth B1 unit, the third of five closing
    the outcome-coverage gap documented in b1_unit06/07/08's own
    provenance notes. Targets universal.b1.debate.agree_disagree_with_
    reasons, the fourth of six first-wave outcomes shared with
    fa/ro/hi/prs.
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    nl's ninth B1 unit. Targets universal.b1.debate.agree_disagree_with_
    reasons -- stating agreement or disagreement with someone else's
    opinion and supporting your own position with a reason, using a
    subordinate that-clause to reference the other person's view. Dutch's
    idiomatic construction for this, *(niet) eens zijn met* (to (dis)agree
    with), happens to build the required *dat*-clause directly into its
    own grammar: *ik ben het ermee eens dat X* literally means "I am
    [it/that] with-it agreed that X" -- the *dat*-clause naming the
    claim being agreed with is structurally obligatory, not bolted on.
    This is DIFFERENT from nl's own existing b1_unit02
    (universal.b1.opinions.debate_with_concession_and_nuance), which
    taught *eens zijn* + concession words (*hoewel*, *toch*) around a
    "less meat" topic -- this unit uses a fresh topic (a four-day work
    week) and focuses specifically on the agree/disagree-plus-reason
    structure and the genuinely tricky agreement/disagreement contrast:
    *ik ben het ERMEE eens* (contracted *er+mee*, positive) versus *ik
    ben het ER NIET MEE eens* (split, *niet* wedged between *er* and
    *mee* -- *ermee* cannot host *niet* internally, a real and
    non-obvious Dutch grammar fact). Lesson03 adds a second real pattern
    reinforcing the "reference the other person's view" half of the
    outcome even more explicitly: *jij zegt dat X, maar ik ben het er
    niet mee eens* (you say that X, but I disagree). Continues Lotte
    and Omar's established informal jij/je register. No sibling-
    direction file (nl-en) was consulted. All vocabulary, including
    basic function words, is introduced self-contained within this
    file. Word_order exercises use the shorter core clause (without the
    *omdat*-reason clause) to keep tile count reasonable; translation/
    speak/write exercises use the full sentence with its reason clause.
    Not yet reviewed -- status: unreviewed is accurate, a fresh-context
    review per AUTHORING_GUIDE.md §20 has not yet run against this file.

