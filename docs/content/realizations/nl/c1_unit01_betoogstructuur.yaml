  - content_key: nl.c1.audio.betoogstructuur.betoog.01
    language: nl
    text: >-
      Om te beginnen schets ik het probleem: de binnenstad is druk en
      ongezond. Vervolgens bespreek ik het belangrijkste voordeel van minder
      auto's, namelijk schonere lucht. Daarbij hoort ook meer ruimte voor
      voetgangers. Nu maak ik even een uitstapje. Winkeliers vrezen soms
      omzetverlies, een begrijpelijke zorg. Maar om terug te komen op mijn
      hoofdgedachte: een aantrekkelijke binnenstad trekt juist bezoekers.
      Alles bij elkaar pleit dit voor een geleidelijke autoluwe binnenstad.
    voice_hint: neutral_young_adult_thoughtful
    status: pending_generation
