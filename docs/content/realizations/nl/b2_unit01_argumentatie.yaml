schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is nl's
    first B2 unit. No adaptable intermediate/upper-intermediate
    public-domain Dutch source exists (the FSI Dutch Basic Course used
    for nl's A1/A2 is beginner-only, same shape as FSI Persian having no
    upper volume), so this was built from general Dutch grammar/discourse
    knowledge, the same honest-disclosure precedent nl's first B1 unit
    set. Sibling-isolation honored: the X->en B2 argumentation
    realization and every fa/prs/de B2 file were treated as
    non-existent; only nl's OWN earlier realization content (the
    Lotte/Omar storyline from a2_unit25_meningen) was consulted for
    character canon, which is not a sibling-direction violation.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness/idiom of every connective frame
    (aan de ene kant / aan de andere kant, dat neemt niet weg dat,
    kortom, daarentegen) and that the informal jij/je register is
    consistent and correctly conjugated throughout; (2) the culminating
    writing exercise (lesson06 exercise06) is graded against a fixed
    multi-sentence string -- confirm the accepted-answer punctuation
    variants are complete enough that a correct learner is never marked
    wrong (only the all-periods and no-trailing-period forms are
    currently supplied; a learner who runs the four sentences together
    without internal periods would exceed distance-1 typo tolerance),
    and decide whether more variants are needed or the item should be
    reframed; (3) whether 'op kantoor werken' vs 'op kantoor' phrasing
    and 'thuiswerken' as a mass noun/verb are handled naturally; (4)
    confirm 'productiever', 'zwaarder wegen', 'daar zit wat in', and
    'videobellen' read as current everyday Dutch.
  notes: >-
    First Dutch B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence):
    state a claim, support it with reasons/evidence, acknowledge the
    strongest opposing point, and rebut it without conceding. Theme:
    thuiswerken (working from home) -- one coherent debatable everyday
    issue across all six lessons. Lesson arc mirrors the argument
    structure itself: L01 stating a claim, L02 supporting it (ten eerste
    / bijvoorbeeld / uit onderzoek blijkt dat), L03 acknowledging the
    opposing point (aan de ene kant ... aan de andere kant / hoewel /
    natuurlijk / dat klopt), L04 rebutting without conceding (toch /
    daarentegen / echter / dat neemt niet weg dat / kortom), L05 an
    argumentative reading text (distinguish the author's claim from the
    objection answered), L06 the culminating production -- a Lotte/Omar
    debate for the listening requirement plus a speaking task and a
    writing task that each require a FULL argument (claim + support +
    acknowledged objection + rebuttal), not just connective drilling.
    Register: informal jij/je throughout, per the nl lane pin; Lotte and
    Omar continue their established informal register from
    a2_unit25_meningen. All vocabulary is introduced self-contained
    within this file (B2 is a separate Course row from B1, so a B2
    learner never sees B1 lexemes at runtime -- same self-containment
    precedent as nl's first B1 unit). No sibling-direction file was
    consulted.

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Informal jij/je throughout (nl lane pin). B2 argumentation layers
    discourse connectives and signposting onto that register --
    bijvoorbeeld, ten eerste, aan de ene kant ... aan de andere kant,
    toch, hoewel, daarentegen, kortom -- while keeping the everyday
    informal address (je bespaart, mis je, denk je). Lotte and Omar
    continue the informal jij/je they use with each other in
    a2_unit25_meningen.

media_assets:
  - content_key: nl.b2.audio.argumentatie.claim_thuiswerken.01
    language: nl
    text: "Ik vind dat thuiswerken beter is dan op kantoor werken."
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: nl.b2.audio.argumentatie.ten_eerste_reistijd.01
    language: nl
    text: "Ten eerste bespaar je veel reistijd."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.b2.audio.argumentatie.natuurlijk_contact.01
    language: nl
    text: "Natuurlijk mis je soms het contact met je collega's."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.b2.audio.argumentatie.toch_voordelen.01
    language: nl
    text: "Toch wegen de voordelen zwaarder dan de nadelen."
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.b2.audio.argumentatie.dialogue.thuiswerken.01
    language: nl
    text: >-
      Lotte: Ik vind dat thuiswerken beter is dan op kantoor werken.
      Omar: Waarom denk je dat? Lotte: Ten eerste bespaar je veel
      reistijd, en uit onderzoek blijkt dat thuiswerkers productiever
      zijn. Omar: Aan de andere kant mis je het contact met je
      collega's. Lotte: Dat klopt, maar dat neemt niet weg dat je kunt
      videobellen. Kortom, de voordelen wegen zwaarder. Omar: Daar zit
      wat in.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.b2.unit01.argumentatie
    title: "Argumenteren"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.argumentation.defend_a_position_with_evidence
    planned_lesson_count: 6

    lessons:
      - content_key: nl.b2.unit01.lesson01.een_standpunt
        title: "Een standpunt innemen"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: nl.b2.unit01.lesson01.teach.thuiswerken
            kind: vocabulary
            target: {text: "thuiswerken", language_code: nl, direction: ltr}
            introduced_tokens: [thuiswerken]
            example: {text: "Thuiswerken bespaart tijd.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson01.teach.op_kantoor_werken
            kind: phrase
            target: {text: "op kantoor werken", language_code: nl, direction: ltr}
            introduced_tokens: [op, kantoor, werken]
          - content_key: nl.b2.unit01.lesson01.teach.standpunt
            kind: vocabulary
            target: {text: "een standpunt", language_code: nl, direction: ltr}
            introduced_tokens: [een, standpunt]
            example: {text: "Ik heb een duidelijk standpunt.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson01.teach.ik_vind_dat
            kind: phrase
            target: {text: "Ik vind dat...", language_code: nl, direction: ltr}
            introduced_tokens: [ik, vind, dat]
          - content_key: nl.b2.unit01.lesson01.teach.volgens_mij
            kind: phrase
            target: {text: "Volgens mij...", language_code: nl, direction: ltr}
            introduced_tokens: [volgens, mij]
          - content_key: nl.b2.unit01.lesson01.teach.beter
            kind: vocabulary
            target: {text: "beter", language_code: nl, direction: ltr}
            introduced_tokens: [beter]
            example: {text: "Deze aanpak is beter.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson01.teach.dan
            kind: vocabulary
            target: {text: "dan", language_code: nl, direction: ltr}
            introduced_tokens: [dan]
            example: {text: "Thuiswerken is beter dan reizen.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Ik vind dat thuiswerken beter is dan op kantoor werken.", language_code: nl, direction: ltr}
            introduced_tokens: [is]
          - content_key: nl.b2.unit01.lesson01.teach.ermee_eens
            kind: phrase
            target: {text: "Ik ben het ermee eens.", language_code: nl, direction: ltr}
            introduced_tokens: [ben, het, ermee, eens]
          - content_key: nl.b2.unit01.lesson01.teach.grammar_standpunt
            kind: grammar_note
            target: {text: "Ik vind dat thuiswerken beter is dan op kantoor werken. Volgens mij is dat beter.", language_code: nl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: nl.b2.unit01.lesson01.exercise01.recognize_standpunt
            type: multiple_choice
            tested_text: standpunt
            prompt: {target_blocks: [{text: standpunt, language_code: nl, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson01.exercise02.listen_claim
            type: listen_select
            tested_text: "Ik vind dat thuiswerken beter is dan op kantoor werken"
            media_asset_key: nl.b2.audio.argumentatie.claim_thuiswerken.01
            prompt: {target_blocks: []}
          - content_key: nl.b2.unit01.lesson01.exercise03.match_claim_words
            type: matching_pairs
            tested_text: "thuiswerken op kantoor werken standpunt ik vind dat volgens mij beter dan ik ben het ermee eens"
            prompt: {target_blocks: []}
            pairs:
              - {left: thuiswerken, right: "working from home"}
              - {left: "op kantoor werken", right: "working at the office"}
              - {left: "een standpunt", right: "a position / viewpoint"}
              - {left: "Ik vind dat...", right: "I think that..."}
              - {left: "Volgens mij...", right: "In my opinion..."}
              - {left: beter, right: better}
              - {left: dan, right: than}
              - {left: "Ik ben het ermee eens.", right: "I agree with it."}
          - content_key: nl.b2.unit01.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Ik vind dat thuiswerken beter is"
            prompt: {target_blocks: []}
            word_bank: [Ik, vind, dat, thuiswerken, beter, is]
          - content_key: nl.b2.unit01.lesson01.exercise05.translate_volgens_mij
            type: translation
            tested_text: "Volgens mij is thuiswerken beter"
            prompt: {target_blocks: [{text: "In my opinion, working from home is better.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson01.exercise06.speak_ermee_eens
            type: speak_response
            tested_text: "Ik ben het ermee eens"
            prompt: {target_blocks: [{text: "Say aloud in Dutch: I agree with it.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson01.exercise07.write_claim
            type: writing_prompt
            tested_text: "Ik vind dat thuiswerken beter is dan op kantoor werken"
            prompt: {target_blocks: [{text: "Write in Dutch: I think that working from home is better than working at the office.", language_code: en, direction: ltr}]}

      - content_key: nl.b2.unit01.lesson02.argumenten_geven
        title: "Argumenten geven"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
