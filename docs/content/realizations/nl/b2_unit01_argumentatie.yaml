            prompt: {target_blocks: [{text: "Write a full argument in Dutch defending your position. Write these four sentences, using ten eerste, natuurlijk and toch as signposts: (1) I think working from home is better than working at the office. (2) Firstly, you save a lot of commute time. (3) Of course, you sometimes miss your colleagues. (4) Still, the advantages weigh heavier.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson06.exercise07.respond_defend
