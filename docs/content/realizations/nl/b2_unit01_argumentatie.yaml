            kind: vocabulary
            target: {text: "omdat", language_code: nl, direction: ltr}
            introduced_tokens: [omdat]
            example: {text: "Ik werk thuis, omdat het rustig is.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson02.teach.want
            kind: vocabulary
            target: {text: "want", language_code: nl, direction: ltr}
            introduced_tokens: [want]
            example: {text: "Ik blijf thuis, want dat is fijn.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson02.teach.ten_eerste_tweede
