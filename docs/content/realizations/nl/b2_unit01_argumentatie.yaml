            type: speak_response
            tested_text: "Ik vind dat thuiswerken beter is dan op kantoor werken. Ten eerste bespaar je veel reistijd. Natuurlijk mis je soms je collega's. Toch wegen de voordelen zwaarder"
            prompt: {target_blocks: [{text: "Defend a position aloud in Dutch with a full argument. Say these four sentences, using ten eerste, natuurlijk and toch as signposts: (1) I think working from home is better than working at the office. (2) Firstly, you save a lot of commute time. (3) Of course, you sometimes miss your colleagues. (4) Still, the advantages weigh heavier.", language_code: en, direction: ltr}]}
