          - content_key: nl.b2.unit01.lesson03.exercise02.listen_natuurlijk_contact
            type: listen_select
            tested_text: "Natuurlijk mis je soms het contact met je collega's"
            media_asset_key: nl.b2.audio.argumentatie.natuurlijk_contact.01
            prompt: {target_blocks: []}
          - content_key: nl.b2.unit01.lesson03.exercise03.match_concession_words
            type: matching_pairs
            tested_text: "aan de ene kant aan de andere kant hoewel natuurlijk dat klopt sommigen vinden dat collega's missen"
            prompt: {target_blocks: []}
            pairs:
              - {left: "aan de ene kant", right: "on the one hand"}
