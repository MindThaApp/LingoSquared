      - content_key: nl.b2.unit01.lesson05.een_betoog_lezen
        title: "Een betoog lezen"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: nl.b2.unit01.lesson05.teach.betoog
            kind: reading
            target:
              text: >-
                Steeds meer mensen werken thuis. Ik ben ervan overtuigd
                dat dat een goede ontwikkeling is. Ten eerste bespaar je
                veel reistijd, en uit onderzoek blijkt dat thuiswerkers
                vaak productiever zijn. Natuurlijk zeggen sommigen dat je
                thuis het contact met collega's mist. Dat klopt, maar dat
                neemt niet weg dat je nog steeds kunt bellen en
                videobellen. Kortom, de voordelen wegen zwaarder dan de
                nadelen.
              language_code: nl
              direction: ltr
            introduced_tokens: [steeds, meer, mensen, ervan, overtuigd, goede, ontwikkeling, vaak, zijn, zeggen, nog, kunt, bellen, en, videobellen, dit, thuiswerkers]
        exercises:
          - content_key: nl.b2.unit01.lesson05.exercise01.read_claim
            type: reading_comprehension
            tested_text: "een goede ontwikkeling"
            prompt: {target_blocks: [{text: "What is the author's main claim about working from home?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson05.exercise02.read_objection
            type: reading_comprehension
            tested_text: "het contact met collega's mist"
            prompt: {target_blocks: [{text: "Which objection does the author acknowledge before answering it?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson05.exercise03.read_rebuttal
            type: reading_comprehension
            tested_text: "bellen en videobellen"
            prompt: {target_blocks: [{text: "How does the author answer that objection?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson05.exercise04.read_conclusion
            type: reading_comprehension
            tested_text: "de voordelen wegen zwaarder"
            prompt: {target_blocks: [{text: "What is the author's overall conclusion?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "steeds meer mensen ervan overtuigd ontwikkeling thuiswerkers videobellen"
            prompt: {target_blocks: []}
            pairs:
              - {left: "steeds meer", right: "more and more"}
              - {left: mensen, right: people}
              - {left: "ervan overtuigd", right: "convinced of it"}
              - {left: ontwikkeling, right: development}
              - {left: thuiswerkers, right: "people who work from home"}
              - {left: videobellen, right: "to video-call"}
          - content_key: nl.b2.unit01.lesson05.exercise06.translate_overtuigd
            type: translation
            tested_text: "Ik ben ervan overtuigd dat dit een goede ontwikkeling is"
            prompt: {target_blocks: [{text: "I am convinced that this is a good development.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson05.exercise07.write_steeds_meer
            type: writing_prompt
            tested_text: "Steeds meer mensen werken thuis"
            prompt: {target_blocks: [{text: "Write in Dutch: More and more people work from home.", language_code: en, direction: ltr}]}

