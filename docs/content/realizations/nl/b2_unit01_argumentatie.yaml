            introduced_tokens: [reistijd]
            example: {text: "Ik bespaar veel reistijd.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson02.teach.besparen
            kind: vocabulary
            target: {text: "besparen", language_code: nl, direction: ltr}
            introduced_tokens: [besparen, bespaar, bespaart]
            example: {text: "Je kunt veel tijd besparen.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson02.teach.veel
            kind: vocabulary
            target: {text: "veel", language_code: nl, direction: ltr}
            introduced_tokens: [veel]
            example: {text: "Ik bespaar veel tijd.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit01.lesson02.teach.je
            kind: vocabulary
            target: {text: "je", language_code: nl, direction: ltr}
