          - content_key: nl.b2.unit01.lesson02.exercise03.match_argument_words
            type: matching_pairs
            tested_text: "omdat want ten eerste ten tweede daarnaast bijvoorbeeld uit onderzoek blijkt dat reistijd"
            prompt: {target_blocks: []}
            pairs:
              - {left: omdat, right: because}
              - {left: want, right: "because / for"}
              - {left: "ten eerste", right: firstly}
              - {left: "ten tweede", right: secondly}
              - {left: daarnaast, right: "in addition"}
              - {left: bijvoorbeeld, right: "for example"}
