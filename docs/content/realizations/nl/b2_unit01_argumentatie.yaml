          - content_key: nl.b2.unit01.lesson03.exercise07.write_natuurlijk_contact
            type: writing_prompt
            tested_text: "Natuurlijk mis je soms het contact met collega's"
            prompt: {target_blocks: [{text: "Write in Dutch: Of course, you sometimes miss the contact with colleagues.", language_code: en, direction: ltr}]}

      - content_key: nl.b2.unit01.lesson04.weerleggen
        title: "Weerleggen"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: nl.b2.unit01.lesson04.teach.toch
