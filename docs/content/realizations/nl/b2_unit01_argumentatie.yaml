            type: translation
            tested_text: "Thuiswerken is beter, omdat je veel reistijd bespaart"
            prompt: {target_blocks: [{text: "Working from home is better, because you save a lot of commute time.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit01.lesson02.exercise06.translate_onderzoek
            type: translation
            tested_text: "Uit onderzoek blijkt dat thuiswerken productiever is"
