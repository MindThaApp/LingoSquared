      Geen broers. En jij? Lotte: Ik heb een broer en een zus. Omar: Wonen
      jouw ouders ook in Nederland? Lotte: Ja, mijn ouders wonen in
      Utrecht. En jouw familie? Omar: Mijn ouders wonen in Egypte, maar
