schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic room/housing vocabulary is scaffolded from the housing module
    of the FSI Dutch Basic Course (Foreign Service Institute, US
    Department of State -- public domain, no attribution required per
    docs/content/AUTHORING_GUIDE.md §10). The source presents these as
    isolated room-name substitution drills describing a generic
    detached house, with no continuous scenario; every sentence,
    exercise, and the Lotte/Omar storyline in this unit (Omar's new
    apartment in Utrecht, a modern rental scenario) are freshly
    authored in contemporary colloquial register, not copied or
    lightly edited from any 1960s-70s source text.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Initial six-lesson Dutch housing draft (spine outcome:
    universal.a1.housing.describe_home), continuing the Lotte/Omar
    storyline -- Omar has a new apartment in Utrecht (near where unit15's
    train trip ended). Lessons 1-4 deliberately keep their room-count/
    layout examples generic and unnamed so they never conflict with the
    specific facts about Omar's actual apartment (one bedroom, living
    room, kitchen, bathroom, balcony, no garden, small but cozy)
    established consistently across lesson05's reading and lesson06's
    dialogue, per AUTHORING_GUIDE §11. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. Pending fresh-context review and Ramin's
    native-speaker review. Audio assets are declared for generation.


    2026-07-06 density pass (Ramin flagged the A1 en-nl course as far
    too short, one word/question per teaching card): merged lesson01's
    5 single-word room-vocabulary cards into 2 (appartement/woonkamer/
    slaapkamer, keuken/badkamer) and lesson03's 2 single-word
    vocabulary cards (balkon, tuin) into 1 -- phrase, dialogue,
    grammar_note, and reading cards left untouched per the authoring
    convention that only bare-vocabulary cards get merged. Lessons 02,
    04, 05, 06 already had good density and were left alone. Overlay
    notes mixing Dutch inline with English now use the *asterisk*
    target-language-span convention (AUTHORING_GUIDE §15).

    2026-07-07 AUTHORING_GUIDE §16 retrofit: lesson02's match_counts
    (2->6) and lesson04's match_room_sizes (2->6) expanded using
    already-taught, generic room/feature vocabulary from this unit --
    no named-person facts introduced, keeping the same §11-driven
    generic/unnamed framing already established for lessons 1-4.
    Lessons 01/03 already had good density (4/6 pairs) and lesson05
    (reading-comprehension) is exempt. Re-validated/compiled clean.

    2026-07-07 AUTHORING_GUIDE.md #19 retrofit: every vocabulary card
    (4 total: lesson01's two merged room-word cards, lesson03's merged
    balkon/tuin card, lesson04's gezellig) gained example sentence(s)
    built from this unit's own taught material; schema_version bumped
    to 1.1 (missing examples are now a hard compiler error for this
    file). Example sentences are Claude-authored and pending
    fresh-context review.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other.

