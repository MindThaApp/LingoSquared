  - content_key: nl.a1.audio.housing.advertentie.01
    language: nl
    text: >-
      Appartement in Utrecht: één slaapkamer, een woonkamer, een
      keuken en een badkamer. Er is een balkon, maar geen tuin. Het
      appartement is klein maar gezellig.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - {content_key: nl.a1.audio.housing.hoe_is_appartement.01, language: nl, text: "Hoi Omar, hoe is je nieuwe appartement in Utrecht?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.housing.klinkt_fijn_langs.01, language: nl, text: "Dat klinkt fijn! Ik kom snel een keer langs.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.dialogue.nieuw_appartement.01
    language: nl
    text: >-
      Lotte: Hoi Omar, hoe is je nieuwe appartement in Utrecht? Omar:
      Het is klein maar gezellig. Ik heb één slaapkamer, een
      woonkamer, een keuken en een badkamer. Lotte: Heb je een
      balkon? Omar: Ja, ik heb een balkon, maar geen tuin. Lotte: Dat
      klinkt fijn! Ik kom snel een keer langs. Omar: Leuk, je bent
      altijd welkom.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

