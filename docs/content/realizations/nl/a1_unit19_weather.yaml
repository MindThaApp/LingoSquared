generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic weather-condition vocabulary is scaffolded from the FSI Dutch
    Basic Course (Foreign Service Institute, US Department of State --
    public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents these as isolated
    weather-word substitution drills with no continuous scenario;
    every sentence, exercise, and the Lotte/Omar weekend-planning
    storyline in this unit are freshly authored in modern colloquial
    register, not copied or lightly edited from any 1960s-70s source
    text.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Initial six-lesson Dutch weather draft (spine outcome:
    universal.a1.weather.describe_basic_weather), continuing the
    Lotte/Omar storyline -- they plan a weekend walk depending on the
    forecast, reusing the Zullen we ...? plan-making pattern from
    unit11. Cross-checked the forecast facts (sunny Saturday, rain
    Sunday) for consistency between lesson05's reading and lesson06's
    dialogue per AUTHORING_GUIDE §11. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. A fresh-context review ran and found two
    exercises (lesson04/lesson06 "agree and suggest" responses) whose
    accepted_answers omitted the literal exclamation/period-punctuated
    form actually used in the teaching cards -- added. No grammar
    errors, spine drift, jargon leaks, audio mismatches, or YAML
    footguns found. Re-validated (0 errors/0 warnings across the full
    nl course). Still needs Ramin's native-speaker pass before status:
    reviewed. Audio assets are declared for generation.


    2026-07-06 density pass (Ramin flagged the A1 en-nl course as far
    too short, one word/question per teaching card): reviewed every
    lesson in this unit for consecutive bare-vocabulary teaching cards
    to merge -- none qualified (each lesson has at most one standalone
    `kind: vocabulary` card; the rest are already multi-word phrase/
    dialogue/reading cards), so no teaching-card merges were made here.
    Card counts per lesson (5, 3, 3, 4, 1, 5) were already within the
    target density range. Overlay notes mixing Dutch inline with
    English now use the *asterisk* target-language-span convention
    (AUTHORING_GUIDE §15).

    2026-07-07 AUTHORING_GUIDE §16 retrofit: lesson01's match_conditions
    (3->6), lesson03's match_forecast_days (2->6), and lesson04's
    match_weather_plans (2->6) all expanded using already-taught
    vocabulary from those lessons and earlier ones in the unit.
    Lesson02's match_temperatures (already 5 pairs) and lesson05
    (reading-comprehension) left untouched. Re-validated/compiled
    clean.

    2026-07-07 AUTHORING_GUIDE.md #19 retrofit: every vocabulary card
    (3 total: lesson01's weer, lesson03's weerbericht, lesson04's
    wandeling) gained an example sentence built from this unit's own
    taught material; schema_version bumped to 1.1 (missing examples
    are now a hard compiler error for this file). Example sentences
    are Claude-authored and pending fresh-context review.

    2026-07-07 fresh-context #19 review (separate reviewer): checked
    every new example/example_gloss pair in units 19-23 (A1) and 24-28
    (A2) against naturalness, register, word-presence, comprehensibility,
    §3 dialect, §10 non-import, and §11 fact-consistency. One real fix
    here: lesson03's weerbericht example read "Hoe is het weerbericht?"
    -- not idiomatic (weerbericht is a report/broadcast, not a thing
    that takes a quality-"hoe" question the way het weer does) and
    introduced "hoe," a word not yet taught in this lesson or unit --
    changed to "Wat is het weerbericht?", reusing wat/is/het, all
    already taught earlier in lesson01, and the more natural way to
    ask what a forecast says (parallel to "Wat is het nieuws?").
    Overlay's example_gloss updated to match ("What's the weather
    forecast?"). The weer and wandeling cards' examples (each reusing
    the immediately-following teaching card's exact sentence) were
    checked and approved as-is -- a deliberate, harmless preview
    pattern, not a defect. Re-validated/compiled clean.

    2026-07-10 fresh-context review (zero access to authoring reasoning):
    found and fixed two real bugs the earlier passes missed.
    (1) lesson02.exercise03.match_temperatures's realization pairs had
    grown to 5 items but one entry was the full sentence "Het is warm
    vandaag." -> "It is warm today." instead of the bare word "warm" ->
    "warm" that the exercise's own instruction ("Match each Dutch word
    to its meaning") and every sibling pair call for -- fixed to the
    bare word, and the overlay's accepted_answers (which still only had
    the original 2 pairs) expanded to match all 5 displayed pairs.
    (2) lesson06.exercise07.listen_type_closing was wired to the FULL
    six-turn dialogue audio clip (nl.a1.audio.dialogue.weekend_plannen.
    01) while only asking the learner to type Lotte's final line --
    since the instruction is generic ("Listen and type the complete
    Dutch sentence") with no indication of which of the six lines to
    transcribe, this was genuinely confusing/unanswerable-with-
    confidence. Added a new dedicated single-utterance audio asset
    (nl.a1.audio.weather.perfect_film.01) containing just "Perfect, dan
    kijken we een film." and rewired the exercise to it. Also checked
    lesson06's dialogue_comprehension distractors for the
    same-speaker-verbatim ambiguity bug class (clean -- "rain all day"
    as a Saturday-weather distractor is unambiguous because Omar's own
    sentence uses a clear "maar" contrast between the two days). No
    other issues found. Re-validated/compiled clean.

    Language review 2026-10-20 (session 9, en-nl): 0 fixes in the realization; (2 fixes in the en-nl overlay). V2 inversion after Morgen/Zaterdag, als-clause inversion and asset-text sync checked. NATIVE FLAGS: weerbericht example question.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other.

