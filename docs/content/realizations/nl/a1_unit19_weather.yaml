    language: nl
    text: >-
      Weerbericht: zaterdag is het zonnig en warm. Zondag regent het
      de hele dag.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a1.audio.dialogue.weekend_plannen.01
    language: nl
    text: >-
      Lotte: Wat voor weer is het dit weekend? Omar: Zaterdag is het
      zonnig en warm, maar zondag regent het de hele dag. Lotte:
      Zullen we dan zaterdag een wandeling maken? Omar: Goed idee. En
      zondag blijven we lekker binnen. Lotte: Perfect, dan kijken we
      een film.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.a1.unit19.weather
    title: "Het weer"
    section: reading_writing
    spine_outcome_ids: [universal.a1.weather.describe_basic_weather]
    planned_lesson_count: 6
    lessons:
      - content_key: nl.a1.unit19.lesson01.wat_voor_weer
        title: "Wat voor weer is het?"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: nl.a1.unit19.lesson01.teach.weer, kind: vocabulary, target: {text: "het weer", language_code: nl, direction: ltr}, introduced_tokens: [het, weer], example: {text: "Wat voor weer is het?", language_code: nl, direction: ltr}}
          - {content_key: nl.a1.unit19.lesson01.teach.wat_voor_weer, kind: phrase, target: {text: "Wat voor weer is het?", language_code: nl, direction: ltr}, introduced_tokens: [Wat, voor, weer, is, het]}
          - {content_key: nl.a1.unit19.lesson01.teach.zonnig, kind: phrase, target: {text: "Het is zonnig.", language_code: nl, direction: ltr}, introduced_tokens: [Het, is, zonnig]}
          - {content_key: nl.a1.unit19.lesson01.teach.regent, kind: phrase, target: {text: "Het regent.", language_code: nl, direction: ltr}, introduced_tokens: [Het, regent]}
          - {content_key: nl.a1.unit19.lesson01.teach.bewolkt, kind: phrase, target: {text: "Het is bewolkt.", language_code: nl, direction: ltr}, introduced_tokens: [Het, is, bewolkt]}
        exercises:
          - {content_key: nl.a1.unit19.lesson01.exercise01.choose_sunny, type: multiple_choice, tested_text: "Het is zonnig", prompt: {target_blocks: [{text: "It is sunny.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson01.exercise02.listen_rain, type: listen_select, tested_text: "Het regent", media_asset_key: nl.a1.audio.weather.regent.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit19.lesson01.exercise03.match_conditions, type: matching_pairs, tested_text: "zonnig regent bewolkt weer", prompt: {target_blocks: []}, pairs: [{left: zonnig, right: sunny}, {left: regent, right: raining}, {left: bewolkt, right: cloudy}, {left: "het weer", right: "the weather"}, {left: "Het is zonnig.", right: "It is sunny."}, {left: "Het is bewolkt.", right: "It is cloudy."}]}
          - {content_key: nl.a1.unit19.lesson01.exercise04.order_cloudy, type: word_order, tested_text: "Het is bewolkt", prompt: {target_blocks: []}, word_bank: [bewolkt, Het, is]}
          - {content_key: nl.a1.unit19.lesson01.exercise05.listen_order_sunny, type: listen_order, tested_text: "Het is zonnig", media_asset_key: nl.a1.audio.weather.zonnig.01, prompt: {target_blocks: []}, word_bank: [zonnig, Het, is]}
          - {content_key: nl.a1.unit19.lesson01.exercise06.complete_rain, type: fill_in_blank, tested_text: "Het regent", prompt: {target_blocks: [{text: "Wat voor weer is het? Het ___.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson01.exercise07.write_sunny, type: writing_prompt, tested_text: "Het is zonnig", prompt: {target_blocks: [{text: "Write in Dutch: it is sunny.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson01.exercise08.dictation_het_is_zonnig, type: dictation, tested_text: "Het is zonnig", media_asset_key: nl.a1.audio.weather.zonnig.01, prompt: {target_blocks: []}}

      - content_key: nl.a1.unit19.lesson02.koud_of_warm
        title: "Koud of warm?"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: nl.a1.unit19.lesson02.teach.koud, kind: phrase, target: {text: "Het is koud vandaag.", language_code: nl, direction: ltr}, introduced_tokens: [Het, is, koud, vandaag]}
          - {content_key: nl.a1.unit19.lesson02.teach.warm, kind: phrase, target: {text: "Het is warm vandaag.", language_code: nl, direction: ltr}, introduced_tokens: [Het, is, warm, vandaag]}
          - {content_key: nl.a1.unit19.lesson02.teach.niet_koud, kind: phrase, target: {text: "Het is niet koud, het is warm.", language_code: nl, direction: ltr}, introduced_tokens: [Het, is, niet, koud, warm]}
        exercises:
          - {content_key: nl.a1.unit19.lesson02.exercise01.choose_cold, type: multiple_choice, tested_text: "Het is koud vandaag", prompt: {target_blocks: [{text: "It is cold today.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson02.exercise02.listen_warm, type: listen_select, tested_text: "Het is warm vandaag", media_asset_key: nl.a1.audio.weather.warm.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit19.lesson02.exercise03.match_temperatures, type: matching_pairs, tested_text: "koud warm", prompt: {target_blocks: []}, pairs: [{left: koud, right: cold}, {left: warm, right: warm}, {left: zonnig, right: sunny}, {left: regent, right: raining}, {left: bewolkt, right: cloudy}]}
          - {content_key: nl.a1.unit19.lesson02.exercise04.order_cold, type: word_order, tested_text: "Het is koud vandaag", prompt: {target_blocks: []}, word_bank: [vandaag, Het, is, koud]}
          - {content_key: nl.a1.unit19.lesson02.exercise05.complete_warm, type: fill_in_blank, tested_text: "Het is niet koud het is warm", prompt: {target_blocks: [{text: "Het is niet koud, het is ___.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson02.exercise06.translate_cold, type: translation, tested_text: "Het is koud vandaag", prompt: {target_blocks: [{text: "It is cold today.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit19.lesson03.het_weerbericht
        title: "Het weerbericht"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: nl.a1.unit19.lesson03.teach.weerbericht, kind: vocabulary, target: {text: "het weerbericht", language_code: nl, direction: ltr}, introduced_tokens: [het, weerbericht], example: {text: "Wat is het weerbericht?", language_code: nl, direction: ltr}}
          - {content_key: nl.a1.unit19.lesson03.teach.morgen_zonnig, kind: phrase, target: {text: "Morgen is het zonnig.", language_code: nl, direction: ltr}, introduced_tokens: [Morgen, is, het, zonnig]}
          - {content_key: nl.a1.unit19.lesson03.teach.zaterdag_zondag, kind: phrase, target: {text: "Zaterdag is het zonnig en warm, maar zondag regent het de hele dag.", language_code: nl, direction: ltr}, introduced_tokens: [Zaterdag, is, het, zonnig, en, warm, maar, zondag, regent, de, hele, dag]}
        exercises:
          - {content_key: nl.a1.unit19.lesson03.exercise01.choose_tomorrow, type: multiple_choice, tested_text: "Morgen is het zonnig", prompt: {target_blocks: [{text: "Tomorrow it is sunny.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson03.exercise02.listen_forecast, type: listen_select, tested_text: "Morgen is het zonnig", media_asset_key: nl.a1.audio.weather.morgen_zonnig.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit19.lesson03.exercise03.match_forecast_days, type: matching_pairs, tested_text: "zaterdag zondag morgen weerbericht zonnig warm", prompt: {target_blocks: []}, pairs: [{left: zaterdag, right: "sunny and warm"}, {left: zondag, right: "rain all day"}, {left: morgen, right: tomorrow}, {left: "het weerbericht", right: "the weather forecast"}, {left: zonnig, right: sunny}, {left: warm, right: warm}]}
          - {content_key: nl.a1.unit19.lesson03.exercise04.order_forecast_tomorrow, type: word_order, tested_text: "Morgen is het zonnig", prompt: {target_blocks: []}, word_bank: [zonnig, Morgen, is, het]}
          - {content_key: nl.a1.unit19.lesson03.exercise05.complete_forecast, type: fill_in_blank, tested_text: "Zondag regent het de hele dag", prompt: {target_blocks: [{text: "Zondag regent het de hele ___.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson03.exercise06.write_forecast, type: writing_prompt, tested_text: "Zaterdag is het zonnig en warm", prompt: {target_blocks: [{text: "Write in Dutch: on Saturday it is sunny and warm.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit19.lesson04.plannen_maken_bij_weer
        title: "Plannen maken bij het weer"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: nl.a1.unit19.lesson04.teach.wandeling, kind: vocabulary, target: {text: "de wandeling", language_code: nl, direction: ltr}, introduced_tokens: [de, wandeling], example: {text: "Zullen we een wandeling maken?", language_code: nl, direction: ltr}}
          - {content_key: nl.a1.unit19.lesson04.teach.zullen_we_wandeling, kind: phrase, target: {text: "Zullen we een wandeling maken?", language_code: nl, direction: ltr}, introduced_tokens: [Zullen, we, een, wandeling, maken]}
          - {content_key: nl.a1.unit19.lesson04.teach.binnen_blijven, kind: phrase, target: {text: "Als het regent, blijven we binnen.", language_code: nl, direction: ltr}, introduced_tokens: [Als, het, regent, blijven, we, binnen]}
          - {content_key: nl.a1.unit19.lesson04.teach.goed_idee_laten, kind: phrase, target: {text: "Goed idee! Laten we een wandeling maken.", language_code: nl, direction: ltr}, introduced_tokens: [Goed, idee, Laten, we, een, wandeling, maken]}
        exercises:
          - {content_key: nl.a1.unit19.lesson04.exercise01.choose_walk_suggestion, type: multiple_choice, tested_text: "Zullen we een wandeling maken", prompt: {target_blocks: [{text: "Shall we go for a walk?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson04.exercise02.listen_walk_suggestion, type: listen_select, tested_text: "Zullen we een wandeling maken", media_asset_key: nl.a1.audio.weather.zullen_we_wandeling.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit19.lesson04.exercise03.match_weather_plans, type: matching_pairs, tested_text: "zonnig regent wandeling binnen goed idee bewolkt", prompt: {target_blocks: []}, pairs: [{left: zonnig, right: "go for a walk"}, {left: regent, right: "stay inside"}, {left: "de wandeling", right: "the walk"}, {left: binnen, right: inside}, {left: "Goed idee!", right: "Good idea!"}, {left: bewolkt, right: cloudy}]}
          - {content_key: nl.a1.unit19.lesson04.exercise04.order_stay_inside, type: word_order, tested_text: "Als het regent blijven we binnen", prompt: {target_blocks: []}, word_bank: [het, Als, regent, blijven, we, binnen]}
          - {content_key: nl.a1.unit19.lesson04.exercise05.complete_walk_suggestion, type: fill_in_blank, tested_text: "Zullen we een wandeling maken", prompt: {target_blocks: [{text: "Zullen we een ___ maken?", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson04.exercise06.respond_walk_suggestion, type: dialogue_response, tested_text: "Goed idee laten we een wandeling maken", prompt: {target_blocks: [{text: "Het is zonnig. Zullen we een wandeling maken?", language_code: nl, direction: ltr}]}}

      - content_key: nl.a1.unit19.lesson05.weerbericht_lezen
        title: "Een weerbericht lezen"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - content_key: nl.a1.unit19.lesson05.teach.weerbericht_tekst
            kind: reading
            target:
              text: >-
                Weerbericht: zaterdag is het zonnig en warm. Zondag
                regent het de hele dag.
              language_code: nl
              direction: ltr
            introduced_tokens: [Weerbericht, zaterdag, is, het, zonnig, en, warm, Zondag, regent, de, hele, dag]
        exercises:
          - {content_key: nl.a1.unit19.lesson05.exercise01.read_saturday, type: reading_comprehension, tested_text: "zonnig en warm", prompt: {target_blocks: [{text: "What will the weather be like on Saturday?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson05.exercise02.read_sunday, type: reading_comprehension, tested_text: "regent de hele dag", prompt: {target_blocks: [{text: "What will the weather be like on Sunday?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson05.exercise03.read_better_day, type: reading_comprehension, tested_text: "zaterdag", prompt: {target_blocks: [{text: "Which day would be better for a walk?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit19.lesson05.exercise04.match_forecast_summary, type: matching_pairs, tested_text: "zaterdag zondag weerbericht", prompt: {target_blocks: []}, pairs: [{left: zaterdag, right: "sunny and warm"}, {left: zondag, right: "rain all day"}]}
          - {content_key: nl.a1.unit19.lesson05.exercise05.listen_weather_report, type: listen_select, tested_text: "zondag regent het de hele dag", media_asset_key: nl.a1.audio.weather.weerbericht.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit19.lesson05.exercise06.write_forecast_summary, type: writing_prompt, tested_text: "Zaterdag is het zonnig en warm maar zondag regent het de hele dag", prompt: {target_blocks: [{text: "Write in Dutch: Saturday it is sunny and warm, but Sunday it rains all day.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit19.lesson06.weekend_plannen
        title: "Weekendplannen maken"
        spine_outcome_id: universal.a1.weather.describe_basic_weather
        teaching:
          - {content_key: nl.a1.unit19.lesson06.teach.lotte_ask_weather, kind: dialogue, target: {text: "Lotte: Wat voor weer is het dit weekend?", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Wat, voor, weer, is, het, dit, weekend]}
          - {content_key: nl.a1.unit19.lesson06.teach.omar_forecast, kind: dialogue, target: {text: "Omar: Zaterdag is het zonnig en warm, maar zondag regent het de hele dag.", language_code: nl, direction: ltr}, introduced_tokens: [Omar, Zaterdag, is, het, zonnig, en, warm, maar, zondag, regent, de, hele, dag]}
          - {content_key: nl.a1.unit19.lesson06.teach.lotte_suggest_walk, kind: dialogue, target: {text: "Lotte: Zullen we dan zaterdag een wandeling maken?", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Zullen, we, dan, zaterdag, een, wandeling, maken]}
          - {content_key: nl.a1.unit19.lesson06.teach.omar_agree, kind: dialogue, target: {text: "Omar: Goed idee. En zondag blijven we lekker binnen.", language_code: nl, direction: ltr}, introduced_tokens: [Omar, Goed, idee, En, zondag, blijven, we, lekker, binnen]}
          - {content_key: nl.a1.unit19.lesson06.teach.lotte_closing, kind: dialogue, target: {text: "Lotte: Perfect, dan kijken we een film.", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Perfect, dan, kijken, we, een, film]}
