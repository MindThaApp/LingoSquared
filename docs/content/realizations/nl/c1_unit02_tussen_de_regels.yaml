    language: nl
    text: >-
      De presentatie begon twintig minuten te laat, de microfoon viel uit en
      niemand kon de laatste dia lezen. Nou, dat ging soepel. Inderdaad, niet
      bepaald vlekkeloos. En de directeur zei dat er ruimte voor verbetering
      was. Dat is zacht uitgedrukt. Zijn woorden klonken beleefd, maar tussen
      de regels door was hij behoorlijk ontevreden.
