      tested_text: Dit brood is vers Dat broodje is goedkoop Ik neem deze rozen
      prompt:
        target_blocks:
        - {text: 'Write exactly three Dutch sentences: (1) this bread is fresh (dit); (2) that bread roll is cheap (dat); (3) say that you take these roses (deze).', language_code: en, direction: ltr}
