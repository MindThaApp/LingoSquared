      - {left: Dat broodje is goedkoop., right: That bread roll is cheap.}
      - {left: Dan neem ik dat broodje., right: Then I will take that bread roll.}
      - {left: Ik neem deze taart en deze koek., right: I take this cake and this biscuit.}
      - {left: Dit bloemetje is mooi!, right: This small bunch of flowers is beautiful!}
