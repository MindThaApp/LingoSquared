schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A2
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    The formal register pattern for a medical consultation (describing
    a symptom's duration and severity, understanding a diagnosis and
    treatment instructions) is scaffolded from the FSI Dutch Basic
    Course (Foreign Service Institute, US Department of State --
    public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source frames this around a
    1960s-70s clinic visit with dated register; the specific scenario
    (a Dutch huisarts consultation, a griepje diagnosis, a
    voorgeschreven recept) reflects contemporary Dutch primary care
    and is freshly authored, not translated or lightly edited from
    the source.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Fourth Dutch A2 unit (spine outcome:
    universal.a2.health.attend_doctor_appointment, newly added to
    universal_spine.yaml this session), continuing the Lotte/Omar
    storyline -- Omar's cold from unit16 hasn't improved after three
    days (the exact threshold unit16's own reading text gave for
    seeing the huisarts), so he now has a real consultation. The
    specific facts (three days of headache and fever, a griepje
    diagnosis, twice-daily pills) are stated consistently between
    lesson02/lesson04's teaching examples, lesson05's reading, and
    lesson06's dialogue per AUTHORING_GUIDE §11. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. Every listen_select/listen_order/
    listen_type/dialogue_comprehension exercise double-checked against
    its media_asset_key's declared text before finalizing, after two
    audio-mismatch bugs were caught in an earlier A2 review round; the
    lesson06 opening listen_select uses a dedicated short audio asset
    rather than the full dialogue clip, matching the established
    convention. A fresh-context review ran (audio fidelity held up
    clean) and found one real gap this note's original §11 claim
    missed: lesson04 teaches "kom over een week terug als het niet
    beter gaat" as if the huisarts says it during the visit, but the
    original lesson06 dialogue never included that line -- fixed by
    adding it to the doctor's actual closing turn (dialogue audio text,
    teaching card, and the comprehension exercise that tests the
    doctor's instructions, all updated together). Also fixed a minor
    mixed-language-pairing inconsistency in lesson05's matching
    exercise (one pair kept the Dutch answer untranslated while its
    siblings were in English). Noted but not remediated here: the
    spine's `describe_symptom_in_detail` requirement mentions severity,
    which this unit only asks about (hoe erg is de pijn?) without ever
    having Omar answer it in production -- flagged for a future
    addition, not a blocking defect. Re-validated (0 errors/0 warnings
    across the full nl course, including the real compile step).
    Additionally retrofitted per new AUTHORING_GUIDE §16 (found live
    2026-07-06, Ramin's direct feedback): matching_pairs exercises
    expanded from 2-3 pairs to 4-8 pairs across lessons 01-04, pooling
    forward from vocabulary already taught earlier in the unit.
    Lesson01's match_appointment_phrases stays at 4 pairs (capped by
    lesson01 being the unit's first lesson); lesson05's
    match_summary_points intentionally kept at 3 pairs -- it's a
    structural reading-comprehension check, not a vocabulary drill.
    Still needs Ramin's native-speaker pass before status: reviewed.
    Audio assets are declared for generation.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Omar
    and the huisarts use the formal u throughout this unit, the same
    register convention as units 24 and 26.

