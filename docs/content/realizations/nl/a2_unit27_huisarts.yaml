  - {content_key: nl.a2.audio.huisarts.afspraak_maken.01, language: nl, text: "Ik wil graag een afspraak maken bij de huisarts.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.huisarts.reden_bezoek.01, language: nl, text: "Wat is de reden van uw bezoek?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.huisarts.wat_zijn_klachten.01, language: nl, text: "Goedemorgen, wat zijn uw klachten?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.huisarts.drie_dagen_klachten.01, language: nl, text: "Ik heb al drie dagen hoofdpijn en koorts.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.huisarts.griepje_diagnose.01, language: nl, text: "U heeft waarschijnlijk een griepje. Het is niet ernstig.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.huisarts.pillen_innemen.01, language: nl, text: "Neem de pillen twee keer per dag in en rust goed uit.", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: nl.a2.audio.huisarts.samenvatting.01
    language: nl
    text: >-
      Diagnose: griepje. Advies: rust goed uit en drink veel water.
      Neem de voorgeschreven pillen twee keer per dag in. Voelt u
      zich na een week nog steeds niet beter? Maak dan een nieuwe
      afspraak.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.huisarts_consult.01
    language: nl
    text: >-
      Huisarts: Goedemorgen, wat zijn uw klachten? Omar: Ik heb al
      drie dagen hoofdpijn en koorts. Huisarts: Dat klinkt vervelend.
      U heeft waarschijnlijk een griepje. Omar: Is het ernstig?
      Huisarts: Nee, het is niet ernstig. Ik schrijf u een recept
      voor. Omar: Dank u wel, dokter. Huisarts: Neem de pillen twee
      keer per dag in en rust goed uit. Kom over een week terug als
      het niet beter gaat. Maakt u zich geen zorgen.
    voice_hint: two_adults_formal_polite
    status: pending_generation

