course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar use informal jij/je with each other throughout; the
    unnamed post office clerk ("de medewerker") in lesson04 is
    addressed with the formal u, the same register distinction
    introduced in unit01 and used for unnamed counter/service roles
    since unit07.

