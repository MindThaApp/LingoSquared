schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic symptom/pharmacy vocabulary is scaffolded from the health/
    illness module of the FSI Dutch Basic Course (Foreign Service
    Institute, US Department of State -- public domain, no attribution
    required per docs/content/AUTHORING_GUIDE.md §10). The source
    presents these as isolated substitution drills around a generic
    clinic visit, with dated register and no continuous scenario; every
    sentence, exercise, and the Lotte/Omar storyline in this unit are
    freshly authored in modern colloquial register (a contemporary
    apotheek/pharmacy visit, not a formal clinic consultation), not
    copied or lightly edited from any 1960s-70s source text.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Initial six-lesson Dutch health draft (spine outcome:
    universal.a1.health.describe_basic_problem), continuing the
    Lotte/Omar storyline -- Omar feels unwell after the unit15 train
    trip to Utrecht. Cross-checked the pharmacy dosage fact ("twee keer
    per dag een tablet") for consistency between lesson04's dialogue
    and lesson05's reading text per AUTHORING_GUIDE §11. Every
    multi-clause accepted_answers list authored with period/comma/
    conjunction-joined forms per §12. Every fill_in_blank frame retains
    visible surrounding text per §13. Pending fresh-context review and
    Ramin's native-speaker review. Audio assets are declared for
    generation.

    2026-07-06 density pass: audited all six lessons against Ramin's
    teaching-card density feedback. No consecutive kind: vocabulary
    runs exist here (each vocabulary card is already followed by a
    usage-phrase card demonstrating it in context, e.g. ziek / Ik ben
    ziek), so no card merges were made -- the existing word-then-
    example pacing doesn't match the one-word-per-card anti-pattern
    seen in other units. See the sibling overlay file for the matching
    mixed-language note markup pass.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other. The
    pharmacist is an unfamiliar service-role adult, addressed with the
    formal u, the same register distinction introduced in unit01 and
    reused in unit15's ticket counter.

media_assets:
  - {content_key: nl.a1.audio.health.hoofdpijn.01, language: nl, text: "Ik heb hoofdpijn.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.health.ben_ziek.01, language: nl, text: "Ik ben ziek.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.health.keelpijn.01, language: nl, text: "Ik heb keelpijn.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.health.verkouden.01, language: nl, text: "Ik ben verkouden.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.health.iets_tegen_hoofdpijn.01, language: nl, text: "Heeft u iets tegen hoofdpijn?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.health.neem_tablet.01, language: nl, text: "Neem twee keer per dag een tablet.", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: nl.a1.audio.health.advies_briefje.01
    language: nl
    text: >-
      Advies: neem twee keer per dag een tablet met water. Rust goed
      uit en drink veel water. Voel je je na drie dagen nog steeds
      niet lekker? Ga dan naar de huisarts.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - {content_key: nl.a1.audio.health.voel_je_beter.01, language: nl, text: "Voel je je al beter?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.health.rust_beterschap.01, language: nl, text: "Rust lekker uit. Beterschap!", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.dialogue.lotte_checkt_omar.01
    language: nl
    text: >-
      Lotte: Hoi Omar, hoe gaat het? Voel je je al beter? Omar: Nog
      niet zo goed. Ik heb nog steeds hoofdpijn en ik ben moe. Lotte:
      Heb je een tablet genomen? Omar: Ja, ik heb een tablet genomen.
      Ik ga nu rusten. Lotte: Goed idee. Rust lekker uit. Beterschap!
      Omar: Dank je, tot morgen!
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.a1.unit16.health
    title: "Hoe voel je je?"
    section: reading_writing
    spine_outcome_ids: [universal.a1.health.describe_basic_problem]
    planned_lesson_count: 6
    lessons:
      - content_key: nl.a1.unit16.lesson01.niet_lekker_voelen
        title: "Ik voel me niet lekker"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - {content_key: nl.a1.unit16.lesson01.teach.niet_lekker, kind: phrase, target: {text: "Ik voel me niet lekker.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, voel, me, niet, lekker]}
          - {content_key: nl.a1.unit16.lesson01.teach.ziek, kind: vocabulary, target: {text: "ziek", language_code: nl, direction: ltr}, introduced_tokens: [ziek]}
          - {content_key: nl.a1.unit16.lesson01.teach.ben_ziek, kind: phrase, target: {text: "Ik ben ziek.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, ben, ziek]}
          - {content_key: nl.a1.unit16.lesson01.teach.hoofdpijn, kind: vocabulary, target: {text: "hoofdpijn", language_code: nl, direction: ltr}, introduced_tokens: [hoofdpijn]}
          - {content_key: nl.a1.unit16.lesson01.teach.heb_hoofdpijn, kind: phrase, target: {text: "Ik heb hoofdpijn.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, heb, hoofdpijn]}
          - {content_key: nl.a1.unit16.lesson01.teach.buikpijn, kind: vocabulary, target: {text: "buikpijn", language_code: nl, direction: ltr}, introduced_tokens: [buikpijn]}
          - {content_key: nl.a1.unit16.lesson01.teach.heb_buikpijn, kind: phrase, target: {text: "Ik heb buikpijn.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, heb, buikpijn]}
        exercises:
          - {content_key: nl.a1.unit16.lesson01.exercise01.choose_unwell, type: multiple_choice, tested_text: "Ik voel me niet lekker", prompt: {target_blocks: [{text: "I don't feel well.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit16.lesson01.exercise02.listen_headache, type: listen_select, tested_text: "Ik heb hoofdpijn", media_asset_key: nl.a1.audio.health.hoofdpijn.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit16.lesson01.exercise03.match_symptoms, type: matching_pairs, tested_text: "ziek hoofdpijn buikpijn", prompt: {target_blocks: []}, pairs: [{left: ziek, right: sick}, {left: hoofdpijn, right: headache}, {left: buikpijn, right: "stomach ache"}]}
          - {content_key: nl.a1.unit16.lesson01.exercise04.order_stomach_ache, type: word_order, tested_text: "Ik heb buikpijn", prompt: {target_blocks: []}, word_bank: [buikpijn, Ik, heb]}
          - {content_key: nl.a1.unit16.lesson01.exercise05.listen_order_sick, type: listen_order, tested_text: "Ik ben ziek", media_asset_key: nl.a1.audio.health.ben_ziek.01, prompt: {target_blocks: []}, word_bank: [ziek, Ik, ben]}
          - {content_key: nl.a1.unit16.lesson01.exercise06.complete_headache, type: fill_in_blank, tested_text: "Ik heb hoofdpijn", prompt: {target_blocks: [{text: "Ik ___ hoofdpijn.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit16.lesson01.exercise07.write_unwell, type: writing_prompt, tested_text: "Ik voel me niet lekker", prompt: {target_blocks: [{text: "Write in Dutch: I don't feel well.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit16.lesson02.wat_scheelt_eraan
        title: "Wat scheelt eraan?"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - {content_key: nl.a1.unit16.lesson02.teach.wat_is_er, kind: phrase, target: {text: "Wat is er?", language_code: nl, direction: ltr}, introduced_tokens: [Wat, is, er]}
          - {content_key: nl.a1.unit16.lesson02.teach.wat_scheelt, kind: phrase, target: {text: "Wat scheelt eraan?", language_code: nl, direction: ltr}, introduced_tokens: [Wat, scheelt, eraan]}
          - {content_key: nl.a1.unit16.lesson02.teach.keelpijn, kind: vocabulary, target: {text: "keelpijn", language_code: nl, direction: ltr}, introduced_tokens: [keelpijn]}
          - {content_key: nl.a1.unit16.lesson02.teach.heb_keelpijn, kind: phrase, target: {text: "Ik heb keelpijn.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, heb, keelpijn]}
          - {content_key: nl.a1.unit16.lesson02.teach.gaat_het, kind: phrase, target: {text: "Gaat het? Nee, ik voel me niet lekker.", language_code: nl, direction: ltr}, introduced_tokens: [Gaat, het, Nee, ik, voel, me, niet, lekker]}
        exercises:
          - {content_key: nl.a1.unit16.lesson02.exercise01.choose_whats_wrong, type: multiple_choice, tested_text: "Wat scheelt eraan", prompt: {target_blocks: [{text: "What's wrong?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit16.lesson02.exercise02.listen_sore_throat, type: listen_select, tested_text: "Ik heb keelpijn", media_asset_key: nl.a1.audio.health.keelpijn.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit16.lesson02.exercise03.match_wellness_questions, type: matching_pairs, tested_text: "Wat is er Gaat het", prompt: {target_blocks: []}, pairs: [{left: "Wat is er?", right: "What's wrong?"}, {left: "Gaat het?", right: "Are you OK?"}]}
          - {content_key: nl.a1.unit16.lesson02.exercise04.order_sore_throat, type: word_order, tested_text: "Ik heb keelpijn", prompt: {target_blocks: []}, word_bank: [keelpijn, Ik, heb]}
          - {content_key: nl.a1.unit16.lesson02.exercise05.respond_not_ok, type: dialogue_response, tested_text: "Nee ik voel me niet lekker", prompt: {target_blocks: [{text: "Gaat het?", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit16.lesson02.exercise06.write_whats_wrong, type: writing_prompt, tested_text: "Wat scheelt eraan", prompt: {target_blocks: [{text: "Write in Dutch: ask someone what's wrong.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit16.lesson03.koorts_en_verkouden
        title: "Koorts en verkouden"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
