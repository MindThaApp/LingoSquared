          - {content_key: nl.a1.unit16.lesson03.teach.heb_koorts, kind: phrase, target: {text: "Ik heb koorts.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, heb, koorts]}
          - {content_key: nl.a1.unit16.lesson03.teach.verkouden, kind: vocabulary, target: {text: "verkouden", language_code: nl, direction: ltr}, introduced_tokens: [verkouden]}
          - {content_key: nl.a1.unit16.lesson03.teach.ben_verkouden, kind: phrase, target: {text: "Ik ben verkouden.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, ben, verkouden]}
          - {content_key: nl.a1.unit16.lesson03.teach.zijn_note, kind: grammar_note, target: {text: "Ziek en verkouden zijn bijvoeglijke naamwoorden en gebruiken zijn: ik ben verkouden, ik ben ziek. Koorts en hoofdpijn zijn zelfstandige naamwoorden en gebruiken hebben.", language_code: nl, direction: ltr}, introduced_tokens: [Ziek, en, verkouden, zijn, bijvoeglijke, naamwoorden, gebruiken, ik, ben, Koorts, hoofdpijn, zelfstandige, hebben]}
        exercises:
          - {content_key: nl.a1.unit16.lesson03.exercise01.choose_fever, type: multiple_choice, tested_text: "Ik heb koorts", prompt: {target_blocks: [{text: "I have a fever.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit16.lesson03.exercise02.listen_cold, type: listen_select, tested_text: "Ik ben verkouden", media_asset_key: nl.a1.audio.health.verkouden.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit16.lesson03.exercise03.match_conditions, type: matching_pairs, tested_text: "koorts verkouden ziek", prompt: {target_blocks: []}, pairs: [{left: koorts, right: fever}, {left: verkouden, right: "having a cold"}, {left: ziek, right: sick}]}
          - {content_key: nl.a1.unit16.lesson03.exercise04.order_cold, type: word_order, tested_text: "Ik ben verkouden", prompt: {target_blocks: []}, word_bank: [verkouden, Ik, ben]}
          - {content_key: nl.a1.unit16.lesson03.exercise05.complete_fever, type: fill_in_blank, tested_text: "Ik heb koorts", prompt: {target_blocks: [{text: "Ik ___ koorts.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit16.lesson03.exercise06.translate_cold, type: translation, tested_text: "Ik ben verkouden", prompt: {target_blocks: [{text: "I have a cold.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit16.lesson04.bij_de_apotheek
        title: "Bij de apotheek"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - {content_key: nl.a1.unit16.lesson04.teach.apotheek, kind: vocabulary, target: {text: "de apotheek", language_code: nl, direction: ltr}, introduced_tokens: [de, apotheek]}
