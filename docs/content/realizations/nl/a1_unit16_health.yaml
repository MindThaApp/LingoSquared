          - {content_key: nl.a1.unit16.lesson05.exercise06.write_advice_summary, type: writing_prompt, tested_text: "Neem twee keer per dag een tablet en rust goed uit", prompt: {target_blocks: [{text: "Write in Dutch: take a tablet twice a day and rest well.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit16.lesson06.lotte_checkt_omar
        title: "Lotte checkt op Omar"
        spine_outcome_id: universal.a1.health.describe_basic_problem
        teaching:
          - {content_key: nl.a1.unit16.lesson06.teach.lotte_ask, kind: dialogue, target: {text: "Lotte: Hoi Omar, hoe gaat het? Voel je je al beter?", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Hoi, Omar, hoe, gaat, het, Voel, je, al, beter]}
