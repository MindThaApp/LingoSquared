review:
  status: unreviewed
  required_next_reviewer: claude
  notes: >-
    New A1 transportation unit (file-numbered unit33, next after
    unit32), realizing the new spine outcome
    universal.a1.transportation.getting_around_town (prerequisite:
    universal.a1.directions.ask_follow_basic_directions, realized in
    unit09). This outcome was added fresh in this same task under the
    standing delegated spine-authority -- nl had realized all 34
    existing outcomes (confirmed via exact spine_outcome_id diff before
    adding anything), so one new sensible A1 topic was required to
    continue volume growth. Sanity-checked per the standing authority:
    no duplicate id, valid prerequisite reference, all 4 modalities
    present, exactly 4 assessment_requirements with 4 success_criteria.

    Continues the established storyline: Lotte takes the train to work
    every day, Omar cycles often, Sander drives the car, Fenna walks --
    all freshly established here as commute habits, distinct from and
    non-contradictory with unit32's sport facts (Lotte=yoga,
    Omar=football, Sander=running, Fenna=swimming -- exercise habits,
    not commute modes). Register is informal jij/je between the four
    friends, with one formal u exchange at a real ticket counter
    (buying a ticket from a stranger), matching unit06's established
    alstublieft/u precedent for service interactions.

    Six lessons, recognition->drag->production pacing (§2): 01 teaches
    the four transport nouns (de trein, de fiets, de auto, lopen) and
    "Hoe reis je naar je werk?" / "Ik reis met de trein."; 02 teaches
    frequency with transport reusing unit29/32's "vaak"/"elke dag"
    precedent, no new frequency construction needed; 03 teaches buying
    a ticket at a formal counter ("Een kaartje naar Amsterdam,
    alstublieft.", reusing unit06's alstublieft/formal-register
    precedent) plus asking which transport to take, reusing unit09's
    directions vocabulary indirectly (a grammar_note cross-references
    it); 04 is a taalcafé dialogue where Fenna asks Omar how he gets to
    work, reusing unit10's separable-verb precedent (fietsen naar
    itself isn't separable, so a grammar_note explicitly notes this,
    the same over-generalization guard unit32 used for hardlopen); 05
    is a reading comparing all four characters' commutes with a "wie
    reist hoe" comprehension structure mirroring unit32 lesson05's "wie
    doet welke sport" shape; 06 is a wrap-up taalcafé dialogue where the
    group discusses cycling together to the weekend taalcafé, reusing
    unit11's "Zullen we...?" plan-proposing construction, closing the
    loop.

    Every kind: vocabulary card has a real example built only from
    vocabulary already taught in this unit or earlier. Total new
    nouns/verbs taught: trein, fiets, auto, lopen, reizen, kaartje,
    station (7), within the established 6-10 "don't pad" range.

    fill_in_blank ambiguity (§13/§17) checked: blanking trein/fiets/
    auto/lopen directly would be ambiguous (all four are grammatically
    valid completions of "Ik reis met de ___"), so no fill_in_blank
    targets any transport noun -- lesson01 uses dialogue_response for
    its production slot instead. Lesson03 blanks only "alstublieft" (a
    single fixed formal-register word with one sensible completion
    given the counter-service context). Lessons04/06 (dialogue) and 05
    (reading) have no fill_in_blank, matching unit32's own shape.

    Every multi-clause accepted_answers list is authored with
    period-joined, comma-joined, and conjunction-joined variants per
    §12.

    Matching_pairs pairs checked for duplicate right-hand text within
    each exercise -- no two pairs in any single exercise share
    identical left or right text.

    Audio assets declared for generation. Pending fresh-context review
    and Ramin's native-speaker pass.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. The
    four friends use informal jij/je throughout; one formal u exchange
    appears at the ticket counter (a real stranger-service interaction),
    matching unit06's established register_policy precedent for when
    formal register is appropriate.

