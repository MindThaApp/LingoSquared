          - {content_key: nl.a1.unit21.lesson02.exercise06.respond_happy_reason, type: dialogue_response, tested_text: "Ik ben blij omdat ik een nieuw appartement heb", prompt: {target_blocks: [{text: "Waarom ben je blij?", language_code: nl, direction: ltr}]}}

