          - {content_key: nl.a1.unit21.lesson02.exercise02.listen_sad_reason, type: listen_select, tested_text: "Ik ben verdrietig omdat het regent", media_asset_key: nl.a1.audio.emotions.verdrietig_omdat_regent.01, prompt: {target_blocks: []}}
