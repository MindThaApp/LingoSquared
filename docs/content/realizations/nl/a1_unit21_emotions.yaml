          - {content_key: nl.a1.unit21.lesson02.exercise04.order_happy_reason, type: word_order, tested_text: "Ik ben blij omdat ik een nieuw appartement heb", prompt: {target_blocks: []}, word_bank: [nieuw, Ik, ben, blij, omdat, ik, een, appartement, heb]}
