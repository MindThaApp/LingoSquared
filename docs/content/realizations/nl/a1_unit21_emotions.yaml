schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic feeling-word vocabulary is scaffolded from the FSI Dutch
    Basic Course (Foreign Service Institute, US Department of State --
    public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents these as isolated
    adjective substitution drills with no continuous scenario; every
    sentence, exercise, and the Lotte/Omar storyline in this unit
    (Omar's nerves before his first solo restaurant shift) are freshly
    authored in modern colloquial register, not copied or lightly
    edited from any 1960s-70s source text.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Initial six-lesson Dutch emotions draft (spine outcome:
    universal.a1.emotions.express_basic_feelings), continuing the
    Lotte/Omar storyline -- Omar is nervous about his first solo
    restaurant shift (unit17's job) despite being happy about his new
    job and apartment (unit18) -- the coat from unit20 is not cited as
    a happiness reason in this unit's actual content, so the storyline
    reference above is limited to job/apartment only. The specific
    fact (nervous about the first solo shift) is stated consistently
    in lesson03's teaching example, lesson05's reading, and lesson06's
    dialogue, per AUTHORING_GUIDE §11. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. A fresh-context review ran and found one
    exercise (lesson02's "sad because it's raining" listening exercise)
    wired to the wrong audio asset -- it played the earlier "happy
    because of the apartment" clip instead of a matching sad/rain clip
    -- fixed with a new dedicated audio asset. No grammar errors, spine
    drift, jargon leaks, or YAML footguns found otherwise. Re-validated
    (0 errors/0 warnings across the full nl course, including the real
    compile step). Still needs Ramin's native-speaker pass before
    status: reviewed. Audio assets are declared for generation.

    2026-07-06 density/note-markup pass: merged lesson01's three
    single-word vocabulary cards (blij, verdrietig, boos) into one
    combined vocabulary card so the learner isn't stuck clicking
    "Next" three times for three one-word cards in a row -- lesson01
    now has 3 teaching cards instead of 5. Other lessons in this unit
    already had acceptable card density (2-3 phrase cards, or a single
    dialogue/reading/grammar_note card) or only one standalone
    vocabulary card with no sibling to merge with, so were left
    unchanged. Also wrapped every inline Dutch word/phrase in the
    overlay's teaching notes in single asterisks per AUTHORING_GUIDE
    §15. Re-validated after both changes, 0 errors/0 warnings.

    2026-07-07 AUTHORING_GUIDE §17 pass (fill_in_blank/word_order
    true-synonym slots, found live from a real user report): lesson02's
    complete_sad_reason blanked the causal conjunction in "Ik ben
    verdrietig ___ het regent" and only accepted "omdat" -- but "want"
    fits exactly as well, and unlike other omdat/want pairs in this
    project the clause is too short (just "het regent") for word order
    to disambiguate the two the way it normally would. Fixed by
    accepting both. Swept the rest of this unit's fill_in_blank/
    word_order slots; none had a real equivalent-candidate issue.
    Re-validated/compiled clean.

    2026-07-07 AUTHORING_GUIDE §16 retrofit (this unit was explicitly
    named one of the worst offenders in a whole-course curriculum
    review, along with units 17/23): all four matching_pairs exercises
    expanded using already-taught vocabulary from that lesson and
    earlier lessons in the unit -- match_feelings (3->5, capped by
    being the unit's first lesson), match_reasons (2->6),
    match_reassurance (3->6), match_feeling_questions (3->6). Also
    found and fixed two real ungradable-pair bugs while touching
    match_reassurance and match_feeling_questions: each overlay was
    missing one of the realization's original pairs (same bug class
    found repeatedly tonight). Lesson05 (reading-comprehension) is
    exempt. Re-validated/compiled clean.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other.

