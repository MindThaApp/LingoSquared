          - {content_key: nl.a1.unit21.lesson02.teach.blij_omdat_appartement, kind: phrase, target: {text: "Ik ben blij omdat ik een nieuw appartement heb.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, ben, blij, omdat, een, nieuw, appartement, heb]}
