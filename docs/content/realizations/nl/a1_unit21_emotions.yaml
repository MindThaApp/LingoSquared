  - {content_key: nl.a1.audio.emotions.verdrietig_omdat_regent.01, language: nl, text: "Ik ben verdrietig omdat het regent.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.emotions.zenuwachtig_dienst.01, language: nl, text: "Ik ben zenuwachtig voor mijn eerste dienst.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.emotions.hij_voelt_zich.01, language: nl, text: "Hij voelt zich zenuwachtig.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.emotions.waarom_voelt_hij.01, language: nl, text: "Waarom voelt hij zich zenuwachtig?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.emotions.bericht.01
    language: nl
    text: >-
      Hoi Lotte, ik ben een beetje zenuwachtig voor mijn eerste dienst
      alleen. Maar ik ben ook blij, want ik heb een nieuwe baan en een
      nieuw appartement. Ik denk dat het goed komt.
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: nl.a1.audio.dialogue.eerste_dienst.01
    language: nl
    text: >-
      Lotte: Hoi Omar, hoe voel je je voor je eerste dienst? Omar: Ik
      ben een beetje zenuwachtig, eerlijk gezegd. Lotte: Maak je geen
      zorgen, je kunt het goed! Omar: Dank je, dat helpt echt. Lotte:
      En daarna ben je vast heel blij en trots. Omar: Ja, dat denk ik
      ook.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
