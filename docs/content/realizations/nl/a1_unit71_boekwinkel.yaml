  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina, Omar,
    and Lotte are established taalcafe friends and use informal jij/je with
    each other throughout. This unit's bookstore counter employee ("de
    medewerker") is addressed formally with "u" by Omar and Nina, reusing
    the corpus's established neutral-polite stranger-register convention and
    generic staff title for paid venues with a single shared counter
    (unit50-58/60/62-66/68-70), since a bookstore counter is an ordinary
    shop-counter social shape, unlike unit67's open-air market stall (which
    introduced a market-specific vendor title precisely because that venue
    was different in kind).

