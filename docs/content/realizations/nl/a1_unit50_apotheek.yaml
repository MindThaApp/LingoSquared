review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  reviewer_notes: >-
    2026-07-11 independent fresh-context review (Opus, no access to the
    authoring session; realization+overlay read together, backend
    grading._normalize semantics applied before judging accepted_answers).
    Ran every mechanical sweep clean: boolean-coercion type-walk,
    snake_case/jargon scan of learner-facing fields, accepted_answers value-
    key shape, title-length, and spine-outcome existence. Spine outcome
    universal.a1.pharmacy.buy_basic_medicine confirmed. Independently re-
    verified the prior same-speaker-distractor fix in lesson04.exercise01
    (the two replacement distractors 'Would you like a receipt?' / 'Is this
    your first visit?' are said by no one in apotheek_balie.01) -- holds.
    Checked by hand: word_order/listen_order duplicate-token coverage (none
    needed); both dialogue clips (apotheek_balie, apotheek_slot) vs every
    listen_select/dialogue_comprehension distractor at the meaning level,
    INCLUDING the cross-speaker case (lesson04.ex01 distractor 'Should I
    take them with water?' is Nina's line, not the tested pharmacist's, so
    it stays answerable); register (Nina/pharmacist 'u', Nina/Omar 'je')
    correct. NEW §11 finding flagged for Ramin (judgment call, not a
    mechanical fix, so not silently changed): the pharmacist's spoken advice
    in lessons 03/04 is 'twee tabletten PER DAG' (two/day) while lesson05's
    Paracetamol label reads 'twee tabletten, DRIE KEER per dag' (two, three
    times/day) -- a learner reads both as the same headache medicine Nina
    bought on this one visit, so the doses should be reconciled (make the
    pharmacist's advice match the label, or make them explicitly different
    products). Kept as a flag because choosing the correct unified dose is
    authoring, not reviewing. Also still open: the already-flagged bare
    'medicijn genomen' (lesson06) native-naturalness call. No other
    objective grading bug found.
  flagged_issues:
    - >-
      2026-07-10 fresh-context review: fixed one real, unambiguous,
      mechanically-fixable bug directly -- lesson04 exercise01
      (listen_waar_kan_ik_helpen, overlay
      nl.a1.unit50.lesson04.exercise01.listen_waar_kan_ik_helpen) asks
      "Listen and choose what the pharmacist asks," but 2 of its 3
      distractors ("These painkillers are good." / "Yes, always with
      water.") were the SAME tested speaker's (Apotheker) own other real
      lines from this exact dialogue clip (nl.a1.audio.dialogue.
      apotheek_balie.01) -- the same-speaker-distractor bug class from
      the 2026-07-09 nl unit44-50 audit (commit 148240e). Replaced both
      with "Would you like a receipt?" / "Is this your first visit?",
      neither said anywhere in this audio. Re-verified every other
      listen_select/dialogue_comprehension exercise in both this unit's
      dialogue clips against every line each speaker actually says --
      clean otherwise. Audio wiring (every media_asset_key's declared
      text against its exercise's tested_text) also checked clean
      throughout.

      One remaining item needs Ramin's/a native judgment call, not a
      mechanical fix, so status stays unreviewed: lesson06's
      nl.a1.unit50.lesson06.teach.nina_medicijn_genomen ("Ja, ik heb
      medicijn genomen...") uses bare singular "medicijn" with no
      article and no plural marker. Native colloquial Dutch more
      commonly says "medicijnen genomen" (plural) or "een pijnstiller
      genomen" (referring back to this same unit's own "de pijnstiller"
      -- would also tie the story together better); bare "medicijn
      genomen" reads slightly calque-y/non-native but isn't unambiguously
      wrong, so left as a flag rather than guessed at. If changed, the
      overlay gloss/title, exercise07's tested_text, and the matching
      exercise06/07/08 accepted_answers on this same lesson would all
      need the same edit.
  notes: >-
    New Dutch A1 unit after unit49. A safe_load diff of every
    spine_outcome_id/spine_outcome_ids across every
    docs/content/realizations/nl/a1_unit*.yaml file against every A1
    outcome id in universal_spine.yaml (45 total, confirmed by grepping
    "id: universal.a1." in the spine file) found no unrealized A1 outcome
    for Dutch -- all 45 were already realized. Git history was checked
    first (git log -- docs/content/universal_spine.yaml and the nl
    realizations directory); the most recent additions were nl unit49
    (hotel check-in) and, in the same commit, the
    universal.a1.accommodation.check_into_lodging spine outcome itself --
    no other session had added a newer, still-unrealized A1 outcome. This
    unit therefore adds a new delegated A1 spine outcome,
    universal.a1.pharmacy.buy_basic_medicine, distinct from unit16's
    describing a health problem (universal.a1.health.describe_basic_problem,
    which covers naming a symptom to e.g. a doctor) and unit07's general
    shopping/prices content: the transactional pharmacy visit itself
    (asking a pharmacist for an over-the-counter medicine, understanding
    dosage instructions, reading a medicine label) is a distinct,
    practically important A1 survival topic for living in the Netherlands
    and was not yet covered anywhere in the spine. Story continuity:
    Monday 18 May 2026, two days after unit49's Saturday 16 May 2026
    hotel weekend (verified with Python datetime.date(2026,5,18)
    .strftime("%A") == "Monday"). Nina has a headache after the trip and
    visits the apotheek for a painkiller; Omar (her established
    taalcafe-friend and travel companion from unit49) checks in on her in
    the closing scene, consistent with his established caring-friend role.
    Every vocabulary teaching card includes a real example sentence with
    a matching overlay example_gloss. Prior words (including "ik heb"/
    "een"/basic modal-verb constructions from earlier units) are
    re-declared as introduced_tokens at first use in this file because
    the untaught-vocabulary validator is per-file.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina and
    Omar are established taalcafe friends and use informal jij/je with
    each other throughout. The pharmacist speaks in neutral, polite
    service language ("u"), consistent with unit49's hotel-receptionist
    and unit47's library-staff register.

