review:
  status: unreviewed
  required_next_reviewer: claude
  notes: >-
    New A1 colors unit (file-numbered unit42, next after unit41's
    personality), realizing a NEW spine outcome
    universal.a1.colors.describe_colors (prerequisite:
    universal.a1.shopping.ask_prices_quantities). An exact spine_outcome_id
    diff across all 41 existing nl realization files (direct
    `grep -oP` of every `- id:` in universal_spine.yaml against every
    occurrence of `universal\.` anywhere in docs/content/realizations/nl/
    *.yaml, not eyeballed -- 44 total spine outcomes before this pass,
    comm -23 against the nl-wide usage set) confirmed the only two
    unrealized outcomes were the two B1 outcomes (abilities, necessity),
    out of scope for this A1 volume-growth task -- every A1/A2 outcome
    was already realized. So one new sensible A1 topic was required under
    the standing delegated spine-authority; checked git log first
    (`git log --oneline -- docs/content/universal_spine.yaml`) and
    confirmed the most recent spine addition was
    universal.a1.personality.describe_basic_personality_traits, added in
    the SAME commit that shipped this file's own predecessor (nl unit41)
    -- so no other session had just added an outcome nl hadn't caught up
    to yet. "Describing colors" was chosen as a natural, near-universally-
    taught A1 topic with no existing dedicated spine coverage: appearance
    (universal.a1.appearance.describe_physical_appearance) only teaches a
    handful of hair/eye colors as attributes of a PERSON
    (blond/bruin/grijs hair, blauw/bruin/groen eyes, both realized in
    nl unit30), and clothing (universal.a1.clothing.describe_buy_clothing)
    only mentions color as one attribute of a garment in passing (nl
    unit20 taught zwart/blauw for jackets) -- neither is a dedicated
    "identify and describe the colors of everyday objects" outcome, and
    six more colors (rood, geel, wit, oranje, roze, paars) had zero
    coverage anywhere in the nl corpus before this file (confirmed via
    direct grep across every nl realization file). Sanity-checked the new
    outcome via direct read after adding: no duplicate id (45 total
    outcomes after adding, confirmed via a `yaml.safe_load` id-count/
    dedupe check), valid prerequisite reference
    (universal.a1.shopping.ask_prices_quantities, already realized in nl
    unit07), all 4 modalities present, exactly 4 assessment_requirements
    with 4 success_criteria, same shape as every neighboring entry (built
    closely off the personality/appearance outcomes' own shape, the most
    recently-added and thematically-adjacent entries).

    Continues the established Lotte/Omar/Sander/Fenna/Nina taalcafé
    storyline four days after unit41's Tuesday-at-the-taalcafé scene:
    Tuesday 28 April 2026 (unit41) + 4 days = Saturday 2 May 2026
    (calendar-true, confirmed via direct `python3 -c
    "import datetime; print(datetime.date(2026,5,2).strftime('%A'))"`
    -- Saturday, independently verified against the real-world 2026
    calendar, not assumed). Setting is a NEW location for this storyline,
    the Saturday bloemenmarkt (flower market) -- a genuinely
    period-appropriate, culturally authentic Dutch setting (grep-
    confirmed no prior nl unit already uses "bloemenmarkt" or "tulp"/
    "tulpen", so this isn't a duplicate scenario), naturally motivated by
    unit41's own newly-established Nina/Lotte friendship (both are
    established taalcafé regulars who know each other, confirmed via
    unit30's introduction and unit41's own dialogue) and by the real-
    world seasonal fact that tulip season runs through April/early May
    in the Netherlands, matching the story's own May date. No new
    characters introduced -- Nina and Lotte go to the market together
    (lessons 01-05), then return to the taalcafé to show the others
    (lesson06, Omar and Lotte). Reuses established facts without
    contradiction (checked directly against unit30/38/39/41): Lotte and
    Nina are established taalcafé friends (unit30/41) who use informal
    jij/je with each other (no formal u needed, matching every prior
    unit's register_policy for this friend group); nothing about either
    character's job/hobbies/schedule is touched or contradicted by a
    Saturday flower-market outing. The unit deliberately introduces NO
    new grammar point beyond what's already taught: every color is used
    PREDICATIVELY ("De tulpen zijn rood") or elliptically as a bare
    one-word answer ("Ik wil graag roze"), never attributively in front
    of a noun ("de rode tulpen") -- Dutch attributive adjectives inflect
    (rood -> rode, geel -> gele, wit -> witte) and that inflection rule
    is never taught anywhere in this course, so introducing it
    incidentally here would silently test an untaught grammar point;
    confirmed by grepping the existing corpus (e.g. nl unit18 housing)
    that attributive color/size adjective inflection isn't established
    elsewhere either, so this is a deliberate scope discipline decision,
    not an oversight. "de tulpen" (plural) is taught directly as its own
    vocabulary item rather than as an inflection of a taught singular
    "de tulp" -- the same pattern nl unit07's "tomaten" already
    established (teaching a plural noun directly when the real-world
    scenario is inherently about multiples), avoiding a singular/plural
    mismatch with the "zijn" (plural copula, already taught) used in
    every color sentence.

    Six lessons, recognition->drag->production pacing (§2): 01 teaches
    "de tulpen" and "rood"/"geel" via "De tulpen zijn rood."/"De tulpen
    zijn geel."; 02 teaches "wit"/"oranje" plus the question phrase
    "Welke kleur is dat?" (reusing "Welke" from unit20's "Welke maat
    heeft u?"); 03 teaches "roze"/"paars" plus an explicit grammar_note
    on the elliptical "Ik wil graag + kleur" reply (reusing the
    already-taught "Ik wil graag ..." ordering construction from unit06/
    unit07 -- no new grammar, just a new use of it, directly parallel to
    unit41's own reuse of "Ik vind"); 04 is a dialogue (Saturday 2 May
    2026, at the bloemenmarkt) where Nina and Lotte pick tulip colors and
    Lotte states the price; 05 is a reading recapping the market trip,
    mirroring unit35-41's own "recap what happened" comprehension shape;
    06 is the wrap-up dialogue back at the taalcafé where Nina and Lotte
    show Omar the tulips, closing on "De tulpen maken het taalcafé
    mooi!" (The tulips make the taalcafé nice!) -- a genuinely fresh,
    natural Dutch closing, deliberately NOT another "Zullen we ...?"
    callback (the dominant closing pattern across unit36-39) or a repeat
    of unit41's own "Welkom bij ons taalcafé!" (unit41's own review note
    already flagged repeat-callback fatigue as a risk to actively
    avoid, and this file avoids both of the two most recent closing
    patterns specifically, not just one).

    Grammar-scope check: no new tense introduced, present tense
    throughout, matching unit35-41's own scope discipline. The "Ik wil
    graag + kleur" elliptical-answer construction is the only grammar
    point given an explicit note this unit, and it's a productive reuse
    of already-taught "Ik wil graag ...", not a new verb, case, or tense.

    Every kind: vocabulary teaching card has a real example built only
    from vocabulary already taught in this unit (or, for common
    function/content words already taught in an EARLIER nl file --
    de, zijn, hier, Deze, die, en, Welke, kleur, wil, graag, Ik, Kijk,
    We, hebben, voor, het, taalcafé, Hoeveel, kost, euro, tien, vijf,
    Dat, dat, mooi, maken, is, En, jij, op, zaterdag, naar, Ze, kopen,
    heel, vinden, leuk, Nina, Lotte, Omar -- re-declared as review tokens
    on first use in THIS file per the standing cross-file gotcha, since
    the compiler's untaught-vocabulary check accumulates across an
    entire realization FILE, not per-lesson, but resets at each new
    file; every one of these confirmed present in an earlier nl file via
    direct grep before being reused here, not assumed). Total new colors
    taught: rood, geel, wit, oranje, roze, paars (6), plus "de tulpen"
    as the one new content noun -- within the established 6-10 "don't
    pad" range for core new vocabulary.

    fill_in_blank deliberately NOT used anywhere in this unit (§13/§17
    checked and consciously avoided rather than force-fit), for the same
    reason unit41 avoided it for personality traits: a blanked color
    slot ("De tulpen zijn ___") has no single mutually-exclusive correct
    answer -- multiple colors could grammatically complete the sentence
    with nothing in the frame to disambiguate which one the exercise
    wants, the exact §17 ambiguity trap. translation/writing_prompt/
    dialogue_response used instead for every production check.

    Every multi-clause accepted_answers list is authored with
    period-joined, comma-joined, and (where the conjunction word itself
    already supplies the "and"-joined form, e.g. "en") both forms per
    §12: lesson04's "Ik wil graag rood. En jij, Nina?" response gets
    period-joined (as authored) and comma-joined variants; lesson06's
    "Dat is roze en dat is paars." response gets all four of
    period-joined, comma-joined, trailing-period, and no-trailing-period
    variants, matching unit41 lesson06's own precedent for its
    "maar"-joined multi-clause answer. Every other multi-clause open-text
    answer in this unit only has an internal comma or is a single clause,
    so it gets just the trailing-period/no-period pair, matching
    unit36-41's own precedent.

    Matching_pairs pairs checked for duplicate right-hand text within
    each exercise -- no two pairs in any single exercise share identical
    left or right text. All exercises use exactly 6 pairs, within the
    established 6-12 range.

    Grepped this file and its overlay for bare unquoted yes/no/true/
    false/ja/nee values before finalizing (the real German B1
    boolean-coercion bug and the vocabulary title/gloss boolean-coercion
    gap flagged this session): this unit's dialogue and vocabulary
    content has no occurrence of the Dutch word "ja"/"nee" at all; no
    bare "yes"/"no"/"true"/"false" (English) appears anywhere in this
    file either, including in any `title:`/`gloss:` field. Confirmed via
    a recursive yaml.safe_load scan (not just text grep) of every scalar
    value in both this file and its overlay -- the only bare-lowercase
    boolean-shaped tokens anywhere are the two genuine YAML booleans
    (`human_reviewed: false`, `target_language_first: true`), both
    correctly unquoted since they ARE real booleans, not learner-facing
    string content.

    Audio assets declared for generation. Pending fresh-context review
    and Ramin's native-speaker pass.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina,
    Lotte, and Omar are all established taalcafé friends and use
    informal jij/je with each other throughout this unit -- no unnamed/
    service-role character appears (the flower-seller is never given
    dialogue lines), so no formal u is needed anywhere in this unit.

