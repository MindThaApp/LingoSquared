schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Comparative/superlative adjective patterns (regular -er/-st formation,
    net zo ... als equality, and the irregular goed/beter/best and
    veel/meer/meest chains) are scaffolded from the grammar drills in the
    FSI Dutch Basic Course (Foreign Service Institute, US Department of
    State -- public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents these as bare
    substitution-table drills with no continuous scenario; every sentence,
    exercise, and the backpack-shopping storyline in this unit are freshly
    authored in modern colloquial register, not copied or lightly edited
    from any 1960s-70s source text.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Initial six-lesson Dutch comparisons draft (spine outcome:
    universal.a1.comparisons.make_basic_comparisons), continuing the
    Lotte/Omar storyline from unit13. A fresh-context review (zero
    access to the authoring reasoning) ran and found: one exercise
    (lesson06 listen_open) whose tested_text/overlay translation
    dropped "Kijk"/"deze" present in the actual audio -- fixed; one
    lesson05 exercise-ordering wrinkle (listen_select was sequenced
    after matching_pairs, a minor deviation from strict
    recognition->drag->production) -- reordered; two writing_prompt
    exercises whose open-ended instructions under-constrained their
    single accepted answer -- instructions narrowed to match. No
    grammar errors, spine drift, jargon leaks, or YAML footguns found.
    Fixes applied and re-validated (0 errors/0 warnings across the
    full nl course). Still needs Ramin's native-speaker pass before
    status: reviewed.

    2026-07-06 density pass: merged lesson01's two single-word
    vocabulary cards (groot, klein) into one, and lesson02's two
    single-word vocabulary cards (duur, goedkoop) into one. Other
    lessons' teaching cards were already phrase/dialogue/grammar_note/
    reading kinds not eligible for merging, so left unchanged.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte and
    Omar continue to use informal jij/je with each other while shopping.
    Comparative -er/-st forms follow standard spelling (double the final
    consonant only where Dutch spelling rules require it, e.g. duur ->
    duurder, not a doubled r).

media_assets:
  - {content_key: nl.a1.audio.comparisons.rugzak_groter.01, language: nl, text: "De rugzak is groter dan de tas.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.comparisons.tas_goedkoper.01, language: nl, text: "De tas is goedkoper dan de rugzak.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.comparisons.net_zo_praktisch.01, language: nl, text: "De rugzak is net zo praktisch als de tas.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.comparisons.beste_keuze.01, language: nl, text: "Deze rugzak is de beste keuze voor een lange treinreis.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.comparisons.advertentie.01
    language: nl
    text: >-
      Rugzak Bergsport: vijfenveertig euro. Deze rugzak is groot en sterk.
      Schoudertas Stad: twintig euro. Deze tas is kleiner en lichter dan de
      rugzak, maar minder sterk. Voor een lange reis is de rugzak de beste
      keuze, want hij is sterker en heeft meer ruimte.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - {content_key: nl.a1.audio.comparisons.dialogue_open.01, language: nl, text: "Kijk, deze rugzak is groter dan die tas.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.comparisons.dialogue_close.01, language: nl, text: "Goed, dan koop ik de rugzak en jij de schoudertas.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.dialogue.tassen_vergelijken.01
    language: nl
    text: >-
      Lotte: Kijk, deze rugzak is groter dan die tas. Omar: Ja, en hij heeft
      meer ruimte. Ik heb een grote tas nodig voor de treinreis. Lotte: Dan
      is de rugzak de beste keuze voor jou. Omar: Precies. Welke tas vind
      jij het mooist? Lotte: Ik vind deze schoudertas het mooist. En hij is
      licht. Omar: Goed, dan koop ik de rugzak en jij de schoudertas.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.a1.unit14.comparisons
    title: "Vergelijkingen maken"
    section: reading_writing
    spine_outcome_ids: [universal.a1.comparisons.make_basic_comparisons]
    planned_lesson_count: 6
    lessons:
      - content_key: nl.a1.unit14.lesson01.grootte_vergelijken
        title: "Groter of kleiner?"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: nl.a1.unit14.lesson01.teach.comparative_rule, kind: grammar_note, target: {text: "Bij vergelijkingen voeg je vaak er toe aan het bijvoeglijk naamwoord en gebruik je dan.", language_code: nl, direction: ltr}, introduced_tokens: [Bij, vergelijkingen, voeg, je, vaak, er, toe, aan, het, bijvoeglijk, naamwoord, en, gebruik, dan]}
          - {content_key: nl.a1.unit14.lesson01.teach.groot_klein, kind: vocabulary, target: {text: "groot, klein", language_code: nl, direction: ltr}, introduced_tokens: [groot, klein]}
          - {content_key: nl.a1.unit14.lesson01.teach.rugzak_groter, kind: phrase, target: {text: "De rugzak is groter dan de tas.", language_code: nl, direction: ltr}, introduced_tokens: [De, rugzak, is, groter, dan, de, tas]}
          - {content_key: nl.a1.unit14.lesson01.teach.tas_kleiner, kind: phrase, target: {text: "De tas is kleiner dan de rugzak.", language_code: nl, direction: ltr}, introduced_tokens: [De, tas, is, kleiner, dan, de, rugzak]}
        exercises:
          - {content_key: nl.a1.unit14.lesson01.exercise01.choose_bigger, type: multiple_choice, tested_text: "De rugzak is groter dan de tas", prompt: {target_blocks: [{text: "The backpack is bigger than the bag.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson01.exercise02.listen_bigger, type: listen_select, tested_text: "De rugzak is groter dan de tas", media_asset_key: nl.a1.audio.comparisons.rugzak_groter.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit14.lesson01.exercise03.match_adjectives, type: matching_pairs, tested_text: "groot groter klein kleiner", prompt: {target_blocks: []}, pairs: [{left: groot, right: groter}, {left: klein, right: kleiner}]}
          - {content_key: nl.a1.unit14.lesson01.exercise04.order_smaller, type: word_order, tested_text: "De tas is kleiner dan de rugzak", prompt: {target_blocks: []}, word_bank: [rugzak, is, kleiner, dan, De, tas, de]}
          - {content_key: nl.a1.unit14.lesson01.exercise05.listen_order_bigger, type: listen_order, tested_text: "De rugzak is groter dan de tas", media_asset_key: nl.a1.audio.comparisons.rugzak_groter.01, prompt: {target_blocks: []}, word_bank: [tas, groter, De, dan, rugzak, is, de]}
          - {content_key: nl.a1.unit14.lesson01.exercise06.complete_bigger, type: fill_in_blank, tested_text: "De rugzak is groter dan de tas", prompt: {target_blocks: [{text: "De rugzak is ___ dan de tas.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson01.exercise07.write_smaller, type: writing_prompt, tested_text: "De tas is kleiner dan de rugzak", prompt: {target_blocks: [{text: "Write in Dutch: The bag is smaller than the backpack.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit14.lesson02.prijzen_vergelijken
        title: "Goedkoper of duurder?"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: nl.a1.unit14.lesson02.teach.rugzak_price, kind: phrase, target: {text: "De rugzak kost vijfenveertig euro.", language_code: nl, direction: ltr}, introduced_tokens: [De, rugzak, kost, vijfenveertig, euro]}
          - {content_key: nl.a1.unit14.lesson02.teach.tas_price, kind: phrase, target: {text: "De tas kost twintig euro.", language_code: nl, direction: ltr}, introduced_tokens: [De, tas, kost, twintig, euro]}
          - {content_key: nl.a1.unit14.lesson02.teach.duur_goedkoop, kind: vocabulary, target: {text: "duur, goedkoop", language_code: nl, direction: ltr}, introduced_tokens: [duur, goedkoop]}
          - {content_key: nl.a1.unit14.lesson02.teach.rugzak_duurder, kind: phrase, target: {text: "De rugzak is duurder dan de tas.", language_code: nl, direction: ltr}, introduced_tokens: [De, rugzak, is, duurder, dan, de, tas]}
          - {content_key: nl.a1.unit14.lesson02.teach.tas_goedkoper, kind: phrase, target: {text: "De tas is goedkoper dan de rugzak.", language_code: nl, direction: ltr}, introduced_tokens: [De, tas, is, goedkoper, dan, de, rugzak]}
        exercises:
          - {content_key: nl.a1.unit14.lesson02.exercise01.choose_expensive, type: multiple_choice, tested_text: "De rugzak is duurder dan de tas", prompt: {target_blocks: [{text: "The backpack is more expensive than the bag.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson02.exercise02.listen_cheaper, type: listen_select, tested_text: "De tas is goedkoper dan de rugzak", media_asset_key: nl.a1.audio.comparisons.tas_goedkoper.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit14.lesson02.exercise03.match_price_adjectives, type: matching_pairs, tested_text: "goedkoop goedkoper duur duurder", prompt: {target_blocks: []}, pairs: [{left: goedkoop, right: goedkoper}, {left: duur, right: duurder}]}
          - {content_key: nl.a1.unit14.lesson02.exercise04.order_expensive, type: word_order, tested_text: "De rugzak is duurder dan de tas", prompt: {target_blocks: []}, word_bank: [tas, De, is, dan, rugzak, de, duurder]}
          - {content_key: nl.a1.unit14.lesson02.exercise05.listen_order_cheaper, type: listen_order, tested_text: "De tas is goedkoper dan de rugzak", media_asset_key: nl.a1.audio.comparisons.tas_goedkoper.01, prompt: {target_blocks: []}, word_bank: [rugzak, De, goedkoper, dan, tas, is, de]}
          - {content_key: nl.a1.unit14.lesson02.exercise06.complete_cheaper, type: fill_in_blank, tested_text: "De tas is goedkoper dan de rugzak", prompt: {target_blocks: [{text: "De tas is ___ dan de rugzak.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson02.exercise07.respond_cheaper, type: dialogue_response, tested_text: "De tas is goedkoper", prompt: {target_blocks: [{text: "Welke is goedkoper, de rugzak of de tas?", language_code: nl, direction: ltr}]}}

      - content_key: nl.a1.unit14.lesson03.net_zo_als
        title: "Net zo mooi als"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: nl.a1.unit14.lesson03.teach.equality_rule, kind: grammar_note, target: {text: "Gebruik net zo plus het bijvoeglijk naamwoord plus als om twee dingen gelijk te vergelijken.", language_code: nl, direction: ltr}, introduced_tokens: [Gebruik, net, zo, plus, het, bijvoeglijk, naamwoord, als, om, twee, dingen, gelijk, te, vergelijken]}
          - {content_key: nl.a1.unit14.lesson03.teach.mooi, kind: phrase, target: {text: "Deze rugzak is net zo mooi als die tas.", language_code: nl, direction: ltr}, introduced_tokens: [Deze, rugzak, is, net, zo, mooi, als, die, tas]}
          - {content_key: nl.a1.unit14.lesson03.teach.praktisch, kind: phrase, target: {text: "De rugzak is net zo praktisch als de tas.", language_code: nl, direction: ltr}, introduced_tokens: [De, rugzak, is, net, zo, praktisch, als, de, tas]}
        exercises:
          - {content_key: nl.a1.unit14.lesson03.exercise01.choose_equal_looks, type: multiple_choice, tested_text: "Deze rugzak is net zo mooi als die tas", prompt: {target_blocks: [{text: "This backpack is just as nice-looking as that bag.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson03.exercise02.listen_equal_practical, type: listen_select, tested_text: "De rugzak is net zo praktisch als de tas", media_asset_key: nl.a1.audio.comparisons.net_zo_praktisch.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit14.lesson03.exercise03.match_equal_meaning, type: matching_pairs, tested_text: "net zo mooi als net zo praktisch als", prompt: {target_blocks: []}, pairs: [{left: "net zo mooi als", right: "equally nice-looking"}, {left: "net zo praktisch als", right: "equally practical"}]}
          - {content_key: nl.a1.unit14.lesson03.exercise04.order_equal_looks, type: word_order, tested_text: "Deze rugzak is net zo mooi als die tas", prompt: {target_blocks: []}, word_bank: [die, Deze, is, tas, mooi, rugzak, net, zo, als]}
          - {content_key: nl.a1.unit14.lesson03.exercise05.complete_equal_practical, type: fill_in_blank, tested_text: "De rugzak is net zo praktisch als de tas", prompt: {target_blocks: [{text: "De rugzak is net zo ___ als de tas.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson03.exercise06.translate_equal_looks, type: translation, tested_text: "Deze rugzak is net zo mooi als die tas", prompt: {target_blocks: [{text: "This backpack is just as nice-looking as that bag.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit14.lesson04.de_beste_keuze
        title: "De beste keuze"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: nl.a1.unit14.lesson04.teach.superlative_rule, kind: grammar_note, target: {text: "Bij een superlatief gebruik je vaak het plus het bijvoeglijk naamwoord plus st.", language_code: nl, direction: ltr}, introduced_tokens: [Bij, een, superlatief, gebruik, je, vaak, het, plus, bijvoeglijk, naamwoord, st]}
          - {content_key: nl.a1.unit14.lesson04.teach.duurst, kind: phrase, target: {text: "Van deze twee is de rugzak het duurst.", language_code: nl, direction: ltr}, introduced_tokens: [Van, deze, twee, is, de, rugzak, het, duurst]}
          - {content_key: nl.a1.unit14.lesson04.teach.irregular_rule, kind: grammar_note, target: {text: "Goed, beter, best zijn onregelmatig: dit is de beste keuze. Veel, meer, meest werkt op dezelfde manier.", language_code: nl, direction: ltr}, introduced_tokens: [Goed, beter, best, zijn, onregelmatig, dit, is, de, beste, keuze, Veel, meer, meest, werkt, op, dezelfde, manier]}
          - {content_key: nl.a1.unit14.lesson04.teach.beste_keuze, kind: phrase, target: {text: "Deze rugzak is de beste keuze voor een lange treinreis.", language_code: nl, direction: ltr}, introduced_tokens: [Deze, rugzak, is, de, beste, keuze, voor, een, lange, treinreis]}
          - {content_key: nl.a1.unit14.lesson04.teach.meer_ruimte, kind: phrase, target: {text: "De rugzak heeft meer ruimte dan de tas.", language_code: nl, direction: ltr}, introduced_tokens: [De, rugzak, heeft, meer, ruimte, dan, de, tas]}
        exercises:
          - {content_key: nl.a1.unit14.lesson04.exercise01.choose_most_expensive, type: multiple_choice, tested_text: "Van deze twee is de rugzak het duurst", prompt: {target_blocks: [{text: "Of these two, the backpack is the most expensive.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson04.exercise02.listen_best_choice, type: listen_select, tested_text: "Deze rugzak is de beste keuze voor een lange treinreis", media_asset_key: nl.a1.audio.comparisons.beste_keuze.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit14.lesson04.exercise03.match_irregular_chains, type: matching_pairs, tested_text: "goed beter best veel meer meest", prompt: {target_blocks: []}, pairs: [{left: "goed - beter - best", right: "good - better - best"}, {left: "veel - meer - meest", right: "much - more - most"}]}
          - {content_key: nl.a1.unit14.lesson04.exercise04.order_more_room, type: word_order, tested_text: "De rugzak heeft meer ruimte dan de tas", prompt: {target_blocks: []}, word_bank: [ruimte, De, tas, heeft, meer, dan, rugzak, de]}
          - {content_key: nl.a1.unit14.lesson04.exercise05.complete_most_expensive, type: fill_in_blank, tested_text: "Van deze twee is de rugzak het duurst", prompt: {target_blocks: [{text: "Van deze twee is de rugzak het ___.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson04.exercise06.translate_best_choice, type: translation, tested_text: "Deze rugzak is de beste keuze voor een lange treinreis", prompt: {target_blocks: [{text: "This backpack is the best choice for a long train trip.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson04.exercise07.write_more_room, type: writing_prompt, tested_text: "De rugzak heeft meer ruimte dan de tas", prompt: {target_blocks: [{text: "Write in Dutch: The backpack has more room than the bag.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit14.lesson05.advertentie_lezen
        title: "Een advertentie lezen"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - content_key: nl.a1.unit14.lesson05.teach.advertentie
            kind: reading
            target:
              text: >-
                Rugzak Bergsport: vijfenveertig euro. Deze rugzak is groot
                en sterk. Schoudertas Stad: twintig euro. Deze tas is
                kleiner en lichter dan de rugzak, maar minder sterk. Voor
                een lange reis is de rugzak de beste keuze, want hij is
                sterker en heeft meer ruimte.
              language_code: nl
              direction: ltr
            introduced_tokens: [Bergsport, vijfenveertig, sterk, Schoudertas, Stad, twintig, kleiner, lichter, minder, lange, reis, sterker, ruimte]
        exercises:
          - {content_key: nl.a1.unit14.lesson05.exercise01.read_price, type: reading_comprehension, tested_text: "vijfenveertig euro", prompt: {target_blocks: [{text: "How much does the backpack cost?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson05.exercise02.read_bag_description, type: reading_comprehension, tested_text: "kleiner en lichter dan de rugzak", prompt: {target_blocks: [{text: "How does the text describe the bag compared to the backpack?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson05.exercise03.read_recommendation, type: reading_comprehension, tested_text: "de rugzak is de beste keuze", prompt: {target_blocks: [{text: "Which item does the text recommend for a long trip?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit14.lesson05.exercise04.listen_recommendation, type: listen_select, tested_text: "de rugzak is de beste keuze", media_asset_key: nl.a1.audio.comparisons.advertentie.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit14.lesson05.exercise05.match_items, type: matching_pairs, tested_text: "Rugzak Bergsport Schoudertas Stad", prompt: {target_blocks: []}, pairs: [{left: "Rugzak Bergsport", right: "groot, sterk, 45 euro"}, {left: "Schoudertas Stad", right: "kleiner, lichter, 20 euro"}]}
          - {content_key: nl.a1.unit14.lesson05.exercise06.write_comparison, type: writing_prompt, tested_text: "De rugzak is groter en sterker dan de tas", prompt: {target_blocks: [{text: "Write in Dutch that the backpack is bigger and stronger than the bag, using dan.", language_code: en, direction: ltr}]}}

      - content_key: nl.a1.unit14.lesson06.lotte_en_omar_kiezen_tas
        title: "Lotte en Omar kiezen een tas"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - {content_key: nl.a1.unit14.lesson06.teach.lotte_open, kind: dialogue, target: {text: "Lotte: Kijk, deze rugzak is groter dan die tas.", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Kijk, deze, rugzak, is, groter, dan, die, tas]}
          - {content_key: nl.a1.unit14.lesson06.teach.omar_room, kind: dialogue, target: {text: "Omar: Ja, en hij heeft meer ruimte. Ik heb een grote tas nodig voor de treinreis.", language_code: nl, direction: ltr}, introduced_tokens: [Omar, Ja, en, hij, heeft, meer, ruimte, Ik, heb, een, grote, tas, nodig, voor, de, treinreis]}
          - {content_key: nl.a1.unit14.lesson06.teach.lotte_best_choice, kind: dialogue, target: {text: "Lotte: Dan is de rugzak de beste keuze voor jou.", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Dan, is, de, rugzak, beste, keuze, voor, jou]}
          - {content_key: nl.a1.unit14.lesson06.teach.omar_question, kind: dialogue, target: {text: "Omar: Precies. Welke tas vind jij het mooist?", language_code: nl, direction: ltr}, introduced_tokens: [Omar, Precies, Welke, tas, vind, jij, het, mooist]}
          - {content_key: nl.a1.unit14.lesson06.teach.lotte_choice, kind: dialogue, target: {text: "Lotte: Ik vind deze schoudertas het mooist. En hij is licht.", language_code: nl, direction: ltr}, introduced_tokens: [Lotte, Ik, vind, deze, schoudertas, het, mooist, En, hij, is, licht]}
          - {content_key: nl.a1.unit14.lesson06.teach.omar_close, kind: dialogue, target: {text: "Omar: Goed, dan koop ik de rugzak en jij de schoudertas.", language_code: nl, direction: ltr}, introduced_tokens: [Omar, Goed, dan, koop, ik, de, rugzak, en, jij, schoudertas]}
          - {content_key: nl.a1.unit14.lesson06.teach.koopt_form, kind: grammar_note, target: {text: "Koop is de ik-vorm van kopen; koopt is de hij- of zij-vorm.", language_code: nl, direction: ltr}, introduced_tokens: [Koop, is, de, ik, vorm, van, kopen, koopt, hij, of, zij, vorm]}
