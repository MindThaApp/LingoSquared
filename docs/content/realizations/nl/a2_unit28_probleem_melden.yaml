target_language: nl
cefr_level: A2
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    The formal register pattern for reporting a household problem
    (describing what's wrong, asking about timing, confirming contact
    details) is scaffolded from the FSI Dutch Basic Course (Foreign
    Service Institute, US Department of State -- public domain, no
    attribution required per docs/content/AUTHORING_GUIDE.md §10). The
    source frames this around a 1960s-70s landlord relationship with
    dated register; the specific scenario (reporting to a Dutch
    woningcorporatie, a scheduled monteur visit) reflects contemporary
    Dutch rental practice and is freshly authored, not translated or
    lightly edited from the source.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Fifth Dutch A2 unit (spine outcome:
    universal.a2.housing.report_maintenance_problem, newly added to
    universal_spine.yaml this session), continuing the Lotte/Omar
    storyline -- the heating in Omar's apartment (unit18) stops
    working as the weather turns cold (unit19), so he reports it to
    the woningcorporatie. The specific facts (heating problem, broken
    since last night, technician coming tomorrow morning between nine
    and eleven) are stated consistently between lesson02-04's teaching
    examples, lesson05's reading, and lesson06's dialogue per
    AUTHORING_GUIDE §11. Every multi-clause accepted_answers list
    authored with period/comma/conjunction-joined forms per §12. Every
    fill_in_blank frame retains visible surrounding text per §13. Every
    listen_select/listen_order/listen_type/dialogue_comprehension
    exercise double-checked against its media_asset_key's declared
    text before finalizing; the lesson06 opening listen_select uses a
    dedicated short audio asset rather than the full dialogue clip.
    Every matching_pairs exercise in lessons 01-04 pools forward from
    vocabulary taught so far in the unit per AUTHORING_GUIDE §16 (3
    pairs in lesson01, capped by it being the unit's first lesson, then
    5/6/7 pairs in lessons 02-04 as the pool grows); lesson05's
    structural reading-comprehension matching exercise is kept smaller
    since it tests text structure, not vocabulary.

    A fresh-context review ran and found several genuine issues, all
    fixed: (1) the lesson06 respond_confirm_home overlay instruction
    was the bare Dutch cue line itself rather than an English task
    description, which compiled into a mislabeled Dutch-tagged
    duplicate of the target-language prompt -- fixed to an English
    instruction matching every sibling dialogue_response exercise. (2)
    The grammar_gedaan teaching card's target.text (tagged
    language_code: nl) had an English parenthetical baked in --
    trimmed to pure Dutch, leaving the explanation to the overlay's
    note field where it already existed cleanly. (3) Three declared
    media_assets (wat_is_probleem, monteur_langskomen, melding_doen)
    were never wired into any exercise -- dropped rather than
    restructuring lesson pacing to add new listening exercises, since
    each phrase is already tested via reading/drag/production
    exercises elsewhere in the unit. (4) Two teaching notes fixed for
    consistency: the morgenochtend note's asterisk-marking (§15) was
    applied to only the first Dutch word in the sentence, not all of
    them; and the contact_opnemen note called the whole phrase "a
    separable verb" when only opnemen is the separable verb. Noted but
    not remediated here, matching unit27's own precedent: the unit's
    sole dialogue_response (speaking-modality proxy) tests confirming
    availability rather than the spine's actual speaking task
    (describing the problem and asking about repair timing) -- both of
    those are tested via other modalities (multiple_choice/word_order/
    writing_prompt) but not as a speaking-shaped production exercise;
    flagged for a future addition, not a blocking defect. Re-validated
    and re-compiled clean (0 errors/0 warnings) after all fixes,
    including the full 5-unit A2 course together. Pending Ramin's
    native-speaker review. Audio assets are declared for generation.

    2026-07-07: AUTHORING_GUIDE.md #19 retrofit -- every vocabulary
    card (probleem, verwarming, monteur, melding) gained an example
    sentence built from this unit's own taught material; schema_version
    bumped to 1.1 (missing examples are now a hard compiler error for
    this file). Example sentences are Claude-authored and pending
    fresh-context review.

    2026-07-10: second fresh-context review pass (Claude, zero access to
    the authoring reasoning above beyond reading this file's own review
    notes, sibling nl-en overlay not consulted). Independently re-verified
    every fix the prior pass claims is actually present in the file as
    written: the grammar_gedaan teaching card's target.text is pure
    Dutch with no English parenthetical baked in; the wat_is_probleem/
    monteur_langskomen/melding_doen media assets are absent from
    media_assets (correctly dropped, not left orphaned); the overlay's
    respond_confirm_home instruction is an English task description, not
    the bare Dutch cue line; the morgenochtend note asterisk-marks all
    three Dutch words (Morgenochtend, morgen, ochtend); the contact_
    opnemen note narrows the separable-verb claim to just "Opnemen". Also
    independently checked: no same-speaker-distractor collision in the
    lesson06 dialogue exercises, matching_pairs shapes, a recursive
    yaml.safe_load boolean-coercion scan of this file and its overlay, and
    every exercise `type:` against `ExerciseRenderer.tsx`'s registered
    cases. Ran `scripts/compile_content.py validate` against the full
    a2_unit24-28 batch together: 0 errors, 0 warnings. Found no additional
    issues (the previously-flagged, deliberately-unremediated speaking-
    modality gap remains an accurate, non-blocking note, not something
    this pass silently dropped). Native-speaker review is still planned.

    Language review 2026-10-20 (session 9, en-nl): 0 fixes in the realization -- Dutch cards, tested_text, word banks, pairs and asset text checked, consistent with the overlay; (4 fixes in the en-nl overlay). NATIVE FLAGS: none.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Omar
    and the woningcorporatie employee use the formal u throughout this
    unit, the same register convention as units 24, 26, and 27.

media_assets:
  - {content_key: nl.a2.audio.probleem.probleem_appartement.01, language: nl, text: "Er is een probleem in mijn appartement.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.probleem.verwarming_werkt_niet.01, language: nl, text: "De verwarming werkt niet. Het is erg koud in mijn appartement.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.probleem.monteur_morgenochtend.01, language: nl, text: "De monteur komt morgenochtend langs.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.probleem.contact_24_uur.01, language: nl, text: "Wij nemen binnen vierentwintig uur contact met u op.", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: nl.a2.audio.probleem.bevestiging.01
    language: nl
    text: >-
      Bevestiging: uw melding over de verwarming is ontvangen. Een
      monteur komt morgenochtend tussen negen en elf uur langs. Bent u
      niet thuis? Bel dan naar de woningcorporatie.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.probleem.medewerker_open.01
    language: nl
    text: "Woningcorporatie, goedemiddag."
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.verwarming_melden.01
    language: nl
    text: >-
      Medewerker: Woningcorporatie, goedemiddag. Omar: Goedemiddag, ik
      wil graag een melding doen. De verwarming in mijn appartement
      werkt niet. Medewerker: Wat vervelend. Sinds wanneer heeft u dit
      probleem? Omar: Sinds gisteravond. Het is erg koud in mijn
      appartement. Medewerker: Ik snap het. Wij sturen morgenochtend
      een monteur langs. Omar: Hoe laat komt de monteur? Medewerker:
      Tussen negen en elf uur. Bent u dan thuis? Omar: Ja, ik ben
      morgenochtend thuis. Dank u wel.
    voice_hint: two_adults_formal_polite
    status: pending_generation

