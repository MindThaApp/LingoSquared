generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation. Checked firecrawl search/scrape for an
    intermediate-level public-domain Dutch course first (per
    AUTHORING_GUIDE.md §10) -- firecrawl is still returning HTTP 402
    (account credits exhausted, a standing outage as of this dispatch),
    and no genuine FSI/Peace-Corps-equivalent intermediate Dutch source is
    known to exist. Built from general Dutch grammar knowledge, not
    adapted from a source. nl's eleventh B1 unit, the last of five
    closing the outcome-coverage gap documented in b1_unit06/07/08/09/10's
    own provenance notes. Targets universal.b1.narrative.recount_past_
    experience_with_sequencing, the sixth and final first-wave outcome
    shared with fa/ro/hi/prs -- with this unit, nl's B1 course reaches
    full 1:1 outcome-ID parity with fa/ro/hi/prs's first-wave set (all
    six: necessity, abilities, hypotheticals, debate, workplace,
    narrative, now units 06-11).
review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  notes: >-
    nl's eleventh B1 unit. Targets universal.b1.narrative.recount_past_
    experience_with_sequencing -- recounting a past experience as a
    sequence of events, marking background action against a main-line
    event with a sequencing connector, and reporting what someone said.
    Three real Dutch constructions taught in sequence: (1) *terwijl* +
    *was aan het X* (durative/progressive background) contrasted with a
    simple-past punctual main-line event, the core "background vs.
    main-line" contrast the outcome asks for (lesson01); (2) pure
    chronological sequencing adverbs *eerst*/*later* (lesson02); (3)
    *toen* (when) introducing the triggering moment, combined with
    reported-speech backshift (*zei dat hij ... kon* -- present *kan*
    shifting to past *kon* inside the *dat*-clause) -- deliberately kept
    LIGHT here (a single embedded reported clause, not a systematic
    tense-backshift drill), since nl's own existing b1_unit05
    (universal.b1.reported_speech... communication.report_what_someone_
    said, second wave) already owns deep reported-speech coverage; this
    unit only needs enough reported speech to satisfy the narrative
    outcome's own "and report what someone reportedly said" clause
    (lesson03). Also demonstrates a genuine, easy-to-miss Dutch word-
    order fact: the separable verb *opnemen* (to pick up/answer) splits
    in a main clause (*ik nam ... op*, lesson02) but REJOINS into one
    word at the end of a subordinate clause (*toen ik opnam*, lesson03)
    -- flagged explicitly in lesson03's grammar note. Continues Lotte and
    Omar's established informal jij/je register, and reuses Sara
    (established in b1_unit05/b1_unit08 as a mutual friend) as the person
    Lotte recounts the story to. No sibling-direction file (nl-en) was
    consulted. All vocabulary, including basic function words, is
    introduced self-contained within this file. Fresh-context review
    2026-07-11 (AUTHORING_GUIDE.md §20): Dutch verified grammatical and
    natural -- the aan-het-koken-was periphrastic progressive (verb-
    final in the terwijl-clause), separable *opnemen* correctly split
    in the main clause (nam ... op) vs rejoined in the subclause (toen
    ik opnam), reported-speech backshift kan->kon, and the er ... om
    split ("lachten we er samen om") all correct; word_order
    accepted_answers correctly comma-free; no listen_select distractor
    collisions across the full-dialogue audio; Sara/Omar/Lotte
    continuity consistent. ONE native-judgment flag for
    ramin_native_pass, not a grading bug: lesson03 exercise01
    recognize_toen offers "then" as a distractor against correct "when"
    -- "then" is a genuine adverbial sense of *toen*, mitigated by the
    "in this context" instruction and the immediately-preceding
    teaching card, but the prompt shows only the bare word; native to
    judge whether to swap the distractor. No objective grading bugs
    found.

