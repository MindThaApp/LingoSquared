            target:
              text: >-
                Uiteindelijk heb ik de trein gemist. Toen ik op het station
                aankwam, was de trein al vertrokken. Het regende die ochtend
                en ik had haast. Maar dit was eerder begonnen: de avond
                ervoor had ik mijn wekker niet gezet. Daardoor werd ik te
                laat wakker.
              language_code: nl
              direction: ltr
            introduced_tokens: [en, maar, dit, eerder, begonnen, daardoor, werd, wakker]
        exercises:
