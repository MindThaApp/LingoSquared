        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: nl.b2.unit04.lesson01.teach.ik_was_moe
            kind: phrase
            target: {text: "Ik was moe.", language_code: nl, direction: ltr}
            introduced_tokens: [ik, was, moe]
          - content_key: nl.b2.unit04.lesson01.teach.die_ochtend
            kind: vocabulary
            target: {text: "die ochtend", language_code: nl, direction: ltr}
            introduced_tokens: [die, ochtend]
            example: {text: "Die ochtend was ik moe.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit04.lesson01.teach.regenen
            kind: vocabulary
            target: {text: "regenen", language_code: nl, direction: ltr}
            introduced_tokens: [het, regende, regenen]
            example: {text: "Het regende die ochtend.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit04.lesson01.teach.buiten
            kind: vocabulary
            target: {text: "buiten", language_code: nl, direction: ltr}
            introduced_tokens: [buiten]
            example: {text: "Buiten regende het.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit04.lesson01.teach.koud
            kind: vocabulary
            target: {text: "koud", language_code: nl, direction: ltr}
            introduced_tokens: [koud]
            example: {text: "Het was koud buiten.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit04.lesson01.teach.haast
            kind: vocabulary
            target: {text: "haast", language_code: nl, direction: ltr}
            introduced_tokens: [had, haast, hebben]
            example: {text: "Ik had haast.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit04.lesson01.teach.nog_donker
            kind: phrase
            target: {text: "Het was nog donker.", language_code: nl, direction: ltr}
            introduced_tokens: [nog, donker]
          - content_key: nl.b2.unit04.lesson01.teach.grammar_imperfectum
            kind: grammar_note
            target: {text: "Het regende. Ik was moe. Ik had haast.", language_code: nl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: nl.b2.unit04.lesson01.exercise01.recognize_regende
            type: multiple_choice
            tested_text: regende
            prompt: {target_blocks: [{text: regende, language_code: nl, direction: ltr}]}
          - content_key: nl.b2.unit04.lesson01.exercise02.listen_regende
            type: listen_select
            tested_text: "Het regende die ochtend"
            media_asset_key: nl.b2.audio.verhaal.regende_ochtend.01
            prompt: {target_blocks: []}
          - content_key: nl.b2.unit04.lesson01.exercise03.match_background_words
            type: matching_pairs
            tested_text: "die ochtend regenen moe koud buiten haast"
            prompt: {target_blocks: []}
            pairs:
              - {left: "die ochtend", right: "that morning"}
              - {left: regenen, right: "to rain"}
              - {left: moe, right: tired}
              - {left: koud, right: cold}
              - {left: buiten, right: outside}
              - {left: haast, right: "hurry / haste"}
          - content_key: nl.b2.unit04.lesson01.exercise04.order_nog_donker
            type: word_order
            tested_text: "Het was nog donker"
            prompt: {target_blocks: []}
            word_bank: [Het, was, nog, donker]
          - content_key: nl.b2.unit04.lesson01.exercise05.translate_regende
            type: translation
            tested_text: "Het regende die ochtend"
            prompt: {target_blocks: [{text: "Translate into Dutch, setting the background scene with the imperfectum: It was raining that morning.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit04.lesson01.exercise06.write_ik_was_moe
            type: writing_prompt
            tested_text: "Ik was moe"
            prompt: {target_blocks: [{text: "Write in Dutch, using the imperfectum for background: I was tired.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit04.lesson01.exercise07.speak_haast
            type: speak_response
            tested_text: "Ik had haast"
            prompt: {target_blocks: [{text: "Say aloud in Dutch, using the imperfectum: I was in a hurry.", language_code: en, direction: ltr}]}

