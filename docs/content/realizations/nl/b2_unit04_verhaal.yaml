  - content_key: nl.b2.audio.verhaal.dialogue.te_laat.01
    language: nl
    text: >-
      Lotte: Waarom was je vanochtend zo laat? Omar: Ik heb de trein
      gemist. Toen ik op het station aankwam, was hij al vertrokken. Lotte:
      En waarom was je te laat op het station? Omar: Ik had me verslapen.
      De avond ervoor had ik mijn wekker niet gezet. Lotte: Dus dat was
      eerst gebeurd, en daarna miste je de trein. Omar: Precies. Eerst de
      wekker, daarna de trein.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.b2.unit04.verhaal
    title: "Een verhaal vertellen"
    section: reading_writing
