schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: B2
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is nl's third
    B2 unit (narrative / shifting time reference). No adaptable
    intermediate/upper-intermediate public-domain Dutch source exists (the
    FSI Dutch Basic Course used for nl's A1/A2 is beginner-only), so this
    was built from general Dutch grammar/discourse knowledge, the same
    honest-disclosure precedent nl's earlier B1 and B2 units set.
    Sibling-isolation honored: the X->en B2 narrative realization and every
    fa/prs/de B2 file were treated as non-existent and were NOT opened;
    only nl's OWN earlier realization content (the Lotte/Omar pair, and the
    b2_unit02 speculation SHAPE) was consulted, which is not a
    sibling-direction violation. Lotte and Omar are an informal jij/je
    conversational pair with no pinned occupation in canon; here Omar
    recounts to Lotte why he was late that morning, which introduces no
    canon conflict.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) naturalness of every past-tense time frame -- that
    imperfectum (background: 'het regende', 'ik was moe', 'ik had haast'),
    perfectum (foreground event: 'ik heb de trein gemist', 'ik ben te laat
    gekomen'), and de plusquamperfectum (pre-past: 'ik had mijn wekker niet
    gezet', 'de trein was al vertrokken', 'ik had me verslapen') all read
    as natural everyday spoken Dutch; (2) the interruptive 'toen' vs
    ongoing 'terwijl' vs habitual 'als/wanneer' distinction taught in
    lesson03 -- confirm 'Toen ik op het station aankwam, vertrok de trein
    net' and 'Terwijl ik me aankleedde, belde mijn baas' and 'Als ik te
    laat ben, bel ik altijd mijn baas' each read correctly, and that a
    native would NOT accept 'als' for the single past interruption; (3)
    word order in the pre-past clauses, especially 'Tegen de tijd dat ik
    aankwam, was de trein al vertrokken' and the plusquamperfectum
    inversion after 'de avond ervoor'; (4) the culminating writing exercise
    (lesson06 exercise06) is graded against a fixed three-sentence string
    -- only the all-periods and no-trailing-period variants are supplied,
    so a learner who replaces an internal period with a comma, or omits
    one, would exceed distance-1 typo tolerance; decide whether more
    punctuation variants are needed or the item should be reframed; the
    same caveat applies to the two-sentence speak_response
    (lesson06 exercise05); (5) confirm 'zich verslapen', 'de wekker
    zetten', 'in de file' is NOT used here (that was unit02) so nothing
    clashes, 'aankomen'/'vertrekken' as separable perfects, and 'daardoor',
    'tegen de tijd dat', 'de avond ervoor' all read as current everyday
    informal Dutch; (6) confirm the background-vs-foreground framing
    (imperfectum paints the scene, perfectum reports the event) matches how
    a native would tell this story.
  notes: >-
    Third Dutch B2 unit; first narrative / shifting-time-reference unit.
    Targets the CEFR B2 narrative outcome
    (universal.b2.narrative.recount_complex_events_with_shifting_time):
    recount a complex sequence with shifting time reference -- background
    vs foreground, events BEFORE other past events, interrupted/ongoing
    actions -- keeping the timeline unambiguous. Theme: ONE coherent
    everyday incident recounted non-linearly across all six lessons -- the
    narrator missed the train because of an earlier event (an unset alarm
    the night before -> oversleeping -> arriving to find the train already
    gone). Lesson arc: L01 the BACKGROUND with the imperfectum (het
    regende, ik was moe, ik had haast); L02 the FOREGROUND event with the
    perfectum plus sequence markers (ik heb de trein gemist; eerst /
    daarna / vervolgens / uiteindelijk); L03 the interruptive 'toen' vs
    ongoing 'terwijl' vs habitual 'als/wanneer'; L04 the PRE-PAST with de
    plusquamperfectum (had/was + participle: ik had mijn wekker niet gezet,
    de trein was al vertrokken; voordat / nadat / tegen de tijd dat); L05 a
    non-linear reading that must be re-ordered to find the EARLIEST
    (pre-past) event; L06 the culminating production -- a Lotte/Omar
    dialogue for the listening requirement (an account told OUT OF ORDER;
    reconstruct the true chronology), a speaking task (recount with
    background + an interrupting event + a pre-past event) and a writing
    task (background + foregrounded event + an event that preceded both).
    Register: informal jij/je throughout, per the nl lane pin; Lotte and
    Omar continue their established informal register from
    a2_unit25_meningen. All vocabulary is introduced self-contained within
    this file (B2 is a separate Course row from B1, so a B2 learner never
    sees B1 lexemes at runtime -- same self-containment precedent as nl's
    earlier B1/B2 units). No sibling-direction file was consulted.

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Informal jij/je throughout (nl lane pin). B2 narrative layers the past
    tenses onto that register -- imperfectum for background, perfectum for
    the foregrounded event, de plusquamperfectum (had/was + participle) for
    events before other past events -- while keeping everyday informal
    address (je, was je zo laat, ik had me verslapen). Lotte and Omar
    continue the informal jij/je they use with each other in
    a2_unit25_meningen.

