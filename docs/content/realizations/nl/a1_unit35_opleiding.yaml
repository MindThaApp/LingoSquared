            kind: vocabulary
            target: {text: "studeren", language_code: nl, direction: ltr}
            introduced_tokens: [studeren, Sander, studeert, Spaans]
            example:
              - {text: "Sander studeert Spaans.", language_code: nl, direction: ltr}
          - content_key: nl.a1.unit35.lesson01.teach.opleiding
            kind: vocabulary
            target: {text: "de opleiding", language_code: nl, direction: ltr}
            introduced_tokens: [de, opleiding, doet, een]
            example: {text: "Sander doet een opleiding Spaans.", language_code: nl, direction: ltr}
          - {content_key: nl.a1.unit35.lesson01.teach.wat_studeer_je, kind: phrase, target: {text: "Wat studeer je?", language_code: nl, direction: ltr}, introduced_tokens: [Wat, studeer, je]}
          - {content_key: nl.a1.unit35.lesson01.teach.ik_studeer_elke_week, kind: phrase, target: {text: "Ik studeer elke week Spaans.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, studeer, elke, week, Spaans]}
