            example: {text: "Sander volgt een cursus Spaans.", language_code: nl, direction: ltr}
          - content_key: nl.a1.unit35.lesson02.teach.leren
            kind: vocabulary
            target: {text: "leren", language_code: nl, direction: ltr}
            introduced_tokens: [leren, leer, leert, graag, nieuwe, dingen, Fenna]
            example: {text: "Fenna leert graag nieuwe dingen.", language_code: nl, direction: ltr}
          - content_key: nl.a1.unit35.lesson02.teach.leren_cursus_note
            kind: grammar_note
            target: {text: "*Leren* is algemeen (iets nieuws leren); *een cursus volgen* is specifiek (je bent ingeschreven bij een school of opleiding).", language_code: nl, direction: ltr}
