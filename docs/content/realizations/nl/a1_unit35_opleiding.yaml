course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Sander
    and Fenna use informal jij/je throughout this unit -- no formal u
    appears, matching every other A1 unit's register_policy.

