              text: >-
                Sander werkt niet alleen, hij studeert ook. Hij volgt
                een cursus Spaans aan de volksuniversiteit. Hij leert
                elke week nieuwe woorden. Fenna doet een opleiding aan
                de hogeschool. Zij studeert daar gezondheidszorg. Beiden
                vinden studeren leuk. Wat studeer jij, of wat wil je
                graag leren?
