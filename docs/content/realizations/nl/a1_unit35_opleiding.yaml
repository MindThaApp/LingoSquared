          - {content_key: nl.a1.unit35.lesson02.exercise03.match_cursus_words, type: matching_pairs, tested_text: "cursus volgen leren graag nieuwe dingen", prompt: {target_blocks: []}, pairs: [{left: "de cursus", right: "the course"}, {left: volgen, right: "to take/follow (a course)"}, {left: leren, right: "to learn"}, {left: "Fenna leert graag nieuwe dingen.", right: "Fenna likes learning new things."}, {left: "Sander volgt een cursus Spaans.", right: "Sander is taking a Spanish course."}, {left: "nieuwe dingen", right: "new things"}]}
          - {content_key: nl.a1.unit35.lesson02.exercise04.order_sander_volgt, type: word_order, tested_text: "Sander volgt een cursus Spaans", prompt: {target_blocks: []}, word_bank: [Sander, volgt, een, cursus, Spaans]}
