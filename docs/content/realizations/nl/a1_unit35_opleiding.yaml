          - {content_key: nl.a1.unit35.lesson01.exercise01.choose_sander_studeert, type: multiple_choice, tested_text: "Sander studeert Spaans", prompt: {target_blocks: [{text: "Sander studeert Spaans.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a1.unit35.lesson01.exercise02.listen_sander_studeert, type: listen_select, tested_text: "Sander studeert Spaans", media_asset_key: nl.a1.audio.opleiding.sander_studeert.01, prompt: {target_blocks: []}}
          - {content_key: nl.a1.unit35.lesson01.exercise03.match_study_words, type: matching_pairs, tested_text: "studeren opleiding Spaans wat studeer je", prompt: {target_blocks: []}, pairs: [{left: studeren, right: "to study"}, {left: "de opleiding", right: "the programme/course of study"}, {left: "Wat studeer je?", right: "What do you study?"}, {left: "Sander studeert Spaans.", right: "Sander studies Spanish."}, {left: "Sander doet een opleiding Spaans.", right: "Sander is doing a Spanish programme."}, {left: "Ik studeer elke week Spaans.", right: "I study Spanish every week."}]}
