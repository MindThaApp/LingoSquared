          - {content_key: nl.a1.unit35.lesson01.exercise06.translate_opleiding, type: translation, tested_text: "de opleiding", prompt: {target_blocks: [{text: "the programme/course of study", language_code: en, direction: ltr}]}}
          - {content_key: nl.a1.unit35.lesson01.exercise07.respond_wat_studeer_je, type: dialogue_response, tested_text: "Ik studeer Spaans", prompt: {target_blocks: [{text: "Wat studeer je?", language_code: nl, direction: ltr}]}}

      - content_key: nl.a1.unit35.lesson02.cursus_leren
        title: "Een cursus volgen en leren"
        spine_outcome_id: universal.a1.education.talk_about_studies
