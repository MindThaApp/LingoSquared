          - {"content_key": "nl.a2.unit92.lesson06.teach.omar_graag", "kind": "dialogue", "target": {"text": "Ja, graag. Heb jij morgen tijd?", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Ja", "ja", "graag", "Heb", "heb", "jij", "morgen", "tijd"]}
          - {"content_key": "nl.a2.unit92.lesson06.teach.lotte_morgen", "kind": "dialogue", "target": {"text": "Ja, morgen heb ik tijd.", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Ja", "ja", "morgen", "heb", "ik", "tijd"]}
        exercises:
          - {"content_key": "nl.a2.unit92.lesson06.exercise01.listen_opening", "type": "listen_select", "tested_text": "Hoi Omar kom je vanavond", "prompt": {"target_blocks": [{"text": "Listen and select Lotte's opening question.", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "nl.a2.audio.dialogue.omdat_want_dus.01"}
          - {"content_key": "nl.a2.unit92.lesson06.exercise02.comprehend", "type": "dialogue_comprehension", "tested_text": "Omdat mijn collega ziek is Hij kan niet werken dus ik werk vanavond", "prompt": {"target_blocks": [{"text": "Why can Omar not come tonight?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "nl.a2.audio.dialogue.omdat_want_dus.01"}
          - {"content_key": "nl.a2.unit92.lesson06.exercise03.match_dialogue", "type": "matching_pairs", "tested_text": "Waarom kom je niet Nee sorry ik kan niet komen Omdat mijn collega ziek is dus ik werk vanavond Kunnen we de afspraak verzetten Ja morgen heb ik tijd", "prompt": {"target_blocks": []}, "pairs": [{"left": "Waarom kom je niet?", "right": "asks for the reason"}, {"left": "Nee, sorry, ik kan niet komen.", "right": "turns down the invitation"}, {"left": "Omdat mijn collega ziek is", "right": "gives the reason"}, {"left": "dus ik werk vanavond", "right": "gives the consequence"}, {"left": "Kunnen we de afspraak verzetten?", "right": "asks to reschedule"}, {"left": "Ja, morgen heb ik tijd.", "right": "agrees on a new day"}]}
          - {"content_key": "nl.a2.unit92.lesson06.exercise04.order_dus", "type": "word_order", "tested_text": "Hij kan niet werken dus ik werk vanavond", "prompt": {"target_blocks": []}, "word_bank": ["werken", "vanavond", "werk", "dus", "ik", "kan", "niet", "hij"]}
          - {"content_key": "nl.a2.unit92.lesson06.exercise05.respond_why", "type": "dialogue_response", "tested_text": "Omdat ik moet werken", "prompt": {"target_blocks": [{"text": "Waarom kom je niet?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit92.lesson06.exercise06.translate_fronted", "type": "translation", "tested_text": "Omdat mijn collega ziek is werk ik vanavond", "prompt": {"target_blocks": [{"text": "Because my colleague is ill, I am working tonight.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit92.lesson06.exercise07.write_account", "type": "writing_prompt", "tested_text": "Mijn collega is ziek dus ik moet werken Ik kan vanavond niet komen omdat ik moet werken Kunnen we de afspraak verzetten", "prompt": {"target_blocks": [{"text": "Write exactly three Dutch sentences: (1) your colleague is ill, so you have to work, using dus; (2) you cannot come tonight, because you have to work, using omdat; (3) ask to reschedule the appointment.", "language_code": "en", "direction": "ltr"}]}}

