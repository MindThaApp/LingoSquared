          - {"content_key": "nl.a2.unit92.lesson05.teach.reading", "kind": "reading", "target": {"text": "Hoi Lotte, sorry, ik kan vanavond niet komen, want ik heb hoofdpijn. Het regent ook hard, dus ik blijf thuis. Morgen kan ik niet, omdat ik moet werken. Heb je overmorgen tijd? Kunnen we de afspraak verzetten? Groetjes, Noor", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Hoi", "Lotte", "sorry", "ik", "kan", "vanavond", "niet", "komen", "want", "heb", "hoofdpijn", "Het", "het", "regent", "ook", "hard", "dus", "blijf", "thuis", "Morgen", "morgen", "omdat", "moet", "werken", "Heb", "je", "overmorgen", "tijd", "Kunnen", "kunnen", "we", "de", "afspraak", "verzetten", "Groetjes", "groetjes", "Noor"]}
        exercises:
