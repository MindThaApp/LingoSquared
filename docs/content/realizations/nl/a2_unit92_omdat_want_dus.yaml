          - {"content_key": "nl.a2.unit92.lesson05.exercise02.read_tomorrow", "type": "reading_comprehension", "tested_text": "Morgen kan ik niet omdat ik moet werken", "prompt": {"target_blocks": [{"text": "Why can Noor not meet tomorrow?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit92.lesson05.exercise03.match_reading", "type": "matching_pairs", "tested_text": "ik kan vanavond niet komen want ik heb hoofdpijn dus ik blijf thuis omdat ik moet werken Heb je overmorgen tijd Kunnen we de afspraak verzetten", "prompt": {"target_blocks": []}, "pairs": [{"left": "ik kan vanavond niet komen", "right": "I cannot come tonight"}, {"left": "want ik heb hoofdpijn", "right": "because I have a headache"}, {"left": "dus ik blijf thuis", "right": "so I am staying at home"}, {"left": "omdat ik moet werken", "right": "because I have to work"}, {"left": "Heb je overmorgen tijd?", "right": "Do you have time the day after tomorrow?"}, {"left": "Kunnen we de afspraak verzetten?", "right": "Can we reschedule the appointment?"}]}
          - {"content_key": "nl.a2.unit92.lesson05.exercise04.order_tomorrow", "type": "word_order", "tested_text": "Morgen kan ik niet omdat ik moet werken", "prompt": {"target_blocks": []}, "word_bank": ["omdat", "werken", "kan", "ik", "morgen", "niet", "moet", "ik"]}
