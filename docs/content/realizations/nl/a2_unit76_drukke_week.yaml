    language: nl
    text: >-
      Nina's week ziet er druk uit. Op maandag en dinsdag werkt ze in
      de bibliotheek. Op woensdagavond heeft ze een taalcursus. Op
      donderdag sport ze met vrienden, en op vrijdag kookt ze voor
      haar familie. In het weekend rust ze uit en leest ze een boek.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.drukke_week.lotte_vraag.01
    language: nl
    text: "Hoe ziet jouw week eruit, Omar?"
    voice_hint: neutral_young_adult_friendly
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.drukke_week.01
    language: nl
    text: >-
      Lotte: Hoe ziet jouw week eruit, Omar? Omar: Best druk. Eerst
      werk ik van maandag tot donderdag, daarna heb ik vrijdag vrij.
      Lotte: Wat doe je op je vrije dag? Omar: Op vrijdag sport ik
      meestal, en 's avonds kook ik iets lekkers. Lotte: En in het
      weekend? Omar: In het weekend rust ik uit. Door de week heb ik
      gewoon geen tijd.
    voice_hint: two_young_adults_casual
    status: pending_generation

