  notes: >-
    From-scratch generation, not adapted from a source. This is nl's B2
    negotiation unit. No adaptable intermediate/upper-intermediate
    public-domain Dutch source exists (the FSI Dutch Basic Course used for
    nl's A1/A2 is beginner-only), so this was built from general Dutch
    grammar/discourse knowledge, the same honest-disclosure precedent nl's
    earlier B1/B2 units set. Sibling-isolation honored: the X->en B2
    English realization and every fa/prs/de B2 file were treated as
    non-existent and were NOT opened; only nl's OWN earlier realizations
    (a1_unit17_work, a1_unit29_hobbies, a2_unit25_meningen) were consulted
    for Lotte/Omar character canon, which is not a sibling-direction
    violation. Canon found and honored: Omar works as a cook (kok) in a
    restaurant, Lotte works as a nurse (verpleegkundige) in a hospital,
    they are friends who spend time together and address each other with
    informal jij/je. Here they host a dinner together and negotiate who
    cooks / shops / does the dishes and how to split the bill -- Omar (the
    cook) offering to cook introduces no canon conflict; no shared living
    arrangement is claimed.
review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  notes: >-
    nl's B2 negotiation unit. Targets the CEFR B2 negotiation outcome
    (universal.b2.negotiation.negotiate_and_resolve_disagreement): negotiate
    and resolve a disagreement -- state terms, decline a term, offer a
    CONDITIONAL concession, reach agreement. Theme: one coherent everyday
    disagreement across all six lessons -- Lotte and Omar are hosting a
    dinner together and must divide the work (cooking, grocery shopping,
    the dishes) and split the bill. Lesson arc: L01 making a proposal /
    stating terms (ik stel voor dat / zullen we / wat als we / mijn
    voorstel is); L02 declining politely (dat gaat helaas niet / dat kan ik
    niet / daar kan ik niet mee akkoord gaan / liever niet); L03 the core
    act, a conditional concession (als...dan / op voorwaarde dat / mits /
    tenzij / ik ga akkoord, maar alleen als); L04 reaching agreement
    (afgesproken / dat is goed / (helemaal) akkoord) plus splitting the
    bill; L05 a written EXCHANGE of terms for the reading requirement
    (identify what was agreed and what remains open); L06 the culminating
    production -- a Lotte/Omar dialogue for the listening requirement
    (identify what each side proposes, refuses, and the conditional
    concession offered), a speaking task that requires the WHOLE
    negotiation move (state terms + decline one + conditional concession),
    and a writing task that proposes revised terms while attaching a
    condition to a concession. Register: informal jij/je throughout, per
    the nl lane pin; Lotte and Omar continue their established informal
    register. All vocabulary is introduced self-contained within this file
    (B2 is a separate Course row from B1/A-levels, so a B2 learner never
    sees lower-level lexemes at runtime -- same self-containment precedent
    as nl's earlier B1/B2 units). No sibling-direction file was consulted.

    Native-pass priority checks (moved here from
    required_next_reviewer): Native-Dutch confirmation needed. This is a
    DRAFT. Priority checks for the reviewer: (1) naturalness of every
    negotiation frame in informal jij/je -- especially that 'dat gaat
    helaas niet', 'daar kan ik niet mee akkoord gaan', 'op voorwaarde
    dat', 'mits', 'tenzij', 'ik ga akkoord' and 'afgesproken' all read
    as current everyday spoken Dutch and sit at the intended politeness
    level (a polite decline, not a curt one); (2) SUBORDINATE-CLAUSE
    word order after als / op voorwaarde dat / mits / tenzij / dat --
    every use of the separable verb 'afwassen' is deliberately placed
    only in a subordinate clause so it rejoins as 'afwast' ('...als jij
    afwast', '...op voorwaarde dat jij afwast', 'mits jij afwast');
    confirm each is the natural spoken order and that no main-clause
    'jij wast af' was needed instead; (3) the conditional concession is
    the unit's core act ('Ik kan koken, maar alleen als jij afwast' /
    'Ik ga akkoord, op voorwaarde dat jij afwast') -- confirm the comma
    placement and the als/dan inversion in 'Als jij afwast, dan kook ik'
    read correctly; (4) the culminating speaking answer (lesson06
    exercise05) is a TWO-sentence move graded against a fixed string --
    comma-present, comma-absent, trailing-period and no-trailing-period
    variants are all supplied, but decide whether a learner might join
    the two sentences differently (e.g. with 'en' or a different order)
    and whether more variants are needed; (5) confirm 'een etentje
    geven', 'de boodschappen doen', 'de kosten/de rekening delen', 'de
    helft betalen', 'we worden het eens' and 'schoonmaken' all read as
    natural everyday informal Dutch, and that 'liever niet' softens the
    decline the way an English speaker would expect 'I'd rather not' to.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist):
    checked every teaching card and exercise for Dutch
    correctness/naturalness, CEFR fit, dialogue cards vs the lesson06
    audio (all six turns match, speakers correct), listen distractors vs
    audio, course-scoped vocabulary, dictation strings vs audio text,
    and Lotte/Omar canon (Omar = kok, Lotte = verpleegkundige per
    a1_unit17; consistent). 0 defects found in this realization; all
    fixes were answer-set/instruction fixes in the paired en-nl overlay
    (b2_unit07).

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Informal jij/je throughout (nl lane pin). B2 negotiation layers
    proposing, declining and conditional-concession frames onto that
    register -- ik stel voor dat, zullen we, wat als we, dat gaat helaas
    niet, daar kan ik niet mee akkoord gaan, als...dan, op voorwaarde dat,
    mits, tenzij, ik ga akkoord, afgesproken -- while keeping everyday
    informal address (jij, je, jou). Lotte and Omar continue the informal
    jij/je they use with each other in earlier units.

