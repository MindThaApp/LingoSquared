      - content_key: nl.b2.unit07.lesson06.onderhandelen_in_gesprek
        title: "Onderhandelen in een gesprek"
        spine_outcome_id: universal.b2.negotiation.negotiate_and_resolve_disagreement
        teaching:
          - content_key: nl.b2.unit07.lesson06.teach.idee
            kind: vocabulary
            target: {text: "het idee", language_code: nl, direction: ltr}
            introduced_tokens: [idee]
            example: {text: "Dat is een goed idee.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit07.lesson06.teach.dialogue_lotte_open
            kind: dialogue
            target: {text: "Zullen we vanavond samen koken?", language_code: nl, direction: ltr, speaker: Lotte}
            introduced_tokens: []
          - content_key: nl.b2.unit07.lesson06.teach.dialogue_omar_propose
            kind: dialogue
            target: {text: "Goed idee. Ik stel voor dat ik kook.", language_code: nl, direction: ltr, speaker: Omar}
            introduced_tokens: []
          - content_key: nl.b2.unit07.lesson06.teach.dialogue_lotte_ask
            kind: dialogue
            target: {text: "Doe jij dan ook de boodschappen?", language_code: nl, direction: ltr, speaker: Lotte}
            introduced_tokens: []
          - content_key: nl.b2.unit07.lesson06.teach.dialogue_omar_decline_concede
            kind: dialogue
            target: {text: "Nee, dat gaat helaas niet. Maar ik ga akkoord, op voorwaarde dat jij afwast.", language_code: nl, direction: ltr, speaker: Omar}
            introduced_tokens: [Nee]
          - content_key: nl.b2.unit07.lesson06.teach.dialogue_lotte_bill
            kind: dialogue
            target: {text: "Afgesproken. En de rekening delen we.", language_code: nl, direction: ltr, speaker: Lotte}
            introduced_tokens: []
          - content_key: nl.b2.unit07.lesson06.teach.dialogue_omar_agree
            kind: dialogue
            target: {text: "Dat is goed.", language_code: nl, direction: ltr, speaker: Omar}
            introduced_tokens: []
          - content_key: nl.b2.unit07.lesson06.teach.grammar_volledig
            kind: grammar_note
            target: {text: "Ik stel voor dat ik kook. De boodschappen doe ik liever niet, maar ik ga akkoord op voorwaarde dat jij afwast.", language_code: nl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: nl.b2.unit07.lesson06.exercise01.comprehend_proposal
            type: dialogue_comprehension
            tested_text: "Ik stel voor dat ik kook"
            media_asset_key: nl.b2.audio.onderhandelen.dialogue.etentje.01
            prompt: {target_blocks: [{text: "What does Omar PROPOSE?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson06.exercise02.comprehend_refusal
            type: dialogue_comprehension
            tested_text: "dat gaat helaas niet"
            media_asset_key: nl.b2.audio.onderhandelen.dialogue.etentje.01
            prompt: {target_blocks: [{text: "What does Omar REFUSE to do?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson06.exercise03.comprehend_condition
            type: dialogue_comprehension
            tested_text: "op voorwaarde dat jij afwast"
            media_asset_key: nl.b2.audio.onderhandelen.dialogue.etentje.01
            prompt: {target_blocks: [{text: "What CONDITIONAL concession does Omar offer in return?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson06.exercise04.order_concede
            type: word_order
            tested_text: "Ik ga akkoord op voorwaarde dat jij afwast"
            prompt: {target_blocks: []}
            word_bank: [Ik, ga, akkoord, op, voorwaarde, dat, jij, afwast]
          - content_key: nl.b2.unit07.lesson06.exercise05.speak_full_move
            type: speak_response
            tested_text: "Ik stel voor dat ik kook. De boodschappen doe ik liever niet, maar ik ga akkoord op voorwaarde dat jij afwast."
            prompt: {target_blocks: [{text: "You and Omar are hosting a dinner. Negotiate your whole part aloud in THREE moves: STATE your terms (ik stel voor dat ik kook), DECLINE one task (the shopping, with liever niet), and OFFER A CONDITIONAL CONCESSION (op voorwaarde dat). Say: I propose that I cook. I'd rather not do the shopping, but I agree on condition that you do the dishes.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson06.exercise06.write_revised_terms
            type: writing_prompt
            tested_text: "Ik doe de boodschappen, mits jij kookt"
            prompt: {target_blocks: [{text: "Write a reply proposing DIFFERENT terms with a condition attached. Offer to do the shopping yourself (ik doe de boodschappen) and attach a condition with mits: I'll do the shopping, provided that you cook.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson06.exercise07.respond_negotiate
            type: dialogue_response
            tested_text: "Ik kook, op voorwaarde dat jij afwast"
            prompt: {target_blocks: [{text: "Wil jij vanavond koken?", language_code: nl, direction: ltr}]}
