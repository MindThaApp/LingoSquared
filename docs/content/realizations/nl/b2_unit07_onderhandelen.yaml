      - content_key: nl.b2.unit07.lesson05.een_afspraak_lezen
        title: "Wat is er afgesproken?"
        spine_outcome_id: universal.b2.negotiation.negotiate_and_resolve_disagreement
        teaching:
          - content_key: nl.b2.unit07.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                Omar: Ik stel voor dat ik kook. Zullen we samen de
                boodschappen doen? Lotte: De boodschappen doe ik liever
                niet, want ik moet werken. Maar ik ga akkoord, op voorwaarde
                dat jij ook afwast. Omar: Afgesproken. En de rekening? Lotte:
                Die delen we samen. Over de boodschappen praten we morgen
                nog.
              language_code: nl
              direction: ltr
            introduced_tokens: [Omar, Lotte, want, werken, ook, en, die, over, praten, morgen]
        exercises:
          - content_key: nl.b2.unit07.lesson05.exercise01.read_agreed
            type: reading_comprehension
