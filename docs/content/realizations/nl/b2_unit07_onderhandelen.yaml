            prompt: {target_blocks: [{text: "What have Lotte and Omar definitely AGREED on?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson05.exercise02.read_open
            type: reading_comprehension
            tested_text: "Over de boodschappen praten we morgen nog"
            prompt: {target_blocks: [{text: "Which point is still OPEN, not yet settled?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson05.exercise03.read_condition
            type: reading_comprehension
            tested_text: "op voorwaarde dat jij ook afwast"
            prompt: {target_blocks: [{text: "On what CONDITION does Lotte agree to the plan?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit07.lesson05.exercise04.read_declined
