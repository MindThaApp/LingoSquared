    language: nl
    text: >-
      Lotte: Wat wil je eten, Omar? Wil je brood of tomatensoep? Omar: Ik wil
      liever tomatensoep. Ik vind tomatensoep lekker. En jij? Lotte: Ik heb
      liever brood. Ik vind tomatensoep niet zo lekker. Omar: Wat wil je na
      het eten doen? Lotte: Ik vind wandelen leuk. Omar: Ik ook. Ik houd van
      wandelen. Zullen we naar het park gaan? Lotte: Goed idee.
    voice_hint: two_young_adults_neutral_friendly
