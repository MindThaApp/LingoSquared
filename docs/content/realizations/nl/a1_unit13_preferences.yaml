course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte and
    Omar continue to use informal jij/je with each other at the taalcafé.
    Distinguish lekker vinden for food and drink, leuk vinden for activities,
    and houden van for a stronger or more general liking. Use liever with
    willen and hebben for ordinary choices between familiar options.

