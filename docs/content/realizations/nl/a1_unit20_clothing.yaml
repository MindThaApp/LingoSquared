    language: nl
    text: >-
      Lotte: Deze jas is mooi! Welke maat heb je? Omar: Ik heb maat
      M. Mag ik hem passen? Lotte: Natuurlijk. Past hij goed? Omar:
      Ja, hij past goed en hij is warm. Lotte: Mooi zo! Wil je hem in
      het zwart of in het blauw? Omar: Ik neem hem in het zwart.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
