generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic clothing/shopping vocabulary is scaffolded from the FSI Dutch
    Basic Course (Foreign Service Institute, US Department of State --
    public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source presents these as isolated
    garment-name substitution drills with no continuous scenario;
    every sentence, exercise, and the Lotte/Omar storyline in this unit
    (buying Omar a winter coat once the forecast turns cold) are
    freshly authored in modern colloquial register, not copied or
    lightly edited from any 1960s-70s source text.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Initial six-lesson Dutch clothing draft (spine outcome:
    universal.a1.clothing.describe_buy_clothing), continuing the
    Lotte/Omar storyline -- shopping for a winter coat. The coat's
    specific facts (size M, black, ninety euros, fits well, warm) are
    cross-checked for consistency between lesson05's reading and
    lesson06's dialogue per AUTHORING_GUIDE §11. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. A fresh-context review ran and found:
    two exercises whose media_asset_key pointed at the wrong audio
    clip (lesson04's "Het past goed" word-order exercise was wired to
    the unrelated "Past deze jas?" clip, and lesson06's "what does
    Lotte say" listening exercise was wired to Omar's "Ik heb maat M"
    line) -- both fixed with dedicated new audio assets matching their
    actual tested content; lesson03's "Heeft u deze ook in blauw?"
    dropped the "het" the unit's own teaching note calls the standard
    pattern -- fixed to "in het blauw" everywhere it appears (teaching
    card, audio text, exercises, overlay). No grammar errors, spine
    drift, jargon leaks, or YAML footguns found otherwise. Re-validated
    (0 errors/0 warnings across the full nl course, including the real
    compile step). Still needs Ramin's native-speaker pass before
    status: reviewed. Audio assets are declared for generation.


    2026-07-06 density pass (Ramin flagged the A1 en-nl course as far
    too short, one word/question per teaching card): merged lesson01's
    4 single-word clothing-item vocabulary cards into 2 (jas/trui,
    broek/schoenen) and lesson03's 2 single-word color vocabulary
    cards (zwart, blauw) into 1 -- phrase, dialogue, grammar_note, and
    reading cards left untouched per the authoring convention that
    only bare-vocabulary cards get merged. Lessons 02, 04, 05, 06
    already had good density and were left alone. Overlay notes mixing
    Dutch inline with English now use the *asterisk* target-language-
    span convention (AUTHORING_GUIDE §15).

    2026-07-07 AUTHORING_GUIDE §17 pass (fill_in_blank/word_order
    true-synonym slots, found live from a real user report): lesson03's
    complete_also_in_blue accepted only "blauw" even though the blank's
    frame ("Heeft u deze ook in ___?") logically also admits the fuller
    "het blauw" form used everywhere else in this unit -- fixed by
    accepting both. Not the exact je/jij bug pattern, but the same
    class of "more than one candidate genuinely completes this frame
    correctly." Swept the rest of this unit's fill_in_blank/word_order
    slots; none had a real equivalent-candidate issue. Re-validated/
    compiled clean.

    2026-07-07 AUTHORING_GUIDE §16 retrofit: lesson02's match_size_words
    (3->6) and lesson03's match_colors (2->6) expanded using
    already-taught vocabulary. Also fixed a real ungradable-pair bug
    found while touching match_size_words: the overlay only listed 2
    of the realization's original 3 pairs (same bug class found
    repeatedly tonight). Lessons 01/04 already had good density (4/4
    pairs) and lesson05 (reading-comprehension) is exempt.
    Re-validated/compiled clean.

    2026-07-07 AUTHORING_GUIDE.md #19 retrofit: every vocabulary card
    (5 total: lesson01's merged jas/trui and broek/schoenen cards,
    lesson02's maat, lesson03's merged zwart/blauw card, lesson05's
    negentig) gained example sentence(s) built from this unit's own
    taught material; schema_version bumped to 1.1 (missing examples
    are now a hard compiler error for this file). Also found and fixed
    a separate pre-existing gap while touching lesson05: the overlay
    had no teaching entry at all for lesson05.teach.negentig (the
    "negentig" vocabulary card) -- added a minimal entry carrying just
    the new example_gloss, since none existed to attach it to; the
    card's missing gloss/title/note is a pre-existing gap out of this
    retrofit's scope, left as-is. Example sentences are Claude-authored
    and pending fresh-context review.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other; the
    unnamed shop assistant in lesson02 is addressed with the formal u,
    the same register distinction introduced in unit01 and reused in
    units 15 and 16.

