target_language: nl
cefr_level: A2
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Opinion-and-reason sentence patterns (stating a view, supporting it
    with a cause, agreeing/disagreeing, presenting a contrasting point)
    are a standard drill type in the FSI Dutch Basic Course (Foreign
    Service Institute, US Department of State -- public domain, no
    attribution required per docs/content/AUTHORING_GUIDE.md §10),
    scaffolding the connector vocabulary (omdat, aan de andere kant)
    used here. The source drills these connectors around generic,
    dated topics with no continuous scenario; the actual discussion
    topic here (a new bike path in the city), the Lotte/Omar dialogue,
    and every example sentence are freshly authored, not copied or
    lightly edited from the source.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Second Dutch A2 unit (spine outcome:
    universal.a2.opinions.give_opinions_with_reasons, newly added to
    universal_spine.yaml this session), continuing the Lotte/Omar
    storyline with a natural, opinion-inviting topic (a new bike path
    in their city). A2-level complexity: subordinate omdat-clauses,
    the discourse connector aan de andere kant (on the other hand),
    and agree/disagree formulas. The specific opinion positions (Omar:
    good idea, safer for cyclists; Lotte: too narrow for pedestrians)
    are stated consistently between lesson02's generic, unattributed
    opinion+reason teaching examples and lesson06's dialogue per
    AUTHORING_GUIDE §11 (lesson05's forum post is a separate, deliberately
    unattributed third opinion, never claimed as Lotte's or Omar's). Every
    multi-clause accepted_answers list authored with
    period/comma/conjunction-joined forms per §12. Every fill_in_blank
    frame retains visible surrounding text per §13. A fresh-context
    review ran and found: lesson06's opening listening exercise was
    wired to an audio clip missing the ", Omar?" vocative its own
    feedback text claimed -- fixed with a new dedicated audio asset;
    lesson06's word-order exercise ("... minder auto's in de straat")
    was mathematically unsolvable -- its word_bank was missing a
    second "de" needed for both "de andere kant" and "in de straat" --
    fixed; lesson05's exercises had a listen_select sequenced after
    matching_pairs, breaking the recognition-before-drag rule --
    reordered; a declared but unused audio asset
    (volgens_mij_goed_idee.01) was wired into a real listening
    exercise instead of left orphaned; "Ik ben het gedeeltelijk eens"
    was missing "met je", asymmetric with its two sibling agree/
    disagree phrases -- fixed to "Ik ben het gedeeltelijk met je
    eens." No grammar errors, spine drift, jargon leaks, misattributed
    opinions, or YAML footguns found otherwise. Re-validated (0
    errors/0 warnings across the full nl course, including the real
    compile step). Additionally retrofitted per new AUTHORING_GUIDE
    §16 (found live 2026-07-06, Ramin's direct feedback):
    matching_pairs exercises expanded from 2-3 pairs to 6-7 pairs in
    lessons 02-04, pooling forward from vocabulary already taught
    earlier in the unit, never padding with untaught words. Lesson01's
    match_opinion_questions stays at 3 pairs (capped by lesson01 being
    the unit's first lesson, with no earlier vocabulary to pool from);
    lesson05's match_forum_points intentionally kept at 3 pairs -- it's
    a structural reading-comprehension check (matching parts of the
    forum post to their function), not a vocabulary drill. Still needs
    Ramin's native-speaker pass before status: reviewed. Audio assets
    are declared for generation.

    2026-07-07 AUTHORING_GUIDE §17 pass (fill_in_blank/word_order
    true-synonym slots, found live from a real user report): lesson03's
    complete_partial_agree blanked "gedeeltelijk" in "Ik ben het ___
    met je eens" but "deels" is a true synonym nothing in the frame
    rules out -- fixed by accepting both. Swept the rest of this
    unit's fill_in_blank/word_order slots (including the omdat-clause
    in lesson02, which word order already disambiguates from want, so
    left as-is); no other real equivalent-candidate issue found.
    Re-validated/compiled clean.

    2026-07-07: AUTHORING_GUIDE.md #19 retrofit -- every vocabulary
    card (fietspad, gevaarlijk, voetgangers) gained an example sentence
    built from this unit's own taught material; schema_version bumped
    to 1.1 (missing examples are now a hard compiler error for this
    file). Example sentences are Claude-authored and pending
    fresh-context review.

    2026-07-10: second fresh-context review pass (Claude, zero access to
    the authoring reasoning above beyond reading this file's own review
    notes, sibling nl-en overlay not consulted). Independently re-verified
    every fix the prior pass claims is actually present in the file as
    written: lesson06 exercise01 is wired to wat_vind_je_omar.01 (with the
    ", Omar?" vocative); lesson06 exercise05's word_bank has two "de"
    tokens (for both "de andere kant" and "in de straat"); lesson02's
    exercises have listen_select (ex02) sequenced before matching_pairs
    (ex03); volgens_mij_goed_idee.01 is wired into exercise04; "Ik ben het
    gedeeltelijk met je eens" has "met je" present; the overlay's
    complete_partial_agree exercise accepts both "gedeeltelijk" and
    "deels". Also independently checked: no same-speaker-distractor
    collision in the lesson06 dialogue exercises, matching_pairs shapes, a
    recursive yaml.safe_load boolean-coercion scan of this file and its
    overlay, and every exercise `type:` against `ExerciseRenderer.tsx`'s
    registered cases. Ran `scripts/compile_content.py validate` against
    the full a2_unit24-28 batch together: 0 errors, 0 warnings. Found no
    additional issues. Native-speaker review is still planned.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other
    throughout this unit -- an opinion exchange between friends stays
    informal, unlike unit24's formal gemeente register.

media_assets:
  - {content_key: nl.a2.audio.meningen.wat_vind_je.01, language: nl, text: "Wat vind je van het nieuwe fietspad?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.meningen.wat_vind_je_omar.01, language: nl, text: "Wat vind je van het nieuwe fietspad, Omar?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.meningen.volgens_mij_gevaarlijk.01, language: nl, text: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.meningen.niet_eens.01, language: nl, text: "Ik ben het niet met je eens.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.meningen.aan_de_andere_kant.01, language: nl, text: "Aan de andere kant is het fietspad wel veiliger voor kinderen.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.meningen.volgens_mij_goed_idee.01, language: nl, text: "Volgens mij is het fietspad een goed idee.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a2.audio.meningen.forumbericht.01
    language: nl
    text: >-
      Ik vind het nieuwe fietspad een slecht idee. Het is te smal en
      er is te weinig ruimte voor voetgangers. Aan de andere kant snap
      ik dat de gemeente meer fietsers wil. Volgens mij moeten ze het
      pad breder maken.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.fietspad_gesprek.01
    language: nl
    text: >-
      Lotte: Wat vind je van het nieuwe fietspad, Omar? Omar: Volgens
      mij is het een goed idee, omdat het veiliger is voor fietsers.
      Lotte: Ik ben het daar niet helemaal mee eens. Het is best smal
      voor voetgangers. Omar: Dat snap ik, maar aan de andere kant
      zijn er nu minder auto's in de straat. Lotte: Dat is waar.
      Misschien wordt het beter als ze het breder maken. Omar: Ja,
      dat denk ik ook.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

units:
  - content_key: nl.a2.unit25.meningen
    title: "Je mening geven"
    section: reading_writing
    spine_outcome_ids: [universal.a2.opinions.give_opinions_with_reasons]
    planned_lesson_count: 6
    lessons:
      - content_key: nl.a2.unit25.lesson01.wat_vind_je_daarvan
        title: "Wat vind je daarvan?"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: nl.a2.unit25.lesson01.teach.fietspad
            kind: vocabulary
            target: {text: "het fietspad", language_code: nl, direction: ltr}
            introduced_tokens: [het, fietspad]
            example: {text: "Het fietspad is nieuw.", language_code: nl, direction: ltr}
          - {content_key: nl.a2.unit25.lesson01.teach.wat_vind_je, kind: phrase, target: {text: "Wat vind je van het nieuwe fietspad?", language_code: nl, direction: ltr}, introduced_tokens: [Wat, vind, je, van, het, nieuwe, fietspad]}
          - {content_key: nl.a2.unit25.lesson01.teach.wat_is_mening, kind: phrase, target: {text: "Wat is jouw mening?", language_code: nl, direction: ltr}, introduced_tokens: [Wat, is, jouw, mening]}
        exercises:
          - {content_key: nl.a2.unit25.lesson01.exercise01.choose_ask_opinion, type: multiple_choice, tested_text: "Wat vind je van het nieuwe fietspad", prompt: {target_blocks: [{text: "What do you think of the new bike path?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson01.exercise02.listen_ask_opinion, type: listen_select, tested_text: "Wat vind je van het nieuwe fietspad", media_asset_key: nl.a2.audio.meningen.wat_vind_je.01, prompt: {target_blocks: []}}
          - {content_key: nl.a2.unit25.lesson01.exercise03.match_opinion_questions, type: matching_pairs, tested_text: "fietspad Wat vind je Wat is jouw mening", prompt: {target_blocks: []}, pairs: [{left: "het fietspad", right: "the bike path"}, {left: "Wat vind je daarvan?", right: "What do you think of it?"}, {left: "Wat is jouw mening?", right: "What is your opinion?"}]}
          - {content_key: nl.a2.unit25.lesson01.exercise04.order_ask_opinion, type: word_order, tested_text: "Wat vind je van het nieuwe fietspad", prompt: {target_blocks: []}, word_bank: [nieuwe, Wat, vind, je, van, het, fietspad]}
          - {content_key: nl.a2.unit25.lesson01.exercise05.complete_ask_mening, type: fill_in_blank, tested_text: "Wat is jouw mening", prompt: {target_blocks: [{text: "Wat is jouw ___?", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson01.exercise06.write_ask_opinion, type: writing_prompt, tested_text: "Wat vind je van het nieuwe fietspad", prompt: {target_blocks: [{text: "Write in Dutch: ask someone what they think of the new bike path.", language_code: en, direction: ltr}]}}

      - content_key: nl.a2.unit25.lesson02.volgens_mij
        title: "Volgens mij..."
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - {content_key: nl.a2.unit25.lesson02.teach.volgens_mij_goed, kind: phrase, target: {text: "Volgens mij is het fietspad een goed idee.", language_code: nl, direction: ltr}, introduced_tokens: [Volgens, mij, is, het, fietspad, een, goed, idee]}
          - content_key: nl.a2.unit25.lesson02.teach.gevaarlijk
            kind: vocabulary
            target: {text: "gevaarlijk", language_code: nl, direction: ltr}
            introduced_tokens: [gevaarlijk]
            example: {text: "Sommige mensen vinden het fietspad gevaarlijk.", language_code: nl, direction: ltr}
          - {content_key: nl.a2.unit25.lesson02.teach.volgens_mij_gevaarlijk, kind: phrase, target: {text: "Volgens mij is het fietspad gevaarlijk, omdat het te smal is.", language_code: nl, direction: ltr}, introduced_tokens: [Volgens, mij, is, het, fietspad, gevaarlijk, omdat, te, smal]}
        exercises:
          - {content_key: nl.a2.unit25.lesson02.exercise01.choose_opinion_with_reason, type: multiple_choice, tested_text: "Volgens mij is het fietspad gevaarlijk omdat het te smal is", prompt: {target_blocks: [{text: "In my opinion, the bike path is dangerous, because it's too narrow.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson02.exercise02.listen_opinion_with_reason, type: listen_select, tested_text: "Volgens mij is het fietspad gevaarlijk omdat het te smal is", media_asset_key: nl.a2.audio.meningen.volgens_mij_gevaarlijk.01, prompt: {target_blocks: []}}
          - {content_key: nl.a2.unit25.lesson02.exercise03.match_opinion_reason, type: matching_pairs, tested_text: "goed idee gevaarlijk smal omdat fietspad mening", prompt: {target_blocks: []}, pairs: [{left: "een goed idee", right: "a good idea"}, {left: gevaarlijk, right: dangerous}, {left: smal, right: narrow}, {left: omdat, right: because}, {left: "het fietspad", right: "the bike path"}, {left: "Wat is jouw mening?", right: "What is your opinion?"}]}
          - {content_key: nl.a2.unit25.lesson02.exercise04.order_opinion_good_idea, type: listen_order, tested_text: "Volgens mij is het fietspad een goed idee", media_asset_key: nl.a2.audio.meningen.volgens_mij_goed_idee.01, prompt: {target_blocks: []}, word_bank: [goed, Volgens, mij, is, het, fietspad, een, idee]}
          - {content_key: nl.a2.unit25.lesson02.exercise05.complete_opinion_reason, type: fill_in_blank, tested_text: "Volgens mij is het fietspad gevaarlijk omdat het te smal is", prompt: {target_blocks: [{text: "Volgens mij is het fietspad gevaarlijk, ___ het te smal is.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson02.exercise06.translate_opinion_reason, type: translation, tested_text: "Volgens mij is het fietspad gevaarlijk omdat het te smal is", prompt: {target_blocks: [{text: "In my opinion, the bike path is dangerous, because it's too narrow.", language_code: en, direction: ltr}]}}

      - content_key: nl.a2.unit25.lesson03.eens_of_niet_eens
        title: "Ik ben het eens / niet eens"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - {content_key: nl.a2.unit25.lesson03.teach.ben_het_eens, kind: phrase, target: {text: "Ik ben het met je eens.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, ben, het, met, je, eens]}
          - {content_key: nl.a2.unit25.lesson03.teach.niet_eens, kind: phrase, target: {text: "Ik ben het niet met je eens.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, ben, het, niet, met, je, eens]}
          - {content_key: nl.a2.unit25.lesson03.teach.gedeeltelijk_eens, kind: phrase, target: {text: "Ik ben het gedeeltelijk met je eens.", language_code: nl, direction: ltr}, introduced_tokens: [Ik, ben, het, gedeeltelijk, met, je, eens]}
        exercises:
          - {content_key: nl.a2.unit25.lesson03.exercise01.choose_disagree, type: multiple_choice, tested_text: "Ik ben het niet met je eens", prompt: {target_blocks: [{text: "I disagree with you.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson03.exercise02.listen_disagree, type: listen_select, tested_text: "Ik ben het niet met je eens", media_asset_key: nl.a2.audio.meningen.niet_eens.01, prompt: {target_blocks: []}}
          - {content_key: nl.a2.unit25.lesson03.exercise03.match_agreement_degrees, type: matching_pairs, tested_text: "eens niet eens gedeeltelijk eens goed idee gevaarlijk smal fietspad", prompt: {target_blocks: []}, pairs: [{left: "Ik ben het met je eens.", right: "I agree with you."}, {left: "Ik ben het niet met je eens.", right: "I disagree with you."}, {left: "Ik ben het gedeeltelijk met je eens.", right: "I partially agree."}, {left: "een goed idee", right: "a good idea"}, {left: gevaarlijk, right: dangerous}, {left: smal, right: narrow}, {left: "het fietspad", right: "the bike path"}]}
          - {content_key: nl.a2.unit25.lesson03.exercise04.order_agree, type: word_order, tested_text: "Ik ben het met je eens", prompt: {target_blocks: []}, word_bank: [met, Ik, ben, het, je, eens]}
          - {content_key: nl.a2.unit25.lesson03.exercise05.complete_partial_agree, type: fill_in_blank, tested_text: "Ik ben het gedeeltelijk met je eens", prompt: {target_blocks: [{text: "Ik ben het ___ met je eens.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson03.exercise06.respond_disagree, type: dialogue_response, tested_text: "Ik ben het niet met je eens", prompt: {target_blocks: [{text: "Volgens mij is het fietspad een goed idee.", language_code: nl, direction: ltr}]}}

      - content_key: nl.a2.unit25.lesson04.aan_de_andere_kant
        title: "Aan de andere kant..."
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - {content_key: nl.a2.unit25.lesson04.teach.veiliger_kinderen, kind: phrase, target: {text: "Aan de andere kant is het fietspad wel veiliger voor kinderen.", language_code: nl, direction: ltr}, introduced_tokens: [Aan, de, andere, kant, is, het, fietspad, wel, veiliger, voor, kinderen]}
          - {content_key: nl.a2.unit25.lesson04.teach.duur_bespaart, kind: phrase, target: {text: "Het is duur, maar aan de andere kant bespaart het tijd.", language_code: nl, direction: ltr}, introduced_tokens: [Het, is, duur, maar, aan, de, andere, kant, bespaart, tijd]}
        exercises:
          - {content_key: nl.a2.unit25.lesson04.exercise01.choose_other_hand, type: multiple_choice, tested_text: "Aan de andere kant is het fietspad wel veiliger voor kinderen", prompt: {target_blocks: [{text: "On the other hand, the bike path is indeed safer for children.", language_code: en, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson04.exercise02.listen_other_hand, type: listen_select, tested_text: "Aan de andere kant is het fietspad wel veiliger voor kinderen", media_asset_key: nl.a2.audio.meningen.aan_de_andere_kant.01, prompt: {target_blocks: []}}
          - {content_key: nl.a2.unit25.lesson04.exercise03.match_contrast_phrases, type: matching_pairs, tested_text: "aan de andere kant veiliger bespaart duur eens gevaarlijk goed idee", prompt: {target_blocks: []}, pairs: [{left: "aan de andere kant", right: "on the other hand"}, {left: veiliger, right: safer}, {left: bespaart, right: saves}, {left: duur, right: expensive}, {left: "Ik ben het niet met je eens.", right: "I disagree with you."}, {left: gevaarlijk, right: dangerous}, {left: "een goed idee", right: "a good idea"}]}
          - {content_key: nl.a2.unit25.lesson04.exercise04.order_saves_time, type: word_order, tested_text: "Het is duur maar aan de andere kant bespaart het tijd", prompt: {target_blocks: []}, word_bank: [duur, Het, is, maar, aan, de, andere, kant, bespaart, het, tijd]}
          - {content_key: nl.a2.unit25.lesson04.exercise05.complete_other_hand, type: fill_in_blank, tested_text: "Aan de andere kant is het fietspad wel veiliger voor kinderen", prompt: {target_blocks: [{text: "Aan de andere kant is het fietspad wel ___ voor kinderen.", language_code: nl, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson04.exercise06.write_other_hand, type: writing_prompt, tested_text: "Het is duur maar aan de andere kant bespaart het tijd", prompt: {target_blocks: [{text: "Write in Dutch: it's expensive, but on the other hand it saves time.", language_code: en, direction: ltr}]}}

      - content_key: nl.a2.unit25.lesson05.forumbericht_lezen
        title: "Een forumbericht lezen"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
          - content_key: nl.a2.unit25.lesson05.teach.voetgangers
            kind: vocabulary
            target: {text: "de voetgangers", language_code: nl, direction: ltr}
            introduced_tokens: [de, voetgangers]
            example: {text: "Het fietspad is smal voor voetgangers.", language_code: nl, direction: ltr}
          - content_key: nl.a2.unit25.lesson05.teach.forumbericht
            kind: reading
            target:
              text: >-
                Ik vind het nieuwe fietspad een slecht idee. Het is te
                smal en er is te weinig ruimte voor voetgangers. Aan
                de andere kant snap ik dat de gemeente meer fietsers
                wil. Volgens mij moeten ze het pad breder maken.
              language_code: nl
              direction: ltr
            introduced_tokens: [Ik, vind, het, nieuwe, fietspad, een, slecht, idee, Het, is, te, smal, en, er, weinig, ruimte, voor, voetgangers, Aan, de, andere, kant, snap, dat, gemeente, meer, fietsers, wil, Volgens, mij, moeten, ze, pad, breder, maken]
        exercises:
          - {content_key: nl.a2.unit25.lesson05.exercise01.read_writer_opinion, type: reading_comprehension, tested_text: "een slecht idee", prompt: {target_blocks: [{text: "What is the writer's overall opinion of the bike path?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson05.exercise02.read_writer_reason, type: reading_comprehension, tested_text: "te smal en te weinig ruimte voor voetgangers", prompt: {target_blocks: [{text: "What reason does the writer give?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson05.exercise03.read_writer_suggestion, type: reading_comprehension, tested_text: "moeten ze het pad breder maken", prompt: {target_blocks: [{text: "What does the writer suggest the gemeente should do?", language_code: en, direction: ltr}]}}
          - {content_key: nl.a2.unit25.lesson05.exercise04.listen_forum, type: listen_select, tested_text: "moeten ze het pad breder maken", media_asset_key: nl.a2.audio.meningen.forumbericht.01, prompt: {target_blocks: []}}
          - {content_key: nl.a2.unit25.lesson05.exercise05.match_forum_points, type: matching_pairs, tested_text: "slecht idee te smal breder maken", prompt: {target_blocks: []}, pairs: [{left: "een slecht idee", right: "the writer's opinion"}, {left: "te smal", right: "the writer's reason"}, {left: "breder maken", right: "the writer's suggestion"}]}
          - {content_key: nl.a2.unit25.lesson05.exercise06.write_forum_summary, type: writing_prompt, tested_text: "Volgens mij is het fietspad een slecht idee omdat het te smal is", prompt: {target_blocks: [{text: "Write in Dutch: say the bike path is a bad idea, in your opinion, because it's too narrow.", language_code: en, direction: ltr}]}}

      - content_key: nl.a2.unit25.lesson06.fietspad_gesprek
        title: "Lotte en Omar praten over het fietspad"
        spine_outcome_id: universal.a2.opinions.give_opinions_with_reasons
        teaching:
