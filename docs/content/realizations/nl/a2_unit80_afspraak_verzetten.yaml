          - {"content_key": "nl.a2.unit80.lesson06.exercise04.comprehend_first_offer", "type": "dialogue_comprehension", "tested_text": "Natuurlijk Komt vrijdag u uit", "media_asset_key": "nl.a2.audio.dialogue.afspraak_verzetten.01", "prompt": {"target_blocks": [{"text": "Which day does the hairdresser offer first?", "language_code": "en", "direction": "ltr"}]}}
