        exercises:
          - {"content_key": "nl.a2.unit80.lesson05.exercise01.read_what_happened", "type": "reading_comprehension", "tested_text": "Uw afspraak is verzet", "prompt": {"target_blocks": [{"text": "What has happened to Omar's appointment?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit80.lesson05.exercise02.read_new_time", "type": "reading_comprehension", "tested_text": "Uw nieuwe afspraak is maandag om tien uur", "prompt": {"target_blocks": [{"text": "When is the new appointment?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit80.lesson05.exercise03.read_what_if", "type": "reading_comprehension", "tested_text": "Komt dit u niet uit Bel ons dan een dag van tevoren", "prompt": {"target_blocks": [{"text": "What should Omar do if the new time does not suit him?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit80.lesson05.exercise04.listen_new", "type": "listen_select", "tested_text": "Uw nieuwe afspraak is maandag om tien uur", "media_asset_key": "nl.a2.audio.afspraak_verzetten.bericht_nieuwe.01", "prompt": {"target_blocks": []}}
          - {"content_key": "nl.a2.unit80.lesson05.exercise05.match_message", "type": "matching_pairs", "tested_text": "verzet nieuwe afspraak komt uit tevoren maandag", "prompt": {"target_blocks": []}, "pairs": [{"left": "verzet", "right": "moved"}, {"left": "uw nieuwe afspraak", "right": "your new appointment"}, {"left": "Komt dit u niet uit?", "right": "Does this not suit you?"}, {"left": "een dag van tevoren", "right": "a day in advance"}, {"left": "Tot maandag!", "right": "See you Monday!"}]}
