        title: "Omar belt de kapper"
        spine_outcome_id: universal.a2.plans.rearrange_an_appointment
        teaching:
          - {"content_key": "nl.a2.unit80.lesson06.teach.kapper_opening", "kind": "dialogue", "target": {"text": "Kapsalon Jansen, goedemiddag.", "language_code": "nl", "direction": "ltr", "speaker": "Kapper"}, "introduced_tokens": ["Kapsalon", "Jansen", "goedemiddag"]}
          - {"content_key": "nl.a2.unit80.lesson06.teach.omar_vraagt", "kind": "dialogue", "target": {"text": "Goedemiddag, u spreekt met Omar. Ik heb donderdag een afspraak, maar ik kan helaas niet komen. Kan ik de afspraak verzetten?", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Goedemiddag", "u", "spreekt", "met", "Omar", "Ik", "heb", "donderdag", "een", "afspraak", "maar", "ik", "kan", "helaas", "niet", "komen", "Kan", "de", "verzetten"]}
          - {"content_key": "nl.a2.unit80.lesson06.teach.kapper_vrijdag", "kind": "dialogue", "target": {"text": "Natuurlijk. Komt vrijdag u uit?", "language_code": "nl", "direction": "ltr", "speaker": "Kapper"}, "introduced_tokens": ["Natuurlijk", "Komt", "vrijdag", "u", "uit"]}
          - {"content_key": "nl.a2.unit80.lesson06.teach.omar_maandag", "kind": "dialogue", "target": {"text": "Helaas niet, want ik moet werken. Kan het ook maandag?", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Helaas", "niet", "want", "ik", "moet", "werken", "Kan", "het", "ook", "maandag"]}
          - {"content_key": "nl.a2.unit80.lesson06.teach.kapper_tien", "kind": "dialogue", "target": {"text": "Maandag om tien uur is goed.", "language_code": "nl", "direction": "ltr", "speaker": "Kapper"}, "introduced_tokens": ["Maandag", "om", "tien", "uur", "is", "goed"]}
          - {"content_key": "nl.a2.unit80.lesson06.teach.omar_dank", "kind": "dialogue", "target": {"text": "Dat komt goed uit. Dank u wel en sorry voor het ongemak.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Dat", "komt", "goed", "uit", "Dank", "u", "wel", "en", "sorry", "voor", "het", "ongemak"]}
          - {"content_key": "nl.a2.unit80.lesson06.teach.kapper_einde", "kind": "dialogue", "target": {"text": "Geen probleem. Tot maandag!", "language_code": "nl", "direction": "ltr", "speaker": "Kapper"}, "introduced_tokens": ["Geen", "probleem", "Tot", "maandag"]}
        exercises:
