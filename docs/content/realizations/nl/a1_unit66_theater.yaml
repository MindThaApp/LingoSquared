course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina, Omar,
    and Lotte are established taalcafe friends and use informal jij/je with
    each other throughout. This unit's theatre staff character ("de
    medewerker") is addressed formally with "u" by Omar and Lotte, matching
    unit50-58/60/62-65's established neutral-polite staff-register convention
    for paid venues.

