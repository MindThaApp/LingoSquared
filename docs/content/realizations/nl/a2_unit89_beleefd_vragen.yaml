      - content_key: nl.a2.unit89.lesson05.graag_of_nee_hoor
        title: "Graag of nee hoor"
        spine_outcome_id: universal.a2.requests.make_polite_requests_and_offers
        teaching:
          - {"content_key": "nl.a2.unit89.lesson05.teach.woorden", "kind": "vocabulary", "target": {"text": "de deur, opendoen, zwaar, veel", "language_code": "nl", "direction": "ltr"}, "example": [{"text": "De tas is zwaar.", "language_code": "nl", "direction": "ltr"}, {"text": "Ik heb veel boodschappen.", "language_code": "nl", "direction": "ltr"}, {"text": "Zal ik de deur opendoen?", "language_code": "nl", "direction": "ltr"}], "introduced_tokens": ["de", "deur", "opendoen", "zwaar", "veel", "De", "tas", "is", "Ik", "heb", "boodschappen", "Zal", "ik"]}
          - {"content_key": "nl.a2.unit89.lesson05.teach.gn_accept", "kind": "grammar_note", "target": {"text": "Graag, dank je. Graag, dank u.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Graag", "dank", "je", "u"]}
          - {"content_key": "nl.a2.unit89.lesson05.teach.gn_decline", "kind": "grammar_note", "target": {"text": "Nee hoor, het lukt wel.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Nee", "hoor", "het", "lukt", "wel"]}
          - {"content_key": "nl.a2.unit89.lesson05.teach.gn_verzoek", "kind": "grammar_note", "target": {"text": "Natuurlijk. Sorry, dat lukt niet.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Natuurlijk", "Sorry", "dat", "lukt", "niet"]}
          - {"content_key": "nl.a2.unit89.lesson05.teach.reading", "kind": "reading", "target": {"text": "Noor komt uit de supermarkt. Ze heeft veel boodschappen en een zware tas. De buurman ziet haar en vraagt: Zal ik de tas dragen? Noor zegt: Graag, dank u. Dan vraagt de buurvrouw: Zal ik de deur opendoen? Noor zegt: Nee hoor, het lukt wel.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Noor", "komt", "uit", "de", "supermarkt", "Ze", "heeft", "veel", "boodschappen", "en", "een", "zware", "tas", "De", "buurman", "ziet", "haar", "vraagt", "Zal", "ik", "dragen", "zegt", "Graag", "dank", "u", "Dan", "buurvrouw", "deur", "opendoen", "Nee", "hoor", "het", "lukt", "wel"]}
        exercises:
          - {"content_key": "nl.a2.unit89.lesson05.exercise01.lees_tas", "type": "reading_comprehension", "tested_text": "Zal ik de tas dragen", "prompt": {"target_blocks": [{"text": "What does the neighbour offer first?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit89.lesson05.exercise02.lees_deur", "type": "reading_comprehension", "tested_text": "Nee hoor het lukt wel", "prompt": {"target_blocks": [{"text": "How does Noor answer the offer to open the door?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit89.lesson05.exercise03.match_functie", "type": "matching_pairs", "tested_text": "Graag dank u Nee hoor het lukt wel Sorry dat lukt niet Natuurlijk Zal ik de tas dragen Zou u even kunnen wachten", "prompt": {"target_blocks": []}, "pairs": [{"left": "Graag, dank u", "right": "accepts an offer"}, {"left": "Nee hoor, het lukt wel", "right": "politely refuses an offer"}, {"left": "Sorry, dat lukt niet", "right": "says no to a request"}, {"left": "Natuurlijk", "right": "says yes to a request"}, {"left": "Zal ik de tas dragen?", "right": "offers help"}, {"left": "Zou u even kunnen wachten?", "right": "makes a request"}]}
          - {"content_key": "nl.a2.unit89.lesson05.exercise04.orde_voor_u", "type": "word_order", "tested_text": "Zal ik de tas voor u dragen", "prompt": {"target_blocks": []}, "word_bank": ["zal", "ik", "de", "tas", "voor", "u", "dragen"]}
          - {"content_key": "nl.a2.unit89.lesson05.exercise05.vertaal_graag", "type": "translation", "tested_text": "Graag dank u", "prompt": {"target_blocks": [{"text": "Yes please, thank you. Answer an offer, speaking formally.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit89.lesson05.exercise06.dictee_deur", "type": "dictation", "tested_text": "Zal ik de deur opendoen?", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.beleefd_vragen.deur_opendoen.01"}
          - {"content_key": "nl.a2.unit89.lesson05.exercise07.dictee_nee", "type": "dictation", "tested_text": "Nee hoor, het lukt wel.", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.beleefd_vragen.nee_hoor.01"}

      - content_key: nl.a2.unit89.lesson06.koffie_bij_lotte
        title: "Koffie bij Lotte"
        spine_outcome_id: universal.a2.requests.make_polite_requests_and_offers
        teaching:
          - {"content_key": "nl.a2.unit89.lesson06.teach.welkom", "kind": "dialogue", "target": {"text": "Hoi Omar, kom even binnen.", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Hoi", "Omar", "kom", "even", "binnen"]}
          - {"content_key": "nl.a2.unit89.lesson06.teach.boodschappen", "kind": "dialogue", "target": {"text": "Dank je. Ik heb veel boodschappen.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Dank", "je", "Ik", "heb", "veel", "boodschappen"]}
          - {"content_key": "nl.a2.unit89.lesson06.teach.tas", "kind": "dialogue", "target": {"text": "Zal ik de tas dragen?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Zal", "ik", "de", "tas", "dragen"]}
          - {"content_key": "nl.a2.unit89.lesson06.teach.koffie", "kind": "dialogue", "target": {"text": "Nee hoor, het lukt wel. Zou je koffie kunnen zetten?", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Nee", "hoor", "het", "lukt", "wel", "Zou", "je", "koffie", "kunnen", "zetten"]}
          - {"content_key": "nl.a2.unit89.lesson06.teach.brood", "kind": "dialogue", "target": {"text": "Natuurlijk. Ga even zitten. Zal ik ook het brood snijden?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Natuurlijk", "Ga", "even", "zitten", "Zal", "ik", "ook", "het", "brood", "snijden"]}
          - {"content_key": "nl.a2.unit89.lesson06.teach.graag", "kind": "dialogue", "target": {"text": "Graag, dank je.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Graag", "dank", "je"]}
        exercises:
          - {"content_key": "nl.a2.unit89.lesson06.exercise01.luister_welkom", "type": "listen_select", "tested_text": "Hoi Omar kom even binnen", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.beleefd_vragen.dialoog.01"}
          - {"content_key": "nl.a2.unit89.lesson06.exercise02.begrijp_verzoek", "type": "dialogue_comprehension", "tested_text": "Zou je koffie kunnen zetten", "prompt": {"target_blocks": [{"text": "What does Omar ask Lotte to do?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "nl.a2.audio.beleefd_vragen.dialoog.01"}
          - {"content_key": "nl.a2.unit89.lesson06.exercise03.match_dialoog", "type": "matching_pairs", "tested_text": "Zal ik de tas dragen Nee hoor het lukt wel Zou je koffie kunnen zetten Graag dank je Kom even binnen Ga even zitten", "prompt": {"target_blocks": []}, "pairs": [{"left": "Zal ik de tas dragen?", "right": "Lotte offers help"}, {"left": "Nee hoor, het lukt wel", "right": "Omar declines an offer"}, {"left": "Zou je koffie kunnen zetten?", "right": "Omar makes a request"}, {"left": "Graag, dank je", "right": "Omar accepts an offer"}, {"left": "Kom even binnen", "right": "Lotte invites Omar in"}, {"left": "Ga even zitten", "right": "Lotte tells Omar to sit down"}]}
          - {"content_key": "nl.a2.unit89.lesson06.exercise04.orde_koffie", "type": "word_order", "tested_text": "Zou je even koffie kunnen zetten", "prompt": {"target_blocks": []}, "word_bank": ["zou", "je", "even", "koffie", "kunnen", "zetten"]}
          - {"content_key": "nl.a2.unit89.lesson06.exercise05.antwoord_tas", "type": "dialogue_response", "tested_text": "Nee hoor het lukt wel", "prompt": {"target_blocks": [{"text": "Zal ik de tas dragen?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit89.lesson06.exercise06.vertaal_wachten", "type": "translation", "tested_text": "Zou u even kunnen wachten", "prompt": {"target_blocks": [{"text": "Could you wait for a moment? You are speaking formally.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit89.lesson06.exercise07.schrijf_drie", "type": "writing_prompt", "tested_text": "Kom even binnen Zal ik de tas dragen Graag dank je", "prompt": {"target_blocks": [{"text": "Write exactly three Dutch sentences, speaking to a friend: (1) invite her in for a moment with kom and even; (2) offer to carry the bag with zal ik and dragen; (3) accept an offer with graag and dank je.", "language_code": "en", "direction": "ltr"}]}}

