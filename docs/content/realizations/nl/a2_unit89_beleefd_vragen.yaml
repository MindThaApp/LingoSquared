          - {"content_key": "nl.a2.unit89.lesson04.exercise06.vertaal_binnen", "type": "translation", "tested_text": "Kom even binnen", "prompt": {"target_blocks": [{"text": "Come in for a moment. You are speaking to a friend.", "language_code": "en", "direction": "ltr"}]}}
