    Authored specifically to close a real outcome-coverage gap: fa/ro/hi/
    prs's B1 courses all cover universal.b1.necessity.express_obligation_
    with_subjunctive as their unit01 (alongside 5 other first-wave B1
    outcomes: abilities, hypotheticals, debate, workplace, narrative-
    recount), while nl's existing 5 B1 units instead cover 5 outcomes from
    a later, second wave added to the spine (hypotheticals-with-
    conditional, opinions/debate-with-nuance, workplace-communicate-
    professionally, narrative-combine-with-relative-clauses, communication/
    report-what-someone-said) that do not overlap with the first-wave set
    at all by spine_outcome_id. This unit deliberately targets the exact
    first-wave necessity outcome fa/ro/hi/prs's unit01 uses, to establish
    real 1:1 outcome-ID parity for at least this one outcome. See this
    file's review notes and the authoring session's final report for the
    full gap analysis -- true full parity with fa/ro/hi/prs's 6-outcome
    first-wave set would need 5 more nl units (abilities, hypotheticals-
    basic, debate-basic, workplace-describe-responsibilities, narrative-
    recount), which this single-unit dispatch did not attempt.
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    nl's sixth B1 unit. Targets universal.b1.necessity.express_obligation_
    with_subjunctive. The spine's own can_do text describes this outcome
    (originally modeled on Persian/Romanian/Hindi, which all have a single
    invariant modal particle -- بايد/trebuie/चाहिए -- plus a subordinate
    verb that carries all the conjugation) in terms that don't map onto
    Dutch literally: Dutch has no invariant modal particle, *moeten* fully
    conjugates (moet/moeten/moest/moesten) like any other verb. Dutch's
    closest structural equivalent, same "closest equivalent" framing
    b1_unit01 already used for *zou*/subjunctive: (1) *moeten* + bare
    infinitive for present necessity (lesson01); (2) *had* + [object/
    adverbials] + *moeten* + bare infinitive -- NOT *had gemoeten* -- for
    past regret about an unfulfilled obligation, a genuine quirk of Dutch
    called the IPP effect (Infinitivus Pro Participio: a modal verb takes
    infinitive, not past-participle, form when itself governing another
    infinitive in a perfect-tense construction) (lesson02); (3) negating
    the modal for prohibition is where Dutch's real complexity for this
    outcome actually lives, and it's a genuine verb SWAP, not just adding
    *niet* to *moeten*: *hoeven (niet/geen)* + *te* + infinitive means
    "don't need to" (negated necessity, lesson03), while *mogen niet* +
    bare infinitive means "not allowed to / must not" (true prohibition,
    lesson04) -- confusing these two is a classic, well-documented learner
    error this unit teaches explicitly as a contrast (lesson04's grammar
    note). Continues Lotte and Omar's established storyline (informal
    jij/je register, per b1_unit01/02/03/05's precedent) -- Omar is
    visiting Lotte, giving a natural real-life frame for obligations
    (cleaning before a guest arrives, a still-unmet earlier obligation,
    something the guest is handling so she doesn't need to, and a house
    rule she needs to tell him about). No sibling-direction file (nl-en)
    was consulted -- only nl's own prior realization content (per
    CLAUDE.md's footgun: a past nl unit's own precedent, not a sibling-
    direction overlay, is fair game). All vocabulary, including basic
    function words, is introduced self-contained within this file, same
    convention b1_unit01-05 all used. word_order/translation exercises
    include a second natural word-order variant wherever Dutch genuinely
    allows adverbial-placement flexibility (e.g. object vs. time-adverb
    ordering), per this unit's authoring brief. Fresh-context review
    2026-07-11 (AUTHORING_GUIDE.md §20) complete: Dutch verified
    grammatical and natural -- moeten present necessity, the had ...
    moeten IPP double infinitive (moeten, not gemoeten), and the
    hoeven-niet-(te) vs mogen-niet-(bare-infinitive) prohibition
    contrast all correct; separable "mee te nemen" split correct;
    V2/subclause-SOV correct throughout; word_order accepted_answers
    are correctly comma-free (no tile-vs-answer grading mismatch); no
    listen_select distractor collisions; Omar/Lotte continuity
    consistent (Omar the cook brings the food himself); mechanical
    sweeps clean (spine ID, booleans, snake_case, "reviewed" leaks).
    No objective bugs found.

    Language review 2026-10-20 (session 9, en-nl): 0 fixes in the
    realization; (13 fixes in the en-nl overlay). NATIVE FLAGS: none.

