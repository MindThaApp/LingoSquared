schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A1
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    Basic occupation/workplace vocabulary is scaffolded from the
    employment module of the FSI Dutch Basic Course (Foreign Service
    Institute, US Department of State -- public domain, no attribution
    required per docs/content/AUTHORING_GUIDE.md §10). The source
    presents these as isolated occupation-name substitution drills with
    dated gendered job-title conventions and no continuous scenario;
    every sentence, exercise, and the Lotte/Omar storyline in this unit
    are freshly authored in modern colloquial register (contemporary
    gender-neutral job titles such as verpleegkundige), not copied or
    lightly edited from any 1960s-70s source text.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Initial six-lesson Dutch work draft (spine outcome:
    universal.a1.work.describe_job), continuing the Lotte/Omar
    storyline now that Omar has recovered from unit16. Established
    facts (Omar = kok/restaurant; Lotte = verpleegkundige/ziekenhuis,
    starts 07:00, works Monday-Friday) are cross-checked for mutual
    consistency across lessons 1, 2, 4, 5, and 6 per AUTHORING_GUIDE
    §11 -- lesson03's generic schedule examples deliberately stay
    unnamed/"Ik"-only so they never conflict with the specific
    Lotte/Omar facts established elsewhere. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. Pending fresh-context review and Ramin's
    native-speaker review. Audio assets are declared for generation.

    2026-07-06 density pass: merged lesson01's beroep/kok vocabulary
    cards into one combined card to cut down excessive one-word
    "Next"-click cards per Ramin's density feedback. Lessons 02-06
    have no other consecutive-vocabulary runs (each vocabulary card
    is otherwise already paired with a usage phrase, or the lesson is
    a single reading/dialogue), so no further merges applied.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other. Job
    titles use modern gender-neutral forms (verpleegkundige rather than
    the older verpleegster) where that is now the standard usage.

media_assets:
  - {content_key: nl.a1.audio.work.werk_als_kok.01, language: nl, text: "Ik werk als kok.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.work.werk_als_verpleegkundige.01, language: nl, text: "Ik werk als verpleegkundige.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
