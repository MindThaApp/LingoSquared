  - {content_key: nl.a1.audio.work.werk_in_ziekenhuis.01, language: nl, text: "Ik werk in het ziekenhuis.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.work.begin_negen_uur.01, language: nl, text: "Ik begin om negen uur.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.work.maandag_tot_vrijdag.01, language: nl, text: "Ik werk van maandag tot vrijdag.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.work.lotte_werkt.01, language: nl, text: "Lotte werkt als verpleegkundige.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a1.audio.work.begin_zeven_maandag_vrijdag.01, language: nl, text: "Ik begin om zeven uur en ik werk van maandag tot vrijdag.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.work.profiel_lezen.01
    language: nl
    text: >-
      Lotte werkt als verpleegkundige in het ziekenhuis. Ze begint om
      zeven uur en werkt van maandag tot vrijdag. Omar werkt als kok
      in een restaurant. Hij begint om elf uur en heeft pauze om vier
      uur.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - {content_key: nl.a1.audio.work.wat_doe_je_voor_werk.01, language: nl, text: "Wat doe jij eigenlijk voor werk?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a1.audio.dialogue.werk_gesprek.01
    language: nl
    text: >-
      Lotte: Hoi Omar! Ik ben benieuwd, wat doe jij eigenlijk voor
      werk? Omar: Ik werk als kok in een restaurant. En jij? Lotte:
      Ik werk als verpleegkundige in het ziekenhuis. Omar: Wat voor
      uren maak je? Lotte: Ik begin om zeven uur en ik werk van
      maandag tot vrijdag. Omar: Dat is vroeg! Ik begin later, om
      elf uur. Lotte: Elke baan heeft zijn eigen ritme, denk ik.
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

