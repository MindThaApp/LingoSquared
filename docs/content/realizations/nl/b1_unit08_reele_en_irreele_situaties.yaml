schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: B1
status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation. Checked firecrawl search/scrape for an
    intermediate-level public-domain Dutch course first (per
    AUTHORING_GUIDE.md §10) -- firecrawl is still returning HTTP 402
    (account credits exhausted, a standing outage as of this dispatch),
    and no genuine FSI/Peace-Corps-equivalent intermediate Dutch source is
    known to exist. Built from general Dutch grammar knowledge, not
    adapted from a source. nl's eighth B1 unit, the second of five
    closing the outcome-coverage gap documented in b1_unit06/07's own
    provenance notes. Targets universal.b1.hypotheticals.express_
    hypothetical_conditions, the third of six first-wave outcomes shared
    with fa/ro/hi/prs.
review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  notes: >-
    nl's eighth B1 unit. Targets universal.b1.hypotheticals.express_
    hypothetical_conditions -- a real/possible future condition contrasted
    with an unreal/counterfactual present-or-past condition, both using
    an explicit *als* (if) conditional clause plus a matching result
    clause. This is a DIFFERENT outcome from nl's own existing
    b1_unit01 (universal.b1.hypotheticals.express_hypothetical_
    conditions_with_conditional), which taught *zou* + infinitive as a
    standalone hypothetical statement construction (*"Stel je voor
    dat..."*) with no explicit *als*-clause pairing -- this unit is
    specifically about the biclausal *als ... , ...* structure and the
    mood/tense matching between the two clauses, so overlap with
    b1_unit01 is minimal by design; every example sentence here uses an
    explicit *als*-clause. Three forms taught, in order of increasing
    complexity: (1) real/possible future condition, present tense in
    both clauses (lesson01); (2) unreal/counterfactual present, *als* +
    simple past (imperfect) paired with *zou* + infinitive (lesson02);
    (3) unreal/counterfactual past, *als* + pluperfect paired with a
    pluperfect result clause -- the natural, common spoken form, not the
    more formal *zou ... hebben/zijn* + participle alternative, though
    the pluperfect-result clause and both auxiliary-participle orders
    (*had geweten* / *geweten had*) are accepted as genuine word-order
    variants per this guide's own §12 (lesson03). Continues Lotte and
    Omar's established informal jij/je register, and reuses Sara
    (established in b1_unit05 as a mutual friend) as the host of a past
    party Lotte missed, consistent with her established role. No
    sibling-direction file (nl-en) was consulted. All vocabulary,
    including basic function words, is introduced self-contained within
    this file. Fresh-context review 2026-07-11 (AUTHORING_GUIDE.md
    §20): all three conditional types grammatically correct -- real
    (als + present, V2-inverted present result), unreal-present (als +
    imperfect *had*, *zou* + infinitive result), and unreal-past
    (double pluperfect: als ... *had geweten* / *was ... gegaan*, both
    had-geweten and geweten-had subclause orders correctly accepted).
    word_order accepted_answers correctly comma-free (tiles produce no
    comma; translation answers keep the comma). No listen_select
    distractor collisions; Sara consistent with b1_unit05. TWO
    native-judgment flags for ramin_native_pass, neither a grading bug:
    (1) lesson05 reading states "Nu heeft Lotte meer tijd." immediately
    before the counterfactual "Als ze meer tijd had, zou ze Nederlands
    studeren." -- a real logical tension (the counterfactual presupposes
    she does NOT have the time just asserted); a rephrase is authoring,
    not a review fix. (2) lesson01 exercise01 recognize_als offers
    "when" as a distractor against correct "if" -- "when" is a genuine
    secondary sense of *als*, so the bare-word item is arguably
    ambiguous; the taught/dominant sense is "if". No objective grading
    bugs found.

    Language review 2026-10-20 (session 9, en-nl): 1 fix in the realization --
    lesson05 reading and exercise06: Nu heeft Lotte meer tijd changed to Nu
    heeft Lotte geen tijd (tested_text, prompt, reading text) to remove the
    contradiction with the following counterfactual; (4 fixes in the en-nl
    overlay). NATIVE FLAGS: none.

