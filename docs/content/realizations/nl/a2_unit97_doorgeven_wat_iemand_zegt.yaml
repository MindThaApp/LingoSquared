          - {"content_key": "nl.a2.unit97.lesson04.ex07.write_bericht", "type": "writing_prompt", "tested_text": "Er is een bericht van Omar Hij zegt dat hij morgen werkt", "prompt": {"target_blocks": [{"text": "Write exactly two Dutch sentences: (1) There is a message from Omar. (2) He says that he is working tomorrow, using zegt dat.", "language_code": "en", "direction": "ltr"}]}}
      - content_key: nl.a2.unit97.lesson05.een_briefje_lezen
        title: "Een briefje lezen"
        spine_outcome_id: universal.a2.communication.pass_on_a_simple_message
        teaching:
          - {"content_key": "nl.a2.unit97.lesson05.teach.reading", "kind": "reading", "target": {"text": "Hoi Lotte, er is een bericht van Noor. Ze zegt dat ze vanavond niet kan komen, want ze moet werken. Ze vraagt of jij morgen tijd hebt. Een collega laat weten dat de vergadering om negen uur is.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["hoi", "Lotte", "er", "is", "een", "bericht", "van", "Noor", "ze", "zegt", "dat", "vanavond", "niet", "kan", "komen", "want", "moet", "werken", "vraagt", "of", "jij", "morgen", "tijd", "hebt", "collega", "laat", "weten", "de", "vergadering", "om", "negen", "uur"]}
        exercises:
          - {"content_key": "nl.a2.unit97.lesson05.ex01.read_why", "type": "reading_comprehension", "tested_text": "Ze moet werken", "prompt": {"target_blocks": [{"text": "Why can Noor not come this evening?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit97.lesson05.ex02.read_ask", "type": "reading_comprehension", "tested_text": "Ze vraagt of jij morgen tijd hebt", "prompt": {"target_blocks": [{"text": "What does Noor ask?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit97.lesson05.ex03.match_reading", "type": "matching_pairs", "tested_text": "ze moet werken niet kan komen of jij morgen tijd hebt om negen uur een collega want", "prompt": {"target_blocks": []}, "pairs": [{"left": "ze moet werken", "right": "she has to work"}, {"left": "niet kan komen", "right": "cannot come"}, {"left": "of jij morgen tijd hebt", "right": "whether you have time tomorrow"}, {"left": "om negen uur", "right": "at nine o'clock"}, {"left": "een collega", "right": "a colleague"}, {"left": "want", "right": "because"}]}
          - {"content_key": "nl.a2.unit97.lesson05.ex04.order_moet", "type": "word_order", "tested_text": "Ze zegt dat ze moet werken", "prompt": {"target_blocks": []}, "word_bank": ["Ze", "zegt", "dat", "ze", "moet", "werken"]}
          - {"content_key": "nl.a2.unit97.lesson05.ex05.translate_noor", "type": "translation", "tested_text": "Noor zegt dat ze vanavond niet kan komen", "prompt": {"target_blocks": [{"text": "Noor says that she cannot come this evening.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit97.lesson05.ex06.dictation_vergadering", "type": "dictation", "tested_text": "Een collega laat weten dat de vergadering om negen uur is.", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.doorgeven_wat_iemand_zegt.vergadering.01"}
          - {"content_key": "nl.a2.unit97.lesson05.ex07.dictation_tijd", "type": "dictation", "tested_text": "Ze vraagt of jij morgen tijd hebt.", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.doorgeven_wat_iemand_zegt.tijd_morgen.01"}
      - content_key: nl.a2.unit97.lesson06.de_collega_belt
        title: "De collega belt"
        spine_outcome_id: universal.a2.communication.pass_on_a_simple_message
        teaching:
          - {"content_key": "nl.a2.unit97.lesson06.teach.d01", "kind": "dialogue", "target": {"text": "Hoi Lotte, de collega belt.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["hoi", "Lotte", "de", "collega", "belt"]}
          - {"content_key": "nl.a2.unit97.lesson06.teach.d02", "kind": "dialogue", "target": {"text": "O ja? Wat zegt hij?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["o", "ja", "wat", "zegt", "hij"]}
          - {"content_key": "nl.a2.unit97.lesson06.teach.d03", "kind": "dialogue", "target": {"text": "Hij zegt dat de vergadering morgen om negen uur is.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["hij", "zegt", "dat", "de", "vergadering", "morgen", "om", "negen", "uur", "is"]}
          - {"content_key": "nl.a2.unit97.lesson06.teach.d04", "kind": "dialogue", "target": {"text": "Vraagt hij ook of ik tijd heb?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["vraagt", "hij", "ook", "of", "ik", "tijd", "heb"]}
          - {"content_key": "nl.a2.unit97.lesson06.teach.d05", "kind": "dialogue", "target": {"text": "Ja, hij vraagt of je morgen tijd hebt.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["ja", "hij", "vraagt", "of", "je", "morgen", "tijd", "hebt"]}
          - {"content_key": "nl.a2.unit97.lesson06.teach.d06", "kind": "dialogue", "target": {"text": "Goed, ik heb tijd. Ik laat de collega weten dat ik kom.", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["goed", "ik", "heb", "tijd", "laat", "de", "collega", "weten", "dat", "kom"]}
        exercises:
          - {"content_key": "nl.a2.unit97.lesson06.ex01.listen_opening", "type": "listen_select", "tested_text": "Hoi Lotte de collega belt", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.dialogue.doorgeven_wat_iemand_zegt.01"}
          - {"content_key": "nl.a2.unit97.lesson06.ex02.comprehend_meeting", "type": "dialogue_comprehension", "tested_text": "Hij zegt dat de vergadering morgen om negen uur is", "prompt": {"target_blocks": [{"text": "What does the colleague say?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "nl.a2.audio.dialogue.doorgeven_wat_iemand_zegt.01"}
          - {"content_key": "nl.a2.unit97.lesson06.ex03.match_dialogue", "type": "matching_pairs", "tested_text": "Wat zegt hij de vergadering is morgen om negen uur of je morgen tijd hebt Ik heb tijd Ik laat de collega weten dat ik kom", "prompt": {"target_blocks": []}, "pairs": [{"left": "Wat zegt hij?", "right": "Lotte asks what the colleague says"}, {"left": "hij zegt dat de vergadering morgen om negen uur is", "right": "the colleague says the meeting is tomorrow at nine"}, {"left": "hij vraagt of je morgen tijd hebt", "right": "the colleague asks whether Lotte has time tomorrow"}, {"left": "Hoi Lotte", "right": "Omar greets Lotte"}, {"left": "Ik heb tijd.", "right": "Lotte says she has time"}, {"left": "Ik laat de collega weten dat ik kom", "right": "Lotte will let the colleague know she is coming"}]}
          - {"content_key": "nl.a2.unit97.lesson06.ex04.order_vergadering", "type": "word_order", "tested_text": "Hij zegt dat de vergadering morgen om negen uur is", "prompt": {"target_blocks": []}, "word_bank": ["Hij", "zegt", "dat", "de", "vergadering", "morgen", "om", "negen", "uur", "is"]}
          - {"content_key": "nl.a2.unit97.lesson06.ex05.respond_wat_zegt", "type": "dialogue_response", "tested_text": "Hij zegt dat de vergadering morgen om negen uur is", "prompt": {"target_blocks": [{"text": "Wat zegt hij?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit97.lesson06.ex06.translate_ik_tijd", "type": "translation", "tested_text": "Hij vraagt of ik morgen tijd heb", "prompt": {"target_blocks": [{"text": "He asks whether I have time tomorrow.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit97.lesson06.ex07.write_twee", "type": "writing_prompt", "tested_text": "Omar zegt dat hij vandaag werkt Hij vraagt of Noor tijd heeft", "prompt": {"target_blocks": [{"text": "Omar zegt: 'Ik werk vandaag.'", "language_code": "nl", "direction": "ltr"}, {"text": "Omar vraagt: 'Heeft Noor tijd?'", "language_code": "nl", "direction": "ltr"}, {"text": "Write exactly two Dutch sentences to pass this on: (1) start with Omar zegt dat; (2) start with Hij vraagt of.", "language_code": "en", "direction": "ltr"}]}}
