generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    `firecrawl --status` checked first, still at 0/1000 credits this
    cycle. The FSI Dutch Basic Course's shopping material (already the
    base for nl a1_unit07_shopping) covers buying and asking prices
    only, not returning a faulty item or requesting a refund -- no
    plausible additional passage to adapt for this specific A2-level
    extension. This unit is `ai_generated` from established modern
    Dutch conventions: het kassabon, het bonnetje, terugbrengen,
    ruilen, het geld terugkrijgen, and het garantiebewijs are all
    standard, current retail-Dutch terms any Dutch shopper would
    recognize, not invented or calqued from English.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  reviewer_notes: >-
    Fresh-context review 2026-07-11 (AUTHORING_GUIDE §20). All mechanical
    sweeps clean (boolean-coercion type-walk, accepted_answers value-key
    shape, title<200, spine outcome universal.a2.shopping.make_a_complaint
    exists verbatim, no snake_case/jargon in option values). Formal-u
    register held throughout the Omar<->Verkoper exchange. Within-lesson
    facts consistent (bought 8 days ago, well within the 30-day window).
    listen_select single-line greeting asset and dialogue_comprehension
    distractors checked at the meaning level -- no speaker-line
    collisions. word_order/listen_order word_banks verified for
    duplicate-token coverage. ex08 write_summary deliberately mixes
    "Hij ... gekocht" (Omar) and a generic "Zij ... teruggekregen" to
    drill both hij/zij third-person forms; instruction and answer agree,
    so coherent. No objective bugs found. Systemic ze/zij (and je/jij)
    production-variant note applies (ex08 "Zij" has no "ze" variant);
    consistent with reviewed units 73/25, left as-is for Ramin's call.
  notes: >-
    Fourth of four new Dutch A2 units extending beyond
    universal_spine.yaml's original 6 base A2 outcomes. Realizes the
    new universal.a2.shopping.make_a_complaint outcome, added to
    universal_spine.yaml in the same authoring pass as this file --
    a genuine step up from a1_unit07_shopping's simple purchase
    exchange, reusing that unit's shop-vocabulary foundation for a new
    complaint/return scenario. Continues the Lotte/Omar storyline:
    Omar returns a faulty pair of headphones to a shop. Institutional
    formal u register with the shop employee (Verkoper), the same
    convention as units 24/26/27/28/74's official-interaction units.
    Follows the established 6-lesson A2 pattern and every
    AUTHORING_GUIDE.md rule: recognition-before-production pacing
    (§2), every vocabulary card carries a real example sentence (§19),
    every fill_in_blank frame keeps visible surrounding text (§13),
    every listen_select/listen_order/dialogue_comprehension
    media_asset_key text cross-checked against its tested_text, and
    the lesson06 dialogue's listen_select distractors checked against
    every line the tested speaker (the shop employee) actually says
    elsewhere in the same clip. Cross-checked facts within the lesson
    (§11): the headphones' stated fault (one side doesn't work,
    lesson01-02) and the receipt date/return-window facts in lesson05's
    reading and lesson06's dialogue (bought eight days ago, thirty-day
    return window) are mutually consistent -- eight days is well within
    thirty, so Omar's return in the dialogue is correctly accepted
    without contradiction. Pending the mandatory fresh-context review
    and Ramin's native-speaker pass; not yet compiled or imported.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Omar
    addresses the shop employee with formal u throughout this unit,
    the same institutional-register convention as units 24, 26, 27,
    28, and 74.

