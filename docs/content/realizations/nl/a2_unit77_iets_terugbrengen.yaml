    language: nl
    text: >-
      Retourbeleid: u kunt een artikel binnen dertig dagen na aankoop
      terugbrengen. Neem het bonnetje mee. Bij een defect artikel
      krijgt u uw geld terug of kunt u ruilen voor een nieuw exemplaar.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.terugbrengen.verkoper_open.01
    language: nl
    text: "Goedemiddag, waarmee kan ik u helpen?"
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.terugbrengen.01
    language: nl
    text: >-
      Verkoper: Goedemiddag, waarmee kan ik u helpen? Omar: Goedemiddag,
      deze koptelefoon is kapot. De linkerkant doet het niet. Verkoper:
      Wat vervelend. Heeft u het bonnetje nog? Omar: Ja, hier is het.
      Ik heb hem acht dagen geleden gekocht. Verkoper: Dat is geen
      probleem, dat valt binnen de dertig dagen. Wilt u ruilen of uw
      geld terug? Omar: Ik wil graag mijn geld terug. Verkoper: Prima,
      dat regel ik voor u.
    voice_hint: two_adults_formal_polite
    status: pending_generation

