course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte uses
    polite u and alstublieft with an unfamiliar market vendor. The vendor uses
    u in return. Keep the exchange friendly and neutral rather than highly formal.

