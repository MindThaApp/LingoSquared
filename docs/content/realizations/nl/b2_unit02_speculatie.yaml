status: complete_draft
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is nl's
    second B2 unit (speculation). No adaptable intermediate/upper-
    intermediate public-domain Dutch source exists (the FSI Dutch Basic
    Course used for nl's A1/A2 is beginner-only), so this was built from
    general Dutch grammar/discourse knowledge, the same honest-disclosure
    precedent nl's first B1 and B2 units set. Sibling-isolation honored:
    the X->en B2 speculation realization and every fa/prs/de B2 file were
    treated as non-existent and were NOT opened; only nl's OWN earlier
    realization content (the Lotte/Omar pair from a2_unit25_meningen) was
    consulted for character canon, which is not a sibling-direction
    violation. Lotte and Omar are an informal jij/je conversational pair
    with no pinned occupation in canon; here they speculate together about
    a late friend (Bram), which introduces no canon conflict.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) naturalness of every graded-certainty frame -- that
    the intended certainty ordering reads correctly to a native ear
    (misschien/wellicht < waarschijnlijk < vast wel < zal wel <
    ongetwijfeld/zeker) and that 'zal wel' and 'vast wel' are handled as
    the everyday deduction hedges intended, not as futures; (2) word order
    in the modal-cluster sentences, especially the PAST-speculation
    verb clusters 'moet de trein gemist hebben', 'moet zich verslapen
    hebben', 'moet de afspraak vergeten zijn', 'er moet iets gebeurd
    zijn', and the four-verb 'zou de trein gemist kunnen hebben' / 'zou
    zich verslapen kunnen hebben' -- confirm each is the natural spoken
    order and that vergeten/verslapen take the auxiliaries used (vergeten
    with zijn in 'de afspraak vergeten zijn'; verslapen reflexive with
    hebben); (3) the culminating writing exercise (lesson06 exercise06) is
    graded against a fixed two-sentence string -- only the all-periods and
    no-trailing-period variants are supplied, so a learner who omits the
    internal period would exceed distance-1 typo tolerance; decide whether
    more punctuation variants are needed or the item should be reframed;
    (4) confirm 'in de file staan' (to be stuck in traffic), 'zich
    verslapen' (to oversleep), 'spitsuur', 'de telefoon staat uit', and
    'ik gok dat...' all read as current everyday informal Dutch; (5)
    confirm the deduction-vs-guess distinction taught in lesson03/lesson06
    (deduction = moet/kan niet + evidence via want/dus; guess = misschien
    / zou kunnen / ik gok, no firm evidence) matches how a native would
    frame it.
  notes: >-
    Second Dutch B2 unit; first speculation unit. Targets the CEFR B2
    speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    speculate about causes and consequences with graded certainty -- say
    what may/might/must/cannot be the case in the PRESENT and the PAST,
    and distinguish deduction (evidence-based) from guesswork. Theme: one
    coherent everyday puzzle across all six lessons -- a friend (Bram) is
    late and the learner speculates why. Lesson arc: L01 the certainty
    scale (misschien / waarschijnlijk / vast wel / zal wel / ongetwijfeld
    / zeker) applied to a present cause; L02 present deduction from
    evidence (moet wel ... zijn / staan; kan niet ... zijn / dat kan
    niet); L03 tentative possibility and the deduction-vs-guess line (zou
    ... kunnen / wellicht / ik gok / ik weet het niet zeker); L04 PAST
    speculation (moet ... gemist/gebeurd/vergeten hebben/zijn; zou ...
    kunnen hebben); L05 an argumentative/narrative reading that separates
    asserted fact from speculation; L06 the culminating production -- a
    Lotte/Omar dialogue for the listening requirement (rank certainty +
    deduce-vs-guess), a speaking task, and a writing task that requires
    speculating about a PAST cause AND a PRESENT cause at DIFFERENT
    certainty levels. Register: informal jij/je throughout, per the nl
    lane pin; Lotte and Omar continue their established informal register
    from a2_unit25_meningen. All vocabulary is introduced self-contained
    within this file (B2 is a separate Course row from B1, so a B2 learner
    never sees B1 lexemes at runtime -- same self-containment precedent as
    nl's first B1 unit). No sibling-direction file was consulted.

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Informal jij/je throughout (nl lane pin). B2 speculation layers modals
    and adverbs of deduction onto that register -- moet wel, zal wel, zou
    kunnen, misschien, wellicht, waarschijnlijk, vast wel, ongetwijfeld,
    kan niet ... zijn -- while keeping everyday informal address (je,
    denk, hij komt vast wel). Lotte and Omar continue the informal jij/je
    they use with each other in a2_unit25_meningen.

