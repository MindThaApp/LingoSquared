      - content_key: nl.a2.unit107.lesson05.noors_uitnodiging
        title: "Noors uitnodiging"
        spine_outcome_id: universal.a2.social.invite_accept_decline_with_reasons
        teaching:
          - {"content_key": "nl.a2.unit107.lesson05.teach.woorden", "kind": "vocabulary", "target": {"text": "de uitnodiging, bedankt, groetjes, al, afspreken", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["de", "uitnodiging", "bedankt", "groetjes", "al", "afspreken", "voor", "Lotte", "Ik", "heb", "een", "afspraak"], "example": [{"text": "Bedankt voor de uitnodiging!", "language_code": "nl", "direction": "ltr"}, {"text": "Groetjes, Lotte", "language_code": "nl", "direction": "ltr"}, {"text": "Ik heb al een afspraak.", "language_code": "nl", "direction": "ltr"}]}
          - {"content_key": "nl.a2.unit107.lesson05.teach.gn_voltooid", "kind": "grammar_note", "target": {"text": "Ik heb met mijn ouders afgesproken. Ik heb gewerkt.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Ik", "heb", "met", "mijn", "ouders", "afgesproken", "gewerkt"]}
          - {"content_key": "nl.a2.unit107.lesson05.teach.reading", "kind": "reading", "target": {"text": "Hoi Lotte, heb je zin om zaterdag mee naar het theater te gaan? De voorstelling begint om acht uur. Kom je ook? Groetjes, Noor. Hoi Noor, bedankt voor de uitnodiging! Helaas kan ik niet, want ik heb al met mijn ouders afgesproken. Zullen we zondag naar de film gaan? Dan heb ik tijd. Groetjes, Lotte", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Hoi", "Lotte", "heb", "je", "zin", "om", "zaterdag", "mee", "naar", "het", "theater", "te", "gaan", "De", "voorstelling", "begint", "acht", "uur", "Kom", "ook", "Groetjes", "Noor", "bedankt", "voor", "uitnodiging", "Helaas", "kan", "ik", "niet", "want", "al", "met", "mijn", "ouders", "afgesproken", "Zullen", "we", "zondag", "film", "Dan", "tijd"]}
        exercises:
          - {"content_key": "nl.a2.unit107.lesson05.exercise01.lees_uitnodiging", "type": "reading_comprehension", "tested_text": "Heb je zin om zaterdag mee naar het theater te gaan", "prompt": {"target_blocks": [{"text": "What does Noor ask Lotte?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit107.lesson05.exercise02.lees_reden", "type": "reading_comprehension", "tested_text": "Helaas kan ik niet want ik heb al met mijn ouders afgesproken", "prompt": {"target_blocks": [{"text": "Why can't Lotte come on Saturday?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit107.lesson05.exercise03.match_bericht", "type": "matching_pairs", "tested_text": "om acht uur naar het theater met mijn ouders zondag naar de film bedankt voor de uitnodiging Groetjes", "prompt": {"target_blocks": []}, "pairs": [{"left": "om acht uur", "right": "when the performance starts"}, {"left": "naar het theater", "right": "where Noor invites Lotte"}, {"left": "met mijn ouders", "right": "who Lotte has arranged to meet"}, {"left": "zondag naar de film", "right": "Lotte's alternative plan"}, {"left": "bedankt voor de uitnodiging", "right": "how Lotte thanks Noor"}, {"left": "Groetjes", "right": "how both friends end their message"}]}
          - {"content_key": "nl.a2.unit107.lesson05.exercise04.order_dan", "type": "word_order", "tested_text": "Dan heb ik tijd", "prompt": {"target_blocks": []}, "word_bank": ["dan", "heb", "ik", "tijd"]}
          - {"content_key": "nl.a2.unit107.lesson05.exercise05.vertaal_bedankt", "type": "translation", "tested_text": "Bedankt voor de uitnodiging", "prompt": {"target_blocks": [{"text": "Thanks for the invitation!", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit107.lesson05.exercise06.dictee_uitnodiging", "type": "dictation", "tested_text": "Heb je zin om zaterdag mee naar het theater te gaan?", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.uitnodigen_en_afslaan.theater_uitnodiging"}
          - {"content_key": "nl.a2.unit107.lesson05.exercise07.dictee_afslaan", "type": "dictation", "tested_text": "Helaas kan ik niet, want ik heb al met mijn ouders afgesproken.", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.uitnodigen_en_afslaan.helaas_afgesproken"}
