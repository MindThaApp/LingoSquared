          - {"content_key": "nl.a2.unit107.lesson06.exercise02.begrijp_reden", "type": "dialogue_comprehension", "tested_text": "Helaas kan ik niet want ik moet werken", "prompt": {"target_blocks": [{"text": "Why can't Omar come on Saturday?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "nl.a2.audio.uitnodigen_en_afslaan.dialogue"}
          - {"content_key": "nl.a2.unit107.lesson06.exercise03.schrijf_zin", "type": "writing_prompt", "tested_text": "Heb je zin om zaterdag naar het theater te gaan", "prompt": {"target_blocks": [{"text": "Write one Dutch question inviting a friend, with 'Heb je zin om', to go to the theatre on Saturday.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit107.lesson06.exercise04.match_functies", "type": "matching_pairs", "tested_text": "heb je zin om helaas kan ik niet want ik moet werken zullen we zondag zondag kan ik wel hoe laat begint de film", "prompt": {"target_blocks": []}, "pairs": [{"left": "heb je zin om", "right": "invites"}, {"left": "helaas kan ik niet", "right": "declines politely"}, {"left": "want ik moet werken", "right": "gives the reason"}, {"left": "zullen we zondag", "right": "suggests an alternative"}, {"left": "zondag kan ik wel", "right": "agrees to the alternative"}, {"left": "hoe laat begint de film", "right": "asks about the time"}]}
          - {"content_key": "nl.a2.unit107.lesson06.exercise05.order_zondag", "type": "word_order", "tested_text": "Zondag kan ik wel", "prompt": {"target_blocks": []}, "word_bank": ["zondag", "kan", "ik", "wel"]}
          - {"content_key": "nl.a2.unit107.lesson06.exercise06.antwoord_afslaan", "type": "dialogue_response", "tested_text": "Helaas kan ik niet omdat ik een afspraak heb", "prompt": {"target_blocks": [{"text": "Kom je zaterdag naar het feest van Noor?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit107.lesson06.exercise07.vertaal_zondag", "type": "translation", "tested_text": "Zondag kan ik wel Hoe laat begint de film", "prompt": {"target_blocks": [{"text": "Sunday works for me. What time does the film start?", "language_code": "en", "direction": "ltr"}]}}
