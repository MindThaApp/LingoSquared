        title: "Lotte en Omar maken plannen"
        spine_outcome_id: universal.a2.social.invite_accept_decline_with_reasons
        teaching:
          - {"content_key": "nl.a2.unit107.lesson06.teach.beurt1", "kind": "dialogue", "target": {"text": "Hoi Omar, heb je zin om zaterdag mee naar het concert te gaan?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Hoi", "Omar", "heb", "je", "zin", "om", "zaterdag", "mee", "naar", "het", "concert", "te", "gaan"]}
          - {"content_key": "nl.a2.unit107.lesson06.teach.beurt2", "kind": "dialogue", "target": {"text": "Helaas kan ik niet, want ik moet werken.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Helaas", "kan", "ik", "niet", "want", "moet", "werken"]}
          - {"content_key": "nl.a2.unit107.lesson06.teach.beurt3", "kind": "dialogue", "target": {"text": "Jammer! Zullen we zondag naar de film gaan?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Jammer", "Zullen", "we", "zondag", "naar", "de", "film", "gaan"]}
          - {"content_key": "nl.a2.unit107.lesson06.teach.beurt4", "kind": "dialogue", "target": {"text": "Zondag kan ik wel. Hoe laat begint de film?", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Zondag", "kan", "ik", "wel", "Hoe", "laat", "begint", "de", "film"]}
          - {"content_key": "nl.a2.unit107.lesson06.teach.beurt5", "kind": "dialogue", "target": {"text": "Om acht uur.", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Om", "acht", "uur"]}
          - {"content_key": "nl.a2.unit107.lesson06.teach.beurt6", "kind": "dialogue", "target": {"text": "Leuk, graag! Ik ga mee.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Leuk", "graag", "Ik", "ga", "mee"]}
        exercises:
