            prompt: {target_blocks: []}
          - content_key: nl.b2.unit03.lesson04.exercise03.match_focus
            type: matching_pairs
            tested_text: "het is die wat is is dat juist wel degelijk muziek probleem"
            prompt: {target_blocks: []}
            pairs:
