generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is nl's third
    B2 unit (discourse: hedging and emphasis). No adaptable
    intermediate/upper-intermediate public-domain Dutch source exists (the
    FSI Dutch Basic Course used for nl's A1/A2 is beginner-only), so this
    was built from general Dutch grammar/discourse knowledge, the same
    honest-disclosure precedent nl's earlier B1/B2 units set.
    Sibling-isolation honored: the X->en B2 discourse realization and every
    fa/prs/de B2 file were treated as non-existent and were NOT opened;
    only nl's OWN earlier realization content (the Lotte/Omar taalcafe pair)
    was consulted for character canon, which is not a sibling-direction
    violation. Lotte and Omar are the informal jij/je conversational pair
    established in nl's A1/A2 units (Lotte from the Netherlands, Omar from
    Egypt, learning Dutch together at a language cafe); here they compare
    opinions about a film, softening and strengthening their claims, which
    introduces no canon conflict (no pinned occupation).
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) that every hedge reads as a genuine SOFTENER and every
    emphasis marker as a genuine STRENGTHENER to a native ear, and that the
    intended stance ordering is right (hedge: eigenlijk / best / een beetje
    / nogal / enigszins / misschien / volgens mij / naar mijn idee / in
    zekere zin / het lijkt erop dat / ik zou zeggen dat / wel; emphasis:
    echt / heel / erg / ontzettend / absoluut / zeker / juist / nou juist /
    wel degelijk + the clefts); (2) naturalness and word order of the FOCUS
    constructions -- the cleft 'Het is de muziek die de film goed maakt',
    'Het is het verhaal dat telt', the pseudo-cleft 'Wat goed is, is de
    muziek', and 'Dat is juist het probleem' / 'Dat is nou juist wat ik
    bedoel' / 'De film is wel degelijk goed'; (3) that 'best goed' (quite
    good), 'nogal langzaam' (rather slow), 'enigszins verwarrend' (somewhat
    confusing) and 'in zekere zin' all read as current everyday informal
    Dutch; (4) the SUBORDINATE-clause word order in 'Ik zou zeggen dat de
    film goed is' and 'Het lijkt erop dat de film een succes is' (verb-final
    is); (5) the culminating writing exercise (lesson06 exercise06) is
    graded against a fixed two-sentence string with three supplied
    punctuation variants (all-periods, no-trailing-period, comma-joined) --
    confirm those cover what a correct learner would type, and that the
    hedged-vs-emphatic pair 'Het einde is een beetje voorspelbaar' /
    'Het einde is echt heel voorspelbaar' keeps identical propositional
    content; (6) confirm 'de moeite waard', 'traag', 'redt', and 'wel
    degelijk' read naturally in these sentences.
  notes: >-
    Third Dutch B2 unit; first discourse/nuance unit. Targets the CEFR B2
    discourse outcome
    (universal.b2.discourse.express_nuance_with_hedging_and_emphasis):
    express nuance by softening or strengthening a statement -- hedging,
    qualification, emphasis and focus constructions -- so the SAME content
    can be delivered tentatively, neutrally, or emphatically. Theme: one
    coherent everyday topic across all six lessons -- Lotte and Omar have
    seen a film and give their opinions of it, softening and strengthening
    the same claims. Lesson arc: L01 basic hedges that soften an opinion
    (eigenlijk / best / een beetje / nogal / volgens mij / naar mijn idee /
    wel); L02 more tentative framing (enigszins / in zekere zin / het lijkt
    erop dat / ik zou zeggen dat / misschien); L03 emphasis and degree
    (echt / heel / erg / ontzettend / absoluut / zeker, and stacking them);
    L04 FOCUS constructions (the cleft 'het is ... die/dat', the pseudo-cleft
    'wat ... is, is ...', and juist / nou juist / wel degelijk); L05 a
    reading that separates hedged claims from emphatic ones and asks the
    learner to find the hedge and what it qualifies; L06 the culminating
    production -- a Lotte/Omar dialogue for the listening requirement
    (classify hedge / neutral / emphasis and what it implies about
    commitment), a speaking task that delivers the SAME claim once hedged
    and once emphasized, and a writing task that renders the SAME claim BOTH
    hedged AND emphasized. Register: informal jij/je throughout, per the nl
    lane pin; Lotte and Omar continue their established informal register.
    All vocabulary is introduced self-contained within this file (B2 is a
    separate Course row from B1, so a B2 learner never sees B1 lexemes at
    runtime -- same self-containment precedent as nl's earlier B1/B2 units).
    No sibling-direction file was consulted.

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Informal jij/je throughout (nl lane pin). B2 discourse layers hedging
    adverbs/phrases (eigenlijk, best, een beetje, nogal, enigszins, in
    zekere zin, volgens mij, naar mijn idee, het lijkt erop dat, ik zou
    zeggen dat, misschien, wel) and emphasis/focus devices (echt, heel, erg,
    ontzettend, absoluut, zeker, juist, nou juist, wel degelijk, the cleft
    'het is ... die/dat' and pseudo-cleft 'wat ... is, is ...') onto that
    register, while keeping everyday informal address (je, jij). Lotte and
    Omar continue the informal jij/je they use with each other.

