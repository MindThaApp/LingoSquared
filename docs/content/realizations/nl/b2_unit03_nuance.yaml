          - content_key: nl.b2.unit03.lesson02.teach.grammar_voorzichtig
            kind: grammar_note
            target: {text: "Ik zou zeggen dat de film goed is. Het lijkt erop dat de film een succes is.", language_code: nl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: nl.b2.unit03.lesson02.exercise01.recognize_enigszins
            type: multiple_choice
            tested_text: enigszins
            prompt: {target_blocks: [{text: enigszins, language_code: nl, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson02.exercise02.listen_zou_zeggen
            type: listen_select
            tested_text: "Ik zou zeggen dat de film goed is"
            media_asset_key: nl.b2.audio.nuance.zou_zeggen_goed.01
            prompt: {target_blocks: []}
          - content_key: nl.b2.unit03.lesson02.exercise03.match_tentative
            type: matching_pairs
            tested_text: "enigszins in zekere zin het lijkt erop dat ik zou zeggen dat misschien verhaal"
            prompt: {target_blocks: []}
            pairs:
              - {left: enigszins, right: somewhat}
              - {left: "in zekere zin", right: "in a sense"}
              - {left: "het lijkt erop dat", right: "it seems that"}
              - {left: "ik zou zeggen dat", right: "I would say that"}
              - {left: misschien, right: maybe}
              - {left: verhaal, right: story}
          - content_key: nl.b2.unit03.lesson02.exercise04.order_zou_zeggen
            type: word_order
            tested_text: "Ik zou zeggen dat de film goed is"
            prompt: {target_blocks: []}
            word_bank: [Ik, zou, zeggen, dat, de, film, goed, is]
          - content_key: nl.b2.unit03.lesson02.exercise05.translate_lijkt_erop
            type: translation
            tested_text: "Het lijkt erop dat de film een succes is"
            prompt: {target_blocks: [{text: "Translate into Dutch, using het lijkt erop dat: It seems that the film is a success.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson02.exercise06.write_hedge_success
            type: writing_prompt
            tested_text: "Het lijkt erop dat de film een succes is"
            prompt: {target_blocks: [{text: "Soften this blunt statement into a hedged one. Blunt: The film is a success. Hedge it by opening with het lijkt erop dat (verb 'is' goes to the end): It seems that the film is a success.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson02.exercise07.speak_in_zekere_zin
            type: speak_response
            tested_text: "In zekere zin is het een komedie"
            prompt: {target_blocks: [{text: "Say aloud in Dutch, opening with in zekere zin: In a sense it is a comedy.", language_code: en, direction: ltr}]}

      - content_key: nl.b2.unit03.lesson03.benadrukken
        title: "Iets benadrukken"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
