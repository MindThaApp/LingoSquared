              - {left: "wat ... is, is ...", right: "what ... is, is ..."}
              - {left: juist, right: precisely}
              - {left: "wel degelijk", right: "most certainly"}
              - {left: muziek, right: music}
              - {left: probleem, right: problem}
          - content_key: nl.b2.unit03.lesson04.exercise04.order_cleft_muziek
            type: word_order
