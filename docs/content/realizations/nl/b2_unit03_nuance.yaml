      - content_key: nl.b2.unit03.lesson04.focus
        title: "Focus leggen"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: nl.b2.unit03.lesson04.teach.cleft_die
