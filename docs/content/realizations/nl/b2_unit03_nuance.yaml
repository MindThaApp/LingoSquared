units:
  - content_key: nl.b2.unit03.nuance
    title: "Nuance"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.discourse.express_nuance_with_hedging_and_emphasis
    planned_lesson_count: 6

    lessons:
      - content_key: nl.b2.unit03.lesson01.afzwakken
        title: "Iets afzwakken"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: nl.b2.unit03.lesson01.teach.base_claim
            kind: phrase
            target: {text: "De film is goed.", language_code: nl, direction: ltr}
            introduced_tokens: [De, film, is, goed]
          - content_key: nl.b2.unit03.lesson01.teach.eigenlijk
            kind: vocabulary
            target: {text: "eigenlijk", language_code: nl, direction: ltr}
            introduced_tokens: [eigenlijk]
            example: {text: "De film is eigenlijk goed.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson01.teach.best
            kind: vocabulary
            target: {text: "best", language_code: nl, direction: ltr}
            introduced_tokens: [best]
            example: {text: "De film is best goed.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson01.teach.beetje
            kind: phrase
            target: {text: "een beetje", language_code: nl, direction: ltr}
            introduced_tokens: [een, beetje, langzaam]
            example: {text: "De film is een beetje langzaam.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson01.teach.nogal
            kind: vocabulary
            target: {text: "nogal", language_code: nl, direction: ltr}
            introduced_tokens: [nogal]
            example: {text: "De film is nogal langzaam.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson01.teach.volgens_mij
            kind: phrase
            target: {text: "volgens mij", language_code: nl, direction: ltr}
            introduced_tokens: [volgens, mij]
            example: {text: "Volgens mij is de film goed.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson01.teach.naar_mijn_idee
            kind: phrase
            target: {text: "naar mijn idee", language_code: nl, direction: ltr}
            introduced_tokens: [naar, mijn, idee]
            example: {text: "Naar mijn idee is de film goed.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson01.teach.wel
            kind: vocabulary
            target: {text: "wel", language_code: nl, direction: ltr}
            introduced_tokens: [wel]
            example: {text: "De film is eigenlijk wel goed.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson01.teach.grammar_afzwakken
            kind: grammar_note
            target: {text: "De film is goed. De film is eigenlijk best goed, volgens mij.", language_code: nl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: nl.b2.unit03.lesson01.exercise01.recognize_eigenlijk
            type: multiple_choice
            tested_text: eigenlijk
            prompt: {target_blocks: [{text: eigenlijk, language_code: nl, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson01.exercise02.listen_eigenlijk_best
            type: listen_select
            tested_text: "De film is eigenlijk best goed"
            media_asset_key: nl.b2.audio.nuance.eigenlijk_best_goed.01
            prompt: {target_blocks: []}
          - content_key: nl.b2.unit03.lesson01.exercise03.match_hedges
            type: matching_pairs
            tested_text: "eigenlijk best een beetje nogal volgens mij langzaam"
            prompt: {target_blocks: []}
            pairs:
              - {left: eigenlijk, right: actually}
              - {left: best, right: "quite / pretty"}
              - {left: "een beetje", right: "a bit"}
              - {left: nogal, right: rather}
              - {left: "volgens mij", right: "in my view"}
              - {left: langzaam, right: slow}
          - content_key: nl.b2.unit03.lesson01.exercise04.order_eigenlijk_best
            type: word_order
            tested_text: "De film is eigenlijk best goed"
            prompt: {target_blocks: []}
            word_bank: [De, film, is, eigenlijk, best, goed]
          - content_key: nl.b2.unit03.lesson01.exercise05.translate_volgens_mij
            type: translation
            tested_text: "Volgens mij is de film goed"
            prompt: {target_blocks: [{text: "Translate into Dutch, opening with volgens mij: In my view the film is good.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson01.exercise06.write_soften
            type: writing_prompt
            tested_text: "De film is eigenlijk best goed"
            prompt: {target_blocks: [{text: "Soften this blunt statement into a hedged one. Blunt: The film is good. Hedge it using eigenlijk and best (both after 'is'): The film is actually quite good.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson01.exercise07.speak_naar_mijn_idee
            type: speak_response
            tested_text: "Naar mijn idee is de film goed"
            prompt: {target_blocks: [{text: "Say aloud in Dutch, opening with naar mijn idee: To my mind the film is good.", language_code: en, direction: ltr}]}

      - content_key: nl.b2.unit03.lesson02.voorzichtig
        title: "Voorzichtig formuleren"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: nl.b2.unit03.lesson02.teach.enigszins
            kind: vocabulary
            target: {text: "enigszins", language_code: nl, direction: ltr}
            introduced_tokens: [enigszins, verhaal, verwarrend]
            example: {text: "Het verhaal is enigszins verwarrend.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson02.teach.in_zekere_zin
            kind: phrase
            target: {text: "in zekere zin", language_code: nl, direction: ltr}
            introduced_tokens: [in, zekere, zin, komedie]
            example: {text: "In zekere zin is het een komedie.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson02.teach.lijkt_erop
            kind: phrase
            target: {text: "het lijkt erop dat", language_code: nl, direction: ltr}
            introduced_tokens: [het, lijkt, erop, dat, succes]
            example: {text: "Het lijkt erop dat de film een succes is.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson02.teach.zou_zeggen
            kind: phrase
            target: {text: "ik zou zeggen dat", language_code: nl, direction: ltr}
            introduced_tokens: [ik, zou, zeggen]
            example: {text: "Ik zou zeggen dat de film goed is.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson02.teach.misschien
