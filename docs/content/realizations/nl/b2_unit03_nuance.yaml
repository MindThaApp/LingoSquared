            prompt: {target_blocks: [{text: "Say aloud in Dutch, using the cleft het is ... die to put focus on the music: It is the music that makes the film good.", language_code: en, direction: ltr}]}

      - content_key: nl.b2.unit03.lesson05.recensie
        title: "Een recensie lezen"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: nl.b2.unit03.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                De nieuwe film is naar mijn idee een beetje voorspelbaar.
                Het begin is enigszins traag. Maar de muziek is echt
                ontzettend mooi. Het is juist de muziek die de film redt. Ik
                zou zeggen dat de film de moeite waard is.
              language_code: nl
              direction: ltr
            introduced_tokens: [nieuwe, begin, traag, maar, redt, redden]
        exercises:
          - content_key: nl.b2.unit03.lesson05.exercise01.read_hedge
            type: reading_comprehension
            tested_text: "een beetje voorspelbaar"
            prompt: {target_blocks: [{text: "Which opinion does the writer HEDGE -- present tentatively rather than assert flatly?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson05.exercise02.read_hedge_words
            type: reading_comprehension
            tested_text: "naar mijn idee een beetje"
            prompt: {target_blocks: [{text: "Which words mark the writer's hedge about the film being predictable?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson05.exercise03.read_emphasis
            type: reading_comprehension
            tested_text: "echt ontzettend mooi"
            prompt: {target_blocks: [{text: "Which claim does the writer state most emphatically?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson05.exercise04.read_focus
            type: reading_comprehension
            tested_text: "het is juist de muziek die de film redt"
            prompt: {target_blocks: [{text: "The writer uses the focus construction 'Het is juist de muziek die de film redt.' What does it single out?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson05.exercise05.match_reading
            type: matching_pairs
            tested_text: "nieuwe begin traag redt de moeite waard voorspelbaar"
            prompt: {target_blocks: []}
            pairs:
              - {left: nieuwe, right: new}
              - {left: begin, right: beginning}
              - {left: traag, right: "sluggish / slow"}
              - {left: redt, right: saves}
              - {left: "de moeite waard", right: "worth it"}
              - {left: voorspelbaar, right: predictable}
          - content_key: nl.b2.unit03.lesson05.exercise06.translate_traag
            type: translation
            tested_text: "Het begin is enigszins traag"
            prompt: {target_blocks: [{text: "Translate into Dutch, using enigszins: The beginning is somewhat slow.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson05.exercise07.write_hedge_predictable
            type: writing_prompt
            tested_text: "De film is naar mijn idee een beetje voorspelbaar"
            prompt: {target_blocks: [{text: "Soften this blunt statement into a hedged one. Blunt: The film is predictable. Hedge it using naar mijn idee (after 'is') and een beetje: The film is, to my mind, a bit predictable.", language_code: en, direction: ltr}]}

      - content_key: nl.b2.unit03.lesson06.in_gesprek
        title: "Nuance in een gesprek"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: nl.b2.unit03.lesson06.teach.vond
            kind: phrase
            target: {text: "Wat vond je van de film?", language_code: nl, direction: ltr}
            introduced_tokens: [vond, vinden, je, van]
          - content_key: nl.b2.unit03.lesson06.teach.dat_is_waar
            kind: phrase
            target: {text: "Dat is waar.", language_code: nl, direction: ltr}
            introduced_tokens: [waar]
          - content_key: nl.b2.unit03.lesson06.teach.hij
            kind: vocabulary
            target: {text: "hij", language_code: nl, direction: ltr}
            introduced_tokens: [hij]
            example: {text: "Hij is de moeite waard.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit03.lesson06.teach.dialogue_lotte_vraag
            kind: dialogue
            target: {text: "Wat vond je van de film?", language_code: nl, direction: ltr, speaker: Lotte}
            introduced_tokens: []
          - content_key: nl.b2.unit03.lesson06.teach.dialogue_omar_hedge
            kind: dialogue
            target: {text: "Het verhaal is eigenlijk best voorspelbaar, naar mijn idee.", language_code: nl, direction: ltr, speaker: Omar}
            introduced_tokens: []
          - content_key: nl.b2.unit03.lesson06.teach.dialogue_lotte_emphasis
            kind: dialogue
            target: {text: "Ja, maar de muziek is echt ontzettend mooi!", language_code: nl, direction: ltr, speaker: Lotte}
            introduced_tokens: [ja]
          - content_key: nl.b2.unit03.lesson06.teach.dialogue_omar_focus
            kind: dialogue
            target: {text: "Dat is waar. Het is juist de muziek die de film redt.", language_code: nl, direction: ltr, speaker: Omar}
            introduced_tokens: []
          - content_key: nl.b2.unit03.lesson06.teach.dialogue_lotte_hedge
            kind: dialogue
            target: {text: "Ik zou zeggen dat hij de moeite waard is.", language_code: nl, direction: ltr, speaker: Lotte}
            introduced_tokens: []
          - content_key: nl.b2.unit03.lesson06.teach.dialogue_omar_absoluut
            kind: dialogue
            target: {text: "Absoluut!", language_code: nl, direction: ltr, speaker: Omar}
            introduced_tokens: []
          - content_key: nl.b2.unit03.lesson06.teach.grammar_nuance
            kind: grammar_note
            target: {text: "De film is goed. De film is naar mijn idee eigenlijk best goed. De film is echt ontzettend goed.", language_code: nl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: nl.b2.unit03.lesson06.exercise01.classify_hedge
            type: dialogue_comprehension
            tested_text: "eigenlijk best voorspelbaar"
            media_asset_key: nl.b2.audio.nuance.dialogue.film_gesprek.01
            prompt: {target_blocks: [{text: "Omar says the story is 'eigenlijk best voorspelbaar, naar mijn idee'. Is he hedging, stating it neutrally, or emphasizing -- and what does that say about his commitment?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson06.exercise02.classify_emphasis
            type: dialogue_comprehension
            tested_text: "echt ontzettend mooi"
            media_asset_key: nl.b2.audio.nuance.dialogue.film_gesprek.01
            prompt: {target_blocks: [{text: "How does Lotte present her claim about the music ('Ja, maar de muziek is echt ontzettend mooi!')?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson06.exercise03.classify_focus
            type: dialogue_comprehension
            tested_text: "het is juist de muziek die de film redt"
            media_asset_key: nl.b2.audio.nuance.dialogue.film_gesprek.01
            prompt: {target_blocks: [{text: "What does Omar do with 'Het is juist de muziek die de film redt.'?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson06.exercise04.speak_same_hedged
            type: speak_response
            tested_text: "De film is naar mijn idee eigenlijk best goed"
            prompt: {target_blocks: [{text: "Deliver the claim 'The film is good' as a HEDGE that lowers your commitment. Use naar mijn idee (after 'is'), then eigenlijk best: The film is, to my mind, actually quite good.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson06.exercise05.speak_same_emphatic
            type: speak_response
            tested_text: "De film is echt ontzettend goed"
            prompt: {target_blocks: [{text: "Now deliver the SAME claim as an EMPHATIC statement that raises your commitment, using echt ontzettend: The film is really incredibly good.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson06.exercise06.write_both_ways
            type: writing_prompt
            tested_text: "Het einde is een beetje voorspelbaar. Het einde is echt heel voorspelbaar."
            prompt: {target_blocks: [{text: "Write the SAME claim about the ending TWO ways, changing only the nuance, not the content. (1) HEDGED, lowering commitment, using een beetje: The ending is a bit predictable. (2) EMPHATIC, raising commitment, using echt heel: The ending is really very predictable.", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit03.lesson06.exercise07.respond_emphatic
            type: dialogue_response
            tested_text: "De muziek is echt ontzettend mooi"
            prompt: {target_blocks: [{text: "Wat vond je van de muziek?", language_code: nl, direction: ltr}]}
