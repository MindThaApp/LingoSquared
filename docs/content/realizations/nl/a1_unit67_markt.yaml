    existing outcome ids. All 4 modalities (listening, speaking, reading,
    writing) are present in assessment_requirements. Story continuity:
    unit66 closed with Nina asking Omar "Hoe was de voorstelling?", Omar
    answering "Heel goed! De acteurs waren geweldig.", and Nina proposing
