course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina, Omar,
    and Lotte are established taalcafe friends and use informal jij/je with
    each other throughout. This unit's market vendor character ("de
    marktkoopman") is addressed formally with "u" by Omar and Nina, matching
    the corpus's established neutral-polite stranger-register convention for
    paid venues, but is given a market-specific job title rather than the
    "de medewerker" reused by unit50-58/60/62-66's ticket-counter/front-desk
    venues, since an open-air market stall is a genuinely different social
    shape (an individual vendor at their own stall, not staff at a shared
    counter).

