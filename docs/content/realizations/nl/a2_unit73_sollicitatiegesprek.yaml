course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina
    and the Kantoor Bloem interviewer ("mevrouw Jansen") use the formal
    u throughout this unit, the same neutral-polite-stranger register
    convention as every other A2 unit's official appointment (units
    24, 26, 27, 28).

