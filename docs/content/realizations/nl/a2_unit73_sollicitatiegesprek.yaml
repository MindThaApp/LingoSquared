    register material, not modern HR-style job-seeking content. This
    unit is therefore genuinely `ai_generated` from established modern
    Dutch conventions (solliciteren, de vacature, het
    sollicitatiegesprek, beschikbaar, de werktijden are all standard,
    current terms, cross-checked against the WebSearch results above),
    not adapted from any public-domain source, disclosed honestly per
