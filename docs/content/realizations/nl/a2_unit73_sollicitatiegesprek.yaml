    Cross-checked every concrete fact stated across this unit per §11:
    the job title ("administratief medewerker") is stated identically
    in lesson01's teaching card and lesson05's job-posting reading;
    the preferred-experience fact ("ervaring met klantcontact is een
    pre") appears in lesson05's ad and Nina explicitly claims exactly
