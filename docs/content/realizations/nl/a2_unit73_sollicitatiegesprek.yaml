review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    2026-07-10 fresh-context review (Claude, zero access to the original
    authoring reasoning) found and fixed TWO real issues, then confirmed
    the rest of the original self-review's claims independently rather
    than trusting them.

    Bug 1 (genuinely unanswerable exercise): lesson02 exercise04
    (order_afspraak_maken, word_order) tested "Kan ik een afspraak maken
    voor een sollicitatiegesprek" but its word_bank was missing the
    second "een" -- [Kan, ik, een, afspraak, maken, voor,
    sollicitatiegesprek] only supplied ONE "een" tile, and
    WordOrder.tsx's tile bank removes a tile from `available` the
    instant it's clicked (no reuse), so no learner could ever assemble
    the correct sentence regardless of skill. This is a variant of the
    project's documented word_order footgun (CLAUDE.md) -- not the
    already-fixed comma/string-vs-list shape bug, but a genuinely
    missing token. Fixed by adding the second "een" to word_bank:
    [Kan, ik, een, afspraak, maken, voor, een, sollicitatiegesprek].

    Bug 2 (review notes described content that was never shipped): the
    original self-review's own notes claimed matching_pairs exercises
    grow "3 -> 6 -> 7 -> 8 -> 3 -> 8 (lesson06, pooling the whole
    unit)" per AUTHORING_GUIDE §16, but lesson06 as shipped had NO
    matching_pairs exercise at all -- the claim was never true. Fixed
    by adding lesson06.exercise05.match_unit_recap (8 pairs: vacature,
    sollicitatiegesprek, ervaring, vaardigheid, beschikbaar,
    werktijden, klantcontact, administratief medewerker -- all taught
    earlier in this unit, tested_text verified against the taught-token
    pool), placed before word_order/dialogue_response/listen_type/
    writing_prompt to match the recognition-before-drag-before-
    production ordering every other lesson in this unit already
    follows (per AUTHORING_GUIDE §2). This required renumbering
    lesson06's exercise05-08 to exercise06-09 in both this file and the
    overlay; re-ran the compiler after the renumber and confirmed every
    content_key still resolves 1:1 between the two files.

    Independently re-verified (not just re-trusted) the original
    self-review's other claims: re-ran a bool-coercion scan (no stray
    yes/no/true/false leaks in learner-facing fields, only the expected
    human_reviewed/target_language_first booleans); re-checked every
    matching_pairs exercise's `pairs` against its overlay
    accepted_answers ({left,right}[] shape, exact set match, no
    self-reference pairs); re-checked every word_order/listen_order
    word_bank against its accepted answer (all consistent after the
    Bug 1 fix); grepped the whole nl corpus independently for "Nina
    werkt"/"Nina studeert"/"Nina...baan"/"Nina...functie" (zero hits,
    confirming no prior job/field-of-study fact for Nina exists to
    contradict) and for "meneer "/"mevrouw " (zero hits outside this
    file, confirming mevrouw Jansen doesn't collide with any existing
    named character); independently re-read unit47's actual dialogue
    lines and confirmed Nina is there as a library PATRON borrowing a
    book, not a volunteer -- this file's own claim that unit73's
    volunteer detail is a new, non-contradictory addition (not
    something unit47 itself established) is accurate as worded, not
    overclaimed. Checked the new spine outcome
    universal.a2.employment.attend_job_interview independently:
    yaml.safe_load confirms the spine parses cleanly, all outcome-level
    ids are unique, and both declared prerequisites resolve to real
    outcomes. (A broader recursive scan of every "id" key anywhere in
    the spine, including nested per-outcome assessment_requirements
    sub-ids, found one pre-existing duplicate --
    "read_appointment_confirmation", reused across
    universal.a2.health.attend_doctor_appointment and a separate
    appointments outcome -- confirmed via `git show` to predate this
    unit's commit entirely and out of scope for this unit's review.)
    Ran the compiler against this file alone and together with the
    existing nl A2 batch (units 24-28): 0 errors, 0 warnings both times,
    both before and after the two fixes above.

    Dutch quality (the highest-priority check for this reference-
    language unit): read every sentence for grammaticality and
    register. "Solliciteren voor" (rather than the more textbook
    "solliciteren naar" or the very common "solliciteren op") was
    specifically checked against real usage -- confirmed genuine,
    attested Dutch (taaladvies.net and sollicitatiedokter.nl both list
    it as a valid, if less common, variant), not an invented
    construction. "Solliciteren bij een bedrijf" (used in the lesson06
    summary card) is the correct preposition for the employER, matching
    real usage. Formal "u" register is used with zero informal je/jij/
    jouw leaks anywhere in the file (grepped explicitly). Separable
    verbs (langskomen, contact ... opnemen) and the present-perfect/
    simple-past forms (heeft gesolliciteerd, had) are correctly formed
    and appropriately A2 -- not accidentally simpler (A1) or more
    complex (B1, e.g. no subjunctive/conditional/passive voice
    anywhere). "Een pre" (a plus/advantage) in the job posting is
    genuine, idiomatic modern Dutch job-ad register, not a generic-
    sounding translation. No remaining register/naturalness judgment
    call found that needed flagging for Ramin instead of resolving
    directly.

    Original self-review notes preserved below for the spine-addition
    and story-continuity reasoning, which were independently
    re-verified above rather than removed.

    ---

    Sixth Dutch A2 unit, new spine outcome
    universal.a2.employment.attend_job_interview added to
    universal_spine.yaml in this same task. Spine check performed
    BEFORE adding anything: a yaml.safe_load walk of the full
    universal_spine.yaml (pre-addition) found 75 pre-existing
    universal.a1/a2/b1.* outcomes (76 after this addition), 0 duplicate
    ids among them, and confirmed by direct grep that ALL 68 A1 and ALL
    5 A2 outcomes already had at least one realizing nl unit --
    only two B1 outcomes (universal.b1.abilities.*,
    universal.b1.necessity.*, both grammar-shaped, not topic-shaped)
    were unused, so per the standing delegated-authority instruction a
    new A2 outcome was added rather than reusing one of those. The new
    outcome's prerequisites (universal.a1.work.describe_job,
    universal.a2.opinions.give_opinions_with_reasons) both resolve to
    real existing outcome ids -- verified programmatically with
    yaml.safe_load, not just by eye. Checked carefully against every
    existing outcome for substantive duplication before adding it: NOT
    a duplicate of universal.a1.work.describe_job (that outcome is
    about describing a job you ALREADY HAVE -- workplace, schedule,
    third-person job descriptions, realized in nl unit17 where Omar
    already has an established job as a kok and Lotte as a
    verpleegkundige; this new outcome is the reverse direction, SEEKING
    and INTERVIEWING for a job you don't have yet, with its own
    register/vocabulary shape: vacature, solliciteren,
    sollicitatiegesprek, describing experience/availability to a
    stranger, none of which unit17 touches); NOT a duplicate of
    universal.a2.opinions.give_opinions_with_reasons (a general
    opinion-plus-reason skill with no venue, formal-register, or
    application-process shape of its own); NOT a duplicate of any
    other A2 outcome (bureaucracy/banking/health/housing are all
    civic-service formal appointments with a government/institutional
    counterpart, not an employer evaluating a candidate -- a
    genuinely different social shape and the reason employment gets
    its own outcome rather than being folded into one of those).
    Sanity-checked programmatically after the edit: the spine file
    still parses cleanly with yaml.safe_load, the 76 resulting
    outcomes have zero duplicate ids, and both prerequisite references
    resolve to real existing outcome ids.

    Story continuity: continues the Lotte/Omar/Nina taalcafe cast (same
    A2-level jump-forward-in-time convention already established by
    units 24-28, which are not day-to-day continuations of the A1
    storyline but later chapters of the same characters' lives).
    Checked Nina's established facts across the whole nl corpus before
    writing: she has no established job or field of study anywhere
    (confirmed by grep across every nl realization file for
    "Nina werkt"/"Nina...baan"/"Nina...studeert" etc. -- zero hits,
    a genuine blank slate), she has a fish (unit30/31), was new to the
    taalcafe as of unit41, and borrowed a book at the library in
    unit47 (established "de bibliotheek" as a place she visits, not
    that she works there) -- so having her apply for her first
    part-time job, drawing on volunteer experience at that same
    library, is a new but non-contradictory addition to her arc, not a
    conflict with anything already shipped. The employer (Kantoor
    Bloem, a small office; interviewer "mevrouw Jansen") and the job
    itself (administratief medewerker, administrative assistant) are
    newly introduced -- grepped the whole nl corpus for "meneer
    [A-Z]"/"mevrouw [A-Z]" first and found zero prior named formal
    characters, so mevrouw Jansen doesn't collide with anything.
    Register: mevrouw Jansen and Nina use formal "u" throughout, the
    same neutral-polite-stranger convention as every other A2 unit's
    official appointment (gemeente/bank/huisarts/woningcorporatie).
    Deliberately reuses several already-established phrases rather
    than inventing new ones where an existing pattern fits: "een
    afspraak maken voor" (unit46), "de bibliotheek" (unit47), the
    "Wij nemen ... contact met u op" construction (unit28, reused here
    as "Wij nemen deze week nog contact met u op" -- a natural
    variant, not a verbatim copy, of unit28's "Wij nemen binnen
    vierentwintig uur contact met u op"), and "Dank u wel" (used
    across nearly every formal-register unit so far). All are
    re-declared as introduced_tokens at their first use in THIS file
    per the corpus's established per-file convention (confirmed by
    re-reading validate_untaught_vocabulary in
    scripts/compile_content.py: it only checks each exercise's own
    tested_text against the cumulative introduced_tokens pool built up
    within THIS file, not across files).

    Every kind:vocabulary teaching card carries a real example sentence
    built from this unit's own taught material, with a matching
    overlay example_gloss (AUTHORING_GUIDE §19); schema_version is
    "1.1" from the start since this is a brand-new file, so missing
    examples are a hard compiler error, not a warning. Deliberately
    kept "de ervaring" (experience) and "de vaardigheid" (skill) as
    standalone vocabulary cards rather than teaching the compounds
    "werkervaring"/"computervaardigheden" -- the standalone forms are
    more reusable across this unit's own sentences (Ik heb ervaring
    als vrijwilliger / Typen is een belangrijke vaardigheid / Ik heb
    goede vaardigheden), and introducing a compound would have meant
    declaring yet another distinct surface-form token for the same
    underlying idea with no real pedagogical benefit at A2. Every
    fill_in_blank frame (lesson02 exercise06, lesson04 exercise06)
    retains visible surrounding Dutch text besides the blanked slot
    per §13, and neither slot's candidate is a true synonym of another
    already-taught word in this unit (afspraak and beschikbaar are
    each the unit's only word with that meaning) so no
    interchangeable-candidate ambiguity per §17. Every multi-clause
    accepted_answers list (the lesson06 dialogue_response and
    writing_prompt) is authored with period-joined, no-final-period,
    and (where the two clauses are independent enough to naturally
    combine with "en") comma-plus-conjunction-joined variants per §12.
    matching_pairs exercises grow 3 (lesson01, capped by being the
    unit's first lesson) -> 6 -> 7 -> 8 -> 3 (lesson05's smaller
