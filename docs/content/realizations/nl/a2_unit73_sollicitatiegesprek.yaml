    availability, not contradicting it); the working hours ("van
    negen tot vijf uur") are stated identically in lesson05's ad and
    lesson06's dialogue. No other price/quantity/schedule claim
    appears anywhere else in the unit to conflict with these.

    Distractor safety for every listen_select/dialogue_comprehension
    exercise built from lesson06's dialogue audio (per the standing
    "a distractor must never be a line the tested/any speaker actually
    says elsewhere in the same clip" rule): the full dialogue clip
    has six lines -- mevrouw Jansen: "Goedemorgen, welkom bij Kantoor
    Bloem. Vertelt u eens over uw ervaring.", "Mooi. Bent u
    beschikbaar op maandag, woensdag en vrijdag?", "Van negen tot vijf
    uur. Wij nemen deze week nog contact met u op."; Nina: "Goedemorgen.
    Ik heb ervaring als vrijwilliger in de bibliotheek. Daar had ik
    veel klantcontact.", "Ja, dat kan. Wat zijn de werktijden
    precies?", "Dank u wel voor het gesprek." lesson06 exercise01 uses
    a SHORT dedicated clip of only Jansen's opening greeting (not the
    full dialogue), and its distractors ("What is your salary
    expectation?"/"When can you start?"/"Do you have any questions for
    me?") are invented, never spoken by anyone in either that clip or
    the full dialogue. exercise02 tests Nina's "Daar had ik veel
    klantcontact" against distractors ("She learned to type
    there."/"She managed the collection there."/"She doesn't say.") --
    none match any of the six lines' meanings. exercise03 tests
    Jansen's availability question against distractors ("Whether Nina
    has a valid ID."/"Whether Nina can start today."/"She doesn't ask
    anything.") -- none spoken by anyone in the clip. exercise04 tests
    Jansen's "Wij nemen deze week nog contact met u op" against
    distractors ("We will contact you next month."/"You will start
    tomorrow."/"She doesn't say when.") -- none spoken by anyone in
    the clip, and specifically avoids "Van negen tot vijf uur" (the
    same speaker's own immediately preceding line) as a distractor.

    A recursive yaml.safe_load scan of this file (and the re-checked
    spine file) found no bare unquoted Yes/No/True/False/on/off value
