review:
  status: unreviewed
  required_next_reviewer: ramin
  flagged_issues:
    - >-
      2026-07-10 genuine fresh-context review: lesson06's closing
      dialogue line "Dan proberen we deze week iets van ons alle vier!"
      (Lotte, teach.lotte_afsluiting) reads as slightly unusual Dutch --
      "iets van ons alle vier" (literally "something of us all four")
      isn't a construction the reviewer is fully confident is natural
      idiomatic phrasing for "let's try one of our four things this
      week" versus a more standard alternative (e.g. "iets van ons
      vieren", "een van onze vier sporten samen", "iets samen met ons
      alle vier"). Everything else in this unit (lessons 01-05,
      lesson06's other four lines, all exercises, distractors,
      matching_pairs shapes, boolean/jargon scans) checked clean --
      this single closing line is the only reason status stays
      unreviewed. Needs Ramin's native-speaker judgment call on whether
      to keep as-is or reword; not touched here since it's not a
      mechanical fix and the "correct" replacement isn't obvious to a
      non-native reviewer. This line isn't itself tested by any
      exercise (word_bank/tested_text never reference it), so leaving
      it as-is carries no grading risk in the meantime.
  notes: >-
    New A1 sports/exercise unit (file-numbered unit32, next after
    unit31), realizing the new spine outcome
    universal.a1.sports.talk_about_sports_exercise (prerequisite:
    universal.a1.hobbies.describe_free_time_activities, realized in
    unit29). This outcome was added fresh in this same task under the
    standing delegated spine-authority -- nl had realized all 32
    existing outcomes (confirmed via exact spine_outcome_id diff before
    adding anything), so one new sensible A1 topic was required to
    continue volume growth. Sanity-checked per the standing authority:
    no duplicate id, valid prerequisite reference, all 4 modalities
    present, exactly 4 assessment_requirements with 4 success_criteria
    (checked for the exact duplicate-key bug this project hit once
    before when adding a spine entry).

    Continues the established storyline: Lotte does yoga (twice a
    week), Omar plays football/voetbal (often, reusing "vaak" from
    unit29), Sander runs/hardloopt, Fenna swims/zwemt -- the specific
    sport-per-character assignments are freshly established here,
    cross-checked against every fact unit05/10/13/29/30/31 already
    established for these characters. **Correction made during
    same-session-family review (standing in for Codex while it's
    unavailable, see the top-level review.notes field -- this is NOT
    an independent-reviewer pass):** the original draft of this note
    claimed "none had any prior sport/exercise fact," which is false --
    unit29 lesson04 already has Omar say "En ik sport vaak" (generic
    "I exercise often") as part of his hobbies. This unit's "Omar doet
    vaak aan voetbal" is a consistent NARROWING of that already-
    established generic fact to a specific sport, not a contradiction,
    but the note's blanket claim was inaccurate and is corrected here.
    Register is informal jij/je throughout, matching every other A1
    unit.

    Six lessons, recognition->drag->production pacing (§2): 01 teaches
    "de sport" plus four sport nouns (voetbal, yoga, hardlopen, zwemmen)
    and the general "Welke sport doe je?" / "Ik doe aan voetbal."
    construction (deliberately using the general "doen aan + sport"
    pattern for every sport rather than teaching four separate
    sport-specific verbs, keeping this A1-appropriate); 02 teaches
    frequency with sport ("twee keer per week", a new but simple
    construction) explicitly alongside a grammar_note naming unit29's
    already-taught "elke dag"/"vaak" as the precedent this extends; 03
    teaches the alternative general verb "sporten" (to exercise/do
    sport) via a grammar_note contrasting it with the specific "doen
    aan + sport" pattern from lesson01 (both are natural, "sporten" is
    for exercise in general, "doen aan X" names the specific activity),
    reusing unit13's "houden van" for a preference statement about
    sport; 04 is a taalcafé dialogue where Omar asks Sander about his
    running routine, reusing unit10's separable-verb precedent
    indirectly (hardlopen itself isn't separable, but the grammar_note
    cross-references it to note hardlopen is a single fused verb, NOT
    separable, precisely because a learner who just learned uitlaten/
    opstaan in nearby units might over-generalize the separable
    pattern) and unit29's "elke week" frequency phrasing; 05 is a
    reading comparing Lotte (yoga, twice a week) and Fenna (swimming,
    often) with a "wie doet welke sport" comprehension structure
    mirroring unit31 lesson05's "wie heeft welk dier" shape; 06 is a
    wrap-up taalcafé dialogue where the group makes a plan to try a
    sport together, reusing unit11's "Zullen we...?" plan-proposing
    construction, closing the loop.

    Every kind: vocabulary card has a real example built only from
    vocabulary already taught in this unit or earlier. Total new
    nouns/verbs taught: sport, voetbal, yoga, hardlopen, zwemmen, doen
    aan (6), plus the "keer per week" frequency construction (grammar)
    -- within the established 6-10 "don't pad" range. **Correction made
    during same-session-family review:** the original draft counted
    "sporten" as a 7th new verb; it is not new -- "sporten" (to
    exercise/play sports) was already taught in unit29 lesson01 as one
    of the three core hobby verbs (merged card "lezen, sporten, koken",
    example "Ik sport op zaterdag"), and unit29 lesson03 already used
    it with "elk weekend". Lesson03's "sporten" card and its
    `sporten_note` grammar_note here are a legitimate spaced-repetition
    callback contrasting it with the new "doen aan + sport" pattern,
    not new vocabulary -- the grammar_note's learner-facing text has
    been amended to say so explicitly (matching this file's own
    established convention for flagging reuse, e.g. `geen_note`/
    `separable_note`/`frequency_note`), and this note is corrected to
    stop claiming it as new.

    fill_in_blank ambiguity (§13/§17) checked per the established
    pattern: blanking voetbal/yoga/hardlopen/zwemmen directly would be
    genuinely ambiguous (all four are grammatically valid completions
    of "Ik doe aan ___"), so NO fill_in_blank targets any sport noun --
    lesson01 uses dialogue_response for its production slot instead.
    Lesson03 blanks "van" in the fixed phrase "Ik houd ___ voetbal",
    which has a single sensible completion. **Correction made during
    same-session-family review:** lesson02's exercise06 originally
    blanked "keer" in "Ik doe twee ___ per week aan yoga," which the
    original draft claimed was unambiguous -- it is not. "uur" (hour,
    taught since unit04) is an equally grammatical, equally plausible
    completion of that exact frame ("Ik doe twee uur per week aan
    yoga" = "I do yoga two hours a week," a genuinely different but
    fully valid Dutch sentence), and only "keer" was in
    `accepted_answers`, so a learner who typed "uur" would have been
    marked wrong for a real, grammatical alternative -- the exact
    §17 bug class. Fixed by converting that exercise from
    `fill_in_blank` to `translation` (translate "twice a week", which
    disambiguates to "keer" since "uur" would translate as "two hours
    a week," a different English source phrase) rather than
    reformulating the blank, following this same file's own
    unit16-health precedent of never blanking "keer" itself in a
    "twee keer per [period]" frame (unit16 blanks the following noun
    instead, for the identical reason). Lessons04/06 (dialogue) and 05
    (reading) have no fill_in_blank, matching unit31's own shape.

    Every multi-clause accepted_answers list is authored with
    period-joined, comma-joined, and conjunction-joined variants per
    §12. **Correction made during same-session-family review:**
    lesson06's exercise08 (write_group_plan) originally violated this
    -- its four accepted answers (one per character/sport) only had a
    period-joined form each, with no comma-joined or "en"-joined
    variant, and the fourth taught sport (yoga) had no accepted answer
    at all despite the prompt allowing any of the four. Expanded to
    cover all four sports with period/comma/en-joined variants (with
    and without trailing period) in the overlay, and fixed this
    exercise's `tested_text` (previously an odd third-person summary
    of all four characters combined, which didn't match any actual
    accepted answer, unlike every other writing_prompt in this
    corpus) to match one real canonical answer.

    Matching_pairs pairs checked for duplicate right-hand text within
    each exercise -- no two pairs in any single exercise share
    identical left or right text.

    Audio assets declared for generation. Pending fresh-context review
    and Ramin's native-speaker pass.

    **Same-session-family review disclosure**: the corrections above
    were made by a Claude worktree session standing in for Codex
    (unavailable, usage limit) as a fresh-context reviewer, per Ramin's
    explicit instruction. This is NOT the project's normal independent
    review pipeline -- `review.status` is deliberately left
    `unreviewed` and `required_next_reviewer` left `claude` so this
    unit is not miscounted as having passed real independent review.
    A genuine fresh-context Codex (or otherwise independent) review
    pass is still owed before this unit should be considered reviewed.

course:
  realization_key: nl.a1
  target_language_first: true
