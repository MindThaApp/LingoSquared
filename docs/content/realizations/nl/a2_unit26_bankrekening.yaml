schema_version: "1.0"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A2
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    The formal register-and-requirements pattern for a bank interview
    (asking what is needed, confirming identity, stating a purpose) is
    scaffolded from the official-interactions module of the FSI Dutch
    Basic Course (Foreign Service Institute, US Department of State --
    public domain, no attribution required per docs/content/
    AUTHORING_GUIDE.md §10). The source frames this around a
    1960s-70s bank-teller interaction with no modern equivalent; the
    specific institutions and features here (a Dutch betaalrekening,
    the bankpas, mobiel bankieren, using a BSN to open an account)
    reflect current 2020s Dutch banking practice and are freshly
    authored, not translated or lightly edited from the source.
status: complete_draft
review:
  status: unreviewed
  required_next_reviewer: ramin
  notes: >-
    Third Dutch A2 unit (spine outcome:
    universal.a2.banking.open_bank_account, newly added to
    universal_spine.yaml this session), continuing the Lotte/Omar
    storyline -- Omar needs a Dutch bank account for his job (unit17)
    now that he has his BSN number (unit24). The specific fact (BSN
    number required, needed for payroll) is stated consistently
    between lesson02's teaching example, lesson05's reading, and
    lesson06's dialogue per AUTHORING_GUIDE §11. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. Every listen_select/listen_order/
    listen_type/dialogue_comprehension exercise double-checked against
    its media_asset_key's declared text before finalizing, after two
    audio-mismatch bugs were caught in the previous A2 review round.
    A fresh-context review ran (audio fidelity held up clean this time)
    and found: lesson03's word-order exercise was unsolvable (word_bank
    missing a second "mijn" needed for both "mijn paspoort" and "mijn
    BSN-nummer") -- fixed; lesson02's title used informal "je" against
    this unit's own formal-register policy ("...voor je salaris") --
    fixed to "...voor uw salaris"; lesson06's closing listen_type
    exercise claimed a truncated sentence was "complete" when the
    actual dialogue line continues with the mobile-banking clause --
    extended the tested text/accepted answers to the full sentence.
    Also noted but not remediated here (per AUTHORING_GUIDE §9/§15's
    own no-retrofit carve-out and this unit's already-broad scope):
    the spine's `request_bank_account` requirement mentions confirming
    an address, which this unit doesn't practice -- flagged for a
    future unit or lesson addition, not a blocking defect. Re-validated
    (0 errors/0 warnings across the full nl course, including the real
    compile step). Additionally retrofitted per new AUTHORING_GUIDE
    §16 (found live 2026-07-06, Ramin's direct feedback):
    matching_pairs exercises expanded from 2-3 pairs to 6-8 pairs in
    lessons 02-04, pooling forward from vocabulary already taught
    earlier in the unit (added a small grammar note teaching the
    infinitive "storten" alongside the already-taught conjugated
    "stort" so the pooled pair wasn't testing an untaught form).
    Lesson01's match_account_words stays at 3 pairs (capped by
    lesson01 being the unit's first lesson); lesson05's
    match_folder_points intentionally kept at 3 pairs -- it's a
    structural reading-comprehension check, not a vocabulary drill.
    Still needs Ramin's native-speaker pass before status: reviewed.
    Audio assets are declared for generation.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Omar
    and the bank employee use the formal u throughout this unit, the
    same register convention as unit24's gemeente visit.

media_assets:
  - {content_key: nl.a2.audio.bank.rekening_openen.01, language: nl, text: "Ik wil graag een bankrekening openen.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.bank.waarmee_helpen.01, language: nl, text: "Goedemorgen, waarmee kan ik u helpen?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.bank.welke_rekening.01, language: nl, text: "Wat voor rekening wilt u openen?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.bank.betaalrekening.01, language: nl, text: "Ik wil graag een betaalrekening voor mijn salaris.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.bank.bsn_nodig.01, language: nl, text: "Heeft u uw BSN-nummer en een geldig identiteitsbewijs bij zich?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.bank.bankpas_uitleg.01, language: nl, text: "U ontvangt uw bankpas binnen een week per post.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.bank.mobiel_bankieren.01, language: nl, text: "Met de app kunt u ook mobiel bankieren.", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: nl.a2.audio.bank.folder.01
    language: nl
    text: >-
      Om een betaalrekening te openen heeft u een geldig
      identiteitsbewijs en uw BSN-nummer nodig. Uw werkgever gebruikt
      deze rekening om uw salaris te storten. Na de opening ontvangt u
      binnen een week een bankpas per post.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.bank_afspraak.01
    language: nl
    text: >-
      Medewerker: Goedemorgen, waarmee kan ik u helpen? Omar:
      Goedemorgen, ik wil graag een betaalrekening openen voor mijn
      salaris. Medewerker: Natuurlijk. Heeft u uw BSN-nummer en een
      geldig identiteitsbewijs bij zich? Omar: Ja, hier is mijn
      paspoort en mijn BSN-nummer. Medewerker: Dank u wel. U ontvangt
      uw bankpas binnen een week per post, en met de app kunt u ook
      mobiel bankieren. Omar: Perfect, dank u wel voor uw hulp!
    voice_hint: two_adults_formal_polite
    status: pending_generation

