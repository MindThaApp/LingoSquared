      - content_key: nl.a2.unit103.zorg_voor_jezelf.lesson05.noors_bericht
        title: "Noors bericht"
        spine_outcome_id: universal.a2.daily_life.describe_self_care_and_feelings
        teaching:
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.reading", "kind": "reading", "target": {"text": "Hoi Lotte en Omar, deze week voel ik me niet goed. Ik ben moe en ik heb pijn in mijn hoofd. Elke ochtend haast ik me naar mijn werk. Vanavond ontspan ik me in een warm bad. Voelen jullie je ook moe? Groetjes, Noor", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["hoi", "lotte", "en", "omar", "deze", "week", "voel", "ik", "me", "niet", "goed", "ben", "moe", "heb", "pijn", "in", "mijn", "hoofd", "elke", "ochtend", "haast", "naar", "werk", "vanavond", "ontspan", "een", "warm", "bad", "voelen", "jullie", "je", "ook", "groetjes", "noor"]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.extra", "kind": "vocabulary", "target": {"text": "deze week, ook, groetjes", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["deze", "week", "ook", "groetjes", "ben", "ik", "moe", "voel", "jij", "je", "lotte"], "example": [{"text": "Deze week ben ik moe.", "language_code": "nl", "direction": "ltr"}, {"text": "Voel jij je ook moe?", "language_code": "nl", "direction": "ltr"}, {"text": "Groetjes, Lotte", "language_code": "nl", "direction": "ltr"}]}
        exercises:
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson05.exercise01.lees_voelen", "type": "reading_comprehension", "tested_text": "Deze week voel ik me niet goed", "prompt": {"target_blocks": [{"text": "How does Noor feel this week?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson05.exercise02.lees_bad", "type": "reading_comprehension", "tested_text": "Vanavond ontspan ik me in een warm bad", "prompt": {"target_blocks": [{"text": "What does Noor do this evening?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson05.exercise03.match_bericht", "type": "matching_pairs", "tested_text": "ik voel me niet goed Ik haast me Ik ontspan me Voelen jullie je ook moe een warm bad elke ochtend", "prompt": {"target_blocks": []}, "pairs": [{"left": "ik voel me niet goed", "right": "I do not feel well"}, {"left": "ik haast me", "right": "I hurry"}, {"left": "ik ontspan me", "right": "I relax"}, {"left": "Voelen jullie je ook moe?", "right": "Do you (all) feel tired too?"}, {"left": "een warm bad", "right": "a warm bath"}, {"left": "elke ochtend", "right": "every morning"}]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson05.exercise04.volgorde_bad", "type": "word_order", "tested_text": "Vanavond ontspan ik me in een warm bad", "prompt": {"target_blocks": []}, "word_bank": ["vanavond", "ontspan", "ik", "me", "in", "een", "warm", "bad"]}
