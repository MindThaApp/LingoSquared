          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_vraag", "kind": "grammar_note", "target": {"text": "Voel jij je goed? Haast hij zich? Verveel jij je? Waarom haast hij zich?", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["voel", "jij", "je", "goed", "haast", "hij", "zich", "verveel", "waarom"]}
