      - content_key: nl.a2.unit103.zorg_voor_jezelf.lesson06.lotte_en_omar
        title: "Lotte en Omar"
        spine_outcome_id: universal.a2.daily_life.describe_self_care_and_feelings
        teaching:
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt1", "kind": "dialogue", "target": {"text": "Hoi Omar, hoe voel je je vandaag?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["hoi", "omar", "hoe", "voel", "je", "vandaag"]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt2", "kind": "dialogue", "target": {"text": "Ik voel me moe. Elke ochtend haast ik me naar mijn werk.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["ik", "voel", "me", "moe", "elke", "ochtend", "haast", "naar", "mijn", "werk"]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt3", "kind": "dialogue", "target": {"text": "Ontspan je dan in het weekend!", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["ontspan", "je", "dan", "in", "het", "weekend"]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt4", "kind": "dialogue", "target": {"text": "Ja, zaterdag ga ik naar de kapper. Daarna ontspan ik me thuis.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["ja", "zaterdag", "ga", "ik", "naar", "de", "kapper", "daarna", "ontspan", "me", "thuis"]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt5", "kind": "dialogue", "target": {"text": "Verveel je je dan niet?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["verveel", "je", "dan", "niet"]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt6", "kind": "dialogue", "target": {"text": "Nee, ik verveel me nooit.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["nee", "ik", "verveel", "me", "nooit"]}
        exercises:
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.exercise01.luister_vraag", "type": "listen_select", "tested_text": "Hoi Omar hoe voel je je vandaag", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.dialogue.zorg_voor_jezelf.01"}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.exercise02.begrijp_moe", "type": "dialogue_comprehension", "tested_text": "Ik voel me moe", "prompt": {"target_blocks": [{"text": "How does Omar feel today?", "language_code": "en", "direction": "ltr"}]}, "media_asset_key": "nl.a2.audio.dialogue.zorg_voor_jezelf.01"}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.exercise03.match_dialoog", "type": "matching_pairs", "tested_text": "Hoe voel je je Ik voel me moe Ontspan je Daarna ontspan ik me thuis Verveel je je dan niet Ik verveel me nooit naar de kapper", "prompt": {"target_blocks": []}, "pairs": [{"left": "Hoe voel je je?", "right": "How do you feel?"}, {"left": "Ik voel me moe.", "right": "I feel tired."}, {"left": "Ontspan je!", "right": "Relax!"}, {"left": "naar de kapper", "right": "to the barber"}, {"left": "Verveel je je dan niet?", "right": "Aren't you bored then?"}, {"left": "Ik verveel me nooit.", "right": "I am never bored."}]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.exercise04.volgorde_nooit", "type": "word_order", "tested_text": "Ik verveel me nooit", "prompt": {"target_blocks": []}, "word_bank": ["ik", "verveel", "me", "nooit"]}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.exercise05.antwoord_moe", "type": "dialogue_response", "tested_text": "Ik voel me moe", "prompt": {"target_blocks": [{"text": "Hoe voel je je vandaag?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.exercise06.vertaal_ochtend", "type": "translation", "tested_text": "Elke ochtend haast ik me", "prompt": {"target_blocks": [{"text": "Every morning I hurry.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson06.exercise07.schrijf_verhaal", "type": "writing_prompt", "tested_text": "Ik voel me moe Elke ochtend haast ik me Zaterdag ontspan ik me thuis", "prompt": {"target_blocks": [{"text": "Write exactly three Dutch sentences: (1) say you feel tired; (2) say you hurry every morning; (3) say you relax at home on Saturday.", "language_code": "en", "direction": "ltr"}]}}

