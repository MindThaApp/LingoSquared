          - {"content_key": "nl.a2.unit103.zorg_voor_jezelf.lesson05.exercise06.dictee_haast", "type": "dictation", "tested_text": "Elke ochtend haast ik me naar mijn werk.", "prompt": {"target_blocks": []}, "media_asset_key": "nl.a2.audio.zorg_voor_jezelf.noor_haast.01"}
