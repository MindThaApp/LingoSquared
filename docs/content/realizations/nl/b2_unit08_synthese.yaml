generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is nl's B2
    synthesis unit (the FINAL B2 unit for this direction). No adaptable
    intermediate/upper-intermediate public-domain Dutch source exists (the
    FSI Dutch Basic Course used for nl's A1/A2 is beginner-only), so this
    was built from general Dutch grammar/discourse knowledge, the same
    honest-disclosure precedent nl's earlier B1/B2 units set.
    Sibling-isolation honored: the X->en B2 synthesis realization and every
    fa/prs/de B2 file were treated as non-existent and were NOT opened;
    only nl's OWN earlier realization content (the Lotte/Omar pair from
    a2_unit25_meningen) was consulted for character canon, which is not a
    sibling-direction violation. Lotte and Omar are an informal jij/je
    conversational pair with no pinned occupation in canon; here they act
    as two spoken sources discussing a new restaurant (De Pauw), which
    introduces no canon conflict. Sanne and Thomas are new named review
    authors local to this unit (the two written sources).
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) naturalness of the whole synthesis toolkit -- the
    attributing frames (volgens X, X stelt/beweert dat, uit ... blijkt
    dat), the comparing connectives (beide bronnen, allebei, terwijl,
    daarentegen, in tegenstelling tot, aan de ene/andere kant), the
    agreement/conflict frames (ze zijn het eens over, ze verschillen van
    mening over, ze spreken elkaar tegen op het punt van) and the
    judgement frames (het meest overtuigend is, ik vind X sterker, beter
    onderbouwd, al met al / alles afwegend) -- confirm each reads as
    current everyday informal Dutch and that the subordinate word order in
    'terwijl Thomas het duur vindt' is right; (2) confirm 'spreken elkaar
    tegen op het punt van de prijs' is idiomatic and not stilted, and that
    'op het punt van' is the natural collocation (vs 'op dat punt' /
    'wat ... betreft'); (3) the culminating writing exercise (lesson06
    exercise06) is graded against a fixed three-sentence string -- only the
    trailing-period and comma-before-'want' variants are supplied, so a
    learner who drops an internal sentence period would need distance-1
    typo tolerance to still pass; decide whether more punctuation variants
    are needed or the item should be reframed; (4) confirm 'de recensie',
    'de bron', 'onderbouwd', 'overtuigend', 'goedkoop', 'in de file staan'
    is NOT used here -- but 'het eten', 'de prijs', 'te duur', 'geweldig',
    'al met al' all read as natural informal register; (5) confirm the
    deduction the unit rests on -- that Thomas's/Omar's view is 'better
    supported' BECAUSE he names a concrete price (achttien euro) while
    Sanne/Lotte only assert -- is a fair, single-answer reading of the two
    sources.
  notes: >-
    nl's B2 synthesis unit and the FINAL B2 unit for en-nl. Targets the
    CEFR B2 synthesis outcome
    (universal.b2.synthesis.summarize_and_evaluate_multiple_sources):
    summarize and evaluate multiple sources -- name where two sources
    agree, where they conflict, and give a reasoned judgement between them.
    Theme: one coherent everyday puzzle across all six lessons -- two
    online reviews of a new restaurant (De Pauw), one by Sanne and one by
    Thomas, that AGREE the food is good but CONFLICT on the price, and one
    of which is better supported. Lesson arc: L01 attributing a claim to a
    source (volgens / stelt / beweert / uit ... blijkt dat); L02 comparing
    two sources side by side (beide / allebei / terwijl / daarentegen / in
    tegenstelling tot / aan de ene/andere kant); L03 naming AGREEMENT (ze
    zijn het eens over / hetzelfde / op het punt van); L04 naming CONFLICT
    (ze verschillen van mening over / ze spreken elkaar tegen op het punt
    van / het verschil); L05 a reading of BOTH review texts side by side --
    identify the agreement, the conflict point, and which review backs its
    price claim with a reason; L06 the culminating production -- a
    Lotte/Omar dialogue for the listening requirement (identify agreement,
    conflict, and which speaker is better supported), a speaking synthesis,
    and a writing synthesis that NAMES all three parts (agreement +
    conflict + reasoned judgement). Register: informal jij/je throughout,
    per the nl lane pin; Lotte and Omar continue their established informal
    register from a2_unit25_meningen. All vocabulary is introduced
    self-contained within this file (B2 is a separate Course row from B1,
    so a B2 learner never sees B1/A2 lexemes at runtime -- same
    self-containment precedent as nl's earlier B1/B2 units). No
    sibling-direction file was consulted.

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Informal jij/je throughout (nl lane pin). B2 synthesis layers the
    attributing, comparing, agreement/conflict and judgement toolkit onto
    that register -- volgens, stelt, beweert, uit ... blijkt dat, beide
    bronnen, allebei, terwijl, daarentegen, in tegenstelling tot, aan de
    ene/andere kant, ze zijn het eens over, ze verschillen van mening over,
    ze spreken elkaar tegen op het punt van, het meest overtuigend, beter
    onderbouwd, al met al -- while keeping everyday informal address (je,
    ik vind, we zijn het eens). Lotte and Omar continue the informal jij/je
    they use with each other in a2_unit25_meningen.

