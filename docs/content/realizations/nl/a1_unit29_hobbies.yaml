  - content_key: nl.a1.audio.dialogue.hobbies_weekend.01
    language: nl
    text: >-
      Omar: Wat doe je dit weekend? Lotte: Ik weet het nog niet. Ik
      lees graag, maar ik wil ook naar buiten. Omar: Zullen we samen
      wandelen? Ik kook daarna voor ons. Lotte: Goed idee! Ik vind
      wandelen en koken allebei leuk. Omar: Perfect. Dan zie ik je
      zaterdag!
    voice_hint: two_young_adults_neutral_friendly
    status: pending_generation

