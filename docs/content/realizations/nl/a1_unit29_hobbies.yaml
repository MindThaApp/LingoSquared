    language: nl
    text: >-
      Lotte: We wandelen vaak samen. Maar wat doe jij nog meer in je
      vrije tijd, Omar? Omar: Ik kook graag, ook thuis. En ik sport
      vaak. Lotte: Kook je ook thuis? Jij kookt al de hele dag op je
      werk! Omar: Ja, maar koken vind ik ontspannend. En jij, wat doe
      jij graag? Lotte: Ik lees graag en ik luister vaak naar muziek.
      Omar: Game je ook? Lotte: Nee, ik game nooit. Maar ik teken soms!
    voice_hint: two_young_adults_neutral_friendly
