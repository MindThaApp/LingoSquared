review:
  status: unreviewed
  required_next_reviewer: claude
  notes: >-
    New A1 hobbies unit (file-numbered unit29, the highest-numbered file in
    the nl corpus so far, appended as the A1 course's next unit after
    unit23 in scripts/content_manifest.txt's en-nl line -- the number jump
    reflects file-numbering across the whole corpus, not a level change;
    this unit is still A1, same course as units 1-23), realizing the new
    spine outcome universal.a1.hobbies.describe_free_time_activities
    (prerequisite: universal.a1.preferences.express_preferences, already
    realized in unit13). Genuinely new volume growth, not a retrofit --
    authored fresh at schema_version 1.1 from the start per
    AUTHORING_GUIDE §19, every kind: vocabulary card carries a real
    example from day one.

    Found and fixed a real bug in universal_spine.yaml before authoring
    against it: the new outcome's write_hobby_description assessment
    requirement had a duplicate success_criteria key -- the second line
    ("Produces an accepted formal-register report with the necessary
    details") was clearly copy-pasted residue from a different, unrelated
    outcome (household-problem reporting) and contradicted this being an
    informal, non-report hobby-writing task. Since PyYAML silently keeps
    only the last value for a duplicate key, the correct first line was
    being silently discarded. Removed the erroneous duplicate line,
    covered by this session's standing spine-outcome sanity-check
    authorization.

    Continues the Lotte/Omar taalcafé storyline directly from where the
    A1 arc left off: unit13 established they already share a love of
    wandelen and that Omar dislikes films; unit23 was their dinner
    celebrating Omar's good first shift (unit21/22). Both remain
    informal jij/je throughout this unit, matching every other A1 unit's
    register_policy -- no formal-register content here, correctly, since
    the outcome and every character interaction are informal. New facts
    introduced in this unit are original and kept self-consistent across
    all six lessons (AUTHORING_GUIDE §11): Omar cooks often, including at
    home (not just at his restaurant job), and exercises often; Lotte
    reads and listens to music often, occasionally draws, and never
    games. These exact facts are stated identically in lesson04's
    dialogue, reused in lesson05's reading recap, and referenced again in
    lesson06's exercises -- nothing added or changed later.

    Six lessons: 01-02 introduce six hobby verbs (lezen/sporten/koken,
    then muziek luisteren/tekenen/gamen) plus "de vrije tijd" itself, each
    as merged 2-3-item vocabulary cards with real example sentences per
    §19; 03 introduces the four core frequency adverbs (altijd/vaak/
    soms/nooit, reusing "vaak" which was actually already taught in
    unit05's "Zie je hem vaak?") and the elke week / elk weekend duo
    (with a short grammar_note on the elke/elk common-vs-neuter agreement,
    reusing the established "Bij X gebruik je Y" template from units 13
    and 14) plus the outcome's core question "Wat doe je in je vrije
    tijd?"; 04 is a taalcafé dialogue where Lotte and Omar discuss their
    free-time habits, deliberately opening with a callback to their
    established shared love of walking from unit13 before pivoting to new
    material; 05 is a reading passage (Lotte's recap message comparing
    what each of them does) ending with the outcome's "ask someone about
    theirs" requirement; 06 is a short wrap-up dialogue where they plan to
    combine two of the unit's taught hobbies (wandelen, koken) over the
    coming weekend, reusing "dit weekend" (unit19) and "daarna" (unit10)
    rather than introducing new unrelated grammar (deliberately avoided a
    gaan+infinitive future-tense construction here to stay tightly scoped
    to the hobbies outcome per §1, not drift into teaching future tense).

    Every kind: vocabulary card has a real example built only from
    vocabulary already taught in this unit or earlier (list-shaped, one
    sentence per member, for every merged card -- none of this unit's
    vocabulary cards are single-word). Every multi-clause accepted_answers
    list authored with period/comma/conjunction-joined variants per §12.
    Every fill_in_blank frame was deliberately checked against §13/§17: a
    first draft would have blanked one of several interchangeable hobby
    verbs or frequency adverbs the unit teaches side by side (e.g. "Ik
    kook ___ voor vrienden" -- altijd/vaak/soms/nooit/elke week would all
    grammatically fit, an unfair blank even though the words aren't true
    synonyms of each other), which is exactly the ambiguity class this
    guide warns against; all three fill_in_blank exercises (lessons
    01-03) were rewritten to instead blank a word with only one
    grammatically/semantically sensible completion in its own frame
    (boek, vrienden, vrije). Matching_pairs exercises use 4 pairs
    (lesson05, the structural reading-comprehension exemption) to 8 pairs
    elsewhere, pooling forward from earlier lessons' vocabulary per §16.
    Dialogue lessons (04, 06) use one turn per teaching card with the
    speaker name prefixed into the Dutch text, matching the established
    (non-blocking, per CLAUDE.md's Phase D3 footgun note) convention
    already used identically in units 23 and 28, rather than the newer
    structured speaker field.

    Pending fresh-context review and Ramin's native-speaker pass. Audio
    assets are declared for generation.

course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    and Omar continue to use informal jij/je with each other at the
    taalcafé, the same register as every earlier A1 unit -- no formal u
    appears in this unit. Distinguish leuk vinden and houden van for
    activities (reusing unit13's pattern) alongside the frequency
    adverbs altijd/vaak/soms/nooit and the elke/elk time expressions
    newly taught here.

