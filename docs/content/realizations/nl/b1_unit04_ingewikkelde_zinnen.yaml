review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    Targets Dutch relative clauses: *die* (common/de-gender subject or
    object relative pronoun), *dat* (neuter/het-gender relative
    pronoun -- a genuine grammatical-gender distinction English doesn't
    make), and *waar*+preposition compounds (*waarover*, etc.) used for
    things/places, contrasted with *met wie* for people at the wrap-up
    (waar-compounds never refer to people). Continues Lotte and Omar's
    established informal jij/je register and storyline. No sibling-
    direction file was consulted. All vocabulary, including basic
    function words, is introduced self-contained within this file.
    Fresh-context review 2026-07-11: Dutch verified natural and
    grammatical (die/dat gender agreement, verb-final relative
    clauses, waar/waarover usage all correct); Sara verified as a
    genuinely new character with no prior corpus collisions; Lotte's
    unnamed birthplace consistent with her established "Ik kom uit
    Nederland" (a1_unit01). Overlay-side fixes (an ambiguous bare-word
    distractor, an overstated never-waarmee grammar claim, missing
    waar...over split-form accepted answers) recorded in the overlay's
    own review notes.

