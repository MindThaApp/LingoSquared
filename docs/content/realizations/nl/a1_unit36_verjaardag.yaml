    verjaardag van [naam]" using the already-taught "van" possessive-
    style construction (unit03's "de inleverdatum van het boek")
    instead of an apostrophe-s possessive, to avoid the real apostrophe-
    after-e ambiguity in Dutch names like Lotte/Fenna; 03 teaches
    "uitnodigen" (to invite, a genuinely separable verb: "ik nodig je
    uit") with an explicit grammar_note in the exact established
    separable-verb-precedent phrasing from unit31/32/33/34 ("is
    scheidbaar, net als opstaan en uitlaten"), plus "Kom je naar het
    feest?" / "Ja, ik kom graag!" (reusing unit06's already-taught
