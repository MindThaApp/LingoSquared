generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation. Checked firecrawl search/scrape for an
    intermediate-level public-domain Dutch course first (per
    AUTHORING_GUIDE.md §10) -- firecrawl is still returning HTTP 402
    (account credits exhausted, a standing outage as of this dispatch),
    and no genuine FSI/Peace-Corps-equivalent intermediate Dutch source is
    known to exist (the FSI Dutch Basic Course used for nl's A1/A2 units
    is confirmed beginner-only). Built from general Dutch grammar
    knowledge, not adapted from a source. nl's seventh B1 unit, the first
    of five closing the true outcome-coverage gap documented in
    b1_unit06's own provenance note: fa/ro/hi/prs's B1 courses all cover 6
    first-wave outcomes (necessity, abilities, hypotheticals, debate,
    workplace, narrative-recount) as their units 01-06, while nl's
    original 5 B1 units (01-05) instead cover a disjoint later-wave
    outcome set. b1_unit06 closed necessity; this unit targets
    universal.b1.abilities.express_ability_with_embedded_clause, the
    second of the six.
review:
  status: unreviewed
  required_next_reviewer: fresh_context
  notes: >-
    nl's seventh B1 unit. Targets universal.b1.abilities.express_
    ability_with_embedded_clause. The spine's own can_do text describes
    this outcome (modeled on languages with a genuine modal-plus-
    embedded-subordinate-clause ability construction) in terms that
    don't map onto Dutch literally: Dutch's ordinary present/past ability
    is a plain modal + bare infinitive (*kan*/*kon* + infinitive), which
    IS the "bare modal + verb" pattern the outcome explicitly says not to
    stop at. Dutch's genuine closest equivalent to an embedded-clause
    ability construction, and the one this unit actually teaches as its
    target grammar, is the double-infinitive modal cluster: *had kunnen*
    + infinitive for past/hypothetical regret (lesson03, the same IPP --
    Infinitivus Pro Participio -- effect b1_unit06 already introduced for
    *had ... moeten*, so *kunnen* stays as an infinitive rather than
    becoming *gekund*) and *zou kunnen* + infinitive for present/future
    hypothetical possibility (lesson04) -- both genuinely embedded modal-
    plus-modal-plus-infinitive clusters, not bare modal+verb. Lessons
    01-02 teach the simple present/past (*kan*/*kon*) first as necessary
    scaffolding -- a learner cannot appreciate what's structurally special
    about *had kunnen*/*zou kunnen* without first seeing the plain forms
    to contrast against, and the outcome's own assessment_requirements
    explicitly ask for "present ability" vs "past/hypothetical ability"
    contrast, which requires teaching the present/past pair too. Errand/
    appointment scenario (passport pickup at the gemeente) chosen to
    match the outcome's own prerequisite, universal.a2.bureaucracy.
    register_with_authorities. Continues Lotte and Omar's established
    informal jij/je register (per b1_unit01/02/04/05/06's precedent).
    No sibling-direction file (nl-en) was consulted -- only nl's own
    prior realization content (per CLAUDE.md's footgun: a past nl unit's
    own precedent, not a sibling-direction overlay, is fair game). All
    vocabulary, including basic function words, is introduced self-
    contained within this file, same convention as prior nl B1 units.
    word_order/translation exercises include a second natural word-order
    variant wherever Dutch genuinely allows adverbial-placement
    flexibility. Not yet reviewed -- status: unreviewed is accurate, a
    fresh-context review per AUTHORING_GUIDE.md §20 has not yet run
    against this file.

