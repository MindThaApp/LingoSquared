        teaching:
          - content_key: nl.a1.unit31.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                Omar en Fenna houden allebei van dieren, maar geen van
                beiden heeft een huisdier. Omar houdt van honden en
                Fenna houdt van katten. Sander heeft wel een huisdier:
                een kat. Hij speelt vaak met zijn kat en geeft de kat
                elke dag eten. Heb jij een huisdier?
