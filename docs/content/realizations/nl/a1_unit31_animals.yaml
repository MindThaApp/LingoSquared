course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte,
    Omar, Sander, Fenna, and Nina all use informal jij/je throughout
    this unit -- no formal u appears, matching every other A1 unit's
    register_policy. Hij/hem/ze are used for animals the same way they
    are used for people (a short grammar_note flags this explicitly the
    first time it happens, in lesson04).

