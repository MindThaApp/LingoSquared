generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is nl's B2
    abstraction unit (discussing abstract ideas and values). No adaptable
    intermediate/upper-intermediate public-domain Dutch source exists (the
    FSI Dutch Basic Course used for nl's A1/A2 is beginner-only), so this
    was built from general Dutch grammar/discourse knowledge, the same
    honest-disclosure precedent nl's earlier B1 and B2 units set.
    Sibling-isolation honored (STRONG form): the X->en B2 realization and
    every fa/prs/de B2 file were treated as non-existent and were NOT
    opened; only nl's OWN earlier realization content (the Lotte/Omar pair,
    and the b2_unit02 shape) was consulted for character canon and shape,
    which is not a sibling-direction violation. Lotte and Omar are an
    informal jij/je conversational pair with no pinned occupation in canon;
    here they debate an abstract everyday question (whether cities should
    become car-free), which introduces no canon conflict.
review:
  status: unreviewed
  required_next_reviewer: >-
    Native-Dutch confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) naturalness of every qualification frame in everyday
    informal Dutch -- tot op zekere hoogte, over het algemeen, in veel
    gevallen, niet per se, dat hangt ervan af, enerzijds...anderzijds -- and
    that the intended softening reads correctly to a native ear; (2)
    naturalness of the respond-to-opposing frames -- 'dat is waar, maar...';
    'ik snap je punt, toch...'; 'daar ben ik het (niet) mee eens, omdat...'
    -- and confirm 'daar ben ik het tot op zekere hoogte mee eens' (Omar,
    lesson06 dialogue) is natural word order for a qualified agreement; (3)
    the abstract-value nouns as used here read as current everyday Dutch:
    vrijheid, duurzaamheid, verantwoordelijkheid, het milieu, de
    samenleving; (4) that 'Steden moeten autovrij worden' / 'een autovrije
    stad' is the natural way to say cities/a city (becoming) car-free, and
    that 'gezonder', 'leefbaarheid'-adjacent framing is right; (5) the
    culminating writing exercise (lesson06 exercise06) is graded against a
    fixed two-sentence string with an internal comma in the first sentence
    -- four punctuation variants are supplied (comma present/absent x
    trailing period present/absent); decide whether a learner who drops the
    internal sentence-boundary period would still be within tolerance or
    whether more variants are needed; (6) confirm the certainty/qualification
    ordering taught here (an opinion frame + a qualifier that softens it, vs.
    a flat opinion) matches how a native would qualify an abstract opinion,
    and that Omar's position in lesson06 reads as a genuinely QUALIFIED
    disagreement (agrees to a point, but 'niet per se beter'), not a flat no.
  notes: >-
    nl B2 abstraction unit. Targets the CEFR B2 abstraction outcome
    (universal.b2.abstraction.discuss_abstract_ideas_and_values): give a
    QUALIFIED opinion on an abstract topic and respond directly to an
    opposing view, distinguishing a flat opinion from a qualified one and an
    agreement from a direct rebuttal. Theme: one coherent everyday abstract
    debate across all six lessons -- should cities become car-free
    (autovrij)? -- pitting freedom/convenience against
    sustainability/environment. Lesson arc: L01 opinion frames + the
    abstract-value vocabulary (ik vind dat / naar mijn mening / ik ben ervan
    overtuigd dat; vrijheid, duurzaamheid); L02 QUALIFICATION -- softening an
    opinion (tot op zekere hoogte, over het algemeen, in veel gevallen, niet
    per se, dat hangt ervan af); L03 RESPONDING to an opposing view (dat is
    waar, maar...; ik snap je punt, toch...; daar ben ik het (niet) mee eens,
    omdat...); L04 weighing two sides (enerzijds...anderzijds; voordeel,
    nadeel, samenleving); L05 a short opinion READING that states a qualified
    stance (author's stance + what they concede); L06 the culminating
    production -- a Lotte/Omar dialogue for the LISTENING requirement
    (identify each position + where they differ), a SPEAKING task (qualified
    opinion answering an opposing view), a WRITING task (qualified opinion
    responding to a stated opposing view), and a dialogue_response that
    directly answers a stated opposing view with a qualified opinion.
    Register: informal jij/je throughout, per the nl lane pin; Lotte and Omar
    continue their established informal register. All vocabulary is
    introduced self-contained within this file (each token is taught in this
    or an earlier lesson before it is tested). No sibling-direction file was
    consulted.

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Informal jij/je throughout (nl lane pin). B2 abstraction layers opinion
    frames, qualification frames, and respond-to-opposing frames onto that
    register -- ik vind dat, naar mijn mening, ik ben ervan overtuigd dat,
    tot op zekere hoogte, niet per se, dat is waar maar, ik snap je punt
    toch, daar ben ik het (niet) mee eens -- while keeping everyday informal
    address. Lotte and Omar continue the informal jij/je they use with each
    other.

