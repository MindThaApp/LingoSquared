    Teach contemporary Standard Dutch as used in the Netherlands. Nina,
    Omar, and Lotte are established taalcafe friends and use informal
    jij/je with each other throughout. Bram, the restaurant server,
    speaks in neutral, polite service language ("u"), consistent with
    unit50's pharmacist, unit51's hairdresser, unit52's bike-shop staff,
    unit53's launderette staff, and unit54's zwembad reception staff.

