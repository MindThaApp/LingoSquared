schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A2
generation_provenance:
  method: adapted_from_public_domain_source
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    The formal register-and-documents pattern for an official interview
    (asking for identification, stating how long you've lived
    somewhere, confirming an appointment) is scaffolded from the
    official-interactions module of the FSI Dutch Basic Course (Foreign
    Service Institute, US Department of State -- public domain, no
    attribution required per docs/content/AUTHORING_GUIDE.md §10). The
    source frames this around a 1960s-70s consular/immigration
    interview with no modern equivalent; the specific institutions,
    documents, and vocabulary here (gemeente registration, BSN,
    huurcontract, DigiD) reflect current 2020s Dutch civic
    administration and are freshly authored, not translated or lightly
    edited from the source.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: null
  notes: >-
    First Dutch A2 unit (spine outcome:
    universal.a2.bureaucracy.register_with_authorities, newly added to
    universal_spine.yaml this session), continuing the Lotte/Omar
    storyline -- now that Omar has a permanent address (unit18), he
    registers with the Utrecht gemeente. A2-level complexity
    deliberately exceeds A1: subordinate clauses (omdat/of), the polite
    conditional (zou ... kunnen/schikken), and indirect/formal
    questions (sinds wanneer, wat heb ik nodig om ...). The specific
    fact (living at the new address "sinds vorige maand") is stated
    consistently between lesson03's teaching example and lesson06's
    dialogue per AUTHORING_GUIDE §11. Every multi-clause
    accepted_answers list authored with period/comma/conjunction-joined
    forms per §12. Every fill_in_blank frame retains visible
    surrounding text per §13. A fresh-context review ran and found:
    lesson06's opening listening exercise was wired to the wrong audio
    asset (played "Wat heb ik nodig om me in te schrijven?" instead of
    the official's actual greeting) -- fixed with a new dedicated
    audio asset; lesson05's exercises had a listen_select sequenced
    after matching_pairs, breaking the recognition-before-drag rule --
    reordered; two lesson titles used informal "je" against this
    unit's own stated formal-register policy ("Wat heb je nodig?",
    "Je BSN-nummer") -- fixed to "Wat heeft u nodig?"/"Uw BSN-nummer";
    one listening exercise's audio ran longer than what it tested --
    tightened to match the full clip. No grammar errors, spine drift,
    jargon leaks, or YAML footguns found otherwise. Re-validated (0
    errors/0 warnings across the full nl course, including the real
    compile step). Additionally retrofitted per new AUTHORING_GUIDE
    §16 (found live 2026-07-06, Ramin's direct feedback):
    matching_pairs exercises across all 5 lessons expanded from 2-3
    pairs to 5-8 pairs each (the two lesson01 exercises, at 5 and 3
    pairs respectively, are capped by having no earlier lesson in the
    unit to pool vocabulary from -- lesson01's own vocabulary is the
    ceiling), pooling forward from each lesson's own vocabulary plus
    everything already taught earlier in the unit, never padding with
    untaught words. Lesson05's match_letter_points intentionally kept
    at 3 pairs -- it's a structural reading-comprehension check
    (matching parts of the letter to their function), not a vocabulary
    drill, so §16's density target doesn't apply the same way. Still
    needs Ramin's native-speaker pass before status: reviewed. Audio
    assets are declared for generation.

    2026-07-07 AUTHORING_GUIDE §17 pass (fill_in_blank/word_order
    true-synonym slots, found live from a real user report): lesson03's
    order_since_last_month ("Ik woon hier sinds vorige maand") only
    accepted that exact word order, but "Ik woon sinds vorige maand
    hier" is equally natural Dutch from the same word bank -- fixed by
    accepting both orderings. Swept the rest of this unit's
    fill_in_blank/word_order slots; none had a real equivalent-
    candidate issue. Re-validated/compiled clean.

    2026-07-07 AUTHORING_GUIDE §19 retrofit (units 21/22/23/24 batch):
    the unit's five vocabulary cards (lesson01's inschrijven, lesson02's
    paspoort/huurcontract/geboorteakte, lesson04's bsn) gained example
    sentence(s) built from this unit's own taught material, kept in the
    same formal (u/uw) register this unit's register_policy specifies
    for exchanges with the gemeente official; schema_version bumped to
    1.1 (missing examples are now a hard compiler error for this file).
    Example sentences are Claude-authored and pending fresh-context
    review.

    2026-07-10: second fresh-context review pass (Claude, zero access to
    the authoring reasoning above beyond reading this file's own review
    notes, sibling nl-en overlay not consulted). Independently re-verified
    every fix the prior pass claims is actually present in the file as
    written: lesson06 exercise01's listen_greeting is wired to
    waarmee_helpen.01 (the correct greeting clip, not the wat_heb_ik_nodig
    clip); lesson05's exercises have listen_select (ex04) sequenced
    before matching_pairs (ex05); every lesson01-06 teaching card and
    exercise consistently uses formal u/uw (no stray informal je/jij);
    the §19 vocabulary-example retrofit's examples correctly contain
    each card's target word and stay in the unit's formal register. Also
    independently checked (not just re-verified prior claims): no
    same-speaker-distractor collision in the lesson06 dialogue_
    comprehension exercises, matching_pairs shapes, a recursive
    yaml.safe_load boolean-coercion scan of this file and its overlay,
    and every exercise `type:` against `ExerciseRenderer.tsx`'s
    registered cases. Ran `scripts/compile_content.py validate` against
    the full a2_unit24-28 batch together: 0 errors, 0 warnings. Found no
    additional issues. Native-speaker review is still planned.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Omar
    and the gemeente official use the formal u throughout this unit --
    an official appointment always uses formal register, unlike Lotte
    and Omar's continued informal jij/je with each other in the
    surrounding storyline.

media_assets:
  - {content_key: nl.a2.audio.gemeente.afspraak_maken.01, language: nl, text: "Ik wil graag een afspraak maken om me in te schrijven.", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.gemeente.zou_schikken.01, language: nl, text: "Zou woensdag om tien uur schikken?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.gemeente.wat_heb_ik_nodig.01, language: nl, text: "Wat heb ik nodig om me in te schrijven?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - {content_key: nl.a2.audio.gemeente.waarmee_helpen.01, language: nl, text: "Goedemiddag, waarmee kan ik u helpen?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.gemeente.paspoort_huurcontract.01, language: nl, text: "U heeft een geldig paspoort en uw huurcontract nodig.", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.gemeente.sinds_wanneer.01, language: nl, text: "Sinds wanneer woont u op dit adres?", voice_hint: neutral_adult_polite, status: pending_generation}
  - {content_key: nl.a2.audio.gemeente.bsn_uitleg.01, language: nl, text: "Het BSN-nummer is uw persoonlijke nummer bij de overheid.", voice_hint: neutral_adult_polite, status: pending_generation}
  - content_key: nl.a2.audio.gemeente.brief.01
    language: nl
    text: >-
      Om u in te schrijven bij de gemeente heeft u de volgende
      documenten nodig: een geldig paspoort, uw huurcontract en,
      indien van toepassing, uw geboorteakte. Maak vooraf een
      afspraak. Na de inschrijving ontvangt u binnen enkele dagen uw
      BSN-nummer per post.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.gemeente_afspraak.01
    language: nl
    text: >-
      Ambtenaar: Goedemiddag, waarmee kan ik u helpen? Omar:
      Goedemiddag, ik heb een afspraak om me in te schrijven op mijn
      nieuwe adres. Ambtenaar: Mag ik uw paspoort en huurcontract
      zien, alstublieft? Omar: Alstublieft. Ik woon sinds vorige
      maand in Utrecht. Ambtenaar: Dank u wel. Alles is in orde. U
      ontvangt uw BSN-nummer binnen een paar dagen per post. Omar:
      Geweldig, dank u wel voor uw hulp!
    voice_hint: two_adults_formal_polite
    status: pending_generation

