  - {content_key: nl.a2.audio.reisvertraging.help_alternatief.01, language: nl, text: "Kunt u mij helpen met een alternatieve verbinding?", voice_hint: neutral_young_adult_friendly, status: pending_generation}
  - content_key: nl.a2.audio.reisvertraging.mededeling.01
    language: nl
    text: >-
      Belangrijke mededeling: door een seinstoring rijden er tussen
      Utrecht en Arnhem geen treinen. Reizigers kunnen omreizen via
      Amersfoort. De vertraging duurt tot ongeveer vijftien uur. Wij
      adviseren reizigers de reisplanner te raadplegen.
    voice_hint: neutral_adult_clear
    status: pending_generation
  - content_key: nl.a2.audio.reisvertraging.medewerker_open.01
    language: nl
    text: "NS, goedemiddag."
    voice_hint: neutral_adult_polite
    status: pending_generation
  - content_key: nl.a2.audio.dialogue.reisvertraging.01
    language: nl
    text: >-
      Medewerker: NS, goedemiddag. Waarmee kan ik u helpen? Lotte:
      Goedemiddag, mijn trein naar Arnhem is uitgevallen. Ik wil graag
      weten hoe ik daar nu kom. Medewerker: Er is inderdaad een
      seinstoring. U kunt omreizen via Amersfoort. Lotte: Hoe laat
      vertrekt die trein? Medewerker: Over tien minuten, van spoor
      vier. Lotte: Dank u wel. Ik stuur even een bericht dat ik later
      kom.
    voice_hint: two_adults_formal_polite
    status: pending_generation

