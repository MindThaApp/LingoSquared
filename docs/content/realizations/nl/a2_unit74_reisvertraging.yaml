schema_version: "1.1"
realization_version: "2026.1-draft.1"
target_language: nl
cefr_level: A2
generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  source_note: >-
    `firecrawl --status` was checked first per the standing instruction
    and confirmed still at 0/1000 credits for this cycle (same
    exhausted state noted by unit73's provenance note) -- no live
    search/scrape was attempted since it would fail immediately.
    Rather than skip the research step silently, the FSI Dutch Basic
    Course's own table of contents (already reviewed for units 01-73)
    was checked from memory of this session's earlier work and does
    not contain a travel-disruption/delay-specific lesson (its travel
    unit covers buying tickets and basic schedule questions only, the
    material nl a1_unit15_travel and a1_unit33_vervoer already draw
    on). This unit is therefore genuinely `ai_generated` from
    established modern Dutch conventions: NS (Nederlandse Spoorwegen)
    terminology for delays and disruptions (vertraging, uitvallen,
    seinstoring, aansluiting missen, omreizen, de servicebalie) is
    standard, current, real-world railway vocabulary any Dutch
    commuter would recognize, cross-checked against the author's own
    knowledge of NS's actual public announcement register rather than
    invented.
status: complete_draft
review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  reviewer_notes: >-
    Fresh-context review 2026-07-11 (AUTHORING_GUIDE §20). All mechanical
    sweeps clean: boolean-coercion type-walk, accepted_answers value-key
    shape, title<200, spine outcome existence (universal.a2.travel.
    handle_travel_disruption exists verbatim), no snake_case/jargon in
    any option/distractor/word_bank/correct_option value.
    listen_select/dialogue_comprehension distractors checked at the
    meaning level -- none is a line the tested speaker (NS medewerker)
    says or defensibly implies elsewhere in the clip. word_order/
    listen_order word_banks checked one by one for duplicate-token
    coverage -- all correct. FIXED 2026-07-31 (QA re-verification): lesson04's
    teach.via_amsterdam + order_via_amsterdam word_order previously taught/graded
    "U kunt met de intercity via Amsterdam reizen", contradicting this unit's
    whole scenario, which reroutes via AMERSFOORT (reading lesson05 + dialogue
    lesson06 + grammar note + writing, and lesson05 even lists Amsterdam as a
    WRONG distractor). Because lesson04's word_order actually grades production of
    that sentence, a learner was graded correct on a fact lesson05 grades as
    wrong -- a real cross-lesson contradiction, not just cosmetic. Switched the
    display text/tokens to Amersfoort in both the teach card and the word_order
    (realization + en-nl overlay); legacy content_key names (*_amsterdam) kept to
    avoid breaking references.
  notes: >-
    First of four new Dutch A2 units extending beyond
    universal_spine.yaml's original 6 base A2 outcomes (bureaucracy,
    opinions, banking, health, housing, employment -- all already
    covered by nl units 24-28/73). This unit realizes the new
    universal.a2.travel.handle_travel_disruption outcome, added to
    universal_spine.yaml in the same authoring pass as this file.
    Continues the Lotte/Omar storyline: Lotte is travelling by train to
    visit her parents when a signal failure disrupts her journey.
    Follows the established 6-lesson A2 pattern (four vocabulary-
    building lessons of 6-7 exercises each, one reading-comprehension
    lesson, one dialogue lesson) and every AUTHORING_GUIDE.md rule:
    recognition-before-production pacing (§2), formal u register for
    the institutional NS-employee exchange (§3), every vocabulary card
    carries a real example sentence (§19, schema_version 1.1 from
    first authoring rather than a later retrofit), every fill_in_blank
    frame keeps visible surrounding text (§13), every listen_select/
    listen_order/dialogue_comprehension exercise's media_asset_key
    text was cross-checked against its own tested_text before
    finalizing, and the lesson06 dialogue's sole listen_select
    distractor set was checked against every line the tested speaker
    (the NS employee) actually says elsewhere in the same dialogue
    clip, per the standing listening-integrity rule in CLAUDE.md.
    Cross-checked facts within the lesson (§11): the reading's
    "vijftien uur" delay-end estimate and the dialogue's "over tien
    minuten van spoor vier" departure are independent facts about
    different trains (the reading is a general public announcement,
    the dialogue is Lotte's specific rerouted connection) and are not
    meant to be the same figure -- confirmed there's no accidental
    contradiction between them. Pending the mandatory fresh-context
    review and Ramin's native-speaker pass; not yet compiled or
    imported.

course:
  realization_key: nl.a2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Lotte
    addresses the NS service-desk employee with formal u throughout
    this unit, the same institutional-register convention as units 24,
    26, 27, and 28.

