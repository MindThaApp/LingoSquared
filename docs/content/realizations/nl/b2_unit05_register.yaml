generation_provenance:
  method: ai_generated
  authoring_system: claude
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is nl's fifth
    B2 unit (register -- adapting formality to the audience). No adaptable
    intermediate/upper-intermediate public-domain Dutch source exists (the
    FSI Dutch Basic Course used for nl's A1/A2 is beginner-only), so this
    was built from general Dutch grammar/discourse knowledge, the same
    honest-disclosure precedent nl's earlier B1/B2 units set. Sibling-
    isolation honored: the X->en B2 register realization and every
    fa/prs/de B2 file were treated as non-existent and were NOT opened;
    only nl's OWN earlier realization content (the Lotte/Omar pair from
    a2_unit25_meningen) was consulted for character canon, which is not a
    sibling-direction violation. Lotte and Omar are an informal jij/je
    conversational pair with no pinned occupation in canon; here Lotte
    needs to reschedule an appointment and the unit renders that one
    request both informally (to her friend Omar) and formally (to an
    unnamed institutional official), which introduces no canon conflict.
    REGISTER SPECIAL CASE: unlike other units, this unit DELIBERATELY
    teaches BOTH registers side by side (informal jij/je/jou/jouw,
    imperative + kun je, alsjeblieft, Hoi/Groetjes vs formal u/uw, Zou u
    ... willen, Zou het mogelijk zijn, alstublieft, Geachte heer/mevrouw,
    Met vriendelijke groet, Hoogachtend). Each individual exercise keeps a
    single internally consistent register; the contrast lives across the
    exercise pairs, and the culminating exercise produces the SAME request
    in both.
review:
  status: reviewed
  required_next_reviewer: ramin_native_pass
  notes: >-
    Fifth Dutch B2 unit; first register unit. Targets the CEFR B2 register
    outcome (universal.b2.register.adapt_formality_to_audience): adapt
    formality to the audience -- deliver the same content appropriately to
    a close friend versus an institution. Theme: one everyday request --
    rescheduling an appointment -- rendered both ways across all six
    lessons. Lesson arc: L01 the jij<->u pronoun/verb shift (je/jij/jou/
    jouw vs u/uw; heb je -> heeft u, kun je -> kunt u); L02 greetings and
    closings (Hoi/Groetjes vs Geachte heer/mevrouw / Met vriendelijke groet
    / Hoogachtend); L03 directness -- informal imperative + kun je +
    alsjeblieft vs formal Zou u ... willen / Zou het mogelijk zijn +
    alstublieft; L04 the actual request (de afspraak verzetten) rendered
    informally and formally; L05 a reading requirement -- two messages,
    same content, different register, identify the audience of each; L06
    the culminating production -- a Lotte/Omar dialogue for the listening
    requirement (judge whether the register fits the situation and what a
    mismatch would signal), a speaking task delivering the SAME request
    once to a friend and once to an institution, a writing task rewriting
    the informal message as a formal one, and a culminating writing task
    producing the request in BOTH registers. Register: this unit teaches
    both; the recurring Lotte/Omar pair supply the informal side (their
    established informal jij/je from a2_unit25_meningen), the institutional
    side is formal to an unnamed official. All vocabulary is introduced
    self-contained within this file (B2 is a separate Course row, so a B2
    learner never sees A1/A2/B1 lexemes at runtime). No sibling-direction
    file was consulted.

    Native-pass priorities carried over from the draft review block:
    Native-Dutch confirmation needed. This is a DRAFT. Priority checks for
    the reviewer: (1) the u-conjugation forms -- confirm "u heeft/hebt", "u
    kunt", "u wilt" read as the natural forms for this register (u takes the
    3rd-person-like verb form) and that the sentences "Heeft u tijd?", "Kunt
    u helpen?", "Zou u het willen doen?", "Zou u zo vriendelijk willen
    zijn?" are all correct and natural; (2) the two full request frames --
    informal "Kunnen we de afspraak verzetten?" / "Kun je de afspraak
    verzetten?" and formal "Zou het mogelijk zijn om onze afspraak te
    verzetten?" -- confirm both are idiomatic and that "verzetten" is the
    everyday verb for rescheduling an appointment; (3) word order in "Ik kan
    maandag helaas niet." (lesson04 exercise07) -- confirm this is the
    natural placement of helaas, or whether "Helaas kan ik maandag niet." is
    preferred; (4) the greetings/closings ladder -- confirm Hoi/ Hé +
    Groetjes (informal), Beste + first name (neutral), Geachte heer/ mevrouw
    + Met vriendelijke groet (formal), and Hoogachtend (most formal) are
    ranked and used correctly, and that "Geachte heer/mevrouw," is the
    standard salutation when the recipient is unknown; (5) the culminating
    writing exercises (lesson06 exercise06 the informal->formal rewrite, and
    lesson06 exercise07 producing both registers) are graded against fixed
    strings -- every internal/trailing punctuation combination (comma after
    the salutation, question marks) is supplied as a separate accepted
    variant, so confirm no natural correct answer falls outside the supplied
    set; (6) confirm "schikken/schikt" (to suit / be convenient), "netjes"
    (properly/politely), "de gemeente", "een afspraak verzetten" and
    "mailen" all read as current everyday Dutch.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked
    every teaching card and exercise in this realization with its en-nl
    overlay (Dutch correctness, register consistency per exercise, accepted
    answers, distractors, dialogue cards vs the afspraak audio turns and
    speakers, Lotte/Omar canon, course-scoped vocabulary, dictation strings
    vs audio). Fixed: lesson05.exercise04.read_signal tested_text 'u' ->
    'Zou het mogelijk zijn' (the formal message contains no u/uw at all);
    lesson06.exercise01.comprehend_register_fit tested_text 'je' -> 'Hé
    Omar' (Lotte never says je in the audio; only Omar's generic 'schrijf
    je'). Matching overlay answer fixes are logged in the overlay notes.
    NATIVE-FLAG: 'Zou volgende week schikken' (no het) accepted alongside
    the het variants -- confirm.

course:
  realization_key: nl.b2
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    informal jij/je register (the nl lane default) and the formal u
    register, contrasting them. Each single exercise stays in one
    consistent register; the contrast is carried across exercise pairs and
    the culminating exercise. Informal: je/jij/jou/jouw, imperative and kun
    je, alsjeblieft, Hoi/Hé, Groetjes. Formal: u/uw with the 3rd-person-
    like verb (u heeft, u kunt, u wilt), Zou u ... willen, Zou het mogelijk
    zijn, alstublieft, Geachte heer/mevrouw, Met vriendelijke groet,
    Hoogachtend. Lotte and Omar keep the informal jij/je they use with each
    other in a2_unit25_meningen.

