            kind: phrase
            target: {text: "Lotte schrijft een bericht.", language_code: nl, direction: ltr}
            introduced_tokens: [Lotte, schrijft, schrijven, een, bericht]
          - content_key: nl.b2.unit05.lesson01.teach.je
            kind: vocabulary
            target: {text: "je / jij", language_code: nl, direction: ltr}
            introduced_tokens: [je, jij, jou, jouw, ik, schrijf]
            example: {text: "Ik schrijf jou een bericht.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit05.lesson01.teach.u
            kind: vocabulary
            target: {text: "u / uw", language_code: nl, direction: ltr}
            introduced_tokens: [u, uw]
            example: {text: "Ik schrijf u een bericht.", language_code: nl, direction: ltr}
          - content_key: nl.b2.unit05.lesson01.teach.heb_je
            kind: phrase
            target: {text: "Heb je even tijd?", language_code: nl, direction: ltr}
            introduced_tokens: [heb, hebben, tijd, even]
          - content_key: nl.b2.unit05.lesson01.teach.heeft_u
            kind: phrase
            target: {text: "Heeft u tijd?", language_code: nl, direction: ltr}
            introduced_tokens: [heeft]
          - content_key: nl.b2.unit05.lesson01.teach.kun_je
            kind: phrase
            target: {text: "Kun je helpen?", language_code: nl, direction: ltr}
            introduced_tokens: [kun, kunnen, helpen, helpt]
          - content_key: nl.b2.unit05.lesson01.teach.kunt_u
            kind: phrase
            target: {text: "Kunt u helpen?", language_code: nl, direction: ltr}
            introduced_tokens: [kunt]
          - content_key: nl.b2.unit05.lesson01.teach.grammar_jij_u
            kind: grammar_note
            target: {text: "Heb je tijd? Heeft u tijd? Kun je helpen? Kunt u helpen?", language_code: nl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: nl.b2.unit05.lesson01.exercise01.recognize_u
            type: multiple_choice
            tested_text: u
            prompt: {target_blocks: [{text: u, language_code: nl, direction: ltr}]}
          - content_key: nl.b2.unit05.lesson01.exercise02.listen_heeft_u
            type: listen_select
            tested_text: "Heeft u tijd"
            media_asset_key: nl.b2.audio.register.heeft_u_tijd.01
            prompt: {target_blocks: []}
          - content_key: nl.b2.unit05.lesson01.exercise03.match_pronouns
            type: matching_pairs
            tested_text: "je jou jouw u uw kun je kunt u tijd"
            prompt: {target_blocks: []}
            pairs:
              - {left: je, right: "you (informal, subject)"}
              - {left: jou, right: "you (informal, object)"}
              - {left: jouw, right: "your (informal)"}
              - {left: u, right: "you (formal)"}
              - {left: uw, right: "your (formal)"}
              - {left: "kun je", right: "can you (informal)"}
              - {left: "kunt u", right: "can you (formal)"}
              - {left: tijd, right: time}
          - content_key: nl.b2.unit05.lesson01.exercise04.order_heb_je
            type: word_order
            tested_text: "Heb je even tijd"
            prompt: {target_blocks: []}
            word_bank: [Heb, je, even, tijd]
          - content_key: nl.b2.unit05.lesson01.exercise05.translate_heeft_u
            type: translation
            tested_text: "Heeft u tijd"
            prompt: {target_blocks: [{text: "Translate into Dutch, formal (addressing the person as u): Do you have time?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit05.lesson01.exercise06.translate_kun_je
            type: translation
            tested_text: "Kun je helpen"
            prompt: {target_blocks: [{text: "Translate into Dutch, informal (addressing the person as je): Can you help?", language_code: en, direction: ltr}]}
          - content_key: nl.b2.unit05.lesson01.exercise07.speak_kunt_u
            type: speak_response
            tested_text: "Kunt u helpen"
