              - {left: Groetjes, right: "informal sign-off (cheers)"}
              - {left: "Geachte heer/mevrouw", right: "formal salutation (Dear Sir or Madam)"}
              - {left: "Met vriendelijke groet", right: "formal closing (kind regards)"}
