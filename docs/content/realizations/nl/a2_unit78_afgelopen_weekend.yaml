      - content_key: nl.a2.unit78.lesson06.lotte_en_omar_op_maandag
        title: "Lotte en Omar op maandag"
        spine_outcome_id: universal.a2.past.narrate_recent_weekend
        teaching:
          - {"content_key": "nl.a2.unit78.lesson06.teach.lotte_vraag", "kind": "dialogue", "target": {"text": "Hoi Omar! Wat heb je afgelopen weekend gedaan?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Lotte", "Hoi", "Omar", "Wat", "heb", "je", "afgelopen", "weekend", "gedaan"]}
          - {"content_key": "nl.a2.unit78.lesson06.teach.omar_zaterdag", "kind": "dialogue", "target": {"text": "Zaterdag ben ik naar mijn oom in Amsterdam gegaan. Ik heb bij mijn oom gegeten.", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Omar", "Zaterdag", "ben", "ik", "naar", "mijn", "oom", "in", "Amsterdam", "gegaan", "Ik", "heb", "bij", "gegeten"]}
          - {"content_key": "nl.a2.unit78.lesson06.teach.lotte_zondag", "kind": "dialogue", "target": {"text": "Leuk! En zondag?", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Lotte", "Leuk", "En", "zondag"]}
          - {"content_key": "nl.a2.unit78.lesson06.teach.omar_zondag", "kind": "dialogue", "target": {"text": "Zondag ben ik thuisgebleven. Ik heb lang geslapen en ik heb niet gesport. En jij?", "language_code": "nl", "direction": "ltr", "speaker": "Omar"}, "introduced_tokens": ["Omar", "Zondag", "ben", "ik", "thuisgebleven", "Ik", "heb", "lang", "geslapen", "en", "niet", "gesport", "En", "jij"]}
          - {"content_key": "nl.a2.unit78.lesson06.teach.lotte_antwoord", "kind": "dialogue", "target": {"text": "Ik ben naar mijn ouders gegaan. Ik heb geen boodschappen gedaan, maar ik heb gekookt.", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Lotte", "Ik", "ben", "naar", "mijn", "ouders", "gegaan", "heb", "geen", "boodschappen", "gedaan", "maar", "ik", "gekookt"]}
        exercises:
          - {"content_key": "nl.a2.unit78.lesson06.exercise01.listen_question", "type": "listen_select", "tested_text": "Hoi Omar Wat heb je afgelopen weekend gedaan", "media_asset_key": "nl.a2.audio.afgelopen_weekend.lotte_vraag.01", "prompt": {"target_blocks": []}}
