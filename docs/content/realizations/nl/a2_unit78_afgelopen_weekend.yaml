          - {"content_key": "nl.a2.unit78.lesson06.exercise06.respond_saturday_uncle", "type": "dialogue_response", "tested_text": "Zaterdag ben ik naar mijn oom gegaan", "prompt": {"target_blocks": [{"text": "Wat heb je afgelopen weekend gedaan?", "language_code": "nl", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit78.lesson06.exercise07.respond_no_sport", "type": "dialogue_response", "tested_text": "Nee ik heb niet gesport", "prompt": {"target_blocks": [{"text": "Heb je gesport?", "language_code": "nl", "direction": "ltr"}]}}
