          - {"content_key": "nl.a2.unit78.lesson06.exercise03.comprehend_sunday", "type": "dialogue_comprehension", "tested_text": "Zondag ben ik thuisgebleven Ik heb lang geslapen", "media_asset_key": "nl.a2.audio.dialogue.afgelopen_weekend.01", "prompt": {"target_blocks": [{"text": "What did Omar do on Sunday?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit78.lesson06.exercise04.comprehend_not_done", "type": "dialogue_comprehension", "tested_text": "Ik heb lang geslapen en ik heb niet gesport", "media_asset_key": "nl.a2.audio.dialogue.afgelopen_weekend.01", "prompt": {"target_blocks": [{"text": "Which of these things did Omar NOT do?", "language_code": "en", "direction": "ltr"}]}}
