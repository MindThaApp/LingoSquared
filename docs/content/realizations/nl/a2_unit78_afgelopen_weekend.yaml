        title: "Noors weekend"
        spine_outcome_id: universal.a2.past.narrate_recent_weekend
        teaching:
          - {"content_key": "nl.a2.unit78.lesson05.teach.noor_bericht", "kind": "reading", "target": {"text": "Hoi Lotte! Het is een rustig weekend geweest. Zaterdagochtend ben ik naar de markt gegaan en heb ik brood gekocht. 's Middags heb ik in het park gewandeld. 's Avonds heb ik gekookt. Ik heb niet gesport en ik heb geen film gezien. Zondag ben ik thuisgebleven. Ik heb lang geslapen en een boek gelezen.", "language_code": "nl", "direction": "ltr"}, "introduced_tokens": ["Hoi", "Lotte", "Het", "is", "een", "rustig", "weekend", "geweest", "Zaterdagochtend", "ben", "ik", "naar", "de", "markt", "gegaan", "en", "heb", "brood", "gekocht", "'s", "Middags", "in", "het", "park", "gewandeld", "Avonds", "gekookt", "Ik", "niet", "gesport", "geen", "film", "gezien", "Zondag", "thuisgebleven", "lang", "geslapen", "boek", "gelezen"]}
        exercises:
          - {"content_key": "nl.a2.unit78.lesson05.exercise01.read_saturday_morning", "type": "reading_comprehension", "tested_text": "Zaterdagochtend ben ik naar de markt gegaan", "prompt": {"target_blocks": [{"text": "Where did Noor go on Saturday morning?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit78.lesson05.exercise02.read_not_done", "type": "reading_comprehension", "tested_text": "Ik heb niet gesport en ik heb geen film gezien", "prompt": {"target_blocks": [{"text": "Which two things did Noor not do?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "nl.a2.unit78.lesson05.exercise03.read_sunday", "type": "reading_comprehension", "tested_text": "Zondag ben ik thuisgebleven Ik heb lang geslapen en een boek gelezen", "prompt": {"target_blocks": [{"text": "What did Noor do on Sunday?", "language_code": "en", "direction": "ltr"}]}}
