          - {"content_key": "nl.a2.unit78.lesson05.exercise05.match_noor_weekend", "type": "matching_pairs", "tested_text": "zaterdagochtend middags avonds zondag niet gesport geen film gezien", "prompt": {"target_blocks": []}, "pairs": [{"left": "zaterdagochtend", "right": "went to the market and bought bread"}, {"left": "'s middags", "right": "walked in the park"}, {"left": "'s avonds", "right": "cooked"}, {"left": "zondag", "right": "stayed at home, slept and read"}, {"left": "niet gesport", "right": "did not exercise"}, {"left": "geen film gezien", "right": "did not see a film"}]}
