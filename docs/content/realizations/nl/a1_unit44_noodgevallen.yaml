course:
  realization_key: nl.a1
  target_language_first: true
  dialect: nl_NL_standard
  register_policy: >-
    Teach contemporary Standard Dutch as used in the Netherlands. Nina,
    Lotte, Omar, and Sander are all established taalcafé friends and use
    informal jij/je with each other throughout this unit. The library
    staff member's announcement is a public imperative addressed to the
    whole room, not a one-on-one exchange, so no formal u is needed
    anywhere in this unit.

