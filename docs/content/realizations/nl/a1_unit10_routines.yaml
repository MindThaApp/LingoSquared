    language: nl
    text: >-
      Lotte: Hoe ziet jouw dag eruit, Omar? Omar: Ik sta om half acht op.
      Daarna kleed ik me aan en om acht uur ontbijt ik. Lotte: Hoe laat werk
      je? Omar: Ik werk van negen uur tot vijf uur. Om half zeven 's avonds eet ik.
      Daarna was ik af. Om elf uur slaap ik. En jij? Lotte: Ik sta om zes
      uur op, maar ik ontbijt pas om half zeven.
    voice_hint: two_young_adults_neutral_friendly
