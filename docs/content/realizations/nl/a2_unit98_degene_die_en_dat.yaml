          - {"content_key": "nl.a2.unit98.lesson06.exercise06.translate_man_jas", "type": "translation", "tested_text": "Een man die in de winkel werkt vond een blauwe jas", "prompt": {"target_blocks": [{"text": "A man who works in the shop found a blue jacket.", "language_code": "en", "direction": "ltr"}]}}
