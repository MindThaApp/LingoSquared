          - {"content_key": "nl.a2.unit98.lesson06.teach.lotte_dank", "kind": "dialogue", "target": {"text": "Echt? Dank je, Omar! Dan ga ik naar de winkel.", "language_code": "nl", "direction": "ltr", "speaker": "Lotte"}, "introduced_tokens": ["Echt", "Dank", "Dan", "ga", "naar"]}
