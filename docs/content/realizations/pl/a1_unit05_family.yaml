  required_next_reviewer: "codex"
  notes: >-
    Fifth Polish unit, continuing directly from pl/a1_unit04_time.yaml
    (same Ewa/Marek characters, same formal pan/pani narration register,
    same 3-lesson bootstrap pace -- task instructions explicitly asked to
    match units 01-04's size, not nl's later-grown 6-lesson depth for its
    own family unit). Realizes universal.a1.family.describe_relationships
    -- confirmed the next A1 outcome in spine order after
    time.ask_tell_time via docs/content/universal_spine.yaml's own linear
    ordering (greetings -> introductions -> numbers -> dates -> time ->
    family -> food -> ...). Checked nl/a1_unit05_family.yaml (the
    reference language) for the topic precedent: nl's own unit05 is also
    "family," confirming this is the correct next outcome rather than a
    language-specific ordering choice (fa/prs realized family earlier,
    as unit03/unit04 respectively, but their own course order diverges
    from spine order in several other places too, same as noted in
    unit04's own review note -- nl and this pl course both track the
    spine file's own linear order exactly). nl's realization was
    consulted only for the topic/outcome confirmation and general
    structural shape (how many lessons a family unit typically needs,
    general progression from immediate to extended family to a
    dialogue); no nl sentence text, character names, or scenario details
    were reused -- pl's own Ewa/Marek characters and every Polish
    sentence are freshly authored per spine outcome rules on
    structurally-identical-content being a validation failure.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence.
    Zero listen_type/listen_select/listen_order exercises anywhere in
    this file, matching unit01-04's own established choice for this
    corpus -- pl has real Google Cloud TTS (pl-PL-Wavenet-F) live, so
    audio-dependent exercises are no longer blocked by AUTHORING_GUIDE
    §14's concern, but this file stays consistent with the precedent
    unit01-04 already set (every exercise uses a real visible text
    prompt) rather than introducing the first audio-dependent exercise
    unilaterally in the same pass as a brand-new grammar topic -- a
    future dedicated audio-authoring pass remains a real, cheap
    opportunity now that TTS is wired. media_assets is therefore an
    empty list, not an oversight. dialogue_comprehension exercises in
    lesson03 render via the same MultipleChoice component as
    multiple_choice/listen_select (frontend/src/components/exercises/
    ExerciseRenderer.tsx) and are given real target_blocks text instead
    of a media_asset_key, matching unit01-04's own pattern.

    Cross-file vocabulary note (confirmed every prior unit hit this
    too): every word this file reuses from unit01/02/03/04 (Ewa, Marek,
    twój, masz, Mam, mieszka pattern via Warszawie precedent, Czy, Tak,
    A, ty, i as a standalone conjunction) is re-declared via this file's
    OWN introduced_tokens before being tested in this file's own
    exercises -- the compiler validates untaught vocabulary per
    realization FILE, not per course, so no cross-file credit is given
    even for words already taught in an earlier unit of the same course.

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02/03/04
    (.firecrawl/fsi-polish-fast.pdf / .txt). Real source vocabulary
    directly confirmed and used here, modernized per §10 (adapted into
    fresh sentences, never copied verbatim): the full "mieć" (to have)
    present-tense conjugation table (mam, masz, ma, mamy, macie, mają;
    p.111) -- this unit only actively teaches the 1st/3rd-person forms
    mam/ma (plus reuses masz, already taught in unit02 for asking age),
    following the source's own stated pedagogical approach elsewhere in
    the course ("let's concentrate on nos. 1 and 3"); a direct
    core-family-vocabulary drill list naming brat, ojciec, dziadek,
    wujek, matka, ciotka, siostra, babcia together (pp.415-416) --
    exactly the eight words this unit's lesson01/lesson02 teach; a real
    worked mieć+accusative exchange, "Państwo mają jeszcze syna? Nie,
    mamy jeszcze jedną córkę" (p.196), independently confirming both
    syn/córka as vocabulary AND the syn->syna / córka->córkę
    accusative-case pattern this unit's grammar note teaches (this
    exact source example is what confirms the pattern is real, not
    guessed -- the sentence itself was not reused); "Moi rodzice
    obchodzą rocznicę ślubu" (pp.444-447), confirming the exact fixed
    phrase "Moi rodzice" (the irregular masculine-personal-plural
    possessive form used before rodzice) this unit's lesson01 uses; and
    the Language Notes section's own introductory example "W Bostonie
    mieszka moja matka" (p.7), confirming matka + moja + mieszka as an
    authentic combination (adapted into this unit's own, differently
    structured sentences, not copied).

    Honestly disclosed as NOT source-confirmed, freely authored from
    general knowledge of modern spoken Polish (same standard as every
    prior unit's disclosed gaps): rodzina (family) itself never appears
    as Polish vocabulary anywhere in the source's ~17,000 lines (grepped
    for the "rodzin" stem specifically, not just casual reading -- the
    only hits are "urodziny," birthday, an unrelated word that happens
    to contain the same substring); lub, tylko, gdzie, on/ona, Ja, Fajna
    (all freshly authored, ordinary A1-safe vocabulary); the whole
    lesson03 Ewa/Marek dialogue scenario and its specific facts (Marek
    has only a sister who lives in Kraków; Ewa has a brother in Gdańsk
    and a sister, plus a son and daughter for Ewa's brother) are
    original, freshly authored, continuing the established characters'
    register from unit03/04's closing dialogues. The source's own
    mąż/żona (husband/wife) vocabulary (confirmed present, pp.15/16
    area) was deliberately NOT included in this unit -- kept to the
    spine outcome's own "close family members" can_do scope (parents,
    siblings, grandparents, aunts/uncles, children) at the same tight
    pace as unit01-04, not because the source lacks it.

    Cross-checked against unit01-04 per AUTHORING_GUIDE §11: this unit's
    facts (Marek has no brother, only a sister; Ewa has both a brother
    and a sister) are stated consistently across every teaching card,
    exercise, and the matching_pairs/dialogue_comprehension exercises in
    lesson03 -- no exercise anywhere asks the learner to reconcile a
    fact this file doesn't itself establish.

