            word_bank: [To, jest, właśnie, problem]
          - content_key: pl.b2.unit03.lesson04.exercise05.translate_pseudo_cleft
            type: translation
            tested_text: "To, co dobre, to muzyka"
            prompt: {target_blocks: [{text: "Translate into Polish, using the focus frame to, co ... to ...: What is good, is the music.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson04.exercise06.write_jak_najbardziej
            type: writing_prompt
            tested_text: "Film jest jak najbardziej dobry"
            prompt: {target_blocks: [{text: "Someone doubts the film is any good. Insist it is, using jak najbardziej (before 'dobry'): The film most certainly is good.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson04.exercise07.speak_cleft
            type: speak_response
            tested_text: "To właśnie muzyka sprawia, że film jest dobry"
            prompt: {target_blocks: [{text: "Say aloud in Polish, using the focus frame to właśnie ... sprawia, że to put focus on the music: It's precisely the music that makes the film good.", language_code: en, direction: ltr}]}

      - content_key: pl.b2.unit03.lesson05.recenzja
        title: "Recenzja"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: pl.b2.unit03.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                Nowy film jest według mnie trochę przewidywalny. Początek
                jest dość powolny. Ale muzyka jest naprawdę niesamowicie
                piękna. To właśnie muzyka ratuje ten film. Powiedziałbym,
                że film jest wart obejrzenia.
              language_code: pl
              direction: ltr
            introduced_tokens: [Nowy, przewidywalny, Początek, piękna, ratuje]
        exercises:
          - content_key: pl.b2.unit03.lesson05.exercise01.read_hedge
            type: reading_comprehension
            tested_text: "trochę przewidywalny"
            prompt: {target_blocks: [{text: "Which opinion does the writer HEDGE -- present tentatively rather than assert flatly?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson05.exercise02.read_hedge_words
            type: reading_comprehension
            tested_text: "według mnie trochę"
            prompt: {target_blocks: [{text: "Which words mark the writer's hedge about the film being predictable?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson05.exercise03.read_emphasis
            type: reading_comprehension
            tested_text: "naprawdę niesamowicie piękna"
            prompt: {target_blocks: [{text: "Which claim does the writer state most emphatically?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson05.exercise04.read_focus
            type: reading_comprehension
            tested_text: "to właśnie muzyka ratuje ten film"
            prompt: {target_blocks: [{text: "The writer uses the focus construction 'To właśnie muzyka ratuje ten film.' What does it single out?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson05.exercise05.match_reading
            type: matching_pairs
            tested_text: "nowy początek piękna ratuje wart obejrzenia"
            prompt: {target_blocks: []}
            pairs:
              - {left: nowy, right: new}
              - {left: początek, right: beginning}
              - {left: piękna, right: beautiful}
              - {left: ratuje, right: saves}
              - {left: przewidywalny, right: predictable}
              - {left: "wart obejrzenia", right: "worth watching"}
          - content_key: pl.b2.unit03.lesson05.exercise06.translate_poczatek
            type: translation
            tested_text: "Początek jest dość powolny"
            prompt: {target_blocks: [{text: "Translate into Polish, using dość: The beginning is fairly slow.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson05.exercise07.write_hedge_predictable
            type: writing_prompt
            tested_text: "Film jest według mnie trochę przewidywalny"
            prompt: {target_blocks: [{text: "Soften this blunt statement into a hedged one. Blunt: The film is predictable. Hedge it using według mnie (opening) and trochę: The film is, in my view, a bit predictable.", language_code: en, direction: ltr}]}

      - content_key: pl.b2.unit03.lesson06.niuanse_w_rozmowie
        title: "Niuanse w rozmowie"
        spine_outcome_id: universal.b2.discourse.express_nuance_with_hedging_and_emphasis
        teaching:
          - content_key: pl.b2.unit03.lesson06.teach.co_sadzisz_o_filmie
            kind: phrase
            target: {text: "Co sądzisz o filmie?", language_code: pl, direction: ltr}
            introduced_tokens: [Co, sądzisz, o, filmie]
          - content_key: pl.b2.unit03.lesson06.teach.fabula
            kind: vocabulary
            target: {text: "fabuła", language_code: pl, direction: ltr}
            introduced_tokens: [Fabuła, fabuła]
            example: {text: "Fabuła jest ciekawa.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit03.lesson06.teach.przewidywalna
            kind: vocabulary
            target: {text: "przewidywalna", language_code: pl, direction: ltr}
            introduced_tokens: [przewidywalna]
            example: {text: "Fabuła jest przewidywalna.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit03.lesson06.teach.tak
            kind: vocabulary
            target: {text: "Tak", language_code: pl, direction: ltr}
            introduced_tokens: [Tak]
            example: {text: "Tak, to prawda.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit03.lesson06.teach.zakonczenie
            kind: vocabulary
            target: {text: "zakończenie", language_code: pl, direction: ltr}
            introduced_tokens: [Zakończenie, zakończenie, przewidywalne]
            example: {text: "Zakończenie jest ciekawe.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit03.lesson06.teach.dialogue_ewa_ask
            kind: dialogue
            target: {text: "Co sądzisz o filmie?", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit03.lesson06.teach.dialogue_marek_hedge
            kind: dialogue
            target: {text: "Fabuła jest właściwie dość przewidywalna, według mnie.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit03.lesson06.teach.dialogue_ewa_emphasis
            kind: dialogue
            target: {text: "Tak, ale muzyka jest naprawdę niesamowicie piękna!", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit03.lesson06.teach.dialogue_marek_focus
            kind: dialogue
            target: {text: "To prawda. To właśnie muzyka ratuje ten film.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit03.lesson06.teach.dialogue_ewa_hedge
            kind: dialogue
            target: {text: "Powiedziałabym, że jest wart obejrzenia.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit03.lesson06.teach.dialogue_marek_absolutnie
            kind: dialogue
            target: {text: "Zdecydowanie!", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit03.lesson06.teach.grammar_niuanse
            kind: grammar_note
            target: {text: "Film jest dobry. Film jest według mnie właściwie dość dobry. Film jest naprawdę niesamowicie dobry.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit03.lesson06.exercise01.classify_hedge
            type: dialogue_comprehension
            tested_text: "właściwie dość przewidywalna"
            media_asset_key: pl.b2.audio.niuanse.dialogue.film_rozmowa.01
            prompt: {target_blocks: [{text: "Marek says the story is 'właściwie dość przewidywalna, według mnie'. Is he hedging, stating it neutrally, or emphasizing -- and what does that say about his commitment?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson06.exercise02.classify_emphasis
            type: dialogue_comprehension
            tested_text: "naprawdę niesamowicie piękna"
            media_asset_key: pl.b2.audio.niuanse.dialogue.film_rozmowa.01
            prompt: {target_blocks: [{text: "How does Ewa present her claim about the music ('muzyka jest naprawdę niesamowicie piękna')?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson06.exercise03.classify_focus
            type: dialogue_comprehension
            tested_text: "to właśnie muzyka ratuje ten film"
            media_asset_key: pl.b2.audio.niuanse.dialogue.film_rozmowa.01
            prompt: {target_blocks: [{text: "What does Marek do with 'To właśnie muzyka ratuje ten film.'?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson06.exercise04.speak_same_hedged
            type: speak_response
            tested_text: "Film jest według mnie właściwie dość dobry"
            prompt: {target_blocks: [{text: "Deliver the claim 'The film is good' as a HEDGE that lowers your commitment. Use według mnie (opening), then właściwie dość: The film is, in my view, actually quite good.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson06.exercise05.speak_same_emphatic
            type: speak_response
            tested_text: "Film jest naprawdę niesamowicie dobry"
            prompt: {target_blocks: [{text: "Now deliver the SAME claim as an EMPHATIC statement that raises your commitment, using naprawdę niesamowicie: The film is really incredibly good.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson06.exercise06.write_both_ways
            type: writing_prompt
            tested_text: "Zakończenie jest trochę przewidywalne. Zakończenie jest naprawdę bardzo przewidywalne."
            prompt: {target_blocks: [{text: "Write the SAME claim about the ending TWO ways, changing only the nuance, not the content. (1) HEDGED, lowering commitment, using trochę: The ending is a bit predictable. (2) EMPHATIC, raising commitment, using naprawdę bardzo: The ending is really very predictable.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit03.lesson06.exercise07.respond_emphatic
            type: dialogue_response
            tested_text: "Muzyka jest naprawdę niesamowicie piękna"
            prompt: {target_blocks: [{text: "Co sądzisz o muzyce?", language_code: pl, direction: ltr}]}
