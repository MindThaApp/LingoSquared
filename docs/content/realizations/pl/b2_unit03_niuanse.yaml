generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's
    third B2 unit (discourse: hedging and emphasis). Same "no adaptable
    upper-intermediate public-domain Polish source exists" outcome as
    pl's earlier B2 units; built from established modern Polish
    grammar/discourse knowledge. Structural exemplar:
    docs/content/realizations/nl/b2_unit03_nuance.yaml, consulted ONLY
    for unit shape -- every Polish sentence below is authored fresh from
    Polish grammar. Focus constructions are NOT calqued from Dutch's
    "het is ... die" cleft (Polish has no direct cleft equivalent);
    instead this unit uses Polish's own genuine focus devices: "to
    właśnie X sprawia, że..." (it's precisely X that causes...), the
    pseudo-cleft "to, co ... to ..." ("what is ..., is ..."), and "jak
    najbardziej" (most certainly) for insistent confirmation. Character
    canon: Marek and Ewa continue from pl's B2 units 01-02 (grepped
    again before writing; no new facts introduced that would conflict).
review:
  status: "unreviewed"
  required_next_reviewer: >-
    Native-Polish confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) that every hedge reads as a genuine SOFTENER
    and every emphasis marker as a genuine STRENGTHENER to a native ear,
    and the intended stance ordering (hedge: właściwie / dość / trochę /
    raczej / według mnie / w pewnym sensie / wydaje się, że / powiedziałbym,
    że / chyba; emphasis: naprawdę / bardzo / niesamowicie / absolutnie /
    zdecydowanie + the focus devices); (2) naturalness of "to właśnie X
    sprawia, że..." and the pseudo-cleft "to, co dobre, to muzyka" --
    confirm these are genuinely idiomatic Polish focus constructions, not
    stilted; (3) whether "jak najbardziej" reads as a natural insistent
    confirmation in context; (4) the culminating writing exercise
    (lesson06 exercise06) is graded against a fixed two-sentence string --
    confirm the accepted-answer punctuation variants are complete; (5)
    confirm "wart obejrzenia", "wciągający" and "ratuje ten film" read as
    current everyday Polish film-review register.
  notes: >-
    Third Polish B2 unit; first discourse/nuance unit. Targets the CEFR
    B2 discourse outcome
    (universal.b2.discourse.express_nuance_with_hedging_and_emphasis):
    express nuance by softening or strengthening a statement -- hedging,
    qualification, emphasis and focus constructions -- so the SAME
    content can be delivered tentatively, neutrally, or emphatically.
    Theme: Marek and Ewa have seen a film and give their opinions of it,
    softening and strengthening the same claims. Lesson arc: L01 basic
    hedges that soften an opinion (właściwie / dość / trochę / raczej /
    według mnie); L02 more tentative framing (w pewnym sensie / wydaje
    się, że / powiedziałbym, że / zbyt); L03 emphasis and degree (naprawdę
    / bardzo / niesamowicie / absolutnie / zdecydowanie, and stacking
    them); L04 FOCUS constructions (to właśnie ... sprawia, że...; the
    pseudo-cleft to, co ... to ...; właśnie; jak najbardziej); L05 a
    reading that separates hedged claims from emphatic ones; L06 the
    culminating production -- a Marek/Ewa dialogue for the listening
    requirement (classify hedge / neutral / emphasis and what it implies
    about commitment), a speaking task that delivers the SAME claim once
    hedged and once emphasized, and a writing task that renders the SAME
    claim BOTH hedged AND emphasized. Register: informal ty throughout,
    per pl's established lane pin. All vocabulary is introduced
    self-contained within this file. No sibling-direction file (pl-en)
    was consulted.

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    Informal ty throughout (pl's established lane pin). B2 discourse
    layers hedging adverbs/phrases (właściwie, dość, trochę, raczej,
    według mnie, w pewnym sensie, wydaje się, że, powiedziałbym, że) and
    emphasis/focus devices (naprawdę, bardzo, niesamowicie, absolutnie,
    zdecydowanie, właśnie, to właśnie ... sprawia, że, jak najbardziej)
    onto that register, while keeping everyday informal address
    established for Marek and Ewa.

