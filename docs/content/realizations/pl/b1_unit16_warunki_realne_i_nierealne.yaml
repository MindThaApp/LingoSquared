      - content_key: pl.b1.unit16.lesson04.warunki_podsumowanie
        title: "Warunki -- podsumowanie"
        spine_outcome_id: universal.b1.hypotheticals.express_hypothetical_conditions
        teaching:
          - content_key: pl.b1.unit16.lesson04.teach.review_note
            kind: grammar_note
            target: {text: "Kontrast: 1) warunek realny -- \"jeśli\" + czas przyszły (Jeśli pogoda będzie dobra...), 2) warunek nierealny -- \"gdyby\" + forma na -ł + by (Gdybym miał więcej pieniędzy...), ta sama forma dla teraźniejszości i przeszłości -- rozróżnia ją tylko słowo takie jak \"wczoraj\".", language_code: pl, direction: ltr}
            introduced_tokens: ["masz", "na"]
        exercises:
          - content_key: pl.b1.unit16.lesson04.exercise01.select_jesli_pogoda_review
            type: multiple_choice
            tested_text: "Jeśli pogoda będzie dobra pojedziemy na wycieczkę rowerową"
            prompt: {target_blocks: []}
          - content_key: pl.b1.unit16.lesson04.exercise02.match_unit_review
            type: matching_pairs
            tested_text: "jeśli będzie gdyby miał kupiłbym gdybym wiedział zabrałbym wczoraj pieniędzy"
            prompt: {target_blocks: []}
            pairs:
              - {left: "Jeśli pogoda będzie dobra...", right: "If the weather is good... (real/possible)"}
              - {left: "Gdybym miał więcej pieniędzy...", right: "If I had more money... (unreal present)"}
              - {left: "Gdybym wiedział, że będzie padać...", right: "If I had known it would rain... (unreal past)"}
              - {left: "kupiłbym", right: "I would buy"}
              - {left: "zabrałbym", right: "I would have taken"}
              - {left: "wczoraj", right: "yesterday"}
          - content_key: pl.b1.unit16.lesson04.exercise03.order_gdybym_wiedzial_review
            type: word_order
            tested_text: "Gdybym wiedział że będzie padać zabrałbym parasol"
            prompt: {target_blocks: []}
            word_bank: ["Gdybym", "wiedział,", "że", "będzie", "padać,", "zabrałbym", "parasol."]
          - content_key: pl.b1.unit16.lesson04.exercise04.order_jesli_bedzie_padac_review
            type: word_order
            tested_text: "Jeśli będzie padać zostaniemy w domu"
            prompt: {target_blocks: []}
            word_bank: ["Jeśli", "będzie", "padać,", "zostaniemy", "w", "domu."]
          - content_key: pl.b1.unit16.lesson04.exercise05.fill_gdybym_review
            type: fill_in_blank
            tested_text: "Gdybym"
            prompt:
              target_blocks:
                - {text: "___ miał więcej pieniędzy, kupiłbym nowy rower.", language_code: pl, direction: ltr}
          - content_key: pl.b1.unit16.lesson04.exercise06.fix_jesli_bedzie_padac_review
