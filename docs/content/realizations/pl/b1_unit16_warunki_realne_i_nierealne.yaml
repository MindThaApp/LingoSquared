            introduced_tokens: ["Jeśli", "pogoda", "będzie", "dobra", "pojedziemy", "na", "wycieczkę", "rowerową"]
            example:
              {text: "W sobotę, jeśli pogoda będzie dobra, pojedziemy na wycieczkę rowerową.", language_code: pl, direction: ltr}
          - content_key: pl.b1.unit16.lesson01.teach.jesli_bedzie_padac
