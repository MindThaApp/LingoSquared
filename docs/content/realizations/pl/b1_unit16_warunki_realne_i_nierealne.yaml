          - content_key: pl.b1.unit16.lesson01.teach.warunek_realny_note
            kind: grammar_note
            target: {text: "Warunek realny/możliwy: \"jeśli\" + czas przyszły w OBU zdaniach -- bez cząstki \"by\". Opisuje coś, co naprawdę może się zdarzyć.", language_code: pl, direction: ltr}
            introduced_tokens: ["W", "sobotę", "Ale"]
