review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Sixteenth Polish B1 unit, continuing from pl/b1_unit15_codziennosc_w_
    pracy.yaml. Realizes universal.b1.hypotheticals.express_hypothetical_
    conditions (docs/content/universal_spine.yaml: "Express a real/possible
    future condition and its result, and contrast it with an unreal/
    counterfactual present-or-past condition and its result, using a
    conditional clause plus a matching result clause").

    Outcome-overlap check against pl's existing b1_unit01_warunki_
    hipotetyczne.yaml (required by dispatch): unit01 realizes the
    DIFFERENT spine outcome universal.b1.hypotheticals.express_
    hypothetical_conditions_with_conditional ("Express hypothetical or
    unreal situations and wishes using a conditional-mood construction
    together with an unreal if-clause... and use the conditional alone to
    soften a suggestion, request, or preference") -- unreal-only, plus a
    softening-register use of the bare conditional. This unit's outcome is
    genuinely distinct: it requires a REAL/possible FUTURE condition
    ("jeśli" + future/perfective-present tense in both clauses, no "by"
    particle at all) explicitly CONTRASTED against the unreal "gdyby"
    conditional, and further requires the unreal side to cover BOTH a
    present-unreal and a past-unreal reading -- unit01 never taught the
    real "jeśli"+future construction and never distinguished present- from
    past-unreal reference. Lesson01 of this unit opens with the real
    conditional precisely because unit01 skipped it; lesson02 reuses
    unit01's by-conditional morphology but adds a genuinely new point:
    Polish's gdyby-clause is TENSE-NEUTRAL (the identical "gdybym + verb"
    form covers both "if I had [more money now]" and "if I had known
    [yesterday]"), distinguished only by a context adverb (teraz/wcześniej/
    wczoraj) -- a fact unit01 never addressed since it only used
    present-unreal wishes.

    Grammar step-up, deliberate and disclosed: (1) real/possible future
    condition "jeśli" + perfective present-as-future in BOTH clauses
    ("Jeśli pogoda będzie dobra, pojedziemy na wycieczkę rowerową" -- no
    "by" particle, a genuinely different construction from the unreal
    one); (2) unreal present "gdyby" + L-participle + by ("Gdybym miał
    więcej pieniędzy, kupiłbym nowy rower"); (3) unreal past, same
    gdyby-morphology, disambiguated only by context adverbs ("Gdybym
    wczoraj wiedział, że będzie padać, zabrałbym parasol" -- the embedded
    "że będzie padać" also demonstrates this course's own established
    no-tense-backshift rule from b1_unit05, future tense retained under
    "wiedział, że").

    Scenario: continues the established Ewa/Marek informal ty-register
    storyline (pl A1-A2, and continued through b1_unit01/05 etc.). A
    single continuous weekend-bike-trip planning theme runs through all
    four lessons -- deliberately NOT unit01's money/career/city-move
    premises, to keep the two units' example sentences non-overlapping
    even though both units touch conditional grammar. Marek's own
    hypothetical statements use masculine forms (miał, kupiłbym, wiedział,
    zabrałbym); Ewa's own statements use feminine forms where she speaks
    about herself (miała, jeździłabym).

    Case notes threaded through: "starczy/zdążę" not used here (reserved
    for unit17); "na wycieczkę rowerową" (accusative, direction/goal of
    motion verb), "więcej pieniędzy/czasu" (genitive after "więcej"),
    "z pracy" not used here. Aspect notes: "pojedziemy"/"kupię"/"zabrałbym"
    are all perfective (single bounded future/hypothetical event);
    "jeździłabym" is imperfective (habitual repeated action), a
    deliberate minimal pair with unit01's own perfective "pojechałbym"
    (a one-time hypothetical move).

    Character canon check (item 6): grepped pl/b1_unit01-15 before
    writing. No fact about Ewa or Marek is contradicted -- their
    established informal ty register, and Marek's engineer occupation
    (never mentioned in this unit), are left untouched. No new characters
    introduced.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says in the
    same dialogue -- no distractor restates the fact under test using the
    same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the bike-trip plan (Saturday,
    weather-dependent), Marek's wished-for new bike, and his forgotten
    umbrella from the previous rainy day are each stated exactly once and
    never contradicted elsewhere in the file.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, same standing outage noted in CLAUDE.md). No public-domain
    intermediate Polish course exists to adapt from (same "no intermediate
    volume exists" outcome every prior pl B1 unit has hit). Authored from
    established modern Polish grammar conventions, double-checked against
    standard Polish reference grammar (real vs. unreal conditional
    morphology, tense-neutrality of gdyby) before writing any example
    sentence.

    Cross-file vocabulary note: every word this file's exercises test,
    including basic recap words (jeśli, będzie, pogoda, mam, mieć),
    is redeclared via this file's own lesson01 recap card, per the
    compiler's per-FILE untaught-vocabulary check -- this file does not
    rely on any other pl file having been compiled first. Pending
    fresh-context review per AUTHORING_GUIDE #9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson04.exercise07.write_warunki_podsumowanie -- removed the
    English free-production prompt block ('write ... about your own
    weekend plans') that contradicted the overlay's fixed translation
    instruction and exact-string key (underdetermined prompt; also
    English text tagged language_code pl). Other overlay-side fixes are
    recorded in the en-pl overlay. NATIVE CHECK: dialogue line06 'Tak,
    zmokłeś zupełnie!' -- adverb placement ('zupełnie zmokłeś' may be
    more natural).

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

course:
