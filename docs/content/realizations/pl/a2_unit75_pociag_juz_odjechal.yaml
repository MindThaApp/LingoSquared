          - {"content_key": "pl.a2.unit75.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Dlaczego się spóźniłeś Pociąg już odjechał Dlaczego wyszedłeś z domu za późno Wcześniej zgubiłem bilet Szukałem biletu w domu Szkoda Czy czekasz na następny pociąg Kupiłem kawę", "prompt": {"target_blocks": []}, "pairs": [{"left": "Dlaczego się spóźniłeś?", "right": "Why are you late?"}, {"left": "Pociąg już odjechał.", "right": "The train had already left."}, {"left": "Dlaczego wyszedłeś z domu za późno?", "right": "Why did you leave the house too late?"}, {"left": "Wcześniej zgubiłem bilet.", "right": "I had lost my ticket earlier."}, {"left": "Szukałem biletu w domu.", "right": "I looked for the ticket at home."}, {"left": "Szkoda!", "right": "What a pity!"}, {"left": "Czy czekasz na następny pociąg?", "right": "Are you waiting for the next train?"}, {"left": "Kupiłem kawę.", "right": "I bought a coffee."}]}
          - {"content_key": "pl.a2.unit75.lesson06.exercise04.ordena_dialogo", "type": "word_order", "tested_text": "Marek zgubił bilet i szukał biletu w domu", "prompt": {"target_blocks": []}, "word_bank": ["Marek", "zgubił", "bilet", "i", "szukał", "biletu", "w", "domu"]}
