          - {"content_key": "pl.a2.unit75.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Szkoda! Czy czekasz na następny pociąg?", "language_code": "pl", "direction": "ltr", "speaker": "Ewa"}, "introduced_tokens": ["Szkoda", "Czy", "czekasz", "na", "następny", "pociąg"]}
          - {"content_key": "pl.a2.unit75.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Tak, czekam. Po tym jak pociąg odjechał, kupiłem kawę.", "language_code": "pl", "direction": "ltr", "speaker": "Marek"}, "introduced_tokens": ["Tak", "czekam", "Po", "tym", "jak", "pociąg", "odjechał", "kupiłem", "kawę"]}
