          - {"content_key": "pl.a2.unit75.lesson05.exercise02.lee_kawa", "type": "reading_comprehension", "tested_text": "Po tym jak pociąg odjechał kupiłem kawę", "prompt": {"target_blocks": [{"text": "What did Marek do after the train left?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit75.lesson05.exercise03.une_czytanka", "type": "matching_pairs", "tested_text": "Dzisiaj spóźniłem się na pociąg Wyszedłem z domu za późno Wcześniej zgubiłem bilet Szukałem biletu w domu Pociąg już odjechał Kupiłem kawę Teraz czekam na następny pociąg", "prompt": {"target_blocks": []}, "pairs": [{"left": "Dzisiaj spóźniłem się na pociąg.", "right": "Today I missed the train."}, {"left": "Wyszedłem z domu za późno.", "right": "I left the house too late."}, {"left": "Wcześniej zgubiłem bilet.", "right": "I had lost my ticket earlier."}, {"left": "Szukałem biletu w domu.", "right": "I looked for the ticket at home."}, {"left": "Pociąg już odjechał.", "right": "The train had already left."}, {"left": "Kupiłem kawę.", "right": "I bought a coffee."}, {"left": "Teraz czekam na następny pociąg.", "right": "Now I am waiting for the next train."}]}
          - {"content_key": "pl.a2.unit75.lesson05.exercise04.ordena_czytanka", "type": "word_order", "tested_text": "Pociąg już odjechał kiedy Marek dojechał na dworzec", "prompt": {"target_blocks": []}, "word_bank": ["Pociąg", "już", "odjechał", "kiedy", "Marek", "dojechał", "na", "dworzec"]}
          - {"content_key": "pl.a2.unit75.lesson05.exercise05.traduce_czytanka", "type": "translation", "tested_text": "Wyszedłem z domu za późno bo wcześniej zgubiłem bilet", "prompt": {"target_blocks": [{"text": "I left the house too late because I had lost my ticket earlier.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit75.lesson05.exercise06.dicta_pociag", "type": "dictation", "tested_text": "Pociąg już odjechał.", "media_asset_key": "pl.a2.audio.pociag_juz_odjechal.pociag_juz_odjechal.01", "prompt": {"target_blocks": []}}
