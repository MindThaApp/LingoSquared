  notes: >-
    Seventh Polish unit, continuing directly from pl/a1_unit06_food.yaml
    (same Ewa protagonist, same formal pan/pani register in service
    encounters, same 3-lesson bootstrap pace -- task instructions
    explicitly asked to match units 01-06's size, not nl's later-grown
    6-lesson depth for its own shopping unit). Realizes
    universal.a1.shopping.ask_prices_quantities -- confirmed the next A1
    outcome in spine order after food.order_simple_meal via
    docs/content/universal_spine.yaml's own linear ordering (greetings ->
    introductions -> numbers -> dates -> time -> family -> food ->
    shopping -> ...), matching this file's own unit06 notes. Checked
    nl/a1_unit07_shopping.yaml (also realizes this exact outcome as its
    own unit07, a market-shopping scene) purely to confirm the
    topic/outcome match, not for any sentence text, character, or
    scenario reuse -- nl's file has since grown to 6 lessons with real
    audio assets, which this file deliberately does NOT match in size,
    per the standing "3-lesson bootstrap pace" instruction for this
    course; only the topic identity was confirmed. fa/a1_unit07 realizes
    a different outcome (weather) as its own unit07 -- language packs are
    not required to hit the same spine outcome at the same unit number,
    so this was expected, not a discrepancy to resolve.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence.
    Zero listen_type/listen_select/listen_order exercises anywhere in
    this file, matching unit01-06's own established choice for this
    corpus -- pl has real Google Cloud TTS (pl-PL-Wavenet-F) live, so
    audio-dependent exercises are no longer blocked by AUTHORING_GUIDE
    §14's concern, but this file stays consistent with the precedent
    unit01-06 already set (every exercise uses a real visible text
    prompt) rather than introducing the first audio-dependent exercise
    unilaterally in the same pass as new vocabulary -- a future dedicated
    audio-authoring pass remains a real, cheap opportunity now that TTS is
    wired. media_assets is therefore an empty list, not an oversight.
    lesson03's dialogue_comprehension exercises render via the same
    MultipleChoice component as multiple_choice/listen_select
    (frontend/src/components/exercises/ExerciseRenderer.tsx) and are
    given real target_blocks text instead of a media_asset_key, matching
    unit01-06's own pattern.

    Cross-file vocabulary note (confirmed every prior unit hit this
    too): every word this file reuses from unit01/02/06 (Dzień dobry, Co,
    pani, A, ale, Dobrze, Proszę, bardzo) is re-declared via this file's
    OWN introduced_tokens before being tested in this file's own
    exercises -- the compiler validates untaught vocabulary per
    realization FILE, not per course, so no cross-file credit is given
    even for words already taught in an earlier unit of the same course.
    All Polish inflected surface forms (banany, bananów, pomidory,
    pomidorów, ziemniaków) are treated by the compiler's tokenizer as
    distinct tokens from their base/dictionary form and were each
    declared separately at first use, same discipline unit06 already
    applied to kawa/kawę and zupa/zupę.

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02-06
    (.firecrawl/fsi-polish-fast.pdf / .txt). Real source vocabulary and
    a real source dialogue scene directly confirmed and used here,
    modernized per §10 (adapted into fresh sentences and current
    round-number post-1995-redenomination złoty prices, never copied
    verbatim): the produce-market unit (pp.156-163, "Seeing It" /
    "Taking It Apart") directly confirms banany (bananas), pomidory
    (tomatoes), tanio (cheap), drogo (expensive), kupić (to buy), trochę
    (a bit), warto (worth it), weźmie/wezmę (future of wziąć, take),
    więcej (more), razem (together/total), dla (for), and pani płaci
    (you pay) as real source vocabulary, and its own worked dialogue
    ("A ile kosztują banany?" / "Dwanaście tysięcy złotych kilo,
    pomidory dziesięć." / "Trochę drogo." / "Drogo, ale kupić warto. To
    ile pani weźmie?" / "Proszę bardzo: banany ... Razem ...") directly
    confirms both this unit's "Ile kosztują + plural noun?" question
    pattern and the source's own idiomatic elliptical price-per-kilo
    construction ("[liczba] złotych kilo", adapted here to modern
    round prices like "Pięć złotych kilo" rather than the source's own
    pre-redenomination four/five-digit figures); a separate substitution
    drill (p.417-418, "Follow the patterns... kilo, słoik, główkę")
    directly confirms ziemniak (potato), ogórek (cucumber), grejpfrut
    (grapefruit), cebula (onion), and the exact "Proszę kilo
    ziemniaków."/"Proszę pół kilo sera." genitive-after-kilo construction
    this unit's lesson02 grammar note teaches (adapted here to the three
    regular masculine -ów nouns banan/pomidor/ziemniak rather than the
    source's own mixed masculine/feminine set, a deliberate A1
    simplification disclosed below); a further drill (p.15846 area)
    independently confirms kilogram + genitive with pomarańcz(y) (oranges)
    as its own real example, confirming pomarańcza as real source
    vocabulary; mandarynka (tangerine) is confirmed via the same
    exercise's own "kilogram mandarynek" prompt line. "Poproszę" (a more
    polite future-tense variant of proszę) is directly confirmed via "Za
    kawior dziękuję, nie wezmę. Poproszę tylko o dwa kilo pomidorów..."
    (p.7053 area) in the same market-scene family, used here the same
    way -- a polite ordering opener before a kilo quantity.

    Honestly disclosed as NOT source-confirmed, freely authored from
    general knowledge of modern spoken Polish (same standard as every
    prior unit's disclosed gaps): "świeże" (fresh) as its own standalone
    taught vocabulary card is a natural, ordinary A1 adjective a market
    vendor would use, though the source itself only ever uses it
    adjoined to a noun ("pomidory świeże") rather than teaching it in
    isolation; the specific modern round-number złoty prices in this
    unit (5 złotych/kilo for bananas, 8 złotych/kilo for tomatoes, 9
    złotych total) are freely authored post-1995-redenomination figures,
    since the source's own prices are in the pre-1995 currency (tens of
    thousands of złotych per item) and would be actively misleading if
    reused as-is -- this is the modernization pass §10 requires, not a
    disclosed gap in the ordinary sense, but flagged here for
    transparency about where the specific numbers came from. The
    genitive-after-"kilo" grammar note is deliberately narrowed to only
    the three regular masculine-inanimate -ów nouns already taught in
    this unit (banan, pomidor, ziemniak) rather than also covering
    feminine mass nouns like the source's own "cebuli"/"sera" (genitive
    singular, a different declension pattern entirely) -- an intentional
    A1 scope decision to keep one consistent, teachable rule rather than
    exposing two different genitive patterns in the same lesson; cebula
    itself is therefore taught in lesson01 only as a plain vocabulary
    item, never tested in the genitive. The whole lesson03 Ewa/vendor
    market scene and its specific facts (bananas cost 5 złotych a kilo,
    tomatoes cost 8 złotych a kilo, Ewa buys a kilo of bananas and half a
    kilo of tomatoes for 9 złotych total) are original, freshly authored,
    continuing the established Ewa narration register (a market errand
    is Ewa's own, following the same single-protagonist framing unit02's
    shopping scene and unit06's restaurant scene already used).

    Cross-checked against unit01/02/06 per AUTHORING_GUIDE §11: this
    unit's facts (bananas cost 5 złotych/kilo; tomatoes cost 8
    złotych/kilo; Ewa buys 1 kilo of bananas and 1/2 kilo of tomatoes;
    the total is 9 złotych = 5 + 4) are arithmetically consistent and
    stated the same way across every teaching card and exercise in
    lesson03 -- exercise09's grammar-check correction ("Pomidory
    kosztują osiem złotych kilo") reuses the exact same tomato price
    established in the dialogue rather than inventing a new figure, and
    the kosztuje/kosztują singular/plural verb-agreement grammar note
    from lesson01 is used identically (same distinction, same reasoning)
    everywhere it reappears in lesson03's dialogue and exercises.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson01.teach.tanio_drogo -- examples "To jest tanio." / "To jest
    drogo." -> "Bardzo tanio!" / "Bardzo drogo!" (unnatural-polish: adverb
    after "to jest"; the adjective form tanie/drogie would be needed).
    NATIVE CHECK: naturalness of "Banan kosztuje tanio" / "Banany kosztują
    tanio" (kosztować + tanio) in the kosztuje/kosztują grammar note and
    lesson01 exercise08 -- left as-is. Overlay fixes recorded in the en-pl
    overlay notes.

