  notes: >-
    Sixth Polish A2 unit, continuing from pl/a2_unit25_naprawa_w_
    mieszkaniu.yaml -- completes the full six-outcome A2 spine set for
    Polish. Realizes universal.a2.employment.attend_job_interview --
    confirmed against docs/content/universal_spine.yaml (line 809): can_do
    "Attend a basic job interview, describe relevant experience and
    availability, and ask a clarifying question about the role,"
    prerequisites [universal.a1.work.describe_job,
    universal.a2.opinions.give_opinions_with_reasons], both satisfied by
    this course's own unit17 (which already established Marek as an
    inżynier) and unit22 (opinions), the latter authored earlier this same
    session.

    Scenario: Marek, the same "inżynier" A1's unit17 already established,
    interviews for a new engineering role with Rekruterka (a female
    recruiter) -- deliberately continuing his established profession
    rather than inventing a new one, and deliberately giving the unit's
    official role to a woman (unit21's Urzędniczka was the only other
    female official across this session's five other A2 units; unit23/24/
    25 all used male officials) for better cast gender balance across the
    six-unit A2 set as a whole.

    A2-level step-up from A1, deliberate and disclosed: (1) **pracowałem**
    (I worked, masculine past tense of pracować), extending A1 unit12's
    past-tense mechanism (established with a different verb there) to a
    new verb in a genuinely new context -- a real interview needs to
    describe past experience, not just narrate a single past event. (2) A
    duration-of-experience construction ("trzy lata doświadczenia" -- three
    years of experience), where *lata* (years) is followed by the genitive
    *doświadczenia* (of experience) -- continuing this session's
    genitive-case thread (units23/24) with a new pattern (a noun-of-noun
    genitive, not a verb-governed one). (3) A genuine "ask a clarifying
    question about the role" exchange ("Jakie są godziny pracy?" -- what
    are the working hours?), directly serving the spine's own explicit
    wording, not just comprehension. Grepped introduced_tokens across
    pl/a1_unit01-20 and pl/a2_unit21-25 for pracowałem/dostępny/elastyczne
    -- zero hits, confirming genuinely new material (pracować/pracuję/
    inżynier/jestem are real A1 recap words, correctly redeclared below).

    Source-access research: firecrawl still at 0/1,000 credits (same
    outage all five earlier units this session hit). Grepped the cached
    FSI Polish FAST text for "rozmowa kwalifikacyjna"/"doświadczenie
    zawodowe"/"zatrudni" -- zero hits for all three; a 1960s-70s
    diplomatic-training course has no job-interview scene (its "praca"
    hits, checked earlier this session, are unrelated general contexts).
    Authored from established modern Polish job-interview conventions, not
    adapted from any external source.

    Same-speaker-distractor check: lesson03's dialogue has two speakers,
    Rekruterka (4 lines) and Marek (3 lines). Rekruterka: "Dzień dobry!
    Jakie ma pan doświadczenie?" / "Świetnie. Kiedy jest pan dostępny?" /
    "Doskonale. Czy ma pan pytania?" / "Godziny pracy są elastyczne."
    Marek: "Pracowałem trzy lata jako inżynier." / "Jestem dostępny od
    razu." / "Tak. Jakie są godziny pracy?" Every exercise built from this
    dialogue was checked by hand -- no distractor restates the fact under
    test using the same speaker's other line (e.g. the exercise asking
    Marek's availability has his other two lines as distractors, and
    neither mentions availability).

    Cross-checked per §11: Marek's experience (three years as an
    engineer), his availability (right away), and the working hours
    (flexible) are each stated exactly once and never contradicted
    elsewhere in the file.

    Cross-file vocabulary note: every word this file's exercises test,
    including recap words (Dzień/dobry/Proszę/dziękuję/jest/jestem/mam/ma/
    i/w/Tak/Czy/kiedy/pracować/pracuję/trzy/inżynier), is redeclared via
    this file's own lesson01 recap card, per the compiler's per-FILE
    untaught-vocabulary check. Pending fresh-context review per
    AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    false-grammar -- grammar_check prompts "Pytania mam." and "Od razu
    jestem dostępny." are grammatical Polish presented as errors: replaced
    with genuine verb-agreement errors -- lesson01.exercise08 -> "Ja ma
    pytania.", lesson02.exercise07 -> "Ja jest dostępny od razu."; overlay
    instructions/feedback rewritten, Ja mam pytania / Ja jestem dostępny
    od razu / Od razu jestem dostępny accepted. (2)
    comprehension-without-text --
    lesson03.exercise05.read_working_hours_answer showed only the
    question: added Marek's question + the recruiter's answer blocks. (3)
    missing-accepted-answer -- lesson02.exercise08 (yes/no question "Ma
    pan doświadczenie?") + Tak, pracowałem trzy lata jako inżynier and
    natural reorders; lesson02.exercise09/10 and lesson03.exercise11 +
    natural reorders; lesson03.exercise10 + unpunctuated variants. (4)
    underdetermined-prompt -- lesson02.exercise09/10 and
    lesson03.exercise11 pinned "as Marek" (dostępny/pracowałem vs feminine
    forms). NATIVE CHECK: none.

