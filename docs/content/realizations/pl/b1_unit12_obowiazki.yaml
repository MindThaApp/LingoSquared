review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Twelfth Polish B1 unit, continuing from pl/b1_unit11_cele.yaml. Realizes
    universal.b1.necessity.express_obligation_with_subjunctive (docs/content/
    universal_spine.yaml: "Express present necessity/obligation and past
    regret about an unfulfilled obligation using an invariant modal particle
    plus a conjugated subordinate verb, and negate the modal for
    prohibition").

    Grammar step-up, deliberate and disclosed: "trzeba" (it is necessary,
    invariant, impersonal) + bezokolicznik (infinitive) states a GENERAL
    obligation with no specific person named ("Trzeba wynosić śmieci" --
    someone must do this, unspecified who). The B1 step-up is "trzeba,
    żeby" + a past-tense verb carrying a personal ending fused onto "żeby"
    (żebym/żebyś/żeby/żebyśmy/żebyście/żeby -- the same morphology this
    course's own unit11 already taught for purpose clauses, now reused for
    a genuinely different meaning, necessity aimed at a SPECIFIC person:
    "Trzeba, żebyś wyniósł śmieci" -- it's necessary that YOU do this).
    "Trzeba było" adds the past-regret layer for an obligation that was
    NOT fulfilled ("Trzeba było zapłacić czynsz wcześniej" -- it was
    necessary to pay the rent earlier, and it wasn't). Prohibition is
    negated on a DIFFERENT modal, "wolno" (allowed) -> "nie wolno" (not
    allowed/forbidden) -- explicitly disclosed false-friend note, same
    caution the de-en B1 lane flagged for "nicht müssen": negating "trzeba"
    itself ("nie trzeba") means "not necessary", NOT "forbidden" -- Polish
    prohibition requires the separate "nie wolno", never "nie trzeba".

    Scenario: continues Ewa and Marek's established informal ty register.
    Topic is a self-contained new one, Marek's apartment building's house
    rules (regulamin bloku) -- taking out the trash, a balcony
    no-smoking rule, and a missed rent deadline -- with no callback to any
    earlier unit's stated fact, so nothing here can contradict units01-11.
    Deliberately does not assert who currently lives in the building
    (referred to as "ten blok, w którym mieszka Marek") to avoid asserting
    a shared-living-arrangement fact this course has never established.

    Character canon check (item 6): grepped pl/b1_unit01-11 before writing.
    Marek's engineer occupation (a1_unit17/b1_unit03/08/10) and Ewa's
    stated reasons for staying (unit01) are not touched. Ewa and Marek's
    informal ty register is unchanged. No facts asserted about Kasia
    (unit05/10) or the Konsultantka (unit07) or Kierowniczka (unit03) --
    none of those characters appear here.

    Gender agreement note (checklist rule #6): "żeby"-fused personal past
    forms inflect for gender (wyniósł/wyniosła, zapłacił/zapłaciła,
    podpisał/podpisała). Every such form here is fixed to an established
    character's known gender (Marek: wyniósł, zapłacił -- masculine; Ewa:
    podpisała -- feminine) throughout; no first-person form is asked of
    the learner in this unit's accepted_answers requiring a gender guess,
    so no feminine/masculine variant pair was needed (verified: lesson04's
    culminating writing_prompt asks the learner to write about Ewa AND
    Marek's obligations by name, not about themselves).

    Same-speaker-distractor check (lesson03's 6-line dialogue, Marek 3
    lines / Ewa 3 lines): every exercise built from this dialogue was
    checked against every OTHER line either speaker says -- no distractor
    restates the fact under test using the same speaker's other line.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage, same as every prior pl B1 unit). No
    public-domain intermediate Polish course exists to adapt from.
    Authored from established modern Polish grammar/register conventions --
    the trzeba/trzeba-było + żeby-subjunctive split and the nie-wolno vs
    nie-trzeba false-friend distinction are standard, textbook-attested B1
    Polish constructions, double-checked against standard Polish reference
    grammar before writing any example sentence.

    Pending fresh-context review per AUTHORING_GUIDE #9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    (overlay) missing-accepted-answer: lesson01.exercise07/exercise09,
    lesson02.exercise07/exercise09, lesson03.exercise11,
    lesson04.exercise09 -- added feminine addressee forms (wyniosła /
    zapłaciła / zadzwoniła ... wyjaśniła; the English 'you' does not pin
    gender) and the natural 'żebyś dzisiaj wyniósł śmieci' / 'żebyś
    wcześniej zapłacił czynsz' orders; lesson02.exercise08 -- added
    'żebym wcześniej podpisała/podpisał regulamin' order;
    lesson03.exercise10 -- added 'w poniedziałki i w środy'.
    underdetermined-prompt: lesson04.exercise08 -- 'What obligation do
    you have today?' accepted only signing the rules -> instruction now
    says to answer that you need to sign the building rules.
    comprehension-without-text: lesson03.exercise03 -- Ewa's line alone
    never mentions smoking/the balcony, yet the key is 'smoking on the
    balcony was allowed there' -> realization prompt now also shows
    Marek's preceding line, overlay instruction 'Read the exchange'.
    Metadata note: earlier notes claim lesson04's writing_prompt is
    about Ewa and Marek by name; it is actually first-person (both
    gender variants accepted). NATIVE CHECK: none.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

    Second-pass review 2026-10-19: 2 fixes - lesson02.teach.trzeba_bylo_note
    claimed trzeba było always marks an unfulfilled obligation (it is also
    plain past necessity) -> "najczęściej" (most often, regret);
    lesson04.teach.review_note "Trzy formy tego obowiązku" (unnatural) ->
    "Trzy sposoby mówienia o obowiązku". CANON FLAG: A1 unit18 gives Marek a
    house (Mam dom), yet lesson03's dialogue has Marek in a block of flats
    (regulamin bloku, balcony) forgetting the rent; not restructured
    (touches most lesson03 exercises) -- coordinator/native decision needed.
    NATIVE FLAGS: "Trzeba było, żebyś zapłacił czynsz wcześniej" is
    grammatical but heavy ("Powinieneś był zapłacić..." is the everyday
    form); left unchanged.

