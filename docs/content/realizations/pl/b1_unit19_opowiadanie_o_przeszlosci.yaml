  notes: >-
    Nineteenth Polish B1 unit, continuing from pl/b1_unit18_nastepstwo_
    czasowe.yaml. Realizes universal.b1.narrative.recount_past_
    experience_with_sequencing (docs/content/universal_spine.yaml:
    "Recount a past experience as a sequence of events, marking
    background action against a main-line event with a sequencing
    connector, and report what someone else said using reported-speech
    subordination"). This COMPLETES the canonical 19-outcome B1 tier for
    pl.

    Overlap check against pl's existing b1_unit05_mowa_zalezna.yaml
    (required by dispatch, since this outcome names reported speech):
    unit05 realizes universal.b1.communication.report_what_someone_said,
    the FULL reported-speech lesson (że/czy, the no-tense-backshift rule,
    wh-word reported questions) as its own primary, dedicated four-lesson
    topic. This unit's outcome instead centers on RECOUNTING A PAST
    EXPERIENCE via sequencing connectors (najpierw/potem/w końcu) and
    marking background action against a mainline event ("podczas gdy" +
    imperfective vs. a perfective interrupting event) -- reported speech
    is only the outcome's THIRD, secondary requirement. Per the dispatch
    instruction, reported speech appears in exactly ONE line of this
    unit's dialogue (lesson03, one embedded "że"-clause), reusing but
    never re-teaching unit05's no-backshift rule as a one-line callback,
    with zero dedicated lesson, drill set, or grammar_note of its own --
    lessons01/02/04 are entirely sequencing/background content with no
    reported speech at all. This deliberately keeps the outcome's
    secondary component secondary rather than duplicating unit05.

    Grammar step-up, deliberate and disclosed: (1) sequencing connectors
    "najpierw...potem...w końcu" (first...then...finally) linking three
    perfective past mainline events ("Najpierw pojechaliśmy na dworzec,
    potem czekaliśmy na pociąg, w końcu wsiedliśmy" -- note "czekaliśmy"
    is imperfective, itself a background-ish "then" stage, contrasted
    explicitly in lesson02's dedicated background construction); (2)
    background vs. mainline: "podczas gdy" + imperfective past
    (background, ongoing) + perfective past (mainline, interrupting) --
    "Podczas gdy czekaliśmy na peronie, zaczęło padać"; (3) one embedded
    reported-speech callback, no-backshift preserved per unit05's
    established rule: "Ewa powiedziała, że pociąg się spóźni" (future
    tense "spóźni" retained under a past-tense "powiedziała").

    Scenario: continues the established Ewa/Marek informal ty-register
    storyline. Marek recounts a train-station trip from last weekend
    (a new one-off past narrative, distinct from unit16's weekend-bike-
    trip premise, unit17's train/shopping-planning premise, and unit18's
    evening-routine/phone-call premise) to Ewa.

    Case notes: "na dworzec" (accusative, goal of motion); "na peronie"
    (locative, static location); "pociąg się spóźni" (reflexive
    "spóźnić się", future). Aspect notes, central to the outcome:
    "pojechaliśmy"/"wsiedliśmy"/"zaczęło" are perfective (bounded
    mainline events); "czekaliśmy" is imperfective (ongoing background
    action) -- the exact minimal pair the outcome's "marking background
    action against a main-line event" phrase names.

    Character canon check (item 6): grepped pl/b1_unit01-18 before
    writing. No fact about Ewa or Marek is contradicted. No new
    characters introduced; Ewa's line reporting the train delay is a
    one-off aside, not a new fact about any other character.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Marek 4
    lines / Ewa 2 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says in the
    same dialogue -- no distractor restates the fact under test using the
    same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the three-stage trip
    sequence (dworzec -> czekanie -> wsiadanie), the rain starting while
    waiting, and Ewa's one reported warning about the train are each stated
    exactly once and never contradicted elsewhere in the file.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, same standing outage). No public-domain intermediate Polish
    course exists to adapt from. Authored from established modern Polish
    grammar conventions, double-checked against standard Polish reference
    grammar (aspect choice for sequencing/background, case government)
    before writing any example sentence.

    Cross-file vocabulary note: every word this file's exercises test,
    including basic recap words (podróż, w zeszły weekend), is redeclared
    via this file's own lesson01 recap card, per the compiler's per-FILE
    untaught-vocabulary check -- this file does not rely on any other pl
    file having been compiled first. Pending fresh-context review per
    AUTHORING_GUIDE #9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson04.exercise07 -- removed the English free-production prompt
    block ('Recount a short past trip ...') that contradicted the
    overlay's fixed translation instruction and exact-string key
