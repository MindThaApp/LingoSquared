  notes: >-
    First-ever Polish unit for this app (pl is a brand-new target
    language). Structural template: es/a1_unit01_greetings.yaml (closest
    precedent for bootstrapping a brand-new Latin-script target from
    nothing). Sized to 3 lessons per explicit sizing guidance for a
    first bootstrap unit -- not the full 6-lesson depth es eventually
    grew to. Authored from the start in AUTHORING_GUIDE §19 format
    (schema_version 1.1): every kind:vocabulary card carries a real
    example: sentence. Zero listen_type/listen_select/listen_order
    exercises anywhere in this file -- pl is not yet in either
    GOOGLE_TTS_SUPPORTED_LANGUAGES or AZURE_TTS_SUPPORTED_LANGUAGES
    (backend/app/services/tts.py), so per AUTHORING_GUIDE §14's general
    principle (documented there for prs specifically, applied here to a
    second currently-audio-less language) every exercise uses a real
    visible text prompt instead of an audio-only one; media_assets is
    therefore an empty list, not an oversight. dialogue_comprehension
    exercises in lesson03 render via the same MultipleChoice component
    as multiple_choice/listen_select (frontend/src/components/exercises/
    ExerciseRenderer.tsx) and are given real target_blocks text instead
    of a media_asset_key, so they work as pure reading comprehension
    with no audio dependency.

    Source: FSI Polish FAST (1992), Unit 1 "Exchanging Greetings and
    Introductions" -- confirmed real public-domain US government
    course text (fsi-languages.yojik.eu/languages/FSI/Polish/FAST/FSI
    - Polish FAST.pdf, OCR'd but genuinely extractable via pdftotext
    -layout, not scan-only). Real source vocabulary actually used here,
    modernized per §10 (the source is 1990s diplomatic-register --
    embassy staff introducing themselves to colleagues -- so its
    register and scenario were adapted, not copied): dzień dobry, dobry
    wieczór, dobranoc, do widzenia, jestem/nazywam się pattern, pan/pani
    formal address and the associated verb-ending agreement, "Czy pan/
    pani mówi po polsku?" (this exact question is in the source almost
    verbatim, unit 1's own pronunciation-practice section). The source
    course is written entirely in the formal pan/pani register (it's a
    diplomatic-training text, addressed to adults meeting professional
    colleagues) and never once covers informal ty-register greetings or
    farewells -- confirmed by grep across the full 467-page OCR text,
    zero hits for "cześć" or "jak się masz" anywhere in the document.
    Every ty-register item in this file (ty, jak się masz, a ty, cześć,
    pa-equivalent farewell use of cześć, jak masz na imię, mam na imię,
    skąd jesteś) is therefore freshly authored from general knowledge of
    modern spoken Polish, not source-derived -- disclosed honestly per
    the standing requirement. Names (Anna Kowalska, Marek Wójcik, Ewa)
    and the unit01.lesson03 closing dialogue scenario are freshly
    authored; Kowalski/Kowalska and similar names appear in the FSI
    source purely as a very common placeholder Polish surname, reused
    here for the same reason.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    realization found clean; all fixes for this unit are overlay-side
    answer keys and instructions (see the en-pl overlay a1_unit01 review
