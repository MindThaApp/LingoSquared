  required_next_reviewer: native_speaker_pass
  notes: >-
    Ninth Polish B1 unit, continuing from pl/b1_unit08_zale.yaml. Realizes
    universal.b1.future.describe_plans_intentions_and_predictions
    (docs/content/universal_spine.yaml: "Describe future plans, intentions,
    and predictions with the appropriate degree of certainty -- distinguish
    fixed arrangements, intentions, and probable or uncertain predictions
    using the target language's future-reference forms and certainty
    markers").

    Grammar step-up, deliberate and disclosed: THREE distinct future-
    reference forms per the outcome's literal three-way distinction --
    1) present tense of a scheduled-event verb for a FIXED arrangement
    (mam wizytę / jadę, same present-tense-for-near-future pattern already
    known from pl a1_unit11_plans, now paired explicitly against the other
    two forms rather than taught alone), 2) "zamierzam" + bezokolicznik for
    a stated INTENTION, and 3) "chyba"/"prawdopodobnie" + czas przyszły for
    an uncertain PREDICTION. Register: informal ty, continuing Ewa and
    Marek's established private-conversation register (same as unit01/02/
    04/05/06/08; unit07 was the one-off formal service exchange).

    Scenario: Ewa and Marek talk about the coming week and weekend -- a
    fixed dentist appointment, Ewa's intention to learn to swim, and an
    uncertain weather prediction affecting a planned walk. Self-contained,
    no callback to any earlier unit's stated fact (deliberately NOT reusing
    unit01's job-change or unit08's Zakopane-trip material, to avoid any
    risk of contradicting either).

    Character canon check (item 6): grepped pl/b1_unit01-08 before writing.
    No new facts asserted about Marek's occupation (engineer, a1_unit17/
    b1_unit03/b1_unit08) or Ewa's stated reasons (unit01) or Kasia (unit05)
    or the Konsultantka (unit07) -- none of those characters appear here.
    Ewa and Marek's informal ty register is unchanged.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage, same as every prior pl B1 unit). No public-
    domain intermediate Polish course exists to adapt from. Authored from
    established modern Polish grammar/register conventions -- present-
    tense-for-fixed-future, "zamierzam" + infinitive, and "chyba"/
    "prawdopodobnie" + future tense are all standard, textbook-attested B1
    constructions, double-checked against standard Polish reference
    grammar before writing any example sentence. Weather verbs (padać) are
    impersonal in Polish (third-person singular only, no personal subject)
    -- every grammar_check "broken" sentence that misuses this is a
    genuine agreement violation, not a reordering (checklist rule #10).

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked against every OTHER line either speaker says -- no distractor
    restates the fact under test using the same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the dentist appointment (Ewa,
    Monday), Marek's swimming intention, and the weekend weather
    prediction are each stated exactly once and never contradicted
    elsewhere in the file.

    Gender agreement note: every new construction here (zamierzam,
    chyba/prawdopodobnie + future, mam/jadę) uses present tense or an
    impersonal/infinitive form, none of which inflect for the speaker's
    gender in Polish -- so no feminine/masculine first-person variant is
    needed anywhere in this file's accepted_answers (unlike unit08's past-
    tense regret forms). Confirmed by checking every production exercise's
    tested construction against this rule before writing the overlay.

    Culminating exercise (lesson04, checklist item 7): the outcome's
    can_do names all THREE categories together ("distinguish fixed
    arrangements, intentions, and probable or uncertain predictions").
    lesson04's writing_prompt exercise requires the learner to produce ONE
    sentence of each of the three types in a single response, not just
    drill any one construction alone.

    Cross-file vocabulary note: this file recaps its own basic words
    (jest, mam, dobry) via lesson01's recap card, per the compiler's
    per-FILE untaught-vocabulary check -- does not rely on any other pl
    file having been compiled first. Pending fresh-context review per
    AUTHORING_GUIDE #9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson04.exercise07.write_moj_plan -- prompt.target_blocks held the
    English task instruction tagged language_code pl (would be voiced as
    Polish by TTS, and duplicated the overlay instruction) -> emptied to
    []; the overlay instruction now pins the three exact sentences
    (underdetermined open prompt graded against fixed strings). All
    other fixes are overlay-side (see the en-pl overlay's review notes).

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

    Second-pass review 2026-10-19: 4 fixes - lesson02.teach.chyba_note
    claimed padać is always impersonal ("nigdy będziemy"); personal padać
    (to fall/drop) exists -> restricted to the rain sense;
    lesson02.exercise07 and lesson03.exercise09 grammar_check prompts "Chyba
    będziemy padać..." are grammatical (personal padać, "we'll be dropping")
    -> rebuilt around a real error, "Chyba będzie pada..." (finite verb
    after future będzie); lesson02/lesson03 matching_pairs had chyba
    "probably / I guess" vs prawdopodobnie "probably" (confusable rights) ->
    both "probably" (overlay mirrored).

