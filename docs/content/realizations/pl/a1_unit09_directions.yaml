              - {text: "Potem proszę iść prosto.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit09.lesson01.teach.prosze_bezokolicznik
            kind: grammar_note
            target: {text: "Proszę + bezokolicznik -- Proszę (please) plus a verb in the infinitive (bezokolicznik) is the everyday polite way to give a direction, without needing a separate command (imperative) form. It works the same whether you're speaking to a stranger or a friend: Proszę iść prosto.", language_code: pl, direction: ltr}
            introduced_tokens: ["Proszę"]
          - content_key: pl.a1.unit09.lesson01.teach.jak_dojsc_note
            kind: grammar_note
            target: {text: "Jak dojść do + [miejsce]? -- Jak (how) plus dojść (to get to) pyta o drogę: Jak dojść do banku? Jak dojść do hotelu? Jak dojść do parku? Rzeczownik po do ma tę samą końcówkę dopełniacza (-u), co po obok/naprzeciwko z poprzedniej lekcji: bank -> banku, hotel -> hotelu, park -> parku.", language_code: pl, direction: ltr}
            introduced_tokens: ["Jak", "do", "bank", "banku", "hotel", "hotelu", "park", "parku"]
          - content_key: pl.a1.unit09.lesson01.teach.jak_dojsc_do_banku
