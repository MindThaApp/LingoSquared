  target_language_first: true
  dialect: pl_standard
  register_policy: >-
    Continue unit01-08's register split: Ewa and Marek use the informal
    ty-register with each other. This unit's core new construction, Proszę
    + bezokolicznik (please + infinitive), is deliberately register-neutral
    -- it gives directions the same way regardless of who's being
    addressed, so no new formal/informal distinction is introduced by this
    unit. Lesson03's dialogue still opens with Przepraszam as a polite
    attention-getting habit before asking a practical question, matching
    unit08's established precedent, even though Ewa and Marek already know
    each other.

