review:
  status: "unreviewed"
  required_next_reviewer: "codex"
  notes: >-
    Ninth Polish unit, continuing directly from pl/a1_unit08_places.yaml
    (same Ewa/Marek pair, same 3-lesson bootstrap pace as units01-08).
    Realizes universal.a1.directions.ask_follow_basic_directions -- confirmed
    the next A1 outcome in spine order via docs/content/universal_spine.yaml
    (id + can_do text read directly: "Ask for and follow short directions to
    a nearby place," prerequisite universal.a1.places.locate_common_places,
    i.e. unit08). This is also the exact outcome unit08's own review notes
    already flagged as "the very next spine outcome and its own future
    unit," so no ambiguity in ordering. Checked nl/a1_unit09_directions.yaml
    purely to confirm topic identity (a "directions" unit, linksaf/rechtdoor/
    rechtsaf turn-by-turn content) -- confirming scope only, not for any
    sentence text, character, or lesson-structure reuse; nl's file has grown
    to 6 lessons with real audio assets and a fresh-context review pass
    already completed, which this file deliberately does NOT match in size,
    per the standing "3-lesson bootstrap pace" instruction for this course.
    No `ro` realization directory exists in this project at all (checked
    `docs/content/realizations/` directly), so no ro cross-check was
    possible or attempted.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence. Zero
    listen_type/listen_select/listen_order exercises anywhere in this file,
    matching unit01-08's own established choice -- media_assets is an empty
    list, not an oversight (same rationale as unit08: a future dedicated
    audio-authoring pass is a real, cheap opportunity now that pl has live
    Google Cloud TTS, but this file stays consistent with the precedent
    every prior pl unit has set). Because there is no dialogue AUDIO in this
    file, the AUTHORING_GUIDE same-speaker-distractor bug class (a
    listen_select/listen_order distractor that's something the tested
    speaker also says elsewhere in the SAME audio clip) is not directly
    applicable -- explicitly checked and confirmed N/A for that reason.
    The analogous risk for lesson03's two `dialogue_comprehension` exercises
    (text-based, not audio) was still checked by hand: exercise03 asks how
    to get to the park (correct: "prosto, potem na lewo") with distractors
    "na prawo, potem prosto" (this IS what Marek says elsewhere in the same
    dialogue -- but about the BANK, a different question, so it is a
    genuinely wrong answer to THIS question, the same safe cross-reference
    pattern unit08's own reviewed lesson03 already uses) and "na lewo, potem
    prosto" (an invented wrong permutation, stated nowhere); exercise04
    (about the bank) mirrors this the other way. Neither exercise's
    distractor set makes both options simultaneously true for the place
    actually being asked about.

    Grammar-scope decision, disclosed up front per unit07/unit08's own
    precedent for narrowing A1 case/verb-form exposure deliberately rather
    than by omission:
    (1) Every direction-giving sentence in this unit uses "Proszę +
    bezokolicznik" (please + infinitive) -- e.g. "Proszę iść prosto,"
    "Proszę skręcić na prawo" -- and the Polish IMPERATIVE mood (skręć!,
    idź!) is never taught or tested anywhere in this file. This is a
    deliberate simplification: "Proszę + infinitive" is independently
    confirmed by the source material (see below) as the natural, idiomatic
    way Poles actually give directions to a stranger, so it isn't a
    watered-down substitute for "the real grammar" -- it's the genuinely
    correct register for this scenario, and it has the added A1-friendly
    property of being invariant regardless of whether the person being
    addressed is a stranger or a friend (no separate ty/pan-pani imperative
    forms to teach). lesson01's teach.prosze_bezokolicznik grammar_note
    makes this explicit.
    (2) "Jak dojść do + [miejsce]?" reuses ONLY the genitive-singular
    masculine -u pattern unit08 already established (bank -> banku, hotel
    -> hotelu, park -> parku) with the new preposition "do" -- no new
    noun-case pattern is introduced. lesson03's dialogue destinations are
    therefore deliberately restricted to bank and park (both already
    case-scoped from unit08), never apteka/poczta/restauracja (feminine
    nouns with a different, untaught genitive pattern -- poczty/apteki --
    same reasoning unit08 itself already used to avoid mixing declension
    patterns in one unit).
    (3) Several real constructions from the source's own "Getting Around on
    Foot" dialogue were deliberately dropped to keep this unit's case/verb
    exposure narrow: "tą ulicą" (instrumental case, "along this street"),
    "do skrzyżowania"/"do świateł" (genitive forms of skrzyżowanie/światła,
    a different neuter declension pattern from the masculine -u pattern
    this unit reuses), and "w pierwszą ulicę" (ordinal number + accusative
    case). None of these appear anywhere in this file's vocabulary or
    exercises -- this unit's direction vocabulary is deliberately limited
    to prosto/na prawo/na lewo/skręcić/iść/dojść/tam/potem/ulica/rozumiem.

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from unit08 (Przepraszam, Dziękuję, bardzo,
    Proszę, A, bank, park, and their genitive forms banku/parku, jest) is
    re-declared via this file's OWN introduced_tokens before being tested in
    this file's own exercises -- the compiler validates untaught vocabulary
    per realization FILE, not per course. As unit08 itself already found,
    the nominative and genitive forms of the same noun are distinct tokens
    to the compiler's tokenizer and are each declared separately at first
    use here too (bank/banku, park/parku both declared via lesson01's
    teach.jak_dojsc_note).

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02-08
    (.firecrawl/fsi-polish-fast.pdf / .txt). This unit's "Getting Around on
    Foot" chapter (the cached .txt, roughly lines 2480-2740) is a genuine,
    substantial direction-giving dialogue and directly confirms, verbatim
    in the source's own vocabulary list and dialogue: "jak dojść (na/do)"
    (how to get to), "proszę iść prosto" (please go straight -- the exact
    phrase "Proszę iść prosto" appears as a literal substring, e.g. "Proszę
    iść prosto tą ulicą do Świętokrzyskiej"), "proszę skręcić na prawo" /
    "proszę skręcić na lewo" (please turn right / please turn left --
    exact substrings, e.g. "Tam proszę skręcić na prawo," "Tam proszę
    skręcić na lewo"), "tam" (there), "potem" (then, later -- source gloss:
    "potem -- then, later"), and "rozumiem" (I understand -- source gloss:
    "rozumiem -- I understand," also used in the dialogue itself: "Rozumiem,
    na prawo"). "ulica" (street) and the bare verbs "iść"/"dojść" are also
    directly source-attested throughout the same passage (ulica Szpitalna,
    ulica Świętokrzyska, dojść do skrzyżowania). Adapted here into a fresh
    Ewa/Marek bank-and-park scene per §10, never copied verbatim -- the
    source's own scene is a tourist asking a passerby for a specific street
    (Krakowskie Przedmieście) with a longer, more complex route.

    Honestly disclosed as NOT source-confirmed, freely authored from
    general knowledge of modern spoken Polish (same standard as every prior
    unit's disclosed gaps): bare "prawo"/"lewo" as standalone nouns
    (the source only demonstrates the fused phrases "na prawo"/"na lewo,"
    never the bare nouns alone as a vocabulary item) -- ordinary, common
    A1-transparent Polish nouns, freely authored as their own vocabulary
    card so the fused phrase can be built up from parts the learner has
    each seen individually. Likewise, "Jak dojść do + [common noun]?"
    (bank/hotel/park) is a freely authored generalization from general
    Polish grammar: the source's own directly-confirmed "jak dojść"
    example pairs it with a proper street name via "na" ("jak dojść na
    Krakowskie Przedmieście"), not a common noun via "do" -- extending the
    idiom to "do + genitive common noun" for this unit's bank/park
    scenario is correct, ordinary Polish, just not the specific
    construction directly attested in the passage checked.

    Cross-checked against this file's own earlier lessons per AUTHORING_
    GUIDE §11: the park's route (straight, then turn left; "Park jest
    tam") and the bank's route (turn right, then straight; "Bank jest na
    prawo") are stated once, in lesson03's teaching dialogue, and reused
    identically -- never contradicted -- in every matching exercise that
    tests either route (lesson03 exercises 02-04, 06-07, 09-10). No place
    is ever given two different locations or routes across the file.

course:
