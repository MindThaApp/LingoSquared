              - {text: "Jak dojść do banku?", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit09.lesson01.teach.prosto
            kind: vocabulary
            target: {text: "prosto", language_code: pl, direction: ltr}
            introduced_tokens: ["prosto"]
            example:
              {text: "Proszę iść prosto do parku.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit09.lesson01.teach.tam_potem
