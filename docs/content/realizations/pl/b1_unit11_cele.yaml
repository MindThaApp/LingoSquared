review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Eleventh Polish B1 unit, continuing from pl/b1_unit10_streszczenie.yaml.
    Realizes universal.b1.purpose.express_purpose_and_goals (docs/content/
    universal_spine.yaml: "Explain the purpose or goal behind an action
    using a purpose-clause construction ('X does Y in order to/so that
    Z'), across everyday and abstract topics such as study, work, and
    saving money").

    Grammar step-up, deliberate and disclosed: the genuine two-way split
    in Polish "żeby" purpose clauses, per the dispatch's explicit
    instruction -- 1) "żeby" + bezokolicznik (infinitive) when the main-
    clause subject and the purpose-clause subject are the SAME person
    (Uczę się angielskiego, żeby dostać lepszą pracę -- I study English in
    order to get a better job, I study AND I get), and 2) "żeby" + a past-
    tense verb carrying a personal ending fused onto "żeby" itself
    (żebym/żebyś/żeby/żebyśmy/żebyście/żeby) when the two subjects DIFFER
    (Marek pomaga Ewie, żeby szybciej skończyła projekt -- Marek helps
    Ewa so that SHE finishes the project faster, Marek helps but Ewa
    finishes). Register: informal ty, continuing Ewa and Marek's
    established private-conversation register.

    Scenario: Ewa's goal of studying English intensively to get a job at
    an international company (extends, does not replace, her established
    stated reason for staying in the city -- her job and friends, unit01
    -- by adding a concrete professional ambition, not contradicting it),
    and Marek's goal of saving money so they can go on vacation together
    and Ewa can rest. Deliberately does NOT reuse "learning Polish" as a
    goal, since Ewa and Marek are themselves conversing in Polish
    throughout this course -- that would break the story's own internal
    fiction (a Polish speaker's stated goal of learning Polish, mid-
    Polish-conversation, is incoherent). English-as-Ewa's-goal avoids
    this entirely.

    Character canon check (item 6): grepped pl/b1_unit01-10 before
    writing. Ewa's established reason for staying (job and friends,
    unit01) is extended, not contradicted, by this new detail (studying
    English for a specific job goal). Marek's occupation (engineer,
    a1_unit17/b1_unit03/b1_unit08) is not touched. No facts asserted
    about Kasia (unit05/10) or the Konsultantka (unit07). Ewa and Marek's
    informal ty register is unchanged.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage, same as every prior pl B1 unit). No public-
    domain intermediate Polish course exists to adapt from. Authored from
    established modern Polish grammar/register conventions -- the "żeby"
    same-subject-infinitive vs different-subject-personal-past split is a
    standard, textbook-attested B1 Polish construction, double-checked
    against standard Polish reference grammar before writing any example
    sentence, including the fused personal endings (żebym, żebyś, żebyśmy).

    Same-speaker-distractor check (lesson03's 6-line dialogue, Marek 3
    lines / Ewa 3 lines): every exercise built from this dialogue was
    checked against every OTHER line either speaker says -- no distractor
    restates the fact under test using the same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: Ewa's goal (a job at an
    international company), Marek's goal (saving for a vacation so Ewa
    can rest), and their shared destination preference (the seaside) are
    each stated exactly once and never contradicted elsewhere in the
    file.

    Gender agreement note (checklist rule #6): "żeby" + past-tense
    personal forms DO inflect for gender in the 1st/2nd/3rd person
    singular (skończyła/skończył, zdała/zdał). Every such form in this
    file is either fixed to an established character's known gender
    (Ewa: skończyła, mogła -- both feminine, consistent throughout) or,
    where the exercise asks the LEARNER to produce a first-person form
    about themselves (lesson04's "żebym zdała/zdał egzamin"), the
    overlay's accepted_answers include BOTH the feminine and masculine
    variant. Verified the agreement rule itself first (this is a
    subject-verb personal-ending agreement, not an object-agreement
    pattern like Hindi ergative perfective, so a first-person speaker's
    own grammatical gender is what determines the form -- confirmed
    before writing any accepted_answers).

    Culminating exercise (lesson04, checklist item 7): the outcome's
    can_do names the full purpose-clause construction ("X does Y in order
    to/so that Z") without restricting to either the same-subject or
    different-subject case. lesson04's writing_prompt exercise requires
    the learner to produce ONE purpose clause of EACH kind (żeby +
    infinitive AND żeby + personal past form) in a single response, not
    just drill either construction alone.

    Cross-file vocabulary note: this file recaps its own basic words
    (jest, mam, dobry) via lesson01's recap card, per the compiler's
    per-FILE untaught-vocabulary check -- does not rely on any other pl
    file having been compiled first. Pending fresh-context review per
    AUTHORING_GUIDE #9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson03.exercise06 pair "żeby skończyła projekt" right "so that she
    finished the project" -> "so that she finishes the project" (the
    past-form verb after żeby carries no past meaning; the old gloss
    taught a false tense reading; overlay mirrored). lesson04.exercise07
    prompt.target_blocks held the English task text tagged pl -> emptied
    to [] (the overlay instruction now pins the two sentences). Other
    fixes are overlay-side.

