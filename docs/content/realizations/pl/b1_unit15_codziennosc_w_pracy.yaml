  notes: >-
    Fifteenth Polish B1 unit, continuing from pl/b1_unit14_zgoda_i_
    sprzeciw.yaml. Realizes universal.b1.workplace.describe_
    responsibilities_and_updates (docs/content/universal_spine.yaml:
    "Describe your job responsibilities, give a colleague a status update
    on a work task, and ask a colleague for professional help, in
    appropriately professional register").

    Grammar step-up, deliberate and disclosed: "odpowiadam za" + biernik
    (accusative) for stating a responsibility ("Odpowiadam za
    dokumentację techniczną" -- I'm responsible for the technical
    documentation), a three-way status contrast the outcome's own
    listening assessment_requirement names literally (complete:
    "skończyłem" + biernik; delayed: "jest opóźniona/opóźniony"; in
    progress: "jestem w trakcie" + dopełniacz/rzeczownik odczasownikowy),
    and the formal help-request frame "czy mógłby mi pan/mogłaby mi pani
    pomóc z..." (could you help me with...), reusing this course's own
    by-conditional morphology (unit01/03/06) now applied to a professional
    request.

    Scenario: continues Marek's established workplace (inżynier,
    a1_unit17/b1_unit03/08/10) and his established manager Kierowniczka
    (b1_unit03_spotkania_w_pracy.yaml), a deliberate continuity callback
    consistent with, not contradicting, both established facts. A new
    one-off colleague, Pan Piotr, is introduced fresh in this file for
    the "ask a colleague for help" requirement. Formal Pan/Pani register
    throughout -- matching unit03's established workplace register exactly
    -- including between Marek and his colleague Piotr, per the outcome's
    own "appropriately professional register" requirement (this office's
    established formality, per unit03, is not informal even among peers).

    Character canon check (item 6): grepped pl/b1_unit01-14 before
    writing. Marek's engineer occupation and his Kierowniczka's existence/
    formal register (unit03) are extended, not contradicted -- no new fact
    about her is asserted beyond her professional role. No fact is
    asserted about Ewa, Kasia (unit05/10), the Konsultantka (unit07), or
    unit13's Urzędniczka -- none of those characters appear here. Pan
    Piotr is a fresh, self-contained one-off colleague.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Kierowniczka
    2 lines / Marek 3 lines / Piotr 1 line): every exercise built from this
    dialogue was checked against every OTHER line any speaker says -- no
    distractor restates the fact under test using the same speaker's other
    line.

    Culminating exercise (lesson04, checklist item 7): the outcome names
    THREE distinct production acts (describe a responsibility, give a
    status update, ask a colleague for help) -- lesson04's writing_prompt
    requires the learner to produce all three in one professional-register
    message, not just drill one in isolation.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage, same as every prior pl B1 unit). No
    public-domain intermediate Polish course exists to adapt from.
    Authored from established modern Polish workplace-register
    conventions, double-checked against standard Polish reference grammar
    before writing any example sentence.

    Pending fresh-context review per AUTHORING_GUIDE #9; not
    self-certified.

