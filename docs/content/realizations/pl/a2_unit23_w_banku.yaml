review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Third Polish A2 unit, continuing from pl/a2_unit22_opinie.yaml. Realizes
    universal.a2.banking.open_bank_account -- confirmed against
    docs/content/universal_spine.yaml (line 735): can_do "Open a basic bank
    account and understand simple account features and requirements,"
    prerequisites [universal.a1.money.handle_basic_money_matters,
    universal.a2.bureaucracy.register_with_authorities]. Money-handling is
    covered by this course's own unit07 shopping unit (prices, kosztuje,
    złotych); the bureaucracy prerequisite is this course's own
    pl/a2_unit21_sprawy_urzedowe.yaml, authored immediately before this
    unit, satisfying the spine's own suggested outcome ORDER (not just
    coverage) for once.

    Scenario: Marek opens a bank account (konto bankowe) -- a deliberate
    gender-mirrored parallel to unit21's Ewa-at-the-office scene, both
    reusing the SAME new A2 conditional grammar point (chciałbym for Marek
    here, chciałabym for Ewa there) so the two forms of one paradigm are
    each modeled by a different established character rather than both
    dumped on one.

    A2-level step-up from A1, deliberate and disclosed: (1) **chciałbym**
    (I would like to, masculine conditional of chcieć) -- the masculine
    counterpart of unit21's chciałabym, explicitly called out as a
    same-paradigm callback in this unit's own teaching note. (2)
    **potrzebować** governing the **genitive case** ("potrzebuję dowodu
    osobistego" -- I need an ID card), this course's first explicit
    genitive-government teaching point (previous units used genitive forms
    incidentally inside memorized phrases, e.g. unit19's "do parku," but
    never taught the case-government rule itself). (3) **żeby** + infinitive
    (in order to) as a purpose clause, contrasting with unit21's ponieważ
    (reason) and unit22's bo (also reason) -- this unit deliberately
    completes the "reason vs. purpose" subordinate-clause contrast across
    the three A2 units authored so far. (4) **Ile + genitive** ("Ile
    pieniędzy" -- how much money) as a quantity question, reusing the same
    case-government logic point (2) just taught. Grepped introduced_tokens
    across pl/a1_unit01-20 and pl/a2_unit21-22 for chciałbym/potrzebuję/
    żeby -- zero hits, confirming genuinely new material.

    Source-access research: firecrawl still at 0/1,000 credits (same
    outage). Grepped the cached FSI Polish FAST text for "konto"/"PESEL"/
    "otworzyć konto" -- zero hits for all three; "bank" itself only
    appears as a cognate-noun-ending drill example (already checked and
    disclosed in unit21's own notes), never a real account-opening scene.
    Authored from established modern Polish banking conventions: PESEL
    (Poland's universal national ID number, genuinely required to open any
    bank account) and dowód osobisty are real, current requirements, not
    invented detail.

    Same-speaker-distractor check: lesson03's dialogue has two speakers,
    Pracownik banku (4 lines) and Marek (3 lines). Pracownik: "Dzień dobry!
    W czym mogę pomóc?" / "Oczywiście. Czy ma pan dowód osobisty i numer
    PESEL?" / "Dziękuję. Ile pieniędzy chce pan wpłacić?" / "Świetnie.
    Konto jest gotowe." Marek: "Chciałbym otworzyć konto bankowe." / "Tak,
    mam. Proszę bardzo." / "Chcę wpłacić sto złotych." Every exercise built
    from this dialogue was checked by hand -- no distractor restates the
    fact under test using the same speaker's other line (e.g. the exercise
    asking which line requests the documents has Pracownik's other lines
    as distractors, and neither the greeting nor the deposit-amount
    question mentions documents).

    Cross-checked per §11: required documents (dowód osobisty + PESEL),
    deposit amount (sto złotych), and the account's final "gotowe" status
    are each stated exactly once and never contradicted elsewhere.

    Cross-file vocabulary note: every word this file's exercises test,
    including recap words (Dzień/dobry/Proszę/dziękuję/jest/mam/i/w/Tak/
    Czy/numer/chcę/chce/pan/bardzo), is redeclared via this file's own
    lesson01 recap card, per the compiler's per-FILE untaught-vocabulary
    check. Pending fresh-context review per AUTHORING_GUIDE §9; not
    self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson03.exercise09 grammar_check -- scrambled prompt "Sto złotych chcę
    wpłacić." is a fully natural Polish sentence (the normal answer-focus
    order after "Ile pieniędzy...?"), so the item taught a correct sentence as
    wrong -> "Wpłacić złotych chcę sto." (false-grammar);
    lesson03.exercise05.read_account_ready -- prompt showed only the question
    "Czy konto Marka jest już gotowe?" -> now shows the employee's line
    "Świetnie. Konto jest gotowe." (comprehension-without-text). NATIVE CHECK:
    lesson01.exercise08 "Konto mam." and lesson02.exercise07 "Konto bankowe
    chciałbym otworzyć." are topicalized but grammatical -- confirm they work
    as fix-the-order prompts.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

    Second-pass review 2026-10-19: 3 fixes - teach.swietnie_gotowe called Świetnie/gotowe "dwa nowe słowa" though Świetnie is A1 unit03 and gotowe is unit21 -> now a recap; lesson01.exercise08 grammar_check prompt "Konto mam." is a grammatical Polish sentence (two words, either order valid) taught as wrong -> exercise now "W mam konto banku." -> Mam konto w banku (banku added to the bank card's introduced_tokens; it is in its example); lesson02.exercise07 prompt "Konto bankowe chciałbym otworzyć." is grammatical (topicalized) -> "Konto chciałbym bankowe otworzyć." (genuinely broken NP). NATIVE/CANON FLAG: Marek is from Canada (A1 unit01) yet has a dowód osobisty, which is issued only to Polish citizens -- consistent only if he holds Polish citizenship; a foreigner would show a passport/karta pobytu.

