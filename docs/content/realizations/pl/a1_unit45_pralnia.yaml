  register_policy: 'Teach standard Polish as used across Poland. Polish marks a real formal/informal distinction the way German Sie/du or Spanish usted/ tú do, but with an extra wrinkle: the formal "you" itself splits by the addressee''s gender (pan for a man, pani for a woman), and formal verb forms agree with pan/pani as third-person subjects ("pan jest" literally "the gentleman is", not a true second-person form). Teach pan/pani for an unfamiliar adult or a professionally respectful register, and ty for a friend, peer, or informal setting. Don''t teach vy-style plural-as-formal patterns or regional forms in this introductory unit.'
