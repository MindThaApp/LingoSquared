  notes: >-
    Eighth Polish B1 unit, continuing from pl/b1_unit07_reklamacja.yaml.
    Realizes universal.b1.hypotheticals.express_regret_and_past_wishes
    (docs/content/universal_spine.yaml: "Express regret and wishes about
    the past -- say what you wish had happened, what you should have
    done, or what would have been different, using past-hypothetical
    constructions").

    Grammar step-up, deliberate and disclosed: two past-hypothetical
    regret constructions per the dispatch's explicit instruction --
    "żałuję, że nie" + past tense (I regret that I didn't..., for wishing
    something had been different) and "trzeba było" + infinitive (it was
    necessary to.../should have..., for past obligation-regret), plus
    "powinniśmy byli" (we should have), the past-tense extension of
    unit06's "powinniśmy" built the same way English extends "should" to
    "should have" -- a genuine, disclosed step-up from present should-
    advice to past should-have-regret. Register returns to Ewa and
    Marek's established informal ty (this unit is back to a private
    conversation between them, not a service exchange like unit07).

    Scenario: Ewa and Marek talk about a skiing trip to the mountains
    (Zakopane) they did NOT take last winter, because Marek was too busy
    at work -- a self-contained, fresh regret with no prior mention
    anywhere in the pl corpus, so nothing here can contradict an earlier
    unit's stated fact. Deliberately NOT a callback to unit01's
    hypothetical job-change scenario (Marek's "gdybym zmienił pracę,
    zostałbym nauczycielem" is about an imagined DIFFERENT present, not a
    real missed past opportunity) -- keeping the two units' subject
    matter distinct avoids any risk of the two constructions bleeding
    into each other's exercises.

    Character canon check (item 6 of the authoring checklist): grepped
    pl/b1_unit01-07 before writing. Marek's engineer job (established
    a1_unit17, reaffirmed b1_unit03) is the stated REASON he was too busy
    to go -- consistent with, not contradicting, his known occupation.
    Ewa and Marek's informal ty register is unchanged. No new facts are
    asserted about Kasia (unit05) or the Konsultantka (unit07, a one-off
    character who does not reappear here).

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage). No public-domain intermediate Polish
    course exists to adapt from (same finding as prior units). Authored
    from established modern Polish grammar conventions -- both "żałować,
    że" + indicative past and "trzeba było" + infinitive double-checked
    against standard Polish reference grammar before writing any example
    sentence.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says -- no
    distractor restates the fact under test using the same speaker's
    other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the trip not taken (narty w
    Zakopanem, skiing in Zakopane, last winter), the stated reason (Marek
    too busy at work), and both characters' regrets (Ewa: żałuje, że nie
    pojechali; Marek: agrees, trzeba było zarezerwować wcześniej / mówi,
    że powinniśmy byli zarezerwować bilety wcześniej) are each stated
    exactly once and never contradicted elsewhere in the file.

    Feminine first-person production variants: per the dispatch's binding
    rule #6, every production exercise where Ewa (a woman) is the
    speaker uses feminine-agreeing forms (żałowałam, powinnam była), and
    the overlay's accepted_answers include these as the primary form
    where Ewa is the one speaking; masculine forms (żałowałem, powinienem
    był) are used and accepted where Marek is the speaker.

    Culminating exercise (lesson04, per authoring checklist item 7): the
    outcome's can_do names BOTH "what you wish had happened" (żałuję, że
    nie) AND "what would have been different"/"should have done" (trzeba
    było/powinniśmy byli) -- lesson04's writing_prompt exercise requires
    the learner to produce BOTH a regret-wish sentence and a should-have
    sentence about the same missed trip in one response, not just drill
    either construction alone.

    Cross-file vocabulary note: this file recaps its own basic words
    (jest, mam, dobry, powinniśmy) via lesson01's recap card, per the
    compiler's per-FILE untaught-vocabulary check -- does not rely on any
    other pl file having been compiled first. Pending fresh-context
    review per AUTHORING_GUIDE #9; not self-certified.

