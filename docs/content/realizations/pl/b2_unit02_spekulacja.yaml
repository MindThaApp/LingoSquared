            target: {text: "Może. Nie wiem tego na pewno.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit02.lesson06.teach.grammar_pelna_spekulacja
            kind: grammar_note
            target: {text: "Tomka jeszcze nie ma. Pewnie stoi w korku. Mógł zaspać, ale to musiał przegapić pociąg.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit02.lesson06.exercise01.comprehend_first_cause
            type: dialogue_comprehension
            tested_text: "stoi w korku"
            media_asset_key: pl.b2.audio.spekulacja.dialogue.tomek_spozniony.01
            prompt: {target_blocks: [{text: "What is Ewa's first explanation for why Tomek is late?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit02.lesson06.exercise02.comprehend_certainty
            type: dialogue_comprehension
            tested_text: "to niemożliwe"
            media_asset_key: pl.b2.audio.spekulacja.dialogue.tomek_spozniony.01
            prompt: {target_blocks: [{text: "When Ewa says 'to niemożliwe' about oversleeping, how certain is she, and why?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit02.lesson06.exercise03.comprehend_guess
            type: dialogue_comprehension
            tested_text: "nie wiem tego na pewno"
            media_asset_key: pl.b2.audio.spekulacja.dialogue.tomek_spozniony.01
            prompt: {target_blocks: [{text: "Is Ewa's final line ('Może. Nie wiem tego na pewno.') a deduction or a guess?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit02.lesson06.exercise04.order_widzialam
            type: word_order
            tested_text: "Widziałam go dziś rano"
            prompt: {target_blocks: []}
            word_bank: [Widziałam, go, dziś, rano]
          - content_key: pl.b2.unit02.lesson06.exercise05.speak_musi_korku
            type: speak_response
            tested_text: "Musi stać w korku"
            prompt: {target_blocks: [{text: "Tomek's car is gone and it's rush hour, but he isn't here. Speculate aloud about the present cause, using musi (deduction): He must be stuck in traffic.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit02.lesson06.exercise06.write_past_and_present
            type: writing_prompt
            tested_text: "Musiał przegapić pociąg. Pewnie stoi w korku."
            prompt: {target_blocks: [{text: "Write TWO Polish sentences speculating about why Tomek is late, at DIFFERENT certainty levels. (1) A PAST cause you are sure of (deduction), using musiał: He must have missed the train. (2) A PRESENT cause you are less sure of, using pewnie: He is probably stuck in traffic.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit02.lesson06.exercise07.respond_speculate
            type: dialogue_response
            tested_text: "Pewnie stoi w korku"
            prompt: {target_blocks: [{text: "Dlaczego Tomek się spóźnia?", language_code: pl, direction: ltr}]}
