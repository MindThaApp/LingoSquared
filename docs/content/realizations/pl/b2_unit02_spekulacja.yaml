generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's
    second B2 unit (speculation). Same "no adaptable upper-intermediate
    public-domain Polish source exists" outcome as pl's first B2 unit;
    built from established modern Polish grammar/discourse knowledge.
    Structural exemplar: docs/content/realizations/nl/b2_unit02_speculatie.yaml,
    consulted ONLY for unit shape -- every Polish sentence below is
    authored fresh from Polish grammar, not translated or calqued from
    the Dutch text. Character canon: Marek and Ewa continue from pl's
    B2 unit01 (grepped again before writing; no new facts introduced
    about either that would conflict with pl/b1_*.yaml or unit01).
    Tomek is a NEW character (the absent, late friend) -- grepped the
    whole pl/ corpus for "Tomek" before use; unused, so introducing him
    here creates no canon collision (unlike "Piotr", which already has
    an established formal-register workplace context in b1_unit15 that
    this unit's informal scenario should not touch).
review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Second Polish B2 unit; first speculation unit. Targets the CEFR B2
    speculation outcome
    (universal.b2.speculation.hypothesize_about_causes_and_consequences):
    speculate about causes and consequences with graded certainty -- say
    what may/might/must/cannot be the case in the PRESENT and the PAST,
    and distinguish deduction (evidence-based) from guesswork. Theme: one
    coherent everyday puzzle across all six lessons -- a friend (Tomek) is
    late and Marek/Ewa speculate why. Lesson arc: L01 the certainty scale
    (może / prawdopodobnie / pewnie / na pewno / bez wątpienia) applied to
    a present cause; L02 present deduction from evidence (musi + infinitive
    / nie może + infinitive); L03 tentative possibility and the
    deduction-vs-guess line (mógłby / chyba / zgaduję, że / nie wiem na
    pewno); L04 PAST speculation, using Polish's own modal+infinitive
    economy rather than a calqued perfect (musiał przegapić / musiało się
    coś stać / mógł zaspać); L05 an argumentative/narrative reading that
    separates asserted fact from speculation; L06 the culminating
    production -- a Marek/Ewa dialogue for the listening requirement (rank
    certainty + deduce-vs-guess), a speaking task, and a writing task that
    requires speculating about a PAST cause AND a PRESENT cause at
    DIFFERENT certainty levels. Register: informal ty throughout, per pl's
    established lane pin; Marek and Ewa continue their established
    register. All vocabulary is introduced self-contained within this
    file (B2 is a separate Course row from B1). No sibling-direction file
    (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    lesson01.exercise03 matching -- confusable rights pewnie 'surely (I
    bet)' / na pewno 'certainly / for sure' / bez watpienia
    'undoubtedly' (three English synonyms) -> 'I bet / most likely' /
    'for sure' / 'without a doubt'; (2) lesson03.exercise03 matching --
    chyba 'perhaps / I guess' collided with zgaduje, ze 'I guess
    that...' -> chyba 'perhaps'; (3) lesson01.exercise02 -- distractor
    'He's probably on the way.' is a valid reading of 'Pewnie jest w
    drodze' (pewnie colloquially = probably) -> 'Maybe he's on the way.'
    / 'He isn't on the way.'; (4) teach.wiec note falsely said no comma
    precedes wiec (and contradicted its own example) -> comma always
    precedes it; (5) reading lesson05 -- 'Jedno jest pewne: jeszcze nie
    jest w domu, bo jego auto zniknelo' ('he is not home YET', illogical
    when his car is gone) -> 'nie ma go w domu' (+ gloss); (6) reading
    gloss tego wrongly attributed the genitive to 'na pewno' -> genitive
    of negation after nie wiem; (7) missing accepted answers: 'Jest
    prawdopodobnie w drodze' (taught order), 'Jest bez watpienia
    zajety', 'Jeszcze nie ma Tomka', 'Musi byc w korku' (taught in
    teach.musiec example; lesson02.ex05 + lesson06.ex05), 'Chyba jeszcze
    jest w domu'. NATIVE CHECK: whether pewnie really sits ABOVE
    prawdopodobnie on the certainty scale (most speakers treat pewnie as
    colloquial 'probably'); the lesson06 writing task pairs 'he must
    have missed the train' with 'he is probably stuck in traffic' (train
    vs car) -- confirm the scenario reads coherently; 'Moze zaspal' in
    an evening scenario. Prior native-check priorities (moved here from
    required_next_reviewer): Native-Polish confirmation needed. This is
    a DRAFT. Priority checks for the reviewer: (1) naturalness of the
    certainty scale (może < prawdopodobnie < pewnie < na pewno < bez
    wątpienia) and that "pewnie" reads as the intended colloquial
    deduction hedge, not as an adverb of "pewny" out of context; (2)
    that "musi/musiał + infinitive" for present/past epistemic deduction
    reads naturally throughout (Polish modal + infinitive, not a
    Dutch-style "have"-perfect calque -- flagged explicitly in the
    overlay); (3) whether "przegapić pociąg" (to miss the train) and
    "zaspać" (to oversleep, non-reflexive) are the idiomatic everyday
    choices; (4) the deliberate homographs "może" (maybe / can-3sg) and
    "stać" (to stand / stać się to happen) -- confirm no exercise in
    this file accidentally tests the bare ambiguous form
    (lesson02/lesson04 use multi-word phrases specifically to avoid
    this); (5) the culminating writing exercise (lesson06 exercise06) is
    graded against a fixed two-sentence string -- confirm the
    accepted-answer punctuation variants are complete.

    Follow-up fix 2026-10-17: lesson05 exercise01-04
    (reading_comprehension) -- prompt showed only the English question,
    never the Polish passage it asks about -> the lesson05 reading passage
    (teach.tekst) is now shown as a pl target_block before each question
    (comprehension-without-text, same fix as unit05). Keys and distractors
    re-checked against the passage: keyed answers true, distractors
    false/unstated. Overlay unchanged (no mirrored strings).

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    Informal ty throughout (pl's established lane pin). B2 speculation
    layers modal verbs and adverbs of deduction onto that register --
    musi, nie może, mógłby, mógł, pewnie, na pewno, bez wątpienia,
    prawdopodobnie -- while keeping everyday informal address established
    for Marek and Ewa.

