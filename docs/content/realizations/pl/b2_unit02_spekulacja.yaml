            prompt: {target_blocks: []}
          - content_key: pl.b2.unit02.lesson01.exercise03.match_certainty_words
            type: matching_pairs
            tested_text: "może prawdopodobnie pewnie na pewno bez wątpienia w drodze spóźnia się jeszcze nie ma"
            prompt: {target_blocks: []}
            pairs:
              - {left: może, right: maybe}
              - {left: prawdopodobnie, right: probably}
              - {left: pewnie, right: "I bet / most likely"}
              - {left: "na pewno", right: "for sure"}
              - {left: "bez wątpienia", right: "without a doubt"}
              - {left: "w drodze", right: "on the way"}
