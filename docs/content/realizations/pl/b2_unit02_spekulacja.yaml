            target: {text: "pewnie", language_code: pl, direction: ltr}
            introduced_tokens: [pewnie]
            example: {text: "Pewnie jest w drodze.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit02.lesson01.teach.na_pewno
            kind: phrase
            target: {text: "na pewno", language_code: pl, direction: ltr}
            introduced_tokens: [na, pewno]
