            target: {text: "zajęty", language_code: pl, direction: ltr}
            introduced_tokens: [zajęty, jest]
            example: {text: "Bez wątpienia jest zajęty.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit02.lesson01.teach.grammar_pewnosc
            kind: grammar_note
            target: {text: "Może jest w drodze. Prawdopodobnie jest w drodze. Pewnie jest w drodze. Na pewno jest w drodze. Bez wątpienia jest w drodze.", language_code: pl, direction: ltr}
