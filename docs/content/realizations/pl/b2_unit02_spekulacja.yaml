      - content_key: pl.b2.unit02.lesson05.fakt_czy_spekulacja
        title: "Fakt czy spekulacja?"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
          - content_key: pl.b2.unit02.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                Tomek miał przyjść wieczorem, ale jeszcze go nie ma. Jego
                telefon jest wyłączony. Pewnie stoi w korku, bo jest
                szczyt. Może zaspał, ale nie wiem tego na pewno. Jedno
                jest pewne: nie ma go w domu, bo jego auto
                zniknęło.
              language_code: pl
              direction: ltr
            introduced_tokens: [miał, przyjść, wieczorem, telefon, wyłączony, szczyt, tego, jedno, pewne]
        exercises:
          - content_key: pl.b2.unit02.lesson05.exercise01.read_fact
            type: reading_comprehension
            tested_text: "jego auto zniknęło"
            prompt:
              target_blocks:
                - {text: "Tomek miał przyjść wieczorem, ale jeszcze go nie ma. Jego telefon jest wyłączony. Pewnie stoi w korku, bo jest szczyt. Może zaspał, ale nie wiem tego na pewno. Jedno jest pewne: nie ma go w domu, bo jego auto zniknęło.", language_code: pl, direction: ltr}
                - {text: "Which of these does the writer state as a FACT, not as speculation?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit02.lesson05.exercise02.read_guess
            type: reading_comprehension
            tested_text: "może zaspał"
            prompt:
              target_blocks:
                - {text: "Tomek miał przyjść wieczorem, ale jeszcze go nie ma. Jego telefon jest wyłączony. Pewnie stoi w korku, bo jest szczyt. Może zaspał, ale nie wiem tego na pewno. Jedno jest pewne: nie ma go w domu, bo jego auto zniknęło.", language_code: pl, direction: ltr}
                - {text: "Which cause does the writer only GUESS at, admitting they are not sure?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit02.lesson05.exercise03.read_deduction
            type: reading_comprehension
            tested_text: "pewnie stoi w korku"
            prompt:
              target_blocks:
                - {text: "Tomek miał przyjść wieczorem, ale jeszcze go nie ma. Jego telefon jest wyłączony. Pewnie stoi w korku, bo jest szczyt. Może zaspał, ale nie wiem tego na pewno. Jedno jest pewne: nie ma go w domu, bo jego auto zniknęło.", language_code: pl, direction: ltr}
                - {text: "How certain is the writer that Tomek is stuck in traffic, and on what basis?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit02.lesson05.exercise04.read_evidence
            type: reading_comprehension
            tested_text: "jego auto zniknęło"
            prompt:
              target_blocks:
                - {text: "Tomek miał przyjść wieczorem, ale jeszcze go nie ma. Jego telefon jest wyłączony. Pewnie stoi w korku, bo jest szczyt. Może zaspał, ale nie wiem tego na pewno. Jedno jest pewne: nie ma go w domu, bo jego auto zniknęło.", language_code: pl, direction: ltr}
                - {text: "What is the writer's evidence that Tomek is not at home?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit02.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "wieczorem telefon wyłączony szczyt jedno pewne"
            prompt: {target_blocks: []}
            pairs:
              - {left: wieczorem, right: "in the evening"}
              - {left: telefon, right: phone}
              - {left: wyłączony, right: "switched off"}
              - {left: szczyt, right: "rush hour / peak"}
              - {left: jedno, right: "one thing"}
              - {left: pewne, right: certain}
          - content_key: pl.b2.unit02.lesson05.exercise06.translate_telefon_wylaczony
            type: translation
            tested_text: "Jego telefon jest wyłączony"
            prompt: {target_blocks: [{text: "Translate into Polish: His phone is switched off.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit02.lesson05.exercise07.write_szczyt
            type: writing_prompt
            tested_text: "Jest szczyt"
            prompt: {target_blocks: [{text: "Write in Polish: It is rush hour.", language_code: en, direction: ltr}]}

      - content_key: pl.b2.unit02.lesson06.spekulowanie_w_rozmowie
        title: "Spekulowanie w rozmowie"
        spine_outcome_id: universal.b2.speculation.hypothesize_about_causes_and_consequences
        teaching:
          - content_key: pl.b2.unit02.lesson06.teach.widzialam_dzis_rano
            kind: phrase
            target: {text: "Widziałam go dziś rano.", language_code: pl, direction: ltr}
