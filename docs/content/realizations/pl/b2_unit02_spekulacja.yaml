            introduced_tokens: []
          - content_key: pl.b2.unit02.lesson06.teach.dialogue_ewa_deduction
            kind: dialogue
            target: {text: "Pewnie stoi w korku. Jest szczyt.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit02.lesson06.teach.dialogue_marek_possibility
            kind: dialogue
            target: {text: "Mógł zaspać?", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit02.lesson06.teach.dialogue_ewa_rule_out
            kind: dialogue
            target: {text: "Nie, to niemożliwe. Widziałam go dziś rano.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit02.lesson06.teach.dialogue_marek_past_deduction
            kind: dialogue
            target: {text: "To musiał przegapić pociąg.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit02.lesson06.teach.dialogue_ewa_guess
