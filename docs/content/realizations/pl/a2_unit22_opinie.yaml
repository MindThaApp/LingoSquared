  notes: >-
    Second Polish A2 unit, continuing from pl/a2_unit21_sprawy_urzedowe.yaml.
    Realizes universal.a2.opinions.give_opinions_with_reasons -- confirmed
    against docs/content/universal_spine.yaml (line 710): can_do "Express an
    opinion about a familiar topic, support it with a simple reason, and
    respond to someone else's opinion," prerequisites
    [universal.a1.preferences.express_preferences,
    universal.a1.comparisons.make_basic_comparisons], both satisfied by this
    course's own unit13/unit14.

    Scenario: Ewa and Marek, back in their established informal ty-register
    with each other (unit01-20's own precedent), disagree about a
    restaurant, Restauracja Bella -- Ewa likes it (good food), Marek thinks
    it's too expensive. A genuine two-sided opinion-and-reason exchange, not
    a one-sided statement.

    A2-level step-up from A1, deliberate and disclosed: (1) **moim
    zdaniem** (in my opinion, a fixed instrumental-case phrase, taught as a
    memorized unit rather than analyzed grammar) as the sentence-opening
    opinion marker. (2) A real **bo** (because) reason clause, the casual
    spoken-register sibling of unit21's formal **ponieważ** -- deliberately
    different connector for a deliberately different register, matching
    real Polish usage (bo in casual chat, ponieważ with an official). (3)
    The intensifier **za** + adjective ("za droga" -- too expensive), a
    genuine new grammar pattern. (4) **Zgadzam się / nie zgadzam się** (I
    agree / I disagree), reflexive verbs used to respond to someone else's
    stated opinion, directly serving the spine's "respond to someone else's
    opinion" requirement. Grepped introduced_tokens across pl/a1_unit01-20
    and pl/a2_unit21 for zdaniem/bo/za/zgadzam -- zero hits, confirming this
    is genuinely new material, not relabeled A1 content (unit21's "bo"-
    adjacent "ponieważ" is a different word).

    Source-access research: firecrawl still shows 0/1,000 credits (same
    outage as unit21 today). Grepped the cached FSI Polish FAST text for
    "moim zdaniem"/"opinia"/"zgadzam" -- zero hits for all three; this is
    an everyday-conversation topic the 1992 survival-phrasebook-style FSI
    FAST course never covers. Authored from established modern
    conversational Polish conventions (moim zdaniem, zgadzać się/nie
    zgadzać się are the standard, textbook-taught way to state and respond
    to opinions), not adapted from any external source.

    Same-speaker-distractor check: lesson03's dialogue has two speakers,
    Ewa (2 lines) and Marek (2 lines). Ewa: "Moim zdaniem restauracja jest
    dobra, bo jedzenie jest smaczne." / "Może masz rację, ale lubię tam
    jeść." Marek: "Nie zgadzam się. Moim zdaniem jest za droga." / "Dobrze,
    spróbuję jeszcze raz." Every multiple_choice/dialogue_comprehension/
    reading_comprehension exercise built from this dialogue was checked by
    hand -- no distractor restates the fact under test using the same
    speaker's other line (e.g. exercise01 asks which line disagrees and
    calls it too expensive; Marek's other line is a closing concession that
    never mentions price or agreement/disagreement).

    Cross-checked per §11: the restaurant's name (Restauracja Bella) and
    the two opinions about it (Ewa: good because the food is tasty; Marek:
    too expensive) are stated once each and never contradicted elsewhere in
    the file.

    Cross-file vocabulary note: every word this file's exercises test,
    including recap words (jest, są, to, tak, nie, ale, bardzo, lubię,
    restauracja, może, tam, jeść), is redeclared via this file's own recap
    cards before being tested, exactly like every prior unit's convention
    for a brand-new file -- the compiler validates untaught vocabulary per
    FILE, not per course. Pending fresh-context review per AUTHORING_GUIDE
    §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    teach.sprobuje_jeszcze_raz example -- "Spróbuję jeszcze raz tę
    restaurację." -> "Spróbuję jeszcze raz jutro." (spróbować governs the
    genitive; the accusative object was wrong/unnatural);
    lesson03.exercise05.read_ewas_opinion -- prompt showed only a question, no
    text -> now shows dialogue line01 + line02 (comprehension-without-text).
    NATIVE CHECK: lesson02.exercise07 scrambled prompt "Zdaniem moim jest za
    droga." -- *zdaniem moim* is a grammatical (bookish) inversion, so a
    fix-the-order item may teach a valid form as wrong; also teach.opinia
    example "Mam opinię o filmie." naturalness.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

    Second-pass review 2026-10-19: 0 fixes. NATIVE FLAGS: lesson02.exercise07 grammar_check "Zdaniem moim jest za droga." -- postposed zdaniem moim is formal/literary but arguably grammatical (feedback calls it wrong); lesson03.exercise09 "Rację masz może." likewise; teach.opinia example "Mam opinię o filmie." may read stiff (vs. "Mam zdanie o filmie").

