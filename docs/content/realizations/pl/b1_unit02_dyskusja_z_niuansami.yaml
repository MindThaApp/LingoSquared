review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Second Polish B1 unit, continuing from pl/b1_unit01_warunki_
    hipotetyczne.yaml. Realizes universal.b1.opinions.debate_with_
    concession_and_nuance (docs/content/universal_spine.yaml: "Debate a
    topic with nuance -- concede a valid point on the other side using a
    concessive connector ('although'/'even though') before restating your
    own position, and use a stronger contrastive connector than a simple
    'but' to structure a multi-point argument," prerequisites
    [universal.a2.opinions.give_opinions_with_reasons], satisfied by pl's
    existing a2_unit22_opinie.yaml, which already established Ewa and
    Marek's own opinion-giving vocabulary: moim zdaniem, myślę że, bo).

    Grammar step-up, deliberate and disclosed: two concessive connectors
    (chociaż -- although, the lighter/more everyday form; mimo że -- even
    though, a stronger, slightly more formal synonym), the contrastive
    connector jednak (however), which structures a stronger pivot than
    unit22's "ale" (but), and the two-sided "z jednej strony... z drugiej
    strony" (on one hand... on the other hand) for genuinely multi-point
    arguments -- the exact "structure a multi-point argument" requirement
    named in the spine outcome's own can_do text.

    Genitive-case note threaded through per the standing instruction that
    Polish's case system should feature prominently at B1: the impersonal
    verb "brakuje" (to be lacking) always governs a genitive object --
    "brakuje mi kontaktu z ludźmi" (I miss/lack contact with people,
    literally "is-lacking to-me of-contact"), a genuinely different case
    pattern from unit01's instrumental/genitive-after-preposition examples.

    Scenario: continues Ewa and Marek's established informal ty register.
    Topic is a genuine, modern, two-sided debate -- remote work
    (praca zdalna) versus office work (praca w biurze) -- with Ewa arguing
    for the office and Marek arguing for remote work, each conceding one
    real point to the other before restating their own position, per the
    spine outcome's own concession-then-restate structure. Deliberately a
    different topic from unit01's hypotheticals (jobs/cities) to avoid
    thematic repetition within the same course.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage). No public-domain intermediate Polish course
    exists to adapt from (same finding as unit01). Authored from
    established modern Polish grammar/register conventions.

    Same-speaker-distractor check (lesson03's 8-line dialogue, Ewa 4
    lines / Marek 4 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says -- no
    distractor restates the fact under test using the same speaker's
    other line.

    Cross-checked per AUTHORING_GUIDE.md #11: Ewa's stated concession
    (remote work saves commute time) and her stated main position (she
    still prefers the office, for contact with people), and Marek's
    stated concession (the office has better spontaneous contact) and his
    stated main position (he still prefers remote work, for
    concentration), are each stated exactly once and never contradicted
    elsewhere in the file.

    Cross-file vocabulary note: this file recaps its own basic connective
    words (moim zdaniem, myślę, że, bo, lubię) via lesson01's recap card,
    per the compiler's per-FILE untaught-vocabulary check -- does not rely
    on unit01 or any other pl file having been compiled first. Pending
    fresh-context review per AUTHORING_GUIDE #9; not self-certified.
    FRESH-CONTEXT REVIEW COMPLETE 2026-07-11 per AUTHORING_GUIDE §20.
    FIXED: lesson03 exercise08's fill_in_blank context text read the
    ungrammatical "Z drugiej stronie" where the preposition "z" + "strony"
    requires the genitive -- corrected to "Z drugiej strony" (now matches
    this unit's own overlay feedback for that exercise and dialogue line05).
    FLAGGED for a native pass, not fixed (style calls, not learner-facing
    grading bugs): (a) lesson01 exercise07's grammar_check displays
    "...chociaż lubię biuro to." with a dangling "to" -- the item is
    answerable (the English target is in the instruction and grading is on
    accepted_answers) and simply deleting "to" would leave a fully natural
    sentence on screen, risking a false-negative for a learner who resubmits
    it, so it is left for a native reviewer to re-scramble properly; (b) all
    "fix the word order" grammar_checks in this B1 batch treat the neutral
    clause order as the single "natural" order although Polish permits marked
    variants -- a defensible B1 scaffold, native-review style call. status
    set to reviewed.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

    Second-pass review 2026-10-19: 3 fixes - lesson01.exercise07
    grammar_check "Wolę pracować zdalnie, chociaż lubię biuro to." (dangling
    "to"; deleting it leaves a correct sentence the item graded wrong) ->
    rebuilt around a real error, "wolę pracuję" (wolę + infinitive);
    "Pracuję" added to teach.biuro's introduced_tokens (it is in that card's
    example); lesson03.exercise09 prompt "Czas na dojazd oszczędza mi jednak
    praca zdalna." is grammatical topicalized Polish -> "...oszczędza mi na
    czas dojazd." (broken czas na dojazd phrase). lesson02.exercise05
    word_bank reshuffled (biuro, Jednak, wolę) because the overlay now also
    accepts Wolę jednak biuro, which the old displayed order spelled out. The earlier native flag
    (a) is resolved by the first fix. NATIVE FLAGS: Ewa is a teacher at a
    school (A1 unit17) yet argues office vs remote work as if she works in
    an office and misses colleagues when remote -- plausible but loose;
    lesson04.exercise07 dialogue_response prompt "Co sądzisz o pracy
    zdalnej?" uses sądzisz/pracy/zdalnej, not taught in this course.

