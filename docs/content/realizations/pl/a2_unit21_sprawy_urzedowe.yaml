review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    First Polish A2 unit, continuing directly from pl/a1_unit20_clothing.yaml
    (same Ewa/Marek pair, same course). Realizes
    universal.a2.bureaucracy.register_with_authorities -- confirmed directly
    against docs/content/universal_spine.yaml (line 684): can_do "Handle a
    basic in-person or phone appointment to register with local authorities
    and understand what is required," prerequisites
    [universal.a1.introductions.exchange_identity,
    universal.a1.housing.describe_home,
    universal.a1.communication.basic_phone_contact]. The first two are
    satisfied by this course's own unit01/unit18; pl has not authored a
    dedicated phone-contact unit yet, so per universal_spine.yaml's own
    "a realization may teach prerequisites concurrently" allowance, this
    unit does not depend on phone contact at all -- the scene is a real
    in-person office visit, matching the outcome's own "in-person or phone"
    wording (in-person is a fully valid realization of the same can_do).

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence. Zero
    listen_type/listen_select/listen_order exercises, matching this course's
    own unit01-20 convention (no audio pipeline exists for pl yet) --
    media_assets is an empty list, not an oversight. Scenario: Ewa moved
    into a new mieszkanie and must register her residence
    (zameldować się) at the urząd within the legal window -- a genuine,
    common Polish civic errand, not an invented institution.

    A2-level step-up from A1, deliberate and disclosed: (1) **chciałabym**
    (I would like to, feminine conditional of chcieć) replaces A1's bare
    **chcę** as the polite register for a formal request -- a genuine new
    grammar point (conditional mood), not just harder vocabulary. (2) A real
    subordinate reason clause with **ponieważ** (because), joining two full
    clauses ("Chciałabym się zameldować, ponieważ się przeprowadziłam.").
    (3) Reflexive past tense **przeprowadziłam się** (I moved/relocated,
    feminine) -- this course's first past-tense reflexive verb. (4) The
    modal **muszę** (I must/have to) in a real question ("Do kiedy muszę się
    zameldować?"). None of these were used in any pl A1 unit (spot-checked
    by grepping introduced_tokens across pl/a1_unit01-20 for
    chciałabym/ponieważ/przeprowadziłam/muszę -- zero hits), confirming this
    is genuinely new grammar, not a relabeled A1 point.

    Source-access research (done first, per standing instruction): checked
    firecrawl availability before any search -- `firecrawl --status` showed
    0/1,000 credits remaining this cycle, and a live `firecrawl search`
    attempt for this unit's topic returned "Error: Request failed with
    status code 402" (payment required), matching the known outage other
    sessions hit today. Fell back to the already-cached FSI Polish FAST
    (1992) text (.firecrawl/fsi-polish-fast.txt, present on disk) and
    grepped fresh for this unit's own topic: "urząd" (6 hits, all inside an
    unrelated noun-declension drill listing cognates like bank/park/urząd
    as examples of masculine -u-ending nouns, never a real registration
    scene), "meldunek"/"zameldow"/"PESEL" (0 hits each). Honest conclusion:
    the cached FSI text has no usable registration/bureaucracy scene at
    all -- this unit's vocabulary and dialogue are authored from
    established, standard modern Polish civic-registration conventions
    (zameldowanie, dowód osobisty, umowa najmu as proof of address), not
    adapted from any external source.

    Same-speaker-distractor check (AUTHORING_GUIDE, standing bug-class
    warning): lesson03's dialogue has two speakers, Urzędniczka (4 lines)
    and Ewa (3 lines). Urzędniczka's lines: "Dzień dobry! W czym mogę
    pomóc?" / "Jaki jest pani nowy adres?" / "Proszę dowód osobisty i umowę
    najmu." / "Ma pani trzydzieści dni od przeprowadzki. Dziękuję, wszystko
    gotowe." Ewa's lines: "Chciałabym się zameldować, ponieważ się
    przeprowadziłam." / "Ulica Kwiatowa dziesięć." / "Proszę bardzo. Do
    kiedy muszę się zameldować?" Every multiple_choice/dialogue_
    comprehension/reading_comprehension exercise built from this dialogue
    was checked by hand against every OTHER line the same speaker says --
    no distractor restates the fact under test (e.g. exercise01 asks which
    line states the address; Ewa's other two lines never mention an
    address at all).

    Cross-checked per §11: every concrete fact stated once is never
    restated differently elsewhere -- new address = "Ulica Kwiatowa
    dziesięć" (stated only in lesson03 line04); required documents = dowód
    osobisty + umowa najmu (stated only in lesson03 line03, and matches
    lesson02's own teaching note about what's needed); deadline = thirty
    days from the move (stated only in lesson03 line07).

    Cross-file vocabulary note: this unit does not assume any pl A1
    vocabulary is still "taught" in this file's own eyes (the compiler
    validates untaught vocabulary per realization FILE) -- every word this
    unit's exercises test, including ordinary recap words like
    Dzień/dobry/Proszę/dziękuję/jest/mam/nowy, is redeclared via this
    file's own lesson01 recap card before being tested, exactly like
    unit18-20's own convention for a brand-new file.

    Source: established modern Polish civic-registration conventions
    (zameldowanie, dowód osobisty, umowa najmu), NOT the cached FSI Polish
    FAST text -- see the source-access paragraph above for the specific
    negative-result search that led to this honest disclosure. Pending
    fresh-context review per AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson03.exercise05.read_required_documents -- prompt showed only the
    question "Jakie dokumenty prosi urzędniczka?" (no text to read, and
    ungrammatical: prosić needs o + acc) -> now shows the clerk's line "Proszę
    dowód osobisty i umowę najmu." (comprehension-without-text). Overlay-side
    fixes listed in en-pl/a2_unit21.yaml. NATIVE CHECK: lesson01.exercise08
    scrambled prompt "Nowy mam adres." is marked but arguably grammatical
    (contrastive topicalization) -- confirm it reads as wrong enough for a
    fix-the-order item.

