          - {"content_key": "pl.a2.unit73.lesson05.exercise03.une_lektura", "type": "matching_pairs", "tested_text": "Padał deszcz i było zimno Na ulicy był korek Autobus jechał wolno Nagle autobus się zepsuł Wysiadłem i szedłem do domu Przestało padać W końcu wróciłem do domu Byłem bardzo mokry", "prompt": {"target_blocks": []}, "pairs": [{"left": "Padał deszcz i było zimno.", "right": "It was raining and it was cold."}, {"left": "Na ulicy był korek.", "right": "There was a traffic jam on the street."}, {"left": "Autobus jechał wolno.", "right": "The bus was going slowly."}, {"left": "Nagle autobus się zepsuł.", "right": "Suddenly the bus broke down."}, {"left": "Wysiadłem i szedłem do domu.", "right": "I got off and walked home."}, {"left": "Przestało padać.", "right": "It stopped raining."}, {"left": "W końcu wróciłem do domu.", "right": "At last I got home."}, {"left": "Byłem bardzo mokry.", "right": "I was very wet."}]}
