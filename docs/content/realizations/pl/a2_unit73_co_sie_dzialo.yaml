          - {"content_key": "pl.a2.unit73.lesson05.teach.gn_ale", "kind": "grammar_note", "target": {"text": "Było ciepło, ale padało. Padało, ale świeciło słońce.", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Było", "ciepło", "ale", "padało", "świeciło", "słońce"]}
          - {"content_key": "pl.a2.unit73.lesson05.teach.lektura", "kind": "reading", "target": {"text": "Wczoraj wieczorem jechałem do domu. Padał deszcz i było zimno. Na ulicy był korek, a autobus jechał wolno. Nagle autobus się zepsuł. Wysiadłem i szedłem do domu. Szedłem długo, aż w końcu przestało padać. W końcu wróciłem do domu. Byłem bardzo mokry.", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Wczoraj", "wieczorem", "jechałem", "do", "domu", "Padał", "deszcz", "i", "było", "zimno", "Na", "ulicy", "był", "korek", "a", "autobus", "jechał", "wolno", "Nagle", "się", "zepsuł", "Wysiadłem", "szedłem", "długo", "aż", "w", "końcu", "przestało", "padać", "wróciłem", "Byłem", "bardzo", "mokry"]}
        exercises:
