          - {"content_key": "pl.a2.unit73.lesson04.teach.pytania3", "kind": "phrase", "target": {"text": "Co się stało? Co się działo? Co się działo wtedy?", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Co", "się", "stało", "działo", "wtedy"]}
