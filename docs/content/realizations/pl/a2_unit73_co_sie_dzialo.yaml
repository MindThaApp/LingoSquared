          - {"content_key": "pl.a2.unit73.lesson05.exercise05.traduce_wrocil", "type": "translation", "tested_text": "W końcu wróciłem do domu", "prompt": {"target_blocks": [{"text": "At last I got home.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit73.lesson05.exercise06.dicta_zepsul", "type": "dictation", "tested_text": "Nagle autobus się zepsuł.", "media_asset_key": "pl.a2.audio.co_sie_dzialo.nagle_autobus_zepsul.01", "prompt": {"target_blocks": []}}
          - {"content_key": "pl.a2.unit73.lesson05.exercise07.dicta_deszcz", "type": "dictation", "tested_text": "Padał deszcz i było zimno.", "media_asset_key": "pl.a2.audio.co_sie_dzialo.padal_deszcz.01", "prompt": {"target_blocks": []}}
      - content_key: pl.a2.unit73.lesson06.ewa_i_marek
        title: "Ewa i Marek rozmawiają"
        spine_outcome_id: universal.a2.past.tell_what_was_happening
        teaching:
          - {"content_key": "pl.a2.unit73.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Dzwoniłam do ciebie wczoraj wieczorem. Dlaczego nie odebrałeś?", "language_code": "pl", "direction": "ltr", "speaker": "Ewa"}, "introduced_tokens": ["Dzwoniłam", "do", "ciebie", "wczoraj", "wieczorem", "Dlaczego", "nie", "odebrałeś"]}
          - {"content_key": "pl.a2.unit73.lesson06.teach.d2", "kind": "dialogue", "target": {"text": "Przepraszam. Wracałem do domu, kiedy autobus się zepsuł.", "language_code": "pl", "direction": "ltr", "speaker": "Marek"}, "introduced_tokens": ["Przepraszam", "Wracałem", "do", "domu", "kiedy", "autobus", "się", "zepsuł"]}
