          - {"content_key": "pl.a2.unit73.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Szedłem do domu w deszczu. Kiedy zadzwoniłaś, padało i nie słyszałem telefonu.", "language_code": "pl", "direction": "ltr", "speaker": "Marek"}, "introduced_tokens": ["Szedłem", "do", "domu", "w", "deszczu", "Kiedy", "zadzwoniłaś", "padało", "i", "nie", "słyszałem", "telefonu"]}
          - {"content_key": "pl.a2.unit73.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "A teraz? Jesteś już w domu?", "language_code": "pl", "direction": "ltr", "speaker": "Ewa"}, "introduced_tokens": ["A", "teraz", "Jesteś", "już", "w", "domu"]}
          - {"content_key": "pl.a2.unit73.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Tak, w końcu wróciłem. Teraz robię herbatę.", "language_code": "pl", "direction": "ltr", "speaker": "Marek"}, "introduced_tokens": ["Tak", "w", "końcu", "wróciłem", "Teraz", "robię", "herbatę"]}
        exercises:
          - {"content_key": "pl.a2.unit73.lesson06.exercise01.escucha_apertura", "type": "listen_select", "tested_text": "Dzwoniłam do ciebie wczoraj wieczorem Dlaczego nie odebrałeś", "media_asset_key": "pl.a2.audio.dialogue.co_sie_dzialo.01", "prompt": {"target_blocks": []}}
          - {"content_key": "pl.a2.unit73.lesson06.exercise02.entiende_deszcz", "type": "dialogue_comprehension", "tested_text": "Szedłem do domu w deszczu", "media_asset_key": "pl.a2.audio.dialogue.co_sie_dzialo.01", "prompt": {"target_blocks": [{"text": "Why did Marek not hear the phone?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit73.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Dlaczego nie odebrałeś Przepraszam Wracałem do domu kiedy autobus się zepsuł I co się działo potem Szedłem do domu w deszczu Padało i nie słyszałem telefonu Jesteś już w domu Teraz robię herbatę", "prompt": {"target_blocks": []}, "pairs": [{"left": "Dlaczego nie odebrałeś?", "right": "Why didn't you answer?"}, {"left": "Przepraszam.", "right": "Sorry."}, {"left": "Wracałem do domu, kiedy autobus się zepsuł.", "right": "I was going home when the bus broke down."}, {"left": "I co się działo potem?", "right": "And what was going on then?"}, {"left": "Szedłem do domu w deszczu.", "right": "I was walking home in the rain."}, {"left": "Padało i nie słyszałem telefonu.", "right": "It was raining and I couldn't hear the phone."}, {"left": "Jesteś już w domu?", "right": "Are you home already?"}, {"left": "Teraz robię herbatę.", "right": "I am making tea now."}]}
          - {"content_key": "pl.a2.unit73.lesson06.exercise04.ordena_wracalem", "type": "word_order", "tested_text": "Wracałem do domu kiedy autobus się zepsuł", "prompt": {"target_blocks": []}, "word_bank": ["Wracałem", "do", "domu", "kiedy", "autobus", "się", "zepsuł"]}
          - {"content_key": "pl.a2.unit73.lesson06.exercise05.responde_odebrales", "type": "dialogue_response", "tested_text": "Wracałem do domu kiedy autobus się zepsuł", "prompt": {"target_blocks": [{"text": "Dzwoniłam do ciebie wczoraj wieczorem. Dlaczego nie odebrałeś?", "language_code": "pl", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit73.lesson06.exercise06.traduce_szedlem", "type": "translation", "tested_text": "Szedłem do domu kiedy zaczęło padać", "prompt": {"target_blocks": [{"text": "I was walking home when it started to rain.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit73.lesson06.exercise07.escribe_opowiadanie", "type": "writing_prompt", "tested_text": "Gotowałem kiedy zadzwonił telefon W tym czasie padało", "prompt": {"target_blocks": [{"text": "Write two Polish sentences about yesterday evening: (1) You were cooking when the phone rang. (2) At that time it was raining.", "language_code": "en", "direction": "ltr"}]}}
