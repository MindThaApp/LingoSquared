    Grammar-scope decision, disclosed up front per unit07-18's own precedent
    for narrowing A1 grammar exposure deliberately rather than by omission:
    (1) **No new grammatical case is introduced anywhere in this file.**
    Every case-marked form this file uses was already established in an
    earlier unit and is simply reused: "w Krakowie" (locative, unit05's own
    "Ona mieszka w Krakowie"), "do parku" (genitive after "do," unit08/09/10's
    own "Restauracja jest blisko parku"/"Jak dojść do parku?"/"Do domu").
    "zimno"/"gorąco"/"pada"/"śnieg"/"mgła" are all either invariant adverbs
    (zimno, gorąco -- no gender/case agreement exists for these forms at
    all) or nominative-only nouns used as grammatical subjects (śnieg after
    pada, mgła after jest) -- no new declension is taught or needed.
    (2) **"dobra" and "straszna" are introduced as exactly two memorized
    nominative feminine adjective FORMS tied to one specific noun each,
    not a paired masculine/feminine adjective set and not a general
    agreement rule** -- the exact same technique unit18 used for "duży"
    (tied only to "dom") and "mała" (tied only to "kuchnia"). "dobra" is
    taught tied to exactly one noun, "pogoda" ("Pogoda jest dobra.");
    "straszna" is taught tied to exactly one different noun, also "pogoda"
    ("Jaka straszna pogoda!"). The masculine forms of either adjective
    (dobry, straszny) are never introduced or tested anywhere in this file
    -- "dobry" already exists in this course from unit12/14 (tied to
    different nouns there), but this file never cross-references or tests
    that fact, keeping the two forms taught here independent and additive
    rather than building an implied paradigm.
    (3) **"jest" + zimno/gorąco/mgła is presented as a fixed, memorized
    sentence pattern specific to weather ("jest" plus an invariant weather
    word), not a new grammar point in kind** -- "jest" itself has been
    pervasively established since unit01 and is explicitly flagged as reused
    vocabulary, not new grammar (matching unit17/18's own explicit flags for
    their own reused "jest"/"mam"/"masz"/"ma").
    (4) **No comparative/superlative, no dative, no vocative, no verb
    conjugation beyond already-established forms (pada as an impersonal
    3rd-person form with no subject is reused exactly as the source itself
    uses it, not conjugated to any other person anywhere in this file)
    appear anywhere in this file.**

    Same-speaker-distractor check (AUTHORING_GUIDE, standing bug-class
    warning): this file has one TEXT dialogue (lesson03, no audio, so the
    literal "same audio clip" bug class doesn't directly apply the same way
    it would for a recorded dialogue -- same reasoning unit09-18 already
    used for their own audio-less dialogues), but the analogous risk for
    multiple_choice line-selection and dialogue_comprehension exercises was
    checked by hand, listing every line each speaker actually says first:
    Marek's three lines: "Jaka dziś jest pogoda?" / "Jaka straszna pogoda!
    Nie chcę iść do parku, bo pada." / "A w Krakowie? Jaka tam jest
    pogoda?"
    Ewa's three lines: "Pada. Jest zimno." / "Ja też nie idę do parku." /
    "W Krakowie pada śnieg. Tam jest bardzo zimno."
    lesson03.exercise01 asks which line says Marek doesn't want to go to the
    park (correct: Marek's second line); distractors are Marek's OWN other
    two lines (line1: a plain question about today's weather, never
    mentions the park; line3: a question about Kraków's weather, never
    mentions the park either) -- neither distractor mentions the park at
    all, so Marek's own other lines never accidentally restate the fact
    being tested.
    lesson03.exercise02 asks which line says Ewa is also not going to the
    park (correct: Ewa's second line); distractors are Ewa's OWN other two
    lines (her first line states today's weather but never mentions the
    park; her third line states Kraków's weather but never mentions the
    park either) -- confirming Ewa's own other lines never accidentally
    restate the fact being tested either.
    lesson03.exercise03 (dialogue_comprehension) shows ONLY Ewa's first line
    ("Pada. Jest zimno.") as the read passage and asks what the weather is
    like today (correct: raining and cold) -- no other weather condition
    appears in this quoted passage, so the question is unambiguous. This
    was deliberately checked against Ewa's OWN third line ("W Krakowie pada
    śnieg. Tam jest bardzo zimno."), which also contains the substring
    "pada" and the word "zimno" -- the instruction is specifically anchored
    to "today" (not Kraków) and the two lines describe genuinely different
    conditions (plain rain vs. snow, in a different city), so a learner who
    has actually read the quoted passage cannot confuse the two, even
    though both lines happen to share some vocabulary.
    lesson03.exercise04 (dialogue_comprehension) shows ONLY Ewa's third line
    ("W Krakowie pada śnieg. Tam jest bardzo zimno.") as the read passage
    and asks what the weather is like in Kraków (correct: snowing and very
    cold) -- no other city or condition appears in this quoted passage.
    No exercise in this file makes two answer options simultaneously true
