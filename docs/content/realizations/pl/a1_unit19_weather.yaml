    lesson content): lesson01.exercise07's fill_in_blank was originally
    drafted as an open "Dziś nie jest zimno. Dziś jest ___." (zimno vs.
    gorąco -- a genuine, undisambiguated either-could-fit slot, and also the
    fact-contradiction caught above) -- rewritten to the fully disambiguated
    "Marek pyta o pogodę: Jaka jest ___?" (only "pogoda" fits this frame).
    Two grammar_check exercises (lesson01.exercise08, lesson02.exercise08)
    were deliberately built around a scramble that is UNAMBIGUOUSLY wrong
    Polish (the interrogative "Jaka" displaced from its required
    sentence-initial position: "Pogoda jaka jest?"; the adjective displacing
    the interrogative: "Straszna jaka pogoda!") rather than a mere
    alternate-but-still-grammatical word order (an early draft considered
    "Śnieg pada." as the "wrong" form of "Pada śnieg.", but Polish's
    genuinely flexible word order makes subject-first weather statements
    defensible too, not cleanly wrong -- swapped for lesson03.exercise09's
    "Krakowie w pada śnieg." instead, a preposition split from its noun,
    which is unambiguously ungrammatical regardless of emphasis or
    register).

