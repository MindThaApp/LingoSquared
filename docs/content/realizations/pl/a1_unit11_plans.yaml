  notes: >-
    Eleventh Polish unit, continuing directly from pl/a1_unit10_routines.yaml
    (same Ewa/Marek pair, same 3-lesson bootstrap pace as units01-10).
    Realizes universal.a1.plans.make_simple_plans -- confirmed directly
    against docs/content/universal_spine.yaml: read the spine file's own
    linear ordering by eye starting right after
    universal.a1.routines.describe_daily_routine (unit10's own outcome), and
    the very next entry in the file is universal.a1.plans.make_simple_plans
    (id + can_do text read directly: "Propose, accept, decline, and
    schedule a simple near-future plan," prerequisites:
    [universal.a1.time.ask_tell_time, universal.a1.dates.
    exchange_calendar_dates]). Both prerequisites are already satisfied --
    pl/a1_unit04_time.yaml realizes universal.a1.time.ask_tell_time and
    pl/a1_unit03_dates.yaml realizes universal.a1.dates.
    exchange_calendar_dates. Checked nl/a1_unit11_plans.yaml purely to
    confirm topic identity (title/outcome match) -- confirming scope only,
    not for any sentence text, character, or lesson-structure reuse.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence. Zero
    listen_type/listen_select/listen_order exercises anywhere in this file,
    matching unit01-10's own established choice -- media_assets is an
    empty list, not an oversight. Because there is no dialogue AUDIO in
    this file, the AUTHORING_GUIDE same-speaker-distractor bug class (a
    listen_select/listen_order distractor that's something the tested
    speaker also says elsewhere in the SAME audio clip) is not directly
    applicable -- explicitly checked and confirmed N/A for that reason,
    same as unit09/unit10.

    The analogous risk for lesson03's TEXT-based dialogue_comprehension and
    line-selection multiple_choice exercises was checked by hand, listing
    every line each speaker actually says first:
    Ewa's three lines: "Czy chcesz iść do kina w piątek?" / "W sobotę?
    Bardzo chętnie!" / "O której godzinie?"
    Marek's three lines: "Niestety, nie mogę w piątek." / "Może w sobotę?"
    / "O czwartej po południu."
    exercise01 (lesson03) asks which line proposes going to the cinema
    (correct: Ewa's "Czy chcesz iść do kina w piątek?"); distractors are
    Marek's "Może w sobotę?" and Ewa's own "O której godzinie?" -- neither
    mentions kino, so there is no ambiguity. exercise02 asks which line
    declines Friday (correct: Marek's "Niestety, nie mogę w piątek.");
    distractors are Marek's own "Może w sobotę?" and Ewa's "W sobotę?
    Bardzo chętnie!" -- both are about Saturday, not a decline of Friday,
    so they don't overlap with the fact actually being tested.
    exercise03 (dialogue_comprehension) asks what day Marek CANNOT make it
    (correct: piątek/Friday, stated once by Marek in his own decline
    line); distractor "sobota" IS a day Marek himself mentions elsewhere
    (he proposes it as the alternative) -- but the question is specifically
    about the day he says he CAN'T do, which is only ever Friday anywhere
    in the file; Saturday is never described as a day he can't make it, so
    the two facts don't contradict each other (checked per AUTHORING_GUIDE
    §11 too: "Marek can't do Friday" and "Marek proposes Saturday" are
    both true simultaneously and consistent throughout). exercise04 asks
    what time they agree to meet (correct: o czwartej po południu/4pm,
    Marek's final line); distractor "w piątek" is a day, not a time, and
    was already declined earlier in the same dialogue -- not something
    ever stated as the agreed time. No exercise in this file makes two
    answer options simultaneously true for the specific fact being asked
    about.

    Grammar-scope decision, disclosed up front per unit07/08/09/10's own
    precedent for narrowing A1 case/verb-form exposure deliberately rather
    than by omission. This unit's own communicative outcome (propose,
    accept, decline, schedule a plan) genuinely requires SOME second-person
    address, unlike unit10's routines unit, which could stay entirely
    first-person -- but the scope below is still deliberately narrow:
    (1) "chcieć" (chcę, chcesz) is introduced fresh -- the first appearance
    of this verb in the pl course. Only the 1st-person-singular (chcę) and
    2nd-person-singular-informal (chcesz) forms are taught or tested;
    3rd-person, plural, and the formal pan/pani address are never used
    anywhere in this file. Critically, "chcesz" is NOT a new grammatical
    CATEGORY -- 2nd-person-singular-informal address was already
    established by "masz" (unit02 "Ile masz lat?", unit05 "Czy masz
    brata lub siostrę?") and "jesteś" (unit01 "Skąd jesteś?"), confirmed
    by directly grepping every prior pl realization file for 2nd-person
    verb forms before writing this file. "chcesz" is simply a new verb
    inflected into that already-known person/register slot, the same
    "reuse an established pattern with a new specific instance" technique
    unit09/unit10 used for genitive nouns and -ować verbs.
    (2) "móc" (mogę, możesz) is introduced fresh in the singular. The
    1st-person-PLURAL "możemy" was already taught (unit03 "Kiedy możemy
    się znowu spotkać?", unit04 "O której godzinie możemy się spotkać..."),
    so mogę/możesz are new specific PERSON forms of a verb whose STEM the
    learner has already seen, not a wholly unfamiliar verb -- the same
    "already-known verb, new person form" technique as (1).
    (3) A genuinely new grammar point, disclosed explicitly rather than
    smuggled in: the feminine accusative day-of-week ending after "w"
    (sobota -> w sobotę). Unit03 only ever demonstrated MASCULINE day
    names after "w" (w poniedziałek, w czwartek, w piątek, all
    unchanged, plus the "we wtorek" euphonic exception) -- no feminine
    day name was ever put after "w" in a realized sentence before this
    file. This unit extends the ALREADY-ESTABLISHED feminine accusative
    -a -> -ę pattern from unit06's "proszę o + biernik" grammar note
    (kawa -> kawę, herbata -> herbatę) to a new noun class (day names) in
    the same grammatical case use -- not a new PATTERN, a new instance of
    an old one, exactly like unit09/unit10's own genitive-noun extensions,
    but flagged as its own numbered item here because it's the first time
    a feminine day name has been tested at all. Only "sobotę" is actively
    taught/tested this way; "środę"/"niedzielę" are not introduced, kept
    for a future unit.
    (4) No other new grammatical category, case, tense, or person is
    introduced anywhere in this file. Every non-1st/2nd-singular form
    (3rd person, plural, formal pan/pani, any past or future tense) is
    avoided throughout, even though the FSI source material this unit
    draws from (see below) is itself full of exactly those forms in its
    own real "making plans" dialogues -- deliberately not adapted here to
    keep this unit's scope narrow and consistent with Ewa/Marek's
    already-established informal ty-register (see unit01's register
    note).
    (5) "może" (maybe/how about, an invariant discourse particle) is
    visually near-identical to "mogę" (I can, 1st person of móc) but
    grammatically unrelated -- flagged with its own dedicated grammar_note
    (lesson03) specifically to prevent this exact confusion, not because
    it represents any new case/conjugation pattern of its own.

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from earlier units (kino/idę/do/kina from
    unit03, piątek/Czy/we/w from unit03, iść from unit09, czwartej/o/po/
    południu from unit04/unit10, razem from unit07, bardzo from unit01/06/
    07/08/09, przepraszam-family already-taught pattern extended to a new
    modal here) is re-declared via this file's OWN introduced_tokens
    before being tested in this file's own exercises -- the compiler
    validates untaught vocabulary per realization FILE, not per course,
    and token matching is case-folded (confirmed again by reading
    tokenize() in scripts/compile_content.py).

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02-10
    (.firecrawl/fsi-polish-fast.pdf / .txt). This unit's core scheduling
    vocabulary is unusually well source-confirmed: the full "mogę,
    możesz..." (I can, you can...) present-tense modal table (cached .txt
    lines ~4564-4565 and ~15053-15054); "niestety" (unfortunately) glossed
    directly (cached .txt line ~1517) and used constantly throughout the
    source's own scheduling dialogues; "chętnie"/"bardzo chętnie" (gladly/
    very gladly) used as a real acceptance idiom (cached .txt lines ~7918,
    ~8748: "W sobotę? Bardzo chętnie. Dziękujemy." -- this exact
    propose-day/accept-gladly exchange directly informed lesson03's own
    dialogue shape, adapted from the source's formal pan/pani diplomatic
    register into Ewa/Marek's already-established informal ty-register,
    per the modernization requirement in AUTHORING_GUIDE §10, not copied
    verbatim); "przyjść" (to come, perfective) confirmed extensively
    (cached .txt lines ~2896, ~7545, ~8265 glossed directly "to come"),
    including the near-exact real-world model for this unit's own mogę+
    przyjść+day construction (cached .txt line ~8631: "Mogę przyjść
    dopiero o czwartej" -- I can't come before 4pm -- and line ~8742:
    "Nie, mogę przyjść tylko w czwartek" -- No, I can only come on
    Thursday, a real decline-with-alternative-day pattern); "może" as the
    discourse particle for proposing an alternative (cached .txt line
    ~8126: "Może w piątek?", line ~8748: "To może w sobotę?") directly
    confirmed and adapted for lesson03's own Marek line "Może w sobotę?";
    "kino"/"do kina" confirmed extensively as ordinary, frequent
    vocabulary (cached .txt lines ~3062-3157, ~7597-7694, ~8792, ~10418);
    "razem" confirmed (cached .txt line ~6420, glossed directly
    "together"), though this file uses its "together" sense while
    unit07's own earlier use of the same word tested its other common
    sense ("total," in a shopping-bill context) -- same real word, two
    different but equally genuine everyday meanings, both correct Polish,
    disclosed rather than treated as a silent duplicate.

    Honestly disclosed as NOT source-confirmed, freely authored from
    general knowledge of modern spoken Polish (same standard as every
    prior unit's disclosed gaps): the specific PRESENT-TENSE forms "chcę"/
    "chcesz" of chcieć. The source directly confirms "chcieć - to want" as
    a vocabulary gloss (cached .txt line ~14756) and gives a full PAST-
    TENSE conjugation table for chcieć (chciałem/chciałeś/chciał...,
    cached .txt lines ~14760-14780), but grepping the whole cached text
    directly for "chcę"/"chcesz" in present tense returns zero hits -- the
    present-tense forms used here are ordinary, extremely common, entirely
    regular-looking (for this verb class) A1 vocabulary, not needing
    source confirmation to be confident of, the same standard applied to
    unit10's own disclosed "spać/śpię" gap.

    Cross-checked against this file's own earlier lessons per AUTHORING_
    GUIDE §11: the facts stated (Ewa proposes the cinema for Friday; Marek
    can't make Friday; Marek proposes Saturday instead; Ewa accepts
    gladly; they agree on 4pm) are each stated exactly once, in lesson03's
    dialogue, and never contradicted anywhere else in the file --
    lesson01/lesson02's own example sentences and exercises use the same
    "Czy chcesz iść do kina...?" / "Mogę przyjść w piątek." / "Czy możesz
    przyjść w sobotę?" building blocks lesson03's dialogue assembles into
    a full exchange, consistent throughout.

