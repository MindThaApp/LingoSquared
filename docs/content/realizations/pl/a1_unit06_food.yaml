review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Sixth Polish unit, continuing directly from pl/a1_unit05_family.yaml
    (same Ewa/Marek characters, same formal pan/pani narration register,
    same 3-lesson bootstrap pace -- task instructions explicitly asked to
    match units 01-05's size, not nl's later-grown 6-lesson depth for its
    own food unit). Realizes universal.a1.food.order_simple_meal --
    confirmed the next A1 outcome in spine order after
    family.describe_relationships via docs/content/universal_spine.yaml's
    own linear ordering (greetings -> introductions -> numbers -> dates ->
    time -> family -> food -> ...). Checked nl/a1_unit06_food.yaml and
    fa/a1_unit06_food.yaml (both also realize this exact outcome as their
    own unit06) purely to confirm the topic/outcome match, not for any
    sentence text, character, or scenario reuse -- nl's file has since
    grown to 6 lessons/93 teaching cards, which this file deliberately
    does NOT match in size, per the standing "3-lesson bootstrap pace"
    instruction for this course; only the topic identity was confirmed.
    Every Polish sentence, the restaurant scenario, and its specific facts
    (the dish of the day, what Ewa orders) are freshly authored for pl.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence.
    Zero listen_type/listen_select/listen_order exercises anywhere in
    this file, matching unit01-05's own established choice for this
    corpus -- pl has real Google Cloud TTS (pl-PL-Wavenet-F) live, so
    audio-dependent exercises are no longer blocked by AUTHORING_GUIDE
    §14's concern, but this file stays consistent with the precedent
    unit01-05 already set (every exercise uses a real visible text
    prompt) rather than introducing the first audio-dependent exercise
    unilaterally in the same pass as new vocabulary -- a future dedicated
    audio-authoring pass remains a real, cheap opportunity now that TTS is
    wired. media_assets is therefore an empty list, not an oversight.
    dialogue_comprehension exercises in lesson03 render via the same
    MultipleChoice component as multiple_choice/listen_select
    (frontend/src/components/exercises/ExerciseRenderer.tsx) and are
    given real target_blocks text instead of a media_asset_key, matching
    unit01-05's own pattern.

    Cross-file vocabulary note (confirmed every prior unit hit this
    too): every word this file reuses from unit01/02/05 (Dzień dobry,
    Dobrze, Dziękuję, pan, i) is re-declared via this file's OWN
    introduced_tokens before being tested in this file's own exercises --
    the compiler validates untaught vocabulary per realization FILE, not
    per course, so no cross-file credit is given even for words already
    taught in an earlier unit of the same course.

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02/03/04/05
    (.firecrawl/fsi-polish-fast.pdf / .txt). Real source vocabulary
    directly confirmed and used here, modernized per §10 (adapted into
    fresh sentences, never copied verbatim): the restaurant-ordering unit
    (pp.109-121, "Getting the Feel of It" restaurant section) directly
    confirms "proszę o kartę" / "kartę, proszę" as the proszę + o +
    accusative ordering pattern this unit's lesson01/lesson03 teach
    (adapted to proszę o kawę / proszę o wodę / proszę o rachunek rather
    than the source's own kartę/rachunek pairing); "wodę mineralną
    proszę" independently confirms woda as real source vocabulary;
    "Proszę o rachunek." / "Rachunek proszę." (p.116 area) confirms
    rachunek (bill/check) and its own use as a proszę o object, exactly
    as this unit's lesson02/lesson03 use it; the polecać (to recommend)
    present-tense table (polecam, polecasz, poleca, polecamy, polecacie,
    polecają, p.112) plus the source's own worked exchanges "Co pani
    poleca na zakąskę?" / "Jaką zupę pan/i poleca?" / "Co pan/i poleca na
    drugie danie?" (pp.116-117) directly confirm both the polecam/poleca
    forms this unit's lesson03 grammar note teaches and the "Co pan
    poleca?" question pattern itself (adapted from the source's
    zakąska/zupa/drugie danie framing to this unit's own simpler
    danie-dnia framing); "ten befsztyk", "ta zupa", "to danie" (p.113)
    confirm zupa and danie as real source vocabulary, and the masculine/
    feminine/neuter accusative-ending table on the same page (adjectives
    -ego/-ą/no-change, nouns -a/-ę/no-change for animate-masc/fem/neuter)
    independently confirms this unit's own accusative grammar notes
    (proszę o + accusative for kawa->kawę/herbata->herbatę/woda->wodę,
    masculine-inanimate/neuter nouns unchanged) are grammatically
    accurate, not guessed; "lubić" (to like) with its own present-tense
    table (lubię, lubisz, lubi, lubimy, lubicie, lubią, p.rozdz.7) and
    the source's own worked example "Zaczynam lubić herbatę" / "Lubię
    herbatę" (p.118 area) directly confirm both the verb and the exact
    lubię+accusative pattern this unit's lesson02 teaches (only the
    1st/3rd-person forms lubię/lubi are actively taught, following the
    same "concentrate on nos. 1 and 3" pedagogical approach the source
    itself states elsewhere and unit05 already followed for mieć); "Już
    podaję." (p.115, a waiter's reply to a menu request) is used here
    verbatim as a natural, source-confirmed waiter's-reply idiom, adapted
    to a different request (a food order rather than a menu) rather than
    copied into the same context; "Proszę bardzo" as both a serving
    phrase and a "you're welcome" reply (pp.35-36 area, e.g. "Proszę
    bardzo, niech pan/i siada") is used the same dual way here (serving
    an order, then handing over the bill); chleb, masło (rye bread and
    butter, p.≈95 area), ser (cheese, confirmed extensively via the
    grocery-shopping dialogues around pp.130-145, e.g. "Ser kielecki",
    "Czy jest ser Tylżycki?"), and mleko (milk, "Czy mleko polskie trzeba
    gotować?") are all confirmed real source vocabulary; kawa and herbata
    are confirmed extensively via the source's own coffee/tea social
    scenes ("Kawa czy herbata?", pp.155-165 area).

    Honestly disclosed as NOT source-confirmed, freely authored from
    general knowledge of modern spoken Polish (same standard as every
    prior unit's disclosed gaps): "kelner" (waiter) itself never appears
    in the source's ~16,700 lines (grepped directly, zero hits) -- the
    source's restaurant scenes address the waiter only as "pan"/"pani" in
    direct speech and never name the role, so this unit's dialogue does
    the same (Ewa never says the word "kelner" aloud; it is used only as
    a speaker label in the compiled dialogue, never as taught/tested
    vocabulary, so no introduced_tokens entry was needed for it at all);
    "sok" (juice) alone is used here rather than the source's only
    attested compound "sok pomarańczowy" (orange juice) -- a deliberate
    A1 simplification to the bare, more broadly useful noun, disclosed
    rather than silently narrowed; "cukier" (sugar) is drawn from a
    substitution-drill table (not a full sentence) and given a fresh
    example sentence here; "co" (what) as its own question word and
    "danie dnia" (dish of the day) as an idiomatic compound (both
    "danie" and "dnia" are separately source-confirmed -- "danie" as
    above, "dnia" as the ordinary genitive of "dzień" already implied by
    unit03's own dzień-tygodnia vocabulary -- but the specific compound
    phrase itself is not in the source) are freely authored, ordinary
    A1-safe constructions. The whole lesson03 Ewa/kelner restaurant
    scenario and its specific facts (today's dish of the day is soup,
    the waiter recommends coffee, Ewa orders both) are original, freshly
    authored, continuing the established Ewa/Marek narration register
    (Marek does not appear in this unit's dialogue -- a restaurant scene
    is Ewa's own errand, same as unit02's shopping scene was framed
    around a single protagonist).

    Cross-checked against unit01/02/05 per AUTHORING_GUIDE §11: this
    unit's facts (today's dish of the day is soup; the waiter recommends
    coffee; Ewa orders coffee and soup, then asks for the bill) are
    stated consistently across every teaching card and exercise in
    lesson03 -- no exercise anywhere asks the learner to reconcile a fact
    this file doesn't itself establish, and the accusative-ending grammar
    notes in lesson01/lesson02 are used identically (same endings, same
    reasoning) everywhere those nouns reappear in lesson03's dialogue and
    exercises.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): 8
    multiple_choice select_* exercises -- prompt.target_blocks displayed
    the correct Polish option itself above the options (rendered as
    text_blocks), giving the answer away -> target_blocks emptied (the
    English instruction carries the cue), comprehension-without-
    text/duplicate class. Overlay: lubic_note claimed mieć in unit 5
    taught only 1st/3rd person (unit 5 taught mam, masz, ma) -> comparison
    removed. lesson03.exercise07.order_prosze_o_kawe_i_zupe -- added
    Proszę o zupę i kawę word-order alternative. NATIVE CHECK: Proszę o
    kawę vs the more common restaurant Poproszę kawę; waiter recommending
    coffee right after announcing soup as dish of the day reads slightly
    odd.

course:
