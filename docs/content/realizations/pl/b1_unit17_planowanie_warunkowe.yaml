  required_next_reviewer: null
  notes: >-
    Seventeenth Polish B1 unit, continuing from pl/b1_unit16_warunki_
    realne_i_nierealne.yaml. Realizes universal.b1.conditions.express_
    real_conditions (docs/content/universal_spine.yaml: "Express a
    real/likely condition and its consequence using an if-clause
    construction (condition + result across two clauses, not a bare
    single statement), across everyday planning topics, and negate the
    condition to express 'if not'").

    Outcome-differentiation from this unit's immediate predecessor
    (b1_unit16, which also uses "jeśli" + future for its real-condition
    half): unit16's outcome REQUIRES a contrast against an unreal "gdyby"
    condition and never taught negation ("jeśli nie"); this unit's outcome
    requires neither a contrast nor unreal forms at all -- it requires
    BREADTH across everyday planning topics (here: catching a train,
    and a shopping budget -- both distinct from unit16's weather/bike-trip
    theme) and, centrally, the NEGATED condition "jeśli nie" + result,
    which unit16 never taught. Lesson01 and lesson02 each open with an
    affirmative real condition and then immediately drill its negated
    counterpart on the same topic, which is the outcome's own explicit
    requirement.

    Grammar step-up, deliberate and disclosed: (1) "jeśli zdążę na czas,
    złapię pociąg o ósmej" (zdążyć, perfective, governs "na czas");
    (2) negation of the condition clause only, result unchanged: "jeśli
    nie zdążę na czas, złapię następny pociąg"; (3) "starczyć" + celownik
    (dative) + dopełniacz (genitive) -- "jeśli starczy mi pieniędzy,
    kupię nowe buty" (if I have enough money, literally "if money
    suffices to me"), and its negation "jeśli nie starczy mi pieniędzy,
    poczekam do przyszłego miesiąca" (genitive after "do").

    Scenario: continues the established Ewa/Marek informal ty-register
    storyline. Two everyday planning threads run through the unit: Marek
    catching a train to a Saturday event, and Ewa's shopping budget for
    new shoes -- both deliberately distinct from unit16's weather/bike-
    trip premise so the two units' example sentences do not overlap.

    Case notes: "na czas" (accusative, fixed adverbial phrase, "in time");
    "o ósmej" (locative, clock time); "mi pieniędzy" (dative + genitive
    after "starczyć"); "do przyszłego miesiąca" (genitive after "do").
    Aspect notes: "zdążę"/"złapię"/"starczy"/"kupię"/"poczekam" are all
    perfective (single bounded future events), consistent with the real-
    condition construction's requirement of a perfective present-as-future
    verb in both clauses.

    Character canon check (item 6): grepped pl/b1_unit01-16 before
    writing. No fact about Ewa or Marek is contradicted. No new
    characters introduced.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says in the
    same dialogue -- no distractor restates the fact under test using the
    same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the eight-o'clock train,
    Marek's plan to catch the next one if he's late, and Ewa's shoe
    budget/fallback plan to wait until next month are each stated exactly
    once and never contradicted elsewhere in the file.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, same standing outage). No public-domain intermediate Polish
    course exists to adapt from. Authored from established modern Polish
    grammar conventions, double-checked against standard Polish reference
    grammar (case government of zdążyć/starczyć, aspect choice) before
    writing any example sentence.

    Cross-file vocabulary note: every word this file's exercises test,
    including basic recap words (jutro, rano, dzisiaj), is redeclared
    via this file's own lesson01 recap card, per the compiler's per-FILE
    untaught-vocabulary check -- this file does not rely on any other pl
    file having been compiled first. Pending fresh-context review per
    AUTHORING_GUIDE #9; not self-certified.

