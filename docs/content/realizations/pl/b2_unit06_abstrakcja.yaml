            target: {text: "zalety i wady", language_code: pl, direction: ltr}
            introduced_tokens: [i]
            example: {text: "Wolność ma zalety i wady.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit06.lesson04.teach.spoleczenstwo
            kind: vocabulary
            target: {text: "społeczeństwo", language_code: pl, direction: ltr}
            introduced_tokens: [społeczeństwo, społeczeństwa, dla]
            example: {text: "To jest dobre dla społeczeństwa.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit06.lesson04.teach.ogromna
            kind: vocabulary
