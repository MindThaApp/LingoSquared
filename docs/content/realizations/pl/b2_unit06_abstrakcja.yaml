generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's sixth
    B2 unit (abstraction -- discussing abstract ideas and values). No
    adaptable upper-intermediate public-domain Polish source exists; built
    from established modern Polish grammar/discourse knowledge. Structural
    exemplar: docs/content/realizations/nl/b2_unit06_abstractie.yaml,
    consulted ONLY for unit shape -- every Polish sentence below is
    authored fresh from Polish grammar. Theme deliberately differs from
    the Dutch exemplar's car-free-cities debate (freedom vs. wolność jest
    ważniejsza niż bezpieczeństwo, freedom vs. security) to avoid even a
    topical echo, while still being a genuine B2 abstract-values question.
    Character canon: grepped pl/b1_*.yaml and pl/b2_unit01-05.yaml before
    writing -- Marek and Ewa continue their established informal ty
    register; this unit heavily reuses cumulative vocabulary from unit01
    (uwazam, ze / moim zdaniem / to prawda / ale / poniewaz / z jednej
    strony ... z drugiej strony / zalety / wady / wolnosc) and unit05
    (inaczej), demonstrating genuine course-wide cumulative recall rather
    than re-teaching synonyms.
    GENDER-AGREEMENT AUDIT: the only 1st-person gender-marked spot in this
    unit is the predicate adjective after jestem ("jestem przekonany /
    jestem przekonana", lesson01), which is deliberately taught as a
    paired card and given BOTH accepted-answer forms wherever it appears
    in free production (lesson01 exercise06). Every other opinion/response
    frame in this unit (uwazam, moim zdaniem, rozumiem, zgadzam sie, nie
    zgadzam sie, myślę) is present tense and carries no gender marking.
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Sixth Polish B2 unit; first abstraction unit. Targets the CEFR B2
    abstraction outcome
    (universal.b2.abstraction.discuss_abstract_ideas_and_values): give a
    QUALIFIED opinion on an abstract topic and respond directly to an
    opposing view. Theme: one coherent abstract debate across all six
    lessons -- is freedom more important than security? (czy wolnosc jest
    wazniejsza niz bezpieczenstwo?). Lesson arc: L01 opinion frames +
    abstract-value vocabulary (uwazam, ze / moim zdaniem / jestem
    przekonany/przekonana, ze; wolnosc, bezpieczenstwo); L02 QUALIFICATION
    (do pewnego stopnia, ogolnie rzecz biorac, w wielu przypadkach,
    niekoniecznie, to zalezy); L03 RESPONDING to an opposing view (to
    prawda, ale...; rozumiem twoj punkt widzenia, jednak...; zgadzam/nie
    zgadzam się z tym); L04 weighing two sides (z jednej strony ... z
    drugiej strony; zalety, wady, spoleczenstwo); L05 a short opinion
    READING that states a qualified stance; L06 the culminating
    production -- a Marek/Ewa dialogue for the LISTENING requirement, a
    SPEAKING task (qualified opinion answering an opposing view), a
    WRITING task (qualified opinion responding to a stated opposing view),
    and a dialogue_response. Register: informal ty throughout, per pl's
    established lane pin. All vocabulary is introduced self-contained
    within this file, cumulative with units 01-05 which precede it in the
    course. No sibling-direction file (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    Realization: lesson05 exercise01-04 (reading_comprehension) -- prompt
    showed only the English question, not the opinion text -> added the
    passage as a pl target_block before the question (comprehension-
    without-text); lesson06 exercise06 -- realization prompt English said
    '(1) That's true, but it's not good for security' while the keyed
    answer (and the overlay instruction) is 'To prawda, ale bezpieczeństwo
    to nie wszystko' -> prompt corrected to 'That's true, but security
    isn't everything' (underdetermined-prompt / feedback-mismatch).
    Overlay: missing accepted answers added: lesson01 exercise05 + Wolność
    jest moim zdaniem ważniejsza; lesson02 exercise07 + Do pewnego stopnia
    to jest prawda / To jest prawda do pewnego stopnia / To do pewnego
    stopnia prawda; lesson03 exercise05 + To prawda, ale to nie wystarcza;
    lesson04 exercise06 + To dobre dla społeczeństwa; lesson05 exercise07
    + To niekoniecznie łatwe. No NATIVE CHECK items beyond the existing
    list.
    Second-pass review 2026-10-19: 0 fixes.

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    Informal ty throughout (pl's established lane pin). B2 abstraction
    layers opinion frames, qualification frames, and respond-to-opposing
    frames onto that register -- uwazam, ze, moim zdaniem, jestem
    przekonany/przekonana, ze, do pewnego stopnia, niekoniecznie, to
    prawda ale, rozumiem twoj punkt widzenia jednak, zgadzam/nie zgadzam
    się z tym -- while keeping everyday informal address established for
    Marek and Ewa.

