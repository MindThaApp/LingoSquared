          - content_key: pl.b2.unit06.lesson04.teach.grammar_za_przeciw
            kind: grammar_note
            target: {text: "Z jednej strony wolność jest ważna, z drugiej strony bezpieczeństwo jest ważne. Wolność ma zalety i wady.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit06.lesson04.exercise01.recognize_spoleczenstwo
            type: multiple_choice
            tested_text: społeczeństwo
            prompt: {target_blocks: [{text: społeczeństwo, language_code: pl, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson04.exercise02.listen_z_jednej_strony
            type: listen_select
            tested_text: "Z jednej strony wolność jest ważna, z drugiej strony bezpieczeństwo jest ważne."
            media_asset_key: pl.b2.audio.abstrakcja.z_jednej_strony.01
            prompt: {target_blocks: []}
          - content_key: pl.b2.unit06.lesson04.exercise03.match_weighing_words
            type: matching_pairs
            tested_text: "z jednej strony z drugiej strony zalety wady społeczeństwo bezpieczniejsze"
            prompt: {target_blocks: []}
            pairs:
              - {left: "z jednej strony", right: "on the one hand"}
              - {left: "z drugiej strony", right: "on the other hand"}
              - {left: zalety, right: advantages}
              - {left: wady, right: disadvantages}
              - {left: społeczeństwo, right: society}
              - {left: bezpieczniejsze, right: safer}
