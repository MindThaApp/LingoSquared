            type: translation
            tested_text: "Z jednej strony wolność jest ważna, z drugiej strony bezpieczeństwo jest ważne"
            prompt: {target_blocks: [{text: "Translate into Polish, using z jednej strony ... z drugiej strony: On one hand freedom is important, on the other hand security is important.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson04.exercise06.write_spoleczenstwo
            type: writing_prompt
