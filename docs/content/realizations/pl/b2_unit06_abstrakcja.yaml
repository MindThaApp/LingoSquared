            type: translation
            tested_text: "To ma ogromną zaletę"
            prompt: {target_blocks: [{text: "Translate into Polish: That has a huge advantage.", language_code: en, direction: ltr}]}

      - content_key: pl.b2.unit06.lesson05.czytanie_opinii
        title: "Czytanie opinii"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: pl.b2.unit06.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                Uważam, że wolność jest ważniejsza niż bezpieczeństwo.
                Rozumiem, że bezpieczeństwo się liczy, ale bez wolności
                życie traci sens. Do pewnego stopnia to prawda, że
                potrzebujemy zasad. Mimo to jestem przekonany, że wolność
                jest ważniejsza dla społeczeństwa. To niekoniecznie
                łatwe, ale warto o to walczyć.
              language_code: pl
              direction: ltr
            introduced_tokens: [liczy, bez, życie, traci, sens, potrzebujemy, zasad, łatwe, warto, walczyć]
        exercises:
          - content_key: pl.b2.unit06.lesson05.exercise01.read_stance
            type: reading_comprehension
            tested_text: "wolność jest ważniejsza niż bezpieczeństwo"
            prompt:
              target_blocks:
                - {text: "Uważam, że wolność jest ważniejsza niż bezpieczeństwo. Rozumiem, że bezpieczeństwo się liczy, ale bez wolności życie traci sens. Do pewnego stopnia to prawda, że potrzebujemy zasad. Mimo to jestem przekonany, że wolność jest ważniejsza dla społeczeństwa. To niekoniecznie łatwe, ale warto o to walczyć.", language_code: pl, direction: ltr}
                - {text: "What is the author's overall opinion?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit06.lesson05.exercise02.read_qualification
            type: reading_comprehension
            tested_text: "do pewnego stopnia"
            prompt:
              target_blocks:
                - {text: "Uważam, że wolność jest ważniejsza niż bezpieczeństwo. Rozumiem, że bezpieczeństwo się liczy, ale bez wolności życie traci sens. Do pewnego stopnia to prawda, że potrzebujemy zasad. Mimo to jestem przekonany, że wolność jest ważniejsza dla społeczeństwa. To niekoniecznie łatwe, ale warto o to walczyć.", language_code: pl, direction: ltr}
                - {text: "What does the author CONCEDE to the opposing side?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit06.lesson05.exercise03.read_final_value
            type: reading_comprehension
            tested_text: "ważniejsza dla społeczeństwa"
            prompt:
              target_blocks:
                - {text: "Uważam, że wolność jest ważniejsza niż bezpieczeństwo. Rozumiem, że bezpieczeństwo się liczy, ale bez wolności życie traci sens. Do pewnego stopnia to prawda, że potrzebujemy zasad. Mimo to jestem przekonany, że wolność jest ważniejsza dla społeczeństwa. To niekoniecznie łatwe, ale warto o to walczyć.", language_code: pl, direction: ltr}
                - {text: "On what basis does the author still support freedom as more important?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit06.lesson05.exercise04.read_hedge
            type: reading_comprehension
            tested_text: "niekoniecznie łatwe"
            prompt:
              target_blocks:
                - {text: "Uważam, że wolność jest ważniejsza niż bezpieczeństwo. Rozumiem, że bezpieczeństwo się liczy, ale bez wolności życie traci sens. Do pewnego stopnia to prawda, że potrzebujemy zasad. Mimo to jestem przekonany, że wolność jest ważniejsza dla społeczeństwa. To niekoniecznie łatwe, ale warto o to walczyć.", language_code: pl, direction: ltr}
                - {text: "Does the author claim it would be easy?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit06.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "życie traci sens potrzebujemy zasad łatwe warto"
            prompt: {target_blocks: []}
            pairs:
              - {left: życie, right: life}
              - {left: "traci sens", right: "loses its meaning"}
              - {left: potrzebujemy, right: "we need"}
              - {left: zasad, right: "rules (genitive plural)"}
              - {left: łatwe, right: easy}
              - {left: warto, right: "it's worth"}
          - content_key: pl.b2.unit06.lesson05.exercise06.translate_warto
            type: translation
            tested_text: "Warto o to walczyć"
            prompt: {target_blocks: [{text: "Translate into Polish: It's worth fighting for.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson05.exercise07.write_latwe
            type: writing_prompt
            tested_text: "To niekoniecznie jest łatwe"
            prompt: {target_blocks: [{text: "Write in Polish, using niekoniecznie: It is not necessarily easy.", language_code: en, direction: ltr}]}

      - content_key: pl.b2.unit06.lesson06.w_rozmowie
        title: "W rozmowie: zniuansowana opinia"
        spine_outcome_id: universal.b2.abstraction.discuss_abstract_ideas_and_values
        teaching:
          - content_key: pl.b2.unit06.lesson06.teach.lepsze_wazniejsze
            kind: vocabulary
            target: {text: "lepsze / ważniejsze", language_code: pl, direction: ltr}
            introduced_tokens: [lepsze, ważniejsze]
            example: {text: "To jest lepsze i ważniejsze dla społeczeństwa.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit06.lesson06.teach.nie_kazdy_tego_chce
            kind: phrase
            target: {text: "nie każdy tego chce", language_code: pl, direction: ltr}
            introduced_tokens: [tego, chce]
          - content_key: pl.b2.unit06.lesson06.teach.nie_wszystko
            kind: phrase
            target: {text: "bezpieczeństwo to nie wszystko", language_code: pl, direction: ltr}
            introduced_tokens: [wszystko]
          - content_key: pl.b2.unit06.lesson06.teach.dialogue_marek_open
            kind: dialogue
            target: {text: "Uważam, że wolność jest ważniejsza niż bezpieczeństwo. To lepsze dla społeczeństwa.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit06.lesson06.teach.dialogue_ewa_concede
            kind: dialogue
            target: {text: "To prawda, ale nie każdy tego chce.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit06.lesson06.teach.dialogue_marek_push
            kind: dialogue
            target: {text: "Rozumiem twój punkt widzenia, jednak myślę, że to lepsze dla społeczeństwa.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit06.lesson06.teach.dialogue_ewa_qualify
            kind: dialogue
            target: {text: "Zgadzam się z tym do pewnego stopnia. Ale to zależy.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit06.lesson06.teach.dialogue_marek_conviction
            kind: dialogue
            target: {text: "Jestem przekonany, że warto o to walczyć.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit06.lesson06.teach.dialogue_ewa_final
            kind: dialogue
            target: {text: "Moim zdaniem to niekoniecznie lepsze.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit06.lesson06.teach.grammar_zniuansowana
            kind: grammar_note
            target: {text: "Uważam, że wolność jest ważniejsza, ale to zależy. Niekoniecznie się z tym zgadzam.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit06.lesson06.exercise01.comprehend_marek
            type: dialogue_comprehension
            tested_text: "wolność jest ważniejsza niż bezpieczeństwo"
            media_asset_key: pl.b2.audio.abstrakcja.dialogue.wolnosc_debata.01
            prompt: {target_blocks: [{text: "What is Marek's position?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson06.exercise02.comprehend_ewa
            type: dialogue_comprehension
            tested_text: "do pewnego stopnia"
            media_asset_key: pl.b2.audio.abstrakcja.dialogue.wolnosc_debata.01
            prompt: {target_blocks: [{text: "What is Ewa's position, and how does she qualify it?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson06.exercise03.comprehend_difference
            type: dialogue_comprehension
            tested_text: "to zależy"
            media_asset_key: pl.b2.audio.abstrakcja.dialogue.wolnosc_debata.01
            prompt: {target_blocks: [{text: "Where do Marek and Ewa mainly DIFFER?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson06.exercise04.order_warto_walczyc
            type: word_order
            tested_text: "Warto o to walczyć"
            prompt: {target_blocks: []}
            word_bank: [Warto, o, to, walczyć]
          - content_key: pl.b2.unit06.lesson06.exercise05.speak_qualified_opinion
            type: speak_response
            tested_text: "To jest do pewnego stopnia prawda, ale wolność jest ważniejsza dla społeczeństwa"
            prompt: {target_blocks: [{text: "Someone says security should always come first. Respond aloud with a QUALIFIED opinion that answers them, using do pewnego stopnia and to prawda, ale...: That is true to a certain extent, but freedom is more important for society.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson06.exercise06.write_qualified_response
            type: writing_prompt
            tested_text: "To prawda, ale bezpieczeństwo to nie wszystko. Moim zdaniem wolność jest ważniejsza."
            prompt: {target_blocks: [{text: "Someone argues that security should come first. Write TWO Polish sentences responding with a QUALIFIED opinion that answers them directly. (1) Concede partly, using to prawda, ale...: That's true, but security isn't everything. (2) Give your own qualified opinion, using moim zdaniem: In my opinion, freedom is more important.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit06.lesson06.exercise07.respond_qualified
            type: dialogue_response
            tested_text: "To jest do pewnego stopnia prawda, ale moim zdaniem wolność jest ważniejsza dla społeczeństwa"
            prompt: {target_blocks: [{text: "Bezpieczeństwo jest ważniejsze.", language_code: pl, direction: ltr}]}
