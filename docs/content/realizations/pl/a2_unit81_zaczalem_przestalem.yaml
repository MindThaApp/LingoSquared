          - {"content_key": "pl.a2.unit81.lesson05.exercise03.une_texto", "type": "matching_pairs", "tested_text": "Zaczęłam biegać Przestałam pić kawę Przestałam siedzieć w telefonie Spróbowałam pływać Wolę biegać Zapomniałam zadzwonić do Marka Czytam książkę Biegam rano", "prompt": {"target_blocks": []}, "pairs": [{"left": "Zaczęłam biegać.", "right": "I started running."}, {"left": "Przestałam pić kawę.", "right": "I stopped drinking coffee."}, {"left": "Przestałam siedzieć w telefonie.", "right": "I stopped sitting on my phone."}, {"left": "Spróbowałam pływać.", "right": "I tried swimming."}, {"left": "Wolę biegać.", "right": "I prefer running."}, {"left": "Zapomniałam zadzwonić do Marka.", "right": "I forgot to call Marek."}, {"left": "Czytam książkę.", "right": "I am reading a book."}, {"left": "Biegam rano.", "right": "I run in the morning."}]}
