          - {"content_key": "pl.a2.unit81.lesson06.exercise06.traduce_dialogo", "type": "translation", "tested_text": "Przestałem pić kawę i zacząłem chodzić na siłownię", "prompt": {"target_blocks": [{"text": "I stopped drinking coffee and started going to the gym.", "language_code": "en", "direction": "ltr"}]}}
