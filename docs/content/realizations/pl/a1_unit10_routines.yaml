review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Tenth Polish unit, continuing directly from pl/a1_unit09_directions.yaml
    (same Ewa/Marek pair, same 3-lesson bootstrap pace as units01-09).
    Realizes universal.a1.routines.describe_daily_routine -- confirmed
    directly against docs/content/universal_spine.yaml: read the spine
    file's own linear ordering by eye starting right after
    universal.a1.directions.ask_follow_basic_directions (unit09's own
    outcome), and the very next entry in the file is
    universal.a1.routines.describe_daily_routine (id + can_do text read
    directly: "Describe a simple daily routine using common activities and
    times," prerequisites: [universal.a1.time.ask_tell_time]). The
    prerequisite is already satisfied -- pl/a1_unit04_time.yaml realizes
    universal.a1.time.ask_tell_time. Checked nl/a1_unit10_routines.yaml
    purely to confirm topic identity (title "Mijn dagelijkse routine" / "My
    daily routine") -- confirming scope only, not for any sentence text,
    character, or lesson-structure reuse; nl's file has grown to 6 lessons
    with audio assets and a completed review pass, which this file
    deliberately does NOT match in size, per the standing "3-lesson
    bootstrap pace" instruction for this course.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence. Zero
    listen_type/listen_select/listen_order exercises anywhere in this file,
    matching unit01-09's own established choice -- media_assets is an
    empty list, not an oversight (same rationale as unit08/09: a future
    dedicated audio-authoring pass is a real, cheap opportunity now that pl
    has live Google Cloud TTS, but this file stays consistent with the
    precedent every prior pl unit has set). Because there is no dialogue
    AUDIO in this file, the AUTHORING_GUIDE same-speaker-distractor bug
    class (a listen_select/listen_order distractor that's something the
    tested speaker also says elsewhere in the SAME audio clip) is not
    directly applicable -- explicitly checked and confirmed N/A for that
    reason, same as unit09.

    The analogous risk for lesson03's text-based dialogue_comprehension
    exercises (exercise03/exercise04) was checked by hand, listing every
    line each speaker actually says first:
    Ewa's three lines: "Wstaję o siódmej rano i piję kawę." / "Jem
    śniadanie, potem pracuję po południu." / "Wieczorem wracam do domu. A
    ty?"
    Marek's three lines: "Ja też wstaję o siódmej! Ale piję herbatę, nie
    kawę." / "Pracuję rano, potem jem obiad w południe." / "Śpię wcześnie,
    o dziesiątej wieczorem."
    exercise03 asks what Ewa drinks (correct: kawa/coffee); distractor
    "herbata/tea" IS what Marek says elsewhere -- but Marek's line is an
    explicit contrast ("Ale piję herbatę, nie kawę," i.e. "But I drink tea,
    not coffee"), so herbata is genuinely, consistently wrong for Ewa, and
    the two facts don't contradict each other (checked per AUTHORING_GUIDE
    §11 too: Ewa=coffee, Marek=tea is stated once and never contradicted
    anywhere else in the file). exercise04 asks what time Marek sleeps
    (correct: o dziesiątej wieczorem/at ten in the evening); distractor "o
    siódmej rano/at seven in the morning" IS something Marek himself says
    -- but about his WAKE time, a different question than the one being
    asked, the same safe cross-reference pattern unit09's own review notes
    already used and confirmed defensible. Neither exercise's distractor
    set makes both options simultaneously true for the fact actually being
    asked about.

    Grammar-scope decision, disclosed up front per unit07/08/09's own
    precedent for narrowing A1 case/verb-form exposure deliberately rather
    than by omission:
    (1) every activity verb in this unit (wstawać, jeść, pić, pracować,
    wracać, spać) is used ONLY in the first-person-singular (ja) form
    (wstaję, jem, piję, pracuję, wracam, śpię) -- no other grammatical
    person is conjugated or tested anywhere in this file, including
    Marek's half of lesson03's dialogue, which describes HIS OWN day in
    first person rather than answering a second-person question. The
    dialogue prompts a partner's turn with the bare, already-established
    frozen phrase "A ty?" (unit01/unit05 precedent) instead of a real
    second-person question like "O której wstajesz?", which would require
    introducing 2nd-person conjugation -- deliberately out of scope for
    this unit, same narrowing logic as unit09 avoiding the imperative
    mood entirely.
    (2) "pracuję" extends the already-established -ować -> -uje verb
    conjugation pattern (unit07's own grammar note: "Kosztować: kosztuje
    (liczba pojedyncza), kosztują (liczba mnoga)") to the first person
    (-uję) -- reusing an already-taught PATTERN with a new specific verb,
    not introducing a new conjugation class, the same technique unit09
    used extending the masculine -u genitive pattern to new nouns.
    (3) "do domu" (to home) reuses the EXACT SAME masculine genitive -u
    pattern already established in unit08/09 (bank -> banku, hotel ->
    hotelu, park -> parku) applied to a new noun, dom -> domu -- disclosed
    explicitly via lesson02's own grammar_note, no new case pattern
    introduced.
    (4) "o dziesiątej" (at ten) is a new specific instance of the
    already-established numeral locative pattern from unit04's own
    grammar note ("Czwarta, siódma, dziesiąta -- ale o czwartej, o
    siódmej, o dziesiątej") -- "dziesiątej" itself is literally the exact
    wordform unit04 already validated, reused verbatim here, not a new
    grammar point.
    (5) "śniadanie"/"obiad" are accusative-transparent (neuter and
    inanimate-masculine nouns have identical nominative/accusative forms
    in Polish), so "jem śniadanie"/"jem obiad" introduce no new case
    ending to learn. "kawę"/"herbatę" reuse the exact already-established
    feminine accusative -a -> -ę pattern from unit06's own grammar note
    ("Proszę o + biernik: kawa -> kawę, herbata -> herbatę").
    No new noun-declension PATTERN (only new instances of already-taught
    patterns) and no new grammatical person is introduced anywhere in this
    file.

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from earlier units (kawę/herbatę from
    unit06, o/rano/w/południe/po/południu/wieczorem/nocy/siódmej/
    dziesiątej/czwartej from unit04, i from unit05/06, potem from unit09,
    A/ty from unit01, Ja/twój-class pronouns from unit05, nie from
    unit04) is re-declared via this file's OWN introduced_tokens before
    being tested in this file's own exercises -- the compiler validates
    untaught vocabulary per realization FILE, not per course, and token
    matching is case-folded (confirmed by reading tokenize() in
    scripts/compile_content.py), so "O" and "o" are the same token.

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02-09
    (.firecrawl/fsi-polish-fast.pdf / .txt). Directly source-confirmed
    this unit's core verbs and vocabulary: "Rano piję kawę." (In the
    morning I drink coffee -- an exact, literal source sentence, cached
    .txt line ~4649, reused near-verbatim here since it is already a
    natural, non-archaic, modern-register sentence with nothing to
    modernize); the full conjugation table for "jeść" including "jem = I
    eat" (cached .txt lines ~14979-14988); "wracam" as the first-person
    form of wracać, "I return" (cached .txt lines ~5405/5453, a full verb
    table); "pracuje" (3rd person, cached .txt lines 903/6668/6994/etc.,
    confirming the -uje conjugation class extended here to 1st person per
    the grammar-scope note above); and the vocabulary set
    śniadanie/obiad/kolacja glossed directly as breakfast/lunch/supper
    (cached .txt lines ~9526-9528) plus "o której pan/i wstaje?" directly
    confirming wstawać/wstaje as the real question-form for asking someone's
    wake time (cached .txt line 8725, extended here to 1st person wstaję
    per the same pattern-extension logic).

    Honestly disclosed as NOT source-confirmed, freely authored from
    general knowledge of modern spoken Polish (same standard as every
    prior unit's disclosed gaps): "spać/śpię" (to sleep/I sleep -- no
    occurrence found anywhere in the cached FSI text, grep-checked
    directly) and "wcześnie" (early) are ordinary, common, unambiguous A1
    vocabulary, not needing source confirmation to be confident of. "kolacja"
    (supper/dinner) is source-glossed but not actually used anywhere in
    this file -- lesson02 deliberately covers only obiad (midday meal) to
    keep the file's meal vocabulary aligned with its own two-meal daily
    arc (breakfast, midday meal), leaving kolacja for a future review/
    practice pass rather than padding this unit with a third meal noun it
    doesn't structurally need.

    Cross-checked against this file's own earlier lessons per AUTHORING_
    GUIDE §11: Ewa's schedule (up at 7, breakfast then afternoon work,
    home in the evening) and Marek's schedule (also up at 7, tea not
    coffee, morning work then midday lunch, asleep early at 10pm) are each
    stated once, in lesson03's dialogue, and never contradicted anywhere
    else in the file -- lesson01/02's own example sentences and exercises
    use the same "wstaję o siódmej rano" / "pracuję po południu" / "wracam
    do domu wieczorem" pattern Ewa's half of the dialogue draws from,
    consistent throughout.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): 1 fix.
    lesson02.teach.do_domu_note -- 'dom kończy się na spółgłoskę, więc
    dopełniacz to domu' -> 'po do używamy dopełniacza, a dom ma w
    dopełniaczu końcówkę -u' (false-grammar: ending in a consonant does not
    predict genitive -u, cf. kot -> kota). NATIVE CHECK: 'Śpię wcześnie, o
    dziesiątej wieczorem' (lesson03 line06/exercise08/exercise11) -- 'śpię
    wcześnie' may be less idiomatic than 'wcześnie chodzę spać'; left as is
    pending native judgment.

    Coordinator sweep 2026-10-17 (same review): 8 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

course:
  realization_key: pl.a1
  target_language_first: true
  dialect: pl_standard
  register_policy: >-
    Continue unit01-09's register split: Ewa and Marek use the informal
    ty-register with each other. This unit is deliberately scoped to
    first-person-singular verb forms only (see the grammar-scope note
    above) -- every sentence describes the speaker's own routine, so no
    new formal/informal second-person distinction is introduced by this
    unit. Lesson03's dialogue prompts a partner's turn with the existing
    frozen "A ty?" (unit01/unit05 precedent) rather than any new
    second-person question form.

