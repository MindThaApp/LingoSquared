review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Eighth Polish unit, continuing directly from pl/a1_unit07_shopping.yaml
    (same Ewa protagonist, now paired with Marek Wójcik -- introduced as a
    named character back in unit01's introductions lesson -- in a new
    town-navigation scene; same formal-by-default register for a
    stranger-on-the-street exchange; same 3-lesson bootstrap pace as
    units01-07). Realizes universal.a1.places.locate_common_places --
    confirmed the next A1 outcome in spine order after
    shopping.ask_prices_quantities via docs/content/universal_spine.yaml's
    own linear ordering (greetings -> introductions -> numbers -> dates ->
    time -> family -> food -> shopping -> places -> directions -> ...).
    Checked nl/a1_unit08_places.yaml purely to confirm this exact outcome
    is also nl's own unit08 (a "Plaatsen vinden" / finding places scene) --
    confirming topic/outcome identity only, not for any sentence text,
    character, or scenario reuse; nl's file has since grown to 6 lessons
    with real audio assets and a richer "behind/in front of" + map-reading
    sub-scope, which this file deliberately does NOT match in size or
    grammar breadth, per the standing "3-lesson bootstrap pace" instruction
    for this course. fa/a1_unit08 realizes a different outcome (shopping,
    fa's own unit08) as its own unit08 -- language packs are not required
    to hit the same spine outcome at the same unit number, so this was
    expected, not a discrepancy to resolve. Deliberately scoped to
    universal.a1.places.locate_common_places only (naming/locating a place
    relative to another) and NOT universal.a1.directions.ask_follow_basic_
    directions (turn-by-turn navigation, prosto/na prawo/na lewo) -- that
    is the very next spine outcome and its own future unit; per
    AUTHORING_GUIDE §1 spine discipline, this file's dialogue stops at
    "the pharmacy is next to the bank," never "go straight then turn
    right."

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence.
    Zero listen_type/listen_select/listen_order exercises anywhere in this
    file, matching unit01-07's own established choice for this corpus --
    pl has real Google Cloud TTS (pl-PL-Wavenet-F) live, so audio-dependent
    exercises are no longer blocked by AUTHORING_GUIDE §14's concern, but
    this file stays consistent with the precedent unit01-07 already set
    (every exercise uses a real visible text prompt) rather than
    introducing the first audio-dependent exercise unilaterally in the
    same pass as new vocabulary -- a future dedicated audio-authoring pass
    remains a real, cheap opportunity now that TTS is wired. media_assets
    is therefore an empty list, not an oversight. lesson03's
    dialogue_comprehension exercises render via the same MultipleChoice
    component as multiple_choice/listen_select
    (frontend/src/components/exercises/ExerciseRenderer.tsx) and are given
    real target_blocks text instead of a media_asset_key, matching
    unit01-07's own pattern.

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from unit01/06/07 (jest, Dziękuję, Proszę
    bardzo, A) is re-declared via this file's OWN introduced_tokens before
    being tested in this file's own exercises -- the compiler validates
    untaught vocabulary per realization FILE, not per course, so no
    cross-file credit is given even for words already taught in an
    earlier unit of the same course. The two genitive-singular forms
    tested in this file (banku from bank, hotelu from hotel) are treated
    by the compiler's tokenizer as distinct tokens from their nominative
    dictionary forms and are each declared separately at first use, same
    discipline unit07 already applied to bananów/pomidorów/ziemniaków.

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02-07
    (.firecrawl/fsi-polish-fast.pdf / .txt). Real source vocabulary and
    real source sentence patterns directly confirmed and used here,
    modernized per §10 (adapted into fresh sentences with a Marek/Ewa
    town scene, never copied verbatim): the "Asking Directions" section
    (pp.~275-300 in the source's own pagination, confirmed via the cached
    .txt around line 2900-3050) directly confirms "Gdzie jest + [place]?"
    as the real, idiomatic way to ask where a place is (e.g. "Przepraszam,
    gdzie jest plac Bankowy?", "Przepraszam, gdzie jest Park Ujazdowski?"),
    and directly confirms daleko (far), niedaleko (not far), and blisko
    (near) as a genuine three-way source vocabulary set, including the
    source's own worked contrast "To niedaleko. Konsulat jest niedaleko."
    / "To blisko. Instytut jest blisko." (line ~2902-2908), adapted here
    to this unit's own bank/pharmacy/restaurant/hotel/park scenario rather
    than the source's own consulate/institute setting. "Przepraszam" as a
    real, idiomatic attention-getter/opener before asking a stranger a
    question is directly confirmed by the source's own repeated usage
    across nearly every one of its direction-asking examples (e.g.
    "Przepraszam pana/panią, gdzie jest ulica Świętokrzyska?", line
    ~2996). Hotel, restauracja, bank, park, and apteka (see below) are all
    real, transparent-cognate-or-near-cognate common nouns any A1 learner
    would recognize as genuine Polish vocabulary for these places; hotel
    and restauracja are independently confirmed as real source vocabulary
    via the source's own "Staying at a Hotel" unit and repeated
    restauracja usage throughout the source's dining sections (already
    partially drawn on for unit06).

    Honestly disclosed as NOT source-confirmed, freely authored from
    general knowledge of modern spoken Polish (same standard as every
    prior unit's disclosed gaps): "poczta" (post office) and "apteka"
    (pharmacy) as standalone taught vocabulary do not appear verbatim in
    the specific source passages checked for this unit (the source's own
    direction-asking examples favor named streets/squares/consulates over
    a generic post-office/pharmacy pairing), but both are ordinary,
    extremely common A1 Polish nouns for exactly the kind of everyday
    place this outcome targets -- freely authored, not source-adapted.
    "obok" (next to) and "naprzeciwko" (across from) as a genitive-
    governing preposition pair are likewise freely authored from general
    Polish grammar knowledge rather than pulled from a specific confirmed
    source line (the source's own examples in the passages checked lean
    on prosto/na prawo/na lewo turn-by-turn phrasing, which belongs to
    the NEXT unit's directions outcome, not this one's location-relative-
    to-a-landmark scope) -- both are correct, ordinary Polish
    prepositions, just not directly source-attested for this specific
    unit's scope. The lesson03 dialogue's "blisko parku" (near the park)
    additionally uses *blisko* transitively, governing the genitive the
    same way obok/naprzeciwko do -- also freely authored (not
    source-confirmed for this specific construction), disclosed
    separately because it gives a word this unit's lesson02 also teaches
    used intransitively ("Park jest blisko.") a second syntactic
    behavior; lesson02's grammar note was written to explicitly cover
    both uses rather than leave the dialogue's genitive form unexplained,
    matching English's own identical duality ("It's near" vs. "It's near
    the park") so it shouldn't confuse an English-speaking learner. The
    genitive-singular note is deliberately narrowed to
    only the three regular masculine-inanimate nouns already taught in
    this unit (bank -> banku, hotel -> hotelu, park -> parku) rather than
    also covering
    feminine nouns like poczta/apteka (a different declension pattern
    entirely, poczty/apteki) -- the same intentional A1 scope-narrowing
    unit07 already applied to its own -ów genitive-plural note, to keep
    one consistent, teachable rule rather than exposing two different
    genitive patterns in the same lesson; poczta and apteka are therefore
    only ever tested in this file in their plain nominative form. The
    whole lesson03 Ewa/Marek town scene and its specific facts (the
    pharmacy is next to the bank; the restaurant is across from the
    hotel, near the park) are original, freshly authored, continuing the
    established two-character framing this course has used since unit01
    (Ewa as the recurring protagonist; Marek Wójcik, first named in
    unit01's introductions lesson, reappearing here as a second named
    character rather than an anonymous "Sprzedawca"-style role like
    unit07's market vendor).

    Cross-checked against this file's own earlier lessons per
    AUTHORING_GUIDE §11: the pharmacy's location (obok banku, next to the
    bank) and the restaurant's location (naprzeciwko hotelu, blisko
    parku -- across from the hotel, near the park) are stated identically
    in lesson03's teaching dialogue and reused identically (never
    contradicted) in the matching lesson03 exercises (dialogue_
    comprehension exercises 03/04, the dialogue_response in exercise10,
    and the grammar_check in exercise09, which corrects a broken
    "naprzeciwko hotel" back to the exact same "naprzeciwko hotelu" fact
    already established in the dialogue) -- no place is ever given two
    different locations across the file.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    realization found clean. Overlay fixes (false grammar notes, missing
    elliptical reply variants) recorded in the en-pl overlay notes.

    Coordinator sweep 2026-10-17 (same review): 8 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

    Second-pass review 2026-10-19: 0 fixes (realization); overlay fixes
    recorded in the en-pl overlay notes.

course:
  realization_key: pl.a1
  target_language_first: true
  dialect: pl_standard
  register_policy: >-
    Continue unit01-07's register split: Ewa and Marek use the informal
    ty-register with each other (they are already acquainted, established
    since unit01), but lesson03's scene opens with Ewa addressing Marek
    with the polite attention-getting "Przepraszam" -- a real, idiomatic
    Polish habit even between people who know each other reasonably well
    when interrupting to ask a practical question on the street, matching
    the source's own repeated use of "Przepraszam" as a universal opener
    regardless of the underlying relationship. Lesson01/lesson02's
    teaching cards and grammar notes are register-neutral (jest/obok/
    naprzeciwko are used identically regardless of who is being
    addressed).

