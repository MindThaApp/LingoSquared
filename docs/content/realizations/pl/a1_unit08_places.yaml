            kind: vocabulary
            target: {text: "bank, poczta", language_code: pl, direction: ltr}
            introduced_tokens: ["bank", "poczta"]
            example:
              - {text: "To jest bank.", language_code: pl, direction: ltr}
              - {text: "To jest poczta.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit08.lesson01.teach.apteka_restauracja
            kind: vocabulary
            target: {text: "apteka, restauracja", language_code: pl, direction: ltr}
            introduced_tokens: ["apteka", "restauracja"]
            example:
              - {text: "To jest apteka.", language_code: pl, direction: ltr}
              - {text: "To jest restauracja.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit08.lesson01.teach.hotel_park
            kind: vocabulary
            target: {text: "hotel, park", language_code: pl, direction: ltr}
            introduced_tokens: ["hotel", "park"]
            example:
              - {text: "To jest hotel.", language_code: pl, direction: ltr}
              - {text: "To jest park.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit08.lesson01.teach.gdzie_jest_note
            kind: grammar_note
            target: {text: "Gdzie jest + [miejsce]? -- Gdzie (where) plus jest (is) pyta o lokalizację: Gdzie jest bank? Gdzie jest apteka?", language_code: pl, direction: ltr}
            introduced_tokens: ["Gdzie", "jest"]
          - content_key: pl.a1.unit08.lesson01.teach.gdzie_jest_bank
            kind: phrase
            target: {text: "Gdzie jest bank?", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.a1.unit08.lesson01.exercise01.select_bank
            type: multiple_choice
            tested_text: "bank"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit08.lesson01.exercise02.select_apteka
            type: multiple_choice
            tested_text: "apteka"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit08.lesson01.exercise03.select_hotel
            type: multiple_choice
            tested_text: "hotel"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit08.lesson01.exercise04.match_places_vocabulary
            type: matching_pairs
            tested_text: "bank poczta apteka restauracja hotel park"
            prompt: {target_blocks: []}
            pairs:
              - {left: "bank", right: "bank"}
              - {left: "poczta", right: "post office"}
              - {left: "apteka", right: "pharmacy"}
              - {left: "restauracja", right: "restaurant"}
              - {left: "hotel", right: "hotel"}
              - {left: "park", right: "park"}
          - content_key: pl.a1.unit08.lesson01.exercise05.order_gdzie_jest_bank
            type: word_order
            tested_text: "Gdzie jest bank"
            prompt: {target_blocks: []}
            word_bank: ["jest", "Gdzie", "bank"]
          - content_key: pl.a1.unit08.lesson01.exercise06.order_gdzie_jest_apteka
