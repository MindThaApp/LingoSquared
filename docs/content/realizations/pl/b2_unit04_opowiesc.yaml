          - content_key: pl.b2.unit04.lesson06.teach.dialogue_ewa_open
            kind: dialogue
            target: {text: "Dlaczego byłeś dziś rano tak spóźniony?", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit04.lesson06.teach.dialogue_marek_outcome
            kind: dialogue
            target: {text: "Przegapiłem pociąg. Kiedy dotarłem na stację, pociąg już odjechał.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit04.lesson06.teach.dialogue_ewa_why
            kind: dialogue
            target: {text: "A dlaczego spóźniłeś się na stację?", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit04.lesson06.teach.dialogue_marek_prepast
            kind: dialogue
            target: {text: "Obudziłem się za późno. Poprzedniego wieczoru nie nastawiłem budzika.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit04.lesson06.teach.dialogue_ewa_order
            kind: dialogue
            target: {text: "Czyli to wydarzyło się najpierw, a potem przegapiłeś pociąg.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: [a, przegapiłeś]
          - content_key: pl.b2.unit04.lesson06.teach.dialogue_marek_confirm
            kind: dialogue
            target: {text: "Dokładnie. Najpierw budzik, potem pociąg.", language_code: pl, direction: ltr, speaker: Marek}
            introduced_tokens: []
          - content_key: pl.b2.unit04.lesson06.teach.grammar_cala_historia
            kind: grammar_note
            target: {text: "Padało tego ranka. Poprzedniego wieczoru nie nastawiłem budzika. W końcu przegapiłem pociąg.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit04.lesson06.exercise01.comprehend_earliest
            type: dialogue_comprehension
            tested_text: "poprzedniego wieczoru nie nastawiłem budzika"
            media_asset_key: pl.b2.audio.opowiesc.dialogue.spozniony.01
            prompt: {target_blocks: [{text: "Marek tells the story out of order. In the TRUE sequence, which event happened FIRST of all?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson06.exercise02.comprehend_last
            type: dialogue_comprehension
            tested_text: "przegapiłem pociąg"
            media_asset_key: pl.b2.audio.opowiesc.dialogue.spozniony.01
            prompt: {target_blocks: [{text: "In the TRUE sequence of events, which happened LAST?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson06.exercise03.comprehend_prepast
            type: dialogue_comprehension
            tested_text: "pociąg już odjechał"
            media_asset_key: pl.b2.audio.opowiesc.dialogue.spozniony.01
            prompt: {target_blocks: [{text: "When Marek reached the station, what had ALREADY happened by that time?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson06.exercise04.order_obudzilem_sie
            type: word_order
            tested_text: "Obudziłem się za późno"
            prompt: {target_blocks: []}
            word_bank: [Obudziłem, się, za, późno]
          - content_key: pl.b2.unit04.lesson06.exercise05.speak_recount
            type: speak_response
            tested_text: "Padało i śpieszyłem się. Kiedy dotarłem na stację, pociąg już odjechał."
            prompt: {target_blocks: [{text: "Recount the incident aloud in TWO sentences, with the time layers marked. (1) The background, joined with i: It was raining and I was hurrying. (2) A foregrounded event with something that had already happened, using kiedy and już: When I arrived at the station, the train had already left.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson06.exercise06.write_full_account
            type: writing_prompt
            tested_text: "Padało tego ranka. Poprzedniego wieczoru nie nastawiłem budzika. W końcu przegapiłem pociąg."
            prompt: {target_blocks: [{text: "Write a short THREE-sentence account of why you were late, with all three time layers. (1) The background: It was raining that morning. (2) A PRE-PAST cause, using poprzedniego wieczoru with the negated perfective past: The evening before, I hadn't set my alarm. (3) The foreground outcome, using w końcu with the perfective past: In the end I missed the train.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson06.exercise07.respond_why_late
            type: dialogue_response
            tested_text: "Obudziłem się za późno"
            prompt: {target_blocks: [{text: "Dlaczego byłeś dziś rano tak spóźniony?", language_code: pl, direction: ltr}]}
