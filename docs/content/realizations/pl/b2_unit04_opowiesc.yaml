      - content_key: pl.b2.unit04.lesson05.co_wydarzylo_sie_najpierw
        title: "Co wydarzyło się najpierw?"
        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: pl.b2.unit04.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                W końcu przegapiłem pociąg. Kiedy dotarłem na stację,
                pociąg już odjechał. Padało tego ranka i śpieszyłem się.
                Ale to zaczęło się wcześniej: poprzedniego wieczoru nie
                nastawiłem budzika. Dlatego obudziłem się za późno.
              language_code: pl
              direction: ltr
            introduced_tokens: [i, zaczęło, wcześniej, Dlatego, obudziłem, za, późno]
        exercises:
          - content_key: pl.b2.unit04.lesson05.exercise01.read_earliest
            type: reading_comprehension
            tested_text: "poprzedniego wieczoru nie nastawiłem budzika"
            prompt: {target_blocks: [{text: "The story is told out of order. Which event happened FIRST of all -- the earliest in time?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson05.exercise02.read_result
            type: reading_comprehension
            tested_text: "obudziłem się za późno"
            prompt: {target_blocks: [{text: "What was the direct result of not having set the alarm?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson05.exercise03.read_outcome
            type: reading_comprehension
            tested_text: "przegapiłem pociąg"
            prompt: {target_blocks: [{text: "What does the writer present as the final outcome of the story?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson05.exercise04.read_prepast
            type: reading_comprehension
            tested_text: "pociąg już odjechał"
            prompt: {target_blocks: [{text: "When the writer reached the station, what had ALREADY happened before that?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson05.exercise05.match_reading_words
            type: matching_pairs
            tested_text: "i zaczęło się wcześniej dlatego obudziłem się za późno"
            prompt: {target_blocks: []}
            pairs:
              - {left: i, right: and}
              - {left: "zaczęło się", right: "began / started"}
              - {left: wcześniej, right: earlier}
              - {left: dlatego, right: "that's why / therefore"}
              - {left: "obudziłem się", right: "I woke up"}
              - {left: "za późno", right: "too late"}
          - content_key: pl.b2.unit04.lesson05.exercise06.translate_padalo_spieszylem
            type: translation
            tested_text: "Padało tego ranka i śpieszyłem się"
            prompt: {target_blocks: [{text: "Translate into Polish, joining two background clauses with i: It was raining that morning and I was hurrying.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit04.lesson05.exercise07.write_dlatego
            type: writing_prompt
            tested_text: "Dlatego obudziłem się za późno"
            prompt: {target_blocks: [{text: "Write in Polish, starting with Dlatego: That's why I woke up too late.", language_code: en, direction: ltr}]}

      - content_key: pl.b2.unit04.lesson06.opowiadanie_calej_historii
        title: "Opowiadanie całej historii"
        spine_outcome_id: universal.b2.narrative.recount_complex_events_with_shifting_time
        teaching:
          - content_key: pl.b2.unit04.lesson06.teach.dlaczego_byles_spozniony
            kind: phrase
            target: {text: "Dlaczego byłeś dziś rano tak spóźniony?", language_code: pl, direction: ltr}
            introduced_tokens: [byłeś, tak, spóźniony]
          - content_key: pl.b2.unit04.lesson06.teach.czyli
            kind: vocabulary
