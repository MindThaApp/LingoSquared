generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's
    fourth B2 unit (narrative / shifting time reference). Same "no
    adaptable upper-intermediate public-domain Polish source exists"
    outcome as pl's earlier B2 units; built from established modern
    Polish grammar/discourse knowledge. Structural exemplar:
    docs/content/realizations/nl/b2_unit04_verhaal.yaml, consulted ONLY
    for unit shape -- every Polish sentence below is authored fresh from
    Polish grammar. IMPORTANT STRUCTURAL DISCLOSURE (not a calque of the
    Dutch exemplar -- a deliberate, honest divergence from it): modern
    standard Polish has NO productive pluperfect tense in everyday use
    (the archaic "byl + past-tense" construction is literary/dialectal,
    not taught here). Where Dutch marks background/foreground/pre-past
    with three distinct grammaticalized tenses (imperfectum/perfectum/
    plusquamperfectum), Polish instead marks this THROUGH ASPECT
    (imperfective verbs for background description vs. perfective verbs
    for the completed foregrounded event) PLUS temporal adverbials/
    conjunctions (już "already", zanim "before", poprzedniego wieczoru
    "the evening before") layered onto ordinary past tense -- this is
    the genuinely idiomatic Polish way to achieve the same communicative
    outcome, not an approximation of a missing tense. Character canon:
    Marek and Ewa continue from pl's B2 units 01-03 (grepped again
    before writing; no new facts introduced that would conflict).
review:
  status: "reviewed"
  required_next_reviewer: native_speaker_pass
  notes: >-
    Fourth Polish B2 unit; first narrative / shifting-time-reference
    unit. Targets the CEFR B2 narrative outcome
    (universal.b2.narrative.recount_complex_events_with_shifting_time):
    recount a complex sequence with shifting time reference -- background
    vs foreground, events BEFORE other past events, interrupted/ongoing
    actions -- keeping the timeline unambiguous. Theme: ONE coherent
    everyday incident recounted non-linearly across all six lessons --
    Marek missed the train because of an earlier event (not setting his
    alarm the night before -> oversleeping -> arriving to find the train
    already gone). Lesson arc: L01 the BACKGROUND with imperfective aspect
    (padało, byłem zmęczony, śpieszyłem się); L02 the FOREGROUND event
    with perfective aspect plus sequence markers (przegapiłem pociąg;
    najpierw / potem / w końcu); L03 the interruptive 'kiedy' vs ongoing
    'podczas gdy' vs habitual 'gdy'; L04 the PRE-PAST, marked via
    'zanim'/'już'/'poprzedniego wieczoru' plus aspect rather than a
    dedicated tense (nie nastawiłem budzika; zanim dotarłem, pociąg już
    odjechał); L05 a non-linear reading that must be re-ordered to find
    the EARLIEST event; L06 the culminating production -- a Marek/Ewa
    dialogue for the listening requirement (an account told OUT OF ORDER;
    reconstruct the true chronology), a speaking task (recount with
    background + an interrupting event + a pre-past event) and a writing
    task (background + foregrounded event + an event that preceded both).
    Register: informal ty throughout, per pl's established lane pin. All
    vocabulary is introduced self-contained within this file. No
    sibling-direction file (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    false grammar -- the unit taught kiedy = single moment vs gdy =
    habitual as distinct meanings; in Polish kiedy and gdy are largely
    interchangeable 'when' and the habitual reading comes from
    imperfective present + zawsze. Fixed teach notes (kiedy_dotarlem,
    podczas_gdy, gdy_habit, grammar_kiedy_gdy), lesson03.exercise01
    (correct 'when'; distractors before/already/then -- 'whenever' would
    have been a second correct), lesson03.exercise03 matching (gdy
    'whenever (a habit)' -> zawsze 'always', kiedy -> 'when'),
    lesson03.exercise07 instruction (now 'opening with gdy and using
    zawsze for the habit'); (2) lesson02.exercise02 -- distractor 'I was
    late for the train.' near-synonymous with przegapilem pociag -> 'I
    waited for the train.'; (3) lesson01.exercise01 -- ungrammatical
    giveaway distractor 'it was hurrying' -> 'it was late'; (4)
    dialogue_ewa_why gloss 'late for the station' -> 'late getting to
    the station'; (5) missing accepted answers: 'Tego ranka padalo'
    (order taught in teach.tego_ranka example), 'Potem sie
    spieszylem/spieszylam' (natural clitic placement). NATIVE CHECK:
    'Dlaczego byles dzis rano tak spozniony?' vs the more usual
    'Dlaczego sie dzis rano tak spozniles?'; 'A dlaczego spozniles sie
    na stacje?'. Prior native-check priorities (moved here from
    required_next_reviewer): Native-Polish confirmation needed. This is
    a DRAFT. Priority checks for the reviewer: (1) confirm the aspect
    choices are correct throughout -- imperfective for
    background/ongoing (padało, byłem zmęczony, śpieszyłem się,
    ubierałem się) vs. perfective for completed foreground events
    (przegapiłem, dotarłem, odjechał, obudziłem się) -- this is the
    single most important grammar check in the unit; (2) that "kiedy"
    (single past interruption) vs "podczas gdy" (ongoing/simultaneous)
    vs "gdy" (habitual) are used correctly and read naturally in
    lesson03's three example sentences; (3) that "zanim ... już ..."
    genuinely conveys the pre-past/"had already" meaning to a native ear
    without a dedicated pluperfect tense, and that "poprzedniego
    wieczoru" + negated perfective past ("nie nastawiłem budzika") reads
    as natural pre-past framing, not as ambiguous simple past; (4)
    whether "przegapić pociąg" (reused from unit02) still reads
    naturally in this new context; (5) the culminating writing exercise
    (lesson06 exercise06) is graded against a fixed three-sentence
    string -- confirm the accepted-answer punctuation variants are
    complete.

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    Informal ty throughout (pl's established lane pin). B2 narrative
    layers ASPECT CHOICE (imperfective for background, perfective for the
    foregrounded event) and temporal conjunctions/adverbials (kiedy,
    podczas gdy, gdy, zanim, już, poprzedniego wieczoru) onto that
    register, while keeping everyday informal address established for
    Marek and Ewa.

