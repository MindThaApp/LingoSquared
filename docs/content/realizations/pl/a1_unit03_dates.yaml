review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Third Polish unit, continuing directly from pl/a1_unit02_numbers.yaml
    (same Ewa/Marek characters, same formal pan/pani register). Realizes
    universal.a1.dates.exchange_calendar_dates (confirmed the next A1
    outcome in spine order after numbers.use_basic_numbers via
    universal_spine.yaml -- prerequisites list literally names
    universal.a1.numbers.use_basic_numbers, and nl/fa's own unit03/unit04
    both realize this exact outcome next). Sized to 3 lessons matching
    unit01/02's bootstrap pace, not the 6-lesson depth nl's own calendar-
    dates unit eventually grew to (checked nl/a1_unit03_dates.yaml for the
    topic precedent). Authored from the start in AUTHORING_GUIDE §19
    format (schema_version 1.1): every kind:vocabulary card carries a real
    example sentence, checked by hand for correct Polish case usage
    (locative "w/we + month" for stating when something recurs; genitive
    "[ordinal]-ego + [month]-a, no preposition" for stating a specific
    date, matching the source's own table exactly). Zero listen_type/
    listen_select/listen_order exercises anywhere in this file, matching
    unit01/02's own established choice for this corpus (pl has real
    Google Cloud TTS confirmed live, but this file stays consistent with
    the precedent already set rather than introducing the first
    audio-dependent exercise unilaterally -- a future audio-authoring
    pass is a real, cheap opportunity now that TTS is wired, just not
    done here). media_assets is therefore an empty list, not an
    oversight. dialogue_comprehension exercises in lesson03 render via
    the same MultipleChoice component as multiple_choice/listen_select
    (frontend/src/components/exercises/ExerciseRenderer.tsx) and are
    given real target_blocks text instead of a media_asset_key, matching
    unit01/02's own pattern.

    Cross-file vocabulary note (confirmed unit02 hit this too): every
    word this file reuses from unit01/unit02 (pan/pani forms, "Do
    zobaczenia", "jest", etc.) is re-declared via this file's OWN
    introduced_tokens before being tested in this file's own exercises --
    the compiler validates untaught vocabulary per realization FILE, not
    per course, so no cross-file credit is given even for words already
    taught in an earlier unit of the same course.

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text (fsi-languages.yojik.eu/languages/FSI/Polish/
    FAST/FSI - Polish FAST.pdf, cached from unit02's download this
    session at .firecrawl/fsi-polish-fast.pdf / .txt, extracted via
    pdftotext -layout). Two real sections used, adapted per §10 (never
    imported verbatim): (1) pp. 220-221, "DAYS OF THE WEEK" -- the full
    poniedziałek-niedziela list and the w/we + weekday pattern (including
    the real, source-confirmed "we wtorek" euphonic exception, taught
    here via a grammar_note rather than copied verbatim) came directly
    from this table and the "Practice using different days of the week"
    drill section (e.g. "Dzisiaj jest poniedziałek, prawda?" -- the
    source's own confirmation-question pattern, echoed here in this
    file's own "Jaki dziś jest dzień tygodnia?" direct-question form
    rather than copied as the same tag-question sentence). (2) pp.
    323-332, "LANGUAGE NOTES" on dates -- the full months table with
    correct locative forms (including luty's adjectival exception and the
    "we wrześniu"/"we wtorek" euphonic pattern, both real and both
    reused correctly, not guessed), the ordinal day-of-month table
    (pierwszego, piątego, dziesiątego, piętnastego -- a representative
    subset actually used in this unit's own scenario, not the source's
    full pierwszego-through-trzydziestego list, since this unit only
    needs two concrete dates), and the -ego/-a genitive date construction
    rule itself (paraphrased in this file's own grammar_note, not copied
    from the source's "The day will always have the -ego endings..."
    phrasing). The source's own real birthday-date model sentence "moje
    urodziny są siódmego czerwca" directly informed this file's
    "Moje urodziny są [ordinal] maja" pattern (date changed to
    dziesiątego maja to avoid a verbatim reuse of the source's exact
    date), and the source's real appointment-scheduling drills (pp.
    330-331, "Praktyce suggesting various appointment dates" -- e.g. "Czy
    odpowiada panu/pani...?", "w sobotę, dwunastego kwietnia") directly
    informed lesson03's whole scenario and its "Czy piątek panu/pani
    odpowiada?" phrasing -- adapted from a diplomatic-office scheduling
    context into a personal continuing-acquaintance scenario for Ewa and
    Marek, consistent with the modernization requirement (the source's
    own dialogue is 1990s diplomatic-office register; this unit's
    dialogue is plain personal register throughout).

    One real gap, disclosed honestly: the source's calendar-date material
    never happens to use May, so "dziesiątego maja" (birthday) and
    "piętnastego maja" (meeting date) are freshly assembled from the
    source's own separately-confirmed ordinal table and months table
    (both real, both verified against the source), not lifted as a whole
    phrase from any single source sentence. The meeting date's weekday
    claim was independently verified, not guessed: 15 May 2026 is a
    real, calendar-true Friday (checked via `date -j`), matching this
    file's own lesson01 "piątek" vocabulary and avoiding the
    weekday/date-mismatch bug class documented in nl/a1_unit03_dates.yaml's
    own review history.

    The lesson03 Ewa/Marek meeting-scheduling dialogue, and the specific
    dates chosen (10 May for Ewa's stated birthday, 15 May/Friday for the
    agreed meeting), are freshly authored, continuing unit01/02's
    characters and formal register (plus one informal "ci" variant,
    matching unit01/02's own precedent of teaching both registers for key
    phrases even when the dialogue itself stays formal).

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    date_pattern_note corrected for the lutego exception; the
    lesson03.exercise05 matching pair 'Jaka to będzie data?' ->
    'Piętnastego maja.' was replaced because it was interchangeable with
    the 'Kiedy jest spotkanie?' pair. Both are mirrored in the en-pl
    overlay; see its notes.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

