generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's
    eighth B2 unit (synthesis), the FINAL unit of the 8-unit pl B2 tier.
    No adaptable upper-intermediate public-domain Polish source exists;
    built from established modern Polish grammar/discourse knowledge.
    Structural exemplar: docs/content/realizations/nl/b2_unit08_synthese.yaml,
    consulted ONLY for unit shape -- every Polish sentence below is
    authored fresh from Polish grammar. Theme: two online reviews of a
    new restaurant ("Pod Lipą"), one by Zosia and one by Bartek, that
    AGREE the food is good but CONFLICT on the price. Character canon:
    grepped pl/b1_*.yaml and pl/b2_unit01-07.yaml before writing -- Marek
    and Ewa (the discussing pair, established informal ty) continue
    unchanged; Zosia and Bartek are NEW named review authors, corpus-grepped
    for name collisions before use (both unused; "Kasia" was avoided
    despite being free of conflict, since she is already an established
    Ewa/Marek mutual friend in pl/b1_unit05 and using her as an unrelated
    review author risked implying she'd moved to Kraków for nothing to do
    with this restaurant -- a needless canon entanglement, not a real
    conflict, but avoided for cleanliness).
    GENDER-AGREEMENT AUDIT: this unit's synthesis vocabulary (uważam,
    twierdzi, utrzymuje, zgadzają się, różnią się, mówi) is entirely
    3rd-person or 1st-person-PLURAL present tense throughout -- Polish
    present tense never marks gender for any person, so NO exercise in
    this unit needed a dual-gender accepted-answer split. The 1st-plural
    "zgadzamy się" (lesson06) refers to the fixed mixed-gender Marek+Ewa
    pair and is itself gender-invariant in the present tense regardless.
review:
  status: "unreviewed"
  required_next_reviewer: >-
    Native-Polish confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness of the attributing frames (według,
    twierdzić, utrzymywać, wynika z... że...) and that "utrzymywać"
    (to maintain/assert) genuinely reads as a neutral-to-slightly-skeptical
    attribution verb, distinct from "twierdzić" (to claim/state); (2) the
    comparing connectives (oba/obie, podczas gdy, natomiast, w
    przeciwieństwie do) and the agreement/conflict frames (zgadzają się co
    do, różnią się w opinii co do, są sprzeczni co do) -- confirm each
    reads as current everyday informal Polish and that the subordinate
    word order after "podczas gdy" is right; (3) confirm "co do" (on the
    point of / regarding) is the natural collocation throughout, not
    stilted; (4) the culminating writing exercise (lesson06 exercise06) is
    graded against a fixed three-sentence string -- confirm the
    accepted-answer punctuation variants are complete; (5) confirm "wart
    obejrzenia" is NOT reused here (that was unit03, about a film) but
    "warta polecenia"/price vocabulary read as natural informal restaurant-review
    register, and that "za tę cenę oczekuję więcej" reads naturally.
  notes: >-
    Eighth Polish B2 unit; final unit of the tier. Targets the CEFR B2
    synthesis outcome
    (universal.b2.synthesis.summarize_and_evaluate_multiple_sources):
    summarize and evaluate multiple sources -- name where two sources
    agree, where they conflict, and give a reasoned judgement between
    them. Theme: two online reviews of a new restaurant ("Pod Lipą"), one
    by Zosia and one by Bartek, that AGREE the food is good but CONFLICT
    on the price -- one of which is better supported. Lesson arc: L01
    attributing a claim to a source (według / twierdzić / utrzymywać /
    wynika z... że...); L02 comparing two sources side by side (oba/obie /
    podczas gdy / natomiast / w przeciwieństwie do); L03 naming AGREEMENT
    (zgadzają się co do / to samo); L04 naming CONFLICT (różnią się w
    opinii co do / są sprzeczni co do / różnica); L05 a reading of BOTH
    review texts side by side -- identify the agreement, the conflict
    point, and which review backs its price claim with a reason; L06 the
    culminating production -- a Marek/Ewa dialogue for the listening
    requirement (identify agreement, conflict, and which speaker is
    better supported), a speaking synthesis, and a writing synthesis that
    NAMES all three parts (agreement + conflict + reasoned judgement).
    Register: informal ty throughout, per pl's established lane pin;
    Marek and Ewa continue their established register. All vocabulary is
    introduced self-contained within this file, cumulative with units
    01-07 which precede it in the course. No sibling-direction file
    (pl-en) was consulted.

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    Informal ty throughout (pl's established lane pin). B2 synthesis
    layers the attributing, comparing, agreement/conflict and judgement
    toolkit onto that register -- według, twierdzi, utrzymuje, oba/obie,
    podczas gdy, natomiast, zgadzają się co do, różnią się w opinii co
    do, bardziej przekonujący -- while keeping everyday informal address
    established for Marek and Ewa.

