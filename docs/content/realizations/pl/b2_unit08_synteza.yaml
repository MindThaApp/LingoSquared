units:
  - content_key: pl.b2.unit08.synteza
    title: "Synteza"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.synthesis.summarize_and_evaluate_multiple_sources
    planned_lesson_count: 6

    lessons:
      - content_key: pl.b2.unit08.lesson01.kto_co_mowi
        title: "Kto co mówi?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: pl.b2.unit08.lesson01.teach.pod_lipa
            kind: phrase
            target: {text: "Pod Lipą to nowa restauracja.", language_code: pl, direction: ltr}
            introduced_tokens: ["Pod", Lipą, nowa, restauracja]
          - content_key: pl.b2.unit08.lesson01.teach.recenzja
            kind: vocabulary
            target: {text: "recenzja", language_code: pl, direction: ltr}
            introduced_tokens: [recenzja, która, recenzji]
            example: {text: "Która to recenzja?", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson01.teach.zrodlo
            kind: vocabulary
            target: {text: "źródło", language_code: pl, direction: ltr}
            introduced_tokens: [źródło]
            example: {text: "Recenzja to źródło.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson01.teach.wedlug
            kind: vocabulary
            target: {text: "według", language_code: pl, direction: ltr}
            introduced_tokens: [według, Zosi, Zosia, jedzenie, jedzenia, smaczne, uważa]
            example: {text: "Według Zosi jedzenie jest smaczne.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson01.teach.cena
            kind: vocabulary
            target: {text: "cena", language_code: pl, direction: ltr}
            introduced_tokens: [cena, wysoka, ceny, cenę, pizza]
            example: {text: "Cena jest wysoka.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson01.teach.twierdzic
            kind: vocabulary
            target: {text: "twierdzić (twierdzi)", language_code: pl, direction: ltr}
            introduced_tokens: [twierdzić, twierdzi, drogie]
            example: {text: "Zosia twierdzi, że to nie jest drogie.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson01.teach.utrzymywac
            kind: vocabulary
            target: {text: "utrzymywać (utrzymuje)", language_code: pl, direction: ltr}
            introduced_tokens: [Bartek, utrzymywać, utrzymuje, za]
            example: {text: "Bartek utrzymuje, że to jest za drogie.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson01.teach.wynika_ze
            kind: phrase
            target: {text: "wynika z ... że...", language_code: pl, direction: ltr}
            introduced_tokens: [wynika]
            example: {text: "Z recenzji wynika, że jedzenie jest smaczne.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson01.teach.grammar_atrybucja
            kind: grammar_note
            target: {text: "Według Zosi jedzenie jest smaczne. Bartek utrzymuje, że to jest za drogie. Z recenzji wynika, że jedzenie jest smaczne.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit08.lesson01.exercise01.recognize_wedlug
            type: multiple_choice
            tested_text: według
            prompt: {target_blocks: [{text: według, language_code: pl, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson01.exercise02.listen_wedlug_zosi
            type: listen_select
            tested_text: "Według Zosi jedzenie jest smaczne."
            media_asset_key: pl.b2.audio.synteza.wedlug_zosi.01
            prompt: {target_blocks: []}
          - content_key: pl.b2.unit08.lesson01.exercise03.match_attribution_words
            type: matching_pairs
            tested_text: "według twierdzić utrzymywać wynika że recenzja źródło jedzenie cena"
            prompt: {target_blocks: []}
            pairs:
              - {left: według, right: "according to"}
              - {left: twierdzi, right: "claims / states"}
              - {left: utrzymuje, right: "maintains / asserts"}
              - {left: "wynika, że...", right: "it follows that..."}
              - {left: recenzja, right: review}
              - {left: źródło, right: source}
              - {left: jedzenie, right: food}
              - {left: cena, right: price}
          - content_key: pl.b2.unit08.lesson01.exercise04.order_wedlug_zosi
            type: word_order
            tested_text: "Według Zosi jedzenie jest smaczne"
            prompt: {target_blocks: []}
            word_bank: [Według, Zosi, jedzenie, jest, smaczne]
          - content_key: pl.b2.unit08.lesson01.exercise05.translate_utrzymuje
            type: translation
            tested_text: "Bartek utrzymuje, że to jest za drogie"
            prompt: {target_blocks: [{text: "Translate into Polish, using utrzymywać: Bartek maintains that it is too expensive.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson01.exercise06.speak_wedlug_zosi
            type: speak_response
            tested_text: "Według Zosi to nie jest drogie"
            prompt: {target_blocks: [{text: "Say aloud in Polish, using według: According to Zosia, it isn't expensive.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson01.exercise07.write_wynika
            type: writing_prompt
            tested_text: "Z recenzji wynika, że jedzenie jest smaczne"
            prompt: {target_blocks: [{text: "Write in Polish, using wynika, że: The review shows that the food is tasty.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson01.exercise08.dictation_wedlug_zosi
            type: dictation
            tested_text: "Według Zosi jedzenie jest smaczne."
            media_asset_key: pl.b2.audio.synteza.wedlug_zosi.01
            prompt: {target_blocks: []}

      - content_key: pl.b2.unit08.lesson02.dwa_zrodla_obok_siebie
        title: "Dwa źródła obok siebie"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: pl.b2.unit08.lesson02.teach.oba_obie
            kind: vocabulary
            target: {text: "oba / obie", language_code: pl, direction: ltr}
            introduced_tokens: [oba, obie, źródła, chwalą]
            example: {text: "Oba źródła chwalą jedzenie.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson02.teach.tanio
            kind: vocabulary
            target: {text: "tanio", language_code: pl, direction: ltr}
            introduced_tokens: [tanio]
            example: {text: "Zosia uważa, że jest tanio.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson02.teach.podczas_gdy_reuse
            kind: phrase
            target: {text: "podczas gdy", language_code: pl, direction: ltr}
            introduced_tokens: [drogo]
            example: {text: "Zosia uważa, że jest tanio, podczas gdy Bartek uważa, że jest drogo.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson02.teach.pozytywna_negatywny
            kind: vocabulary
            target: {text: "pozytywna / negatywny", language_code: pl, direction: ltr}
            introduced_tokens: [pozytywna, negatywny]
            example: {text: "Zosia jest pozytywna. Bartek jest negatywny.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson02.teach.natomiast_reuse
            kind: vocabulary
            target: {text: "natomiast", language_code: pl, direction: ltr}
            introduced_tokens: []
            example: {text: "Zosia jest pozytywna, Bartek natomiast jest negatywny.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson02.teach.w_przeciwienstwie_do
            kind: phrase
            target: {text: "w przeciwieństwie do", language_code: pl, direction: ltr}
            introduced_tokens: [w, przeciwieństwie, do]
            example: {text: "W przeciwieństwie do Zosi, Bartek uważa, że to drogo.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson02.teach.grammar_porownanie
            kind: grammar_note
            target: {text: "Oba źródła chwalą jedzenie. Zosia uważa, że jest tanio, podczas gdy Bartek uważa, że jest drogo.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit08.lesson02.exercise01.recognize_podczas_gdy
            type: multiple_choice
            tested_text: "podczas gdy"
            prompt: {target_blocks: [{text: "podczas gdy", language_code: pl, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson02.exercise02.listen_oba_zrodla
            type: listen_select
            tested_text: "Oba źródła chwalą jedzenie."
            media_asset_key: pl.b2.audio.synteza.oba_zrodla.01
            prompt: {target_blocks: []}
          - content_key: pl.b2.unit08.lesson02.exercise03.match_comparison_words
            type: matching_pairs
            tested_text: "oba obie podczas gdy natomiast w przeciwieństwie do pozytywna negatywny"
            prompt: {target_blocks: []}
            pairs:
              - {left: oba, right: "both (neuter/masc.)"}
              - {left: obie, right: "both (feminine)"}
              - {left: "podczas gdy", right: whereas}
              - {left: natomiast, right: "by contrast"}
              - {left: "w przeciwieństwie do", right: "in contrast to"}
              - {left: pozytywna, right: positive}
              - {left: negatywny, right: negative}
          - content_key: pl.b2.unit08.lesson02.exercise04.order_oba_zrodla
            type: word_order
            tested_text: "Oba źródła chwalą jedzenie"
            prompt: {target_blocks: []}
            word_bank: [Oba, źródła, chwalą, jedzenie]
          - content_key: pl.b2.unit08.lesson02.exercise05.translate_podczas_gdy
            type: translation
            tested_text: "Zosia jest pozytywna, podczas gdy Bartek jest negatywny"
            prompt: {target_blocks: [{text: "Translate into Polish, using podczas gdy: Zosia is positive, whereas Bartek is negative.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson02.exercise06.translate_w_przeciwienstwie
            type: translation
            tested_text: "W przeciwieństwie do Zosi, Bartek uważa, że to drogo"
            prompt: {target_blocks: [{text: "Translate into Polish, using w przeciwieństwie do: In contrast to Zosia, Bartek thinks it's expensive.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson02.exercise07.write_natomiast
            type: writing_prompt
            tested_text: "Zosia jest pozytywna, Bartek natomiast jest negatywny"
            prompt: {target_blocks: [{text: "Write in Polish, using natomiast: Zosia is positive; Bartek, by contrast, is negative.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson02.exercise08.dictation_oba_zrodla
            type: dictation
            tested_text: "Oba źródła chwalą jedzenie."
            media_asset_key: pl.b2.audio.synteza.oba_zrodla.01
            prompt: {target_blocks: []}

      - content_key: pl.b2.unit08.lesson03.w_czym_sie_zgadzaja
        title: "W czym się zgadzają?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: pl.b2.unit08.lesson03.teach.zgadzaja_sie_co_do
            kind: phrase
            target: {text: "zgadzają się co do", language_code: pl, direction: ltr}
            introduced_tokens: [zgadzają, co, do]
            example: {text: "Zgadzają się co do jedzenia.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson03.teach.opinia
            kind: vocabulary
            target: {text: "opinia", language_code: pl, direction: ltr}
            introduced_tokens: [opinia, moja]
            example: {text: "To moja opinia.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson03.teach.punkt
            kind: vocabulary
            target: {text: "punkt", language_code: pl, direction: ltr}
            introduced_tokens: [punkt, na, tym]
            example: {text: "Na tym punkcie się zgadzają.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson03.teach.mowic
            kind: vocabulary
            target: {text: "mówić (mówią)", language_code: pl, direction: ltr}
            introduced_tokens: [mówić, mówią, oboje]
            example: {text: "Oboje mówią, że jest smaczne.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson03.teach.to_samo
            kind: vocabulary
            target: {text: "to samo", language_code: pl, direction: ltr}
            introduced_tokens: [samo, uważają]
            example: {text: "Uważają to samo.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson03.teach.grammar_zgoda
            kind: grammar_note
            target: {text: "Zgadzają się co do jedzenia. Uważają to samo.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit08.lesson03.exercise01.recognize_zgadzaja_sie
            type: multiple_choice
            tested_text: "zgadzają się co do"
            prompt: {target_blocks: [{text: "zgadzają się co do", language_code: pl, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson03.exercise02.listen_zgadzaja_sie_co_do_jedzenia
            type: listen_select
            tested_text: "Zgadzają się co do jedzenia."
            media_asset_key: pl.b2.audio.synteza.zgadzaja_sie_jedzenia.01
            prompt: {target_blocks: []}
          - content_key: pl.b2.unit08.lesson03.exercise03.match_agreement_words
            type: matching_pairs
            tested_text: "zgadzają się co do to samo opinia punkt mówić oboje"
            prompt: {target_blocks: []}
            pairs:
              - {left: "zgadzają się co do", right: "they agree on"}
              - {left: "to samo", right: "the same"}
              - {left: opinia, right: opinion}
              - {left: punkt, right: point}
              - {left: mówią, right: "they say"}
              - {left: oboje, right: "both (of them)"}
          - content_key: pl.b2.unit08.lesson03.exercise04.order_zgadzaja_sie
            type: word_order
            tested_text: "Zgadzają się co do jedzenia"
            prompt: {target_blocks: []}
            word_bank: [Zgadzają, się, co, do, jedzenia]
          - content_key: pl.b2.unit08.lesson03.exercise05.translate_zgadzaja_sie
            type: translation
            tested_text: "Zgadzają się co do jedzenia"
            prompt: {target_blocks: [{text: "Translate into Polish, using zgadzają się co do: They agree on the food.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson03.exercise06.speak_oboje
            type: speak_response
            tested_text: "Oboje mówią, że jest smaczne"
            prompt: {target_blocks: [{text: "Say aloud in Polish, using oboje: They both say that it is tasty.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit08.lesson03.exercise07.write_zgadzaja_sie
            type: writing_prompt
            tested_text: "Zgadzają się co do jedzenia"
            prompt: {target_blocks: [{text: "Write in Polish, using zgadzają się co do: They agree on the food.", language_code: en, direction: ltr}]}

      - content_key: pl.b2.unit08.lesson04.w_czym_sie_roznia
        title: "W czym się różnią?"
        spine_outcome_id: universal.b2.synthesis.summarize_and_evaluate_multiple_sources
        teaching:
          - content_key: pl.b2.unit08.lesson04.teach.roznia_sie_w_opinii
            kind: phrase
            target: {text: "różnią się w opinii co do", language_code: pl, direction: ltr}
            introduced_tokens: [Różnią, opinii]
            example: {text: "Różnią się w opinii co do ceny.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson04.teach.roznica
            kind: vocabulary
            target: {text: "różnica", language_code: pl, direction: ltr}
            introduced_tokens: [różnica]
            example: {text: "Różnica to cena.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson04.teach.sa_sprzeczni_co_do
            kind: phrase
            target: {text: "są sprzeczni co do", language_code: pl, direction: ltr}
            introduced_tokens: [są, sprzeczni]
            example: {text: "Są sprzeczni co do ceny.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit08.lesson04.teach.mimo_to_reuse
            kind: phrase
            target: {text: "mimo to", language_code: pl, direction: ltr}
