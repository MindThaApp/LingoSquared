            tested_text: "zadzwonić lub zrobić wideorozmowę"
            prompt: {target_blocks: [{text: "How does the author answer that objection?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson05.exercise04.read_conclusion
            type: reading_comprehension
            tested_text: "zalety przeważają nad wadami"
            prompt: {target_blocks: [{text: "What is the author's overall conclusion?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson05.exercise05.match_reading_words
