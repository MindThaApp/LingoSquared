units:
  - content_key: pl.b2.unit01.argumentacja
    title: "Argumentacja"
    section: reading_writing
    spine_outcome_ids:
      - universal.b2.argumentation.defend_a_position_with_evidence
    planned_lesson_count: 6

    lessons:
      - content_key: pl.b2.unit01.lesson01.zajecie_stanowiska
        title: "Zajęcie stanowiska"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: pl.b2.unit01.lesson01.teach.praca_zdalna
            kind: vocabulary
            target: {text: "praca zdalna", language_code: pl, direction: ltr}
            introduced_tokens: [praca, zdalna]
            example: {text: "Praca zdalna oszczędza czas.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit01.lesson01.teach.praca_w_biurze
            kind: phrase
            target: {text: "praca w biurze", language_code: pl, direction: ltr}
            introduced_tokens: [w, biurze]
          - content_key: pl.b2.unit01.lesson01.teach.stanowisko
            kind: vocabulary
            target: {text: "stanowisko", language_code: pl, direction: ltr}
            introduced_tokens: [stanowisko]
            example: {text: "Mam jasne stanowisko.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit01.lesson01.teach.uwazam_ze
            kind: phrase
            target: {text: "Uważam, że...", language_code: pl, direction: ltr}
            introduced_tokens: [Uważam, że]
          - content_key: pl.b2.unit01.lesson01.teach.moim_zdaniem
            kind: phrase
            target: {text: "Moim zdaniem...", language_code: pl, direction: ltr}
            introduced_tokens: [Moim, zdaniem]
          - content_key: pl.b2.unit01.lesson01.teach.lepsza
            kind: vocabulary
            target: {text: "lepsza", language_code: pl, direction: ltr}
            introduced_tokens: [lepsza, lepszy]
            example: {text: "Ten sposób jest lepszy.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit01.lesson01.teach.niz
            kind: vocabulary
            target: {text: "niż", language_code: pl, direction: ltr}
            introduced_tokens: [niż]
            example: {text: "Praca zdalna jest lepsza niż dojazdy.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit01.lesson01.teach.claim_model
            kind: phrase
            target: {text: "Praca zdalna jest lepsza niż praca w biurze.", language_code: pl, direction: ltr}
            introduced_tokens: [jest]
          - content_key: pl.b2.unit01.lesson01.teach.zgadzam_sie_z_tym
            kind: phrase
            target: {text: "Zgadzam się z tym.", language_code: pl, direction: ltr}
            introduced_tokens: [Zgadzam, się, z, tym]
          - content_key: pl.b2.unit01.lesson01.teach.grammar_stanowisko
            kind: grammar_note
            target: {text: "Uważam, że praca zdalna jest lepsza niż praca w biurze. Zgadzam się z tym.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit01.lesson01.exercise01.recognize_stanowisko
            type: multiple_choice
            tested_text: stanowisko
            prompt: {target_blocks: [{text: stanowisko, language_code: pl, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson01.exercise02.listen_claim
            type: listen_select
            tested_text: "Praca zdalna jest lepsza niż praca w biurze."
            media_asset_key: pl.b2.audio.argumentacja.claim_praca_zdalna.01
            prompt: {target_blocks: []}
          - content_key: pl.b2.unit01.lesson01.exercise03.match_claim_words
            type: matching_pairs
            tested_text: "praca zdalna praca w biurze stanowisko uważam że moim zdaniem lepsza niż zgadzam się z tym"
            prompt: {target_blocks: []}
            pairs:
              - {left: "praca zdalna", right: "remote work"}
              - {left: "praca w biurze", right: "office work"}
              - {left: stanowisko, right: "a position / viewpoint"}
              - {left: "Uważam, że...", right: "I think that..."}
              - {left: "Moim zdaniem...", right: "In my opinion..."}
              - {left: lepsza, right: better}
              - {left: niż, right: than}
              - {left: "Zgadzam się z tym.", right: "I agree with that."}
          - content_key: pl.b2.unit01.lesson01.exercise04.order_claim
            type: word_order
            tested_text: "Praca zdalna jest lepsza niż praca w biurze"
            prompt: {target_blocks: []}
            word_bank: [Praca, zdalna, jest, lepsza, niż, praca, w, biurze]
          - content_key: pl.b2.unit01.lesson01.exercise05.translate_moim_zdaniem
            type: translation
            tested_text: "Moim zdaniem praca zdalna jest lepsza"
            prompt: {target_blocks: [{text: "Translate into Polish, opening with Moim zdaniem: In my opinion, remote work is better.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson01.exercise06.speak_zgadzam_sie
            type: speak_response
            tested_text: "Zgadzam się z tym"
            prompt: {target_blocks: [{text: "Say aloud in Polish: I agree with that.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson01.exercise07.write_claim
            type: writing_prompt
            tested_text: "Uważam, że praca zdalna jest lepsza niż praca w biurze"
            prompt: {target_blocks: [{text: "Write in Polish, using Uważam, że: I think that remote work is better than office work.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson01.exercise08.dictation_claim
            type: dictation
            tested_text: "Praca zdalna jest lepsza niż praca w biurze."
            media_asset_key: pl.b2.audio.argumentacja.claim_praca_zdalna.01
            prompt: {target_blocks: []}

      - content_key: pl.b2.unit01.lesson02.argumenty_i_dowody
        title: "Argumenty i dowody"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
