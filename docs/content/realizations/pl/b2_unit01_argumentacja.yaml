          - content_key: pl.b2.unit01.lesson02.teach.grammar_argumenty
            kind: grammar_note
            target: {text: "Po pierwsze, oszczędzasz czas dojazdu. Poza tym w domu pracuje się wydajniej.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.b2.unit01.lesson02.exercise01.recognize_poniewaz
            type: multiple_choice
            tested_text: ponieważ
            prompt: {target_blocks: [{text: ponieważ, language_code: pl, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson02.exercise02.listen_po_pierwsze
            type: listen_select
            tested_text: "Po pierwsze, oszczędzasz czas dojazdu."
            media_asset_key: pl.b2.audio.argumentacja.po_pierwsze_dojazd.01
            prompt: {target_blocks: []}
          - content_key: pl.b2.unit01.lesson02.exercise03.match_argument_words
            type: matching_pairs
            tested_text: "ponieważ bo po pierwsze po drugie poza tym na przykład z badań wynika że czas dojazdu"
            prompt: {target_blocks: []}
            pairs:
              - {left: ponieważ, right: "because (neutral)"}
