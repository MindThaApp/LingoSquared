      - content_key: pl.b2.unit01.lesson05.czytanie_argumentu
        title: "Czytanie argumentu"
        spine_outcome_id: universal.b2.argumentation.defend_a_position_with_evidence
        teaching:
          - content_key: pl.b2.unit01.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                Coraz więcej osób pracuje zdalnie. Jestem przekonany, że to
                dobry kierunek. Po pierwsze, oszczędzasz czas dojazdu, a z
                badań wynika, że osoby pracujące z domu są zwykle bardziej
                wydajne. Oczywiście niektórzy mówią, że w domu brakuje im
                kontaktu z kolegami z pracy. To prawda, ale to nie zmienia
                faktu, że nadal można zadzwonić lub zrobić wideorozmowę.
                Podsumowując, zalety przeważają nad wadami.
              language_code: pl
              direction: ltr
            introduced_tokens: [coraz, więcej, osób, pracuje, zdalnie, jestem, przekonany, dobry, kierunek, a, osoby, pracujące, zwykle, bardziej, wydajne, mówią, brakuje, im, kontaktu, nadal, można, zadzwonić, lub, zrobić, wideorozmowę]
        exercises:
          - content_key: pl.b2.unit01.lesson05.exercise01.read_claim
            type: reading_comprehension
            tested_text: "dobry kierunek"
            prompt: {target_blocks: [{text: "What is the author's main claim about remote work?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit01.lesson05.exercise02.read_objection
            type: reading_comprehension
            tested_text: "brakuje im kontaktu z kolegami z pracy"
