            example: {text: "Oszczędzasz dużo czasu.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit01.lesson02.teach.duzo
            kind: vocabulary
            target: {text: "dużo", language_code: pl, direction: ltr}
            introduced_tokens: [dużo, czasu]
            example: {text: "Oszczędzasz dużo czasu.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit01.lesson02.teach.wydajniej
