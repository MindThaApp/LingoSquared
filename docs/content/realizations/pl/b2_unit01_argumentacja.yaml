target_language: "pl"
cefr_level: "B2"
status: "complete_draft"
generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's first
    B2 unit -- pl had zero B2 content before this wave. No adaptable
    upper-intermediate public-domain Polish course exists (pl's A1/A2 draw
    on the FSI Polish FAST beginner course, which has no upper volume;
    checked and confirmed, same "no intermediate/advanced volume exists"
    outcome pl's own first B1 unit already disclosed), so this was built
    from established modern Polish grammar/discourse knowledge. Structural
    exemplar: docs/content/realizations/nl/b2_unit01_argumentatie.yaml,
    consulted ONLY for unit shape (6-lesson arc, spine outcome id, exercise
    pacing, ~44 exercises/unit) -- every Polish sentence below is authored
    fresh from Polish grammar, not translated or calqued from the Dutch
    text. Character canon: grepped pl/b1_*.yaml before writing -- Marek is
    the established "inzynier" (engineer) from pl's A1 unit17, continued
    through b1_unit01/03/08/15/16; Ewa is his established friend from
    a1/a2's opinions unit, continued through b1_unit01. Both use the
    informal ty register pinned across pl's A1-B1 units. This unit
    continues that exact pair and register; no canon conflict (their
    occupations/relationship are not touched by an everyday debate about
    remote work).
review:
  status: "unreviewed"
  required_next_reviewer: >-
    Native-Polish confirmation needed. This is a DRAFT. Priority checks
    for the reviewer: (1) naturalness/idiom of every connective frame (z
    jednej strony / z drugiej strony, mimo to, to nie zmienia faktu, ze,
    podsumowujac) and that the informal ty register is consistent
    throughout; (2) case government on "z badan wynika, ze" (genitive
    "badan"), "przewazac nad" (instrumental "wadami"), "teskniec za"
    (instrumental "kolegami"), "brakuje im" (dative) -- confirm every case
    ending is correct; (3) whether "bo" vs "poniewaz" register split
    (informal/coordinating vs neutral/subordinating) reads naturally in
    context, and whether the comma before "bo"/"poniewaz"/"chociaz" is
    correctly placed everywhere (Polish requires it, unlike English); (4)
    the culminating writing exercise (lesson06 exercise06) is graded
    against a fixed multi-sentence string -- confirm the accepted-answer
    punctuation variants are complete enough that a correct learner is
    never marked wrong; (5) confirm "praca zdalna", "wydajniej", "czas
    dojazdu" and "cos w tym jest" read as current everyday Polish.
  notes: >-
    First Polish B2 unit. Targets the CEFR B2 argumentation outcome
    (universal.b2.argumentation.defend_a_position_with_evidence): state a
    claim, support it with reasons/evidence, acknowledge the strongest
    opposing point, and rebut it without conceding. Theme: praca zdalna a
    praca w biurze (remote work vs. office work) -- one coherent debatable
    everyday issue across all six lessons. Lesson arc mirrors the argument
    structure itself: L01 stating a claim (uwazam, ze / moim zdaniem), L02
    supporting it (po pierwsze / na przyklad / z badan wynika, ze), L03
    acknowledging the opposing point (z jednej strony ... z drugiej strony
    / chociaz / oczywiscie / to prawda), L04 rebutting without conceding
    (mimo to / jednak / natomiast / to nie zmienia faktu, ze / podsumowujac),
    L05 an argumentative reading text (distinguish the author's claim from
    the objection answered), L06 the culminating production -- a
    Marek/Ewa debate for the listening requirement plus a speaking task
    and a writing task that each require a FULL argument (claim + support
    + acknowledged objection + rebuttal), not just connective drilling.
    Register: informal ty throughout, per pl's established A1-B1 lane
    pin; Marek and Ewa continue their established informal register. All
    vocabulary is introduced self-contained within this file (B2 is a
    separate Course row from B1, so a B2 learner never sees B1 lexemes at
    runtime -- same self-containment precedent as pl's first B1 unit). No
    sibling-direction file (pl-en) was consulted.

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    Informal ty throughout (pl's established A1-B1 lane pin). B2
    argumentation layers discourse connectives and signposting onto that
    register -- po pierwsze, na przyklad, z jednej strony ... z drugiej
    strony, mimo to, chociaz, natomiast, podsumowujac -- while keeping the
    everyday informal address established for Marek and Ewa.

