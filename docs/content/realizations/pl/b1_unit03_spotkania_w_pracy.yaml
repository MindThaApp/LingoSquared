    Formal pan/pani workplace register throughout, a deliberate contrast
    with unit01/02's informal Ewa-Marek ty. Kierowniczka addresses Marek
    as "pan" (with third-person verb agreement); Marek addresses her as
    "pani." Same formal convention already established by this course's
    a2_unit21/a2_unit26 official-interaction units.

