review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    Third Polish B1 unit, continuing from pl/b1_unit02_dyskusja_z_
    niuansami.yaml. Realizes universal.b1.workplace.communicate_
    professionally_in_meetings (docs/content/universal_spine.yaml:
    "Communicate professionally in a workplace setting -- make a
    formal-register suggestion or request using a softened conditional
    form, participate in a short work-meeting exchange, and write a
    brief professional message," prerequisites
    [universal.a1.work.describe_job], satisfied by pl's existing
    a1_unit17_work.yaml, which already established Marek as an
    inżynier).

    Grammar step-up, deliberate and disclosed: Polish formal address
    (pan/pani) grammatically takes THIRD-person verb forms even when
    addressing someone directly ("Czy mógłby pan...?" -- literally
    "Could he...?", addressed straight at the listener) -- softened with
    the same by-conditional this course's own unit01 already taught, now
    applied to formal register rather than personal hypotheticals. Also:
    "Chciałbym zaproponować..." (I would like to propose...) as the
    standard meeting-suggestion opener, and the modal "powinniśmy" (we
    should, 1st person plural of powinien) for group recommendations.

    Scenario: Marek's workplace, continuing his established inżynier
    profession (unit17) and his established project-review context
    (a2_unit26's job interview, same character, later career stage). A
    new character, Kierowniczka (his female manager, role-title-as-name
    per this course's own a2_unit26/a2_unit21 convention), formally
    addresses him as "pan"; Marek formally addresses her as "pani" --
    genuine workplace pan/pani register throughout, unlike unit01/02's
    Ewa-Marek informal ty.

    Instrumental-case note threaded through per the standing instruction
    that Polish's case system should feature prominently at B1: "problem
    z jednym elementem" (a problem with one element, instrumental after
    "z"), continuing the same preposition-plus-case pattern already
    taught with "z ludźmi" in unit02.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage). No public-domain intermediate Polish
    course exists to adapt from. Authored from established modern Polish
    workplace-register conventions.

    Same-speaker-distractor check (lesson03's 6-line dialogue,
    Kierowniczka 3 lines / Marek 3 lines): every exercise built from
    this dialogue was checked by hand against every OTHER line either
    speaker says -- no distractor restates the fact under test using the
    same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the stated problem (one
    element needs retesting), the stated request (a new deadline), and
    the stated resolution (the deadline moves by one week) are each
    stated exactly once and never contradicted elsewhere in the file.

    Cross-file vocabulary note: this file recaps its own basic words
    (dzień, dobry, dziękuję, mam/mamy, jest, praca, projekt) via
    lesson01's recap card, per the compiler's per-FILE untaught-
    vocabulary check -- does not rely on unit01/02 or any other pl file
    having been compiled first. Pending fresh-context review per
    AUTHORING_GUIDE #9; not self-certified. FRESH-CONTEXT REVIEW COMPLETE 2026-07-11 per AUTHORING_GUIDE §20 (boolean type-walk, accepted_answers value-key shape, title length, spine-outcome existence, jargon/snake_case scan, register consistency, case agreement, bare-word MC and listening distractor ambiguity, character consistency vs the pl corpus) -- no learner-facing bugs found in this unit; status set to reviewed.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

course:
