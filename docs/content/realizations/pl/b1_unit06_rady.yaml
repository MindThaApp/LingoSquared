  notes: >-
    Sixth Polish B1 unit, continuing from pl/b1_unit05_mowa_zalezna.yaml.
    Realizes universal.b1.social.give_advice_and_make_suggestions
    (docs/content/universal_spine.yaml: "Give advice and make suggestions
    in response to someone's problem or plan -- using advice/suggestion
    constructions (an 'if I were you'/'you should'/'how about'-type
    range), and respond to advice by accepting, declining, or asking a
    follow-up," listed prerequisite universal.b1.services.make_complaint_
    and_resolve_problem -- per this dispatch's explicit unit-numbering
    instruction this unit is authored BEFORE the complaint unit
    (b1_unit07_reklamacja.yaml) despite the spine's prerequisite listing;
    this is a deliberate ordering choice made by the dispatch, not an
    oversight -- flagged here for the record).

    Grammar step-up, deliberate and disclosed: three advice constructions
    spanning the "if I were you / you should / how about" range named in
    the outcome's own can_do text -- "na twoim miejscu" + conditional
    (if I were you, I would...), "powinnaś/powinieneś" + infinitive (you
    should), and "a może" + 2nd person present (how about/what if you...).
    "Na twoim miejscu" reuses this course's own conditional -bym/-byś
    morphology from unit01 (Gdybym.../-bym), now applied to advice rather
    than hypothetical self-description. "Powinnaś" (feminine 'you should')
    is new; unit05 already taught "powinniśmy" (we should), so the
    singular addressee forms are a natural, disclosed extension of an
    established word family.

    Scenario: continues Ewa and Marek's established informal ty register.
    Ewa is stressed and not sleeping well because of a heavy week at
    work; Marek gives her advice across the lesson-03 dialogue, and Ewa
    responds by accepting one suggestion and asking a follow-up question
    about another, satisfying the outcome's "respond to advice by
    accepting, declining, or asking a follow-up" clause inside the
    dialogue itself (assessment_requirements route this as listening/
    reading comprehension, not a separate production skill -- verified
    against the outcome's own assessment_requirements list, which names
    only "give_advice" as the production requirement). Lesson04's
    culminating exercise requires the learner to WRITE original advice
    for a stated problem using a named construction ("na twoim miejscu"),
    the outcome's write_advice requirement delivered literally, not just
    drilled in pieces.

    Character canon check (spine outcome #7 checklist item, item 6):
    grepped pl/b1_unit01-05 before writing. Established facts respected:
    Marek is an inżynier (a1_unit17_work.yaml, reaffirmed b1_unit03);
    Ewa and Marek use informal ty throughout (all five prior B1 units);
    no new facts about either character's job/biography are asserted in
    this file -- only Ewa's transient stress this week, which does not
    contradict anything prior.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage). No public-domain intermediate Polish
    course exists to adapt from (same finding as units01-05). Authored
    from established modern Polish grammar/register conventions.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says -- no
    distractor restates the fact under test using the same speaker's
    other line.

    Cross-checked per AUTHORING_GUIDE.md #11: Ewa's stated problem
    (not sleeping well, heavy week at work), Marek's two pieces of advice
    (see a doctor / go to bed earlier), and Ewa's two responses (agrees
    to the doctor, asks a follow-up about the earlier bedtime) are each
    stated exactly once and never contradicted elsewhere in the file.

    Cross-file vocabulary note: this file recaps its own basic words
    (jest, mam, dobry, powinniśmy) via lesson01's recap card, per the
    compiler's per-FILE untaught-vocabulary check -- does not rely on any
    other pl file having been compiled first. Pending fresh-context
    review per AUTHORING_GUIDE #9; not self-certified.

