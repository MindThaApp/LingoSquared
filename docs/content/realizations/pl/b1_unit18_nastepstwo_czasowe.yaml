  notes: >-
    Eighteenth Polish B1 unit, continuing from pl/b1_unit17_planowanie_
    warunkowe.yaml. Realizes universal.b1.sequencing.describe_events_
    with_time_clauses (docs/content/universal_spine.yaml: "Describe when
    one event happens relative to another using a time-clause
    construction ('when X happens, Y happens/happened'), across everyday
    routines and past narratives, distinguishing a habitual/present time
    clause from a past one").

    Grammar step-up, deliberate and disclosed: "kiedy"/"gdy" (when) time
    clauses in two registers the outcome explicitly names: (1) habitual
    present -- both clauses imperfective present, describing a repeated
    routine ("Kiedy wracam z pracy, zawsze robię kolację" -- when I get
    home from work, I always make dinner); (2) a SINGLE past occasion --
    both clauses perfective past, one event immediately following
    another ("Kiedy wróciłem z pracy wczoraj, zadzwonił telefon" -- when
    I got home from work yesterday, the phone rang). "Kiedy" and "gdy"
    are taught as interchangeable synonyms in this construction (a
    grammar_note flags this explicitly), with "kiedy" used in the
    routine examples and "gdy" introduced in the past-narrative examples
    so the learner sees both.

    Scenario: continues the established Ewa/Marek informal ty-register
    storyline. A new everyday-routine thread (Marek's evening routine
    after work) and a one-off past occasion (a phone call interrupting
    his commute home yesterday) run through the unit -- deliberately
    distinct from unit16's weather/bike-trip and unit17's train/shopping
    premises.

    Case notes: "z pracy" (genitive after "z", "from work"); "kolację"
    (accusative, direct object of "robić"). Aspect notes, the outcome's
    own core distinction: "wracam"/"robię" are imperfective present
    (habitual, repeated); "wróciłem"/"zadzwonił" are perfective past
    (one bounded past event, sequential not simultaneous) -- the compiler-
    invisible contrast this unit exists to teach.

    Character canon check (item 6): grepped pl/b1_unit01-17 before
    writing. No fact about Ewa or Marek is contradicted. No new
    characters introduced.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says in the
    same dialogue -- no distractor restates the fact under test using the
    same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: Marek's evening routine
    (always making dinner after work) and yesterday's phone call
    interrupting his commute are each stated exactly once and never
    contradicted elsewhere in the file.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, same standing outage). No public-domain intermediate Polish
    course exists to adapt from. Authored from established modern Polish
    grammar conventions, double-checked against standard Polish reference
    grammar (aspect choice for habitual vs. single-occasion time clauses)
    before writing any example sentence.

    Cross-file vocabulary note: every word this file's exercises test,
    including basic recap words (dom, telefon, wieczorem), is redeclared
    via this file's own lesson01 recap card, per the compiler's per-FILE
    untaught-vocabulary check -- this file does not rely on any other pl
    file having been compiled first. Pending fresh-context review per
    AUTHORING_GUIDE #9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson04.exercise07 -- removed the English free-production prompt
    block ('about your own routine ... a single occasion') that
    contradicted the exact-string key (underdetermined-prompt); the
    overlay instruction now pins the sentences. Overlay-side fixes
    recorded in the en-pl overlay. NATIVE CHECK: 'Gdy wróciłem z pracy
    wczoraj' -- adverb placement ('Gdy wczoraj wróciłem z pracy' may be
    the more neutral order; the overlay accepts both in free-text
    items).

