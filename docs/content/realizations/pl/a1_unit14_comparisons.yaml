  notes: >-
    Fourteenth Polish unit, continuing directly from pl/a1_unit13_preferences.yaml
    (same Ewa/Marek pair, same 3-lesson bootstrap pace as units01-13). Realizes
    universal.a1.comparisons.make_basic_comparisons -- confirmed directly against
    docs/content/universal_spine.yaml: grepped "^  - id: universal.a1" across
    the whole file to get the full A1 outcome list in linear order, confirmed
    universal.a1.preferences.express_preferences (unit13's own outcome, line
    416) is immediately followed by universal.a1.comparisons.make_basic_comparisons
    (line 439), then read that block directly (lines 439-463: can_do "Make and
    understand basic comparisons between familiar people, objects, or options,"
    prerequisites: [universal.a1.preferences.express_preferences,
    universal.a1.numbers.use_basic_numbers], modalities [listening, speaking,
    reading, writing], assessment_requirements: understand_comparison
    (listening: identify which of two familiar options has a stated property),
    make_comparison (speaking: compare two familiar items using a basic
    property), read_comparison (reading: interpret a short comparison),
    write_comparison (writing: write a basic comparison between two familiar
    items). Both prerequisites are already satisfied: preferences by unit13
    itself, numbers by pl/a1_unit02_numbers.yaml (grepped
    universal.a1.numbers.use_basic_numbers directly -- prerequisites: [],
    confirming it has no further chain to check). Did NOT open nl/a1_unit14*.yaml
    or any other language's unit14 at all, per the strong sibling-isolation
    instruction (broader than AUTHORING_GUIDE §8's same-direction rule, applied
    here to any other language's file for this same unit number) -- topic/
    outcome match was confirmed purely from the spine file itself, no
    cross-language read needed.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version 1.1):
    every kind:vocabulary card carries a real example sentence, including
    merged multi-word cards (one example per gender member, per §19's own
    guidance for merged cards). Zero listen_type/listen_select/listen_order
    exercises anywhere in this file, matching unit01-13's own established
    choice for this course -- media_assets is an empty list, not an oversight.

    Source-access research (done first, per standing instruction): searched
    the already-cached FSI Polish FAST text (.firecrawl/fsi-polish-fast.txt,
    same cached copy as units02-13) fresh for this unit's own topic
    (comparisons) rather than reusing a stale prior search. Found a genuinely
    strong, direct source hit: a full "Adjectives - Comparative and
    Superlative" grammar section (cached .txt lines ~13058-13109) that
    explains exactly the grammar this unit needs -- confirmed source, not
    freely authored. It gives: (1) the regular pattern, -y/i replaced by -szy,
    with worked examples młody -> młodszy -> najmłodszy and stary -> starszy
    -> najstarszy (cached .txt lines ~13075-13076); (2) an explicit irregular
    list including dobry -> lepszy -> najlepszy and zły -> gorszy -> najgorszy
    (cached .txt lines ~13098-13100, directly under the heading "Remember that
    duży, mały, dobry, zły here are irregular comparatives"); (3) real
    attested "niż" (than) usage in genuine dialogue/drill sentences preserving
    plain nominative case on the compared item, not genitive -- "On ma mniej
    pracy niż ja" (line ~6693), "Ona ma więcej pracy niż ja" (line ~6694),
    "Pan Kowalski pracuje dużo więcej niż pan Zieliński" (line ~6668, a name
    in nominative after niż, not genitive), "Mniej turystów, a pogoda jeszcze
    bardzo dobra, często lepsza niż w lecie" (line ~11979, "lepsza niż"
    directly attested). The source ALSO shows an "od + genitive" alternative
    for comparison ("Kraków podoba mi się dużo bardziej od Warszawy," line
    ~6656; "Barbara jest bardziej elegancka od Katarzyny," line ~6658) --
    deliberately NOT used anywhere in this file, see the grammar-scope
    decision below for why. "zły" itself (not just its comparative) is also
    directly attested as a real predicate adjective in genuine dialogue: "Te
    banany bardzo ładne, ale drogie" uses a different adjective, but "w
    fatalnym [stanie]" and other predicate-adjective constructions confirm
    the jest + adjective pattern generally; "zły" specifically as a bare
    predicate adjective was authored by regular analogy from the confirmed
    zły -> gorszy -> najgorszy paradigm entry itself, not a separate
    attested sentence -- disclosed honestly as inferred-from-paradigm rather
    than independently sentence-attested. "dobry" is not freshly sourced
    here at all -- it was already confirmed and taught in
    pl/a1_unit01_greetings.yaml (dzień dobry) and is reused, not re-sourced.

    Grammar-scope decision, disclosed up front per unit07-13's own precedent
    for narrowing A1 grammar exposure deliberately rather than by omission.
    Polish comparison, in full, involves at least three real complications
    this file deliberately does NOT take on: (1) the "od + genitive"
    alternative to "niż" (confirmed in the source itself, see above) --
    genitive case has not been introduced anywhere in this course yet except
    the narrow post-"kilo" plural genitive from unit07 (bananów, pomidorów),
    and "od + genitive" would require genitive on PERSONAL NAMES and PRONOUNS
    (Warszawy, Katarzyny), a materially different and harder pattern than the
    plural-noun-after-quantity case already taught. This file uses "niż" +
    plain nominative EXCLUSIVELY, which the source itself confirms is equally
    natural and correct, not a simplification of meaning, only of the
    grammar needed to produce it. (2) Superlative forms (najstarszy,
    najlepszy, etc.) are not introduced or tested anywhere -- the spine's own
    outcome asks only for "basic comparisons between... people, objects, or
    options" (a two-way relation), not a three-way superlative judgment, so
    this is a genuine scope match, not an arbitrary cut. (3) Every
    comparative adjective in this file is used PREDICATIVELY ONLY (X jest
    [comparative] niż Y) -- never attributively inside a noun phrase (e.g.
    "starszy brat," "the older brother"), which would require the
    comparative adjective to agree in case with whatever role that noun
    phrase plays in its sentence, not just gender. Predicate position after
    jest only ever needs nominative-case agreement, so this file introduces
    ONLY masculine and feminine singular predicate-adjective forms (starszy/
    starsza, młodszy/młodsza, lepszy/lepsza, gorszy/gorsza) -- no neuter, no
    plural, no attributive/case-declined forms anywhere. This gender
    agreement itself is a deliberate, disclosed CONTINUATION of an
    already-introduced pattern, not a new grammatical category: unit12
    already taught that Polish marks grammatical gender on the sentence's
    own predicate (byłem/byłam), and unit05 already taught it on possessives
    (mój/moja) -- this file extends the same underlying "Polish agrees with
    the subject's gender" concept to predicate adjectives specifically,
    called out explicitly in lesson01.teach.gender_agreement_note so it
    reads as continuity. The regular -szy suffix pattern (stary -> starszy,
    młody -> młodszy) and the two irregular pairs actually used (dobry ->
    lepszy, zły -> gorszy) are both real source-confirmed paradigms; the
    other irregular pairs the source also gives (duży -> większy, mały ->
    mniejszy) and the bardziej/najbardziej pattern for foreign/long
    adjectives are both real and confirmed but NOT used in this file at all
    -- flagging honestly as available, source-confirmed material for a
    future comparisons unit or a later pass on this one, not silently
    dropped.

    Same-speaker-distractor check (AUTHORING_GUIDE, standing bug-class
    warning): this file has one TEXT dialogue (lesson03, no audio, so the
    literal "same audio clip" bug class doesn't directly apply the same way
    it would for a recorded dialogue -- explicitly checked and confirmed,
    same reasoning unit09-13 already used for their own audio-less
    dialogues), but the analogous risk for multiple_choice line-selection
    and dialogue_comprehension exercises was checked by hand, listing every
    line each speaker actually says first:
    Marek's two lines: "Kawa jest lepsza niż herbata!" / "Dobrze, dobrze.
    Ale ja jestem młodszy niż ty!"
    Ewa's two lines: "Nie, nie! Herbata jest lepsza niż kawa!" / "Tak, jestem
    starsza. Ale herbata jest lepsza!"
    lesson03.exercise01 asks which line says coffee is better (correct:
    Marek's "Kawa jest lepsza niż herbata!"); distractors are Ewa's "Nie,
    nie! Herbata jest lepsza niż kawa!" (says TEA is better, not coffee) and
    Marek's own "Dobrze, dobrze. Ale ja jestem młodszy niż ty!" (doesn't
    mention drinks at all) -- neither distractor also states that coffee is
    better, so there is no overlap with the specific fact being tested, and
    this specifically confirms Marek's OWN second line doesn't accidentally
    restate the same claim being tested by his first line.
    lesson03.exercise02 asks which line says Marek is younger than Ewa
    (correct: Marek's "Dobrze, dobrze. Ale ja jestem młodszy niż ty!");
    distractors are Marek's own "Kawa jest lepsza niż herbata!" (no age
    mentioned) and Ewa's "Tak, jestem starsza. Ale herbata jest lepsza!" --
    Ewa's line states the converse fact (herself older) but never names
    Marek as younger explicitly, so it does not literally satisfy "which
    line SAYS Marek is younger" the way the correct line does.
    lesson03.exercise03 (dialogue_comprehension) shows ONLY Ewa's own line
    "Tak, jestem starsza. Ale herbata jest lepsza!" as the read passage and
    asks who Ewa says is older (correct: Ewa/herself) -- Marek's age claim
    never appears in this quoted passage, so the question is unambiguous
    even though it's mentioned elsewhere in the full dialogue.
    lesson03.exercise04 (dialogue_comprehension) shows ONLY Marek's own line
    "Dobrze, dobrze. Ale ja jestem młodszy niż ty!" as the read passage and
    asks who Marek says is younger (correct: Marek/himself) -- same
    reasoning, Ewa's own claim never appears in this quoted passage. No
    exercise in this file makes two answer options simultaneously true for
    the specific fact being asked about.

    Cross-checked against this file's own content per AUTHORING_GUIDE §11:
    the facts this unit states are (a) Ewa is older than Marek / Marek is
    younger than Ewa -- a single fact stated four different ways
    (lesson01's two attributed phrase cards, and lesson03's two dialogue
    self-declarations), never contradicted; (b) Marek's opinion that coffee
    is better than tea, and Ewa's opinion that tea is better than coffee --
    framed throughout as personal, first-person opinions inside lesson03's
    dialogue (never asserted as bare unattributed "facts" on a teaching
    card), so the two opposite claims don't read as a factual contradiction,
    only as two characters disagreeing, which is itself the pedagogically
    intended point of a comparisons unit. This is also a DELIBERATE
    continuity choice, not a coincidence: (a) is a brand-new fact this file
    establishes (no earlier unit stated Ewa's and Marek's relative ages
    directly), but it is fully consistent with pl/a1_unit02_numbers.yaml's
    own already-shipped content -- that file's lesson03 exercises
    (exercise04/07: "Marek ma ___ lat" = dwadzieścia osiem, 28; exercise10:
    "Napisz, ile lat ma Ewa" = trzydzieści dwa lata, 32) already establish
    Marek as 28 and Ewa as 32, so "Ewa jest starsza niż Marek" is the ONLY
    age-comparison direction consistent with unit02's own numbers -- this
    was checked directly against unit02's file before writing a single
    sentence, not assumed or guessed; and (b) is fully consistent with
    pl/a1_unit13_preferences.yaml's own already-shipped dialogue (Ewa
    prefers tea / wolę herbatę, Marek prefers coffee / wolę kawę), so
    attributing "kawa lepsza" to Marek and "herbata lepsza" to Ewa here
    extends rather than contradicts unit13's established facts.

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from earlier units (jest from unit01/02/04,
    kawa/herbata from unit06/13, Tak/Nie from unit01/03/04/10/11, Dobrze
