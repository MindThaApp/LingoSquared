  - {content_key: "pl.a1.audio.dialogue.unit14_lesson03_exercise04.01", language: "pl", text: "Dobrze, dobrze. Ale ja jestem młodszy niż ty!", voice_hint: "neutral_adult", status: "pending_generation"}

units:
  - content_key: pl.a1.unit14.porownania
    title: "Porównania"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.comparisons.make_basic_comparisons
    planned_lesson_count: 3

    lessons:
      - content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
        title: "Starszy i młodszy"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - content_key: pl.a1.unit14.lesson01.teach.mlody
            kind: vocabulary
            target: {text: "młody", language_code: pl, direction: ltr}
            introduced_tokens: ["młody", "jest"]
            example:
              {text: "Marek jest młody.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson01.teach.stary
            kind: vocabulary
            target: {text: "stary", language_code: pl, direction: ltr}
            introduced_tokens: ["stary"]
            example:
              {text: "Dziadek jest stary.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson01.teach.comparative_formation_note
            kind: grammar_note
            target: {text: "W krótkich przymiotnikach, takich jak stary i młody, zmieniasz końcówkę -y na -szy: stary -> starszy, młody -> młodszy. Nie każdy przymiotnik tak działa.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit14.lesson01.teach.starszy_starsza
            kind: vocabulary
            target: {text: "starszy, starsza", language_code: pl, direction: ltr}
            introduced_tokens: ["starszy", "starsza"]
            example:
              - {text: "Dziadek jest starszy niż ojciec.", language_code: pl, direction: ltr}
              - {text: "Babcia jest starsza niż matka.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson01.teach.mlodszy_mlodsza
            kind: vocabulary
            target: {text: "młodszy, młodsza", language_code: pl, direction: ltr}
            introduced_tokens: ["młodszy", "młodsza"]
            example:
              - {text: "Ojciec jest młodszy niż dziadek.", language_code: pl, direction: ltr}
              - {text: "Matka jest młodsza niż babcia.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson01.teach.niz
            kind: vocabulary
            target: {text: "niż", language_code: pl, direction: ltr}
            introduced_tokens: ["niż"]
            example:
              {text: "Syn jest młodszy niż ojciec.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson01.teach.gender_agreement_note
            kind: grammar_note
            target: {text: "Starszy/starsza i młodszy/młodsza zmieniają się razem z rodzajem, tak jak byłem/byłam. Starszy, młodszy dla mężczyzny (on); starsza, młodsza dla kobiety (ona).", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit14.lesson01.teach.ewa_starsza
            kind: phrase
            target: {text: "Ewa jest starsza niż Marek.", language_code: pl, direction: ltr}
            introduced_tokens: ["Ewa"]
          - content_key: pl.a1.unit14.lesson01.teach.marek_mlodszy
            kind: phrase
            target: {text: "Marek jest młodszy niż Ewa.", language_code: pl, direction: ltr}
            introduced_tokens: ["Marek"]
        exercises:
          - content_key: pl.a1.unit14.lesson01.exercise01.select_starszy
            type: multiple_choice
            tested_text: "starszy"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit14.lesson01.exercise02.select_mlodszy
            type: multiple_choice
            tested_text: "młodszy"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit14.lesson01.exercise03.select_niz
            type: multiple_choice
            tested_text: "niż"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit14.lesson01.exercise04.match_lesson1_vocabulary
            type: matching_pairs
            tested_text: "stary młody starszy starsza młodszy młodsza niż"
            prompt: {target_blocks: []}
            pairs:
              - {left: "stary", right: "old"}
              - {left: "młody", right: "young"}
              - {left: "starszy", right: "older (for a man)"}
              - {left: "starsza", right: "older (for a woman)"}
              - {left: "młodszy", right: "younger (for a man)"}
              - {left: "młodsza", right: "younger (for a woman)"}
              - {left: "niż", right: "than"}
          - content_key: pl.a1.unit14.lesson01.exercise05.order_ewa_starsza
            type: word_order
            tested_text: "Ewa jest starsza niż Marek"
            prompt: {target_blocks: []}
            word_bank: ["niż", "Ewa", "starsza", "jest", "Marek"]
          - content_key: pl.a1.unit14.lesson01.exercise06.order_marek_mlodszy
            type: word_order
            tested_text: "Marek jest młodszy niż Ewa"
            prompt: {target_blocks: []}
            word_bank: ["niż", "Marek", "młodszy", "jest", "Ewa"]
          - content_key: pl.a1.unit14.lesson01.exercise07.fill_ewa_starsza
            type: fill_in_blank
            tested_text: "starsza"
            prompt:
              target_blocks:
                - {text: "Ewa jest ___ niż Marek.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson01.exercise08.fix_ewa_gender
            type: grammar_check
            tested_text: "Ewa jest starsza niż Marek"
            prompt:
              target_blocks:
                - {text: "Ewa jest starszy niż Marek.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson01.exercise09.speak_marek_mlodszy
            type: speak_response
            tested_text: "Marek jest młodszy niż Ewa"
            prompt: {target_blocks: []}

      - content_key: pl.a1.unit14.lesson02.lepszy_i_gorszy
        title: "Lepszy i gorszy"
        spine_outcome_id: universal.a1.comparisons.make_basic_comparisons
        teaching:
          - content_key: pl.a1.unit14.lesson02.teach.dobry_recap
            kind: grammar_note
            target: {text: "Dobry już znasz z Dzień dobry -- to ten sam przymiotnik (good).", language_code: pl, direction: ltr}
            introduced_tokens: ["dobry"]
          - content_key: pl.a1.unit14.lesson02.teach.zly
            kind: vocabulary
            target: {text: "zły", language_code: pl, direction: ltr}
            introduced_tokens: ["zły"]
            example:
              {text: "To jest zły dzień.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson02.teach.irregular_comparative_note
            kind: grammar_note
            target: {text: "Dobry i zły są nieregularne: dobry -> lepszy, zły -> gorszy -- nie dodajesz -szy.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit14.lesson02.teach.lepszy_lepsza
            kind: vocabulary
            target: {text: "lepszy, lepsza", language_code: pl, direction: ltr}
            introduced_tokens: ["lepszy", "lepsza", "kawa", "herbata"]
            example:
              - {text: "On jest lepszy niż ja.", language_code: pl, direction: ltr}
              - {text: "Kawa jest lepsza niż herbata.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson02.teach.gorszy_gorsza
            kind: vocabulary
            target: {text: "gorszy, gorsza", language_code: pl, direction: ltr}
            introduced_tokens: ["gorszy", "gorsza"]
            example:
              - {text: "On jest gorszy niż ja.", language_code: pl, direction: ltr}
              - {text: "Herbata jest gorsza niż kawa.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit14.lesson02.teach.kawa_herbata_recap
            kind: grammar_note
            target: {text: "Kawa i herbata -- już znasz te słowa z wcześniejszej lekcji o piciu.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit14.lesson02.teach.gender_note_recap
            kind: grammar_note
            target: {text: "Lepszy/lepsza i gorszy/gorsza zmieniają się z rodzajem tak samo jak starszy/starsza z poprzedniej lekcji.", language_code: pl, direction: ltr}
            introduced_tokens: []
        exercises:
          - content_key: pl.a1.unit14.lesson02.exercise01.select_zly
            type: multiple_choice
            tested_text: "zły"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit14.lesson02.exercise02.select_lepsza
            type: multiple_choice
            tested_text: "lepsza"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit14.lesson02.exercise03.select_gorszy
            type: multiple_choice
            tested_text: "gorszy"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit14.lesson02.exercise04.match_lesson2_vocabulary
            type: matching_pairs
            tested_text: "dobry zły lepszy lepsza gorszy gorsza kawa herbata"
            prompt: {target_blocks: []}
            pairs:
