  notes: >-
    Fourth Polish B1 unit, continuing from pl/b1_unit03_spotkania_w_
    pracy.yaml. Realizes universal.b1.narrative.combine_descriptions_
    with_relative_clauses (docs/content/universal_spine.yaml: "Combine
    two facts about a person, place, or thing into a single, richer
    sentence using a relative clause (a 'who'/'that'/'where'-type
    construction), including cases where the relative pronoun must agree
    in gender/number or must combine with a preposition," prerequisites
    [universal.b1.opinions.debate_with_concession_and_nuance], satisfied
    by this course's own unit02).

    Grammar step-up, deliberate and disclosed: this is the single
    richest possible showcase of Polish's case system at B1, per the
    standing instruction that case should feature prominently. The
    relative pronoun *który/która/które* agrees in GENDER and NUMBER
    with its antecedent (the noun it describes), but its CASE is
    governed entirely by its own grammatical role inside the relative
    clause -- these are two independent axes, and conflating them is the
    single most common error English-speaking learners make with this
    construction. This unit deliberately sequences five distinct case
    roles across its four lessons, each with a real, concrete example:
    nominative (subject of the relative clause: "mężczyzna, który
    pracuje..."), accusative (direct object: "książka, którą czytam"),
    genitive (object of a negated verb -- "kolega, którego nie znam,"
    reusing the same negation-triggers-genitive rule this course's own
    grammar-check exercises have implicitly used since A2), dative
    (object of a dative-governing verb -- "przyjaciółka, której
    pomagam," since *pomagać* takes dative, not accusative), and
    instrumental/locative after a preposition ("lekarz, z którym
    rozmawiam" / "dom, w którym mieszkam" -- the same Instr=Loc
    syncretism for masculine/neuter singular already surfaced in this
    course's unit01 "innym mieście").

    Scenario: continues Ewa and Marek's established informal ty
    register. Both describe real people and places from their
    established lives -- a neighbor, a colleague, a friend, a doctor, a
    home -- using two facts combined into one sentence via a relative
    clause, exactly the spine outcome's own can_do text.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage). No public-domain intermediate Polish
    course exists to adapt from. Authored from established modern
    Polish case-declension conventions -- every który form in this file
    was hand-verified against the standard który/która/które adjectival
    declension paradigm (nominative/accusative/genitive/dative/
    instrumental/locative, masculine/feminine/neuter, singular).

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says -- no
    distractor restates the fact under test using the same speaker's
    other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the neighbor's workplace
    (bank), the colleague's name-gap (Marek doesn't know him), the
    friend Marek helps, the doctor Ewa talks to, and the house Ewa lives
    in are each stated exactly once and never contradicted elsewhere in
    the file.

    Cross-file vocabulary note: this file recaps its own basic words
    (mam, jest, dom, mieszkam) via lesson01's recap card, per the
    compiler's per-FILE untaught-vocabulary check -- does not rely on
    any other pl file having been compiled first. Pending fresh-context
    review per AUTHORING_GUIDE #9; not self-certified. FRESH-CONTEXT REVIEW COMPLETE 2026-07-11 per AUTHORING_GUIDE §20 (boolean type-walk, accepted_answers value-key shape, title length, spine-outcome existence, jargon/snake_case scan, register consistency, case agreement, bare-word MC and listening distractor ambiguity, character consistency vs the pl corpus) -- no learner-facing bugs found in this unit; status set to reviewed.

