      - content_key: pl.b2.unit07.lesson06.negocjacje_w_rozmowie
        title: "Negocjacje w rozmowie"
        spine_outcome_id: universal.b2.negotiation.negotiate_and_resolve_disagreement
        teaching:
          - content_key: pl.b2.unit07.lesson06.teach.dobry_pomysl
            kind: phrase
