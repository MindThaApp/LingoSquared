      - content_key: pl.b2.unit07.lesson05.co_zostalo_ustalone
        title: "Co zostało ustalone?"
        spine_outcome_id: universal.b2.negotiation.negotiate_and_resolve_disagreement
        teaching:
          - content_key: pl.b2.unit07.lesson05.teach.tekst
            kind: reading
            target:
              text: >-
                Ewa: Proponuję, że ja zrobię zakupy. Możemy ugotować
                razem? Marek: Zakupy zrobię ja, bo muszę i tak wyjść. Ale
                zgadzam się, pod warunkiem że ty zmyjesz naczynia. Ewa:
                Umowa stoi. A rachunek? Marek: Dzielimy po połowie. O
                deser porozmawiamy jutro.
              language_code: pl
              direction: ltr
            introduced_tokens: [Możemy, bo, i, tak, wyjść, po, deser, porozmawiamy, jutro]
        exercises:
          - content_key: pl.b2.unit07.lesson05.exercise01.read_agreed
            type: reading_comprehension
            tested_text: "Dzielimy po połowie"
            prompt:
              target_blocks:
                - {text: "Ewa: Proponuję, że ja zrobię zakupy. Możemy ugotować razem? Marek: Zakupy zrobię ja, bo muszę i tak wyjść. Ale zgadzam się, pod warunkiem że ty zmyjesz naczynia. Ewa: Umowa stoi. A rachunek? Marek: Dzielimy po połowie. O deser porozmawiamy jutro.", language_code: pl, direction: ltr}
                - {text: "What have Marek and Ewa definitely AGREED on regarding the bill?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit07.lesson05.exercise02.read_open
            type: reading_comprehension
            tested_text: "O deser porozmawiamy jutro"
            prompt:
              target_blocks:
                - {text: "Ewa: Proponuję, że ja zrobię zakupy. Możemy ugotować razem? Marek: Zakupy zrobię ja, bo muszę i tak wyjść. Ale zgadzam się, pod warunkiem że ty zmyjesz naczynia. Ewa: Umowa stoi. A rachunek? Marek: Dzielimy po połowie. O deser porozmawiamy jutro.", language_code: pl, direction: ltr}
                - {text: "Which point is still OPEN, not yet settled?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit07.lesson05.exercise03.read_condition
            type: reading_comprehension
            tested_text: "pod warunkiem że ty zmyjesz naczynia"
            prompt:
              target_blocks:
                - {text: "Ewa: Proponuję, że ja zrobię zakupy. Możemy ugotować razem? Marek: Zakupy zrobię ja, bo muszę i tak wyjść. Ale zgadzam się, pod warunkiem że ty zmyjesz naczynia. Ewa: Umowa stoi. A rachunek? Marek: Dzielimy po połowie. O deser porozmawiamy jutro.", language_code: pl, direction: ltr}
                - {text: "On what CONDITION does Marek agree to the plan?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit07.lesson05.exercise04.read_who_shops
            type: reading_comprehension
            tested_text: "Zakupy zrobię ja"
            prompt:
              target_blocks:
                - {text: "Ewa: Proponuję, że ja zrobię zakupy. Możemy ugotować razem? Marek: Zakupy zrobię ja, bo muszę i tak wyjść. Ale zgadzam się, pod warunkiem że ty zmyjesz naczynia. Ewa: Umowa stoi. A rachunek? Marek: Dzielimy po połowie. O deser porozmawiamy jutro.", language_code: pl, direction: ltr}
                - {text: "Who ends up doing the shopping, and why?", language_code: en, direction: ltr}
          - content_key: pl.b2.unit07.lesson05.exercise05.match_reading
            type: matching_pairs
            tested_text: "wyjść po połowie deser porozmawiamy jutro Możemy"
            prompt: {target_blocks: []}
            pairs:
