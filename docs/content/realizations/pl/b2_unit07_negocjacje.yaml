            kind: dialogue
            target: {text: "Dobry pomysł. Proponuję, że ja ugotuję.", language_code: pl, direction: ltr, speaker: Ewa}
            introduced_tokens: []
          - content_key: pl.b2.unit07.lesson06.teach.dialogue_marek_ask
