generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's
    seventh B2 unit (negotiation). No adaptable upper-intermediate
    public-domain Polish source exists; built from established modern
    Polish grammar/discourse knowledge. Structural exemplar:
    docs/content/realizations/nl/b2_unit07_onderhandelen.yaml, consulted
    ONLY for unit shape -- every Polish sentence below is authored fresh
    from Polish grammar. Character canon: grepped pl/b1_*.yaml and
    pl/b2_unit01-06.yaml before writing -- Marek and Ewa continue their
    established informal ty register; here they host a dinner (kolacja)
    together and negotiate who cooks, who shops, who does the dishes, and
    how to split the bill, which introduces no canon conflict (no shared
    living arrangement is claimed -- they are simply co-hosting one
    evening).
    GENDER-AGREEMENT AUDIT: this unit's negotiation vocabulary was
    deliberately built almost entirely from PRESENT and FUTURE/perfective
    tense (proponuję, mogę, muszę, zrobię, ugotuję, zgadzam się,
    dzielimy), which never mark grammatical gender in Polish. The ONE
    genuinely gender-marked frame is "wolałbym / wolałabym nie" (I'd
    rather not, conditional), taught as an explicit paired card
    (lesson02) with BOTH forms given wherever it appears in free
    production (lesson02 exercise06, instruction names the gender choice
    explicitly AND accepted_answers lists both forms). No other exercise
    in this unit needed a dual-gender split.
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Seventh Polish B2 unit; first negotiation unit. Targets the CEFR B2
    negotiation outcome
    (universal.b2.negotiation.negotiate_and_resolve_disagreement):
    negotiate and resolve a disagreement -- state terms, decline a term,
    offer a CONDITIONAL concession, reach agreement. Theme: one coherent
    everyday disagreement across all six lessons -- Marek and Ewa are
    hosting a dinner together and must divide the work (cooking, grocery
    shopping, the dishes) and split the bill. Lesson arc: L01 making a
    proposal / stating terms (proponuję, że / a może / mój pomysł to);
    L02 declining politely (niestety nie mogę / to się nie uda / nie mogę
    się na to zgodzić / wolałbym/wolałabym nie); L03 the core act, a
    conditional concession (jeśli...to... / ale tylko jeśli / pod
    warunkiem że / o ile / chyba że / zgadzam się, ale tylko jeśli); L04
    reaching agreement (umowa stoi / zgoda / całkowicie się zgadzam) plus
    splitting the bill; L05 a written EXCHANGE of terms for the reading
    requirement (identify what was agreed and what remains open); L06 the
    culminating production -- a Marek/Ewa dialogue for the listening
    requirement (identify what each side proposes, refuses, and the
    conditional concession offered), a speaking task that requires the
    WHOLE negotiation move (state terms + decline one + conditional
    concession), and a writing task that proposes revised terms while
    attaching a condition to a concession. Register: informal ty
    throughout, per pl's established lane pin. All vocabulary is
    introduced self-contained within this file, cumulative with units
    01-06 which precede it in the course. No sibling-direction file
    (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    Realization: lesson05 exercise01-04 (reading_comprehension) -- prompt
    never showed the dialogue text -> added it as a pl target_block before
    the question (comprehension-without-text); lesson03 exercise03
    match_conditions -- lefts 'pod warunkiem że' (on condition that) and
    'o ile' (provided that) had interchangeable glosses -> replaced the o
    ile pair with ugotujesz: you'll cook (taught in the same lesson),
    tested_text updated (duplicate/ambiguous). Overlay: matching key
    mirrored; lesson03 exercise02 listen distractor 'I can't cook unless
    you do the dishes.' is logically equivalent to the correct 'I can
    cook, but only if you do the dishes.' -> 'I can't cook today.'
    (second-correct-distractor); missing accepted answers added: lesson01
    exercise05 + A może razem to zrobimy; exercise07 + Dziś/Dzisiaj robimy
    razem kolację, Robimy dzisiaj razem kolację; lesson02 exercise07 + Nie
    mogę wszystkiego zrobić; lesson03 exercise05/07 and lesson06
    exercise06 + ty-dropped variants (że ugotujesz / jeśli zmyjesz -- the
    grader's pronoun-drop rule only covers a clause-initial pronoun);
    exercise06/07 + 'zmyjesz naczynia' variants (prompt says 'do the
    dishes'), exercise06 + perfective Mogę ugotować; lesson04 exercise07 +
    Dzielimy się rachunkiem / Podzielmy rachunek; lesson06 exercise05 +
    fully pronoun-dropped variant. NATIVE CHECK: 'Proponuję, że ja
    ugotuję' (proponować + że + future) -- colloquially common, but
    confirm it is acceptable vs 'Proponuję, że(by)m ja ugotował(a)'.

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    Informal ty throughout (pl's established lane pin). B2 negotiation
    layers proposing, declining and conditional-concession frames onto
    that register -- proponuję, że, a może, niestety nie mogę, jeśli...
    to..., pod warunkiem że, o ile, chyba że, zgadzam się, umowa stoi --
    while keeping everyday informal address established for Marek and
    Ewa.

