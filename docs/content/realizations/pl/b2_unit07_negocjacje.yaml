          - content_key: pl.b2.unit07.lesson06.teach.grammar_pelny_ruch
            kind: grammar_note
            target: {text: "Proponuję, że ja ugotuję. Niestety nie mogę zrobić zakupów, ale zgadzam się, pod warunkiem że ty zmyjesz naczynia.", language_code: pl, direction: ltr}
            introduced_tokens: [zakupów]
        exercises:
