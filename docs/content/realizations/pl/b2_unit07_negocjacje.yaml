            type: translation
            tested_text: "Muszę wyjść"
            prompt: {target_blocks: [{text: "Translate into Polish: I have to leave.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit07.lesson05.exercise07.write_jutro
            type: writing_prompt
            tested_text: "Porozmawiamy jutro"
