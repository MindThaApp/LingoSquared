            media_asset_key: pl.b2.audio.negocjacje.dialogue.kolacja.01
            prompt: {target_blocks: [{text: "What does Ewa PROPOSE?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit07.lesson06.exercise02.comprehend_refusal
            type: dialogue_comprehension
            tested_text: "Niestety nie mogę"
            media_asset_key: pl.b2.audio.negocjacje.dialogue.kolacja.01
            prompt: {target_blocks: [{text: "What does Ewa REFUSE to do?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit07.lesson06.exercise03.comprehend_condition
            type: dialogue_comprehension
            tested_text: "pod warunkiem że ty zmyjesz naczynia"
            media_asset_key: pl.b2.audio.negocjacje.dialogue.kolacja.01
            prompt: {target_blocks: [{text: "What CONDITIONAL concession does Ewa offer in return?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit07.lesson06.exercise04.order_umowa_stoi
            type: word_order
            tested_text: "Umowa stoi"
            prompt: {target_blocks: []}
            word_bank: [Umowa, stoi]
          - content_key: pl.b2.unit07.lesson06.exercise05.speak_full_move
            type: speak_response
            tested_text: "Proponuję, że ja ugotuję. Niestety nie mogę zrobić zakupów, ale zgadzam się, pod warunkiem że ty zmyjesz naczynia."
            prompt: {target_blocks: [{text: "You and Ewa are hosting a dinner. Negotiate your whole part aloud in THREE moves: STATE your terms (proponuję, że ja ugotuję), DECLINE one task (the shopping, with niestety nie mogę), and OFFER A CONDITIONAL CONCESSION (pod warunkiem że). Say: I propose that I cook. Unfortunately I can't do the shopping, but I agree on condition that you do the dishes.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit07.lesson06.exercise06.write_revised_terms
            type: writing_prompt
            tested_text: "Zrobię zakupy, o ile ty ugotujesz"
            prompt: {target_blocks: [{text: "Write a reply proposing DIFFERENT terms with a condition attached. Offer to do the shopping yourself (zrobię zakupy) and attach a condition with o ile: I'll do the shopping, provided that you cook.", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit07.lesson06.exercise07.respond_negotiate
            type: dialogue_response
            tested_text: "Ugotuję, pod warunkiem że ty zmyjesz naczynia"
            prompt: {target_blocks: [{text: "Czy chcesz dziś ugotować?", language_code: pl, direction: ltr}]}
