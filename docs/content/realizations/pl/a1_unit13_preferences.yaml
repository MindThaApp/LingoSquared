            target: {text: "Wolę herbatę.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit13.lesson02.teach.czy_or_note
            kind: grammar_note
            target: {text: "Czy w pytaniu Kawa czy herbata? nie jest tym samym czy, co na początku pytania tak/nie -- tutaj łączy dwie możliwości, jak angielskie 'or'. Kawa czy herbata? = Coffee or tea?", language_code: pl, direction: ltr}
