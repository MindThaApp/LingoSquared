            type: word_order
            tested_text: "Bardzo lubię muzykę"
            prompt: {target_blocks: []}
            word_bank: ["muzykę", "Bardzo", "lubię"]
          - content_key: pl.a1.unit13.lesson01.exercise07.fill_lubisz_marek
