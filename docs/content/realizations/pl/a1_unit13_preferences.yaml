          - content_key: pl.a1.unit13.lesson02.teach.wolec_scope_note
            kind: grammar_note
            target: {text: "Woleć (to prefer): wolę (ja) -- w tej lekcji uczysz się tylko formy 'ja', tak jak lubię. Wolę kawę. = I prefer coffee.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit13.lesson02.teach.kawa_herbata_recap
            kind: grammar_note
            target: {text: "Wolę + biernik: kawa -> kawę, herbata -> herbatę -- ten sam wzór, co już znasz.", language_code: pl, direction: ltr}
            introduced_tokens: ["kawa", "herbata", "kawę", "herbatę"]
          - content_key: pl.a1.unit13.lesson02.teach.wole_kawe
            kind: phrase
            target: {text: "Wolę kawę.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit13.lesson02.teach.wole_herbate
