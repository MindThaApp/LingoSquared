    title: "Lubię i wolę"
    section: reading_writing
    spine_outcome_ids:
      - universal.a1.preferences.express_preferences
    planned_lesson_count: 3

    lessons:
      - content_key: pl.a1.unit13.lesson01.czy_lubisz
        title: "Czy lubisz...?"
        spine_outcome_id: universal.a1.preferences.express_preferences
        teaching:
          - content_key: pl.a1.unit13.lesson01.teach.muzyka
            kind: vocabulary
            target: {text: "muzyka", language_code: pl, direction: ltr}
            introduced_tokens: ["muzyka"]
            example:
              {text: "Lubię muzykę.", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit13.lesson01.teach.muzyke_accusative_note
            kind: grammar_note
            target: {text: "Lubić + biernik: muzyka zmienia się w muzykę, tak samo jak kawa -> kawę. Lubię muzykę, nie: Lubię muzyka.", language_code: pl, direction: ltr}
            introduced_tokens: ["muzykę"]
          - content_key: pl.a1.unit13.lesson01.teach.lubisz
            kind: vocabulary
            target: {text: "lubisz", language_code: pl, direction: ltr}
            introduced_tokens: ["lubisz"]
            example:
              {text: "Lubisz muzykę?", language_code: pl, direction: ltr}
          - content_key: pl.a1.unit13.lesson01.teach.lubic_paradigm_note
            kind: grammar_note
            target: {text: "Lubić: lubię (ja), lubisz (ty), lubi (on/ona). Lubię i lubi już znasz -- lubisz to nowa forma, dla osoby, z którą rozmawiasz.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit13.lesson01.teach.czy_lubisz_muzyke
            kind: phrase
            target: {text: "Czy lubisz muzykę?", language_code: pl, direction: ltr}
            introduced_tokens: ["Czy"]
          - content_key: pl.a1.unit13.lesson01.teach.tak_lubie
            kind: phrase
            target: {text: "Tak, lubię.", language_code: pl, direction: ltr}
            introduced_tokens: ["Tak", "lubię"]
          - content_key: pl.a1.unit13.lesson01.teach.nie_nie_lubie
            kind: phrase
            target: {text: "Nie, nie lubię.", language_code: pl, direction: ltr}
            introduced_tokens: ["nie"]
          - content_key: pl.a1.unit13.lesson01.teach.ellipsis_note
            kind: grammar_note
            target: {text: "Krótka odpowiedź: Tak, lubię. / Nie, nie lubię. -- nie trzeba powtarzać słowa muzykę, bo już wiadomo z pytania, o co chodzi.", language_code: pl, direction: ltr}
            introduced_tokens: []
          - content_key: pl.a1.unit13.lesson01.teach.bardzo_lubie_muzyke
            kind: phrase
            target: {text: "Bardzo lubię muzykę.", language_code: pl, direction: ltr}
            introduced_tokens: ["Bardzo"]
        exercises:
          - content_key: pl.a1.unit13.lesson01.exercise01.select_muzyka
            type: multiple_choice
            tested_text: "muzyka"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit13.lesson01.exercise02.select_lubisz
            type: multiple_choice
            tested_text: "lubisz"
            prompt: {target_blocks: []}
          - content_key: pl.a1.unit13.lesson01.exercise03.select_tak
