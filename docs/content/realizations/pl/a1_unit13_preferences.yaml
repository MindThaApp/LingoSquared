              - {left: "lubisz", right: "you like"}
              - {left: "lubię", right: "I like"}
              - {left: "Czy", right: "question particle (yes/no question)"}
              - {left: "Tak", right: "yes"}
              - {left: "nie", right: "no / not"}
          - content_key: pl.a1.unit13.lesson01.exercise05.order_czy_lubisz_muzyke
            type: word_order
            tested_text: "Czy lubisz muzykę"
            prompt: {target_blocks: []}
