    (line 416), then read that block directly (lines 416-437: can_do "Express
    and ask about basic likes, dislikes, wants, and choices," prerequisites: [],
    modalities [listening, speaking, reading, writing], assessment_requirements:
    understand_preference (listening: identify a speaker's stated preference or
    choice), exchange_preferences (speaking: ask about and state a simple
    preference, completing both turns), read_preference (reading: identify
    likes/dislikes/choices in a short message), write_preference (writing: write
    a simple preference with a reason IF SUPPORTED BY THE REALIZATION -- this
    file does not introduce a reason-clause construction, see the grammar-scope
    note below for why, which the spine's own conditional wording explicitly
    allows). No prerequisites listed, so no dependency check needed. Did NOT
    open nl/a1_unit13*.yaml or any other language's unit13 at all, per the
    strong sibling-isolation instruction in this dispatch (broader than
    AUTHORING_GUIDE §8's same-direction rule, applied here to any other
    language's file for this same unit number) -- topic/outcome match was
    confirmed purely from the spine file itself, no cross-language read needed.

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version 1.1):
    every kind:vocabulary card carries a real example sentence. Zero
    listen_type/listen_select/listen_order exercises anywhere in this file,
    matching unit01-12's own established choice -- media_assets is an empty
    list, not an oversight.

    Same-speaker-distractor check (AUTHORING_GUIDE, standing bug-class
    warning): this file has one TEXT dialogue (lesson03, no audio, so the
    literal "same audio clip" bug class doesn't directly apply the same way it
    would for a recorded dialogue -- explicitly checked and confirmed, same
    reasoning unit09-12 already used for their own audio-less dialogues), but
    the analogous risk for multiple_choice line-selection and
    dialogue_comprehension exercises was checked by hand, listing every line
    each speaker actually says first:
    Marek's three lines: "Czy lubisz muzykę?" / "Ja też lubię. Kawa czy
    herbata?" / "Ja wolę kawę."
    Ewa's two lines: "Tak, bardzo lubię! A ty?" / "Wolę herbatę."
    lesson03.exercise01 asks which line asks if you like music (correct:
    Marek's "Czy lubisz muzykę?"); distractors are Marek's own "Ja też lubię.
    Kawa czy herbata?" and Ewa's "Tak, bardzo lubię! A ty?" -- neither literally
    asks about liking music by name (one is a drink question, the other is an
    answer-plus-return-question), so there is no line that could also correctly
    answer "which line asks if you like music."
    lesson03.exercise02 asks which line says Ewa likes it too and asks Marek
    back (correct: Ewa's "Tak, bardzo lubię! A ty?"); distractors are Marek's
    "Ja też lubię. Kawa czy herbata?" and "Ja wolę kawę." -- neither is spoken
    by Ewa nor contains "A ty?", so no overlap with the specific fact being
    tested.
    lesson03.exercise03 (dialogue_comprehension) shows ONLY Marek's own line
    "Ja wolę kawę." as the read passage and asks what Marek prefers to drink
    (correct: kawa/coffee) -- "herbata" never appears in the quoted passage
    itself, so the comprehension question is unambiguous even though herbata
    is mentioned elsewhere in the full dialogue.
    lesson03.exercise04 (dialogue_comprehension) shows ONLY Ewa's own line
    "Wolę herbatę." as the read passage and asks what Ewa prefers to drink
    (correct: herbata/tea) -- same reasoning, kawa never appears in this
    quoted passage. No exercise in this file makes two answer options
    simultaneously true for the specific fact being asked about.

    Cross-checked against this file's own content per AUTHORING_GUIDE §11: the
    facts this unit's dialogue states (Ewa and Marek both like music; Ewa
    prefers tea; Marek prefers coffee) are each stated exactly once and never
    contradicted elsewhere in the file. This required active attention while
    drafting lesson01/lesson02's earlier, generic (pre-dialogue) grammar-check
    exercises: an early draft attributed "Mówi Ewa: Czy ___ muzykę?" (lesson01)
    and a kawa-preference case-fix to Ewa (lesson02), both of which would have
    contradicted lesson03's actual story (Marek is the one who asks the music
    question; Marek, not Ewa, is the one who prefers coffee) -- caught during
    self-review before finalizing and corrected: lesson01's fill_in_blank now
    attributes the question to Marek (matching lesson03), and lesson02's
    grammar_check now attributes the coffee preference to Marek (also matching
    lesson03). Every other teaching-card example sentence in lesson01/lesson02
    ("Wolę kawę." / "Wolę herbatę." / "Tak, lubię." / "Nie, nie lubię.") is
    deliberately left UNATTRIBUTED to either named character, the same
    "generic pattern vs. specific story" split unit11 and unit12 already
    established, precisely so these generic pattern-teaching examples can never
    contradict lesson03's specific, committed facts.

    Grammar-scope decision, disclosed up front per unit07-12's own precedent
    for narrowing A1 grammar exposure deliberately rather than by omission.
    This unit's own communicative outcome (express and ask about basic likes,
    dislikes, wants, and choices) genuinely requires a real two-way exchange
    (exchange_preferences: "ask about AND state," "completes both turns") --
    unlike unit12, which could route around a gendered 2nd-person question
    entirely via the invariant "było," this unit cannot avoid a real
    2nd-person form if it wants a genuine question-and-answer exchange about
    liking something. The scope below is deliberately narrow given that:
    (1) lubić already has 1st-person (lubię) and 3rd-person (lubi) taught in
    pl/a1_unit06_food.yaml -- this unit adds ONLY the 2nd-person ty-form
    (lubisz), completing the informal-register question "Czy lubisz X?" that
    unit06 could not yet ask. No formal pan/pani form of lubić, no plural
    form, is introduced anywhere in this file.
    (2) woleć (to prefer) is a brand-new verb this unit, but ONLY its
    1st-person-singular form (wolę) is taught or tested -- no 2nd-person
    (wolisz), 3rd-person (woli), plural, or formal form appears anywhere in
    this file. This is possible without sacrificing a real exchange because
    the "or" choice itself is asked with a bare elliptical question requiring
    no verb at all -- "Kawa czy herbata?" ("Coffee or tea?") -- the exact same
    verb-less short-question pattern unit12's own elliptical_note already
    established for "Pyszny?" ("Tasty?"), now extended from a yes/no echo
    question to an either/or choice question. lesson03.teach.elliptical_reminder_note
    makes this continuity explicit. Both Ewa's and Marek's actual stated
    preferences in the dialogue are given entirely in 1st person (Wolę
    herbatę. / Ja wolę kawę.), so the outcome's own "state a simple
    preference" requirement is fully met without ever needing 2nd/3rd-person
    woleć.
    (3) Neither lubić nor woleć is gender-marked in the present tense (unlike
    unit12's past-tense byłem/byłam split) -- a genuine scope SIMPLIFICATION
    versus unit12, not an omission: there is only one present-tense form per
    grammatical person, spoken identically by Ewa or Marek, so this file
    introduces no new gender-agreement machinery at all.
    (4) The accusative-case pattern itself (kawa -> kawę, herbata -> herbatę,
    already established since pl/a1_unit06_food.yaml, and extended to a new
    noun muzyka -> muzykę here) is REUSED, not newly introduced -- this unit's
    only new case-adjacent content is applying the already-taught -a/-ę
    accusative pattern to one additional noun (muzyka), explicitly called out
    in lesson01's own grammar_note so it reads as continuity, not a new rule.
    (5) No reason-clause construction (an equivalent of "because") is
    introduced -- the spine's own write_preference requirement asks for a
    reason only "if supported by the realization," and this file deliberately
    does not support it this pass, keeping scope to asking about and stating a
    bare preference. Flagging honestly for a future unit or a later pass on
    this same unit: "bo" (because) was checked against the cached FSI Polish
    FAST text and not found in a simple, A1-appropriate usable form nearby the
    preference material actually used, so it was not source-confirmed either
    way this round -- deferred, not silently dropped.

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from earlier units (kawa/herbata/kawę/herbatę
    from unit06, Czy from unit01, Tak from unit01/03/05, nie from unit04/10/11,
    bardzo from units01/06/07/08/09/11/12, A/ty from unit01/05/10/12, Ja/też
    from unit10) is re-declared via this file's OWN introduced_tokens before
    being tested in this file's own exercises -- the compiler validates
    untaught vocabulary per realization FILE, not per course, and token
    matching is case-folded (confirmed again by reading tokenize() in
    scripts/compile_content.py). "Mówi Marek:"/"Mówi Ewa:" narrative framing in
    fill_in_blank/grammar_check PROMPTS reuses "Mówi" the same way unit12
    already established (never appears in an exercise's own tested_text, so it
    does not require re-declaration in this file's introduced_tokens).

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02-12
    (.firecrawl/fsi-polish-fast.pdf / .txt), re-searched fresh for this unit's
    own topic (preferences/likes/wants) rather than reused from a stale prior
    search. This unit's core grammar is well source-confirmed: lubić's full
    present-tense paradigm is given directly (cached .txt lines ~7412-7419:
    "Lubić - to like - present tense: (ja) lubię / (ty) lubisz / (on/a, pan/i)
    lubi / (my) lubimy / (wy) lubicie / (oni/one, państwo) lubią"), with the
    exact worked example "Lubię herbatę" (cached .txt line ~7425, "I like tea")
    directly confirming the lubić+accusative pattern this file's own "Lubię
    muzykę"/"Wolę herbatę" sentences extend to a new object. woleć's full
    present-tense paradigm is also given directly (cached .txt lines
    ~5439-5447: "Woleć - to prefer - present tense: (ja) wolę / (ty) wolisz /
    (on/a, pan/i) woli / (my) wolimy / (wy) wolicie / (oni/one, państwo)
    wolą"), confirming wolę as the genuine 1st-person form (this file's only
    tested woleć form, per the scope decision above). The exact elliptical
    "Kawa czy herbata?" construction is directly attested twice in real
    dialogue (cached .txt lines ~7218 "Herbata czy kawa?" and ~7904 "Kawa czy
    herbata?"), confirming both the word order and the natural, unmarked use
    of bare "czy" as an "or" connector between two nouns -- distinct from its
    already-taught yes/no-question-particle sense, called out explicitly in
    this file's own grammar_note (lesson02.teach.czy_or_note) to avoid
    conflating the two senses. "kawa"/"herbata" themselves were already
    confirmed for pl/a1_unit06_food.yaml and are reused, not re-sourced.
    "muzyka" is confirmed as ordinary, unmarked A1 vocabulary via general
    knowledge of Polish (a direct cognate, feminine -a noun following the
    exact same regular accusative pattern as kawa/herbata) rather than a
    specific source-text hit -- the cached FSI text's own index was checked
    for "muzyka" and returned no direct hit, honestly disclosed as NOT
    source-confirmed, freely authored by regular vocabulary/grammar analogy
    (the same standard applied to unit11's disclosed "chcę/chcesz" gap and
    unit12's disclosed "zobaczyłem/zobaczyłam" gap -- a transparent cognate
    following an already twice-confirmed regular inflection pattern does not
    need separate source confirmation to be confident of).

    Cross-checked against this file's own earlier lessons per AUTHORING_GUIDE
