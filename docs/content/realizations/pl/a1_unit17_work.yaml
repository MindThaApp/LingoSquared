course:
  realization_key: pl.a1
  target_language_first: true
  dialect: pl_standard
  register_policy: >-
    Continue unit01-16's register split: Ewa and Marek use the informal
    ty-register with each other throughout. This unit introduces no new
    formal pan/pani forms -- the source material's own formal "Jestem
    urzędnikiem ambasady" register (used between strangers/colleagues) is
    deliberately adapted into the informal register already established
    between these two friends, matching how unit09's stranger-facing
    direction-giving register was already adapted for Marek/Ewa in unit16.

