    Grammar-scope decision, disclosed up front per unit07-16's own precedent
    for narrowing A1 grammar exposure deliberately rather than by omission:
    (1) **This is the FIRST time this course introduces the instrumental
    case, and it is scoped deliberately narrow: exactly two profession words,
    taught as memorized whole-word "Jestem + ___" chunks, not as a general
    case-formation rule.** "inżynier" -> "inżynierem" (regular masculine/
    neuter instrumental -em ending, and per the source's own explicit note,
    unchanged regardless of the speaker's gender) and "nauczycielka" ->
    "nauczycielką" (regular feminine instrumental -ą ending, replacing the
    final -a) are the only two instrumental forms taught. No instrumental
    declension paradigm, no other case-taking preposition, and no other
    profession noun's instrumental form is introduced. This follows the
    exact same "memorized chunk, not a productive rule" precedent
    unit09/unit15 already set for genitive destination forms, and unit05 set
    for locative city names (w Warszawie, w Krakowie, w Gdańsku) -- a new
    case surfacing as a small, fixed set of whole-word forms tied to specific
    vocabulary, never as a taught declension table.
    (2) **"W + workplace noun" (w szkole, w biurze) is a disclosed, direct
    extension of the locative-chunk precedent unit05 already established
    with city names and unit10 already established with time-of-day nouns (w
    południe).** These are two more memorized whole-word locative forms, not
    a new grammar point in kind -- the file's own grammar_note says so
    explicitly, naming both precedents.
    (3) **"Pracować" continues directly from unit10's already-taught
    1st-person "pracuję," adding only the 2nd-person "pracujesz"** -- the
    exact same "2 of 6 forms only" precedent unit15's jechać (jadę/jedzie)
    and unit16's czuć się (czuję/czujesz) both already used. The 3rd-person
    form "pracuje" is deliberately never introduced or tested anywhere in
    this file; wherever a specific character's workplace needed to be
    stated as a fact (not a live first-person utterance), this file uses
    the profession noun via "jest" instead (see point 4) rather than a
    3rd-person "pracuje" statement, so the gap is never actually needed.
    (4) **"Jest" (3rd person singular of być, "to be") is used freely and
    is NOT treated as newly scope-narrowed** -- unlike "pracuje," "jest" has
    been pervasively taught and used since unit01 (e.g. unit08's "Bank jest
    tam," unit10's "Dom jest tam") and this file's own "Marek jest
    inżynierem"/"Ewa jest nauczycielką" statements are a completely ordinary
    continuation of that existing, fully-established usage -- flagged
    explicitly so it isn't mistaken for a new grammar point the way the
    instrumental profession-noun ending genuinely is.
    (5) **No new adjective agreement, no genitive, no dative, no vocative,
    and no comparative/superlative appear anywhere in this file.**
    (6) **The word "zawód" (occupation, as an abstract noun) is deliberately
    never used anywhere in this file, including inside grammar_note
    explanatory text** -- "zawód"/"zawody" is a real polysemy trap in Polish
    (the plural "zawody" commonly means "sports competition," confirmed by
    its actual use in that sense in the cached FSI text itself, cached line
    12453: "mamy zawody" in a skiing-trip context, not an occupation
    context). This unit teaches occupation entirely through concrete
    profession nouns and the "Jestem + ___" pattern rather than through any
    abstract "what is your occupation" question needing that noun, sidestepping
    the ambiguity risk entirely rather than risking a mistranslation.

