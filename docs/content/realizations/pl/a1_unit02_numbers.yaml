review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Second Polish unit, continuing directly from pl/a1_unit01_greetings.yaml
    (same Ewa/Marek characters, same formal pan/pani register established
    there since they've only just met). Sized to 3 lessons matching unit01's
    bootstrap pace, not the 6-lesson depth other languages' numbers units
    eventually grew to (checked es/a1_unit02_numbers.yaml, fr, nl for the
    topic precedent -- every other launched language's unit02 realizes
    universal.a1.numbers.use_basic_numbers, confirmed against
    universal_spine.yaml). Authored from the start in AUTHORING_GUIDE §19
    format (schema_version 1.1): every kind:vocabulary card carries a real
    example: sentence, checked by hand for correct Polish number-noun
    agreement (jeden + singular; dwa/trzy/cztery + nominative plural;
    pięć+/teens/round tens/hundreds + genitive plural; compound numbers
    agree by their final component, e.g. dwadzieścia osiem lat but
    trzydzieści dwa lata). Zero listen_type/listen_select/listen_order
    exercises anywhere in this file, matching unit01's own choice --
    pl now has real Google Cloud TTS (pl-PL-Wavenet-F, confirmed live
    backend-side) as of this unit's authoring, unlike when unit01 was
    written, but this file intentionally still avoids audio-dependent
    exercise types to stay consistent with unit01's established precedent
    in this corpus rather than introduce the first audio-type lesson
    content unilaterally; a future audio-authoring pass is a real, cheap
    opportunity now that TTS is wired, just not done here. media_assets is
    therefore an empty list, not an oversight. dialogue_comprehension
    exercises in lesson03 render via the same MultipleChoice component as
    multiple_choice/listen_select (frontend/src/components/exercises/
    ExerciseRenderer.tsx) and are given real target_blocks text instead of
    a media_asset_key, matching unit01's own pattern.

    Source: FSI Polish FAST (1992), Unit 4 "Using the Telephone," the
    "LICZBY" (Numbers) section (p. 86) -- confirmed real public-domain US
    government course text (fsi-languages.yojik.eu/languages/FSI/Polish/
    FAST/FSI - Polish FAST.pdf, downloaded and OCR'd via pdftotext -layout
    this session). Real source vocabulary actually used, adapted per §10
    (never imported verbatim): the cardinal numbers 0-8, the -naście
    teens (11-19), the -dzieści/-dziesiąt tens (20-90), the hundreds
    (100-900) and "tysiąc" (1,000), and the standalone "ile" (how much/
    how many) vocabulary entry. The source's own explanatory note ("11-19
    contain a -naście form similar to English -teen; 20-40 contain
    -dzieści; 50-90 contain -dziesiąt") is paraphrased in this file's own
    words on the jedenaście/dwadzieścia/pięćdziesiąt cards' overlay notes,
    not copied verbatim. The source's telephone-context question "Pana/
    pani numer?" (a bare fragment used there for long-distance-call
    routing) is modernized and expanded here into full formal questions
    ("Jaki jest pana/pani numer telefonu?") repurposed for a personal
    contact-exchange scenario, consistent with the modernization
    requirement -- reading the same after adaptation as before it would be
    a sign the pass didn't happen, and it does not read the same. The
    source's own price-question pattern ("Ile kosztuje ten pokój?") is
    likewise adapted into the shorter, equally natural "Ile to kosztuje?"
    used generically here rather than tied to a hotel room.

    Two real gaps in the source, disclosed honestly: (1) the OCR'd LICZBY
    table has a genuine two-row gap between the 8/18/80 row and the
    19/90 row -- "dziewięć" (9) and "dziesięć" (10) never render in the
    extracted text at all (confirmed by grep across the full document,
    zero hits for either word near the table). These two are supplied
    from general knowledge of standard Polish rather than the source,
    same disclosure standard as any freshly-authored item -- they are
    uncontroversial basic cardinals, not register-sensitive content. (2)
    the source never asks age via "how many years" at all -- it asks via
    birthday ("Kiedy się pan/pani urodził/a?", confirmed by grep, found
    only in a later unit's birthday section, not near the numbers
    material) -- so every "Ile masz lat?"/"Ile pan ma lat?"/"Mam ... lat/
    lata" item in this file is freshly authored from general knowledge of
    modern spoken Polish, not source-derived, disclosed the same way
    unit01 disclosed its own freshly-authored ty-register items. The
    lat/lata agreement nuance (numbers ending in 2/3/4 take "lata"; every
    other numeral takes "lat") is real, verified Polish grammar, called
    out explicitly on lesson03's line05 dialogue card and drilled once via
    a grammar_check exercise -- not a source claim, a general-knowledge
    grammar fact same as unit01's pan/pani verb-agreement notes.

    The lesson03 Ewa/Marek phone-number-and-age dialogue, and the specific
    numbers chosen for the scenario (28, 32, a 5-digit sample phone
    number, a 30-złoty ticket price, a 100-złoty round price), are freshly
    authored, continuing unit01's characters and formal register.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    lesson03.exercise05 matching pairs rebuilt so no two lefts share an
    interchangeable answer and the age pairing matches canon (Marek 28).
    Mirrored in the en-pl overlay; see its notes.

course:
  realization_key: pl.a1
  target_language_first: true
  dialect: pl_standard
  register_policy: >-
    Continue unit01's register split exactly: Ewa and Marek, who have only
    just met, stay in the formal pan/pani register throughout this unit's
    dialogue -- teaching cards present both the formal (pan/pani) and
    informal (ty) versions of the phone-number and age questions as
    standalone vocabulary, the same way unit01 taught both registers even
    though its own closing dialogue used only one. Numbers themselves
    don't change with register, but the surrounding questions do.

