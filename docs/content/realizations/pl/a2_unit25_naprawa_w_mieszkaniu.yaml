review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fifth Polish A2 unit, continuing from pl/a2_unit24_u_lekarza.yaml.
    Realizes universal.a2.housing.report_maintenance_problem -- confirmed
    against docs/content/universal_spine.yaml (line 785): can_do "Report a
    basic household problem to a landlord or building manager and arrange
    for a repair," prerequisites [universal.a1.housing.describe_home,
    universal.a1.communication.basic_phone_contact]. The first is directly
    satisfied by this course's own pl/a1_unit18_housing.yaml (mieszkanie,
    pokój, kuchnia etc.); the phone-contact prerequisite has no dedicated pl
    unit yet, so per universal_spine.yaml's own "teach prerequisites
    concurrently" allowance this unit's scene is a genuine in-person report
    to the building administrator, not a phone call -- the same resolution
    already used for unit21/unit24's own copies of this same gap.

    Scenario: Marek's heating (ogrzewanie) stops working in his mieszkanie
    (the same apartment A1's unit18 already established him having); he
    reports it to Administrator (the building manager) and arranges a
    repair time.

    A2-level step-up from A1, deliberate and disclosed: (1) **mógłby**
    (could, masculine conditional of móc), a genuine new conditional form
    that extends this course's chciałbym/chciałabym conditional-mood theme
    (units21/23) to a DIFFERENT verb (móc, not chcieć) -- confirming the
    learner is acquiring the conditional mood as a productive pattern, not
    memorizing one fixed phrase. Used in a real polite request ("Czy mógłby
    pan przyjść jak najszybciej?"). (2) **od kiedy** (since when) as a
    genuine information question about problem duration, mirroring (without
    repeating) unit24's od+genitive duration STATEMENT with a duration
    QUESTION instead. (3) **nie działa** (isn't working/doesn't function),
    a high-frequency everyday complaint construction with real negation +
    verb agreement. Grepped introduced_tokens across pl/a1_unit01-20 and
    pl/a2_unit21-24 for mógłby/działa/zepsute -- zero hits, confirming
    genuinely new material (mogę/może/wczoraj/jutro are real A1 recap words,
    correctly redeclared below, not new grammar).

    Source-access research: firecrawl still at 0/1,000 credits (same
    outage all four earlier units this session hit). Grepped the cached FSI
    Polish FAST text for "ogrzewanie"/"zepsute"/"awaria"/"hydraulik" --
    zero hits for all four; a 1960s-70s diplomatic-training course has no
    building-maintenance-complaint scene. Authored from established modern
    Polish tenant/landlord conventions (reporting a broken utility to an
    administrator/zarządca is a routine, real interaction), not adapted
    from any external source.

    Same-speaker-distractor check: lesson03's dialogue has two speakers,
    Marek (3 lines) and Administrator (3 lines). Marek: "Dzień dobry.
    Ogrzewanie w moim mieszkaniu nie działa." / "Od wczoraj. Czy mógłby pan
    przyjść jak najszybciej?" / "Świetnie, dziękuję." Administrator: "Od
    kiedy nie działa?" / "Oczywiście. Mogę przyjść jutro rano." / "Do
    zobaczenia jutro." Every exercise built from this dialogue was checked
    by hand -- no distractor restates the fact under test using the same
    speaker's other line (e.g. the exercise asking when the repair happens
    has Administrator's other two lines as distractors, and neither
    mentions a specific time).

    Cross-checked per §11: the problem (heating not working), its start
    (since yesterday), and the repair time (tomorrow morning) are each
    stated exactly once and never contradicted elsewhere in the file.

    Cross-file vocabulary note: every word this file's exercises test,
    including recap words (Dzień/dobry/Proszę/dziękuję/jest/mam/ma/Tak/Czy/
    kiedy/i/w/mieszkanie/moim/mój/mogę/może/wczoraj/jutro), is redeclared
    via this file's own lesson01 recap card, per the compiler's per-FILE
    untaught-vocabulary check. Pending fresh-context review per
    AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    canon -- A1 unit18 established Marek with a house (Mam dom. Dom jest
    duży.) and Ewa with the apartment (A ja mam mieszkanie; A2 unit21 Ewa
    moved into a new mieszkanie), so Marek reporting "Ogrzewanie w moim
    mieszkaniu" contradicted canon: reassigned the three tenant lines
    (dialogue line01/03/05) to Ewa -- every line is speaker-gender-neutral
    (mógłby pan addresses the male Administrator), so no Polish text
    changed; lesson01.exercise07 prompt "Marek mówi" -> "Ewa mówi";
    overlay titles/notes/instructions Marek -> Ewa; register_policy
    updated. (2) false-grammar -- lesson02.teach.moglby_note claimed
    mógłby is "used by a man" (używana przez mężczyznę); it is used when
    addressing a man (Czy mógłby pan...?): realization text and overlay
    gloss corrected. (3) comprehension-without-text --
    lesson03.exercise05.read_the_problem showed only the question: added
    the problem line as a block. (4) missing-accepted-answer --
    lesson02.exercise07 + Czy mógłby pan jak najszybciej przyjść?;
    lesson02.exercise09 + that order and Czy pan mógłby przyjść jak
    najszybciej?; lesson02.exercise10 + W moim mieszkaniu nie działa
    ogrzewanie / Ogrzewanie nie działa w moim mieszkaniu;
    lesson03.exercise09 + Jutro rano mogę przyjść. (5)
    underdetermined-prompt -- lesson02.exercise09 pinned to
    formal-to-a-man. (6) other -- overlay dialogue line06 note said
    "ending the call" for an in-person scene -> "conversation". NATIVE
    CHECK: none.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

    Second-pass review 2026-10-19: 1 fix -
    lesson03.exercise05.read_the_problem target_blocks carried a Polish
    question "Jaki problem zgłasza Ewa?" with untaught zgłasza (the English
    instruction already asks it) -> block removed.

