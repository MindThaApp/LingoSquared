    scripts/compile_content.py's validate_untaught_vocabulary, which reads
    only each exercise's own tested_text field via
    tokenize()/casefold() exact-string matching, never prompt.target_blocks
    or teaching-card target text) -- only actual tested_text tokens do, and
    every one of those was traced back to an explicit teaching-card
    introduced_tokens entry in this file before finalizing (including the
    grouped "M" token on lesson03's `rozmiar` card, added specifically
    because "Rozmiar M" is tested by lesson03.exercise10). Two
    ambiguity-avoidance checks made during authoring (AUTHORING_GUIDE §13/
    §17's spirit, though these apply mechanically only to Endless Practice
    templates, not hand-authored lesson content): lesson01.exercise07's
    fill_in_blank frame ("Marek mówi: Chcę ___ koszulę.") has real
    surrounding context (the direct-speech frame plus the object "koszulę"
    make "kupić" the only sensible verb) rather than a bare blanked token;
    lesson02.exercise07's fill_in_blank ("Marek pyta: Jaki kolor ma
    koszula? Koszula jest ___.") is disambiguated by this file's own
    established fact (koszula was taught as niebieska and no other color is
    ever attributed to it anywhere in this file), the same domain-
    restriction technique unit19's own lesson01.exercise07 used for its
    "pogoda" blank. Two grammar_check exercises (lesson01.exercise08,
    lesson03.exercise09) were deliberately built around a scramble that
    displaces the interrogative word ("Ile"/"Co") from its required
    sentence-initial position ("Koszula ile kosztuje?", "Chce pan co
    kupić?") -- the same unambiguously-wrong technique unit19 verified and
    used twice for its own "Jaka" displacement, rather than a merely
    alternate-but-still-grammatical word order (Polish's genuinely flexible
    word order makes many other reorderings defensible, not cleanly wrong,
    exactly the trap unit19's own authoring notes already flagged and
    avoided). lesson02.exercise08's grammar_check ("Niebieska koszula
    jest.") displaces the copula "jest" to the sentence end after the
    adjective-noun pair, which is a similarly unnatural/foreign-sounding
    order for a simple declarative statement in Polish, not the neutral
    subject-copula-adjective order this file's own teaching cards establish
    ("Koszula jest niebieska.").

