    Grammar-scope decision, disclosed up front per unit07-19's own
    precedent for narrowing A1 grammar exposure deliberately rather than by
    omission: (1) **Clothing sizes are taught as a bare borrowed letter
    (S/M/L), never a declined adjective** -- this is genuinely how Polish
    clothing retail works (a real Pole asking for a shirt says "Rozmiar M,"
    not a translated/declined size word), so it sidesteps any need for new
    adjective-noun agreement machinery entirely; "M" is explicitly added to
    lesson03's `rozmiar` vocabulary card's own introduced_tokens (same
    grouped-declaration technique unit07 used for "Kosztować"/"kosztuje"/
    "kosztują"/"Banany" on one card) since it is tested directly in
    lesson03's closing exercises. (2) **"niebieska" and "czerwona" are
    introduced as exactly two memorized nominative feminine adjective FORMS
    tied to one specific noun each, not a paired color-adjective set and
    not a general agreement rule** -- the exact same technique unit18 used
    for "duży" (tied only to "dom") and "mała" (tied only to "kuchnia"), and
    unit19 used for "dobra"/"straszna" (both tied only to "pogoda").
    "niebieska" is taught tied to exactly one noun, "koszula" ("Koszula
    jest niebieska."); "czerwona" is taught tied to exactly one different
    noun, "sukienka" ("Sukienka jest czerwona."). The masculine forms
    (niebieski, czerwony) are never introduced or tested anywhere in this
    file, and this file never cross-references the fact that "koszula"
    could grammatically take other colors or that these adjectives have
    other forms -- kept independent and additive, matching unit18/19's own
    explicit precedent for this exact technique. (3) **"jest"/"są"/"To" are
    explicitly redeclared via lesson01's own recap card despite being
    pervasively established since unit01/02/03** -- the compiler's
    untaught-vocabulary check is per-realization-FILE, not per-course, so
    every cross-unit reused token this file's own EXERCISES test (not just
    narrative prose, which is exempt) must be redeclared here, exactly as
    unit19's own lesson01/03 recap cards redeclare "Jaka"/"jest"/"Dziś"/
    "nie"/"Tak"/"A"/"ja"/"też"/"chcę"/"iść"/"do"/"parku"/"tam"/"bardzo" for
    the same mechanical reason. (4) **"chce" (3rd person singular of
    chcieć) and "pan" (formal masculine "you"/"sir") are introduced
    together on one grammar_note in lesson03, extending the already
    two-thirds-established chcieć paradigm (chcę/chcesz from unit11) and
    the already-established formal-address pattern (pani from unit07's own
    "Co dla pani?") to their natural remaining forms for a male customer --
    not a new grammar point in kind, a completion of two already-taught
    partial paradigms.** (5) **No new case ending is taught as its own
    grammar point anywhere in this file** -- "do sklepu" (lesson01's
    vocabulary-card example only, never tested) reuses the exact "do X"
    +genitive pattern already established with "do parku"/"do domu"
    (units08-11/19); "koszulę"/"sukienkę" (accusative singular of
    feminine -a nouns) are used the same way "bananów"/"pomidorów" were in
    unit07 -- explicitly added as extra introduced_tokens alongside the
    dictionary-form word wherever the inflected form is actually tested
    (see lesson01's `kupić` card, which declares both "kupić" and
    "koszulę" since "Chcę kupić koszulę" is tested in multiple lesson01/03
    exercises), never presented as a new declension rule to learn.

