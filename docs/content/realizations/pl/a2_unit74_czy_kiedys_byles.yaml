          - {"content_key": "pl.a2.unit74.lesson06.teach.d3", "kind": "dialogue", "target": {"text": "Ja jeszcze nie byłam w Gdańsku. Czy kiedyś leciałeś samolotem?", "language_code": "pl", "direction": "ltr", "speaker": "Ewa"}, "introduced_tokens": ["Ja", "jeszcze", "nie", "byłam", "w", "Gdańsku", "Czy", "kiedyś", "leciałeś", "samolotem"]}
          - {"content_key": "pl.a2.unit74.lesson06.teach.d4", "kind": "dialogue", "target": {"text": "Nie, nigdy nie leciałem samolotem. A ty?", "language_code": "pl", "direction": "ltr", "speaker": "Marek"}, "introduced_tokens": ["Nie", "nigdy", "leciałem", "samolotem", "A", "ty"]}
          - {"content_key": "pl.a2.unit74.lesson06.teach.d5", "kind": "dialogue", "target": {"text": "Ja też nie leciałam. Ale jadłam sushi kilka razy. Czy kiedyś jadłeś sushi?", "language_code": "pl", "direction": "ltr", "speaker": "Ewa"}, "introduced_tokens": ["Ja", "też", "nie", "leciałam", "Ale", "jadłam", "sushi", "kilka", "razy", "Czy", "kiedyś", "jadłeś"]}
          - {"content_key": "pl.a2.unit74.lesson06.teach.d6", "kind": "dialogue", "target": {"text": "Jeszcze nie jadłem sushi. Ale chcę spróbować!", "language_code": "pl", "direction": "ltr", "speaker": "Marek"}, "introduced_tokens": ["Jeszcze", "nie", "jadłem", "sushi", "Ale", "chcę", "spróbować"]}
        exercises:
