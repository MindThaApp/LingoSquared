          - {"content_key": "pl.a2.unit74.lesson05.teach.lektura", "kind": "reading", "target": {"text": "Cześć, Marek! Byłam w Krakowie trzy razy i w Warszawie dwa razy, ale jeszcze nie byłam w Gdańsku. Widziałam morze, ale nigdy nie pływałam w morzu. Jadłam sushi kilka razy. Nigdy nie jeździłam konno i nigdy nie leciałam samolotem. A ty? Czy kiedyś byłeś w Gdańsku?", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Cześć", "Marek", "Byłam", "w", "Krakowie", "trzy", "razy", "i", "Warszawie", "dwa", "ale", "jeszcze", "nie", "Gdańsku", "Widziałam", "morze", "nigdy", "pływałam", "morzu", "Jadłam", "sushi", "kilka", "jeździłam", "konno", "leciałam", "samolotem", "A", "ty", "Czy", "kiedyś", "byłeś"]}
        exercises:
          - {"content_key": "pl.a2.unit74.lesson05.exercise01.lee_krakow", "type": "reading_comprehension", "tested_text": "Byłam w Krakowie trzy razy", "prompt": {"target_blocks": [{"text": "How many times has Ewa been to Kraków?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson05.exercise02.lee_sushi", "type": "reading_comprehension", "tested_text": "Jadłam sushi kilka razy", "prompt": {"target_blocks": [{"text": "What has Ewa done several times?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson05.exercise03.une_lista", "type": "matching_pairs", "tested_text": "Byłam w Krakowie trzy razy Jeszcze nie byłam w Gdańsku Widziałam morze Nigdy nie pływałam w morzu Jadłam sushi kilka razy Nigdy nie jeździłam konno Nigdy nie leciałam samolotem Czy kiedyś byłeś w Gdańsku", "prompt": {"target_blocks": []}, "pairs": [{"left": "Byłam w Krakowie trzy razy.", "right": "I have been to Kraków three times."}, {"left": "Jeszcze nie byłam w Gdańsku.", "right": "I have not been to Gdańsk yet."}, {"left": "Widziałam morze.", "right": "I have seen the sea."}, {"left": "Nigdy nie pływałam w morzu.", "right": "I have never swum in the sea."}, {"left": "Jadłam sushi kilka razy.", "right": "I have eaten sushi several times."}, {"left": "Nigdy nie jeździłam konno.", "right": "I have never ridden a horse."}, {"left": "Nigdy nie leciałam samolotem.", "right": "I have never flown in a plane."}, {"left": "Czy kiedyś byłeś w Gdańsku?", "right": "Have you ever been to Gdańsk?"}]}
          - {"content_key": "pl.a2.unit74.lesson05.exercise04.ordena_ewa", "type": "word_order", "tested_text": "Ewa nigdy nie leciała samolotem", "prompt": {"target_blocks": []}, "word_bank": ["Ewa", "nigdy", "nie", "leciała", "samolotem"]}
          - {"content_key": "pl.a2.unit74.lesson05.exercise05.traduce_konno", "type": "translation", "tested_text": "Nigdy nie jeździłem konno", "prompt": {"target_blocks": [{"text": "I have never ridden a horse.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson05.exercise06.dicta_krakow", "type": "dictation", "tested_text": "Byłam w Krakowie trzy razy.", "media_asset_key": "pl.a2.audio.czy_kiedys_byles.krakow_trzy_razy.01", "prompt": {"target_blocks": []}}
          - {"content_key": "pl.a2.unit74.lesson05.exercise07.dicta_gdansk", "type": "dictation", "tested_text": "Jeszcze nie byłam w Gdańsku.", "media_asset_key": "pl.a2.audio.czy_kiedys_byles.jeszcze_nie_gdansk.01", "prompt": {"target_blocks": []}}
