          - {"content_key": "pl.a2.unit74.lesson06.exercise02.entiende_razy", "type": "dialogue_comprehension", "tested_text": "Byłem tam dwa razy", "media_asset_key": "pl.a2.audio.dialogue.czy_kiedys_byles.01", "prompt": {"target_blocks": [{"text": "How many times has Marek been to Gdańsk?", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson06.exercise03.une_dialogo", "type": "matching_pairs", "tested_text": "Czy kiedyś byłeś w Gdańsku Byłem tam dwa razy Pływałem też w morzu Jeszcze nie byłam w Gdańsku Czy kiedyś leciałeś samolotem Nigdy nie leciałem samolotem Jadłam sushi kilka razy Jeszcze nie jadłem sushi", "prompt": {"target_blocks": []}, "pairs": [{"left": "Czy kiedyś byłeś w Gdańsku?", "right": "Have you ever been to Gdańsk?"}, {"left": "Byłem tam dwa razy.", "right": "I have been there twice."}, {"left": "Pływałem też w morzu.", "right": "I have swum in the sea too."}, {"left": "Jeszcze nie byłam w Gdańsku.", "right": "I have not been to Gdańsk yet."}, {"left": "Czy kiedyś leciałeś samolotem?", "right": "Have you ever flown in a plane?"}, {"left": "Nigdy nie leciałem samolotem.", "right": "I have never flown in a plane."}, {"left": "Jadłam sushi kilka razy.", "right": "I have eaten sushi several times."}, {"left": "Jeszcze nie jadłem sushi.", "right": "I have not eaten sushi yet."}]}
          - {"content_key": "pl.a2.unit74.lesson06.exercise04.ordena_marek", "type": "word_order", "tested_text": "Marek nigdy nie leciał samolotem", "prompt": {"target_blocks": []}, "word_bank": ["Marek", "nigdy", "nie", "leciał", "samolotem"]}
          - {"content_key": "pl.a2.unit74.lesson06.exercise05.responde_sushi", "type": "dialogue_response", "tested_text": "Jeszcze nie jadłem sushi", "prompt": {"target_blocks": [{"text": "Czy kiedyś jadłeś sushi?", "language_code": "pl", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson06.exercise06.traduce_gdansk", "type": "translation", "tested_text": "Byłem w Gdańsku dwa razy i pływałem w morzu", "prompt": {"target_blocks": [{"text": "I have been to Gdańsk twice and I have swum in the sea.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson06.exercise07.escribe_tres", "type": "writing_prompt", "tested_text": "Byłem w Krakowie trzy razy Jadłem sushi Nigdy nie jeździłem konno", "prompt": {"target_blocks": [{"text": "Write three Polish sentences about yourself: (1) You have been to Kraków three times. (2) You have eaten sushi. (3) You have never ridden a horse.", "language_code": "en", "direction": "ltr"}]}}
