          - {"content_key": "pl.a2.unit74.lesson05.teach.gn_ja", "kind": "grammar_note", "target": {"text": "Ja też nie leciałam samolotem. Ja też jadłam sushi.", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Ja", "też", "nie", "leciałam", "samolotem", "jadłam", "sushi"]}
