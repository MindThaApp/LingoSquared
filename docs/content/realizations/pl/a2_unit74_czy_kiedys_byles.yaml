  notes: >-
    Drafted by drafting tool A. Realizes universal.a2.experience.talk_about_life_experiences. Grammar target: Polish has no present perfect, so life experience is expressed with the past tense plus kiedyś, już, jeszcze nie, nigdy nie, ani razu and counts (raz, dwa razy, kilka razy). Imperfective for general experience questions, perfective for one concrete finished fact. Canon reused: Ewa and Marek are friends (ty); only generic daily-life facts and Polish places (Kraków, Warszawa, Gdańsk). Unit-internal facts kept consistent: Ewa has been to Kraków three times and Warszawa twice, not yet to Gdańsk, has seen the sea, eaten sushi several times, never swum in the sea, ridden a horse or flown; Marek has been to Gdańsk twice, swum in the sea, never flown, not yet eaten sushi. Every exercise token is introduced earlier in this unit. Negated objects are limited to the indeclinable sushi to avoid the genitive of negation. OPEN NATIVE QUESTIONS: (1) Is 'Nigdy nie leciałem samolotem' (lecieć, one flight) natural for life experience, or should the course teach 'Nigdy nie latałem samolotem'? (2) Is 'Tak, spróbowałem sushi w Krakowie' a natural answer to 'Czy kiedyś próbowałeś sushi?' (perfective naming one occasion)? (3) Is 'Czy kiedyś jadłeś bigos?' fine with the object unmarked, and is the word order 'Byłem w Krakowie dwa razy' vs 'Dwa razy byłem w Krakowie' equally natural?
