          - {"content_key": "pl.a2.unit74.lesson06.teach.d1", "kind": "dialogue", "target": {"text": "Marek, czy kiedyś byłeś w Gdańsku?", "language_code": "pl", "direction": "ltr", "speaker": "Ewa"}, "introduced_tokens": ["Marek", "czy", "kiedyś", "byłeś", "w", "Gdańsku"]}
