          - {"content_key": "pl.a2.unit74.lesson04.exercise02.elige_dwa", "type": "multiple_choice", "tested_text": "Ewa była w Krakowie trzy razy", "prompt": {"target_blocks": [{"text": "Ewa has been to Kraków three times.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson04.exercise03.une_razy", "type": "matching_pairs", "tested_text": "raz dwa razy trzy razy kilka razy ile razy ani razu nigdy nie jeszcze nie", "prompt": {"target_blocks": []}, "pairs": [{"left": "raz", "right": "once"}, {"left": "dwa razy", "right": "twice"}, {"left": "trzy razy", "right": "three times"}, {"left": "kilka razy", "right": "several times"}, {"left": "ile razy", "right": "how many times"}, {"left": "ani razu", "right": "not even once"}, {"left": "nigdy nie", "right": "never"}, {"left": "jeszcze nie", "right": "not yet"}]}
          - {"content_key": "pl.a2.unit74.lesson04.exercise04.ordena_razy", "type": "word_order", "tested_text": "Marek był w Gdańsku dwa razy", "prompt": {"target_blocks": []}, "word_bank": ["Marek", "był", "w", "Gdańsku", "dwa", "razy"]}
          - {"content_key": "pl.a2.unit74.lesson04.exercise05.completa_razy", "type": "fill_in_blank", "tested_text": "Marek był w Gdańsku dwa razy", "prompt": {"target_blocks": [{"text": "Marek był w Gdańsku dwa ___.", "language_code": "pl", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson04.exercise06.traduce_kilka", "type": "translation", "tested_text": "Byłem w Krakowie kilka razy", "prompt": {"target_blocks": [{"text": "I have been to Kraków several times.", "language_code": "en", "direction": "ltr"}]}}
          - {"content_key": "pl.a2.unit74.lesson04.exercise07.escribe_ale", "type": "writing_prompt", "tested_text": "Byłem w Krakowie dwa razy ale nigdy nie byłem w Gdańsku", "prompt": {"target_blocks": [{"text": "Write in Polish: I have been to Kraków twice, but I have never been to Gdańsk.", "language_code": "en", "direction": "ltr"}]}}
      - content_key: pl.a2.unit74.lesson05.list_ewy
