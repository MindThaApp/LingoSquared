      - content_key: pl.a2.unit74.lesson04.ile_razy
        title: "Ile razy?"
        spine_outcome_id: universal.a2.experience.talk_about_life_experiences
        teaching:
          - {"content_key": "pl.a2.unit74.lesson04.teach.razy", "kind": "vocabulary", "target": {"text": "raz, dwa razy, trzy razy, kilka razy, ile razy", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["raz", "dwa", "razy", "trzy", "kilka", "ile", "Byłem", "w", "Krakowie", "Ewa", "była", "Warszawie", "jadła", "sushi", "Gdańsku", "byłeś"], "example": [{"text": "Byłem w Krakowie dwa razy.", "language_code": "pl", "direction": "ltr"}, {"text": "Ewa była w Warszawie dwa razy.", "language_code": "pl", "direction": "ltr"}, {"text": "Ewa jadła sushi kilka razy.", "language_code": "pl", "direction": "ltr"}, {"text": "Byłem w Gdańsku raz.", "language_code": "pl", "direction": "ltr"}, {"text": "Ile razy byłeś w Warszawie?", "language_code": "pl", "direction": "ltr"}]}
          - {"content_key": "pl.a2.unit74.lesson04.teach.gn_razy", "kind": "grammar_note", "target": {"text": "Byłem w Krakowie raz. Byłem w Krakowie dwa razy. Byłem w Krakowie kilka razy.", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Byłem", "w", "Krakowie", "raz", "dwa", "razy", "kilka"]}
          - {"content_key": "pl.a2.unit74.lesson04.teach.gn_ani", "kind": "grammar_note", "target": {"text": "Ani razu nie byłem w Gdańsku. Nigdy nie byłem w Gdańsku.", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Ani", "razu", "nie", "byłem", "w", "Gdańsku", "Nigdy"]}
          - {"content_key": "pl.a2.unit74.lesson04.teach.lacznik", "kind": "vocabulary", "target": {"text": "tam, i, ale, też, a ty", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["tam", "i", "ale", "też", "a", "ty", "Byłem", "w", "Krakowie", "Warszawie", "nie", "Gdańsku", "Ewa", "była", "dwa", "razy"], "example": [{"text": "Byłem w Krakowie i w Warszawie.", "language_code": "pl", "direction": "ltr"}, {"text": "Byłem w Krakowie, ale nie byłem w Gdańsku.", "language_code": "pl", "direction": "ltr"}, {"text": "Ewa też była w Krakowie.", "language_code": "pl", "direction": "ltr"}, {"text": "Byłem tam dwa razy, a ty?", "language_code": "pl", "direction": "ltr"}]}
          - {"content_key": "pl.a2.unit74.lesson04.teach.gn_podsumowanie", "kind": "grammar_note", "target": {"text": "Czy kiedyś jadłeś sushi? Tak, jadłem kilka razy. Nie, nigdy nie jadłem. Jeszcze nie jadłem.", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Czy", "kiedyś", "jadłeś", "sushi", "Tak", "jadłem", "kilka", "razy", "Nie", "nigdy", "Jeszcze"]}
          - {"content_key": "pl.a2.unit74.lesson04.teach.pytania", "kind": "phrase", "target": {"text": "Ile razy byłeś w Krakowie? Byłem tam trzy razy. Czy kiedyś pływałeś w morzu? Tak, pływałem kilka razy.", "language_code": "pl", "direction": "ltr"}, "introduced_tokens": ["Ile", "razy", "byłeś", "w", "Krakowie", "Byłem", "tam", "trzy", "Czy", "kiedyś", "pływałeś", "morzu", "Tak", "pływałem", "kilka"]}
        exercises:
