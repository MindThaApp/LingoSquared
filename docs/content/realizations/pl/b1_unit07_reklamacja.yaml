  notes: >-
    Seventh Polish B1 unit, continuing from pl/b1_unit06_rady.yaml.
    Realizes universal.b1.services.make_complaint_and_resolve_problem
    (docs/content/universal_spine.yaml: "Make a polite complaint about a
    product, service, or living situation -- describe what is wrong, say
    what already happened, and ask for a concrete resolution (refund,
    repair, replacement, or change), maintaining an appropriate
    register").

    Grammar step-up, deliberate and disclosed: this unit shifts register
    for the first time since b1_unit03_spotkania_w_pracy.yaml's formal
    workplace Pani exchange -- a complaint to a stranger/service provider
    calls for the SAME formal register the outcome names ("maintaining an
    appropriate register"), not Ewa-and-Marek's established informal ty.
    New constructions: "chciałbym/chciałabym złożyć reklamację" (I would
    like to make a complaint, the standard formal opener), "już + past
    tense" (already + past, to say what already happened -- "już
    dzwoniłem" I already called), and "czy mogę prosić o..." (could I
    ask for..., the polite resolution-request frame), landing on a named
    concrete resolution (wymiana -- replacement) per the outcome's own
    can_do text.

    Scenario: Marek, in his own voice (first person, consistent with his
    established character, not a new persona), calls customer service
    about a washing machine (pralka) bought two weeks ago that stopped
    working. He speaks with Konsultantka (a customer-service agent, a
    NEW character introduced fresh in this file, formal Pan/Pani
    register both directions). This is a self-contained new scenario --
    it does not touch Marek's workplace-inżynier storyline or Ewa/Kasia's
    established facts, so nothing here can contradict units01-06.

    Character canon check (item 6 of the authoring checklist): grepped
    pl/b1_unit01-06 before writing. Marek's engineer job and his ty
    register with Ewa are untouched here -- this file only adds a new,
    one-off formal exchange with a new character (Konsultantka), which
    does not conflict with any established fact. No existing character
    is put into third person mid-dialogue; the Konsultantka addresses
    Marek directly as Pan Marek/Pan throughout, and Marek addresses her
    as Pani throughout -- deixis kept consistent per item 10 of the
    dispatch's binding rules.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage). No public-domain intermediate Polish
    course exists to adapt from (same finding as prior units). Authored
    from established modern Polish customer-service register
    conventions.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Marek 3
    lines / Konsultantka 3 lines): every exercise built from this
    dialogue was checked by hand against every OTHER line either speaker
    says -- no distractor restates the fact under test using the same
    speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: the product (pralka,
    washing machine), the problem (nie działa, doesn't work), when it
    was bought (two weeks ago) and what already happened (Marek already
    called once, tydzień temu -- a week ago), and the resolution
    requested (wymiana, replacement) are each stated exactly once and
    never contradicted elsewhere in the file.

    Cross-file vocabulary note: this file recaps its own basic words
    (jest, mam, dobry, chciałbym) via lesson01's recap card, per the
    compiler's per-FILE untaught-vocabulary check -- does not rely on any
    other pl file having been compiled first. Pending fresh-context
    review per AUTHORING_GUIDE #9; not self-certified.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

