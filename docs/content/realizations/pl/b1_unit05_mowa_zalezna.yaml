  notes: >-
    Fifth Polish B1 unit, continuing from pl/b1_unit04_zdania_
    wzgledne.yaml. Realizes universal.b1.communication.report_what_
    someone_said (docs/content/universal_spine.yaml: "Report what
    someone said or asked using indirect/reported speech -- shift a
    direct statement or question into a reported clause introduced by
    'that'/'whether', adjusting tense and pronouns as needed,"
    prerequisites [universal.b1.narrative.combine_descriptions_with_
    relative_clauses], satisfied by this course's own unit04).

    Grammar step-up, deliberate and disclosed, and a genuine point of
    CONTRAST with English rather than a parallel: Polish reported speech
    does NOT backshift tense the way English does. English "He said he
    WAS tired" shifts a present-tense direct statement ("I am tired")
    into the past; Polish keeps the original tense of the direct
    utterance unchanged -- "Powiedział, że JEST zmęczony" (he said that
    he IS tired, present tense preserved) -- only the PERSON shifts
    (jestem -> jest, first to third). This is flagged explicitly in a
    dedicated grammar_note in lesson01, since an English-speaking
    learner's strongest instinct here is wrong. Two reporting
    structures are taught: "że" (that) for statements, "czy" (whether)
    for yes/no questions, with a lesson04 extension to wh-word reported
    questions (gdzie, kiedy, dlaczego) using the same że-free pattern
    czy-questions use.

    Scenario: continues Ewa and Marek's established informal ty
    register. A new character, Kasia (a mutual friend, introduced fresh
    in this file), is the subject of the reported speech in lesson03's
    dialogue -- she is moving to Kraków, a deliberate thematic echo of
    unit01's Kraków content but a DIFFERENT person's actual plan (not
    Marek's hypothetical one), so nothing in this file contradicts
    unit01.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage). No public-domain intermediate Polish
    course exists to adapt from. Authored from established modern
    Polish grammar conventions -- the no-tense-backshift rule was
    double-checked against standard Polish reference grammar before
    writing any example sentence.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says -- no
    distractor restates the fact under test using the same speaker's
    other line.

    Cross-checked per AUTHORING_GUIDE.md #11: Kasia's destination
    (Kraków), her moving timeframe (next month), and her question about
    help (this weekend) are each stated exactly once and never
    contradicted elsewhere in the file.

    Cross-file vocabulary note: this file recaps its own basic words
    (jest, mam, dobry, czy) via lesson01's recap card, per the
    compiler's per-FILE untaught-vocabulary check -- does not rely on
    any other pl file having been compiled first. Pending fresh-context
    review per AUTHORING_GUIDE #9; not self-certified. FRESH-CONTEXT REVIEW COMPLETE 2026-07-11 per AUTHORING_GUIDE §20 (boolean type-walk, accepted_answers value-key shape, title length, spine-outcome existence, jargon/snake_case scan, register consistency, case agreement, bare-word MC and listening distractor ambiguity, character consistency vs the pl corpus) -- no learner-facing bugs found in this unit; status set to reviewed.

