    Grammar-scope decision, disclosed up front per unit07-11's own
    precedent for narrowing A1 case/verb-form exposure deliberately rather
    than by omission. This unit's own communicative outcome (give a short,
    basic account of a recent completed event) genuinely requires REAL
    Polish past tense, which is unavoidably gender-marked in the singular
    -- unlike any prior pl unit, which stayed present-tense throughout.
    The scope below is deliberately narrow given that:
    (1) Only FIRST-PERSON-SINGULAR past tense is taught or tested, in both
    grammatical genders (-em masculine / -am feminine), for exactly three
    verbs: być (byłem/byłam, "I was"), zobaczyć (zobaczyłem/zobaczyłam, "I
    saw," perfective), and zrobić (zrobiłem/zrobiłam, "I did/made,"
    perfective). No second-person, third-person, plural, or formal
    pan/pani past-tense form is introduced anywhere in this file. This
    deliberately avoids needing a gendered past-tense QUESTION at all (see
    (2) below) -- the exchange in lesson03 works entirely through Marek's
    own invariant "Co było wczoraj?" and Ewa's own reply, never a "did YOU
    do X" question, so second-person past tense genuinely isn't needed to
    hit this outcome's own assessment_requirements (which ask for stating
    a completed action and extracting one from a short account, not a
    negotiated back-and-forth the way unit11's plans outcome did).
    (2) The invariant, ungendered 3rd-person-neuter past form "było" ("was
    there" / "happened," from być) is introduced and used specifically so
    the unit's own QUESTION never needs to pick a gender at all -- "Co było
    wczoraj?" (What happened yesterday?) is addressed to no one in
    particular grammatically, sidestepping the real complexity of Polish
    2nd-person past-tense address (which itself depends on the addressee's
    own gender, e.g. byłeś vs. byłaś) entirely, rather than smuggling it in
    partially.
    (3) A genuinely new grammar point beyond the gendered past-tense
    ending itself, disclosed explicitly: locative case after "w" applied
    to a place noun for the first time. Unit10 already established "w" +
    locative for NUMERAL/time expressions only (o czwartej, w sobotę's own
    accusative day case is a different pattern -- see unit11's own note);
    this file extends "w" + locative to "kino" -> "w kinie" (kino is
    neuter, locative singular kinie), confirmed directly in the source
    (see below). Only this one noun form (kinie) is taught/tested this
    way; no general locative declension table is introduced, and the
    contrast with unit11's own "do kina" (genitive, "going TO the cinema")
    is called out explicitly in this file's own grammar_note so the two
    don't get confused as the same case.
    (4) No 3rd-person (except the deliberately invariant "było"), plural,
    formal pan/pani, future, or conditional form is introduced anywhere in
    this file. "mówi" (a real, already-established word from
    pl/a1_unit01_greetings.yaml's "Czy mówi po polsku?") is reused as light
    narrative framing ("Mówi Marek: ...") in two grammar_check/fill_in_blank
    PROMPTS only -- never in an exercise's own tested_text, so it does not
    require re-declaration in this file's introduced_tokens (confirmed by
    reading validate_untaught_vocabulary in scripts/compile_content.py:
    only exercises' tested_text is checked against the accumulated taught
    set, never prompt.target_blocks text) -- included purely to give each
    fill_in_blank/grammar_check a natural target-language anchor for WHICH
    gendered form is correct, on top of the English instruction already
    saying so, rather than leaving a bare blank that could accept either
    gender ambiguously (the exact AUTHORING_GUIDE §17 failure mode, applied
    here to hand-authored lesson content, not just Endless Practice
    templates, since nothing in the compiler enforces this for hand-
    authored exercises -- so it was handled by construction instead).

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from earlier units (kino/w from unit08/09
    prepositions and unit11's own kino card, obiad from unit10, bardzo from
    units01/06/07/08/09/11, dobry from unit01's "Dzień dobry," jaki from
    unit02/03, a/ty from unit01/05/10, Cześć/Ewa/Marek from unit01/04) is
    re-declared via this file's OWN introduced_tokens before being tested
    in this file's own exercises -- the compiler validates untaught
    vocabulary per realization FILE, not per course, and token matching is
    case-folded (confirmed again by reading tokenize() in
    scripts/compile_content.py).

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02-11
    (.firecrawl/fsi-polish-fast.pdf / .txt), re-searched fresh for this
    unit's own topic (past-tense/recent-event material) rather than reused
    from a stale prior search. This unit's core grammar is unusually well
    source-confirmed: the source's own explicit "perfective past" section
    (cached .txt lines ~8351-8354) states the rule directly and gives the
    near-exact model sentence "Kupiłem/łam wczoraj pomidory w Hali
    Mirowskiej" (Yesterday I bought tomatoes at the market) -- the direct
    real-world precedent for this file's own "___ wczoraj w kinie"
    construction, gender-split the identical way (Kupiłem masc / Kupiłam
    fem); a full masculine/feminine/neuter past-tense paradigm table for
    "chorować" (cached .txt lines ~6570-6579: chorowałem/chorowałam,
    chorowałeś/chorowałaś, chorował/chorowała/chorowało) confirms the
    -em/-am first-person split pattern this file extends to być, zobaczyć,
    and zrobić are the same regular ending, not something invented for
    this file; "zrobiłam"/"zrobiłem" (I did/made) directly confirmed with
    a full perfective/imperfective aspect chart (cached .txt lines
    ~15650-15656: "zrobiłam I did ... zrobiłem"); "było" as the invariant
    past-tense form directly confirmed in a real Q&A exchange matching this
    file's own "Co było wczoraj?" construction almost verbatim (cached .txt
    lines ~9806-9808: "Czy wczoraj było przyjęcie w ambasadzie? Tak,
    wczoraj było duże przyjęcie... Wczoraj? Nie, nie było." -- Was there a
    party at the embassy yesterday? Yes, there was a big party... No, there
    wasn't); "byłem"/"byłam" (I was) directly confirmed twice in real
    sentences, once per gender (cached .txt line ~9928: "chora byłam," I
    was sick, feminine; cached .txt line ~11345: "Ja byłem świadkiem," I
    was a witness, masculine); "w kinie" (in/at the cinema, locative)
    directly confirmed verbatim (cached .txt line ~6932: "w kinie 'Wars'");
    "film" confirmed extensively as ordinary vocabulary, including the
    exact "dobry film" collocation this file's own dialogue uses (cached
    .txt line ~6912: "Doskonały film!" and line ~7695: "Stary ale dobry" --
    old but good, said of a film) and the "Czy warto iść na ten film?" /
    "Kiedy można zobaczyć ten film?" pattern (cached .txt lines ~6911,
    ~6931) confirming both "film" and the verb "zobaczyć" (to see, the
    perfective partner of widzieć -- cached .txt line ~8371 explicitly
    lists "zobaczyć and widzieć" as one of Polish's true-suppletive
    perfective/imperfective verb pairs) as real, everyday, jointly-used
    vocabulary.

    Honestly disclosed as NOT source-confirmed, freely authored by regular
    grammatical analogy (same standard as every prior unit's disclosed
