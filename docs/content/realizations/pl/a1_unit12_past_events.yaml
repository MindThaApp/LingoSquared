    Cross-checked against this file's own content per AUTHORING_GUIDE §11:
    the two concrete facts this unit's dialogue states (Ewa went to the
    cinema and saw a good movie; Marek made dinner) are each stated exactly
    once and never contradicted elsewhere in the file. Deliberately kept
    the earlier lessons' byłem/byłam, zobaczyłem/zobaczyłam,
    zrobiłem/zrobiłam teaching examples UNATTRIBUTED to either named
