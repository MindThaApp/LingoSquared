review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fourth Polish A2 unit, continuing from pl/a2_unit23_w_banku.yaml.
    Realizes universal.a2.health.attend_doctor_appointment -- confirmed
    against docs/content/universal_spine.yaml (line 760): can_do "Attend a
    basic doctor's appointment, describe a symptom in more detail, and
    understand simple treatment and follow-up instructions," prerequisites
    [universal.a1.health.describe_basic_problem,
    universal.a1.communication.basic_phone_contact]. The first is directly
    satisfied by this course's own pl/a1_unit16_health.yaml (which already
    taught boleć/boli/mnie/głowa/gardło/gorączka/chory); the phone-contact
    prerequisite has no dedicated pl unit yet, so per universal_spine.yaml's
    own "teach prerequisites concurrently" allowance this unit's scene is a
    genuine in-person appointment, not a phone call -- fully satisfies the
    can_do without depending on unbuilt phone-contact content, same
    resolution as unit21's own bureaucracy prerequisite gap.

    Scenario: Ewa (the same patient A1's unit16 already established having
    a headache) now visits Lekarz (a male doctor) with a sore throat that's
    lasted several days -- a direct A2-level extension of A1's "boli mnie
    głowa" single-fact statement into a fuller appointment with duration,
    severity, and real treatment instructions, per the spine's own "in more
    detail" wording.

    A2-level step-up from A1, deliberate and disclosed: (1) **od +
    genitive** for duration ("od trzech dni" -- for three days), this
    course's second genitive-government point after unit23's potrzebować.
    (2) **powinna / powinnam** (should), the modal verb of advice/
    obligation, in both its formal-address form (powinna pani, said BY the
    doctor TO Ewa) and its first-person form (powinnam, said BY Ewa about
    herself) -- a real new paradigm, not just one memorized form. (3) A
    genuine severity question-and-answer pair ("Jak bardzo boli?" / "Bardzo
    mnie boli."), serving the spine's explicit "including duration and
    severity" wording. (4) A real treatment instruction with a
    frequency phrase ("dwa razy dziennie" -- twice daily) and a follow-up
    instruction ("Proszę wrócić za tydzień" -- please come back in a
    week), both serving the spine's "understand simple treatment and
    follow-up instructions" requirement directly. Grepped introduced_tokens
    across pl/a1_unit01-20 and pl/a2_unit21-23 for powinna/powinnam/
    dziennie -- zero hits, confirming genuinely new material (od and
    genitive duration specifically continues, rather than repeats,
    unit23's genitive-government point).

    Source-access research: firecrawl still at 0/1,000 credits (same
    outage). The cached FSI Polish FAST text DOES have real doctor-adjacent
    content (lekarz: 27 hits, boli: 18 hits -- checked and disclosed
    already during today's research pass) but every instance is inside a
    single car-accident/emergency scene (shock, an unconscious patient,
    calling a consulate) -- a fundamentally different register and content
    shape from a routine appointment with duration/severity/treatment
    instructions. Not used as a scenario source for that reason (the
    emergency framing would misrepresent what this unit's spine outcome
    actually asks for); "lekarz"/"boli"/"potrzebuje lekarza" as bare words
    are standard modern Polish regardless of that source, not something
    unique to it. This unit's actual dialogue and vocabulary are authored
    from established modern Polish clinical-visit conventions, not adapted
    from the cached FSI scene.

    Same-speaker-distractor check: lesson03's dialogue has two speakers,
    Lekarz (4 lines) and Ewa (3 lines). Lekarz: "Dzień dobry! Co panią
    boli?" / "Czy ma pani gorączkę?" / "Powinna pani brać to lekarstwo dwa
    razy dziennie." / "Proszę wrócić za tydzień." Ewa: "Boli mnie gardło od
    trzech dni." / "Tak, mam. Bardzo mnie boli." / "Dziękuję. Kiedy
    powinnam wrócić?" Every exercise built from this dialogue was checked
    by hand -- no distractor restates the fact under test using the same
    speaker's other line (e.g. the exercise asking what Ewa's symptom is
    has her other two lines as distractors, and neither mentions the
    throat or the duration).

    Cross-checked per §11: the symptom (sore throat), its duration (three
    days), the fever confirmation (yes), the treatment (medicine twice
    daily), and the follow-up (return in a week) are each stated exactly
    once and never contradicted elsewhere in the file.

    Cross-file vocabulary note: every word this file's exercises test,
    including recap words (Dzień/dobry/Proszę/dziękuję/jest/mam/ma/Tak/Czy/
    kiedy/i/dwa/bardzo/to/pani/panią), is redeclared via this file's own
    lesson01 recap card, per the compiler's per-FILE untaught-vocabulary
    check -- including gardło/boli/mnie/gorączka, which pl/a1_unit16 taught
    but this new file must still redeclare. Pending fresh-context review
    per AUTHORING_GUIDE §9; not self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist): (1)
    false-grammar -- the three grammar_check prompts presented CORRECT
    Polish as errors ("Gardło boli mnie.", "Od trzech dni gardło mnie
    boli.", "Za tydzień proszę wrócić." are all grammatical; Polish order
    is free here): replaced with genuine errors -- lesson01.exercise08 ->
    "Boli ja gardło." (pronoun case), lesson02.exercise07 -> "Boli mnie
    gardło od trzy dni." (od + genitive), lesson03.exercise09 -> "Proszę
    wrócić od tydzień." (za vs od); overlay instructions/feedback
    rewritten to match and natural alternative orders (Gardło mnie
    boli..., Od trzech dni..., Za tydzień proszę wrócić) accepted. (2)
    comprehension-without-text -- lesson03.exercise04.comprehend_fever
    showed only the doctor's question, not Ewa's answer: added "Tak, mam.
    Bardzo mnie boli." block; lesson03.exercise05.read_follow_up showed
    only the question: added Ewa's question + "Proszę wrócić za tydzień."
    blocks. (3) missing-accepted-answer -- lesson02.exercise08 + Boli mnie
    bardzo; lesson02.exercise10/lesson03.exercise10 + Gardło mnie boli od
    trzech dni / Od trzech dni boli mnie gardło / Od trzech dni gardło
    mnie boli; lesson02.exercise09 + Pani powinna brać... (4)
    underdetermined-prompt -- lesson02.exercise09 pinned to
    formal-to-a-woman (powinna pani), lesson03.exercise11 pinned "as Ewa"
    (powinnam vs powinienem). NATIVE CHECK: none.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

