  notes: >-
    Fourteenth Polish B1 unit, continuing from pl/b1_unit13_umiejetnosci.
    yaml. Realizes universal.b1.debate.agree_disagree_with_reasons
    (docs/content/universal_spine.yaml: "State agreement or disagreement
    with someone else's stated opinion and support your own position with
    a reason, using a subordinate that-clause to report or reference the
    other person's view").

    Grammar step-up, deliberate and disclosed: "zgadzam się / nie zgadzam
    się z tym, że..." + a reason introduced by "bo" -- the "z tym, że..."
    frame is the subordinate that-clause that REPORTS the other person's
    stated opinion (not a fresh assertion of your own), which the outcome
    explicitly names. This is a genuinely different construction from
    this course's own unit02 (b1_unit02_dyskusja_z_niuansami.yaml, the
    concessive chociaż/mimo że/jednak nuance-debate outcome) -- unit02
    concedes a point before restating a position; this unit states a
    stance directly and grounds it in a that-clause referencing the
    other speaker's own words, with different topics from unit02 to avoid
    thematic overlap.

    Scenario: continues Ewa and Marek's established informal ty register.
    Two distinct everyday debate topics, deliberately NOT unit02's remote-
    work-vs-office debate: 1) social media (Marek: it wastes time; Ewa
    disagrees, citing staying in touch with friends), 2) cooking at home
    vs. eating out (Marek: cooking at home is better; Ewa agrees, citing
    cost). Lesson03's dialogue combines a disagreement and an agreement
    in one exchange, so both directions of the outcome are modelled
    together before the culminating lesson.

    Character canon check (item 6): grepped pl/b1_unit01-13 before
    writing. No new facts asserted about Marek's occupation (engineer,
    a1_unit17/b1_unit03/08/10) or Ewa's stated reasons (unit01); Kasia
    (unit05/10), the Konsultantka (unit07), the Kierowniczka (unit03),
    and unit13's Urzędniczka do not appear here. Ewa and Marek's informal
    ty register is unchanged.

    Same-speaker-distractor check (lesson03's 5-line dialogue, Marek 3
    lines / Ewa 2 lines): every exercise built from this dialogue was
    checked against every OTHER line either speaker says -- no distractor
    restates the fact under test using the same speaker's other line.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage, same as every prior pl B1 unit). No
    public-domain intermediate Polish course exists to adapt from.
    Authored from established modern Polish grammar/register conventions
    -- "zgadzać się/nie zgadzać się z tym, że..." + bo-reason is a
    standard, textbook-attested B1 Polish construction, double-checked
    against standard Polish reference grammar before writing any example
    sentence.

    Pending fresh-context review per AUTHORING_GUIDE #9; not
    self-certified.

