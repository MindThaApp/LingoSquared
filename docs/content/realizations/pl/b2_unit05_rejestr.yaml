            prompt: {target_blocks: [{text: Państwo, language_code: pl, direction: ltr}]}
          - content_key: pl.b2.unit05.lesson01.exercise02.listen_czy_maja_panstwo
            type: listen_select
            tested_text: "Czy mają Państwo czas?"
            media_asset_key: pl.b2.audio.rejestr.czy_maja_panstwo_czas.01
            prompt: {target_blocks: []}
          - content_key: pl.b2.unit05.lesson01.exercise03.match_pronouns
            type: matching_pairs
            tested_text: "ty Państwo Masz czas Czy mają Państwo czas Możesz pomóc Czy mogą Państwo pomóc wiadomość do ciebie"
            prompt: {target_blocks: []}
            pairs:
