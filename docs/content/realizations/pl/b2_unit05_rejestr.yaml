              - {left: "Czy mają Państwo czas?", right: "Do you have time? (formal)"}
              - {left: "Możesz pomóc?", right: "Can you help? (informal)"}
              - {left: "Czy mogą Państwo pomóc?", right: "Can you help? (formal)"}
