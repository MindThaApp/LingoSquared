generation_provenance:
  method: "ai_generated"
  authoring_system: "claude"
  human_reviewed: false
  notes: >-
    From-scratch generation, not adapted from a source. This is pl's fifth
    B2 unit (register -- adapting formality to the audience), the first
    unit of the second half of the tier. No adaptable upper-intermediate
    public-domain Polish source exists; built from established modern
    Polish grammar/discourse knowledge. Structural exemplar:
    docs/content/realizations/nl/b2_unit05_register.yaml, consulted ONLY
    for unit shape -- every Polish sentence below is authored fresh from
    Polish grammar; the formal-address device is genuinely Polish, not a
    translation of Dutch je/u. Character canon: grepped pl/b1_*.yaml and
    pl/b2_unit01-04.yaml before writing -- Marek (established inzynier)
    and Ewa (his established friend) continue their informal ty register;
    b1_unit03_spotkania_w_pracy already shows Marek code-switching to a
    FORMAL register in writing ("Szanowna Pani Kierowniczko, ... Z
    powazaniem, Marek."), confirming this unit's formal-register content
    is a natural extension of established behaviour, not a new invention.
    REGISTER SPECIAL CASE: like the nl exemplar, this unit DELIBERATELY
    teaches BOTH registers side by side -- informal ty (pronoun usually
    DROPPED, verb ending alone carries person) and formal Panstwo (the
    formal "you" used for an institution/office, invariant regardless of
    the addressee's gender -- this deliberately avoids the Pan/Pani
    gender-specific formal pronoun, which would require guessing an
    unknown reader's gender; Panstwo takes 3rd-person-plural verb forms).
    Each individual exercise keeps a single internally consistent
    register; the contrast lives across the exercise pairs, and the
    culminating exercise produces the SAME request in both.
    GENDER-AGREEMENT AUDIT (per explicit coordinator instruction after the
    01-04 review found this gap): every free 1st-person production item in
    this unit was checked. Polish marks grammatical gender ONLY in past
    tense, in the by-conditional, and in predicate adjectives following
    jestem/jestes -- NOT in present or future tense, and not in Panstwo's
    invariant 3rd-plural verb forms. This unit's request-negotiation
    content (masz, mozesz, moge, chce, mozemy, mogliby Panstwo, bylby
    mozliwe [impersonal, agrees with "to", not the speaker]) was
    deliberately built entirely from present/future/impersonal forms, so
    NO exercise in this unit requires a dual-gender accepted-answer split.
review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Fifth Polish B2 unit; first register unit. Targets the CEFR B2
    register outcome (universal.b2.register.adapt_formality_to_audience):
    adapt formality to the audience -- deliver the same content
    appropriately to a close friend versus an institution. Theme: one
    everyday request -- rescheduling an appointment -- rendered both ways
    across all six lessons. Lesson arc: L01 the ty<->Panstwo pronoun/verb
    shift (masz -> maja Panstwo, mozesz -> moga Panstwo); L02 greetings and
    closings (Czesc/Pozdrawiam vs Szanowni Panstwo / Z powazaniem / Laczę
    wyrazy szacunku); L03 directness -- informal direct question + proszę
    vs formal indirect Czy mogliby Panstwo / Czy byloby mozliwe, zeby; L04
    the actual request (przelozyc spotkanie) rendered informally and
    formally; L05 a reading requirement -- two messages, same content,
    different register, identify the audience of each; L06 the culminating
    production -- a Marek/Ewa dialogue for the listening requirement (judge
    whether the register fits the situation and what a mismatch would
    signal), a speaking task delivering the SAME request once to a friend
    and once to an office, a writing task rewriting the informal message as
    a formal one, and a culminating writing task producing the request in
    BOTH registers. Register: this unit teaches both; Marek and Ewa supply
    the informal side (their established informal ty), the institutional
    side is formal to an unnamed office (urzad). All vocabulary is
    introduced self-contained within this file (cumulative with units
    01-04, which precede this one in the course). No sibling-direction
    file (pl-en) was consulted.
    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    Realization: lesson05 exercise01-04 (reading_comprehension) -- prompt
    showed only the English question, never the two messages it asks about
    -> added both messages (labelled Message 1 / Message 2) as
    target_blocks before the question (comprehension-without-text).
    Overlay: missing accepted answers added (all valid for prompts that do
    not pin the frame): lesson01 exercise05 + Mają Państwo czas / Czy
    Państwo mają czas; exercise06 + Czy możesz pomóc; exercise07 + Mogą
    Państwo pomóc / Czy Państwo mogą pomóc; lesson03 exercise05 + Możesz
    to zrobić; exercise07 + Mogliby Państwo pomóc / Czy Państwo mogliby
    pomóc; lesson04 exercise05 + Możemy przełożyć spotkanie; exercise07 +
    W poniedziałek nie mogę; lesson05 exercise06 + Pasowałby przyszły
    tydzień / Czy pasowałby Państwu przyszły tydzień; lesson06 exercise04
    + Możesz przełożyć spotkanie. NATIVE CHECK: (a) 'Czy byłoby możliwe,
    żeby pomóc?' (lesson03, no object, żeby+infinitive) -- natural, or
    should it be e.g. 'Czy byłaby możliwość pomocy?'; (b) the claim that
    bare-nominative 'Cześć Ewa!' would 'sound slightly odd' (teach.ewo
    note) may overstate it -- it is common in casual speech; (c)
    'Pozdrawiam' glossed informal-neutral is also widely used in
    neutral/semi-formal e-mail.

course:
  realization_key: pl.b2
  target_language_first: true
  dialect: pl_PL_standard
  register_policy: >-
    This unit is the register unit: it deliberately teaches BOTH the
    informal ty register (pl's established lane default, pronoun usually
    dropped) and the formal Panstwo register, contrasting them. Each
    single exercise stays in one consistent register; the contrast is
    carried across exercise pairs and the culminating exercise. Informal:
    dropped ty + 2nd-singular verb (masz, mozesz), proszę. Formal:
    Panstwo + 3rd-plural verb (maja Panstwo, moga Panstwo, mogliby
    Panstwo), Szanowni Panstwo, Z powazaniem, Laczę wyrazy szacunku. Marek
    and Ewa keep the informal ty they use with each other in earlier
    units.

