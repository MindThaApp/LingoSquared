            target: {text: "Możesz pomóc?", language_code: pl, direction: ltr}
            introduced_tokens: [Możesz, pomóc]
          - content_key: pl.b2.unit05.lesson01.teach.czy_moga_panstwo_pomoc
            kind: phrase
            target: {text: "Czy mogą Państwo pomóc?", language_code: pl, direction: ltr}
            introduced_tokens: [mogą]
          - content_key: pl.b2.unit05.lesson01.teach.grammar_ty_panstwo
            kind: grammar_note
            target: {text: "Masz czas? Czy mają Państwo czas? Możesz pomóc? Czy mogą Państwo pomóc?", language_code: pl, direction: ltr}
            introduced_tokens: []
