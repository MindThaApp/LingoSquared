            target: {text: "ty", language_code: pl, direction: ltr}
            introduced_tokens: [ty, ciebie, do, piszę]
            example: {text: "Piszę do ciebie.", language_code: pl, direction: ltr}
          - content_key: pl.b2.unit05.lesson01.teach.panstwo
            kind: vocabulary
            target: {text: "Państwo", language_code: pl, direction: ltr}
