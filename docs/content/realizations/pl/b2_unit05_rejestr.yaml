          - content_key: pl.b2.unit05.lesson01.exercise04.order_masz_czas
            type: word_order
            tested_text: "Masz czas"
            prompt: {target_blocks: []}
            word_bank: [Masz, czas]
          - content_key: pl.b2.unit05.lesson01.exercise05.translate_czy_maja_panstwo
            type: translation
            tested_text: "Czy mają Państwo czas"
            prompt: {target_blocks: [{text: "Translate into Polish, formal (addressing the reader as Państwo): Do you have time?", language_code: en, direction: ltr}]}
          - content_key: pl.b2.unit05.lesson01.exercise06.translate_mozesz_pomoc
