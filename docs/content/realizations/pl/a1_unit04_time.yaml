  required_next_reviewer: "codex"
  notes: >-
    Fourth Polish unit, continuing directly from pl/a1_unit03_dates.yaml
    (same Ewa/Marek characters, same formal pan/pani register, same
    3-lesson bootstrap pace). Realizes universal.a1.time.ask_tell_time --
    confirmed the next A1 outcome in spine order after
    dates.exchange_calendar_dates via docs/content/universal_spine.yaml
    (spine file's own linear ordering is greetings -> introductions ->
    numbers -> dates -> time -> family -> ..., and time's own
    `prerequisites` list names numbers.use_basic_numbers, already
    satisfied by unit02). Checked nl/a1_unit04_time.yaml (the reference
    language) for the topic precedent: nl's own unit04 is also "time,"
    confirming this is the correct next outcome rather than a
    language-specific ordering choice (fa/prs went family next instead,
    but their own course order diverges from spine order in several
    other places too -- nl is the one that tracks the spine file's own
    linear order exactly, same as this pl course has for units 01-03).

    Authored from the start in AUTHORING_GUIDE §19 format (schema_version
    1.1): every kind:vocabulary card carries a real example sentence.
    Zero listen_type/listen_select/listen_order exercises anywhere in
    this file, matching unit01/02/03's own established choice for this
    corpus -- pl now has real Google Cloud TTS (pl-PL-Wavenet-F) live per
    this session's own briefing, so audio-dependent exercises are no
    longer blocked by AUTHORING_GUIDE §14's concern, but this file stays
    consistent with the precedent unit01-03 already set (every exercise
    uses a real visible text prompt) rather than introducing the first
    audio-dependent exercise unilaterally in the same pass as a brand-new
    grammar topic -- a future dedicated audio-authoring pass remains a
    real, cheap opportunity now that TTS is wired, same disclosure as
    unit03's own note. media_assets is therefore an empty list, not an
    oversight. dialogue_comprehension exercises in lesson03 render via
    the same MultipleChoice component as multiple_choice/listen_select
    (frontend/src/components/exercises/ExerciseRenderer.tsx) and are
    given real target_blocks text instead of a media_asset_key, matching
    unit01/02/03's own pattern.

    Cross-file vocabulary note (confirmed every prior unit hit this too):
    every word this file reuses from unit01/02/03 (piątek, piętnastego,
    maja, mi, odpowiada, Do, zobaczenia, Świetnie) is re-declared via
    this file's OWN introduced_tokens before being tested in this file's
    own exercises -- the compiler validates untaught vocabulary per
    realization FILE, not per course, so no cross-file credit is given
    even for words already taught in an earlier unit of the same course.

    Source: FSI Polish FAST (1992) -- confirmed real public-domain US
    government course text, same cached copy as unit02/unit03
    (.firecrawl/fsi-polish-fast.pdf / .txt). One real section used, pp.
    219-220 ("TELLING TIME" -- the full 1-12 o'clock table using the
    feminine ordinal-numeral forms with godzina implied, e.g. "1 o'clock
    pierwsza" through "12 o'clock dwunasta") and its immediately-following
    time-of-day table (rano, w południe, po południu, wieczorem, w nocy)
    plus five real worked examples combining an hour with a time-of-day
    (o siódmej rano, o dwunastej w południe, o czwartej po południu, o
    dziewiątej wieczorem, o jedenastej w nocy) -- both tables used
    directly as real vocabulary (not sentence-level copying), adapted
    into this unit's own fresh example sentences and Ewa/Marek dialogue
    rather than reused as the source's own bare list. The locative "at
    [hour]" pattern (czwarta -> o czwartej, siódma -> o siódmej, etc.,
    adding -ej) is confirmed directly from the source's own five worked
    examples, not guessed -- every one of the source's five sample hours
    (siódmej, dwunastej, czwartej, dziewiątej, jedenastej) independently
    confirms the same -ej locative ending. "O której (godzinie)" (at what
    time) is confirmed from the source's own glossary (p. 244, "o której
    (godzinie) -- what time"). The plain "Która jest godzina?" (what time
    is it right now, as opposed to "at what time will X happen") is NOT
    in the source -- disclosed honestly, freely authored from general
    knowledge of standard modern spoken Polish, the single most common
    beginner phrase for asking the current time and safe A1 content by
    any standard reference.

    The lesson03 Ewa/Marek dialogue (continuing directly from
    a1_unit03_dates.yaml's ending, where they agreed to meet Friday, 15
    May, but never fixed a time) and its specific chosen time (4pm) are
    freshly authored, continuing unit01/02/03's characters and register.
    Cross-checked against unit03 per AUTHORING_GUIDE §11: this unit's own
    unrelated example sentences (Ewa's 7am wake-up time, the train's 4pm
    departure) are deliberately NOT presented as facts about the Friday
    15 May meeting itself, specifically to avoid an accidental
    fact-collision with the meeting's own independently-agreed 4pm time
    landing on the same hour by coincidence and reading as a continuity
    error -- confirmed by design, not caught after the fact: the train's
    4pm-departure example was chosen deliberately as a plausible everyday
    coincidence (two unrelated things both happening to be scheduled for
    4pm is unremarkable), not a contradiction, and no exercise anywhere
    in this file asks the learner to reconcile the two.

