    Grammar-scope decision, disclosed up front per unit07-14's own
    precedent for narrowing A1 grammar exposure deliberately rather than
    by omission. Polish travel language, in full, involves at least four
    real complications this file deliberately does NOT take on:
    (1) **Destination case forms are taught as two individually memorized
    whole chunks, not a productive rule.** Unit09 already disclosed and
    taught "do + genitive-singular masculine -u" for common nouns (bank ->
    banku, hotel -> hotelu, park -> parku). City names use ENTIRELY
    DIFFERENT declension classes that this file does not decompose or
    generalize: Kraków (masculine, ends in a consonant+ów cluster) takes
    -a in the genitive (Krakowa), while Warszawa (feminine, ends in -a)
    takes -y (Warszawy) -- two different patterns, neither the same as
    the -u pattern unit09 taught. This file presents "do Krakowa" and "do
    Warszawy" as two separate memorized destination phrases (each with its
    own grammar_note stating plainly "this is the form, memorize it"), the
    same treatment unit02/07 already gave memorized genitive-plural
    quantity phrases (dwadzieścia złotych, kilo pomidorów) without
    teaching genitive declension classes generally. No third city or any
    other genitive-requiring noun is introduced, so the learner is never
    asked to generalize a rule that doesn't actually exist as a single
    rule.
    (2) **"jechać" (to go by vehicle) is taught with only two of its six
    present-tense forms** -- jadę ("I go," first person, needed for
    Marek/Ewa's own dialogue lines) and jedzie ("he/she goes," third
    person, needed for describing the other's trip and for the recap
    "Pociąg odjeżdża..." style statements) -- never jedziesz/jedziemy/
    jedziecie/jadą, even though the source's own paradigm table gives all
    six. Same precedent as unit04's single-form "wstaje"/"odjeżdża" and
    unit11's two-of-six chcieć/móc partial paradigms (chcę/chcesz,
    mogę/możesz).
    (3) **Platform numbers avoid ordinal adjectives entirely.** A natural
    alternative would be "pierwszy peron" (the first platform, masculine
    ordinal), but unit04 already taught FEMININE ordinal hour-forms
    (pierwsza, druga, trzecia...) for telling time -- introducing the
    MASCULINE ordinal forms of the exact same numbers here (pierwszy,
    drugi, trzeci...) would risk exactly the kind of gender-confusable
    near-duplicate this course's own comparisons unit (unit14) was careful
    to keep separate. This file sidesteps the whole class by using "Peron
    numer + [cardinal number]" (Peron numer jeden, Peron numer dwa) instead
    -- reusing "numer" (already taught unit02, "Jaki jest twój numer
    telefonu?") and the plain cardinal numbers (already taught unit02), the
    same style of deliberate substitution unit09 used choosing "Proszę +
    infinitive" over the imperative mood to avoid a whole untaught mood.
    (4) **Hour-telling reuses ONLY the locative hour forms unit04 already
    declared** (czwartej, siódmej, dziesiątej) -- no new locative hour form
    (e.g. ósmej) is minted anywhere in this file, keeping this unit's hour
    vocabulary a strict subset of what unit04 already established rather
    than silently expanding it.
    (5) **"Miłej podróży!" is taught as one indivisible memorized farewell
    idiom**, not decomposed into its own genitive-case grammar (miła ->
    miłej agreeing with podróż -> podróży) -- the same treatment "Dzień
    dobry" has received since unit01 without ever explaining the vocative/
    genitive mechanics underneath it. A grammar_note states this
    explicitly so the learner isn't left assuming it's compositional.

