review:
  status: "reviewed"
  required_next_reviewer: null
  notes: >-
    First Polish B1 unit -- pl had zero B1 content before this. Realizes
    universal.b1.hypotheticals.express_hypothetical_conditions_with_conditional
    (docs/content/universal_spine.yaml, "Express hypothetical or unreal
    situations and wishes using a conditional-mood construction ('would' +
    verb) together with an unreal 'if'-clause in a past/irrealis form, and
    use the conditional alone to soften a suggestion, request, or
    preference," prerequisites [universal.a1.preferences.express_preferences],
    satisfied by pl's existing A1 preferences content).

    Grammar step-up, deliberate and disclosed: this is the genuine CEFR B1
    hallmark for Polish, the "by" conditional clitic -- an L-participle
    (the same form used for past tense) plus the movable particle "by" plus
    a personal ending (chcia-l-by-m = chciałbym, "I would like," masculine).
    The unreal-condition conjunction "gdyby" (gdy + by, "if") is the same
    particle fused onto "gdy" (when), conjugated gdybym/gdybyś/gdyby/
    gdybyśmy/gdybyście/gdyby. This unit deliberately fixes the by-particle
    to the verb in every taught sentence (chciałbym, zostałbym,
    podróżowałbym) rather than teaching the equally-grammatical but more
    advanced movable-clitic word order (e.g. spoken "Co byś zrobił?"
    instead of "Co zrobiłbyś?") -- both are correct Polish, but a single
    consistent, predictable slot is the right B1 scaffold; the movable
    form is flagged as a natural spoken variant in one grammar_note but
    never required in any accepted_answers.

    Scenario: continues the established Ewa/Marek informal ty-register
    storyline from pl's A1-A2 units (Marek is the inżynier from unit17;
    Ewa is his established friend from unit22's opinions unit). Marek's
    own statements use masculine conditional forms throughout (chciałbym,
    zostałbym, pojechałbym); Ewa's own statements use feminine forms where
    she speaks about herself (zostałabym). Three concrete, everyday
    hypothetical scenarios, deliberately NOT a lottery-winning premise
    (avoiding the closest surface-level overlap with what a structure-only
    reference read of nl's own first B1 unit happened to use): more free
    time, changing careers, and moving to another city.

    Genitive/instrumental/locative case notes threaded through
    deliberately, per the standing instruction that Polish's case system
    should feature prominently at B1: "zostać + instrumental" (zostać
    nauczycielem, become a teacher, not accusative), "bliżej + genitive"
    (bliżej gór), "do + genitive" (do Krakowa), "w + locative" (w innym
    mieście), "Mam przyjaciół" (masculine-personal-plural accusative =
    genitive form, the same syncretism already seen in this course's own
    a2_unit26 "Mam pytania"/interview unit).

    Source-access research: per AUTHORING_GUIDE.md #10, checked firecrawl
    first -- confirmed still down (0/1000 credits, same standing outage
    noted in CLAUDE.md as of today). A follow-up check for a genuine
    FSI/Peace-Corps-equivalent INTERMEDIATE Polish course (the existing
    pl A1/A2 units draw on the FSI Polish FAST beginner course) found no
    such public-domain intermediate Polish volume -- same "no intermediate
    volume exists" outcome fa/nl's own first B1 units already hit and
    disclosed. Authored from established modern Polish grammar/register
    conventions, not adapted from any external source.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Marek 3 lines): every exercise built from this dialogue was
    checked by hand against every OTHER line either speaker says in the
    same dialogue -- no distractor restates the fact under test using the
    same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: Marek's stated destination
    (Kraków), his stated reason (closer to the mountains), and Ewa's
    stated reason for staying (her job and friends) are each stated
    exactly once and never contradicted elsewhere in the file.

    Cross-file vocabulary note: every word this file's exercises test,
    including basic recap words (ja/ty/mam/mieć/jestem/czas/praca/dom/
    dużo), is redeclared via this file's own lesson01 recap card, per the
    compiler's per-FILE untaught-vocabulary check -- this file does not
    rely on any other pl file having been compiled first. Pending
    fresh-context review per AUTHORING_GUIDE #9; not self-certified. FRESH-CONTEXT REVIEW COMPLETE 2026-07-11 per AUTHORING_GUIDE §20 (boolean type-walk, accepted_answers value-key shape, title length, spine-outcome existence, jargon/snake_case scan, register consistency, case agreement, bare-word MC and listening distractor ambiguity, character consistency vs the pl corpus) -- no learner-facing bugs found in this unit; status set to reviewed.

course:
