    Grammar-scope decision, disclosed up front per unit07-17's own precedent
    for narrowing A1 grammar exposure deliberately rather than by omission:
    (1) **"duży"/"mała" (big/small) are introduced as exactly two memorized
    adjective FORMS, not a paired masculine/feminine adjective set and not a
    general agreement rule.** "duży" (masculine) is taught tied to exactly one
    noun, "dom" ("Dom jest duży"); "mała" (feminine) is taught tied to exactly
    one different noun, "kuchnia" ("Kuchnia jest mała"). The feminine form of
    "duży" (duża) and the masculine form of "mały" (mały) are deliberately
    NEVER introduced or tested anywhere in this file, even though "duża" itself
    happens to appear in the cited FSI source text (in an unrelated sentence,
    "duża kuchnia") -- this file does not use that specific source sentence,
    precisely to keep the two adjective forms taught here down to exactly two,
    matching unit17's own "exactly two forms, memorized chunk, not a
    productive paradigm" precedent for its instrumental profession nouns.
    (2) **The locative case appears here for the fourth time in this course
    (after unit05's city names, unit10's time-of-day nouns, and unit17's
    workplace nouns), and is treated the same way each time: a small,
    disclosed, fixed set of whole-word "w + noun" forms tied to specific
    vocabulary, never a taught declension table.** Four new locative forms are
    introduced: "w pokoju," "w kuchni," "w sypialni," "w łazience" (plus the
    already-established "w domu," recapped from unit10's own "do domu"). No
    other case-taking preposition and no locative declension RULE (e.g. "soft
    stems take -i, hard stems take -e") is taught or stated anywhere in this
    file -- each form is presented as a memorized whole word, exactly like "w
    Warszawie"/"w Krakowie"/"w Gdańsku" (unit05), "w południe" (unit10), and
    "w szkole"/"w biurze" (unit17) all already were.
    (3) **"Ile pokoi masz? Mam dwa pokoje." is a disclosed, direct extension of
    unit02's already-taught "Ile" and unit02's cardinal numbers, using two new
    inflected forms of "pokój" ("pokoi," the genitive plural used after "ile";
    "pokoje," the plural used after "dwa") as memorized chunks tied to this one
    specific question-and-answer pair -- not a taught rule about how nouns
    change after numerals or quantifiers in general.** No other noun in this
    file is ever counted with "ile"/a numeral.
    (4) **"Mieć"/"mam"/"masz"/"ma" continue directly from unit05's own full
    introduction of this verb (mieć, mam, masz, ma) and are NOT treated as a
    new grammar point in kind** -- unlike the adjective/locative/quantity
    points above, "mam"/"masz"/"ma" are pervasively-established vocabulary
    being reused, flagged explicitly so it isn't mistaken for something new
    (matching unit17's own explicit flag for its reused "jest").
    (5) **Every noun in this file that follows "mam"/"ma" (mieć) is either
    masculine inanimate or neuter -- "dom," "mieszkanie," "pokój," "pokoje" --
    where the accusative form is always identical to the nominative form, so
    no new case ending is ever actually needed after "mieć" in this file.** No
    feminine noun (kuchnia, sypialnia, łazienka) is ever placed as the direct
    object of "mam"/"ma" anywhere in this file, specifically to avoid needing
    the feminine accusative -a -> -ę ending, which remains entirely untaught.
    Feminine nouns appear only as grammatical subjects (with "jest," nominative,
    e.g. "Kuchnia jest mała") or after the locative "w" (e.g. "w kuchni"),
    never as a direct object.
    (6) **No new adjective agreement beyond the two forms in point 1, no
    genitive beyond the two already-established memorized chunks (unit02's
    "Ile pokoi" and unit08's "obok/naprzeciwko/blisko + noun," both simply
    reused, not extended), no dative, no vocative, and no comparative/
    superlative appear anywhere in this file.**
    (7) **"Salon" (living room) is deliberately never introduced, per the
    weak-source-attestation note above** -- this unit teaches four rooms
    (pokój, kuchnia, sypialnia, łazienka) rather than five, judged sufficient
    real coverage of the spine outcome's "rooms" requirement without stretching
    to a thinly-attested fifth word.

