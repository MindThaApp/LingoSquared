    Source-access research (done first, per standing instruction): searched
    the already-cached FSI Polish FAST text (.firecrawl/fsi-polish-fast.txt,
    same cached copy as units02-15) fresh for this unit's own topic (health/
    symptoms) rather than reusing a stale prior search. Found a strong,
    directly usable source hit for the unit's central grammar point: the
    impersonal "X mnie boli" (X hurts me) construction, with an explicit
    LANGUAGE NOTE at cached line ~11429-11432 stating plainly: "When talking
    about where you are hurt, you don't have to say 'my head, my legs, etc.,
    hurt.' Just say: Głowa mnie boli, noga/nogi mnie bolą, etc... The verb
    boleć (to hurt) has only nos. 3 and 6" (i.e. only the on/ona/ono and
    oni/one forms exist at all -- not a simplification this file is making,
    a genuine grammatical fact about the verb). Concrete drilled examples at
    cached lines ~11454-11465 directly confirm "Głowa mnie bardzo boli"
    ("My head hurts badly"), "Ręka mnie boli" (hand), "Noga mnie boli" (leg),
    and the question form "Co pana/panią boli?" ("What hurts you?"). A
    separate drill at cached line ~16227/16329 confirms the plural form used
    with a body part directly: "___ mnie zęby" with the expected fill being
    "bolą" (teeth, plural, hence bolą not boli), and cached line ~11393
    confirms "czy coś panią boli?" (what hurts?) as a natural real phrase.
    "Źle się czuje" (feels bad, 3rd-person formal) is directly attested at
    cached line ~11191/11329 ("Czy pani źle się czuje?"), which this file's
    1st/2nd-person forms (czuję/czujesz) extend via the verb's own regular
    -uć conjugation pattern (czuję/czujesz/czuje/czujemy/czujecie/czują),
    not an invented form. "Mam" + accusative-transparent -a->-ę noun
    (mieć takes an accusative object) is the SAME pattern already taught
    and directly source-confirmed in pl/a1_unit05_family.yaml's own
    accusative_note ("Po 'mieć' rzeczownik zmienia końcówkę: brat -> brata,
    siostra -> siostrę, syn -> syna, córka -> córkę"), re-applied here to
    "gorączka -> gorączkę" (fever) by the identical -a->-ę feminine-noun
    rule, not a new grammar point. "chory"/"chora" (sick, masculine/
    feminine) is extremely well attested throughout the source (dozens of
    hits, e.g. cached line ~1387 "jest chory," line ~1955 "jest bardzo
    chora"). Honestly disclosed as NOT source-confirmed in this specific
    cached text: "gorączka" (fever) and "odpocząć" (to rest) do not appear
