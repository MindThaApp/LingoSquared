    common, transparent, everyday A1 words any Polish phrasebook covers,
    same treatment unit15 gave "peron" and "Miłej podróży." "pić" (to
    drink, infinitive) is not itself attested in this excerpt either but is
    ordinary, extremely common A1 vocabulary, freely authored with
    confidence.

    Grammar-scope decision, disclosed up front per unit07-15's own
    precedent for narrowing A1 grammar exposure deliberately rather than by
    omission:
    (1) **"Boleć" is taught with its full real paradigm, not a narrowed
    one** -- boli (3rd person singular) and bolą (3rd person plural) are
    the verb's ONLY forms in real Polish (confirmed directly by the source's
    own language note, see above); there is no 1st/2nd-person form to omit.
    This is the one piece of "partial paradigm" framing in this file that
    is actually a complete paradigm, not a scope-narrowing choice -- flagged
    explicitly so it isn't mistaken for one.
    (2) **"Czuć się" (to feel) is taught with only two of its six
    present-tense forms** -- czuję (się) ("I feel," needed for Ewa's own
    line) and czujesz (się) ("you feel," needed for Marek's question to
    her) -- never czuje/czujemy/czujecie/czują, even though the verb is a
    regular -uć conjugation and all six forms are trivially derivable. Same
    precedent as unit04's single-form "wstaje"/"odjeżdża" and unit15's own
    two-of-six jechać (jadę/jedzie). To avoid needing the 3rd-person form
    "czuje" at all (which this file deliberately does not introduce), the
    would-be narrator-style sentence "Ewa czuje się źle" is instead
    authored as a first-person dialogue line directly attributed to Ewa via
    the existing `target.speaker` field (lesson02.teach.ewa_line_preview,
    kind: dialogue) -- speaker attribution carries the "about Ewa" meaning
    structurally, with zero need for 3rd-person grammar.
    (3) **Adjective gender agreement (chory/chora) is explicitly framed as
    a REUSE of an already-taught pattern, not a new grammar point.**
    unit14's own comparatives (młodszy/starsza, lepszy/lepsza) already
    established that Polish adjectives take -y for a masculine subject and
    -a for a feminine one; this file's lesson02.teach.chory_chora card and
    its overlay note explicitly say so, rather than re-teaching gender
    agreement from scratch as if it were new.
    (4) **No Polish imperative mood is taught anywhere in this file.**
    Marek's health advice in lesson03 ("Proszę odpocząć i pić wodę") uses
    the same "Proszę + bezokolicznik" (please + infinitive) substitution
    unit09 established for direction-giving to a stranger and unit15 never
    needed to revisit. This is a deliberate, disclosed extension of that
    convention from a stranger-facing register (asking directions) to a
    friend-facing one (health advice between Ewa and Marek) -- "Proszę"
    reads naturally as gentle advice between friends in Polish too ("please
    rest" is not stiff the way English "please" can sometimes feel), so
    this is not treated as a register mismatch, but the extension itself is
    disclosed rather than silently assumed.
    (5) **Only the already-established feminine -a->-ę accusative pattern
    is used (gorączkę); no genitive, no locative, and no new case pattern
    is introduced anywhere in this file.** Unlike unit09/unit15 (which both
    needed a genitive destination form), this topic never requires it --
    "Mam gorączkę" (I have a fever) and "Boli mnie gardło" (my throat
    hurts) both stay within case patterns this course has already taught
    (mieć + accusative from unit05; the impersonal boleć construction,
    which takes no case-marked noun object at all -- the body part stays
    nominative and only the person pronoun, mnie/cię, changes).
    (6) **"Zęby" (teeth) is taught as the bare plural noun, matching how a
    real Pole would say it** -- "ząb" (singular "tooth") is never
    introduced, since the natural phrase is always the plural "Zęby mnie
    bolą" (my teeth hurt), exactly as the source's own drill uses it. This
    mirrors unit02/07's precedent of teaching a memorized plural quantity
    form without generalizing the underlying singular/plural declension
    rule.

