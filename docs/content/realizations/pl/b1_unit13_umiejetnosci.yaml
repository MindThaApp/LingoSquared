review:
  status: "reviewed"
  required_next_reviewer: "native_speaker_pass"
  notes: >-
    Thirteenth Polish B1 unit, continuing from pl/b1_unit12_obowiazki.yaml.
    Realizes universal.b1.abilities.express_ability_with_embedded_clause
    (docs/content/universal_spine.yaml: "Express what you can or could do
    using a modal-plus-embedded-clause construction (not just a bare modal
    + verb), across everyday and administrative topics such as errands,
    permissions, and appointments, and contrast present ability with
    past/hypothetical ability").

    Grammar step-up, deliberate and disclosed: "móc" (can/be able to) +
    "że"-clause EMBEDS a full subordinate statement rather than a bare
    modal+verb ("Mogę powiedzieć, że termin jest wolny" -- I can say THAT
    the appointment is free, not just "mogę pomóc" bare-modal). The
    embedded clause can also be a "czy" (whether) question ("Czy może pani
    powiedzieć, czy termin jest wolny?"). Present ability (mogę) is
    contrasted against past ability (mogłam/mogłem -- simple past, "could")
    and hypothetical/conditional ability (mogłabym/mógłbym -- "could" in
    the sense of "would be able to"), per the outcome's own explicit
    present-vs-past/hypothetical contrast requirement.

    Scenario: a genuinely new administrative-errand setting, an
    appointment-rescheduling call to an urząd (public office). Ewa is the
    caller; Urzędniczka (a clerk, a NEW one-off character, female,
    role-title-as-name per this course's own a2_unit21/a2_unit26 and
    b1_unit03/07 convention) is the office worker she speaks with. Formal
    Pan/Pani register both directions throughout, a deliberate register
    SHIFT from Ewa-and-Marek's established informal ty (same kind of
    shift this course's own unit03 and unit07 already made for
    institutional characters) -- Marek does not appear in this unit at
    all, so nothing here touches his established facts.

    Character canon check (item 6): grepped pl/b1_unit01-12 before
    writing. Ewa's established reasons for staying (job and friends,
    unit01) are not touched; no fact is asserted about Marek, Kasia
    (unit05/10), the Konsultantka (unit07), or the Kierowniczka (unit03).
    Urzędniczka is a fresh, self-contained one-off character who does not
    reappear from or contradict any prior file.

    Gender agreement note (checklist rule #6): past/conditional
    ability forms inflect for gender (mogłam/mogłem, mogłabym/mógłbym).
    Every such form here is fixed to the Urzędniczka's established gender
    (female: mogłam, mogłabym) throughout this file; the one place the
    LEARNER produces a first-person past/conditional-ability form
    (lesson04's culminating writing_prompt), the overlay's accepted_
    answers include BOTH the feminine and masculine variant, verified
    grammatically valid for that exact sentence before including it.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Ewa 3
    lines / Urzędniczka 3 lines): every exercise built from this dialogue
    was checked against every OTHER line either speaker says -- no
    distractor restates the fact under test using the same speaker's
    other line.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage, same as every prior pl B1 unit). No
    public-domain intermediate Polish course exists to adapt from.
    Authored from established modern Polish grammar/register conventions
    -- the móc+że embedded-clause construction and the present/past/
    conditional ability contrast are standard, textbook-attested B1
    Polish constructions, double-checked against standard Polish
    reference grammar before writing any example sentence.

    Pending fresh-context review per AUTHORING_GUIDE #9; not
    self-certified.

    Fresh-context review 2026-10-17 (content-reviewer.md checklist):
    false-grammar/gloss: teach.moge_note and lesson04.teach.review_note
    -- '"Móc" + że-clause' implied móc itself governs the że-clause ->
    now 'Móc + infinitive (bezokolicznik) + że/czy-clause' (realization
    text and overlay gloss/title). underdetermined-prompt:
    lesson02.exercise09 -- 'If you gave your number, I could call back'
    accepted only the pani/mogłabym form -> instruction pinned 'as the
    female clerk speaking formally to a woman (pani)'.
    missing-accepted-answer: lesson02.exercise08,
    lesson04.exercise07/exercise09 -- added 'jeszcze nie mogłam/mogłem'
    order (and mogłem for the speak item, speaker unpinned);
    lesson03.exercise10 -- added answers without 'Chwileczkę...' ('Tak,
    mogę powiedzieć...' / 'Mogę powiedzieć...'); lesson03.exercise11 --
    added 'Mógłbym ...' (speaker unpinned). other (incoherent prompt):
    lesson04.exercise08 -- 'Jaki jest Pani termin w urzędzie?' ('What is
    your appointment?') cannot be answered by 'Mogę powiedzieć, że
    termin jest wolny w poniedziałek' -> prompt now 'Czy termin w
    urzędzie jest jeszcze wolny?' with matching instruction; added 'Tak,
    ...' variant. NATIVE CHECK: none.

    Coordinator sweep 2026-10-17 (same review): 7 multiple_choice select_*
    exercises had prompt.target_blocks equal to the correct option; the
    compiler renders target_blocks as visible prompt text_blocks above the
    options, so the answer was printed in the prompt -> target_blocks
    emptied (the English instruction carries the cue). Same fix the u04-06
    reviewer made; comprehension/answer-giveaway class.

