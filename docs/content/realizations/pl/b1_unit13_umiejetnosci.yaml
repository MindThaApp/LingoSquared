            target: {text: "\"Móc\" + bezokolicznik + zdanie podrzędne z \"że\" -- to nie tylko \"mogę pomóc\" (goły modal), ale cały zagnieżdżony fakt: Mogę powiedzieć, że termin jest wolny (I can say THAT the appointment is free).", language_code: pl, direction: ltr}
