  notes: >-
    Tenth Polish B1 unit, continuing from pl/b1_unit09_plany.yaml. Realizes
    universal.b1.communication.summarize_and_retell (docs/content/
    universal_spine.yaml: "Summarize and retell in your own words -- give
    the main points of a short article, conversation, film, or event in a
    condensed, ordered form, distinguishing main points from detail").

    Grammar/discourse step-up, deliberate and disclosed: three summary-
    marking connectors -- "w skrócie" (in short), "chodzi o to, że" (the
    point is that), and "najważniejsze jest, że" (the most important thing
    is that) -- each introducing a condensed main point AFTER a longer
    passage full of detail, which is exactly the discourse skill this
    outcome names (distinguishing main points from detail, not a new verb
    tense). Register: informal ty, continuing Ewa and Marek's established
    private-conversation register.

    Scenario: Kasia (the mutual friend established in b1_unit05_mowa_
    zalezna.yaml, there stated to be moving to Kraków) has changed jobs
    because of that move. This is a DELIBERATE, disclosed continuity
    callback, not a fresh unrelated fact -- Kasia's job change is framed
    as caused by her already-established relocation, so nothing here
    contradicts unit05; it extends it. Ewa retells Kasia's job-search
    story to Marek with full detail (how long she searched, how many
    applications, how many interviews), then both compress it to its main
    point using the unit's three connectors -- modelling exactly the
    "give the main points ... distinguishing main points from detail"
    skill for the learner.

    Character canon check (item 6): grepped pl/b1_unit01-09 before
    writing. Kasia's ONLY established fact (moving to Krakow, unit05) is
    reaffirmed, not contradicted -- this file adds a job-change reason
    that follows from it, never restates or alters unit05's own wording.
    Marek's occupation and Ewa's stated reasons (unit01/03/08) are not
    touched. Ewa and Marek's informal ty register is unchanged.

    Source-access research: firecrawl still confirmed down (0/1000
    credits, standing outage, same as every prior pl B1 unit). No public-
    domain intermediate Polish course exists to adapt from. Authored from
    established modern Polish grammar/register conventions -- case
    government after szukać (+ genitive), numeral-governed case agreement
    (piętnaście podań = genitive plural after 15; cztery rozmowy
    kwalifikacyjne = nominative plural after 2-4) double-checked against
    standard Polish reference grammar before writing any example sentence.

    Same-speaker-distractor check (lesson03's 6-line dialogue, Marek 3
    lines / Ewa 3 lines): every exercise built from this dialogue was
    checked against every OTHER line either speaker says -- no distractor
    restates the fact under test using the same speaker's other line.

    Cross-checked per AUTHORING_GUIDE.md #11: Kasia's job-search timeline
    (two months, fifteen applications, four interviews), her new job (a
    big company downtown), and her start date (next month) are each
    stated exactly once and never contradicted elsewhere in the file.

    Gender agreement note: every production form here describing Kasia
    (zmienia, dostała, zaczyna, znalazła) is fixed to HER established
    gender (feminine), and every construction the LEARNER produces about
    themselves (chodzi o to że, najważniejsze jest że, w skrócie) is a
    gender-invariant connector or infinitive/present-tense form -- no
    first-person past tense is required of the learner anywhere in this
    file, so no masculine/feminine production variant is needed.
    Confirmed by checking every production exercise's tested construction
    against this rule before writing the overlay.

    Culminating exercise (lesson04, checklist item 7): the outcome's
    can_do requires giving "the main points ... in a condensed, ordered
    form, distinguishing main points from detail." lesson04 teaches the
    full detailed passage as a kind:reading card, then its writing_prompt
    exercise requires the learner to write an actual condensed SUMMARY of
    it (using w skrócie/chodzi o to że) that keeps only the main points
    and omits the specific numbers -- not just recognizing or drilling
    the connector words in isolation.

    Cross-file vocabulary note: this file recaps its own basic words
    (jest, mam, dobry) via lesson01's recap card, per the compiler's
    per-FILE untaught-vocabulary check -- does not rely on any other pl
    file having been compiled first (including b1_unit05, whose Kasia
    fact is fully re-taught here from scratch). Pending fresh-context
    review per AUTHORING_GUIDE #9; not self-certified.

