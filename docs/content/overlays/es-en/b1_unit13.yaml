teaching:
  en.b1.unit13.lesson01.teach.who:
    title: who
    gloss: quien, que (para personas)
    note: '*who* se refiere a una persona dentro de una oración de relativo.'
    example_gloss: Daniel, que entró al equipo en marzo, ya dirige dos proyectos.
  en.b1.unit13.lesson01.teach.which:
    title: which
    gloss: que, el cual (para cosas)
    note: '*which* se refiere a una cosa dentro de una oración de relativo.'
    example_gloss: El curso de diseño que eligió Leila empieza en junio.
  en.b1.unit13.lesson01.teach.that_relative:
    title: that
    gloss: que (especificativa)
    note: '*that* se refiere a una persona o una cosa dentro de una oración de relativo especificativa.'
    example_gloss: El cliente que llamó esta mañana quiere una reunión.
  en.b1.unit13.lesson01.teach.whose:
    title: whose
    gloss: cuyo, cuya
    note: '*whose* indica posesión dentro de una oración de relativo.'
    example_gloss: El cliente cuyo proyecto están terminando ya aprobó el diseño.
  en.b1.unit13.lesson01.teach.where:
    title: where
    gloss: donde
    note: '*where* se refiere a un lugar dentro de una oración de relativo.'
    example_gloss: La oficina donde trabaja Daniel está en el centro.
  en.b1.unit13.lesson01.teach.coworker:
    title: coworker
    gloss: compañero o compañera de trabajo
    note: '*coworker* es alguien con quien trabajas.'
    example_gloss: Mia tiene una compañera que estudia español por las tardes.
  en.b1.unit13.lesson02.teach.colleague_organized:
    title: who en la oración de relativo especificativa
    gloss: La compañera que se sienta junto a Mia es muy organizada.
    note: '*who* introduce aquí un dato necesario para saber de quién se habla.'
  en.b1.unit13.lesson02.teach.daniel_leads_projects:
    title: who en la oración de relativo explicativa
    gloss: Daniel, que entró al equipo en marzo, ya dirige dos proyectos.
    note: Las comas indican que la oración de relativo solo añade información extra, que no hace falta para identificar a la persona.
  en.b1.unit13.lesson02.teach.grammar_defining:
    title: Oraciones de relativo especificativas y explicativas
    gloss: 'Usa una oración de relativo especificativa, sin comas, para decir exactamente a quién o qué te refieres: The colleague who sits next to Mia is organized. Usa una explicativa, con comas, para añadir información extra sobre alguien que ya se conoce: Daniel, who joined in March, already leads two projects. En español también hay esta diferencia (con comas o sin ellas), pero en inglés es más estricta: no se puede usar *that* en la oración con comas.'
    note: 'Forma: especificativa = sin comas, dice a quién o qué se refiere; explicativa = con comas, añade información extra.'
  en.b1.unit13.lesson03.teach.deadline:
    title: deadline
    gloss: fecha límite, plazo
    note: '*deadline* es la fecha o la hora en que algo tiene que estar terminado.'
    example_gloss: La compañera que se sienta junto a Mia siempre cumple sus plazos.
  en.b1.unit13.lesson03.teach.approve:
    title: approve
    gloss: aprobar
    note: '*approve* significa aceptar algo de manera oficial.'
    example_gloss: El cliente ya aprobó el primer diseño.
  en.b1.unit13.lesson03.teach.reading_passage:
    title: 'Lectura: la nueva oficina'
    gloss: Mia trabaja con varias personas que le hacen el trabajo más fácil. Daniel, que entró al equipo en marzo, ya dirige dos proyectos. La compañera que se sienta junto a Mia es muy organizada y siempre cumple sus plazos. Su oficina, que está en el quinto piso, tiene una cocina pequeña donde todos almuerzan juntos. El cliente cuyo proyecto están terminando ya aprobó el primer diseño.
    note: Un texto corto con oraciones de relativo especificativas y explicativas.
  en.b1.unit13.lesson04.teach.q_met_the_woman:
    title: Mia presenta a la nueva compañera
    gloss: 'Mia dice: Leila, ¿ya conociste a la mujer que acaba de entrar a nuestro equipo?'
    note: '*who* se refiere aquí a *the woman*.'
  en.b1.unit13.lesson04.teach.a_whose_desk:
    title: Leila pregunta por el sitio de la nueva compañera
    gloss: 'Leila dice: Todavía no. ¿Es la persona cuyo escritorio está junto a la ventana?'
    note: '*whose* indica posesión: *whose desk*.'
  en.b1.unit13.lesson04.teach.q_the_designer_who:
    title: Mia describe a la nueva compañera
    gloss: 'Mia dice: Sí, es ella. Es la diseñadora que terminó el proyecto del logotipo.'
    note: '*who* se refiere a *the designer*.'
  en.b1.unit13.lesson04.teach.a_which_won_award:
    title: Leila recuerda el proyecto
    gloss: 'Leila dice: Ah, ya me acuerdo. ¿Es ese el proyecto que ganó el premio el mes pasado?'
    note: '*which* se refiere a *the project*.'
  en.b1.unit13.lesson04.teach.q_office_smaller:
    title: Mia habla de su antigua oficina
    gloss: 'Mia dice: Exacto. La oficina donde ella trabajaba antes era mucho más pequeña que la nuestra.'
    note: '*where* se refiere a un lugar: *the office*.'
  en.b1.unit13.lesson04.teach.a_kitchen_where:
    title: Leila entiende por qué le gusta la cocina
    gloss: 'Leila dice: Eso explica por qué le encanta la cocina donde todos almuerzan juntos.'
    note: '*where* se refiere a *the kitchen*.'
