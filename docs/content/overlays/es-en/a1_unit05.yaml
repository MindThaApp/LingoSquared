teaching:
  en.a1.unit05.lesson01.teach.what_time:
    title: What time is it?
    gloss: ¿Qué hora es?
    note: '*What time is it?* pregunta por la hora de forma general.'
  en.a1.unit05.lesson01.teach.three_oclock:
    title: It's three o'clock.
    gloss: Son las tres.
    note: '*It''s three o''clock.* dice la hora en punto.'
  en.a1.unit05.lesson01.teach.half_past:
    title: It's half past three.
    gloss: Son las tres y media.
    note: En inglés se dice *half past three* («media pasadas las tres»), que significa 3:30, igual que «las tres y media». Fíjate en que el inglés usa la palabra *past* («pasadas») donde el español usa «y».
  en.a1.unit05.lesson01.teach.five_oclock:
    title: It's five o'clock.
    gloss: Son las cinco.
    note: '*It''s five o''clock.* dice la hora en punto, las 5:00.'
  en.a1.unit05.lesson02.teach.quarter_past:
    title: It's a quarter past three.
    gloss: Son las tres y cuarto.
    note: '*It''s a quarter past three.* significa 3:15.'
  en.a1.unit05.lesson02.teach.quarter_to:
    title: It's a quarter to four.
    gloss: Son las cuatro menos cuarto.
    note: '*It''s a quarter to four.* significa 3:45.'
  en.a1.unit05.lesson02.teach.ten_past:
    title: It's ten past four.
    gloss: Son las cuatro y diez.
    note: '*It''s ten past four.* significa 4:10.'
  en.a1.unit05.lesson02.teach.ten_to:
    title: It's ten to five.
    gloss: Son las cinco menos diez.
    note: '*It''s ten to five.* significa 4:50.'
  en.a1.unit05.lesson03.teach.morning:
    title: morning
    gloss: mañana (parte del día)
    note: '*morning* significa la mañana, aproximadamente de 6 a 12 horas.'
    example_gloss: ¡Buenos días, Daniel!
  en.a1.unit05.lesson03.teach.afternoon:
    title: afternoon
    gloss: tarde
    note: '*afternoon* significa la tarde, aproximadamente de 12 a 17 horas.'
    example_gloss: Trabajo por la tarde.
  en.a1.unit05.lesson03.teach.evening:
    title: evening
    gloss: atardecer; tarde-noche
    note: '*evening* es el final de la tarde y el comienzo de la noche, aproximadamente de 17 a 21 horas; los límites son difusos.'
    example_gloss: ¡Buenas noches, Leila!
  en.a1.unit05.lesson03.teach.night:
    title: night
    gloss: noche
    note: '*night* significa la noche, aproximadamente de 21 a 6 horas.'
    example_gloss: ¡Buenas noches, Daniel!
  en.a1.unit05.lesson03.teach.at_nine_am:
    title: The store opens at nine in the morning.
    gloss: La tienda abre a las nueve de la mañana.
    note: 'Delante de la hora se usa *at* en inglés, como «a las» en español: *at nine* (a las nueve).'
  en.a1.unit05.lesson03.teach.at_six_pm:
    title: The store closes at six in the evening.
    gloss: La tienda cierra a las seis de la tarde.
    note: En inglés, en el día a día se suele usar el formato de 12 horas con la parte del día (*six in the evening*); en español, para horarios oficiales se usa a menudo el formato de 24 horas (las dieciocho horas).
  en.a1.unit05.lesson04.teach.opens_at:
    title: opens at
    gloss: abre a las
    note: '*opens at* + hora significa «abre a las» + hora.'
    example_gloss: La biblioteca abre a las nueve.
  en.a1.unit05.lesson04.teach.closes_at:
    title: closes at
    gloss: cierra a las
    note: '*closes at* + hora significa «cierra a las» + hora.'
    example_gloss: La biblioteca cierra a las seis.
  en.a1.unit05.lesson04.teach.q_open:
    title: Daniel pregunta el horario de apertura
    gloss: 'Daniel: ¿A qué hora abre la biblioteca?'
    note: '*What time does ...?* pregunta por una hora exacta. En la pregunta aparece *does*, por eso se dice *open* sin -s.'
  en.a1.unit05.lesson04.teach.a_open:
    title: Respuesta sobre el horario de apertura
    gloss: 'Leila: Abre a las nueve de la mañana.'
    note: Una respuesta completa dice la hora exacta y la parte del día.
  en.a1.unit05.lesson04.teach.q_close:
    title: Preguntar la hora de cierre
    gloss: 'Daniel: ¿Y a qué hora cierra?'
    note: '*And* introduce la segunda pregunta de la misma conversación.'
  en.a1.unit05.lesson04.teach.a_close:
    title: Respuesta sobre la hora de cierre
    gloss: 'Leila: Cierra a las seis de la tarde.'
    note: Una respuesta completa dice también aquí la hora exacta.
  en.a1.unit05.lesson04.teach.closing:
    title: Terminar la conversación
    gloss: 'Daniel: ¡Genial, hasta las nueve!'
    note: '*See you at nine!* significa que os veréis a las nueve.'
