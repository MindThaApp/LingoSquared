  en.a1.unit64.lesson02.teach.that_is_nice:
    title: That is nice.
    gloss: Eso es muy agradable.
    note: '*That is nice* es una reacción positiva corta.'
  en.a1.unit64.lesson02.teach.you_look_great:
    title: You look great.
    gloss: Te ves genial.
    note: '*look* significa aquí verse o tener aspecto, no mirar.'
  en.a1.unit64.lesson02.teach.like_your_jacket:
    title: I like your jacket.
    gloss: Me gusta tu chaqueta.
    note: '*I like your...* es una forma normal de hacer un cumplido sobre algo de otra persona.'
  en.a1.unit64.lesson02.teach.lovely_smile:
    title: What a lovely smile.
    gloss: Qué sonrisa tan preciosa.
    note: '*What a...* se usa para hacer un cumplido en forma de exclamación.'
  en.a1.unit64.lesson02.teach.very_kind:
    title: That is very kind.
    gloss: Eso es muy amable.
    note: '*very* refuerza a *kind*.'
  en.a1.unit64.lesson02.teach.thank_you_much:
    title: Thank you very much.
    gloss: Muchas gracias.
    note: '*Thank you very much* es una frase de agradecimiento cortés y cálida.'
  en.a1.unit64.lesson03.teach.dialogue_line1:
    title: "Mia hace un cumplido"
    gloss: 'Mia dice: Hola, Leila. Hoy te ves genial.'
    note: '*You look great* es un cumplido directo.'
  en.a1.unit64.lesson03.teach.dialogue_line2:
    title: Leila da las gracias a Mia
    gloss: 'Leila dice: Gracias, Mia.'
    note: '*Thank you* significa gracias.'
  en.a1.unit64.lesson03.teach.dialogue_line3:
    title: Mia habla de la chaqueta verde
    gloss: 'Mia dice: Me gusta tu chaqueta verde.'
    note: '*I like your green jacket* es un cumplido sobre la ropa.'
  en.a1.unit64.lesson03.teach.dialogue_line4:
    title: Leila responde con amabilidad
    gloss: 'Leila dice: Eso es muy amable.'
    note: '*That is very kind* responde a algo bonito que alguien dice.'
  en.a1.unit64.lesson03.teach.dialogue_line5:
    title: Mia habla de la sonrisa
    gloss: 'Mia dice: ¡Y qué sonrisa tan preciosa tienes tú también! Mira, esta es mi foto.'
    note: '*too* significa aquí también.'
  en.a1.unit64.lesson03.teach.dialogue_line6:
    title: Leila elogia la foto
    gloss: 'Leila dice: Muchas gracias. Tu foto es bonita.'
    note: '*Your photo is nice* devuelve el cumplido.'
  en.a1.unit64.lesson03.teach.dialogue_line7:
    title: Mia explica la foto
    gloss: 'Mia dice: Gracias. Es para Daniel.'
    note: '*Thanks* es más corto que *thank you*.'
  en.a1.unit64.lesson04.teach.message:
    title: Mensaje amable
    gloss: 'Mensaje amable: Tu chaqueta verde es preciosa. Tu foto es bonita. Gracias por ser tan amable.'
    note: El mensaje hace dos cumplidos y da las gracias a alguien.
  en.a1.unit64.lesson04.teach.reading_passage:
    title: 'Texto: Un cumplido para una amiga'
    gloss: 'Un cumplido para una amiga: Mia vio a Leila con una chaqueta verde. Mia dijo que Leila se veía genial. También dijo que Leila tenía una sonrisa preciosa. Leila le dio las gracias a Mia. Luego Leila miró la foto de Mia y dijo que era bonita. Mia estaba contenta porque la foto era para Daniel. Más tarde, Leila escribió un mensaje corto: Tu chaqueta verde es preciosa.'
    note: '*looked great* es el pasado de *look great*.'
