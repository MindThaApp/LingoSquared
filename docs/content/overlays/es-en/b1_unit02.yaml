teaching:
  en.b1.unit02.lesson01.teach.be_able_to:
    title: be able to
    gloss: ser capaz de / poder
    note: '*be able to* significa tener la capacidad o la oportunidad de hacer algo.'
    example_gloss: Puedo renovar mi licencia de conducir por internet.
  en.b1.unit02.lesson01.teach.manage_to:
    title: manage to
    gloss: lograr hacer algo
    note: '*manage to* significa que algo sale bien, a menudo después de algo de esfuerzo.'
    example_gloss: Logré llenar el formulario en diez minutos.
  en.b1.unit02.lesson01.teach.renew:
    title: renew
    gloss: renovar
    note: '*renew* significa prolongar la vigencia de un documento antes de que venza.'
    example_gloss: Tengo que renovar mi licencia de conducir.
  en.b1.unit02.lesson01.teach.license:
    title: license
    gloss: licencia de conducir
    note: '*license* significa aquí el documento oficial que te permite conducir (abreviado de *driver''s license*). El inglés británico escribe el sustantivo *licence*.'
    example_gloss: Mi licencia de conducir vence este mes.
  en.b1.unit02.lesson01.teach.online:
    title: online
    gloss: en línea
    note: '*online* significa por internet, no en un lugar físico.'
    example_gloss: Ahora se puede renovar en línea.
  en.b1.unit02.lesson01.teach.in_person:
    title: in person
    gloss: en persona / presencialmente
    note: '*in person* significa ir uno mismo a un lugar, no hacerlo en línea.'
    example_gloss: El año pasado tuve que ir en persona.
  en.b1.unit02.lesson02.teach.am_able_to_renew_online:
    title: eine gegenwärtige Möglichkeit ausdrücken
    gloss: Ahora puedo renovar mi licencia de conducir en línea.
    note: '*I am able to* expresa una posibilidad en el presente.'
  en.b1.unit02.lesson02.teach.was_not_able_to_last_year:
    title: eine vergangene Möglichkeit verneinen
    gloss: El año pasado no pude hacerlo en línea.
    note: '*was not able to* expresa que en el pasado no existía esa posibilidad.'
  en.b1.unit02.lesson02.teach.managed_to_finish:
    title: sagen, dass etwas gelungen ist
    gloss: Logré llenar el formulario en diez minutos.
    note: '*managed to* subraya que algo salió bien, a menudo con esfuerzo.'
  en.b1.unit02.lesson02.teach.grammar_present_past:
    title: Gegenwart und Vergangenheit mit 'be able to'
    gloss: Puedo renovarla. Pude renovarla. Podría ayudarte.
    note: '*am able to* (ahora), *was able to* (pasado) y *would be able to* (hipotético o como ofrecimiento) son formas de la misma construcción.'
  en.b1.unit02.lesson03.teach.friend:
    title: friend
    gloss: amigo/amiga
    note: '*friend* significa amigo o amiga.'
    example_gloss: Mi amiga renovó su licencia de conducir la semana pasada.
  en.b1.unit02.lesson03.teach.system:
    title: system
    gloss: sistema
    note: '*system* significa una manera organizada de hacer algo.'
    example_gloss: El nuevo sistema es mucho más rápido.
  en.b1.unit02.lesson03.teach.reading_passage:
    title: 'Lesetext: das neue System'
    gloss: El año pasado la gente no podía renovar su licencia de conducir en línea. Todos tenían que ir a la oficina en persona. Este año el sistema cambió. Ahora la gente puede renovarlo todo desde casa. Mi amiga Mia pudo terminar el suyo en diez minutos.
    note: Un texto breve sobre cómo el nuevo sistema hace más fácil la renovación.
  en.b1.unit02.lesson04.teach.q_were_you_able:
    title: Leila fragt nach dem Führerschein
    gloss: 'Leila dice: ¿Pudiste renovar tu licencia de conducir en línea?'
    note: '*were you able to* pregunta por una posibilidad en el pasado.'
  en.b1.unit02.lesson04.teach.a_wasnt_able_office:
    title: 'Daniels Antwort: online ging es nicht'
    gloss: 'Daniel dice: No, no pude. Tuve que ir a la oficina en persona.'
    note: '*wasn''t able to* es la forma abreviada hablada de *was not able to*.'
  en.b1.unit02.lesson04.teach.q_really_managed:
    title: Leila erzählt von ihrer Erfahrung
    gloss: 'Leila dice: ¿En serio? Yo logré hacerlo en línea en diez minutos.'
    note: '*managed to* subraya que a Leila le salió rápido y sin problemas.'
  en.b1.unit02.lesson04.teach.a_next_time_save:
    title: Daniel denkt an nächstes Mal
    gloss: 'Daniel dice: La próxima vez podría ahorrar tiempo si también lo hiciera en línea.'
    note: Aquí *would be able to* expresa una posibilidad hipotética en el futuro.
  en.b1.unit02.lesson04.teach.q_would_help:
    title: Leila bietet Hilfe an
    gloss: 'Leila dice: La próxima vez podría ayudarte, si quieres.'
    note: Aquí *would be able to* se usa para un ofrecimiento cortés.
  en.b1.unit02.lesson04.teach.a_thanks:
    title: Daniel bedankt sich
    gloss: 'Daniel dice: Gracias, me encantaría.'
    note: '*I''d like that* es una forma natural de aceptar un ofrecimiento con agradecimiento.'
