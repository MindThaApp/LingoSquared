    note: '*menu* significa carta o menú.'
    example_gloss: ¿Podría ver la carta, por favor?
  en.a1.unit56.lesson01.teach.order:
    title: order
    gloss: pedir (en un restaurante)
    note: '*order* significa pedir (un plato o una bebida).'
    example_gloss: Quisiera pedir el pollo.
  en.a1.unit56.lesson01.teach.bill:
    title: bill
    gloss: cuenta
    note: '*bill* significa cuenta.'
