  en.a1.unit56.lesson02.teach.is_this_table_free:
    title: Is this table free?
    gloss: ¿Está libre esta mesa?
    note: Aquí, *free* significa libre u desocupada, igual que en español.
  en.a1.unit56.lesson02.teach.can_i_order_now:
    title: Can I order now?
    gloss: ¿Puedo pedir ya?
    note: '*Can I...?* es una forma directa de pedir algo, menos formal que *could*.'
  en.a1.unit56.lesson02.teach.id_like_the_salad:
    title: I'd like the salad, please.
    gloss: Quisiera la ensalada, por favor.
    note: '*I''d like* (contracción de *I would like*) es la forma cortés de pedir en un restaurante.'
  en.a1.unit56.lesson02.teach.how_much_is_the_salad:
    title: How much is the salad?
    gloss: ¿Cuánto cuesta la ensalada?
    note: '*How much is...?* pregunta por el precio.'
  en.a1.unit56.lesson02.teach.could_we_have_the_bill:
    title: Could we have the bill, please?
    gloss: ¿Nos trae la cuenta, por favor?
    note: '*Could we have...?* es la forma cortés de pedir algo. En español solemos usar el condicional o el presente (¿nos trae la cuenta?); en inglés, *could* es el equivalente natural y cortés.'
  en.a1.unit56.lesson02.teach.enjoy_your_meal:
    title: Enjoy your meal!
    gloss: ¡Buen provecho!
    note: '*Enjoy your meal!* es una expresión fija que dice el camarero antes de que empieces a comer. Literalmente significa disfruta de tu comida, pero en español decimos buen provecho, que está construido de otra manera. Aprende esta frase como un bloque, no palabra por palabra.'
  en.a1.unit56.lesson03.teach.dialogue_line1:
    title: Leila pregunta por la mesa
    gloss: 'Leila dice: ¡Hola! ¿Está libre esta mesa?'
    note: '*Is this table free?* usa *free* con el sentido de libre o desocupada.'
  en.a1.unit56.lesson03.teach.dialogue_line2:
    title: El camarero indica una mesa
    gloss: 'El camarero dice: Sí, siéntense aquí, por favor.'
    note: '*please sit here* es una invitación breve y cortés.'
  en.a1.unit56.lesson03.teach.dialogue_line3:
    title: Mia pide la carta
    gloss: 'Mia dice: ¿Podría ver la carta, por favor?'
    note: '*Could I see...?* usa de nuevo el *could* cortés, como en *could we have the bill*.'
  en.a1.unit56.lesson03.teach.dialogue_line4:
    title: El camarero trae la carta
    gloss: 'El camarero dice: Por supuesto, aquí tiene.'
    note: '*Of course, here you are* es una fórmula fija para entregar algo.'
  en.a1.unit56.lesson03.teach.dialogue_line5:
    title: El pedido de Leila
    gloss: 'Leila dice: Quisiera el pollo, por favor.'
    note: 'Un dato aparte: Leila pide pollo.'
  en.a1.unit56.lesson03.teach.dialogue_line6:
    title: El pedido de Mia
    gloss: 'Mia dice: Quisiera la ensalada, por favor.'
    note: 'Un dato aparte: Mia pide ensalada.'
  en.a1.unit56.lesson03.teach.dialogue_line7:
    title: El camarero desea buen provecho
    gloss: 'El camarero dice: ¡Buena elección! ¡Buen provecho!'
    note: '*Enjoy your meal!* es la frase fija de cierre antes de que los comensales empiecen a comer.'
  en.a1.unit56.lesson03.teach.dialogue_line8:
    title: Leila pregunta el precio del pollo
    gloss: 'Leila dice: ¿Cuánto cuesta el pollo?'
    note: '*How much is...?* pregunta por el precio.'
  en.a1.unit56.lesson03.teach.dialogue_line9:
    title: El precio del pollo
    gloss: 'El camarero dice: El pollo cuesta doce dólares.'
    note: 'Un dato aparte: el precio del pollo, independiente de la ensalada y de la cuenta total.'
  en.a1.unit56.lesson03.teach.dialogue_line10:
    title: Mia pregunta el precio de la ensalada
    gloss: 'Mia dice: ¿Cuánto cuesta la ensalada?'
    note: '*How much is...?* es la misma forma de pregunta que con el pollo.'
  en.a1.unit56.lesson03.teach.dialogue_line11:
    title: El precio de la ensalada
    gloss: 'El camarero dice: La ensalada cuesta siete dólares.'
    note: 'Un segundo dato aparte: el precio de la ensalada.'
  en.a1.unit56.lesson03.teach.dialogue_line12:
    title: "Leila pide la cuenta"
    gloss: 'Leila dice: ¿Nos trae la cuenta, por favor?'
    note: '*Could we have...?* usa de nuevo el *could* cortés.'
  en.a1.unit56.lesson03.teach.dialogue_line13:
    title: La cuenta total
    gloss: 'El camarero dice: Son diecinueve dólares, por favor.'
    note: 'Un tercer dato aparte: la cuenta total, distinta de los precios sueltos del pollo y la ensalada.'
  en.a1.unit56.lesson04.teach.restaurant_menu:
    title: Carta
    gloss: 'Carta del restaurante: Pollo - $12. Ensalada - $7. Pizza - $10. Zumo - $3.'
    note: La carta muestra cuatro platos con sus precios.
  en.a1.unit56.lesson04.teach.reading_passage:
    title: 'Texto: Una comida en el restaurante'
    gloss: Una noche, Leila y Mia decidieron probar un restaurante nuevo en el centro. Un camarero las acompañó a una mesa junto a la ventana. Les trajo una carta con pollo, ensalada, pizza y zumo. Leila pidió el pollo y Mia pidió la ensalada. El pollo costaba doce dólares y la ensalada, siete. Mientras comían, hablaron de la clase de fotografía de Mia. Cuando terminaron, el camarero trajo la cuenta. Eran diecinueve dólares entre las dos. Leila dijo que el restaurante era excelente, y Mia dijo que quiere traer a Daniel la próxima vez.
    note: '*ordered* es el pasado de *order* (pedir).'
