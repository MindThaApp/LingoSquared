teaching:
  en.b1.unit14.lesson01.teach.would_it_be_possible_to:
    title: would it be possible to
    gloss: ¿sería posible...?
    note: '*would it be possible to* pregunta con cortesía si algo se puede hacer.'
    example_gloss: ¿Sería posible mover la reunión al jueves?
  en.b1.unit14.lesson01.teach.i_was_wondering_if:
    title: I was wondering if
    gloss: me preguntaba si
    note: '*I was wondering if* hace que una petición sea más indirecta y cuidadosa.'
    example_gloss: Me preguntaba si podrías revisar mi informe hoy.
  en.b1.unit14.lesson01.teach.could_we_possibly:
    title: could we possibly
    gloss: ¿podríamos...?
    note: '*could we possibly* pide algo con cortesía, algo que harían juntos.'
    example_gloss: ¿Podríamos empezar la reunión cinco minutos más tarde?
  en.b1.unit14.lesson01.teach.i_would_appreciate_it_if:
    title: I would appreciate it if
    gloss: le agradecería que / te agradecería que
    note: '*I would appreciate it if* dice que agradecerías que alguien haga algo.'
    example_gloss: Te agradecería que enviaras pronto las notas.
  en.b1.unit14.lesson01.teach.agenda:
    title: agenda
    gloss: orden del día, agenda
    note: '*agenda* es una lista de temas que se van a tratar en una reunión.'
    example_gloss: Daniel agregó un punto más al orden del día.
  en.b1.unit14.lesson01.teach.follow_up:
    title: follow up
    gloss: dar seguimiento, volver a contactar
    note: '*follow up* significa volver a ponerse en contacto después de una reunión o de una tarea.'
    example_gloss: Mia dará seguimiento por correo después de la reunión.
  en.b1.unit14.lesson02.teach.move_meeting_thursday:
    title: would it be possible to + Verb
    gloss: ¿Sería posible mover la reunión al jueves?
    note: '*would it be possible to* + verbo base pregunta con cortesía por un cambio.'
  en.b1.unit14.lesson02.teach.review_report_today:
    title: I was wondering if + could
    gloss: Me preguntaba si podrías revisar mi informe hoy.
    note: '*I was wondering if you could* es una forma indirecta y cortés de pedir algo.'
  en.b1.unit14.lesson02.teach.grammar_softened_requests:
    title: Peticiones suavizadas en el trabajo
    gloss: 'En las peticiones formales en el trabajo, usa una forma de condicional suavizada como Would it be possible to... o I was wondering if... en lugar de una orden directa. Estas formas suenan más corteses que Move the meeting o Review my report. En español pasa algo parecido: «¿Sería posible...?» o «Me preguntaba si...» suenan más corteses que «Mueve la reunión».'
    note: 'Forma: usa una forma de condicional suavizada en lugar de una orden directa.'
  en.b1.unit14.lesson03.teach.budget_update:
    title: budget update
    gloss: actualización del presupuesto
    note: '*budget update* es un informe sobre cómo se está gastando el dinero.'
    example_gloss: Daniel preparó la actualización del presupuesto para la reunión.
  en.b1.unit14.lesson03.teach.afterward:
    title: afterward
    gloss: después, luego
    note: '*afterward* significa más tarde, después de otra cosa.'
    example_gloss: Podemos revisar las notas después.
  en.b1.unit14.lesson03.teach.reading_passage:
    title: 'Lectura: un mensaje antes de la reunión'
    gloss: Hola, Daniel, espero que estés bien. ¿Sería posible agregar la actualización del presupuesto al orden del día de la reunión de mañana? Te agradecería que trajeras las cifras más recientes. ¿Podríamos empezar diez minutos antes para tener tiempo para preguntas después? Gracias, Mia
    note: Un mensaje breve y profesional con peticiones suavizadas.
  en.b1.unit14.lesson04.teach.q_start_budget_update:
    title: La responsable del equipo abre la reunión con cortesía
    gloss: 'La jefa del equipo dice: Buenos días, Mia. ¿Sería posible empezar hoy con la actualización del presupuesto?'
    note: '*would it be possible to* pregunta con cortesía por el orden de la reunión.'
  en.b1.unit14.lesson04.teach.a_add_new_client:
    title: Mia hace una petición adicional
    gloss: 'Mia dice: Claro. Me preguntaba si también podríamos agregar al nuevo cliente al orden del día.'
    note: '*I was wondering if we could* es una forma indirecta y cortés de hacer una propuesta.'
  en.b1.unit14.lesson04.teach.q_keep_thirty_minutes:
    title: La responsable del equipo pide una reunión breve
    gloss: 'La jefa del equipo dice: Buena idea. ¿Podríamos mantener esta reunión por debajo de treinta minutos?'
    note: '*could we possibly* pide con cortesía algo que harán los dos juntos.'
  en.b1.unit14.lesson04.teach.a_questions_in_advance:
    title: Mia pide algo para la próxima vez
    gloss: 'Mia dice: Haré lo posible. Le agradecería que la próxima vez todos enviaran sus preguntas con anticipación.'
    note: '*I would appreciate it if* dice que algo se agradecería.'
  en.b1.unit14.lesson04.teach.q_fair_request_followup:
    title: La responsable del equipo acepta y promete hacer seguimiento
    gloss: 'La jefa del equipo dice: Es una petición razonable. Daré seguimiento con un recordatorio antes de la próxima reunión.'
    note: '*follow up* significa aquí volver sobre el tema más adelante.'
  en.b1.unit14.lesson04.teach.a_send_updated_agenda:
    title: Mia cierra con una confirmación
    gloss: 'Mia dice: Gracias. Enviaré el orden del día actualizado esta tarde.'
    note: Un cierre breve y cortés de la conversación.
