  en.a1.unit30.lesson03.teach.i_like_pattern:
    title: I like reading.
    gloss: Me gusta leer.
    note: '*I like* + un verbo en *-ing* se usa para decir que algo te gusta.'
  en.a1.unit30.lesson03.teach.dialogue_line1:
    title: La pregunta de Leila
    gloss: 'Leila pregunta: ¿Qué haces tú en tu tiempo libre, Daniel?'
    note: Leila empieza la conversación con una pregunta directa a Daniel.
  en.a1.unit30.lesson03.teach.dialogue_line2:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: A menudo salgo a correr. Y a veces cocino. ¿Y tú?'
    note: Daniel menciona dos pasatiempos con su frecuencia y devuelve la pregunta con *What about you?*
  en.a1.unit30.lesson03.teach.dialogue_line3:
    title: Leila habla de pintar
    gloss: 'Leila dice: Me encanta pintar. Pinto casi todos los fines de semana.'
    note: '*almost every weekend* significa casi todos los fines de semana.'
  en.a1.unit30.lesson03.teach.dialogue_line4:
    title: La siguiente pregunta de Daniel
    gloss: 'Daniel dice: ¡Qué bien! ¿Juegas alguna vez a videojuegos?'
    note: '*Do you ever...?* se usa para preguntar si alguien hace algo alguna vez.'
  en.a1.unit30.lesson03.teach.dialogue_line5:
    title: La última respuesta de Leila
    gloss: 'Leila dice: Casi nunca. Prefiero leer un libro.'
    note: '*I prefer...* significa: prefiero..., me gusta más...'
  en.a1.unit30.lesson04.teach.reading_passage:
    title: Texto sobre pasatiempos
    gloss: Daniel y Leila tienen pasatiempos distintos. Daniel siempre sale a correr los sábados por la mañana y a veces cocina para sus amigos. Leila nunca sale a correr, pero a menudo pinta los fines de semana. A los dos les gustan los videojuegos, pero casi nunca juegan juntos.
    note: Este texto compara directamente los pasatiempos de Daniel y Leila y con qué frecuencia los hacen.
