    title: sometimes
    gloss: a veces
    note: '*sometimes* significa a veces. En español puedes omitir el sujeto: A veces salgo a correr. En inglés el sujeto es obligatorio y va delante del verbo, aunque *sometimes* aparezca al principio: *Sometimes I go running*.'
  en.a1.unit30.lesson02.teach.rarely:
