  en.a1.unit30.lesson02.teach.often:
    title: often
    gloss: a menudo
    note: '*often* significa a menudo. Fíjate en el orden de las palabras en inglés: *She often cooks dinner* (sujeto, *often*, verbo). En español el adverbio es muy móvil (A menudo cocina ella la cena para su familia; Cocina a menudo la cena), pero en inglés suele colocarse entre el sujeto y el verbo.'
