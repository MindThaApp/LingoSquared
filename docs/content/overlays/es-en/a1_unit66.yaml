teaching:
  en.a1.unit66.lesson01.teach.symptom:
    title: symptom
    gloss: síntoma
    note: '*symptom* significa síntoma, algo que notas en tu cuerpo. La ortografía es distinta de «síntoma»: *symptom* se escribe con *y* y termina en *-om*, sin acento.'
    example_gloss: Esto es un síntoma.
  en.a1.unit66.lesson01.teach.cough:
    title: cough
    gloss: tos
    note: '*cough* significa tos. Se pronuncia *kof*; la *gh* suena aquí como *f*.'
    example_gloss: Tengo tos.
  en.a1.unit66.lesson01.teach.fever:
    title: fever
    gloss: fiebre
    note: '*fever* significa fiebre. Las dos palabras no se parecen en la escritura, así que apréndela como una palabra nueva.'
    example_gloss: ¿Tienes fiebre?
  en.a1.unit66.lesson01.teach.throat:
    title: throat
    gloss: garganta
    note: '*throat* significa garganta (la parte interior); para la parte exterior del cuello se dice *neck*.'
    example_gloss: Me duele la garganta.
  en.a1.unit66.lesson01.teach.headache:
    title: headache
    gloss: dolor de cabeza
    note: '*headache* significa dolor de cabeza (en inglés va en singular).'
    example_gloss: Tengo dolor de cabeza.
  en.a1.unit66.lesson01.teach.medicine:
    title: medicine
    gloss: medicamento
    note: '*medicine* significa medicamento o medicina. La palabra es incontable: *some medicine*.'
    example_gloss: Toma este medicamento.
  en.a1.unit66.lesson02.teach.have_cough:
    title: I have a cough.
    gloss: Tengo tos.
    note: En inglés dices *have a cough* con *a*; en español normalmente no hay artículo («Tengo tos»).
  en.a1.unit66.lesson02.teach.throat_hurts:
    title: My throat hurts.
    gloss: Me duele la garganta.
    note: '*hurts* significa «duele». En inglés el sujeto es la parte del cuerpo con *my* (*my throat hurts*); no existe el «me» del español de «me duele».'
  en.a1.unit66.lesson02.teach.have_headache:
    title: I have a headache.
    gloss: Tengo dolor de cabeza.
    note: En inglés dices *have a headache* con *a*; en español no suele haber artículo («Tengo dolor de cabeza»).
  en.a1.unit66.lesson02.teach.have_medicine:
    title: Do you have medicine?
    gloss: ¿Tiene algún medicamento?
    note: '*Do you have...?* pregunta si algo está disponible.'
  en.a1.unit66.lesson02.teach.with_water:
    title: Take this with water.
    gloss: Tome esto con agua.
    note: '*with water* va al final de la frase.'
  en.a1.unit66.lesson02.teach.ask_doctor:
    title: Please ask a doctor.
    gloss: Por favor, consulte a un médico.
    note: '*Please* hace que la frase sea cortés.'
  en.a1.unit66.lesson03.teach.dialogue_line1:
    title: Leila dice una molestia
    gloss: 'Leila dice: Hola. Tengo tos.'
    note: '*I have a cough* indica una molestia.'
  en.a1.unit66.lesson03.teach.dialogue_line2:
    title: El farmacéutico pregunta por la fiebre
    gloss: 'El farmacéutico dice: ¿Tiene fiebre?'
    note: '*Do you have a fever?* es una pregunta de sí o no.'
  en.a1.unit66.lesson03.teach.dialogue_line3:
    title: Leila no tiene fiebre
    gloss: 'Leila dice: No, no tengo fiebre. Me duele la garganta.'
    note: '*No, I do not have...* niega una molestia. En inglés se niega con *do not*, y el verbo *have* mantiene el artículo: *I do not have a fever*.'
  en.a1.unit66.lesson03.teach.dialogue_line4:
    title: El farmacéutico pregunta por el dolor de cabeza
    gloss: 'El farmacéutico dice: ¿Tiene dolor de cabeza?'
    note: '*headache* significa dolor de cabeza.'
  en.a1.unit66.lesson03.teach.dialogue_line5:
    title: Leila tiene dolor de cabeza
    gloss: 'Leila dice: Sí, tengo dolor de cabeza.'
    note: '*Yes* significa sí.'
  en.a1.unit66.lesson03.teach.dialogue_line6:
    title: Consejo del farmacéutico
    gloss: 'El farmacéutico dice: Tome este medicamento con agua. Por favor, consulte a un médico si se encuentra peor.'
    note: '*if you feel worse* significa «si se encuentra peor».'
  en.a1.unit66.lesson03.teach.dialogue_line7:
    title: Leila da las gracias
    gloss: 'Leila dice: Gracias.'
    note: '*Thank you* es la fórmula breve de agradecimiento.'
  en.a1.unit66.lesson04.teach.pharmacy_note:
    title: Nota de la farmacia
    gloss: 'Nota de la farmacia: Tos y dolor de garganta. Sin fiebre. Tomar el medicamento con agua. Consultar a un médico si empeora.'
    note: La nota indica las molestias y consejos sencillos.
  en.a1.unit66.lesson04.teach.reading_passage:
    title: 'Texto: Una visita a la farmacia'
    gloss: 'Una visita a la farmacia: Leila fue a la farmacia porque tenía tos y le dolía la garganta. El farmacéutico le preguntó si tenía fiebre. Leila dijo que no tenía fiebre, pero que tenía dolor de cabeza. El farmacéutico le dio un medicamento y le dijo que lo tomara con agua. La nota decía que consultara a un médico si se encontraba peor.'
    note: '*felt worse* es el pasado de *feel worse*.'
