teaching:
  en.a1.unit31.lesson01.teach.tall:
    title: tall
    gloss: alto, alta
    note: '*tall* significa alto (para la estatura de una persona).'
    example_gloss: Mi hermano es alto.
  en.a1.unit31.lesson01.teach.short:
    title: short
    gloss: bajo, baja
    note: '*short* significa aquí bajo (para una persona); *short* también significa «corto», por ejemplo hablando del pelo.'
    example_gloss: Mi hermana es baja.
  en.a1.unit31.lesson01.teach.hair:
    title: hair
    gloss: pelo, cabello
    note: '*hair* significa pelo. En inglés es incontable: *her hair is long*, no *her hairs are long*.'
    example_gloss: Ella tiene el pelo largo.
  en.a1.unit31.lesson01.teach.blond:
    title: blond
    gloss: rubio, rubia
    note: '*blond* significa rubio.'
    example_gloss: Su pelo es rubio.
  en.a1.unit31.lesson01.teach.curly:
    title: curly
    gloss: rizado
    note: '*curly* significa rizado.'
    example_gloss: Leila tiene el pelo rizado.
  en.a1.unit31.lesson02.teach.eyes:
    title: eyes
    gloss: ojos
    note: '*eyes* significa ojos (plural).'
    example_gloss: Tengo los ojos marrones.
  en.a1.unit31.lesson02.teach.blue:
    title: blue
    gloss: azul
    note: '*blue* significa azul.'
    example_gloss: Sus ojos son azules.
  en.a1.unit31.lesson02.teach.brown:
    title: brown
    gloss: marrón
    note: '*brown* significa marrón.'
    example_gloss: Mis ojos son marrones.
  en.a1.unit31.lesson02.teach.green:
    title: green
    gloss: verde
    note: '*green* significa verde.'
    example_gloss: Él tiene los ojos verdes.
  en.a1.unit31.lesson02.teach.glasses:
    title: glasses
    gloss: gafas
    note: '*glasses* significa gafas. La palabra va siempre en plural; *wears glasses* significa «lleva gafas».'
    example_gloss: Mi padre lleva gafas.
  en.a1.unit31.lesson02.teach.what_look_like:
    title: What does she look like?
    gloss: ¿Cómo es ella?
    note: 'Fíjate en la estructura: en español preguntamos «¿Cómo es ella?» con el verbo *ser*, sin auxiliar. En inglés, con un verbo normal (*look*) se necesita siempre *does* o *do*: *What does she look like?*, nunca *What looks she like?*. Olvidar el auxiliar *does* (la estructura con *do*) es el error más frecuente.'
  en.a1.unit31.lesson03.teach.dialogue_line1:
    title: Inicio de Leila
    gloss: 'Leila dice: Hoy empieza una compañera nueva. Se llama Mia.'
    note: '*starting today* significa «a partir de hoy».'
  en.a1.unit31.lesson03.teach.dialogue_line2:
    title: Pregunta de Daniel
    gloss: 'Daniel pregunta: ¿Cómo es?'
    note: 'Otra vez la estructura con *do*: no omitas *does* ni inviertas sujeto y verbo como en español.'
  en.a1.unit31.lesson03.teach.dialogue_line3:
    title: Descripción de Leila
    gloss: 'Leila dice: Es alta y tiene el pelo rizado y rubio.'
    note: '*She''s* es la forma abreviada de *she is*.'
  en.a1.unit31.lesson03.teach.dialogue_line4:
    title: Otra pregunta de Daniel
    gloss: 'Daniel pregunta: ¿Lleva gafas?'
    note: 'Aquí también necesitas la estructura con *do*: *Does she wear glasses?*, no *Wears she glasses?*.'
  en.a1.unit31.lesson03.teach.dialogue_line5:
    title: Respuesta de Leila
    gloss: 'Leila dice: Sí, las lleva. También tiene los ojos verdes.'
    note: '*Yes, she does* es una respuesta corta afirmativa en la que se repite el auxiliar *does*.'
  en.a1.unit31.lesson03.teach.dialogue_line6:
    title: Último comentario de Daniel
    gloss: 'Daniel dice: Vale, creo que ya la veo en la puerta.'
    note: '*at the door* significa «en la puerta».'
  en.a1.unit31.lesson04.teach.reading_passage:
    title: Texto sobre Daniel y Leila
    gloss: Daniel y Leila son buenos amigos, pero no se parecen físicamente. Daniel es alto y tiene el pelo corto y negro. Lleva gafas. Leila es baja y tiene el pelo largo, rizado y castaño. Ella tiene los ojos azules y Daniel los tiene marrones. A los dos les gusta reírse mucho.
    note: '*don''t look the same* significa «no se parecen / no tienen el mismo aspecto». También aquí necesitas la estructura con *do* (*don''t* = *do not*), incluso en negativa.'
