teaching:
  en.b1.unit11.lesson01.teach.would:
    title: would
    gloss: '(condicional: -ría)'
    note: '*would* + verbo base expresa un resultado imaginado o una preferencia cortés.'
    example_gloss: Me apuntaría si tuviera más tiempo.
  en.b1.unit11.lesson01.teach.would_rather:
    title: would rather
    gloss: preferir, tener más ganas de
    note: '*would rather* significa preferir hacer algo antes que otra cosa.'
    example_gloss: Preferiría ir al curso de fin de semana.
  en.b1.unit11.lesson01.teach.if_i_were:
    title: if I were
    gloss: si yo fuera / estuviera
    note: '*if I were* introduce una situación irreal sobre uno mismo.'
    example_gloss: Si estuviera libre esta noche, iría.
  en.b1.unit11.lesson01.teach.opportunity:
    title: opportunity
    gloss: oportunidad
    note: '*opportunity* es una buena ocasión para hacer algo.'
    example_gloss: Este curso es una buena oportunidad para Leila.
  en.b1.unit11.lesson01.teach.regret:
    title: regret
    gloss: arrepentimiento, pesar
    note: '*regret* es el pesar o el arrepentimiento por una decisión del pasado.'
    example_gloss: 'Hay algo que lamenta: no haber empezado a ahorrar antes.'
  en.b1.unit11.lesson01.teach.take_a_chance:
    title: take a chance
    gloss: arriesgarse, probar suerte
    note: '*take a chance* significa intentar algo aunque el éxito no sea seguro.'
    example_gloss: Si el curso fuera más barato, se arriesgaría.
  en.b1.unit11.lesson02.teach.more_time_course:
    title: Una situación irreal en el presente
    gloss: Si tuviera más tiempo, haría un curso de diseño.
    note: 'Para una situación irreal en el presente, después de *if* va el pasado simple: *If I had more time*. En español usamos el imperfecto de subjuntivo («si tuviera más tiempo»); en inglés no hace falta un modo especial, basta el pasado.'
  en.b1.unit11.lesson02.teach.cheaper_sign_up:
    title: if it were cheaper
    gloss: Si fuera más barato, me inscribiría hoy.
    note: En una condición irreal, *were* suena natural incluso con *it*.
  en.b1.unit11.lesson02.teach.grammar_unreal_present:
    title: Condiciones irreales en el presente
    gloss: Si fuera más barato, me inscribiría.
    note: 'Forma: *if* + pasado, y luego *would* + verbo base.'
  en.b1.unit11.lesson03.teach.sooner:
    title: sooner
    gloss: antes, más temprano
    note: '*sooner* significa antes del momento en que ocurrió realmente.'
    example_gloss: Si lo hubiera sabido antes, habría ahorrado más dinero.
  en.b1.unit11.lesson03.teach.confident:
    title: confident
    gloss: seguro de sí mismo, confiado
    note: '*confident* significa sentir que puedes hacer algo bien.'
    example_gloss: Si Daniel se apuntara, Leila se sentiría más segura.
  en.b1.unit11.lesson03.teach.reading_passage:
    title: 'Lectura: una oportunidad perdida'
    gloss: 'Leila encontró un curso de diseño que quiere hacer de verdad. Es útil, pero es caro. Si fuera más barato, se inscribiría hoy. Si Daniel también se apuntara a la clase, se sentiría más segura. Su único pesar es el momento: si hubiera sabido del curso antes, habría ahorrado más dinero.'
    note: Una lectura breve con situaciones irreales del presente y del pasado.
  en.b1.unit11.lesson04.teach.q_take_if_cheaper:
    title: Mia hace una pregunta hipotética
    gloss: 'Mia dice: Leila, ¿harías el curso de diseño si fuera más barato?'
    note: Una pregunta hipotética y cortés con *would*.
  en.b1.unit11.lesson04.teach.a_sign_up_today:
    title: Leila dice el resultado imaginado
    gloss: 'Leila dice: Por supuesto. Si fuera más barato, me inscribiría hoy.'
    note: '*If it were cheaper, I would...* describe lo que haría en otra situación.'
  en.b1.unit11.lesson04.teach.q_daniel_joined:
    title: Mia propone otro escenario
    gloss: 'Mia dice: ¿Y si Daniel también se apuntara?'
    note: '*What if...* introduce una posibilidad imaginada.'
  en.b1.unit11.lesson04.teach.a_more_confident:
    title: Leila describe cómo se siente
    gloss: 'Leila dice: Si Daniel se apuntara, me sentiría más segura.'
    note: '*joined* va en pasado porque la situación solo es imaginada.'
  en.b1.unit11.lesson04.teach.q_would_rather_weekend:
    title: Mia dice su preferencia
    gloss: 'Mia dice: Yo preferiría ir al curso de fin de semana que al nocturno.'
    note: '*would rather ... than ...* compara dos preferencias.'
  en.b1.unit11.lesson04.teach.a_known_sooner:
    title: Leila habla de un arrepentimiento del pasado
    gloss: 'Leila dice: Yo también. Si lo hubiera sabido antes, habría ahorrado más dinero.'
    note: '*if + past perfect, would have + participio* describe una situación irreal en el pasado.'
