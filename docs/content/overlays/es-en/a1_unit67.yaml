    gloss: 'Buenas noticias de la familia: Mia preguntó a Daniel por su familia. Daniel dijo que estaban bien. Después compartió una buena noticia: su hermana había tenido un bebé. Mia dijo que la noticia era maravillosa. Daniel dijo que él y su familia irían de visita pronto. Estaba orgulloso de su hermana. Más tarde, Mia envió un mensaje corto: Me alegro por tu familia.'
    note: '*shared good news* significa compartió buenas noticias.'
