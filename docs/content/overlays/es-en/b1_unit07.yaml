teaching:
  en.b1.unit07.lesson01.teach.if:
    title: if
    gloss: si
    note: '*if* introduce una condición posible.'
    example_gloss: Si el autobús llega tarde, te llamo.
  en.b1.unit07.lesson01.teach.unless:
    title: unless
    gloss: a menos que, si no
    note: '*unless* significa más o menos *if not*: algo pasa, salvo que se cumpla la condición.'
    example_gloss: A menos que cambie el plan, nos vemos a las diez.
  en.b1.unit07.lesson01.teach.condition:
    title: condition
    gloss: condición
    note: '*condition* es la situación que tiene que darse primero.'
    example_gloss: 'La condición está clara: empezamos si llegan todos.'
  en.b1.unit07.lesson01.teach.result:
    title: result
    gloss: resultado, consecuencia
    note: '*result* es lo que ocurre a causa de una condición.'
    example_gloss: El resultado es que nos reunimos en línea.
  en.b1.unit07.lesson01.teach.delay:
    title: delay
    gloss: retraso, demora
    note: '*delay* significa que algo ocurre más tarde de lo planeado.'
    example_gloss: Un retraso puede hacer que todos lleguen tarde.
  en.b1.unit07.lesson01.teach.reschedule:
    title: reschedule
    gloss: reprogramar, cambiar para otra fecha
    note: '*reschedule* significa elegir una nueva hora o fecha para una cita o una reunión.'
    example_gloss: Si la doctora está ocupada, reprogramamos la cita.
  en.b1.unit07.lesson02.teach.if_meeting_late:
    title: Una condición real con su resultado
    gloss: Si la reunión empieza tarde, les mando un mensaje a todos.
    note: 'Cuando la condición es real y se refiere al futuro, después de *if* va el presente simple: *If the meeting starts late*, no *will start*. En español también usamos el presente después de «si», pero en inglés es un error poner *will* ahí.'
  en.b1.unit07.lesson02.teach.if_not_ready:
    title: Una condición negada
    gloss: Si el informe no está listo, reprogramamos la revisión.
    note: '*if ... not* vuelve negativa la condición.'
  en.b1.unit07.lesson02.teach.grammar_real_condition:
    title: Condiciones reales en el futuro
    gloss: Si empieza tarde, mando un mensaje. Si el informe no está listo, reprogramamos la revisión.
    note: Después de *if* va el presente simple, y en el resultado suele ir *will*.
  en.b1.unit07.lesson03.teach.backup_plan:
    title: backup plan
    gloss: plan alternativo, plan B
    note: '*backup plan* es un plan adicional para el caso de que el primero no funcione.'
    example_gloss: Necesitamos un plan alternativo por si la sala está ocupada.
  en.b1.unit07.lesson03.teach.move_update:
    title: move the update
    gloss: posponer la actualización
    note: '*move the update* significa tratar la actualización en otro momento.'
    example_gloss: Si Leila llega tarde, pasamos su actualización para mañana.
  en.b1.unit07.lesson03.teach.reading_passage:
    title: 'Lectura: el plan alternativo'
    gloss: Daniel escribe un plan alternativo para la reunión del equipo. Si la sala de reuniones está libre, el equipo se reunirá allí a las diez. Si la sala está ocupada, se reunirán en línea. A menos que Leila se conecte antes de las diez, Daniel pasará su actualización para mañana. Si el informe no está listo, Mia enviará una actualización más corta.
    note: Una lectura breve con condiciones reales, resultados y *unless*.
  en.b1.unit07.lesson04.teach.q_if_meeting_late:
    title: Mia pregunta por el plan
    gloss: 'Mia dice: Daniel, ¿qué hacemos si la reunión empieza tarde?'
    note: Una pregunta sobre el resultado de una posible condición.
  en.b1.unit07.lesson04.teach.a_send_message:
    title: Daniel dice el resultado
    gloss: 'Daniel dice: Si empieza tarde, les mando un mensaje a todos.'
    note: '*If it starts late, I will...* une una posibilidad real con una acción concreta.'
  en.b1.unit07.lesson04.teach.q_if_leila_cannot_join:
    title: Mia pregunta por Leila
    gloss: 'Mia dice: ¿Y si Leila no puede conectarse?'
    note: Una pregunta breve con la misma estructura condicional.
  en.b1.unit07.lesson04.teach.a_unless_she_joins:
    title: Daniel usa 'unless'
    gloss: 'Daniel dice: Si no se conecta antes de las diez, pasamos su actualización para mañana.'
    note: '*unless she joins by ten* significa: si no se conecta a más tardar a las diez.'
  en.b1.unit07.lesson04.teach.q_room_busy:
    title: Mia pregunta por la sala
    gloss: 'Mia dice: Me parece justo. Y si la sala sigue ocupada, ¿nos reunimos en línea?'
    note: Mia revisa el plan alternativo para el caso de que la sala esté ocupada.
  en.b1.unit07.lesson04.teach.a_meet_online:
    title: Daniel confirma el plan online
    gloss: 'Daniel dice: Sí, si la sala está ocupada, nos reunimos en línea.'
    note: '*instead* significa que este plan reemplaza al otro.'
