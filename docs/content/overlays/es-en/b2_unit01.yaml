course:
  title: Inglés B2
  description: Aprende inglés de nivel B2 para mantener conversaciones matizadas, argumentar, hacer suposiciones y participar en discusiones profesionales, con explicaciones en un español informal.
units:
  en.b2.unit01.argumentation:
    title: The evidence still supports it
lessons:
  en.b2.unit01.lesson01.argument_structure:
    title: Postura, pruebas y refutación
  en.b2.unit01.lesson02.building_an_argument:
    title: I agree there are risks, but...
  en.b2.unit01.lesson03.reading_an_argument:
    title: 'Lectura: defender un horario híbrido'
  en.b2.unit01.lesson04.the_argument_dialogue:
    title: The benefits outweigh the risks
teaching:
  en.b2.unit01.lesson01.teach.claim:
    title: claim
    gloss: postura, afirmación
    note: '*claim* es la postura que defiendes. Aquí no significa reclamación ni queja.'
    example_gloss: Su postura es que el plan debe continuar.
  en.b2.unit01.lesson01.teach.evidence:
    title: evidence
    gloss: prueba, fundamento
    note: '*evidence* son los hechos, las cifras o los ejemplos con los que apoyas tu postura.'
    example_gloss: Este ejemplo le da a Mia pruebas para su postura.
  en.b2.unit01.lesson01.teach.counterargument:
    title: counterargument
    gloss: contraargumento
    note: '*counterargument* es un punto que va en contra de tu postura. En inglés se escribe como una sola palabra.'
    example_gloss: Daniel plantea un contraargumento.
  en.b2.unit01.lesson01.teach.rebut:
    title: rebut
    gloss: refutar
    note: '*rebut* significa responder a un contraargumento sin renunciar a tu propia postura.'
    example_gloss: Mia refuta la preocupación con pruebas.
  en.b2.unit01.lesson01.teach.concede:
    title: concede
    gloss: conceder, admitir
    note: '*concede* significa reconocer que una parte del punto contrario es razonable. No es lo mismo que renunciar a toda tu postura.'
    example_gloss: Puedes reconocer una preocupación sin renunciar a tu postura principal.
  en.b2.unit01.lesson01.teach.outweigh:
    title: outweigh
    gloss: pesar más que
    note: Usas *outweigh* cuando una ventaja, un riesgo o una razón es más importante que otra cosa.
    example_gloss: Unas pruebas sólidas pueden pesar más que una preocupación.
  en.b2.unit01.lesson02.teach.position_with_evidence:
    title: Reconocer el riesgo y mantener tu postura
    gloss: Estoy de acuerdo en que el plan tiene riesgos, pero las pruebas siguen apoyando que se continúe.
    note: '*I agree..., but...* reconoce primero el punto del otro. Después, *but the evidence still supports...* muestra que tu postura se mantiene.'
  en.b2.unit01.lesson02.teach.strongest_reason:
    title: Presentar tu razón más sólida
    gloss: La razón más sólida es que los resultados de la encuesta fueron coherentes.
    note: '*The strongest reason is that...* introduce tu fundamento principal. Fíjate en el orden inglés después de *that*: sujeto antes del verbo.'
  en.b2.unit01.lesson02.teach.fair_concern:
    title: Reconocer una preocupación razonable
    gloss: Es una preocupación legítima; sin embargo, los datos apuntan en la otra dirección.
    note: '*That is a fair concern; however,...* suena profesional: reconoces la preocupación, pero la refutas con datos.'
  en.b2.unit01.lesson02.teach.grammar_argument_shape:
    title: Defender una postura
    gloss: Expón tu postura, aporta pruebas, reconoce el contrapunto más fuerte y refútalo. Frases como That is a fair concern y However te hacen sonar razonable sin renunciar a tu postura.
    note: 'Mantén el orden normal del inglés (sujeto, verbo, complemento): *the data points in the other direction*.'
  en.b2.unit01.lesson03.teach.retention:
    title: retention
    gloss: permanencia del personal
    note: Aquí *retention* significa que los empleados se quedan en lugar de marcharse.
    example_gloss: Una mayor permanencia significa que menos empleados abandonan el equipo.
  en.b2.unit01.lesson03.teach.collaboration:
    title: collaboration
    gloss: colaboración
    note: '*collaboration* es trabajar juntos en una tarea o proyecto. En este contexto es una palabra neutra y positiva.'
    example_gloss: Una buena colaboración ayuda a un equipo a terminar el trabajo.
  en.b2.unit01.lesson03.teach.reading_passage:
    title: 'Texto: defender un horario híbrido'
    gloss: 'Mia sostiene que la empresa debería mantener el horario híbrido el próximo trimestre. Su postura principal es que el trabajo híbrido mejora la permanencia del personal sin reducir el rendimiento. La prueba más sólida es la encuesta al personal: los empleados de equipos híbridos decían con menos frecuencia que buscaban otro empleo. El contraargumento más fuerte es que la colaboración puede resentirse si las personas no están en la oficina todos los días. Mia reconoce esa preocupación, pero la refuta con datos de proyectos: los equipos híbridos entregaron a tiempo y sus puntuaciones de evaluación fueron algo más altas. Por ese motivo, concluye que los beneficios pesan más que los riesgos.'
    note: 'El texto construye un argumento completo: postura, pruebas, contraargumento, refutación y conclusión.'
  en.b2.unit01.lesson04.teach.q_keep_hybrid:
    title: Mia expone su postura
    gloss: 'Mia dice: Creo que deberíamos mantener el horario híbrido el próximo trimestre.'
    note: Mia empieza con una postura clara y defendible.
  en.b2.unit01.lesson04.teach.a_strongest_reason:
    title: Daniel pregunta por la razón
    gloss: 'Daniel dice: ¿Cuál es tu razón más sólida?'
    note: Daniel no pide una opinión en general, sino el fundamento principal.
  en.b2.unit01.lesson04.teach.q_retention_survey:
    title: Mia aporta pruebas
    gloss: 'Mia dice: La razón más sólida es la permanencia del personal. En la encuesta, las personas que trabajaban en modo híbrido decían con menos frecuencia que buscaban otro empleo.'
    note: Mia usa los resultados de una encuesta como prueba, no solo una sensación.
  en.b2.unit01.lesson04.teach.a_collaboration_weaker:
    title: Daniel plantea el contraargumento
    gloss: 'Daniel dice: Algunos gerentes dicen que la colaboración es más débil cuando las personas no están en la oficina todos los días.'
    note: Este es el contraargumento al que Mia tendrá que responder después.
  en.b2.unit01.lesson04.teach.q_data_rebuttal:
    title: Mia refuta con datos
    gloss: 'Mia dice: Es una preocupación legítima. Pero los datos del proyecto no la respaldan. Los equipos híbridos entregaron su trabajo a tiempo y sus puntuaciones de evaluación fueron algo más altas.'
    note: '*does not support it* usa *does* porque la negación en inglés necesita el auxiliar do.'
  en.b2.unit01.lesson04.teach.a_benefits_outweigh:
    title: Daniel resume la postura
    gloss: 'Daniel dice: ¿Entonces tu postura es que los beneficios pesan más que los riesgos?'
    note: '*outweigh* expresa la comparación entre beneficios y riesgos.'
  en.b2.unit01.lesson04.teach.q_improve_routines:
    title: Mia cierra con una solución
    gloss: 'Mia dice: Exacto. Deberíamos mejorar las rutinas de las reuniones, no abandonar el horario.'
    note: Mia defiende el plan, pero también propone una mejora práctica.
