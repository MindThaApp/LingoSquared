    title: Texto sobre preferencias
    gloss: Me gusta el té, pero no me gusta el café. Prefiero el té porque es más suave.
    note: En este texto corto, alguien dice qué le gusta y por qué.
  en.a1.unit19.lesson04.teach.too_strong:
