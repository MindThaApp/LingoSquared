  en.a1.unit19.lesson04.teach.he_prefers_thinks:
    title: He prefers tea. He thinks it's too strong.
    gloss: Él prefiere el té. Cree que es demasiado fuerte.
    note: '*prefers* y *thinks* son formas de la tercera persona del singular (*he*/*she*), con una *-s* al final.'
