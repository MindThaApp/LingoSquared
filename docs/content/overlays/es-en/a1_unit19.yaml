  en.a1.unit19.lesson02.teach.do_you_like_or:
    title: Do you like coffee or tea?
    gloss: ¿Te gusta el café o el té?
    note: Usas esta frase para preguntar por una elección entre dos opciones.
  en.a1.unit19.lesson02.teach.i_prefer_tea:
    title: I prefer tea.
    gloss: Prefiero el té.
    note: Con *I prefer...* dices lo que prefieres.
