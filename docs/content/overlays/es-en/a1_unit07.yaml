  en.a1.unit07.lesson03.teach.menu_text:
    title: Cafe Menu
    gloss: 'Carta de la cafetería: Café - 3 dólares. Té - 2 dólares. Sopa - 5 dólares. Sándwich - 6 dólares.'
    note: El signo del dólar va ANTES del número (*$3*), a diferencia del signo del euro, que en español va DESPUÉS.
  en.a1.unit07.lesson04.teach.thats_x_dollars:
    title: That's nine dollars.
    gloss: Son nueve dólares.
    note: En Estados Unidos se paga en *dollars*, no en euros; la estructura *That's X dollars* equivale a «Son X dólares».
  en.a1.unit07.lesson04.teach.q_order:
    title: Leila bestellt
    gloss: 'Leila: Hola, quisiera un café y un sándwich, por favor.'
    note: '*Hi* es un saludo informal, adecuado para una cafetería.'
  en.a1.unit07.lesson04.teach.a_anything_else:
    title: Nachfrage der Bedienung
    gloss: 'Camarero: Claro. ¿Algo más?'
    note: '*Sure* significa aquí «claro» o «con gusto».'
  en.a1.unit07.lesson04.teach.reply_thats_all:
    title: Antwort von Leila
    gloss: 'Leila: No, eso es todo, gracias.'
    note: Una respuesta completa confirma que el pedido está completo.
  en.a1.unit07.lesson04.teach.q_for_here:
    title: Frage der Bedienung
    gloss: 'Camarero: ¿Para tomar aquí o para llevar?'
    note: Esta pregunta se oye mucho en las cafeterías estadounidenses después de pedir.
  en.a1.unit07.lesson04.teach.reply_for_here:
