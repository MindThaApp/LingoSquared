  en.a1.unit18.lesson04.teach.q_good_time:
    title: Preguntar si lo pasó bien
    gloss: 'Leila pregunta: ¿Te lo pasaste bien?'
    note: Con *Did you have a good time?* preguntas si alguien se lo pasó bien.
  en.a1.unit18.lesson04.teach.a_yes_great:
    title: La respuesta completa de Daniel
