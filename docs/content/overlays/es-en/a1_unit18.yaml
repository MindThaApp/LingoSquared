teaching:
  en.a1.unit18.lesson01.teach.went:
    title: went
    gloss: fui (pasado de ir)
    note: '*went* es el pasado irregular de *go*.'
    example_gloss: Ayer fui al parque.
  en.a1.unit18.lesson01.teach.saw:
    title: saw
    gloss: vi (pasado de ver)
    note: '*saw* es el pasado irregular de *see*.'
    example_gloss: Ayer vi a mi amigo.
  en.a1.unit18.lesson01.teach.ate:
    title: ate
    gloss: comí (pasado de comer)
    note: '*ate* es el pasado irregular de *eat*.'
    example_gloss: Esta mañana desayuné.
  en.a1.unit18.lesson01.teach.visited:
    title: visited
    gloss: visité (pasado de visitar)
    note: '*visited* es el pasado regular de *visit* (con *-ed*).'
    example_gloss: La semana pasada visité a mis padres.
  en.a1.unit18.lesson01.teach.worked:
    title: worked
    gloss: trabajé (pasado de trabajar)
    note: '*worked* es el pasado regular de *work* (con *-ed*).'
    example_gloss: Ayer trabajé.
  en.a1.unit18.lesson02.teach.what_did_you_do:
    title: What did you do yesterday?
    gloss: ¿Qué hiciste ayer?
    note: Usas *What did you do...?* para preguntar por algo que pasó en el pasado.
  en.a1.unit18.lesson02.teach.i_worked:
    title: I worked in the morning.
    gloss: Trabajé por la mañana.
    note: Esta respuesta dice tanto la actividad como el momento del día.
  en.a1.unit18.lesson02.teach.last_week:
    title: I saw a movie last week.
    gloss: Vi una película la semana pasada.
    note: '*last week* significa «la semana pasada».'
  en.a1.unit18.lesson03.teach.together:
    title: together
    gloss: juntos
    note: '*together* significa «juntos».'
    example_gloss: Vimos una película juntos.
  en.a1.unit18.lesson03.teach.event_text:
    title: Texto sobre un suceso
    gloss: Ayer visité a mis padres. Cenamos juntos y vimos una película.
    note: Esta es una breve descripción de un suceso reciente.
  en.a1.unit18.lesson03.teach.the_writers_parents:
