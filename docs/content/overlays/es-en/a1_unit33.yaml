teaching:
  en.a1.unit33.lesson01.teach.bus:
    title: bus
    gloss: autobús
    note: '*bus* significa autobús. El verbo que lo acompaña es *take*: *take the bus*. Ojo: en español puedes usar el mismo esquema para casi cualquier medio de transporte (ir en autobús, ir en coche, ir en bici), pero en inglés cada medio suele tener su propio verbo (*take*, *drive*, *ride*). Hay que aprenderlos por separado.'
    example_gloss: Tomo el autobús.
  en.a1.unit33.lesson01.teach.train:
    title: train
    gloss: tren
    note: '*train* significa tren. Igual que con *bus*, aquí se usa *take*: *take the train*.'
    example_gloss: Ella toma el tren.
  en.a1.unit33.lesson01.teach.car:
    title: car
    gloss: coche
    note: '*car* significa coche. Con el coche no se usa *take* sino *drive*: *drive my car*. Es un verbo distinto al de autobús o tren.'
    example_gloss: Voy al trabajo en mi coche.
  en.a1.unit33.lesson01.teach.bike:
    title: bike
    gloss: bicicleta
    note: '*bike* significa bicicleta. Aquí se usa otro verbo distinto: *ride a bike* (ni *take* ni *drive*).'
    example_gloss: Voy al trabajo en bici todos los días.
  en.a1.unit33.lesson01.teach.walk:
    title: walk
    gloss: caminar
    note: '*walk* significa caminar. Aquí no hace falta un verbo extra como *take*, *drive* o *ride*, porque *walk* ya es el verbo: *walk to work*, no *take a walk to work*.'
    example_gloss: Voy caminando al trabajo.
  en.a1.unit33.lesson02.teach.how_get_to:
    title: How do you get to work?
    gloss: ¿Cómo llegas al trabajo?
    note: 'Esta pregunta empieza con el auxiliar *do*, porque el verbo principal es *get*. En español no hace falta ningún auxiliar: basta con decir «¿Cómo llegas al trabajo?».'
  en.a1.unit33.lesson02.teach.usually:
    title: usually
    gloss: normalmente
    note: '*usually* significa normalmente. En inglés este adverbio suele ir entre el sujeto y el verbo principal: *I usually take the bus*.'
    example_gloss: Normalmente tomo el autobús.
  en.a1.unit33.lesson02.teach.minutes:
    title: minutes
    gloss: minutos
    note: '*minutes* significa minutos. En *It takes twenty minutes*, *it* es un sujeto vacío, sin significado propio; solo ocupa el lugar del sujeto. En español basta con decir «Tarda veinte minutos», sin sujeto, pero en inglés el sujeto es obligatorio.'
    example_gloss: Tarda veinte minutos.
  en.a1.unit33.lesson02.teach.late:
    title: late
    gloss: tarde
    note: '*late* significa tarde (llegar más tarde de lo esperado): *The bus is often late.*'
    example_gloss: El autobús llega tarde a menudo.
  en.a1.unit33.lesson02.teach.faster:
    title: faster
    gloss: más rápido
    note: '*faster* significa más rápido: es el comparativo de *fast* con *-er*. Para comparar se usa *than*: *faster than the bus*.'
    example_gloss: El tren es más rápido que el autobús.
  en.a1.unit33.lesson03.teach.dialogue_line1:
    title: La pregunta de Leila
    gloss: 'Leila pregunta: ¿Cómo llegas al trabajo, Daniel?'
    note: Inicio de la conversación con *How do you get to work?*
  en.a1.unit33.lesson03.teach.dialogue_line2:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: Normalmente tomo el autobús. Tarda unos veinte minutos.'
    note: 'Dos cosas a la vez: el verbo *take* para el autobús y el sujeto vacío *it* en *It takes about twenty minutes*.'
  en.a1.unit33.lesson03.teach.dialogue_line3:
    title: La pregunta de Leila
    gloss: 'Leila pregunta: ¿Te gusta?'
    note: Pregunta de sí o no con *Do*.
  en.a1.unit33.lesson03.teach.dialogue_line4:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: Está bien, pero el autobús llega tarde a menudo. ¿Y tú?'
    note: '*How about you?* significa «¿Y tú?»: una forma breve de devolver la pregunta.'
  en.a1.unit33.lesson03.teach.dialogue_line5:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Yo voy en coche. Es más rápido, pero aparcar es difícil.'
    note: Para el coche se usa el verbo *drive*, no *take*.
  en.a1.unit33.lesson04.teach.reading_passage:
    title: Texto sobre Leila y Daniel
    gloss: Leila va en coche al trabajo todos los días. El trayecto dura unos quince minutos, pero aparcar cerca de su oficina es difícil. Daniel no tiene coche, así que toma el autobús. Su trayecto en autobús dura veinte minutos y a veces llega tarde, pero no tiene que preocuparse por aparcar.
    note: 'Ojo: *take* se usa para el autobús y el tren, *drive* para el coche.'
