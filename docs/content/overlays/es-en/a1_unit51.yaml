  en.a1.unit51.lesson03.teach.dialogue_line1:
    title: El saludo del farmacéutico
    gloss: 'El farmacéutico dice: Hola, ¿puedo ayudarle?'
    note: '*Hi, can I help you?* significa hola, ¿puedo ayudarle?'
  en.a1.unit51.lesson03.teach.dialogue_line2:
    title: Los síntomas de Leila
    gloss: 'Leila dice: Sí, tengo mucha tos y secreción nasal.'
    note: Repetición de la frase aprendida anteriormente.
  en.a1.unit51.lesson03.teach.dialogue_line3:
    title: El farmacéutico recomienda jarabe
    gloss: 'El farmacéutico dice: Tengo un jarabe para la tos que debería ayudarle. Tómelo antes de acostarse.'
    note: '*before bed* significa antes de acostarse; esta indicación corresponde al jarabe para la tos, no a los comprimidos.'
  en.a1.unit51.lesson03.teach.dialogue_line4:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: ¿También tiene algo para el dolor de garganta?'
    note: '*too* al final significa también.'
  en.a1.unit51.lesson03.teach.dialogue_line5:
    title: El farmacéutico recomienda comprimidos
    gloss: 'El farmacéutico dice: Sí, estos comprimidos son buenos para el dolor de garganta. Tome uno cada cuatro horas.'
    note: 'Esta es la dosis de los comprimidos: uno cada cuatro horas. El jarabe se toma en otro momento, antes de acostarse.'
  en.a1.unit51.lesson03.teach.dialogue_line6:
    title: La decisión de Leila
    gloss: 'Leila dice: Genial, me llevo los dos. ¿Cuánto cuesta?'
    note: '*I''ll take both.* significa me llevo los dos.'
  en.a1.unit51.lesson03.teach.dialogue_line7:
    title: El precio
    gloss: 'El farmacéutico dice: Son nueve dólares.'
    note: Repetición de la frase aprendida anteriormente.
  en.a1.unit51.lesson03.teach.dialogue_line8:
    title: Leila paga
    gloss: 'Leila dice: Aquí tiene. ¡Gracias!'
    note: '*Here you go.* significa aquí tiene y se usa al entregar algo.'
  en.a1.unit51.lesson04.teach.reading_passage:
    title: Texto sobre una visita a la farmacia
    gloss: 'Una visita a la farmacia: Unos días después de su viaje a las montañas con Mia, Leila se resfrió. Tenía mucha tos y secreción nasal, y también le dolía la garganta. Daniel la acompañó a la farmacia cercana a su apartamento. El farmacéutico escuchó los síntomas de Leila y le recomendó jarabe para la tos y comprimidos. Le indicó que tomara el jarabe antes de acostarse y un comprimido cada cuatro horas. Leila pagó nueve dólares por ambos. De camino a casa, Daniel también le compró una caja de pañuelos desechables. Leila tomó el medicamento esa noche y, para el fin de semana, la tos había mejorado mucho.'
    note: '*by the weekend* significa para el fin de semana.'
