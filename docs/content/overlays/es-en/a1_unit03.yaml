    gloss: diez
    note: '*ten* es el número 10 en inglés.'
    example_gloss: Tengo diez manzanas.
  en.a1.unit03.lesson02.teach.eleven:
    title: eleven
    gloss: once
    note: '*eleven* es irregular, como *once* en español.'
    example_gloss: El número de mi casa es el once.
  en.a1.unit03.lesson02.teach.twelve:
    title: twelve
    gloss: doce
    note: '*twelve* también es irregular, como *doce*.'
    example_gloss: El número de mi casa es el doce.
  en.a1.unit03.lesson02.teach.thirteen:
    title: thirteen
    gloss: trece
    note: 'Del 13 al 19 el inglés añade *-teen* al número base, parecido al español «-ce» de trece, catorce, quince. Pero en *thirteen* cambia la raíz: *thir-* en lugar de *three*.'
    example_gloss: El número de mi casa es el trece.
  en.a1.unit03.lesson02.teach.fifteen:
    title: fifteen
    gloss: quince
    note: '*fifteen*, no *fiveteen*: una pequeña irregularidad del inglés.'
    example_gloss: El número de mi casa es el quince.
  en.a1.unit03.lesson02.teach.twenty:
    title: twenty
    gloss: veinte
    note: '*twenty* es el número 20 en inglés.'
    example_gloss: El número de mi casa es el veinte.
  en.a1.unit03.lesson02.teach.twenty_one:
    title: twenty-one
    gloss: veintiuno
    note: 'En inglés se dice primero la decena y luego la unidad, con guion: *twenty-one*. En español se escribe en una sola palabra: *veintiuno*.'
  en.a1.unit03.lesson02.teach.thirty:
    title: thirty
    gloss: treinta
    note: '*thirty* es el número 30 en inglés.'
    example_gloss: Eso cuesta treinta dólares.
  en.a1.unit03.lesson02.teach.forty:
    title: forty
    gloss: cuarenta
    note: 'Ojo: *forty*, no *fourty*; desaparece la *u* de *four*.'
    example_gloss: Eso cuesta cuarenta dólares.
  en.a1.unit03.lesson02.teach.fifty:
    title: fifty
    gloss: cincuenta
    note: '*fifty* es el número 50 en inglés.'
    example_gloss: Eso cuesta cincuenta dólares.
  en.a1.unit03.lesson02.teach.hundred:
    title: one hundred
    gloss: cien
    note: En inglés, delante de *hundred* siempre va *one* o *a* (*one hundred*, *a hundred*); en español basta con «cien».
  en.a1.unit03.lesson03.teach.how_old:
    title: How old are you?
    gloss: ¿Cuántos años tienes? / ¿Cuántos años tiene usted?
    note: '*How old are you?* sirve en cualquier registro: el inglés no distingue entre tú y usted.'
  en.a1.unit03.lesson03.teach.im_25:
    title: I'm twenty-five years old.
    gloss: Tengo veinticinco años.
    note: 'Ojo: en inglés se «es» de una edad: *I''m twenty-five years old*, mientras que en español se «tiene».'
  en.a1.unit03.lesson03.teach.how_much:
    title: How much is this?
    gloss: ¿Cuánto cuesta esto?
    note: Pregunta el precio de algo.
  en.a1.unit03.lesson03.teach.its_ten_dollars:
    title: It's ten dollars.
    gloss: Cuesta diez dólares.
    note: La respuesta habitual a una pregunta por el precio.
  en.a1.unit03.lesson03.teach.phone_question:
    title: What's your phone number?
    gloss: ¿Cuál es su número de teléfono?
    note: Pregunta por un número de teléfono.
  en.a1.unit03.lesson03.teach.phone_answer:
    title: It's five-five-five, one-two-three-four.
    gloss: Es el cinco, cinco, cinco, uno, dos, tres, cuatro.
    note: En inglés los números de teléfono se dicen cifra por cifra, con pausas entre los grupos.
  en.a1.unit03.lesson04.teach.market:
    title: market
    gloss: el mercado
    note: Un lugar donde se compran alimentos y otros productos.
    example_gloss: Estamos en el mercado.
  en.a1.unit03.lesson04.teach.apples:
    title: apples
    gloss: manzanas
    note: Plural de *apple*.
    example_gloss: Las manzanas están frescas.
  en.a1.unit03.lesson04.teach.opening:
    title: Daniel eröffnet das Gespräch
    gloss: 'Daniel pregunta: ¿Cuánto cuesta esto?'
    note: Una pregunta sencilla por el precio.
  en.a1.unit03.lesson04.teach.price_five:
    title: Leila antwortet
    gloss: 'Leila dice: Cuesta cinco dólares.'
    note: La respuesta a la pregunta de Daniel sobre el precio.
  en.a1.unit03.lesson04.teach.ask_apples:
    title: Daniel fragt nach den Äpfeln
    gloss: 'Daniel pregunta: ¿Y cuánto cuestan las manzanas?'
    note: '*And* enlaza esta pregunta con la anterior.'
  en.a1.unit03.lesson04.teach.price_two:
    title: Leila antwortet
    gloss: 'Leila dice: Cuestan dos dólares.'
    note: Se usa *They're* porque *apples* está en plural.
  en.a1.unit03.lesson04.teach.ask_shop_age:
    title: Daniel fragt nach dem Alter des Ladens
    gloss: 'Daniel dice: Vale, ¿cuántos años tiene esta tienda?'
    note: '*How old* también se puede usar para cosas, no solo para personas.'
  en.a1.unit03.lesson04.teach.shop_age:
    title: Leila antwortet
    gloss: 'Leila dice: ¡Tiene veinte años!'
    note: 'Es la misma construcción que con personas: *years old* también sirve para cosas.'
