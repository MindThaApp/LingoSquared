  en.a1.unit65.lesson03.teach.dialogue_line1:
    title: Daniel quiere devolver algo
    gloss: 'Daniel dice: Hola. Quiero devolver esta camisa.'
    note: '*return this shirt* significa devolver esta camisa.'
  en.a1.unit65.lesson03.teach.dialogue_line2:
    title: El empleado pide el ticket
    gloss: 'El empleado dice: ¿Tienes el ticket?'
    note: '*Do you have...?* pregunta si alguien lleva algo consigo.'
  en.a1.unit65.lesson03.teach.dialogue_line3:
    title: Daniel tiene el ticket
    gloss: 'Daniel dice: Sí, aquí está. La talla es demasiado pequeña.'
    note: '*Here it is* significa aquí está.'
  en.a1.unit65.lesson03.teach.dialogue_line4:
    title: El empleado ofrece un cambio
    gloss: 'El empleado dice: Podemos cambiarlo por una talla más grande.'
    note: '*for a larger size* indica por qué se cambia el artículo.'
  en.a1.unit65.lesson03.teach.dialogue_line5:
    title: "Daniel dice que sí"
    gloss: 'Daniel dice: Sí, por favor.'
    note: '*Yes, please* es una forma cortés de aceptar.'
  en.a1.unit65.lesson03.teach.dialogue_line6:
    title: Hay una talla más grande
    gloss: 'El empleado dice: Tenemos una talla más grande en azul.'
    note: '*We have...* dice lo que hay disponible.'
  en.a1.unit65.lesson03.teach.dialogue_line7:
    title: Daniel no necesita el dinero
    gloss: 'Daniel dice: Genial. No necesito un reembolso.'
    note: '*I do not need* significa no necesito.'
  en.a1.unit65.lesson04.teach.return_note:
    title: Nota de devolución
    gloss: 'Nota de devolución: Camisa azul. Talla pequeña. Cambiar por una talla más grande. Ticket obligatorio.'
    note: La nota indica el artículo, la talla, la acción y el ticket.
  en.a1.unit65.lesson04.teach.reading_passage:
    title: 'Texto: Un cambio en la tienda'
    gloss: 'Un cambio en la tienda: Daniel compró una camisa azul, pero la talla era demasiado pequeña. Volvió a la tienda con el ticket. El empleado pidió el ticket y le ofreció una talla más grande. Daniel cambió la camisa. No necesitó un reembolso, porque la camisa azul más grande le quedaba bien.'
    note: '*exchanged* es el pasado de *exchange*.'
