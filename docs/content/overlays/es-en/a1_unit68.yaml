  en.a1.unit68.lesson04.teach.reading_passage:
    title: 'Texto: Amigas que comparten'
    gloss: 'Amigas que comparten: Llovía, así que Leila le pidió un paraguas a Mia. Mia dijo que se lo podía prestar a Leila. Mia le pidió a Leila que se lo devolviera al día siguiente. Después, Mia necesitó un cargador. Leila le prestó un cargador a Mia. Las dos amigas escribieron una nota corta para recordar lo que tenían que devolver.'
    note: '*lent* es el pasado de *lend*.'
  en.a1.unit68.lesson04.teach.borrowed_umbrella:
