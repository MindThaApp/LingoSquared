teaching:
  en.a1.unit16.lesson01.teach.wake_up:
    title: Wake up
    gloss: despertarse
    note: '*wake up* significa despertarse. Es un verbo con partícula y se escribe en dos palabras. En inglés no lleva pronombre reflexivo: no se dice *wake yourself up*.'
  en.a1.unit16.lesson01.teach.get_dressed:
    title: Get dressed
    gloss: vestirse
    note: '*get dressed* significa vestirse. En inglés no hay pronombre reflexivo como el *se* español: no se dice *get yourself dressed*.'
  en.a1.unit16.lesson01.teach.go_to_work:
    title: Go to work
    gloss: ir al trabajo
    note: '*go to work* significa ir al trabajo. En esta expresión fija no se usa artículo delante de *work*.'
  en.a1.unit16.lesson01.teach.have_dinner:
    title: Have dinner
    gloss: cenar
    note: '*have dinner* significa cenar. Las comidas van sin artículo: *have breakfast*, *have lunch*, *have dinner*.'
  en.a1.unit16.lesson01.teach.go_to_bed:
    title: Go to bed
    gloss: irse a la cama
    note: '*go to bed* significa irse a la cama para dormir. Tampoco aquí hay artículo delante de *bed*.'
  en.a1.unit16.lesson02.teach.what_time_wake_up:
    title: What time do you wake up?
    gloss: ¿A qué hora te despiertas?
    note: 'Con *What time do you wake up?* preguntas a qué hora se despierta alguien. La pregunta necesita el auxiliar *do*: no se dice *What time wake you up*.'
  en.a1.unit16.lesson02.teach.i_wake_up_at:
    title: I wake up at seven every day.
    gloss: Me despierto a las siete todos los días.
    note: '*every day* se usa para un hábito diario. Va al final o al principio de la frase.'
  en.a1.unit16.lesson02.teach.in_the_morning:
    title: I get dressed in the morning.
    gloss: Me visto por la mañana.
    note: '*in the morning* indica una parte del día, no una hora exacta. Nuestro «por la mañana» se dice *in the morning*, con *in* y con *the*.'
  en.a1.unit16.lesson02.teach.usually_at_night:
    title: I usually go to bed at eleven.
    gloss: Normalmente me acuesto a las once.
    note: '*usually* significa normalmente; describe un hábito que no siempre es exactamente igual. Cuidado con el orden de las palabras: en inglés *usually* va antes del verbo principal (*I usually go*). No puede ir detrás del verbo como en español («Me acuesto normalmente a las once»); *I go usually to bed* es incorrecto.'
  en.a1.unit16.lesson03.teach.then:
    title: Then
    gloss: luego/después
    note: '*then* significa luego o después; indica el orden de los acontecimientos.'
    example_gloss: Desayuno y luego voy al trabajo.
  en.a1.unit16.lesson03.teach.routine_text:
    title: Texto sobre una rutina diaria
    gloss: Todos los días me despierto a las siete. Luego me visto y desayuno.
    note: Es una descripción breve de una rutina matutina.
  en.a1.unit16.lesson04.teach.after_that:
    title: What do you do after that?
    gloss: ¿Qué haces después?
    note: Con *What do you do after that?* preguntas qué viene a continuación en una rutina diaria.
  en.a1.unit16.lesson04.teach.q_wake_time:
    title: Preguntar por la hora de despertarse
    gloss: 'Leila pregunta: ¿A qué hora te despiertas?'
    note: Es la misma pregunta de antes.
  en.a1.unit16.lesson04.teach.a_wake_seven:
    title: Respuesta sobre despertarse
    gloss: 'Daniel dice: Me despierto a las siete todos los días.'
    note: Una respuesta completa dice tanto la hora como la repetición diaria.
  en.a1.unit16.lesson04.teach.q_after_that:
    title: Preguntar qué viene después
    gloss: 'Leila pregunta: ¿Qué haces después?'
    note: Esta pregunta continúa de forma natural la conversación sobre la rutina diaria.
  en.a1.unit16.lesson04.teach.a_full_routine:
    title: Describir toda la rutina
    gloss: 'Daniel dice: Me visto, desayuno y voy al trabajo. Normalmente me acuesto a las once.'
    note: Daniel menciona varias actividades una detrás de otra, en el orden correcto.
