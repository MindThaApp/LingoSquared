teaching:
  en.b2.unit06.lesson01.teach.value:
    title: value
    gloss: valor
    note: '*value* significa aquí un principio que la gente considera importante, no solo un valor económico.'
    example_gloss: La justicia es un valor.
  en.b2.unit06.lesson01.teach.fairness:
    title: fairness
    gloss: equidad, trato justo
    note: '*fairness* se refiere al trato razonable y justo a las personas. Es más fuerte y más abstracto que simplemente *nice*.'
    example_gloss: La equidad significa tratar a las personas de forma razonable.
  en.b2.unit06.lesson01.teach.convenience:
    title: convenience
    gloss: comodidad, utilidad práctica
    note: '*convenience* es comodidad práctica. En este contexto de nivel B2 no lo expreses como *easiness*.'
    example_gloss: La comodidad hace la vida diaria más fácil.
  en.b2.unit06.lesson01.teach.flexibility:
    title: flexibility
    gloss: flexibilidad
    note: '*flexibility* es la capacidad de adaptarse cuando cambian las circunstancias.'
    example_gloss: La flexibilidad permite cambiar cuando cambian las condiciones.
  en.b2.unit06.lesson01.teach.qualify:
    title: qualify
    gloss: matizar, limitar
    note: '*qualify* significa aquí limitar o matizar tu opinión. No significa obtener un título.'
    example_gloss: Puedes matizar una opinión limitándola.
  en.b2.unit06.lesson01.teach.prioritize:
    title: prioritize
    gloss: dar prioridad a
    note: '*prioritize fairness* significa que consideras la equidad más importante que otro valor.'
    example_gloss: Dar prioridad a la equidad significa considerarla más importante que otra cosa.
  en.b2.unit06.lesson02.teach.in_principle:
    title: Sopesar valores
    gloss: En principio, la comodidad es importante, pero la equidad debería pesar más.
    note: '*In principle* significa «en principio». No uses *eventually* para decir «eventualmente»; *eventually* significa «al final» o «con el tiempo».'
  en.b2.unit06.lesson02.teach.not_arguing_everywhere:
    title: Limitar tu postura
    gloss: No abogo por el silencio en todas partes.
    note: '*I am not arguing for...* limita tu afirmación. Es mejor que una fórmula vaga con *a little*.'
  en.b2.unit06.lesson02.teach.respond_opposing:
    title: Responder directamente al otro punto de vista
    gloss: Tienes razón, y estoy de acuerdo en que las empresas necesitan flexibilidad.
    note: '*That is fair* reconoce el argumento sin renunciar a tu propio valor.'
  en.b2.unit06.lesson02.teach.grammar_abstract_response:
    title: Construir una opinión abstracta
    gloss: Una opinión abstracta sólida nombra un valor, matiza la afirmación y responde directamente al punto de vista de la otra persona.
    note: Usa palabras precisas de nivel B2 como *in principle*, *fairness* y *carry more weight*, y no repitas siempre *a bit* para matizar.
  en.b2.unit06.lesson03.teach.transparent:
    title: transparent
    gloss: transparente, fácil de entender
    note: '*transparent rules* son normas fáciles de entender y de comprobar.'
    example_gloss: Las normas transparentes son fáciles de entender.
  en.b2.unit06.lesson03.teach.commercial:
    title: commercial
    gloss: comercial, de negocios
    note: '*commercial activity* es la actividad relacionada con las empresas y el beneficio.'
    example_gloss: La actividad comercial tiene que ver con los negocios.
  en.b2.unit06.lesson03.teach.reading_passage:
    title: 'Texto de lectura: espacios públicos tranquilos'
    gloss: 'Amara sostiene que los espacios públicos tranquilos deben protegerse, incluso cuando eso limita parte de la actividad comercial. Su postura no es absoluta: no aboga por el silencio en todas partes y acepta que las empresas necesitan cierta flexibilidad. La postura contraria de Leo es que las normas pueden dificultar la supervivencia de los negocios. Amara responde directamente a ese argumento diciendo que la comodidad es importante, pero que la equidad debe pesar más cuando un espacio pertenece a todos. Su postura es matizada porque apoya normas limitadas y transparentes, no restricciones ilimitadas.'
    note: 'Esto es inglés abstracto: nombra valores y limita tu afirmación con precisión.'
  en.b2.unit06.lesson04.teach.q_protect_spaces:
    title: Amara expone su postura
    gloss: 'Amara dice: Creo que una ciudad debería proteger los espacios públicos tranquilos, aunque eso limite parte de la actividad comercial.'
    note: '*even if* deja claro que reconoce un inconveniente.'
  en.b2.unit06.lesson04.teach.a_business_flexibility:
    title: Leo nombra el otro valor
    gloss: 'Leo dice: Yo también valoro la tranquilidad, pero las empresas necesitan flexibilidad para sobrevivir.'
    note: Leo contrapone la flexibilidad al énfasis de Amara en el espacio público.
  en.b2.unit06.lesson04.teach.q_not_silence:
    title: Amara matiza
    gloss: 'Amara dice: Tienes razón, y no abogo por el silencio en todas partes. Mi punto es que los espacios compartidos no deberían estar determinados solo por el beneficio.'
    note: '*not arguing for silence everywhere* evita que su postura suene absoluta.'
  en.b2.unit06.lesson04.teach.a_prioritizing:
    title: Leo nombra el valor
    gloss: 'Leo dice: Entonces, ¿el valor al que das prioridad es la equidad, y no solo la comodidad personal?'
    note: '*prioritizing* significa aquí: hacer algo más importante en la balanza.'
  en.b2.unit06.lesson04.teach.q_fairness_weight:
    title: Amara sopesa los valores
    gloss: 'Amara dice: Exacto. En principio, la comodidad es importante, pero la equidad debería pesar más cuando un espacio pertenece a todos.'
    note: '*carry more weight* es la expresión natural en inglés para «pesar más».'
  en.b2.unit06.lesson04.teach.a_accept_rules:
    title: Leo acepta con una condición
    gloss: 'Leo dice: Puedo aceptarlo si las normas son limitadas y transparentes.'
    note: La aceptación depende de que las normas sean limitadas y claras.
