course:
  title: Inglés B1
  description: Aprende inglés de nivel B1 para obligaciones, posibilidades, situaciones hipotéticas y relatos cotidianos, con explicaciones detalladas en español.
units:
  en.b1.unit01.necessity:
    title: Cosas que tengo que hacer o debería hacer
lessons:
  en.b1.unit01.lesson01.necessity_vocabulary:
    title: Must, have to y should
  en.b1.unit01.lesson02.saying_what_you_must_do:
    title: I must, I have to, she has to
  en.b1.unit01.lesson03.past_regret_and_prohibition:
    title: Should have, must not, don't have to
  en.b1.unit01.lesson04.the_gym_membership_dialogue:
    title: You must not forget again
teaching:
  en.b1.unit01.lesson01.teach.must:
    title: must
    gloss: deber, tener que (obligación personal fuerte)
    note: '*must* expresa una obligación personal fuerte: algo que tú mismo consideras muy importante.'
    example_gloss: Tengo que terminar esta tarea hoy.
  en.b1.unit01.lesson01.teach.have_to:
    title: have to
    gloss: tener que (obligación externa)
    note: '*have to* expresa una obligación que viene de fuera, por ejemplo de una regla o de una fecha límite.'
    example_gloss: Tengo que pagar el alquiler antes del viernes.
  en.b1.unit01.lesson01.teach.should:
    title: should
    gloss: debería / deberías
    note: '*should* es una recomendación, no una obligación estricta.'
    example_gloss: Deberías llamar al dentista pronto.
  en.b1.unit01.lesson01.teach.task:
    title: task
    gloss: tarea
    note: '*task* significa una tarea o un trabajo que hay que hacer.'
    example_gloss: Todavía tengo una tarea por terminar.
  en.b1.unit01.lesson01.teach.rent:
    title: rent
    gloss: alquiler
    note: '*rent* es el dinero que se paga por vivir en un lugar.'
    example_gloss: El alquiler vence el viernes.
  en.b1.unit01.lesson01.teach.appointment:
    title: appointment
    gloss: cita
    note: '*appointment* es una cita fijada con alguien, por ejemplo con el médico.'
    example_gloss: Esta semana tengo cita con el dentista.
  en.b1.unit01.lesson02.teach.must_finish_task:
    title: expresar una obligación fuerte
    gloss: Tengo que terminar esta tarea hoy.
    note: '*I must* expresa una obligación personal fuerte.'
  en.b1.unit01.lesson02.teach.have_to_pay_rent:
    title: expresar una obligación externa
    gloss: Tengo que pagar el alquiler antes del viernes.
    note: '*I have to* expresa una obligación que viene de fuera, como una fecha de pago.'
  en.b1.unit01.lesson02.teach.she_has_to_make:
    title: La forma con 'she'
    gloss: Ella tiene que pedir una cita.
    note: Con *he/she/it*, *have to* cambia a *has to*.
  en.b1.unit01.lesson02.teach.you_should_call:
    title: dar una recomendación
    gloss: Deberías llamar y confirmar la cita.
    note: '*should* da una recomendación, no una obligación estricta como *must* o *have to*.'
  en.b1.unit01.lesson02.teach.grammar_agreement:
    title: Formas de 'have to'
    gloss: Tengo que irme. Ella tiene que irse. Tenemos que irnos. Ellos tienen que irse.
    note: Solo con *he/she/it* *have* pasa a *has*; con las demás personas se queda *have to*.
  en.b1.unit01.lesson03.teach.should_have_called:
    title: Expresar arrepentimiento por el pasado
    gloss: Debería haber llamado antes.
    note: '*should have* + participio expresa arrepentimiento por algo que no se hizo.'
    example_gloss: Debería haber llamado antes.
  en.b1.unit01.lesson03.teach.must_not:
    title: must not
    gloss: no se debe / está prohibido
    note: '*must not* expresa una prohibición: algo no está permitido en absoluto. Ojo: *must not* no significa «no tener que», sino «no deber»; «no tener que» se dice *don''t have to*.'
    example_gloss: No debes volver a olvidarlo.
  en.b1.unit01.lesson03.teach.dont_have_to:
    title: don't have to
    gloss: no tener que / no hace falta
    note: '*don''t have to* significa que algo no es obligatorio; es distinto de *must not* (prohibición).'
    example_gloss: No tienes que venir si estás ocupado.
  en.b1.unit01.lesson03.teach.grammar_past_regret:
    title: Arrepentimiento, prohibición y ausencia de obligación
    gloss: Debería haber llamado. Se me olvidó. No debes volver a olvidarlo. No tienes que venir.
    note: '*should have* + participio expresa arrepentimiento por el pasado. *must not* es una prohibición; *don''t have to* significa que no es obligatorio, pero está permitido.'
  en.b1.unit01.lesson03.teach.reading_passage:
    title: 'Lectura: el gimnasio'
    gloss: Ayer Daniel olvidó renovar su membresía del gimnasio. Debería haber puesto un recordatorio en su teléfono. Ahora tiene que pagar un recargo por demora. El mes que viene no debe volver a olvidarlo.
    note: Un texto breve sobre el error de Daniel y sus consecuencias.
  en.b1.unit01.lesson04.teach.q_renew_gym:
    title: Leila pregunta por la membresía
    gloss: 'Leila dice: Daniel, ¿renovaste tu membresía del gimnasio?'
    note: Una pregunta directa para comprobar si algo ya se hizo.
  en.b1.unit01.lesson04.teach.a_forgot_should_have:
    title: 'Respuesta de Daniel: se le olvidó'
    gloss: 'Daniel dice: ¡Ay, no, se me olvidó! Debería haberlo hecho la semana pasada.'
    note: '*I should have done that* expresa arrepentimiento por algo que no se hizo.'
  en.b1.unit01.lesson04.teach.q_call_today:
    title: Leila advierte a Daniel
    gloss: 'Leila dice: Tienes que llamarlos hoy o pagarás un recargo por demora.'
    note: Aquí *must* expresa una advertencia personal urgente.
  en.b1.unit01.lesson04.teach.a_also_pay_rent:
    title: Daniel menciona otras obligaciones
    gloss: 'Daniel dice: Tienes razón. Además tengo que pagar el alquiler antes del viernes, y también debería llamar al dentista.'
    note: Daniel combina *have to* (obligación) con *should* (recomendación) en una sola respuesta.
  en.b1.unit01.lesson04.teach.q_dont_have_to:
    title: Leila tranquiliza a Daniel
    gloss: 'Leila dice: No tienes que hacerlo todo hoy. Pero no debes volver a olvidarte del gimnasio.'
    note: Leila contrasta *don't have to* (no es obligatorio) con *must not* (prohibición).
  en.b1.unit01.lesson04.teach.a_more_organized:
    title: Daniel se hace un propósito
    gloss: 'Daniel dice: Lo sé. Este mes tengo que organizarme mejor.'
    note: Aquí *I must be* expresa un propósito personal.
