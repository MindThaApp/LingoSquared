teaching:
  en.a1.unit13.lesson01.teach.happy:
    title: happy
    gloss: feliz / contento
    note: '*happy* significa feliz.'
    example_gloss: Hoy estoy feliz.
  en.a1.unit13.lesson01.teach.sad:
    title: sad
    gloss: triste
    note: '*sad* significa triste.'
    example_gloss: Parece triste.
  en.a1.unit13.lesson01.teach.tired:
    title: tired
    gloss: cansado
    note: '*tired* significa cansado.'
    example_gloss: Estoy muy cansado.
  en.a1.unit13.lesson01.teach.excited:
    title: excited
    gloss: emocionado / ilusionado
    note: '*excited* significa emocionado o ilusionado por algo positivo; no es nervioso en sentido negativo (para eso se dice *worried*).'
    example_gloss: Estoy ilusionado con lo de mañana.
  en.a1.unit13.lesson01.teach.worried:
    title: worried
    gloss: preocupado
    note: '*worried* significa preocupado o intranquilo por algo que podría pasar.'
    example_gloss: Está preocupado por lo de mañana.
  en.a1.unit13.lesson02.teach.how_are_you_feeling:
    title: How are you feeling today?
    gloss: ¿Cómo te sientes hoy?
    note: '*How are you feeling?* pregunta específicamente por el estado de ánimo actual, a diferencia del más general *How are you?*'
  en.a1.unit13.lesson02.teach.im_worried_because:
    title: I'm a little worried because I have a big test tomorrow.
    gloss: Estoy un poco preocupado porque mañana tengo un examen importante.
    note: '*because* significa «porque» e introduce el motivo del sentimiento.'
  en.a1.unit13.lesson02.teach.im_happy_because:
    title: I'm happy because the class is almost over.
    gloss: Estoy contento porque el curso casi ha terminado.
    note: '*almost over* significa «casi terminado».'
  en.a1.unit13.lesson03.teach.message_text:
    title: Un mensaje sobre sentimientos
    gloss: Hola, estoy un poco preocupado porque mañana tengo un examen importante. ¡Pero también estoy ilusionado porque es el último de este año!
    note: Un mensaje puede expresar varios sentimientos, incluso opuestos, en frases cortas y enlazadas.
  en.a1.unit13.lesson03.teach.writer_summary:
    title: The writer is worried and excited.
    gloss: El autor está preocupado e ilusionado.
    note: '*writer* significa la persona que ha escrito el mensaje.'
  en.a1.unit13.lesson04.teach.i_understand:
    title: Oh, I understand.
    gloss: Ah, entiendo.
    note: '*I understand* significa «entiendo» y muestra empatía al escuchar.'
  en.a1.unit13.lesson04.teach.q_feeling:
    title: Pregunta de Leila
    gloss: 'Leila: ¿Cómo te sientes hoy?'
    note: Leila abre la conversación preguntando por los sentimientos de Daniel.
  en.a1.unit13.lesson04.teach.a_worried_test:
    title: Respuesta de Daniel
    gloss: 'Daniel: Estoy un poco preocupado porque mañana tengo un examen importante.'
    note: Daniel dice su sentimiento y el motivo.
  en.a1.unit13.lesson04.teach.acknowledge_and_ask:
    title: Reacción de Leila
    gloss: 'Leila: Ah, entiendo. ¿Tú también estás ilusionado?'
    note: Leila muestra comprensión y pregunta por otro sentimiento.
  en.a1.unit13.lesson04.teach.a_yes_happy_class:
    title: Respuesta de Daniel
    gloss: 'Daniel: Sí, un poco. Estoy contento de que el curso casi haya terminado.'
    note: Daniel lo confirma brevemente y dice un segundo sentimiento, positivo.
