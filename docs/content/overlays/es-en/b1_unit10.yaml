  en.b1.unit10.lesson02.teach.grammar_purpose:
    title: '''in order to'' und ''so that'''
    gloss: Estudio para mejorar mi inglés. Estudio para poder recordar más.
    note: '*in order to* va antes de un verbo; *so that* va antes de una oración completa con su propio sujeto. En español pasa algo parecido: «para + infinitivo» corresponde a *in order to*, y «para que + subjuntivo» corresponde a *so that*. En inglés no hay subjuntivo: se dice *so that I can remember*.'
