  en.a1.unit48.lesson03.teach.dialogue_line1:
    title: La propuesta de Leila
    gloss: 'Leila dice: Tengo que devolver este libro a la biblioteca. ¿Quieres venir conmigo?'
    note: '*Do you want to come with me?* significa ¿quieres venir conmigo?'
  en.a1.unit48.lesson03.teach.dialogue_line2:
    title: La reacción de Daniel
    gloss: 'Daniel dice: ¡Claro! Creo que nunca antes he pedido prestado un libro en una biblioteca.'
    note: '*I don''t think I''ve ever ...* significa creo que nunca he ..., con el presente perfecto (*have ever*).'
  en.a1.unit48.lesson03.teach.dialogue_line3:
    title: Leila en el mostrador
    gloss: 'Leila dice: Hola, quisiera devolver este libro y también quisiera pedir prestado uno nuevo.'
    note: '*and I''d like to ... too* significa y también quisiera ...'
  en.a1.unit48.lesson03.teach.dialogue_line4:
    title: Pregunta el bibliotecario
    gloss: 'El bibliotecario dice: Estupendo, gracias. ¿Tienes tu carné de biblioteca?'
    note: '*Do you have your library card?* significa ¿tienes tu carné de biblioteca?'
  en.a1.unit48.lesson03.teach.dialogue_line5:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Sí, aquí está.'
    note: '*here it is* significa aquí está.'
  en.a1.unit48.lesson03.teach.dialogue_line6:
    title: Explica el bibliotecario
    gloss: 'El bibliotecario dice: Perfecto. Este libro nuevo hay que devolverlo dentro de tres semanas.'
    note: '*due back in three weeks* significa hay que devolverlo dentro de tres semanas.'
  en.a1.unit48.lesson03.teach.dialogue_line7:
    title: Daniel también quiere pedir prestado
    gloss: 'Daniel dice: ¿Puedo sacarme yo también un carné de biblioteca? Quisiera pedir prestado un libro de cocina.'
    note: '*Can I get ... too?* significa ¿puedo conseguir ... yo también?'
  en.a1.unit48.lesson03.teach.dialogue_line8:
    title: El bibliotecario ayuda a Daniel
    gloss: 'El bibliotecario dice: ¡Por supuesto! Solo tienes que rellenar este formulario.'
    note: '*fill out this form* significa rellenar este formulario; es un verbo con partícula (*fill out*) que en español se expresa con un solo verbo.'
  en.a1.unit48.lesson04.teach.reading_passage:
    title: Texto sobre cómo funciona una biblioteca
    gloss: 'Una visita a la biblioteca: la mayoría de las bibliotecas te dejan pedir prestados libros, y a veces otros objetos, durante unas semanas. Para llevarte algo prestado, normalmente necesitas un carné de biblioteca. Cuando te llevas un libro, el bibliotecario te dice la fecha de devolución, es decir, el día en que debes devolverlo. Si para entonces no has terminado, a menudo puedes pedirle al bibliotecario más tiempo. Desde que Leila se mudó a su nuevo apartamento, tiene menos libros que antes, así que empezó a pedirlos prestados en la biblioteca. La semana pasada devolvió un libro y recogió uno nuevo, y su amigo Daniel la acompañó. Él nunca antes había pedido prestado un libro de la biblioteca, así que sacó su propio carné y se llevó prestado un libro de cocina para practicar las recetas que Mia le está enseñando. El bibliotecario les recordó a ambos que devolvieran sus libros antes de la fecha de devolución. Mia no va mucho a la biblioteca, pero una vez pidió prestado un libro de fotografía para su clase.'
    note: '*checked out a cookbook* significa se llevó prestado un libro de cocina (*checked out* es la expresión fija en inglés para sacar un libro de la biblioteca).'
