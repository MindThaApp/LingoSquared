teaching:
  en.b2.unit03.lesson01.teach.hedge:
    title: hedge
    gloss: formular con cautela
    note: '*hedge* significa hacer una afirmación menos absoluta. No traduzcas siempre ''un poco'' con *a little*.'
    example_gloss: Leila usa seems para formular con más cautela su afirmación sobre la política.
  en.b2.unit03.lesson01.teach.qualify:
    title: qualify
    gloss: limitar o matizar
    note: '*qualify* significa limitar una afirmación con una condición o una excepción.'
    example_gloss: La expresión 'provided we agree' limita el apoyo de Leila.
  en.b2.unit03.lesson01.teach.emphasize:
    title: emphasize
    gloss: subrayar, resaltar
    note: '*emphasize* significa dar más fuerza a una parte de tu mensaje.'
    example_gloss: Daniel subraya el problema de la carga de trabajo.
  en.b2.unit03.lesson01.teach.to_some_extent:
    title: to some extent
    gloss: hasta cierto punto
    note: '*to some extent* suele sonar más natural que usar *a little* en todas partes.'
    example_gloss: Hasta cierto punto, la política responde a las preocupaciones del equipo.
  en.b2.unit03.lesson01.teach.broadly:
    title: broadly
    gloss: en líneas generales, por lo general
    note: '*broadly* expresa apoyo o verdad en general, dejando espacio para excepciones.'
    example_gloss: La propuesta es, en líneas generales, útil, aunque no perfecta.
  en.b2.unit03.lesson01.teach.provided:
    title: provided
    gloss: siempre que, con tal de que
    note: '*provided* introduce una condición. Se parece a ''siempre que'', pero en inglés suele sonar formal y profesional.'
    example_gloss: Podemos apoyar la política, siempre que estemos de acuerdo.
  en.b2.unit03.lesson02.teach.seems_but_does:
    title: Cautela más énfasis
    gloss: La política parece razonable, pero sí genera trabajo extra para el equipo.
    note: '*seems* hace más cauta la afirmación positiva; *does create* subraya que el trabajo extra realmente aparece. En español se consigue con ''sí'': ''sí genera trabajo extra''.'
  en.b2.unit03.lesson02.teach.what_worries_me:
    title: Centrar la atención en una preocupación
    gloss: Lo que me preocupa es el trabajo extra para el equipo.
    note: '*What worries me is...* pone un punto al principio para destacarlo. Después mantén el orden inglés: *is the extra work*.'
  en.b2.unit03.lesson02.teach.broadly_provided:
    title: Apoyo general con condición
    gloss: Es útil en líneas generales, siempre que se ajuste el calendario.
    note: '*broadly useful, provided...* expresa apoyo con una condición clara.'
  en.b2.unit03.lesson02.teach.grammar_stance:
    title: Matiz y énfasis
    gloss: Usa seems, broadly o to some extent para formular una afirmación con más cautela o más limitada. Usa do o does delante del verbo principal para enfatizar que algo es cierto. Usa What matters is... o What worries me is... para dirigir la atención a un punto.
    note: 'Para hispanohablantes, lo más novedoso es *does create*: no significa ''hace crear'', sino que da énfasis a *create*, como el ''sí'' en ''sí crea''.'
  en.b2.unit03.lesson03.teach.overall:
    title: overall
    gloss: en conjunto
    note: '*overall* mira el conjunto, aunque haya detalles o excepciones.'
    example_gloss: En conjunto, Leila apoya la política.
  en.b2.unit03.lesson03.teach.condition:
    title: condition
    gloss: condición
    note: '*condition* es algo que debe cumplirse antes de que algo sea válido.'
    example_gloss: Su condición es que se ajuste el calendario.
  en.b2.unit03.lesson03.teach.reading_passage:
    title: 'Texto: apoyo con condiciones'
    gloss: 'Los comentarios de Leila son positivos, pero cuidadosamente matizados. Dice que la política de revisión parece razonable en conjunto, lo que atenúa la afirmación y evita que suene absoluta. También dice que es útil en líneas generales, siempre que se ajuste el calendario. Esa condición limita su apoyo: no acepta la política exactamente tal como está escrita. Daniel subraya un punto distinto con una construcción enfática: lo que le preocupa es el trabajo extra para el equipo. Ambos apoyan la política en principio, pero su lenguaje muestra distintos niveles de compromiso.'
    note: El texto muestra cómo se puede hacer el mismo contenido más suave, más fuerte o más condicional.
  en.b2.unit03.lesson04.teach.q_policy_seems:
    title: Leila se expresa con cautela
    gloss: 'Leila dice: La nueva política de revisión parece razonable en conjunto.'
    note: '*seems reasonable overall* es más positivo que una crítica, pero no es absoluto.'
  en.b2.unit03.lesson04.teach.a_not_fully_ready:
    title: Daniel percibe la cautela
    gloss: 'Daniel dice: Suena algo cauteloso. ¿Quieres decir que todavía no está del todo lista?'
    note: Daniel se da cuenta de que Leila no dice simplemente *it is ready*.
  en.b2.unit03.lesson04.teach.q_workable_deadlines:
    title: Leila matiza más
    gloss: 'Leila dice: Exacto. Puede ser viable, pero necesita plazos más claros.'
    note: '*may be workable* deja espacio a la duda; *but* introduce la limitación.'
  en.b2.unit03.lesson04.teach.a_what_worries:
    title: Daniel pone el foco
    gloss: 'Daniel dice: Estoy de acuerdo. Lo que me preocupa es el trabajo extra para el equipo.'
    note: '*What worries me is...* pone el foco en una preocupación.'
  en.b2.unit03.lesson04.teach.q_does_create_checks:
    title: Leila enfatiza con does
    gloss: 'Leila dice: Es justo. La política sí genera mejores controles de calidad, pero también añade otro paso de aprobación.'
    note: '*does create* subraya que esta ventaja existe de verdad, a pesar de la limitación posterior.'
  en.b2.unit03.lesson04.teach.a_support_conditions:
    title: Daniel resume la condición
    gloss: 'Daniel dice: ¿Entonces deberíamos apoyarla con condiciones?'
    note: Resume el apoyo matizado de Leila.
  en.b2.unit03.lesson04.teach.q_broadly_useful:
    title: Leila da un apoyo condicionado
    gloss: 'Leila dice: Sí. Diría que es útil en líneas generales, siempre que se ajuste el calendario.'
    note: 'Aquí *provided* significa ''siempre que'': el apoyo solo vale si se cumple la condición.'
  en.b2.unit03.lesson04.teach.same_content_triad:
    title: El mismo contenido, tres grados de fuerza
    gloss: La política genera trabajo extra. La política parece generar trabajo extra. La política sí genera trabajo extra.
    note: Las tres frases practican la forma neutra, la más cautelosa con *seems to* y la más enfática con *does*.
