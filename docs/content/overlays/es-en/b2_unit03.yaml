course:
  title: Inglés B2
  description: Aprende inglés de nivel B2 para mantener conversaciones matizadas, argumentar, hacer suposiciones y participar en discusiones profesionales, con explicaciones en un español informal.
units:
  en.b2.unit03.hedging_emphasis:
    title: It seems reasonable, but...
lessons:
  en.b2.unit03.lesson01.stance_words:
    title: Atenuar, matizar y enfatizar
  en.b2.unit03.lesson02.modulating_claims:
    title: Seems reasonable, does create work
  en.b2.unit03.lesson03.reading_nuanced_feedback:
