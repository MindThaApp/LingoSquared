    title: express mail
    gloss: correo urgente / envío exprés
    note: '*express mail* significa correo urgente: un envío más rápido y más caro.'
    example_gloss: El correo urgente es más rápido que el correo normal.
  en.a1.unit40.lesson02.teach.how_much_does_it_cost_question:
    title: How much does it cost to send this?
    gloss: ¿Cuánto cuesta enviar esto?
    note: '*How much does it cost to ...?* pregunta el precio de una acción.'
  en.a1.unit40.lesson03.teach.dialogue_line1:
    title: La petición de Daniel
    gloss: 'Daniel dice: Hola, quisiera enviar este paquete, por favor.'
    note: '*I''d like to* + verbo es una forma educada de pedir algo. Es mucho más cortés que *I want*, que en una ventanilla suena bastante brusco.'
  en.a1.unit40.lesson03.teach.dialogue_line2:
    title: La empleada pregunta
    gloss: 'La empleada dice: ¡Claro! ¿A dónde va?'
    note: '*Where is it going?* pregunta por el destino.'
  en.a1.unit40.lesson03.teach.dialogue_line3:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: A Chicago. Es un regalo de cumpleaños para mi hermana.'
    note: '*It''s a birthday gift for my sister* significa: es un regalo de cumpleaños para mi hermana.'
  en.a1.unit40.lesson03.teach.dialogue_line4:
    title: La empleada pregunta
    gloss: 'La empleada dice: ¿Quiere correo normal o urgente? El urgente tarda unos dos días.'
    note: '*regular or express mail* significa correo normal o urgente.'
  en.a1.unit40.lesson03.teach.dialogue_line5:
    title: La elección de Daniel
    gloss: 'Daniel dice: Me quedo con el urgente, por favor. ¿Cuánto es?'
    note: '*I''ll take ...* es una forma natural de elegir algo cuando te atiende un empleado.'
  en.a1.unit40.lesson03.teach.dialogue_line6:
    title: La empleada responde
    gloss: 'La empleada dice: Son doce dólares. Aquí tiene su recibo.'
    note: '*Here''s your receipt* significa: aquí tiene su recibo.'
  en.a1.unit40.lesson03.teach.dialogue_line7:
    title: El agradecimiento de Daniel
    gloss: 'Daniel dice: ¡Gracias! Que tenga un buen día.'
    note: '*Have a good day* es una despedida cortés.'
  en.a1.unit40.lesson04.teach.reading_passage:
    title: Texto sobre tres visitas a la oficina de correos
    gloss: Daniel, Leila y Mia se desenvuelven bien en la oficina de correos. La semana pasada, Daniel envió un paquete de cumpleaños a su hermana en Chicago. Pagó el envío urgente porque quería que llegara rápido, y tardó solo dos días. Leila se está preparando para mudarse cerca de Mia, así que fue a correos a enviar unos libros viejos a sus padres. La empleada pesó el paquete y le puso el sello correspondiente. Leila preguntó cuánto tardaría el paquete, y la empleada dijo que una semana más o menos, porque había elegido correo normal. Mia no envía paquetes muy a menudo, pero siempre compra un sello para las cartas que le escribe a su abuela. Dice que una carta con sello resulta más personal que un mensaje de texto.
    note: '*getting ready to move* significa: prepararse para mudarse.'
