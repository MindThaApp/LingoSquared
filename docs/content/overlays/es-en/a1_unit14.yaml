    title: Are you free at 6pm?
    gloss: ¿Estás libre a las 6 de la tarde?
    note: '*at 6pm* indica la hora exacta.'
  en.a1.unit14.lesson03.teach.text_message_text:
    title: Un mensaje de texto
    gloss: Hola Leila, ¿estás libre a las 6 de la tarde? Quedemos en la cafetería.
    note: Un mensaje de texto corto combina una pregunta sobre la hora con una propuesta concreta.
  en.a1.unit14.lesson03.teach.purpose_summary:
    title: This message is to suggest a meeting time and place.
    gloss: Este mensaje sirve para proponer una hora y un lugar para quedar.
    note: '*to suggest* significa «proponer»: es la finalidad del mensaje.'
