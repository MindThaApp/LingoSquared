  en.a1.unit14.lesson01.teach.hello_this_is:
    title: Hello, this is Daniel.
    gloss: Hola, soy Daniel.
    note: '*this is [nombre]* sirve para presentarse por teléfono, a diferencia de la presentación en persona con *I''m.*'
  en.a1.unit14.lesson01.teach.hi_its:
    title: Hi, it's Leila.
    gloss: Hola, soy Leila.
    note: '*it''s [nombre]* es una variante más corta e informal de *this is [nombre].*'
  en.a1.unit14.lesson01.teach.are_you_free:
    title: Are you free tonight?
    gloss: ¿Estás libre esta noche?
    note: '*free* significa aquí «con tiempo libre», no «gratis».'
  en.a1.unit14.lesson02.teach.can_you_repeat:
    title: Sorry, can you repeat that?
    gloss: Perdone, ¿puede repetir eso?
    note: '*Sorry* introduce con educación la petición de repetir algo.'
  en.a1.unit14.lesson02.teach.speak_slowly:
    title: Can you speak more slowly, please?
    gloss: ¿Puede hablar más despacio, por favor?
    note: '*more slowly* significa «más despacio»: es la forma comparativa de *slowly.*'
  en.a1.unit14.lesson02.teach.i_cant_hear:
    title: I can't hear you well.
    gloss: No le oigo bien.
