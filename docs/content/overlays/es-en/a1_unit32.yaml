    title: cat
    gloss: gato
    note: '*cat* significa gato.'
    example_gloss: El gato de mi hermana es negro.
  en.a1.unit32.lesson01.teach.fish:
    title: fish
    gloss: pez
    note: '*fish* significa pez.'
