    gloss: pájaro
    note: '*bird* significa pájaro.'
    example_gloss: Tenemos un pájaro.
  en.a1.unit32.lesson01.teach.pet:
    title: pet
    gloss: mascota
    note: '*pet* significa mascota; *pets* es el plural. Fíjate en *any* en la pregunta *Do you have any pets?* En inglés se usa *any* en preguntas y negaciones con plurales y con nombres incontables. En español no hace falta una palabra equivalente (*¿Tienes mascotas?* no lleva nada parecido a *any*), pero en inglés no puedes omitirlo.'
    example_gloss: ¿Tienes mascotas?
  en.a1.unit32.lesson02.teach.name_is:
    title: Her name is Luna.
    gloss: Se llama Luna.
    note: En inglés se usa *her*/*his* (y *she*/*he*) para un animal cuando se conoce su sexo; si no se sabe, se suele usar *it*. En español el género del animal lo marca el sustantivo (*la gata*, *el perro*), pero en inglés depende del sexo real. *Her name is Luna* habla de una hembra.
  en.a1.unit32.lesson02.teach.play:
    title: play
    gloss: jugar
    note: '*play* significa jugar.'
    example_gloss: A mi perro le gusta jugar.
  en.a1.unit32.lesson02.teach.walk:
    title: walk
    gloss: pasear / sacar a pasear
    note: Aquí *walk* significa sacar a pasear a tu mascota.
    example_gloss: Saco a pasear a mi perro todos los días.
  en.a1.unit32.lesson02.teach.friendly:
    title: friendly
    gloss: amigable
    note: '*friendly* significa amigable.'
    example_gloss: Su gato es muy amigable.
  en.a1.unit32.lesson02.teach.small:
    title: small
    gloss: pequeño
    note: '*small* significa pequeño.'
    example_gloss: El pez es pequeño.
  en.a1.unit32.lesson03.teach.dialogue_line1:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: Mia, ¿tienes mascotas?'
    note: En español no se traduce *any* aquí (*¿Tienes mascotas?*), pero en inglés no se puede omitir.
  en.a1.unit32.lesson03.teach.dialogue_line2:
    title: Respuesta de Mia
    gloss: 'Mia dice: Sí, tengo una gata. Se llama Luna.'
    note: '*She* y *her* para la gata, porque se sabe que es hembra. En inglés se elige según el sexo del animal, no según el género gramatical de la palabra.'
  en.a1.unit32.lesson03.teach.dialogue_line3:
    title: La siguiente pregunta de Daniel
    gloss: 'Daniel dice: ¡Qué bien! ¿Le gusta jugar?'
    note: Aquí *Does* es el verbo auxiliar con *she* (do-support), igual que en las preguntas sobre el aspecto físico.
  en.a1.unit32.lesson03.teach.dialogue_line4:
    title: Respuesta de Mia
    gloss: 'Mia dice: Sí, le encanta jugar con una pelota. ¿Y tú?'
    note: '*What about you?* es una forma breve y natural de devolver la misma pregunta a la otra persona.'
  en.a1.unit32.lesson03.teach.dialogue_line5:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: Tengo un pez pequeño, pero quiero un perro.'
    note: 'Aquí *but* une dos ideas opuestas: ya tiene una mascota, pero quiere otro animal.'
  en.a1.unit32.lesson04.teach.reading_passage:
    title: Texto sobre Leila y Daniel
    gloss: Leila tiene un perro que se llama Max. Es grande y muy amigable. Lo saca a pasear todas las mañanas. Daniel no tiene perro, pero tiene un pez pequeño. El pez no necesita paseos, pero a Daniel le gusta mirar cómo nada.
    note: '*He* para Max, porque es un animal macho. También aquí se elige *she* o *he* según el sexo real del animal, no *it*.'
