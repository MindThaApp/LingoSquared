teaching:
  en.a1.unit22.lesson01.teach.headache:
    title: headache
    gloss: dolor de cabeza
    note: '*headache* significa dolor de cabeza. En español solemos decir «me duele la cabeza» o «tengo dolor de cabeza»; en inglés se dice *I have a headache*, con *have* y el artículo *a*.'
    example_gloss: Tengo dolor de cabeza.
  en.a1.unit22.lesson01.teach.stomachache:
    title: stomachache
    gloss: dolor de estómago
    note: '*stomachache* significa dolor de estómago o de barriga. También aquí va en singular con artículo (*a stomachache*).'
    example_gloss: Tengo dolor de estómago.
  en.a1.unit22.lesson01.teach.fever:
    title: fever
    gloss: fiebre
    note: '*fever* significa fiebre. Se dice *have a fever*, no *have fever*: en inglés lleva artículo.'
    example_gloss: Creo que tengo fiebre.
  en.a1.unit22.lesson01.teach.cough:
    title: cough
    gloss: tos
    note: '*cough* significa tos. La palabra es sustantivo y verbo: *a cough* (la tos), *to cough* (toser).'
    example_gloss: Daniel tiene mucha tos.
  en.a1.unit22.lesson01.teach.sore_throat:
    title: sore throat
    gloss: dolor de garganta
    note: '*sore throat* significa dolor de garganta. *sore* quiere decir «dolorido»; aquí también hay artículo: *a sore throat*.'
    example_gloss: Tengo dolor de garganta.
  en.a1.unit22.lesson02.teach.whats_wrong:
    title: What's wrong?
    gloss: ¿Qué te pasa?
    note: Con *What's wrong?* preguntas por un problema. *What's* es la forma abreviada de *What is*.
  en.a1.unit22.lesson02.teach.i_have_a_headache:
    title: I have a headache.
    gloss: Tengo dolor de cabeza.
    note: Con *I have a...* nombras una molestia. Es literalmente «tengo un...»; en español también se puede decir «me duele...», pero en inglés se usa *have*.
  en.a1.unit22.lesson02.teach.i_feel_hot:
    title: I feel hot.
    gloss: Tengo calor.
    note: 'Con *I feel...* dices cómo te sientes físicamente. *I feel hot* significa literalmente «me siento caliente», pero quiere decir «tengo calor». En inglés no se usa *have* para el calor: no se dice *I have hot*.'
  en.a1.unit22.lesson03.teach.rest:
    title: rest
    gloss: descansar
    note: '*rest* significa descansar.'
    example_gloss: Necesito descansar.
  en.a1.unit22.lesson03.teach.symptom_text:
    title: Texto sobre molestias
    gloss: Tengo dolor de cabeza y de garganta. Creo que también tengo fiebre. Necesito descansar.
    note: En este texto breve una persona describe varias molestias a la vez.
  en.a1.unit22.lesson04.teach.see_a_doctor:
    title: You should see a doctor.
    gloss: Deberías ir al médico.
    note: 'Con *You should...* das un consejo sencillo: «deberías...». Después de *should* el verbo va sin *to*.'
  en.a1.unit22.lesson04.teach.q_dont_look_well:
    title: Preguntar qué le pasa a alguien
    gloss: 'Leila dice: No tienes buena cara. ¿Qué te pasa?'
    note: '*You don''t look well* significa: No tienes buena cara.'
  en.a1.unit22.lesson04.teach.a_headache_sore_throat:
    title: Respuesta de Daniel
    gloss: 'Daniel dice: Tengo dolor de cabeza y de garganta.'
    note: Daniel menciona dos molestias juntas.
  en.a1.unit22.lesson04.teach.q_do_you_have_fever:
    title: Preguntar por la fiebre
    gloss: 'Leila pregunta: ¿Tienes fiebre?'
    note: Con *Do you have a fever?* preguntas por una molestia concreta.
  en.a1.unit22.lesson04.teach.a_not_sure_feel_hot:
    title: Respuesta de Daniel
    gloss: 'Daniel dice: No estoy seguro, pero tengo calor.'
    note: Daniel no está seguro, pero dice cómo se siente.
  en.a1.unit22.lesson04.teach.a_rest_water_doctor:
    title: Consejo de Leila
    gloss: 'Leila dice: Deberías descansar y beber agua. Si no mejoras, deberías ir al médico.'
    note: Leila da primero un consejo sencillo y luego dice cuándo debería ir Daniel al médico.
  en.a1.unit22.lesson04.teach.a_okay_rest_today:
    title: Última respuesta de Daniel
    gloss: 'Daniel dice: Vale, gracias. Hoy descansaré.'
    note: Daniel acepta el consejo y dice qué hará hoy.
