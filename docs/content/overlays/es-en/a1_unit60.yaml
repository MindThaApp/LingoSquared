    title: Leila pregunta si Daniel está libre
    gloss: 'Leila dice: ¡Hola, Daniel! ¿Estás libre el sábado?'
    note: '*Are you free...?* pregunta si alguien está disponible.'
  en.a1.unit60.lesson03.teach.dialogue_line2:
    title: Daniel está libre
    gloss: 'Daniel dice: Sí, estoy libre.'
    note: '*I am free* significa estoy disponible.'
  en.a1.unit60.lesson03.teach.dialogue_line3:
    title: Leila invita a Daniel
    gloss: 'Leila dice: ¿Te gustaría venir a cenar?'
    note: '*Would you like to come...?* es cortés y amable.'
  en.a1.unit60.lesson03.teach.dialogue_line4:
