    gloss: 'Leila dice: Por favor, trae una bebida.'
    note: '*Please bring...* es una petición cortés.'
  en.a1.unit60.lesson03.teach.dialogue_line6:
    title: Daniel pregunta la hora
    gloss: 'Daniel dice: Claro. ¿A qué hora?'
    note: '*What time?* es una pregunta corta y natural.'
  en.a1.unit60.lesson03.teach.dialogue_line7:
    title: Leila dice las seis
    gloss: 'Leila dice: Nos vemos a las seis.'
    note: '*at six* usa *at* con una hora del reloj.'
  en.a1.unit60.lesson03.teach.dialogue_line8:
    title: Daniel da las gracias a Leila
    gloss: 'Daniel dice: Genial. Gracias por la invitación.'
    note: '*Thank you for...* usa *for* para indicar el motivo del agradecimiento.'
  en.a1.unit60.lesson04.teach.invitation_message:
    title: Invitación
    gloss: 'Invitación a cenar: sábado a las 6:00. Por favor, trae una bebida. Dirección: 18 Park Street.'
    note: La invitación indica el día, la hora, lo que Daniel debe llevar y la dirección.
  en.a1.unit60.lesson04.teach.reading_passage:
    title: 'Texto: Cena en casa de Leila'
    gloss: 'Cena en casa de Leila: Leila invitó a Daniel a cenar el sábado. Le pidió que llevara una bebida. Daniel dijo que podía ir. La invitación decía que la cena era a las 6:00 en el 18 de Park Street. Daniel anotó la dirección en su teléfono. Quería llegar a tiempo. Leila estaba contenta porque su amigo podía ir.'
    note: '*invited Daniel to dinner* significa que Leila invitó a Daniel a cenar.'
