teaching:
  en.a1.unit34.lesson01.teach.soccer:
    title: soccer
    gloss: fútbol
    note: '*soccer* significa fútbol. El verbo que lo acompaña es *play*: *play soccer*. En español también usamos un verbo distinto según el deporte (jugar al fútbol, hacer yoga, ir a nadar), y en inglés pasa lo mismo: con el nombre del deporte hay que recordar el verbo *play*, *go* o *do*.'
    example_gloss: Jugamos al fútbol los sábados.
  en.a1.unit34.lesson01.teach.tennis:
    title: tennis
    gloss: tenis
    note: '*tennis* significa tenis. Igual que con *soccer*, aquí se usa *play*: *play tennis*. En español decimos «jugar al tenis»; en inglés no lleva preposición ni artículo.'
    example_gloss: Ella juega al tenis todos los fines de semana.
  en.a1.unit34.lesson01.teach.basketball:
    title: basketball
    gloss: baloncesto
    note: '*basketball* significa baloncesto. También aquí se usa *play*: *play basketball*, como con *soccer* y *tennis*. Con los deportes de pelota, el inglés usa siempre *play* + el nombre del deporte.'
    example_gloss: Juegan al baloncesto en el parque.
  en.a1.unit34.lesson01.teach.swimming:
    title: swimming
    gloss: natación
    note: '*swimming* significa natación (o nadar). Aquí cambia el verbo: *go swimming* (no *play swimming*). El inglés usa *go* + la forma en *-ing* para actividades como nadar o correr. En español decimos «ir a nadar» o simplemente «nadar», con el verbo en infinitivo.'
    example_gloss: Voy a nadar dos veces por semana.
  en.a1.unit34.lesson01.teach.yoga:
    title: yoga
    gloss: yoga
    note: '*yoga* significa yoga. El verbo es *do*: *do yoga*. El inglés usa *do* para actividades individuales como el yoga, no *play* ni *go*. En español también decimos «hacer yoga», así que este verbo coincide. Pero recuerda que en inglés hay tres verbos (*play*, *go*, *do*) que debes aprender según el tipo de deporte.'
    example_gloss: Él hace yoga por las mañanas.
  en.a1.unit34.lesson01.teach.exercise:
    title: exercise
    gloss: hacer ejercicio
    note: '*exercise* significa hacer ejercicio: una palabra general para la actividad física. A diferencia de *soccer*, *swimming* y *yoga*, *exercise* también puede usarse como verbo por sí solo, sin *play*, *go* ni *do*: *Do you exercise every day?*'
    example_gloss: ¿Haces ejercicio todos los días?
  en.a1.unit34.lesson02.teach.twice_a_week:
    title: twice a week
    gloss: dos veces por semana
    note: '*twice a week* significa dos veces por semana. Aquí la palabra *a* no significa «un», sino «por»: número + *a* + unidad de tiempo indica cuántas veces ocurre algo en ese periodo. En español también podemos decir «dos veces a la semana».'
    example_gloss: Él juega al tenis dos veces por semana.
  en.a1.unit34.lesson02.teach.three_times_a_week:
    title: three times a week
    gloss: tres veces por semana
    note: '*three times a week* significa tres veces por semana. Igual que en *twice a week*, *a* significa aquí «por», no «un»: *times* (veces) más *a week* (por semana) indica cuántas veces por semana.'
    example_gloss: Ella nada tres veces por semana.
  en.a1.unit34.lesson02.teach.on_weekends:
    title: on weekends
    gloss: los fines de semana
    note: '*on weekends* significa los fines de semana. El inglés usa la preposición *on* y no lleva artículo, mientras que en español usamos el artículo plural («los fines de semana»).'
    example_gloss: Jugamos al baloncesto los fines de semana.
  en.a1.unit34.lesson02.teach.gym:
    title: gym
    gloss: gimnasio
    note: gym significa gimnasio, un lugar con aparatos y clases para hacer ejercicio.
    example_gloss: Él hace yoga en el gimnasio.
  en.a1.unit34.lesson02.teach.pool:
    title: pool
    gloss: piscina
    note: pool significa piscina, un lugar lleno de agua para nadar.
    example_gloss: Voy a nadar a la piscina.
  en.a1.unit34.lesson02.teach.how_often_question:
    title: How often do you exercise?
    gloss: ¿Con qué frecuencia haces ejercicio?
    note: 'Esta pregunta empieza con *how often* (con qué frecuencia). Después viene el auxiliar *do*, porque el verbo principal es *exercise*: es el mismo auxiliar que en otras preguntas en inglés.'
  en.a1.unit34.lesson03.teach.dialogue_line1:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: ¿Quieres jugar al fútbol con nosotros el sábado?'
    note: Inicio de la conversación con una invitación a jugar al fútbol. Con *soccer* se usa *play*.
  en.a1.unit34.lesson03.teach.dialogue_line2:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: No me gusta mucho el fútbol. Prefiero nadar.'
    note: '*don''t really like* significa «no me gusta mucho»: una forma más suave de decir que no.'
  en.a1.unit34.lesson03.teach.dialogue_line3:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: ¡Está bien! ¿Con qué frecuencia vas a nadar?'
    note: '*go swimming*: con nadar se usa *go*, no *play* ni *do*.'
  en.a1.unit34.lesson03.teach.dialogue_line4:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Dos veces por semana, normalmente en la piscina cerca de mi casa.'
    note: '*Twice a week*: aquí también *a* significa «por».'
  en.a1.unit34.lesson03.teach.dialogue_line5:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: ¡Qué bien! Yo también hago yoga a veces, pero correr sigue siendo mi favorito.'
    note: '*do yoga*: con yoga se usa *do*, distinto de *play* y *go*.'
  en.a1.unit34.lesson04.teach.reading_passage:
    title: Texto sobre Daniel, Leila y Mia
    gloss: Daniel, Leila y Mia se mantienen activos cada uno a su manera. Daniel sale a correr todas las mañanas antes del trabajo. Leila prefiere nadar; va a la piscina dos veces por semana. Mia es nueva en el equipo, pero ya juega al tenis todos los domingos con su vecina. Los sábados, a veces juegan juntos al fútbol en el parque, pero el fútbol no es el deporte favorito de nadie.
    note: 'Este texto usa los tres verbos: *goes running* (*go*), *plays tennis* y *play soccer* (*play*). Cada deporte tiene su propio verbo.'
