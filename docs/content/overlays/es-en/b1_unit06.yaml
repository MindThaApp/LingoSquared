teaching:
  en.b1.unit06.lesson01.teach.while:
    title: while
    gloss: mientras
    note: '*while* significa que algo ocurre al mismo tiempo que otra cosa.'
    example_gloss: Mientras yo conducía, empezó a llover.
  en.b1.unit06.lesson01.teach.flat_tire:
    title: flat tire
    gloss: pinchazo, neumático desinflado
    note: '*flat tire* es un neumático sin aire que ya no sirve para rodar.'
    example_gloss: Se me pinchó el neumático en la autopista.
  en.b1.unit06.lesson01.teach.pull_over:
    title: pull over
    gloss: detenerse a un lado de la carretera
    note: '*pull over* significa parar el auto a un lado del camino.'
    example_gloss: Tuve que detenerme a un lado de inmediato.
  en.b1.unit06.lesson01.teach.stranger:
    title: stranger
    gloss: desconocido, extraño
    note: '*stranger* es una persona a la que no conoces.'
    example_gloss: Un desconocido se detuvo para ayudarme.
  en.b1.unit06.lesson01.teach.mechanic:
    title: mechanic
    gloss: mecánico
    note: '*mechanic* es una persona que repara autos.'
    example_gloss: El mecánico arregló mi neumático rápidamente.
  en.b1.unit06.lesson01.teach.said_that:
    title: said that
    gloss: dijo que
    note: '*said that* se usa para contar lo que dijo otra persona.'
    example_gloss: Dijo que podía ayudar.
  en.b1.unit06.lesson02.teach.while_driving_tire_went_flat:
    title: Lo que ocurre de fondo con 'while'
    gloss: Mientras yo conducía al trabajo, se me pinchó un neumático.
    note: '*while* + pasado con *was/were* + -ing describe la acción de fondo que otro hecho interrumpe.'
  en.b1.unit06.lesson02.teach.when_pulled_over_stranger_helped:
    title: Un hecho posterior con 'when'
    gloss: Cuando me detuve a un lado, un desconocido paró para ayudar.
    note: '*when* introduce el siguiente hecho de la historia.'
  en.b1.unit06.lesson02.teach.grammar_while_when_sequencing:
    title: '''while'' y ''when'' en una historia'
    gloss: Mientras conducía, se me pinchó un neumático. Cuando me detuve a un lado, un desconocido me ayudó.
    note: '*while* marca el fondo (una acción en curso); *when* marca el siguiente hecho, más breve, que ocurre dentro de ese fondo.'
  en.b1.unit06.lesson03.teach.had_already_called:
    title: had already called
    gloss: ya había llamado
    note: '*had already* + participio describe algo que ya había pasado antes de otro momento del pasado.'
    example_gloss: Cuando él llegó, yo ya había llamado a Daniel.
  en.b1.unit06.lesson03.teach.kept_his_word:
    title: kept his word
    gloss: cumplió su palabra
    note: '*kept his word* significa que alguien hizo lo que había prometido.'
    example_gloss: Cumplió su palabra y lo arregló en diez minutos.
  en.b1.unit06.lesson03.teach.reading_passage:
    title: 'Lectura: la historia del pinchazo'
    gloss: Ayer por la mañana, mientras Leila conducía al trabajo, de repente se le pinchó un neumático. Se detuvo en una calle tranquila. Un desconocido paró su auto y se ofreció a ayudar. Cuando llegó el mecánico, Leila ya había llamado a Daniel para avisarle que llegaría tarde. El mecánico dijo que podía arreglar el neumático en diez minutos. Cumplió su palabra, y Leila llegó al trabajo solo veinte minutos tarde.
    note: Una historia en pasado con una acción de fondo (*while*), una secuencia de hechos (*when*) y algo que ya había ocurrido antes (*had already*).
  en.b1.unit06.lesson04.teach.q_youre_late_what_happened:
    title: Daniel se da cuenta de que Leila llega tarde
    gloss: 'Daniel dice: ¡Llegas tarde! ¿Qué pasó?'
    note: Una pregunta directa y preocupada con la que empieza la historia.
  en.b1.unit06.lesson04.teach.a_tire_went_flat_suddenly:
    title: Leila empieza su historia
    gloss: 'Leila dice: Mientras conducía al trabajo, de repente se me pinchó un neumático.'
    note: '*while* marca el fondo en el que ocurrió otra cosa.'
  en.b1.unit06.lesson04.teach.q_oh_no_what_did_you_do:
    title: Daniel pregunta
    gloss: 'Daniel dice: ¡Ay, no! ¿Qué hiciste?'
    note: Una pregunta corta para seguir escuchando la historia.
  en.b1.unit06.lesson04.teach.a_pulled_over_stranger_helped:
    title: Leila sigue contando
    gloss: 'Leila dice: Me detuve a un lado y un desconocido paró para ayudarme.'
    note: El siguiente hecho de la historia, después de la acción de fondo.
  en.b1.unit06.lesson04.teach.q_kind_of_him_call_mechanic:
    title: Daniel reacciona y sigue preguntando
    gloss: 'Daniel dice: Qué amable de su parte. ¿Llamaste a un mecánico?'
    note: '*that was kind of him* es una reacción natural ante la amabilidad de alguien.'
  en.b1.unit06.lesson04.teach.a_had_already_called_mechanic_said:
    title: Leila termina la historia
    gloss: 'Leila dice: Sí, ya había llamado a uno antes de que llegara el desconocido. El mecánico dijo que podía arreglarlo en diez minutos, ¡y lo hizo!'
    note: '*had already called* muestra lo que ya había pasado antes de que llegara el desconocido.'
