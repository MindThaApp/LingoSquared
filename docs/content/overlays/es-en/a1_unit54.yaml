teaching:
  en.a1.unit54.lesson01.teach.laundromat:
    title: laundromat
    gloss: lavandería autoservicio
    note: '*laundromat* significa lavandería de autoservicio: un lugar con lavadoras donde pagas para lavar tu ropa.'
    example_gloss: Hoy voy a la lavandería.
  en.a1.unit54.lesson01.teach.washing_machine:
    title: washing machine
    gloss: lavadora
    note: '*washing machine* significa lavadora.'
    example_gloss: La lavadora está estropeada.
  en.a1.unit54.lesson01.teach.dryer:
    title: dryer
    gloss: secadora
    note: '*dryer* significa secadora.'
    example_gloss: Pon tu ropa en la secadora.
  en.a1.unit54.lesson01.teach.quarters:
    title: quarters
    gloss: monedas de 25 centavos (estadounidenses)
    note: '*quarters* son monedas estadounidenses de veinticinco centavos, que suelen hacer falta para las lavadoras de una lavandería. No tienen un equivalente exacto en español, así que *quarters* se suele dejar en inglés.'
    example_gloss: Las máquinas aceptan monedas de 25 centavos.
  en.a1.unit54.lesson01.teach.detergent:
    title: detergent
    gloss: detergente
    note: '*detergent* significa detergente.'
    example_gloss: Necesitas detergente para limpiar tu ropa.
  en.a1.unit54.lesson01.teach.load:
    title: load
    gloss: colada / carga
    note: 'Aquí, *load* significa una colada: la cantidad de ropa que lavas de una vez.'
    example_gloss: Tengo una colada grande.
  en.a1.unit54.lesson02.teach.id_like_to_wash_a_few_things:
    title: I'd like to wash a few things, please.
    gloss: Quisiera lavar unas cuantas cosas, por favor.
    note: '*I''d like to* (contracción de *I would like to*) es la forma cortés de pedir algo.'
  en.a1.unit54.lesson02.teach.do_you_have_change:
    title: Do you have change for the machines?
    gloss: ¿Tiene cambio para las máquinas?
    note: Aquí, *change* significa cambio (monedas sueltas), no modificación.
  en.a1.unit54.lesson02.teach.how_long_does_the_cycle_take:
    title: How long does the wash cycle take?
    gloss: ¿Cuánto dura el ciclo de lavado?
    note: Aquí, *take* significa durar (necesitar cierto tiempo), un uso muy distinto al de *the machines take quarters*, donde *take* significa aceptar. En inglés se usa el mismo verbo, *take*, para ambos sentidos.
  en.a1.unit54.lesson02.teach.its_three_dollars_for_one_load:
    title: It's three dollars for one load.
    gloss: Son tres dólares por una colada.
    note: '*for one load* significa por una colada.'
  en.a1.unit54.lesson02.teach.what_time_do_you_close:
    title: What time do you close?
    gloss: ¿A qué hora cierran?
    note: '*do you close* usa el auxiliar *do* para formar la pregunta.'
  en.a1.unit54.lesson02.teach.please_pick_up_by_nine:
    title: Please pick up your laundry by nine o'clock.
    gloss: Por favor, recoja su ropa antes de las nueve.
    note: '*pick up* significa recoger; *by nine o''clock* significa antes de las nueve (a más tardar a esa hora).'
  en.a1.unit54.lesson03.teach.dialogue_line1:
    title: El empleado los saluda
    gloss: 'El empleado dice: ¡Hola! ¿Necesitan una lavadora?'
    note: '*Do you need...?* usa el auxiliar *do* para formar la pregunta.'
  en.a1.unit54.lesson03.teach.dialogue_line2:
    title: El motivo de Leila
    gloss: 'Leila dice: Sí, por favor. Mi lavadora de casa está estropeada.'
    note: '*at home* significa en casa.'
  en.a1.unit54.lesson03.teach.dialogue_line3:
    title: La petición de Daniel
    gloss: 'Daniel dice: Yo también tengo una colada pequeña. ¿Puedo usar yo también una máquina?'
    note: Aquí, *too* significa también y va al final de la frase; *as well* tiene el mismo significado y aparece en la segunda frase.
  en.a1.unit54.lesson03.teach.dialogue_line4:
    title: El empleado habla de las monedas
    gloss: 'El empleado dice: ¡Claro! Las máquinas aceptan monedas de 25 centavos.'
    note: Aquí, *take* significa aceptar (como pago); fíjate en la diferencia con *take* en *The wash cycle takes thirty minutes*, más abajo, donde significa durar.
  en.a1.unit54.lesson03.teach.dialogue_line5:
    title: Leila tiene monedas
    gloss: 'Leila dice: Sí, tengo monedas de 25 centavos.'
    note: Una confirmación breve, no un dato nuevo.
  en.a1.unit54.lesson03.teach.dialogue_line6:
    title: La duración del ciclo de lavado
    gloss: 'El empleado dice: El ciclo de lavado dura treinta minutos.'
    note: Aquí, *take* significa durar, un sentido distinto al de *take* en *take quarters*, más arriba.
  en.a1.unit54.lesson03.teach.dialogue_line7:
    title: Daniel pregunta el precio
    gloss: 'Daniel dice: ¿Y cuánto cuesta?'
    note: '*How much does it cost?* usa de nuevo el auxiliar *does* para formar la pregunta.'
  en.a1.unit54.lesson03.teach.dialogue_line8:
    title: El precio
    gloss: 'El empleado dice: Son tres dólares por una colada.'
    note: Un dato aparte, independiente del número de monedas y de la duración.
  en.a1.unit54.lesson03.teach.dialogue_line9:
    title: La hora de cierre
    gloss: 'El empleado dice: La lavandería cierra a las nueve, así que recoja su ropa antes de esa hora.'
    note: 'Aquí, *so* significa así que o por eso: une la hora de cierre con la indicación de llegar a tiempo.'
  en.a1.unit54.lesson04.teach.reading_passage:
    title: 'Texto: Una visita a la lavandería'
    gloss: Una tarde, la lavadora de casa de Leila se estropeó. Decidió ir a la lavandería de más abajo en la calle. Daniel la acompañó porque él también tenía una colada pequeña. En la lavandería, el empleado les explicó que las máquinas aceptan monedas de 25 centavos y que el ciclo de lavado dura treinta minutos. Costó tres dólares por una colada. Mientras su ropa se lavaba, Daniel y Leila charlaron y tomaron un café en una cafetería de al lado. La lavandería cierra a las nueve, así que se aseguraron de recoger su ropa antes de esa hora. Leila agradeció a Daniel que le hiciera compañía y dijo que la lavadora de casa probablemente estaría arreglada para el fin de semana.
    note: '*would be fixed* significa estaría arreglada: Leila espera que la máquina se arregle, pero todavía no es seguro.'
