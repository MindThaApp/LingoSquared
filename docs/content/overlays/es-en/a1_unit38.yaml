teaching:
  en.a1.unit38.lesson01.teach.chore:
    title: chore
    gloss: tarea doméstica
    note: '*chore* significa tarea doméstica: algo que haces con regularidad para mantener tu casa limpia y ordenada.'
    example_gloss: Lavar los platos es la tarea doméstica que menos me gusta.
  en.a1.unit38.lesson01.teach.dishes:
    title: dishes
    gloss: platos / vajilla
    note: '*dishes* significa los platos: platos, tazas y cubiertos que lavas.'
    example_gloss: Lavo los platos después de la cena.
  en.a1.unit38.lesson01.teach.laundry:
    title: laundry
    gloss: la colada / la ropa sucia
    note: '*laundry* significa la colada: la ropa que lavas, secas y doblas.'
    example_gloss: Ella lava la ropa los domingos.
  en.a1.unit38.lesson01.teach.vacuum:
    title: vacuum
    gloss: pasar la aspiradora
    note: '*vacuum* significa pasar la aspiradora.'
    example_gloss: Él pasa la aspiradora por la sala todos los sábados.
  en.a1.unit38.lesson01.teach.trash:
    title: trash
    gloss: basura
    note: '*trash* significa basura.'
    example_gloss: ¿Puedes sacar la basura?
  en.a1.unit38.lesson01.teach.clean:
    title: clean
    gloss: limpiar
    note: '*clean* significa limpiar.'
    example_gloss: Limpiamos el apartamento juntos.
  en.a1.unit38.lesson02.teach.wash_the_dishes:
    title: wash the dishes
    gloss: lavar los platos
    note: '*wash the dishes* significa lavar los platos. *Do the dishes* es igual de común y significa lo mismo.'
    example_gloss: Lavo los platos todas las noches.
  en.a1.unit38.lesson02.teach.do_the_laundry:
    title: do the laundry
    gloss: lavar la ropa
    note: '*do the laundry* significa lavar la ropa, hacer la colada.'
    example_gloss: Ella lava la ropa los domingos.
  en.a1.unit38.lesson02.teach.take_out_the_trash:
    title: take out the trash
    gloss: sacar la basura
    note: '*take out the trash* usa *take out*, no *do*. A diferencia de *do the laundry* o *do the dishes*, aquí no se puede usar *do*.'
    example_gloss: ¿Puedes sacar la basura?
  en.a1.unit38.lesson02.teach.clean_the_bathroom:
    title: clean the bathroom
    gloss: limpiar el baño
    note: '*clean the bathroom* significa limpiar el baño.'
    example_gloss: Él limpia el baño los fines de semana.
  en.a1.unit38.lesson02.teach.need_to:
    title: need to
    gloss: tener que
    note: '*need to* significa tener que hacer algo, necesitar hacerlo.'
    example_gloss: Tengo que pasar la aspiradora por la sala este fin de semana.
  en.a1.unit38.lesson02.teach.can_you_help_me_with_question:
    title: Can you help me with the dishes?
    gloss: ¿Me ayudas con los platos?
    note: Una forma amable de pedir ayuda con una tarea doméstica.
  en.a1.unit38.lesson03.teach.dialogue_line1:
    title: Mia's probleem
    gloss: 'Mia dice: Mi apartamento es un desastre. Este fin de semana vienen visitas.'
    note: '*a mess* significa un desastre o un desorden.'
  en.a1.unit38.lesson03.teach.dialogue_line2:
    title: El ofrecimiento de Daniel
    gloss: 'Daniel pregunta: ¿Quieres ayuda para limpiarlo?'
    note: '*Do you want some help ...ing?* es una forma natural de ofrecer ayuda.'
  en.a1.unit38.lesson03.teach.dialogue_line3:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: ¡Sí, por favor! Tengo que pasar la aspiradora por la sala y lavar los platos.'
    note: '*I need to* + verbo significa «tengo que» + verbo.'
  en.a1.unit38.lesson03.teach.dialogue_line4:
    title: El ofrecimiento de Daniel
    gloss: 'Daniel dice: Yo puedo pasar la aspiradora por ti. Tú puedes lavar los platos.'
    note: '*for you* significa aquí «por ti», en el sentido de «en tu lugar».'
  en.a1.unit38.lesson03.teach.dialogue_line5:
    title: Lo que añade Mia
    gloss: 'Mia dice: ¡Gracias! Todavía tengo que lavar la ropa también.'
    note: '*still need to* significa «todavía tengo que».'
  en.a1.unit38.lesson03.teach.dialogue_line6:
    title: El ofrecimiento de Daniel
    gloss: 'Daniel dice: Hoy no tengo tiempo para eso, pero puedo sacar la basura antes de irme.'
    note: '*before I leave* significa «antes de irme».'
  en.a1.unit38.lesson03.teach.dialogue_line7:
    title: El agradecimiento de Mia
    gloss: 'Mia dice: Eso ayudaría muchísimo. ¡Muchas gracias!'
    note: '*That would help a lot* significa «eso ayudaría muchísimo». *Would* lo hace más cortés.'
  en.a1.unit38.lesson04.teach.reading_passage:
    title: Texto sobre las tareas en casa
    gloss: Daniel, Leila y Mia tienen cada uno sus propios hábitos con las tareas del hogar. Daniel lava los platos todas las noches después de la cena y pasa la aspiradora por su apartamento los sábados. A Leila no le molesta lavar la ropa, pero odia limpiar el baño. La gata de Mia, Luna, deja pelo por todas partes, así que Mia pasa la aspiradora por su apartamento casi todos los días. El fin de semana pasado, Mia tenía visitas, así que Daniel se ofreció a ayudarla. Pasó la aspiradora por la sala y sacó la basura por ella. Mia estuvo muy agradecida por su ayuda.
    note: '*doesn''t mind* significa «no le molesta».'
