teaching:
  en.a1.unit01.lesson01.teach.hello:
    title: Hello
    gloss: Hola
    note: '*Hello* es el saludo neutro y universal; sirve en casi cualquier situación.'
    example_gloss: ¡Hola, Daniel!
  en.a1.unit01.lesson01.teach.hi:
    title: Hi
    gloss: Hola (informal)
    note: '*Hi* es más informal que *Hello*, como el «hola» que se dice entre amigos.'
    example_gloss: ¡Hola, Leila!
  en.a1.unit01.lesson01.teach.good_morning:
    title: Good morning
    gloss: Buenos días
    note: '*Good morning* se usa por la mañana, igual que «buenos días» en español.'
  en.a1.unit01.lesson01.teach.good_afternoon:
    title: Good afternoon
    gloss: Buenas tardes
    note: '*Good afternoon* se usa por la tarde; en inglés no hay un saludo equivalente a «buenas», que vale para cualquier momento del día.'
  en.a1.unit01.lesson01.teach.good_evening:
    title: Good evening
    gloss: Buenas noches (al llegar)
    note: '*Good evening* se usa al caer la tarde y por la noche, como saludo.'
  en.a1.unit01.lesson01.teach.goodbye:
    title: Goodbye
    gloss: Adiós
    note: '*Goodbye* es la despedida neutra y universal.'
    example_gloss: ¡Adiós, hasta mañana!
  en.a1.unit01.lesson01.teach.bye:
    title: Bye
    gloss: Chao
    note: '*Bye* es más informal que *Goodbye*, parecido a «chao».'
    example_gloss: ¡Chao, hasta pronto!
  en.a1.unit01.lesson03.teach.how_are_you:
    title: How are you?
    gloss: ¿Cómo estás? / ¿Cómo está usted?
    note: '*How are you?* sirve tanto en situaciones formales como informales; a diferencia del español, no distingue entre *tú* y *usted*.'
  en.a1.unit01.lesson03.teach.im_fine:
    title: I'm fine, thanks.
    gloss: Estoy bien, gracias.
    note: Una respuesta sencilla y neutra.
  en.a1.unit01.lesson03.teach.im_good:
    title: I'm good, thanks.
    gloss: Estoy bien, gracias.
    note: Significa lo mismo que *I'm fine, thanks*; las dos se usan por igual en el día a día.
  en.a1.unit01.lesson03.teach.not_bad:
    title: Not bad, thanks.
    gloss: No está mal, gracias.
    note: 'Una respuesta informal y algo reservada: ni muy bien ni mal.'
  en.a1.unit01.lesson03.teach.and_you:
    title: And you?
    gloss: ¿Y tú? / ¿Y usted?
    note: Sirve para devolver la pregunta en cualquier registro, sin distinguir entre formal e informal.
  en.a1.unit01.lesson03.teach.are_you_okay:
    title: Are you okay?
    gloss: ¿Estás bien?
    note: '*Are you okay?* pregunta más bien si a alguien le pasa algo en ese momento; no es un saludo general como *How are you?*'
  en.a1.unit01.lesson05.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Mucho gusto. / Encantado de conocerte.
    note: Se dice cuando conoces a alguien por primera vez.
  en.a1.unit01.lesson05.teach.nice_to_meet_you_too:
    title: Nice to meet you too.
    gloss: Igualmente.
    note: Es la respuesta adecuada a *Nice to meet you*.
  en.a1.unit01.lesson05.teach.see_you_later:
    title: See you later.
    gloss: Hasta luego.
    note: Se usa cuando vas a ver a la persona más tarde ese mismo día, como «hasta luego» en español.
  en.a1.unit01.lesson05.teach.have_a_good_day:
    title: Have a good day.
    gloss: Que tengas un buen día.
    note: Una despedida amable que desea a la otra persona que el resto del día le vaya bien.
