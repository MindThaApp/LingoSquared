  en.b1.unit08.lesson01.teach.by_the_time:
    title: by the time
    gloss: para cuando, a más tardar cuando
    note: '*by the time* significa a más tardar en el momento en que algo ocurre.'
    example_gloss: Para cuando llegue Mia, la cena estará lista.
  en.b1.unit08.lesson01.teach.check_in:
    title: check in
    gloss: avisar que llegaste o que estás bien
    note: '*check in* significa avisar brevemente a alguien de que ya llegaste o de que estás bien.'
    example_gloss: Avísame cuando llegues al hotel.
