teaching:
  en.b1.unit08.lesson01.teach.before:
    title: before
    gloss: antes de, antes de que
    note: '*before* significa antes que otro suceso.'
    example_gloss: Lávate las manos antes de cocinar.
  en.b1.unit08.lesson01.teach.after:
    title: after
    gloss: después de, después de que
    note: '*after* significa más tarde que otro suceso.'
