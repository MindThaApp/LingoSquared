    example_gloss: Cierro con llave antes de salir de la oficina.
  en.b1.unit08.lesson02.teach.as_soon_as_home:
    title: Etwas sofort danach tun
    gloss: En cuanto llegue a casa, te llamo.
    note: '*as soon as* indica que la segunda acción ocurre inmediatamente después de la primera.'
  en.b1.unit08.lesson02.teach.before_upstairs:
    title: Zuerst etwas tun
    gloss: Antes de subir, por favor revisa el correo.
    note: '*before* indica qué acción debe ocurrir primero.'
  en.b1.unit08.lesson02.teach.grammar_future_time_clause:
    title: Präsens in Zeitsätzen
    gloss: Cuando llegue a casa, te llamo. Antes de subir, por favor revisa el correo.
    note: 'En las oraciones temporales del inglés, el suceso futuro va en presente simple: *when I get home*, no *when I will get home*. En español se usa el subjuntivo («cuando llegue»), pero en inglés basta el presente simple.'
  en.b1.unit08.lesson03.teach.front_door:
    title: front door
    gloss: puerta de entrada
    note: '*front door* es la puerta principal, en la parte delantera de una casa o un edificio.'
    example_gloss: Daniel cierra con llave la puerta de entrada después de revisar el correo.
  en.b1.unit08.lesson03.teach.ready:
    title: ready
    gloss: listo
    note: '*ready* significa preparado o listo para usarse.'
    example_gloss: Para cuando llegue Mia, la cena estará lista.
  en.b1.unit08.lesson03.teach.reading_passage:
    title: 'Lesetext: der Abendplan'
    gloss: Daniel tiene una rutina de noche muy cuidadosa. Cuando llega a casa, lo primero que hace es revisar el correo. Después de revisar el correo, cierra con llave la puerta de entrada. Antes de empezar la cena, se lava las manos y despeja la mesa. Para cuando llega Mia, la cocina está lista y la comida está caliente.
    note: Una lectura breve con *when*, *after*, *before* y *by the time*.
  en.b1.unit08.lesson04.teach.q_call_when_home:
    title: Leila bittet um einen Anruf
    gloss: 'Leila dice: Daniel, ¿me llamas cuando llegues a casa?'
    note: Una pregunta con *when* para indicar el momento de la acción.
  en.b1.unit08.lesson04.teach.a_as_soon_as_home:
    title: Daniel verspricht, sofort anzurufen
    gloss: 'Daniel dice: Claro. En cuanto llegue a casa, te llamo.'
    note: '*as soon as* deja claro que llama de inmediato.'
  en.b1.unit08.lesson04.teach.q_check_mail:
    title: Leila gibt eine erste Aufgabe
    gloss: 'Leila dice: Por favor, revisa el correo antes de subir.'
    note: '*before* indica que lo del correo va primero.'
  en.b1.unit08.lesson04.teach.a_after_mail_lock:
    title: Daniel nennt den nächsten Schritt
    gloss: 'Daniel dice: Claro. Después de revisar el correo, cierro con llave la puerta de entrada.'
    note: '*after* indica el orden entre dos acciones.'
  en.b1.unit08.lesson04.teach.q_by_the_time_mia:
    title: Leila nennt den Zeitpunkt
    gloss: 'Leila dice: Perfecto. Para cuando llegue Mia, todo debería estar listo.'
    note: '*by the time* significa que todo debe estar listo en ese momento o antes.'
  en.b1.unit08.lesson04.teach.a_start_dinner:
    title: Daniel schließt den Plan ab
    gloss: 'Daniel dice: Entonces podemos empezar la cena cuando ella llegue.'
    note: '*when she arrives* indica el momento en que pueden empezar.'
