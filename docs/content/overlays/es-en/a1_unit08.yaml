teaching:
  en.a1.unit08.lesson01.teach.a_pound_of:
    title: a pound of apples
    gloss: una libra de manzanas
    note: '*a pound* es una unidad de peso (unos 454 gramos), habitual en EE. UU. para fruta y verdura.'
  en.a1.unit08.lesson01.teach.a_dozen:
    title: a dozen eggs
    gloss: una docena de huevos
    note: '*a dozen* significa doce unidades.'
  en.a1.unit08.lesson01.teach.a_bottle_of:
    title: a bottle of water
    gloss: una botella de agua
    note: '*a bottle of* significa «una botella de...».'
  en.a1.unit08.lesson01.teach.a_bag_of:
    title: a bag of rice
    gloss: una bolsa de arroz
    note: '*a bag of* significa «una bolsa de...», para productos sueltos como el arroz.'
  en.a1.unit08.lesson01.teach.a_kilo_of:
    title: a kilo of tomatoes
    gloss: un kilo de tomates
    note: '*a kilo of* significa un kilo; en EE. UU. en el día a día se pesa sobre todo en *pounds* y *kilo* se oye menos.'
  en.a1.unit08.lesson02.teach.how_much_are:
    title: How much are the apples?
    gloss: ¿Cuánto cuestan las manzanas?
    note: '*How much are...?* pregunta el precio de algo en plural.'
  en.a1.unit08.lesson02.teach.two_dollars_a_pound:
    title: They're two dollars a pound.
    gloss: Cuestan dos dólares la libra.
    note: '*a pound* al final de la frase significa aquí «por libra», igual que *per pound*.'
  en.a1.unit08.lesson02.teach.can_i_have_two_pounds:
    title: Can I have two pounds, please?
    gloss: ¿Me pone dos libras, por favor?
    note: '*Can I have...?* es una fórmula educada para pedir al comprar.'
  en.a1.unit08.lesson02.teach.is_it_fresh:
    title: Is it fresh?
    gloss: ¿Está fresco?
    note: Una pregunta útil con alimentos frescos como la fruta o la verdura.
  en.a1.unit08.lesson03.teach.per_pound:
    title: per pound
    gloss: por libra
    note: '*per pound* indica el precio por unidad de peso, por ejemplo en los carteles de precios.'
    example_gloss: Las manzanas cuestan dos dólares por libra.
  en.a1.unit08.lesson03.teach.label_text:
    title: Preisschild
    gloss: 'Manzanas: 2 dólares por libra. Huevos: 4 dólares la docena. Arroz: 3 dólares la bolsa.'
    note: El signo del dólar va ANTES del número (*$2*), a diferencia del signo del euro, que en español va DESPUÉS.
  en.a1.unit08.lesson04.teach.thats_x_dollars:
    title: That's eight dollars.
    gloss: Son ocho dólares.
    note: '*That''s X dollars* equivale a «Son X dólares».'
  en.a1.unit08.lesson04.teach.q_price:
    title: Frage von Daniel
    gloss: 'Daniel: ¿Cuánto cuestan las manzanas?'
    note: Daniel abre la conversación con una pregunta sobre el precio.
  en.a1.unit08.lesson04.teach.a_price:
    title: Antwort von Leila
    gloss: 'Leila: Cuestan dos dólares la libra.'
    note: Leila dice el precio por libra.
  en.a1.unit08.lesson04.teach.q_two_pounds:
    title: Bestellung von Daniel
    gloss: 'Daniel: Vale, ¿me pone dos libras, por favor?'
    note: '*OK* confirma que Daniel acepta el precio antes de pedir.'
  en.a1.unit08.lesson04.teach.a_sure_anything_else:
    title: Nachfrage von Leila
    gloss: 'Leila: Claro. ¿Algo más?'
    note: '*Sure* significa aquí «claro» o «con gusto».'
  en.a1.unit08.lesson04.teach.q_eggs_too:
    title: Zusatzbestellung von Daniel
    gloss: 'Daniel: Sí, también una docena de huevos.'
    note: '*too* al final de la frase significa «también».'
  en.a1.unit08.lesson04.teach.a_total:
    title: Abschluss von Leila
    gloss: 'Leila: Son ocho dólares.'
    note: Leila dice el precio total de las manzanas y los huevos juntos.
