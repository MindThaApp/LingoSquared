teaching:
  en.a2.unit39.lesson01.teach.offer:
    title: offer
    gloss: oferta
    note: Aquí *offer* es la oferta de un puesto de trabajo. Como verbo, *to offer* significa ofrecer.
    example_gloss: Recibí una oferta de trabajo de Bright Path Marketing.
  en.a2.unit39.lesson01.teach.contract:
    title: contract
    gloss: contrato
    note: '*contract* es el acuerdo escrito entre tú y la empresa.'
    example_gloss: El contrato es por un año.
  en.a2.unit39.lesson01.teach.salary:
    title: salary
    gloss: salario
    note: '*salary* es lo que ganas por mes o por año.'
    example_gloss: Podemos hablar del salario la semana que viene.
  en.a2.unit39.lesson01.teach.accept:
    title: accept
    gloss: aceptar
    note: '*accept* significa decir que sí a algo que te ofrecen.'
    example_gloss: Me gustaría aceptar el puesto.
  en.a2.unit39.lesson01.teach.start_date:
    title: start date
    gloss: fecha de inicio
    note: '*start date* es el primer día en tu nuevo trabajo.'
    example_gloss: La fecha de inicio es el primer lunes del mes.
  en.a2.unit39.lesson01.teach.reply:
    title: reply
    gloss: respuesta
    note: '*reply* es tanto la respuesta a un mensaje como el verbo responder.'
    example_gloss: Envié una respuesta el mismo día.
  en.a2.unit39.lesson01.teach.grammar_would_like_to:
    title: would like to para un deseo educado
    gloss: Me gustaría aceptar la oferta. Me gustaría empezar el lunes.
    note: '*I would like to ...* es más cortés que *I want to ...* y encaja bien en el contacto profesional.'
  en.a2.unit39.lesson02.teach.thank_you_for_the_interview:
    title: Empezar el mensaje
    gloss: Gracias por la entrevista de ayer.
    note: '*Thank you for ...* es el comienzo habitual de un breve mensaje de agradecimiento profesional.'
  en.a2.unit39.lesson02.teach.still_interested:
    title: Decir que sigues interesado
    gloss: Sigo muy interesada en el puesto.
    note: '*still* significa «todavía» o «aún» y va antes del adjetivo.'
  en.a2.unit39.lesson02.teach.could_you_tell_me_start_date:
    title: Preguntar con cortesía la fecha de inicio
    gloss: ¿Podría decirme la fecha de inicio?
    note: '*Could you tell me ...?* es una pregunta indirecta y más cortés que *When is the start date?*'
  en.a2.unit39.lesson02.teach.would_like_to_accept:
    title: Aceptar la oferta
    gloss: Me gustaría aceptar la oferta.
    note: Esta es la frase habitual para aceptar un puesto.
  en.a2.unit39.lesson02.teach.grammar_indirect_questions:
    title: Preguntas indirectas con Could you tell me
    gloss: ¿Podría decirme la fecha de inicio? ¿Podría contarme sobre el horario de trabajo?
    note: 'Después de *Could you tell me* ya no se usa el orden de pregunta: se dice *the start date*, no *what is the start date*.'
  en.a2.unit39.lesson03.teach.full_time:
    title: full time
    gloss: tiempo completo
    note: '*full time* significa una semana laboral completa; lo contrario es *part time* (medio tiempo).'
    example_gloss: El puesto es de tiempo completo, no de solo dos días por semana.
  en.a2.unit39.lesson03.teach.offer_message:
    title: El mensaje con la oferta
    gloss: 'Estimada Mia: gracias por venir el martes. Nos gustaría ofrecerle el puesto de coordinadora de marketing. El contrato es de tiempo completo y la fecha de inicio es el lunes. Por favor, responda a más tardar el viernes. Bright Path Marketing.'
    note: 'Un mensaje con una oferta de empleo siempre menciona cuatro cosas: el puesto, el tipo de contrato, la fecha de inicio y el plazo para tu respuesta.'
  en.a2.unit39.lesson03.teach.please_reply_by_friday:
    title: El plazo de respuesta
    gloss: Por favor, responda a más tardar el viernes.
    note: '*by Friday* significa «a más tardar el viernes», así que el viernes mismo todavía vale.'
  en.a2.unit39.lesson04.teach.q_calling_about_interview:
    title: La entrevistadora llama a Mia
    gloss: 'La entrevistadora dice: Hola, Mia, llamo por la entrevista del martes.'
    note: '*I am calling about ...* es la forma habitual de abrir una llamada profesional.'
  en.a2.unit39.lesson04.teach.a_still_interested:
    title: Mia dice que sigue interesada
    gloss: 'Mia dice: Gracias por su llamada. Sigo muy interesada en el puesto.'
    note: Es la misma frase de la lección 2.
  en.a2.unit39.lesson04.teach.q_offer_you_the_job:
    title: La entrevistadora ofrece el puesto
    gloss: 'La entrevistadora dice: Qué bien, porque nos gustaría ofrecerle el puesto.'
    note: Aquí *because* une la respuesta de Mia con la buena noticia que viene después.
  en.a2.unit39.lesson04.teach.a_great_news_ask_start_date:
    title: Mia reacciona y pregunta la fecha de inicio
    gloss: 'Mia dice: Es una noticia estupenda. ¿Podría decirme la fecha de inicio?'
    note: Primero se reacciona brevemente a la noticia y después se hace la pregunta.
  en.a2.unit39.lesson04.teach.q_start_date_and_contract:
    title: La entrevistadora indica la fecha y el contrato
    gloss: 'La entrevistadora dice: La fecha de inicio es el lunes y el contrato es de tiempo completo.'
    note: Son los mismos dos datos del mensaje de la lección 3.
  en.a2.unit39.lesson04.teach.a_ask_working_hours:
    title: Mia pregunta por el horario de trabajo
    gloss: 'Mia pregunta: ¿Podría contarme sobre el horario de trabajo?'
    note: Es la misma forma de pregunta indirecta que se usó con la fecha de inicio.
  en.a2.unit39.lesson04.teach.q_nine_to_five:
    title: La entrevistadora indica el horario de trabajo
    gloss: 'La entrevistadora dice: De nueve a cinco, con una hora para el almuerzo.'
    note: '*from nine to five* es la expresión fija para describir una jornada de trabajo.'
  en.a2.unit39.lesson04.teach.a_accept_the_offer:
    title: Mia acepta la oferta
    gloss: 'Mia dice: Muchas gracias. Me gustaría aceptar la oferta.'
    note: Es la misma frase de la lección 2.
  en.a2.unit39.lesson04.teach.q_send_the_contract:
    title: La entrevistadora termina la conversación
    gloss: 'La entrevistadora dice: Maravilloso. Le enviaremos el contrato hoy mismo.'
    note: '*Wonderful* es una reacción cálida y positiva, muy habitual también en el inglés profesional.'
