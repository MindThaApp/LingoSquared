  en.a1.unit44.lesson02.teach.in_the_summer:
    title: in the summer
    gloss: en verano
    note: '*in the summer* significa en verano. En inglés se puede decir con o sin artículo: *in summer* e *in the summer* son correctos (y lo mismo con *in spring*, *in fall* e *in winter*). En español solemos decir "en verano", sin artículo.'
