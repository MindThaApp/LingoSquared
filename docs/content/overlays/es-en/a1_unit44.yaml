  en.a1.unit44.lesson03.teach.dialogue_line1:
    title: La pregunta de Mia
    gloss: 'Mia pregunta: ¿Cuál es tu estación favorita, Leila?'
    note: '*What''s your favorite ...?* pregunta por las preferencias de alguien.'
  en.a1.unit44.lesson03.teach.dialogue_line2:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: El otoño. Las hojas cambian de color y hace un tiempo estupendo para pintar al aire libre.'
    note: '*great weather for painting outside* significa: un tiempo estupendo para pintar al aire libre.'
  en.a1.unit44.lesson03.teach.dialogue_line3:
    title: La reacción de Mia
    gloss: 'Mia dice: Qué bien suena. Mi estación favorita es la primavera.'
    note: '*My favorite season is spring* significa: mi estación favorita es la primavera.'
  en.a1.unit44.lesson03.teach.dialogue_line4:
    title: La pregunta de Leila
    gloss: 'Leila pregunta: ¿Por qué la primavera?'
    note: '*Why spring?* es una forma breve de preguntar el motivo.'
  en.a1.unit44.lesson03.teach.dialogue_line5:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Las flores florecen, y me encanta hacerles fotos para mi clase de fotografía.'
    note: '*I love taking photos* significa: me encanta hacer fotos.'
  en.a1.unit44.lesson03.teach.dialogue_line6:
    title: La pregunta de Leila
    gloss: 'Leila dice: ¡Tiene sentido! ¿La primavera es cálida o fría donde vives?'
    note: '*That makes sense!* es una reacción natural ante una buena explicación.'
  en.a1.unit44.lesson03.teach.dialogue_line7:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Normalmente es cálida, con algo de lluvia. Perfecta para pasear al aire libre.'
    note: '*with a little rain* significa: con un poco de lluvia.'
  en.a1.unit44.lesson04.teach.reading_passage:
    title: Texto sobre tres estaciones favoritas
    gloss: Daniel, Leila y Mia tienen cada uno una estación favorita distinta. La estación favorita de Daniel es el verano. Le encanta jugar al fútbol y salir a correr cuando hace un tiempo cálido y soleado. La estación favorita de Leila es el otoño, porque le encanta pintar las hojas mientras cambian de color. La estación favorita de Mia es la primavera. Hace fotos de las flores para su clase de fotografía. Aunque les gusta una estación diferente a cada uno, siempre encuentran tiempo para disfrutar juntos del aire libre.
    note: '*even though* significa: aunque, a pesar de que.'
