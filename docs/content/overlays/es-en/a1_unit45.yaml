  en.a1.unit45.lesson02.teach.call_911:
    title: Call 911!
    gloss: ¡Llama al 911!
    note: En EE. UU., en una emergencia se llama al *911*; en otros países el número es distinto (por ejemplo, *112* en España), así que conviene recordarlo.
  en.a1.unit45.lesson02.teach.i_need_help:
    title: I need help!
    gloss: ¡Necesito ayuda!
    note: '*I need help!* significa ¡necesito ayuda!'
  en.a1.unit45.lesson02.teach.send_the_police:
    title: Send the police, please.
    gloss: Envíen a la policía, por favor.
    note: '*Send the police, please.* significa envíen a la policía, por favor.'
  en.a1.unit45.lesson02.teach.send_an_ambulance:
    title: Send an ambulance, please.
    gloss: Envíen una ambulancia, por favor.
    note: '*Send an ambulance, please.* significa envíen una ambulancia, por favor.'
  en.a1.unit45.lesson02.teach.theres_a_fire:
    title: There's a fire!
    gloss: ¡Hay un incendio!
    note: '*There''s a fire!* significa ¡hay un incendio!'
  en.a1.unit45.lesson02.teach.whats_your_emergency:
    title: What's your emergency?
    gloss: ¿Cuál es su emergencia?
    note: Esta es la pregunta habitual de un operador de emergencias estadounidense en cuanto llamas al 911.
  en.a1.unit45.lesson03.teach.dialogue_line1:
    title: Leila huele humo
    gloss: 'Leila pregunta: Daniel, ¿se está quemando algo? ¡Huelo humo!'
    note: '*smell* + sustantivo, sin preposición: I smell smoke = huelo humo. Ojo: *I smell of smoke* significa otra cosa (huelo a humo).'
  en.a1.unit45.lesson03.teach.dialogue_line2:
    title: La explicación de Daniel
    gloss: 'Daniel dice: Ay, no, ¡la sartén se incendió! Estaba preparando la cena.'
    note: '*caught fire* es una expresión fija para prenderse fuego de repente.'
  en.a1.unit45.lesson03.teach.dialogue_line3:
    title: Las instrucciones de Leila
    gloss: 'Leila dice: Mantén la calma. ¡Apaga la cocina! Voy a pedir ayuda.'
    note: '*call for help* significa pedir ayuda por teléfono. No omitas la palabra *for* aquí.'
  en.a1.unit45.lesson03.teach.dialogue_line4:
    title: La advertencia de Daniel
    gloss: 'Daniel dice: ¡Rápido, el fuego se está haciendo más grande!'
    note: '*getting bigger* significa hacerse más grande: get + adjetivo expresa un cambio.'
  en.a1.unit45.lesson03.teach.dialogue_line5:
    title: Leila llama a emergencias
    gloss: 'Leila dice: Hola, es una emergencia. Hay un incendio en la cocina de mi amigo. Por favor, envíen a los bomberos.'
    note: 'Así suena una llamada al servicio de emergencias en EE. UU.: allí se llama al 911.'
  en.a1.unit45.lesson03.teach.dialogue_line6:
    title: El alivio de Daniel
    gloss: 'Daniel dice: Gracias a Dios. Creo que ya se apagó, pero esperemos fuera por si acaso.'
    note: '*just in case* significa por si acaso.'
  en.a1.unit45.lesson03.teach.dialogue_line7:
    title: El consejo de Leila
    gloss: 'Leila dice: Buena idea. Es más seguro esperar fuera hasta que lleguen.'
    note: '*safer* es el comparativo de *safe* y se forma con -er; en español usamos "más" delante del adjetivo (seguro -> más seguro).'
  en.a1.unit45.lesson04.teach.reading_passage:
    title: Texto sobre qué hacer en una emergencia
    gloss: 'En caso de incendio: primero, mantén la calma. Segundo, sal del edificio de inmediato. No uses el ascensor; usa las escaleras. Tercero, una vez que estés fuera, llama al 911 y da tu dirección. Por último, espera fuera hasta que lleguen los bomberos. Después del incendio en la cocina de Daniel, él y Leila esperaron fuera, tal como decía el aviso. Los bomberos llegaron rápido y comprobaron que todo estaba seguro. Más tarde, Mia fue a ver cómo estaban y se alivió al saber que nadie había resultado herido.'
    note: '*elevator* es la palabra del inglés americano para ascensor. En inglés británico se dice *lift*.'
