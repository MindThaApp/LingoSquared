teaching:
  en.a1.unit55.lesson01.teach.swimming_pool:
    title: swimming pool
    gloss: piscina
    note: '*swimming pool* significa piscina.'
    example_gloss: La piscina abre todas las mañanas.
  en.a1.unit55.lesson01.teach.ticket:
    title: ticket
    gloss: entrada / boleto
    note: '*ticket* significa entrada o boleto.'
    example_gloss: Necesitas una entrada para entrar en la piscina.
  en.a1.unit55.lesson01.teach.locker:
    title: locker
    gloss: taquilla
    note: '*locker* significa taquilla (casillero con llave).'
    example_gloss: Guarda tu bolsa en una taquilla.
  en.a1.unit55.lesson01.teach.swim_cap:
    title: swim cap
    gloss: gorro de baño
    note: '*swim cap* significa gorro de baño.'
    example_gloss: Por favor, lleva un gorro de baño en la piscina.
  en.a1.unit55.lesson01.teach.rules:
    title: rules
    gloss: normas
    note: '*rules* significa normas o reglas.'
    example_gloss: Lee las normas de la piscina antes de nadar.
  en.a1.unit55.lesson01.teach.lifeguard:
    title: lifeguard
    gloss: socorrista
    note: '*lifeguard* significa socorrista: la persona que vigila a los bañistas.'
    example_gloss: El socorrista vigila la piscina todos los días.
  en.a1.unit55.lesson02.teach.id_like_to_buy_a_ticket:
    title: I'd like to buy a ticket, please.
    gloss: Quisiera comprar una entrada, por favor.
    note: '*I''d like to* (contracción de *I would like to*) es la forma cortés de pedir algo.'
  en.a1.unit55.lesson02.teach.where_are_the_lockers:
    title: Where are the lockers?
    gloss: ¿Dónde están las taquillas?
    note: '*Where are...?* usa el orden invertido (verbo antes del sujeto), típico de las preguntas en inglés.'
  en.a1.unit55.lesson02.teach.what_time_do_you_open:
    title: What time do you open?
    gloss: ¿A qué hora abren?
    note: '*do you open* usa el auxiliar *do* para formar la pregunta.'
  en.a1.unit55.lesson02.teach.its_five_dollars_for_one_ticket:
    title: It's five dollars for one ticket.
    gloss: Son cinco dólares por una entrada.
    note: '*for one ticket* significa por una entrada.'
  en.a1.unit55.lesson02.teach.do_i_need_a_swim_cap:
    title: Do I need a swim cap?
    gloss: ¿Necesito un gorro de baño?
    note: '*Do I need...?* usa el auxiliar *do* para formar la pregunta.'
  en.a1.unit55.lesson02.teach.we_close_at_eight:
    title: We close at eight o'clock.
    gloss: Cerramos a las ocho.
    note: '*at eight o''clock* usa *at* para una hora exacta, igual que en español usamos a las en a las ocho.'
  en.a1.unit55.lesson03.teach.dialogue_line1:
    title: El socorrista los saluda
    gloss: 'El socorrista dice: ¡Hola! ¿Vienen a nadar hoy?'
    note: '*Are you here to swim today?* usa *to swim* para expresar la finalidad, como el para nadar del español.'
  en.a1.unit55.lesson03.teach.dialogue_line2:
    title: Las entradas de Daniel
    gloss: 'Daniel dice: Sí, dos entradas, por favor.'
    note: Una petición breve y directa de dos entradas.
  en.a1.unit55.lesson03.teach.dialogue_line3:
    title: El precio
    gloss: 'El socorrista dice: ¡Claro! Son cinco dólares por una entrada.'
    note: 'Un dato aparte: el precio de cada entrada.'
  en.a1.unit55.lesson03.teach.dialogue_line4:
    title: Mia pregunta por el gorro de baño
    gloss: 'Mia dice: ¿Necesitamos un gorro de baño?'
    note: '*Do we need...?* usa de nuevo el auxiliar *do* para formar la pregunta.'
  en.a1.unit55.lesson03.teach.dialogue_line5:
    title: La norma del gorro
    gloss: 'El socorrista dice: Sí, los gorros de baño son obligatorios en la piscina.'
    note: '*swim caps are required* es una oración pasiva: una forma formal de enunciar una norma, muy usada en los carteles de las piscinas y por el personal. En español se dice igual con son obligatorios o con un verbo de obligación (hay que llevar gorro).'
  en.a1.unit55.lesson03.teach.dialogue_line6:
    title: Daniel pregunta por las taquillas
    gloss: 'Daniel dice: ¿Dónde están las taquillas?'
    note: Una pregunta breve, no un dato nuevo sobre el precio ni la hora.
  en.a1.unit55.lesson03.teach.dialogue_line7:
    title: Dónde están las taquillas
    gloss: 'El socorrista dice: Las taquillas están cerca de la entrada.'
    note: 'Un dato aparte: dónde están las taquillas, distinto de lo que necesitan para funcionar.'
  en.a1.unit55.lesson03.teach.dialogue_line8:
    title: Lo que necesitan las taquillas
    gloss: 'El socorrista dice: Necesitan una moneda de un dólar.'
    note: '*a dollar coin* son dos palabras inglesas (*dollar* + *coin*) escritas por separado. En español se dice una moneda de un dólar, con la preposición de.'
  en.a1.unit55.lesson03.teach.dialogue_line9:
    title: Mia pregunta por la hora de cierre
    gloss: 'Mia dice: ¿A qué hora cierran?'
    note: '*What time do you close?* usa el auxiliar *do* para formar la pregunta.'
  en.a1.unit55.lesson03.teach.dialogue_line10:
    title: La hora de cierre
    gloss: 'El socorrista dice: Cerramos a las ocho.'
    note: 'Un cuarto dato aparte: la hora de cierre.'
  en.a1.unit55.lesson04.teach.reading_passage:
    title: 'Texto: Un día en la piscina'
    gloss: 'Una tarde calurosa de julio, Daniel y Mia decidieron refrescarse en la piscina municipal. Cerca de la entrada, un cartel enumeraba las normas de la piscina: prohibido correr, y los gorros de baño son obligatorios. Pidieron dos entradas al socorrista. Eran cinco dólares por entrada. El socorrista les explicó que las taquillas estaban cerca de la entrada y necesitaban una moneda de un dólar. Daniel y Mia guardaron sus bolsas en una taquilla y nadaron casi dos horas. Antes de irse, volvieron a mirar el cartel: la piscina cierra a las ocho. Mia dijo que quería volver el próximo fin de semana para probar el trampolín.'
    note: '*required* es una forma pasiva: *swim caps are required* significa que los gorros de baño son obligatorios.'
