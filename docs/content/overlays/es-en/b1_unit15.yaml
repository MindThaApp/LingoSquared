course:
  title: Inglés B1
  description: Aprende inglés de nivel B1 para obligaciones, posibilidades, situaciones hipotéticas y relatos cotidianos, con explicaciones detalladas en español.
units:
  en.b1.unit15.complaints:
    title: I'm writing to complain about...
lessons:
  en.b1.unit15.lesson01.complaints_vocabulary:
    title: Palabras para presentar una queja
  en.b1.unit15.lesson02.complaint_sentences:
    title: I'm writing to complain about a damaged product
  en.b1.unit15.lesson03.reading_a_complaint_email:
    title: 'Lectura: una queja por una silla de oficina'
  en.b1.unit15.lesson04.the_complaint_call_dialogue:
    title: Would you like a refund or a replacement?
teaching:
  en.b1.unit15.lesson01.teach.complain:
    title: complain
    gloss: quejarse, presentar una queja
    note: '*complain* significa decir de manera formal que algo está mal o no es satisfactorio.'
    example_gloss: Mia decidió quejarse por la silla dañada.
  en.b1.unit15.lesson01.teach.damaged:
    title: damaged
    gloss: dañado, en mal estado
    note: '*damaged* describe un producto que está roto o estropeado.'
    example_gloss: La silla llegó dañada.
  en.b1.unit15.lesson01.teach.refund:
    title: refund
    gloss: reembolso
    note: '*refund* es el dinero que se devuelve por un producto devuelto o defectuoso.'
    example_gloss: Mia pidió un reembolso.
  en.b1.unit15.lesson01.teach.replacement:
    title: replacement
    gloss: reemplazo, producto de reemplazo
    note: '*replacement* es un artículo nuevo que se entrega en lugar de uno defectuoso.'
    example_gloss: La empresa le ofreció un reemplazo en su lugar.
  en.b1.unit15.lesson01.teach.resolve:
    title: resolve
    gloss: resolver, solucionar
    note: '*resolve* significa solucionar un problema por completo.'
    example_gloss: El agente prometió solucionar el problema pronto.
  en.b1.unit15.lesson01.teach.issue:
    title: issue
    gloss: problema, asunto
    note: '*issue* es un problema del que hay que ocuparse.'
    example_gloss: Mia explicó el problema con claridad.
  en.b1.unit15.lesson02.teach.writing_to_complain:
    title: I'm writing to complain about + Nomen
    gloss: Le escribo para presentar una queja por un producto dañado.
    note: '*I''m writing to complain about* abre con cortesía una queja por escrito.'
  en.b1.unit15.lesson02.teach.would_like_refund:
    title: I would like + Nomen
    gloss: Quisiera un reembolso por este artículo.
    note: '*I would like a refund for* pide con cortesía que se devuelva el dinero.'
  en.b1.unit15.lesson02.teach.grammar_complaint_structure:
    title: Der Aufbau einer höflichen Beschwerde
    gloss: 'Una queja escrita y cortés suele tener tres partes: nombrar el problema (I''m writing to complain about...), decir qué ocurrió (it arrived damaged / it stopped working) y pedir una solución concreta (I would like a refund / I would like a replacement).'
    note: 'Forma: nombrar el problema, decir qué ocurrió y pedir una solución concreta.'
  en.b1.unit15.lesson03.teach.desk_chair:
    title: desk chair
    gloss: silla de escritorio, silla de oficina
    note: '*desk chair* es una silla en la que te sientas frente a un escritorio.'
    example_gloss: Mia pidió una silla de escritorio nueva para su oficina en casa.
  en.b1.unit15.lesson03.teach.as_soon_as_possible:
    title: as soon as possible
    gloss: lo antes posible
    note: '*as soon as possible* significa sin demoras innecesarias.'
    example_gloss: Mia pidió un reemplazo lo antes posible.
  en.b1.unit15.lesson03.teach.reading_passage:
    title: 'Lesetext: eine Beschwerde über einen Bürostuhl'
    gloss: 'Estimado equipo de GreenDesk: Le escribo para presentar una queja por un producto dañado. La semana pasada pedí una silla de escritorio para mi oficina en casa, pero llegó con una rueda rota. Quisiera un reemplazo lo antes posible. Por favor, indíqueme cómo proceder. Muchas gracias, Mia'
    note: Una carta de queja breve y cortés.
  en.b1.unit15.lesson04.teach.q_calling_to_complain:
    title: Mia ruft an, um sich über den Bürostuhl zu beschweren
    gloss: 'Mia dice: Buenos días, llamo para presentar una queja por una silla de escritorio que pedí.'
    note: '*I''m calling to complain about* abre con cortesía una queja por teléfono.'
  en.b1.unit15.lesson04.teach.a_whats_the_issue:
    title: Der Mitarbeiter fragt nach dem Problem
    gloss: 'El agente dice: Lamento oír eso. ¿Cuál es el problema?'
    note: '*I''m sorry to hear that* es una respuesta cortés y comprensiva.'
  en.b1.unit15.lesson04.teach.q_broken_wheel_cant_use:
    title: Mia beschreibt das Problem
    gloss: 'Mia dice: Llegó con una rueda rota, así que no puedo usarla.'
    note: '*it arrived with a broken wheel* explica qué ocurrió.'
  en.b1.unit15.lesson04.teach.a_refund_or_replacement:
    title: Der Mitarbeiter bietet eine Lösung an
    gloss: 'El agente dice: Entiendo. ¿Prefiere un reembolso o un reemplazo?'
    note: '*would you like... or...* le da al cliente una opción.'
  en.b1.unit15.lesson04.teach.q_prefer_replacement:
    title: Mia entscheidet sich für einen Ersatz
    gloss: 'Mia dice: Preferiría un reemplazo, si es posible.'
    note: '*I would prefer a replacement, if that''s possible* expresa una preferencia con cortesía.'
  en.b1.unit15.lesson04.teach.a_resolve_send_friday:
    title: Der Mitarbeiter bestätigt die Lösung
    gloss: 'El agente dice: Por supuesto. Resolveremos esto y le enviaremos una silla nueva antes del viernes.'
    note: '*we''ll resolve this and send... by Friday* es una promesa concreta con fecha.'
