teaching:
  en.a1.unit57.lesson01.teach.cinema:
    title: cinema
    gloss: cine
    note: '*cinema* significa cine.'
    example_gloss: Este cine es muy popular.
  en.a1.unit57.lesson01.teach.ticket:
    title: ticket
    gloss: entrada
    note: '*ticket* significa entrada.'
    example_gloss: Tengo que comprar una entrada.
  en.a1.unit57.lesson01.teach.showtime:
    title: showtime
    gloss: hora de la función
    note: '*showtime* significa hora de la función: el momento en que empieza la película.'
    example_gloss: ¿A qué hora es la función de la película?
  en.a1.unit57.lesson01.teach.seat:
    title: seat
    gloss: asiento / butaca
    note: '*seat* significa asiento o butaca.'
    example_gloss: ¿Está libre este asiento?
  en.a1.unit57.lesson01.teach.screen:
    title: screen
    gloss: pantalla
    note: '*screen* significa pantalla.'
    example_gloss: La pantalla es muy grande.
  en.a1.unit57.lesson01.teach.popcorn:
    title: popcorn
    gloss: palomitas de maíz
    note: '*popcorn* significa palomitas de maíz.'
    example_gloss: Siempre compramos palomitas en el cine.
  en.a1.unit57.lesson02.teach.what_time_does_the_film_start:
    title: What time does the film start?
    gloss: ¿A qué hora empieza la película?
    note: '*does the film start* usa el auxiliar *does* para formar la pregunta, porque el verbo principal es *start*.'
  en.a1.unit57.lesson02.teach.two_tickets_for_the_seven_oclock_show:
    title: Two tickets for the seven o'clock show, please.
    gloss: Dos entradas para la función de las siete, por favor.
    note: '*for the seven o''clock show* relaciona las entradas con una función concreta.'
  en.a1.unit57.lesson02.teach.can_i_have_some_popcorn:
    title: Can I have some popcorn, please?
    gloss: ¿Me da unas palomitas, por favor?
    note: '*Can I have...?* es una forma directa y muy habitual de pedir algo.'
  en.a1.unit57.lesson02.teach.how_much_is_that_in_total:
    title: How much is that in total?
    gloss: ¿Cuánto es en total?
    note: '*in total* significa en total y se usa para preguntar el precio final.'
  en.a1.unit57.lesson02.teach.thats_twenty_dollars:
    title: That's twenty dollars, please.
    gloss: Son veinte dólares, por favor.
    note: '*That''s* + precio es una forma fija de decir una cantidad de dinero.'
  en.a1.unit57.lesson02.teach.i_really_liked_it:
    title: I really liked it!
    gloss: ¡Me gustó mucho!
    note: En español se dice «me gustó», con el verbo gustar, y lo que gusta es el sujeto. En inglés, quien habla es el sujeto de *liked* e *it* es el complemento. Aprende la frase completa, no palabra por palabra.
  en.a1.unit57.lesson03.teach.dialogue_line1:
    title: Daniel pregunta la hora de la función
    gloss: 'Daniel dice: ¡Hola! ¿A qué hora empieza la película?'
    note: '*does the film start* usa el auxiliar *does* para formar la pregunta.'
  en.a1.unit57.lesson03.teach.dialogue_line2:
    title: La hora de la función
    gloss: 'La persona de la taquilla dice: La próxima función es a las siete.'
    note: '*at seven o''clock* usa la preposición *at* con una hora exacta, como «a las siete» en español.'
  en.a1.unit57.lesson03.teach.dialogue_line3:
    title: Daniel pide las entradas
    gloss: 'Daniel dice: Genial. ¿Nos da dos entradas, por favor?'
    note: 'Un dato por separado: el número de entradas (dos).'
  en.a1.unit57.lesson03.teach.dialogue_line4:
    title: El precio de las entradas
    gloss: 'La persona de la taquilla dice: Claro. Son dieciséis dólares.'
    note: 'Un dato por separado: el precio de las dos entradas juntas.'
  en.a1.unit57.lesson03.teach.dialogue_line5:
    title: Leila pide palomitas
    gloss: 'Leila dice: ¿Nos da unas palomitas, por favor?'
    note: Es una petición, no un nuevo dato de precio.
  en.a1.unit57.lesson03.teach.dialogue_line6:
    title: El precio de las palomitas
    gloss: 'La persona de la taquilla dice: Claro. Las palomitas cuestan cuatro dólares.'
    note: 'Un segundo dato por separado: el precio de las palomitas, aparte del de las entradas.'
  en.a1.unit57.lesson03.teach.dialogue_line7:
    title: Daniel pregunta el total
    gloss: 'Daniel dice: ¿Cuánto es en total?'
    note: '*in total* pregunta por la suma de todos los precios.'
  en.a1.unit57.lesson03.teach.dialogue_line8:
    title: El importe total
    gloss: 'La persona de la taquilla dice: Son veinte dólares, por favor.'
    note: 'Un tercer dato por separado: el importe total, distinto de los precios sueltos de las entradas y las palomitas.'
  en.a1.unit57.lesson03.teach.dialogue_line9:
    title: Leila no puede esperar
    gloss: 'Leila dice: ¡Gracias! Tengo muchas ganas de verla.'
    note: '*I can''t wait to...* es una expresión fija para mostrar entusiasmo.'
  en.a1.unit57.lesson04.teach.cinema_schedule:
    title: Cartelera del cine
    gloss: 'Cartelera del cine: Star Journey - 7:00, $8. The Great Race - 5:00, $10. Funny Family - 9:00, $6.'
    note: La cartelera muestra tres películas con su hora y su precio.
  en.a1.unit57.lesson04.teach.reading_passage:
    title: 'Texto: Una noche en el cine'
    gloss: Una noche, Daniel y Leila decidieron ir juntos al cine a ver una película. Preguntaron a qué hora empezaba, y la persona de la taquilla dijo que la próxima función, Star Journey, era a las siete. Compraron dos entradas por dieciséis dólares y una bolsa de palomitas por cuatro dólares. En total fueron veinte dólares. Vieron la película juntos y trataba de unos exploradores espaciales. Fue muy divertida. Cuando terminó, Leila dijo que le había gustado mucho, y Daniel dijo que también quiere ver la siguiente.
    note: '*watched* es el pasado de *watch* (mirar, ver).'
