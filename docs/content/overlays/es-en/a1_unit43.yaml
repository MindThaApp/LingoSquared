  en.a1.unit43.lesson02.teach.dark_blue:
    title: dark blue
    gloss: azul oscuro
    note: En *dark blue* el tono va antes del color (*dark blue*, nunca *blue dark*), al revés que en español, donde decimos "azul oscuro".
    example_gloss: Lleva una camisa azul oscuro.
  en.a1.unit43.lesson02.teach.light_green:
    title: light green
    gloss: verde claro
    note: En *light green* también el tono va antes del color, igual que en *dark blue*; en español decimos "verde claro", con el tono después.
    example_gloss: Pintó su dormitorio de verde claro.
  en.a1.unit43.lesson02.teach.goes_well_with:
    title: goes well with
    gloss: combina bien con
    note: '*goes well with* significa que dos colores o prendas combinan bien.'
    example_gloss: Esta camisa azul combina bien con unos pantalones negros.
  en.a1.unit43.lesson02.teach.too_bright:
    title: too bright
    gloss: demasiado llamativo
    note: '*too bright* significa demasiado vivo o llamativo de color.'
    example_gloss: El amarillo es un color divertido, pero demasiado llamativo para el trabajo.
  en.a1.unit43.lesson02.teach.whats_your_favorite_color:
    title: What's your favorite color?
    gloss: ¿Cuál es tu color favorito?
    note: '*What''s your favorite ...?* pregunta por las preferencias de alguien.'
  en.a1.unit43.lesson02.teach.my_favorite_color_is:
    title: My favorite color is blue.
    gloss: Mi color favorito es el azul.
    note: '*My favorite ... is ...* es la forma habitual de decir una preferencia.'
  en.a1.unit43.lesson03.teach.dialogue_line1:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: Necesito una camisa nueva para nuestra presentación de la semana que viene. ¿Me ayudas a elegir un color?'
    note: '*Can you help me* + verbo*?* pide ayuda.'
  en.a1.unit43.lesson03.teach.dialogue_line2:
    title: La pregunta de Mia
    gloss: 'Mia dice: ¡Claro! ¿Qué colores te gustan?'
    note: '*What colors do you like?* pregunta qué colores prefiere alguien.'
  en.a1.unit43.lesson03.teach.dialogue_line3:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: Me gustan el azul y el verde, pero no sé qué se ve más profesional.'
    note: '*I''m not sure what looks professional* significa: no sé qué se ve más profesional.'
  en.a1.unit43.lesson03.teach.dialogue_line4:
    title: El consejo de Mia
    gloss: 'Mia dice: El azul oscuro es una gran elección. Se ve profesional y combina bien con unos pantalones negros.'
    note: '*It looks professional* significa: se ve profesional.'
  en.a1.unit43.lesson03.teach.dialogue_line5:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: ¿Y esta amarilla?'
    note: '*What about ...?* propone una alternativa.'
  en.a1.unit43.lesson03.teach.dialogue_line6:
    title: El consejo de Mia
    gloss: 'Mia dice: El amarillo es un color divertido, pero demasiado llamativo para una presentación. Yo elegiría la camisa azul oscuro.'
    note: '*I''d choose* significa: yo elegiría.'
  en.a1.unit43.lesson03.teach.dialogue_line7:
    title: La decisión de Daniel
    gloss: 'Daniel dice: Gracias, Mia. ¡Pues azul oscuro!'
    note: '*Dark blue it is!* es una forma informal de confirmar una decisión.'
  en.a1.unit43.lesson04.teach.reading_passage:
    title: Texto sobre tres colores favoritos
    gloss: Daniel, Leila y Mia tienen cada uno un color favorito distinto. El color favorito de Daniel es el azul. Dice que es un color tranquilo y que combina con casi todo lo que se pone para ir al trabajo. El color favorito de Leila es el verde, el color de las plantas y los jardines que le encanta pintar. Le parece que el verde claro es especialmente bonito. El color favorito de Mia es el amarillo, porque le recuerda al sol y siempre la hace sentirse feliz. Aunque a cada uno le gusta un color diferente, coinciden en que los colores hacen cada día más divertido.
    note: '*reminds her of the sun* significa: le recuerda al sol.'
