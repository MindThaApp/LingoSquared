course:
  title: Inglés B2
  description: Aprende inglés de nivel B2 para mantener conversaciones matizadas, argumentar, hacer suposiciones y participar en discusiones profesionales, con explicaciones en un español informal.
units:
  en.b2.unit08.synthesis:
    title: Where the sources agree and conflict
lessons:
  en.b2.unit08.lesson01_source_relationships:
    title: Coincidencia, contradicción y respaldo
  en.b2.unit08.lesson02_linking_sources:
    title: Both sources agree, but...
  en.b2.unit08.lesson03.reading_two_sources:
    title: 'Lectura: una encuesta y un informe del operador'
  en.b2.unit08.lesson04.the_synthesis_dialogue:
    title: Which account is better supported?
teaching:
  en.b2.unit08.lesson01.teach.source:
    title: source
    gloss: fuente
    note: '*source* es una fuente que proporciona información. No uses *according to* en todas partes; a veces se trata de coincidencia o conflicto entre fuentes.'
    example_gloss: Una fuente proporciona información.
  en.b2.unit08.lesson01.teach.synthesize:
    title: synthesize
    gloss: sintetizar, integrar
    note: '*synthesize* significa combinar información de varias fuentes en una respuesta coherente.'
    example_gloss: Sintetizar es combinar información de varias fuentes.
  en.b2.unit08.lesson01.teach.evaluate:
    title: evaluate
    gloss: valorar, juzgar
    note: '*evaluate* significa juzgar lo sólido que es algo.'
    example_gloss: Valorar es juzgar lo sólido que es algo.
  en.b2.unit08.lesson01.teach.agreement:
    title: agreement
    gloss: coincidencia, acuerdo
    note: '*agreement* significa que las fuentes dicen lo mismo sobre un punto.'
    example_gloss: La coincidencia significa que las fuentes dicen lo mismo.
  en.b2.unit08.lesson01.teach.conflict:
    title: conflict
    gloss: contradicción, discrepancia
    note: '*conflict* significa que las fuentes se contradicen o difieren en un punto.'
    example_gloss: La contradicción significa que las fuentes no coinciden.
  en.b2.unit08.lesson01.teach.judgement:
    title: judgment
    gloss: juicio, valoración razonada
    note: '*judgment* es una valoración fundamentada sobre qué fuente es más sólida. En inglés americano se escribe *judgment*; en inglés británico también se ve *judgement*.'
    example_gloss: Un juicio explica qué fuente es más sólida.
  en.b2.unit08.lesson02.teach_agree_conflict:
    title: Coincidencia más contradicción
    gloss: Ambas fuentes coinciden en que la demanda aumentó, pero discrepan sobre la causa.
    note: '*Both sources agree... but they disagree...* es mejor que dos frases sueltas con *according to* una y otra vez.'
  en.b2.unit08.lesson02.teach_by_contrast:
    title: by contrast
    gloss: en cambio, por el contrario
    note: '*By contrast* se usa cuando de verdad contrapones dos fuentes o dos puntos. No lo uses como muletilla general para «en cambio».'
  en.b2.unit08.lesson02.teach_better_supported:
    title: better supported
    gloss: mejor respaldado
    note: '*better supported on the cause* significa que las pruebas sobre la causa son más sólidas.'
  en.b2.unit08.lesson02.teach_grammar_synthesis:
    title: Construir una síntesis
    gloss: Una síntesis debe indicar en qué coinciden las fuentes, en qué se contradicen y qué relato está mejor respaldado.
    note: Usa *agree*, *conflict* y *better supported* para precisar la relación entre las fuentes.
  en.b2.unit08.lesson03.teach_survey:
    title: survey
    gloss: encuesta, sondeo
    note: '*survey* recoge respuestas o comentarios de varias personas.'
    example_gloss: Una encuesta puede recoger muchos comentarios.
  en.b2.unit08.lesson03.teach_account:
    title: account
    gloss: relato, versión
    note: '*account* es un relato o una explicación de lo que ocurrió.'
    example_gloss: Un relato explica lo que ocurrió.
  en.b2.unit08.lesson03.teach.source_a:
    title: Source A
    gloss: 'Fuente A: La encuesta a los pasajeros dice que los autobuses con retraso se hicieron más frecuentes después de que abriera el nuevo hospital. Muchos pasajeros dicen que la ruta está ahora saturada, sobre todo por la mañana. La encuesta sostiene que la causa principal es una mayor demanda.'
    note: La fuente A recoge muchos comentarios de pasajeros, pero eso no es automáticamente la prueba más sólida sobre la causa.
  en.b2.unit08.lesson03.teach.source_b:
    title: Source B
    gloss: 'Fuente B: El informe del operador coincide en que la demanda aumentó después de que abriera el hospital, pero señala la falta de conductores como la causa principal del servicio con retrasos. El informe incluye registros de personal del mismo período.'
    note: '*staffing records* ofrecen una prueba más sólida sobre la causa que la sola experiencia de los pasajeros.'
  en.b2.unit08.lesson04.teach.q_survey:
    title: Tessa menciona la fuente A
    gloss: 'Tessa dice: He leído dos relatos sobre el servicio de autobuses con retrasos. La encuesta a los pasajeros dice que la demanda aumentó después de que abriera el nuevo hospital.'
    note: Esto introduce una fuente y un punto sobre una mayor demanda.
  en.b2.unit08.lesson04.teach.a_operator:
    title: Rowan menciona la fuente B
    gloss: 'Rowan dice: El informe del operador coincide en que la demanda aumentó, pero dice que el problema principal fue la falta de conductores.'
    note: La fuente B confirma un punto, pero difiere sobre la causa.
  en.b2.unit08.lesson04.teach.q_agree_conflict:
    title: Tessa sintetiza
    gloss: 'Tessa dice: Entonces las fuentes coinciden en que la demanda es mayor, pero se contradicen sobre la causa.'
    note: '*agree on* y *conflict about* resumen la relación entre las fuentes.'
  en.b2.unit08.lesson04.teach.a_better_supported:
    title: Rowan pregunta por las pruebas
    gloss: 'Rowan pregunta: ¿Qué relato está mejor respaldado?'
    note: Pide una valoración, no solo un resumen.
  en.b2.unit08.lesson04.teach.q_evidence_compare:
    title: Tessa compara las pruebas
    gloss: 'Tessa dice: La encuesta tiene muchos comentarios de pasajeros, pero el informe del operador incluye registros de personal.'
    note: 'Esto es una cuestión de pruebas: comentarios frente a datos.'
  en.b2.unit08.lesson04.teach.a_judgement_question:
    title: Rowan pide una valoración
    gloss: 'Rowan pregunta: ¿Y entonces cuál es tu juicio?'
    note: '*judgment* pide una conclusión fundamentada.'
  en.b2.unit08.lesson04.teach.q_final_judgement:
    title: Tessa da su juicio
    gloss: 'Tessa dice: El informe del operador está mejor respaldado en cuanto a la causa, aunque la encuesta es útil para mostrar la experiencia de los pasajeros.'
    note: '*although* mantiene presentes ambas fuentes mientras emites un juicio.'
