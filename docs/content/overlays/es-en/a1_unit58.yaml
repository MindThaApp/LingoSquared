teaching:
  en.a1.unit58.lesson01.teach.museum:
    title: museum
    gloss: museo
    note: '*museum* significa museo; la palabra es casi igual que en español, pero se pronuncia distinto.'
    example_gloss: Este museo es muy antiguo.
  en.a1.unit58.lesson01.teach.ticket:
    title: ticket
    gloss: entrada
    note: '*ticket* significa entrada, el papel que te permite pasar.'
    example_gloss: Necesito una entrada, por favor.
  en.a1.unit58.lesson01.teach.exhibition:
    title: exhibition
    gloss: exposición
    note: '*exhibition* significa exposición: un conjunto de obras de arte u objetos que se pueden ver.'
    example_gloss: Hay una nueva exposición.
  en.a1.unit58.lesson01.teach.painting:
    title: painting
    gloss: cuadro / pintura
    note: '*painting* significa cuadro o pintura: una obra de arte hecha con pintura.'
    example_gloss: Me gusta mucho este cuadro.
  en.a1.unit58.lesson01.teach.sculpture:
    title: sculpture
    gloss: escultura
    note: '*sculpture* significa escultura: una obra de arte hecha de piedra, madera o metal.'
    example_gloss: Esta escultura también es muy antigua.
  en.a1.unit58.lesson01.teach.guide:
    title: guide
    gloss: guía
    note: '*guide* significa guía: una persona que acompaña a los visitantes y les explica cosas.'
    example_gloss: ¿Hay guía hoy?
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_open:
    title: What time does the museum open?
    gloss: ¿A qué hora abre el museo?
    note: Esta pregunta empieza con *what time*, seguido del auxiliar *does*, porque el verbo principal es *open*.
  en.a1.unit58.lesson02.teach.what_time_does_the_museum_close:
    title: What time does the museum close?
    gloss: ¿A qué hora cierra el museo?
    note: Tiene la misma estructura que *What time does the museum open?*, ahora con *close* en lugar de *open*.
  en.a1.unit58.lesson02.teach.two_tickets_please:
    title: Two tickets, please.
    gloss: Dos entradas, por favor.
    note: '*please* al final hace cortés la petición, igual que al pedir comida.'
  en.a1.unit58.lesson02.teach.is_there_a_guide_for_the_exhibition:
    title: Is there a guide for the exhibition?
    gloss: ¿Hay un guía para la exposición?
    note: '*Is there...?* se usa para preguntar si algo existe o está presente; aquí, un guía.'
  en.a1.unit58.lesson02.teach.the_museum_is_open_every_day:
    title: The museum is open every day.
    gloss: El museo abre todos los días.
    note: '*every day* significa todos los días y va al final de la frase.'
  en.a1.unit58.lesson02.teach.i_really_enjoyed_the_paintings:
    title: I really enjoyed the paintings!
    gloss: ¡Disfruté mucho de los cuadros!
    note: '*enjoyed* es el pasado de *enjoy* (disfrutar) y sirve para recordar algo agradable.'
  en.a1.unit58.lesson03.teach.dialogue_line1:
    title: La pregunta de Daniel
    gloss: 'Daniel dice: ¡Hola! ¿A qué hora cierra el museo?'
    note: '*Hi!* es un saludo informal.'
  en.a1.unit58.lesson03.teach.dialogue_line2:
    title: El empleado responde
    gloss: 'El empleado dice: Cerramos a las cinco.'
    note: '*at* + hora indica cuándo ocurre algo, como en *at five o''clock*.'
  en.a1.unit58.lesson03.teach.dialogue_line3:
    title: La petición de Mia
    gloss: 'Mia dice: Genial. ¿Nos da dos entradas, por favor?'
    note: '*Can we have...?* es una forma cortés de pedir algo.'
  en.a1.unit58.lesson03.teach.dialogue_line4:
    title: El precio
    gloss: 'El empleado dice: Claro. Son doce dólares.'
    note: '*That''s* + cantidad se usa para decir un precio.'
  en.a1.unit58.lesson03.teach.dialogue_line5:
    title: La pregunta de Daniel sobre el guía
    gloss: 'Daniel pregunta: ¿Hay un guía para la exposición?'
    note: Es la misma estructura *Is there...?* que aprendiste antes en la lección 2.
  en.a1.unit58.lesson03.teach.dialogue_line6:
    title: El empleado habla del guía
    gloss: 'El empleado dice: Sí, hay un guía cerca de la entrada.'
    note: '*there''s* es la contracción de *there is*.'
  en.a1.unit58.lesson03.teach.dialogue_line7:
    title: Mia pregunta el nombre
    gloss: 'Mia pregunta: ¿Cómo se llama la exposición?'
    note: '*What is ... called?* es la forma habitual de preguntar el nombre de algo.'
  en.a1.unit58.lesson03.teach.dialogue_line8:
    title: El nombre de la exposición
    gloss: 'El empleado dice: Se llama Colors of the City.'
    note: '*It''s called...* es la respuesta a la pregunta *What is ... called?*.'
  en.a1.unit58.lesson03.teach.dialogue_line9:
    title: El final de Daniel
    gloss: 'Daniel dice: ¡Gracias! Tengo muchas ganas de ver los cuadros.'
    note: '*can''t wait to...* significa tener muchas ganas de hacer algo.'
  en.a1.unit58.lesson04.teach.museum_notice:
    title: Cartel del museo
    gloss: 'Museo de la Ciudad: abierto todos los días, de 9:00 a 17:00. Entrada de adulto: 6 dólares. Exposición actual: Colors of the City, Sala 2.'
    note: El cartel indica el horario, el precio y el nombre de la exposición.
  en.a1.unit58.lesson04.teach.reading_passage:
    title: Texto sobre Daniel y Mia
    gloss: 'Una visita al museo: Un sábado por la tarde, Daniel y Mia decidieron visitar juntos el Museo de la Ciudad. En la entrada, el empleado les dijo que el museo cierra a las cinco. Compraron dos entradas por doce dólares. Daniel preguntó por un guía, y el empleado dijo que había uno cerca de la entrada. Visitaron la exposición, Colors of the City, y vieron muchos cuadros bonitos en la sala 2. A Daniel le gustó un cuadro de la plaza del casco antiguo, y a Mia le gustó un cuadro del río al atardecer. Al salir, Mia dijo que la próxima vez quiere visitar la exposición de esculturas.'
    note: '*decided to visit* usa *to* + infinitivo después de *decided* para indicar lo que alguien decidió hacer.'
