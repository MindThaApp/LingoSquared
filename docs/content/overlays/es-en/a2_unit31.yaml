teaching:
  en.a2.unit31.lesson01.teach.delay:
    title: delay
    gloss: retraso
    note: '*delay* significa «retraso».'
    example_gloss: El tren de las 5:15 tiene un retraso de 45 minutos.
  en.a2.unit31.lesson01.teach.cancelled:
    title: cancelled
    gloss: cancelado
    note: '*cancelled* significa que algo no se realiza. Con los trenes se dice «el tren fue cancelado» o «se suspendió».'
    example_gloss: El tren de las 5:15 no fue cancelado, solo tiene retraso.
  en.a2.unit31.lesson01.teach.alternative:
    title: alternative
    gloss: alternativa
    note: '*alternative* es otra opción.'
    example_gloss: 'El empleado ofreció una alternativa: un autobús a las 5:30.'
  en.a2.unit31.lesson01.teach.notice:
    title: notice
    gloss: aviso
    note: '*notice* es un aviso escrito para los viajeros, por ejemplo un cartel en la estación.'
    example_gloss: Leí un aviso sobre el retraso en la estación.
  en.a2.unit31.lesson01.teach.signal_problem:
    title: signal problem
    gloss: falla en las señales
    note: '*signal problem* es una falla en las señales de la vía.'
    example_gloss: El retraso se debe a una falla en las señales de la vía.
  en.a2.unit31.lesson02.teach.wondering_why_delayed:
    title: Höflich nach dem Grund fragen
    gloss: Quería preguntar por qué el tren tiene retraso.
    note: '*I was wondering why...* es una forma cortés e indirecta de preguntar un motivo.'
  en.a2.unit31.lesson02.teach.another_way_home:
    title: Nach einer Alternative fragen
    gloss: ¿Hay otra manera de volver a casa esta noche?
    note: Con *Is there another way to...?* preguntas por alternativas.
  en.a2.unit31.lesson02.teach.delayed_because_signal:
    title: Den Grund für die Verspätung nennen
    gloss: El tren tiene retraso por una falla en las señales.
    note: Con *has been delayed because of...* das el motivo de un retraso.
  en.a2.unit31.lesson03.teach.departure_time:
    title: departure time
    gloss: hora de salida
    note: '*departure time* significa «hora de salida».'
    example_gloss: La nueva hora de salida es a las 6:00.
  en.a2.unit31.lesson03.teach.notice_text:
    title: Text der Mitteilung
    gloss: 'Aviso: El tren de las 5:15 tiene retraso por una falla en las señales. La nueva hora de salida es a las 6:00. A las 5:30 hay un autobús disponible afuera de la estación.'
    note: Es un aviso formal con el motivo, la nueva hora y una alternativa.
  en.a2.unit31.lesson03.teach.i_will_take_the_bus:
    title: Die eigene Entscheidung mitteilen
    gloss: Tomaré el autobús en su lugar.
    note: '*instead* significa «en su lugar» o «en cambio».'
  en.a2.unit31.lesson04.teach.q_can_i_help:
    title: Der Mitarbeiter bietet Hilfe an
    gloss: 'El empleado pregunta: ¿Puedo ayudarle?'
    note: '*Can I help you?* es una pregunta habitual del personal de la estación.'
  en.a2.unit31.lesson04.teach.a_wondering_why_delayed:
    title: Daniel fragt nach dem Grund
    gloss: 'Daniel dice: Sí, quería preguntar por qué el tren tiene retraso.'
    note: Es la misma pregunta cortés de la lección 2.
  en.a2.unit31.lesson04.teach.q_signal_problem_new_time:
    title: Der Mitarbeiter erklärt die Verspätung
    gloss: 'El empleado dice: Hay una falla en las señales de la vía. La nueva hora de salida es a las 6:00.'
    note: El empleado indica el motivo y la nueva hora de salida.
  en.a2.unit31.lesson04.teach.a_another_way_home_tonight:
    title: Daniel fragt nach einer Alternative
    gloss: 'Daniel dice: ¿Hay otra manera de volver a casa esta noche?'
    note: Es la misma pregunta de la lección 2.
  en.a2.unit31.lesson04.teach.q_bus_at_530:
    title: Der Mitarbeiter nennt die Alternative
    gloss: 'El empleado dice: A las 5:30 sale un autobús desde afuera de la estación.'
    note: El empleado propone una alternativa concreta con hora y lugar.
  en.a2.unit31.lesson04.teach.a_thank_you_take_bus:
    title: Daniels abschließende Entscheidung
    gloss: 'Daniel dice: Gracias. Entonces tomaré el autobús.'
    note: Daniel da las gracias al empleado y le comunica su decisión.
