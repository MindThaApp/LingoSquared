teaching:
  en.a2.unit25.lesson01.teach.appointment:
    title: appointment
    gloss: cita
    note: '*appointment* es una cita fijada de antemano, por ejemplo en una oficina pública.'
    example_gloss: Tengo una cita el viernes en el DMV (oficina de licencias de conducir y vehículos).
  en.a2.unit25.lesson01.teach.document:
    title: document
    gloss: documento
    note: '*document* es un documento oficial o un papel que sirve de comprobante.'
    example_gloss: Traiga un documento como comprobante de domicilio, por favor.
  en.a2.unit25.lesson01.teach.proof_of_residency:
    title: proof of residency
    gloss: comprobante de domicilio
    note: '*proof of residency* es un documento que demuestra dónde vives.'
    example_gloss: Un recibo de luz puede servir como comprobante de domicilio.
  en.a2.unit25.lesson01.teach.form:
    title: form
    gloss: formulario
    note: '*form* es un formulario que se rellena.'
    example_gloss: Rellene este formulario antes de su cita, por favor.
  en.a2.unit25.lesson01.teach.confirmation_number:
    title: confirmation number
    gloss: número de confirmación
    note: '*confirmation number* es el número que confirma tu cita.'
    example_gloss: Su número de confirmación es 4471.
  en.a2.unit25.lesson02.teach.i_was_wondering_whether:
    title: I was wondering whether I could make an appointment.
    gloss: Quería preguntar si podría concertar una cita.
    note: '*I was wondering whether...* es una forma cortés y formal de pedir algo.'
  en.a2.unit25.lesson02.teach.would_it_be_possible:
    title: Would it be possible to come this Friday?
    gloss: ¿Sería posible ir este viernes?
    note: '*Would it be possible...?* es una petición muy cortés.'
  en.a2.unit25.lesson02.teach.because_i_moved:
    title: I need to update my address because I moved last month.
    gloss: Necesito actualizar mi dirección porque me mudé el mes pasado.
    note: Con *because* se introduce una oración que explica el motivo.
  en.a2.unit25.lesson03.teach.photo_id:
    title: photo ID
    gloss: identificación con foto
    note: '*photo ID* es una identificación con tu foto, por ejemplo un documento de identidad o una licencia de conducir.'
    example_gloss: Necesitará una identificación con foto y un comprobante de domicilio.
  en.a2.unit25.lesson03.teach.utility_bill:
    title: utility bill
    gloss: recibo de luz o agua
    note: '*utility bill* es el recibo de la luz, el gas o el agua.'
    example_gloss: Un recibo de luz es un ejemplo común de comprobante de domicilio.
  en.a2.unit25.lesson03.teach.notice_text:
    title: Text des Hinweises
    gloss: Para cambiar su dirección, traiga una identificación con foto y un comprobante de domicilio, por ejemplo un recibo de luz. Si no tiene un recibo de luz, puede traer su contrato de alquiler.
    note: 'Es un aviso formal: indica qué debe traer y qué puede traer en su lugar.'
  en.a2.unit25.lesson03.teach.i_will_bring:
    title: I will bring a photo ID.
    gloss: Voy a traer una identificación con foto.
    note: Con *will* dices lo que vas a hacer (futuro).
  en.a2.unit25.lesson04.teach.could_you_tell_me:
    title: Could you tell me what I need to bring?
    gloss: ¿Podría decirme qué necesito traer?
    note: '*Could you tell me...?* es una pregunta indirecta y cortés. Después de *what* el orden es el de una afirmación: *what I need to bring*.'
  en.a2.unit25.lesson04.teach.q_since_when:
    title: Fragen, wie lange
    gloss: 'El empleado pregunta: ¿Cuánto tiempo lleva viviendo en la nueva dirección?'
    note: '*How long have you lived...?* pregunta cuánto tiempo dura algo que empezó en el pasado y continúa. En inglés se usa el presente perfecto (*have lived*); en español basta el presente con «llevar» o «desde cuándo»: «¿Cuánto tiempo llevas viviendo aquí?». La respuesta puede empezar con *since*: *Since last month.*'
  en.a2.unit25.lesson04.teach.a_since_last_month:
    title: Daniels Antwort
    gloss: 'Daniel dice: Desde el mes pasado.'
    note: '*Since last month* significa «desde el mes pasado». Aquí basta una respuesta corta.'
  en.a2.unit25.lesson04.teach.q_would_it_be_possible:
    title: Nach einem Termin fragen
    gloss: 'Daniel pregunta: ¿Sería posible ir este viernes?'
    note: Es la misma pregunta de la segunda lección.
  en.a2.unit25.lesson04.teach.a_friday_works_confirmation:
    title: Antwort des Sachbearbeiters
    gloss: 'El empleado dice: Sí, el viernes a las 10 de la mañana está bien. Su número de confirmación es 4471.'
    note: El empleado confirma la hora y dice el número de confirmación.
