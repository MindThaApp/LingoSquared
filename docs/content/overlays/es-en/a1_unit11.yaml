    example_gloss: Te veo mañana.
  en.a1.unit11.lesson03.teach.forecast_text:
    title: Previsión del tiempo
    gloss: Mañana hará sol y buen tiempo. El sábado lloverá.
    note: '*will* + verbo forma el futuro inglés, parecido al futuro del español (lloverá).'
  en.a1.unit11.lesson04.teach.lets_go:
    title: Let's go to the park.
    gloss: Vamos al parque.
    note: '*Let''s* + verbo significa «vamos a...»: es una sugerencia.'
