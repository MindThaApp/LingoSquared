    title: Respuesta de Daniel
    gloss: 'Daniel: Hace sol y buen tiempo.'
    note: Daniel describe el tiempo actual.
  en.a1.unit11.lesson04.teach.suggest_park:
    title: Propuesta de Leila
    gloss: 'Leila: Genial, vamos al parque.'
    note: '*Great* expresa entusiasmo por el buen tiempo.'
  en.a1.unit11.lesson04.teach.agree_rain_tomorrow:
    title: Respuesta de Daniel
    gloss: 'Daniel: Buena idea. Pero el sábado va a llover, así que vamos hoy.'
    note: '*so* une el motivo (lluvia el sábado) con la consecuencia (ir hoy).'
