    title: What's the weather like today?
    gloss: ¿Qué tiempo hace hoy?
    note: '*What''s the weather like?* es la pregunta estándar sobre el tiempo.'
  en.a1.unit11.lesson02.teach.its_sunny:
    title: It's sunny and warm.
    gloss: Hace sol y buen tiempo.
    note: '*It''s* + adjetivo describe el tiempo actual.'
  en.a1.unit11.lesson02.teach.its_raining:
    title: It's raining.
    gloss: Está lloviendo.
    note: '*It''s raining* está en presente continuo; en español es simplemente «Está lloviendo» o «Llueve».'
