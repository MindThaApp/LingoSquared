teaching:
  en.b1.unit05.lesson01.teach.responsible_for:
    title: responsible for
    gloss: responsable de, encargado de
    note: '*responsible for* significa que es tu tarea ocuparte de algo.'
    example_gloss: Soy responsable del informe mensual.
  en.b1.unit05.lesson01.teach.update:
    title: update
    gloss: actualización, información reciente
    note: '*update* significa información nueva sobre cómo va algo.'
    example_gloss: Le doy a mi equipo una actualización cada semana.
  en.b1.unit05.lesson01.teach.deadline:
    title: deadline
    gloss: fecha límite, plazo
    note: '*deadline* es la fecha hasta la cual algo debe estar terminado.'
    example_gloss: La fecha límite del informe es el viernes.
  en.b1.unit05.lesson01.teach.report:
    title: report
    gloss: informe
    note: '*report* es un documento escrito sobre el trabajo o sus resultados.'
    example_gloss: Escribo un informe de ventas cada mes.
  en.b1.unit05.lesson01.teach.on_schedule:
    title: on schedule
    gloss: según lo previsto, dentro del plazo
    note: '*on schedule* significa que algo avanza como se planeó y no va tarde.'
    example_gloss: El proyecto va según lo previsto.
  en.b1.unit05.lesson01.teach.behind_schedule:
    title: behind schedule
    gloss: con retraso, atrasado
    note: '*behind schedule* significa que algo avanza más lento de lo planeado.'
    example_gloss: Esta semana vamos un poco atrasados.
  en.b1.unit05.lesson02.teach.responsible_for_report:
    title: Eine Zuständigkeit nennen
    gloss: Soy responsable del informe mensual.
    note: '*I''m responsible for...* es una forma directa de describir una tarea en el trabajo.'
  en.b1.unit05.lesson02.teach.project_on_schedule:
    title: Sagen, dass etwas im Zeitplan liegt
    gloss: El proyecto va según lo previsto.
    note: '*on schedule* significa que no hay retraso.'
  en.b1.unit05.lesson02.teach.behind_schedule_finish_friday:
    title: Eine Statusmeldung geben
    gloss: Voy un poco atrasado, pero terminaré para el viernes.
    note: '*I''m a little behind schedule, but I''ll finish by...* es una forma honesta de avisar de un retraso y dar una fecha concreta.'
  en.b1.unit05.lesson02.teach.grammar_status_update:
    title: Statusmeldungen geben
    gloss: Soy responsable del informe. El proyecto va según lo previsto. Voy atrasado.
    note: Estas tres oraciones son fórmulas habituales para hablar en el trabajo de responsabilidades y avance.
  en.b1.unit05.lesson03.teach.team:
    title: team
    gloss: equipo
    note: '*team* es un grupo de personas que trabajan juntas.'
    example_gloss: Él le da a su equipo una actualización breve cada semana.
  en.b1.unit05.lesson03.teach.technical_problem:
    title: technical problem
    gloss: problema técnico
    note: '*technical problem* es un problema con equipos o con software.'
    example_gloss: Va atrasado por un problema técnico.
  en.b1.unit05.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Wochenbericht'
    gloss: Daniel es responsable del informe mensual de ventas. Cada semana le da a su equipo una actualización breve. Esta semana va un poco atrasado por un problema técnico, pero espera terminar para el viernes. Siempre le dice la verdad a su equipo sobre los retrasos.
    note: Un texto breve sobre cómo Daniel habla con honestidad de un retraso.
  en.b1.unit05.lesson04.teach.q_could_you_help_review:
    title: Daniel bittet Mia um Hilfe
    gloss: 'Daniel dice: Mia, ¿podrías ayudarme a revisar este informe antes de enviarlo?'
    note: '*could you help me...* es una forma cortés de pedirle ayuda a un compañero.'
  en.b1.unit05.lesson04.teach.a_of_course_what_help:
    title: Mia sagt zu
    gloss: 'Mia dice: Claro. ¿En qué necesitas ayuda?'
    note: '*of course* es una forma amable y directa de decir que sí.'
  en.b1.unit05.lesson04.teach.q_make_sure_numbers:
    title: Daniel erklärt, was er braucht
    gloss: 'Daniel dice: Quiero asegurarme de que las cifras estén correctas.'
    note: '*make sure* significa comprobar que algo está bien.'
  en.b1.unit05.lesson04.teach.a_check_this_afternoon:
    title: Mia verspricht, es durchzusehen
    gloss: 'Mia dice: No hay problema. Lo reviso esta tarde y te mando mis comentarios.'
    note: '*I''ll check it this afternoon* es una promesa concreta con una hora aproximada.'
  en.b1.unit05.lesson04.teach.q_thank_you_appreciate:
    title: Daniel bedankt sich bei Mia
    gloss: 'Daniel dice: Gracias, te lo agradezco mucho.'
    note: '*I really appreciate it* es una forma sincera de expresar gratitud.'
  en.b1.unit05.lesson04.teach.a_youre_welcome_let_me_know:
    title: Mia bietet weitere Hilfe an
    gloss: 'Mia dice: De nada. Avísame si necesitas algo más.'
    note: '*let me know if...* deja abierta la puerta a más ayuda.'
