teaching:
  en.a1.unit15.lesson01.teach.cash:
    title: Cash
    gloss: dinero en efectivo
    note: '*cash* es el dinero en billetes y monedas. En inglés es incontable: *some cash*, nunca *a cash*.'
    example_gloss: Tengo algo de dinero en efectivo.
  en.a1.unit15.lesson01.teach.card:
    title: Card
    gloss: tarjeta
    note: '*card* es la palabra general para cualquier tarjeta de pago de plástico.'
    example_gloss: Mi tarjeta es azul.
  en.a1.unit15.lesson01.teach.credit_card:
    title: Credit card
    gloss: tarjeta de crédito
    note: '*credit card* es una tarjeta con la que se pide dinero prestado y se devuelve más tarde. Equivale a «tarjeta de crédito».'
  en.a1.unit15.lesson01.teach.debit_card:
    title: Debit card
    gloss: tarjeta de débito
    note: '*debit card* es una tarjeta con la que el dinero se descuenta de la cuenta al instante. Lo que en español suele llamarse «tarjeta de débito» es una *debit card*.'
  en.a1.unit15.lesson01.teach.total:
    title: Total
    gloss: total
    note: '*total* es la cantidad completa que tienes que pagar.'
    example_gloss: ¿Cuál es el total?
  en.a1.unit15.lesson02.teach.do_you_take_cards:
    title: Do you take credit cards?
    gloss: ¿Aceptan tarjetas de crédito?
    note: '*Do you take credit cards?* es la pregunta habitual antes de pagar. Aquí *take* significa «aceptar».'
  en.a1.unit15.lesson02.teach.cash_only:
    title: Sorry, cash only.
    gloss: Lo siento, solo efectivo.
    note: '*Sorry, cash only.* es la respuesta habitual de las tiendas que no aceptan tarjetas.'
  en.a1.unit15.lesson02.teach.ill_pay_by_card:
    title: Yes, I'll pay by card.
    gloss: Sí, pagaré con tarjeta.
    note: '*Yes, I''ll pay by card.* es la decisión final sobre cómo pagar. Después de *by* va *card* sin artículo.'
  en.a1.unit15.lesson03.teach.tax:
    title: Tax
    gloss: impuesto
    note: '*tax* es el impuesto; en la mayoría de las tiendas de EE. UU. se suma al precio en la caja (a diferencia del IVA, que en España ya va incluido en el precio de la etiqueta).'
    example_gloss: El impuesto es un dólar.
  en.a1.unit15.lesson03.teach.receipt_text:
    title: Texto del ticket de compra
    gloss: 'Café: 3 dólares. Sándwich: 6 dólares. Impuesto: 1 dólar. Total: 10 dólares.'
    note: Este es un ticket de compra real.
  en.a1.unit15.lesson03.teach.total_summary_sentence:
    title: The total is $10.
    gloss: El total es de 10 dólares.
    note: Esta frase resume el total del ticket en una oración completa.
  en.a1.unit15.lesson04.teach.q_total:
    title: Preguntar por el total
    gloss: Leila pregunta cuál es el total
    note: '*How much is the total?* es la pregunta habitual para saber el importe final. *is* va en singular porque *the total* es una suma.'
  en.a1.unit15.lesson04.teach.a_fifteen:
    title: Respuesta sobre el total
    gloss: 'El cajero dice: son quince dólares.'
    note: '*It''s fifteen dollars.* es una respuesta completa a la pregunta sobre el total.'
  en.a1.unit15.lesson04.teach.q_cards:
    title: Preguntar si aceptan tarjeta
    gloss: Leila pregunta si aceptan tarjetas de crédito
    note: Es la misma pregunta de antes.
  en.a1.unit15.lesson04.teach.a_yes_we_do:
    title: Respuesta sobre las tarjetas
    gloss: 'El cajero dice: sí, las aceptamos.'
    note: '*Yes, we do.* es una respuesta corta completa. En inglés se repite el auxiliar *do* en lugar de decir solo «sí».'
  en.a1.unit15.lesson04.teach.closing_pay_by_card:
    title: Elección final de pago
    gloss: 'Leila dice: Perfecto, pagaré con tarjeta.'
    note: Esta frase cierra la conversación con la elección final de pago.
