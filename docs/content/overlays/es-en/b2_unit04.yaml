course:
  title: Inglés B2
  description: Aprende inglés de nivel B2 para mantener conversaciones matizadas, argumentar, hacer suposiciones y participar en discusiones profesionales, con explicaciones en un español informal.
units:
  en.b2.unit04.narrative_time:
    title: By the time I arrived
lessons:
  en.b2.unit04.lesson01.timeline_roles:
    title: Trasfondo, hecho principal y lo que ocurrió antes
  en.b2.unit04.lesson02.shifting_time:
    title: While I was checking, the power went out
  en.b2.unit04.lesson03.reading_an_incident_account:
    title: 'Lectura: el problema en el lugar del evento'
  en.b2.unit04.lesson04.the_narrative_dialogue:
    title: Walk me through what happened
teaching:
  en.b2.unit04.lesson01.teach.background:
    title: background
    gloss: trasfondo, contexto
    note: '*background* es lo que ya estaba ocurriendo o da el contexto. En los relatos en inglés, el trasfondo suele ir en past continuous.'
    example_gloss: La información de trasfondo cuenta lo que ya estaba ocurriendo.
  en.b2.unit04.lesson01.teach.foreground:
    title: foreground
    gloss: hecho principal
    note: '*foreground* es el suceso hacia el que avanza el relato. En inglés suele ir en simple past, no automáticamente en present perfect.'
    example_gloss: El hecho principal es el suceso más importante de la historia.
  en.b2.unit04.lesson01.teach.prior:
    title: prior
    gloss: anterior, previo
    note: '*prior* significa anterior a otro momento del pasado. Suele expresarse con past perfect: *had moved*.'
    example_gloss: Un suceso previo ocurrió antes que otro suceso del pasado.
  en.b2.unit04.lesson01.teach.interrupt:
    title: interrupt
    gloss: interrumpir
    note: Usas *interrupt* cuando un suceso breve irrumpe en algo que estaba en marcha.
    example_gloss: Un problema repentino puede interrumpir una acción.
  en.b2.unit04.lesson01.teach.ongoing:
    title: ongoing
    gloss: en curso, en marcha
    note: '*ongoing* corresponde a ''estaba + gerundio''. En inglés suele expresarse con *was/were + -ing*.'
    example_gloss: Una acción en curso se prolonga durante un tiempo.
  en.b2.unit04.lesson01.teach.chronology:
    title: chronology
    gloss: cronología, orden real
    note: '*chronology* es el orden real de los sucesos, aunque el relato los cuente en otro orden.'
    example_gloss: La cronología es el orden real de los sucesos.
  en.b2.unit04.lesson02.teach.by_the_time:
    title: Algo había ocurrido antes
    gloss: Para cuando llegué, el coordinador ya había llevado el equipo al interior.
    note: '*had already moved* indica que esto ocurrió antes de *I arrived*. El español también usa aquí el pluscuamperfecto (había llevado); en inglés, por tanto, no digas *has moved*, sino *had moved*.'
  en.b2.unit04.lesson02.teach.while_checking:
    title: Acción en curso más interrupción
    gloss: Mientras yo revisaba el sistema de sonido, se fue la luz.
    note: '*was checking* equivale a ''estaba revisando''. La interrupción en sí va en simple past: *went out*.'
  en.b2.unit04.lesson02.teach.when_arrived_setting:
    title: Llegar durante una acción de trasfondo
    gloss: Cuando llegué, los voluntarios estaban colocando las sillas.
    note: Usa *were setting up* para lo que estaba en marcha cuando ocurrió el hecho principal.
  en.b2.unit04.lesson02.teach.grammar_shifted_time:
    title: Capas temporales de un relato
    gloss: Usa el past continuous para la acción de trasfondo, el simple past para los hechos principales y el past perfect para lo que ya había ocurrido antes.
    note: 'En un relato en inglés, no uses el present perfect para los hechos principales: usa el simple past, *the power went out*, no *has gone out*.'
  en.b2.unit04.lesson03.teach.venue:
    title: venue
    gloss: lugar del evento, recinto
    note: '*venue* es el lugar donde se celebra un evento.'
    example_gloss: El recinto es el lugar donde se celebra un evento.
  en.b2.unit04.lesson03.teach.delayed:
    title: delayed
    gloss: retrasado, aplazado
    note: '*delayed* significa que algo empieza o sucede más tarde de lo previsto.'
    example_gloss: El evento empezó con veinte minutos de retraso.
  en.b2.unit04.lesson03.teach.reading_passage:
    title: 'Texto: el problema en el lugar del evento'
    gloss: Simon no contó la historia en estricto orden cronológico. Antes de que él llegara al recinto, el coordinador había llevado el equipo al interior porque se esperaba lluvia. Cuando Simon llegó, los voluntarios estaban colocando sillas. Mientras revisaba el sistema de sonido, se fue la luz. Llamó al administrador del edificio, quien le explicó que un equipo de reparación había estado trabajando cerca más temprano esa mañana. El equipo retrasó el comienzo veinte minutos, pero para cuando entraron los invitados, la luz había vuelto.
    note: 'Fíjate en las capas temporales inglesas: *had moved* para lo anterior, *were setting up* para el trasfondo y *went out* para el hecho principal.'
  en.b2.unit04.lesson04.teach.q_walk_me_through:
    title: Harper pide que le cuente la historia
    gloss: 'Harper pregunta: ¿Puedes contarme paso a paso qué pasó en el recinto?'
    note: '*walk me through* significa guiar a alguien paso a paso por un suceso.'
  en.b2.unit04.lesson04.teach.a_arrived_volunteers:
    title: Simon combina capas temporales
    gloss: 'Simon dice: Claro. Cuando llegué, los voluntarios estaban colocando las sillas, pero el coordinador ya había llevado el equipo al interior porque se esperaba lluvia.'
    note: Un buen relato combina la acción de trasfondo con un suceso anterior.
  en.b2.unit04.lesson04.teach.q_equipment_safe:
    title: Harper comprueba el orden
    gloss: 'Harper pregunta: ¿O sea que el equipo estaba a salvo antes de que llegaras?'
    note: 'La pregunta trata del orden: el equipo ya estaba a salvo antes de la llegada de Simon.'
  en.b2.unit04.lesson04.teach.a_power_went_out:
    title: Simon cuenta la interrupción
    gloss: 'Simon dice: Exacto. Luego, mientras yo revisaba el sistema de sonido, se fue la luz.'
    note: '*while I was checking* es la acción en curso; *the power went out* es la interrupción.'
  en.b2.unit04.lesson04.teach.q_after_that:
    title: Harper pregunta por el siguiente paso
    gloss: 'Harper pregunta: ¿Qué hiciste después?'
    note: '*What did you do...?* usa simple past con *did* para preguntar por un paso ya terminado.'
  en.b2.unit04.lesson04.teach.a_repair_crew:
    title: Simon cuenta un trasfondo anterior
    gloss: 'Simon dice: Llamé al administrador del edificio y me dijo que un equipo de reparación había estado trabajando cerca más temprano esa mañana.'
    note: '*had been working* indica que ese trabajo ya estaba en marcha antes, esa mañana.'
  en.b2.unit04.lesson04.teach.q_event:
    title: Harper pregunta por el evento
    gloss: 'Harper pregunta: ¿Y el evento?'
    note: La pregunta breve pide la consecuencia para el evento.
  en.b2.unit04.lesson04.teach.a_delayed_start:
    title: Simon cierra el relato
    gloss: 'Simon dice: Retrasamos el comienzo veinte minutos, pero para cuando entraron los invitados, la luz ya había vuelto.'
    note: '*had come back on* ocurrió antes del momento en que entraron los invitados.'
