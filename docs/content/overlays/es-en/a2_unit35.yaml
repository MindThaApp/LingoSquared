teaching:
  en.a2.unit35.lesson01.teach.pharmacy:
    title: pharmacy
    gloss: farmacia
    note: '*pharmacy* es la tienda donde te dan tus medicamentos.'
    example_gloss: Al lado del consultorio médico hay una farmacia.
  en.a2.unit35.lesson01.teach.pharmacist:
    title: pharmacist
    gloss: farmacéutico / farmacéutica
    note: '*pharmacist* es la persona que te entrega los medicamentos.'
    example_gloss: El farmacéutico me explicó cómo tomar el medicamento.
  en.a2.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: pastilla
    note: '*tablet* es una pieza sólida de medicamento que se traga.'
    example_gloss: Tomo una pastilla por la mañana y otra por la noche.
  en.a2.unit35.lesson01.teach.dose:
    title: dose
    gloss: dosis
    note: '*dose* es la cantidad de medicamento que tomas cada vez.'
    example_gloss: La dosis es una pastilla, dos veces al día.
  en.a2.unit35.lesson01.teach.refill:
    title: refill
    gloss: resurtido / otra entrega de la receta
    note: '*refill* es otra caja del mismo medicamento, sin tener que volver al médico.'
    example_gloss: Necesito un resurtido porque mis pastillas están por acabarse.
  en.a2.unit35.lesson01.teach.side_effects:
    title: side effects
    gloss: efectos secundarios
    note: '*side effects* son los efectos adicionales que un medicamento puede tener en el cuerpo.'
    example_gloss: El farmacéutico me explicó los efectos secundarios de este medicamento.
  en.a2.unit35.lesson01.teach.grammar_frequency:
    title: Sagen, wie oft man etwas einnimmt
    gloss: una vez al día, dos veces al día, tres veces al día, cada ocho horas
    note: '*once a day* = una vez al día, *twice a day* = dos veces al día, *three times a day* = tres veces al día, *every eight hours* = cada ocho horas.'
  en.a2.unit35.lesson02.teach.pick_up_prescription:
    title: Sagen, weshalb man am Tresen steht
    gloss: Quisiera recoger una receta.
    note: '*I''d like to...* es la forma educada y habitual de decir lo que quieres.'
  en.a2.unit35.lesson02.teach.take_one_tablet:
    title: Die Dosierung, die man zu hören bekommt
    gloss: Tome una pastilla dos veces al día, con las comidas.
    note: '*with food* significa con comida, es decir, no con el estómago vacío.'
  en.a2.unit35.lesson02.teach.ask_how_many_days:
    title: Fragen, wie lange man es einnehmen muss
    gloss: ¿Durante cuántos días debo tomarlo?
    note: Se usa *How many...?* con cosas que se pueden contar, como los días.
  en.a2.unit35.lesson02.teach.ask_side_effects:
    title: Nach Nebenwirkungen fragen
    gloss: ¿Tiene efectos secundarios?
    note: '*Are there any...?* es la forma habitual de preguntar si existe algo.'
  en.a2.unit35.lesson02.teach.grammar_should:
    title: should und shouldn't für Anweisungen
    gloss: Debería tomarlo con comida. No debería dejarlo antes de tiempo.
    note: '*should* da un consejo o una indicación; *shouldn''t* es su forma negativa.'
  en.a2.unit35.lesson03.teach.before_bed:
    title: before bed
    gloss: antes de dormir
    note: '*before bed* significa antes de irte a dormir.'
    example_gloss: Algunos medicamentos funcionan mejor si los tomas antes de dormir.
  en.a2.unit35.lesson03.teach.label_text:
    title: Das Apothekenetikett
    gloss: 'Medicamento para el resfriado. Tomar una pastilla dos veces al día con las comidas, durante cinco días. No dejar de tomar las pastillas antes de tiempo. Posibles efectos secundarios: puede sentir cansancio. Resurtidos: uno.'
    note: 'La etiqueta de un medicamento es breve y directa: frases cortas y sin fórmulas de cortesía.'
  en.a2.unit35.lesson03.teach.do_not_stop_early:
    title: Der Warnhinweis auf dem Etikett
    gloss: No dejar de tomar las pastillas antes de tiempo.
    note: '*Do not...* es la prohibición en imperativo que se ve en etiquetas y letreros.'
  en.a2.unit35.lesson04.teach.q_pick_up:
    title: Daniel meldet sich am Tresen
    gloss: 'Daniel dice: Hola, quisiera recoger una receta.'
    note: '*Hi* es más informal que *Hello*, pero en un mostrador es totalmente normal.'
  en.a2.unit35.lesson04.teach.a_what_is_your_name:
    title: Der Apotheker fragt nach dem Namen
    gloss: 'El farmacéutico dice: Claro. ¿Cómo se llama?'
    note: '*Of course* significa aquí: claro, no hay problema.'
  en.a2.unit35.lesson04.teach.q_doctor_gave_me_medicine:
    title: Daniel nennt den Grund für das Medikament
    gloss: 'Daniel dice: Daniel. El médico me recetó un medicamento para un resfriado fuerte.'
    note: 'Esto retoma la consulta médica de la unidad 28: es el mismo resfriado.'
  en.a2.unit35.lesson04.teach.a_here_it_is:
    title: Der Apotheker nennt die Dosierung
    gloss: 'El farmacéutico dice: Aquí tiene. Tome una pastilla dos veces al día, con las comidas.'
    note: '*Here it is* se dice al entregarle algo a alguien.'
  en.a2.unit35.lesson04.teach.q_how_many_days:
    title: Daniel fragt, wie lange
    gloss: 'Daniel pregunta: ¿Durante cuántos días debo tomarlo?'
    note: Es la misma pregunta de la lección 2.
  en.a2.unit35.lesson04.teach.a_five_days_no_stopping:
    title: Die Antwort des Apothekers
    gloss: 'El farmacéutico dice: Durante cinco días. No deje de tomar las pastillas antes de tiempo.'
    note: Es la misma indicación de la etiqueta de la lección 3.
  en.a2.unit35.lesson04.teach.q_any_side_effects:
    title: Daniel fragt nach Nebenwirkungen
    gloss: 'Daniel pregunta: ¿Tiene efectos secundarios?'
    note: Es la misma pregunta de la lección 2.
  en.a2.unit35.lesson04.teach.a_you_may_feel_tired:
    title: Der Apotheker nennt die Nebenwirkung
    gloss: 'El farmacéutico dice: Puede sentir cansancio, pero nada más.'
    note: '*but that''s all* significa aquí: pero nada más.'
  en.a2.unit35.lesson04.teach.q_thank_you:
    title: Daniel bedankt sich beim Apotheker
    gloss: 'Daniel dice: Muchas gracias.'
    note: '*very much* hace que el agradecimiento sea más enfático.'
