teaching:
  en.b1.unit17.lesson01.teach.regret:
    title: regret
    gloss: arrepentimiento, pesar
    note: '*regret* es un sentimiento de tristeza por algo que hiciste o que no hiciste.'
    example_gloss: Daniel se arrepentía de haber perdido la fecha límite.
  en.b1.unit17.lesson01.teach.wish:
    title: wish
    gloss: deseo
    note: '*wish* significa desear que algo hubiera sido distinto de como fue en realidad.'
    example_gloss: Daniel tenía un deseo sobre la semana pasada.
  en.b1.unit17.lesson01.teach.mistake:
    title: mistake
    gloss: error
    note: '*mistake* es algo que hiciste mal por un mal juicio.'
    example_gloss: Esperar tanto para pedir ayuda fue un error.
  en.b1.unit17.lesson01.teach.hindsight:
    title: hindsight
    gloss: en retrospectiva, a posteriori
    note: '*hindsight* es la comprensión de un hecho que solo se tiene después de que ocurrió.'
    example_gloss: En retrospectiva, Daniel debería haber hablado antes.
  en.b1.unit17.lesson01.teach.procrastinate:
    title: procrastinate
    gloss: procrastinar, postergar
    note: '*procrastinate* significa dejar para después algo que deberías hacer.'
    example_gloss: Daniel suele postergar las tareas cuando le parecen difíciles.
  en.b1.unit17.lesson01.teach.delay:
    title: delay
    gloss: retraso, demora
    note: '*delay* es un periodo por el cual algo llega más tarde de lo previsto.'
    example_gloss: El retraso hizo que Daniel perdiera su primera fecha límite.
  en.b1.unit17.lesson02.teach.wish_had_asked:
    title: I wish I had + participio
    gloss: Ojalá hubiera pedido ayuda antes.
    note: '*I wish I had asked* expresa un deseo sobre algo que no pasó en el pasado.'
  en.b1.unit17.lesson02.teach.should_have_talked:
    title: I should have + participio
    gloss: Debí haber hablado antes con mi jefe.
    note: '*I should have talked* dice lo que habría sido correcto hacer, visto en retrospectiva.'
  en.b1.unit17.lesson02.teach.if_i_had_asked_would_have_finished:
    title: if I had + participio, I would have + participio
    gloss: Si le hubiera pedido ayuda a Mia en la primera semana, habría terminado a tiempo.
    note: '*if I had asked..., I would have finished...* describe una consecuencia irreal en el pasado.'
  en.b1.unit17.lesson02.teach.grammar_past_hypothetical:
    title: Formas para expresar arrepentimiento por el pasado
    gloss: 'Para expresar arrepentimiento por el pasado se usa wish + past perfect (I wish I had asked...), should have + participio (I should have talked...) o if + past perfect con would have + participio (If I had asked..., I would have finished...). Las tres formas describen lo que en realidad no ocurrió. En español hay estructuras parecidas: «ojalá hubiera pedido», «debí haber hablado», «si hubiera pedido..., habría terminado».'
    note: 'Forma: elige entre wish + had, should have o if + had ... would have.'
  en.b1.unit17.lesson03.teach.looking_back:
    title: looking back
    gloss: mirando atrás, en retrospectiva
    note: '*looking back* introduce una reflexión sobre el pasado.'
    example_gloss: Mirando atrás, Daniel desearía haber pedido ayuda antes.
  en.b1.unit17.lesson03.teach.missed_deadline:
    title: missed deadline
    gloss: fecha límite perdida
    note: '*missed deadline* es una fecha que no se cumplió.'
    example_gloss: Daniel perdió una fecha límite antes de pedir ayuda.
  en.b1.unit17.lesson03.teach.reading_passage:
    title: 'Lectura: balance de un mes agotador'
    gloss: 'Hola, Leila: mirando atrás, ojalá hubiera pedido ayuda antes. Debí haber hablado antes con mi jefe sobre la carga de trabajo. Cuando lo hice, ya había perdido una fecha límite. Si le hubiera pedido ayuda a Mia en la primera semana, habría terminado los dos proyectos a tiempo. Fue un error esperar tanto. Daniel'
    note: Un mensaje breve y reflexivo.
  en.b1.unit17.lesson04.teach.q_wish_asked_sooner:
    title: Daniel empieza con una reflexión
    gloss: 'Daniel dice: Mirando atrás, ojalá hubiera pedido ayuda antes.'
    note: '*looking back* abre una conversación reflexiva.'
  en.b1.unit17.lesson04.teach.a_what_happened:
    title: Leila pregunta
    gloss: 'Leila dice: ¿Qué pasó?'
    note: Una pregunta breve y abierta para saber más.
  en.b1.unit17.lesson04.teach.q_should_have_talked_missed:
    title: Daniel explica lo que debería haber hecho
    gloss: 'Daniel dice: Debí haber hablado antes con mi jefe sobre la carga de trabajo. Cuando lo hice, ya había perdido una fecha límite.'
    note: '*should have talked* y *had already missed* unen el arrepentimiento con una consecuencia concreta.'
  en.b1.unit17.lesson04.teach.a_fair_regret_fixed:
    title: Leila tranquiliza a Daniel
    gloss: 'Leila dice: No te preocupes, al final lo resolviste.'
    note: '*Don''t worry* tranquiliza a alguien que se siente culpable.'
  en.b1.unit17.lesson04.teach.q_true_if_had_asked:
    title: Daniel describe qué podría haber sido diferente
    gloss: 'Daniel dice: Es verdad. Si le hubiera pedido ayuda a Mia en la primera semana, habría terminado los dos proyectos a tiempo.'
    note: '*if I had asked..., I would have finished...* describe una consecuencia irreal en el pasado.'
  en.b1.unit17.lesson04.teach.a_now_you_know:
    title: Leila cierra animando
    gloss: 'Leila dice: Bueno, ahora ya lo sabes para la próxima vez.'
    note: Un cierre breve y positivo de la conversación.
