course:
  title: Inglés B2
  description: Aprende inglés de nivel B2 para mantener conversaciones matizadas, argumentar, hacer suposiciones y participar en discusiones profesionales, con explicaciones en un español informal.
units:
  en.b2.unit02.speculation:
    title: It must have gone down overnight
lessons:
  en.b2.unit02.lesson01.certainty_and_deduction:
    title: May, might, must y cannot
  en.b2.unit02.lesson02.present_and_past_speculation:
    title: It must have been a system problem
  en.b2.unit02.lesson03.reading_an_incident_note:
    title: 'Lectura: ¿qué ha pasado probablemente?'
  en.b2.unit02.lesson04.the_speculation_dialogue:
    title: A deduction, not just a guess
teaching:
  en.b2.unit02.lesson01.teach.may:
    title: may
    gloss: puede, podría
    note: '*may* expresa posibilidad. Aquí no significa permiso, como en *May I...?*.'
    example_gloss: Esto puede ser verdad.
  en.b2.unit02.lesson01.teach.might:
    title: might
    gloss: podría, quizá
    note: '*might* expresa una posibilidad con cautela, a menudo algo menos segura que *may*.'
    example_gloss: Esto podría ser verdad.
  en.b2.unit02.lesson01.teach.must:
    title: must
    gloss: debe de, seguro que
    note: Aquí *must* expresa una conclusión firme basada en pruebas, no una obligación.
    example_gloss: Esto debe de ser verdad.
  en.b2.unit02.lesson01.teach.cannot:
    title: cannot
    gloss: no puede, es imposible que
    note: Usas *cannot* cuando las pruebas descartan algo. En pasado se convierte en *cannot have been*.
    example_gloss: Esto no puede ser verdad.
  en.b2.unit02.lesson01.teach.deduction:
    title: deduction
    gloss: conclusión basada en pruebas
    note: '*deduction* es razonar a partir de indicios, no adivinar sin más.'
    example_gloss: La conclusión de Mia se basa en pruebas.
  en.b2.unit02.lesson01.teach.guesswork:
    title: guesswork
    gloss: conjeturas al azar
    note: '*guesswork* es adivinar con pocas pruebas o ninguna.'
    example_gloss: Sin pruebas, la explicación sería una simple conjetura.
  en.b2.unit02.lesson01.teach.may_might_contrast:
    title: may y might
    gloss: May y might suelen solaparse. Ambos expresan una explicación posible; might suele sonar algo más cauteloso.
    note: Para expresar posibilidad con cuidado, *may* y *might* suelen sonar más pulidos que *maybe* en una frase formal.
  en.b2.unit02.lesson02.teach.must_have_gone_down:
    title: Conclusión firme sobre el pasado
    gloss: El servidor debe de haberse caído durante la noche, porque no se generó ningún informe.
    note: 'En inglés, la deducción sobre el pasado se forma con *must have* + participio: *must have gone down*.'
  en.b2.unit02.lesson02.teach.may_have_failed:
    title: Posible causa en el pasado
    gloss: Los informes quizá fallaron durante la noche.
    note: '*may have failed* indica una causa posible, no una conclusión segura.'
  en.b2.unit02.lesson02.teach.might_have_permission:
    title: Posibilidad con cautela
    gloss: Podría haber sido, en cambio, un problema de permisos.
    note: '*might have been* deja abierta la causa y suena más cauteloso que *must have been*.'
  en.b2.unit02.lesson02.teach.cannot_have_only_report:
    title: Descartar algo
    gloss: No puede haber sido solo un problema de los informes.
    note: '''No puede haber sido'' se dice en inglés *cannot have been* o, en lengua hablada, *can''t have been*.'
  en.b2.unit02.lesson02.teach.grammar_modal_deduction:
    title: Verbos modales para especular
    gloss: Usa must be para una conclusión firme sobre el presente y must have been para una conclusión firme sobre el pasado. Usa may/might para una posibilidad en el presente, y may have/might have para una posibilidad en el pasado. Usa cannot/cannot have been cuando las pruebas descartan una explicación.
    note: 'Ojo: aquí *must* no expresa obligación, sino ''tiene que ser así'': una conclusión.'
  en.b2.unit02.lesson03.teach.outage:
    title: outage
    gloss: caída del servicio, avería
    note: '*outage* es una avería en la que un sistema o servicio deja de funcionar.'
    example_gloss: Una caída del sistema impidió que se ejecutaran los informes.
  en.b2.unit02.lesson03.teach.consequence:
    title: consequence
    gloss: consecuencia
    note: '*consequence* es el resultado de una causa o de un problema.'
    example_gloss: Una consecuencia es que el panel puede mostrar datos antiguos.
  en.b2.unit02.lesson03.teach.reading_passage:
    title: 'Texto: ¿qué ha pasado probablemente?'
    gloss: Los informes nocturnos no se ejecutaron y la página de monitorización está en blanco. Mia dice que el servidor debe de haberse caído durante la noche. Daniel sugiere que podría haber sido un problema de permisos, pero eso no puede explicar la página de monitorización en blanco. Puede que el equipo de finanzas no tenga las cifras de la mañana, y el panel de los clientes podría mostrar datos antiguos hasta que se vuelvan a generar los informes. Mia no está del todo segura, pero su explicación es una deducción a partir de las pruebas disponibles, no una simple conjetura.
    note: El texto separa hechos, causas posibles, conclusiones firmes, explicaciones descartadas y posibles consecuencias.
  en.b2.unit02.lesson04.teach.q_no_reports:
    title: Daniel menciona el hecho
    gloss: 'Daniel dice: Ninguno de los informes nocturnos se generó.'
    note: Este es el hecho conocido, todavía no una especulación.
  en.b2.unit02.lesson04.teach.a_server_down:
    title: Mia saca una conclusión firme
    gloss: 'Mia dice: El servidor debe de haberse caído durante la noche.'
    note: '*must have gone down* es una conclusión firme sobre el pasado.'
  en.b2.unit02.lesson04.teach.q_permission_issue:
    title: Daniel menciona una posible causa
    gloss: 'Daniel dice: Podría haber sido, en cambio, un problema de permisos.'
    note: '*might have been* deja abierta la opción, pero no la convierte en algo seguro.'
  en.b2.unit02.lesson04.teach.a_cannot_only_report:
    title: Mia descarta una explicación limitada
    gloss: 'Mia dice: Quizá, pero la página de monitorización también está en blanco, así que no puede haber sido solo un problema de los informes.'
    note: '*cannot have been only...* descarta la explicación porque las pruebas son más amplias.'
  en.b2.unit02.lesson04.teach.q_consequences:
    title: Daniel pregunta por las consecuencias
    gloss: 'Daniel pregunta: ¿Qué consecuencias deberíamos esperar?'
    note: Después de la causa viene la pregunta por las posibles consecuencias.
  en.b2.unit02.lesson04.teach.a_possible_consequences:
    title: Mia menciona posibles consecuencias
    gloss: 'Mia dice: Puede que el equipo de finanzas no tenga las cifras de la mañana, y el panel de los clientes podría mostrar datos antiguos.'
    note: '*may be missing* y *might show* expresan consecuencias posibles, no hechos seguros.'
  en.b2.unit02.lesson04.teach.q_deduction_guess:
    title: Daniel comprueba el grado de certeza
    gloss: 'Daniel dice: ¿Entonces es una deducción, no una simple conjetura?'
    note: Daniel pregunta si el razonamiento de Mia se apoya en pruebas.
  en.b2.unit02.lesson04.teach.a_evidence_limited:
    title: Mia matiza su conclusión
    gloss: 'Mia dice: Sí. Las pruebas son limitadas, pero apuntan a una caída del sistema.'
    note: Una conclusión firme puede reconocer, aun así, que las pruebas son limitadas.
