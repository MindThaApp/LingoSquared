course:
  title: Inglés A2
  description: Inglés de nivel A2 para situaciones cotidianas algo más formales, con explicaciones detalladas en español.
units:
  en.a2.unit40.online_order_problem:
    title: Un problema con un pedido en línea
lessons:
  en.a2.unit40.lesson01.online_order_vocabulary:
    title: Pedidos, entregas y paquetes dañados
  en.a2.unit40.lesson02.explaining_the_problem:
    title: Explicar el problema y pedir un reemplazo
  en.a2.unit40.lesson03.reading_a_return_message:
