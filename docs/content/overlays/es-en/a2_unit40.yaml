teaching:
  en.a2.unit40.lesson01.teach.order:
    title: order
    gloss: pedido
    note: '*order* es el pedido en sí. Como verbo, *to order* significa pedir.'
    example_gloss: Mi pedido llegó dos días tarde.
  en.a2.unit40.lesson01.teach.delivery:
    title: delivery
    gloss: entrega
    note: '*delivery* es el momento en que te llevan tu pedido a casa.'
    example_gloss: La entrega llegó el martes por la mañana.
  en.a2.unit40.lesson01.teach.parcel:
    title: parcel
    gloss: paquete
    note: '*parcel* es el paquete empacado que dejan en tu puerta.'
    example_gloss: El paquete se dejó afuera, frente a mi puerta.
  en.a2.unit40.lesson01.teach.damaged:
    title: damaged
    gloss: dañado
    note: '*damaged* dice que algo se dañó en el camino, pero quizá todavía funcione. Se suele decir de la caja o el empaque.'
    example_gloss: La caja estaba dañada cuando llegó.
  en.a2.unit40.lesson01.teach.broken:
    title: broken
    gloss: roto
    note: '*broken* es más fuerte que *damaged*: la cosa ya no funciona.'
    example_gloss: La lámpara que venía en el paquete estaba rota.
  en.a2.unit40.lesson01.teach.replacement:
    title: replacement
    gloss: reemplazo
    note: '*replacement* es un artículo nuevo en lugar del roto. *refund* es la devolución del dinero.'
    example_gloss: Pedí un reemplazo en lugar de un reembolso.
  en.a2.unit40.lesson01.teach.grammar_arrived:
    title: arrived y has not arrived yet
    gloss: Mi pedido llegó ayer. Mi pedido todavía no ha llegado.
    note: Usa *arrived* con un momento del pasado. *has not arrived yet* dice que todavía lo estás esperando.
  en.a2.unit40.lesson02.teach.report_order_problem:
    title: Decir para qué llamas
    gloss: Quisiera informar de un problema con mi pedido.
    note: '*I''d like to report a problem with ...* es la misma forma cortés que se usó para la fuga en la unidad 29.'
  en.a2.unit40.lesson02.teach.lamp_arrived_broken:
    title: Decir qué es lo que falla
    gloss: La lámpara llegó rota.
    note: '*arrived broken* significa: ya estaba rota cuando llegó.'
  en.a2.unit40.lesson02.teach.ask_for_replacement:
    title: Elegir entre reemplazo y reembolso
    gloss: ¿Podría darme un reemplazo en lugar de un reembolso?
    note: '*instead of* contrapone dos opciones: eliges la primera, no la segunda.'
  en.a2.unit40.lesson02.teach.my_order_number:
    title: Dar tu número de pedido
    gloss: Mi número de pedido es 8154.
    note: Di tu número de pedido en cuanto te lo pidan; con él la persona encuentra tu pedido.
  en.a2.unit40.lesson02.teach.grammar_instead_of:
    title: instead of para elegir
    gloss: ¿Podría darme un reemplazo en lugar de un reembolso? Quisiera un reembolso en lugar de un cambio.
    note: 'Después de *instead of* va un sustantivo o una forma con -ing (*instead of a refund*, *instead of getting a refund*). En español se dice «en lugar de obtener», pero en inglés no se usa el verbo base: no se dice *instead of get a refund*.'
  en.a2.unit40.lesson03.teach.box:
    title: box
    gloss: caja
    note: '*box* es la caja en la que viene tu pedido. *parcel* es todo el paquete tal como se entrega.'
    example_gloss: La lámpara estaba en una caja grande.
  en.a2.unit40.lesson03.teach.return_message:
    title: Respuesta de la tienda
    gloss: Gracias por su mensaje. Lamentamos que su lámpara haya llegado rota. Por favor, vuelva a poner la lámpara en la caja y llévela a la oficina de correos. Se enviará una lámpara nueva en un plazo de tres días hábiles. Número de pedido 8154.
    note: 'Una respuesta del servicio al cliente siempre menciona: el problema, qué debe hacer usted y qué hará la tienda.'
  en.a2.unit40.lesson03.teach.put_it_back_in_the_box:
    title: Qué debes hacer con la lámpara rota
    gloss: Por favor, vuelva a poner la lámpara en la caja y llévela a la oficina de correos.
    note: '*put ... back in ...* significa volver a poner algo donde estaba.'
  en.a2.unit40.lesson04.teach.q_report_a_problem:
    title: Leila llama a la tienda online
    gloss: 'Leila dice: Buenos días, quisiera informar de un problema con mi pedido.'
    note: Por teléfono, dices enseguida para qué llamas.
  en.a2.unit40.lesson04.teach.a_what_is_the_problem:
    title: El empleado pregunta
    gloss: 'El representante dice: Lamento oír eso. ¿Cuál es el problema?'
    note: '*I''m sorry to hear that* es la reacción fija y cortés de un representante ante una mala noticia.'
  en.a2.unit40.lesson04.teach.q_lamp_broken_box_damaged:
    title: Leila explica el problema
    gloss: 'Leila dice: La lámpara llegó rota. La caja estaba dañada.'
    note: 'Fíjate en la diferencia: la caja está *damaged* y la lámpara está *broken*.'
  en.a2.unit40.lesson04.teach.a_ask_order_number:
    title: El empleado pregunta el número de pedido
    gloss: 'El representante dice: Entiendo. ¿Podría decirme su número de pedido?'
    note: Es la misma pregunta indirecta *Could you tell me ...?* de la unidad 39.
  en.a2.unit40.lesson04.teach.q_order_number_8154:
    title: Leila da su número de pedido
    gloss: 'Leila dice: Mi número de pedido es 8154.'
    note: Es la misma frase de la lección 2.
  en.a2.unit40.lesson04.teach.a_refund_or_replacement:
    title: El empleado ofrece dos opciones
    gloss: 'El representante dice: Gracias. ¿Desea un reembolso o un reemplazo?'
    note: Aquí *or* pone dos posibilidades una junto a la otra; eliges una de ellas.
  en.a2.unit40.lesson04.teach.q_replacement_please:
    title: Leila elige el reemplazo
    gloss: 'Leila dice: ¿Podría darme un reemplazo en lugar de un reembolso?'
    note: Es la misma pregunta de la lección 2.
  en.a2.unit40.lesson04.teach.a_new_lamp_three_days:
    title: El empleado lo resuelve
    gloss: 'El representante dice: Por supuesto. Se enviará una lámpara nueva en un plazo de tres días hábiles.'
    note: Es la misma promesa del mensaje de la lección 3.
  en.a2.unit40.lesson04.teach.q_thank_you:
    title: Leila da las gracias al empleado
    gloss: 'Leila dice: Muchas gracias.'
    note: '*very much* hace que el agradecimiento sea un poco más enfático.'
