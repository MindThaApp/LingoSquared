teaching:
  en.a1.unit46.lesson01.teach.lost:
    title: lost
    gloss: perdido
    note: '*lost* significa perdido (del verbo *lose*, perder). *I lost my wallet* es "perdí mi cartera" o "he perdido mi cartera".'
    example_gloss: Perdí mi cartera.
  en.a1.unit46.lesson01.teach.found:
    title: found
    gloss: encontrado
    note: '*found* es el pasado y el participio de find: I found your keys = encontré tus llaves / he encontrado tus llaves.'
    example_gloss: ¡He encontrado tus llaves!
  en.a1.unit46.lesson01.teach.keys:
    title: keys
    gloss: llaves
    note: '*keys* significa llaves.'
    example_gloss: Estas son mis llaves.
  en.a1.unit46.lesson01.teach.wallet:
    title: wallet
    gloss: cartera
    note: '*wallet* significa cartera.'
    example_gloss: ¿Es esta tu cartera?
  en.a1.unit46.lesson01.teach.backpack:
    title: backpack
    gloss: mochila
    note: '*backpack* significa mochila.'
    example_gloss: Mi mochila es negra.
  en.a1.unit46.lesson02.teach.i_lost_my_wallet:
    title: I lost my wallet.
    gloss: Perdí mi cartera.
    note: Literalmente "perdí mi cartera"; en inglés se usa el pasado simple *lost*, aunque en español también es habitual decir "he perdido mi cartera".
  en.a1.unit46.lesson02.teach.have_you_seen_my_keys:
    title: Have you seen my keys?
    gloss: ¿Has visto mis llaves?
    note: '*Have you seen ...?* significa ¿has visto ...? -- la misma construcción que en español, con *have* como auxiliar.'
  en.a1.unit46.lesson02.teach.has_anyone_found_a_backpack:
    title: Has anyone found a backpack?
    gloss: ¿Alguien ha encontrado una mochila?
    note: '*Has anyone found ...?* significa ¿alguien ha encontrado ...?'
  en.a1.unit46.lesson02.teach.its_black_with_a_red_strap:
    title: It's black with a red strap.
    gloss: Es negra con una correa roja.
    note: '*It''s black with a red strap.* significa es negra con una correa roja.'
  en.a1.unit46.lesson02.teach.wheres_the_lost_and_found:
    title: Where's the lost and found?
    gloss: ¿Dónde está la oficina de objetos perdidos?
    note: '*the lost and found* es el nombre fijo en inglés de la oficina de objetos perdidos; literalmente, "lo perdido y encontrado".'
  en.a1.unit46.lesson02.teach.yes_we_found_it:
    title: Yes, we found it!
    gloss: ¡Sí, la hemos encontrado!
    note: '*Yes, we found it!* significa ¡sí, la hemos encontrado!'
  en.a1.unit46.lesson03.teach.dialogue_line1:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: Mia, ¿dónde está tu mochila? La tenías junto a la fuente.'
    note: '*had* es el pasado de *have* (tener): you had it = la tenías.'
  en.a1.unit46.lesson03.teach.dialogue_line2:
    title: El susto de Mia
    gloss: 'Mia dice: ¡Ay, no, tienes razón! No la tengo. ¡Mi cámara está dentro!'
    note: '*My camera is inside!* significa ¡mi cámara está dentro!'
  en.a1.unit46.lesson03.teach.dialogue_line3:
    title: La propuesta de Daniel
    gloss: 'Daniel dice: No te preocupes, llamemos a la oficina del parque y preguntemos.'
    note: '*Don''t worry* significa no te preocupes.'
  en.a1.unit46.lesson03.teach.dialogue_line4:
    title: Daniel llama
    gloss: 'Daniel dice: Hola, hemos perdido una mochila negra cerca de la fuente. ¿Alguien ha encontrado una?'
    note: '*we lost a black backpack* significa hemos perdido una mochila negra -- el inglés usa aquí simplemente el pasado *lost*.'
  en.a1.unit46.lesson03.teach.dialogue_line5:
    title: La pregunta de Mia
    gloss: 'Mia dice: ¿Qué dijeron?'
    note: '*did they say* usa *did* como auxiliar en el pasado.'
  en.a1.unit46.lesson03.teach.dialogue_line6:
    title: La buena noticia de Daniel
    gloss: 'Daniel dice: ¡La han encontrado! Es negra con una correa amarilla, ¿verdad? La tienen en recepción.'
    note: '*right?* al final de una frase es una pregunta breve para confirmar, parecida a "¿verdad?" o "¿no?" en español.'
  en.a1.unit46.lesson03.teach.dialogue_line7:
    title: El alivio de Mia
    gloss: 'Mia dice: ¡Sí, es esa! Vayamos a buscarla ahora mismo. Gracias a Dios.'
    note: '*Let''s go get it* significa vamos a buscarla, con dos verbos seguidos y sin *to*.'
  en.a1.unit46.lesson04.teach.reading_passage:
    title: Texto sobre la oficina de objetos perdidos
    gloss: 'Objetos perdidos: si pierdes algo en el parque, piensa primero dónde lo tuviste por última vez. Después ve a la oficina del parque, cerca de la entrada principal, y describe el objeto: indica su color y cualquier detalle especial. Da tu nombre y tu número de teléfono para que el personal pueda llamarte si lo encuentra más tarde. Después de que Mia perdió su mochila cerca de la fuente, ella y Daniel llamaron enseguida a la oficina del parque. El personal ya la había encontrado y la tenía en recepción. Mia se alivió mucho al recuperar su cámara sana y salva. Más tarde, le contó toda la historia a Leila, y Leila dijo que la próxima vez ayudaría a Mia a controlar mejor sus cosas.'
    note: '*keep better track of your things* significa controlar mejor tus cosas.'
