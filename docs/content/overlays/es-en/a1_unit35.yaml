teaching:
  en.a1.unit35.lesson01.teach.phone:
    title: phone
    gloss: teléfono
    note: '*phone* significa teléfono.'
    example_gloss: Llamo a mi mamá con mi teléfono.
  en.a1.unit35.lesson01.teach.laptop:
    title: laptop
    gloss: computadora portátil
    note: '*laptop* significa computadora portátil.'
    example_gloss: Ella usa su portátil para el trabajo.
  en.a1.unit35.lesson01.teach.tablet:
    title: tablet
    gloss: tableta
    note: '*tablet* significa tableta.'
    example_gloss: Él lee libros en su tableta.
  en.a1.unit35.lesson01.teach.computer:
    title: computer
    gloss: computadora
    note: '*computer* significa computadora (u ordenador).'
    example_gloss: Tenemos una computadora en casa.
  en.a1.unit35.lesson01.teach.app:
    title: app
    gloss: aplicación
    note: '*app* significa aplicación.'
    example_gloss: Tengo una aplicación nueva en mi teléfono.
  en.a1.unit35.lesson01.teach.camera:
    title: camera
    gloss: cámara
    note: '*camera* significa cámara.'
    example_gloss: Esta cámara saca fotos geniales.
  en.a1.unit35.lesson02.teach.make_a_call:
    title: make a call
    gloss: llamar por teléfono
    note: '*make a call* es una combinación fija de verbo + sustantivo que debes memorizar junta. En español también podemos decir «hacer una llamada», pero lo más común es el verbo «llamar», que en inglés suele expresarse con *call* como verbo o con *make a call*.'
    example_gloss: Llamo a mi hermano todos los domingos.
  en.a1.unit35.lesson02.teach.send_a_text:
    title: send a text
    gloss: enviar un mensaje de texto
    note: '*send a text* es, igual que *make a call*, una combinación fija de verbo + sustantivo. En español decimos «mandar un mensaje» o «escribir por el móvil». En inglés lo habitual es *send a text*.'
    example_gloss: Ella le manda un mensaje a su amiga todas las mañanas.
  en.a1.unit35.lesson02.teach.download_an_app:
    title: download an app
    gloss: descargar una aplicación
    note: '*download an app*: *download* corresponde al verbo «descargar», así que esta es la más fácil de las tres combinaciones fijas.'
    example_gloss: Él descarga una aplicación nueva cada semana.
  en.a1.unit35.lesson02.teach.wifi:
    title: wifi
    gloss: internet inalámbrico
    note: '*wifi* significa conexión inalámbrica a internet.'
    example_gloss: El wifi de mi casa es rápido.
  en.a1.unit35.lesson02.teach.battery:
    title: battery
    gloss: batería
    note: '*battery* significa batería.'
    example_gloss: A la batería de mi teléfono le queda poca carga.
  en.a1.unit35.lesson02.teach.how_use_phone_question:
    title: How do you use your phone?
    gloss: ¿Cómo usas tu teléfono?
    note: '*Do you use ...?* usa el mismo auxiliar *do* que otras preguntas en inglés.'
  en.a1.unit35.lesson03.teach.dialogue_line1:
    title: La queja de Mia
    gloss: 'Mia dice: Mi teléfono es muy viejo. Es muy lento.'
    note: '*so* + adjetivo (*so old*) refuerza el significado, como «tan» o «muy» en español.'
  en.a1.unit35.lesson03.teach.dialogue_line2:
    title: El consejo de Leila
    gloss: 'Leila dice: Deberías comprar uno nuevo. ¿Para qué lo usas más?'
    note: '*What do you use it for most?* termina con la preposición *for*. En español la preposición va al principio de la pregunta («¿Para qué lo usas?»), pero en inglés se empieza con *what* y *for* se queda al final.'
  en.a1.unit35.lesson03.teach.dialogue_line3:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Sobre todo le escribo mensajes a mi hermana y saco fotos.'
    note: '*text* también puede usarse como verbo (*I text my sister*). Es más común que *send a text*; ambas son correctas en inglés.'
  en.a1.unit35.lesson03.teach.dialogue_line4:
    title: El uso de Leila
    gloss: 'Leila dice: Uso mi teléfono para llamar a mis padres cada fin de semana. También uso muchas aplicaciones.'
    note: '*call* como verbo (*I call my parents*) es la forma normal e informal. *Make a call* es la combinación fija de la lección 2.'
  en.a1.unit35.lesson03.teach.dialogue_line5:
    title: La pregunta de Mia
    gloss: 'Mia pregunta: ¿Qué aplicaciones usas tú?'
    note: '*Which apps do you use?*: *which* pregunta por una elección dentro de un grupo (aplicaciones), como «cuáles» o «qué» en español.'
  en.a1.unit35.lesson03.teach.dialogue_line6:
    title: Leila's apps
    gloss: 'Leila dice: Uso una aplicación de cocina y una de mapas. ¿Quieres descargarlas?'
    note: '*Do you want to ...?* lleva el auxiliar *do*, aunque *want* sea un verbo común.'
  en.a1.unit35.lesson03.teach.dialogue_line7:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Sí, por favor, ¡mándame los nombres!'
    note: '*please* va aquí antes del verbo (*please send ...*) y hace la petición más cortés.'
  en.a1.unit35.lesson04.teach.reading_passage:
    title: Texto sobre Daniel, Leila y Mia
    gloss: Daniel, Leila y Mia usan su teléfono de maneras distintas. A Daniel no le gusta escribir mensajes; prefiere llamar a la gente. Leila usa su teléfono para los mapas. También usa una aplicación de cocina cuando prueba recetas nuevas. Mia saca muchas fotos y se las manda a su familia. Todos usan una computadora portátil para trabajar y hacen videollamadas con sus amigos los fines de semana.
    note: '*He prefers to call people instead*: *instead* al final de la frase significa «en su lugar» (es decir, en lugar de escribir mensajes).'
