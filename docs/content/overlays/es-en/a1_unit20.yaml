    title: Which bag is cheaper, the small one or the big one?
    gloss: ¿Qué bolsa es más barata, la pequeña o la grande?
    note: Con *Which...?* preguntas cuál de dos cosas es más algo; aquí, cuál es más barata.
  en.a1.unit20.lesson02.teach.small_cheaper_than_big:
    title: The small bag is cheaper than the big bag.
    gloss: La bolsa pequeña es más barata que la bolsa grande.
    note: Usas *than* para comparar directamente dos cosas.
  en.a1.unit20.lesson02.teach.big_bag_nicer:
    title: The big bag is nicer than the small bag.
    gloss: La bolsa grande es más bonita que la bolsa pequeña.
    note: '*nicer* es el comparativo de *nice*.'
  en.a1.unit20.lesson03.teach.cheapest:
    title: cheapest
    gloss: el más barato
    note: '*cheapest* es el superlativo de *cheap* (para tres o más cosas).'
    example_gloss: Esta es la camisa más barata de la tienda.
  en.a1.unit20.lesson03.teach.car_comparison_text:
    title: 'Texto: comparar coches'
    gloss: El coche rojo es más rápido que el coche azul, pero el coche azul es más barato. El coche blanco es el más barato de los tres.
    note: 'Este texto compara tres coches: el rojo es más rápido que el azul, el azul es más barato que el rojo y el blanco es el más barato.'
  en.a1.unit20.lesson04.teach.how_much_cheaper:
    title: How much cheaper?
    gloss: ¿Cuánto más barato?
    note: '*How much...?* se usa para preguntar por el tamaño de una diferencia.'
  en.a1.unit20.lesson04.teach.by_five_dollars:
    title: cheaper by five dollars
    gloss: cinco dólares más barato
    note: '*by five dollars* indica la diferencia exacta.'
  en.a1.unit20.lesson04.teach.q_which_bag:
    title: Preguntar por la bolsa
    gloss: 'Leila pregunta: ¿Qué bolsa te gusta más, la pequeña o la grande?'
    note: Esta pregunta se parece a la de la segunda lección, pero ahora Leila pregunta cuál de las bolsas le gusta a Daniel.
  en.a1.unit20.lesson04.teach.a_big_nicer_small_cheaper:
    title: "Respuesta de Daniel"
    gloss: 'Daniel dice: La grande es más bonita, pero la pequeña es más barata.'
    note: Con *but* Daniel contrapone dos comparaciones.
  en.a1.unit20.lesson04.teach.q_how_much_cheaper:
    title: Preguntar por la diferencia
    gloss: 'Leila pregunta: ¿Cuánto más barata?'
    note: Es la misma pregunta de antes.
  en.a1.unit20.lesson04.teach.a_ten_fifteen_dollars:
    title: Precios exactos
    gloss: 'Daniel dice: La pequeña cuesta diez dólares y la grande, quince dólares.'
    note: 'Daniel dice el precio de las dos bolsas: diez y quince dólares.'
  en.a1.unit20.lesson04.teach.a_cheaper_by_five:
    title: La conclusión de Leila
    gloss: 'Leila dice: Bueno, la pequeña es cinco dólares más barata. Me llevo la pequeña.'
    note: Quince menos diez son cinco, así que la bolsa pequeña es cinco dólares más barata.
