  en.a1.unit50.lesson03.teach.dialogue_line1:
    title: Mia en recepción
    gloss: 'Mia dice: Hola, tenemos una reserva para dos noches.'
    note: '*we have a reservation* significa tenemos una reserva.'
  en.a1.unit50.lesson03.teach.dialogue_line2:
    title: El recepcionista les da la bienvenida
    gloss: 'El recepcionista dice: ¡Bienvenidas! ¿A nombre de quién está la reserva?'
    note: '*What''s the name on the reservation?* significa ¿a nombre de quién está la reserva?'
  en.a1.unit50.lesson03.teach.dialogue_line3:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Está a mi nombre, Leila.'
    note: El inglés dice *it's under my name* (literalmente "está debajo de mi nombre"), mientras que el español dice "está a mi nombre".
  en.a1.unit50.lesson03.teach.dialogue_line4:
    title: El recepcionista entrega la llave
    gloss: 'El recepcionista dice: Perfecto. Aquí tiene su llave. Su habitación tiene dos camas.'
    note: '*Your room has two beds.* significa su habitación tiene dos camas.'
  en.a1.unit50.lesson03.teach.dialogue_line5:
    title: La pregunta de Mia sobre el wifi
    gloss: 'Mia pregunta: ¿La habitación tiene wifi?'
    note: Repetición de la pregunta que ya aprendiste.
  en.a1.unit50.lesson03.teach.dialogue_line6:
    title: El recepcionista habla del desayuno
    gloss: 'El recepcionista dice: Sí, y el desayuno es abajo, de siete a diez.'
    note: '*from seven to ten* significa de siete a diez.'
  en.a1.unit50.lesson03.teach.dialogue_line7:
    title: La pregunta de Leila sobre la salida
    gloss: 'Leila dice: ¡Gracias! ¿A qué hora es la salida?'
    note: Repetición de la pregunta *What time is check-out?* que ya aprendiste.
  en.a1.unit50.lesson03.teach.dialogue_line8:
    title: El recepcionista habla de la salida
    gloss: 'El recepcionista dice: La salida es a las once.'
    note: '*Check-out is at eleven o''clock.* significa la salida es a las once.'
  en.a1.unit50.lesson04.teach.reading_passage:
    title: Texto sobre un fin de semana en la casa de huéspedes
    gloss: 'Un fin de semana en la casa de huéspedes: Mia y Leila hicieron un viaje corto a la montaña para el fin de semana. A Mia le encanta hacer fotos y a Leila le encanta pintar, así que era el lugar perfecto para relajarse. Cuando llegaron a la casa de huéspedes, le dijeron al recepcionista que tenían una reserva para dos noches, del 14 al 16 de noviembre. El recepcionista preguntó a nombre de quién estaba la reserva, y Leila dijo que estaba a su nombre. Su habitación tenía dos camas y wifi, y el desayuno estaba incluido todas las mañanas de siete a diez. La salida era a las once. Mia hizo muchas fotos de las montañas, y Leila pintó un pequeño cuadro de la vista desde su ventana. Daniel se quedó en casa ese fin de semana y se cocinó la cena, con una receta del libro de cocina que pidió prestado en la biblioteca. Cuando Mia y Leila volvieron, le enseñaron sus fotos y el cuadro, y a él le encantaron.'
    note: '*Their room had two beds and wifi* significa su habitación tenía dos camas y wifi.'
