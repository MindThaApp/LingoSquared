    gloss: ¡Hola! ¿Quieres comer el viernes? ¿Qué tal a la una en la cafetería?
    note: Es una invitación para comer.
  en.a1.unit17.lesson04.teach.works_for_me:
    title: Sunday works for me.
    gloss: El domingo me viene bien.
    note: '*works for me* significa que algo te viene bien.'
  en.a1.unit17.lesson04.teach.q_movie_weekend:
