  en.a1.unit17.lesson01.teach.do_you_want_to:
    title: Do you want to see a movie this weekend?
    gloss: ¿Quieres ver una película este fin de semana?
    note: Con *Do you want to...?* propones una actividad. Después de *to* va el verbo en infinitivo, sin ninguna terminación.
  en.a1.unit17.lesson01.teach.would_you_like_to:
    title: Would you like to go for a walk?
    gloss: ¿Te apetece ir a dar un paseo?
    note: '*Would you like to...?* es una variante algo más cortés de *Do you want to...?* Equivale a «¿Te gustaría...?».'
  en.a1.unit17.lesson02.teach.sure_id_love_to:
    title: Sure, I'd love to!
    gloss: ¡Claro, me encantaría!
    note: Con *I'd love to* aceptas con entusiasmo. *I'd* es la forma abreviada de *I would*; después de *to* se omite el verbo, porque ya aparece en la pregunta.
  en.a1.unit17.lesson02.teach.sorry_cant_busy:
    title: Sorry, I can't. I'm busy on Saturday.
    gloss: Lo siento, no puedo. El sábado estoy ocupado.
    note: Con esta frase rechazas la invitación y das el motivo. *can't* es la forma abreviada de *cannot*.
  en.a1.unit17.lesson02.teach.maybe_another_time:
    title: Maybe another time?
    gloss: ¿Quizá otro día?
    note: Así muestras que te gustaría quedar en otra ocasión.
  en.a1.unit17.lesson03.teach.have_lunch:
