teaching:
  en.b1.unit04.lesson01.teach.agree:
    title: agree
    gloss: estar de acuerdo
    note: '*agree* significa pensar que otra persona tiene razón.'
    example_gloss: Estoy de acuerdo contigo.
  en.b1.unit04.lesson01.teach.disagree:
    title: disagree
    gloss: no estar de acuerdo
    note: '*disagree* significa pensar que otra persona no tiene razón.'
    example_gloss: No estoy de acuerdo con esa opinión.
  en.b1.unit04.lesson01.teach.opinion:
    title: opinion
    gloss: opinión
    note: '*opinion* significa lo que una persona piensa de algo.'
    example_gloss: Cada quien tiene una opinión distinta.
  en.b1.unit04.lesson01.teach.believe:
    title: believe
    gloss: creer, opinar
    note: '*believe* significa pensar que algo es verdad.'
    example_gloss: Creo que es una buena idea.
  en.b1.unit04.lesson01.teach.reason:
    title: reason
    gloss: razón, motivo
    note: '*reason* es la explicación que hay detrás de una opinión.'
    example_gloss: ¿Cuál es tu razón para pensar eso?
  en.b1.unit04.lesson01.teach.save_time:
    title: save time
    gloss: ahorrar tiempo
    note: '*save time* significa necesitar menos tiempo para hacer algo.'
    example_gloss: Trabajar desde casa me ayuda a ahorrar tiempo.
  en.b1.unit04.lesson02.teach.agree_that_saves_time:
    title: Estar de acuerdo y dar un motivo
    gloss: Estoy de acuerdo en que trabajar desde casa es mejor porque se ahorra tiempo.
    note: '*I agree that... because...* une una opinión con una razón.'
  en.b1.unit04.lesson02.teach.disagree_that_miss_coworkers:
    title: Discrepar y dar un motivo
    gloss: No creo que sea mejor, porque se extraña a los compañeros de trabajo.
    note: '*I disagree that... because...* une una opinión contraria con una razón.'
  en.b1.unit04.lesson02.teach.grammar_agree_disagree_that:
    title: agree that / disagree that
    gloss: Estoy de acuerdo en que es mejor. No estoy de acuerdo en que sea mejor.
    note: Después de *agree*/*disagree*, *that* introduce la oración que dice la opinión con la que se está o no de acuerdo. En español se dice «de acuerdo en que»; en inglés no hay preposición y tampoco coma antes de *that*.
  en.b1.unit04.lesson03.teach.focus:
    title: focus
    gloss: concentrarse
    note: '*focus* significa dirigir la atención hacia algo.'
    example_gloss: En casa ella se concentra con más facilidad.
  en.b1.unit04.lesson03.teach.respect:
    title: respect
    gloss: respetar
    note: '*respect* significa valorar la opinión de otra persona, aunque no estés de acuerdo.'
    example_gloss: Ellos respetan la opinión del otro.
  en.b1.unit04.lesson03.teach.reading_passage:
    title: 'Lectura: dos opiniones'
    gloss: Mia piensa que trabajar desde casa es mejor porque se concentra con más facilidad. Leila no está de acuerdo. Ella cree que ir a la oficina es mejor porque le gusta ver a sus compañeros todos los días. No coinciden, pero se respetan mutuamente la opinión.
    note: Un texto breve con dos opiniones opuestas.
  en.b1.unit04.lesson04.teach.q_working_from_home:
    title: Daniel abre el debate
    gloss: 'Daniel dice: ¿Crees que trabajar desde casa es mejor que en la oficina?'
    note: Una pregunta abierta para iniciar un desacuerdo.
  en.b1.unit04.lesson04.teach.a_disagree_miss_coworkers:
    title: Leila lo ve de otra manera
    gloss: 'Leila dice: No creo que sea mejor. Pienso que te pierdes conversaciones importantes con tus compañeros.'
    note: Leila da su opinión y una razón.
  en.b1.unit04.lesson04.teach.q_fair_point_saves_time:
    title: Daniel reconoce el argumento de Leila, pero mantiene su opinión
    gloss: 'Daniel dice: Tienes un buen punto, pero sí estoy de acuerdo en que ahorra mucho tiempo.'
    note: '*that''s a fair point* reconoce lo que dice la otra persona antes de dar la propia opinión.'
  en.b1.unit04.lesson04.teach.a_agree_saves_time_prefer_office:
    title: Leila admite algo, pero mantiene su preferencia
    gloss: 'Leila dice: Estoy de acuerdo en que ahorra tiempo, pero aun así prefiero la oficina.'
    note: Leila concede un punto sin cambiar su opinión general.
  en.b1.unit04.lesson04.teach.q_everyone_different_opinion:
    title: Daniel termina la conversación
    gloss: 'Daniel dice: Lo entiendo. Cada quien tiene su opinión.'
    note: Una forma natural y amable de cerrar un desacuerdo.
