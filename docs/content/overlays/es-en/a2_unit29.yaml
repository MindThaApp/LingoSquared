teaching:
  en.a2.unit29.lesson01.teach.leaking:
    title: leaking
    gloss: que gotea / con fuga
    note: '*leaking* significa que sale agua por donde no debería. En español se dice «gotea» o «tiene una fuga».'
    example_gloss: El fregadero de la cocina tiene una fuga.
  en.a2.unit29.lesson01.teach.sink:
    title: sink
    gloss: el fregadero
    note: '*sink* es la pila en la que se lavan los platos.'
    example_gloss: Del fregadero gotea agua.
  en.a2.unit29.lesson01.teach.building_manager:
    title: building manager
    gloss: el administrador del edificio
    note: '*building manager* es la persona que se encarga del edificio.'
    example_gloss: Tengo que llamar al administrador del edificio por la fuga.
  en.a2.unit29.lesson01.teach.plumber:
    title: plumber
    gloss: el plomero
    note: '*plumber* es la persona que repara problemas de tuberías de agua.'
    example_gloss: El administrador envió a un plomero para que lo repare.
  en.a2.unit29.lesson01.teach.repair:
    title: repair
    gloss: la reparación
    note: '*repair* es dejar en buen estado algo que está roto.'
    example_gloss: La reparación será mañana por la tarde.
  en.a2.unit29.lesson01.teach.reused_home_words:
    title: Wörter rund ums Wohnen
    gloss: cocina, departamento, baño
    note: Ya conoces estas palabras de la unidad 24; aquí las repasamos.
    example_gloss:
    - La fuga está en la cocina.
    - Mi departamento tiene dos habitaciones.
    - El baño está justo al lado de la cocina.
  en.a2.unit29.lesson02.teach.report_problem:
    title: Ein Problem melden
    gloss: Me gustaría reportar un problema con el fregadero de mi cocina.
    note: Con *I'd like to report...* reportas un problema con cortesía.
  en.a2.unit29.lesson02.teach.leaking_since_morning:
    title: Erklären, wie lange das Problem besteht
    gloss: Gotea desde esta mañana.
    note: 'Para algo que dura desde hace un rato, el inglés usa *It''s been leaking since...*, como *I''ve had ... for* en la unidad 28. En español basta el presente: «Gotea desde esta mañana».'
  en.a2.unit29.lesson02.teach.ask_repair_timing:
    title: Fragen, wann repariert wird
    gloss: ¿Cuándo puede venir alguien a repararlo?
    note: Con *When can someone come to fix it?* preguntas con cortesía cuándo puede hacerse la reparación.
  en.a2.unit29.lesson03.teach.between_2_4:
    title: between 2pm and 4pm
    gloss: entre las 2 y las 4 de la tarde
    note: '*between 2pm and 4pm* significa «entre las 2 y las 4 de la tarde». En inglés la hora se escribe con *pm* (después del mediodía) o *am* (antes del mediodía) en lugar del reloj de 24 horas.'
    example_gloss: El plomero llegará entre las 2 y las 4 de la tarde.
  en.a2.unit29.lesson03.teach.confirmation_text:
    title: Text der Reparaturmitteilung
    gloss: Hemos recibido su reporte sobre un fregadero de cocina con fuga. Mañana, entre las 2 y las 4 de la tarde, irá un plomero. El número de reparación es 6180.
    note: 'Es una confirmación formal: el reporte se recibió, y se indican una hora y un número.'
  en.a2.unit29.lesson04.teach.q_report_problem:
    title: Dem Hausmeister das Problem melden
    gloss: 'Daniel dice: Me gustaría reportar un problema con el fregadero de mi cocina.'
    note: Es la misma frase de la lección 2.
  en.a2.unit29.lesson04.teach.q_whats_wrong_sink:
    title: Nach dem Problem mit dem Spülbecken fragen
    gloss: 'El administrador pregunta: ¿Qué le pasa al fregadero?'
    note: Es la misma forma de pregunta que usó el médico en la unidad 28 (*What's wrong?*), ahora para el fregadero en lugar de la salud.
  en.a2.unit29.lesson04.teach.a_leaking_since_morning_and_ask_timing:
    title: Daniels Antwort zur Dauer und die Frage nach dem Reparaturtermin
    gloss: 'Daniel dice: Gotea desde esta mañana. ¿Cuándo puede venir alguien a repararlo?'
    note: Son las dos frases de la lección 2, ahora una tras otra.
  en.a2.unit29.lesson04.teach.a_send_plumber:
    title: Die Antwort des Hausmeisters zum Klempner
    gloss: 'El administrador dice: Entiendo. Mañana, entre las 2 y las 4 de la tarde, le enviaré a un plomero.'
    note: El administrador indica la hora de la reparación después de oír el problema.
  en.a2.unit29.lesson04.teach.q_need_to_be_home:
    title: Fragen, ob man zu Hause sein muss
    gloss: 'Daniel pregunta: ¿Tengo que estar en casa?'
    note: Daniel hace esta pregunta después de saber la hora de la reparación.
  en.a2.unit29.lesson04.teach.a_confirm_window_number:
    title: Die letzte Bestätigung des Hausmeisters
    gloss: 'El administrador dice: Sí, por favor esté en casa entre las 2 y las 4 de la tarde. Este es su número de reparación: 6180.'
    note: El administrador indica la hora exacta y el número de reparación.
  en.a2.unit29.lesson04.teach.a_thank_you:
    title: Abschließendes Dankeschön
    gloss: 'Daniel dice: Muchas gracias.'
    note: '*Thank you very much* es una forma cortés y formal de dar las gracias, igual que al final de la conversación de la unidad 25.'
