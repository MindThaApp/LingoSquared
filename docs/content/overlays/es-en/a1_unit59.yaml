  en.a1.unit59.lesson02.teach.where_is_the_atm:
    title: Where is the ATM?
    gloss: ¿Dónde está el cajero automático?
    note: '*Where is...?* es la forma normal de preguntar por un lugar.'
  en.a1.unit59.lesson02.teach.check_my_balance:
    title: I want to check my balance.
    gloss: Quiero consultar mi saldo.
    note: '*check my balance* es una expresión fija del banco para consultar tu saldo.'
  en.a1.unit59.lesson02.teach.can_i_use_this_card:
    title: Can I use this card?
    gloss: ¿Puedo usar esta tarjeta?
    note: '*Can I use...?* pregunta si algo es posible o está permitido.'
  en.a1.unit59.lesson02.teach.enter_your_pin:
    title: Please enter your PIN.
    gloss: Por favor, introduce tu PIN.
    note: '*enter* significa aquí introducir. *PIN* es el código secreto de la tarjeta.'
  en.a1.unit59.lesson02.teach.atm_outside:
    title: The ATM is outside.
    gloss: El cajero automático está afuera.
    note: '*outside* va al final: *is outside*.'
  en.a1.unit59.lesson03.teach.dialogue_line1:
    title: Mia pregunta por el cajero automático
    gloss: 'Mia dice: ¡Hola! ¿Dónde está el cajero automático?'
    note: '*Where is...?* pregunta por un lugar.'
  en.a1.unit59.lesson03.teach.dialogue_line2:
    title: Dónde está el cajero automático
    gloss: 'El empleado dice: El cajero automático está afuera.'
    note: '*outside* significa afuera.'
  en.a1.unit59.lesson03.teach.dialogue_line3:
    title: Leila pregunta por su tarjeta
    gloss: 'Leila dice: ¿Puedo usar esta tarjeta?'
    note: '*this card* se refiere a la tarjeta que ella lleva consigo.'
  en.a1.unit59.lesson03.teach.dialogue_line4:
    title: La tarjeta funciona
    gloss: 'El empleado dice: Sí, puedes usar esa tarjeta.'
    note: '*Yes* significa sí; *that card* se refiere a la tarjeta de Leila.'
  en.a1.unit59.lesson03.teach.dialogue_line5:
    title: Mia quiere consultar su saldo
    gloss: 'Mia dice: Quiero consultar mi saldo.'
    note: '*want to check* usa *to* delante del segundo verbo.'
  en.a1.unit59.lesson03.teach.dialogue_line6:
    title: El PIN
    gloss: 'El empleado dice: Por favor, introduce tu PIN.'
    note: '*Please* hace cortés la instrucción.'
  en.a1.unit59.lesson03.teach.dialogue_line7:
    title: Leila también necesita dinero en efectivo
    gloss: 'Leila dice: Yo también necesito dinero en efectivo.'
    note: '*too* significa también y aquí va al final.'
  en.a1.unit59.lesson03.teach.dialogue_line8:
    title: Sacar veinte dólares
    gloss: 'El empleado dice: Puedes sacar veinte dólares.'
    note: '*take out* significa aquí sacar dinero.'
  en.a1.unit59.lesson03.teach.dialogue_line9:
    title: Mia da las gracias al empleado
    gloss: 'Mia dice: ¡Gracias! Esto es muy útil.'
    note: '*helpful* significa útil o servicial.'
  en.a1.unit59.lesson04.teach.bank_notice:
    title: Aviso del banco
    gloss: 'Aviso del banco: Abierto de 9:00 a 16:00. Cajero automático afuera. Límite de efectivo hoy: $100. Se aceptan tarjetas.'
    note: El aviso indica el horario, dónde está el cajero automático y el límite.
  en.a1.unit59.lesson04.teach.reading_passage:
    title: 'Texto: Una visita rápida al banco'
    gloss: 'Una visita rápida al banco: Una mañana, Mia y Leila fueron juntas al banco. Mia quería consultar su saldo y Leila necesitaba dinero en efectivo. El empleado dijo que el cajero automático estaba afuera. Leila usó su tarjeta y sacó veinte dólares. Mia introdujo su PIN y consultó su saldo. Antes de irse, leyeron el aviso. El banco estaba abierto de 9:00 a 16:00 y el límite de efectivo era de $100. Mia dijo que la visita fue fácil.'
    note: '*took out* es el pasado de *take out* con el sentido de sacar dinero.'
