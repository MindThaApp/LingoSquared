    gloss: No hay problema.
    note: '*No problem* es una respuesta corta e informal a una disculpa o a un agradecimiento.'
  en.a1.unit61.lesson02.teach.made_mistake:
    title: I made a mistake.
    gloss: Cometí un error.
    note: En inglés se dice *make a mistake* (hacer un error), no *do a mistake*. En español decimos «cometer un error», así que no traduzcas literalmente.
  en.a1.unit61.lesson03.teach.dialogue_line1:
    title: "Daniel pide perdón"
    gloss: 'Daniel dice: Hola, Mia. Siento llegar tarde.'
    note: '*I''m sorry I''m late* une la disculpa y el motivo.'
  en.a1.unit61.lesson03.teach.dialogue_line2:
    title: Mia lo acepta
    gloss: 'Mia dice: Está bien.'
    note: '*That''s okay* es amable y sencillo.'
  en.a1.unit61.lesson03.teach.dialogue_line3:
    title: El autobús llega tarde
    gloss: 'Daniel dice: El autobús llega tarde.'
    note: Esta frase da el motivo.
  en.a1.unit61.lesson03.teach.dialogue_line4:
    title: Mia dice que se puede esperar
    gloss: 'Mia dice: No hay problema. Podemos esperar.'
    note: '*We can wait* significa que esperar es posible.'
  en.a1.unit61.lesson03.teach.dialogue_line5:
    title: Daniel se equivocó con la hora
    gloss: 'Daniel dice: Me equivoqué con la hora.'
    note: '*with the time* significa con la hora o respecto a la hora.'
  en.a1.unit61.lesson03.teach.dialogue_line6:
    title: La clase empieza a las tres
    gloss: 'Mia dice: No pasa nada. La clase empieza a las tres.'
    note: '*at three* usa *at* con una hora del reloj.'
  en.a1.unit61.lesson03.teach.dialogue_line7:
    title: Daniel da las gracias a Mia
    gloss: 'Daniel dice: Gracias por esperar.'
    note: '*Thank you for waiting* usa *for* más la forma en -ing.'
  en.a1.unit61.lesson04.teach.class_note:
    title: Aviso de la clase
    gloss: 'Aviso de la clase: La clase empieza a las 3:00. Por favor, llega a tiempo. Si llegas tarde, envía un mensaje.'
    note: El aviso dice qué hacer si llegas tarde.
  en.a1.unit61.lesson04.teach.reading_passage:
    title: 'Texto: Una disculpa antes de la clase'
    gloss: 'Una disculpa antes de la clase: Daniel llegó tarde a clase porque el autobús llegó tarde. Se encontró con Mia afuera del aula. Daniel dijo que lo sentía. También dijo que se había equivocado con la hora. Mia dijo que no pasaba nada. La clase era a las 3:00. Daniel envió un mensaje corto al profesor. El mensaje decía: «Siento llegar tarde. El autobús llega tarde».'
    note: '*because* da el motivo: porque el autobús llegó tarde.'
