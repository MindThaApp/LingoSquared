teaching:
  en.b1.unit19.lesson01.teach.main_point:
    title: main point
    gloss: punto principal, idea central
    note: '*main point* es la idea más importante de un texto o de una conversación.'
    example_gloss: El punto principal de la reunión fue el presupuesto.
  en.b1.unit19.lesson01.teach.detail:
    title: detail
    gloss: detalle
    note: '*detail* es un dato adicional pequeño que apoya el punto principal.'
    example_gloss: Mia añadió un pequeño detalle sobre el calendario.
  en.b1.unit19.lesson01.teach.in_summary:
    title: in summary
    gloss: en resumen
    note: '*in summary* introduce, al final de una explicación larga, un resumen más corto.'
    example_gloss: En resumen, el proyecto terminará el mes que viene.
  en.b1.unit19.lesson01.teach.in_short:
    title: in short
    gloss: en pocas palabras
    note: '*in short* es una forma rápida e informal de ir al grano en una conversación.'
    example_gloss: En pocas palabras, el equipo estuvo de acuerdo con el plan.
  en.b1.unit19.lesson01.teach.in_your_own_words:
    title: in your own words
    gloss: con tus propias palabras
    note: '*in your own words* pide una explicación que no copie el texto original.'
    example_gloss: Explica el plan con tus propias palabras.
  en.b1.unit19.lesson02.teach.in_summary_budget_client:
    title: In summary, ... (hacer un resumen)
    gloss: En resumen, en la reunión se trataron el presupuesto y el nuevo cliente.
    note: '*In summary, the meeting covered...* abre un resumen breve de lo que se trató.'
  en.b1.unit19.lesson02.teach.main_point_under_budget:
    title: The main point was that ... (decir el punto principal)
    gloss: El punto principal fue que este mes estamos por debajo del presupuesto.
    note: '*The main point was that...* indica la idea más importante, separada de los detalles menores.'
  en.b1.unit19.lesson02.teach.grammar_summary_structure:
    title: Cómo estructurar un resumen
    gloss: Empieza un resumen con una expresión como In summary o In short y luego menciona solo los puntos principales, en orden y con oraciones cortas. Usa The main point was that... para destacar la idea más importante, separada de los detalles menores. En español también se abre un resumen con fórmulas como «en resumen» o «en pocas palabras».
    note: 'Forma: empieza con In summary/In short y usa The main point was that... para el punto principal.'
  en.b1.unit19.lesson03.teach.condensed:
    title: condensed
    gloss: resumido, condensado
    note: '*condensed* describe un resumen que se ha acortado pero conserva los puntos principales.'
    example_gloss: Mia le dio a Daniel un resumen condensado de la reunión.
  en.b1.unit19.lesson03.teach.original_article:
    title: original article
    gloss: artículo original
    note: '*original article* es el texto completo original, antes de resumirlo.'
    example_gloss: El resumen de Leila coincidía bien con el artículo original.
  en.b1.unit19.lesson03.teach.reading_passage:
    title: 'Lectura: resumir un artículo breve'
    gloss: 'Leila leyó un artículo largo sobre comunicación en el trabajo para su curso de diseño. El artículo original tenía muchos ejemplos e información de contexto, pero Leila solo necesitaba los puntos principales. Con sus propias palabras, escribió un resumen condensado: la comunicación en el trabajo funciona mejor cuando los mensajes son claros y breves, y cuando las personas hacen preguntas en lugar de adivinar. Dejó fuera la mayoría de los ejemplos, porque eran detalles y no puntos principales. Su profesor dijo que el resumen conservaba las ideas importantes en el orden correcto.'
    note: Un texto breve para leer.
  en.b1.unit19.lesson04.teach.q_missed_meeting:
    title: Daniel pide una explicación
    gloss: 'Daniel dice: Me perdí la reunión. ¿Me puedes contar qué pasó?'
    note: Una pregunta abierta para pedir un resumen.
  en.b1.unit19.lesson04.teach.a_in_short_budget_client:
    title: Mia hace un breve resumen
    gloss: 'Mia dice: Claro. En pocas palabras, hablamos del presupuesto y del nuevo cliente.'
    note: '*in short* abre un resumen rápido e informal.'
  en.b1.unit19.lesson04.teach.q_main_point_budget:
    title: Daniel pregunta por el punto principal
    gloss: 'Daniel dice: ¿Cuál fue el punto principal sobre el presupuesto?'
    note: Una pregunta concreta sobre el punto principal.
  en.b1.unit19.lesson04.teach.a_under_budget_this_month:
    title: Mia dice el punto principal
    gloss: 'Mia dice: El punto principal fue que este mes estamos por debajo del presupuesto.'
    note: '*the main point was that...* destaca la idea más importante.'
  en.b1.unit19.lesson04.teach.q_other_details:
    title: Daniel pregunta por los detalles
    gloss: 'Daniel dice: Bien. ¿Hubo otros detalles?'
    note: Una pregunta sobre detalles menores.
  en.b1.unit19.lesson04.teach.a_client_meeting_moved:
    title: Mia menciona un pequeño detalle
    gloss: 'Mia dice: Solo un detalle pequeño: la reunión con el cliente se cambió para la próxima semana.'
    note: '*just one small detail* introduce un dato pequeño y complementario.'
  en.b1.unit19.lesson04.teach.q_thanks_for_summary:
    title: Daniel da las gracias a Mia
    gloss: 'Daniel dice: Gracias por el resumen. Me sirvió mucho.'
    note: Un cierre breve y agradecido de la conversación.
