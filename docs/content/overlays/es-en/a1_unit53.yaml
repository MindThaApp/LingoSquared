teaching:
  en.a1.unit53.lesson01.teach.rent:
    title: rent
    gloss: alquilar
    note: '*rent* significa alquilar. Según el contexto, el verbo inglés *rent* puede referirse tanto a tomar algo en alquiler como a dárselo a alguien en alquiler.'
    example_gloss: Quiero alquilar una bicicleta.
  en.a1.unit53.lesson01.teach.deposit:
    title: deposit
    gloss: depósito
    note: '*deposit* significa depósito: el dinero que pagas por adelantado y que recuperas si devuelves la bicicleta sin daños.'
    example_gloss: El depósito es de veinte dólares.
  en.a1.unit53.lesson01.teach.return:
    title: return
    gloss: devolver
    note: Aquí, *return* significa devolver algo, no regresar.
    example_gloss: Devuelva la bicicleta hoy, por favor.
  en.a1.unit53.lesson01.teach.hour:
    title: hour
    gloss: hora
    note: '*hour* significa hora.'
    example_gloss: Cuesta diez dólares por hora.
  en.a1.unit53.lesson01.teach.size:
    title: size
    gloss: talla
    note: '*size* significa talla.'
    example_gloss: ¿Qué talla necesita?
  en.a1.unit53.lesson01.teach.helmet:
    title: helmet
    gloss: casco
    note: '*helmet* significa casco.'
    example_gloss: ¿Tiene casco?
  en.a1.unit53.lesson02.teach.id_like_to_rent_a_bike:
    title: I'd like to rent a bike, please.
    gloss: Quisiera alquilar una bicicleta, por favor.
    note: '*I''d like to* (contracción de *I would like to*) es una forma cortés de pedir algo, más amable que la forma directa *I want*.'
  en.a1.unit53.lesson02.teach.how_much_does_it_cost_per_hour:
    title: How much does it cost per hour?
    gloss: ¿Cuánto cuesta por hora?
    note: '*does it cost* usa el auxiliar *does* porque el verbo principal es *cost*: es la misma estructura con *do* que aparece en otras preguntas en inglés.'
  en.a1.unit53.lesson02.teach.i_need_a_small_bike:
    title: I need a small bike.
    gloss: Necesito una bicicleta pequeña.
    note: En *need a small bike*, el verbo *need* va seguido directamente del sustantivo. En español, la idea se expresa de forma parecida con «necesitar».
  en.a1.unit53.lesson02.teach.can_i_have_a_helmet:
    title: Can I have a helmet, please?
    gloss: ¿Me puede dar un casco, por favor?
    note: '*Can I have ...?* es una fórmula cortés habitual para pedir algo en una tienda. No suele traducirse literalmente; equivale a «¿Me puede dar...?» o «Quisiera...».'
  en.a1.unit53.lesson02.teach.when_do_i_need_to_return_it:
    title: When do I need to return it?
    gloss: ¿Cuándo tengo que devolverla?
    note: '*do I need to* también lleva el auxiliar *do* para formar la pregunta.'
  en.a1.unit53.lesson02.teach.its_ten_dollars_an_hour:
    title: It's ten dollars an hour.
    gloss: Son diez dólares por hora.
    note: 'Aquí, *an hour* significa «por hora»: el artículo *an* adquiere el sentido de «por», al igual que *a* con otras unidades de tiempo.'
  en.a1.unit53.lesson03.teach.dialogue_line1:
    title: El empleado las saluda
    gloss: 'El empleado dice: ¡Hola! ¿En qué puedo ayudarlas hoy?'
    note: '*How can I help you today?* es una fórmula cortés habitual para iniciar una conversación en tiendas y otros servicios.'
  en.a1.unit53.lesson03.teach.dialogue_line2:
    title: La petición de Mia
    gloss: 'Mia dice: Quisiéramos alquilar dos bicicletas. Queremos pasear en bicicleta junto al río.'
    note: '*We''d like to rent* vuelve a usar el verbo *rent*; aquí significa que quieren alquilar las bicicletas de la tienda.'
  en.a1.unit53.lesson03.teach.dialogue_line3:
    title: El empleado pregunta la talla
    gloss: 'El empleado dice: Claro. ¿Qué talla necesitan?'
    note: '*What size do you need?* también usa el auxiliar *do* para formar la pregunta.'
  en.a1.unit53.lesson03.teach.dialogue_line4:
    title: La talla de Leila
    gloss: 'Leila dice: Necesito una pequeña.'
    note: Aquí, *one* sustituye a *bike* para evitar repetirlo. En español se suele omitir el sustantivo y decir simplemente «una pequeña», pero en inglés hace falta la palabra *one*.
  en.a1.unit53.lesson03.teach.dialogue_line5:
    title: La talla de Mia
    gloss: 'Mia dice: Y yo necesito una mediana.'
    note: Aquí también se usa *one* en lugar de *bike*, como en la frase anterior de Leila.
  en.a1.unit53.lesson03.teach.dialogue_line6:
    title: El precio y el depósito
    gloss: 'El empleado dice: Muy bien, aquí tienen sus bicicletas. Son diez dólares por hora y el depósito es de veinte dólares.'
    note: Esta frase contiene dos datos distintos, la tarifa por hora y el depósito; procura no confundirlos.
  en.a1.unit53.lesson03.teach.dialogue_line7:
    title: Mia pregunta cuándo deben devolverlas
    gloss: 'Mia dice: ¿Cuándo tenemos que devolverlas?'
    note: Aquí, *them* se refiere a las bicicletas, en plural.
  en.a1.unit53.lesson03.teach.dialogue_line8:
    title: La hora de devolución
    gloss: 'El empleado dice: Devuélvanlas antes de las cinco, por favor.'
    note: '*by five o''clock* significa como máximo a las cinco, no después de esa hora.'
  en.a1.unit53.lesson03.teach.dialogue_line9:
    title: Leila da las gracias al empleado
    gloss: 'Leila dice: ¡Genial, muchas gracias!'
    note: '*Great, thank you!* es una fórmula breve y habitual para cerrar una conversación con cortesía.'
  en.a1.unit53.lesson04.teach.reading_passage:
    title: Texto sobre un paseo en bicicleta junto al río
    gloss: Una tarde cálida, Mia invitó a Leila a pasear en bicicleta junto al río, cerca de su apartamento. Ninguna de las dos tenía bicicleta, así que fueron juntas a una tienda de alquiler. El empleado les preguntó qué talla necesitaban; Leila tomó una bicicleta pequeña y Mia, una mediana. El alquiler costaba diez dólares por hora y el depósito por las dos bicicletas era de veinte dólares. Tenían que devolverlas antes de las cinco. El paseo junto al río fue precioso y vieron a varias personas paseando a sus perros y disfrutando del tiempo soleado. Devolvieron las bicicletas justo a tiempo y recuperaron el depósito. Después le contaron a Daniel lo del paseo, y él dijo que quería acompañarlas la próxima vez.
    note: '*owned* es el pasado de *own* (tener en propiedad): *Neither of them owned a bike* significa que ninguna de las dos tenía bicicleta.'
