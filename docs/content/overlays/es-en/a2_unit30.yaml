teaching:
  en.a2.unit30.lesson01.teach.experience:
    title: experience
    gloss: experiencia
    note: '*experience* significa «experiencia», sobre todo laboral.'
    example_gloss: Tengo dos años de experiencia en marketing.
  en.a2.unit30.lesson01.teach.position:
    title: position
    gloss: puesto
    note: '*position* es el puesto o cargo dentro de una empresa.'
    example_gloss: Este puesto es para un coordinador o una coordinadora de marketing.
  en.a2.unit30.lesson01.teach.availability:
    title: availability
    gloss: disponibilidad
    note: '*availability* indica cuándo tienes tiempo, por ejemplo para empezar a trabajar.'
    example_gloss: La entrevistadora me preguntó por mi disponibilidad.
  en.a2.unit30.lesson01.teach.strength:
    title: strength
    gloss: fortaleza
    note: '*strength* es algo que haces especialmente bien.'
    example_gloss: Una de mis fortalezas es ser organizado.
  en.a2.unit30.lesson01.teach.requirement:
    title: requirement
    gloss: requisito
    note: '*requirement* es algo que se exige para el puesto.'
    example_gloss: Dos años de experiencia laboral son un requisito para este puesto.
  en.a2.unit30.lesson02.teach.two_years_experience:
    title: Die eigene Erfahrung beschreiben
    gloss: Tengo dos años de experiencia en marketing de redes sociales.
    note: Con esta frase describes tu experiencia laboral en una entrevista.
  en.a2.unit30.lesson02.teach.one_strength_organized:
    title: Eine Stärke nennen
    gloss: Una de mis fortalezas es ser organizado.
    note: '*One of my strengths is...* es la forma habitual de mencionar una fortaleza en una entrevista.'
  en.a2.unit30.lesson02.teach.available_next_monday:
    title: Die eigene Verfügbarkeit nennen
    gloss: Puedo empezar el próximo lunes.
    note: Con *I'm available to start...* dices a partir de cuándo puedes empezar.
  en.a2.unit30.lesson03.teach.resume:
    title: resume
    gloss: currículum
    note: '*resume* significa «currículum». Esta palabra se usa sobre todo en el inglés americano.'
    example_gloss: Traiga su currículum a la entrevista, por favor.
  en.a2.unit30.lesson03.teach.deadline:
    title: deadline
    gloss: fecha límite / plazo
    note: '*deadline* es la fecha límite hasta la cual algo debe estar terminado. En español también se oye «deadline» en el trabajo, pero lo habitual es «fecha límite» o «plazo».'
    example_gloss: En el trabajo siempre cumplo con mis plazos.
  en.a2.unit30.lesson03.teach.posting_text:
    title: Text der Stellenanzeige
    gloss: 'Bright Path Marketing busca un coordinador o una coordinadora de marketing. Requisitos: dos años de experiencia, buena redacción y disponibilidad inmediata. Traiga su currículum a la entrevista, por favor.'
    note: Es una oferta de empleo formal con requisitos y una indicación.
  en.a2.unit30.lesson03.teach.i_meet_deadlines:
    title: Über die eigene Arbeitsweise sprechen
    gloss: Cumplo con mis plazos y trabajo bien en equipo.
    note: '*I meet deadlines* y *I work well in a team* son frases útiles para describir tu forma de trabajar.'
  en.a2.unit30.lesson04.teach.q_tell_me_experience:
    title: Die Interviewerin fragt nach der Erfahrung
    gloss: 'La entrevistadora dice: Gracias por venir hoy. ¿Puede contarme sobre su experiencia?'
    note: '*Thank you for coming in today* es una forma cortés de abrir una entrevista de trabajo.'
  en.a2.unit30.lesson04.teach.a_two_years_managed_team:
    title: Mias Antwort zur Erfahrung
    gloss: 'Mia dice: Tengo dos años de experiencia en marketing de redes sociales. Además, dirigí un equipo pequeño.'
    note: 'Es la misma frase sobre la experiencia de la lección 2, con un detalle más: dirigió un equipo.'
  en.a2.unit30.lesson04.teach.q_what_strength:
    title: Nach einer Stärke fragen
    gloss: 'La entrevistadora dice: Qué bien. ¿Cuál es una de sus fortalezas?'
    note: La entrevistadora reacciona de forma positiva y luego hace la siguiente pregunta.
  en.a2.unit30.lesson04.teach.a_organized_deadlines:
    title: Mias Antwort zu ihrer Stärke
    gloss: 'Mia dice: Soy muy organizada y cumplo con mis plazos.'
    note: Mia menciona su fortaleza (ser organizada) y un ejemplo concreto (cumplir con los plazos).
  en.a2.unit30.lesson04.teach.q_have_questions:
    title: Fragen, ob es noch Fragen gibt
    gloss: 'La entrevistadora pregunta: ¿Tiene alguna pregunta sobre el puesto?'
    note: Es una pregunta fija al final de una entrevista de trabajo.
  en.a2.unit30.lesson04.teach.a_wondering_typical_week:
    title: Mia stellt eine eigene Frage
    gloss: 'Mia dice: Sí, me gustaría saber cómo es una semana típica en este puesto.'
    note: '*I was wondering...* es una forma cortés de hacer tú mismo una pregunta.'
