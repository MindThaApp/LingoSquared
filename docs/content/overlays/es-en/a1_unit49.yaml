    note: '*go in* significa aquí ir en el lugar que le corresponde.'
  en.a1.unit49.lesson02.teach.this_goes_in_the_recycling_bin:
    title: This goes in the recycling bin.
    gloss: Esto va en el contenedor de reciclaje.
    note: '*This goes in the recycling bin.* significa esto va en el contenedor de reciclaje.'
  en.a1.unit49.lesson02.teach.the_green_bin_is_for_glass:
    title: The green bin is for glass.
    gloss: El contenedor verde es para el vidrio.
    note: '*is for ...* significa es para ...; sirve para decir para qué sirve algo.'
  en.a1.unit49.lesson02.teach.can_you_take_out_the_trash:
    title: Can you take out the trash?
    gloss: ¿Puedes sacar la basura?
    note: '*take out* es un verbo separable: take out the trash y take the trash out son correctos, mientras que en español "sacar la basura" siempre va en ese orden.'
  en.a1.unit49.lesson02.teach.collection_day_is_on_tuesday:
    title: Collection day is on Tuesday.
    gloss: El día de recogida es el martes.
    note: '*Collection day is on Tuesday.* significa el día de recogida es el martes.'
  en.a1.unit49.lesson02.teach.what_about_paper_and_food_waste:
    title: What about paper and food waste?
    gloss: ¿Y el papel y los restos de comida?
    note: '*What about ...?* significa ¿y ...?; sirve para preguntar por otra cosa.'
  en.a1.unit49.lesson03.teach.dialogue_line1:
    title: La advertencia de Mia
    gloss: 'Mia dice: ¡Espera, ese frasco de vidrio no va en la basura!'
    note: '*doesn''t go in the trash* significa no va en la basura.'
  en.a1.unit49.lesson03.teach.dialogue_line2:
    title: La disculpa de Daniel
    gloss: 'Daniel dice: ¡Ay, no, perdón! ¿En qué contenedor va?'
    note: '*Which bin does it go in?* repite la forma de pregunta que acabas de aprender.'
  en.a1.unit49.lesson03.teach.dialogue_line3:
    title: Mia lo explica
    gloss: 'Mia dice: Va en el contenedor verde. Aquí reciclamos el vidrio.'
    note: '*We recycle glass here.* significa aquí reciclamos el vidrio.'
  en.a1.unit49.lesson03.teach.dialogue_line4:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: ¿Y el papel y los restos de comida?'
    note: Repetición de la pregunta *What about ...?* que ya aprendiste.
  en.a1.unit49.lesson03.teach.dialogue_line5:
    title: La explicación de Mia
    gloss: 'Mia dice: El papel va en el contenedor azul, y los restos de comida van en el contenedor marrón.'
    note: '*goes in ..., and ... goes in ...* repite la misma estructura para dos tipos distintos de residuos.'
  en.a1.unit49.lesson03.teach.dialogue_line6:
    title: La pregunta de Daniel sobre el día de recogida
    gloss: 'Daniel dice: Entendido. ¿Cuándo es el día de recogida?'
    note: '*Got it.* es una forma informal de decir entendido.'
  en.a1.unit49.lesson03.teach.dialogue_line7:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Los contenedores de reciclaje se sacan los martes, y la basura se saca los viernes.'
    note: 'Fíjate: Mia menciona aquí dos días distintos para dos tipos de residuos: el martes para el reciclaje y el viernes para la basura normal.'
  en.a1.unit49.lesson03.teach.dialogue_line8:
    title: La promesa de Daniel
    gloss: 'Daniel dice: ¡Gracias! La próxima vez clasificaré todo correctamente.'
    note: '*I''ll sort everything correctly next time.* significa la próxima vez clasificaré todo correctamente.'
  en.a1.unit49.lesson04.teach.reading_passage:
    title: Texto sobre cómo se separa la basura
    gloss: 'Cómo separar tu basura: muchos edificios de apartamentos tienen contenedores distintos para distintos tipos de residuos. El vidrio suele ir en el contenedor verde, y el papel va en el contenedor azul. Los restos de comida van en el contenedor marrón, y todo lo demás va en el contenedor negro de la basura normal. Conviene conocer tu día de recogida, porque los contenedores se vacían solo una vez por semana. Daniel ha estado practicando recetas del libro de cocina que pidió prestado en la biblioteca, y a menudo cocina con Mia en su apartamento. Anoche preparó una receta del libro y, después, casi tira un frasco de vidrio a la basura normal. Mia lo detuvo y le mostró cómo se separan los residuos en su edificio. Le explicó que los contenedores de reciclaje se sacan los martes y la basura normal se saca los viernes. Daniel se lo agradeció y dijo que a partir de ahora clasificará todo correctamente.'
    note: '*almost put a glass jar in the regular trash* significa casi tira un frasco de vidrio a la basura normal.'
