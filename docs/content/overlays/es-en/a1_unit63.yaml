teaching:
  en.a1.unit63.lesson01.teach.help:
    title: help
    gloss: ayudar / ayuda
    note: '*help* puede ser el verbo «ayudar» o el sustantivo «ayuda». En español decimos «ayudar a alguien»; en inglés no hay preposición delante de la persona: *help me* se dice sin *to* ni *a*.'
    example_gloss: ¿Puedes ayudarme?
  en.a1.unit63.lesson01.teach.carry:
    title: carry
    gloss: llevar
    note: '*carry* significa sujetar algo y llevarlo de un lugar a otro.'
    example_gloss: Puedo llevarlo.
  en.a1.unit63.lesson01.teach.heavy:
    title: heavy
    gloss: pesado
    note: '*heavy* significa pesado (de peso).'
    example_gloss: Esto pesa.
  en.a1.unit63.lesson01.teach.bag:
    title: bag
    gloss: bolsa
    note: '*bag* significa bolsa, también bolso o saco.'
    example_gloss: Esta bolsa pesa mucho.
  en.a1.unit63.lesson01.teach.door:
    title: door
    gloss: puerta
    note: '*door* significa puerta.'
    example_gloss: Abre la puerta.
  en.a1.unit63.lesson01.teach.shelf:
    title: shelf
    gloss: estante, balda
    note: '*shelf* significa estante o balda, por ejemplo en la pared o en un armario. El plural es *shelves*.'
    example_gloss: Ponlo en el estante.
  en.a1.unit63.lesson02.teach.can_you_help:
    title: Can you help me?
    gloss: ¿Puedes ayudarme?
    note: '*Can you...?* es una forma directa y habitual de pedir ayuda.'
  en.a1.unit63.lesson02.teach.bag_heavy:
    title: This bag is heavy.
    gloss: Esta bolsa pesa mucho.
    note: Usa *this bag* para la bolsa que tienes cerca.
  en.a1.unit63.lesson02.teach.open_door:
    title: Could you open the door?
    gloss: ¿Podrías abrir la puerta?
    note: '*Could you...?* suena más cortés que *Can you...?*. Equivale a nuestro condicional «¿Podrías...?».'
  en.a1.unit63.lesson02.teach.i_can_help:
    title: I can help.
    gloss: Puedo ayudar.
    note: Esta frase ofrece ayuda.
  en.a1.unit63.lesson02.teach.thank_you_help:
    title: Thank you for your help.
    gloss: Gracias por tu ayuda.
    note: '*Thank you for...* usa *for* para el motivo del agradecimiento, como «gracias por».'
  en.a1.unit63.lesson02.teach.put_on_shelf:
    title: Put it on the shelf.
    gloss: Ponlo en el estante.
    note: '*put it on...* significa poner o colocar algo sobre algo. El inglés usa *put* tanto para «poner» como para «colocar».'
  en.a1.unit63.lesson03.teach.dialogue_line1:
    title: Leila pide ayuda
    gloss: 'Leila dice: Hola, Daniel. ¿Puedes ayudarme?'
    note: '*Can you help me?* es la frase básica para pedir ayuda.'
  en.a1.unit63.lesson03.teach.dialogue_line2:
    title: Daniel pregunta qué necesita
    gloss: 'Daniel dice: Claro. ¿Qué necesitas?'
    note: '*Of course* significa claro, por supuesto.'
  en.a1.unit63.lesson03.teach.dialogue_line3:
    title: La bolsa pesa mucho
    gloss: 'Leila dice: Esta bolsa pesa mucho.'
    note: '*heavy* explica por qué hace falta ayuda.'
  en.a1.unit63.lesson03.teach.dialogue_line4:
    title: Daniel puede llevar la bolsa
    gloss: 'Daniel dice: Puedo llevarla.'
    note: '*carry it* se refiere a la bolsa. El inglés usa *it* para las cosas; no distingue masculino y femenino como el español («la»).'
  en.a1.unit63.lesson03.teach.dialogue_line5:
    title: Leila pide que abra la puerta
    gloss: 'Leila dice: ¿Podrías abrir también la puerta?'
    note: '*Could you...?* hace que la petición sea cortés.'
  en.a1.unit63.lesson03.teach.dialogue_line6:
    title: Daniel pregunta por el estante
    gloss: 'Daniel dice: Sí. ¿Puedo poner la bolsa en el estante?'
    note: Con *Can I ...?* Daniel se ofrece a poner la bolsa en el estante.
  en.a1.unit63.lesson03.teach.dialogue_line7:
    title: Leila da las gracias a Daniel
    gloss: 'Leila dice: Sí, por favor. Gracias por tu ayuda.'
    note: '*Thank you for your help* es una fórmula fija de agradecimiento.'
  en.a1.unit63.lesson03.teach.dialogue_line8:
    title: Daniel responde
    gloss: 'Daniel dice: No hay de qué.'
    note: '*No problem* es una respuesta breve y amable.'
  en.a1.unit63.lesson04.teach.help_note:
    title: Nota de ayuda
    gloss: 'Nota de ayuda: La bolsa azul pesa mucho. Por favor, ponla en el estante junto a la puerta.'
    note: La nota indica de qué bolsa se trata y dónde debe ir.
  en.a1.unit63.lesson04.teach.reading_passage:
    title: 'Texto: Un vecino servicial'
    gloss: 'Un vecino servicial: Leila tenía una bolsa azul muy pesada. Vio a Daniel cerca de la puerta y le pidió ayuda. Daniel llevó la bolsa adentro. Leila le pidió que también abriera la puerta. Luego Daniel puso la bolsa en el estante junto a la puerta. Leila le dio las gracias a Daniel por su ayuda. Daniel dijo: No hay de qué. Más tarde, Leila escribió una nota breve: La bolsa azul está en el estante.'
    note: '*carried* es el pasado de *carry*.'
