teaching:
  en.a2.unit38.lesson01.teach.reschedule:
    title: reschedule
    gloss: reprogramar
    note: '*reschedule* significa pasar una cita a otra fecha u hora.'
    example_gloss: Tengo que reprogramar la reparación porque ese día estaré en el trabajo.
  en.a2.unit38.lesson01.teach.neighbor:
    title: neighbor
    gloss: vecino, vecina
    note: '*neighbor* es la persona que vive al lado de tu casa. En inglés la palabra es la misma para un hombre y para una mujer.'
    example_gloss: Mi vecina puede abrirle la puerta al plomero.
  en.a2.unit38.lesson01.teach.key:
    title: key
    gloss: llave
    note: '*key* es el pequeño objeto de metal con el que abres la puerta.'
    example_gloss: Voy a dejar la llave con mi vecina.
  en.a2.unit38.lesson01.teach.leak:
    title: leak
    gloss: fuga
    note: 'Aquí *leak* es un sustantivo: el punto por donde sale el agua. El verbo *to leak* significa gotear o tener una fuga.'
    example_gloss: La fuga debajo de mi fregadero está empeorando.
  en.a2.unit38.lesson01.teach.fixed:
    title: fixed
    gloss: arreglado
    note: '*fixed* es el participio de *to fix* (arreglar) y significa que algo ya no está roto.'
    example_gloss: El fregadero ya está arreglado y el agua dejó de salir.
  en.a2.unit38.lesson01.teach.afternoon:
    title: afternoon
    gloss: tarde
    note: '*afternoon* es la parte del día después del mediodía; la mañana se dice *morning*.'
    example_gloss: El plomero vino por la tarde, no por la mañana.
  en.a2.unit38.lesson01.teach.grammar_cant_wont:
    title: can't y won't cuando algo no funciona
    gloss: No puedo estar en casa entre las 2 y las 4 de la tarde. No estaré en casa por la tarde.
    note: '*can''t* dice que algo no es posible. *won''t* dice que en el futuro simplemente no será así.'
  en.a2.unit38.lesson02.teach.need_to_reschedule:
    title: Decir que quieres aplazar la cita
    gloss: Necesito reprogramar la reparación.
    note: '*I need to ...* es objetivo y neutral: expresa que es necesario, pero no suena descortés.'
  en.a2.unit38.lesson02.teach.possible_in_the_morning:
    title: Pedir otra hora
    gloss: ¿Sería posible que vinieran por la mañana, en cambio?
    note: '*Would it be possible to ...?* es la forma más cuidadosa de pedir algo. *instead* significa «en cambio» o «en su lugar».'
  en.a2.unit38.lesson02.teach.leave_key_with_neighbor:
    title: Decir dónde está la llave
    gloss: Voy a dejar la llave con mi vecina.
    note: '*leave something with someone* significa dejarle algo a alguien.'
  en.a2.unit38.lesson02.teach.is_the_leak_fixed:
    title: Preguntar si el problema está resuelto
    gloss: ¿Ya está arreglada la fuga?
    note: '*Is ... fixed?* pregunta por el resultado, no por el trabajo en sí.'
  en.a2.unit38.lesson02.teach.grammar_because_reason:
    title: Dar un motivo con because
    gloss: No puedo estar en casa entre las 2 y las 4 de la tarde porque estoy en el trabajo.
    note: '*because* une el problema con el motivo. Igual que con «porque» en español, el orden de las palabras no cambia después: el verbo queda en su lugar normal.'
  en.a2.unit38.lesson03.teach.message:
    title: message
    gloss: mensaje
    note: '*message* es cualquier mensaje escrito corto: un SMS, un mensaje de chat o un correo breve.'
    example_gloss: Recibí un mensaje sobre la nueva hora de la reparación.
  en.a2.unit38.lesson03.teach.rescheduling_text:
    title: El mensaje sobre la nueva cita
    gloss: La reparación 6180 ha sido reprogramada. El plomero vendrá mañana entre las 9 y las 11 de la mañana. Su vecina abrirá la puerta. Por favor, confirme esta nueva hora por mensaje hoy.
    note: 'Un mensaje de la administración del edificio es breve y objetivo: qué cambió, cuándo y qué más debe hacer usted.'
  en.a2.unit38.lesson03.teach.confirm_by_message:
    title: Que te pidan una confirmación
    gloss: Por favor, confirme esta nueva hora por mensaje hoy.
    note: '*confirm* significa confirmar; *by message* significa por mensaje.'
  en.a2.unit38.lesson04.teach.q_need_to_reschedule:
    title: Daniel llama a la administración de la finca
    gloss: 'Daniel dice: Buenos días, necesito reprogramar la reparación.'
    note: Por teléfono se empieza con *Hello* y enseguida se dice el motivo de la llamada.
  en.a2.unit38.lesson04.teach.a_which_repair:
    title: La administración de la finca pregunta qué reparación
    gloss: 'La administración dice: No hay problema. ¿De qué reparación se trata?'
    note: '*Which repair is it?* pregunta por una sola cosa dentro de un grupo conocido.'
  en.a2.unit38.lesson04.teach.q_repair_6180:
    title: Daniel dice el número de reparación
    gloss: 'Daniel dice: La reparación 6180, la fuga debajo del fregadero de mi cocina.'
    note: 'Es el mismo número de reparación de la unidad 29: el mismo fregadero con fuga.'
  en.a2.unit38.lesson04.teach.a_why_cant_you_be_home:
    title: La administración de la finca pregunta el motivo
    gloss: 'La administración dice: Entiendo. ¿Por qué no puede estar en casa?'
    note: '*Why can''t you ...?* pregunta el motivo por el que algo no funciona.'
  en.a2.unit38.lesson04.teach.q_at_work_ask_morning:
    title: Daniel da el motivo y pide la mañana
    gloss: 'Daniel dice: No puedo estar en casa entre las 2 y las 4 de la tarde porque estoy en el trabajo. ¿Sería posible que vinieran por la mañana, en cambio?'
    note: 'Primero el motivo y después la petición: suena más cortés que exigir algo de entrada.'
  en.a2.unit38.lesson04.teach.a_plumber_can_come_morning:
    title: La administración de la finca ofrece un nuevo plazo
    gloss: 'La administración dice: Sí, el plomero puede venir entre las 9 y las 11 de la mañana.'
    note: '*between 9am and 11am* es el nuevo horario.'
  en.a2.unit38.lesson04.teach.q_leave_key:
    title: Daniel resuelve lo de la llave
    gloss: 'Daniel dice: Muchas gracias. Voy a dejar la llave con mi vecina.'
    note: Es la misma frase de la lección 2.
  en.a2.unit38.lesson04.teach.a_please_confirm:
    title: La administración de la finca pide confirmación
    gloss: 'La administración dice: Bien. Por favor, confirme esta nueva hora por mensaje hoy.'
    note: Es la misma petición del mensaje de la lección 3.
  en.a2.unit38.lesson04.teach.q_will_confirm_this_afternoon:
    title: Daniel dice cuándo confirmará
    gloss: 'Daniel dice: Lo confirmaré esta tarde.'
    note: '*this afternoon* significa esta tarde, es decir, hoy después de las 12.'
