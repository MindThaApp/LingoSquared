teaching:
  en.a1.unit62.lesson01.teach.phone:
    title: phone
    gloss: teléfono, móvil
    note: '*phone* significa teléfono. En el día a día, *phone* suele referirse al móvil.'
    example_gloss: Mi móvil está aquí.
  en.a1.unit62.lesson01.teach.call:
    title: call
    gloss: llamar / llamada
    note: '*call* puede ser una llamada o significar «llamar»: *a call* (sustantivo), *to call* (verbo).'
    example_gloss: Puedo llamarte.
  en.a1.unit62.lesson01.teach.message:
    title: message
    gloss: mensaje
    note: '*message* significa mensaje.'
    example_gloss: Deja un mensaje.
  en.a1.unit62.lesson01.teach.voicemail:
    title: voicemail
    gloss: mensaje de voz, buzón de voz
    note: '*voicemail* es un mensaje hablado que se deja por teléfono (el buzón de voz).'
    example_gloss: El mensaje de voz es corto.
  en.a1.unit62.lesson01.teach.repeat:
    title: repeat
    gloss: repetir
    note: '*repeat* significa decir otra vez.'
    example_gloss: Por favor, repite eso.
  en.a1.unit62.lesson01.teach.slowly:
    title: slowly
    gloss: despacio
    note: '*slowly* significa despacio. Es un adverbio terminado en *-ly*; en español «despacio» sirve como adverbio sin cambiar de forma.'
    example_gloss: Por favor, habla despacio.
  en.a1.unit62.lesson02.teach.this_is_leila:
    title: Hello, this is Leila.
    gloss: Hola, soy Leila.
    note: Al teléfono, en inglés se dice *this is...* para decir quién llama. *My name is...* suena raro por teléfono.
  en.a1.unit62.lesson02.teach.speak_to_mia:
    title: Can I speak to Mia?
    gloss: ¿Puedo hablar con Mia?
    note: '*speak to* significa hablar con. Nuestro «con» se convierte aquí en *to*.'
  en.a1.unit62.lesson02.teach.repeat_that:
    title: Please repeat that.
    gloss: Por favor, repite eso.
    note: '*Please repeat that* pide cortésmente que se repita algo.'
  en.a1.unit62.lesson02.teach.speak_slowly:
    title: Please speak slowly.
    gloss: Por favor, habla despacio.
    note: '*slowly* va aquí después del verbo *speak*.'
  en.a1.unit62.lesson02.teach.leave_message:
    title: Leave a message.
    gloss: Deja un mensaje.
    note: '*leave a message* es la expresión fija para «dejar un mensaje».'
  en.a1.unit62.lesson02.teach.call_back_later:
    title: I'll call back later.
    gloss: Volveré a llamar más tarde.
    note: '*call back* significa volver a llamar. La partícula *back* va detrás del verbo.'
  en.a1.unit62.lesson03.teach.dialogue_line1:
    title: Mia contesta
    gloss: 'Mia dice: Hola, soy Mia.'
    note: '*this is Mia* suena natural por teléfono.'
  en.a1.unit62.lesson03.teach.dialogue_line2:
    title: Leila dice quién llama
    gloss: 'Leila dice: Hola, Mia, soy Leila.'
    note: Usa *this is* para presentarte tú mismo por teléfono.
  en.a1.unit62.lesson03.teach.dialogue_line3:
    title: Leila no oye bien
    gloss: 'Leila dice: No te oigo bien.'
    note: '*can''t hear you well* significa «no poder oírte bien».'
  en.a1.unit62.lesson03.teach.dialogue_line4:
    title: Leila pide que hable despacio
    gloss: 'Leila dice: Por favor, habla despacio.'
    note: '*Please speak slowly* es una petición cortés.'
  en.a1.unit62.lesson03.teach.dialogue_line5:
    title: Mia dice la hora
    gloss: 'Mia dice: Claro. La reunión es a las cuatro.'
    note: '*at four* usa *at* para indicar una hora.'
  en.a1.unit62.lesson03.teach.dialogue_line6:
    title: Leila pide que repita
    gloss: 'Leila dice: Por favor, repite eso.'
    note: '*repeat that* se refiere a lo que se acaba de decir.'
  en.a1.unit62.lesson03.teach.dialogue_line7:
    title: Mia repite las cuatro
    gloss: 'Mia dice: Las cuatro en punto.'
    note: '*Four o''clock* es una hora en punto.'
  en.a1.unit62.lesson03.teach.dialogue_line8:
    title: Leila volverá a llamar
    gloss: 'Leila dice: Gracias. Volveré a llamar más tarde.'
    note: '*I''ll* es la forma abreviada de *I will*.'
  en.a1.unit62.lesson04.teach.phone_note:
    title: Mensaje telefónico
    gloss: 'Mensaje telefónico: Mia llamó a las 3:00. Reunión en la sala 5. Por favor, devuelve la llamada.'
    note: El mensaje indica quién llamó, la hora, la sala y qué hay que hacer.
  en.a1.unit62.lesson04.teach.reading_passage:
    title: 'Texto: Una llamada breve'
    gloss: 'Una llamada breve: Mia llamó a Leila por la tarde. No se oía bien, así que Leila le pidió a Mia que hablara despacio. Mia dijo que la reunión era a las cuatro en la sala 5. Leila le pidió a Mia que repitiera la hora. Más tarde, Leila escribió un mensaje telefónico. El mensaje decía que Mia había llamado a las 3:00 y que le pedía que devolviera la llamada.'
    note: '*called* es el pasado de *call*.'
