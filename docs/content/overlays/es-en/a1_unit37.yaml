  en.a1.unit37.lesson02.teach.congratulate_someone_on:
    title: congratulate someone on
    gloss: felicitar a alguien por
    note: Después de *congratulate someone* se usa siempre la preposición *on*, no *for* ni *with*. En español decimos «felicitar por», así que no traduzcas la preposición palabra por palabra.
    example_gloss: Lo felicitamos por su ascenso.
