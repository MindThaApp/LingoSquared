    gloss: ¿Quieres venir a mi fiesta?
    note: Una forma amable e informal de invitar a alguien.
  en.a1.unit37.lesson03.teach.dialogue_line1:
    title: La pregunta de Leila
    gloss: 'Leila pregunta: ¿Sabías que el cumpleaños de Daniel es el 12 de octubre?'
    note: '*Did you know ...?* es una forma natural de empezar una conversación con información nueva.'
  en.a1.unit37.lesson03.teach.dialogue_line2:
    title: La reacción de Mia
    gloss: 'Mia dice: ¡No, no lo sabía! Es el viernes que viene.'
    note: '*No, I didn''t!* es una respuesta negativa corta a una pregunta con *Did you know ...?*: «No, no lo sabía».'
  en.a1.unit37.lesson03.teach.dialogue_line3:
    title: La propuesta de Leila
    gloss: 'Leila dice: Hagámosle una fiesta sorpresa en la oficina.'
    note: '*Let''s* + verbo se usa para proponer algo, como «vamos a» o «hagamos» en español.'
  en.a1.unit37.lesson03.teach.dialogue_line4:
    title: La reacción de Mia
    gloss: 'Mia dice: ¡Buena idea! Puedo invitar al resto del equipo.'
    note: '*the rest of the team* significa el resto del equipo.'
  en.a1.unit37.lesson03.teach.dialogue_line5:
    title: Leila's plan
    gloss: 'Leila dice: Perfecto. Le compraré un regalo, quizá unos zapatos nuevos para correr, porque le encanta correr.'
    note: '*since* significa aquí «porque» (razón), no «desde» (tiempo).'
  en.a1.unit37.lesson03.teach.dialogue_line6:
    title: La propuesta de Mia
    gloss: 'Mia dice: Es una buena idea. ¿Compramos también un pastel?'
    note: '*Should we ...?* se usa para tomar una decisión entre todos.'
  en.a1.unit37.lesson03.teach.dialogue_line7:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: ¡Sí, claro! Todos le desearemos un feliz cumpleaños juntos.'
    note: '*We''ll all wish him a happy birthday* significa: todos le desearemos un feliz cumpleaños.'
  en.a1.unit37.lesson04.teach.reading_passage:
    title: Texto sobre la fiesta sorpresa
    gloss: Daniel no sabía que Leila y Mia le estaban preparando una fiesta sorpresa. El 12 de octubre, su cumpleaños, llegó al trabajo y encontró globos y un pastel en la sala de descanso. Todos le dijeron «¡Feliz cumpleaños!». Leila le regaló unos zapatos nuevos para correr. Mia le regaló una foto enmarcada de los tres compañeros juntos, que ella misma había sacado. Daniel estaba muy feliz y les dio las gracias a todos por la maravillosa sorpresa.
    note: '*he arrived at work and found*: pasado de *arrive* y *find* (llegó al trabajo y encontró ...).'
