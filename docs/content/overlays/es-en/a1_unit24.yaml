teaching:
  en.a1.unit24.lesson01.teach.bedroom:
    title: bedroom
    gloss: dormitorio
    note: '*bedroom* significa dormitorio o habitación. Se compone de *bed* (cama) y *room* (habitación), pero en inglés se pronuncia con el acento en la primera parte: *BED-room*.'
    example_gloss: Mi dormitorio está al lado del baño.
  en.a1.unit24.lesson01.teach.kitchen:
    title: kitchen
    gloss: cocina
    note: '*kitchen* significa cocina. Se pronuncia *KICH-en*; la *t* no se pronuncia.'
    example_gloss: La cocina está al lado del salón.
  en.a1.unit24.lesson01.teach.bathroom:
    title: bathroom
    gloss: baño
    note: '*bathroom* significa cuarto de baño. En EE. UU. suele ser también la palabra para el aseo.'
    example_gloss: El baño tiene una ducha.
  en.a1.unit24.lesson01.teach.living_room:
    title: living room
    gloss: salón
    note: '*living room* significa salón o sala de estar. Son dos palabras escritas por separado.'
    example_gloss: Vemos la tele en el salón.
  en.a1.unit24.lesson01.teach.garden:
    title: garden
    gloss: jardín
    note: '*garden* significa jardín. En EE. UU. para el jardín de detrás de la casa se usa a menudo *yard*.'
    example_gloss: No hay jardín, pero hay un balcón.
  en.a1.unit24.lesson01.teach.the_kitchen_is_a_room:
    title: This is the kitchen.
    gloss: Esta es la cocina.
    note: 'Con *This is ...* señalas algo. *the* se refiere a algo concreto: la cocina de este piso.'
  en.a1.unit24.lesson02.teach.how_many_rooms:
    title: How many rooms are there?
    gloss: ¿Cuántas habitaciones hay?
    note: Con *How many...are there?* preguntas por una cantidad. *many* se usa con cosas contables en plural; *are* va porque *rooms* es plural.
  en.a1.unit24.lesson02.teach.there_is_a_kitchen:
    title: There's a small kitchen.
    gloss: Hay una cocina pequeña.
    note: 'Con *There''s...* (*there is*) dices que hay algo en un lugar. Equivale al «hay» español, pero en inglés el verbo cambia: *there is* con una cosa y *there are* con varias.'
  en.a1.unit24.lesson02.teach.next_to:
    title: next to
    gloss: al lado de
    note: '*next to* significa al lado de. Son dos palabras que siempre van juntas.'
    example_gloss: La silla está al lado de la mesa.
  en.a1.unit24.lesson03.teach.apartment:
    title: apartment
    gloss: piso, apartamento
    note: '*apartment* significa piso o apartamento (inglés americano; en inglés británico se dice *flat*).'
    example_gloss: El piso de Daniel tiene dos dormitorios.
  en.a1.unit24.lesson03.teach.home_text:
    title: Texto sobre un piso
    gloss: Mi piso tiene dos dormitorios y un baño. Hay una cocina pequeña al lado del salón.
    note: En este texto breve alguien describe su piso e indica cuántas habitaciones tiene.
  en.a1.unit24.lesson04.teach.favorite_room:
    title: What's your favorite room?
    gloss: ¿Cuál es tu habitación favorita?
    note: '*favorite* significa favorito, preferido.'
  en.a1.unit24.lesson04.teach.q_tell_me_about:
    title: Pedir que describa el piso
    gloss: 'Leila dice: Cuéntame cómo es tu piso.'
    note: Con *Tell me about...* pides a alguien que describa algo.
  en.a1.unit24.lesson04.teach.a_two_bed_one_bath:
    title: Respuesta de Daniel
    gloss: 'Daniel dice: Tiene dos dormitorios y un baño. Hay una cocina pequeña al lado del salón.'
    note: Daniel indica el número de habitaciones y dónde está la cocina.
  en.a1.unit24.lesson04.teach.q_is_there_garden:
    title: Preguntar por el jardín
    gloss: 'Leila pregunta: ¿Hay jardín?'
    note: Con *Is there...?* preguntas si existe algo.
  en.a1.unit24.lesson04.teach.a_no_but_balcony:
    title: Respuesta de Daniel
    gloss: 'Daniel dice: No, no hay, pero hay un balcón pequeño.'
    note: Daniel primero dice que no y luego menciona una alternativa.
  en.a1.unit24.lesson04.teach.a_living_room_near_kitchen:
    title: Última respuesta de Daniel
    gloss: 'Daniel dice: Mi habitación favorita es el salón. Está cerca de la cocina, así que es fácil cenar allí.'
    note: Daniel dice cuál es su habitación favorita y da el motivo.
