teaching:
  en.b2.unit05.lesson01.teach.register:
    title: Register
    gloss: registro, grado de formalidad
    note: '*register* es lo formal o informal que suena lo que dices. En inglés no existe la distinción entre tú y usted; el tono se marca sobre todo con la formulación de la frase.'
    example_gloss: El registro cambia cuando cambia el destinatario.
  en.b2.unit05.lesson01.teach.casual:
    title: casual
    gloss: informal, desenfadado
    note: '*casual* encaja con un amigo o un conocido. Es más directo, pero no resulta maleducado automáticamente.'
    example_gloss: Un mensaje informal es adecuado para un amigo.
  en.b2.unit05.lesson01.teach.professional:
    title: professional
    gloss: profesional, cortés y de trabajo
    note: '*professional* encaja con un colega: cortés y claro, pero sin ser excesivamente formal.'
    example_gloss: Un mensaje profesional es adecuado para un colega.
  en.b2.unit05.lesson01.teach.formal:
    title: formal
    gloss: formal
    note: '*formal* encaja con una institución. En inglés esto se consigue a menudo con peticiones más largas e indirectas.'
    example_gloss: Un mensaje formal es adecuado para una institución.
  en.b2.unit05.lesson01.teach.audience:
    title: audience
    gloss: destinatarios, público
    note: '*audience* es la persona o el grupo a quien escribes o hablas.'
    example_gloss: Tu público influye en la elección de las palabras.
  en.b2.unit05.lesson01.teach.institution:
    title: institution
    gloss: institución, organismo
    note: '*institution* es una organización como una clínica, un banco o una universidad.'
    example_gloss: Una clínica es una institución.
  en.b2.unit05.lesson02.teach.formal_request:
    title: Petición formal
    gloss: Le agradecería que pudiera confirmarme si mi cita se puede cambiar al viernes.
    note: '*I would be grateful if you could...* es formal. En inglés no hace falta otra palabra distinta para *you*; la cortesía está en toda la construcción.'
  en.b2.unit05.lesson02.teach.casual_request:
    title: Petición informal
    gloss: ¿Puedes cambiarlo al viernes?
    note: '*Can you...?* está bien para un amigo, pero enseguida suena demasiado directo para una institución.'
  en.b2.unit05.lesson02.teach.professional_request:
    title: Petición profesional
    gloss: ¿Podemos cambiar la cita al viernes si a ti todavía te viene bien?
    note: '*Could we...?* suena colaborativo y cortés para un colega.'
  en.b2.unit05.lesson02.teach.to_whom:
    title: Dear scheduling team,
    gloss: 'Estimado equipo de planificación:'
    note: '*Dear...* es un saludo formal normal. Resulta menos rígido que muchos saludos formales de carta en español.'
  en.b2.unit05.lesson02.teach.grammar_register_shift:
    title: Cambiar de registro
    gloss: Mantén el contenido igual cuando cambies de registro. El inglés informal puede usar preguntas directas. El inglés profesional suele usar could. El inglés formal suele usar I would be grateful if you could.
    note: 'No pienses solo en tú frente a usted: en inglés cambia toda la frase.'
  en.b2.unit05.lesson03.teach.stiff:
    title: stiff
    gloss: rígido, demasiado formal
    note: '*stiff* significa que un mensaje suena innecesariamente formal para la situación.'
    example_gloss: Un mensaje rígido suena demasiado formal para la situación.
  en.b2.unit05.lesson03.teach.appropriate:
    title: appropriate
    gloss: adecuado, apropiado
    note: '*appropriate* significa que la formulación encaja con el destinatario y la situación.'
    example_gloss: Un mensaje adecuado encaja con el destinatario.
  en.b2.unit05.lesson03.teach.reading_passage:
    title: 'Texto de lectura: el mismo mensaje, tres destinatarios'
    gloss: 'Nina tiene que cambiar una cita al viernes. A un amigo le escribe: Can you move it to Friday? El mensaje es directo e informal. A un colega le escribe: Could we move the appointment to Friday if that still works for you? El mensaje es profesional y cortés. A la clínica le escribe: I would be grateful if you could confirm whether my appointment can be moved to Friday. El contenido es el mismo en los tres textos, pero el registro cambia según el destinatario.'
    note: En inglés el registro cambia mediante la formulación, no mediante una palabra distinta para «usted».
  en.b2.unit05.lesson04.teach.q_need_ask:
    title: Nina pregunta por la formulación
    gloss: 'Nina dice: Tengo que preguntar si se puede cambiar mi cita. ¿Puedo escribir simplemente: ''Can you move it?''?'
    note: '*just write* muestra que duda de si la forma directa es adecuada.'
  en.b2.unit05.lesson04.teach.a_too_casual:
    title: Oscar señala el registro
    gloss: 'Oscar dice: A un amigo, sí. A la clínica, eso suena demasiado informal.'
    note: Aquí también se usa simplemente *you* en inglés, pero la frase en sí es demasiado directa para la clínica.
  en.b2.unit05.lesson04.teach.q_colleague:
    title: Nina pregunta por el registro con un colega
    gloss: 'Nina pregunta: ¿Qué le escribirías a un colega?'
    note: Un colega pide un registro profesional, no el máximo de formalidad.
  en.b2.unit05.lesson04.teach.a_colleague_request:
    title: Oscar da la versión para el colega
    gloss: 'Oscar dice: Yo escribiría: ''Could we move the appointment to Friday if that still works for you?'''
    note: '*Could we* y *if that still works for you* suavizan la petición.'
  en.b2.unit05.lesson04.teach.q_clinic:
    title: Nina pregunta por la clínica
    gloss: 'Nina pregunta: ¿Y a la clínica?'
    note: Una institución pide una estructura de petición más formal.
  en.b2.unit05.lesson04.teach.a_clinic_request:
    title: Oscar da la versión formal
    gloss: 'Oscar dice: Yo escribiría: ''I would be grateful if you could confirm whether my appointment can be moved to Friday.'''
    note: Esta versión no exige una acción de forma brusca, sino que pide una confirmación.
  en.b2.unit05.lesson04.teach.q_same_message:
    title: Nina resume
    gloss: 'Nina dice: El mismo mensaje, distinto registro.'
    note: 'El contenido sigue siendo el mismo: cambiar la cita al viernes.'
  en.b2.unit05.lesson04.teach.a_content_stays:
    title: Oscar lo confirma
    gloss: 'Oscar dice: Exacto. El contenido sigue igual, pero cambia el nivel de formalidad.'
    note: Esa es la clave del control del registro en B2.
