course:
  title: Inglés B2
  description: Aprende inglés de nivel B2 para mantener conversaciones matizadas, argumentar, hacer suposiciones y participar en discusiones profesionales, con explicaciones en un español informal.
units:
  en.b2.unit05.register:
    title: Same message, different register
lessons:
  en.b2.unit05.lesson01.audience_and_formality:
    title: Informal, profesional y formal
  en.b2.unit05.lesson02_same_request_three_ways:
    title: Can you, could we, I would be grateful
  en.b2.unit05.lesson03.reading_same_message:
    title: 'Lectura: tres tipos de destinatario'
  en.b2.unit05.lesson04.the_register_dialogue:
