  en.a1.unit52.lesson03.teach.dialogue_line1:
    title: El saludo del peluquero
    gloss: 'El peluquero dice: Hola, ¿en qué puedo ayudarte hoy?'
    note: '*How can I help you today?* significa ¿en qué puedo ayudarte hoy?'
  en.a1.unit52.lesson03.teach.dialogue_line2:
    title: La petición de Daniel
    gloss: 'Daniel dice: Quisiera un corte de pelo, por favor. Mi hermana viene de visita la próxima semana.'
    note: '*I''d like a haircut* usa el sustantivo *haircut*, igual que la expresión española «quisiera un corte de pelo».'
  en.a1.unit52.lesson03.teach.dialogue_line3:
    title: "El peluquero pregunta"
    gloss: 'El peluquero pregunta: Claro, ¿qué estilo quieres?'
    note: '*what style do you want* significa qué estilo quieres.'
  en.a1.unit52.lesson03.teach.dialogue_line4:
    title: Lo que quiere Daniel
    gloss: 'Daniel dice: El mismo corte, solo un poco más corto.'
    note: '*just a little shorter* significa solo un poco más corto.'
  en.a1.unit52.lesson03.teach.dialogue_line5:
    title: La pregunta de Mia
    gloss: 'Mia pregunta: ¿Puedes lavarle el pelo primero?'
    note: '*Can you wash his hair first?* significa ¿puedes lavarle el pelo primero?'
  en.a1.unit52.lesson03.teach.dialogue_line6:
    title: La confirmación del peluquero
    gloss: 'El peluquero dice: Por supuesto, y eso está incluido con el corte de pelo.'
    note: '*included with* significa incluido con.'
  en.a1.unit52.lesson03.teach.dialogue_line7:
    title: La pregunta de Daniel sobre el precio
    gloss: 'Daniel pregunta: Genial. ¿Cuánto cuesta?'
    note: '*Great.* aquí significa genial y se usa como una respuesta breve.'
  en.a1.unit52.lesson03.teach.dialogue_line8:
    title: El precio
    gloss: 'El peluquero dice: Son veinte dólares.'
    note: Es una repetición de la frase aprendida anteriormente.
  en.a1.unit52.lesson04.teach.reading_passage:
    title: Texto sobre una visita a la peluquería
    gloss: 'Una visita a la peluquería: La hermana de Daniel iba a venir de visita desde Chicago la semana siguiente, así que él decidió cortarse el pelo. Mia le recomendó su peluquero favorito, que trabajaba en un pequeño salón cerca de su apartamento, y fue con él. El peluquero le preguntó qué estilo quería y Daniel respondió que el mismo corte, solo un poco más corto. Primero le lavó el pelo, y el lavado estaba incluido con el corte. El corte de pelo costó veinte dólares. Cuando terminaron, Mia dijo que su pelo se veía genial. De camino a casa, quedaron con Leila para tomar un café. Ella se sentía mucho mejor después de su resfriado y también le encantó el nuevo corte de Daniel.'
    note: '*looked great* significa se veía genial.'
