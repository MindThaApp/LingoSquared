teaching:
  en.a1.unit36.lesson01.teach.class:
    title: class
    gloss: clase
    note: '*class* significa clase (una sesión en la que aprendes algo).'
    example_gloss: Tengo clase todos los martes por la noche.
  en.a1.unit36.lesson01.teach.course:
    title: course
    gloss: curso
    note: '*course* significa curso (una serie de clases sobre un tema).'
    example_gloss: Este año hace un curso de computación.
  en.a1.unit36.lesson01.teach.student:
    title: student
    gloss: estudiante / alumno
    note: '*student* significa estudiante o alumno: alguien que aprende en una escuela o en una clase.'
    example_gloss: Ella es estudiante en el instituto de formación local.
  en.a1.unit36.lesson01.teach.homework:
    title: homework
    gloss: tarea
    note: '*homework* significa tarea (deberes).'
    example_gloss: Hago mi tarea después de la cena.
  en.a1.unit36.lesson01.teach.subject:
    title: subject
    gloss: materia
    note: '*subject* significa materia o asignatura (un tema que estudias).'
    example_gloss: Las matemáticas son mi materia favorita.
  en.a1.unit36.lesson01.teach.test:
    title: test
    gloss: examen
    note: '*test* significa examen o prueba.'
    example_gloss: Tenemos un examen el viernes.
  en.a1.unit36.lesson02.teach.take_a_class:
    title: take a class
    gloss: tomar una clase
    note: '*take a class* es la combinación fija en inglés para asistir a una clase. No digas *follow a class* (suena raro en inglés); usa siempre *take*.'
    example_gloss: Tomo una clase todos los martes por la noche.
  en.a1.unit36.lesson02.teach.do_homework:
    title: do homework
    gloss: hacer la tarea
    note: '*do homework*: el verbo es *do*, no *make*: *do homework*.'
    example_gloss: Él hace su tarea después de la cena.
  en.a1.unit36.lesson02.teach.study_for_a_test:
    title: study for a test
    gloss: estudiar para un examen
    note: '*study for a test* significa estudiar para un examen. *For* indica aquí el objetivo (para qué estudias).'
    example_gloss: Estudio para un examen todos los viernes.
  en.a1.unit36.lesson02.teach.community_college:
    title: community college
    gloss: centro local de formación para adultos
    note: '*community college* es un centro de formación de Estados Unidos donde sobre todo adultos hacen cursos además de trabajar. No hay una traducción exacta al español, así que se suele usar el nombre en inglés o una explicación.'
    example_gloss: Ella estudia en un centro local de formación para adultos.
  en.a1.unit36.lesson02.teach.in_the_evening:
    title: in the evening
    gloss: por la noche
    note: '*in the evening* significa por la tarde-noche, al final del día.'
    example_gloss: Mi clase es por la noche.
  en.a1.unit36.lesson02.teach.what_are_you_studying_question:
    title: What are you studying?
    gloss: ¿Qué estudias?
    note: Esta pregunta usa el presente continuo (*are you studying*) para algo en lo que estás ocupado en esta etapa de tu vida. En español usamos el presente simple («¿Qué estudias?»), pero en inglés se prefiere el presente continuo.
  en.a1.unit36.lesson03.teach.dialogue_line1:
    title: La pregunta de Daniel
    gloss: 'Daniel pregunta: ¿Haces algo hoy después del trabajo?'
    note: '*anything* significa aquí «algo» o «cualquier cosa» y aparece en una pregunta.'
  en.a1.unit36.lesson03.teach.dialogue_line2:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Sí, esta noche tengo una clase de fotografía.'
    note: '*tonight* significa esta noche.'
  en.a1.unit36.lesson03.teach.dialogue_line3:
    title: La reacción de Daniel
    gloss: 'Daniel dice: ¡Ah, qué bien! ¿Dónde la tomas?'
    note: '*Where do you take it?*: aquí también se usa *take* para asistir a una clase o curso, igual que en *take a class*.'
  en.a1.unit36.lesson03.teach.dialogue_line4:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: En el centro de formación del centro de la ciudad. Es dos veces por semana.'
    note: '*twice a week*: aquí también *a* significa «por».'
  en.a1.unit36.lesson03.teach.dialogue_line5:
    title: La pregunta de Daniel
    gloss: 'Daniel dice: ¿Cómo va hasta ahora?'
    note: '*so far* significa hasta ahora.'
  en.a1.unit36.lesson03.teach.dialogue_line6:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Me gusta mucho. Estoy aprendiendo a usar mejor mi cámara.'
    note: '*I''m learning how to ...*: presente continuo para una habilidad que estás desarrollando en este momento.'
  en.a1.unit36.lesson03.teach.dialogue_line7:
    title: El último comentario de Daniel
    gloss: 'Daniel dice: ¡Qué bien! Quizá algún día puedas enseñarme.'
    note: '*sometime* significa «algún día» o «en algún momento»: una referencia vaga a un tiempo futuro.'
  en.a1.unit36.lesson04.teach.reading_passage:
    title: Texto sobre Daniel, Leila y Mia
    gloss: Daniel, Leila y Mia están aprendiendo algo nuevo fuera del trabajo. Daniel hace un curso de computación los lunes por la noche para aprender nuevas habilidades para su trabajo. Leila estudia español porque algún día quiere viajar a México. Mia tiene una clase de fotografía dos veces por semana en el centro de formación local, y ya saca fotos mucho mejores. A veces hablan juntos de sus clases a la hora del almuerzo.
    note: '*takes a computer course*: se usa *take*, no *follow*; es la misma trampa que con *take a class*.'
