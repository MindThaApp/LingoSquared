teaching:
  en.b1.unit18.lesson01.teach.arrangement:
    title: arrangement
    gloss: cita, compromiso acordado
    note: '*arrangement* es un plan que ya está acordado con otra persona, por ejemplo con una hora fijada.'
    example_gloss: Mia tiene una cita con Leila el viernes.
  en.b1.unit18.lesson01.teach.intention:
    title: intention
    gloss: intención, propósito
    note: '*intention* es algo que has decidido hacer, pero para lo cual aún no has fijado una hora con nadie.'
    example_gloss: La intención de Daniel es terminar el proyecto antes de tiempo.
  en.b1.unit18.lesson01.teach.prediction:
    title: prediction
    gloss: predicción, pronóstico
    note: '*prediction* es una estimación de lo que va a pasar, basada en ciertos indicios.'
    example_gloss: Mi pronóstico es que el proyecto terminará a tiempo.
  en.b1.unit18.lesson01.teach.definitely:
    title: definitely
    gloss: sin duda, definitivamente
    note: '*definitely* indica que estás completamente seguro de que algo va a pasar.'
    example_gloss: Daniel terminará el informe hoy sin duda.
  en.b1.unit18.lesson01.teach.probably:
    title: probably
    gloss: probablemente
    note: '*probably* indica que estás bastante seguro, pero no del todo.'
    example_gloss: El proyecto probablemente tardará dos meses.
  en.b1.unit18.lesson01.teach.might:
    title: might
    gloss: quizás, podría
    note: '*might* indica que algo es solo una posibilidad remota.'
    example_gloss: Quizás Daniel le pida a Leila que se una al equipo.
  en.b1.unit18.lesson02.teach.meeting_leila_friday:
    title: I am + Verb-ing (feste Vereinbarung)
    gloss: Almuerzo con Leila el viernes.
    note: '*I am meeting Leila for lunch on Friday* usa el present continuous (presente progresivo) para un compromiso acordado con una hora concreta.'
  en.b1.unit18.lesson02.teach.going_to_start_project:
    title: I am going to + Verb (Absicht)
    gloss: Voy a empezar un nuevo proyecto con el equipo de diseño.
    note: '*I am going to start a new project* usa going to para una decisión ya tomada, sin hora fijada.'
  en.b1.unit18.lesson02.teach.grammar_arrangements_vs_intentions:
    title: Feste Vereinbarungen und Absichten
    gloss: 'Usa el present continuous (I am meeting Leila on Friday) para un compromiso acordado: una hora concreta que ya pactaste con otra persona. Usa going to (I am going to start a new project) para una intención o una decisión que ya tomaste, aunque todavía no tenga hora fija. En español podemos decir ambas cosas con el presente («almuerzo con Leila el viernes») o con «voy a»; en inglés tienes que elegir entre las dos formas.'
    note: 'Forma: elige entre el present continuous para un compromiso acordado y going to para una intención.'
  en.b1.unit18.lesson03.teach.on_time:
    title: on time
    gloss: a tiempo, puntual
    note: '*on time* significa justo a la hora o en la fecha prevista.'
    example_gloss: Daniel cree que el proyecto terminará a tiempo.
  en.b1.unit18.lesson03.teach.confident:
    title: confident
    gloss: seguro, confiado
    note: '*confident* significa sentirse seguro de que algo saldrá bien.'
    example_gloss: Daniel se siente seguro con el nuevo proyecto.
  en.b1.unit18.lesson03.teach.reading_passage:
    title: 'Lesetext: Daniels Pläne für nächsten Monat'
    gloss: Daniel va a empezar un nuevo proyecto con el equipo de diseño el mes que viene. Se reúne con ellos el viernes por la mañana para planificar los primeros pasos. Daniel se siente seguro con el proyecto, pero no está del todo seguro de que termine a tiempo. Calcula que probablemente tardará unos dos meses. Quizás le pida a Leila que se una al equipo, porque tiene experiencia útil en diseño. Si ella acepta, el proyecto avanzará sin duda más rápido.
    note: Un texto breve sobre planes y predicciones.
  en.b1.unit18.lesson04.teach.q_plans_next_month:
    title: Mia fragt nach Daniels Plänen
    gloss: 'Mia dice: Daniel, ¿qué planes tienes para el mes que viene?'
    note: Una pregunta abierta para empezar la conversación.
  en.b1.unit18.lesson04.teach.a_going_to_start:
    title: Daniel nennt sein Vorhaben
    gloss: 'Daniel dice: Voy a empezar un nuevo proyecto con el equipo de diseño.'
    note: '*going to* indica una decisión ya tomada.'
  en.b1.unit18.lesson04.teach.q_meeting_this_week:
    title: Mia fragt weiter
    gloss: 'Mia dice: Qué emocionante. ¿Te reúnes con ellos esta semana?'
    note: Una pregunta sobre un compromiso acordado.
  en.b1.unit18.lesson04.teach.a_meeting_friday_morning:
    title: Daniel bestätigt die feste Vereinbarung
    gloss: 'Daniel dice: Sí, me reúno con ellos el viernes por la mañana.'
    note: '*I am meeting... on Friday morning* es el present continuous para un compromiso acordado.'
  en.b1.unit18.lesson04.teach.q_finish_on_time:
    title: Mia fragt nach dem Termin
    gloss: 'Mia dice: ¿Crees que el proyecto terminará a tiempo?'
    note: Una pregunta sobre una predicción.
  en.b1.unit18.lesson04.teach.a_probably_two_months:
    title: Daniel gibt eine Vorhersage ab
    gloss: 'Daniel dice: No estoy seguro, pero probablemente tardará unos dos meses.'
    note: '*probably* indica bastante seguridad, pero no total.'
  en.b1.unit18.lesson04.teach.q_sure_it_will_go_well:
    title: Mia ist optimistisch
    gloss: 'Mia dice: Bueno, estoy segura de que saldrá bien.'
    note: Un comentario de ánimo.
  en.b1.unit18.lesson04.teach.a_might_ask_leila:
    title: Daniel nennt eine schwache Möglichkeit
    gloss: 'Daniel dice: Gracias. Quizás también le pida a Leila que se una al equipo.'
    note: '*might* indica una posibilidad remota.'
