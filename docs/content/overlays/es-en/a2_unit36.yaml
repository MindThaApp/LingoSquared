teaching:
  en.a2.unit36.lesson01.teach.certificate:
    title: certificate
    gloss: certificado
    note: '*certificate* es el documento oficial que te entrega una institución; *registration certificate* es el certificado de registro de residencia.'
    example_gloss: Mi certificado de registro llegó dos semanas después de la cita.
  en.a2.unit36.lesson01.teach.mistake:
    title: mistake
    gloss: error
    note: '*mistake* es algo que se escribió o se hizo mal.'
    example_gloss: Hay un error en mi dirección en este formulario.
  en.a2.unit36.lesson01.teach.spelled:
    title: spelled
    gloss: escrito, deletreado
    note: '*spelled* indica con qué letras y en qué orden se escribe una palabra.'
    example_gloss: Mi nombre se escribe con una sola L, no con dos.
  en.a2.unit36.lesson01.teach.correct:
    title: correct
    gloss: corregir
    note: 'Aquí *correct* es un verbo: arreglar algo que está mal.'
    example_gloss: El empleado puede corregir mi apellido hoy.
  en.a2.unit36.lesson01.teach.copy:
    title: copy
    gloss: copia
    note: '*copy* es una segunda versión idéntica de un documento.'
    example_gloss: La oficina se queda con una copia de cada documento.
  en.a2.unit36.lesson01.teach.passport:
    title: passport
    gloss: pasaporte
    note: '*passport* es el documento de viaje que lleva tu foto.'
    example_gloss: Siempre llevo mi pasaporte a una cita en una oficina oficial.
  en.a2.unit36.lesson01.teach.grammar_there_is_there_are:
    title: there is und there are
    gloss: Hay un error en mi certificado. Hay dos errores en mi certificado.
    note: Usa *there is* con una sola cosa y *there are* con más de una. En español *hay* no cambia (hay un error, hay dos errores), pero en inglés el verbo cambia según lo que se cuenta.
  en.a2.unit36.lesson02.teach.there_is_a_mistake:
    title: Sagen, dass ein Fehler vorliegt
    gloss: Hay un error en mi certificado de registro.
    note: '*There is a mistake on...* es la forma objetiva y formal de avisar de un error.'
  en.a2.unit36.lesson02.teach.name_spelled_wrong:
    title: Sagen, was genau falsch ist
    gloss: Mi apellido está mal escrito.
    note: '*last name* es el apellido; *first name* es el nombre de pila.'
  en.a2.unit36.lesson02.teach.could_you_correct_it:
    title: Fragen, ob es berichtigt werden kann
    gloss: ¿Podría corregirlo, por favor?
    note: '*Could you...?* es más cortés que *Can you...?* y encaja bien en una ventanilla oficial.'
  en.a2.unit36.lesson02.teach.how_long_correction:
    title: Fragen, wie lange es dauert
    gloss: ¿Cuánto tardará la corrección?
    note: '*How long...?* pregunta por un periodo de tiempo, no por una longitud.'
  en.a2.unit36.lesson02.teach.grammar_polite_request:
    title: zwei höfliche Bitten
    gloss: ¿Podría corregirlo, por favor? ¿Sería posible obtener un certificado nuevo?
    note: '*Could you...?* pide que alguien haga algo; *Would it be possible to...?* es aún más cuidadoso y pregunta si algo es posible.'
  en.a2.unit36.lesson03.teach.working_days:
    title: working days
    gloss: días hábiles
    note: '*working days* son los días de lunes a viernes, sin el fin de semana.'
    example_gloss: La oficina responde cada carta en un plazo de cinco días hábiles.
  en.a2.unit36.lesson03.teach.notice_text:
    title: Das Schreiben zur Berichtigung
    gloss: Solicitud de corrección recibida. Su certificado de registro será corregido en un plazo de cinco días hábiles. Por favor, lleve su pasaporte y esta carta a la oficina. Número de referencia 3092.
    note: 'Una carta oficial es breve y objetiva: qué ocurrió, qué ocurrirá y qué debe hacer usted.'
  en.a2.unit36.lesson03.teach.bring_passport_and_notice:
    title: was man mitbringen soll
    gloss: Por favor, lleve su pasaporte y esta carta a la oficina.
    note: '*bring ... to ...* significa llevar algo a un lugar.'
  en.a2.unit36.lesson04.teach.q_there_is_a_mistake:
    title: Leila meldet den Fehler
    gloss: 'Leila dice: Buenas tardes, hay un error en mi certificado de registro.'
    note: '*Hello* es más neutral que *Hi* y encaja mejor en una ventanilla oficial.'
  en.a2.unit36.lesson04.teach.a_what_is_wrong:
    title: Der Sachbearbeiter fragt nach
    gloss: 'El empleado dice: Entiendo. ¿Qué es lo que está mal?'
    note: '*I see* significa aquí: entiendo, lo estoy escuchando.'
  en.a2.unit36.lesson04.teach.q_name_spelled_wrong:
    title: Leila erklärt den Fehler und bittet um Berichtigung
    gloss: 'Leila dice: Mi apellido está mal escrito. ¿Podría corregirlo, por favor?'
    note: Son las dos mismas frases de la lección 2, ahora una tras otra.
  en.a2.unit36.lesson04.teach.a_do_you_have_passport:
    title: Der Sachbearbeiter fragt nach dem Reisepass
    gloss: 'El empleado dice: Por supuesto. ¿Trae su pasaporte?'
    note: '*Do you have ... with you?* significa: ¿Lo trae ahora mismo?'
  en.a2.unit36.lesson04.teach.q_here_it_is:
    title: Leila reicht ihren Reisepass
    gloss: 'Leila dice: Sí, aquí está.'
    note: '*Here it is* se dice al entregarle algo a alguien.'
  en.a2.unit36.lesson04.teach.a_copy_and_send:
    title: Der Sachbearbeiter erklärt, was er tut
    gloss: 'El empleado dice: Muchas gracias. Voy a hacer una copia y enviaré la corrección hoy mismo.'
    note: '*make a copy* es una combinación fija: hacer una copia.'
  en.a2.unit36.lesson04.teach.q_how_long:
    title: Leila fragt, wie lange es dauert
    gloss: 'Leila pregunta: ¿Cuánto tardará la corrección?'
    note: Es la misma pregunta de la lección 2.
  en.a2.unit36.lesson04.teach.a_within_five_working_days:
    title: Die Antwort des Sachbearbeiters
    gloss: 'El empleado dice: En un plazo de cinco días hábiles.'
    note: '*within* indica un plazo: tardará cinco días hábiles como máximo.'
  en.a2.unit36.lesson04.teach.q_thank_you:
    title: Leila bedankt sich beim Sachbearbeiter
    gloss: 'Leila dice: Muchas gracias.'
    note: '*very much* hace que el agradecimiento sea más enfático.'
