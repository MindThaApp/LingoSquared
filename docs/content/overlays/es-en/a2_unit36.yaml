course:
  title: Inglés A2
  description: Inglés de nivel A2 para situaciones cotidianas algo más formales, con explicaciones detalladas en español.
units:
  en.a2.unit36.document_correction:
    title: Pedir que corrijan un error en un documento oficial
lessons:
  en.a2.unit36.lesson01.document_vocabulary:
    title: Certificados, errores y copias
  en.a2.unit36.lesson02.asking_for_a_correction:
    title: Pedir una corrección
  en.a2.unit36.lesson03.reading_a_correction_notice:
    title: Leer una carta de corrección
  en.a2.unit36.lesson04.correction_dialogue:
