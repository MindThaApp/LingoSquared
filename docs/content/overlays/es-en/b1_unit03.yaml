teaching:
  en.b1.unit03.lesson01.teach.if:
    title: if
    gloss: si (condición)
    note: '*if* introduce una condición, igual que «si» en español. No lo confundas con *when* («cuando»), que habla de un momento que sí va a llegar: *If it rains* = «si llueve» (quizá sí, quizá no).'
    example_gloss: Si llueve, nos quedamos en casa.
  en.b1.unit03.lesson01.teach.rain:
    title: rain
    gloss: lluvia / llover
    note: '*rain* significa el agua que cae del cielo, o «llover».'
    example_gloss: Podría llover este fin de semana.
  en.b1.unit03.lesson01.teach.stay_home:
    title: stay home
    gloss: quedarse en casa
    note: '*stay home* significa no salir y quedarse en casa.'
    example_gloss: Si llueve, nos quedamos en casa.
  en.b1.unit03.lesson01.teach.weekend:
    title: weekend
    gloss: fin de semana
    note: '*weekend* significa sábado y domingo.'
    example_gloss: ¿Qué planes tienes para el fin de semana?
  en.b1.unit03.lesson01.teach.free_time:
    title: free time
    gloss: tiempo libre
    note: '*free time* es el tiempo en que no trabajas ni estás ocupado.'
    example_gloss: Estos días no tengo mucho tiempo libre.
  en.b1.unit03.lesson01.teach.paint:
    title: paint
    gloss: pintar
    note: '*paint* significa hacer un cuadro con pintura.'
    example_gloss: A Leila le encanta pintar los fines de semana.
  en.b1.unit03.lesson02.teach.if_rains_stay_home:
    title: eine reale Bedingung in der Zukunft
    gloss: Si llueve mañana, nos quedamos en casa.
    note: '*if + presente, will + verbo en forma base* expresa una condición real y posible en el futuro.'
  en.b1.unit03.lesson02.teach.if_have_free_time_paint:
    title: eine weitere reale Bedingung
    gloss: Si tengo tiempo libre este fin de semana, voy a pintar.
    note: 'La misma construcción: *if + presente, will + verbo en forma base*.'
  en.b1.unit03.lesson02.teach.grammar_real_condition:
    title: reale Bedingungen
    gloss: Si llueve, nos quedamos en casa. Si tengo tiempo, voy a pintar.
    note: 'Después de *if* el inglés usa el presente aunque se hable del futuro; no se dice *will rain*. En español pasa algo parecido: «si llueve», no «si lloverá».'
  en.b1.unit03.lesson03.teach.would:
    title: would
    gloss: haría / me gustaría (condicional)
    note: '*would* + verbo en forma base expresa una situación irreal o hipotética en el presente.'
    example_gloss: Si tuviera más tiempo, pintaría todos los días.
  en.b1.unit03.lesson03.teach.class:
    title: class
    gloss: clase / curso
    note: '*class* significa un curso o una clase organizada con un profesor.'
    example_gloss: Había un curso de pintura cerca de su casa.
  en.b1.unit03.lesson03.teach.reading_passage:
    title: 'Lesetext: wenn sie mehr Freizeit hätte'
    gloss: A Leila le encanta pintar, pero no tiene mucho tiempo libre. Si tuviera más tiempo libre, pintaría todos los días. El mes pasado había un curso de pintura cerca de su casa. Si lo hubiera sabido antes, se habría inscrito. Ahora busca cursos nuevos cada semana.
    note: Un texto breve con una situación irreal en el presente y otra irreal en el pasado.
  en.b1.unit03.lesson04.teach.q_weekend_plans:
    title: Daniel fragt nach dem Wochenende
    gloss: 'Daniel dice: ¿Qué planes tienes para el fin de semana?'
    note: Una pregunta abierta y sencilla para empezar una conversación.
  en.b1.unit03.lesson04.teach.a_walk_or_stay_home:
    title: Leilas Pläne, je nach Wetter
    gloss: 'Leila dice: Si no llueve, iré a caminar. Si llueve, me quedaré en casa a pintar.'
    note: Dos condiciones reales seguidas, según el clima.
  en.b1.unit03.lesson04.teach.q_take_class:
    title: Daniel fragt nach dem Malkurs
    gloss: 'Daniel dice: Suena bien. ¿Tomaste ese curso de pintura el mes pasado?'
    note: Una pregunta de seguimiento sobre algo del pasado.
  en.b1.unit03.lesson04.teach.a_would_have_signed_up:
    title: Leilas Reue über die Vergangenheit
    gloss: 'Leila dice: No. Si lo hubiera sabido antes, me habría inscrito.'
    note: '*if + past perfect, would have + participio* expresa un pasado irreal o un arrepentimiento.'
  en.b1.unit03.lesson04.teach.q_should_join:
    title: Daniel gibt eine Empfehlung
    gloss: 'Daniel dice: Qué lástima. Si hay otro, deberías apuntarte.'
    note: Daniel usa *should* para animar a Leila a aprovechar la próxima oportunidad.
  en.b1.unit03.lesson04.teach.a_will_sign_up:
    title: Leila nimmt sich etwas vor
    gloss: 'Leila dice: Tienes razón. Si veo uno, me inscribo de inmediato.'
    note: Una nueva condición real sobre el futuro, ya no hipotética.
