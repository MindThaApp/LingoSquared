course:
  title: Inglés B2
  description: Aprende inglés de nivel B2 para mantener conversaciones matizadas, argumentar, hacer suposiciones y participar en discusiones profesionales, con explicaciones en un español informal.
units:
  en.b2.unit07.negotiation:
    title: On condition that the scope is reduced
lessons:
  en.b2.unit07.lesson01_terms_and_concessions:
    title: Condiciones, negativas y concesiones
  en.b2.unit07.lesson02_conditional_terms:
    title: I can agree on condition that...
  en.b2.unit07.lesson03.reading_revised_terms:
    title: 'Lectura: ¿qué se ha acordado?'
  en.b2.unit07.lesson04.the_negotiation_dialogue:
    title: Agreed, with a condition
teaching:
  en.b2.unit07.lesson01.teach.term:
    title: term
    gloss: cláusula, punto de un acuerdo
    note: '*term* es una parte de un acuerdo. Aquí no significa el trimestre de un curso escolar.'
    example_gloss: Una cláusula es una parte de un acuerdo.
  en.b2.unit07.lesson01.teach.proposal:
    title: proposal
    gloss: propuesta
    note: '*proposal* es una propuesta de posibles condiciones.'
    example_gloss: Una propuesta sugiere posibles condiciones.
  en.b2.unit07.lesson01.teach.refusal:
    title: refusal
    gloss: negativa, rechazo
    note: '*refusal* dice que una condición no es aceptable. En inglés, una negativa clara suena mejor si se da también un motivo.'
    example_gloss: Una negativa dice que una condición no es aceptable.
  en.b2.unit07.lesson01.teach.concession:
    title: concession
    gloss: concesión
    note: '*concession* significa renunciar a una parte de tu posición para hacer posible un acuerdo.'
    example_gloss: Una concesión renuncia a una parte de una posición.
  en.b2.unit07.lesson01.teach.scope:
    title: scope
    gloss: alcance del trabajo
    note: '*scope* es la cantidad de trabajo que se incluye. En una negociación puedes sopesar el plazo frente al *scope*.'
    example_gloss: El alcance es la cantidad de trabajo incluida.
  en.b2.unit07.lesson01.teach.condition:
    title: condition
    gloss: requisito previo
    note: '*condition* es algo que debe cumplirse antes de que un acuerdo funcione.'
    example_gloss: Un requisito debe cumplirse antes de que el acuerdo funcione.
  en.b2.unit07.lesson02.teach.condition_deadline:
    title: Concesión condicionada
    gloss: Puedo aceptar el plazo anterior siempre que se reduzca el alcance.
    note: '*I can agree... on condition that...* es claro pero profesional. No suaviza volviéndose vago.'
  en.b2.unit07.lesson02.teach.cannot_agree:
    title: Rechazar con claridad
    gloss: No puedo aceptar el martes como plazo con el alcance completo.
    note: '*I cannot agree to...* suena más profesional que una negativa seca como *No, that is impossible*.'
  en.b2.unit07.lesson02.teach.accept_if:
    title: Aceptar con if
    gloss: Puedo aceptarlo si el anexo completo llega la semana que viene.
    note: '*I can accept that if...* hace explícita la condición.'
  en.b2.unit07.lesson02.teach.grammar_concession:
    title: Rechazar y seguir negociando
    gloss: Usa I cannot agree para marcar un límite con claridad. Usa I can agree on condition that para ofrecer una concesión condicionada.
    note: Una negativa muy directa puede sonar dura en inglés. Da el límite, el motivo y la condición.
  en.b2.unit07.lesson03.teach.executive_summary:
    title: executive summary
    gloss: resumen ejecutivo
    note: '*executive summary* es el resumen breve con los puntos principales de un informe.'
    example_gloss: Un resumen ejecutivo ofrece los puntos principales de un informe.
  en.b2.unit07.lesson03.teach.charts:
    title: charts
    gloss: gráficos, gráficas
    note: '*charts* muestran la información de forma visual.'
    example_gloss: Los gráficos muestran la información de forma visual.
  en.b2.unit07.lesson03.teach.reading_passage:
    title: 'Texto de lectura: condiciones revisadas'
    gloss: 'Priya propuso primero el jueves como plazo para el informe completo. Marcus se opuso porque el cliente necesitaba algo antes. Priya rechazó el martes con el alcance completo porque pondría en riesgo la calidad. Luego ofreció una concesión condicionada: el martes era posible si el alcance se reducía al resumen ejecutivo y los gráficos. Marcus aceptó esa condición, pero añadió una cláusula: el anexo completo debía llegar la semana siguiente. El resultado acordado fue el martes para el resumen y los gráficos, y la semana siguiente para el anexo.'
    note: 'La negociación es firme pero profesional: negativa, motivo, condición y acuerdo.'
  en.b2.unit07.lesson04.teach.q_thursday:
    title: Priya hace una propuesta
    gloss: 'Priya dice: Podemos entregar el informe el jueves si el alcance sigue como estaba previsto.'
    note: Enseguida vincula el plazo con el alcance.
  en.b2.unit07.lesson04.teach.a_tuesday:
    title: Marcus se opone
    gloss: 'Marcus dice: El jueves es demasiado tarde para el cliente. ¿Puedes entregarlo el martes?'
    note: Pide un plazo anterior sin cambiar de inmediato el alcance.
  en.b2.unit07.lesson04.teach.q_cannot_tuesday:
    title: Priya rechaza con un motivo
    gloss: 'Priya dice: No puedo aceptar el martes con el alcance completo. Eso pondría en riesgo la calidad.'
    note: El motivo hace que la negativa sea profesional y menos brusca.
  en.b2.unit07.lesson04.teach.a_what_possible:
    title: Marcus pregunta por las condiciones
    gloss: 'Marcus dice: ¿Qué haría posible el martes?'
    note: Esta pregunta abre la puerta a una concesión condicionada.
  en.b2.unit07.lesson04.teach.q_condition:
    title: Priya ofrece una condición
    gloss: 'Priya dice: Puedo aceptar el plazo anterior siempre que el alcance se reduzca al resumen ejecutivo y los gráficos.'
    note: '*on condition that* es explícito y profesional.'
  en.b2.unit07.lesson04.teach.a_accept_appendix:
    title: Marcus acepta con una condición adicional
    gloss: 'Marcus dice: Puedo aceptarlo si el anexo completo llega la semana que viene.'
    note: Acepta, pero deja fijado cuándo se entregará el resto.
  en.b2.unit07.lesson04.teach.q_agreed:
    title: Priya cierra el acuerdo
    gloss: 'Priya dice: De acuerdo. El martes para el resumen y los gráficos, y la semana que viene para el anexo.'
    note: '*Agreed* cierra la negociación de forma breve y clara.'
