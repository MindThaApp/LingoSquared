  en.a2.unit27.lesson01.teach.checking_account:
    title: checking account
    gloss: cuenta corriente
    note: '*checking account* es la cuenta corriente, la cuenta que se usa para los pagos del día a día.'
    example_gloss: Me gustaría abrir una cuenta corriente.
  en.a2.unit27.lesson01.teach.debit_card:
    title: debit card
    gloss: tarjeta de débito
    note: '*debit card* es una tarjeta con la que pagas directamente con el dinero de tu cuenta.'
    example_gloss: Pago las compras del supermercado con mi tarjeta de débito.
  en.a2.unit27.lesson01.teach.monthly_fee:
    title: monthly fee
    gloss: cuota mensual
    note: '*monthly fee* es el cargo que el banco cobra cada mes.'
