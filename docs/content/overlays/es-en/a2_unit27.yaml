  en.a2.unit27.lesson01.teach.minimum_balance:
    title: minimum balance
    gloss: saldo mínimo
    note: '*minimum balance* es la cantidad mínima que debe quedar en la cuenta.'
    example_gloss: Debe mantener un saldo mínimo de 500 dólares.
  en.a2.unit27.lesson01.teach.direct_deposit:
    title: direct deposit
    gloss: depósito directo
    note: '*direct deposit* significa que tu sueldo se deposita directamente en tu cuenta.'
    example_gloss: Mi sueldo se deposita directamente en mi cuenta.
