teaching:
  en.a1.unit04.lesson01.teach.monday:
    title: Monday
    gloss: lunes
    note: '*Monday* significa lunes; en inglés los días de la semana siempre se escriben con mayúscula, a diferencia del español.'
    example_gloss: Tengo tiempo el lunes.
  en.a1.unit04.lesson01.teach.tuesday:
    title: Tuesday
    gloss: martes
    note: '*Tuesday* significa martes.'
    example_gloss: Tengo tiempo el martes.
  en.a1.unit04.lesson01.teach.wednesday:
    title: Wednesday
    gloss: miércoles
    note: '*Wednesday* significa miércoles; la primera *d* no se pronuncia.'
    example_gloss: Tengo tiempo el miércoles.
  en.a1.unit04.lesson01.teach.thursday:
    title: Thursday
    gloss: jueves
    note: '*Thursday* significa jueves.'
    example_gloss: Tengo tiempo el jueves.
  en.a1.unit04.lesson01.teach.friday:
    title: Friday
    gloss: viernes
    note: '*Friday* significa viernes; en el calendario estadounidense es un día laborable normal, no un día libre.'
    example_gloss: Tengo tiempo el viernes.
  en.a1.unit04.lesson01.teach.saturday:
    title: Saturday
    gloss: sábado
    note: '*Saturday* significa sábado; en el calendario estadounidense forma parte del fin de semana.'
    example_gloss: Tengo tiempo el sábado.
  en.a1.unit04.lesson01.teach.sunday:
    title: Sunday
    gloss: domingo
    note: '*Sunday* significa domingo; en el calendario estadounidense la semana suele empezar en domingo, no en lunes como en España.'
    example_gloss: Tengo tiempo el domingo.
  en.a1.unit04.lesson01.teach.what_day:
    title: What day is it today?
    gloss: ¿Qué día es hoy?
    note: '*What day is it today?* pregunta por el día de la semana, no por la fecha completa.'
  en.a1.unit04.lesson02.teach.january:
    title: January
    gloss: enero
    note: '*January* es el primer mes del año.'
    example_gloss: Mi cumpleaños es en enero.
  en.a1.unit04.lesson02.teach.march:
    title: March
    gloss: marzo
    note: '*March* es el tercer mes del año.'
    example_gloss: Mi cumpleaños es en marzo.
  en.a1.unit04.lesson02.teach.july:
    title: July
    gloss: julio
    note: '*July* es el séptimo mes del año.'
    example_gloss: Mi cumpleaños es en julio.
  en.a1.unit04.lesson02.teach.september:
    title: September
    gloss: septiembre
    note: '*September* es el noveno mes del año.'
    example_gloss: Mi cumpleaños es en septiembre.
  en.a1.unit04.lesson02.teach.december:
    title: December
    gloss: diciembre
    note: '*December* es el último mes del año.'
    example_gloss: Mi cumpleaños es en diciembre.
  en.a1.unit04.lesson02.teach.which_month:
    title: Which month is it?
    gloss: ¿En qué mes estamos?
    note: '*Which month is it?* pregunta por el mes actual.'
  en.a1.unit04.lesson03.teach.whats_the_date:
    title: What's today's date?
    gloss: ¿A qué fecha estamos hoy?
    note: '*What''s today''s date?* pregunta por la fecha completa, no solo por el día de la semana.'
  en.a1.unit04.lesson03.teach.its_july_7:
    title: It's July 7th.
    gloss: Es 7 de julio.
    note: 'En inglés estadounidense el mes va ANTES que el día: *July 7th*. Es justo al revés que en español, donde primero va el día y luego el mes (7 de julio).'
  en.a1.unit04.lesson03.teach.its_tuesday_july_7:
    title: It's Tuesday, July 7th.
    gloss: Es martes, 7 de julio.
    note: 'El día de la semana va antes de la fecha completa: [día de la semana], [mes] [día].'
  en.a1.unit04.lesson03.teach.numeric_form:
    title: You can also write it as 7/7.
    gloss: También se puede escribir 7/7.
    note: 'Ojo: en la escritura numérica estadounidense el formato es mes/día (*7/7* = 7 de julio), no día/mes como en español (7/7). Esta diferencia causa confusiones reales: *7/9* significa 9 de julio, no 7 de septiembre.'
  en.a1.unit04.lesson03.teach.birthday_question:
    title: When's your birthday?
    gloss: ¿Cuándo es tu cumpleaños?
    note: '*When''s your birthday?* pregunta por la fecha de nacimiento.'
  en.a1.unit04.lesson03.teach.birthday_answer:
    title: My birthday is March 3rd.
    gloss: Mi cumpleaños es el 3 de marzo.
    note: Con el cumpleaños se usa el verbo *is*, igual que con la fecha de hoy.
  en.a1.unit04.lesson04.teach.opens:
    title: opens
    gloss: abre
    note: '*opens* es la tercera persona del singular de *open* (abrir).'
    example_gloss: La biblioteca abre el jueves.
  en.a1.unit04.lesson04.teach.again:
    title: again
    gloss: otra vez
    note: '*again* significa otra vez o de nuevo.'
    example_gloss: ¡Nos vemos pronto otra vez!
  en.a1.unit04.lesson04.teach.q_date:
    title: Daniel fragt nach dem Datum
    gloss: 'Daniel: ¿A qué fecha estamos hoy?'
    note: La misma pregunta que ya has aprendido, ahora en una conversación real.
  en.a1.unit04.lesson04.teach.a_date:
    title: Antwort zum Datum
    gloss: 'Leila: Es martes, 7 de julio.'
    note: Una respuesta completa dice tanto el día de la semana como la fecha.
  en.a1.unit04.lesson04.teach.q_library:
    title: Nach der Wiedereröffnung fragen
    gloss: 'Daniel: ¿Cuándo vuelve a abrir la biblioteca?'
    note: '*When''s the library open again?* pregunta por la fecha de reapertura.'
  en.a1.unit04.lesson04.teach.a_library:
    title: Antwort zur Wiedereröffnung
    gloss: 'Leila: Abre el jueves, 9 de julio.'
    note: '*It opens on Thursday, July 9th*; la preposición *on* va delante del día de la semana.'
  en.a1.unit04.lesson04.teach.closing:
    title: Das Gespräch beenden
    gloss: 'Daniel dice: Genial, nos vemos entonces.'
    note: '*See you then* significa que os veréis en el momento que se acaba de mencionar.'
