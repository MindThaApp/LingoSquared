  en.a1.unit02.lesson01.teach.whats_your_name:
    title: What's your name?
    gloss: ¿Cómo te llamas? / ¿Cómo se llama usted?
    note: '*What''s your name?* sirve tanto en situaciones formales como informales; a diferencia del español, no distingue entre *tú* y *usted*.'
  en.a1.unit02.lesson01.teach.my_name_is:
    title: My name is Leila.
    gloss: Me llamo Leila.
    note: La forma estándar de decir tu nombre.
  en.a1.unit02.lesson01.teach.im_leila:
    title: I'm Leila.
    gloss: Soy Leila. / Me llamo Leila.
    note: Una alternativa más corta e igual de habitual que *My name is Leila*.
  en.a1.unit02.lesson01.teach.nice_to_meet_you:
    title: Nice to meet you.
    gloss: Mucho gusto.
    note: Se dice cuando conoces a alguien por primera vez.
  en.a1.unit02.lesson02.teach.i_am_student:
    title: I am a student.
    gloss: Soy estudiante.
    note: '*a* se usa delante de profesiones o papeles en singular; en español se suele omitir el artículo aquí (*Soy estudiante*, no *Soy un estudiante*).'
  en.a1.unit02.lesson02.teach.are_you_teacher:
    title: Are you a teacher?
    gloss: ¿Eres profesor o profesora? / ¿Es usted profesor o profesora?
    note: La estructura *Are you...?* sirve en cualquier registro.
  en.a1.unit02.lesson02.teach.yes_i_am:
    title: Yes, I am.
    gloss: Sí, lo soy.
    note: Una respuesta corta y completa a preguntas como *Are you a teacher?*
  en.a1.unit02.lesson02.teach.no_im_student:
    title: No, I'm a student.
    gloss: No, soy estudiante.
    note: Una respuesta negativa que corrige la profesión o el papel.
  en.a1.unit02.lesson02.teach.are_you_member:
    title: Are you a new member?
    gloss: ¿Es usted socio nuevo?
    note: Pregunta por la condición de socio, por ejemplo en una biblioteca o en un club.
  en.a1.unit02.lesson02.teach.he_is_teacher:
    title: He is a teacher.
    gloss: Él es profesor.
    note: Tercera persona del singular, masculino.
  en.a1.unit02.lesson02.teach.she_is_engineer:
    title: She is an engineer.
    gloss: Ella es ingeniera.
    note: Tercera persona del singular, femenino; se usa *an* en lugar de *a* porque *engineer* empieza por vocal.
  en.a1.unit02.lesson03.teach.library:
    title: library
    gloss: la biblioteca
    note: Un lugar donde se pueden pedir libros prestados.
    example_gloss: Estoy en la biblioteca.
  en.a1.unit02.lesson03.teach.library_assistant:
    title: library assistant
    gloss: ayudante de biblioteca
    note: Una persona que trabaja en una biblioteca.
  en.a1.unit02.lesson03.teach.opening:
    title: Daniel eröffnet das Gespräch
    gloss: 'Daniel dice: Buenas tardes. Soy Daniel.'
    note: Un comienzo formal y amable.
  en.a1.unit02.lesson03.teach.request:
    title: Daniel fragt nach dem Namen
    gloss: 'Daniel dice: ¿Cómo se llama usted?'
    note: Viene justo después de presentarse; Daniel y Leila aún no se conocen, así que la conversación sigue en el registro formal de *usted*.
  en.a1.unit02.lesson03.teach.names:
    title: Leila antwortet
    gloss: 'Leila dice: Hola. Soy Leila. Soy estudiante. Mucho gusto.'
    note: Leila dice su nombre, su papel y la fórmula de cortesía habitual.
  en.a1.unit02.lesson03.teach.room_and_member:
    title: Daniel fragt nach der Mitgliedschaft
    gloss: 'Daniel dice: Igualmente. ¿Es usted socia nueva? Leila dice: Sí, lo soy.'
    note: Daniel devuelve la fórmula de cortesía y pregunta por la condición de socio, todavía en registro de *usted*.
  en.a1.unit02.lesson03.teach.role:
    title: Daniel nennt seinen Beruf
    gloss: 'Daniel dice: Soy ingeniero.'
    note: Delante de una profesión se usa *a* o *an* en inglés (*I'm an engineer*); en español se omite el artículo.
  en.a1.unit02.lesson03.teach.closing:
    title: Daniel und Leila schließen das Gespräch ab
    gloss: 'Daniel dice: Bienvenida a la biblioteca. Leila dice: Gracias.'
    note: Un cierre amable y educado.
