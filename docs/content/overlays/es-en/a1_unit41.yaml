  en.a1.unit41.lesson03.teach.dialogue_line1:
    title: La invitación de Mia
    gloss: 'Mia pregunta: Esta noche voy a hacer pasta. ¿Quieres ayudarme a cocinar?'
    note: '*Do you want to help me* + verbo*?* es una forma natural de invitar a alguien a ayudar.'
  en.a1.unit41.lesson03.teach.dialogue_line2:
    title: La respuesta de Daniel
    gloss: 'Daniel dice: ¡Claro! Aunque no soy muy buen cocinero.'
    note: '*though* al final de una frase añade un contraste suave, parecido a "aunque" o "eso sí" en español.'
  en.a1.unit41.lesson03.teach.dialogue_line3:
    title: El ánimo de Mia
    gloss: 'Mia dice: No pasa nada, yo te enseño. ¿Puedes picar estas cebollas?'
    note: '*I''ll show you* significa: yo te lo enseño.'
  en.a1.unit41.lesson03.teach.dialogue_line4:
    title: La pregunta de Daniel
    gloss: 'Daniel dice: Sin problema. ¿Qué tan pequeñas las pico?'
    note: '*should* sirve aquí para pedir un consejo.'
  en.a1.unit41.lesson03.teach.dialogue_line5:
    title: La explicación de Mia
    gloss: 'Mia dice: En trozos pequeños, así. Ahora hirvamos la pasta.'
    note: '*like this* significa: así, de esta manera.'
  en.a1.unit41.lesson03.teach.dialogue_line6:
    title: La respuesta de Daniel
    gloss: 'Daniel dice: ¿Puedo probar la salsa? ¡Está deliciosa!'
    note: '*Can I* + verbo*?* pide permiso.'
  en.a1.unit41.lesson03.teach.dialogue_line7:
    title: El cierre de Mia
    gloss: 'Mia dice: ¡Genial! La cena está casi lista.'
    note: '*almost ready* significa casi listo.'
  en.a1.unit41.lesson04.teach.reading_passage:
    title: Texto sobre cocinar juntos
    gloss: Daniel, Leila y Mia tienen distintas habilidades en la cocina. Desde que Leila se mudó a un apartamento nuevo cerca de Mia, los tres amigos suelen cocinar juntos. Leila cocina bien. A menudo hace pasta con la vieja receta de su madre. A Mia también le encanta cocinar, y le enseñó a Daniel a picar cebollas sin cortarse los dedos. Daniel todavía no es un gran cocinero, pero aprende rápido. Anoche Mia le pidió a Daniel que la ayudara a hacer pasta. Él picó las cebollas mientras Mia hervía la pasta y preparaba la salsa. Daniel probó la salsa y dijo que estaba deliciosa. Leila llegó justo cuando la cena estaba lista, y los tres comieron juntos en la cocina de Mia.
    note: '*arrived just as dinner was ready* significa: llegó justo cuando la cena estaba lista.'
