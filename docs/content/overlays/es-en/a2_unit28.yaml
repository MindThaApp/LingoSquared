teaching:
  en.a2.unit28.lesson01.teach.medicine:
    title: medicine
    gloss: medicamento
    note: '*medicine* significa «medicamento» o «medicina».'
    example_gloss: El médico me dio un medicamento para el dolor de cabeza.
  en.a2.unit28.lesson01.teach.prescription:
    title: prescription
    gloss: receta
    note: '*prescription* es la receta que escribe el médico.'
    example_gloss: El médico me hizo una receta para el medicamento.
  en.a2.unit28.lesson01.teach.follow_up_appointment:
    title: follow-up appointment
    gloss: cita de seguimiento
    note: '*follow-up appointment* es otra cita en la que el médico revisa cómo sigues.'
    example_gloss: Si no mejora, necesitará una cita de seguimiento.
  en.a2.unit28.lesson01.teach.getting_worse:
    title: getting worse
    gloss: empeorar
    note: '*getting worse* significa que las molestias van a peor.'
    example_gloss: Mi dolor de cabeza está empeorando, no mejorando.
  en.a2.unit28.lesson01.teach.insurance_card:
    title: insurance card
    gloss: tarjeta del seguro médico
    note: '*insurance card* es la tarjeta de tu seguro médico, que se muestra al ir a la consulta.'
    example_gloss: Traiga su tarjeta del seguro médico a la cita.
  en.a2.unit28.lesson01.teach.reused_symptoms:
    title: Molestias anteriores
    gloss: dolor de cabeza, dolor de garganta, fiebre
    note: Ya aprendiste estas palabras en la unidad 22; aquí las repasamos.
    example_gloss:
    - Tengo dolor de cabeza.
    - Tengo dolor de garganta.
    - Tengo fiebre.
  en.a2.unit28.lesson02.teach.appointment_request:
    title: Pedir una cita
    gloss: Me gustaría pedir una cita con el médico.
    note: Con *I'd like to...* pides una cita con cortesía.
  en.a2.unit28.lesson02.teach.symptom_duration:
    title: Decir desde cuándo tienes molestias
    gloss: Tengo dolor de cabeza y de garganta desde hace tres días, y está empeorando.
    note: 'Para algo que dura desde hace un tiempo, el inglés usa el *present perfect* (*I''ve had ... for three days*). En español se usa el presente con «desde hace»: «Tengo dolor de cabeza desde hace tres días».'
  en.a2.unit28.lesson03.teach.arrive_early:
    title: arrive ten minutes early
    gloss: llegar diez minutos antes
    note: '*arrive ten minutes early* significa llegar diez minutos antes de la cita.'
    example_gloss: Llegue diez minutos antes de su cita, por favor.
  en.a2.unit28.lesson03.teach.confirmation_text:
    title: Texto de la confirmación
    gloss: Su cita está confirmada para hoy a las 3 de la tarde. Traiga su tarjeta del seguro médico y llegue diez minutos antes. El número de confirmación es 7724.
    note: Es una confirmación formal con la hora, lo que debe hacer y un número.
  en.a2.unit28.lesson04.teach.i_see:
    title: I see.
    gloss: Entiendo.
    note: Con *I see* muestras que entendiste algo.
  en.a2.unit28.lesson04.teach.q_whats_wrong:
    title: Preguntar qué pasa
    gloss: 'El médico pregunta: ¿Qué le pasa?'
    note: Es la misma pregunta que hizo Leila en la unidad 22, ahora hecha por el médico.
  en.a2.unit28.lesson04.teach.a_symptoms_duration:
    title: Respuesta de Daniel sobre las molestias
    gloss: 'Daniel dice: Tengo dolor de cabeza y de garganta desde hace tres días, y está empeorando.'
    note: Es la misma frase de la lección 2.
  en.a2.unit28.lesson04.teach.a_bad_cold:
    title: El diagnóstico del médico
    gloss: 'El médico dice: Entiendo. Tiene un resfriado fuerte.'
    note: Es un diagnóstico sencillo y cotidiano, nada grave.
  en.a2.unit28.lesson04.teach.q_medicine:
    title: Preguntar por medicamentos
    gloss: 'Daniel pregunta: ¿Debo tomar algún medicamento?'
    note: Daniel pregunta por el tratamiento después de oír el diagnóstico.
  en.a2.unit28.lesson04.teach.a_medicine_instructions:
    title: Indicaciones sobre el medicamento
    gloss: 'El médico dice: Sí, tome este medicamento dos veces al día durante cinco días y beba mucha agua.'
    note: 'Es una indicación precisa: dos veces al día, durante cinco días.'
  en.a2.unit28.lesson04.teach.q_follow_up:
    title: Preguntar por una cita de seguimiento
    gloss: 'Daniel pregunta: ¿Debo volver si no mejoro?'
    note: Daniel usa la misma condición (*if it doesn't get better*) que Leila usó en la unidad 22.
  en.a2.unit28.lesson04.teach.a_followup_appointment:
    title: Respuesta del médico sobre la cita de seguimiento
    gloss: 'El médico dice: Sí, si no mejora en una semana, vuelva para una cita de seguimiento.'
    note: 'El médico dice exactamente cuándo debe volver Daniel: si en una semana no ha mejorado.'
