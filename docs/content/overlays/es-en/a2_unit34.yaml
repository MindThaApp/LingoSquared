  en.a2.unit34.lesson01.teach.return_policy:
    title: return policy
    gloss: política de devoluciones
    note: '*return policy* son las reglas de una tienda sobre cómo se pueden devolver los artículos.'
    example_gloss: Según la política de devoluciones de la tienda, tiene 30 días.
  en.a2.unit34.lesson01.teach.defective:
    title: defective
    gloss: defectuoso
    note: '*defective* significa roto o que no funciona bien.'
    example_gloss: La licuadora estaba defectuosa, así que la devolví.
  en.a2.unit34.lesson02.teach.return_blender_stopped_working:
    title: Einen defekten Artikel zurückbringen
    gloss: Quisiera devolver esta licuadora. Dejó de funcionar después de usarla una vez.
    note: '*I''d like to return...* es una forma educada de devolver un artículo.'
  en.a2.unit34.lesson02.teach.refund_or_exchange_question:
    title: Die Verkäuferin bietet eine Wahl an
    gloss: ¿Desea un reembolso o un cambio?
    note: Con *Would you like...or...?* ofreces una opción entre dos.
  en.a2.unit34.lesson02.teach.id_like_a_refund:
    title: um eine Rückerstattung bitten
    gloss: Quisiera un reembolso, por favor.
    note: '*I''d like..., please* es una forma educada de pedir algo.'
  en.a2.unit34.lesson03.teach.within_30_days:
    title: sagen, innerhalb welcher Frist man zurückgeben kann
    gloss: Los artículos se pueden devolver dentro de 30 días con el recibo.
    note: '*within 30 days* significa dentro de un plazo de 30 días.'
  en.a2.unit34.lesson03.teach.policy_text:
    title: Text einer Rückgaberegelung
    gloss: 'Política de devoluciones: los artículos se pueden devolver dentro de 30 días con el recibo. Los artículos defectuosos se pueden cambiar o reembolsar en cualquier momento.'
    note: Una política de devoluciones formal, con un plazo y una excepción para los artículos defectuosos.
  en.a2.unit34.lesson03.teach.i_have_my_receipt:
    title: sagen, dass man seinen Kassenbon hat
    gloss: Tengo mi recibo de la semana pasada.
    note: '*from last week* significa «de la semana pasada».'
  en.a2.unit34.lesson04.teach.q_return_blender:
    title: Leila bringt den Mixer zurück
    gloss: 'Leila dice: Hola, quisiera devolver esta licuadora. Dejó de funcionar después de usarla una vez.'
    note: Son las mismas frases de la lección 2, ahora con un saludo.
  en.a2.unit34.lesson04.teach.a_sorry_do_you_have_receipt:
    title: Der Verkäufer fragt nach dem Kassenbon
    gloss: 'El vendedor dice: Lamento oír eso. ¿Trae su recibo?'
    note: '*I''m sorry to hear that* es una forma educada de mostrar compasión.'
  en.a2.unit34.lesson04.teach.q_yes_bought_last_week:
    title: Leila bestätigt den Kauf
    gloss: 'Leila dice: Sí, aquí está. La compré la semana pasada.'
    note: Leila entrega el recibo y dice cuándo compró la licuadora.
  en.a2.unit34.lesson04.teach.a_refund_or_exchange:
    title: Der Verkäufer bietet eine Wahl an
    gloss: 'El vendedor dice: Gracias. ¿Desea un reembolso o un cambio?'
    note: Es la misma pregunta que aprendimos en la lección 2.
  en.a2.unit34.lesson04.teach.q_id_like_a_refund:
    title: Leila entscheidet sich für die Rückerstattung
    gloss: 'Leila dice: Quisiera un reembolso, por favor.'
    note: Es la misma frase que aprendimos en la lección 2.
  en.a2.unit34.lesson04.teach.a_refund_thirty_five:
    title: Der Verkäufer zahlt das Geld zurück
    gloss: 'El vendedor dice: No hay problema. Aquí tiene su reembolso de treinta y cinco dólares.'
    note: El vendedor resuelve el reclamo y dice la cantidad exacta.
