    example_gloss: ¿Puedes confirmar la hora?
  en.a1.unit47.lesson01.teach.reschedule:
    title: reschedule
    gloss: reprogramar
    note: '*reschedule* significa cambiar una cita a otro día u hora.'
    example_gloss: ¿Podemos cambiarla para el viernes?
  en.a1.unit47.lesson02.teach.id_like_to_make_an_appointment:
    title: I'd like to make an appointment.
    gloss: Quisiera pedir una cita.
    note: '*I''d* es la contracción de I would; equivale a "quisiera" o "me gustaría" y es más cortés que *I want*.'
  en.a1.unit47.lesson02.teach.are_you_available_on_friday:
    title: Are you available on Friday?
    gloss: ¿Estás libre el viernes?
    note: '*on Friday* lleva siempre la preposición *on* con un día de la semana; en español basta el artículo ("el viernes").'
  en.a1.unit47.lesson02.teach.what_time_works_for_you:
    title: What time works for you?
    gloss: ¿Qué hora te viene bien?
    note: '*works for you* significa aquí "te viene bien": es una expresión fija, no el verbo trabajar.'
  en.a1.unit47.lesson02.teach.that_time_works_for_me:
    title: That time works for me.
    gloss: Esa hora me viene bien.
    note: '*That time works for me.* significa esa hora me viene bien.'
  en.a1.unit47.lesson02.teach.can_we_reschedule_for_monday:
    title: Can we reschedule for Monday?
    gloss: ¿Podemos cambiarla para el lunes?
    note: '*reschedule for ...* usa *for*, no *to*, para indicar la nueva fecha.'
  en.a1.unit47.lesson02.teach.your_appointment_is_confirmed:
    title: Your appointment is confirmed.
    gloss: Su cita está confirmada.
    note: '*Your appointment is confirmed.* significa su cita está confirmada.'
  en.a1.unit47.lesson03.teach.dialogue_line1:
    title: La pregunta de Mia
    gloss: 'Mia pregunta: Leila, ¿Max está bien? Últimamente parece un poco cansado.'
    note: '*He seems a little tired lately.* significa últimamente parece un poco cansado.'
  en.a1.unit47.lesson03.teach.dialogue_line2:
    title: La explicación de Leila
    gloss: 'Leila dice: Está bien, no te preocupes. Solo le toca su revisión anual. Tengo que llamar al veterinario.'
    note: '*due for* significa que toca algo: ya es el momento de hacerlo.'
  en.a1.unit47.lesson03.teach.dialogue_line3:
    title: Leila llama al veterinario
    gloss: 'Leila dice: Hola, quisiera pedir una cita para la revisión de mi perro.'
    note: '*I''d like to* es más cortés que *I want to*; en español equivale a "quisiera" o "me gustaría".'
  en.a1.unit47.lesson03.teach.dialogue_line4:
    title: La pregunta de Mia
    gloss: 'Mia pregunta: ¿Qué dijeron?'
    note: '*did they say* usa *did* como auxiliar en el pasado.'
  en.a1.unit47.lesson03.teach.dialogue_line5:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Tienen disponibilidad el jueves a las tres de la tarde.'
    note: '*at 3pm* usa *at* para una hora concreta.'
  en.a1.unit47.lesson03.teach.dialogue_line6:
    title: La pregunta de confirmación de Mia
    gloss: 'Mia pregunta: ¿Te viene bien esa hora?'
    note: '*Does that time work for you?* es la forma interrogativa de that time works for you, con el auxiliar *does*, como en otras preguntas.'
  en.a1.unit47.lesson03.teach.dialogue_line7:
    title: La confirmación de Leila
    gloss: 'Leila dice: Sí, me viene bien. El jueves a las tres, ¡gracias! La cita de Max está confirmada.'
    note: '*Max''s appointment* usa el posesivo ''s; en español se dice "la cita de Max", con la preposición "de".'
  en.a1.unit47.lesson04.teach.reading_passage:
    title: Texto sobre cómo pedir una cita
    gloss: 'Cómo pedir una cita: si necesitas ver a un médico, a un dentista o a otro servicio, normalmente tienes que pedir una cita antes. Llama y di que quisieras pedir una cita. El recepcionista te dirá qué días y horas están disponibles. Elige una hora que te venga bien y confirmarán tu cita. Si algo cambia, vuelve a llamar y pide cambiarla. La semana pasada, Leila llamó al veterinario para pedir una cita para la revisión anual de su perro Max. Tenían disponibilidad el jueves a las tres de la tarde, y Leila confirmó la hora. Daniel también tiene una cita: va al dentista el lunes por la mañana para una revisión. Dijo que no está nervioso, solo un poco ocupado esta semana.'
    note: '*a little busy this week* significa un poco ocupado esta semana.'
