teaching:
  en.a1.unit42.lesson01.teach.friendly:
    title: friendly
    gloss: amable / simpático
    note: '*friendly* significa amable y fácil de tratar.'
    example_gloss: Mi vecino es muy amable.
  en.a1.unit42.lesson01.teach.funny:
    title: funny
    gloss: gracioso / divertido
    note: '*funny* significa gracioso: alguien que hace reír a los demás.'
    example_gloss: Mi hermano es muy gracioso.
  en.a1.unit42.lesson01.teach.hardworking:
    title: hardworking
    gloss: trabajador
    note: '*hardworking* significa trabajador: alguien que no se rinde fácilmente.'
    example_gloss: Ella es una empleada muy trabajadora.
  en.a1.unit42.lesson01.teach.shy:
    title: shy
    gloss: tímido
    note: '*shy* significa tímido o nervioso con gente nueva.'
    example_gloss: Al principio es un poco tímido.
  en.a1.unit42.lesson01.teach.calm:
    title: calm
    gloss: tranquilo / sereno
    note: '*calm* significa tranquilo: alguien que no se altera ni se pone nervioso fácilmente.'
    example_gloss: Mi madre es muy tranquila.
  en.a1.unit42.lesson01.teach.talkative:
    title: talkative
    gloss: hablador / conversador
    note: '*talkative* significa hablador: alguien que habla mucho.'
    example_gloss: Mi hermana es muy habladora.
  en.a1.unit42.lesson02.teach.a_little_shy:
    title: a little shy
    gloss: un poco tímido
    note: '*a little* significa aquí un poco (cantidad), no pequeño (tamaño); no lo traduzcas literalmente como "pequeño tímido".'
    example_gloss: Al principio es un poco tímido, pero enseguida se suelta.
  en.a1.unit42.lesson02.teach.very_hardworking:
    title: very hardworking
    gloss: muy trabajador
    note: '*very hardworking* significa muy trabajador.'
    example_gloss: Mi compañero de trabajo es muy trabajador.
  en.a1.unit42.lesson02.teach.have_a_great_sense_of_humor:
    title: have a great sense of humor
    gloss: tener un gran sentido del humor
    note: '*have a great sense of humor* significa tener un gran sentido del humor.'
    example_gloss: Daniel tiene un gran sentido del humor.
  en.a1.unit42.lesson02.teach.get_along_with_everyone:
    title: get along with everyone
    gloss: llevarse bien con todos
    note: '*get along with everyone* significa llevarse bien con todos.'
    example_gloss: Mia se lleva bien con todos en el trabajo.
  en.a1.unit42.lesson02.teach.warm_up_quickly:
    title: warm up quickly
    gloss: coger confianza rápido / soltarse pronto
    note: '*warm up quickly* significa coger confianza pronto con gente nueva.'
    example_gloss: Es tímido, pero se suelta enseguida en cuanto te conoce.
  en.a1.unit42.lesson02.teach.whats_he_like_question:
    title: What's he like?
    gloss: ¿Cómo es él?
    note: '*What''s he like?* pregunta por el carácter de alguien, no por su aspecto físico.'
  en.a1.unit42.lesson03.teach.dialogue_line1:
    title: La pregunta de Mia
    gloss: 'Mia pregunta: La semana que viene empiezo un proyecto nuevo con Daniel. ¿Cómo es?'
    note: '*What''s he like?* pregunta por el carácter de alguien.'
  en.a1.unit42.lesson03.teach.dialogue_line2:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Es muy amable, y además es muy gracioso.'
    note: '*and he''s really funny too* significa: y además es muy gracioso.'
  en.a1.unit42.lesson03.teach.dialogue_line3:
    title: La pregunta de Mia
    gloss: 'Mia dice: ¡Qué bien! ¿Es fácil trabajar con él?'
    note: '*Is he easy to work with?* pregunta si es agradable trabajar con alguien.'
  en.a1.unit42.lesson03.teach.dialogue_line4:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Sí, también es muy trabajador. Siempre termina sus tareas a tiempo.'
    note: '*finishes his tasks on time* significa: termina sus tareas a tiempo.'
  en.a1.unit42.lesson03.teach.dialogue_line5:
    title: La pregunta de Mia
    gloss: 'Mia pregunta: ¿Alguna vez es tímido en las reuniones?'
    note: '*ever* significa aquí: alguna vez.'
  en.a1.unit42.lesson03.teach.dialogue_line6:
    title: "Respuesta de Leila"
    gloss: 'Leila dice: Un poco, pero se siente más cómodo en cuanto te conoce.'
    note: '*once he knows you* significa: en cuanto te conoce.'
  en.a1.unit42.lesson03.teach.dialogue_line7:
    title: El agradecimiento de Mia
    gloss: 'Mia dice: Gracias, Leila. Ahora me siento mucho más tranquila con el proyecto.'
    note: '*I feel more relaxed* significa: me siento más tranquila, más relajada.'
  en.a1.unit42.lesson04.teach.reading_passage:
    title: Texto sobre tres personalidades
    gloss: 'Daniel, Leila y Mia son buenos amigos, pero tienen personalidades muy distintas. Daniel es amable y gracioso: siempre hace reír a sus amigos. Es un poco tímido cuando conoce a gente nueva, pero enseguida se suelta. Leila es tranquila y creativa. Le encanta pintar porque la ayuda a relajarse, y rara vez se enfada por nada. Mia es sociable y organizada. Le gusta hacer planes para el grupo y es muy paciente cuando enseña algo nuevo a sus amigos: le enseñó a cocinar a Daniel. Aunque son todos diferentes, se llevan bien y disfrutan pasando tiempo juntos.'
    note: '*even though* significa: aunque, a pesar de que.'
