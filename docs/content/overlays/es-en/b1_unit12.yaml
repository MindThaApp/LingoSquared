teaching:
  en.b1.unit12.lesson01.teach.although:
    title: although
    gloss: aunque
    note: '*although* introduce, con una oración completa, un contraste dentro de la misma frase.'
    example_gloss: Aunque la oficina es tranquila, Mia prefiere trabajar desde casa.
  en.b1.unit12.lesson01.teach.even_though:
    title: even though
    gloss: aun cuando, a pesar de que
    note: '*even though* destaca el contraste con más fuerza que *although*.'
    example_gloss: Leila se mantiene concentrada aunque su departamento es pequeño.
  en.b1.unit12.lesson01.teach.despite:
    title: despite
    gloss: a pesar de
    note: Después de *despite* va un sustantivo o una forma en -ing, no una oración completa.
    example_gloss: A pesar de las distracciones, Daniel termina su informe a tiempo.
  en.b1.unit12.lesson01.teach.however:
    title: however
    gloss: sin embargo, no obstante
    note: '*however* empieza una oración nueva, después de un punto o un punto y coma.'
    example_gloss: La oficina es tranquila. Sin embargo, Mia prefiere trabajar desde casa.
  en.b1.unit12.lesson01.teach.valid_point:
    title: valid point
    gloss: buen argumento, punto válido
    note: '*valid point* es un argumento razonable o convincente.'
    example_gloss: Es un buen argumento en cuanto a la concentración.
  en.b1.unit12.lesson01.teach.convince:
    title: convince
    gloss: convencer
    note: '*convince* significa lograr que alguien crea o acepte algo.'
    example_gloss: Leila intentó convencer a Mia de volver a la oficina.
  en.b1.unit12.lesson02.teach.office_quiet_home:
    title: although + oración subordinada completa
    gloss: Aunque la oficina es tranquila, Mia prefiere trabajar desde casa.
    note: '*although* + sujeto + verbo forma una oración completa de contraste.'
  en.b1.unit12.lesson02.teach.distractions_report:
    title: despite + sustantivo
    gloss: A pesar de las distracciones, Daniel termina su informe a tiempo.
    note: Después de *despite* va un sustantivo, no una oración completa.
  en.b1.unit12.lesson02.teach.grammar_concession:
    title: although, despite y however
    gloss: 'Although y even though introducen una oración completa: Although the office is quiet, Mia prefers home. Despite va seguido de un sustantivo o una forma en -ing, no de una oración: Despite the distractions, Daniel finishes his report. However empieza una oración nueva después de un punto o un punto y coma: The office is quiet. However, Mia prefers home.'
    note: 'Forma: *although/even though* + oración; *despite* + sustantivo o forma en -ing; *however* como adverbio de oración después de un punto. En español, «a pesar de» también admite un sustantivo o un infinitivo («a pesar de la lluvia», «a pesar de llover»), mientras que «aunque» introduce una oración con verbo.'
  en.b1.unit12.lesson03.teach.flexibility:
    title: flexibility
    gloss: flexibilidad
    note: '*flexibility* es la capacidad de cambiar con facilidad los planes o la forma de trabajar.'
    example_gloss: Mia y Leila coinciden en que la flexibilidad es importante.
  en.b1.unit12.lesson03.teach.teamwork:
    title: teamwork
    gloss: trabajo en equipo
    note: '*teamwork* significa trabajar juntos como equipo.'
    example_gloss: Leila piensa que la oficina favorece mejor el trabajo en equipo.
  en.b1.unit12.lesson03.teach.reading_passage:
    title: 'Lectura: dónde se trabaja'
    gloss: Mia y Leila no están de acuerdo sobre dónde trabajar. Mia trabaja en casa porque es cómodo. Aunque extraña ver a sus compañeros, rinde más en casa. Leila prefiere la oficina. A pesar del ruido, le gusta conversar con sus colegas en los descansos. Aunque Mia tiene un buen argumento sobre la concentración, Leila sigue pensando que la oficina favorece mejor el trabajo en equipo. Sin embargo, las dos coinciden en que la flexibilidad es importante.
    note: Una lectura breve con contrastes.
  en.b1.unit12.lesson04.teach.q_although_nice_home:
    title: Mia introduce el contraste
    gloss: 'Mia dice: Leila, aunque la oficina es agradable, en casa rindo más.'
    note: '*although* + oración completa al inicio de la frase.'
  en.b1.unit12.lesson04.teach.a_despite_noise_breaks:
    title: Leila da su punto de vista
    gloss: 'Leila dice: Te entiendo, pero a pesar del ruido, disfruto mucho conversando con la gente en los descansos.'
    note: '*despite* + sustantivo (*the noise*).'
  en.b1.unit12.lesson04.teach.q_valid_point_however:
    title: Mia reconoce el punto, pero mantiene su opinión
    gloss: 'Mia dice: Es un buen argumento. Sin embargo, sigo pensando que me concentro mejor sola.'
    note: Aquí *however* empieza una oración nueva después de un punto.
  en.b1.unit12.lesson04.teach.a_even_though_convince:
    title: Leila le toma el pelo a Mia
    gloss: 'Leila dice: Aunque prefiero la oficina, no puedo convencerte de que cambies de opinión, ¿verdad?'
    note: '*even though* destaca el contraste.'
  en.b1.unit12.lesson04.teach.q_however_flexibility:
    title: Mia encuentra un compromiso
    gloss: 'Mia dice: ¡Probablemente no! Sin embargo, podemos coincidir en que lo más importante es la flexibilidad.'
    note: '*however* une dos ideas opuestas en una oración nueva.'
  en.b1.unit12.lesson04.teach.a_despite_preferences_time:
    title: Leila termina la conversación con buen ánimo
    gloss: 'Leila dice: A pesar de nuestras distintas preferencias, terminamos todo a tiempo.'
    note: '*despite* + sustantivo (*our different preferences*).'
