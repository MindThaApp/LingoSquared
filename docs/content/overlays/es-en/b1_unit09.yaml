teaching:
  en.b1.unit09.lesson01.teach.said_that:
    title: said that
    gloss: dijo que
    note: '*said that* se usa para contar lo que dijo otra persona.'
    example_gloss: Dijo que estaba ocupada.
  en.b1.unit09.lesson01.teach.told_me_that:
    title: told me that
    gloss: me dijo que
    note: '*told me that* se usa cuando alguien te dio una información a ti.'
    example_gloss: Me dijo que la reunión se había cancelado.
  en.b1.unit09.lesson01.teach.asked_whether:
    title: asked whether
    gloss: preguntó si
    note: '*asked whether* reproduce una pregunta de sí o no y suena algo más formal que *asked if*.'
    example_gloss: Mia preguntó si necesitábamos ayuda.
  en.b1.unit09.lesson01.teach.asked_if:
    title: asked if
    gloss: preguntó si
    note: '*asked if* reproduce una pregunta de sí o no en el habla cotidiana.'
    example_gloss: Mia preguntó si necesitábamos ayuda.
  en.b1.unit09.lesson01.teach.message:
    title: message
    gloss: mensaje
    note: '*message* es un aviso breve, escrito o hablado.'
    example_gloss: Leila mandó un mensaje después del almuerzo.
  en.b1.unit09.lesson01.teach.confirm:
    title: confirm
    gloss: confirmar
    note: '*confirm* significa decir que algo es seguro o correcto.'
    example_gloss: Por favor, confirma la hora antes de salir.
  en.b1.unit09.lesson01.teach.available:
    title: available
    gloss: disponible, tener tiempo
    note: '*available* significa libre o en condiciones de reunirse.'
    example_gloss: Mia está disponible después del almuerzo.
  en.b1.unit09.lesson02.teach.mia_available:
    title: Reproducir lo que alguien dijo
    gloss: Mia dijo que estaba disponible después del almuerzo.
    note: 'En el estilo indirecto, *is* suele pasar a *was*: *Mia said that she was available*. Pasa algo parecido en español: «Mia dijo que estaba disponible» (no «está»). Fíjate en que en inglés no hay subjuntivo: basta el pasado simple.'
  en.b1.unit09.lesson02.teach.leila_told_me:
    title: Transmitirle información
    gloss: Leila me dijo que en la oficina había mucho trabajo.
    note: '*told me that* se usa cuando alguien te dio la información directamente a ti.'
  en.b1.unit09.lesson02.teach.grammar_backshift:
    title: Estilo directo e indirecto
    gloss: 'Mia dice: «Estoy disponible». Mia dijo que estaba disponible.'
    note: 'Directo: *I am available*. Indirecto: *Mia said that she was available*. En el estilo indirecto, lo que se dijo suele retroceder un tiempo verbal.'
  en.b1.unit09.lesson03.teach.short_summary:
    title: short summary
    gloss: resumen breve
    note: '*short summary* es una versión corta con solo los puntos principales.'
    example_gloss: Un resumen breve es suficiente para la reunión de hoy.
  en.b1.unit09.lesson03.teach.full_report:
    title: full report
    gloss: informe completo
    note: '*full report* es el informe entero, no solo la versión corta.'
    example_gloss: Mia preguntó si necesitábamos el informe completo.
  en.b1.unit09.lesson03.teach.reading_passage:
    title: 'Lectura: el historial del chat'
    gloss: Leila leyó el mensaje de Mia y llamó a Daniel. Le dijo que Mia estaba disponible después del almuerzo. También dijo que Mia había terminado las cifras. Mia preguntó si el equipo necesitaba hoy el informe completo. Daniel le dijo a Leila que un resumen breve era suficiente, porque la reunión duraba solo quince minutos.
    note: Una lectura breve sobre cómo contar lo que alguien dijo o preguntó.
  en.b1.unit09.lesson04.teach.q_mia_reply:
    title: Daniel pregunta por la respuesta de Mia
    gloss: 'Daniel dice: ¿Mia respondió sobre la revisión?'
    note: Una pregunta de sí o no sobre un mensaje anterior.
  en.b1.unit09.lesson04.teach.a_she_said_available:
    title: Leila reproduce lo que dijo Mia
    gloss: 'Leila dice: Sí, dijo que estaba disponible después del almuerzo.'
    note: '*she said that she was available* reproduce lo que dijo Mia.'
  en.b1.unit09.lesson04.teach.q_anything_else:
    title: Daniel sigue preguntando
    gloss: 'Daniel dice: Muy bien. ¿Preguntó algo más?'
    note: Una pregunta para saber si el mensaje incluía otra pregunta.
  en.b1.unit09.lesson04.teach.a_asked_if_report:
    title: Leila reproduce la pregunta de Mia
    gloss: 'Leila dice: Preguntó si necesitamos hoy el informe completo.'
    note: '*asked if* convierte una pregunta directa de sí o no en estilo indirecto.'
  en.b1.unit09.lesson04.teach.q_what_tell_her:
    title: Daniel pregunta por la respuesta de Leila
    gloss: 'Daniel dice: ¿Y qué le dijiste?'
    note: Una pregunta sobre la información que Leila transmitió.
  en.b1.unit09.lesson04.teach.a_short_summary_enough:
    title: Leila reproduce su respuesta
    gloss: 'Leila dice: Le dije que un resumen breve era suficiente.'
    note: '*I told her that...* cuenta una información que tú le diste a otra persona.'
  en.b1.unit09.lesson04.teach.q_tell_team:
    title: Daniel termina el chat
    gloss: 'Daniel dice: Perfecto. Le diré al equipo que podemos reunirnos a las dos.'
    note: Daniel vuelve a usar *tell ... that* para transmitir información.
