teaching:
  en.a1.unit39.lesson01.teach.neighborhood:
    title: neighborhood
    gloss: barrio
    note: '*neighborhood* significa barrio: la zona alrededor de tu casa, con las calles y los edificios cercanos.'
    example_gloss: Me encanta mi barrio.
  en.a1.unit39.lesson01.teach.neighbor:
    title: neighbor
    gloss: vecino / vecina
    note: '*neighbor* significa vecino: alguien que vive junto a ti o cerca de ti.'
    example_gloss: Mi vecino es muy servicial.
  en.a1.unit39.lesson01.teach.nearby:
    title: nearby
    gloss: cerca / por aquí cerca
    note: '*nearby* significa cerca.'
    example_gloss: Hay un parque cerca.
  en.a1.unit39.lesson01.teach.quiet:
    title: quiet
    gloss: tranquilo / silencioso
    note: '*quiet* significa tranquilo, sin mucho ruido.'
    example_gloss: Mi calle es muy tranquila por la noche.
  en.a1.unit39.lesson01.teach.noisy:
    title: noisy
    gloss: ruidoso
    note: '*noisy* significa lleno de ruidos fuertes.'
    example_gloss: La calle de al lado de la mía es ruidosa.
  en.a1.unit39.lesson01.teach.friendly:
    title: friendly
    gloss: amable / simpático
    note: '*friendly* significa amable o simpático.'
    example_gloss: Mis vecinos son muy amables.
  en.a1.unit39.lesson02.teach.live_in_a_neighborhood:
    title: live in a neighborhood
    gloss: vivir en un barrio
    note: '*live in a neighborhood* significa vivir en un barrio.'
    example_gloss: Vivo en un barrio tranquilo.
  en.a1.unit39.lesson02.teach.get_along_with_your_neighbors:
    title: get along with your neighbors
    gloss: llevarse bien con tus vecinos
    note: '*get along with your neighbors* significa tener una relación buena y amistosa con las personas que viven cerca de ti.'
    example_gloss: Me llevo bien con mis vecinos.
  en.a1.unit39.lesson02.teach.close_to:
    title: close to
    gloss: cerca de
    note: '*close to* significa cerca de (un lugar).'
    example_gloss: Mi apartamento está cerca de un supermercado.
  en.a1.unit39.lesson02.teach.a_five_minute_walk:
    title: a five-minute walk
    gloss: cinco minutos andando
    note: '*a five-minute walk* es un patrón fijo del inglés: número + sustantivo unidos con guion, y el sustantivo va en singular (*five-minute*, nunca *five-minutes*). En español solemos decir "a cinco minutos andando" o "un paseo de cinco minutos".'
    example_gloss: El parque está a cinco minutos andando de mi casa.
  en.a1.unit39.lesson02.teach.say_hello_to:
    title: say hello to
    gloss: saludar a
    note: '*say hello to* significa saludar a alguien.'
    example_gloss: Siempre saludo a mi vecino por la mañana.
  en.a1.unit39.lesson02.teach.whats_your_neighborhood_like_question:
    title: What's your neighborhood like?
    gloss: ¿Cómo es tu barrio?
    note: '*What''s ... like?* pide una descripción, no una preferencia.'
  en.a1.unit39.lesson03.teach.dialogue_line1:
    title: La pregunta de Leila
    gloss: 'Leila dice: Puede que me mude pronto. ¿Cómo es tu barrio, Mia?'
    note: '*might* + verbo expresa una posibilidad: quizá sí, quizá no.'
  en.a1.unit39.lesson03.teach.dialogue_line2:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Me gusta mucho. Es tranquilo y hay un parque cerca.'
    note: '*there''s a park nearby* significa hay un parque cerca.'
  en.a1.unit39.lesson03.teach.dialogue_line3:
    title: La pregunta de Leila
    gloss: 'Leila dice: Qué bien suena. ¿Está cerca de un supermercado?'
    note: '*That sounds nice* es una reacción natural ante buenas noticias.'
  en.a1.unit39.lesson03.teach.dialogue_line4:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: Sí, hay uno a solo cinco minutos andando de mi edificio.'
    note: '*just* significa aquí solo o apenas: subraya lo corta que es la distancia.'
  en.a1.unit39.lesson03.teach.dialogue_line5:
    title: La pregunta de Leila
    gloss: 'Leila pregunta: ¿Y tus vecinos? ¿Son amables?'
    note: '*What about ...?* es una forma natural de introducir un tema nuevo.'
  en.a1.unit39.lesson03.teach.dialogue_line6:
    title: "Respuesta de Mia"
    gloss: 'Mia dice: ¡Muy amables! Mi vecino, el señor López, riega mis plantas cuando estoy fuera.'
    note: '*waters my plants* significa riega mis plantas; en inglés *water* es aquí un verbo.'
  en.a1.unit39.lesson03.teach.dialogue_line7:
    title: La reacción de Leila
    gloss: 'Leila dice: Qué detalle. ¡Creo que me gustaría vivir cerca de ti!'
    note: '*I''d like to* + verbo significa: me gustaría + verbo.'
  en.a1.unit39.lesson04.teach.reading_passage:
    title: Texto sobre tres barrios
    gloss: Daniel, Leila y Mia viven los tres en barrios distintos. El barrio de Daniel es animado, con restaurantes y tiendas cerca de su edificio de apartamentos. Conoce a varios de sus vecinos y a menudo los saluda en el pasillo. Leila vive en un barrio tranquilo, cerca de la piscina donde nada. Su vecina de enfrente tiene un perro grande que ladra mucho. El barrio de Mia también es tranquilo, con un supermercado a solo cinco minutos andando de su edificio. Su vecino, el señor López, es muy amable y riega sus plantas cuando ella está fuera. Después de hablar con Mia, Leila decidió que quiere buscar un apartamento cerca de ella.
    note: '*decided she wants to look for* significa: decidió que quiere buscar un apartamento.'
