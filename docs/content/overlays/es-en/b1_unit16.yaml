teaching:
  en.b1.unit16.lesson01.teach.advice:
    title: advice
    gloss: consejo
    note: '*advice* es una opinión sobre lo que alguien debería hacer.'
    example_gloss: Leila le dio a Daniel un consejo útil.
  en.b1.unit16.lesson01.teach.suggest:
    title: suggest
    gloss: sugerir, proponer
    note: '*suggest* significa proponer una idea para que alguien la considere.'
    example_gloss: Leila sugirió una forma de manejar su carga de trabajo.
  en.b1.unit16.lesson01.teach.overwhelmed:
    title: overwhelmed
    gloss: abrumado
    note: '*overwhelmed* describe la sensación de tener más por hacer de lo que puedes manejar.'
    example_gloss: Daniel se sentía abrumado por sus dos proyectos.
  en.b1.unit16.lesson01.teach.prioritize:
    title: prioritize
    gloss: priorizar, establecer prioridades
    note: '*prioritize* significa ocuparse primero de la tarea más importante.'
    example_gloss: Daniel decidió priorizar el proyecto con la fecha límite más cercana.
  en.b1.unit16.lesson01.teach.workload:
    title: workload
    gloss: carga de trabajo
    note: '*workload* es la cantidad total de trabajo que tiene que hacer una persona.'
    example_gloss: La carga de trabajo de Daniel aumentó cuando entró al equipo en marzo.
  en.b1.unit16.lesson01.teach.decline:
    title: decline
    gloss: rechazar, declinar
    note: '*decline* significa rechazar con cortesía una propuesta o una oferta.'
    example_gloss: Daniel podía aceptar el consejo o declinarlo con cortesía.
  en.b1.unit16.lesson02.teach.if_i_were_you:
    title: if I were you, I would + Grundform
    gloss: Si yo fuera tú, hablaría con tu jefe.
    note: '*if I were you, I would* es la forma hipotética que se usa para dar un consejo. En español se dice igual con «si yo fuera tú».'
  en.b1.unit16.lesson02.teach.you_should_prioritize:
    title: you should + Grundform
    gloss: Deberías priorizar el proyecto con la fecha límite más cercana.
    note: '*you should* es una recomendación directa.'
  en.b1.unit16.lesson02.teach.how_about:
    title: how about + -ing
    gloss: ¿Qué tal si le pides ayuda a un compañero?
    note: '*how about + -ing* es una forma más suave de hacer una sugerencia.'
  en.b1.unit16.lesson02.teach.grammar_advice_forms:
    title: Formen, um Rat zu geben
    gloss: 'Para dar consejos y sugerencias hay varias formas: If I were you, I would... (una hipótesis irreal), You should... (una recomendación directa) y How about + -ing...? (una sugerencia más suave). Elige una forma más fuerte o más suave según lo seguro que quieras sonar.'
    note: 'Forma: elige entre una hipótesis irreal, una recomendación directa o una sugerencia suave.'
  en.b1.unit16.lesson03.teach.deadline:
    title: deadline
    gloss: fecha límite, plazo
    note: '*deadline* es la fecha en que algo tiene que estar terminado.'
    example_gloss: La fecha límite más cercana de Daniel es el próximo viernes.
  en.b1.unit16.lesson03.teach.that_makes_sense:
    title: that makes sense. I'll try it.
    gloss: Tiene sentido. Lo voy a probar.
    note: '*that makes sense* muestra que entiendes el consejo y lo aceptas.'
    example_gloss: Tiene sentido. Lo voy a probar esta semana.
  en.b1.unit16.lesson03.teach.reading_passage:
    title: 'Lesetext: Rat bei zu viel Arbeit'
    gloss: 'Hola, Leila: me siento abrumado esta semana. Dirijo dos proyectos y, además, tengo mi clase nocturna. ¿Algún consejo? Hola, Daniel: si yo fuera tú, hablaría con tu jefe sobre la carga de trabajo. También deberías priorizar el proyecto con la fecha límite más cercana. ¿Qué tal si le pides a Mia que te ayude con el otro? Gracias, tiene sentido. Lo voy a probar y te cuento cómo me va.'
    note: Un consejo breve y cordial entre compañeros.
  en.b1.unit16.lesson04.teach.q_overwhelmed_two_projects:
    title: Daniel erklärt sein Problem
    gloss: 'Daniel dice: Me siento un poco abrumado. Dirijo dos proyectos y todavía tengo mi clase nocturna tres veces por semana.'
    note: '*a little overwhelmed* describe tener un poco demasiado trabajo.'
  en.b1.unit16.lesson04.teach.a_talk_to_manager:
    title: Leila gibt ihren ersten Rat
    gloss: 'Leila dice: Si yo fuera tú, hablaría con tu jefe sobre la carga de trabajo.'
    note: '*if I were you, I would* es la forma hipotética irreal.'
  en.b1.unit16.lesson04.teach.q_dont_want_to_seem:
    title: Daniel zögert
    gloss: 'Daniel dice: Es buena idea, pero no quiero parecer que no puedo con todo.'
    note: '*I don''t want to seem like* expresa preocupación por la imagen que uno da.'
  en.b1.unit16.lesson04.teach.a_prioritize_and_how_about:
    title: Leila macht zwei konkrete Vorschläge
    gloss: 'Leila dice: Deberías priorizar primero el proyecto con la fecha límite más cercana. ¿Qué tal si le pides a un compañero que te ayude con el otro?'
    note: '*you should* y *how about* combinan una sugerencia directa y una suave.'
  en.b1.unit16.lesson04.teach.q_ask_mia_this_week:
    title: Daniel nimmt den Rat an
    gloss: 'Daniel dice: Me gusta eso. Le voy a preguntar a Mia si tiene tiempo esta semana.'
    note: '*I like that* muestra que aceptas el consejo.'
  en.b1.unit16.lesson04.teach.a_sounds_like_solid_plan:
    title: Leila bestätigt den Plan
    gloss: 'Leila dice: Suena a un plan sólido.'
    note: Un cierre breve y alentador de la conversación.
