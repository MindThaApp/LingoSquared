teaching:
  en.a2.unit37.lesson01.teach.video_call:
    title: video call
    gloss: videollamada
    note: '*video call* es una conversación en la que también puedes ver a la otra persona. En español también se oye «videoconferencia», sobre todo para reuniones de varias personas.'
    example_gloss: Tengo una videollamada con mi equipo todos los lunes.
  en.a2.unit37.lesson01.teach.camera:
    title: camera
    gloss: cámara
    note: '*camera* es el aparato que transmite tu imagen.'
    example_gloss: Por favor, enciende tu cámara antes de que empiece la reunión.
  en.a2.unit37.lesson01.teach.microphone:
    title: microphone
    gloss: micrófono
    note: '*microphone* es el aparato que transmite tu voz.'
    example_gloss: Mi micrófono estaba apagado y los demás no me oyeron.
  en.a2.unit37.lesson01.teach.connection:
    title: connection
    gloss: conexión
    note: '*connection* es el enlace entre tu computadora y el internet.'
    example_gloss: La conexión era mala y por eso se congeló la imagen.
  en.a2.unit37.lesson01.teach.mute:
    title: mute
    gloss: silenciar
    note: '*mute* significa apagar tu propio sonido para que los demás no te oigan.'
    example_gloss: Silencio mi micrófono cuando no estoy hablando.
  en.a2.unit37.lesson01.teach.face_to_face:
    title: face to face
    gloss: en persona / cara a cara
    note: '*face to face* significa estar en el mismo lugar y no hablar a través de una pantalla.'
    example_gloss: Algunas reuniones son mejores en persona que en línea.
  en.a2.unit37.lesson01.teach.grammar_comparison:
    title: Vergleichen mit faster than und less ... than
    gloss: Una videollamada es más rápida que una visita. Una videollamada es menos personal que una reunión en persona.
    note: Con adjetivos cortos se añade *-er* y después va *than* (*faster than*). Con adjetivos más largos se usa *less ... than* o *more ... than*.
  en.a2.unit37.lesson02.teach.video_call_every_monday:
    title: Sagen, wie oft Sie Videoanrufe haben
    gloss: Tengo una videollamada con mi equipo todos los lunes.
    note: '*every Monday* significa todos los lunes y describe una costumbre fija.'
  en.a2.unit37.lesson02.teach.turn_on_your_camera:
    title: Jemanden bitten, die Kamera einzuschalten
    gloss: ¿Puedes encender tu cámara?
    note: '*turn on* significa encender; lo contrario es *turn off* (apagar).'
  en.a2.unit37.lesson02.teach.you_were_on_mute:
    title: Sagen, dass jemand stumm geschaltet war
    gloss: Perdón, estabas en silencio.
    note: '*you were on mute* es la expresión fija cuando no se oyó a alguien porque tenía el micrófono silenciado.'
  en.a2.unit37.lesson02.teach.useful_but_prefer_face_to_face:
    title: Die eigene Meinung mit einer Vorliebe sagen
    gloss: Creo que las videollamadas son útiles, pero prefiero conocer a la gente en persona.
    note: Con *I think ... but I prefer ...* primero das tu opinión y después dices qué prefieres.
  en.a2.unit37.lesson02.teach.grammar_prefer:
    title: prefer X to Y
    gloss: Prefiero las videollamadas a las llamadas telefónicas. Prefiero las reuniones en persona a las videollamadas.
    note: 'Después de *prefer* va *to*, no *than*: *I prefer video calls to phone calls*. En español también se dice «prefiero A a B», así que la estructura te resultará familiar.'
  en.a2.unit37.lesson03.teach.headphones:
    title: headphones
    gloss: audífonos
    note: '*headphones* siempre va en plural en inglés, aunque uses un solo par; en español «audífonos» o «auriculares» funcionan igual.'
    example_gloss: Uso audífonos para que mi familia no oiga la reunión.
  en.a2.unit37.lesson03.teach.leilas_message:
    title: Leilas Nachricht
    gloss: Ahora todas mis clases en línea son videollamadas. Enciendo mi cámara, pero silencio mi micrófono hasta que la profesora hace una pregunta. Uso audífonos porque mi conexión es mejor con ellos. Creo que las videollamadas ahorran mucho tiempo, pero sigo prefiriendo ver a mis compañeros en persona.
    note: Un mensaje informal de Leila sobre sus propias clases en línea.
  en.a2.unit37.lesson03.teach.mute_until_question:
    title: Sagen, wann Sie Ihr Mikrofon stumm schalten
    gloss: Mi micrófono queda en silencio hasta que la profesora hace una pregunta.
    note: '*until* significa «hasta que»: algo dura hasta que llega un momento determinado.'
  en.a2.unit37.lesson04.teach.q_lot_of_video_calls:
    title: Leila fragt nach Daniels Arbeit
    gloss: 'Leila pregunta: ¿Tienes muchas videollamadas en el trabajo?'
    note: '*a lot of* significa mucho y sirve tanto para cosas que se cuentan como para las que no.'
  en.a2.unit37.lesson04.teach.a_call_every_monday:
    title: Daniel erzählt von seinem festen Termin
    gloss: 'Daniel dice: Sí, tengo una videollamada con mi equipo todos los lunes.'
    note: Es la misma frase de la lección 2.
  en.a2.unit37.lesson04.teach.q_turn_on_camera:
    title: Leila fragt nach der Kamera
    gloss: 'Leila pregunta: ¿Enciendes tu cámara?'
    note: Una pregunta breve para saber más.
  en.a2.unit37.lesson04.teach.a_always_but_mute:
    title: Daniels Gewohnheit im Videoanruf
    gloss: 'Daniel dice: Siempre, pero silencio mi micrófono cuando no estoy hablando.'
    note: '*when I am not speaking* significa aquí: en los momentos en que no hablo.'
  en.a2.unit37.lesson04.teach.q_classes_are_video_calls:
    title: Leila erzählt von ihren Kursen
    gloss: 'Leila dice: Ahora todas mis clases en línea son videollamadas.'
    note: Esto retoma sus clases de lunes y miércoles de la unidad 33.
  en.a2.unit37.lesson04.teach.a_what_do_you_think:
    title: Daniel fragt nach ihrer Meinung
    gloss: 'Daniel pregunta: ¿Qué piensas de ellas?'
    note: '*What do you think about them?* pregunta la opinión sobre algo que se acaba de mencionar.'
  en.a2.unit37.lesson04.teach.q_useful_but_prefer:
    title: Leila sagt ihre Meinung
    gloss: 'Leila dice: Creo que las videollamadas son útiles, pero prefiero conocer a la gente en persona.'
    note: Es la misma opinión de la lección 2.
  en.a2.unit37.lesson04.teach.a_agree_faster_less_personal:
    title: Daniel stimmt ihr zu
    gloss: 'Daniel dice: Estoy de acuerdo. Una videollamada es más rápida que una visita, pero es menos personal.'
    note: Con *I agree* expresas que estás de acuerdo. Después se suele dar la propia razón.
  en.a2.unit37.lesson04.teach.q_exactly:
    title: Leila bestätigt
    gloss: 'Leila dice: Exacto.'
    note: '*Exactly* es una forma breve de decir que estás totalmente de acuerdo.'
