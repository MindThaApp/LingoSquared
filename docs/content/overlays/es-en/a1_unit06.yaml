  en.a1.unit06.lesson02.teach.my_mother:
    title: my mother
    gloss: mi madre
    note: '*my* corresponde a «mi/mis»; en inglés no cambia nunca, ni por el género ni por el número de lo que se posee.'
  en.a1.unit06.lesson02.teach.your_father:
    title: your father
    gloss: tu padre / su padre
    note: '*your* equivale a «tu» (informal) o «su» (formal, hablando con usted); la elección depende de con quién hablas. El inglés *your* nunca cambia, ni por el género ni por el número de lo que se posee.'
  en.a1.unit06.lesson02.teach.his_sister:
    title: his sister
    gloss: su hermana
    note: '*his* significa «su» (de él): se refiere al dueño, un hombre, aunque *sister* sea femenino.'
  en.a1.unit06.lesson02.teach.her_brother:
    title: her brother
    gloss: su hermano
    note: '*her* significa «su» (de ella): se refiere a la dueña, una mujer. En español «su» sirve para él y para ella, pero en inglés hay que elegir *his* o *her*.'
