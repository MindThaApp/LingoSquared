    title: Leila fragt nach der Familie
    gloss: 'Leila: ¿Es esta su familia?'
    note: '*Is this your family?* pregunta si la foto muestra a la familia de la otra persona.'
  en.a1.unit06.lesson04.teach.a_parents:
    title: Antwort über die Eltern
    gloss: 'Daniel: Sí. Esta es mi madre y este es mi padre.'
    note: Una respuesta completa presenta a cada progenitor por separado.
  en.a1.unit06.lesson04.teach.q_who:
    title: Nach einer Person fragen
    gloss: 'Leila: ¿Quién es este?'
    note: '*Who is this?* pregunta quién es la persona de la foto.'
  en.a1.unit06.lesson04.teach.a_sister_teacher:
    title: Antwort über die Schwester
    gloss: 'Daniel: Esta es mi hermana. Es profesora.'
    note: '*She''s a teacher.* dice la profesión.'
  en.a1.unit06.lesson04.teach.q_brothers:
    title: Nach Brüdern fragen
    gloss: 'Leila: ¿Tiene usted hermanos?'
    note: '*Do you have any brothers?* pregunta específicamente por hermanos varones, no en general por hermanos y hermanas.'
  en.a1.unit06.lesson04.teach.a_no_one_sister:
    title: Antwort über Geschwister
    gloss: 'Daniel: No, no tengo. Solo tengo una hermana.'
    note: '*I just have one sister.* limita la respuesta anterior.'
