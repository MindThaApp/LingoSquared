teaching:
  en.a1.unit23.lesson01.teach.teacher:
    title: teacher
    gloss: profesor, profesora
    note: '*teacher* significa profesor o profesora. El inglés no distingue el género aquí: *teacher* vale para ambos.'
    example_gloss: Leila es profesora.
  en.a1.unit23.lesson01.teach.nurse:
    title: nurse
    gloss: enfermero, enfermera
    note: '*nurse* significa enfermero o enfermera. La palabra es igual para mujeres y hombres.'
    example_gloss: Soy enfermero/enfermera.
  en.a1.unit23.lesson01.teach.engineer:
    title: engineer
    gloss: ingeniero, ingeniera
    note: '*engineer* significa ingeniero o ingeniera. Delante de vocal se usa *an*: *an engineer*.'
    example_gloss: Daniel es ingeniero.
  en.a1.unit23.lesson01.teach.cook:
    title: cook
    gloss: cocinero, cocinera
    note: '*cook* significa cocinero o cocinera; la palabra también es un verbo («cocinar»).'
    example_gloss: Mi hermano es cocinero.
  en.a1.unit23.lesson01.teach.driver:
    title: driver
    gloss: conductor, conductora
    note: '*driver* significa conductor o conductora. En *bus driver* se nombra junto al vehículo, que en inglés va delante: «conductor de autobús».'
    example_gloss: Es conductor de autobús.
  en.a1.unit23.lesson02.teach.what_do_you_do:
    title: What do you do?
    gloss: ¿A qué te dedicas?
    note: Con *What do you do?* preguntas por la profesión. Literalmente es «¿qué haces?», pero quiere decir «¿a qué te dedicas?».
  en.a1.unit23.lesson02.teach.im_a_nurse:
    title: I'm a nurse.
    gloss: Soy enfermero/enfermera.
    note: 'Con *I''m a...* dices tu profesión. Ojo: en español se dice «Soy profesor» sin artículo; en inglés delante de la profesión va *a* o *an*.'
  en.a1.unit23.lesson02.teach.where_do_you_work:
    title: Where do you work?
    gloss: ¿Dónde trabajas?
    note: Con *Where do you work?* preguntas por el lugar de trabajo.
  en.a1.unit23.lesson03.teach.patients:
    title: patients
    gloss: pacientes
    note: '*patients* significa pacientes (plural). La palabra se pronuncia *PEI-shents*.'
    example_gloss: Ayudo a pacientes todos los días.
  en.a1.unit23.lesson03.teach.profile_text:
    title: Texto sobre un perfil profesional
    gloss: Soy enfermero/enfermera. Trabajo en un hospital. Ayudo a pacientes y escribo informes todos los días.
    note: En este perfil breve alguien cuenta cuál es su profesión y su trabajo diario.
  en.a1.unit23.lesson04.teach.interesting_work:
    title: It's interesting work.
    gloss: Es un trabajo interesante.
    note: '*interesting* significa interesante.'
  en.a1.unit23.lesson04.teach.q_what_do_you_do_daniel:
    title: Preguntar a Daniel por su profesión
    gloss: 'Leila pregunta: Daniel, ¿a qué te dedicas?'
    note: Es la misma pregunta de la segunda lección, esta vez con nombre.
  en.a1.unit23.lesson04.teach.a_engineer_small_company:
    title: Respuesta de Daniel
    gloss: 'Daniel dice: Soy ingeniero. Trabajo en una empresa pequeña en el centro.'
    note: Daniel dice su profesión y dónde trabaja.
  en.a1.unit23.lesson04.teach.q_what_every_day:
    title: Preguntar por las tareas diarias
    gloss: 'Leila pregunta: ¿Qué haces todos los días?'
    note: Esta pregunta trata de las tareas diarias.
  en.a1.unit23.lesson04.teach.a_reports_emails_clients:
    title: Respuesta de Daniel
    gloss: 'Daniel dice: Escribo informes y contesto correos. A veces me reúno con clientes.'
    note: Daniel menciona algunas cosas que hace cada día.
  en.a1.unit23.lesson04.teach.q_like_your_job:
    title: Preguntar si a Daniel le gusta su trabajo
    gloss: 'Leila pregunta: ¿Te gusta tu trabajo?'
    note: Con *Do you like your job?* preguntas si a alguien le gusta su trabajo.
  en.a1.unit23.lesson04.teach.a_yes_interesting:
    title: Respuesta de Daniel
    gloss: 'Daniel dice: Sí, mucho. Es un trabajo interesante.'
    note: Daniel dice que sí y da también el motivo.
