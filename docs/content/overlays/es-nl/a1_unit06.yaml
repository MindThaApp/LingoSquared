teaching:
  nl.a1.unit06.lesson01.teach.koffie_thee_water:
    title: Café, té, agua
    gloss: café, té, agua
    note: '*De koffie*, *de thee*, *het water*: fíjate en los distintos artículos.'
    example_gloss:
    - Un café, por favor.
    - Té, por favor.
    - Agua, por favor.
  nl.a1.unit06.lesson01.teach.melk_sap:
    title: Leche, zumo
    gloss: leche, zumo
    note: '*De melk*, *het sap*.'
    example_gloss:
    - Leche, por favor.
    - Zumo, por favor.
  nl.a1.unit06.lesson02.teach.brood_broodje_kaas_appel:
    title: Pan, bocadillo de queso, manzana
    gloss: pan, bocadillo de queso, manzana
    note: '*Het brood*, *de appel*. *Broodje* significa un panecillo o bocadillo pequeño; *broodje kaas* es un pedido muy habitual en el día a día.'
    example_gloss:
    - Quisiera pan.
    - Quisiera un bocadillo de queso.
    - Quisiera una manzana.
  nl.a1.unit06.lesson02.teach.ik_wil_graag:
    title: Quisiera ...
    gloss: Quisiera ...
    note: '*Ik wil graag ...* es una forma educada y habitual de pedir algo en el habla cotidiana.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_koffie:
    title: Quisiera un café
    gloss: Quisiera un café.
    note: '*Een* significa ''un'' o ''una'' y es igual con todos los sustantivos neerlandeses.'
  nl.a1.unit06.lesson02.teach.ik_wil_graag_broodje:
    title: Quisiera un bocadillo de queso
    gloss: Quisiera un bocadillo de queso.
    note: 'Se dice *een broodje kaas*: *kaas* va justo después de *broodje*.'
  nl.a1.unit06.lesson03.teach.alstublieft_alsjeblieft:
    title: Por favor (formal e informal)
    gloss: por favor (formal), por favor (informal)
    note: Usa *alstublieft* cuando tratas a alguien de manera formal con *u*, y *alsjeblieft* cuando lo tratas de manera informal con *jij* o *je*.
    example_gloss:
    - Un café, por favor. (formal)
    - Un café, por favor. (informal)
  nl.a1.unit06.lesson03.teach.please_note:
    title: Alstublieft vs alsjeblieft
    gloss: alstublieft = por favor formal, alsjeblieft = por favor informal
    note: Elige *alstublieft* con *u* y *alsjeblieft* con *jij* o *je*.
    target_text: alstublieft = por favor formal (con u); alsjeblieft = por favor informal (con jij/je)
  nl.a1.unit06.lesson03.teach.twee_thee:
    title: Quisiera dos tés, por favor
    gloss: Quisiera dos tés, por favor.
    note: En un pedido en un café, *twee thee* significa de forma natural dos tazas de té; aquí *thee* se queda en singular.
  nl.a1.unit06.lesson04.teach.wat_wilt_u:
    title: ¿Qué desea beber? (formal)
    gloss: ¿Qué desea beber?
    note: '*Wilt u* es la forma formal habitual en los Países Bajos.'
  nl.a1.unit06.lesson04.teach.wat_wil_je:
    title: ¿Qué quieres comer? (informal)
    gloss: ¿Qué quiere comer?
    note: Usa *wil*, no *wilt*, ante *je* o *jij*, como en esta pregunta.
  nl.a1.unit06.lesson04.teach.wilt_wil_note:
    title: Wilt vs wil
    gloss: wilt u ... pero wil je/jij ...
    note: Cuando el verbo va antes de la persona, se usa *wilt u*, pero *wil je* o *wil jij*. No se dice *wilt je* ni *wilt jij*.
    target_text: 'wilt u (formal), pero wil je (informal): cuando wil va antes de je o jij, no lleva t'
  nl.a1.unit06.lesson04.teach.appelsap:
    title: Zumo de manzana
    gloss: zumo de manzana
    note: Escribe *appelsap* en una sola palabra, no como *appel sap*.
    example_gloss: ¿Me das un zumo de manzana, por favor?
  nl.a1.unit06.lesson04.teach.mag_ik:
    title: ¿Me das un zumo de manzana, por favor?
    gloss: ¿Me das un zumo de manzana, por favor?
    note: '*Mag ik ...?* es otra forma habitual y algo más informal de pedir, junto a *ik wil graag ...*'
  nl.a1.unit06.lesson05.teach.euro_vijftig:
    title: Dos euros cincuenta
    gloss: €2,50 — dos euros cincuenta
    note: €2,50 se dice normalmente *twee euro vijftig*, sin *en* ni *cent*.
  nl.a1.unit06.lesson05.teach.menu:
    title: Carta
    gloss: 'Carta — Café: €2,50. Té: €2,00. Bocadillo de queso: €3,50. Zumo de manzana: €2,50.'
    note: 'Las cartas neerlandesas escriben estos precios con coma decimal: €2,50, €2,00 y €3,50.'
    glosses:
      Menukaart: carta
      Koffie: café
      Thee: té
      Broodje: bocadillo / panecillo
      kaas: queso
      Appelsap: zumo de manzana
  nl.a1.unit06.lesson06.teach.goedemiddag:
    title: Buenas tardes
    gloss: buenas tardes
    note: Un saludo natural en el mostrador de un café por la tarde.
    example_gloss: Buenas tardes, ¿qué desea beber?
  nl.a1.unit06.lesson06.teach.komt_eraan:
    title: ¡Marchando!
    gloss: ¡Marchando!
    note: Algo natural y habitual que dice el personal después de tomar el pedido.
    example_gloss: ¡Su café marchando!
  nl.a1.unit06.lesson06.teach.lines01_03:
    title: Buenas tardes, ¿qué desea beber?
    gloss: 'Empleado: Buenas tardes, ¿qué desea beber? Lotte: Quisiera un café, por favor.'
    note: 'Una interacción formal de servicio: fíjate en que Lotte usa *alstublieft* con el empleado, a diferencia de cuando habla de manera informal con Omar.'
  nl.a1.unit06.lesson06.teach.lines04_06:
    title: ¿Desea también algo de comer?
    gloss: 'Empleado: ¿Y desea también algo de comer? Lotte: Sí, un bocadillo de queso, por favor. Empleado: ¡Marchando!'
    note: '*En wilt u ook iets eten?* es una forma natural de preguntar el personal si también quieres algo de comer.'
