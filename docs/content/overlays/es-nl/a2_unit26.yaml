teaching:
  nl.a2.unit26.lesson01.teach.bankrekening:
    title: Cuenta bancaria
    gloss: la cuenta bancaria
    note: 'Sustantivo de género común: de bankrekening, compuesto de bank (banco) y rekening (cuenta).'
    example_gloss: Me gustaría abrir una cuenta bancaria.
  nl.a2.unit26.lesson01.teach.rekening_openen:
    title: Pedir abrir una cuenta
    gloss: Me gustaría abrir una cuenta bancaria.
    note: Graag suaviza la petición; es un patrón que se repite a lo largo de este curso.
  nl.a2.unit26.lesson01.teach.welke_rekening:
    title: El empleado pregunta qué tipo
    gloss: ¿Qué tipo de cuenta le gustaría abrir?
    note: Wat voor + sustantivo pregunta «qué tipo de»; el infinitivo openen va al final de la pregunta, después del verbo modal wilt.
  nl.a2.unit26.lesson02.teach.betaalrekening:
    title: Cuenta corriente
    gloss: la cuenta corriente
    note: 'Sustantivo de género común: de betaalrekening, la cuenta corriente habitual en los Países Bajos.'
    example_gloss: Me gustaría una cuenta corriente para mi sueldo.
  nl.a2.unit26.lesson02.teach.salaris:
    title: Sueldo
    gloss: el sueldo
    note: 'Sustantivo neutro: het salaris.'
    example_gloss: Su empleador ingresa su sueldo en esta cuenta.
  nl.a2.unit26.lesson02.teach.betaalrekening_salaris:
    title: Indicar para qué es la cuenta
    gloss: Me gustaría una cuenta corriente para mi sueldo.
    note: Voor mijn salaris indica la finalidad de la cuenta.
  nl.a2.unit26.lesson02.teach.werkgever_stort:
    title: Cómo llega el sueldo
    gloss: Su empleador ingresa su sueldo en esta cuenta.
    note: Storten (ingresar) es el verbo habitual para un ingreso de dinero en una cuenta; op deze rekening indica el destino.
  nl.a2.unit26.lesson02.teach.storten_infinitive:
    title: La forma de infinitivo
    gloss: Storten es el infinitivo de stort.
    note: Es la forma del diccionario, el infinitivo, distinta de la forma conjugada de tercera persona de la frase anterior.
  nl.a2.unit26.lesson03.teach.identiteitsbewijs:
    title: Documento de identidad
    gloss: el documento de identidad
    note: 'Sustantivo neutro: het identiteitsbewijs, el término general neerlandés que incluye el pasaporte o el DNI.'
    example_gloss: ¿Tiene usted su número BSN y un documento de identidad válido?
  nl.a2.unit26.lesson03.teach.bsn_nodig:
    title: El empleado pide los documentos
    gloss: ¿Tiene usted su número BSN y un documento de identidad válido?
    note: Bij zich hebben (llevar consigo) reutiliza el patrón de registro formal de la visita al ayuntamiento (gemeente) de la unidad 24.
  nl.a2.unit26.lesson03.teach.hier_is:
    title: Entregar documentos
    gloss: Sí, aquí tiene mi pasaporte y mi número BSN.
    note: Hier is (aquí está/aquí tiene) es la forma natural de entregar algo en neerlandés.
  nl.a2.unit26.lesson04.teach.bankpas:
    title: Tarjeta bancaria
    gloss: la tarjeta bancaria
    note: 'Sustantivo de género común: de bankpas, la tarjeta de débito neerlandesa.'
    example_gloss: Recibirá su tarjeta bancaria por correo en el plazo de una semana.
  nl.a2.unit26.lesson04.teach.bankpas_uitleg:
    title: Explicar el envío de la tarjeta
    gloss: Recibirá su tarjeta bancaria por correo en el plazo de una semana.
    note: Binnen een week (en el plazo de una semana) indica el plazo; reutiliza el patrón ontvangt... per post del número BSN de la unidad 24.
  nl.a2.unit26.lesson04.teach.mobiel_bankieren:
    title: Presentar la banca móvil
    gloss: Con la app también puede hacer banca móvil.
    note: Mobiel bankieren (banca móvil) es el término neerlandés habitual para operar con el banco desde una app del móvil.
  nl.a2.unit26.lesson05.teach.folder:
    title: Lee un folleto de cuenta bancaria
    gloss: Para abrir una cuenta corriente necesita un documento de identidad válido y su número BSN. Su empleador usa esta cuenta para ingresar su sueldo. Después de la apertura, recibirá una tarjeta bancaria por correo en el plazo de una semana.
    note: Fíjate en los documentos requeridos, en para qué sirve la cuenta y en cuándo llega la tarjeta.
    glosses:
      betaalrekening: cuenta corriente
      openen: abrir
      heeft: 'tiene (fórmula de cortesía: «heeft u ... nodig» = necesita)'
      geldig: válido
      identiteitsbewijs: documento de identidad
      BSN-nummer: número de servicio ciudadano (identificador fiscal y social neerlandés)
      nodig: necesario («nodig hebben» = necesitar)
      werkgever: empleador
      gebruikt: usa (tercera persona de gebruiken)
      rekening: cuenta
      salaris: sueldo
      storten: ingresar (transferir fondos)
      opening: apertura (de la cuenta)
      ontvangt: 'recibir (forma formal: usted recibe)'
      binnen: dentro de
      week: semana
      bankpas: tarjeta bancaria / tarjeta de débito
      post: correo postal (por correo)
  nl.a2.unit26.lesson05.teach.ik_heb_nodig:
    title: Decir lo que tú necesitas
    gloss: Necesito un documento de identidad válido y mi número BSN.
    note: Heb es la forma de ik del verbo hebben. Aquí se usa en lugar de la fórmula formal del folleto, heeft u ... nodig, para expresar el mismo requisito desde tu propio punto de vista.
  nl.a2.unit26.lesson06.teach.medewerker_greet:
    title: El empleado saluda a Omar
    gloss: 'Empleado: Buenos días, ¿en qué puedo ayudarle?'
    note: Waarmee kan ik u helpen? retoma el saludo formal de servicio habitual de la visita al ayuntamiento de la unidad 24.
  nl.a2.unit26.lesson06.teach.omar_state_purpose:
    title: Omar expone su propósito
    gloss: 'Omar: Buenos días, quisiera abrir una cuenta corriente para mi sueldo.'
    note: Combina las peticiones de la lección 1 y la lección 2 en una frase inicial natural.
  nl.a2.unit26.lesson06.teach.medewerker_ask_documents:
    title: El empleado pide los documentos
    gloss: 'Empleado: Por supuesto. ¿Lleva usted su número BSN y un documento de identidad válido?'
    note: Coincide exactamente con la frase que se enseña en la lección 3.
  nl.a2.unit26.lesson06.teach.omar_hand_over:
    title: Omar entrega los documentos
    gloss: 'Omar: Sí, aquí tiene mi pasaporte y mi número BSN.'
    note: Coincide con el número BSN que Omar recibió en la unidad 24.
  nl.a2.unit26.lesson06.teach.medewerker_confirm:
    title: El empleado lo confirma
    gloss: 'Empleado: Gracias. Recibirá su tarjeta bancaria por correo en el plazo de una semana, y con la aplicación también podrá hacer operaciones bancarias desde el móvil.'
    note: Combina los datos sobre el envío de la tarjeta y la banca móvil de la lección 4.
  nl.a2.unit26.lesson06.teach.omar_thanks:
    title: Omar da las gracias al empleado
    gloss: 'Omar: Perfecto, ¡muchas gracias por su ayuda!'
    note: Retoma la despedida dank u wel voor uw hulp de la visita al ayuntamiento de la unidad 24.
  nl.a2.unit26.lesson06.teach.summary_grammar:
    title: Resumen de la visita
    gloss: Omar ha abierto una cuenta bancaria. Recibirá su tarjeta bancaria por correo.
    note: Heeft ... geopend es el pretérito perfecto de openen (geopend es el participio). Zijn aquí es el posesivo «su» (de él).
