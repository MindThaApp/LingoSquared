teaching:
  nl.a2.unit24.lesson01.teach.inschrijven:
    title: Empadronarse
    gloss: empadronarse
    note: 'Es un verbo reflexivo con partícula separable: zich inschrijven. El pronombre reflexivo cambia según el sujeto (me, je, zich, ...).'
    example_gloss: Quiero empadronarme en el ayuntamiento.
  nl.a2.unit24.lesson01.teach.afspraak_maken:
    title: Pedir una cita
    gloss: Quisiera pedir una cita para empadronarme.
    note: Om ... te + infinitivo expresa finalidad («para»); me in te schrijven separa el verbo inschrijven alrededor del pronombre reflexivo.
  nl.a2.unit24.lesson01.teach.wanneer_tijd:
    title: Preguntar por la disponibilidad
    gloss: ¿Cuándo tienes tiempo?
    note: Una forma directa y práctica de preguntar por el horario, usando el u formal.
  nl.a2.unit24.lesson01.teach.zou_schikken:
    title: El condicional de cortesía
    gloss: ¿Le iría bien el miércoles a las diez?
    note: Zou + infinitivo es el condicional de cortesía, más suave que una afirmación directa; es un rasgo típico del registro formal del A2.
  nl.a2.unit24.lesson01.teach.komt_goed_uit:
    title: Confirmar que una hora conviene
    gloss: Sí, me viene bien.
    note: Komt goed uit (literalmente «sale bien») es la forma natural de confirmar que una hora o un plan propuesto te viene bien.
  nl.a2.unit24.lesson02.teach.paspoort:
    title: Pasaporte
    gloss: el pasaporte
    note: 'Es un sustantivo neutro: het paspoort.'
    example_gloss: ¿Lleva su pasaporte consigo?
  nl.a2.unit24.lesson02.teach.huurcontract:
    title: Contrato de alquiler
    gloss: el contrato de alquiler
    note: 'Es un sustantivo neutro: het huurcontract, compuesto de huren (alquilar) y contract.'
    example_gloss: ¿Tiene un contrato de alquiler?
  nl.a2.unit24.lesson02.teach.geboorteakte:
    title: Certificado de nacimiento
    gloss: la partida de nacimiento
    note: 'Es un sustantivo de género común: de geboorteakte.'
    example_gloss: ¿También tengo que traer mi partida de nacimiento?
  nl.a2.unit24.lesson02.teach.wat_heb_ik_nodig:
    title: Preguntar qué se necesita
    gloss: ¿Qué necesito para empadronarme?
    note: Om ... te + infinitivo vuelve a expresar finalidad, con el mismo patrón de la lección 1.
  nl.a2.unit24.lesson02.teach.paspoort_huurcontract:
    title: Expresar requisitos de forma formal
    gloss: Necesita un pasaporte válido y su contrato de alquiler.
    note: U heeft ... nodig (literalmente «usted tiene ... necesitado») es la forma formal habitual de indicar un requisito.
  nl.a2.unit24.lesson02.teach.moet_ik_meenemen:
    title: Preguntar por un documento adicional
    gloss: ¿También tengo que traer mi partida de nacimiento?
    note: Meenemen (llevar consigo) es un verbo separable; aquí queda al final de la pregunta, en infinitivo, después de moet.
  nl.a2.unit24.lesson03.teach.mag_ik_zien:
    title: Pedir ver documentos
    gloss: ¿Puedo ver su pasaporte y su contrato de alquiler?
    note: Mag ik ... zien? es la forma educada habitual con la que un funcionario pide revisar documentos.
  nl.a2.unit24.lesson03.teach.sinds_wanneer:
    title: Preguntar desde cuándo
    gloss: ¿Desde cuándo vive en esta dirección?
    note: Sinds wanneer (desde cuándo) es una forma formal y precisa de preguntar por la duración, habitual en entrevistas oficiales.
  nl.a2.unit24.lesson03.teach.sinds_vorige_maand:
    title: Indicar un punto de partida
    gloss: Vivo aquí desde el mes pasado.
    note: 'Sinds + expresión de tiempo indica cuándo empezó una situación que continúa; va con el presente woon, no con un pasado, porque la situación sigue vigente. En español ocurre algo parecido: «vivo aquí desde...».'
  nl.a2.unit24.lesson04.teach.bsn:
    title: Número BSN
    gloss: el número BSN (número de servicio ciudadano)
    note: 'Es un sustantivo neutro: het BSN-nummer, el número personal de identificación nacional neerlandés.'
    example_gloss: ¿Qué es un número BSN?
  nl.a2.unit24.lesson04.teach.wat_is_bsn:
    title: Preguntar qué es el BSN
    gloss: ¿Qué es un número BSN?
    note: Una pregunta básica para pedir una definición, útil con cualquier término oficial desconocido.
  nl.a2.unit24.lesson04.teach.bsn_uitleg:
    title: Explicar el BSN
    gloss: El número BSN es su número personal ante la administración.
    note: Bij de overheid (ante la administración pública) indica a qué institución pertenece el número.
  nl.a2.unit24.lesson04.teach.nodig_voor:
    title: Enumerar sus usos
    gloss: Lo necesita para el trabajo, el banco y el médico de cabecera.
    note: Nodig hebben voor (necesitar para) reutiliza el patrón nodig hebben, con voor introduciendo cada uso.
  nl.a2.unit24.lesson04.teach.digid:
    title: Presentar DigiD
    gloss: Con DigiD puede gestionar trámites en línea.
    note: DigiD es el sistema de identidad digital neerlandés para los servicios públicos; zaken regelen (gestionar asuntos) es una expresión general habitual para resolver trámites oficiales.
  nl.a2.unit24.lesson05.teach.brief:
    title: Lee una carta oficial de empadronamiento
    gloss: 'Para empadronarse en el ayuntamiento necesita los siguientes documentos: un pasaporte válido, su contrato de alquiler y, si procede, su certificado de nacimiento. Pida cita con antelación. Después del empadronamiento recibirá su número BSN por correo en unos días.'
    note: Fíjate en los documentos necesarios, en lo que hay que hacer antes y en lo que ocurre después.
    glosses:
      Om: Para (Om ... te expresa finalidad)
      schrijven: empadronar (aquí parte del verbo separable «inschrijven», dividido como «in te schrijven»)
      gemeente: municipio / ayuntamiento
      volgende: siguiente
      documenten: documentos
      nodig: necesario (heeft ... nodig = «necesita»)
      geldig: válido
      paspoort: pasaporte
      huurcontract: contrato de alquiler
      indien: si / en caso de que (formal)
      toepassing: aplicación (indien van toepassing = «si procede»)
      geboorteakte: certificado de nacimiento
      Maak: haga (imperativo de «maken»)
      vooraf: previamente / con antelación
      afspraak: cita
      Na: después de
      inschrijving: empadronamiento
      ontvangt: recibe (de «ontvangen»)
      binnen: en el plazo de / dentro de
      enkele: unos pocos / varios
      BSN-nummer: número BSN (número de servicio ciudadano)
      post: correo
  nl.a2.unit24.lesson06.teach.ambtenaar_greet:
    title: El funcionario saluda a Omar
    gloss: 'Funcionario: Buenas tardes, ¿en qué puedo ayudarle?'
    note: Waarmee kan ik u helpen? es el saludo formal habitual en la atención al público, y continúa el registro con u de los encuentros de servicio de unidades anteriores.
  nl.a2.unit24.lesson06.teach.omar_state_reason:
    title: Omar explica el motivo
    gloss: 'Omar: Buenas tardes, tengo una cita para empadronarme en mi nueva dirección.'
    note: Op mijn nieuwe adres (en mi nueva dirección) especifica de qué empadronamiento se trata.
  nl.a2.unit24.lesson06.teach.ambtenaar_ask_documents:
    title: El funcionario pide los documentos
    gloss: 'Funcionario: ¿Puedo ver su pasaporte y su contrato de alquiler, por favor?'
    note: Retoma el patrón mag ik ... zien? de la lección 3, con alstublieft añadido para mayor cortesía.
  nl.a2.unit24.lesson06.teach.omar_hand_over:
    title: Omar entrega los documentos
    gloss: 'Omar: Aquí tiene. Vivo en Utrecht desde el mes pasado.'
    note: Coincide con el dato de sinds vorige maand del ejemplo de enseñanza de la lección 3.
  nl.a2.unit24.lesson06.teach.ambtenaar_confirm:
    title: El funcionario lo confirma
    gloss: 'Funcionario: Gracias. Todo está en orden. Recibirá su número BSN por correo en unos días.'
    note: Alles is in orde (todo está en orden) es una frase habitual de confirmación tras revisar los documentos.
  nl.a2.unit24.lesson06.teach.omar_thanks:
    title: Omar da las gracias al funcionario
    gloss: 'Omar: Estupendo, ¡muchas gracias por su ayuda!'
    note: Voor uw hulp (por su ayuda) cierra el intercambio formal con cortesía.
  nl.a2.unit24.lesson06.teach.summary_grammar:
    title: Resumen de la visita
    gloss: Omar se ha empadronado en la gemeente. Recibirá su número BSN por correo.
    note: Heeft ... ingeschreven es el pretérito perfecto de zich inschrijven (ingeschreven es el participio); zijn aquí es el posesivo «su», no el verbo «ser».
