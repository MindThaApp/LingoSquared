teaching:
  nl.a2.unit79.lesson01.teach.vakantie:
    title: Vacaciones
    gloss: las vacaciones / las vacaciones de verano
    note: Las dos palabras llevan el artículo de. *Vakantie* es la palabra general; *de zomervakantie* es el largo descanso del verano.
    example_gloss:
    - En agosto tengo vacaciones.
    - Las vacaciones de verano empiezan en julio.
  nl.a2.unit79.lesson01.teach.volgende_week:
    title: Cuándo ocurre algo
    gloss: la semana que viene / el año que viene / pronto
    note: '*Week* lleva el artículo de, por eso se dice *volgende week*. *Jaar* lleva het, por eso se dice *volgend jaar* (sin -e final).'
    example_gloss:
    - La semana que viene tengo una cita.
    - El año que viene quiero ir a Bélgica.
    - Pronto tengo vacaciones.
  nl.a2.unit79.lesson01.teach.reizen_boeken:
    title: Tres verbos de viaje
    gloss: viajar / reservar / quedarse
    note: Son infinitivos. *Boeken* también significa 'libros' como sustantivo, pero aquí es el verbo 'reservar'.
    example_gloss:
    - Me gusta viajar en tren.
    - Quiero reservar una habitación.
    - Me quedo una semana.
  nl.a2.unit79.lesson01.teach.hotel_camping:
    title: Dónde alojarse
    gloss: el hotel / el camping
    note: '*Het hotel* lleva het; *de camping* lleva de. Se duerme *op de camping*, pero *in een hotel*.'
    example_gloss:
    - El hotel está cerca de la playa.
    - Dormimos en el camping.
  nl.a2.unit79.lesson01.teach.vraag:
    title: Preguntar por los planes de vacaciones
    gloss: ¿Qué vas a hacer en las vacaciones de verano?
    note: 'Aquí *gaan* es un verbo auxiliar: *ga* en segundo lugar y el infinitivo *doen* al final de todo.'
  nl.a2.unit79.lesson01.teach.gn_gaan:
    title: 'Planes próximos: gaan + infinitivo'
    gloss: En agosto voy a viajar a Alemania. Voy a reservar un hotel.
    note: 'Para decir lo que vas a hacer, usa una forma de *gaan* en segunda posición y pon el infinitivo al final de la oración: *Ik ga een hotel boeken*. Todo lo demás (un momento, un lugar, un complemento) va en medio. Si una expresión de tiempo va al principio, *ga* sigue en segunda posición: *Volgende week ga ik een hotel boeken*.'
  nl.a2.unit79.lesson01.teach.hotel_boeken:
    title: Reservar un hotel
    gloss: Voy a reservar un hotel.
  nl.a2.unit79.lesson02.teach.cursus_verhuizen:
    title: Tres planes para más adelante
    gloss: hacer un curso / mudarse / ahorrar
    note: '*Een cursus volgen* es la expresión fija para hacer un curso. *Verhuizen* es mudarse a una casa nueva.'
    example_gloss:
    - Quiero hacer un curso.
    - Mi tío quiere mudarse.
    - Quiero ahorrar para una bici nueva.
  nl.a2.unit79.lesson02.teach.later_over:
    title: Más adelante
    gloss: más tarde / dentro de un mes
    note: '*Over een maand* significa ''dentro de un mes''. También funciona con otros periodos: *over een week*.'
    example_gloss:
    - Más adelante quiero comprar una casa.
    - Dentro de un mes empieza mi curso.
  nl.a2.unit79.lesson02.teach.cursus_begint:
    title: Un curso que empieza
    gloss: Dentro de un mes empieza mi curso.
  nl.a2.unit79.lesson02.teach.gn_van_plan:
    title: 'Intenciones: van plan zijn om ... te'
    gloss: Pienso hacer un curso.
    note: 'Para decir lo que piensas hacer, usa *ik ben van plan om* y después el resto de la frase. El infinitivo va al final, con *te* justo delante: *een cursus te volgen*. Se usa para cosas que quieres hacer, no para planes ya fijados.'
  nl.a2.unit79.lesson02.teach.verhuizen:
    title: Pensar mudarse
    gloss: Pienso mudarme.
  nl.a2.unit79.lesson02.teach.sparen:
    title: Pensar ahorrar
    gloss: Pienso ahorrar.
  nl.a2.unit79.lesson02.teach.gn_contrast:
    title: ¿Gaan o van plan zijn?
    gloss: Mañana voy al mercado. Más adelante pienso mudarme.
    note: 'Usa *gaan* para el futuro cercano y decidido: *Morgen ga ik naar de markt*. Usa *van plan zijn* para una intención más lejana o menos segura: *Later ben ik van plan om te verhuizen*.'
  nl.a2.unit79.lesson03.teach.misschien:
    title: Quizás y seguro
    gloss: quizás / seguro
    note: '*Misschien* expresa duda. *Zeker* significa «seguro» o «sin duda».'
    example_gloss:
    - Quizás llueva mañana.
    - Eso es muy divertido, sin duda.
  nl.a2.unit79.lesson03.teach.dit_jaar:
    title: Este año, este verano
    gloss: este año / este verano
    note: '*Jaar* es una palabra het, por eso *dit jaar*. *Zomer* es una palabra de, por eso *deze zomer*.'
    example_gloss:
    - Este año no me voy de vacaciones.
    - Este verano me quedo en casa.
  nl.a2.unit79.lesson03.teach.blijf_thuis:
    title: Quedarse en casa
    gloss: Este verano me quedo en casa.
  nl.a2.unit79.lesson03.teach.gn_misschien:
    title: Misschien y el orden de las palabras
    gloss: Mañana voy a trabajar. Quizás vaya al cine más tarde.
    note: '*Misschien* al principio de la frase cuenta como primer elemento, así que el verbo va justo después: *Misschien ga ik later naar de bioscoop*, no *Misschien ik ga*. Lo mismo ocurre después de cualquier expresión de tiempo: *Morgen ga ik werken*.'
  nl.a2.unit79.lesson03.teach.gn_niet:
    title: Decir que no vas a hacer algo
    gloss: No me voy de vacaciones. No pienso mudarme.
    note: 'Coloca *niet* después de *ga* o *ben*, antes del resto del plan: *Ik ga niet op vakantie*. Con *van plan zijn*, *niet* va antes de *van plan*: *Ik ben niet van plan om te verhuizen*.'
  nl.a2.unit79.lesson04.teach.met_wie:
    title: Dos expresiones interrogativas
    gloss: con quién / cuánto tiempo
    note: '*Met wie* pregunta por la persona con la que haces algo. *Hoe lang* pregunta por un período de tiempo.'
    example_gloss:
    - ¿Con quién vas a la playa?
    - ¿Cuánto tiempo te quedas?
  nl.a2.unit79.lesson04.teach.waar_naartoe:
    title: ¿Adónde vas?
    gloss: ¿Adónde vas?
    note: '*Naartoe* va al final de la pregunta e indica dirección.'
  nl.a2.unit79.lesson04.teach.met_wie_vakantie:
    title: ¿Con quién?
    gloss: ¿Con quién vas de vacaciones?
  nl.a2.unit79.lesson04.teach.hoe_lang_daar:
    title: ¿Cuánto tiempo?
    gloss: ¿Cuánto tiempo te quedas allí?
  nl.a2.unit79.lesson04.teach.met_mijn_zus:
    title: Responder
    gloss: Voy con mi hermana.
  nl.a2.unit79.lesson04.teach.wij_blijven:
    title: Nosotros
    gloss: Nos quedamos dos semanas.
  nl.a2.unit79.lesson04.teach.weken:
    title: Semanas
    gloss: una semana / dos semanas
    note: El plural de *week* es *weken*.
    example_gloss:
    - Me quedo una semana.
    - Nos quedamos dos semanas.
  nl.a2.unit79.lesson04.teach.gn_vragen:
    title: Preguntas con gaan
    gloss: ¿Adónde vas? ¿Con quién vas? ¿Cuánto tiempo te vas a quedar?
    note: 'Pon primero la palabra interrogativa, luego *ga* en segunda posición y después *je*. El infinitivo, si lo hay, va al final: *Hoe lang ga je blijven?*'
  nl.a2.unit79.lesson05.teach.noor_bericht:
    title: Un mensaje de Noor
    gloss: ¡Hola, Lotte! Pronto tengo vacaciones. En agosto me voy con mi hermana a Bélgica. Vamos a quedarnos una semana en un hotel. Después voy dos días a casa de mis padres. El año que viene pienso hacer un curso. Quizás entonces también me mude. ¿Y tú, qué vas a hacer?
    note: 'Noor describe los planes cercanos con *gaan* y una intención a más largo plazo con *van plan zijn*. Fíjate en que todos los infinitivos van al final de su frase: *blijven*, *te volgen*, *verhuizen*.'
    glosses:
      binnenkort: pronto
      vakantie: vacaciones
      augustus: agosto
      zus: hermana
      naar: a
      belgië: Bélgica
      hotel: hotel
      blijven: quedarse
      daarna: después
      ouders: padres
      dagen: días
      volgend: próximo
      jaar: año
      plan: plan (van plan zijn = pensar, tener la intención de)
      cursus: curso
      volgen: hacer (un curso)
      misschien: quizás
      verhuizen: mudarse
      dan: entonces
      ook: también
  nl.a2.unit79.lesson06.teach.lotte_vraag:
    title: Lotte le pregunta a Omar por sus planes
    gloss: 'Lotte: ¡Hola, Omar! ¿Ya tienes planes para las vacaciones de verano?'
  nl.a2.unit79.lesson06.teach.omar_duitsland:
    title: Omar responde
    gloss: 'Omar: ¡Sí! En agosto me voy a Alemania. Voy a reservar un hotel.'
  nl.a2.unit79.lesson06.teach.lotte_met_wie:
    title: Lotte pregunta con quién va
    gloss: 'Lotte: ¡Qué bien! ¿Con quién vas?'
  nl.a2.unit79.lesson06.teach.omar_oom:
    title: Omar dice con quién y cuánto tiempo
    gloss: 'Omar: Con mi tío. Vamos a quedarnos una semana.'
  nl.a2.unit79.lesson06.teach.lotte_later:
    title: Lotte pregunta por más adelante
    gloss: 'Lotte: ¿Y más adelante? ¿Qué piensas hacer?'
  nl.a2.unit79.lesson06.teach.omar_cursus:
    title: Omar dice una intención y pregunta de vuelta
    gloss: 'Omar: El año que viene pienso hacer un curso. ¿Y tú?'
  nl.a2.unit79.lesson06.teach.lotte_antwoord:
    title: Lotte responde
    gloss: 'Lotte: En julio voy a trabajar. Quizás después vaya a casa de mis padres.'
