teaching:
  nl.a1.unit16.lesson01.teach.niet_lekker:
    title: No sentirse bien
    gloss: No me siento bien.
    note: '*Voelen* es reflexivo aquí (*je*/*me voelen*); *niet lekker* es la forma general y suave de decir que algo no va bien.'
  nl.a1.unit16.lesson01.teach.ziek:
    title: Enfermo
    gloss: enfermo
    note: El adjetivo básico, que se usa con *zijn* (ser/estar).
    example_gloss: Estoy enfermo.
  nl.a1.unit16.lesson01.teach.ben_ziek:
    title: Estar enfermo
    gloss: Estoy enfermo.
    note: '*Ziek* describe un estado más general y más fuerte que *niet lekker*.'
  nl.a1.unit16.lesson01.teach.hoofdpijn:
    title: Dolor de cabeza
    gloss: dolor de cabeza
    note: 'Se usa sin artículo después de *hebben*: *Ik heb hoofdpijn*, no *Ik heb een hoofdpijn*.'
    example_gloss: Me duele la cabeza.
  nl.a1.unit16.lesson01.teach.heb_hoofdpijn:
    title: Tener dolor de cabeza
    gloss: Me duele la cabeza.
    note: 'En neerlandés los síntomas suelen ir con *hebben* (tener), igual que en español: tengo dolor de cabeza, tengo fiebre.'
  nl.a1.unit16.lesson01.teach.buikpijn:
    title: Dolor de estómago
    gloss: dolor de estómago
    note: Mismo patrón sin artículo que *hoofdpijn*.
    example_gloss: Me duele el estómago.
  nl.a1.unit16.lesson01.teach.heb_buikpijn:
    title: Tener dolor de estómago
    gloss: Me duele el estómago.
    note: Sigue el mismo patrón con *hebben* que *hoofdpijn*.
  nl.a1.unit16.lesson02.teach.wat_is_er:
    title: Preguntar en general
    gloss: ¿Qué pasa?
    note: Una forma general, válida para todo, de preguntar si ocurre algo.
  nl.a1.unit16.lesson02.teach.wat_scheelt:
    title: Una expresión muy común
    gloss: ¿Qué ocurre?
    note: '*Scheelt eraan* es una expresión fija; no la traduzcas palabra por palabra.'
  nl.a1.unit16.lesson02.teach.keelpijn:
    title: Dolor de garganta
    gloss: dolor de garganta
    note: Mismo patrón sin artículo que *hoofdpijn*/*buikpijn*.
    example_gloss: Me duele la garganta.
  nl.a1.unit16.lesson02.teach.heb_keelpijn:
    title: Tener dolor de garganta
    gloss: Me duele la garganta.
    note: Sigue el mismo patrón con *hebben* que los demás síntomas.
  nl.a1.unit16.lesson02.teach.gaat_het:
    title: Preguntarle a alguien cómo está
    gloss: ¿Estás bien? No, no me siento bien.
    note: '*Gaat het?* es una pregunta muy habitual e informal para interesarse por alguien entre amigos.'
  nl.a1.unit16.lesson03.teach.koorts:
    title: Fiebre
    gloss: fiebre
    note: Se usa sin artículo después de *hebben*, como los demás síntomas.
    example_gloss: Tengo fiebre.
  nl.a1.unit16.lesson03.teach.heb_koorts:
    title: Tener fiebre
    gloss: Tengo fiebre.
    note: Sigue el patrón con *hebben*.
  nl.a1.unit16.lesson03.teach.verkouden:
    title: Tener un resfriado
    gloss: tener un resfriado
    note: 'Es un adjetivo con *zijn*, no un sustantivo con *hebben*: es un punto que suele confundirse.'
    example_gloss: Tengo un resfriado.
  nl.a1.unit16.lesson03.teach.ben_verkouden:
    title: Decir que tienes un resfriado
    gloss: Tengo un resfriado.
    note: En neerlandés se usa *zijn* + *verkouden* (un adjetivo), no «tener» + sustantivo; no digas *Ik heb een verkouden*.
  nl.a1.unit16.lesson03.teach.zijn_note:
    title: Zijn o hebben depende de la clase de palabra, no de la duración
    gloss: 'Ziek y verkouden son adjetivos y usan zijn: estoy enfermo/a, estoy resfriado/a. Koorts y hoofdpijn son sustantivos y usan hebben.'
    note: 'La elección entre *zijn* y *hebben* depende de la clase gramatical (adjetivo o sustantivo-síntoma), no de lo temporal que sea el estado: *koorts* (sustantivo) es tan pasajera como *verkouden* (adjetivo), pero lleva *hebben*, no *zijn*.'
  nl.a1.unit16.lesson04.teach.apotheek:
    title: La farmacia
    gloss: la farmacia
    note: 'Es un sustantivo de género común: *de apotheek*.'
    example_gloss: Voy a la farmacia.
  nl.a1.unit16.lesson04.teach.waarmee_helpen:
    title: El saludo del farmacéutico
    gloss: ¿En qué puedo ayudarle?
    note: '*Waarmee kan ik u helpen?* es un saludo formal habitual en el servicio al cliente; sigue el registro de *u* de las lecciones anteriores.'
  nl.a1.unit16.lesson04.teach.iets_tegen:
    title: Pedir algo para un síntoma
    gloss: ¿Tiene algo para el dolor de cabeza?
    note: '*Iets tegen* + síntoma es la forma natural de pedir un remedio.'
  nl.a1.unit16.lesson04.teach.tablet:
    title: Una pastilla
    gloss: una pastilla
    note: 'Es un sustantivo neutro: *het tablet*, aunque aquí se usa de forma indefinida como *een tablet*.'
    example_gloss: Tomo una pastilla.
  nl.a1.unit16.lesson04.teach.neem_tablet:
    title: Indicaciones de dosis
    gloss: Tome una pastilla dos veces al día.
    note: '*Neem* es el imperativo de *nemen* (tomar), que se usa para dar instrucciones.'
  nl.a1.unit16.lesson04.teach.register_note:
    title: El registro en la farmacia
    gloss: En la farmacia se usa la forma de cortesía u.
    note: El farmacéutico es un adulto desconocido que presta un servicio; se aplica la misma regla de registro que en la taquilla de la unidad anterior.
  nl.a1.unit16.lesson05.teach.advies:
    title: Leer una nota de consejos de la farmacia
    gloss: 'Consejo: toma una pastilla dos veces al día con agua. Descansa bien y bebe mucha agua. ¿Todavía no te sientes bien después de tres días? Entonces ve al médico.'
    note: Fíjate en la dosis, en las dos recomendaciones que no son medicamentos y en cuándo ir al médico.
    glosses:
      Advies: consejo
      neem: toma
      keer: veces
      dag: día
      tablet: pastilla
      Rust: descansa
      drink: bebe
      Voel: sientes
      steeds: todavía
      lekker: bien
      huisarts: médico
  nl.a1.unit16.lesson06.teach.lotte_ask:
    title: Lotte se interesa por él
    gloss: 'Lotte: Hola, Omar, ¿cómo va todo? ¿Ya te encuentras mejor?'
    note: '*Al* (ya) indica que Lotte quiere saber si Omar ha mejorado desde la última vez que hablaron.'
  nl.a1.unit16.lesson06.teach.omar_still_bad:
    title: Omar sigue mal
    gloss: 'Omar: Todavía no muy bien. Sigo con dolor de cabeza y estoy cansado.'
    note: '*Nog steeds* (todavía) indica que el dolor de cabeza no se ha ido; *moe* (cansado) es un adjetivo nuevo y útil.'
  nl.a1.unit16.lesson06.teach.lotte_ask_tablet:
    title: Lotte pregunta por la medicina
    gloss: 'Lotte: ¿Te has tomado una pastilla?'
    note: '*Genomen* es el participio de *nemen*, con el mismo patrón *heb* + participio de la unidad 12.'
  nl.a1.unit16.lesson06.teach.omar_took_tablet:
    title: Omar lo confirma
    gloss: 'Omar: Sí, me he tomado una pastilla. Ahora voy a descansar.'
    note: '*Ga nu rusten* (voy a descansar ahora) usa el futuro próximo con *gaan* + infinitivo.'
  nl.a1.unit16.lesson06.teach.lotte_wish:
    title: Lotte le desea que se mejore
    gloss: 'Lotte: Buena idea. Descansa bien. ¡Que te mejores!'
    note: '*Beterschap!* es la expresión fija habitual para desear una pronta recuperación.'
  nl.a1.unit16.lesson06.teach.omar_thanks:
    title: Omar se despide
    gloss: 'Omar: Gracias, ¡hasta mañana!'
    note: '*Tot morgen!* repite el patrón *tot* + tiempo de las despedidas de unidades anteriores.'
