course:
  title: Neerlandés A2
  description: 'Neerlandés de nivel intermedio-básico para solicitar un trabajo a tiempo parcial y hacer la entrevista: una vacante, una llamada para concertar una cita, cómo describir tu experiencia y tu disponibilidad, y una entrevista de trabajo completa.'
units:
  nl.a2.unit73.sollicitatiegesprek:
    title: Solicitar un trabajo en Kantoor Bloem
lessons:
  nl.a2.unit73.lesson01.ik_wil_solliciteren:
    title: Quiero presentar mi candidatura
  nl.a2.unit73.lesson02.ik_bel_over_de_vacature:
    title: Llamo por la vacante
  nl.a2.unit73.lesson03.mijn_ervaring_en_vaardigheden:
    title: Mi experiencia y mis habilidades
  nl.a2.unit73.lesson04.ben_ik_beschikbaar:
    title: ¿Estoy disponible?
  nl.a2.unit73.lesson05.een_vacature_lezen:
    title: Leer una oferta de trabajo
  nl.a2.unit73.lesson06.het_sollicitatiegesprek:
    title: La entrevista de trabajo
teaching:
  nl.a2.unit73.lesson01.teach.vacature:
    title: Vacante
    gloss: la vacante / la oferta de empleo
    note: 'Sustantivo de género común: de vacature.'
    example_gloss: Nina ve una vacante en línea.
  nl.a2.unit73.lesson01.teach.solliciteren_voor:
    title: Solicitar una vacante
    gloss: Me gustaría presentar mi candidatura a esta vacante.
    note: Wil graag suaviza la petición; solliciteren voor es la combinación fija de verbo y preposición para solicitar algo.
  nl.a2.unit73.lesson01.teach.kantoor_bloem_zoekt:
    title: La empresa expone lo que necesita
    gloss: Kantoor Bloem busca un auxiliar administrativo.
    note: Zoekt (de zoeken, buscar) es el verbo habitual en los anuncios para presentar una vacante.
  nl.a2.unit73.lesson02.teach.sollicitatiegesprek:
    title: Entrevista de trabajo
    gloss: la entrevista de trabajo
    note: 'Sustantivo neutro: het sollicitatiegesprek, literalmente «conversación de solicitud».'
    example_gloss: La entrevista de trabajo es la semana que viene.
  nl.a2.unit73.lesson02.teach.afspraak_maken:
    title: Pedir una cita
    gloss: ¿Puedo concertar una cita para una entrevista de trabajo?
    note: Een afspraak maken voor repite el mismo patrón para concertar citas que viste en la Unidad 46.
  nl.a2.unit73.lesson02.teach.natuurlijk_dinsdag:
    title: Fijar una hora
    gloss: Claro, ¿puede pasar el martes a las diez?
    note: Langskomen (pasar, venir a verse) reutiliza el verbo separable de la llamada a la woningcorporatie de la Unidad 28.
  nl.a2.unit73.lesson03.teach.ervaring:
    title: Experiencia
    gloss: la experiencia
    note: 'Sustantivo de género común: de ervaring.'
    example_gloss: Tengo experiencia como voluntario.
  nl.a2.unit73.lesson03.teach.vaardigheid:
    title: Habilidad
    gloss: la habilidad
    note: 'Sustantivo de género común: de vaardigheid.'
    example_gloss: Mecanografiar es una habilidad importante.
  nl.a2.unit73.lesson03.teach.ervaring_bibliotheek:
    title: Indicar una experiencia concreta
    gloss: Tengo experiencia como voluntario en la biblioteca.
    note: Als vrijwilliger (como voluntario/a) indica el papel que desempeñabas; in de bibliotheek retoma la biblioteca de la Unidad 47.
  nl.a2.unit73.lesson03.teach.goede_vaardigheden:
    title: Indicar habilidades en general
    gloss: Tengo buenas habilidades.
    note: Vaardigheden es el plural de vaardigheid.
  nl.a2.unit73.lesson04.teach.beschikbaar:
    title: Disponible
    gloss: disponible
    note: Es un adjetivo invariable, tanto antes como después de zijn.
    example_gloss: Nina está disponible desde el lunes.
  nl.a2.unit73.lesson04.teach.werktijden:
    title: El horario de trabajo
    gloss: el horario de trabajo
    note: 'Es un sustantivo plural: de werktijden se usa siempre en plural.'
    example_gloss: ¿Cuál es el horario de trabajo?
  nl.a2.unit73.lesson04.teach.beschikbaar_dagen:
    title: Indicar una disponibilidad concreta
    gloss: Estoy disponible los lunes, miércoles y viernes.
    note: Op + una lista de días indica qué días estás libre.
  nl.a2.unit73.lesson04.teach.werktijden_precies:
    title: Pedir una aclaración
    gloss: ¿Cuál es exactamente el horario de trabajo?
    note: Precies (exactamente) hace la pregunta más concreta; es una pregunta de seguimiento natural en una entrevista.
  nl.a2.unit73.lesson05.teach.vacature_tekst:
    title: Lee una oferta de empleo
    gloss: 'Kantoor Bloem busca un auxiliar administrativo. Se valora la experiencia en atención al cliente. Horario: lunes, miércoles y viernes, de nueve a cinco. Llama para concertar una entrevista de trabajo.'
    note: Fíjate en el puesto, la experiencia deseada y los días y horas.
    glosses:
      zoekt: busca (de zoeken)
      administratief: administrativo
      medewerker: auxiliar / empleado
      Ervaring: experiencia
      klantcontact: el trato con clientes
      pre: un plus / una ventaja (expresión típica de las ofertas de empleo neerlandesas)
      Werktijden: horario de trabajo
      maandag: lunes
      woensdag: miércoles
      vrijdag: viernes
      negen: nueve
      tot: a / hasta
      vijf: cinco
      uur: hora / en punto
      Bel: llama (imperativo de bellen)
      sollicitatiegesprek: entrevista de trabajo
  nl.a2.unit73.lesson05.teach.ervaring_klantcontact:
    title: Indicar una experiencia relacionada
    gloss: Tengo experiencia en atención al cliente.
    note: Klantcontact (atención al cliente) repite exactamente la palabra de la oferta de empleo.
  nl.a2.unit73.lesson06.teach.jansen_greet:
    title: La señora Jansen saluda a Nina
    gloss: 'Señora Jansen: Buenos días, bienvenida a Kantoor Bloem. Cuénteme sobre su experiencia.'
    note: Vertelt u eens over... es una forma formal habitual de abrir una pregunta en una entrevista.
  nl.a2.unit73.lesson06.teach.nina_ervaring:
    title: Nina describe su experiencia
    gloss: 'Nina: Buenos días. Tengo experiencia como voluntaria en la biblioteca. Allí tenía mucho trato con el cliente.'
    note: Had es el pasado simple de hebben; aquí describe un periodo de voluntariado ya terminado.
  nl.a2.unit73.lesson06.teach.jansen_beschikbaar:
    title: La señora Jansen pregunta por la disponibilidad
    gloss: 'Señora Jansen: Muy bien. ¿Está disponible los lunes, miércoles y viernes?'
    note: Es casi la misma frase que aprendiste antes, ahora en forma de pregunta.
  nl.a2.unit73.lesson06.teach.nina_dat_kan:
    title: Nina confirma y pregunta a su vez
    gloss: 'Nina: Sí, me va bien. ¿Cuál es exactamente el horario de trabajo?'
    note: Dat kan (me va bien / es posible) es una forma natural de confirmar la disponibilidad antes de hacer otra pregunta.
  nl.a2.unit73.lesson06.teach.jansen_uren_contact:
    title: La señora Jansen responde y se despide
    gloss: 'Señora Jansen: De nueve a cinco. Nos pondremos en contacto con usted esta semana.'
    note: Contact met u op nemen retoma la construcción con verbo separable de la llamada a la woningcorporatie de la Unidad 28.
  nl.a2.unit73.lesson06.teach.nina_dank_gesprek:
    title: Nina da las gracias a la señora Jansen
    gloss: 'Nina: Muchas gracias por la entrevista.'
    note: Dank u wel retoma el agradecimiento formal que has visto a lo largo del curso A2.
  nl.a2.unit73.lesson06.teach.summary_grammar:
    title: Resumir la entrevista
    gloss: Nina se ha presentado como candidata a un puesto en Kantoor Bloem. Tiene experiencia como voluntaria en la biblioteca.
    note: Heeft ... gesolliciteerd es el pretérito perfecto de solliciteren (gesolliciteerd es el participio); zij es el pronombre de tercera persona «ella».
