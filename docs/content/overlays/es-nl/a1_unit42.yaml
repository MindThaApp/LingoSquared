  nl.a1.unit42.lesson03.teach.ik_wil_grammar:
    title: La construcción Ik wil graag
    gloss: '*Ik wil graag* + color indica qué color eliges: Quiero rosa.'
    note: 'Retoma la construcción *Ik wil graag ...* ya aprendida para pedir (Ik wil graag appels, Ik wil graag een koffie): no hay gramática nueva, solo un uso nuevo. Los colores se usan siempre así (como complemento de *wil* o como atributo después de *zijn*), nunca directamente delante de un sustantivo: en ese caso el neerlandés cambia la terminación del color (*rood* pasa a *rode*), y esa regla de flexión todavía no se enseña en este curso.'
