course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para hablar de empezar, dejar e intentar hábitos.
  learning_goal: Di qué empezaste, dejaste, intentaste u olvidaste hacer con te + infinitivo, stoppen met y staan/zitten/liggen te.
units:
  nl.a2.unit91.beginnen_stoppen_proberen:
    title: Empezar, dejar, intentar
    description: Di qué empezaste, dejaste, intentaste u olvidaste hacer, y qué está haciendo alguien.
lessons:
  nl.a2.unit91.lesson01.ik_begin_te_sporten:
    title: Empiezo a hacer deporte
  nl.a2.unit91.lesson02.stoppen_met:
    title: Dejar de hacer algo
  nl.a2.unit91.lesson03.proberen_en_vergeten:
    title: Intentar y olvidar
  nl.a2.unit91.lesson04.hij_zit_te_lezen:
    title: Él está sentado leyendo
  nl.a2.unit91.lesson05.noors_plan:
    title: El plan de Noor
  nl.a2.unit91.lesson06.lotte_en_omar_sporten:
    title: Lotte y Omar hacen deporte
teaching:
  nl.a2.unit91.lesson01.teach.gewoontes:
    title: Hábitos
    gloss: hacer deporte / dormir / comer / saludable / más temprano
    note: Estas palabras nombran los hábitos de los que hablarás en esta unidad.
    example_gloss:
    - Quiero hacer deporte.
    - Quiero comer de forma saludable.
    - Quiero dormir más temprano.
  nl.a2.unit91.lesson01.teach.sportschool:
    title: En el gimnasio
    gloss: el gimnasio / todos los días / a menudo
    note: '*Vaak* significa «a menudo»; *elke dag* significa «todos los días».'
    example_gloss:
    - Voy al gimnasio todos los días.
    - Noor va a menudo al gimnasio.
    - Hago deporte a menudo.
  nl.a2.unit91.lesson01.teach.gn_beginnen_te:
    title: Beginnen + te + infinitivo
    gloss: Empiezo a hacer deporte. Empiezo a comer de forma saludable. Noor empieza a dormir más temprano.
    note: Después de *beginnen*, pon *te* justo antes del infinitivo. El infinitivo (*sporten, eten, slapen*) va al final. Se dice *ik begin*, pero *Noor begint*.
  nl.a2.unit91.lesson01.teach.gn_te_achteraan:
    title: Las demás palabras van antes de te
    gloss: Empiezo a ir al gimnasio todos los días. Ella empieza a menudo a hacer deporte.
    note: Las demás palabras (*elke dag, naar de sportschool, vaak*) van entre *beginnen* y *te*. El par *te* + infinitivo se mantiene junto al final.
  nl.a2.unit91.lesson01.teach.zin:
    title: Dos acciones
    gloss: Empiezo a hacer deporte y a comer de forma saludable.
    note: Con dos acciones, en neerlandés normalmente se repite *te* delante de cada infinitivo, algo que en español también es habitual con la preposición «a».
  nl.a2.unit91.lesson02.teach.schermtijd:
    title: Hábitos que dejar
    gloss: fumar / comer dulces / jugar videojuegos / el teléfono / el tiempo de pantalla
    note: '*Snoepen* significa comer dulces o golosinas.'
    example_gloss:
    - Fumar no es saludable.
    - Como dulces todos los días.
    - Juego a menudo en el móvil.
    - Mi tiempo de pantalla es alto.
  nl.a2.unit91.lesson02.teach.minder:
    title: Ya no, menos
    gloss: dejar de / empezar / ya no / menos
    note: '*Niet meer* significa «ya no».'
    example_gloss:
    - Ya no fumo.
    - Juego menos.
    - Como menos dulces.
  nl.a2.unit91.lesson02.teach.gn_stoppen_met:
    title: Stoppen met
    gloss: Dejo de fumar. Noor deja de jugar a videojuegos. Ella deja de picotear.
    note: 'Después de *stoppen* se usa *met* más un sustantivo o un infinitivo. Aquí no hay *te*: no se dice *stoppen te roken*. Se dice *ik stop*, pero *Noor stopt*.'
  nl.a2.unit91.lesson02.teach.gn_beginnen_met:
    title: Beginnen met
    gloss: Empiezo a hacer deporte. Noor empieza a comer sano.
    note: '*Beginnen* también se puede usar con *met* + infinitivo o sustantivo, sin *te*. *Ik begin te sporten* e *Ik begin met sporten* significan lo mismo.'
  nl.a2.unit91.lesson02.teach.zin:
    title: Menos y ya no
    gloss: Como menos dulces y ya no juego a videojuegos.
    note: '*Minder* y *niet meer* indican hasta qué punto has cambiado un hábito.'
  nl.a2.unit91.lesson03.teach.proberen:
    title: Intentar y olvidar
    gloss: intentar / olvidar / llamar / leer
    note: '*Bellen* significa llamar por teléfono a alguien.'
    example_gloss:
    - Lo intento.
    - Lo olvido a menudo.
    - Llamo a Lotte.
    - Noor lee todos los días.
  nl.a2.unit91.lesson03.teach.gn_proberen_te:
    title: Proberen + te
    gloss: Intento dormir más temprano. Intento jugar menos a videojuegos. Noor intenta hacer deporte.
    note: Después de *proberen* se usa *te* + infinitivo, con el infinitivo al final. Se dice *ik probeer*, pero *Noor probeert*.
  nl.a2.unit91.lesson03.teach.gn_vergeten_te:
    title: Vergeten + te
    gloss: A menudo me olvido de llamar. Me olvidé de llamar. Me olvidé de llamar a Lotte.
    note: '*Vergeten* también lleva *te* + infinitivo. Un complemento corto (*Lotte*) va antes de *te*: *Lotte te bellen*.'
  nl.a2.unit91.lesson03.teach.gn_om_te:
    title: Om ... te opcional
    gloss: Intento dormir más temprano. Me olvidé de llamar.
    note: 'Después de *proberen* y *vergeten* puedes añadir *om*: *om ... te*. El significado es el mismo. En esta unidad se usa sobre todo la forma más corta, sin *om*.'
  nl.a2.unit91.lesson03.teach.gn_perfectum:
    title: Perfectum
    gloss: Empecé a hacer deporte. Dejé de fumar. Intenté dormir más temprano. Me olvidé de llamar.
    note: En el perfectum, *beginnen, stoppen* y *vergeten* llevan *zijn*, mientras que *proberen* lleva *hebben*. Con *ik* se usa *ben* y *heb*. El *te* + infinitivo (o *met* + actividad) se queda al final.
  nl.a2.unit91.lesson03.teach.gn_modaal:
    title: Te o sin te
    gloss: Quiero hacer deporte. Intento hacer deporte. Tengo que dormir. Intento dormir.
    note: Después de *willen* y *moeten* el infinitivo va solo, sin *te*. Después de *beginnen, proberen* y *vergeten* hace falta *te*.
  nl.a2.unit91.lesson04.teach.posities:
    title: De pie, sentado, tumbado
    gloss: estar de pie / estar sentado / estar tumbado / el sofá / la cama / la puerta
    note: En neerlandés se suele decir si alguien está de pie, sentado o tumbado, algo que en español muchas veces se deja sin precisar con el verbo «estar».
    example_gloss:
    - Él está sentado en el sofá.
    - Ella está tumbada en la cama.
    - Él está de pie junto a la puerta.
  nl.a2.unit91.lesson04.teach.tv:
    title: Pantallas y libros
    gloss: mirar / ver / la tele / el libro
    note: '*Kijken naar* significa mirar o ver.'
    example_gloss:
    - Él ve la tele.
    - Ella lee un libro.
  nl.a2.unit91.lesson04.teach.uren:
    title: Ya desde hace horas
    gloss: ya / horas
    note: '*Al uren* significa desde hace horas.'
    example_gloss:
    - Lleva horas sentado en el sofá.
    - Llevo horas jugando a videojuegos.
  nl.a2.unit91.lesson04.teach.gn_staan_te:
    title: Staan, zitten, liggen + te
    gloss: Él está leyendo (sentado). Ella está durmiendo (tumbada). Él está llamando (de pie). Ella está jugando a videojuegos (sentada).
    note: '*Staan, zitten* o *liggen* + *te* + infinitivo indica lo que alguien está haciendo ahora. El primer verbo muestra la postura: *zit, ligt, staat*.'
  nl.a2.unit91.lesson04.teach.gn_plaats:
    title: El lugar antes de te
    gloss: Él está leyendo en el sofá. Ella está durmiendo en la cama. Él está llamando junto a la puerta.
    note: 'Normalmente el lugar va antes de *te* + infinitivo. En la lengua hablada también se oye después: *Hij zit te lezen op de bank*.'
  nl.a2.unit91.lesson04.teach.zin:
    title: ¿Qué está haciendo?
    gloss: ¿Qué está haciendo? Lleva horas sentado jugando.
    note: '*Al uren* va antes de *te gamen* e indica cuánto tiempo lleva pasando.'
  nl.a2.unit91.lesson05.teach.reading:
    title: El plan de Noor
    gloss: Hola, Lotte, tengo un plan. Todas las noches me paso horas jugando a videojuegos y eso no es sano. Ahora dejo de jugar. Intento dormir más temprano. El lunes empiezo a hacer deporte. Ayer me olvidé de llamarte, ¡perdón! Mañana te llamo.
    note: Busca qué deja, intenta, empieza y olvida Noor.
    glosses:
      plan: plan
      avond: noche
      uren: horario
      dat: eso
      Nu: ahora
      Maandag: Lunes
      Gisteren: ayer
      je: te
      sorry: perdón
      Morgen: mañana
      heb: tengo
  nl.a2.unit91.lesson06.teach.lotte_vraag:
    title: Lotte pregunta
    gloss: 'Lotte: Hola, Omar, ¿ya has empezado a hacer deporte?'
  nl.a2.unit91.lesson06.teach.omar_gym:
    title: Omar responde
    gloss: 'Omar: ¡Sí, ya he empezado! Intento ir al gimnasio tres veces por semana.'
  nl.a2.unit91.lesson06.teach.lotte_snoepen:
    title: Lotte pregunta por los dulces
    gloss: 'Lotte: ¡Muy bien! ¿Y has dejado de picotear?'
  nl.a2.unit91.lesson06.teach.omar_nee:
    title: Omar lo admite
    gloss: 'Omar: No, todavía no lo consigo. Todas las noches me siento en el sofá a picotear.'
  nl.a2.unit91.lesson06.teach.lotte_vergeten:
    title: Lotte comparte algo
    gloss: 'Lotte: ¡Qué pena! Yo también me he olvidado de hacer deporte hoy.'
  nl.a2.unit91.lesson06.teach.omar_samen:
    title: Omar propone algo
    gloss: 'Omar: ¡Entonces mañana lo intentamos juntos!'
