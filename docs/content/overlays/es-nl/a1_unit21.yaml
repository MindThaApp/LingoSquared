teaching:
  nl.a1.unit21.lesson01.teach.blij_verdrietig_boos:
    title: Contento, triste y enfadado
    gloss: contento, triste, enfadado
    note: Tres palabras básicas y frecuentes para sentimientos, que se usan con zijn (ser, estar) para decir cómo te sientes.
    example_gloss:
    - Estoy contento.
    - Estoy triste.
    - Estoy enfadado.
  nl.a1.unit21.lesson01.teach.ben_blij:
    title: Decir que estás contento
    gloss: Estoy contento.
    note: '*Zijn* (estar) + adjetivo de sentimiento es el patrón básico, como en «Estoy contento».'
  nl.a1.unit21.lesson01.teach.niet_boos:
    title: Contrastar sentimientos
    gloss: No estoy enfadado, estoy triste.
    note: '*Niet* niega directamente *boos*; la segunda oración indica el sentimiento real.'
  nl.a1.unit21.lesson02.teach.waarom_blij:
    title: Preguntar por qué
    gloss: ¿Por qué estás contento?
    note: '*Waarom* (por qué) es la palabra interrogativa habitual para preguntar por una razón.'
  nl.a1.unit21.lesson02.teach.blij_omdat_appartement:
    title: Dar una razón
    gloss: Estoy contento porque tengo un apartamento nuevo.
    note: '*Omdat* (porque) introduce la oración de causa; el verbo pasa al final de esa oración (*heb* va después de *appartement*).'
  nl.a1.unit21.lesson02.teach.verdrietig_omdat_regent:
    title: Una razón negativa
    gloss: Estoy triste porque llueve.
    note: Reutiliza *regent* (llueve) de la unidad del tiempo como oración de causa.
  nl.a1.unit21.lesson03.teach.zenuwachtig:
    title: Nervioso
    gloss: nervioso
    note: La palabra habitual para el nerviosismo.
    example_gloss: Estoy nervioso por mi primer turno.
  nl.a1.unit21.lesson03.teach.eerste_dienst:
    title: Decir por qué estás nervioso
    gloss: Estoy nervioso por mi primer turno.
    note: '*Voor* (literalmente «para») introduce el motivo del nerviosismo, donde en español se suele decir «por» o «ante».'
  nl.a1.unit21.lesson03.teach.geen_zorgen:
    title: Tranquilizar a alguien
    gloss: No te preocupes.
    note: '*Maak je geen zorgen* (literalmente «no te hagas preocupaciones») es la frase fija habitual para tranquilizar.'
  nl.a1.unit21.lesson04.teach.hoe_voelt_omar:
    title: Preguntar cómo se siente alguien
    gloss: ¿Cómo se siente Omar?
    note: '*Voelen zich* (sentirse, reflexivo) es la forma habitual de preguntar por un estado emocional o describirlo, distinta del *voelen* físico de las lecciones de salud de la unidad 16.'
  nl.a1.unit21.lesson04.teach.hij_voelt_zich:
    title: Describir cómo se siente alguien
    gloss: Él se siente nervioso.
    note: '*Zich* (se) es el pronombre reflexivo de tercera persona, que acompaña a *voelt*.'
  nl.a1.unit21.lesson04.teach.waarom_voelt_hij:
    title: Preguntar por qué alguien se siente así
    gloss: ¿Por qué se siente nervioso?
    note: Combina *waarom* con el patrón *voelt zich* de *Hij voelt zich zenuwachtig*.
  nl.a1.unit21.lesson05.teach.bericht:
    title: Lee un mensaje sobre sentimientos
    gloss: 'Hola, Lotte: estoy un poco nervioso por mi primer turno solo. Pero también estoy contento, porque tengo un trabajo nuevo y un apartamento nuevo. Creo que saldrá bien.'
    note: Fíjate en por qué está nervioso el autor, qué lo hace feliz y cómo ve el futuro en general.
    glosses:
      beetje: un poco
      zenuwachtig: nervioso
      eerste: primer
      dienst: turno
      alleen: solo
      blij: contento
      want: porque
      nieuwe: nuevo
      baan: trabajo
      nieuw: nuevo
      appartement: apartamento
      denk: creo
      komt: irá (bien)
  nl.a1.unit21.lesson06.teach.lotte_ask_feeling:
    title: Lotte pregunta cómo se siente Omar
    gloss: 'Lotte: Hola, Omar, ¿cómo te sientes con tu primer turno?'
    note: '*Voor je eerste dienst* (por tu primer turno) reutiliza el patrón *voor* + sustantivo de la lección 3.'
  nl.a1.unit21.lesson06.teach.omar_admit_nervous:
    title: Omar admite que está nervioso
    gloss: 'Omar: Estoy un poco nervioso, la verdad.'
    note: '*Eerlijk gezegd* (sinceramente, la verdad) suaviza la confesión.'
  nl.a1.unit21.lesson06.teach.lotte_reassure:
    title: Lotte lo tranquiliza
    gloss: 'Lotte: No te preocupes, ¡lo harás bien!'
    note: '*Je kunt het goed* (literalmente «tú puedes bien con ello») es una expresión fija para animar a alguien.'
  nl.a1.unit21.lesson06.teach.omar_thanks_helps:
    title: Omar le da las gracias
    gloss: 'Omar: Gracias, de verdad me ayuda.'
    note: '*Helpt* es la forma de tercera persona de *helpen* (ayudar).'
  nl.a1.unit21.lesson06.teach.lotte_predict:
    title: Lotte anticipa el resultado
    gloss: 'Lotte: Y después seguro que estarás muy contento y orgulloso.'
    note: '*Vast* (seguro, seguramente) expresa una predicción con confianza; *trots* (orgulloso) es un adjetivo nuevo y útil.'
  nl.a1.unit21.lesson06.teach.omar_agree:
    title: Omar está de acuerdo
    gloss: 'Omar: Sí, yo también lo creo.'
    note: '*Dat denk ik ook* (literalmente «eso pienso yo también») es la forma natural de mostrarse de acuerdo con la opinión de alguien.'
  nl.a1.unit21.lesson06.teach.summary_pronouns:
    title: Resumir con is, zijn y hem
    gloss: Omar está nervioso por su primer turno. Lotte le ayuda.
    note: '*Is* es la forma de tercera persona de *zijn* (ser/estar); aquí *zijn* significa «su» (posesivo); *hem* significa «lo/le» (pronombre de objeto). Son tres palabras pequeñas pero esenciales para hablar de otra persona.'
