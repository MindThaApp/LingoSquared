course:
  title: Neerlandés A2
  description: Neerlandés A2 basado en la gramática para peticiones, ofrecimientos y respuestas corteses.
  learning_goal: Haz peticiones corteses con zou je/u ... kunnen, ofrece ayuda con zal ik, suaviza las órdenes con even y eens, y aprende a aceptar o rechazar.
units:
  nl.a2.unit89.beleefd_vragen:
    title: Peticiones corteses
    description: Pide ayuda, ofrécela, y acepta o rechaza con cortesía con amigos, vecinos y dependientes.
lessons:
  nl.a2.unit89.lesson01.zou_je_kunnen:
    title: ¿Podrías ayudarme?
  nl.a2.unit89.lesson02.je_of_u:
    title: ¿Je o u?
  nl.a2.unit89.lesson03.zal_ik:
    title: ¿Lo hago yo?
  nl.a2.unit89.lesson04.even_en_eens:
    title: Even y eens
  nl.a2.unit89.lesson05.graag_of_nee_hoor:
    title: Sí, por favor o no, gracias
  nl.a2.unit89.lesson06.koffie_bij_lotte:
    title: Café en casa de Lotte
teaching:
  nl.a2.unit89.lesson01.teach.buren:
    title: Vecinos y tiendas
    gloss: el vecino / la vecina / la tienda / el supermercado
    note: Estas palabras nombran a las personas y los lugares de esta unidad.
    example_gloss:
    - Mi vecino es amable.
    - El vecino va a la tienda.
    - El supermercado está abierto.
  nl.a2.unit89.lesson01.teach.spullen:
    title: Cosas por las que preguntas
    gloss: el bolso / la llave / el paquete / la compra
    note: '*Boodschappen* siempre va en plural: significa la compra.'
    example_gloss:
    - El bolso pesa mucho.
    - ¿Dónde está la llave?
    - El paquete es grande.
    - Tengo mucha compra.
  nl.a2.unit89.lesson01.teach.werkwoorden:
    title: Verbos para peticiones
    gloss: ayudar / traer / ir a buscar / comprar
    note: '*Halen* significa ir a buscar algo.'
    example_gloss:
    - Ayudo al vecino.
    - Traigo el paquete.
    - Voy a buscar pan.
    - Compro café.
  nl.a2.unit89.lesson01.teach.gn_zou_je:
    title: Una petición cortés con zou je ... kunnen
    gloss: ¿Podrías ayudarme?
    note: Zou je + lo que quieres + kunnen + el verbo. El verbo principal va al final del todo.
  nl.a2.unit89.lesson01.teach.zinnen:
    title: Tres peticiones corteses
    gloss: ¿Podrías ir a buscar la llave? ¿Podrías traer el paquete? ¿Podrías comprar la compra?
  nl.a2.unit89.lesson01.teach.natuurlijk:
    title: Aceptar una petición
    gloss: Sí, claro.
  nl.a2.unit89.lesson02.teach.diensten:
    title: Personas y servicios
    gloss: señor / señora / el panadero / la oficina de correos
    note: Usa *meneer* y *mevrouw* con personas a las que no conoces bien.
    example_gloss:
    - Buenos días, señor.
    - Buenas tardes, señora.
    - El panadero tiene pan.
    - La oficina de correos está cerca.
  nl.a2.unit89.lesson02.teach.brood:
    title: En la panadería y en correos
    gloss: el pan / este / pesar / cortar / envolver
    note: '*Dit* señala algo que está cerca de ti.'
    example_gloss:
    - El pan está fresco.
    - Este paquete pesa mucho.
  nl.a2.unit89.lesson02.teach.gn_u:
    title: Je o u
    gloss: ¿Podrías ayudarme? (a un amigo) ¿Podría ayudarme? (a un desconocido)
    note: Usa *je* con amigos y familia. Usa *u* con desconocidos, personas mayores y en muchas tiendas y oficinas. Solo cambia el pronombre; el resto de la frase queda igual.
  nl.a2.unit89.lesson02.teach.gn_alstublieft:
    title: 'Por favor: alsjeblieft o alstublieft'
    gloss: ¿Podrías pesar esto, por favor? (amigo) ¿Podría pesar esto, por favor? (formal)
    note: '*Alsjeblieft* va con *je*; *alstublieft*, con *u*.'
  nl.a2.unit89.lesson02.teach.zinnen:
    title: Peticiones formales
    gloss: ¿Podría cortar el pan? ¿Podría pesar este paquete? ¿Podría envolver esto?
  nl.a2.unit89.lesson03.teach.werkwoorden:
    title: Verbos para ofrecer ayuda
    gloss: llevar / preparar (café) / pagar / el café / para
    note: '*Koffie zetten* significa preparar café.'
    example_gloss:
    - Llevo la bolsa.
    - Preparo café para el vecino.
    - Pago el café.
  nl.a2.unit89.lesson03.teach.gn_zal:
    title: Ofrecer ayuda con zal ik
    gloss: ¿Llevo la bolsa?
    note: '*Zal ik ...?* sirve para ofrecerte a hacer algo tú mismo. El verbo principal va al final.'
  nl.a2.unit89.lesson03.teach.gn_voor:
    title: Voor je o voor u
    gloss: ¿Te preparo un café? (amigo) ¿Le preparo un café? (formal)
    note: Añade *voor je* si hablas con un amigo o *voor u* si hablas con un desconocido para indicar para quién es la ayuda.
  nl.a2.unit89.lesson03.teach.gn_contrast:
    title: Pedir u ofrecer
    gloss: ¿Podrías llevar la bolsa? ¿Llevo la bolsa?
    note: '*Zou je ... kunnen?* pide a la otra persona que actúe. *Zal ik ...?* ofrece hacerlo tú mismo.'
  nl.a2.unit89.lesson03.teach.zinnen:
    title: Tres ofrecimientos
    gloss: ¿Preparo café? ¿Voy a buscar la compra? ¿Pago yo?
  nl.a2.unit89.lesson04.teach.werkwoorden:
    title: Pequeñas acciones en la puerta
    gloss: dentro / sentarse / esperar / mirar / dar
    note: '*Binnen* va con *komen* (entrar).'
    example_gloss:
    - El vecino entra.
    - Me siento en la silla.
    - Espero al vecino.
    - Miro el paquete.
    - Doy la llave.
  nl.a2.unit89.lesson04.teach.gn_imperatief:
    title: El imperativo
    gloss: Entra. Siéntate. Espera. Mira. Dame la llave.
    note: 'El imperativo es la raíz del verbo, sin *je*: *komen* pasa a *kom*, *gaan* a *ga* y *geven* a *geef*.'
  nl.a2.unit89.lesson04.teach.gn_even_eens:
    title: Even y eens suavizan la orden
    gloss: Entra, anda. Siéntate un momento. Espera un momento. Echa un vistazo.
    note: '*Even* y *eens* hacen la orden más amable. *Even* a menudo solo suaviza la petición, y también puede sugerir algo breve.'
  nl.a2.unit89.lesson04.teach.gn_u_imperatief:
    title: Invitaciones corteses con u
    gloss: Pase, por favor. Siéntese, por favor.
    note: 'Para ser cortés con alguien a quien tratas de *u*, coloca el verbo conjugado antes de *u*: *komt u, gaat u*.'
  nl.a2.unit89.lesson04.teach.zinnen:
    title: Even en las peticiones
    gloss: Dame la llave un momento. ¿Podrías esperar un momento?
    note: '*Me* es la forma corta de *mij*.'
  nl.a2.unit89.lesson05.teach.woorden:
    title: En la puerta
    gloss: la puerta / abrir / pesado / mucho
    note: '*Opendoen* es un solo verbo: *Zal ik de deur opendoen?*'
    example_gloss:
    - El bolso pesa mucho.
    - Tengo mucha compra.
    - ¿Abro la puerta?
  nl.a2.unit89.lesson05.teach.gn_accept:
    title: Aceptar un ofrecimiento
    gloss: Sí, gracias. (amigo) Sí, gracias. (formal)
    note: '*Graag* significa «sí, por favor». Añade *dank je* con amigos y *dank u* en situaciones formales.'
  nl.a2.unit89.lesson05.teach.gn_decline:
    title: Rechazar un ofrecimiento con cortesía
    gloss: No, no hace falta, puedo yo.
    note: '*Het lukt wel* significa «puedo yo» o «me las arreglo». *Hoor* hace el *nee* más amable.'
  nl.a2.unit89.lesson05.teach.gn_verzoek:
    title: Responder a una petición
    gloss: Claro. Lo siento, no puedo.
    note: Para decir sí a una petición, usa *Natuurlijk*. Para decir no, usa *Sorry, dat lukt niet.*
  nl.a2.unit89.lesson05.teach.reading:
    title: Noor y sus vecinos
    gloss: 'Noor sale del supermercado. Lleva mucha compra y una bolsa pesada. El vecino la ve y le pregunta: ¿Llevo la bolsa? Noor dice: Sí, gracias. Luego la vecina le pregunta: ¿Abro la puerta? Noor dice: No, gracias, puedo yo.'
    note: Fíjate en qué ofrecimiento acepta Noor y cuál rechaza.
    glosses:
      uit: de (salir de)
      zware: pesada
      ziet: ve
      vraagt: pregunta
      zegt: dice
      dan: luego
  nl.a2.unit89.lesson06.teach.welkom:
    title: Lotte recibe a Omar
    gloss: 'Lotte: Hola, Omar, pasa un momento.'
  nl.a2.unit89.lesson06.teach.boodschappen:
    title: Omar tiene mucha compra
    gloss: 'Omar: Gracias. Tengo mucha compra.'
  nl.a2.unit89.lesson06.teach.tas:
    title: Lotte ofrece ayuda
    gloss: 'Lotte: ¿Llevo la bolsa?'
  nl.a2.unit89.lesson06.teach.koffie:
    title: Omar rechaza y pide algo
    gloss: 'Omar: No, gracias, puedo yo. ¿Podrías preparar café?'
  nl.a2.unit89.lesson06.teach.brood:
    title: Lotte acepta y ofrece más
    gloss: 'Lotte: Claro. Siéntate un momento. ¿Corto también el pan?'
  nl.a2.unit89.lesson06.teach.graag:
    title: Omar acepta
    gloss: 'Omar: Sí, gracias.'
