course:
  title: Neerlandés A2
  description: Neerlandés de nivel intermedio que continúa la historia de Lotte y Omar, ahora con un bloque centrado en la gramática para hablar del pasado.
unit:
  content_key: nl.a2.unit82.hoe_het_vroeger_was
  title: How things used to be
  description: Describe repeated past habits with the regular Dutch imperfectum and contrast earlier life with the present.
teaching:
  nl.a2.unit82.lesson01.teach.tijdwoorden:
    title: Antes y ahora
    gloss: antes, entonces, ahora, hoy en día
    note: Usa *vroeger* para un período anterior amplio y *toen* para un momento concreto.
    example_gloss:
    - Antes vivía en Utrecht.
    - Entonces era joven.
    - Ahora vivo en un apartamento.
    - Hoy en día voy al trabajo en bici.
  nl.a2.unit82.lesson01.teach.huisvesting:
    title: Viviendas y tamaño
    gloss: la casa, el apartamento, pequeño, grande
    note: '*Flat* significa apartamento, sobre todo el de un edificio de apartamentos.'
    example_gloss:
    - La casa es pequeña.
    - El apartamento es grande.
  nl.a2.unit82.lesson01.teach.gn_vorm:
    title: El imperfectum regular
    gloss: wonen → woonde; werken → werkte
    note: Las formas regulares del pasado en singular se forman con la raíz más *-te* o *-de*.
  nl.a2.unit82.lesson01.teach.contrast:
    title: Un contraste entre antes y ahora
    gloss: Antes vivía en una casa pequeña; ahora vivo en un apartamento.
    note: La oración del pasado usa *woonde*; la del presente usa *woon*.
  nl.a2.unit82.lesson02.teach.werkwoorden:
    title: Verbos cotidianos
    gloss: ir en bici, hacer, jugar, aprender, vivir, trabajar
    note: Con estos verbos regulares puedes practicar las dos terminaciones del imperfectum.
    example_gloss:
    - Voy a la escuela en bici.
    - Hago los deberes.
    - Los niños juegan fuera.
    - Aprendemos neerlandés.
    - Vivimos en Utrecht.
    - Trabajo en el hospital.
  nl.a2.unit82.lesson02.teach.schoolwoorden:
    title: Lugares de escuela y trabajo
    gloss: la escuela, los deberes, fuera, el hospital
    note: Palabras útiles para describir una rutina del pasado.
    example_gloss:
    - Voy a la escuela en bici.
    - Después de la escuela hago los deberes.
    - Jugamos fuera.
    - Lotte trabaja en el hospital.
  nl.a2.unit82.lesson02.teach.gn_kofschip:
    title: La regla del 't kofschip
    gloss: raíz que termina en t, k, f, s, ch o p → -te; en los demás casos → -de
    note: 'Fíjate en el sonido final de la raíz: *werk-te*, *fiets-te*, pero *woon-de* y *leer-de*.'
  nl.a2.unit82.lesson02.teach.vormen:
    title: Seis formas del singular
    gloss: Yo trabajaba, iba en bici, hacía, jugaba, aprendía, vivía.
    note: La misma forma del singular se usa con *ik*, *jij* y *hij/zij*.
  nl.a2.unit82.lesson02.teach.elke_dag:
    title: Cada día
    gloss: Todos los días iba en bici a la escuela.
    note: '*Elke* se usa con una palabra de género de: *elke dag*.'
  nl.a2.unit82.lesson03.teach.gewoonte:
    title: Expresiones de tiempo para hábitos
    gloss: siempre, todos los días, todos los veranos, a menudo
    note: Estas expresiones dejan claro que se trata de un hábito repetido del pasado.
    example_gloss:
    - Siempre iba en bici a la escuela.
    - Todos los días hacía los deberes.
    - Todos los veranos nos quedábamos con el abuelo y la abuela.
    - A menudo jugábamos fuera.
  nl.a2.unit82.lesson03.teach.familie:
    title: Familia y barrio
    gloss: el abuelo y la abuela; el barrio
    note: '*Bij opa en oma* significa en casa del abuelo y la abuela.'
    example_gloss:
    - El abuelo y la abuela vivían en Utrecht.
    - El barrio era tranquilo.
  nl.a2.unit82.lesson03.teach.logeren:
    title: Quedarse como invitado
    gloss: pasar la noche / quedarse como invitado
    note: '*Logeren bij* se usa para quedarse en casa de alguien.'
    example_gloss: Nos quedamos con el abuelo y la abuela.
  nl.a2.unit82.lesson03.teach.gn_number:
    title: Singular y plural
    gloss: yo vivía; nosotros vivíamos
    note: 'Las formas regulares del plural añaden *-n* al imperfectum del singular: *werkte → werkten*, *woonde → woonden*.'
  nl.a2.unit82.lesson03.teach.chunks:
    title: Cuatro bloques irregulares útiles
    gloss: yo era; yo tenía; yo iba; yo venía
    note: Considera *was*, *had*, *ging* y *kwam* como vocabulario fijo por ahora, junto con *stond* y *deed*, que aparecen en la lectura y en el diálogo. Su sistema llegará más adelante.
  nl.a2.unit82.lesson03.teach.plural:
    title: Un hábito del pasado en plural
    gloss: Vivíamos en un barrio tranquilo y a menudo jugábamos fuera.
    note: 'Los dos verbos en plural terminan en *-en*: *woonden*, *speelden*.'
  nl.a2.unit82.lesson04.teach.plaats:
    title: Lugares y distancia
    gloss: cerca de, lejos de, la tienda, el parque infantil
    note: Usa *dicht bij* y *ver van* antes de un lugar.
    example_gloss:
    - La escuela está cerca de mi casa.
    - El hospital está lejos de mi casa.
    - La tienda está en el barrio.
    - Los niños juegan en el parque infantil.
  nl.a2.unit82.lesson04.teach.gn_habit:
    title: ¿Por qué el imperfectum aquí?
    gloss: Antes iba en bicicleta al colegio todos los días.
    note: En esta unidad se usa el imperfectum para costumbres y situaciones repetidas en el pasado; no se compara el imperfectum con el perfectum.
  nl.a2.unit82.lesson04.teach.buurtzin:
    title: El barrio de antes
    gloss: Antes vivía cerca del colegio y siempre jugaba en el parque infantil.
    note: 'Después de *en*, el sujeto compartido va detrás del segundo verbo en pasado: *en speelde ik*.'
  nl.a2.unit82.lesson04.teach.nuzin:
    title: La situación de ahora
    gloss: Ahora vivo lejos del colegio y trabajo en el hospital.
    note: Los dos verbos están en presente porque *nu* marca el tiempo actual.
  nl.a2.unit82.lesson05.teach.jeugd:
    title: La infancia
    gloss: la infancia; después del colegio
    note: '*Jeugd* es la etapa de la vida en que alguien es joven.'
    example_gloss:
    - Mi infancia fue bonita.
    - Después del colegio hacía los deberes.
  nl.a2.unit82.lesson05.teach.reading:
    title: 'Lectura: la infancia de Lotte'
    gloss: Cuando Lotte era pequeña, vivía con sus padres en Utrecht. Su casa era pequeña y estaba cerca de su colegio. Todos los días iba en bicicleta al colegio. Después del colegio jugaba fuera y hacía los deberes. Cada verano Lotte y sus padres se alojaban en casa de sus abuelos. Hoy en día Lotte vive en un piso y trabaja como enfermera en el hospital.
    note: Busca las costumbres repetidas marcadas con *elke dag* y *elke zomer*, y luego el contraste con el presente marcado con *tegenwoordig*.
  nl.a2.unit82.lesson06.teach.omar01:
    title: Omar pregunta por Utrecht
    gloss: 'Omar: ¿Antes también vivías en Utrecht?'
  nl.a2.unit82.lesson06.teach.lotte01:
    title: Lotte describe su antigua casa
    gloss: 'Lotte: Sí, vivía con mis padres en una casa pequeña.'
  nl.a2.unit82.lesson06.teach.omar02:
    title: Omar pregunta por la rutina
    gloss: 'Omar: ¿Qué hacías después del colegio?'
  nl.a2.unit82.lesson06.teach.lotte02:
    title: Lotte enumera tres costumbres
    gloss: 'Lotte: Volvía a casa en bicicleta, jugaba fuera y después hacía los deberes.'
  nl.a2.unit82.lesson06.teach.lotte03:
    title: Lotte contrasta con el presente
    gloss: 'Lotte: Ahora vivo en un piso y trabajo en el hospital.'
  nl.a2.unit82.lesson06.teach.gn_recap:
    title: Antes y ahora
    gloss: vroeger + imperfectum; nu + presente
    note: Usa el imperfectum para la situación repetida del pasado y el presente para el contraste actual.
