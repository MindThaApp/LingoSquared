teaching:
  nl.a2.unit80.lesson01.teach.verzetten:
    title: Cambiar una cita
    gloss: aplazar (una cita) / cancelar
    note: '*Een afspraak verzetten* significa pasarla a otra hora. *Annuleren* significa cancelarla del todo.'
    example_gloss:
    - Quiero aplazar mi cita.
    - Tengo que cancelar mi cita.
  nl.a2.unit80.lesson01.teach.helaas_sorry:
    title: Pedir disculpas
    gloss: lamentablemente / perdón
    note: '*Helaas* es una forma educada de dar una mala noticia. *Sorry* es la disculpa de todos los días.'
    example_gloss:
    - Lamentablemente no puedo ir.
    - Perdón, llego demasiado tarde.
  nl.a2.unit80.lesson01.teach.kapsalon:
    title: La peluquería
    gloss: la peluquería
    note: '*Het kapsalon* es el local; *de kapper* es la persona. Se suele decir *naar de kapper* para ambos.'
    example_gloss: La peluquería abre de nueve a seis.
  nl.a2.unit80.lesson01.teach.kan_verzetten:
    title: Pedir que se aplace una cita
    gloss: ¿Puedo cambiar mi cita?
    note: 'Una pregunta de sí o no empieza por el verbo: *Kan ik ...?* El infinitivo *verzetten* va al final.'
  nl.a2.unit80.lesson01.teach.helaas_niet_komen:
    title: Decir que no puedes ir
    gloss: Lamentablemente no puedo ir.
  nl.a2.unit80.lesson01.teach.gn_kan:
    title: Kan + infinitivo
    gloss: El jueves no puedo ir. ¿Puedo aplazar la cita?
    note: 'Después de *kan*, el segundo verbo va en infinitivo al final de la frase. En una oración afirmativa, *niet* va antes de ese infinitivo: *Ik kan donderdag niet komen*. Una palabra de tiempo como *donderdag* va antes de *niet*. En una pregunta, *kan* va primero: *Kan ik de afspraak verzetten?*'
  nl.a2.unit80.lesson02.teach.andere_dag:
    title: Otro día
    gloss: otro día
    note: '*Andere* termina en -e después de *een* porque *dag* es una palabra que usa el artículo de.'
    example_gloss: ¿Puede ser también otro día?
  nl.a2.unit80.lesson02.teach.kan_ook_maandag:
    title: Proponer un día
    gloss: ¿Podría ser también el lunes?
    note: 'En neerlandés aquí no se usa preposición ni artículo delante del día de la semana: *maandag*, no *op maandag*.'
  nl.a2.unit80.lesson02.teach.kan_ook_dinsdag:
    title: Otro día
    gloss: ¿Podría ser también el martes?
  nl.a2.unit80.lesson02.teach.komt_uit:
    title: ¿Le viene bien?
    gloss: ¿Le viene bien el viernes? (formal)
    note: '*Uitkomen* significa ''venir bien''. Es un verbo separable, así que *uit* va al final: *Komt vrijdag u uit?* El *u* de cortesía se usa con alguien a quien no conoces bien.'
  nl.a2.unit80.lesson02.teach.komt_goed_uit:
    title: Decir que sí
    gloss: Sí, me viene bien.
  nl.a2.unit80.lesson02.teach.helaas_niet:
    title: Decir que no con educación
    gloss: Lamentablemente no.
  nl.a2.unit80.lesson02.teach.gn_uitkomen:
    title: ¿Le viene bien?
    gloss: ¿Le viene bien el viernes? Sí, me viene bien. No, lamentablemente no.
    note: '*Uitkomen* es un verbo separable: en presente, *uit* pasa al final de la frase. La pregunta empieza por el verbo: *Komt vrijdag u uit?* La respuesta *Ja, dat komt goed uit* confirma. Una negativa educada es *Nee, helaas niet*.'
  nl.a2.unit80.lesson03.teach.want:
    title: Porque y lo siento
    gloss: porque / lo siento
    note: '*Want* une dos oraciones completas y da el motivo. *Het spijt me* es una disculpa más cuidada que *sorry*.'
    example_gloss:
    - No puedo venir porque estoy enfermo.
    - Lo siento.
  nl.a2.unit80.lesson03.teach.ongemak:
    title: La molestia
    gloss: la molestia
    note: '*Sorry voor het ongemak* es una frase educada para cuando has causado un problema extra a alguien.'
    example_gloss: Disculpe las molestias.
  nl.a2.unit80.lesson03.teach.werken:
    title: 'Motivo: el trabajo'
    gloss: No puedo ir, porque tengo que trabajar.
  nl.a2.unit80.lesson03.teach.andere_afspraak:
    title: 'Motivo: otra cita'
    gloss: No puedo venir porque tengo otra cita.
  nl.a2.unit80.lesson03.teach.gn_want:
    title: 'Porque: want'
    gloss: No puedo venir porque estoy enfermo.
    note: 'Después de *want* el orden de las palabras es el normal: sujeto y luego verbo. Se pone una coma antes de *want*: *Ik kan niet komen, want ik ben ziek.* Compáralo con *omdat*, que manda el verbo al final; aquí se usa *want*.'
  nl.a2.unit80.lesson04.teach.afspreken:
    title: Quedar y con antelación
    gloss: quedar, acordar / con antelación
    note: '*Afspreken* es acordar juntos una hora o un lugar. *Van tevoren* significa ''de antemano'', ''con antelación''.'
    example_gloss:
    - ¿Quedamos?
    - Llama un día antes.
  nl.a2.unit80.lesson04.teach.maandag_tien:
    title: Aceptar una hora
    gloss: El lunes a las diez está bien.
  nl.a2.unit80.lesson04.teach.kunt_u:
    title: Preguntar si una hora le viene bien
    gloss: ¿Puede venir el lunes a las diez? (formal)
    note: '*Kunt u* es la forma de cortesía de *kun je*. El infinitivo *komen* va al final.'
  nl.a2.unit80.lesson04.teach.zie_u_maandag:
    title: Cerrar el acuerdo
    gloss: Entonces nos vemos el lunes.
  nl.a2.unit80.lesson04.teach.nieuwe_afspraak:
    title: Hacer una nueva cita
    gloss: Entonces haré una nueva cita.
  nl.a2.unit80.lesson04.teach.gn_tijd:
    title: Primero el día, luego la hora
    gloss: El lunes a las diez va bien. ¿Puede venir el lunes a las diez?
    note: 'Cuando das un día y una hora, primero va el día y luego *om* + la hora: *maandag om tien uur*. En una pregunta de cortesía se usa *Kunt u ...?* y el infinitivo va al final.'
  nl.a2.unit80.lesson05.teach.kapsalon_bericht:
    title: Un mensaje de la peluquería
    gloss: 'Estimado Omar: su cita ha sido aplazada. Su nueva cita es el lunes a las diez. ¿No le viene bien? Entonces llámenos un día antes. Entonces haremos una nueva cita. ¡Hasta el lunes! Peluquería Jansen'
    note: Es un mensaje breve típico de una empresa, por eso usa el *u* y el *uw* de cortesía. *Is verzet* significa 'ha sido aplazada'.
    glosses:
      beste: estimado
      omar: Omar
      uw: su (formal)
      afspraak: cita
      verzet: aplazada
      nieuwe: nuevo
      maandag: lunes
      tien: diez
      uur: horas
      komt: viene bien (komt ... uit)
      dit: esto
      niet: 'no'
      uit: (parte de komt ... uit)
      bel: llamar
      ons: nos
      dan: entonces
      tevoren: con antelación
      maken: hacemos
      we: nosotros
      tot: hasta, nos vemos
      kapsalon: peluquería
      jansen: Jansen
  nl.a2.unit80.lesson06.teach.kapper_opening:
    title: La peluquería contesta
    gloss: 'Peluquería: Kapsalon Jansen, buenas tardes.'
  nl.a2.unit80.lesson06.teach.omar_vraagt:
    title: Omar explica y pregunta
    gloss: 'Omar: Buenas tardes, soy Omar. Tengo una cita el jueves, pero lamentablemente no puedo ir. ¿Puedo cambiar la cita?'
  nl.a2.unit80.lesson06.teach.kapper_vrijdag:
    title: La peluquera propone el viernes
    gloss: 'Peluquera: Por supuesto. ¿Le viene bien el viernes?'
  nl.a2.unit80.lesson06.teach.omar_maandag:
    title: Omar propone el lunes
    gloss: 'Omar: Lamentablemente no, porque tengo que trabajar. ¿Podría ser también el lunes?'
  nl.a2.unit80.lesson06.teach.kapper_tien:
    title: La peluquera acepta
    gloss: 'Peluquera: El lunes a las diez está bien.'
  nl.a2.unit80.lesson06.teach.omar_dank:
    title: Omar acepta y se disculpa
    gloss: 'Omar: Me viene muy bien. Muchas gracias y disculpe las molestias.'
  nl.a2.unit80.lesson06.teach.kapper_einde:
    title: La peluquera se despide
    gloss: 'Peluquera: Ningún problema. ¡Hasta el lunes!'
