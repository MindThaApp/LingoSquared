course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para predecir y prometer.
  learning_goal: Predice lo que pasará y haz una promesa con zullen, contrástalo con gaan y expresa duda con misschien.
units:
  nl.a2.unit86.voorspellingen_en_beloftes:
    title: Predicciones y promesas
    description: Da un pronóstico, haz una promesa y di lo que podría pasar.
lessons:
  nl.a2.unit86.lesson01.het_weer_van_morgen:
    title: El tiempo de mañana
  nl.a2.unit86.lesson02.ik_zal_het_doen:
    title: Lo haré
  nl.a2.unit86.lesson03.zullen_of_gaan:
    title: ¿Zullen o gaan?
  nl.a2.unit86.lesson04.misschien:
    title: Quizá
  nl.a2.unit86.lesson05.bericht_en_mededeling:
    title: Un mensaje y un aviso
  nl.a2.unit86.lesson06.lotte_en_omar_beloven:
    title: Lotte y Omar hacen promesas
teaching:
  nl.a2.unit86.lesson01.teach.weer:
    title: El tiempo
    gloss: el tiempo (meteorológico) / el sol / mañana / hoy / frío / caliente, cálido
    note: Estas palabras describen el tiempo y el día.
    example_gloss:
    - Hoy hace calor.
    - El sol brilla.
    - Mañana hace frío.
  nl.a2.unit86.lesson01.teach.werkwoorden:
    title: Verbos del tiempo
    gloss: llover / brillar / ser, estar
    note: '*Regent* y *schijnt* son formas del presente para hoy. Esta unidad añade el futuro.'
    example_gloss:
    - Hoy llueve.
    - Hoy brilla el sol.
    - Hace calor.
  nl.a2.unit86.lesson01.teach.verwachting:
    title: El pronóstico
    gloss: el pronóstico del tiempo / según
    note: '*Volgens* introduce la fuente de una predicción.'
    example_gloss:
    - El pronóstico es bueno.
    - Según el pronóstico, mañana hace calor.
  nl.a2.unit86.lesson01.teach.gn_zullen_vormen:
    title: 'Zullen: las formas'
    gloss: yo + futuro / tú + futuro / él, ella + futuro / nosotros, ellos + futuro
    note: '*Zullen* es el verbo de la predicción y la promesa. El singular es *zal* (con *jij/je* también *zult*) y el plural es *zullen*. En el habla reducida: *we, ze, je*.'
  nl.a2.unit86.lesson01.teach.gn_zullen_zin:
    title: Zullen + infinitivo
    gloss: Mañana lloverá. Mañana lloverá.
    note: '*Zal* es el verbo conjugado y ocupa la segunda posición; el infinitivo va al final de la oración. Si una expresión de tiempo va primero, el sujeto va después de *zal*: *Morgen zal het regenen*. Usa *zullen* para un pronóstico.'
  nl.a2.unit86.lesson01.teach.zinnen:
    title: Frases de pronóstico
    gloss: Según el pronóstico, mañana brillará el sol. Hará frío.
  nl.a2.unit86.lesson02.teach.beloftes:
    title: Palabras de promesa
    gloss: prometer / la promesa / hacer / ayudar / llamar
    note: Estos verbos son frecuentes en las promesas.
    example_gloss:
    - Lo prometo.
    - Eso es una promesa.
    - Puedo ayudarte.
    - ¿Me llamarías?
  nl.a2.unit86.lesson02.teach.afspraken:
    title: Compromisos
    gloss: a tiempo / seguro, sin duda / olvidar / venir / no
    note: '*Op tijd* significa a tiempo, no tarde.'
    example_gloss:
    - Llega a tiempo.
    - No lo he olvidado.
    - Seguro que lo haré.
  nl.a2.unit86.lesson02.teach.gn_belofte:
    title: Zullen para una promesa
    gloss: Lo haré. Te ayudaré. Te llamaré.
    note: Con *ik*, *zal* puede expresar una promesa o un compromiso firme. El infinitivo (*doen, helpen, bellen*) va al final.
  nl.a2.unit86.lesson02.teach.gn_niet:
    title: Niet y op tijd
    gloss: No lo olvidaré. Llegaré a tiempo.
    note: '*Niet* suele ir después de *het* y antes del infinitivo final: *het niet vergeten*. Una expresión como *op tijd* también va antes del infinitivo final.'
  nl.a2.unit86.lesson02.teach.zinnen:
    title: Frases de promesa
    gloss: Llegaremos a tiempo. Seguro que lo haré.
  nl.a2.unit86.lesson03.teach.signalen:
    title: Señales y planes
    gloss: mira / la nube / oscuro / esta noche / trabajar / cocinar
    note: '*Kijk* llama la atención sobre algo que se puede ver.'
    example_gloss:
    - Mira, las nubes están oscuras.
    - Omar trabaja hoy.
    - Quiero cocinar esta noche.
  nl.a2.unit86.lesson03.teach.gn_gaan_plan:
    title: Gaan para un plan
    gloss: Mañana voy a trabajar. Omar va a cocinar esta noche.
    note: '*Gaan* + infinitivo indica lo que alguien tiene pensado hacer. El infinitivo va al final.'
  nl.a2.unit86.lesson03.teach.gn_gaan_zicht:
    title: Gaan para lo que se ve venir
    gloss: Mira, las nubes están oscuras. Va a llover.
    note: 'Usa *gaan* cuando ves la señal en ese momento: nubes oscuras, por tanto *Het gaat regenen*.'
  nl.a2.unit86.lesson03.teach.gn_contrast:
    title: Zullen frente a gaan
    gloss: Mañana lloverá (pronóstico). Mira, va a llover (lo veo). Mañana voy a trabajar (plan). Lo haré (promesa).
    note: 'En esta unidad: *zullen* para un pronóstico o una promesa, *gaan* para un plan o algo que se ve venir. En el habla cotidiana *gaan* también es frecuente para predicciones e incluso promesas (*Ik ga het doen*); *zullen* es más típico de pronósticos, avisos y promesas formales.'
  nl.a2.unit86.lesson03.teach.zinnen:
    title: Frases con gaan
    gloss: Mira, va a llover. Mañana voy a trabajar.
  nl.a2.unit86.lesson04.teach.misschien_woorden:
    title: Quizá y tarde
    gloss: quizá / más tarde / tarde / demasiado tarde
    note: '*Misschien* indica que no estás seguro.'
    example_gloss:
    - Quizá venga más tarde.
    - Es tarde.
    - El autobús llega tarde.
  nl.a2.unit86.lesson04.teach.week:
    title: Trabajo y citas
    gloss: la cita / el trabajo / el compañero de trabajo / lunes / viernes / sábado
    note: Los días de la semana se escriben con minúscula en neerlandés, igual que en español.
    example_gloss:
    - Lotte tiene una cita el viernes.
    - Omar tiene trabajo el lunes.
    - Noor trabaja el sábado.
  nl.a2.unit86.lesson04.teach.gn_misschien_voorop:
    title: Misschien al principio
    gloss: Quizá Noor venga mañana. Quizá llueva.
    note: 'Cuando *misschien* abre la frase, el verbo va justo después y el sujeto lo sigue: *komt Noor*, *regent het*. No pongas el sujeto antes del verbo.'
  nl.a2.unit86.lesson04.teach.gn_misschien_midden:
    title: Misschien después del verbo
    gloss: Puede que Noor venga mañana. Puede que llueva.
    note: '*Misschien* también puede ir después del verbo. El verbo sigue en segunda posición y el significado es el mismo.'
  nl.a2.unit86.lesson04.teach.gn_zeker:
    title: Zeker o misschien
    gloss: Seguro que lloverá. Quizá llueva.
    note: '*Zeker* indica que estás seguro; *misschien*, que no lo estás. Los dos se combinan con *zal*.'
  nl.a2.unit86.lesson04.teach.zinnen:
    title: Frases con «quizá»
    gloss: Quizá llegue tarde. Quizá Omar tenga tiempo. Quizá haga frío.
  nl.a2.unit86.lesson05.teach.bericht_woorden:
    title: Palabras de mensajes
    gloss: quedarse / comprar / café / galletas / también / entonces / hasta / en casa
    note: '*Tot zaterdag* significa «hasta el sábado».'
    example_gloss:
    - Me quedo en casa.
    - Quiero comprar café.
    - ¡Hasta mañana!
  nl.a2.unit86.lesson05.teach.mededeling_woorden:
    title: Palabras de un aviso
    gloss: el aviso / la reunión / a las nueve / todos / allí
    note: '*Om negen uur* indica la hora. *Er zal koffie zijn* significa «habrá café».'
    example_gloss:
    - Esto es un aviso.
    - La reunión es hoy.
    - Todos están allí.
  nl.a2.unit86.lesson05.teach.gn_weerbericht:
    title: Estilo de pronóstico
    gloss: Por la mañana brillará el sol. Por la tarde lloverá.
    note: Los pronósticos y los avisos usan mucho *zullen*. Una expresión de tiempo abre la frase, así que *zal* va a continuación y el sujeto después.
  nl.a2.unit86.lesson05.teach.lezen_bericht:
    title: El mensaje de Noor
    gloss: 'Hola, Lotte y Omar: según el pronóstico del tiempo, el sábado lloverá. Quizá nos quedemos en casa entonces. Yo compraré café y galletas. También llegaré puntual. ¡Hasta el sábado! Noor'
    note: Busca la predicción, el plan incierto y las promesas.
    glosses:
      volgens: según
      weersverwachting: pronóstico del tiempo
      blijven: quedarse
      koffie: café
      koekjes: galletas
      kopen: compran
      tot: hasta / nos vemos
  nl.a2.unit86.lesson05.teach.lezen_mededeling:
    title: Un aviso
    gloss: Aviso. Mañana la reunión comenzará a las nueve. Todos llegarán puntuales. Habrá café.
    note: Un aviso dice lo que va a ocurrir.
    glosses:
      vergadering: reunión
      negen: nueve
      uur: en punto / hora
      iedereen: todo el mundo
      koffie: café
  nl.a2.unit86.lesson06.teach.lotte1:
    title: Lotte pregunta por el sábado
    gloss: 'Lotte: Hola, Omar, ¿vas a trabajar el sábado?'
  nl.a2.unit86.lesson06.teach.omar1:
    title: Omar no está seguro
    gloss: 'Omar: Quizá trabaje el sábado. Te llamaré.'
  nl.a2.unit86.lesson06.teach.lotte2:
    title: Lotte da el pronóstico
    gloss: 'Lotte: Según el pronóstico del tiempo, el sábado lloverá.'
  nl.a2.unit86.lesson06.teach.omar2:
    title: Omar hace un plan
    gloss: 'Omar: Entonces quizá me quede en casa. Voy a cocinar.'
  nl.a2.unit86.lesson06.teach.lotte3:
    title: Lotte se ofrece a comprar galletas
    gloss: 'Lotte: ¡Genial! Yo compraré galletas.'
  nl.a2.unit86.lesson06.teach.omar3:
    title: Omar pide una promesa
    gloss: 'Omar: ¿Lo prometes?'
  nl.a2.unit86.lesson06.teach.lotte4:
    title: Lotte promete
    gloss: 'Lotte: Lo prometo.'
