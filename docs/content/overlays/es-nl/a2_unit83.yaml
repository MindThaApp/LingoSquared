course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para hablar de incidentes pasados.
  learning_goal: Une una situación de fondo y un suceso con formas irregulares del imperfectum, toen y terwijl.
units:
  nl.a2.unit83.wat_gebeurde_er:
    title: ¿Qué pasó?
    description: Describe un pequeño incidente, un cambio de tiempo o un problema de tráfico en imperfectum.
lessons:
  nl.a2.unit83.lesson01.onregelmatige_vormen:
    title: ¿Qué pasó?
  nl.a2.unit83.lesson02.vormen_combineren:
    title: Combinar formas
  nl.a2.unit83.lesson03.toen_en_terwijl:
    title: Toen y terwijl
  nl.a2.unit83.lesson04.een_klein_incident:
    title: Un pequeño incidente
  nl.a2.unit83.lesson05.noors_bericht:
    title: El mensaje de Noor
  nl.a2.unit83.lesson06.lotte_en_omar:
    title: Lotte y Omar en la carretera
teaching:
  nl.a2.unit83.lesson01.teach.incidenten:
    title: Pequeños incidentes
    gloss: el pinchazo / el chubasco / el retraso
    note: Estos sustantivos nombran los problemas de esta unidad.
    example_gloss:
    - Mi bicicleta tiene una rueda pinchada.
    - De repente llegó un chubasco.
    - El autobús llevaba retraso.
  nl.a2.unit83.lesson01.teach.verkeer:
    title: De camino
    gloss: la bicicleta / el autobús / la parada de autobús / de camino
    note: '*Onderweg* describe el hecho de estar en pleno trayecto.'
    example_gloss:
    - Mi bicicleta estaba en la parada del autobús.
    - El autobús llegó tarde.
    - Empezó a llover de camino.
  nl.a2.unit83.lesson01.teach.weer:
    title: El tiempo y la hora
    gloss: llover / fuerte / de repente / tarde
    note: '*Hard regenen* significa llover con fuerza.'
    example_gloss:
    - Empezó a llover fuerte.
    - De repente llegó el autobús.
    - El autobús llegó tarde.
  nl.a2.unit83.lesson01.teach.gn_irregular_basis:
    title: Seis verbos irregulares en imperfectum
    gloss: ser/estar → era/estaba, eran; tener → tenía; ir → iba; venir → venía; ver → veía; decir → decía
    note: 'Aprende estas formas del imperfectum como un conjunto. El singular y el plural suelen ser distintos: *was/waren, ging/gingen, kwam/kwamen*.'
  nl.a2.unit83.lesson01.teach.gn_irregular_set:
    title: Seis formas irregulares más
    gloss: tomar → tomó; dar → dio; estar de pie → estaba de pie; estar sentado → estaba sentado; caminar → caminó; ir (en vehículo) → fue
    note: Las formas del singular son *nam, gaf, stond, zat, liep,* y *reed*.
  nl.a2.unit83.lesson01.teach.vraag:
    title: Preguntar qué pasó
    gloss: ¿Qué pasó de camino?
    note: '*Gebeurde* es el imperfectum de *gebeuren*.'
  nl.a2.unit83.lesson01.teach.zinnen:
    title: Formas irregulares en contexto
    gloss: Estaba de camino. El autobús llevaba retraso. Vi un chubasco y tomé el autobús.
  nl.a2.unit83.lesson02.teach.handeling:
    title: Verbos de incidentes
    gloss: esperar / llamar / ir en bicicleta / empezar / recibir
    note: Estos verbos construyen el contexto y el suceso.
    example_gloss:
    - Tengo que esperar el autobús.
    - Lotte quiere llamarme.
    - Quiero volver a casa en bicicleta.
    - Puede empezar a llover.
    - Puede que se me pinche una rueda.
  nl.a2.unit83.lesson02.teach.regular_review:
    title: Imperfectum regular e irregular
    gloss: esperó / llamó / fue en bicicleta / ocurrió / empezó / recibió
    note: Las formas regulares *wachtte, belde,* y *fietste* siguen la regla de la Unidad 82. *Begon* y *kreeg* son irregulares.
  nl.a2.unit83.lesson02.teach.phrases:
    title: Cuatro frases de incidentes
    gloss: Volvía a casa en bicicleta. Lotte llamó. Empezó a llover. Se me pinchó una rueda.
  nl.a2.unit83.lesson03.teach.connectors:
    title: Conectores de tiempo
    gloss: cuando / mientras / junto a
    note: Usa *toen* para un momento del pasado y *terwijl* para situaciones que se solapan.
    example_gloss:
    - Cuando llegué a casa, llamó Lotte.
    - Mientras esperaba, llovía.
    - Estaba junto a mi bici.
  nl.a2.unit83.lesson03.teach.gn_toen:
    title: Toen con el verbo al final
    gloss: Cuando iba en bici a casa, empezó a llover.
    note: 'Después de *toen*, el verbo de la oración subordinada va al final: *ik naar huis fietste*.'
  nl.a2.unit83.lesson03.teach.gn_terwijl:
    title: Terwijl para una situación de fondo
    gloss: Mientras esperaba el autobús, llamó Lotte.
    note: 'Después de *terwijl*, el verbo va al final: *ik op de bus wachtte*.'
  nl.a2.unit83.lesson03.teach.gn_inversion:
    title: Inversión después de la oración inicial
    gloss: 'Después de una oración inicial con toen o terwijl, el verbo conjugado va antes del sujeto: begon het; belde Lotte.'
    note: La coma cierra la oración subordinada; la oración principal empieza con *begon het* o *belde Lotte*.
  nl.a2.unit83.lesson03.teach.gn_contrast:
    title: Toen frente a terwijl
    gloss: Toen indica el momento en que ocurrió algo. Terwijl une dos situaciones que estaban en curso al mismo tiempo.
    note: En esta unidad, todas las acciones narradas van en imperfectum.
  nl.a2.unit83.lesson04.teach.halte:
    title: En la parada
    gloss: la parada / en casa / junto a la bici
    note: '*Halte* puede ser una parada de autobús o de tranvía.'
    example_gloss:
    - Esperé en la parada.
    - Llegué tarde a casa.
    - Estaba junto a la bici.
  nl.a2.unit83.lesson04.teach.regende:
    title: El tiempo de fondo
    gloss: Mientras estaba junto a mi bici, llovía a cántaros.
  nl.a2.unit83.lesson04.teach.reeks:
    title: Un pequeño incidente
    gloss: Cuando iba en bici a casa, se me pinchó una rueda. Fui andando a la parada y tomé el autobús.
  nl.a2.unit83.lesson05.teach.reading:
    title: El regreso a casa de Noor
    gloss: Ayer Noor volvió a casa en bici después del trabajo. Cuando iba por el carril bici, se le pinchó una rueda. Mientras estaba en la parada, el autobús llegó tarde. Pasó veinte minutos en el autobús. Cuando llegó a casa, llamó a Lotte.
    note: Fíjate en las situaciones de fondo y en los hechos que ocurrieron durante ellas.
    glosses:
      Gisteren: ayer
      reed: iba (en bici)
      fietspad: carril bici
      lekke: pinchado
      band: neumático
      halte: parada
      twintig: veinte
      minuten: minutos
  nl.a2.unit83.lesson06.teach.lotte_vraag:
    title: Lotte pregunta
    gloss: 'Lotte: Hola, Omar, ¿qué pasó por el camino?'
  nl.a2.unit83.lesson06.teach.omar_band:
    title: Omar cuenta el incidente
    gloss: 'Omar: Cuando iba en bici a casa, se me pinchó una rueda.'
  nl.a2.unit83.lesson06.teach.lotte_toen:
    title: Lotte pregunta qué pasó después
    gloss: 'Lotte: ¡Vaya! ¿Y entonces?'
  nl.a2.unit83.lesson06.teach.omar_regen:
    title: Omar añade un cambio de tiempo
    gloss: 'Omar: Mientras estaba junto a mi bici, empezó a llover fuerte.'
  nl.a2.unit83.lesson06.teach.lotte_thuis:
    title: Lotte pregunta cómo llegó a casa
    gloss: 'Lotte: ¿Cómo llegaste a casa?'
  nl.a2.unit83.lesson06.teach.omar_bus:
    title: Omar termina el relato
    gloss: 'Omar: Fui andando a la parada de autobús y tomé el autobús.'
exercises:
  nl.a2.unit83.lesson01.exercise01.choose_had:
    instruction: Elige la oración neerlandesa en imperfectum.
    correct_option: De bus had vertraging.
    distractors:
    - De bus heeft vertraging.
    - De bus waren vertraging.
    - De bus hadden vertraging.
    accepted_answers:
    - value: De bus had vertraging.
      status: correct
    feedback: '*Had* es el imperfectum singular de *hebben*.'
    prompt_blocks:
    - El autobús llevaba retraso.
