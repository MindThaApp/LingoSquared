course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para escribir a amigos.
  learning_goal: 'Escribir un mensaje informal breve a un amigo: qué pasó, qué viene después y por qué.'
units:
  nl.a2.unit106.een_bericht_aan_een_vriend:
    title: Un mensaje a un amigo
    description: Lee y escribe mensajes informales con saludo, hechos pasados, planes, motivos y despedida.
lessons:
  nl.a2.unit106.lesson01.hoi_lotte_groetjes:
    title: Hola Lotte, saludos
  nl.a2.unit106.lesson02.wat_is_er_gebeurd:
    title: ¿Qué pasó?
  nl.a2.unit106.lesson03.wat_gaan_we_doen:
    title: ¿Qué vamos a hacer?
  nl.a2.unit106.lesson04.omdat_want_dus:
    title: Porque, porque, así que
  nl.a2.unit106.lesson05.berichten_lezen:
    title: Leer mensajes
  nl.a2.unit106.lesson06.een_bericht_schrijven:
    title: Escribir un mensaje
teaching:
  nl.a2.unit106.lesson01.teach.groeten:
    title: Empezar un mensaje
    gloss: Hola Lotte / Eh, Omar / Hola Noor
    note: Empieza un mensaje a un amigo con Hoi o Hé, el nombre y una coma.
    example_gloss:
    - Hola Lotte, ¿cómo estás?
    - Eh, Omar, ¡gracias por tu mensaje!
  nl.a2.unit106.lesson01.teach.afsluiten:
    title: Terminar un mensaje
    gloss: Saludos (informal) / Un abrazo / Hasta pronto
    note: Termina con una de estas fórmulas, luego una coma y tu nombre. Liefs es cariñoso y se usa con amigos cercanos.
    example_gloss:
    - Saludos, Omar
    - Un abrazo, Lotte
    - Hasta pronto, Noor
  nl.a2.unit106.lesson01.teach.bericht:
    title: Escribir a un amigo
    gloss: el mensaje / el amigo / la amiga / escribir
    note: Vriend es un amigo y vriendin es una amiga.
    example_gloss:
    - Escribo un mensaje a mi amiga.
    - Lotte es amiga de Omar.
    - Omar es amigo de Noor.
  nl.a2.unit106.lesson01.teach.gebeurtenissen:
    title: Temas sobre los que escribir
    gloss: el fin de semana / la fiesta / la película / el cine / el zoo / el parque / la tarde-noche
    note: Estos son temas típicos para un mensaje sobre tu fin de semana.
    example_gloss:
    - El fin de semana fue agradable.
    - La fiesta fue divertida.
    - Estoy viendo una película en el cine.
  nl.a2.unit106.lesson01.teach.bijvoeglijk:
    title: ¿Qué tal estuvo? ¿Cómo estás?
    gloss: agradable, bueno / ameno, acogedor / cansado / enfermo / ocupado
    note: Gezellig describe un ambiente agradable y cercano, por ejemplo en una fiesta.
    example_gloss:
    - La película fue buena.
    - Estoy cansado.
    - Omar está enfermo.
    - Lotte está ocupada.
  nl.a2.unit106.lesson01.teach.tijd:
    title: ¿Cuándo?
    gloss: ayer / la semana pasada / mañana / la semana que viene / quizá / sábado
    note: Las expresiones de tiempo le dicen a tu amigo cuándo ocurrió o cuándo ocurrirá algo. Misschien significa «quizá».
    example_gloss:
    - Ayer fue la fiesta.
    - Mañana es el fin de semana.
    - Quizá la película sea buena.
  nl.a2.unit106.lesson01.teach.gn_opbouw:
    title: Estructura de un mensaje a un amigo
    gloss: Hola, Lotte, ¿cómo estás? Te escribo un mensaje. Un saludo, Omar
    note: 'Un mensaje amistoso tiene cuatro partes: un saludo (Hoi o Hé más el nombre), lo que ocurrió, lo que viene después y una despedida (Groetjes, Liefs o Tot snel más tu nombre). Si te ayuda, añade un motivo con omdat o want.'
  nl.a2.unit106.lesson01.teach.gn_je:
    title: Je para un amigo
    gloss: ¿Cómo estás? ¡Gracias por tu mensaje!
    note: 'A un amigo se le escribe je (o jij), nunca u. Je también es la palabra para «tu»: je bericht.'
  nl.a2.unit106.lesson01.teach.zin:
    title: Un mensaje corto
    gloss: Hola, Lotte, ¡gracias por tu mensaje! Hasta pronto, Omar
  nl.a2.unit106.lesson02.teach.voltooid_ww:
    title: Verbos y sus participios
    gloss: ver - visto / comprar - comprado / llamar - llamado / pasear - paseado / bailar - bailado / comer - comido / ir - ido / ser, estar - sido, estado
    note: La segunda forma de cada pareja es el participio que se usa en el pretérito perfecto.
    example_gloss:
    - Vi una película.
    - Bailamos.
    - Fui al parque.
  nl.a2.unit106.lesson02.teach.gn_hebben:
    title: Pretérito perfecto con hebben
    gloss: Ayer vi una película. Bailamos en la fiesta. Llamé a Noor.
    note: 'Para contar lo que pasó, usa heb o hebben más un participio. En una oración principal simple, el participio va al final. En neerlandés se usa mucho esta forma donde en español puedes usar el pretérito indefinido: «vi», «llamé».'
  nl.a2.unit106.lesson02.teach.gn_zijn:
    title: Pretérito perfecto con zijn
    gloss: Fui al parque. Estuve en la fiesta. Fuimos al cine.
    note: 'Los verbos gaan y zijn forman el perfecto con zijn, no con hebben: ik ben gegaan, ik ben geweest. Komen funciona igual (ik ben gekomen). La mayoría de los demás verbos usa hebben. Aprende el auxiliar junto con el participio.'
  nl.a2.unit106.lesson02.teach.gn_was_had:
    title: Describir con was y had
    gloss: La fiesta fue divertida. La película fue buena. Tuve una noche agradable.
    note: 'Para decir cómo fue algo, usa el imperfectum de verbos que ya conoces: was y had. Usa el pretérito perfecto para los hechos y was o had para la descripción. Dos o tres detalles así dan vida a tu mensaje.'
  nl.a2.unit106.lesson02.teach.zinnen:
    title: Lo que pasó
    gloss: Ayer vi una película. Fue buena. Fui a la fiesta.
  nl.a2.unit106.lesson03.teach.plan_ww:
    title: Palabras para hacer planes
    gloss: visitar / cocinar / mirar / el tío / el plan
    note: Oom es un tío. Plan es un plan; van plan zijn significa «tener la intención de».
    example_gloss:
    - Visito a mi tío en Ámsterdam.
    - Omar cocina para Lotte.
    - Estamos viendo una película.
  nl.a2.unit106.lesson03.teach.gn_gaan:
    title: Planes con gaan
    gloss: Voy a visitar a mi tío. Omar va a cocinar mañana. Vamos a ver una película.
    note: Usa gaan más un infinitivo para un plan o para lo que vas a hacer. El infinitivo va al final de la oración.
  nl.a2.unit106.lesson03.teach.gn_voorop:
    title: La expresión de tiempo al principio
    gloss: Mañana voy a cocinar. La semana que viene vamos a visitar a mi tío. Quizá vaya al cine.
    note: 'Cuando una expresión de tiempo como morgen o volgende week, o misschien, abre la oración, el verbo va justo después y el sujeto lo sigue: Morgen ga ik koken. El infinitivo sigue al final.'
  nl.a2.unit106.lesson03.teach.gn_plan:
    title: Van plan zijn om ... te
    gloss: Tengo la intención de ir al zoo. Tengo la intención de visitar a mi tío.
    note: 'Ik ben van plan om ... te + infinitivo expresa lo que piensas hacer. El infinitivo con te va al final: om mijn oom te bezoeken. Suena algo más premeditado que gaan.'
  nl.a2.unit106.lesson03.teach.gn_zullen:
    title: Zullen para una promesa
    gloss: Te llamaré mañana. Te llamaremos.
    note: 'Ik zal y wij zullen más un infinitivo expresan una promesa o un ofrecimiento: Ik zal je bellen. Usa gaan para un plan y zullen cuando le prometes algo a tu amigo.'
  nl.a2.unit106.lesson03.teach.zinnen:
    title: Lo que viene
    gloss: La semana que viene voy a visitar a mi tío en Ámsterdam. Te llamaré.
  nl.a2.unit106.lesson04.teach.redenwoorden:
    title: Palabras para dar motivos
    gloss: porque / porque / así que / el tiempo / ningún, no hay / no / venir / quedarse
    note: Omdat y want significan ambos «porque»; dus significa «así que». Se diferencian en el orden de las palabras, como verás en las notas siguientes.
    example_gloss:
    - No tengo tiempo.
    - Me quedo en casa.
    - No voy a venir.
  nl.a2.unit106.lesson04.teach.gn_omdat:
    title: 'Omdat: el verbo va al final'
    gloss: Me quedo en casa porque estoy enfermo. Como estoy cansado, me voy a casa.
    note: 'Después de omdat el verbo va al final de su propia cláusula: omdat ik ziek ben. Si la cláusula con omdat va primero, la oración principal que sigue empieza por el verbo, justo después de la coma: Omdat ik moe ben, ga ik naar huis.'
  nl.a2.unit106.lesson04.teach.gn_want:
    title: 'Want: orden normal'
    gloss: Me quedo en casa, porque estoy enfermo. No voy a venir, porque no tengo tiempo.
    note: 'Después de want el orden de las palabras sigue siendo normal: want ik ben ziek. Want solo une dos oraciones principales, así que nunca empieza la oración.'
  nl.a2.unit106.lesson04.teach.gn_dus:
    title: 'Dus: la consecuencia'
    gloss: Estoy enfermo, así que me quedo en casa. Hay mucha gente, así que no voy.
    note: 'Dus introduce la consecuencia. Es una conjunción, así que no cambia el orden de las palabras de la cláusula que une: Ik ben ziek, dus ik blijf thuis. La inversión también es muy frecuente y correcta: Ik ben ziek, dus blijf ik thuis. Omdat da la razón; dus da la consecuencia.'
  nl.a2.unit106.lesson04.teach.gn_verleden:
    title: Motivos en pasado
    gloss: Estaba enfermo, así que no fui a la fiesta. No vine porque estaba cansado.
    note: Los motivos de hechos pasados se dan del mismo modo. Describe el motivo con was o had (Ik was ziek) y el hecho con el pretérito perfecto (ik ben niet gekomen).
  nl.a2.unit106.lesson05.teach.leeswoorden:
    title: Palabras para leer
    gloss: la entrada / ya / muy / mucho / también / pero / eso / él / vivir
    note: Estas palabras aparecen en los dos mensajes de abajo.
    example_gloss:
    - Bailé mucho.
    - La fiesta fue muy divertida.
    - Mi tío vive en Ámsterdam.
    - Él también está en el parque.
    - Voy a venir, pero eso no es un problema.
  nl.a2.unit106.lesson05.teach.gn_voltooid_verleden:
    title: Had más participio (para leer)
    gloss: Ya había comprado una entrada. Lotte ya había llamado a Omar.
    note: 'Had o hadden más un participio se refiere a algo que ocurrió antes de otro momento del pasado, como el pluscuamperfecto español: «ya había comprado una entrada». Solo necesitas reconocerlo al leer. En tus propios mensajes basta con el pretérito perfecto.'
  nl.a2.unit106.lesson05.teach.lees_noor:
    title: El mensaje de Noor a Lotte
    gloss: Hola, Lotte, ¡gracias por tu mensaje! Ayer fui a la fiesta. Fue muy divertida y bailé mucho. Mañana voy al zoo, porque tengo tiempo. Quizá vaya al cine la semana que viene. Hasta pronto, Noor
  nl.a2.unit106.lesson05.teach.lees_omar:
    title: El mensaje de Omar a Lotte
    gloss: Hola, Lotte, ¿cómo estás? Ayer estaba enfermo, así que no fui al cine. Ya había comprado una entrada, pero no pasa nada. La semana que viene voy a visitar a mi tío. Vive en Ámsterdam. Te llamaré mañana. Un saludo, Omar
  nl.a2.unit106.lesson06.teach.lotte_vraag:
    title: Habla Lotte
    gloss: 'Lotte: Hola, Omar, ¿qué tal tu fin de semana?'
  nl.a2.unit106.lesson06.teach.omar_feestje:
    title: Habla Omar
    gloss: 'Omar: ¡Bien! El sábado fui a la fiesta y bailé mucho.'
  nl.a2.unit106.lesson06.teach.lotte_plan:
    title: Habla Lotte
    gloss: 'Lotte: ¡Qué bien! ¿Y qué vas a hacer la semana que viene?'
  nl.a2.unit106.lesson06.teach.omar_oom:
    title: Habla Omar
    gloss: 'Omar: Voy a visitar a mi tío en Ámsterdam, porque tengo tiempo.'
  nl.a2.unit106.lesson06.teach.lotte_bellen:
    title: Habla Lotte
    gloss: 'Lotte: ¡Qué bien! Te llamaré. ¡Hasta pronto!'
