teaching:
  nl.a1.unit15.lesson01.teach.kaartje:
    title: El billete
    gloss: el billete
    note: '*Het kaartje* es un sustantivo neutro; se usa *het*, no *de*.'
    example_gloss: Quisiera un billete a Utrecht.
  nl.a1.unit15.lesson01.teach.wil_graag:
    title: Pedir un billete
    gloss: Quisiera un billete a Utrecht.
    note: '*Wil graag* suaviza una petición; es el mismo patrón que se usa para pedir comida en la Unidad 6.'
  nl.a1.unit15.lesson01.teach.enkele_of_retour:
    title: El empleado pregunta de qué tipo
    gloss: ¿Desea un billete de ida o de ida y vuelta?
    note: '*Wilt u* es la forma de cortesía (usted) de *willen*, usada aquí con un empleado de la estación al que no conoces.'
  nl.a1.unit15.lesson01.teach.retour_alstublieft:
    title: Responder con cortesía
    gloss: Uno de ida y vuelta, por favor.
    note: '*Alstublieft* es el «por favor» formal, acorde con el registro de *u* del intercambio.'
  nl.a1.unit15.lesson01.teach.register_note:
    title: El registro en la ventanilla
    gloss: En el mostrador, normalmente se usa la forma de cortesía u.
    note: 'Continúa la distinción *jij*/*je* frente a *u* presentada en la Unidad 1: con desconocidos que prestan un servicio se usa *u* por defecto.'
  nl.a1.unit15.lesson02.teach.perron:
    title: El andén
    gloss: el andén
    note: '*Het perron* es neutro; se usa *het*, no *de*.'
    example_gloss: ¿De qué andén sale el tren a Utrecht?
  nl.a1.unit15.lesson02.teach.welk_perron:
    title: Preguntar por el andén
    gloss: ¿De qué andén sale el tren a Utrecht?
    note: '*Van welk perron* pregunta específicamente por el andén, no por un lugar en general.'
  nl.a1.unit15.lesson02.teach.vertrektijd:
    title: Indicar los datos de salida
    gloss: El tren sale del andén cinco a las diez menos cuarto.
    note: '*Kwart voor tien* reutiliza el patrón de las horas de la Unidad 4.'
  nl.a1.unit15.lesson02.teach.hoe_laat_aan:
    title: Preguntar la hora de llegada
    gloss: ¿A qué hora llega el tren?
    note: '*Komt ... aan* es un verbo separable (*aankomen*); *aan* pasa al final de la pregunta.'
  nl.a1.unit15.lesson02.teach.aankomsttijd:
    title: Indicar la hora de llegada
    gloss: El tren llega a las once.
    note: '*Komt aan* muestra de nuevo las dos partes del verbo separable repartidas en la frase.'
  nl.a1.unit15.lesson03.teach.op_tijd_de_vertraging:
    title: A la hora / el retraso
    gloss: a la hora; el retraso
    note: '*Op tijd* es una expresión fija que describe algo que ocurre según el horario. *De vertraging* (el retraso) es un sustantivo de género común.'
    example_gloss:
    - El tren no sale a la hora.
    - 'Atención: el tren a Utrecht lleva retraso.'
  nl.a1.unit15.lesson03.teach.let_op:
    title: Un aviso
    gloss: 'Atención: el tren a Utrecht lleva retraso.'
    note: '*Let op* (literalmente «presta atención») abre un aviso en la estación, como el «Atención, viajeros» del español.'
  nl.a1.unit15.lesson03.teach.niet_op_tijd:
    title: Negar que sea a la hora
    gloss: El tren no sale a la hora.
    note: '*Niet* va justo antes de *op tijd* para negar toda la expresión.'
  nl.a1.unit15.lesson03.teach.ander_perron:
    title: Un cambio de andén
    gloss: El tren sale del andén tres en lugar del andén cinco.
    note: '*In plaats van* significa «en lugar de».'
  nl.a1.unit15.lesson03.teach.tien_minuten_vertraging:
    title: Indicar cuánto dura el retraso
    gloss: El tren lleva diez minutos de retraso.
    note: '*Heeft vertraging* (literalmente «tiene retraso») es la forma natural de decir que algo se retrasa, junto con el adjetivo *vertraagd*.'
  nl.a1.unit15.lesson04.teach.ingang_uitgang_wachtruimte:
    title: Entrada, salida, sala de espera
    gloss: la entrada; la salida; la sala de espera
    note: '*De ingang*, *de uitgang* y *de wachtruimte* son todos sustantivos de género común.'
    example_gloss:
    - ¿Dónde está la entrada?
    - ¿Dónde está la salida?
    - ¿Dónde está la sala de espera?
  nl.a1.unit15.lesson04.teach.waar_perron_zeven:
    title: Preguntar dónde está un andén
    gloss: ¿Dónde está el andén siete?
    note: Reutiliza el patrón *Waar is...?* de las lecciones de direcciones de la Unidad 9.
  nl.a1.unit15.lesson04.teach.rechtdoor_rechts:
    title: Dar indicaciones
    gloss: Todo recto y luego a la derecha.
    note: '*Rechtdoor* y *rechts* son las mismas palabras de dirección de la Unidad 9, ahora en el contexto de una estación.'
  nl.a1.unit15.lesson04.teach.waar_wachtruimte:
    title: Preguntar por la sala de espera
    gloss: ¿Dónde está la sala de espera?
    note: El mismo patrón de pregunta aplicado a un lugar nuevo.
  nl.a1.unit15.lesson05.teach.kaartje_tekst:
    title: Leer un billete impreso
    gloss: 'Billete: Amsterdam Centraal a Utrecht Centraal. Salida: las diez y diez, andén siete. Llegada: las once menos diez. Ida y vuelta. Precio: doce euros con cuarenta.'
    note: Fíjate en la hora y el andén de salida, la hora de llegada, el tipo de billete y el precio.
    glosses:
      Kaartje: billete
      Vertrek: salida
      tien: diez
      perron: andén
      zeven: siete
      Aankomst: llegada
      elf: once
      Retour: billete de ida y vuelta
      Prijs: precio
      twaalf: doce
      euro: euros
      veertig: cuarenta
  nl.a1.unit15.lesson06.teach.omar_open:
    title: Omar expone el plan
    gloss: 'Omar: Tenemos que ir al andén siete. El tren sale a las diez y diez.'
    note: Aquí *moeten* (tener que) expresa una necesidad práctica, no una obligación estricta.
  nl.a1.unit15.lesson06.teach.lotte_sign:
    title: Lotte lee el panel
    gloss: 'Lotte: Mira, ahí está el panel: retraso, diez minutos.'
    note: '*Daar staat* (literalmente «ahí está de pie») es la forma natural de decir que un panel indica algo.'
  nl.a1.unit15.lesson06.teach.omar_coffee:
    title: Omar mantiene la calma
    gloss: 'Omar: No pasa nada, aún tenemos tiempo para un café.'
    note: '*Geen probleem* es una expresión tranquilizadora común y coloquial.'
  nl.a1.unit15.lesson06.teach.lotte_train_arrives:
    title: Llega el tren
    gloss: 'Lotte: Buena idea. Oh, ya está aquí el tren. ¡Andén siete, justo!'
    note: '*Al* (ya) indica que el tren ha llegado antes de lo esperado, dado el retraso que se acaba de anunciar.'
  nl.a1.unit15.lesson06.teach.omar_board:
    title: Suben al tren
    gloss: 'Omar: Venga, subamos. ¡Utrecht, allá vamos!'
    note: '*Stappen in* (subir, embarcar) es un verbo separable; *in* pasa al final de la oración. *We komen eraan* (literalmente «venimos hacia ello») es la forma natural en neerlandés de decir «allá vamos»; una traducción palabra por palabra sonaría extraña.'
