teaching:
  nl.a1.unit03.lesson01.teach.maandag_tot_woensdag:
    title: De lunes a miércoles
    gloss: lunes, martes, miércoles
    note: Igual que en español, los nombres de los días de la semana en neerlandés se escriben normalmente con minúscula inicial.
    example_gloss:
    - Hoy es lunes.
    - Hoy es martes.
    - Hoy es miércoles.
  nl.a1.unit03.lesson01.teach.donderdag_vrijdag:
    title: Jueves, viernes
    gloss: jueves, viernes
    note: Donderdag y vrijdag continúan la serie de los días de la semana, también con minúscula.
    example_gloss:
    - Hoy es jueves.
    - El café de idiomas es el viernes.
  nl.a1.unit03.lesson01.teach.zaterdag_zondag:
    title: Sábado, domingo
    gloss: sábado, domingo
    note: Zaterdag y zondag son los días del fin de semana.
    example_gloss:
    - Hoy es sábado.
    - Hoy es domingo.
  nl.a1.unit03.lesson01.teach.ask_day:
    title: Preguntar qué día de la semana es
    gloss: ¿Qué día es hoy?
    note: Welke dag ... pregunta por el día de la semana, no por la fecha numérica del calendario.
  nl.a1.unit03.lesson01.teach.today_wednesday:
    title: Decir qué día de la semana es hoy
    gloss: Hoy es miércoles.
    note: El día de la semana sigue escribiéndose con minúscula dentro de la frase.
  nl.a1.unit03.lesson01.teach.lowercase_days:
    title: Los días de la semana en minúscula
    gloss: 'Los días normalmente no llevan mayúscula: lunes, viernes.'
    note: Igual que en español, en neerlandés los días de la semana no se escriben con mayúscula, salvo al principio de una oración.
  nl.a1.unit03.lesson02.teach.jan_mar:
    title: De enero a marzo
    gloss: enero, febrero, marzo
    note: Igual que en español, los nombres de los meses en neerlandés se escriben normalmente con minúscula inicial.
    example_gloss:
    - Mi cumpleaños es en enero.
    - Aprendo neerlandés en febrero.
    - Mi cumpleaños es en marzo.
  nl.a1.unit03.lesson02.teach.apr_jun:
    title: De abril a junio
    gloss: abril, mayo, junio
    note: El neerlandés mei es «mayo»; juni es «junio».
    example_gloss:
    - Aprendo neerlandés en abril.
    - Mi cumpleaños es en mayo.
    - Aprendo neerlandés en junio.
  nl.a1.unit03.lesson02.teach.jul_sep:
    title: De julio a septiembre
    gloss: julio, agosto, septiembre
    note: Las palabras neerlandesas juli y juni se distinguen por la vocal final.
    example_gloss:
    - Mi cumpleaños es en julio.
    - Aprendo neerlandés en agosto.
    - Mi cumpleaños es en septiembre.
  nl.a1.unit03.lesson02.teach.oct_dec:
    title: De octubre a diciembre
    gloss: octubre, noviembre, diciembre
    note: En neerlandés, oktober se escribe con k, a diferencia del español «octubre».
    example_gloss:
    - Aprendo neerlandés en octubre.
    - Mi cumpleaños es en noviembre.
    - Aprendo neerlandés en diciembre.
  nl.a1.unit03.lesson02.teach.year:
    title: Año
    gloss: el año
    note: Jaar es la palabra que se usa para un año del calendario.
    example_gloss: Este año aprendo neerlandés.
  nl.a1.unit03.lesson02.teach.lowercase_months:
    title: Los meses en minúscula
    gloss: 'Los meses normalmente no llevan mayúscula: abril, septiembre.'
    note: Igual que en español, en neerlandés los nombres de los meses se escriben con minúscula, salvo al principio de una oración.
  nl.a1.unit03.lesson03.teach.first_fourth:
    title: Del primero al cuarto
    gloss: '1–4: el primero, el segundo, el tercero, el cuarto'
    note: Eerste, tweede y derde son formas que hay que aprender tal cual; vierde se forma a partir de vier.
    example_gloss:
    - Es el primero de abril.
    - Es el dos de abril.
    - Es el tres de abril.
    - Es el cuatro de abril.
  nl.a1.unit03.lesson03.teach.fifth_eighth:
    title: Del quinto al octavo
    gloss: '5–8: el quinto, el sexto, el séptimo, el octavo'
    note: Estas formas para las fechas son vijfde, zesde, zevende y achtste.
    example_gloss:
    - Es el cinco de abril.
    - Es el seis de abril.
    - Es el siete de abril.
    - Es el 8 de abril de 2026.
  nl.a1.unit03.lesson03.teach.ninth_twelfth:
    title: Del noveno al duodécimo
    gloss: '9–12: el noveno, el décimo, el undécimo, el duodécimo'
    note: Estas formas cubren las fechas de principios de mes que se usan más adelante en la unidad.
    example_gloss:
    - Es el nueve de abril.
    - Es el diez de abril.
    - Es el once de abril.
    - Es el doce de abril.
  nl.a1.unit03.lesson03.teach.thirteenth_nineteenth:
    title: Del decimotercero al decimonoveno
    gloss: '13–19: el decimotercero, el decimocuarto, el decimoquinto, el decimosexto, el decimoséptimo, el decimoctavo, el decimonoveno'
    note: Estos ordinales de los días, escritos con letras, terminan en -de.
    example_gloss:
    - Es el trece de abril.
    - Es el catorce de abril.
    - Es el quince de abril.
    - Es el dieciséis de abril.
    - Es el diecisiete de abril.
    - Es el dieciocho de abril.
    - Es el diecinueve de abril.
  nl.a1.unit03.lesson03.teach.twentieth_twenty_fourth:
    title: Del vigésimo al vigésimo cuarto
    gloss: '20–24: el vigésimo, el vigésimo primero, el vigésimo segundo, el vigésimo tercero, el vigésimo cuarto'
    note: A partir de twintig, estas formas ordinales terminan en -ste y se escriben en una sola palabra.
    example_gloss:
    - Es el veinte de abril.
    - El libro tiene que devolverse el veintiuno de abril.
    - Es el veintidós de abril.
    - Es el veintitrés de abril.
    - Es el veinticuatro de abril.
  nl.a1.unit03.lesson03.teach.twenty_fifth_twenty_ninth:
    title: Del vigésimo quinto al vigésimo noveno
    gloss: '25–29: el vigésimo quinto, el vigésimo sexto, el vigésimo séptimo, el vigésimo octavo, el vigésimo noveno'
    note: Estos ordinales compuestos terminan en -ste y se escriben en una sola palabra.
    example_gloss:
    - Es el veinticinco de abril.
    - Es el veintiséis de abril.
    - Es el veintisiete de abril.
    - Es el veintiocho de abril.
    - Es el veintinueve de abril.
  nl.a1.unit03.lesson03.teach.thirtieth_thirty_first:
    title: El trigésimo y el trigésimo primero
    gloss: '30–31: el trigésimo, el trigésimo primero'
    note: Son los dos últimos números de día posibles en un mes.
    example_gloss:
    - Es el treinta de abril.
    - Es el treinta y uno de diciembre.
  nl.a1.unit03.lesson03.teach.spoken_date:
    title: Decir una fecha con un ordinal
    gloss: 3 de abril — el tres de abril
    note: Esta unidad presenta el ordinal cuando el número del día se dice completo; en neerlandés el día va antes del mes, igual que en español.
  nl.a1.unit03.lesson03.teach.on_date:
    title: En una fecha
    gloss: el 3 de abril — el tres de abril
    note: Con la cifra escrita, usa op 3 april; cuando el ordinal se escribe con letras, usa op de derde april.
  nl.a1.unit03.lesson04.teach.ask_date:
    title: Preguntar la fecha del calendario
    gloss: ¿Qué fecha es hoy?
    note: Welke datum ... pregunta expresamente por la fecha del calendario.
  nl.a1.unit03.lesson04.teach.ask_which_date:
    title: Preguntar qué día del mes es
    gloss: ¿A cuántos estamos hoy?
    note: De hoeveelste ... es una forma habitual en la conversación de preguntar por el número del día.
  nl.a1.unit03.lesson04.teach.date_answer:
    title: Dar la fecha completa
    gloss: Es 3 de abril de 2026.
    note: El orden de la fecha en neerlandés es día–mes–año, como en español, y april se escribe con minúscula.
  nl.a1.unit03.lesson04.teach.date_words:
    title: Dar el día como ordinal
    gloss: Es el tres de abril.
    note: 'El ordinal escrito con letras lleva de: de derde april.'
  nl.a1.unit03.lesson04.teach.written_order:
    title: Orden día–mes–año
    gloss: 'día–mes–año: 3 de abril de 2026 o 3-4-2026'
    note: 'La forma numérica no sigue el orden mes–día–año de EE. UU.: 3-4-2026 significa 3 de abril de 2026.'
  nl.a1.unit03.lesson04.teach.day_and_date:
    title: Combinar día de la semana y fecha
    gloss: Hoy es viernes 10 de abril.
    note: Tanto vrijdag como april van en minúscula en medio de la frase. El 10 de abril de 2026 es realmente viernes.
  nl.a1.unit03.lesson05.teach.when:
    title: Cuándo
    gloss: cuándo
    note: Wanneer pregunta en qué momento o en qué fecha ocurre algo.
    example_gloss: ¿Cuándo es el café de idiomas?
  nl.a1.unit03.lesson05.teach.book:
    title: Libro
    gloss: el libro
    note: Aquí, boek es un libro de biblioteca.
    example_gloss: Tengo el libro.
  nl.a1.unit03.lesson05.teach.due_date:
    title: Fecha de devolución
    gloss: la fecha de devolución
    note: Una inleverdatum es la fecha en que hay que devolver algo.
    example_gloss: ¿Cuál es la fecha de devolución del libro?
  nl.a1.unit03.lesson05.teach.ask_due:
    title: Preguntar cuándo hay que devolver un libro
    gloss: ¿Cuándo hay que devolver el libro?
    note: Moet ... terug es una forma sencilla y natural de preguntar cuándo hay que devolver algo prestado.
  nl.a1.unit03.lesson05.teach.due_answer:
    title: Dar la fecha de devolución
    gloss: El 21 de abril.
    note: La respuesta corta usa op más el día y el mes en minúscula.
  nl.a1.unit03.lesson05.teach.due_words:
    title: Decir la fecha de devolución con letras
    gloss: El libro hay que devolverlo el veintiuno de abril.
    note: Con el ordinal escrito con letras, añade de después de op.
  nl.a1.unit03.lesson05.teach.label:
    title: Leer una etiqueta de devolución
    gloss: 'Fecha de devolución: 21-4-2026'
    note: Esta etiqueta numérica sigue el orden día–mes–año.
  nl.a1.unit03.lesson06.teach.dialogue_day:
    title: Lotte pregunta por el día de la semana
    gloss: 'Lotte: ¿Qué día es hoy? Omar: Es miércoles.'
    note: La respuesta da un día de la semana.
  nl.a1.unit03.lesson06.teach.dialogue_date:
    title: Lotte pregunta por la fecha
    gloss: 'Lotte: ¿Y qué fecha es? Omar: Es 8 de abril de 2026.'
    note: La respuesta hablada en neerlandés usa el ordinal de achtste, algo que en español no es lo habitual (decimos «el 8»); el 8 de abril de 2026 es realmente miércoles, como en el turno anterior.
  nl.a1.unit03.lesson06.teach.next:
    title: Siguiente
    gloss: siguiente
    note: Volgende señala la próxima vez que ocurre algo.
    example_gloss: ¿Cuándo es el próximo café de idiomas?
  nl.a1.unit03.lesson06.teach.dialogue_next:
    title: Preguntar la fecha del próximo encuentro
    gloss: 'Lotte: ¿Cuándo es el próximo café de idiomas? Omar: El viernes 10 de abril.'
    note: La respuesta combina op, un día de la semana en minúscula, el número del día y un mes en minúscula. El 10 de abril de 2026 es realmente viernes, dos días después del 8.
  nl.a1.unit03.lesson06.teach.dialogue_close:
    title: Cerrar la conversación
    gloss: 'Lotte: Bien, ¡hasta el viernes! Omar: ¡Hasta entonces!'
    note: Tot vrijdag indica el día del próximo encuentro.
