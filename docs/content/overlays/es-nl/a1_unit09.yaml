teaching:
  nl.a1.unit09.lesson01.teach.links_rechts:
    title: Izquierda y derecha
    gloss: izquierda, derecha
    note: '*Links* significa izquierda y *rechts* significa derecha.'
    example_gloss:
    - El banco está a la izquierda.
    - La estación está a la derecha.
  nl.a1.unit09.lesson01.teach.linksaf_rechtsaf_rechtdoor:
    title: Girar a la izquierda, girar a la derecha, recto
    gloss: a la izquierda / gira a la izquierda, a la derecha / gira a la derecha, recto
    note: '*Linksaf*, *rechtsaf* y *rechtdoor* se escriben cada uno en una sola palabra; en las indicaciones suelen ir después de *sla*: *sla linksaf*, *sla rechtsaf*.'
    example_gloss:
    - Gira a la izquierda.
    - Gira a la derecha.
    - Sigue recto.
  nl.a1.unit09.lesson02.teach.ga_sla_loop_tot:
    title: Ir, girar, caminar, hasta
    gloss: ve, gira, camina, hasta
    note: '*Ga* indica a una persona que vaya, *sla* que gire y *loop* que camine; *tot* marca el lugar donde termina un paso de la indicación.'
    example_gloss:
    - Sigue recto.
    - Gira a la izquierda.
    - Camina hasta el banco.
    - Sigue recto hasta la estación.
  nl.a1.unit09.lesson02.teach.ga_rechtdoor:
    title: Sigue recto
    gloss: Sigue recto.
    note: Después de *ga* va directamente *rechtdoor*.
  nl.a1.unit09.lesson02.teach.sla_linksaf:
    title: Gira a la izquierda
    gloss: Gira a la izquierda.
    note: '*Sla linksaf* es la indicación hablada breve más habitual.'
  nl.a1.unit09.lesson02.teach.sla_rechtsaf:
    title: Gira a la derecha
    gloss: Gira a la derecha.
    note: '*Sla rechtsaf* es la indicación hablada breve más habitual.'
  nl.a1.unit09.lesson02.teach.loop_tot:
    title: Camina hasta
    gloss: Camina hasta ...
    note: 'Añade un lugar después de *tot*: *Loop tot de bank*.'
  nl.a1.unit09.lesson02.teach.imperative_note:
    title: Formas breves del imperativo
    gloss: 'En un imperativo informal, el neerlandés normalmente omite jij o je, igual que el español omite el pronombre: ga, sla, loop.'
    note: Estas órdenes encajan con la forma en que Lotte y Omar se hablan. No añadas *jij* ni *je*.
  nl.a1.unit09.lesson03.teach.supermarkt_station_review:
    title: Supermercado y estación
    gloss: el supermercado, la estación
    note: Recuerda *de supermarkt* y *het station* de la Unidad 8. *Supermarkt* se escribe en una sola palabra.
    example_gloss:
    - ¿Cómo llego al supermercado?
    - ¿Cómo llego a la estación desde aquí?
  nl.a1.unit09.lesson03.teach.hoe_kom_ik_bij:
    title: ¿Cómo llego a ...?
    gloss: ¿Cómo llego a ...?
    note: Usa *Hoe kom ik bij ...?* para preguntar cómo llegar a un lugar.
  nl.a1.unit09.lesson03.teach.ask_supermarket:
    title: ¿Cómo llego al supermercado?
    gloss: ¿Cómo llego al supermercado?
    note: 'Usa *bij* delante del destino: *bij de supermarkt*.'
  nl.a1.unit09.lesson03.teach.vanaf_hier:
    title: Desde aquí
    gloss: desde aquí
    note: '*Vanaf hier* deja claro el punto de partida.'
  nl.a1.unit09.lesson03.teach.ask_station_here:
    title: ¿Cómo llego a la estación desde aquí?
    gloss: ¿Cómo llego a la estación desde aquí?
    note: En esta pregunta natural sobre la ruta, *vanaf hier* va antes de *bij het station*.
  nl.a1.unit09.lesson04.teach.bank_bibliotheek_review:
    title: Banco y biblioteca
    gloss: el banco, la biblioteca
    note: Recuerda *de bank* y *de bibliotheek* de la Unidad 8.
    example_gloss:
    - Camina hasta el banco.
    - La biblioteca está enfrente del banco.
  nl.a1.unit09.lesson04.teach.straight_to_station:
    title: Sigue recto hasta la estación
    gloss: Sigue recto hasta la estación.
    note: La estación es el final de este paso de la indicación.
  nl.a1.unit09.lesson04.teach.right_at_station:
    title: Gira a la derecha en la estación
    gloss: Gira a la derecha en la estación.
    note: '*Bij* nombra el punto de referencia donde se gira.'
  nl.a1.unit09.lesson04.teach.walk_to_bank:
    title: Camina hasta el banco
    gloss: Camina hasta el banco.
    note: '*Loop* indica la acción; *tot de bank* indica dónde termina.'
  nl.a1.unit09.lesson04.teach.library_opposite:
    title: La biblioteca está enfrente del banco
    gloss: La biblioteca está enfrente del banco.
    note: Aquí se reutiliza *tegenover* para confirmar el destino después de un paso de la ruta.
  nl.a1.unit09.lesson05.teach.buurtkaart_route:
    title: Mapa del barrio y ruta
    gloss: el mapa del barrio, la ruta
    note: Recuerda *buurtkaart* de la Unidad 8 (se escribe en una sola palabra); *de route* es el camino desde el punto de partida hasta el destino.
    example_gloss:
    - Aquí está el mapa del barrio.
    - Esta es la ruta al supermercado.
  nl.a1.unit09.lesson05.teach.start_doel:
    title: Inicio y destino
    gloss: INICIO, DESTINO
    note: '*START* marca dónde empieza la ruta y *DOEL* marca dónde termina.'
    example_gloss:
    - 'INICIO: biblioteca.'
    - 'DESTINO: supermercado.'
  nl.a1.unit09.lesson05.teach.marked_route:
    title: Una ruta marcada
    gloss: 'INICIO: biblioteca. Sigue recto hasta la estación y luego gira a la derecha. DESTINO: supermercado. El supermercado está al lado de la estación; el banco está al lado del supermercado.'
    note: La ruta marcada tiene solo dos pasos.
    glosses:
      BUURTKAART: MAPA DEL BARRIO
      START: INICIO
      bibliotheek: biblioteca
      Route: ruta
      ga: van
      rechtdoor: todo recto
      station: estación
      sla: gira (imperativo)
      rechtsaf: a la derecha
      DOEL: DESTINO
      supermarkt: supermercado
      naast: al lado de
      bank: banco
  nl.a1.unit09.lesson06.teach.taalcafe_review:
    title: Café de idiomas
    gloss: el café de idiomas
    note: Recuerda *taalcafé* de unidades anteriores. Se escribe en una sola palabra y con acento.
    example_gloss: Estoy aquí para el café de idiomas.
  nl.a1.unit09.lesson06.teach.question:
    title: Omar pregunta cómo llegar
    gloss: 'Omar: Lotte, ¿cómo llego al supermercado?'
    note: Omar usa con Lotte la pregunta informal para pedir una ruta.
  nl.a1.unit09.lesson06.teach.directions:
    title: Lotte da dos pasos
    gloss: 'Lotte: Sigue recto hasta la estación. Gira a la derecha.'
    note: La respuesta se limita a dos indicaciones breves.
  nl.a1.unit09.lesson06.teach.location:
    title: Lotte confirma el lugar
    gloss: 'Lotte: El supermercado está al lado de la estación.'
    note: La expresión de lugar de la Unidad 8 confirma dónde termina la ruta.
  nl.a1.unit09.lesson06.teach.closing:
    title: Dar las gracias a Lotte
    gloss: 'Omar: ¡Genial, gracias! Lotte: ¡De nada!'
    note: El intercambio termina de manera informal.
