teaching:
  nl.a1.unit19.lesson01.teach.weer:
    title: El tiempo
    gloss: el tiempo (clima)
    note: 'Un sustantivo neutro: *het weer*.'
    example_gloss: ¿Qué tiempo hace?
  nl.a1.unit19.lesson01.teach.wat_voor_weer:
    title: Preguntar por el tiempo
    gloss: ¿Qué tiempo hace?
    note: '*Wat voor* + sustantivo pregunta «qué tipo de»; es una pregunta general muy común.'
  nl.a1.unit19.lesson01.teach.zonnig:
    title: Soleado
    gloss: Hace sol.
    note: '*Het is* + adjetivo del tiempo es el patrón estándar, con el *het* impersonal.'
  nl.a1.unit19.lesson01.teach.regent:
    title: Lloviendo
    gloss: Llueve.
    note: '*Regenen* (llover) se usa de forma impersonal: *het regent*, sin necesidad de adjetivo.'
  nl.a1.unit19.lesson01.teach.bewolkt:
    title: Nublado
    gloss: Está nublado.
    note: Sigue el mismo patrón *het is* + adjetivo que *zonnig*.
  nl.a1.unit19.lesson02.teach.koud:
    title: Frío
    gloss: Hoy hace frío.
    note: '*Vandaag* (hoy) sitúa la descripción del tiempo en el momento.'
  nl.a1.unit19.lesson02.teach.warm:
    title: Warm
    gloss: Hoy hace calor.
    note: '*Warm* sirve tanto para «templado/cálido» como para «caluroso» al hablar del tiempo en neerlandés cotidiano.'
  nl.a1.unit19.lesson02.teach.niet_koud:
    title: Contrastar temperaturas
    gloss: No hace frío, hace calor.
    note: '*Niet* niega *koud* y va justo delante del adjetivo.'
  nl.a1.unit19.lesson03.teach.weerbericht:
    title: El pronóstico del tiempo
    gloss: el pronóstico del tiempo
    note: 'Un sustantivo neutro: *het weerbericht*, compuesto de *weer* (tiempo) y *bericht* (informe).'
    example_gloss: ¿Cuál es el pronóstico del tiempo?
  nl.a1.unit19.lesson03.teach.morgen_zonnig:
    title: El tiempo de mañana
    gloss: Mañana hace sol.
    note: '*Morgen* (mañana) pasa al principio de la frase, así que después va *is het* con el orden invertido.'
  nl.a1.unit19.lesson03.teach.zaterdag_zondag:
    title: Un pronóstico de dos días
    gloss: El sábado hace sol y calor, pero el domingo llueve todo el día.
    note: '*De hele dag* (todo el día) refuerza cuánto dura la lluvia.'
  nl.a1.unit19.lesson04.teach.wandeling:
    title: El paseo
    gloss: el paseo
    note: 'Un sustantivo de género común: *de wandeling*.'
    example_gloss: ¿Vamos a dar un paseo?
  nl.a1.unit19.lesson04.teach.zullen_we_wandeling:
    title: Proponer un paseo
    gloss: ¿Vamos a dar un paseo?
    note: '*Zullen we...?* retoma el patrón para proponer planes de la unidad 11; *een wandeling maken* (literalmente «hacer un paseo») es la forma fija de decir «dar un paseo».'
  nl.a1.unit19.lesson04.teach.binnen_blijven:
    title: Un plan condicional
    gloss: Si llueve, nos quedamos dentro.
    note: '*Als* (si) introduce la condición; la oración principal *blijven we binnen* invierte el sujeto y el verbo porque la oración con als va primero.'
  nl.a1.unit19.lesson04.teach.goed_idee_laten:
    title: Aceptar y proponer
    gloss: ¡Buena idea! Vamos a dar un paseo.
    note: '*Laten we...* (vamos a...) es otra forma común de proponer una actividad, además de *Zullen we...?* de la unidad 11.'
  nl.a1.unit19.lesson05.teach.weerbericht_tekst:
    title: Lee un pronóstico de dos días
    gloss: 'Pronóstico del tiempo: el sábado hace sol y calor. El domingo llueve todo el día.'
    note: Fíjate en qué día tiene qué condiciones.
    glosses:
      Weerbericht: pronóstico del tiempo
      zaterdag: sábado
      zonnig: soleado
      warm: caluroso
      Zondag: domingo
      regent: llueve
      hele: toda
      dag: día
  nl.a1.unit19.lesson06.teach.lotte_ask_weather:
    title: Lotte pregunta por el fin de semana
    gloss: 'Lotte: ¿Qué tiempo hará este fin de semana?'
    note: '*Dit weekend* (este fin de semana) sitúa la pregunta en un futuro cercano.'
  nl.a1.unit19.lesson06.teach.omar_forecast:
    title: Omar cuenta la previsión
    gloss: 'Omar: El sábado hará sol y calor, pero el domingo lloverá todo el día.'
    note: Coincide exactamente con el pronóstico leído antes.
  nl.a1.unit19.lesson06.teach.lotte_suggest_walk:
    title: Lotte propone un plan
    gloss: 'Lotte: ¿Entonces damos un paseo el sábado?'
    note: '*Dan* (entonces) vincula la propuesta con el buen tiempo que Omar acaba de describir.'
  nl.a1.unit19.lesson06.teach.omar_agree:
    title: Omar acepta y planea el domingo
    gloss: 'Omar: Buena idea. Y el domingo nos quedamos tan a gusto en casa.'
    note: '*Lekker* aquí es una palabra de relleno que significa algo como «a gusto» o «tan bien», y se usa antes de un adjetivo o verbo para que suene más agradable.'
  nl.a1.unit19.lesson06.teach.lotte_closing:
    title: Lotte cierra el plan
    gloss: 'Lotte: Perfecto, entonces veremos una película.'
    note: '*Kijken* (ver, mirar) combina de forma natural con *een film* (una película).'
