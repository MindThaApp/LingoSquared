teaching:
  nl.a2.unit75.lesson01.teach.scherm:
    title: La pantalla
    gloss: la pantalla
    note: '*Het scherm* es un sustantivo neutro (het).'
    example_gloss: Miro mucho mi pantalla.
  nl.a2.unit75.lesson01.teach.telefoon_vaak:
    title: Decir que usas mucho el teléfono
    gloss: Uso mucho el teléfono.
    note: '*Vaak* (a menudo, mucho) suele ir después del complemento directo en una oración simple como esta.'
  nl.a2.unit75.lesson01.teach.hoe_vaak:
    title: Preguntar con qué frecuencia alguien usa las redes sociales
    gloss: ¿Con qué frecuencia usas las redes sociales?
    note: '*Sociale media* es un plural, un término tomado del inglés y adaptado, que en neerlandés se usa como en español: con verbo en plural.'
  nl.a2.unit75.lesson02.teach.app:
    title: La aplicación
    gloss: la aplicación
    note: '*De app* es un sustantivo de género común (de), un préstamo que se usa sin cambios en el neerlandés cotidiano.'
    example_gloss: Uso una aplicación para chatear.
  nl.a2.unit75.lesson02.teach.chatten_vrienden:
    title: Decir que chateas con amigos
    gloss: Chateo a menudo con mis amigos en el teléfono.
    note: '*Chatten* (chatear) es un verbo prestado que se conjuga de forma regular, como un verbo neerlandés.'
  nl.a2.unit75.lesson02.teach.welke_apps:
    title: Preguntar qué aplicaciones usa más alguien
    gloss: ¿Qué aplicaciones usas más?
    note: '*Het meest* (lo más) es la forma superlativa que se usa aquí para preguntar por la opción principal.'
  nl.a2.unit75.lesson03.teach.schermtijd:
    title: El tiempo de pantalla
    gloss: el tiempo de pantalla
    note: '*De schermtijd* es un sustantivo de género común (de), compuesto de *scherm* (pantalla) y *tijd* (tiempo).'
    example_gloss: Esta semana tengo demasiado tiempo de pantalla.
  nl.a2.unit75.lesson03.teach.mening_schermtijd:
    title: Dar tu opinión sobre tu propio tiempo de pantalla
    gloss: Creo que paso demasiado tiempo frente a las pantallas.
    note: '*Ik vind dat ...* (creo que ...) es la forma habitual de introducir una opinión con una oración subordinada.'
  nl.a2.unit75.lesson03.teach.slecht_voor_ogen:
    title: Decir que algo no es bueno para tus ojos
    gloss: No es bueno para tus ojos.
    note: '*Je ogen* (tus ojos) usa el posesivo informal *je*, acorde con el registro informal de esta unidad.'
  nl.a2.unit75.lesson04.teach.gewoonte:
    title: La costumbre
    gloss: la costumbre
    note: '*De gewoonte* es un sustantivo de género común (de).'
    example_gloss: Es una mala costumbre mirar el teléfono continuamente.
  nl.a2.unit75.lesson04.teach.mening_minder:
    title: Dar una opinión con volgens mij
    gloss: En mi opinión, deberías pasar menos tiempo con el teléfono.
    note: '*Volgens mij* (en mi opinión, literalmente «según yo») es otra forma habitual de introducir una opinión personal, junto a *ik vind dat*.'
  nl.a2.unit75.lesson04.teach.mee_eens:
    title: Mostrar acuerdo con la opinión de alguien
    gloss: Estoy de acuerdo con eso.
    note: '*Het ergens mee eens zijn* (estar de acuerdo con algo) es la expresión fija; *daar* retoma lo que se acaba de decir.'
  nl.a2.unit75.lesson05.teach.blog:
    title: Leer una entrada de blog sobre el tiempo de pantalla
    gloss: Mucha gente usa el móvil más de cuatro horas al día. Las redes sociales son divertidas, pero demasiado tiempo frente a la pantalla no es saludable. Intenta pasar una hora cada tarde sin el móvil. Eso es bueno para los ojos y para el sueño.
    note: '*Probeer ... door te brengen* (intenta pasar ...) usa *proberen* + *te* + infinitivo, una construcción habitual para dar sugerencias.'
    glosses:
      Veel: muchos / mucho
      mensen: personas / gente (plural de mens)
      gebruiken: usan (ellos usan; de gebruiken)
      hun: su (de ellos)
      telefoon: teléfono
      meer: más
      dan: que (meer dan = más que)
      vier: cuatro
      uur: hora(s)
      dag: día
      Sociale: social (adjetivo, de sociaal)
      media: medios / redes
      zijn: son (plural de zijn, ser)
      leuk: divertido / agradable
      maar: pero
      veel: mucho (te veel = demasiado)
      schermtijd: el tiempo de pantalla
      niet: 'no'
      gezond: saludable
      Probeer: intenta (imperativo de proberen)
      elke: cada / todos los
      avond: tarde / noche
      zonder: sin
      brengen: pasar (aquí doorbrengen = pasar tiempo)
      Dat: eso
      goed: bien
      ogen: ojos (plural de oog)
      slaap: dormir
  nl.a2.unit75.lesson06.teach.omar_vraag:
    title: Omar pregunta con qué frecuencia
    gloss: 'Omar: ¿Con qué frecuencia usas las redes sociales, Lotte?'
  nl.a2.unit75.lesson06.teach.lotte_drie_uur:
    title: Lotte responde con una cifra
    gloss: 'Lotte: La verdad es que bastante a menudo. Miro la pantalla unas tres horas al día.'
  nl.a2.unit75.lesson06.teach.omar_niet_te_veel:
    title: Omar cuestiona la cantidad
    gloss: 'Omar: Es bastante. ¿No te parece demasiado?'
  nl.a2.unit75.lesson06.teach.lotte_te_veel:
    title: Lotte admite que es demasiado
    gloss: 'Lotte: Sí, en realidad me parece demasiado. Quiero pasar menos tiempo con el móvil.'
  nl.a2.unit75.lesson06.teach.omar_wegleggen:
    title: Omar sugiere guardar el móvil
    gloss: 'Omar: Quizá podrías guardar el móvil por las noches.'
  nl.a2.unit75.lesson06.teach.lotte_goed_idee:
    title: Lotte acepta probarlo
    gloss: 'Lotte: Buena idea. Lo intentaré a partir de hoy.'
  nl.a2.unit75.lesson06.teach.grammar_vinden_dat:
    title: 'Tercera persona: vindt/heeft/zij/haar'
    gloss: Lotte piensa que tiene demasiado tiempo de pantalla. Quiere pasar menos tiempo con su móvil.
    note: '*Vindt* y *heeft* son las formas de tercera persona del singular de *vinden* (opinar/encontrar) y *hebben* (tener); *zij* (ella) y *haar* (su) son los pronombres femeninos de tercera persona correspondientes, usados aquí para resumir en tercera persona las palabras de Lotte.'
