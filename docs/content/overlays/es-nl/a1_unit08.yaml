teaching:
  nl.a1.unit08.lesson01.teach.station_supermarkt_bibliotheek_ziekenhuis:
    title: Estación, supermercado, biblioteca, hospital
    gloss: la estación, el supermercado, la biblioteca, el hospital
    note: 'Con *station* se usa *het*: *het station*. En neerlandés *supermarkt* se escribe en una sola palabra: *de supermarkt*. Con *bibliotheek* se usa *de*: *de bibliotheek*. En neerlandés *ziekenhuis* se escribe en una sola palabra: *het ziekenhuis*.'
    example_gloss:
    - ¿Dónde está la estación?
    - El supermercado está al lado de la estación.
    - La biblioteca está enfrente de la estación.
    - El hospital está detrás de la biblioteca.
  nl.a1.unit08.lesson01.teach.bank_postkantoor_bushalte:
    title: Banco, oficina de correos, parada de autobús
    gloss: el banco, la oficina de correos, la parada de autobús
    note: 'Para el banco como entidad financiera, el neerlandés usa *de bank*. En neerlandés *postkantoor* se escribe en una sola palabra y lleva *het*: *het postkantoor*. En neerlandés *bushalte* se escribe en una sola palabra y lleva *de*: *de bushalte*.'
    example_gloss:
    - El banco está al lado del supermercado.
    - La oficina de correos está entre la biblioteca y el hospital.
    - La parada de autobús está delante de la estación.
  nl.a1.unit08.lesson02.teach.naast_tegenover:
    title: Al lado de, enfrente de
    gloss: al lado de, enfrente de
    note: '*Naast* coloca una cosa justo al lado de otra. *Tegenover* indica que dos lugares están uno frente al otro, a menudo a ambos lados de una calle o de un espacio abierto.'
    example_gloss:
    - El banco está al lado del supermercado.
    - La biblioteca está enfrente de la estación.
  nl.a1.unit08.lesson02.teach.supermarket_next:
    title: El supermercado está al lado de la estación
    gloss: El supermercado está al lado de la estación.
    note: '*Naast* significa justo al lado: *De supermarkt is naast het station*.'
  nl.a1.unit08.lesson02.teach.library_opposite:
    title: La biblioteca está enfrente de la estación
    gloss: La biblioteca está enfrente de la estación.
    note: 'Mantén *het* con *station*: *tegenover het station*.'
  nl.a1.unit08.lesson03.teach.achter_voor:
    title: Detrás de, delante de
    gloss: detrás de, delante de
    note: '*Achter* ubica un lugar detrás de otro. Aquí, *voor* significa delante de; en otras frases puede tener otros significados.'
    example_gloss:
    - El hospital está detrás de la biblioteca.
    - La parada de autobús está delante de la estación.
  nl.a1.unit08.lesson03.teach.hospital_behind:
    title: El hospital está detrás de la biblioteca
    gloss: El hospital está detrás de la biblioteca.
    note: 'Pon *achter* antes del otro lugar: *achter de bibliotheek*.'
  nl.a1.unit08.lesson03.teach.stop_in_front:
    title: La parada de autobús está delante de la estación
    gloss: La parada de autobús está delante de la estación.
    note: Aquí, *voor* indica dónde está la parada de autobús.
  nl.a1.unit08.lesson04.teach.waar_is:
    title: ¿Dónde está ...?
    gloss: ¿Dónde está ...?
    note: Usa *Waar is ...?* para preguntar dónde está un lugar.
  nl.a1.unit08.lesson04.teach.where_post_office:
    title: ¿Dónde está la oficina de correos?
    gloss: ¿Dónde está la oficina de correos?
    note: Mantén *het* con *postkantoor* en la pregunta.
  nl.a1.unit08.lesson04.teach.tussen_bij:
    title: Entre, cerca de / en
    gloss: entre, cerca de / en
    note: Usa *tussen ... en ...* para situar un lugar entre otros dos. *Bij* indica que un lugar está cerca de otro; es menos exacto que *naast*.
    example_gloss:
    - La oficina de correos está entre la biblioteca y el hospital.
    - El supermercado está cerca de la estación.
  nl.a1.unit08.lesson04.teach.in_de_buurt_van:
    title: Cerca
    gloss: cerca
    note: Las palabras *in de buurt van* juntas significan que un lugar está cerca.
  nl.a1.unit08.lesson04.teach.post_office_between:
