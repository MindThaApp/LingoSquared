  nl.a1.unit08.lesson06.teach.stop_location:
    title: Ubicar la parada de autobús
    gloss: 'Lotte: La parada de autobús está delante de la estación.'
    note: Lotte responde con una sola frase que indica directamente el lugar.
  nl.a1.unit08.lesson06.teach.more_places:
    title: Ubicar el supermercado
    gloss: 'Omar: ¿Y dónde está el supermercado? Lotte: El supermercado está junto a la estación, cerca del banco.'
    note: La respuesta indica dónde está el supermercado en relación con dos lugares.
  nl.a1.unit08.lesson06.teach.library:
