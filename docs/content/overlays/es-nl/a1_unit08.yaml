  nl.a1.unit08.lesson05.teach.kaart_buurtkaart:
    title: Mapa, mapa del barrio
    gloss: el mapa, el mapa del barrio
    note: '*De kaart* puede ser un mapa u otro tipo de tarjeta; aquí significa mapa. En neerlandés *buurtkaart* se escribe en una sola palabra: *de buurtkaart*.'
    example_gloss:
    - ¿Dónde está el mapa?
    - Aquí está el mapa del barrio.
  nl.a1.unit08.lesson05.teach.map_labels:
    title: Etiquetas del mapa del barrio
    gloss: 'Biblioteca: enfrente de la estación. Hospital: detrás de la biblioteca. Oficina de correos: entre la biblioteca y el hospital. Supermercado: junto a la estación. Banco: junto al supermercado. Parada de autobús: delante de la estación.'
    note: Cada etiqueta nombra un lugar e indica dónde está.
    glosses:
      BUURTKAART: MAPA DEL BARRIO
      Bibliotheek: biblioteca
      tegenover: enfrente de
      station: estación
      Ziekenhuis: hospital
      achter: detrás de
