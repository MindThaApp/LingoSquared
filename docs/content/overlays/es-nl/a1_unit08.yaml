    note: Usa *en* entre los otros dos lugares.
  nl.a1.unit08.lesson04.teach.supermarket_near:
    title: El supermercado está cerca de la estación
    gloss: El supermercado está cerca de la estación.
    note: '*Bij* indica una ubicación cercana sin afirmar que los edificios estén justo uno al lado del otro.'
  nl.a1.unit08.lesson04.teach.library_vicinity:
