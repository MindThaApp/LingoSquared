teaching:
  nl.a2.unit100.lesson01.teach.kleding:
    title: La ropa
    gloss: la chaqueta / el jersey / el pantalón / la bufanda / el vestido / el zapato
    note: Las palabras de ropa de A1 vuelven aquí. Todas son palabras *de*. El plural de *schoen* es *schoenen*.
    example_gloss:
    - Tengo una chaqueta.
    - El jersey es azul.
    - El pantalón es largo.
    - Los zapatos son negros.
  nl.a2.unit100.lesson01.teach.kleuren:
    title: Colores
    gloss: rojo / azul / verde / amarillo / negro / blanco
    note: Los colores son adjetivos. En esta unidad aprenderás cuándo llevan una terminación.
    example_gloss:
    - La chaqueta es roja.
    - El bolso es negro.
    - El papel es blanco.
  nl.a2.unit100.lesson01.teach.grootte:
    title: Talla
    gloss: grande / pequeño / largo / corto
    example_gloss:
    - La casa es grande.
    - La llave es pequeña.
    - La bufanda es larga.
    - El vestido es corto.
  nl.a2.unit100.lesson01.teach.huis:
    title: En casa
    gloss: la mesa / la silla / la lámpara / la cama / la casa / el libro / el papel
    note: 'Aprende cada sustantivo con *de* o *het*. A partir de ahora esto importa para los adjetivos: *bed, huis, boek* y *papier* son palabras *het*.'
    example_gloss:
    - La mesa es grande.
    - La cama es pequeña.
    - El libro es azul.
    - La lámpara es amarilla.
  nl.a2.unit100.lesson01.teach.kwijt:
    title: Objetos perdidos
    gloss: el bolso / la llave / el paraguas / el monedero / perdido
    note: '*Kwijt zijn* significa haber perdido algo y no saber dónde está.'
    example_gloss:
    - He perdido mi bolso.
    - La llave es pequeña.
    - El paraguas es verde.
    - El monedero es rojo.
  nl.a2.unit100.lesson01.teach.gn_na_zijn:
    title: Sin terminación después de zijn
    gloss: La chaqueta es roja. La casa es grande. Las chaquetas son rojas.
    note: 'Después de *zijn* el adjetivo no cambia y no lleva *-e*: *de jas is rood, het huis is groot, de jassen zijn rood*. La *-e* solo aparece cuando el adjetivo va delante del sustantivo.'
  nl.a2.unit100.lesson02.teach.eigenschappen:
    title: Más adjetivos
    gloss: bonito / viejo / nuevo / cálido / suave
    example_gloss:
    - La lámpara es bonita.
    - La casa es vieja.
    - El jersey es nuevo.
    - La bufanda es cálida.
    - La cama es blanda.
  nl.a2.unit100.lesson02.teach.gn_bepaald:
    title: 'Con de o het: siempre -e'
    gloss: la chaqueta roja, el bolso grande, el jersey azul; la casa roja, la cama grande, el papel blanco
    note: 'Después de *de* o *het*, el adjetivo que va delante del sustantivo siempre termina en *-e*, tanto con palabras *de* como con palabras *het*: *de rode jas* y *het rode huis*.'
  nl.a2.unit100.lesson02.teach.gn_spelling:
    title: Cambios de ortografía
    gloss: 'rojo, grande, blanco, amarillo: cómo se escriben delante de un sustantivo'
    note: 'Al añadir *-e* la ortografía puede cambiar. Una vocal larga escrita doble pierde una letra: *rood → rode, groot → grote, geel → gele*. Una vocal corta ante una sola consonante final duplica esa consonante: *wit → witte*.'
  nl.a2.unit100.lesson02.teach.gn_regelmatig:
    title: La mayoría de los adjetivos solo añaden -e
    gloss: azul, negro, verde, nuevo, viejo, bonito, pequeño, largo, corto, cálido, suave
    note: La mayoría de los adjetivos simplemente añaden *-e* sin ningún cambio de ortografía.
  nl.a2.unit100.lesson02.teach.zinnen:
    title: Tres frases
    gloss: La chaqueta roja es bonita. El papel blanco es nuevo. La silla verde es vieja.
    note: 'El adjetivo delante del sustantivo lleva *-e*; después de *is* no cambia: *de jas is mooi*.'
  nl.a2.unit100.lesson03.teach.hebben:
    title: Tener cosas
    gloss: Tengo una cama grande. Ella tiene un bolso grande. Ella tiene zapatos rojos. Él tiene un libro azul.
    note: '*Zij* y *ze* significan ambos «ella». Fíjate en las terminaciones: *groot bed* pero *grote tas*.'
  nl.a2.unit100.lesson03.teach.gn_een:
    title: Con een
    gloss: una chaqueta roja, un bolso grande; una casa roja, una cama grande
    note: Después de *een*, una palabra *de* mantiene la *-e* (*een rode jas*), pero una palabra *het* no lleva terminación (*een rood huis*). Por tanto, *het rode huis* pero *een rood huis*.
  nl.a2.unit100.lesson03.teach.gn_zonder:
    title: Sin artículo
    gloss: papel blanco, papel rojo; chaquetas rojas, casas rojas, bolsos grandes
    note: Una palabra *het* en singular sin artículo no lleva terminación (*wit papier*). Un plural siempre lleva *-e* (*rode jassen, rode huizen*), sea cual sea el sustantivo.
  nl.a2.unit100.lesson03.teach.gn_contrast:
    title: ¿Palabra het o palabra de?
    gloss: la casa roja → una casa roja; la chaqueta roja → una chaqueta roja
    note: 'Delante de un sustantivo, solo un caso no lleva *-e*: una palabra *het* en singular con *een* o sin artículo. En todos los demás casos termina en *-e*.'
  nl.a2.unit100.lesson04.teach.materiaal:
    title: Materiales
    gloss: de madera / de lana / de algodón / de cuero
    note: Para decir de qué material está hecho algo, usa *van* más el material.
    example_gloss:
    - La mesa es de madera.
    - El suéter es de lana.
    - El bolso es de cuero.
    - Los pantalones son de algodón.
  nl.a2.unit100.lesson04.teach.bezit:
    title: El poseedor
    gloss: mi / tu / su (de él) / su (de ella)
    note: '*Je* y *jouw* significan ambos «tu» cuando hablas con un solo amigo.'
    example_gloss:
    - Mi vieja mesa es de madera.
    - Tu chaqueta nueva es de lana.
    - Su librito es nuevo.
    - Su bolso grande es negro.
  nl.a2.unit100.lesson04.teach.gn_bezit:
    title: Los posesivos funcionan como de o het
    gloss: mi casa roja, su bolso grande, su libro viejo, tu chaqueta nueva
    note: 'Después de *mijn, jouw, je, zijn* y *haar* el adjetivo termina en *-e*, también con palabras *het*: *mijn rode huis*, *zijn oude boek*.'
  nl.a2.unit100.lesson04.teach.gn_volgorde:
    title: Tamaño, color, material
    gloss: un bolso rojo grande de cuero; la casa blanca pequeña
    note: 'Si hay varios adjetivos, todos reciben la misma terminación. El tamaño va antes que el color: *een grote rode tas*. El material va después del sustantivo con *van*: *een tas van leer*.'
  nl.a2.unit100.lesson04.teach.zinnen:
    title: Dos frases
    gloss: Omar tiene un bolso negro grande de cuero. Su suéter es de lana.
  nl.a2.unit100.lesson05.teach.bericht:
    title: Noor ha perdido su bolso
    gloss: Hola, Lotte, ¡he perdido mi bolso! Es un bolso pequeño y negro de cuero. Dentro del bolso hay un monedero rojo y una llave. La llave es de mi casa. También ha desaparecido mi larga bufanda amarilla de lana. Mi paraguas es verde y nuevo. ¿Puedes ayudarme? Un saludo, Noor
    note: 'Fíjate en las terminaciones: *kleine zwarte tas*, pero *paraplu is groen*.'
    glosses:
      weg: desaparecido
      helpen: ayudar
      mij: me
      Groetjes: saludos
      zit: está (dentro)
      Ook: también
  nl.a2.unit100.lesson06.teach.vraag:
    title: Omar pregunta qué pasa
    gloss: 'Omar: Lotte, ¿qué pasa?'
  nl.a2.unit100.lesson06.teach.jas_kwijt:
    title: Lotte dice que ha perdido su chaqueta
    gloss: 'Lotte: He perdido mi chaqueta.'
  nl.a2.unit100.lesson06.teach.wat_voor:
    title: Omar pregunta qué tipo de chaqueta es
    gloss: 'Omar: ¿Qué tipo de chaqueta es?'
  nl.a2.unit100.lesson06.teach.beschrijving:
    title: Lotte describe la chaqueta
    gloss: 'Lotte: Una chaqueta larga y verde de lana.'
  nl.a2.unit100.lesson06.teach.oud_of_nieuw:
    title: Omar pregunta si es vieja o nueva
    gloss: 'Omar: ¿Es tu chaqueta vieja o tu chaqueta nueva?'
  nl.a2.unit100.lesson06.teach.nieuwe_jas:
    title: Lotte dice que es la nueva
    gloss: 'Lotte: Mi chaqueta nueva. Es verde y muy bonita.'
