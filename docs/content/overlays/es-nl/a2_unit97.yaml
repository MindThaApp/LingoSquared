course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para transmitir mensajes.
  learning_goal: Transmite lo que alguien dijo o preguntó con zegt dat, vraagt of y laat weten.
units:
  nl.a2.unit97.doorgeven_wat_iemand_zegt:
    title: Transmitir lo que dice alguien
    description: Transmite un mensaje con zegt dat, vraagt of y laat weten, en presente.
lessons:
  nl.a2.unit97.lesson01.wat_zegt_hij:
    title: ¿Qué dice él?
  nl.a2.unit97.lesson02.ze_vraagt_of:
    title: Ella pregunta si ...
  nl.a2.unit97.lesson03.van_ik_naar_hij:
    title: De yo a él
  nl.a2.unit97.lesson04.een_bericht_doorgeven:
    title: Transmitir un mensaje
  nl.a2.unit97.lesson05.een_briefje_lezen:
    title: Leer una nota
  nl.a2.unit97.lesson06.de_collega_belt:
    title: Llama el colega
teaching:
  nl.a2.unit97.lesson01.teach.berichten:
    title: Mensajes y notas
    gloss: el mensaje / la nota / el teléfono / llamar
    note: Het bericht es la palabra general para un mensaje; het briefje es una nota corta escrita.
    example_gloss:
    - Noor llama a Omar.
    - Tengo un mensaje.
    - La nota está en casa.
  nl.a2.unit97.lesson01.teach.tijd:
    title: Cuándo y dónde
    gloss: más tarde / hoy / mañana / esta noche / en casa
    note: Estas palabras pequeñas aparecen en casi todos los mensajes.
    example_gloss:
    - Vengo más tarde.
    - Lotte trabaja hoy.
    - Mañana estoy en casa.
    - Esta noche tengo tiempo.
  nl.a2.unit97.lesson01.teach.voornaamwoorden:
    title: Quién habla
    gloss: él / ella / ella / yo / tú / tú
    note: Ze y zij significan ambas «ella» aquí. Je y jij significan ambas «tú» entre amigos; jij es la forma acentuada y je la habitual.
    example_gloss:
    - Él trabaja hoy.
    - Ella viene más tarde.
    - Estoy en casa.
  nl.a2.unit97.lesson01.teach.werkwoorden:
    title: Verbos para mensajes
    gloss: venir / trabajar / decir / preguntar / también / no
    note: Zeggen y vragen son los dos verbos principales para transmitir un mensaje.
    example_gloss:
    - Yo no trabajo.
    - Él también viene.
  nl.a2.unit97.lesson01.teach.gn_dat:
    title: Zeggen con dat
    gloss: 'Omar dice: «Vengo más tarde». Omar dice que viene más tarde.'
    note: Para transmitir una afirmación, usa zegt dat. Las palabras del hablante pasan a ser una oración subordinada después de dat, y el verbo (el que concuerda con el sujeto) va al final de esa oración. El ik del hablante se convierte en hij o ze.
  nl.a2.unit97.lesson01.teach.zinnen:
    title: Dos afirmaciones transmitidas
    gloss: Omar dice que viene más tarde. Noor dice que trabaja hoy.
  nl.a2.unit97.lesson02.teach.werk:
    title: Palabras del trabajo
    gloss: la cita / la reunión / el colega / el trabajo / tiempo
    note: 'Tijd sin artículo significa «tiempo» en general: Ik heb tijd.'
    example_gloss:
    - La reunión es hoy.
    - Mi colega trabaja mañana.
    - Tengo tiempo.
  nl.a2.unit97.lesson02.teach.vraagwoorden:
    title: Palabras interrogativas
    gloss: dónde / cuándo / quién / si / es, está / tiene / espera
    note: Of se usa en el estilo indirecto para las preguntas de sí o no.
    example_gloss:
    - ¿Quién es el colega?
    - ¿Dónde está Omar?
    - ¿Cuándo viene Lotte?
    - ¿Tiene tiempo Noor?
    - ¿Trabaja Omar mañana?
    - ¿Dónde espera Noor?
  nl.a2.unit97.lesson02.teach.gn_of:
    title: Vragen con of
    gloss: 'Él pregunta: «¿Tiene tiempo Noor?». Él pregunta si Noor tiene tiempo.'
    note: Una pregunta de sí o no se convierte en of más una oración con el verbo al final. El orden de la pregunta (verbo primero) desaparece.
  nl.a2.unit97.lesson02.teach.gn_vraagwoord:
    title: Vragen con waar y wanneer
    gloss: 'Ella pregunta: «¿Dónde es la reunión?». Ella pregunta dónde es la reunión.'
    note: Una pregunta con palabra interrogativa mantiene esa palabra (waar, wanneer) y el verbo va al final. No se añade ninguna palabra extra como dat u of.
  nl.a2.unit97.lesson02.teach.zinnen:
    title: Dos preguntas transmitidas
    gloss: Ella pregunta si Omar tiene tiempo. Él pregunta dónde es la reunión.
  nl.a2.unit97.lesson03.teach.modaal:
    title: Palabras pequeñas que cambian
    gloss: puede / quiere / debe / mi / su (de él) / su (de ella)
    note: Zijn también puede significar «ser/estar», pero delante de un sustantivo, como en zijn telefoon, significa «su» (de él).
    example_gloss:
    - Puedo venir.
    - Quiero trabajar.
    - Tengo que trabajar.
    - Su teléfono está en casa.
    - Mi cita es hoy.
  nl.a2.unit97.lesson03.teach.gn_voornaamwoord:
    title: Cambia los pronombres
    gloss: 'Omar dice: «Tengo mi teléfono». Omar dice que tiene su teléfono.'
    note: 'Al transmitir un mensaje, ik se convierte en hij o ze, y mijn en zijn (si es un hombre) o haar (si es una mujer). El verbo también cambia: ik heb pasa a hij heeft.'
  nl.a2.unit97.lesson03.teach.gn_contrast:
    title: Estilo directo e indirecto
    gloss: 'Omar dice: «Vengo más tarde». Omar dice que viene más tarde.'
    note: 'Estilo directo: dos puntos, las palabras del propio hablante, el verbo en segunda posición (ik kom). Estilo indirecto: dat, hij en lugar de ik, y el verbo al final (hij later komt).'
  nl.a2.unit97.lesson03.teach.gn_modaal:
    title: Dos verbos al final
    gloss: 'Omar dice: «No puedo venir». Omar dice que no puede venir.'
    note: 'Con kan, wil o moet hay dos verbos. En la oración con dat ambos van al final, con el verbo modal (el conjugado) antes del infinitivo: dat hij niet kan komen.'
  nl.a2.unit97.lesson03.teach.zinnen:
    title: Dos afirmaciones transmitidas más
    gloss: Noor dice que su teléfono está en casa. Omar dice que no puede venir.
  nl.a2.unit97.lesson04.teach.doorgeven:
    title: Transmitir
    gloss: transmitir / avisar, hacer saber / de / allí, hay
    note: 'Laten weten significa «hacer saber» o «avisar a alguien». En una oración: Lotte laat weten dat ...'
    example_gloss:
    - Quiero transmitir el mensaje.
    - Hay un mensaje de Noor.
    - Lotte nos avisa de que viene.
  nl.a2.unit97.lesson04.teach.gn_opening:
    title: Cómo empezar
    gloss: Hay un mensaje de Noor. Dice que esta noche está en casa.
    note: Empieza con Er is een bericht van ... y luego transmite el contenido con zegt dat o vraagt of. Después de la primera oración puedes usar hij o ze.
  nl.a2.unit97.lesson04.teach.gn_laat_weten:
    title: Laten weten
    gloss: Noor nos avisa de que viene mañana. Omar nos avisa de si tiene tiempo.
    note: 'Laat weten dat es una buena forma de transmitir noticias en un mensaje. Funciona como zegt dat: el verbo va al final. Laat weten of transmite si algo es así o no, como en Omar laat weten of hij tijd heeft.'
  nl.a2.unit97.lesson04.teach.zinnen:
    title: Un breve recado
    gloss: Hay un mensaje de Omar. Avisa de que mañana trabaja.
  nl.a2.unit97.lesson05.teach.reading:
    title: Una nota de Omar
    gloss: Hola, Lotte, hay un mensaje de Noor. Dice que esta noche no puede venir, porque tiene que trabajar. Pregunta si tú tienes tiempo mañana. Un colega avisa de que la reunión es a las nueve.
    note: 'En esta nota Omar transmite dos mensajes: el de Noor y el de un colega.'
  nl.a2.unit97.lesson06.teach.d01:
    title: Omar le cuenta a Lotte lo de la llamada
    gloss: 'Omar: Hola, Lotte, llama el colega.'
  nl.a2.unit97.lesson06.teach.d02:
    title: Lotte pregunta qué dice
    gloss: 'Lotte: ¿Ah, sí? ¿Qué dice?'
  nl.a2.unit97.lesson06.teach.d03:
    title: Omar transmite el mensaje
    gloss: 'Omar: Dice que la reunión es mañana a las nueve.'
  nl.a2.unit97.lesson06.teach.d04:
    title: Lotte pregunta por una pregunta
    gloss: 'Lotte: ¿Pregunta también si tengo tiempo?'
  nl.a2.unit97.lesson06.teach.d05:
    title: Omar lo confirma
    gloss: 'Omar: Sí, pregunta si tienes tiempo mañana.'
  nl.a2.unit97.lesson06.teach.d06:
    title: Lotte responde
    gloss: 'Lotte: Bien, tengo tiempo. Le aviso al colega de que voy.'
