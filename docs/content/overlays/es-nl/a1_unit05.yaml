teaching:
  nl.a1.unit05.lesson01.teach.vader_moeder:
    title: Padre y madre
    gloss: padre / madre
    note: '*Vader* es la palabra estándar y neutra para «padre». *Moeder* es la palabra estándar y neutra para «madre».'
    example_gloss:
    - Este es mi padre.
    - Esa es mi madre.
  nl.a1.unit05.lesson01.teach.ouders_broer_zus:
    title: Padres, hermano y hermana
    gloss: padres / hermano / hermana
    note: '*Ouders* en este sentido siempre va en plural; *de broer* y *de zus* llevan ambos *de*.'
    example_gloss:
    - Mis padres viven en Utrecht.
    - Tengo un hermano.
    - Tengo una hermana.
  nl.a1.unit05.lesson01.teach.kind_kinderen:
    title: Hijo y niños
    gloss: el hijo, el niño / los hijos, los niños
    note: '*Kind* es una palabra het: *het kind*. El plural *kinderen* lleva *de*, aunque el singular *kind* lleve *het*.'
    example_gloss:
    - Mi hermana tiene un hijo.
    - Mis tíos tienen dos hijos.
  nl.a1.unit05.lesson01.teach.have_sentence:
    title: Tengo un hermano y una hermana
    gloss: Tengo un hermano y una hermana.
    note: '*Ik heb ...* es la forma estándar de decir qué familiares tienes.'
  nl.a1.unit05.lesson02.teach.opa_oma_oom_tante:
    title: Abuelo, abuela, tío y tía
    gloss: abuelo / abuela / tío / tía
    note: '*Opa* es la palabra de uso diario para «abuelo»; *grootvader* es más formal o escrita. *Oma* es la palabra de uso diario para «abuela»; *grootmoeder* es más formal o escrita. *De oom*. *De tante*.'
    example_gloss:
    - Mis abuelos viven en Róterdam.
    - Mi abuela tiene noventa y nueve años.
    - Mi tío vive en Ámsterdam.
    - Mis tíos tienen dos hijos.
  nl.a1.unit05.lesson02.teach.neef_nicht_note:
    title: Neef y nicht son ambiguos
    gloss: neef = primo o sobrino; nicht = prima o sobrina
    note: 'En neerlandés no se usa una palabra distinta para «primo» y «sobrino»/«prima» y «sobrina»; el contexto indica cuál es el significado. No se evalúa en los ejercicios de esta unidad: se menciona aquí solo para que reconozcas las palabras más adelante.'
    target_text: neef = primo o sobrino; nicht = prima o sobrina
  nl.a1.unit05.lesson02.teach.gezin:
    title: Familia (hogar)
    gloss: familia (hogar)
    note: '*Gezin* se refiere al hogar en el que vives (normalmente padres e hijos); *familie* es la palabra más amplia para la familia extensa o los parientes en general.'
    example_gloss: Mi familia (mi hogar) vive en Utrecht.
  nl.a1.unit05.lesson02.teach.opa_oma_sentence:
    title: Mis abuelos viven en Róterdam
    gloss: Mis abuelos viven en Róterdam.
    note: '*Wonen in* + nombre de ciudad indica dónde vive alguien.'
  nl.a1.unit05.lesson02.teach.oom_tante_sentence:
    title: Mis tíos tienen dos hijos
    gloss: Mis tíos tienen dos hijos.
    note: Se usa *hebben* porque *oom en tante* se refiere a dos personas.
  nl.a1.unit05.lesson03.teach.mijn_je_jouw:
    title: Mi y tu (átono y tónico)
    gloss: mi / tu (átono) / tu (tónico)
    note: '*Mijn* mantiene siempre la misma forma ante sustantivos de género de o het, en singular o en plural. *Je* es la forma informal habitual cuando no se destaca de quién es algo; tampoco cambia ante ningún sustantivo. *Jouw* es más enfático que *je* y es necesario cuando contrastas el familiar de una persona con el de otra; tampoco cambia ante ningún sustantivo.'
    example_gloss:
    - Este es mi hermano.
    - ¿Es esta tu hermana?
    - ¿Es aquella tu hermana?
  nl.a1.unit05.lesson03.teach.je_jouw_note:
    title: Je frente a jouw
    gloss: je y jouw significan ambos «tu» (informal)
    note: Usa *je* cuando no hay un énfasis especial. Usa *jouw* cuando enfatizas de quién es, sobre todo en un contraste. También se puede usar *jouw* sin contraste, pero ahí *je* es más habitual.
    target_text: je y jouw significan ambos «tu» informal. Je es lo habitual cuando no hay énfasis; jouw es más fuerte y se necesita para contrastar. Ambos mantienen la misma forma delante de cualquier sustantivo.
  nl.a1.unit05.lesson03.teach.dit_is_mijn_broer:
    title: Este es mi hermano
    gloss: Este es mi hermano.
    note: '*Dit is ...* sirve para presentar a alguien que está cerca.'
  nl.a1.unit05.lesson03.teach.is_dat_jouw_zus:
    title: ¿Es aquella tu hermana?
    gloss: ¿Es aquella tu hermana?
    note: '*Dat is ...* se refiere a alguien que está más lejos o de quien ya se ha hablado.'
  nl.a1.unit05.lesson04.teach.zijn_haar:
    title: Su (de él) y su (de ella)
    gloss: su (de él) / su (de ella)
    note: '*Zijn* mantiene siempre la misma forma, igual que *mijn*, *je* y *jouw*. *Haar* también mantiene siempre la misma forma.'
    example_gloss:
    - Este es su padre.
    - Esa es su madre.
  nl.a1.unit05.lesson04.teach.zijn_haar_note:
    title: Zijn frente a haar
    gloss: zijn = su (de él), haar = su (de ella)
    note: 'Para las personas de estos ejemplos, elige *zijn* si el poseedor es un hombre y *haar* si es una mujer. La palabra de familia que sigue no influye en la elección: *zijn vader* y *zijn moeder*; *haar vader* y *haar moeder*.'
    target_text: zijn = su (de él), haar = su (de ella); ambos se mantienen igual sea cual sea el sustantivo que sigue.
  nl.a1.unit05.lesson04.teach.dit_is_zijn_vader:
    title: Este es su padre
    gloss: Este es su padre.
    note: '*Zijn vader*: su padre (de él).'
  nl.a1.unit05.lesson04.teach.dat_is_haar_moeder:
    title: Esa es su madre
    gloss: Esa es su madre.
    note: '*Haar moeder*: su madre (de ella).'
  nl.a1.unit05.lesson05.teach.heet:
    title: Se llama
    gloss: se llama
    note: '*Ik heet...* / *Hij heet...*: la forma estándar de decir el nombre de alguien, ya vista en la Unidad 1.'
    example_gloss: Me llamo Lotte.
  nl.a1.unit05.lesson05.teach.sander_fenna_jan_marieke:
    title: 'Nombres de familiares: Sander, Fenna, Jan y Marieke'
    gloss: Sander (nombre masculino neerlandés) / Fenna (nombre femenino neerlandés) / Jan (nombre masculino neerlandés) / Marieke (nombre femenino neerlandés)
    note: 'Los cuatro son nombres de pila neerlandeses comunes: Sander y Jan son nombres masculinos; Fenna y Marieke, femeninos.'
    example_gloss:
    - Mi hermano se llama Sander.
    - Mi hermana se llama Fenna.
    - Mi padre se llama Jan.
    - Mi madre se llama Marieke.
  nl.a1.unit05.lesson05.teach.rotterdam:
    title: Rotterdam
    gloss: Róterdam
    note: Una de las ciudades más importantes de los Países Bajos.
    example_gloss: Los abuelos de Lotte viven en Róterdam.
  nl.a1.unit05.lesson05.teach.profile:
    title: La familia de Lotte
    gloss: Me llamo Lotte. Tengo un hermano y una hermana. Mi hermano se llama Sander y mi hermana se llama Fenna. Mi padre se llama Jan y mi madre se llama Marieke. Mis abuelos viven en Róterdam.
    note: Breve presentación oral de la familia de Lotte, con el vocabulario de las lecciones anteriores de esta unidad.
  nl.a1.unit05.lesson06.teach.egypte:
    title: Egipto
    gloss: Egipto
    note: El país de origen de Omar, como en las unidades anteriores.
    example_gloss: Mis padres viven en Egipto.
  nl.a1.unit05.lesson06.teach.elke_maand:
    title: Cada mes
    gloss: cada mes
    note: '*Elke* + sustantivo en singular expresa «cada...».'
    example_gloss: Sí, cada mes.
  nl.a1.unit05.lesson06.teach.lines01_04:
    title: ¿Tienes hermanos o hermanas?
    gloss: 'Lotte: ¿Tienes hermanos o hermanas, Omar? Omar: Sí, tengo dos hermanas. Ningún hermano. ¿Y tú? Lotte: Tengo un hermano y una hermana.'
    note: '*Broers of zussen*: hermanos o hermanas, con las formas del plural.'
  nl.a1.unit05.lesson06.teach.lines05_08:
    title: ¿Tus padres también viven en los Países Bajos?
    gloss: 'Omar: ¿Tus padres también viven en los Países Bajos? Lotte: Sí, mis padres viven en Utrecht. ¿Y tu familia? Omar: Mis padres viven en Egipto, pero mi tío vive aquí, en Ámsterdam.'
    note: '*Wonen ook in*: viven también en; sirve para preguntar si lo mismo ocurre con otra persona.'
  nl.a1.unit05.lesson06.teach.lines09_10:
    title: ¿Lo ves a menudo?
    gloss: 'Lotte: ¡Qué bien! ¿Lo ves a menudo? Omar: Sí, cada mes.'
    note: '*Zie je hem vaak?*: una forma natural y habitual de preguntar con qué frecuencia ves a alguien.'
