teaching:
  nl.a1.unit07.lesson01.teach.markt_winkel_kraam:
    title: Mercado, tienda, puesto
    gloss: el mercado, la tienda, el puesto
    note: '*De markt* puede significar un mercado en general o un mercado ambulante al aire libre. *De winkel* es una tienda. Una *kraam* es un puesto de un mercado al aire libre.'
    example_gloss:
    - Voy al mercado.
    - Voy a la tienda.
    - El puesto vende manzanas.
  nl.a1.unit07.lesson01.teach.appels_peren_tomaten_paprikas:
    title: Manzanas, peras, tomates, pimientos
    gloss: manzanas, peras, tomates, pimientos
    note: El singular es *appel*; el plural es *appels*. El singular es *peer*; el plural es *peren*. El singular es *tomaat*; el plural es *tomaten*. En neerlandés, *paprika* significa pimiento; el plural escrito es *paprika's*.
    example_gloss:
    - Quisiera manzanas.
    - Quisiera peras.
    - Quisiera tomates.
    - Quisiera pimientos.
  nl.a1.unit07.lesson02.teach.kilo:
    title: Un kilo
    gloss: un kilo
    note: '*Een kilo* es un kilogramo.'
    example_gloss: Quiero un kilo de manzanas.
  nl.a1.unit07.lesson02.teach.per_kilo:
    title: Per kilo
    gloss: por kilo
    note: En los carteles del mercado el precio suele indicarse por kilo.
  nl.a1.unit07.lesson02.teach.ask_apples:
    title: ¿Cuánto cuesta un kilo de manzanas?
    gloss: ¿Cuánto cuesta un kilo de manzanas?
    note: '*Hoeveel kost ...?* pregunta el precio. Aquí lo que cuesta es *een kilo*, así que se usa *kost* en singular.'
  nl.a1.unit07.lesson02.teach.answer_apples:
    title: Un kilo de manzanas cuesta €2,50
    gloss: Un kilo de manzanas cuesta 2,50 €.
    note: 'En neerlandés, los precios llevan coma decimal: €2,50, igual que en español.'
  nl.a1.unit07.lesson02.teach.spoken_price:
    title: Dos euros con cincuenta
    gloss: 2,50 € — dos euros con cincuenta
    note: €2,50 se dice normalmente *twee euro vijftig*, sin *en* ni *cent*.
  nl.a1.unit07.lesson03.teach.gram_pond_stuk_stuks:
    title: Gramos, una libra, una unidad, dos unidades
    gloss: cien gramos, una libra = 500 gramos, una unidad, dos unidades
    note: 'Después de un número, el neerlandés usa aquí *gram*, no *grammen*. En el neerlandés cotidiano, *een pond* son 500 gramos: es un término informal antiguo, no una unidad métrica oficial. *Per stuk* indica que cada unidad tiene su propio precio; con números mayores que uno, usa *stuks* cuando indicas solo una cantidad, como en *twee stuks*.'
    example_gloss:
    - Quiero 100 gramos de queso.
    - Una libra de manzanas, por favor.
    - ¿Me da una, por favor?
    - Quisiera dos, por favor.
  nl.a1.unit07.lesson03.teach.how_much:
    title: ¿Cuánto desea?
    gloss: ¿Cuánto desea?
    note: El vendedor usa el *u* de cortesía. *Hoeveel* sirve para preguntar tanto por un peso como por una cantidad de unidades.
  nl.a1.unit07.lesson03.teach.pond_tomatoes:
    title: Una libra de tomates, por favor
    gloss: Una libra (500 g) de tomates, por favor.
    note: Es una respuesta corta completa y natural cuando un vendedor pregunta *Hoeveel wilt u?*
  nl.a1.unit07.lesson04.teach.prijskaartje:
    title: Etiqueta de precio
    gloss: la etiqueta de precio
    note: '*Prijskaartje* se escribe en una sola palabra. Aprende aquí la palabra completa.'
    example_gloss: La etiqueta de precio dice 2,50 €.
  nl.a1.unit07.lesson04.teach.market_labels:
    title: Etiquetas de precio del mercado
    gloss: 'Manzanas: 2,50 € el kilo. Peras: 3,00 € el kilo. Tomates: 2,00 € el kilo. Pimientos: 1,00 € la unidad.'
    note: Lee *per kilo* como «por kilo» y *per stuk* como «por unidad». Las etiquetas neerlandesas usan coma en los precios.
    glosses:
      Appels: manzanas
      kilo: kilogramo
      Peren: peras
      Tomaten: tomates
      stuk: unidad / pieza
  nl.a1.unit07.lesson05.teach.what_would_you_like:
    title: ¿Qué le pongo?
    gloss: ¿Qué desea?
    note: '*Wat mag het zijn?* es una pregunta habitual y amable de un vendedor del mercado o de una tienda.'
  nl.a1.unit07.lesson05.teach.take_pears:
    title: Entonces me llevo un kilo de peras
    gloss: Entonces me llevo un kilo de peras, por favor.
    note: '*Dan neem ik ...* es una forma natural de decidir qué comprar después de oír el precio.'
  nl.a1.unit07.lesson05.teach.anything_else:
    title: ¿Algo más?
    gloss: ¿Algo más?
    note: Una pregunta corta habitual del vendedor.
  nl.a1.unit07.lesson05.teach.no_thanks:
    title: No, gracias
    gloss: No, gracias.
    note: '*Dank u* encaja con el *u* de cortesía que se usa con el vendedor.'
  nl.a1.unit07.lesson05.teach.total:
    title: Son 3,00 €
    gloss: Son 3,00 € — tres euros.
    note: '*Dat is dan ...* es una forma habitual de que el vendedor diga el total. El precio escrito €3,00 se dice *drie euro*.'
  nl.a1.unit07.lesson05.teach.pin:
    title: ¿Puedo pagar con tarjeta?
    gloss: ¿Puedo pagar con tarjeta?
    note: '*Pinnen* es el verbo neerlandés cotidiano para pagar con tarjeta de débito o de crédito en un terminal.'
  nl.a1.unit07.lesson06.teach.opening:
    title: Saludar y preguntar el precio
    gloss: 'Vendedor: Buenas tardes. ¿Qué le pongo? Lotte: Buenas tardes. ¿Cuánto cuesta un kilo de manzanas?'
    note: Es un intercambio amable y educado entre una clienta y un vendedor.
  nl.a1.unit07.lesson06.teach.purchase:
    title: Elegir la cantidad
    gloss: 'Vendedor: Dos euros con cincuenta el kilo. Lotte: Entonces me llevo un kilo, por favor.'
    note: Como ya se sabe que hablan de manzanas por el turno anterior, Lotte puede decir simplemente *een kilo*.
  nl.a1.unit07.lesson06.teach.payment:
    title: Pagar con tarjeta
    gloss: 'Vendedor: Son dos euros con cincuenta. Lotte: ¿Puedo pagar con tarjeta? Vendedor: Sí, por supuesto.'
    note: '*Kan ik pinnen?* es la pregunta práctica normal a la hora de pagar.'
  nl.a1.unit07.lesson06.teach.closing:
    title: Cerrar la conversación
    gloss: 'Lotte: Gracias. ¡Adiós! Vendedor: ¡Adiós!'
    note: '*Tot ziens* es adecuado para cerrar este intercambio cortés de servicio.'
