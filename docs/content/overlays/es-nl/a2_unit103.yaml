        right: Se aburre
      - left: Ik voel de pijn
        right: Siento el dolor
      - left: Ik voel me ziek
        right: Me siento enfermo
      status: correct
    feedback: Fíjate en si se nombra una parte del cuerpo u otro objeto.
    pairs:
    - left: Ik was mijn handen
      right: Me lavo las manos
    - left: Ik was me
      right: Me lavo
    - left: Jij wast je handen
      right: Te lavas las manos
    - left: Jij wast je
      right: Te lavas
    - left: Ik vergis me
      right: Me equivoco
    - left: Hij verveelt zich
      right: Se aburre
