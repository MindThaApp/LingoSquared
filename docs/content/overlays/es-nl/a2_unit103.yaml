course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para hablar de sentimientos y cuidado personal.
  learning_goal: Usa los verbos reflexivos con el paradigma completo me, je, zich, ons, je, zich para decir cómo te sientes y qué haces para cuidarte.
units:
  nl.a2.unit103.zorg_voor_jezelf:
    title: Cuidarse
    description: Describe cómo te sientes y qué haces para cuidarte, usando verbos reflexivos.
lessons:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je:
    title: ¿Cómo te sientes?
  nl.a2.unit103.zorg_voor_jezelf.lesson02.het_hele_rijtje:
    title: El conjunto completo
  nl.a2.unit103.zorg_voor_jezelf.lesson03.wassen_of_zich_wassen:
    title: ¿Wassen o zich wassen?
  nl.a2.unit103.zorg_voor_jezelf.lesson04.bij_de_kapper_en_thuis:
    title: En el peluquero y en casa
  nl.a2.unit103.zorg_voor_jezelf.lesson05.noors_bericht:
    title: El mensaje de Noor
  nl.a2.unit103.zorg_voor_jezelf.lesson06.lotte_en_omar:
    title: Lotte y Omar
teaching:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gezondheid:
    title: La salud
    gloss: enfermo / sano / cansado / el dolor / la cabeza / la barriga / el médico
    note: Estas palabras describen cómo se siente tu cuerpo.
    example_gloss:
    - Noor está enferma.
    - Lotte está sana.
    - Omar está cansado.
    - Tengo dolor de cabeza.
    - Tengo dolor de barriga.
    - Noor va al médico.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gevoelens:
    title: Sentimientos
    gloss: contento / enfadado / asustado / triste / tranquilo / nervioso
    note: Estos adjetivos nombran sentimientos. Úsalos después de una forma de zijn o después de voelen + el pronombre reflexivo.
    example_gloss:
    - Omar está contento.
    - Noor está enfadada.
    - Lotte está nerviosa.
    - Tengo miedo.
    - Está triste.
    - Estamos tranquilos.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.verzorging:
    title: Cuidado personal
    gloss: el peluquero / el pelo / la barba / la mano
    note: Palabras para cuidar tu aspecto.
    example_gloss:
    - Omar va al peluquero.
    - Lotte tiene el pelo largo.
    - El hombre tiene barba.
    - Tengo una mano.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.gn_voelen:
    title: 'Zich voelen: el paradigma completo'
    gloss: yo me siento / tú te sientes / él se siente / ella se siente / nosotros nos sentimos / ustedes se sienten / ellos se sienten
    note: 'Zich voelen es un verbo reflexivo: el pronombre reflexivo siempre concuerda con el sujeto. Ik: me. Jij: je. Hij, zij: zich. Wij: ons. Jullie: je. Zij (ellos): zich.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.vraag:
    title: Preguntar cómo se siente alguien
    gloss: ¿Cómo te sientes? Me siento bien.
    note: 'Hacen falta los dos je: el primero es el sujeto y el segundo es el pronombre reflexivo.'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.teach.zinnen:
    title: Sentimientos en contexto
    gloss: Me siento cansado. Él se siente enfermo. Nos sentimos contentos. Lotte está enferma. Ella no se siente bien.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.werkwoorden:
    title: Tres verbos reflexivos
    gloss: lavarse / darse prisa / afeitarse
    note: En el diccionario estos verbos aparecen con zich. En una frase, zich cambia según el sujeto.
    example_gloss:
    - Me lavo cada mañana.
    - Noor se da prisa para llegar a su trabajo.
    - Omar se afeita hoy.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.tijd:
    title: Tiempo y rapidez
    gloss: cada mañana / hoy / esta noche / siempre / rápido / el trabajo
    note: Las palabras de tiempo suelen ir al principio de la frase.
    example_gloss:
    - Cada mañana me doy prisa.
    - Hoy me siento bien.
    - Esta noche estoy en casa.
    - Siempre te das prisa.
    - Nos lavamos rápido.
    - Lotte va al trabajo.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_rijtje:
    title: 'Los pronombres reflexivos: me, je, zich, ons'
    gloss: me doy prisa / te das prisa / él se da prisa / ella se da prisa / nos damos prisa / ustedes se dan prisa / ellos se dan prisa
    note: 'El pronombre va después del sujeto: ik: me; jij: je; hij, zij, het: zich; wij: ons; jullie: je; zij (ellos): zich. Fíjate también en las terminaciones del verbo: ik haast, jij haast, wij haasten.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.gn_zich:
    title: Zich también sirve para nombres y sustantivos en plural
    gloss: Lotte se lava. Los niños se lavan. Tú te afeitas. Nosotros nos lavamos.
    note: 'Un nombre propio o un sustantivo (Lotte, de kinderen) lleva zich, igual que hij, zij o het. Solo ik, jij, wij y jullie tienen formas propias: me, je, ons, je.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.teach.zinnen:
    title: Cuatro frases cortas
    gloss: Me lavo. Te lavas. Él se afeita. Nos damos prisa.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.lichaam:
    title: Cosas que se pueden lavar
    gloss: la cara / las manos / los dientes / el coche / el bebé / los niños
    note: Cuando nombras una parte del cuerpo, usa mijn, je o zijn (la parte del cuerpo propia no es un complemento reflexivo).
    example_gloss:
    - Me lavo las manos.
    - Te lavas la cara.
    - Él tiene unos dientes bonitos.
    - Lotte lava el coche.
    - Omar lava al bebé.
    - Los niños están en casa.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_lichaam:
    title: Parte del cuerpo o persona entera
    gloss: Me lavo las manos. Me lavo. Te lavas la cara. Te lavas.
    note: 'Si nombras la parte del cuerpo, usa un posesivo (mijn, je, zijn) y no un pronombre reflexivo. Si no la nombras, usa el pronombre reflexivo. Ojo: je puede ser «tu» (je gezicht) o «te» (wast je).'
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_ander:
    title: Otra persona o uno mismo
    gloss: Lotte lava el coche. Lotte se lava. Él se afeita la barba. Él se afeita.
    note: Zich solo se usa cuando el sujeto y el complemento son la misma persona. Si hay otro complemento (de auto, zijn baard), no se usa zich.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.altijd_zich:
    title: Siempre reflexivos
    gloss: equivocarse / aburrirse
    note: Con estos significados, los dos verbos siempre llevan zich (vervelen también puede significar molestar a alguien, pero no en esta unidad). El pronombre forma parte del verbo.
    example_gloss:
    - Perdón, me equivoco.
    - Hoy él se aburre.
    - Me aburro.
    - No te equivocas.
    - Nunca nos aburrimos.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_voelen_pijn:
    title: Voelen con me y sin me
    gloss: Me siento enfermo. Siento el dolor.
    note: Voelen es reflexivo cuando describe cómo estás (ik voel me ziek). No es reflexivo cuando sientes algo, como de pijn.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.teach.gn_zelf:
    title: El énfasis con -zelf
    gloss: Me lavo yo mismo. Te lavas tú mismo. Él se lava él mismo.
    note: Añade -zelf solo para enfatizar, por ejemplo cuando normalmente lo hace otra persona. En las frases normales bastan me, je y zich.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.ontspannen:
    title: Relajarse y la peluquería
    gloss: relajarse / cortar / el baño / caliente
    note: Zich ontspannen es reflexivo, como los demás verbos de esta unidad.
    example_gloss:
    - Me relajo en un baño caliente.
    - El peluquero me corta el pelo.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.volgorde_woorden:
    title: Orden y tiempo
    gloss: primero / luego / después / sábado / el fin de semana / por qué / nunca
    note: Usa eerst, dan y daarna para contar una rutina corta en orden.
    example_gloss:
    - Primero me afeito.
    - Luego voy al peluquero.
    - Después estoy en casa.
    - El sábado voy al peluquero.
    - El fin de semana me relajo.
    - ¿Por qué se da prisa?
    - Nunca me aburro.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_vraag:
    title: Preguntas con un verbo reflexivo
    gloss: ¿Te sientes bien? ¿Se da prisa? ¿Te aburres? ¿Por qué se da prisa?
    note: 'En una pregunta de sí o no, primero va el verbo, después el sujeto y luego el pronombre reflexivo: voel jij je. Con una palabra interrogativa (waarom), primero va esta y después el verbo. Con jij detrás del verbo desaparece la terminación -t (jij voelt, pero voel jij).'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_voorop:
    title: Una palabra de tiempo al principio
    gloss: Después me relajo. Primero me afeito. Hoy me siento cansado.
    note: 'Cuando una palabra de tiempo abre la frase, el verbo se queda en segunda posición y el sujeto va detrás. El pronombre reflexivo sigue yendo después del sujeto: ontspan ik me.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.gn_bijzin:
    title: El pronombre reflexivo después de dat
    gloss: Creo que él se da prisa. Creo que te equivocas.
    note: 'Después de dat, el sujeto va seguido del pronombre reflexivo y el verbo conjugado pasa al final: dat hij zich haast.'
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.bevel:
    title: Decir a alguien lo que debe hacer
    gloss: ¡Date prisa! ¡Relájate!
    note: En una orden con jij, el verbo no lleva -t y el pronombre reflexivo je va detrás.
  nl.a2.unit103.zorg_voor_jezelf.lesson04.teach.scenario:
    title: Una rutina de sábado
    gloss: El sábado voy al peluquero. El peluquero me corta el pelo. Después me relajo en casa.
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.reading:
    title: El mensaje de Noor
    gloss: 'Hola, Lotte y Omar: esta semana no me siento bien. Estoy cansada y me duele la cabeza. Cada mañana me doy prisa para llegar al trabajo. Esta noche me relajo en un baño caliente. ¿Ustedes también se sienten cansados? Saludos, Noor'
    note: Busca cada verbo reflexivo y el pronombre que lo acompaña.
    glosses:
      deze: este
      week: semana
      ook: también
      groetjes: saludos
  nl.a2.unit103.zorg_voor_jezelf.lesson05.teach.extra:
    title: Palabras del mensaje
    gloss: esta semana / también / saludos
    note: Groetjes es una forma amistosa de terminar un mensaje a amigos.
    example_gloss:
    - Esta semana estoy cansado.
    - ¿Tú también te sientes cansado?
    - Saludos, Lotte
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt1:
    title: Lotte pregunta cómo se siente Omar
    gloss: 'Lotte: Hola, Omar, ¿cómo te sientes hoy?'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt2:
    title: Omar dice que está cansado
    gloss: 'Omar: Me siento cansado. Cada mañana me doy prisa para llegar al trabajo.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt3:
    title: Lotte da un consejo
    gloss: 'Lotte: ¡Entonces relájate el fin de semana!'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt4:
    title: Omar hace un plan
    gloss: 'Omar: Sí, el sábado voy al peluquero. Después me relajo en casa.'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt5:
    title: Lotte pregunta por el aburrimiento
    gloss: 'Lotte: ¿Entonces no te aburres?'
  nl.a2.unit103.zorg_voor_jezelf.lesson06.teach.beurt6:
    title: Omar responde
    gloss: 'Omar: No, nunca me aburro.'
exercises:
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise01.kies_moe:
    instruction: Elige la frase correcta en neerlandés.
    correct_option: Ik voel me moe.
    distractors:
    - Ik voel moe.
    - Ik ben me moe.
    - Ik voel je moe.
    accepted_answers:
    - value: Ik voel me moe.
      status: correct
    feedback: 'Voelen necesita el pronombre reflexivo *me* cuando describe tu propio estado: *Ik voel me moe*.'
    prompt_blocks:
    - Me siento cansado.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise02.kies_blij:
    instruction: Elige la frase correcta en neerlandés.
    correct_option: Omar voelt zich blij.
    distractors:
    - Omar voelt me blij.
    - Omar voelt ons blij.
    - Omar voelt je blij.
    accepted_answers:
    - value: Omar voelt zich blij.
      status: correct
    feedback: Con hij, zij o un nombre propio, el pronombre reflexivo es *zich*.
    prompt_blocks:
    - Omar se siente contento.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise03.match_gevoelens:
    instruction: Relaciona cada palabra en neerlandés con su significado en español.
    accepted_answers:
    - value:
      - left: ziek
        right: enfermo
      - left: moe
        right: cansado
      - left: blij
        right: contento
      - left: boos
        right: enfadado
      - left: bang
        right: asustado
      - left: rustig
        right: con calma
      status: correct
    feedback: Estas son las palabras de salud y de estados de ánimo que usarás después de *voelen*.
    pairs:
    - left: ziek
      right: enfermo
    - left: moe
      right: cansado
    - left: blij
      right: contento
    - left: boos
      right: enfadado
    - left: bang
      right: asustado
    - left: rustig
      right: con calma
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise04.volgorde_hoe:
    instruction: Ordena las palabras para preguntar «¿Cómo te sientes?»
    correct_option: Hoe voel je je
    accepted_answers:
    - value: Hoe voel je je
      status: correct
    feedback: '*Hoe voel je je?* = ¿Cómo te sientes?'
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise05.vul_ons:
    instruction: Completa con el pronombre reflexivo de wij.
    correct_option: ons
    accepted_answers:
    - value: ons
      status: correct
    feedback: El pronombre reflexivo de *wij* es *ons*.
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise06.vertaal_hoe:
    instruction: Traduce al neerlandés.
    accepted_answers:
    - value: Hoe voel je je?
      status: correct
    - value: Hoe voel je je
      status: correct
    - value: Hoe voel jij je?
      status: correct
    - value: Hoe voel jij je
      status: correct
    feedback: '*Hoe voel je je?* o, con más énfasis, *Hoe voel jij je?*'
    prompt_blocks:
    - ¿Cómo te sientes?
  nl.a2.unit103.zorg_voor_jezelf.lesson01.exercise07.schrijf_ziek:
    instruction: Escribe la frase en neerlandés que se pide (usa zich voelen).
    correct_option: Hij voelt zich ziek.
    accepted_answers:
    - value: Hij voelt zich ziek.
      status: correct
    - value: Hij voelt zich ziek
      status: correct
    feedback: '*Hij voelt zich ziek.*'
    prompt_blocks:
    - 'Escribe en neerlandés: Se siente enfermo.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise01.kies_haasten:
    instruction: Elige la frase correcta en neerlandés.
    correct_option: Wij haasten ons.
    distractors:
    - Wij haasten me.
    - Wij haasten je.
    - Wij haasten zich.
    accepted_answers:
    - value: Wij haasten ons.
      status: correct
    feedback: El pronombre reflexivo de *wij* es *ons*, y el verbo lleva la terminación *-en*.
    prompt_blocks:
    - Nos damos prisa.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise02.kies_wast:
    instruction: Elige la frase correcta en neerlandés.
    correct_option: Noor wast zich.
    distractors:
    - Noor was zich.
    - Noor wassen zich.
    - Noor wast zij.
    accepted_answers:
    - value: Noor wast zich.
      status: correct
    feedback: 'Un nombre propio es tercera persona del singular: *wast* + *zich*.'
    prompt_blocks:
    - Noor se lava.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise03.match_rijtje:
    instruction: Relaciona cada frase en neerlandés con su significado en español.
    accepted_answers:
    - value:
      - left: Ik haast me
        right: Yo me doy prisa
      - left: Jij haast je
        right: Tú te das prisa (una persona)
      - left: Hij haast zich
        right: Él se da prisa
      - left: Wij haasten ons
        right: Nosotros nos damos prisa
      - left: Jullie haasten je
        right: Ustedes se dan prisa (varias personas)
      - left: Zij haasten zich
        right: Ellos se dan prisa
      status: correct
    feedback: Cada sujeto tiene su propio pronombre reflexivo, y jij y jullie usan ambos *je*.
    pairs:
    - left: Ik haast me
      right: Yo me doy prisa
    - left: Jij haast je
      right: Tú te das prisa (una persona)
    - left: Hij haast zich
      right: Él se da prisa
    - left: Wij haasten ons
      right: Nosotros nos damos prisa
    - left: Jullie haasten je
      right: Ustedes se dan prisa (varias personas)
    - left: Zij haasten zich
      right: Ellos se dan prisa
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise04.volgorde_ochtend:
    instruction: Ordena las palabras para decir «Nos damos prisa cada mañana».
    correct_option: Wij haasten ons elke ochtend
    accepted_answers:
    - value: Wij haasten ons elke ochtend
      status: correct
    - value: Elke ochtend haasten wij ons
      status: correct
    feedback: 'Los dos órdenes son correctos: la expresión de tiempo puede ir primero, y entonces el verbo va antes del sujeto.'
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise05.vul_je:
    instruction: Completa con el pronombre reflexivo de jij.
    correct_option: je
    accepted_answers:
    - value: je
      status: correct
    feedback: El pronombre reflexivo de *jij* es *je*.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise06.vertaal_wassen:
    instruction: 'Traduce al neerlandés (usa un verbo reflexivo: lavarse).'
    accepted_answers:
    - value: Ik was me elke ochtend.
      status: correct
    - value: Ik was me elke ochtend
      status: correct
    - value: Elke ochtend was ik me.
      status: correct
    - value: Elke ochtend was ik me
      status: correct
    feedback: En neerlandés aquí hace falta *me*, porque el verbo es reflexivo.
    prompt_blocks:
    - Me lavo cada mañana.
  nl.a2.unit103.zorg_voor_jezelf.lesson02.exercise07.schrijf_scheren:
    instruction: Escribe la frase en neerlandés que se pide (usa zich scheren).
    correct_option: Hij scheert zich elke ochtend.
    accepted_answers:
    - value: Hij scheert zich elke ochtend.
      status: correct
    - value: Hij scheert zich elke ochtend
      status: correct
    - value: Elke ochtend scheert hij zich.
      status: correct
    - value: Elke ochtend scheert hij zich
      status: correct
    feedback: '*Hij scheert zich elke ochtend.*'
    prompt_blocks:
    - 'Escribe en neerlandés: Se afeita cada mañana.'
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise01.kies_handen:
    instruction: Elige la frase correcta en neerlandés.
    correct_option: Ik was mijn handen.
    distractors:
    - Ik was me mijn handen.
    - Ik was zich handen.
    - Ik was handen mijn.
    accepted_answers:
    - value: Ik was mijn handen.
      status: correct
    feedback: Cuando nombras la parte del cuerpo, usas *mijn* («mi»), no un pronombre reflexivo.
    prompt_blocks:
    - Me lavo las manos.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise02.kies_auto:
    instruction: Elige la frase correcta en neerlandés.
    correct_option: Lotte wast de auto.
    distractors:
    - Lotte wast zich de auto.
    - Lotte wast zich auto.
    - Lotte wast me de auto.
    accepted_answers:
    - value: Lotte wast de auto.
      status: correct
    feedback: El complemento es el coche, no la propia Lotte, así que no se usa *zich*.
    prompt_blocks:
    - Lotte lava el coche.
  nl.a2.unit103.zorg_voor_jezelf.lesson03.exercise03.match_contrast:
    instruction: Relaciona cada frase en neerlandés con su significado en español.
    accepted_answers:
    - value:
      - left: Ik was mijn handen
        right: Me lavo las manos
      - left: Ik was me
        right: Me lavo
      - left: Jij wast je handen
