teaching:
  nl.a1.unit18.lesson01.teach.appartement_woonkamer_slaapkamer:
    title: Apartamento, salón, dormitorio
    gloss: el apartamento, el salón, el dormitorio
    note: '*Het appartement* es un sustantivo de género neutro; *de woonkamer* y *de slaapkamer* son sustantivos de género común.'
    example_gloss:
    - Tengo un apartamento.
    - Tengo un salón.
    - Tengo un dormitorio.
  nl.a1.unit18.lesson01.teach.keuken_badkamer:
    title: Cocina, baño
    gloss: la cocina, el baño
    note: '*De keuken* y *de badkamer* son ambos sustantivos de género común.'
    example_gloss:
    - Tengo una cocina.
    - Tengo un baño.
  nl.a1.unit18.lesson01.teach.appartement_utrecht:
    title: Decir que tienes un apartamento
    gloss: Tengo un apartamento.
    note: '*Hebben* (tener) es el verbo natural para decir qué vivienda tienes, igual que en español. Este es un ejemplo general; el apartamento concreto de Omar (en Utrecht) se presenta más adelante en esta unidad.'
  nl.a1.unit18.lesson01.teach.rooms_list:
    title: Enumerar todas las habitaciones
    gloss: Tengo un salón, un dormitorio, una cocina y un baño.
    note: Reúne en una sola frase las cuatro habitaciones del vocabulario de esta lección, separadas por comas y con *en* antes de la última.
  nl.a1.unit18.lesson02.teach.hoeveel_kamers:
    title: Preguntar cuántas habitaciones
    gloss: ¿Cuántas habitaciones tienes?
    note: '*Hoeveel* (cuántos/cuánto) retoma el patrón de las preguntas de cantidad de las lecciones de números anteriores.'
  nl.a1.unit18.lesson02.teach.twee_slaapkamers:
    title: Decir cuántos dormitorios
    gloss: Tengo dos dormitorios.
    note: '*Slaapkamers* es el plural de *slaapkamer* y se forma de manera regular con -s.'
  nl.a1.unit18.lesson02.teach.drie_kamers:
    title: Decir el total de habitaciones
    gloss: El apartamento tiene tres habitaciones.
    note: '*Kamers* es una palabra general para habitaciones, no se limita a los dormitorios.'
  nl.a1.unit18.lesson03.teach.balkon_tuin:
    title: Balcón, jardín
    gloss: el balcón, el jardín
    note: '*Het balkon* es neutro; *de tuin* es un sustantivo de género común.'
    example_gloss:
    - Hay un balcón.
    - No hay jardín.
  nl.a1.unit18.lesson03.teach.er_is_balkon:
    title: Decir que algo existe
    gloss: Hay un balcón.
    note: '*Er is* es la construcción existencial habitual en neerlandés, equivalente a «hay».'
  nl.a1.unit18.lesson03.teach.geen_tuin:
    title: Decir que algo no existe
    gloss: No hay jardín.
    note: '*Geen* niega un sustantivo indefinido: *geen tuin*, no *niet een tuin*.'
  nl.a1.unit18.lesson04.teach.gezellig:
    title: Acogedor
    gloss: acogedor
    note: Un adjetivo muy común y muy típico del neerlandés para un ambiente cálido y agradable; no tiene una traducción exacta de una sola palabra en español.
    example_gloss: El apartamento es pequeño pero acogedor.
  nl.a1.unit18.lesson04.teach.klein_maar_gezellig:
    title: Una forma habitual de describir
    gloss: El apartamento es pequeño pero acogedor.
    note: '*Klein maar gezellig* es una forma muy común y natural de describir en positivo una vivienda pequeña.'
  nl.a1.unit18.lesson04.teach.woonkamer_groot:
    title: Describir el tamaño de una habitación
    gloss: El salón es grande.
    note: '*Groot* describe una habitación concreta, no toda la vivienda.'
  nl.a1.unit18.lesson04.teach.keuken_klein:
    title: Describir el tamaño de otra habitación
    gloss: La cocina es pequeña.
    note: Es el mismo patrón que *groot* en la tarjeta anterior, aplicado a otra habitación con *klein*.
  nl.a1.unit18.lesson05.teach.advertentie:
    title: Lee un anuncio de vivienda
    gloss: 'Apartamento en Utrecht: un dormitorio, un salón, una cocina y un baño. Hay un balcón, pero no hay jardín. El apartamento es pequeño pero acogedor.'
    note: Fíjate en el número de habitaciones, en qué elementos hay o no hay y en la impresión general.
    glosses:
      Appartement: apartamento
      slaapkamer: dormitorio
      woonkamer: salón
      keuken: cocina
      badkamer: baño
      balkon: balcón
      tuin: jardín
      klein: pequeño
      gezellig: acogedor
  nl.a1.unit18.lesson06.teach.lotte_ask:
    title: Lotte pregunta por el apartamento
    gloss: 'Lotte: Hola, Omar, ¿cómo es tu nuevo apartamento en Utrecht?'
    note: '*Nieuwe* es la forma flexionada de *nieuw* (nuevo) que se usa delante de un sustantivo.'
  nl.a1.unit18.lesson06.teach.omar_describe:
    title: Omar lo describe
    gloss: 'Omar: Es pequeño pero acogedor. Tengo un dormitorio, un salón, una cocina y un baño.'
    note: 'Coincide exactamente con el anuncio de vivienda leído en la lección 5: este es el apartamento real de Omar.'
  nl.a1.unit18.lesson06.teach.lotte_ask_balcony:
    title: Lotte pregunta por el balcón
    gloss: 'Lotte: ¿Tienes balcón?'
    note: Una pregunta directa de sí o no que reutiliza *heb je ...?* de unidades anteriores.
  nl.a1.unit18.lesson06.teach.omar_balcony_answer:
    title: Omar responde
    gloss: 'Omar: Sí, tengo balcón, pero no jardín.'
    note: 'Coincide con los datos del anuncio: balcón y sin jardín.'
  nl.a1.unit18.lesson06.teach.hij_pronoun_note:
    title: Usar hij para hablar de Omar
    gloss: 'En lugar de Omar también puedes decir hij: él tiene un balcón.'
    note: '*Hij* (él) puede sustituir el nombre de Omar una vez que ya se ha presentado en la conversación.'
  nl.a1.unit18.lesson06.teach.lotte_reaction:
    title: Lotte reacciona con cariño
    gloss: 'Lotte: ¡Qué bien suena! Pronto iré a visitarte un día.'
    note: '*Komen langs* (pasar a visitar) es un verbo separable; *langs* va al final de la oración.'
  nl.a1.unit18.lesson06.teach.omar_welcome:
    title: Omar le da la bienvenida
    gloss: 'Omar: Genial, siempre eres bienvenida.'
    note: '*Altijd welkom* es una forma cálida y natural de invitar a alguien a volver.'
