course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para hablar de condiciones reales.
  learning_goal: Di lo que pasa o pasará si se cumple una condición, usando als + presente, el verbo al final en la oración con als y la inversión en la oración principal.
units:
  nl.a2.unit95.als_dan:
    title: Si ... entonces
    description: 'Habla de planes según el tiempo y de normas de tienda con condiciones reales: als + presente, con o sin dan.'
lessons:
  nl.a2.unit95.lesson01.als_het_regent:
    title: Si llueve
  nl.a2.unit95.lesson02.werkwoord_achteraan:
    title: El verbo al final
  nl.a2.unit95.lesson03.voorop_of_achteraan:
    title: Primero o último
  nl.a2.unit95.lesson04.regels_in_de_winkel:
    title: Normas en la tienda
  nl.a2.unit95.lesson05.noors_bericht:
    title: El mensaje de Noor
  nl.a2.unit95.lesson06.lotte_en_omar:
    title: Lotte y Omar hacen planes
teaching:
  nl.a2.unit95.lesson01.teach.weer:
    title: El tiempo
    gloss: el tiempo (meteorológico) / el sol / brillar / llover / bonito / frío / caliente (cálido)
    note: 'Las frases sobre el tiempo usan *het*: *Het regent*, *Het is koud*. El sol es el sujeto de *schijnen*: *De zon schijnt*.'
    example_gloss:
    - Hace buen tiempo.
    - Brilla el sol.
    - Llueve.
    - Hace frío.
    - Hace calor.
  nl.a2.unit95.lesson01.teach.plannen:
    title: Planes
    gloss: quedarse en casa / caminar (pasear) / ir al parque / ir a la playa
    note: 'Con *ik* se pierde la terminación del infinitivo: *blijven* pasa a *ik blijf*, *gaan* pasa a *ik ga*. Con *we* el verbo es igual que el infinitivo: *we blijven, we gaan*.'
    example_gloss:
    - Me quedo en casa.
    - Voy al parque.
    - Vamos a la playa.
    - Nos quedamos en casa.
    - Paseamos por el parque.
  nl.a2.unit95.lesson01.teach.vraag:
    title: Preguntar por los planes
    gloss: ¿Qué haces si llueve?
    note: '*Als* significa «si». En esta pregunta la oración con *als* va al final.'
  nl.a2.unit95.lesson01.teach.gn_als_basis:
    title: Als para condiciones reales
    gloss: Si llueve, me quedo en casa. Si hace sol, voy al parque.
    note: Usa *als* + presente para algo que realmente puede ocurrir. La oración con *als* indica la condición y la otra dice lo que pasa o lo que haces. Esta unidad solo trata las condiciones reales, no las imaginarias.
  nl.a2.unit95.lesson01.teach.zinnen:
    title: Dos planes
    gloss: Si hace frío, me quedo en casa. Si hace calor, vamos a la playa.
  nl.a2.unit95.lesson02.teach.tijd:
    title: Tiempo y llamadas
    gloss: tener tiempo / llamar / venir (con alguien)
    note: '*Hebben* y *komen* cambian según el sujeto: *ik heb, je hebt, hij heeft*; *ik kom, je komt, hij komt*. Siempre que *je* va después del verbo (en una pregunta, o en una oración principal tras una oración con *als*), desaparece la *-t*: *heb je, kom je*.'
    example_gloss:
    - Tengo tiempo.
    - ¿Tienes tiempo?
    - Omar tiene tiempo.
    - Llamo a Lotte.
    - Omar llama a Lotte.
    - ¿Vienes con nosotros?
    - Él viene con nosotros.
  nl.a2.unit95.lesson02.teach.drinken:
    title: Bebidas
    gloss: beber / el té / el agua / el café
    example_gloss:
    - Bebo té.
    - Bebemos café.
    - Bebo agua.
  nl.a2.unit95.lesson02.teach.gn_werkwoord_achteraan:
    title: El verbo va al final en la oración con als
    gloss: Si tengo tiempo, llamo a Lotte.
    note: En una oración con *als* el verbo conjugado va al final de la oración (en las frases sencillas de esta unidad, es la última palabra). Se dice *als ik tijd heb*, no *als ik heb tijd*. Lo mismo ocurre con *als het koud is* y *als de zon schijnt*.
  nl.a2.unit95.lesson02.teach.gn_personen:
    title: Otros sujetos
    gloss: Si tienes tiempo, vienes. Si Omar tiene tiempo, viene.
    note: 'Dentro de la oración con *als* el verbo va al final y concuerda con su sujeto: *je hebt*, *Omar heeft*. En la oración principal que sigue a la oración con *als*, el verbo va primero y el sujeto después: *kom je*, *komt hij*.'
  nl.a2.unit95.lesson02.teach.zinnen:
    title: Bebidas y tiempo
    gloss: Si hace calor, bebo agua. Si hace frío, bebo té.
  nl.a2.unit95.lesson03.teach.plaatsen:
    title: Días y lugares
    gloss: mañana / sábado / el museo / el mercado
    example_gloss:
    - Mañana voy al mercado.
    - El sábado vamos al museo.
    - El museo es bonito.
  nl.a2.unit95.lesson03.teach.gn_inversie:
    title: 'Primero la oración con als: verbo antes del sujeto'
    gloss: Si llueve, voy al museo.
    note: 'Cuando la oración con *als* va primero, ocupa la primera posición de la frase. La oración principal empieza entonces con el verbo y el sujeto va después: *ga ik*, no *ik ga*. Pon una coma después de la oración con *als*.'
  nl.a2.unit95.lesson03.teach.gn_dan:
    title: El dan opcional
    gloss: Si llueve, entonces voy al museo.
    note: 'Puedes añadir *dan* («entonces») después de la coma. Es opcional. El verbo sigue yendo justo después de *dan* y antes del sujeto: *dan ga ik*.'
  nl.a2.unit95.lesson03.teach.gn_achteraan:
    title: Primero la oración principal
    gloss: Voy al museo si llueve.
    note: También puedes empezar con la oración principal. Entonces el orden es normal (*ik ga*), no hay inversión y normalmente no se escribe coma. El significado es el mismo que en *Als het regent, ga ik naar het museum.*
  nl.a2.unit95.lesson03.teach.zinnen:
    title: Los dos órdenes
    gloss: Si hace sol, entonces vamos a la playa. Vamos al mercado si hace buen tiempo.
  nl.a2.unit95.lesson04.teach.winkel:
    title: En la tienda
    gloss: la tienda / el tique / el dinero / el descuento / gratis
    note: '*De bon* es el tique que te dan en una tienda. *Geen* significa «ningún» o «nada de» ante un sustantivo: *geen geld*.'
    example_gloss:
    - Estoy en la tienda.
    - Tengo el tique.
    - No tengo dinero.
    - El descuento está bien.
  nl.a2.unit95.lesson04.teach.werkwoorden:
    title: Verbos de tienda
    gloss: comprar / pagar / recibir (obtener) / de vuelta
    note: '*Je krijgt je geld terug* = te devuelven el dinero. Con *ik* el verbo no lleva terminación; con *je* acaba en *-t*, salvo cuando *je* va después del verbo: *krijg je*.'
    example_gloss:
    - Compro dos.
    - Pagas cincuenta euros.
    - Te hacen un descuento.
    - Te devuelven el dinero.
  nl.a2.unit95.lesson04.teach.bedragen:
    title: Números y entrega
    gloss: dos / cincuenta / euro / más de / la entrega / no
    example_gloss:
    - La entrega es gratis.
    - Pago más de cincuenta euros.
    - No tengo el tique.
  nl.a2.unit95.lesson04.teach.gn_regels:
    title: Las normas de las tiendas usan als + presente
    gloss: Si tienes el ticket, te devuelven el dinero.
    note: 'Las tiendas expresan sus normas como condiciones reales: *als* + presente, verbo al final en la oración con *als*, y en la oración principal que sigue el verbo va antes del sujeto. Muchas tiendas usan *u* en lugar de *je*, pero la estructura es la misma.'
  nl.a2.unit95.lesson04.teach.zinnen:
    title: Dos normas de tienda
    gloss: Si compras dos, te hacen un descuento. Si no tienes el tique, no te devuelven el dinero.
  nl.a2.unit95.lesson04.teach.gn_wanneer:
    title: ¿Als o wanneer?
    gloss: ¿Cuándo vamos a la tienda?
    note: En el neerlandés cotidiano, *als* es la palabra normal para «si» en una condición. *Wanneer* sirve sobre todo para preguntar «¿cuándo?». No uses *wanneer* en las condiciones de esta unidad.
  nl.a2.unit95.lesson05.teach.reading:
    title: Los planes de Noor
    gloss: ¡Hola, Lotte y Omar! El sábado vamos a la playa si hace sol. Si llueve, vamos al museo. Si hace frío, tomamos té. Si tenéis tiempo, ¿venís con nosotros? Saludos, Noor
    note: Fíjate en qué plan corresponde a cada condición. Observa el verbo al final de cada oración con *als*.
    glosses:
      Hoi: hola
      jullie: vosotros
      Groetjes: saludos
  nl.a2.unit95.lesson06.teach.lotte_vraag:
    title: Lotte pregunta por el sábado
    gloss: 'Lotte: Hola, Omar, ¿qué haces el sábado?'
  nl.a2.unit95.lesson06.teach.omar_strand:
    title: Omar expresa una condición
    gloss: 'Omar: Si hace buen tiempo, voy a la playa.'
  nl.a2.unit95.lesson06.teach.lotte_regen:
    title: Lotte pregunta por la lluvia
    gloss: 'Lotte: ¿Y si llueve?'
  nl.a2.unit95.lesson06.teach.omar_museum:
    title: Omar propone un plan y una invitación
    gloss: 'Omar: Entonces voy al museo. Si tienes tiempo, ¿vienes conmigo?'
  nl.a2.unit95.lesson06.teach.lotte_mee:
    title: Lotte acepta con una condición
    gloss: 'Lotte: Sí, el sábado libro. Si hace sol, voy contigo.'
  nl.a2.unit95.lesson06.teach.omar_tot:
    title: Omar cierra la conversación
    gloss: 'Omar: ¡Qué bien! ¡Hasta el sábado!'
exercises:
  nl.a2.unit95.lesson01.exercise01.choose_regent_thuis:
    instruction: Elige la frase en neerlandés que corresponde a la frase en español.
    correct_option: Als het regent, blijf ik thuis.
    distractors:
    - Als de zon schijnt, blijf ik thuis.
    - Als het regent, ga ik naar het park.
    - Si hace frío, voy a la playa.
    accepted_answers:
    - value: Als het regent, blijf ik thuis.
      status: correct
    feedback: '*Als het regent* = si llueve; *blijf ik thuis* = me quedo en casa.'
    prompt_blocks:
    - Si llueve, me quedo en casa.
  nl.a2.unit95.lesson01.exercise02.choose_zon_park:
    instruction: Elige la frase en neerlandés que corresponde a la frase en español.
    correct_option: Als de zon schijnt, gaan we naar het park.
    distractors:
    - Als het regent, gaan we naar het park.
    - Als de zon schijnt, blijven we thuis.
    - Si hace frío, vamos al parque.
    accepted_answers:
    - value: Als de zon schijnt, gaan we naar het park.
      status: correct
    feedback: '*Als de zon schijnt* = si hace sol; *gaan we* = vamos.'
    prompt_blocks:
    - Si hace sol, vamos al parque.
  nl.a2.unit95.lesson01.exercise03.match_condities:
    instruction: Relaciona cada expresión en neerlandés con su significado en español.
    accepted_answers:
    - value:
      - left: het regent
        right: llueve
      - left: de zon schijnt
        right: hace sol
      - left: hace frío
        right: hace frío
      - left: hace calor
        right: hace calor
      - left: hace buen tiempo
        right: hace buen tiempo
      - left: we blijven thuis
        right: nos quedamos en casa
      status: correct
    feedback: Estas expresiones son los bloques básicos de las frases de esta unidad.
    pairs:
    - left: het regent
      right: llueve
    - left: de zon schijnt
      right: hace sol
    - left: hace frío
      right: hace frío
    - left: hace calor
      right: hace calor
    - left: hace buen tiempo
      right: hace buen tiempo
    - left: we blijven thuis
      right: nos quedamos en casa
    localize_pair_lefts: 'yes'
  nl.a2.unit95.lesson01.exercise04.order_regent:
    instruction: Ordena las palabras para decir «Si llueve, me quedo en casa».
    correct_option: Als het regent blijf ik thuis
    accepted_answers:
    - value: Als het regent blijf ik thuis
      status: correct
    - value: Ik blijf thuis als het regent
      status: correct
    feedback: '*Als het regent, blijf ik thuis.* También puedes poner la oración con *als* al final: *Ik blijf thuis als het regent.*'
  nl.a2.unit95.lesson01.exercise05.complete_regent:
    instruction: 'Completa la frase: «Si llueve, me quedo en casa».'
    correct_option: regent
    accepted_answers:
    - value: regent
      status: correct
    feedback: '*Het regent* = llueve.'
  nl.a2.unit95.lesson01.exercise06.translate_zon_park:
    instruction: Traduce al neerlandés.
    accepted_answers:
    - value: Als de zon schijnt, ga ik naar het park.
      status: correct
    - value: Als de zon schijnt ga ik naar het park.
      status: correct
    - value: Ik ga naar het park als de zon schijnt.
      status: correct
    - value: Ik ga naar het park, als de zon schijnt.
      status: correct
    feedback: '*Als de zon schijnt, ga ik naar het park.*'
    prompt_blocks:
    - Si hace sol, voy al parque.
  nl.a2.unit95.lesson01.exercise07.write_koud:
    instruction: Escribe la frase en neerlandés que se pide.
    correct_option: Als het koud is, blijf ik thuis.
    accepted_answers:
    - value: Als het koud is, blijf ik thuis.
      status: correct
    - value: Als het koud is blijf ik thuis.
      status: correct
    - value: Ik blijf thuis als het koud is.
      status: correct
    - value: Ik blijf thuis, als het koud is.
      status: correct
    feedback: '¡Correcto! *Als het koud is, blijf ik thuis.* Significa: «Si hace frío, me quedo en casa».'
    prompt_blocks:
    - 'Escribe en neerlandés: Si hace frío, me quedo en casa.'
  nl.a2.unit95.lesson02.exercise01.choose_tijd_bel:
    instruction: Elige la frase con el verbo en el lugar correcto.
    correct_option: Als ik tijd heb, bel ik Lotte.
    distractors:
    - Als ik heb tijd, bel ik Lotte.
    - Als ik tijd heb, ik bel Lotte.
    - Als ik tijd heb, ik Lotte bel.
    accepted_answers:
    - value: Als ik tijd heb, bel ik Lotte.
      status: correct
    feedback: 'En la oración con *als* el verbo va al final: *als ik tijd heb*. Después la oración principal empieza con el verbo: *bel ik*.'
    prompt_blocks:
    - Si tengo tiempo, llamo a Lotte.
  nl.a2.unit95.lesson02.exercise02.choose_omar:
    instruction: Elige la frase con los verbos en el lugar correcto.
    correct_option: Als Omar tijd heeft, komt hij mee.
    distractors:
    - Als Omar heeft tijd, komt hij mee.
    - Als Omar tijd heeft, hij komt mee.
    - Als Omar tijd heeft, komt mee hij.
    accepted_answers:
    - value: Als Omar tijd heeft, komt hij mee.
      status: correct
    feedback: '*Heeft* va al final en la oración con *als*; *komt hij mee* empieza con el verbo.'
    prompt_blocks:
    - Si Omar tiene tiempo, viene con nosotros.
  nl.a2.unit95.lesson02.exercise03.match_clauses:
    instruction: Relaciona cada oración con als en neerlandés con su significado en español.
    accepted_answers:
    - value:
      - left: Als ik tijd heb
        right: Si tengo tiempo
      - left: Als je tijd hebt
        right: Si tienes tiempo
      - left: Als Omar tijd heeft
        right: Si Omar tiene tiempo
      - left: si hace calor
        right: Si hace calor
      - left: si hace frío
        right: Si hace frío
      - left: Als de zon schijnt
        right: Si hace sol
      status: correct
    feedback: 'Cada oración subordinada termina con su verbo: *heb, hebt, heeft, is, schijnt*.'
    pairs:
    - left: Als ik tijd heb
      right: Si tengo tiempo
    - left: Als je tijd hebt
      right: Si tienes tiempo
    - left: Als Omar tijd heeft
      right: Si Omar tiene tiempo
    - left: si hace calor
      right: Si hace calor
    - left: si hace frío
      right: Si hace frío
    - left: Als de zon schijnt
      right: Si hace sol
    localize_pair_lefts: 'yes'
  nl.a2.unit95.lesson02.exercise04.order_kom_mee:
    instruction: Ordena las palabras para decir «Si tienes tiempo, vienes con nosotros».
    correct_option: Als je tijd hebt kom je mee
    accepted_answers:
    - value: Als je tijd hebt kom je mee
      status: correct
    feedback: '*Als je tijd hebt, kom je mee.* *Hebt* va al final de la oración con *als*, y *kom* viene justo después.'
  nl.a2.unit95.lesson02.exercise05.complete_heb:
    instruction: 'Completa con el presente de hebben: «Si tengo tiempo, llamo a Lotte».'
    correct_option: heb
    accepted_answers:
    - value: heb
      status: correct
    feedback: '*Ik heb* es el presente de *hebben* para *ik*, y va al final de la oración con *als*.'
  nl.a2.unit95.lesson02.exercise06.translate_je_tijd:
    instruction: Traduce al neerlandés.
    accepted_answers:
    - value: Als je tijd hebt, bel ik Lotte.
      status: correct
    - value: Als je tijd hebt bel ik Lotte.
      status: correct
    - value: Ik bel Lotte als je tijd hebt.
      status: correct
    - value: Ik bel Lotte, als je tijd hebt.
      status: correct
    feedback: '*Als je tijd hebt, bel ik Lotte.*'
    prompt_blocks:
    - Si tienes tiempo, llamo a Lotte.
  nl.a2.unit95.lesson02.exercise07.write_warm_water:
    instruction: Escribe la frase en neerlandés que se pide.
    correct_option: Als het warm is, drink ik water.
    accepted_answers:
    - value: Als het warm is, drink ik water.
      status: correct
    - value: Als het warm is drink ik water.
      status: correct
    - value: Ik drink water als het warm is.
      status: correct
    - value: Ik drink water, als het warm is.
      status: correct
    feedback: 'Respuesta correcta: *Als het warm is, drink ik water.*'
    prompt_blocks:
    - 'Escribe en neerlandés: Si hace calor, bebo agua.'
  nl.a2.unit95.lesson03.exercise01.choose_inversie:
    instruction: Elige la oración con el orden de palabras correcto después de la oración con als.
    correct_option: Als het regent, ga ik naar het museum.
    distractors:
    - Als het regent, ik ga naar het museum.
    - Als het regent, ga naar het museum ik.
    - Als het regent ik naar het museum ga.
    accepted_answers:
    - value: Als het regent, ga ik naar het museum.
      status: correct
    feedback: 'Después de una oración con *als* al principio, el verbo va primero: *ga ik*.'
    prompt_blocks:
    - Si llueve, voy al museo.
  nl.a2.unit95.lesson03.exercise02.choose_achteraan:
    instruction: Elige la oración correcta con la oración principal al principio.
    correct_option: Ik ga naar de markt als de zon schijnt.
    distractors:
    - Ik ga naar de markt als schijnt de zon.
    - Ik ga naar de markt als de zon schijnen.
    - Ik naar de markt ga als de zon schijnt.
    accepted_answers:
    - value: Ik ga naar de markt als de zon schijnt.
      status: correct
    feedback: Con la oración principal primero, el orden sigue siendo normal, y la oración con *als* termina con su verbo.
    prompt_blocks:
    - Voy al mercado si hace sol.
  nl.a2.unit95.lesson03.exercise03.listen_zon_strand:
    instruction: Escucha y selecciona lo que oyes.
    correct_option: Als de zon schijnt, dan gaan we naar het strand.
    distractors:
    - Als het regent, dan gaan we naar het museum.
    - Als de zon schijnt, gaan we naar de markt.
    - Als de zon schijnt, dan blijven we thuis.
    accepted_answers:
    - value: Als de zon schijnt, dan gaan we naar het strand.
      status: correct
    feedback: Has oído *Als de zon schijnt, dan gaan we naar het strand.*
  nl.a2.unit95.lesson03.exercise04.match_volgorde:
    instruction: Une cada oración que empieza con als con la misma oración con la oración principal al principio.
    accepted_answers:
    - value:
      - left: Als het regent, ga ik naar het museum.
        right: Ik ga naar het museum als het regent.
      - left: Als de zon schijnt, ga ik naar het strand.
        right: Ik ga naar het strand als de zon schijnt.
      - left: Si hace frío, me quedo en casa.
        right: Me quedo en casa si hace frío.
      - left: Als ik tijd heb, ga ik naar de markt.
        right: Ik ga naar de markt als ik tijd heb.
      - left: Si hace calor, bebo agua.
        right: Bebo agua si hace calor.
      - left: Als je tijd hebt, bel ik Lotte.
        right: Ik bel Lotte als je tijd hebt.
      status: correct
    feedback: 'El significado es el mismo. Solo cambia el orden: *ga ik* (después de la oración con als) pasa a ser *ik ga* (oración principal primero).'
    pairs:
    - left: Als het regent, ga ik naar het museum.
      right: Ik ga naar het museum als het regent.
    - left: Als de zon schijnt, ga ik naar het strand.
      right: Ik ga naar het strand als de zon schijnt.
    - left: Si hace frío, me quedo en casa.
      right: Me quedo en casa si hace frío.
    - left: Als ik tijd heb, ga ik naar de markt.
      right: Ik ga naar de markt als ik tijd heb.
    - left: Si hace calor, bebo agua.
      right: Bebo agua si hace calor.
    - left: Als je tijd hebt, bel ik Lotte.
      right: Ik bel Lotte als je tijd hebt.
    localize_pair_lefts: 'yes'
  nl.a2.unit95.lesson03.exercise05.order_dan:
    instruction: Ordena las palabras para decir «Si brilla el sol, entonces vamos a la playa».
    correct_option: Als de zon schijnt dan gaan we naar het strand
    accepted_answers:
    - value: Als de zon schijnt dan gaan we naar het strand
      status: correct
    - value: Als de zon schijnt gaan we dan naar het strand
      status: correct
    feedback: '*Als de zon schijnt, dan gaan we naar het strand.* El verbo va justo después de *dan*.'
  nl.a2.unit95.lesson03.exercise06.complete_ga:
    instruction: 'Completa con el verbo gaan (voy): «Si llueve, voy al museo».'
    correct_option: ga
    accepted_answers:
    - value: ga
