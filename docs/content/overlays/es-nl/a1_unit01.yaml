teaching:
  nl.a1.unit01.lesson01.teach.hallo_hoi:
    title: Hola y Hola (informal)
    gloss: hola
    note: '*Hallo* es neutro y sirve tanto en situaciones informales como formales. *Hoi* es muy común e informal.'
    example_gloss:
    - Hola, ¿eres nuevo aquí?
    - Hola, soy Noor.
  nl.a1.unit01.lesson01.teach.jij_je_u:
    title: 'Tú / usted: formas informales y formales'
    gloss: tú (informal, tónico) / tú (informal, átono) / usted (formal)
    note: '*Jij* es el singular informal y se usa cuando la palabra va acentuada o en contraste. *Je* es la forma informal átona habitual en el habla cotidiana. *U* marca respeto o distancia. En los Países Bajos es natural con algunos desconocidos mayores y en relaciones explícitamente formales, pero jij/je también es habitual entre adultos en muchas tiendas y lugares de trabajo.'
    example_gloss:
    - ¿Eres nuevo aquí? (informal, tónico)
    - Eres nuevo aquí. (informal, átono)
    - ¿Es usted nuevo aquí? (formal)
  nl.a1.unit01.lesson01.teach.informal_new:
    title: Preguntar a un igual si es nuevo
    gloss: ¿Eres nuevo aquí?
    note: 'En una pregunta, *jij bent* pasa a *ben jij*: la -t desaparece cuando *jij* va detrás del verbo.'
  nl.a1.unit01.lesson01.teach.formal_new:
    title: Preguntar con formalidad si alguien es nuevo
    gloss: ¿Es usted nuevo aquí?
    note: Con *u* se usa *bent u*. La -t se mantiene.
  nl.a1.unit01.lesson01.teach.register_rule:
    title: Elegir la forma de tratamiento
    gloss: 'jij/je: informal · u: formal o cortés'
    note: Usa *jij/je* con amigos, iguales, niños y en muchos contextos modernos relajados. Usa *u* cuando la relación pida respeto o distancia; las preferencias varían, así que sigue la pauta de la otra persona.
  nl.a1.unit01.lesson02.teach.goedemorgen_tot_goedenavond:
    title: Saludos de la mañana, la tarde y la noche
    gloss: buenos días / buenas tardes / buenas noches
    note: '*Goedemorgen* se usa por la mañana, normalmente hasta el mediodía. *Goedemiddag* se usa desde el mediodía durante la tarde. *Goedenavond* es un saludo de la noche.'
    example_gloss:
    - ¡Buenos días! ¿Cómo estás?
    - Buenas tardes, ¿cómo está usted? (formal)
    - ¡Buenas noches! ¿Eres nuevo aquí?
  nl.a1.unit01.lesson02.teach.hoe_gaat_het:
    title: ¿Qué tal?
    gloss: ¿Cómo está usted?
    note: '*Hoe gaat het?* es una forma neutra y común de preguntar cómo está alguien.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_je:
    title: ¿Cómo estás? Informal
    gloss: ¿Cómo está usted?
    note: '*Met je* deja claro que te diriges a la persona de manera informal.'
  nl.a1.unit01.lesson02.teach.hoe_gaat_met_u:
    title: ¿Cómo está usted? Formal
    gloss: ¿Cómo está usted?
    note: Usa *met u* cuando la situación pida un trato formal.
  nl.a1.unit01.lesson02.teach.goed_dank_je:
    title: 'Bien, gracias: informal'
    gloss: Bien, gracias.
    note: '*Dank je* corresponde al trato informal.'
  nl.a1.unit01.lesson02.teach.goed_dank_u:
    title: 'Bien, gracias: formal'
    gloss: Bien, gracias.
    note: '*Dank u* corresponde al trato formal.'
  nl.a1.unit01.lesson02.teach.prima:
    title: Genial
    gloss: genial / muy bien
    note: '*Prima* es una respuesta breve y positiva.'
    example_gloss: Genial, gracias.
  nl.a1.unit01.lesson02.teach.niet_slecht:
    title: No está mal
    gloss: no está mal
    note: '*Niet slecht* suele ser una respuesta ligeramente positiva.'
  nl.a1.unit01.lesson02.teach.en_met_jou:
    title: ¿Y tú? Informal
    gloss: ¿Y usted?
    note: '*Jou* es la forma informal tónica después de *met*.'
  nl.a1.unit01.lesson02.teach.en_met_u:
    title: ¿Y usted? Formal
    gloss: ¿Y usted?
    note: '*U* mantiene formal la pregunta de vuelta.'
  nl.a1.unit01.lesson03.teach.hoe_heet_je:
    title: Preguntar el nombre de manera informal
    gloss: ¿Cómo se llama usted?
    note: '*Hoe heet je?* es la pregunta normal e informal para el nombre.'
  nl.a1.unit01.lesson03.teach.hoe_heet_u:
    title: Preguntar el nombre con formalidad
    gloss: ¿Cómo se llama usted?
    note: '*Hoe heet u?* es cortés; *Wat is uw naam?* es otra opción formal, de tono más administrativo, que no se trabaja aquí.'
  nl.a1.unit01.lesson03.teach.ik_heet_noor:
    title: Decir tu nombre
    gloss: Me llamo Noor.
    note: '*Ik heet ...* es una forma directa y estándar de decir tu nombre.'
  nl.a1.unit01.lesson03.teach.ik_ben_noor:
    title: Presentarse con naturalidad
    gloss: Soy Noor.
    note: '*Ik ben ...* es especialmente común en las presentaciones habladas.'
  nl.a1.unit01.lesson03.teach.mijn_naam:
    title: Mi nombre es
    gloss: Mi nombre es Noor.
    note: '*Mijn naam is ...* es correcto, pero algo más explícito que *Ik ben ...* o *Ik heet ...*.'
  nl.a1.unit01.lesson03.teach.leuk_ontmoeten:
    title: Encantado de conocerte
    gloss: Encantado.
    note: Es una frase amable y natural en un primer encuentro.
  nl.a1.unit01.lesson03.teach.aangenaam:
    title: Mucho gusto
    gloss: mucho gusto
    note: '*Aangenaam* es convencional y más formal que *Leuk je te ontmoeten*.'
    example_gloss: ¡Mucho gusto! Soy Noor.
  nl.a1.unit01.lesson04.teach.where_from_informal:
    title: Preguntar de dónde es alguien
    gloss: ¿De dónde eres?
    note: '*Kom je* es la forma informal de la pregunta.'
  nl.a1.unit01.lesson04.teach.where_from_formal:
    title: Preguntar con formalidad de dónde es alguien
    gloss: ¿De dónde eres?
    note: 'Con *u*, el verbo es *komt*: *Waar komt u vandaan?*'
  nl.a1.unit01.lesson04.teach.from_netherlands:
    title: De los Países Bajos
    gloss: Soy de los Países Bajos.
    note: Usa *uit* delante del país de origen.
  nl.a1.unit01.lesson04.teach.from_belgium:
    title: De Bélgica
    gloss: Soy de Bélgica.
    note: '*België* lleva diéresis sobre la segunda e.'
  nl.a1.unit01.lesson04.teach.from_germany:
    title: De Alemania
    gloss: Vengo de Alemania.
    note: '*Duitsland* es el país; *Duits* es el idioma.'
  nl.a1.unit01.lesson04.teach.dutch_nationality:
    title: Nacionalidad neerlandesa
    gloss: Soy neerlandés.
    note: '*Nederlands* sirve tanto para la nacionalidad como para el idioma neerlandés; en español se usan formas distintas según el caso (neerlandés / neerlandés), pero en neerlandés la palabra es la misma.'
  nl.a1.unit01.lesson04.teach.belgian_nationality:
    title: Nacionalidad belga
    gloss: Soy belga.
    note: '*Belgisch* describe aquí la nacionalidad belga.'
  nl.a1.unit01.lesson04.teach.speak_dutch:
    title: Hablar neerlandés
    gloss: Hablo neerlandés.
    note: En neerlandés, los nombres de idiomas se escriben con mayúscula inicial.
  nl.a1.unit01.lesson04.teach.speak_english:
    title: Hablar inglés
    gloss: Hablo inglés.
    note: '*Engels* es la palabra neerlandesa para inglés.'
  nl.a1.unit01.lesson04.teach.speak_german:
    title: Hablar alemán
    gloss: Hablo alemán.
    note: '*Duits* es la palabra neerlandesa para alemán.'
  nl.a1.unit01.lesson05.teach.taalcafe_bibliotheek:
    title: Café de idiomas y biblioteca
    gloss: el café de idiomas / la biblioteca
    note: Un *taalcafé* es un encuentro sin presión para practicar neerlandés con otras personas. Las bibliotecas públicas neerlandesas suelen acoger actividades locales, entre ellas cafés de idiomas.
    example_gloss:
    - Estoy aquí por el café de idiomas.
    - Aprendo neerlandés en la biblioteca.
  nl.a1.unit01.lesson05.teach.location:
    title: El lugar de encuentro
    gloss: El café de idiomas es en la biblioteca.
    note: Esto sitúa el escenario de la escena.
  nl.a1.unit01.lesson05.teach.here_for:
    title: Comprobar la actividad compartida
    gloss: ¿Estás aquí por el café de idiomas?
    note: Es una forma informal y natural de empezar cuando dos personas llegan a la misma actividad.
  nl.a1.unit01.lesson05.teach.yes_here_for:
    title: Confirmar la actividad
    gloss: Sí, estoy aquí por el café de idiomas.
    note: La respuesta repite la actividad con claridad.
  nl.a1.unit01.lesson05.teach.learning:
    title: Decir qué estás aprendiendo
    gloss: Estoy aprendiendo neerlandés.
    note: '*Leer* es la forma de primera persona de *leren*, aprender.'
  nl.a1.unit01.lesson05.teach.me_too:
    title: Yo también
    gloss: Yo también.
    note: '*Ik ook* es una forma breve y natural de expresar algo que se comparte.'
  nl.a1.unit01.lesson05.teach.first_time:
    title: Preguntar si es la primera vez de alguien
    gloss: ¿Es tu primera vez?
    note: Es una charla amable y habitual en una actividad que se repite.
  nl.a1.unit01.lesson05.teach.first_time_answer:
    title: Decir que es tu primera vez
    gloss: Sí, es mi primera vez.
    note: '*Mijn* significa «mi».'
  nl.a1.unit01.lesson06.teach.lotte_opening:
    title: Lotte inicia la conversación
    gloss: 'Lotte: Hola, soy Lotte. ¿Cómo te llamas?'
    note: Lotte usa el *je* informal en este grupo distendido.
  nl.a1.unit01.lesson06.teach.omar_name:
    title: Omar dice su nombre
    gloss: 'Omar: Me llamo Omar. Encantado de conocerte.'
    note: Responde a la pregunta sobre su nombre y expresa que se alegra de conocerla.
  nl.a1.unit01.lesson06.teach.lotte_origin_question:
    title: Lotte pregunta por el origen
    gloss: 'Lotte: ¡Igualmente! ¿De dónde eres?'
    note: '*Jou ook!* es una respuesta corta y natural a *Leuk je te ontmoeten*.'
  nl.a1.unit01.lesson06.teach.omar_origin:
    title: Omar dice de dónde es
    gloss: 'Omar: Soy de Egipto. ¿Y tú?'
    note: '*En jij?* devuelve la misma pregunta de manera informal.'
  nl.a1.unit01.lesson06.teach.lotte_context:
    title: Lotte sigue con la charla
    gloss: 'Lotte: Soy de los Países Bajos. ¿Es tu primera vez en el café de idiomas?'
    note: '*Bij het taalcafé* significa «en el café de idiomas» como actividad.'
  nl.a1.unit01.lesson06.teach.omar_language:
    title: Omar responde y dice qué está aprendiendo
    gloss: 'Omar: Sí, es mi primera vez. Estoy aprendiendo neerlandés.'
    note: Responde a la pregunta de Lotte antes de añadir un dato básico sobre sí mismo.
  nl.a1.unit01.lesson06.teach.tot_ziens:
    title: Despedida
    gloss: ¡Adiós!
    note: '*Tot ziens* es una despedida neutra.'
  nl.a1.unit01.lesson06.teach.closing:
    title: Un cierre natural
    gloss: 'Lotte: ¡Genial! Hasta la próxima semana. Omar: ¡Hasta la próxima semana!'
    note: Repetir *Tot volgende week* es natural cuando ambos esperan volver.
