course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para leer, escuchar y volver a contar una historia corta.
  learning_goal: Lee o escucha una historia corta en imperfectum y cuéntala de nuevo en orden con palabras de secuencia y el voltooid tegenwoordige tijd.
units:
  nl.a2.unit108.een_kort_verhaal:
    title: Una historia corta
    description: Lee o escucha una historia corta sobre una salida y cuéntala de nuevo en orden.
lessons:
  nl.a2.unit108.lesson01.eerst_daarna_toen:
    title: Primero, luego, después
  nl.a2.unit108.lesson02.verhaal_in_het_imperfectum:
    title: Contar la historia
  nl.a2.unit108.lesson03.opschrijven_of_vertellen:
    title: Escribir o contar
  nl.a2.unit108.lesson04.een_boottocht:
    title: Un paseo en barco
  nl.a2.unit108.lesson05.een_dag_in_het_pretpark:
    title: Un día en el parque de atracciones
  nl.a2.unit108.lesson06.vertel_eens:
    title: ¡Cuéntame!
teaching:
  nl.a2.unit108.lesson01.teach.uitjes:
    title: Salidas y excursiones
    gloss: el zoo / el paseo en barco / el parque de atracciones / la montaña rusa
    note: Estas son las salidas de esta unidad.
    example_gloss:
    - Vamos al zoo.
    - El paseo en barco es divertido.
    - A Lotte le gusta la montaña rusa.
  nl.a2.unit108.lesson01.teach.dieren:
    title: Animales del zoo
    gloss: el mono / el elefante / el león / el pingüino
    note: 'Plurales: *apen, olifanten, leeuwen, pinguïns*.'
    example_gloss:
    - Los monos son graciosos.
    - Los elefantes son grandes.
    - Los leones están durmiendo.
  nl.a2.unit108.lesson01.teach.dingen:
    title: Cosas de una salida
    gloss: la foto / el helado / el barco / el canal
    note: Pequeñas cosas que reaparecen en las historias.
    example_gloss:
    - Noor hace una foto.
    - Omar se come un helado.
    - El barco navega por el canal.
  nl.a2.unit108.lesson01.teach.volgorde_woorden:
    title: Palabras para ordenar los acontecimientos
    gloss: primero / después / entonces / a continuación / más tarde / al final
    note: Sirven para ordenar los acontecimientos de una historia. En una historia, *toen* significa «entonces». No es lo mismo que *toen* con el sentido de «cuando».
    example_gloss:
    - Primero compramos las entradas.
    - Después nos comemos un helado.
    - Al final nos vamos a casa.
  nl.a2.unit108.lesson01.teach.gn_volgorde:
    title: Primero la palabra de secuencia, luego el verbo
    gloss: Primero fuimos al zoo. Después vimos a los monos.
    note: 'Cuando una palabra de secuencia abre la frase, el verbo va a continuación y el sujeto después: *Eerst gingen we*, *Daarna zagen we*. También puedes poner la palabra de secuencia más adelante: *We gingen eerst naar de dierentuin*.'
  nl.a2.unit108.lesson01.teach.verhaal:
    title: Una historia corta en orden
    gloss: Primero Lotte, Omar y Noor fueron al zoo. Después vieron a los monos. Entonces se comieron un helado. Al final tomaron el autobús a casa.
  nl.a2.unit108.lesson02.teach.dingen2:
    title: En la entrada
    gloss: la entrada (el billete) / el café / la cola
    note: 'Plural: *kaartjes*.'
    example_gloss:
    - Tengo un billete.
    - Omar bebe café.
    - La cola es larga.
  nl.a2.unit108.lesson02.teach.werkwoorden:
    title: Verbos para una salida
    gloss: ir / ver / comer / tomar / caminar / beber / comprar / hacer / esperar / reír
    note: Las dos tarjetas siguientes dan las formas del imperfectum.
    example_gloss:
    - Vamos al zoo.
    - Veo a los leones.
    - Noor espera el barco.
  nl.a2.unit108.lesson02.teach.gn_onregelmatig:
    title: 'Narración: imperfectum irregular'
    gloss: ir → fue/fueron; ver → vio/vieron; comer → comió/comieron; tomar → tomó/tomaron; caminar → caminó/caminaron; beber → bebió/bebieron; ser/estar → fue/fueron
    note: Las historias se escriben en imperfectum. La forma del singular va con *ik*, *jij/je*, *hij*, *zij* (ella) y un nombre en singular como *Noor*; la del plural, con *we*, *jullie* y *ze* (ellos). Aprende estas formas como un conjunto.
  nl.a2.unit108.lesson02.teach.gn_regelmatig:
    title: 'Narración: imperfectum regular'
    gloss: hacer → hizo; esperar → esperó; reír → rio; comprar → compró
    note: 'Muchos verbos regulares añaden *-te* (singular) o *-ten* (plural) a la raíz; aquí las raíces terminan en un sonido que lleva *-te(n)*. Otros verbos regulares llevan *-de(n)*, que veremos más adelante. *Kopen* es un caso especial: *kocht, kochten*.'
  nl.a2.unit108.lesson02.teach.zinnen:
    title: Pequeños sucesos en imperfectum
    gloss: Lotte compró las entradas. Omar bebió café. Noor se rio. Esperaron mucho tiempo en la cola.
  nl.a2.unit108.lesson03.teach.woorden:
    title: Hablar de ayer
    gloss: ayer / juntos / agradable, divertido / mucho, muchos / los animales
    note: Útil para contarle a un amigo lo que hiciste.
    example_gloss:
    - Ayer estuvimos en el zoo.
    - Estuvimos juntos en el zoo.
    - Fue divertido.
    - Vi muchos animales.
    - Los animales eran grandes.
  nl.a2.unit108.lesson03.teach.gn_perfectum:
    title: 'Contárselo a un amigo: voltooid tegenwoordige tijd'
    gloss: Primero fuimos al zoo. Después vimos a los monos.
    note: 'En una conversación, lo que hiciste se cuenta normalmente con *hebben* o *zijn* más un participio. El verbo auxiliar va en segunda posición y el participio al final: *Eerst zijn we … gegaan*, *Daarna hebben we … gezien*.'
  nl.a2.unit108.lesson03.teach.gn_deelwoorden:
    title: Participios con hebben
    gloss: visto / comido / tomado / bebido / comprado / hecho / esperado / reído
    note: 'La mayoría de los participios empiezan por *ge-*. Los verbos regulares terminan en *-t* (*gemaakt, gewacht*); los irregulares terminan en *-en* (*gezien, gegeten, genomen, gedronken*). *Gekocht* termina en *-t* aunque *kopen* sea irregular en el imperfectum, y *lachen* es una excepción: *gelachen*.'
  nl.a2.unit108.lesson03.teach.gn_hulpwerkwoord:
    title: ¿Hebben o zijn?
    gloss: Vi a los monos. Noor bebió café. Nos reímos. Fui al parque de atracciones. Omar estuvo en el zoo. Vinimos.
    note: 'La mayoría de los verbos usan *hebben*. Los verbos de ir y venir (movimiento hacia un lugar) y el propio *zijn* usan *zijn*: *gegaan, gekomen, geweest*. Formas: *ik heb / ben, Noor heeft / is, wij hebben / zijn*.'
  nl.a2.unit108.lesson03.teach.gn_contrast:
    title: ¿Historia o conversación?
    gloss: Primero fueron al zoo. Primero fuimos al zoo.
    note: Una historia escrita usa el imperfectum (*gingen*). Cuando le cuentas a un amigo lo que hiciste, normalmente usas el voltooid tegenwoordige tijd (*zijn … gegaan*). El orden de los acontecimientos se marca con las mismas palabras en ambos casos.
  nl.a2.unit108.lesson03.teach.zinnen:
    title: Contar lo de ayer
    gloss: Ayer fuimos juntos al zoo. Vimos muchos animales. Fue divertido.
  nl.a2.unit108.lesson04.teach.plaatsen:
    title: En el paseo en barco
    gloss: la ciudad / el puente
    note: Se ven los dos desde el barco.
    example_gloss:
    - La ciudad es preciosa.
    - El puente es antiguo.
    - Vemos el puente.
  nl.a2.unit108.lesson04.teach.gn_stappen:
    title: Un participio más con zijn
    gloss: Noor subió al barco. Omar hizo una foto del puente.
    note: '*Stappen* (dar un paso, subir) es regular: *gestapt*. Como describe un movimiento hacia el interior de un lugar, usa *zijn*. *Een foto maken* usa *hebben*: *gemaakt*.'
  nl.a2.unit108.lesson04.teach.verhaal:
    title: El paseo en barco en orden
    gloss: Ayer Omar y Noor hicieron un paseo en barco. Primero compraron las entradas. Después subieron al barco. Entonces hicieron una foto del puente. A continuación vieron la ciudad. Más tarde bebieron café. Al final se fueron a casa.
  nl.a2.unit108.lesson05.teach.lees:
    title: Un día en el parque de atracciones
    gloss: El sábado Lotte, Omar y Noor fueron al parque de atracciones. Primero compraron las entradas. Después se subieron a la montaña rusa. Noor tenía miedo, pero Omar se reía. Entonces se comieron un helado. Más tarde esperaron mucho tiempo en la cola. Después de haber esperado, se subieron otra vez a la montaña rusa. Al final tomaron el autobús a casa.
    note: Una historia se escribe en imperfectum. Fíjate en las palabras de secuencia para seguir el orden. Una frase usa *hadden gewacht* (solo para leer).
    glosses:
      Zaterdag: sábado
      bang: asustado, con miedo
      maar: pero
      Nadat: después de
      hadden: habían
      gewacht: esperado (participio)
      nog: otra vez, una vez más
      keer: tiempo
  nl.a2.unit108.lesson05.teach.gn_voltooid_verleden:
    title: 'Reconocer: algo que ya había ocurrido (solo para leer)'
    gloss: Después de haber esperado, se subieron otra vez a la montaña rusa.
    note: '*Hadden gewacht* (had + participio) es el voltooid verleden tijd. Indica que algo ya había terminado antes de otro momento del pasado. Después de *nadat* los verbos van al final de la oración subordinada, y la principal que sigue empieza por su verbo: *gingen ze*. Solo necesitas reconocerlo al leer o escuchar; cuando cuentes tú una historia, usa el imperfectum o el voltooid tegenwoordige tijd.'
  nl.a2.unit108.lesson06.teach.beurt1:
    title: Lotte pregunta
    gloss: 'Lotte: Hola, Omar, ¿qué hiciste ayer?'
  nl.a2.unit108.lesson06.teach.beurt2:
    title: Omar responde
    gloss: 'Omar: Noor y yo hicimos un paseo en barco.'
  nl.a2.unit108.lesson06.teach.beurt3:
    title: Lotte pregunta qué fue lo primero
    gloss: 'Lotte: ¡Qué bien! ¿Y qué hicisteis primero?'
  nl.a2.unit108.lesson06.teach.beurt4:
    title: Omar cuenta los primeros momentos
    gloss: 'Omar: Primero compramos las entradas. Después subimos al barco.'
  nl.a2.unit108.lesson06.teach.beurt5:
    title: Lotte pregunta qué pasó después
    gloss: 'Lotte: ¿Y entonces?'
  nl.a2.unit108.lesson06.teach.beurt6:
    title: Omar termina la historia
    gloss: 'Omar: Entonces vimos la ciudad. Al final tomamos café.'
