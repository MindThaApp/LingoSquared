teaching:
  nl.a1.unit20.lesson01.teach.jas_trui:
    title: Abrigo, jersey
    gloss: el abrigo, el jersey
    note: '*De jas* y *de trui* son ambos sustantivos de género común.'
    example_gloss:
    - Busco un abrigo.
    - Tengo un jersey.
  nl.a1.unit20.lesson01.teach.broek_schoenen:
    title: Pantalón, zapatos
    gloss: el pantalón, los zapatos
    note: '*Broek* es singular en neerlandés aunque en español «pantalones» suele usarse en plural: *een broek*, no *broeken*, para un solo pantalón. *Schoenen* es el plural de *schoen*; los zapatos casi siempre se mencionan en plural.'
    example_gloss:
    - Busco un pantalón.
    - Busco zapatos.
  nl.a1.unit20.lesson01.teach.zoek_jas:
    title: Decir lo que buscas
    gloss: Busco un abrigo.
    note: '*Zoeken* (buscar) lleva aquí un complemento directo sin preposición. (También existe *zoeken naar*, pero el complemento directo es el patrón más sencillo.)'
  nl.a1.unit20.lesson02.teach.maat:
    title: Talla
    gloss: la talla
    note: 'Un sustantivo de género común: *de maat*.'
    example_gloss: ¿Qué talla usas?
  nl.a1.unit20.lesson02.teach.welke_maat:
    title: Preguntar por la talla
    gloss: ¿Qué talla usas?
    note: Se usa *welke* (cuál) porque *maat* tiene un conjunto reducido de respuestas esperadas (S, M, L o un número).
  nl.a1.unit20.lesson02.teach.heb_maat_m:
    title: Decir tu talla
    gloss: Soy talla M.
    note: 'Aquí se usa *hebben* (tener), igual que en español: «Tengo la talla M».'
  nl.a1.unit20.lesson03.teach.zwart_blauw:
    title: Negro, azul
    gloss: negro, azul
    note: Los dos adjetivos de color básicos de esta lección.
    example_gloss:
    - Quiero el abrigo en negro.
    - ¿Tiene también este en azul?
  nl.a1.unit20.lesson03.teach.wil_in_zwart:
    title: Pedir un color
    gloss: Quiero el abrigo en negro.
    note: '*In het* + color es la forma habitual de indicar el color de una prenda al pedirla o encargarla.'
  nl.a1.unit20.lesson03.teach.ook_in_blauw:
    title: Preguntar por otro color
    gloss: ¿Tiene también este en azul?
    note: '*Ook* (también) sirve para preguntar si hay otro color disponible, con el registro formal *u*.'
  nl.a1.unit20.lesson04.teach.past_deze_jas:
    title: Preguntar cómo queda
    gloss: ¿Te queda bien este abrigo?
    note: '*Passen* (quedar bien, sentar) es el verbo natural para el ajuste de la ropa, distinto de *passen* con el sentido de «probarse».'
  nl.a1.unit20.lesson04.teach.past_goed:
    title: Confirmar que queda bien
    gloss: Me queda bien.
    note: '*Goed* (bien) describe cómo queda la prenda.'
  nl.a1.unit20.lesson04.teach.te_klein:
    title: Demasiado pequeño
    gloss: Es demasiado pequeño.
    note: '*Te* (demasiado) va delante del adjetivo para expresar exceso.'
  nl.a1.unit20.lesson04.teach.te_groot:
    title: Demasiado grande
    gloss: Es demasiado grande.
    note: Es el mismo patrón *te* + adjetivo que en la tarjeta anterior, *te klein*.
  nl.a1.unit20.lesson05.teach.negentig:
    title: Noventa
    gloss: noventa
    note: '*Negentig* es el número 90, usado aquí en el precio del abrigo.'
    example_gloss: El abrigo cuesta noventa euros.
  nl.a1.unit20.lesson05.teach.kost_negentig:
    title: Decir un precio
    gloss: El abrigo cuesta noventa euros.
    note: '*Kost* es la tercera persona del singular de *kosten* (costar).'
  nl.a1.unit20.lesson05.teach.bonnetje:
    title: Lee un ticket de tienda
    gloss: 'Abrigo de invierno: talla M, color negro. Precio: noventa euros. Este abrigo me queda bien y es abrigado.'
    note: Fíjate en la talla, el color, el precio y las dos cualidades que se mencionan del abrigo.
    glosses:
      Winterjas: abrigo de invierno
      maat: talla
      kleur: color
      zwart: negro
      Prijs: precio
      negentig: noventa
      euro: euros
      jas: abrigo
      past: queda bien
      warm: caluroso
  nl.a1.unit20.lesson06.teach.lotte_notice:
    title: Lotte se fija en el abrigo
    gloss: 'Lotte: ¡Este abrigo es bonito! ¿Qué talla tienes?'
    note: '*Mooi* (bonito) es una reacción positiva general, ya vista en unidades anteriores.'
  nl.a1.unit20.lesson06.teach.omar_ask_try:
    title: Omar pide probárselo
    gloss: 'Omar: Tengo la talla M. ¿Puedo probármelo?'
    note: '*Mag ik ...?* (¿Puedo ...?) es la forma educada habitual de pedir permiso; aquí *passen* significa «probarse», no «quedar bien».'
  nl.a1.unit20.lesson06.teach.lotte_ask_fit:
    title: Lotte pregunta cómo le queda
    gloss: 'Lotte: Claro. ¿Te queda bien?'
    note: '*Hij* (él, lo) se refiere a *de jas*, un sustantivo de género común.'
  nl.a1.unit20.lesson06.teach.omar_confirm_fit:
    title: Omar lo confirma
    gloss: 'Omar: Sí, me queda bien y abriga.'
    note: 'Coincide exactamente con el ticket leído antes: es el mismo abrigo.'
  nl.a1.unit20.lesson06.teach.lotte_ask_color:
    title: Lotte pregunta por el color
    gloss: 'Lotte: ¡Genial! ¿Lo quieres en negro o en azul?'
    note: '*Wil je... of...?* reutiliza el patrón para ofrecer una elección de las lecciones de preferencias de la unidad 13.'
  nl.a1.unit20.lesson06.teach.omar_choose_black:
    title: Omar se decide
    gloss: 'Omar: Me lo llevo en negro.'
    note: '*Nemen* (llevarse) es el verbo natural para cerrar la elección de una compra.'
  nl.a1.unit20.lesson06.teach.neemt_form:
    title: Neem frente a neemt
    gloss: Neem es la forma de ik de nemen (tomar, llevarse); neemt es la forma de hij o zij.
    note: 'Patrón regular del presente: *ik neem, jij/hij/zij neemt*.'
