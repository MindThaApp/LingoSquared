course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para señalar y precisar cosas.
  learning_goal: Señalar y precisar objetos con dit, dat, deze y die, y usar diminutivos, al comprar o elegir.
units:
  nl.a2.unit101.deze_die_dit_dat:
    title: Este, ese
    description: Señala y elige productos en el mercado, la panadería, la floristería y la librería con dit, dat, deze, die y diminutivos.
lessons:
  nl.a2.unit101.lesson01.dit_en_deze:
    title: 'Este (cerca): dit y deze'
  nl.a2.unit101.lesson02.die_en_dat:
    title: 'Ese (lejos) y el plural: die y dat'
  nl.a2.unit101.lesson03.verkleinwoorden:
    title: 'Cosas pequeñas: diminutivos con -je'
  nl.a2.unit101.lesson04.winkelen:
    title: 'De compras: preguntar precios y elegir'
  nl.a2.unit101.lesson05.bericht_van_noor:
    title: 'Lectura: un mensaje de Noor'
  nl.a2.unit101.lesson06.lotte_en_omar:
    title: 'Diálogo: Lotte y Omar en el mercado'
teaching:
  nl.a2.unit101.lesson01.teach.markt:
    title: En el mercado
    gloss: el mercado / el puesto / la manzana / el tomate / el queso
    note: 'Aprende cada sustantivo con su artículo: de o het. Todos los sustantivos de esta ficha son palabras de.'
    example_gloss:
    - Estoy en el mercado.
    - Veo un puesto.
    - Me llevo una manzana.
  nl.a2.unit101.lesson01.teach.bakker:
    title: En la panadería
    gloss: el panadero / el pan / el pastel / la galleta
    note: '*Brood* es una palabra het; las demás son palabras de.'
    example_gloss:
    - Estoy en la panadería.
    - El pan está fresco.
    - El pastel está rico.
  nl.a2.unit101.lesson01.teach.bloemist:
    title: En la floristería
    gloss: el florista / la rosa / el ramo
    note: '*Boeket* es una palabra het; *roos* es una palabra de.'
    example_gloss:
    - En la floristería veo una rosa.
    - El ramo es bonito.
    - Me llevo un ramo.
  nl.a2.unit101.lesson01.teach.boekwinkel:
    title: En la librería
    gloss: la librería / el libro / la novela / el periódico
    note: '*Boek* es una palabra het; las demás son palabras de.'
    example_gloss:
    - En la librería busco un libro.
    - Busco una novela.
    - El periódico es caro.
  nl.a2.unit101.lesson01.teach.bijvoeglijk:
    title: Describir cosas
    gloss: fresco / rico / bonito / barato / caro / grande / pequeño
    note: Estas palabras van después de *is* y no cambian.
    example_gloss:
    - El tomate es pequeño.
    - El libro es barato.
    - El puesto es grande.
  nl.a2.unit101.lesson01.teach.gn_dit_deze:
    title: 'Este: dit o deze'
    gloss: het brood → este pan; de taart → este pastel; de roos → esta rosa; het boek → este libro.
    note: 'Para señalar algo que tienes cerca, usa *dit* con una palabra het y *deze* con una palabra de. Por eso debes conocer el artículo: *dit brood* (het brood), *deze taart* (de taart).'
  nl.a2.unit101.lesson01.teach.zinnen:
    title: Dos frases
    gloss: Este pan es fresco. Este pastel está rico.
  nl.a2.unit101.lesson02.teach.meervoud:
    title: Plurales
    gloss: las manzanas / los tomates / las rosas / los libros / los periódicos
    note: 'Los sustantivos plurales terminan en -s o en -en. *Het boek* pasa a ser *de boeken*: en plural todos los sustantivos llevan *de*.'
    example_gloss:
    - Las manzanas son baratas.
    - Los tomates están ricos.
    - Las rosas son preciosas.
  nl.a2.unit101.lesson02.teach.gn_die_dat:
    title: 'Ese: dat o die'
    gloss: het brood → ese pan; de taart → ese pastel; het boek → ese libro; de roos → esa rosa.
    note: 'Para señalar algo que está más lejos, usa *dat* con una palabra het y *die* con una palabra de. Es el mismo patrón que *dit* y *deze*: *dit/dat* para palabras het, *deze/die* para palabras de.'
  nl.a2.unit101.lesson02.teach.gn_meervoud:
    title: 'Plural: siempre deze o die'
    gloss: estas manzanas, estos libros; esas rosas, esos libros.
    note: 'Con un sustantivo plural usas siempre *deze* (cerca) o *die* (lejos), incluso cuando el singular es una palabra het: *dit boek*, pero *deze boeken*. Delante de un sustantivo, *dit* y *dat* solo se usan con palabras het en singular (solos, como en *Wat is dat?*, pueden señalar cualquier cosa).'
  nl.a2.unit101.lesson02.teach.zinnen:
    title: Tres frases
    gloss: Ese pastel es grande. Ese pan es pequeño. Esas manzanas son baratas.
  nl.a2.unit101.lesson03.teach.verkleinwoorden:
    title: Cosas pequeñas
    gloss: el panecillo / el librito / la galletita / la rosita / la manzanita / el ramito de flores
    note: Un diminutivo nombra algo pequeño o simpático. Panaderos, floristas y librerías los usan constantemente.
    example_gloss:
    - Este panecillo está rico.
    - El ramito de flores es precioso.
    - El librito es barato.
  nl.a2.unit101.lesson03.teach.gn_je:
    title: 'Diminutivo: -je'
    gloss: pan → panecillo; libro → librito; galleta → galletita; rosa → rosita; tomate → tomatito.
    note: 'La mayoría de las palabras solo añaden -je: *brood* pasa a *broodje* y *boek* pasa a *boekje*.'
  nl.a2.unit101.lesson03.teach.bijzonder:
    title: Dos sustantivos más
    gloss: el árbol / la mesa
    example_gloss:
    - Veo un árbol.
    - La mesa es grande.
  nl.a2.unit101.lesson03.teach.gn_tje_pje:
    title: 'Diminutivo: -tje y -pje'
    gloss: manzana → manzanita; mesa → mesita; árbol → arbolito; puesto → puestito; flor → ramillete de flores.
    note: Después de -el se añade -tje (*appeltje*). Después de -m con vocal larga se añade -pje (*boompje*, *kraampje*). Algunas palabras cambian más, como *bloem*, que pasa a *bloemetje*. Apréndelas a medida que las vayas encontrando.
  nl.a2.unit101.lesson03.teach.gn_het:
    title: Un diminutivo es siempre una palabra het
    gloss: 'la manzana → la manzanita: esta manzanita, esa manzanita. la rosa → la rosita: esta rosita, esa rosita.'
    note: Todo diminutivo es una palabra het, incluso cuando la palabra base es una palabra de. Así, *de appel* pasa a *het appeltje* y se dice *dit appeltje* y *dat appeltje*, nunca *deze appeltje*.
  nl.a2.unit101.lesson03.teach.gn_meervoud_je:
    title: El plural del diminutivo
    gloss: 'el panecillo → los panecillos: estos panecillos. el librito → los libritos: esos libritos. el ramillete de flores → los ramilletes de flores. la rosita → las rositas.'
    note: 'El plural del diminutivo termina en -jes: *broodjes*, *boekjes*, *appeltjes*, *roosjes*. En plural se usa *deze* y *die*, como con todos los plurales.'
  nl.a2.unit101.lesson04.teach.prijzen:
    title: Precios
    gloss: cuánto cuesta / cuánto cuestan / euro / dos / tres / cuatro / cinco
    note: Usa *kost* con una sola cosa y *kosten* con más de una.
    example_gloss:
    - Este panecillo cuesta dos euros.
    - Estas rosas cuestan cinco euros.
    - Ese libro cuesta tres euros.
  nl.a2.unit101.lesson04.teach.gn_kost:
    title: Kost o kosten
    gloss: ¿Cuánto cuesta este panecillo? ¿Cuánto cuestan estos panecillos?
    note: 'El verbo concuerda con el sustantivo señalado: una cosa lleva *kost*, varias cosas llevan *kosten*.'
  nl.a2.unit101.lesson04.teach.kiezen:
    title: Elegir y preguntar
    gloss: Me llevo ese librito. Busco una novela. Este ramillete de flores cuesta dos euros.
  nl.a2.unit101.lesson04.teach.gn_alleen:
    title: Dit y dat solos
    gloss: ¿Qué es eso? Eso es una rosa.
    note: 'Cuando señalas sin sustantivo y preguntas qué es algo, usas *dit* o *dat*, aunque la cosa sea una palabra de: *Wat is dat? Dat is een roos.*'
  nl.a2.unit101.lesson05.teach.reading:
    title: El mensaje de Noor
    gloss: ¡Hola, Lotte! Estoy en el mercado. Estas manzanas son baratas y esos tomates están ricos. En la panadería este panecillo es pequeño, pero aquel pan es grande. Me llevo este panecillo. Esas rosas son preciosas, pero este ramillete de flores es barato. ¡Me llevo este ramillete de flores para ti!
    note: 'Fíjate en qué palabra usa Noor con cada sustantivo: dit/dat con las palabras het, deze/die con las palabras de y con los plurales.'
    glosses:
      hoi: hola
      maar: pero
      voor: para
      jou: tú / ti
      bij: en / junto a
  nl.a2.unit101.lesson06.teach.lotte_brood:
    title: Lotte señala el pan
    gloss: 'Lotte: ¡Omar, mira! Este pan es fresco.'
  nl.a2.unit101.lesson06.teach.omar_broodje:
    title: Omar señala un panecillo más lejano
    gloss: 'Omar: Sí, y ese panecillo es barato.'
  nl.a2.unit101.lesson06.teach.lotte_neemt:
    title: Lotte elige
    gloss: 'Lotte: Entonces me llevo ese panecillo. ¿Y tú?'
  nl.a2.unit101.lesson06.teach.omar_taart:
    title: Omar elige
    gloss: 'Omar: Me llevo esta tarta y esta galleta.'
  nl.a2.unit101.lesson06.teach.lotte_bloemetje:
    title: Lotte ve las flores
    gloss: 'Lotte: ¡Mira, este ramillete de flores es precioso!'
  nl.a2.unit101.lesson06.teach.omar_rozen:
    title: Omar señala las rosas
    gloss: 'Omar: Sí, y esas rosas también son preciosas.'
