course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para identificar personas y cosas con oraciones de relativo.
  learning_goal: Identifica a una persona o una cosa con die o dat y una oración de relativo con el verbo al final.
units:
  nl.a2.unit98.degene_die_en_dat:
    title: El hombre que, el libro que
    description: Identifica personas en el trabajo y objetos perdidos o comprados con oraciones de relativo con die y dat.
lessons:
  nl.a2.unit98.lesson01.mensen_en_spullen:
    title: Personas y cosas
  nl.a2.unit98.lesson02.die_of_dat:
    title: ¿Die o dat?
  nl.a2.unit98.lesson03.wie_doet_wat:
    title: ¿Quién hace qué?
  nl.a2.unit98.lesson04.in_de_winkel:
    title: Buscando en la tienda
  nl.a2.unit98.lesson05.noors_bericht:
    title: El mensaje de Noor
  nl.a2.unit98.lesson06.lotte_en_omar:
    title: Lotte y Omar en la tienda
teaching:
  nl.a2.unit98.lesson01.teach.mensen:
    title: Personas en el trabajo
    gloss: el hombre / la mujer / el compañero, la compañera / el cliente, la clienta / el jefe, la jefa / el cocinero, la cocinera
    note: Todas estas palabras llevan de.
    example_gloss:
    - El cliente es un hombre.
    - La compañera es una mujer.
    - El cocinero y el jefe trabajan aquí.
  nl.a2.unit98.lesson01.teach.winkel_werk:
    title: La tienda y verbos de trabajo
    gloss: la tienda / trabajar / ayudar / buscar / comprar
    note: '*Kocht* es el imperfectum de *kopen*.'
    example_gloss:
    - Trabajo en la tienda.
    - La compañera ayuda al cliente.
    - Busco un bolso.
    - Compré un libro.
  nl.a2.unit98.lesson01.teach.spullen:
    title: Cosas de la tienda, cosas que se pierden
    gloss: la llave / el bolso / la cartera / el teléfono / la chaqueta / las gafas / el reloj / el libro / los zapatos / el jersey / el regalo
    note: 'Fíjate en qué palabras llevan *de* y cuáles llevan *het*: *het horloge, het boek, het cadeau*. *De schoenen* es un plural.'
    example_gloss:
    - La llave está en el bolso.
    - El reloj es nuevo.
    - El regalo es un libro.
  nl.a2.unit98.lesson01.teach.kwijt:
    title: Perdido y encontrado
    gloss: perdido / perder / encontrar
    note: '*Verloor* y *vond* son el imperfectum de *verliezen* y *vinden*.'
    example_gloss:
    - He perdido mi llave.
    - Perdí mis gafas.
    - El cliente encontró mi teléfono.
  nl.a2.unit98.lesson01.teach.zinnen:
    title: Frases cortas
    gloss: He perdido mi bolso. La compañera me ayuda. El cliente encontró mi teléfono.
  nl.a2.unit98.lesson01.teach.dit_is:
    title: Esto es, eso es
    gloss: Este es el libro. Ese es el hombre.
  nl.a2.unit98.lesson01.teach.gn_patroon:
    title: Die y dat se refieren a un sustantivo
    gloss: el hombre que trabaja en la tienda / el libro que compré
    note: '*Die* y *dat* unen una oración breve adicional al sustantivo que las precede. El verbo normalmente va al final de esa oración: *die in de winkel werkt*, *dat ik kocht*.'
  nl.a2.unit98.lesson02.teach.meer_spullen:
    title: Más cosas y algunos plurales
    gloss: la bicicleta / el paraguas / el billete; las llaves / los bolsos / los libros / los relojes / los jerséis
    note: 'Todos los plurales llevan *de*, también el plural de una palabra con het: *het boek* pasa a *de boeken*.'
    example_gloss:
    - El paraguas es azul.
    - El billete es pequeño.
  nl.a2.unit98.lesson02.teach.adjectieven:
    title: Adjetivos
    gloss: nuevo / bonito / viejo / azul / negro
    note: 'Después de *de* o *het*, el adjetivo lleva una *-e*: *de nieuwe tas*, *het mooie boek*.'
    example_gloss:
    - El bolso nuevo es negro.
    - El libro bonito es viejo.
  nl.a2.unit98.lesson02.teach.gn_de_het:
    title: Die para palabras con de y plurales, dat para palabras con het
    gloss: el bolso que / los zapatos que / el reloj que / el regalo que
    note: 'Usa *die* después de una palabra con de y después de cualquier plural. Usa *dat* solo después de una palabra con het en singular: *het horloge dat*, pero *de horloges die*.'
  nl.a2.unit98.lesson02.teach.zinnen2:
    title: Dos frases
    gloss: Busco las llaves que perdí. El billete que encontré es viejo.
    note: Una oración de relativo también puede ir justo después del sujeto. Todo el grupo es el sujeto, así que a continuación viene el verbo principal. Una coma después de la oración de relativo es habitual, pero opcional.
  nl.a2.unit98.lesson03.teach.werkwoorden:
    title: Más verbos
    gloss: llamar / ver / conocer
    note: '*Belde* y *zag* son el imperfectum de *bellen* y *zien*.'
    example_gloss:
    - Llamo al jefe.
    - Veo a la compañera.
    - Conozco al cliente.
  nl.a2.unit98.lesson03.teach.gn_onderwerp_voorwerp:
    title: ¿Quién realiza la acción?
    gloss: la mujer que me ve / la mujer a la que veo
    note: En *de vrouw die mij ziet*, la mujer es quien ve. En *de vrouw die ik zie*, quien ve soy yo. Después de *die* o *dat* aparece o bien un verbo enseguida (*die werkt*) o bien un sujeto nuevo (*die ik zie*).
  nl.a2.unit98.lesson03.teach.gn_werkwoord_achteraan:
    title: El verbo va al final
    gloss: El hombre trabaja en la tienda. / el hombre que trabaja en la tienda
    note: En una oración normal el verbo ocupa el segundo lugar. En una oración de relativo el verbo normalmente va al final, después de su complemento y de cualquier expresión breve como *in de winkel*.
  nl.a2.unit98.lesson03.teach.zinnen3:
    title: Dos expresiones contrastadas
    gloss: el cliente que me llamó / el cliente al que llamé
  nl.a2.unit98.lesson04.teach.zoeken:
    title: Objetos perdidos
    gloss: He perdido mi cartera. Busco el bolso que perdí. Estas son las llaves que perdí.
  nl.a2.unit98.lesson04.teach.hier:
    title: Ayuda en la tienda
    gloss: El hombre que trabaja aquí me ayudó. Ese es el cliente que encontró mi teléfono.
  nl.a2.unit98.lesson04.teach.gn_modaal:
    title: Dos verbos al final
    gloss: la chaqueta que quiero comprar / el bolso que quiero tener
    note: 'Con un verbo modal y un infinitivo, ambos van al final. Primero va el modal y después el infinitivo: *die ik wil kopen*.'
  nl.a2.unit98.lesson04.teach.gn_degene:
    title: 'Degene die: la persona que'
    gloss: Busco a la persona que encontró mi bolso.
    note: '*Degene die* significa «la persona que». Se usa cuando no sabes exactamente quién es la persona. En esta unidad va seguido de *die*.'
  nl.a2.unit98.lesson05.teach.woorden:
    title: Palabras pequeñas útiles
    gloss: ayer / allí / otra vez / de vuelta / ahora / también
    example_gloss:
    - Compré el bolso ayer.
    - Ahora tengo otra vez la llave.
  nl.a2.unit98.lesson05.teach.reading:
    title: Noor le escribe a Lotte
    gloss: 'Hola, Lotte: he perdido mi bolso. Es el bolso que compré ayer. Busqué en la tienda. La mujer que trabaja allí me ayudó. Un cliente que vio el bolso llamó al jefe. Ahora tengo otra vez el bolso. El libro que estaba en el bolso también ha vuelto. Un saludo, Noor'
    note: Fíjate en cada oración de relativo y en el sustantivo al que pertenece.
    glosses:
      zocht: busqué
      hielp: ayudó
      zat: estaba (en)
      zag: vio
      Groetjes: un saludo
  nl.a2.unit98.lesson05.teach.gn_zin_in_zin:
    title: Una oración de relativo dentro de una frase
    gloss: La mujer que trabaja allí me ayudó.
    note: Cuando la oración de relativo va después del sujeto, el verbo principal viene a continuación. Una coma después de la oración de relativo es habitual, pero opcional. La oración de relativo forma parte del sujeto.
  nl.a2.unit98.lesson06.teach.lotte_kwijt:
    title: Lotte dice (frase 1)
    gloss: 'Lotte: Hola, Omar, he perdido mi chaqueta.'
  nl.a2.unit98.lesson06.teach.omar_gisteren:
    title: Omar dice (línea 2)
    gloss: 'Omar: ¡Ay, no! ¿Es la chaqueta que compraste ayer?'
  nl.a2.unit98.lesson06.teach.lotte_blauw:
    title: Lotte dice (línea 3)
    gloss: 'Lotte: No, es la chaqueta azul que compré la semana pasada.'
  nl.a2.unit98.lesson06.teach.omar_man:
    title: Omar dice (línea 4)
    gloss: 'Omar: Un hombre que trabaja en la tienda encontró una chaqueta azul.'
  nl.a2.unit98.lesson06.teach.lotte_dank:
    title: Lotte dice (línea 5)
    gloss: 'Lotte: ¿De verdad? ¡Gracias, Omar! Entonces voy a la tienda.'
  nl.a2.unit98.lesson06.teach.omar_succes:
    title: Omar dice (línea 6)
    gloss: 'Omar: ¡Suerte! Pregunta por el hombre que encontró la chaqueta.'
