teaching:
  nl.a1.unit04.lesson01.teach.hour:
    title: Hora
    gloss: la hora
    note: '*Uur* va después del número para una hora en punto: *twee uur* son las dos en punto.'
    example_gloss: Son las dos.
  nl.a1.unit04.lesson01.teach.two_oclock:
    title: Las dos en punto
    gloss: 2:00 — las dos en punto
    note: Para una hora en punto, di el número seguido de *uur*.
  nl.a1.unit04.lesson01.teach.three_oclock:
    title: Las tres en punto
    gloss: 3:00 — las tres en punto
    note: '*Drie uur* son exactamente las 3:00.'
  nl.a1.unit04.lesson01.teach.half_three:
    title: A medio camino de las tres
    gloss: 2:30 — las dos y media
    note: 'Diferencia clave: en neerlandés *half drie* nombra la hora siguiente. Son las 2:30, no las 3:30. En español se dice «las dos y media», partiendo de la hora anterior.'
  nl.a1.unit04.lesson01.teach.half_rule:
    title: Half apunta a la hora siguiente
    gloss: media tres = a medio camino hacia las tres = 2:30
    note: Lee *half* + hora como «a medio camino hacia esa hora». Por tanto, *half vier* es 3:30.
  nl.a1.unit04.lesson01.teach.half_four:
    title: A medio camino de las cuatro
    gloss: 3:30 — las tres y media
    note: '*Half vier* es la mitad del camino hacia las cuatro, así que significa las 3:30.'
  nl.a1.unit04.lesson01.teach.time_answer:
    title: Decir la media hora
    gloss: Son las dos y media.
    note: '*Het is ...* es la estructura normal para decir la hora actual.'
  nl.a1.unit04.lesson02.teach.quarter:
    title: El cuarto de hora
    gloss: el cuarto de hora
    note: '*Kwart* se usa en las expresiones fijas de la hora *kwart over* y *kwart voor*.'
    example_gloss: Un cuarto de hora son quince minutos.
  nl.a1.unit04.lesson02.teach.quarter_past_two:
    title: Las dos y cuarto
    gloss: 2:15 — las dos y cuarto
    note: '*Kwart over twee* son quince minutos después de las dos.'
  nl.a1.unit04.lesson02.teach.past_rule:
    title: Over significa «y»
    gloss: y (pasadas) = después de la hora en punto
    note: En una expresión de la hora, *over* cuenta hacia delante a partir de la hora que acaba de pasar.
  nl.a1.unit04.lesson02.teach.quarter_to_three:
    title: Las tres menos cuarto
    gloss: 2:45 — las tres menos cuarto
    note: '*Kwart voor drie* son quince minutos antes de las tres, es decir, las 2:45.'
  nl.a1.unit04.lesson02.teach.to_rule:
    title: Voor significa «menos»
    gloss: menos = antes de la próxima hora en punto
    note: En una expresión de la hora, *voor* apunta hacia la hora siguiente.
  nl.a1.unit04.lesson02.teach.quarter_past_three:
    title: Las tres y cuarto
    gloss: 3:15 — las tres y cuarto
    note: '*Over* mantiene la hora que acaba de pasar: *kwart over drie*.'
  nl.a1.unit04.lesson02.teach.quarter_to_four:
    title: Las cuatro menos cuarto
    gloss: 3:45 — las cuatro menos cuarto
    note: '*Voor* nombra la hora que se acerca: *kwart voor vier* son las 3:45.'
  nl.a1.unit04.lesson03.teach.ask_time:
    title: Preguntar la hora
    gloss: ¿Qué hora es?
    note: '*Hoe laat is het?* es la pregunta habitual y cotidiana para saber la hora.'
  nl.a1.unit04.lesson03.teach.tell_time:
    title: Decir la hora
    gloss: Son las dos y media.
    note: 'Recuerda que en neerlandés *half drie* se refiere a la hora anterior a las tres: son las 2:30.'
  nl.a1.unit04.lesson03.teach.ask_start:
    title: Preguntar cuándo empieza una actividad
    gloss: ¿A qué hora empieza el café de idiomas?
    note: '*Hoe laat* introduce una pregunta sobre una hora del reloj.'
  nl.a1.unit04.lesson03.teach.at_quarter:
    title: A las dos y cuarto
    gloss: A las dos y cuarto.
    note: Usa *om* delante de la hora para decir cuándo ocurre un acontecimiento.
  nl.a1.unit04.lesson03.teach.at_rule:
    title: Usar om para la hora de un evento
    gloss: 'a las + hora: a las dos, a las dos y media'
    note: No se usa *om* cuando solo se dice la hora actual con *Het is*.
  nl.a1.unit04.lesson03.teach.late:
    title: Preguntar si llegas tarde
    gloss: ¿Llego tarde?
    note: Aquí *laat* significa «tarde»; la frase es natural en un intercambio sobre horarios.
  nl.a1.unit04.lesson03.teach.on_time:
    title: Decir que alguien llega a tiempo
    gloss: No, llegas a tiempo.
    note: '*Op tijd* significa «a tiempo». *Je* mantiene el intercambio en tono informal.'
  nl.a1.unit04.lesson04.teach.twenty_four_hour:
    title: Catorce horas
    gloss: 14:00 — catorce horas
    note: En horarios y anuncios es habitual el reloj de 24 horas. *Veertien uur* es una forma hablada inequívoca de las 14:00.
  nl.a1.unit04.lesson04.teach.eighteen_hour:
    title: Dieciocho horas
    gloss: 18:00 — dieciocho horas
    note: '*Achttien uur* es la forma del reloj de 24 horas para las 6 de la tarde.'
  nl.a1.unit04.lesson04.teach.morning:
    title: Las siete de la mañana
    gloss: 7:00 — las siete de la mañana
    note: '*''s Ochtends* significa «por la mañana». El *''s* inicial forma parte de la expresión fija.'
  nl.a1.unit04.lesson04.teach.afternoon:
    title: Las dos de la tarde
    gloss: 14:00 — las dos de la tarde
    note: '*''s Middags* abarca la tarde, a partir de mediodía; distingue las 14:00 de las 2:00 cuando se habla en formato de 12 horas.'
  nl.a1.unit04.lesson04.teach.evening:
    title: Las ocho de la noche
    gloss: 20:00 — las ocho de la noche
    note: '*''s Avonds* se usa para la noche, en general desde el final de la tarde hasta alrededor de la medianoche.'
  nl.a1.unit04.lesson04.teach.night:
    title: Las dos de la madrugada
    gloss: 2:00 — las dos de la madrugada
    note: '*''s Nachts* se usa para las horas de la noche cerrada; las 02:00 son naturalmente *twee uur ''s nachts*.'
  nl.a1.unit04.lesson04.teach.day_parts:
    title: Partes del día
    gloss: la mañana · la tarde · el atardecer/la noche · la noche/madrugada
    note: 'Los límites en neerlandés son aproximados: *ochtend* llega hasta cerca del mediodía, *middag* va desde el mediodía durante la tarde, *avond* abarca la velada y *nacht* cubre las horas nocturnas.'
    example_gloss:
    - Por la mañana tomo café.
    - El café de idiomas es por la tarde.
    - Por la noche leo.
    - Duermo de noche.
  nl.a1.unit04.lesson05.teach.schedule:
    title: El horario
    gloss: el horario
    note: Un *rooster* enumera actividades y sus horas.
    example_gloss: Leo el horario.
  nl.a1.unit04.lesson05.teach.opening_hours:
    title: Horario del café de idiomas
    gloss: 'Café de idiomas abierto: 14:00–16:00'
    note: Los horarios neerlandeses suelen usar un punto entre las horas y los minutos; 14.00 es la misma hora que 14:00.
  nl.a1.unit04.lesson05.teach.welcome:
    title: Hora de la bienvenida
    gloss: 14:15 Bienvenida
    note: 14.15 se puede decir *kwart over twee* en el lenguaje cotidiano de 12 horas.
  nl.a1.unit04.lesson05.teach.workshop:
    title: Hora del taller
    gloss: 14:45 Taller
    note: '14.45 es *kwart voor drie*: el cuarto antes de las tres.'
  nl.a1.unit04.lesson05.teach.break:
    title: Hora de la pausa
    gloss: 15:30 Pausa
    note: 15.30 es *half vier*, a mitad de camino hacia las cuatro; no equivale a «las cuatro y media».
  nl.a1.unit04.lesson05.teach.ask_schedule:
    title: Preguntar una hora del horario
    gloss: ¿A qué hora empieza el taller?
    note: '*Begint* pregunta cuándo empieza la actividad.'
  nl.a1.unit04.lesson05.teach.workshop_answer:
    title: Dar la hora del taller
    gloss: A las tres menos cuarto.
    note: Las 14.45 del horario corresponden a *kwart voor drie*.
  nl.a1.unit04.lesson06.teach.start_turn:
    title: Confirmar la hora del café de idiomas
    gloss: 'Lotte: ¿A qué hora empieza el café de idiomas el viernes? Omar: A las dos y cuarto, es decir, a las 14:15.'
    note: 'Omar da ambas formas explícitamente: *kwart over twee* y 14.15 son la misma hora, la de la bienvenida en el horario de la lección 5.'
  nl.a1.unit04.lesson06.teach.workshop_turn:
    title: Preguntar por el taller
    gloss: 'Lotte: ¿Y a qué hora empieza el taller? Omar: A las tres menos cuarto.'
    note: '*Kwart voor drie* son las 14:45, como en el horario de la lección 5.'
  nl.a1.unit04.lesson06.teach.arrival_turn:
    title: Decir una hora de llegada
    gloss: 'Lotte: Bien. Entonces estaré allí a las dos.'
    note: Lotte piensa llegar a las 14:00, quince minutos antes del inicio a las 14:15.
  nl.a1.unit04.lesson06.teach.close_turn:
    title: Cerrar el plan
    gloss: 'Omar: ¡Genial, nos vemos el viernes por la tarde!'
    note: '*Vrijdagmiddag* es una palabra compuesta natural que significa «viernes por la tarde».'
