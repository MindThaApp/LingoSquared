teaching:
  nl.a1.unit31.lesson01.teach.dier_huisdier:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*Dier* es la palabra general para «animal»; *huisdier* (literalmente «animal de casa») significa específicamente «mascota».'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  nl.a1.unit31.lesson01.teach.hond_kat:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Lotte tiene un perro.
    - Sander tiene un gato.
  nl.a1.unit31.lesson01.teach.vis_vogel:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  nl.a1.unit31.lesson01.teach.heb_je_huisdier:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: El mismo patrón de pregunta *Heb je ...?* que ya conoces de unidades anteriores.
  nl.a1.unit31.lesson01.teach.antwoord_ja:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  nl.a1.unit31.lesson01.teach.antwoord_nee_geen:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: '*Geen* niega el sustantivo indefinido *een huisdier*; consulta la nota de gramática.'
  nl.a1.unit31.lesson01.teach.geen_note:
    title: 'Geen: negar un sustantivo indefinido'
    gloss: Geen niega un sustantivo indefinido, como en Ik heb geen tijd (que ya conoces) y aquí en Ik heb geen huisdier.
    note: 'Retoma el mismo patrón de *geen* que ya viste en *Ik heb geen tijd*: no es gramática nueva, solo un sustantivo nuevo al que aplicarlo.'
  nl.a1.unit31.lesson02.teach.uitlaten:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: 'Un verbo separable: mira la nota de gramática.'
    example_gloss: Paseo al perro todos los días.
  nl.a1.unit31.lesson02.teach.separable_note:
    title: Uitlaten es separable
    gloss: 'Uitlaten es separable, igual que opstaan y aankleden de una lección anterior: ik laat de hond uit.'
    note: Reutiliza el mismo patrón de verbos separables (raíz + ... + prefijo al final) que ya se vio con los verbos de la rutina diaria.
  nl.a1.unit31.lesson02.teach.eten_geven:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  nl.a1.unit31.lesson02.teach.spelen_met:
    title: Jugar con
    gloss: jugar con
    example_gloss: Sander juega con su gato.
  nl.a1.unit31.lesson02.teach.uitlaten_phrase:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: Combina *uitlaten* con *elke dag* (todos los días), que ya conoces de una unidad anterior.
  nl.a1.unit31.lesson02.teach.eten_phrase:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: Combina *eten geven* con *elke dag*.
  nl.a1.unit31.lesson03.teach.meervoud_note:
    title: 'Plural: hond -> honden'
    gloss: 'Plural con -en: hond -> honden, dier -> dieren. Con vocal corta, la consonante se duplica: kat -> katten.'
    note: El patrón del plural regular neerlandés, presentado aquí por primera vez con sustantivos de animales como ejemplos.
  nl.a1.unit31.lesson03.teach.honden_katten:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - A Omar le encantan los perros.
    - A Fenna le encantan los gatos.
  nl.a1.unit31.lesson03.teach.vissen_vogels:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  nl.a1.unit31.lesson03.teach.ik_houd_van_dieren:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: Retoma *houden van* de la lección de gustos de una unidad anterior, ahora aplicado a los animales.
  nl.a1.unit31.lesson03.teach.fenna_katten_geen:
    title: A Fenna le encantan los gatos, pero no tiene mascota
    gloss: A Fenna le encantan los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
