course:
  title: Neerlandés A1
  description: 'Neerlandés para principiantes para hablar de mascotas y animales comunes: nombrarlos, cuidados básicos (pasear, dar de comer, jugar), decir qué animales te encantan aunque no tengas ninguno y el plural regular neerlandés.'
