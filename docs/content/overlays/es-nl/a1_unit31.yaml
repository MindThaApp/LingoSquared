    title: Omar pregunta por una mascota
    gloss: 'Omar: ¿Tienes una mascota, Lotte?'
  nl.a1.unit31.lesson04.teach.lotte_ja_hond:
    title: Lotte tiene un perro
    gloss: 'Lotte: Sí, tengo un perro.'
  nl.a1.unit31.lesson04.teach.omar_hoe_ziet_eruit:
    title: Omar pregunta cómo es
    gloss: 'Omar: ¿Cómo es?'
    note: Retoma la pregunta *Hoe ziet ... eruit?* de una unidad anterior sobre el aspecto físico, ahora aplicada a un animal.
  nl.a1.unit31.lesson04.teach.lotte_beschrijft:
    title: Lotte describe a su perro
    gloss: 'Lotte: Tiene el pelo marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  nl.a1.unit31.lesson04.teach.pronoun_note:
    title: Hij/hem para animales
    gloss: Hij («él») y hem («lo/le») también se pueden usar para un animal, no solo para una persona.
    note: En todos los usos anteriores de hij/hem en este curso se hablaba de personas; aquí se indica expresamente que también se usan con animales.
  nl.a1.unit31.lesson04.teach.omar_laat_je_uit:
    title: Omar pregunta por los paseos
    gloss: 'Omar: ¿Lo sacas a pasear todos los días?'
  nl.a1.unit31.lesson04.teach.lotte_ja_zorg:
    title: Lotte cuenta su rutina
    gloss: 'Lotte: Sí, lo saco a pasear todos los días y le doy de comer.'
  nl.a1.unit31.lesson05.teach.tekst:
    title: Omar, Fenna y Sander hablan de animales
    gloss: 'A Omar y a Fenna les encantan los animales, pero ninguno de los dos tiene mascota. A Omar le encantan los perros y a Fenna le encantan los gatos. Sander sí tiene una mascota: un gato. Juega a menudo con su gato y le da de comer todos los días. ¿Tú tienes mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      houden: adorar
      allebei: los dos
      dieren: animales
      beiden: los dos
      huisdier: mascota
      honden: perros
      katten: gatos
      kat: gato
      speelt: juega
      geeft: da
      elke: cada
      eten: comida
  nl.a1.unit31.lesson05.teach.sander_speelt:
    title: Sander juega a menudo con su gato
    gloss: Sander juega a menudo con su gato.
    note: Reutiliza *vaak* (a menudo), que ya se presentó con las rutinas de Omar en una unidad anterior.
  nl.a1.unit31.lesson05.teach.ik_houd_geen:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  nl.a1.unit31.lesson06.teach.lotte_vraagt_nina:
    title: Lotte le pregunta a Nina
    gloss: 'Lotte: Nina, ¿tú también tienes una mascota?'
  nl.a1.unit31.lesson06.teach.nina_ja_vogel:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*Heet* (se llama) reutiliza el verbo de presentación de la primera unidad.'
  nl.a1.unit31.lesson06.teach.omar_wat_leuk:
    title: Omar reacciona
    gloss: 'Omar: ¡Qué bien! ¿Qué haces con él todos los días?'
  nl.a1.unit31.lesson06.teach.nina_geeft_eten:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  nl.a1.unit31.lesson06.teach.omar_houd_ook:
    title: A Omar también le encantan los pájaros
    gloss: 'Omar: A mí también me encantan los pájaros.'
  nl.a1.unit31.lesson06.teach.lotte_afsluiting:
    title: Lotte cierra la conversación
    gloss: 'Lotte: ¡Qué bien que a los tres nos encanten los animales!'
    note: Cierra el círculo con los datos sobre animales de los tres personajes de esta unidad.
