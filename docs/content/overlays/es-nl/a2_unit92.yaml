course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para dar motivos y consecuencias.
  learning_goal: Da un motivo y una consecuencia en un solo mensaje con omdat, want y dus.
units:
  nl.a2.unit92.omdat_want_dus:
    title: Porque, pues, así que
    description: Explica una excusa o un cambio de planes dando un motivo y una consecuencia.
lessons:
  nl.a2.unit92.lesson01.reden_en_gevolg:
    title: Motivo y consecuencia
  nl.a2.unit92.lesson02.omdat_werkwoord_achteraan:
    title: 'Omdat: el verbo al final'
  nl.a2.unit92.lesson03.omdat_want_of_dus:
    title: ¿Omdat, want o dus?
  nl.a2.unit92.lesson04.afspraak_verzetten:
    title: Cambiar la cita
  nl.a2.unit92.lesson05.noors_bericht:
    title: El mensaje de Noor
  nl.a2.unit92.lesson06.lotte_en_omar:
    title: Lotte y Omar
teaching:
  nl.a2.unit92.lesson01.teach.klachten:
    title: Motivos para no ir
    gloss: enfermo / cansado / ocupado / dolor de cabeza
    note: Estas palabras suelen servir para dar un motivo.
    example_gloss:
    - Estoy enfermo.
    - Omar está cansado.
    - Lotte está ocupada.
    - Me duele la cabeza.
  nl.a2.unit92.lesson01.teach.plannen:
    title: Planes, trabajo y tiempo
    gloss: la cita / el trabajo / el tiempo / el tren
    note: Las citas, el trabajo y el tiempo son motivos habituales para cambiar un plan.
    example_gloss:
    - Tengo una cita con Noor.
    - Tengo mucho trabajo.
    - Hace mal tiempo.
    - Está lloviendo.
    - El tren va con retraso.
  nl.a2.unit92.lesson01.teach.gevolgen:
    title: Lo que sigue
    gloss: quedarse / venir / en casa / más tarde / no
    note: Estas palabras expresan lo que haces por una razón.
    example_gloss:
    - Me quedo en casa.
    - Omar se queda en casa.
    - Llego más tarde.
    - No voy.
  nl.a2.unit92.lesson01.teach.gn_reden_gevolg:
    title: Motivo y consecuencia
    gloss: 'La consecuencia: Me quedo en casa. La razón: Está lloviendo. Un mensaje da la razón y la consecuencia.'
    note: La razón explica por qué. La consecuencia dice lo que ocurre por ello. En esta unidad pondrás ambas en un mismo mensaje.
  nl.a2.unit92.lesson01.teach.gn_want:
    title: Want da una razón
    gloss: 'Con want das la razón. El orden de las palabras no cambia: Me quedo en casa, porque está lloviendo.'
    note: '*Want* une dos oraciones principales normales. Cada oración mantiene su orden habitual: en *het regent* el verbo va en segunda posición.'
  nl.a2.unit92.lesson01.teach.gn_dus:
    title: Dus da la consecuencia
    gloss: 'Con dus das la consecuencia: Está lloviendo, así que me quedo en casa.'
    note: '*Dus* une dos oraciones principales: *het regent, dus ik blijf thuis*. En esta unidad practicas el patrón *dus ik ...*.'
  nl.a2.unit92.lesson01.teach.zinnen:
    title: Dos mensajes completos
    gloss: Estoy cansado, así que me quedo en casa. No voy, porque me duele la cabeza.
  nl.a2.unit92.lesson02.teach.waarom:
    title: Por qué y porque
    gloss: por qué / porque
    note: '*Waarom* pregunta por la razón; *omdat* empieza la respuesta.'
    example_gloss:
    - ¿Por qué no vienes?
    - Porque estoy enfermo.
    - ¿Por qué te quedas en casa?
    - Porque está lloviendo.
  nl.a2.unit92.lesson02.teach.modaal:
    title: Deber, poder y esta noche
    gloss: deber / poder / trabajar / esta noche
    note: Estos verbos son frecuentes en las excusas.
    example_gloss:
    - Tengo que trabajar.
    - No puedo venir esta noche.
    - Omar tiene que trabajar.
  nl.a2.unit92.lesson02.teach.gn_omdat:
    title: Omdat manda el verbo al final
    gloss: 'Después de omdat, el verbo conjugado va al final: porque está lloviendo; porque estoy enfermo; porque tengo una cita.'
    note: '*Omdat* inicia una oración subordinada. El verbo conjugado va al final de la oración: *omdat ik ziek ben*, no *omdat ik ben ziek*.'
  nl.a2.unit92.lesson02.teach.gn_omdat_modaal:
    title: Dos verbos al final
    gloss: 'Con moeten o kunnen, dos verbos van al final: porque tengo que trabajar; porque no puedo venir.'
    note: 'En la oración subordinada los dos verbos van al final, con el verbo modal primero: *moet werken*, *kan komen*.'
  nl.a2.unit92.lesson02.teach.zinnen:
    title: Dos frases con omdat
    gloss: Me quedo en casa porque estoy enfermo. No voy porque tengo que trabajar.
  nl.a2.unit92.lesson03.teach.woorden:
    title: Tiempo y lamentos
    gloss: hoy / mañana / por desgracia / qué pena
    note: '*Helaas* y *jammer* suelen abrir una excusa.'
    example_gloss:
    - Hoy me quedo en casa.
    - Mañana llego más tarde.
    - Por desgracia, me duele la cabeza.
    - Qué pena, no puedo venir.
  nl.a2.unit92.lesson03.teach.gn_contrast:
    title: Omdat frente a want y dus
    gloss: 'Omdat: el verbo va al final. Want: el orden de las palabras no cambia. Dus: da la consecuencia.'
    note: '*Omdat* y *want* tienen el mismo significado, pero distinto orden de palabras: *omdat ik ziek ben*, pero *want ik ben ziek*.'
  nl.a2.unit92.lesson03.teach.gn_voorop:
    title: Oración con omdat al principio
    gloss: 'Si la oración con omdat va primero, la oración principal empieza con el verbo y luego va el sujeto: Como está lloviendo, me quedo en casa.'
    note: 'Tras una oración con *omdat* al principio, la oración principal lleva inversión: *blijf ik thuis*. *Want* no hace esto: *want ik blijf thuis*, no *want blijf ik thuis*.'
  nl.a2.unit92.lesson03.teach.zinnen:
    title: Primero la oración con omdat
    gloss: Como está lloviendo, me quedo en casa. Como el tren llega tarde, llego más tarde.
  nl.a2.unit92.lesson04.teach.verzetten:
    title: Cambiar un plan
    gloss: perdón / el colega / aplazar / tiempo
    note: Usa estas palabras para cancelar con educación y proponer una nueva hora.
    example_gloss:
    - Perdón, no puedo venir.
    - Mi colega está enfermo.
    - ¿Podemos cambiar la cita de fecha?
    - ¿Tienes tiempo mañana?
  nl.a2.unit92.lesson04.teach.gn_bericht:
    title: Un mensaje con razón y consecuencia
    gloss: 'Un buen mensaje tiene una disculpa, una consecuencia, una razón y una pregunta: Perdón, no puedo ir, porque tengo que trabajar. ¿Podemos aplazar la cita?'
    note: Pon primero la consecuencia (*ik kan niet komen*), añade la razón con *omdat* o *want* y después haz una pregunta.
  nl.a2.unit92.lesson04.teach.collega:
    title: Primero la razón, luego la consecuencia
    gloss: Mi colega está enfermo, así que tengo que trabajar.
  nl.a2.unit92.lesson05.teach.woorden:
    title: Palabras para el mensaje
    gloss: también / fuerte / pasado mañana / un saludo (despedida informal)
    note: Estas palabras aparecen en el mensaje de Noor.
    example_gloss:
    - También está lloviendo.
    - Está lloviendo fuerte.
    - ¿Tienes tiempo pasado mañana?
    - Un saludo, Omar.
  nl.a2.unit92.lesson05.teach.reading:
    title: Noor cambia el plan
    gloss: 'Hola, Lotte: perdona, no puedo ir esta noche, porque me duele la cabeza. Además está lloviendo fuerte, así que me quedo en casa. Mañana no puedo, porque tengo que trabajar. ¿Tienes tiempo pasado mañana? ¿Podemos aplazar la cita? Un saludo, Noor'
    note: Busca la razón y la consecuencia en cada frase.
    glosses:
      Hoi: hola
      vanavond: esta noche
      hoofdpijn: dolor de cabeza
      ook: también
      hard: fuerte
      overmorgen: pasado mañana
      groetjes: un saludo
      verzetten: aplazar
  nl.a2.unit92.lesson06.teach.lotte_vraagt:
    title: Lotte pregunta
    gloss: Hola, Omar, ¿vienes esta noche?
  nl.a2.unit92.lesson06.teach.omar_nee:
    title: Omar dice que no
    gloss: No, perdona, no puedo ir.
  nl.a2.unit92.lesson06.teach.lotte_waarom:
    title: Lotte pregunta por qué
    gloss: ¿Por qué no vienes?
  nl.a2.unit92.lesson06.teach.omar_reden:
    title: Omar da la razón y la consecuencia
    gloss: Porque mi colega está enfermo. No puede trabajar, así que trabajo yo esta noche.
  nl.a2.unit92.lesson06.teach.lotte_verzetten:
    title: Lotte propone un cambio
    gloss: ¡Qué pena! ¿Podemos aplazar la cita?
  nl.a2.unit92.lesson06.teach.omar_graag:
    title: Omar acepta y pregunta
    gloss: Sí, por favor. ¿Tienes tiempo mañana?
  nl.a2.unit92.lesson06.teach.lotte_morgen:
    title: Lotte acepta un día
    gloss: Sí, mañana tengo tiempo.
