course:
  overlay_key: es-nl.a2
  title: Neerlandés A2
  description: Neerlandés intermedio con práctica centrada en la gramática para describir hechos pasados.
units:
  nl.a2.unit81.een_drukke_ochtend:
    title: Una mañana ajetreada
    description: Describe una mañana o el trayecto al trabajo paso a paso con verbos separables en perfectum.
lessons:
  nl.a2.unit81.lesson01.ge_in_het_midden:
    title: Ge- en medio
  nl.a2.unit81.lesson02.stappen_op_volgorde:
    title: Los pasos en orden
  nl.a2.unit81.lesson03.wel_of_geen_ge:
    title: ¿Con ge- o sin ge-?
  nl.a2.unit81.lesson04.de_ochtend_ging_mis:
    title: La mañana salió mal
  nl.a2.unit81.lesson05.noors_bericht:
    title: El mensaje de Noor
  nl.a2.unit81.lesson06.lotte_en_noor:
    title: Lotte y Noor hablan después del trabajo
teaching:
  nl.a2.unit81.lesson01.teach.ochtend_reis:
    title: Mañana y trayecto
    gloss: la mañana, el despertador, el autobús, la bicicleta, el bolso
    note: Palabras básicas para prepararse y desplazarse.
    example_gloss:
    - La mañana empieza temprano.
    - Mi despertador suena a las siete.
    - El autobús está en la parada.
    - Mi bicicleta está fuera.
    - Mi bolso está listo.
  nl.a2.unit81.lesson01.teach.verbindingswoorden:
    title: Ordena los pasos
    gloss: primero, después, luego, por último
    note: Estos conectores organizan un relato paso a paso. Cuando uno encabeza una oración principal, el verbo conjugado va antes del sujeto.
    example_gloss:
    - Primero desayuno.
    - Después preparo el bolso.
    - Luego salgo.
    - Por último subo al autobús.
  nl.a2.unit81.lesson01.teach.gn_midden:
    title: El participio rodea a ge-
    gloss: levantarse → se levantó; llegar → llegó; bajarse → se bajó; subirse → se subió
    note: 'En un verbo separable, *ge-* va entre el prefijo y el verbo: *op-ge-staan*, *aan-ge-komen*, *uit-ge-stapt*, *in-ge-stapt*.'
  nl.a2.unit81.lesson01.teach.gn_zinnen:
    title: Pasos de la mañana terminados
    gloss: Me levanté temprano. El autobús llegó demasiado tarde. Me bajé en la estación.
    note: Estos verbos de movimiento y cambio de posición usan *zijn* en el perfectum.
  nl.a2.unit81.lesson01.teach.gn_hulpwerkwoord:
    title: Estos verbos usan zijn
    gloss: Me levanté; el autobús llegó; me subí y me bajé.
    note: En estos hechos terminados de movimiento o cambio de posición, usa *ben/is* más el participio.
  nl.a2.unit81.lesson02.teach.klaarmaken:
    title: Prepararse
    gloss: vestirse, recoger, lavar los platos, llevarse
    note: Los cuatro son verbos separables.
    example_gloss:
    - Hoy vestirse es rápido.
    - Recojo después del desayuno.
    - Lavo los platos después de comer.
    - ¿Te lo llevas o lo dejas en casa?
  nl.a2.unit81.lesson02.teach.gn_participles:
    title: Más participios separables
    gloss: vestido; recogido; lavado; llevado
    note: 'El prefijo se queda delante y *ge-* aparece en medio: *aan-ge-kleed*, *op-ge-ruimd*, *af-ge-wassen*, *mee-ge-nomen*.'
  nl.a2.unit81.lesson02.teach.stappen:
    title: Una rutina de cuatro pasos
    gloss: Primero me levanté. Después me vestí. Luego lavé mi taza. Por último me llevé el bolso.
    note: Cada conector marca el siguiente paso completado.
  nl.a2.unit81.lesson03.teach.contrastwerkwoorden:
    title: Tres verbos sin ge- adicional
    gloss: olvidar, salir, desayunar
    note: Estos verbos empiezan con prefijos inseparables y forman su participio sin un *ge-* adicional.
    example_gloss:
    - Olvidar es humano.
    - Queremos salir a las ocho.
    - Desayuno en casa.
  nl.a2.unit81.lesson03.teach.gn_contrast:
    title: Separable e inseparable
    gloss: 'Separable: levantarse → se levantó. No separable: olvidar → olvidado, salir → salió, desayunar → desayunó.'
    note: Usa *opgestaan*, pero *vergeten*, *vertrokken* y *ontbeten* sin otro *ge-*.
  nl.a2.unit81.lesson03.teach.contrastzinnen:
    title: Compara las formas
    gloss: Me levanté y desayuné. Después salí. Olvidé mi bolso.
    note: Solo el verbo separable *opstaan* coloca *ge-* después de su prefijo.
  nl.a2.unit81.lesson03.teach.gn_modal:
    title: Un verbo separable después de un modal
    gloss: Quiero levantarme temprano. Tengo que recoger la cocina. Puedo bajarme en la estación.
    note: 'Con *wil, moet* o *kan* en presente, el infinitivo se mantiene unido y va al final: *opstaan, opruimen, uitstappen*.'
  nl.a2.unit81.lesson04.teach.op_tijd_snel:
    title: Cómo fue la mañana
    gloss: a tiempo, rápido, aun así
    note: Usa estas palabras para explicar el momento y un resultado favorable inesperado.
    example_gloss:
    - Quiero llegar a tiempo.
    - El autobús va rápido.
    - Está lloviendo, pero voy de todos modos.
  nl.a2.unit81.lesson04.teach.gn_negatie:
    title: Pasos en negativa
    gloss: No me llevé el bolso. No me levanté a tiempo.
    note: 'Coloca *niet* antes del elemento que se niega: el participio separable o la expresión *op tijd*.'
  nl.a2.unit81.lesson04.teach.gn_dat:
    title: El perfectum en una oración con dat
    gloss: Dije que me levanté temprano. Oí que el autobús llegó demasiado tarde.
    note: 'Después de *dat*, las dos partes del verbo van al final: *ben opgestaan*, *is aangekomen*.'
  nl.a2.unit81.lesson04.teach.scenario:
    title: Una mañana que salió mal
    gloss: Primero no me levanté a tiempo. Después me vestí rápido. Luego no me llevé el bolso. Por último subí al autobús.
    note: Los conectores dan un orden claro a los pasos fallidos y a los completados.
  nl.a2.unit81.lesson05.teach.noor_bericht:
    title: La mañana ajetreada de Noor
    gloss: ¡Hola, Lotte! Mi mañana fue muy ajetreada. Primero me levanté demasiado tarde. Después me vestí rápido y desayuné. Luego recogí la cocina, pero no me llevé el almuerzo. Fui en bici a la parada y subí al autobús. Por último, llegué a tiempo al trabajo de todos modos.
    note: Lee atendiendo al orden de los hechos y a lo único que Noor no se llevó.
    glosses:
      erg: muy
      druk: ajetreado
      bushalte: parada de autobús
      lunch: el almuerzo
      toch: aun así / a pesar de todo
  nl.a2.unit81.lesson06.teach.lotte_vraag:
    title: Lotte pregunta por la mañana
    gloss: 'Lotte: Hola, Noor, ¿cómo te ha ido la mañana?'
  nl.a2.unit81.lesson06.teach.noor_eerst:
    title: Noor cuenta el primer problema
    gloss: 'Noor: No muy bien. Primero me levanté demasiado tarde.'
  nl.a2.unit81.lesson06.teach.lotte_daarna:
    title: Lotte pregunta qué pasó después
    gloss: 'Lotte: ¡Ay, no! ¿Y después?'
  nl.a2.unit81.lesson06.teach.noor_tas:
    title: Noor cuenta los siguientes pasos
    gloss: 'Noor: Después me vestí rápido, pero no me llevé el bolso.'
  nl.a2.unit81.lesson06.teach.lotte_reis:
    title: Lotte pregunta por el transporte
    gloss: 'Lotte: ¿Cómo fuiste al trabajo?'
  nl.a2.unit81.lesson06.teach.noor_aankomst:
    title: Noor termina su relato
    gloss: 'Noor: Me subí al autobús. Al final llegué a tiempo de todos modos.'
  nl.a2.unit81.lesson06.teach.vraag:
    title: Una pregunta
    gloss: la pregunta
    note: '*Een vraag stellen* significa hacer una pregunta.'
    example_gloss: Lotte hace una pregunta sobre la mañana.
