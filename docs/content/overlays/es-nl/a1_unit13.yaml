teaching:
  nl.a1.unit13.lesson01.teach.lekker_vinden:
    title: Lekker vinden para comida y bebida
    gloss: Para hablar de comida y bebida, el neerlandés suele usar lekker vinden.
    note: En neerlandés no hay una única expresión equivalente a «gustar». Para un sabor se dice *Ik vind ... lekker*, es decir, literalmente «lo encuentro rico».
  nl.a1.unit13.lesson01.teach.koffie:
    title: Que te guste el café
    gloss: Me gusta el café.
    note: La comida o la bebida va entre *vind* y *lekker*.
  nl.a1.unit13.lesson01.teach.thee:
    title: Que no te guste el té
    gloss: No me gusta el té.
    note: Pon *niet* delante de *lekker* para rechazar el sabor.
  nl.a1.unit13.lesson01.teach.question:
    title: Preguntar por un sabor
    gloss: ¿Te gusta la sopa de tomate?
    note: En la pregunta informal, *vind* va antes de *je*. Seguimos con el registro *jij/je* del curso.
  nl.a1.unit13.lesson02.teach.leuk_vinden:
    title: Leuk vinden para actividades
    gloss: 'Con las actividades, el neerlandés suele usar leuk vinden: me gusta ir en bici.'
    note: Usa *leuk*, no *lekker*, para una actividad como ir en bici.
  nl.a1.unit13.lesson02.teach.walking:
    title: Que te guste caminar
    gloss: Me gusta caminar.
    note: La actividad *wandelen* va entre *vind* y *leuk*.
  nl.a1.unit13.lesson02.teach.dislike:
    title: Que no te guste ir de compras
    gloss: No me gusta ir de compras.
    note: '*Niet* va delante de *leuk*.'
  nl.a1.unit13.lesson02.teach.activity_question:
    title: Preguntar por actividades
    gloss: ¿Qué te gusta hacer?
    note: '*Wat vind je leuk om te doen?* es una pregunta general y natural sobre las actividades preferidas de alguien.'
  nl.a1.unit13.lesson03.teach.strong_like:
    title: Un gusto más fuerte o general
    gloss: Houden van expresa un gusto fuerte o general.
    note: Úsalo con moderación. Las reacciones habituales ante una comida o una actividad concretas se expresan de forma más natural con *lekker vinden* o *leuk vinden*.
  nl.a1.unit13.lesson03.teach.music:
    title: Que te encante la música
    gloss: Me encanta la música / Me gusta muchísimo la música.
    note: '*Houd* es la forma de *ik* de *houden*; *van* va detrás.'
  nl.a1.unit13.lesson03.teach.films:
    title: Que no te gusten las películas
    gloss: No me gustan las películas.
    note: En la forma negativa, *niet* va entre *houd* y *van*.
  nl.a1.unit13.lesson03.teach.contrast:
    title: Elegir la expresión natural
    gloss: 'Para un sabor corriente, di también: me gusta el café. Para una actividad: me gusta caminar.'
    note: No traduzcas siempre «gustar» con *houden van*.
  nl.a1.unit13.lesson04.teach.choice_question:
    title: Ofrecer dos opciones
    gloss: ¿Quieres café o té?
    note: '*Wil je ... of ...?* pide a la otra persona que elija.'
  nl.a1.unit13.lesson04.teach.want_prefer:
    title: Decir qué prefieres
    gloss: Prefiero té.
    note: En este patrón habitual de elección, *liever* va después de *wil*.
  nl.a1.unit13.lesson04.teach.have_prefer:
    title: Preferir un objeto
    gloss: Prefiero el jersey azul.
    note: '*Ik heb liever ...* también es natural al elegir un objeto en lugar de otro.'
  nl.a1.unit13.lesson04.teach.liever_note:
    title: Liever marca la opción preferida
    gloss: Liever muestra que eliges una opción en lugar de otra.
    note: La comparación puede quedar implícita cuando las dos opciones están claras por la conversación.
  nl.a1.unit13.lesson05.teach.message:
    title: Leer varias preferencias
    gloss: 'Hola, Lotte: me gusta la película, pero a Omar no le gustan las películas. Prefiere ir al parque. A mí también me gusta caminar.'
    note: Fíjate en a quién le gusta la película, quién rechaza las películas y qué alternativa elige Omar.
    glosses:
      Hoi: hola
      vind: gustar / encontrar
      film: película
      leuk: agradable / divertido
      maar: pero
      houdt: le gusta (houdt van = le gusta)
      films: películas
      wil: quiere
      liever: antes / prefiere
      park: parque
      wandelen: caminar
  nl.a1.unit13.lesson06.teach.food_question:
    title: Lotte ofrece dos comidas
    gloss: 'Lotte: ¿Qué quieres comer, Omar? ¿Quieres pan o sopa de tomate?'
    note: La segunda pregunta ofrece las dos opciones.
  nl.a1.unit13.lesson06.teach.omar_choice:
    title: Omar elige la sopa
    gloss: 'Omar: Prefiero la sopa de tomate. Me gusta la sopa de tomate. ¿Y tú?'
    note: Omar primero elige con *liever* y luego lo explica como una cuestión de gusto con *lekker*.
  nl.a1.unit13.lesson06.teach.lotte_choice:
    title: Lotte elige pan
    gloss: 'Lotte: Prefiero el pan. La sopa de tomate no me gusta mucho.'
    note: '*Niet zo lekker* suaviza la negación y es natural en una conversación amistosa.'
  nl.a1.unit13.lesson06.teach.activity:
    title: Elegir qué hacer después
    gloss: 'Omar: ¿Qué quieres hacer después de comer? Lotte: Me gusta pasear.'
    note: '*Leuk* describe la actividad *wandelen*.'
  nl.a1.unit13.lesson06.teach.plan:
    title: Comparten una preferencia
    gloss: 'Omar: Yo también. Me encanta pasear. ¿Vamos al parque? Lotte: Buena idea.'
    note: Esto retoma el lenguaje informal para hacer planes de la unidad 11.
