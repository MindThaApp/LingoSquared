course:
  title: Neerlandés A2
  description: Neerlandés A2 basado en la gramática para hablar de normas y permisos.
  learning_goal: Pregunta si algo está permitido y expresa lo que hay que hacer o no hace falta hacer con mogen, moeten y hoeven niet te.
units:
  nl.a2.unit87.wat_mag_en_moet:
    title: Lo que está permitido y lo que es obligatorio
    description: Pide permiso y expresa normas de la casa con mogen, moeten y hoeven niet te.
lessons:
  nl.a2.unit87.lesson01.mag_dat:
    title: ¿Está permitido?
  nl.a2.unit87.lesson02.dat_moet:
    title: Eso es obligatorio
  nl.a2.unit87.lesson03.hoeven_niet_te:
    title: Eso no es necesario
  nl.a2.unit87.lesson04.zwembad_en_sportschool:
    title: Piscina y gimnasio
  nl.a2.unit87.lesson05.huisregels_bibliotheek:
    title: Normas de la casa en la biblioteca
  nl.a2.unit87.lesson06.lotte_en_omar:
    title: Lotte y Omar en el gimnasio
teaching:
  nl.a2.unit87.lesson01.teach.plekken:
    title: Lugares con normas
    gloss: la biblioteca / la piscina / el gimnasio
    note: Son tres lugares en los que las normas importan.
    example_gloss:
    - Leo un libro en la biblioteca.
    - Noor nada en la piscina.
    - Omar está en el gimnasio.
  nl.a2.unit87.lesson01.teach.handelingen:
    title: Cosas que puedes o no puedes hacer
    gloss: nadar / comer / llamar / fumar / tomar prestado
    note: Los verbos neerlandeses terminan en -en en infinitivo. El infinitivo es la forma que irá al final de la frase.
    example_gloss:
    - Quiero nadar en la piscina.
    - Lotte quiere comerse un bocadillo.
    - Noor llama a Omar.
    - Omar no fuma.
    - Tomo prestado un libro.
  nl.a2.unit87.lesson01.teach.plaatsen:
    title: Aquí, dentro, fuera
    gloss: aquí / dentro / fuera
    note: Las normas suelen depender del lugar.
    example_gloss:
    - Estoy aquí.
    - Dentro hace calor.
    - Fuera está lloviendo.
  nl.a2.unit87.lesson01.teach.gn_mogen:
    title: 'Mogen: estar permitido, poder'
    gloss: yo puedo / tú puedes / él puede / nosotros podemos / vosotros podéis / ellos pueden
    note: '*Mogen* significa tener permiso para algo. Todas las formas del singular son *mag*: *ik mag, jij mag, je mag, hij mag*. El plural es *mogen*.'
  nl.a2.unit87.lesson01.teach.gn_tweede_plaats:
    title: El modal en segunda posición, el infinitivo al final
    gloss: Puedo nadar aquí. ¿Puedo nadar aquí?
    note: 'En una afirmación, el verbo modal va en segunda posición y el infinitivo va al final de todo: *Ik mag hier zwemmen.* En una pregunta de sí o no, el modal va primero, pero el infinitivo sigue al final: *Mag ik hier zwemmen?*'
  nl.a2.unit87.lesson01.teach.antwoorden:
    title: Respuestas cortas
    gloss: Sí, está permitido. No, no está permitido.
  nl.a2.unit87.lesson01.teach.vragen:
    title: Pedir permiso
    gloss: ¿Puedo comer aquí? ¿Puedo llamar por teléfono aquí? ¿Puedo fumar aquí?
  nl.a2.unit87.lesson02.teach.regels:
    title: Normas y tarjetas
    gloss: la regla / las normas de la casa / la tarjeta
    note: '*Huisregels* es plural: nombra todas las normas de un edificio.'
    example_gloss:
    - Eso es una regla.
    - Lee las normas de la casa.
    - Tengo mi tarjeta.
  nl.a2.unit87.lesson02.teach.handeling2:
    title: Cosas que tienes que hacer
    gloss: pagar / mostrar / ducharse
    note: '*Laten zien* son dos palabras. Juntas significan mostrar.'
    example_gloss:
    - Omar paga con su tarjeta.
    - Voy a mostrar mi tarjeta.
    - Lotte quiere ducharse primero.
  nl.a2.unit87.lesson02.teach.afval:
    title: Separación de residuos
    gloss: los residuos / separar (clasificar)
    note: En los Países Bajos los residuos se separan en vidrio, papel y plástico.
    example_gloss:
    - Separamos los residuos.
    - Tienes que separar el vidrio, el papel y el plástico.
  nl.a2.unit87.lesson02.teach.materialen:
    title: Materiales
    gloss: el papel / el vidrio / el plástico
    note: Los residuos se separan según el material.
    example_gloss:
    - Esto es papel.
    - Esto es vidrio.
    - Esto es plástico.
  nl.a2.unit87.lesson02.teach.gn_moeten:
    title: 'Moeten: tener que'
    gloss: yo tengo que / tú tienes que / él tiene que / nosotros tenemos que / vosotros tenéis que / ellos tienen que
    note: '*Moeten* significa «tener que». Todas las formas del singular son *moet*: *ik moet, jij moet, je moet, hij moet*. El plural es *moeten*.'
  nl.a2.unit87.lesson02.teach.gn_moeten_zin:
    title: Moeten funciona como mogen
    gloss: Tienes que enseñar tu carné. ¿Tengo que pagar?
    note: '*Moeten* se comporta como *mogen*: en una oración enunciativa ocupa la segunda posición (después del primer elemento de la oración), encabeza las preguntas de sí o no y el infinitivo va al final. Con *laten zien* las dos palabras permanecen juntas al final.'
  nl.a2.unit87.lesson02.teach.zinnen:
    title: Dos reglas
    gloss: Tengo que enseñar mi carné. Tenemos que separar los residuos.
  nl.a2.unit87.lesson03.teach.tijd:
    title: Hoy, ahora, siempre
    gloss: hoy / ahora / siempre
    note: Estas palabras aparecen a menudo en las normas.
    example_gloss:
    - La piscina está abierta hoy.
    - Ahora estoy en el gimnasio.
    - Omar siempre llega puntual.
  nl.a2.unit87.lesson03.teach.gn_hoeven:
    title: 'Hoeven: no hacer falta'
    gloss: yo no necesito / tú no necesitas / él no necesita / nosotros no necesitamos / vosotros no necesitáis / ellos no necesitan
    note: '*Hoeven* se usa normalmente con *niet* o *geen* y *te* + infinitivo. Significa que algo no es necesario. Las formas son *ik hoef, jij hoeft, hij hoeft, wij hoeven*. Después de *jij* en una pregunta se pierde la -t: *hoef jij*.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_niet_te:
    title: Hoeven niet te + infinitivo
    gloss: No tienes que pagar. ¿Hoy no tengo que pagar?
    note: 'Usa *niet te* justo antes del infinitivo: *Je hoeft niet te betalen.* El verbo modal *hoeft* va en segunda posición; *te* + infinitivo va al final.'
  nl.a2.unit87.lesson03.teach.gn_hoeven_geen:
    title: Niet o geen
    gloss: No tienes que enseñar tu carné. No tienes que enseñar ningún carné.
    note: 'Con un complemento determinado, como *je kaart*, *niet* va detrás del complemento: *Je hoeft je kaart niet te laten zien.* Con un sustantivo indeterminado se usa *geen*: *Je hoeft geen kaart te laten zien.* *Te* va delante de *laten zien*.'
  nl.a2.unit87.lesson03.teach.gn_contrast:
    title: Obligatorio, opcional, prohibido
    gloss: Eso es obligatorio. Eso no es necesario. Eso no está permitido. Eso está permitido.
    note: '*Dat moet* = obligatorio. *Dat hoeft niet* = no es necesario, puedes elegir. *Dat mag niet* = prohibido. Para decir que algo está prohibido, usa *mag niet*, no *hoeft niet*.'
  nl.a2.unit87.lesson04.teach.kleedkamer:
    title: Palabras de la piscina y el gimnasio
    gloss: la toalla / el vestuario / primero
    note: '*Eerst* significa «primero» y suele acompañar a una norma.'
    example_gloss:
    - Mi toalla está en el vestuario.
    - Primero ducharse, luego nadar.
    - Lotte llega primero al gimnasio.
  nl.a2.unit87.lesson04.teach.gn_voorop:
    title: Otra palabra al principio
    gloss: Aquí no se puede comer. En la piscina primero tienes que ducharte.
    note: 'Puedes empezar la oración con una palabra de lugar. El verbo modal sigue en segunda posición, así que el sujeto va después: *Hier mag je niet eten.* El infinitivo sigue yendo al final.'
  nl.a2.unit87.lesson04.teach.gn_vraagwoord:
    title: Palabras interrogativas
    gloss: ¿Qué tengo que hacer? ¿Dónde puedo comer?
    note: 'La palabra interrogativa va primero. Después va el verbo modal, luego el sujeto, y el infinitivo va al final: *Wat moet ik doen?* *Waar mag ik eten?*'
  nl.a2.unit87.lesson04.teach.scenario:
    title: En la piscina
    gloss: ¿Puedo nadar aquí? Sí, primero tienes que ducharte.
  nl.a2.unit87.lesson05.teach.nieuw:
    title: Nuevo, tres, venir
    gloss: nuevo / tres / venir
    note: 'Después de *de* o *het* el adjetivo lleva -e: *nieuw* pasa a *nieuwe* en *de nieuwe bibliotheek*. *Boeken* es el plural de *boek*.'
    example_gloss:
    - La biblioteca nueva es agradable.
    - Me llevo prestados tres libros.
    - ¿Vienes tú también?
  nl.a2.unit87.lesson05.teach.reading:
    title: Un mensaje para Lotte
    gloss: Hola, Lotte, estoy en la biblioteca nueva. Tienes que enseñar tu carné. Puedes llevarte prestados tres libros. Aquí no se puede comer ni hablar por teléfono. No tienes que pagar. ¿Vienes tú también?
    note: Busca qué es obligatorio, qué está permitido, qué está prohibido y qué no es necesario.
    glosses:
      nieuwe: nuevo
      drie: tres
      boeken: libros
      lenen: tomar prestado
      betalen: pagar
  nl.a2.unit87.lesson06.teach.lotte_vraag:
    title: Lotte pregunta
    gloss: 'Lotte: Hola, Omar, soy nueva en el gimnasio. ¿Qué tengo que hacer?'
  nl.a2.unit87.lesson06.teach.omar_kaart:
    title: Omar dice la primera norma
    gloss: 'Omar: Primero tienes que enseñar tu carné.'
  nl.a2.unit87.lesson06.teach.lotte_bellen:
    title: Lotte pide permiso
    gloss: 'Lotte: ¿Puedo hablar por teléfono aquí?'
  nl.a2.unit87.lesson06.teach.omar_buiten:
    title: Omar dice que no
    gloss: 'Omar: No, eso no está permitido. Tienes que llamar fuera.'
  nl.a2.unit87.lesson06.teach.lotte_betalen:
    title: Lotte pregunta por el pago
    gloss: 'Lotte: ¿Tengo que pagar hoy?'
  nl.a2.unit87.lesson06.teach.omar_hoeft:
    title: Omar responde
    gloss: 'Omar: No, hoy no tienes que pagar.'
