teaching:
  nl.a1.unit22.lesson01.teach.bellen:
    title: Llamar
    gloss: llamar
    note: El infinitivo del verbo para hacer una llamada telefónica.
    example_gloss: Tengo que llamarte.
  nl.a1.unit22.lesson01.teach.ik_bel_je:
    title: Decir que vas a llamar
    gloss: Te llamo.
    note: '*Bel* es la forma de ik de *bellen*; aquí el neerlandés usa el presente, igual que el español en «te llamo».'
  nl.a1.unit22.lesson01.teach.met_lotte:
    title: Contestar al teléfono
    gloss: Hola, soy Lotte.
    note: '*Met* + nombre (literalmente «con nombre») es la forma estándar en neerlandés de identificarse por teléfono; en español se dice «soy…» o «habla…».'
  nl.a1.unit22.lesson01.teach.met_omar:
    title: Omar contesta igual
    gloss: Hola, soy Omar.
    note: Es el mismo patrón *met* + nombre que en *Hallo, met Lotte*.
  nl.a1.unit22.lesson02.teach.met_wie:
    title: Preguntar quién llama
    gloss: ¿Con quién hablo?
    note: '*Met wie spreek ik?* es la fórmula formal para dirigirse a alguien desconocido que llama.'
  nl.a1.unit22.lesson02.teach.u_spreekt_met:
    title: Identificarse de manera formal
    gloss: Habla con Lotte.
    note: '*U spreekt met* + nombre es la versión formal de *met* + nombre, que es informal.'
  nl.a1.unit22.lesson03.teach.kun_je_herhalen:
    title: Pedir que repitan
    gloss: ¿Puedes repetirlo?
    note: '*Kun je* ...? (¿Puedes ...?) más *herhalen* (repetir) y *dat* (eso).'
  nl.a1.unit22.lesson03.teach.spreek_niet_snel:
    title: Pedir a alguien que vaya más despacio
    gloss: No hables tan rápido, por favor.
    note: '*Niet zo* + adjetivo niega el grado, no el verbo: no tan rápido, no «no hables».'
  nl.a1.unit22.lesson03.teach.hoor_niet_goed:
    title: Decir que no oyes bien
    gloss: No te oigo bien.
    note: '*Horen* (oír) con *niet goed* (no bien) indica un problema para oír, distinto de *verstaan* (entender).'
  nl.a1.unit22.lesson04.teach.sms:
    title: Mensaje de texto
    gloss: el mensaje de texto
    note: 'Es un sustantivo de género común: *de sms*, abreviatura de uso internacional.'
    example_gloss: El mensaje de texto es de Lotte.
  nl.a1.unit22.lesson04.teach.stuur_sms:
    title: Decir que vas a enviar un mensaje
    gloss: Te envío un mensaje.
    note: '*Sturen* (enviar) lleva el complemento indirecto (*je*) antes del directo (*een sms*).'
  nl.a1.unit22.lesson04.teach.bel_later_terug:
    title: Decir que volverás a llamar
    gloss: Te vuelvo a llamar más tarde.
    note: '*Terug* (de vuelta) es una partícula separable que va al final de la frase; *bellen* + *terug* significa «devolver la llamada».'
  nl.a1.unit22.lesson05.teach.sms_gesprek:
    title: Lee una conversación por mensajes
    gloss: 'Omar: Hola, Lotte, ¿puedes llamarme? Tengo que contarte algo. Lotte: Sí, claro, te devuelvo la llamada en cinco minutos.'
    note: Fíjate en qué pide Omar, por qué lo pide y cuándo dice Lotte que volverá a llamar.
    glosses:
      Hoi: hola
      kun: puedes
      bellen: llamar
      moet: deber / tener que
      iets: algo
      vertellen: decir
      natuurlijk: claro
      bel: llamar
      vijf: cinco
      minuten: minutos
      terug: de vuelta
  nl.a1.unit22.lesson06.teach.lotte_open_call:
    title: Omar contesta la llamada
    gloss: 'Omar: Hola, soy Omar.'
    note: 'Es el mismo patrón *met* + nombre de antes, ahora en una llamada real: quien contesta habla primero y dice su nombre.'
  nl.a1.unit22.lesson06.teach.omar_answer_glad:
    title: Lotte se presenta
    gloss: 'Lotte: Hola, Omar, soy Lotte. Omar: ¡Qué bien que llames!'
    note: '*Fijn dat* ... (qué bien que ...) expresa una reacción positiva ante algo que ocurre.'
  nl.a1.unit22.lesson06.teach.lotte_ask_shift:
    title: Lotte pregunta por el turno
    gloss: 'Lotte: ¿Cómo fue tu primer turno?'
    note: '*Was* es el pretérito simple (imperfecto) de *zijn*, una construcción distinta del pretérito perfecto (hebben/zijn + participio, p. ej. *Ik heb gewerkt*) que se vio en la Unidad 12; mira la nota que aparece justo después de la siguiente línea.'
  nl.a1.unit22.lesson06.teach.omar_report_good:
    title: Omar cuenta buenas noticias
    gloss: 'Omar: Salió muy bien, mejor de lo que pensaba.'
    note: '*Ging* es el pasado simple de *gaan* (ir; aquí con el sentido de «salir, resultar»); *dacht* es el pasado simple de *denken* (pensar).'
  nl.a1.unit22.lesson06.teach.simple_past_note:
    title: Was, ging, dacht son formas del pasado simple
    gloss: was → ser/estar, ging → ir, dacht → pensar
    note: '*Was*, *ging* y *dacht* son formas irregulares del pasado simple (verleden tijd), un patrón distinto del pretérito perfecto de la Unidad 12 (hebben/zijn + participio) y que aún no se estudia formalmente. Por ahora, memoriza was/ging/dacht como expresiones fijas en los contextos en que aparecen en esta lección; las reglas completas de conjugación del pasado simple llegarán en un nivel posterior.'
  nl.a1.unit22.lesson06.teach.lotte_proud:
    title: Lotte está orgullosa
    gloss: 'Lotte: ¡Qué bueno oír eso! Estoy orgullosa de ti.'
    note: '*Trots op* (orgulloso de) es una combinación fija; se usa *op*, no *van*.'
  nl.a1.unit22.lesson06.teach.omar_thanks_means:
    title: Omar está emocionado
    gloss: 'Omar: Muchas gracias, eso significa mucho para mí.'
    note: '*Betekent* es la forma de tercera persona de *betekenen* (significar); *voor me* (para mí) expresa para quién es importante.'
  nl.a1.unit22.lesson06.teach.zijn_possessive:
    title: Su
    gloss: Su primer turno salió muy bien.
    note: Aquí *Zijn* es el posesivo «su» (de él), no el verbo «ser»; el contexto distingue las dos palabras, que se escriben igual.
