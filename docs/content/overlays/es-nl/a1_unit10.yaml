teaching:
  nl.a1.unit10.lesson01.teach.opstaan:
    title: Levantarse
    gloss: levantarse → me levanto
    note: '*Opstaan* se separa en una oración principal: *Ik sta op*. El prefijo *op* pasa al final.'
  nl.a1.unit10.lesson01.teach.aankleden:
    title: Vestirse
    gloss: vestirse → me visto
    note: '*Zich aankleden* es reflexivo y separable. Con *ik* se usa *me* y *aan* pasa al final: *Ik kleed me aan*.'
  nl.a1.unit10.lesson01.teach.ontbijten:
    title: Desayunar
    gloss: desayunar → desayuno
    note: '*Ontbijten* no se separa: *Ik ontbijt*.'
  nl.a1.unit10.lesson01.teach.werken:
    title: El trabajo
    gloss: trabajar → trabajo
    note: '*Werken* no se separa: *Ik werk*.'
  nl.a1.unit10.lesson01.teach.eten:
    title: Comer
    gloss: comer → como
    note: 'La forma de *ik* de *eten* es *eet*: *Ik eet*.'
  nl.a1.unit10.lesson01.teach.afwassen:
    title: Lavar los platos
    gloss: lavar los platos → lavo los platos
    note: '*Afwassen* se separa: *Ik was af*. El prefijo *af* pasa al final.'
  nl.a1.unit10.lesson01.teach.slapen:
    title: Dormir
    gloss: dormir → duermo
    note: '*Slapen* no se separa. Su forma con *ik* tiene vocal larga: *Ik slaap*.'
  nl.a1.unit10.lesson02.teach.split_rule:
    title: El patrón de separación
    gloss: 'En una oración principal normal, la primera parte pasa al final: opstaan → Ik sta op.'
    note: No digas *Ik opsta*. Conjuga el verbo base y coloca el prefijo corto al final de la oración principal.
  nl.a1.unit10.lesson02.teach.opstaan_split:
    title: Opstaan en una frase
    gloss: 'levantarse: me levanto a las siete.'
    note: La expresión de hora va entre *sta* y el prefijo final *op*.
  nl.a1.unit10.lesson02.teach.aankleden_split:
    title: Aankleden en una frase
    gloss: 'vestirse: me visto.'
    note: El patrón es *Ik* + *kleed* + *me* + *aan*. *Aan* se queda al final.
  nl.a1.unit10.lesson02.teach.afwassen_split:
    title: Afwassen en una frase
    gloss: 'lavar los platos: lavo los platos después de comer.'
    note: '*Na het eten* va entre *was* y el prefijo final *af*.'
  nl.a1.unit10.lesson02.teach.contrast:
    title: Verbos que no se separan
    gloss: 'No separables: desayuno. Trabajo. Duermo. No va ninguna parte al final.'
    note: '*Ontbijten*, *werken* y *slapen* se mantienen como una sola forma verbal en estas oraciones principales.'
  nl.a1.unit10.lesson03.teach.get_up_time:
    title: Levantarse a las siete y media
    gloss: Me levanto a las 7:30.
    note: 'Recuerda cómo se dice la hora en neerlandés: *half acht* significa «media hora hacia las ocho», es decir, 07:30. En español se dice «siete y media», pero en neerlandés se cuenta hacia la hora siguiente. *Op* se queda al final.'
  nl.a1.unit10.lesson03.teach.dress_time:
    title: Vestirse a las ocho menos cuarto
    gloss: Me visto a las 7:45.
    note: La hora va antes del prefijo separable final *aan*.
  nl.a1.unit10.lesson03.teach.breakfast_time:
    title: Desayunar a las ocho
    gloss: Desayuno a las ocho.
    note: Usa *om* delante de la hora. *Ontbijt* no se separa.
  nl.a1.unit10.lesson03.teach.work_time:
    title: Trabajar de nueve a cinco
    gloss: Trabajo de las nueve a las cinco.
    note: '*Van ... tot ...* indica la hora de inicio y la de fin.'
  nl.a1.unit10.lesson03.teach.eat_time:
    title: Comer a las seis y media
    gloss: Ceno a las 18:30.
    note: '*''s Avonds* deja clara la tarde-noche, así que *half zeven* son aquí las 18:30.'
  nl.a1.unit10.lesson03.teach.sleep_time:
    title: Dormir a las once
    gloss: Me duermo a las once.
    note: 'Usa *om* delante de la hora: *om elf uur*.'
  nl.a1.unit10.lesson04.teach.eerst_dan_daarna:
    title: Primero, luego, después
    gloss: primero, luego, después
    note: '*Eerst* marca la primera actividad, *dan* pasa a la siguiente y *daarna* enlaza con lo anterior.'
    example_gloss:
    - Primero me levanto.
    - Luego me visto.
    - Después desayuno.
  nl.a1.unit10.lesson04.teach.sequence:
    title: Una mañana en tres pasos
    gloss: Primero me levanto. Luego me visto. Después desayuno.
    note: 'Los prefijos separables siguen cerrando sus oraciones: *sta ik op*; *kleed ik me aan*.'
  nl.a1.unit10.lesson04.teach.sequence_order_note:
    title: El verbo antes de ik
    gloss: 'Después de eerst, dan y daarna, el verbo va antes de ik: Daarna ontbijt ik.'
    note: Si empiezas con una palabra de secuencia, *Ik ontbijt* pasa a ser *Daarna ontbijt ik*.
  nl.a1.unit10.lesson05.teach.routine_text:
    title: Mi día
    gloss: Mi día — Me levanto a las 7:30. Después me visto y a las ocho desayuno. Trabajo de nueve a cinco. A las 18:30 ceno. Después lavo los platos. A las once me duermo.
    note: Lee fijándote tanto en el orden de las actividades como en sus horas. Observa *op*, *aan* y *af* al final en las oraciones con verbos separables.
    glosses:
      Mijn: mi
      dag: día
      sta: levantarse (con op)
      half: media hora HACIA la hora siguiente (half acht = 7:30)
      acht: ocho
      Daarna: después
      kleed: vestirse (con me ... aan)
      uur: en punto / hora
      ontbijt: desayunar
      werk: trabajo
      negen: nueve
      vijf: cinco
      zeven: siete
      avonds: por la tarde-noche
      eet: comer
      was: lavar los platos
      elf: once
      slaap: dormir
  nl.a1.unit10.lesson06.teach.question:
    title: Preguntar por el día
    gloss: 'Lotte: ¿Cómo es tu día, Omar?'
    note: '*Hoe ziet jouw dag eruit?* es una forma informal de invitar a alguien a describir su día. *Eruitzien* es separable: *ziet ... eruit*.'
  nl.a1.unit10.lesson06.teach.morning:
    title: La mañana de Omar
    gloss: 'Omar: Me levanto a las siete y media. Después me visto y a las ocho desayuno.'
    note: Omar enlaza tres actividades de la mañana y mantiene *op* y *aan* al final de sus oraciones.
  nl.a1.unit10.lesson06.teach.work:
    title: La jornada de trabajo de Omar
    gloss: 'Lotte: ¿Cuándo trabajas? Omar: Trabajo de nueve a cinco.'
    note: Lotte y Omar se tratan de forma informal con *je*.
  nl.a1.unit10.lesson06.teach.evening:
    title: La noche de Omar
    gloss: 'Omar: A las seis y media de la tarde ceno. Después lavo los platos. A las once duermo.'
    note: 'Si la oración empieza con una hora o con *daarna*, el verbo va antes de *ik*: *eet ik*, *was ik*, *slaap ik*. *Af* se queda al final.'
  nl.a1.unit10.lesson06.teach.lotte:
    title: La mañana de Lotte
    gloss: 'Lotte: Me levanto a las seis, pero no desayuno hasta las seis y media.'
    note: Aquí *pas* significa «no hasta». Lotte contrasta la hora de levantarse con la hora del desayuno.
