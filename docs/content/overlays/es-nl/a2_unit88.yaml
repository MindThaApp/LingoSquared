course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para hablar de capacidad y posibilidad.
  learning_goal: Di lo que puedes o no puedes hacer y lo que podría pasar, usando kunnen, cadenas de verbos modales y misschien.
units:
  nl.a2.unit88.wat_kan_ik:
    title: ¿Qué puedo hacer?
    description: Di lo que puedes y no puedes hacer, combina verbos modales y habla de lo que podría pasar.
lessons:
  nl.a2.unit88.lesson01.dit_kan_ik:
    title: Esto es lo que sé hacer
  nl.a2.unit88.lesson02.kun_je_dat:
    title: ¿Puedes hacer eso?
  nl.a2.unit88.lesson03.kunnen_willen_moeten:
    title: Poder, querer, deber
  nl.a2.unit88.lesson04.twee_werkwoorden:
    title: Dos verbos seguidos
  nl.a2.unit88.lesson05.misschien_kan_het:
    title: Quizás sea posible
  nl.a2.unit88.lesson06.lotte_en_omar:
    title: Lotte y Omar hacen un plan
teaching:
  nl.a2.unit88.lesson01.teach.vaardigheden:
    title: Habilidades
    gloss: cocinar / nadar / montar en bici / dibujar / cantar / tocar la guitarra
    note: Estos infinitivos nombran cosas que sabes hacer. Todos terminan en -en.
    example_gloss:
    - Omar sabe cocinar bien.
    - Lotte sabe montar en bici.
    - Noor sabe cantar.
  nl.a2.unit88.lesson01.teach.kleine_woorden:
    title: Palabras pequeñas
    gloss: yo / tú / tú / él / ella / nosotros / vosotros / también / no / bien / muy / un poco
    note: Estas palabras pequeñas aparecen en todas las lecciones. *Jij* y *je* significan ambas «tú»; *je* es la forma átona.
    example_gloss:
    - No sé cantar.
    - Montas en bici muy bien.
    - Nosotros también sabemos cocinar.
    - Él sabe dibujar un poco.
  nl.a2.unit88.lesson01.teach.vrienden:
    title: Tres amigos
    gloss: Lotte / Omar / Noor
    note: Los amigos de este curso aparecen a lo largo de toda la unidad.
    example_gloss:
    - Lotte, Omar y Noor son amigos.
  nl.a2.unit88.lesson01.teach.gn_kunnen:
    title: 'Kunnen: presente'
    gloss: yo puedo, tú puedes, él puede, ella puede, nosotros podemos, vosotros podéis, ellos pueden
    note: '*Kunnen* (poder, ser capaz de) es irregular. El singular es *ik kan*, *jij kunt*, *hij/zij kan*; el plural es siempre *kunnen*. En el habla cotidiana también es habitual *jij kan*. En una pregunta con inversión desaparece la -t: *kun je?*'
  nl.a2.unit88.lesson01.teach.gn_infinitief:
    title: El segundo verbo es un infinitivo al final
    gloss: Sé cocinar. Cocino bien. No sé nadar.
    note: Después de *kunnen*, el segundo verbo va en infinitivo y se coloca al final de la oración. Palabras como *goed* y *niet* van antes.
  nl.a2.unit88.lesson01.teach.zinnen:
    title: Tres frases
    gloss: Omar cocina bien. Toco un poco la guitarra. No sabemos cantar.
  nl.a2.unit88.lesson02.teach.meer_vaardigheden:
    title: Idiomas y tecnología
    gloss: hablar inglés / escribir a máquina / reparar un ordenador
    note: Más cosas que sabes o no sabes hacer. *Snel* significa «rápido».
    example_gloss:
    - ¿Puedes hablar inglés?
    - ¿Escribes rápido a máquina?
    - Sé reparar un ordenador.
  nl.a2.unit88.lesson02.teach.scheidbaar:
    title: Verbos separables útiles
    gloss: recoger / devolver la llamada / traer (consigo)
    note: Estos verbos tienen un prefijo separable (*op-, terug-, mee-*). *Me* es «me», y *je* también puede ser «te» como complemento.
    example_gloss:
    - Puedo ir a recogerte.
    - ¿Puedes devolverme la llamada?
    - Lotte puede traer la guitarra.
  nl.a2.unit88.lesson02.teach.antwoorden:
    title: Respuestas cortas
    gloss: Sí, es posible. No, eso no puedo hacerlo. Sí, eso sí puedo hacerlo.
    note: '*Wel* subraya que algo es posible: *Dat kan ik wel.*'
  nl.a2.unit88.lesson02.teach.gn_vraag:
    title: Preguntas con kunnen
    gloss: ¿Sabes cocinar? ¿Sabes cocinar tú? ¿Sabéis cocinar?
    note: 'En una pregunta de sí/no el verbo va primero. Con *je/jij* el verbo es *kun* (sin -t): *Kun je koken?* En el habla informal también es frecuente *Kan je koken?*'
  nl.a2.unit88.lesson02.teach.gn_scheidbaar:
    title: Verbo modal y verbo separable
    gloss: Puedo recogerte. ¿Puedes devolverme la llamada?
    note: 'Con un verbo modal, el verbo separable no se divide: permanece entero, como infinitivo al final. Sin modal el prefijo se separa (*Ik haal je op*); con modal el verbo queda entero: *Ik kan je ophalen*.'
  nl.a2.unit88.lesson03.teach.beschikbaar:
    title: Disponibilidad
    gloss: sábado / domingo / mañana / esta noche / tiempo / venir / trabajar
    note: Usa estas palabras para decir cuándo estás libre u ocupado. *Geen tijd* significa «sin tiempo».
    example_gloss:
    - El sábado no tengo tiempo.
    - ¿Puedes venir mañana?
    - Esta noche tengo que trabajar.
  nl.a2.unit88.lesson03.teach.verbinders:
    title: Dar una razón
    gloss: porque / porque / así que
    note: '*Want* y *omdat* dan una razón; *dus* da la consecuencia. Después de *want* y *dus* el orden de las palabras es normal (sujeto y luego verbo); después de *omdat* los verbos van al final de la oración.'
    example_gloss:
    - No puedo venir porque tengo que trabajar.
    - No puedo venir porque tengo que trabajar.
    - No tengo tiempo, así que no puedo venir.
  nl.a2.unit88.lesson03.teach.gn_drie_modalen:
    title: Tres verbos modales
    gloss: puedo, quiero, tengo que; podemos, queremos, tenemos que
    note: '*Kunnen, willen* y *moeten* funcionan igual: un modal conjugado en segunda posición y un infinitivo al final. Cada uno cambia el significado: capacidad o posibilidad, deseo, obligación.'
  nl.a2.unit88.lesson03.teach.gn_zonder_infinitief:
    title: Kunnen sin infinitivo
    gloss: El sábado no puedo. ¿Puedes el domingo? Sí, el domingo sí puedo.
    note: 'Cuando por el contexto está claro de qué verbo se trata (aquí *komen*), en neerlandés a menudo se omite el infinitivo, algo que también ocurre en español: *Ik kan zaterdag niet.*'
  nl.a2.unit88.lesson03.teach.zin_contrast:
    title: Querer frente a deber
    gloss: Quiero venir, pero tengo que trabajar.
    note: '*Maar* significa «pero».'
  nl.a2.unit88.lesson04.teach.plannen:
    title: Mejorar
    gloss: aprender / practicar / mejor / más / la semana que viene / más tarde / con gusto
    note: '*Graag* añade «con gusto» a *willen*: *Ik wil graag ...* = Me gustaría ...'
    example_gloss:
    - Me gustaría practicar más.
    - La semana que viene puedo venir.
    - Más adelante quiero cocinar mejor.
  nl.a2.unit88.lesson04.teach.gn_wil_kunnen:
    title: Wil kunnen
    gloss: Quiero saber nadar. Quiero poder cocinar mejor.
    note: 'Se pueden encadenar verbos modales. Solo el primero se conjuga y va en segunda posición (*wil*). Los demás son infinitivos al final, en este orden: primero el segundo modal y por último el verbo principal: *kunnen zwemmen*.'
  nl.a2.unit88.lesson04.teach.gn_zou_moeten:
    title: Zou moeten
    gloss: Deberías practicar más. Deberíamos practicar más.
    note: '*Zou moeten* sirve para dar consejos: «debería». *Zou* es el verbo conjugado (singular *zou*, plural *zouden*); *moeten* y el verbo principal van al final.'
  nl.a2.unit88.lesson04.teach.gn_zal_kunnen:
    title: Zal kunnen
    gloss: Podré venir el sábado. Podré recogerte. La semana que viene tendré que trabajar.
    note: '*Ik/hij/zij zal*; *jij zult* (también *jij zal*); *wij/jullie/zij zullen*. Este verbo señala el futuro. Después van dos infinitivos al final. Un verbo separable como *ophalen* permanece entero. *Jou* es la forma tónica de *je*: *Ik zal jou kunnen ophalen.*'
  nl.a2.unit88.lesson04.teach.zin_terugbellen:
    title: Cadena con un verbo separable
    gloss: Mañana podré devolverte la llamada.
  nl.a2.unit88.lesson05.teach.woorden:
    title: Palabras para la posibilidad
    gloss: quizás / saber / juntos / nosotros / hora / dos / a
    note: '*We* es la forma átona de *wij*. *Om twee uur* significa «a las dos».'
    example_gloss:
    - No lo sé.
    - Podemos cocinar juntos.
    - ¿Puedes venir a las dos?
  nl.a2.unit88.lesson05.teach.gn_misschien:
    title: Misschien
    gloss: Quizás pueda venir. Quizás pueda venir.
    note: '*Misschien* indica que algo es posible pero no seguro. Al principio de la oración provoca inversión (verbo antes del sujeto); después del verbo el orden sigue siendo normal.'
  nl.a2.unit88.lesson05.teach.gn_het_kan_zijn:
    title: Het kan zijn dat
    gloss: Puede que tenga que trabajar. Puede que llueva mañana.
    note: '*Het kan zijn dat ...* introduce una posibilidad. Después de *dat*, el grupo verbal va al final: *dat ik moet werken*; aquí *moet*, conjugado, va antes del infinitivo *werken*. *Kunnen* solo también puede expresar posibilidad: *Het kan regenen.*'
  nl.a2.unit88.lesson05.teach.reading:
    title: Noor escribe a Lotte
    gloss: 'Hola, Lotte: quizás el sábado no pueda venir. Puede que tenga que trabajar. El domingo lo sabré. Quizás podamos ir en bici juntas el domingo. A las dos me va bien. Un abrazo, Noor'
    note: Fíjate en cómo Noor mezcla certeza (*ik kan om twee uur*) y posibilidad (*misschien*, *het kan zijn dat*).
    glosses:
      misschien: quizás
      weet: saber
      samen: juntos
      uur: hora
  nl.a2.unit88.lesson06.teach.vraag:
    title: Lotte pregunta
    gloss: 'Lotte: Hola, Omar, ¿puedes venir el sábado?'
  nl.a2.unit88.lesson06.teach.antw:
    title: Omar no está seguro
    gloss: 'Omar: Todavía no lo sé. Puede que tenga que trabajar.'
  nl.a2.unit88.lesson06.teach.terugbellen:
    title: Lotte pide que le devuelvan la llamada
    gloss: 'Lotte: Entonces, ¿puedes devolverme la llamada?'
  nl.a2.unit88.lesson06.teach.ja_dat_kan:
    title: Omar está de acuerdo
    gloss: 'Omar: Sí, claro. Puedo devolverte la llamada mañana.'
  nl.a2.unit88.lesson06.teach.ophalen:
    title: Lotte pregunta por el domingo
    gloss: 'Lotte: ¡Genial! ¿Y puedes recogerme el domingo?'
  nl.a2.unit88.lesson06.teach.zondag:
    title: Omar propone una hora
    gloss: 'Omar: El domingo sí puedo. Puedo recogerte a las dos.'
