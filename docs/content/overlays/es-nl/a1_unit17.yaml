teaching:
  nl.a1.unit17.lesson01.teach.wat_doe_je:
    title: Preguntar por el trabajo de alguien
    gloss: ¿A qué te dedicas?
    note: Una forma habitual e informal de preguntar a qué se dedica alguien.
  nl.a1.unit17.lesson01.teach.beroep_kok:
    title: Profesión / cocinero
    gloss: la profesión; cocinero
    note: '*Het beroep* (la profesión) es un sustantivo neutro. *Kok* (cocinero/a) es un sustantivo de profesión que sirve para cualquier género: *een kok*, *de kok*.'
    example_gloss:
    - ¿Cuál es tu profesión?
    - Trabajo como cocinero.
  nl.a1.unit17.lesson01.teach.werk_als_kok:
    title: Decir que eres cocinero
    gloss: Trabajo como cocinero.
    note: '*Werken als* + profesión es el patrón habitual para decir a qué te dedicas; no se usa artículo delante de la profesión.'
  nl.a1.unit17.lesson01.teach.verpleegkundige:
    title: Enfermero
    gloss: enfermero
    note: El término habitual de esta profesión; se adapta según sea un hombre o una mujer.
    example_gloss: Trabajo como enfermero.
  nl.a1.unit17.lesson01.teach.werk_als_verpleegkundige:
    title: Decir que eres enfermero
    gloss: Trabajo como enfermero.
    note: Sigue el mismo patrón *werken als* que *kok*.
  nl.a1.unit17.lesson02.teach.waar_werk_je:
    title: Preguntar por el lugar de trabajo
    gloss: ¿Dónde trabajas?
    note: Es una pregunta natural a continuación de *Wat doe je voor werk?*
  nl.a1.unit17.lesson02.teach.werk_restaurant:
    title: Trabajar en un restaurante
    gloss: Trabajo en un restaurante.
    note: '*Een restaurant* lleva artículo indefinido porque es uno entre muchos restaurantes.'
  nl.a1.unit17.lesson02.teach.ziekenhuis:
    title: El hospital
    gloss: el hospital
    note: 'Es un sustantivo neutro: *het ziekenhuis*.'
    example_gloss: Trabajo en el hospital.
  nl.a1.unit17.lesson02.teach.werk_ziekenhuis:
    title: Trabajar en el hospital
    gloss: Trabajo en el hospital.
    note: '*Het ziekenhuis* lleva artículo determinado: en neerlandés se trata como una institución concreta y conocida, igual que en español decimos «en el hospital».'
  nl.a1.unit17.lesson02.teach.kantoor:
    title: Trabajar en una oficina
    gloss: Algunas personas trabajan en una oficina.
    note: '*Op kantoor* (en la oficina) es una expresión fija sin artículo, a diferencia de *in een restaurant* o *in het ziekenhuis*.'
  nl.a1.unit17.lesson03.teach.begin_negen:
    title: Hora de inicio
    gloss: Empiezo a las nueve.
    note: '*Begin* es la forma de ik de *beginnen* (empezar) y repite el patrón de la hora de la Unidad 4.'
  nl.a1.unit17.lesson03.teach.maandag_vrijdag:
    title: Días de trabajo
    gloss: Trabajo de lunes a viernes.
    note: '*Van... tot...* retoma el patrón de rango con días de la semana de la unidad 3.'
  nl.a1.unit17.lesson03.teach.pauze:
    title: El descanso
    gloss: el descanso
    note: 'Es un sustantivo de género común: *de pauze*.'
    example_gloss: Tengo un descanso a las doce.
  nl.a1.unit17.lesson03.teach.heb_pauze:
    title: Tener un descanso
    gloss: Tengo un descanso a las doce.
    note: '*Pauze hebben* (tener un descanso) es el patrón fijo natural.'
  nl.a1.unit17.lesson03.teach.stop_vijf:
    title: Hora de salida
    gloss: Termino a las cinco.
    note: '*Stop* es la forma de ik de *stoppen* (parar, terminar).'
  nl.a1.unit17.lesson03.teach.begin_en_stop:
    title: Una jornada completa
    gloss: Empiezo a las nueve y termino a las cinco.
    note: Une *begin* y *stop* con *en* en una sola frase que describe toda la jornada laboral.
  nl.a1.unit17.lesson04.teach.third_person_rule:
    title: Terminaciones verbales de la tercera persona
    gloss: 'Con «él» o «ella», el verbo suele llevar una -t adicional: él trabaja, ella trabaja.'
    note: '*Werk* pasa a *werkt* con *hij*/*zij*, el patrón regular de la tercera persona del presente en neerlandés.'
  nl.a1.unit17.lesson04.teach.lotte_werkt:
    title: La profesión de Lotte
    gloss: Lotte trabaja de enfermera.
    note: '*Werkt* (y no *werk*) porque el sujeto es un nombre de tercera persona, no *ik*.'
  nl.a1.unit17.lesson04.teach.omar_werkt:
    title: La profesión de Omar
    gloss: Omar trabaja de cocinero.
    note: Misma terminación -t de tercera persona que en *Lotte werkt als verpleegkundige*.
  nl.a1.unit17.lesson04.teach.pronouns_workplaces:
    title: Usar pronombres
    gloss: Ella trabaja en el hospital. Él trabaja en un restaurante.
    note: '*Zij*/*hij* sustituyen a los nombres Lotte/Omar, pero el verbo mantiene la misma forma con -t de tercera persona.'
  nl.a1.unit17.lesson05.teach.profiel:
    title: Lee dos perfiles laborales
    gloss: Lotte trabaja de enfermera en el hospital. Empieza a las siete y trabaja de lunes a viernes. Omar trabaja de cocinero en un restaurante. Empieza a las once y tiene el descanso a las cuatro.
    note: Fíjate por separado en el trabajo, el lugar y el horario de cada persona.
    glosses:
      werkt: trabaja
      verpleegkundige: enfermero
      ziekenhuis: hospital
      begint: empieza
      zeven: siete
      maandag: Lunes
      vrijdag: viernes
      kok: cocinero / chef
      restaurant: restaurante
      elf: once
      pauze: descanso
  nl.a1.unit17.lesson06.teach.lotte_curious:
    title: Lotte pregunta por el trabajo
    gloss: 'Lotte: ¡Hola, Omar! Tengo curiosidad: ¿a qué te dedicas en realidad?'
    note: '*Eigenlijk* (en realidad) suaviza la pregunta y la convierte en curiosidad amistosa, no en un interrogatorio.'
  nl.a1.unit17.lesson06.teach.omar_answer:
    title: Omar responde
    gloss: 'Omar: Trabajo de cocinero en un restaurante. ¿Y tú?'
    note: '*En jij?* es la forma habitual de devolver la pregunta a la otra persona.'
  nl.a1.unit17.lesson06.teach.lotte_answer:
    title: Lotte responde
    gloss: 'Lotte: Trabajo de enfermera en el hospital.'
    note: Coincide con el trabajo y el lugar ya vistos en las lecciones anteriores.
  nl.a1.unit17.lesson06.teach.omar_ask_hours:
    title: Omar pregunta por el horario
    gloss: 'Omar: ¿Qué horario haces?'
    note: '*Uren maken* (literalmente «hacer horas») es una expresión fija para hablar del horario de trabajo.'
  nl.a1.unit17.lesson06.teach.lotte_hours:
    title: Lotte dice su horario
    gloss: 'Lotte: Empiezo a las siete y trabajo de lunes a viernes.'
    note: Coincide con el horario ya visto en el perfil de lectura.
  nl.a1.unit17.lesson06.teach.omar_reaction:
    title: Omar reacciona
    gloss: 'Omar: ¡Qué pronto! Yo empiezo más tarde, a las once.'
    note: Coincide con la hora de inicio de Omar que ya se vio antes.
  nl.a1.unit17.lesson06.teach.lotte_closing:
    title: Lotte cierra el tema
    gloss: 'Lotte: Cada trabajo tiene su propio ritmo, supongo.'
    note: 'Un comentario final natural y reflexivo: basta con entender su significado, no hace falta reproducirlo exactamente.'
