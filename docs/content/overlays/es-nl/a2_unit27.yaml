teaching:
  nl.a2.unit27.lesson01.teach.huisarts:
    title: Médico de cabecera
    gloss: el médico de cabecera
    note: 'Es un sustantivo de género común: de huisarts, ya visto en las lecciones de salud de la Unidad 16.'
    example_gloss: Me gustaría pedir cita con el médico de cabecera.
  nl.a2.unit27.lesson01.teach.afspraak_huisarts:
    title: Pedir una cita
    gloss: Me gustaría pedir cita con el médico de cabecera.
    note: Retoma el patrón afspraak maken de la visita al ayuntamiento de la Unidad 24, ahora con bij de huisarts.
  nl.a2.unit27.lesson01.teach.reden_bezoek:
    title: La recepcionista pregunta el motivo
    gloss: ¿Cuál es el motivo de su visita?
    note: Es una pregunta formal habitual al pedir cita médica.
  nl.a2.unit27.lesson01.teach.paar_dagen_niet_lekker:
    title: Decir desde cuándo no te encuentras bien
    gloss: Llevo unos días sin encontrarme bien.
    note: Al een paar dagen (desde hace unos días) amplía el voel me niet lekker de la Unidad 16 con una duración.
  nl.a2.unit27.lesson02.teach.klachten:
    title: Síntomas/molestias
    gloss: los síntomas/las molestias
    note: 'Es un sustantivo plural de género común: de klachten, el término médico habitual para los síntomas.'
    example_gloss: ¿Cuáles son sus síntomas?
  nl.a2.unit27.lesson02.teach.wat_zijn_klachten:
    title: El médico pregunta por los síntomas
    gloss: ¿Cuáles son sus síntomas?
    note: Es la pregunta formal con la que empieza una consulta.
  nl.a2.unit27.lesson02.teach.drie_dagen_klachten:
    title: Describir síntomas con su duración
    gloss: Llevo tres días con dolor de cabeza y fiebre.
    note: Al drie dagen (desde hace tres días) se combina con el presente heb para describir un síntoma que continúa, la misma construcción que sinds vorige maand de la Unidad 24.
  nl.a2.unit27.lesson02.teach.hoe_erg_pijn:
    title: Preguntar por la intensidad
    gloss: ¿Cuánto le duele?
    note: Hoe erg (¿cómo de fuerte/grave?) pregunta por la intensidad; es una pregunta de seguimiento natural.
  nl.a2.unit27.lesson03.teach.griepje:
    title: Resfriado leve
    gloss: un resfriado leve/una gripecilla
    note: 'Es un sustantivo neutro: het griepje, diminutivo de griep (gripe). El diminutivo lo suaviza y lo convierte en algo menor, no en una enfermedad grave.'
    example_gloss: Probablemente tiene un resfriado leve.
  nl.a2.unit27.lesson03.teach.waarschijnlijk_griepje:
    title: Dar un diagnóstico probable
    gloss: Probablemente tiene un resfriado leve.
    note: Waarschijnlijk (probablemente) matiza el diagnóstico, como corresponde a un médico antes de hacer más pruebas.
  nl.a2.unit27.lesson03.teach.niet_ernstig:
    title: Tranquilizar sobre la gravedad
    gloss: No es grave.
    note: Ernstig (grave) es el adjetivo clave para describir la gravedad de una enfermedad.
  nl.a2.unit27.lesson03.teach.geen_zorgen_formeel:
    title: Tranquilizar de manera formal
    gloss: No te preocupes.
    note: Es la versión formal del maak je geen zorgen informal de la Unidad 21, con u/zich en lugar de je.
  nl.a2.unit27.lesson04.teach.recept:
    title: Receta
    gloss: la receta
    note: 'Es un sustantivo neutro: het recept.'
    example_gloss: Le voy a recetar algo.
  nl.a2.unit27.lesson04.teach.schrijf_voor:
    title: El médico receta algo
    gloss: Le voy a recetar algo.
    note: Voorschrijven (recetar) es un verbo separable; voor pasa al final de la oración.
  nl.a2.unit27.lesson04.teach.pillen_innemen:
    title: Tomar la medicación
    gloss: Tome las pastillas dos veces al día y descanse bien.
    note: Innemen (tomar un medicamento) es un verbo separable y distinto de nemen solo; in pasa al final de su oración.
  nl.a2.unit27.lesson04.teach.terugkomen_als:
    title: Una indicación condicional de seguimiento
    gloss: Vuelva en una semana si no mejora.
    note: Als (si) introduce la condición; terugkomen (volver) es separable, con terug al final.
  nl.a2.unit27.lesson04.teach.infinitives_note:
    title: Las formas del infinitivo
    gloss: Tomar las pastillas y volver son los infinitivos de estos dos verbos separables.
    note: Innemen y terugkomen son las formas del diccionario (infinitivo), distintas de las formas conjugadas del imperativo (neem ... in, kom ... terug) que se usan en otras partes de esta lección.
  nl.a2.unit27.lesson05.teach.samenvatting:
    title: Lee el resumen de una consulta
    gloss: 'Diagnóstico: gripe leve. Consejo: descanse bien y beba mucha agua. Tome las pastillas recetadas dos veces al día. ¿Sigue sin sentirse mejor después de una semana? Entonces pida una nueva cita.'
    note: Fíjate en el diagnóstico, los dos consejos de estilo de vida, la indicación sobre la medicación y la condición para el seguimiento.
    glosses:
      Diagnose: diagnóstico
      griepje: una gripe leve (diminutivo de griep, que la presenta como algo menor)
      Advies: consejo
      rust: descanse (imperativo; con «uit» = descansar a fondo)
      uit: partícula de «rust uit» (= descansar a fondo)
      drink: beba (imperativo de drinken)
      veel: mucho, mucha
      Neem: tome (imperativo de nemen)
      voorgeschreven: recetadas (participio de voorschrijven)
      pillen: pastillas
      keer: veces («twee keer» = dos veces)
      dag: día («per dag» = al día)
      in: partícula separable de «innemen» (= tomar un medicamento)
      Voelt: siente («Voelt u zich» = ¿se siente usted?)
      zich: se (pronombre reflexivo)
      na: después de
      nog: todavía (en «nog steeds» = todavía)
      steeds: todavía (en «nog steeds» = todavía)
      beter: mejor
      Maak: pida (imperativo de maken)
      dan: entonces
      nieuwe: nuevo
      afspraak: cita
  nl.a2.unit27.lesson06.teach.huisarts_ask_symptoms:
    title: El médico abre la consulta
    gloss: 'Médico: Buenos días, ¿cuáles son sus síntomas?'
    note: Retoma la pregunta wat zijn uw klachten? de la lección 2.
  nl.a2.unit27.lesson06.teach.omar_symptoms:
    title: Omar describe sus síntomas
    gloss: 'Omar: Tengo dolor de cabeza y fiebre desde hace tres días.'
    note: 'Coincide exactamente con el ejemplo de la lección 2: esta es la visita real de Omar.'
  nl.a2.unit27.lesson06.teach.huisarts_react_diagnose:
    title: El médico reacciona y da el diagnóstico
    gloss: 'Médico: Qué fastidio. Probablemente tiene una gripe leve.'
    note: Klinkt (suena) retoma el patrón de dat klinkt fijn de la unidad 18, aquí con vervelend (fastidioso).
  nl.a2.unit27.lesson06.teach.omar_ask_serious:
    title: Omar pregunta si es grave
    gloss: 'Omar: ¿Es grave?'
    note: Una pregunta de seguimiento breve y directa con ernstig, de la lección 3.
  nl.a2.unit27.lesson06.teach.huisarts_reassure_prescribe:
    title: El médico tranquiliza y receta
    gloss: 'Médico: No, no es grave. Le voy a recetar algo.'
    note: Combina la frase tranquilizadora de la lección 3 con el patrón de la receta de la lección 4.
  nl.a2.unit27.lesson06.teach.omar_thanks_doctor:
    title: Omar da las gracias al médico
    gloss: 'Omar: Muchas gracias, doctor.'
    note: Dokter es una forma habitual y algo informal de dirigirse directamente a un médico; es distinto de huisarts (el título profesional).
  nl.a2.unit27.lesson06.teach.huisarts_final_instructions:
    title: El médico da las instrucciones finales
    gloss: 'Médico: Tome las pastillas dos veces al día y descanse bien. No se preocupe.'
    note: Combina la indicación sobre la medicación de la lección 4 con la frase tranquilizadora formal de la lección 3.
  nl.a2.unit27.lesson06.teach.summary_grammar:
    title: Resumen de la visita
    gloss: Omar tiene una gripe leve. Tiene que tomar las pastillas dos veces al día.
    note: Moet + infinitivo (moet ... innemen) expresa una necesidad; la partícula in del verbo separable queda unida a innemen, al final.
