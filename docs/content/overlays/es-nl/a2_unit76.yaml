teaching:
  nl.a2.unit76.lesson01.teach.rooster:
    title: El programa
    gloss: el horario
    note: '*Het rooster* es un sustantivo neutro (het) que se usa para el horario de trabajo o de clases.'
    example_gloss: Miro mi horario cada semana.
  nl.a2.unit76.lesson01.teach.maandag_woensdag:
    title: Hablar de las actividades de dos días distintos
    gloss: Los lunes trabajo y los miércoles tengo un curso.
    note: '*Op* + un día de la semana es la forma habitual de decir que algo ocurre en un día concreto en neerlandés.'
  nl.a2.unit76.lesson01.teach.wat_doe_je:
    title: Preguntar qué hace alguien normalmente entre semana
    gloss: ¿Qué sueles hacer entre semana?
    note: '*Door de week* (entre semana, literalmente «a través de la semana») se refiere a los días laborables como conjunto, en contraste con *het weekend*.'
  nl.a2.unit76.lesson02.teach.volgorde:
    title: El orden
    gloss: el orden
    note: '*De volgorde* es un sustantivo de género común (de) que se usa para el orden en que ocurren las cosas.'
    example_gloss: El orden de mi día es siempre el mismo.
  nl.a2.unit76.lesson02.teach.eerst_daarna:
    title: Ordenar acciones con eerst y daarna
    gloss: Primero trabajo y luego voy a hacer deporte.
    note: '*Eerst* (primero) y *daarna* (después) son los dos conectores de secuencia más comunes en neerlandés.'
  nl.a2.unit76.lesson02.teach.ten_slotte:
    title: Ordenar acciones con ten slotte
    gloss: Por último, cocino algo para la cena.
    note: '*Ten slotte* (por último) cierra una secuencia que empieza con *eerst* y continúa con *daarna*.'
  nl.a2.unit76.lesson03.teach.doordeweekse_dag:
    title: El día laborable
    gloss: el día laborable
    note: '*De doordeweekse dag* es un sintagma nominal de género común (de), que se contrapone a *het weekend*.'
    example_gloss: En un día laborable me levanto temprano.
  nl.a2.unit76.lesson03.teach.vroeg_op_uitslapen:
    title: Contrastar los días laborables y el fin de semana
    gloss: Entre semana me levanto temprano, pero el fin de semana duermo hasta tarde.
    note: '*Uitslapen* (dormir hasta tarde) es un verbo separable; *uit* pasa al final de la oración.'
  nl.a2.unit76.lesson03.teach.wat_is_verschil:
    title: Preguntar por la diferencia
    gloss: ¿Cuál es la diferencia entre tus días laborables y el fin de semana?
    note: '*Het verschil tussen ... en ...* (la diferencia entre ... y ...) es la estructura habitual para comparar.'
  nl.a2.unit76.lesson04.teach.agenda:
    title: La agenda
    gloss: la agenda
    note: '*De agenda* es un sustantivo de género común (de) que se usa para la agenda personal o el calendario de citas.'
    example_gloss: Mi agenda está completamente llena esta semana.
  nl.a2.unit76.lesson04.teach.agenda_vol:
    title: Decir que tu agenda está completamente llena
    gloss: Mi agenda está completamente llena esta semana.
    note: '*Zit vol* (literalmente «está lleno») es la forma idiomática de decir que una agenda está completa.'
  nl.a2.unit76.lesson04.teach.geen_vrije_avond:
    title: Decir que no tienes ninguna tarde libre
    gloss: Esta semana no tengo ninguna tarde libre.
    note: '*Vrije avond* (tarde libre) usa *vrije*, la forma con -e de *vrij* delante de una palabra con *de*.'
  nl.a2.unit76.lesson04.teach.volgende_week_meer_tijd:
    title: Mirar hacia la semana que viene
    gloss: La semana que viene tendré más tiempo.
    note: '*Volgende week* (la semana que viene) contrasta con *deze week* (esta semana), que ya apareció antes en esta lección.'
  nl.a2.unit76.lesson05.teach.ninas_week:
    title: Lectura sobre la semana ocupada de Nina
    gloss: La semana de Nina parece ocupada. Los lunes y los martes trabaja en la biblioteca. El miércoles por la noche tiene un curso de idiomas. El jueves hace deporte con amigos y el viernes cocina para su familia. El fin de semana descansa y lee un libro.
    note: '*Ziet er druk uit* (parece ocupada) usa *eruitzien* (parecer, tener aspecto de), un verbo separable; *er ... uit* enmarca la descripción.'
    glosses:
      ziet: parece (3.ª pers. sing. de zien; parte de ziet ... uit)
      druk: ocupada
      uit: prefijo separable aquí (ziet...uit = parece; rust...uit = descansa)
      maandag: Lunes
      dinsdag: martes
      werkt: trabaja (3.ª pers. sing. de werken)
      bibliotheek: biblioteca
      woensdagavond: miércoles por la noche
      heeft: tiene (3.ª pers. sing. de hebben)
      taalcursus: curso de idiomas
      donderdag: jueves
      sport: hace deporte (3.ª pers. sing. de sporten)
      vrienden: amigos
      vrijdag: viernes
      kookt: cocina (3.ª pers. sing. de koken)
      haar: su
      familie: familia
      weekend: fin de semana
      rust: descansa (3.ª pers. sing. de rusten)
      leest: lee (3.ª pers. sing. de lezen)
      boek: libro
