course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para ordenar acontecimientos con voordat, nadat, wanneer y als.
  learning_goal: Ordena acontecimientos con oraciones de antes, después y cuando, con el verbo al final en la subordinada y la inversión en la principal.
units:
  nl.a2.unit93.voordat_nadat_wanneer:
    title: Antes, después, cuando
    description: Ordena acontecimientos cotidianos y de viaje con voordat, nadat, wanneer y als.
lessons:
  nl.a2.unit93.lesson01.voordat_ik_ga:
    title: Antes de irme
  nl.a2.unit93.lesson02.nadat_ik_gegeten_heb:
    title: Después de comer
  nl.a2.unit93.lesson03.voordat_of_nadat:
    title: ¿Voordat o nadat?
  nl.a2.unit93.lesson04.wanneer_en_als:
    title: Wanneer y als
  nl.a2.unit93.lesson05.een_reisdag:
    title: Un día de viaje
  nl.a2.unit93.lesson06.lotte_en_omar:
    title: Lotte y Omar planean un viaje
teaching:
  nl.a2.unit93.lesson01.teach.dagelijks:
    title: Acciones cotidianas
    gloss: ducharse / desayunar / comer / cocinar / ordenar / llamar
    note: '*Opruimen* es separable: *ik ruim op*.'
    example_gloss:
    - Me ducho y desayuno.
    - Como un bocadillo y bebo té.
    - Cocino y limpio la cocina.
    - Llamo a Lotte.
  nl.a2.unit93.lesson01.teach.plaatsen:
    title: Lugares y momentos
    gloss: el trabajo / a casa (dirección) / en casa / la tienda / a la cama
    note: '*Naar huis* indica dirección; *thuis* indica dónde estás.'
    example_gloss:
    - Voy al trabajo.
    - Voy a casa.
    - A las seis estoy en casa.
    - Voy a la tienda.
    - Me acuesto a las once.
  nl.a2.unit93.lesson01.teach.voordat:
    title: Voordat
    gloss: antes
    note: '*Voordat* introduce el hecho que ocurre en segundo lugar.'
    example_gloss:
    - Antes de comer, llamo a Lotte.
    - Antes de cocinar, voy a la tienda.
    - Antes de acostarme, bebo té.
  nl.a2.unit93.lesson01.teach.gn_voordat:
    title: Voordat con el verbo al final
    gloss: Antes de ir al trabajo, desayuno.
    note: 'Después de *voordat*, el verbo conjugado va al final de la oración: *ik naar mijn werk ga*.'
  nl.a2.unit93.lesson01.teach.gn_inversie:
    title: Inversión tras la oración inicial
    gloss: Después de voordat, el verbo va al final. Si la subordinada va primero, la oración principal empieza con el verbo conjugado y después va el sujeto.
    note: 'La coma cierra la subordinada. Luego la oración principal empieza con el verbo: *ontbijt ik*, no *ik ontbijt*.'
  nl.a2.unit93.lesson01.teach.zinnen:
    title: Dos oraciones con voordat
    gloss: Antes de desayunar, me ducho. Antes de ir a casa, llamo a Lotte.
  nl.a2.unit93.lesson02.teach.deelwoorden:
    title: Participios pasados
    gloss: comer – comido; cocinar – cocinado; ducharse – duchado; llamar – llamado; trabajar – trabajado; ordenar – ordenado
    note: 'Los verbos regulares forman el participio con *ge-* y *-t* o *-d*; *eten* es irregular (*gegeten*); *opruimen* coloca *ge* en medio: *opgeruimd*.'
    example_gloss:
    - He comido.
    - He cocinado.
    - He llamado a Lotte.
    - He trabajado y me he duchado.
    - He limpiado la cocina.
  nl.a2.unit93.lesson02.teach.aankomen:
    title: Llegar
    gloss: llegar – llegado
    note: '*Aankomen* es separable: *ik kom aan*.'
    example_gloss:
    - Llego a las seis.
    - Llegué a las seis.
  nl.a2.unit93.lesson02.teach.nadat:
    title: Nadat
    gloss: después de
    note: '*Nadat* introduce el hecho que ocurrió primero.'
    example_gloss:
    - Después de comer, recojo.
    - Después de trabajar, me ducho.
    - Después de cocinar, como.
  nl.a2.unit93.lesson02.teach.gn_nadat:
    title: Nadat con el perfectum
    gloss: Después de comer, recojo.
    note: 'Después de *nadat* va el perfectum, y los dos verbos van al final: *gegeten heb*.'
  nl.a2.unit93.lesson02.teach.gn_nadat_regel:
    title: La regla de nadat
    gloss: Después de nadat se usa el perfectum (en presente). El participio y heb van al final. La oración principal empieza entonces con el verbo conjugado.
    note: 'La inversión funciona como después de *voordat*: *Nadat ik gegeten heb, ruim ik op* (no *ik ruim op*).'
  nl.a2.unit93.lesson02.teach.gn_volgorde:
    title: Dos órdenes posibles de los verbos
    gloss: 'También es correcto: Después de comer, ordeno.'
    note: En una subordinada son correctos tanto *gegeten heb* como *heb gegeten*. En esta unidad se usa sobre todo *gegeten heb*.
  nl.a2.unit93.lesson02.teach.gn_aankomen:
    title: Ben con aankomen
    gloss: Después de llegar, llamo a Lotte.
    note: '*Aankomen* se conjuga con *zijn*, no con *hebben*: *aangekomen ben*.'
  nl.a2.unit93.lesson03.teach.reis_woorden:
    title: Palabras de viaje
    gloss: el tren / la estación / el billete / la maleta
    note: '*Het kaartje* es un billete de tren.'
    example_gloss:
    - El tren está en la estación.
    - Compro un billete.
    - Mi maleta está lista.
  nl.a2.unit93.lesson03.teach.reis_werkwoorden:
    title: Verbos de viaje
    gloss: salir – salido; hacer la maleta – hecha; comprar – comprado
    note: '*Vertrekken* se conjuga con *zijn* (*vertrokken ben*); *inpakken* y *kopen* con *hebben*. *Inpakken* es separable: *ik pak in*.'
    example_gloss:
    - El tren sale a las nueve.
    - Salgo a las nueve.
    - Hago la maleta.
    - He comprado un billete.
  nl.a2.unit93.lesson03.teach.gn_voordat_reis:
    title: 'Voordat: el segundo hecho'
    gloss: Antes de salir, hago la maleta.
    note: 'La oración con *voordat* es el hecho que ocurre en segundo lugar: primero hacer la maleta, luego salir.'
  nl.a2.unit93.lesson03.teach.gn_nadat_reis:
    title: 'Nadat: el primer hecho'
    gloss: Después de hacer la maleta, salgo.
    note: 'La oración con *nadat* es el hecho que ocurrió primero: primero hacer la maleta, luego salir. Es el mismo orden de hechos que antes, con otra conjunción.'
  nl.a2.unit93.lesson03.teach.gn_vergelijk:
    title: Voordat o nadat
    gloss: Voordat indica el hecho que ocurre después. Nadat indica el hecho que ocurre antes.
    note: Pregúntate qué hecho ocurre primero en el tiempo. En presente, en esta unidad *nadat* va seguido del perfectum y *voordat* del presente simple.
  nl.a2.unit93.lesson03.teach.gn_hoofdzin_eerst:
    title: Primero la oración principal
    gloss: Hago la maleta antes de salir.
    note: 'Si la oración principal va primero, no hay inversión: *Ik pak ...*, y la subordinada sigue con el verbo al final.'
  nl.a2.unit93.lesson03.teach.gn_had:
    title: Nadat en una historia del pasado
    gloss: Después de haber comido, llamé a Lotte.
    note: 'En una historia del pasado, *had* sustituye a *heb* (y *was* a *ben*): *gegeten had*. La oración principal también va en pasado (*belde*).'
  nl.a2.unit93.lesson04.teach.toestand:
    title: Cansado, temprano, tarde, hambre
    gloss: cansado / temprano / tarde / hambre
    note: '*Honger hebben* significa tener hambre.'
    example_gloss:
    - Estoy cansado.
    - Me acuesto temprano.
    - Llego tarde a casa.
    - Tengo hambre.
  nl.a2.unit93.lesson04.teach.gewoonte:
    title: Costumbres
    gloss: volver a casa / la bicicleta / coger / llover
    note: '*Thuiskomen* es separable: *ik kom thuis*; en una subordinada es una sola palabra: *als ik thuiskom*.'
    example_gloss:
    - Llego a casa a las seis.
    - Cojo la bicicleta.
    - Cojo el autobús.
    - Está lloviendo.
  nl.a2.unit93.lesson04.teach.wanneer_als:
    title: Wanneer y als
    gloss: cada vez que / cuando
    note: 'En este uso *wanneer* y *als* significan lo mismo: cada vez que algo ocurre una y otra vez.'
    example_gloss:
    - Cuando estoy cansado, me acuesto temprano.
    - Cuando tengo hambre, me como un bocadillo.
    - Siempre que llueve, tomo el autobús.
  nl.a2.unit93.lesson04.teach.gn_als:
    title: Als con el presente
    gloss: Cuando estoy cansado, me acuesto temprano.
    note: 'Una costumbre va en presente. El verbo va al final: *ik moe ben*.'
  nl.a2.unit93.lesson04.teach.gn_wanneer_regel:
    title: La regla de wanneer y als
    gloss: Con wanneer o als dices lo que ocurre una y otra vez, o lo que ocurrirá después. El verbo va al final, y la oración principal empieza con el verbo conjugado.
    note: 'Ojo: *als* también puede significar *si*. *Wanneer* solo significa *cuando*.'
  nl.a2.unit93.lesson04.teach.gn_toen:
    title: Toen frente a als
    gloss: Cuando llegué a casa, llamó Lotte. Cuando llego a casa, llamo a Lotte.
    note: '*Toen* se refiere a un momento concreto del pasado y lleva imperfectum. *Wanneer* y *als* se refieren a costumbres y al presente.'
  nl.a2.unit93.lesson04.teach.gn_toen_regel:
    title: Elegir toen o wanneer
    gloss: Toen se usa para un momento concreto del pasado. Wanneer o als se usan para una costumbre o para el presente.
    note: Toen se explicó en una unidad anterior; esto es solo un breve recordatorio.
  nl.a2.unit93.lesson05.teach.lezen:
    title: El día de viaje de Noor
    gloss: Noor viaja mañana en tren. Antes de salir, hace la maleta. Después de hacer la maleta, desayuna. Va a la estación y compra un billete. Antes de que salga el tren, toma un café. Cuando llega, llama a Lotte.
    note: 'Sigue el orden de los hechos: ¿qué oración te dice lo que ocurre primero?'
    glosses:
      morgen: mañana
      met: con
      pakt: hace (la maleta)
      heeft: ha
      koopt: compra
      drinkt: bebe
      koffie: café
      aankomt: llega
      belt: llama
      haar: su
  nl.a2.unit93.lesson06.teach.lotte_vertrek:
    title: Lotte pregunta por mañana
    gloss: 'Lotte: Hola, Omar, ¿a qué hora sales mañana?'
  nl.a2.unit93.lesson06.teach.omar_koffer:
    title: Omar cuenta su plan
    gloss: 'Omar: A las nueve. Antes de salir, hago la maleta.'
  nl.a2.unit93.lesson06.teach.lotte_bel:
    title: Lotte pide una llamada
    gloss: 'Lotte: ¿Me llamas cuando hayas llegado?'
  nl.a2.unit93.lesson06.teach.omar_ja:
    title: Omar está de acuerdo
    gloss: 'Omar: Sí, cuando haya llegado, te llamo.'
  nl.a2.unit93.lesson06.teach.lotte_te_laat:
    title: Lotte pregunta por un retraso
    gloss: 'Lotte: ¿Qué haces si el tren llega tarde?'
  nl.a2.unit93.lesson06.teach.omar_koffie:
    title: Omar responde
    gloss: 'Omar: Si el tren llega tarde, me tomo un café.'
exercises:
  nl.a2.unit93.lesson01.exercise01.kies_werk:
    instruction: Elige la frase en neerlandés que significa «Antes de ir al trabajo, desayuno».
    correct_option: Voordat ik naar mijn werk ga, ontbijt ik.
    distractors:
    - Voordat ik naar mijn werk ga, ik ontbijt.
    - Voordat ik ga naar mijn werk, ontbijt ik.
    - Voordat ik ontbijt, ga ik naar mijn werk.
    accepted_answers:
    - value: Voordat ik naar mijn werk ga, ontbijt ik.
      status: correct
    feedback: 'Después de la oración inicial con *voordat*, la oración principal empieza con el verbo: *ontbijt ik*. La última opción pone los hechos en el orden contrario.'
    prompt_blocks:
    - Antes de ir al trabajo, desayuno.
