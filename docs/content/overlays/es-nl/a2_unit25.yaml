teaching:
  nl.a2.unit25.lesson01.teach.fietspad:
    title: Carril bici
    gloss: el carril bici
    note: 'Sustantivo neutro: het fietspad, palabra compuesta de fiets (bicicleta) y pad (camino).'
    example_gloss: El carril bici es nuevo.
  nl.a2.unit25.lesson01.teach.wat_vind_je:
    title: Pedir una opinión
    gloss: ¿Qué te parece el nuevo carril bici?
    note: Vinden van (literalmente «encontrar de») es la forma habitual de preguntar o dar una opinión sobre algo concreto.
  nl.a2.unit25.lesson01.teach.wat_is_mening:
    title: Pedir una opinión de forma directa
    gloss: ¿Cuál es tu opinión?
    note: Mening (opinión) es el sustantivo directo, que se usa cuando vinden van resulta demasiado indirecto.
  nl.a2.unit25.lesson02.teach.volgens_mij_goed:
    title: Expresar una opinión
    gloss: En mi opinión, el carril bici es una buena idea.
    note: Volgens mij (según yo / en mi opinión) es la forma más habitual de introducir una opinión personal en neerlandés.
  nl.a2.unit25.lesson02.teach.gevaarlijk:
    title: Peligroso
    gloss: peligroso
    note: Adjetivo habitual para hablar de un riesgo.
    example_gloss: Algunas personas piensan que el carril bici es peligroso.
  nl.a2.unit25.lesson02.teach.volgens_mij_gevaarlijk:
    title: Opinión y motivo
    gloss: En mi opinión, el carril bici es peligroso porque es demasiado estrecho.
    note: Omdat (porque) introduce la oración del motivo; el verbo va al final de esa oración (is pasa después de te smal).
  nl.a2.unit25.lesson03.teach.ben_het_eens:
    title: Estar de acuerdo
    gloss: Estoy de acuerdo contigo.
    note: Het eens zijn met (literalmente «estar en ello de acuerdo con») es la expresión fija para decir que estás de acuerdo.
  nl.a2.unit25.lesson03.teach.niet_eens:
    title: No estar de acuerdo
    gloss: No estoy de acuerdo contigo.
    note: 'Niet niega la expresión fija: het niet met je eens zijn.'
  nl.a2.unit25.lesson03.teach.gedeeltelijk_eens:
    title: Estar parcialmente de acuerdo
    gloss: Estoy parcialmente de acuerdo.
    note: Gedeeltelijk (parcialmente) se inserta en la misma expresión fija het met je eens zijn; es útil para dar una respuesta matizada.
  nl.a2.unit25.lesson04.teach.veiliger_kinderen:
    title: Presentar un contrapunto
    gloss: Por otro lado, el carril bici sí es más seguro para los niños.
    note: Aan de andere kant (por otro lado) introduce un punto contrastante; wel aquí refuerza el contraste, no es un simple «sí».
  nl.a2.unit25.lesson04.teach.duur_bespaart:
    title: Comparar coste y beneficio
    gloss: Es caro, pero por otro lado ahorra tiempo.
    note: Maar (pero) junto con aan de andere kant forma un contraste clásico de pros y contras.
  nl.a2.unit25.lesson05.teach.voetgangers:
    title: Peatones
    gloss: los peatones
    note: 'Sustantivo común en plural: de voetgangers, de voet (pie) y gangers (los que andan).'
    example_gloss: El carril bici es estrecho para los peatones.
  nl.a2.unit25.lesson05.teach.forumbericht:
    title: Leer un mensaje de foro
    gloss: Creo que el nuevo carril bici es una mala idea. Es demasiado estrecho y hay muy poco espacio para los peatones. Por otro lado, entiendo que el ayuntamiento quiera más ciclistas. En mi opinión, deberían hacer el camino más ancho.
    note: Identifica la opinión del autor, su motivo, el contrapunto que reconoce y su sugerencia.
    glosses:
      vind: pensar / opinar (de) — expresa una opinión
      nieuwe: nuevo
      fietspad: carril bici
      slecht: malo
      idee: idea
      te: demasiado
      smal: estrecho
      weinig: poco
      ruimte: espacio
      voetgangers: peatones
      andere: otros
      kant: lado (aan de andere kant = por otro lado)
      snap: entender (de snappen, informal)
      gemeente: ayuntamiento
      meer: más
      fietsers: ciclistas
      wil: quiere (de willen)
      Volgens: según (Volgens mij = en mi opinión)
      moeten: deber / tener que
      pad: camino
      breder: más ancho (comparativo de breed)
      maken: hacer
  nl.a2.unit25.lesson06.teach.lotte_ask:
    title: Lotte pregunta a Omar su opinión
    gloss: 'Lotte: ¿Qué te parece el nuevo carril bici, Omar?'
    note: Retoma el patrón wat vind je van ...? de la lección 1, ahora dirigido directamente a Omar.
  nl.a2.unit25.lesson06.teach.omar_opinion:
    title: Omar da su opinión
    gloss: 'Omar: En mi opinión, es una buena idea, porque es más seguro para los ciclistas.'
    note: Combina volgens mij con un motivo introducido por omdat, retomando el patrón de la lección 2.
  nl.a2.unit25.lesson06.teach.lotte_disagree:
    title: Lotte está en parte en desacuerdo
    gloss: 'Lotte: No estoy del todo de acuerdo con eso. Es bastante estrecho para los peatones.'
    note: Daar (ahí / con eso) remite a la opinión de Omar; helemaal (del todo) suaviza el desacuerdo a «no del todo», no es un rechazo rotundo.
  nl.a2.unit25.lesson06.teach.omar_concede:
    title: Omar lo reconoce y responde
    gloss: 'Omar: Lo entiendo, pero por otro lado ahora hay menos coches en la calle.'
    note: Dat snap ik (lo entiendo) reconoce el argumento de Lotte antes de introducir un contraargumento con aan de andere kant.
  nl.a2.unit25.lesson06.teach.lotte_agree_maybe:
    title: Lotte suaviza su postura
    gloss: 'Lotte: Es verdad. Quizá mejore si lo hacen más ancho.'
    note: Als (si) introduce una oración condicional; wordt es el presente de worden (volverse, llegar a ser).
  nl.a2.unit25.lesson06.teach.omar_final_agree:
    title: Omar está de acuerdo
    gloss: 'Omar: Sí, yo también lo creo.'
    note: Retoma dat denk ik ook de la llamada telefónica de la Unidad 22.
  nl.a2.unit25.lesson06.teach.vindt_form:
    title: 'Vindt: la forma de él/ella'
    gloss: Omar piensa que el carril bici es una buena idea.
    note: Vindt es la forma de tercera persona de vinden (opinar, encontrar), que se usa para describir la opinión de otra persona.
