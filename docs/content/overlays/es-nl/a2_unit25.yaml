course:
  title: Neerlandés A2
  description: Neerlandés de nivel elemental alto para dar tu opinión sobre un tema conocido, apoyarla con un motivo y responder a la opinión de otra persona.
units:
  nl.a2.unit25.meningen:
    title: Dar tu opinión
lessons:
  nl.a2.unit25.lesson01.wat_vind_je_daarvan:
    title: ¿Qué te parece?
