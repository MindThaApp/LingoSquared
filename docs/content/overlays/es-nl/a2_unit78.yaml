teaching:
  nl.a2.unit78.lesson01.teach.weekend:
    title: El fin de semana / el fin de semana pasado
    gloss: el fin de semana / el fin de semana pasado (el que acaba de terminar)
    note: '*Het weekend* es un sustantivo neutro (het). *Afgelopen weekend* significa el fin de semana que acaba de pasar, así que es la expresión natural para decir «el fin de semana pasado» cuando cuentas lo que hiciste.'
    example_gloss:
    - El fin de semana empieza el sábado.
    - El fin de semana pasado trabajé.
  nl.a2.unit78.lesson01.teach.zaterdag_zondag:
    title: Sábado y domingo
    gloss: sábado / domingo
    note: En neerlandés los nombres de los días se escriben con minúscula, igual que en español, salvo al principio de una oración.
    example_gloss:
    - El sábado estoy libre.
    - Los domingos duermo hasta tarde.
  nl.a2.unit78.lesson01.teach.boodschappen:
    title: Hacer recados
    gloss: hacer la compra / hacer recados
    note: '*Boodschappen doen* es la expresión fija para hacer la compra y pequeños recados. *Boodschappen* es plural y no lleva artículo.'
    example_gloss: Todos los sábados hago la compra.
  nl.a2.unit78.lesson01.teach.op_bezoek:
    title: Ir de visita
    gloss: ir de visita (a alguien)
    note: '*Op bezoek gaan* significa visitar a alguien en su casa; se añade *bij* + la persona: *op bezoek bij mijn oom*.'
    example_gloss: Voy a menudo a visitar a mi tío.
  nl.a2.unit78.lesson01.teach.uitjes:
    title: Lugares a los que ir el fin de semana
    gloss: el mercado / el parque / el cine
    note: '*De markt* y *de bioscoop* son palabras de género de; *het park* es una palabra de género het.'
    example_gloss:
    - Compro verduras en el mercado.
    - Me gusta pasear por el parque.
    - El sábado voy al cine.
  nl.a2.unit78.lesson01.teach.werken_koken:
    title: Cuatro verbos cotidianos
    gloss: trabajar / cocinar / comer / beber
    note: Estos son los infinitivos. Más adelante en esta unidad formarás sus formas de pasado.
    example_gloss:
    - Hoy tengo que trabajar.
    - Sé cocinar bien.
    - Me gustaría comer.
    - ¿Quieres beber café?
  nl.a2.unit78.lesson01.teach.vraag:
    title: Preguntar qué hizo alguien el fin de semana pasado
    gloss: ¿Qué hiciste el fin de semana pasado?
    note: Esta es la pregunta habitual. *Gedaan* es el participio de *doen* y va al final del todo.
  nl.a2.unit78.lesson01.teach.gn_frame:
    title: 'El perfectum: heb/ben + participio'
    gloss: El sábado hice la compra. El domingo fui a casa de mi tío.
    note: 'El *perfectum* es la forma habitual de contar lo que hiciste. Tiene dos partes: una forma de *hebben* o *zijn* en segunda posición y el *participio* (*gedaan*, *gegaan*) al final de la oración. Todo lo demás (un día, un complemento, un lugar) va antes o entre ellos, pero *heb/ben* siempre se queda en segunda posición (en una oración afirmativa): *Zaterdag heb ik boodschappen gedaan.* La mayoría de los verbos usan *hebben*; *gaan* usa *zijn*. La lección 3 explica cuándo.'
  nl.a2.unit78.lesson02.teach.weekend_verbs:
    title: Cuatro actividades de fin de semana
    gloss: caminar / ir en bici / jugar / hacer deporte
    note: '*Spelen* se usa para juegos y deportes de pelota, y para instrumentos: *voetbal spelen*. *Sporten* significa hacer deporte en general.'
    example_gloss:
    - ¿Vamos a dar un paseo?
    - Mañana voy a ir en bici.
    - Los niños quieren jugar fuera.
    - Quiero hacer deporte más a menudo.
  nl.a2.unit78.lesson02.teach.gn_regular:
    title: 'Participios regulares: ge- + raíz + -t o -d'
    gloss: trabajar → trabajado, cocinar → cocinado, caminar → caminado, jugar → jugado, ir en bici → ido en bici
    note: 'Los verbos regulares forman el participio con *ge-* + la raíz + *-t* o *-d*. La raíz es la forma de *ik*: *werk*, *kook*, *wandel*, *speel*, *fiets*. ¿Qué terminación? Aplica la prueba del *''t kofschip* a la última letra de la raíz (un adelanto; la regla completa llega más tarde): si es una de *t, k, f, s, ch, p*, añade *-t* (*werk → gewerkt*, *kook → gekookt*, *fiets → gefietst*). Con cualquier otra letra, añade *-d* (*wandel → gewandeld*, *speel → gespeeld*). La prueba se aplica a la raíz (la forma de *ik*). Una excepción para más adelante: si el infinitivo tiene *v* o *z* (*leven, reizen*), se usa *-d*: *geleefd, gereisd*.'
  nl.a2.unit78.lesson02.teach.gn_stem_t:
    title: Cuando la raíz ya termina en -t
    gloss: Hago deporte. He hecho deporte / Hice deporte.
    note: 'Si la raíz ya termina en *-t* (o *-d*), no se añade nada más: *sport → gesport*, no *gesportt*. Aun así se pone *ge-* delante.'
  nl.a2.unit78.lesson02.teach.park_gewandeld:
    title: Pasear por el parque
    gloss: Paseé por el parque.
    note: Aquí *wandelen* usa *hebben* porque no hay destino, solo se pasea sin rumbo.
  nl.a2.unit78.lesson02.teach.voetbal_gespeeld:
    title: Jugar al fútbol
    gloss: Jugué al fútbol.
    note: 'Con los deportes se usa *gespeeld*: *voetbal spelen → ik heb voetbal gespeeld*.'
  nl.a2.unit78.lesson03.teach.hebben_zijn:
    title: Los dos auxiliares
    gloss: tener, haber / ser, estar
    note: 'En el perfectum, *hebben* y *zijn* son los verbos auxiliares. Sus formas: *ik heb, ik ben*; *het heeft, het is*.'
    example_gloss:
    - A mí también me gustaría tener una bici.
    - Puede ser divertido.
  nl.a2.unit78.lesson03.teach.gn_irregular:
    title: 'Participios irregulares: apréndelos como palabras completas'
    gloss: ver → visto, leer → leído, dormir → dormido, comer → comido, beber → bebido, comprar → comprado, hacer → hecho
    note: 'Los verbos irregulares no siguen la regla de *-t/-d*. La mayoría sigue empezando por *ge-* y muchos terminan en *-en*: *gezien, gelezen, geslapen, gegeten, gedronken, gedaan*. Unos pocos, como *kopen → gekocht*, terminan en *-t* pero cambian por dentro. Comprobación rápida: si un participio no termina en una *-t* o *-d* regular añadida a la raíz, es irregular y tienes que aprenderlo como palabra completa.'
  nl.a2.unit78.lesson03.teach.film_gezien:
    title: Ver una película
    gloss: Vi una película.
    note: El neerlandés dice *een film zien* (ver una película) tanto para ir al cine como para verla en casa.
  nl.a2.unit78.lesson03.teach.lang_geslapen:
    title: Dos participios en una oración
    gloss: Dormí mucho y leí un libro.
    note: 'Con dos acciones y el mismo *heb*, puedes omitir el segundo *heb*: *Ik heb lang geslapen en een boek gelezen.*'
  nl.a2.unit78.lesson03.teach.bezocht:
    title: Un participio sin ge-
    gloss: Visité a mi tío.
    note: 'Los verbos que empiezan con un prefijo átono como *be-*, *ver-* u *ont-* no llevan *ge-*: *bezoeken → bezocht* (visitar). Este también es irregular. *Ik heb mijn oom bezocht* e *Ik ben op bezoek geweest bij mijn oom* significan casi lo mismo.'
  nl.a2.unit78.lesson03.teach.gn_aux:
    title: ¿Hebben o zijn?
    gloss: Vi una película. Fui a casa de mi tío. Me quedé en casa. Estuve en casa de mi tío. Se hizo tarde.
    note: '*Hebben* es el auxiliar por defecto: *Ik heb gewerkt, ik heb een film gezien*. Usa *zijn* para dos grupos: (1) moverse a un lugar nuevo, como *gaan* y *komen*, y (2) ser o cambiar, como *zijn, blijven, worden*. Prueba rápida: ¿el verbo trata de ir o venir a algún sitio, de quedarse (*blijven*), de ser (*zijn*) o de volverse (*worden*)? Entonces *zijn*. Fíjate en que *het* lleva *is*: *Het is laat geworden* (Se hizo tarde). El movimiento sin destino lleva *hebben*: *Ik heb in het park gewandeld*, pero con destino lleva *zijn*.'
  nl.a2.unit78.lesson03.teach.zijn_verbs:
    title: Verbos de movimiento y de cambio (con zijn)
    gloss: ir → ido, venir → venido, quedarse → quedado, volverse → vuelto, ser/estar → sido/estado
    note: 'Estos cinco verbos forman su perfectum con *zijn*: *ik ben gegaan, ik ben gekomen, ik ben gebleven, het is geworden, ik ben geweest*. Los cinco tienen participios irregulares.'
  nl.a2.unit78.lesson04.teach.eerst_daarna:
    title: Primero y luego
    gloss: primero / después
    note: '*Eerst* y *daarna* ordenan las acciones. Son los conectores que necesitas para contar un fin de semana en orden.'
    example_gloss:
    - Primero trabajo y después voy a hacer deporte.
    - Primero como y después tomo café.
  nl.a2.unit78.lesson04.teach.gn_order:
    title: 'Contarlo en orden: eerst, daarna'
    gloss: Primero fui al mercado y después cociné.
    note: 'Después de *eerst* o *daarna*, el verbo auxiliar va justo a continuación, antes de *ik*: *Daarna heb ik gekookt*, no *Daarna ik heb gekookt*. El participio se queda al final de cada parte.'
  nl.a2.unit78.lesson04.teach.gn_niet:
    title: 'Decir lo que no hiciste: niet'
    gloss: No trabajé. No leí el libro. No fui a casa de mi tío.
    note: 'En el perfectum, *niet* va delante del participio: *Ik heb niet gewerkt*. Si la oración tiene un complemento concreto (*het boek*), este va primero y *niet* lo sigue: *Ik heb het boek niet gelezen*. Delante de un lugar o una dirección, *niet* va antes: *Ik ben niet naar mijn oom gegaan*. Una expresión de tiempo como *zaterdag* va antes de *niet*: *Ik heb zaterdag niet gewerkt*. Nunca pongas *niet* después del participio.'
  nl.a2.unit78.lesson04.teach.gn_geen:
    title: 'Decir que no tuviste nada: geen'
    gloss: No bebí café. No tuve tiempo.
    note: 'Usa *geen* en lugar de *een* o de la ausencia de artículo delante de un sustantivo: *een film → geen film*, *koffie → geen koffie*, *tijd → geen tijd*. Usa *niet* con verbos, cosas concretas (*het boek*) y lugares. *Gehad* es el participio de *hebben*.'
  nl.a2.unit78.lesson04.teach.lotte_gesport:
    title: Lotte pregunta por el deporte
    gloss: 'Lotte: ¿Hiciste deporte?'
    note: 'En una pregunta de sí o no, el verbo auxiliar va primero: *Heb je gesport?*'
  nl.a2.unit78.lesson04.teach.omar_niet_gesport:
    title: Omar dice que no
    gloss: 'Omar: No, no hice deporte.'
  nl.a2.unit78.lesson05.teach.noor_bericht:
    title: Un mensaje de Noor
    gloss: ¡Hola, Lotte! Ha sido un fin de semana tranquilo. El sábado por la mañana fui al mercado y compré pan. Por la tarde paseé por el parque. Por la noche cociné. No hice deporte y no vi ninguna película. El domingo me quedé en casa. Dormí mucho y leí un libro.
    note: 'Noor le cuenta a Lotte su fin de semana en orden: sábado por la mañana, por la tarde y por la noche, y luego el domingo. Fíjate en dónde va el participio en cada oración: siempre al final. *''s Middags* y *''s Avonds* significan «por la tarde» y «por la noche».'
    glosses:
      hoi: hola
      rustig: tranquilo, calmado
      weekend: fin de semana
      geweest: sido, estado (participio de zijn)
      zaterdagochtend: sábado por la mañana
      markt: mercado
      brood: pan
      gekocht: comprado (participio de kopen)
      middags: por la tarde ('s middags)
      park: parque
      gewandeld: paseado, caminado (participio de wandelen)
      avonds: por la noche ('s avonds)
      gekookt: cocinado (participio de koken)
      niet: 'no'
      gesport: hecho deporte (participio de sporten)
      geen: ningún, ninguna
      film: película
      gezien: visto (participio de zien)
      zondag: Domingo
      thuisgebleven: quedado en casa (participio de thuisblijven)
      lang: mucho tiempo, largo rato
      geslapen: dormido
      boek: libro
      gelezen: leído
  nl.a2.unit78.lesson06.teach.lotte_vraag:
    title: Lotte le pregunta a Omar por su fin de semana
    gloss: 'Lotte: ¡Hola, Omar! ¿Qué hiciste el fin de semana pasado?'
  nl.a2.unit78.lesson06.teach.omar_zaterdag:
    title: Omar cuenta lo que hizo el sábado
    gloss: 'Omar: El sábado fui a casa de mi tío, en Ámsterdam. Comí en casa de mi tío.'
    note: '*Bij mijn oom* significa ''en casa de mi tío''. *Naar mijn oom* indica la dirección y *bij mijn oom* indica el lugar.'
  nl.a2.unit78.lesson06.teach.lotte_zondag:
    title: Lotte pregunta por el domingo
    gloss: 'Lotte: ¡Qué bien! ¿Y el domingo?'
  nl.a2.unit78.lesson06.teach.omar_zondag:
    title: Omar cuenta lo que hizo el domingo y pregunta a Lotte
    gloss: 'Omar: El domingo me quedé en casa. Dormí mucho y no hice deporte. ¿Y tú?'
  nl.a2.unit78.lesson06.teach.lotte_antwoord:
    title: Lotte cuenta su fin de semana
    gloss: 'Lotte: Fui a casa de mis padres. No hice la compra, pero cociné.'
