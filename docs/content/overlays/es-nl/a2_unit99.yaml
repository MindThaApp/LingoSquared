course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para comparar y elegir entre opciones.
  learning_goal: Compara varias opciones y elige la mejor con -er, -st, meer, het meest, even ... als y niet zo ... als.
units:
  nl.a2.unit99.de_beste_en_meest:
    title: El mejor, el más barato, el más
    description: Compara viviendas, teléfonos y vacaciones y di cuál es el mejor.
lessons:
  nl.a2.unit99.lesson01.groter_dan:
    title: Más grande que
  nl.a2.unit99.lesson02.het_grootste:
    title: El más grande
  nl.a2.unit99.lesson03.even_en_niet_zo:
    title: Tan ... como y no tan ... como
  nl.a2.unit99.lesson04.meer_en_meest:
    title: Más y el más
  nl.a2.unit99.lesson05.noor_kiest_een_hotel:
    title: Noor elige un hotel
  nl.a2.unit99.lesson06.een_telefoon_kiezen:
    title: Elegir un teléfono
teaching:
  nl.a2.unit99.lesson01.teach.eigenschappen:
    title: Palabras para describir
    gloss: grande / pequeño / bonito / caro / barato / largo
    note: Estos seis adjetivos son la base de todas las comparaciones de esta unidad.
    example_gloss:
    - La casa es grande y bonita.
    - El teléfono es caro, pero el hotel es barato.
    - El viaje es largo y la habitación es pequeña.
  nl.a2.unit99.lesson01.teach.wonen:
    title: La vivienda
    gloss: la casa / el apartamento / la habitación / la cocina / el jardín
    note: Las palabras de vivienda vuelven del primer curso; aquí son las cosas que comparamos.
    example_gloss:
    - La casa tiene jardín.
    - La cocina está en el apartamento.
    - La habitación es pequeña.
  nl.a2.unit99.lesson01.teach.telefoon:
    title: Teléfonos
    gloss: el teléfono / la batería / la cámara
    note: Palabras de teléfonos para comparar modelos. *Goed* significa «bueno».
    example_gloss:
    - Mi teléfono tiene cámara.
    - La batería es buena.
    - Tengo un teléfono.
  nl.a2.unit99.lesson01.teach.vakantie:
    title: Vacaciones
    gloss: las vacaciones / el hotel / la playa / la ciudad / el viaje
    note: Palabras de viajes del primer curso, que aquí usamos para comparar opciones de vacaciones.
    example_gloss:
    - El hotel está cerca de la playa.
    - Las vacaciones son largas.
    - La ciudad es grande.
  nl.a2.unit99.lesson01.teach.gn_groter:
    title: 'El comparativo: añade -er'
    gloss: grande, más grande; pequeño, más pequeño; bonito, más bonito; caro, más caro; barato, más barato; largo, más largo
    note: 'Añade -er al adjetivo. Ojo con la ortografía: *groot* pierde una o (*groter*), *goedkoop* pierde una o (*goedkoper*) y *duur* recibe una d antes de -er (*duurder*). *Mooi* simplemente pasa a *mooier*.'
  nl.a2.unit99.lesson01.teach.gn_dan:
    title: Comparar con dan
    gloss: La casa es más grande que el apartamento. Mi habitación es más pequeña que tu habitación.
    note: Después de un comparativo (forma en -er), lo que se compara va detrás de *dan* («que»).
  nl.a2.unit99.lesson01.teach.zin_duurder:
    title: Una comparación de teléfonos
    gloss: Mi teléfono es más caro que el tuyo.
    note: '*Mijn* es «mi» y *jouw* es «tu» (informal). En el habla cotidiana, *jouw* suele ser el átono *je*: *je telefoon*.'
  nl.a2.unit99.lesson02.teach.kiezen:
    title: Palabras para elegir
    gloss: cuál / este (con palabras de) / este (con palabras het) / ese / de todos
    note: '*Deze* va con palabras de en singular (deze telefoon) y con plurales; *dit* va con palabras het en singular (dit hotel). *Die* significa «ese» (die telefoon).'
    example_gloss:
    - ¿Qué teléfono es caro?
    - Este teléfono es caro y ese teléfono es barato.
    - Este hotel es bonito y ese teléfono es caro.
  nl.a2.unit99.lesson02.teach.gn_superlatief:
    title: 'El superlativo: het + adjetivo + -st'
    gloss: grande, el más grande; pequeño, el más pequeño; bonito, el más bonito; caro, el más caro; barato, el más barato; largo, el más largo
    note: 'Después de *is*, usa *het* y añade -st. Los cambios de ortografía del comparativo no se aplican: la vocal doble se mantiene (*het grootst*, *het goedkoopst*).'
  nl.a2.unit99.lesson02.teach.gn_superlatief_e:
    title: 'El superlativo delante de un sustantivo: -ste'
    gloss: Este es el teléfono más caro. Esta es la casa más pequeña. Esta es la habitación más barata. Este es el jardín más bonito.
    note: 'Delante de un sustantivo se añade -ste: *de duurste telefoon*, *het kleinste huis*. Después de *is* sin sustantivo, valen tanto *het goedkoopst* como *het goedkoopste*.'
  nl.a2.unit99.lesson02.teach.gn_onregelmatig:
    title: 'Irregulares: goed y veel'
    gloss: bueno, mejor, el mejor; mucho/muchos, más, el que más. Mi teléfono es mejor que tu teléfono. Esta es la mejor cámara. Este hotel tiene más habitaciones.
    note: '*Goed* y *veel* no siguen la regla: *goed - beter - best* y *veel - meer - meest*. Delante de un sustantivo terminan en -e: *de beste camera*, *de meeste kamers* (con una palabra het: *het beste huis*).'
  nl.a2.unit99.lesson02.teach.zin_goedkoopst:
    title: De todos los hoteles
    gloss: De todos los hoteles, este es el más barato.
    note: '*Van alle* indica el grupo entre el que eliges.'
  nl.a2.unit99.lesson03.teach.gelijk:
    title: Igualdad y desigualdad
    gloss: igual de / no tan / como
    note: '*Even ... als* dice que dos cosas son iguales; *niet zo ... als* dice que la primera es menos.'
    example_gloss:
    - Mi casa es igual de grande que tu casa.
    - El hotel no es tan caro como el apartamento.
    - La cocina es igual de bonita que el jardín.
  nl.a2.unit99.lesson03.teach.gn_even:
    title: 'Igualdad: even ... als'
    gloss: Mi teléfono es igual de caro que tu teléfono.
    note: 'Usa el adjetivo básico (sin -er) entre *even* y *als*: *even duur als*.'
  nl.a2.unit99.lesson03.teach.gn_niet_zo:
    title: 'Menos: niet zo ... als'
    gloss: El hotel no es tan grande como el apartamento.
    note: 'De nuevo el adjetivo básico: *niet zo groot als*. La segunda cosa es más grande.'
  nl.a2.unit99.lesson03.teach.gn_dan_als:
    title: ¿Dan o als?
    gloss: El hotel es más barato que el apartamento. El hotel es igual de barato que el apartamento.
    note: 'El comparativo (-er) va con *dan*. *Even* y *niet zo* van con el adjetivo básico y *als*. Nunca los mezcles: no se dice *even goedkoper als*.'
  nl.a2.unit99.lesson04.teach.lange_woorden:
    title: Adjetivos más largos
    gloss: interesante / práctico / moderno / cómodo
    note: Estos adjetivos más largos son los que suelen llevar *meer* y *het meest*.
    example_gloss:
    - El viaje a la ciudad es interesante.
    - El teléfono es práctico.
    - El apartamento es moderno y cómodo.
  nl.a2.unit99.lesson04.teach.gn_meer:
    title: 'Adjetivos largos: meer y het meest'
    gloss: interesante, más interesante, el más interesante; moderno, más moderno, el más moderno
    note: Con los adjetivos más largos, se coloca *meer* («más») o *het meest* («el más») delante del adjetivo sin cambios. Este es el patrón que se enseña aquí; formas como *interessanter* también aparecen en el neerlandés cotidiano.
  nl.a2.unit99.lesson04.teach.gn_kort_lang:
    title: ¿Corto o largo?
    gloss: 'Corto: caro, más caro, el más caro. Largo: cómodo, más cómodo, el más cómodo.'
    note: Los adjetivos cortos llevan -er y -st. Los adjetivos más largos, sobre todo los que terminan en -ant, -isch, -eel o -abel, suelen llevar *meer* y *het meest*. En ambos patrones se usa *dan* después del comparativo.
  nl.a2.unit99.lesson04.teach.zin_comfortabel:
    title: Elegir un hotel
    gloss: ¿Qué hotel es el más cómodo? Este hotel es el más cómodo, pero también es el más caro.
    note: '*Welk* va con palabras het en singular (welk hotel); *welke* va con palabras de y con todos los plurales.'
  nl.a2.unit99.lesson05.teach.reading:
    title: La búsqueda de hotel de Noor
    gloss: Noor busca un hotel para sus vacaciones. El Hotel Strand es el más caro, pero también es el más bonito. El Hotel Stad es más barato que el Hotel Strand, pero no es tan cómodo como el Hotel Strand. El Hotel Tuin es igual de barato que el Hotel Stad. Noor elige el Hotel Tuin, porque las habitaciones son más grandes.
    note: Fíjate en cómo se comparan los tres hoteles entre sí.
    glosses:
      zoekt: busca
      voor: para
      haar: su
      kiest: elige
      want: porque
      kamers: habitaciones
      zijn: son
  nl.a2.unit99.lesson06.teach.beurt01:
    title: Lotte pide una opinión
    gloss: 'Lotte: Hola, Omar, ¿qué teléfono te parece el mejor?'
  nl.a2.unit99.lesson06.teach.beurt02:
    title: Omar menciona una ventaja y un inconveniente
    gloss: 'Omar: Este teléfono tiene la mejor cámara, pero también es el más caro.'
  nl.a2.unit99.lesson06.teach.beurt03:
    title: Lotte sugiere un teléfono más barato
    gloss: 'Lotte: Ese teléfono es más barato que este, y la batería es igual de buena.'
  nl.a2.unit99.lesson06.teach.beurt04:
    title: Omar pregunta por el aspecto
    gloss: 'Omar: ¿Ese teléfono también es tan bonito como este?'
  nl.a2.unit99.lesson06.teach.beurt05:
    title: Lotte responde
    gloss: 'Lotte: No, no es tan bonito como este, pero es mucho más barato.'
  nl.a2.unit99.lesson06.teach.beurt06:
    title: Omar se decide
    gloss: 'Omar: Bien, me quedo con ese teléfono.'
