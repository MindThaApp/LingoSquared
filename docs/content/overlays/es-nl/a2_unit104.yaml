course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para referirse a personas y cosas ya mencionadas.
  learning_goal: Referirte a personas y cosas con pronombres de objeto y er, sin repetirlas.
units:
  nl.a2.unit104.hem_haar_ze_er:
    title: Él, ella, ellos y er
    description: Usa los pronombres de objeto y er (con números y preposiciones) para hablar de regalos, de pedir prestado y de devolver cosas sin repetirte.
lessons:
  nl.a2.unit104.lesson01.cadeaus_en_boeken:
    title: Regalos y libros
  nl.a2.unit104.lesson02.hem_haar_het_ze:
    title: Hem, haar, het y ze
  nl.a2.unit104.lesson03.mij_of_me:
    title: ¿Mij o me? ¿Jou o je?
  nl.a2.unit104.lesson04.hoeveel_er:
    title: ¿Cuántos? Ik heb er drie
  nl.a2.unit104.lesson05.erover_ermee:
    title: Erover, ervan, ermee, ernaar
  nl.a2.unit104.lesson06.boeken_terugbrengen:
    title: Devolver libros
teaching:
  nl.a2.unit104.lesson01.teach.plaatsen:
    title: Lugares y celebraciones
    gloss: la tienda / la biblioteca / el cumpleaños / la fiesta
    note: Es posible que conozcas estas palabras del A1; aquí preparan el escenario para hablar de regalos y de pedir prestado.
    example_gloss:
    - Voy a la biblioteca.
    - Noor tiene una fiesta.
    - En la tienda compro un regalo.
  nl.a2.unit104.lesson01.teach.cadeaus:
    title: Regalos y cosas que se piden prestadas
    gloss: el regalo / el libro / las flores / el bolígrafo / el paraguas
    note: '*Het cadeau* y *het boek* son palabras het; *de pen* y *de paraplu* son palabras de. *De bloemen* es plural.'
    example_gloss:
    - Tengo un regalo para Noor.
    - ¿Me prestas tu bolígrafo?
    - Compro flores.
  nl.a2.unit104.lesson01.teach.werkwoorden:
    title: Comprar, dar, pedir prestado, devolver
    gloss: comprar / dar / pedir prestado / devolver (traer de vuelta) / devolver (dar de vuelta)
    note: '*Lenen* aquí significa pedir prestado. *Terugbrengen* y *teruggeven* son separables: *ik breng het terug*, *ik geef het terug*.'
    example_gloss:
    - Compro flores.
    - ¿Puedo pedir prestado el bolígrafo?
    - Devuelvo el libro.
    - Lo devuelvo.
  nl.a2.unit104.lesson01.teach.vrienden:
    title: Los tres amigos
    gloss: Lotte, Omar y Noor son amigos.
  nl.a2.unit104.lesson01.teach.gn_objectvormen:
    title: Los pronombres de complemento
    gloss: yo → me/mí; tú → te/ti; él → lo/le; ella → la/le; ello → lo; nosotros → nos; vosotros/ustedes → os/los; ellos → los
    note: 'Después de un verbo se usa la forma de complemento: *Ik zie hem*. *Me/je/ze* son las formas habituales en la lengua hablada; *mij/jou* son las formas acentuadas. Para varias personas o cosas se dice *ze*. *Hen* y *hun* existen, sobre todo en la lengua escrita: al hablar puedes evitarlos.'
  nl.a2.unit104.lesson01.teach.gn_nadruk:
    title: Con énfasis o sin él
    gloss: Te veo. Te veo a ti, no a él. Él me ve. Él me ve a mí, no a ella.
    note: Usa *me* y *je* normalmente. Usa *mij* y *jou* cuando quieras destacar a la persona o contrastarla con otra.
  nl.a2.unit104.lesson01.teach.zinnen:
    title: Pronombres en frases
    gloss: Él me da un regalo. Yo le doy flores. Lotte nos ve.
  nl.a2.unit104.lesson02.teach.spullen:
    title: Más cosas y una palabra interrogativa
    gloss: la bicicleta / el bolso / la tarta / la tarjeta / dónde
    note: '*Taart* y *kaart* son útiles para cumpleaños y fiestas.'
    example_gloss:
    - ¿Dónde está el bolso?
    - La tarta es para la fiesta.
    - Tengo una tarjeta para Lotte.
  nl.a2.unit104.lesson02.teach.bezit:
    title: Mío y tuyo
    gloss: mi / tu / de
    note: '*Je* puede significar «te» o «tu»: *Ik zie je* (te veo) y *je boek* (tu libro).'
    example_gloss:
    - Tengo mi bolígrafo.
    - Tengo tu libro.
    - El libro de Noor.
  nl.a2.unit104.lesson02.teach.gn_het_hem:
    title: Het para las palabras het, hem para las palabras de
    gloss: ¿El libro? Lo tengo. ¿El bolígrafo? Lo tengo. ¿El bolso? Lo veo.
    note: 'Para las cosas, el neerlandés elige el pronombre según el artículo: una palabra het se convierte en *het* y una palabra de en singular se convierte en *hem*. No uses *het* para una palabra de.'
  nl.a2.unit104.lesson02.teach.gn_ze:
    title: Ze para los plurales
    gloss: ¿Las flores? Las compro. ¿Lotte y Omar? Los veo.
    note: '*Ze* se refiere a más de una cosa o persona, en la lengua hablada. *Hen* también existe para personas, pero sobre todo por escrito.'
  nl.a2.unit104.lesson02.teach.zinnen:
    title: Cuatro pronombres de complemento
    gloss: Lo veo. La veo. Lo veo. Los veo.
  nl.a2.unit104.lesson03.teach.werkwoorden:
    title: Verbos y preposiciones con personas
    gloss: llamar / ayudar / conocer / para / con
    note: '*Kennen* se usa para conocer a una persona.'
    example_gloss:
    - Te llamo.
    - ¿Puedes ayudarme?
    - No lo conozco.
    - El regalo es para ella.
    - Voy con vosotros.
  nl.a2.unit104.lesson03.teach.gn_contrast:
    title: ¿Me/je o mij/jou?
    gloss: Te ayudo. Te ayudo a ti, no a él.
    note: 'Normalmente usa *me* y *je*. Cuando contrastas o destacas a la persona, usa *mij* y *jou*: *Ik help jou, niet hem.*'
  nl.a2.unit104.lesson03.teach.gn_voorzetsel:
    title: Después de una preposición
    gloss: El regalo es para mí. El regalo es para ti. Voy con ella.
    note: Después de una preposición (*voor, met, naar, van*) las formas estándar son *mij* y *jou*. Cuando no hay énfasis, *me* y *je* también son muy frecuentes (*voor me*, *met je*).
  nl.a2.unit104.lesson03.teach.gn_jullie:
    title: Te, vosotros, ellos
    gloss: Te llamo. Os llamo. Los llamo.
    note: '*Je* es una persona. *Jullie* es más de una persona a la que hablas. *Ze* es más de una persona de la que hablas.'
  nl.a2.unit104.lesson04.teach.getallen:
    title: Números y cantidad
    gloss: uno / dos / tres / cuatro / cinco / ninguno, no / cuántos
    note: '*Geen* significa ninguno o no.'
    example_gloss:
    - Tengo dos libros.
    - No tengo bolígrafo.
    - ¿Cuántos libros tienes?
    - Tengo tres bolígrafos.
  nl.a2.unit104.lesson04.teach.gn_er_getal:
    title: Er + número
    gloss: ¿Cuántos libros tienes? Tengo tres.
    note: 'Cuando omites la cosa y solo das un número, pon *er* delante del número: *Ik heb er drie.* Sin *er* la frase está incompleta.'
  nl.a2.unit104.lesson04.teach.gn_er_geen:
    title: Er + één / geen
    gloss: ¿Tienes un bolígrafo? Sí, tengo uno. ¿Tienes bolsos? No, no tengo ninguno.
    note: '*Een* pasa a ser *één* con *er*, y *geen* también va después de *er*: *Ik heb er geen.*'
  nl.a2.unit104.lesson04.teach.gn_er_ze:
    title: ¿Ze o er?
    gloss: ¿Los libros? Los tengo. ¿Libros? Tengo tres.
    note: Usa *ze* para cosas concretas que ambos conocéis. Usa *er* cuando dices cuántos hay.
  nl.a2.unit104.lesson04.teach.gn_er_kopen:
    title: Er con otros verbos
    gloss: Quiero comprar dos. Pido prestados cinco.
    note: '*Er* se queda cerca del verbo. Con *willen* va antes del número y del infinitivo: *Ik wil er twee kopen.*'
  nl.a2.unit104.lesson05.teach.werkwoorden:
    title: Verbos con preposición
    gloss: hablar / mirar / escribir / querer, sujetar / contento / sobre / a, hacia
    note: '*Praten over* = hablar de, *kijken naar* = mirar, *schrijven met* = escribir con, *houden van* = querer, amar, *blij zijn met* = estar contento con.'
    example_gloss:
    - Hablo del regalo.
    - Miro el libro.
    - Escribo con el bolígrafo.
    - Me encantan las flores.
    - Estoy contento con el regalo.
  nl.a2.unit104.lesson05.teach.gn_er_voorzetsel:
    title: Er + preposición para cosas
    gloss: ¿El regalo? Hablo de él. ¿El libro? Lo miro. ¿El bolígrafo? Escribo con él. ¿Flores? Me encantan.
    note: 'Para las cosas no se dice *over het*, *met hem*. Se une *er* a la preposición: *erover, ernaar, ermee, ervan*.'
  nl.a2.unit104.lesson05.teach.gn_gesplitst:
    title: Er y la preposición se pueden separar
    gloss: Estoy contento con ello. ¿Hablamos de eso mañana?
    note: 'En muchas frases *er* va al principio y la preposición al final: *Ik ben er blij mee.* También es posible *Ik ben ermee blij*, pero *Ik ben er blij mee* es la forma neutra que se enseña aquí.'
  nl.a2.unit104.lesson05.teach.gn_personen:
    title: Con personas se mantiene la preposición
    gloss: Hablo de Noor. Hablo de ella. Miro a Omar. Lo miro a él.
    note: 'Con personas no se usa *er*: se usa la preposición más *hem, haar, ze*. *Erover* y formas parecidas se refieren a cosas e ideas.'
  nl.a2.unit104.lesson05.teach.lezen:
    title: El mensaje de Noor
    gloss: Hola, Omar, ¡gracias por las flores! Me encantan. El libro de Lotte es bonito, estoy contenta con él. Todavía tengo tu bolígrafo. Mañana te lo devuelvo. Lotte tiene tu paraguas y te lo devuelve el viernes.
    note: Busca a qué cosa se refiere cada pronombre.
    glosses:
      bedankt: gracias
      vrijdag: viernes
      mooi: bonito, bello
      nog: todavía
  nl.a2.unit104.lesson06.teach.lotte_bibliotheek:
    title: Lotte dice adónde va
    gloss: 'Lotte: Hola, Omar, mañana voy a la biblioteca.'
  nl.a2.unit104.lesson06.teach.omar_boeken:
    title: Omar pide un favor
    gloss: 'Omar: ¿Puedes devolver mis libros? Tengo tres.'
  nl.a2.unit104.lesson06.teach.lotte_ja:
    title: Lotte acepta y pregunta por un regalo
    gloss: 'Lotte: Claro, mañana los devuelvo. ¿También tienes un regalo para Noor?'
  nl.a2.unit104.lesson06.teach.omar_bloemen:
    title: Omar dice cuál es el regalo
    gloss: 'Omar: Sí, le compro flores. Le encantan.'
  nl.a2.unit104.lesson06.teach.lotte_later:
    title: Lotte propone hablar más tarde
    gloss: 'Lotte: ¡Qué bien! ¿Hablamos de eso más tarde?'
  nl.a2.unit104.lesson06.teach.omar_bel:
    title: Omar promete llamar
    gloss: 'Omar: Vale, te llamo esta noche.'
exercises:
  nl.a2.unit104.lesson01.exercise01.kies_geeft:
    instruction: 'Elige la frase que significa: Él me da un regalo.'
    correct_option: Hij geeft me een cadeau.
    distractors:
    - Hij geeft ik een cadeau.
    - Hij geeft jij een cadeau.
    - Hij geeft hij een cadeau.
    accepted_answers:
    - value: Hij geeft me een cadeau.
      status: correct
    feedback: '*Hij geeft me een cadeau* = Él me da un regalo. Después del verbo se necesita la forma de complemento *me*.'
    prompt_blocks:
    - Él me da un regalo.
  nl.a2.unit104.lesson01.exercise02.kies_haar:
    instruction: 'Elige la frase que significa: Yo le doy flores.'
    correct_option: Ik geef haar bloemen.
    distractors:
    - Ik geef hem bloemen.
    - Ik geef ons bloemen.
    - Ik geef jullie bloemen.
    accepted_answers:
    - value: Ik geef haar bloemen.
      status: correct
    feedback: '*Haar* es la forma de complemento para una mujer: *Ik geef haar bloemen*.'
    prompt_blocks:
    - Le doy flores.
