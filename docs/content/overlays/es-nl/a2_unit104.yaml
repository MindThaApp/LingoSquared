      - left: Hij ziet jullie.
        right: Él os ve a vosotros.
      - left: Hij ziet me.
        right: Él me ve.
      - left: Hij ziet je.
        right: Él te ve.
      status: correct
    feedback: '*Hem, haar, ons, jullie, me* y *je* son formas de complemento.'
    pairs:
