    correct_option: Het boek? Ik heb het.
    distractors:
    - Het boek? Ik heb hem.
    - Het boek? Ik heb ze.
    - Het boek? Ik heb haar.
    accepted_answers:
    - value: Het boek? Ik heb het.
      status: correct
    feedback: '*Het boek* es una palabra con *het*, así que se dice het.'
    prompt_blocks:
