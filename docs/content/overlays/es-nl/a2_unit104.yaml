      right: Lo veo.
    - left: Ik zie haar.
      right: La veo.
    - left: Hij ziet ons.
      right: Él nos ve.
    - left: Hij ziet jullie.
      right: Él os ve a vosotros.
    - left: Hij ziet me.
      right: Él me ve.
    - left: Hij ziet je.
      right: Él te ve.
