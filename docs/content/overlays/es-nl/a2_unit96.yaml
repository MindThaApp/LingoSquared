course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para pedir información con cortesía.
  learning_goal: Haz preguntas indirectas corteses con waar, wanneer, hoe laat, wie, wat y of, con el verbo al final de la oración subordinada.
units:
  nl.a2.unit96.weet_u_waar:
    title: ¿Sabes dónde...?
    description: Pide información con cortesía en estaciones, oficinas y museos usando preguntas indirectas.
lessons:
  nl.a2.unit96.lesson01.weet_u_waar:
    title: ¿Sabes dónde está la estación?
  nl.a2.unit96.lesson02.wanneer_en_hoe_laat:
    title: Cuándo y a qué hora
  nl.a2.unit96.lesson03.weet_u_of:
    title: ¿Sabes si está abierto?
  nl.a2.unit96.lesson04.kunt_u_mij_zeggen:
    title: ¿Podrías decirme...?
  nl.a2.unit96.lesson05.omars_bericht:
    title: El mensaje de Omar
  nl.a2.unit96.lesson06.lotte_en_omar:
    title: Lotte y Omar en el museo
teaching:
  nl.a2.unit96.lesson01.teach.plaatsen:
    title: Lugares
    gloss: la estación / la oficina / el museo / la biblioteca / la ventanilla / la salida
    note: Son lugares por los que se pregunta a menudo.
    example_gloss:
    - ¿Dónde está la estación?
    - ¿Dónde está la salida?
  nl.a2.unit96.lesson01.teach.weten:
    title: Saber y dónde
    gloss: saber / dónde / usted / tú / tú (con énfasis)
    note: '*Weet* es la forma que se usa con u, je y jij.'
    example_gloss:
    - ¿Sabe? (formal)
    - ¿Sabes? (informal)
    - ¿Sabes? (informal)
  nl.a2.unit96.lesson01.teach.open:
    title: Abierto y cerrado
    gloss: abierto / cerrado
    example_gloss:
    - El museo está abierto.
    - La oficina está cerrada.
  nl.a2.unit96.lesson01.teach.gn_indirect:
    title: De la pregunta directa a la indirecta
    gloss: Una pregunta directa y la misma pregunta hecha de forma indirecta.
    note: 'En una pregunta directa el verbo va en segunda posición: *Waar IS het station?* Después de *Weet u ...* la pregunta pasa a ser una oración subordinada, así que el verbo va al final de esa oración: *Weet u waar het station IS?* En español el verbo no se mueve así: en neerlandés es una regla propia de la subordinada.'
  nl.a2.unit96.lesson01.teach.gn_u_je:
    title: U o je
    gloss: Formas formal e informal de preguntar lo mismo.
    note: Usa *u* con desconocidos y en oficinas, y *je* o *jij* con amigos. La forma verbal *weet* no cambia. Lotte y Omar usan *je*.
  nl.a2.unit96.lesson01.teach.zinnen:
    title: Dos preguntas
    gloss: ¿Sabe dónde está el museo? ¿Sabes dónde está la biblioteca?
  nl.a2.unit96.lesson02.teach.vraagwoorden:
    title: Palabras interrogativas
    gloss: cuándo / a qué hora / quién / qué
    note: Estas palabras interrogativas funcionan como *waar* en una pregunta indirecta.
    example_gloss:
    - ¿Cuándo está abierto el museo?
    - ¿Qué hora es?
    - ¿Quién es? Es Lotte.
    - ¿Qué es eso? Es un museo.
  nl.a2.unit96.lesson02.teach.werkwoorden:
    title: Verbos útiles
    gloss: abrir / cerrar / salir / costar
    example_gloss:
    - El museo abre a las diez.
    - La oficina cierra a las cinco.
    - El tren sale a las nueve.
    - El billete cuesta diez euros.
  nl.a2.unit96.lesson02.teach.tijd:
    title: Tren y hora
    gloss: el tren / el billete / la hora / mañana / hoy / diez / cinco / nueve
    example_gloss:
    - ¿Cuánto cuesta el billete? Cuesta diez euros.
    - ¿Cuándo sale el tren? Mañana.
    - Es Noor.
    - La oficina está cerca de la estación.
  nl.a2.unit96.lesson02.teach.gn_wanneer:
    title: Wanneer y hoe laat
    gloss: Preguntas indirectas con wanneer y hoe laat.
    note: 'La palabra interrogativa se queda delante y el verbo va al final: *wanneer het museum opent*, *hoe laat de trein vertrekt*. Usa *wanneer* para un día o un momento y *hoe laat* para la hora del reloj.'
  nl.a2.unit96.lesson02.teach.gn_wie_wat:
    title: Wie y wat
    gloss: Preguntas indirectas con wie y wat.
    note: '*Wie* y *wat* siguen el mismo patrón. El verbo va al final: *wie dat is*, *wat het kaartje kost*.'
  nl.a2.unit96.lesson02.teach.zinnen:
    title: Dos preguntas
    gloss: ¿Sabes a qué hora cierra la oficina? ¿Sabe cuándo abre el museo?
  nl.a2.unit96.lesson03.teach.of:
    title: Of, ja, nee
    gloss: si / sí / no / no
    example_gloss:
    - ¿Está abierto el museo? Sí.
    - ¿Está abierta la oficina? No.
  nl.a2.unit96.lesson03.teach.gn_of:
    title: 'Preguntas de sí o no: of'
    gloss: Una pregunta de sí o no formulada de forma indirecta con of.
    note: 'Una pregunta de sí o no no tiene palabra interrogativa, así que la pregunta indirecta empieza con *of* (si). El verbo va al final: *of de bibliotheek open IS*.'
  nl.a2.unit96.lesson03.teach.gn_contrast:
    title: ¿Waar o of?
    gloss: Compara una pregunta con palabra interrogativa y una de sí o no.
    note: Conserva la palabra interrogativa (*waar, wanneer, hoe laat, wie, wat*) cuando la hay. Si la pregunta se puede responder con *ja* o *nee*, usa *of*. Nunca uses las dos.
  nl.a2.unit96.lesson03.teach.gn_weet_niet:
    title: Ik weet niet ...
    gloss: Decir que no sabes algo.
    note: Después de *Ik weet niet* sigue la misma oración subordinada, con el verbo al final. Para una respuesta corta, di *Ik weet het niet.*
  nl.a2.unit96.lesson03.teach.zinnen:
    title: Dos respuestas
    gloss: No lo sé. No sé si la oficina está abierta.
  nl.a2.unit96.lesson04.teach.richting:
    title: Direcciones
    gloss: todo recto / izquierda / derecha / cómo / vengo, llego / en, a
    note: '*Hoe kom ik bij ...?* sirve para preguntar por el camino.'
    example_gloss:
    - La estación está todo recto.
    - La salida está a la izquierda.
    - La oficina está a la derecha.
    - ¿Cómo llego a la estación?
  nl.a2.unit96.lesson04.teach.beleefd:
    title: Palabras corteses
    gloss: perdón / puede (formal) / puedes (informal) / me / me (átono) / decir / quiero / con gusto (me gustaría) / saber
    note: '*Mij* y *me* significan los dos «me». *Kunt u* va con u y *kun je* va con je.'
    example_gloss:
    - Perdone, ¿dónde está la ventanilla?
    - Me gustaría saber dónde está la ventanilla.
  nl.a2.unit96.lesson04.teach.uitje:
    title: Una salida
    gloss: nosotros / ir / a
    example_gloss:
    - Mañana vamos al museo.
    - ¿Sabes cuándo vamos al museo?
  nl.a2.unit96.lesson04.teach.gn_kunt_u:
    title: Kunt u mij zeggen ...?
    gloss: Una forma cortés de pedir información.
    note: 'En esta pregunta el verbo va primero: *Kunt u* / *Kun je*. Después viene *mij zeggen* y la pregunta indirecta con el verbo al final. Con je la forma habitual es *kun je*.'
  nl.a2.unit96.lesson04.teach.gn_wil_weten:
    title: Ik wil graag weten ...
    gloss: Una afirmación cortés en lugar de una pregunta.
    note: '*Ik wil graag weten* es una afirmación cortés con la que se pide información. Después sigue la pregunta indirecta con el verbo al final.'
  nl.a2.unit96.lesson04.teach.gn_hoe_kom:
    title: Hoe ik ... kom
    gloss: Preguntar el camino de forma indirecta.
    note: '*Hoe kom ik bij het station?* pasa a ser *hoe ik bij het station kom*: el verbo *kom* se desplaza detrás de *bij het station*, al final.'
  nl.a2.unit96.lesson04.teach.zinnen:
    title: En la estación
    gloss: Perdone, ¿podría decirme dónde está la ventanilla? Me gustaría saber a qué hora sale el tren.
  nl.a2.unit96.lesson05.teach.reading:
    title: El mensaje de Omar a Lotte
    gloss: 'Hola, Lotte: mañana vamos al museo. No sé dónde está. ¿Sabes cómo llego a la estación? Me gustaría saber a qué hora sale el tren. ¿Sabes también si el museo está abierto? Saludos, Omar'
    note: Fíjate en que Omar usa tres fórmulas distintas para empezar sus preguntas.
    glosses:
      Hoi: hola
      Groeten: saludos
      ook: también
  nl.a2.unit96.lesson06.teach.omar_vraagt_waar:
    title: Habla Omar
    gloss: Hola, Lotte, ¿sabes dónde está el museo?
  nl.a2.unit96.lesson06.teach.lotte_wijst:
    title: Habla Lotte
    gloss: Sí, ve todo recto y luego a la izquierda.
  nl.a2.unit96.lesson06.teach.omar_vraagt_tijd:
    title: Habla Omar
    gloss: ¿Sabes también a qué hora abre?
  nl.a2.unit96.lesson06.teach.lotte_tijd:
    title: Habla Lotte
    gloss: Abre a las diez.
  nl.a2.unit96.lesson06.teach.omar_vraagt_open:
    title: Habla Omar
    gloss: ¿Sabes también si el museo está abierto hoy?
  nl.a2.unit96.lesson06.teach.lotte_weet_niet:
    title: Habla Lotte
    gloss: No sé si hoy está abierto.
