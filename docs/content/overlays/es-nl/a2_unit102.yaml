course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para corregir malentendidos con niet y geen.
  learning_goal: 'Decir todavía no, ya no y ninguno: colocar niet correctamente, elegir entre niet y geen, y usar nog niet, niet meer y geen ... meer.'
units:
  nl.a2.unit102.nog_niet_geen_meer:
    title: Todavía no, ninguno, ya no
    description: Corrige un malentendido sobre reservas, pedidos y citas con niet, geen, nog niet, niet meer y geen ... meer.
lessons:
  nl.a2.unit102.lesson01.niet_en_geen:
    title: Niet y geen
  nl.a2.unit102.lesson02.plaats_van_niet:
    title: ¿Dónde va niet?
  nl.a2.unit102.lesson03.niet_of_geen:
    title: Elegir entre niet y geen
  nl.a2.unit102.lesson04.nog_niet_nog_geen:
    title: Todavía no
  nl.a2.unit102.lesson05.niet_meer_geen_meer:
    title: Ya no, no más
  nl.a2.unit102.lesson06.lotte_en_omar_kamer:
    title: Lotte, Omar y la habitación
teaching:
  nl.a2.unit102.lesson01.teach.restaurant:
    title: En el restaurante
    gloss: el restaurante / la mesa / la reserva / el pedido
    note: Estos cuatro sustantivos vuelven a aparecer en toda la unidad.
    example_gloss:
    - Tengo una mesa en el restaurante.
    - Omar tiene una reserva.
    - Noor tiene un pedido.
  nl.a2.unit102.lesson01.teach.hotel:
    title: En el hotel
    gloss: el hotel / la habitación / la reserva
    note: '*Hotel* es una palabra het; *kamer* y *boeking* son palabras de.'
    example_gloss:
    - El hotel está en Utrecht.
    - Lotte tiene una habitación.
    - Conozco la reserva.
  nl.a2.unit102.lesson01.teach.afspraak:
    title: Citas y mensajes
    gloss: la cita / el médico / el tiempo / el mensaje
    note: '*Tijd* no tiene plural con este uso: designa el tiempo en general.'
    example_gloss:
    - Tengo una cita con el médico.
    - Omar tiene tiempo.
    - Noor tiene un mensaje.
  nl.a2.unit102.lesson01.teach.gn_niet_einde:
    title: Niet al final
    gloss: No trabajo. No conozco el restaurante.
    note: En una frase corta, *niet* va al final. Un complemento determinado (*het restaurant*, *de dokter*) va antes de *niet*.
  nl.a2.unit102.lesson01.teach.gn_geen:
    title: Geen en lugar de een
    gloss: Tengo una mesa. No tengo ninguna mesa.
    note: '*Geen* sustituye a *een* y niega el sustantivo. Normalmente no se dice *niet een*.'
  nl.a2.unit102.lesson01.teach.zinnen:
    title: Tres frases negativas
    gloss: No tengo reserva. No conozco el hotel. No tengo tiempo.
  nl.a2.unit102.lesson02.teach.eigenschappen:
    title: Palabras descriptivas
    gloss: abierto / listo / caro / grande / libre
    note: Estas palabras describen un sustantivo después de *is*.
    example_gloss:
    - El restaurante está abierto.
    - La habitación es grande.
    - La mesa está libre.
  nl.a2.unit102.lesson02.teach.werkwoorden:
    title: Verbos para reservas
    gloss: llamar / reservar / venir / poder / ir; llamado / reservado
    note: 'Muchos verbos forman el pretérito perfecto con *heb* + participio: *Ik heb gebeld*. Después de *kan* va un segundo verbo en infinitivo: *Ik kan komen*.'
    example_gloss:
    - Lotte ha llamado.
    - He reservado la habitación.
    - Puedo venir.
    - Voy al restaurante.
  nl.a2.unit102.lesson02.teach.tijd:
    title: Palabras de tiempo
    gloss: hoy / mañana / a menudo
    note: Las palabras de tiempo suelen ir antes de *niet*.
    example_gloss:
    - Vengo hoy.
    - Omar llama mañana.
    - Noor llama a menudo.
  nl.a2.unit102.lesson02.teach.gn_niet_voor:
    title: Niet antes de ...
    gloss: La habitación no es grande. No voy al restaurante. No puedo venir. No he llamado.
    note: '*Niet* va delante de un adjetivo (*niet groot*), delante de un complemento con preposición (*niet naar het restaurant*) y delante del segundo verbo (*niet komen*, *niet gebeld*).'
  nl.a2.unit102.lesson02.teach.gn_niet_na:
    title: Niet después de ...
    gloss: No he reservado la habitación. Mañana no vengo.
    note: Un complemento directo determinado (*de kamer*) y una palabra de tiempo (*morgen*, *vandaag*) van antes de *niet*. Si después viene un participio u otro verbo, *niet* va delante de él; en una oración simple como *Ik kom morgen niet*, *niet* va al final.
  nl.a2.unit102.lesson03.teach.meervoud:
    title: Plurales y nombres no contables
    gloss: las habitaciones / las mesas / el sitio / el dinero / el café
    note: '*Kamers* y *tafels* son plurales. *Geld* y *koffie* no llevan *een* ni plural en este uso.'
    example_gloss:
    - Hay habitaciones.
    - Hay café.
    - Tenemos mesas.
    - Tengo dinero.
  nl.a2.unit102.lesson03.teach.gn_geen_regels:
    title: Cuándo usar geen
    gloss: No tengo cita. No hay habitaciones. No tengo tiempo.
    note: 'Usa *geen* cuando el sustantivo lleva *een*, no lleva artículo o está en plural: *een afspraak*, *tijd*, *kamers*.'
  nl.a2.unit102.lesson03.teach.gn_niet_regels:
    title: ¿Niet o geen?
    gloss: No conozco al médico. El café no es caro. No es un restaurante.
    note: Usa *niet* con un sustantivo determinado (*de dokter*), con un adjetivo (*duur*) y con verbos. *Het is een restaurant* pasa a *Het is geen restaurant*.
  nl.a2.unit102.lesson04.teach.betalen:
    title: Pagar y confirmar
    gloss: la cuenta / la confirmación / pagado / pedido / allí
    note: '*Betaald* y *besteld* son participios, como *gebeld* y *geboekt*.'
    example_gloss:
    - He pagado la cuenta.
    - La confirmación está aquí.
    - Noor ha pedido café.
  nl.a2.unit102.lesson04.teach.gn_nog_niet:
    title: Nog niet = todavía no
    gloss: Todavía no he reservado la habitación. La habitación todavía no está lista.
    note: '*Nog niet* significa «todavía no»: algo que aún está por venir. Mantiene el mismo lugar que *niet*, con *nog* delante.'
  nl.a2.unit102.lesson04.teach.gn_nog_geen:
    title: Nog geen = todavía no hay ...
    gloss: Todavía no he reservado ninguna habitación. Todavía no tenemos ningún mensaje.
    note: '*Nog geen* + sustantivo significa «todavía no ... ». *Nog* va delante de *geen*.'
  nl.a2.unit102.lesson04.teach.antwoord:
    title: Respuestas cortas
    gloss: ¿Está lista la habitación? Todavía no. ¿Tienes mesa? Todavía no.
  nl.a2.unit102.lesson05.teach.woorden:
    title: Palabras útiles
    gloss: más / por desgracia / lleno / quiere / así que
    note: '*Meer* es la palabra clave de esta lección.'
    example_gloss:
    - Por desgracia, el hotel está lleno.
    - Omar quiere una habitación.
    - Ya no tengo tiempo.
  nl.a2.unit102.lesson05.teach.gn_niet_meer:
    title: Niet meer = ya no
    gloss: El restaurante ya no está abierto. Ya no trabajo.
    note: '*Niet meer* significa que antes era así, pero ahora ya no. Mantiene el lugar de *niet*.'
  nl.a2.unit102.lesson05.teach.gn_geen_meer:
    title: Geen ... meer = ya no queda
    gloss: Ya no quedan habitaciones. Ya no me queda tiempo.
    note: '*Geen ... meer* significa que ya no queda nada. *Meer* va después del sustantivo.'
  nl.a2.unit102.lesson05.teach.gn_contrast:
    title: ¿Nog niet o niet meer?
    gloss: La habitación todavía no está libre. La habitación ya no está libre.
    note: '*Nog niet*: llegará. *Niet meer*: se acabó. Las dos expresiones significan cosas opuestas.'
  nl.a2.unit102.lesson05.teach.reading:
    title: Lotte necesita una habitación
    gloss: Lotte quiere reservar una habitación para mañana. Llama al hotel, pero por desgracia el hotel está lleno. Ya no quedan habitaciones. Lotte todavía no tiene otra habitación. Por eso llama a otro hotel, pero ese hotel ya no está abierto. Así que Lotte todavía no tiene habitación.
  nl.a2.unit102.lesson06.teach.ask_kamer:
    title: Lotte pregunta
    gloss: 'Lotte: Hola, Omar, ¿has reservado la habitación?'
  nl.a2.unit102.lesson06.teach.nog_niet:
    title: Omar responde
    gloss: 'Omar: Todavía no. Hoy no tengo tiempo.'
  nl.a2.unit102.lesson06.teach.tafel:
    title: Lotte comprueba
    gloss: 'Lotte: Tienes una mesa en el restaurante, ¿verdad?'
  nl.a2.unit102.lesson06.teach.klopt_niet:
    title: Omar la corrige
    gloss: 'Omar: No, eso no es correcto. No tengo mesa. El restaurante está lleno.'
  nl.a2.unit102.lesson06.teach.geen_meer:
    title: Lotte vuelve a preguntar
    gloss: 'Lotte: ¿Ya no quedan mesas?'
  nl.a2.unit102.lesson06.teach.helaas:
    title: Omar termina
    gloss: 'Omar: No, por desgracia no. Llamo mañana.'
