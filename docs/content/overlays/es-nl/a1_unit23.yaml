teaching:
  nl.a1.unit23.lesson01.teach.hoeveel_totaal:
    title: Preguntar el precio total
    gloss: ¿Cuánto cuesta en total?
    note: '*In totaal* (en total) aclara que quieres el precio completo de todo junto, no el de un solo artículo.'
  nl.a1.unit23.lesson01.teach.kost_vijfentwintig:
    title: Decir el precio total
    gloss: Cuesta veinticinco euros en total.
    note: '*Kost* es la tercera persona del singular de *kosten* (costar).'
  nl.a1.unit23.lesson02.teach.pinnen_contant:
    title: Pagar con tarjeta o en efectivo
    gloss: pagar con tarjeta, pagar en efectivo
    note: '*Pinnen* es un verbo muy neerlandés para pagar con tarjeta, derivado del código PIN que la autoriza; *contant betalen* (literalmente «en efectivo pagar») es el equivalente para el efectivo, con *contant* delante de *betalen* como adverbio.'
    example_gloss:
    - ¿Puedo pagar con tarjeta aquí?
    - Pago en efectivo.
  nl.a1.unit23.lesson02.teach.kan_ik_pinnen:
    title: Preguntar si se puede pagar con tarjeta
    gloss: ¿Puedo pagar con tarjeta aquí?
    note: '*Hier* (aquí) sitúa la pregunta en el lugar donde estás.'
  nl.a1.unit23.lesson02.teach.wilt_u_betalen:
    title: Preguntar la forma de pago preferida
    gloss: ¿Quiere pagar en efectivo o con tarjeta?
    note: '*Wilt u* ...? es la versión formal de *wil je* ...?, usada aquí por un cajero que no conoce al cliente.'
  nl.a1.unit23.lesson03.teach.rekening:
    title: La cuenta
    gloss: la cuenta
    note: 'Un sustantivo de género común: *de rekening*.'
    example_gloss: ¿Dividimos la cuenta?
  nl.a1.unit23.lesson03.teach.rekening_delen:
    title: Proponer dividir la cuenta
    gloss: ¿Dividimos la cuenta?
    note: '*Zullen we* ...? retoma el patrón para proponer planes de las unidades 11 y 19.'
  nl.a1.unit23.lesson03.teach.apart_afrekenen:
    title: Pedir pagar por separado
    gloss: ¿Puedo pagar por separado?
    note: '*Apart* (por separado) modifica a *afrekenen* (saldar la cuenta), un casi sinónimo de *betalen* que se usa específicamente para cerrar un pago.'
  nl.a1.unit23.lesson04.teach.wisselgeld:
    title: El cambio
    gloss: el cambio
    note: 'Un sustantivo neutro: *het wisselgeld*, compuesto de *wisselen* (cambiar) y *geld* (dinero).'
    example_gloss: Aquí tiene su cambio.
  nl.a1.unit23.lesson04.teach.hier_wisselgeld:
    title: Entregar el cambio
    gloss: Aquí tiene su cambio.
    note: '*Uw* es el posesivo formal «su», acorde con el registro formal en una caja o mostrador.'
  nl.a1.unit23.lesson04.teach.geen_wisselgeld_nodig:
    title: Rechazar el cambio
    gloss: No necesito el cambio.
    note: '*Nodig hebben* (necesitar) retoma el patrón de *rugzak nodig hebben* de la Unidad 14.'
  nl.a1.unit23.lesson05.teach.vijfendertig:
    title: Treinta y cinco
    gloss: treinta y cinco
    note: '*Vijfendertig* (literalmente «cinco y treinta») sigue el patrón neerlandés habitual de poner las unidades antes que las decenas en los números compuestos.'
    example_gloss: Cuesta treinta y cinco euros.
  nl.a1.unit23.lesson05.teach.bonnetje:
    title: Lee la cuenta de un restaurante
    gloss: 'Cuenta: dos platos principales y dos cafés. Total: treinta y cinco euros. Pagado con tarjeta.'
    note: Fíjate en lo que se pidió, en el total y en cómo se pagó.
    glosses:
      Rekening: cuenta
      twee: dos
      hoofdgerechten: platos principales
      koffies: cafés
      Totaal: total
      vijfendertig: treinta y cinco
      euro: euros
      Betaald: pagado
      pin: tarjeta
  nl.a1.unit23.lesson06.teach.lotte_ask_bill:
    title: Lotte pide la cuenta
    gloss: 'Lotte: ¿Pedimos la cuenta?'
    note: '*Vragen* (pedir) tiene como complemento directo a *de rekening*.'
  nl.a1.unit23.lesson06.teach.omar_ask_total:
    title: Omar pregunta el total
    gloss: 'Omar: Sí, buena idea. ¿Cuánto cuesta en total?'
    note: Retoma la pregunta *hoeveel kost het in totaal?* de la lección 1.
  nl.a1.unit23.lesson06.teach.lotte_state_total:
    title: Lotte dice el total
    gloss: 'Lotte: Son treinta y cinco euros. ¿Lo dividimos?'
    note: '*Delen* (dividir, compartir) se refiere aquí a *de rekening*, según el contexto.'
  nl.a1.unit23.lesson06.teach.omar_offer_pay:
    title: Omar insiste en pagar
    gloss: 'Omar: No, deja que pague yo hoy. Me has ayudado mucho.'
    note: '*Laat mij* ... (deja que yo ...) es la forma habitual de ofrecerse a hacer algo; *geholpen* es el participio de *helpen* (ayudar).'
  nl.a1.unit23.lesson06.teach.lotte_thanks:
    title: Lotte está conmovida
    gloss: 'Lotte: ¡Qué amable de tu parte! Muchas gracias.'
    note: '*Lief van je* (qué amable de tu parte) es un cumplido cálido y frecuente ante un gesto generoso.'
  nl.a1.unit23.lesson06.teach.omar_ask_card:
    title: Omar pregunta si puede pagar con tarjeta
    gloss: 'Omar: ¿Puedo pagar con tarjeta aquí?'
    note: Retoma la pregunta *kan ik hier pinnen?* de la lección 2, ahora en el restaurante de verdad.
  nl.a1.unit23.lesson06.teach.betaalt_form:
    title: 'Betaalt: la forma de él/ella'
    gloss: Omar paga la cuenta.
    note: '*Betaalt* es la forma de tercera persona de *betalen* (pagar).'
