course:
  title: Neerlandés A1
  description: 'Neerlandés para principiantes para describir el aspecto físico básico de una persona: impresiones de estatura y edad, color de pelo y de ojos, la pregunta clave Hoe ziet ... eruit? y la comparación del aspecto de dos personas.'
units:
  nl.a1.unit30.appearance:
    title: Describir el aspecto
lessons:
  nl.a1.unit30.lesson01.lang_klein_oud_jong:
    title: Alto, bajo, viejo y joven
  nl.a1.unit30.lesson02.haar_beschrijven:
    title: Describir el pelo
  nl.a1.unit30.lesson03.ogen_en_eruitzien:
    title: Los ojos y ¿cómo es alguien?
  nl.a1.unit30.lesson04.taalcafe_nina:
    title: Lotte describe a Nina
  nl.a1.unit30.lesson05.sander_fenna_vergelijken:
    title: Comparamos a Sander y Fenna
  nl.a1.unit30.lesson06.taalcafe_herkenning:
    title: Omar reconoce a Nina
teaching:
  nl.a1.unit30.lesson01.teach.lang_klein:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*Lang* describe a una persona alta; *klein* describe a una persona baja (es la misma palabra que se usa para un objeto pequeño en otras partes del curso).'
    example_gloss:
    - Fenna es alta.
    - Sander es bajo.
  nl.a1.unit30.lesson01.teach.oud_jong:
    title: Viejo y joven
    gloss: viejo / joven
    note: '*Oud* y *jong* aquí describen una impresión general del aspecto, no un número exacto de años.'
    example_gloss:
    - El abuelo es viejo.
    - Omar es joven.
  nl.a1.unit30.lesson01.teach.oud_note:
    title: 'Oud: un número o una impresión'
    gloss: Oud puede significar un número preciso de años, como en Hoe oud ben je?, o una impresión general sin número, como en Opa is oud.
    note: Ya conoces *oud* de preguntar la edad exacta de alguien (*Hoe oud ben je?*). Aquí describe qué edad PARECE tener alguien, sin ningún número.
  nl.a1.unit30.lesson01.teach.fenna_sander_phrase:
    title: Fenna es alta y Sander es bajo
    gloss: Fenna es alta y Sander es bajo.
    note: Una frase combinada sencilla con *en* (y), que prepara la comparación directa que viene después.
  nl.a1.unit30.lesson02.teach.haar_noun:
    title: El pelo
    gloss: el pelo
    note: '*Haar* es una palabra het: *het haar*.'
    example_gloss: Omar tiene el pelo corto y negro.
  nl.a1.unit30.lesson02.teach.haar_kleuren:
    title: Rubio, castaño y gris
    gloss: rubio / castaño / gris
    note: Tres colores de pelo. *Zwart* (negro) ya apareció con la ropa y aquí se reutiliza para el pelo.
    example_gloss:
    - Lotte tiene el pelo rubio.
    - Sander tiene el pelo castaño.
    - El abuelo tiene el pelo gris.
  nl.a1.unit30.lesson02.teach.haar_lengte:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*Lang* (largo) reutiliza la palabra de estatura de la lección 1, ahora para describir la longitud del pelo. *Kort* (corto) es nueva aquí.'
    example_gloss:
    - Fenna tiene el pelo largo.
    - Sander tiene el pelo corto.
  nl.a1.unit30.lesson02.teach.haar_agreement_note:
    title: Haar con adjetivo sin -e
    gloss: 'Haar es una palabra het sin artículo, así que el adjetivo no lleva -e: kort haar, lang haar, blond haar, bruin haar, grijs haar, zwart haar.'
    note: Delante de *haar*, en esta forma indefinida y sin artículo, no se añade -e. En cambio, *ogen* (lección 3) sí lleva -e.
  nl.a1.unit30.lesson02.teach.haar_homoniem_note:
    title: 'Haar: dos significados'
    gloss: 'Haar tiene dos significados: «pelo» (el sustantivo nuevo de esta lección) y «su» (el posesivo de la Unidad 5, p. ej. haar moeder). El contexto indica cuál es.'
    note: 'Un auténtico homónimo neerlandés: *haar* sustantivo (pelo) y *haar* posesivo (su) se escriben igual. El resto de la frase siempre aclara cuál de los dos es.'
    target_text: 'Haar tiene dos significados: «pelo» (el sustantivo nuevo de esta lección) y «su» (posesivo, p. ej. haar moeder). El contexto indica cuál es.'
  nl.a1.unit30.lesson02.teach.omar_kort_zwart:
    title: Omar tiene el pelo corto y negro
    gloss: Omar tiene el pelo corto y negro.
    note: Reutiliza *zwart* (negro) de la unidad de ropa de la Unidad 20.
  nl.a1.unit30.lesson02.teach.lotte_lang_blond:
    title: Lotte tiene el pelo largo y rubio
    gloss: Lotte tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  nl.a1.unit30.lesson03.teach.ogen_noun:
    title: Los ojos
    gloss: los ojos
    note: '*Ogen* es el plural de *het oog*; el plural siempre lleva *de*.'
    example_gloss: Omar tiene los ojos marrones.
  nl.a1.unit30.lesson03.teach.oog_kleuren:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: '*Blauw* (azul) ya apareció con la ropa; *bruin* (marrón) se acaba de enseñar en la lección 2 para el pelo; *groen* (verde) es nueva aquí.'
    example_gloss:
    - Lotte tiene los ojos azules.
    - Sander tiene los ojos marrones.
    - Fenna tiene los ojos verdes.
  nl.a1.unit30.lesson03.teach.ogen_agreement_note:
    title: Ogen lleva -e
    gloss: 'Con ogen (plural), el adjetivo lleva una -e adicional: blauwe ogen, bruine ogen, groene ogen.'
    note: A diferencia de *haar* en la lección 2, que deja el adjetivo sin -e, el plural siempre lleva -e, sea una palabra de o una palabra het.
  nl.a1.unit30.lesson03.teach.hoe_ziet_eruit:
    title: ¿Cómo es Lotte físicamente?
    gloss: ¿Cómo es Lotte físicamente?
    note: '*Hoe ziet ... eruit?* es la pregunta central de esta unidad: úsala para preguntar por el aspecto de cualquier persona.'
  nl.a1.unit30.lesson03.teach.antwoord_patroon:
    title: Lotte tiene el pelo largo y rubio y los ojos azules
    gloss: Lotte tiene el pelo largo y rubio y los ojos azules.
    note: Una respuesta modelo que combina pelo y ojos en una sola frase con *en*.
  nl.a1.unit30.lesson04.teach.lotte_intro_nina:
    title: Lotte presenta a Nina
    gloss: 'Lotte: Va a venir una chica nueva al taalcafé. Se llama Nina.'
    note: '*Er komt* (viene / va a venir) presenta a alguien nuevo en la escena.'
  nl.a1.unit30.lesson04.teach.omar_ask_eruit:
    title: Omar pregunta cómo es ella
    gloss: 'Omar: ¡Vale! ¿Cómo es físicamente?'
    note: Reutiliza la pregunta central de esta unidad, ahora con *ze* (ella) en lugar de un nombre.
  nl.a1.unit30.lesson04.teach.lotte_klein_kort_blond:
    title: Lotte describe la estatura y el pelo de Nina
    gloss: 'Lotte: Es baja y tiene el pelo corto y rubio.'
    note: Combina *klein* de la lección 1 con el vocabulario del pelo de la lección 2.
  nl.a1.unit30.lesson04.teach.omar_ask_ogen:
    title: Omar pregunta por sus ojos
    gloss: 'Omar: ¿Y sus ojos?'
    note: Aquí *haar* significa «su» (el posesivo de la Unidad 5), no «pelo»; mira la nota sobre el homónimo de la lección 2.
  nl.a1.unit30.lesson04.teach.lotte_groene_ogen:
    title: Lotte describe los ojos de Nina
    gloss: 'Lotte: Tiene los ojos verdes.'
    note: Reutiliza *groene ogen* de la lección 3.
  nl.a1.unit30.lesson04.teach.omar_bedankt_herken:
    title: Omar la reconocerá
    gloss: 'Omar: ¡Gracias! Entonces la reconoceré.'
    note: '*Herken ik haar wel* significa «la reconoceré, sin problema». Aquí *haar* es de nuevo el pronombre «la/ella», no «pelo».'
  nl.a1.unit30.lesson05.teach.vergelijking:
    title: Comparamos a Sander y Fenna
    gloss: Sander y Fenna son hermanos, pero no se parecen físicamente. Sander es bajo y tiene el pelo corto y castaño y los ojos marrones. Fenna es más alta que Sander y tiene el pelo largo y castaño y los ojos verdes. ¿Cómo eres tú?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      broer: hermano
      zus: hermana
      zien: parecerse
      anders: diferentes
      klein: bajo
      kort: bajo
      bruin: castaño
      haar: pelo
      bruine: castaño
      ogen: ojos
      langer: más alta
      lang: largo
      groene: verdes
      eruit: (parte de 'eruit zien' = tener aspecto, verse)
  nl.a1.unit30.lesson05.teach.comparatief_note:
    title: Reutilizamos el patrón comparativo
    gloss: 'Ya conoces este patrón de las comparaciones: adjetivo + er + dan (que). Aquí lo usas para personas: Fenna is langer dan Sander.'
    note: Es exactamente el patrón *adjetivo + -er + dan* de la unidad de compras de mochilas de la Unidad 14, ahora aplicado a la descripción de personas en lugar de objetos.
  nl.a1.unit30.lesson05.teach.langer_haar:
    title: Fenna tiene el pelo más largo que Sander
    gloss: Fenna tiene el pelo más largo que Sander.
    note: '*Langer* no lleva -e delante de *haar* (una palabra het), la misma regla de concordancia de la lección 2, incluso en el comparativo.'
  nl.a1.unit30.lesson05.teach.ik_heb_haar:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: Una frase modelo en primera persona con *Ik heb ...*, lista para usar cuando describas tu propio aspecto.
  nl.a1.unit30.lesson06.teach.omar_kijk_is_dat_nina:
    title: Omar ve a Nina
    gloss: 'Omar: Mira, ¿esa es Nina? Tiene el pelo corto y rubio y los ojos verdes.'
    note: '*Kijk* (mira) ya se usó del mismo modo en el diálogo de la Unidad 14.'
  nl.a1.unit30.lesson06.teach.lotte_ja_dat_is_nina:
    title: Lotte lo confirma
    gloss: 'Lotte: ¡Sí, es Nina!'
    note: Una confirmación breve y natural.
  nl.a1.unit30.lesson06.teach.nina_ben_jij_omar:
    title: Nina saluda a Omar
    gloss: 'Nina: Hola, ¿eres Omar?'
    note: Un saludo informal sencillo con la pregunta *ben jij ...?*
  nl.a1.unit30.lesson06.teach.omar_leuk_je_te_zien:
    title: Omar saluda a Nina
    gloss: 'Omar: ¡Sí! Encantado de conocerte, Nina.'
    note: '*Leuk je te ontmoeten* es la fórmula habitual para un primer encuentro (véase la Unidad 1); *leuk je te zien* se usa con alguien a quien ya conoces.'
  nl.a1.unit30.lesson06.teach.nina_leuk_je_ook:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Omar ha reconocido a Nina gracias a la descripción de Lotte.'
