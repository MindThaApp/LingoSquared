teaching:
  nl.a1.unit14.lesson01.teach.comparative_rule:
    title: Formar el comparativo
    gloss: En las comparaciones, normalmente se añade -er al adjetivo y se usa dan.
    note: '*Dan* equivale a «que» en las comparaciones. Siempre va después del adjetivo en comparativo.'
  nl.a1.unit14.lesson01.teach.groot_klein:
    title: Grande, pequeño
    gloss: grande, pequeño
    note: '*Groot* y *klein* son los adjetivos básicos, antes de añadir -er.'
    example_gloss:
    - La mochila es grande.
    - El bolso es pequeño.
  nl.a1.unit14.lesson01.teach.rugzak_groter:
    title: La mochila es más grande
    gloss: La mochila es más grande que el bolso.
    note: '*Groter* es *groot* + *er*; *dan* introduce el segundo elemento de la comparación.'
  nl.a1.unit14.lesson01.teach.tas_kleiner:
    title: El bolso es más pequeño
    gloss: El bolso es más pequeño que la mochila.
    note: '*Kleiner* es *klein* + *er*, con el mismo patrón.'
  nl.a1.unit14.lesson02.teach.rugzak_price:
    title: El precio de la mochila
    gloss: La mochila cuesta cuarenta y cinco euros.
    note: '*Kost* es la tercera persona del singular de *kosten*, «costar».'
  nl.a1.unit14.lesson02.teach.tas_price:
    title: El precio del bolso
    gloss: El bolso cuesta veinte euros.
    note: Un precio más bajo que el de la mochila, que prepara la comparación siguiente.
  nl.a1.unit14.lesson02.teach.duur_goedkoop:
    title: Caro, barato
    gloss: caro, barato
    note: '*Duur* y *goedkoop* son los adjetivos básicos, antes de añadir *-der*/*-er*.'
    example_gloss:
    - La mochila es cara.
    - El bolso es barato.
  nl.a1.unit14.lesson02.teach.rugzak_duurder:
    title: La mochila es más cara
    gloss: La mochila es más cara que el bolso.
    note: '*Duurder* es *duur* + *der*. Tras una palabra que ya termina en r, el neerlandés añade *-der* en lugar de *-er*.'
  nl.a1.unit14.lesson02.teach.tas_goedkoper:
    title: El bolso es más barato
    gloss: El bolso es más barato que la mochila.
    note: '*Goedkoper* es *goedkoop* + *er*, el reflejo de la frase anterior.'
  nl.a1.unit14.lesson03.teach.equality_rule:
    title: Comparar con igualdad
    gloss: Usa net zo + adjetivo + als para comparar dos cosas como iguales.
    note: Equivale a la estructura española «tan ... como».
  nl.a1.unit14.lesson03.teach.mooi:
    title: Igual de bonito
    gloss: Esta mochila es tan bonita como ese bolso.
    note: '*Mooi* (bonito) va entre *net zo* y *als* sin cambios: en este patrón no lleva la terminación -er.'
  nl.a1.unit14.lesson03.teach.praktisch:
    title: Igual de práctico
    gloss: La mochila es tan práctica como el bolso.
    note: Cualquier adjetivo sencillo puede ocupar este mismo hueco de *net zo ... als*.
  nl.a1.unit14.lesson04.teach.superlative_rule:
    title: Formar el superlativo
    gloss: Para el superlativo, normalmente se usa het + el adjetivo + st.
    note: Esta forma predicativa (después de *is*) lleva *het* sea cual sea el género del sustantivo.
  nl.a1.unit14.lesson04.teach.duurst:
    title: La más cara de las dos
    gloss: De estas dos, la mochila es la más cara.
    note: '*Duurst* es *duur* + *st*. El neerlandés puede usar el superlativo incluso al comparar solo dos opciones.'
  nl.a1.unit14.lesson04.teach.irregular_rule:
    title: 'Irregulares: goed, beter, best'
    gloss: 'Goed, beter, best son irregulares: esta es la mejor opción. Veel, meer, meest funciona igual.'
    note: Como en español (bueno/mejor/mejor, mucho/más), ninguna de las dos series (*goed/beter/best*, *veel/meer/meest*) sigue el patrón regular -er/-st.
  nl.a1.unit14.lesson04.teach.beste_keuze:
    title: La mejor opción para el viaje
    gloss: Esta mochila es la mejor opción para un viaje largo en tren.
    note: '*Beste* es la forma atributiva (delante de un sustantivo), con la terminación -e que los adjetivos neerlandeses suelen llevar delante del sustantivo.'
  nl.a1.unit14.lesson04.teach.meer_ruimte:
    title: Más espacio
    gloss: La mochila tiene más espacio que el bolso.
    note: '*Meer* es el comparativo irregular de *veel* (mucho/muchos), igual que en español se dice «más» y no «muchísimo».'
  nl.a1.unit14.lesson05.teach.advertentie:
    title: Lee un anuncio de una tienda
    gloss: 'Mochila Bergsport: cuarenta y cinco euros. Esta mochila es grande y resistente. Bolso de hombro Stad: veinte euros. Este bolso es más pequeño y más ligero que la mochila, pero menos resistente. Para un viaje largo, la mochila es la mejor opción, porque es más resistente y tiene más espacio.'
    note: Fíjate en los precios y tamaños de los dos productos, en cuál recomienda el anuncio y por qué.
    glosses:
      Rugzak: mochila
      vijfenveertig: cuarenta y cinco
      euro: euros
      groot: grande
      sterk: resistente
      Schoudertas: bolso de hombro
      twintig: veinte
      tas: bolsa
      kleiner: más pequeño
      lichter: más ligero
      minder: menos
      lange: largo
      reis: viaje
      beste: el mejor
      keuze: elección
      sterker: más fuerte
      ruimte: espacio
  nl.a1.unit14.lesson06.teach.lotte_open:
    title: Lotte señala el tamaño
    gloss: 'Lotte: Mira, esta mochila es más grande que ese bolso.'
    note: '*Kijk* (mira) es una forma habitual de llamar la atención de alguien sobre algo.'
  nl.a1.unit14.lesson06.teach.omar_room:
    title: Omar explica por qué la necesita
    gloss: 'Omar: Sí, y tiene más espacio. Necesito un bolso grande para el viaje en tren.'
    note: '*Nodig hebben* (necesitar) es una combinación fija; lo que se necesita va entre *hebben* y *nodig*.'
  nl.a1.unit14.lesson06.teach.lotte_best_choice:
    title: Lotte confirma la elección
    gloss: 'Lotte: Entonces la mochila es la mejor elección para ti.'
    note: '*Dan* aquí significa ''en ese caso'', no es el *dan* comparativo de la lesson01: la misma grafía cubre ambos usos.'
  nl.a1.unit14.lesson06.teach.omar_question:
    title: Omar le pregunta su opinión a Lotte
    gloss: 'Omar: Exacto. ¿Cuál te parece el más bonito?'
    note: '*Vind jij het mooist* retoma el patrón para dar una opinión de las lecciones de *vinden* de la Unidad 13.'
  nl.a1.unit14.lesson06.teach.lotte_choice:
    title: Lotte elige el bolso de hombro
    gloss: 'Lotte: Este bolso de hombro me parece el más bonito. Y además es ligero.'
    note: '*Licht* (ligero, de poco peso) es un adjetivo nuevo y útil para describir bolsos y equipaje.'
  nl.a1.unit14.lesson06.teach.omar_close:
    title: Toman la decisión
    gloss: 'Omar: Bien, entonces yo compro la mochila y tú el bolso de hombro.'
    note: En la segunda oración se omite el verbo repetido *koop*; en neerlandés hablado es natural cuando ya se entiende por el contexto, igual que en español.
  nl.a1.unit14.lesson06.teach.koopt_form:
    title: Koop frente a koopt
    gloss: Koop es la forma de ik (yo) de kopen (comprar); koopt es la forma de hij (él) o zij (ella).
    note: 'Patrón regular del presente: *ik koop*, *jij/hij/zij koopt*.'
