  nl.a1.unit34.lesson05.teach.tekst:
    title: ¿Quién usa qué?
    gloss: Lotte llama a Omar todos los días. Usa su teléfono, no una app. Omar no tiene ordenador en casa, pero usa internet en su teléfono. Sander consulta el pronóstico del tiempo cada mañana. Luego se va a correr. Fenna envía a menudo un mensaje a Lotte. ¿Tú también usas el teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
