teaching:
  nl.a1.unit11.lesson01.teach.samen:
    title: Juntos
    gloss: juntos
    note: '*Samen* deja claro que las personas hacen la actividad juntas.'
    example_gloss: ¿Tomamos un café juntos?
  nl.a1.unit11.lesson01.teach.koffie_drinken:
    title: Tomar un café
    gloss: tomar un café
    note: En neerlandés se dice literalmente *koffie drinken*, «beber café».
  nl.a1.unit11.lesson01.teach.naar_de_film:
    title: Ir al cine
    gloss: ir al cine
    note: '*Naar de film gaan* es una forma habitual de decir que se va al cine sin añadir otra palabra de lugar.'
  nl.a1.unit11.lesson01.teach.zullen_we:
    title: ¿Tomamos un café?
    gloss: ¿Tomamos un café?
    note: '*Zullen we ...?* es la estructura neerlandesa habitual para proponer una actividad en común.'
  nl.a1.unit11.lesson01.teach.zullen_note:
    title: Usar Zullen we
    gloss: Zullen we + actividad? es la forma habitual de proponer hacer algo juntos.
    note: 'Pon la actividad después de *we* y el verbo al final: *Zullen we koffie drinken?*'
  nl.a1.unit11.lesson01.teach.zin_om:
    title: ¿Te apetece ir al cine?
    gloss: ¿Te apetece ir al cine?
    note: '*Heb je zin om ...?* pregunta de manera informal si a la otra persona le apetece hacer una actividad. Aquí se usa *te* delante de *gaan*.'
  nl.a1.unit11.lesson02.teach.ja_leuk:
    title: ¡Sí, genial!
    gloss: ¡Sí, genial!
    note: '*Ja, leuk!* es una aceptación breve y entusiasta.'
  nl.a1.unit11.lesson02.teach.goed_idee:
    title: Buena idea
    gloss: ¡Buena idea!
    note: '*Goed idee!* acepta la propuesta valorándola de forma positiva.'
  nl.a1.unit11.lesson02.teach.goed_plan:
    title: Es un buen plan
    gloss: Es un buen plan.
    note: Es una respuesta positiva algo más completa.
  nl.a1.unit11.lesson02.teach.sorry_reason:
    title: Rechazar con un motivo
    gloss: Lo siento, no puedo, porque trabajo.
    note: '*Sorry* suaviza el rechazo, y *want* introduce el motivo breve.'
  nl.a1.unit11.lesson02.teach.no_time:
    title: No tengo tiempo
    gloss: No tengo tiempo.
    note: '*Ik heb geen tijd* es un motivo directo, pero normal, para rechazar una propuesta.'
  nl.a1.unit11.lesson02.teach.polite_decline:
    title: Un rechazo amable
    gloss: Lo siento + no puedo + un motivo breve hacen que un rechazo sea amable.
    note: En una conversación el motivo es opcional, pero hace que la respuesta sea más útil y cortés.
  nl.a1.unit11.lesson03.teach.afspreken:
    title: Quedar
    gloss: quedar (para vernos)
    note: '*Afspreken* se escribe como una sola palabra después de *Zullen we*. En *We spreken vrijdag af* se separa en *spreken* y *af*.'
    example_gloss: ¿Quedamos el viernes a las 2:30?
  nl.a1.unit11.lesson03.teach.friday_half_three:
    title: Quedar el viernes a las dos y media
    gloss: ¿Quedamos el viernes a las 2:30?
    note: Combina el día de la semana de la Unidad 3 con *om* más la hora de la Unidad 4.
  nl.a1.unit11.lesson03.teach.half_three_review:
    title: Half drie significa 2:30
    gloss: half drie = 2:30; om half drie indica la hora de la cita.
    note: 'El neerlandés cuenta hacia la hora siguiente, a diferencia del español («las dos y media»): *half drie* es la mitad del camino hacia las tres, así que significa 2:30.'
  nl.a1.unit11.lesson03.teach.date_time:
    title: Una fecha y una hora
    gloss: el viernes 17 de abril a las 3:15
    note: Los días de la semana y los meses se escriben en minúscula. Usa *op* para la fecha y *om* para la hora.
  nl.a1.unit11.lesson03.teach.confirm_time:
    title: Confirmar la hora
    gloss: Sí, el viernes a las 2:30 está bien.
    note: '*Is goed* confirma que el horario propuesto funciona.'
  nl.a1.unit11.lesson04.teach.bericht_uitnodiging_taalcafe:
    title: Mensaje, invitación, café de idiomas
    gloss: el mensaje, la invitación, el café de idiomas
    note: '*Bericht* es un mensaje breve, escrito o digital; una *uitnodiging* invita a alguien a participar en una actividad o un evento; y *taalcafé* (una sola palabra compuesta, con su acento) es el lugar de encuentro del grupo.'
    example_gloss:
    - Tengo un mensaje de Lotte.
    - Esta es una invitación al café de idiomas.
    - Tomamos un café en el café de idiomas.
  nl.a1.unit11.lesson04.teach.invitation:
    title: La invitación de Lotte
    gloss: Hola, Omar, ¿te apetece tomar un café en el café de idiomas el sábado 18 de abril a las 2:30? Un saludo, Lotte.
    note: 'Lee buscando cuatro datos: actividad, fecha, hora y lugar.'
    glosses:
      Hoi: hola
      zin: ganas (heb je zin = ¿te apetece?)
      zaterdag: sábado
      april: abril
      half: media HACIA la hora siguiente (half acht = 7:30)
      drie: tres
      koffie: café
      drinken: beber / tomar
      taalcafé: café de idiomas
      Groet: saludos
  nl.a1.unit11.lesson05.teach.proposal_message:
    title: Un mensaje de propuesta
    gloss: Hola, Omar, ¿tomamos un café el viernes a las 2:30? Un saludo, Lotte.
    note: El mensaje incluye saludo, actividad, día, hora y despedida.
    glosses:
      Hoi: hola
      zullen: ¿qué tal si...? (propuesta)
      vrijdag: viernes
      half: media HACIA la hora siguiente (half acht = 7:30)
      drie: tres
      koffie: café
      drinken: beber / tomar
      Groet: saludos
  nl.a1.unit11.lesson05.teach.confirm_message:
    title: Un mensaje de confirmación
    gloss: Hola, Lotte, ¡sí, genial! El viernes a las 2:30 está bien. ¡Hasta el viernes! Omar.
    note: La respuesta acepta la actividad y repite el horario para confirmarlo.
    glosses:
      Hoi: hola
      leuk: agradable / genial
      Vrijdag: viernes
      half: media HACIA la hora siguiente (half acht = 7:30)
      drie: tres
      goed: bien / funciona
      Tot: hasta / nos vemos
      vrijdag: viernes
  nl.a1.unit11.lesson05.teach.message_shape:
    title: Qué incluye un mensaje
    gloss: Un mensaje corto indica la actividad, el día o la fecha y la hora.
    note: Un saludo y una despedida son útiles, pero lo importante es la actividad y cuándo tiene lugar.
  nl.a1.unit11.lesson06.teach.proposal:
    title: Lotte propone un café
    gloss: 'Lotte: ¿Tomamos un café el viernes? Omar: ¡Sí, qué bien! ¿A qué hora?'
    note: Omar acepta la actividad antes de preguntar la hora.
  nl.a1.unit11.lesson06.teach.first_time:
    title: La primera hora de Lotte
    gloss: 'Lotte: A las 2:30.'
    note: '*Half drie* significa las 2:30, según la convención de la Unidad 4.'
  nl.a1.unit11.lesson06.teach.negotiate:
    title: Omar propone otra hora
    gloss: 'Omar: Lo siento, a las 2:30 no puedo. ¿Podría ser a las 3:15?'
    note: '*Kan het om ...?* es una forma breve de preguntar si otra hora te viene bien.'
  nl.a1.unit11.lesson06.teach.confirm:
    title: Confirman el plan final
    gloss: 'Lotte: Sí, las 3:15 está bien. Omar: Buen plan. Entonces quedamos el viernes a las 3:15.'
    note: 'Aquí *afspreken* se separa: *spreken* queda cerca del principio y *af* al final.'
