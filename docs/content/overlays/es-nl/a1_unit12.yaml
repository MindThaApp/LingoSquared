teaching:
  nl.a1.unit12.lesson01.teach.completed_event:
    title: El pasado cotidiano en neerlandés
    gloss: En una conversación, un hecho terminado suele expresarse con hebben o zijn más un participio.
    note: El neerlandés usa normalmente esta forma de pretérito perfecto compuesto para hablar del pasado, de forma parecida al español, que también la usa con frecuencia. *Ik heb koffie gedronken* puede significar «bebí café» o «he bebido café», según el contexto.
  nl.a1.unit12.lesson01.teach.drinken_model:
    title: Bebí café
    gloss: beber → Bebí café.
    note: '*Heb* es el auxiliar y *gedronken* es el participio de *drinken*.'
  nl.a1.unit12.lesson01.teach.gaan_model:
    title: Fui al supermercado
    gloss: ir → Fui al supermercado.
    note: '*Gaan* usa *zijn*: *ik ben gegaan*.'
  nl.a1.unit12.lesson01.teach.word_order:
    title: El participio va al final
    gloss: 'El participio va al final: Ik heb koffie gedronken. Piensa en la posición final de op en Ik sta op.'
    note: En la unidad 10 ya aprendiste a fijarte en un elemento importante al final de la oración. Aquí el elemento final es el participio.
  nl.a1.unit12.lesson02.teach.hebben_rule:
    title: La mayoría de los verbos usan hebben
    gloss: La mayoría de los verbos usan hebben.
    note: En esta unidad, usa *hebben* con *drinken*, *eten*, *werken* y *kopen*.
  nl.a1.unit12.lesson02.teach.drinken:
    title: Drinken con hebben
    gloss: beber → Bebí café.
    note: El patrón completo es *ik + heb + complemento + gedronken*.
  nl.a1.unit12.lesson02.teach.eten:
    title: Eten con hebben
    gloss: comer → Comí pan.
    note: El participio de *eten* es *gegeten*.
  nl.a1.unit12.lesson02.teach.werken:
    title: Werken con hebben
    gloss: trabajar → Trabajé.
    note: El participio de *werken* es *gewerkt*.
  nl.a1.unit12.lesson02.teach.kopen:
    title: Kopen con hebben
    gloss: comprar → Compré manzanas.
    note: El participio de *kopen* es *gekocht*.
  nl.a1.unit12.lesson03.teach.zijn_rule:
    title: Gaan y komen usan zijn
    gloss: Con gaan y komen, usa zijn.
    note: Estos dos verbos de movimiento frecuentes usan *zijn*, no *hebben*, en la construcción de hechos terminados que se enseña aquí.
  nl.a1.unit12.lesson03.teach.gaan:
    title: Gaan con zijn
    gloss: ir → Fui al supermercado.
    note: Usa *ben* con *ik* y coloca *gegaan* al final.
  nl.a1.unit12.lesson03.teach.komen:
    title: Komen con zijn
    gloss: venir → Vine al café de idiomas.
    note: Usa *ben* con *ik* y coloca *gekomen* al final.
  nl.a1.unit12.lesson03.teach.auxiliary_contrast:
    title: Compara los auxiliares
    gloss: Trabajé, pero fui al supermercado.
    note: '*Werken* lleva *hebben*; *gaan* lleva *zijn*.'
  nl.a1.unit12.lesson04.teach.gisteren_vanmorgen:
    title: Ayer, esta mañana
    gloss: ayer, esta mañana
    note: '*Gisteren* indica el día anterior a hoy; *vanmorgen* se refiere a la mañana de hoy.'
    example_gloss:
    - Ayer trabajé.
    - Esta mañana a las ocho bebí café.
  nl.a1.unit12.lesson04.teach.yesterday_work:
    title: Ayer trabajé
    gloss: Ayer trabajé.
    note: Cuando *gisteren* abre la oración, *heb* va antes de *ik*.
  nl.a1.unit12.lesson04.teach.morning_coffee:
    title: Café esta mañana
    gloss: Esta mañana a las ocho bebí café.
    note: Aquí se reutiliza *om acht uur* del sistema de la hora de la unidad 4.
  nl.a1.unit12.lesson04.teach.time_order:
    title: Si el tiempo va primero, cambia el orden
    gloss: 'Después de Gisteren o Vanmorgen, el verbo va antes de ik: Gisteren heb ik ...'
    note: Es el mismo orden, con el verbo antes de *ik*, que ya viste después de *daarna* en la unidad 10.
  nl.a1.unit12.lesson05.teach.recent_text:
    title: Un relato de hechos recientes
    gloss: Esta mañana fui al supermercado. Compré manzanas. Después fui al café de idiomas. Allí bebí café.
    note: Lee fijándote en la referencia temporal, los lugares y cada acción terminada.
    glosses:
      Vanmorgen: esta mañana
      supermarkt: supermercado
      gegaan: ido / fui
      appels: manzanas
      gekocht: comprado / compré
      Daarna: después
      taalcafé: café de idiomas
      Daar: allí
      koffie: café
      gedronken: bebido / bebí
  nl.a1.unit12.lesson06.teach.question:
    title: ¿Qué hiciste ayer?
    gloss: 'Lotte: ¿Qué hiciste ayer, Omar?'
    note: '*Wat heb je ... gedaan?* es la pregunta informal habitual para preguntar qué hizo alguien.'
  nl.a1.unit12.lesson06.teach.answer:
    title: Las tres acciones de Omar
    gloss: 'Omar: Trabajé. Después fui al supermercado. Compré manzanas.'
    note: La respuesta presenta tres acciones sencillas ya terminadas, en frases separadas.
  nl.a1.unit12.lesson06.teach.morning_question:
    title: ¿Y esta mañana?
    gloss: 'Lotte: ¿Y qué hiciste esta mañana?'
    note: Sustituye *gisteren* por *vanmorgen* para preguntar por otro momento reciente.
  nl.a1.unit12.lesson06.teach.morning_answer:
    title: Omar vino al café de idiomas
    gloss: 'Omar: Esta mañana vine al café de idiomas a las ocho.'
    note: '*Komen* se conjuga con *zijn*: *ben ... gekomen*.'
  nl.a1.unit12.lesson06.teach.lotte_answer:
    title: Lotte tomó café
    gloss: 'Lotte: Qué bien. Yo esta mañana tomé café.'
    note: '*Drinken* se conjuga con *hebben*: *heb ... gedronken*.'
