course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para describir lo que está pasando ahora mismo.
  learning_goal: Di lo que estás haciendo tú o lo que está haciendo otra persona con aan het + infinitivo y zitten/staan/liggen/lopen te.
units:
  nl.a2.unit105.ik_ben_aan_het_koken:
    title: Estoy cocinando
    description: 'Di lo que pasa ahora mismo: aan het + infinitivo, y estar sentado, de pie, tumbado o andando mientras haces algo.'
lessons:
  nl.a2.unit105.lesson01.wat_ben_je_aan_het_doen:
    title: ¿Qué estás haciendo?
  nl.a2.unit105.lesson02.met_een_object:
    title: Con complemento directo
  nl.a2.unit105.lesson03.nu_of_altijd:
    title: ¿Ahora o todos los días?
  nl.a2.unit105.lesson04.zitten_staan_liggen_lopen:
    title: Sentado, de pie, tumbado, caminando
  nl.a2.unit105.lesson05.omars_bericht:
    title: El mensaje de Omar
  nl.a2.unit105.lesson06.lotte_en_omar_bellen:
    title: Lotte y Omar hablan por teléfono
teaching:
  nl.a2.unit105.lesson01.teach.huishouden:
    title: Tareas del hogar
    gloss: cocinar / lavar los platos / limpiar / la colada / hacer
    note: '*De was doen* significa hacer la colada; *doen* es el verbo de *wat ben je aan het doen?*'
    example_gloss:
    - Omar sabe cocinar bien.
    - Voy a lavar los platos.
    - Noor va a limpiar.
  nl.a2.unit105.lesson01.teach.telefoon:
    title: Teléfono y tiempo libre
    gloss: llamar / leer / dormir / el teléfono / con / mi / madre / hermana
    note: '*Bellen* significa llamar por teléfono a alguien; añade *met* para decir con quién hablas.'
    example_gloss:
    - Lotte habla por teléfono con su madre.
    - Leí un libro.
    - Mi hermana está durmiendo.
  nl.a2.unit105.lesson01.teach.wie:
    title: Personas, ahora y en casa
    gloss: yo / tú (con énfasis) / tú / él / ella / qué / ahora / en casa / Lotte / Omar / Noor
    note: '*Jij* es la forma tónica de *je*; ambas significan «tú» para un amigo.'
    example_gloss:
    - Estoy en casa.
    - Ahora él está en casa.
    - ¿Qué está haciendo Noor?
  nl.a2.unit105.lesson01.teach.aanhet:
    title: Aan het + infinitivo
    gloss: Estoy cocinando. Estoy llamando. Estoy leyendo.
    note: Usa *zijn* + *aan het* + infinitivo para algo que estás haciendo justo ahora. El infinitivo va al final.
  nl.a2.unit105.lesson01.teach.vraag:
    title: Preguntar qué hace alguien
    gloss: ¿Qué estás haciendo? Estoy cocinando.
    note: 'En la pregunta el verbo va antes del sujeto: *ben je*. En una afirmación, el orden es *je bent*.'
  nl.a2.unit105.lesson02.teach.zijn:
    title: El verbo zijn
    gloss: Estoy cocinando. Tú estás leyendo. Él está llamando. Nosotros estamos lavando los platos. ¿Estás cocinando? Sí, estoy cocinando.
    note: '*Zijn* cambia según el sujeto: *ben, bent, is, zijn*. En una pregunta con *je* desaparece la t: *ben je*.'
  nl.a2.unit105.lesson02.teach.eten:
    title: Comida y cocina
    gloss: la comida / la sopa / la cocina / los platos sucios / hacer
    note: '*De afwas doen* es la forma habitual de decir que lavas los platos.'
    example_gloss:
    - La comida está lista.
    - La sopa está caliente.
    - Hago té.
  nl.a2.unit105.lesson02.teach.object:
    title: El complemento antes de aan het
    gloss: Estoy haciendo la colada. Omar está preparando sopa. Noor está limpiando la cocina.
    note: 'El complemento va entre la forma de *zijn* y *aan het*: *ik ben de was aan het doen*. *Aan het* + infinitivo van juntos al final.'
  nl.a2.unit105.lesson02.teach.moeder:
    title: Llamar a alguien
    gloss: Lotte está llamando a su madre. Estamos preparando la comida. Tú estás lavando los platos.
    note: 'Con *bellen*, la persona a quien llamas es el complemento: *haar moeder aan het bellen*.'
  nl.a2.unit105.lesson03.teach.tijd:
    title: ¿Cuándo?
    gloss: todos los días / a menudo / en este momento / todos los sábados / ahora
    note: '*Elke dag, vaak* y *elke zaterdag* indican un hábito. *Nu* y *op dit moment* indican el momento presente.'
    example_gloss:
    - Cada día es diferente.
    - A menudo hay mucha gente.
    - En este momento hay tranquilidad.
  nl.a2.unit105.lesson03.teach.presens:
    title: El presente simple
    gloss: Cocino todos los días. Él cocina todos los días. Llamo a menudo. Él llama a menudo. Hago la colada. Él hace la colada.
    note: El presente simple (*ik kook, hij kookt*) sirve para hábitos y hechos. Se añade la terminación -t con *hij/ze/het*, y con *jij/je* cuando va antes del verbo (*jij kookt*).
  nl.a2.unit105.lesson03.teach.contrast:
    title: ¿Hábito o ahora mismo?
    gloss: Cocino todos los días. Ahora estoy cocinando. Lotte llama a menudo a su madre. Ahora está llamando a su madre.
    note: 'Presente simple: lo que ocurre con regularidad. *Zijn* + *aan het* + infinitivo: lo que está ocurriendo en este momento.'
  nl.a2.unit105.lesson03.teach.nu_voorop:
    title: Nu al principio
    gloss: Ahora estoy haciendo la colada. En este momento Omar está cocinando.
    note: 'Cuando *nu* u *op dit moment* abre la frase, el verbo se queda en segunda posición: *nu ben ik*. Ambos órdenes son correctos: *ik ben nu de was aan het doen*.'
  nl.a2.unit105.lesson04.teach.plekken:
    title: Lugares y cosas
    gloss: el sofá / el periódico / la cama / en la cama / el jardín
    note: '*Op de bank* = en el sofá; *in bed* = en la cama.'
    example_gloss:
    - El sofá es grande.
    - Él lee el periódico.
    - El jardín es bonito.
  nl.a2.unit105.lesson04.teach.houdingen:
    title: Verbos de postura
    gloss: estar sentado / estar de pie / estar tumbado / caminar / esperar
    note: 'Estos verbos indican cómo hace alguien algo: sentado, de pie, tumbado o caminando.'
    example_gloss:
    - Quiero sentarme.
    - Ella quiere ponerse de pie.
    - Él tiene que esperar.
  nl.a2.unit105.lesson04.teach.te:
    title: Zitten, staan, liggen, lopen + te
    gloss: Él está sentado llamando. Ella está de pie cocinando. Él está tumbado durmiendo. Ella camina de un lado a otro llamando.
    note: Usa *zit / staat / ligt / loopt* + *te* + infinitivo para decir qué hace alguien mientras está sentado, de pie, tumbado o caminando. Es muy frecuente en el neerlandés hablado.
  nl.a2.unit105.lesson04.teach.object_te:
    title: Complemento y lugar antes de te
    gloss: Él está sentado leyendo el periódico. Omar está en la cocina preparando sopa. Lotte está sentada en el sofá leyendo.
    note: 'Los complementos y los lugares van antes de *te*; el infinitivo va al final. El verbo conjugado se queda en segunda posición: *Hij zit ... te lezen.*'
  nl.a2.unit105.lesson04.teach.vergelijk:
    title: Aan het o zitten te
    gloss: Él está leyendo. Él está sentado leyendo. Ella está cocinando. Ella está de pie cocinando.
    note: Ambas formas indican que algo está en curso. *Zit/staat/ligt/loopt te* muestra además la postura, así que elige el verbo que corresponda a lo que la persona hace realmente.
  nl.a2.unit105.lesson05.teach.reading:
    title: El mensaje de Omar para Lotte
    gloss: ¡Hola, Lotte! Estoy en casa. Estoy preparando sopa. Mi hermana está sentada en el sofá llamando a mi madre. Noor está lavando los platos. ¿Y tú? ¿Qué estás haciendo?
    note: Averigua quién está haciendo qué en este momento.
    glosses:
      zus: hermana
      moeder: madre
      afwas: los platos sucios
      soep: sopa
      bank: sofá
  nl.a2.unit105.lesson06.teach.beurt1:
    title: Lotte pregunta a Omar
    gloss: 'Lotte: Hola, Omar, ¿qué estás haciendo?'
  nl.a2.unit105.lesson06.teach.beurt2:
    title: Omar responde y pregunta
    gloss: 'Omar: Estoy preparando sopa. ¿Y tú?'
  nl.a2.unit105.lesson06.teach.beurt3:
    title: Lotte responde
    gloss: 'Lotte: Estoy haciendo la colada.'
  nl.a2.unit105.lesson06.teach.beurt4:
    title: Omar pregunta por Noor
    gloss: 'Omar: ¿Y qué está haciendo Noor?'
  nl.a2.unit105.lesson06.teach.beurt5:
    title: Lotte describe a Noor
    gloss: 'Lotte: Noor está sentada en el sofá llamando por teléfono.'
