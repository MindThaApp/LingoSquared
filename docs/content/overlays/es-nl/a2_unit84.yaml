teaching:
  nl.a2.unit84.lesson01.teach.reiswoorden:
    title: Países, comida y viajes
    gloss: Bélgica / Alemania / Egipto / sushi / egipcio / viajar / comer / hacer una excursión en barco
    note: Estas son las palabras de viajes y comida que se usan en esta unidad.
    example_gloss:
    - Me gusta viajar.
    - Me gusta comer sushi.
    - He hecho una excursión en barco.
  nl.a2.unit84.lesson01.teach.ervaringswoorden:
    title: Palabras de experiencia
    gloss: alguna vez / nunca hasta ahora / estado / comido / viajado
    note: Usa *ooit* en preguntas y *nog nooit* cuando algo no ha ocurrido nunca hasta ahora.
    example_gloss:
    - ¿Alguna vez has estado en Bélgica?
    - Nunca he comido sushi.
  nl.a2.unit84.lesson01.teach.gn_vragen:
    title: Preguntas sobre experiencias con el perfectum
    gloss: ¿Alguna vez has comido sushi? ¿Alguna vez has estado en Bélgica?
    note: 'Para preguntar por una actividad se usa *hebben*: *Heb je ooit ... gegeten?* Para preguntar si has estado en un lugar se usa *zijn*: *Ben je ooit ... geweest?* El participio va al final.'
  nl.a2.unit84.lesson01.teach.gn_antwoorden:
    title: Respuestas cortas
    gloss: Sí, eso ya lo he hecho antes. No, nunca.
    note: '*Al eens* indica que ya ha ocurrido antes. *Nog nooit* indica que no ha ocurrido en ningún momento hasta ahora.'
  nl.a2.unit84.lesson02.teach.activiteiten:
    title: Actividades de viaje
    gloss: hacer una excursión en barco / visitar un museo / dormir en un hotel / trabajar dos veces
    note: Estas expresiones en infinitivo se convierten en experiencias en perfectum en la siguiente tarjeta.
    example_gloss:
    - Hago una excursión en barco.
    - Visito un museo.
  nl.a2.unit84.lesson02.teach.voltooide_ervaringen:
    title: Participios para experiencias
    gloss: hecho / visitado / dormido / trabajado
    note: 'Úsalos con *hebben*: *heb gemaakt, heeft bezocht, heb geslapen, heb gewerkt*.'
    example_gloss:
    - He hecho una excursión en barco.
    - He dormido en un hotel.
  nl.a2.unit84.lesson02.teach.gn_al_nog_niet:
    title: Ya frente a todavía no
    gloss: Eso ya lo he hecho. Eso todavía no lo he hecho.
    note: '*Al* señala una experiencia ya vivida. *Nog niet* indica que no ha ocurrido hasta ahora, pero que puede ocurrir más adelante. Ambos van antes del participio.'
  nl.a2.unit84.lesson02.teach.gn_positie:
    title: Dónde va la palabra de experiencia
    gloss: Ya he trabajado dos veces. Nunca he estado en Alemania.
    note: 'Con *hebben*, *al/twee keer* va antes del participio. Con *zijn ... geweest*, *nog nooit* va antes del complemento de lugar: *nog nooit in Duitsland geweest*.'
  nl.a2.unit84.lesson03.teach.tijdwoorden:
    title: Palabras de un momento concreto del pasado
    gloss: ayer / el año pasado / entonces / a menudo
    note: '*Gisteren, vorig jaar* y *toen* señalan un momento concreto del pasado, lo que a menudo pide el imperfectum al contar lo que ocurrió.'
    example_gloss:
    - Ayer trabajé.
    - El año pasado viajaba a menudo.
  nl.a2.unit84.lesson03.teach.verhaalvormen:
    title: Formas del imperfectum
    gloss: comió / era o estaba / visitó / viajaba
    note: Estas formas hablan de un momento concreto del pasado. El imperfectum regular se vio en la unidad 82 y las formas irregulares en la unidad 83.
    example_gloss:
    - Ayer comí sushi.
    - El año pasado estuve en Alemania.
  nl.a2.unit84.lesson03.teach.gn_contrast:
    title: Experiencia frente a un hecho fechado
    gloss: ¿Alguna vez has comido sushi? Ayer comí sushi.
    note: Usa el perfectum para preguntar si se ha vivido una experiencia. Usa el imperfectum para contar una historia situada en un momento concreto del pasado.
  nl.a2.unit84.lesson03.teach.gn_rule:
    title: Regla práctica
    gloss: 'Experiencia: he comido sushi. Historia concreta: ayer comí sushi.'
    note: 'Pregúntate: «¿ha ocurrido alguna vez en la vida de alguien?» y elige el perfectum. Si cuentas lo que pasó en un momento concreto del pasado, elige el imperfectum.'
  nl.a2.unit84.lesson04.teach.vragenlijst:
    title: El cuestionario
    gloss: el cuestionario / comida egipcia / hacer una excursión en barco / visitar un museo
    note: Los amigos usan estos temas para comparar sus experiencias.
    example_gloss:
    - Rellenamos el cuestionario.
    - Quiero comer comida egipcia.
  nl.a2.unit84.lesson04.teach.gn_kort_antwoord:
    title: Responder a una pregunta con hebben
    gloss: ¿Alguna vez has comido comida egipcia? Sí, ya lo he hecho alguna vez. No, nunca.
    note: La respuesta completa corta usa *dat heb ik ... gedaan* para retomar la actividad.
  nl.a2.unit84.lesson04.teach.gn_zijn_antwoord:
    title: Responder a una pregunta con zijn
    gloss: ¿Alguna vez has estado en Egipto? No, nunca he estado en Egipto.
    note: 'Usa *zijn* con *geweest*. Un orden neutro es *nog nooit + place + geweest*, es decir, nog nooit + lugar + geweest (el lugar también puede ir primero: *in Egypte nog nooit*).'
  nl.a2.unit84.lesson05.teach.noor_profiel:
    title: El perfil de viajes de Noor
    gloss: A Noor le encanta viajar y comer. Ha estado dos veces en Alemania y una vez ha dormido allí en un hotel pequeño. Ha comido pan alemán a menudo. Nunca ha estado en Egipto y nunca ha hecho un paseo en barco. Ya ha visitado un museo en Bélgica.
    note: El perfil contrasta experiencias ya vividas (*al, al eens, twee keer, vaak*) con experiencias que nunca han ocurrido (*nog nooit*).
    glosses:
      houdt: le encanta
      reizen: viajar
      twee: dos
      keer: veces
      klein: pequeño
      Duits: alemán
      brood: pan
      boottocht: paseo en barco
      museum: museo
      bezocht: visitado
  nl.a2.unit84.lesson06.teach.lotte_egyptisch:
    title: Lotte pregunta sobre comida
    gloss: 'Lotte: ¿Alguna vez has comido sushi?'
  nl.a2.unit84.lesson06.teach.omar_eten_reizen:
    title: Omar responde y pregunta
    gloss: 'Omar: Sí, lo he comido muchas veces. ¿Has estado alguna vez en Egipto?'
  nl.a2.unit84.lesson06.teach.lotte_duitsland:
    title: Lotte compara experiencias
    gloss: 'Lotte: No, nunca. Pero sí he estado alguna vez en Alemania.'
  nl.a2.unit84.lesson06.teach.omar_boot:
    title: Omar pregunta por un paseo en barco
    gloss: 'Omar: ¿Hiciste un paseo en barco allí?'
  nl.a2.unit84.lesson06.teach.lotte_nog_niet:
    title: Lotte dice que todavía no
    gloss: 'Lotte: No, eso todavía no lo he hecho. ¿Y tú?'
  nl.a2.unit84.lesson06.teach.omar_al_eens:
    title: Omar dice que sí
    gloss: 'Omar: Sí, ya lo he hecho alguna vez.'
