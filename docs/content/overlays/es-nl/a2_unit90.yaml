course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para dar y responder a consejos sencillos.
  learning_goal: Da consejos con je moet, je zou ... moeten, het is beter om ... te y waarom ... niet, y responde a los consejos.
units:
  nl.a2.unit90.goede_raad:
    title: Buenos consejos
    description: Da y responde a consejos sencillos sobre problemas de salud, estudios y dinero.
lessons:
  nl.a2.unit90.lesson01.je_moet_rusten:
    title: Tienes que descansar
  nl.a2.unit90.lesson02.je_zou_moeten:
    title: Deberías
  nl.a2.unit90.lesson03.moet_zou_of_beter:
    title: Tienes que, deberías o es mejor
  nl.a2.unit90.lesson04.waarom_niet:
    title: ¿Por qué no?
  nl.a2.unit90.lesson05.bericht_van_lotte:
    title: Un mensaje de Lotte
  nl.a2.unit90.lesson06.lotte_en_omar:
    title: Lotte y Omar
teaching:
  nl.a2.unit90.lesson01.teach.gezondheid:
    title: Palabras de salud
    gloss: dolor de cabeza / médico / farmacia / enfermo / cansado
    note: Estas palabras describen un pequeño problema de salud.
    example_gloss:
    - Me duele la cabeza.
    - Estoy enfermo.
    - Estoy cansado.
  nl.a2.unit90.lesson01.teach.werkwoorden:
    title: Verbos para dar consejos
    gloss: descansar / dormir / beber / ir / el agua
    note: Después de *moet*, el verbo de acción queda en infinitivo y normalmente va al final.
    example_gloss:
    - Bebo agua.
    - Voy a la farmacia.
    - Duermo mucho.
  nl.a2.unit90.lesson01.teach.gn_je_moet:
    title: Dar consejos firmes con je moet
    gloss: Debes descansar. Debes beber agua. Debes ir al médico.
    note: 'Consejo firme y directo: *je moet* + el resto de la frase + el infinitivo al final de todo. *Moeten* es el infinitivo; con *je* pasa a ser *moet*.'
  nl.a2.unit90.lesson01.teach.jij:
    title: Je o jij
    gloss: Debes descansar. Tú también debes descansar.
    note: '*Je* y *jij* significan «tú»; *jij* es un poco más enfático.'
  nl.a2.unit90.lesson01.teach.vraag:
    title: Pedir consejo
    gloss: ¿Qué debería hacer? (pidiendo consejo)
    note: '*Doen* es el infinitivo que va al final.'
  nl.a2.unit90.lesson02.teach.studie:
    title: Palabras de estudio
    gloss: examen / deberes / estudiar, aprender / practicar / cada día / mañana
    note: '*Leren* puede significar estudiar o aprender.'
    example_gloss:
    - Mañana tengo un examen.
    - Estoy haciendo mis deberes.
  nl.a2.unit90.lesson02.teach.geld:
    title: Palabras de dinero
    gloss: dinero / ahorrar / gastar / menos / más / poco
    note: Estas palabras te permiten hablar de problemas de dinero.
    example_gloss:
    - Tengo poco dinero.
    - Quiero ahorrar más.
  nl.a2.unit90.lesson02.teach.gn_zou_moeten:
    title: 'Dar consejos más suaves: je zou ... moeten'
    gloss: Deberías descansar. Deberías beber agua. Deberías gastar menos dinero.
    note: 'Consejo más suave: *je zou* + el resto de la frase + *moeten* + el infinitivo. *Moeten* y el infinitivo van juntos al final: *moeten drinken*, *moeten uitgeven*.'
  nl.a2.unit90.lesson02.teach.problemen:
    title: Dos problemas
    gloss: Tengo poco dinero. Mañana tengo un examen.
  nl.a2.unit90.lesson03.teach.tijd:
    title: Palabras de tiempo
    gloss: temprano / tarde / la semana / hoy / la cama
    note: Para decir que te vas a la cama, usa *naar bed gaan*.
    example_gloss:
    - Hoy me acuesto temprano.
    - Ahorro cada semana.
  nl.a2.unit90.lesson03.teach.gn_beter_om:
    title: Het is beter om ... te (consejo)
    gloss: Es mejor acostarse temprano. Es mejor ahorrar cada semana.
    note: 'Consejo tranquilo y neutro: *Het is beter om* + el resto + *te* + el infinitivo al final. La palabra *te* va justo delante del infinitivo.'
  nl.a2.unit90.lesson03.teach.gn_contrast:
    title: Tres formas de dar consejos
    gloss: Debes descansar. Deberías descansar. Es mejor descansar.
    note: 'Tres niveles de consejo: *je moet* es firme, *je zou ... moeten* es más suave y *het is beter om ... te* es tranquilo y neutro. Usa las formas más suaves con amigos cuando no estés seguro.'
  nl.a2.unit90.lesson03.teach.voorbeelden:
    title: Más ejemplos
    gloss: Es mejor beber agua. Es mejor practicar cada día.
  nl.a2.unit90.lesson04.teach.woorden:
    title: Problema, consejo, sugerencia
    gloss: problema / consejo / sugerencia
    note: '*Advies* es la palabra general para «consejo»; para un consejo pequeño y concreto, normalmente se dice *een tip*.'
    example_gloss:
    - Tengo un problema.
    - Es un buen consejo.
  nl.a2.unit90.lesson04.teach.gn_waarom_niet:
    title: Waarom ... niet? como consejo
    gloss: ¿Por qué no vas al médico? ¿Por qué no ahorras un poco más? ¿Por qué no practicas cada día?
    note: 'Una forma amable de sugerir algo: *Waarom* + verbo + *je* + *niet* + resto. El verbo va justo después de *waarom*, antes de *je*.'
  nl.a2.unit90.lesson04.teach.gn_reageren:
    title: Responder a un consejo
    gloss: Buena idea. Lo haré. Gracias por el consejo.
    note: 'Formas breves de responder a un consejo: *Goed idee* (te gusta), *Dat doe ik* (lo vas a hacer), *Bedankt voor de tip* (das las gracias).'
  nl.a2.unit90.lesson04.teach.zin:
    title: Pedir ayuda
    gloss: Tengo un problema. ¿Qué debería hacer?
  nl.a2.unit90.lesson05.teach.lezen:
    title: El consejo de Lotte
    gloss: Hola, Omar, gracias por tu mensaje. Tienes dolor de cabeza y estás cansado. Hoy debes descansar y beber mucha agua. También deberías tomar menos café. Es mejor acostarse temprano. ¿Por qué no vas mañana al médico? Un saludo, Lotte
    note: Lotte responde a Omar con los tres tipos de consejo y una sugerencia con *waarom ... niet?*.
  nl.a2.unit90.lesson06.teach.omar_probleem:
    title: Omar dice cuál es su problema
    gloss: 'Omar: Hola, Lotte, tengo un problema. Me duele la cabeza.'
  nl.a2.unit90.lesson06.teach.lotte_rusten:
    title: Lotte da un consejo firme
    gloss: 'Lotte: ¡Qué fastidio! Debes descansar y beber agua.'
  nl.a2.unit90.lesson06.teach.omar_idee:
    title: Omar acepta y añade un segundo problema
    gloss: 'Omar: Buena idea. Además tengo poco dinero.'
  nl.a2.unit90.lesson06.teach.lotte_geld:
    title: Lotte da un consejo más suave y otro neutro
    gloss: 'Lotte: Deberías gastar menos dinero. Es mejor ahorrar cada semana.'
  nl.a2.unit90.lesson06.teach.omar_bedankt:
    title: Omar promete y da las gracias
    gloss: 'Omar: Lo haré. ¡Gracias por los consejos!'
  nl.a2.unit90.lesson06.teach.lotte_bed:
    title: Lotte termina con una sugerencia
    gloss: 'Lotte: ¡De nada! ¿Por qué no te acuestas temprano?'
exercises:
  nl.a2.unit90.lesson01.exercise01.kies_rusten:
    instruction: Elige la frase en neerlandés que significa «Debes descansar».
    correct_option: Je moet rusten.
    distractors:
    - Je moet slapen.
    - Je moet water drinken.
    - Ik moet rusten.
    accepted_answers:
    - value: Je moet rusten.
      status: correct
    feedback: '*Je moet rusten* = Debes descansar.'
    prompt_blocks:
    - Tienes que descansar.
