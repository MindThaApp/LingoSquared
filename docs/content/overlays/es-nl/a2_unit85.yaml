teaching:
  nl.a2.unit85.lesson01.teach.reiswoorden:
    title: Viajar en tren
    gloss: el tren / la estación / llegar / salir
    note: El verbo separable aankomen se convierte en ik kom aan en una oración principal.
    example_gloss:
    - El tren llega a la estación.
    - El tren sale a las ocho.
  nl.a2.unit85.lesson01.teach.tijdwoorden:
    title: Ordenar hechos pasados
    gloss: cuando / ya / antes / tarde
    note: Al indica que algo ya había ocurrido antes del momento de referencia posterior.
    example_gloss: Llegué tarde.
  nl.a2.unit85.lesson01.teach.vormen:
    title: Tres formas útiles del pasado
    gloss: llegué / el tren salió / el tren había salido
    example_gloss: Llegué, pero el tren había salido.
  nl.a2.unit85.lesson01.teach.gn_vvt:
    title: Un hecho antes de otro
    gloss: Cuando llegué, el tren ya había salido.
    note: La llegada es el punto de referencia pasado posterior. Was vertrokken sitúa la salida del tren antes de ella.
  nl.a2.unit85.lesson01.teach.gn_bouw:
    title: Cómo formar el pluscuamperfecto
    gloss: 'Pluscuamperfecto: had o was más un participio.'
    note: En neerlandés se llama voltooid verleden tijd. Se forma con had/was y el mismo participio y el mismo auxiliar que en el perfectum, de forma parecida al pluscuamperfecto español.
  nl.a2.unit85.lesson02.teach.bagage:
    title: Equipaje perdido
    gloss: la maleta / el bolso / perder / olvidar / encontrar
    example_gloss:
    - Estoy buscando mi maleta.
    - ¿Dónde está mi bolso?
  nl.a2.unit85.lesson02.teach.vormen:
    title: Participios útiles
    gloss: perdido / olvidado / encontrado / ido / venido
    example_gloss: Había encontrado la maleta.
  nl.a2.unit85.lesson02.teach.zinnen:
    title: Had y was
    gloss: Había perdido mi maleta. Ella se había ido a casa.
  nl.a2.unit85.lesson02.teach.gn_aux:
    title: El auxiliar se mantiene
    gloss: 'Perfecto: he encontrado el bolso, he venido. Pluscuamperfecto: había encontrado el bolso, había venido.'
    note: Un verbo que usa hebben en el perfectum usa had en el pluscuamperfecto. Un verbo que usa zijn usa was.
  nl.a2.unit85.lesson03.teach.nog_niet:
    title: Todavía no
    gloss: todavía no / abierto / cerrado / la ventanilla
    example_gloss: La ventanilla está cerrada.
  nl.a2.unit85.lesson03.teach.afspraak:
    title: Citas y esperas
    gloss: la cita / perder (no llegar a) / esperar
    example_gloss:
    - Mañana tengo una cita.
    - No quiero perder el tren.
    - Estoy esperando en la ventanilla.
  nl.a2.unit85.lesson03.teach.vormen:
    title: En la ventanilla
    gloss: La ventanilla aún no estaba abierta. Perdí mi cita.
  nl.a2.unit85.lesson03.teach.gn_contrast:
    title: Perfecto frente a pluscuamperfecto
    gloss: He perdido mi bolso. Ya había perdido mi bolso cuando llegué a la ventanilla.
    note: El perfecto informa de un hecho terminado. El pluscuamperfecto lo sitúa explícitamente antes de otro momento pasado.
  nl.a2.unit85.lesson03.teach.gn_al_nog:
    title: Ya y todavía no
    gloss: El tren ya había salido. La ventanilla aún no estaba abierta.
    note: Usa al para un hecho completado antes y nog niet para algo que todavía no estaba completo en ese momento del pasado.
  nl.a2.unit85.lesson04.teach.scenario:
    title: Una secuencia antes de la salida
    gloss: comer / salir / llamar / ir a la estación
    example_gloss: Voy a la estación.
  nl.a2.unit85.lesson04.teach.vormen:
    title: Formas de la secuencia
    gloss: comido / salido / llamado / fue
    example_gloss: Había llamado a Omar.
  nl.a2.unit85.lesson04.teach.zin:
    title: Después de comer
    gloss: Después de haber comido, fui a la estación.
  nl.a2.unit85.lesson04.teach.gn_nadat:
    title: Nadat con had al final
    gloss: Después de haber comido, fui a la estación.
    note: 'En la subordinada con nadat, el participio va antes del auxiliar, al final: gegeten had. La oración principal siguiente empieza con el verbo: ging ik.'
  nl.a2.unit85.lesson04.teach.gn_zijn:
    title: Nadat con was al final
    gloss: Después de que el tren hubo salido, llamé a Omar.
    note: 'Vertrekken usa zijn, así que la subordinada termina en vertrokken was. La subordinada al principio provoca la inversión: belde ik.'
  nl.a2.unit85.lesson05.teach.reading:
    title: El paraguas perdido de Noor
    gloss: Noor llegó tarde a la estación. Su tren ya había salido. Había olvidado su paraguas en el tren anterior. En la oficina de objetos perdidos oyó que alguien había encontrado el paraguas.
    note: 'Fíjate en los dos hechos anteriores: el tren salió y Noor olvidó el paraguas antes de llegar a la ventanilla.'
    glosses:
      laat: tarde
      vertrokken: salido
      paraplu: paraguas
      vergeten: olvidado
      voorwerpen: 'objetos; aquí: objetos perdidos'
      gevonden: encontrado
  nl.a2.unit85.lesson05.teach.gn_reading:
    title: Cómo situar el hecho anterior
    gloss: El pluscuamperfecto neerlandés usa had o was más un participio para situar un hecho antes de otro momento del pasado.
    note: En la historia de Noor, *was vertrokken* y *had vergeten* marcan hechos que ya estaban completos en los momentos de referencia posteriores.
  nl.a2.unit85.lesson06.teach.lotte_vraag:
    title: Lotte pregunta por el retraso
    gloss: 'Lotte: ¿Por qué llegaste tarde a nuestra cita?'
  nl.a2.unit85.lesson06.teach.omar_trein:
    title: Omar explica por qué perdió el tren
    gloss: 'Omar: Cuando llegué a la estación, el tren ya había salido.'
  nl.a2.unit85.lesson06.teach.lotte_tas:
    title: Lotte pregunta por el bolso
    gloss: 'Lotte: ¿Y tu bolso?'
  nl.a2.unit85.lesson06.teach.omar_tas:
    title: Omar explica lo del bolso perdido
    gloss: 'Omar: Lo había olvidado en el tren anterior, pero la ventanilla de objetos perdidos todavía no estaba abierta.'
  nl.a2.unit85.lesson06.teach.gn_recap:
    title: Dos explicaciones breves
    gloss: Cuando llegué, el tren ya había salido. Había olvidado mi bolso.
    note: Was vertrokken usa zijn; had vergeten usa hebben.
