teaching:
  nl.a1.unit29.lesson01.teach.hobbies_set1:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'Tres verbos habituales de aficiones: *lezen* (leer), *sporten* (hacer deporte) y *koken* (cocinar).'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  nl.a1.unit29.lesson01.teach.vrije_tijd:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*De vrije tijd* es un sustantivo de género común: *de vrije tijd*. Es la expresión clave para hablar de aficiones.'
    example_gloss: En mi tiempo libre me gusta leer.
  nl.a1.unit29.lesson01.teach.in_vrije_tijd:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*Lees* es la primera persona del singular de *lezen* (leer).'
  nl.a1.unit29.lesson02.teach.hobbies_set2:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres verbos más de aficiones: *muziek luisteren* (escuchar música), *tekenen* (dibujar) y *gamen* (jugar a videojuegos), un préstamo del inglés muy usado en neerlandés.'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  nl.a1.unit29.lesson02.teach.luister_muziek:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*Luisteren naar* (escuchar) siempre lleva *naar* delante de su complemento.'
  nl.a1.unit29.lesson02.teach.game_vrienden:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: '*Met vrienden* (con amigos) retoma *vrienden* de la lección 1.'
  nl.a1.unit29.lesson03.teach.frequency_set1:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: Los cuatro adverbios básicos de frecuencia. *Vaak* ya apareció en la unidad 5, en *Zie je hem vaak?*; los otros tres son nuevos aquí.
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  nl.a1.unit29.lesson03.teach.frequency_set2:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*Elke week* y *elk weekend* significan ambos «cada», pero la forma cambia según el género del sustantivo; mira la tarjeta siguiente.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  nl.a1.unit29.lesson03.teach.elke_elk_grammar:
    title: Elke y elk
    gloss: Con las palabras de como week se usa elke. Con las palabras het como weekend se usa elk.
    note: '*Week* es una palabra de (*de week*), por eso lleva *elke*; *weekend* es una palabra het (*het weekend*), por eso lleva *elk*. Es la misma concordancia de/het que hay en *de rekening* frente a *het wisselgeld* en la unidad 23.'
  nl.a1.unit29.lesson03.teach.vrije_tijd_vraag:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  nl.a1.unit29.lesson04.teach.lotte_callback:
    title: Lotte saca el tema de las aficiones
    gloss: 'Lotte: Paseamos juntos a menudo. Pero ¿qué más haces en tu tiempo libre, Omar?'
    note: '*We wandelen vaak samen* retoma la unidad 13, donde tanto Lotte como Omar dijeron que les gusta *wandelen*.'
  nl.a1.unit29.lesson04.teach.omar_cook_sport:
    title: Las aficiones de Omar
    gloss: 'Omar: Me gusta cocinar, también en casa. Y hago deporte a menudo.'
    note: '*Ook thuis* (también en casa) aclara que Omar cocina por gusto, no solo en su trabajo en el restaurante.'
  nl.a1.unit29.lesson04.teach.lotte_surprised:
    title: Lotte se sorprende
    gloss: 'Lotte: ¿También cocinas en casa? ¡Si ya cocinas todo el día en el trabajo!'
    note: '*Al de hele dag* (ya todo el día) subraya cuánto cocina ya Omar en el trabajo.'
  nl.a1.unit29.lesson04.teach.omar_relaxing:
    title: Omar explica
    gloss: 'Omar: Sí, pero cocinar me parece relajante. Y tú, ¿qué te gusta hacer?'
    note: '*Koken vind ik ontspannend* coloca el complemento *koken* al principio para enfatizarlo; literalmente: «cocinar, me parece relajante».'
  nl.a1.unit29.lesson04.teach.lotte_reads_music:
    title: Las aficiones de Lotte
    gloss: 'Lotte: Me gusta leer y a menudo escucho música.'
    note: Combina dos verbos de aficiones de las lecciones 1 y 2 en una frase con *en* (y).
  nl.a1.unit29.lesson04.teach.omar_ask_game:
    title: Omar pregunta por los videojuegos
    gloss: 'Omar: ¿Tú también juegas a videojuegos?'
    note: Una pregunta corta de sí o no con *gamen*, de la lección 2.
  nl.a1.unit29.lesson04.teach.lotte_no_game_draw:
    title: Lotte responde
    gloss: 'Lotte: No, yo nunca juego a videojuegos. ¡Pero a veces dibujo!'
    note: '*Nooit* (nunca) y *soms* (a veces), de la lección 3, contrastados en una misma respuesta.'
  nl.a1.unit29.lesson05.teach.vergelijking:
    title: Comparar aficiones
    gloss: Omar y yo paseamos juntos a menudo. Pero también tenemos otras aficiones. A Omar le gusta cocinar, también en casa, y hace deporte a menudo. A mí me gusta leer y a menudo escucho música. A veces dibujo, pero nunca juego a videojuegos. ¿Qué te gusta hacer a ti en tu tiempo libre?
    note: El mensaje de Lotte resume datos de la lección 4 y termina haciendo al lector la pregunta central de la unidad.
    glosses:
      wandelen: pasea
      vaak: a menudo
      samen: juntos
      andere: otros
      kookt: cocina
      graag: le gusta
      thuis: en casa
      sport: hace deporte
      lees: leer
      luister: escucho
      muziek: música
      teken: dibujo
      soms: a veces
      game: juego a videojuegos
      nooit: nunca
      vrije: libre
      tijd: tiempo
  nl.a1.unit29.lesson06.teach.omar_ask_weekend:
    title: Omar pregunta por el fin de semana
    gloss: 'Omar: ¿Qué haces este fin de semana?'
    note: '*Dit weekend* (este fin de semana) retoma la expresión de tiempo de la unidad 19.'
  nl.a1.unit29.lesson06.teach.lotte_unsure:
    title: Lotte está indecisa
    gloss: 'Lotte: Todavía no lo sé. Me gusta leer, pero también quiero salir.'
    note: '*Naar buiten* (fuera, literalmente «hacia fuera») es una forma habitual de decir que quieres salir de casa.'
  nl.a1.unit29.lesson06.teach.omar_suggest_walk_cook:
    title: Omar propone un plan
    gloss: 'Omar: ¿Paseamos juntos? Después cocino para los dos.'
    note: '*Daarna* (después) retoma la palabra de secuencia de la Unidad 10: *eerst, dan, daarna*.'
  nl.a1.unit29.lesson06.teach.lotte_agree_both:
    title: Lotte acepta
    gloss: 'Lotte: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*Allebei* (los dos) indica que a Lotte le gustan las dos cosas por igual, no una más que la otra.'
  nl.a1.unit29.lesson06.teach.omar_confirm_saturday:
    title: Omar confirma
    gloss: 'Omar: Perfecto. ¡Entonces nos vemos el sábado!'
    note: Una frase de cierre amistosa que confirma el plan para el *zaterdag* (sábado).
