  nl.a2.unit28.lesson04.teach.contact_24_uur:
    title: El compromiso de respuesta de la corporación
    gloss: Nos pondremos en contacto con usted en un plazo de veinticuatro horas.
    note: '*Opnemen* (en la expresión fija *contact opnemen met*, ponerse en contacto con) es un verbo separable; *op* pasa al final.'
  nl.a2.unit28.lesson05.teach.bevestiging:
    title: Leer una confirmación
    gloss: 'Confirmación: hemos recibido su aviso sobre la calefacción. Un técnico pasará mañana por la mañana entre las nueve y las once. ¿No está en casa? Entonces llame a la corporación de viviendas.'
    note: '*De woningcorporatie* es la corporación de viviendas que gestiona los pisos de alquiler en los Países Bajos.'
    glosses:
      Bevestiging: confirmación
      melding: aviso / notificación
      verwarming: calefacción
      ontvangen: recibido (participio de ontvangen, recibir)
      monteur: técnico / reparador
      komt: viene / vendrá (de komen)
      morgenochtend: mañana por la mañana
      tussen: entre
      negen: nueve
      elf: once
      uur: horas (lit. hora)
      langs: de visita / pasar (parte separable de langskomen, pasar por un sitio)
      Bent: está (de zijn; Bent u = ¿está usted?)
      thuis: en casa
      Bel: llame (imperativo de bellen, llamar por teléfono)
      woningcorporatie: corporación de viviendas
