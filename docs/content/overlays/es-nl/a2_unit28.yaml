    title: Preguntar cuándo viene el técnico
    gloss: ¿Cuándo pasa el técnico?
    note: '*Langskomen* (pasar por, visitar) es un verbo separable; *langs* va al final de la oración.'
  nl.a2.unit28.lesson03.teach.monteur_morgenochtend:
    title: Confirmar la llegada del técnico
    gloss: El técnico pasará mañana por la mañana.
    note: '*Morgenochtend* une *morgen* (mañana) y *ochtend* (mañana, parte del día).'
  nl.a2.unit28.lesson04.teach.melding:
    title: El aviso
    gloss: el aviso/la notificación
    note: '*De melding* es la palabra habitual para un aviso o notificación formal, por ejemplo a una empresa o a una autoridad.'
    example_gloss: Quisiera avisar de una incidencia con la calefacción.
  nl.a2.unit28.lesson04.teach.melding_doen:
