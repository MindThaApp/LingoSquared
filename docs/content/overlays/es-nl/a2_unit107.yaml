course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para invitar, aceptar y rechazar invitaciones.
  learning_goal: Invita a alguien y acepta o rechaza una invitación con un motivo y una alternativa, usando verbos modales, omdat/want y gaan/zullen.
units:
  nl.a2.unit107.uitnodigen_en_afslaan:
    title: Invitar y rechazar
    description: Invita a un amigo, acepta con entusiasmo o rechaza con amabilidad dando un motivo y un plan alternativo.
lessons:
  nl.a2.unit107.lesson01.een_uitnodiging:
    title: Una invitación
  nl.a2.unit107.lesson02.ja_graag:
    title: ¡Sí, con gusto!
  nl.a2.unit107.lesson03.helaas_ik_kan_niet:
    title: Por desgracia no puedo
  nl.a2.unit107.lesson04.zullen_we_zondag:
    title: ¿Quedamos el domingo?
  nl.a2.unit107.lesson05.noors_uitnodiging:
    title: La invitación de Noor
  nl.a2.unit107.lesson06.lotte_en_omar_plannen:
    title: Lotte y Omar hacen planes
teaching:
  nl.a2.unit107.lesson01.teach.plekken:
    title: Lugares y ocasiones
    gloss: la fiesta / el cumpleaños / el cine / el concierto / el teatro
    note: Son las ocasiones y los lugares a los que invitas a la gente.
    example_gloss:
    - Lotte tiene una fiesta el sábado.
    - Noor cumple años el domingo.
    - Esta noche vamos al cine.
    - El sábado hay un concierto.
    - El teatro está en el centro.
  nl.a2.unit107.lesson01.teach.film:
    title: Película, función, entrada
    gloss: la película / la función / la entrada / esta noche / el sábado / el domingo
    note: '*Voorstelling* es una función o representación, por ejemplo en el teatro.'
    example_gloss:
    - La película empieza a las ocho.
    - La función es el sábado.
    - Tengo dos billetes.
    - Esta noche hay una película.
  nl.a2.unit107.lesson01.teach.gn_zin:
    title: Heb je zin om ... te ...?
    gloss: ¿Te apetece ir al cine el sábado?
    note: Usa *Heb je zin om ... te + infinitivo?* para invitar a alguien. El infinitivo (*gaan*) va al final de todo, después de *te*.
    example_gloss:
    - ¿Te apetece ir al concierto?
    - ¿Te apetece ir al teatro esta noche?
  nl.a2.unit107.lesson01.teach.gn_kom_je:
    title: Kom je ook naar ...?
    gloss: ¿Vienes tú también a la fiesta? ¿Vienes tú también al cine?
    note: '*Kom je ook naar ...?* es una invitación breve y amistosa. *Jij* es la forma tónica de *je*; aquí valen las dos.'
    example_gloss:
    - ¿Vienes tú también a la fiesta de Noor?
  nl.a2.unit107.lesson01.teach.gn_wil_je_mee:
    title: Wil je mee naar ...?
    gloss: ¿Quieres venir al concierto? ¿Quieres venir al teatro?
    note: '*Mee* significa ''con (nosotros)'', ''junto''. *Wil je mee naar ...?* no necesita infinitivo: el movimiento ya está en *mee naar*.'
    example_gloss:
    - ¿Quieres venir a la película?
  nl.a2.unit107.lesson01.teach.zinnen:
    title: Tres invitaciones
    gloss: ¿Te apetece ir al cine esta noche? ¿Vienes tú también a la fiesta? ¿Quieres venir al concierto?
  nl.a2.unit107.lesson02.teach.leuk:
    title: Decir que sí
    gloss: agradable, bonito / agradable y animado / con gusto / buena idea
    note: '*Gezellig* describe un ambiente agradable y sociable. *Graag* significa ''con gusto''.'
    example_gloss:
    - ¡Qué bien!
    - Me parece divertido.
    - ¡Sí, con gusto!
    - ¡Buena idea!
  nl.a2.unit107.lesson02.teach.gn_ja:
    title: Aceptar una invitación
    gloss: ¡Qué bien! ¡Sí, con gusto! Me apunto. Vengo con gusto.
    note: 'Acepta con una reacción breve (*Leuk!*, *Ja, graag!*) y luego confirma: *Ik ga mee* o *Ik kom graag*.'
    example_gloss:
    - Iré con gusto a la fiesta.
    - Sí, me apunto a la película.
  nl.a2.unit107.lesson02.teach.gn_lijkt:
    title: Dat lijkt me ...
    gloss: Me parece divertido. Me parece agradable.
    note: '*Dat lijkt me ...* es una forma habitual de decir que te gusta un plan. El verbo *lijkt* se queda en segunda posición.'
    example_gloss:
    - Me parece una buena idea.
  nl.a2.unit107.lesson02.teach.tijd:
    title: Preguntar la hora
    gloss: ¿A qué hora empieza? Empieza a las ocho.
    note: Después de aceptar, pregunta la hora con *Hoe laat begint het?* y responde con *om ... uur*.
    example_gloss:
    - La película empieza a las nueve.
    - La función empieza a las ocho.
  nl.a2.unit107.lesson03.teach.helaas:
    title: Rechazar y dar motivos
    gloss: por desgracia / no / pero / trabajar / cansado / enfermo / la cita / no tener tiempo
    note: '*Helaas* suaviza una negativa. *Geen tijd* significa ''sin tiempo''.'
    example_gloss:
    - Por desgracia no puedo.
    - Me gustaría, pero no tengo tiempo.
    - Tengo que trabajar.
    - Estoy cansado.
    - Estoy enfermo.
    - Tengo una cita.
  nl.a2.unit107.lesson03.teach.gn_modals:
    title: Kunnen, moeten, willen
    gloss: No puedo venir. Tengo que trabajar. Quiero, pero no tengo tiempo.
    note: '*Kunnen*, *moeten* y *willen* suelen ir con un segundo verbo en infinitivo al final de la oración: *Ik kan niet komen*; *Ik moet werken*.'
    example_gloss:
    - No puedo ir a la fiesta.
    - El sábado tengo que trabajar.
  nl.a2.unit107.lesson03.teach.gn_want:
    title: Want da un motivo
    gloss: Por desgracia no puedo venir, porque tengo que trabajar.
    note: '*Want* une dos oraciones principales, así que el orden de las palabras no cambia: sujeto y luego verbo (*want ik moet werken*).'
    example_gloss:
    - No puedo venir, porque estoy enfermo.
  nl.a2.unit107.lesson03.teach.gn_omdat:
    title: Omdat lleva el verbo al final
    gloss: No voy a venir, porque tengo una cita.
    note: 'Después de *omdat*, el verbo va al final de la oración: *omdat ik een afspraak heb*. Con un verbo modal, los dos verbos quedan juntos al final, con el verbo conjugado primero: *omdat ik moet werken*.'
    example_gloss:
    - Por desgracia no puedo venir, porque tengo que trabajar.
  nl.a2.unit107.lesson03.teach.gn_contrast:
    title: Want y omdat
    gloss: No voy, porque tengo una cita. (las dos frases)
    note: Las dos dan un motivo. *Want ik heb* mantiene el verbo en segundo lugar; *omdat ik ... heb* lo pone al final.
  nl.a2.unit107.lesson03.teach.zin:
    title: Un no educado
    gloss: Por desgracia no puedo, porque tengo que trabajar.
  nl.a2.unit107.lesson04.teach.alt:
    title: Proponer otra cosa
    gloss: en su lugar / entonces / la semana que viene / mañana / perfecto / (matiz)
    note: '*In plaats daarvan* significa ''en lugar de eso''. Aquí *wel* subraya que esta opción sí funciona.'
    example_gloss:
    - ¿Y si vamos el domingo en su lugar?
    - Entonces tengo tiempo.
    - La semana que viene me viene bien.
    - Mañana voy a trabajar.
    - Eso está bien.
  nl.a2.unit107.lesson04.teach.gn_zullen:
    title: Zullen we ...?
    gloss: ¿Vamos a la película el domingo? ¿Vamos al cine el domingo en su lugar?
    note: '*Zullen we ...?* propone un plan en común. El verbo del plan (*gaan*) va al final.'
    example_gloss:
    - ¿Vamos al concierto mañana?
  nl.a2.unit107.lesson04.teach.gn_gaan:
    title: Gaan para el futuro
    gloss: Voy a trabajar el sábado. Vamos a ir a la película el domingo.
    note: '*Gaan* + infinitivo habla de planes: *Ik ga zaterdag werken*. El infinitivo se queda al final. Si una palabra de tiempo va primero, el verbo sigue en segunda posición: *Zondag gaan wij ...*.'
    example_gloss:
    - Mañana voy al teatro.
    - El domingo vamos al concierto.
  nl.a2.unit107.lesson04.teach.gn_zal:
    title: Zullen para una promesa
    gloss: Te llamaré mañana.
    note: '*Zullen* también puede expresar un plan o una promesa: *Ik zal je morgen bellen*. *Zal ik ...?* ofrece algo; *Zullen we ...?* propone algo.'
    example_gloss:
    - Vendré el domingo.
  nl.a2.unit107.lesson04.teach.zinnen:
    title: No, con una alternativa
    gloss: Por desgracia no puedo, porque tengo que trabajar. ¿Vamos el domingo?
  nl.a2.unit107.lesson05.teach.woorden:
    title: Palabras de un mensaje
    gloss: la invitación / gracias / saludos / ya / quedar
    note: '*Groetjes* se usa para terminar un mensaje amistoso.'
    example_gloss:
    - ¡Gracias por la invitación!
    - Saludos, Lotte
    - Ya tengo una cita.
  nl.a2.unit107.lesson05.teach.gn_voltooid:
    title: Heb + participio (solo lectura)
    gloss: He quedado con mis padres. He trabajado.
    note: Con la mayoría de los verbos, *heb + participio* (*afgesproken*, *gewerkt*) indica lo que ya ha pasado. Por ahora, solo reconócelo al leer; todavía no necesitas escribirlo.
  nl.a2.unit107.lesson05.teach.reading:
    title: Noor y Lotte escriben
    gloss: 'Hola, Lotte: ¿te apetece venir al teatro el sábado? La función empieza a las ocho. ¿Vienes tú también? Saludos, Noor. Hola, Noor: ¡gracias por la invitación! Por desgracia no puedo, porque ya he quedado con mis padres. ¿Vamos a la película el domingo? Entonces tengo tiempo. Saludos, Lotte'
    note: Encuentra la invitación, la respuesta, el motivo y la alternativa.
    glosses:
      afgesproken: quedado
      ouders: padres
      uitnodiging: invitación
      groetjes: saludos
  nl.a2.unit107.lesson06.teach.beurt1:
    title: Lotte invita a Omar
    gloss: 'Lotte: Hola, Omar, ¿te apetece venir al concierto el sábado?'
  nl.a2.unit107.lesson06.teach.beurt2:
    title: Omar rechaza la invitación y da un motivo
    gloss: 'Omar: Lamentablemente no puedo, porque tengo que trabajar.'
  nl.a2.unit107.lesson06.teach.beurt3:
    title: Lotte propone una alternativa
    gloss: 'Lotte: ¡Qué pena! ¿Vamos al cine el domingo?'
  nl.a2.unit107.lesson06.teach.beurt4:
    title: Omar acepta y pregunta la hora
    gloss: 'Omar: El domingo sí puedo. ¿A qué hora empieza la película?'
  nl.a2.unit107.lesson06.teach.beurt5:
    title: Lotte dice la hora
    gloss: 'Lotte: A las ocho.'
  nl.a2.unit107.lesson06.teach.beurt6:
    title: Omar acepta
    gloss: 'Omar: ¡Qué bien, con gusto! Voy contigo.'
