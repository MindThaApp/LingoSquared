  nl.a1.unit43.lesson05.teach.tekst:
    title: Una conversación sobre las estaciones
    gloss: 'Ahora es primavera. Los tulipanes son preciosos. Nina pregunta: ¿Qué estación te parece bonita? Omar dice: Me gusta el verano. En verano nadamos. Lotte dice: Me gusta el invierno. En invierno patinamos.'
    note: Repasa la conversación del taalcafé de la lección 4 mediante narración con citas directas, igual que las lecturas de repaso de las unidades de la casa, el barrio, el correo, la cocina, la personalidad y los colores.
