  nl.a1.unit43.lesson03.teach.ik_vind_grammar:
    title: La construcción Ik vind
    gloss: '*Ik vind* + estación + cualidad expresa lo que piensas de una estación: Me gusta el verano.'
    note: 'Se reutiliza la construcción de opinión *Ik vind X Y* ya vista (Ik vind koffie lekker, Ik vind Fenna nieuwsgierig): no hay gramática nueva, solo un uso nuevo. *vind* va sin -t porque el sujeto es *Ik* (1.ª persona); en la pregunta *Welk seizoen vind jij mooi?* tampoco lleva -t porque *jij* va detrás del verbo (inversión). La forma de 3.ª persona *vindt* (como en *Omar vindt ...*) es otro punto gramatical posterior que aún no se ha enseñado.'
