course:
  title: Neerlandés A2
  description: Neerlandés A2 centrado en la gramática para decir para qué haces algo.
  learning_goal: Di para qué haces algo con om ... te, incluidos los verbos separables, y reconoce zodat.
units:
  nl.a2.unit94.om_te_en_zodat:
    title: Para (finalidad)
    description: 'Di para qué haces algo: recados, aprender y ahorrar dinero.'
lessons:
  nl.a2.unit94.lesson01.sparen_om_te:
    title: Ahorrar para comprar
  nl.a2.unit94.lesson02.scheidbare_werkwoorden:
    title: 'Ordenar: verbos separables'
  nl.a2.unit94.lesson03.omdat_en_zodat:
    title: Omdat o zodat
  nl.a2.unit94.lesson04.een_lijstje:
    title: Una lista para hoy
  nl.a2.unit94.lesson05.noors_dag:
    title: El día ajetreado de Noor
  nl.a2.unit94.lesson06.lotte_en_omar:
    title: Lotte y Omar hacen recados
teaching:
  nl.a2.unit94.lesson01.teach.sparen:
    title: Ahorrar y comprar
    gloss: ahorrar / el dinero / comprar / la bicicleta
    note: Estas son las primeras palabras que necesitas para hablar de un objetivo.
    example_gloss:
    - Ahorro dinero.
    - Compro una bicicleta.
  nl.a2.unit94.lesson01.teach.boodschappen:
    title: Recados
    gloss: el banco / la oficina de correos / el supermercado / el pan / la carta / el paquete
    note: Lugares y cosas para los recados de cada día.
    example_gloss:
    - Voy al banco.
    - Voy a la oficina de correos.
    - Compro pan en el supermercado.
  nl.a2.unit94.lesson01.teach.leren:
    title: Aprender
    gloss: aprender / neerlandés / hablar / hacer un curso
    note: '*Een cursus volgen* significa hacer un curso.'
    example_gloss:
    - Aprendo neerlandés.
    - Hago un curso.
    - Hablo con Lotte.
  nl.a2.unit94.lesson01.teach.gn_om_te:
    title: 'Om ... te: para qué haces algo'
    gloss: Ahorro para comprar una bicicleta.
    note: 'Usa *om ... te* + infinitivo para decir la finalidad de una acción. En esta unidad el infinitivo (*kopen*) va al final de la frase, con *te* justo delante: *om een fiets te kopen*. El sujeto es el mismo que en la primera parte (aquí: *ik*).'
  nl.a2.unit94.lesson01.teach.zinnen:
    title: Tres finalidades
    gloss: Voy al supermercado para comprar pan. Voy a la oficina de correos para enviar una carta. Aprendo neerlandés para hablar con Lotte.
    note: '*Sturen* significa enviar.'
  nl.a2.unit94.lesson02.teach.scheidbaar:
    title: Verbos con partícula
    gloss: sacar dinero / recoger un paquete / quedar / ordenar / llamar
    note: 'En una oración principal, la partícula (*op*, *af*) va al final de la oración: *Ik neem geld op.* (*Bellen* no tiene partícula.)'
    example_gloss:
    - Saco dinero.
    - Recojo un paquete.
    - Quedo con Lotte.
    - Ordeno.
    - Llamo a Lotte.
  nl.a2.unit94.lesson02.teach.gn_scheidbaar:
    title: Te va entre la partícula y el verbo
    gloss: sacar; recoger; quedar; ordenar
    note: 'Con un verbo separable, *te* va entre la partícula y el verbo: *op te nemen*, *af te spreken*. Los verbos sin partícula llevan *te* delante: *te kopen*, *te sturen*.'
  nl.a2.unit94.lesson02.teach.zinnen:
    title: Cuatro recados
    gloss: Voy al banco para sacar dinero. Voy a la oficina de correos para recoger un paquete. Llamo a Lotte para quedar. Voy a casa para ordenar.
  nl.a2.unit94.lesson03.teach.vragen:
    title: Por qué y para qué
    gloss: por qué / para qué / porque / para que / necesario
    note: '*Waarom* pregunta por una razón; *waarvoor* pregunta por una finalidad.'
    example_gloss:
    - ¿Por qué ahorras?
    - ¿Para qué ahorras?
    - Necesito dinero.
  nl.a2.unit94.lesson03.teach.gn_omdat:
    title: Omdat da una razón
    gloss: ¿Por qué ahorras? Porque necesito una bicicleta.
    note: '*Omdat* da una razón, no una finalidad. El verbo conjugado va al final de la oración con *omdat*: *omdat ik een fiets nodig heb*. Tiene su propio sujeto y su propio verbo.'
  nl.a2.unit94.lesson03.teach.gn_doel:
    title: Om ... te expresa una finalidad
    gloss: ¿Para qué ahorras? Para comprar una bicicleta.
    note: '*Om ... te* responde a *waarvoor?* e indica el objetivo. No tiene sujeto propio: quien hace la acción es la misma persona que en la parte principal.'
  nl.a2.unit94.lesson03.teach.gn_zodat:
    title: 'Zodat: otra persona'
    gloss: Ayudo a Omar para que termine a tiempo. Lo apunto para que no se te olvide.
    note: '*Zodat* también expresa finalidad, normalmente con un sujeto nuevo (*hij*, *jij*), y el verbo conjugado va al final de su oración. Por ahora basta con reconocerlo; usarás sobre todo *om ... te* cuando tú mismo hagas la acción.'
  nl.a2.unit94.lesson04.teach.lijstje:
    title: Mi lista
    gloss: la lista / hoy / primero / después / la panadería / la tienda de bicicletas
    note: '*Eerst* y *daarna* ordenan tus recados.'
    example_gloss:
    - Mi lista para hoy.
    - Compro pan en la panadería.
    - Compro una bicicleta nueva en la tienda de bicicletas.
  nl.a2.unit94.lesson04.teach.gn_voorop:
    title: Primero, la frase con om
    gloss: Para sacar dinero voy al banco. Para comprar pan voy a la panadería.
    note: 'Puedes empezar con la frase *om ... te*. Entonces el verbo va justo después y antes del sujeto: *Om brood te kopen ga ik ...*, no *Om brood te kopen ik ga ...*.'
  nl.a2.unit94.lesson04.teach.zinnen:
    title: Recados en orden
    gloss: Primero voy al banco para sacar dinero. Después voy a la panadería para comprar pan.
    note: 'Después de *eerst* o *daarna* al principio, el verbo se queda en segunda posición: *ga ik*.'
  nl.a2.unit94.lesson05.teach.reading:
    title: La lista de Noor
    gloss: Noor tiene mucho que hacer. Primero va al banco para sacar dinero. Después va a la oficina de correos para enviar un paquete. Cada mes ahorra dinero para comprar una bicicleta nueva. Lotte la ayuda para que termine a tiempo.
  nl.a2.unit94.lesson06.teach.beurt1:
    title: Lotte pregunta
    gloss: 'Lotte: Hola, Omar, ¿vas a la oficina de correos?'
  nl.a2.unit94.lesson06.teach.beurt2:
    title: Omar explica
    gloss: 'Omar: Sí, voy a la oficina de correos para recoger un paquete.'
  nl.a2.unit94.lesson06.teach.beurt3:
    title: Lotte dice su recado
    gloss: 'Lotte: Voy al banco para sacar dinero.'
  nl.a2.unit94.lesson06.teach.beurt4:
    title: Omar pregunta para qué
    gloss: 'Omar: ¿Para qué necesitas dinero?'
  nl.a2.unit94.lesson06.teach.beurt5:
    title: Lotte dice su objetivo
    gloss: 'Lotte: Ahorro para comprar una bicicleta nueva.'
  nl.a2.unit94.lesson06.teach.beurt6:
    title: Omar se ofrece a esperar
    gloss: 'Omar: ¡Genial! Te espero para que vayamos juntos.'
