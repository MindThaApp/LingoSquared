teaching:
  nl.a2.unit77.lesson01.teach.koptelefoon:
    title: Los auriculares
    gloss: los auriculares
    note: '*De koptelefoon* es un sustantivo de género común (de) y en neerlandés va en singular, mientras que en español "auriculares" suele usarse en plural.'
    example_gloss: Me compré unos auriculares nuevos.
  nl.a2.unit77.lesson01.teach.koptelefoon_kapot:
    title: Decir que los auriculares están rotos
    gloss: Estos auriculares están rotos.
    note: '*Kapot* (roto) describe cualquier objeto que ya no funciona, desde aparatos electrónicos hasta muebles.'
  nl.a2.unit77.lesson01.teach.linkerkant_doet_het_niet:
    title: Describir qué lado no funciona
    gloss: El lado izquierdo no funciona.
    note: '*Doet het niet* (literalmente "lo hace no") es la expresión habitual para decir que un aparato o una pieza no funciona.'
  nl.a2.unit77.lesson02.teach.geld_terug:
    title: La devolución del dinero
    gloss: la devolución del dinero / el reembolso
    note: '*Het geld terug* es una expresión fija que se usa para hablar de un reembolso.'
    example_gloss: Quisiera que me devolvieran el dinero.
  nl.a2.unit77.lesson02.teach.graag_geld_terug:
    title: Pedir un reembolso
    gloss: Quisiera que me devolvieran el dinero.
    note: '*Graag* (con gusto / por favor) suaviza la petición; es la forma educada habitual en neerlandés.'
  nl.a2.unit77.lesson02.teach.ruilen_of_geld:
    title: Preguntar por el cambio o el reembolso
    gloss: ¿Puedo cambiarlo o que me devuelvan el dinero?
    note: '*Ruilen* (cambiar) y *het geld terugkrijgen* (recuperar el dinero) son las dos soluciones habituales ante una reclamación.'
  nl.a2.unit77.lesson03.teach.bonnetje:
    title: El ticket
    gloss: el ticket
    note: '*Het bonnetje* (diminutivo de *de bon*) es la palabra cotidiana para el ticket de compra de una tienda.'
    example_gloss: Todavía tengo el ticket, aquí está.
  nl.a2.unit77.lesson03.teach.heeft_u_bonnetje:
    title: Preguntar al cliente si tiene el ticket
    gloss: ¿Todavía tiene el recibo?
    note: '*Nog* (todavía) sirve para confirmar si el cliente aún conserva el artículo o el ticket.'
  nl.a2.unit77.lesson03.teach.acht_dagen_geleden:
    title: Decir cuándo compraste algo
    gloss: Lo compré hace ocho días.
    note: '*Geleden* (hace) va después del período de tiempo; es la forma habitual de decir cuánto tiempo hace que ocurrió algo.'
  nl.a2.unit77.lesson04.teach.retourbeleid:
    title: La política de devoluciones
    gloss: la política de devoluciones
    note: '*Het retourbeleid* es un compuesto habitual de *retour* (devolución) y *beleid* (política).'
    example_gloss: ¿Cuál es la política de devoluciones de esta tienda?
  nl.a2.unit77.lesson04.teach.dertig_dagen:
    title: Indicar el plazo de devolución
    gloss: Puede devolver un artículo en un plazo de treinta días.
    note: '*Binnen* (dentro de) + un período de tiempo es la construcción habitual para indicar un plazo.'
  nl.a2.unit77.lesson04.teach.dat_regel_ik:
    title: Ofrecerse a gestionar algo
    gloss: Yo me encargo de eso.
    note: '*Dat regel ik* (yo me encargo de eso) es una frase habitual y tranquilizadora que usa el personal para atender a un cliente.'
  nl.a2.unit77.lesson05.teach.beleid:
    title: Leer un aviso de política de devoluciones
    gloss: 'Política de devoluciones: puede devolver un artículo dentro de los treinta días posteriores a la compra. Traiga el ticket. Si el artículo es defectuoso, le devolvemos el dinero o puede cambiarlo por uno nuevo.'
    note: '*Bij een defect artikel* (si el artículo es defectuoso) introduce el caso concreto que cubre esta parte de la política.'
    glosses:
      Retourbeleid: política de devoluciones
      kunt: puede (2.ª persona de kunnen, trato formal)
      artikel: artículo
      binnen: dentro de
      dertig: treinta
      dagen: días
      na: después de
      aankoop: compra
      terugbrengen: devolver
      Neem: traiga / tome (imperativo de nemen)
      bonnetje: ticket
      mee: consigo (parte de neem ... mee = traer)
      Bij: en caso de / si hay
      defect: defectuoso
      krijgt: recibe (de krijgen, recibir)
      uw: su (formal)
      geld: dinero
      terug: de vuelta
      of: o
      ruilen: cambiar
      voor: por / a cambio de
      nieuw: nuevo
      exemplaar: unidad / ejemplar (de un producto)
  nl.a2.unit77.lesson06.teach.verkoper_open:
    title: El empleado inicia la conversación
    gloss: 'Empleado: Buenas tardes, ¿en qué puedo ayudarle?'
  nl.a2.unit77.lesson06.teach.omar_kapot:
    title: Omar explica el problema
    gloss: 'Omar: Buenas tardes, estos auriculares están rotos. El lado izquierdo no funciona.'
  nl.a2.unit77.lesson06.teach.verkoper_bonnetje:
    title: El empleado pide el ticket
    gloss: 'Empleado: Qué fastidio. ¿Todavía tiene el ticket?'
  nl.a2.unit77.lesson06.teach.omar_acht_dagen:
    title: Omar lo confirma e indica la fecha de compra
    gloss: 'Omar: Sí, aquí está. Los compré hace ocho días.'
  nl.a2.unit77.lesson06.teach.verkoper_binnen_dertig:
    title: El empleado confirma que está dentro del plazo
    gloss: 'Empleado: No hay problema, está dentro de los treinta días. ¿Quiere cambiarlos o que le devolvamos el dinero?'
  nl.a2.unit77.lesson06.teach.omar_geld_terug:
    title: Omar elige el reembolso
    gloss: 'Omar: Quisiera que me devolvieran el dinero.'
  nl.a2.unit77.lesson06.teach.verkoper_regel_het:
    title: El empleado confirma que lo gestiona
    gloss: 'Empleado: Perfecto, yo me encargo de eso.'
  nl.a2.unit77.lesson06.teach.grammar_gekocht:
    title: 'Tercera persona: hij/zij con heeft'
    gloss: Él compró los auriculares. Ella recuperó su dinero.
    note: '*Heeft* es la tercera persona del singular de *hebben* (haber/tener); se usa con un participio para el pretérito perfecto. *Hij* (él), *zij* (ella) y *haar* (su, de ella) son los pronombres correspondientes para resumir lo ocurrido.'
