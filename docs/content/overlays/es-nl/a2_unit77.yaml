course:
  title: Neerlandés A2
  description: 'Neerlandés intermedio que continúa la historia de Lotte y Omar: trámites cotidianos, opiniones, banco, salud, mantenimiento del hogar, entrevistas de trabajo, imprevistos en los viajes, tecnología, horarios semanales y, ahora, la devolución de una compra defectuosa.'
