teaching:
  nl.a1.unit02.lesson01.teach.zero_to_four:
    title: Del cero al cuatro
    gloss: 0 — cero, 1 — uno, 2 — dos, 3 — tres, 4 — cuatro
    note: En neerlandés, nul es cero, también como primer dígito de un número de teléfono. Los acentos de één distinguen el número del artículo een por escrito; en textos corrientes a veces se omiten cuando el sentido es claro.
    example_gloss:
    - Tengo cero euros.
    - Tengo un libro.
    - Tengo dos sillas.
    - Tengo tres libros.
    - Hay cuatro personas.
  nl.a1.unit02.lesson01.teach.five_to_eight:
    title: Del cinco al ocho
    gloss: 5 — cinco, 6 — seis, 7 — siete, 8 — ocho
    note: Vijf, zes, zeven y acht siguen el mismo patrón sencillo que del cero al cuatro.
    example_gloss:
    - Tengo cinco euros.
    - Tengo seis libros.
    - Tengo siete sillas.
    - Hay ocho personas.
  nl.a1.unit02.lesson01.teach.nine_to_twelve:
    title: Del nueve al doce
    gloss: 9 — nueve, 10 — diez, 11 — once, 12 — doce
    note: Negen, tien, elf y twaalf completan los números hasta el doce.
    example_gloss:
    - Tengo nueve euros.
    - Tengo diez sillas.
    - Tengo once libros.
    - Hay doce personas.
  nl.a1.unit02.lesson01.teach.how_many:
    title: Preguntar cuántos
    gloss: ¿Cuántos?
    note: Hoeveel sirve para preguntar por un número o una cantidad.
  nl.a1.unit02.lesson02.teach.teens:
    title: Del trece al diecinueve
    gloss: '13–19: trece, catorce, quince, dieciséis, diecisiete, dieciocho, diecinueve'
    note: Las formas neerlandesas del trece al diecinueve terminan en -tien.
    example_gloss:
    - Tengo trece años.
    - Tengo catorce euros.
    - Tengo quince años.
    - Tengo dieciséis libros.
    - Hay diecisiete personas.
    - Tengo dieciocho años.
    - Tengo diecinueve sillas.
  nl.a1.unit02.lesson02.teach.tens:
    title: Las decenas
    gloss: '20–90: veinte, treinta, cuarenta, cincuenta, sesenta, setenta, ochenta, noventa'
    note: Aprende estas decenas como base para formar números más grandes de dos cifras.
    example_gloss:
    - Tengo veinte años.
    - Eso cuesta treinta euros.
    - Tengo cuarenta euros.
    - Hay cincuenta personas.
    - Tengo sesenta años.
    - Eso cuesta setenta euros.
    - Hay ochenta personas.
    - Tengo noventa euros.
  nl.a1.unit02.lesson02.teach.inversion_rule:
    title: Primero las unidades, luego las decenas
    gloss: '21–99, salvo 30, 40 y demás decenas exactas: unidad + en + decena'
    note: 'En neerlandés se dice normalmente primero la unidad: 42 es literalmente «dos y cuarenta». Las decenas exactas usan solo la palabra de la decena.'
  nl.a1.unit02.lesson02.teach.twenty_one:
    title: Veintiuno
    gloss: 21 — veintiuno
    note: Eenentwintig une een + en + twintig en una sola palabra escrita.
    example_gloss: El café de idiomas es en la sala veintiuno.
  nl.a1.unit02.lesson02.teach.twenty_two:
    title: Veintidós
    gloss: 22 — veintidós
    note: Los dos puntos sobre la ë de tweeëntwintig indican que las vocales contiguas pertenecen a sílabas distintas.
    example_gloss: Tengo veintidós años.
  nl.a1.unit02.lesson02.teach.thirty_two:
    title: Treinta y dos
    gloss: 32 — treinta y dos
    note: Tweeëndertig se escribe en una sola palabra, con diéresis en la ë de unión.
    example_gloss: Omar tiene treinta y dos años.
  nl.a1.unit02.lesson02.teach.forty_two:
    title: Cuarenta y dos
    gloss: 42 es cuarenta y dos.
    note: 'Primero se dice la unidad y después la decena: twee-en-veertig, que se escribe junto: tweeënveertig.'
  nl.a1.unit02.lesson02.teach.forty_eight:
    title: Cuarenta y ocho
    gloss: 48 — cuarenta y ocho
    note: Achtenveertig es acht + en + veertig, escrito en una sola palabra.
    example_gloss: Vivo en el número cuarenta y ocho.
  nl.a1.unit02.lesson02.teach.seventy_five:
    title: Setenta y cinco
    gloss: 75 — setenta y cinco
    note: En vijfenzeventig, vijf va antes que zeventig.
    example_gloss: Eso cuesta setenta y cinco céntimos.
  nl.a1.unit02.lesson02.teach.ninety_nine:
    title: Noventa y nueve
    gloss: 99 — noventa y nueve
    note: Negenennegentig es una sola palabra compuesta.
    example_gloss: Tengo noventa y nueve años.
  nl.a1.unit02.lesson03.teach.ask_phone:
    title: Pedir un número de teléfono
    gloss: ¿Cuál es tu número de teléfono?
    note: Je mantiene la pregunta en registro informal, como corresponde al ambiente del café de idiomas de Lotte y Omar.
  nl.a1.unit02.lesson03.teach.phone_number:
    title: Di un número de móvil neerlandés
    gloss: Mi número de teléfono es 06 21 43 65 87.
    note: Los móviles neerlandeses empiezan por 06 y suelen escribirse como 06 seguido de ocho dígitos.
  nl.a1.unit02.lesson03.teach.phone_spoken:
    title: Di el número de teléfono por grupos
    gloss: cero seis, veintiuno, cuarenta y tres, sesenta y cinco, ochenta y siete
    note: Cada persona agrupa los dígitos del teléfono a su manera. Este curso usa el 06 seguido de grupos de dos cifras; decir los dígitos uno a uno también es normal cuando hace falta ser claro.
  nl.a1.unit02.lesson03.teach.ask_house_number:
    title: Pregunta por el número de casa
    gloss: ¿Cuál es tu número de casa?
    note: Huisnummer es el número que acompaña a la calle en una dirección.
  nl.a1.unit02.lesson03.teach.house_number:
    title: Di tu número de casa
    gloss: Mi número de casa es el 48.
    note: En una dirección escrita o en un formulario es natural usar cifras.
  nl.a1.unit02.lesson03.teach.live_number:
    title: Di dónde vives con el número
    gloss: Vivo en el número cuarenta y ocho.
    note: Op nummer ... es una forma natural de decir el número de tu casa cuando ya se conoce la calle.
  nl.a1.unit02.lesson03.teach.repeat:
    title: Pedir que repitan
    gloss: ¿Puedes repetirlo?
    note: Es útil cuando un número de teléfono se dice demasiado rápido para entenderlo.
  nl.a1.unit02.lesson04.teach.ask_age:
    title: Pregunta la edad de forma informal
    gloss: ¿Qué edad tienes?
    note: Aquí se usa je, el tratamiento informal; la pregunta por la edad solo es apropiada cuando el contexto la hace pertinente.
  nl.a1.unit02.lesson04.teach.age_twenty_eight:
    title: Di una edad
    gloss: Tengo veintiocho años.
    note: En neerlandés se dice Ik ben ... jaar, con el verbo zijn ("ser/estar"), no con "tener" como en español.
  nl.a1.unit02.lesson04.teach.age_thirty_two:
    title: Di la edad de Omar
    gloss: Omar tiene treinta y dos años.
    note: Al decir la edad, jaar no lleva terminación de plural después del número.
  nl.a1.unit02.lesson04.teach.how_many_people:
    title: Pregunta por un número de personas
    gloss: ¿Cuántas personas hay?
    note: Hoeveel va directamente delante del sustantivo mensen.
  nl.a1.unit02.lesson04.teach.twelve_people:
    title: Di un número de personas
    gloss: Hay doce personas.
    note: Er zijn es la construcción normal en plural para decir "hay".
  nl.a1.unit02.lesson04.teach.three_books:
    title: Cuenta libros
    gloss: Tengo tres libros.
    note: Después de un número mayor que uno, boek toma el plural boeken.
  nl.a1.unit02.lesson04.teach.seven_chairs:
    title: Cuenta sillas
    gloss: siete sillas
    note: Stoelen es el plural de stoel.
  nl.a1.unit02.lesson05.teach.euro:
    title: Euro
    gloss: el euro
    note: 'Euro normalmente permanece en singular después de una cantidad: twee euro, no twee euro''s.'
    example_gloss: Eso cuesta dos euros.
  nl.a1.unit02.lesson05.teach.cent:
    title: Cent
    gloss: el céntimo
    note: Cent también suele permanecer en singular después de un número en un precio.
    example_gloss: Son cincuenta céntimos.
  nl.a1.unit02.lesson05.teach.ask_price:
    title: Pregunta un precio
    gloss: ¿Cuánto cuesta esto?
    note: Hoeveel pregunta por la cantidad y kost significa "cuesta".
  nl.a1.unit02.lesson05.teach.two_fifty:
    title: Dos euros con cincuenta
    gloss: 2,50 € — dos euros con cincuenta
    note: En neerlandés los decimales se escriben con coma. Al decirlo, €2,50 suele ser twee euro vijftig, sin en.
  nl.a1.unit02.lesson05.teach.seventy_five_cents:
    title: Setenta y cinco céntimos
    gloss: 0,75 € — setenta y cinco céntimos
    note: Cuando la cantidad es inferior a un euro, es natural decir solo los céntimos.
  nl.a1.unit02.lesson05.teach.twelve_euros:
    title: Doce euros
    gloss: 12 € — doce euros
    note: Un precio en euros enteros no necesita expresar los céntimos.
  nl.a1.unit02.lesson05.teach.four_fifty:
    title: Cuatro euros con cincuenta
    gloss: 4,50 € — cuatro euros con cincuenta
    note: El mismo patrón oral sirve para otros precios con euros y céntimos.
  nl.a1.unit02.lesson05.teach.costs:
    title: Di un precio
    gloss: Eso cuesta dos euros con cincuenta.
    note: Dat kost ... responde directamente a Hoeveel kost dit?
  nl.a1.unit02.lesson06.teach.opening:
    title: Omar se inscribe
    gloss: 'Empleada: Buenas tardes. ¿Vienes por el café de idiomas? Omar: Sí, quiero inscribirme.'
    note: La escena continúa las visitas de Omar al café de idiomas de la biblioteca de la unidad 1.
  nl.a1.unit02.lesson06.teach.phone_turn:
    title: Dar el número de teléfono
    gloss: 'Empleada: Muy bien. ¿Cuál es tu número de teléfono? Omar: 06 21 43 65 87.'
    note: Omar dice el número en los grupos de dos cifras que se practicaron antes.
  nl.a1.unit02.lesson06.teach.house_turn:
    title: Di el número de casa
    gloss: 'Empleada: ¿Y cuál es tu número de casa? Omar: Cuarenta y ocho.'
    note: Una respuesta corta, solo con el número, es natural cuando la pregunta ya da el contexto.
  nl.a1.unit02.lesson06.teach.fee_turn:
    title: Entiende la cuota
    gloss: 'Empleada: La cuota es de dos euros con cincuenta. Omar: De acuerdo.'
    note: El precio hablado sigue el patrón cotidiano de euros más céntimos.
  nl.a1.unit02.lesson06.teach.group_turn:
    title: Pregunta por el tamaño del grupo
    gloss: 'Omar: ¿Cuántas personas hay en el grupo? Empleada: Doce.'
    note: Esta escena retoma el patrón de pregunta Hoeveel mensen ... que se vio antes en la unidad.
  nl.a1.unit02.lesson06.teach.room_turn:
    title: Encuentra el número de sala
    gloss: 'Empleada: El café de idiomas es en la sala veintiuno.'
    note: Zaal es una sala o un salón que se usa para una actividad.
  nl.a1.unit02.lesson06.teach.lotte_turn:
    title: Encuentra la mesa de Lotte
    gloss: 'Lotte: ¡Hola, Omar! Estamos sentados en la mesa siete.'
    note: El diálogo termina reuniendo de nuevo a Omar con Lotte en el mismo ambiente informal.
