teaching:
  nl.a2.unit74.lesson01.teach.vertraging:
    title: El retraso
    gloss: el retraso
    note: '*De vertraging* es un sustantivo de género común (de).'
    example_gloss: Hay un retraso de diez minutos.
  nl.a2.unit74.lesson01.teach.trein_vertraging:
    title: Avisar de que tu tren lleva retraso
    gloss: Mi tren lleva retraso.
    note: '*Vertraging hebben* (literalmente «tener retraso») es la forma habitual de decir que un tren o un autobús va con retraso.'
  nl.a2.unit74.lesson01.teach.reden_vertraging:
    title: Preguntar el motivo de un retraso
    gloss: ¿Cuál es el motivo del retraso?
    note: '*De reden* (el motivo) es un sustantivo de género común (de).'
  nl.a2.unit74.lesson02.teach.seinstoring:
    title: La avería en la señalización
    gloss: la avería en la señalización
    note: '*De seinstoring* es el término estándar de NS para un fallo técnico en el sistema de señalización ferroviaria.'
    example_gloss: Mi tren está cancelado por una avería en la señalización.
  nl.a2.unit74.lesson02.teach.trein_valt_uit:
    title: Avisar de que tu tren está cancelado
    gloss: Mi tren está cancelado por una avería en la señalización.
    note: '*Uitvallen* (cancelarse, fallar) es un verbo separable: *uit* pasa al final de la oración.'
  nl.a2.unit74.lesson02.teach.volgende_trein:
    title: Preguntar cuándo sale el próximo tren
    gloss: ¿Cuándo sale el próximo tren?
    note: '*Rijden* (conducir, circular) se usa para trenes y autobuses que circulan según el horario, no solo para conducir un coche.'
  nl.a2.unit74.lesson03.teach.aansluiting:
    title: El transbordo
    gloss: el enlace
    note: '*De aansluiting* es un sustantivo de género común (de), que se usa para un tren o autobús de enlace.'
    example_gloss: Pierdo mi enlace en Utrecht.
  nl.a2.unit74.lesson03.teach.aansluiting_missen:
    title: Avisar de que pierdes un enlace
    gloss: Pierdo mi enlace por el retraso.
    note: 'En neerlandés, *missen* (perder, no alcanzar) lleva complemento directo, igual que en español: Ik mis mijn aansluiting = pierdo mi enlace.'
  nl.a2.unit74.lesson03.teach.andere_trein:
    title: Preguntar si puedes tomar otro tren
    gloss: ¿Puedo tomar otro tren?
    note: En *een andere trein* (otro tren) se usa *andere*, la forma normal del adjetivo delante de una palabra *de*.
  nl.a2.unit74.lesson04.teach.servicebalie:
    title: El punto de atención al cliente
    gloss: el punto de atención al viajero
    note: '*De servicebalie* es un sustantivo de género común (de), la palabra habitual para el mostrador de ayuda de una estación.'
    example_gloss: Voy al punto de atención al cliente para pedir ayuda.
  nl.a2.unit74.lesson04.teach.help_alternatief:
    title: Pedir ayuda con una alternativa
    gloss: ¿Puede ayudarme con una conexión alternativa?
    note: '*Kunt u* es la forma formal y cortés de *kunnen* (poder), que se usa con *u*.'
  nl.a2.unit74.lesson04.teach.via_amsterdam:
    title: Que te indiquen una ruta alternativa
    gloss: Puede viajar en el intercity vía Amersfoort.
    note: '*Via* (vía, por) introduce la parada intermedia de una ruta alternativa.'
  nl.a2.unit74.lesson05.teach.mededeling:
    title: Leer un aviso de incidencia
    gloss: 'Aviso importante: debido a una avería de señales, no circulan trenes entre Utrecht y Arnhem. Los viajeros pueden desviarse por Amersfoort. Se espera que el retraso dure hasta las tres de la tarde aproximadamente. Aconsejamos a los viajeros consultar el planificador de viajes.'
    note: '*Vijftien uur* es la forma en reloj de 24 horas de las tres de la tarde, habitual en los avisos públicos neerlandeses; en español también se usa (las 15:00), sobre todo en horarios.'
    glosses:
      Belangrijke: importante (forma flexionada de belangrijk)
      mededeling: aviso, comunicado
      door: debido a, por
      seinstoring: avería de señales
      rijden: circular (los trenes); conducir
      tussen: entre
      geen: ningún, no… ningún
      treinen: trenes (plural de trein)
      Reizigers: viajeros, pasajeros
      kunnen: pueden, son capaces de
      omreizen: desviarse, viajar dando un rodeo
      via: vía, por
      vertraging: retraso
      duurt: dura (de duren)
      tot: hasta
      ongeveer: aproximadamente, más o menos
      vijftien: quince
      uur: hora (en la hora del reloj)
      Wij: nosotros
      adviseren: aconsejamos
      reizigers: viajeros, pasajeros
      reisplanner: planificador de viajes
      raadplegen: consultar
  nl.a2.unit74.lesson06.teach.medewerker_open:
    title: El empleado abre la conversación
    gloss: 'Empleado: NS, buenas tardes. ¿En qué puedo ayudarle?'
  nl.a2.unit74.lesson06.teach.lotte_uitgevallen:
    title: Lotte avisa de la cancelación
    gloss: 'Lotte: Buenas tardes, mi tren a Arnhem está cancelado. Quisiera saber cómo puedo llegar ahora.'
  nl.a2.unit74.lesson06.teach.medewerker_seinstoring:
    title: El empleado explica la causa
    gloss: 'Empleado: Efectivamente, hay una avería de señales. Puede desviarse por Amersfoort.'
  nl.a2.unit74.lesson06.teach.lotte_ask_time:
    title: Lotte pregunta la hora de salida
    gloss: 'Lotte: ¿A qué hora sale ese tren?'
  nl.a2.unit74.lesson06.teach.medewerker_platform:
    title: El empleado indica el andén y la hora
    gloss: 'Empleado: Dentro de diez minutos, del andén cuatro.'
  nl.a2.unit74.lesson06.teach.lotte_bericht_sturen:
    title: Lotte decide enviar un mensaje
    gloss: 'Lotte: Muchas gracias. Voy a enviar un mensaje para avisar de que llegaré más tarde.'
  nl.a2.unit74.lesson06.teach.grammar_uitgevallen:
    title: Pretérito perfecto de uitvallen, y haar/zij
    gloss: Su tren está cancelado. Ella puede desviarse.
    note: '*Is uitgevallen* es el pretérito perfecto de *uitvallen* (cancelarse), formado con *zijn* porque expresa un cambio de estado. *Haar* (su, posesivo) y *zij* (ella, sujeto) son las formas de tercera persona femenina que se usan al resumir lo que le ocurrió a Lotte.'
