course:
  title: Neerlandés A2
  description: 'Neerlandés intermedio que continúa la historia de Lotte y Omar: trámites cotidianos, opiniones, banco, salud, mantenimiento del hogar, entrevistas de trabajo y, ahora, incidencias en los viajes.'
