teaching:
  ro.a1.unit06.lesson01.teach.reminder_un_o_si:
    title: 'दोहराव: un, o, și'
    gloss: un/o (एक) · și (और)
    note: ये तीनों शब्द पहले की इकाइयों में आ चुके हैं (*și* इकाई 1 में, *o* इकाई 2 में, *un* इकाई 4 में) — यहाँ ये खाने-पीने की बातचीत में फिर आते हैं।
  ro.a1.unit06.lesson01.teach.as_dori:
    title: मुझे ... चाहिए
    gloss: Aș dori ... (मैं ... लेना चाहूँगा)
    note: रोमानियाई में कुछ ऑर्डर करने का रोज़मर्रा का शिष्ट तरीका — यह एक स्थिर क्रियारूप है, जो आगे आने वाले शब्द के साथ नहीं बदलता।
  ro.a1.unit06.lesson01.teach.apa:
    title: पानी
    gloss: apă (पानी)
    note: स्त्रीलिंग संज्ञा — मात्रा न बताई जाए तो इसके साथ कोई उपपद नहीं आता, जैसे हिंदी में "पानी" के साथ "एक" नहीं लगाते।
    example_gloss: मैं पानी लेना चाहूँगा।
  ro.a1.unit06.lesson01.teach.cafea:
    title: कॉफ़ी
    gloss: cafea (कॉफ़ी)
    note: स्त्रीलिंग — यह किसी भी अन्य स्त्रीलिंग संज्ञा की तरह *o* ('एक') के साथ आता है।
    example_gloss: मैं एक कॉफ़ी लेना चाहूँगा।
  ro.a1.unit06.lesson01.teach.ceai:
    title: चाय
    gloss: ceai (चाय)
    note: यह *un* ('एक') के साथ आता है, *o* के साथ नहीं — ceai पुल्लिंग/नपुंसक संज्ञा है।
    example_gloss: मैं एक चाय लेना चाहूँगा।
  ro.a1.unit06.lesson01.teach.suc:
    title: जूस
    gloss: suc (जूस)
    note: यह भी *un* के साथ आता है, ceai जैसा ही नियम।
    example_gloss: मैं एक जूस लेना चाहूँगा।
  ro.a1.unit06.lesson01.teach.lapte:
    title: दूध
    gloss: lapte (दूध)
    note: apă की तरह, मात्रा न बताई जाए तो आमतौर पर बिना उपपद के बोला जाता है।
    example_gloss: मैं दूध लेना चाहूँगा।
  ro.a1.unit06.lesson01.teach.mi_e_sete:
    title: मुझे प्यास लगी है
    gloss: Mi-e sete (मुझे प्यास लगी है)
    note: एक स्थिर मुहावरा — शाब्दिक रूप से यह "मुझे प्यास है" के बजाय "मेरे लिए प्यास है" जैसा है।
  ro.a1.unit06.lesson01.teach.as_dori_o_cafea:
    title: मुझे एक कॉफ़ी चाहिए
    gloss: मुझे एक कॉफ़ी चाहिए।
    note: ऑर्डर वाक्यांश और एक स्त्रीलिंग पेय संज्ञा को एक पूरे वाक्य में जोड़ता है।
  ro.a1.unit06.lesson02.teach.reminder_multumesc_bine_da_nu:
    title: 'दोहराव: mulțumesc, bine, da, nu'
    gloss: mulțumesc (धन्यवाद) · bine (अच्छा/ठीक) · da (हाँ) · nu (नहीं)
    note: '*Mulțumesc* और *bine* पहली बार इकाई 1 के अभिवादनों में आए थे, *da* और *nu* इकाई 3/इकाई 5 में — यहाँ ये खाने और शिष्टता के संदर्भ में फिर आते हैं।'
  ro.a1.unit06.lesson02.teach.mi_e_foame:
    title: मुझे भूख लगी है
    gloss: Mi-e foame (मुझे भूख लगी है)
    note: '*Mi-e sete* जैसा ही स्थिर मुहावरा, बस sete (प्यास) की जगह foame (भूख) है।'
  ro.a1.unit06.lesson02.teach.paine:
    title: रोटी
    gloss: pâine (ब्रेड)
    note: आमतौर पर बिना उपपद के बोला जाता है, जैसे हिंदी में "ब्रेड" के साथ "एक" नहीं लगाते।
    example_gloss: मुझे भूख लगी है। मैं ब्रेड लेना चाहूँगा।
  ro.a1.unit06.lesson02.teach.mancare:
    title: खाना
    gloss: mâncare (खाना)
    note: '"खाना" के लिए सामान्य शब्द, कोई खास व्यंजन नहीं।'
    example_gloss: मैं खाना लेना चाहूँगा।
  ro.a1.unit06.lesson02.teach.carne:
    title: मांस
    gloss: carne (मांस)
    note: '"मांस" के लिए सामान्य शब्द — खास किस्में (carne de vită, carne de porc) इसके बाद प्रकार जोड़कर बनती हैं।'
    example_gloss: मैं मांस लेना चाहूँगा।
  ro.a1.unit06.lesson02.teach.pui:
    title: चिकन
    gloss: pui (चिकन)
    note: (खाने के रूप में) चिकन के लिए खास शब्द, जो सामान्य शब्द carne से अलग है।
    example_gloss: मैं चिकन लेना चाहूँगा।
  ro.a1.unit06.lesson02.teach.fructe:
    title: फल
    gloss: fructe (फल)
    note: रोज़मर्रा का बहुवचन रूप, जिसे सामान्य श्रेणी "फल" के अर्थ में वैसे ही इस्तेमाल किया जाता है जैसे हिंदी में "फल" कहा जाता है।
    example_gloss: मैं फल लेना चाहूँगा।
  ro.a1.unit06.lesson02.teach.va_rog:
    title: कृपया (औपचारिक)
    gloss: vă rog (कृपया, औपचारिक)
    note: '"कृपया" कहने का शिष्ट तरीका — यह इकाई 1 और इकाई 2 में आए dumneavoastră वाले औपचारिक रूप के साथ चलता है।'
    example_gloss: एक कॉफ़ी, कृपया।
  ro.a1.unit06.lesson02.teach.te_rog:
    title: कृपया (अनौपचारिक)
    gloss: te rog (कृपया, अनौपचारिक)
    note: दोस्तों और उन लोगों के साथ इस्तेमाल होने वाला रोज़मर्रा का रूप जिन्हें आप *tu* कहकर संबोधित करते हैं — यह इकाई 1 के tu वाले रूप के साथ चलता है।
    example_gloss: एक चाय, कृपया।
  ro.a1.unit06.lesson03.teach.reminder_buna_ziua_bine_la_revedere:
    title: 'दोहराव: bună, ziua, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (नमस्कार) · bine (अच्छा) · la revedere (अलविदा) · Ana, Mihai (नाम)
    note: ये सब इकाई 1 और इकाई 5 के संवादों में आ चुके हैं — यहाँ अना और मिहाई फिर मिलते हैं, इस बार एक कैफ़े में।
  ro.a1.unit06.lesson03.teach.line01:
    title: अभिवादन करें और बताएँ कि भूख लगी है
    gloss: अना मिहाई को नमस्कार करती है और कहती है कि उसे भूख लगी है।
    note: अभिवादन में ही इस इकाई का *Mi-e foame* इस्तेमाल हुआ है।
  ro.a1.unit06.lesson03.teach.line02:
    title: खाना ऑर्डर करें
    gloss: मिहाई कहता है कि वह ब्रेड और चिकन लेना चाहेगा।
    note: Aș dori वाक्यांश के साथ इसी इकाई के pâine/pui शब्द फिर इस्तेमाल हुए हैं।
  ro.a1.unit06.lesson03.teach.line03:
    title: शिष्टता से पेय ऑर्डर करें
    gloss: अना कहती है कि वह एक कॉफ़ी लेना चाहेगी, कृपया।
    note: Aș dori, cafea और vă rog को जोड़ता है — तीनों इसी इकाई में अलग-अलग सिखाए गए थे।
  ro.a1.unit06.lesson03.teach.line04:
    title: एक पेय भी ऑर्डर करें
    gloss: मिहाई कहता है कि वह एक चाय लेना चाहेगा, कृपया।
    note: अना की पंक्ति जैसा ही ढाँचा, बस cafea की जगह ceai है।
  ro.a1.unit06.lesson03.teach.line05:
    title: धन्यवाद कहें और बातचीत समाप्त करें
    gloss: अना मिहाई को धन्यवाद देती है और अलविदा कहती है।
    note: यहाँ *Mulțumesc* सीधा-सादा समापन का धन्यवाद है, वही शब्द जो इकाई 1 के *Bine, mulțumesc.* में था।
  ro.a1.unit06.lesson03.teach.line06:
    title: मुलाक़ात का समापन करें
    gloss: मिहाई भी अलविदा कहता है, और अना का नाम लेता है।
    note: वही मित्रतापूर्ण समापन ढंग, जिस पर इकाई 1 और इकाई 5 के संवाद भी समाप्त हुए थे।
