    example_gloss: मुझे तुम्हें फ़ोन करना है।
  ro.a1.unit28.lesson01.teach.te_sun:
    title: फ़ोन करने की बात कहना
    gloss: मैं तुम्हें फ़ोन करूँगा।
    note: '*Sun* क्रिया *a suna* (फ़ोन करना) का *eu* रूप है; *te* ("तुम्हें") क्रिया से पहले आता है, और रोमानियाई में "फ़ोन करूँगा" का भाव यहाँ वर्तमान काल से ही व्यक्त होता है।'
  ro.a1.unit28.lesson01.teach.alo_sunt_ana:
    title: फ़ोन उठाना
    gloss: हैलो, मैं Ana बोल रही हूँ।
    note: '*Alo* फ़ोन उठाते समय कहा जाता है; *sunt* + नाम बताता है कि आप कौन हैं, जैसे हिंदी में "मैं ... बोल रहा हूँ"।'
  ro.a1.unit28.lesson01.teach.alo_sunt_mihai:
    title: Mihai भी उसी तरह जवाब देता है
    gloss: हैलो, मैं Mihai बोल रहा हूँ।
    note: वही *Alo, sunt* + नाम वाला ढाँचा, जैसा *Alo, sunt Ana* में है।
  ro.a1.unit28.lesson02.teach.cu_cine_vorbesc:
    title: पूछना कि फ़ोन किसका है
    gloss: मैं किससे बात कर रहा हूँ?
    note: '*Cu cine vorbesc?* (शाब्दिक अर्थ "मैं किससे बात कर रहा हूँ?") अनजान फ़ोन करने वाले से पूछने का मानक तरीका है।'
  ro.a1.unit28.lesson02.teach.vorbiti_cu_ana:
    title: औपचारिक ढंग से अपना परिचय देना
    gloss: आप Ana से बात कर रहे हैं।
    note: '*Vorbiți cu* + नाम औपचारिक उत्तर है: *vorbiți* क्रिया *a vorbi* (बोलना) का *dumneavoastră* रूप है।'
  ro.a1.unit28.lesson03.teach.poti_sa_repeti:
    title: बात दोहराने को कहना
    gloss: क्या तुम इसे दोहरा सकते हो?
    note: '*Poți să* ... (क्या तुम ... सकते हो?) + *repeți* (तुम दोहराओ) + *asta* (यह)।'
  ro.a1.unit28.lesson03.teach.nu_vorbi_atat:
    title: किसी से धीरे बोलने को कहना
    gloss: कृपया इतनी तेज़ मत बोलो।
    note: '*Nu vorbi* ("मत बोलो") यानी *nu* + *tu* रूप; *atât de repede* का अर्थ है "इतनी तेज़"।'
  ro.a1.unit28.lesson03.teach.nu_te_aud:
    title: कहना कि आवाज़ ठीक से नहीं आ रही
    gloss: मुझे तुम्हारी आवाज़ ठीक से नहीं आ रही।
    note: '*Nu te aud bine*: *aud* यानी "मैं सुनता हूँ", *te* ("तुम्हें") क्रिया से पहले आता है, और *bine* का अर्थ है "अच्छे से"।'
  ro.a1.unit28.lesson04.teach.mesajul:
    title: टेक्स्ट मैसेज
    gloss: टेक्स्ट मैसेज
    note: '*Mesaj* एकवचन में पुल्लिंग और बहुवचन में स्त्रीलिंग है (*un mesaj*, *două mesaje*); निश्चित आर्टिकल शब्द के अंत में जुड़ता है: *mesajul*।'
    example_gloss: टेक्स्ट संदेश Ana की ओर से है।
  ro.a1.unit28.lesson04.teach.iti_trimit_un:
    title: टेक्स्ट भेजने की बात कहना
    gloss: मैं तुम्हें मैसेज भेज दूँगा।
    note: '*Îți* ("तुम्हें") संप्रदान कारक का सर्वनाम है जो क्रिया से पहले आता है: *Îți trimit un mesaj*।'
  ro.a1.unit28.lesson04.teach.te_sun_inapoi:
    title: वापस कॉल करने की बात कहना
    gloss: मैं तुम्हें बाद में वापस कॉल करूँगा।
    note: '*Înapoi* ("वापस") क्रिया के बाद आता है: *te sun înapoi* यानी "मैं तुम्हें वापस फ़ोन करूँगा", और *mai târziu* का अर्थ है "बाद में"।'
  ro.a1.unit28.lesson05.teach.mihai_salut_ana:
    title: टेक्स्ट बातचीत पढ़ें
    gloss: 'Mihai: हाय Ana, क्या तुम मुझे फ़ोन कर सकती हो? मुझे तुम्हें कुछ बताना है। Ana: हाँ, ज़रूर, मैं पाँच मिनट में वापस फ़ोन करती हूँ।'
    note: ध्यान दीजिए कि Mihai क्या माँगता है, क्यों माँगता है, और Ana कब वापस फ़ोन करने को कहती है।
    glosses:
      Salut: हाय
      poți: सकते हो
      suna: कॉल करना
      Trebuie: करना होगा
      ceva: कुछ
      spun: बताना
      sigur: ज़रूर
      sun: कॉल करना
      cinci: पाँच
      minute: मिनट
      înapoi: वापस
  ro.a1.unit28.lesson06.teach.mihai_alo_sunt:
    title: Mihai फ़ोन उठाता है
    gloss: 'Mihai: हैलो, मैं Mihai बोल रहा हूँ।'
    note: 'पहले पाठ का वही *Alo, sunt* + नाम वाला ढाँचा, अब असली कॉल में: जो फ़ोन उठाता है, वह पहले बोलता है और अपना नाम बताता है।'
  ro.a1.unit28.lesson06.teach.ana_salut_mihai:
    title: Ana अपना परिचय देती है
    gloss: 'Ana: हाय Mihai, मैं Ana हूँ। Mihai: कितना अच्छा हुआ कि तुमने फ़ोन किया!'
    note: '*Ce bine că* ... ("कितना अच्छा है कि ...") किसी घटना पर सकारात्मक प्रतिक्रिया जताता है; *suni* क्रिया *a suna* का *tu* रूप है।'
  ro.a1.unit28.lesson06.teach.ana_cum_a:
    title: Ana शिफ़्ट के बारे में पूछती है
    gloss: 'Ana: तुम्हारी पहली शिफ़्ट कैसी रही?'
    note: '*A fost* का अर्थ है "था/रही" (*a fi* का भूतकाल)। यह *perfect compus* है, जो *am mâncat* की तरह बनता है; अगली पंक्ति के बाद वाला नोट देखिए।'
  ro.a1.unit28.lesson06.teach.mihai_a_mers:
    title: Mihai अच्छी खबर देता है
    gloss: 'Mihai: बहुत अच्छी रही, जितना मैंने सोचा था उससे भी बेहतर।'
    note: '*A mers* क्रिया *a merge* (जाना, यहाँ "चलना/बीतना") का भूतकाल है; *credeam* का अर्थ है "मैं सोचता था" (*a crede* का एक भूतकालिक रूप)।'
  ro.a1.unit28.lesson06.teach.a_fost_a:
    title: 'भूतकाल के रूप: a fost, a mers, credeam'
    gloss: था → होना, चला → चलना, सोचता था → सोचना
    note: '*A fost* और *a mers* *perfect compus* रूप हैं (*a* + कृदंत) और *credeam* *imperfect* है। अभी इन्हें इसी पाठ के संदर्भों में तय वाक्यांशों की तरह याद कर लीजिए; भूतकाल के पूरे नियम बाद के स्तर पर आएँगे।'
  ro.a1.unit28.lesson06.teach.ana_ma_bucur:
    title: Ana को गर्व है
    gloss: 'Ana: यह सुनकर बहुत खुशी हुई! मुझे तुम पर गर्व है।'
    note: '*Mândră de* ("... पर गर्वित") एक तय संयोजन है; *de* ज़रूरी है। पुरुष *mândru* कहता है।'
  ro.a1.unit28.lesson06.teach.mihai_iti_multumesc:
    title: Mihai भावुक हो जाता है
    gloss: 'Mihai: शुक्रिया, मेरे लिए इसका बहुत मतलब है।'
    note: '*Înseamnă* क्रिया *a însemna* (मतलब होना) का वह/यह वाला रूप है; *pentru mine* ("मेरे लिए") बताता है कि यह किसके लिए मायने रखता है।'
  ro.a1.unit28.lesson06.teach.prima_lui_tura:
    title: उसका
    gloss: उसकी पहली शिफ़्ट बहुत अच्छी रही।
    note: 'संज्ञा के बाद *lui* का अर्थ "उसका" है: *prima lui tură*। (स्त्री के लिए "उसकी" का रूप *ei* है।)'
