teaching:
  ro.a1.unit17.lesson01.teach.reminder_este_la_mihai:
    title: 'दोहराव: este, la, Mihai'
    gloss: este (है) · la (पर, में) · Mihai (नाम)
    note: Este इकाई 3, इकाई 4 और इकाई 8 से है; la इकाई 4 के *la ora nouă* (नौ बजे) से है; Mihai पात्र का नाम है, जो इकाई 1 से आ रहा है -- इस इकाई में तीनों का उपयोग उसके पेशे की बात करने के लिए होता है।
  ro.a1.unit17.lesson01.teach.reminder_lucrez_lucreaza:
    title: 'दोहराव: lucrez, lucrează'
    gloss: lucrez (मैं काम करता/करती हूँ) · lucrează (वह काम करता/करती है)
    note: दोनों इकाई 10 की दिनचर्या से हैं (*Lucrez seara.*) -- इस इकाई में इनका उपयोग दिन के समय की जगह पेशे की बात करने के लिए होता है।
  ro.a1.unit17.lesson01.teach.inginer_vocab:
    title: इंजीनियर
    gloss: Inginer (इंजीनियर)
    note: पुल्लिंग रूप -- इस इकाई में इसे केवल Mihai बोलता है (*Sunt inginer*), इसलिए अभी स्त्रीलिंग रूप की ज़रूरत नहीं है।
    example_gloss:
    - Mihai इंजीनियर है।
  ro.a1.unit17.lesson01.teach.birou_vocab:
    title: दफ़्तर
    gloss: Birou (दफ़्तर)
    note: वह जगह जहाँ Mihai काम करता है; इसमें इकाई 4 में सीखा *la* (पर, में) इस्तेमाल होता है।
    example_gloss:
    - वह दफ़्तर में काम करता है।
  ro.a1.unit17.lesson01.teach.mihai_este_inginer_lucreaza_la_birou_phrase:
    title: Mihai इंजीनियर है। वह दफ़्तर में काम करता है।
    gloss: Mihai este inginer. Lucrează la birou.
    note: यहाँ हर शब्द पहले सिखाया जा चुका है या अभी नया आया है; इन्हें जोड़कर Mihai के पेशे के बारे में दो नए वाक्य बने हैं।
  ro.a1.unit17.lesson02.teach.reminder_sunt_unde_ana:
    title: 'दोहराव: sunt, unde, Ana'
    gloss: sunt (मैं हूँ) · unde (कहाँ) · Ana (नाम)
    note: Sunt इकाई 16 से है (*Sunt bolnav*); unde इकाई 7 और इकाई 8 से है (*Unde pot să cumpăr...?*, *Unde este...?*); Ana पात्र का नाम है, जो इकाई 1 से आ रहा है -- इस इकाई में तीनों का उपयोग Ana के पेशे की बात करने के लिए होता है।
  ro.a1.unit17.lesson02.teach.profesoara_vocab:
    title: शिक्षक
    gloss: Profesoară (शिक्षिका, स्त्रीलिंग)
    note: स्त्रीलिंग रूप -- इस इकाई में इसे केवल Ana बोलती है (*Sunt profesoară*), इसलिए अभी पुल्लिंग रूप की ज़रूरत नहीं है।
    example_gloss:
    - मैं शिक्षिका हूँ।
  ro.a1.unit17.lesson02.teach.scoala_vocab:
    title: स्कूल
    gloss: Școală (स्कूल)
    note: वह जगह जहाँ Ana काम करती है; *la* का प्रयोग वैसा ही है जैसा *la birou* में।
    example_gloss:
    - मैं स्कूल में काम करती हूँ।
  ro.a1.unit17.lesson02.teach.sunt_profesoara_lucrez_la_scoala_phrase:
    title: मैं शिक्षिका हूँ। मैं स्कूल में काम करती हूँ।
    gloss: Sunt profesoară. Lucrez la școală.
    note: Ana का अपने पेशे के बारे में अपना कथन; इसमें इस पाठ के दो नए शब्द और इकाई 16 का सीखा हुआ *sunt* जुड़े हैं।
  ro.a1.unit17.lesson02.teach.unde_lucrati_phrase:
    title: आप कहाँ काम करते हैं?
    gloss: Unde lucrați? (आप कहाँ काम करते हैं?, औपचारिक)
    note: '*Lucrați* "आप काम करते हैं" का औपचारिक रूप है; इसमें वही -ați/-eți अंत है जो *aveți* और *faceți* में पहले देखा था -- किसी से भी उसके पेशे के बारे में पूछने के लिए उपयोगी।'
  ro.a1.unit17.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'दोहराव: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (नमस्ते) · Ce mai faceți? (आप कैसे हैं?, औपचारिक) · Bine, mulțumesc (ठीक हूँ, धन्यवाद)
    note: सब इकाई 1 के आरंभिक अभिवादन से हैं; यहाँ इस इकाई का संवाद शुरू करने के लिए दोहराए गए हैं।
  ro.a1.unit17.lesson03.teach.reminder_si_dumneavoastra_la_revedere:
    title: 'दोहराव: Și dumneavoastră?, La revedere'
    gloss: Și dumneavoastră? (और आप?, औपचारिक) · La revedere (अलविदा)
    note: दोनों इकाई 1 से हैं; यहाँ स्वाभाविक अगले प्रश्न और समापन वाक्य के रूप में दोहराए गए हैं।
  ro.a1.unit17.lesson03.teach.line01:
    title: अभिवादन करें और हालचाल पूछें
    gloss: Ana, Mihai को नमस्ते कहती है और उसका हालचाल पूछती है।
    note: इकाई 1 के *Ce mai faceți?* अभिवादन का फिर से उपयोग।
  ro.a1.unit17.lesson03.teach.line02:
    title: जवाब दें और पूछें कि वह कहाँ काम करती है
    gloss: Mihai जवाब देता है, फिर Ana से पूछता है कि वह कहाँ काम करती है।
    note: इकाई 1 के *Bine, mulțumesc* को इस इकाई के *Unde lucrați?* से जोड़ा गया है।
  ro.a1.unit17.lesson03.teach.line03:
    title: अपना पेशा और काम की जगह बताएँ, फिर वही सवाल लौटाएँ
    gloss: Ana कहती है कि वह स्कूल में शिक्षिका के रूप में काम करती है, फिर Mihai से वही सवाल पूछती है।
    note: इस इकाई के दूसरे पाठ के वाक्य को इकाई 1 के *Și dumneavoastră?* से जोड़ा गया है।
  ro.a1.unit17.lesson03.teach.line04:
    title: अपना पेशा और काम की जगह बताएँ
    gloss: Mihai कहता है कि वह दफ़्तर में इंजीनियर के रूप में काम करता है।
    note: इस इकाई के पहले पाठ के वाक्य का लगभग वैसा ही दोहराव।
  ro.a1.unit17.lesson03.teach.line05:
    title: बातचीत समाप्त करें
    gloss: Ana अलविदा कहती है।
    note: वही समापन-रूप जिस पर पिछली हर इकाई का संवाद खत्म हुआ है।
  ro.a1.unit17.lesson03.teach.line06:
    title: अलविदा कहें
    gloss: Mihai अलविदा कहता है।
    note: वही समापन-रूप जिस पर पिछली हर इकाई का संवाद खत्म हुआ है।
