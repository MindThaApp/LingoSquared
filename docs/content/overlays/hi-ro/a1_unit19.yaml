teaching:
  ro.a1.unit19.lesson01.teach.reminder_ana_este:
    title: 'दोहराव: Ana, Este, Și'
    gloss: Ana (नाम) · Este (है) · Și (और)
    note: Ana पात्र का नाम है, जो पहली इकाई से आ रहा है; *este* इकाई 8 के स्थानों वाले भाग से है; *și* इकाई 5 से है -- इस इकाई में तीनों का उपयोग आज के मौसम का वर्णन करने के लिए फिर किया गया है।
  ro.a1.unit19.lesson01.teach.reminder_astazi:
    title: 'दोहराव: Astăzi'
    gloss: Astăzi (आज)
    note: इकाई 3 की तारीख़ वाली शब्दावली से -- यहाँ आज के मौसम की बात करने के लिए फिर प्रयोग किया गया है।
  ro.a1.unit19.lesson01.teach.vreme_vocab:
    title: मौसम
    gloss: Vreme (मौसम)
    note: '*Vremea* शब्द *vreme* का निश्चित रूप है -- "वह मौसम": -e पर समाप्त होने वाली स्त्रीलिंग संज्ञा में -a जुड़ता है, जैसे इकाई 18 में *baie* → *baia* (बाथरूम)।'
    example_gloss:
    - मौसम कैसा है?
  ro.a1.unit19.lesson01.teach.cum_este_vremea_phrase:
    title: मौसम कैसा है?
    gloss: Cum este vremea? (मौसम कैसा है?)
    note: मौसम के बारे में पूछने का रोज़मर्रा का तरीका -- *cum* इकाई 1, इकाई 9 और इकाई 12 से है।
  ro.a1.unit19.lesson01.teach.soare_vocab:
    title: धूप / धूप वाला
    gloss: Soare (धूप / धूप वाला)
    note: 'धूप वाले मौसम के लिए *este* के साथ प्रयोग होता है: *Este soare* का शाब्दिक अर्थ "धूप है" है, यानी "धूप खिली है"।'
    example_gloss:
    - आज धूप है।
  ro.a1.unit19.lesson01.teach.cald_vocab:
    title: गरम / गर्म
    gloss: Cald (गरम / गर्म)
    note: मौसम का यह शब्द अपरिवर्तनीय है -- *Este cald* में हमेशा यही रूप रहता है, इसमें कोई बदलाव नहीं होता।
    example_gloss:
    - आज गर्मी है।
  ro.a1.unit19.lesson01.teach.astazi_soare_cald_phrase:
    title: आज धूप है। गर्मी है।
    gloss: Astăzi este soare. Este cald.
    note: यहाँ का हर शब्द पहले पढ़ाया जा चुका है या अभी आया है, और इन्हें मिलाकर आज के मौसम के दो नए वाक्य बने हैं।
  ro.a1.unit19.lesson02.teach.reminder_mihai_maine:
    title: 'दोहराव: Mihai, Mâine'
    gloss: Mihai (नाम) · Mâine (कल)
    note: Mihai पात्र का नाम है, जो पहली इकाई से आ रहा है; *mâine* इकाई 3 और इकाई 12 से है -- इस इकाई में दोनों का उपयोग कल के पूर्वानुमान का वर्णन करने के लिए फिर किया गया है।
  ro.a1.unit19.lesson02.teach.reminder_nu_mergem_la_parc:
    title: 'दोहराव: Nu, Mergem, La parc'
    gloss: Nu (नहीं) · Mergem (हम जाते हैं) · La parc (पार्क में / पार्क को)
    note: सब इकाई 11 की योजना बनाने वाली शब्दावली से -- यहाँ यह तय करने के लिए फिर प्रयोग हुई कि मौसम पार्क जाने देगा या नहीं।
  ro.a1.unit19.lesson02.teach.ploua_vocab:
    title: बारिश हो रही है
    gloss: Plouă (बारिश हो रही है / बारिश होती है)
    note: यह एक कर्ताहीन क्रिया रूप है -- इसके लिए किसी कर्ता की ज़रूरत नहीं, जैसे *Este cald* में भी नहीं होती।
    example_gloss:
    - कल बारिश हो रही है।
  ro.a1.unit19.lesson02.teach.vant_vocab:
    title: हवा
    gloss: Vânt (हवा)
    note: '*soare* की तरह ही *este* के साथ प्रयोग होता है: *Este vânt*, यानी "हवा चल रही है"।'
    example_gloss:
    - कल हवा चल रही है।
  ro.a1.unit19.lesson02.teach.frig_vocab:
    title: ठंड
    gloss: Frig (ठंड)
    note: '*este* के साथ प्रयोग होता है: *Este frig*, यानी "ठंड है"।'
    example_gloss:
    - कल ठंड है।
  ro.a1.unit19.lesson02.teach.maine_ploua_phrase:
    title: कल बारिश हो रही है। हवा चल रही है और ठंड है।
    gloss: Mâine plouă. Este vânt și este frig.
    note: यहाँ का हर शब्द पहले पढ़ाया जा चुका है या अभी आया है, और इन्हें मिलाकर कल का पूरा पूर्वानुमान बना है।
  ro.a1.unit19.lesson02.teach.nu_mergem_phrase:
    title: हम कल पार्क नहीं जाते।
    gloss: Nu mergem la parc mâine. (हम कल पार्क नहीं जाते।)
    note: मौसम पर आधारित वह योजना जिसकी ओर यह पाठ बढ़ता है -- इकाई 11 के *mergem* और *la parc* के आगे *nu* लगाया गया है।
  ro.a1.unit19.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'दोहराव: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (नमस्ते) · Ce mai faceți? (आप कैसे हैं? आदरपूर्वक) · Bine, mulțumesc (ठीक हूँ, धन्यवाद)
    note: सब इकाई 1 के आरंभिक अभिवादन से हैं, जिन्हें यहाँ इस इकाई का संवाद शुरू करने के लिए फिर प्रयोग किया गया है।
  ro.a1.unit19.lesson03.teach.reminder_sambata_la_revedere:
    title: 'दोहराव: Sâmbătă, La revedere'
    gloss: Sâmbătă (शनिवार) · La revedere (अलविदा)
    note: '*Sâmbătă* इकाई 3, इकाई 11 और इकाई 12 से है; *la revedere* इकाई 1 से है -- दोनों सप्ताहांत की योजना वाले संवाद के लिए फिर प्रयोग हुए हैं।'
  ro.a1.unit19.lesson03.teach.line01:
    title: मिहाई का अभिवादन करें और हालचाल पूछें
    gloss: आना मिहाई का अभिवादन करती है और उसका हालचाल पूछती है।
    note: इकाई 1 के *Ce mai faceți?* अभिवादन का फिर प्रयोग।
  ro.a1.unit19.lesson03.teach.line02:
    title: उत्तर दें और कल के मौसम के बारे में पूछें
    gloss: मिहाई उत्तर देता है, फिर आना से पूछता है कि कल मौसम कैसा रहेगा।
    note: इकाई 1 के *Bine, mulțumesc* को इसी इकाई के पहले पाठ के वाक्य *Cum este vremea?* से जोड़ा गया है, साथ में *mâine*।
  ro.a1.unit19.lesson03.teach.line03:
    title: कल का पूर्वानुमान बताएँ
    gloss: आना उसे बताती है कि बारिश होगी, और हवा चलेगी तथा ठंड होगी।
    note: इसी इकाई के दूसरे पाठ का वाक्य ज्यों का त्यों फिर प्रयोग हुआ है।
  ro.a1.unit19.lesson03.teach.line04:
    title: सुझाव दें कि पार्क न जाएँ, बल्कि शनिवार को चलें
    gloss: मिहाई कहता है कि वे कल पार्क नहीं जाएँगे, और उसकी जगह शनिवार के बारे में पूछता है।
    note: इसी इकाई के दूसरे पाठ के वाक्य को इकाई 11 के *mergem* और इस इकाई के *sâmbătă* से जोड़ा गया है।
  ro.a1.unit19.lesson03.teach.line05:
    title: सहमति दें और शनिवार की धूप का ज़िक्र करें
    gloss: आना कहती है कि शनिवार को धूप होगी, और योजना पर सहमत होती है।
    note: '*soare* को इकाई 11 के सहमति वाले वाक्य *Da, bine!* से जोड़ा गया है।'
  ro.a1.unit19.lesson03.teach.line06:
    title: अलविदा कहें
    gloss: मिहाई अलविदा कहता है।
    note: पिछली हर इकाई के संवाद का अंत इसी तरह होता रहा है।
  ro.a1.unit19.lesson03.teach.line07:
    title: अलविदा कहें
    gloss: आना अलविदा कहती है।
    note: पिछली हर इकाई के संवाद का अंत इसी तरह होता रहा है।
