teaching:
  ro.a1.unit09.lesson01.teach.reminder_unde_este_locuri:
    title: 'दोहराव: unde, este, gară, magazin, bancă, aproape'
    gloss: unde (कहाँ) · este (है) · gară (रेलवे स्टेशन) · magazin (दुकान) · bancă (बैंक) · aproape (पास)
    note: ये सब पहले आ चुके हैं -- unde यूनिट 7 से, este यूनिट 3/4 से, gară/magazin/bancă/aproape यूनिट 8 से -- यहाँ ये मिलकर इस यूनिट के रास्ता पूछने वाले प्रश्नों और उदाहरणों में आते हैं।
  ro.a1.unit09.lesson01.teach.cum_pot_sa_ajung:
    title: मैं ... कैसे पहुँच सकता हूँ?
    gloss: Cum pot să ajung...? (मैं ... कैसे पहुँच सकता हूँ?)
    note: किसी जगह पहुँचने का रास्ता पूछने का रोज़मर्रा का तरीका -- *pot* (मैं सकता हूँ) यूनिट 7 के *Unde pot să cumpăr...?* में आ चुका है; *ajung* (मैं पहुँचता हूँ) नया है।
  ro.a1.unit09.lesson01.teach.mergeti_vocab:
    title: जाइए
    gloss: Mergeți (जाइए -- औपचारिक आदेश)
    note: '*Mergeți* आदरसूचक (आप वाले) रूप का आदेश है -- किसी से जाने को कहने का शिष्ट तरीका, जैसे Ana और Mihai पहले से एक-दूसरे से बात करते हैं।'
    example_gloss:
    - सीधे जाइए।
  ro.a1.unit09.lesson01.teach.inainte_vocab:
    title: सीधे आगे
    gloss: înainte (सीधे)
    note: '*Mergeți* के साथ मिलकर यह सबसे सरल दिशा-निर्देश बनता है।'
    example_gloss:
    - सीधे जाइए।
  ro.a1.unit09.lesson01.teach.mergeti_inainte_phrase:
    title: सीधे जाइए
    gloss: Mergeți înainte. (सीधे जाइए।)
    note: एक छोटा, पूरा निर्देश -- *Cum pot să ajung...?* का सबसे सरल उत्तर।
  ro.a1.unit09.lesson01.teach.cum_ajung_gara:
    title: मैं रेलवे स्टेशन तक कैसे पहुँच सकता हूँ?
    gloss: Cum pot să ajung la gară? (मैं रेलवे स्टेशन तक कैसे पहुँच सकता हूँ?)
    note: '*Cum pot să ajung...?* और *gară* को एक पूरे प्रश्न में जोड़ता है -- *la* (तक) प्रश्न को गंतव्य से जोड़ता है। *la* के बाद जगह का सादा रूप रहता है: *la gară*, *la gara* नहीं।'
  ro.a1.unit09.lesson01.teach.cum_ajung_banca:
    title: मैं बैंक तक कैसे पहुँच सकता हूँ?
    gloss: Cum pot să ajung la bancă? (मैं बैंक तक कैसे पहुँच सकता हूँ?)
    note: वही ढाँचा, अब बैंक के साथ -- यह पूछना स्वाभाविक है, क्योंकि यूनिट 8 में बताया जा चुका है कि बैंक दूर है।
  ro.a1.unit09.lesson02.teach.dreapta_stanga_vocab:
    title: दाएँ, बाएँ
    gloss: la dreapta (दाएँ) · la stânga (बाएँ)
    note: 'दो बुनियादी मोड़ -- हर एक को *la* (की ओर) के साथ एक जोड़ी की तरह सीखिए: *la dreapta*, *la stânga*।'
    example_gloss:
    - दाएँ जाइए।
    - बाएँ जाइए।
  ro.a1.unit09.lesson02.teach.mergeti_dreapta_phrase:
    title: दाएँ जाइए
    gloss: Mergeți la dreapta. (दाएँ जाइए।)
    note: वही *Mergeți* आदेश जो *Mergeți înainte.* में है, अब सीधे के बजाय मोड़ के साथ।
  ro.a1.unit09.lesson02.teach.mergeti_stanga_phrase:
    title: बाएँ जाइए
    gloss: Mergeți la stânga. (बाएँ जाइए।)
    note: उलटा मोड़ -- वही सरल ढाँचा।
  ro.a1.unit09.lesson02.teach.aici_acolo_vocab:
    title: यहाँ, वहाँ
    gloss: aici (यहाँ) · acolo (वहाँ)
    note: पहुँचने पर या कुछ दिखाई देने पर यह बताने का सरल तरीका कि वह कहाँ है; यह यूनिट 8 के aproape/departe से अलग है, क्योंकि वे दूरी बताते हैं, स्थिति नहीं।
    example_gloss:
    - दुकान यहाँ है।
    - रेलवे स्टेशन वहाँ है।
  ro.a1.unit09.lesson02.teach.magazinul_aici_phrase:
    title: दुकान यहाँ है
    gloss: Magazinul este aici. (दुकान यहाँ है।)
    note: एक छोटा, पूरा कथन -- *aici* ठीक उसी जगह की ओर इशारा करता है जहाँ आप हैं।
  ro.a1.unit09.lesson02.teach.gara_acolo_phrase:
    title: रेलवे स्टेशन वहाँ है
    gloss: Gara este acolo. (रेलवे स्टेशन वहाँ है।)
    note: '*Acolo* ऐसी चीज़ की ओर इशारा करता है जो दिखाई देती है पर ठीक आपके पास नहीं है -- दिशा-निर्देश पूरे करने का स्वाभाविक तरीका।'
  ro.a1.unit09.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'दोहराव: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (नमस्ते) · mulțumesc (धन्यवाद) · la revedere (अलविदा) · da (हाँ) · Ana, Mihai (नाम)
    note: ये सब पिछली यूनिटों में आ चुके हैं -- यहाँ Ana, Mihai से रास्ता पूछती है।
  ro.a1.unit09.lesson03.teach.apoi:
    title: फिर
    gloss: apoi (फिर / उसके बाद)
    note: दो दिशा-चरणों को एक निर्देश में जोड़ता है -- एक साथ कई चरण बताने का स्वाभाविक तरीका।
    example_gloss:
    - सीधे जाइए, फिर दाएँ।
  ro.a1.unit09.lesson03.teach.line01:
    title: अभिवादन करें और रेलवे स्टेशन का रास्ता पूछें
    gloss: Ana, Mihai को नमस्ते कहती है और पूछती है कि रेलवे स्टेशन तक कैसे पहुँचे।
    note: इस यूनिट के *Cum pot să ajung* को यूनिट 1 के अभिवादन से जोड़ता है।
  ro.a1.unit09.lesson03.teach.line02:
    title: दो दिशा-चरण बताएँ
    gloss: Mihai कहता है कि सीधे जाइए, फिर दाएँ।
    note: इस यूनिट के *Mergeți înainte* और *la dreapta* को *apoi* से जोड़कर फिर प्रयोग करता है।
  ro.a1.unit09.lesson03.teach.line03:
    title: पूछें कि क्या वह पास है
    gloss: Ana पूछती है कि क्या रेलवे स्टेशन पास है।
    note: यूनिट 8 के *este*/*aproape* का फिर प्रयोग करने वाला एक छोटा अगला प्रश्न।
  ro.a1.unit09.lesson03.teach.line04:
    title: पुष्टि करें और बताएँ
    gloss: Mihai पुष्टि करता है कि स्टेशन पास है और बताता है कि वह वहाँ है।
    note: '*aproape* और *acolo* -- दूरी और स्थिति -- को एक पंक्ति में जोड़ता है।'
  ro.a1.unit09.lesson03.teach.line05:
    title: धन्यवाद कहें और विदा लें
    gloss: Ana, Mihai को धन्यवाद देती है और अलविदा कहती है।
    note: वही समापन-धन्यवाद जो यूनिट 1 और यूनिट 8 के संवादों में था।
  ro.a1.unit09.lesson03.teach.line06:
    title: मुलाकात समाप्त करें
    gloss: Mihai भी Ana का नाम लेकर अलविदा कहता है।
    note: वही मित्रतापूर्ण समापन-ढाँचा, जिस पर यूनिट 1, 5, 6, 7 और 8 के संवाद समाप्त हुए।
