teaching:
  ro.a1.unit30.lesson01.teach.a_citi_a:
    title: पढ़ना, कसरत करना, खाना बनाना
    gloss: पढ़ना, कसरत/खेलकूद करना, खाना पकाना
    note: 'तीन आम शौक़ वाली क्रियाएँ: *a citi* (पढ़ना), *a face sport* (व्यायाम करना या खेल खेलना) और *a găti* (खाना बनाना)। रोमानियाई में क्रिया का मूल रूप *a* से शुरू होता है।'
    example_gloss:
    - मुझे किताब पढ़ना पसंद है।
    - मैं शनिवार को कसरत करता हूँ।
    - मुझे दोस्तों के लिए खाना बनाना पसंद है।
  ro.a1.unit30.lesson01.teach.timpul_liber:
    title: ख़ाली समय
    gloss: ख़ाली समय
    note: '*Timpul liber* (खाली समय) पुल्लिंग संज्ञा *timp* से बना है, जिसमें निश्चयवाचक उपसर्ग जुड़ा है। शौक़ों के बारे में बात करने के लिए यह मुख्य वाक्यांश है।'
    example_gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
  ro.a1.unit30.lesson01.teach.in_timpul_liber:
    title: ख़ाली समय में क्या करते हैं, यह बताना
    gloss: ख़ाली समय में मुझे पढ़ना पसंद है।
    note: '*Citesc*, *a citi* (पढ़ना) का *eu* वाला रूप है; *îmi place să* के बाद क्रिया का यही रूप रहता है।'
  ro.a1.unit30.lesson02.teach.a_asculta_muzica:
    title: संगीत, चित्रकारी, वीडियो गेम
    gloss: संगीत सुनना, चित्र बनाना, वीडियो गेम खेलना
    note: 'तीन और शौक़ वाले वाक्यांश: *a asculta muzică* (संगीत सुनना), *a desena* (चित्र बनाना) और *a juca jocuri video* (वीडियो गेम खेलना)।'
    example_gloss:
    - मुझे संगीत सुनना पसंद है।
    - मैं अक्सर चित्र बनाता/बनाती हूँ।
    - मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
  ro.a1.unit30.lesson02.teach.imi_place_sa:
    title: कहना कि आपको संगीत सुनना पसंद है
    gloss: मुझे संगीत सुनना पसंद है।
    note: '*Îmi place să ascult muzică*: *îmi place* ("मुझे अच्छा लगता है") + *să* + क्रिया, यह कहने का आम तरीका है कि आपको कोई काम करना पसंद है।'
  ro.a1.unit30.lesson02.teach.imi_place_sa_2:
    title: कहना कि आपको दोस्तों के साथ वीडियो गेम खेलना पसंद है
    gloss: मुझे दोस्तों के साथ वीडियो गेम खेलना पसंद है।
    note: '*Cu prietenii* का अर्थ है "दोस्तों के साथ": *cu* ("के साथ") पूर्वसर्ग है, और *prietenii* निश्चित बहुवचन है।'
  ro.a1.unit30.lesson03.teach.mereu_des_uneori:
    title: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    gloss: हमेशा, अक्सर, कभी-कभी, कभी नहीं
    note: 'कितनी बार, यह बताने वाले चार मुख्य क्रियाविशेषण: *mereu*, *des*, *uneori* और *niciodată*। ये आम तौर पर क्रिया के बाद आते हैं: *Citesc des*।'
    example_gloss:
    - मैं हर शनिवार हमेशा कसरत करता/करती हूँ।
    - मैं अक्सर कोई किताब पढ़ता/पढ़ती हूँ।
    - मैं कभी-कभी चित्र बनाता/बनाती हूँ।
    - मैं कभी वीडियो गेम नहीं खेलता/खेलती।
  ro.a1.unit30.lesson03.teach.in_fiecare_saptamana:
    title: हर हफ़्ते, हर सप्ताहांत
    gloss: हर हफ़्ते, हर सप्ताहांत
    note: '*În fiecare săptămână* और *în fiecare weekend* दोनों का अर्थ "हर" है; *fiecare* कभी नहीं बदलता, अगला कार्ड देखिए।'
    example_gloss:
    - मैं हर हफ़्ते दोस्तों के लिए खाना बनाता/बनाती हूँ।
    - मैं हर सप्ताहांत कसरत करता/करती हूँ।
  ro.a1.unit30.lesson03.teach.cuvantul_fiecare_nu:
    title: Fiecare कभी नहीं बदलता
    gloss: 'शब्द fiecare नहीं बदलता: în fiecare săptămână (हर सप्ताह), în fiecare weekend (हर सप्ताहांत)।'
    note: '*Fiecare*, *săptămână* और *weekend* से पहले वैसा ही रहता है, संज्ञा कोई भी हो, इसलिए चुनने की कोई बात नहीं है।'
  ro.a1.unit30.lesson03.teach.ce_faci_in:
    title: खाली समय के बारे में पूछना
    gloss: आप अपने खाली समय में क्या करते हैं?
    note: यह इस इकाई का मुख्य प्रश्न है -- किसी से भी उसके शौक़ पूछने के लिए इसका इस्तेमाल कीजिए।
  ro.a1.unit30.lesson04.teach.ana_ne_plimbam:
    title: Ana शौक़ों की बात छेड़ती है
    gloss: 'Ana: हम अक्सर साथ टहलते हैं। लेकिन Mihai, तुम खाली समय में और क्या करते हो?'
    note: '*Ne plimbăm* ("हम टहलते हैं") प्रतिबिंबी क्रिया *a se plimba* का *noi* वाला रूप है; यह उन सैरों की ओर इशारा करता है जो दोनों दोस्तों को पसंद हैं।'
  ro.a1.unit30.lesson04.teach.mihai_imi_place:
    title: Mihai के शौक़
    gloss: 'Mihai: मुझे खाना बनाना पसंद है, घर पर भी। और मैं अक्सर व्यायाम करता हूँ।'
    note: '*Și acasă* (घर पर भी) साफ़ करता है कि Mihai शौक़ से भी खाना बनाता है, सिर्फ़ रेस्टोरेंट की नौकरी की वजह से नहीं।'
  ro.a1.unit30.lesson04.teach.ana_gatesti_si:
    title: Ana हैरान है
    gloss: 'Ana: तुम घर पर भी खाना बनाते हो? तुम तो पहले ही दिन भर काम पर खाना बनाते हो!'
    note: '*Toată ziua* (दिन भर) ज़ोर देता है कि Mihai काम पर पहले ही कितना खाना बनाता है; *deja* का अर्थ है "पहले ही"।'
  ro.a1.unit30.lesson04.teach.mihai_da_dar:
    title: Mihai समझाता है
    gloss: 'Mihai: हाँ, लेकिन मुझे खाना बनाना सुकून देने वाला लगता है। और तुम्हें क्या करना पसंद है?'
    note: '*Gătitul mi se pare relaxant* का शाब्दिक अर्थ है "खाना बनाना मुझे सुकून देने वाला लगता है": *mi se pare* अपनी राय देने का आम तरीका है।'
  ro.a1.unit30.lesson04.teach.ana_imi_place:
    title: Ana के शौक़
    gloss: 'Ana: मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ।'
    note: पिछले पाठों की दो शौक़ वाली क्रियाओं को एक वाक्य में *și* (और) से जोड़ा गया है।
  ro.a1.unit30.lesson04.teach.mihai_joci_si:
    title: Mihai गेमिंग के बारे में पूछता है
    gloss: 'Mihai: क्या तुम भी वीडियो गेम खेलती हो?'
    note: हाँ/नहीं वाला एक छोटा प्रश्न, जिसमें पिछले पाठ का *jocuri video* आया है; *joci*, *a juca* का *tu* वाला रूप है।
  ro.a1.unit30.lesson04.teach.ana_nu_nu:
    title: Ana उत्तर देती है
    gloss: 'Ana: नहीं, मैं कभी वीडियो गेम नहीं खेलती। लेकिन कभी-कभी चित्र बनाती हूँ!'
    note: '*Niciodată* (कभी नहीं) और *uneori* (कभी-कभी) पिछले पाठ से, एक ही उत्तर में आमने-सामने; *nu ... niciodată* दोहरा निषेध है।'
  ro.a1.unit30.lesson05.teach.mihai_si_cu:
    title: शौक़ों की तुलना
    gloss: Mihai और मैं अक्सर साथ टहलते हैं। लेकिन हमारे और भी शौक़ हैं। Mihai को खाना बनाना पसंद है, घर पर भी, और वह अक्सर व्यायाम करता है। मुझे पढ़ना पसंद है और मैं अक्सर संगीत सुनती हूँ। मैं कभी-कभी चित्र बनाती हूँ, लेकिन कभी वीडियो गेम नहीं खेलती। आपको खाली समय में क्या करना पसंद है?
    note: Ana का संदेश पहले की बातें दोहराता है और अंत में पाठक से इस यूनिट का मुख्य प्रश्न पूछता है।
    glosses:
      plimbăm: टहलना
      des: अक्सर
      împreună: साथ में
      alte: दूसरे
      gătească: खाना बनाता है
      place: पसंद है
      acasă: घर पर
      sport: कसरत करता है
      citesc: पढ़ना
      ascult: सुनना
      muzică: संगीत
      desenez: चित्र बनाती हूँ
      uneori: कभी-कभी
      joc: वीडियो गेम खेलना
      niciodată: कभी नहीं
      liber: खाली
      timpul: समय
  ro.a1.unit30.lesson06.teach.mihai_ce_faci:
    title: Mihai सप्ताहांत के बारे में पूछता है
    gloss: 'Mihai: इस सप्ताहांत तुम क्या कर रही हो?'
    note: '*În acest weekend* (इस सप्ताहांत) में "इस" के लिए *acest* आता है।'
  ro.a1.unit30.lesson06.teach.ana_inca_nu:
    title: Ana ने अभी तय नहीं किया
    gloss: 'Ana: अभी पता नहीं। मुझे पढ़ना पसंद है, लेकिन मैं बाहर भी जाना चाहती हूँ।'
    note: '*Să ies afară* (बाहर जाना) घर से निकलने की इच्छा बताने का आम तरीका है; *vreau să* + क्रिया का अर्थ है "मैं ... करना चाहता/चाहती हूँ"।'
  ro.a1.unit30.lesson06.teach.mihai_hai_sa:
    title: Mihai योजना सुझाता है
    gloss: 'Mihai: चलो साथ टहलते हैं! उसके बाद मैं हमारे लिए खाना बनाऊँगा।'
    note: '*După aceea* (उसके बाद) क्रम बताने वाला वाक्यांश है; *Hai să* + क्रिया साथ मिलकर कुछ करने का सुझाव देता है।'
  ro.a1.unit30.lesson06.teach.ana_buna_idee:
    title: Ana सहमत होती है
    gloss: 'Ana: अच्छा विचार है! मुझे टहलना भी पसंद है और खाना बनाना भी।'
    note: '*Și ..., și ...* ("दोनों ... और ...") दिखाता है कि Ana को दो चीज़ें समान रूप से पसंद हैं, एक दूसरी से ज़्यादा नहीं।'
  ro.a1.unit30.lesson06.teach.mihai_perfect_atunci:
    title: Mihai पक्का करता है
    gloss: 'Mihai: बढ़िया। तो शनिवार को मिलते हैं!'
    note: योजना पक्की करने वाली एक दोस्ताना समापन पंक्ति, *sâmbătă* (शनिवार) के लिए; *ne vedem* का अर्थ है "हम एक-दूसरे से मिलेंगे"।
