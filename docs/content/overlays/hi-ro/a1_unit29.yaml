teaching:
  ro.a1.unit29.lesson01.teach.cat_costa_in:
    title: कुल कीमत पूछना
    gloss: कुल मिलाकर कितना होता है?
    note: '*În total* (कुल मिलाकर) बताता है कि आप जोड़ी हुई पूरी कीमत जानना चाहते हैं, किसी एक चीज़ की नहीं; *Cât costă?* का अर्थ है "इसकी कीमत कितनी है?"।'
  ro.a1.unit29.lesson01.teach.costa_douazeci_si:
    title: कुल कीमत बताना
    gloss: कुल मिलाकर एक सौ लेई लगते हैं।
    note: '*Costă*, *a costa* (कीमत होना) का वह/वह के लिए एकवचन रूप है। 19 से बड़ी संख्या के बाद रोमानियाई में संज्ञा से पहले *de* जुड़ता है: *o sută de lei*।'
  ro.a1.unit29.lesson02.teach.a_plati_cu:
    title: कार्ड या नकद से भुगतान करना
    gloss: कार्ड से भुगतान करना, नकद भुगतान करना
    note: '*A plăti cu cardul* का अर्थ है कार्ड से भुगतान करना और *a plăti în numerar* का अर्थ है नकद भुगतान करना; *cu* का अर्थ है "से/साथ" और *în* का अर्थ है "में"।'
    example_gloss:
    - क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    - मैं नकद भुगतान कर रहा हूँ।
  ro.a1.unit29.lesson02.teach.pot_plati_cu:
    title: कार्ड से भुगतान की संभावना पूछना
    gloss: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?
    note: '*Pot plăti* (मैं भुगतान कर सकता/सकती हूँ) *a putea* + क्रिया से बनता है; *aici* (यहाँ) प्रश्न को वर्तमान जगह से जोड़ता है।'
  ro.a1.unit29.lesson02.teach.doriti_sa_platiti:
    title: भुगतान की पसंद पूछना
    gloss: आप नकद भुगतान करना चाहेंगे या कार्ड से?
    note: '*Doriți să plătiți ...?* औपचारिक *dumneavoastră* वाला रूप है, जो किसी अपरिचित कैशियर के लिए प्रयोग होता है; दोस्त से आप *Vrei să plătești ...?* कहेंगे।'
  ro.a1.unit29.lesson03.teach.nota:
    title: बिल
    gloss: बिल
    note: 'स्त्रीलिंग संज्ञा: *o notă*, *nota* (आर्टिकल अंत में जुड़ जाता है)।'
    example_gloss: क्या हम बिल बाँट लें?
  ro.a1.unit29.lesson03.teach.hai_sa_impartim:
    title: बिल बाँटने का सुझाव देना
    gloss: क्या हम बिल बाँट लें?
    note: '*Hai să* + क्रिया किसी काम को साथ मिलकर करने का सुझाव देता है।'
  ro.a1.unit29.lesson03.teach.pot_plati_separat:
    title: अलग-अलग भुगतान करने को कहना
    gloss: क्या मैं अलग से भुगतान कर सकता हूँ?
    note: '*Separat* (अलग-अलग) *a plăti* के बाद आता है; जब हर व्यक्ति अपना हिस्सा खुद चुकाता है, तब *Pot plăti separat?* सामान्य अनुरोध है।'
  ro.a1.unit29.lesson04.teach.restul:
    title: बाकी पैसे
    gloss: बाकी पैसे
    note: '*Restul* का शाब्दिक अर्थ "बाकी" है, और रोमानियाई में लौटाए गए छुट्टे पैसों को इसी नाम से कहते हैं; आर्टिकल अंत में जुड़ जाता है।'
    example_gloss: ये रहे आपके बाकी पैसे।
  ro.a1.unit29.lesson04.teach.poftiti_restul:
    title: बाकी पैसे लौटाना
    gloss: ये रहे आपके बाकी पैसे।
    note: '*Poftiți* औपचारिक *dumneavoastră* रूप है, जिसका अर्थ "ये लीजिए" है; यह काउंटर पर होने वाली औपचारिक बातचीत के अनुकूल है।'
  ro.a1.unit29.lesson04.teach.nu_am_nevoie:
    title: बाकी पैसे लेने से मना करना
    gloss: मुझे बाकी पैसे नहीं चाहिए।
    note: '*A avea nevoie de* (ज़रूरत होना) के साथ *de* आता है: *Nu am nevoie de rest*।'
  ro.a1.unit29.lesson05.teach.treizeci_si_cinci:
    title: पैंतीस
    gloss: पैंतीस
    note: 'रोमानियाई में 21 से 99 तक की संख्याएँ *și* से बनती हैं: *treizeci și cinci* (शाब्दिक अर्थ "तीस और पाँच"), और संज्ञा से पहले *de* जुड़ता है: *o sută treizeci și cinci de lei*।'
    example_gloss: इसकी कीमत एक सौ पैंतीस लेई है।
  ro.a1.unit29.lesson05.teach.nota_doua_feluri:
    title: रेस्तराँ का बिल पढ़िए
    gloss: 'बिल: दो मुख्य व्यंजन और दो कॉफ़ी। कुल: एक सौ पैंतीस लेई। कार्ड से भुगतान हुआ।'
    note: देखिए कि क्या मँगाया गया, कुल कितना हुआ और भुगतान कैसे किया गया।
    glosses:
      Nota: बिल
      două: दो
      feluri: मुख्य व्यंजन
      cafele: कॉफ़ी
      Total: कुल
      '135': एक सौ पैंतीस
      lei: लेई
      Plătit: चुकाया गया
      cardul: कार्ड
  ro.a1.unit29.lesson06.teach.ana_hai_sa:
    title: Ana बिल माँगती है
    gloss: 'Ana: बिल माँग लें?'
    note: '*A cere* (माँगना) के कर्म के रूप में *nota* आता है; *Hai să cerem nota?* साथ मिलकर बिल माँगने का सुझाव देता है।'
  ro.a1.unit29.lesson06.teach.mihai_da_buna:
    title: Mihai कुल कीमत पूछता है
    gloss: 'Mihai: हाँ, अच्छा विचार है। कुल कितना हुआ?'
    note: यह पाठ 1 का प्रश्न *Cât costă în total?* दोबारा आया है।
  ro.a1.unit29.lesson06.teach.ana_sunt_treizeci:
    title: Ana कुल रकम बताती है
    gloss: 'Ana: एक सौ पैंतीस लेई हुए। बाँट लें?'
    note: '*Împărțim*, *a împărți* (बाँटना) का *noi* (हम) वाला रूप है; *nota* संदर्भ से समझ लिया जाता है।'
  ro.a1.unit29.lesson06.teach.mihai_nu_lasa:
    title: Mihai भुगतान करने पर अड़ा रहता है
    gloss: 'Mihai: नहीं, आज मुझे भुगतान करने दो। तुमने मेरी बहुत मदद की है।'
    note: '*Lasă-mă să* ... (मुझे ... करने दो) कुछ करने की पेशकश का सामान्य तरीका है; *m-ai ajutat* ("तुमने मेरी मदद की है") भूतकाल का रूप है।'
  ro.a1.unit29.lesson06.teach.ana_ce_dragut:
    title: Ana भावुक हो जाती है
    gloss: 'Ana: यह तुम्हारी कितनी अच्छी बात है! बहुत धन्यवाद।'
    note: '*Ce drăguț din partea ta!* (यह तुम्हारी कितनी प्यारी बात है) उदारता भरे काम पर कही जाने वाली आत्मीय और आम तारीफ़ है।'
  ro.a1.unit29.lesson06.teach.mihai_pot_plati:
    title: Mihai कार्ड से भुगतान के बारे में पूछता है
    gloss: 'Mihai: क्या मैं यहाँ कार्ड से भुगतान कर सकता हूँ?'
    note: यह पाठ 2 का प्रश्न *Pot plăti cu cardul aici?* दोबारा आया है, अब असली रेस्तराँ में।
  ro.a1.unit29.lesson06.teach.mihai_plateste_nota:
    title: 'Plătește: वह वाला रूप'
    gloss: Mihai बिल चुकाता है।
    note: '*Plătește*, *a plăti* (भुगतान करना) का वह वाला रूप है।'
