teaching:
  ro.a1.unit04.lesson01.teach.este:
    title: 'दोहराव: este'
    gloss: है
    note: '*Este* यूनिट 2 और यूनिट 3 में पहले आ चुका है। चाहे आप संख्या बताएँ, दिन, तारीख़ या अब समय, यह वही शब्द रहता है।'
  ro.a1.unit04.lesson01.teach.ora:
    title: घंटा
    gloss: घंटा
    note: '*ora* स्त्रीलिंग संज्ञा है। घड़ी का समय बताने के लिए इसे संख्या से ठीक पहले रखा जाता है, जैसे *ora unu* (एक बजे)।'
    example_gloss: एक बजा है।
  ro.a1.unit04.lesson01.teach.ora_unu:
    title: एक बजे
    gloss: एक बजे
    note: शाब्दिक अर्थ 'घंटा एक' — पहले ora आता है, फिर संख्या।
  ro.a1.unit04.lesson01.teach.ora_doua:
    title: दो बजे
    gloss: दो बजे
    note: यहाँ संख्या स्त्रीलिंग रूप *două* लेती है, ताकि स्त्रीलिंग *ora* से मेल खाए — पूरा पैटर्न अगले कार्ड में देखें।
  ro.a1.unit04.lesson01.teach.ora_gender_note:
    title: 'एक असली अपवाद: unu, unu ही रहता है'
    gloss: ora unu (nu "ora una") / ora două (nu "ora doi")
    note: जिन संख्याओं का स्त्रीलिंग रूप होता है, वे आम तौर पर स्त्रीलिंग संज्ञा के साथ वही रूप लेती हैं (*doi* → *două*, जैसे स्त्रीलिंग *ora* के साथ), पर समय बताने में *unu* एकमात्र अपवाद है — *ora* स्त्रीलिंग होने पर भी हमेशा *ora unu* कहा जाता है, कभी *ora una* नहीं।
  ro.a1.unit04.lesson01.teach.ora_trei:
    title: तीन बजे
    gloss: तीन बजे
    note: Trei का रूप लिंग के अनुसार बिल्कुल नहीं बदलता, unu/una या doi/două की तरह नहीं — याद रखने की एक बात कम।
  ro.a1.unit04.lesson01.teach.jumatate:
    title: आधा
    gloss: आधा
    note: '''साढ़े...'' कहने के लिए și (और) के साथ प्रयोग होता है: X și jumătate।'
    example_gloss: डेढ़ बजे।
  ro.a1.unit04.lesson01.teach.ora_unu_jumatate:
    title: डेढ़ बजे
    gloss: डेढ़ बजे हैं।
    note: 'शाब्दिक अर्थ ''एक और आधा'' — सीधा तरीका: पहले बीता हुआ घंटा, फिर जुड़ा हुआ आधा।'
  ro.a1.unit04.lesson01.teach.cat_e_ora:
    title: समय पूछना
    gloss: समय क्या हुआ है?
    note: घड़ी का समय पूछने का रोज़मर्रा का तरीका — cât (कितना, इकाई 2 के câți का रिश्तेदार) + este + ora (घंटा)।
  ro.a1.unit04.lesson02.teach.sfert:
    title: एक चौथाई
    gloss: एक चौथाई
    note: घंटे का चौथाई हिस्सा — 15 मिनट। și (और) या fără (बिना) के साथ मिलकर सवा या पौन बताता है।
    example_gloss: सवा एक बजे हैं।
  ro.a1.unit04.lesson02.teach.sfert_rule:
    title: चौथाई या आधे के साथ și और fără
    gloss: și un sfert = +15 मिनट · fără un sfert = -15 मिनट
    note: '*Și* (और) बीत चुके घंटे में मिनट जोड़ता है; *fără* (बिना) आने वाले घंटे से पीछे के मिनट गिनता है — ठीक वैसे ही जैसे हिंदी में ''सवा दो'' और ''पौने तीन''।'
  ro.a1.unit04.lesson02.teach.ora_doua_sfert:
    title: सवा दो
    gloss: सवा दो बजे हैं।
    note: Ora două (2:00) + și un sfert (+15 मिनट) = 2:15।
  ro.a1.unit04.lesson02.teach.fara:
    title: बिना / कम
    gloss: बिना
    note: अगले घंटे से पीछे के मिनट गिनता है, जैसे हिंदी के 'पौने तीन' में।
    example_gloss: पौने तीन बजे हैं।
  ro.a1.unit04.lesson02.teach.ora_trei_fara_sfert:
    title: पौने तीन
    gloss: पौने तीन बजे हैं।
    note: Ora trei (3:00) में fără un sfert (-15 मिनट) = 2:45 — रोमानियाई में समय उस घंटे के हिसाब से बताया जाता है जिसकी ओर गिनती हो रही है, बीते हुए घंटे के हिसाब से नहीं।
  ro.a1.unit04.lesson02.teach.la_ce_ora:
    title: पूछें कि किस समय
    gloss: किस समय?
    note: La (पर) + ce (कौन-सा) + oră (घंटा; यहाँ ora नहीं, अनिश्चित रूप) — कोई बात कब होती है, यह पूछने का रोज़मर्रा का तरीका।
  ro.a1.unit04.lesson02.teach.la_ora_noua:
    title: बताएँ कि कोई बात कब होती है
    gloss: नौ बजे।
    note: La (पर) + ora (घंटा; यहाँ निश्चित रूप) + संख्या — 'La ce oră?' का उत्तर देने का ढाँचा।
  ro.a1.unit04.lesson02.teach.tarziu:
    title: देर से
    gloss: देर
    note: समय देखते समय कही जाने वाली एक आम, उपयोगी प्रतिक्रिया का शब्द।
    example_gloss: देर हो गई!
  ro.a1.unit04.lesson03.teach.cand:
    title: 'याद रखें: când'
    gloss: कब?
    note: Când इकाई 3 में यह पूछने के लिए आ चुका है कि कोई आयोजन कब है — यहाँ वह यह पूछने के लिए लौटता है कि कोई चीज़ कब शुरू होती है।
  ro.a1.unit04.lesson03.teach.zi_parts:
    title: दिन के हिस्से
    gloss: सुबह / दोपहर बाद / शाम / रात
    note: इनमें से हर एक संज्ञा का निश्चित रूप है, जो क्रियाविशेषण की तरह प्रयोग होता है — रोमानियाई में 'सुबह को' या 'शाम को' कहने के लिए किसी अतिरिक्त पूर्वसर्ग की ज़रूरत नहीं होती।
    example_gloss:
    - कक्षा सुबह होती है।
    - कक्षा दोपहर बाद होती है।
    - मिहाई शाम को काम करता है।
    - आना रात को सोती है।
  ro.a1.unit04.lesson03.teach.cursul:
    title: कक्षा
    gloss: कक्षा / पाठ्यक्रम
    note: curs (कक्षा या पाठ्यक्रम) का निश्चित रूप — यहाँ आना और मिहाई की रोमानियाई भाषा की कक्षा।
    example_gloss: कक्षा नौ बजे शुरू होती है।
  ro.a1.unit04.lesson03.teach.incepe:
    title: शुरू होता है
    gloss: शुरू होता है
    note: वर्तमान काल का वह रूप जो वह/यह के लिए आता है — मैं या तुम को छोड़कर कोई भी एकवचन कर्ता, जैसे cursul (कक्षा)।
    example_gloss: कक्षा सुबह शुरू होती है।
  ro.a1.unit04.lesson03.teach.cand_incepe_cursul:
    title: पूछें कि कक्षा कब शुरू होती है
    gloss: कक्षा कब शुरू होती है?
    note: इस पाठ के नए शब्द începe और cursul को când के साथ जोड़ता है।
  ro.a1.unit04.lesson03.teach.raspuns_curs:
    title: बताएँ कि कक्षा कब शुरू होती है
    gloss: कक्षा सुबह नौ बजे शुरू होती है।
    note: दिन के भाग को बताने वाला क्रियाविशेषण (dimineața) अल्पविराम के साथ अंत में जुड़ा है, जैसे इकाई 3 में सप्ताह के दिन के बाद तारीख जोड़ी गई थी।
  ro.a1.unit04.lesson03.teach.line01:
    title: पूछें कि कक्षा कब शुरू होती है
    gloss: आना मिहाई से पूछती है कि कक्षा कब शुरू होती है।
    note: एक सीधा, सामान्य प्रश्न — este और începe tu या dumneavoastră के अनुसार नहीं बदलते।
  ro.a1.unit04.lesson03.teach.line02:
    title: समय बताएँ
    gloss: मिहाई कहता है कि कक्षा सुबह नौ बजे शुरू होती है।
    note: मिहाई इस पाठ का समय और दिन के भाग वाला ढाँचा ही दोहराता है।
  ro.a1.unit04.lesson03.teach.line03:
    title: बात स्वीकार करें और विदा लें
    gloss: आना उसे धन्यवाद देती है और अलविदा कहती है।
    note: La revedere, जो इकाई 1 में सिखाया गया था, बातचीत को उसी तरह समाप्त करता है जैसे हमेशा करता आया है।
  ro.a1.unit04.lesson03.teach.line04:
    title: मुलाकात समाप्त करें
    gloss: मिहाई भी अलविदा कहता है, आना का नाम लेकर।
    note: la revedere के साथ सामने वाले का नाम लेना बात को स्वाभाविक और दोस्ताना ढंग से समाप्त करने का तरीका है।
