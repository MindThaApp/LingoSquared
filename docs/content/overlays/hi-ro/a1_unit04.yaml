course:
  title: हिन्दी में रोमानियाई A1
  description: 'रोमानियाई में समय पूछना और बताना: ठीक बजे, साढ़े, सवा और पौन, दिन के हिस्से, और यह पूछना कि कुछ कब शुरू होता है। आना और मिहाई की कहानी आगे बढ़ती है, जहाँ वे तय करते हैं कि उनकी रोमानियाई कक्षा कब शुरू होगी।'
