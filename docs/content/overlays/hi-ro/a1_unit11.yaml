teaching:
  ro.a1.unit11.lesson01.teach.reminder_da_bine:
    title: 'दोहराव: da, bine, nu, mulțumesc'
    gloss: da (हाँ) · bine (अच्छा / ठीक) · nu (नहीं) · mulțumesc (धन्यवाद)
    note: ये सब यूनिट 6 से पहले ही आ चुके हैं -- यहाँ ये मिलकर इस यूनिट में योजना स्वीकार करने का तरीका बनाते हैं और इस पाठ के शब्द-दोहराव वाले मिलान अभ्यास में आते हैं।
  ro.a1.unit11.lesson01.teach.mergem_vocab:
    title: चलें / हम जाते हैं
    gloss: Mergem (चलें / हम जाते हैं)
    note: यह *a merge* का उत्तम पुरुष बहुवचन रूप है। इसी क्रिया के *merg* (मैं जाता हूँ, यूनिट 10) और *mergeți* (आदरसूचक आदेश, यूनिट 9) आप पहले देख चुके हैं -- क्रिया वही है, बस व्यक्ति और वचन अलग है। चढ़ते स्वर के साथ अकेला बोलने पर यह साथ मिलकर कुछ करने का स्वाभाविक प्रस्ताव बन जाता है।
    example_gloss:
    - क्या हम सिनेमा चलें?
  ro.a1.unit11.lesson01.teach.cinema_vocab:
    title: सिनेमा
    gloss: Cinema (सिनेमा)
    note: हिंदी के 'सिनेमा' से मिलता-जुलता शब्द -- आसानी से पहचाना जा सकता है।
    example_gloss:
    - क्या हम सिनेमा चलें?
  ro.a1.unit11.lesson01.teach.mergem_cinema_phrase:
    title: क्या हम सिनेमा चलें?
    gloss: Mergem la cinema? (क्या हम सिनेमा चलें?)
    note: पूरा निमंत्रण -- 'क्या आप चाहेंगे' जैसा कुछ और जोड़ने की ज़रूरत नहीं; केवल प्रश्नचिह्न 'हम जाते हैं' को प्रस्ताव बना देता है।
  ro.a1.unit11.lesson01.teach.parc_vocab:
    title: पार्क
    gloss: Parc (पार्क)
    note: '*cinema* की तरह एक और मिलता-जुलता शब्द।'
    example_gloss:
    - क्या हम पार्क चलें?
  ro.a1.unit11.lesson01.teach.mergem_parc_phrase:
    title: क्या हम पार्क चलें?
    gloss: Mergem la parc? (क्या हम पार्क चलें?)
    note: निमंत्रण का वही ढाँचा जो *Mergem la cinema?* में है, बस जगह अलग है।
  ro.a1.unit11.lesson01.teach.da_bine_phrase:
    title: हाँ, ठीक है!
    gloss: Da, bine! (हाँ, ठीक है!)
    note: योजना स्वीकार करने का छोटा, स्वाभाविक तरीका -- जाने-पहचाने शब्द नए मेल में।
  ro.a1.unit11.lesson02.teach.reminder_nu_pot:
    title: 'दोहराव: nu, pot'
    gloss: nu (नहीं) · pot (मैं सकता/सकती हूँ)
    note: 'Nu यूनिट 6 से आ चुका है; pot यूनिट 9 के *cum pot să ajung* (मैं कैसे पहुँच सकता हूँ) में आ चुका है। क्रिया से पहले रखने पर *nu* का अर्थ "नहीं" होता है: *nu pot* यानी "मैं नहीं आ सकता/सकती" -- इस यूनिट में योजना को मना करने का तरीका।'
  ro.a1.unit11.lesson02.teach.reminder_sambata_duminica:
    title: 'दोहराव: sâmbătă, duminică'
    gloss: sâmbătă (शनिवार) · duminică (रविवार)
    note: दोनों यूनिट 3 में सप्ताह के दिनों में आ चुके हैं।
  ro.a1.unit11.lesson02.teach.mergem_parc_sambata_phrase:
    title: क्या हम शनिवार को पार्क चलें?
    gloss: Mergem la parc sâmbătă? (क्या हम शनिवार को पार्क चलें?)
    note: पिछले पाठ का निमंत्रण, अब दिन के साथ -- *Mergem la parc?* में दिन का नाम जुड़ गया है।
  ro.a1.unit11.lesson02.teach.nu_pot_sambata_phrase:
    title: शनिवार को नहीं आ सकता/सकती
    gloss: Nu pot sâmbătă. (शनिवार को नहीं आ सकता/सकती।)
    note: सीधा इनकार -- *nu pot* और जिस दिन के लिए मना कर रहे हैं, वह दिन।
  ro.a1.unit11.lesson02.teach.atunci_vocab:
    title: तब / तो फिर
    gloss: Atunci (तब / तो फिर)
    note: यह *apoi* से अलग है (यूनिट 9 का 'फिर', जो दो क्रियाओं का क्रम बताता है) -- *atunci* विकल्प सुझाता है या नतीजा निकालता है; समय बदलते समय 'तो फिर... कैसा रहेगा?' कहने का स्वाभाविक शब्द है।
    example_gloss:
    - तो फिर, रविवार?
  ro.a1.unit11.lesson02.teach.atunci_duminica_phrase:
    title: तो फिर, रविवार?
    gloss: Atunci, duminică? (तो फिर, रविवार?)
    note: मना होने के बाद छोटा-सा नया सुझाव -- नया दिन बताना काफ़ी है, पूरा निमंत्रण दोहराने की ज़रूरत नहीं।
  ro.a1.unit11.lesson02.teach.da_bine_duminica_phrase:
    title: हाँ, ठीक है! रविवार।
    gloss: Da, bine! Duminică. (हाँ, ठीक है! रविवार।)
    note: बदला हुआ दिन स्वीकार करना, उसी छोटे ढाँचे में जो पिछले पाठ के *Da, bine!* में था।
  ro.a1.unit11.lesson03.teach.reminder_la_ce_ora_la_ora_patru:
    title: 'दोहराव: la ce oră, la ora, patru'
    gloss: la ce oră (किस समय) · la ora (... बजे) · patru (चार)
    note: La ce oră/la ora यूनिट 4 (समय पूछना और बताना) में आ चुके हैं; patru यूनिट 2 की संख्याओं में आ चुका है -- यहाँ ये मिलकर इस यूनिट में मिलने का समय तय करते हैं।
  ro.a1.unit11.lesson03.teach.reminder_buna_multumesc_la_revedere_da_ana_mihai:
    title: 'दोहराव: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (नमस्ते) · mulțumesc (धन्यवाद) · la revedere (अलविदा) · da (हाँ) · Ana, Mihai (नाम)
    note: ये सब पिछली यूनिटों में आ चुके हैं -- यहाँ आना और मिहाई अपनी योजना का समय तय करते हैं।
  ro.a1.unit11.lesson03.teach.sigur_vocab:
    title: ज़रूर
    gloss: Sigur (ज़रूर)
    note: योजना पक्की करने का आम, अकेला शब्द -- हिंदी के 'ज़रूर!' या 'बिल्कुल!' जैसा।
    example_gloss:
    - ज़रूर! चार बजे।
  ro.a1.unit11.lesson03.teach.sigur_phrase:
    title: ज़रूर! चार बजे।
    gloss: Sigur! La ora patru. (ज़रूर! चार बजे।)
    note: एक छोटे उत्तर में योजना और सटीक समय, दोनों की पुष्टि।
  ro.a1.unit11.lesson03.teach.line01:
    title: अभिवादन और पार्क का प्रस्ताव
    gloss: आना मिहाई को नमस्ते कहती है और पूछती है कि क्या वे रविवार को पार्क चलें।
    note: इस यूनिट के *Mergem la parc?* निमंत्रण को *duminică* के साथ जोड़ता है।
  ro.a1.unit11.lesson03.teach.line02:
    title: हामी भरना और समय पूछना
    gloss: मिहाई हामी भरता है और समय पूछता है।
    note: यूनिट 4 का *La ce oră?* प्रश्न फिर से इस्तेमाल हुआ है।
  ro.a1.unit11.lesson03.teach.line03:
    title: समय सुझाइए
    gloss: आना चार बजे का सुझाव देती है।
    note: एक छोटा प्रश्न, जिसमें यूनिट 4 का *la ora* ढाँचा इस यूनिट के *patru* के साथ आया है।
  ro.a1.unit11.lesson03.teach.line04:
    title: पुष्टि और धन्यवाद
    gloss: मिहाई 'ज़रूर!' कहकर पुष्टि करता है और आना को धन्यवाद देता है।
    note: इस यूनिट के *sigur* को पहले से जाने हुए *mulțumesc* के साथ जोड़ता है।
  ro.a1.unit11.lesson03.teach.line05:
    title: अलविदा कहिए
    gloss: आना अलविदा कहती है।
    note: समापन का वही ढंग जिस पर पिछली हर यूनिट का संवाद खत्म हुआ है।
  ro.a1.unit11.lesson03.teach.line06:
    title: मुलाक़ात का समापन
    gloss: मिहाई भी आना का नाम लेकर अलविदा कहता है।
    note: वही दोस्ताना समापन, जिस पर पिछली हर यूनिट का संवाद खत्म हुआ है।
