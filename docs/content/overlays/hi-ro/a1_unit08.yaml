teaching:
  ro.a1.unit08.lesson01.teach.reminder_unde_este:
    title: 'दोहराव: unde, este'
    gloss: unde (कहाँ) · este (है)
    note: दोनों शब्द पहले आ चुके हैं -- *unde* यूनिट 7 के *Unde pot să cumpăr ...?* में, और *este* यूनिट 3 और 4 से -- यहाँ ये मिलकर इस यूनिट का मुख्य प्रश्न बनाते हैं, जो जगह पूछता है।
  ro.a1.unit08.lesson01.teach.unde_este_phrase:
    title: '...कहाँ है?'
    gloss: Unde este...? (कहाँ है...?)
    note: किसी चीज़ की जगह पूछने का रोज़मर्रा का तरीका -- *este* के बाद जगह का नाम जोड़िए, या संदर्भ से जगह साफ़ हो तो इसे अकेले भी बोल सकते हैं।
  ro.a1.unit08.lesson01.teach.gara_magazin_banca:
    title: रेलवे स्टेशन, दुकान, बैंक
    gloss: gară (रेलवे स्टेशन) · magazin (दुकान) · bancă (बैंक)
    note: 'तीन आम जगहें -- किसी खास, जानी-पहचानी जगह की बात करते समय इन तीनों में निश्चित उपपद जुड़ता है: *gara*, *magazinul*, *banca*।'
    example_gloss:
    - रेलवे स्टेशन कहाँ है?
    - दुकान पास है।
    - बैंक दूर है।
  ro.a1.unit08.lesson01.teach.aproape_departe:
    title: पास, दूर
    gloss: aproape (पास / नज़दीक) · departe (दूर)
    note: सही रास्ता बताए बिना यह कहने का सरल तरीका कि कोई जगह कितनी पास या दूर है।
    example_gloss:
    - दुकान पास है।
    - बैंक दूर है।
  ro.a1.unit08.lesson01.teach.magazinul_aproape:
    title: दुकान पास है
    gloss: Magazinul este aproape. (दुकान पास है।)
    note: एक छोटा, पूरा वाक्य -- जब साफ़ हो कि कौन-सी जगह की बात है, तो *aproape* के बाद जगह का नाम लगाने की ज़रूरत नहीं।
  ro.a1.unit08.lesson01.teach.banca_departe:
    title: बैंक दूर है
    gloss: Banca este departe. (बैंक दूर है।)
    note: '*aproape* का उलटा -- वही सरल ढाँचा।'
  ro.a1.unit08.lesson01.teach.unde_este_gara:
    title: रेलवे स्टेशन कहाँ है?
    gloss: Unde este gara? (रेलवे स्टेशन कहाँ है?)
    note: '*Unde este...?* और *gara* को एक पूरे प्रश्न में जोड़ता है।'
  ro.a1.unit08.lesson02.teach.spital_posta_biblioteca_statie:
    title: अस्पताल, डाकघर, पुस्तकालय, बस स्टॉप
    gloss: spital (अस्पताल) · poștă (डाकघर) · bibliotecă (पुस्तकालय) · stație de autobuz (बस स्टॉप)
    note: 'चार और आम जगहें -- gară/magazin/bancă की तरह, किसी खास जगह के लिए इनमें निश्चित उपपद जुड़ता है: *spitalul*, *poșta*, *biblioteca*, *stația de autobuz*।'
    example_gloss:
    - अस्पताल दुकान के सामने है।
    - डाकघर दुकान और अस्पताल के बीच में है।
    - पुस्तकालय रेलवे स्टेशन के पास है।
    - बस स्टॉप पुस्तकालय के बगल में है।
  ro.a1.unit08.lesson02.teach.langa_vizavi_intre:
    title: बगल में, सामने, बीच में
    gloss: lângă (बगल में) · vizavi de (सामने) · între (बीच में)
    note: किसी जगह को दूसरी जगह के सापेक्ष बताने के तीन तरीके। *Vizavi de* में *de* और *între* के साथ *și* दूसरी जगह को जोड़ते हैं; *lângă* सीधे जुड़ जाता है।
    example_gloss:
    - दुकान रेलवे स्टेशन के बगल में है।
    - अस्पताल दुकान के सामने है।
    - डाकघर दुकान और अस्पताल के बीच में है।
  ro.a1.unit08.lesson02.teach.magazinul_langa_gara:
    title: दुकान रेलवे स्टेशन के बगल में है
    gloss: Magazinul este lângă gară. (दुकान रेलवे स्टेशन के बगल में है।)
    note: '*Lângă* सीधे जगह के नाम से जुड़ता है, किसी अतिरिक्त शब्द की ज़रूरत नहीं।'
  ro.a1.unit08.lesson02.teach.spitalul_vizavi_magazin:
    title: अस्पताल दुकान के सामने है
    gloss: Spitalul este vizavi de magazin. (अस्पताल दुकान के सामने है।)
    note: '*Vizavi de* में दूसरी जगह से पहले *de* आता है।'
  ro.a1.unit08.lesson02.teach.posta_intre:
    title: डाकघर दुकान और अस्पताल के बीच में है
    gloss: Poșta este între magazin și spital. (डाकघर दुकान और अस्पताल के बीच में है।)
    note: '*Între* दो जगहों के नाम लेता है, जिन्हें *și* (और) जोड़ता है।'
  ro.a1.unit08.lesson02.teach.statia_langa_biblioteca:
    title: बस स्टॉप पुस्तकालय के बगल में है
    gloss: Stația de autobuz este lângă bibliotecă. (बस स्टॉप पुस्तकालय के बगल में है।)
    note: दुकान और रेलवे स्टेशन वाला ही *lângă* का ढाँचा, अब बस स्टॉप और पुस्तकालय के साथ।
  ro.a1.unit08.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'दोहराव: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (नमस्ते) · mulțumesc (धन्यवाद) · la revedere (अलविदा) · da (हाँ) · Ana, Mihai (नाम)
    note: ये सब पिछली यूनिटों में आ चुके हैं -- यहाँ Ana और Mihai फिर मिलते हैं, इस बार अपने मोहल्ले में।
  ro.a1.unit08.lesson03.teach.line01:
    title: अभिवादन करें और पूछें कि डाकघर कहाँ है
    gloss: Ana, Mihai को नमस्ते कहती है और पूछती है कि डाकघर कहाँ है।
    note: इस यूनिट के *Unde este* को यूनिट 1 के अभिवादन के साथ जोड़ता है।
  ro.a1.unit08.lesson03.teach.line02:
    title: जगह बताना
    gloss: Mihai बताता है कि डाकघर दुकान और अस्पताल के बीच में है।
    note: इसी यूनिट के *poșta* और *între ... și* ढाँचे का फिर प्रयोग।
  ro.a1.unit08.lesson03.teach.line03:
    title: पुस्तकालय के बारे में पूछें
    gloss: Ana पूछती है कि क्या पुस्तकालय पास है।
    note: एक छोटा अगला प्रश्न, जिसमें *este* और *aproape* फिर आते हैं।
  ro.a1.unit08.lesson03.teach.line04:
    title: पुष्टि करें और कुछ और जोड़ें
    gloss: Mihai पुष्टि करता है कि पुस्तकालय रेलवे स्टेशन के पास है और जोड़ता है कि बस स्टॉप पुस्तकालय के बगल में है।
    note: एक ही पंक्ति में *aproape de* और *lângă* को जोड़ता है -- दोनों इसी यूनिट के पदबंध हैं।
  ro.a1.unit08.lesson03.teach.line05:
    title: धन्यवाद कहें और विदा लें
    gloss: Ana, Mihai को धन्यवाद देती है और अलविदा कहती है।
    note: यहाँ *Mulțumesc* विदा के समय सरल धन्यवाद है, वही शब्द जो यूनिट 1 के *Bine, mulțumesc.* में था।
  ro.a1.unit08.lesson03.teach.line06:
    title: मुलाकात का अंत करें
    gloss: Mihai भी अलविदा कहता है और Ana का नाम लेता है।
    note: वही दोस्ताना समापन, जिस पर यूनिट 1, 5, 6 और 7 के संवाद भी खत्म हुए थे।
