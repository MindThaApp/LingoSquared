    feedback: Salut और tu मिलकर एक सुसंगत अनौपचारिक जोड़ी बनाते हैं।
  ro.a1.unit01.lesson01.exercise04.order_polite_question:
    instruction: हालचाल पूछने वाले शिष्ट प्रश्न को सही क्रम में लगाइए।
    correct_response:
    - Ce
    - mai
    - faceți
  ro.a1.unit01.lesson01.exercise06.match_register:
