    correct_option: आपसे मिलकर खुशी हुई!
    distractors:
    - अलविदा!
    - आप कैसे हैं?
    accepted_answers:
    - आपसे मिलकर खुशी हुई!
  ro.a1.unit01.lesson02.exercise01.order_self_intro:
    instruction: Ana का अपना परिचय बनाइए।
    correct_response:
    - Mă
    - numesc
    - Ana
  ro.a1.unit01.lesson02.exercise07.match_introductions:
    instruction: नाम पूछने वाले हर प्रश्न को उसके सही उत्तर से मिलाइए।
    correct_response:
      Cum vă numiți?: Mă numesc Ana.
      Cum te cheamă?: Mă cheamă Mihai.
    pairs:
    - left: Cum vă numiți?
      right: Mă numesc Ana.
    - left: Cum te cheamă?
      right: Mă cheamă Mihai.
  ro.a1.unit01.lesson02.exercise03.informal_name_question:
    instruction: अनौपचारिक अभिवादन के बाद सामने वाले का नाम पूछिए।
    accepted_answers:
    - Cum te cheamă?
    - Cum te cheama?
  ro.a1.unit01.lesson02.exercise04.complete_ma_cheama:
    instruction: Mihai का नाम बताने वाला वाक्यांश पूरा कीजिए।
    accepted_answers:
    - Mă
  ro.a1.unit01.lesson02.exercise06.return_polite_question:
    instruction: शिष्ट रूप बदले बिना वही प्रश्न लौटाइए।
    accepted_answers:
    - Și dumneavoastră?
    - Si dumneavoastra?
  ro.a1.unit01.lesson02.exercise08.write_introduction:
    instruction: 'आप Ana हैं। लिखिए: Bună से अभिवादन कीजिए, mă numesc से अपना नाम बताइए, फिर "आपसे मिलकर खुशी हुई" कहिए।'
    accepted_answers:
