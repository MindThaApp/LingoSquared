      right: dumneavoastră
    - left: Salut
      right: तुम (अनौपचारिक)
  ro.a1.unit01.lesson01.exercise03.choose_polite_pronoun:
    instruction: किसी अपरिचित वयस्क के लिए अभिवादन पूरा कीजिए।
    accepted_answers:
    - dumneavoastră
    feedback: किसी अनजान बड़े व्यक्ति के लिए dumneavoastră आदरपूर्ण और सुरक्षित चुनाव है।
  ro.a1.unit01.lesson01.exercise05.listen_informal_question:
    instruction: जो अनौपचारिक प्रश्न सुनाई दे, उसे लिखिए।
    accepted_answers:
    - Ce mai faci?
    - Ce mai faci
  ro.a1.unit01.lesson01.exercise07.complete_farewell:
    instruction: तटस्थ विदाई पूरी कीजिए।
    accepted_answers:
    - revedere
  ro.a1.unit01.lesson01.exercise08.speak_greeting:
    instruction: शिष्टता से अभिवादन कीजिए, सामने वाले का हालचाल पूछिए और बातचीत समाप्त कीजिए।
    accepted_answers:
    - Bună ziua. Ce mai faceți? La revedere.
    - Bună ziua, ce mai faceți? La revedere.
  ro.a1.unit01.lesson02.exercise02.listen_name_question:
    instruction: सुनिए और नाम पूछने वाला शिष्ट प्रश्न चुनिए।
    correct_option: Cum vă numiți?
    distractors:
    - Cum te cheamă?
    - Ce mai faceți?
    accepted_answers:
