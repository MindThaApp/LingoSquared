teaching:
  ro.a1.unit01.lesson01.teach.buna:
    title: रोज़मर्रा का अभिवादन
    gloss: नमस्ते; हैलो
    note: Bună रोज़मर्रा का, थोड़ा अनौपचारिक अभिवादन है। दोस्तों, हमउम्र लोगों और दिन के ज़्यादातर सामान्य मेल-मिलापों में इसे बेझिझक बोला जा सकता है।
    example_gloss: हैलो, Mihai!
  ro.a1.unit01.lesson01.teach.salut:
    title: अनौपचारिक अभिवादन
    gloss: हाय; बाय
    note: Salut अनौपचारिक है और दोस्तों व हमउम्र लोगों के बीच बोला जाता है। इसे बातचीत की शुरुआत और अंत, दोनों में बोला जा सकता है, पर किसी अनजान बड़े व्यक्ति के लिए यह सबसे सुरक्षित चुनाव नहीं है।
    example_gloss: हैलो, Ana!
  ro.a1.unit01.lesson01.teach.buna_ziua:
    title: औपचारिक अभिवादन
    gloss: नमस्कार (औपचारिक)
    note: Bună ziua किसी अनजान बड़े व्यक्ति, दुकानदार या जिसे आप dumneavoastră कहकर संबोधित करें, उसके लिए सुरक्षित और शिष्ट अभिवादन है। शब्दशः इसका अर्थ "शुभ दिन" है, पर इसे केवल दोपहर में नहीं, बल्कि सामान्य शिष्ट अभिवादन के रूप में बोला जाता है।
    example_gloss: नमस्कार, Ana!
  ro.a1.unit01.lesson01.teach.la_revedere:
    title: सामान्य विदाई
    gloss: अलविदा
    note: La revedere औपचारिक और अनौपचारिक, दोनों स्थितियों में चलता है।
    example_gloss: नमस्कार! अलविदा!
  ro.a1.unit01.lesson01.teach.tu:
    title: अनौपचारिक एकवचन "तुम"
    gloss: तुम (अनौपचारिक, एकवचन)
    note: Romanian का tu किसी एक दोस्त, बच्चे या ऐसे व्यक्ति के लिए है जिससे आपका रिश्ता साफ़ तौर पर अनौपचारिक हो। हिंदी के "तुम" की तरह इसके क्रियारूप भी अलग होते हैं (faci, faceți नहीं)।
  ro.a1.unit01.lesson01.teach.dumneavoastra:
    title: सम्मानसूचक या बहुवचन "आप"
    gloss: आप (सम्मानसूचक एकवचन या बहुवचन)
    note: किसी एक अनजान बड़े व्यक्ति के लिए dumneavoastră सुरक्षित चुनाव है, और यह आदर से संबोधित किए गए समूह के लिए भी चलता है। हिंदी के "आप" की तरह इसकी भूमिका है। यह domnia voastră ("आपका बड़प्पन") से बना है और इसके साथ बहुवचन क्रियारूप आते हैं (faceți, numiți), भले ही व्यक्ति एक ही हो, जैसे हिंदी में "आप करते हैं"।
  ro.a1.unit01.lesson01.teach.ce_mai_faceti:
    title: औपचारिक हालचाल पूछना
    gloss: आप कैसे हैं?
    note: Faceți, a face (करना/बनाना) का dumneavoastră वाला रूप है। यह एक प्रचलित शिष्ट प्रश्न है, इसका अर्थ यह पूछना नहीं कि कोई अभी क्या कर रहा है।
  ro.a1.unit01.lesson01.teach.ce_mai_faci:
    title: अनौपचारिक हालचाल पूछना
    gloss: आप कैसे हैं?
    note: Faci, a face का tu वाला रूप है। इस प्रश्न के शिष्ट और अनौपचारिक रूपों में केवल क्रिया का अंत बदलता है; ce mai दोनों में वही रहता है।
  ro.a1.unit01.lesson01.teach.bine_multumesc:
    title: सामान्य सकारात्मक उत्तर
    gloss: ठीक हूँ, धन्यवाद।
    note: Bine, mulțumesc, ce mai faci/faceți का उत्तर है, चाहे संबोधन का रूप कोई भी हो; उत्तर नहीं बदलता।
    example_gloss: आप कैसे हैं? ठीक हूँ, धन्यवाद।
  ro.a1.unit01.lesson01.teach.register_choice:
    title: अभिवादन और संबंध का मेल
    gloss: आप के साथ औपचारिक अभिवादन; तुम के साथ अनौपचारिक अभिवादन
    note: ये उपयोगी सामान्य नियम हैं, अटल क़ानून नहीं। Bună ziua से कोई औपचारिक बातचीत भी शुरू हो सकती है जो आगे dumneavoastră में चले। Salut के साथ dumneavoastră मिलाने से आमतौर पर सामाजिक संकेत आपस में टकराते हैं।
  ro.a1.unit01.lesson02.teach.ma_numesc:
    title: अपना नाम बताइए (मानक)
    gloss: मेरा नाम Ana है।
    note: Mă numesc का शब्दशः अर्थ है "मैं स्वयं को नाम देता/देती हूँ"। यह नाम बताने का तटस्थ तरीक़ा है जो हर जगह चलता है, और "मेरा नाम ... है" जैसा ही सामान्य स्तर का है।
    example_gloss: नमस्ते! मेरा नाम Ana है।
  ro.a1.unit01.lesson02.teach.cum_va_numiti:
    title: शिष्टता से नाम पूछना
    gloss: आपका नाम क्या है?
    note: Numiți, a se numi (नाम होना) का dumneavoastră वाला रूप है। Vă, dumneavoastră से मेल खाने वाला स्ववाचक सर्वनाम है, और यहाँ इसका होना ज़रूरी है।
  ro.a1.unit01.lesson02.teach.ma_cheama:
    title: अपना नाम बताइए (बोलचाल)
    gloss: मुझे Mihai कहते हैं।
    note: Mă cheamă नाम बताने का अधिक बोलचाल वाला तरीक़ा है, शब्दशः "वह मुझे बुलाता है"। Mă numesc और mă cheamă दोनों सही और प्रचलित हैं; mă cheamă थोड़ा ज़्यादा अनौपचारिक है।
    example_gloss: नमस्ते! मुझे Mihai कहते हैं।
  ro.a1.unit01.lesson02.teach.cum_te_cheama:
    title: अनौपचारिक रूप से नाम पूछना
    gloss: तुम्हारा नाम क्या है?
    note: Te, tu से मेल खाने वाला स्ववाचक सर्वनाम है। दोस्त और हमउम्र लोग एक-दूसरे का नाम इसी रोज़मर्रा के तरीक़े से पूछते हैं।
  ro.a1.unit01.lesson02.teach.imi_pare_bine:
    title: किसी से मिलना
    gloss: आपसे मिलकर खुशी हुई!
    note: Îmi pare bine का शब्दशः अर्थ है "मुझे अच्छा लगता है"। यह एक मुहावरेदार स्थिर अभिव्यक्ति है, किसी शब्द-दर-शब्द अनुवाद से नहीं बनती। बोलने वाले के लिंग के अनुसार इसका रूप नहीं बदलता।
    example_gloss: मुझे Mihai कहते हैं। आपसे मिलकर खुशी हुई!
  ro.a1.unit01.lesson02.teach.si_mie_imi_pare_bine:
    title: वही भाव लौटाना
    gloss: आपसे मिलकर मुझे भी खुशी हुई!
    note: Și mie उसी स्थिर अभिव्यक्ति के आगे "भी" का भाव जोड़ता है, जिससे बातचीत शुरू हुई थी।
  ro.a1.unit01.lesson02.teach.si_dumneavoastra:
    title: शिष्टता से प्रश्न लौटाना
    gloss: और आप?
    note: शिष्टता बनाए रखने के लिए या किसी समूह को संबोधित करने के लिए dumneavoastră का प्रयोग कीजिए।
  ro.a1.unit01.lesson02.teach.si_tu:
    title: अनौपचारिक रूप से प्रश्न लौटाना
    gloss: और आप?
    note: किसी एक दोस्त या हमउम्र से अनौपचारिक बात करते समय și के बाद tu का प्रयोग कीजिए।
  ro.a1.unit01.lesson03.teach.line01:
    title: मुलाक़ात की शुरुआत
    gloss: Ana औपचारिक ढंग से Mihai का अभिवादन करती है और अपना नाम बताती है।
    note: Ana शिष्ट bună ziua से शुरुआत करती है, जो किसी अनजान व्यक्ति से मिलते समय उचित है।
  ro.a1.unit01.lesson03.teach.line02:
    title: मुलाक़ात की शुरुआत, उत्तर
    gloss: Mihai भी वैसी ही खुशी जताता है, अपना नाम बताता है और पूछता है कि वह कैसी है।
    note: 'Mihai वही शिष्ट रूप बनाए रखता है जिससे Ana ने शुरुआत की थी: वह ce mai faceți पूछता है, ce mai faci नहीं।'
  ro.a1.unit01.lesson03.teach.line03:
    title: उत्तर दीजिए और प्रश्न लौटाइए
    gloss: Ana कहती है कि वह ठीक है और शिष्टता से Mihai से वही प्रश्न पूछती है।
    note: Și dumneavoastră बातचीत को औपचारिक बनाए रखता है, जैसे उसकी शुरुआत हुई थी।
  ro.a1.unit01.lesson03.teach.line04:
    title: उत्तर दीजिए और बात समाप्त कीजिए
    gloss: Mihai कहता है कि वह भी ठीक है और अलविदा कहता है।
    note: La revedere तटस्थ विदाई है, जो बातचीत औपचारिक रही हो या अनौपचारिक, दोनों में ठीक बैठती है।
  ro.a1.unit01.lesson03.teach.line05:
    title: मुलाकात का समापन कीजिए
    gloss: Ana वही विदाई दोहराती है।
    note: La revedere को लौटाकर कहना मित्रतापूर्ण समापन की पुष्टि करने का स्वाभाविक तरीक़ा है।
exercises:
  ro.a1.unit01.lesson01.exercise01.listen_buna:
    instruction: सुनिए और जो वाक्यांश आप सुनते हैं, उसे चुनिए।
    correct_option: Bună!
    distractors:
    - Salut!
    - La revedere!
