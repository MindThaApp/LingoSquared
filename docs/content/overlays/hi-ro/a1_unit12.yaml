teaching:
  ro.a1.unit12.lesson01.teach.reminder_parc_cinema:
    title: 'दोहराव: parc, cinema'
    gloss: parc (पार्क) · cinema (सिनेमा)
    note: दोनों शब्द यूनिट 11 में आ चुके हैं -- यहाँ ये इस यूनिट के नए भूतकाल के साथ जुड़ते हैं।
  ro.a1.unit12.lesson01.teach.reminder_astazi_maine_duminica_sambata:
    title: 'दोहराव: astăzi, mâine, duminică, sâmbătă'
    gloss: astăzi (आज) · mâine (कल, आने वाला) · duminică (रविवार) · sâmbătă (शनिवार)
    note: सभी यूनिट 3 और यूनिट 11 में आ चुके हैं -- यहाँ ये इस पाठ के नए शब्द *ieri* (बीता हुआ कल) से तुलना की ज़मीन तैयार करते हैं।
  ro.a1.unit12.lesson01.teach.am_fost_vocab:
    title: मैं था / मैं गया
    gloss: Am fost (मैं था / मैं गया)
    note: '*a fi* (होना) का *perfect compus* रूप, यानी भूतकाल -- *am* ''मैं'' और ''हम'' दोनों के लिए एक ही रहने वाला सहायक शब्द है, और *fost* भूतकाल का स्थिर रूप है। जगह के साथ *am fost la...* ''मैं ... गया'' कहने का रोज़मर्रा का स्वाभाविक तरीका है -- बोलचाल में ''चलकर गया'' जैसी क्रिया से कहीं ज़्यादा प्रचलित।'
    example_gloss:
    - मैं पार्क गया था।
  ro.a1.unit12.lesson01.teach.am_fost_parc_phrase:
    title: मैं पार्क गया
    gloss: Am fost la parc. (मैं पार्क गया था।)
    note: 'पूरा ढाँचा: am fost + la + जगह।'
  ro.a1.unit12.lesson01.teach.am_fost_cinema_phrase:
    title: मैं सिनेमा गया
    gloss: Am fost la cinema. (मैं सिनेमा गया था।)
    note: वही ढाँचा जो *Am fost la parc* में है, बस जगह अलग है।
  ro.a1.unit12.lesson01.teach.ieri_vocab:
    title: कल (बीता हुआ)
    gloss: Ieri (बीता हुआ कल)
    note: यूनिट 3 में *astăzi* (आज) और *mâine* (आने वाले कल) के साथ आ चुका है -- अब भूतकाल के साथ प्रयोग हो रहा है, और यह वाक्य की शुरुआत में रखकर बताता है कि बात कब हुई।
    example_gloss:
    - कल मैं पार्क गया था।
  ro.a1.unit12.lesson01.teach.ieri_am_fost_parc_phrase:
    title: कल मैं पार्क गया था
    gloss: Ieri am fost la parc. (कल मैं पार्क गया था।)
    note: '*Am fost la parc* के आगे *ieri* जोड़ने से ठीक-ठीक समय पता चल जाता है।'
  ro.a1.unit12.lesson02.teach.reminder_mananc_beau:
    title: 'दोहराव: mănânc, beau'
    gloss: mănânc (मैं खाता/खाती हूँ) · beau (मैं पीता/पीती हूँ)
    note: दोनों यूनिट 10 की दिनचर्या में आ चुके हैं -- यह पाठ इन्हें भूतकाल के रूपों में बदलता है।
  ro.a1.unit12.lesson02.teach.reminder_paine_cafea_ceai_si:
    title: 'दोहराव: pâine, cafea, ceai, și'
    gloss: pâine (रोटी) · cafea (कॉफ़ी) · ceai (चाय) · și (और)
    note: सभी यूनिट 6 और यूनिट 10 में आ चुके हैं -- यहाँ ये इस पाठ के अपने भूतकाल के वाक्यों में दोबारा काम आते हैं।
  ro.a1.unit12.lesson02.teach.am_mancat_vocab:
    title: मैंने खाया
    gloss: Am mâncat (मैंने खाया)
    note: '*a mânca* (खाना) का *perfect compus* रूप, यानी भूतकाल; यही क्रिया यूनिट 10 में *mănânc* (मैं खाता/खाती हूँ) के रूप में आई थी। Am + mâncat, ठीक *am fost* जैसा ढाँचा।'
    example_gloss:
    - मैंने रोटी खाई।
  ro.a1.unit12.lesson02.teach.am_mancat_paine_phrase:
    title: मैंने रोटी खाई
    gloss: Am mâncat pâine. (मैंने रोटी खाई।)
    note: 'पूरा ढाँचा: am mâncat + खाने की चीज़।'
  ro.a1.unit12.lesson02.teach.am_baut_vocab:
    title: मैंने पिया
    gloss: Am băut (मैंने पिया)
    note: '*a bea* (पीना) का *perfect compus* रूप, यानी भूतकाल; यही क्रिया यूनिट 10 में *beau* (मैं पीता/पीती हूँ) के रूप में आई थी।'
    example_gloss:
    - मैंने चाय पी।
  ro.a1.unit12.lesson02.teach.am_baut_ceai_phrase:
    title: मैंने चाय पी
    gloss: Am băut ceai. (मैंने चाय पी।)
    note: 'पूरा ढाँचा: am băut + पीने की चीज़।'
  ro.a1.unit12.lesson02.teach.am_mancat_am_baut_phrase:
    title: मैंने रोटी खाई और चाय पी
    gloss: Am mâncat pâine și am băut ceai. (मैंने रोटी खाई और चाय पी।)
    note: भूतकाल की दो क्रियाएँ *și* से जुड़ी हैं -- यही जोड़ने वाला शब्द है जो यूनिट 10 में वर्तमान की दिनचर्या के लिए भी आया था।
  ro.a1.unit12.lesson03.teach.reminder_am_fost_ieri_parc_cinema:
    title: 'दोहराव: am fost, ieri, parc, cinema'
    gloss: am fost (मैं था / मैं गया) · ieri (बीता हुआ कल) · parc (पार्क) · cinema (सिनेमा)
    note: सभी इसी यूनिट के पहले पाठ से हैं -- यहाँ ये रविवार का हाल सुनाने की तैयारी करते हैं।
  ro.a1.unit12.lesson03.teach.reminder_am_mancat_am_baut:
    title: 'दोहराव: am mâncat, am băut, pâine, cafea, ceai'
    gloss: am mâncat (मैंने खाया) · am băut (मैंने पिया) · pâine (रोटी) · cafea (कॉफ़ी) · ceai (चाय)
    note: सभी इसी यूनिट के दूसरे पाठ से हैं -- यहाँ Ana और Mihai बताते हैं कि दोनों ने क्या लिया।
  ro.a1.unit12.lesson03.teach.reminder_cum_duminica_bine:
    title: 'दोहराव: cum, duminică, bine, mulțumesc, la revedere, Ana, Mihai'
    gloss: cum (कैसे, यूनिट 1/यूनिट 9) · duminică (रविवार, यूनिट 3) · bine (अच्छा/ठीक, यूनिट 1) · mulțumesc (धन्यवाद) · la revedere (अलविदा) · Ana, Mihai (नाम)
    note: 'सभी पिछली यूनिटों में आ चुके हैं -- *cum* पहले किसी का नाम पूछने (यूनिट 1) और रास्ता पूछने (यूनिट 9) में दिखा था, और यहाँ यह एक अलग तरह का सवाल खोलता है: कोई बात कैसी रही।'
  ro.a1.unit12.lesson03.teach.a_fost_vocab:
    title: वह था / यह था
    gloss: A fost (वह था / यह था)
    note: '*am fost* वाली ही क्रिया का दूसरा रूप -- *a* ''वह/यह'' के लिए सहायक शब्द है, ''मैं/हम'' वाला नहीं। अभी *Cum a fost...?* और *A fost bine!* को तैयार वाक्यांशों की तरह सीखिए, खुद बनाने का ढाँचा न समझिए।'
    example_gloss:
    - अच्छा रहा!
  ro.a1.unit12.lesson03.teach.a_fost_bine_phrase:
    title: अच्छा रहा!
    gloss: A fost bine! (अच्छा रहा!)
    note: यह कहने का छोटा, स्वाभाविक तरीका कि सब अच्छा रहा -- *Cum a fost...?* का उत्तर।
  ro.a1.unit12.lesson03.teach.cum_a_fost_duminica_phrase:
    title: रविवार कैसा रहा?
    gloss: Cum a fost duminică? (रविवार कैसा रहा?)
    note: बीते हुए दिन के बारे में बातचीत शुरू करने का स्वाभाविक तरीका, भले ही सामने वाला भी वहाँ मौजूद रहा हो। इससे आप उन्हें बताने के लिए बुलाते हैं कि दिन कैसा लगा या क्या खास रहा।
  ro.a1.unit12.lesson03.teach.line01:
    title: अभिवादन करें और पूछें कि रविवार कैसा रहा
    gloss: मिहाई आना को नमस्ते कहता है और पूछता है कि रविवार कैसा रहा।
    note: इस यूनिट के *Cum a fost duminică?* को पहले से जाने हुए *Bună* के साथ जोड़ा गया है।
  ro.a1.unit12.lesson03.teach.line02:
    title: जवाब दें और बताएँ कहाँ गए
    gloss: आना कहती है कि अच्छा रहा और वह पार्क गई थी।
    note: '*A fost bine!* को पहले पाठ के अपने वाक्य *Am fost la parc* के साथ जोड़ा गया है।'
  ro.a1.unit12.lesson03.teach.line03:
    title: बताएँ कि उसने क्या खाया और पिया
    gloss: मिहाई कहता है कि उसने ब्रेड खाई और चाय पी।
    note: दूसरे पाठ के *Am mâncat pâine și am băut ceai* को दोहराता है। यह यूनिट 6 में तय मिहाई के क्रम (pâine और ceai) के अनुसार है।
  ro.a1.unit12.lesson03.teach.line04:
    title: बताएँ कि उसने क्या पिया
    gloss: आना कहती है कि उसने कॉफ़ी पी।
    note: यह यूनिट 6 में तय आना के क्रम (cafea) के अनुसार है।
  ro.a1.unit12.lesson03.teach.line05:
    title: धन्यवाद कहें और विदा लें
    gloss: मिहाई आना को धन्यवाद देता है और अलविदा कहता है।
    note: वही समापन-ढंग, जिस पर पिछली हर यूनिट की बातचीत खत्म हुई है।
  ro.a1.unit12.lesson03.teach.line06:
    title: बातचीत समाप्त करें
    gloss: आना भी अलविदा कहती है और मिहाई का नाम लेती है।
    note: वही अपनापन भरा समापन-ढंग, जिस पर पिछली हर यूनिट की बातचीत खत्म हुई है।
