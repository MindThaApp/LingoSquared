      right: रविवार
  ro.a1.unit03.lesson01.exercise04.order_day_question:
    instruction: वह प्रश्न बनाइए जो पूछता है कि आज कौन-सा दिन है।
    correct_response:
    - Ce
    - zi
    - este
    - astăzi
  ro.a1.unit03.lesson01.exercise05.complete_next_day:
    instruction: वाक्य को पूरा कीजिए।
    accepted_answers:
    - vineri
