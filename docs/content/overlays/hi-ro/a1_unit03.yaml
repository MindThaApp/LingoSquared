teaching:
  ro.a1.unit03.lesson01.teach.este:
    title: 'याद रखिए: este'
    gloss: है / यह है
    note: '*Este* इकाई 2 में पहले ही आ चुका है (*Care este numărul...?*)। यह कभी नहीं बदलता -- कर्ता दिन हो, तारीख़ हो या कुछ और, शब्द वही रहता है, और tu व dumneavoastră के बीच भी नहीं बदलता।'
  ro.a1.unit03.lesson01.teach.astazi_maine:
    title: आज, कल
    gloss: आज / कल (आने वाला दिन)
    note: ये दोनों समय के शब्द हैं जो कभी नहीं बदलते और उस वाक्य की शुरुआत में आते हैं जिसमें बताया जाता है कि कौन-सा दिन या तारीख़ है।
    example_gloss:
    - आज सोमवार है।
    - कल मंगलवार है।
  ro.a1.unit03.lesson01.teach.luni_marti:
    title: सोमवार, मंगलवार
    gloss: सोमवार / मंगलवार
    note: किसी दिन का नाम बताने के लिए (Astăzi este luni) यहाँ दिया गया सादा रूप इस्तेमाल कीजिए। दिनों के नामों के उपपद वाले रूप भी होते हैं -- lunea, marțea -- जिनका अर्थ है 'हर सोमवार', 'हर मंगलवार'; इन्हें आप आगे सीखेंगे।
    example_gloss:
    - आज सोमवार है।
    - कल मंगलवार है।
  ro.a1.unit03.lesson01.teach.miercuri_joi:
    title: बुधवार, गुरुवार
    gloss: बुधवार / गुरुवार
    note: luni और marți की तरह miercuri और joi भी एकवचन और बहुवचन में एक ही रूप में रहते हैं।
    example_gloss:
    - आज बुधवार है।
    - कल गुरुवार है।
  ro.a1.unit03.lesson01.teach.vineri_sambata:
    title: शुक्रवार, शनिवार
    gloss: शुक्रवार / शनिवार
    note: आधुनिक वर्तनी में Sâmbătă के बीच में â रहता है, पुरानी वर्तनी sîmbătă की तरह î नहीं।
    example_gloss:
    - आज शुक्रवार है।
    - कल शनिवार है।
  ro.a1.unit03.lesson01.teach.duminica:
    title: रविवार
    gloss: रविवार
    note: Duminică से सप्ताह पूरा होता है। कौन-सा दिन है, यह बताने के लिए यही सादा रूप इस्तेमाल कीजिए; उपपद वाले रूप duminica का अर्थ है 'हर रविवार'।
    example_gloss: आज रविवार है।
  ro.a1.unit03.lesson01.teach.ce_zi_e_azi:
    title: पूछिए कि आज कौन-सा दिन है
    gloss: आज कौन-सा दिन है?
    note: सप्ताह का कौन-सा दिन है, यह पूछने का रोज़मर्रा का तरीका -- zi (दिन) यहाँ नया शब्द है, और ce, este व astăzi आप पहले से जानते हैं।
  ro.a1.unit03.lesson01.teach.saptamana_ieri:
    title: सप्ताह, बीता कल, पिछला/अगला सप्ताह
    gloss: săptămână (सप्ताह) / ieri (बीता कल) / săptămâna trecută (पिछला सप्ताह) / săptămâna viitoare (अगला सप्ताह)
    note: अतिरिक्त शब्दावली -- तारीख़ों को आज के सापेक्ष बताने में काम आती है; इस इकाई के अभ्यासों में इन्हें सप्ताह के दिनों जितना नहीं दोहराया गया है।
  ro.a1.unit03.lesson01.teach.lowercase_zile:
    title: दिनों के नाम छोटे अक्षर से लिखे जाते हैं
    gloss: 'दिनों के नाम बड़े अक्षर से नहीं लिखे जाते: सोमवार, शुक्रवार।'
    note: देवनागरी में बड़े-छोटे अक्षर नहीं होते, पर रोमानियाई में वाक्य के बीच दिनों के नाम बड़े अक्षर से नहीं लिखे जाते -- *luni*, *Luni* नहीं -- सिवाय तब, जब वह शब्द ही वाक्य की शुरुआत में हो।
  ro.a1.unit03.lesson02.teach.ian_feb_mar:
    title: जनवरी, फ़रवरी, मार्च
    gloss: जनवरी / फ़रवरी / मार्च
    note: दिनों के नामों से अलग, कई महीनों के नाम हिंदी के जनवरी, फ़रवरी, मार्च जैसे नामों से मिलते-जुलते होने के कारण आसानी से पहचाने जाते हैं।
    example_gloss:
    - जनवरी है।
    - फ़रवरी का महीना है।
    - मार्च का महीना है।
  ro.a1.unit03.lesson02.teach.apr_mai_iun:
    title: अप्रैल, मई, जून
    gloss: अप्रैल / मई / जून
    note: Mai (मई) छोटा शब्द है, पर यह क्रियाविशेषण mai (और, अधिक) से अलग है, जो इस कोर्स में आगे ce mai faci में आता है। संदर्भ से अर्थ हमेशा साफ़ हो जाता है।
    example_gloss:
    - अप्रैल का महीना है।
    - मई का महीना है।
    - जून का महीना है।
  ro.a1.unit03.lesson02.teach.iul_aug_sep:
    title: जुलाई, अगस्त, सितंबर
    gloss: जुलाई / अगस्त / सितंबर
    note: august का रूप और उच्चारण हिंदी के "अगस्त" से लगभग मिलता है। इस समूह के सबसे आसान मिलते-जुलते शब्दों में से एक है।
    example_gloss:
    - जुलाई का महीना है।
    - अगस्त का महीना है।
    - सितंबर का महीना है।
  ro.a1.unit03.lesson02.teach.oct_noi_dec:
    title: अक्टूबर, नवंबर, दिसंबर
    gloss: अक्टूबर / नवंबर / दिसंबर
    note: अंतिम तीन महीने बारह की सूची पूरी करते हैं। ये सभी संज्ञाएँ हैं जिनका रूप नहीं बदलता।
    example_gloss:
    - अक्टूबर का महीना है।
    - नवंबर का महीना है।
    - दिसंबर का महीना है।
  ro.a1.unit03.lesson02.teach.intai:
    title: महीने की पहली तारीख़
    gloss: पहला
    note: 'रोमानियाई की एक खास नियम वाली बात: मानक प्रयोग में महीने के पहले दिन के लिए साधारण संख्या *unu* (एक) नहीं बोली जाती, उसका अपना अलग शब्द है, *întâi*। (बोलचाल में कभी *unu* सुनाई दे सकता है, पर सीखने लायक रूप *întâi* ही है।) दूसरी तारीख़ से आगे हर तारीख़ में सामान्य गिनती वाली संख्या ही आती है।'
    example_gloss: आज अगस्त की पहली तारीख़ है।
  ro.a1.unit03.lesson02.teach.date_rule:
    title: रोमानियाई में तारीख़ कैसे बताते हैं
    gloss: '1 तारीख़: întâi · 2 और आगे: सामान्य संख्या (doi, trei, patru...)'
    note: पहली तारीख़ के बाद रोमानियाई तारीख़ बस सामान्य गिनती वाली संख्या (जो पहले पढ़ी जा चुकी है) और उसके बाद महीने का नाम होती है। न क्रमसूचक रूप चाहिए, न कोई अतिरिक्त शब्द, जैसे *trei aprilie* (अप्रैल की तीन तारीख़, शब्दशः "तीन अप्रैल")।
  ro.a1.unit03.lesson02.teach.ce_data:
    title: तारीख़ पूछना
    gloss: आज की तारीख़ क्या है?
    note: Dată (तारीख़) यहाँ नया शब्द है। बाक़ी प्रश्न में ce, este और astăzi वही हैं जो दिन वाले प्रश्न में थे।
  ro.a1.unit03.lesson02.teach.raspuns_data:
    title: तारीख़ बताना
    gloss: आज तीन अप्रैल है।
    note: Trei (तीन) यूनिट 2 की ही गिनती वाली संख्या है। aprilie से पहले न कोई क्रमसूचक अंत जुड़ता है, न कोई अतिरिक्त शब्द।
  ro.a1.unit03.lesson02.teach.la_multi_ani:
    title: किसी खास दिन पर शुभकामना दें
    gloss: जन्मदिन मुबारक! / नया साल मुबारक!
    note: शब्दशः "(के लिए) कई वर्ष"। जन्मदिन, नेम-डे या नए साल पर दी जाने वाली यह सबसे आम रोमानियाई शुभकामना है। इसमें यूनिट 2 की उम्र वाली सामग्री से *ani* (वर्ष) फिर आया है।
  ro.a1.unit03.lesson02.teach.lowercase_luni:
    title: महीनों के नाम भी छोटे अक्षर से लिखे जाते हैं
    gloss: 'महीनों के नाम बड़े अक्षर से नहीं लिखे जाते: जनवरी, मई।'
    note: यह वही नियम है जो पहले पाठ में सप्ताह के दिनों के लिए था। वाक्य के बीच रोमानियाई महीनों के नाम छोटे अक्षर में ही रहते हैं।
  ro.a1.unit03.lesson03.teach.cand:
    title: कब?
    gloss: कब?
    note: Când समय के बारे में प्रश्न शुरू करता है, ठीक वैसे ही जैसे हिंदी में "कब"।
    example_gloss: बैठक कब है?
  ro.a1.unit03.lesson03.teach.intalnirea:
    title: बैठक
    gloss: बैठक
    note: Întâlnirea निश्चित रूप है (यह बैठक)। बिना निश्चितता वाला रूप întâlnire होगा।
    example_gloss: बैठक सोमवार को है।
  ro.a1.unit03.lesson03.teach.cand_e_intalnirea:
    title: पूछें कि कुछ कब है
    gloss: बैठक कब है?
    note: यह când को पहले से जाने हुए este और इस पाठ के नए शब्द întâlnirea के साथ जोड़ता है।
  ro.a1.unit03.lesson03.teach.raspuns_intalnire:
    title: किसी आयोजन की तारीख़ बताएँ
    gloss: बैठक शुक्रवार, 1 अगस्त को है।
    note: 'हिंदी की तरह ही, वार और तारीख़ को एक साथ अल्पविराम लगाकर कहा जा सकता है: शुक्रवार, 1 अगस्त।'
  ro.a1.unit03.lesson03.teach.fara_de:
    title: दिनों और तारीख़ों में de नहीं लगता
    gloss: 'दिनों और तारीख़ों में ''de'' की ज़रूरत नहीं: vineri, întâi august।'
    note: 'यूनिट 2 के नियम से उपयोगी अंतर: 20 और उससे बड़ी संख्याओं के बाद साधारण संज्ञा से पहले *de* आता है (*treizeci de ani*), पर वार या तारीख़ सीधे जुड़ती है, उनके साथ *de* बिल्कुल नहीं आता।'
  ro.a1.unit03.lesson03.teach.line01:
    title: पूछें कि बैठक कब है
    gloss: आना मिहाई से पूछती है कि उनकी बैठक कब है।
    note: यह सीधा, तटस्थ प्रश्न है। este का रूप tu या dumneavoastră के अनुसार नहीं बदलता।
  ro.a1.unit03.lesson03.teach.line02:
    title: तारीख़ बताना
    gloss: मिहाई कहता है कि बैठक शुक्रवार, 1 अगस्त को है।
    note: 'मिहाई दूसरे पाठ वाला ही तारीख़ का ढाँचा दोहराता है: पहले वार, फिर întâi और महीना, de के बिना।'
  ro.a1.unit03.lesson03.teach.line03:
    title: उत्तर स्वीकार करें और बात समाप्त करें
    gloss: आना उसे धन्यवाद देती है और विदा लेती है।
    note: यूनिट 1 में सीखा गया la revedere बातचीत को उसी तरह समाप्त करता है जैसे हमेशा करता है।
  ro.a1.unit03.lesson03.teach.line04:
    title: मुलाक़ात समाप्त करें
    gloss: मिहाई भी आना का नाम लेकर विदा कहता है।
    note: la revedere के साथ सामने वाले का नाम लेना बातचीत को अपनेपन से समाप्त करने का स्वाभाविक तरीका है।
