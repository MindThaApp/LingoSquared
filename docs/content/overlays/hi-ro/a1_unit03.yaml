course:
  title: हिन्दी में रोमानियाई A1
  description: सप्ताह के दिन, साल के महीने, और रोमानियाई में तारीख़ कैसे बताई जाती है (सामान्य गिनती वाली संख्या के साथ महीना, सिवाय पहली तारीख़ के, जिसके लिए विशेष शब्द întâi आता है) -- आना और मिहाई अपनी अगली मुलाक़ात तय करते हैं।
