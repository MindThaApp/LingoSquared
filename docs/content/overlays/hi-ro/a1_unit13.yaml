    note: ये सब इसी यूनिट के पाठ 2 से हैं। यहाँ Ana और Mihai इन्हें एक साथ इस्तेमाल करते हैं।
  ro.a1.unit13.lesson03.teach.reminder_imi_place_numi_place_cafeaua_ceaiul_painea:
    title: 'याद रखें: Îmi place, Nu-mi place, cafeaua, ceaiul, pâinea'
    gloss: Îmi place (मुझे पसंद है) · Nu-mi place (मुझे पसंद नहीं है) · cafeaua (कॉफ़ी) · ceaiul (चाय) · pâinea (ब्रेड)
    note: ये सब इसी यूनिट के पाठ 1 से हैं। यहाँ Ana और Mihai दोनों बताते हैं कि उन्हें क्या पसंद है और क्या नहीं।
  ro.a1.unit13.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'याद रखें: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (नमस्ते) · mulțumesc (धन्यवाद) · la revedere (अलविदा) · Ana, Mihai (नाम)
    note: ये सब पिछली यूनिटों में आ चुके हैं। इस कोर्स के हर संवाद में शुरुआत और अंत का यही दोस्ताना ढंग रहा है।
  ro.a1.unit13.lesson03.teach.line01:
    title: अभिवादन और कॉफ़ी या चाय के बारे में पूछना
    gloss: Mihai, Ana को नमस्ते कहता है और पूछता है कि उसे कॉफ़ी पसंद है या चाय।
    note: इसमें इसी यूनिट का *Vă place...?* और *sau* मिलकर एक ही प्रश्न में दोनों विकल्प देते हैं।
  ro.a1.unit13.lesson03.teach.line02:
    title: पसंद और नापसंद बताना
    gloss: Ana कहती है कि उसे कॉफ़ी ज़्यादा पसंद है और चाय पसंद नहीं।
    note: इसमें *Prefer* और *Nu-mi place* साथ आते हैं। कॉफ़ी की उसकी पसंद यूनिट 6/यूनिट 12 में तय हुई उसकी पसंद से मेल खाती है।
  ro.a1.unit13.lesson03.teach.line03:
    title: उलटी पसंद बताना
    gloss: Mihai कहता है कि उसे चाय पसंद है और कॉफ़ी पसंद नहीं।
    note: यह यूनिट 6/यूनिट 12 में तय हुई Mihai की पसंद से मेल खाता है (चाय, कभी कॉफ़ी नहीं)।
  ro.a1.unit13.lesson03.teach.line04:
    title: ब्रेड के बारे में भी पूछना
    gloss: Ana पूछती है कि क्या Mihai को ब्रेड भी पसंद है।
    note: यह छोटे अनुवर्ती प्रश्न *Și pâinea?* (और ब्रेड?) से शुरू होता है, फिर *Vă place...?* से नए विषय *pâinea* के बारे में पूरा प्रश्न पूछता है।
  ro.a1.unit13.lesson03.teach.line05:
    title: हामी भरना, धन्यवाद कहना और विदा लेना
    gloss: Mihai हाँ कहता है कि उसे ब्रेड पसंद है, Ana को धन्यवाद देता है और अलविदा कहता है।
    note: यह यूनिट 6 में तय हुई Mihai की पसंद (pâine) से मेल खाता है। पिछली हर यूनिट के संवाद का अंत भी इसी ढंग से हुआ है।
  ro.a1.unit13.lesson03.teach.line06:
    title: बातचीत समाप्त करना
    gloss: Ana भी अलविदा कहती है और Mihai का नाम लेती है।
    note: पिछली हर यूनिट के संवाद का अंत इसी दोस्ताना ढंग से हुआ है।
