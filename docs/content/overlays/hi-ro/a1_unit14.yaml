teaching:
  ro.a1.unit14.lesson01.teach.reminder_mare:
    title: 'याद रखें: mare'
    gloss: mare (बड़ा)
    note: 'यह यूनिट 3 ("literă mare", बड़ा अक्षर) और यूनिट 5 ("o familie mare", बड़ा परिवार) में आ चुका है। यहाँ इसे तुलना का असली साथी मिलता है: *mic/mică*।'
  ro.a1.unit14.lesson01.teach.reminder_cafeaua_ceaiul_painea:
    title: 'याद रखें: cafeaua, ceaiul, pâinea, cafea, ceai'
    gloss: cafeaua (कॉफ़ी) · ceaiul (चाय) · pâinea (ब्रेड) · cafea (कॉफ़ी) · ceai (चाय)
    note: ये सब यूनिट 6/यूनिट 13 से हैं। इस यूनिट में निश्चित रूप वे चीज़ें हैं जिनके आकार की तुलना होती है, और अनिश्चित रूप इसी पाठ के मिलान अभ्यास में फिर आते हैं।
  ro.a1.unit14.lesson01.teach.mic_mica_vocab:
    title: छोटा
    gloss: Mic (छोटा, पु./नपुं.) · Mică (छोटी, स्त्री.)
    note: रोमानियाई विशेषण उस संज्ञा के अनुसार बदलते हैं जिसका वे वर्णन करते हैं। *ceai* (चाय) के साथ पुल्लिंग/नपुंसकलिंग रूप *mic* आता है, जबकि *cafea* (कॉफ़ी) और *pâine* (ब्रेड) स्त्रीलिंग हैं और *mică* लेते हैं। *Mare* (बड़ा) का एकवचन में पुल्लिंग और स्त्रीलिंग के लिए एक ही रूप है, इसलिए इसमें यह भेद कभी नहीं आया।
    example_gloss:
    - चाय छोटी है।
    - कॉफ़ी छोटी है।
  ro.a1.unit14.lesson01.teach.ceaiul_e_mic_phrase:
    title: चाय छोटी है
    gloss: Ceaiul e mic. (चाय छोटी है।)
    note: '*Ceaiul* नपुंसकलिंग है, इसलिए इसके साथ पुल्लिंग/नपुंसकलिंग रूप *mic* आता है।'
  ro.a1.unit14.lesson01.teach.cafeaua_e_mica_phrase:
    title: कॉफ़ी छोटी है
    gloss: Cafeaua e mică. (कॉफ़ी छोटी है।)
    note: '*Cafeaua* स्त्रीलिंग है, इसलिए इसके साथ स्त्रीलिंग रूप *mică* आता है।'
  ro.a1.unit14.lesson01.teach.painea_e_mica_phrase:
    title: ब्रेड छोटी है
    gloss: Pâinea e mică. (ब्रेड छोटी है।)
    note: '*Pâinea* भी स्त्रीलिंग है, इसलिए यह *cafeaua* की तरह ही *mică* लेती है।'
  ro.a1.unit14.lesson02.teach.reminder_mare_mic_mica:
    title: 'दोहराव: Mare, Mic, Mică'
    gloss: Mare (बड़ा) · Mic (छोटा, पुल्लिंग/नपुंसकलिंग) · Mică (छोटी, स्त्रीलिंग)
    note: ये सब इसी यूनिट के पहले पाठ से हैं; यहाँ इनका तुलनात्मक रूप आता है।
  ro.a1.unit14.lesson02.teach.reminder_cafeaua_ceaiul_painea:
    title: 'दोहराव: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (कॉफ़ी) · ceaiul (चाय) · pâinea (ब्रेड)
    note: ये सब यूनिट 13 से हैं; यहाँ इनकी आपस में तुलना की जाती है।
  ro.a1.unit14.lesson02.teach.mai_vocab:
    title: ज़्यादा / -तर
    gloss: Mai (ज़्यादा / -तर, तुलना के लिए)
    note: 'यह महीना *mai* (मई, यूनिट 3) नहीं है। यह वही छोटा शब्द है जो आपने ''Ce mai faceți?'' (यूनिट 1) में देखा था, पर यहाँ यह तुलना बनाने का काम करता है: विशेषण से पहले *mai* रखने पर ''ज़्यादा ___'' या ''___-तर'' का अर्थ बनता है। रोमानियाई में तुलना बनाने का यही सामान्य तरीका है।'
    example_gloss:
    - कॉफ़ी ज़्यादा बड़ी है।
  ro.a1.unit14.lesson02.teach.mai_mare_phrase:
    title: कॉफ़ी ज़्यादा बड़ी है
    gloss: Cafeaua e mai mare. (कॉफ़ी ज़्यादा बड़ी है।)
    note: '*Mai* + विशेषण; इसके अलावा किसी बदलाव की ज़रूरत नहीं।'
  ro.a1.unit14.lesson02.teach.decat_vocab:
    title: से (तुलना में)
    gloss: Decât (से)
    note: 'तुलना को पूरा करता है: *mai* + विशेषण + *decât* + दूसरी वस्तु, जिससे तुलना की जा रही है।'
    example_gloss:
    - कॉफ़ी चाय से बड़ी है।
  ro.a1.unit14.lesson02.teach.mai_mare_decat_phrase:
    title: कॉफ़ी चाय से बड़ी है
    gloss: Cafeaua e mai mare decât ceaiul. (कॉफ़ी चाय से बड़ी है।)
    note: 'तुलना का पूरा ढाँचा: [वस्तु] + e + mai + [विशेषण] + decât + [दूसरी वस्तु]।'
  ro.a1.unit14.lesson02.teach.mai_mica_decat_phrase:
    title: ब्रेड कॉफ़ी से छोटी है
    gloss: Pâinea e mai mică decât cafeaua. (ब्रेड कॉफ़ी से छोटी है।)
    note: यही ढाँचा *mică* के साथ, जो इसी यूनिट के पहले पाठ का 'छोटी' का स्त्रीलिंग रूप है।
  ro.a1.unit14.lesson03.teach.reminder_mai_decat_mare_mic_mica:
    title: 'दोहराव: Mai, Decât, Mare, Mic, Mică'
    gloss: Mai (ज़्यादा/-तर) · Decât (से) · Mare (बड़ा) · Mic (छोटा, पुल्लिंग/नपुंसकलिंग) · Mică (छोटी, स्त्रीलिंग)
    note: ये सब इसी यूनिट के पहले और दूसरे पाठ से हैं; यहाँ Ana और Mihai इन्हें साथ में इस्तेमाल करते हैं।
  ro.a1.unit14.lesson03.teach.reminder_cafeaua_ceaiul_painea:
    title: 'दोहराव: cafeaua, ceaiul, pâinea'
    gloss: cafeaua (कॉफ़ी) · ceaiul (चाय) · pâinea (ब्रेड)
    note: ये सब यूनिट 13 से हैं; यही तीन चीज़ें Ana और Mihai आपस में तुलना करते हैं।
  ro.a1.unit14.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'दोहराव: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: bună (नमस्ते) · mulțumesc (धन्यवाद) · la revedere (अलविदा) · Ana, Mihai (नाम)
    note: ये सब पिछली यूनिटों में आ चुके हैं; इस कोर्स के हर संवाद में शुरुआत और अंत इसी दोस्ताना ढंग से होता रहा है।
  ro.a1.unit14.lesson03.teach.line01:
    title: अभिवादन और आकार के बारे में सवाल
    gloss: Mihai, Ana को नमस्ते कहता है और पूछता है कि कॉफ़ी बड़ी है या छोटी।
    note: आकार का सवाल शुरू करने के लिए इसी यूनिट का *mare sau mică* (बड़ी या छोटी) इस्तेमाल होता है; यह वही 'X या Y?' वाला विकल्प पूछने का ढंग है जो यूनिट 13 के *cafea sau ceai?* में आ चुका है।
  ro.a1.unit14.lesson03.teach.line02:
    title: दोनों पेयों का आकार बताना
    gloss: Ana कहती है कि कॉफ़ी बड़ी है और चाय छोटी है।
    note: यह आकार के बारे में सीधी जानकारी है, पसंद की बात नहीं; इस संवाद में यह नहीं कहा गया कि कौन क्या पसंद करता है या मँगाता है, सिर्फ़ यह कि हर एक कितना बड़ा है।
  ro.a1.unit14.lesson03.teach.line03:
    title: तुलना की पुष्टि के लिए पूछना
    gloss: Mihai पूछता है कि क्या कॉफ़ी चाय से बड़ी है।
    note: Ana की दो अलग बातों को इस यूनिट के मुख्य ढाँचे *mai mare decât* से सीधी तुलना में बदल देता है।
  ro.a1.unit14.lesson03.teach.line04:
    title: हामी भरना और ब्रेड को जोड़ना
    gloss: Ana हामी भरती है, फिर कहती है कि ब्रेड कॉफ़ी से छोटी है।
    note: '*mai ... decât* तीसरी चीज़ *pâinea* के साथ दोबारा आता है, इस बार ''छोटी'' के तुलनात्मक रूप *mai mică* के साथ।'
  ro.a1.unit14.lesson03.teach.line05:
    title: हामी, धन्यवाद और अलविदा
    gloss: Mihai मानता है कि ब्रेड छोटी है, Ana को धन्यवाद देता है और अलविदा कहता है।
    note: वही समापन का ढंग जिस पर पिछली हर यूनिट का संवाद खत्म हुआ है।
  ro.a1.unit14.lesson03.teach.line06:
    title: बातचीत खत्म करना
    gloss: Ana भी अलविदा कहती है और Mihai का नाम लेती है।
    note: वही दोस्ताना समापन जिस पर पिछली हर यूनिट का संवाद खत्म हुआ है।
