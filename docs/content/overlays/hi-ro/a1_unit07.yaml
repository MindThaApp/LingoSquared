teaching:
  ro.a1.unit07.lesson01.teach.reminder_un_numere:
    title: 'याद दिलाना: un, doi, cinci, zece, douăzeci'
    gloss: un (एक) · doi (दो) · cinci (पाँच) · zece (दस) · douăzeci (बीस)
    note: ये सभी पहले की इकाइयों में आ चुके हैं (*un* इकाई 4 में, संख्याएँ इकाई 2 में) -- यहाँ ये दाम बताने के लिए लौटते हैं।
  ro.a1.unit07.lesson01.teach.cat_costa:
    title: यह कितने का है?
    gloss: Cât costă? (इसकी कीमत कितनी है?)
    note: रोमानियाई में दाम पूछने का रोज़मर्रा का तरीका -- इसके बाद चीज़ का नाम जोड़िए, या जब चीज़ संदर्भ से साफ़ हो तो इसे अकेले कहिए।
  ro.a1.unit07.lesson01.teach.leu:
    title: Leu (रोमानिया की मुद्रा)
    gloss: 'leu (रोमानिया की मुद्रा की इकाई -- बहुवचन: lei)'
    note: रोमानिया की मुद्रा। Leu एकवचन है (एक leu); बहुवचन lei अनियमित है, leu में कोई सामान्य प्रत्यय जोड़कर नहीं बनता।
    example_gloss: इसकी कीमत एक leu है।
  ro.a1.unit07.lesson01.teach.costa_cinci_lei:
    title: इसकी कीमत आठ lei है
    gloss: Costă opt lei. (इसकी कीमत आठ lei है।)
    note: 2 से 19 तक lei सादा रहता है -- उससे पहले कोई अतिरिक्त शब्द नहीं लगता।
  ro.a1.unit07.lesson01.teach.costa_douazeci_de_lei:
    title: इसकी कीमत तीस lei है
    gloss: Costă treizeci de lei. (इसकी कीमत तीस lei है।)
    note: 20 से ऊपर रोमानियाई में गिनी जाने वाली संज्ञा से पहले *de* लगता है -- वही नियम जो इकाई 2 में *ani* (साल) के लिए सीखा था, अब *lei* पर लागू होता है।
  ro.a1.unit07.lesson01.teach.leu_lei_de_rule:
    title: 'नियम: leu → lei, और de कब जोड़ें'
    gloss: 'leu → lei · संख्या 2-19: *de* नहीं · संख्या 20+: *de* जोड़ें'
    note: इकाई 2 के *ani* वाले नियम जैसा ही पैटर्न (câți ani ai / am treizeci de ani) -- एक संज्ञा के लिए सीख लें तो lei के लिए भी वैसे ही चलता है।
  ro.a1.unit07.lesson01.teach.scump:
    title: महँगा
    gloss: scump (महँगा)
    note: ऐसे दाम पर आम प्रतिक्रिया, जो आपको ज़्यादा लगे।
    example_gloss: आठ lei? महँगा!
  ro.a1.unit07.lesson01.teach.ieftin:
    title: सस्ता
    gloss: ieftin (सस्ता)
    note: scump का उलटा -- यानी अच्छा दाम।
    example_gloss: एक leu? सस्ता!
  ro.a1.unit07.lesson02.teach.reminder_un_o_si_as_dori_rog:
    title: 'याद दिलाना: un, o, și, aș dori, vă rog, te rog'
    gloss: un/o (एक) · și (और) · aș dori (मुझे चाहिए, विनम्र) · vă rog (कृपया, औपचारिक) · te rog (कृपया, अनौपचारिक)
    note: '*Aș dori*, *vă rog* और *te rog* पहली बार इकाई 6 के कैफ़े वाले दृश्य में आए थे -- यहाँ ये बाज़ार में लौटते हैं।'
  ro.a1.unit07.lesson02.teach.piata:
    title: बाज़ार
    gloss: piață (बाज़ार)
    note: स्त्रीलिंग संज्ञा -- खुला या ढका हुआ बाज़ार, जहाँ ताज़ा खाने का सामान खरीदा जाता है।
    example_gloss: बाज़ार में इसकी कीमत कितनी है?
  ro.a1.unit07.lesson02.teach.rosii:
    title: टमाटर
    gloss: roșii (टमाटर)
    note: roșie (एक टमाटर) का बहुवचन -- टमाटर खरीदने की सामान्य बात करते समय बहुवचन बोला जाता है।
    example_gloss: मुझे टमाटर चाहिए।
  ro.a1.unit07.lesson02.teach.cartofi:
    title: आलू
    gloss: cartofi (आलू)
    note: cartof (एक आलू) का बहुवचन, roșii जैसा ही पैटर्न।
    example_gloss: मुझे आलू चाहिए।
  ro.a1.unit07.lesson02.teach.kilogram:
    title: Kilogram
    gloss: kilogram (किलोग्राम)
    note: 'तौलकर सामान खरीदने की मानक इकाई। *De* इसे खरीदी जाने वाली चीज़ से जोड़ता है: kilogram *de* roșii, यानी ''एक किलो टमाटर''।'
    example_gloss: एक किलो टमाटर।
  ro.a1.unit07.lesson02.teach.vreau:
    title: मुझे चाहिए
    gloss: vreau (मुझे चाहिए)
    note: '*Aș dori* (''मुझे चाहिए'', विनम्र) से ज़्यादा सीधा और सादा -- बाज़ार में दोनों ठीक हैं, vreau बस कम औपचारिक है।'
    example_gloss: मुझे आलू चाहिए।
  ro.a1.unit07.lesson02.teach.unde_pot_sa_cumpar:
    title: '... कहाँ से खरीदा जा सकता है?'
    gloss: Unde pot să cumpăr roșii? (टमाटर कहाँ से खरीदे जा सकते हैं?)
    note: जब आपको पता न हो कि खरीदारी कहाँ करें, तब काम आने वाला सवाल -- roșii की जगह कोई भी और चीज़ रख लीजिए।
  ro.a1.unit07.lesson02.teach.cat_costa_kilogram_rosii:
    title: एक किलो टमाटर कितने का है?
    gloss: Cât costă un kilogram de roșii? (एक किलो टमाटर की कीमत कितनी है?)
    note: Cât costă और kilogram de ... वाली बनावट को एक पूरे सवाल में जोड़ता है।
  ro.a1.unit07.lesson02.teach.vreau_kilogram_cartofi:
    title: मुझे एक किलो आलू चाहिए
    gloss: Vreau un kilogram de cartofi. (मुझे एक किलो आलू चाहिए।)
    note: वही kilogram de ... पैटर्न, इस बार सवाल की जगह vreau के साथ कथन में।
  ro.a1.unit07.lesson03.teach.reminder_buna_multumesc_la_revedere:
    title: 'याद दिलाना: bună, ziua, mulțumesc, bine, la revedere, Ana, Mihai'
    gloss: bună ziua (नमस्ते) · mulțumesc (धन्यवाद) · bine (अच्छा/ठीक) · la revedere (अलविदा) · Ana, Mihai (नाम)
    note: ये सभी इकाई 1 और इकाई 6 के संवादों में आ चुके हैं -- यहाँ Ana और Mihai फिर मिलते हैं, इस बार बाज़ार में।
  ro.a1.unit07.lesson03.teach.line01:
    title: नमस्ते कहें और दाम पूछें
    gloss: Ana, Mihai को नमस्ते कहती है और एक किलो टमाटर का दाम पूछती है।
    note: इस इकाई के Cât costă को इकाई 1 के अभिवादन के साथ जोड़ता है।
  ro.a1.unit07.lesson03.teach.line02:
    title: दाम बताएँ
    gloss: Mihai बताता है कि इसकी कीमत आठ lei है और कहता है कि यह सस्ता है।
    note: इसी इकाई के costă, opt lei और ieftin का फिर से इस्तेमाल।
  ro.a1.unit07.lesson03.teach.line03:
    title: विनम्रता से माँगें और एक चीज़ जोड़ें
    gloss: Ana सहमत होती है, विनम्रता से एक किलो टमाटर माँगती है और जोड़ती है कि उसे आलू भी चाहिए।
    note: aș dori, vă rog और vreau को मिलाता है -- इस इकाई की शब्दावली के दोनों रूप एक ही पंक्ति में।
  ro.a1.unit07.lesson03.teach.line04:
    title: दूसरा दाम बताएँ
    gloss: Mihai बताता है कि एक किलो आलू की कीमत पाँच lei है।
    note: इकाई 2 के zece (दस) का फिर से इस्तेमाल, जिसे इस इकाई के पहले पाठ में याद दिलाया जा चुका है।
  ro.a1.unit07.lesson03.teach.line05:
    title: धन्यवाद कहकर समाप्त करें
    gloss: Ana, Mihai को धन्यवाद देती है और अलविदा कहती है।
    note: यहाँ *Mulțumesc* विदा के समय का सादा धन्यवाद है, वही शब्द जो इकाई 1 के *Bine, mulțumesc.* में था।
  ro.a1.unit07.lesson03.teach.line06:
    title: मुलाकात समाप्त करें
    gloss: Mihai भी Ana का नाम लेकर अलविदा कहता है।
    note: वही दोस्ताना समापन, जिस पर इकाई 1, 5 और 6 के संवाद खत्म हुए थे।
