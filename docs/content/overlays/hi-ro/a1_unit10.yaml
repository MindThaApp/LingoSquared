teaching:
  ro.a1.unit10.lesson01.teach.reminder_dimineata_seara_noaptea_cafea_paine:
    title: 'दोहराव: dimineața, seara, noaptea, cafea, pâine'
    gloss: dimineața (सुबह) · seara (शाम को) · noaptea (रात को) · cafea (कॉफ़ी) · pâine (रोटी)
    note: ये सब पहले आ चुके हैं -- dimineața/seara/noaptea यूनिट 4 से, cafea/pâine यूनिट 6 से -- यहाँ ये इस यूनिट के दिनचर्या वाले वाक्यों में एक साथ आते हैं।
  ro.a1.unit10.lesson01.teach.ma_trezesc_vocab:
    title: मैं जागता हूँ
    gloss: Mă trezesc (मैं जागता हूँ)
    note: '*Mă* वही स्वयंवाचक सर्वनाम है जो *mă numesc*/*mă cheamă* में आ चुका है -- रोमानियाई में ''जागना'' के लिए स्वयंवाचक क्रिया चलती है, शाब्दिक अर्थ ''मैं खुद को जगाता हूँ''।'
    example_gloss:
    - मैं सुबह जागता हूँ।
  ro.a1.unit10.lesson01.teach.ma_trezesc_phrase:
    title: मैं सुबह जागता हूँ
    gloss: Mă trezesc dimineața. (मैं सुबह जागता हूँ।)
    note: एक छोटा, पूरा वाक्य -- सबसे सरल दिनचर्या वाला वाक्य।
  ro.a1.unit10.lesson01.teach.mananc_vocab:
    title: मैं खाता हूँ
    gloss: Mănânc (मैं खाता हूँ)
    note: '''मैं'' के लिए अलग सर्वनाम की ज़रूरत नहीं -- रोमानियाई में क्रिया का अंत ही बता देता है कि कौन बोल रहा है, जैसा *vreau*/*cumpăr*/*aș dori* में पहले देखा है।'
    example_gloss:
    - मैं सुबह रोटी खाता हूँ।
  ro.a1.unit10.lesson01.teach.beau_vocab:
    title: मैं पीता हूँ
    gloss: Beau (मैं पीता हूँ)
    note: '*cafea* और *ceai* जैसे पहले से जाने हुए पेयों के साथ स्वाभाविक रूप से आता है।'
    example_gloss:
    - मैं सुबह कॉफ़ी पीता हूँ।
  ro.a1.unit10.lesson01.teach.mananc_beau_phrase:
    title: मैं सुबह रोटी खाता हूँ और कॉफ़ी पीता हूँ
    gloss: Mănânc pâine și beau cafea dimineața. (मैं सुबह रोटी खाता हूँ और कॉफ़ी पीता हूँ।)
    note: दो क्रियाओं को *și* (और) से जोड़ा गया है, जो यूनिट 4 के *ora unu și jumătate* में आ चुका है।
  ro.a1.unit10.lesson02.teach.lucrez_vocab:
    title: मैं काम करता हूँ
    gloss: Lucrez (मैं काम करता हूँ)
    note: यह *lucrează* का उत्तम पुरुष रूप है, जो यूनिट 4 में मिहाई के शाम के काम के बारे में आ चुका है।
    example_gloss:
    - मैं शाम को काम करता हूँ।
  ro.a1.unit10.lesson02.teach.lucrez_phrase:
    title: मैं शाम को काम करता हूँ
    gloss: Lucrez seara. (मैं शाम को काम करता हूँ।)
    note: यह बताने वाला एक छोटा, पूरा वाक्य कि आप कब काम करते हैं।
  ro.a1.unit10.lesson02.teach.merg_vocab:
    title: मैं जाता हूँ
    gloss: Merg (मैं जाता हूँ)
    note: यह *mergeți* का उत्तम पुरुष रूप है, जो पहले आदेश रूप में आ चुका है -- वही क्रिया, अलग पुरुष।
    example_gloss:
    - मैं घर जाता हूँ।
  ro.a1.unit10.lesson02.teach.acasa_vocab:
    title: घर
    gloss: Acasă (घर)
    note: इसके साथ पूर्वसर्ग नहीं लगता -- *merg acasă* कहते हैं, *merg la acasă* नहीं; हिंदी में 'घर जाता हूँ' के साथ भी 'को' के बिना यही सहज रूप है।
    example_gloss:
    - मैं रात को घर जाता हूँ।
  ro.a1.unit10.lesson02.teach.merg_acasa_phrase:
    title: मैं रात को घर जाता हूँ
    gloss: Merg acasă noaptea. (मैं रात को घर जाता हूँ।)
    note: एक छोटा, पूरा वाक्य -- कामकाजी दिन का स्वाभाविक अंत।
  ro.a1.unit10.lesson02.teach.lucrez_merg_phrase:
    title: मैं शाम को काम करता हूँ और रात को घर जाता हूँ
    gloss: Lucrez seara și merg acasă noaptea. (मैं शाम को काम करता हूँ और रात को घर जाता हूँ।)
    note: इस पाठ के दोनों वाक्यों को *și* से एक वाक्य में जोड़ा गया है।
  ro.a1.unit10.lesson03.teach.reminder_cursul_incepe_ora_apoi:
    title: 'दोहराव: cursul, începe, la ora nouă, apoi'
    gloss: cursul (कक्षा) · începe (शुरू होती है) · la ora nouă (नौ बजे) · apoi (फिर)
    note: Cursul/începe/la ora nouă यूनिट 4 में आ चुके हैं (मिहाई की कक्षा सुबह नौ बजे शुरू होती है); apoi यूनिट 9 में आ चुका है -- यहाँ ये मिहाई के अपने दिन के वर्णन में एक साथ आते हैं।
  ro.a1.unit10.lesson03.teach.reminder_buna_multumesc_la_revedere_da:
    title: 'दोहराव: bună, mulțumesc, la revedere, da, Ana, Mihai'
    gloss: bună (नमस्ते) · mulțumesc (धन्यवाद) · la revedere (अलविदा) · da (हाँ) · Ana, Mihai (नाम)
    note: ये सब पिछली यूनिटों में आ चुके हैं -- यहाँ आना मिहाई से उसके दिन के बारे में पूछती है।
  ro.a1.unit10.lesson03.teach.ma_culc_vocab:
    title: मैं सोने जाता हूँ
    gloss: Mă culc (मैं सोने जाता हूँ)
    note: यह भी एक स्वयंवाचक क्रिया है, *mă trezesc* जैसी ही बनावट -- शाब्दिक अर्थ 'मैं खुद को लिटाता हूँ'।
    example_gloss:
    - मैं रात को सोने जाता हूँ।
  ro.a1.unit10.lesson03.teach.ma_culc_phrase:
    title: मैं रात को सोने जाता हूँ
    gloss: Mă culc noaptea. (मैं रात को सोने जाता हूँ।)
    note: दिन का स्वाभाविक अंत, जो *mă trezesc dimineața* से शुरू हुई दिनचर्या को पूरा करता है।
  ro.a1.unit10.lesson03.teach.line01:
    title: अभिवादन करें और पूछें कि कक्षा कब शुरू होती है
    gloss: आना मिहाई को नमस्ते कहती है और पूछती है कि उसकी कक्षा कब शुरू होती है।
    note: यह यूनिट 4 में मिहाई के कोर्स के बारे में पूछे गए सवाल को ही दोहराता है।
  ro.a1.unit10.lesson03.teach.line02:
    title: कक्षा का समय बताकर उत्तर दें
    gloss: मिहाई कहता है कि उसकी कक्षा सुबह नौ बजे शुरू होती है।
    note: ठीक वही उत्तर जो मिहाई ने यूनिट 4 में दिया था, अब उसकी पूरी दिनचर्या के हिस्से के रूप में दोहराया गया है।
  ro.a1.unit10.lesson03.teach.line03:
    title: शाम के बारे में पूछें
    gloss: 'आना एक छोटा अगला सवाल पूछती है: ''और शाम को?'''
    note: नया प्रश्नवाचक शब्द इस्तेमाल किए बिना दिनचर्या के बारे में और पूछने का स्वाभाविक, छोटा तरीका।
  ro.a1.unit10.lesson03.teach.line04:
    title: बाकी दिन का वर्णन करें
    gloss: मिहाई कहता है कि वह शाम को काम करता है, फिर रात को सोने जाता है।
    note: इस यूनिट के *lucrez* और *mă culc* को *apoi* से जोड़ा गया है -- और यह यूनिट 4 की इस बात से मेल खाता है कि मिहाई शाम को काम करता है।
  ro.a1.unit10.lesson03.teach.line05:
    title: धन्यवाद कहें और बात समाप्त करें
    gloss: आना कहती है 'अच्छा!', मिहाई को धन्यवाद देती है और अलविदा कहती है।
    note: वही समापन-धन्यवाद जो यूनिट 1, 8 और 9 के संवादों में था।
  ro.a1.unit10.lesson03.teach.line06:
    title: मुलाक़ात समाप्त करें
    gloss: मिहाई भी आना का नाम लेकर अलविदा कहता है।
    note: वही मित्रतापूर्ण समापन जिस पर पिछली हर यूनिट का संवाद खत्म हुआ।
