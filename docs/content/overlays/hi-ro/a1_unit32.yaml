    gloss: हाँ, मेरे पास एक कुत्ता है।
    note: इस यूनिट की नई शब्दावली के साथ एक सरल सकारात्मक उत्तर।
  ro.a1.unit32.lesson01.teach.nu_nu_am:
    title: नहीं, मेरे पास कोई पालतू जानवर नहीं है
    gloss: नहीं, मेरे पास कोई पालतू जानवर नहीं है।
    note: '*nu am* के बाद *niciun* ("एक भी नहीं") संज्ञा को नकारता है; व्याकरण नोट देखिए।'
  ro.a1.unit32.lesson01.teach.la_negatie_nu:
    title: 'Nu am: कोई उपपद नहीं'
    gloss: 'Nu am के बाद आप un या o का प्रयोग नहीं करते: Nu am timp, nu am niciun animal de companie.'
    note: 'यह वही ढाँचा है जो *Nu am timp* में पहले सिखाया गया था: कोई नया व्याकरण नहीं, बस लागू करने के लिए एक नई संज्ञा।'
  ro.a1.unit32.lesson02.teach.a_scoate_la:
    title: (जानवर को) टहलाने ले जाना
    gloss: (जानवर को) टहलाने ले जाना
    note: '*A scoate la plimbare* एक स्थिर अभिव्यक्ति है; व्याकरण नोट देखिए।'
    example_gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
  ro.a1.unit32.lesson02.teach.verbul_se_schimba:
    title: क्रिया व्यक्ति के अनुसार बदलती है
    gloss: 'क्रिया व्यक्ति के अनुसार बदलती है: eu scot, tu scoți, el scoate (मैं ले जाता हूँ, तुम ले जाते हो, वह ले जाता है) कुत्ते को सैर पर।'
    note: 'रोमानियाई क्रियाएँ हर व्यक्ति के लिए अपना अंत बदलती हैं, इसलिए *a scoate la plimbare* एक ही क्रिया की तरह चलती है: *scot*, *scoți*, *scoate*।'
  ro.a1.unit32.lesson02.teach.a_da_de:
    title: खाना खिलाना
    gloss: खाना खिलाना
    example_gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
  ro.a1.unit32.lesson02.teach.a_se_juca:
    title: के साथ खेलना
    gloss: के साथ खेलना
    example_gloss: Andrei अपनी बिल्ली के साथ खेलता है।
  ro.a1.unit32.lesson02.teach.scot_cainele_la:
    title: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ
    gloss: मैं रोज़ कुत्ते को टहलाने ले जाता हूँ।
    note: यह *a scoate la plimbare* को *în fiecare zi* (हर दिन) के साथ जोड़ता है, जो पहले की एक इकाई में आ चुका है।
  ro.a1.unit32.lesson02.teach.dau_de_mancare:
    title: मैं रोज़ बिल्ली को खाना खिलाता हूँ
    gloss: मैं रोज़ बिल्ली को खाना खिलाता हूँ।
    note: 'यह *a da de mâncare* को *în fiecare zi* के साथ जोड़ता है; जानवर संप्रदान कारक में आता है: *pisicii*।'
  ro.a1.unit32.lesson03.teach.plural_caine_caini:
    title: 'Plural: câine → câini'
    gloss: 'बहुवचन: câine → câini, animal → animale, pisică → pisici.'
    note: रोमानियाई का नियमित बहुवचन-ढाँचा, जो यहाँ पहली बार जानवरों की संज्ञाओं के उदाहरण से सिखाया गया है।
  ro.a1.unit32.lesson03.teach.caini_pisici:
    title: कुत्ते और बिल्लियाँ
    gloss: कुत्ते / बिल्लियाँ
    example_gloss:
    - Mihai को कुत्ते पसंद हैं।
    - Elena को बिल्लियाँ पसंद हैं।
  ro.a1.unit32.lesson03.teach.pesti_pasari:
    title: मछलियाँ और पक्षी (बहुवचन)
    gloss: मछलियाँ / पक्षी
    example_gloss:
    - मुझे मछलियाँ बहुत पसंद हैं।
    - दादाजी को पक्षी बहुत पसंद हैं।
  ro.a1.unit32.lesson03.teach.iubesc_animalele:
    title: मुझे जानवर बहुत पसंद हैं
    gloss: मुझे जानवर बहुत पसंद हैं।
    note: '*A iubi* ("प्यार करना") अपनी कर्म संज्ञा को बिना किसी पूर्वसर्ग के लेता है: *Iubesc animalele*; उपपद *-le* दिखाता है कि हम सामान्य रूप से जानवरों की बात कर रहे हैं।'
  ro.a1.unit32.lesson03.teach.elena_iubeste_pisicile:
    title: Elena को बिल्लियाँ पसंद हैं, पर उसके पास कोई पालतू जानवर नहीं है
    gloss: Elena को बिल्लियाँ पसंद हैं, पर उसके पास कोई पालतू जानवर नहीं है।
    note: यह उस विरोधाभास की भूमिका बनाता है जिस पर इस यूनिट का पठन-अंश आधारित है।
  ro.a1.unit32.lesson04.teach.mihai_ai_un:
    title: Mihai पालतू जानवर के बारे में पूछता है
    gloss: 'Mihai: क्या तुम्हारे पास कोई पालतू जानवर है, Ana?'
  ro.a1.unit32.lesson04.teach.ana_da_am:
    title: Ana के पास कुत्ता है
    gloss: 'Ana: हाँ, मेरे पास एक कुत्ता है।'
  ro.a1.unit32.lesson04.teach.mihai_cum_arata:
    title: Mihai पूछता है कि वह कैसा दिखता है
    gloss: 'Mihai: वह कैसा दिखता है?'
    note: यह वही *Cum arată ...?* प्रश्न है जो रूप-रंग वाली इकाई में आया था, अब किसी जानवर के बारे में पूछा गया है।
  ro.a1.unit32.lesson04.teach.ana_are_blana:
    title: Ana अपने कुत्ते का वर्णन करती है
    gloss: 'Ana: उसके बाल भूरे हैं और वह छोटा है।'
    note: बालों के रंग और आकार की शब्दावली रूप-रंग वाली यूनिट से दोहराई गई है, अब किसी व्यक्ति के बालों की जगह जानवर के रोएँ के लिए।
  ro.a1.unit32.lesson04.teach.pentru_un_animal:
    title: जानवरों के लिए El और ea
    gloss: 'किसी जानवर के लिए उसके लिंग के अनुसार el या ea का प्रयोग कीजिए: câinele के लिए el, pisica के लिए ea.'
    note: इस पाठ्यक्रम में *el* और *ea* के पिछले सभी प्रयोग व्यक्तियों के लिए थे; यहाँ इन्हें संज्ञा के लिंग के अनुसार जानवरों पर भी लागू किया गया है।
  ro.a1.unit32.lesson04.teach.mihai_il_scoti:
    title: Mihai सैर के बारे में पूछता है
    gloss: 'Mihai: क्या तुम उसे हर दिन सैर पर ले जाती हो?'
  ro.a1.unit32.lesson04.teach.ana_da_il:
    title: Ana अपनी दिनचर्या बताती है
    gloss: 'Ana: हाँ, मैं उसे हर दिन सैर पर ले जाती हूँ और उसे खाना देती हूँ।'
  ro.a1.unit32.lesson05.teach.mihai_si_elena:
    title: जानवरों के बारे में Mihai, Elena और Andrei
    gloss: 'Mihai और Elena दोनों को जानवर पसंद हैं, पर उन दोनों में से किसी के पास पालतू जानवर नहीं है। Mihai को कुत्ते पसंद हैं और Elena को बिल्लियाँ। लेकिन Andrei के पास एक पालतू जानवर है: एक बिल्ली। वह अक्सर अपनी बिल्ली के साथ खेलता है और हर दिन उसे खाना देता है। क्या आपके पास कोई पालतू जानवर है?'
    note: किसी जानवर को पसंद करने और सच में उसे पालने का फ़र्क़ दिखाता है -- यही इस यूनिट के संवाद-लक्ष्य की मूल बात है।
    glosses:
      iubesc: बहुत पसंद है
      amândoi: दोनों
      animalele: जानवर
      doi: दोनों
      companie: पालतू जानवर
      câinii: कुत्ते
      pisicile: बिल्लियाँ
      pisică: बिल्ली
      joacă: खेलता है
      dă: देता है
      fiecare: हर
      mâncare: खाना
  ro.a1.unit32.lesson05.teach.andrei_se_joaca:
    title: Andrei अक्सर अपनी बिल्ली के साथ खेलता है
    gloss: Andrei अक्सर अपनी बिल्ली के साथ खेलता है।
    note: '*Des* (अक्सर) शौक वाली इकाई का आवृत्ति-शब्द है; *a se juca cu* ("के साथ खेलना") एक प्रतिवाचक क्रिया है।'
  ro.a1.unit32.lesson05.teach.iubesc_cainii_nu:
    title: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    gloss: मुझे कुत्ते बहुत पसंद हैं। मेरे पास कोई पालतू जानवर नहीं है।
    note: दो वाक्यों का एक आदर्श उत्तर, जिसे इस यूनिट के लेखन-अभ्यास में दोहराया जा सकता है।
  ro.a1.unit32.lesson06.teach.ana_nina_ai:
    title: Ana, Nina से पूछती है
    gloss: 'Ana: Nina, क्या तुम्हारे पास भी कोई पालतू जानवर है?'
  ro.a1.unit32.lesson06.teach.nina_da_am:
    title: Nina के पास Pico नाम का पक्षी है
    gloss: 'Nina: हाँ, मेरे पास एक पक्षी है। उसका नाम Pico है।'
    note: '*O cheamă* ("नाम है") नाम बताने वाली क्रिया *a chema* का ही प्रयोग है; चिड़िया स्त्रीलिंग है, इसलिए सर्वनाम *o* है।'
  ro.a1.unit32.lesson06.teach.mihai_ce_frumos:
    title: Mihai प्रतिक्रिया देता है
    gloss: 'Mihai: कितना अच्छा! तुम हर दिन उसके साथ क्या करती हो?'
  ro.a1.unit32.lesson06.teach.nina_ii_dau:
    title: Nina रोज़ उसे खाना खिलाती है
    gloss: 'Nina: मैं रोज़ उसे खाना खिलाती हूँ।'
  ro.a1.unit32.lesson06.teach.mihai_iubesc_si:
    title: Mihai को भी पक्षी पसंद हैं
    gloss: 'Mihai: मुझे भी पक्षी पसंद हैं।'
  ro.a1.unit32.lesson06.teach.ana_ce_frumos:
    title: Ana बातचीत समाप्त करती है
    gloss: 'Ana: कितना अच्छा है कि हम तीनों को जानवर पसंद हैं!'
    note: इस यूनिट में तीनों पात्रों के जानवरों से जुड़े तथ्यों को एक साथ समेटता है।
