teaching:
  ro.a1.unit32.lesson01.teach.animalul_un_animal:
    title: जानवर, पालतू जानवर
    gloss: जानवर / पालतू जानवर
    note: '*Animal* सामान्य शब्द है; *animal de companie* ("साथी जानवर") का अर्थ विशेष रूप से पालतू जानवर है। बहुवचन *animale* है (*un animal*, *două animale*)।'
    example_gloss:
