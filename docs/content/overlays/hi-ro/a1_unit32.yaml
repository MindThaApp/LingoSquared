  ro.a1.unit32.lesson01.teach.ai_un_animal:
    title: क्या आपके पास कोई पालतू जानवर है?
    gloss: क्या आपके पास कोई पालतू जानवर है?
    note: 'वही *Ai ...?* प्रश्न-ढाँचा जो आप पहले से जानते हैं: *a avea* (होना/पास होना) + संज्ञा।'
