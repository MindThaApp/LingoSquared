teaching:
  ro.a1.unit16.lesson01.teach.reminder_ma_va_ce_sau:
    title: 'याद रखें: mă, vă, ce, sau'
    gloss: मुझे · आपको (औपचारिक) · क्या · या
    note: 'Mă इकाई 1 और इकाई 10 से है (mă numesc, mă trezesc); vă इकाई 1, 6, 7 और 13 से है (vă rog); ce इकाई 1, 3, 4 और 15 से है; sau इकाई 13 से है। इस इकाई में इन चारों का नया उपयोग होता है: यह बताना कि क्या दर्द कर रहा है।'
  ro.a1.unit16.lesson01.teach.doare_vocab:
    title: दर्द करता है
    gloss: दर्द करता है
    note: 'यह एक अव्यक्तिक क्रिया है। रोमानियाई में ''मुझे दर्द होता है'' (*mă doare*) कहा जाता है, ''मैं दर्द करता हूँ'' नहीं। अकेला *mă doare* का अर्थ है ''दर्द हो रहा है''; क्या दर्द कर रहा है यह बताने के लिए शरीर का अंग जोड़िए: *Mă doare capul*।'
    example_gloss:
    - दर्द हो रहा है।
  ro.a1.unit16.lesson01.teach.cap_vocab:
    title: सिर
    gloss: सिर
    note: नपुंसक लिंग, व्यंजन पर समाप्त। 'सिर' के निश्चित रूप के लिए *-ul* लगता है, जैसे *tren*->*trenul* और *peron*->*peronul*।
    example_gloss:
    - मेरे सिर में दर्द है।
  ro.a1.unit16.lesson01.teach.ce_va_doare_phrase:
    title: तुम्हें क्या दर्द है?
    gloss: आपको किस चीज़ में दर्द है?
    note: '*Ce* (क्या) + *vă* (आपको, औपचारिक) + *doare* -- यहाँ हर शब्द पहले पढ़ाया जा चुका है या अभी आया है, और इन्हें मिलाकर नया प्रश्न बना है।'
  ro.a1.unit16.lesson01.teach.stomac_vocab:
    title: पेट
    gloss: पेट
    note: नपुंसक लिंग, व्यंजन पर समाप्त, इसलिए 'पेट' का निश्चित रूप *stomacul* है -- वही *-ul* जो *cap*->*capul* में है।
    example_gloss:
    - मेरे पेट में दर्द है।
  ro.a1.unit16.lesson01.teach.ma_doare_capul_sau_stomacul_phrase:
    title: क्या आपका सिर या पेट दर्द कर रहा है?
    gloss: क्या आपका सिर या पेट दर्द कर रहा है?
    note: '*mă* की जगह *vă* (आपको, औपचारिक) रखने से वाक्य सामने वाले व्यक्ति के बारे में प्रश्न बन जाता है; *sau* (या, इकाई 13 से) अभी सीखे दोनों अंगों को जोड़ता है।'
  ro.a1.unit16.lesson02.teach.reminder_nu_bine_am_un_de:
    title: 'याद रखें: nu, bine, am, un, de'
    gloss: नहीं · ठीक/अच्छा · मेरे पास है · एक (पुल्लिंग/नपुंसक) · का/से
    note: Nu और bine इकाई 1, 6 और 11 से हैं; am इकाई 2, 5 और 15 से है; un और de इकाई 6, 7 और 15 से हैं। इस इकाई में पाँचों का उपयोग तबीयत ठीक न होने और डॉक्टर की ज़रूरत बताने के लिए होता है।
  ro.a1.unit16.lesson02.teach.ma_simt_vocab:
    title: मैं महसूस करता हूँ
    gloss: मैं महसूस करता हूँ
    note: यह आत्मवाचक क्रिया है, शाब्दिक अर्थ 'मैं स्वयं को महसूस करता हूँ' -- इकाई 10 के *mă trezesc* और *mă culc* जैसा ही *mă* + क्रिया का ढाँचा।
    example_gloss:
    - मुझे अच्छा लग रहा है।
  ro.a1.unit16.lesson02.teach.nu_ma_simt_bine_phrase:
    title: मेरी तबीयत ठीक नहीं है
    gloss: मुझे अच्छा नहीं लग रहा है।
    note: '*Nu*, *mă simt bine* को नकारता है -- किसी खास लक्षण का नाम लिए बिना यह बताने का स्वाभाविक तरीका कि कुछ ठीक नहीं है।'
  ro.a1.unit16.lesson02.teach.bolnav_vocab:
    title: बीमार
    gloss: बीमार (पुल्लिंग)
    note: विशेषण का पुल्लिंग रूप, जैसा मिहाई कहता है (*Sunt bolnav*)। स्त्री *Sunt bolnavă* कहती है (स्त्रीलिंग रूप)।
    example_gloss:
    - मैं बीमार हूँ।
  ro.a1.unit16.lesson02.teach.am_nevoie_de_un_doctor_phrase:
    title: मुझे डॉक्टर की ज़रूरत है
    gloss: मुझे डॉक्टर की ज़रूरत है।
    note: '*Am nevoie de* (मुझे ज़रूरत है, शाब्दिक अर्थ ''मेरे पास ज़रूरत है'') + *un doctor* -- यह एक पक्का मुहावरा है, जो सिर्फ़ डॉक्टर के लिए नहीं, किसी भी मदद माँगने में काम आता है।'
  ro.a1.unit16.lesson02.teach.doctor_vocab:
    title: Doctor
    gloss: डॉक्टर
    note: पुल्लिंग, इसलिए 'एक डॉक्टर' *un doctor* है।
    example_gloss:
    - मुझे डॉक्टर की ज़रूरत है।
  ro.a1.unit16.lesson03.teach.reminder_ce_mai_faceti_aveti_da:
    title: 'याद रखें: Ce mai faceți?, Aveți, Da'
    gloss: आप कैसे हैं? (औपचारिक) · आपके पास है (औपचारिक) · हाँ
    note: Ce mai faceți इकाई 1 से है; Aveți इकाई 5 से है; Da इकाई 6 और 11 से है -- सब इस इकाई के हालचाल वाले संवाद में दोबारा आते हैं।
  ro.a1.unit16.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'याद रखें: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: नमस्ते · धन्यवाद · फिर मिलेंगे · आना, मिहाई (नाम)
    note: ये सब पिछली इकाइयों में आ चुके हैं -- वही मित्रतापूर्ण शुरुआत और अंत, जो इस कोर्स के हर संवाद में रहा है।
  ro.a1.unit16.lesson03.teach.reminder_spitalul_vizavi_magazin:
    title: 'याद रखें: Spitalul este vizavi de magazin'
    gloss: अस्पताल दुकान के सामने है।
    note: इकाई 8 से सीधे दोहराया गया है -- अस्पताल की जगह नहीं बदली है, और इस इकाई का पठन-नोट भी उसी की ओर संकेत करता है।
  ro.a1.unit16.lesson03.teach.odihna_vocab:
    title: आराम
    gloss: आराम
    note: स्त्रीलिंग संज्ञा -- तबीयत ठीक न होने पर डॉक्टर (या कोई दोस्त) यही सलाह देता है।
    example_gloss:
    - आपको आराम की ज़रूरत है।
  ro.a1.unit16.lesson03.teach.multa_apa_vocab:
    title: खूब सारा पानी
    gloss: खूब सारा पानी
    note: '*Multă* (बहुत सारा, स्त्रीलिंग) स्त्रीलिंग *apă* (पानी, इकाई 6 से) के साथ मेल खाता है -- यह पक्का जोड़ है, जैसी सलाह डॉक्टर दे सकता है।'
    example_gloss:
    - आराम और खूब सारा पानी।
  ro.a1.unit16.lesson03.teach.line01:
    title: नमस्ते कहें और हालचाल पूछें
    gloss: आना मिहाई को नमस्ते कहती है और उसका हालचाल पूछती है।
    note: इकाई 1 के अपने अभिवादन *Ce mai faceți?* को दोहराता है।
  ro.a1.unit16.lesson03.teach.line02:
    title: बताएँ कि तबीयत ठीक नहीं है
    gloss: मिहाई कहता है कि उसकी तबीयत ठीक नहीं है और उसके सिर में दर्द है।
    note: इस इकाई के दूसरे पाठ और पहले पाठ के वाक्यांशों को मिलाता है।
  ro.a1.unit16.lesson03.teach.line03:
    title: पूछें कि क्या उसे डॉक्टर चाहिए
    gloss: आना पूछती है कि क्या उसे डॉक्टर की ज़रूरत है।
    note: इस इकाई के दूसरे पाठ का वाक्यांश प्रश्न के रूप में, इकाई 5 के *aveți* के साथ।
  ro.a1.unit16.lesson03.teach.line04:
    title: बताएँ कि आप बीमार हैं और डॉक्टर चाहिए
    gloss: मिहाई हाँ कहता है, कि वह बीमार है और उसे डॉक्टर की ज़रूरत है।
    note: इस इकाई के *sunt bolnav* और *am nevoie de un doctor* को मिलाता है।
  ro.a1.unit16.lesson03.teach.line05:
    title: सलाह दें और विदा लें
    gloss: आना उसे आराम करने और खूब पानी पीने को कहती है, और विदा लेती है।
    note: इस पाठ के *Odihnă și multă apă* का उपयोग -- कोर्स की सामान्य सादी विदाई की जगह सेहत की सलाह।
  ro.a1.unit16.lesson03.teach.line06:
    title: धन्यवाद कहें और विदा लें
    gloss: मिहाई आना को धन्यवाद देता है और विदा लेता है।
    note: वही अंत का ढाँचा, जिस पर पिछली हर इकाई का संवाद समाप्त हुआ है।
