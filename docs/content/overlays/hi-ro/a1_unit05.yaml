  ro.a1.unit05.lesson03.o_discutie_despre_familie:
    title: परिवार के बारे में बातचीत
teaching:
  ro.a1.unit05.lesson01.teach.reminder_am_un_o_si_mare:
    title: 'दोहराव: am, un, o, și, mare'
    gloss: am (मेरे पास है) · un/o (एक) · și (और) · mare (बड़ा)
    note: ये पाँचों शब्द पहले की इकाइयों में आ चुके हैं (*și* यूनिट 1 में, *am* और *o* यूनिट 2 में, *mare* यूनिट 3 के "बड़े अक्षर" वाले नोट में, *un* यूनिट 4 में) — यहाँ वे परिवार की बात करने के लिए फिर आते हैं।
  ro.a1.unit05.lesson01.teach.familie:
    title: परिवार
    gloss: परिवार
    note: स्त्रीलिंग संज्ञा — *o* और *mare* जैसे विशेषण के साथ मिलकर "एक बड़ा परिवार" कहा जाता है।
    example_gloss: मेरा एक बड़ा परिवार है।
  ro.a1.unit05.lesson01.teach.mama:
    title: माँ
    gloss: माँ
    note: '"माँ" के लिए शब्दकोश वाला सादा शब्द — "मेरी माँ" कैसे कहते हैं, यह कुछ कार्ड आगे देखिए।'
    example_gloss: Mihai की एक माँ और एक पिता हैं।
  ro.a1.unit05.lesson01.teach.tata:
    title: पिता
    gloss: पिता
    note: '"पिता" के लिए शब्दकोश वाला सादा शब्द।'
    example_gloss: मेरे पिता शिक्षक हैं।
  ro.a1.unit05.lesson01.teach.parintii:
    title: माता-पिता
    gloss: माता-पिता
    note: दोनों माता-पिता को एक साथ कहता है, जैसे हिंदी में "माता-पिता" शब्द कहता है।
    example_gloss: मेरे माता-पिता रोमानिया में रहते हैं।
  ro.a1.unit05.lesson01.teach.meu_mea:
    title: 'मेरा/मेरी: meu और mea'
    gloss: meu (मेरा, पुल्लिंग) / mea (मेरी, स्त्रीलिंग)
    note: रोमानियाई में "मेरा/मेरी" उस वस्तु या व्यक्ति के लिंग के अनुसार बदलता है जिसका ज़िक्र है, बोलने वाले के लिंग के अनुसार नहीं — पुल्लिंग संज्ञा *tată* के साथ *meu*, स्त्रीलिंग संज्ञा *mamă* के साथ *mea*।
  ro.a1.unit05.lesson01.teach.mama_mea:
    title: मेरी माँ
    gloss: मेरी माँ
    note: Mamă के अंत में निश्चित आर्टिकल जुड़कर mama बन जाता है, फिर mea आता है — "मेरी माँ" असल में इसी रूप में कहा जाता है, शब्द-दर-शब्द अनुवाद से नहीं।
  ro.a1.unit05.lesson01.teach.tatal_meu:
    title: मेरे पिता
    gloss: मेरे पिता
    note: Tată के अंत में निश्चित आर्टिकल जुड़कर tatăl बन जाता है (यह अनियमित है, अंत में -l आता है), फिर meu आता है।
  ro.a1.unit05.lesson01.teach.mama_si_tatal:
    title: मेरी माँ और मेरे पिता
    gloss: मेरी माँ और मेरे पिता।
    note: दोनों अधिकार-सूचक रूप एक वाक्य में, हर एक अपने सही लिंग के अनुसार।
  ro.a1.unit05.lesson02.teach.reminder_cati_ai_aveti_doi_nu:
    title: 'दोहराव: câți, ai, aveți, doi, nu'
    gloss: câți (कितने) · ai/aveți (तुम्हारे पास है/आपके पास है) · doi (दो) · nu (नहीं)
    note: '*Câți*, *ai* और *aveți* पहली बार यूनिट 2 में उम्र पूछने के लिए आए थे ("Câți ani ai?"); यहाँ इनसे भाई-बहनों और बच्चों के बारे में पूछा जाता है। *Doi* यूनिट 2 की संख्याओं से है, *nu* यूनिट 3 से।'
  ro.a1.unit05.lesson02.teach.da:
    title: हाँ
    gloss: हाँ
    note: रोज़मर्रा का "हाँ" शब्द, यूनिट 3 के *nu* ("नहीं") का जोड़ीदार।
    example_gloss: हाँ, मेरा एक भाई है।
  ro.a1.unit05.lesson02.teach.frate_sora:
    title: भाई, बहन
    gloss: भाई / बहन
    note: पुल्लिंग और स्त्रीलिंग भाई-बहन के शब्द — un/o के साथ वैसे ही जुड़ते हैं जैसे कोई भी दूसरी संज्ञा।
    example_gloss:
    - मेरा एक भाई है।
    - मेरी एक बहन है।
  ro.a1.unit05.lesson02.teach.frati_surori:
    title: भाई (बहुवचन), बहनें
    gloss: भाई (बहुवचन) / बहनें
    note: ये बहुवचन रूप हैं, जो आम तौर पर भाई-बहनों के बारे में पूछने में काम आते हैं — रोमानियाई लोग अक्सर "Ai frați?" ("क्या तुम्हारे भाई हैं?") पूछकर असल में भाई-बहनों के बारे में पूछते हैं, और फिर अलग से "Surori?" पूछकर खास तौर पर बहनों के बारे में जाँचते हैं।
    example_gloss: क्या आपके भाई या बहनें हैं?
  ro.a1.unit05.lesson02.teach.ai_frati:
    title: क्या तुम्हारे भाई-बहन हैं? (अनौपचारिक)
    gloss: क्या तुम्हारे भाई हैं?
    note: पूछने का रोज़मर्रा का अनौपचारिक तरीका — यूनिट 1 के *tu* वाले रूप से जुड़ा है।
  ro.a1.unit05.lesson02.teach.aveti_frati:
    title: क्या आपके भाई-बहन हैं? (औपचारिक)
    gloss: क्या आपके भाई हैं?
    note: विनम्र रूप — वही *aveți* जो यूनिट 2 में उम्र के सवाल में था।
  ro.a1.unit05.lesson02.teach.copil_copii:
    title: बच्चा, बच्चे
    gloss: बच्चा / बच्चे
    note: Copil रोमानियाई के कठिन बहुवचनों में से एक है — copii, जो सामान्य -i या -e वाले अंत जैसा नहीं है — इसे अलग रूप के तौर पर याद कर लेना अच्छा है।
    example_gloss: मेरे दो बच्चे हैं।
  ro.a1.unit05.lesson02.teach.fiu_fiica:
    title: बेटा, बेटी
    gloss: बेटा / बेटी
    note: बेटे और बेटी के लिए खास शब्द, जो सामान्य copil/copii से अलग हैं।
    example_gloss:
    - मेरा एक बेटा है।
    - मेरी एक बेटी है।
  ro.a1.unit05.lesson02.teach.cati_copii_ai:
    title: आपके कितने बच्चे हैं?
    gloss: तुम्हारे कितने बच्चे हैं?
    note: Câți (कितने) + copii (बच्चे) + ai (तुम्हारे पास है) — तीनों शब्द पहले से परिचित हैं।
  ro.a1.unit05.lesson02.teach.casatorit:
    title: विवाहित
    gloss: विवाहित
    note: रोज़मर्रा की बातचीत में निजी जानकारी का आम सवाल, उम्र पूछने जैसा ही।
    example_gloss: क्या तुम विवाहित हो?
  ro.a1.unit05.lesson03.teach.reminder_bine_la_revedere:
    title: 'दोहराव: bine, la revedere, Ana, Mihai'
    gloss: bine (अच्छा/ठीक) · la revedere (अलविदा) · Ana, Mihai (नाम)
    note: पहले की इकाइयों में सिखाए शब्दों का दोहराव, जो इस पाठ की बातचीत में फिर आते हैं।
  ro.a1.unit05.lesson03.teach.line01:
    title: भाई-बहनों के बारे में पूछिए
    gloss: Ana, Mihai से पूछती है कि क्या उसके भाई-बहन हैं।
    note: विनम्र *aveți* का प्रयोग, जो उनके आपसी व्यवहार के तरीके से मेल खाता है।
  ro.a1.unit05.lesson03.teach.line02:
    title: जवाब और पलटकर सवाल
    gloss: Mihai कहता है कि उसका एक भाई और एक बहन है, और पूछता है कि क्या Ana के बच्चे हैं।
    note: एक ही बातचीत में इसी इकाई के frate/soră और copii शब्द दोबारा आते हैं।
  ro.a1.unit05.lesson03.teach.line03:
    title: जवाब और वही सवाल लौटाना
    gloss: Ana कहती है कि उसकी एक बेटी है, और वही सवाल Mihai से पलटकर पूछती है।
    note: '*Și dumneavoastră?* ("और आपसे?") वही सवाल लौटाने का तरीका है जो यूनिट 1 के परिचय में आया था।'
  ro.a1.unit05.lesson03.teach.line04:
    title: जवाब
    gloss: Mihai कहता है कि उसका एक बेटा है।
    note: इसी इकाई के fiu के साथ एक छोटा, सीधा जवाब।
  ro.a1.unit05.lesson03.teach.line05:
    title: प्रतिक्रिया और विदा
    gloss: Ana खुशी से प्रतिक्रिया देती है और अलविदा कहती है।
    note: यहाँ *Bine!* एक छोटी सकारात्मक प्रतिक्रिया है, वही शब्द जो यूनिट 1 के *Bine, mulțumesc.* में था।
  ro.a1.unit05.lesson03.teach.line06:
    title: मुलाक़ात का समापन
    gloss: Mihai भी Ana का नाम लेकर अलविदा कहता है।
    note: वही मित्रतापूर्ण विदाई, जिस पर यूनिट 1 और यूनिट 4 की बातचीत भी खत्म हुई थी।
