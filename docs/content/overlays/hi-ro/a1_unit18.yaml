teaching:
  ro.a1.unit18.lesson01.teach.reminder_ana_mare:
    title: 'दोहराव: Ana, mare'
    gloss: Ana (नाम) · mare (बड़ा)
    note: Ana पात्र का नाम है, जो इकाई 1 से आ रहा है; *mare* इकाई 5 और इकाई 14 से है -- इस इकाई में दोनों का उपयोग उसके घर का वर्णन करने के लिए फिर किया गया है।
  ro.a1.unit18.lesson01.teach.reminder_articole_trei:
    title: 'दोहराव: un, o, și, trei'
    gloss: un/o (एक) · și (और) · trei (तीन)
    note: '*Un*, *o* और *și* इकाई 5 से हैं; *trei* इकाई 2 की गिनती से है -- इस इकाई में चारों का उपयोग कमरे गिनने और बताने के लिए फिर किया गया है।'
  ro.a1.unit18.lesson01.teach.are_vocab:
    title: के पास है
    gloss: Are (उसके पास है)
    note: '*a avea* (होना/पास होना) का एक नया रूप -- आप *am* (मेरे पास है, इकाई 2 और इकाई 5 से) और *aveți* (आपके पास है, औपचारिक) पहले से जानते हैं; *are* इसी क्रिया का अन्य पुरुष रूप है, जिससे बताया जाता है कि किसी व्यक्ति या वस्तु के पास क्या है।'
  ro.a1.unit18.lesson01.teach.casa_vocab:
    title: घर
    gloss: घर
    note: वह जगह जहाँ कोई रहता है।
    example_gloss:
    - अना के पास एक बड़ा घर है।
  ro.a1.unit18.lesson01.teach.camera_vocab:
    title: कमरा
    gloss: कमरा
    note: घर के किसी भी कमरे के लिए सामान्य शब्द।
    example_gloss:
    - अना के पास एक बड़ा कमरा है।
  ro.a1.unit18.lesson01.teach.camere_plural:
    title: Cameră → camere
    gloss: कमरा · कमरे
    note: '*cameră* का बहुवचन *camere* है -- एक से अधिक कमरे गिनते समय इसका उपयोग होता है।'
  ro.a1.unit18.lesson01.teach.dormitor_vocab:
    title: शयनकक्ष
    gloss: शयनकक्ष
    note: वह कमरा जहाँ कोई सोता है।
    example_gloss:
    - अना के पास एक शयनकक्ष है।
  ro.a1.unit18.lesson01.teach.bucatarie_vocab:
    title: रसोई
    gloss: रसोई
    note: वह कमरा जहाँ कोई खाना पकाता है।
    example_gloss:
    - अना के पास एक रसोई है।
  ro.a1.unit18.lesson01.teach.baie_vocab:
    title: स्नानघर
    gloss: बाथरूम
    note: वह कमरा जिसमें नहाने की जगह और शौचालय होता है।
    example_gloss:
    - अना के पास एक बाथरूम है।
  ro.a1.unit18.lesson01.teach.casa_mare_phrase:
    title: 'अना के पास एक बड़ा घर है। उसमें तीन कमरे हैं: एक शयनकक्ष, एक रसोई और एक बाथरूम।'
    gloss: 'अना के पास एक बड़ा घर है। उसमें तीन कमरे हैं: एक शयनकक्ष, एक रसोई और एक बाथरूम।'
    note: 'यहाँ हर शब्द पहले सिखाया जा चुका है या अभी नया आया है, और उन्हें अना के घर के बारे में दो नए वाक्यों में जोड़ा गया है। *Casa*, *casă* का निश्चित रूप है -- ''वह घर'': -ă पर समाप्त होने वाला स्त्रीलिंग संज्ञा शब्द -ă की जगह -a लेता है, जैसे इकाई 8 में *banca* (बैंक)।'
  ro.a1.unit18.lesson02.teach.reminder_mihai_mic:
    title: 'दोहराव: Mihai, mic'
    gloss: Mihai (नाम) · mic (छोटा)
    note: Mihai पात्र का नाम है, जो इकाई 1 से आ रहा है; *mic* इकाई 14 से है -- इस इकाई में दोनों का उपयोग उसके अपार्टमेंट का वर्णन करने के लिए फिर किया गया है।
  ro.a1.unit18.lesson02.teach.reminder_unde_este_doua:
    title: 'दोहराव: unde, este, două'
    gloss: unde (कहाँ) · este (है) · două (दो, स्त्रीलिंग)
    note: '*Unde* और *este* इकाई 8 और इकाई 9 से हैं; *două* इकाई 2 में ''दो'' का स्त्रीलिंग रूप है -- इस इकाई में तीनों का उपयोग कमरों के बारे में पूछने और उन्हें गिनने के लिए फिर किया गया है।'
  ro.a1.unit18.lesson02.teach.apartament_vocab:
    title: अपार्टमेंट
    gloss: अपार्टमेंट
    note: मिहाई का घर -- अना के घर से छोटा विकल्प।
    example_gloss:
    - मिहाई के पास एक छोटा अपार्टमेंट है।
  ro.a1.unit18.lesson02.teach.fereastra_vocab:
    title: खिड़की
    gloss: खिड़की
    note: '*Apartamentul*, *apartament* का निश्चित रूप है -- ''वह अपार्टमेंट'': व्यंजन पर समाप्त होने वाला नपुंसकलिंग संज्ञा शब्द -ul जोड़ता है, जैसे इकाई 8 में *magazinul* (दुकान) (जबकि स्त्रीलिंग *casă* बदलकर *casa* हो जाता है)।'
    example_gloss:
    - अपार्टमेंट में एक बड़ी खिड़की है।
  ro.a1.unit18.lesson02.teach.apartament_mic_phrase:
    title: 'मिहाई के पास एक छोटा अपार्टमेंट है। उसमें दो कमरे हैं: एक शयनकक्ष और एक रसोई।'
    gloss: 'मिहाई के पास एक छोटा अपार्टमेंट है। उसमें दो कमरे हैं: एक शयनकक्ष और एक रसोई।'
    note: यहाँ हर शब्द पहले सिखाया जा चुका है या अभी नया आया है, और उन्हें मिहाई के अपार्टमेंट के बारे में दो नए वाक्यों में जोड़ा गया है।
  ro.a1.unit18.lesson02.teach.unde_este_baia_phrase:
    title: बाथरूम कहाँ है?
    gloss: Unde este baia? (बाथरूम कहाँ है?)
    note: '*Baia*, *baie* का निश्चित रूप है -- ''वह बाथरूम''। किसी के घर जाने पर यह एक काम का सवाल है।'
  ro.a1.unit18.lesson03.teach.reminder_buna_ce_mai_faceti_bine_multumesc:
    title: 'दोहराव: Bună, Ce mai faceți?, Bine, mulțumesc'
    gloss: Bună (नमस्ते) · Ce mai faceți? (आप कैसे हैं, औपचारिक) · Bine, mulțumesc (ठीक हूँ, धन्यवाद)
    note: सब इकाई 1 के शुरुआती अभिवादन से हैं, और यहाँ इस इकाई के संवाद को शुरू करने के लिए फिर लिए गए हैं।
  ro.a1.unit18.lesson03.teach.reminder_la_revedere_mea_aproape_am:
    title: 'दोहराव: La revedere, Mea, Aproape, Am'
    gloss: La revedere (अलविदा) · Mea (मेरी, स्त्रीलिंग) · Aproape (पास में) · Am (मेरे पास है)
    note: '*La revedere* इकाई 1 से है; *mea* इकाई 5 के *Mama mea* से है; *aproape* इकाई 8 और इकाई 9 के *Unde este...?* के उत्तरों से है; *am* इकाई 2 और इकाई 5 से है -- सबका उपयोग यहाँ घर की सैर के संवाद के लिए फिर किया गया है।'
  ro.a1.unit18.lesson03.teach.line01:
    title: अना का अभिवादन करें और हालचाल पूछें
    gloss: मिहाई अना को नमस्ते कहता है और पूछता है कि वह कैसी है।
    note: इकाई 1 के *Ce mai faceți?* अभिवादन का ही फिर उपयोग।
  ro.a1.unit18.lesson03.teach.line02:
    title: उत्तर दें और अपने घर का वर्णन करें
    gloss: अना उत्तर देती है, फिर मिहाई को बताती है कि उसका घर बड़ा है और उसमें तीन कमरे हैं।
    note: इकाई 1 के *Bine, mulțumesc* को इसी इकाई के पहले पाठ के वाक्य से जोड़ा गया है।
  ro.a1.unit18.lesson03.teach.line03:
    title: पूछें कि बाथरूम कहाँ है
    gloss: मिहाई अना से पूछता है कि बाथरूम कहाँ है।
    note: इसी इकाई के दूसरे पाठ के वाक्य का लगभग वैसा ही उपयोग।
  ro.a1.unit18.lesson03.teach.line04:
    title: बताएँ कि बाथरूम कहाँ है
    gloss: अना उसे बताती है कि वह पास में है।
    note: '*baia* को *aproape* से जोड़ा गया है, यानी ''कहाँ है...?'' के उत्तर का वही ढाँचा जो इकाई 8 और इकाई 9 में आ चुका है।'
  ro.a1.unit18.lesson03.teach.line05:
    title: अपने अपार्टमेंट का वर्णन करें और अलविदा कहें
    gloss: मिहाई कहता है कि उसके पास दो कमरों वाला एक छोटा अपार्टमेंट है, फिर अलविदा कहता है।
    note: इसी इकाई के दूसरे पाठ के वाक्य को इकाई 1 की समापन पंक्ति से जोड़ा गया है।
  ro.a1.unit18.lesson03.teach.line06:
    title: अलविदा कहें
    gloss: अना अलविदा कहती है।
    note: वही समापन ढाँचा, जिस पर पिछली हर इकाई का संवाद समाप्त हुआ है।
