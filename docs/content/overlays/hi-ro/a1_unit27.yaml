teaching:
  ro.a1.unit27.lesson01.teach.fericit_trist_suparat:
    title: खुश, उदास और नाराज़
    gloss: खुश, उदास, नाराज़
    note: 'तीन बुनियादी भाव-शब्द, जो *a fi* (''होना'') के साथ आते हैं। हर एक का स्त्रीलिंग रूप *-ă* में बनता है: *fericită*, *tristă*, *supărată*।'
    example_gloss:
    - मैं खुश हूँ।
    - मैं उदास हूँ।
    - मैं नाराज़ हूँ।
  ro.a1.unit27.lesson01.teach.sunt_fericit:
    title: खुश होने की बात कहना
    gloss: मैं खुश हूँ।
    note: '*Sunt* (*a fi* से, ''होना'') + भाव बताने वाला विशेषण बुनियादी ढाँचा है, जैसे हिंदी में "मैं खुश हूँ"; पर रोमानियाई में "मैं" अलग से नहीं कहा जाता। स्त्री कहती है *Sunt fericită*।'
  ro.a1.unit27.lesson01.teach.nu_sunt_suparat:
    title: भावनाओं की तुलना करना
    gloss: मैं नाराज़ नहीं हूँ, मैं उदास हूँ।
    note: 'क्रिया से पहले *Nu* लगाने से वाक्य नकारात्मक बनता है: *Nu sunt supărat*। फिर दूसरा उपवाक्य असली भावना बताता है।'
  ro.a1.unit27.lesson02.teach.de_ce_esti:
    title: कारण पूछना
    gloss: तुम खुश क्यों हो?
    note: '*De ce* (''क्यों'') किसी कारण को पूछने का मानक प्रश्न है।'
  ro.a1.unit27.lesson02.teach.sunt_fericit_pentru:
    title: कारण बताना
    gloss: मैं खुश हूँ क्योंकि मेरे पास नया अपार्टमेंट है।
    note: '*Pentru că* (''क्योंकि'') कारण वाले उपवाक्य को जोड़ता है; शब्द-क्रम सामान्य रहता है: *am un apartament nou*।'
  ro.a1.unit27.lesson02.teach.sunt_trist_pentru:
    title: नकारात्मक कारण
    gloss: मैं उदास हूँ क्योंकि बारिश हो रही है।
    note: रोमानियाई में *Plouă* ('बारिश हो रही है') का कोई अलग कर्ता नहीं होता, इसलिए यह अकेले ही कारण वाला उपवाक्य बन जाता है।
  ro.a1.unit27.lesson03.teach.emotionat:
    title: घबराया हुआ
    gloss: घबराया हुआ
    note: घबराहट के लिए सामान्य शब्द।
    example_gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
  ro.a1.unit27.lesson03.teach.sunt_emotionat_pentru:
    title: बताना कि किस बात से घबराहट है
    gloss: मैं अपनी पहली शिफ़्ट को लेकर घबराया हुआ हूँ।
    note: घबराहट किस बारे में है, यह बताने के लिए रोमानियाई में *pentru* (शाब्दिक अर्थ "के लिए") आता है, जबकि हिंदी में हम "को लेकर" या "के बारे में" कहते हैं।
  ro.a1.unit27.lesson03.teach.nu_ti_face:
    title: किसी को तसल्ली देना
    gloss: चिंता मत करो।
    note: '*Nu-ți face griji* (शाब्दिक अर्थ "अपने लिए चिंताएँ मत बनाओ") तसल्ली देने का मानक बँधा हुआ वाक्यांश है। अजनबी से: *Nu vă faceți griji*।'
  ro.a1.unit27.lesson04.teach.cum_se_simte:
    title: पूछना कि कोई कैसा महसूस करता है
    gloss: मिहाई कैसा महसूस करता है?
    note: '*A se simți* (''महसूस करना'') आत्मवाचक क्रिया है: *mă simt* (मैं), *te simți* (तुम), *se simte* (वह)। भावनाओं के बारे में पूछने या बताने का यही मानक तरीका है।'
  ro.a1.unit27.lesson04.teach.el_se_simte:
    title: बताना कि कोई कैसा महसूस करता है
    gloss: वह घबराया हुआ महसूस कर रहा है।
    note: '*Se* ''वह'' के लिए आत्मवाचक सर्वनाम है और क्रिया से पहले आता है: *se simte*।'
  ro.a1.unit27.lesson04.teach.de_ce_se:
    title: पूछना कि कोई ऐसा क्यों महसूस करता है
    gloss: वह घबराया हुआ क्यों महसूस कर रहा है?
    note: '*El se simte emoționat* के ढाँचे *se simte* को *de ce* के साथ जोड़ा गया है।'
  ro.a1.unit27.lesson05.teach.salut_ana_sunt:
    title: भावनाओं के बारे में एक संदेश पढ़ें
    gloss: नमस्ते अना, मैं अपनी पहली अकेली शिफ़्ट को लेकर थोड़ा घबराया हुआ हूँ। पर मैं खुश भी हूँ, क्योंकि मुझे नई नौकरी और नया अपार्टमेंट मिला है। मुझे लगता है सब ठीक हो जाएगा।
    note: ध्यान दें कि लिखने वाला किस बात से घबराया है, किस बात से खुश है, और कुल मिलाकर उसका नज़रिया क्या है।
    glosses:
      puțin: थोड़ा
      emoționat: घबराया हुआ
      prima: पहली
      tură: शिफ़्ट
      singur: अकेला
      fericit: खुश
      fiindcă: क्योंकि
      nou: नया
      serviciu: काम
      apartament: अपार्टमेंट
      cred: सोचना, मानना
      rezolvă: 'चल जाएगा (यहाँ: सब ठीक हो जाएगा)'
  ro.a1.unit27.lesson06.teach.ana_salut_mihai:
    title: अना पूछती है कि मिहाई कैसा महसूस कर रहा है
    gloss: 'अना: नमस्ते मिहाई, अपनी पहली शिफ़्ट से पहले तुम कैसा महसूस कर रहे हो?'
    note: '*Cum te simți* में आत्मवाचक *te* ("स्वयं को") आता है; *prima ta tură* में स्वामित्व सूचक *ta* स्त्रीलिंग *tură* के अनुसार बदलता है।'
  ro.a1.unit27.lesson06.teach.mihai_sunt_putin:
    title: मिहाई मानता है कि वह घबराया हुआ है
    gloss: 'मिहाई: सच कहूँ तो, मैं थोड़ा घबराया हुआ हूँ।'
    note: '*Sincer să fiu* (''सच कहूँ तो'') बात मानने के लहज़े को नरम कर देता है।'
  ro.a1.unit27.lesson06.teach.ana_nu_ti:
    title: अना उसे तसल्ली देती है
    gloss: 'अना: चिंता मत करो, तुम अच्छे से सँभाल लोगे!'
    note: '*O să te descurci bine* (शाब्दिक अर्थ "तुम अच्छे से सँभाल लोगे") हौसला बढ़ाने वाला बँधा हुआ वाक्यांश है; *o să* + क्रिया से भविष्य काल बनता है।'
  ro.a1.unit27.lesson06.teach.mihai_multumesc_chiar:
    title: मिहाई उसे धन्यवाद देता है
    gloss: 'मिहाई: धन्यवाद, इससे सच में मदद मिलती है।'
    note: '*Ajută*, *a ajuta* (''मदद करना'') का वह/वह (एकवचन) रूप है; यहाँ इसका अर्थ है "इससे मदद मिलती है"।'
  ro.a1.unit27.lesson06.teach.ana_si_dupa:
    title: अना नतीजे का अनुमान बताती है
    gloss: 'अना: और उसके बाद तुम ज़रूर बहुत खुश और गर्वित होगे।'
    note: '*Sigur* (''ज़रूर'') पक्के भरोसे के साथ अनुमान जताता है; *mândru* (''गर्वित'') एक नया उपयोगी विशेषण है (स्त्री के लिए *mândră*)।'
  ro.a1.unit27.lesson06.teach.mihai_da_si:
    title: मिहाई सहमत होता है
    gloss: 'मिहाई: हाँ, मुझे भी ऐसा ही लगता है।'
    note: '*Și eu cred asta* (शाब्दिक अर्थ "मैं भी यह मानता हूँ") किसी की राय से सहमति जताने का स्वाभाविक तरीका है।'
  ro.a1.unit27.lesson06.teach.mihai_este_emotionat:
    title: este, lui और îl का सार
    gloss: मिहाई अपनी पहली शिफ़्ट को लेकर घबराया हुआ है। अना उसकी मदद करती है।
    note: '*Este*, *a fi* (''होना'') का वह/वह (एकवचन) रूप है; संज्ञा के बाद *lui* का अर्थ "उसका" है; *îl* का अर्थ "उसे" है और क्रिया से पहले आता है: *îl ajută*। किसी दूसरे व्यक्ति के बारे में बात करने के लिए ये तीन छोटे पर ज़रूरी शब्द हैं।'
