teaching:
  ro.a1.unit02.lesson01.teach.zero:
    title: Zero
    gloss: शून्य
    note: '*Zero* का रूप कभी नहीं बदलता, और इसे किसी लंबी संख्या या फ़ोन नंबर के भीतर अंक को ज़ोर से पढ़ने के लिए भी प्रयोग किया जाता है।'
    example_gloss: शून्य, एक, दो।
  ro.a1.unit02.lesson01.teach.unu:
    title: एक
    gloss: एक
    note: अकेले गिनते समय *unu* रूप आता है। पुल्लिंग या नपुंसकलिंग संज्ञा से पहले यह छोटा होकर *un* हो जाता है (*un câine*, एक कुत्ता); स्त्रीलिंग संज्ञा से पहले यह *o* बन जाता है (*o sută*, एक सौ)।
    example_gloss: एक, दो, तीन।
  ro.a1.unit02.lesson01.teach.doi:
    title: दो (पुल्लिंग)
    gloss: दो
    note: '*Doi* पुल्लिंग संज्ञाओं के साथ आता है (*doi bărbați*, दो पुरुष)। स्त्रीलिंग संज्ञाओं के साथ, और नपुंसकलिंग संज्ञाओं के साथ भी, जो बहुवचन में स्त्रीलिंग की तरह चलती हैं, दूसरा रूप आता है; अगला कार्ड देखिए।'
    example_gloss: दो, तीन, चार।
  ro.a1.unit02.lesson01.teach.doi_doua_gender:
    title: '"दो" लिंग के अनुसार बदलता है'
    gloss: दो (पुल्लिंग) / दो (स्त्रीलिंग और नपुंसकलिंग)
    note: हिंदी में "दो" का रूप संज्ञा के लिंग से नहीं बदलता, पर रोमानियाई में *doi* का एक अलग स्त्रीलिंग रूप *două* है। यह स्त्रीलिंग संज्ञाओं के साथ अनिवार्य है (*două femei*, दो स्त्रियाँ) और नपुंसकलिंग संज्ञाओं के साथ भी, जो बहुवचन में स्त्रीलिंग होती हैं (*două numere*, दो संख्याएँ)। एक (*un*/*o*) और दो को छोड़कर, *trei* से *zece* तक की संख्याएँ हर लिंग के लिए एक जैसी रहती हैं।
  ro.a1.unit02.lesson01.teach.trei:
    title: तीन
    gloss: तीन
    note: '*Trei* हर लिंग के लिए एक जैसा रहता है।'
    example_gloss: तीन, चार, पाँच।
  ro.a1.unit02.lesson01.teach.patru:
    title: चार
    gloss: चार
    note: '*Patru* का रूप नहीं बदलता। ग्यारह से उन्नीस में इसके अनियमित संक्षिप्त रूप पर ध्यान दीजिए: *paisprezece* (14), *patrusprezece* नहीं।'
    example_gloss: चार, पाँच, छह।
  ro.a1.unit02.lesson01.teach.cinci:
    title: पाँच
    gloss: पाँच
    note: '*Cinci* का रूप नहीं बदलता।'
    example_gloss: पाँच, छह, सात।
  ro.a1.unit02.lesson01.teach.sase:
    title: छह
    gloss: छह
    note: '*Șase* का रूप नहीं बदलता।'
    example_gloss: छह, सात, आठ।
  ro.a1.unit02.lesson01.teach.sapte:
    title: सात
    gloss: सात
    note: '*Șapte* का रूप नहीं बदलता।'
    example_gloss: सात, आठ, नौ।
  ro.a1.unit02.lesson01.teach.opt:
    title: आठ
    gloss: आठ
    note: '*Opt* कभी रूप नहीं बदलता।'
    example_gloss: आठ, नौ, दस।
  ro.a1.unit02.lesson01.teach.noua:
    title: नौ
    gloss: नौ
    note: '*Nouă* कभी रूप नहीं बदलता। इसे ऊपर के विशेष चिह्न के बिना लिखा जाए तो यह *noua* ("वाला/वाली नया", स्त्रीलिंग) जैसा ही दिखेगा -- इसलिए *ă* ज़रूर टाइप कीजिए: टाइप किए गए उत्तर चिह्नों के साथ जाँचे जाते हैं।'
    example_gloss: नौ, दस... बस हो गया!
  ro.a1.unit02.lesson01.teach.zece:
    title: दस
    gloss: दस
    note: '*Zece* कभी रूप नहीं बदलता, और ग्यारह से आगे की हर संख्या का आधार है (*zece* + *-sprezece*)।'
    example_gloss: दस! शाबाश!
  ro.a1.unit02.lesson02.teach.unsprezece:
    title: ग्यारह
    gloss: ग्यारह
    note: '*Unsprezece* शाब्दिक रूप से *unu* + *spre* + *zece* से बना है ("दस के ऊपर एक"); यहाँ से आगे की हर संख्या इसी ढंग से बनती है।'
    example_gloss: दस, ग्यारह, बारह।
  ro.a1.unit02.lesson02.teach.teens_pattern:
    title: बारह से उन्नीस तक
    gloss: doisprezece (12), treisprezece (13), paisprezece (14), cincisprezece (15), șaisprezece (16), șaptesprezece (17), optsprezece (18), nouăsprezece (19)
    note: 'हर संख्या में अंक के सामान्य रूप के साथ *-sprezece* जुड़ता है: *doi* → *doisprezece*, *trei* → *treisprezece*, और इसी तरह *nouă* → *nouăsprezece* तक। दो संख्याएँ नियम से हटकर हैं: चौदह में *patru* छोटा होकर *pai-* बन जाता है (*paisprezece*, *patrusprezece* नहीं), और सोलह में *șase* बदलकर *șai-* हो जाता है (*șaisprezece*, *șasesprezece* नहीं)।'
  ro.a1.unit02.lesson02.teach.douazeci:
    title: बीस
    gloss: बीस
    note: '*Douăzeci* ("दो दहाइयाँ") अपने आप में एक अलग शब्द है, और 21 से 29 तक की हर संख्या इसी पर बनती है।'
    example_gloss: उन्नीस, बीस...
  ro.a1.unit02.lesson02.teach.douazeci_si_unu:
    title: इक्कीस
    gloss: इक्कीस
    note: 'इक्कीस से आगे रोमानियाई में दहाई और इकाई को *și* ("और") से जोड़ा जाता है: *douăzeci și unu*, *douăzeci și doi*, इत्यादि -- जबकि ग्यारह से उन्नीस तक की संख्याएँ मिलकर एक ही शब्द बन जाती हैं।'
    example_gloss: बीस, इक्कीस, बाईस।
  ro.a1.unit02.lesson02.teach.tens_pattern:
    title: तीस से नब्बे तक
    gloss: treizeci (30), patruzeci (40), cincizeci (50), șaizeci (60), șaptezeci (70), optzeci (80), nouăzeci (90)
    note: 'तीस से ऊपर की हर दहाई अंक के साथ *-zeci* ("दहाइयाँ") जोड़कर बनती है -- *trei* → *treizeci*, *patru* → *patruzeci*, इत्यादि। वर्तनी में एकमात्र बदलाव साठ में है: *șase* बदलकर *șai-* हो जाता है और *șaizeci* बनता है (वही *șai-* जो *șaisprezece* में है)। 70, 80, 90 के लिए बीसों के आधार पर गिनती नहीं होती; ये भी सीधे अंक + -zeci से बनते हैं।'
  ro.a1.unit02.lesson02.teach.o_suta:
    title: सौ
    gloss: सौ
    note: '*O sută* में *o* आता है ("एक" का स्त्रीलिंग रूप), *un* नहीं, क्योंकि *sută* स्त्रीलिंग संज्ञा है।'
    example_gloss: नब्बे, सौ!
  ro.a1.unit02.lesson03.teach.cati_ani_ai:
    title: अनौपचारिक रूप से उम्र पूछना
    gloss: तुम्हारी उम्र कितनी है?
    note: शाब्दिक अर्थ है "आपके कितने वर्ष हैं"। उम्र बताने के लिए रोमानियन में *avea* (होना नहीं, "रखना") का प्रयोग होता है, जैसा फ़्रेंच के *avoir* वाले ढाँचे में होता है। *Câți* (कितने, पुल्लिंग) पुल्लिंग शब्द *ani* (वर्ष) के अनुरूप रूप है।
  ro.a1.unit02.lesson03.teach.am_nouasprezece_ani:
    title: अपनी उम्र बताइए (बीस से कम)
    gloss: मेरी उम्र उन्नीस साल है।
    note: '*Am*, *avea* का *eu* वाला रूप है। बीस से कम संख्याओं में *ani* से पहले *de* की ज़रूरत नहीं होती।'
  ro.a1.unit02.lesson03.teach.cati_ani_aveti:
    title: औपचारिक रूप से उम्र पूछना
    gloss: तुम्हारी उम्र कितनी है?
    note: '*Aveți*, *avea* का *dumneavoastră* वाला रूप है, जो इकाई 1 में सीखे गए आदरसूचक स्तर से मेल खाता है।'
  ro.a1.unit02.lesson03.teach.am_treizeci_de_ani:
    title: अपनी उम्र बताइए (बीस और उससे अधिक)
    gloss: मेरी उम्र तीस साल है।
    note: यहाँ *de* इसलिए आया है कि *treizeci* बीस या उससे बड़ी संख्या है -- पूरा नियम अगले कार्ड में देखिए।
  ro.a1.unit02.lesson03.teach.de_insertion_rule:
    title: संज्ञा से पहले de कब लगाएँ
    gloss: '2-19: de नहीं (doi ani) / 20 से ऊपर: de लगाएँ (treizeci de ani)'
    note: 'यह रोमानियाई का अपना नियम है, जिसका हिंदी में कोई सीधा समानांतर नहीं है: 2 से 19 तक की संख्याएँ सीधे संज्ञा से जुड़ती हैं (*doi ani*, दो साल; *nouăsprezece ani*, उन्नीस साल), लेकिन 20 और उससे ऊपर संख्या और संज्ञा के बीच *de* आता है (*treizeci de ani*, तीस साल; *o sută de ani*, सौ साल)। "एक" का मामला अलग है (*un an*, एक साल -- एकवचन, दोनों में *de* नहीं)।'
  ro.a1.unit02.lesson03.teach.care_e_numarul_tau:
    title: अनौपचारिक ढंग से फ़ोन नंबर पूछिए
    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: किसी निश्चित, मौजूद संख्या को पूछने का स्वाभाविक तरीका *Care* (कौन-सा) है, *ce* नहीं। *Număr* नपुंसकलिंग संज्ञा है; एकवचन में यह पुल्लिंग की तरह चलती है, इसलिए "*तुम्हारा*" के लिए *tău* आता है, *ta* नहीं।
  ro.a1.unit02.lesson03.teach.care_este_numarul_dvs:
    title: औपचारिक ढंग से फ़ोन नंबर पूछिए
    gloss: तुम्हारा फ़ोन नंबर क्या है?
    note: '*Este*, *e* का पूरा रूप है, जो सावधानी या औपचारिक बोलचाल में अधिक चलता है। *Dumneavoastră* बातचीत को आदरपूर्ण रखता है; यह वही शब्द है जो इकाई 1 में सिखाया गया था।'
  ro.a1.unit02.lesson03.teach.raspuns_telefon:
    title: फ़ोन नंबर अंक-अंक करके बताइए
    gloss: 'नंबर है: शून्य, सात, दो, एक, चार, पाँच, छह, सात, आठ, नौ।'
    note: इस इकाई में नंबर केवल एक-एक अंक करके पढ़ा जाता है। असल में कोई दो-दो अंकों को जोड़कर भी बोल सकता है, पर एक-एक अंक हमेशा समझ में आ जाता है।
