course:
  title: हिन्दी में रोमानियाई A1
  description: शून्य से सौ तक की संख्याएँ, जिनमें ग्यारह से उन्नीस तक (-sprezece) और दहाइयों (-zeci) के बनने के ढंग, doi/două का लिंग-भेद, तथा संख्याओं की मदद से किसी की उम्र और फ़ोन नंबर पूछना-बताना शामिल है। यह पाठ इकाई 1 के Ana और Mihai की कहानी को आगे बढ़ाता है।
