course:
  title: हिन्दी में रोमानियाई A1
  description: 'किसी व्यक्ति के बुनियादी रूप-रंग का वर्णन करने के लिए शुरुआती रोमानियाई: कद और उम्र का आभास, बालों और आँखों का रंग, मुख्य प्रश्न Cum arată ...?, और दो लोगों के रूप-रंग की तुलना।'
