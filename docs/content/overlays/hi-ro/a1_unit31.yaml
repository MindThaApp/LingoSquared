teaching:
  ro.a1.unit31.lesson01.teach.inalt_scund:
    title: लंबा और नाटा
    gloss: लंबा / नाटा
    note: '*Înalt* लंबे व्यक्ति के लिए और *scund* छोटे कद के व्यक्ति के लिए आता है। दोनों के स्त्रीलिंग रूप हैं: *înaltă*, *scundă*।'
    example_gloss:
    - Elena लंबी है।
    - Andrei छोटे कद का है।
  ro.a1.unit31.lesson01.teach.batran_tanar:
    title: बुज़ुर्ग और जवान
    gloss: बुज़ुर्ग / जवान
    note: '*Bătrân* और *tânăr* यहाँ उम्र का सामान्य आभास बताते हैं, सही वर्षों की संख्या नहीं। स्त्रीलिंग रूप: *bătrână*, *tânără*।'
    example_gloss:
    - दादाजी बुज़ुर्ग हैं।
    - Mihai जवान है।
  ro.a1.unit31.lesson01.teach.pentru_varsta_exacta:
    title: 'Bătrân: आभास या संख्या'
    gloss: सही उम्र जानने के लिए आप Câți ani ai? पूछते हैं, जबकि bătrân सामान्य आभास देता है, जैसे Bunicul este bătrân में।
    note: सही उम्र पूछने के लिए आप *Câți ani ai?* कह सकते हैं। यहाँ *bătrân* बताता है कि कोई उम्र में कैसा दिखता है, बिना किसी संख्या के।
  ro.a1.unit31.lesson01.teach.elena_este_inalta:
    title: Elena लंबी है और Andrei छोटे कद का है
    gloss: Elena लंबी है और Andrei छोटे कद का है।
    note: '*și* (और) से जुड़ा एक सरल वाक्य, जो पाठ 5 की सीधी तुलना की तैयारी करता है; विशेषण उद्देश्य (कर्ता) के अनुसार बदलता है: Elena के लिए *înaltă*, Andrei के लिए *scund*।'
  ro.a1.unit31.lesson02.teach.parul:
    title: बाल
    gloss: बाल
    note: '*Păr* पुल्लिंग संज्ञा है; निश्चयवाचक उपसर्ग-प्रत्यय अंत में जुड़ता है: *părul* (बाल)।'
    example_gloss: Mihai के बाल छोटे और काले हैं।
  ro.a1.unit31.lesson02.teach.blond_maro_carunt:
    title: सुनहरा, भूरा और स्लेटी
    gloss: सुनहरा / भूरा / स्लेटी
    note: बालों के तीन रंग। ये संज्ञा *păr* (पुल्लिंग) के बाद आते हैं, इसलिए आप कहते हैं *părul blond*, *păr maro*, *păr cărunt*।
    example_gloss:
    - Ana के बाल सुनहरे हैं।
    - Andrei के बाल भूरे हैं।
    - दादाजी के बाल स्लेटी हैं।
  ro.a1.unit31.lesson02.teach.lung_scurt:
    title: लंबे और छोटे (बाल)
    gloss: लंबे / छोटे (बाल)
    note: '*Lung* (लंबा) और *scurt* (छोटा) बालों की लंबाई बताते हैं; रंगों की तरह ये भी संज्ञा के बाद आते हैं।'
    example_gloss:
    - Elena के बाल लंबे हैं।
    - Andrei के बाल छोटे हैं।
  ro.a1.unit31.lesson02.teach.adjectivul_vine_dupa:
    title: विशेषण संज्ञा के बाद आता है
    gloss: 'विशेषण संज्ञा के बाद आता है: păr scurt, păr lung, păr blond, păr maro, păr cărunt, păr negru.'
    note: रोमानियाई में विशेषण संज्ञा के बाद आता है (*păr scurt*), जबकि हिंदी में वह संज्ञा से पहले आता है ("छोटे बाल")।
  ro.a1.unit31.lesson02.teach.posesivul_vine_dupa:
    title: उसका/उसकी संज्ञा के बाद आता है
    gloss: 'अधिकारवाचक शब्द संज्ञा के बाद आता है: părul ei (उसके बाल), ochii lui (उसकी आँखें)।'
    note: '*Ei* का अर्थ है "उस स्त्री का" और *lui* का अर्थ है "उस पुरुष का"; दोनों संज्ञा के बाद आते हैं: *părul ei*। संदर्भ से पता चलता है कि किसकी बात है।'
  ro.a1.unit31.lesson02.teach.mihai_are_parul:
    title: Mihai के बाल छोटे और काले हैं
    gloss: Mihai के बाल छोटे और काले हैं।
    note: '*Negru* (काला) रंग बताने वाला विशेषण है; यह संज्ञा के बाद आता है: *păr negru*।'
  ro.a1.unit31.lesson02.teach.ana_are_parul:
    title: Ana के बाल लंबे और सुनहरे हैं
    gloss: Ana के बाल लंबे और सुनहरे हैं।
    note: इस पाठ की लंबाई और रंग की शब्दावली एक स्वाभाविक वाक्य में एक साथ आई है।
  ro.a1.unit31.lesson03.teach.ochii:
    title: आँखें
    gloss: आँखें
    note: '*Ochi* (आँख/आँखें) एकवचन और बहुवचन में एक जैसा दिखता है; संख्या निश्चयवाचक प्रत्यय से पता चलती है: *ochiul* (आँख), *ochii* (आँखें)।'
    example_gloss: Mihai की आँखें भूरी हैं।
  ro.a1.unit31.lesson03.teach.albastru_maro_verde:
    title: नीला, भूरा और हरा
    gloss: नीला / भूरा / हरा
    note: '*Albastru* (नीला), *maro* (भूरा) और *verde* (हरा) रंग बताने वाले विशेषण हैं। *Maro* कभी नहीं बदलता; बहुवचन में *albastru* का *albaștri* और *verde* का *verzi* हो जाता है।'
    example_gloss:
    - Ana की आँखें नीली हैं।
    - Andrei की आँखें भूरी हैं।
    - Elena की आँखें हरी हैं।
  ro.a1.unit31.lesson03.teach.la_plural_adjectivul:
    title: बहुवचन विशेषण
    gloss: 'बहुवचन में विशेषण बदलता है: ochi albaștri, ochi maro, ochi verzi.'
    note: बहुवचन *ochi* के साथ विशेषण बहुवचन रूप लेता है (*albaștri*, *verzi*); *maro* वैसा ही रहता है। एकवचन *păr albastru* से तुलना कीजिए।
  ro.a1.unit31.lesson03.teach.cum_arata_ana:
    title: Ana कैसी दिखती है?
    gloss: Ana कैसी दिखती है?
    note: '*Cum arată ...?* इस यूनिट का मुख्य प्रश्न है; इसे किसी के भी रूप-रंग के बारे में पूछने के लिए इस्तेमाल कीजिए।'
  ro.a1.unit31.lesson03.teach.ana_are_parul:
    title: आना के लंबे सुनहरे बाल और नीली आँखें हैं
    gloss: आना के लंबे सुनहरे बाल और नीली आँखें हैं।
    note: एक आदर्श उत्तर, जिसमें *și* से बाल और आँखें एक ही वाक्य में जोड़ी गई हैं।
  ro.a1.unit31.lesson04.teach.ana_vine_o:
    title: आना नीना का परिचय देती है
    gloss: 'आना: भाषा-कैफ़े में एक नई लड़की आ रही है। उसका नाम नीना है।'
    note: '*Vine o fată nouă* (“एक नई लड़की आ रही है”) किसी नए व्यक्ति का परिचय देता है; *O cheamă Nina* उसका नाम बताता है।'
  ro.a1.unit31.lesson04.teach.mihai_bine_cum:
    title: मिहाई पूछता है कि वह कैसी दिखती है
    gloss: 'मिहाई: अच्छा! वह कैसी दिखती है?'
    note: 'यह इस यूनिट के मुख्य प्रश्न को बिना नाम के दोहराता है: *Cum arată?* (व्यक्ति संदर्भ से स्पष्ट है)।'
  ro.a1.unit31.lesson04.teach.ana_este_scunda:
    title: आना नीना का कद और बाल बताती है
    gloss: 'आना: वह नाटी है और उसके बाल छोटे और सुनहरे हैं।'
    note: पाठ 1 के *scundă* को पाठ 2 की बालों की शब्दावली के साथ जोड़ता है।
  ro.a1.unit31.lesson04.teach.mihai_si_ochii:
    title: मिहाई उसकी आँखों के बारे में पूछता है
    gloss: 'मिहाई: और आँखें?'
    note: '*Și ochii?* (“और आँखें?”) एक छोटा अगला प्रश्न है; व्यक्ति संदर्भ से समझ में आता है।'
  ro.a1.unit31.lesson04.teach.ana_are_ochi:
    title: आना नीना की आँखें बताती है
    gloss: 'आना: उसकी आँखें हरी हैं।'
    note: पाठ 3 के *ochi verzi* का दोबारा प्रयोग।
  ro.a1.unit31.lesson04.teach.mihai_multumesc_atunci:
    title: मिहाई उसे पहचान लेगा
    gloss: 'मिहाई: शुक्रिया! तब तो मैं उसे ज़रूर पहचान लूँगा।'
    note: '*O recunosc* का अर्थ है “मैं उसे पहचान लूँगा”: *o* कर्म सर्वनाम “उसे” है और यह क्रिया से पहले आता है।'
  ro.a1.unit31.lesson05.teach.andrei_si_elena:
    title: आंद्रेई और एलेना की तुलना
    gloss: आंद्रेई और एलेना भाई-बहन हैं, पर वे अलग-अलग दिखते हैं। आंद्रेई नाटा है, उसके बाल छोटे और भूरे हैं और आँखें भूरी हैं। एलेना आंद्रेई से लंबी है, उसके बाल लंबे और भूरे हैं और आँखें हरी हैं। आप कैसे दिखते हैं?
    note: अब तक सिखाए गए हर रंग और लंबाई के शब्द इस्तेमाल करने वाली छोटी तुलना, जो अंत में पाठक से इकाई का मुख्य सवाल पूछती है।
    glosses:
      frate: भाई
      soră: बहन
      arată: दिखना
      diferit: अलग
      scund: छोटा
      scurt: छोटा
      maro: भूरा
      părul: बाल
      ochi: आँखें
      înaltă: ज़्यादा लंबा
      lung: लंबा
      verzi: हरा
      arăți: दिखना (जैसे आप कैसे दिखते हैं)
  ro.a1.unit31.lesson05.teach.comparativul_se_formeaza:
    title: mai ... decât से तुलना
    gloss: 'तुलना mai + विशेषण + decât से बनती है: Elena este mai înaltă decât Andrei.'
    note: 'रोमानियाई में *mai* (“अधिक”) विशेषण से पहले और *decât* (“से”) दूसरे व्यक्ति से पहले आता है: *mai înaltă decât Andrei*।'
  ro.a1.unit31.lesson05.teach.elena_are_parul:
    title: एलेना के बाल आंद्रेई से लंबे हैं
    gloss: एलेना के बाल आंद्रेई से लंबे हैं।
    note: '*Mai lung* भी *decât* से पहले इसी तरह काम करता है: *părul mai lung decât Andrei*; विशेषण फिर भी *părul* के बाद आता है।'
  ro.a1.unit31.lesson05.teach.am_parul_scurt:
    title: मेरे बाल छोटे और भूरे हैं
    gloss: मेरे बाल छोटे और भूरे हैं।
    note: '*Am ...* वाला एक आदर्श वाक्य, जिसे अपना रूप-रंग बताते समय दोहराया जा सकता है।'
  ro.a1.unit31.lesson06.teach.mihai_uite_ea:
    title: मिहाई को नीना दिखती है
    gloss: 'मिहाई: देखो, क्या वह नीना है? उसके बाल छोटे और सुनहरे हैं और आँखें हरी हैं।'
    note: '*Uite* (“देखो”) किसी चीज़ की ओर ध्यान दिलाता है; *ea e Nina?* का अर्थ है “क्या वह नीना है?”।'
  ro.a1.unit31.lesson06.teach.ana_da_ea:
    title: आना पुष्टि करती है
    gloss: 'आना: हाँ, वह नीना है!'
    note: एक छोटी, स्वाभाविक पुष्टि।
  ro.a1.unit31.lesson06.teach.nina_salut_tu:
    title: नीना मिहाई का अभिवादन करती है
    gloss: 'नीना: नमस्ते, क्या तुम मिहाई हो?'
    note: 'एक सरल अनौपचारिक अभिवादन-प्रश्न: *tu ești ...?*'
  ro.a1.unit31.lesson06.teach.mihai_da_ma:
    title: मिहाई भी नीना का अभिवादन करता है
    gloss: 'मिहाई: हाँ! तुमसे मिलकर खुशी हुई, नीना।'
    note: '*Mă bucur să te cunosc* (“तुमसे मिलकर खुशी हुई”) पहली बार मिलने पर कहा जाने वाला सामान्य वाक्यांश है।'
  ro.a1.unit31.lesson06.teach.nina_si_eu:
    title: Nina भी अभिवादन लौटाती है
    gloss: 'Nina: तुमसे मिलकर मुझे भी खुशी हुई!'
    note: 'संवाद का अंत: मिहाई ने आना के पहले के वर्णन से नीना को सफलतापूर्वक पहचान लिया।'
