teaching:
  ro.a1.unit20.lesson01.teach.reminder_vreau_un_ce:
    title: 'दोहराव: Vreau, Un, Ce'
    gloss: Vreau (मुझे चाहिए) · Un (एक, पुल्लिंग/नपुंसक) · Ce (क्या/कौन सा)
    note: '*Vreau* (मुझे चाहिए), *un* (एक) और *ce* (क्या, जैसे *Ce mai faceți?* में) ऐसे शब्द हैं जो आप पहले से जानते हैं -- यहाँ इन्हें कपड़े माँगने के लिए फिर इस्तेमाल किया गया है।'
  ro.a1.unit20.lesson01.teach.tricou_vocab:
    title: टी-शर्ट
    gloss: Tricou (टी-शर्ट)
    note: यह नपुंसक संज्ञा है -- पहले देखी गई पुल्लिंग/नपुंसक संज्ञाओं की तरह इसके साथ *o* नहीं, *un* आता है, जैसे *un leu*।
    example_gloss:
    - मुझे एक टी-शर्ट चाहिए।
  ro.a1.unit20.lesson01.teach.culoare_vocab:
    title: रंग
    gloss: Culoare (रंग)
    note: यह स्त्रीलिंग संज्ञा है, जो यह पूछने में काम आती है कि कोई चीज़ किस रंग में मिलती है।
    example_gloss:
    - कौन-सा रंग?
  ro.a1.unit20.lesson01.teach.rosu_vocab:
    title: लाल
    gloss: Roșu (लाल)
    note: 'यह जिस संज्ञा का वर्णन करता है उसके बाद आता है, जो रोमानियाई विशेषण का सामान्य क्रम है: *tricou roșu*, शब्दशः "टी-शर्ट लाल"।'
    example_gloss:
    - मुझे एक लाल टी-शर्ट चाहिए।
  ro.a1.unit20.lesson01.teach.albastru_vocab:
    title: नीला
    gloss: Albastru (नीला)
    note: '*roșu* जैसा ही नियम -- संज्ञा के बाद आता है: *tricou albastru*।'
    example_gloss:
    - मुझे एक नीली टी-शर्ट चाहिए।
  ro.a1.unit20.lesson01.teach.vreau_tricou_rosu_phrase:
    title: मुझे एक लाल टी-शर्ट चाहिए।
    gloss: Vreau un tricou roșu.
    note: 'मुख्य अनुरोध: *vreau* (मुझे चाहिए) + *un tricou* (एक टी-शर्ट) + *roșu* (लाल), रंग संज्ञा के बाद आता है।'
  ro.a1.unit20.lesson02.teach.reminder_cat_costa_va_rog:
    title: 'दोहराव: Cât, Costă, Vă, Rog'
    gloss: Cât costă? (कितने का है?) · Vă rog (कृपया, औपचारिक)
    note: '*Cât costă?* बाज़ार वाले पाठ से है; *vă rog* औपचारिक "कृपया" है -- यहाँ कपड़े का दाम पूछने और अनुरोध को विनम्र बनाने के लिए फिर इस्तेमाल हुए हैं।'
  ro.a1.unit20.lesson02.teach.reminder_mic_mica_mare:
    title: 'दोहराव: Mic, Mică, Mare'
    gloss: Mic/Mică (छोटा/छोटी, पुल्लिंग-नपुंसक/स्त्रीलिंग) · Mare (बड़ा/बड़ी, एकवचन में पुल्लिंग और स्त्रीलिंग के लिए एक ही रूप)
    note: खाने-पीने की चीज़ों की तुलना से आप ये आकार वाले शब्द पहले से जानते हैं -- यहाँ कपड़ों के साइज़ के लिए फिर इस्तेमाल हुए हैं।
  ro.a1.unit20.lesson02.teach.pantaloni_vocab:
    title: पैंट
    gloss: Pantaloni (पतलून)
    note: रोमानियाई में यह सामान्यतः बहुवचन में इस्तेमाल होता है, जैसे हिंदी में "पतलून" एक जोड़ी के लिए कहा जाता है -- *pantaloni* का अर्थ एक पतलून है।
    example_gloss:
    - मुझे पतलून चाहिए।
  ro.a1.unit20.lesson02.teach.marime_vocab:
    title: साइज़
    gloss: Mărime (साइज़)
    note: यह स्त्रीलिंग संज्ञा है -- ऊपर दोहराए गए स्त्रीलिंग *mică* (छोटी) के साथ आती है, और *mare* (बड़ी) का रूप नहीं बदलता।
    example_gloss:
    - कौन-सा साइज़?
  ro.a1.unit20.lesson02.teach.ce_marime_phrase:
    title: कौन सा साइज़?
    gloss: Ce mărime? (कौन सा साइज़?)
    note: दुकान के काउंटर का रोज़ का सवाल -- छोटा और बिना क्रिया का, ठीक *Ce culoare?* (कौन सा रंग?) की तरह।
  ro.a1.unit20.lesson02.teach.marime_mica_va_rog_phrase:
    title: छोटा साइज़, कृपया।
    gloss: Mărime mică, vă rog.
    note: '*Mică*, *mic* का स्त्रीलिंग रूप है जो स्त्रीलिंग *mărime* के अनुसार आया है -- दोहराए गए *vă rog* के साथ अपना साइज़ विनम्रता से बताने के लिए।'
  ro.a1.unit20.lesson02.teach.cat_costa_pantalonii_phrase:
    title: पतलून कितने की है?
    gloss: Cât costă pantalonii? (पतलून कितने की है?)
    note: '*Pantalonii*, *pantaloni* का निश्चित रूप है ("वह पतलून") -- पुल्लिंग बहुवचन संज्ञाओं में "वह" के भाव के लिए *-i* जुड़ता है (*pantaloni* → *pantalonii*)। इसे दोहराए गए *cât costă* के साथ जोड़ा गया है।'
  ro.a1.unit20.lesson03.teach.reminder_buna_multumesc_bine_la_revedere_si:
    title: 'दोहराव: Bună, Mulțumesc, Bine, La revedere, Și'
    gloss: Bună (नमस्ते) · Mulțumesc (धन्यवाद) · Bine (अच्छा/ठीक) · La revedere (अलविदा) · Și (और)
    note: रोज़ के अभिवादन और *și* (और) -- यहाँ दुकान की बातचीत शुरू और खत्म करने के लिए फिर इस्तेमाल हुए हैं।
  ro.a1.unit20.lesson03.teach.reminder_zece_douazeci_de_lei:
    title: 'दोहराव: Zece, Douăzeci, De, Lei'
    gloss: Zece (दस) · Douăzeci (बीस) · De (का/की, बीस और उससे ऊपर की संख्या में lei से पहले आता है) · Lei (मुद्रा, leu का बहुवचन)
    note: संख्याएँ और मुद्रा *leu/lei* आप पहले से जानते हैं -- यहाँ टी-शर्ट और पतलून के दाम के लिए फिर इस्तेमाल हुई हैं।
  ro.a1.unit20.lesson03.teach.line01:
    title: मिहाई को नमस्ते कहें और लाल टी-शर्ट माँगें
    gloss: अना मिहाई को नमस्ते कहती है और बताती है कि उसे एक लाल टी-शर्ट चाहिए।
    note: 'पहले पाठ का अनुरोध वाला वाक्य: *Vreau un tricou roșu.*'
  ro.a1.unit20.lesson03.teach.line02:
    title: साइज़ पूछें
    gloss: मिहाई पूछता है कि उसे कौन सा साइज़ चाहिए।
    note: दुकान का रोज़ का सवाल *Ce mărime?* (कौन सा साइज़?)।
  ro.a1.unit20.lesson03.teach.line03:
    title: विनम्रता से साइज़ बताएँ और दाम पूछें
    gloss: अना छोटा साइज़ माँगती है, फिर पूछती है कि कितने का है।
    note: '*Mărime mică, vă rog* (छोटा साइज़, कृपया), फिर *Cât costă?* (कितने का है?)।'
  ro.a1.unit20.lesson03.teach.line04:
    title: दाम बताएँ
    gloss: मिहाई बताता है कि यह पचास लei का है।
    note: दोहराए गए *cincizeci de lei* का प्रयोग।
  ro.a1.unit20.lesson03.teach.line05:
    title: सहमति जताएँ और पतलून के बारे में भी पूछें
    gloss: अना सहमत होती है, फिर कहती है कि उसे पतलून भी चाहिए और उसका दाम पूछती है।
    note: 'यहाँ *Și* का अर्थ "भी" है: *Vreau și pantaloni* -- "मुझे पतलून भी चाहिए।"'
  ro.a1.unit20.lesson03.teach.line06:
    title: पतलून का दाम बताएँ
    gloss: मिहाई बताता है कि पतलून एक सौ बीस लei की है।
    note: 'बीस से ऊपर की संख्या में रोमानियाई संख्या और संज्ञा के बीच *de* रखती है: *o sută douăzeci de lei*।'
  ro.a1.unit20.lesson03.teach.line07:
    title: मिहाई को धन्यवाद दें और अलविदा कहें
    gloss: अना उसे धन्यवाद देती है और अलविदा कहती है।
    note: विनम्र धन्यवाद और अलविदा।
  ro.a1.unit20.lesson03.teach.line08:
    title: अलविदा कहें
    gloss: मिहाई अलविदा कहता है।
    note: सीधा-सा अलविदा, साथ में अना का नाम।
