teaching:
  ro.a1.unit15.lesson01.teach.reminder_gara_ora:
    title: 'दोहराव: gară, este, la, ce, oră, ora, nouă'
    gloss: gară (रेलवे स्टेशन) · este (है) · la (पर/को) · ce (क्या/कौन-सा) · oră (घंटा) · ora (वह घंटा/बजे) · nouă (नौ)
    note: 'Gară यूनिट 8/यूनिट 9 से है; este/la/ce/oră/ora/nouă यूनिट 4 (समय) से हैं -- यह यूनिट 4 का "la ce oră"/"la ora nouă" वाला ढाँचा नए काम के लिए दोहराती है: कक्षा की जगह ट्रेन के बारे में पूछना।'
  ro.a1.unit15.lesson01.teach.tren_vocab:
    title: ट्रेन
    gloss: Tren (ट्रेन)
    note: 'नपुंसकलिंग, व्यंजन पर खत्म होने वाला (एकवचन में नपुंसकलिंग संज्ञाएँ पुल्लिंग जैसी चलती हैं: *un tren*) -- ''वह ट्रेन'' के लिए *-ul* लेता है, जैसे *magazin*->*magazinul*; *gară* जैसी *-ă* वाली संज्ञाएँ इसके बजाय *-a* लेती हैं (*gara*)।'
    example_gloss:
    - ट्रेन स्टेशन पर है।
  ro.a1.unit15.lesson01.teach.pleaca_vocab:
    title: जाती है / रवाना होती है
    gloss: (वह) रवाना होता है
    note: ट्रेन, बस या विमान के रवाना होने के लिए प्रयुक्त क्रिया। *Trenul pleacă* में *este* की ज़रूरत नहीं है, क्योंकि *pleacă* अपने आप में पूरी क्रिया है।
    example_gloss:
    - ट्रेन रवाना होती है।
  ro.a1.unit15.lesson01.teach.trenul_pleaca_ora_noua_phrase:
    title: ट्रेन नौ बजे रवाना होती है
    gloss: ट्रेन नौ बजे रवाना होती है।
    note: इसमें *trenul* + *pleacă* को इकाई 4 के *la ora nouă* के साथ जोड़ा गया है; समय के लिए कोई नया शब्द नहीं है।
  ro.a1.unit15.lesson01.teach.la_ce_ora_pleaca_trenul_phrase:
    title: ट्रेन कितने बजे रवाना होती है?
    gloss: ट्रेन किस समय रवाना होती है?
    note: इकाई 4 का ही *La ce oră...?* प्रश्न-ढाँचा, अब कक्षा की जगह *trenul* के बारे में पूछने के लिए।
  ro.a1.unit15.lesson01.teach.peron_vocab:
    title: प्लेटफ़ॉर्म
    gloss: प्लेटफ़ॉर्म
    note: रेलवे प्लेटफ़ॉर्म। यह नपुंसक लिंग का शब्द है और व्यंजन पर समाप्त होता है, इसलिए "वह प्लेटफ़ॉर्म" *peronul* कहलाता है; *tren*→*trenul* जैसा ही *-ul* अंत।
    example_gloss:
    - ट्रेन प्लेटफ़ॉर्म तीन पर है।
  ro.a1.unit15.lesson01.teach.de_la_ce_peron_phrase:
    title: ट्रेन किस प्लेटफ़ॉर्म से रवाना होती है?
    gloss: ट्रेन किस प्लेटफ़ॉर्म से रवाना होती है?
    note: '*De la* (से) + *ce peron* (कौन-सा प्लेटफ़ॉर्म); यहाँ सारे शब्द पहले सिखाए जा चुके हैं, बस एक नए प्रश्न में जुड़े हैं।'
  ro.a1.unit15.lesson02.teach.reminder_as_dori_va_rog_cat_costa:
    title: 'याद रखें: aș dori, vă rog, cât costă, costă, lei'
    gloss: मैं चाहूँगा/चाहूँगी · कृपया (औपचारिक) · कितने का है · इतने का है · लेई (रोमानिया की मुद्रा)
    note: ये सब इकाई 6 (खाना) और इकाई 7 (खरीदारी) से हैं; इस इकाई में विनम्र अनुरोध और दाम की वही भाषा खाने की जगह ट्रेन का टिकट खरीदने के लिए इस्तेमाल हुई है।
  ro.a1.unit15.lesson02.teach.bilet_vocab:
    title: टिकट
    gloss: टिकट
    note: ट्रेन का टिकट। यह नपुंसक लिंग का शब्द है (एकवचन में पुल्लिंग की तरह *un* लेता है), इसलिए "एक टिकट" *un bilet* कहलाता है।
    example_gloss:
    - मेरे पास एक टिकट है।
  ro.a1.unit15.lesson02.teach.bucuresti_vocab:
    title: बुखारेस्ट
    gloss: बुखारेस्ट
    note: रोमानिया की राजधानी; इस कोर्स में गंतव्य का सबसे स्वाभाविक उदाहरण।
    example_gloss:
    - ट्रेन बुखारेस्ट के लिए रवाना होती है।
  ro.a1.unit15.lesson02.teach.as_dori_bilet_bucuresti_phrase:
    title: मुझे बुखारेस्ट का एक टिकट चाहिए, कृपया
    gloss: मुझे बुखारेस्ट का एक टिकट चाहिए, कृपया।
    note: इकाई 6 और 7 का *Aș dori... vă rog* विनम्रता-ढाँचा, अब खाने की जगह टिकट माँगने के लिए।
  ro.a1.unit15.lesson02.teach.cat_costa_bilet_bucuresti_phrase:
    title: बुखारेस्ट का टिकट कितने का है?
    gloss: बुखारेस्ट का टिकट कितने का है?
    note: इकाई 7 का ही *Cât costă...?* दाम पूछने वाला प्रश्न, अब एक किलो आलू की जगह टिकट के बारे में।
  ro.a1.unit15.lesson02.teach.costa_zece_lei_phrase:
    title: यह चालीस लेई का है
    gloss: यह चालीस लेई का है।
    note: 2 से 19 तक की संख्याओं के बाद *lei* से पहले *de* नहीं आता, पर 20 और उससे ऊपर की संख्याओं के बाद आता है, जैसे patruzeci de lei। यही नियम इकाई 7 में आ चुका है।
  ro.a1.unit15.lesson03.teach.reminder_travel_words:
    title: 'याद रखें: tren, pleacă, peron, bilet, București, trei, am'
    gloss: ट्रेन · रवाना होता है · प्लेटफ़ॉर्म · टिकट · बुखारेस्ट · तीन (इकाई 2 से) · मेरे पास है (इकाई 2 से)
    note: ट्रेन, रवाना होना, प्लेटफ़ॉर्म, टिकट और बुखारेस्ट इसी इकाई के पाठों से हैं; "तीन" और "मेरे पास है" इकाई 2 (संख्याएँ) से दोबारा लिए गए हैं, क्योंकि Ana और Mihai स्टेशन पर "प्लेटफ़ॉर्म तीन" और "मेरे पास टिकट है" साथ-साथ कहते हैं।
  ro.a1.unit15.lesson03.teach.reminder_buna_multumesc_la_revedere_ana_mihai:
    title: 'याद रखें: bună, mulțumesc, la revedere, Ana, Mihai'
    gloss: नमस्ते · धन्यवाद · फिर मिलेंगे · Ana, Mihai (नाम)
    note: ये सब पिछली इकाइयों में आ चुके हैं; कोर्स के हर संवाद में यही मित्रतापूर्ण शुरुआत और अंत रहा है।
  ro.a1.unit15.lesson03.teach.drum_bun_vocab:
    title: यात्रा शुभ हो
    gloss: यात्रा शुभ हो / शुभ यात्रा
    note: यात्रा पर निकल रहे व्यक्ति से कही जाने वाली तयशुदा विदाई। शाब्दिक अर्थ है "अच्छा रास्ता", पर इसका प्रयोग हिंदी के "शुभ यात्रा" की तरह होता है।
    example_gloss:
    - शुभ यात्रा, Mihai!
  ro.a1.unit15.lesson03.teach.line01:
    title: अभिवादन और ट्रेन के बारे में पूछना
    gloss: Ana, Mihai को नमस्ते कहती है और पूछती है कि ट्रेन किस समय रवाना होती है।
    note: इसी इकाई के पहले पाठ का प्रश्न, अब सीधे Mihai से पूछा गया।
  ro.a1.unit15.lesson03.teach.line02:
    title: रवाना होने का समय बताना
    gloss: Mihai कहता है कि ट्रेन नौ बजे रवाना होती है।
    note: इसी इकाई के पहले पाठ का वाक्य ज्यों का त्यों।
  ro.a1.unit15.lesson03.teach.line03:
    title: प्लेटफ़ॉर्म के बारे में पूछना
    gloss: Ana पूछती है कि किस प्लेटफ़ॉर्म से।
    note: एक छोटा अगला प्रश्न; *de la ce peron* पहले पाठ में पूरा पूछा जा चुका है, यहाँ Ana इसे संक्षेप में पूछती है और बाकी की उम्मीद Mihai से करती है।
  ro.a1.unit15.lesson03.teach.line04:
    title: प्लेटफ़ॉर्म और टिकट बताना
    gloss: Mihai कहता है कि प्लेटफ़ॉर्म तीन से, और उसके पास बुखारेस्ट का टिकट है।
    note: इसी इकाई के प्लेटफ़ॉर्म और टिकट/बुखारेस्ट के शब्द एक ही उत्तर में जुड़े हैं।
  ro.a1.unit15.lesson03.teach.line05:
    title: शुभ यात्रा कहना और विदा लेना
    gloss: Ana, Mihai को शुभ यात्रा की शुभकामना देती है और विदा लेती है।
    note: इस पाठ का *Drum bun* प्रयुक्त है; यह यात्रा की विशेष विदाई है, कोर्स के आम अकेले *la revedere* की जगह।
  ro.a1.unit15.lesson03.teach.line06:
    title: धन्यवाद कहना और विदा लेना
    gloss: Mihai, Ana को धन्यवाद देता है और विदा लेता है।
    note: वही समापन-ढंग जिस पर पिछली हर इकाई का संवाद खत्म हुआ है।
