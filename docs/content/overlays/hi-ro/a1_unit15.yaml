course:
  title: हिन्दी में रोमानियाई A1
  description: रोमानियाई में ट्रेन यात्रा की बुनियादी बातें संभालना -- Tren (ट्रेन), Bilet (टिकट), Peron (प्लेटफ़ॉर्म) और Pleacă (रवाना होती है) -- जब Mihai București के लिए ट्रेन पकड़ता है और Ana उसे gară पर विदा करती है।
