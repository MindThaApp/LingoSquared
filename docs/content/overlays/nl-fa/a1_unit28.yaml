    title: 'Lezen: de reizen van Nima en Sara'
    gloss: Nima gaat elke dag met de bus naar zijn werk. Soms loopt hij ook. Sara gaat elke dag met de fiets naar school.
    note: Deze tekst hergebruikt alle constructies uit les 1-4 plus *می‌ره*/*مدرسه* uit les 5 – bijna geen nieuwe woorden, je herkent ze nu in een samenhangende tekst.
