    title: Ik ga met de bus
    gloss: Ik ga met de bus
    note: '*با اتوبوس می‌رم* bestaat uit *با* + *اتوبوس* + *می‌رم* (''ik ga'').'
  fa.a1.unit28.lesson01.teach.metro_word:
    title: Metro
    gloss: metro
    note: '*مترو* is een gewoon leenwoord: het metrosysteem van Teheran heet echt *مترو*.'
    example_gloss: Ik ga met de metro.
