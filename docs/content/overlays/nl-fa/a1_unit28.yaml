    title: 'Nima: Ik ga elke dag met de bus naar mijn werk. En jij?'
    gloss: Ik ga elke dag met de bus naar mijn werk. En jij?
  fa.a1.unit28.lesson06.teach.dialogue_line2:
    title: 'Sara: Ik ga met de fiets naar school.'
    gloss: Ik ga met de fiets naar school.
  fa.a1.unit28.lesson06.teach.dialogue_line3:
    title: 'Nima: Bus of fiets, wat is beter?'
    gloss: Bus of fiets, wat is beter?
  fa.a1.unit28.lesson06.teach.dialogue_line4:
    title: 'Sara: De fiets is beter, omdat het sport is.'
    gloss: De fiets is beter, omdat het sport is.
  fa.a1.unit28.lesson06.teach.dialogue_line5:
    title: 'Nima: Ja, maar soms ga ik ook te voet.'
    gloss: Ja, maar soms ga ik ook te voet.
  fa.a1.unit28.lesson06.teach.dialogue_line6:
    title: 'Sara: Wat fijn!'
    gloss: Wat fijn!
