course:
  title: Farsi in het Nederlands A1
  description: 'Perzisch (Iran) voor beginners: vervoermiddelen benoemen (bus, metro, auto, fiets, te voet, taxi), vertellen hoe je je regelmatig verplaatst (elke dag met de bus naar je werk), vragen welk vervoer beter is (اتوبوس یا مترو، کدوم بهتره؟), naar de prijs van een lokaal kaartje vragen en een korte zin over dienstregelingen lezen, een leestekst over de dagelijkse reizen van نیما en سارا, en een afsluitende dialoog tussen نیما en سارا waarin ze vergelijken hoe ze zich verplaatsen.'
