    title: Ik ga met de auto
    gloss: Ik ga met de auto
    note: '*با ماشین می‌رم* volgt hetzelfde patroon *با* + vervoermiddel + *می‌رم*.'
  fa.a1.unit28.lesson02.teach.docharkhe_word:
    title: Fiets
    gloss: fiets
    note: '*دوچرخه* betekent ''fiets'', letterlijk ''twee wiel''.'
