  description: 'Farsi voor beginners (Iran): sporten benoemen (voetbal, basketbal, volleybal, zwemmen), vragen "Welke sport vind je leuk?", zeggen waar je sport (sportschool, zwembad, park), vertellen hoe vaak je sport (elke dag, elke week, soms, N keer), een korte leestekst over het sportschema van نیما en een afsluitend gesprek tussen نیما en سارا waarin ze vergelijken welke sporten ze doen, hoe vaak en waar.'
