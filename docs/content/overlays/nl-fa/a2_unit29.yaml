teaching:
  fa.a2.unit29.lesson01.teach.places:
    title: Regels en plaatsen
    gloss: regels, huisregels, bibliotheek, zwembad, sportschool
    note: '*قانون* is een regel. Een huis, een bibliotheek, een zwembad en een sportschool hebben allemaal *قانون‌ها* (regels).'
    example_gloss:
    - De bibliotheek heeft regels.
    - Het zwembad en de sportschool hebben ook regels.
    - Een huis heeft ook regels.
  fa.a2.unit29.lesson01.teach.must:
    title: 'باید: iets is verplicht'
    gloss: je moet gaan; je moet douchen; je moet een pas meenemen
    note: '*باید* + aanvoegende wijs = „moeten”. Het werkwoord staat na *باید* in de aanvoegende vorm (*بری*, *بگیری*, *بیاری*), zonder *می‌*.'
  fa.a2.unit29.lesson01.teach.must_not:
    title: 'نباید: iets is verboden'
    gloss: je mag niet eten; je mag niet schreeuwen
    note: '*نباید* + aanvoegende wijs = „niet mogen”. Het zegt dat de handeling verboden is. Het werkwoord erna is bevestigend: *بخوری*, *بزنی*.'
  fa.a2.unit29.lesson01.teach.not_needed:
    title: 'لازم نیست: het is niet nodig'
    gloss: je hoeft niet te komen; je hoeft niet te betalen
    note: '*لازم نیست* + aanvoegende wijs = „je hoeft niet”. De handeling is optioneel, niet verboden.'
  fa.a2.unit29.lesson02.teach.rule_phrases:
    title: Regelzinnen
    gloss: stil zijn, het boek terugbrengen, een handdoek meenemen, sportschoenen dragen, rennen
    note: Elke zin is een aanvoegende vorm op *-ی* voor een vriend („je”). Gebruik hem na *باید* of *نباید*.
    example_gloss:
    - Je moet stil zijn.
    - Je moet het boek terugbrengen.
    - Je moet sportschoenen dragen.
  fa.a2.unit29.lesson02.teach.where:
    title: Waar en wanneer een regel geldt
    gloss: in de bibliotheek, in het zwembad, in de sportschool, vóór het zwembad
    note: '*توی* betekent “in” en *قبل از* betekent “vóór”. Ze staan meestal aan het begin van de regel.'
    example_gloss:
    - In de bibliotheek moet je stil zijn.
    - Voor het zwembad moet je douchen.
    - In de sportschool moet je sportschoenen dragen.
  fa.a2.unit29.lesson02.teach.polite:
    title: 'Vreemden en mededelingen: de uitgang van شما'
    gloss: u moet stil zijn (beleefd of meervoud); u moet douchen (beleefd of meervoud)
    note: 'Tegen vreemden, functionarissen of meerdere mensen verandert de uitgang van *-ی* in *-ید*: *باشی* wordt *باشید*, *بگیری* wordt *بگیرید*. Mededelingen gebruiken deze vorm.'
  fa.a2.unit29.lesson02.teach.no_mi:
    title: Geen می‌ na باید
    gloss: je moet gaan; je mag niet gaan
    note: Na *باید*, *نباید* en *لازم نیست* staat het werkwoord in de gewone subjunctief (*بری*), niet in de tegenwoordige tijd met *می‌*.
  fa.a2.unit29.lesson03.teach.contrast:
    title: نباید is niet hetzelfde als لازم نیست
    gloss: je mag niet komen; je hoeft niet te komen
    note: In het Nederlands zijn “niet hoeven” en “niet mogen” ook verschillend, en in het Farsi is dat net zo. *نباید بیای* = komen is verboden. *لازم نیست بیای* = je mag komen, maar het hoeft niet.
  fa.a2.unit29.lesson03.teach.notice_form:
    title: 'Mededelingen: ممنوعه'
    gloss: eten is verboden; rennen is verboden
    note: 'Op borden en mededelingen staat vaak de handeling met *ممنوعه* (“verboden”): *غذا خوردن ممنوعه*. Tegen een vriend zeg je *نباید غذا بخوری*.'
  fa.a2.unit29.lesson03.teach.extra_rules:
    title: Nog twee regels
    gloss: een kaartje kopen, de afwas doen
    note: 'Deze uitdrukkingen volgen in de oefeningen op *لازم نیست*: je mag het doen, maar het hoeft niet.'
    example_gloss:
    - Je hoeft geen kaartje te kopen.
    - Je hoeft de afwas niet te doen.
    - Je mag niet eten in het zwembad.
  fa.a2.unit29.lesson04.teach.permission:
    title: Om toestemming vragen
    gloss: Mag ik binnenkomen? Is het goed als ik hier zit?
    note: '*می‌تونم* + subjunctief betekent “Mag ik / Kan ik?” (*می‌تونم بیام؟*). *مشکلی نداره* + subjunctief betekent “Is het goed als…?” (*مشکلی نداره بشینم؟*).'
  fa.a2.unit29.lesson04.teach.answers:
    title: Antwoorden op een vraag om toestemming
    gloss: Ja, dat mag. Nee, dat mag niet. Ja, geen probleem. Nee, het is verboden.
    note: Ja zeg je met *آره، می‌تونی* of *آره، مشکلی نداره*. Nee zeg je met *نه، نمی‌تونی* of *نه، ممنوعه*.
  fa.a2.unit29.lesson04.teach.ejaze:
    title: Nog een beleefde vraag
    gloss: Mag ik binnenkomen?
    note: '*اجازه هست؟* is een beleefde manier om te vragen of je iets mag doen. In deze unit hoef je het alleen te herkennen.'
  fa.a2.unit29.lesson04.teach.house:
    title: 'Huisregels: afval scheiden'
    gloss: het afval scheiden, het plastic in de papierbak gooien
    note: '*زباله رو جدا کردن* is afval scheiden. De regel zegt dat plastic niet in de papierbak hoort.'
    example_gloss:
    - Je moet het afval scheiden.
    - Je mag het plastic niet in de papierbak gooien.
  fa.a2.unit29.lesson04.teach.night:
    title: Een regel voor de stilte
    gloss: '''s Nachts mag je niet luid praten'
    note: '*بلند حرف زدن* is hard praten. *شب* (’s nachts) staat vooraan.'
    example_gloss:
    - ’s Nachts mag je niet hard praten.
  fa.a2.unit29.lesson05.teach.notice:
    title: Een mededeling met regels
    gloss: Regels. In de bibliotheek moet u stil zijn. Eten is verboden. Voor het zwembad moet u douchen. Rennen in het zwembad is verboden. In de sportschool moet u sportschoenen dragen, maar u hoeft geen handdoek mee te nemen. U moet het afval scheiden.
    note: Een mededeling richt zich tot vreemden, dus gebruikt ze de uitgang *-ید*. Lees één keer op wat verplicht, verboden en niet nodig is.
  fa.a2.unit29.lesson06.teach.turn01:
    title: Sara vraagt om toestemming
    gloss: Sara vraagt of ze ook mee mag naar het zwembad.
    note: '*مشکلی نداره* + subjunctief vraagt om toestemming.'
  fa.a2.unit29.lesson06.teach.turn02:
    title: Toestemming en een verplichting
    gloss: Nima zegt ja, en dat ze eerst moet douchen.
    note: Het antwoord staat het toe en voegt dan een verplichting toe.
  fa.a2.unit29.lesson06.teach.turn03:
    title: Sara vraagt wat verplicht is
    gloss: Sara vraagt of ze een handdoek mee moet nemen.
    note: '*باید* + *بیارم* vraagt naar een verplichting.'
  fa.a2.unit29.lesson06.teach.turn04:
    title: Niet nodig en verboden
    gloss: Nima zegt dat ze geen handdoek hoeft mee te nemen, maar dat ze niet in het zwembad mag rennen.
    note: '*لازم نیست* betekent dat het niet hoeft; *نباید* betekent dat het verboden is.'
  fa.a2.unit29.lesson06.teach.turn05:
    title: Een tweede vraag
    gloss: Sara vraagt of ze daarna naar de sportschool mag komen.
    note: '*می‌تونم* + subjunctief vraagt “Mag ik?”'
  fa.a2.unit29.lesson06.teach.turn06:
    title: Een laatste regel
    gloss: Nima zegt ja, maar dat ze sportschoenen moet dragen.
    note: 'Weer: eerst toestemming, dan de regel.'
