  fa.a1.unit21.lesson06.teach.turn02:
    title: De medewerker vraagt hoeveel dollars
    gloss: De medewerker begroet Sara en vraagt hoeveel dollars ze heeft.
    note: Hergebruikt چقدر دلار دارید؟ uit les 2.
  fa.a1.unit21.lesson06.teach.turn03:
    title: Sara noemt het bedrag en vraagt naar de koers
    gloss: Sara zegt dat ze honderd dollar heeft en vraagt naar de koers van vandaag.
    note: صد (honderd) is nieuw; نرخ امروز چنده؟ hergebruikt de koersvraag uit les 5.
  fa.a1.unit21.lesson06.teach.turn04:
    title: De medewerker noemt de koers
    gloss: De medewerker zegt dat elke dollar 30 toman is.
    note: Hergebruikt هر دلار سی تومنه uit les 5.
  fa.a1.unit21.lesson06.teach.turn05:
    title: Sara stemt in en vraagt de medewerker door te gaan
    gloss: Sara stemt in en vraagt de medewerker het alstublieft te wisselen.
    note: لطفاً تبدیل کنید, eerder in deze les geleerd.
  fa.a1.unit21.lesson06.teach.turn06:
    title: De medewerker overhandigt het totaal
    gloss: Alstublieft, drieduizend toman.
    note: '*سه هزار تومن* = 100 dollar × 30 toman per dollar. *هزار* (duizend) is herhaling uit de unit over getallen.'
  fa.a1.unit21.lesson06.teach.turn07:
    title: Sara bedankt de medewerker en vraagt ook om wisselgeld
    gloss: Dank u wel. Heeft u ook wisselgeld?
    note: Hergebruikt پول خرد دارید؟ uit les 4, met هم (ook).
  fa.a1.unit21.lesson06.teach.turn08:
    title: De medewerker bevestigt en overhandigt het
    gloss: Ja, alstublieft.
    note: بله (ja) is een herhalingswoord; بفرمایید sluit de wissel af.
