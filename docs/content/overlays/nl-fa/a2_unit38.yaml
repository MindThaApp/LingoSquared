teaching:
  fa.a2.unit38.lesson01.teach.polite_words:
    title: Beleefde openingszinnen
    gloss: pardon, weet u, ik weet het niet
    note: '*ببخشید* opent een beleefde vraag aan een onbekende. *می‌دونید* is de beleefde *شما*-vorm van "weet u".'
    example_gloss:
    - Pardon, weet u hoe laat het is?
    - Ik weet het niet, sorry.
  fa.a2.unit38.lesson01.teach.places:
    title: Plaatsen en een kaartje
    gloss: station, kantoor, museum, bibliotheek, kaartje
    note: '*کتابخونه* is de gewone gesproken vorm van "bibliotheek"; in verzorgd schrift gebruik je *کتابخانه*.'
    example_gloss:
    - Het station is daar.
    - Het kantoor is hier.
    - Het museum is daar.
    - De bibliotheek is hier.
    - Het kaartje is hier.
  fa.a2.unit38.lesson01.teach.where_time:
    title: Waar is het? Hoe laat is het?
    gloss: waar is het, hoe laat is het, het is hier, het is daar
    note: '*ساعت چنده* vraagt naar de tijd. *اینجاست* en *اونجاست* zijn typische korte antwoorden over een plaats.'
    example_gloss:
    - Waar is het kantoor?
    - Hoe laat is het?
    - De bibliotheek is hier.
  fa.a2.unit38.lesson01.teach.frame:
    title: 'Het beleefde zinsdeel: می‌دونید + vraag'
    gloss: Pardon, weet u waar het station is? Pardon, weet u hoe laat het is?
    note: 'Om een onbekende beleefd iets te vragen, zet je *ببخشید، می‌دونید* voor de gewone vraag. De vraag zelf verandert niet: *ایستگاه کجاست؟* wordt *ببخشید، می‌دونید ایستگاه کجاست؟*.'
  fa.a2.unit38.lesson02.teach.open_closed:
    title: Open, gesloten, vandaag, morgen
    gloss: open, gesloten, vandaag, morgen
    note: '*باز* betekent "open" en *بسته* betekent "gesloten". *هست* geeft aan dat iets zo is.'
    example_gloss:
    - Het museum is vandaag open.
    - Het kantoor is vandaag gesloten.
    - Het museum is morgen open.
    - De bibliotheek is morgen gesloten.
  fa.a2.unit38.lesson02.teach.when_or_not:
    title: Wanneer, of, niet, ja
    gloss: wanneer, het wordt / het gebeurt, of, nee / niet, ja
    note: '*باز می‌شه* betekent "het gaat open"; *بسته می‌شه* betekent "het gaat dicht". *نه* is "nee" en vormt ook het einde van het paar *یا نه* ("of niet").'
    example_gloss:
    - Wanneer gaat het museum open?
    - Is het open of niet?
    - Ja, het is open.
  fa.a2.unit38.lesson02.teach.when_pattern:
    title: 'Ingebed "wanneer": het vraagwoord blijft op zijn plaats'
    gloss: Weet u wanneer het museum opengaat?
    note: 'In het Nederlands verschuift het werkwoord in een bijzin ("wanneer het museum opengaat"). In het Perzisch verandert er niets: *موزه کی باز می‌شه؟* volgt gewoon op *می‌دونید*. Het vraagwoord *کی* blijft precies staan waar het in de directe vraag staat.'
  fa.a2.unit38.lesson02.teach.whether_pattern:
    title: 'Ingebedde ja/nee-vraag: ... یا نه'
    gloss: Weet u of het museum open is (of niet)?
    note: Voor "of" neem je de gewone bewering *موزه باز هست* en sluit je af met *یا نه*. Het Nederlands gebruikt het voegwoord "of" aan het begin; het Perzisch voegt *یا نه* aan het einde toe.
  fa.a2.unit38.lesson03.teach.you_forms:
    title: Jij tegen een vriend, u tegen een onbekende
    gloss: jij (vriend), u (beleefd), weet je (vriend)
    note: Sara en Nima zijn vrienden, dus zeggen ze *تو* en *می‌دونی*. Tegen een onbekende gebruik je *شما* en *می‌دونید*.
    example_gloss:
    - Sara, weet je waar het kantoor is?
    - Weet u waar het kantoor is? (tegen een onbekende)
  fa.a2.unit38.lesson03.teach.same_order:
    title: De woordvolgorde verandert niet
    gloss: Waar is het station? Weet u waar het station is?
    note: 'De directe vraag en de ingebedde vraag hebben precies dezelfde woorden in dezelfde volgorde: *ایستگاه کجاست؟* / *می‌دونید ایستگاه کجاست؟*. Alleen het beleefde zinsdeel komt erbij. In het Perzisch wordt de vraag nooit omgezet zoals in het Nederlands ("waar het station is").'
  fa.a2.unit38.lesson03.teach.friend_stranger:
    title: می‌دونی of می‌دونید?
    gloss: weet je (vriend); weet u (onbekende)
    note: Gebruik *می‌دونی* bij een vriend en *می‌دونید* bij een onbekende, een medewerker of iedereen die je beleefd aanspreekt. Een beleefde vraag aan een onbekende begint ook met *ببخشید*.
  fa.a2.unit38.lesson03.teach.dont_know:
    title: 'Ik weet niet ...: een bewering, geen vraag'
    gloss: Ik weet niet waar het station is; ik weet niet waar het station is
    note: '*نمی‌دونم* krijgt dezelfde ingebedde vraag: *نمی‌دونم موزه کی باز می‌شه*. Het is een bewering, dus er staat geen vraagteken. Je mag er *که* achter zetten (*نمی‌دونم که ...*), maar in gesproken Perzisch laat men het meestal weg.'
  fa.a2.unit38.lesson03.teach.ke:
    title: که (optioneel verbindingswoord)
    gloss: dat (optioneel verbindingswoord)
    note: Hier verbindt *که* alleen *نمی‌دونم* met de vraag. Het voegt niets toe aan de betekenis en wordt meestal weggelaten.
    example_gloss:
    - Ik weet niet waar het kantoor is.
  fa.a2.unit38.lesson04.teach.directions:
    title: Wegwijzingen die je kunt horen
    gloss: rechtdoor, ga (beleefd), kant/richting, rechts, links, dan, en
    note: 'Een onbekende antwoordt met beleefde bevelen: *مستقیم برید* "ga rechtdoor". *سمت راست* is "rechts" en *سمت چپ* "links".'
    example_gloss:
    - Ga rechtdoor.
    - Ga naar rechts.
    - Ga rechtdoor en dan naar links.
  fa.a2.unit38.lesson04.teach.times_thanks:
    title: Uren en bedankt
    gloss: acht uur, vijf uur, dank u / bedankt
    note: '*ساعت هشت* is "om acht uur". Zeg *ممنون* na elk antwoord.'
    example_gloss:
    - Het museum gaat om acht uur open.
    - Het kantoor sluit om vijf uur.
    - Bedankt!
  fa.a2.unit38.lesson04.teach.package:
    title: Eén beleefd pakket
    gloss: Pardon, weet u wanneer het kantoor sluit?
    note: 'Bouw elke beleefde vraag in drie stappen op: *ببخشید*, dan *می‌دونید*, dan de gewone vraag met zijn eigen vraagwoord (*کجاست*, *کی ... می‌شه*, *... هست یا نه*). Binnen de vraag verschuift niets.'
  fa.a2.unit38.lesson05.teach.greeting:
    title: Hallo en ik
    gloss: hallo, ik
    note: '*من* is zelden nodig, omdat de uitgang van het werkwoord al "ik" betekent. Het wordt toegevoegd voor nadruk of contrast.'
    example_gloss:
    - Hallo, ik weet het niet.
    - Morgen ga ik naar het museum.
  fa.a2.unit38.lesson05.teach.reading:
    title: Een kort briefje om informatie te vragen
    gloss: Hallo. Pardon, weet u waar het kantoor is? Weet u of het morgen open is? Ik weet het niet. Bedankt. Nima
    note: Lees één keer om de twee vragen te vinden, en lees dan nog eens om het beleefde zinsdeel in elke vraag te zien.
  fa.a2.unit38.lesson06.teach.passerby:
    title: Voorbijganger
    gloss: voorbijganger (een onbekende op straat)
    note: 'Let op: de ingebedde vraag volgt op dezelfde manier op *می‌دونه* ("hij/zij weet"): er verschuift niets.'
    example_gloss:
    - De voorbijganger weet waar het kantoor is.
  fa.a2.unit38.lesson06.teach.turn01:
    title: Sara vraagt het aan haar vriend
    gloss: 'Sara vraagt aan Nima, met de vriendenvorm: Weet je waar het kantoor is?'
    note: Ze gebruikt *می‌دونی* omdat ze vrienden zijn.
  fa.a2.unit38.lesson06.teach.turn02:
    title: Nima vraagt het aan een onbekende
    gloss: Nima weet het niet, dus vraagt hij een voorbijganger met het beleefde zinsdeel.
    note: Hij stapt over op *می‌دونید* voor de onbekende.
  fa.a2.unit38.lesson06.teach.turn03:
    title: De voorbijganger wijst hem de weg
    gloss: 'Ja: ga rechtdoor. Het kantoor is aan de rechterkant.'
    note: Het antwoord gebruikt beleefde bevelen.
  fa.a2.unit38.lesson06.teach.turn04:
    title: Nima vraagt of het open is
    gloss: Bedankt. Weet u of het kantoor open is?
    note: De tweede vraag gebruikt *یا نه*.
  fa.a2.unit38.lesson06.teach.turn05:
    title: Het is open en sluit om vijf uur
    gloss: Ja, het is open. Het sluit om vijf uur.
    note: 'Twee feiten: nu open, sluit om vijf uur.'
  fa.a2.unit38.lesson06.teach.turn06:
    title: Nima bedankt en vertelt het aan Sara
    gloss: Bedankt. Sara, het kantoor is daar.
    note: Hij bedankt de vreemdeling en vertelt het aan zijn vriendin.
