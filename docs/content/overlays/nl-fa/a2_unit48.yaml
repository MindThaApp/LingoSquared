teaching:
  fa.a2.unit48.lesson01.teach.greet_words:
    title: Openings- en slotwoorden
    gloss: hoi, hoe gaat het, wat is er nieuw, sorry, tot ziens
    note: Een vriendelijk bericht begint met *سلام* en de naam, vaak gevolgd door *خوبی؟* of *چه خبر؟*. *ببخش که ...* is een korte verontschuldiging. *فعلا* sluit een bericht af, zoals „tot straks” of „doei”.
    example_gloss:
    - Hoi Nima, hoe gaat het?
    - Wat is er nieuw?
    - Sorry dat ik niet gebeld heb.
    - Doei, Sara
  fa.a2.unit48.lesson01.teach.time_words:
    title: Tijdwoorden voor een bericht
    gloss: gisteren, het weekend, vrijdag, zaterdag, morgen, later
    note: 'Zet het tijdwoord vooraan: het vertelt je vriend of je het over iets hebt wat gebeurd is of over wat nog komt.'
    example_gloss:
    - Ik was gisteren moe.
    - Ik had in het weekend werk.
    - Op vrijdag ging ik naar het park.
    - Ik bel je morgen.
    - Ik kom op zaterdag.
    - Ik bel je later.
  fa.a2.unit48.lesson01.teach.message_shape:
    title: De opbouw van een vriendelijk bericht
    gloss: Hoi Sara, hoe gaat het? Op vrijdag ging ik naar het park. Morgen wil ik naar de bioscoop gaan. Doei, Nima
    note: 'Een informeel bericht heeft vier delen: begroeting, wat er gebeurd is (verleden), wat er nog komt (toekomst) en een afsluiting. Korte zinnen en de gesproken vormen *می‌خوام* en *بهت* zijn heel normaal; een formele briefopening heb je niet nodig.'
  fa.a2.unit48.lesson02.teach.birthday_gift:
    title: Verjaardag en cadeau
    gloss: verjaardag(sfeestje), cadeau
    note: '*تولد* is een verjaardag, en in spreektaal betekent *رفتم تولد دوستم* ook „ik ging naar het verjaardagsfeestje van mijn vriend”.'
    example_gloss:
    - Op vrijdag ging ik naar de verjaardag van mijn vriend.
    - Ik heb een cadeau voor mijn vriend gekocht.
    - Sara heeft een cadeau.
  fa.a2.unit48.lesson02.teach.celebration_words:
    title: Feesten en felicitaties
    gloss: feest, bruiloft, felicitaties, gelukkig
    note: '*جشن* is een feest, *عروسی* is een bruiloft, en *مبارک* volgt op de gelegenheid in korte, vriendelijke felicitaties.'
    example_gloss:
    - Op vrijdag ging ik naar een feest.
    - De bruiloft was op vrijdag.
    - Gefeliciteerd met je verjaardag!
  fa.a2.unit48.lesson02.teach.message_news:
    title: Nieuws delen in een bericht
    gloss: ik heb gestuurd, ik heb gehoord, succes, bedankt
    note: Met deze woorden zeg je wat je hebt gestuurd of gehoord en reageer je op het succes van een vriend.
    example_gloss:
    - Ik heb een bericht gestuurd.
    - Ik heb het nieuws gehoord.
    - Gefeliciteerd met je succes!
  fa.a2.unit48.lesson02.teach.past_verbs:
    title: Verleden tijd om te vertellen wat er gebeurd is
    gloss: ik ging, ik zag, ik at, ik kwam, ik bleef, ik kocht, ik schreef, wij gingen
    note: 'Het einde van de verleden tijd is *ـم* voor „ik” en *ـیم* voor „wij”. De ontkenning voegt *ن* toe: *نرفتم*, *نیومدم*, *نزدم*.'
    example_gloss:
    - Gisteren ging ik naar de bioscoop.
    - Ik zag een film.
    - Ik at avondeten en kwam thuis.
    - Op zaterdag bleef ik thuis.
    - Ik schreef je een bericht.
    - Sara en ik gingen naar het park.
  fa.a2.unit48.lesson02.teach.past_story:
    title: Gebeurtenissen op volgorde vertellen
    gloss: Op vrijdag ging ik naar de verjaardag van mijn vriend en kocht ik een cadeau; we gingen naar de bioscoop en daarna aten we avondeten
    note: Noem eerst de tijd en dan de gebeurtenissen in de volgorde waarin ze plaatsvonden. Verbind ze met *و* en gebruik *بعدش* („daarna”) voor de volgende stap. Elk werkwoord blijft in de simpele verleden tijd.
  fa.a2.unit48.lesson03.teach.want_to:
    title: Zeggen wat je gaat doen
    gloss: ik wil gaan, ik wil komen, ik wil kopen, ik wil eten
    note: '*می‌خوام* plus een kort werkwoord (*برم*, *بیام*, *بخرم*, *بخورم*) is de gebruikelijke manier om te zeggen wat je gaat doen. In een bericht klinkt het als een plan, niet alleen als een wens.'
    example_gloss:
    - Morgen wil ik naar de bioscoop gaan.
    - Op zaterdag wil ik komen.
    - Ik wil een cadeau kopen.
    - Na de bioscoop wil ik avondeten.
  fa.a2.unit48.lesson03.teach.feelings_and_memories:
    title: Gevoelens en herinneringen
    gloss: herinnering, verdrietig, iemand missen, interessant
    note: '*ناراحت* zegt dat je van streek of verdrietig bent, terwijl *دلتنگ* zegt dat je iemand mist. *جالب* beschrijft iets interessants.'
    example_gloss:
    - De herinnering was interessant.
    - Ik was gisteren verdrietig.
    - Ik miste je.
  fa.a2.unit48.lesson03.teach.plain_present:
    title: De gewone tegenwoordige tijd voor plannen
    gloss: ik kom, ik ga, ik koop, ik bel je
    note: Met een tijdwoord als *فردا* of *بعدا* betekent de gewone tegenwoordige tijd ook de toekomst. Zowel *می‌خوام برم* als *می‌رم* kan in een bericht.
    example_gloss:
    - Ik kom op zaterdag.
    - Morgen ga ik naar het park.
    - Later koop ik een cadeau.
    - Ik bel je morgen.
  fa.a2.unit48.lesson03.teach.next_pattern:
    title: Wat er nog komt
    gloss: Morgen wil ik naar de bioscoop gaan; na de bioscoop bel ik je
    note: Zet eerst het tijdwoord en dan het plan. Gebruik *بعد از* met een plaats of gebeurtenis (*بعد از سینما*) en *بعدش* als de vorige stap al duidelijk is.
  fa.a2.unit48.lesson04.teach.reasons:
    title: Redenen in het verleden
    gloss: ik was moe, ik had werk, ik was ziek, het weer was mooi
    note: 'Redenen over het verleden staan in de verleden tijd: *بودم*, *داشتم*. Het weer is derde persoon: *هوا خوب بود*.'
    example_gloss:
    - Ik was gisteren moe.
    - Ik had in het weekend werk.
    - Ik was op zaterdag ziek.
    - Het weer was mooi op vrijdag.
  fa.a2.unit48.lesson04.teach.because_so:
    title: Omdat en dus
    gloss: Omdat ik moe was, kwam ik niet; ik was moe, dus ik kwam niet
    note: '*چون* leidt de reden in: *چون خسته بودم، نیومدم* of *نیومدم، چون خسته بودم*. *برای همین* leidt het gevolg in en komt na de reden: *خسته بودم، برای همین نیومدم*. Gebruik niet allebei in één zin.'
  fa.a2.unit48.lesson05.teach.reading:
    title: Een bericht van Nima
    gloss: Hoi Sara, hoe gaat het? Sorry dat ik niet gebeld heb, want ik had in het weekend veel werk. Op vrijdag ging ik naar de verjaardag van mijn vriend en kocht ik een cadeau. De verjaardag was heel leuk, maar ik kwam laat thuis en was moe. Daarom ging ik op zaterdag niet naar de les. Morgen wil ik naar de bioscoop gaan, en na de bioscoop bel ik je. Doei, Nima
    note: Lees eerst één keer voor de vier delen (begroeting, wat er gebeurd is, wat er nog komt, afsluiting) en daarna nog een keer voor de redenen.
  fa.a2.unit48.lesson06.teach.turn01:
    title: Sara vraagt naar nieuws
    gloss: Hoi Nima! Hoe gaat het? Wat heb je in het weekend gedaan?
    note: Sara begroet Nima en vraagt wat hij gedaan heeft.
  fa.a2.unit48.lesson06.teach.turn02:
    title: Nima vertelt wat er gebeurd is
    gloss: Hoi Sara! Op vrijdag ging ik naar de verjaardag van mijn vriend. Ik heb een cadeau gekocht en het was heel leuk.
    note: Nima gebruikt de simpele verleden tijd voor de gebeurtenissen.
  fa.a2.unit48.lesson06.teach.turn03:
    title: Sara vraagt naar zaterdag
    gloss: Leuk! En zaterdag?
    note: Een korte vervolgvraag.
  fa.a2.unit48.lesson06.teach.turn04:
    title: Nima geeft een reden
    gloss: Op zaterdag bleef ik thuis, omdat ik moe was.
    note: '*چون* geeft de reden.'
  fa.a2.unit48.lesson06.teach.turn05:
    title: Sara vraagt naar morgen
    gloss: Wat wil je morgen doen?
    note: Sara vraagt naar het plan.
  fa.a2.unit48.lesson06.teach.turn06:
    title: Nima zegt wat er nog komt
    gloss: Morgen wil ik naar de bioscoop gaan. Na de bioscoop bel ik je.
    note: Plannen maak je met *می‌خوام* en de gewone tegenwoordige tijd.
  fa.a2.unit48.lesson06.teach.turn07:
    title: Sara sluit af
    gloss: Oké. Doei!
    note: Het gesprek eindigt met *فعلا*.
