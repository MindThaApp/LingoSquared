teaching:
  fa.a2.unit41.lesson01.teach.phones:
    title: Woorden over telefoons
    gloss: telefoon, camera, batterij
    note: '*گوشی* is het gewone woord voor een mobiele telefoon.'
    example_gloss:
    - Mijn telefoon heeft een camera.
    - Deze telefoon heeft een batterij.
    - Dit is de telefoon.
  fa.a2.unit41.lesson01.teach.adjs:
    title: Goedkoop, duur, goed, slecht
    gloss: goedkoop, duur, goed, slecht
    note: '*ارزون* en *گرون* zijn de gebruikelijke gesproken vormen.'
    example_gloss:
    - Deze telefoon is goedkoop.
    - Die telefoon is duur.
    - Deze telefoon is goed.
    - Die telefoon is slecht.
  fa.a2.unit41.lesson01.teach.comparative:
    title: 'Herhaling vergrotende trap: -تر'
    gloss: goedkoper, duurder, beter, slechter
    note: '*-تر* ken je al voor de vergrotende trap: *ارزون‌تر*. *بهتر* en *بدتر* zijn de vormen van “goed” en “slecht”.'
  fa.a2.unit41.lesson01.teach.superlative:
    title: 'De overtreffende trap: -ترین vóór het zelfstandig naamwoord'
    gloss: de goedkoopste telefoon, de duurste telefoon, de beste telefoon, de slechtste telefoon
    note: 'Voeg *-ین* toe aan de vergrotende trap en zet die vóór het zelfstandig naamwoord: *ارزون‌تر* wordt *ارزون‌ترین گوشی*. Tussen de twee woorden staat geen ezafe (*ـِ*).'
  fa.a2.unit41.lesson02.teach.housing:
    title: Woorden over wonen
    gloss: appartement, kamer, huis, station
    note: '*خونه* is de gesproken vorm van *خانه*.'
    example_gloss:
    - Het appartement is hier.
    - De kamer is daar.
    - Het huis is hier.
    - Het station is daar.
  fa.a2.unit41.lesson02.teach.size:
    title: Groot, klein, dichtbij, ver, mooi
    gloss: groot, klein, dichtbij, ver, mooi
    note: '*کوچیک* is de gebruikelijke gesproken vorm van *کوچک*.'
    example_gloss:
    - Het appartement is groot.
    - De kamer is klein.
    - Het station is dichtbij.
    - Het huis is ver weg.
    - Het huis is mooi.
  fa.a2.unit41.lesson02.teach.forms:
    title: Elk bijvoeglijk naamwoord + ترین
    gloss: het grootste appartement; de kleinste kamer; het dichtstbijzijnde station; het mooiste huis
    note: 'Het patroon is voor elk bijvoeglijk naamwoord hetzelfde: bijvoeglijk naamwoord + *‌ترین* (met een klein tussenruimtetje, geschreven met een halve spatie) vóór het zelfstandig naamwoord.'
  fa.a2.unit41.lesson02.teach.spoken:
    title: 'In gesproken taal: از همه + vergrotende trap'
    gloss: Dit appartement is het grootste (groter dan alle andere); deze kamer is de kleinste
    note: 'Als de overtreffende trap het naamwoordelijk deel van de zin is, zegt men in gesproken taal vaak “groter dan alle”: *از همه بزرگ‌تره*. Dat betekent “de grootste”. Ook een overtreffende trap zelf kan zo gebruikt worden: *این بزرگ‌ترینه* (“dit is de grootste”).'
  fa.a2.unit41.lesson03.teach.holiday:
    title: Woorden over vakantie
    gloss: hotel, reis, zee, berg
    note: '*سفر* is een reis of trip.'
    example_gloss:
    - Het hotel is hier.
    - De reis is heerlijk.
    - De zee is daar.
    - De berg is ver weg.
  fa.a2.unit41.lesson03.teach.opinion:
    title: Naar mijn mening, welk
    gloss: naar mijn mening, welk, welke is het
    note: '*به نظر من* gebruik je om je mening te geven. *کدومه؟* vraagt “welke is het?”.'
    example_gloss:
    - Naar mijn mening is dit hotel goed.
    - Welk hotel?
  fa.a2.unit41.lesson03.teach.choose:
    title: Vragen welke het beste is
    gloss: Welk hotel is het goedkoopst? Het berghotel is het goedkoopst.
    note: Om er één uit drie opties te kiezen, vraag je *کدوم ... از همه ...؟* en antwoord je met hetzelfde patroon.
  fa.a2.unit41.lesson04.teach.asas:
    title: Net zo ... als
    gloss: net zoveel als, is niet
    note: Na *به اندازه‌ی* komt datgene waarmee je vergelijkt.
    example_gloss:
    - Deze telefoon is net zo goedkoop als die telefoon.
    - Die telefoon is niet zo goed als deze telefoon.
  fa.a2.unit41.lesson04.teach.asas_rule:
    title: Gelijk en niet gelijk
    gloss: Dit huis is net zo groot als dat huis; deze kamer is niet zo groot als die kamer
    note: '*به اندازه‌ی* + zelfstandig naamwoord + bijvoeglijk naamwoord drukt uit dat twee dingen gelijk zijn. Voor “niet zo ... als” eindig je met *نیست*. In de bevestigende zin krijgt het bijvoeglijk naamwoord de gesproken koppelwerkwoordsvorm (*بزرگه* = *بزرگ* + *است*). In de ontkennende zin vervangt *نیست* het koppelwerkwoord, dus zeg je *بزرگ نیست* en niet *بزرگه نیست*.'
  fa.a2.unit41.lesson05.teach.reading:
    title: Drie appartementen
    gloss: Ik wil een appartement nemen. Ik heb drie appartementen bekeken. Het eerste appartement was het goedkoopst, maar ook het kleinst. Het tweede appartement was het grootst, maar lag erg ver weg. Het derde appartement was niet zo groot als het tweede, maar lag het dichtstbij. Naar mijn mening is het derde appartement het beste.
    note: Lees eerst één keer voor de drie appartementen en lees daarna nog een keer op de woorden die eindigen op *-ترین*.
  fa.a2.unit41.lesson06.teach.turn01:
    title: Sara vraagt welke telefoon beter is
    gloss: 'Sara: Nima, welke telefoon is beter?'
    note: '*بهتره* is de vergrotende trap “beter”.'
  fa.a2.unit41.lesson06.teach.turn02:
    title: Nima geeft zijn mening
    gloss: 'Nima: Naar mijn mening is deze telefoon de beste telefoon.'
    note: '*بهترین گوشی* gebruikt de overtreffende trap vóór het zelfstandig naamwoord.'
  fa.a2.unit41.lesson06.teach.turn03:
    title: Sara merkt de prijs op
    gloss: 'Sara: Maar deze telefoon is de duurste.'
    note: '*از همه گرون‌تره* is de gesproken vorm van “de duurste”.'
  fa.a2.unit41.lesson06.teach.turn04:
    title: Nima vergelijkt
    gloss: 'Nima: Ja. Die telefoon is de goedkoopste, maar hij is niet zo goed als deze telefoon.'
    note: '*ارزون‌ترینه* is de overtreffende trap als naamwoordelijk deel van de zin.'
  fa.a2.unit41.lesson06.teach.turn05:
    title: Sara beslist
    gloss: 'Sara: Dan koop ik deze.'
    note: '*می‌خرم* betekent in gesproken taal ook “ik zal kopen”.'
