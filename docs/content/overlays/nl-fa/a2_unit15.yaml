course:
  title: Perzisch A2
  description: 'Farsi (Iran) voor beginners met wat basis: omgaan met een treinvertraging -- een mededeling over een storing begrijpen, beleefd een medewerker van het station naar een alternatieve route vragen en een geschreven bericht over dezelfde vertraging lezen.'
units:
  fa.a2.unit15.travel_disruption:
    title: Reisproblemen
lessons:
  fa.a2.unit15.lesson01.travel_disruption_vocabulary:
    title: Woorden voor vertraging
  fa.a2.unit15.lesson02.asking_about_alternatives:
    title: Vragen naar een alternatieve route
  fa.a2.unit15.lesson03.reading_a_station_notice:
    title: Een bericht op het station lezen
  fa.a2.unit15.lesson04.station_counter_dialogue:
    title: Aan het loket op het station
teaching:
  fa.a2.unit15.lesson01.teach.train_word:
    title: Trein
    gloss: de trein
    note: '*قطار* is het algemene woord voor een trein.'
    example_gloss: Mijn trein vertrekt om negen uur.
  fa.a2.unit15.lesson01.teach.delay_word:
    title: Vertraging
    gloss: vertraging
    note: '*تاخیر* is het algemene woord voor een vertraging.'
    example_gloss: De trein heeft vandaag vertraging.
  fa.a2.unit15.lesson01.teach.platform_word:
    title: Perron
    gloss: perron
    note: '*سکو* is het woord voor een perron; *سکوی* is de ezafe-vorm voor een getal, bijvoorbeeld *سکوی سه* (perron drie).'
    example_gloss: De trein vertrekt van perron drie.
  fa.a2.unit15.lesson01.teach.cancel_word:
    title: Geannuleerd
    gloss: geannuleerd
    note: '*لغو* is het woord voor geannuleerd; *لغو شدن* (geannuleerd worden) is de constructie met een hulpwerkwoord die ervan is gemaakt.'
    example_gloss: Het treinkaartje is geannuleerd.
  fa.a2.unit15.lesson01.teach.announcement_word:
    title: Mededeling
    gloss: mededeling
    note: '*اعلامیه* is het woord voor een schriftelijke mededeling of bekendmaking.'
    example_gloss: Deze mededeling is erg belangrijk.
  fa.a2.unit15.lesson01.teach.alternative_route_word:
    title: Alternatieve route
    gloss: alternatieve route
    note: '*مسیر جایگزین* combineert *مسیر* (route) met *جایگزین* (alternatief/vervangend).'
    example_gloss: De alternatieve route vertrekt van perron vijf.
  fa.a2.unit15.lesson01.teach.recap_numbers_time:
    title: Tijden en getallen voor deze unit
    gloss: negen uur, tien uur, drie, vijf
    note: Samenvatting van de getallen en tijden die je in dit scenario nodig hebt.
  fa.a2.unit15.lesson02.teach.when_does_it_leave:
    title: Pardon, wanneer vertrekt de trein?
    gloss: Pardon, wanneer vertrekt de trein?
    note: '*ببخشید* opent beleefd een vraag aan een vreemde of een medewerker.'
  fa.a2.unit15.lesson02.teach.is_there_an_alternative:
    title: Is er een alternatieve route?
    gloss: Is er een alternatieve route?
    note: '*هست؟* (is er?) is de basisvraag om te vragen of iets beschikbaar is.'
  fa.a2.unit15.lesson02.teach.full_alternative_question:
    title: Beleefd vragen naar een snellere alternatieve route
    gloss: Pardon, is er een alternatieve route waarmee ik eerder aankom?
    note: '*که زودتر برسم* (zodat ik eerder aankom) voegt het doel toe aan de gewone vraag of iets bestaat.'
  fa.a2.unit15.lesson03.teach.because_of_note:
    title: Vanwege (+ zelfstandig naamwoord)
    gloss: vanwege ...
    note: '*به خاطر* wordt direct gevolgd door een ZELFSTANDIG NAAMWOORD (*به خاطر مشکل فنی*, vanwege een technisch probleem) -- anders dan *چون*, dat een volledige bijzin krijgt.'
  fa.a2.unit15.lesson03.teach.technical_problem_word:
    title: Technisch probleem
    gloss: technisch probleem
    note: '*مشکل فنی* is de standaardterm voor een technisch probleem en komt vaak voor in reismeldingen.'
    example_gloss: De trein heeft vertraging vanwege een technisch probleem.
  fa.a2.unit15.lesson03.teach.notice_text:
    title: Een bericht op het station over een vertraging
    gloss: 'Let op: de trein van negen uur naar Isfahan heeft een uur vertraging vanwege een technisch probleem en vertrekt om tien uur van perron drie. De alternatieve bus vertrekt om half tien van perron vijf.'
    note: Een kort officieel bericht op het station in een neutrale schrijfstijl, al gebruikt het nog wel de werkwoordsvormen van de spreektaal (*داره*, *می‌کنه*).
  fa.a2.unit15.lesson04.teach.i_will_wait:
    title: Ik wacht op de trein
    gloss: Ik wacht op de trein.
    note: '*منتظر ... می‌مونم* (ik blijf wachten op ...) is de standaardmanier om te zeggen dat je op iets wacht.'
  fa.a2.unit15.lesson04.teach.turn01:
    title: نیما vraagt wanneer de trein vertrekt
    gloss: نیما vraagt beleefd wanneer de trein van negen uur naar Isfahan vertrekt.
    note: Hier komt de openingszin uit deze les terug.
  fa.a2.unit15.lesson04.teach.turn02:
    title: کارمند legt de vertraging uit
    gloss: De medewerker zegt dat de trein helaas vanwege een technisch probleem een uur vertraging heeft en nu om tien uur van perron drie vertrekt.
    note: '*متاسفانه* (helaas) maakt slecht nieuws zachter.'
  fa.a2.unit15.lesson04.teach.turn03:
    title: نیما vraagt naar een alternatief
    gloss: نیما vraagt of er een alternatieve route is, zodat hij eerder aankomt.
    note: Hergebruikt de volledige vraag over de alternatieve route uit les 2.
  fa.a2.unit15.lesson04.teach.turn04:
    title: De medewerker biedt de alternatieve bus aan
    gloss: De medewerker zegt ja, er vertrekt om half tien een bus vanaf perron vijf, maar Nima moet dan wel een nieuw kaartje kopen.
    note: '*باید ... بخرید* (u moet ... kopen) noemt de echte prijs van het alternatief.'
  fa.a2.unit15.lesson04.teach.turn05:
    title: نیما slaat het aanbod af en wacht
    gloss: نیما zegt nee, geen probleem, hij wacht op de trein.
    note: '*مشکلی نیست* (geen probleem / dat is prima) is een beleefde manier om een aanbod af te slaan.'
  fa.a2.unit15.lesson04.teach.turn06:
    title: De medewerker bevestigt het plan
    gloss: De medewerker zegt oké, wacht dan om tien uur op perron drie.
    note: '*پس* (dus / dan) trekt de conclusie uit wat نیما net heeft besloten.'
