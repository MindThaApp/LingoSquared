course:
  title: Perzisch A2
  description: 'Iraans Farsi voor gevorderde beginners: werkervaring en beschikbaarheid beschrijven, een vacature lezen en een eenvoudig sollicitatiegesprek van vraag tot antwoord volgen.'
units:
  fa.a2.unit14.job_interview:
