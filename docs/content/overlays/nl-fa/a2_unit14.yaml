teaching:
  fa.a2.unit14.lesson01.teach.interview_word:
    title: Sollicitatiegesprek
    gloss: sollicitatiegesprek
    note: '*مصاحبه* is het algemene woord voor een sollicitatiegesprek of interview.'
    example_gloss: Ik heb morgen een sollicitatiegesprek.
  fa.a2.unit14.lesson01.teach.experience_word:
    title: Ervaring
    gloss: ervaring
    note: '*تجربه* is het algemene woord voor ervaring.'
    example_gloss: Ik heb drie jaar werkervaring.
  fa.a2.unit14.lesson01.teach.skill_word:
    title: Vaardigheid
    gloss: vaardigheid
    note: '*مهارت* is het algemene woord voor een vaardigheid.'
    example_gloss: Welke vaardigheden heeft u?
  fa.a2.unit14.lesson01.teach.salary_word:
    title: Salaris
    gloss: salaris
    note: '*حقوق* betekent salaris.'
    example_gloss: Hoeveel is het salaris voor deze baan?
  fa.a2.unit14.lesson01.teach.job_opportunity_word:
    title: Vacature
    gloss: vacature
    note: '*فرصت شغلی* betekent vacature of baankans.'
    example_gloss: Dit is een goede vacature.
  fa.a2.unit14.lesson01.teach.resume_word:
    title: Cv
    gloss: cv
    note: '*رزومه* is het gangbare Perzische woord voor een cv (het is ontleend aan het Frans).'
    example_gloss: Ik heb mijn cv gestuurd.
  fa.a2.unit14.lesson01.teach.va_word:
    title: En
    gloss: en
    note: '*و* is het gewone verbindingswoord dat in deze hele unit voorkomt.'
    target_text: و (en)
  fa.a2.unit14.lesson01.teach.ra_note:
    title: Object marker
    gloss: (markeert een bepaald lijdend voorwerp)
    note: '*رو* (spreektaal voor het formele *را*) markeert een bepaald lijdend voorwerp -- het staat direct achter datgene waarop de handeling gericht is.'
    target_text: رو (lijdend voorwerpmarkering)
  fa.a2.unit14.lesson02.teach.three_years_experience:
    title: Werkervaring met een duur noemen
    gloss: Ik heb drie jaar werkervaring.
    note: '*سه سال تجربه‌ی کار* noemt de duur van de ervaring, een stap verder dan het kale noemen van een beroep op A1-niveau.'
  fa.a2.unit14.lesson02.teach.can_start_next_week:
    title: Je beschikbaarheid aangeven
    gloss: Ik kan volgende week beginnen.
    note: '*از هفته‌ی دیگه* (vanaf volgende week) geeft aan wanneer je kunt beginnen.'
  fa.a2.unit14.lesson02.teach.clarifying_question:
    title: Een verduidelijkende vraag stellen
    gloss: Wat zijn de werktijden voor deze baan?
    note: '*ساعت کاری این شغل چطوره؟* is een natuurlijke verduidelijkende vraag aan de interviewer.'
  fa.a2.unit14.lesson03.teach.salesperson_word:
    title: Verkoper
    gloss: verkoper
    note: '*فروشنده* is het algemene woord voor een verkoper.'
    example_gloss: De winkel heeft een verkoper nodig.
  fa.a2.unit14.lesson03.teach.at_least_word:
    title: Minstens
    gloss: minstens / minimum
    note: '*حداقل* betekent minstens of minimaal.'
    example_gloss: Minstens één jaar ervaring is vereist.
  fa.a2.unit14.lesson03.teach.posting_text:
    title: Een vacature
    gloss: De winkel zoekt een verkoper met minstens één jaar ervaring. Passend salaris. De gesprekken vinden deze week plaats.
    note: Een korte vacaturetekst in neutrale schrijftaal, al gebruikt hij nog wel de alledaagse spreektaalvormen *داره* en *می‌شه*.
  fa.a2.unit14.lesson04.teach.tell_me_about_experience:
    title: Vertel over je ervaring
    gloss: Vertelt u alstublieft over uw werkervaring.
    note: '*لطفاً از تجربه‌ی کاریتون بگید.* is een standaardopening van een interviewer.'
  fa.a2.unit14.lesson04.teach.turn01:
    title: مصاحبه‌کننده vraagt naar ervaring
    gloss: De interviewer vraagt آرش om te vertellen over zijn werkervaring.
    note: Hergebruikt de openingszin uit deze les.
  fa.a2.unit14.lesson04.teach.turn02:
    title: آرش beschrijft zijn ervaring
    gloss: آرش zegt dat hij drie jaar op een kantoor heeft gewerkt.
    note: Hergebruikt het patroon voor de duur van ervaring uit eerdere les, in een iets andere vorm.
  fa.a2.unit14.lesson04.teach.turn03:
    title: مصاحبه‌کننده vraagt naar vaardigheden
    gloss: De interviewer vraagt welke vaardigheden hij heeft.
    note: '*چه مهارت‌هایی دارید؟* vraagt specifiek naar vaardigheden.'
  fa.a2.unit14.lesson04.teach.turn04:
    title: آرش beschrijft zijn vaardigheden
    gloss: آرش zegt dat hij goed is in samenwerken en problemen oplossen.
    note: '*تو ... خوبم* (ik ben goed in ...) geeft een vaardigheid aan.'
  fa.a2.unit14.lesson04.teach.turn05:
    title: مصاحبه‌کننده vraagt naar beschikbaarheid
    gloss: De interviewer vraagt of hij volgende week kan beginnen.
    note: Hergebruikt het beschikbaarheidspatroon uit eerdere les, nu als vraag.
  fa.a2.unit14.lesson04.teach.turn06:
    title: آرش bevestigt
    gloss: آرش zegt ja, dat kan hij.
    note: Een korte, directe bevestiging.
