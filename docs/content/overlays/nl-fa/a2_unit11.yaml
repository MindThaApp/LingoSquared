course:
  title: Perzisch A2
  description: 'Iraans Farsi voor lager-middelbaar niveau: een bankrekening openen -- vragen welke documenten nodig zijn, een beleefd verzoek met voorwaarde doen en een gesprek aan het bankloket volgen, van aanvraag tot het ophalen van de pas.'
units:
  fa.a2.unit11.banking:
    title: Een bankrekening openen
lessons:
  fa.a2.unit11.lesson01.banking_vocabulary:
    title: Bankwoorden
  fa.a2.unit11.lesson02.requesting_an_account:
    title: Een rekening aanvragen
  fa.a2.unit11.lesson03.reading_a_bank_notice:
    title: Een bankbericht lezen
  fa.a2.unit11.lesson04.bank_counter_dialogue:
    title: Aan het bankloket
teaching:
  fa.a2.unit11.lesson01.teach.bank_word:
    title: Bank
    gloss: bank
    note: '*بانک* is het algemene woord voor een bank.'
    example_gloss: De bank is vlak bij mijn nieuwe huis.
  fa.a2.unit11.lesson01.teach.account_word:
    title: Rekening
    gloss: rekening
    note: '*حساب* is het algemene woord voor een rekening.'
    example_gloss: Ik wil een rekening openen.
  fa.a2.unit11.lesson01.teach.bank_card_word:
    title: Bankpas
    gloss: bankpas
    note: '*کارت بانکی* is de gewone bankpas die je krijgt als je een rekening opent.'
    example_gloss: Mijn bankpas heeft een pincode.
  fa.a2.unit11.lesson01.teach.pin_word:
    title: pincode
    gloss: pincode / wachtwoord
    note: '*رمز* is het woord voor een pincode of wachtwoord.'
    example_gloss: Vergeet de pincode van je pas niet.
  fa.a2.unit11.lesson01.teach.balance_word:
    title: Saldo
    gloss: saldo
    note: '*موجودی* is het woord voor het saldo van een rekening.'
    example_gloss: Het saldo van mijn rekening is laag.
  fa.a2.unit11.lesson01.teach.document_word:
    title: Document
    gloss: document
    note: '*مدرک* is het algemene woord voor een document, al bekend uit de eerdere unit over registratie.'
    example_gloss: Om een rekening te openen heb je een document nodig.
  fa.a2.unit11.lesson01.teach.baz_kardan_note:
    title: Openen (werkwoord met kordaat hulpwerkwoord)
    gloss: openen
    note: '*باز کردن* betekent letterlijk ''open doen'' -- het Perzisch maakt veel werkwoorden zo, met een zelfstandig of bijvoeglijk naamwoord plus een hulpwerkwoord zoals *کردن*.'
  fa.a2.unit11.lesson01.teach.ra_note:
    title: Lijdend voorwerp-markering
    gloss: (markeert een bepaald lijdend voorwerp)
    note: '*رو* (spreektaal voor het formele *را*) markeert een bepaald lijdend voorwerp -- het staat direct achter datgene waarop de handeling gericht is.'
  fa.a2.unit11.lesson01.teach.recap_registration_terms:
    title: Identiteitsbewijs en bewijs van adres
    gloss: nationale identiteitskaart en bewijs van adres
    note: '*کارت ملی* en *مدرک آدرس* zijn de twee documenten die je voor het bankbezoek in deze unit nodig hebt -- al bekend uit de eerdere unit over registratie.'
  fa.a2.unit11.lesson02.teach.i_want_to_open_account:
    title: Een rekening aanvragen
    gloss: Ik zou graag een bankrekening openen.
    note: '*می‌خواستم ...* is dezelfde beleefde, verzachte verzoekvorm uit de eerdere unit over registratie.'
  fa.a2.unit11.lesson02.teach.if_bring_documents:
    title: Een voorwaarde stellen met اگر (als)
    gloss: Als u uw documenten meebrengt, kunt u vandaag nog een rekening openen.
    note: '*اگر ...، ...* is de voorwaardelijke vorm op A2-niveau -- noem eerst de voorwaarde, dan het gevolg.'
  fa.a2.unit11.lesson02.teach.full_request_with_condition:
    title: Het verzoek en de voorwaarde combineren
    gloss: Ik zou graag een bankrekening openen. Als u uw documenten meebrengt, kan het vandaag nog.
    note: Het volledige patroon van verzoek plus voorwaarde waar deze les om draait.
  fa.a2.unit11.lesson03.teach.necessary_word:
    title: Nodig
    gloss: nodig / vereist
    note: '*لازم* is het algemene woord voor nodig of vereist.'
    example_gloss: Om een rekening te openen heb je een identiteitskaart nodig.
  fa.a2.unit11.lesson03.teach.working_hours_word:
    title: Openingstijden
    gloss: openingstijden
    note: '*ساعت کاری* is de gebruikelijke uitdrukking voor de openingstijden van een bedrijf.'
    example_gloss: De openingstijden van de bank zijn van 8 uur 's ochtends tot 2 uur 's middags.
  fa.a2.unit11.lesson03.teach.notice_text:
    title: Een bankbericht over het openen van een rekening
    gloss: Om een rekening te openen zijn een nationale identiteitskaart en een bewijs van adres nodig. De openingstijden van de bank zijn van 8 uur 's ochtends tot 2 uur 's middags.
    note: Een korte officiële mededeling in neutrale schrijftaal, maar met het alledaagse gesproken *لازمه*.
  fa.a2.unit11.lesson04.teach.how_can_i_help:
    title: Waarmee kan ik u helpen?
    gloss: Zegt u het maar, waarmee kan ik u helpen?
    note: '*بفرمایید، چه کمکی می‌تونم بکنم؟* is de standaard beleefde opening aan een loket.'
  fa.a2.unit11.lesson04.teach.turn01:
    title: De medewerker begroet سارا
    gloss: De medewerker zegt hallo en vraagt waarmee hij kan helpen.
    note: Gebruikt de openingszin van deze les opnieuw.
  fa.a2.unit11.lesson04.teach.turn02:
    title: سارا doet haar verzoek
    gloss: سارا zegt dat ze graag een bankrekening wil openen.
    note: Gebruikt het patroon *می‌خواستم ...* uit les 2 opnieuw.
  fa.a2.unit11.lesson04.teach.turn03:
    title: De medewerker vraagt om documenten
    gloss: De medewerker vraagt of ze haar nationale identiteitskaart en een bewijs van adres bij zich heeft.
    note: '*کارت ملی* en *مدرک آدرس* zijn al behandeld in de eerdere unit over registratie.'
  fa.a2.unit11.lesson04.teach.turn04:
    title: سارا bevestigt wat ze heeft meegebracht
    gloss: 'سارا zegt ja: ze heeft haar nationale identiteitskaart en de elektriciteitsrekening van haar nieuwe huis meegebracht.'
    note: '*قبض برق* (elektriciteitsrekening) gebruikt opnieuw het woord *قبض* uit de eerdere unit over registratie.'
  fa.a2.unit11.lesson04.teach.turn05:
    title: کارمند bevestigt de termijn
    gloss: 'De medewerker zegt dat het goed nieuws is: haar bankpas is binnen drie dagen klaar.'
    note: '*تا سه روز دیگه* (binnen drie dagen) geeft de doorlooptijd aan.'
  fa.a2.unit11.lesson04.teach.turn06:
    title: سارا vraagt naar de pincode
    gloss: سارا vraagt wanneer ze de pincode krijgt.
    note: '*کی* betekent hier ''wanneer''; hetzelfde woord betekent ook ''wie''. De context maakt duidelijk welke van de twee bedoeld is.'
  fa.a2.unit11.lesson04.teach.turn07:
    title: کارمند antwoordt over de pincode
    gloss: De medewerker zegt dat ze de pincode krijgt op dezelfde dag dat ze de pas ophaalt.
    note: '*همون روزی که ...* betekent ''dezelfde dag dat ...''.'
