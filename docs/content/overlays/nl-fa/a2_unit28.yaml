teaching:
  fa.a2.unit28.lesson01.teach.weather_words:
    title: Weerwoorden voor een voorspelling
    gloss: morgen, weer, regen, sneeuw, koud, warm, zonnig
    note: '*بارون* is de alledaagse gesproken vorm van "regen"; in verzorgd schrift gebruik je *باران*. *آفتابیه* betekent "het is zonnig".'
    example_gloss:
    - Morgen is het zonnig.
    - Morgen gaat het regenen.
    - Morgen gaat het sneeuwen.
  fa.a2.unit28.lesson01.teach.forecast_verbs:
    title: Twee werkwoorden voor het weerbericht
    gloss: het regent, het wordt
    note: '*می‌باره* is "het regent/sneeuwt". *می‌شه* is "het wordt" en gaat samen met een bijvoeglijk naamwoord: *سرد می‌شه* = "het wordt koud".'
    example_gloss:
    - Morgen wordt het koud.
    - Morgen wordt het warm.
  fa.a2.unit28.lesson01.teach.present_for_future:
    title: De gesproken tegenwoordige tijd voor de toekomst
    gloss: Morgen gaat het regenen. Morgen wordt het koud.
    note: 'Perzischsprekers voorspellen met de gewone tegenwoordige tijd plus een tijdswoord. *فردا بارون می‌باره* is "Morgen gaat het regenen." Er is geen aparte gesproken toekomende tijd: *فردا* laat horen dat het om de toekomst gaat.'
  fa.a2.unit28.lesson02.teach.possibility_words:
    title: Misschien en waarschijnlijk
    gloss: misschien, waarschijnlijk, Nima, Sara
    note: '*شاید* betekent "misschien" en *احتمالا* betekent "waarschijnlijk". Nima en Sara zijn vaste vrienden in de cursus.'
    example_gloss:
    - Misschien komt Nima.
    - Het gaat waarschijnlijk regenen.
  fa.a2.unit28.lesson02.teach.subjunctive_verbs:
    title: Werkwoorden na شاید
    gloss: hij/zij/het komt, hij/zij/het komt niet, het wordt
    note: 'Na *شاید* staat het werkwoord in de aanvoegende wijs: *بیاد* (komt), *نیاد* (komt niet), *بشه* (wordt). De aanvoegende wijs heeft *ب-* en geen *می‌*.'
    example_gloss:
    - Misschien gaat het regenen.
    - Misschien regent het niet.
    - Misschien wordt het koud.
  fa.a2.unit28.lesson02.teach.shayad_note:
    title: شاید + aanvoegende wijs
    gloss: Misschien gaat het regenen. Misschien wordt het koud. Misschien regent het niet.
    note: 'Gebruik *شاید* als iets alleen mogelijk is. Het werkwoord staat in de aanvoegende wijs, zonder *می‌*: *شاید بارون بیاد*. Ontkennend: *شاید بارون نیاد*. Vergelijk de gewone voorspelling *بارون می‌باره*, die wel *می‌* heeft.'
  fa.a2.unit28.lesson02.teach.ehtemalan_note:
    title: احتمالا + tegenwoordige tijd
    gloss: Het gaat waarschijnlijk regenen. Het wordt waarschijnlijk koud.
    note: 'Gebruik *احتمالا* als iets waarschijnlijk is. Het werkwoord blijft in de gewone tegenwoordige tijd, precies als in een gewone voorspelling: *احتمالا بارون می‌باره*. Alleen het woord *احتمالا* verandert de mate van zekerheid.'
  fa.a2.unit28.lesson03.teach.negative_forecast:
    title: Ontkennende voorspelling
    gloss: het regent niet
    note: '*نمی‌باره* is de ontkenning van *می‌باره*: *فردا بارون نمی‌باره* = "Morgen regent het niet."'
    example_gloss:
    - Morgen regent het niet.
    - Morgen regent het waarschijnlijk niet.
  fa.a2.unit28.lesson03.teach.certainty_contrast:
    title: Zeker, waarschijnlijk of mogelijk?
    gloss: Het gaat regenen. Het gaat waarschijnlijk regenen. Misschien gaat het regenen.
    note: 'Drie niveaus. Gewone voorspelling: *بارون می‌باره* (tegenwoordige tijd, *می‌*). Waarschijnlijk: *احتمالا بارون می‌باره* (tegenwoordige tijd, *می‌*). Alleen mogelijk: *شاید بارون بیاد* (aanvoegende wijs, geen *می‌*). Gebruik hier *شاید* niet met een gewoon *می‌باره*.'
  fa.a2.unit28.lesson03.teach.negative_contrast:
    title: Ontkenningen naast elkaar
    gloss: Het regent niet. Misschien regent het niet.
    note: 'Gewone ontkenning: *نمی‌باره* (tegenwoordige tijd, *نمی‌*). Mogelijke ontkenning: *شاید بارون نیاد* (aanvoegende wijs *نیاد*). Beide gebruiken *ن-*, maar alleen de tweede heeft geen *می‌*.'
  fa.a2.unit28.lesson04.teach.promise_words:
    title: Woorden voor beloften
    gloss: ik beloof, zeker, te laat, telefoontje, jou helpen, dus, jij ... niet
    note: '*قول می‌دم* = "ik beloof". *حتما* = "zeker". *زنگ* met *زدن* is "bellen". *کمکت* is *کمک* + *ت*, "jou helpen". *دیر* = "te laat".'
    example_gloss:
    - Ik bel zeker.
    - Ik beloof dat ik je help.
  fa.a2.unit28.lesson04.teach.promise_verbs:
    title: Werkwoorden voor beloften
    gloss: ik doe niet (aanvoegende wijs), ik bel (aanvoegende wijs), ik doe (aanvoegende wijs), ik kom (aanvoegende wijs), ik bel, jij belt
    note: 'Na *قول می‌دم* staat het werkwoord in de aanvoegende wijs: *نکنم*, *بزنم*, *کنم*, *بیام*. De gewone tegenwoordige tijd *می‌زنم* gebruik je met *حتما*.'
    example_gloss:
    - Ik beloof dat ik niet te laat kom.
    - Ik beloof dat ik bel.
    - Ik beloof dat ik kom.
  fa.a2.unit28.lesson04.teach.promise_note:
    title: قول می‌دم + aanvoegende wijs
    gloss: Ik beloof dat ik niet te laat kom. Ik beloof dat ik bel. Ik beloof dat ik kom.
    note: 'Een belofte is *قول می‌دم* gevolgd door een werkwoord in de aanvoegende wijs (zonder *می‌*): *قول می‌دم دیر نکنم*. De ontkenning *ن-* komt op het werkwoord in de aanvoegende wijs. Het Perzisch gebruikt hier geen toekomende tijd; de aanvoegende wijs zegt waartoe je je verplicht.'
  fa.a2.unit28.lesson04.teach.hatman_note:
    title: حتما + tegenwoordige tijd, شاید + aanvoegende wijs
    gloss: Ik bel zeker. Misschien bel ik.
    note: 'Voor een vaste belofte zeg je *حتما زنگ می‌زنم* (tegenwoordige tijd met *می‌*). Voor iets waarvan je niet zeker bent: *شاید زنگ بزنم* (aanvoegende wijs, geen *می‌*). Hetzelfde contrast als bij het weer.'
  fa.a2.unit28.lesson05.teach.message_words:
    title: Woorden voor een bericht
    gloss: hallo, na, van, werk, afspraak, wij hebben, laatste, week, aan jou, en, maar, uur, tien, ook, hoe is
    note: '*قرار داریم* betekent “we hebben afgesproken.” *بعد از کار* is “na het werk.” *آخر هفته* is “het weekend.” *بهت* is de spreektaalvorm van “aan jou / tegen jou.”'
    example_gloss:
    - We hebben morgen na het werk afgesproken.
    - Het wordt zonnig in het weekend.
    - Ik bel je zeker.
  fa.a2.unit28.lesson05.teach.bulletin_words:
    title: Woorden uit weerberichten en mededelingen
    gloss: meteorologie, regen (schrijftaal), bewolkt, mededeling, kantoor, gesloten, zal, zijn, regende, werd
    note: Deze woorden horen bij geschreven weerberichten en mededelingen. *باران* is de schrijftaalvorm van het gesproken *بارون*. *خواهد* is het geschreven “zal”, in *خواهد بود* en *خواهد شد*.
    example_gloss:
    - Weerbericht
    - Het kantoor is morgen gesloten.
  fa.a2.unit28.lesson05.teach.formal_future_note:
    title: Geschreven toekomst met خواهد (alleen herkennen)
    gloss: Het wordt bewolkt. Het gaat regenen. Het kantoor is gesloten.
    note: 'Alleen schrijftaal/formeel. Weerberichten en mededelingen gebruiken een geschreven toekomende tijd: *خواهد* + een korte werkwoordsvorm, zoals *خواهد شد* (zal worden), *خواهد بارید* (zal regenen), *خواهد بود* (zal zijn). Je hoeft dit alleen te HERKENNEN als je leest. In gesproken taal en in berichten aan vrienden zeg je *می‌شه*, *می‌باره*, *هست*; gebruik *خواهد* zelf niet.'
  fa.a2.unit28.lesson05.teach.reading_message:
    title: Een bericht van Sara
    gloss: Hoi Nima! We hebben morgen na het werk afgesproken. Morgen wordt het koud en waarschijnlijk gaat het regenen. Misschien sneeuwt het in het weekend. Ik beloof dat ik niet te laat kom en ik bel je zeker.
    note: Lees eerst voor de gewone voorspelling, dan voor wat alleen waarschijnlijk of mogelijk is, en dan voor de belofte.
  fa.a2.unit28.lesson05.teach.reading_bulletin:
    title: Een weerbericht
    gloss: 'Weerbericht: Morgen wordt het bewolkt en gaat het regenen. In het weekend is het koud.'
    note: Dit is een geschreven weerbericht. De vormen met *خواهد* zijn alleen om te herkennen.
  fa.a2.unit28.lesson06.teach.turn01:
    title: Sara vraagt naar morgen
    gloss: 'Sara vraagt aan Nima: Hoe wordt het weer morgen?'
    note: De vraag vraagt om een voorspelling.
  fa.a2.unit28.lesson06.teach.turn02:
    title: Nima voorspelt
    gloss: 'Nima: Het gaat waarschijnlijk regenen. Misschien sneeuwt het ook.'
    note: '*احتمالا* is waarschijnlijk; *شاید* is alleen mogelijk.'
  fa.a2.unit28.lesson06.teach.turn03:
    title: Sara controleert het plan
    gloss: 'Sara: We hebben morgen om tien uur afgesproken. Je komt toch niet te laat?'
    note: Sara vraagt met *دیر نمی‌کنی؟* om een toezegging.
  fa.a2.unit28.lesson06.teach.turn04:
    title: Nima belooft het
    gloss: 'Nima: Ik beloof dat ik niet te laat kom.'
    note: '*قول می‌دم* + aanvoegende wijs.'
  fa.a2.unit28.lesson06.teach.turn05:
    title: Sara vraagt naar een telefoontje
    gloss: 'Sara: Bel je dan?'
    note: De tegenwoordige tijd met *می‌* vraagt naar een vast plan.
  fa.a2.unit28.lesson06.teach.turn06:
    title: Nima zegt het toe
    gloss: 'Nima: Ik bel zeker.'
    note: '*حتما* + tegenwoordige tijd geeft een vaste belofte.'
