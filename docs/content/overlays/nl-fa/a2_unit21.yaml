teaching:
  fa.a2.unit21.lesson01.teach.appointment:
    title: Afspraak, kapper
    gloss: afspraak, kapper (kapsalon)
    note: '*وقت* betekent zowel ''tijd'' als ''afspraak (tijdslot)'': *وقت دارم* = ''ik heb een afspraak'' (of ''ik heb tijd''). *آرایشگاه* is de kapper of schoonheidssalon.'
    example_gloss:
    - Donderdag heb ik een afspraak bij de kapper.
    - Ik heb een afspraak bij de dokter.
  fa.a2.unit21.lesson01.teach.change_cancel:
    title: Veranderen, annuleren
    gloss: veranderen (een afspraak), annuleren
    note: 'Beide zijn werkwoorden met *کردن*. Het lijdend voorwerp *وقتم* krijgt *رو*: *وقتم رو عوض می‌کنم*. *کنسل کردن* is het gewone woord voor annuleren.'
    example_gloss:
    - Ik verzet mijn afspraak.
    - Ik annuleer mijn afspraak.
  fa.a2.unit21.lesson01.teach.sorry:
    title: Helaas, sorry
    gloss: helaas, sorry
    note: '*متأسفانه* opent een beleefde weigering of slecht nieuws. *ببخشید* is het gewone ''pardon / sorry''. *متأسفانه* wordt vaak getypt als *متاسفانه* zonder hamza; beide zijn goed.'
    example_gloss:
    - Helaas kan ik niet.
    - Sorry, mag ik binnenkomen?
  fa.a2.unit21.lesson01.teach.cant_come_phrase:
    title: Helaas kan ik donderdag niet komen.
    gloss: Helaas kan ik donderdag niet komen.
    note: '*نمی‌تونم* (ik kan niet) wordt gevolgd door het korte werkwoord *بیام* (van *اومدن*, komen). De dag staat vóór het werkwoord: *پنجشنبه نمی‌تونم بیام*.'
  fa.a2.unit21.lesson01.teach.can_change:
    title: Kan ik mijn afspraak verzetten?
    gloss: Kan ik mijn afspraak verzetten?
    note: '*می‌تونم* (ik kan) + het korte werkwoord *کنم*. Zo vraag je beleefd om je afspraak te verzetten.'
  fa.a2.unit21.lesson01.teach.can_rule:
    title: Kunnen en niet kunnen + kort werkwoord
    gloss: ik kan komen, ik kan niet komen, ik kan veranderen
    note: '*می‌تونم* (ik kan) en *نمی‌تونم* (ik kan niet) worden gevolgd door de korte *be-*vorm van het werkwoord: *بیام* (komen), *کنم* (doen). Beide werkwoorden hebben dezelfde uitgang (*-م*): *نمی‌تونم بیام*. Bij *u* (beleefd) krijgen beide *-ید*: *می‌تونید بیاید؟*'
  fa.a2.unit21.lesson02.teach.days:
    title: Een andere dag, zaterdag, maandag
    gloss: een andere dag, zaterdag, maandag
    note: '*دیگه* na een zelfstandig naamwoord betekent ''andere'' of ''nog'': *یه روز دیگه* is ''een andere dag''. De Iraanse week begint op *شنبه* (zaterdag).'
    example_gloss:
    - Ik heb op een andere dag een afspraak.
    - Op zaterdag kan ik niet.
    - Op maandag heb ik tijd.
  fa.a2.unit21.lesson02.teach.can_it_be:
    title: Kan het maandag?
    gloss: Kan het maandag?
    note: '*می‌شه* (is het mogelijk) + de dag + *باشه* (laat het zijn). Zo stel je gewoonlijk een andere dag voor: *می‌شه شنبه باشه؟*'
  fa.a2.unit21.lesson02.teach.suits_you:
    title: Komt zaterdag u uit?
    gloss: Komt zaterdag u uit? (beleefd)
    note: '*براتون مناسبه؟* vraagt of iets je uitkomt. *براتون* is het beleefde *u*; tegen een vriend zeg je *برات مناسبه؟*'
  fa.a2.unit21.lesson02.teach.yes_fine:
    title: Ja, dat is goed.
    gloss: Ja, dat is goed.
    note: '*خوبه* (het is goed) is een korte manier om een tijdstip te accepteren.'
  fa.a2.unit21.lesson02.teach.no_sorry:
    title: Nee, helaas niet.
    gloss: Nee, helaas niet.
    note: 'Een beleefde manier om te weigeren: *نه* plus *متأسفانه* maakt het antwoord zachter.'
  fa.a2.unit21.lesson02.teach.you_rule:
    title: Informeel en beleefd 'je/u'
    gloss: Komt het je uit? (vriend / beleefd)
    note: 'Bij een vriend is de uitgang *-ت*: *برات*. Bij een loket of iemand die je niet kent gebruik je *-تون*: *براتون*. In deze unit gebruikt de kapsalon de beleefde vorm.'
  fa.a2.unit21.lesson03.teach.because:
    title: Omdat, ik ben ziek
    gloss: omdat, ik ben ziek
    note: '*چون* (omdat) verbindt de reden met de hoofdzin: *نمی‌تونم بیام چون مریضم*. *مریضم* is *مریض* (ziek) + *-م* (ik ben).'
    example_gloss:
    - Ik kan niet komen, omdat ik ziek ben.
    - Omdat ik werk heb, kan ik niet.
  fa.a2.unit21.lesson03.teach.reason_work:
    title: Omdat ik moet werken.
    gloss: Omdat ik moet werken.
    note: '*باید* (moeten) + het korte werkwoord *کنم*: *باید کار کنم*.'
  fa.a2.unit21.lesson03.teach.reason_other:
    title: Omdat ik een andere afspraak heb.
    gloss: Omdat ik een andere afspraak heb.
    note: '*یه وقت دیگه* is ''een andere afspraak''.'
  fa.a2.unit21.lesson03.teach.reason_ill:
    title: Waarom kun je niet? Omdat ik ziek ben.
    gloss: Waarom kun je niet? Omdat ik ziek ben.
    note: '*چرا؟* vraagt waarom; een korte reden die met *چون* begint, kan als antwoord op zichzelf staan. *نمی‌تونی* is de *jij*-vorm van *نمی‌تونم*.'
  fa.a2.unit21.lesson03.teach.sorry_trouble:
    title: Sorry voor het gedoe.
    gloss: Sorry voor het gedoe.
    note: '*بابت زحمت* betekent ''voor het gedoe''. Zeg het als je iemand extra werk bezorgt, bijvoorbeeld door een afspraak te verzetten.'
  fa.a2.unit21.lesson03.teach.reason_rule:
    title: Hoofdzin, dan de reden
    gloss: Ik kan niet komen, omdat ik moet werken.
    note: 'Zet de weigering eerst en de reden na *چون*. Een kort antwoord kan met *چون* beginnen: *چرا نمی‌تونی؟* *چون مریضم.*'
  fa.a2.unit21.lesson04.teach.time_words:
    title: Om tien uur, een dag eerder
    gloss: tien uur, een dag eerder
    note: 'Het uur zeg je als *ساعت* + het getal: *ساعت ده* (tien uur). *قبل* betekent ''eerder'': *یه روز قبل* is ''een dag eerder''.'
    example_gloss:
    - Maandag om tien uur is prima.
    - Ik bel een dag eerder.
  fa.a2.unit21.lesson04.teach.monday_ten:
    title: Maandag om tien uur is prima.
    gloss: Maandag om tien uur is prima.
    note: 'Eerst de dag, dan de tijd: *دوشنبه ساعت ده*.'
  fa.a2.unit21.lesson04.teach.can_you_come:
    title: Kunt u maandag om tien uur komen?
    gloss: Kunt u maandag om tien uur komen? (beleefd)
    note: '*می‌تونید* en *بیاید* hebben de beleefde *je/u*-uitgang *-ید*.'
  fa.a2.unit21.lesson04.teach.see_you:
    title: Dan zie ik u maandag.
    gloss: Dan zie ik u maandag. (beleefd)
    note: '*پس* (dan) rondt de afspraak af; *می‌بینمتون* betekent ''ik zie u'' (beleefd).'
  fa.a2.unit21.lesson04.teach.new_appointment:
    title: Ik maak een nieuwe afspraak.
    gloss: Ik maak een nieuwe afspraak.
    note: '*وقت گرفتن* (letterlijk ''een tijd nemen'') is de gebruikelijke manier om te zeggen dat je een afspraak maakt.'
  fa.a2.unit21.lesson04.teach.time_rule:
    title: Eerst de dag, dan de tijd
    gloss: maandag om tien uur
    note: 'Noem eerst de dag en dan het uur, zonder voorzetsel: *دوشنبه ساعت ده*. Voeg je het werkwoord toe, dan staat het aan het eind: *دوشنبه ساعت ده بیاید*.'
  fa.a2.unit21.lesson05.teach.spot_time:
    title: Herken de dag en de tijd
    gloss: maandag om tien uur, een dag eerder
    note: Als je een bericht over een afspraak leest, let dan op de dag, het uur en wat je moet doen als het je niet uitkomt.
  fa.a2.unit21.lesson05.teach.reading_sms:
    title: Een bericht van de kapsalon
    gloss: Hallo meneer Nima! Uw afspraak is verplaatst naar maandag om tien uur. Als deze tijd u niet uitkomt, belt u dan een dag eerder. Dan maken we een nieuwe afspraak.
    note: Een kort bericht van de kapsalon. Lees het eerst voor de nieuwe tijd en daarna nog eens voor wat je moet doen als het niet uitkomt.
  fa.a2.unit21.lesson06.teach.names:
    title: Nima, de kapsalon
    gloss: Nima, de kapsalon
    note: Nima, de vriend uit eerdere units, belt de kapper. De medewerker van de salon heet *آرایشگاه*.
    example_gloss:
    - Nima belt de kapsalon.
  fa.a2.unit21.lesson06.teach.please_great:
    title: Zegt u het maar, natuurlijk, bedankt, graag gedaan
    gloss: zegt u het maar, natuurlijk, bedankt, graag gedaan
    note: '*بفرمایید* zegt iemand die de telefoon opneemt om jou uit te nodigen te spreken. *البته* betekent ''natuurlijk'', *ممنون* betekent ''bedankt'' en *خواهش می‌کنم* is het antwoord op ''dank u''.'
    example_gloss:
    - Kapsalon, zegt u het maar.
    - Ja, natuurlijk.
    - Bedankt. Graag gedaan.
  fa.a2.unit21.lesson06.teach.dlg1:
    title: De kapsalon neemt op
    gloss: De kapsalon neemt de telefoon op.
    note: 'Een beleefde manier om op te nemen: de naam van de plek en *بفرمایید*.'
  fa.a2.unit21.lesson06.teach.dlg2:
    title: Nima legt uit en vraagt iets
    gloss: Nima zegt dat hij donderdag een afspraak heeft maar helaas niet kan komen, en vraagt of hij die kan verplaatsen.
    note: '*ولی* verbindt de afspraak en het probleem.'
  fa.a2.unit21.lesson06.teach.dlg3:
    title: De kapsalon stelt zaterdag voor
    gloss: De kapsalon zegt ja, natuurlijk, en vraagt of zaterdag hem uitkomt.
    note: De beleefde vorm *براتون*.
  fa.a2.unit21.lesson06.teach.dlg4:
    title: Nima weigert en stelt maandag voor
    gloss: Nima zegt dat het helaas niet kan, omdat hij moet werken, en vraagt of het maandag kan.
    note: Een weigering, een reden en een nieuw voorstel.
  fa.a2.unit21.lesson06.teach.dlg5:
    title: De kapsalon stemt in
    gloss: De kapsalon zegt dat maandag om tien uur prima is.
    note: Eerst de dag, dan de tijd.
  fa.a2.unit21.lesson06.teach.dlg6:
    title: Nima bedankt en verontschuldigt zich
    gloss: Nima zegt dat het geweldig is, bedankt, en sorry voor de moeite.
    note: '*ببخشید بابت زحمت* is de beleefde afsluitende verontschuldiging.'
  fa.a2.unit21.lesson06.teach.dlg7:
    title: De kapsalon sluit af
    gloss: De kapsalon zegt graag gedaan, en tot maandag.
    note: '*خواهش می‌کنم* is het antwoord op ''dank u''.'
  fa.a2.unit21.lesson06.teach.third_person:
    title: Hij kan niet komen, zegt ze
    gloss: hij/zij kan niet komen, hij/zij zegt, hij/zij wil
    note: 'Om weer te geven wat iemand anders zegt of kan, gebruik je de uitgangen voor *hij/zij*: *نمی‌تونه* (hij kan niet), *می‌گه* (hij/zij zegt), *می‌خواد* (hij/zij wil) en het korte werkwoord *بیاد* (komen).'
    example_gloss:
    - Nima kan donderdag niet komen.
    - De kapsalon zegt dat maandag om tien uur prima is.
