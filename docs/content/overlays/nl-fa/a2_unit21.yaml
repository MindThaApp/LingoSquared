course:
  title: Perzisch A2
  description: 'Perzisch (Iran) voor gevorderde beginners met een grammaticale basis: bank, meningen, afspraken en meer. Nu verzet je een afspraak: zeggen dat je niet kunt komen, een andere dag voorstellen, een reden geven en een nieuw tijdstip afspreken.'
