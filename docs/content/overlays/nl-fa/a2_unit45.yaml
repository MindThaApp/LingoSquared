  fa.a2.unit45.lesson01.teach.hal:
    title: Hoe je je voelt
    gloss: mijn gemoedstoestand, jouw gemoedstoestand, het is goed, het is slecht, hoe is het
    note: '*حال* is de toestand waarin je bent, dus *حالم* is “hoe ik me voel” en *حالت* is “hoe jij je voelt”. *حالم خوبه* betekent “ik voel me goed”; *حالم بده* betekent “ik voel me slecht”.'
    example_gloss:
    - Ik voel me goed.
    - Ik voel me slecht.
    - Hoe voel je je?
  fa.a2.unit45.lesson01.teach.shape:
    title: Twee manieren om te zeggen hoe het gaat
    gloss: ik ben moe; ik voel me slecht; hoe voel je je?
    note: 'Je zet *-م* achter het woord voor het gevoel (*خسته‌م*, *نگرانم*), of je zegt *حالم* plus *خوبه* of *بده*. Voor een vraag verander je de uitgang: *حالت چطوره؟*'
  fa.a2.unit45.lesson02.teach.care:
    title: Zorg en van
    gloss: zorg, van
    note: '*مراقبت می‌کنم* betekent “ik zorg voor”. De persoon voor wie je zorgt, komt na *از*.'
    example_gloss:
    - Ik zorg voor mijn vriend.
  fa.a2.unit45.lesson02.teach.verbs:
    title: Tegenwoordige tijd van کردن
    gloss: ik doe, jij doet, hij / zij doet, wij doen, jullie doen, zij doen
    note: 'Dit zijn de gesproken uitgangen van de tegenwoordige tijd: *-م, -ی, -ه, -یم, -ین, -ن*.'
    example_gloss:
    - Ik zorg voor.
    - Jij zorgt voor.
    - Hij / zij zorgt voor.
    - Wij zorgen voor.
    - Jullie zorgen voor.
    - Zij zorgen voor.
  fa.a2.unit45.lesson02.teach.self_sg:
    title: Mezelf, jezelf, zichzelf
    gloss: mezelf, jezelf, zichzelf
    note: '*خود* betekent “zelf”. Het krijgt dezelfde uitgangen als andere zelfstandige naamwoorden: *-م* (mijn), *-ت* (jouw), *-ش* (zijn / haar).'
    example_gloss:
    - Ik zorg voor mezelf.
    - Jij zorgt voor jezelf.
    - Hij / zij zorgt voor zichzelf.
  fa.a2.unit45.lesson02.teach.self_pl:
    title: Onszelf, jullie zelf, zichzelf (meervoud)
    gloss: onszelf, jullie zelf (of u zelf, beleefd), zichzelf (meervoud)
    note: In gesproken taal zijn de meervoudsuitgangen *-مون, -تون, -شون*. *خودتون* is ook de beleefde vorm voor één persoon.
    example_gloss:
    - Wij zorgen voor onszelf.
    - Jullie zorgen voor jezelf.
    - Zij zorgen voor zichzelf.
  fa.a2.unit45.lesson02.teach.careful:
    title: Pas goed op jezelf
    gloss: voorzichtig, wees (tegen één vriend), wees (tegen meerdere mensen, of beleefd)
    note: '*مواظب خودت باش* zeg je tegen een vriend die weggaat of die ziek is. Tegen meerdere mensen, of om beleefd te zijn, zeg je *مواظب خودتون باشین*.'
    example_gloss:
    - Pas goed op jezelf.
    - Pas goed op jezelf. (tegen meerdere mensen)
  fa.a2.unit45.lesson02.teach.agree:
    title: خود komt overeen met het onderwerp
    gloss: ik zorg voor mezelf; jij zorgt voor jezelf
    note: 'De uitgang van *خود* past bij het onderwerp, en het werkwoord ook: *من* hoort bij *خودم* en *می‌کنم*; *تو* hoort bij *خودت* en *می‌کنی*; *ما* hoort bij *خودمون* en *می‌کنیم*.'
  fa.a2.unit45.lesson03.teach.when:
    title: Wanneer je het doet
    gloss: '''s ochtends, ''s avonds laat, elke dag'
    note: De uitgang *-ها* op *صبح* en *شب* geeft “'s ochtends” en “'s nachts” aan als gewoonte.
    example_gloss:
    - '''s Ochtends neem ik een douche.'
    - '''s Avonds poets ik mijn tanden.'
    - Elke dag sport ik.
  fa.a2.unit45.lesson03.teach.body:
    title: Wassen en schoonmaken
    gloss: douche, tandenpoetsen, mijn handen, mijn gezicht
    note: '*دوش* is een douche en *مسواک* is een tandenborstel; *دست‌هام* is “mijn handen” en *صورتم* is “mijn gezicht”.'
    example_gloss:
    - Ik neem een douche.
    - Ik poets mijn tanden.
    - Ik was mijn handen.
    - Ik was mijn gezicht.
  fa.a2.unit45.lesson03.teach.verbs:
    title: Werkwoorden voor lichaamsverzorging
    gloss: ik neem, ik poets, ik was
    note: 'In het Perzisch gebruik je voor elk een ander werkwoord: *دوش می‌گیرم* (douchen, letterlijk ''een douche nemen''), *مسواک می‌زنم* (mijn tanden poetsen), *می‌شورم* (wassen).'
    example_gloss:
    - Ik neem een douche.
    - Ik poets mijn tanden.
    - Ik was mijn gezicht.
  fa.a2.unit45.lesson03.teach.rest:
    title: Sport en rust
    gloss: sport, rust, ik slaap, vroeg
    note: '*ورزش* en *استراحت* gaan samen met *می‌کنم*: *ورزش می‌کنم* en *استراحت می‌کنم*.'
    example_gloss:
    - Ik sport elke dag.
    - Ik rust een beetje uit.
    - Ik ga vroeg slapen.
  fa.a2.unit45.lesson03.teach.light:
    title: Zelfstandig naamwoord plus werkwoord
    gloss: Ik neem een douche; ik poets mijn tanden; ik sport; ik rust uit
    note: De meeste handelingen voor lichaamsverzorging bestaan uit een zelfstandig naamwoord plus een werkwoord. Het zelfstandig naamwoord blijft gelijk; alleen het werkwoord verandert met de persoon. Het werkwoord ligt voor elk naamwoord vast, dus leer ze als paren.
  fa.a2.unit45.lesson03.teach.ask:
    title: Vragen hoe
    gloss: Hoe zorg je voor jezelf?
    note: '*چطور* betekent ''hoe''.'
  fa.a2.unit45.lesson03.teach.phrase:
    title: Voor jezelf zorgen
    gloss: Ik zorg goed voor mezelf (voor mijn uiterlijk en mijn welzijn)
    note: '*به خودم می‌رسم* is een vaste alledaagse uitdrukking voor tijd nemen om voor jezelf te zorgen. Leer hem als één geheel.'
  fa.a2.unit45.lesson04.teach.state:
    title: Je klaarmaken, moe worden
    gloss: klaar, moe, (lijdend voorwerp-markering), ik maakte / ik deed
    note: '*آماده کردم* is ''ik maakte klaar'' en *خسته کردم* is ''ik maakte moe''; met *خودم رو* worden het ''ik maakte mezelf klaar'' en ''ik maakte mezelf moe''. *رو* markeert datgene waarmee of waaraan je de handeling uitvoert.'
    example_gloss:
    - Ik heb mezelf klaargemaakt.
    - Ik heb mezelf moe gemaakt.
  fa.a2.unit45.lesson04.teach.time:
    title: Deze week
    gloss: deze, week
    note: '*این هفته* betekent ''deze week''.'
    example_gloss:
    - Deze week heb ik mezelf uitgeput.
  fa.a2.unit45.lesson04.teach.make:
    title: Het avondeten maken
    gloss: avondeten, maken, jij deed
    note: '*درست کردم* betekent ''ik maakte'': *شام درست کردم* is ''ik heb het avondeten gemaakt''.'
    example_gloss:
    - Ik heb zelf het avondeten gemaakt.
    - Heb je het zelf gemaakt?
  fa.a2.unit45.lesson04.teach.reflexive:
    title: خود als lijdend voorwerp
    gloss: Ik heb mezelf klaargemaakt; ik heb mezelf moe gemaakt
    note: 'Als de handeling op jezelf gericht is, krijgt *خود* met zijn uitgang *رو* en komt het voor het werkwoord: *خودم رو آماده کردم*. In snelle spreektaal zegt men vaak *خودمو* in plaats van *خودم رو*.'
  fa.a2.unit45.lesson04.teach.emphatic:
    title: خود ter nadruk
    gloss: Ik heb zelf het avondeten gemaakt; heb je het zelf gemaakt?
    note: '*خود* voor het werkwoord, zonder *رو*, benadrukt dat jij het deed en niemand anders. De zin is precies zo opgebouwd als zonder *خودم*.'
  fa.a2.unit45.lesson05.teach.words:
    title: Woorden voor de tekst
    gloss: werk, ik had, ik was, het was, slecht, vrijdag, eerst, daarna, een, uur, nu, en
    note: '*بودم* is ''ik was'' en *بود* is ''het was''; *داشتم* is ''ik had''.'
    example_gloss:
    - Deze week had ik werk.
    - Ik was moe en voelde me slecht.
    - Op vrijdag nam ik eerst een douche.
    - Daarna heb ik een uur gerust.
    - Nu ben ik blij.
  fa.a2.unit45.lesson05.teach.reading:
    title: Een week en een vrijdag
    gloss: Deze week had ik heel veel werk. Ik was moe en voelde me slecht. Op vrijdag heb ik voor mezelf gezorgd. Eerst nam ik een douche. Daarna heb ik een uur gerust. Nu ben ik blij en voel ik me goed.
    note: Lees één keer om de gevoelens te begrijpen en daarna nog een keer om te zien wat de spreker deed om zich beter te voelen.
  fa.a2.unit45.lesson06.teach.turn01:
    title: Sara vraagt hoe het met Nima gaat
    gloss: 'Sara: Nima, hoe gaat het met je?'
    note: '*حالت چطوره؟* vraagt hoe je je voelt.'
  fa.a2.unit45.lesson06.teach.turn02:
    title: Nima zegt dat hij moe is
    gloss: 'Nima: Ik ben heel moe. Deze week heb ik mezelf uitgeput.'
    note: '*خودم رو خسته کردم* laat het reflexieve patroon zien.'
  fa.a2.unit45.lesson06.teach.turn03:
    title: Sara geeft advies
    gloss: 'Sara: Je moet goed voor jezelf zorgen.'
    note: '*باید* plus *کنی* zegt wat iemand moet doen.'
  fa.a2.unit45.lesson06.teach.turn04:
    title: Nima beschrijft zijn routine
    gloss: 'Nima: Ja. ''s Ochtends neem ik een douche, maar ik sport niet.'
    note: '*ولی* betekent ''maar''; *نمی‌کنم* is de ontkenning van *می‌کنم*.'
  fa.a2.unit45.lesson06.teach.turn05:
    title: Sara zegt dat hij goed op zichzelf moet letten
    gloss: 'Sara: Pas goed op jezelf! Rust een beetje uit.'
    note: '*استراحت کن* is de vriendelijke gebiedende wijs: laat *می‌* en de persoonsuitgang weg.'
  fa.a2.unit45.lesson06.teach.turn06:
    title: Nima stemt in
    gloss: 'Nima: Oké. Vanavond ga ik vroeg slapen.'
    note: '*باشه* betekent ''oké''.'
