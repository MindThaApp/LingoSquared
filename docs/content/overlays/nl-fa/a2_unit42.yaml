teaching:
  fa.a2.unit42.lesson01.teach.clothes:
    title: Kleding en tassen
    gloss: overhemd, schoenen, tas, broek, jas
    note: '*کفش* betekent “schoenen” (één woord voor het paar).'
    example_gloss:
    - Ik heb een overhemd.
    - Ik heb een paar schoenen.
    - Ik heb een tas.
    - Ik heb een broek.
    - Ik heb een jas.
  fa.a2.unit42.lesson01.teach.colours:
    title: Kleuren
    gloss: wit, zwart, rood, blauw, groen
    note: Kleuren zijn bijvoeglijke naamwoorden en komen na het zelfstandig naamwoord.
    example_gloss:
    - Mijn overhemd is wit.
    - Mijn tas is zwart.
    - Mijn schoenen zijn rood.
    - Mijn broek is blauw.
    - Mijn jas is groen.
  fa.a2.unit42.lesson01.teach.size_age:
    title: Groot, klein, nieuw, oud
    gloss: groot, klein, nieuw, oud
    note: '*نو* en *قدیمی* geven aan hoe nieuw of oud iets is.'
    example_gloss:
    - Mijn tas is groot.
    - Mijn schoenen zijn klein.
    - Mijn jas is niet nieuw.
    - Mijn overhemd is oud.
  fa.a2.unit42.lesson01.teach.ezafe:
    title: 'Zelfstandig naamwoord + bijvoeglijk naamwoord: de verbindingsklank'
    gloss: een rode tas; een wit overhemd; nieuwe schoenen
    note: 'In het Perzisch komt het bijvoeglijk naamwoord na het zelfstandig naamwoord. Een korte verbindingsklinker *-e* (de ezafe) verbindt ze als je spreekt: *کیف قرمز* zeg je als “kif-e qermez”. Na een medeklinker wordt deze klinker niet geschreven.'
  fa.a2.unit42.lesson02.teach.owners:
    title: Eigenaars
    gloss: Sara, Nima, wie, van wie is het
    note: '*کیه؟* vraagt “wie is het?” of “van wie is het?”.'
    example_gloss:
    - Van wie is deze tas?
    - Van wie zijn deze schoenen?
  fa.a2.unit42.lesson02.teach.owner_rule:
    title: Zelfstandig naamwoord + eigenaar
    gloss: Sara’s tas; Nima’s schoenen; het overhemd van de manager
    note: 'De eigenaar komt na het bezit, verbonden met dezelfde verbindingsklank *-e*: *کیف سارا* is “kif-e Sara”. In het Nederlands kun je zeggen “Sara’s tas” of “de tas van Sara”; in het Perzisch staat de eigenaar altijd achteraan.'
  fa.a2.unit42.lesson02.teach.whose:
    title: Van wie is het?
    gloss: Van wie is deze tas? Sara’s tas.
    note: 'Vraag *این ... کیه؟* en antwoord met het ding en de eigenaar. Voor “het is van Nima” voeg je *است* aan de naam toe: *این کفش نیماست*.'
  fa.a2.unit42.lesson03.teach.things:
    title: Huis en kleding
    gloss: huis, jas, stoel, tafel
    note: '*خونه* eindigt op een stomme *ه*; *پالتو* eindigt op de klinker *و*; *صندلی* eindigt op *ی*.'
    example_gloss:
    - Het huis is groot.
    - De jas is zwart.
    - De stoel staat hier.
    - De tafel staat daar.
  fa.a2.unit42.lesson03.teach.rule_h:
    title: 'Na een stomme ه: ه‌ی'
    gloss: het grote huis; Nima’s huis
    note: 'Na een stomme *ه* schrijf je de verbindingsklinker als *ی* met een halve spatie: *خونه‌ی بزرگ*, *خونه‌ی نیما*.'
  fa.a2.unit42.lesson03.teach.rule_v:
    title: Na و en ی
    gloss: de zwarte jas; Sara’s jas; Nima’s stoel
    note: 'Na *و* schrijf je de verbindingsklinker als *ی*: *پالتوی سیاه*. Na *ی* zeg je “-ye”, maar er wordt niets extra geschreven: *صندلی نیما*.'
  fa.a2.unit42.lesson04.teach.materials:
    title: Materialen en een bank
    gloss: leren, houten, bank
    note: '*چرمی* betekent “van leer”, *چوبی* “van hout”.'
    example_gloss:
    - Mijn tas is van leer.
    - De tafel is van hout.
    - De bank staat hier.
  fa.a2.unit42.lesson04.teach.chain1:
    title: Zelfstandig naamwoord + bijvoeglijk naamwoord + eigenaar
    gloss: Sara’s rode tas; Nima’s zwarte jas; Nima’s grote huis
    note: 'Je kunt na het zelfstandig naamwoord steeds meer woorden toevoegen, elk verbonden met de verbindingsklinker. De eigenaar komt als laatste: *کیف قرمز سارا* (kif-e qermez-e Sara). De eigenaar is de laatste schakel.'
  fa.a2.unit42.lesson04.teach.chain2:
    title: Zelfstandig naamwoord + twee bijvoeglijke naamwoorden
    gloss: een zwarte leren tas; een grote houten tafel; een nieuwe rode bank
    note: 'Twee bijvoeglijke naamwoorden volgen hetzelfde patroon. Beide volgordes komen voor; materiaal vóór kleur of grootte is iets gebruikelijker: *کیف چرمی سیاه*, *میز چوبی بزرگ*.'
  fa.a2.unit42.lesson05.teach.reading:
    title: Een kwijtgeraakte tas
    gloss: Ik ben mijn tas kwijt. Mijn tas is rood, van leer en klein. In de tas zit een zwarte telefoon. Mijn zwarte telefoon is oud. In de tas zit ook een blauwe bril. De blauwe bril is van Nima.
    note: Lees eerst één keer voor de tas en daarna nog een keer voor de spullen erin.
  fa.a2.unit42.lesson06.teach.turn01:
    title: De medewerker laat een jas zien
    gloss: 'Medewerker: Pardon, is deze zwarte jas van u?'
    note: '*مال شماست* is de beleefde vorm van “is van u”.'
  fa.a2.unit42.lesson06.teach.turn02:
    title: Nima beschrijft zijn eigen jas
    gloss: 'Nima: Nee, mijn jas is blauw. Mijn blauwe jas is groot.'
    note: '*پالتوی آبی من*: zelfstandig naamwoord + bijvoeglijk naamwoord + eigenaar.'
  fa.a2.unit42.lesson06.teach.turn03:
    title: De medewerker biedt een tas aan
    gloss: 'Medewerker: Een grote blauwe jas heb ik niet. Wat dacht u van deze rode leren tas?'
    note: '*کیف قرمز چرمی*: zelfstandig naamwoord + kleur + materiaal (*کیف چرمی قرمز* is ook correct).'
  fa.a2.unit42.lesson06.teach.turn04:
    title: Nima noemt de eigenaar
    gloss: 'Nima: Dat is de tas van Sara. Saras tas is rood.'
    note: '*ساراست* is de gesproken vorm van *سارا است*.'
