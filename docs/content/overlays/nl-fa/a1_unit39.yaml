course:
  title: Farsi in het Nederlands A1
  description: 'Perzisch (Iraans) voor beginners: de drie hulpdiensten (politie, ambulance, brandweer) benoemen, zeggen wat er nodig is, om hulp vragen met beleefde opdrachten, een dialoog met een noodoproep en een kort noodbericht lezen.'
