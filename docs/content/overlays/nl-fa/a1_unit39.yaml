teaching:
  fa.a1.unit39.lesson01.teach.review_komak:
    title: 'Herhaling: hulp'
    gloss: hulp
    note: '*کمک* (''hulp'') heb je eerder al geleerd.'
  fa.a1.unit39.lesson01.teach.lazame:
    title: Nodig
    gloss: is nodig
    note: '*لازمه* is één woord en betekent ''is nodig''. Het is op dezelfde manier gevormd als *قشنگه* (''is mooi'') en *گرمه* (''is warm'').'
    example_gloss: Hulp is nodig!
  fa.a1.unit39.lesson01.teach.polis:
    title: Politie
    gloss: politie
    note: '*پلیس* betekent ''politie''. Het is een leenwoord dat in het dagelijks taalgebruik gebruikt wordt.'
    example_gloss: De politie is nodig!
  fa.a1.unit39.lesson01.teach.ambulance:
    title: Ambulance
    gloss: ambulance
    note: '*آمبولانس* betekent ''ambulance''.'
    example_gloss: Een ambulance is nodig!
  fa.a1.unit39.lesson02.teach.atashneshani:
    title: Brandweer
    gloss: brandweer
    note: '*آتش‌نشانی* betekent ''brandweer''.'
    example_gloss: De brandweer is nodig!
  fa.a1.unit39.lesson02.teach.atash:
    title: Brand
    gloss: brand
    note: '*آتش* betekent ''vuur'' of ''brand''. Het is de stam van *آتش‌نشانی* (''brandweer'').'
    example_gloss: Brand! De brandweer is nodig!
  fa.a1.unit39.lesson02.teach.khatar:
    title: Gevaar
    gloss: gevaar
    note: '*خطر* betekent ''gevaar''.'
    example_gloss: Gevaar! De politie is nodig!
  fa.a1.unit39.lesson03.teach.review_ken_konid:
    title: 'Herhaling: formele en informele opdrachten'
    gloss: doe! (formeel) / doe! (informeel)
    note: '*کنید* is de formele of meervoudige gebiedende vorm. De informele vorm *کن*, die je met vrienden gebruikte in *استراحت کن* (''rust uit!''), gebruik je voor één persoon die je goed kent.'
  fa.a1.unit39.lesson03.teach.komak_konid:
    title: Help!
    gloss: Help!
    note: '*کمک کنید!* is de beleefde manier om om hulp te roepen, geschikt voor vreemden en hulpverleners.'
  fa.a1.unit39.lesson03.teach.tasadof:
    title: Ongeluk
    gloss: ongeluk
    note: '*تصادف* betekent ''ongeluk'' (bijvoorbeeld een verkeersongeluk).'
    example_gloss: Ongeluk! Help!
  fa.a1.unit39.lesson03.teach.orjans:
    title: Noodgeval
    gloss: noodgeval
    note: '*اورژانس* betekent ''noodgeval''. Het is ook het woord voor de spoedeisende hulp van een ziekenhuis.'
    example_gloss: Het is een noodgeval! Help!
  fa.a1.unit39.lesson04.teach.review_alo_bashe_mamnoon:
    title: 'Herhaling: hallo / oké / bedankt'
    gloss: hallo (aan de telefoon) / oké / bedankt
    note: '*الو*, *باشه* en *ممنون* heb je eerder al geleerd.'
  fa.a1.unit39.lesson04.teach.review_miad:
    title: Komt eraan
    gloss: komt eraan
    note: '*میاد* (''hij/zij/het komt eraan'') volgt hetzelfde patroon van persoonsuitgangen als *میام* (''ik kom eraan''), dat je eerder hebt geleerd.'
  fa.a1.unit39.lesson04.teach.zud_biayid:
    title: Kom snel!
    gloss: Kom snel!
    note: '*زود* betekent ''snel''; *بیایید* is de beleefde gebiedende wijs ''kom!'''
  fa.a1.unit39.lesson04.teach.zang_bezanid:
    title: Bel!
    gloss: Bel!
    note: '*زنگ بزنید!* is de beleefde gebiedende wijs van *زنگ زدن* (''bellen''), dat je eerder hebt geleerd.'
  fa.a1.unit39.lesson04.teach.dialogue_line1:
    title: 'Nima: Hallo! Help! De politie is nodig!'
    gloss: Hallo! Help! De politie is nodig!
  fa.a1.unit39.lesson04.teach.dialogue_line2:
    title: 'Sara: Oké. De politie komt eraan.'
    gloss: Oké. De politie komt eraan.
  fa.a1.unit39.lesson04.teach.dialogue_line3:
    title: 'Nima: Bedankt! Kom snel!'
    gloss: Bedankt! Kom snel!
  fa.a1.unit39.lesson04.teach.dialogue_line4:
    title: 'Sara: Oké!'
    gloss: Oké!
  fa.a1.unit39.lesson05.teach.reading_note:
    title: Over dit bericht
    gloss: Ongeluk / gevaar / brand
    note: 'In het bericht staat achter elke soort noodgeval een vraagteken, alsof er gevraagd wordt: ''Bij een ongeluk?''. De dienst die je moet bellen volgt direct daarna.'
  fa.a1.unit39.lesson05.teach.reading_text:
    title: 'Lezen: Noodbericht'
    gloss: Ongeluk? Een ambulance is nodig! Gevaar? De politie is nodig! Brand? De brandweer is nodig! Bel snel!
    note: Een kort bericht dat zegt welke dienst je moet bellen bij welk soort noodgeval.
  fa.a1.unit39.lesson06.teach.review_polis_komak:
    title: De politie is nodig! Help!
    gloss: De politie is nodig! Help!
    note: Een herhalingszin die alleen uit woorden van deze unit bestaat.
