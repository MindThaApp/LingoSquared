course:
  title: Farsi in het Nederlands A1
  description: 'Farsi (Iraans Perzisch) voor beginners: leer de schrijfwijze lezen, alledaagse spreektaal begrijpen en op een beleefde manier praktische gesprekken voeren.'
units:
  fa.a1.unit01.greetings:
    title: Begroetingen en eerste ontmoetingen
lessons:
  fa.a1.unit01.lesson01.script_ramp:
    title: Lees je eerste Perzische woord
  fa.a1.unit01.lesson02.everyday_greetings:
    title: Alledaagse begroetingen
  fa.a1.unit01.lesson03.time_and_farewells:
    title: Begroetingen en afscheid door de dag heen
  fa.a1.unit01.lesson04.formal_informal_wellbeing:
    title: Beleefde en informele small talk
  fa.a1.unit01.lesson05.taarof_basics:
    title: Een eerste blik op taarof
  fa.a1.unit01.lesson06.first_meeting_dialogue:
    title: Gesprek bij een eerste ontmoeting
teaching:
  fa.a1.unit01.lesson01.teach.rtl:
    title: Perzisch loopt van rechts naar links
    gloss: Perzisch wordt van rechts naar links geschreven.
    note: Lees Perzisch vanaf de rechterkant naar links.
  fa.a1.unit01.lesson01.teach.seen:
    title: De letter س
    gloss: s
    note: س staat normaal voor een s-klank.
  fa.a1.unit01.lesson01.teach.lam:
    title: De letter ل
    gloss: l
    note: ل staat voor een l-klank en verbindt met de letters eromheen.
  fa.a1.unit01.lesson01.teach.alef:
    title: De letter ا
    gloss: ā / a
    note: ا geeft vaak een lange ā aan en verbindt niet door met de volgende letter.
  fa.a1.unit01.lesson01.teach.mim:
    title: De letter م
    gloss: m
    note: م staat voor een m-klank en verandert van vorm als het verbonden wordt.
  fa.a1.unit01.lesson01.teach.salam_shape:
    title: Bouw سلام
    gloss: hallo
    note: سلام lees je als salâm. Korte klinkers worden in het Perzisch normaal niet geschreven.
    example_gloss: Hallo! Ik ben Nima.
  fa.a1.unit01.lesson02.teach.salam:
    title: Hallo
    gloss: hallo
    note: سلام past zowel in formele als in informele situaties.
    example_gloss: Hoi, gaat het goed met je?
  fa.a1.unit01.lesson02.teach.sobh_bekheyr:
    title: Goedemorgen
    gloss: goedemorgen
    note: صبح بخیر is een neutraal-beleefde ochtendgroet.
  fa.a1.unit01.lesson02.teach.asr_bekheyr:
    title: Goedemiddag of goedenavond
    gloss: goedemiddag / goedenavond
    note: عصر بخیر gebruik je vanaf de late middag tot in de avond.
  fa.a1.unit01.lesson02.teach.khodahafez:
    title: Tot ziens
    gloss: tot ziens
    note: خداحافظ lees je als khodâhâfez en is het standaard algemene afscheid.
    example_gloss: Tot ziens, tot later!
  fa.a1.unit01.lesson02.teach.mamnoon:
    title: Dank je
    gloss: dank je
    note: ممنون is gewoon en natuurlijk; متشکرم is iets formeler.
    example_gloss: Hartelijk bedankt.
  fa.a1.unit01.lesson02.teach.khahesh_mikonam:
    title: Graag gedaan
    gloss: graag gedaan
    note: خواهش می‌کنم is het gebruikelijke antwoord op een bedankje.
  fa.a1.unit01.lesson02.teach.hale_shoma:
    title: Hoe gaat het met u? Beleefde spreektaal
    gloss: Hoe gaat het met u?
    note: حالتون چطوره؟ is neutraal-beleefd gesproken Iraans Perzisch. حال شما چطور است؟ is de formelere of geschreven variant.
  fa.a1.unit01.lesson02.teach.khoobam:
    title: Het gaat goed met me
    gloss: het gaat goed met me
    note: خوبم bestaat uit خوب met de uitgang ـم voor de eerste persoon.
  fa.a1.unit01.lesson03.teach.rooz_bekheyr:
    title: Goede dag
    gloss: goede dag
    note: روز بخیر is beleefd, maar in informele spreektaal minder gebruikelijk dan سلام.
  fa.a1.unit01.lesson03.teach.shab_bekheyr:
    title: Welterusten
    gloss: goedenacht
    note: شب بخیر is normaal een afscheid of een welterusten-wens, geen openingsgroet.
  fa.a1.unit01.lesson03.teach.khosh_amadeed:
    title: Welkom
    gloss: welkom
    note: خوش آمدید is de beleefde vorm voor een of meer gasten.
  fa.a1.unit01.lesson03.teach.be_omide_didar:
    title: Tot ziens
    gloss: hopelijk tot ziens / tot we elkaar weer ontmoeten
    note: به امید دیدار is een verzorgd, neutraal-beleefd afscheid.
  fa.a1.unit01.lesson03.teach.fealan:
    title: Tot straks
    gloss: tot straks
    note: فعلاً is informeel en minder formeel dan خداحافظ.
  fa.a1.unit01.lesson03.teach.rooze_khoobi:
    title: Fijne dag
    gloss: fijne dag
    note: باشید geeft in dit vaste afscheid de beleefdheidsvorm aan.
  fa.a1.unit01.lesson04.teach.formal_question:
    title: Neutraal-beleefde spreektaal
    gloss: Hoe gaat het met u?
    note: Gebruik حالتون چطوره؟ met een onbekende volwassene of in een gewoon beleefd gesprek. De uitdrukkelijk formele of geschreven vorm is حال شما چطور است؟
  fa.a1.unit01.lesson04.teach.informal_question:
    title: Informeel
    gloss: Hoe gaat het met u?
    note: چطوری؟ is spreektaal en past bij vrienden, familie en leeftijdsgenoten als de verhouding het toelaat.
  fa.a1.unit01.lesson04.teach.to:
    title: Informeel 'je'
    gloss: jij
    note: تو is enkelvoud en informeel; gebruik het niet automatisch bij een onbekende volwassene.
  fa.a1.unit01.lesson04.teach.very_well:
    title: Heel goed
    gloss: het gaat heel goed met me
    note: خیلی versterkt خوبم.
  fa.a1.unit01.lesson04.teach.not_bad:
    title: Niet slecht
    gloss: het gaat niet slecht, bedankt
    note: بد نیستم is een natuurlijk gematigd antwoord en geen negatieve klacht.
  fa.a1.unit01.lesson04.teach.and_you_formal:
    title: En met u? Beleefd
    gloss: En u?
    note: Gebruik شما چطور؟ om de vraag beleefd terug te stellen.
  fa.a1.unit01.lesson04.teach.and_you_informal:
    title: En met jou? Informeel
    gloss: En u?
    note: تو چطور؟ past bij een informele relatie.
  fa.a1.unit01.lesson05.teach.chai:
    title: Thee
    gloss: thee
    note: '*چای* is de drank. Je hoort het in het aanbod *چای بفرمایید* (neem wat thee).'
    example_gloss: Alstublieft, wilt u thee?
  fa.a1.unit01.lesson05.teach.befarmaeed:
    title: Alstublieft, ga uw gang
    gloss: alstublieft / ga uw gang / hier, neem maar
    note: '*بفرمایید* verandert met de situatie: het kan betekenen hier, neem maar (bij het aanbieden van thee), komt u binnen (bij een deur) of na u.'
  fa.a1.unit01.lesson05.teach.lotf_dareed:
    title: U bent vriendelijk
    gloss: u bent te vriendelijk
    note: لطف دارید beantwoordt een compliment beleefd.
  fa.a1.unit01.lesson05.teach.zahmat_nakeshid:
    title: Doe geen moeite, alstublieft
    gloss: doe alstublieft geen moeite
    note: زحمت نکشید kan een oprechte weigering zijn of een beleefd eerste antwoord op een concreet aanbod.
  fa.a1.unit01.lesson05.teach.mamnoon_lotf:
    title: Dank u voor uw vriendelijkheid
    gloss: dank u voor uw vriendelijkheid
    note: Dit is warmer en explicieter dan ممنون alleen.
  fa.a1.unit01.lesson05.teach.cultural_pattern:
    title: Taarof
    gloss: Iraanse beleefdheidsregels die van de situatie afhangen
    note: Taarof verwijst naar situatiegebonden regels voor aanbieden, afslaan, bedanken en respect tonen. De praktijk verschilt per relatie, generatie, regio en situatie; geen vast aantal weigeringen of herhalingen bepaalt of een aanbod oprecht is.
  fa.a1.unit01.lesson06.teach.line01:
    title: Welkom
    gloss: Ali verwelkomt Narges.
    note: Het gesprek begint met een groet vóór het voorstellen.
  fa.a1.unit01.lesson06.teach.line02:
    title: Welkom, antwoord
    gloss: Narges groet hem terug en bedankt hem.
    note: ممنون (bedankt) is een natuurlijk antwoord op een welkom.
  fa.a1.unit01.lesson06.teach.line03:
    title: Namen uitwisselen
    gloss: Ali zegt wie hij is.
    note: '*من علی هستم* betekent ik ben Ali. *هستم* (ben) staat aan het einde van de zin.'
  fa.a1.unit01.lesson06.teach.line04:
    title: Namen uitwisselen, antwoord
    gloss: Narges zegt wie zij is.
    note: Hetzelfde patroon *من ... هستم* dat Ali net gebruikte.
  fa.a1.unit01.lesson06.teach.line05:
    title: Aangenaam kennis te maken
    gloss: Ali zegt dat hij het fijn vindt kennis met haar te maken.
    note: '*خوشوقتم* betekent ik ben verheugd. Met *از آشنایی با شما* is het de standaard beleefde zin bij een kennismaking.'
  fa.a1.unit01.lesson06.teach.line06:
    title: Aangenaam kennis te maken, antwoord
    gloss: Narges beantwoordt zijn woorden.
    note: همین‌طور betekent in dit antwoord eveneens of zo ook.
  fa.a1.unit01.lesson06.teach.line07:
    title: Vragen hoe het met iemand gaat
    gloss: Ali vraagt beleefd hoe het met haar gaat.
    note: Ali gebruikt de neutraal-beleefde gesproken vorm op ـتون, omdat dit een beleefde eerste ontmoeting is.
  fa.a1.unit01.lesson06.teach.line08:
    title: Vragen hoe het met iemand gaat, antwoord
    gloss: Narges antwoordt en stelt de vraag terug.
    note: شما چطور؟ gebruikt de vraag opnieuw om haar terug te stellen, een gebruikelijke verkorting.
  fa.a1.unit01.lesson06.teach.line09:
    title: Uitnodiging
    gloss: Ali zegt dat het ook met hem goed gaat en nodigt Narges uit binnen te komen.
    note: '*بفرمایید داخل* betekent komt u binnen. *داخل* (binnen) laat zien wat er wordt aangeboden.'
  fa.a1.unit01.lesson06.teach.line10:
    title: Beleefd weigeren
    gloss: Narges bedankt hem, maar legt uit dat ze weg moet.
    note: Een beleefde weigering begint toch met een bedankje vóór het nee. *ولی باید برم* betekent maar ik moet gaan.
  fa.a1.unit01.lesson06.teach.line11:
    title: Het gesprek afsluiten
    gloss: Ali erkent haar antwoord en hoopt haar weer te ontmoeten.
    note: De afgeslagen uitnodiging leidt nu vanzelf naar het afscheid.
  fa.a1.unit01.lesson06.teach.line12:
    title: Het gesprek afsluiten, antwoord
    gloss: Narges zegt gedag.
    note: '*خداحافظ* is het standaard algemene afscheid.'
