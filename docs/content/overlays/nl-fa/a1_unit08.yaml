    gloss: De winkelier zegt dat het 30 toman per kilo kost.
    note: کیلویی سی تومنه uit les 2.
  fa.a1.unit08.lesson06.teach.turn04:
    title: De klant bestelt en vraagt om korting
    gloss: De klant zegt dat hij of zij een kilo wil en vraagt om korting.
    note: Dit combineert het hoeveelheidspatroon uit les 3 met de kortingsvraag uit les 4.
  fa.a1.unit08.lesson06.teach.turn05:
    title: De winkelier gaat akkoord met een lagere prijs
    gloss: De winkelier stemt in en biedt 28 toman aan.
    note: باشه (oké) geeft instemming aan voordat de prijs met korting wordt genoemd.
  fa.a1.unit08.lesson06.teach.turn06:
    title: De klant bedankt en betaalt
    gloss: De klant bedankt de winkelier en zegt dat hij of zij contant betaalt.
    note: Dit combineert de betaalwoorden uit les 5 met een eenvoudig bedankje.
  fa.a1.unit08.lesson06.teach.turn07:
