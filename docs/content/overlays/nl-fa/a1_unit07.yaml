    title: Sneeuwachtig
    gloss: sneeuwachtig
    note: برفی beschrijft sneeuwachtig weer.
    example_gloss: In de winter is het sneeuwachtig.
  fa.a1.unit07.lesson01.teach.or_word:
    title: Of
    gloss: of
    note: یا verbindt twee mogelijke weertypes.
    target_text: یا (of)
  fa.a1.unit07.lesson02.teach.hot:
    title: Heet
    gloss: heet
    note: گرم beschrijft heet weer of een hoge temperatuur in het algemeen.
    example_gloss: Het is vandaag warm.
  fa.a1.unit07.lesson02.teach.cold:
    title: Koud
    gloss: koud
    note: سرد beschrijft koud weer of een lage temperatuur in het algemeen.
    example_gloss: In de winter is het koud.
  fa.a1.unit07.lesson02.teach.cool:
    title: Koel
    gloss: koel
    note: خنک beschrijft mild, koel weer, tussen گرم en سرد in.
    example_gloss: ’s Avonds is het koel.
  fa.a1.unit07.lesson03.teach.weather_word:
    title: Weer
    gloss: het weer
    note: هوا is het algemene woord voor weer (en betekent ook lucht).
    example_gloss: Hoe is het weer vandaag?
  fa.a1.unit07.lesson03.teach.weather_question:
    title: Vragen hoe het weer is
    gloss: Hoe is het weer?
    note: هوا چطوره؟ gebruikt چطوره, hetzelfde informele vraagwoord voor 'hoe is' dat je in Unit 1 al zag in حالتون چطوره؟
  fa.a1.unit07.lesson03.teach.today_word:
    title: Vandaag
    gloss: vandaag
    note: امروز verwijst naar de huidige dag.
    example_gloss: Het weer is vandaag mooi.
  fa.a1.unit07.lesson03.teach.tomorrow_word:
    title: Morgen
    gloss: morgen
    note: فردا verwijst naar de volgende dag.
    example_gloss: Tot morgen.
  fa.a1.unit07.lesson04.teach.today_sunny:
    title: Zeggen dat het vandaag zonnig is
    gloss: Vandaag is het zonnig.
    note: امروز هوا آفتابیه gebruikt de informele samentrekking op -e (آفتابیه = آفتابی است) die je in deze cursus al hebt gezien.
  fa.a1.unit07.lesson04.teach.today_cold:
    title: Zeggen dat het vandaag koud is
    gloss: Vandaag is het koud.
    note: امروز سرده volgt hetzelfde samentrekkingspatroon.
  fa.a1.unit07.lesson04.teach.contraction_note:
    title: De informele samentrekking op -e
    gloss: آفتابیه is de alledaagse gesproken samentrekking van آفتابی است.
    note: 'Dit patroon (bijvoeglijk naamwoord + ه) werkt bij elk weerwoord: سرده، گرمه، بارونیه، ابریه، برفیه.'
  fa.a1.unit07.lesson04.teach.today_rainy:
    title: Zeggen dat het vandaag regenachtig is
    gloss: Vandaag is het regenachtig.
    note: امروز بارونیه past dezelfde samentrekking op -e toe op بارونی.
  fa.a1.unit07.lesson05.teach.because_word:
    title: Omdat / aangezien
    gloss: omdat / aangezien
    note: چون geeft de reden voor een voorstel.
    example_gloss: Ik trek een jas aan, omdat het koud is.
  fa.a1.unit07.lesson05.teach.better_to:
    title: Voorstellen een paraplu mee te nemen
    gloss: We nemen beter een paraplu mee.
    note: بهتره چتر ببریم gebruikt het informele بهتره (het is beter) voor een zacht voorstel.
  fa.a1.unit07.lesson05.teach.full_suggestion:
    title: Een reden en een voorstel combineren
    gloss: Omdat het regent, nemen we beter een paraplu mee.
    note: چون بارونیه، بهتره چتر ببریم verbindt een reden op basis van het weer met een voorstel.
  fa.a1.unit07.lesson05.teach.coat_suggestion:
    title: Voorstellen een jas aan te trekken
    gloss: Omdat het koud is, trekken we beter een jas aan.
    note: چون سرده، بهتره کت بپوشیم volgt hetzelfde patroon van reden plus voorstel, nu bij koud weer.
  fa.a1.unit07.lesson06.teach.coat_review:
    title: Voorstellen een jas aan te trekken
    gloss: we trekken beter een jas aan
    note: کت بپوشیم volgt hetzelfde patroon van بهتره + werkwoord als چتر ببریم, nu bij koud weer.
    example_gloss: Het is koud, laten we een jas aantrekken.
  fa.a1.unit07.lesson06.teach.turn01:
    title: Sara vraagt naar het weer van vandaag
    gloss: Sara vraagt hoe het weer vandaag is.
    note: هوا چطوره؟ hergebruikt de vraag uit les 3.
  fa.a1.unit07.lesson06.teach.turn02:
    title: Reza zegt dat het regent
    gloss: Reza zegt dat het volgens hem regenachtig is.
    note: فکر کنم (ik denk) maakt de zin zachter, want hij weet het niet zeker.
  fa.a1.unit07.lesson06.teach.turn03:
    title: Sara stelt voor een paraplu mee te nemen
    gloss: Sara zegt dat ze dan beter een paraplu meenemen.
    note: پس (dan/dus) verbindt het weerfeit met het voorstel.
  fa.a1.unit07.lesson06.teach.turn04:
    title: Reza is het eens en vraagt naar morgen
    gloss: Reza is het eens en vraagt hoe het morgen is.
    note: فردا چی؟ is een natuurlijke, korte manier om naar de volgende dag te vragen.
  fa.a1.unit07.lesson06.teach.turn05:
    title: Sara beschrijft het weer van morgen
    gloss: Sara zegt dat het morgen zonnig en warm wordt.
    note: آفتابیه و گرمه verbindt twee samentrekkingen met و.
  fa.a1.unit07.lesson06.teach.turn06:
    title: Reza stelt voor naar het park te gaan
    gloss: Reza zegt dat dat geweldig is en stelt voor naar het park te gaan.
    note: عالیه (geweldig) is een positieve reactie voordat je een plan voorstelt.
  fa.a1.unit07.lesson06.teach.turn07:
    title: Sara stemt in en neemt afscheid
    gloss: Sara stemt in en zegt dat ze hem morgen ziet.
    note: باشه (oké) is een gebruikelijke informele manier om met een plan in te stemmen.
