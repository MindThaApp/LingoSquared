teaching:
  fa.a1.unit22.lesson01.teach.phone_word:
    title: Telefoon
    gloss: telefoon
    note: تلفن is het algemene woord voor telefoon.
    example_gloss: Waar is mijn telefoon?
  fa.a1.unit22.lesson01.teach.message_word:
    title: Bericht
    gloss: bericht
    note: پیام is een geschreven bericht of sms.
    example_gloss: Ik heb een bericht.
  fa.a1.unit22.lesson01.teach.call_word:
    title: Bellen
    gloss: bellen
    note: زنگ زدن (letterlijk 'bellen' in de zin van 'rinkelen') is het alledaagse werkwoord voor iemand bellen.
    example_gloss: Bel me.
  fa.a1.unit22.lesson01.teach.voice_word:
    title: Stem
    gloss: stem
    note: صدا betekent stem en gebruik je om te zeggen hoe iemand klinkt tijdens een gesprek.
    example_gloss: Je stem klinkt goed.
  fa.a1.unit22.lesson01.teach.va_word:
    title: En
    gloss: en
    note: و is het gewone verbindingswoord, herhaling uit eerdere units.
    target_text: و (en)
  fa.a1.unit22.lesson02.teach.hello_phone:
    title: Hallo (aan de telefoon)
    gloss: hallo, zegt u het maar
    note: الو is de begroeting aan de telefoon (niet gebruikt als je iemand face-to-face ziet); بفرمایید betekent hier zoiets als 'zeg het maar, ik luister.'
  fa.a1.unit22.lesson02.teach.its_me:
    title: Met mij, Narges
    gloss: hoi, met Narges
    note: '*منم* is *من* (ik) plus de werkwoordsuitgang -م ("ben"), dus het betekent "ik ben het" -- een heel gangbare manier om jezelf aan de telefoon voor te stellen. (Dezelfde spelling kan ook "ik ook" betekenen, namelijk *من هم*; hier maakt de context duidelijk wat bedoeld wordt.)'
  fa.a1.unit22.lesson03.teach.can_you_repeat:
    title: Kun je dat herhalen?
    gloss: kunt u dat herhalen?
    note: می‌شه (spreektaal voor می‌شود, 'is het mogelijk') + تکرار کنید (herhaal) is de standaard beleefde vraagvorm.
  fa.a1.unit22.lesson03.teach.speak_slower:
    title: Praat alsjeblieft langzamer
    gloss: praat alstublieft langzamer
    note: آهسته‌تر is de vergrotende trap van آهسته (langzaam) -- 'langzamer.'
  fa.a1.unit22.lesson04.teach.message_for_you:
    title: Ik heb een bericht voor je
    gloss: ik heb een bericht voor je
    note: برات is een samentrekking van برای (voor) + ت (informeel 'je/jou').
  fa.a1.unit22.lesson04.teach.tomorrow_four:
    title: Kom morgen om vier uur naar het café
    gloss: kom morgen om vier uur naar het café
    note: بیا is de informele gebiedende wijs van آمدن (komen), gevormd met alleen de stam, net als andere gebiedende wijzen die je in A1 al hebt gezien.
  fa.a1.unit22.lesson05.teach.goodbye_call:
    title: Doei, we praten later
    gloss: doei, we praten later
    note: بعداً betekent later; صحبت می‌کنیم is de tegenwoordige/toekomende tijd 'we praten/zullen praten.'
  fa.a1.unit22.lesson05.teach.better_now:
    title: Is het nu beter?
    gloss: is het nu beter?
    note: الان betekent nu; بهتر شد is letterlijk 'werd beter'. In het Perzisch gebruik je voor deze controlevraag vanzelfsprekend de verleden tijd, terwijl we in het Nederlands de tegenwoordige tijd gebruiken.
  fa.a1.unit22.lesson06.teach.how_are_you:
    title: Hoi Narges, hoe gaat het?
    gloss: hoi Narges, hoe gaat het?
    note: '*چطوری* is het informele "hoe gaat het (met je)", passend hier omdat Ali en Narges vrienden zijn.'
  fa.a1.unit22.lesson06.teach.cutting_out:
    title: Je stem valt steeds weg
    gloss: je stem valt steeds weg
    note: قطع و وصل می‌شه is letterlijk 'wordt verbroken en verbonden' -- de natuurlijke Perzische uitdrukking voor een telefoonverbinding die wegvalt.
  fa.a1.unit22.lesson06.teach.turn01:
    title: Ali neemt op
    gloss: 'Ali: Hallo, zegt u het maar.'
  fa.a1.unit22.lesson06.teach.turn02:
    title: Narges stelt zich voor
    gloss: 'Narges: Hoi Ali, met Narges.'
  fa.a1.unit22.lesson06.teach.turn03:
    title: Ali begroet haar terug
    gloss: 'Ali: Hoi Narges, hoe gaat het?'
  fa.a1.unit22.lesson06.teach.turn04:
    title: Narges vraagt hem langzamer te praten
    gloss: 'Narges: Goed, dank je. Kun je alsjeblieft langzamer praten? Je stem valt steeds weg.'
  fa.a1.unit22.lesson06.teach.turn05:
    title: Ali controleert het
    gloss: 'Ali: Oké, is het nu beter?'
  fa.a1.unit22.lesson06.teach.turn06:
    title: Narges geeft de boodschap door
    gloss: 'Narges: Ja, beter. Ik heb een bericht voor je: kom morgen om vier uur naar het café.'
  fa.a1.unit22.lesson06.teach.they_go:
    title: Zij gaan (informeel)
    gloss: zij gaan (spreektaal)
    note: '*می‌رن* is de informele gesproken vorm van *می‌روند* (zij gaan), in hetzelfde spreektaalregister als de rest van deze cursus.'
    target_text: می‌رن (ze gaan, informeel/spreektaal)
  fa.a1.unit22.lesson06.teach.turn07:
    title: Ali bevestigt
    gloss: 'Ali: Oké, ik kom zeker.'
  fa.a1.unit22.lesson06.teach.turn08:
    title: Narges beëindigt het gesprek
    gloss: 'Narges: Doei, we praten later.'
  fa.a1.unit22.lesson06.teach.turn09:
    title: Ali neemt afscheid
    gloss: 'Ali: Doei.'
