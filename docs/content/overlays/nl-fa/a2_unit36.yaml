teaching:
  fa.a2.unit36.lesson01.teach.going:
    title: Naar plekken gaan
    gloss: ik ging, ik ga, gisteren, vandaag
    note: '*رفتم* is de eenvoudige verleden tijd (ik ging); *می‌رم* is de gesproken tegenwoordige tijd (ik ga / ik ben onderweg naar).'
    example_gloss:
    - Gisteren ben ik naar de markt gegaan.
    - Vandaag ga ik naar de bank.
  fa.a2.unit36.lesson01.teach.places:
    title: Plekken voor boodschappen
    gloss: bank, postkantoor, markt
    note: In gesproken Farsi zeg je *رفتم بانک* zonder woord voor “naar”.
    example_gloss:
    - Gisteren ging ik naar de bank.
    - Vandaag ga ik naar het postkantoor.
    - Gisteren ben ik naar de markt gegaan.
  fa.a2.unit36.lesson01.teach.things:
    title: Dingen voor boodschappen
    gloss: geld, pakket, brief, boek, een
    note: '*یه* is de gewone gesproken vorm van “een”.'
    example_gloss:
    - Ik heb geld.
    - Ik heb een pakket.
    - Ik heb een brief.
    - Ik heb een boek.
  fa.a2.unit36.lesson01.teach.connectors:
    title: Twee manieren om “om te” te zeggen
    gloss: om te / zodat, om te / zodat (korter, gesproken)
    note: '*برای اینکه* is het volledige voegwoord; *تا* is de kortere, in spreektaal heel gewone variant. Beide worden gevolgd door dezelfde werkwoordsvorm.'
    example_gloss:
    - Ik ging naar de bank om geld op te nemen.
    - Ik ging naar de bank om geld op te nemen.
  fa.a2.unit36.lesson01.teach.purpose_verbs:
    title: Werkwoorden van het doel
    gloss: (dat) ik neem, (dat) ik koop, (dat) ik stuur
    note: Deze uitgangen (*بـ* + stam + *م*) vormen de subjunctief. Ze noemen het doel dat nog niet bereikt is.
    example_gloss:
    - Ik ging naar de bank om geld op te nemen.
    - Ik ging naar de markt om een boek te kopen.
    - Ik ging naar het postkantoor om een brief te sturen.
  fa.a2.unit36.lesson01.teach.post_items:
    title: Post en reisdocumenten
    gloss: envelop, postzegel, paspoort, documenten
    note: '*پاکت* en *تمبر* zijn handig op het postkantoor; *پاسپورت* en *مدارک* moet je vóór een reis klaarmaken.'
    example_gloss:
    - Ik heb een envelop en een postzegel.
    - Ik heb mijn paspoort en documenten.
  fa.a2.unit36.lesson01.teach.travel_items:
    title: Reisvoorbereiding
    gloss: koffer, vreemde valuta, lijst, bestemming
    note: '*چمدون* is de alledaagse gesproken vorm voor een koffer. *مقصد* is de plek die je wilt bereiken.'
    example_gloss:
    - Ik heb een koffer.
    - Ik heb vreemde valuta en een lijst.
    - Naar de bestemming gaan.
  fa.a2.unit36.lesson01.teach.purpose_clause:
    title: برای اینکه + subjunctief
    gloss: Ik ging naar de bank om geld op te nemen
    note: 'Zeg eerst wat je deed, dan *برای اینکه*, dan het doel in de subjunctief: *رفتم بانک برای اینکه پول بگیرم*. Het werkwoord van het doel geeft geen verleden tijd aan: het wijst vooruit naar het doel.'
  fa.a2.unit36.lesson02.teach.learning_words:
    title: Woorden om te leren
    gloss: les, Engels, (dat) ik leer, (dat) ik praat
    note: '*یاد بگیرم* en *حرف بزنم* zijn werkwoorden uit twee delen; de subjunctief-*بـ* staat op het werkwoordsdeel (*بگیرم*, *بزنم*).'
    example_gloss:
    - Ik ga naar les om Engels te leren.
    - Ik lees boeken om Engels te kunnen praten.
  fa.a2.unit36.lesson02.teach.saving_words:
    title: Woorden voor sparen en lezen
    gloss: ik spaar geld, auto, (dat) ik lees
    note: '*پول جمع می‌کنم* is de alledaagse uitdrukking voor geld sparen. *جمع کنم* is de subjunctief ervan.'
    example_gloss:
    - Ik spaar geld om een auto te kopen.
    - Ik lees boeken om Engels te leren.
  fa.a2.unit36.lesson02.teach.subjunctive_shape:
    title: De subjunctief vormen
    gloss: ik neem, zodat ik neem; ik koop, zodat ik koop
    note: 'Laat *می‌* weg en zet *بـ* voor de stam: *می‌گیرم* wordt *بگیرم*, *می‌خرم* wordt *بخرم*. Bij *کردن* laat je *بـ* meestal weg: *جمع می‌کنم* wordt *جمع کنم*. De uitgangen blijven gelijk (*-م* voor “ik”).'
  fa.a2.unit36.lesson02.teach.ta_connector:
    title: تا + subjunctief (en تا بتونم)
    gloss: om geld op te nemen; zodat ik Engels kan praten
    note: '*تا* werkt als *برای اینکه*: *رفتم بانک تا پول بگیرم*. Gebruik *تا بتونم* (“zodat ik kan”) als het doel is dat je iets kunt doen; *بتونم* is zelf een subjunctief en het volgende werkwoord ook.'
  fa.a2.unit36.lesson02.teach.baraye_noun:
    title: برای + zelfstandig naamwoord of werkwoordelijk zelfstandig naamwoord
    gloss: om te winkelen; om een brief te sturen
    note: Na *برای* kun je een gewoon zelfstandig naamwoord zetten (*خرید*, winkelen) of een zelfstandig naamwoord op *-ن* (*فرستادن*, sturen). Dan is er geen subjunctief en geen *اینکه*.
  fa.a2.unit36.lesson03.teach.reason_words:
    title: Woorden voor een reden
    gloss: omdat, waarom, wat, ik had nodig, ik vind leuk
    note: '*چون* geeft een reden. *لازم داشتم* (“ik had nodig”) en *دوست دارم* (“ik vind leuk”) zijn gewone werkwoorden, geen subjunctieven.'
    example_gloss:
    - Ik ging naar de bank omdat ik geld nodig had.
    - Ik ga naar les omdat ik Engels leuk vind.
  fa.a2.unit36.lesson03.teach.reason_vs_purpose:
    title: Reden (چون) of doel (تا)
    gloss: omdat ik geld nodig had / om geld op te nemen
    note: '*چون* kijkt terug naar de oorzaak en gebruikt een gewoon werkwoord: *چون پول لازم داشتم*. *تا* en *برای اینکه* kijken vooruit naar het doel en gebruiken de aanvoegende wijs (subjunctief): *تا پول بگیرم*.'
  fa.a2.unit36.lesson03.teach.which_verb_form:
    title: Kijk naar het werkwoord om ze uit elkaar te houden
    gloss: omdat ik geld nodig had / om geld op te nemen
    note: Heeft de bijzin een gewone tijd (*داشتم*, *دارم*), dan is het voegwoord *چون*. Heeft hij een subjunctief (*بگیرم*, *بخرم*), dan is het voegwoord *برای اینکه* of *تا*.
  fa.a2.unit36.lesson04.teach.purpose_questions:
    title: Vragen waarvoor
    gloss: Waarvoor ging je naar de bank? Waarvoor wil je geld? Waarvoor ga je naar les?
    note: '*برای چی؟* vraagt naar het doel. Het antwoord is een doel met *تا* of *برای اینکه*.'
  fa.a2.unit36.lesson04.teach.answer_pattern:
    title: Vraag en antwoord
    gloss: Waarvoor ging je naar de bank? Ik ging om geld op te nemen.
    note: Beantwoord *برای چی؟* met de handeling plus *تا* of *برای اینکه* plus de subjunctief. Een kort antwoord, alleen *تا پول بگیرم*, is ook natuurlijk.
  fa.a2.unit36.lesson05.teach.reading:
    title: Een dag vol boodschappen
    gloss: Vandaag had ik het druk. Eerst ging ik naar de bank om geld op te nemen. Daarna ging ik naar het postkantoor om een brief te versturen. Ten slotte ging ik naar de markt om inkopen te doen. Ik spaar geld om een auto te kopen.
    note: Lees eerst om de drie boodschappen te vinden, en lees daarna nog eens voor het doel achter elke boodschap.
  fa.a2.unit36.lesson06.teach.turn01:
    title: Sara vraagt waarom Nima te laat is
    gloss: 'Sara vraagt: Nima, waarom ben je te laat?'
    note: '*چرا* vraagt naar een reden.'
  fa.a2.unit36.lesson06.teach.turn02:
    title: Nima geeft een reden
    gloss: 'Nima: Omdat het druk was bij de bank.'
    note: '*چون* plus een gewoon werkwoord in de verleden tijd geeft een reden.'
  fa.a2.unit36.lesson06.teach.turn03:
    title: Sara vraagt waarvoor
    gloss: 'Sara: Waarvoor ging je naar de bank?'
    note: '*برای چی* vraagt nu naar het doel.'
  fa.a2.unit36.lesson06.teach.turn04:
    title: Twee boodschappen met hun doel
    gloss: 'Nima: Ik ging naar de bank om geld op te nemen. Daarna ging ik naar het postkantoor om een pakket te versturen.'
    note: Het ene doel gebruikt *تا* plus een subjunctief; het andere gebruikt *برای* plus een werkwoordelijk zelfstandig naamwoord.
  fa.a2.unit36.lesson06.teach.turn05:
    title: Sara vraagt naar het geld
    gloss: 'Sara: Waarvoor wil je geld?'
    note: Nog een *برای چی*-vraag naar een doel.
  fa.a2.unit36.lesson06.teach.turn06:
    title: Nima noemt het doel
    gloss: 'Nima: Ik spaar geld om een auto te kopen.'
    note: '*تا ماشین بخرم* noemt het doel.'
