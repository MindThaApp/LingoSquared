  fa.a2.unit43.lesson01.teach.oneword:
    title: این en اون staan voor het zelfstandig naamwoord
    gloss: deze appel; die sinaasappel; deze (hier); die (daar)
    note: '*این* wijst naar iets dichtbij, *اون* naar iets veraf. Ze staan voor het zelfstandig naamwoord. Om het zelfstandig naamwoord niet te herhalen gebruik je *یکی*: *این یکی*, *اون یکی*.'
  fa.a2.unit43.lesson01.teach.want:
    title: 'Kiezen: ik wil die (daar)'
    gloss: Ik wil die (daar); ik wil deze (hier)
    note: 'Als je een bepaald ding kiest, komt *رو* erachter: *اون یکی رو می‌خوام*.'
  fa.a2.unit43.lesson02.teach.flowers:
    title: Bloemen en boeken
    gloss: bloem, boek, roman
    note: '*گل* is een bloem.'
    example_gloss:
    - De bloem is mooi.
    - Het boek is hier.
    - De roman is daar.
  fa.a2.unit43.lesson02.teach.plural:
    title: این / اون + meervoud
    gloss: deze appels; die bloemen; deze boeken; die sinaasappels
    note: 'Voeg *‌ها* (met een halve spatie) toe aan het zelfstandig naamwoord en laat *این* of *اون* ervoor staan: *این سیب‌ها* is “deze appels”. In gesproken taal wordt *-ها* vaak *-ا* (*سیبا*).'
  fa.a2.unit43.lesson02.teach.plural_use:
    title: Vragen en kiezen met het meervoud
    gloss: Hoeveel kosten deze appels? Ik wil die bloemen.
    note: Een meervoud dat je kiest krijgt ook *رو*. Na *این* of *اون* + meervoud is een vraag met *چنده؟* de gewone manier om naar de prijs te vragen.
  fa.a2.unit43.lesson03.teach.bookshop:
    title: In de boekwinkel
    gloss: ik wil, heeft u, geef (mij)
    note: '*دارید؟* is het beleefde “heeft u?” en *بدید* het beleefde “geef me”.'
    example_gloss:
    - Ik wil een boek.
    - Heeft u een roman?
    - Geef me dat boek.
  fa.a2.unit43.lesson03.teach.indef:
    title: 'De uitgang -ی: een / wat'
    gloss: Ik wil een boek (maakt niet uit welk); heeft u een roman?
    note: 'Voeg *ی* toe aan het zelfstandig naamwoord als je “een / wat” bedoelt en het niet uitmaakt welk exemplaar. Meestal staat er geen *رو* bij: *کتابی می‌خوام*.'
  fa.a2.unit43.lesson03.teach.indef_def:
    title: Onbepaald of bepaald?
    gloss: Ik wil een boek. Ik wil dat boek.
    note: 'Vergelijk: *کتابی* is een willekeurig boek (zonder *رو*); *اون کتاب رو* is één bepaald boek (met *رو*).'
  fa.a2.unit43.lesson04.teach.shopwords:
    title: Iets, bakker, bloemist
    gloss: iets, bakkerij, bloemenwinkel
    note: '*چیزی* is “iets”; het eindigt al op de onbepaalde *ی*.'
    example_gloss:
    - Ik wil iets.
    - De bakkerij is daar.
    - De bloemenwinkel is hier.
  fa.a2.unit43.lesson04.teach.yeh:
    title: 'یه ... ی: wat, een zekere'
    gloss: wat brood; een bloem; een gebakje; iets
    note: 'In gesproken taal combineer je vaak *یه* voor het zelfstandig naamwoord met *ی* erachter: *یه نونی*, *یه گلی*. Het klinkt als “een of ander ...”. Na een eind-*ی* schrijf je de uitgang als *ای*: *یه شیرینی‌ای*.'
  fa.a2.unit43.lesson04.teach.yeh_use:
    title: Om iets niet-specifieks vragen
    gloss: Geef me wat brood. Ik wil een bloem.
    note: Gebruik *یه ... ی* als je om iets vraagt en het niet uitmaakt welke, bijvoorbeeld bij de bakker of in een bloemenwinkel.
  fa.a2.unit43.lesson05.teach.reading:
    title: Een tochtje naar de markt
    gloss: Vandaag ging ik naar de markt. Eerst ging ik naar de bakker. Ik kocht wat brood. Daarna ging ik naar de bloemenwinkel. Ik zag die rode bloemen. Deze bloemen waren goedkoop, maar die daar waren duur. Ik kocht twee bloemen. Daarna kocht ik ook nog een boek.
    note: Lees één keer voor de winkels en daarna nog eens voor *این*, *اون* en de uitgangen *-ی*.
  fa.a2.unit43.lesson06.teach.turn01:
    title: De verkoper begroet Sara
    gloss: 'Verkoper: Alstublieft. Wat wilt u hebben?'
    note: '*می‌خواید* is het beleefde „u wilt”.'
  fa.a2.unit43.lesson06.teach.turn02:
    title: Sara vraagt om een bloem
    gloss: 'Sara: Ik wil graag een bloem. Hoeveel kosten deze bloemen?'
    note: '*یه گلی* is niet specifiek; *این گل‌ها* wijst naar deze bloemen.'
  fa.a2.unit43.lesson06.teach.turn03:
    title: De verkoper vergelijkt
    gloss: 'Verkoper: Die rode bloemen zijn goedkoop. Deze is duur.'
    note: '*گل‌های قرمز*: meervoudig zelfstandig naamwoord + bijvoeglijk naamwoord, verbonden door de ezafe (de verbindende klank *-e*, na een klinker geschreven als *ی*).'
  fa.a2.unit43.lesson06.teach.turn04:
    title: Sara kiest
    gloss: 'Sara: Ik wil die. Geef me er twee.'
    note: '*دو تا* betekent „twee (stuks)”.'
  fa.a2.unit43.lesson06.teach.turn05:
    title: De verkoper overhandigt ze
    gloss: 'Verkoper: Alstublieft.'
    note: '*بفرمایید* zeg je wanneer je iets overhandigt.'
