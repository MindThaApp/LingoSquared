    gloss: deze/dit, die/dat, één (ervan), hoeveel kost het
    note: '*این یکی* betekent “deze (hier)”, *اون یکی* “die (daar)”.'
    example_gloss:
    - Hoeveel kost deze appel?
    - Die sinaasappel is goedkoop.
    - Deze is duur.
