teaching:
  fa.a1.unit04.lesson01.teach.madar:
    title: Moeder
    gloss: moeder
    note: مادر is het neutrale, geschreven/formele woord voor moeder.
    example_gloss: Mijn moeder is aardig.
  fa.a1.unit04.lesson01.teach.maman:
    title: Mama
    gloss: mama
    note: مامان is het alledaagse gesproken woord dat de meeste gezinnen echt gebruiken.
    example_gloss: Mama, ik heb honger.
  fa.a1.unit04.lesson01.teach.pedar:
    title: Vader
    gloss: vader
    note: پدر is het neutrale, geschreven/formele woord voor vader.
    example_gloss: Mijn vader is arts.
  fa.a1.unit04.lesson01.teach.baba:
    title: Papa
    gloss: papa
    note: بابا is het alledaagse gesproken woord dat de meeste gezinnen echt gebruiken.
    example_gloss: Papa, waar ben je?
  fa.a1.unit04.lesson01.teach.baradar:
    title: Broer
    gloss: broer
    note: برادر; de gesproken, liefkozende vorm داداش komt later in dit hoofdstuk aan bod.
    example_gloss: Ik heb één broer.
  fa.a1.unit04.lesson01.teach.khahar:
    title: Zus
    gloss: zus
    note: خواهر, het standaardwoord voor zus.
    example_gloss: Mijn zus is studente.
  fa.a1.unit04.lesson01.teach.register_note:
    title: Formele versus alledaagse woorden
    gloss: Mama en papa betekenen hetzelfde als moeder en vader, maar zijn informeler.
    note: 'In het Perzisch zijn er twee echte registers voor ouders, geen strikte scheiding formeel/informeel: مامان/بابا zijn wat de meeste mensen hun eigen ouders noemen, zelfs in beleefd gezelschap.'
  fa.a1.unit04.lesson02.teach.daram:
    title: Ik heb
    gloss: ik heb
    note: '*دارم* is de eerste persoon van *داشتن* (''hebben''), het kernwerkwoord om over familie te praten.'
  fa.a1.unit04.lesson02.teach.yek:
    title: Een
    gloss: een
    note: یک, gebruikt voor een geteld zelfstandig naamwoord, bijv. یک برادر (één broer).
    example_gloss: Ik heb één zus.
  fa.a1.unit04.lesson02.teach.one_brother:
    title: Ik heb één broer.
    gloss: Ik heb één broer.
    note: 'Woordvolgorde: onderwerp, hoeveelheid + zelfstandig naamwoord, werkwoord: de typische Perzische SOV-volgorde.'
  fa.a1.unit04.lesson02.teach.no_sister:
    title: Ik heb geen zus.
    gloss: Ik heb geen zus.
    note: ندارم is de ontkenning van دارم; een apart woord voor 'een' is niet nodig.
  fa.a1.unit04.lesson02.teach.family_big:
    title: Mijn gezin is groot.
    gloss: Mijn familie is groot.
    note: بزرگه is de gesproken, samengetrokken vorm van 'بزرگ است' (is groot).
  fa.a1.unit04.lesson02.teach.family_small:
    title: Ons gezin is klein.
    gloss: Ons gezin is klein.
    note: کوچیکه is de gesproken, samengetrokken vorm van 'کوچک است' (is klein), met de spreektaaluitspraak کوچیک in plaats van het geschreven کوچک.
  fa.a1.unit04.lesson03.teach.pedarbozorg:
    title: Grootvader
    gloss: opa
    note: 'پدربزرگ, letterlijk ''grote vader'': wordt voor beide kanten van de familie gebruikt.'
    example_gloss: Mijn opa is oud.
  fa.a1.unit04.lesson03.teach.madarbozorg:
    title: Grootmoeder
    gloss: oma
    note: 'مادربزرگ, letterlijk ''grote moeder'': wordt voor beide kanten van de familie gebruikt.'
    example_gloss: Mijn oma is aardig.
  fa.a1.unit04.lesson03.teach.amoo:
    title: Oom van vaderskant
    gloss: oom (broer van vader)
    note: عمو betekent specifiek de broer van je vader, het is geen algemeen woord voor 'oom'.
    example_gloss: Mijn oom woont in Teheran.
  fa.a1.unit04.lesson03.teach.amme:
    title: Tante van vaderskant
    gloss: tante (zus van vader)
    note: عمه betekent specifiek de zus van je vader.
    example_gloss: Mijn tante is lerares.
  fa.a1.unit04.lesson03.teach.dayi:
    title: Oom van moederskant
    gloss: oom (broer van moeder)
    note: دایی betekent specifiek de broer van je moeder. Het Perzisch maakt bij elke oom en tante onderscheid naar de kant van de familie, anders dan het Nederlands, dat gewoon 'oom' en 'tante' zegt.
    example_gloss: Mijn oom (van moederskant) is ingenieur.
  fa.a1.unit04.lesson03.teach.khale:
    title: Tante van moederskant
    gloss: tante (zus van moeder)
    note: خاله betekent specifiek de zus van je moeder.
    example_gloss: Mijn tante (van moederskant) woont in Isfahan.
  fa.a1.unit04.lesson03.teach.register_note:
    title: Vaderskant versus moederskant
    gloss: Oom en tante (van vaderskant) horen bij de kant van de vader; oom en tante (van moederskant) horen bij de kant van de moeder.
    note: 'Deze viervoudige verdeling (عمو/عمه tegenover دایی/خاله) heeft in het Nederlands geen eenwoordige tegenhanger: wij zeggen voor beide kanten gewoon ''oom'' en ''tante''.'
  fa.a1.unit04.lesson04.teach.chand_ta:
    title: Hoeveel
    gloss: hoeveel
    note: چند تا, informeel gebruikt voor het tellen van mensen of dingen.
    example_gloss: Hoeveel zussen hebben jullie?
  fa.a1.unit04.lesson04.teach.polite_question:
    title: Hoeveel broers en zussen heeft u? (beleefd)
    gloss: Hoeveel broers en zussen heb je?
    note: دارید is de beleefde vorm/meervoudsvorm van 'hebben', passend bij شما.
  fa.a1.unit04.lesson04.teach.spoken_question:
    title: Hoeveel broers en zussen heb je? (informeel)
    gloss: Hoeveel broers en zussen heb je?
    note: داری is de informele enkelvoudsvorm, die je gebruikt bij leeftijdsgenoten of iemand die jonger is.
  fa.a1.unit04.lesson04.teach.family_size_question:
    title: Met hoeveel personen is jullie gezin?
    gloss: Met hoeveel personen is jullie gezin?
    note: نفر is het telwoord voor personen; نفرن is de gesproken, samengetrokken vorm van 'نفر هستند' (zijn ... personen).
  fa.a1.unit04.lesson04.teach.answer_example:
    title: 'We zijn met z''n vieren: ik, mijn mama, mijn papa en mijn broer.'
    gloss: 'We zijn met z''n vieren: ik, mijn mama, mijn papa en mijn broer.'
    note: نفریم = 'نفر هستیم' (we zijn ... personen) samengetrokken, spreektaal.
  fa.a1.unit04.lesson05.teach.showhar:
    title: Echtgenoot
    gloss: echtgenoot
    note: شوهر, het standaardwoord voor echtgenoot.
    example_gloss: Mijn man is ingenieur.
  fa.a1.unit04.lesson05.teach.zan:
    title: Echtgenote
    gloss: echtgenote
    note: زن betekent ook algemeen 'vrouw'; uit de context blijkt wat bedoeld wordt.
    example_gloss: Mijn vrouw is lerares.
  fa.a1.unit04.lesson05.teach.motahel:
    title: Getrouwd
    gloss: getrouwd
    note: متأهل, een neutraal, veelgebruikt bijvoeglijk naamwoord voor de burgerlijke staat.
    example_gloss: Hij/zij is getrouwd.
  fa.a1.unit04.lesson05.teach.mojarad:
    title: Alleenstaand
    gloss: alleenstaand (ongehuwd)
    note: مجرد, het standaardwoord voor ongehuwd.
    example_gloss: Ik ben alleenstaand.
  fa.a1.unit04.lesson05.teach.i_am_single:
    title: Ik ben alleenstaand.
    gloss: Ik ben alleenstaand.
    note: مجردم = مجرد + م ('ik ben'), hetzelfde achtervoegsel voor de eerste persoon als in خوبم ('het gaat goed met me').
  fa.a1.unit04.lesson05.teach.i_am_married:
    title: Ik ben getrouwd.
    gloss: Ik ben getrouwd.
    note: متأهلم = متأهل + م ('ik ben'), hetzelfde patroon als مجردم.
  fa.a1.unit04.lesson05.teach.nave:
    title: Kleinkind
    gloss: kleinkind
    note: 'نوه staat voor zowel kleinzoon als kleindochter: het Perzisch hoeft hier het geslacht niet te noemen.'
    example_gloss: Hij/zij heeft één kleinkind.
  fa.a1.unit04.lesson05.teach.example:
    title: Mijn broer is getrouwd; hij heeft een zoon.
    gloss: Mijn broer is getrouwd; hij heeft een zoon.
    note: متأهله = 'متأهل است' (is getrouwd) samengetrokken, spreektaal; داره = 'دارد' (heeft) in spreektaal.
  fa.a1.unit04.lesson06.teach.in_photo:
    title: Is dit je familiefoto?
    gloss: Is dit je familiefoto?
    note: 'خانواده‌ته = ''خانواده‌ی تو است'' (is jouw gezin) samengetrokken: een heel gebruikelijk patroon in de spreektaal.'
  fa.a1.unit04.lesson06.teach.yes_mom_dad:
    title: Ja. Dit is mijn mama, en dit is mijn papa.
    gloss: Ja. Dit is mijn mama, en dit is mijn papa.
    note: '*آره* is het gesproken ''ja'' (tegenover het formele *بله*). *مامانمه* is *مامانم* (''mijn mama'') plus de gesproken uitgang voor ''is''.'
  fa.a1.unit04.lesson06.teach.who_is_he:
    title: Wie is deze man?
    gloss: Wie is deze man?
    note: کیه = 'کی است' (wie is) samengetrokken, spreektaal.
  fa.a1.unit04.lesson06.teach.brother_answer:
    title: Dat is mijn broer. Ik heb één broer en geen zus.
    gloss: Dat is mijn broer. Ik heb één broer en geen zus.
    note: داداش is het liefkozende, alledaagse woord voor broer, hier gebruikt in plaats van het neutralere برادر uit les 1.
  fa.a1.unit04.lesson06.teach.opposite_family:
    title: Mijn familie is juist andersom; ik heb twee zussen, geen broer.
    gloss: Mijn familie is juist andersom; ik heb twee zussen, geen broer.
    note: برعکسه = 'برعکس است' (is het tegenovergestelde), in de samengetrokken spreektaalvorm.
  fa.a1.unit04.lesson06.teach.closing:
    title: Dan is jouw familie ook druk!
    gloss: Dan is jouw familie ook druk!
    note: شلوغه = 'شلوغ است' (is druk/gezellig vol), samengetrokken. Een warme, veelgebruikte manier om een gezin met meerdere kinderen te beschrijven.
  fa.a1.unit04.lesson06.teach.formal_register_note:
    title: 'Formeel register: heeft / heeft niet / is'
    gloss: 'Spreektaal: heeft, heeft niet. Formeel geschreven: heeft, heeft niet; hij is mijn broer.'
    note: دارد/ندارد/است zijn de formele schrijftaalvormen van de gesproken داره/نداره die in deze dialoog voorkomen. In formeel schrijven wordt ook het vertrouwelijke داداش vervangen door het neutrale برادر.
