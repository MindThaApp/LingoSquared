course:
  title: Farsi in het Nederlands A1
  description: 'Farsi (Iraans Perzisch) voor beginners: leer de schrijfwijze lezen, alledaagse spreektaal begrijpen en op een beleefde manier praktische gesprekken voeren.'
units:
  fa.a1.unit02.introductions:
    title: Namen, herkomst en voorstellen
lessons:
  fa.a1.unit02.lesson01.script_ramp:
    title: Lees de letters die je bij het voorstellen gebruikt
  fa.a1.unit02.lesson02.names:
    title: Een naam vragen en zeggen
  fa.a1.unit02.lesson03.pronouns_and_boodan:
    title: Persoonlijke voornaamwoorden in het enkelvoud en het werkwoord zijn
  fa.a1.unit02.lesson04.countries_nationalities:
    title: Landen en nationaliteiten
  fa.a1.unit02.lesson05.origin:
    title: Vragen waar iemand vandaan komt
  fa.a1.unit02.lesson06.language_class_dialogue:
    title: Kennismaken bij een Farsi-les
teaching:
  fa.a1.unit02.lesson01.teach.noon_te:
    title: De letters ن en ت
    gloss: n en t
    note: ن staat voor n. ت staat voor t; beide verbinden zich aan beide kanten.
  fa.a1.unit02.lesson01.teach.sheen_che:
    title: De letters ش en چ
    gloss: sj en tsj
    note: ش staat voor sj en چ staat voor tsj.
  fa.a1.unit02.lesson01.teach.ye_he:
    title: De letters ی en ه
    gloss: j/lange i en h
    note: ی klinkt als j of als een lange ī. ه is h en verandert van vorm als hij verbonden is.
  fa.a1.unit02.lesson01.teach.ke_gaf:
    title: De letters ک en گ
    gloss: k en g
    note: ک staat voor k; gebruik bij het typen de Perzische ک, niet de gelijkende Arabische letter. گ heeft een extra streepje boven ک en staat voor g.
  fa.a1.unit02.lesson01.teach.jim_dal:
    title: De letters ج en د
    gloss: dzj en d
    note: ج staat voor dzj. د staat voor d en verbindt zich niet met de letter links ervan.
  fa.a1.unit02.lesson01.teach.re_fe:
    title: De letters ر en ف
    gloss: r en f
    note: ر staat voor r en verbindt zich niet met de volgende letter; ف staat voor f.
  fa.a1.unit02.lesson01.teach.vav_be:
    title: De letters و en ب
    gloss: v/o/oe en b
    note: و kan voor v of voor een klinker staan en verbindt zich niet met de volgende letter. ب staat voor b.
  fa.a1.unit02.lesson01.teach.khe_ze:
    title: De letters خ en ز
    gloss: kh en z
    note: خ is de klank die meestal als kh wordt geschreven; ز staat voor z.
  fa.a1.unit02.lesson02.teach.esm:
    title: Naam
    gloss: naam
    note: اسم wordt in het gewone Iraanse Perzisch uitgesproken als esm.
    example_gloss: Mijn naam is Sara.
  fa.a1.unit02.lesson02.teach.man:
    title: Ik
    gloss: ik
    note: من is het persoonlijk voornaamwoord voor de eerste persoon enkelvoud.
  fa.a1.unit02.lesson02.teach.sara:
    title: Sara
    gloss: Sara
    note: سارا is een veelvoorkomende Iraanse voornaam.
    example_gloss: Sara is mijn vriendin.
  fa.a1.unit02.lesson02.teach.formal_name:
    title: Formele of geschreven voorstelling
    gloss: Mijn naam is Sara.
    note: '*اسم من سارا است* is correct maar formeel; je ziet het vooral in geschreven taal.'
  fa.a1.unit02.lesson02.teach.spoken_name:
    title: Natuurlijke gesproken voorstelling
    gloss: Mijn naam is Sara.
    note: اسمم is een samentrekking van اسم من, en ساراست voegt سارا en است samen.
  fa.a1.unit02.lesson02.teach.polite_question:
    title: Beleefd naar een naam vragen
    gloss: Hoe heet je?
    note: اسم شما چیه؟ is gewoon neutraal-beleefd gesproken Iraans Farsi.
  fa.a1.unit02.lesson02.teach.informal_question:
    title: Informeel naar een naam vragen
    gloss: Hoe heet je?
    note: اسمت چیه؟ is enkelvoud en informeel; gebruik het alleen als de relatie dat toelaat.
  fa.a1.unit02.lesson03.teach.man:
    title: Ik
    gloss: ik
    note: من heeft geen grammaticaal geslacht.
  fa.a1.unit02.lesson03.teach.to:
    title: Jij, informeel enkelvoud
    gloss: jij
    note: تو is informeel enkelvoud; voor beleefd aanspreken gebruik je normaal شما.
  fa.a1.unit02.lesson03.teach.oo:
    title: Hij of zij
    gloss: hij / zij
    note: او is geslachtloos en kan naar zowel een man als een vrouw verwijzen.
  fa.a1.unit02.lesson03.teach.man_hastam:
    title: Ik ben
    gloss: ik ben
    note: هستم is de volledige vorm van de eerste persoon enkelvoud van بودن.
  fa.a1.unit02.lesson03.teach.to_hasti:
    title: Jij bent
    gloss: u bent; jullie zijn
    note: هستی hoort bij het informele enkelvoud تو.
  fa.a1.unit02.lesson03.teach.oo_hast:
    title: Hij of zij is
    gloss: hij/zij is; hij/zij is aanwezig
    note: هست is de volledige vorm voor de derde persoon enkelvoud en drukt vaak bestaan of nadruk uit.
  fa.a1.unit02.lesson03.teach.oo_ast:
    title: Formele zin over identiteit
    gloss: Hij of zij is Iraans.
    note: In een neutrale, formele geschreven zin over identiteit is است de gewone koppelwerkwoordsvorm voor de derde persoon.
  fa.a1.unit02.lesson03.teach.spoken_copula:
    title: Gesproken zin over identiteit
    gloss: Hij of zij is Iraans.
    note: ایرانیه is de natuurlijke gesproken samentrekking van ایرانی است.
  fa.a1.unit02.lesson04.teach.iran:
    title: Iran
    gloss: Iran
    note: ایران is de naam van een land.
    example_gloss: Ik kom uit Iran.
  fa.a1.unit02.lesson04.teach.iranian:
    title: Iraans
    gloss: Iraans
    note: ایرانی kan nationaliteit of herkomst aanduiden.
    example_gloss: Ik ben Iraans.
  fa.a1.unit02.lesson04.teach.england:
    title: Engeland
    gloss: Engeland
    note: '*انگلیس* betekent meestal Engeland; in de omgangstaal gebruiken Iraniërs het vaak voor het hele Verenigd Koninkrijk.'
    example_gloss: Ik kom uit Engeland.
  fa.a1.unit02.lesson04.teach.english:
    title: Engels
    gloss: Engels
    note: انگلیسی kan nationaliteit, taal of iets met Engeland aanduiden; de context maakt de betekenis duidelijk.
    example_gloss: Ik ben Engels.
  fa.a1.unit02.lesson04.teach.france:
    title: Frankrijk
    gloss: Frankrijk
    note: فرانسه is de landnaam Frankrijk.
    example_gloss: Ik kom uit Frankrijk.
  fa.a1.unit02.lesson04.teach.french:
    title: Frans
    gloss: Frans
    note: فرانسوی kan nationaliteit of iets met Frankrijk aanduiden.
    example_gloss: Ik ben Frans.
  fa.a1.unit02.lesson04.teach.country:
    title: Land
    gloss: land
    note: کشور is het algemene woord voor land.
    example_gloss: Iran is een land.
  fa.a1.unit02.lesson04.teach.nationality:
    title: Nationaliteit
    gloss: nationaliteit
    note: ملیت is het formele zelfstandig naamwoord voor nationaliteit.
    example_gloss: Wat is jouw nationaliteit?
  fa.a1.unit02.lesson05.teach.ahl:
    title: Afkomstig uit
    gloss: afkomstig uit / oorspronkelijk van
    note: اهل verbindt iemand met een plaats van herkomst; het betekent niet simpelweg dat je op dit moment ergens woont.
    example_gloss: Hij/zij komt uit Engeland.
  fa.a1.unit02.lesson05.teach.koja:
    title: Waar
    gloss: waar
    note: کجا vraagt naar een plaats.
    example_gloss: Waar kom je vandaan?
  fa.a1.unit02.lesson05.teach.formal_question:
    title: Formele standaardvraag
    gloss: Waar komt u vandaan?
    note: اهل کجا هستید؟ is beleefd standaard Perzisch en past bij formele spraak of zorgvuldig lezen.
  fa.a1.unit02.lesson05.teach.polite_spoken_question:
    title: Neutraal-beleefde gesproken vraag
    gloss: Waar komt u vandaan?
    note: اهل کجا هستین؟ is de gewone beleefde gesproken vorm in het Iraanse Farsi.
  fa.a1.unit02.lesson05.teach.informal_question:
    title: Informele vraag
    gloss: Waar komt u vandaan?
    note: اهل کجایی؟ is informeel enkelvoud.
  fa.a1.unit02.lesson05.teach.origin_answer:
    title: Zeg waar je vandaan komt
    gloss: Ik kom uit Iran.
    note: من اهل ایران هستم geeft je herkomst aan, niet je huidige woonplaats.
  fa.a1.unit02.lesson05.teach.nationality_answer:
    title: Kort antwoord over nationaliteit
    gloss: Ik ben Iraans.
    note: '*ایرانی‌ام* voegt de uitgang *ـام* (ik ben) toe aan *ایرانی*, geschreven met een klein halve spatie voor de uitgang.'
  fa.a1.unit02.lesson06.teach.arrival:
    title: De locatie controleren
    gloss: Sara vraagt of dit de Farsi-les is.
    note: ببخشید trekt beleefd de aandacht voor je een praktische vraag stelt.
  fa.a1.unit02.lesson06.teach.yes:
    title: Ja
    gloss: ja
    note: بله is het neutraal-beleefde woord voor ja.
    example_gloss: Ja, natuurlijk.
  fa.a1.unit02.lesson06.teach.meet_mina:
    title: Mina stelt zich voor
    gloss: Mina bevestigt de locatie, stelt zich voor en vraagt naar de naam van Sara.
    note: De gesproken beleefde vraag past bij twee volwassenen die elkaar bij een les ontmoeten.
  fa.a1.unit02.lesson06.teach.sara_name:
    title: Sara zegt haar naam
    gloss: Mijn naam is Sara.
    note: Sara gebruikt het compacte gesproken patroon dat eerder is behandeld.
  fa.a1.unit02.lesson06.teach.ask_origin:
    title: Mina vraagt naar herkomst
    gloss: Waar komt u vandaan?
    note: هستین houdt het gesprek beleefd maar informeel genoeg voor gewone spraak.
  fa.a1.unit02.lesson06.teach.exchange_origins_sara:
    title: Herkomst uitwisselen
    gloss: Sara zegt dat ze uit Engeland komt en vraagt of Mina uit Iran komt.
    note: De twee sprekers blijven beleefde vormen gebruiken omdat ze elkaar net hebben ontmoet.
  fa.a1.unit02.lesson06.teach.exchange_origins_mina:
    title: Herkomst uitwisselen, antwoord
    gloss: Mina bevestigt dat ze Iraans is.
    note: '*ایرانی‌ام* is de korte vorm van *ایرانی هستم* (ik ben Iraans).'
  fa.a1.unit02.lesson06.teach.pleased:
    title: De kennismaking beantwoorden
    gloss: Sara zegt dat ze blij is Mina te ontmoeten.
    note: از آشنایی با شما خوشوقتم is een natuurlijke afsluiting van hun gesprek.
  fa.a1.unit02.lesson06.teach.pleased_and_enter:
    title: De groet beantwoorden en de les binnengaan
    gloss: Mina zegt dat ze ook blij is en nodigt Sara uit om binnen te komen.
    note: من هم همین‌طور beantwoordt Sara's beleefde groet, waarna بفرمایید داخل het verhaal in de les verder helpt.
