teaching:
  fa.a2.unit22.lesson01.teach.people_time:
    title: Mensen en tijd
    gloss: ik, jij, Sara, Nima, vandaag, ochtend, laat
    note: '*امروز صبح* betekent "vanochtend". In het Perzisch laat je *من* vaak weg, omdat de werkwoordsuitgang al "ik" aangeeft.'
    example_gloss:
    - Ik werd vanochtend laat wakker.
    - Sara heeft Nima vandaag gebeld.
  fa.a2.unit22.lesson01.teach.morning_nouns:
    title: Woorden voor de ochtend en het woon-werkverkeer
    gloss: thuis, douche, kleren, ontbijt, sleutel, deur, auto, bus
    note: '*صبحونه* is de gewone spreektaalvorm van "ontbijt"; in verzorgd schrift gebruik je *صبحانه*.'
    example_gloss:
    - Ik heb thuis gedoucht.
    - Ik heb ontbeten en me aangekleed.
    - Mijn sleutel lag in de auto.
  fa.a2.unit22.lesson01.teach.actions:
    title: Vier ochtendhandelingen
    gloss: ik werd wakker, ik douchte, ik kleedde me aan, ik ontbeet
    note: Elke uitdrukking eindigt op een hulpwerkwoord in de verleden tijd. Leer de hele uitdrukking als één handeling.
    example_gloss:
    - Ik werd vanochtend wakker.
    - Daarna heb ik gedoucht.
    - Ik heb me aangekleed en ontbeten.
  fa.a2.unit22.lesson01.teach.compound_shape:
    title: Samengestelde werkwoorden in de verleden tijd
    gloss: ik werd wakker, ik douchte, ik kleedde me aan
    note: 'Veel Perzische handelingen bestaan uit twee delen: een zelfstandig of bijvoeglijk naamwoord plus een hulpwerkwoord. Het tweede deel draagt de verleden tijd: *بیدار شدم*, *دوش گرفتم*, *لباس پوشیدم*.'
  fa.a2.unit22.lesson02.teach.more_actions:
    title: Deuren, auto's, telefoontjes en brieven
    gloss: ik deed de deur open, ik deed de deur dicht, ik startte de auto, ik belde, ik schreef een brief
    note: '*رو* markeert in spreektaal een bepaald lijdend voorwerp: *در رو* is "de deur" en *ماشین رو* is "de auto".'
    example_gloss:
    - Ik deed de deur open en daarna weer dicht.
    - Ik heb de auto gestart.
    - Ik belde Sara en schreef een brief.
  fa.a2.unit22.lesson02.teach.small_words:
    title: Handige kleine woorden
    gloss: naar, een, en, maar, wat, ik kwam aan
    note: '*یه* is de gewone spreektaalvorm van "een". *رسیدم* sluit een verhaal over het woon-werkverkeer af: "ik kwam aan".'
    example_gloss:
    - Ik heb Sara gebeld.
    - Ik schreef een brief, maar kwam te laat aan.
  fa.a2.unit22.lesson02.teach.sequence:
    title: Woorden voor de volgorde
    gloss: eerst, dan, daarna, uiteindelijk, tegen die tijd
    note: 'Gebruik deze woorden om de volgorde duidelijk te maken. *تا اون موقع* betekent "tegen die tijd". Daarbij staat de eerdere gebeurtenis in het voltooid verleden tijd (voltooid deelwoord + بود): *اتوبوس رفته بود* = de bus was al weg. Deze vorm oefen je in een latere unit.'
    example_gloss:
    - Eerst deed ik de deur open.
    - Daarna startte ik de auto.
    - Tegen die tijd was het laat; uiteindelijk kwam ik aan.
  fa.a2.unit22.lesson02.teach.light_verbs:
    title: Het hulpwerkwoord draagt de tijd
    gloss: opendoen, aanzetten, bellen, wakker worden
    note: 'Het eerste deel noemt de handeling; het tweede deel verandert mee met tijd en persoon: *باز کردم*, *روشن کردم*, *زنگ زدم*, *بیدار شدم*.'
  fa.a2.unit22.lesson02.teach.ro_rule:
    title: Bepaald رو, onbepaald یه
    gloss: Ik deed de deur open; ik schreef een brief
    note: 'Gebruik het gesproken *رو* na een bepaald lijdend voorwerp: *در رو باز کردم*. Een onbepaald voorwerp met *یه* heeft normaal geen *رو*: *یه نامه نوشتم*.'
  fa.a2.unit22.lesson03.teach.negative_forms:
    title: Ontkennende samengestelde werkwoorden
    gloss: ik werkte niet, ik belde niet, ik ontbeet niet, ik deed de deur niet open
    note: 'Zet *نـ* op het vervoegde hulpwerkwoord: *کار نکردم*, *زنگ نزدم*, *صبحونه نخوردم*. Het zelfstandig naamwoord blijft ongewijzigd.'
  fa.a2.unit22.lesson03.teach.negative_place:
    title: Ontken het hulpwerkwoord, niet het zelfstandig naamwoord
    gloss: نـ hoort bij het hulpwerkwoord
    note: Zeg *کار نکردم* en *زنگ نزدم*. Als je de ontkenning bij het zelfstandig naamwoord zet, krijg je een foute vorm.
  fa.a2.unit22.lesson03.teach.definite_indefinite:
    title: رو aanwezig of afwezig
    gloss: Ik deed de deur dicht; ik schreef een brief
    note: '*در* is een bekende, bepaalde deur, dus die krijgt *رو*. *یه نامه* is onbepaald, dus die krijgt het niet.'
  fa.a2.unit22.lesson04.teach.problem_actions:
    title: Als de ochtend misgaat
    gloss: ik vond het, ik vond het niet, ik vergat het, ik miste de bus
    note: '*از دستم رفت* zegt letterlijk dat iets "uit mijn hand ging"; bij een bus betekent het "ik heb hem gemist".'
    example_gloss:
    - Ik heb mijn sleutel gevonden.
    - Ik heb mijn sleutel niet gevonden en heb de bus gemist.
    - Ik was de brief vergeten.
  fa.a2.unit22.lesson04.teach.question:
    title: Wat gebeurde er daarna?
    gloss: Wat is er vanochtend gebeurd? Wat gebeurde er daarna?
    note: Deze vragen vragen om een verhaal in de juiste volgorde, dus antwoord met volgordewoorden en verleden tijd.
  fa.a2.unit22.lesson05.teach.reading:
    title: Een ochtend die misging
    gloss: Vanochtend werd ik laat wakker. Eerst heb ik gedoucht en me aangekleed. Ik heb niet ontbeten. Daarna deed ik de deur dicht, maar ik kon mijn sleutel niet vinden. Tegen die tijd was de bus al weg. Uiteindelijk belde ik Sara en kwam ik met de auto aan.
    note: Lees de tekst eerst één keer voor de handelingen in volgorde, en lees hem daarna nog eens voor de twee stappen die niet volgens plan gingen.
  fa.a2.unit22.lesson06.teach.turn01:
    title: Sara vraagt wat er gebeurd is
    gloss: 'Sara vraagt aan Nima: Wat is er vanochtend gebeurd?'
    note: De openingsvraag vraagt om het hele verloop.
  fa.a2.unit22.lesson06.teach.turn02:
    title: Nima begint zijn verhaal
    gloss: Nima werd laat wakker
    showered and dressed: null
    but did not eat breakfast.: null
    note: De ontkende stap staat in contrast met de voltooide stappen.
  fa.a2.unit22.lesson06.teach.turn03:
    title: Sara vraagt naar de volgende stap
    gloss: 'Sara vraagt: Wat gebeurde er daarna?'
    note: '*بعدش* houdt het verhaal in beweging.'
  fa.a2.unit22.lesson06.teach.turn04:
    title: Het probleem onderweg
    gloss: Nima kon zijn sleutel niet vinden en tegen die tijd was de bus al weg.
    note: Deze twee feiten verklaren waar de ochtend misging.
  fa.a2.unit22.lesson06.teach.turn05:
    title: Sara vraagt naar het einde
    gloss: 'Sara vraagt: Wat heb je uiteindelijk gedaan?'
    note: '*آخرش* geeft de laatste stap aan.'
  fa.a2.unit22.lesson06.teach.turn06:
    title: Nima maakt zijn verhaal af
    gloss: Nima belde Sara
    started the car: null
    and finally arrived.: null
    note: De laatste twee voltooide handelingen lossen het probleem onderweg op.
