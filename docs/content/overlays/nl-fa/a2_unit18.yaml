course:
  title: Perzisch A2
  description: 'Iraans Farsi voor net voorbij beginners: een defecte aankoop terugbrengen. Je leert uitleggen wat er mis is, het retourbeleid van een winkel lezen en kiezen tussen omruilen en terugbetaling.'
units:
  fa.a2.unit18.shopping_complaint:
    title: Een klacht in de winkel
lessons:
  fa.a2.unit18.lesson01.shopping_complaint_vocabulary:
    title: 'Iets terugbrengen: woorden'
  fa.a2.unit18.lesson02.explaining_the_problem:
    title: Het probleem uitleggen
  fa.a2.unit18.lesson03.reading_a_return_policy:
    title: Een retourbeleid lezen
  fa.a2.unit18.lesson04.shop_return_counter_dialogue:
    title: Aan de retourbalie
teaching:
  fa.a2.unit18.lesson01.teach.broken_word:
    title: Kapot
    gloss: kapot
    note: '*خراب* is het algemene woord voor kapot of defect; *خرابه* is de gesproken vorm (*خراب* + *است*).'
    example_gloss: Deze koptelefoon is kapot.
  fa.a2.unit18.lesson01.teach.receipt_word:
    title: Bonnetje
    gloss: bonnetje
    note: '*رسید* is het woord voor een aankoopbon of kassabon.'
    example_gloss: Ik ben mijn kassabon kwijt.
  fa.a2.unit18.lesson01.teach.return_item_note:
    title: Iets terugbrengen (samengesteld werkwoord)
    gloss: terugbrengen (een artikel)
    note: '*پس دادن* betekent letterlijk ''terug geven''. Het is weer een samengesteld werkwoord, net als *باز کردن* uit de eerdere bankunit.'
  fa.a2.unit18.lesson01.teach.exchange_word:
    title: Wisselen
    gloss: wisselen
    note: '*تعویض* is het woord voor een omruil; *تعویض کردن* (omruilen) is de vorm met کردن.'
    example_gloss: Ik wil dit artikel omruilen.
  fa.a2.unit18.lesson01.teach.refund_word:
    title: Terugbetaling
    gloss: terugbetaling
    note: '*بازپرداخت* is het gangbare woord voor een terugbetaling van geld.'
    example_gloss: De terugbetaling duurt twee dagen.
  fa.a2.unit18.lesson01.teach.deadline_word:
    title: Termijn
    gloss: termijn
    note: '*مهلت* is het algemene woord voor een uiterste termijn of toegestane periode.'
    example_gloss: De retourtermijn is zeven dagen.
  fa.a2.unit18.lesson01.teach.recap_headphones:
    title: Ik heb deze koptelefoon gekocht
    gloss: Ik heb deze koptelefoon gekocht
    note: Herhalingszin die *هدفون* (koptelefoon) introduceert, het product waaromheen het scenario van deze unit is gebouwd.
  fa.a2.unit18.lesson02.teach.no_sound_word:
    title: Heeft geen geluid
    gloss: heeft geen geluid
    note: '*صدا نداره* (letterlijk ''geluid heeft-niet'') beschrijft een apparaat zonder geluid.'
    example_gloss: Deze koptelefoon geeft geen geluid.
  fa.a2.unit18.lesson02.teach.i_want_to_exchange_or_refund:
    title: Ik wil dit omruilen of mijn geld terug
    gloss: Ik wil deze koptelefoon omruilen of mijn geld terugkrijgen.
    note: '*یا* (of) geeft de winkel de keuze tussen de twee oplossingen die deze zin noemt.'
  fa.a2.unit18.lesson02.teach.full_complaint_sentence:
    title: Het probleem en je verzoek samen noemen
    gloss: Ik heb deze koptelefoon gekocht, maar hij geeft geen geluid. Ik wil hem omruilen of mijn geld terugkrijgen.
    note: 'Het volledige klachtpatroon van deze les: eerst het probleem noemen, dan het verzoek.'
  fa.a2.unit18.lesson03.teach.purchase_date_word:
    title: Aankoopdatum
    gloss: aankoopdatum
    note: '*تاریخ خرید* is de gangbare uitdrukking voor de datum waarop iets gekocht is.'
    example_gloss: De aankoopdatum staat op de kassabon.
  fa.a2.unit18.lesson03.teach.policy_notice_text:
    title: Het retourbeleid van een winkel
    gloss: 'Retourtermijn voor artikelen: zeven dagen na de aankoopdatum, met kassabon.'
    note: Een korte officiële mededeling van een winkel, het schriftelijke register dat deze les behandelt.
  fa.a2.unit18.lesson04.teach.please_word:
    title: Alsjeblieft
    gloss: alsjeblieft
    note: '*لطفاً* is een beleefd woord dat aan het einde van een verzoek staat.'
    example_gloss: Ruil het om, alstublieft.
  fa.a2.unit18.lesson04.teach.turn01:
    title: نیما noemt het probleem
    gloss: نیما zegt beleefd dat hij deze koptelefoon heeft gekocht, maar dat hij geen geluid geeft.
    note: Combineert de herhalingszin uit les 1 met *صدا نداره* uit les 2.
  fa.a2.unit18.lesson04.teach.turn02:
    title: فروشنده vraagt om de kassabon en de datum
    gloss: De medewerker vraagt of hij de kassabon heeft en op welke dag hij hem heeft gekocht.
    note: '*خریدینش* is de gesproken, beleefde vorm van ''u heeft hem gekocht'' (geschreven *خریدید*, plus het voornaamwoord *-ش* voor ''hem'').'
  fa.a2.unit18.lesson04.teach.turn03:
    title: نیما bevestigt en noemt de datum
    gloss: 'نیما zegt ja, alstublieft: hij heeft hem drie dagen geleden gekocht.'
    note: '*بفرمایید* betekent hier ''alstublieft'' terwijl je iets overhandigt.'
  fa.a2.unit18.lesson04.teach.turn04:
    title: فروشنده bevestigt dat hij binnen de termijn valt en biedt een keuze
    gloss: De medewerker zegt dat het geen probleem is, want hij zit binnen de termijn van zeven dagen. Wil hij omruilen of zijn geld terug?
    note: '*تو مهلت هفت روزه هستید* (u zit binnen de termijn van zeven dagen) bevestigt dat hij ervoor in aanmerking komt.'
  fa.a2.unit18.lesson04.teach.turn05:
    title: نیما vraagt om omruiling
    gloss: نیما vraagt beleefd om omruiling.
    note: '*کنید* is de beleefde gebiedende wijs van *کردن* (doen).'
  fa.a2.unit18.lesson04.teach.turn06:
    title: فروشنده regelt de omruiling
    gloss: De medewerker zegt oké, hij krijgt nu meteen een nieuwe koptelefoon.
    note: '*بهتون می‌دم* (ik geef u) rondt de omruiling af.'
