teaching:
  fa.a2.unit50.changing_arrangement.lesson01.teach.arrangement_words:
    title: Een afspraak en het wijzigen ervan
    gloss: afspraak, onze afspraak, veranderen, morgen
    note: '*قرار* is een afspraak om elkaar te ontmoeten. *قرارمون* is “onze afspraak” (*ـمون* betekent “onze”). *عوض کردن* betekent “veranderen” en wordt gebruikt met *رو*.'
    example_gloss:
    - Ik heb morgen een afspraak met Nima.
    - We veranderen onze afspraak.
    - We hebben vandaag onze afspraak veranderd.
  fa.a2.unit50.changing_arrangement.lesson01.teach.sorry_words:
    title: Sorry, helaas, ik kan niet
    gloss: pardon / sorry, helaas, ik kan niet, wij kunnen niet
    note: '*ببخشید* en *متأسفانه* maken slecht nieuws zachter. *نمی‌تونم* is “ik kan niet” en *نمی‌تونیم* is “wij kunnen niet”.'
    example_gloss:
    - Sorry, ik kan morgen niet komen.
    - Helaas moet ik morgen werken.
    - Helaas kan Nima morgen niet komen.
  fa.a2.unit50.changing_arrangement.lesson01.teach.delay_words:
    title: Vertraging en niet beschikbaar zijn
    gloss: vertraging, ik zit vast, dringend
    note: '*تأخیر دارم* zegt dat je vertraging hebt. *گرفتارم* betekent dat je het druk hebt of vastzit, en *فوری* beschrijft iets dringends.'
    example_gloss:
    - Ik heb vertraging.
    - Ik zit vast; ik kan niet komen.
    - Ik heb dringend werk.
  fa.a2.unit50.changing_arrangement.lesson01.teach.polite_change:
    title: Een beleefd verzoek om te wijzigen
    gloss: Sorry, kunnen we onze afspraak veranderen?
    note: '*می‌شه … ؟* vraagt beleefd of iets mogelijk is. Het werkwoord eindigt op *ـیم* (“wij”), omdat het verzoek met “wij” is geformuleerd.'
  fa.a2.unit50.changing_arrangement.lesson01.teach.ask_to_change:
    title: 'Twee manieren om te vragen: می‌شه en می‌تونیم'
    gloss: Is het mogelijk om onze afspraak te veranderen? Kunnen we onze afspraak veranderen?
    note: Beide vragen zijn beleefd. *می‌شه* is de gebruikelijke gesproken vorm; *می‌تونیم* klinkt iets directer. Na beide staat het werkwoord in de vorm *کنیم*, niet *می‌کنیم*.
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_words:
    title: Een reden geven
    gloss: omdat, moeten, werk, ik ben ziek
    note: '*چون* leidt de reden in en kan vooraan of later in de zin staan. *باید کار کنم* is “ik moet werken”.'
    example_gloss:
    - Ik kan niet komen omdat ik ziek ben.
    - Omdat ik moet werken, kom ik te laat.
    - Omdat ik werk heb, kan ik niet.
  fa.a2.unit50.changing_arrangement.lesson02.teach.so_phrase:
    title: 'Eerst de reden, dan het gevolg: برای همین'
    gloss: Ik ben ziek, dus ik kan niet komen.
    note: '*برای همین* betekent “daarom”. Gebruik het na de reden in plaats van *چون*; gebruik niet allebei in één zin.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.new_time:
    title: Dagen en uren voor een nieuwe tijd
    gloss: donderdag, vrijdag, vier uur, zes uur
    note: Noem eerst de dag en dan *ساعت* plus het getal.
    example_gloss:
    - Ik heb vrijdag om vier uur tijd.
    - Ik kan donderdag om zes uur komen.
    - Ik moet morgen om zes uur werken.
  fa.a2.unit50.changing_arrangement.lesson02.teach.is_it_good:
    title: Een tijdstip voorstellen
    gloss: Past vrijdag om vier uur jou goed? Kun je komen?
    note: '*برات خوبه؟* vraagt of een tijd iemand schikt die je goed kent. Tegen iemand die je met *شما* aanspreekt, zeg je *براتون خوبه؟*.'
  fa.a2.unit50.changing_arrangement.lesson02.teach.reason_then_time:
    title: Een afspraak verzetten in drie stappen
    gloss: Ik kan morgen niet komen omdat ik moet werken. Schikt vrijdag om vier uur je?
    note: Zeg eerst dat je niet kunt komen, geef dan de reden met *چون* en stel dan een nieuwe dag en tijd voor. Met een reden klinkt je verzoek beleefd.
  fa.a2.unit50.changing_arrangement.lesson03.teach.finish_words:
    title: Klaar zijn en bellen
    gloss: het is afgelopen, het is klaar / is afgelopen, ik bel je, bel me
    note: '*تموم شد* is verleden tijd (“is afgelopen”); *تموم بشه* is de vorm die na *وقتی* wordt gebruikt als je over de toekomst praat.'
    example_gloss:
    - Mijn werk was klaar.
    - Mijn werk is om zes uur klaar.
    - Ik bel je morgen.
    - Bel me alsjeblieft.
  fa.a2.unit50.changing_arrangement.lesson03.teach.confirm_or_postpone:
    title: Bevestigen of uitstellen
    gloss: vast / bevestigd, achter / later, laten we zetten
    note: '*قطعی* zegt dat een afspraak vaststaat. *عقب بندازیم* is de natuurlijke gesproken manier om “laten we het uitstellen” te zeggen.'
    example_gloss:
    - Onze afspraak stond vast.
    - Laten we onze afspraak uitstellen.
  fa.a2.unit50.changing_arrangement.lesson03.teach.when_clause:
    title: وقتی met de toekomst en het verleden
    gloss: Als mijn werk klaar is, bel ik je. Toen mijn werk klaar was, belde ik je.
    note: Voor de toekomst staat de bijzin na *وقتی* in de *ب*-vorm (*تموم بشه*) en is het hoofdwerkwoord gewoon tegenwoordige tijd (*زنگ می‌زنم*). Voor het verleden staan beide werkwoorden in de verleden tijd.
  fa.a2.unit50.changing_arrangement.lesson03.teach.before_after:
    title: قبل از اینکه en بعد از اینکه
    gloss: Voordat ik vertrek, bel ik je. Nadat ik ben aangekomen, bel ik je.
    note: 'Na *قبل از اینکه* (“voordat”) en *بعد از اینکه* (“nadat”) staat een werkwoord in de *ب*-vorm als het plan in de toekomst ligt: *برم*, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson03.teach.time_phrases:
    title: Hetzelfde patroon in het verleden
    gloss: Toen ik aankwam, belde ik je. Nadat ik was aangekomen, belde ik je.
    note: 'In het verleden staat in de bijzin een gewoon verleden werkwoord: *رسیدم*. Vergelijk dat met de toekomst, *برسم*.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_words:
    title: Als, geschikt, wat dacht je van, kapper, fiets
    gloss: als, is niet geschikt, hoe zit het met?, kapper, fiets
    note: '*چطوره؟* stelt een alternatief voor: *دوشنبه چطوره؟* betekent “Wat dacht je van maandag?”'
    example_gloss:
    - Wat dacht je van maandag?
    - Schikt zaterdag je niet?
    - Ik heb donderdag een afspraak bij de kapper.
    - Ik wil een fiets.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_clause:
    title: اگه voor een mogelijke situatie
    gloss: Als je tijd hebt, kunnen we zaterdag gaan. Als het regent, veranderen we onze afspraak.
    note: Na *اگه* gebruik je de *ب*-vorm of *داشته باشی*; de hoofdzin staat in de gewone tegenwoordige tijd. Zet het deel met *اگه* eerst en zet er een komma achter.
  fa.a2.unit50.changing_arrangement.lesson04.teach.if_cant:
    title: Plan B met اگه
    gloss: Als je niet kunt komen, bel me. Als zaterdag je niet schikt, wat dacht je van maandag?
    note: '*اگه … نمی‌تونی* geeft de ander een uitweg, en *چطوره؟* biedt een nieuwe dag aan.'
  fa.a2.unit50.changing_arrangement.lesson04.teach.polite_please:
    title: Beleefde verzoeken aan een bedrijf
    gloss: Geef me alstublieft een andere afspraak. Kan ik mijn afspraak veranderen?
    note: Gebruik *لطفا* en het *شما*-werkwoord (*بدید*) bij een kapper, winkel of verhuurder. *می‌شه … ؟* werkt zowel met *شما* als met *تو*.
  fa.a2.unit50.changing_arrangement.lesson05.teach.reading:
    title: Een briefje om een afspraak te verzetten
    gloss: Sara, hoi! Helaas kan ik morgen niet komen, omdat ik moet werken. Kunnen we onze afspraak veranderen? Schikt vrijdag om vier uur je? Als je vrijdag niet kunt, kan ik zaterdag om tien uur. Als mijn werk klaar is, bel ik je.
    note: Lees één keer voor de reden en daarna nog een keer voor de twee voorgestelde tijden.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn01:
    title: Sara herinnert Nima eraan
    gloss: Nima, we hebben morgen om tien uur onze afspraak.
    note: Sara noemt de afspraak.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn02:
    title: Nima vraagt om te wijzigen
    gloss: Sorry Sara, helaas kan ik morgen niet komen, omdat ik moet werken. Kunnen we onze afspraak veranderen?
    note: Nima verontschuldigt zich, geeft de reden en vraagt beleefd.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn03:
    title: Sara stemt in en stelt vrijdag voor
    gloss: Ja, geen probleem. Schikt vrijdag om tien uur je?
    note: Sara gaat akkoord en stelt een nieuwe tijd voor.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn04:
    title: Nima slaat af en stelt zaterdag voor
    gloss: Vrijdag kan ik niet, want ik heb een afspraak bij de dokter. Wat dacht je van zaterdag?
    note: Nima geeft een reden en een alternatief.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn05:
    title: Sara stemt in met zaterdag
    gloss: Zaterdag om tien uur is prima. Ik regel de fietsen voor zaterdag.
    note: De fietsen verschuiven ook naar de nieuwe dag.
  fa.a2.unit50.changing_arrangement.lesson06.teach.turn06:
    title: Nima bedankt Sara
    gloss: Super, bedankt! Als mijn werk klaar is, bel ik je.
    note: Nima sluit af met een tijdsbijzin.
