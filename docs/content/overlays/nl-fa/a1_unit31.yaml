    note: '*تولد* is het standaardwoord voor ''verjaardag''.'
    example_gloss: Vandaag ben ik jarig.
  fa.a1.unit31.lesson01.teach.mehmooni_word:
    title: Feestje
    gloss: feestje
    note: '*مهمونی* is het gewone gesproken woord voor ''feestje'' of ''bijeenkomst''; de geschreven vorm is *مهمانی*.'
    example_gloss: Het feestje is vandaag.
  fa.a1.unit31.lesson01.teach.keik_word:
    title: Taart
    gloss: taart
    note: '*کیک* is het standaardwoord voor ''taart'' of ''cake''.'
    example_gloss: Deze taart is heerlijk.
  fa.a1.unit31.lesson01.teach.hedye_word:
    title: Cadeau
    gloss: cadeau
    note: '*هدیه* betekent ''cadeau'' of ''geschenk''.'
    example_gloss: Ik vind het cadeau leuk.
  fa.a1.unit31.lesson01.teach.review_words:
    title: Vandaag / jaar / ik heb / en
    gloss: vandaag / jaar / ik heb / en
    note: '*امروز*, *سال*, *دارم* en *و* ken je al. Ze komen hier terug om over feesten te praten.'
    target_text: امروز (vandaag) / سال (jaar) / دارم (ik heb) / و (en)
  fa.a1.unit31.lesson01.teach.tavallodam_pattern:
    title: Verjaardag + mijn + is = het is mijn verjaardag
    gloss: verjaardag + mijn + is = het is mijn verjaardag
    note: '*تولد* + het bezittelijke achtervoegsel *-م* (''mijn'') + het informele *-ه* (''is'') geeft *تولدمه*: ''het is mijn verjaardag''.'
    target_text: تولد (verjaardag) + م + ه = تولدمه (ik ben jarig)
  fa.a1.unit31.lesson01.teach.combined_sentence:
    title: Vandaag ben ik jarig en ik geef een feestje
    gloss: Vandaag ben ik jarig en ik geef een feestje
    note: '*امروز تولدمه و مهمونی دارم* is opgebouwd uit *امروز* + *تولدمه* + *و* + *مهمونی* + *دارم*.'
  fa.a1.unit31.lesson02.teach.key_word:
    title: Wanneer
    gloss: wanneer
    note: '*کِی* betekent ''wanneer''. Let op het kasre-teken dat het onderscheidt van *کی* (''wie'').'
    example_gloss: Wanneer is het feestje?
  fa.a1.unit31.lesson02.teach.question_when_birthday:
    title: Wanneer ben je jarig?
    gloss: Wanneer ben je jarig?
    note: '*تولدت کِیه؟* bestaat uit *تولد* + het informele bezittelijke achtervoegsel *-ت* (''jouw'', zoals in *چند سالته؟*) + *کِیه* (*کِی* + het informele *-ه*, ''is'').'
  fa.a1.unit31.lesson02.teach.review_dahom_ordibehesht:
    title: 10e / Ordibehesht
    gloss: 10e / Ordibehesht (2e Iraanse maand)
    note: '*دهم* en *اردیبهشت* komen hier terug om een echte datum te geven.'
    target_text: دهم (10e) / اردیبهشت (Ordibehesht, 2e Iraanse maand)
  fa.a1.unit31.lesson02.teach.answer_birthday_date:
    title: Ik ben jarig op 10 Ordibehesht
