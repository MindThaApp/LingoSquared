    note: '*تولدم دهم اردیبهشته* voegt het informele *-ه* (''is'') toe aan de maandnaam, net als in andere datums die je al hebt gezien.'
  fa.a1.unit31.lesson03.teach.review_davat_hatman_miam:
    title: Uitnodiging / zeker / ik kom
    gloss: uitnodiging / zeker / ik kom
    note: '*دعوت*, *حتماً* en *میام* komen hier terug om over feestjes te praten.'
    target_text: دعوت (uitnodiging) / حتماً (zeker) / میام (ik kom)
  fa.a1.unit31.lesson03.teach.miai_pattern:
    title: Ik kom -> jij komt (informeel)
    gloss: ik kom -> jij komt (informeel)
    note: '*میای* is de informele ''jij''-vorm van *میام* (''ik kom''), zoals *می‌خونی* past bij *می‌خونم*.'
    target_text: میام (ik kom) -> میای (jij komt, informeel)
  fa.a1.unit31.lesson03.teach.review_be:
    title: Naar
    gloss: naar
    note: '*به* (''naar'') komt hier terug voor ''naar het feestje''.'
    target_text: به (naar)
