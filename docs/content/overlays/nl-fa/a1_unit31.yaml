    title: Ik krijg -> hij/zij krijgt
    gloss: ik koop/haal -> hij/zij koopt/haalt
    note: '*می‌گیره* is de informele vorm voor hij/zij van *می‌گیرم*, net zoals *می‌خونه* afgeleid is van *می‌خونم*.'
    target_text: می‌گیرم (ik koop/krijg) -> می‌گیره (hij/zij koopt/krijgt)
  fa.a1.unit31.lesson05.teach.review_barash:
    title: Voor jou -> voor hem/haar
    gloss: voor jou -> voor hem/haar
    note: '*براش* (''voor hem/haar'') is de vorm voor de derde persoon van *برات* (''voor jou'').'
    target_text: برات (voor jou) -> براش (voor hem/haar)
  fa.a1.unit31.lesson05.teach.review_reading_words:
    title: Hij/zij / het is van Nima / hij/zij komt
    gloss: hij/zij / het is van Nima / hij/zij komt
