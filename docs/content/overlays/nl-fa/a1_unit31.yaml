course:
  title: Farsi in het Nederlands A1
  description: 'Beginnersperzisch (Iran): woorden voor feesten en verjaardagen leren (verjaardag, feestje, taart, cadeau), vragen en vertellen wanneer je jarig bent (*تولدت کِیه؟*) met de al geleerde maanden en rangtelwoorden, iemand uitnodigen voor een feestje en een uitnodiging accepteren (*میای به مهمونی؟* / *آره، حتماً میام*), een dialoog tussen Nima en Sara waarin *تولدت مبارک* ("gefeliciteerd met je verjaardag") voorkomt, een leestekst over Nima''s verjaardag en een afsluiting waarin je benoemt welke feesten je leuk vindt en je eigen uitnodiging of felicitatie schrijft.'
