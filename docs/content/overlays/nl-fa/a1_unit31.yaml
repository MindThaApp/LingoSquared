    example_gloss: Gefeliciteerd met je verjaardag!
  fa.a1.unit31.lesson04.teach.review_dialogue_words:
    title: Morgen / bedankt / wat leuk
    gloss: morgen / bedankt / wat fijn
    note: '*فردا*, *ممنون* en *چه خوب* komen hier terug.'
    target_text: فردا (morgen) / ممنون (bedankt) / چه خوب (wat fijn)
  fa.a1.unit31.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, morgen ben ik jarig!'
    gloss: Sara, morgen ben ik jarig!
  fa.a1.unit31.lesson04.teach.dialogue_line2:
    title: 'Sara: Gefeliciteerd, Nima!'
    gloss: Gefeliciteerd, Nima!
  fa.a1.unit31.lesson04.teach.dialogue_line3:
    title: 'Nima: Bedankt! Kom je naar het feestje?'
    gloss: Bedankt! Kom je naar het feestje?
  fa.a1.unit31.lesson04.teach.dialogue_line4:
    title: 'Sara: Ja, ik kom zeker. Ik neem een cadeau voor je mee.'
    gloss: Ja, ik kom zeker. Ik neem een cadeau voor je mee.
  fa.a1.unit31.lesson04.teach.dialogue_line5:
    title: 'Nima: Wat fijn! Bedankt, Sara.'
    gloss: Wat fijn! Bedankt, Sara.
