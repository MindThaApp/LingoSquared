    gloss: een paar / hoeveel
    note: '*چند* (hoeveel/een aantal) combineert met het telwoord *تا* tot ''een paar'' of ''hoeveel'' voor een telbaar zelfstandig naamwoord.'
  fa.a1.unit24.lesson05.teach.mikhone_word:
    title: Hij/zij leest
    gloss: hij/zij leest
    note: '*می‌خونه* is de informele vorm voor de derde persoon van *خوندن* (lezen).'
  fa.a1.unit24.lesson05.teach.ham_word:
    title: Ook
    gloss: ook
    note: '*هم* betekent ook en werd al op deze manier gebruikt in Unit 11.'
    example_gloss: Nima voetbalt ook.
  fa.a1.unit24.lesson05.teach.mikone_word:
    title: Hij/zij doet
    gloss: hij/zij doet
    note: '*می‌کنه* is de informele vorm voor de derde persoon van *می‌کنم* (ik doe).'
  fa.a1.unit24.lesson05.teach.reading_text:
    title: 'Lezen: de vrije tijd van Nima'
    gloss: Nima leest graag boeken. Hij leest elke week een paar boeken. Soms voetbalt hij ook.
    note: '*چند تا* voor *کتاب* betekent ''een paar boeken''; *می‌خونه* en *می‌کنه* zijn de informele vormen voor de derde persoon, om over iemand anders te praten.'
  fa.a1.unit24.lesson06.teach.sara_review:
    title: Sara
    gloss: Sara
    note: '*سارا*, al in Unit 14 geïntroduceerd als personage, komt hier opnieuw voor.'
    example_gloss: Sara kijkt graag films.
  fa.a1.unit24.lesson06.teach.didan_word:
    title: Kijken / zien
    gloss: kijken / zien
    note: '*دیدن* is de infinitief van het werkwoord waarvan de tegenwoordige tijd (*می‌بینم*) in les 2 aan bod kwam en de verleden tijd (*دیدم*) in Unit 13.'
    example_gloss: Ik kijk graag films.
  fa.a1.unit24.lesson06.teach.sinama_miram_phrase:
    title: Ik ga naar de bioscoop
    gloss: ik ga naar de bioscoop
    note: '*سینما* (bioscoop) heb je eerder geleerd; *می‌رم* (ik ga) kwam eerder voor in *می‌رم سر کار* (ik ga naar mijn werk).'
  fa.a1.unit24.lesson06.teach.chi_word:
    title: Wat
    gloss: wat
    note: '*چی* betekent ''wat''. Je zag het al zo in Unit 14 in *تو چی؟* (En jij?).'
    example_gloss: En jij?
  fa.a1.unit24.lesson06.teach.va_word:
    title: En
    gloss: en
    note: '*و* betekent ''en''. Je zag het al zo in Unit 14.'
    example_gloss: Ik lees graag en ik hou van voetbal.
  fa.a1.unit24.lesson06.teach.che_khoob_phrase:
    title: Wat leuk!
    gloss: wat leuk!
    note: '*چه خوب!* kwam eerder al voor. Het is een veelgebruikte positieve reactie, zoals ''wat fijn!'''
  fa.a1.unit24.lesson06.teach.dialogue_line1:
    title: 'Nima: Sara, wat doe je in je vrije tijd?'
    gloss: Sara, wat doe je in je vrije tijd?
  fa.a1.unit24.lesson06.teach.dialogue_line2:
    title: 'Sara: Ik kijk graag films...'
    gloss: Ik kijk graag films. Elke week ga ik naar de bioscoop. En jij?
  fa.a1.unit24.lesson06.teach.dialogue_line3:
    title: 'Nima: Ik lees graag boeken...'
    gloss: Ik lees graag boeken. Soms voetbal ik ook.
  fa.a1.unit24.lesson06.teach.dialogue_line4:
    title: 'Sara: Wat leuk!'
    gloss: Wat leuk!
