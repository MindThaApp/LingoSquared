  fa.a1.unit24.lesson01.teach.sargarmi_word:
    title: Hobby
    gloss: hobby
    note: '*سرگرمی* betekent hobby of tijdverdrijf.'
    example_gloss: Lezen is een hobby.
  fa.a1.unit24.lesson01.teach.ketab_khoondan_phrase:
    title: Boeken lezen
    gloss: boeken lezen
    note: '*کتاب خوندن* betekent letterlijk ''boeklezen'' -- *کتاب* (boek) heb je eerder geleerd, *خوندن* (lezen) is hier nieuw.'
  fa.a1.unit24.lesson01.teach.doost_daram_review:
    title: Ik vind ... leuk
    gloss: ik hou van
    note: '*دوست دارم* werkt met een activiteit net zo als met een ding: *کتاب خوندن دوست دارم* betekent ''ik lees graag boeken''.'
  fa.a1.unit24.lesson02.teach.musiqi_review:
    title: Muziek
    gloss: muziek
    note: '*موسیقی* komt hier opnieuw voor.'
    example_gloss: Ik luister naar muziek.
  fa.a1.unit24.lesson02.teach.goosh_midam_phrase:
    title: Ik luister
    gloss: ik luister
    note: '*گوش می‌دم* betekent letterlijk ''ik geef oor'' -- de natuurlijke manier om ''ik luister'' te zeggen in het Farsi.'
  fa.a1.unit24.lesson02.teach.film_review:
    title: Film
    gloss: film
    note: '*فیلم* komt hier opnieuw voor.'
    example_gloss: Ik kijk films.
  fa.a1.unit24.lesson02.teach.mibinam_word:
    title: Ik kijk / ik zie
    gloss: ik kijk / ik zie
    note: '*می‌بینم* is de tegenwoordige tijd van het werkwoord waarvan je de verleden tijd (*دیدم*, ''ik zag'') eerder hebt geleerd.'
  fa.a1.unit24.lesson03.teach.varzesh_word:
    title: Sport
    gloss: sport
    note: '*ورزش* betekent zowel ''sport'' als ''lichaamsbeweging'' in het algemeen.'
    example_gloss: Ik sport.
  fa.a1.unit24.lesson03.teach.mikonam_review:
    title: Ik doe
    gloss: ik doe
    note: '*می‌کنم* is het algemene werkwoord ''ik doe/maak'' in samengestelde werkwoorden zoals *ورزش می‌کنم* (ik sport).'
  fa.a1.unit24.lesson03.teach.footbal_word:
    title: Voetbal
    gloss: voetbal
    note: '*فوتبال* betekent voetbal.'
    example_gloss: Ik hou van voetbal.
  fa.a1.unit24.lesson03.teach.bazi_phrase:
    title: Ik voetbal
    gloss: ik voetbal
    note: '*بازی* betekent spel/spelen -- *فوتبال بازی می‌کنم* betekent letterlijk ''ik doe voetbalspel''.'
  fa.a1.unit24.lesson04.teach.hafte_word:
    title: Week
    gloss: week
    note: '*هفته* betekent week.'
    example_gloss: Ik sport elke week.
  fa.a1.unit24.lesson04.teach.har_hafte_phrase:
    title: Elke week
    gloss: elke week
    note: '*هر* combineert op dezelfde manier met *هفته* tot *هر هفته* (elke week).'
  fa.a1.unit24.lesson04.teach.gahi_word:
    title: Soms
    gloss: soms
    note: '*گاهی* betekent soms.'
    example_gloss: Soms lees ik boeken.
