teaching:
  fa.a1.unit03.lesson01.teach.adad:
    title: Nummer
    gloss: nummer
    note: عدد is het algemene woord voor een getal.
    example_gloss: Dit is een getal.
  fa.a1.unit03.lesson01.teach.zero:
    title: Nul
    gloss: 0 — nul
    note: صفر gebruik je voor nul, ook als cijfer in een langer getal, zoals een telefoonnummer.
    example_gloss: Nul is een getal.
  fa.a1.unit03.lesson01.teach.one:
    title: Een
    gloss: 1 — één
    note: یک is één.
    example_gloss: Ik heb één boek.
  fa.a1.unit03.lesson01.teach.two:
    title: Twee
    gloss: 2 — twee
    note: دو is twee.
    example_gloss: Ik heb twee appels.
  fa.a1.unit03.lesson01.teach.three:
    title: Drie
    gloss: 3 — drie
    note: سه is drie.
    example_gloss: Hij heeft drie broers.
  fa.a1.unit03.lesson01.teach.four:
    title: Vier
    gloss: 4 — vier
    note: چهار is vier.
    example_gloss: Het is vier uur.
  fa.a1.unit03.lesson01.teach.five:
    title: Vijf
    gloss: 5 — vijf
    note: پنج is vijf.
    example_gloss: Wacht vijf minuten.
  fa.a1.unit03.lesson01.teach.six:
    title: Zes
    gloss: 6 — zes
    note: شش is zes.
    example_gloss: Er zijn zes stoelen.
  fa.a1.unit03.lesson01.teach.seven:
    title: Zeven
    gloss: 7 — zeven
    note: هفت is zeven.
    example_gloss: Een week heeft zeven dagen.
  fa.a1.unit03.lesson01.teach.eight:
    title: Acht
    gloss: 8 — acht
    note: هشت is acht.
    example_gloss: Ik zie jullie om acht uur.
  fa.a1.unit03.lesson01.teach.nine:
    title: Negen
    gloss: 9 — negen
    note: نه is negen. Het is ook het gewone woord voor 'nee'. De context (je hoort het in een telling of getal) laat zien welke betekenis bedoeld is.
    example_gloss: Er zijn negen leerlingen hier.
  fa.a1.unit03.lesson01.teach.ten:
    title: Tien
    gloss: 10 — tien
    note: ده is tien.
    example_gloss: Ik heb tien vingers.
  fa.a1.unit03.lesson02.teach.eleven:
    title: Elf
    gloss: 11 — elf
    note: یازده is elf.
    example_gloss: Ik heb om elf uur les.
  fa.a1.unit03.lesson02.teach.twelve:
    title: Twaalf
    gloss: 12 — twaalf
    note: دوازده is twaalf.
    example_gloss: Een jaar heeft twaalf maanden.
  fa.a1.unit03.lesson02.teach.thirteen:
    title: Dertien
    gloss: 13 — dertien
    note: سیزده is dertien.
    example_gloss: Hij/zij is dertien jaar oud.
  fa.a1.unit03.lesson02.teach.fourteen:
    title: Veertien
    gloss: 14 — veertien
    note: چهارده is veertien.
    example_gloss: Ik kom over veertien dagen.
  fa.a1.unit03.lesson02.teach.fifteen:
    title: Vijftien
    gloss: 15 — vijftien
    note: پانزده is vijftien.
    example_gloss: Hij/zij heeft vijftien boeken.
  fa.a1.unit03.lesson02.teach.sixteen:
    title: Zestien
    gloss: 16 — zestien
    note: شانزده is zestien. Je kunt het niet afleiden uit شش (zes) + ده (tien), dus leer het als los woord.
    example_gloss: Hij/zij is zestien jaar oud.
  fa.a1.unit03.lesson02.teach.seventeen:
    title: Zeventien
    gloss: 17 — zeventien
    note: هفده is zeventien.
    example_gloss: Er kwamen zeventien mensen.
  fa.a1.unit03.lesson02.teach.eighteen:
    title: Achttien
    gloss: 18 — achttien
    note: هجده is achttien.
    example_gloss: Hij/zij is achttien jaar oud.
  fa.a1.unit03.lesson02.teach.nineteen:
    title: Negentien
    gloss: 19 — negentien
    note: نوزده is negentien.
    example_gloss: Nog negentien dagen te gaan.
  fa.a1.unit03.lesson02.teach.twenty:
    title: Twintig
    gloss: 20 — twintig
    note: بیست is twintig.
    example_gloss: Ik heb twintig boeken.
  fa.a1.unit03.lesson02.teach.thirty:
    title: Dertig
    gloss: 30 — dertig
    note: سی is dertig.
    example_gloss: Deze maand heeft dertig dagen.
  fa.a1.unit03.lesson02.teach.forty_to_ninety:
    title: Veertig tot negentig
    gloss: 40, 50, 60, 70, 80, 90
    note: چهل، پنجاه، شصت، هفتاد، هشتاد، نود zijn de overige tientallen.
    example_gloss:
    - Hij/zij is veertig jaar oud.
    - Er zijn vijftig stoelen.
    - Zestig minuten is één uur.
    - Dit boek heeft zeventig bladzijden.
    - Hij/zij heeft tachtig boeken.
    - Hij/zij is negentig jaar oud.
  fa.a1.unit03.lesson02.teach.combining:
    title: Tientallen en eenheden combineren
    gloss: vijfentwintig
    note: 'بیست و پنج is letterlijk ''twintig en vijf'': eerst het tiental, dan و, dan de eenheid. (In het Nederlands zeg je de eenheid eerst: vijf-en-twintig.)'
  fa.a1.unit03.lesson03.teach.shomare:
    title: Nummer
    gloss: nummer
    note: شماره gebruik je voor een identificerend nummer, zoals een telefoon- of huisnummer. Het verschilt van عدد, dat 'getal' in het algemeen betekent.
    example_gloss: Dit is mijn telefoonnummer.
  fa.a1.unit03.lesson03.teach.telefon:
    title: Telefoon
    gloss: telefoon
    note: تلفن wordt gebruikt voor telefoons in het algemeen, ook voor mobiele telefoons.
    example_gloss: Ik heb geen telefoon.
  fa.a1.unit03.lesson03.teach.digit_by_digit:
    title: Vraag om een telefoonnummer
    gloss: Wat is je telefoonnummer?
    note: شماره تلفنتون چنده؟ is de gewone beleefde manier om naar een telefoonnummer te vragen. Een nummer cijfer voor cijfer voorlezen wordt altijd begrepen en is voor beginners het veiligst. Cijfers groeperen is in echte gesprekken ook normaal, maar in deze les oefen je eerst de eenvoudiger cijfer-voor-cijfervorm.
  fa.a1.unit03.lesson03.teach.chande:
    title: Hoeveel / wat is het?
    gloss: wat is het? / hoeveel is het?
    note: چنده؟ is een samentrekking van چند است. Je vraagt ermee naar een nummer, aantal of prijs, afhankelijk van de context.
  fa.a1.unit03.lesson03.teach.read_number:
    title: Een nummer cijfer voor cijfer lezen
    gloss: nul, negen, een, twee, drie, vier, vijf, zes, zeven, acht, acht
    note: In deze les oefen je nummers cijfer voor cijfer lezen. Een echt Iraans mobiel nummer heeft 11 cijfers en begint met 0, bijvoorbeeld 0912 345 6788.
  fa.a1.unit03.lesson04.teach.sal:
    title: Jaar
    gloss: jaar
    note: سال gebruik je zowel voor kalenderjaren als voor iemands leeftijd.
    example_gloss: Ik ben twintig jaar oud.
  fa.a1.unit03.lesson04.teach.man_recap:
    title: Ik (herhaling)
    gloss: ik
    note: Een korte herinnering aan من. Je hebt het hier nodig om je eigen leeftijd in een volledige zin te zeggen.
  fa.a1.unit03.lesson04.teach.chand_saale:
    title: Naar iemands leeftijd vragen (informeel)
    gloss: Hoe oud ben je?
    note: چند سالته؟ is de informele vorm voor één persoon; چند سالتونه؟ is de beleefde variant.
  fa.a1.unit03.lesson04.teach.salame:
    title: Je leeftijd zeggen
    gloss: Ik ben 25 jaar oud.
    note: 'سالمه plakt het bezittelijke achtervoegsel ـم (mijn) direct aan سال en voegt daarna de informele koppelwerkwoordsvorm ـه (is) toe: letterlijk ''mijn-jaar-is''.'
  fa.a1.unit03.lesson04.teach.ta:
    title: Telwoord voor het tellen
    gloss: (telwoord; heeft geen directe vertaling in het Nederlands)
    note: 'تا is het algemene telwoord dat je gebruikt bij het tellen van de meeste voorwerpen: getal + تا + zelfstandig naamwoord.'
  fa.a1.unit03.lesson04.teach.sib:
    title: Appel
    gloss: appel
    note: سیب betekent appel.
    example_gloss: Ik hou van appels.
  fa.a1.unit03.lesson04.teach.ketab:
    title: Boek
    gloss: boek
    note: کتاب betekent boek.
    example_gloss: Dit is een goed boek.
  fa.a1.unit03.lesson04.teach.do_ta_sib:
    title: Om een hoeveelheid vragen
    gloss: Ik wil graag twee appels.
    note: In دو تا سیب می‌خوام staat de geteld hoeveelheid vóór het zelfstandig naamwoord, zoals gebruikelijk bij تا.
  fa.a1.unit03.lesson05.teach.gheymat:
    title: Prijs
    gloss: prijs
    note: قیمت is het algemene woord voor prijs.
    example_gloss: Wat is de prijs hiervan?
  fa.a1.unit03.lesson05.teach.toman:
    title: Toman
    gloss: toman (Iraanse munteenheid, in het dagelijks gebruik)
    note: De officiële munteenheid van Iran is de rial, maar in het dagelijks gesprek worden prijzen bijna altijd in toman genoemd (1 toman = 10 rial).
    example_gloss: Dit kost tienduizend toman.
  fa.a1.unit03.lesson05.teach.hezar:
    title: Duizend
    gloss: duizend
    note: هزار betekent duizend; prijzen worden meestal in duizenden toman genoemd.
    example_gloss: Ik heb duizend toman.
  fa.a1.unit03.lesson05.teach.ask_price:
    title: Naar een prijs vragen
    gloss: Hoeveel kost dit?
    note: این چنده؟ is de gewone manier om naar de prijs te vragen van iets wat voor je neus ligt.
  fa.a1.unit03.lesson05.teach.price_answer:
    title: Een prijs noemen
    gloss: Het kost 30.000 toman.
    note: تومنه is een samentrekking van تومن است; het volledige patroon is getal + هزار + تومنه.
  fa.a1.unit03.lesson06.teach.practice_together:
    title: Sara stelt voor om samen te oefenen
    gloss: Sara zegt dat ze samen Farsi willen oefenen en vraagt naar het telefoonnummer van Mina.
    note: باهم betekent 'samen'; می‌خوام ... تمرین کنیم betekent 'ik wil dat we oefenen'. Alleen تمرین کنیم, als vraag, kan ook 'zullen we oefenen?' betekenen.
  fa.a1.unit03.lesson06.teach.mina_gives_number:
    title: Mina geeft haar nummer
    gloss: Mina stemt in en leest haar nummer van 11 cijfers cijfer voor cijfer voor.
    note: شماره‌ام is een samentrekking van شماره من; هشته is een samentrekking van هشت است en sluit de rij af.
  fa.a1.unit03.lesson06.teach.sara_confirms:
    title: Sara controleert of ze het goed heeft opgeschreven
    gloss: Sara vraagt Mina te wachten terwijl ze het nummer opschrijft en leest het dan terug ter controle.
    note: درسته؟ ('klopt dat?') is een gebruikelijke manier om een nummer of feit te controleren dat je net hebt gehoord.
  fa.a1.unit03.lesson06.teach.mina_confirms_asks:
    title: Mina bevestigt en vraagt terug
    gloss: Mina bevestigt dat het klopt en vraagt naar het nummer van Sara.
    note: آره is een informeel 'ja', losser dan بله.
  fa.a1.unit03.lesson06.teach.sara_gives_number:
    title: Sara geeft haar nummer
    gloss: Sara leest haar eigen nummer van 11 cijfers cijfer voor cijfer voor.
    note: یکه is een samentrekking van یک است en sluit de rij af, net zoals هشته dat deed bij het nummer van Mina.
  fa.a1.unit03.lesson06.teach.mina_will_call:
    title: Mina stemt in om te bellen
    gloss: Mina zegt dat ze Sara morgen belt.
    note: 'زنگ می‌زنم بهت betekent ''ik bel je'': letterlijk ''ik sla de bel naar je''.'
