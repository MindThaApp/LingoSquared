teaching:
  fa.a2.unit51.short_story.lesson01.teach.place_words:
    title: Plekken en lekkers voor een dagje uit
    gloss: dierentuin, boot, pretpark, ijs
    note: '*سوار قایق شدن* betekent “op een boot stappen / een boottocht maken”.'
    example_gloss:
    - Gisteren zijn we naar de dierentuin gegaan.
    - We gingen met de boot.
    - Morgen gaan we naar het pretpark.
    - We aten ijs.
  fa.a2.unit51.short_story.lesson01.teach.we_past_verbs:
    title: 'Wat we deden: verleden tijd met ـیم'
    gloss: wij gingen, wij zagen, wij kochten, wij aten, wij namen / kregen, wij werden / stapten op
    note: De uitgang voor “wij” in de verleden tijd is *ـیم*. Het werkwoord staat meestal aan het einde van de zin.
    example_gloss:
    - We zagen leeuwen en olifanten.
    - We kochten kaartjes.
    - We maakten foto's.
    - We stapten op een boot.
  fa.a2.unit51.short_story.lesson01.teach.order_words:
    title: Woorden die gebeurtenissen op volgorde zetten
    gloss: eerst, daarna, hierna, uiteindelijk
    note: '*بعدش* en *بعد* betekenen allebei “daarna”. *آخرش* is “uiteindelijk” en begint de laatste gebeurtenis.'
    example_gloss:
    - Eerst kochten we kaartjes.
    - Daarna zagen we een leeuw.
    - Hierna maakten we foto's.
    - Uiteindelijk aten we ijs.
  fa.a2.unit51.short_story.lesson01.teach.tell_in_order:
    title: Een dag op volgorde vertellen
    gloss: Eerst gingen we naar de dierentuin, daarna gingen we op een boot, uiteindelijk gingen we naar het pretpark.
    note: Een verhaal volgt de volgorde van de gebeurtenissen. Zet *اول*, *بعدش* of *بعد* en *آخرش* aan het begin van elk deel, met in elk deel een werkwoord in de verleden tijd. Je kunt *ما* weglaten, want de uitgang *ـیم* zegt al “wij”.
  fa.a2.unit51.short_story.lesson02.teach.they_past_verbs:
    title: 'Wat zij deden: verleden tijd met ـن'
    gloss: zij gingen, zij zagen, zij kochten, zij aten, zij kwamen aan, zij kwamen terug
    note: In de verleden tijd eindigt “zij” op *ـن* (*رفتن*) en “wij” op *ـیم* (*رفتیم*). De gesproken *ـن* heeft dezelfde vorm als de infinitief, dus de zin vertelt je wie het is.
    example_gloss:
    - Sara en Nima gingen gisteren naar de dierentuin.
    - Ze zagen een leeuw.
    - Ze kochten kaartjes.
    - Uiteindelijk gingen ze terug naar huis.
  fa.a2.unit51.short_story.lesson02.teach.feeling_verbs:
    title: Was bang, lachte
    gloss: hij/zij was bang, hij/zij lachte, zij waren bang, zij lachten
    note: '*ترسید* en *خندید* zijn vormen voor hij/zij; *ترسیدن* en *خندیدن* zijn de vormen voor “zij” (meervoud).'
    example_gloss:
    - Nima was bang.
    - Sara lachte.
    - Sara en Nima lachten veel.
    - Ze waren bang.
  fa.a2.unit51.short_story.lesson02.teach.when_past:
    title: وقتی in een verhaal
    gloss: Toen ze aankwamen, kochten ze kaartjes. Toen ze op de boot stapten, was Nima bang.
    note: In een verhaal wordt *وقتی* gevolgd door een werkwoord in de verleden tijd en daarna door het hoofdwerkwoord in de verleden tijd. Het deel met *وقتی* noemt het moment en de hoofdzin vertelt wat er toen gebeurde.
  fa.a2.unit51.short_story.lesson02.teach.people_events:
    title: Een verhaal beginnen
    gloss: Sara en Nima gingen gisteren naar de dierentuin.
    note: Een verhaal begint meestal met wie, wanneer en waar.
  fa.a2.unit51.short_story.lesson03.teach.progressive_forms:
    title: Wat gaande was
    gloss: wij waren aan het gaan, hij/zij/het was aan het gaan, zij waren aan het eten, hij/zij was foto's aan het maken
    note: '*داشت* plus een werkwoord met *می‌* geeft een handeling aan die gaande was. Gebruik het voor wat er aan de gang was terwijl er iets anders gebeurde.'
    example_gloss:
    - We waren op weg naar de dierentuin.
    - Sara was foto's aan het maken.
    - Ze waren ijs aan het eten.
    - Ik was foto's aan het maken.
    - De boot voer.
  fa.a2.unit51.short_story.lesson03.teach.progressive_note:
    title: Twee dingen tegelijk
    gloss: Terwijl de boot voer, maakte Sara foto's.
    note: Het eerste deel schetst de situatie (*قایق داشت می‌رفت*); het tweede zegt wat er verder gebeurde (*سارا داشت عکس می‌گرفت*). Gebruik deze vorm alleen in bevestigende zinnen, niet in ontkennende.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_forms:
    title: Wat al gebeurd was
    gloss: hij/zij had gekocht, wij waren gegaan, zij waren aangekomen, ik had gezien
    note: '*بود/بودیم/بودن/بودم* na de *ـه*-vorm van het werkwoord betekent dat de handeling al voltooid was (voltooid verleden tijd).'
    example_gloss:
    - Nima had de kaartjes gekocht.
    - We waren er al eerder geweest.
    - Ze waren aangekomen.
    - Ik had eerder een leeuw gezien.
  fa.a2.unit51.short_story.lesson03.teach.past_perfect_note:
    title: Iets wat eerder gebeurde
    gloss: Toen we aankwamen, had Nima de kaartjes al gekocht.
    note: Het voltooid verleden tijd laat zien dat de ene gebeurtenis in het verleden vóór de andere plaatsvond. De twee gebeurtenissen zijn *رسیدیم* (later) en *خریده بود* (eerder).
  fa.a2.unit51.short_story.lesson04.teach.habit_words:
    title: Elk jaar, toen ik een kind was
    gloss: elk jaar, toen ik een kind was, mijn mama
    note: '*هر سال* en *وقتی بچه بودم* laten zien dat iets in het verleden steeds opnieuw gebeurde.'
    example_gloss:
    - Elk jaar gingen we naar het pretpark.
    - Toen ik een kind was, gingen we met mijn mama.
    - Mijn mama houdt van pretparken.
  fa.a2.unit51.short_story.lesson04.teach.perfect_forms:
    title: Ooit al eens?
    gloss: tot nu toe / ooit, ik ben geweest, ik ben niet geweest, wij zijn geweest, jij bent ingestapt / geworden
    note: '*تا حالا* vraagt of zegt of iets tot nu toe is gebeurd. In spreektaal kun je ook de gewone verleden tijd gebruiken: *تا حالا سوار قایق شدی؟*'
    example_gloss:
    - Ik ben nog nooit in een pretpark geweest.
    - Ben je ooit op een boot gestapt?
    - We zijn in de dierentuin geweest.
  fa.a2.unit51.short_story.lesson04.teach.tense_choice:
    title: Welke verleden tijd voor welk verhaal?
    gloss: We gingen gisteren; we gingen elk jaar; we waren gegaan; we zijn tot nu toe geweest.
    note: Gebruik de gewone verleden tijd voor één afgerond gebeuren, de *می‌ـ*-verleden tijd voor een gewoonte, *بود* voor het voltooid verleden tijd (“had/was”) en *تا حالا* met de *ـه*-vorm voor ervaring tot nu toe.
  fa.a2.unit51.short_story.lesson04.teach.ever_phrase:
    title: Naar ervaring vragen
    gloss: Ben je ooit op een boot gestapt? Ja, één keer.
    note: 'Een korte vraag en een kort antwoord: *یه بار* betekent “één keer”.'
  fa.a2.unit51.short_story.lesson05.teach.reading:
    title: Een dagje uit
    gloss: Gisteren gingen Sara en Nima naar de dierentuin. Toen ze aankwamen, had Nima de kaartjes al gekocht. Eerst zagen ze leeuwen en olifanten. Daarna stapten ze op een boot. Terwijl de boot voer, was Nima bang, maar Sara maakte foto's. Daarna gingen ze naar het pretpark en lachten ze veel. Op het eind aten ze ijs en gingen ze naar huis terug.
    note: Lees één keer voor de volgorde van de plaatsen en nog een keer om te zien wie wat deed.
  fa.a2.unit51.short_story.lesson06.teach.turn01:
    title: Nima begint
    gloss: Sara, we hebben gisteren een heel leuke tijd gehad!
    note: Nima begint met hoe de dag was.
  fa.a2.unit51.short_story.lesson06.teach.turn02:
    title: Sara begint het verhaal
    gloss: Ja! Eerst gingen we naar de dierentuin en zagen we leeuwen en olifanten.
    note: '*اول* start het navertellen.'
  fa.a2.unit51.short_story.lesson06.teach.turn03:
    title: Nima gaat verder
    gloss: Daarna stapten we op een boot. Toen de boot voer, was ik bang.
    note: '*بعدش* zet de volgorde voort; *داشت می‌رفت* is de achtergrond.'
  fa.a2.unit51.short_story.lesson06.teach.turn04:
    title: Sara vult aan
    gloss: Maar ik lachte en maakte foto's! Daarna gingen we naar het pretpark.
    note: '*بعد* laat het verhaal verdergaan.'
  fa.a2.unit51.short_story.lesson06.teach.turn05:
    title: Nima rondt af
    gloss: Op het eind aten we ijs. Ik was nog nooit eerder in een pretpark geweest.
    note: '*نرفته بودم* kijkt terug op iets wat eerder was.'
  fa.a2.unit51.short_story.lesson06.teach.turn06:
    title: Sara plant nog een uitstapje
    gloss: Dan gaan we volgende week weer!
    note: Een plan met de gewone tegenwoordige tijd.
