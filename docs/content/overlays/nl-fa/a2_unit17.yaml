teaching:
  fa.a2.unit17.lesson01.teach.week_word:
    title: Week
    gloss: week
    note: '*هفته* is het algemene woord voor ''week''.'
    example_gloss: Deze week is erg druk.
  fa.a2.unit17.lesson01.teach.weekend_word:
    title: Weekend
    gloss: weekend
    note: '*آخر هفته* betekent letterlijk ''einde van de week''. In Iran zijn dat *پنجشنبه*/*جمعه* (donderdag/vrijdag), niet zaterdag/zondag.'
    example_gloss: In het weekend werk ik niet.
  fa.a2.unit17.lesson01.teach.rest_word:
    title: Rust
    gloss: rust
    note: '*استراحت کردن* (rusten) is een samengesteld werkwoord met کردن, net als *باز کردن* uit de eerdere bankeenheid.'
    example_gloss: Op vrijdag rust ik uit.
  fa.a2.unit17.lesson01.teach.first_word:
    title: Eerst
    gloss: eerst
    note: '*اول* opent een reeks activiteiten.'
    example_gloss: Eerst ontbijt ik.
  fa.a2.unit17.lesson01.teach.then_word:
    title: Dan
    gloss: dan
    note: '*بعد* zet een reeks voort; *بعدش* (daarna) is de gangbare omgangsvorm daarvan.'
    example_gloss: Daarna ga ik naar mijn werk.
  fa.a2.unit17.lesson01.teach.finally_word:
    title: Tot slot
    gloss: tot slot / uiteindelijk
    note: '*در آخر* sluit een reeks activiteiten af.'
    example_gloss: Tot slot rust ik uit.
  fa.a2.unit17.lesson01.teach.recap_weekdays:
    title: Dagen van de week
    gloss: zaterdag, zondag, maandag, dinsdag, woensdag, donderdag, vrijdag
    note: Herhaling van de namen van de dagen uit de eerdere eenheid over datums, hier gebruikt voor een weekschema.
  fa.a2.unit17.lesson02.teach.until_word:
    title: Tot / van ... tot (een reeks dagen)
    gloss: tot / tot en met
    note: '*تا* verbindt twee dagen tot een reeks, bijvoorbeeld *شنبه تا چهارشنبه* (zaterdag tot en met woensdag).'
  fa.a2.unit17.lesson02.teach.work_days_sentence:
    title: Je werkdagen als reeks noemen
    gloss: Ik werk van zaterdag tot en met woensdag.
    note: Dit is een gangbare Iraanse werkweek (veel kantoren en winkels werken van zaterdag tot woensdag), niet het patroon van maandag tot vrijdag.
  fa.a2.unit17.lesson02.teach.thursdays_habitual_note:
    title: Het achtervoegsel -ها achter een dagnaam voor een gewoonte
    gloss: op donderdag (elke week)
    note: '*پنجشنبه‌ها* (پنجشنبه + -ها) betekent ''op donderdagen'' als terugkerende gewoonte, niet op één bepaalde donderdag.'
  fa.a2.unit17.lesson02.teach.during_vs_weekend_sentence:
    title: De week met het weekend vergelijken
    gloss: Door de week werk ik, maar in het weekend rust ik uit.
    note: '*در طول هفته* (door de week) staat tegenover *آخر هفته* (het weekend), verbonden door *ولی* (maar).'
  fa.a2.unit17.lesson03.teach.clean_word:
    title: Schoonmaken
    gloss: schoonmaken
    note: '*تمیز کردن* is nog zo''n samengesteld werkwoord: *تمیز* (schoon) + *کردن* (doen).'
    example_gloss: Op donderdag maak ik het huis schoon.
  fa.a2.unit17.lesson03.teach.schedule_note_text:
    title: Het geschreven weekschema van سارا
    gloss: 'Mijn weekschema: ik werk van zaterdag tot en met woensdag. Op donderdag doe ik boodschappen en maak ik het huis schoon. Op vrijdag, in het weekend, zie ik mijn vrienden en rust ik uit.'
    note: Een kort weekplanningsbriefje in ontspannen spreektaal (*خونه*, *دوستامو*).
  fa.a2.unit17.lesson04.teach.good_week_phrase:
    title: Wat heb jij een mooie week!
    gloss: Wat heb jij een mooie week!
    note: Een vriendelijke afsluitende opmerking nadat je iemands weekschema hebt gehoord. Het is een reactie op de week die iemand heeft, niet de afscheidswens 'fijne week'.
  fa.a2.unit17.lesson04.teach.turn01:
    title: نیما vraagt naar de week van سارا
    gloss: نیما vraagt سارا hoe haar week eruitziet en wat haar schema is.
    note: '*چطوره* en *چیه* zijn de vaste gesproken, ingekorte vormen van ''is hoe'' en ''is wat''.'
  fa.a2.unit17.lesson04.teach.turn02:
    title: سارا begint met haar werkdagen
    gloss: سارا zegt dat ze eerst van zaterdag tot en met woensdag naar haar werk gaat.
    note: '*سر کار می‌رم* (ik ga naar mijn werk) gebruikt de eerder geleerde uitdrukking voor ''naar het werk gaan''.'
  fa.a2.unit17.lesson04.teach.turn03:
    title: نیما vraagt wat er daarna komt
    gloss: 'نیما vraagt: en daarna?'
    note: '*بعدش چی؟* is een korte, natuurlijke manier om te vragen wat er daarna komt.'
  fa.a2.unit17.lesson04.teach.turn04:
    title: سارا vertelt over haar donderdagen
    gloss: سارا zegt dat ze daarna op donderdag boodschappen doet en het huis schoonmaakt.
    note: Gebruikt dezelfde donderdagzin als eerder in deze eenheid.
  fa.a2.unit17.lesson04.teach.turn05:
    title: سارا vertelt over haar vrijdagen
    gloss: سارا zegt dat ze tot slot op vrijdag uitrust en haar vrienden ziet.
    note: Sluit de reeks af met *در آخر* (tot slot).
  fa.a2.unit17.lesson04.teach.turn06:
    title: نیما sluit het gesprek af
    gloss: 'نیما zegt: wat heb jij een mooie week!'
    note: Gebruikt de afsluitende zin van deze les.
