course:
  title: Perzisch A2
  description: 'Iraans Farsi voor gevorderde beginners: beschrijf een typische week, leg een volgorde van activiteiten uit met اول/بعد/در آخر en vergelijk doordeweekse dagen met de echte Iraanse werkweek van شنبه tot چهارشنبه en het weekend op پنجشنبه/جمعه.'
units:
  fa.a2.unit17.weekly_schedule:
    title: Weekschema
