teaching:
  fa.a2.unit27.lesson01.teach.time_words:
    title: Tijdwoorden voor plannen
    gloss: morgen, het weekend, volgende week, volgende maand, volgend jaar, vandaag, nu
    note: '*هفته‌ی بعد*, *ماه دیگه* en *سال دیگه* zijn gewone manieren om „volgende week / volgende maand / volgend jaar” te zeggen. *آخر هفته* is „het weekend”; uit de context blijkt welk weekend bedoeld is.'
    example_gloss:
    - Morgen heb ik les.
    - Volgende maand ga ik op reis.
    - Volgend jaar heb ik een nieuw huis.
  fa.a2.unit27.lesson01.teach.course_house:
    title: Cursussen en verhuizen
    gloss: cursus, les, taal, inschrijving, huis, doos
    note: '*ثبت‌نام* betekent „inschrijving / je inschrijven”. Je gebruikt deze woorden voor Sara’s taalcursus en Nima’s verhuizing.'
    example_gloss:
    - Ik volg een taalcursus.
    - Ik heb taalles.
    - Ik heb dozen.
  fa.a2.unit27.lesson01.teach.plan_verbs:
    title: Werkwoorden voor plannen
    gloss: ik ga, ik begin, ik schrijf me in, ik verhuis, ik koop dozen
    note: '*خونه عوض کردن* is de gesproken manier om „verhuizen” te zeggen (letterlijk „van huis wisselen”).'
    example_gloss:
    - Morgen ga ik naar les.
    - Volgende week begin ik met de les.
    - Morgen schrijf ik me in.
    - Volgende maand verhuis ik.
    - Morgen koop ik dozen.
  fa.a2.unit27.lesson01.teach.things_to_buy:
    title: Dingen om te kopen
    gloss: vloerkleed, gordijn, taart
    note: Gebruik deze alledaagse zelfstandige naamwoorden als je het over boodschappen en aankopen hebt.
    example_gloss:
    - Morgen koop ik een vloerkleed.
    - Morgen koop ik gordijnen.
    - Morgen koop ik een taart.
  fa.a2.unit27.lesson01.teach.places_and_events:
    title: Plaatsen en gebeurtenissen
    gloss: restaurant, café, feest
    note: '*مهمونی* is de gewone gesproken vorm van „feest”.'
    example_gloss:
    - Morgen ga ik naar een restaurant.
    - Morgen ga ik naar een café.
    - In het weekend heb ik een feest.
  fa.a2.unit27.lesson01.teach.present_for_future:
    title: De tegenwoordige tijd kan een plan uitdrukken
    gloss: Morgen ga ik; volgende week begin ik
    note: 'Gesproken Perzisch gebruikt de gewone tegenwoordige tijd (*می‌رم*, *شروع می‌کنم*) voor een plan. Een tijdswoord als *فردا* of *هفته‌ی بعد* laat zien dat de handeling in de toekomst ligt. In alledaagse spraak is er geen aparte toekomende tijd. Dat is ook zo in het Nederlands: „morgen ga ik” is tegenwoordige tijd.'
  fa.a2.unit27.lesson02.teach.i_want:
    title: Ik wil, jij wilt
    gloss: ik wil, jij wilt, een
    note: '*یه* is het gewone gesproken „een”. *تو چی می‌خوای؟* betekent „Wat wil jij?”'
    example_gloss:
    - Ik wil een huis kopen.
    - Wat wil jij?
  fa.a2.unit27.lesson02.teach.short_verbs:
    title: Korte werkwoordsvormen
    gloss: gaan, kopen, beginnen, zich inschrijven, vinden, leren
    note: 'Dit zijn de korte werkwoordsvormen die na *می‌خوام* komen. Bij werkwoorden van twee delen verandert het tweede deel: *شروع کنم*, *ثبت‌نام کنم*, *پیدا کنم*.'
    example_gloss:
    - Ik wil naar les gaan.
    - Ik wil dozen kopen.
    - Ik wil een huis vinden.
    - Ik wil een taal leren.
  fa.a2.unit27.lesson02.teach.want_plus_short:
    title: می‌خوام + kort werkwoord
    gloss: Ik wil gaan; ik wil kopen; ik wil beginnen
    note: 'Om te zeggen wat je wilt of van plan bent, gebruik je *می‌خوام* plus een korte werkwoordsvorm. Het tweede werkwoord heeft geen *می‌*: zeg *می‌خوام برم*, nooit *می‌خوام می‌رم*. De uitgang van het tweede werkwoord past bij de persoon die iets wil.'
  fa.a2.unit27.lesson02.teach.person_endings:
    title: Het tweede werkwoord volgt de persoon
    gloss: Ik wil gaan; jij wilt gaan; hij/zij wil gaan
    note: 'Het korte werkwoord verandert mee met de persoon: *برم* (ik), *بری* (jij), *بره* (hij/zij). Hetzelfde patroon geldt voor *بخرم / بخری / بخره*. In deze unit maak je vooral de *من*-vormen.'
  fa.a2.unit27.lesson03.teach.habit_words:
    title: Woorden voor gewoontes
    gloss: elke dag, elke week, altijd, meestal
    note: Deze woorden geven een herhaalde gewoonte aan. Het werkwoord is dezelfde tegenwoordige tijd als bij een plan; het tijdswoord vertelt welke betekenis het heeft.
    example_gloss:
    - Ik ga elke dag naar les.
    - Ik ga altijd naar les.
    - Ik blijf meestal thuis.
    - Ik heb elke week twee dagen les.
  fa.a2.unit27.lesson03.teach.habit_vs_plan:
    title: Hetzelfde werkwoord, een ander tijdswoord
    gloss: Ik ga elke dag; ik ga morgen
    note: '*می‌رم* kan een gewoonte of een plan zijn. *هر روز* en *همیشه* maken er een gewoonte van; *فردا*, *هفته‌ی بعد* en *ماه دیگه* maken er een plan van. Kijk dus altijd eerst naar het tijdswoord.'
  fa.a2.unit27.lesson03.teach.plan_vs_want:
    title: Plan of voornemen?
    gloss: Morgen ga ik; ik wil gaan
    note: '*فردا می‌رم* kondigt een plan met een tijdswoord aan. *می‌خوام برم* zegt wat je wilt of van plan bent en heeft geen tijdswoord nodig. Onthoud: na *می‌خوام* verliest het tweede werkwoord *می‌*.'
  fa.a2.unit27.lesson03.teach.decided:
    title: Besloten, van plan
    gloss: ik heb besloten, ik ben van plan
    note: '*تصمیم گرفتم* en *قصد دارم* zijn twee andere manieren om over een voornemen te praten. Na beide volgt een korte werkwoordsvorm.'
    example_gloss:
    - Ik heb besloten te verhuizen.
    - Ik ben van plan een taal te leren.
  fa.a2.unit27.lesson03.teach.decided_plus_short:
    title: تصمیم گرفتم + kort werkwoord
    gloss: Ik heb besloten te gaan; ik heb besloten te beginnen
    note: '*گرفتم* is verleden tijd omdat het besluit al genomen is, maar het werkwoord erna heeft de korte vorm (*برم*, *شروع کنم*) omdat de handeling nog moet komen. Zet er geen *می‌* voor.'
  fa.a2.unit27.lesson04.teach.plan_questions:
    title: Vragen naar plannen
    gloss: Wat doe je morgen? Wat wil je doen? En jij?
    note: Vraag naar een plan met de tegenwoordige tijd en een tijdswoord. Vraag naar een voornemen met *می‌خوای ... کنی؟*.
    example_gloss:
    - Wat doe je in het weekend?
    - Wat wil je volgend jaar doen?
    - Ik begin met de les; en jij?
  fa.a2.unit27.lesson04.teach.answer_mirrors_question:
    title: Het antwoord spiegelt de vraag
    gloss: jij doet → ik doe; jij wilt doen → ik wil doen
    note: 'Beantwoord een vraag over een plan met de tegenwoordige tijd en hetzelfde tijdswoord: *فردا جعبه می‌خرم*. Beantwoord een vraag over een voornemen met *می‌خوام* en een kort werkwoord waarvan de uitgang van „jij” naar „ik” verandert: *می‌خوای چیکار کنی؟* wordt *می‌خوام ... کنم*.'
  fa.a2.unit27.lesson05.teach.reading_words:
    title: Woorden voor een bericht
    gloss: hallo, werk, ik ga niet, reis
    note: '*نمی‌رم* is de ontkenning van *می‌رم*: „ik ga niet”. *برم سفر* betekent „op reis gaan”.'
    example_gloss:
    - Hallo Sara!
    - Ik ga elke dag naar mijn werk.
    - Morgen ga ik niet naar les.
    - Volgend jaar ga ik op reis.
  fa.a2.unit27.lesson05.teach.reading:
    title: Een bericht van Nima
    gloss: Hallo Sara! Ik ga elke dag naar mijn werk, maar morgen niet. Morgen koop ik dozen. Volgende maand verhuis ik. Ik heb besloten volgend jaar op reis te gaan.
    note: Lees één keer en let op de gewoonte, de plannen voor de nabije toekomst en het voornemen voor later.
  fa.a2.unit27.lesson06.teach.nice:
    title: Wat goed nieuws!
    gloss: wat fijn
    note: '*چه خوب!* is een vriendelijke reactie op iemands plannen.'
    example_gloss:
    - Wat fijn! Schrijf je je morgen in?
  fa.a2.unit27.lesson06.teach.turn01:
    title: Sara vraagt naar morgen
    gloss: 'Sara vraagt aan Nima: Wat doe je morgen?'
    note: De vraag gebruikt de tegenwoordige tijd en een tijdswoord.
  fa.a2.unit27.lesson06.teach.turn02:
    title: Nima noemt twee plannen
    gloss: 'Nima: Morgen koop ik dozen. Volgende maand verhuis ik. En jij?'
    note: Twee plannen met twee tijdswoorden.
  fa.a2.unit27.lesson06.teach.turn03:
    title: Sara noemt haar plannen
    gloss: 'Sara: Morgen schrijf ik me in. Volgende week begin ik met taalles.'
    note: '*من* wordt hier genoemd om te antwoorden op *تو چی؟*.'
  fa.a2.unit27.lesson06.teach.turn04:
    title: Nima vraagt naar voornemens
    gloss: 'Nima: Wat fijn! Wat wil je volgend jaar doen?'
    note: De vraag gebruikt *می‌خوای ... کنی؟*.
  fa.a2.unit27.lesson06.teach.turn05:
    title: Sara noemt een besluit
    gloss: 'Sara: Ik heb besloten een taal te leren. En jij?'
    note: Na *تصمیم گرفتم* volgt een korte werkwoordsvorm.
  fa.a2.unit27.lesson06.teach.turn06:
    title: Nima noemt een voornemen
    gloss: 'Nima: Ik wil op reis gaan.'
    note: '*می‌خوام برم* geeft het voornemen aan.'
