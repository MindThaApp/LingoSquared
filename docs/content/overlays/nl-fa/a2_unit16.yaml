    gloss: tijd verspillen
    note: '*وقت تلف کردن* betekent letterlijk ''tijd verspilling doen'' – opnieuw een constructie met een lichtwerkwoord, zoals *باز کردن* uit de eerdere bankunit.'
    target_text: وقت تلف کردن (tijd verspillen, samengesteld werkwoord)
  fa.a2.unit16.lesson01.teach.recap_opinion_pattern:
    title: Naar mijn mening ... omdat ...
    gloss: naar mijn mening ... omdat ...
    note: Herhaling van het patroon *به نظر من ... چون ...* uit de eerdere unit over meningen, hier gebruikt voor een uitspraak over een gewoonte plus een mening.
  fa.a2.unit16.lesson02.teach.about_word:
    title: Ongeveer
    gloss: ongeveer
    note: '*حدود* staat voor een hoeveelheid en betekent ''ongeveer'' of ''circa''.'
    example_gloss: Ik had ongeveer twee uur de tijd.
  fa.a2.unit16.lesson02.teach.how_much_word:
    title: Hoeveel gebruik je elke dag sociale media?
    gloss: Hoeveel gebruik je elke dag sociale media?
    note: '*چقدر* betekent ''hoeveel''; hier gaat het om de tijd die je aan een activiteit besteedt.'
  fa.a2.unit16.lesson02.teach.my_habit_sentence:
    title: Vertel over je eigen gewoonte met een frequentie
    gloss: Ik gebruik elke dag ongeveer twee uur sociale media.
    note: Combineert *هر روز* (elke dag) met *حدود دو ساعت* (ongeveer twee uur) om een gewoonte met een duur te noemen.
  fa.a2.unit16.lesson03.teach.world_word:
    title: Wereld
    gloss: wereld
    note: '*دنیا* is het algemene woord voor de wereld.'
    example_gloss: Ik wil graag weten wat er in de wereld gebeurt.
  fa.a2.unit16.lesson03.teach.message_text:
    title: Een bericht over het online lezen van nieuws
    gloss: Hoi! Ik lees elke dag ongeveer een uur het nieuws. Naar mijn mening is het nuttig om het nieuws te lezen, want dan weet ik wat er in de wereld gebeurt.
    note: Een kort geschreven bericht met het meningspatroon *به نظر من ... چون ...*, in de losse spreektaal die mensen in berichten aan vrienden gebruiken.
  fa.a2.unit16.lesson04.teach.favorite_word:
    title: Favoriet
    gloss: favoriet
    note: '*مورد علاقه* betekent favoriet; bij *علاقه‌ام* hoort het achtervoegsel voor ''mijn''.'
    example_gloss: Mijn favoriete kleur is blauw.
  fa.a2.unit16.lesson04.teach.turn01:
    title: نیما vraagt سارا naar haar gebruik van sociale media
    gloss: نیما vraagt سارا hoeveel ze elke dag sociale media gebruikt.
    note: Herhaalt de vraag 'hoeveel' uit les 2.
  fa.a2.unit16.lesson04.teach.turn02:
    title: سارا vertelt over haar gewoonte
    gloss: سارا zegt ongeveer twee uur – haar favoriete app is Instagram.
    note: Herhaalt het patroon met *حدود* (ongeveer) uit les 2.
  fa.a2.unit16.lesson04.teach.turn03:
    title: نیما vraagt naar haar mening
    gloss: نیما vraagt of ze het nuttig vindt.
    note: '*به نظرت* (naar jouw mening) is de vorm voor ''jij'' van *به نظر من*.'
  fa.a2.unit16.lesson04.teach.turn04:
    title: سارا geeft haar mening
    gloss: سارا zegt dat het volgens haar zowel vermakelijk is als soms tijdverspilling.
    note: '*هم ... هم ...* (zowel ... als ...) verbindt twee eigenschappen van hetzelfde, hier een positieve en een negatieve.'
  fa.a2.unit16.lesson04.teach.turn05:
    title: نیما zet zijn eigen gewoonte ertegenover
    gloss: نیما zegt dat hij vooral nieuws leest, niet sociale media.
    note: '*بیشتر ..., نه ...* (vooral ..., niet ...) geeft een voorkeur aan door een tegenstelling.'
  fa.a2.unit16.lesson04.teach.turn06:
    title: سارا reageert
    gloss: 'سارا zegt: wat leuk!'
    note: 'Een korte alledaagse reactie: *چه خوب!* betekent ''wat fijn!'' of ''wat leuk!''.'
