    example_gloss: Het nieuws lezen is nuttig.
  fa.a2.unit16.lesson01.teach.news_word:
    title: Nieuws
    gloss: nieuws
    note: '*خبر* is het algemene woord voor nieuws.'
    example_gloss: Ik lees elke dag het nieuws.
