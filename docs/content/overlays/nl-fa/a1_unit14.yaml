teaching:
  fa.a1.unit14.lesson01.teach.doost_daram_phrase:
    title: ik hou van / ik vind lekker
    gloss: ik hou van
    note: دوست دارم betekent letterlijk 'ik heb vriendschap (ermee)' -- de standaardmanier om te zeggen dat je iets leuk vindt.
  fa.a1.unit14.lesson01.teach.ghahve_word:
    title: Koffie
    gloss: koffie
    note: قهوه betekent koffie.
    example_gloss: Ik hou van koffie.
  fa.a1.unit14.lesson01.teach.chay_word:
    title: Thee
    gloss: thee
    note: چای betekent thee.
    example_gloss: Ik hou niet van thee.
  fa.a1.unit14.lesson01.teach.doost_nadaram_phrase:
    title: ik hou niet van / ik vind niet lekker
    gloss: ik hou niet van
    note: دوست ندارم is de ontkenning van دوست دارم.
  fa.a1.unit14.lesson01.teach.man_word:
    title: Ik
    gloss: ik
    note: من betekent ik -- vaak weggelaten, omdat de werkwoordsuitgang al het onderwerp aangeeft, maar het kan voor nadruk worden toegevoegd.
    example_gloss: Ik hou van muziek.
  fa.a1.unit14.lesson02.teach.kodum_word:
    title: Welke
    gloss: welke
    note: کدوم betekent welke (van de twee of meer).
    example_gloss: Welke vind je leuk?
  fa.a1.unit14.lesson02.teach.moosighi_word:
    title: Muziek
    gloss: muziek
    note: موسیقی betekent muziek.
    example_gloss: Ik hou van muziek.
  fa.a1.unit14.lesson02.teach.mikhay_word:
    title: Jij wilt
    gloss: je wilt
    note: می‌خوای is de informele spreektaalvorm van می‌خواهی (je wilt), tweede persoon.
    target_text: می‌خوای (je wilt, informeel)
  fa.a1.unit14.lesson02.teach.kodum_ro_question:
    title: Welke vind je leuk?
    gloss: Welke vind je leuk?
    note: کدوم رو دوست داری؟ -- رو markeert het lijdend voorwerp (in de spreektaal, schrijftaal را), داری is de tweede persoon van داشتن (hebben).
  fa.a1.unit14.lesson03.teach.bishtar_word:
    title: Meer
    gloss: meer
    note: بیشتر betekent meer.
    example_gloss: Koffie vind ik lekkerder.
  fa.a1.unit14.lesson03.teach.ya_word:
    title: Of
    gloss: of
    note: یا betekent of en wordt gebruikt om een keuze tussen twee dingen aan te bieden.
    target_text: یا (of)
  fa.a1.unit14.lesson03.teach.ghahve_ya_chay_question:
    title: Koffie of thee?
    gloss: Koffie of thee?
    note: قهوه یا چای؟ biedt een keuze tussen de twee dranken uit les 1.
  fa.a1.unit14.lesson04.teach.choon_word:
    title: Omdat
    gloss: omdat
    note: چون leidt een reden in.
    target_text: چون (omdat)
  fa.a1.unit14.lesson04.teach.khoshmaze_word:
    title: Het is lekker
    gloss: het is lekker
    note: خوشمزه‌ست is de informele samentrekking van خوشمزه است (het is lekker).
    example_gloss: Koffie is lekker.
  fa.a1.unit14.lesson04.teach.jaleb_word:
    title: Het is interessant
    gloss: het is interessant
    note: جالبه is de informele samentrekking van جالب است (het is interessant).
    example_gloss: Deze muziek is interessant.
  fa.a1.unit14.lesson04.teach.va_word:
    title: En
    gloss: en
    note: '*و* betekent ''en'' en kan twee korte zinnen verbinden, bijvoorbeeld iets leuk vinden en het beschrijven. Het is losser dan *چون* (omdat), dat de reden direct geeft.'
    target_text: و (en)
  fa.a1.unit14.lesson05.teach.sara_name:
    title: Sara
    gloss: Sara
    note: Een veelvoorkomende Iraanse meisjesnaam.
    example_gloss: Sara houdt van thee.
  fa.a1.unit14.lesson05.teach.dareh_grammar:
    title: Hij/zij houdt van
    gloss: hij/zij houdt van
    note: داره is de informele vorm voor de derde persoon van دارد (heeft). دوست داره betekent hij/zij houdt van, net zoals het patroon دوست دارم in de eerste persoon.
    target_text: دوست داره (hij/zij houdt van, spreektaal derde persoon)
  fa.a1.unit14.lesson05.teach.nadareh_grammar:
    title: Hij/zij houdt niet van
    gloss: hij/zij houdt niet van
    note: نداره is de informele ontkennende vorm voor de derde persoon. دوست نداره betekent hij/zij houdt niet van.
    target_text: دوست نداره (hij/zij houdt niet van, spreektaal derde persoon)
  fa.a1.unit14.lesson05.teach.garme_word:
    title: Het is warm
    gloss: het is warm
    note: گرمه is de informele samentrekking van گرم است (het is warm).
    example_gloss: De thee is warm.
  fa.a1.unit14.lesson05.teach.reading_text:
    title: Voorbeeldtekst over voorkeuren
    gloss: Sara houdt van thee omdat die warm is. Sara houdt niet van muziek.
    note: Een korte tekst over een ander, met de woordenschat over voorkeuren uit deze unit.
  fa.a1.unit14.lesson06.teach.names:
    title: Nima en Sara
    gloss: Nima, Sara
    note: Veelvoorkomende Iraanse namen die in deze cursus steeds terugkomen.
    example_gloss:
    - Nima houdt van thee.
    - Sara houdt van koffie.
  fa.a1.unit14.lesson06.teach.to_chi_phrase:
    title: En jij?
    gloss: En jij?
    note: تو چی؟ is een korte, gebruikelijke manier om de vraag terug te leggen bij de ander.
  fa.a1.unit14.lesson06.teach.aalie_word:
    title: Geweldig
    gloss: geweldig
    note: عالیه is de informele samentrekking van عالی است (het is geweldig).
    example_gloss: Dit is geweldig.
  fa.a1.unit14.lesson06.teach.dialogue_line1:
    title: Nima vraagt
    gloss: Thee of koffie, wat vind je lekkerder?
  fa.a1.unit14.lesson06.teach.dialogue_line2:
    title: Sara antwoordt
    gloss: Ik vind koffie lekkerder, want die is lekker. En jij?
  fa.a1.unit14.lesson06.teach.dialogue_line3:
    title: Nima antwoordt
    gloss: Ik hou van thee omdat die warm is.
  fa.a1.unit14.lesson06.teach.dialogue_line4:
    title: Sara reageert
    gloss: Geweldig!
