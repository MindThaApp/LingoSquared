course:
  title: Farsi in het Nederlands A1
  description: 'Iraans Farsi voor beginners: zeggen wat je leuk en niet leuk vindt, naar voorkeuren vragen, kiezen tussen opties, eenvoudige redenen geven, en een korte tekst/dialoog over de voorkeuren van twee mensen.'
units:
