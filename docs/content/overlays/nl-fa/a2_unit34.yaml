teaching:
  fa.a2.unit34.lesson01.teach.reason_nouns:
    title: Woorden voor redenen
    gloss: regen, verkeer, werk, ziek, gisteren, vandaag
    note: '*بارون* is de gesproken vorm van “regen”. Dit zijn de alledaagse redenen achter excuses en veranderde plannen.'
    example_gloss:
    - Gisteren was het regenachtig.
    - Vandaag is er file.
    - Vandaag heb ik werk.
    - Gisteren had ik werk.
    - Gisteren was ik ziek.
  fa.a2.unit34.lesson01.teach.past_actions:
    title: Gevolgen
    gloss: het regende, ik ben niet gekomen, ik kom niet, ik kwam te laat aan
    note: 'Deze korte vormen zijn de resultaten die je aan een reden koppelt (verleden tijd: *نیومدم*; tegenwoordige tijd: *نمیام*). *نیومدم* is de ontkenning van *اومدم* (ik ben gekomen).'
    example_gloss:
    - Gisteren regende het.
    - Ik ben gisteren niet gekomen.
    - Ik kom vandaag niet.
    - Ik ben vandaag te laat gekomen.
  fa.a2.unit34.lesson01.teach.connectors:
    title: Drie voegwoorden
    gloss: omdat, dus / daarom, vanwege
    note: Drie manieren om een reden en een gevolg te verbinden. *چون* en *به خاطر* geven de reden aan; *برای همین* geeft het gevolg aan.
    example_gloss:
    - Omdat het regende, ben ik niet gekomen.
    - Het regende, daarom ben ik niet gekomen.
    - Ik ben vanwege de regen niet gekomen.
  fa.a2.unit34.lesson01.teach.weather_causes:
    title: Weersoorzaken
    gloss: hitte, kou
    note: Gebruik deze weerwoorden na *به خاطر* om een reden te geven.
    example_gloss:
    - Ik was ziek door de hitte.
    - Ik was ziek door de kou.
  fa.a2.unit34.lesson01.teach.everyday_causes:
    title: Alledaagse oorzaken
    gloss: vermoeidheid, slaap, overwerk, project
    note: Deze zelfstandige naamwoorden geven veelvoorkomende redenen die met vermoeidheid en werk te maken hebben.
    example_gloss:
    - Ik kwam te laat door vermoeidheid.
    - Ik kwam te laat door slaap.
    - Ik moest overwerken vanwege het project.
  fa.a2.unit34.lesson01.teach.chon:
    title: چون leidt de reden in
    gloss: Omdat het regende, ben ik niet gekomen.
    note: '*چون* + een volledige zin (met een eigen werkwoord) geeft de reden, en het gevolg komt na de komma: *چون بارون اومد، نیومدم*.'
  fa.a2.unit34.lesson01.teach.baraye_hamin:
    title: برای همین leidt het gevolg in
    gloss: Het regende, daarom ben ik niet gekomen.
    note: 'Noem eerst de reden als aparte zin, daarna *برای همین* + het gevolg: *بارون اومد، برای همین نیومدم*. Het betekent “daarom”.'
  fa.a2.unit34.lesson02.teach.plan_changes:
    title: Excuses en veranderde plannen
    gloss: mijn auto had pech, ik ben niet naar mijn werk gegaan, ik kon niet komen, we hebben onze afspraak verzet
    note: '*قرار* is een afspraak of een afgesproken plan. *سر کار نرفتم* = “ik ben niet naar mijn werk gegaan”. *نتونستم بیام* = “ik kon niet komen”.'
    example_gloss:
    - Mijn auto had pech.
    - Ik ben gisteren niet naar mijn werk gegaan.
    - Ik kon vandaag niet komen.
    - We hebben onze afspraak verzet.
  fa.a2.unit34.lesson02.teach.khater:
    title: به خاطر + zelfstandig naamwoord
    gloss: Ik ben vanwege de regen niet gekomen.
    note: '*به خاطر* wordt gevolgd door een zelfstandig naamwoord, zonder eigen werkwoord: *به خاطر بارون*, *به خاطر ترافیک*, *به خاطر کار*. De rest van de zin geeft het gevolg: *به خاطر ترافیک دیر رسیدم*.'
  fa.a2.unit34.lesson02.teach.khater_vs_chon:
    title: Dezelfde betekenis, twee vormen
    gloss: vanwege het verkeer = omdat er files waren
    note: '*به خاطر ترافیک* en *چون ترافیک بود* geven dezelfde reden. Gebruik *به خاطر* als de reden slechts een zelfstandig naamwoord is, en *چون* als je een hele zin zegt.'
  fa.a2.unit34.lesson03.teach.order:
    title: Eerst de reden of eerst het gevolg
    gloss: Omdat ik werk had, ben ik niet gekomen / Ik had werk, daarom ben ik niet gekomen
    note: Bij *چون* opent de redenzin de zin en sluit het gevolg hem af. Bij *برای همین* is de reden eerst een aparte zin en komt het gevolg na *برای همین*. In beide gevallen wordt de reden vóór het gevolg genoemd.
  fa.a2.unit34.lesson03.teach.clause_vs_noun:
    title: Zin of zelfstandig naamwoord
    gloss: چون + zin, به خاطر + zelfstandig naamwoord
    note: Na *چون* heb je een werkwoord nodig (*بارون اومد*, *ترافیک بود*). Na *به خاطر* gebruik je alleen een zelfstandig naamwoord (*بارون*, *ترافیک*). Zeg niet *به خاطر بارون اومد* voor “omdat het regende”.
  fa.a2.unit34.lesson03.teach.one_connector:
    title: Eén voegwoord per verbinding
    gloss: Combineer چون en برای همین niet in één verbinding
    note: Gebruik óf *چون ... ،* óf *... ، برای همین ...* voor één reden en één gevolg. Als je beide in dezelfde verbinding zegt, herhaal je de betekenis en klinkt het fout.
  fa.a2.unit34.lesson04.teach.excuse_questions:
    title: Vragen waarom
    gloss: waarom, sorry, je bent aangekomen, je bent niet gekomen, en
    note: '*چرا* vraagt naar een reden. *ببخشید* opent een verontschuldiging. *و* verbindt twee feiten.'
    example_gloss:
    - Waarom ben je gisteren niet gekomen?
    - Waarom kwam je te laat?
    - Sorry, ik kwam te laat.
    - Het regende en er was files.
  fa.a2.unit34.lesson04.teach.answer_chon:
    title: Antwoorden op چرا
    gloss: Een antwoord op چرا begint met چون
    note: 'Het natuurlijke antwoord op *چرا* begint met *چون* en geeft alleen de reden: *چون ترافیک بود*. Voeg het gevolg toe met een tweede zin als je wilt.'
  fa.a2.unit34.lesson05.teach.message:
    title: Een bericht over een gemiste afspraak
    gloss: Hoi Sara. Gisteren kon ik niet komen, omdat mijn auto pech had. Door de regen was er ook files. Vandaag ben ik ziek, daarom heb ik onze afspraak verzet.
    note: Lees eerst één keer voor de drie redenen en dan nog een keer voor wat daaruit volgde.
  fa.a2.unit34.lesson06.teach.dialogue_words:
    title: Woorden voor het gesprek
    gloss: wij, ja, nou, nee, we hadden een afspraak, kom je, ik kom, ik kom niet
    note: '*آره* is de spreektaalvorm van “ja”. *میای؟* betekent “kom je?”; de antwoorden zijn *میام* en *نمیام*.'
    example_gloss:
    - We hadden gisteren een afspraak.
    - Ja, ik kom.
    - Nou, kom je vandaag?
    - Nee, ik kom vandaag niet.
  fa.a2.unit34.lesson06.teach.turn01:
    title: Sara vraagt waarom
    gloss: 'Sara vraagt aan Nima: Nima, waarom ben je gisteren niet gekomen?'
    note: De vraag *چرا* vraagt naar een reden.
  fa.a2.unit34.lesson06.teach.turn02:
    title: Nima geeft de reden
    gloss: 'Nima: Omdat het regende.'
    note: Een kort antwoord op *چرا* begint met *چون*.
  fa.a2.unit34.lesson06.teach.turn03:
    title: Sara herinnert hem eraan
    gloss: 'Sara: Maar we hadden een afspraak.'
    note: '*قرار داشتیم* betekent “we hadden een afspraak”.'
  fa.a2.unit34.lesson06.teach.turn04:
    title: Nima legt het gevolg uit
    gloss: 'Nima: Ja, het regende en er waren files, daarom kon ik niet komen.'
    note: Twee redenen worden met *و* verbonden, daarna geeft *برای همین* het gevolg.
  fa.a2.unit34.lesson06.teach.turn05:
    title: Sara vraagt naar vandaag
    gloss: 'Sara: Nou, kom je vandaag?'
    note: Een vraag in de tegenwoordige tijd over het plan.
  fa.a2.unit34.lesson06.teach.turn06:
    title: Nima geeft een reden voor nu
    gloss: 'Nima: Nee, omdat ik vandaag werk heb, kom ik niet.'
    note: Een reden in de tegenwoordige tijd met *چون*, daarna het gevolg.
