teaching:
  fa.a2.unit40.lesson01.teach.things:
    title: Dagelijkse spullen
    gloss: boek, tas, sleutel, telefoon, horloge
    note: '*ساعت* betekent zowel “horloge” als “uur” (bij de tijd); de zin laat zien welke betekenis bedoeld is.'
    example_gloss:
    - Ik heb een boek.
    - Ik heb een tas.
    - Ik heb een sleutel.
    - Ik heb een telefoon.
    - Ik heb een horloge.
  fa.a2.unit40.lesson01.teach.verbs:
    title: Gekocht, verloren, gevonden
    gloss: ik kocht, ik verloor, ik vond
    note: 'Alle drie zijn verleden tijd, eerste persoon enkelvoud. *گم کردم* en *پیدا کردم* zijn werkwoorden van twee woorden: eerst komt het zelfstandig naamwoord.'
    example_gloss:
    - Gisteren heb ik een boek gekocht.
    - Gisteren heb ik een sleutel verloren.
    - Gisteren heb ik een telefoon gevonden.
  fa.a2.unit40.lesson01.teach.rel1:
    title: 'Zelfstandig naamwoord + ی + که: “de ... die/dat ...”'
    gloss: het boek dat ik gekocht heb; de tas die ik verloren ben; de sleutel die ik gevonden heb
    note: 'Om aan te geven welk ding je bedoelt, voeg je *ی* toe aan het zelfstandig naamwoord, gevolgd door *که* en een korte bijzin: *کتاب* + *ی* + *که خریدم*. De hele groep werkt als één zelfstandig naamwoord. Let op: in de bijzin staat geen extra voornaamwoord dat naar het ding verwijst (zoals een “het” achteraan): je zegt *کتابی که خریدم*, letterlijk “het boek dat ik kocht”, zonder extra woord aan het eind.'
  fa.a2.unit40.lesson01.teach.rel2:
    title: De groep is het onderwerp van de zin
    gloss: Het boek dat ik gekocht heb, is goed; de tas die ik verloren ben, was klein
    note: 'De groep *کتابی که خریدم* kan, net als elk zelfstandig naamwoord, aan het begin van een zin staan. Daarna volgt het werkwoord of het bijvoeglijk naamwoord: *کتابی که خریدم خوبه*.'
  fa.a2.unit40.lesson02.teach.people:
    title: Mensen op het werk
    gloss: collega, manager, klant, man, mevrouw
    note: '*همکارم* is “mijn collega”. *خانم* is ook het beleefde woord voor “mevrouw”.'
    example_gloss:
    - Mijn collega is hier.
    - De manager is daar.
    - De klant is hier.
    - Die man is daar.
    - Die mevrouw is hier.
  fa.a2.unit40.lesson02.teach.verbs:
    title: Werkt, zit, belde
    gloss: hij/zij werkt, zit, belde
    note: '*نشسته* betekent “zit” (een toestand). *زنگ زد* is “belde (telefonisch)”.'
    example_gloss:
    - Mijn collega werkt bij een bank.
    - De manager zit daar.
    - De klant heeft gisteren gebeld.
  fa.a2.unit40.lesson02.teach.rel_subject:
    title: 'Wie: hetzelfde patroon voor mensen'
    gloss: de man die daar zit; de collega die bij de bank werkt; de klant die gebeld heeft
    note: Voor personen gebruikt het Perzisch dezelfde *که* als voor dingen; er is geen apart woord voor “die” bij personen. De persoon is degene die de handeling in de bijzin uitvoert.
  fa.a2.unit40.lesson02.teach.rel_spelling:
    title: Spelling van ی na ه en ی
    gloss: 'na een medeklinker: ی; na een stomme ه of een eind-ی: ‌ای'
    note: 'Na een medeklinker is het einde *ی* (*کتابی*). Na een stomme *ه* of na *ی* schrijf je *ای* met een klein tussenruimpje: *خونه‌ای*, *مشتری‌ای*. In het gesproken Perzisch hoor je dezelfde “i”-klank.'
  fa.a2.unit40.lesson03.teach.which:
    title: Welke, die, precies die
    gloss: welke, die, precies die
    note: '*کدوم؟* vraagt “welke?”. *اون* wijst naar iets aan; *همون* betekent “precies die”.'
    example_gloss:
    - Welk boek?
    - Dat boek is goed.
    - Precies dat boek is hier.
  fa.a2.unit40.lesson03.teach.answer:
    title: Antwoord op “welke?” met een relatieve groep
    gloss: Welke tas? De tas die ik verloren ben.
    note: 'Het makkelijkste antwoord op *کدوم؟* is een relatieve groep. Je kunt er *اون* of *همون* voor zetten: *همون کیفی که گم کردم* (precies de tas die ik verloren ben).'
  fa.a2.unit40.lesson03.teach.time:
    title: Meer woorden in de groep
    gloss: het boek dat ik gisteren gekocht heb; het horloge dat ik vandaag gevonden heb
    note: 'De bijzin kan meer woorden bevatten (een tijdwoord, een plaats) vóór het werkwoord. Het werkwoord staat nog steeds achteraan: *کتابی که دیروز خریدم*.'
  fa.a2.unit40.lesson04.teach.lost_things:
    title: Dingen die mensen kwijtraken
    gloss: bril, portemonnee, kleur
    note: '*کیف پول* is “portemonnee”: *کیف* (tas) + *پول* (geld).'
    example_gloss:
    - Mijn bril is hier.
    - Mijn portemonnee is daar.
    - Deze kleur is mooi.
  fa.a2.unit40.lesson04.teach.colours:
    title: Kleuren en “welke kleur?”
    gloss: zwart, rood, blauw, wat/welk
    note: '*چه رنگیه؟* vraagt “welke kleur is het?”.'
    example_gloss:
    - Mijn tas is zwart.
    - Mijn bril is rood.
    - Mijn telefoon is blauw.
    - Welke kleur heeft je tas?
  fa.a2.unit40.lesson04.teach.describe:
    title: Beschrijven wat je kwijt bent
    gloss: Welke kleur heeft de tas die u kwijt bent? De tas die ik kwijt ben, is zwart.
    note: 'Bij gevonden voorwerpen vraagt een medewerker met een relatieve groep naar het ding, en jij antwoordt met een andere groep of alleen met de kleur: *سیاهه*. De medewerker gebruikt *شما* (*گم کردید*).'
  fa.a2.unit40.lesson05.teach.reading:
    title: Een verloren tas
    gloss: 'Sara heeft gisteren haar tas verloren. De tas die ze verloren heeft, was zwart. In de tas zaten een telefoon en een sleutel. Vandaag is Sara naar het kantoor voor gevonden voorwerpen gegaan. De medewerker die daar werkt, zei: “De tas die we gevonden hebben, is zwart.” Sara was blij.'
    note: Lees eerst om te begrijpen wat er gebeurt, en lees daarna nog eens voor de groepen met *که*.
  fa.a2.unit40.lesson06.teach.turn01:
    title: Nima meldt een verloren tas
    gloss: 'Nima: Pardon, ik ben mijn tas kwijt.'
    note: '*گم کردم* is “ik ben kwijt” (“ik verloor”).'
  fa.a2.unit40.lesson06.teach.turn02:
    title: De medewerker vraagt om een beschrijving
    gloss: 'Medewerker: Welke kleur heeft de tas die u kwijt bent?'
    note: 'De medewerker gebruikt *شما*: *گم کردید*.'
  fa.a2.unit40.lesson06.teach.turn03:
    title: Nima antwoordt
    gloss: 'Nima: Hij is zwart.'
    note: Een kort antwoord is genoeg.
  fa.a2.unit40.lesson06.teach.turn04:
    title: De medewerker vraagt welke
    gloss: 'Medewerker: Welke tas? Degene die klein is?'
    note: '*اونی که کوچیکه* is “degene die klein is”: *اونی* vervangt het zelfstandig naamwoord.'
  fa.a2.unit40.lesson06.teach.turn05:
    title: Nima bevestigt
    gloss: 'Nima: Ja, precies die tas die klein is.'
    note: '*همون کیفی که کوچیکه* herhaalt de beschrijving.'
  fa.a2.unit40.lesson06.teach.turn06:
    title: De medewerker wijst naar een collega
    gloss: 'Medewerker: De collega die daar zit, heeft de tas gevonden. De tas die hij gevonden heeft, is zwart.'
    note: '*پیدا کرده* is de voltooide tijd “heeft gevonden”.'
