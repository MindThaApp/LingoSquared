teaching:
  fa.a2.unit47.lesson01.teach.now:
    title: Op dit moment
    gloss: nu, precies nu, boek, wat doe je
    note: '*الان* is “nu”; *همین الان* is “op dit moment, precies nu”.'
    example_gloss:
    - Nu lees ik een boek.
    - Op dit moment lees ik een boek.
    - Wat doe je nu?
  fa.a2.unit47.lesson01.teach.persons:
    title: Er middenin zitten
    gloss: ik ben bezig (met), jij bent, hij / zij is, wij zijn, jullie zijn, zij zijn
    note: Zet *دارم* (of *داری, داره …*) voor het presens. Het zegt dat je op dit moment midden in de handeling zit.
    example_gloss:
    - Ik ben een boek aan het lezen.
    - Jij bent een boek aan het lezen.
    - Hij / zij is een boek aan het lezen.
    - Wij zijn een boek aan het lezen.
    - Jullie zijn een boek aan het lezen.
    - Zij zijn een boek aan het lezen.
  fa.a2.unit47.lesson01.teach.verbs:
    title: Het presens van خوندن
    gloss: ik lees, jij leest, hij / zij leest, wij lezen, jullie lezen, zij lezen
    note: 'Beide delen van de progressieve vorm krijgen dezelfde persoon: *دارم … می‌خونم*, *داری … می‌خونی*.'
    example_gloss:
    - Ik lees elke dag.
    - Jij leest elke dag.
    - Hij / zij leest elke dag.
    - Wij lezen elke dag.
    - Jullie lezen elke dag.
    - Zij lezen elke dag.
  fa.a2.unit47.lesson01.teach.shape:
    title: دارم plus het presens
    gloss: Ik ben een boek aan het lezen; hij is een boek aan het lezen
    note: 'Neem het gesproken presens (*می‌خونم*) en zet *دارم* ervoor. Verander beide naar de juiste persoon: *دارم … می‌خونم*, *داره … می‌خونه*. Het object staat ertussen.'
  fa.a2.unit47.lesson02.teach.habit:
    title: Woorden voor gewoontes
    gloss: elke, dag, 's avonds, werk
    note: '*هر روز* en *شب‌ها* laten zien dat de handeling een gewoonte is en niet nu gebeurt.'
    example_gloss:
    - Ik werk elke dag.
    - '''s Avonds lees ik boeken.'
  fa.a2.unit47.lesson02.teach.work:
    title: Werken
    gloss: ik werk, ik ben aan het werk
    note: '*کار می‌کنم* kan een gewoonte zijn (“ik werk”); *دارم کار می‌کنم* zegt dat je op dit moment aan het werk bent.'
    example_gloss:
    - Op dit moment ben ik aan het werk.
    - Ik werk elke dag.
  fa.a2.unit47.lesson02.teach.contrast:
    title: Gewoonte of nu
    gloss: Ik werk elke dag; nu ben ik aan het werk
    note: Het gewone presens (*کار می‌کنم*) gebruik je voor gewoontes en feiten. Met *دارم* zegt hetzelfde werkwoord dat je er nu middenin zit. In gesproken taal kan het gewone presens ook voor nu gebruikt worden, maar met *دارم* is het duidelijker.
  fa.a2.unit47.lesson02.teach.negative:
    title: Zeggen dat je iets niet doet
    gloss: Ik lees nu geen boek
    note: 'Voor een ontkenning gebruik je *دارم* niet. Gebruik het gewone ontkennende presens: *الان کتاب نمی‌خونم*.'
    example_gloss:
    - Ik lees nu geen boek.
  fa.a2.unit47.lesson03.teach.things:
    title: Woorden voor het huishouden
    gloss: de kleren, de afwas (de vaat), stofzuigen/vegen (bezem), het avondeten
    note: '*لباس‌ها* en *ظرف‌ها* zijn meervoudige zelfstandige naamwoorden; met *رو* zijn het de dingen die gewassen worden.'
    example_gloss:
    - Ik was nu de kleren.
    - Ik doe nu de afwas.
    - Ik ben nu aan het vegen.
    - Ik kook nu het avondeten.
  fa.a2.unit47.lesson03.teach.verbs:
    title: Werkwoorden voor het huishouden
    gloss: ik was, ik veeg, ik maak
    note: '*شستن* wordt *می‌شورم*; *جارو کردن* en *درست کردن* zijn combinaties van een zelfstandig naamwoord en een werkwoord.'
    example_gloss:
    - Ik ben de kleren aan het wassen.
    - Ik ben aan het vegen.
    - Ik ben het avondeten aan het maken.
  fa.a2.unit47.lesson03.teach.others:
    title: Iemand anders
    gloss: Nima, hij/zij wast, hij/zij doet
    note: 'Bij een andere persoon verander je zowel *دارم* als het werkwoord: *داره … می‌شوره*.'
    example_gloss:
    - Nima is de afwas aan het doen.
    - Nima is aan het vegen.
  fa.a2.unit47.lesson03.teach.rule:
    title: Het lijdend voorwerp tussen de twee delen
    gloss: Ik doe de afwas; Nima doet de afwas
    note: Het lijdend voorwerp met *رو* staat tussen *دارم* en het werkwoord. Bij een combinatie van zelfstandig naamwoord en werkwoord zoals *جارو می‌کنم* staat *دارم* vóór de hele combinatie.
  fa.a2.unit47.lesson04.teach.calls:
    title: Een telefoongesprek beginnen
    gloss: hallo (aan de telefoon), waar ben je, wat doe je
    note: '*الو* zeg je om een telefoontje op te nemen of te beginnen.'
    example_gloss:
    - Hallo, waar ben je?
    - Hallo, wat ben je nu aan het doen?
  fa.a2.unit47.lesson04.teach.arrive:
    title: Onderweg
    gloss: ik kom eraan, ik ben bijna daar
    note: '*دارم میام* betekent „ik ben onderweg”; *دارم می‌رسم* betekent „ik kom net aan”.'
    example_gloss:
    - Ik kom eraan.
    - Ik kom net aan.
  fa.a2.unit47.lesson04.teach.talk:
    title: Praten en bellen
    gloss: met, mijn moeder, praten, ik praat, bellen, hij/zij belt
    note: '*حرف زدن* is „praten” en *زنگ زدن* is „bellen”.'
    example_gloss:
    - Ik praat met mijn moeder.
    - Mijn moeder belt.
  fa.a2.unit47.lesson04.teach.rule:
    title: De duurvorm aan de telefoon
    gloss: Ik kom eraan; ik praat met mijn moeder
    note: 'In telefoongesprekken komt de duurvorm veel voor: je vertelt de ander waar je mee bezig bent. *میام* is de gewone gesproken vorm van „ik kom”; *دارم میام* zegt dat je onderweg bent.'
  fa.a2.unit47.lesson05.teach.words:
    title: Woorden voor de tekst
    gloss: het is avond/nacht, iedereen, we zijn thuis, de kinderen, tv, ze kijken, ook
    note: '*شبه* betekent „het is nacht”; *خونه‌ایم* betekent „we zijn thuis”.'
    example_gloss:
    - Het is nu nacht en we zijn allemaal thuis.
    - De kinderen kijken tv.
    - Mijn moeder belt ook.
  fa.a2.unit47.lesson05.teach.reading:
    title: Een avond thuis
    gloss: Het is nu nacht en we zijn allemaal thuis. Ik maak het avondeten. Nima doet de afwas. De kinderen kijken tv. Mijn moeder belt ook.
    note: Lees de tekst eerst om te zien wie wat doet, en daarna nog een keer voor de werkwoordsvormen met *دارم, داره, دارن*.
  fa.a2.unit47.lesson06.teach.turn01:
    title: Sara belt Nima
    gloss: 'Sara: Hallo Nima, waar ben je?'
    note: '*کجایی؟* vraagt waar je bent.'
  fa.a2.unit47.lesson06.teach.turn02:
    title: Nima is onderweg
    gloss: 'Nima: Ik kom eraan. Wat doe jij?'
    note: '*دارم میام* zegt dat hij onderweg is.'
  fa.a2.unit47.lesson06.teach.turn03:
    title: Sara kookt
    gloss: 'Sara: Ik maak het avondeten.'
    note: '*دارم … درست می‌کنم* is de duurvorm.'
  fa.a2.unit47.lesson06.teach.turn04:
    title: Nima vraagt naar de kinderen
    gloss: 'Nima: En de kinderen?'
    note: Een korte vraag die het onderwerp oppakt.
  fa.a2.unit47.lesson06.teach.turn05:
    title: Sara antwoordt
    gloss: 'Sara: Ze kijken tv.'
    note: '*دارن … می‌بینن* is de vorm voor „zij” (meervoud).'
  fa.a2.unit47.lesson06.teach.turn06:
    title: Nima komt aan
    gloss: 'Nima: Goed. Ik kom net aan.'
    note: '*دارم می‌رسم* zegt dat hij er bijna is.'
