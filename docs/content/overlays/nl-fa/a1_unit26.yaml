    title: Mijn hond
    gloss: mijn hond
    note: '*سگم* combineert *سگ* met het bezittelijke achtervoegsel *-م* -- ''mijn hond'', hetzelfde vastgeplakte patroon als *اسمم* in Unit 2.'
