  fa.a1.unit26.lesson02.teach.mahi_word:
    title: Vis
    gloss: vis
    note: '*ماهی* betekent vis.'
    example_gloss: Ik heb een vis.
  fa.a1.unit26.lesson02.teach.dari_review:
    title: Jij hebt
    gloss: jij hebt
    note: '*داری* komt hier terug, in dezelfde informele vorm voor ''jij''.'
  fa.a1.unit26.lesson02.teach.have_a_pet_question:
    title: Heb jij een huisdier?
    gloss: heb jij een huisdier?
    note: '*حیوان خونگی داری؟* combineert *حیوان خونگی* uit les 1 met *داری* -- de natuurlijke manier om iemand te vragen of hij of zij een huisdier heeft.'
  fa.a1.unit26.lesson02.teach.are_review:
    title: Jawel
    gloss: jawel
    note: '*آره* is het alledaagse, informele woord voor ''ja''.'
  fa.a1.unit26.lesson03.teach.esm_review:
    title: Naam
    gloss: naam
    note: '*اسم* gebruik je op dezelfde manier voor de naam van een huisdier.'
  fa.a1.unit26.lesson03.teach.esmesh_chiye_phrase:
    title: Hoe heet het?
    gloss: hoe heet het?
    note: '*اسمش چیه؟* combineert het bezittelijke achtervoegsel *-ش* (al gezien in *قدش*/*موهاش* in Unit 25) met *چیه؟* uit Unit 2 -- ''hoe heet hij/zij/het?'''
  fa.a1.unit26.lesson03.teach.ghaza_word:
