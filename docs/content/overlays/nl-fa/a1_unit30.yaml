course:
  title: Farsi in het Nederlands A1
  description: 'Farsi (Iran) voor beginners: woorden rond universiteit en studie (universiteit, student, les/vak, taal), vertellen welk vak je studeert of leert (wiskunde, een studierichting, Engels als vak), vragen en vertellen waar je studeert (*کجا درس می‌خونی؟*) en hoe vaak je gaat, een leestekst over de studies van *نیما* en *سارا*, en een slotdialoog tussen *نیما* en *سارا* over hun vakken en wat ze ervan vinden (moeilijk maar interessant).'
