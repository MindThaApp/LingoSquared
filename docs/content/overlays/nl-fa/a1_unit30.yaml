    note: '*آره* (''ja'') komt hier terug.'
    target_text: آره (ja)
  fa.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, wat studeer jij?'
    gloss: Sara, wat studeer jij?
  fa.a1.unit30.lesson04.teach.dialogue_line2:
