  fa.a1.unit30.lesson01.teach.daneshgah_word:
    title: Universiteit
    gloss: universiteit
    note: '*دانشگاه* is het standaardwoord voor ''universiteit'' in het dagelijks gebruik.'
    example_gloss: Deze universiteit is goed.
  fa.a1.unit30.lesson01.teach.daneshjoo_word:
    title: Student
    gloss: student
    note: '*دانشجو* betekent ''universiteitsstudent''. In *من دانشجو هستم* (''ik ben student'') gebruik je de gewone vorm *هستم*.'
    example_gloss: Ik ben student.
  fa.a1.unit30.lesson01.teach.dars_word:
    title: Les / vak
    gloss: les / vak
    note: '*درس* betekent zowel ''les'' als, breder, ''vak'' (iets wat je studeert).'
    example_gloss: Dit vak is interessant.
  fa.a1.unit30.lesson01.teach.zaban_word:
    title: Taal
    gloss: taal
    note: '*زبان* is het standaardwoord voor ''taal''.'
    example_gloss: Perzisch is een taal.
  fa.a1.unit30.lesson01.teach.review_man_in:
    title: Ik / dit
    gloss: ik / dit
    note: '*من* en *این* komen hier terug om over je studie te praten.'
    target_text: من (ik) / این (dit)
  fa.a1.unit30.lesson01.teach.review_dar:
    title: In / op
    gloss: in / aan
    note: '*در* betekent ''in'' of ''aan'' en wordt hier gebruikt voor ''aan de universiteit''.'
    target_text: در (in / op / aan)
  fa.a1.unit30.lesson01.teach.mikhonam_pattern:
    title: Studeren/lezen + ik = ik studeer/lees
    gloss: studeren/lezen + ik = ik studeer/lees
    note: '*خوندن* (''lezen'' of ''studeren'', zoals in *کتاب خوندن*) krijgt dezelfde uitgang *-م* in de tegenwoordige tijd als *می‌کنم*, dus *می‌خونم*: ''ik studeer'' of ''ik lees''.'
    target_text: خوندن (studeren/lezen) + م = می‌خونم (ik studeer/lees)
  fa.a1.unit30.lesson01.teach.combined_sentence:
    title: Ik studeer aan de universiteit
    gloss: Ik studeer aan de universiteit
    note: '*من در دانشگاه درس می‌خونم* bestaat uit *من* + *در* + *دانشگاه* + *درس* + *می‌خونم*.'
  fa.a1.unit30.lesson02.teach.riazi_word:
    title: Wiskunde
    gloss: wiskunde
    note: '*ریاضی* is het standaardwoord voor ''wiskunde''.'
    example_gloss: Wiskunde is interessant.
  fa.a1.unit30.lesson02.teach.reshte_word:
    title: Studierichting
    gloss: studierichting
    note: '*رشته* betekent een studierichting aan de universiteit. In *رشته‌ی من* (''mijn studierichting'') verbindt de extra *ی* het zelfstandig naamwoord met *من*.'
    example_gloss: Mijn studierichting is taal.
  fa.a1.unit30.lesson02.teach.review_engelisi:
    title: Engels
    gloss: Engels
    note: '*انگلیسی* (''Engels'') komt hier terug als naam van een vak dat je kunt studeren.'
    target_text: انگلیسی (Engels)
  fa.a1.unit30.lesson02.teach.yad_migiram_pattern:
    title: Leren + ik = ik leer
    gloss: leren + ik = ik leer
    note: '*یاد گرفتن* betekent ''leren''. De tegenwoordige tijd *یاد می‌گیرم* gebruikt hetzelfde werkwoord *گرفتن* als *عکس می‌گیرم* (''ik maak een foto''), maar dan met een andere betekenis.'
    target_text: یاد گرفتن (leren) + م = یاد می‌گیرم (ik leer)
  fa.a1.unit30.lesson02.teach.mikhoni_pattern:
    title: Jij studeert/leest (informeel)
    gloss: jij studeert / jij leest (informeel)
    note: '*می‌خونی* is de informele vorm voor ''jij'' van *می‌خونم*, die je gebruikt om iemand direct iets te vragen.'
    target_text: می‌خونی (jij studeert/leest, informeel)
  fa.a1.unit30.lesson02.teach.review_chi:
    title: Wat
    gloss: wat
    note: '*چی* (''wat'') komt hier terug.'
    target_text: چی (wat)
  fa.a1.unit30.lesson02.teach.question_what_study:
    title: Wat studeer jij?
    gloss: Wat studeer jij?
    note: '*چی درس می‌خونی؟* zet alle onderdelen uit deze les op een rij.'
  fa.a1.unit30.lesson02.teach.answer_major:
    title: Mijn studierichting is wiskunde. Ik leer ook Engels.
    gloss: Mijn studierichting is wiskunde. Ik leer ook Engels.
    note: '*رشته‌ی من ریاضیه. زبان انگلیسی رو هم یاد می‌گیرم* noemt je studierichting en een extra vak, met het lijdend-voorwerpwoord *رو* en *هم* (''ook'').'
  fa.a1.unit30.lesson03.teach.review_koja:
    title: Waar
    gloss: waar
    note: '*کجا* (''waar'') kun je als vraagwoord zelfstandig gebruiken, en ook in vragen zoals *کجاست؟*.'
    target_text: کجا (waar)
  fa.a1.unit30.lesson03.teach.question_where_study:
    title: Waar studeer je?
    gloss: Waar studeer je?
    note: '*کجا درس می‌خونی؟* vraagt waar iemand studeert.'
  fa.a1.unit30.lesson03.teach.review_be:
    title: Naar
    gloss: naar
    note: '*به* (''naar'') komt hier terug voor ''naar de universiteit''.'
    target_text: به (naar)
  fa.a1.unit30.lesson03.teach.review_miram:
    title: Ik ga
    gloss: ik ga
    note: '*می‌رم* (''ik ga'') komt hier terug voor naar de universiteit gaan.'
    target_text: می‌رم (ik ga)
  fa.a1.unit30.lesson03.teach.review_har_ruz:
    title: Elke dag
    gloss: elke dag
    note: '*هر روز* (''elke dag'') komt hier terug.'
    target_text: هر روز (elke dag)
