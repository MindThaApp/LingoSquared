    title: 'Nima: Ja, het is moeilijk, maar wel interessant.'
    gloss: Ja, het is moeilijk, maar wel interessant.
  fa.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Sara: Wat leuk!'
    gloss: Wat leuk!
  fa.a1.unit30.lesson05.teach.review_mikhone:
    title: Hij/zij studeert/leest
    gloss: hij/zij studeert
    note: '*می‌خونه* is de informele vorm voor de derde persoon van *می‌خونم*. Je hebt hem nodig om in deze tekst over نیما en سارا te praten.'
    target_text: می‌خونه (hij/zij studeert/leest)
  fa.a1.unit30.lesson05.teach.review_mire:
    title: Hij/zij gaat
    gloss: hij/zij gaat
    note: '*می‌ره* is de informele vorm voor de derde persoon van *می‌رم* (''ik ga'').'
    target_text: می‌ره (hij/zij gaat)
  fa.a1.unit30.lesson05.teach.review_oo:
    title: Hij / zij
    gloss: hij / zij
    note: '*او* is het persoonlijk voornaamwoord van de derde persoon.'
    target_text: او (hij/zij)
  fa.a1.unit30.lesson05.teach.review_nima:
    title: Nima
    gloss: Nima
    note: '*نیما* is een van de twee vrienden die je in deze dialogen steeds tegenkomt.'
  fa.a1.unit30.lesson05.teach.reading_text:
    title: 'Lezen: de studies van Nima en Sara'
    gloss: Nima studeert wiskunde aan de universiteit. Wiskunde is moeilijk, maar interessant. Sara studeert Engels. Zij gaat elke dag naar de universiteit.
    note: Deze tekst vertelt de dialoog opnieuw in de derde persoon. Er zijn bijna geen nieuwe woorden, dus je oefent vooral met het herkennen van woorden in een doorlopende tekst.
  fa.a1.unit30.lesson06.teach.review_dooset_daram_vaght:
    title: Ik vind leuk / tijd / ik heb geen
    gloss: ik vind leuk / tijd / ik heb niet
    note: '*دوست دارم*, *وقت* en *ندارم* vormen hier samen een natuurlijke zin over een voorkeur met een beperking, in de context van studeren.'
    target_text: دوست دارم (ik hou van / ik vind leuk) / وقت (tijd) / ندارم (ik heb niet)
  fa.a1.unit30.lesson06.teach.review_gahi:
    title: Soms
    gloss: soms
    note: '*گاهی* (''soms'') komt hier opnieuw voor.'
    target_text: گاهی (soms)
  fa.a1.unit30.lesson06.teach.wrap_summary:
    title: Ik vind studeren leuk, maar soms is het moeilijk
    gloss: Ik vind studeren leuk, maar soms is het moeilijk
    note: '*درس رو دوست دارم ولی گاهی سخته* combineert een voorkeur met een beperking via *ولی*.'
