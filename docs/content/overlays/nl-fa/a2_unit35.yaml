teaching:
  fa.a2.unit35.lesson01.teach.connectors:
    title: Drie tijdsverbindingen
    gloss: voordat, nadat, toen/als
    note: '*قبل از اینکه* betekent “voordat”, *بعد از اینکه* betekent “nadat” en *وقتی* betekent “toen” of “als”. Elk van deze woorden begint een bijzin die zegt wanneer iets gebeurt.'
    example_gloss:
    - Voordat ik wegga, doe ik de deur dicht.
    - Nadat ik was aangekomen, belde ik Sara.
    - Toen ik aankwam, belde ik Sara.
  fa.a2.unit35.lesson01.teach.home_words:
    title: Woorden voor thuis en elke dag
    gloss: huis, deur, licht, tandenborstel, ontbijt, eten, thee
    note: '*رو* markeert in spreektaal een bepaald lijdend voorwerp: *در رو* is “de deur”. *مسواک* is de tandenborstel en ook de handeling in *مسواک می‌زنم* (tanden poetsen).'
    example_gloss:
    - Ik doe de deur dicht.
    - Ik doe het licht uit.
    - Ik at en dronk thee.
  fa.a2.unit35.lesson01.teach.subjunctive_verbs:
    title: Werkwoorden na “voordat”
    gloss: ik ga weg, ik ga slapen, ik kom aan, ik koop, ik kook, ik stap in
    note: 'Na *قبل از اینکه* staat het werkwoord in de aanvoegende wijs: *ب* + stam + uitgang (*برم، بخوابم، برسم*). Dit werkwoord heeft geen *می‌*. Het hoofdwerkwoord geeft de gewoonte aan: *می‌بندم، می‌زنم*.'
    example_gloss:
    - Voordat ik ga slapen, poets ik mijn tanden.
    - Voordat ik aankom, bel ik Sara.
    - Voordat ik instap, koop ik een kaartje.
    - Voordat ik kook, was ik de groenten.
  fa.a2.unit35.lesson01.teach.past_verbs:
    title: Werkwoorden in de verleden tijd
    gloss: ik kwam aan, ik belde, ik at
    note: Dit zijn gewone werkwoorden in de eenvoudige verleden tijd. Na *بعد از اینکه* en *وقتی* gebruiken we in een verhaal de verleden tijd.
    example_gloss:
    - Ik kwam aan op het station.
    - Ik belde Sara.
    - Ik at.
  fa.a2.unit35.lesson01.teach.before_subjunctive:
    title: قبل از اینکه + aanvoegende wijs
    gloss: Voordat ik wegga, doe ik de deur dicht
    note: 'Na *قبل از اینکه* staat het werkwoord in de aanvoegende wijs: *برم، بخوابم، برسم*. De handeling in de *قبل از اینکه*-bijzin komt als tweede; de handeling in de hoofdzin komt als eerste. In *قبل از اینکه برم، در رو می‌بندم* doe je eerst de deur dicht en ga je daarna weg.'
  fa.a2.unit35.lesson02.teach.travel_words:
    title: Woorden voor onderweg
    gloss: trein, kaartje, station, ik stapte in, ik kocht
    note: '*سوار شدم* is de hele handeling “ik stapte in” (in een trein, een bus). *بلیت* is een kaartje.'
    example_gloss:
    - Ik kocht een kaartje.
    - Ik stapte in de trein.
    - Ik kwam aan op het station.
  fa.a2.unit35.lesson02.teach.cook_and_day_verbs:
    title: Meer werkwoorden in de verleden tijd
    gloss: ik waste, ik kookte, ik sliep, ik nam
    note: Deze vormen van de eenvoudige verleden tijd (*شستم، پختم، خوابیدم، گرفتم*) gebruiken we na *بعد از اینکه*.
    example_gloss:
    - Ik waste de groenten.
    - Ik kookte.
    - Ik nam een douche.
    - Ik sliep.
  fa.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + eenvoudige verleden tijd
    gloss: Nadat ik was aangekomen, belde ik
    note: 'Na *بعد از اینکه* gebruik je de eenvoudige verleden tijd: *رسیدم، خریدم، شستم*. De *بعد از اینکه*-bijzin is eerst gebeurd. Voorbeeld: *بعد از اینکه بلیت خریدم، سوار قطار شدم* betekent dat je eerst het kaartje kocht en daarna instapte. Hier geen aanvoegende wijs.'
  fa.a2.unit35.lesson03.teach.contrast_verbs:
    title: Gaan en sluiten, verleden en tegenwoordige tijd
    gloss: ik ging, ik deed dicht, ik ga
    note: 'Dit zijn de vormen die we vergelijken: *رفتم* (ik ging) en *می‌رم* (ik ga) tegenover de aanvoegende wijs *برم*.'
    example_gloss:
    - Ik ging van huis.
    - Ik deed de deur dicht.
    - Ik ga weg.
  fa.a2.unit35.lesson03.teach.contrast_forms:
    title: Aanvoegende wijs na قبل, verleden tijd na بعد
    gloss: voordat ik wegga / nadat ik was weggegaan
    note: 'De twee verbindingen vragen om twee verschillende werkwoordsvormen. *قبل از اینکه برم* (voordat ik wegga): aanvoegende wijs, het gebeurt nog niet. *بعد از اینکه رفتم* (nadat ik was weggegaan): eenvoudige verleden tijd, het is gebeurd. Vergelijk *برم / رفتم*, *بخرم / خریدم*, *برسم / رسیدم*.'
  fa.a2.unit35.lesson03.teach.before_any_tense:
    title: Het werkwoord na قبل blijft aanvoegende wijs
    gloss: Voordat ik wegging, deed ik de deur dicht
    note: 'Het werkwoord na *قبل از اینکه* staat in de aanvoegende wijs, ook als het hoofdwerkwoord in de verleden tijd staat: *قبل از اینکه برم، در رو بستم* betekent “Voordat ik wegging, deed ik de deur dicht.” Zet nooit *رفتم* na *قبل از اینکه*.'
  fa.a2.unit35.lesson04.teach.when_words:
    title: Woorden voor “toen/als”
    gloss: muziek, luisteren, kwam, ik kom aan, ik kook
    note: '*گوش می‌دم* is “ik luister”. *اومد* is de gesproken verleden tijd van “kwam”. *رسیدی* is “je kwam aan” en *چیکار کردی؟* is “wat deed je?”'
    example_gloss:
    - Als ik kook, luister ik naar muziek.
    - Toen de trein kwam, stapte ik in.
    - Als ik aankom, bel ik Sara.
  fa.a2.unit35.lesson04.teach.when_forms:
    title: وقتی + verleden of tegenwoordige tijd
    gloss: Toen ik aankwam, belde ik; als ik aankom, bel ik
    note: '*وقتی* krijgt de werkwoordsvorm die bij het tijdstip past. Een afgeronde gebeurtenis staat in de eenvoudige verleden tijd: *وقتی رسیدم، زنگ زدم* (toen ik aankwam, belde ik). Een gewoonte of een plan staat in de tegenwoordige tijd met *می‌*: *وقتی می‌رسم، زنگ می‌زنم* (als ik aankom, bel ik). *وقتی* zegt niet wat het eerst komt, dus gebruik *قبل از اینکه* of *بعد از اینکه* voor een strikte volgorde.'
  fa.a2.unit35.lesson05.teach.yesterday_words:
    title: Woorden voor de leestekst
    gloss: gisteren, ochtend, ik deed uit
    note: '*خاموش کردم* is de eenvoudige verleden tijd van “ik deed uit”. *دیروز صبح* is “gisterochtend”.'
    example_gloss:
    - Ik nam gisterochtend een douche.
    - Ik deed het licht uit.
  fa.a2.unit35.lesson05.teach.reading:
    title: Een ochtend en een trein
    gloss: Gisterochtend at ik ontbijt nadat ik een douche had genomen. Voordat ik van huis ging, deed ik het licht uit en de deur dicht. Toen ik op het station aankwam, kocht ik een kaartje. Nadat de trein was gekomen, stapte ik in.
    note: 'Lees de tekst eerst één keer voor de volgorde van de gebeurtenissen en zoek dan de drie verbindingen: *بعد از اینکه، قبل از اینکه، وقتی*.'
  fa.a2.unit35.lesson06.teach.dialogue_words:
    title: Woorden voor het gesprek
    gloss: morgen, aan mij, jij komt aan, wij aten, wij drinken
    note: '*بهم* is “aan mij” en *بهت* is “aan jou”. *برسی* is de aanvoegende wijs “jij komt aan”. *خوردیم* is “wij aten” en *می‌خوریم* is “wij eten/drinken”.'
    example_gloss:
    - Bel je me morgen?
    - Ja, ik bel je.
    - We hebben gegeten en we gaan thee drinken.
  fa.a2.unit35.lesson06.teach.turn01:
    title: Sara vraagt naar gisteren
    gloss: 'Sara vraagt aan Nima: Wat deed je gisteren nadat je op het station was aangekomen?'
    note: Sara gebruikt *بعد از اینکه* met de verleden tijd.
  fa.a2.unit35.lesson06.teach.turn02:
    title: Nima vertelt de volgorde
    gloss: Nadat ik was aangekomen, kocht ik een kaartje. Toen de trein kwam, stapte ik in.
    note: Nima antwoordt met *بعد از اینکه* en *وقتی*, allebei met werkwoorden in de verleden tijd.
  fa.a2.unit35.lesson06.teach.turn03:
    title: Sara vraagt naar morgen
    gloss: Bel je me morgen, voordat je aankomt?
    note: Sara gebruikt *قبل از اینکه* met de conjunctief *برسی*.
  fa.a2.unit35.lesson06.teach.turn04:
    title: Nima stemt in
    gloss: Ja, voordat ik aankom, bel ik je.
    note: 'Nima herhaalt de conjunctief met zijn eigen uitgang: *برسم*.'
  fa.a2.unit35.lesson06.teach.turn05:
    title: Sara plant het avondeten
    gloss: Goed. Voordat jij aankomt, kook ik.
    note: 'Beide personen hebben hun eigen onderwerp: *من* en *تو*.'
  fa.a2.unit35.lesson06.teach.turn06:
    title: Nima plant de thee
    gloss: Heerlijk! Nadat we gegeten hebben, drinken we thee.
    note: Hier staat de bijzin met *بعد از اینکه* in de verleden tijd en is de hoofdzin het plan.
