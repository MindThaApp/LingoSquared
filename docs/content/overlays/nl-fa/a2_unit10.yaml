  fa.a2.unit10.lesson02.teach.in_my_opinion_better:
    title: Een mening geven
    gloss: Volgens mij is thuiswerken beter.
    note: '*به نظر من ...* (volgens mij...) is de standaardmanier in het Perzisch om een mening in te leiden.'
  fa.a2.unit10.lesson02.teach.because_traffic_wastes_time:
    title: Een reden geven met چون (omdat)
    gloss: Omdat je in het verkeer van Teheran veel tijd verliest.
    note: '*چون* leidt de onderbouwende reden in, een stap verder dan de gewone mededelingen van A1.'
  fa.a2.unit10.lesson02.teach.full_opinion_with_reason:
    title: De mening en de reden combineren
    gloss: Volgens mij is thuiswerken beter, omdat je in het verkeer van Teheran veel tijd verliest.
    note: Dit is het volledige patroon به نظر من ... چون ... waar deze unit om draait.
  fa.a2.unit10.lesson03.teach.message_word:
    title: Bericht
    gloss: bericht
    note: '*پیام* is het algemene woord voor een bericht, gesproken of geschreven.'
  fa.a2.unit10.lesson03.teach.family_word:
    title: Familie
    gloss: familie
    note: '*خانواده* is het algemene woord voor familie of gezin.'
  fa.a2.unit10.lesson03.teach.message_text:
    title: Een geschreven bericht met een mening
    gloss: Volgens mij is thuiswerken veel beter, omdat je in het verkeer van Teheran veel tijd verliest en ik meer bij mijn gezin kan zijn.
    note: Een korte geschreven mening met twee redenen, verbonden met *و* (en), in de losse spreektaal die mensen gebruiken in berichten aan collega's.
  fa.a2.unit10.lesson04.teach.i_dont_agree:
    title: Beleefd het oneens zijn
    gloss: Ik ben het er niet mee eens.
    note: '*من موافق نیستم* is een eenvoudige, beleefde manier om het oneens te zijn -- niet onbeleefd, gewoon direct.'
  fa.a2.unit10.lesson04.teach.turn01:
    title: نگار geeft haar mening
    gloss: نگار zegt dat thuiswerken volgens haar beter is.
    note: Hergebruikt het patroon *به نظر من ... بهتره* uit les 2.
  fa.a2.unit10.lesson04.teach.turn02:
    title: آرش is het er niet mee eens
    gloss: آرش zegt dat hij het er niet mee eens is.
    note: '*من موافق نیستم* van eerder in deze les.'
  fa.a2.unit10.lesson04.teach.turn03:
    title: نگار vraagt waarom
    gloss: نگار vraagt waarom.
    note: '*چرا؟* is het alledaagse woord voor ''waarom?''.'
  fa.a2.unit10.lesson04.teach.turn04:
    title: آرش geeft zijn redenen
    gloss: آرش zegt dat hij zich thuis niet kan concentreren en dat hij het leuk vindt om zijn collega's te zien.
    note: Twee redenen, verbonden met *و* (en).
  fa.a2.unit10.lesson04.teach.turn05:
    title: نگار geeft toe, maar herhaalt haar reden
    gloss: نگار zegt oké, maar dat het verkeer volgens haar veel tijd kost.
    note: '*باشه، ولی...* (oké, maar...) geeft beleefd een punt toe voordat je je eigen punt herhaalt.'
  fa.a2.unit10.lesson04.teach.turn06:
    title: آرش geeft haar gelijk, maar legt uit
    gloss: آرش zegt dat dat klopt, maar dat hij eraan gewend is.
    note: '*درسته، ولی...* (dat klopt, maar...) erkent het punt van de ander.'
