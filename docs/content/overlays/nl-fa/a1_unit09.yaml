teaching:
  fa.a1.unit09.lesson01.teach.hour_word:
    title: Uur / klok
    gloss: uur / klok
    note: ساعت betekent zowel 'uur' als 'klok' en is het basiswoord om de tijd te zeggen.
    example_gloss: Hoe laat is het?
  fa.a1.unit09.lesson01.teach.minute_word:
    title: Minuut
    gloss: minuut
    note: دقیقه is het woord voor minuut.
    example_gloss: Wacht vijf minuten.
  fa.a1.unit09.lesson01.teach.half_word:
    title: Half
    gloss: half
    note: نیم betekent half en wordt gebruikt voor het half uur.
    example_gloss: Het is half acht.
  fa.a1.unit09.lesson01.teach.quarter_word:
    title: Kwart
    gloss: kwart
    note: ربع betekent kwart en wordt gebruikt voor het kwartier.
    example_gloss: Het is kwart voor acht.
  fa.a1.unit09.lesson01.teach.va_word:
    title: En
    gloss: en
    note: و is het gewone verbindingswoord dat je in deze unit overal tegenkomt.
    target_text: و (en)
  fa.a1.unit09.lesson02.teach.what_time_question:
    title: Vragen hoe laat het is
    gloss: Hoe laat is het?
    note: ساعت چنده؟ is de alledaagse, informele manier om naar de tijd te vragen.
  fa.a1.unit09.lesson02.teach.contraction_note:
    title: De informele samentrekking met -e (herhaling)
    gloss: چنده is de gesproken samentrekking van چند است.
    note: Dit is dezelfde samentrekking die je al zag bij woorden over het weer en winkelen, zoals آفتابیه en تومنه.
  fa.a1.unit09.lesson03.teach.three_oclock_half:
    title: Zeggen dat het half vier is
    gloss: Het is half vier.
    note: ساعت سه و نیمه combineert het uur, و (en) en de samengetrokken vorm نیمه (half).
  fa.a1.unit09.lesson03.teach.contraction_note2:
    title: De informele samentrekking met -e, toegepast op نیم
    gloss: نیمه is de gesproken samentrekking van نیم است.
    note: Hetzelfde patroon als bij چنده, maar nu met نیم in plaats van چند.
  fa.a1.unit09.lesson04.teach.sobh:
    title: Ochtend
    gloss: ochtend
    note: صبح is het ochtenddeel van de dag.
    example_gloss: Ik word 's ochtends vroeg wakker.
  fa.a1.unit09.lesson04.teach.zohr:
    title: Twaalf uur 's middags
    gloss: het middaguur
    note: ظهر is het midden van de dag, rond twaalf uur 's middags.
    example_gloss: Ik eet 's middags om twaalf uur.
  fa.a1.unit09.lesson04.teach.asr:
    title: Middag
    gloss: namiddag
    note: عصر is het deel van de dag in de middag en de vroege avond.
    example_gloss: Ik werk in de namiddag.
  fa.a1.unit09.lesson04.teach.shab:
    title: Nacht
    gloss: nacht
    note: شب is de nacht (en ook de avond).
    example_gloss: Ik ga 's avonds vroeg slapen.
  fa.a1.unit09.lesson05.teach.appointment_word:
    title: Afspraak
    gloss: afspraak
    note: قرار is het algemene woord voor een afspraak.
    example_gloss: Ik heb een afspraak.
  fa.a1.unit09.lesson05.teach.appointment_question:
    title: Vragen hoe laat een afspraak is
    gloss: Hoe laat is de afspraak?
    note: قرار ساعت چنده؟ gebruikt de tijdvraag uit een eerdere les voor een concrete afspraak.
  fa.a1.unit09.lesson05.teach.four_oclock:
    title: Een tijd noemen met een dagdeel
    gloss: vier uur 's middags
    note: ساعت چهار عصر combineert het uur met عصر, zodat duidelijk is of het ochtend of middag is.
  fa.a1.unit09.lesson06.teach.tomorrow_review:
    title: Morgen (herhaling)
    gloss: morgen
    note: فردا kwam al in een eerdere unit voor; hier gebruik je het om de afspraak in te leiden.
    example_gloss: Ik heb morgen een afspraak.
  fa.a1.unit09.lesson06.teach.late_word:
    title: Zeggen dat je iets later bent
    gloss: Ik ben iets later.
    note: '*یکم دیر می‌شه* gebruikt het informele *یکم* (een beetje) en *دیر* (laat).'
  fa.a1.unit09.lesson06.teach.turn01:
    title: Negar vraagt hoe laat de afspraak van morgen is
    gloss: Negar vraagt hoe laat de afspraak van morgen is.
    note: قرار فردا ساعت چنده؟ combineert de afspraakvraag uit een eerdere les met فردا (morgen).
  fa.a1.unit09.lesson06.teach.turn02:
    title: Arash antwoordt, maar weet het niet zeker
    gloss: Arash zegt dat hij denkt dat het vier uur is.
    note: فکر کنم (ik denk) maakt het antwoord zachter, want hij is er niet helemaal zeker van.
  fa.a1.unit09.lesson06.teach.turn03:
    title: Negar vraagt of het ochtend of middag is
    gloss: Negar vraagt of het vier uur 's middags of 's ochtends is.
    note: Dit haalt de onduidelijkheid weg, want ساعت چهار alleen zegt niet om welk vier uur het gaat.
  fa.a1.unit09.lesson06.teach.turn04:
    title: Arash verduidelijkt
    gloss: 'Arash zegt: in de middag.'
    note: Een antwoord van één woord is natuurlijk als de vraag de context al duidelijk heeft gemaakt.
  fa.a1.unit09.lesson06.teach.turn05:
    title: Negar stemt in en past haar aankomsttijd aan
    gloss: Negar stemt in en zegt dat ze om kwart over vier komt.
    note: ساعت چهار و ربع combineert het uur met ربع (kwartier).
  fa.a1.unit09.lesson06.teach.turn06:
    title: Arash vraagt waarom dat extra kwartier nodig is
    gloss: Arash vraagt waarom ze kwart over zegt.
    note: '*چرا ربع؟* is een korte manier om te vragen: "Waarom een kwartier?"'
  fa.a1.unit09.lesson06.teach.turn07:
    title: Negar legt uit dat ze iets later is
    gloss: Negar legt uit dat ze iets later van haar werk komt.
    note: '*چون* (omdat) leidt de reden in, met *یکم دیر می‌شه* (ik ben iets later), dat je net in deze les hebt geleerd.'
  fa.a1.unit09.lesson06.teach.turn08:
    title: Arash stelt haar gerust
    gloss: 'Arash zegt: oké, geen probleem.'
    note: مشکلی نیست (geen probleem) stelt Negar gerust dat de kleine vertraging prima is.
