teaching:
  fa.a2.unit33.lesson01.teach.people:
    title: Personen
    gloss: ik, Sara, Nima
    note: Sara en Nima zijn vrienden die over hun gewoonten praten. *من* wordt meestal weggelaten, omdat de werkwoordsuitgang al “ik” aangeeft.
    example_gloss:
    - Ik heb Nima gezien.
    - Sara en Nima zijn vrienden.
  fa.a2.unit33.lesson01.teach.sport_words:
    title: Woorden voor sport en hobby's
    gloss: hardlopen, zwemmen, sporten, boeken lezen, sportschool, park
    note: 'Activiteiten benoem je met een zelfstandig naamwoord dat op *-ن* eindigt: *دویدن* (hardlopen), *خوندن* (lezen). Samengestelde vormen gebruiken *کردن*: *شنا کردن*, *ورزش کردن*.'
    example_gloss:
    - Ik ben in het park begonnen met hardlopen.
    - Ik sport in de sportschool.
  fa.a2.unit33.lesson01.teach.screen_food:
    title: Woorden voor schermtijd en eten
    gloss: telefoon, televisie, frisdrank, snoep, water, uur
    note: '*نگاه کردن* is het gewone werkwoord in de spreektaal voor tv kijken: *تلویزیون نگاه کردن*. Het meervoud *شب‌ها* betekent “''s avonds, ''s nachts” als gewoonte.'
    example_gloss:
    - '''s Avonds kijk ik een uur tv.'
    - Ik gebruik een uur mijn telefoon.
  fa.a2.unit33.lesson01.teach.time_words:
    title: Woorden voor tijd en gewoonten
    gloss: elke dag, maand, week, geleden, sinds, niet meer, vroeg, laat, minder
    note: '*از ماه پیش* betekent “sinds een maand geleden”; *پیش* na een tijdsaanduiding betekent “geleden”. *دیگه* met een ontkend werkwoord betekent “niet meer”.'
    example_gloss:
    - Sinds een maand geleden ren ik elke dag.
    - Sinds vorige week ga ik 's avonds vroeg naar bed.
  fa.a2.unit33.lesson01.teach.start_form:
    title: 'Beginnen: شروع کردم به + zelfstandig naamwoord van het werkwoord'
    gloss: Ik ben begonnen met hardlopen; ik ben begonnen met zwemmen
    note: 'Om te zeggen dat je met een gewoonte bent begonnen, gebruik je *شروع کردم به* gevolgd door het zelfstandig naamwoord van het werkwoord (de vorm op *-ن*): *شروع کردم به دویدن*. Vervoeg het tweede werkwoord niet.'
  fa.a2.unit33.lesson01.teach.stop_form:
    title: 'Stoppen: دیگه ... نمی‌کنم en ترک کردم'
    gloss: Ik drink geen frisdrank meer; ik ben gestopt met snoep
    note: 'Twee natuurlijke manieren om te stoppen: *دیگه* plus een ontkend werkwoord in de tegenwoordige tijd (*دیگه نمی‌دوم* = ik ren niet meer), of *X رو ترک کردم* (ik ben gestopt met X) met de lijdend-voorwerpmarkering *رو*.'
  fa.a2.unit33.lesson02.teach.subjunctive_verbs:
    title: Werkwoorden in de “wens”-vorm
    gloss: dat ik slaap, wakker word, ren, eet/drink, bel, ga, doe
    note: 'Deze uitgangen (*-م*) volgen op *سعی* en *یادم رفت*. Samengestelde werkwoorden houden het zelfstandig naamwoord en veranderen het hulpwerkwoord: *ورزش کنم*, *زنگ بزنم*, *بیدار شم*.'
    example_gloss:
    - Ik wil elke dag hardlopen.
    - Ik moet vroeg opstaan.
  fa.a2.unit33.lesson02.teach.try_forget_words:
    title: Proberen en vergeten
    gloss: proberen, ik was vergeten, dat, gisteren, vandaag
    note: '*یادم رفت* is opgebouwd uit *یاد* (herinnering) + *م* + *رفت*: “het is uit mijn geheugen verdwenen.” Hetzelfde patroon werkt voor elke persoon: *یادش رفت*, *یادت رفت*.'
    example_gloss:
    - Gisteren was ik vergeten water te drinken.
    - Vandaag probeer ik vroeg naar bed te gaan.
  fa.a2.unit33.lesson02.teach.try_form:
    title: 'Proberen: سعی می‌کنم / سعی کردم + subjunctief'
    gloss: Ik probeer vroeg te slapen; ik probeerde vroeg op te staan
    note: '*سعی می‌کنم* is “ik probeer” en *سعی کردم* is “ik heb geprobeerd.” Het tweede werkwoord staat altijd in de *ب-*vorm met dezelfde persoonsuitgang, zonder *به*: *سعی کردم زود بیدار شم*.'
  fa.a2.unit33.lesson02.teach.forget_form:
    title: 'Vergeten: یادم رفت (که) + subjunctief'
    gloss: Ik was vergeten te bellen; ik was vergeten water te drinken
    note: '*یادم رفت* plus de *ب-*vorm betekent “ik was vergeten het te doen.” Het woord *که* is in gesproken taal optioneel: *یادم رفت زنگ بزنم* = *یادم رفت که زنگ بزنم*.'
  fa.a2.unit33.lesson02.teach.subjunctive_shape:
    title: Hoe de “wens”-vorm wordt gevormd
    gloss: ب + stam + persoonsuitgang
    note: 'De meeste werkwoorden krijgen *ب-* voor de stam: *بدوم*, *بخورم*, *بخوابم*. Bij samengestelde werkwoorden komt het op het hulpwerkwoord (*زنگ بزنم*) of gebruik je *کنم* en *شم*. In gesproken taal wordt *بیدار بشم* vaak ingekort tot *بیدار شم*.'
  fa.a2.unit33.lesson03.teach.four_frames:
    title: Vier patronen, vier betekenissen
    gloss: begonnen met hardlopen / geprobeerd te rennen / vergeten te rennen / ren niet meer
    note: 'Dezelfde activiteit krijgt een andere betekenis door het patroon: *شروع کردم به دویدن* (ik ben begonnen), *سعی کردم بدوم* (ik heb geprobeerd), *یادم رفت بدوم* (ik was het vergeten), *دیگه نمی‌دوم* (ik doe het niet meer).'
  fa.a2.unit33.lesson03.teach.noun_or_subjunctive:
    title: Zelfstandig werkwoord of “wens”-vorm?
    gloss: به + zelfstandig werkwoord vs. ب-vorm
    note: 'Na *شروع کردم به* gebruik je het zelfstandig werkwoord (*شنا کردن*). Na *سعی کردم* en *یادم رفت* gebruik je de persoonlijke *-م*-vorm (*شنا کنم*). Meng ze niet: *سعی کردم به شنا کردن* is fout.'
  fa.a2.unit33.lesson03.teach.dige_negative:
    title: دیگه + ontkenning betekent “niet meer”
    gloss: Ik kijk 's avonds geen tv meer
    note: '*دیگه* voor een ontkend werkwoord zegt dat iets vroeger gebeurde en nu is gestopt. Zonder *دیگه* is *نوشابه نمی‌خورم* een algemeen feit (“ik drink geen fris”), geen verandering.'
  fa.a2.unit33.lesson04.teach.questions:
    title: Vragen over gewoontes
    gloss: Sinds wanneer ben je begonnen? Waarmee ben je gestopt?
    note: 'De vraag eindigt op de *-ی*-vorm voor “jij”: *شروع کردی* = je bent begonnen, *ترک کردی* = je bent gestopt met. Antwoord in de *-م*-vorm.'
    example_gloss:
    - Sinds wanneer ben je begonnen?
    - Waarmee ben je gestopt?
  fa.a2.unit33.lesson04.teach.answer_since:
    title: Antwoorden met een starttijd
    gloss: sinds een maand geleden ben ik begonnen met hardlopen
    note: 'Zet de tijd voorop: *از ماه پیش شروع کردم به دویدن*. Bij stoppen zet je het object voorop en gebruik je *رو*: *نوشابه رو ترک کردم*.'
  fa.a2.unit33.lesson05.teach.link_words:
    title: Verbindingswoorden
    gloss: maar, ook, uit
    note: '*هم* na een zelfstandig naamwoord of werkwoordsgroep betekent “ook.” *خاموش کردن* is “uitzetten” en krijgt *رو* bij een bepaald object.'
    example_gloss:
    - Ik heb de telefoon uitgezet.
    - Ik probeerde het, maar ik was het vergeten.
  fa.a2.unit33.lesson05.teach.reading_note:
    title: Een tekst over veranderde gewoontes
    gloss: ''
    note: Lees eerst om de twee veranderingen te vinden (één begonnen, twee gestopt), en lees dan nog eens om te zien wat de spreker probeert en wat hij vergeten is.
  fa.a2.unit33.lesson06.teach.chat_words:
    title: Chatwoorden
    gloss: hoe is het, het is goed, goed gedaan, sorry, dus, waarom, nee, je drinkt, je hebt niet gebeld
    note: '*آفرین* is een compliment voor een vriend (“goed gedaan”). *ببخش* is het informele “sorry”; gebruik *ببخشید* tegenover onbekenden.'
    example_gloss:
    - Hoe gaat het met het sporten? Goed!
    - Dus waarom heb je niet gebeld?
  fa.a2.unit33.lesson06.teach.turn01:
    title: Sara vraagt naar het sporten
    gloss: 'Sara vraagt Nima: Hoe gaat het met het sporten?'
    note: De vraag opent het gesprek over zijn nieuwe gewoontes.
  fa.a2.unit33.lesson06.teach.turn02:
    title: Nima noemt waarmee hij is begonnen
    gloss: 'Nima: Goed! Een maand geleden ben ik begonnen met hardlopen.'
    note: '*شروع کردم به* plus het zelfstandig werkwoord *دویدن*.'
  fa.a2.unit33.lesson06.teach.turn03:
    title: Sara geeft een compliment en vraagt door
    gloss: 'Sara: Goed gedaan! Drink je ook fris?'
    note: '*هم* betekent “ook.”'
  fa.a2.unit33.lesson06.teach.turn04:
    title: Nima is gestopt met fris
    gloss: 'Nima: Nee, ik ben gestopt met fris. Ik probeer ook minder mijn telefoon te gebruiken.'
    note: Eén keer stoppen (*ترک کردم*) en één poging (*سعی می‌کنم*).
  fa.a2.unit33.lesson06.teach.turn05:
    title: Sara vraagt waarom hij niet belde
    gloss: 'Sara: Dus waarom heb je gisteren niet gebeld?'
    note: De vraag gebruikt de *-ی*-vorm voor “jij”.
  fa.a2.unit33.lesson06.teach.turn06:
    title: Nima geeft toe dat hij het vergeten was
    gloss: 'Nima: Sorry, ik was vergeten te bellen.'
    note: '*یادم رفت* plus de *ب-*vorm.'
