teaching:
  fa.a1.unit10.lesson01.teach.shanbe_yekshanbe:
    title: Zaterdag, zondag
    gloss: Zaterdag, zondag
    note: شنبه en یکشنبه zijn de eerste twee dagen van de Iraanse week, die op zaterdag begint.
    example_gloss:
    - Vandaag is het zaterdag.
    - Morgen is het zondag.
  fa.a1.unit10.lesson01.teach.doshanbe_seshanbe:
    title: Maandag, dinsdag
    gloss: maandag, dinsdag
    note: دوشنبه en سه‌شنبه volgen op شنبه en یکشنبه.
    example_gloss:
    - Ik heb op maandag les.
    - Ik heb op dinsdag een afspraak.
  fa.a1.unit10.lesson01.teach.chaharshanbe_panjshanbe:
    title: Woensdag, donderdag
    gloss: woensdag, donderdag
    note: چهارشنبه en پنجشنبه zijn de dagen in het midden en tegen het einde van de week.
    example_gloss:
    - Ik werk op woensdag.
    - Tot donderdag!
  fa.a1.unit10.lesson01.teach.jome:
    title: vrijdag
    gloss: vrijdag
    note: جمعه is de laatste dag van de week en van oudsher de wekelijkse vrije dag in Iran.
    example_gloss: Vrijdag is een vrije dag.
  fa.a1.unit10.lesson01.teach.weekend_note:
    title: De wekelijkse vrije dag
    gloss: Vrijdag is de wekelijkse vrije dag.
    note: جمعه (vrijdag) is van oudsher de wekelijkse rustdag in Iran, hoewel sommige moderne werkplekken tegenwoordig ook op donderdagmiddag dichtgaan.
  fa.a1.unit10.lesson02.teach.farvardin:
    title: Farvardin (1e maand)
    gloss: Farvardin, de eerste maand van het Iraanse zonnejaar
    note: فروردین is het begin van het Iraanse zonnejaar, ongeveer eind maart (rond de lentetijdstip/Nowruz).
    example_gloss: Farvardin is de eerste maand van het jaar.
  fa.a1.unit10.lesson02.teach.ordibehesht:
    title: Ordibehesht (2e maand)
    gloss: Ordibehesht, de tweede maand
    note: اردیبهشت komt na فروردین, ongeveer april-mei.
    example_gloss: In Ordibehesht is het mooi weer.
  fa.a1.unit10.lesson02.teach.khordad:
    title: Khordad (3e maand)
    gloss: Khordad, de derde maand
    note: خرداد komt na اردیبهشت, ongeveer mei-juni.
    example_gloss: Ik ben geboren in Khordad.
  fa.a1.unit10.lesson02.teach.calendar_note:
    title: De Iraanse zonnekalender
    gloss: Iran gebruikt de Hijri-shamsi-kalender (de Perzische zonnekalender).
    note: '*ایران از تقویم هجری شمسی استفاده می‌کنه* zegt dat Iran deze kalender gebruikt voor alledaagse datums. Afghanistan gebruikt hetzelfde kalendersysteem, maar met andere maandnamen: Perzische namen in Iran, van oorsprong Arabische namen in Afghanistan.'
  fa.a1.unit10.lesson03.teach.what_day_today:
    title: Welke dag is het vandaag?
    gloss: Welke dag is het vandaag?
    note: 'امروز چندشنبه‌ست؟ vraagt letterlijk: ''vandaag, de hoeveelste dag van de week is het?'' Het is de informele samentrekking op -e van چندشنبه است.'
  fa.a1.unit10.lesson03.teach.today_word:
    title: Vandaag
    gloss: vandaag
    note: امروز betekent vandaag.
    example_gloss: De hoeveelste is het vandaag?
  fa.a1.unit10.lesson04.teach.give_full_date:
    title: Vandaag is het donderdag 10 Ordibehesht.
    gloss: Vandaag is het donderdag 10 Ordibehesht.
    note: امروز پنجشنبه، دهم اردیبهشته combineert in één zin de dagnaam, de datum als rangtelwoord en de maandnaam, met de informele samentrekking op -e (اردیبهشته = اردیبهشت است).
  fa.a1.unit10.lesson04.teach.tarikh_word:
    title: Datum
    gloss: datum
    note: '*تاریخ* betekent ''datum'': het algemene woord voor een kalenderdatum, zoals in *تاریخ جلسه* (de datum van de vergadering).'
    example_gloss: Welke datum is het vandaag?
  fa.a1.unit10.lesson05.teach.which_day_meeting:
    title: Welke dag is de vergadering?
    gloss: Welke dag is de vergadering?
    note: جلسه کدوم روزه؟ vraagt op welke dag van de week iets plaatsvindt.
  fa.a1.unit10.lesson05.teach.which_date:
    title: Welke datum is het dinsdag in Ordibehesht?
    gloss: Welke datum is het dinsdag in Ordibehesht?
    note: سه‌شنبه چندم اردیبهشته؟ vraagt naar de precieze datum van een genoemde dag.
  fa.a1.unit10.lesson06.teach.hashtom:
    title: 8e
    gloss: 8e
    note: '*هشتم* betekent de 8e (van de maand).'
    example_gloss: Vandaag is het de 8e.
  fa.a1.unit10.lesson06.teach.turn01:
    title: Reza, welke dag is de vergadering?
    gloss: Reza, welke dag is de vergadering?
    note: Maryam opent door Reza direct bij zijn naam aan te spreken.
  fa.a1.unit10.lesson06.teach.turn02:
    title: Ik denk dinsdag.
    gloss: Ik denk dinsdag.
    note: 'فکر کنم (ik denk) maakt Reza''s antwoord zachter: hij is er niet helemaal zeker van.'
  fa.a1.unit10.lesson06.teach.turn03:
    title: Welke datum is het dinsdag in Ordibehesht?
    gloss: Welke datum is het dinsdag in Ordibehesht?
    note: Maryam vraagt door naar de precieze datum.
  fa.a1.unit10.lesson06.teach.turn04:
    title: Dinsdag is het 8 Ordibehesht.
    gloss: Dinsdag is het 8 Ordibehesht.
    note: Reza geeft de precieze datum.
  fa.a1.unit10.lesson06.teach.turn05:
    title: Oké, goed. Wat dacht je van vrijdag, heb je dan tijd?
    gloss: Oké, goed. Wat dacht je van vrijdag, heb je dan tijd?
    note: Maryam bevestigt de datum en vraagt dan naar een andere dag.
  fa.a1.unit10.lesson06.teach.turn06:
    title: Nee, vrijdag heb ik het druk.
    gloss: Nee, vrijdag heb ik het druk.
    note: سرم شلوغه (letterlijk 'mijn hoofd is druk/vol') is de gewone informele manier in Iran om te zeggen dat je het druk hebt.
  fa.a1.unit10.lesson06.teach.turn07:
    title: Geen probleem, dan zie ik je dinsdag.
    gloss: Geen probleem, dan zie ik je dinsdag.
    note: 'مشکلی نیست (geen probleem) accepteert beleefd Reza''s weigering, en می‌بینمت betekent ''ik zie je'': dinsdag blijft dus de dag van de vergadering, zoals eerder in het gesprek.'
  fa.a1.unit10.lesson06.teach.va_and:
    title: En
    gloss: en
    note: '*و* betekent ''en''. Je kunt er twee dagen mee verbinden, zoals in *دوشنبه و سه‌شنبه*, of twee verwante vragen, zoals in *جلسه کدوم روزه و چندم اردیبهشته؟*'
    example_gloss: Ik heb op maandag en dinsdag les.
