course:
  title: Farsi in het Nederlands A1
  description: 'Perzisch (Iraans) voor beginners: de dagen van de week, de namen van de maanden van de Iraanse zonnekalender, vragen naar en zeggen van de datum van vandaag, vragen naar een datum in de toekomst en in een gesprek een datum voor een afspraak afspreken.'
