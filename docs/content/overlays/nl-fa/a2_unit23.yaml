teaching:
  fa.a2.unit23.lesson01.teach.time_words:
    title: Tijdwoorden voor je kindertijd
    gloss: vroeger, toen, toen ik kind was, elke dag, elke zomer
    note: '*قبلا* en *اون موقع* zetten een scène in het verleden. *هر روز* en *هر تابستون* wijzen op herhaling, dus ze passen vanzelf bij de gewoonteverleden tijd met *می‌*.'
    example_gloss:
    - Ik liep vroeger elke dag naar school.
    - Ik was toen een kind.
    - Elke zomer speelden we in het park.
  fa.a2.unit23.lesson01.teach.places:
    title: Plekken in huis en wijk
    gloss: huis, tuin, wijk, school, park
    note: '*توی* is de gewone gesproken vorm van ''in''. Bij *رفتن* kun je *به* houden of weglaten: *به مدرسه می‌رفتم* en *می‌رفتم مدرسه*.'
    example_gloss:
    - Ons huis had een tuin.
    - Onze wijk was rustig.
    - Ik liep vroeger naar school.
    - We speelden vroeger in het park.
  fa.a2.unit23.lesson01.teach.descriptions:
    title: Plaatsen beschrijven
    gloss: rustig, druk, groot, dichtbij, ver
    note: Gebruik deze woorden met de verleden tijd *بود* om te beschrijven hoe een plek was. In gesproken Farsi betekent *دوره* 'het is ver'.
    example_gloss:
    - De wijk was rustig.
    - De school was druk.
    - De tuin was groot.
    - De school was dichtbij.
    - Nu is het park ver weg.
  fa.a2.unit23.lesson01.teach.activities:
    title: Activiteiten uit je kindertijd
    gloss: te voet, boek, voetbal, spelen, lezen, bouwen
    note: '*بازی کردن* is een samengesteld werkwoord. In de gewoonteverleden tijd komt *می‌* voor *کردن*: *بازی می‌کردم*.'
    example_gloss:
    - Ik liep vroeger naar school.
    - Ik las vroeger boeken.
    - Ik voetbalde vroeger.
    - Zij bouwden vroeger iets in de tuin.
  fa.a2.unit23.lesson01.teach.habit_shape:
    title: De vorm van de gewoonteverleden tijd
    gloss: ik ging vroeger, ik las vroeger, ik deed vroeger, zij bouwden vroeger
    note: 'Voor een herhaalde gewoonte in het verleden zet je *می‌* voor de verleden stam en voeg je het persoonsuiteinde toe: *می‌رفت + م* → *می‌رفتم*. Houd de ZWNJ (halve spatie) na *می‌*.'
  fa.a2.unit23.lesson02.teach.people_and_links:
    title: Personen en handige verbindingswoorden
    gloss: ik, wij, zij, met, een, iets, in de middag
    note: In gesproken Farsi laat je het onderwerp vaak weg; deze woorden maken de persoon of de situatie duidelijk wanneer dat nodig is.
    example_gloss:
    - Ik las vroeger elke dag een boek.
    - We speelden vroeger in het park.
    - Zij bouwden vroeger iets.
    - Ik voetbalde vroeger met Nima.
    - We hadden een grote tuin.
    - We speelden vroeger in de middag.
  fa.a2.unit23.lesson02.teach.now_words:
    title: Nu en niet meer
    gloss: nu, niet meer, nee, daar, hoe
    note: '*دیگه* met een ontkend werkwoord betekent ''niet meer'': *دیگه بازی نمی‌کنم*.'
    example_gloss:
    - Nu is de wijk druk.
    - Ik speel daar niet meer.
    - Nee, de school was niet ver weg.
    - Hoe was jouw buurt?
  fa.a2.unit23.lesson02.teach.full_forms:
    title: Persoonsuitgangen bij می‌رفت
    gloss: ik, jij, hij/zij, wij, zij gingen altijd
    note: 'De uitgangen van de verleden tijd blijven hetzelfde: *-م، -ی،* geen uitgang, *-یم، -ن*. De gesproken derde persoon meervoud is *می‌رفتن*.'
  fa.a2.unit23.lesson02.teach.other_habits:
    title: Gewoontes van lezen en spelen
    gloss: jij/hij/wij las(en) vroeger; ik/wij speelde(n) vroeger
    note: 'Hetzelfde patroon werkt met andere verleden stammen. Een samengesteld werkwoord houdt het zelfstandig naamwoord apart: *بازی می‌کردیم*.'
  fa.a2.unit23.lesson02.teach.past_states:
    title: Toestanden in het verleden met بودن en داشتن
    gloss: Ik was een kind; de buurt was rustig; we hadden een grote tuin
    note: Gebruik de verleden tijd van *بودن* en *داشتن* voor beschrijvingen van de achtergrond. Dit zijn toestanden, dus de natuurlijke vormen zijn hier *بودم، بود، داشتیم*, zonder gewoontevormend *می‌*.
  fa.a2.unit23.lesson03.teach.simple_contrast:
    title: Gewoonte versus eenmalige gebeurtenis
    gloss: Ik ging vroeger elke dag naar school. Gisteren ging ik naar school.
    note: '*هر روز می‌رفتم* is een herhaling in het verleden. *دیروز رفتم* is één afgeronde keer. De tijdsaanduiding en de aan- of afwezigheid van *می‌* werken samen.'
  fa.a2.unit23.lesson03.teach.negative_habit:
    title: Ontkennende gewoonte in het verleden
    gloss: Ik ging vroeger niet; ik las vroeger niet; ik speelde vroeger niet
    note: 'Zet *نـ* voor *می‌*: *نمی‌رفتم، نمی‌خوندم، بازی نمی‌کردم*. Schrijf *نمی‌* vast aan de stam met een ZWNJ ertussen.'
  fa.a2.unit23.lesson04.teach.then_now:
    title: Toen versus nu
    gloss: Onze buurt was vroeger rustig; nu is het er druk.
    note: Combineer *قبلا* of *اون موقع* met de beschrijving in het verleden, en daarna *حالا* met het tegengestelde van nu.
  fa.a2.unit23.lesson05.teach.reading:
    title: Een buurt uit mijn jeugd
    gloss: Toen ik een kind was, was onze buurt rustig. We hadden een huis met een grote tuin. Ik liep elke dag naar school. 's Middags voetbalde ik in de tuin. Nu is de buurt druk en speel ik daar niet meer.
    note: De tekst combineert een toestand in het verleden, herhaalde gewoontes en een tegenstelling met het heden.
  fa.a2.unit23.lesson06.teach.names:
    title: Sara en Nima
    gloss: Sara, Nima
    note: Sara en Nima zijn de vaste vrienden in dit gesprek.
    example_gloss:
    - Sara vertelt over haar jeugd.
    - Nima vertelt over zijn buurt.
  fa.a2.unit23.lesson06.teach.turn01:
    title: Sara vraagt naar de oude buurt
    gloss: Hoe was jullie buurt toen je een kind was?
    note: Sara vraagt naar een toestand in het verleden met een verleden vorm van het werkwoord zijn.
  fa.a2.unit23.lesson06.teach.turn02:
    title: Nima beschrijft zijn jeugd
    gloss: Onze buurt was rustig. We hadden een huis met een grote tuin. Ik liep elke dag naar school en 's middags voetbalde ik in de tuin. En jij?
    note: Nima combineert toestanden in het verleden (was, had) met herhaalde gewoontes (liep vroeger, speelde vroeger).
  fa.a2.unit23.lesson06.teach.turn03:
    title: Sara voegt een tegenstelling toen-nu toe
    gloss: Onze school was dichtbij. Elke zomer speelden we in het park. Nu is het park ver weg en speel ik daar niet meer.
    note: Sara eindigt met *حالا ... دیگه ... نمی‌کنم* om het heden tegenover het verleden te zetten.
