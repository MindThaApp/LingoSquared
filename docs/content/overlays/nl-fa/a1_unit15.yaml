  fa.a1.unit15.lesson01.teach.bozorgtare_word:
    title: Het is groter
    gloss: het is groter
    note: بزرگ‌تره is de spreektaalvorm (samentrekking) van بزرگ‌تر است (het is groter). بزرگ‌تر is de vergrotende trap van بزرگ (groot).
    example_gloss: Dit is groter dan dat.
  fa.a1.unit15.lesson01.teach.koochiktare_word:
    title: Het is kleiner
    gloss: het is kleiner
    note: کوچیک‌تره is de spreektaalvorm (samentrekking) van کوچیک‌تر است (het is kleiner).
    example_gloss: Dat is kleiner dan dit.
  fa.a1.unit15.lesson01.teach.az_word:
    title: Dan
    gloss: dan
    note: 'از geeft het vergelijkingspunt aan: X از Y بزرگ‌تره betekent X is groter dan Y.'
    target_text: از (dan)
  fa.a1.unit15.lesson02.teach.geroontare_word:
    title: Het is duurder
    gloss: het is duurder
    note: گرون‌تره is de spreektaalvorm van گرون‌تر است. گرون‌تر is de vergrotende trap van گرون (duur).
    example_gloss: Dit is duurder dan dat.
  fa.a1.unit15.lesson02.teach.arzoontare_word:
    title: Het is goedkoper
    gloss: het is goedkoper
    note: ارزون‌تره is de spreektaalvorm van ارزون‌تر است. ارزون‌تر is de vergrotende trap van ارزون (goedkoop).
    example_gloss: Dat is goedkoper dan dit.
  fa.a1.unit15.lesson03.teach.names:
    title: Nima en Sara
    gloss: Nima, Sara
    note: Veelvoorkomende Iraanse namen die in deze cursus steeds terugkomen.
    example_gloss:
    - Nima is langer dan Sara.
    - Sara is jonger dan Nima.
  fa.a1.unit15.lesson03.teach.ghad_bolandtare_phrase:
    title: Langer
    gloss: langer / hij/zij is langer
    note: '*قد بلندتره* betekent letterlijk ''de lengte is groter'': *قد* (lengte) + *بلندتر* (langer, vergrotende trap van *بلند*, lang/hoog) + *است* (is), samengetrokken tot *-ه*.'
  fa.a1.unit15.lesson03.teach.javoontare_word:
    title: Jonger
    gloss: jonger / hij/zij is jonger
    note: جوون‌تره is de spreektaalvorm van جوون‌تر است. جوون‌تر is de vergrotende trap van جوون (jong).
    example_gloss: Sara is jonger dan Nima.
  fa.a1.unit15.lesson04.teach.behtare_word:
    title: Het is beter
    gloss: het is beter
    note: '*بهتره* is de spreektaalvorm van *بهتر است*. *بهتر* (beter) is de onregelmatige vergrotende trap van *خوب* (goed).'
    example_gloss: Dit is beter dan dat.
  fa.a1.unit15.lesson04.teach.badtare_word:
    title: Het is slechter
    gloss: het is slechter
    note: '*بدتره* is de spreektaalvorm van *بدتر است*. *بدتر* (slechter) is de regelmatige vergrotende trap van *بد* (slecht): hetzelfde woord plus het gewone achtervoegsel *تر*, anders dan *بهتر*, dat onregelmatig is.'
    example_gloss: Dat is slechter dan dit.
  fa.a1.unit15.lesson04.teach.choon_word:
    title: Omdat
    gloss: omdat
    note: چون geeft een reden aan.
    target_text: چون (omdat)
  fa.a1.unit15.lesson04.teach.va_word:
    title: En
    gloss: en
    note: و betekent en en verbindt twee zinsdelen of onderdelen.
    target_text: و (en)
  fa.a1.unit15.lesson05.teach.reading_text:
    title: Voorbeeldtekst met een vergelijking
    gloss: Nima is langer dan Sara. Sara is jonger dan Nima.
    note: Een korte vergelijking over twee personen met de woordenschat van deze unit.
  fa.a1.unit15.lesson06.teach.names:
    title: Nima en Sara
    gloss: Nima, Sara
    example_gloss:
    - Nima zei dat dit duurder is.
    - Sara zei dat dat goedkoper is.
  fa.a1.unit15.lesson06.teach.vali_word:
    title: Maar
    gloss: maar
    note: ولی betekent maar en geeft een tegenstelling aan.
    target_text: ولی (maar)
  fa.a1.unit15.lesson06.teach.aare_word:
    title: Ja
    gloss: ja
    note: آره is de spreektaalvorm van بله (ja).
    example_gloss: Ja, dat klopt.
  fa.a1.unit15.lesson06.teach.dialogue_line1:
    title: Nima zegt
    gloss: Dit is duurder dan dat, maar het is beter.
  fa.a1.unit15.lesson06.teach.dialogue_line2:
    title: Sara antwoordt
    gloss: Ja, maar dat is goedkoper.
