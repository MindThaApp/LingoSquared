    title: Een afspraakbevestiging
    gloss: Uw afspraak met dr. Rezaei is dinsdag om 11 uur 's ochtends. Kom alstublieft 15 minuten eerder. Als de klachten na een week niet beter zijn, neemt u opnieuw contact op.
