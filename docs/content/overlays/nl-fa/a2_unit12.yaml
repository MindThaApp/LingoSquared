  fa.a2.unit12.lesson02.teach.headache_three_days_severe:
    title: Een klacht met duur en ernst noemen
    gloss: Ik heb al drie dagen erge hoofdpijn.
    note: '*از ... پیش* (sinds ... geleden) geeft de duur aan; *شدید* (erg, hevig) geeft de ernst aan. Dit is een stap verder dan het simpelweg noemen van een klacht op A1.'
