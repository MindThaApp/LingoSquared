  fa.a2.unit12.lesson04.teach.whats_wrong:
    title: Wat is er aan de hand?
    gloss: Zegt u het maar, wat is er aan de hand?
    note: '*بفرمایید، چی شده؟* is een gebruikelijke, beleefde openingszin bij de dokter.'
  fa.a2.unit12.lesson04.teach.turn01:
    title: دکتر رضایی vraagt wat er aan de hand is
    gloss: Dokter Rezaei nodigt hem uit om te vertellen en vraagt wat er aan de hand is.
    note: Hergebruikt de openingszin uit deze les.
  fa.a2.unit12.lesson04.teach.turn02:
    title: نیما beschrijft zijn klacht
    gloss: نیما zegt dat hij al drie dagen erge hoofdpijn heeft.
    note: 'Hergebruikt het patroon uit les 2: een klacht met duur en ernst.'
  fa.a2.unit12.lesson04.teach.turn03:
    title: دکتر رضایی vraagt naar koorts
    gloss: Dokter Rezaei vraagt of hij ook koorts heeft.
    note: '*تب هم دارید؟* vraagt naar een extra klacht.'
  fa.a2.unit12.lesson04.teach.turn04:
    title: نیما antwoordt op de vraag over koorts
    gloss: نیما zegt nee, het is alleen hoofdpijn, maar wel erg.
    note: '*فقط ... ولی ...* (alleen ... maar ...) beperkt en zet iets tegenover elkaar.'
  fa.a2.unit12.lesson04.teach.turn05:
    title: دکتر رضایی geeft instructies
    gloss: 'Dokter Rezaei zegt: goed, haal dit recept op en rust een paar dagen.'
    note: 'De behandelinstructie van de dokter: een recept en rust.'
  fa.a2.unit12.lesson04.teach.turn06:
    title: نیما bedankt de dokter
    gloss: 'نیما zegt: komt in orde, dank u wel, dokter.'
    note: '*چشم* is een beleefde, respectvolle manier om ''komt in orde'' of ''doe ik'' te zeggen tegen iemand met gezag.'
