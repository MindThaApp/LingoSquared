  fa.a2.unit13.lesson01.teach.broken_word:
    title: Kapot
    gloss: kapot
    note: '*خراب* betekent kapot en wordt gebruikt met *شدن*: *خراب شدن* (kapotgaan).'
    example_gloss: De radiator is kapot.
  fa.a2.unit13.lesson01.teach.super_word:
    title: Huismeester
    gloss: huismeester / conciërge
    note: '*سرایدار* is de persoon die een appartementengebouw beheert en onderhoudt.'
    example_gloss: Ik heb de huismeester gebeld.
  fa.a2.unit13.lesson01.teach.repair_word:
    title: Reparatie
    gloss: reparatie
    note: '*تعمیر* is het algemene woord voor een reparatie.'
    example_gloss: Wanneer komt de reparatie?
