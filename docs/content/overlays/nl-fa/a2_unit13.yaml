  fa.a2.unit13.lesson01.teach.leak_word:
    title: Lek
    gloss: lek / druppel
    note: '*چکه* betekent een lek of druppel en wordt gebruikt met *کردن* als *چکه کردن* (lekken).'
    example_gloss: De leiding lekt.
  fa.a2.unit13.lesson01.teach.radiator_word:
