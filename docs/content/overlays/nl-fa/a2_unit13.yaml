    title: En
    gloss: en
    note: '*و* is het veelgebruikte voegwoord in deze unit.'
    target_text: و (en)
  fa.a2.unit13.lesson01.teach.ra_note:
    title: Object marker
    gloss: (markeert een bepaald lijdend voorwerp)
    note: '*رو* (spreektaal voor het formele *را*) markeert een bepaald lijdend voorwerp. Het staat direct achter datgene waarop de handeling gericht is.'
    target_text: رو (lijdend-voorwerpmarkeerder)
  fa.a2.unit13.lesson02.teach.pipe_leaking:
    title: Het probleem melden
    gloss: De leiding in de badkamer lekt.
    note: '*داره چکه می‌کنه* gebruikt de duurvorm *داره + werkwoord* om een probleem te beschrijven dat nu bezig is, niet een eenmalig feit.'
  fa.a2.unit13.lesson02.teach.when_can_repair:
    title: Vragen wanneer het gerepareerd wordt
    gloss: Wanneer kunt u langskomen om het te repareren?
    note: '*کی می‌تونید ...؟* vraagt beleefd wanneer iemand iets kan doen.'
  fa.a2.unit13.lesson02.teach.full_report_and_question:
    title: Melding en vraag combineren
    gloss: De leiding in de badkamer lekt. Wanneer kunt u langskomen om het te repareren?
    note: Het complete patroon van melding plus vraag waar deze les om draait.
  fa.a2.unit13.lesson03.teach.request_word:
    title: Aanvraag
    gloss: aanvraag / verzoek
    note: '*درخواست* is het algemene woord voor een verzoek of aanvraag, hier gebruikt met *ثبت شد* (is geregistreerd).'
    example_gloss: Uw reparatieverzoek is geregistreerd.
  fa.a2.unit13.lesson03.teach.repairman_word:
    title: Reparateur
    gloss: reparateur
    note: '*تعمیرکار* is de persoon die langskomt om iets te repareren.'
    example_gloss: De reparateur komt morgen.
  fa.a2.unit13.lesson03.teach.notice_text:
    title: Een bevestiging van een reparatieverzoek
    gloss: Uw reparatieverzoek is geregistreerd. De reparateur komt morgen om 10 uur 's ochtends. Zorg dat u thuis bent.
    note: Een korte officiële bevestiging in neutrale schrijftaal, al bevat ze nog het alledaagse spreektaalwoord *میاد* en *خونه*.
  fa.a2.unit13.lesson04.teach.since_when:
    title: Vragen sinds wanneer
    gloss: Sinds wanneer is het al zo?
    note: '*از کی این‌طوریه؟* vraagt hoe lang een probleem al speelt.'
  fa.a2.unit13.lesson04.teach.turn01:
    title: سارا meldt het probleem
    gloss: سارا zegt hallo en dat de leiding in haar badkamer lekt.
    note: Hergebruikt het duurvormpatroon uit les 2.
  fa.a2.unit13.lesson04.teach.turn02:
    title: سرایدار vraagt sinds wanneer
    gloss: De huismeester vraagt sinds wanneer het al zo is.
    note: Hergebruikt de openingsvraag van deze les.
  fa.a2.unit13.lesson04.teach.turn03:
    title: سارا noemt de duur en geeft meer details
    gloss: 'سارا zegt: sinds gisteren. Er loopt water over de vloer.'
    note: '*از دیروز* (sinds gisteren) geeft de duur aan; een tweede zin voegt een detail toe.'
  fa.a2.unit13.lesson04.teach.turn04:
    title: سرایدار stemt in om te komen
    gloss: 'De huismeester zegt: goed, ik kom morgenochtend langs om het te repareren.'
    note: '*میام* (spreektaal voor *می‌آیم*, ik kom) geeft zijn eigen plan aan.'
  fa.a2.unit13.lesson04.teach.turn05:
    title: سارا bevestigt dat ze thuis is
    gloss: سارا zegt bedankt, ze is tot 11 uur thuis.
    note: '*خونه‌ام* (spreektaal voor *خانه هستم*, ik ben thuis) geeft aan wanneer ze beschikbaar is.'
  fa.a2.unit13.lesson04.teach.turn06:
    title: سرایدار bevestigt
    gloss: 'De huismeester zegt: prima, tot dan.'
    note: '*می‌بینمتون* (ik zie u / jullie) sluit het gesprek beleefd af.'
