course:
  title: Farsi in het Nederlands A1
  description: 'Perzisch (Iraans) voor beginners: woordenschat over eten en drinken, beleefd bestellen in een restaurant, vragen over de menukaart en aanbevelingen, hoeveelheden en restaurantetiquette, inclusief het vragen om de rekening.'
units:
  fa.a1.unit06.food:
    title: Eten en een maaltijd bestellen
lessons:
  fa.a1.unit06.lesson01.food_and_drink_vocabulary:
    title: Eten en drinken
  fa.a1.unit06.lesson02.polite_ordering_register:
    title: Beleefd bestellen
  fa.a1.unit06.lesson03.menu_and_recommendation:
    title: Vraag naar de menukaart en om een aanbeveling
  fa.a1.unit06.lesson04.quantities:
    title: Specifieke hoeveelheden bestellen
  fa.a1.unit06.lesson05.restaurant_etiquette:
    title: Restaurantetiquette en de rekening
  fa.a1.unit06.lesson06.restaurant_dialogue:
    title: Een volledig gesprek in het restaurant
teaching:
  fa.a1.unit06.lesson01.teach.naan:
    title: Brood
    gloss: brood
    note: نان hoort bij elke Iraanse maaltijd; het is vaak plat brood dat bij bijna alles wordt geserveerd.
    example_gloss: Ik hou van brood.
  fa.a1.unit06.lesson01.teach.berenj:
    title: Rijst
    gloss: rijst
    note: برنج is een centraal onderdeel van de meeste Iraanse hoofdgerechten.
    example_gloss: Rijst met kip is lekker.
  fa.a1.unit06.lesson01.teach.morgh:
    title: Kip
    gloss: kip
    note: مرغ betekent zowel de vogel als het vlees.
    example_gloss: Ik eet kip.
  fa.a1.unit06.lesson01.teach.ab:
    title: Water
    gloss: water
    note: آب is het gewone woord voor water.
    example_gloss: Ik wil water.
  fa.a1.unit06.lesson01.teach.chai:
    title: Thee
    gloss: thee
    note: چای is het drankje dat je in Iran bijna overal aangeboden krijgt, en kwam al voor in de taarof-les van Unit 1.
    example_gloss: Een thee, alstublieft.
  fa.a1.unit06.lesson01.teach.ghahve:
    title: Koffie
    gloss: koffie
    note: قهوه wordt in Iraanse steden steeds gewoner, naast thee.
    example_gloss: De koffie is heet.
  fa.a1.unit06.lesson01.teach.mive:
    title: Fruit
    gloss: fruit
    note: میوه is een algemeen woord voor alle soorten fruit.
    example_gloss: Ik hou van fruit.
  fa.a1.unit06.lesson01.teach.va_ya:
    title: En / of
    gloss: و (en), یا (of)
    note: Beide zijn gewone verbindingswoorden om eten en drinken in een bestelling aan elkaar te koppelen.
    target_text: و (en)، یا (of)
  fa.a1.unit06.lesson02.teach.mikhastam_chai:
    title: Beleefd thee bestellen
    gloss: Ik wil graag een thee.
    note: می‌خواستم is letterlijk een verleden tijd van 'willen', maar werkt als een beleefd, iets zachter verzoek. Dat is het gepaste register voor een ober of winkelier die je niet kent.
  fa.a1.unit06.lesson02.teach.lotfan:
    title: Alsjeblieft
    gloss: alsjeblieft
    note: لطفاً kun je bij bijna elk verzoek gebruiken om het zachter te maken.
    example_gloss: Help me alstublieft.
  fa.a1.unit06.lesson02.teach.mikham_informal:
    title: Informeel thee bestellen
    gloss: Ik wil een thee.
    note: یه چای می‌خوام gebruikt het informele spreektaalwoord یه (een) en می‌خوام (ik wil). Gebruik dit alleen bij een goede vriend of familielid, niet bij een ober die je net ontmoet.
  fa.a1.unit06.lesson02.teach.register_note:
    title: Het juiste werkwoord kiezen om te bestellen
    gloss: Gebruik می‌خواستم bij een onbekende of ober; gebruik می‌خوام alleen bij een goede vriend.
    note: Dit is de variant voor bestellen van het verschil in register dat al bij de begroetingen in Unit 1 aan bod kwam.
  fa.a1.unit06.lesson02.teach.mikhastam_naan:
    title: Beleefd brood bestellen
    gloss: Ik wil graag wat brood.
    note: Hetzelfde patroon met می‌خواستم werkt bij elk woord voor eten of drinken.
  fa.a1.unit06.lesson03.teach.menu_word:
    title: Menukaart
    gloss: menukaart
    note: منو is een leenwoord, dat net als in het Nederlands (menu) wordt gebruikt.
    example_gloss: De menukaart, alstublieft.
  fa.a1.unit06.lesson03.teach.menu_question:
    title: Om een menukaart vragen
    gloss: Heeft u een menukaart?
    note: منو دارید؟ vraagt letterlijk 'hebt u een menukaart?', de gewone manier om erom te vragen.
  fa.a1.unit06.lesson03.teach.recommend_question:
    title: Om een aanbeveling vragen
    gloss: Wat raadt u aan?
    note: چی توصیه می‌کنید؟ is een natuurlijke, veelgebruikte vraag aan een ober.
  fa.a1.unit06.lesson03.teach.waiter_question:
    title: Wat de ober jou vraagt
    gloss: Wat wilt u?
    note: چی میل دارید؟ is de beleefde, standaardmanier waarop een ober het bestelgesprek opent.
  fa.a1.unit06.lesson03.teach.jooje_kabab:
    title: Kipkebab
    gloss: kipkebab
    note: جوجه‌کباب (gemarineerde gegrilde kip) is een van de meest voorkomende gerechten op een Iraanse menukaart.
    example_gloss: Ik bestel de kipkebab.
  fa.a1.unit06.lesson03.teach.khoobe:
    title: De ober raadt het gerecht aan
    gloss: De kipkebab is vandaag erg lekker.
    note: خوبه is de informele gesproken samentrekking van خوب است, natuurlijk in een losse aanbeveling van een ober.
  fa.a1.unit06.lesson03.teach.bale_befarmaeed:
    title: Ja, alstublieft
    gloss: Ja, alstublieft.
    note: بله betekent ja; بفرمایید (al gezien in de taarof-les van Unit 1) gebruik je hier opnieuw bij het aanreiken van iets, zoals een menukaart.
  fa.a1.unit06.lesson04.teach.yek_livan:
    title: Een glas thee
    gloss: een glas thee
    note: لیوان (glas) is het telwoord voor dranken die in een glas worden geserveerd.
  fa.a1.unit06.lesson04.teach.do_ta_naan:
    title: Twee stukken brood
    gloss: twee stukken brood
    note: تا is een telwoord dat na een getal komt bij de meeste gewone telbare dingen, hier twee stukken brood.
  fa.a1.unit06.lesson04.teach.yek_boshghab:
    title: Een bord rijst
    gloss: een bord rijst
    note: بشقاب (bord) is het telwoord voor eten dat op een bord wordt geserveerd.
  fa.a1.unit06.lesson04.teach.combined_order:
    title: Een hele bestelling samenstellen
    gloss: Een bord rijst en twee stukken brood, alstublieft.
    note: Je kunt meerdere hoeveelheden in één bestelling met و (en) aan elkaar verbinden.
  fa.a1.unit06.lesson04.teach.se_ta:
    title: Het telwoord تا
    gloss: 'تا komt na een getal bij telbare dingen: دو تا (twee), سه تا (drie).'
    note: Dit is hetzelfde algemene telpatroon als bij de getallen in Unit 3, nu toegepast op eten bestellen.
  fa.a1.unit06.lesson05.teach.hesab_word:
    title: De rekening
    gloss: de rekening
    note: صورت‌حساب is het standaardwoord voor een restaurantrekening.
    example_gloss: De rekening, alstublieft.
  fa.a1.unit06.lesson05.teach.bill_request:
    title: Om de rekening vragen
    gloss: Kunt u de rekening brengen, alstublieft?
    note: صورت‌حساب رو لطف می‌کنید؟ is een beleefde, natuurlijke manier om in een restaurant om de rekening te vragen.
  fa.a1.unit06.lesson05.teach.khoshmaze:
    title: Zeggen dat het eten heerlijk was
    gloss: Het was erg lekker.
    note: خیلی خوشمزه بود is een natuurlijk compliment aan een ober of gastheer na de maaltijd.
  fa.a1.unit06.lesson05.teach.nooshe_jan:
    title: Smakelijk eten
    gloss: Eet smakelijk
    note: نوش جان zeg je tegen iemand die eet of bijna gaat eten, ongeveer als 'eet smakelijk'. De persoon die eet zegt het niet over het eigen eten.
  fa.a1.unit06.lesson05.teach.chashm:
    title: De beleefde reactie van een ober
    gloss: Komt eraan.
    note: چشم، الان میارم is een respectvolle manier waarop personeel een verzoek bevestigt en zegt het meteen te brengen.
  fa.a1.unit06.lesson06.teach.restaurant_word:
    title: Restaurant
    gloss: restaurant
    note: رستوران is het gewone woord voor restaurant en vormt de setting van de dialoog in deze unit.
    example_gloss: Dit restaurant is goed.
  fa.a1.unit06.lesson06.teach.turn01:
    title: De ober begroet de klant
    gloss: De ober heet de klant welkom en vraagt wat hij of zij wil hebben.
    note: چی میل دارید؟ is dezelfde beleefde openingsvraag als in lesson03.
  fa.a1.unit06.lesson06.teach.turn02:
    title: De klant vraagt om een menukaart
    gloss: De klant groet de ober en vraagt om een menukaart.
    note: منو دارید؟ opent het gesprek over de bestelling.
  fa.a1.unit06.lesson06.teach.turn03:
    title: De ober geeft de menukaart
    gloss: De ober bevestigt en overhandigt de menukaart.
    note: بفرمایید is hetzelfde beleefde aanbiedingswoord als in Unit 1, hier gebruikt terwijl je iemand iets overhandigt.
  fa.a1.unit06.lesson06.teach.turn04:
    title: De klant vraagt om een aanbeveling
    gloss: De klant vraagt wat de ober aanbeveelt.
    note: چی توصیه می‌کنید؟ komt uit lesson03.
  fa.a1.unit06.lesson06.teach.turn05:
    title: De ober beveelt een gerecht aan
    gloss: De ober zegt dat de kipkebab vandaag erg lekker is.
    note: جوجه‌کباب امروز خیلی خوبه gebruikt de informele vorm خوبه, die gewoon is bij aanbevelingen in gesproken taal.
  fa.a1.unit06.lesson06.teach.turn06:
    title: De klant doet een volledige bestelling
    gloss: De klant stemt in en bestelt kipkebab met rijst, plus een thee.
    note: Hier wordt می‌خواستم gebruikt, wat past bij een ober die de klant niet persoonlijk kent.
  fa.a1.unit06.lesson06.teach.turn07:
    title: De ober bevestigt de bestelling
    gloss: De ober zegt dat hij het meteen komt brengen.
    note: چشم، الان میارم komt uit lesson05.
  fa.a1.unit06.lesson06.teach.turn08:
    title: De klant complimenteert het eten en vraagt om de rekening
    gloss: De klant zegt dat het heerlijk was en vraagt om de rekening.
    note: Beide zinnen gebruiken direct de woordenschat uit lesson05.
  fa.a1.unit06.lesson06.teach.turn09:
    title: De ober brengt de rekening
    gloss: De ober stemt toe en zegt dat hij het meteen komt brengen.
    note: البته (natuurlijk) is hier een gewoon beleefd bevestigend antwoord.
