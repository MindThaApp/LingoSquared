teaching:
  fa.a2.unit49.lesson01.teach.event_words:
    title: Plekken en evenementen om iemand voor uit te nodigen
    gloss: bioscoop, concert, theater, verjaardag, kaartje
    note: '*کنسرت* is een concert en *تئاتر* is een toneelstuk of het theater. *بلیت* is het kaartje dat je voor een evenement kunt hebben.'
    example_gloss:
    - Ik heb twee concertkaartjes.
    - Het toneelstuk was heel goed.
    - Vrijdag ga ik naar de bioscoop.
    - Ik heb een cadeau gekocht voor de verjaardag van mijn vriend.
  fa.a2.unit49.lesson01.teach.invite_words:
    title: Uitnodiging en “zullen we gaan”
    gloss: uitnodiging, laten we gaan / zullen we gaan
    note: '*دعوت* is een uitnodiging. *بریم* (“laten we gaan / zullen we gaan”) sluit een vriendelijk voorstel af, vaak met *با هم* (“samen”).'
    example_gloss:
    - Bedankt voor de uitnodiging.
    - Nima nodigt Sara uit.
    - Zullen we samen naar de bioscoop gaan?
    - Zullen we vanavond naar het park gaan?
  fa.a2.unit49.lesson01.teach.more_events:
    title: Meer soorten bijeenkomsten
    gloss: feest, picknick, samenzijn, viering
    note: '*مهمونی* is een feest, *پیک‌نیک* is een picknick, *دورهمی* is een informeel samenzijn en *جشن* is een viering.'
    example_gloss:
    - Vanavond hebben we een feest.
    - Vrijdag gaan we picknicken.
    - Zaterdag hebben we een viering en een gezellig samenzijn.
  fa.a2.unit49.lesson01.teach.invitation_extras:
    title: Meer woorden voor uitnodigingen
    gloss: lunch, uitstapje, uitnodigingskaart
    note: '*ناهار* is lunch, *گردش* is een uitstapje en *دعوتنامه* is een uitnodigingskaart of schriftelijke uitnodiging.'
    example_gloss:
    - Vrijdag lunchen we samen.
    - Zullen we samen een uitstapje maken?
    - Ik heb een uitnodigingskaart.
  fa.a2.unit49.lesson01.teach.invite_forms:
    title: Drie makkelijke manieren om uit te nodigen
    gloss: Wil je naar een concert komen? Kom je met me mee naar het theater? Zullen we samen naar de bioscoop gaan?
    note: Alle drie zijn vragen. *می‌خوای بیای ...؟* vraagt of de ander wil komen. *با من میای ...؟* vraagt het direct. *با هم بریم ...؟* stelt voor om samen te gaan. Zet er eerst een tijdwoord voor (*فردا*, *جمعه شب*), zodat de uitnodiging duidelijk is.
  fa.a2.unit49.lesson02.teach.accept_words:
    title: Woorden om ja te zeggen
    gloss: ja, zeker, wat fijn, geweldig, oké, ik kom
    note: '*آره* en *باشه* betekenen ja. *حتما* voegt “zeker” toe. *چه خوب* en *عالیه* laten zien dat je blij bent.'
    example_gloss:
    - Ja, ik kom zeker.
    - Wat fijn! Bedankt.
    - Oké, acht uur is goed.
    - Geweldig! Ik kom zaterdag.
  fa.a2.unit49.lesson02.teach.detail_words:
    title: Om details vragen
    gloss: hoe laat, waar, wanneer
    note: 'Als je ja hebt gezegd, vraag je naar het detail dat je nodig hebt: *ساعت چند؟* (hoe laat), *کجا؟* (waar), *کی؟* (wanneer).'
    example_gloss:
    - Hoe laat gaan we?
    - Waar gaan we heen?
    - Wanneer gaan we?
  fa.a2.unit49.lesson02.teach.accept_forms:
    title: Ja zeggen en misschien zeggen
    gloss: Bedankt voor de uitnodiging! Ik kom zeker; ik kan komen; misschien kan ik komen
    note: 'Een duidelijk ja is *حتما میام*. *می‌تونم بیام* zegt dat je kunt komen. *شاید بتونم بیام* is een voorzichtig “misschien”: het is geen belofte. Begin met *ممنون از دعوت* om beleefd te zijn.'
  fa.a2.unit49.lesson03.teach.decline_words:
    title: Woorden om beleefd nee te zeggen
    gloss: helaas, sorry, ik kan niet, maar
    note: Maak een weigering zachter met *متاسفانه* of *ببخشید* vóór *نمی‌تونم بیام*.
    example_gloss:
    - Helaas kan ik niet komen.
    - Sorry, vrijdag kan ik niet.
    - Bedankt, maar ik kan niet.
  fa.a2.unit49.lesson03.teach.reason_words:
    title: Redenen om nee te zeggen
    gloss: ik heb werk, ik heb een afspraak, ik heb een vergadering, ik ben ziek, ik moet studeren, ik moet naar de les
    note: '*باید* (“moeten”) staat voor een kort werkwoord: *باید درس بخونم*, *باید برم کلاس*. Andere redenen gebruiken *دارم*: *کار دارم*, *قرار دارم*.'
    example_gloss:
    - Vrijdag heb ik werk.
    - Vanavond heb ik een afspraak.
    - Morgen heb ik een vergadering.
    - Ik ben vandaag ziek.
    - Ik moet studeren.
    - Ik moet naar de les.
  fa.a2.unit49.lesson03.teach.future_reasons:
    title: Een reden over je plannen
    gloss: want morgen ga ik naar het noorden, want in het weekend ga ik naar Teheran
    note: 'Een reden kan een plan zijn: *چون* plus *می‌خوام برم* en een plaats.'
    example_gloss:
    - Want morgen ga ik naar het noorden.
    - Want in het weekend ga ik naar Teheran.
  fa.a2.unit49.lesson03.teach.host_schedule:
    title: Gasten ontvangen en je agenda
    gloss: gastheer, gast, bezig, vrij
    note: '*میزبان* is de gastheer of gastvrouw en *مهمون* is een gast. Gebruik *مشغولم* als je bezig bent en *آزادم* als je vrij bent.'
    example_gloss:
    - Sara is de gastvrouw van het feest.
    - Ik heb vanavond een gast.
    - Op vrijdag ben ik bezig en op zaterdag ben ik vrij.
  fa.a2.unit49.lesson03.teach.hosting_extras:
    title: Gasten ontvangen en tijd hebben
    gloss: gastheerschap, gasten onthalen, kans / tijd
    note: '*میزبانی* is gasten ontvangen. *پذیرایی* is gasten onthalen of bedienen. *فرصت* betekent een kans of genoeg tijd om iets te doen.'
    example_gloss:
    - Sara ontvangt gasten.
    - Sara onthaalt de gast.
    - Ik heb zaterdag tijd.
  fa.a2.unit49.lesson03.teach.decline_pattern:
    title: Nee zeggen met een reden
    gloss: Sorry, ik kan niet komen, want ik moet studeren
    note: 'Een beleefde weigering heeft drie delen: een verontschuldiging (*ببخشید* of *متاسفانه*), de weigering (*نمی‌تونم بیام*) en de reden met *چون*. De reden kan ook vooraan staan: *چون باید درس بخونم، نمی‌تونم بیام*.'
  fa.a2.unit49.lesson04.teach.alt_words:
    title: Een andere dag voorstellen
    gloss: maar, wat dacht je van zaterdag, volgende week, een andere keer
    note: '*ولی* (“maar”) verbindt de weigering met het nieuwe idee. *شنبه چطوره؟* stelt een andere dag voor.'
    example_gloss:
    - Op vrijdag kan ik niet, maar op zaterdag wel.
    - Wat dacht je van zaterdag?
    - Volgende week kan ik wel.
    - We gaan een andere keer.
  fa.a2.unit49.lesson04.teach.if_plan:
    title: Als je tijd hebt
    gloss: als je tijd hebt
    note: '*اگه* (“als”) plus de tegenwoordige tijd is een vriendelijke voorwaarde: *اگه وقت داری، با هم می‌ریم*.'
    example_gloss:
    - Als je tijd hebt, gaan we samen.
    - Als je zaterdag tijd hebt, kom dan.
  fa.a2.unit49.lesson04.teach.alt_pattern:
    title: Nee, met een reden en een ander voorstel
    gloss: Ik kan niet komen, want ik moet werken. Maar zaterdag kan ik wel
    note: 'Een goede weigering stopt niet bij nee. Geef de reden met *چون* en stel dan een andere tijd voor met *ولی*: *ولی شنبه می‌تونم*. Je kunt ook vragen: *شنبه چطوره؟*'
  fa.a2.unit49.lesson05.teach.reading_invite:
    title: Sara's uitnodiging
    gloss: Hoi Nima! Vrijdagavond heb ik twee concertkaartjes. Wil je met me mee? We gaan om acht uur. Tot ziens, Sara
    note: Zoek het evenement, de dag en het tijdstip.
  fa.a2.unit49.lesson05.teach.reading_reply:
    title: Nima's antwoord
    gloss: Hoi Sara! Bedankt voor de uitnodiging. Helaas kan ik vrijdag niet komen, want ik moet studeren. Maar zaterdag kan ik wel. Zullen we zaterdagavond samen naar het theater gaan? Tot ziens, Nima
    note: Zoek het bedankje, de weigering, de reden en het nieuwe voorstel.
  fa.a2.unit49.lesson06.teach.turn01:
    title: Sara nodigt Nima uit
    gloss: Hoi Nima! Wil je vrijdagavond met me mee naar een concert?
    note: Sara nodigt uit met *می‌خوای*.
  fa.a2.unit49.lesson06.teach.turn02:
    title: Nima bedankt haar en slaat af
    gloss: Bedankt voor de uitnodiging! Maar helaas kan ik vrijdag niet, want ik moet studeren.
    note: Bedankt, weigering en reden in één beurt.
  fa.a2.unit49.lesson06.teach.turn03:
    title: Sara stelt een andere dag voor
    gloss: Wat dacht je van zaterdag? Wil je naar het theater?
    note: Een nieuwe dag en een nieuw evenement.
  fa.a2.unit49.lesson06.teach.turn04:
    title: Nima stemt toe en vraagt naar de tijd
    gloss: Ja, zaterdag kan ik. Hoe laat?
    note: Nima stemt toe en vraagt naar een detail.
  fa.a2.unit49.lesson06.teach.turn05:
    title: Sara noemt de tijd
    gloss: Om acht uur.
    note: Een kort antwoord.
  fa.a2.unit49.lesson06.teach.turn06:
    title: Nima bevestigt
    gloss: Top! Dan kom ik zaterdag. Tot dan!
    note: '*پس* (“dan”) bevestigt het plan.'
