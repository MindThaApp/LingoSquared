teaching:
  fa.a2.unit46.lesson01.teach.things:
    title: Dingen om over te praten
    gloss: boek, cadeau, tas
    note: '*یه* is het gesproken «een».'
    example_gloss:
    - Ik heb een boek.
    - Ik heb een cadeau.
    - Ik heb een tas.
  fa.a2.unit46.lesson01.teach.verbs:
    title: Werkwoorden in de verleden tijd
    gloss: ik kocht, ik zag, ik las, ik kreeg, (lijdend voorwerp-markering)
    note: '*رو* komt na datgene waar het werkwoord op slaat. De verleden-tijdsuitgangen zijn *-م* (ik), *-ی* (jij) en niets (hij / zij).'
    example_gloss:
    - Ik heb het boek gekocht.
    - Ik heb het cadeau gezien.
    - Ik heb het boek gelezen.
    - Ik heb de tas gekregen.
  fa.a2.unit46.lesson01.teach.clitic:
    title: Werkwoord plus ش
    gloss: ik heb het gekocht, ik heb het gezien, ik heb het gelezen, ik heb het gekregen
    note: 'De uitgang *-ش* staat voor de zaak of persoon die al genoemd is: «het», «hem» of «haar». Hij komt helemaal aan het eind van het werkwoord.'
    example_gloss:
    - Gisteren heb ik het gekocht.
    - Gisteren heb ik het gezien.
    - Gisteren heb ik het gelezen.
    - Gisteren heb ik het gekregen.
  fa.a2.unit46.lesson01.teach.you:
    title: Vragen «heb je het gezien?»
    gloss: jij zag, jij zag het, jij kreeg
    note: '*دیدی* is «jij zag»; voeg *-ش* toe en je hebt «jij zag het».'
    example_gloss:
    - Heb je het cadeau gezien?
    - Waar heb je het gezien?
    - Heb je de tas gekregen?
  fa.a2.unit46.lesson01.teach.rule:
    title: Noem het één keer, gebruik daarna ش
    gloss: Ik heb het boek gekocht; ik heb het gekocht
    note: 'Noem de zaak de eerste keer met *رو*. Laat daarna het zelfstandig naamwoord en *رو* weg en voeg *-ش* aan het werkwoord toe: *کتاب رو خریدم*, daarna *خریدمش*.'
  fa.a2.unit46.lesson02.teach.people:
    title: Mensen
    gloss: mijn vriend(in), mijn vrienden, de kinderen
    note: '*دوستم* is «mijn vriend(in)» en *دوستام* is «mijn vrienden».'
    example_gloss:
    - Ik heb mijn vriend gezien.
    - Ik heb mijn vrienden gezien.
    - Ik heb de kinderen gezien.
  fa.a2.unit46.lesson02.teach.them:
    title: «Hen» en «jou» zeggen
    gloss: ik heb hen gezien, ik heb jou gezien
    note: De uitgang *-شون* betekent «hen»; *-ت* betekent «jou». Beide voeg je aan het werkwoord toe, net als *-ش*.
    example_gloss:
    - Gisteren heb ik hen gezien.
    - Gisteren heb ik jou gezien.
  fa.a2.unit46.lesson02.teach.when:
    title: Gisteren en waar
    gloss: gisteren, waar
    note: '*دیروز* is «gisteren»; *کجا* is «waar».'
    example_gloss:
    - Gisteren heb ik jou gezien.
    - Waar heb je het gezien?
  fa.a2.unit46.lesson02.teach.three:
    title: Drie uitgangen
    gloss: ik zag hem / haar / het; ik zag hen; ik zag jou
    note: '*-ش* is één persoon of zaak, *-شون* is meer dan één, en *-ت* is «jou». Gebruik *-شون* voor meer dan één persoon of zaak.'
  fa.a2.unit46.lesson03.teach.actions:
    title: Geven, teruggeven, lenen
    gloss: ik gaf, terug, ik leende
    note: '*پس دادم* is «ik gaf terug» (teruggegeven); *قرض گرفتم* is «ik heb geleend».'
    example_gloss:
    - Ik heb het boek gegeven.
    - Ik heb het boek teruggegeven.
    - Ik heb het boek geleend.
  fa.a2.unit46.lesson03.teach.fused:
    title: Voorzetsel plus ش
    gloss: aan hem / haar, van hem / haar, voor hem / haar, met hem / haar
    note: 'In gesproken taal smelten *به، از، برای، با* samen met de persoonsuitgang: *بهش, ازش, براش, باهاش*. Ze verwijzen terug naar een persoon die al genoemd is.'
    example_gloss:
    - Ik heb het boek aan hem / haar gegeven.
    - Ik heb het van hem / haar geleend.
    - Ik heb het cadeau voor hem / haar gekocht.
    - Ik ben met hem / haar meegegaan.
  fa.a2.unit46.lesson03.teach.me:
    title: Aan mij, voor mij
    gloss: aan mij, voor mij
    note: Met *-م* betekenen dezelfde woorden «aan mij» en «voor mij».
    example_gloss:
    - Hij / zij heeft het aan mij gegeven.
    - Hij / zij heeft het voor mij gekocht.
  fa.a2.unit46.lesson03.teach.names:
    title: Eerst de persoon noemen
    gloss: Nima, Sara, ik ging
    note: 'Noem eerst de persoon en verwijs er daarna naar terug: *از نیما قرض گرفتم*, daarna *ازش*.'
    example_gloss:
    - Ik heb het van Nima geleend.
    - Ik ben met Sara meegegaan.
  fa.a2.unit46.lesson03.teach.rule:
    title: Voorzetsels met uitgang
    gloss: Ik heb van Nima geleend; ik heb van hem geleend
    note: Vervang *از نیما* door *ازش*, *با سارا* door *باهاش*, *برای مینا* door *براش*. De persoon is al bekend, dus een naam is niet nodig.
  fa.a2.unit46.lesson04.teach.questions:
    title: Ernaar vragen
    gloss: heb je het gekocht, heb je het gelezen, heb je het gekregen
    note: 'Voor «jij» is de verleden-tijdsuitgang *-ی* en daarna *-ش*: *خریدی* wordt *خریدیش*.'
    example_gloss:
    - Heb je het cadeau gekocht?
    - Heb je het gisteren gekocht?
    - Heb je het gisteren gelezen?
    - Heb je het gisteren gekregen?
  fa.a2.unit46.lesson04.teach.negative:
    title: Nee zeggen
    gloss: ik heb het niet gezien, ik heb het niet gekocht, ik heb het niet gelezen, ik heb het niet gekregen
    note: 'Zet *ن* voor het werkwoord in de verleden tijd: *دیدم* wordt *ندیدم*, en *-ش* blijft aan het eind staan: *ندیدمش*.'
    example_gloss:
    - Gisteren heb ik het niet gezien.
    - Gisteren heb ik het niet gekocht.
    - Gisteren heb ik het niet gelezen.
    - Gisteren heb ik het niet gekregen.
  fa.a2.unit46.lesson04.teach.answers:
    title: Ja en nee
    gloss: ja, nee
    note: '*آره* is het gesproken «ja».'
    example_gloss:
    - Ja, ik heb het gezien.
    - Nee, ik heb het niet gezien.
  fa.a2.unit46.lesson04.teach.rule:
    title: Korte antwoorden
    gloss: Heb je het boek gelezen? Ja, ik heb het gelezen. Nee, ik heb het niet gelezen.
    note: 'Een kort antwoord heeft geen zelfstandig naamwoord nodig. Herhaal het werkwoord met *-ش*: *آره، خوندمش* of *نه، نخوندمش*.'
  fa.a2.unit46.lesson05.teach.words:
    title: Woorden voor de tekst
    gloss: verjaardag, was, winkel, in, daarna, blij, werd, ook, gaf
    note: '*خوشحال شد* is «werd blij». *هم* betekent «ook».'
    example_gloss:
    - Gisteren was de verjaardag van Nima.
    - In de winkel zag ik een boek.
    - Daarna heb ik hem het boek gegeven.
    - Hij werd erg blij.
    - Nima gaf ook een tas.
  fa.a2.unit46.lesson05.teach.reading:
    title: Nima's verjaardag
    gloss: Gisteren was Nima's verjaardag. In de winkel zag ik een boek en ik kocht het. Daarna gaf ik hem het boek. Hij was heel blij. Nima gaf mij ook een tas.
    note: Lees de tekst eerst één keer om te begrijpen wat er gebeurt. Lees hem daarna nog een keer en kijk waar elke ش naar verwijst.
  fa.a2.unit46.lesson06.teach.turn01:
    title: Sara vraagt naar het boek
    gloss: 'Sara: Nima, heb je het boek gelezen?'
    note: Het zelfstandig naamwoord *کتاب* wordt maar één keer genoemd, met *رو*.
  fa.a2.unit46.lesson06.teach.turn02:
    title: Nima antwoordt
    gloss: 'Nima: Ja, ik heb het gelezen. Het was heel goed.'
    note: '*خوندمش* verwijst terug naar het boek.'
  fa.a2.unit46.lesson06.teach.turn03:
    title: Sara vraagt naar het cadeau
    gloss: 'Sara: Heb je het cadeau voor Mina gekocht?'
    note: '*مینا* is een naam; het cadeau wordt maar één keer genoemd.'
  fa.a2.unit46.lesson06.teach.turn04:
    title: Nima antwoordt
    gloss: 'Nima: Ja, ik heb het gekocht en gisteren heb ik het aan haar gegeven.'
    note: '*خریدمش* verwijst naar het cadeau en *بهش* verwijst naar Mina.'
  fa.a2.unit46.lesson06.teach.turn05:
    title: Sara vraagt naar Mina
    gloss: 'Sara: Was ze blij?'
    note: Het onderwerp is duidelijk uit het gesprek.
  fa.a2.unit46.lesson06.teach.turn06:
    title: Nima antwoordt
    gloss: 'Nima: Ja, ze was heel blij.'
    note: Een kort, natuurlijk antwoord.
