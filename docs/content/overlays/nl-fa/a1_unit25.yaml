teaching:
  fa.a1.unit25.lesson01.teach.oo_review:
    title: Hij / zij
    gloss: hij / zij
    note: '*او* komt hier terug als onderwerp in beschrijvingen van uiterlijk.'
  fa.a1.unit25.lesson01.teach.ghad_review:
    title: Lengte
    gloss: lengte
    note: '*قد* komt hier los terug. *قدش* voegt het bezitsachtervoegsel *-ش* toe (zijn/haar lengte), hetzelfde patroon als *امتحانش* in Unit 20.'
    example_gloss: Nima is lang.
  fa.a1.unit25.lesson01.teach.boland_word:
    title: Lang
    gloss: lang
    note: '*بلند* betekent lang (of hoog). *قدش بلنده* betekent letterlijk ''zijn/haar lengte is hoog'' -- de natuurlijke spreektaalmanier om te zeggen dat iemand lang is.'
    example_gloss: Hij is lang.
  fa.a1.unit25.lesson01.teach.kotah_word:
    title: Klein
    gloss: klein
    note: '*کوتاه* betekent klein (van gestalte) of kort.'
    example_gloss: Hij is klein.
  fa.a1.unit25.lesson02.teach.mo_word:
    title: Haar
    gloss: haar
    note: '*مو* betekent haar (op het hoofd). *موی* is de ezafe-vorm (verbindingsvorm) vóór een bijvoeglijk naamwoord, zoals in *موی بلند* (lang haar).'
    example_gloss: Hij heeft lang haar.
  fa.a1.unit25.lesson02.teach.moohash_word:
    title: Zijn / haar haar
    gloss: zijn / haar haar
    note: '*موهاش* combineert het meervoud *موها* (haren) met het bezitsachtervoegsel *-ش* -- ''zijn/haar haar''.'
  fa.a1.unit25.lesson02.teach.meshki_word:
    title: Zwart
    gloss: zwart
    note: '*مشکی* is het gewone spreektaalwoord voor zwart haar of zwarte ogen -- natuurlijker dan *سیاه* uit Unit 20, dat beter bij kleding past dan bij haar.'
    example_gloss: Haar haar is zwart.
  fa.a1.unit25.lesson02.teach.bolond_word:
    title: Blond
    gloss: blond
    note: '*بلوند* (een leenwoord) betekent blond.'
    example_gloss: Haar haar is blond.
  fa.a1.unit25.lesson03.teach.cheshm_word:
    title: Oog
    gloss: oog
    note: '*چشم* betekent oog. *چشمای* is de spreektaalvorm van meervoud + ezafe (ogen van...), zoals in *چشمای آبی* (blauwe ogen).'
    example_gloss: Hij heeft bruine ogen.
  fa.a1.unit25.lesson03.teach.cheshmash_word:
    title: Zijn / haar ogen
    gloss: zijn / haar ogen
    note: '*چشماش* combineert het spreektaalmeervoud *چشما* met het bezitsachtervoegsel *-ش* -- ''zijn/haar ogen''. Let op: *چشماش آبیه* heeft het enkelvoudige einde *-ه*, ook al is *چشما* meervoud. Dat is normaal in het Perzisch, waar meervoudige zaken die geen mensen zijn meestal een enkelvoudig werkwoord krijgen.'
  fa.a1.unit25.lesson03.teach.ghahveei_word:
    title: Bruin
    gloss: bruin
    note: '*قهوه‌ای* (letterlijk ''koffiekleurig'') betekent bruin.'
    example_gloss: Haar ogen zijn bruin.
  fa.a1.unit25.lesson03.teach.sabz_word:
    title: Groen
    gloss: groen
    note: '*سبز* betekent groen.'
    example_gloss: Haar ogen zijn groen.
  fa.a1.unit25.lesson03.teach.abi_review:
    title: Blauw
    gloss: blauw
    note: '*آبی* komt hier terug voor oogkleur.'
    example_gloss: Haar ogen zijn blauw.
  fa.a1.unit25.lesson04.teach.man_review:
    title: Ik
    gloss: ik
    note: '*من*, dat je al goed kent, komt hier terug om jezelf te beschrijven.'
    example_gloss: Ik heb bruin haar.
  fa.a1.unit25.lesson04.teach.daram_review:
    title: Ik heb / hij-zij heeft
    gloss: ik heb / hij-zij heeft
    note: '*دارم*/*داره* werken op dezelfde manier met een lichamelijk kenmerk: *موی مشکی دارم* betekent ''Ik heb zwart haar.'''
  fa.a1.unit25.lesson04.teach.eynak_word:
    title: Bril
    gloss: bril
    note: '*عینک* betekent bril.'
    example_gloss: Hij draagt een bril.
  fa.a1.unit25.lesson04.teach.mizane_word:
    title: Hij/zij draagt
    gloss: hij/zij draagt
    note: '*می‌زنه* (letterlijk ''slaat'') is het natuurlijke werkwoord voor het dragen van een bril -- *عینک می‌زنه* betekent ''draagt een bril'', een ander werkwoord dan *می‌کنم* (doen/maken) uit Unit 8/Unit 24.'
  fa.a1.unit25.lesson04.teach.che_shekliye_phrase:
    title: Hoe ziet hij/zij eruit?
    gloss: hoe ziet hij/zij eruit?
    note: '*چه شکلیه؟* betekent letterlijk ''welke vorm is het?'' -- de gangbare spreektaalvraag om te vragen hoe iemand eruitziet.'
  fa.a1.unit25.lesson04.teach.va_review:
    title: En
    gloss: en
    note: '*و* betekent ''en'' -- je kent het al uit Unit 14/Unit 24.'
    example_gloss: Hij is lang en zijn haar is zwart.
  fa.a1.unit25.lesson05.teach.nima_review:
    title: Nima
    gloss: Nima
    note: '*نیما*, al sinds Unit 11 een vast personage, komt hier terug.'
    example_gloss: Nima is een vriend van Sara.
  fa.a1.unit25.lesson05.teach.reading_text:
    title: 'Lezen: het uiterlijk van Nima'
    gloss: Nima is lang. Zijn haar is zwart en zijn ogen zijn bruin. Hij draagt een bril.
    note: Deze tekst gebruikt alle constructies uit les 1-4 -- bijna geen nieuwe woorden, je herkent ze alleen in een samenhangende tekst.
  fa.a1.unit25.lesson06.teach.maryam_name:
    title: Maryam
    gloss: Maryam
    note: '*مریم* is een nieuw personage -- een vriendin van سارا die نیما nog niet heeft ontmoet.'
    example_gloss: Maryam is een vriendin van Sara.
  fa.a1.unit25.lesson06.teach.alan_review:
    title: Nu
    gloss: nu
    note: '*الان* komt hier terug.'
    example_gloss: Maryam komt zo.
  fa.a1.unit25.lesson06.teach.miad_word:
    title: Komt
    gloss: komt
    note: '*میاد* is de spreektaalvorm van de tegenwoordige tijd van *آمدن* (komen).'
    example_gloss: Maryam komt zo.
  fa.a1.unit25.lesson06.teach.rangiye_phrase:
    title: Welke kleur is het?
    gloss: welke kleur is het?
    note: '*چه رنگیه؟* combineert *چه* (wat/welk, uit les 4) met *رنگی* (gekleurd, van *رنگ* + *-ی*) + *-ه* (is) -- ''welke kleur is het?'''
  fa.a1.unit25.lesson06.teach.bashe_mamnoon_review:
    title: Oké, bedankt
    gloss: oké, bedankt
    note: '*باشه* en *ممنون*, die je al kent, vormen hier samen een natuurlijke afsluiting.'
  fa.a1.unit25.lesson06.teach.dialogue_line1:
    title: 'Sara: Maryam komt zo.'
    gloss: Maryam komt zo.
  fa.a1.unit25.lesson06.teach.dialogue_line2:
    title: 'Nima: Hoe ziet Maryam eruit?'
    gloss: Hoe ziet Maryam eruit?
  fa.a1.unit25.lesson06.teach.dialogue_line3:
    title: 'Sara: Ze is lang en heeft zwart haar.'
    gloss: Ze is lang en haar haar is zwart.
  fa.a1.unit25.lesson06.teach.dialogue_line4:
    title: 'Nima: Welke kleur ogen heeft ze?'
    gloss: Welke kleur ogen heeft ze?
  fa.a1.unit25.lesson06.teach.dialogue_line5:
    title: 'Sara: Ze heeft bruine ogen.'
    gloss: Ze heeft bruine ogen.
  fa.a1.unit25.lesson06.teach.dialogue_line6:
    title: 'Nima: Oké, bedankt.'
    gloss: Oké, bedankt.
