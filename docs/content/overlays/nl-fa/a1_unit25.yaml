course:
  title: Farsi in het Nederlands A1
  description: 'Beginnend Iraans Farsi: de lengte van een persoon beschrijven (lang/klein), haar (lengte en kleur: zwart, blond), oogkleur (bruin, groen, blauw) en of iemand een bril draagt, vragen "Hoe ziet hij/zij eruit?", een korte leestekst over het uiterlijk van نیما en een slotdialoog tussen نیما en سارا over het herkennen van سارا''s vriendin مریم.'
