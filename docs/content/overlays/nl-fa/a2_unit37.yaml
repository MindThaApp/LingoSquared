teaching:
  fa.a2.unit37.lesson01.teach.weather_words:
    title: Weerwoorden
    gloss: weer, regen, sneeuw, zonnig, koud, warm, morgen, vandaag
    note: '*بارون* is de gewone gesproken vorm van “regen”; in zorgvuldig schrift gebruik je *باران*. Gesproken *آفتابیه*, *سرده* en *گرمه* eindigen op *-ه* voor “is”.'
    example_gloss:
    - Morgen is het zonnig.
    - Vandaag is het koud.
    - Het is warm.
  fa.a2.unit37.lesson01.teach.plan_words:
    title: Plaatsen en werkwoorden voor plannen
    gloss: park, thuis, markt, bioscoop, buiten, in, we gaan, we gaan niet, we blijven
    note: 'Voor plannen gebruik je de tegenwoordige tijd: *می‌ریم* is “we gaan”, ook als het om een plan gaat, en *نمی‌ریم* is “we gaan niet”.'
    example_gloss:
    - Morgen gaan we naar het park.
    - We blijven thuis.
    - Vandaag gaan we niet naar buiten.
  fa.a2.unit37.lesson01.teach.if_words:
    title: اگه en de werkwoorden van de voorwaarde
    gloss: als, het komt (regen komt), het is, het komt (tegenwoordige tijd)
    note: '*اگه* is de gesproken vorm van *اگر* (“als”). *بارون بیاد* betekent letterlijk “regen kome”; zo zegt men in het Farsi “het regent”.'
    example_gloss:
    - Als het sneeuwt, gaan we niet naar buiten.
    - Als het koud is, gaan we niet naar het park.
  fa.a2.unit37.lesson01.teach.subjunctive_condition:
    title: اگه plus de subjunctief
    gloss: Als het regent, gaan we niet naar het park.
    note: 'Bij een mogelijke voorwaarde zet je het werkwoord na *اگه* in de subjunctief: *بیاد*, *باشه*. Het gevolg staat in de gewone tegenwoordige tijd: *نمی‌ریم*. Zet een komma tussen de twee delen.'
  fa.a2.unit37.lesson01.teach.present_condition:
    title: اگه plus de tegenwoordige tijd
    gloss: Als het morgen regent, blijven we thuis.
    note: 'Je hoort ook de tegenwoordige tijd na *اگه*: *اگه بارون میاد*. Het betekent hetzelfde: een reële voorwaarde. In deze les maak je zelf de aanvoegende vorm (*بیاد*); de tegenwoordige vorm is om te herkennen wat je hoort.'
  fa.a2.unit37.lesson02.teach.time_tired:
    title: Tijd, moe, werk
    gloss: tijd, moe, werk, ik, wij
    note: '*وقت دارم* betekent „ik heb tijd”. Het gaat niet over hoe laat het is.'
    example_gloss:
    - Morgen heb ik tijd.
    - Vandaag heb ik geen tijd.
    - Vandaag hebben we werk.
  fa.a2.unit37.lesson02.teach.come_forms:
    title: Vormen van komen en tijd hebben
    gloss: ik kom, jij komt, ik kom niet, ik heb (aanvoegende vorm), jij hebt (aanvoegende vorm), wij zijn
    note: '*میام* is spreektaal voor „ik kom / ik zal komen”. In een voorwaarde gebruik je *داشته باشم*, *داشته باشی*, *خسته باشیم*: dit zijn de aanvoegende vormen.'
    example_gloss:
    - Kom je morgen?
    - Ik kom vandaag niet.
  fa.a2.unit37.lesson02.teach.person_endings:
    title: Kies de juiste uitgang bij de persoon
    gloss: ik heb, jij hebt, hij of zij heeft, wij hebben
    note: 'De uitgang na *داشته* verandert met de persoon: *باشم* (ik), *باشی* (jij), *باشه* (hij/zij), *باشیم* (wij). In het Perzisch laat je het voornaamwoord meestal weg, omdat de uitgang de persoon al aangeeft.'
  fa.a2.unit37.lesson02.teach.result_tense:
    title: Het gevolg staat in de tegenwoordige tijd
    gloss: Als ik tijd heb, kom ik.
    note: Het Perzisch heeft hier geen aparte toekomende vorm nodig. De tegenwoordige tijd in het gevolg, *میام*, betekent al „ik kom”.
  fa.a2.unit37.lesson03.teach.time_clause_words:
    title: Wanneer, aankomen, werk klaar, winkel
    gloss: wanneer, ik kom aan, mijn werk, klaar, wordt, winkel, open, naar, ik bel je
    note: '*وقتی* betekent „wanneer”. *کارم تموم بشه* is „mijn werk is af”. *بهت زنگ می‌زنم* is „ik bel je”.'
    example_gloss:
    - Als mijn werk klaar is, kom ik.
    - Morgen bel ik je.
  fa.a2.unit37.lesson03.teach.negative_forms:
    title: Ontkennende voorwaardevormen en gaan/blijven
    gloss: jij komt niet, het komt niet, het is niet, ik heb niet, alleen, ik ga, ik blijf
    note: 'Zet *نـ* voor het aanvoegende werkwoord om de voorwaarde ontkennend te maken: *نیای*, *نیاد*, *نباشه*, *نداشته باشم*.'
    example_gloss:
    - Ik ga alleen.
    - Vandaag blijf ik thuis.
  fa.a2.unit37.lesson03.teach.negative_condition:
    title: Een ontkennende voorwaarde
    gloss: Als je niet komt, ga ik alleen. Als het niet regent, gaan we naar het park.
    note: 'Een ontkennende voorwaarde is nog steeds een mogelijke voorwaarde. Maak het aanvoegende werkwoord ontkennend met *نـ*: *اگه نیای*, *اگه بارون نیاد*. Het gevolg kan bevestigend of ontkennend zijn.'
  fa.a2.unit37.lesson03.teach.if_vs_when:
    title: اگه is misschien, وقتی is zeker
    gloss: Als mijn werk klaar is, kom ik. Als ik tijd heb, kom ik.
    note: Gebruik *وقتی* als het gebeurtenis zeker plaatsvindt en je alleen zegt wanneer. Gebruik *اگه* als het misschien niet gebeurt. Na beide kan een aanvoegend werkwoord staan, met een gevolg in de tegenwoordige tijd.
  fa.a2.unit37.lesson04.teach.shop_words:
    title: Winkelwoorden
    gloss: bon, geld, product, kapot, korting, dit, u heeft, het is open
    note: '*جنس* is het product of artikel dat je koopt. *رسید دارید؟* is een beleefde vraag aan een klant.'
    example_gloss:
    - Dit product is kapot.
    - Heeft u de bon?
    - De winkel is vandaag open.
  fa.a2.unit37.lesson04.teach.policy_verbs:
    title: Werkwoorden voor winkelregels
    gloss: wij ruilen het om, wij geven terug, u koopt, u krijgt, u heeft, uw geld
    note: 'Winkelpersoneel spreekt klanten aan met beleefde *شما*-uitgangen: *داشته باشید*, *بخرید*, *می‌گیرید*, en *-تون* in *پولتون*. *رو* volgt op een bepaald lijdend voorwerp.'
    example_gloss:
    - Wij ruilen dit product om.
    - Vandaag krijgt u korting.
  fa.a2.unit37.lesson04.teach.shop_pattern:
    title: Een winkelregel met اگه
    gloss: Als u de bon heeft, geven wij uw geld terug.
    note: 'Een winkelregel heeft dezelfde vorm als een plan: *اگه* plus een aanvoegende voorwaarde, daarna een gevolg in de tegenwoordige tijd. Gebruik tegenover klanten de beleefde uitgangen *-ید* en *-تون*.'
  fa.a2.unit37.lesson04.teach.what_if_phrase:
    title: Wat als...?
    gloss: Wat als het regent? Wat als ik de bon niet heb?
    note: Zet *چی؟* na de voorwaarde om te vragen „wat als...?”.
  fa.a2.unit37.lesson04.teach.what_if_question:
    title: اگه ... چی؟
    gloss: Wat als het regent?
    note: 'De voorwaarde houdt haar aanvoegende werkwoord en *چی؟* staat helemaal achteraan, zonder gevolgzin. De ander antwoordt met het gevolg: *اگه بارون بیاد، می‌ریم سینما.*'
  fa.a2.unit37.lesson05.teach.reading_words:
    title: Woorden voor berichten en mededelingen
    gloss: hallo, goed, kom (gebod), jij kunt niet, komen, naar mij, bel (gebod), mededeling
    note: '*بیا* en *بزن* zijn vriendelijke bevelen. *بهم زنگ بزن* betekent „bel me”.'
    example_gloss:
    - Hallo! Het weer is goed.
    - Als je niet kunt komen, bel me.
  fa.a2.unit37.lesson05.teach.message:
    title: Een bericht over morgen
    gloss: Hallo Nima! Als het morgen zonnig is, gaan we naar het park. Als het regent, gaan we naar de bioscoop. Als je tijd hebt, kom dan. Als je niet kunt komen, bel me.
    note: Lees per voorwaarde en het bijbehorende gevolg.
  fa.a2.unit37.lesson05.teach.notice:
    title: Een mededeling van de winkel
    gloss: 'Mededeling van de winkel: Als het product kapot is, ruilen wij het om. Als u de bon heeft, geven wij uw geld terug. Als u de bon niet heeft, geven wij geen geld terug. Als u vandaag koopt, krijgt u korting.'
    note: Elke zin is één regel met een voorwaarde en een gevolg.
  fa.a2.unit37.lesson06.teach.dialogue_words:
    title: Ja, goed, daarna
    gloss: ja, goed, daarna
    note: '*آره* is het gewone gesproken „ja”. *بعدش* betekent „daarna”.'
    example_gloss:
    - Ja, we gaan morgen.
    - Goed! Daarna gaan we naar de markt.
  fa.a2.unit37.lesson06.teach.turn01:
    title: Sara stelt het park voor
    gloss: 'Sara vraagt: Nima, gaan we morgen naar het park?'
    note: Een vraag in de tegenwoordige tijd kan over een plan gaan.
  fa.a2.unit37.lesson06.teach.turn02:
    title: Nima noemt een voorwaarde
    gloss: 'Nima antwoordt: Ja, als het niet regent.'
    note: 'Een ontkennende voorwaarde kan het hele antwoord zijn: *اگه بارون نیاد، آره.*'
  fa.a2.unit37.lesson06.teach.turn03:
    title: Sara vraagt wat als
    gloss: 'Sara vraagt: Wat als het regent?'
    note: '*اگه ... چی؟* vraagt naar de andere mogelijkheid.'
  fa.a2.unit37.lesson06.teach.turn04:
    title: Nima noemt het andere plan
    gloss: 'Nima antwoordt: Als het regent, gaan we naar de bioscoop.'
    note: Het antwoord is een voorwaarde plus een gevolg in de tegenwoordige tijd.
  fa.a2.unit37.lesson06.teach.turn05:
    title: Sara voegt een tweede plan toe
    gloss: 'Sara zegt: Goed. Als je tijd hebt, gaan we daarna naar de markt.'
    note: Het tweede plan hangt af van een nieuwe voorwaarde.
  fa.a2.unit37.lesson06.teach.turn06:
    title: Nima maakt onderscheid tussen als en wanneer
    gloss: 'Nima zegt: Als ik tijd heb, kom ik. Als mijn werk klaar is, bel ik je.'
    note: '*اگه* is een mogelijkheid; *وقتی* is iets wat zal gebeuren.'
