    instruction: Wat betekent deze zin?
    correct_option: Als het regent, gaan we niet naar het park.
    distractors:
    - Als het regent, gaan we altijd naar het park.
    - Het regent, dus we gaan naar het park.
    - Of het nu regent of niet, we gaan naar het park.
    accepted_answers:
    - value: Als het regent, gaan we niet naar het park.
      status: correct
    feedback: '*اگه بارون بیاد* is de voorwaarde „als het regent”; *نمی‌ریم پارک* is het gevolg.'
  fa.a2.unit37.lesson01.exercise02.recognize_present_condition:
    instruction: Wat betekent deze zin? Er staat de tegenwoordige tijd na اگه.
    correct_option: Als het morgen regent, blijven we thuis.
    distractors:
    - Als het gisteren regende, bleven we thuis.
    - Morgen regent het en we gaan naar buiten.
    - Als we thuisblijven, gaat het regenen.
    accepted_answers:
    - value: Als het morgen regent, blijven we thuis.
      status: correct
    feedback: '*اگه بارون میاد* is de manier met de tegenwoordige tijd om dezelfde reële voorwaarde uit te drukken.'
