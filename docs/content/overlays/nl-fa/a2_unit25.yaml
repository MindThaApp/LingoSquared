teaching:
  fa.a2.unit25.lesson01.teach.time_words:
    title: Ooit, nooit, nog, eerder, één keer
    gloss: ooit / tot nu toe; nooit; nog / al; eerder; één keer
    note: '*تا حالا* geeft levenservaring aan. Gebruik *هیچ‌وقت* met een ontkennend werkwoord voor „nooit” en *هنوز* met een ontkennend werkwoord voor „nog niet”.'
    example_gloss:
    - Ben je ooit in Shiraz geweest?
    - Ik heb nog nooit Indiaas eten gegeten.
    - Ik ben nog niet in Isfahan geweest.
    - Ik heb deze film al eens gezien.
    - Ik heb één keer paardgereden.
  fa.a2.unit25.lesson01.teach.people_places:
    title: Mensen en plaatsen
    gloss: ik, jij, Sara, Nima, Shiraz, Isfahan
    note: In het Perzisch laat je *من* en *تو* vaak weg, omdat de uitgang van het werkwoord de persoon aangeeft. Sara en Nima zijn vaste vrienden.
    example_gloss:
    - Ik ben in Shiraz geweest.
    - Ben jij in Isfahan geweest?
    - Sara is al eens in Shiraz geweest.
    - Nima is nog niet in Isfahan geweest.
    - Ik ben in Shiraz geweest.
    - Ik ben niet in Isfahan geweest.
  fa.a2.unit25.lesson01.teach.experiences:
    title: Eten, films en paardrijden
    gloss: Indiaas eten, Koreaans eten, film, te paard
    note: '*رو* is de gesproken markering van het lijdend voorwerp in *این فیلم رو دیده‌م*. De uitdrukking *سوار اسب شدن* betekent paardrijden.'
    example_gloss:
    - Ik heb Indiaas eten gegeten.
    - Ik heb nog nooit Koreaans eten gegeten.
    - Ik heb deze film gezien.
    - Ik heb op een paard gereden.
  fa.a2.unit25.lesson01.teach.perfect_shape:
    title: De gesproken voltooid tegenwoordige tijd
    gloss: Ik ben gegaan, heb gegeten, gezien, ben geworden / gereden
    note: 'Je vormt de voltooid tegenwoordige tijd met het voltooid deelwoord op *-ه* plus een korte persoonsuitgang. Voor “ik” voegt gesproken Perzisch *-م* toe: *رفت + ه + م* → *رفته‌م*.'
  fa.a2.unit25.lesson01.teach.negative_shape:
    title: Ontkennende voltooid tegenwoordige tijd
    gloss: Ik ben niet gegaan, heb niet gegeten, niet gezien, ben niet geworden / niet gereden
    note: 'Zet *نـ* voor het voltooid deelwoord: *رفته‌م* → *نرفته‌م*. Bij *هیچ‌وقت* blijft het werkwoord ontkennend.'
  fa.a2.unit25.lesson01.teach.written_recognition:
    title: 'Geschreven vorm: alleen herkennen'
    gloss: رفته‌ام is de geschreven variant van gesproken رفته‌م
    note: In verzorgd schrift kom je *رفته‌ام* tegen. Herken die vorm, maar gebruik in de oefeningen van deze unit de spreektaalvorm *رفته‌م*.
  fa.a2.unit25.lesson02.teach.verbs:
    title: Vier ervaringswerkwoorden
    gloss: gaan, eten, zien, worden
    note: Hun voltooid deelwoorden zijn *رفته، خورده، دیده، شده*. Met *سوار اسب* vormt *شدن* de ervaring “paardrijden”.
    example_gloss:
    - Naar Shiraz gaan is leuk.
    - Indiaas eten eten is lekker.
    - Naar deze film kijken is leuk.
    - Paardrijden is leuk.
  fa.a2.unit25.lesson02.teach.pronouns:
    title: Hij/zij, wij, jullie/u, zij
    gloss: hij/zij, wij, jullie/u (meervoud/beleefd), zij
    note: Met deze voornaamwoorden zie je de persoonsuitgangen duidelijk. In gewone gesprekken laat je het voornaamwoord weg als de context al duidelijk is.
    example_gloss:
    - Hij/zij is in Shiraz geweest.
    - Wij zijn in Shiraz geweest.
    - Zijn jullie in Shiraz geweest?
    - Zij zijn in Shiraz geweest.
  fa.a2.unit25.lesson02.teach.clitics:
    title: Persoonsuitgangen
    gloss: ik, jij, hij/zij, wij, jullie, zij zijn gegaan
    note: De gesproken reeks is *-م، -ای،* geen uitgang, *-ایم، -این، -ن*. In deze unit oefen je alleen de hier getoonde vormen.
  fa.a2.unit25.lesson02.teach.other_participles:
    title: Dezelfde uitgangen bij andere voltooid deelwoorden
    gloss: jij/hij/zij hebt/heeft gegeten, gezien, gereden
    note: 'De persoonsuitgang wordt op dezelfde manier aan elk voltooid deelwoord vastgemaakt: *خورده‌ای، دیده‌ای، شده‌ای*.'
  fa.a2.unit25.lesson03.teach.specific_time:
    title: Vorig jaar, gisteren
    gloss: vorig jaar, gisteren
    note: Deze woorden noemen een afgesloten tijdstip. Gebruik dus de eenvoudige verleden tijd en niet de voltooid tegenwoordige tijd van ervaring.
    example_gloss:
    - Ik ben vorig jaar naar Shiraz gegaan.
    - Ik heb gisteren Indiaas eten gegeten.
  fa.a2.unit25.lesson03.teach.simple_past:
    title: Afgesloten gebeurtenis versus ervaring
    gloss: Ik ben vorig jaar naar Shiraz gegaan. Ik ben in Shiraz geweest.
    note: '*پارسال* noemt het moment waarop het gebeurde, dus gebruik je *رفتم*. Met *تا حالا* en zonder afgesloten tijdstip gebruik je *رفته‌م* voor levenservaring.'
  fa.a2.unit25.lesson04.teach.responses:
    title: Ja; ik ook
    gloss: ja; ik ook
    note: Antwoord op een ervaringsvraag met dezelfde voltooid tegenwoordige vorm. *منم* betekent “ik ook”.
    example_gloss:
    - Ja, ik ben er één keer geweest.
    - Ik heb het ook nog niet gegeten.
  fa.a2.unit25.lesson04.teach.question_pattern:
    title: Ben je ooit in Shiraz geweest?
    gloss: Ben je ooit in Shiraz geweest?
    note: 'Gebruik *تا حالا* plus de voltooid tegenwoordige tijd voor de tweede persoon, *رفته‌ای؟*, om naar ervaring te vragen. In de dagelijkse spraak gebruikt men met *تا حالا* vaak de eenvoudige verleden tijd: *تا حالا رفتی؟*. Beide kan.'
  fa.a2.unit25.lesson05.teach.reading:
    title: Een bericht over ervaringen
    gloss: Ik ben in Shiraz geweest en heb eerder Indiaas eten gegeten. Ik heb nog nooit paard gereden en nog geen Koreaans eten gegeten. Ben jij ooit in Shiraz geweest?
    note: Lees eerst om te zien welke ervaringen wel hebben plaatsgevonden, en dan nog eens voor ervaringen die nooit of nog niet hebben plaatsgevonden.
  fa.a2.unit25.lesson06.teach.turn01:
    title: Sara vraagt het aan Nima
    gloss: Nima, ben je ooit in Shiraz geweest?
    note: Sara stelt een ervaringsvraag met *تا حالا*.
  fa.a2.unit25.lesson06.teach.turn02:
    title: Nima antwoordt en vraagt terug
    gloss: Ja, ik ben er één keer geweest. Heb jij ooit Indiaas eten gegeten?
    note: Nima noemt één ervaring en stelt zelf een nieuwe ervaringsvraag.
  fa.a2.unit25.lesson06.teach.turn03:
    title: Sara zet twee gerechten tegenover elkaar
    gloss: Ja, dat heb ik eerder gegeten, maar Koreaans eten heb ik nog nooit gegeten.
    note: '*ولی* zet een positieve ervaring tegenover iets wat Sara nog nooit heeft gedaan.'
  fa.a2.unit25.lesson06.teach.turn04:
    title: Nima is het eens
    gloss: Ik heb het ook nog niet gegeten.
    note: '*هنوز نخورده‌م* betekent dat het tot nu toe nog niet is gebeurd.'
