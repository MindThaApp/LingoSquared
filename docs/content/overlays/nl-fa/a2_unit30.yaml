teaching:
  fa.a2.unit30.lesson01.teach.people_time:
    title: Mensen en tijd
    gloss: ik, jij, Sara, Nima, vanavond, morgen
    note: '*امشب* betekent “vanavond” en *فردا* betekent “morgen”. In het Perzisch laat je *من* meestal weg, omdat de werkwoordsuitgang al de persoon aangeeft.'
    example_gloss:
    - Morgen kan ik komen.
    - Sara kan vanavond niet komen.
  fa.a2.unit30.lesson01.teach.skills:
    title: Vaardigheden
    gloss: gitaar spelen, autorijden, koken, zwemmen, Engels spreken
    note: Dit zijn vaardigheden. Elk bestaat uit een zelfstandig naamwoord plus een hulpwerkwoord, en dat hulpwerkwoord verandert mee met de persoon.
    example_gloss:
    - Ik kan gitaar spelen.
    - Ik kan niet autorijden.
    - Nima kan Engels spreken.
  fa.a2.unit30.lesson01.teach.verbs_after:
    title: Werkwoorden na “kunnen”
    gloss: dat ik kom, dat ik ga, dat ik speel, dat ik lees, dat ik doe
    note: Dit zijn de werkwoordsvormen met “dat ik...” (de conjunctief). In gesproken Perzisch staat zo'n vorm na *می‌تونم*.
    example_gloss:
    - Ik kan komen.
    - Ik kan niet gaan.
    - Ik kan Engels spreken.
  fa.a2.unit30.lesson01.teach.can_forms:
    title: Kunnen en niet kunnen
    gloss: ik kan, jij kunt, hij/zij kan; ik kan niet, jij kunt niet, hij/zij kan niet
    note: 'Het gesproken werkwoord voor “kunnen” is *می‌تونم* (ik kan), *می‌تونی* (jij kunt), *می‌تونه* (hij/zij kan). Zet *نـ* ervoor voor “niet kunnen”: *نمی‌تونم*.'
  fa.a2.unit30.lesson01.teach.can_plus_subjunctive:
    title: Kunnen + het werkwoord met “dat ik...”
    gloss: ik kan komen; ik kan niet praten
    note: 'Na *می‌تونم* staat het tweede werkwoord in de conjunctief, niet in de infinitief: *می‌تونم بیام*, *نمی‌تونم صحبت کنم*. Het tweede werkwoord heeft dezelfde persoonsuitgang als *می‌تونم*.'
  fa.a2.unit30.lesson02.teach.person_word:
    title: Jij en hij/zij
    gloss: jij, hij of zij
    note: '*اون* betekent “hij” of “zij” in gesproken Perzisch; de werkwoordsuitgang laat zien wie bedoeld wordt.'
    example_gloss:
    - Hij of zij kan komen.
    - Jij kunt gaan.
  fa.a2.unit30.lesson02.teach.endings:
    title: Drie personen
    gloss: dat ik/jij/hij komt, gaat, speelt
    note: 'De uitgang van de conjunctief volgt de persoon: -م (ik), -ی (jij), -ه of -د (hij/zij). Hetzelfde patroon zie je bij elk werkwoord.'
    example_gloss:
    - Jij kunt gitaar spelen.
    - Hij of zij kan gaan.
  fa.a2.unit30.lesson02.teach.work_tech:
    title: Vaardigheden voor werk en technologie
    gloss: een e-mail sturen, een foto maken, Perzisch lezen, met een computer werken, met een telefoon
    note: Deze vaardigheden horen bij werk en technologie. *با* betekent “met” of “op”.
    example_gloss:
    - Nima kan met een computer werken.
    - Ik kan een e-mail sturen.
    - Jij kunt foto's maken met een telefoon.
  fa.a2.unit30.lesson02.teach.person_agreement:
    title: Beide werkwoorden congrueren
    gloss: ik kan komen, jij kunt komen, hij/zij kan komen
    note: 'Verander de persoon bij beide werkwoorden tegelijk: *می‌تونم بیام*, *می‌تونی بیای*, *می‌تونه بیاد*. Een combinatie als *می‌تونی بیام* is fout.'
  fa.a2.unit30.lesson03.teach.three_words:
    title: Moeten, kunnen zijn, misschien
    gloss: moeten, het is mogelijk dat, misschien
    note: '*باید* drukt noodzaak uit. *ممکنه* en *شاید* drukken allebei mogelijkheid uit. Alle drie worden gevolgd door de conjunctief.'
    example_gloss:
    - Ik moet gaan.
    - Ik kom misschien.
    - Misschien ga ik.
  fa.a2.unit30.lesson03.teach.late_rain:
    title: Laat, regen, niet komen
    gloss: laat, dat ik aankom, regen, dat ik niet ga, dat ik niet kom
    note: '*نیام* en *نرم* zijn negatieve conjunctieven: *نـ* komt voor het werkwoord.'
    example_gloss:
    - Ik kom misschien te laat.
    - Het gaat misschien regenen.
    - Ik kom misschien niet.
  fa.a2.unit30.lesson03.teach.can_must_might:
    title: Kunnen, moeten, misschien
    gloss: ik kan gaan; ik moet gaan; ik ga misschien
    note: 'Het werkwoord erna blijft hetzelfde, maar het eerste woord verandert de betekenis: *می‌تونم برم* (ik kan of mag gaan), *باید برم* (ik moet gaan), *ممکنه برم* (het is mogelijk dat ik ga).'
  fa.a2.unit30.lesson03.teach.possibility_rule:
    title: 'Mogelijkheid: ممکنه / شاید + conjunctief'
    gloss: ik kom misschien te laat; misschien gaat het regenen; ik kom misschien niet
    note: '*ممکنه* verandert niet mee met de persoon; het werkwoord erna wel: *ممکنه دیر برسم*, *ممکنه نیما نیاد*. *شاید* werkt op dezelfde manier. Om “misschien niet” te zeggen, ontken je het tweede werkwoord: *ممکنه نیام*.'
  fa.a2.unit30.lesson04.teach.availability:
    title: Beschikbaarheid
    gloss: ik heb tijd, ik heb geen tijd, ik ben vrij, ik ben bezig, ik heb een vergadering, het weekend
    note: '*وقت دارم* en *آزادم* zeggen dat je beschikbaar bent; *وقت ندارم* en *مشغولم* zeggen dat je dat niet bent.'
    example_gloss:
    - Morgen heb ik tijd.
    - Vanavond ben ik bezig.
    - In het weekend ben ik vrij.
  fa.a2.unit30.lesson04.teach.linkers:
    title: Omdat, maar, nee, en
    gloss: omdat, maar, nee, en
    note: '*چون* geeft een reden en *ولی* voegt een tegenstelling toe.'
    example_gloss:
    - Ik kan vanavond niet komen, omdat ik een vergadering heb.
    - Morgen ben ik vrij, maar ik kom misschien te laat.
  fa.a2.unit30.lesson04.teach.maybe_able:
    title: 'Misschien kan ik: شاید بتونم'
    gloss: misschien kan ik komen
    note: 'Om “misschien kan ik” te zeggen, zet je *شاید* voor *بتونم* (de conjunctief van “kunnen”) en daarna een tweede werkwoord in de conjunctief: *شاید بتونم بیام*. In deze cursus leer je *شاید بتونم* als model.'
  fa.a2.unit30.lesson04.teach.reason_for_no:
    title: Niet kunnen + reden
    gloss: ik kan vanavond niet komen, omdat ik een vergadering heb
    note: 'Een weigering klinkt natuurlijk met een reden: *نمی‌تونم بیام، چون ...*. De reden is een gewone bewering in de tegenwoordige tijd.'
  fa.a2.unit30.lesson05.teach.reading:
    title: Een bericht van Nima
    gloss: Hoi Sara! Ik kan vanavond niet komen, omdat ik een vergadering heb. Morgen ben ik vrij en dan kan ik komen, maar ik kom misschien te laat. Ik kan met een computer werken, maar ik kan geen gitaar spelen. Misschien kan ik ook foto's maken.
    note: Lees het één keer voor wat Nima wel en niet kan, en nog een keer voor wat er misschien gebeurt.
  fa.a2.unit30.lesson06.teach.dialogue_words:
    title: Woorden om te antwoorden
    gloss: ja, goed, geen probleem, eerder
    note: '*اشکالی نداره* is een vriendelijk antwoord dat “geen probleem” betekent. *زودتر* betekent “eerder”.'
    example_gloss:
    - Goed, geen probleem.
    - Misschien kan ik eerder komen.
  fa.a2.unit30.lesson06.teach.turn01:
    title: Sara nodigt Nima uit
    gloss: 'Sara vraagt: Nima, kun je vanavond komen?'
    note: De opening vraagt naar kunnen en beschikbaarheid.
  fa.a2.unit30.lesson06.teach.turn02:
    title: Nima slaat de uitnodiging af
    gloss: 'Nima: Nee, ik kan vanavond niet komen. Ik heb een vergadering.'
    note: Een weigering met een reden.
  fa.a2.unit30.lesson06.teach.turn03:
    title: Sara vraagt naar morgen
    gloss: 'Sara: En morgen? Heb je morgen tijd?'
    note: '*فردا چی؟* brengt het gesprek naar een ander moment.'
  fa.a2.unit30.lesson06.teach.turn04:
    title: 'Nima: kan wel, maar misschien te laat'
    gloss: 'Nima: Ja, morgen ben ik vrij. Ik kan komen, maar ik kom misschien te laat.'
    note: Kunnen en mogelijkheid in één antwoord.
  fa.a2.unit30.lesson06.teach.turn05:
    title: Sara vraagt naar foto's
    gloss: 'Sara: Goed, geen probleem. Kun je foto''s maken met je telefoon?'
    note: Een nieuwe vraag over kunnen.
  fa.a2.unit30.lesson06.teach.turn06:
    title: Nima sluit het gesprek af
    gloss: 'Nima: Ja, dat kan ik. Misschien kan ik eerder komen.'
    note: Eerst kunnen, dan een hoopvolle mogelijkheid.
