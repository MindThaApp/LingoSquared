  fa.a1.unit36.lesson01.teach.mehrabun:
    title: Aardig
    gloss: aardig / vriendelijk
    note: '*مهربون* beschrijft iemand die aardig of warmhartig is.'
    example_gloss: Sara is erg aardig.
  fa.a1.unit36.lesson01.teach.bamaze:
    title: Grappig
    gloss: grappig
    note: '*بامزه* beschrijft iemand die grappig of amusant is.'
    example_gloss: Nima is grappig.
  fa.a1.unit36.lesson01.teach.khejalati:
    title: Verlegen
    gloss: verlegen
    note: '*خجالتی* beschrijft iemand die verlegen is.'
    example_gloss: Hij/zij is een beetje verlegen.
  fa.a1.unit36.lesson01.teach.jeddi:
    title: Serieus
    gloss: serieus
    note: '*جدی* beschrijft iemand die serieus is.'
    example_gloss: Onze leraar is serieus.
  fa.a1.unit36.lesson01.teach.review_copula_fusion:
    title: Hoe de samengetrokken 'is' aan persoonlijkheidswoorden hangt
    gloss: hij/zij is aardig / grappig / verlegen (samengetrokken koppelwerkwoord)
    note: '*مهربونه* trekt *مهربون* + *است* direct samen, omdat *مهربون* op een medeklinker eindigt. *بامزه‌ست* gebruikt een geschreven ZWNJ vóór *ست*, omdat *بامزه* al op de klinker *ه* eindigt. *خجالتیه* zet *ه* direct achter een woord dat op *ی* eindigt, hetzelfde patroon als *قهوه‌ایه* uit de les over uiterlijk.'
    target_text: مهربونه = مهربون + است (samengetrokken 'is', na een medeklinker) / بامزه‌ست = بامزه + است (na een klinker, met ZWNJ) / خجالتیه = خجالتی + ه (na ی)
  fa.a1.unit36.lesson02.teach.zerang:
    title: Slim
    gloss: slim
    note: '*زرنگ* beschrijft iemand die slim is, vooral praktisch vindingrijk.'
    example_gloss: Maryam is erg slim.
  fa.a1.unit36.lesson02.teach.tanbal:
    title: Lui
    gloss: lui
    note: '*تنبل* beschrijft iemand die lui is.'
    example_gloss: Ik ben vandaag een beetje lui.
  fa.a1.unit36.lesson02.teach.zahmatkesh:
    title: Hardwerkend
    gloss: hardwerkend
    note: '*زحمت‌کش* beschrijft iemand die hard werkt en echt zijn best doet.'
    example_gloss: Mijn vader is erg hardwerkend.
  fa.a1.unit36.lesson02.teach.sabur:
    title: Geduldig
    gloss: geduldig
    note: '*صبور* beschrijft iemand die geduldig is.'
    example_gloss: Onze leraar is erg geduldig.
  fa.a1.unit36.lesson02.teach.review_negation:
    title: Een eigenschap ontkennen
    gloss: hij/zij is niet lui
    note: '*نیست* ontkent het samengetrokken koppelwerkwoord: *تنبل نیست* betekent ''hij/zij is niet lui''. Het is dezelfde *نیست* die je al kent om gevoelens te ontkennen.'
    target_text: تنبل نیست (hij/zij is niet lui) -- نیست ontkent de samengetrokken koppelwerkwoordvorm
  fa.a1.unit36.lesson03.teach.shakhsiat_word:
    title: Persoonlijkheid
    gloss: persoonlijkheid
    note: '*شخصیت* betekent ''persoonlijkheid'' of ''karakter''.'
    example_gloss: Zijn/haar persoonlijkheid is heel goed.
  fa.a1.unit36.lesson03.teach.ask_shakhsiat:
    title: Hoe is zijn/haar karakter?
    gloss: Hoe is zijn/haar karakter?
    note: '*چطوره؟* (''hoe is...?'') ken je al uit de les over begroetingen; *ش* is het bezittelijke achtervoegsel ''zijn/haar'', vastgemaakt aan *شخصیت* (''persoonlijkheid'').'
  fa.a1.unit36.lesson03.teach.answer_mehrabun_zerang:
    title: Hij/zij is heel aardig en slim
    gloss: Hij/zij is heel aardig en slim
    note: '*و* betekent ''en'' en verbindt twee persoonlijkheidswoorden.'
  fa.a1.unit36.lesson03.teach.che_joriye:
    title: Hoe is hij/zij?
    gloss: Hoe is hij/zij?
    note: '*چه جوریه؟* is een gangbare informele manier om te vragen ''hoe is hij/zij?'', een alternatief voor *شخصیتش چطوره؟*.'
  fa.a1.unit36.lesson03.teach.review_shakhsiat_words:
    title: Persoonlijkheid / hoe is...? / hoe is... (qua karakter)?
    gloss: persoonlijkheid / hoe is...? / hoe is... (qua karakter)?
    note: Met deze drie uitdrukkingen kun je vragen naar iemands persoonlijkheid en die benoemen.
    target_text: شخصیت (karakter) / چطوره؟ (hoe is...?) / چه جوریه؟ (hoe is... qua aard?)
  fa.a1.unit36.lesson04.teach.review_dialogue_words:
    title: Nima / Sara / Maryam / helemaal niet / alleen / cool
    gloss: Nima / Sara / Maryam / helemaal niet / alleen / cool
    note: '*مریم* is de vriendin van *سارا*, al geïntroduceerd in de les over uiterlijk. *اصلاً* betekent ''helemaal niet''. *فقط* betekent ''alleen'' of ''enkel''. *باحال* betekent ''cool'' of ''leuk''.'
  fa.a1.unit36.lesson04.teach.get_to_know:
    title: Ik wil haar graag beter leren kennen
    gloss: Ik wil haar graag beter leren kennen
    note: '*بیشتر* betekent ''meer''. *باهاش* betekent ''met hem/haar''. *آشنا بشم* betekent ''dat ik kennismaak / leer kennen''.'
  fa.a1.unit36.lesson04.teach.dialogue_line1:
    title: 'Nima: Sara, hoe is Maryam?'
    gloss: Sara, hoe is Maryam?
  fa.a1.unit36.lesson04.teach.dialogue_line2:
    title: 'Sara: Ze is heel aardig en slim.'
    gloss: Ze is heel aardig en slim.
  fa.a1.unit36.lesson04.teach.dialogue_line3:
    title: 'Nima: Is ze niet lui?'
    gloss: Is ze niet lui?
  fa.a1.unit36.lesson04.teach.dialogue_line4:
    title: 'Sara: Nee, helemaal niet, ze is ook heel hardwerkend. Ze is alleen een beetje verlegen.'
    gloss: Nee, helemaal niet, ze is ook heel hardwerkend. Ze is alleen een beetje verlegen.
  fa.a1.unit36.lesson04.teach.dialogue_line5:
    title: 'Nima: Wat leuk, ik wil haar graag beter leren kennen.'
    gloss: Wat leuk, ik wil haar graag beter leren kennen.
  fa.a1.unit36.lesson05.teach.reading_text:
    title: 'Lezen: Maryams persoonlijkheid'
    gloss: Maryam is een vriendin van Sara. Ze is heel aardig en slim. Ze is ook hardwerkend in haar werk en nooit lui. Ze is alleen een beetje verlegen, daarom praat ze in grote groepen niet veel.
    note: De tekst beschrijft Maryams persoonlijkheid in de derde persoon, met dezelfde eigenschappen als in de dialoog.
  fa.a1.unit36.lesson05.teach.reading_note:
    title: Nooit (met een ontkennend werkwoord)
    gloss: nooit
    note: '*هیچ‌وقت* staat samen met een ontkennend werkwoord (*نیست*, *نمی‌زنه*) en betekent dan ''nooit''. Het Nederlands heeft een vergelijkbaar patroon met ''nooit'' als ontkenning, maar in het Perzisch hoort het werkwoord daarbij zelf ook ontkennend te zijn.'
  fa.a1.unit36.lesson06.teach.self_description:
    title: Ik denk dat ik heel hardwerkend ben, maar ik ben ook een beetje lui
    gloss: Ik denk dat ik heel hardwerkend ben, maar ik ben ook een beetje lui
    note: '*فکر می‌کنم* betekent ''ik denk''. *زحمت‌کشم* trekt *زحمت‌کش* + *هستم* (''ik ben'') samen. *هستم* is de volledige, niet-samengetrokken vorm van ''ik ben'', hier na *هم* (''ook'') gebruikt voor nadruk.'
  fa.a1.unit36.lesson06.teach.friend_request:
    title: Hoe is jouw karakter?
    gloss: Hoe is jouw karakter?
    note: '*شخصیتت* voegt het informele bezittelijke achtervoegsel *ت* (''jouw'') toe aan *شخصیت*, de *تو*-variant van *شخصیتش*.'
  fa.a1.unit36.lesson06.teach.review_trait_words:
    title: Aardig / grappig / verlegen / serieus / slim / lui / hardwerkend / geduldig
    gloss: aardig / grappig / verlegen / serieus / slim / lui / hardwerkend / geduldig
    note: Dit zijn de acht belangrijkste persoonlijkheidswoorden van deze les.
