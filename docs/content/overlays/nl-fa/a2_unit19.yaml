course:
  title: Perzisch A2
  description: 'Iraans Farsi voor gevorderde beginners met een grammaticale ruggengraat: bankzaken, meningen, afspraken en meer. Nu begin je met de eenvoudige verleden tijd als systeem (stammen, uitgangen en de ontkennende verleden tijd).'
units:
  fa.a2.unit19.last_weekend:
    title: Afgelopen weekend
lessons:
  fa.a2.unit19.lesson01.weekend_words:
    title: Weekendwoorden en de eerste verledentijdsvormen
  fa.a2.unit19.lesson02.past_stem_and_endings:
    title: Hoe de eenvoudige verleden tijd wordt gevormd
  fa.a2.unit19.lesson03.negative_past:
    title: De ontkennende verleden tijd, en verleden versus tegenwoordige tijd
  fa.a2.unit19.lesson04.saying_what_you_did:
    title: Vertellen wat je deed, op volgorde
  fa.a2.unit19.lesson05.reading_and_listening:
    title: Lezen en luisteren
  fa.a2.unit19.lesson06.weekend_conversation:
    title: Een gesprek over het weekend
teaching:
  fa.a2.unit19.lesson01.teach.weekend_phrase:
    title: Afgelopen weekend
    gloss: afgelopen weekend
    note: '*آخر هفته‌ی پیش* is letterlijk ''het einde van vorige week'', en zo zegt men in het Perzisch ''afgelopen weekend''. In Iran bestaat het weekend uit donderdag en vrijdag.'
    example_gloss: Afgelopen weekend bleef ik thuis.
  fa.a2.unit19.lesson01.teach.days:
    title: Donderdag, vrijdag
    gloss: Donderdag, vrijdag
    note: Deze twee dagen vormen het Iraanse weekend, dus daar gaat een weekendverhaal meestal over.
    example_gloss:
    - Op donderdag ging ik naar het park.
    - Op vrijdag bleef ik thuis.
  fa.a2.unit19.lesson01.teach.parts_of_day:
    title: Ochtend, middag, late middag
    gloss: ochtend, middag, late middag
    note: '*عصر* dekt de late middag en het begin van de avond. Zet het deel van de dag direct na de dag: *پنجشنبه صبح* ''donderdagochtend''.'
    example_gloss:
    - Donderdagochtend ging ik boodschappen doen.
    - Ik sliep tot de middag.
    - In de late middag ging ik naar het park.
  fa.a2.unit19.lesson01.teach.places:
    title: Park, bioscoop, bank
    gloss: park, bioscoop, bank
    note: 'Bij *رفتن* (gaan) wordt *به* (''naar'') in spreektaal vaak weggelaten: *به پارک رفتم* en *رفتم پارک* betekenen allebei ''ik ging naar het park''.'
    example_gloss:
    - Op donderdag ging ik naar het park.
    - Op vrijdag ging ik naar de bioscoop.
    - Op donderdag ging ik naar de bank.
  fa.a2.unit19.lesson01.teach.errands:
    title: Winkelen
    gloss: boodschappen doen
    note: '*رفتم خرید* betekent ''ik ging winkelen''. Hetzelfde woord *خرید* is ook de verledentijdsvorm voor ''hij/zij'' van *خریدن*: ''hij/zij kocht''.'
    example_gloss: Donderdagochtend ging ik boodschappen doen.
  fa.a2.unit19.lesson01.teach.home_book_film:
    title: Thuis, boek, film
    gloss: thuis, boek, film
    note: '*خونه* is de spreektaalvorm van *خانه* (huis, thuis). In spreektaal is *یه کتاب* (''een boek'') de gebruikelijke vorm van *یک کتاب*; beide zijn goed.'
    example_gloss:
    - Op vrijdag bleef ik thuis.
    - Ik heb een boek gelezen.
    - Ik heb een film gekeken.
  fa.a2.unit19.lesson01.teach.people:
    title: Mijn vriend, mijn oma
    gloss: mijn vriend, mijn oma
    note: 'De uitgang *-م* op een zelfstandig naamwoord betekent ''mijn'': *دوست* (vriend) wordt *دوستم* (mijn vriend).'
    example_gloss:
    - Op donderdag kwam mijn vriend langs.
    - Op vrijdag kwam mijn oma langs.
  fa.a2.unit19.lesson01.teach.visit:
    title: Op bezoek gaan
    gloss: bezoeken / zien
    note: '*رفتن دیدن* plus een persoon betekent iemand gaan bezoeken: *رفتم دیدن دوستم* ''ik ging mijn vriend bezoeken''. Hetzelfde woord *دیدن* betekent ook ''zien''.'
    example_gloss: Ik ging mijn oma bezoeken.
  fa.a2.unit19.lesson01.teach.verbs_go_stay:
    title: Ik ging, ik kwam, ik bleef
    gloss: Ik ging, ik kwam, ik bleef
    note: Dit zijn *ik*-vormen van de eenvoudige verleden tijd. In spreektaal zegt men *اومدم* en *موندم* waar verzorgd schrift *آمدم* en *ماندم* heeft.
    example_gloss:
    - Op donderdag ging ik naar het park.
    - Op vrijdag kwam ik thuis.
    - Afgelopen weekend bleef ik thuis.
  fa.a2.unit19.lesson01.teach.verbs_eat_see:
    title: Ik at, ik zag, ik las, ik sliep
    gloss: Ik at, ik zag, ik las, ik sliep
    note: Nog vier *ik*-vormen van de eenvoudige verleden tijd. *خوندم* is de spreektaalvorm van *خواندم*.
    example_gloss:
    - Ik heb lunch gegeten.
    - Ik heb een film gekeken.
    - Ik heb een boek gelezen.
    - Op vrijdag sliep ik.
  fa.a2.unit19.lesson02.teach.pronouns:
    title: Ik, jij, hij/zij, wij
    gloss: ik, jij, hij / zij, wij
    note: In spreektaal laat men het voornaamwoord meestal weg, omdat de werkwoordsuitgang al aangeeft wie het doet. Gebruik het voor nadruk of contrast. *اون* betekent 'hij' of 'zij'.
    example_gloss:
    - Op donderdag ging ik naar het park.
    - Ben jij thuisgebleven?
    - Hij kwam op vrijdag.
    - Wij gingen op donderdag naar het park.
  fa.a2.unit19.lesson02.teach.stem_rule:
    title: De verleden stam
    gloss: 'Verleden stammen: ging, at, zag, las, bleef, kwam, sliep'
    note: 'De woordenboekvorm (infinitief) van een werkwoord eindigt op *-ن*. Laat die weg en je hebt de verleden stam: *رفتن* → *رفت*, *خوردن* → *خورد*, *دیدن* → *دید*, *خوندن* → *خوند*, *موندن* → *موند*, *اومدن* → *اومد*, *خوابیدن* → *خوابید*. Alles in de gewone verleden tijd is op deze stam gebouwd.'
  fa.a2.unit19.lesson02.teach.endings:
    title: Uitgangen op de verleden stam
    gloss: ik ging, jij ging, hij/zij ging, wij gingen, jullie gingen, zij gingen
    note: 'Voeg de uitgang aan de stam toe: *-م* (ik), *-ی* (jij), geen uitgang (hij/zij), *-یم* (wij), *-ین* (jullie of beleefd, in spreektaal: *رفتین*), *-ن* (zij). In zorgvuldig geschreven taal is dat *-ید* voor ''jullie'' (*رفتید*) en *-ند* voor ''zij'' (*رفتند*). Let op: *رفتن* betekent ook ''gaan'' (de infinitief); de context maakt het verschil duidelijk. En verwar de twee keer *-م* niet: bij een zelfstandig naamwoord betekent het ''mijn'' (*دوستم*), bij een werkwoord in de verleden tijd betekent het ''ik'' (*رفتم*).'
  fa.a2.unit19.lesson02.teach.eat_forms:
    title: Dezelfde uitgangen op خورد
    gloss: ik at, jij at, hij/zij at, wij aten
    note: 'Dezelfde uitgangen, andere stam: *خورد* + *-م*, *-ی*, niets, *-یم*.'
  fa.a2.unit19.lesson02.teach.stay_forms:
    title: Dezelfde uitgangen op موند
    gloss: ik bleef, jij bleef, hij/zij bleef, wij bleven
    note: 'De stam *موند* krijgt dezelfde uitgangen. Bij ''hij/zij'' hoeft er niets bij: *اون خونه موند*.'
  fa.a2.unit19.lesson03.teach.and_but:
    title: Maar, en
    gloss: maar, en
    note: '*ولی* verbindt twee tegengestelde zinsdelen; *و* voegt gewoon nog iets toe.'
    example_gloss:
    - Ik ging naar het park, maar ik ging niet naar de bioscoop.
    - Op vrijdag bleef ik thuis en las ik een boek.
  fa.a2.unit19.lesson03.teach.time_words:
    title: Gisteren, vandaag, elke dag
    gloss: gisteren, vandaag, elke dag
    note: 'Tijdwoorden helpen je de tijd te kiezen: *دیروز* wijst op het verleden en *هر روز* (een gewoonte) op het heden. *امروز* kan bij allebei: *امروز نمی‌رم پارک* ''Ik ga vandaag niet naar het park'', maar *امروز رفتم پارک* ''Ik ben vandaag naar het park gegaan'' als het al gebeurd is.'
    example_gloss:
    - Gisteren ging ik naar het park.
    - Vandaag ga ik niet naar het park.
    - Elke dag ga ik naar het park.
  fa.a2.unit19.lesson03.teach.negative_rule:
    title: 'Ontkennende verleden tijd: نـ + werkwoord'
    gloss: ik ging niet, ik at niet, ik zag niet, ik las niet, ik bleef niet
    note: 'Om te zeggen dat je iets NIET deed, zet je *نـ* direct voor het werkwoord in de verleden tijd en verander je verder niets: *رفتم* → *نرفتم*, *خوردم* → *نخوردم*, *ندیدم*, *نخوندم*, *نموندم*. De uitgangen blijven hetzelfde: *نرفتم*, *نرفتی*, *نرفت*, *نرفتیم*. Schrijf *نـ* vast aan het werkwoord; het is niet het losse woord *نه* (''nee''): *نه، نرفتم* betekent ''Nee, ik ging niet''.'
  fa.a2.unit19.lesson03.teach.neg_aamad:
    title: 'De uitzondering: اومدن'
    gloss: ik kwam niet, jij kwam niet, hij/zij kwam niet, wij kwamen niet
    note: '*اومدن* (''komen'') begint met een klinker, dus *نـ* + *ا* wordt *نی*: *اومدم* → *نیومدم* (nooit *ناومدم*). De overige uitgangen volgen het gewone patroon: *نیومدی*, *نیومد*, *نیومدیم*. In zorgvuldig geschreven taal is het *آمدم* → *نیامدم*.'
  fa.a2.unit19.lesson03.teach.past_vs_present:
    title: Verleden of tegenwoordige tijd?
    gloss: ik ga, ik ging, ik ga niet, ik ging niet
    note: 'De gewone verleden tijd heeft geen *می‌* en gebruikt de verleden stam (*رفتم*); de tegenwoordige tijd heeft *می‌* plus de tegenwoordige stam (*می‌رم*). Stam en *می‌* samen verraden de tijd. Bij de ontkenning werkt het hetzelfde: *نرفتم* ''ik ging niet'', maar *نمی‌رم* ''ik ga niet''. Uitspraak: de ontkenning in de verleden tijd is *na-* (*نرفتم*, ''na-raftam''), terwijl *نمی‌* *ne-* is (*نمی‌رم*, ''ne-miram'').'
  fa.a2.unit19.lesson04.teach.sequence_words:
    title: Eerst, daarna, uiteindelijk
    gloss: eerst, daarna, uiteindelijk
    note: '*اول* opent een reeks, *بعد* zet die voort (je mag het herhalen) en *آخرش* sluit af.'
    example_gloss:
    - Eerst ging ik naar de bank.
    - Daarna ging ik winkelen.
    - Uiteindelijk ging ik naar huis.
  fa.a2.unit19.lesson04.teach.sequence_note:
    title: Gebeurtenissen op volgorde vertellen
    gloss: Eerst ging ik naar de bank, daarna ging ik winkelen, uiteindelijk ging ik naar huis.
    note: 'Vertel gebeurtenissen in de volgorde waarin ze plaatsvonden. Elk zinsdeel heeft zijn eigen werkwoord in de verleden tijd (bij *رفتن* staat het werkwoord vaak vóór de plaats: *رفتم بانک*). Verbind de zinsdelen met een komma of met *و*: *اول رفتم بانک و بعد رفتم خرید*. Zet de ontkennende gebeurtenis op de plek waar die in het verhaal hoort: *بعد رفتم پارک، ولی سینما نرفتم* of *بعد رفتم خرید، ولی ورزش نکردم*. *اومدم خونه* (''ik kwam thuis'') is een natuurlijke manier om een dag af te sluiten.'
  fa.a2.unit19.lesson04.teach.question:
    title: Wat heb je vorig weekend gedaan?
    gloss: Wat heb je vorig weekend gedaan?
    note: '*چیکار کردی؟* (letterlijk ''wat deed je?'') is de standaardmanier om dit te vragen. Je antwoordt met werkwoorden in de verleden tijd, één zinsdeel per ding dat je deed.'
  fa.a2.unit19.lesson04.teach.sport:
    title: Sport
    gloss: sport / lichaamsbeweging
    note: '*ورزش کردن* betekent sporten of aan lichaamsbeweging doen.'
    example_gloss: Op donderdag heb ik gesport.
  fa.a2.unit19.lesson04.teach.compound_negative:
    title: Werkwoorden zoals خرید کردن ontkennen
    gloss: ik heb boodschappen gedaan, ik heb geen boodschappen gedaan, ik heb gesport, ik heb niet gesport
    note: 'Werkwoorden zoals *خرید کردن* (''winkelen'') en *ورزش کردن* bestaan uit een zelfstandig naamwoord plus *کردن* (''doen''). Zet *نـ* op het werkwoord, niet op het zelfstandig naamwoord: *خرید نکردم*, nooit *نخرید کردم*. De vorm voor ''hij/zij'' is *نکرد*: *ورزش نکرد*.'
  fa.a2.unit19.lesson04.teach.no_answer:
    title: Een ja/nee-vraag in de verleden tijd beantwoorden
    gloss: Ben je naar de bioscoop gegaan? Nee, dat ben ik niet.
    note: 'Om nee te zeggen op een vraag over het verleden herhaal je het werkwoord met *نـ*: *نرفتم*. *نه* (''nee'') ervoor zetten is heel gebruikelijk. Om ja te zeggen herhaal je het werkwoord zonder نـ: *رفتم*.'
  fa.a2.unit19.lesson05.teach.spot_negative:
    title: Herken de ontkenning
    gloss: ik deed niet, ik ging niet, ik zag niet
    note: 'Let bij het lezen of luisteren op het allereerste begin van elk werkwoord. Een kleine *نـ* keert de betekenis helemaal om: *رفتم* ''ik ging'' maar *نرفتم* ''ik ging niet''. In een weekendverhaal vertellen de ontkenningen wat er NIET gebeurde, dus let er net zo goed op als op de activiteiten.'
  fa.a2.unit19.lesson05.teach.reading_message:
    title: Saras bericht aan een vriend
    gloss: Hoi! Vorig weekend ben ik donderdagochtend gaan winkelen. Daarna ging ik naar het park. Aan het eind van de middag ging ik op bezoek bij mijn oma. Op vrijdag bleef ik thuis en las ik een boek. Maar ik heb niet gesport en ik ben niet naar de bioscoop gegaan.
    note: Een kort geschreven weekendverslag. Lees het eerst voor de activiteiten en hun volgorde, en daarna nog eens voor de twee dingen die ze NIET deed.
  fa.a2.unit19.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: De twee vrienden uit eerdere lessen.
    example_gloss:
    - Sara ging op donderdag naar het park.
    - Nima kwam op vrijdag.
  fa.a2.unit19.lesson06.teach.until:
    title: Tot / uiterlijk
    gloss: tot, uiterlijk
    note: '*تا* voor een tijdstip of een dag betekent ''tot'': *تا ظهر* ''tot de middag''.'
    example_gloss: Ik sliep tot de middag.
  fa.a2.unit19.lesson06.teach.what_about:
    title: En ...?
    gloss: En vrijdag? En jij?
    note: '*چی؟* na een woord vraagt ''en hoe zit het daarmee?'' – een snelle manier om het gesprek op gang te houden.'
  fa.a2.unit19.lesson06.teach.how_nice:
    title: Wat fijn!
    gloss: Wat fijn!
    note: Een vriendelijke reactie op goed nieuws.
  fa.a2.unit19.lesson06.teach.turn01:
    title: Sara vraagt naar vorig weekend
    gloss: Sara vraagt Nima wat hij vorig weekend gedaan heeft.
    note: De standaardvraag voor een verslag van het afgelopen weekend.
  fa.a2.unit19.lesson06.teach.turn02:
    title: Nima's donderdag
    gloss: Nima zegt dat hij op donderdag eerst naar de bank ging en daarna ging winkelen.
    note: '*اول ... بعد ...* zet de twee boodschappen op volgorde.'
  fa.a2.unit19.lesson06.teach.turn03:
    title: Sara vraagt naar vrijdag
    gloss: 'Sara vraagt: en vrijdag? Heb je gesport?'
    note: '*ورزش کردی؟* is een ja/nee-vraag over een handeling in het verleden.'
  fa.a2.unit19.lesson06.teach.turn04:
    title: Nima's vrijdag
    gloss: 'Nima zegt nee, hij heeft niet gesport. Hij sliep tot de middag en ging aan het eind van de middag op bezoek bij zijn vriend. Hij vraagt Sara: en jij?'
    note: '*ورزش نکردم* – de *نـ* staat op het werkwoord. De rest van zijn vrijdag is bevestigend.'
  fa.a2.unit19.lesson06.teach.turn05:
    title: Saras weekend
    gloss: Sara zegt dat ze op donderdag naar het park ging en dat ze op vrijdag thuisbleef en een boek las.
    note: Sara gebruikt *من* om op *تو چی؟* te antwoorden – een geval waarin het persoonlijk voornaamwoord natuurlijk is.
  fa.a2.unit19.lesson06.teach.turn06:
    title: Nima reageert
    gloss: 'Nima zegt: wat fijn!'
    note: Een korte, vriendelijke afsluitende reactie.
  fa.a2.unit19.lesson06.teach.third_person:
    title: Over andere mensen praten
    gloss: Nima ging, Sara bleef, Nima ging niet, Sara deed niet
    note: 'Als je vertelt wat iemand anders deed, gebruik je voor ''hij/zij'' de kale stam: *نیما رفت بانک*, *سارا خونه موند*. De ontkenning is nog steeds *نـ* + stam: *نیما نرفت*, *سارا ورزش نکرد*. Er komt geen uitgang bij, dus de naam (of *اون*) laat zien wie het deed.'
