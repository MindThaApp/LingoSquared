teaching:
  fa.a2.unit32.lesson01.teach.problems:
    title: Kleine problemen
    gloss: Ik heb hoofdpijn, ik voel me slecht, ik heb een examen, ik heb geen geld
    note: 'Dit zijn de problemen waarover de unit advies geeft: gezondheid, studie en geld. *سرم درد می‌کنه* zegt letterlijk “mijn hoofd doet pijn”.'
    example_gloss:
    - Ik heb vandaag hoofdpijn.
    - Ik heb morgen een examen.
    - Ik voel me slecht en ik heb geen geld.
  fa.a2.unit32.lesson01.teach.helpers:
    title: Woorden over gezondheid, studie en geld
    gloss: rust, dokter, apotheek, medicijn, water, koffie, les/studie, uitgaven
    note: '*داروخونه* is de gewone gesproken vorm van “apotheek”. *درس* is “les” en ook het object bij “leren”: *درس بخونی*.'
    example_gloss:
    - Ik heb water en koffie.
    - Ik heb vanavond een les.
    - De dokter en de apotheek.
  fa.a2.unit32.lesson01.teach.advice_verbs:
    title: Werkwoordsvormen voor advies
    gloss: je rust, je gaat, je drinkt, je leert, je slaapt, je geeft uit; vroeg, meer, minder
    note: 'Dit zijn de *تو*-vormen op *-ی*: *کنی، بری، بخوری، بخونی، بخوابی*. Het is de aanvoegende wijs (subjunctief) en die volgt op *بهتره*.'
    example_gloss:
    - (dat) je vroeg naar bed gaat.
    - (dat) je meer leert.
    - (dat) je minder uitgeeft.
  fa.a2.unit32.lesson01.teach.bahtare:
    title: بهتره + subjunctief
    gloss: Het is beter dat je naar de dokter gaat; het is beter dat je rust
    note: '*بهتره* betekent “het is beter (dat)…” en geeft zacht advies. Het werkwoord erna staat in de subjunctief, hier met de *تو*-uitgang *-ی*: *بهتره بری*, *بهتره استراحت کنی*. Tussen *بهتره* en het werkwoord staat geen extra woord.'
  fa.a2.unit32.lesson02.teach.my_opinion:
    title: Naar mijn mening
    gloss: ik denk, naar mijn mening
    note: '*به نظرم* betekent letterlijk “naar mijn zienswijze” en is de gebruikelijke manier om advies zachter te maken.'
    example_gloss:
    - Ik denk dat je beter water kunt drinken.
    - Ik denk dat je beter naar de dokter kunt gaan.
  fa.a2.unit32.lesson02.teach.opinion_rule:
    title: به نظرم vóór بهتره
    gloss: Ik denk dat je beter meer kunt leren
    note: 'Zet *به نظرم* vooraan en houd daarna dezelfde structuur: *به نظرم بهتره + subjunctive*. Zo klinkt je advies als jouw mening en niet als een bevel.'
  fa.a2.unit32.lesson03.teach.negative_verbs:
    title: Ontkennende werkwoordsvormen
    gloss: (dat) je niet drinkt, niet gaat, niet slaapt, niet doet; laat, veel, heel
    note: 'De ontkenning van elke *تو*-subjunctiefvorm krijgt *نـ* ervoor: *بخوری → نخوری*, *بری → نری*, *بخوابی → نخوابی*, *کنی → نکنی*.'
    example_gloss:
    - (dat) je geen koffie drinkt.
    - (dat) je niet laat naar bed gaat.
    - (dat) je niet veel uitgeeft.
  fa.a2.unit32.lesson03.teach.must:
    title: Moeten
    gloss: moeten
    note: '*باید* drukt sterke verplichting uit: *باید بری دکتر* = “je moet naar de dokter gaan.”'
    example_gloss:
    - Morgen moet je meer leren.
    - Vandaag moet je naar de dokter gaan.
  fa.a2.unit32.lesson03.teach.negative_rule:
    title: Negatief advies
    gloss: Je kunt beter geen koffie drinken; je kunt beter niet laat naar bed gaan
    note: 'Voor “je kunt beter niet” houd je *بهتره* en zet je *نـ* voor het werkwoord: *بهتره قهوه نخوری*. Zet geen ontkenning op *بهتره* zelf.'
  fa.a2.unit32.lesson03.teach.must_vs_better:
    title: باید is sterker dan بهتره
    gloss: Je moet naar de dokter gaan; je kunt beter naar de dokter gaan
    note: Gebruik *بهتره* voor vriendelijk advies dat je mag negeren en *باید* als iets echt nodig is. Na beide volgt dezelfde werkwoordsvorm als *بری*.
  fa.a2.unit32.lesson04.teach.question:
    title: Wat moet ik doen?
    gloss: Wat moet ik doen?
    note: '*چیکار کنم؟* is de gebruikelijke gesproken manier om om advies te vragen. Het werkwoord *کنم* is de *من*-subjunctiefvorm.'
  fa.a2.unit32.lesson04.teach.responses:
    title: Reageren op advies
    gloss: ja, je hebt gelijk, dat is een goed idee, ik weet het niet, misschien, nee
    note: '*حق با توئه* betekent letterlijk “het recht is aan jouw kant”. Met deze vriendelijke zinnen neem je advies aan, twijfel je of wijs je het af.'
    example_gloss:
    - Ja, je hebt gelijk.
    - Dat is een goed idee.
    - Ik weet het niet, misschien.
  fa.a2.unit32.lesson04.teach.respond_rule:
    title: Drie manieren om op advies te reageren
    gloss: Ja, goed idee; ik weet het niet, misschien
    note: Je stemt in met *آره، حق با توئه* of *فکر خوبیه*. Ben je er niet zeker van, zeg dan *نمی‌دونم، شاید*. Een kale *نه* kan, maar klinkt bot.
  fa.a2.unit32.lesson05.teach.reading:
    title: Een bericht en een antwoord
    gloss: Hallo Sara. Morgen heb ik een examen, maar ik heb hoofdpijn en voel me slecht. Wat moet ik doen? Hallo Nima. Ik denk dat je vanavond beter kunt rusten en water kunt drinken. Je kunt beter geen koffie drinken en op tijd naar bed gaan.
    note: De eerste drie zinnen zijn het bericht van Nima; de rest is het antwoord van Sara. Zoek eerst het probleem en dan de drie adviezen.
  fa.a2.unit32.lesson06.teach.turn01:
    title: Beurt 1
    gloss: Nima vertelt over zijn probleem en vraagt wat hij moet doen.
    note: Hij noemt twee feiten en vraagt dan om advies.
  fa.a2.unit32.lesson06.teach.turn02:
    title: Beurt 2
    gloss: Sara geeft twee adviezen.
    note: '*به نظرم* maakt het advies zachter.'
  fa.a2.unit32.lesson06.teach.turn03:
    title: Beurt 3
    gloss: Nima neemt het advies aan, maar zegt dat hij moet leren.
    note: '*باید* is hier Nima''s eigen sterke verplichting.'
  fa.a2.unit32.lesson06.teach.turn04:
    title: Beurt 4
    gloss: Sara raadt hem af om vanavond te leren en raadt hem aan op tijd naar bed te gaan.
    note: Eerst een ontkennend advies, dan een bevestigend advies.
  fa.a2.unit32.lesson06.teach.turn05:
    title: Beurt 5
    gloss: Nima weet het niet zeker, maar geeft toe dat zij misschien gelijk heeft.
    note: Een aarzelend antwoord op advies.
  fa.a2.unit32.lesson06.teach.turn06:
    title: Beurt 6
    gloss: 'Sara vult aan: dan kun je morgen maar beter naar de dokter gaan.'
    note: '*پس* betekent “dus, dan”.'
