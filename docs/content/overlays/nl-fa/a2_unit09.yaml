course:
  title: Perzisch A2
  description: 'Farsi (Iran) voor gevorderde beginners: een officiële afspraak regelen om je adres te wijzigen bij een overheidsloket – woordenschat, de afspraak maken, een officiële mededeling lezen en de afspraak zelf.'
units:
  fa.a2.unit09.bureaucracy:
    title: Administratieve zaken
lessons:
  fa.a2.unit09.lesson01.bureaucracy_vocabulary:
    title: Woorden voor een bezoek aan een kantoor
  fa.a2.unit09.lesson02.making_an_appointment:
    title: Een afspraak maken
  fa.a2.unit09.lesson03.reading_the_notice:
    title: De mededeling lezen
  fa.a2.unit09.lesson04.at_the_registry_office:
    title: Bij het overheidsloket
teaching:
  fa.a2.unit09.lesson01.teach.vaght_word:
    title: Afspraak
    gloss: afspraak / tijdslot
    note: '*وقت* betekent letterlijk ''tijd''; *وقت گرفتن* (een tijdslot nemen) is de gewone manier om in het Perzisch ''een afspraak maken'' te zeggen.'
  fa.a2.unit09.lesson01.teach.madrak_word:
    title: Document
    gloss: document
    note: '*مدرک* is het algemene woord voor een officieel document of identiteitsbewijs.'
  fa.a2.unit09.lesson01.teach.address_word:
    title: Adres
    gloss: adres
    note: '*آدرس* is het gewone woord voor een woonadres of postadres.'
  fa.a2.unit09.lesson01.teach.ghabz_word:
    title: Energierekening
    gloss: energierekening
    note: '*قبض* is een rekening (water, elektriciteit, gas) – wordt vaak aanvaard als bewijs van woonplaats.'
  fa.a2.unit09.lesson01.teach.national_id_word:
    title: Nationale identiteitskaart
    gloss: nationale identiteitskaart
    note: '*کارت ملی* is de nationale identiteitskaart van Iran, het document dat in deze unit wordt bijgewerkt.'
  fa.a2.unit09.lesson01.teach.va_word:
    title: En
    gloss: en
    note: '*و* is het veelgebruikte voegwoord (''en'') dat in deze hele unit voorkomt.'
  fa.a2.unit09.lesson02.teach.request_appointment:
    title: Een afspraak vragen
    gloss: Ik wil graag een afspraak maken om mijn adres te wijzigen.
    note: '*می‌خواستم* (letterlijk ''ik wilde'') maakt een verzoek zachter, vergelijkbaar met het Nederlandse beleefde ''ik wilde graag...''.'
  fa.a2.unit09.lesson02.teach.because_moved:
    title: Een reden geven met چون (omdat)
    gloss: Omdat ik ben verhuisd, moet ik mijn adres wijzigen.
    note: '*چون* leidt de reden in – een bijzin op A2-niveau, een stap verder dan de eenvoudige zinnen van A1.'
  fa.a2.unit09.lesson02.teach.what_should_i_bring:
    title: Beleefd vragen wat je mee moet nemen
    gloss: Kunt u mij zeggen wat ik mee moet nemen?
    note: '*می‌شه...؟* (''zou het mogelijk zijn...?'') is een beleefde, indirecte vraagvorm.'
  fa.a2.unit09.lesson03.teach.lease_word:
    title: Huurcontract
    gloss: huurcontract
    note: '*اجاره‌نامه* is een huurcontract, een mogelijk bewijs van woonplaats.'
  fa.a2.unit09.lesson03.teach.deadline_word:
    title: Uiterste termijn
    gloss: uiterste termijn
    note: '*مهلت* is het algemene woord voor een deadline of tijdslimiet.'
  fa.a2.unit09.lesson03.teach.notice_text:
    title: Een mededeling van het kantoor over het wijzigen van je adres
    gloss: Neem voor een adreswijziging uw oude nationale identiteitskaart en een water- of elektriciteitsrekening mee. De inschrijftermijn loopt tot het einde van deze maand.
    note: Een korte officiële mededeling in neutrale schrijftaal. Er staat toch de gesproken vorm *بیارید* in (in plaats van *بیاورید*), zoals dat in zulke mededelingen vaak voorkomt.
  fa.a2.unit09.lesson03.teach.i_will_bring_bill:
    title: Zeggen wat je meeneemt
    gloss: Ik neem de waterrekening mee.
    note: '*میارم* is de gewone gesproken samentrekking van *می‌آورم* (ik breng mee).'
  fa.a2.unit09.lesson04.teach.turn01:
    title: De baliemedewerker begroet سارا
    gloss: De medewerker nodigt haar uit en vraagt waarmee hij of zij kan helpen.
    note: '*بفرمایید* nodigt haar uit naderbij te komen; *چه کمکی از دستم برمیاد؟* is een beleefde, gewone manier waarop een medewerker hulp aanbiedt.'
  fa.a2.unit09.lesson04.teach.turn02:
    title: سارا vraagt om een afspraak
    gloss: سارا zegt dat ze graag een afspraak wil maken om haar adres te wijzigen.
    note: Hergebruikt het verzoekpatroon *می‌خواستم* uit les 2.
  fa.a2.unit09.lesson04.teach.turn03:
    title: De medewerker vraagt sinds wanneer
    gloss: De medewerker vraagt sinds wanneer ze op het nieuwe adres woont.
    note: '*از کی...؟* betekent ''sinds wanneer''.'
  fa.a2.unit09.lesson04.teach.turn04:
    title: سارا antwoordt en vraagt wat ze mee moet nemen
    gloss: Ze zegt sinds vorige maand, en vraagt wat ze mee moet nemen.
    note: Combineert het gegeven *از ماه پیش* met de vraag *می‌شه بگید...؟* uit les 2.
  fa.a2.unit09.lesson04.teach.turn05:
    title: De medewerker noemt de documenten
    gloss: De medewerker zegt dat de oude nationale identiteitskaart en een water- of elektriciteitsrekening genoeg zijn.
    note: '*کافیه* (gesproken vorm van *کافی است*) betekent ''is genoeg''.'
  fa.a2.unit09.lesson04.teach.turn06:
    title: سارا stelt een dag voor
    gloss: Ze vraagt of ze dinsdag kan komen.
    note: '*می‌تونم...؟* vraagt naar mogelijkheid of toestemming; gesproken vorm van *می‌توانم*.'
  fa.a2.unit09.lesson04.teach.turn07:
    title: De medewerker bevestigt en geeft een volgcode
    gloss: De medewerker bevestigt dinsdag om tien uur en geeft de volgcode 2214.
    note: '*کد پیگیری* is de volg- of referentiecode van de afspraak.'
