  fa.a2.unit20.lesson06.holiday_conversation:
    title: Een gesprek over de vakantie
teaching:
  fa.a2.unit20.lesson01.teach.holiday:
    title: Vakantie, zomer
    gloss: vakantie, zomer
    note: In gesproken taal is *تابستون* de gewone vorm van *تابستان* (zomer). *تعطیلات* lijkt een meervoud, maar is het normale woord voor 'een vakantie'.
    example_gloss:
    - In de zomer heb ik vakantie.
    - De vakantie is geweldig.
  fa.a2.unit20.lesson01.teach.when:
    title: Volgende week, volgend jaar, augustus
    gloss: volgende week, volgend jaar, augustus (Mordad)
    note: '*بعد* na een tijdwoord betekent ''volgend'': *هفته‌ی بعد*, *سال بعد*. *مرداد* is de Iraanse maand die grotendeels in augustus valt.'
    example_gloss:
    - Volgende week heb ik een afspraak.
    - Volgend jaar ga ik naar Isfahan.
    - In Mordad heb ik vakantie.
  fa.a2.unit20.lesson01.teach.travel_verbs:
    title: Reizen, boeken
    gloss: reizen, boeken
    note: 'Beide zijn zelfstandig naamwoord + *کردن*: *سفر* (een reis) + *کردن* = reizen; *رزرو* (een reservering) + *کردن* = boeken. In de tegenwoordige tijd komt *می‌* op *کردن*: *سفر می‌کنم*, *رزرو می‌کنم*.'
    example_gloss:
    - Volgende week ga ik op reis.
    - Ik boek een hotel.
  fa.a2.unit20.lesson01.teach.north:
    title: Het noorden, hotel
    gloss: het noorden (de Kaspische kust), hotel
    note: '*شمال* (noorden) is ook wat Iraniërs de Kaspische kust noemen, de klassieke zomervakantiestreek: *می‌رم شمال* = ''ik ga naar het noorden (op vakantie)''.'
    example_gloss:
    - In de zomer ga ik naar het noorden.
    - In het noorden boek ik een hotel.
  fa.a2.unit20.lesson01.teach.sister_mom:
    title: Met, mijn zus, mijn moeder, mijn broer
    gloss: met, mijn zus, mijn moeder, mijn broer
    note: 'De uitgang *-م* betekent ''mijn'': *خواهر* (zus) wordt *خواهرم*, *مامان* wordt *مامانم*, *برادر* wordt *برادرم*.'
    example_gloss:
    - Ik ga met mijn zus naar het noorden.
    - Ik blijf bij mijn moeder thuis.
    - Ik reis met mijn broer.
  fa.a2.unit20.lesson01.teach.question:
    title: Wat ga je in de zomer doen?
    gloss: Wat ga je in de zomer doen?
    note: 'Dezelfde vraag die ''wat doe je?'' betekent, betekent ook ''wat ga je doen?'': het tijdwoord (*تابستون*) laat zien dat het om de toekomst gaat.'
  fa.a2.unit20.lesson01.teach.present_for_plans:
    title: Plannen voor de nabije toekomst gebruiken de tegenwoordige tijd
    gloss: In Mordad ga ik naar het noorden, ik boek een hotel.
    note: 'Het Perzisch heeft geen gewone toekomende tijd voor het dagelijks taalgebruik. Voor vaste plannen of plannen in de nabije toekomst gebruik je de tegenwoordige tijd met *می‌* en voeg je een tijdwoord toe: *مرداد می‌رم شمال* is letterlijk ''in Mordad ga ik naar het noorden'' en betekent ''in Mordad ga ik naar het noorden''. Het tijdwoord laat de luisteraar weten dat het om de toekomst gaat.'
  fa.a2.unit20.lesson02.teach.course_money:
    title: Cursus, geld
    gloss: cursus, geld
    note: '*دوره* is een cursus of een reeks lessen: *یه دوره‌ی زبان* (een taalcursus). *دوره‌ی* met *-ی* verbindt het met het zelfstandig naamwoord erna.'
    example_gloss:
    - Ik volg een taalcursus.
    - Ik heb helemaal geen geld.
  fa.a2.unit20.lesson02.teach.later:
    title: Later, over een maand
    gloss: later, over een maand
    note: '*یه ماه دیگه* is letterlijk ''nog één maand'' en betekent ''over een maand''. *بعدا* is een algemeen ''later''.'
    example_gloss:
    - Later ga ik naar het noorden.
    - Over een maand ga ik op reis.
  fa.a2.unit20.lesson02.teach.want_course:
    title: Ik wil een cursus volgen.
    gloss: Ik wil een cursus volgen. / Ik ben van plan een cursus te volgen.
    note: '*می‌خوام* (ik wil) plus een tweede werkwoord in de korte *be-*vorm: *بگیرم* (van *گرفتن*, nemen / volgen). Beide werkwoorden krijgen de uitgang *-م*: *می‌خوام بگیرم*. Hetzelfde patroon met *رفتن* (gaan) geeft *می‌خوام برم*.'
  fa.a2.unit20.lesson02.teach.want_house:
    title: Ik wil verhuizen.
    gloss: Ik wil verhuizen. / Ik ben van plan te verhuizen.
    note: '*خونه عوض کردن* betekent verhuizen. In het *می‌خوام*-patroon wordt het werkwoord *کنم*: *می‌خوام خونه عوض کنم*.'
  fa.a2.unit20.lesson02.teach.want_save:
    title: Ik wil geld sparen.
    gloss: Ik wil geld sparen. / Ik ben van plan geld te sparen.
    note: '*پول جمع کردن* betekent geld sparen (letterlijk ''geld verzamelen''). Zelfde patroon: *می‌خوام پول جمع کنم*.'
  fa.a2.unit20.lesson02.teach.qasd:
    title: Ik ben van plan een cursus te volgen.
    gloss: Ik ben van plan een cursus te volgen.
    note: '*قصد دارم* (ik ben van plan) is iets formeler dan *می‌خوام*, maar wordt gevolgd door hetzelfde korte werkwoord: *قصد دارم بگیرم*.'
  fa.a2.unit20.lesson02.teach.want_pattern:
    title: می‌خوام + een kort werkwoord
    gloss: Ik wil gaan, ik wil nemen, ik wil sparen
    note: 'Voor plannen die verder weg liggen of voor wensen gebruik je *می‌خوام* + een tweede werkwoord in de korte *be-*vorm: *برم* (gaan), *بگیرم* (nemen), *بخرم* (kopen) en *کنم* (doen, zoals in *پول جمع کنم*). Beide werkwoorden hebben dezelfde uitgang (*-م* voor ''ik''): *می‌خوام برم*. Voor plannen die dichtbij en vaststaand zijn gebruik je gewoon de tegenwoordige tijd: *فردا می‌رم*, maar *سال بعد می‌خوام یه دوره بگیرم*.'
  fa.a2.unit20.lesson03.teach.maybe_certain:
    title: Misschien, zeker
    gloss: misschien, zeker
    note: '*شاید* en *حتما* staan aan het begin van de zin en laten zien hoe zeker je ervan bent.'
    example_gloss:
    - Misschien ga ik naar de bioscoop.
    - Ik ga zeker.
  fa.a2.unit20.lesson03.teach.this_year:
    title: Dit jaar, deze zomer
    gloss: dit jaar, deze zomer
    note: '*این* voor een tijdwoord betekent ''dit/deze'': *این تابستون*. *امسال* is één woord voor ''dit jaar''.'
    example_gloss:
    - Dit jaar blijf ik thuis.
    - Deze zomer werk ik.
  fa.a2.unit20.lesson03.teach.maybe_rule:
    title: Misschien + kort werkwoord
    gloss: Misschien ga ik, ik ga zeker
    note: 'Na *شاید* komt de korte *be-*vorm (*برم*), omdat het plan maar een mogelijkheid is. Na *حتما* komt de gewone tegenwoordige tijd (*می‌رم*), omdat het plan zeker is: *شاید برم سینما*, maar *حتما می‌رم سینما*.'
  fa.a2.unit20.lesson03.teach.not_want:
    title: Ik wil niet
    gloss: Ik wil niet
    note: 'Zet *نـ* voor *می‌خوام* om te zeggen dat je iets niet wilt of niet van plan bent: *نمی‌خوام برم*. Voor een gewoon ontkennend plan ontken je de tegenwoordige tijd: *می‌رم* wordt *نمی‌رم*.'
    example_gloss:
    - Ik wil niet verhuizen.
    - Dit jaar ga ik niet naar het noorden.
    - Deze zomer ga ik niet op reis.
  fa.a2.unit20.lesson03.teach.later_cinema:
    title: Misschien ga ik later naar de bioscoop.
    gloss: Misschien ga ik later naar de bioscoop.
    note: Het tijdwoord *بعدا* kan tussen *شاید* en het werkwoord staan.
  fa.a2.unit20.lesson04.teach.q_words:
    title: Waar, met wie, hoeveel weken
    gloss: waar, met wie, hoeveel weken
    note: '*با کی* is letterlijk ''met wie'': je vraagt met wie iemand gaat. *چند هفته* vraagt hoe lang (hoeveel weken).'
    example_gloss:
    - Waar ga je heen?
    - Met wie ga je?
    - Hoeveel weken blijf je?
  fa.a2.unit20.lesson04.teach.q_where:
    title: Waar ga je heen?
    gloss: Waar ga je heen?
    note: 'Het vraagwoord staat voorop en het werkwoord heeft de uitgang *-ی* (jij): *می‌ری* (jij gaat).'
  fa.a2.unit20.lesson04.teach.q_who:
    title: Met wie ga je?
    gloss: Met wie ga je?
    note: 'Antwoord met *با* + de persoon + het werkwoord: *با خواهرم می‌رم*.'
  fa.a2.unit20.lesson04.teach.q_howlong:
    title: Hoeveel weken blijf je?
    gloss: Hoeveel weken blijf je?
    note: '*می‌مونی* is de *jij*-vorm van *می‌مونم* (ik blijf).'
  fa.a2.unit20.lesson04.teach.durations:
    title: Een week, twee weken, twee dagen
    gloss: een week, twee weken, twee dagen
    note: 'Na een getal blijft het zelfstandig naamwoord enkelvoud: *دو هفته*, *دو روز*. *یه هفته* is het gesproken ''een week''.'
    example_gloss:
    - Ik blijf een week.
    - Ik ga twee weken op reis.
    - Ik blijf daar twee dagen.
  fa.a2.unit20.lesson04.teach.you_forms:
    title: Jij wilt, jij doet (korte vorm)
    gloss: jij wilt, jij doet (korte vorm)
    note: '*می‌خوای* is de *jij*-vorm van *می‌خوام*; het korte werkwoord erna krijgt ook de *jij*-uitgang: *کنی* (van *کنم*), *بری* (van *برم*).'
    example_gloss:
    - Wat wil je doen?
    - Wil je gaan?
  fa.a2.unit20.lesson04.teach.answer_pair:
    title: Jij gaat / ik ga
    gloss: Ga je? Ik ga.
    note: Vragen gebruiken de *jij*-uitgang *-ی* (*می‌ری*, *می‌مونی*, *می‌کنی*); in je antwoord gebruik je de *ik*-uitgang *-م* (*می‌رم*, *می‌مونم*, *می‌کنم*). De tijd en het werkwoord blijven hetzelfde.
  fa.a2.unit20.lesson05.teach.spot_plans:
    title: Herken het soort plan
    gloss: ik ga, ik wil, misschien ga ik
    note: 'Let bij het lezen op hoe zeker elk plan is: een gewone tegenwoordige tijd met *می‌* (*می‌رم*) staat vast, *می‌خوام* is een voornemen en *شاید* is slechts een mogelijkheid.'
  fa.a2.unit20.lesson05.teach.reading_message:
    title: Een bericht over de vakantie
    gloss: Hoi! In de zomer heb ik vakantie. In Mordad ga ik met mijn zus naar het noorden. We blijven een week in een hotel. Daarna ga ik twee dagen naar het huis van mijn moeder. Volgend jaar wil ik een cursus volgen. Misschien ga ik ook naar Isfahan.
    note: Een kort bericht over zomerplannen. Lees het eerst voor de plannen en daarna nog een keer om te zien hoe zeker elk plan is.
  fa.a2.unit20.lesson06.teach.names:
    title: Sara, Nima
    gloss: Sara, Nima
    note: De twee vrienden uit eerdere lessen.
    example_gloss:
    - Sara werkt in Tir.
    - Nima gaat in Mordad naar Turkije.
  fa.a2.unit20.lesson06.teach.dlg1:
    title: Sara vraagt naar de vakantie
    gloss: Sara vraagt Nima wat hij in de zomervakantie gaat doen.
    note: De standaardvraag over vakantieplannen.
  fa.a2.unit20.lesson06.teach.dlg2:
    title: Nima's plan
    gloss: Nima zegt dat hij in Mordad naar Turkije gaat en een hotel boekt.
    note: Twee vaste plannen, allebei in de tegenwoordige tijd met *می‌*.
  fa.a2.unit20.lesson06.teach.dlg3:
    title: Sara vraagt met wie
    gloss: Sara zegt dat het mooi is en vraagt met wie hij gaat.
    note: '*با کی* vraagt met wie hij gaat.'
  fa.a2.unit20.lesson06.teach.dlg4:
    title: Met wie en hoe lang
    gloss: Nima zegt dat hij met zijn broer gaat en dat ze er een week blijven.
    note: 'In het antwoord mag het werkwoord wegblijven: *با برادرم* is genoeg.'
  fa.a2.unit20.lesson06.teach.dlg5:
    title: Sara vraagt naar volgend jaar
    gloss: 'Sara vraagt: en volgend jaar? Wat wil je doen?'
    note: '*می‌خوای* is de *jij*-vorm van *می‌خوام*; *کنی* is het korte werkwoord met de *jij*-uitgang.'
  fa.a2.unit20.lesson06.teach.dlg6:
    title: Nima's voornemen
    gloss: 'Nima zegt dat hij een cursus wil volgen en vraagt Sara: en jij?'
    note: Een voornemen met *می‌خوام* en een kort werkwoord.
  fa.a2.unit20.lesson06.teach.dlg7:
    title: Sara's plannen
    gloss: Sara zegt dat ze in Tir werkt en dat ze daarna misschien naar het huis van haar moeder gaat.
    note: Een vast plan in de tegenwoordige tijd en een mogelijkheid met *شاید*.
  fa.a2.unit20.lesson06.teach.third_person:
    title: Hij/zij gaat, blijft, doet, wil
    gloss: hij/zij gaat, blijft, doet, wil
    note: 'Om het plan van iemand anders te vertellen gebruik je de *hij/zij*-uitgang *-ه* op de tegenwoordige tijd (*می‌ره*, *می‌مونه*, *می‌کنه*). *می‌خواد* is de *hij/zij*-vorm van *می‌خوام*, en het korte werkwoord erna eindigt ook op *-ه*: *می‌خواد بره*, *می‌خواد بگیره*.'
    example_gloss:
    - Nima wil een cursus volgen.
    - Sara wil naar het huis van haar moeder gaan.
