course:
  title: Perzisch A2
  description: 'Farsi (Iraans) voor gevorderde beginners met een grammaticaal stramien: bankzaken, meningen, afspraken en meer, en nu vertellen wat je gaat doen: plannen voor de nabije toekomst, voornemens, misschien en zeker.'
units:
