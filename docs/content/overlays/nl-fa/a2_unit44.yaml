teaching:
  fa.a2.unit44.lesson01.teach.orders:
    title: Bestellingen en reserveringen
    gloss: bestelling, kamer, reservering, klaar
    note: '*سفارش دادن* is “bestellen”; *رزرو کردن* is “reserveren”.'
    example_gloss:
    - De bestelling is hier.
    - De kamer is hier.
    - De reservering is hier.
    - De kamer is klaar.
  fa.a2.unit44.lesson01.teach.neg:
    title: Nog niet
    gloss: nog niet, is nog niet gekomen, ik heb niet gegeven, ik heb niet gedaan
    note: '*هنوز* met een ontkennend werkwoord betekent “nog niet”.'
    example_gloss:
    - Mijn bestelling is nog niet gekomen.
    - Ik heb nog niet besteld.
    - Ik heb nog niet gereserveerd.
    - De kamer is nog niet klaar.
  fa.a2.unit44.lesson01.teach.rule:
    title: هنوز + ontkenning = nog niet
    gloss: Mijn bestelling is nog niet gekomen; ik heb nog niet besteld; de kamer is nog niet klaar
    note: 'Zet *هنوز* voor een ontkennend werkwoord om te zeggen dat iets nog niet is gebeurd. Zowel de voltooide tijd (*نیومده*) als de gewone verleden tijd (*ندادم*) kan. Met een bevestigend werkwoord betekent *هنوز* “nog steeds”: *اتاق هنوز اینجاست* (de kamer is er nog steeds).'
  fa.a2.unit44.lesson02.teach.appointments:
    title: Afspraken
    gloss: afspraak (tijdstip), dokter, vrij, werk
    note: '*وقت* is een afspraak of een vrij tijdstip.'
    example_gloss:
    - De afspraak bij de dokter is hier.
    - De dokter is hier.
    - Dit tijdstip is vrij.
  fa.a2.unit44.lesson02.teach.dige:
    title: Niet meer
    gloss: meer, ik wil niet, hij/zij doet niet (werkt niet)
    note: '*دیگه* met een ontkennend werkwoord betekent “niet meer”.'
    example_gloss:
    - Ik wil het niet meer.
    - De dokter werkt hier niet meer.
    - Dit tijdstip is niet meer vrij.
  fa.a2.unit44.lesson02.teach.rule:
    title: دیگه + ontkenning = niet meer
    gloss: Ik wil geen koffie meer; de dokter werkt hier niet meer; dit tijdstip is niet meer vrij
    note: Zet *دیگه* voor een ontkennend werkwoord om te zeggen dat iets eerder wel waar was, maar nu niet meer. In andere zinnen betekent *دیگه* ook “een andere / ander”, maar met een ontkennend werkwoord betekent het “niet meer”.
  fa.a2.unit44.lesson03.teach.hich_words:
    title: Niets, niemand, geen ...
    gloss: niets, niemand, geen
    note: '*هیچ* met een ontkennend werkwoord betekent “geen / geen enkele / niets”.'
    example_gloss:
    - Ik wil niets.
    - Niemand is hier.
    - Geen enkele tafel is vrij.
    - De tafel is hier.
  fa.a2.unit44.lesson03.teach.rule:
    title: هیچ + ontkennend werkwoord
    gloss: Ik wil niets; niemand kwam; geen enkele tafel is vrij; geen enkele kamer is klaar
    note: 'In het Farsi staat *هیچ* samen met een ontkennend werkwoord: *هیچی نمی‌خوام*. Bij een zelfstandig naamwoord voeg je *ی* toe: *هیچ میزی*, *هیچ اتاقی*. Het Farsi heeft dus twee ontkenningen (*هیچ* en het werkwoord), net als in sommige Nederlandse dialecten, maar anders dan in standaard-Nederlands.'
  fa.a2.unit44.lesson04.teach.answers:
    title: Korte antwoorden
    gloss: Hebt u besteld? Nee, nog niet. Wilt u koffie? Nee, niet meer. Wilt u iets? Nee, niets.
    note: 'Om snel iets te corrigeren begin je met *نه* en daarna één kort woord: *هنوز نه*, *دیگه نه*, *هیچی*. Daarna kun je de hele zin toevoegen.'
  fa.a2.unit44.lesson04.teach.phrases:
    title: Controleren en corrigeren
    gloss: dat klopt, alleen, water
    note: '*درسته؟* betekent “klopt dat?”.'
    example_gloss:
    - Twee koffie, klopt dat?
    - Ik wil alleen water.
  fa.a2.unit44.lesson05.teach.reading:
    title: Een probleem met de reservering
    gloss: 'Nima reserveerde een kamer voor twee nachten. Vandaag ging hij naar het hotel, maar de kamer was nog niet klaar. De medewerker zei: “Er is geen enkele kamer vrij.” Nima zei: “Dan wil ik dit hotel niet meer.”'
    note: Lees één keer om te begrijpen wat er gebeurde, en daarna nog eens om te letten op *هنوز*, *هیچ* en *دیگه*.
  fa.a2.unit44.lesson06.teach.turn01:
    title: De ober brengt een bestelling
    gloss: 'Ober: Pardon, uw bestelling is klaar. Twee koffie, klopt dat?'
    note: '*درسته؟* vraagt om bevestiging.'
  fa.a2.unit44.lesson06.teach.turn02:
    title: 'Nima corrigeert: nog niet'
    gloss: 'Nima: Nee, ik heb nog niet besteld.'
    note: '*هنوز ... ندادم* betekent “nog niet”.'
  fa.a2.unit44.lesson06.teach.turn03:
    title: De ober begrijpt het
    gloss: 'Ober: Dan zijn deze koffies dus niet van u.'
    note: '*مال شما نیست* is de ontkennende vorm van *مال شماست*.'
  fa.a2.unit44.lesson06.teach.turn04:
    title: Nima corrigeert weer
    gloss: 'Nima: Ik heb vandaag al koffie gehad, dus ik wil geen koffie meer. Ik wil niets, alleen water.'
    note: '*دیگه* en *هیچی* staan allebei bij een ontkennend werkwoord.'
