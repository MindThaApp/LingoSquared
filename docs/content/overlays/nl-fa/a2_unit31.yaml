teaching:
  fa.a2.unit31.lesson01.teach.polite_words:
    title: Beleefde openingswoorden
    gloss: hallo, pardon, kunt u / zou het mogelijk zijn, alstublieft, dank u
    note: 'Met *ببخشید* trek je beleefd de aandacht en *لطفا* betekent “alstublieft”. *می‌شه* vraagt letterlijk: “is het mogelijk?”'
    example_gloss:
    - Hallo, pardon.
    - Dank u, alstublieft.
  fa.a2.unit31.lesson01.teach.things:
    title: Dingen waar je om vraagt
    gloss: deur, raam, water, glas, brood, (lijdend voorwerp-markering), een
    note: '*رو* markeert in de spreektaal een bepaald lijdend voorwerp: *در رو*, *پنجره رو*. *یه* is het gesproken “een”.'
    example_gloss:
    - Een glas water.
    - Een brood.
    - De deur en het raam.
  fa.a2.unit31.lesson01.teach.request_verbs:
    title: Beleefde werkwoorden voor verzoeken
    gloss: sluiten, openen, brengen, geven, helpen
    note: Dit zijn beleefde meervoudsvormen met de uitgang *-ید*. Je gebruikt ze tegenover buren, winkeliers en andere vreemden.
    example_gloss:
    - Doe de deur dicht.
    - Doe het raam open.
    - Breng een glas water.
    - Help mij.
  fa.a2.unit31.lesson01.teach.mishe_subjunctive:
    title: می‌شه + subjunctief
    gloss: Kunt u de deur dichtdoen? Kunt u mij helpen?
    note: 'Om beleefd iets te vragen zeg je *می‌شه* en dan een subjunctiefvorm met *ب-*: *می‌شه در رو ببندید؟* Bij een samengesteld werkwoord verandert het hulpwerkwoord: *می‌شه کمکم کنید؟*, *می‌شه پنجره رو باز کنید؟* Het lijdend voorwerp staat voor het werkwoord.'
  fa.a2.unit31.lesson02.teach.offer_words:
    title: Hulp aanbieden
    gloss: Wilt u hulp? Laat mij ...
    note: '*کمک می‌خواید؟* vraagt of iemand hulp wil. *بذارید من ...* betekent “laat mij ...” en wordt gevolgd door een werkwoord in de *ik*-vorm: *بیارم*, *بخرم*, *ببندم*, *کنم*.'
    example_gloss:
    - Wilt u hulp?
    - Laat mij water halen.
    - Laat mij brood kopen.
    - Laat mij de deur dichtdoen.
    - Laat mij u helpen.
    - Kunt u brood kopen?
  fa.a2.unit31.lesson02.teach.reply_words:
    title: Aannemen en afslaan
    gloss: ja, nee, natuurlijk, zelf, ik doe (het), graag gedaan
    note: 'Met *بله، لطفا* neem je een aanbod aan. Met *نه، ممنون* sla je het af, en *خودم انجام می‌دم* voegt toe: “ik doe het zelf wel”. *خواهش می‌کنم* is het antwoord op een bedankje.'
    example_gloss:
    - Ja, graag.
    - Nee, dank u, ik doe het zelf wel.
    - Graag gedaan.
  fa.a2.unit31.lesson02.teach.offer_pattern:
    title: 'Verzoek of aanbod: u of ik'
    gloss: Laat mij de deur dichtdoen.
    note: Een verzoek met *می‌شه* gebruikt de *u*-uitgang (*ببندید*), omdat je de ander iets vraagt. Een aanbod met *بذارید من* gebruikt de *ik*-uitgang (*ببندم*), omdat jij de handeling uitvoert. Vergelijk *می‌شه در رو ببندید؟* met *بذارید من در رو ببندم*.
  fa.a2.unit31.lesson02.teach.reply_pattern:
    title: Een beleefd antwoord heeft twee delen
    gloss: Ja, graag. Nee, dank u, ik doe het zelf wel.
    note: Aannemen doe je met *بله* plus *لطفا*. Afslaan doe je met *نه، ممنون*, en je voegt *خودم انجام می‌دم* toe als je wilt zeggen dat je het zelf wel redt.
  fa.a2.unit31.lesson03.teach.positive_imperatives:
    title: Bevelen in de bevestigende vorm
    gloss: ga, kom, doe; ga (beleefd), doe (beleefd)
    note: 'Een vriend krijgt de korte vorm: *برو*, *بیا*, *بکن*. Vreemden en groepen krijgen de *-ید*-vorm: *برید*, *بکنید*.'
    example_gloss:
    - Ga daarheen.
    - Kom hier.
    - Doe dit.
    - Gaat u daarheen.
  fa.a2.unit31.lesson03.teach.negative_imperatives:
    title: Bevelen in de ontkennende vorm
    gloss: ga niet, kom niet, doe niet; beleefde vormen en meervoudsvormen
    note: 'Vervang *ب-* door *نـ*: *برو* wordt *نرو*, *بکن* wordt *نکن*, *بیا* wordt *نیا*. De beleefde vormen zijn *نرید*, *نکنید* en de vaste uitdrukking *دست نزنید* (niet aanraken).'
    example_gloss:
    - Ga daar niet heen.
    - Kom hier niet.
    - Doe dit niet.
    - Gaat u daar niet heen.
    - Doet u dit niet.
    - Niet aanraken, alstublieft.
  fa.a2.unit31.lesson03.teach.negative_rule:
    title: نـ vervangt ب-
    gloss: برو en نرو, بیا en نیا, بکن en نکن
    note: 'Het bevestigende bevel begint met *ب-* en het ontkennende bevel met *نـ*. *بیا* en *نیا* werken net zo: ze verschillen alleen in de eerste letter. Alleen de ontkenning maakt er “niet” van.'
  fa.a2.unit31.lesson03.teach.polite_plural:
    title: Vriend of beleefd meervoud
    gloss: ga niet (vriend) en ga niet (beleefd)
    note: 'Voeg *-ید* toe voor een vreemde of voor meer dan één persoon: *نرو* wordt *نرید* en *نکن* wordt *نکنید*. Bordjes en winkeliers gebruiken de *-ید*-vormen: *لطفا دست نزنید*.'
  fa.a2.unit31.lesson04.teach.places_people:
    title: Buren en winkels
    gloss: buur, winkel, winkelier, tas, thee
    note: '*کیفم* betekent “mijn tas”; de uitgang *-م* betekent “mijn”. *تو مغازه* betekent “in de winkel”.'
    example_gloss:
    - Pardon, kunt u mij een thee geven?
    - Pardon, kunt u mij mijn tas geven?
    - Hallo, buurman, wilt u hulp?
    - Raak niets aan in de winkel.
  fa.a2.unit31.lesson04.teach.shop_request:
    title: Een beleefd verzoek in een winkel
    gloss: Pardon, kunt u mij een thee geven? Dank u.
    note: Begin met *ببخشید*, vraag met *می‌شه* en een beleefd werkwoord, en sluit af met *ممنون*.
  fa.a2.unit31.lesson05.teach.reading:
    title: Een briefje voor de buurman
    gloss: Hallo, pardon. Kunt u vandaag een brood kopen? Ik ben niet thuis. Doe alstublieft de deur dicht en blijf van mijn tas af. Dank u.
    note: Lees het eerst voor het verzoek en daarna nog eens voor de opdracht om de tas niet aan te raken.
  fa.a2.unit31.lesson06.teach.turn01:
    title: Sara vraagt om hulp
    gloss: 'Sara: Pardon, kunt u mij helpen?'
    note: Een beleefd verzoek met *می‌شه* en de *u*-uitgang.
  fa.a2.unit31.lesson06.teach.turn02:
    title: De buurman stemt in
    gloss: 'Buurman: Ja, natuurlijk. Wat moet ik doen?'
    note: '*چیکار کنم؟* vraagt wat je moet doen.'
  fa.a2.unit31.lesson06.teach.turn03:
    title: Een specifiek verzoek
    gloss: 'Sara: Kunt u de deur openen?'
    note: Het lijdend voorwerp *در رو* staat vóór het beleefde werkwoord.
  fa.a2.unit31.lesson06.teach.turn04:
    title: De buurman biedt meer aan
    gloss: 'Buurman: Ja. Laat mij uw tas dragen.'
    note: '*بذارید من ... ببرم* gebruikt de uitgang van de *ik*-vorm.'
  fa.a2.unit31.lesson06.teach.turn05:
    title: Sara slaat het af
    gloss: 'Sara: Nee, dank u, ik doe het zelf.'
    note: Een beleefde weigering met een reden.
  fa.a2.unit31.lesson06.teach.turn06:
    title: De buurman antwoordt
    gloss: 'Buurman: Graag gedaan.'
    note: '*خواهش می‌کنم* is het standaardantwoord op een bedankje.'
