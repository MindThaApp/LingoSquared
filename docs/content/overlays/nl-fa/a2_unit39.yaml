teaching:
  fa.a2.unit39.lesson01.teach.basic_words:
    title: Mensen, dagen en kleine woordjes
    gloss: ik, jij, hij/zij, zij (mv.), Sara, Nima, vandaag, morgen, laat, een, en, of, nee
    note: '*اون* betekent ''hij/zij/die'' en *اونا* betekent ''zij (mv.)''. Het Perzisch heeft geen apart woord voor ''hij'' en ''zij''.'
    example_gloss:
    - Jij en ik.
    - Sara en Nima.
    - Vandaag of morgen.
  fa.a2.unit39.lesson01.teach.have_forms:
    title: Werk of tijd hebben
    gloss: ik heb werk, jij hebt tijd, hij/zij heeft tijd
    note: '*کار دارم* betekent ''ik heb werk / ik ben bezig''. De uitgang verandert met de persoon: *دارم*, *داری*, *داره*.'
    example_gloss:
    - Ik heb vandaag werk.
    - Heb je morgen tijd?
    - Sara heeft morgen tijd.
  fa.a2.unit39.lesson01.teach.message_words:
    title: Berichten en briefjes
    gloss: bericht, briefje, telefoon, mijn collega, mijn vriend(in)
    note: Een telefonisch bericht is een *پیغام*; een geschreven bericht kan een *یادداشت* zijn. Aan *همکارم* en *دوستم* zie je niet of de persoon een man of een vrouw is.
    example_gloss:
    - Mijn vriend(in) heeft een bericht.
    - Mijn collega heeft een briefje.
    - Sara heeft een telefoon.
  fa.a2.unit39.lesson01.teach.home_forms:
    title: Thuis zijn
    gloss: thuis, is, is niet, jij bent
    note: '*خونه هست* betekent ''is thuis''. *هستی* is de vorm voor ''jij'' en *هست* de vorm voor ''hij/zij''.'
    example_gloss:
    - Nima is thuis.
    - Sara is niet thuis.
    - Ben je thuis?
  fa.a2.unit39.lesson01.teach.say_verbs:
    title: Werkwoorden om een bericht door te geven
    gloss: hij/zij zegt, ze zeggen, hij/zij vraagt, hij/zij wil
    note: Elk werkwoord staat in de tegenwoordige tijd, derde persoon. Gebruik *می‌گه* om een mededeling door te geven, *می‌پرسه* voor een vraag en *می‌خواد* voor een verzoek.
    example_gloss:
    - Mijn vriend(in) zegt.
    - Ze zeggen.
    - Mijn collega vraagt.
    - Sara wil.
  fa.a2.unit39.lesson01.teach.arrive_forms:
    title: Laat aankomen
    gloss: ik kom laat aan, hij/zij komt laat aan
    note: Hetzelfde werkwoord *می‌رسه* wordt gebruikt voor 'hij' en 'zij'.
    example_gloss:
    - Ik kom vandaag laat aan.
    - Sara komt laat aan.
  fa.a2.unit39.lesson01.teach.say_that:
    title: 'Een mededeling doorgeven: می‌گه که'
    gloss: Ik kom laat aan. Sara zegt dat ze laat aankomt.
    note: 'Om een mededeling door te geven zeg je eerst wie spreekt, dan *می‌گه که* en dan wat er gezegd is. Het werkwoord blijft in de tegenwoordige tijd. De persoon verandert: *دیر می‌رسم* (ik) wordt *دیر می‌رسه* (hij/zij). *که* (''dat'') kan in gesproken taal wegvallen, maar met که is het duidelijker dat je iets doorgeeft.'
  fa.a2.unit39.lesson02.teach.object_pronouns:
    title: Aan mij, aan jou, aan hem/haar, voor jou
    gloss: aan mij, aan jou, aan hem/haar, voor jou
    note: 'Deze korte vormen hechten de persoon aan de werkwoordsgroep: *بهم* (aan mij), *بهت* (aan jou), *بهش* (aan hem/haar).'
    example_gloss:
    - Ik heb een bericht voor u.
    - Sara heeft een bericht voor hem/haar.
    - Nima heeft een bericht voor mij.
  fa.a2.unit39.lesson02.teach.request_verbs:
    title: Wat de persoon wil dat je doet
    gloss: bellen, komen, antwoorden, lezen
    note: 'Na *می‌خواد که* is het tweede werkwoord een jij-vorm met *ب*: *بزنی*, *بیای*, *بدی*, *بخونی*.'
    example_gloss:
    - Sara wil dat je haar/hem belt.
    - Nima wil dat je morgen komt.
    - Mijn collega wil dat je antwoordt.
    - Mijn vriend wil dat je de notitie leest.
  fa.a2.unit39.lesson02.teach.call_forms:
    title: Ik bel, hij/zij belt
    gloss: Ik bel, hij/zij belt
    note: 'De tegenwoordige tijd gebruik je ook voor een plan: *فردا زنگ می‌زنم* kan betekenen "Ik bel morgen."'
    example_gloss:
    - Ik bel morgen.
    - Sara belt morgen.
  fa.a2.unit39.lesson02.teach.when_forms:
    title: Wanneer? Jij komt aan
    gloss: wanneer, jij komt aan
    note: '*کی* is een vraagwoord. In een indirecte vraag blijft het hetzelfde: *می‌پرسه که کی می‌رسی*.'
    example_gloss:
    - Wanneer kom je morgen aan?
    - Mijn collega vraagt wanneer je aankomt.
    - Wanneer ben jij thuis?
  fa.a2.unit39.lesson02.teach.asks_whether:
    title: 'Een vraag doorgeven: می‌پرسه'
    gloss: Hij/Zij vraagt of je tijd hebt. Hij/Zij vraagt wanneer je aankomt.
    note: 'Een ja/nee-vraag wordt *می‌پرسه که … یا نه*: *می‌پرسه که وقت داری یا نه*. Een vraagwoord blijft op zijn plaats: *می‌پرسه که کی می‌رسی*. Het vraagteken verdwijnt en het werkwoord blijft in de tegenwoordige tijd.'
  fa.a2.unit39.lesson02.teach.wants_you_to:
    title: 'Een verzoek doorgeven: می‌خواد که + ب-vorm'
    gloss: Hij/Zij wil dat je hem/haar belt.
    note: 'Om een verzoek door te geven gebruik je *می‌خواد که* en een werkwoord met *ب*: *می‌خواد که بهش زنگ بزنی*. Dit betekent niet "wil bellen": de jij-uitgang *ـی* laat zien dat jij degene bent die iets moet doen. Je kunt *که* weglaten: *می‌خواد بهش زنگ بزنی*.'
  fa.a2.unit39.lesson03.teach.key_car:
    title: Sleutel en auto
    gloss: sleutel, auto, mijn sleutel, zijn/haar sleutel, het is de auto
    note: 'Voeg *ـم* toe voor "mijn" en *ـش* voor "zijn/haar": *کلیدم*, *کلیدش*. In *تو ماشینه* betekent *تو* "in" en *ـه* "is".'
    example_gloss:
    - Mijn sleutel ligt in de auto.
    - Zijn/Haar sleutel ligt in de auto.
    - Sara heeft een auto.
  fa.a2.unit39.lesson03.teach.they_forms:
    title: Zij komen aan, zij hebben
    gloss: zij komen aan, zij hebben
    note: 'De uitgang voor "zij" is *ـن*: *می‌رسن*, *دارن*, *می‌گن*.'
    example_gloss:
    - Ze komen laat aan.
    - Ze hebben morgen werk.
  fa.a2.unit39.lesson03.teach.three_verbs:
    title: Mededeling, vraag of verzoek?
    gloss: Hij/Zij zegt dat hij/zij morgen tijd heeft. Hij/Zij vraagt of je morgen tijd hebt. Hij/Zij wil dat je belt.
    note: Het werkwoord laat zien wat voor soort bericht het is. *می‌گه* is een mededeling en eindigt met een hij/zij-werkwoord (*داره*). *می‌پرسه* is een vraag en het werkwoord gaat over "jij" (*داری*). *می‌خواد* is een verzoek en wordt gevolgd door een werkwoord met *ب* (*بزنی*).
  fa.a2.unit39.lesson03.teach.person_shift:
    title: Wat verandert er als je het doorgeeft
    gloss: Ik heb werk. Hij/Zij zegt dat hij/zij werk heeft. Mijn sleutel. Zijn/Haar sleutel.
    note: 'Als je iets doorgeeft, wordt "ik" uit het origineel "hij/zij". De werkwoordsuitgang *ـم* wordt *ـه* (*دارم* wordt *داره*) en het bezittelijke *ـم* wordt *ـش* (*کلیدم* wordt *کلیدش*). Het Perzisch maakt geen onderscheid tussen man en vrouw, dus *داره* betekent zowel "hij heeft" als "zij heeft". De tijd verandert niet: tegenwoordige tijd blijft tegenwoordige tijd.'
  fa.a2.unit39.lesson03.teach.says_vs_they_say:
    title: 'Eén persoon of meer: می‌گه en می‌گن'
    gloss: Hij/Zij zegt dat hij/zij laat aankomt. Zij zeggen dat ze laat aankomen.
    note: 'Eén letter maakt het verschil tussen één persoon en meer personen: *می‌گه … می‌رسه* (hij/zij) en *می‌گن … می‌رسن* (zij). Beide werkwoorden in het bericht moeten overeenkomen.'
  fa.a2.unit39.lesson04.teach.time_words:
    title: Nu, vanavond, vergadering
    gloss: nu, vanavond, vergadering
    note: '*جلسه* is een vergadering, vaak op het werk.'
    example_gloss:
    - Ik heb nu een vergadering.
    - Ben jij vanavond thuis?
    - Mijn collega heeft vanavond een vergadering.
  fa.a2.unit39.lesson04.teach.phone_phrases:
    title: Zinnen voor telefoonberichten
    gloss: Wat zegt je collega? Wat nog meer? Van wie? Ja.
    note: Met deze korte zinnen houd je een gesprek over een bericht gaande.
  fa.a2.unit39.lesson04.teach.note_pattern:
    title: Een notitie met een mededeling en een vraag
    gloss: Mijn collega zegt dat hij/zij vandaag laat aankomt en vraagt of je thuis bent.
    note: 'In een geschreven notitie verbind je de twee berichten met *و* en herhaal je het werkwoord voor elk bericht: *می‌گه که …* en *می‌پرسه که … یا نه*. Degene die spreekt staat voorop en wordt niet herhaald.'
  fa.a2.unit39.lesson05.teach.reading:
    title: Een notitie voor Nima
    gloss: Nima, ik heb een bericht voor je. Je collega zegt dat hij/zij vandaag een vergadering heeft en laat aankomt. Hij/Zij vraagt of je morgen tijd hebt en wil dat je hem/haar belt.
    note: Lees eerst om te zien van wie het bericht komt en lees daarna nog eens om de mededeling, de vraag en het verzoek van elkaar te onderscheiden.
  fa.a2.unit39.lesson06.teach.turn01:
    title: Sara heeft een bericht
    gloss: Sara zegt tegen Nima dat ze een bericht voor hem heeft.
    note: In de opening wordt het bericht genoemd.
  fa.a2.unit39.lesson06.teach.turn02:
    title: Nima vraagt van wie het is
    gloss: Van wie?
    note: Met een korte vraag vraag je naar de afzender.
  fa.a2.unit39.lesson06.teach.turn03:
    title: Sara noemt de afzender en de eerste mededeling
    gloss: Van je collega. Hij/Zij zegt dat hij/zij vandaag laat aankomt.
    note: Sara geeft een mededeling door met *می‌گه که*.
  fa.a2.unit39.lesson06.teach.turn04:
    title: Nima vraagt om meer
    gloss: Wat zegt hij/zij nog meer?
    note: '*دیگه چی* vraagt naar het volgende deel.'
  fa.a2.unit39.lesson06.teach.turn05:
    title: Sara geeft een vraag en een verzoek door
    gloss: Hij/Zij vraagt of je morgen tijd hebt en wil dat je hem/haar belt.
    note: Het ene bericht is een vraag, het andere een verzoek.
  fa.a2.unit39.lesson06.teach.turn06:
    title: Nima antwoordt
    gloss: Ja, ik heb morgen tijd. Ik bel hem/haar nu.
    note: Nima antwoordt in de ik-vorm, omdat hij voor zichzelf spreekt.
