teaching:
  fr.a1.unit01.lesson01.teach.bonjour:
    title: سلام معمولی
    gloss: سلام؛ روز بخیر
    note: Bonjour را می‌شود در طول روز با غریبه‌ها، همکارها و دوستان به کار برد. برخلاف «سلام» در فارسی، معنای «روز بخیر» را هم دارد.
  fr.a1.unit01.lesson01.teach.salut:
    title: سلام صمیمی
    gloss: سلام؛ خداحافظ
    note: Salut برای رابطهٔ صمیمی است. هم برای شروع و هم برای پایان گفتگو به کار می‌رود، ولی برای اولین صحبت با یک بزرگسال ناآشنا انتخاب امنی نیست.
  fr.a1.unit01.lesson01.teach.au_revoir:
    title: خداحافظی معمولی
    gloss: خداحافظ
    note: Au revoir هم در موقعیت رسمی کار می‌کند و هم در موقعیت صمیمی.
  fr.a1.unit01.lesson01.teach.tu:
    title: «تو» (مفرد صمیمی)
    gloss: تو (غیررسمی، مفرد)
    note: فارسی هم مثل فرانسوی «تو» و «شما» دارد. tu را برای یک دوست، یک بچه یا کسی که رابطهٔ صمیمی با او دارید به کار می‌برید و فعلش هم شکل مخصوص خودش را دارد.
  fr.a1.unit01.lesson01.teach.vous:
    title: «شما» (محترمانه یا جمع)
    gloss: شما (مفرد محترمانه یا جمع)
    note: Vous برای یک بزرگسال ناآشنا امن‌ترین انتخاب است و برای هر گروهی هم به کار می‌رود؛ درست مثل «شما» در فارسی.
  fr.a1.unit01.lesson01.teach.comment_allez_vous:
    title: پرسیدن حال به شکل رسمی
    gloss: حال شما چطوره؟
    note: Allez شکل vous فعل aller است. فعل و ضمیر جابه‌جا شده‌اند و با خط‌تیره به هم وصل می‌شوند. این یک پرسش مؤدبانهٔ قالبی است و معنای واقعی «کجا می‌روید؟» را نمی‌دهد.
  fr.a1.unit01.lesson01.teach.comment_vas_tu:
    title: پرسیدن حال به شکل صمیمی
    gloss: حال شما چطوره؟
    note: Vas شکل tu فعل aller است. وقتی رابطه صمیمی می‌شود، allez-vous به vas-tu تبدیل می‌شود؛ مثل فرق «حال شما چطور است؟» با «حالت چطوره؟».
  fr.a1.unit01.lesson01.teach.register_choice:
    title: جور کردن سلام با نوع رابطه
    gloss: سلام رسمی با «شما»؛ سلام صمیمی با «تو»
    note: این جفت‌ها پیش‌فرض‌های مفیدند، نه قانون مطلق. Bonjour را با دوستان هم می‌شود گفت، ولی salut همراه با vous معمولاً پیام‌های اجتماعی ناهماهنگی می‌دهد.
  fr.a1.unit01.lesson02.teach.je_mappelle:
    title: گفتن اسم خودتان
    gloss: اسمم Camille است.
    note: Je m’appelle یعنی «خودم را ... صدا می‌زنم». در فارسی می‌شود ضمیر فاعلی را حذف کرد، ولی در فرانسوی معمولاً باید je بیاید. مصوت me قبل از appelle حذف می‌شود و m’appelle درست می‌شود.
  fr.a1.unit01.lesson02.teach.comment_appelez_vous:
    title: پرسیدن اسم به شکل مؤدبانه
    gloss: اسم شما چیه؟
    note: 'Appelez شکل vous فعل appeler است. vous دوم بعد از فعل می‌آید، چون پرسش با جابه‌جایی ساخته شده است: vous appelez-vous.'
  fr.a1.unit01.lesson02.teach.tu_tappelles:
    title: پرسیدن اسم به شکل صمیمی
    gloss: اسم شما چیه؟
    note: T’appelles شکل tu است و ضمیر te قبل از مصوت کوتاه شده است. در این پرسش رایج، tu قبل از فعل می‌آید و comment آخر جمله قرار می‌گیرد.
  fr.a1.unit01.lesson02.teach.moi_cest:
    title: معرفی خود در گفتگوی روزمره
    gloss: من Noé هستم.
    note: Moi, c’est در گفتار برای معرفی خود رایج است و از ترجمهٔ کلمه‌به‌کلمهٔ «من ... هستم» محاوره‌ای‌تر است.
  fr.a1.unit01.lesson02.teach.enchante:
    title: مطابقت مذکر
    gloss: از آشنایی‌تون خوشبختم.
    note: گوینده مرد معمولاً enchanté می‌نویسد. صفت‌ها در فارسی جنسیت ندارند، ولی این صفت فرانسوی با جنسیت گوینده تغییر می‌کند.
  fr.a1.unit01.lesson02.teach.enchantee:
    title: مطابقت مؤنث
    gloss: از آشنایی‌تون خوشبختم.
    note: گوینده زن معمولاً enchantée می‌نویسد و یک e در آخر اضافه می‌کند. Enchanté و enchantée معمولاً یکسان تلفظ می‌شوند، پس این تفاوت در نوشتار روشن‌تر از گفتار است.
  fr.a1.unit01.lesson02.teach.et_vous:
    title: پرسش را مؤدبانه برگرداندن
    gloss: شما چطور؟
    note: vous را برای حفظ لحن مؤدبانه یا خطاب به یک گروه به کار ببرید.
  fr.a1.unit01.lesson02.teach.et_toi:
    title: پرسش را صمیمی برگرداندن
    gloss: شما چطور؟
    note: Toi شکل تأکیدی مربوط به tu است. بعد از et باید toi گفت، نه tu.
  fr.a1.unit01.lesson03.teach.elision_jhabite:
    title: حذف مصوت قبل از مصوت
    gloss: من زندگی می‌کنم
    note: 'Je قبل از habite مصوتش را از دست می‌دهد و آپستروف این حذف را نشان می‌دهد: j’habite. حرف h در habiter مانع این حذف نمی‌شود.'
  fr.a1.unit01.lesson03.teach.liaison_vous_etes:
    title: پیوند آوایی بعد از vous
    gloss: شما هستید
    note: 's پایانی vous معمولاً خوانده نمی‌شود، اما قبل از صدای مصوت êtes مثل صدای z به آن وصل می‌شود: vous êtes تقریباً مثل «وو-زت» شنیده می‌شود. این پیوند مربوط به گفتار است، نه املا.'
  fr.a1.unit01.lesson03.teach.liaison_un_atelier:
    title: پیوند آوایی بعد از un
    gloss: یک کارگاه
    note: n پایانی un به atelier وصل می‌شود. بین این دو کلمه مکث نکنید.
  fr.a1.unit01.lesson03.teach.final_e_enchante:
    title: املای مذکر
    gloss: خوشبختم (گوینده مرد)
    note: Enchanté برای گوینده مرد با é تمام می‌شود. -an- یک مصوت خیشومی است؛ پس صدای n جداگانه‌ای تلفظ نکنید.
  fr.a1.unit01.lesson03.teach.final_e_enchantee:
    title: املای مؤنث
    gloss: خوشبختم (گوینده زن)
    note: Enchantée برای مطابقت مؤنث یک e اضافه دارد، ولی این e معمولاً هجای تازه‌ای به تلفظ اضافه نمی‌کند.
  fr.a1.unit01.lesson03.teach.question_liaison:
    title: خواندن پرسش با جابه‌جایی
    gloss: حال شما چطوره؟
    note: allez-vous را به‌صورت یک واحد پیوسته بخوانید. حرف z در allez اینجا صدای z اضافه نمی‌دهد؛ تلفظ استاندارد تقریباً «آله وو» است.
  fr.a1.unit01.lesson04.teach.ca_va:
    title: پرسش روزمرهٔ احوال‌پرسی
    gloss: چطورید؟؛ خوبید؟
    note: Ça یک سدیل دارد که باعث می‌شود c قبل از a مثل s خوانده شود. همین عبارت بسته به آهنگ صدا می‌تواند پرسش باشد یا پاسخ.
  fr.a1.unit01.lesson04.teach.tres_bien:
    title: پاسخ خیلی مثبت
    gloss: خیلی خوبم، ممنون.
    note: Très معنای bien را قوی‌تر می‌کند. s پایانی آن خوانده نمی‌شود.
  fr.a1.unit01.lesson04.teach.ca_va_bien:
    title: پاسخ مثبت
    gloss: خوبم.
    note: در این پاسخ ثابت، فرانسوی به ضمیر «من» نیازی ندارد.
  fr.a1.unit01.lesson04.teach.pas_mal:
    title: پاسخ نسبتاً مثبت
    gloss: بد نیست.
    note: Pas mal معمولاً کمی مثبت است، درست مثل «بد نیست» در فارسی.
  fr.a1.unit01.lesson04.teach.fatigue:
    title: مطابقت صفت مذکر
    gloss: کمی خسته‌ام.
    note: Suis شکل je فعل être است. گوینده مرد fatigué می‌نویسد. «خسته» در فارسی با جنسیت گوینده تغییر نمی‌کند، ولی در فرانسوی تغییر می‌کند.
  fr.a1.unit01.lesson04.teach.fatiguee:
    title: مطابقت صفت مؤنث
    gloss: کمی خسته‌ام.
    note: گوینده زن fatiguée را با e پایانی می‌نویسد. شکل مذکر و مؤنث معمولاً یکسان تلفظ می‌شوند.
  fr.a1.unit01.lesson04.teach.et_vous:
    title: پرسش را مؤدبانه برگرداندن
    gloss: شما چطور؟
    note: Vous لحن محترمانه‌ای را که با یک بزرگسال ناآشنا لازم است حفظ می‌کند.
  fr.a1.unit01.lesson04.teach.et_toi:
    title: پرسش را صمیمی برگرداندن
    gloss: شما چطور؟
    note: وقتی با یک دوست یا همسن‌وسال صمیمی صحبت می‌کنید، بعد از et از toi استفاده کنید.
  fr.a1.unit01.lesson05.teach.here_for_workshop:
    title: تأیید دلیل آمدن کسی
    gloss: برای کارگاه اینجا هستید؟
    note: Êtes شکل vous فعل être است. فرانسوی برای پرسش فعل کمکی جدایی نمی‌خواهد؛ بالا رفتن آهنگ صدا جمله را پرسشی می‌کند.
  fr.a1.unit01.lesson05.teach.yes_thats_it:
    title: تأیید یک حدس
    gloss: آره، درسته.
    note: C’est ça یک تأیید طبیعی است و ترجمهٔ کلمه‌به‌کلمهٔ «آن این است» را نمی‌رساند.
  fr.a1.unit01.lesson05.teach.live_neighborhood:
    title: پرسیدن محل زندگی
    gloss: توی این محله زندگی می‌کنید؟
    note: Habitez شکل vous فعل habiter است. فرانسوی هم مثل فارسی می‌تواند ترتیب جملهٔ خبری را نگه دارد و فقط با آهنگ پرسشی بپرسد.
  fr.a1.unit01.lesson05.teach.i_live:
    title: گفتن محل زندگی
    gloss: من در Montreuil زندگی می‌کنم.
    note: J’habite شکل je فعل habiter است که مصوتش حذف شده. À برای محل شهر می‌آید و نباید با a، شکل فعلی به معنای «دارد»، اشتباه گرفته شود.
  fr.a1.unit01.lesson05.teach.from_here:
    title: پرسیدن اهل کجا بودن
    gloss: شما اهل اینجایید؟
    note: D’ici از ترکیب de و ici با حذف مصوت ساخته شده است. Êtes همچنان شکل vous فعل être است.
  fr.a1.unit01.lesson05.teach.from_lille:
    title: گفتن اهل کجا بودن
    gloss: من اهل Lille هستم.
    note: Suis شکل je فعل être است. فرانسوی برای گفتن اصالت، قبل از نام شهر de می‌آورد.
  fr.a1.unit01.lesson05.teach.workshop_starts:
    title: فعالیت شروع می‌شود
    gloss: کارگاه دارد شروع می‌شود.
    note: Atelier مذکر است، پس حرف تعریف مفردش le است. قبل از مصوت، le به l’ تبدیل می‌شود. Commence شکل سوم‌شخص مفرد است.
  fr.a1.unit01.lesson05.teach.see_you_shortly:
    title: خداحافظی کوتاه‌مدت
    gloss: تا کمی بعد؛ امروز دوباره می‌بینیم‌تان
    note: À tout à l’heure یعنی همان روز دوباره همدیگر را می‌بینید؛ برخلاف یک خداحافظی عمومی که زمان دیدار بعدی در آن معلوم نیست.
  fr.a1.unit01.lesson06.teach.line01:
    title: شروع دیدار
    gloss: Inès به Mathieu سلام می‌کند و می‌پرسد برای کارگاه آشپزی آمده است یا نه.
    note: هر دو با vous شروع می‌کنند، چون بزرگسالانی ناآشنا هستند.
  fr.a1.unit01.lesson06.teach.line02:
    title: شروع دیدار، پاسخ
    gloss: Mathieu تأیید می‌کند و اسمش را می‌گوید، بعد اسم او را می‌پرسد.
    note: Je m’appelle راه معمول گفتن اسم است.
  fr.a1.unit01.lesson06.teach.line03:
    title: گفتن اسم
    gloss: Inès اسمش را می‌گوید و می‌گوید از آشنایی با او خوشحال است.
    note: Enchantée با Inès که مؤنث است مطابقت دارد؛ e پایانی نوشته می‌شود، اما معمولاً شنیده نمی‌شود.
  fr.a1.unit01.lesson06.teach.line04:
    title: گفتن اسم، پاسخ
    gloss: Mathieu همین احساس را برمی‌گرداند و می‌پرسد او نزدیک اینجا زندگی می‌کند یا نه.
    note: Enchanté با Mathieu که مذکر است مطابقت دارد؛ همان کلمه‌ای است که Inès گفت، فقط بدون e بی‌صدا.
  fr.a1.unit01.lesson06.teach.line05:
    title: تبادل اطلاعات دربارهٔ محله
    gloss: Inès تأیید می‌کند و خیابانش را می‌گوید، بعد همین سؤال را از Mathieu می‌پرسد.
    note: بعد از J’habite و قبل از اسم خیابان، یعنی قبل از rue، حرف اضافه نمی‌آید.
  fr.a1.unit01.lesson06.teach.line06:
    title: تبادل اطلاعات دربارهٔ محله، پاسخ
    gloss: Mathieu می‌گوید در Saint-Ouen زندگی می‌کند و می‌پرسد او اصالتاً اهل اینجاست یا نه.
    note: J’habite à قبل از نام یک مکان، یعنی شهر، à می‌آورد؛ برخلاف عبارت خیابانی که Inès همین حالا به کار برد.
  fr.a1.unit01.lesson06.teach.line07:
    title: تبادل اطلاعات دربارهٔ اصالت
    gloss: Inès می‌گوید اهل اینجا نیست و از Lille است، بعد همین را از Mathieu می‌پرسد.
    note: Je suis de به‌اضافهٔ نام یک شهر یا کشور نشان می‌دهد کسی اهل کجاست.
  fr.a1.unit01.lesson06.teach.line08:
    title: پرسیدن از زادگاه، پاسخ
    gloss: ماتیو می‌گوید اهل لیون است.
    note: همان الگوی je suis de است که اینس همین الان به کار برد.
  fr.a1.unit01.lesson06.teach.line09:
    title: قطع کردن گفت‌وگو
    gloss: اینس متوجه می‌شود کارگاه دارد شروع می‌شود و می‌گوید چند لحظهٔ دیگر او را می‌بیند.
    note: À tout à l’heure مناسب است، چون هر دو نفر در همان مراسم می‌مانند.
  fr.a1.unit01.lesson06.teach.line10:
    title: قطع کردن گفت‌وگو، پاسخ
    gloss: ماتیو همان خداحافظی را تکرار می‌کند.
    note: تکرار à tout à l’heure طبیعی‌ترین راه برای تأیید آن است.
exercises:
  fr.a1.unit01.lesson01.exercise01.listen_bonjour:
    instruction: گوش بدهید و عبارتی را که می‌شنوید انتخاب کنید.
    correct_option: Bonjour.
    distractors:
    - Salut !
    - Au revoir.
    accepted_answers:
    - Bonjour.
