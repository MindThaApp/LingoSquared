teaching:
  fr.a1.unit09.lesson01.teach.a_gauche:
    title: سمت چپ
    gloss: سمت چپ / به چپ
    note: '*À gauche* هم برای مکان به کار می‌رود («سمت چپ است») و هم برای جهت («به چپ بپیچید»).'
    example_gloss: بعد از نانوایی به چپ بپیچید.
  fr.a1.unit09.lesson01.teach.a_droite:
    title: سمت راست
    gloss: سمت راست / به راست
    note: درست نقطهٔ مقابل *à gauche* است و به همان شکل به کار می‌رود.
    example_gloss: داروخانه سمت راستِ کافه است.
  fr.a1.unit09.lesson01.teach.tout_droit:
    title: مستقیم
    gloss: مستقیم
    note: '*Tout droit* یعنی «مستقیم». آن را با *à droite* («به راست») اشتباه نگیرید؛ شکلشان شبیه است ولی معنایشان فرق دارد.'
    example_gloss: تا بازار مستقیم بروید.
  fr.a1.unit09.lesson01.teach.au_coin_de_la_rue:
    title: سر پیچ خیابان
    gloss: سر نبش خیابان
    note: '*Au coin de* یعنی «سر پیچِ...»؛ *au coin de la rue* (سر پیچ خیابان) یک نشانی بسیار رایج است.'
    example_gloss: مغازه سر پیچ خیابان است.
  fr.a1.unit09.lesson01.teach.traverser:
    title: رد شدن (از عرض)
    gloss: عبور کردن
    note: '*Traverser* یک فعل باقاعده با پایانهٔ -ER است: *je traverse*، *tu traverses* و همین‌طور بقیه.'
    example_gloss: برای رسیدن به مغازه باید از خیابان رد شوید.
  fr.a1.unit09.lesson01.teach.la_boutique:
    title: مغازه
    gloss: مغازه
    note: '*La boutique* معمولاً یعنی یک مغازهٔ کوچک و تخصصی، نه یک فروشگاه بزرگ.'
    example_gloss: مغازه سر پیچ خیابان، سمت راست است.
  fr.a1.unit09.lesson01.teach.le_carrefour:
    title: چهارراه
    gloss: چهارراه / تقاطع
    note: '*Le carrefour* جایی است که دو خیابان همدیگر را قطع می‌کنند؛ در آدرس دادن به زبان محاوره نشانی رایجی است.'
    example_gloss: سر چهارراه به چپ بپیچید.
  fr.a1.unit09.lesson02.teach.pour_aller_a:
    title: پرسیدن مسیر
    gloss: ببخشید، برای رفتن به مغازه لطفاً چطور باید بروم؟
    note: '*Pour aller à... ?* (تحت‌اللفظی: «برای رفتن به...») شکل استاندارد و مؤدبانه برای پرسیدن آدرس یک مکان است.'
  fr.a1.unit09.lesson02.teach.tournez_a_gauche:
    title: پیچیدن به چپ
    gloss: بعد از داروخانه به چپ بپیچید.
    note: '*Tournez* امرِ شکل *vous* از *tourner* (پیچیدن) است؛ لحن معمول برای آدرس دادن به کسی که خوب نمی‌شناسیدش.'
  fr.a1.unit09.lesson02.teach.continuez_tout_droit:
    title: مستقیم ادامه بدهید
    gloss: تا چهارراه مستقیم بروید.
    note: '*Continuez* (ادامه بدهید) + *tout droit* (مستقیم) شکل استاندارد برای این است که به کسی بگویید بدون پیچیدن به راهش ادامه بدهد.'
  fr.a1.unit09.lesson02.teach.cest_au_coin:
    title: مکان را بگویید
    gloss: سر پیچ خیابان، سمت راست است.
    note: '*Au coin de la rue* را با *à droite* ترکیب می‌کند تا مکان دقیق گفته شود.'
  fr.a1.unit09.lesson02.teach.cest_loin:
    title: بگویید دور نیست
    gloss: دور نیست، پنج دقیقه پیاده است.
    note: '*À cinq minutes à pied* (پنج دقیقه پیاده) همان الگوی زمانِ پیاده‌روی است که وقتی ماتیو دربارهٔ داروخانه پرسید دیدید.'
  fr.a1.unit09.lesson03.teach.line01:
    title: دربارهٔ یک مغازه بپرسید
    gloss: اینس از ماتیو می‌پرسد مغازه‌ای برای خرید وسایل آشپزخانه می‌شناسد یا نه.
    note: '*Tu connais... ?* (می‌شناسی...؟) شکل صمیمی و رایج برای پرسیدن این است که کسی جایی را می‌شناسد یا نه.'
  fr.a1.unit09.lesson03.teach.line02:
    title: گفتن مرحله‌ی اول
    gloss: ماتیو می‌گوید بله، یکی نزدیک اینجاست؛ سر چهارراه به چپ می‌پیچی.
    note: '*Il y en a une* (یکی هست) با *en* از تکرار *boutique* جلوگیری می‌کند؛ میان‌بری رایج در فرانسوی محاوره‌ای.'
  fr.a1.unit09.lesson03.teach.line03:
    title: تأیید کنید و ادامه را بپرسید
    gloss: اینس تأیید می‌کند که سر چهارراه به چپ، و می‌پرسد بعدش چه کار کند.
    note: '*Et ensuite ?* (و بعدش؟) راهی ساده و طبیعی برای پرسیدن مرحلهٔ بعدی مسیر است.'
  fr.a1.unit09.lesson03.teach.line04:
    title: گفتن مرحله‌ی دوم
    gloss: ماتیو می‌گوید بعدش مستقیم می‌روی و از خیابان رد می‌شوی.
    note: دو فعل مسیر با *et* پشت سر هم آمده‌اند؛ راهی طبیعی برای گفتن یک مسیر کوتاه.
  fr.a1.unit09.lesson03.teach.line05:
    title: دقیقاً کجا را بپرسید
    gloss: اینس می‌پرسد مغازه دقیقاً کجاست.
    note: '*Exactement* (دقیقاً) جوابی دقیق‌تر از یک جهت کلی می‌خواهد.'
  fr.a1.unit09.lesson03.teach.line06:
    title: مکان دقیق را بگویید
    gloss: ماتیو می‌گوید سر پیچ خیابان است، درست روبه‌روی نانوایی.
    note: '*En face de* (روبه‌روی) مکان را با یک نشانه مشخص می‌کند و پایانی طبیعی برای آدرس دادن است.'
