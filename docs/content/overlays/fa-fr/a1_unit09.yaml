course:
  title: فرانسه A1
  description: پرسیدن و دادن آدرس ساده در خیابان (à gauche/à droite، tout droit، au coin de la rue، traverser)، در ادامهٔ داستان کارگاه آشپزی اینس و ماتیو، وقتی اینس دنبال یک مغازهٔ لوازم آشپزخانه می‌گردد. در فرانسوی آدرس را هم می‌شود با امر شما گفت («Tournez à gauche») و هم با زمان حال («Tu tournes à gauche»)؛ در این درس هر دو شکل را یاد می‌گیرید.
units:
