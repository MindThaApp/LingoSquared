teaching:
  fr.a1.unit51.lesson01.teach.combien_ca_coute:
    title: پرسیدن قیمت کل
    gloss: در مجموع چقدر می‌شود؟
    note: '*En tout* (در مجموع) روشن می‌کند که قیمت کل را می‌خواهید، نه قیمت یک چیز.'
  fr.a1.unit51.lesson01.teach.ca_coute_vingt:
    title: گفتن قیمت کل
    gloss: در مجموع بیست‌وپنج یورو قیمت دارد.
    note: '*Ça coûte* از *ça* (آن) و *coûte* ساخته شده، شکلی از *coûter* (قیمت داشتن) که برای یک چیز به کار می‌رود.'
  fr.a1.unit51.lesson02.teach.payer_par_carte:
    title: پرداخت با کارت یا نقدی
    gloss: با کارت پرداخت کردن، نقدی پرداخت کردن
    note: '*Payer par carte* راه معمول گفتن پرداخت با کارت است و *payer en espèces* یعنی پرداخت نقدی. با *carte* از *par* و با *espèces* از *en* استفاده کنید.'
    example_gloss:
    - می‌توانم اینجا با کارت پرداخت کنم؟
    - نقدی پرداخت می‌کنم.
  fr.a1.unit51.lesson02.teach.je_peux_payer:
    title: پرسیدن امکان پرداخت با کارت
    gloss: می‌توانم اینجا با کارت پرداخت کنم؟
    note: '*Ici* (اینجا) سؤال را به همان باجه‌ای که جلویش ایستاده‌اید ربط می‌دهد.'
  fr.a1.unit51.lesson02.teach.vous_voulez_payer:
    title: پرسیدن درباره روش پرداخت
    gloss: می‌خواهید نقدی پرداخت کنید یا با کارت؟
    note: '*Vous voulez ... ?* شکل رسمی پرسیدن است که صندوقدارِ ناآشنا به کار می‌برد؛ دوستان می‌گویند *tu veux ... ?*.'
  fr.a1.unit51.lesson03.teach.l_addition:
    title: صورت‌حساب
    gloss: صورت‌حساب
    note: '*Addition* مؤنث است: *l''addition*. *La* قبل از حرف صدادار به *l''* تبدیل می‌شود.'
    example_gloss: حساب را تقسیم کنیم؟
  fr.a1.unit51.lesson03.teach.on_partage_l:
    title: پیشنهاد تقسیم صورت‌حساب
    gloss: حساب را تقسیم کنیم؟
    note: '*On ... ?* پیشنهاد انجام کاری با هم است، مثل *On partage ?*. *Partager* (تقسیم کردن) با *l''addition* به کار می‌رود.'
  fr.a1.unit51.lesson03.teach.je_peux_payer:
    title: درخواست پرداخت جداگانه
    gloss: می‌شود جداگانه پرداخت کنم؟
    note: '*Séparément* (جداگانه) درست بعد از *payer* می‌آید؛ راه مؤدبانه‌ی درخواست پرداخت سهم خودتان از صورت‌حساب است.'
  fr.a1.unit51.lesson04.teach.la_monnaie:
    title: باقی‌مانده پول
    gloss: پول خرد
    note: '*Monnaie* مؤنث است: *la monnaie*. یعنی سکه‌ها و اسکناس‌هایی که پس می‌گیرید.'
    example_gloss: بفرمایید، پول خردتان.
  fr.a1.unit51.lesson04.teach.voici_votre_monnaie:
    title: دادن باقی‌مانده پول
    gloss: بفرمایید، پول خردتان.
    note: '*Votre* شکل رسمی «شما»ی ملکی است و با لحن *vous* پشت باجه هماهنگ است.'
  fr.a1.unit51.lesson04.teach.je_n_ai:
    title: نپذیرفتن باقی‌مانده پول
    gloss: باقی‌مانده پول را لازم ندارم.
    note: 'بعد از *Avoir besoin de* (نیاز داشتن) اسم می‌آید: *Je n''ai pas besoin de monnaie.* بعد از *ne ... pas*، *de* جای *de la* را می‌گیرد.'
  fr.a1.unit51.lesson05.teach.trente_cinq:
    title: سی‌وپنج
    gloss: سی‌وپنج
    note: '*Trente-cinq* با خط تیره نوشته می‌شود و اول دهگان می‌آید: سی + پنج.'
    example_gloss: سی‌وپنج یورو قیمت دارد.
  fr.a1.unit51.lesson05.teach.addition_deux_plats:
    title: خواندن صورت‌حساب رستوران
    gloss: 'صورت‌حساب: دو غذای اصلی و دو قهوه. مجموع: سی‌وپنج یورو. پرداخت با کارت.'
    note: به این توجه کنید که چه چیزی سفارش داده شده، مجموع چقدر است و چطور پرداخت شده است.
    glosses:
      Addition: صورت‌حساب
      deux: دو
      plats: غذاهای اصلی
      cafés: قهوه‌ها
      Total: مجموع
      trente-cinq: سی‌وپنج
      euros: یورو
      Payé: پرداخت‌شده
      carte: کارت
  fr.a1.unit51.lesson06.teach.camille_on_demande:
    title: Camille صورت‌حساب را می‌خواهد
    gloss: 'Camille: صورت‌حساب را بخواهیم؟'
    note: '*Demander* (درخواست کردن) مفعول مستقیمش *l''addition* است، بدون هیچ حرف اضافه‌ای.'
  fr.a1.unit51.lesson06.teach.mathieu_oui_bonne:
    title: Mathieu مبلغ کل را می‌پرسد
    gloss: 'Mathieu: بله، فکر خوبیه. روی هم چقدر می‌شه؟'
    note: پرسش *Combien ça coûte en tout ?* از درس اول دوباره آمده است.
  fr.a1.unit51.lesson06.teach.camille_ca_fait:
    title: Camille مبلغ کل را می‌گوید
    gloss: 'Camille: می‌شه سی‌وپنج یورو. حساب رو نصف کنیم؟'
    note: '*Ça fait* + یک مبلغ، مجموع حساب را اعلام می‌کند و *partager* به صورت‌حساب برمی‌گردد.'
  fr.a1.unit51.lesson06.teach.mathieu_non_laisse:
    title: Mathieu اصرار می‌کند خودش حساب کند
    gloss: 'Mathieu: نه، بذار امروز من پرداخت کنم. خیلی کمکم کردی.'
    note: '*Laisse-moi* + مصدر برای پیشنهاد انجام کاری به کار می‌رود و *aidé* اسم مفعول فعل *aider* (کمک کردن) است.'
  fr.a1.unit51.lesson06.teach.camille_c_est:
    title: Camille قدردانی می‌کند
    gloss: 'Camille: لطف داری! ممنون.'
    note: '*C''est gentil de ta part* (لطف داری) تعارف گرم و رایجی برای کار بزرگوارانه‌ی کسی است.'
  fr.a1.unit51.lesson06.teach.mathieu_je_peux:
    title: Mathieu درباره‌ی پرداخت با کارت می‌پرسد
    gloss: 'Mathieu: می‌تونم اینجا با کارت پرداخت کنم؟'
    note: '*Je peux payer par carte ici ?* از درس دوم دوباره آمده، این بار در خود رستوران.'
  fr.a1.unit51.lesson06.teach.mathieu_paie_l:
    title: 'Paie: شکل سوم‌شخص مفرد'
    gloss: Mathieu صورت‌حساب را پرداخت می‌کند.
    note: '*Paie* شکل *il/elle* فعل *payer* (پرداخت کردن) است: *je paie, tu paies, il paie*.'
