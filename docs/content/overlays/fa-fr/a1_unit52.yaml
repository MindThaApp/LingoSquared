teaching:
  fr.a1.unit52.lesson01.teach.lire_faire_du:
    title: مطالعه، ورزش، آشپزی
    gloss: خواندن، ورزش کردن، آشپزی کردن
    note: 'سه فعل رایج برای سرگرمی: *lire* (خواندن)، *faire du sport* (ورزش کردن) و *cuisiner* (آشپزی کردن).'
    example_gloss:
    - دوست دارم کتاب بخونم.
    - شنبه‌ها ورزش می‌کنم.
    - دوست دارم برای دوستام آشپزی کنم.
  fr.a1.unit52.lesson01.teach.le_temps_libre:
    title: اوقات فراغت
    gloss: اوقات فراغت
    note: '*Temps libre* مذکر است: *le temps libre*. این عبارت کلیدی برای حرف زدن درباره‌ی سرگرمی‌هاست.'
    example_gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
  fr.a1.unit52.lesson01.teach.pendant_mon_temps:
    title: گفتن اینکه در اوقات فراغتتان چه کار می‌کنید
    gloss: توی اوقات فراغتم دوست دارم کتاب بخونم.
    note: '*Lis* شکل *je* فعل *lire* (خواندن) است؛ *s* پایانی تلفظ نمی‌شود.'
  fr.a1.unit52.lesson02.teach.ecouter_de_la:
    title: موسیقی، نقاشی، بازی ویدیویی
    gloss: گوش دادن به موسیقی، نقاشی کردن، بازی ویدیویی کردن
    note: 'سه سرگرمی دیگر: *écouter de la musique*، *dessiner* و *jouer aux jeux vidéo*. برای بازی‌ها، *jouer à* + *les* به *jouer aux* تبدیل می‌شود.'
    example_gloss:
    - دوست دارم موسیقی گوش بدم.
    - اغلب نقاشی می‌کشم.
    - دوست دارم با دوستام بازی ویدیویی کنم.
  fr.a1.unit52.lesson02.teach.j_aime_ecouter:
    title: گفتن اینکه دوست دارید به موسیقی گوش بدید
    gloss: دوست دارم موسیقی گوش بدم.
    note: '*Écouter* مفعولش را مستقیم می‌گیرد، بدون حرف اضافه: *écouter de la musique*.'
  fr.a1.unit52.lesson02.teach.j_aime_jouer:
    title: گفتن اینکه دوست دارید با دوستانتان بازی ویدیویی کنید
    gloss: دوست دارم با دوستام بازی ویدیویی کنم.
    note: '*Avec des amis* (با دوستان) واژه‌ی *amis* را از درس اول دوباره به کار می‌برد؛ *des* نشانه‌ی جمع و به معنی «چند» است.'
  fr.a1.unit52.lesson03.teach.toujours_souvent_parfois:
    title: همیشه، اغلب، گاهی، هرگز
    gloss: همیشه، اغلب، گاهی، هرگز
    note: چهار قید تکرار اصلی. شاید *souvent* را قبلاً دیده باشید؛ *toujours*، *parfois* و *jamais* تازه‌اند. *Jamais* قبل از فعل به *ne* نیاز دارد.
    example_gloss:
    - من شنبه‌ها همیشه ورزش می‌کنم.
    - من اغلب کتاب می‌خونم.
    - من گاهی نقاشی می‌کشم.
    - من هرگز بازی ویدیویی نمی‌کنم.
  fr.a1.unit52.lesson03.teach.chaque_semaine_chaque:
    title: هر هفته، هر آخر هفته
    gloss: هر هفته، هر آخر هفته
    note: '*Chaque semaine* و *chaque week-end* هر دو یعنی «هر». *Chaque* هیچ‌وقت تغییر نمی‌کند، جنس اسم هرچه باشد.'
    example_gloss:
    - من هر هفته برای دوستام آشپزی می‌کنم.
    - هر آخر هفته ورزش می‌کنم.
  fr.a1.unit52.lesson03.teach.chaque_ne_change:
    title: Chaque تغییر نمی‌کند
    gloss: '*Chaque* قبل از اسم مذکر و مؤنث یکسان می‌ماند: *chaque semaine*، *chaque week-end*.'
    note: '*Semaine* مؤنث و *week-end* مذکر است، با این حال *chaque* برای هر دو یکی است. با *tous les* / *toutes les* مقایسه کنید که تغییر می‌کنند.'
  fr.a1.unit52.lesson03.teach.qu_est_ce:
    title: پرسیدن دربارهٔ اوقات فراغت
    gloss: توی اوقات فراغتت چه کار می‌کنی؟
    note: این سؤال اصلی این درس است؛ با آن می‌توانید از هر کسی دربارهٔ سرگرمی‌هاش بپرسید.
  fr.a1.unit52.lesson04.teach.camille_on_se:
    title: Camille بحث سرگرمی‌ها را پیش می‌کشد
    gloss: 'Camille: ما اغلب با هم قدم می‌زنیم. ولی توی اوقات فراغتت دیگه چه کار می‌کنی، Mathieu؟'
    note: '*On se promène souvent* برای «ما» از *on* استفاده می‌کند و *souvent* درست بعد از فعل می‌آید.'
  fr.a1.unit52.lesson04.teach.mathieu_j_aime:
    title: سرگرمی‌های Mathieu
    gloss: 'Mathieu: آشپزی رو دوست دارم، توی خونه هم. و اغلب ورزش می‌کنم.'
    note: '*Même à la maison* (حتی در خانه) روشن می‌کند که Mathieu از سر علاقه آشپزی می‌کند، نه فقط برای کارش.'
  fr.a1.unit52.lesson04.teach.camille_tu_cuisines:
    title: Camille تعجب می‌کند
    gloss: 'Camille: توی خونه هم آشپزی می‌کنی؟ تو که کل روز سر کار آشپزی می‌کنی!'
    note: '*Toute la journée* (تمام روز) تأکید می‌کند که Mathieu سر کار هم خیلی آشپزی می‌کند.'
  fr.a1.unit52.lesson04.teach.mathieu_oui_mais:
    title: Mathieu توضیح می‌دهد
    gloss: 'Mathieu: آره، ولی من آشپزی رو آرامش‌بخش می‌دونم. تو چی، دوست داری چه کار کنی؟'
    note: '*Cuisiner, je trouve ça relaxant* واژه‌ی *cuisiner* را برای تأکید اول می‌آورد: تحت‌اللفظی «آشپزی، من آن را آرامش‌بخش می‌دانم».'
  fr.a1.unit52.lesson04.teach.camille_j_aime:
    title: سرگرمی‌های Camille
    gloss: 'کامیل: من کتاب خواندن را دوست دارم و اغلب به موسیقی گوش می‌دم.'
    note: دو سرگرمی از درس ۱ و ۲ را با *et* (و) در یک جمله کنار هم می‌آورد.
  fr.a1.unit52.lesson04.teach.mathieu_tu_joues:
    title: ماتیو درباره‌ی بازی‌های ویدیویی می‌پرسد
    gloss: 'ماتیو: تو هم بازی ویدیویی می‌کنی؟'
    note: 'یک سؤال کوتاه بله/خیر: *Tu joues aussi aux jeux vidéo ?* لحن بالارونده جمله را پرسشی می‌کند.'
  fr.a1.unit52.lesson04.teach.camille_non_je:
    title: کامیل جواب می‌دهد
    gloss: 'کامیل: نه، من هیچ‌وقت بازی ویدیویی نمی‌کنم. ولی گاهی نقاشی می‌کشم!'
    note: '*Jamais* (هیچ‌وقت) و *parfois* (گاهی) از درس ۳ در یک جواب کنار هم آمده‌اند تا تفاوتشان دیده شود.'
  fr.a1.unit52.lesson05.teach.mathieu_et_moi:
    title: مقایسهٔ سرگرمی‌ها
    gloss: من و ماتیو اغلب با هم پیاده‌روی می‌کنیم. ولی سرگرمی‌های دیگری هم داریم. ماتیو آشپزی را دوست دارد، حتی در خانه، و اغلب ورزش می‌کند. من کتاب خواندن را دوست دارم و اغلب به موسیقی گوش می‌دهم. گاهی نقاشی می‌کشم، ولی هیچ‌وقت بازی ویدیویی نمی‌کنم. تو در اوقات فراغتت دوست داری چه کار کنی؟
    note: پیام کامیل مطالب درس ۴ را مرور می‌کند و با سؤال اصلی این بخش، یعنی پرسیدن از خواننده، تمام می‌شود.
    glosses:
      promène: قدم می‌زنیم
      souvent: اغلب
      ensemble: با هم
      d'autres: دیگر
      cuisiner: آشپزی می‌کند
      aime: دوست دارد
      maison: توی خانه
      sport: ورزش می‌کند
      lire: بخوانم
      j'écoute: گوش می‌دهم
      musique: موسیقی
      dessine: نقاشی می‌کشم
      parfois: گاهی
      jeux: بازی ویدیویی می‌کنم
      jamais: هیچ‌وقت
      libre: آزاد
      temps: وقت
  fr.a1.unit52.lesson06.teach.mathieu_qu_est:
    title: ماتیو درباره‌ی آخر هفته می‌پرسد
    gloss: 'ماتیو: این آخر هفته چه کار می‌کنی؟'
    note: '*Ce week-end* (این آخر هفته) با *ce* می‌آید، چون *week-end* در فرانسوی مذکر است.'
  fr.a1.unit52.lesson06.teach.camille_je_ne:
    title: کامیل مردد است
    gloss: 'کامیل: هنوز نمی‌دونم. کتاب خواندن را دوست دارم، ولی می‌خوام بیرون هم برم.'
    note: '*Sortir* (بیرون رفتن) راه رایجی است برای گفتن اینکه می‌خواهید از خانه بیرون بروید.'
  fr.a1.unit52.lesson06.teach.mathieu_on_se:
    title: ماتیو یک برنامه پیشنهاد می‌کند
    gloss: 'ماتیو: با هم قدم بزنیم؟ بعدش برای هردومون آشپزی می‌کنم.'
    note: '*Après* (بعد از آن) دو برنامه را پشت سر هم می‌آورد، مثل *d''abord* و *ensuite*.'
  fr.a1.unit52.lesson06.teach.camille_bonne_idee:
    title: کامیل موافقت می‌کند
    gloss: 'کامیل: فکر خوبیه! من قدم زدن و آشپزی را به یک اندازه دوست دارم.'
    note: '*Autant ... que* (به اندازه‌ی ... که) نشان می‌دهد کامیل دو کار را به یک اندازه دوست دارد، نه یکی را بیشتر از دیگری.'
  fr.a1.unit52.lesson06.teach.mathieu_parfait_alors:
    title: ماتیو قرار را قطعی می‌کند
    gloss: 'ماتیو: عالیه. پس شنبه می‌بینمت!'
    note: یک جمله‌ی دوستانه‌ی پایانی که برنامه‌ی *samedi* (شنبه) را تأیید می‌کند.
