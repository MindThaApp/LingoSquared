teaching:
  fr.a1.unit53.lesson01.teach.grand_petit:
    title: قدبلند و قدکوتاه
    gloss: قدبلند / قدکوتاه
    note: '*Grand* برای آدم قدبلند و *petit* برای آدم قدکوتاه به کار می‌رود. این صفت‌ها با شخص مطابقت پیدا می‌کنند: *grand/grande*، *petit/petite*.'
    example_gloss:
    - لیا قدبلند است.
    - توماس کوتاه‌قد است.
  fr.a1.unit53.lesson01.teach.vieux_jeune:
    title: مسن و جوان
    gloss: مسن / جوان
    note: '*Vieux* و *jeune* اینجا برداشت کلی از سن را می‌رسانند، نه تعداد دقیق سال‌ها را.'
    example_gloss:
    - پدربزرگ مسنه.
    - ماتیو جوان است.
  fr.a1.unit53.lesson01.teach.pour_un_age:
    title: 'سن: یک عدد یا یک برداشت کلی'
    gloss: برای سن دقیق در فرانسه از فعل *avoir* استفاده می‌شود (*Il a vingt ans*)، ولی *être vieux* برداشت کلی می‌دهد (*Mon grand-père est vieux*). در فارسی هم برای سن دقیق می‌گوییم «بیست سال دارد» و برای برداشت کلی «پیر است».
    note: '*Quel âge as-tu ?* را برای پرسیدن سن دقیق از قبل بلدید. اینجا *vieux* یعنی کسی چقدر پیر به نظر می‌رسد، بدون هیچ عددی.'
  fr.a1.unit53.lesson01.teach.lea_est_grande:
    title: لیا قدبلند است و توما قدکوتاه
    gloss: لیا قدبلند است و توما قدکوتاه.
    note: یک جملهٔ ساده با *et* (و) که زمینه را برای مقایسهٔ مستقیم در درس ۵ آماده می‌کند.
  fr.a1.unit53.lesson02.teach.les_cheveux:
    title: مو
    gloss: مو
    note: '*Les cheveux* همیشه جمع و مذکر است، در حالی که در فارسی «مو» را مفرد به کار می‌بریم.'
    example_gloss: ماتیو موهای کوتاه و مشکی دارد.
  fr.a1.unit53.lesson02.teach.blonds_bruns_gris:
    title: بلوند، قهوه‌ای و خاکستری
    gloss: بلوند / قهوه‌ای / خاکستری
    note: 'سه رنگ مو. با *cheveux* رنگ، *s* جمع می‌گیرد: *blonds*، *bruns*. *Gris* از قبل به *s* ختم می‌شود و *noirs* (مشکی) از درس لباس‌ها تکرار شده است.'
    example_gloss:
    - کامی موهای بور دارد.
    - توما موهای قهوه‌ای دارد.
    - پدربزرگ موهای خاکستری داره.
  fr.a1.unit53.lesson02.teach.longs_courts:
    title: بلند و کوتاه (مو)
    gloss: بلند / کوتاه (مو)
    note: '*Longs* (بلند) همان ایدهٔ قد در درس ۱ است، این بار برای طول مو. *Courts* (کوتاه) اینجا تازه است و هر دو با *cheveux* *s* جمع می‌گیرند.'
    example_gloss:
    - لیا موهای بلند دارد.
    - توما موهای کوتاه دارد.
  fr.a1.unit53.lesson02.teach.cheveux_est_toujours:
    title: Cheveux صفت جمع می‌گیرد
    gloss: '*Cheveux* همیشه جمع است، پس صفت *s* می‌گیرد: *longs*، *courts*، *blonds*، *bruns*، *noirs*. *Gris* از قبل به *s* ختم می‌شود.'
    note: 'رنگ‌ها و طول‌ها با *cheveux* به شکل جمع می‌آیند: *les cheveux longs*. با *yeux* در درس ۳ مقایسه کنید، که *marron* تغییر نمی‌کند.'
  fr.a1.unit53.lesson02.teach.ses_est_le:
    title: 'Ses: مال او'
    gloss: '*Ses* قبل از اسم جمع یعنی «مال او»: *ses cheveux*، *ses yeux*. این کلمه با چیزِ مالکیت‌شده مطابقت می‌کند، نه با صاحبش.'
    note: 'در فرانسه برای «مال او» با زن یا مرد دو کلمهٔ جدا وجود ندارد، مثل ضمیر «او» در فارسی: *ses yeux* هم «چشم‌های او (زن)» و هم «چشم‌های او (مرد)» می‌تواند باشد و از متن می‌فهمید کدام است.'
  fr.a1.unit53.lesson02.teach.mathieu_a_les:
    title: ماتیو موهای کوتاه و مشکی دارد
    gloss: ماتیو موهای کوتاه و مشکی دارد.
    note: '*noirs* (مشکی) از درس لباس‌ها تکرار شده است.'
  fr.a1.unit53.lesson02.teach.camille_a_les:
    title: کامی موهای بلند و بور دارد
    gloss: کامیل موهای بلند و بلوند دارد.
    note: واژه‌های طول و رنگ این درس در یک جمله‌ی طبیعی کنار هم آمده‌اند.
  fr.a1.unit53.lesson03.teach.les_yeux:
    title: چشم‌ها
    gloss: چشم‌ها
    note: '*Les yeux* جمع *l''œil* (چشم) است؛ *yeux* به *x* ختم می‌شود، نه *s*.'
    example_gloss: ماتیو چشم‌های قهوه‌ای دارد.
  fr.a1.unit53.lesson03.teach.bleus_marron_verts:
    title: آبی، قهوه‌ای و سبز
    gloss: آبی / قهوه‌ای / سبز
    note: '*Bleus* (آبی) قبلاً برای لباس‌ها آمده بود؛ *marron* (قهوه‌ای) هیچ‌وقت تغییر نمی‌کند؛ *verts* (سبز) تازه است.'
    example_gloss:
    - کامیل چشم‌های آبی دارد.
    - توماس چشم‌های قهوه‌ای دارد.
    - لیا چشم‌های سبز دارد.
  fr.a1.unit53.lesson03.teach.avec_yeux_pluriel:
    title: Yeux ‌s می‌گیرد، marron ثابت می‌ماند
    gloss: 'با *yeux* (جمع) صفت *s* می‌گیرد: *yeux bleus*، *yeux verts*. *Marron* هیچ‌وقت تغییر نمی‌کند: *yeux marron*.'
    note: 'با *cheveux* در درس ۲ مقایسه کنید: اسم جمع، صفت جمع می‌آورد، به‌جز رنگ‌هایی مثل *marron* که از یک اسم گرفته شده‌اند.'
  fr.a1.unit53.lesson03.teach.comment_est_camille:
    title: کامیل چه ظاهری دارد؟
    gloss: کامیل چه ظاهری دارد؟
    note: '*Comment est ... ?* سؤال اصلی این واحد است؛ با آن دربارهٔ ظاهر هر کسی می‌توانید بپرسید.'
  fr.a1.unit53.lesson03.teach.camille_a_les:
    title: کامی موهای بلند و بور و چشم‌های آبی دارد
    gloss: کامی موهای بلند و بور و چشم‌های آبی دارد.
    note: یک پاسخ نمونه که مو و چشم را با *et* در یک جمله می‌آورد.
  fr.a1.unit53.lesson04.teach.camille_une_nouvelle:
    title: کامی نینا را معرفی می‌کند
    gloss: 'کامی: یک دختر تازه به کافهٔ زبان‌ها می‌آید. اسمش نیناست.'
    note: '*Une nouvelle fille vient* یعنی معرفی کسی که تازه وارد شده؛ *vient* از فعل *venir* (آمدن) است.'
  fr.a1.unit53.lesson04.teach.mathieu_d_accord:
    title: ماتیو می‌پرسد او چه شکلی است
    gloss: 'ماتیو: باشه! چه شکلی است؟'
    note: 'همان سؤال اصلی با *elle* (او) به‌جای اسم: *Comment est-elle ?* خط تیره فعل و ضمیر را به هم وصل می‌کند.'
  fr.a1.unit53.lesson04.teach.camille_elle_est:
    title: کامی قد و موی نینا را توصیف می‌کند
    gloss: 'کامی: قدکوتاه است و موهای کوتاه و بور دارد.'
    note: '*petite* از درس ۱ را با واژگان مو از درس ۲ ترکیب می‌کند؛ برای دختر، *petit* یک *e* می‌گیرد.'
  fr.a1.unit53.lesson04.teach.mathieu_et_ses:
    title: ماتیو دربارهٔ چشم‌هایش می‌پرسد
    gloss: 'ماتیو: چشم‌هایش چه‌طور؟'
    note: '*Ses yeux* اینجا یعنی «چشم‌های او (زن)»: *ses* با *yeux* مطابقت دارد، نه با دختر.'
  fr.a1.unit53.lesson04.teach.camille_elle_a:
    title: کامی چشم‌های نینا را توصیف می‌کند
    gloss: 'کامی: چشم‌های سبز دارد.'
    note: '*yeux verts* از درس ۳ تکرار شده است.'
  fr.a1.unit53.lesson04.teach.mathieu_merci_alors:
    title: ماتیو او را خواهد شناخت
    gloss: 'ماتیو: مرسی! پس می‌شناسمش.'
    note: '*Je vais la reconnaître* از *aller* + مصدر برای آیندهٔ نزدیک استفاده می‌کند و *la* یعنی «او را (زن)».'
  fr.a1.unit53.lesson05.teach.thomas_et_lea:
    title: مقایسهٔ توما و لیا
    gloss: توما و لیا برادر و خواهرند، ولی شبیه هم نیستند. توما قدکوتاه است و موهای کوتاه و قهوه‌ای و چشم‌های قهوه‌ای دارد. لیا از توما قدبلندتر است و موهای بلند و قهوه‌ای و چشم‌های سبز دارد. شما چه شکلی هستید؟
    note: یک مقایسه‌ی کوتاه که همه‌ی واژه‌های رنگ و طولِ تا اینجا را دوباره به کار می‌برد و با سؤال اصلی این بخش خطاب به خواننده تمام می‌شود.
    glosses:
      frère: برادر
      sœur: خواهر
      ressemblent: به نظر رسیدن
      différents: متفاوت
      petit: کوتاه‌قد
      courts: کوتاه‌قد
      bruns: قهوه‌ای
      cheveux: مو
      marron: قهوه‌ای
      yeux: چشم‌ها
      grande: قدبلندتر
      longs: بلند
      verts: سبز
      se: (بخشی از «se ressemblent» = شبیه هم هستند)
  fr.a1.unit53.lesson05.teach.tu_connais_deja:
    title: Plus ... que برای آدم‌ها
    gloss: 'الگوی *plus* + صفت + *que* را از قبل می‌دانید. اینجا آن را برای آدم‌ها به کار می‌برید: لیا از توما قدبلندتر است.'
    note: همان الگوی *plus ... que* از واحد خرید، این بار برای آدم‌ها به‌جای اشیا. *Grande* با *Léa* که زن است مطابقت دارد.
  fr.a1.unit53.lesson05.teach.lea_a_les:
    title: موهای لیا از توما بلندتر است
    gloss: موهای لیا از توما بلندتر است.
    note: '*Plus longs que* با *cheveux* (جمع) مطابقت دارد: *les cheveux plus longs que Thomas*.'
  fr.a1.unit53.lesson05.teach.j_ai_les:
    title: موی من کوتاه و قهوه‌ای است
    gloss: موی من کوتاه و قهوه‌ای است.
    note: یک جملهٔ نمونه با اول‌شخص و *J'ai ...* که برای توصیف ظاهر خودتان آماده است.
  fr.a1.unit53.lesson06.teach.mathieu_regarde_c:
    title: ماتیو نینا را می‌بیند
    gloss: 'ماتیو: نگاه کن، این نیناست؟ موهای کوتاه و بور و چشم‌های سبز دارد.'
    note: '*Regarde* (نگاه کن) امر *tu* از *regarder* است و قبلاً در یک گفت‌وگوی دیگر هم همین‌طور آمده بود.'
  fr.a1.unit53.lesson06.teach.camille_oui_c:
    title: کامی تأیید می‌کند
    gloss: 'کامی: آره، نیناست!'
    note: یک تأیید کوتاه و طبیعی.
  fr.a1.unit53.lesson06.teach.nina_salut_tu:
    title: نینا به ماتیو سلام می‌کند
    gloss: 'نینا: سلام، تو ماتیو هستی؟'
    note: 'یک سؤال سادهٔ سلام و احوال‌پرسی صمیمی: *Tu es ... ?*'
  fr.a1.unit53.lesson06.teach.mathieu_oui_ravi:
    title: ماتیو جواب سلام نینا را می‌دهد
    gloss: 'ماتیو: آره! از دیدنت خوشحالم، نینا.'
    note: '*Ravi de te rencontrer* عبارت معمول برای اولین آشنایی است (*ravi* برای مرد، *ravie* برای زن)، نه *content de te revoir* که برای کسی است که از قبل می‌شناسید.'
  fr.a1.unit53.lesson06.teach.nina_ravie_de:
    title: نینا هم همین را می‌گوید
    gloss: 'نینا: منم از آشنایی باهات خوشحالم!'
    note: گفت‌وگو را تمام می‌کند؛ ماتیو نینا را از روی توصیف کامی شناخت.
