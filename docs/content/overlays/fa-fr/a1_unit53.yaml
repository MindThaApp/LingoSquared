  fr.a1.unit53.lesson02.exercise02.listen_mathieu_a_les:
    instruction: گوش بدهید و چیزی را که گوینده می‌گوید انتخاب کنید.
    correct_option: ماتیو موهای کوتاه و مشکی دارد.
    distractors:
    - ماتیو موهای بلند و مشکی دارد.
    - ماتیو موهای کوتاه و قهوه‌ای دارد.
