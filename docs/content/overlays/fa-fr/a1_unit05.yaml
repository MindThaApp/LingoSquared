teaching:
  fr.a1.unit05.lesson01.teach.poulet:
    title: مرغ
    gloss: مرغ
    note: '*Poulet* مذکر است.'
    example_gloss: کمی مرغ می‌خواستم.
  fr.a1.unit05.lesson01.teach.poisson:
    title: ماهی
    gloss: ماهی
    note: '*Poisson* مذکر است.'
    example_gloss: ماهی امروز تازه است.
  fr.a1.unit05.lesson01.teach.salade:
    title: سالاد
    gloss: سالاد
    note: '*Salade* مؤنث است.'
    example_gloss: او دارد سالاد می‌خورد.
  fr.a1.unit05.lesson01.teach.riz:
    title: برنج
    gloss: برنج
    note: '*Riz* مذکر است و تغییر نمی‌کند؛ مفرد و جمعش یک شکل نوشته می‌شود، مثل *prix*.'
    example_gloss: برنج با مرغ خیلی خوب می‌آید.
  fr.a1.unit05.lesson01.teach.eau:
    title: آب
    gloss: آب
    note: '*Eau* مؤنث است؛ چون با صدای واکه شروع می‌شود، *l''* می‌شود، مثل *l''addition* که بعداً در همین درس می‌آید.'
    example_gloss: کمی آب می‌خواستم، لطفاً.
  fr.a1.unit05.lesson01.teach.vin:
    title: شراب
    gloss: شراب
    note: '*Vin* مذکر است.'
    example_gloss: شراب قرمز خوشمزه است.
  fr.a1.unit05.lesson01.teach.je_voudrais_poulet_salade:
    title: سفارش مرغ و سالاد
    gloss: مرغ و سالاد می‌خواستم.
    note: '*Du poulet* (مذکر) و *de la salade* (مؤنث) حرف تعریف‌های بخشی (به معنی «مقداری») هستند و با جنس اسم مطابقت می‌کنند؛ اما بعد از مقدار (*un kilo de*) فقط *de* ساده می‌آید.'
  fr.a1.unit05.lesson02.teach.dessert:
    title: Dessert
    gloss: دسر
    note: '*Dessert* مذکر است.'
    example_gloss: دسر امروز رایگان است.
  fr.a1.unit05.lesson02.teach.addition:
    title: صورت‌حساب
    gloss: صورت‌حساب
    note: '*Addition* مؤنث است و چون با صدای واکه شروع می‌شود، *l''* می‌شود. این واژه‌ی معمول رستوران‌های فرانسه است، نه *facture* که فاکتور رسمی است.'
    example_gloss: صورت‌حساب، لطفاً.
  fr.a1.unit05.lesson02.teach.vous_avez_choisi:
    title: پرسیدن آماده بودن سفارش
    gloss: انتخاب کردید؟
    note: سؤال معمول گارسون وقتی برای گرفتن سفارش به میز می‌آید. از گذشته‌ی نقلی فعل *choisir* (انتخاب کردن) استفاده شده است.
  fr.a1.unit05.lesson02.teach.je_voudrais_un_cafe:
    title: سفارش قهوه
    gloss: یک قهوه می‌خواستم، لطفاً.
    note: '*Je voudrais* + چیزی که می‌خواهید؛ همان الگویی که موقع خرید دیدید، این بار برای غذا و نوشیدنی.'
  fr.a1.unit05.lesson02.teach.qcq_comme_dessert:
    title: پرسیدن اینکه چه چیزهایی هست
    gloss: برای دسر چی دارید؟
    note: '*Qu''est-ce que vous avez comme...?* راه طبیعی و رایجی برای پرسیدن گزینه‌های یک دسته است.'
  fr.a1.unit05.lesson02.teach.cest_delicieux:
    title: گفتن اینکه چیزی خوشمزه است
    gloss: خیلی خوشمزه است!
    note: واکنشی رایج و پرشور به غذا؛ *délicieux* اینجا تغییر نمی‌کند، چون *c'est* با اسمی که جنس داشته باشد نمی‌آید.
  fr.a1.unit05.lesson03.teach.line01:
    title: سلام و پرسیدن آماده بودن سفارش
    gloss: گارسون سلام می‌کند و می‌پرسد سفارش‌شان را انتخاب کرده‌اند یا نه.
    note: با *Bonjour* شروع می‌شود که لحن مؤدبانه‌ی مناسب خدمات و مشتری است.
  fr.a1.unit05.lesson03.teach.line02:
    title: سفارش سالاد و آب
    gloss: اینس سالاد و آب سفارش می‌دهد.
    note: '*je voudrais* را با *et* ترکیب می‌کند تا دو چیز را در یک جمله سفارش بدهد.'
  fr.a1.unit05.lesson03.teach.line03:
    title: سفارش مرغ با برنج
    gloss: ماتیو مرغ با برنج سفارش می‌دهد.
    note: '*Avec* (با) غذای اصلی را به غذای کناری وصل می‌کند؛ ساختاری ساده و رایج برای سفارش.'
  fr.a1.unit05.lesson03.teach.line04:
    title: تأیید سفارش و پرسیدن درباره‌ی نوشیدنی
    gloss: گارسون سفارش را تأیید می‌کند و درباره‌ی نوشیدنی می‌پرسد.
    note: '*Et comme boisson pour vous ?* همان الگوی *comme* در *Qu''est-ce que vous avez comme dessert ?* است، این بار برای نوشیدنی.'
  fr.a1.unit05.lesson03.teach.line05:
    title: سفارش یک لیوان شراب
    gloss: ماتیو یک لیوان شراب قرمز سفارش می‌دهد.
    note: '*Un verre de* (یک لیوان) راه معمول سفارش شراب لیوانی است.'
  fr.a1.unit05.lesson03.teach.line06:
    title: واکنش به غذا
    gloss: اینس می‌گوید سالاد خوشمزه است.
    note: دوباره *C'est délicieux !* به کار رفته، این بار برای یک غذای مشخص (*cette salade*). *Délicieux* بعد از *c'est* مذکر می‌ماند، هرچند *salade* مؤنث است؛ شکل مطابق با آن *Elle est délicieuse, cette salade !* است.
  fr.a1.unit05.lesson03.teach.line07:
    title: توضیح گرسنگی و درخواست صورت‌حساب
    gloss: ماتیو می‌گوید کارگاه آن‌ها را گرسنه کرده و صورت‌حساب می‌خواهد.
    note: '*Nous a donné faim* (تحت‌اللفظی «به ما گرسنگی داد») راه طبیعی فرانسوی برای گفتن «چیزی ما را گرسنه کرد» است.'
  fr.a1.unit05.lesson03.teach.line08:
    title: تأیید آوردن صورت‌حساب
    gloss: گارسون تأیید می‌کند که همین الان آن را می‌آورد.
    note: '*Tout de suite* (همین الان) عبارتی رایج و اطمینان‌بخش در رستوران و کافه است.'
