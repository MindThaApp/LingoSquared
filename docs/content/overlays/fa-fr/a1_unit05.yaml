course:
  title: فرانسه A1
  description: واژگان رایج خوراکی و نوشیدنی و یک گفت‌وگو برای سفارش در کافه. داستان کارگاه آشپزی اینس و ماتیو ادامه پیدا می‌کند و آن‌ها بعد از کلاس با هم غذا می‌خورند. این درس روی حرف تعریف‌های بخشی du، de la و de l' تأکید دارد که با اسم‌های غذایی ناشمارا به کار می‌روند؛ در فارسی چنین حرف تعریفی وجود ندارد و بعد از «مقداری» یا بدون هیچ نشانه‌ای می‌آید.
