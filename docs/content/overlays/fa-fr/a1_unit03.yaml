course:
  title: فرانسه A1
  description: واژگان خانوادهٔ نزدیک و گسترده، نظام صفت‌های ملکی mon/ma/mes و توصیف یک خانواده، در ادامهٔ داستان کارگاه آشپزی Inès و Mathieu از واحدهای ۱ و ۲. در فارسی صفت ملکی جنس ندارد، ولی در فرانسه صفت ملکی با جنس اسم مطابقت می‌کند، نه با جنس صاحب آن.
units:
  fr.a1.unit03.family:
    title: خانوادهٔ Inès و Mathieu
lessons:
  fr.a1.unit03.lesson01.immediate_family:
    title: خانوادهٔ نزدیک
  fr.a1.unit03.lesson02.possessives_mon_ma_mes:
    title: 'صفت‌های ملکی: mon, ma, mes'
  fr.a1.unit03.lesson03.extended_family:
    title: فامیل و اقوام
  fr.a1.unit03.lesson04.describing_family_size:
    title: چند نفر در خانه‌اند
  fr.a1.unit03.lesson05.reading_a_family_profile:
    title: خواندن معرفی یک خانواده
  fr.a1.unit03.lesson06.family_photos_dialogue:
    title: عکس‌های خانوادگی با Inès و Mathieu
teaching:
  fr.a1.unit03.lesson01.teach.mere:
    title: مادر
    gloss: مادر
    note: '*Mère* مؤنث است. *Maman* در میان اعضای خانواده رایج‌تر است، ولی *mère* خنثی است و در فهرست واژگان این دوره می‌آید.'
  fr.a1.unit03.lesson01.teach.pere:
    title: پدر
    gloss: پدر
    note: '*Père* مذکر است. *Papa* معادل رایج روزمرهٔ آن است، مثل *mère* و *maman*.'
  fr.a1.unit03.lesson01.teach.frere:
    title: برادر
    gloss: برادر
    note: '*Frère* مذکر مفرد است.'
  fr.a1.unit03.lesson01.teach.soeur:
    title: خواهر
    gloss: خواهر
    note: '*Sœur* مؤنث مفرد است. œ در املای فرانسه یک حرف واحد است، نه دو حرف جدا.'
  fr.a1.unit03.lesson01.teach.fils:
    title: پسر
    gloss: پسر
    note: '*Fils* مذکر است؛ توجه کنید که s پایانی اینجا (به‌عنوان استثنا) تلفظ می‌شود، ولی l خوانده نمی‌شود.'
  fr.a1.unit03.lesson01.teach.fille:
    title: دختر
    gloss: دختر
    note: '*Fille* مؤنث مفرد است؛ همین کلمه در موقعیت‌های دیگر به معنی «دختر» (در برابر پسر بچه) هم هست.'
  fr.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: پدر و مادر
    note: '*Parents* مذکر جمع است و پدر و مادر را با هم شامل می‌شود.'
  fr.a1.unit03.lesson01.teach.freres_et_soeurs:
    title: خواهر و برادرها
    gloss: برادرها و خواهرها؛ خواهر و برادرها
    note: فرانسوی کلمهٔ تکی و بی‌جنسی برای «خواهر و برادرها» ندارد؛ *frères et sœurs* هر دو را صریح می‌گوید.
  fr.a1.unit03.lesson02.teach.ma_mere:
    title: مادرم
    gloss: مادرم
    note: '*Ma* ضمیر ملکی مؤنث مفرد به معنی «من/م» است و چون *mère* مؤنث است، از ma استفاده می‌شود.'
  fr.a1.unit03.lesson02.teach.mon_pere:
    title: پدر من
    gloss: پدرم
    note: '*Mon* ضمیر ملکی مذکر مفرد به معنی «من/م» است و چون *père* مذکر است، از mon استفاده می‌شود.'
  fr.a1.unit03.lesson02.teach.mes_freres_et_soeurs:
    title: خواهر و برادرهای من
    gloss: خواهر و برادرهای من
    note: '*Mes* ضمیر ملکی جمع است و برای هر اسم جمعی، چه مذکر و چه مؤنث، به کار می‌رود. الگوی آن مثل *ma*/*mon* است، فقط بر اساس جمع بودن است، نه جنسیت.'
  fr.a1.unit03.lesson02.teach.as_tu_des_freres_et_soeurs:
    title: پرسیدن دربارهٔ خواهر و برادر
    gloss: خواهر یا برادر داری؟
    note: '*As-tu* شکل پرسشیِ وارونه‌ی *tu as* (داری) است و در سطح A1 الگوی رایجی برای سؤال کردن است.'
  fr.a1.unit03.lesson02.teach.jai_deux_soeurs:
    title: گفتن تعداد خواهر و برادر
    gloss: من دو تا خواهر دارم.
    note: '*J''ai* (دارم) همراه با یک عدد و اسم خانوادگی، شکل استاندارد گفتن تعداد خواهر و برادرهاست.'
  fr.a1.unit03.lesson02.teach.ta_famille_est_grande:
    title: پرسیدن اینکه خانواده بزرگ است یا نه
    gloss: خانواده‌ات بزرگه؟
    note: '*Ta* ضمیر ملکی غیررسمی مؤنث مفرد به معنی «تو/ت» است و با اسم مؤنث *famille* مطابقت دارد.'
  fr.a1.unit03.lesson02.teach.ma_famille_est_petite:
    title: توصیف یک خانوادهٔ کوچک
    gloss: خانوادهٔ من کوچیکه.
    note: '*Petite* با اسم مؤنث *famille* مطابقت می‌کند؛ با اسم مذکر از شکل مذکر *petit* استفاده می‌شود. این نوع مطابقت با *mon*/*ma*/*mes* فرق دارد، چون آن‌ها مالکیت را نشان می‌دهند و petite ویژگی را توصیف می‌کند.'
  fr.a1.unit03.lesson03.teach.grand_pere:
    title: پدربزرگ
    gloss: پدربزرگ
    note: '*Grand-père* واژه‌ی مرکب با خط پیوند و مذکر است.'
  fr.a1.unit03.lesson03.teach.grand_mere:
    title: مادربزرگ
    gloss: مادربزرگ
    note: '*Grand-mère* واژه‌ی مرکب با خط پیوند و مؤنث است. توجه کنید که *grand-* ثابت می‌ماند و به شکل *grande-mère* نمی‌آید.'
  fr.a1.unit03.lesson03.teach.grands_parents:
    title: پدربزرگ و مادربزرگ
    gloss: پدربزرگ و مادربزرگ
    note: در *grands-parents* هر دو بخش واژه‌ی مرکب جمع بسته می‌شوند (*grands*، نه *grand-*). این برخلاف *grand-mère*/*grand-père* است که در مفرد، بخش *grand-* تغییر نمی‌کند.
  fr.a1.unit03.lesson03.teach.oncle:
    title: دایی / عمو
    gloss: عمو / دایی
    note: '*Oncle* مذکر است.'
  fr.a1.unit03.lesson03.teach.tante:
    title: خاله / عمه
    gloss: عمه / خاله
    note: '*Tante* مؤنث است.'
  fr.a1.unit03.lesson03.teach.cousin:
    title: پسرعمو / پسردایی / پسرخاله (پسر)
    gloss: پسرعمو / پسردایی / پسرخاله
    note: '*Cousin* مذکر مفرد است. در فرانسه جنسیت پسرعمو/دخترعمو (و پسرخاله/دخترخاله...) با شکل واژه مشخص می‌شود، مثل فارسی که دو واژه‌ی جدا دارد.'
  fr.a1.unit03.lesson03.teach.cousine:
    title: دخترعمو / دختردایی / دخترخاله (دختر)
    gloss: دخترعمو / دخترداییِ / دخترخاله
    note: '*Cousine* مؤنث مفرد است و با افزودن -e به *cousin* ساخته می‌شود.'
  fr.a1.unit03.lesson03.teach.mes_grands_parents:
    title: پدربزرگ و مادربزرگ‌های من
    gloss: پدربزرگ و مادربزرگ‌های من
    note: چون *grands-parents* جمع است، از *mes* استفاده می‌شود؛ حتی اگر شامل هم مذکر و هم مؤنث باشد.
  fr.a1.unit03.lesson04.teach.combien_de_freres_et_soeurs:
    title: پرسیدن تعداد خواهر و برادر
    gloss: چند تا خواهر و برادر داری؟
    note: '*Combien de* (چند، چه تعداد) در فرانسوی مستقیماً پیش از اسم می‌آید و فعل کمکی جداگانه‌ای لازم ندارد.'
  fr.a1.unit03.lesson04.teach.on_est_cinq:
    title: گفتن تعداد افراد خانه
    gloss: ما در خانه شش نفر هستیم.
    note: '*On est* (در اصل «یکی هست» ولی در محاوره یعنی «ما هستیم») روش طبیعی و رایج گفتن تعداد افراد خانه در فرانسوی محاوره‌ای است؛ *nous sommes* رسمی‌تر و نوشتاری‌تر است.'
  fr.a1.unit03.lesson04.teach.ma_famille_est_grande:
    title: توصیف یک خانوادهٔ بزرگ
    gloss: خانوادهٔ من بزرگ است.
    note: '*Grande* با اسم مؤنث *famille* مطابقت می‌کند؛ با اسم مذکر از شکل مذکر *grand* استفاده می‌شود.'
  fr.a1.unit03.lesson04.teach.jai_beaucoup_de_cousins:
    title: گفتن اینکه پسرعمو و دخترعموی زیادی دارید
    gloss: من پسرعمو و دخترعموی زیادی دارم.
    note: '*Beaucoup de* (خیلی، تعداد زیادی) پیش از اسم می‌آید؛ *de* در اینجا به *du*/*des* تبدیل نمی‌شود، چون *beaucoup* خودش مقدار را مشخص می‌کند.'
  fr.a1.unit03.lesson04.teach.tu_habites_pres_de_tes_parents:
    title: پرسیدن دربارهٔ زندگی نزدیک پدر و مادر
    gloss: نزدیک پدر و مادرت زندگی می‌کنی؟
    note: '*Tes* ضمیر ملکی غیررسمی جمع به معنی «تو/ت» است و چون *parents* جمع است، به کار می‌رود.'
  fr.a1.unit03.lesson04.teach.jhabite_avec_mes_grands_parents:
    title: گفتن اینکه با چه کسانی زندگی می‌کنید
    gloss: من با پدربزرگ و مادربزرگم زندگی می‌کنم.
    note: '*Avec* (با) برای گفتن کسانی که با آن‌ها زندگی می‌کنید به کار می‌رود؛ *j''habite* شکل *je* از *habiter* است که در درس اول در *j''habite à Montreuil* دیدید.'
  fr.a1.unit03.lesson05.teach.profile_reading:
    title: معرفی خانواده‌ی اینس
    gloss: 'اسم من اینس است. سی و یک سال دارم و با پدربزرگ و مادربزرگم در پاریس زندگی می‌کنم. مادر و پدرم در لیل زندگی می‌کنند. دو خواهر و یک برادر دارم: ما در خانه شش نفریم. خواهر کوچکم اسمش کامیل است و بیست سال دارد.'
    note: این معرفی‌نامه واژگان و ساختارهای درس‌های یک تا چهار را در یک متن کوتاه و پیوسته به کار می‌برد، نه در جمله‌های جدا. مهارت خواندنی که برای تشخیص «چه کسی کیست» لازم است، در آزمون خواندن این واحد هم سنجیده می‌شود.
    glosses:
      trente: سی
      ans: ساله
      grands-parents: پدربزرگ و مادربزرگ
      mère: مادر
      père: پدر
      habitent: زندگی می‌کنند (از habiter)
      deux: دو
      sœurs: خواهرها
      frère: برادر
      six: شش
      maison: خانه
      petite: کوچک‌تر / کوچک
      sœur: خواهر
      vingt: بیست
  fr.a1.unit03.lesson05.teach.petite_soeur:
    title: خواهر کوچک
    gloss: خواهر کوچک‌تر؛ خواهر کوچک
    note: '*Petite* (مؤنث *petit*) در اینجا پیش از اسم می‌آید، مثل بیشتر صفت‌های کوتاه و پرکاربرد فرانسوی. بیشتر صفت‌ها برخلاف فارسی که صفت بعد از اسم نمی‌آید، در فرانسوی پس از اسم می‌آیند؛ و این صفت‌های کوتاه استثنا هستند.'
  fr.a1.unit03.lesson05.teach.habite_third_person:
    title: زندگی می‌کند (سوم شخص)
    gloss: زندگی می‌کند
    note: '*Habite* شکل سوم شخص مفرد *habiter* است و برای گفتن درباره‌ی کس دیگری (*Inès habite...*) به کار می‌رود، نه خود گوینده (*j''habite* که در واحد ۱ و درس چهارم همین واحد دیدید).'
  fr.a1.unit03.lesson05.teach.ses_third_person_plural:
    title: مال او / آن‌ها (با اسم جمع)
    gloss: مال او / آن‌ها
    note: '*Ses* جمعِ *sa*/*son* است. همان‌طور که *sa*/*son* برای اسم مفرد به معنی «اش» به کار می‌رود، *ses grands-parents* یعنی «پدربزرگ و مادربزرگش» وقتی درباره‌ی اینس در سوم شخص حرف می‌زنیم.'
  fr.a1.unit03.lesson05.teach.a_third_person_avoir:
    title: دارد (سوم شخص)
    gloss: دارد
    note: '*A* شکل سوم شخص مفرد *avoir* است و برای گفتن درباره‌ی کس دیگری (*elle a vingt ans*) به کار می‌رود، نه خود گوینده (*j''ai* / *as-tu* که در درس‌های دو تا چهار دیدید).'
  fr.a1.unit03.lesson06.teach.line01:
    title: نشان دادن عکس خانوادگی
    gloss: اینس یک عکس به ماتیو نشان می‌دهد و پدر و مادر و خواهر کوچکش را معرفی می‌کند.
    note: '*Voici* (این… است / این‌ها… هستند) برای نشان دادن چیزی به کار می‌رود و برای نشان دادن عکس عبارت طبیعی‌ای است.'
  fr.a1.unit03.lesson06.teach.line02:
    title: واکنش نشان دادن و پرسیدن دربارهٔ خواهر و برادر
    gloss: ماتیو با خوشحالی واکنش نشان می‌دهد و می‌پرسد خواهر یا برادر دیگری هم دارد یا نه.
    note: '*C''est adorable* واکنش طبیعی و گرمی هنگام دیدن عکس خواهر یا برادر کوچک است.'
  fr.a1.unit03.lesson06.teach.line03:
    title: گفتن تعداد افراد خانه و پرسیدن همان سؤال
    gloss: اینس می‌گوید دو خواهر و یک برادر دارد و در خانه شش نفرند، بعد درباره‌ی خانواده‌ی ماتیو می‌پرسد.
    note: '*On est six à la maison* تعداد کل افراد خانه را می‌گوید و ادامه‌ی الگوی درس چهارم است.'
  fr.a1.unit03.lesson06.teach.line04:
    title: توصیف یک خانوادهٔ کوچک‌تر
    gloss: 'ماتیو می‌گوید خانواده‌اش کوچک‌تر است، فقط سه نفرند: پدر و مادرش و خودش؛ اما پسرعمو و دخترعمو و پسرخاله و دخترخاله‌ی زیادی دارد.'
    note: '*Mais* (اما) تضاد بین خانواده‌ی کوچک و خویشاوندان زیاد را نشان می‌دهد.'
  fr.a1.unit03.lesson06.teach.line05:
    title: پرسیدن دربارهٔ نزدیکی به پدر و مادر
    gloss: اینس می‌پرسد ماتیو نزدیک پدر و مادرش زندگی می‌کند یا نه.
    note: '*Près de* (نزدیکِ) روش رایجی برای گفتن نزدیکی مکانی است.'
  fr.a1.unit03.lesson06.teach.line06:
    title: توضیح فاصله و ارتباط با هم
    gloss: ماتیو می‌گوید نه، آن‌ها در لیون زندگی می‌کنند و هر هفته تلفنی با هم حرف می‌زنند.
    note: 'این ادامه‌ی همان واقعیتی است که در واحد ۱ آمد: ماتیو اهل لیون است. پدر و مادرش همان‌جا مانده‌اند و او در سن‌اوِن زندگی می‌کند.'
  fr.a1.unit03.lesson06.teach.line07:
    title: همدردی کردن و گفتن وضعیت خودتان
    gloss: اینس می‌گوید متوجه است و خودش اینجا در پاریس با پدربزرگ و مادربزرگش زندگی می‌کند.
    note: '*Je comprends* (می‌فهمم) روش کوتاه و طبیعی برای نشان دادن درک حرف طرف مقابل است، پیش از اینکه چیزی از خودتان اضافه کنید.'
  fr.a1.unit03.lesson06.teach.line08:
    title: پایان دادن با یک جملهٔ صمیمی
    gloss: ماتیو می‌گوید خوب است آدم خانواده‌اش را نزدیک خودش داشته باشد.
    note: '*C''est bien d''avoir sa famille près de soi* گفت‌وگو را با جمله‌ای گرم و تأمل‌برانگیز تمام می‌کند و الگوی *près de* درس چهارم را تکرار می‌کند.'
