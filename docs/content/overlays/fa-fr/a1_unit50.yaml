teaching:
  fr.a1.unit50.lesson01.teach.appeler:
    title: زنگ زدن
    gloss: زنگ زدن
    note: مصدر فعلی که برای تماس تلفنی به کار می‌رود.
    example_gloss: باید بهت زنگ بزنم.
  fr.a1.unit50.lesson01.teach.je_t_appelle:
    title: گفتن اینکه زنگ می‌زنید
    gloss: بهت زنگ می‌زنم.
    note: '*Appelle* شکل *je* از *appeler* است؛ در فرانسوی برای «زنگ می‌زنم» در آینده‌ای نزدیک از زمان حال استفاده می‌شود، شبیه فارسی که می‌گوییم «بعداً زنگ می‌زنم».'
  fr.a1.unit50.lesson01.teach.allo_c_est:
    title: جواب دادن به تلفن
    gloss: الو، من کامیلم.
    note: '*C''est* + نام روش معمول معرفی خود در تلفن در فرانسوی است؛ در فارسی می‌گوییم «من … هستم».'
  fr.a1.unit50.lesson01.teach.allo_c_est_2:
    title: ماتیو هم به همین شکل جواب می‌دهد
    gloss: الو، من ماتیو هستم.
    note: همان الگوی *c'est* + نام در *Allô, c'est Camille*.
  fr.a1.unit50.lesson02.teach.qui_est_a:
    title: پرسیدن اینکه چه کسی زنگ زده
    gloss: با کی صحبت می‌کنم؟
    note: '*Qui est à l''appareil ?* روش معمول پرسیدن هویت تماس‌گیرنده‌ای است که نمی‌شناسید.'
  fr.a1.unit50.lesson02.teach.vous_parlez_avec:
    title: معرفی رسمی خود
    gloss: با کامیل صحبت می‌کنید.
    note: '*Vous parlez avec* + نام شکل رسمیِ *c''est* + نام است.'
  fr.a1.unit50.lesson03.teach.tu_peux_repeter:
    title: خواستن تکرار
    gloss: می‌شه اون رو تکرار کنی؟
    note: '*Tu peux ...* (می‌توانی … ؟) به‌اضافهٔ مصدر *répéter* (تکرار کردن).'
  fr.a1.unit50.lesson03.teach.ne_parle_pas:
    title: خواستن از کسی که آهسته‌تر حرف بزند
    gloss: لطفاً این‌قدر تند حرف نزن.
    note: '*Ne parle pas si vite* فعل را منفی می‌کند: *ne ... pas* دور *parle* می‌آید و *si* یعنی «این‌قدر».'
  fr.a1.unit50.lesson03.teach.je_ne_t:
    title: گفتن اینکه خوب نمی‌شنوید
    gloss: صدات رو خوب نمی‌شنوم.
    note: '*Entendre* (شنیدن) با *ne ... pas bien* مشکل شنیدن را می‌گوید و با *comprendre* (فهمیدن) فرق دارد.'
  fr.a1.unit50.lesson04.teach.le_sms:
    title: پیامک
    gloss: پیام متنی
    note: '*SMS* مذکر است: *un SMS*؛ این واژه از اختصار بین‌المللی گرفته شده است.'
    example_gloss: پیامک از کامیل است.
  fr.a1.unit50.lesson04.teach.je_t_envoie:
    title: گفتن اینکه پیامک می‌فرستید
    gloss: بهت پیام می‌دم.
    note: در *Envoyer* (فرستادن) ضمیر *te* (اینجا *t'*) قبل از فعل می‌آید و بعدش *un SMS*.
  fr.a1.unit50.lesson04.teach.je_te_rappelle:
    title: گفتن اینکه بعداً زنگ می‌زنید
    gloss: بعداً بهت زنگ می‌زنم.
    note: '*Rappeler* (دوباره زنگ زدن) مفهوم «دوباره» را در *re-* دارد؛ *plus tard* یعنی «بعداً».'
  fr.a1.unit50.lesson05.teach.mathieu_salut_camille:
    title: خواندن گفتگوی پیامکی
    gloss: 'Mathieu: سلام Camille، می‌شه بهم زنگ بزنی؟ باید یه چیزی بهت بگم. Camille: آره، معلومه، پنج دقیقه دیگه بهت زنگ می‌زنم.'
    note: دقت کنید Mathieu چه چیزی می‌خواهد، چرا، و Camille می‌گوید چه موقع دوباره زنگ می‌زند.
    glosses:
      Salut: سلام
      peux: می‌تونی
      m'appeler: زنگ زدن
      dois: باید
      truc: یه چیزی
      dire: گفتن
      évidemment: حتماً
      rappelle: پس دادن
      cinq: پنج
      minutes: دقیقه
  fr.a1.unit50.lesson06.teach.mathieu_allo_c:
    title: Mathieu به تلفن جواب می‌دهد
    gloss: 'Mathieu: الو، Mathieu هستم.'
    note: 'همان ساختار *c''est* + نام از درس اول، این بار در یک تماس تلفنی واقعی: کسی که گوشی را برمی‌دارد اول حرف می‌زند و اسمش را می‌گوید.'
  fr.a1.unit50.lesson06.teach.camille_salut_mathieu:
    title: Camille خودش را معرفی می‌کند
    gloss: 'Camille: سلام Mathieu، Camille هستم. Mathieu: چه خوب که زنگ زدی!'
    note: '*C''est sympa que* ... (چه خوب که ...) واکنش مثبت به یک اتفاق را نشان می‌دهد؛ *appelles* شکل خاصی است که فعلاً فقط آن را حفظ کنید.'
  fr.a1.unit50.lesson06.teach.camille_comment_s:
    title: Camille درباره‌ی شیفت می‌پرسد
    gloss: 'Camille: اولین شیفتت چطور گذشت؟'
    note: '*Comment s''est passé ... ?* از ماضی نقلیِ *se passer* (اتفاق افتادن) با فعل کمکی *être* ساخته شده و برای پرسیدن از چگونگی گذشتنِ یک چیز به کار می‌رود.'
  fr.a1.unit50.lesson06.teach.mathieu_ca_s:
    title: Mathieu خبر خوب می‌دهد
    gloss: 'Mathieu: خیلی خوب گذشت، بهتر از چیزی که فکر می‌کردم.'
    note: '*Ça s''est très bien passé* و *je pensais* اینجا عبارت‌های ثابت‌اند؛ *je pensais* ماضی استمراریِ *penser* (فکر کردن) است.'
  fr.a1.unit50.lesson06.teach.au_passe_compose:
    title: ماضی نقلی با avoir و être
    gloss: اتفاق افتاد ← ، فکر کردم ← ، رفتم
    note: 'ماضی نقلی از *avoir* یا *être* + اسم مفعول ساخته می‌شود: *j''ai pensé*، *je suis allé*. *Ça s''est passé* عبارتی ثابت به معنی «گذشت/اتفاق افتاد» است؛ فعلاً فقط در همین موقعیت‌های این درس آن را حفظ کنید.'
  fr.a1.unit50.lesson06.teach.camille_ca_fait:
    title: Camille افتخار می‌کند
    gloss: 'Camille: چه خوب که این را می‌شنوم! به تو افتخار می‌کنم.'
    note: '*Fière de* (مفتخر به) ترکیبی ثابت است؛ *de* لازم است، نه *pour*؛ *fière* اینجا مؤنث است.'
  fr.a1.unit50.lesson06.teach.mathieu_merci_beaucoup:
    title: Mathieu تحت تأثیر قرار می‌گیرد
    gloss: 'Mathieu: خیلی ممنون، برایم خیلی مهم است.'
    note: '*Compter* اینجا یعنی «مهم بودن»: *ça compte pour moi* (برای من مهم است)؛ *pour moi* می‌گوید برای چه کسی مهم است.'
  fr.a1.unit50.lesson06.teach.son_premier_service:
    title: مال او
    gloss: اولین شیفتش خیلی خوب گذشت.
    note: '*Son* اینجا صفت ملکی «او/اش» است، نه فعل: *son premier service* (اولین شیفتِ او)؛ *son* با *service* که مذکر است هماهنگ شده.'
