  fr.a1.unit56.lesson05.teach.camille_voyage_tous:
    title: چه کسی چطور می‌رود؟
    gloss: Camille هر روز با قطار به سر کار می‌رود. Mathieu معمولاً با دوچرخه می‌رود، ولی وقتی باران می‌بارد با قطار هم می‌رود. Thomas ترجیح می‌دهد با ماشین برود. Léa خیلی نزدیک زندگی می‌کند و پیاده به سر کار می‌رود. شما چطور به سر کار می‌روید؟
    note: چهار شیوه‌ی مختلف رفتن به سر کار و یک شرط (باران) را کنار هم می‌گذارد، مثل متنِ مقایسه‌ی ورزش‌ها در واحد قبل.
