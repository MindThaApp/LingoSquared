  fr.a1.unit56.lesson04.teach.pour_les_transports:
    title: À vélo, en train
    gloss: در فرانسوی برای وسیله‌ای که سوارش می‌شوید یا با آن حرکت می‌کنید از *à* استفاده می‌شود (*à vélo*، *à pied*) و برای وسیله‌ای که داخلش می‌نشینید از *en* (*en train*، *en voiture*). در فارسی معمولاً برای همه‌ی این‌ها «با» می‌گوییم، ولی در فرانسوی باید حرف اضافه را درست انتخاب کنید.
    note: زبان‌آموزان گاهی *par vélo* یا *dans le train* می‌گویند. *à vélo*، *à pied*، *en train* و *en voiture* را عبارت‌های ثابت بدانید.
