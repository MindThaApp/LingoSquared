      voyage: سفر می‌کند
      tous: هر
      jours: روز
      train: قطار
      travail: کار کردن
      vélo: دوچرخه‌سواری می‌کند
      surtout: معمولاً
      pleut: باران می‌آید
      prend: سوار می‌شود
      aller: می‌رود (با وسیله)
      préfère: ترجیح می‌دهد
      voiture: ماشین
