  fr.a1.unit55.lesson03.teach.tu_connais_deja:
    title: Faire du sport در برابر faire de la + ورزش
    gloss: '*faire du sport* را از درس سرگرمی‌ها می‌دانید (*Je fais du sport le samedi*). *Faire de la* + ورزش، ورزش مشخصی را نام می‌برد: *Je fais de la natation*. هر دو فرانسه‌ی درست هستند.'
