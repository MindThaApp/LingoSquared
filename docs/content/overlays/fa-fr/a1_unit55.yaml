    gloss: '*Faire du*، *de la* یا *de l''* + ورزش می‌گوید چه ورزشی می‌کنید: *faire du yoga*، *faire de la natation*، *faire de la course à pied*. برای فوتبال می‌گویید *jouer au football*.'
    note: یک ساختار برای همه‌ی ورزش‌ها کافی است؛ در این سطح لازم نیست برای هر ورزش فعل جداگانه‌ای یاد بگیرید.
