teaching:
  fr.a1.unit04.lesson01.teach.marche:
    title: بازار
    gloss: آن بازار
    note: '*Marché* مذکر است.'
    example_gloss: بازار شنبه‌ها باز است.
  fr.a1.unit04.lesson01.teach.boulangerie:
    title: نانوایی
    gloss: آن نانوایی
    note: '*Boulangerie* مؤنث است؛ مغازه‌ای مخصوص نان که با *pâtisserie* (شیرینی‌فروشی) فرق دارد.'
    example_gloss: یک نانوایی خوب این نزدیکی هست.
  fr.a1.unit04.lesson01.teach.legumes:
    title: سبزیجات
    gloss: سبزی
    note: '*Légumes* مذکر جمع است.'
    example_gloss: دارم سبزیجات تازه برای کارگاه می‌خرم.
  fr.a1.unit04.lesson01.teach.fruits:
    title: میوه
    gloss: میوه
    note: '*Fruits* مذکر جمع است. فرانسوی اغلب شکل جمع (*les fruits*) را به کار می‌برد، در حالی که در فارسی معمولاً می‌گوییم «میوه» و آن را به شکل مفرد می‌آوریم.'
    example_gloss: این ماه میوه گرون است.
  fr.a1.unit04.lesson01.teach.prix:
    title: قیمت
    gloss: قیمت
    note: '*Prix* مذکر است و تغییر نمی‌کند؛ املای مفرد و جمعش یکی است.'
    example_gloss: قیمت نان چنده؟
  fr.a1.unit04.lesson01.teach.cher:
    title: گران
    gloss: گران
    note: '*Cher* شکل مذکر است؛ *chère* مؤنث و *chers*/*chères* جمع است و با اسمی که توصیف می‌کند مطابقت پیدا می‌کند.'
    example_gloss: این پنیر خیلی گرونه.
  fr.a1.unit04.lesson01.teach.pas_cher:
    title: امروز گران نیست
    gloss: سبزیجات امروز گرون نیستند.
    note: '*Pas cher(s)* (بدون *ne*) راه رایج گفتاری برای گفتن ارزان بودن چیزی است؛ شکل کامل نوشتاری‌اش *ne sont pas chers* است.'
  fr.a1.unit04.lesson02.teach.un_kilo_de:
    title: یک کیلو
    gloss: یک کیلو
    note: '*De* مستقیماً بعد از مقدار می‌آید و هیچ حرف تعریفی بینشان نیست؛ یادداشت دستوری *de after quantity* را پایین‌تر ببینید.'
    example_gloss: یک کیلو گوجه‌فرنگی می‌خواستم.
  fr.a1.unit04.lesson02.teach.un_litre_de:
    title: یک لیتر
    gloss: یک لیتر
    note: '*Litre* مذکر است و برای مایعات به کار می‌رود، همان‌طور که *kilo* برای جامدات.'
    example_gloss: یک لیتر شیر، لطفاً.
  fr.a1.unit04.lesson02.teach.euro:
    title: یک یورو
    gloss: یک یورو
    note: '*Euro* به‌شکل منظم جمع بسته می‌شود: *deux euros*، *cinq euros*.'
    example_gloss: این پنج یورو می‌شود.
  fr.a1.unit04.lesson02.teach.de_after_quantity:
    title: de بعد از مقدار
    gloss: از
    note: 'بعد از یک واژهٔ مقدار روشن (*un kilo*، *un litre*، *beaucoup*، مثل *beaucoup de cousins*)، فرانسوی فقط *de* می‌گذارد و *du*/*de la*/*des* را کاملاً حذف می‌کند: *un kilo de tomates*، هرگز *un kilo des tomates*.'
  fr.a1.unit04.lesson02.teach.combien_ca_coute:
    title: پرسیدن قیمت
    gloss: قیمتش چقدره؟
    note: '*Combien* (چقدر) به‌علاوهٔ *ça coûte* (قیمتش می‌شود) راه عمومی و همه‌کاره برای پرسیدن قیمت است.'
  fr.a1.unit04.lesson02.teach.cest_combien_pain:
    title: پرسیدن قیمت یک چیز مشخص
    gloss: نان چند است؟
    note: '*C''est combien, [item] ?* چیز مشخصی را که قیمتش را می‌پرسید نام می‌برد و جایگزین رایجی برای *Combien ça coûte ?* است.'
  fr.a1.unit04.lesson02.teach.ca_fait_combien:
    title: پرسیدن مجموع حساب
    gloss: روی هم چقدر می‌شود؟
    note: '*Ça fait combien ?* مجموع حساب را می‌پرسد، معمولاً در پایان خرید و نه دربارهٔ یک کالا.'
  fr.a1.unit04.lesson03.teach.line01:
    title: سفارش گوجه‌فرنگی
    gloss: Inès به فروشنده سلام می‌کند و یک کیلو گوجه‌فرنگی می‌خواهد.
    note: '*Bonjour* را با الگوی *je voudrais* + مقدار ترکیب می‌کند.'
  fr.a1.unit04.lesson03.teach.line02:
    title: پرسیدن اینکه چیز دیگری لازم است
    gloss: فروشنده قبول می‌کند و می‌پرسد چیز دیگری لازم دارد یا نه.
    note: '*Autre chose ?* (چیز دیگری؟) سؤال معمول فروشنده بعد از سفارش است.'
  fr.a1.unit04.lesson03.teach.line03:
    title: اضافه کردن پنیر و پرسیدن قیمتش
    gloss: Inès کمی پنیر هم اضافه می‌کند و قیمتش را می‌پرسد.
    note: '*Un peu de fromage* (کمی پنیر) همان الگوی *de* بدون حرف تعریف را دارد که *un kilo de* دارد.'
  fr.a1.unit04.lesson03.teach.line04:
    title: گفتن قیمت هر کیلو
    gloss: فروشنده می‌گوید کیلویی هشت یورو است.
    note: '*X euros le kilo* راه طبیعی فرانسوی برای گفتن قیمت هر واحد است و *le* در اینجا یعنی «هر».'
  fr.a1.unit04.lesson03.teach.line05:
    title: توضیح اینکه چرا از اینجا نان می‌خواهد
    gloss: Mathieu می‌گوید او هم نان می‌خواهد، ولی نانوایی امروز بسته است.
    note: '*Fermée* (بسته) شکل مؤنث است و با *la boulangerie* مطابقت دارد.'
  fr.a1.unit04.lesson03.teach.line06:
    title: پیشنهاد یک راه دیگر
    gloss: Inès به او اطمینان می‌دهد که نان را اینجا هم می‌شود خرید.
    note: '*On peut* (می‌شود / می‌توانیم) + مصدر راه غیررسمی و رایج برای بیان امکان است.'
  fr.a1.unit04.lesson03.teach.line07:
    title: تأیید و گفتن مجموع حساب
    gloss: فروشنده تأیید می‌کند که نان تازه دارد، مجموع را حساب می‌کند و می‌گوید سیزده یورو و پنجاه سنت.
    note: '*Ça fait combien en tout ?* در اینجا فکر کردن فروشنده با صدای بلند است، قبل از گفتن مجموع، نه اینکه واقعاً از Inès بپرسد.'
  fr.a1.unit04.lesson03.teach.line08:
    title: تشکر از فروشنده
    gloss: Inès هنگام پرداخت با گرمی از او تشکر می‌کند.
    note: '*Voilà* در اینجا همراه دادن پول می‌آید و یک واژهٔ رایج همراه با حرکت است.'
