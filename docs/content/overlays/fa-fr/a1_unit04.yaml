course:
  title: فرانسه A1
  description: واژگان بازار، پرسیدن قیمت و مقدار با combien/kilo/litre، و تفاوت du/de la با de ساده بعد از عبارت‌های مقدار؛ ادامه‌ی داستان کارگاه آشپزی اینس و ماتیو در یک موقعیت خرید از بازار. نکته‌ی مهم این است که فرانسوی بعد از مقدار مشخص، حرف تعریف جزء‌نما را کاملاً حذف می‌کند (un kilo de tomates، نه un kilo des tomates).
