  fr.a1.unit11.lesson03.dialogue_projet_courses:
    title: برنامه‌ریزی برای خرید
teaching:
  fr.a1.unit11.lesson01.teach.libre:
    title: آزاد / بیکار
    gloss: آزاد / بیکار
    note: '*Libre* در اینجا درباره آزاد بودن یک نفر است؛ برای چیزی که پولی ندارد، فرانسوی از *gratuit* استفاده می‌کند.'
    example_gloss: شنبه آزادی؟
  fr.a1.unit11.lesson01.teach.occupe:
    title: مشغول
    gloss: مشغول
    note: 'درست متضاد *libre*. از نظر جنسیت تغییر می‌کند: *occupé* / *occupée*.'
    example_gloss: جمعه شب مشغولم.
  fr.a1.unit11.lesson01.teach.se_retrouver:
    title: همدیگر را دیدن
    gloss: همدیگر را دیدن / قرار گذاشتن
    note: در این معنا *se retrouver* متقابل است، یعنی دو یا چند نفر همدیگر را ملاقات می‌کنند؛ با *trouver* (پیدا کردن) فرق دارد.
    example_gloss: امشب کجا همدیگر را ببینیم؟
  fr.a1.unit11.lesson01.teach.vers:
    title: حدود (یک ساعت)
    gloss: حدود / نزدیک (یک ساعت)
    note: '*Vers* + ساعت، زمانی تقریبی را می‌رساند و نرم‌تر از گفتن ساعت دقیق است.'
    example_gloss: حدود ساعت هفت می‌آیم.
  fr.a1.unit11.lesson01.teach.ca_te_dit_de:
    title: نظرت چیه...؟
    gloss: نظرت چیه با هم خرید کنیم؟
    note: '*Ça te dit de... ?* + مصدر روش رایج و صمیمی برای پیشنهاد دادن یک کار است؛ راحت‌تر از *Voulez-vous... ?*'
  fr.a1.unit11.lesson01.teach.venir_chercher:
    title: سراغ کسی آمدن / کسی را سوار کردن
    gloss: حدود شش عصر می‌آیی دنبالم؟
    note: '*Venir chercher quelqu''un* یعنی آمدن و برداشتن یا سوار کردن کسی، نه فقط «جستجو کردن».'
  fr.a1.unit11.lesson01.teach.daccord_a_tout_a_lheure:
    title: باشه، تا بعداً
    gloss: باشه، تا بعداً می‌بینمت!
    note: '*D''accord* (باشه) برنامه را تأیید می‌کند؛ *à tout à l''heure* برای دیدن دوباره کسی در همان روز به کار می‌رود.'
  fr.a1.unit11.lesson02.teach.je_ne_peux_pas:
    title: رد کردن یک برنامه
    gloss: نمی‌تونم، مشغولم.
    note: '*Je ne peux pas* (نمی‌تونم) + دلیل، راهی ساده و مؤدبانه برای رد کردن است.'
  fr.a1.unit11.lesson02.teach.avec_plaisir:
    title: با خوشحالی قبول کردن
    gloss: با کمال میل!
    note: '*Avec plaisir* (تحت‌اللفظی «با لذت») روشی گرم و پرشور برای قبول کردن دعوت است.'
  fr.a1.unit11.lesson02.teach.a_quelle_heure_on_se_voit:
    title: پرسیدن ساعت
    gloss: ساعت چند همدیگر را می‌بینیم؟
    note: '*On se voit* (صمیمی، «همدیگر را می‌بینیم») جایگزین رایج و محاوره‌ای *se retrouver* برای قرار گذاشتن است.'
  fr.a1.unit11.lesson02.teach.devant_le_marche:
    title: پیشنهاد مکان
    gloss: جلوی بازار، خوبه؟
    note: '*Ça te va ?* (خوبه؟ جور هست؟) می‌پرسد که جزئیات پیشنهادشده برای طرف مقابل مناسب است یا نه.'
  fr.a1.unit11.lesson02.teach.parfait_alors:
    title: تأیید برنامه
    gloss: عالیه، پس جمعه می‌بینمت!
    note: '*Alors* در اینجا یعنی «پس»، برای تأیید نتیجه و بستن گفتگوی برنامه‌ریزی.'
  fr.a1.unit11.lesson03.teach.line01:
    title: پیشنهاد خرید با هم
    gloss: اینس از ماتیو می‌پرسد که دوست دارد قبل از کارگاه با هم خرید کنند یا نه.
    note: '*Ça te dit de... ?* گفتگو را با یک پیشنهاد صمیمی شروع می‌کند.'
  fr.a1.unit11.lesson03.teach.line02:
    title: قبول کردن و پرسیدن مکان
    gloss: ماتیو با کمال میل قبول می‌کند و می‌پرسد کجا همدیگر را ببینند.
    note: '*Avec plaisir* (با کمال میل) و *se retrouver* (همدیگر را دیدن) را کنار هم می‌آورد.'
  fr.a1.unit11.lesson03.teach.line03:
    title: پیشنهاد مکان و روز
    gloss: اینس جلوی بازار، جمعه شب را پیشنهاد می‌کند.
    note: یک پیشنهاد کوتاه که مکان (*devant le marché*) و روز (*vendredi soir*) را با هم دارد.
  fr.a1.unit11.lesson03.teach.line04:
    title: قبول کردن و پرسیدن ساعت
    gloss: ماتیو موافقت می‌کند و می‌پرسد چه ساعتی.
    note: '*D''accord* مکان و روز را تأیید می‌کند؛ سؤال بعدی ساعت دقیق را مشخص می‌کند.'
  fr.a1.unit11.lesson03.teach.line05:
    title: پیشنهاد یک ساعت مشخص
    gloss: اینس می‌پرسد ماتیو حدود شش عصر می‌آید دنبالش یا نه.
    note: '*Venir chercher* و *vers* را با یک ساعت مشخص به کار می‌برد.'
  fr.a1.unit11.lesson03.teach.line06:
    title: تأیید همه چیز
    gloss: ماتیو می‌گوید عالیه، پس جمعه، ساعت شش عصر، جلوی بازار.
    note: هر سه جزئیات برنامه (روز، ساعت، مکان) را با هم تکرار می‌کند تا گفتگو روشن بسته شود.
