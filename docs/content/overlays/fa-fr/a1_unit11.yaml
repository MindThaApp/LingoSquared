  capitalization: Accept sentence-initial capitalization variants where meaning is unchanged. Preserve capitals in personal names.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register rather than written punctuation or liaison marks.
course:
  title: فرانسه A1
  description: پیشنهاد دادن، قبول کردن، رد کردن و زمان‌بندی یک برنامه ساده؛ ادامه ماجرای کارگاه آشپزی اینس و ماتیو که حالا قرار می‌گذارند قبل از جلسه شنبه با هم برای مواد غذایی خرید کنند. فعل انعکاسی و متقابل *se retrouver* (همدیگر را در جایی دیدن) در فارسی یک فعل ساده معادل ندارد و معمولاً با «قرار گذاشتن» یا «همدیگر را دیدن» بیان می‌شود. *vers* + ساعت هم زمان تقریبی قرار را نشان می‌دهد، نه زمان دقیق.
units:
  fr.a1.unit11.plans:
    title: کی همدیگر را می‌بینیم؟
