teaching:
  fr.a1.unit48.lesson01.teach.le_manteau_le:
    title: پالتو، پلیور
    gloss: پالتو، پلیور
    note: هر دو کلمهٔ *le manteau* و *le pull* مذکر هستند.
    example_gloss:
    - دنبال یک پالتو می‌گردم.
    - من یک پلیور دارم.
  fr.a1.unit48.lesson01.teach.le_pantalon_les:
    title: شلوار، کفش
    gloss: شلوار، کفش‌ها
    note: 'در فرانسه *pantalon* مفرد است، درست مثل «شلوار» در فارسی: برای یک شلوار می‌گویند *un pantalon*. *Chaussures* جمع *chaussure* است و کفش را معمولاً به صورت جمع می‌گویند.'
    example_gloss:
    - دنبال یک شلوار می‌گردم.
    - دنبال کفش می‌گردم.
  fr.a1.unit48.lesson01.teach.je_cherche_un:
    title: گفتن اینکه دنبال چه چیزی می‌گردید
    gloss: دنبال یک پالتو می‌گردم.
    note: 'فعل *chercher* (گشتن، جستجو کردن) مفعول را مستقیم می‌گیرد و حرف اضافه نمی‌خواهد: *je cherche un manteau*. در فارسی «دنبال» می‌آید، اما در فرانسه نه.'
  fr.a1.unit48.lesson02.teach.la_taille:
    title: سایز
    gloss: سایز
    note: '*Taille* مؤنث است: *la taille*.'
    example_gloss: چه سایزی می‌پوشید؟
  fr.a1.unit48.lesson02.teach.quelle_taille_faites:
    title: پرسیدن دربارهٔ سایز
    gloss: چه سایزی می‌پوشید؟
    note: در *Quelle taille ?* از *quelle* (کدام) استفاده می‌شود، چون *taille* مؤنث است و جواب‌های ممکن محدودند (S، M، L یا یک عدد).
  fr.a1.unit48.lesson02.teach.je_fais_du:
    title: گفتن سایز خودتان
    gloss: من سایز M هستم.
    note: '*Faire du M* یعنی سایز M بودن: فرانسوی برای سایز از فعل *faire* (ساختن، انجام دادن) استفاده می‌کند، نه «بودن».'
  fr.a1.unit48.lesson03.teach.noir_bleu:
    title: مشکی، آبی
    gloss: مشکی، آبی
    note: دو صفت رنگ پایه در این درس.
    example_gloss:
    - پالتو را به رنگ مشکی می‌خواهم.
    - این را به رنگ آبی هم دارید؟
  fr.a1.unit48.lesson03.teach.je_veux_le:
    title: درخواست یک رنگ
    gloss: پالتو را به رنگ مشکی می‌خواهم.
    note: '*En* + رنگ، روش معمول برای مشخص کردن رنگ لباس هنگام سفارش یا درخواست است.'
  fr.a1.unit48.lesson03.teach.avez_vous_aussi:
    title: پرسیدن دربارهٔ رنگ دیگر
    gloss: این را به رنگ آبی هم دارید؟
    note: '*Aussi* (هم، همچنین) می‌پرسد که رنگ دیگری موجود است یا نه؛ اینجا با *vous* و به شکل محترمانه.'
  fr.a1.unit48.lesson04.teach.est_ce_que:
    title: پرسیدن دربارهٔ اندازه بودن
    gloss: این پالتو اندازه است؟
    note: 'برای اندازه بودن لباس، فعل طبیعی *aller* (رفتن) است: *il me va bien*، یعنی تقریباً «به من خوب می‌آید».'
  fr.a1.unit48.lesson04.teach.il_me_va:
    title: تأیید اندازه بودن
    gloss: اندازه‌ام است.
    note: '*Bien* (خوب) نشان می‌دهد لباس چطور اندازه است.'
  fr.a1.unit48.lesson04.teach.c_est_trop:
    title: خیلی کوچک است
    gloss: خیلی کوچک است.
    note: '*Trop* (خیلی، بیش از حد) برای بیان زیادی، قبل از صفت می‌آید.'
  fr.a1.unit48.lesson04.teach.c_est_trop_2:
    title: خیلی بزرگ است
    gloss: خیلی بزرگ است.
    note: همان الگوی *trop* + صفت کارت قبلی، یعنی *trop petit*.
  fr.a1.unit48.lesson05.teach.quatre_vingt_dix:
    title: نود
    gloss: نود
    note: '*Quatre-vingt-dix* عدد ۹۰ است (تحت‌اللفظی «چهار بیست و ده»)؛ اینجا در قیمت پالتو آمده است.'
    example_gloss: پالتو نود یورو قیمت دارد.
  fr.a1.unit48.lesson05.teach.le_manteau_coute:
    title: گفتن قیمت
    gloss: پالتو نود یورو قیمت دارد.
    note: '*Coûte* صورت *il* از فعل *coûter* (قیمت داشتن) است.'
  fr.a1.unit48.lesson05.teach.parka_taille_m:
    title: خواندن رسید فروشگاه
    gloss: 'پالتو زمستانی: سایز M، رنگ مشکی. قیمت: نود یورو. این پالتو اندازه است و گرم است.'
    note: به سایز، رنگ، قیمت و دو ویژگی‌ای که دربارهٔ پالتو آمده توجه کنید.
    glosses:
      Parka: پالتو زمستانی
      taille: سایز
      couleur: رنگ
      noire: مشکی
      Prix: قیمت
      quatre-vingt-dix: نود
      euros: یورو
      manteau: پالتو
      va: اندازه است
      chaud: گرم
  fr.a1.unit48.lesson06.teach.camille_ce_manteau:
    title: کامیل پالتو را می‌بیند
    gloss: 'کامیل: این پالتو قشنگه! تو چه سایزی هستی؟'
    note: '*Joli* (قشنگ) واکنشی مثبت و عمومی است؛ اینجا مذکر است چون با *manteau* مطابقت دارد.'
  fr.a1.unit48.lesson06.teach.mathieu_je_fais:
    title: ماتیو می‌خواهد پالتو را امتحان کند
    gloss: 'ماتیو: من سایز M هستم. می‌تونم امتحانش کنم؟'
    note: '*Je peux ... ?* روش معمول اجازه گرفتن است؛ *l''essayer* یعنی «امتحانش کردن» و *l''* به پالتو برمی‌گردد.'
  fr.a1.unit48.lesson06.teach.camille_bien_sur:
    title: کامیل دربارهٔ اندازه بودن می‌پرسد
    gloss: 'کامیل: حتماً. اندازته؟'
    note: '*Il* (او، آن) به *le manteau* برمی‌گردد که اسمی مذکر است.'
  fr.a1.unit48.lesson06.teach.mathieu_oui_il:
    title: ماتیو تأیید می‌کند
    gloss: 'ماتیو: آره، اندازمه و گرمه.'
    note: دقیقاً با رسیدی که در درس پنجم خواندید یکی است؛ این همان پالتو است.
  fr.a1.unit48.lesson06.teach.camille_super_tu:
    title: کامیل دربارهٔ رنگ می‌پرسد
    gloss: 'کامیل: عالیه! مشکی‌شو می‌خوای یا آبی‌شو؟'
    note: '*Tu le veux en ... ou en ... ?* یک انتخاب پیش می‌گذارد؛ *le* به پالتو برمی‌گردد.'
  fr.a1.unit48.lesson06.teach.mathieu_je_le:
    title: ماتیو تصمیم می‌گیرد
    gloss: 'ماتیو: مشکی‌شو برمی‌دارم.'
    note: '*Prendre* (برداشتن، گرفتن) فعل طبیعی برای قطعی کردن انتخاب خرید است و با رنگ ذکرشده در رسید می‌خواند.'
  fr.a1.unit48.lesson06.teach.on_ecrit_prends:
    title: prends یا prend
    gloss: '*Prends* صورت «من» و «تو» از فعل *prendre* (برداشتن، گرفتن) است؛ *prend* صورت «او» است.'
    note: 'الگوی فعل *prendre*: *je prends, tu prends, il/elle prend*.'
