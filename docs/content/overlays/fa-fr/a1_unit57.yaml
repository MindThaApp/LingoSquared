    gloss: '*Au revoir !* را از قبل بلدید. می‌توانید اسم یک روز را هم بگویید: *À samedi !*، *À demain !*'
    note: الگوی خداحافظی درس سلام و احوال‌پرسی را به یک روز مشخص گسترش می‌دهد.
  fr.a1.unit57.lesson05.teach.camille_appelle_mathieu:
    title: چه کسی از چه استفاده می‌کند؟
    gloss: کامیل هر روز به ماتیو زنگ می‌زند. او از گوشی‌اش استفاده می‌کند، نه از اپلیکیشن. ماتیو در خانه کامپیوتر ندارد، ولی روی گوشی‌اش از اینترنت استفاده می‌کند. توما هر صبح پیش‌بینی هوا را نگاه می‌کند. بعد می‌رود دوی صبحگاهی. لیا اغلب برای کامیل پیام می‌فرستد. شما چطور؟ شما هم هر روز از گوشی‌تان استفاده می‌کنید؟
    note: عادت‌های استفاده از دستگاه را در هر چهار شخصیت مقایسه می‌کند، مثل متن مقایسه‌ای درس ورزش.
