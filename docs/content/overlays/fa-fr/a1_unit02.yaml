teaching:
  fr.a1.unit02.lesson01.teach.zero:
    title: صفر
    gloss: صفر
    note: '*Zéro* هم خودِ عدد است و هم هنگام بلند خواندنِ رشته‌ای از ارقام برای یک رقم به کار می‌رود.'
  fr.a1.unit02.lesson01.teach.un:
    title: یک
    gloss: یک
    note: '*Un* مذکر است؛ شکل مؤنث *une* پیش از اسم مؤنث می‌آید (*une tasse*، یک فنجان). وقتی تنها و هنگام شمردن گفته شود، همان *un* می‌ماند.'
  fr.a1.unit02.lesson01.teach.deux:
    title: دو
    gloss: دو
    note: '*Deux* صرف‌نظر از جنس اسم هرگز تغییر نمی‌کند.'
  fr.a1.unit02.lesson01.teach.trois:
    title: سه
    gloss: سه
    note: '*Trois* تغییرناپذیر است.'
  fr.a1.unit02.lesson01.teach.quatre:
    title: چهار
    gloss: چهار
    note: '*Quatre* تغییرناپذیر است.'
  fr.a1.unit02.lesson01.teach.cinq:
    title: پنج
    gloss: پنج
    note: '*Cinq* تغییرناپذیر است. q پایانی معمولاً تلفظ می‌شود، برخلاف همخوان‌های پایانیِ بی‌صدا در چند عدد دیگر فرانسوی.'
  fr.a1.unit02.lesson01.teach.six:
    title: Six
    gloss: شش
    note: '*Six* وقتی تنها گفته شود با صدای /s/ پایانی تلفظ می‌شود، اما پیش از اسمی که با همخوان شروع می‌شود این همخوان پایانی حذف می‌شود (*six livres* مثل «si livres» شنیده می‌شود).'
  fr.a1.unit02.lesson01.teach.sept:
    title: هفت
    gloss: هفت
    note: '*Sept* تغییرناپذیر است؛ p تلفظ نمی‌شود و فقط t پایانی خوانده می‌شود.'
  fr.a1.unit02.lesson01.teach.huit:
    title: هشت
    gloss: هشت
    note: '*Huit* تغییرناپذیر است. h تلفظ نمی‌شود، مثل تقریباً همهٔ واژه‌های فرانسوی.'
  fr.a1.unit02.lesson01.teach.neuf:
    title: نه
    gloss: نه
    note: '*Neuf* تغییرناپذیر است.'
  fr.a1.unit02.lesson01.teach.dix:
    title: ده
    gloss: ده
    note: '*Dix* وقتی تنها گفته شود با صدای /s/ پایانی تلفظ می‌شود و مثل *six* پیش از همخوان این صدا حذف می‌شود.'
  fr.a1.unit02.lesson02.teach.onze:
    title: یازده
    gloss: یازده
    note: '*Onze* تا *seize* (۱۱ تا ۱۶) هرکدام واژه‌ای مستقل‌اند و از *dix* ساخته نشده‌اند، برخلاف بیست‌ویک به بعد که دوباره از *vingt* استفاده می‌کند.'
  fr.a1.unit02.lesson02.teach.douze:
    title: دوازده
    gloss: دوازده
    note: '*Douze* یک واژهٔ واحد است. اولش شبیه *deux* است، اما *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.treize:
    title: سیزده
    gloss: سیزده
    note: '*Treize* یک کلمهٔ واحد است. اول آن شبیه *trois* است، ولی *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.quatorze:
    title: چهارده
    gloss: چهارده
    note: '*Quatorze* یک کلمهٔ واحد است. اول آن شبیه *quatre* است، ولی *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.quinze:
    title: پانزده
    gloss: پانزده
    note: '*Quinze* یک کلمهٔ واحد است. ارتباط دوری با *cinq* دارد، ولی *dix* در آن دیده نمی‌شود.'
  fr.a1.unit02.lesson02.teach.seize:
    title: شانزده
    gloss: شانزده
    note: '*Seize* آخرین عدد از این کلمه‌های ادغام‌شده است؛ از *dix-sept* (۱۷) به بعد، *dix* دوباره آشکارا همراه یکان می‌آید.'
  fr.a1.unit02.lesson02.teach.vingt:
    title: بیست
    gloss: بیست
    note: '*Vingt* کلمهٔ مستقلی است. از بیست‌ویک به بعد، دهگان و یکان با هم ترکیب می‌شوند (*vingt et un*، *vingt-deux*)؛ این الگو را پایین‌تر دوباره مرور می‌کنیم.'
  fr.a1.unit02.lesson02.teach.trente:
    title: سی
    gloss: سی
    note: '*Trente* با خط تیره به یکان بعدی وصل می‌شود (*trente-quatre*)، به جز عدد یک که به‌جای خط تیره *et* می‌گیرد (*trente et un*).'
  fr.a1.unit02.lesson02.teach.trente_quatre:
    title: سی‌وچهار
    gloss: سی‌وچهار
    note: '*Trente-quatre* با خط تیره نوشته می‌شود؛ یعنی بین دهگان و یکان خط تیره می‌گذارند.'
  fr.a1.unit02.lesson02.teach.soixante:
    title: شصت
    gloss: شصت
    note: '*Soixante* تا شصت‌ونه مثل یک دهگان معمولی رفتار می‌کند (*soixante-quatre*، ۶۴)؛ بخش نامنظم از هفتاد شروع می‌شود که بعداً یاد می‌گیرید.'
  fr.a1.unit02.lesson02.teach.soixante_dix:
    title: هفتاد
    gloss: هفتاد
    note: 'این بزرگ‌ترین غافلگیری اعداد فرانسه است: برای هفتاد کلمهٔ مستقلی وجود ندارد. *Soixante-dix* تحت‌اللفظی یعنی «شصت-ده» (۶۰ + ۱۰). شمارش تا *soixante-dix-neuf* (۷۹، «شصت-نوزده») به همین شکل ادامه پیدا می‌کند و بعد با *quatre-vingts* پایهٔ تازه‌ای از هشتاد شروع می‌شود.'
  fr.a1.unit02.lesson02.teach.quatre_vingts:
    title: هشتاد
    gloss: هشتاد
    note: '*Quatre-vingts* تحت‌اللفظی یعنی «چهار بیست» (۴ × ۲۰)، یادگاری از یک نظام شمارش قدیمی بر پایهٔ بیست. s پایانی فقط وقتی می‌آید که کلمه تنها باشد یا آخر عدد بیاید (*quatre-vingts*، ۸۰)؛ اگر یکانی بعد از آن بیاید s حذف می‌شود (*quatre-vingt-un*، ۸۱).'
  fr.a1.unit02.lesson02.teach.quatre_vingt_dix:
    title: نود
    gloss: نود
    note: '*Quatre-vingt-dix* تحت‌اللفظی یعنی «چهار بیست به‌اضافهٔ ده» (۴×۲۰ + ۱۰) و همان الگوی شمارش بر پایهٔ بیست را مثل هفتاد تا *quatre-vingt-dix-neuf* (۹۹) ادامه می‌دهد.'
  fr.a1.unit02.lesson02.teach.cent:
    title: صد
    gloss: صد
    note: '*Cent* شکلی است که برای دقیقاً ۱۰۰ به‌تنهایی و بدون حرف تعریف به کار می‌رود (نه «*un cent*»).'
  fr.a1.unit02.lesson03.teach.quel_age_as_tu:
    title: پرسیدن سن به‌صورت غیررسمی
    gloss: چند سالته؟
    note: در فرانسه سن را با فعل *avoir* (داشتن) می‌پرسند، نه با *être* (بودن). در فارسی معمولاً می‌گوییم «چند سالته؟» و از فعل بودن استفاده می‌کنیم.
  fr.a1.unit02.lesson03.teach.jai_vingt_huit_ans:
    title: گفتن سن
    gloss: بیست‌وهشت سالمه.
    note: '*Ai* صورت je از فعل *avoir* است. گفتن *ans* (سال) در فرانسه الزامی است و نمی‌شود آن را حذف کرد.'
  fr.a1.unit02.lesson03.teach.quel_age_avez_vous:
    title: پرسیدن سن به‌صورت رسمی
    gloss: چند سالته؟
    note: '*Avez-vous* صورت *vous* از فعل *avoir* است و با لحن رسمی که در واحد ۱ یاد گرفتید جور است.'
  fr.a1.unit02.lesson03.teach.jai_trente_et_un_ans:
    title: گفتنِ سنِ مرکب
    gloss: سی‌ویک سال دارم.
    note: '*Trente et un* به‌جای خط تیره *et* (و) می‌گیرد، آن هم فقط برای صورت‌های «...ویک» در سی، چهل، پنجاه و شصت (*trente et un*، *quarante et un*، *cinquante et un*، *soixante et un*). هفتادویک از این الگو پیروی نمی‌کند: *soixante et onze* (شصت + یازده) است، نه *soixante et un*، چون هفتادها با شکل‌های *dix* تا *soixante-dix-neuf* (۷۹) ادامه پیدا می‌کنند.'
  fr.a1.unit02.lesson03.teach.et_toi_quel_age:
    title: برگرداندنِ سؤالِ سن
    gloss: تو چند سالته؟
    note: '*Et toi* سؤال را به طرف مقابل برمی‌گرداند؛ *toi* (نه *tu*) ضمیر تأکیدی است که بعد از *et* می‌آید.'
  fr.a1.unit02.lesson04.teach.quel_est_ton_numero:
    title: پرسیدنِ شماره تلفن
    gloss: شماره تلفنت چنده؟
    note: '*Quel* با اسم مذکر *numéro* مطابقت دارد؛ برای اسم مؤنث باید *quelle* گفت.'
  fr.a1.unit02.lesson04.teach.numero_ines:
    title: شماره‌ای که رقم‌به‌رقم خوانده می‌شود
    gloss: صفر، شش، یک، پنج، صفر، دو، نه، هفت، چهار، سه
    note: شمارهٔ تلفن‌های واقعی فرانسه ده رقم دارند و معمولاً دو رقم دو رقم خوانده می‌شوند (*zéro six*، *quinze*، *zéro deux*...). شماره‌های این واحد قالب واقعی ده‌رقمی (06 15 02 97 43) را دارند، ولی رقم‌به‌رقم خوانده می‌شوند تا اول رقم‌های تک را تمرین کنید.
  fr.a1.unit02.lesson04.teach.cest_le:
    title: شروعِ گفتنِ شماره
    gloss: شمارهٔ من ...
    note: '*Le* (حرف تعریف مذکر) به این دلیل می‌آید که *numéro* اسم مذکر است.'
  fr.a1.unit02.lesson04.teach.tu_peux_repeter:
    title: درخواستِ تکرار
    gloss: لطفاً می‌شه تکرار کنی؟
    note: '*Peux* صورت *tu* از فعل *pouvoir* (توانستن) است و هر وقت عددی را سریع گفتند و نشنیدید به کارتان می‌آید.'
  fr.a1.unit02.lesson04.teach.bien_sur:
    title: قبول‌کردنِ سریع
    gloss: حتماً؛ البته
    note: '*Bien sûr* راه رایج و دوستانه‌ای برای قبول کردن یک درخواست است.'
  fr.a1.unit02.lesson05.teach.jai_besoin_trois_oeufs:
    title: گفتنِ مقدارِ موردنیاز
    gloss: سه تا تخم‌مرغ لازم دارم.
    note: '*J''ai besoin de* (تحت‌اللفظی «نیاز دارم به») برای بیان نیاز است و مثل «نیاز دارم» در فارسی با فعل *avoir* (داشتن) ساخته می‌شود.'
  fr.a1.unit02.lesson05.teach.combien_oeufs:
    title: پرسیدن از تعدادِ موردنیاز
    gloss: چند تا تخم‌مرغ لازم داری؟
    note: در *De combien d'œufs* عبارت *de combien* (یعنی «چند تا») پیش از اسمِ مورد نظر می‌آید؛ در فارسی برعکس، «چند» معمولاً پیش از اسم می‌آید و فعل در آخر جمله می‌ماند، ولی در فرانسوی این ساختار در ابتدای جمله‌ی پرسشی قرار می‌گیرد.
  fr.a1.unit02.lesson05.teach.deux_tasses_farine:
    title: گفتنِ مقدارِ اندازه‌گیری‌شده
    gloss: دو پیمانه آرد
    note: '*De* واحد اندازه‌گیری (*tasses*، فنجان) را به چیزی که اندازه‌اش گفته می‌شود (*farine*، آرد) وصل می‌کند؛ در فارسی بین این دو حرف اضافه نمی‌آید («دو فنجان آرد»).'
  fr.a1.unit02.lesson05.teach.demi_tasse:
    title: گفتنِ نیم‌مقدار
    gloss: نصفِ یک پیمانه شکر
    note: '*Demi-* وقتی پیشوندِ قبل از اسم است تغییر نمی‌کند (*une demi-tasse*)، برخلاف صفت *demi* بعد از اسم که مطابقت می‌کند (*une heure et demie*).'
  fr.a1.unit02.lesson05.teach.jai_quatre_oeufs:
    title: گفتنِ آنچه در دست داری
    gloss: چهار تا تخم‌مرغ روی میز دارم.
    note: '*J''ai* (دارم) از چیزی خبر می‌دهد که از قبل در دسترس است و با *j''ai besoin de* (نیاز دارم) که از چیزی که هنوز کم است خبر می‌دهد فرق دارد.'
  fr.a1.unit02.lesson06.teach.line01:
    title: پرسیدن از تعدادِ تخم‌مرغ
    gloss: Inès از Mathieu می‌پرسد برای دستور پخت به چند تخم‌مرغ نیاز دارد.
    note: 'Inès و Mathieu حالا به‌جای *vous* در واحد ۱ از *tu* استفاده می‌کنند: چون هم‌کلاسی‌های کارگاه‌اند، خیلی زود به لحن غیررسمی رسیده‌اند.'
  fr.a1.unit02.lesson06.teach.line02:
    title: گفتنِ مواد
    gloss: Mathieu می‌گوید سه تخم‌مرغ و دو فنجان آرد لازم دارد.
    note: '*J''ai besoin de* چیزی را می‌گوید که برای دستور پخت هنوز لازم است.'
  fr.a1.unit02.lesson06.teach.line03:
    title: پیشنهادِ آنچه در دست است
    gloss: Inès می‌گوید چهار تخم‌مرغ روی میز دارد و می‌پرسد آیا شکر هم لازم دارد.
    note: '*J''ai* چیزی را می‌گوید که Inès از قبل در دسترس دارد، جدا از چیزی که Mathieu گفت لازم دارد.'
  fr.a1.unit02.lesson06.teach.line04:
    title: تأییدِ مقدارِ کم
    gloss: Mathieu می‌گوید بله، کمی؛ حدود نیم فنجان.
    note: '*Environ* اینجا یعنی «حدود» و مقدار دقیق را نرم‌تر می‌کند.'
  fr.a1.unit02.lesson06.teach.line05:
    title: پرسیدنِ شماره تلفن
    gloss: Inès می‌گوید عالی است، بعد شمارهٔ تلفن Mathieu را می‌خواهد تا برای کلاس بعدی به او پیام بدهد.
    note: '*Comme ça je t''écris* («تا برایت بنویسم / پیام بدهم») دلیل پرسیدنِ شماره را توضیح می‌دهد؛ این کار عادت طبیعی گفت‌وگوست پیش از اینکه کسی اطلاعات تماس را بخواهد.'
  fr.a1.unit02.lesson06.teach.line06:
    title: گفتنِ شماره تلفن
    gloss: Mathieu شمارهٔ خودش را رقم‌به‌رقم می‌خواند.
    note: '*C''est le* شماره را معرفی می‌کند و با اسم مذکر *numéro* جور است.'
  fr.a1.unit02.lesson06.teach.line07:
    title: تشکر و پرسیدنِ سن
    gloss: 'Inès تشکر می‌کند، بعد یک سؤال آخر می‌پرسد: چند سال دارد؟'
    note: '*Une dernière question* («یک سؤال آخر») تغییر موضوع طبیعی در همان گفت‌وگو را نشان می‌دهد.'
  fr.a1.unit02.lesson06.teach.line08:
    title: گفتنِ سنِ ماتئو
    gloss: Mathieu می‌گوید بیست‌وهشت سال دارد و همین سؤال را از Inès می‌پرسد.
    note: '*J''ai vingt-huit ans* از شکل ترکیبی با خط تیره استفاده می‌کند، همان الگویی که در همین درس دیدید.'
  fr.a1.unit02.lesson06.teach.line09:
    title: گفتنِ سنِ النا
    gloss: Inès می‌گوید سی‌ویک سال دارد.
    note: '*J''ai trente et un ans* به‌جای خط تیره *et* (و) می‌گیرد، چون سی‌ویک یکی از صورت‌های «...ویک» است که در همین واحد یاد گرفتید.'
