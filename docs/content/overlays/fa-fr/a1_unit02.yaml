course:
  title: فرانسه A1
  description: اعداد ۰ تا ۱۰۰ (از جمله شکل‌های soixante-dix، quatre-vingts و quatre-vingt-dix)، سن، شمارهٔ تلفن و مقدار مواد دستور غذا، در ادامهٔ ماجرای اینس و ماتیو در کارگاه آشپزی واحد اول. راهنمای ویژهٔ این واحد بر بیان سن با avoir، ردپای شمارش بیست‌بیست‌ی در اعداد فرانسوی و مطابقت جنس در عبارت‌های مقدار تأکید دارد.
