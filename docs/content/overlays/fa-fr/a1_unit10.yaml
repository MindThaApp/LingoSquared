teaching:
  fr.a1.unit10.lesson01.teach.se_reveiller:
    title: بیدار شدن
    gloss: بیدار شدن
    note: 'فعل انعکاسی: *je me réveille*، *tu te réveilles*. ضمیر *me/te/se* همیشه با فاعل مطابقت دارد.'
    example_gloss: من ساعت هفت بیدار می‌شوم.
  fr.a1.unit10.lesson01.teach.se_lever:
    title: بلند شدن
    gloss: از جا بلند شدن
    note: با *se réveiller* (بیدار شدن از خواب) فرق دارد؛ *se lever* یعنی واقعاً از تخت بلند شدن.
    example_gloss: من بعدش فوراً بلند می‌شوم.
  fr.a1.unit10.lesson01.teach.prendre_une_douche:
    title: دوش گرفتن
    gloss: دوش گرفتن
    note: '*Prendre une douche* (تحت‌اللفظی «گرفتن یک دوش») از فعل *prendre* استفاده می‌کند، همان فعلی که برای وعده‌های غذا و وسایل نقلیه هم به کار می‌رود.'
    example_gloss: من صبح‌ها دوش می‌گیرم.
  fr.a1.unit10.lesson01.teach.shabiller:
    title: لباس پوشیدن
    gloss: لباس پوشیدن
    note: 'یک فعل انعکاسی دیگر: *je m''habille*؛ پیش از صدای مصوت، me به *m''* تبدیل می‌شود.'
    example_gloss: من قبل از صبحانه لباس می‌پوشم.
  fr.a1.unit10.lesson01.teach.le_petit_dejeuner:
    title: صبحانه
    gloss: صبحانه
    note: '*Prendre le petit-déjeuner* (صبحانه خوردن) همان الگوی *prendre* در *prendre une douche* را دارد.'
    example_gloss: من ساعت هشت صبحانه می‌خورم.
  fr.a1.unit10.lesson01.teach.quitter_la_maison:
    title: از خانه بیرون رفتن
    gloss: از خانه بیرون رفتن
    note: '*Quitter* در اینجا یعنی «ترک کردن (یک مکان)»؛ با *partir* اشتباه نشود، چون partir مفعول مستقیم نمی‌گیرد.'
    example_gloss: من ساعت نه از خانه بیرون می‌روم.
  fr.a1.unit10.lesson01.teach.dabord_ensuite:
    title: اول... بعد...
    gloss: اول بلند می‌شوم، بعد لباس می‌پوشم.
    note: '*D''abord* (اول) و *ensuite* (بعد) کلمه‌های پایهٔ ترتیب برای توصیف مرحله‌به‌مرحلهٔ برنامهٔ روزانه هستند.'
  fr.a1.unit10.lesson02.teach.rentrer:
    title: به خانه برگشتن
    gloss: به خانه برگشتن
    note: '*Rentrer* یعنی برگشتن به خانهٔ خود آدم؛ با *retourner* (برگشتن به یک جا، به‌طور کلی) فرق دارد.'
    example_gloss: من بعد از کار به خانه برمی‌گردم.
  fr.a1.unit10.lesson02.teach.diner:
    title: شام خوردن
    gloss: شام خوردن
    note: '*Dîner* می‌تواند فعل باشد (شام خوردن) یا اسم (*le dîner*، شام)؛ از روی جمله می‌فهمید کدام است.'
    example_gloss: ما شنبه‌شب‌ها با هم شام می‌خوریم.
  fr.a1.unit10.lesson02.teach.se_coucher:
    title: به رختخواب رفتن
    gloss: به رختخواب رفتن
    note: پایان طبیعی برنامهٔ روزانه است، در برابر *se lever* که در آغاز می‌آید.
    example_gloss: من حدود ساعت یازده شب می‌خوابم.
  fr.a1.unit10.lesson02.teach.le_weekend:
    title: آخر هفته
    gloss: آخر هفته
    note: '*Le week-end* در فرانسوی یک واژهٔ وام‌گرفته و رایج است که با خط تیره نوشته می‌شود.'
    example_gloss: کارگاه آخر هفته برگزار می‌شود.
  fr.a1.unit10.lesson02.teach.dhabitude:
    title: معمولاً
    gloss: معمولاً
    note: '*D''habitude* برای عادت و برنامهٔ همیشگی به کار می‌رود، در مقابل *aujourd''hui* (امروز) که برای یک رویداد یک‌باره است.'
    example_gloss: من معمولاً ساعت هفت بلند می‌شوم.
  fr.a1.unit10.lesson02.teach.ma_routine_du_samedi:
    title: توصیف یک روز شنبه
    gloss: شنبه‌ها دیر بلند می‌شوم، بعد قبل از کارگاه به بازار می‌روم.
    note: ترتیب‌دهی شبیه *d'abord/ensuite* است (اینجا با *puis* یعنی «بعد») برای توصیف یک روز شنبه.
  fr.a1.unit10.lesson02.teach.quest_ce_que_tu_fais:
    title: چه کار می‌کنی؟
    gloss: شنبه‌ها چه کار می‌کنی؟
    note: '*Qu''est-ce que tu fais... ?* روش معمول و خودمانی برای پرسیدن این است که کسی چه کار می‌کند.'
  fr.a1.unit10.lesson03.teach.line01:
    title: پرسیدن دربارهٔ شنبه
    gloss: اینس از ماتیو می‌پرسد شنبه‌ها قبل از کارگاه چه کار می‌کند.
    note: '*Tu fais quoi... ?* روش طبیعی و خودمانی برای پرسیدن «چه کار می‌کنی؟» است و از *Qu''est-ce que tu fais ?* خودمانی‌تر است.'
  fr.a1.unit10.lesson03.teach.line02:
    title: توصیف بیدار شدن
    gloss: ماتیو می‌گوید اول دیر بیدار می‌شود، حدود ساعت نه.
    note: '*Vers neuf heures* (حدود ساعت نه) دوباره الگوی *vers* + ساعت را برای زمان تقریبی به کار می‌برد.'
  fr.a1.unit10.lesson03.teach.line03:
    title: پرسیدن اینکه بعدش چه می‌شود
    gloss: اینس می‌پرسد بعدش چه می‌شود.
    note: یک سؤال کوتاه و طبیعی برای ادامه دادن توصیف برنامهٔ روزانه.
  fr.a1.unit10.lesson03.teach.line04:
    title: توصیف صبحانه و بازار
    gloss: ماتیو می‌گوید بعدش صبحانه می‌خورد و به بازار می‌رود.
    note: دو کار پشت سر هم که با *et* به هم وصل شده‌اند و ترتیبی را که با *d'abord* شروع شد ادامه می‌دهند.
  fr.a1.unit10.lesson03.teach.line05:
    title: پرسیدن دربارهٔ برگشتن به خانه
    gloss: اینس می‌پرسد ماتیو ساعت چند برمی‌گردد.
    note: '*Tu rentres à quelle heure ?* فعل *rentrer* همین درس را در یک سؤال مستقیم به کار می‌برد.'
  fr.a1.unit10.lesson03.teach.line06:
    title: توصیف بعدازظهر
    gloss: ماتیو می‌گوید حدود ظهر برمی‌گردد و بعدازظهر قبل از کارگاه شب استراحت می‌کند.
    note: '*Se reposer* (استراحت کردن) یک فعل انعکاسی دیگر است: *je me repose*.'
