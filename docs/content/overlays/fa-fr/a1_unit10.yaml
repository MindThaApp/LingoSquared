course:
  title: فرانسه A1
  description: 'توصیف یک برنامهٔ روزانهٔ ساده با فعل‌های انعکاسی (se réveiller، se lever، se coucher) و کلمه‌های ترتیب (d''abord، ensuite)؛ ادامهٔ روایت کارگاه آشپزی اینس و ماتیو، آنجا که اینس دربارهٔ شنبهٔ ماتیو سؤال می‌کند. نکتهٔ مهم: در فرانسوی فعل‌های انعکاسی همیشه ضمیر انعکاسی می‌گیرند (je ME réveille)، در حالی که در فارسی چنین ضمیر جداگانه‌ای پیش از فعل نمی‌آید.'
