course:
  title: فرانسه A1
  description: بخش‌های روز و گفتن ساعت (heure(s)، et quart، et demie، moins le quart)، در ادامهٔ داستان کارگاه آشپزی اینس و ماتیو و برنامه‌ریزی جلسهٔ بعدی‌شان. در فرانسه در موقعیت‌های رسمی و برنامه‌ریزی از ساعت ۲۴ ساعته استفاده می‌شود (dix-huit heures trente)، در کنار شکل‌های غیررسمی ۱۲ ساعته‌ای که قبل‌تر در این درس یاد گرفتید.
