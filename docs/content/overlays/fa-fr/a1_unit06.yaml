teaching:
  fr.a1.unit06.lesson01.teach.heure:
    title: ساعت؛ زمان
    gloss: ساعت؛ زمان
    note: '*Heure* مؤنث است؛ برای گفتن ساعت هم به کار می‌رود (*dix heures* = ساعت ده).'
    example_gloss: ساعت چند است؟
  fr.a1.unit06.lesson01.teach.matin:
    title: صبح
    gloss: صبح
    note: '*Matin* مذکر است.'
    example_gloss: بازار صبح‌ها باز است.
  fr.a1.unit06.lesson01.teach.apres_midi:
    title: بعدازظهر
    gloss: بعدازظهر
    note: '*Après-midi* می‌تواند مذکر یا مؤنث باشد (مذکر رایج‌تر است)؛ *l''* قبل از صدای واکه حذف‌شدگی دارد.'
    example_gloss: من بعدازظهرها کار می‌کنم.
  fr.a1.unit06.lesson01.teach.soir:
    title: عصر؛ شب
    gloss: عصر؛ شب
    note: '*Soir* مذکر است.'
    example_gloss: کارگاه آشپزی عصر است.
  fr.a1.unit06.lesson01.teach.midi:
    title: ظهر
    gloss: ظهر
    note: '*Midi* وقتی برای گفتن زمان به کار می‌رود حرف تعریف نمی‌گیرد (*à midi*، نه *au midi*).'
    example_gloss: ما ظهر ناهار می‌خوریم.
  fr.a1.unit06.lesson01.teach.minuit:
    title: نیمه‌شب
    gloss: نیمه‌شب
    note: '*Minuit* هم مثل *midi* حرف تعریف نمی‌گیرد.'
    example_gloss: کارگاه هیچ‌وقت از نیمه‌شب بیشتر طول نمی‌کشد.
  fr.a1.unit06.lesson01.teach.latelier_commence_le_soir:
    title: گفتن زمان کارگاه
    gloss: کارگاه عصر شروع می‌شود، نه صبح.
    note: '*le soir* و *le matin* را مستقیم رو‌به‌روی هم می‌گذارد و از دو اسم همین درس استفاده می‌کند.'
  fr.a1.unit06.lesson02.teach.quelle_heure_est_il:
    title: پرسیدن ساعت
    gloss: ساعت چند است؟
    note: '*Quelle heure est-il ?* روش استاندارد و همه‌کاره برای پرسیدن ساعت است؛ *-il* برای پرسشی شدن جمله بعد از فعل می‌آید.'
  fr.a1.unit06.lesson02.teach.il_est_dix_heures:
    title: گفتن ساعت
    gloss: ساعت ده است.
    note: '*Il est* + عدد + *heures* الگوی پایه برای گفتن هر ساعت است؛ *heures* جمع می‌ماند، به‌جز *une heure* (ساعت یک).'
  fr.a1.unit06.lesson02.teach.et_quart:
    title: گفتن «و ربع»
    gloss: ده و ربع است.
    note: '*Et quart* (و یک ربع) پانزده دقیقه به ساعت اضافه می‌کند.'
  fr.a1.unit06.lesson02.teach.et_demie:
    title: گفتن «و نیم»
    gloss: ده و نیم است.
    note: '*Et demie* (و نیم) سی دقیقه اضافه می‌کند؛ *demie* با *heure* مطابقت می‌کند و -e مؤنث می‌گیرد.'
  fr.a1.unit06.lesson02.teach.moins_le_quart:
    title: گفتن «یک ربع به»
    gloss: یک ربع به یازده است.
    note: '*Moins le quart* (منهای ربع) از ساعت بعدی به عقب می‌شمارد، نه از ساعت فعلی؛ در فارسی هم «یک ربع به یازده» همین‌طور است، پس حواستان باشد ساعت بعدی را بگویید.'
  fr.a1.unit06.lesson02.teach.a_quelle_heure:
    title: پرسیدن ساعت شروع
    gloss: کارگاه ساعت چند شروع می‌شود؟
    note: '*À quelle heure ?* (ساعت چند) برای پرسیدن دربارهٔ رویدادی برنامه‌ریزی‌شده به کار می‌رود و با *Quelle heure est-il ?* که برای پرسیدن ساعت فعلی است فرق دارد.'
  fr.a1.unit06.lesson03.teach.line01:
    title: پرسیدن ساعت شروع هفتهٔ بعد
    gloss: اینس می‌پرسد کارگاه هفتهٔ بعد ساعت چند است.
    note: '*La semaine prochaine* (هفتهٔ بعد) با الگوی پرسش *à quelle heure* در این درس ترکیب می‌شود.'
  fr.a1.unit06.lesson03.teach.line02:
    title: گفتن ساعت شروع
    gloss: ماتیو می‌گوید فکر می‌کند ساعت هجده و سی (۶:۳۰ بعدازظهر) شروع می‌شود.
    note: '*Dix-huit heures trente* از ساعت ۲۴ ساعته استفاده می‌کند که در برنامه‌ریزی‌های فرانسوی رایج است و با شکل‌های غیررسمی مثل *et demie* فرق دارد.'
  fr.a1.unit06.lesson03.teach.line03:
    title: تأیید اینکه عصر است
    gloss: 'اینس مطمئن می‌شود: عصر، نه صبح؟'
    note: یک پرسش کوتاه برای تأیید که *le soir* و *le matin* را مقابل هم می‌گذارد.
  fr.a1.unit06.lesson03.teach.line04:
    title: تأیید و توضیح دلیل
    gloss: ماتیو تأیید می‌کند که عصر است و بعد از کار راحت‌تر است.
    note: '*Après le travail* (بعد از کار) یک دلیل ساده و کاربردی می‌دهد.'
  fr.a1.unit06.lesson03.teach.line05:
    title: پرسیدن ساعت پایان
    gloss: اینس می‌پرسد ساعت چند تمام می‌شود.
    note: '*Finit* (تمام می‌شود) در مقابل *commence* (شروع می‌شود) در جملهٔ دوم قرار دارد.'
  fr.a1.unit06.lesson03.teach.line06:
    title: گفتن ساعت پایان
    gloss: ماتیو می‌گوید حدود بیست و پانزده (۸:۱۵ شب)، مثل همیشه.
    note: '*Vers* (حدود) زمان تقریبی را نشان می‌دهد و از *à* که زمان دقیق است ملایم‌تر است.'
  fr.a1.unit06.lesson03.teach.line07:
    title: تأیید برنامه
    gloss: 'اینس تأیید می‌کند: هفتهٔ بعد ساعت هجده و سی می‌بینمتان!'
    note: گفتگو با تکرار ساعت تأییدشده تمام می‌شود، روشی طبیعی برای قطعی کردن یک قرار در فرانسه.
