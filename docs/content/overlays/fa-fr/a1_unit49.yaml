teaching:
  fr.a1.unit49.lesson01.teach.content_triste_en:
    title: خوشحال، ناراحت و عصبانی
    gloss: خوشحال، ناراحت، عصبانی
    note: سه کلمه‌ی پایه برای احساسات که با *être* (بودن) به کار می‌روند؛ *content* مؤنث *contente* دارد، ولی *triste* و *en colère* تغییر نمی‌کنند.
    example_gloss:
    - من خوشحالم.
    - غمگینم.
    - من عصبانی هستم.
  fr.a1.unit49.lesson01.teach.je_suis_content:
    title: گفتن اینکه خوشحالید
    gloss: من خوشحالم.
    note: الگوی پایه، *Être* (بودن) + صفتِ احساس است، درست مثل فارسی که می‌گوییم «من ... هستم».
  fr.a1.unit49.lesson01.teach.je_ne_suis:
    title: مقایسه‌ی احساسات
    gloss: من عصبانی نیستم، ناراحتم.
    note: '*Ne ... pas* دور فعل قرار می‌گیرد؛ جمله‌ی بعدی احساس واقعی را می‌گوید.'
  fr.a1.unit49.lesson02.teach.pourquoi_es_tu:
    title: پرسیدن دلیل
    gloss: چرا خوشحالی؟
    note: '*Pourquoi* (چرا) کلمه‌ی پرسشیِ معمول برای پرسیدن دلیل است.'
  fr.a1.unit49.lesson02.teach.je_suis_content:
    title: گفتن دلیل
    gloss: من خوشحالم چون آپارتمان جدیدی دارم.
    note: '*Parce que* (چون) جمله‌ی دلیل را شروع می‌کند؛ قبل از *il* به *parce qu''* کوتاه می‌شود.'
  fr.a1.unit49.lesson02.teach.je_suis_triste:
    title: یک دلیل منفی
    gloss: من ناراحتم چون دارد باران می‌آید.
    note: '*il pleut* (باران می‌آید) از درس هوا دوباره به عنوان جمله‌ی دلیل آمده است.'
  fr.a1.unit49.lesson03.teach.nerveux:
    title: مضطرب
    gloss: مضطرب
    note: کلمه‌ی معمول برای استرس و دلهره.
    example_gloss: از اولین شیفت کاری‌ام استرس دارم.
  fr.a1.unit49.lesson03.teach.je_suis_nerveux:
    title: گفتن اینکه برای چه چیزی دلشوره دارید
    gloss: از اولین شیفت کاری‌ام استرس دارم.
    note: '*Avant* (در اصل «قبل از») نشان می‌دهد دلشوره بابت چه چیزی است؛ در فارسی برای این کار معمولاً «برای» یا «بابت» می‌گوییم.'
  fr.a1.unit49.lesson03.teach.ne_t_inquiete:
    title: دلداری دادن به کسی
    gloss: نگران نباش.
    note: '*Ne t''inquiète pas* (در اصل «خودت را نگران نکن») عبارت ثابت و رایج برای دلداری است؛ *s''inquiéter* فعل انعکاسی است.'
  fr.a1.unit49.lesson04.teach.comment_se_sent:
    title: پرسیدن حال کسی
    gloss: Mathieu چه حسی دارد؟
    note: '*Se sentir* (حس کردن، فعل انعکاسی) روش معمول برای پرسیدن یا توصیف حالت روحی است؛ در درس سلامت هم آمده است.'
  fr.a1.unit49.lesson04.teach.il_se_sent:
    title: توصیف حال کسی
    gloss: او استرس دارد.
    note: '*Se* ضمیر انعکاسی سوم‌شخص است و همراه *sent* می‌آید.'
  fr.a1.unit49.lesson04.teach.pourquoi_se_sent:
    title: پرسیدن دلیل حال کسی
    gloss: چرا استرس دارد؟
    note: '*pourquoi* با *se sentir* از جمله‌ی *Il se sent nerveux* ترکیب شده است؛ *sent-il* با خط تیره نوشته می‌شود.'
  fr.a1.unit49.lesson05.teach.salut_camille_je:
    title: خواندن یک پیام درباره‌ی احساسات
    gloss: سلام کامی، من برای اولین شیفت تنهایی‌ام یک کم دلشوره دارم. ولی خوشحال هم هستم، چون یک شغل جدید و یک آپارتمان جدید دارم. فکر می‌کنم همه‌چیز درست می‌شود.
    note: دقت کنید نویسنده برای چه چیزی دلشوره دارد، چه چیزی او را خوشحال می‌کند و دید کلی‌اش چیست.
    glosses:
      peu: یک کم
      nerveux: مضطرب
      premier: اولین
      service: شیفت
      seul: تنها
      content: خوشحال
      car: چون
      nouveau: جدید
      travail: شغل
      nouvel: جدید
      appartement: آپارتمان
      pense: فکر کردن
      aller: 'درست می‌شود (اینجا: همه‌چیز درست می‌شود)'
  fr.a1.unit49.lesson06.teach.camille_salut_mathieu:
    title: کامی از ماتیو می‌پرسد چه حسی دارد
    gloss: 'کامی: سلام ماتیو، قبل از اولین شیفتت چه حسی داری؟'
    note: '*Avant ton premier service* (قبل از اولین شیفتت) همان الگوی *avant* + اسم از درس ۳ است.'
  fr.a1.unit49.lesson06.teach.mathieu_je_suis:
    title: ماتیو اعتراف می‌کند دلشوره دارد
    gloss: 'ماتیو: راستش یک کم دلشوره دارم.'
    note: '*Honnêtement* (راستش) اعترافِ او را نرم‌تر می‌کند.'
  fr.a1.unit49.lesson06.teach.camille_ne_t:
    title: کامی به او دلداری می‌دهد
    gloss: 'کامی: نگران نباش، از پسش برمی‌آیی!'
    note: '*Tu vas y arriver* (در اصل «به آنجا می‌رسی») عبارت ثابتِ دلگرم‌کننده است؛ *aller* + مصدر آینده‌ی نزدیک را می‌سازد.'
  fr.a1.unit49.lesson06.teach.mathieu_merci_ca:
    title: ماتیو از او تشکر می‌کند
    gloss: 'ماتیو: مرسی، واقعاً کمک می‌کند.'
    note: '*Aide* شکل *il/elle* فعل *aider* (کمک کردن) است؛ *m''* همان *me* است.'
  fr.a1.unit49.lesson06.teach.camille_et_apres:
    title: کامی نتیجه را پیش‌بینی می‌کند
    gloss: 'کامی: و بعدش حتماً خیلی خوشحال و سربلند می‌شوی.'
    note: '*Sûrement* (حتماً) پیش‌بینیِ مطمئن را بیان می‌کند؛ *fier* (سربلند، مغرور به خود) صفتی جدید و مفید است.'
  fr.a1.unit49.lesson06.teach.mathieu_oui_je:
    title: ماتیو موافقت می‌کند
    gloss: 'ماتیو: آره، من هم همین‌طور فکر می‌کنم.'
    note: '*Je pense aussi* روش طبیعی برای موافقت با نظر کسی است.'
  fr.a1.unit49.lesson06.teach.il_remplace_mathieu:
    title: خلاصه کردن با il، elle و l'
    gloss: ماتیو بابت اولین شیفتش دلشوره دارد. کامی به او کمک می‌کند.
    note: '*Il* جای نام یک مرد می‌نشیند (*il est nerveux*)، *elle* جای نام یک زن، و *l''* (*elle l''aide*) یعنی «او را»: سه کلمه‌ی کوچک ولی ضروری برای صحبت درباره‌ی دیگران.'
