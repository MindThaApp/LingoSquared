course:
  title: فرانسه A1
  description: مکان‌های رایج محله و پرسیدن و دادن نشانیِ ساده (en face de, à côté de, près de, loin de)، در ادامهٔ جست‌وجوی ماتیو برای یک داروخانه نزدیک کارگاه. این عبارت‌های مکانی همگی با de تمام می‌شوند و de پیش از اسم مذکر یا جمع به du/des تبدیل می‌شود (du café, des arbres).
