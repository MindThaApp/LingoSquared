teaching:
  fr.a1.unit07.lesson01.teach.gare:
    title: ایستگاه قطار
    gloss: ایستگاه قطار
    note: '*Gare* مؤنث است.'
    example_gloss: ایستگاه قطار بزرگ است.
  fr.a1.unit07.lesson01.teach.pharmacie:
    title: داروخانه
    gloss: داروخانه
    note: '*Pharmacie* مؤنث است.'
    example_gloss: داروخانه ساعت نه باز می‌شه.
  fr.a1.unit07.lesson01.teach.banque:
    title: بانک
    gloss: بانک
    note: '*Banque* مؤنث است.'
    example_gloss: بانک یکشنبه‌ها بسته است.
  fr.a1.unit07.lesson01.teach.ecole:
    title: مدرسه
    gloss: مدرسه
    note: '*École* مؤنث است؛ پیش از صدای مصوت آن، حرف تعریف به *l''* تبدیل می‌شود.'
    example_gloss: مدرسه کنار پارک است.
  fr.a1.unit07.lesson01.teach.cafe:
    title: کافه
    gloss: کافه
    note: '*Café* مذکر است؛ در موقعیت‌های دیگر به معنی «قهوه» هم هست.'
    example_gloss: کافه تمام روز باز است.
  fr.a1.unit07.lesson01.teach.poste:
    title: اداره پست
    gloss: اداره پست
    note: '*Poste* (مؤنث) در اینجا یعنی «اداره پست»؛ *le poste* (مذکر، با معنی دیگر) می‌تواند به معنی «سمت یا شغل» باشد. یعنی جنسیت دستوری معنی را عوض می‌کند.'
    example_gloss: اداره پست ساعت شش تعطیل می‌شود.
  fr.a1.unit07.lesson01.teach.la_gare_est_grande:
    title: مقایسهٔ دو مکان
    gloss: ایستگاه قطار بزرگ است و داروخانه کوچک.
    note: '*Grande* و *petite* هر دو با اسم‌های مؤنث (*la gare*، *la pharmacie*) هماهنگ شده‌اند.'
  fr.a1.unit07.lesson02.teach.ou_est_la_gare:
    title: پرسیدن جای یک مکان
    gloss: ایستگاه قطار کجاست، لطفاً؟
    note: '*Où est... ?* روش استاندارد و همه‌کاره برای پرسیدن جای یک مکان است.'
  fr.a1.unit07.lesson02.teach.en_face_de:
    title: گفتن «روبه‌روی»
    gloss: بانک روبه‌روی ایستگاه قطار است.
    note: '*En face de* (روبه‌روی) با *de* تمام می‌شود و بعد از آن مکان مرجع می‌آید: *en face de la banque*. پیش از اسم مذکر ترکیب می‌شود: *en face du café*.'
  fr.a1.unit07.lesson02.teach.a_cote_de:
    title: گفتن «کنارِ»
    gloss: داروخانه کنار بانک است.
    note: '*À côté de* (کنارِ) هم مثل *en face de* با *de* به اسم بعدی وصل می‌شود.'
  fr.a1.unit07.lesson02.teach.pres_de:
    title: گفتن «نزدیک»
    gloss: مدرسه نزدیک اینجاست.
    note: '*Près de* (نزدیکِ) پیش از صدای مصوت به *près d''* تبدیل می‌شود، مثل *près d''ici* (نزدیک اینجا).'
  fr.a1.unit07.lesson02.teach.loin_de:
    title: گفتن «دور»
    gloss: اداره پست از اینجا دور است.
    note: '*Loin de* (دور از) درست عکس *près de* است.'
  fr.a1.unit07.lesson02.teach.cest_loin:
    title: پرسیدن اینکه جایی دور است یا نه
    gloss: از اینجا دور است؟ — نه، دور نیست.
    note: '*C''est loin d''ici ?* سؤال طبیعی بعد از گرفتن نشانی است. برای منفی کردن، *ne... pas* را دور فعل بگذارید: *ce n''est pas loin* (دور نیست).'
  fr.a1.unit07.lesson03.teach.line01:
    title: پرسیدن نشانی از یک غریبه
    gloss: ماتیو مؤدبانه از یک رهگذر می‌پرسد داروخانه کجاست.
    note: '*Excusez-moi* (ببخشید) روش مؤدبانهٔ معمول برای شروع صحبت با یک غریبه است و با *vous* همراه می‌شود.'
  fr.a1.unit07.lesson03.teach.line02:
    title: گفتن مکان
    gloss: او می‌گوید روبه‌روی بانک و کنار کافه است.
    note: '*en face de* و *à côté de* در یک جمله ترکیب شده‌اند تا مکان دقیق گفته شود. *De* + *le café* می‌شود *du café*.'
  fr.a1.unit07.lesson03.teach.line03:
    title: پرسیدن دور بودن
    gloss: ماتیو می‌پرسد از اینجا دور است یا نه.
    note: همان *C'est loin d'ici ?* که برای پرسیدن فاصله یاد گرفتید.
  fr.a1.unit07.lesson03.teach.line04:
    title: اطمینان دادن که نزدیک است
    gloss: او می‌گوید نه، خیلی نزدیک است؛ پنج دقیقه پیاده.
    note: '*À pied* (پیاده) روش معمول برای گفتن راه رفتن به‌عنوان وسیلهٔ رفت‌وآمد است.'
  fr.a1.unit07.lesson03.teach.line05:
    title: تشکر کردن
    gloss: ماتیو با گرمی از او تشکر می‌کند.
    note: '*Merci beaucoup* شکل پرتأکیدتر *merci* است که از درس‌های قبل می‌شناسید.'
  fr.a1.unit07.lesson03.teach.line06:
    title: جواب تشکر
    gloss: 'او جواب می‌دهد: خواهش می‌کنم.'
    note: '*Je vous en prie* «خواهش می‌کنم» رسمی‌تری است و با لحن *vous* که با غریبه‌ها به کار می‌رود جور است؛ *De rien* گزینهٔ غیررسمی‌تر و روزمره است.'
