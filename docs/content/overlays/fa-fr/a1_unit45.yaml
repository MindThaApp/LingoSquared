teaching:
  fr.a1.unit45.lesson01.teach.tu_fais_quoi:
    title: پرسیدن درباره‌ی شغل کسی
    gloss: شغلتان چیست؟
    note: راهی استاندارد و دوستانه برای پرسیدن شغل کسی.
  fr.a1.unit45.lesson01.teach.le_metier_cuisinier:
    title: شغل / آشپز
    gloss: شغل؛ آشپز
    note: '*Métier* (شغل) مذکر است: *le métier*. *Cuisinier* برای زنان تغییر می‌کند: *un cuisinier*، *une cuisinière*.'
    example_gloss:
    - شغلت چیه؟
    - من آشپز هستم.
  fr.a1.unit45.lesson01.teach.je_travaille_comme:
    title: گفتن اینکه آشپز هستید
    gloss: من آشپز هستم.
    note: '*Travailler comme* + شغل الگوی استاندارد برای گفتن شغل است و قبل از اسم شغل حرف تعریف نمی‌آید.'
  fr.a1.unit45.lesson01.teach.infirmiere:
    title: پرستار
    gloss: پرستار
    note: اصطلاح امروزی و بی‌جنسیت برای این حرفه که برای هر جنسی به کار می‌رود.
    example_gloss: من پرستار هستم.
  fr.a1.unit45.lesson01.teach.je_travaille_comme_2:
    title: گفتن اینکه پرستار هستید
    gloss: من پرستار هستم.
    note: از همان الگوی *travailler comme* مثل *cuisinier* پیروی می‌کند؛ شکل مؤنث آن *infirmière* است.
  fr.a1.unit45.lesson02.teach.ou_travailles_tu:
    title: پرسیدن درباره‌ی محل کار
    gloss: کجا کار می‌کنید؟
    note: پرسش بعدیِ مستقیم برای *Tu fais quoi dans la vie ?*
  fr.a1.unit45.lesson02.teach.je_travaille_dans:
    title: کار در رستوران
    gloss: من در یک رستوران کار می‌کنم.
    note: '*Un restaurant* اینجا حرف تعریف نکره می‌گیرد، چون یکی از چند رستوران است.'
  fr.a1.unit45.lesson02.teach.l_hopital:
    title: بیمارستان
    gloss: بیمارستان (معرفه)
    note: '*Hôpital* مذکر است و با صدای مصوت شروع می‌شود: *l''hôpital*.'
    example_gloss: من در بیمارستان کار می‌کنم.
  fr.a1.unit45.lesson02.teach.je_travaille_a:
    title: کار در بیمارستان
    gloss: من در بیمارستان کار می‌کنم.
    note: '*À l''hôpital* حرف تعریف معرفه می‌گیرد، چون مکانی مشخص و شناخته‌شده است؛ *le* قبل از صدای مصوت به *l''* تبدیل می‌شود.'
  fr.a1.unit45.lesson02.teach.certaines_personnes_travaillent:
    title: کار در دفتر
    gloss: برخی افراد در یک دفتر کار می‌کنند.
    note: '*Dans un bureau* (در یک دفتر) مثل *dans un restaurant* حرف تعریف می‌گیرد.'
  fr.a1.unit45.lesson03.teach.je_commence_a:
    title: ساعت شروع
    gloss: من ساعت نه شروع می‌کنم.
    note: '*Commence* صورت *je* از فعل *commencer* (شروع کردن) است؛ *à neuf heures* ساعت را نشان می‌دهد.'
  fr.a1.unit45.lesson03.teach.je_travaille_du:
    title: روزهای کار
    gloss: من از دوشنبه تا جمعه کار می‌کنم.
    note: '*Du lundi au vendredi* یعنی از دوشنبه تا جمعه؛ *du* همان *de* + *le* و *au* همان *à* + *le* است.'
  fr.a1.unit45.lesson03.teach.la_pause:
    title: استراحت
    gloss: استراحت
    note: '*Pause* مؤنث است: *la pause*.'
    example_gloss: ساعت دوازده یک استراحت دارم.
  fr.a1.unit45.lesson03.teach.j_ai_une:
    title: استراحت داشتن
    gloss: ساعت دوازده یک استراحت دارم.
    note: '*Avoir une pause* (استراحت داشتن) الگوی ثابت و طبیعی برای این مفهوم است.'
  fr.a1.unit45.lesson03.teach.je_finis_a:
    title: ساعت پایان
    gloss: من ساعت پنج تمام می‌کنم.
    note: '*Finis* صورت *je* از فعل *finir* (تمام کردن) است.'
  fr.a1.unit45.lesson03.teach.je_commence_a_2:
    title: یک روز کاری کامل
    gloss: من ساعت نه شروع می‌کنم و ساعت پنج تمام می‌کنم.
    note: '*je commence* و *je finis* با *et* در یک جمله می‌آیند تا یک روز کاری کامل را توصیف کنند.'
  fr.a1.unit45.lesson04.teach.avec_il_ou:
    title: پایان فعل‌ها با il و elle
    gloss: 'با «او» (مذکر یا مؤنث)، فعل‌های باقاعده‌ی -er همان شکل «من» را دارند: من کار می‌کنم، او کار می‌کند.'
    note: '*Travaille* برای *je*، *il* و *elle* یکسان است: فعل‌های باقاعده‌ی *-er* در سوم شخص مفرد چیزی اضافه نمی‌کنند.'
  fr.a1.unit45.lesson04.teach.camille_travaille_comme:
    title: شغل کامیل
    gloss: کامیل پرستار است.
    note: '*Travaille* با *je*، *il* و *elle* می‌آید: پایانش بی‌صدا است، برای همین این سه صورت یک‌جور تلفظ می‌شوند.'
  fr.a1.unit45.lesson04.teach.mathieu_travaille_comme:
    title: شغل ماتیو
    gloss: ماتیو آشپز است.
    note: پایان فعل همان است که در *Camille travaille comme infirmière* بود.
  fr.a1.unit45.lesson04.teach.elle_travaille_a:
    title: استفاده از ضمیر
    gloss: او در بیمارستان کار می‌کند. او در یک رستوران کار می‌کند.
    note: '*Elle* و *il* جای نام‌های کامیل و ماتیو می‌نشینند، ولی صورت فعل همان می‌ماند.'
  fr.a1.unit45.lesson05.teach.camille_travaille_comme:
    title: خواندن دو معرفی شغلی
    gloss: کامیل در بیمارستان پرستار است. او ساعت هفت شروع می‌کند و از دوشنبه تا جمعه کار می‌کند. ماتیو در یک رستوران آشپز است. او ساعت یازده شروع می‌کند و ساعت چهار استراحت دارد.
    note: شغل، محل کار و برنامه‌ی هر نفر را جداگانه دنبال کنید.
    glosses:
      travaille: کار می‌کند
      infirmière: پرستار
      l'hôpital: بیمارستان
      commence: شروع می‌شه
      sept: هفت
      lundi: دوشنبه
      vendredi: جمعه
      cuisinier: آشپز / سرآشپز
      restaurant: رستوران
      onze: یازده
      pause: استراحت
  fr.a1.unit45.lesson06.teach.camille_salut_mathieu:
    title: کامیل درباره‌ی کار می‌پرسد
    gloss: 'کامیل: سلام ماتیو! کنجکاوم، راستی کارت چیه؟'
    note: '*Au fait* (راستی) سؤال را دوستانه‌تر می‌کند و حالت بازجویی ندارد.'
  fr.a1.unit45.lesson06.teach.mathieu_je_travaille:
    title: ماتیو جواب می‌دهد
    gloss: 'ماتیو: من در یک رستوران آشپزم. تو چی؟'
    note: '*Et toi ?* راه معمول برگرداندن سؤال به طرف مقابل است.'
  fr.a1.unit45.lesson06.teach.camille_je_travaille:
    title: کامیل جواب می‌دهد
    gloss: 'کامیل: من در بیمارستان پرستارم.'
    note: با شغل و محل کاری که قبلاً در درس‌های قبل آمد هماهنگ است.
  fr.a1.unit45.lesson06.teach.mathieu_tu_fais:
    title: ماتیو درباره‌ی ساعت کار می‌پرسد
    gloss: 'ماتیو: ساعت کاریت چطوریه؟'
    note: '*Tu fais quels horaires ?* راه طبیعی برای پرسیدن از برنامه‌ی کاری کسی است؛ *quels* با *horaires* که جمع است هماهنگ می‌شود.'
  fr.a1.unit45.lesson06.teach.camille_je_commence:
    title: کامیل ساعت کارش را می‌گوید
    gloss: 'کامیل: ساعت هفت شروع می‌کنم و از دوشنبه تا جمعه کار می‌کنم.'
    note: با برنامه‌ای که قبلاً در متن خواندنی آمد هماهنگ است.
  fr.a1.unit45.lesson06.teach.mathieu_c_est:
    title: واکنش ماتیو
    gloss: 'ماتیو: چه زود! من دیرتر شروع می‌کنم، ساعت یازده.'
    note: با ساعت شروع ماتیو که قبلاً آمد هماهنگ است.
  fr.a1.unit45.lesson06.teach.camille_chaque_metier:
    title: کامیل بحث را تمام می‌کند
    gloss: 'کامیل: فکر کنم هر شغلی ریتم خودش را دارد.'
    note: یک جمله‌ی پایانی طبیعی و تأملی است؛ کافی است معنایش را بفهمید و لازم نیست دقیقاً آن را تکرار کنید.
