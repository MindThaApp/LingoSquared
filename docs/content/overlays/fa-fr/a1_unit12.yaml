course:
  title: فرانسه A1
  description: 'گزارش کوتاه یک اتفاق اخیر که تمام شده، با گذشتهٔ نقلی (passé composé) و هر دو فعل کمکی avoir و être. ادامهٔ ماجرای کارگاه آشپزی اینس و ماتیو است که ماتیو از یک اتفاق ناخوشایند جلسهٔ شنبهٔ گذشته تعریف می‌کند. در فرانسه دو فعل کمکی مختلف داریم: avoir برای بیشتر فعل‌ها و être برای تعداد کمی از فعل‌ها مثل aller، arriver و rester. در فارسی فعل کمکی‌ای که بسته به فعل عوض شود نداریم. همچنین صفت مفعولی فعل‌هایی که با être می‌آیند با جنس فاعل مطابقت می‌کند (arrivé / arrivée).'
units:
  fr.a1.unit12.past_events:
    title: چه اتفاقی افتاد؟
