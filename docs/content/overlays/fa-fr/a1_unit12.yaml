  fr.a1.unit12.lesson03.dialogue_atelier_dernier:
    title: کارگاه شنبهٔ گذشته
teaching:
  fr.a1.unit12.lesson01.teach.jai_prepare:
    title: آماده کردم
    gloss: آماده کردم / درست کردم
    note: 'فعل‌های باقاعدهٔ -ER صفت مفعولی گذشتهٔ نقلی را با پایانهٔ *-é* می‌سازند: *préparer* ← *préparé*، همراه با *avoir*.'
    example_gloss: برای کارگاه یک کیک درست کردم.
  fr.a1.unit12.lesson01.teach.jai_achete:
    title: خریدم
    gloss: خریدم
    note: '*Acheter* هم مثل *préparer* از الگوی *avoir* + *-é* پیروی می‌کند.'
    example_gloss: از بازار سبزی خریدم.
  fr.a1.unit12.lesson01.teach.jai_oublie:
    title: فراموش کردم
    gloss: فراموش کردم
    note: '*Oublier* ← *oublié*، باز هم همان الگوی باقاعده.'
    example_gloss: کره را خانه جا گذاشتم!
  fr.a1.unit12.lesson01.teach.tu_as_aime:
    title: خوشت آمد
    gloss: خوشت آمد
    note: '*Tu as* + صفت مفعولی، صورت *tu* از همان ساختار *avoir* است.'
    example_gloss: از کیک خوشتان آمد؟
  fr.a1.unit12.lesson01.teach.il_a_goute:
    title: او چشید
    gloss: او چشید
    note: '*Il a* + صفت مفعولی، صورت *il* است؛ فعل کمکی *avoir* با فاعل عوض می‌شود ولی صفت مفعولی ثابت می‌ماند.'
    example_gloss: ماتیو سس را چشید.
  fr.a1.unit12.lesson01.teach.grammar_avoir_participe:
    title: Avoir + صفت مفعولی
    gloss: avoir + صفت مفعولی (-é)
    note: بیشتر فعل‌های فرانسوی گذشتهٔ نقلی را با فعل کمکی *avoir* می‌سازند و صفت مفعولی فعل‌های باقاعدهٔ -ER به *-é* ختم می‌شود.
  fr.a1.unit12.lesson01.teach.la_semaine_derniere:
    title: هفتهٔ پیش
    gloss: هفتهٔ پیش
    note: '*Dernière* (گذشته) با *semaine* که مؤنث است مطابقت می‌کند؛ شکل مذکر آن *dernier* است، مثل *samedi dernier* (شنبهٔ گذشته).'
    example_gloss: هفتهٔ پیش یک کیک درست کردم.
  fr.a1.unit12.lesson02.teach.je_suis_arrive:
    title: رسیدم
    gloss: رسیدم
    note: '*Arriver* یکی از معدود فعل‌هایی است (بیشتر فعل‌های حرکتی) که به‌جای *avoir* با *être* می‌آیند.'
    example_gloss: دیر به کارگاه رسیدم.
  fr.a1.unit12.lesson02.teach.je_suis_alle:
    title: رفتم
    gloss: رفتم
    note: '*Aller* هم با *être* می‌آید. صفت مفعولی با فاعل مطابقت می‌کند: *allé* (مذکر) یا *allée* (مؤنث، مثل حرف اینس).'
    example_gloss: قبل از کارگاه به بازار رفتم.
  fr.a1.unit12.lesson02.teach.il_est_reste:
    title: او ماند
    gloss: او ماند
    note: '*Rester* (ماندن) فعل دیگری است که با *être* می‌آید و همان قاعدهٔ مطابقت را دارد.'
    example_gloss: ماتیو ماند تا آشپزخانه را تمیز کند.
  fr.a1.unit12.lesson02.teach.grammar_etre_accord:
    title: Être + مطابقت صفت مفعولی
    gloss: être + صفت مفعولی (مطابق با فاعل)
    note: در فعل‌هایی که با *être* می‌آیند، صفت مفعولی از نظر جنس و شمار با فاعل مطابقت می‌کند؛ برخلاف فعل‌هایی که با *avoir* می‌آیند.
  fr.a1.unit12.lesson02.teach.en_retard:
    title: دیر
    gloss: دیر
    note: '*En retard* یعنی بعد از زمان مقرر رسیدن؛ همراه همیشگی *arriver*.'
    example_gloss: اتوبوس دیر رسید.
  fr.a1.unit12.lesson02.teach.finalement:
    title: سرانجام / در نهایت
    gloss: سرانجام / در نهایت
    note: '*Finalement* یک ماجرای کوتاه را جمع‌بندی می‌کند و نتیجهٔ نهایی را بعد از مشکلات قبلی نشان می‌دهد.'
    example_gloss: در نهایت کیک خیلی خوشمزه شد.
  fr.a1.unit12.lesson02.teach.quest_ce_qui_sest_passe:
    title: چه اتفاقی افتاد؟
    gloss: چه اتفاقی افتاد؟
    note: '*Qu''est-ce qui s''est passé ?* روش معمول پرسیدن «چه اتفاقی افتاد؟» است.'
    example_gloss: در کارگاه چه اتفاقی افتاد؟
  fr.a1.unit12.lesson03.teach.line01:
    title: پرسیدن از ماجرا
    gloss: اینس می‌پرسد در کارگاه شنبهٔ گذشته چه اتفاقی افتاد؛ او نتوانسته بود بیاید.
    note: '*Qu''est-ce qui s''est passé ?* (چه اتفاقی افتاد؟) روش معمول پرسیدن دربارهٔ یک اتفاق گذشته است.'
  fr.a1.unit12.lesson03.teach.line02:
    title: تعریف کردن اتفاق ناخوشایند
    gloss: ماتیو می‌گوید وای! دیر رسیده و کره را خانه جا گذاشته!
    note: 'دو صورت گذشتهٔ نقلی در یک جمله: با *être* (*je suis arrivé*) و با *avoir* (*j''ai oublié*).'
  fr.a1.unit12.lesson03.teach.line03:
    title: پرسیدن اینکه چه کار کرد
    gloss: اینس می‌پرسد بعدش چه کار کرده.
    note: '*Qu''est-ce que tu as fait ?* (چه کار کردی؟) از صورت بی‌قاعدهٔ گذشتهٔ نقلی *faire* استفاده می‌کند.'
  fr.a1.unit12.lesson03.teach.line04:
    title: توضیح دادن راه‌حل
    gloss: ماتیو می‌گوید سریع به خواربارفروشی سر کوچه رفته.
    note: '*L''épicerie du coin* (خواربارفروشی سر کوچه) از *coin* استفاده می‌کند، مثل *au coin de la rue*.'
  fr.a1.unit12.lesson03.teach.line05:
    title: پرسیدن اینکه جواب داد یا نه
    gloss: اینس می‌پرسد آنجا کره پیدا کرده یا نه.
    note: '*Tu as trouvé... ?* (پیدا کردی...؟) یک سؤال باقاعدهٔ دیگر با فعل کمکی *avoir* است.'
  fr.a1.unit12.lesson03.teach.line06:
    title: پایان خوش ماجرا
    gloss: ماتیو می‌گوید بله و در نهایت کیک خیلی خوشمزه شد!
    note: با *finalement* ماجرا را با یک نتیجهٔ خوب تمام می‌کند و مشکل قبلی حل می‌شود.
