course:
  title: فرانسه A1
  description: 'بیان علاقه‌ها، بیزاری‌ها و ترجیح‌های ساده و پرسیدن دربارهٔ آن‌ها، در ادامهٔ داستان کارگاه آشپزی Inès و Mathieu که برای شنبه بین دو دستور پخت یکی را انتخاب می‌کنند. نکتهٔ مهم: در *préférer X à Y* (X را به Y ترجیح دادن) از حرف اضافهٔ *à* استفاده می‌شود، نه *que*.'
units:
  fr.a1.unit13.preferences:
    title: کدوم را ترجیح می‌دی؟
