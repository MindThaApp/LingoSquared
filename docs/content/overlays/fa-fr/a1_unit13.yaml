  fr.a1.unit13.lesson01.vocabulaire_preferences:
    title: دوست داشتن، ترجیح دادن، متنفر بودن
  fr.a1.unit13.lesson02.demander_les_preferences:
    title: پرسیدن دربارهٔ ترجیح‌ها
  fr.a1.unit13.lesson03.dialogue_choisir_la_recette:
    title: انتخاب دستور پخت شنبه
teaching:
  fr.a1.unit13.lesson01.teach.preferer:
    title: ترجیح دادن
    gloss: ترجیح دادن
    note: '*Préférer* فعل گروه -ER با تغییر در ریشه است: *je préfère*، ولی *nous préférons* (در صورت‌های *nous/vous* لهجهٔ حرف عوض نمی‌شود).'
    example_gloss: من تارت شکلاتی را ترجیح می‌دم.
  fr.a1.unit13.lesson01.teach.aimer_mieux:
    title: بیشتر دوست داشتن
    gloss: بیشتر دوست داشتن
    note: '*Aimer mieux* جایگزین رایجِ *préférer* است، ولی مقایسه را با *que* می‌سازد (*aimer mieux X que Y*) در حالی که *préférer* با *à* می‌آید (*préférer X à Y*).'
    example_gloss: من غذاهای شور را بیشتر از غذاهای شیرین دوست دارم.
  fr.a1.unit13.lesson01.teach.detester:
    title: متنفر بودن
    gloss: متنفر بودن
    note: '*Détester* بیزاریِ شدید است، قوی‌تر از *ne pas aimer* (دوست نداشتن).'
    example_gloss: Mathieu از ادویه‌های خیلی تند متنفره؛ غذاهای ملایم را ترجیح می‌ده.
  fr.a1.unit13.lesson01.teach.plutot:
    title: ترجیحاً
    gloss: ترجیحاً
    note: '*Plutôt* ترجیح را نرم‌تر می‌کند؛ یعنی بیشتر این یکی، بدون اینکه گزینهٔ دیگر کاملاً کنار برود.'
    example_gloss: من ترجیحاً پنیر برمی‌دارم.
  fr.a1.unit13.lesson01.teach.sucre:
    title: شیرین
    gloss: شیرین
    note: '*Sucré* برای مزهٔ غذا به کار می‌رود و با *doux* (نرم، ملایم) فرق دارد؛ این دو را با هم قاطی نکنید.'
    example_gloss: این دسر خیلی شیرینه.
  fr.a1.unit13.lesson01.teach.sale:
    title: شور / غیرشیرین
    gloss: شور / غیرشیرین
    note: '*Salé* در واژگان غذایی فرانسه ضدِ معمولِ *sucré* است و هم معنی «شور» را دارد و هم «غیرشیرین».'
    example_gloss: پنیر شوره.
  fr.a1.unit13.lesson01.teach.la_recette:
    title: دستور پخت
    gloss: دستور پخت
    note: '*La recette* همیشه مؤنث است.'
    example_gloss: این دستور پخت آسونه.
  fr.a1.unit13.lesson02.teach.quest_ce_que_tu_preferes:
    title: پرسیدن ترجیح
    gloss: کدوم را ترجیح می‌دی؟
    note: '*Qu''est-ce que...* راه معمول ساختن پرسش باز با «چی» در فرانسوی محاوره‌ای است.'
  fr.a1.unit13.lesson02.teach.je_prefere_x_a_y:
    title: گفتن ترجیح بین دو چیز
    gloss: من تارت را به کیش ترجیح می‌دم.
    note: در *Préférer X à Y* گزینهٔ کم‌ترجیح با *à* می‌آید، نه با *que*؛ پس قالب این جمله مثل «X را به Y ترجیح دادن» در فارسی است.
  fr.a1.unit13.lesson02.teach.tu_aimes_plutot:
    title: پرسیدن دربارهٔ تمایل کلی
    gloss: بیشتر شیرینی دوست داری یا غذای شور؟
    note: '*plutôt* (از درس اول) را با یک پرسش انتخابی با *ou* (یا) ترکیب می‌کند.'
  fr.a1.unit13.lesson02.teach.moi_aussi_moi_non:
    title: موافقت یا مخالفت
    gloss: من هم. / من نه.
    note: '*Moi aussi* با جملهٔ مثبت موافقت می‌کند؛ *moi non* مخالفت می‌کند یا ترجیح مخالف را می‌گوید.'
  fr.a1.unit13.lesson02.teach.ca_ne_me_derange_pas:
    title: گفتن اینکه برات فرقی نمی‌کنه
    gloss: برام فرقی نمی‌کنه.
    note: '*Ça ne me dérange pas* راهی مفید و خنثی است برای قبول هر دو گزینه وقتی ازتان می‌خواهند انتخاب کنید.'
  fr.a1.unit13.lesson02.teach.on_pourrait_faire:
    title: پیشنهاد دادن یک گزینه
    gloss: می‌شه یه کیش درست کنیم، نه؟
    note: '*On pourrait* (می‌شد / می‌تونیم) به‌علاوهٔ مصدر، یک گزینه را ملایم پیشنهاد می‌کند و با *non ?* از طرف مقابل تأیید می‌گیرد.'
  fr.a1.unit13.lesson03.teach.line01:
    title: پرسیدن اینکه چی درست کنیم
    gloss: 'Mathieu می‌پرسه شنبه چی درست کنن: تارت یا کیش؟'
    note: '*Qu''est-ce qu''on prépare... ?* (چی درست می‌کنیم) برای «ما» از *on* استفاده می‌کند، که در محاوره معمول است.'
  fr.a1.unit13.lesson03.teach.line02:
    title: گفتن ترجیح و پرسیدن از طرف مقابل
    gloss: Inès می‌گه تارت را ترجیح می‌ده، یه کم شیرین‌تر، و از Mathieu می‌پرسه.
    note: '*Et toi ?* (تو چی؟) ساده‌ترین راه برای تبدیل یک جمله به پرسش از طرف مقابل است.'
  fr.a1.unit13.lesson03.teach.line03:
    title: گفتن ترجیح مخالف
    gloss: Mathieu می‌گه غذای شور را بیشتر دوست داره و کیش را به تارت ترجیح می‌ده.
    note: الگوی *préférer X à Y* از درس دوم را مستقیم دوباره به کار می‌برد.
  fr.a1.unit13.lesson03.teach.line04:
    title: پیشنهاد سازش
    gloss: Inès پیشنهاد می‌کنه هر دو را درست کنن، نه؟
    note: '*Les deux* (هر دو) با پیشنهاد درست کردن هر دو دستور پخت، اختلاف را حل می‌کند.'
  fr.a1.unit13.lesson03.teach.line05:
    title: قبول کردن سازش
    gloss: Mathieu می‌گه فکر خوبیه و اصلاً براش فرقی نمی‌کنه.
    note: '*Ça ne me dérange pas du tout* عبارت درس دوم را با *du tout* (اصلاً) قوی‌تر می‌کند.'
  fr.a1.unit13.lesson03.teach.line06:
    title: تأیید تصمیم
    gloss: Inès می‌گه عالیه، یه تارت شیرین و یه کیش شور برای شنبه.
    note: تصمیم نهایی را روشن دوباره می‌گوید و گفتگو را تمام می‌کند.
