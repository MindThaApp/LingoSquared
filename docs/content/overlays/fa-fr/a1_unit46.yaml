teaching:
  fr.a1.unit46.lesson01.teach.l_appartement_le:
    title: آپارتمان، اتاق نشیمن، اتاق خواب
    gloss: آپارتمان، اتاق نشیمن، اتاق خواب
    note: '*L''appartement* مذکر است و حرف *e* در *le* حذف می‌شود؛ *le salon* مذکر و *la chambre* مؤنث است.'
    example_gloss:
    - من یک آپارتمان دارم.
    - من یک اتاق نشیمن دارم.
    - من یک اتاق خواب دارم.
  fr.a1.unit46.lesson01.teach.la_cuisine_la:
    title: آشپزخانه، حمام
    gloss: آشپزخانه، حمام
    note: '*La cuisine* و *la salle de bains* هر دو مؤنث هستند.'
    example_gloss:
    - من آشپزخانه دارم.
    - من حمام دارم.
  fr.a1.unit46.lesson01.teach.j_ai_un:
    title: گفتن اینکه آپارتمان دارید
    gloss: من یک آپارتمان دارم.
    note: فعل *avoir* (داشتن) فعل طبیعی برای گفتن این است که چه خانه‌ای دارید؛ در فارسی هم برای این کار از «داشتن» استفاده می‌کنیم. این یک مثال کلی است؛ آپارتمان خود ماتیو (در لیون) بعداً در همین درس می‌آید.
  fr.a1.unit46.lesson01.teach.j_ai_un_2:
    title: شمردن همهٔ اتاق‌ها
    gloss: من یک اتاق پذیرایی، یک اتاق خواب، یک آشپزخانه و یک حمام دارم.
    note: هر چهار اتاق واژگان این درس در یک جمله آمده‌اند؛ با ویرگول از هم جدا شده‌اند و پیش از آخرین مورد *et* می‌آید.
  fr.a1.unit46.lesson02.teach.tu_as_combien:
    title: پرسیدن تعداد اتاق‌ها
    gloss: چند تا اتاق داری؟
    note: 'بعد از *combien de* (چند) اسم جمع می‌آید: *combien de pièces*.'
  fr.a1.unit46.lesson02.teach.j_ai_deux:
    title: گفتن تعداد اتاق‌ها
    gloss: من دو اتاق خواب دارم.
    note: '*Chambres* جمع *chambre* است و با افزودن یک *-s* بی‌صدا ساخته می‌شود.'
  fr.a1.unit46.lesson02.teach.l_appartement_a:
    title: گفتن تعداد کل اتاق‌ها
    gloss: آپارتمان سه اتاق دارد.
    note: '*Pièces* واژهٔ کلی برای اتاق‌هاست و فقط به اتاق خواب محدود نمی‌شود.'
  fr.a1.unit46.lesson03.teach.le_balcon_le:
    title: بالکن، باغ
    gloss: بالکن، باغ
    note: '*Le balcon* و *le jardin* هر دو مذکرند.'
    example_gloss:
    - یک بالکن هست.
    - باغ ندارد.
  fr.a1.unit46.lesson03.teach.il_y_a:
    title: گفتن اینکه چیزی وجود دارد
    gloss: یک بالکن هست.
    note: '*Il y a* ساختار رایج برای گفتن وجود چیزی است و معادل «هست» یا «وجود دارد» در فارسی است.'
  fr.a1.unit46.lesson03.teach.il_n_y:
    title: گفتن اینکه چیزی وجود ندارد
    gloss: باغ ندارد.
    note: '*Pas de* اسم نامعین را منفی می‌کند: *pas de jardin* و نه *pas un jardin*.'
  fr.a1.unit46.lesson04.teach.cosy:
    title: دنج
    gloss: دنج
    note: صفتی بسیار رایج و خاصِ فرانسوی برای فضایی گرم و دلپذیر؛ معادل دقیق تک‌واژه‌ای در فارسی ندارد و «دنج» نزدیک‌ترین واژه است.
    example_gloss: آپارتمان کوچک ولی دنج است.
  fr.a1.unit46.lesson04.teach.l_appartement_est:
    title: یک الگوی رایج برای توصیف
    gloss: آپارتمان کوچک ولی دنج است.
    note: '*Petit mais cosy* روشی کاملاً طبیعی است که فرانسوی‌زبان‌ها خانهٔ کوچک را مثبت توصیف می‌کنند.'
  fr.a1.unit46.lesson04.teach.le_salon_est:
    title: توصیف اندازهٔ یک اتاق
    gloss: اتاق پذیرایی بزرگ است.
    note: '*Grand* یک اتاق مشخص را توصیف می‌کند، نه کل خانه را؛ با *le salon* که مذکر است مطابقت دارد.'
  fr.a1.unit46.lesson04.teach.la_cuisine_est:
    title: توصیف اندازهٔ اتاقی دیگر
    gloss: آشپزخانه کوچک است.
    note: 'همان الگوی *grand* در کارت قبل، این بار با اتاقی دیگر: *la cuisine* مؤنث است، پس *petite* می‌آید.'
  fr.a1.unit46.lesson05.teach.appartement_a_lyon:
    title: خواندن یک آگهی مسکن
    gloss: 'آپارتمان در لیون: یک اتاق خواب، یک اتاق پذیرایی، یک آشپزخانه و یک حمام. بالکن دارد ولی باغ ندارد. آپارتمان کوچک ولی دنج است.'
    note: به تعداد اتاق‌ها، امکاناتی که هست یا نیست و برداشت کلی از خانه توجه کنید.
    glosses:
      Appartement: آپارتمان
      chambre: اتاق خواب
      salon: اتاق نشیمن
      cuisine: آشپزخانه
      bains: حمام
      balcon: بالکن
      jardin: باغ
      petit: کوچک
      cosy: دنج
  fr.a1.unit46.lesson06.teach.camille_salut_mathieu:
    title: کامی دربارهٔ آپارتمان می‌پرسد
    gloss: 'کامی: سلام ماتیو، آپارتمان جدیدت در لیون چطوره؟'
    note: '*Nouvel* شکلی از *nouveau* (جدید) است که پیش از اسم مذکری که با مصوت شروع می‌شود به کار می‌رود: *un nouvel appartement*.'
  fr.a1.unit46.lesson06.teach.mathieu_il_est:
    title: ماتیو آن را توصیف می‌کند
    gloss: 'ماتیو: کوچیکه ولی دنجه. یک اتاق خواب، یک اتاق پذیرایی، یک آشپزخونه و یک حمام دارم.'
    note: دقیقاً با آگهی مسکنی که در درس پنجم خواندید یکی است؛ این آپارتمان واقعی ماتیو است.
  fr.a1.unit46.lesson06.teach.camille_tu_as:
    title: کامی دربارهٔ بالکن می‌پرسد
    gloss: 'کامی: بالکن داری؟'
    note: یک پرسش مستقیم بلی/خیر با *Tu as ... ?*
  fr.a1.unit46.lesson06.teach.mathieu_oui_j:
    title: ماتیو جواب می‌دهد
    gloss: 'ماتیو: آره، بالکن دارم ولی باغ ندارم.'
    note: با اطلاعات بالکن و نبودِ باغ در آگهی درس پنجم یکی است.
  fr.a1.unit46.lesson06.teach.balcon_est_masculin:
    title: جنسیت واژهٔ balcon
    gloss: '*Balcon* مذکر است: یک بالکن، آن کوچک است.'
    note: '*Il* (او، آن) جانشین اسم مذکری مثل *balcon* می‌شود، پس صفت هم مذکر است: *il est petit*.'
  fr.a1.unit46.lesson06.teach.camille_ca_a:
    title: کامی با گرمی واکنش نشان می‌دهد
    gloss: 'کامی: به نظر قشنگه! به‌زودی بهت سر می‌زنم.'
    note: '*Je passerai te voir* (بهت سر می‌زنم) از زمان آینده‌ی *passerai* به‌علاوهٔ *te voir* یعنی «دیدنِ تو» ساخته شده است.'
  fr.a1.unit46.lesson06.teach.mathieu_super_tu:
    title: ماتیو از او استقبال می‌کند
    gloss: 'ماتیو: عالی، همیشه خوش اومدی.'
    note: '*Toujours la bienvenue* (همیشه خوش‌آمده) راهی صمیمی برای دعوت دوباره از کسی است؛ *bienvenue* در اینجا مؤنث است چون دربارهٔ کامی است.'
