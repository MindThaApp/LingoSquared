    example_gloss: هر روز به گربه غذا می‌دهم.
  fr.a1.unit54.lesson02.teach.jouer_avec:
    title: بازی کردن با
    gloss: بازی کردن با
    example_gloss: توما با گربه‌اش بازی می‌کند.
  fr.a1.unit54.lesson02.teach.je_promene_le:
