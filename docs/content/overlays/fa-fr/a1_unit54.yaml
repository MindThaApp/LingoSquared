    gloss: 'Mathieu: ظاهرش چطوره؟'
    note: عبارت *Comment est-il ?* از درس ظاهر دوباره آمده، این بار درباره‌ی یک حیوان.
  fr.a1.unit54.lesson04.teach.camille_il_a:
    title: Camille سگش را توصیف می‌کند
    gloss: 'Camille: موهاش قهوه‌ایه و کوچیکه.'
    note: واژه‌های رنگ مو و اندازه از درس ظاهر تکرار شده‌اند، این بار برای توصیف پشم و موی حیوان به جای موی آدم.
  fr.a1.unit54.lesson04.teach.il_et_le:
    title: Il/le برای حیوان‌ها
    gloss: '*Il* (او، مذکر) و *le* (او را، مذکر) را برای حیوان نر هم می‌شود به کار برد، نه فقط برای آدم‌ها.'
    note: تا اینجا هر جا در این دوره *il* و *le* آمده بود، منظور آدم بود؛ این نکته صریحاً می‌گوید که برای حیوان‌ها هم به کار می‌روند.
  fr.a1.unit54.lesson04.teach.mathieu_tu_le:
    title: Mathieu درباره‌ی پیاده‌روی می‌پرسد
    gloss: 'Mathieu: هر روز می‌بریش پیاده‌روی؟'
  fr.a1.unit54.lesson04.teach.camille_oui_je:
    title: Camille برنامه‌ی روزانه‌اش را می‌گوید
    gloss: 'Camille: آره، هر روز می‌برمش پیاده‌روی و بهش غذا می‌دم.'
  fr.a1.unit54.lesson05.teach.mathieu_et_lea:
    title: ماتیو، لئا و توما دربارهٔ حیوان‌ها
    gloss: 'Mathieu و Léa هر دو حیوانات را دوست دارند، ولی هیچ‌کدامشان حیوان خانگی ندارد. Mathieu عاشق سگ‌هاست و Léa عاشق گربه‌ها. اما Thomas یک حیوان خانگی دارد: یک گربه. او اغلب با گربه‌اش بازی می‌کند و هر روز بهش غذا می‌دهد. شما چی، حیوان خانگی دارید؟'
    note: دوست داشتنِ یک حیوان را با داشتنِ واقعی‌اش مقایسه می‌کند؛ همان نکته‌ی اصلیِ ارتباطی این درس.
    glosses:
      adorent: خیلی دوست دارد
      tous: هر دو
      animaux: حیوان‌ها
      deux: هر دو
      compagnie: حیوان خانگی
      chiens: سگ‌ها
      chats: گربه‌ها
      chat: گربه
      joue: بازی می‌کند
      donne: می‌دهد
      chaque: هر
      manger: غذا
  fr.a1.unit54.lesson05.teach.thomas_joue_souvent:
    title: Thomas اغلب با گربه‌اش بازی می‌کند
    gloss: Thomas اغلب با گربه‌اش بازی می‌کنه.
    note: '*Souvent* (اغلب) درست بعد از فعل می‌آید، مثل روال‌های قبلی.'
  fr.a1.unit54.lesson05.teach.j_adore_les:
    title: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    gloss: من سگ‌ها را خیلی دوست دارم. حیوان خانگی ندارم.
    note: یک پاسخ نمونه‌ی دوجمله‌ای که برای تمرین نوشتاری این درس می‌توانید از آن استفاده کنید.
  fr.a1.unit54.lesson06.teach.camille_nina_tu:
    title: Camille از Nina می‌پرسد
    gloss: 'Camille: Nina، تو هم حیوان خانگی داری؟'
  fr.a1.unit54.lesson06.teach.nina_oui_j:
    title: Nina یک پرنده به اسم Pico دارد
    gloss: 'Nina: آره، یه پرنده دارم. اسمش Pico‌ـه.'
    note: '*Il s''appelle* (اسمش … است) همان فعلی است که در اولین درس برای معرفی یاد گرفتید.'
  fr.a1.unit54.lesson06.teach.mathieu_comme_c:
    title: واکنش Mathieu
    gloss: 'Mathieu: چه خوب! هر روز باهاش چه کار می‌کنی؟'
  fr.a1.unit54.lesson06.teach.nina_je_lui:
    title: Nina هر روز غذا می‌دهد
    gloss: 'Nina: هر روز بهش غذا می‌دم.'
  fr.a1.unit54.lesson06.teach.mathieu_j_adore:
    title: Mathieu پرنده‌ها را هم دوست دارد
    gloss: 'Mathieu: من پرنده‌ها را هم خیلی دوست دارم.'
  fr.a1.unit54.lesson06.teach.camille_c_est:
    title: Camille گفت‌وگو را جمع‌بندی می‌کند
    gloss: 'Camille: عالیه که هر سه‌تامون حیوان‌ها را دوست داریم!'
    note: حرف‌های هر سه شخصیت درباره‌ی حیوان‌ها در این درس را کنار هم جمع‌بندی می‌کند.
