    note: '*donner à manger* (در اصل «دادن برای خوردن») با *tous les jours* ترکیب شده است.'
  fr.a1.unit54.lesson03.teach.au_pluriel_on:
    title: 'جمع: chien -> chiens'
    gloss: 'جمع معمولاً یک *s* اضافه می‌کند که شنیده نمی‌شود: *chien -> chiens*، *chat -> chats*. اسم‌هایی که به *-al* ختم می‌شوند به *-aux* تبدیل می‌شوند: *animal -> animaux*.'
    note: قاعدهٔ جمع بستن در فرانسه که اینجا برای اولین بار با اسم حیوان‌ها نشان داده می‌شود.
  fr.a1.unit54.lesson03.teach.chiens_chats:
    title: سگ‌ها و گربه‌ها
    gloss: سگ‌ها / گربه‌ها
    example_gloss:
