    title: حیوان خانگی دارید؟
    gloss: حیوان خانگی دارید؟
    note: همان الگوی پرسشی *Tu as ... ?* که از درس‌های قبل می‌شناسید.
  fr.a1.unit54.lesson01.teach.oui_j_ai:
    title: بله، من یک سگ دارم
    gloss: بله، یک سگ دارم.
    note: یک پاسخ مثبت ساده با واژه‌های تازه‌ی این درس.
  fr.a1.unit54.lesson01.teach.non_je_n:
    title: نه، من حیوان خانگی ندارم
    gloss: نه، من حیوان خانگی ندارم.
    note: 'بعد از منفی، *pas d''* جای *un* می‌نشیند: *Je n''ai pas d''animal de compagnie.* یادداشت دستور را ببینید.'
  fr.a1.unit54.lesson01.teach.apres_ne_pas:
    title: 'Pas de: منفی کردن un/une/des'
    gloss: بعد از *ne ... pas*، واژه‌های *un*، *une* و *des* به *de* یا *d'* تبدیل می‌شوند، مثل *Je n'ai pas de temps* (که از قبل بلدید) و اینجا *Je n'ai pas d'animal de compagnie*.
    note: 'این همان الگویی است که در *Je n''ai pas de temps* یاد گرفتید: دستور تازه‌ای نیست، فقط اسم تازه‌ای است که آن را به کار می‌بریم.'
  fr.a1.unit54.lesson02.teach.promener:
    title: بردنِ حیوان به پیاده‌روی
    gloss: به پیاده‌روی بردن (حیوان)
    note: '*Promener* (به پیاده‌روی بردن) یک فعل قاعده‌مند پایان‌یافته با *-er* است؛ یادداشت دستور را ببینید.'
    example_gloss: هر روز سگ را بیرون می‌برم.
  fr.a1.unit54.lesson02.teach.promener_est_un:
    title: Promener یک فعل قاعده‌مند با پایانهٔ -er است
    gloss: '*Promener* مثل *cuisiner* یک فعل قاعده‌مند با پایانهٔ *-er* است: *je promène, tu promènes, il promène le chien*. اکسان روی *e* نشان می‌دهد که تلفظ می‌شود.'
    note: ریشهٔ فعل همیشه یک‌تکه می‌ماند، مثل فعل‌های *-er* دیگری که تا حالا یاد گرفته‌اید.
  fr.a1.unit54.lesson02.teach.donner_a_manger:
    title: غذا دادن
