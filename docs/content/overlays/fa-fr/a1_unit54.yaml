  fr.a1.unit54.lesson01.teach.l_animal_un:
    title: حیوان، حیوان خانگی
    gloss: حیوان / حیوان خانگی
    note: '*Un animal* واژهٔ کلی است؛ *un animal de compagnie* (در اصل «حیوانِ همراه») مشخصاً یعنی حیوان خانگی.'
    example_gloss:
