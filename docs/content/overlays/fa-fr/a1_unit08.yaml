course:
  title: فرانسه A1
  description: 'روزهای هفته و گفتن تاریخ تقویمی (le + عدد اصلی + نام ماه، که فقط le premier استثنا و عدد ترتیبی است). داستان آشپزی اینس و ماتیو ادامه پیدا می‌کنه و آن‌ها جلسهٔ آخر کارگاه را برنامه‌ریزی می‌کنند. نکتهٔ مهم: در فرانسوی برای تاریخ، جز اولِ ماه، همیشه عدد اصلی به کار می‌رود (le quinze mars)، در حالی که در فارسی عدد ترتیبی می‌گوییم (پانزدهم مارس).'
