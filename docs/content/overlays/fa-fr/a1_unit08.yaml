teaching:
  fr.a1.unit08.lesson01.teach.lundi:
    title: دوشنبه
    gloss: دوشنبه
    note: در فرانسوی روزهای هفته مذکر هستند (فارسی جنس دستوری ندارد) و با حرف کوچک نوشته می‌شوند.
    example_gloss: کارگاه هیچ‌وقت دوشنبه‌ها برگزار نمی‌شه.
  fr.a1.unit08.lesson01.teach.samedi:
    title: شنبه
    gloss: شنبه
    note: '*Le samedi* (با حرف تعریف) یعنی «هر شنبه» و به‌صورت عادت؛ ولی *samedi* به‌تنهایی یعنی یک شنبهٔ مشخص، یعنی نزدیک‌ترین شنبه، بسته به زمان فعل، چه آینده چه گذشته.'
    example_gloss: کارگاه شنبه‌ها برگزار می‌شه.
  fr.a1.unit08.lesson01.teach.dimanche:
    title: یکشنبه
    gloss: یکشنبه
    note: 'مثل بقیهٔ روزها: مذکر است و با حرف کوچک نوشته می‌شود.'
    example_gloss: نونوایی یکشنبه‌ها تعطیله.
  fr.a1.unit08.lesson01.teach.aujourdhui:
    title: امروز
    gloss: امروز
    note: '*Aujourd''hui* یک کلمهٔ ثابت و یکپارچه است، هرچند در اصل از چند بخش ساخته شده است.'
    example_gloss: امروز شنبه است.
  fr.a1.unit08.lesson01.teach.demain:
    title: فردا
    gloss: فردا
    note: '*Demain* تغییر نمی‌کند و در هر جمله به یک شکل به کار می‌رود.'
    example_gloss: داروخونه فردا باز می‌شه.
  fr.a1.unit08.lesson01.teach.hier:
    title: دیروز
    gloss: دیروز
    note: '*Hier* درست نقطهٔ مقابل *demain* است.'
    example_gloss: دیروز ماهی خوردم.
  fr.a1.unit08.lesson01.teach.quel_jour_sommes_nous:
    title: پرسیدن روز
    gloss: امروز چه روزیه؟
    note: '*Quel jour sommes-nous ?* (تحت‌اللفظی: «چه روزی هستیم») روش استاندارد پرسیدن روز هفته است.'
  fr.a1.unit08.lesson02.teach.mars:
    title: مارس
    gloss: مارس
    note: ماه‌ها هم مثل روزها در فرانسوی مذکر هستند و با حرف کوچک نوشته می‌شوند.
    example_gloss: کارگاه در مارس تموم می‌شه.
  fr.a1.unit08.lesson02.teach.quelle_est_la_date:
    title: پرسیدن تاریخ
    gloss: امروز چندم است؟
    note: '*Quelle est la date... ?* روش استاندارد پرسیدن تاریخ کامل است، برخلاف *Quel jour sommes-nous ?* که فقط روز هفته را می‌پرسد.'
  fr.a1.unit08.lesson02.teach.cest_le_quinze_mars:
    title: گفتن تاریخ
    gloss: پانزدهم مارسه.
    note: '*Le* + عدد اصلی + نام ماه الگوی استاندارد تاریخ در فرانسوی است: *quinze* (پانزده)، نه عدد ترتیبی «پانزدهم» که در فارسی می‌گوییم.'
  fr.a1.unit08.lesson02.teach.nous_sommes_le:
    title: گفتن تاریخ امروز
    gloss: امروز پانزدهم مارسه.
    note: '*Nous sommes le...* هم به همان اندازهٔ *C''est le...* برای گفتن تاریخ امروز رایج است.'
  fr.a1.unit08.lesson02.teach.le_premier:
    title: اول (ماه)
    gloss: اول
    note: '*Le premier* تنها استثنای قاعدهٔ عدد اصلی است: بقیهٔ روزهای ماه عدد اصلی ساده دارند (*le deux*، *le trois*...)، ولی برای اول از عدد ترتیبی *premier* استفاده می‌شود.'
  fr.a1.unit08.lesson02.teach.le_vingt_deux:
    title: گفتن تاریخ پایان
    gloss: کارگاه بیست‌ودوم مارس تموم می‌شه.
    note: '*Se termine* (تموم می‌شه) فعل انعکاسی است؛ *vingt-deux* عدد اصلی ساده است و از همان قاعدهٔ *le quinze mars* پیروی می‌کند.'
  fr.a1.unit08.lesson03.teach.line01:
    title: پرسیدن زمان آخرین جلسه
    gloss: اینس می‌پرسه آخرین جلسهٔ کارگاه کِیه.
    note: '*C''est quand... ?* (کِی هست) راه ساده و طبیعی برای پرسیدن دربارهٔ زمان است.'
  fr.a1.unit08.lesson03.teach.line02:
    title: گفتن تاریخ و روز
    gloss: ماتیو می‌گه فکر کنم بیست‌ودوم مارسه، یه شنبه.
    note: '*Un samedi* (بدون *le*) فقط می‌گوید آن تاریخ چه روزی از هفته است.'
  fr.a1.unit08.lesson03.teach.line03:
    title: پرسیدن تاریخ امروز
    gloss: اینس می‌پرسه تاریخ امروز چنده.
    note: همان *Quelle est la date aujourd'hui ?* که برای پرسیدن تاریخ یاد گرفتید.
  fr.a1.unit08.lesson03.teach.line04:
    title: گفتن تاریخ امروز و فاصله
    gloss: ماتیو می‌گه امروز پانزدهم مارسه، پس یه هفته دیگه‌ست.
    note: '*Dans une semaine* (یک هفته دیگر) فاصلهٔ زمانی از امروز را نشان می‌دهد.'
  fr.a1.unit08.lesson03.teach.line05:
    title: واکنش با یک برنامه
    gloss: اینس می‌گه عالیه، وقت داره برای این مناسبت یه دسر درست کنه.
    note: '*J''ai le temps de* + مصدر (وقت دارم که...) راه رایجی برای گفتن این است که برای کاری وقت کافی هست.'
  fr.a1.unit08.lesson03.teach.line06:
    title: تأیید برنامه
    gloss: ماتیو می‌گه فکر خوبیه، پس شنبهٔ آینده، بیست‌ودوم، همدیگه رو می‌بینیم.
    note: '*Samedi prochain* (شنبهٔ آینده) هم نام روز و هم تاریخ را با هم تأیید می‌کند و گفتگو را تمام می‌کند.'
