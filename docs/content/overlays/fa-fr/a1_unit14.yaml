teaching:
  fr.a1.unit14.lesson01.teach.plus_que:
    title: بیشتر از ...
    gloss: بیشتر از ...
    note: در فارسی به آخر صفت پسوند «‌تر» اضافه می‌کنیم، ولی در فرانسوی مقایسه با ساختار *Plus + adjectif + que* ساخته می‌شود و کلمه‌ای جدا پیش از صفت می‌آید، نه پسوند.
    example_gloss: این پنیر از آن یکی گران‌تر است.
  fr.a1.unit14.lesson01.teach.moins_que:
    title: کمتر از ...
    gloss: کمتر از ...
    note: '*Moins* درست عکس *plus* است و در همین ساختار مقایسه به کار می‌رود.'
    example_gloss: این دستور از آن یکی کم‌سخت‌تر است.
  fr.a1.unit14.lesson01.teach.aussi_que:
    title: به اندازه‌ی ...
    gloss: به اندازه‌ی ...
    note: '*Aussi + adjective + que* برای بیان برابری دو چیز به کار می‌رود، یعنی «به‌اندازهٔ ... بودن».'
    example_gloss: تارت به اندازه‌ی کیش خوشمزه است.
  fr.a1.unit14.lesson01.teach.meilleur_que:
    title: بهتر از
    gloss: بهتر از
    note: '*Meilleur* شکل بی‌قاعده‌ی تفضیلی *bon* (خوب) است؛ در فرانسوی *plus bon* نمی‌گویند.'
    example_gloss: این کیک از اولی بهتر است.
  fr.a1.unit14.lesson01.teach.cher_bon_marche:
    title: گران، ارزان
    gloss: گران، ارزان / به‌صرفه
    note: '*Bon marché* ثابت است و تغییر نمی‌کند، با اینکه ممکن است فکر کنید مثل بقیه‌ی صفت‌ها باید جور شود.'
    example_gloss:
    - پنیر گران است.
    - سبزی‌ها ارزان هستند.
  fr.a1.unit14.lesson01.teach.facile_difficile:
    title: آسان، سخت
    gloss: آسان، سخت
    note: یک جفت صفت رایج برای توصیف دستور پخت؛ هر دو در مذکر و مؤنث شکل یکسانی دارند و در جمع یک -s می‌گیرند (*faciles*، *difficiles*).
    example_gloss:
    - این دستور آسان است.
    - کیش کمی سخت است.
  fr.a1.unit14.lesson02.teach.le_plus_cher:
    title: گران‌ترین
    gloss: گران‌ترین
    note: '*Le/la plus + صفت* صفت برترین را می‌سازد؛ برخلاف مقایسه‌ی ساده، آوردن حرف تعریف اجباری است.'
    example_gloss: این گران‌ترین پنیر بازار است.
  fr.a1.unit14.lesson02.teach.la_moins_chere:
    title: ارزان‌ترین
    gloss: ارزان‌ترین
    note: '*La moins chère* با *recette* که مؤنث است جور شده؛ شکل مذکرش *le moins cher* است.'
    example_gloss: این ارزان‌ترین دستور پخت است.
  fr.a1.unit14.lesson02.teach.le_meilleur:
    title: بهترین
    gloss: بهترین
    note: '*Le meilleur* شکل بی‌قاعده‌ی برترین *bon* است و با *meilleur* بی‌قاعده‌ی مقایسه در درس اول مطابقت دارد.'
    example_gloss: این بهترین کیک کارگاه است!
  fr.a1.unit14.lesson02.teach.la_plus_facile:
    title: آسان‌ترین
    gloss: آسان‌ترین
    note: یک صفت برترین قاعده‌مند که مستقیم از الگوی *le/la plus + صفت* پیروی می‌کند.
    example_gloss: این آسان‌ترین دستور پخت است.
  fr.a1.unit14.lesson02.teach.grammar_superlative_note:
    title: ساختار صفت برترین
    gloss: le/la plus + صفت؛ meilleur بی‌قاعده است
    note: بیشتر صفت‌های برترین در فرانسوی قاعده‌مندند (*le/la plus + صفت*)، ولی *bon* ← *meilleur* ← *le meilleur* یک استثنای حفظ‌کردنی است.
  fr.a1.unit14.lesson02.teach.comparer_les_prix:
    title: پیشنهاد مقایسه‌ی قیمت‌ها
    gloss: قبل از خرید، قیمت‌ها را مقایسه کنیم.
    note: '*Comparons* شکل امر برای *nous* از فعل *comparer* است، یعنی «بیایید مقایسه کنیم». عبارتی طبیعی هنگام خرید است.'
  fr.a1.unit14.lesson03.teach.line01:
    title: متوجه دو گزینه شدن
    gloss: اینس می‌گوید ببین، دو نوع پنیر هست؛ کدام را برداریم؟
    note: '*Lequel* (کدام‌یک) از طرف مقابل می‌خواهد بین دو گزینه‌ای که قبلاً گفته شده یکی را انتخاب کند.'
  fr.a1.unit14.lesson03.teach.line02:
    title: مقایسه و اشاره به کیفیت
    gloss: ماتیو می‌گوید این یکی از آن یکی گران‌تر است ولی به نظر بهتر می‌آید.
    note: '*Avoir l''air* + صفت (به نظر رسیدن) حرف را درباره‌ی کیفیتی که هنوز امتحان نشده نرم‌تر می‌کند.'
  fr.a1.unit14.lesson03.teach.line03:
    title: مخالفت با یک مقایسه
    gloss: اینس می‌پرسد مطمئنی؟ و می‌گوید به نظر او آن یکی هم به همان اندازه خوب است و هم ارزان‌تر.
    note: در یک جواب، *aussi* و *moins* درس اول برای مخالفت مؤدبانه کنار هم آمده‌اند؛ *que* حذف شده چون پنیری که با آن مقایسه می‌شود (پنیر ماتیو) از موقعیت معلوم است.
  fr.a1.unit14.lesson03.teach.line04:
    title: قبول کردن موضوع قیمت
    gloss: 'ماتیو موافقت می‌کند: درست است، از این دو تا ارزان‌تر است.'
    note: '*Des deux* (از این دو تا) برترین را فقط به همین دو گزینه محدود می‌کند، نه کل بازار.'
  fr.a1.unit14.lesson03.teach.line05:
    title: گرفتن تصمیم نهایی
    gloss: اینس می‌گوید پس همان یکی را برداریم، بهترین گزینه برای کارگاه است.
    note: '*Celui-là* (آن یکی) به پنیر ارزان‌تری اشاره دارد که همین الان درباره‌اش حرف زدند.'
  fr.a1.unit14.lesson03.teach.line06:
    title: اشاره به فایده
    gloss: ماتیو موافقت می‌کند و می‌گوید پول بیشتری برای دسر برایشان می‌ماند!
    note: '*Il nous reste* (برای ما می‌ماند) راه رایجی برای گفتن «چیزی برایمان مانده» است.'
