course:
  title: فرانسه A1
  description: مقایسه‌های ساده (plus، moins، aussi + que) و صفت عالی (le/la plus)؛ ادامه‌ی داستان کارگاه آشپزی اینس و ماتیو، وقتی موقع خرید دو پنیر را با هم مقایسه می‌کنند. در فرانسوی *meilleur* (بهتر) و *le meilleur* (بهترین) بی‌قاعده‌اند، برخلاف الگوی منظم *plus... que* که برای بیشتر صفت‌های دیگر به کار می‌رود.
units:
  fr.a1.unit14.comparisons:
    title: بیشتر یا کمتر؟
