teaching:
  fr.a1.unit43.lesson01.teach.le_billet:
    title: بلیت
    gloss: بلیت
    note: '*Billet* مذکر است: *le billet*، *un billet*.'
    example_gloss: یک بلیت برای لیون می‌خواستم.
  fr.a1.unit43.lesson01.teach.je_voudrais_un:
    title: درخواست بلیت
    gloss: یک بلیت برای لیون می‌خواستم.
    note: '*Je voudrais* درخواست را نرم‌تر می‌کند؛ مؤدبانه‌تر از *je veux* است.'
  fr.a1.unit43.lesson01.teach.voulez_vous_un:
    title: مسئول می‌پرسد چه نوع بلیتی
    gloss: بلیت یک‌طرفه می‌خواهید یا رفت و برگشت؟
    note: '*Voulez-vous* شکل رسمی *vous* از *vouloir* است و اینجا برای کارمند ناآشنای ایستگاه به کار رفته.'
  fr.a1.unit43.lesson01.teach.un_aller_retour:
    title: جواب مؤدبانه دادن
    gloss: رفت و برگشت، لطفاً.
    note: '*S''il vous plaît* «لطفاً»ی رسمی است و با لحن *vous* در این گفت‌وگو جور است.'
  fr.a1.unit43.lesson01.teach.au_guichet_on:
    title: سطح رسمی پشت باجه
    gloss: پشت باجه معمولاً از شکل محترمانه‌ی *vous* استفاده می‌کنند.
    note: با غریبه‌هایی که کارشان خدمات است با *vous* حرف می‌زنند؛ با دوستان و خانواده با *tu*.
  fr.a1.unit43.lesson02.teach.le_quai:
    title: سکو
    gloss: سکو
    note: '*Quai* مذکر است: *le quai*.'
    example_gloss: قطار لیون از کدام سکو حرکت می‌کند؟
  fr.a1.unit43.lesson02.teach.de_quel_quai:
    title: پرسیدن شمارهٔ سکو
    gloss: قطار لیون از کدام سکو حرکت می‌کند؟
    note: '*De quel quai* مخصوصاً سکو را می‌پرسد؛ *quel* با اسم مذکر *quai* هماهنگ است.'
  fr.a1.unit43.lesson02.teach.le_train_part:
    title: گفتن جزئیات حرکت
    gloss: قطار ساعت ده منهای یک ربع از سکوی پنج حرکت می‌کنه.
    note: '*Dix heures moins le quart* یعنی یک ربع به ده: فرانسوی برای زمان‌های پیش از ساعت کامل *moins* (منها) می‌گوید.'
  fr.a1.unit43.lesson02.teach.a_quelle_heure:
    title: پرسیدن ساعت رسیدن
    gloss: قطار چه ساعتی می‌رسه؟
    note: '*À quelle heure arrive ... ?* ساعت را می‌پرسد؛ *arriver* فعل باقاعده‌ی *-er* است: *le train arrive*.'
  fr.a1.unit43.lesson02.teach.le_train_arrive:
    title: گفتن ساعت رسیدن
    gloss: قطار ساعت یازده می‌رسه.
    note: '*Arrive* شکل *il/elle* فعل *arriver* است؛ فعل‌های *-er* با *il* و *elle* به *-e* ختم می‌شوند.'
  fr.a1.unit43.lesson03.teach.a_l_heure:
    title: سر وقت / تأخیر
    gloss: سر وقت؛ تأخیر
    note: '*À l''heure* عبارتی ثابت برای چیزی است که سر وقت اتفاق می‌افتد. *Le retard* (تأخیر) مذکر است.'
    example_gloss:
    - قطار سر وقت حرکت نمی‌کنه.
    - 'توجه: قطار لیون تأخیر دارد.'
  fr.a1.unit43.lesson03.teach.attention_le_train:
    title: یک اعلامیه
    gloss: 'توجه: قطار لیون تأخیر دارد.'
    note: '*Attention* اعلامیه‌ی ایستگاه را شروع می‌کند، مثل «توجه، مسافران محترم».'
  fr.a1.unit43.lesson03.teach.le_train_ne:
    title: منفی کردن «سر وقت»
    gloss: قطار سر وقت حرکت نمی‌کنه.
    note: '*Ne ... pas* دور فعل را می‌گیرد: *ne part pas à l''heure*.'
  fr.a1.unit43.lesson03.teach.le_train_part:
    title: تغییر سکو
    gloss: قطار به جای سکوی پنج از سکوی سه حرکت می‌کنه.
    note: '*Au lieu du* یعنی «به‌جای»؛ *de* + *le* به *du* تبدیل می‌شود.'
  fr.a1.unit43.lesson03.teach.le_train_a:
    title: گفتن مدت تأخیر
    gloss: قطار ده دقیقه تأخیر داره.
    note: '*A ... de retard* (تحت‌اللفظی «... تأخیر دارد») راه طبیعی گفتن دیر کردن است و با *avoir* ساخته می‌شود.'
  fr.a1.unit43.lesson04.teach.l_entree_la:
    title: ورودی، خروجی، سالن انتظار
    gloss: ورودی؛ خروجی؛ سالن انتظار
    note: '*L''entrée* قبل از مصوت *e* را از دست می‌دهد و *l''* می‌شود؛ *la sortie* و *la salle d''attente* مؤنث‌اند.'
    example_gloss:
    - ورودی کجاست؟
    - خروجی کجاست؟
    - سالن انتظار کجاست؟
  fr.a1.unit43.lesson04.teach.ou_est_le:
    title: پرسیدن جای یک سکو
    gloss: سکوی هفت کجاست؟
    note: '*Où est ... ?* جای چیزی را می‌پرسد؛ *le quai sept* مذکر است.'
  fr.a1.unit43.lesson04.teach.tout_droit_puis:
    title: راه نشان دادن
    gloss: مستقیم برید و بعد به راست.
    note: '*Tout droit* و *à droite* کلمه‌های جهت‌اند؛ *à* قبل از *droite* می‌آید.'
  fr.a1.unit43.lesson04.teach.ou_est_la:
    title: پرسیدن جای سالن انتظار
    gloss: سالن انتظار کجاست؟
    note: همان الگوی سؤال برای یک مکان تازه.
  fr.a1.unit43.lesson05.teach.billet_paris_gare:
    title: خواندن یک بلیت چاپی
    gloss: 'بلیت: از Paris Gare de Lyon به Lyon Part-Dieu. حرکت: ده و ده دقیقه، سکوی هفت. رسیدن: ده دقیقه به یازده. رفت و برگشت. قیمت: دوازده یورو و چهل سنت.'
    note: به ساعت و سکوی حرکت، ساعت رسیدن، نوع بلیت و قیمت توجه کنید.
    glosses:
      Billet: بلیت
      Départ: حرکت
      dix: ده
      quai: سکو
      sept: هفت
      Arrivée: رسیدن
      onze: یازده
      Aller-retour: بلیت رفت و برگشت
      Prix: قیمت
      douze: دوازده
      euros: یورو
      quarante: چهل
  fr.a1.unit43.lesson06.teach.mathieu_on_doit:
    title: Mathieu برنامه را می‌گوید
    gloss: 'Mathieu: باید بریم سکوی هفت. قطار ده و ده دقیقه حرکت می‌کند.'
    note: '*On doit* (از *devoir*) اینجا یک ضرورت عملی را می‌رساند، نه اجبار سخت.'
  fr.a1.unit43.lesson06.teach.camille_regarde_voila:
    title: Camille تابلو را می‌خواند
    gloss: 'Camille: ببین، تابلو اینجاست: تأخیر، ده دقیقه.'
    note: '*Voilà* چیزی را که آنجاست نشان می‌دهد: *voilà le panneau*.'
  fr.a1.unit43.lesson06.teach.mathieu_pas_de:
    title: Mathieu آرام می‌ماند
    gloss: 'Mathieu: مشکلی نیست، هنوز وقت داریم یک قهوه بخوریم.'
    note: '*Pas de problème* جمله‌ی دلداری رایج و خودمانی است.'
  fr.a1.unit43.lesson06.teach.camille_bonne_idee:
    title: قطار می‌رسه
    gloss: 'Camille: فکر خوبیه. اوه، قطار همین الان رسید. سکوی هفت، دقیقاً!'
    note: '*Déjà* (همین حالا) نشان می‌دهد با وجود تأخیری که اعلام شد، قطار زودتر از انتظار رسیده.'
  fr.a1.unit43.lesson06.teach.mathieu_allez_on:
    title: سوار قطار می‌شن
    gloss: 'Mathieu: یالا، سوار شیم. لیون، داریم می‌آییم!'
    note: '*On* در فرانسه‌ی روزمره یعنی *ما* و با شکل *il* فعل به کار می‌رود: *on monte*. عبارت *On arrive !* یعنی «داریم می‌رسیم!» و ترجمه‌ی تحت‌اللفظی‌اش طبیعی نیست.'
