    title: چه کسی چه می‌خواند؟
    gloss: Thomas فقط کار نمی‌کند، درس هم می‌خواند. او در مرکز آموزش بزرگسالان کلاس اسپانیایی می‌رود. هر هفته کلمه‌های تازه یاد می‌گیرد. Léa در مدرسه‌ی عالی یک دوره‌ی آموزشی می‌گذراند. او آنجا سلامت و درمان می‌خواند. هر دوی آن‌ها درس خواندن را دوست دارند. شما چه می‌خوانید، یا دوست دارید چه چیزی یاد بگیرید؟
    note: تحصیل Thomas و Léa را با هم مقایسه می‌کند، مثل متن مقایسه‌ای واحد فناوری.
