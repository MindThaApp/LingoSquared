teaching:
  fr.a1.unit47.lesson01.teach.le_temps:
    title: آب‌وهوا
    gloss: آب‌وهوا
    note: '*Le temps* هم به معنی «هوا» است و هم «زمان»؛ اسمی مذکر است.'
    example_gloss: هوا چطوره؟
  fr.a1.unit47.lesson01.teach.quel_temps_fait:
    title: پرسیدن درباره‌ی هوا
    gloss: هوا چطوره؟
    note: '*Quel temps fait-il ?* پرسش استاندارد درباره‌ی هواست؛ *quel* با اسم مذکر *temps* مطابقت دارد.'
  fr.a1.unit47.lesson01.teach.le_temps_est:
    title: آفتابی
    gloss: هوا آفتابیه.
    note: '*Le temps est* + صفت یک الگوی رایج است؛ صفت با اسم مذکر *temps* مطابقت می‌کند.'
  fr.a1.unit47.lesson01.teach.il_pleut:
    title: بارانی
    gloss: باران می‌آد.
    note: 'فعل *pleuvoir* (باریدن) به‌صورت بی‌شخص به کار می‌رود: *il pleut*، بدون نیاز به صفت جداگانه.'
  fr.a1.unit47.lesson01.teach.le_temps_est_2:
    title: ابری
    gloss: هوا ابریه.
    note: همان الگوی *le temps est* + صفت را دارد، مثل *ensoleillé*.
  fr.a1.unit47.lesson02.teach.il_fait_froid:
    title: سرد
    gloss: امروز هوا سرده.
    note: '*Aujourd''hui* (امروز) هوا را به زمان وصل می‌کند؛ در *il fait froid* فعل *faire* به کار رفته، نه *être*.'
  fr.a1.unit47.lesson02.teach.il_fait_chaud:
    title: گرم
    gloss: امروز هوا گرمه.
    note: '*Il fait chaud* در گفتگوی روزمره درباره‌ی هوا هم «گرم» را می‌رساند و هم «داغ» را.'
  fr.a1.unit47.lesson02.teach.il_ne_fait:
    title: مقایسه‌ی دما
    gloss: هوا سرد نیست، گرمه.
    note: '*Ne ... pas* دور فعل قرار می‌گیرد: *il ne fait pas froid*.'
  fr.a1.unit47.lesson03.teach.la_meteo:
    title: پیش‌بینی هوا
    gloss: پیش‌بینی هوا
    note: '*La météo* مؤنث است و کوتاه‌شده‌ی *la météorologie* است.'
    example_gloss: پیش‌بینی هوا چیه؟
  fr.a1.unit47.lesson03.teach.demain_le_temps:
    title: هوای فردا
    gloss: فردا هوا آفتابیه.
    note: '*Demain* اول جمله می‌آید و بعدش ویرگول؛ بقیه‌ی جمله ترتیب معمولش را حفظ می‌کند.'
  fr.a1.unit47.lesson03.teach.samedi_le_temps:
    title: پیش‌بینی دو روز
    gloss: شنبه هوا آفتابی و گرمه، ولی یکشنبه تمام روز بارون می‌آد.
    note: '*Toute la journée* (تمام روز) نشان می‌دهد باران چقدر طول می‌کشد.'
  fr.a1.unit47.lesson04.teach.la_promenade:
    title: قدم‌زدن
    gloss: آن قدم‌زدن
    note: '*Promenade* مؤنث است: *la promenade*.'
    example_gloss: بریم قدم بزنیم؟
  fr.a1.unit47.lesson04.teach.on_fait_une:
    title: پیشنهاد پیاده‌روی
    gloss: بریم قدم بزنیم؟
    note: '*On fait une promenade ?* روشی دوستانه برای پیشنهاد دادن است؛ *faire une promenade* عبارت ثابتِ «قدم زدن» است.'
  fr.a1.unit47.lesson04.teach.s_il_pleut:
    title: برنامه‌ای مشروط
    gloss: اگه بارون بیاد، تو خونه می‌مونیم.
    note: '*S''il pleut* (اگر باران ببارد): *si* + *il* می‌شود *s''il*؛ بعد با *on reste à l''intérieur* می‌گویید چه کار می‌کنید.'
  fr.a1.unit47.lesson04.teach.bonne_idee_faisons:
    title: موافقت و پیشنهاد
    gloss: فکر خوبیه! بریم قدم بزنیم.
    note: '*Faisons ...* (بیایید ... بکنیم) راه رایج دیگری برای پیشنهاد کار است، در کنار *On ... ?*'
  fr.a1.unit47.lesson05.teach.meteo_samedi_le:
    title: خواندن پیش‌بینی دو روز
    gloss: 'پیش‌بینی هوا: شنبه هوا آفتابی و گرمه. یکشنبه تمام روز بارون می‌آد.'
    note: دقت کنید کدام روز چه وضعیتی دارد.
    glosses:
      Météo: پیش‌بینی هوا
      samedi: شنبه
      ensoleillé: آفتابی
      chaud: گرم
      Dimanche: یکشنبه
      pleut: باران می‌آید
      toute: تمام
      journée: روز
  fr.a1.unit47.lesson06.teach.camille_quel_temps:
    title: کامی از آخر هفته می‌پرسد
    gloss: 'کامی: این آخر هفته هوا چطوره؟'
    note: '*Ce week-end* (این آخر هفته) پرسش را در آینده‌ی نزدیک قرار می‌دهد.'
  fr.a1.unit47.lesson06.teach.mathieu_samedi_le:
    title: ماتیو پیش‌بینی را می‌گوید
    gloss: 'ماتیو: شنبه هوا آفتابی و گرمه، ولی یکشنبه تمام روز بارون می‌آد.'
    note: دقیقاً همان پیش‌بینی‌ای است که در درس خواندیم.
  fr.a1.unit47.lesson06.teach.camille_alors_on:
    title: کامی پیشنهاد می‌دهد
    gloss: 'کامی: پس شنبه بریم قدم بزنیم؟'
    note: '*Alors* (پس) پیشنهاد را مستقیماً به هوای خوبی که ماتیو توصیف کرد وصل می‌کند.'
  fr.a1.unit47.lesson06.teach.mathieu_bonne_idee:
    title: ماتیو موافقت می‌کند و برای یکشنبه برنامه می‌ریزد
    gloss: 'ماتیو: فکر خوبیه. یکشنبه هم راحت تو خونه می‌مونیم.'
    note: '*Tranquillement* اینجا یعنی «با آرامش و بدون عجله» و ماندن در خانه را دلپذیر نشان می‌دهد.'
  fr.a1.unit47.lesson06.teach.camille_parfait_alors:
    title: کامی برنامه را نهایی می‌کند
    gloss: 'کامی: عالیه، پس فیلم می‌بینیم.'
    note: فعل *regarder* (تماشا کردن) به‌طور طبیعی با *un film* (یک فیلم) می‌آید.
