teaching:
  fr.a1.unit44.lesson01.teach.je_ne_me:
    title: احساس ناخوشی
    gloss: حالم خوب نیست.
    note: '*Se sentir* فعل بازتابی است (*je me sens*)؛ *ne ... pas bien* روش کلی و ملایم گفتنِ اینکه حال آدم خوب نیست.'
  fr.a1.unit44.lesson01.teach.malade:
    title: بیمار
    gloss: بیمار
    note: 'صفت پایه که با *être* می‌آید: *je suis malade*.'
    example_gloss: من بیمارم.
  fr.a1.unit44.lesson01.teach.je_suis_malade:
    title: بیمار بودن
    gloss: من بیمارم.
    note: '*Malade* حالتی کلی‌تر و جدی‌تر از *pas bien* را نشان می‌دهد.'
  fr.a1.unit44.lesson01.teach.mal_a_la:
    title: سردرد
    gloss: سردرد
    note: '*Mal à la tête* با *avoir* می‌آید: *j''ai mal à la tête*؛ چون *tête* مؤنث است، *à la* می‌آید.'
    example_gloss: سردرد دارم.
  fr.a1.unit44.lesson01.teach.j_ai_mal:
    title: سردرد داشتن
    gloss: سردرد دارم.
    note: 'نشانه‌های بیماری با *avoir* (داشتن) می‌آیند: *j''ai mal*.'
  fr.a1.unit44.lesson01.teach.mal_au_ventre:
    title: دل‌درد
    gloss: دل‌درد
    note: در *mal au ventre*، *au* از ترکیب *à* و *le* ساخته شده، چون *ventre* مذکر است.
    example_gloss: دل‌درد دارم.
  fr.a1.unit44.lesson01.teach.j_ai_mal_2:
    title: دل‌درد داشتن
    gloss: دل‌درد دارم.
    note: همان الگوی *avoir* در *mal à la tête* است، فقط به‌جای *à la* از *au* استفاده می‌شود.
  fr.a1.unit44.lesson02.teach.qu_est_ce:
    title: پرسیدن به شکل کلی
    gloss: چی شده؟
    note: روشی کلی و همه‌کاره برای پرسیدن اینکه مشکلی هست یا نه.
  fr.a1.unit44.lesson02.teach.qu_est_ce_2:
    title: یک عبارت رایج
    gloss: چته؟ / چی شده؟
    note: '*Qu''est-ce qui ne va pas ?* یک پرسش ثابت است که تحت‌اللفظی یعنی «چه چیزی خوب پیش نمی‌رود»؛ آن را کلمه‌به‌کلمه ترجمه نکنید.'
  fr.a1.unit44.lesson02.teach.mal_a_la:
    title: گلودرد
    gloss: گلودرد
    note: '*Mal à la gorge* مثل *mal à la tête* است: *gorge* مؤنث است، پس *à la* می‌آید.'
    example_gloss: گلودرد دارم.
  fr.a1.unit44.lesson02.teach.j_ai_mal:
    title: گلودرد داشتن
    gloss: گلودرد دارم.
    note: از همان الگوی *avoir* در بقیهٔ نشانه‌های بیماری پیروی می‌کند.
  fr.a1.unit44.lesson02.teach.ca_va_non:
    title: حال کسی را پرسیدن
    gloss: خوبی؟ نه، حالم خوب نیست.
    note: '*Ça va ?* پرسش بسیار رایج و خودمانی میان دوستان برای احوال‌پرسی است.'
  fr.a1.unit44.lesson03.teach.la_fievre:
    title: تب
    gloss: تب
    note: '*La fièvre* مؤنث است و بعد از *avoir* با *de la* می‌آید: *j''ai de la fièvre*.'
    example_gloss: تب دارم.
  fr.a1.unit44.lesson03.teach.j_ai_de:
    title: تب داشتن
    gloss: تب دارم.
    note: از الگوی *avoir* پیروی می‌کند، با حرف تعریف جزئی *de la*.
  fr.a1.unit44.lesson03.teach.le_rhume:
    title: سرما خوردن
    gloss: سرما خورده / سرما خوردن
    note: '*Le rhume* اسم مذکر است و با *avoir* به کار می‌رود، نه صفتی که با *être* بیاید.'
    example_gloss: سرما خورده‌ام.
  fr.a1.unit44.lesson03.teach.j_ai_un:
    title: گفتن اینکه سرما خورده‌اید
    gloss: سرما خورده‌ام.
    note: در فرانسوی می‌گویند *j'ai un rhume* («سرماخوردگی دارم»)؛ *je suis rhume* نمی‌گویند.
  fr.a1.unit44.lesson03.teach.malade_se_dit:
    title: être یا avoir؟
    gloss: '*Malade* صفت است و با *être* می‌آید: من بیمارم. *Mal*، *fièvre* و *rhume* اسم هستند و با *avoir* می‌آیند: سرما خورده‌ام.'
    note: 'انتخاب بین *être* و *avoir* به نوع واژه بستگی دارد: صفتی مثل *malade* با *être* می‌آید و اسمی مثل *fièvre* با *avoir*، هر قدر هم بیماری کوتاه باشد.'
  fr.a1.unit44.lesson04.teach.la_pharmacie:
    title: داروخانه
    gloss: داروخانه
    note: '*Pharmacie* مؤنث است: *la pharmacie*.'
    example_gloss: دارم می‌روم داروخانه.
  fr.a1.unit44.lesson04.teach.je_peux_vous:
    title: احوال‌پرسی داروساز
    gloss: چه کمکی از من برمی‌آید؟
    note: '*Je peux vous aider ?* جملهٔ رسمی و رایج خوشامدگویی در خدمات است؛ *vous* شکل مؤدبانه است.'
  fr.a1.unit44.lesson04.teach.avez_vous_quelque:
    title: چیزی برای یک علامت خواستن
    gloss: برای سردرد چیزی دارید؟
    note: '*Quelque chose contre* + نشانهٔ بیماری روش طبیعی برای خواستن دارو است.'
  fr.a1.unit44.lesson04.teach.un_comprime:
    title: یک قرص
    gloss: قرص
    note: '*Comprimé* مذکر است: *un comprimé*.'
    example_gloss: یک قرص می‌خورم.
  fr.a1.unit44.lesson04.teach.prenez_un_comprime:
    title: دستور مصرف
    gloss: روزی دو بار یک قرص بخورید.
    note: '*Prenez* امر *vous* از فعل *prendre* (گرفتن، خوردن) است و برای دستورالعمل‌ها به کار می‌رود.'
  fr.a1.unit44.lesson04.teach.a_la_pharmacie:
    title: لحن مناسب در داروخانه
    gloss: در داروخانه از شکل مؤدبانهٔ *vous* استفاده می‌کنید.
    note: داروساز یک بزرگسال ناآشنا در نقش خدمات‌دهنده است، پس مثل باجهٔ بلیت، *vous* می‌گویید.
  fr.a1.unit44.lesson05.teach.conseil_prends_un:
    title: خواندن یک توصیه‌نامه‌ی داروخانه
    gloss: 'توصیه: روزی دو بار یک قرص با آب بخورید. خوب استراحت کنید و آب زیاد بنوشید. بعد از سه روز هنوز حالتان خوب نیست؟ پس به پزشک مراجعه کنید.'
    note: به مقدار مصرف دارو، دو توصیه‌ی غیردارویی و زمان مراجعه به پزشک دقت کنید.
    glosses:
      Conseil: توصیه
      prends: بخور
      fois: بار
      jour: روز
      comprimé: قرص
      Repose-toi: استراحت کن
      bois: بنوش
      sens: احساس کردن
      toujours: هنوز
      bien: خوب
      médecin: پزشک
  fr.a1.unit44.lesson06.teach.camille_salut_mathieu:
    title: Camille احوال‌پرسی می‌کند
    gloss: 'Camille: سلام Mathieu، چطوری؟ حالت بهتر شده؟'
    note: '*Déjà* (قبلاً، تا حالا) نشان می‌دهد Camille می‌پرسد آیا از آخرین صحبتشان حال Mathieu بهتر شده است.'
  fr.a1.unit44.lesson06.teach.mathieu_pas_encore:
    title: Mathieu هنوز بیمار است
    gloss: 'Mathieu: هنوز زیاد خوب نیستم. هنوز سردرد دارم و خسته‌ام.'
    note: '*Toujours* (هنوز) نشان می‌دهد سردرد از بین نرفته؛ *fatigué* (خسته) یک صفت جدید و پرکاربرد است.'
  fr.a1.unit44.lesson06.teach.camille_tu_as:
    title: Camille دربارهٔ دارو می‌پرسد
    gloss: 'Camille: قرص خوردی؟'
    note: '*Pris* اسم مفعول *prendre* است و با *as* از *avoir* می‌آید: *tu as pris*.'
  fr.a1.unit44.lesson06.teach.mathieu_oui_j:
    title: Mathieu تأیید می‌کند
    gloss: 'Mathieu: آره، یک قرص خوردم. الان می‌خوام استراحت کنم.'
    note: '*Je vais me reposer* (می‌خواهم استراحت کنم) از *aller* + مصدر برای آیندهٔ نزدیک استفاده می‌کند.'
  fr.a1.unit44.lesson06.teach.camille_bonne_idee:
    title: Camille برایش آرزوی بهبودی می‌کند
    gloss: 'Camille: فکر خوبیه. خوب استراحت کن. زود خوب بشی!'
    note: '*Bon rétablissement !* عبارت ثابت و رایج برای آرزوی بهبودی سریع است.'
  fr.a1.unit44.lesson06.teach.mathieu_merci_a:
    title: Mathieu خداحافظی می‌کند
    gloss: 'Mathieu: مرسی، تا فردا!'
    note: '*À demain !* برای خداحافظی از *à* + زمان استفاده می‌کند: *à demain*، *à bientôt*.'
