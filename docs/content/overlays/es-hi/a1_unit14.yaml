    title: Comparaciones
lessons:
  hi.a1.unit14.lesson01.se_tulna:
    title: Priya es mayor que Arjun
  hi.a1.unit14.lesson02.vastu_tulna:
    title: La gorra es más barata que el bolso
  hi.a1.unit14.lesson03.arjun_priya_tulna:
    title: 'Arjun y Priya: comparaciones'
teaching:
  hi.a1.unit14.lesson01.teach.arjun_priya_review:
    title: 'Repaso: Arjun, Priya, es'
    gloss: Arjun, Priya, es/está
    note: Repaso rápido de los nombres de los dos personajes y de la cópula 'hai', necesarios para formar oraciones comparativas en esta unidad.
    example_gloss:
    - Arjun está bien.
    - Priya está bien.
  hi.a1.unit14.lesson01.teach.bada_badi_review:
    title: 'Repaso: grande / mayor'
    gloss: grande / mayor (masculino / femenino)
    note: Se vio por primera vez en la unidad 5 para la edad de los hermanos; esta unidad lo amplía para comparar directamente a dos personas o cosas cualesquiera.
    example_gloss:
    - Mi hermano mayor vive en Delhi.
    - Mi hermana mayor vive en Delhi.
  hi.a1.unit14.lesson01.teach.chota_choti_review:
    title: 'Repaso: pequeño / menor'
    gloss: pequeño / menor (masculino / femenino)
    note: Se vio por primera vez en la unidad 5 para la edad de los hermanos; aquí se usa igual que bada/badi.
    example_gloss:
    - Mi hermano menor ahora es estudiante.
    - Mi hermana menor ahora es estudiante.
  hi.a1.unit14.lesson01.teach.se_comparative_grammar:
    title: Se = que (comparación)
    gloss: '''Se'' ya se aprendió con el sentido de «desde» (unidad 9, ''yahan se seedhe jao'') y de «con» (unidad 12, ''Priya se mila''). Ahora también sirve para comparar: ''X, Y se ADJ hai'' significa «X es más ADJ que Y», como en ''Priya Arjun se badi hai''.'
    note: Presenta el tercer sentido de una palabra ya conocida, recordando los dos anteriores con su número de unidad antes de introducir el nuevo.
  hi.a1.unit14.lesson01.teach.arjun_bada_phrase:
    title: Priya es mayor que Arjun.
    gloss: Priya es mayor que Arjun.
    note: Primer ejemplo completo de la unidad con la estructura comparativa con se.
  hi.a1.unit14.lesson01.teach.lamba_lambi:
    title: Alto / largo
    gloss: alto / largo (masculino / femenino)
    note: Un nuevo par de adjetivos que sigue el patrón ya conocido de concordancia masculino -a / femenino -i (bada/badi, chota/choti).
    example_gloss:
    - Mi hermano es alto.
    - Mi hermana es alta.
  hi.a1.unit14.lesson01.teach.agreement_grammar:
    title: El adjetivo concuerda con el sujeto
    gloss: En una oración comparativa, el adjetivo (como bada/badi, chota/choti) concuerda siempre con el género del SUJETO, no con la palabra que va después de 'se'. Por ejemplo, en 'Arjun Priya se chota hai', 'chota' concuerda con Arjun (el sujeto masculino), no con Priya.
    note: Ampliación directa y explícita del patrón de concordancia de adjetivos en -a/-i, aplicada a las oraciones comparativas.
  hi.a1.unit14.lesson01.teach.priya_chota_phrase:
    title: Arjun es menor que Priya.
    gloss: Arjun es menor que Priya.
    note: Reformulación complementaria del mismo hecho desde el otro lado; muestra la concordancia con un sujeto masculino.
  hi.a1.unit14.lesson01.teach.kaun_ya_review:
    title: 'Repaso: quién, o'
    gloss: quién, o
    note: Ambas ya se enseñaron (unidad 5 y unidad 6/13); aquí se reutilizan para hacer una pregunta de comparación.
    example_gloss: ¿Quién es mayor, Arjun o Priya?
  hi.a1.unit14.lesson02.teach.topi_bag_review:
    title: 'Repaso: gorra, bolso'
    gloss: gorra, bolso
    note: Ambos sustantivos se vieron en la unidad 7, la de las compras; aquí son las dos cosas que se comparan.
    example_gloss:
    - Esta gorra es bonita.
    - Este bolso es bonito.
  hi.a1.unit14.lesson02.teach.sasta_mehnga_review:
    title: 'Repaso: barato, caro'
    gloss: barato, caro
    note: Se vio por primera vez en la unidad 7; aquí se reutiliza para comparar objetos.
    example_gloss:
    - El bolso es barato.
    - El bolso es caro.
  hi.a1.unit14.lesson02.teach.sasti_mehngi_note:
    title: 'Formas femeninas: sasti, mehngi'
    gloss: '''Sasta'' y ''mehnga'' pasan a ser ''sasti'' y ''mehngi'' con palabras femeninas, como en ''topi sasti hai'' (la gorra es barata).'
    note: Breve recordatorio de la regla de concordancia de género de la unidad 7, necesaria porque 'topi' (gorra) es femenino.
  hi.a1.unit14.lesson02.teach.se_object_phrase:
    title: La gorra es más barata que el bolso.
    gloss: La gorra es más barata que el bolso.
    note: La estructura comparativa con se aplicada a dos objetos en lugar de a dos personas.
  hi.a1.unit14.lesson02.teach.zyada_review:
    title: 'Repaso: más'
    gloss: más
    note: Se vio por primera vez en la unidad 13, solo con 'pasand hai' (para expresar preferencia); esta lección generaliza su uso.
    example_gloss: Me gusta más el té.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_grammar:
    title: Zyada en cualquier comparación
    gloss: 'Antes ''zyada'' solo se había aprendido con ''pasand hai'' (unidad 13). Ahora también puede ir delante de CUALQUIER adjetivo en una comparación: ''bag topi se zyada mehnga hai'' significa «el bolso es más caro que la gorra», igual que ''bag topi se mehnga hai''. ''Zyada'' es opcional; solo expresa «más» de forma explícita.'
    note: Generalización explicada de la posición de una palabra ya conocida; no es un punto gramatical nuevo.
  hi.a1.unit14.lesson02.teach.zyada_mehnga_phrase:
    title: El bolso es más caro que la gorra.
    gloss: El bolso es más caro que la gorra.
    note: La misma estructura comparativa con se, con el opcional zyada (más) escrito de forma explícita.
  hi.a1.unit14.lesson02.teach.naya_nai:
    title: Nuevo
    gloss: nuevo / nueva (masculino / femenino)
    note: Un nuevo par de adjetivos que sigue el mismo patrón de concordancia -a/-i que los demás adjetivos de esta unidad.
    example_gloss:
    - El bolso es nuevo.
    - La gorra es nueva.
  hi.a1.unit14.lesson02.teach.topi_nai_phrase:
    title: La gorra es más nueva que el bolso.
    gloss: La gorra es más nueva que el bolso.
    note: Un segundo atributo comparativo (lo nuevo que es algo) entre los mismos dos objetos, en línea con la comparación de precios ya vista.
  hi.a1.unit14.lesson03.teach.review_words:
    title: 'Repaso: grande, pequeño, alto, nuevo'
    gloss: grande/mayor, pequeño/menor, alto/largo, nuevo
    note: Repaso rápido de los adjetivos clave de esta unidad, necesarios para el diálogo y la nota de lectura.
    example_gloss:
    - Priya es mayor.
    - Arjun es menor.
    - Arjun es alto.
    - El bolso es nuevo.
  hi.a1.unit14.lesson03.teach.main_hun_review:
    title: 'Repaso: yo, soy/estoy'
    gloss: yo, soy/estoy
    note: Se vio por primera vez en la unidad 1 ('main theek hun'); es necesario para que Arjun hable de sí mismo en el diálogo.
    example_gloss: Estoy bien.
  hi.a1.unit14.lesson03.teach.aur_bhi_review:
    title: 'Repaso: y, también'
    gloss: y, también
    note: Ambas palabras han aparecido en diálogos anteriores, pero aquí se presentan por primera vez de forma oficial como vocabulario evaluable.
    example_gloss:
    - Me gustan el té y el café.
    - A mí también me gusta.
  hi.a1.unit14.lesson03.teach.ka_review:
    title: 'Repaso: de (posesión)'
    gloss: de (marca de posesión)
    note: La marca de posesión ya usada a lo largo del curso (por ejemplo, unidades 5-11); aquí se reutiliza para hablar de a quién pertenece el bolso que se compara.
    example_gloss: El bolso de Arjun es nuevo.
  hi.a1.unit14.lesson03.teach.dialogue.line01:
    title: Arjun enseña su bolso nuevo
    gloss: Priya, este es mi bolso nuevo.
  hi.a1.unit14.lesson03.teach.dialogue.line02:
    title: Priya dice que la gorra es más barata
    gloss: ¡Qué bolso tan bonito! Pero la gorra es más barata que un bolso.
  hi.a1.unit14.lesson03.teach.dialogue.line03:
    title: Arjun admite que su bolso es caro
    gloss: 'Sí. Mi bolso es caro: es más caro que una gorra.'
  hi.a1.unit14.lesson03.teach.dialogue.line04:
    title: Priya pregunta quién es mayor
    gloss: ¡Vale, vale! Arjun, ¿quién es mayor, tú o yo?
  hi.a1.unit14.lesson03.teach.dialogue.line05:
    title: Arjun responde
    gloss: Tú eres mayor, ¡pero yo soy alto!
  hi.a1.unit14.lesson03.teach.dialogue.line06:
    title: Priya dice que la gorra también es más nueva
    gloss: ¡Vale, vale! Pero la gorra también es más nueva que el bolso.
  hi.a1.unit14.lesson03.teach.dialogue.line07:
    title: Arjun está de acuerdo y se despide
    gloss: Sí, es verdad. ¿Nos vemos otra vez mañana?
  hi.a1.unit14.lesson03.teach.dialogue.line08:
    title: Priya se despide
    gloss: ¡De acuerdo! Nos vemos mañana.
  hi.a1.unit14.lesson03.teach.grammar_summary:
    title: Tres reglas principales
    gloss: 'Las tres reglas principales de esta unidad: (1) ''X, Y se ADJ hai'' significa «X es más ADJ que Y»; (2) el ADJ concuerda siempre con el género del sujeto (X), no con el de Y; (3) también se puede añadir ''zyada'' antes del ADJ, como en ''X, Y se zyada ADJ hai''; el significado no cambia («más ADJ que»).'
    note: Resumen final que reúne toda la gramática de la unidad, a modo de la nota gramatical de la unidad 13 que unía todo el paradigma.
  hi.a1.unit14.lesson03.teach.priya_note:
    title: La nota de Priya
    gloss: 'Soy mayor que Arjun, pero Arjun es alto. Y mi gorra es bonita: la gorra es más barata que el bolso, y además es más nueva que el bolso. - Priya'
    note: Una breve nota escrita que repite exactamente los hechos ya establecidos en el diálogo, sin afirmaciones nuevas.
    glosses:
      बड़ी: mayor (femenino)
      लंबा: alto
      टोपी: gorra
      अच्छी: bonita / buena (femenino)
      बैग: bolsa
      सस्ती: más barata / barata
      नई: más nueva / nueva
