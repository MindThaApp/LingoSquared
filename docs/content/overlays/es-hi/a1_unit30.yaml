teaching:
  hi.a1.unit30.lesson01.teach.parhna_kasrat_karna:
    title: Leer, hacer deporte, cocinar
    gloss: leer, hacer deporte, cocinar
    note: 'El hindi nombra los pasatiempos con un verbo terminado en *-ना*: *पढ़ना*, *कसरत करना* y *खाना बनाना* (''leer'', ''hacer ejercicio'', ''cocinar'').'
    example_gloss:
    - Me gusta leer un libro.
    - Hago deporte los sábados.
    - Me gusta cocinar para mis amigos.
  hi.a1.unit30.lesson01.teach.khalee_samay:
    title: El tiempo libre
    gloss: tiempo libre
    note: '*खाली समय* (''tiempo vacío'') es la expresión clave para hablar de pasatiempos, y *में* significa ''en'': *खाली समय में*.'
    example_gloss: En mi tiempo libre me gusta leer.
  hi.a1.unit30.lesson01.teach.mujhe_khalee_samay:
    title: Decir qué haces en tu tiempo libre
    gloss: En mi tiempo libre me gusta leer.
    note: '*मुझे ... पढ़ना पसंद है* (''a mí me gusta leer'', literalmente ''a mí leer es agradable'') es la forma de decir ''me gusta leer''; *मुझे* indica a quién le gusta.'
  hi.a1.unit30.lesson02.teach.sangeet_sunna_chitr:
    title: Música, dibujo y videojuegos
    gloss: escuchar música, dibujar, jugar a videojuegos
    note: 'Tres pasatiempos más: *संगीत सुनना*, *चित्र बनाना* y *गेम खेलना*; *गेम* es un préstamo del inglés, como en español.'
    example_gloss:
    - Me gusta escuchar música.
    - Dibujo a menudo.
    - Me gusta jugar a videojuegos con amigos.
  hi.a1.unit30.lesson02.teach.mujhe_sangeet_sunna:
    title: Decir que te gusta escuchar música
    gloss: Me gusta escuchar música.
    note: '*संगीत सुनना* (''escuchar música'') no necesita ninguna palabra extra: el objeto va directamente delante del verbo.'
  hi.a1.unit30.lesson02.teach.mujhe_doston_ke:
    title: Decir que te gusta jugar a videojuegos con amigos
    gloss: Me gusta jugar a videojuegos con amigos.
    note: En *दोस्तों के साथ* ('con amigos'), *दोस्त* está en plural oblicuo (*दोस्तों*) porque va delante de *के साथ*.
  hi.a1.unit30.lesson03.teach.hamesha_aksar_kabheekbhee:
    title: Siempre, a menudo, a veces, nunca
    gloss: siempre, a menudo, a veces, nunca
    note: Las palabras de frecuencia como *हमेशा*, *अक्सर*, *कभी-कभी* y *कभी नहीं* suelen ir antes del verbo, y *कभी नहीं* significa 'nunca'.
    example_gloss:
    - Siempre hago deporte los sábados.
    - A menudo leo un libro.
    - A veces dibujo.
    - Nunca juego a videojuegos.
  hi.a1.unit30.lesson03.teach.har_hafte_har:
    title: Cada semana, cada fin de semana
    gloss: cada semana, cada fin de semana
    note: '*हर* (''cada'') nunca cambia, y la palabra de tiempo que le sigue queda en forma simple: *हर हफ़्ते*, *हर वीकेंड*.'
    example_gloss:
    - Cocino para mis amigos cada semana.
    - Hago deporte cada fin de semana.
  hi.a1.unit30.lesson03.teach.har_hafte_har_2:
    title: हर no cambia
    gloss: Cada semana, cada fin de semana.
    note: '*हर* no cambia, sea cual sea el sustantivo que le sigue, así que no hay que elegir ninguna forma: *हर हफ़्ते*, *हर वीकेंड*.'
  hi.a1.unit30.lesson03.teach.tum_khalee_samay:
    title: Preguntar por el tiempo libre
    gloss: ¿Qué haces en tu tiempo libre?
    note: 'Esta es la pregunta central de la unidad: úsala para preguntar a cualquiera por sus aficiones.'
  hi.a1.unit30.lesson04.teach.priya_ham_aksar:
    title: Priya saca el tema de los pasatiempos
    gloss: 'Priya: Con frecuencia paseamos juntos. Pero, Arjun, ¿qué más haces en tu tiempo libre?'
    note: '*टहलते हैं* va en plural porque el sujeto es *हम* (''nosotros''), y *अक्सर* va antes del verbo.'
  hi.a1.unit30.lesson04.teach.arjun_mujhe_khana:
    title: Los pasatiempos de Arjun
    gloss: 'Arjun: Me gusta cocinar, también en casa. Y hago ejercicio con frecuencia.'
    note: '*घर पर भी* (''también en casa'') muestra que Arjun cocina por gusto, no solo en el trabajo.'
  hi.a1.unit30.lesson04.teach.priya_tum_ghar:
    title: Priya se sorprende
    gloss: 'Priya: ¿Cocinas también en casa? ¡Si ya cocinas todo el día en el trabajo!'
    note: '*पूरा दिन* (''todo el día'') subraya cuánto cocina ya en el trabajo, y *तो* añade énfasis.'
  hi.a1.unit30.lesson04.teach.arjun_han_lekin:
    title: Arjun lo explica
    gloss: 'Arjun: Sí, pero cocinar me relaja. Y a ti, ¿qué te gusta hacer?'
    note: '*खाना बनाने से सुकून मिलता है* significa ''cocinar me relaja'' (literalmente ''de cocinar se recibe calma''); *बनाना* pasa a *बनाने* delante de *से*.'
  hi.a1.unit30.lesson04.teach.priya_mujhe_parhna:
    title: Los pasatiempos de Priya
    gloss: 'Priya: Me gusta leer y con frecuencia escucho música.'
    note: '*और* (''y'') une dos pasatiempos, y *सुनती हूँ* es femenino porque habla Priya.'
  hi.a1.unit30.lesson04.teach.arjun_kya_tum:
    title: Arjun pregunta por los videojuegos
    gloss: 'Arjun: ¿Tú también juegas videojuegos?'
    note: 'Una pregunta corta de sí o no: empieza con *क्या*, y *खेलती हो* es femenino porque Arjun se dirige a Priya.'
  hi.a1.unit30.lesson04.teach.priya_naheen_main:
    title: Priya responde
    gloss: 'Priya: No, yo nunca juego videojuegos. ¡Pero a veces dibujo!'
    note: '*कभी ... नहीं* (''nunca'') y *कभी-कभी* (''a veces'') se contraponen en una misma respuesta.'
  hi.a1.unit30.lesson05.teach.arjun_aur_main:
    title: Comparar aficiones
    gloss: Arjun y yo paseamos juntos con frecuencia. Pero tenemos también otros pasatiempos. A Arjun le gusta cocinar, también en casa, y hace ejercicio con frecuencia. A mí me gusta leer y con frecuencia escucho música. A veces dibujo, pero nunca juego videojuegos. ¿Y a ti, qué te gusta hacer en tu tiempo libre?
    note: El mensaje de Priya repasa datos ya vistos y termina haciendo al lector la pregunta central de la unidad.
    glosses:
      टहलते: pasea
      अक्सर: a menudo
      साथ: juntos
      और: otros
      बनाना: preparar (cocinar)
      पसंद: le gusta
      घर: en casa
      कसरत: hace deporte
      पढ़ना: leer
      सुनती: escucho
      संगीत: música
      चित्र: imagen (dibujo)
      कभी-कभी: a veces
      गेम: juego a videojuegos
      कभी: nunca (con नहीं)
      खाली: libre
      समय: tiempo
  hi.a1.unit30.lesson06.teach.arjun_tum_is:
    title: Arjun pregunta por el fin de semana
    gloss: 'Arjun: ¿Qué haces este fin de semana?'
    note: En *इस वीकेंड* ('este fin de semana'), *इस* va antes del sustantivo, y *कर रही हो* es la forma continua 'estás haciendo', en femenino porque se habla con Priya.
  hi.a1.unit30.lesson06.teach.priya_abhee_pata:
    title: Priya no se decide
    gloss: 'Priya: Todavía no lo sé. Me gusta leer, pero también quiero salir.'
    note: '*बाहर जाना चाहती हूँ* significa ''quiero salir''; *चाहती* es femenino y va después de *जाना*.'
  hi.a1.unit30.lesson06.teach.arjun_chalo_sath:
    title: Arjun propone un plan
    gloss: 'Arjun: ¿Paseamos juntos? Después cocinaré para nosotros.'
    note: '*उसके बाद* (''después de eso'') ordena los dos planes, y *चलो ... टहलें* propone el primero.'
  hi.a1.unit30.lesson06.teach.priya_achchha_aidiya:
    title: Priya acepta
    gloss: 'Priya: ¡Buena idea! Me gusta tanto pasear como cocinar.'
    note: '*दोनों पसंद हैं* muestra que a Priya le gustan ambas cosas por igual, y el verbo va en plural: *हैं*.'
  hi.a1.unit30.lesson06.teach.arjun_barhiya_to:
    title: Arjun lo confirma
    gloss: 'Arjun: Perfecto. ¡Entonces nos vemos el sábado!'
    note: '*शनिवार को मिलते हैं* (''nos vemos el sábado'') usa el presente para un plan fijo, y *को* marca el día.'
