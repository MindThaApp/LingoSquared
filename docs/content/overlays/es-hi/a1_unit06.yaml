answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's own new vocabulary needs no new nasalization-mark decisions -- it only reuses already-settled spellings (हाँ's chandrabindu, तुम्हें/मिलेंगे/हैं/नहीं's anusvara). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit06.food:
    title: Comida y bebida
lessons:
  hi.a1.unit06.lesson01.mujhe_chahiye:
    title: Quisiera...
  hi.a1.unit06.lesson02.khana_aur_matra:
    title: Comida y cantidades
  hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana:
    title: La comida de Priya y Arjun
teaching:
  hi.a1.unit06.lesson01.teach.khana:
    title: La comida
    gloss: comida
    note: La palabra general para «comida», que se usa a lo largo de esta unidad.
    example_gloss: Mi comida ya está lista.
  hi.a1.unit06.lesson01.teach.chai_coffee:
    title: Té, café
    gloss: té, café
    note: Dos bebidas comunes, que se usan en toda la unidad para practicar el patrón *mujhe ... chahiye*.
    example_gloss:
    - Quisiera té.
    - Quisiera café.
  hi.a1.unit06.lesson01.teach.pani_juice:
    title: Agua, zumo
    gloss: agua, zumo
    note: Dos bebidas comunes más; no hay concordancia de género porque *chahiye* no varía.
    example_gloss:
    - Quisiera agua.
    - Quisiera zumo.
  hi.a1.unit06.lesson01.teach.chahiye_note:
    title: Mujhe ... chahiye
    gloss: '*Mujhe ... chahiye* significa «quisiera...». No cambia según el género de quien habla (a diferencia de *chahta/chahti*) y nunca lleva *hai* después.'
    note: El punto gramatical central de esta unidad. Un error muy común entre los estudiantes es añadir *hai* después de *chahiye*, porque casi todas las demás frases que has aprendido terminan así. *Chahiye* ya es un predicado completo por sí solo.
  hi.a1.unit06.lesson01.teach.aapko_kya_chahiye:
    title: ¿Qué desea? (formal)
    gloss: ¿Qué desea?
    note: La pregunta formal con *aap*, que usa un camarero o un anfitrión al dirigirse a alguien con cortesía.
  hi.a1.unit06.lesson01.teach.tumhein_kya_chahiye:
    title: ¿Qué quieres? (informal)
    gloss: ¿Qué desea?
    note: El pronombre en dativo informal con *tum*, paralelo a *mujhe* y a *tumhara/tumhari* de la unidad 5.
  hi.a1.unit06.lesson01.teach.chai_chahiye_shukriya:
    title: Quisiera té, gracias
    gloss: Quisiera té, gracias.
    note: Una respuesta natural y cortés al pedir, que reutiliza *shukriya* de unidades anteriores.
  hi.a1.unit06.lesson01.teach.bahut:
    title: Muy
    gloss: muy, mucho
    note: Un intensificador común, que se usa en toda la unidad para describir comida y bebida.
    example_gloss: Este té está muy bueno.
  hi.a1.unit06.lesson01.teach.swadisht:
    title: Delicioso
    gloss: delicioso, sabroso
    note: Una palabra útil para opinar sobre la comida. En la lección 3 de esta unidad verás por qué nunca cambia según el género.
    example_gloss: Esta comida está muy deliciosa.
  hi.a1.unit06.lesson02.teach.roti_chawal:
    title: Pan, arroz
    gloss: pan plano (roti), arroz
    note: Dos alimentos básicos de una comida india cotidiana.
    example_gloss:
    - Quisiera pan.
    - Quisiera arroz.
  hi.a1.unit06.lesson02.teach.sabzi_daal:
    title: Plato de verduras, lentejas
    gloss: plato de verduras, lentejas (dal)
    note: Dos platos básicos más, que se suelen comer junto con la roti y el arroz.
    example_gloss:
    - Quisiera el plato de verduras.
    - Quisiera lentejas.
  hi.a1.unit06.lesson02.teach.kap_gilas_plate:
    title: Taza, vaso, plato
    gloss: taza, vaso, plato
    note: Recipientes comunes que se usan con *ek* («un/una») para indicar una cantidad al pedir.
    example_gloss:
    - Quisiera una taza de té.
    - Quisiera un vaso de agua.
    - Quisiera un plato de arroz.
  hi.a1.unit06.lesson02.teach.kripya:
    title: Por favor
    gloss: por favor
    note: Una palabra sencilla de cortesía para pedir algo. Suele ir al principio (*kripya mujhe ...*), pero también se oye al final.
    example_gloss: Quisiera una taza de té, por favor.
  hi.a1.unit06.lesson02.teach.kuch_aur_chahiye:
    title: ¿Algo más?
    gloss: ¿Algo más? / ¿Desea algo más?
    note: La pregunta natural que hace un camarero después de tomar parte de un pedido.
  hi.a1.unit06.lesson02.teach.nahin_bas_shukriya:
    title: No, eso es todo, gracias
    gloss: No, eso es todo, gracias.
    note: Una forma natural y cortés de terminar un pedido, que reutiliza *nahin* y *shukriya* de unidades anteriores.
  hi.a1.unit06.lesson02.teach.sabzi_swadisht_phrase:
    title: Este plato de verduras está muy delicioso
    gloss: Este plato de verduras está muy delicioso.
    note: Reutiliza *bahut* y *swadisht* de esta unidad con un nuevo sustantivo de comida, como preparación para la nota gramatical de la lección 3 sobre por qué *swadisht* nunca cambia según el género.
  hi.a1.unit06.lesson03.teach.chalo_khate_hain:
    title: ¡Vamos a comer algo!
    gloss: ¡Vamos a comer algo!
    note: Una forma amistosa y fija de proponer comer juntos, con la que empieza el diálogo final de esta unidad.
  hi.a1.unit06.lesson03.teach.ya:
    title: O
    gloss: o
    note: Una palabra de enlace sencilla, que se usa para ofrecer a elegir entre dos cosas.
    example_gloss: ¿Quieres té o café?
  hi.a1.unit06.lesson03.teach.haan:
    title: Sí
    gloss: sí
    note: Una afirmación sencilla, que se reutiliza en el diálogo final de esta unidad.
    example_gloss: Sí, quisiera té.
  hi.a1.unit06.lesson03.teach.swadisht_invariant_note:
    title: Swadisht nunca cambia
    gloss: '*Swadisht* se queda igual con palabras masculinas y femeninas; no cambia como lo hace *achha/achhi*.'
    note: 'Una excepción importante: a diferencia de los adjetivos con concordancia que ya conoces (achha/achhi, bada/badi, mera/meri), los adjetivos que terminan en consonante, como *swadisht*, nunca cambian según el género.'
  hi.a1.unit06.lesson03.teach.accha_phir_milenge:
    title: Bien, hasta luego
    gloss: ¡Bien! Hasta la próxima.
    note: Una despedida amistosa, reutilizada del vocabulario de despedida de unidades anteriores.
  hi.a1.unit06.lesson03.teach.theek_hai_phir_milte_hain:
    title: De acuerdo, hasta pronto
    gloss: De acuerdo, ¡hasta pronto!
    note: La respuesta informal a la despedida anterior, como en los intercambios de despedida de unidades previas.
  hi.a1.unit06.lesson03.teach.dialogue.line01:
    title: Arjun propone comer
    gloss: Arjun dice que vayan a comer algo.
    note: Reutiliza la frase de apertura de esta unidad.
  hi.a1.unit06.lesson03.teach.dialogue.line02:
    title: Priya le pregunta qué quiere
    gloss: Priya acepta y pregunta qué quiere Arjun.
    note: Reutiliza la pregunta informal *tumhein kya chahiye* de la lección 1.
  hi.a1.unit06.lesson03.teach.dialogue.line03:
    title: Arjun pide comida
    gloss: Arjun dice que quisiera un plato de roti y de verduras.
    note: Combina los sustantivos de comida de esta unidad, el patrón de recipiente *ek plate* y *chahiye*.
  hi.a1.unit06.lesson03.teach.dialogue.line04:
    title: Priya ofrece elegir una bebida
    gloss: Priya dice que qué bien y le pregunta a Arjun si quiere té o café.
    note: Usa el *ya* de esta unidad para ofrecer a elegir entre dos bebidas.
  hi.a1.unit06.lesson03.teach.dialogue.line05:
    title: Arjun elige café
    gloss: Arjun dice que quiere café, por favor.
    note: Retoma *kripya* de la lección 2.
  hi.a1.unit06.lesson03.teach.dialogue.line06:
    title: Priya comenta la comida
    gloss: Priya dice que está bien y que esta comida está muy rica.
    note: Retoma *bahut swadisht* de la lección 1.
  hi.a1.unit06.lesson03.teach.dialogue.line07:
    title: Arjun asiente
    gloss: Arjun dice que sí, muchas gracias.
    note: Retoma *haan* y *shukriya*.
  hi.a1.unit06.lesson03.teach.dialogue.line08:
    title: Priya cierra la conversación
    gloss: Priya dice que qué bien, hasta la próxima.
    note: Retoma la frase de despedida de esta misma lección.
  hi.a1.unit06.lesson03.teach.dialogue.line09:
    title: Arjun responde
    gloss: Arjun asiente y dice hasta pronto.
    note: Retoma la frase de respuesta de esta misma lección.
