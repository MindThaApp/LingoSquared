  hi.a1.unit44.lesson05.teach.abhee_vasant_hai:
    title: Una conversación sobre las estaciones
    gloss: 'Ahora es primavera. Las flores son hermosas. Nina pregunta: ¿Qué estación te parece hermosa? Arjun dice: Me gusta el verano. En verano nadamos. Priya dice: Me gusta el invierno. En invierno patinamos.'
    note: Repasa la conversación del café de idiomas con citas directas, como en otras unidades.
    glosses:
      वसंत: primavera
      फूल: flores
      सुंदर: bonitos
      पूछती: pregunta
      मौसम: estación
      लगता: parecer / sentir (a mí)
      कहता: dice
      गर्मी: verano
      अच्छी: agradable (femenino)
      तैरते: nadamos
      सर्दी: invierno
      स्केटिंग: patinan
  hi.a1.unit44.lesson05.teach.mausam_ke_bare:
    title: La conversación es divertida
    gloss: La conversación sobre las estaciones es divertida.
  hi.a1.unit44.lesson06.teach.vikram_hay_sab:
    title: Vikram se une al grupo
    gloss: 'Vikram: ¡Hola a todos! ¿Qué estación te parece hermosa, Priya?'
  hi.a1.unit44.lesson06.teach.priya_mujhe_sardee:
    title: Priya responde
    gloss: 'Priya: Me gusta el invierno. En invierno patinamos.'
  hi.a1.unit44.lesson06.teach.vikram_mujhe_patjhar:
    title: Vikram responde
    gloss: 'Vikram: El otoño me parece hermoso. El otoño es tranquilo.'
