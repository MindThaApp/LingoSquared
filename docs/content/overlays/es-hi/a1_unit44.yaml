  hi.a1.unit44.lesson03.teach.kisee_mausam_ke:
    title: Dar una opinión sobre una estación
    gloss: '*मुझे* + estación + cualidad + *लगता है* sirve para decir lo que piensas de una estación: *मुझे गर्मी अच्छी लगती है* (Me gusta el verano).'
    note: '*लगता* concuerda con la estación que te gusta, no contigo: *पतझड़* es masculino (*लगता*), *गर्मी* y *सर्दी* son femeninos (*लगती*), y *अच्छा* cambia igual (*अच्छी*).'
