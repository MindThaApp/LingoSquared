teaching:
  hi.a1.unit27.lesson01.teach.khush_udas_naraz:
    title: Contento, triste y enfadado
    gloss: contento, triste, enfadado
    note: '*खुश*, *उदास* y *नाराज़* son palabras básicas de sentimientos que van con *हूँ* o *है* (''soy/estoy'', ''es/está''); no cambian según el género.'
    example_gloss:
    - Estoy contento.
    - Estoy triste.
    - Estoy enfadado.
  hi.a1.unit27.lesson01.teach.main_khush_hoon:
    title: Decir que estás contento
    gloss: Estoy contento.
    note: '*मैं खुश हूँ* sigue el patrón *मैं* + sentimiento + *हूँ*, como «yo estoy ...».'
  hi.a1.unit27.lesson01.teach.main_naraz_naheen:
    title: Contrastar sentimientos
    gloss: No estoy enfadado, estoy triste.
    note: '*नहीं* va justo antes de *हूँ*: *नाराज़ नहीं हूँ*. La segunda parte nombra el sentimiento real.'
  hi.a1.unit27.lesson02.teach.tum_khush_kyon:
    title: Preguntar por qué
    gloss: ¿Por qué estás contento?
    note: '*क्यों* (''por qué'') va antes de la palabra principal: *तुम खुश क्यों हो?*. *तुम* es el «tú» informal.'
  hi.a1.unit27.lesson02.teach.main_khush_hoon:
    title: Dar una razón
    gloss: Estoy contento porque tengo un apartamento nuevo.
    note: '*क्योंकि* introduce la razón. *मेरे पास ... है* significa ''tengo'', y el verbo *है* va al final.'
  hi.a1.unit27.lesson02.teach.main_udas_hoon:
    title: Una razón negativa
    gloss: Estoy triste porque llueve.
    note: '*बारिश हो रही है* es ''está lloviendo'' (literalmente ''la lluvia está ocurriendo'').'
  hi.a1.unit27.lesson03.teach.narvas:
    title: Nervioso
    gloss: nervioso
    note: La palabra habitual para el nerviosismo.
    example_gloss: Estoy nervioso por mi primer turno.
  hi.a1.unit27.lesson03.teach.main_apnee_pahlee:
    title: Decir por qué estás nervioso
    gloss: Estoy nervioso por mi primer turno.
    note: '*को लेकर* significa ''sobre, acerca de'' y va después del sustantivo: *शिफ़्ट को लेकर*. *अपनी* (''mi propia'') concuerda con el femenino *शिफ़्ट*.'
  hi.a1.unit27.lesson03.teach.chinta_mat_karo:
    title: Tranquilizar a alguien
    gloss: No te preocupes.
    note: '*चिंता मत करो* es el amistoso «no te preocupes»: *मत* + *करो* es el imperativo de *तुम* en negativo.'
  hi.a1.unit27.lesson04.teach.arjun_kaisa_mahsoos:
    title: Preguntar cómo se siente alguien
    gloss: ¿Cómo se siente Arjun?
    note: '*कैसा महसूस कर रहा है* pregunta ''cómo se siente''. *कैसा* concuerda con la persona, así que para una mujer se dice *कैसी*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_mahsoos:
    title: Describir cómo se siente alguien
    gloss: Él se siente nervioso.
    note: 'En hindi no hay una palabra aparte para ''se'' aquí: *वह नर्वस महसूस कर रहा है* usa simplemente *वह* y *रहा है*.'
  hi.a1.unit27.lesson04.teach.vah_narvas_kyon:
    title: Preguntar por qué alguien se siente así
    gloss: ¿Por qué se siente nervioso?
    note: '*क्यों* va justo antes de la locución verbal: *वह नर्वस क्यों महसूस कर रहा है?*'
  hi.a1.unit27.lesson05.teach.hay_priya_main:
    title: Lee un mensaje sobre sentimientos
    gloss: 'Hola, Priya: estoy un poco nervioso por mi primer turno solo. Pero también estoy contento, porque tengo un trabajo nuevo y un piso nuevo. Creo que todo irá bien.'
    note: Fíjate en por qué está nervioso el autor, qué lo hace feliz y cómo ve el futuro en general.
    glosses:
      थोड़ा: un poco
      नर्वस: nervioso
      पहली: primer
      शिफ़्ट: turno
      अकेले: solo
      खुश: contento
      क्योंकि: porque
      नई: nuevo
      नौकरी: trabajo
      नया: nuevo
      फ़्लैट: apartamento
      लगता: creo
      होगा: irá (bien)
  hi.a1.unit27.lesson06.teach.priya_hay_arjun:
    title: Priya pregunta cómo se siente Arjun
    gloss: 'Priya: Hola, Arjun, ¿cómo te sientes con tu primer turno?'
    note: 'Se usa otra vez *को लेकर*: *अपनी पहली शिफ़्ट को लेकर* (''sobre tu primer turno''). *तुम* es informal.'
  hi.a1.unit27.lesson06.teach.arjun_sach_kahoon:
    title: Arjun admite que está nervioso
    gloss: 'Arjun: La verdad es que estoy un poco nervioso.'
    note: '*सच कहूँ तो* (''si digo la verdad'') suaviza una confesión.'
  hi.a1.unit27.lesson06.teach.priya_chinta_mat:
    title: Priya lo tranquiliza
    gloss: 'Priya: No te preocupes, ¡puedes hacerlo bien!'
    note: '*तुम यह अच्छे से कर सकते हो* significa ''puedes hacer esto bien'', y *अच्छे से* es ''bien''.'
  hi.a1.unit27.lesson06.teach.arjun_shukriya_isse:
    title: Arjun le da las gracias
    gloss: 'Arjun: Gracias, eso ayuda de verdad.'
    note: '*इससे मदद मिलती है* es literalmente ''de esto se recibe ayuda'': quien ayuda se marca con *से*.'
  hi.a1.unit27.lesson06.teach.priya_aur_bad:
    title: Priya predice el resultado
    gloss: 'Priya: Y después seguro que estarás muy contento y orgulloso.'
    note: '*ज़रूर* (''seguro'') hace la predicción más firme, y *तुम्हें गर्व होगा* es ''sentirás orgullo''.'
  hi.a1.unit27.lesson06.teach.arjun_han_mujhe:
    title: Arjun está de acuerdo
    gloss: 'Arjun: Sí, yo también lo creo.'
    note: '*मुझे भी ऐसा ही लगता है* (''a mí también me parece así'') es la forma natural de mostrar acuerdo, y *मुझे* marca quién lo siente.'
  hi.a1.unit27.lesson06.teach.arjun_narvas_hai:
    title: 'Pronombres: उसकी'
    gloss: Arjun está nervioso. Priya lo ayuda.
    note: '*उसकी* significa ''su'' (de él o de ella) y concuerda con el femenino *मदद*, así que *उसकी मदद करना* es ''ayudarlo''; *है* y *करती है* son los verbos de la tercera persona.'
