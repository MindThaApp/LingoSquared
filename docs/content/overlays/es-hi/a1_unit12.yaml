teaching:
  hi.a1.unit12.lesson01.teach.vyast_review:
    title: 'Repaso: ocupado'
    gloss: ocupado
    note: 'Un repaso rápido del adjetivo de la unidad 11: esta unidad lo reutiliza para practicar la nueva cópula en pasado.'
    example_gloss: Arjun está ocupado.
  hi.a1.unit12.lesson01.teach.tha_thi:
    title: Era / estaba (masculino / femenino)
    gloss: era / estaba
    note: El pasado de la cópula (ser/estar), equivalente en pasado de hai/hoon/hain. 'Tha' concuerda con un sujeto masculino y 'thi' con uno femenino.
    example_gloss:
    - Arjun estaba ocupado ayer.
    - Priya estaba ocupada ayer.
  hi.a1.unit12.lesson01.teach.tha_thi_grammar:
    title: Tha y thi
    gloss: '''Tha'' va con un sujeto masculino y ''thi'' con uno femenino: ocupan el lugar de ''hai'', pero, a diferencia de ''hai'', cambian según el género: Arjun está ocupado, Arjun estaba ocupado, Priya estaba ocupada.'
    note: Presenta de forma explícita el patrón de concordancia de género, ampliando al pasado la cópula que ya conoces.
  hi.a1.unit12.lesson01.teach.kal_review:
    title: 'Repaso: ayer'
    gloss: ayer
    note: Se vio por primera vez en la unidad 4, donde se indicó que 'kal' significa tanto «mañana» como «ayer», y que solo el tiempo del verbo los distingue. Esta es la primera unidad del curso que usa su sentido de pasado («ayer»).
    example_gloss: Ayer fue sábado.
  hi.a1.unit12.lesson01.teach.kaisa:
    title: Cómo (masculino)
    gloss: cómo
    note: 'Completa un paradigma del que ya conoces dos tercios: ''kaise'' y ''kaisi'' (de «¿cómo estás?» de la unidad 1) ya se vieron; esta es la forma masculina singular que faltaba, que se usa con sujetos como ''din'' (día).'
    example_gloss: ¿Cómo fue el día?
  hi.a1.unit12.lesson01.teach.kal_kaisa_tha_phrase:
    title: ¿Cómo fue ayer?
    gloss: ¿Cómo fue ayer?
    note: La pregunta central que se repite en esta unidad, y que combina todas las palabras vistas hasta ahora en esta lección.
  hi.a1.unit12.lesson01.teach.din_achha_tha_phrase:
    title: El día fue bueno.
    gloss: El día fue bueno.
    note: Una respuesta lista para usar a «¿Cómo fue ayer?», con la forma masculina (din es masculino).
  hi.a1.unit12.lesson01.teach.filma_achi_thi:
    title: La película fue buena.
    gloss: La película fue buena.
    note: El mismo patrón con un sujeto femenino (film es femenino), que retoma el vocabulario de la unidad 11.
  hi.a1.unit12.lesson01.teach.kaisa_kaisi_grammar:
    title: Kaisa, kaisi, kaise
    gloss: '''Kaisa'' va con un sujeto masculino singular (¿Cómo fue el día?), ''kaisi'' con uno femenino (¿Cómo estuvo el té?) y ''kaise'' se usa con aap/tum al preguntar a un hombre (¿Cómo estás?; a una mujer: ''aap kaisi hain?''). Las tres son formas de la misma palabra.'
    note: 'Reúne por primera vez el paradigma completo: kaise/kaisi ya se conocían de la unidad 1 y kaisa es la novedad de esta lección.'
  hi.a1.unit12.lesson02.teach.names_mai_review:
    title: 'Repaso: yo, Arjun, Priya'
    gloss: yo, Arjun, Priya
    note: Un repaso rápido antes de los primeros ejemplos de pasado en primera persona de esta lección.
    example_gloss:
    - Yo soy Arjun.
    - Yo soy Priya.
  hi.a1.unit12.lesson02.teach.jaana_gaya_gai:
    title: Fue (masculino / femenino)
    gloss: fue
    note: El pasado de 'jaana' (ir), la misma raíz que ya viste en el imperativo 'jao' («¡ve!») en la unidad 9. Concuerda con el género del sujeto, igual que 'tha'/'thi'.
    example_gloss:
    - Arjun fue al mercado.
    - Priya fue a casa.
  hi.a1.unit12.lesson02.teach.jaana_grammar:
    title: Gaya/gai = pasado de jaana
    gloss: '''Gaya''/''gai'' es el pasado de ''jaana'' (ir; jao en la unidad 9) y cambia según el género del sujeto, igual que ''tha''/''thi''.'
    note: Enlaza de forma explícita el nuevo pasado con la raíz del imperativo que ya conoces.
  hi.a1.unit12.lesson02.teach.bazaar_ghar_review:
    title: 'Repaso: mercado, casa'
    gloss: mercado, casa
    note: Un repaso rápido de dos palabras de lugar de las unidades 7 y 8, necesarias para decir adónde fue alguien.
    example_gloss:
    - Este es el mercado.
    - Esta es la casa.
  hi.a1.unit12.lesson02.teach.milna_mila_mili:
    title: Se encontró con (masculino / femenino)
    gloss: se encontró con
    note: El pasado de 'milna' (encontrarse, reunirse), la misma raíz que ya viste en el habitual 'milte hain' de las despedidas de las unidades 1, 4, 10 y 11. Concuerda con el género del sujeto.
    example_gloss:
    - Arjun se encontró con Priya.
    - Priya se encontró con Arjun.
  hi.a1.unit12.lesson02.teach.milna_se_grammar:
    title: Aquí 'se' significa «con», no «de»
    gloss: 'Aquí ''se'' no significa ''de'': ''X se milna'' significa ''encontrarse CON X'', mientras que en ''main Bharat se hoon'' la misma palabra ''se'' significaba ''de''.'
    note: Un uso doble real de una palabra ya aprendida, explicado de forma explícita.
  hi.a1.unit12.lesson02.teach.wahan_review:
    title: 'Repaso: allí'
    gloss: allí
    note: Un repaso rápido de las unidades 8 y 9, usado aquí para decir dónde tuvo lugar un encuentro.
    example_gloss: La escuela está allí.
  hi.a1.unit12.lesson02.teach.kal_bazaar_gaya_phrase:
    title: Ayer fui al mercado.
    gloss: Ayer fui al mercado.
    note: Combina el nuevo pasado de esta lección con 'kal' de la lección 1.
  hi.a1.unit12.lesson02.teach.wahan_priya_se_mila_phrase:
    title: Allí me encontré con Priya.
    gloss: Allí me encontré con Priya.
    note: Combina el 'mila' de esta lección con 'se' ('con') y 'wahan' (allí).
  hi.a1.unit12.lesson02.teach.saath_review:
    title: 'Repaso: juntos'
    gloss: juntos
    note: Un repaso rápido de la unidad 11.
    example_gloss: Tomamos té juntos.
  hi.a1.unit12.lesson03.teach.chai_dukaan_khana_review:
    title: 'Repaso: té, tienda, comida'
    gloss: té, tienda, comida
    note: Un repaso rápido de tres sustantivos de las unidades 6 y 7, necesarios para el diálogo y la nota de lectura de esta lección.
    example_gloss:
    - El té es bueno.
    - La tienda es buena.
    - La comida es buena.
  hi.a1.unit12.lesson03.teach.ka_kaisi_review:
    title: 'Repaso: ''de'' (ka), cómo (femenino)'
    gloss: de (ka), cómo (femenino, kaisi)
    note: '''Ka'' (visto antes en ''kitne ka'' y en ''raat ka khana'' de la unidad 10) y ''kaisi'' (visto antes) se reutilizan aquí; no son gramática nueva.'
    example_gloss:
    - El día de ayer fue bueno.
    - ¿Cómo fue la tienda de té?
  hi.a1.unit12.lesson03.teach.dialogue.line01:
    title: Arjun pregunta cómo fue ayer
    gloss: Priya, ¿cómo fue ayer?
  hi.a1.unit12.lesson03.teach.dialogue.line02:
    title: Priya dice que fue bueno
    gloss: ¡Muy bien! Nos encontramos.
  hi.a1.unit12.lesson03.teach.dialogue.line03:
    title: Arjun menciona el mercado
    gloss: ¡Sí! Yo también fui primero al mercado.
  hi.a1.unit12.lesson03.teach.dialogue.line04:
    title: Priya pregunta por el mercado
    gloss: ¡Qué bien! ¿Qué había en el mercado?
  hi.a1.unit12.lesson03.teach.dialogue.line05:
    title: Arjun responde
    gloss: La comida estaba buena.
  hi.a1.unit12.lesson03.teach.dialogue.line06:
    title: Priya pregunta por la tienda de té
    gloss: ¡Qué bien! ¿Y cómo era la tienda de té?
  hi.a1.unit12.lesson03.teach.dialogue.line07:
    title: Arjun responde
    gloss: La tienda de té era muy buena.
  hi.a1.unit12.lesson03.teach.dialogue.line08:
    title: Priya se despide
    gloss: ¡Qué bien! Entonces, ¿nos vemos otra vez mañana?
  hi.a1.unit12.lesson03.teach.mile_grammar:
    title: Tum/hum/ve toman la forma de plural en el pasado
    gloss: 'Con ''tum'', ''hum'' y ''ve'', el pasado usa la misma forma que el presente con ''-te'': ''the'' (en lugar de ''tha''), ''gaye'' (en lugar de ''gaya''), ''mile'' (en lugar de ''mila''); así, ''hum milte hain'' pasa a ''hum mile''.'
    note: Presenta el paradigma completo para una buena comprensión, aunque en los ejercicios de esta unidad solo se practica 'mile'; 'the' y 'gaye' son solo de reconocimiento y aparecen únicamente en la explicación de esta nota.
  hi.a1.unit12.lesson03.teach.priya_note:
    title: La nota de Priya
    gloss: Arjun, ayer fue un día muy bueno. La comida estaba buena y la tienda de té también era buena. - Priya
    note: Una nota escrita breve que repite los datos que acaba de establecer el diálogo, sin vocabulario nuevo.
    glosses:
      कल: ayer
      दिन: día
      अच्छा: bueno (masculino)
      था: era / fue (masculino)
      खाना: comida
      दुकान: tienda
      अच्छी: buena (femenino)
      थी: era / fue (femenino)
