answer_policy:
  gender_agreement: 'This unit''s central grammar point (habitual present, verb stem + -ता/-ती/-ते + हूँ/हो/है/हैं) is grammatically gendered by the subject. For any exercise where the subject is a NAMED character with an established gender (Arjun: masculine: Priya: feminine), `accepted_answers` contains only that character''s single correct gendered form. For any exercise where the subject is the LEARNER themselves (a self-description prompt phrased with "तुम"/"अपनी"), `accepted_answers` deliberately includes BOTH the masculine and the feminine conjugated forms as equally correct -- the app has no signal of the learner''s own gender, and marking only one form correct would wrongly fail roughly half of all learners regardless of which gendered form the exercise happened to be authored around first.'
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit introduces no new nasalized vocabulary at all -- the only nasalized form used anywhere in this unit is हूँ, reused unchanged from its already-settled unit01 spelling. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation, nasalization marks, or (for self-description prompts) which grammatically correct gendered form the learner produces.
course:
  title: Hindi A1
units:
  hi.a1.unit10.routines:
    title: Rutina diaria
lessons:
  hi.a1.unit10.lesson01.uthna_nashta_kaam:
    title: Levantarse, desayuno, ir al trabajo
  hi.a1.unit10.lesson02.tum_kab_uthte_ho:
    title: ¿Cuándo te levantas?
  hi.a1.unit10.lesson03.priya_arjun_dincharya:
    title: 'Priya y Arjun: la rutina diaria'
teaching:
  hi.a1.unit10.lesson01.teach.review_time:
    title: 'Repaso: en punto, mañana, mediodía, tarde, noche, a'
    gloss: en punto, mañana, mediodía, tarde, noche, a (tiempo, uso general)
    note: 'Un repaso rápido de las palabras de tiempo de la unidad 4: en esta unidad se usan mucho.'
    example_gloss:
    - Ahora son las 8 de la mañana.
    - Por la noche no hay clase.
  hi.a1.unit10.lesson01.teach.uthna:
    title: Me levanto
    gloss: me levanto (hablante masculino / femenina)
    note: 'El primer verbo en presente habitual de esta unidad: amplía el patrón -ta/-tee visto en la unidad 5 (rahta hai/rahtee hai) a la primera persona, con hoon.'
    example_gloss:
    - Me levanto a las 7 de la mañana.
    - Me levanto a las 6 de la mañana.
  hi.a1.unit10.lesson01.teach.roz:
    title: Cada día
    gloss: cada día
    note: Un adverbio nuevo para describir rutinas.
    example_gloss: Me levanto por la mañana todos los días.
  hi.a1.unit10.lesson01.teach.nashta_karna:
    title: Desayuno
    gloss: desayuno (hablante masculino / femenina)
    note: «Nashta» (desayuno) se combina con «karta/kartee hoon» (hago).
    example_gloss:
    - Por la mañana desayuno.
    - Por la mañana desayuno.
  hi.a1.unit10.lesson01.teach.kaam_par_jaana:
    title: Voy al trabajo
    gloss: voy al trabajo (hablante masculino / femenina)
    note: '«Kaam par jaana» (ir al trabajo) necesita la palabra «par» (en/a): es una expresión fija, a diferencia de «school jaana» más adelante en esta unidad, que no necesita ninguna palabra extra.'
    example_gloss:
    - Luego voy al trabajo.
    - Luego voy al trabajo.
  hi.a1.unit10.lesson01.teach.habitual_paradigm_note:
    title: El patrón del presente habitual
    gloss: 'Para describir un hábito diario, el verbo toma -ta/-tee/-te y se añade hoon/ho/hai/hain según el sujeto: yo me levanto (masculino/femenino) «hoon», tú te levantas «ho», él/ella se levanta «hai», ellos se levantan «hain».'
    note: Presenta el patrón completo desde el principio (ya entrevisto en el diálogo de la unidad 1 y formalizado para la tercera persona en la unidad 5), para que los ejercicios de esta lección no pidan adivinar una forma que no se ha enseñado.
  hi.a1.unit10.lesson01.teach.full_routine_phrase:
    title: Mi mañana, paso a paso
    gloss: Me levanto a las 7 todas las mañanas, luego desayuno y luego voy al trabajo.
    note: Reúne los tres verbos de rutina de esta lección en una oración natural y ordenada.
  hi.a1.unit10.lesson02.teach.sona:
    title: Duermo
    gloss: duermo (hablante masculino / femenina)
    note: El mismo patrón -ta/-tee + hoon aplicado a un verbo nuevo.
    example_gloss:
    - Me duermo a las 11 de la noche.
    - Me duermo a las 10 de la noche.
  hi.a1.unit10.lesson02.teach.school_jaana:
    title: Voy a la escuela
    gloss: voy a la escuela (hablante masculino / femenina)
    note: A diferencia de «kaam par jaana», «school jaana» no necesita ninguna palabra extra antes de «jaana».
    example_gloss:
    - Voy a la escuela a las 8 todas las mañanas.
    - Voy a la escuela a las 8 todas las mañanas.
  hi.a1.unit10.lesson02.teach.tum_form_note:
    title: 'La forma tum: -te/-tee + ho'
    gloss: 'Con «tum» (tú, informal), el verbo toma -te/-tee y «ho»: te levantas (preguntando a un hombre) / te levantas (preguntando a una mujer), duermes (preguntando a un hombre) / duermes (preguntando a una mujer).'
    note: La parte de segunda persona del mismo paradigma presentado en la lección 1.
  hi.a1.unit10.lesson02.teach.addressee_gender_note:
    title: ¿Con el género de quién concuerda la forma tum?
    gloss: 'El verbo en forma tum concuerda con el género de la persona a quien se pregunta, no con el de quien habla: a Priya, «¿Cuándo te levantas?» (forma femenina); a Arjun, «¿Cuándo te levantas?» (forma masculina).'
    note: Un punto fácil de pasar por alto, comprobado en todas las líneas con forma tum del diálogo de la lección 3.
  hi.a1.unit10.lesson02.teach.kab_uthte_ho_phrase:
    title: ¿Cuándo te levantas?
    gloss: ¿Cuándo te levantas? (a un hombre)
    note: Una pregunta lista para usar con la nueva forma tum de esta lección.
  hi.a1.unit10.lesson02.teach.pahle_phir_routine:
    title: Primero me levanto, luego desayuno
    gloss: Primero me levanto, luego desayuno.
    note: Reutiliza «pahle»/«phir» (primero/luego) de las indicaciones de la unidad 9 para ordenar los pasos de una rutina.
  hi.a1.unit10.lesson02.teach.kaam_idiom_note:
    title: Kaam par frente a school
    gloss: '«Kaam par jaana» (ir al trabajo) necesita «par», pero «school jaana» (ir a la escuela) no necesita ninguna palabra extra: ambas son correctas y comunes.'
    note: Una diferencia idiomática real, no una regla general con una excepción.
  hi.a1.unit10.lesson03.teach.vaapas:
    title: De vuelta
    gloss: de vuelta
    note: Se usa con «aana» (venir) para decir «volver».
    example_gloss: Vuelvo.
  hi.a1.unit10.lesson03.teach.aana:
    title: Vengo
    gloss: vengo (hablante masculino / femenina)
    note: Un verbo nuevo que sigue el mismo patrón de presente habitual ya establecido.
    example_gloss:
    - Vuelvo por la tarde.
    - Vuelvo por la tarde.
  hi.a1.unit10.lesson03.teach.khana_verb:
    title: Como (comida)
    gloss: como (hablante masculino / femenina)
    note: '«Khana», el sustantivo (comida, de la unidad 6), más «khana», el verbo (comer): una repetición natural en hindi, no una errata.'
    example_gloss:
    - Por la noche como.
    - Por la noche como.
  hi.a1.unit10.lesson03.teach.raat_ka_khana:
    title: La cena
    gloss: 'cena (literalmente: «comida de la noche»)'
    note: Reutiliza «raat» (noche), «ka» (posesivo) y «khana» (comida), todas ya enseñadas.
    example_gloss: La cena está muy rica.
  hi.a1.unit10.lesson03.teach.dialogue.line01:
    title: Arjun pregunta a qué hora se levanta Priya
    gloss: Arjun le pregunta a Priya a qué hora se levanta todos los días.
    note: Usa la forma tum femenina, dirigida correctamente a Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line02:
    title: Priya responde
    gloss: 'Priya dice: me levanto a las 6 todas las mañanas. Luego desayuno.'
  hi.a1.unit10.lesson03.teach.dialogue.line03:
    title: Arjun cuenta su propia rutina
    gloss: 'Arjun dice: ¡qué bien! Yo me levanto a las 7. Yo también desayuno y luego voy al trabajo.'
  hi.a1.unit10.lesson03.teach.dialogue.line04:
    title: Priya pregunta cuándo vuelve Arjun
    gloss: Priya le pregunta a Arjun cuándo vuelve.
    note: Usa la forma tum masculina, dirigida correctamente a Arjun. Presenta «vaapas aana» en contexto.
  hi.a1.unit10.lesson03.teach.dialogue.line05:
    title: Arjun describe su tarde
    gloss: 'Arjun dice: vuelvo a las 6 de la tarde. Luego ceno y luego me duermo.'
  hi.a1.unit10.lesson03.teach.dialogue.line06:
    title: Priya describe su tarde
    gloss: 'Priya dice: Yo también vuelvo por la tarde, y entonces ceno.'
  hi.a1.unit10.lesson03.teach.dialogue.line07:
    title: Arjun pregunta a qué hora se acuesta Priya
    gloss: Arjun pregunta a qué hora duerme Priya.
    note: De nuevo la forma femenina de tum, dirigida correctamente a Priya.
  hi.a1.unit10.lesson03.teach.dialogue.line08:
    title: Priya responde y se despide
    gloss: 'Priya dice: Me acuesto a las 11 de la noche. Vale, ¡hasta mañana!'
  hi.a1.unit10.lesson03.teach.dialogue.line09:
    title: Arjun se despide
    gloss: 'Arjun dice: Vale, ¡nos vemos!'
