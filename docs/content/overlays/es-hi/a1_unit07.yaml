answer_policy:
  nasalization_marks: 'Display and teach the correct chandrabindu/anusvara distinction. This unit''s own new vocabulary needs one new, explicitly disclosed spelling decision: महंगा/महंगी ("expensive") uses अनुस्वार (ं), not चंद्रबिंदु -- this is a class-nasal-before-a-stop-consonant case (the same pattern as गंगा/मंगल), not an application of the existing word-final vowel-height convention that governs हूँ/हाँ/मैं/हैं/में. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
units:
  hi.a1.unit07.shopping:
    title: De compras
lessons:
  hi.a1.unit07.lesson01.dukaan_mein:
    title: En la tienda
  hi.a1.unit07.lesson02.keemat_aur_matra:
    title: Precio y cantidad
  hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari:
    title: Priya y Arjun van de compras
teaching:
  hi.a1.unit07.lesson01.teach.dukaan_bazaar:
    title: Tienda, mercado
    gloss: tienda, mercado
    note: Dos lugares habituales para comprar cosas, que se usan a lo largo de toda la unidad.
    example_gloss:
    - Esto es una tienda.
    - Esto es un mercado.
  hi.a1.unit07.lesson01.teach.dukaandaar:
    title: Tendero
    gloss: tendero
    note: 'Un personaje nuevo en esta unidad: la persona que atiende una tienda. Se le habla de aap porque es un desconocido.'
    example_gloss: Este es el tendero.
  hi.a1.unit07.lesson01.teach.kameez_bag_topi:
    title: Camisa, bolso, sombrero
    gloss: camisa, bolso, sombrero
    note: Tres artículos habituales de compras, que se usan en toda la unidad para practicar el patrón *mujhe ... chahiye* de la unidad de comida.
    example_gloss:
    - Quiero una camisa.
    - Quiero un bolso.
    - Quiero un sombrero.
  hi.a1.unit07.lesson01.teach.mujhe_yah_chahiye:
    title: Quiero esto
    gloss: Quiero esto.
    note: Una frase general para pedir un artículo; retoma *mujhe ... chahiye* de la unidad de comida con *yah* (esto).
  hi.a1.unit07.lesson01.teach.ji:
    title: Ji (tratamiento de cortesía)
    gloss: partícula de cortesía o respeto, como añadir «señor» o «señora»
    note: Se añade después de un nombre o un título para sonar más educado; es habitual al dirigirse a un desconocido, como un tendero.
    example_gloss: Buenos días, señor tendero.
  hi.a1.unit07.lesson01.teach.sirf:
    title: Solo
    gloss: solo, solamente
    note: Se usa para decir que quieres una sola cosa, no varias.
    example_gloss: Solo quiero una camisa.
  hi.a1.unit07.lesson01.teach.aapko_aur_kuch_chahiye:
    title: ¿Desea algo más? (formal)
    gloss: ¿Desea algo más?
    note: Es la pregunta formal y natural que hace un tendero después de atender parte de un pedido; reutiliza *aapko* y *chahiye*.
  hi.a1.unit07.lesson01.teach.ji_nahin_sirf_yah:
    title: No, solo esto
    gloss: No, solo esto.
    note: Una forma natural y educada de rechazar más artículos; reutiliza *ji* y *sirf* de esta lección.
  hi.a1.unit07.lesson01.teach.tumhein_kya_chahiye_bataao:
    title: Dime qué quieres
    gloss: Dime qué quieres.
    note: La frase informal que usa este curso para pedir una respuesta hablada; coincide con la versión de la unidad de comida.
  hi.a1.unit07.lesson02.teach.keemat:
    title: Precio
    gloss: precio
    note: Se retoma del contenido de números y precios de la unidad 2 y se vuelve a enseñar aquí en el contexto de las compras.
    example_gloss: ¿Cuál es su precio?
  hi.a1.unit07.lesson02.teach.rupaye:
    title: Rupias
    gloss: rupias
    note: La palabra de la moneda, retomada de la unidad 2; ahora se practica con dos precios distintos.
    example_gloss:
    - Su precio es de doscientas rupias.
    - Su precio es de quinientas rupias.
  hi.a1.unit07.lesson02.teach.iski_keemat_kya_hai:
    title: ¿Cuál es su precio?
    gloss: ¿Cuál es su precio?
    note: La forma habitual de preguntar un precio, retomada directamente de la unidad 2.
  hi.a1.unit07.lesson02.teach.iski_keemat_bees_rupaye_hai:
    title: Su precio es de doscientas rupias
    gloss: Su precio es de doscientas rupias.
    note: Un ejemplo de respuesta a la pregunta sobre el precio de arriba.
  hi.a1.unit07.lesson02.teach.kitne_ka_ki_note:
    title: Kitne ka / kitne ki
    gloss: «Yah kitne ka hai?» se usa para cosas masculinas y «Yah kitne ki hai?» para cosas femeninas. *kitne* nunca cambia; solo cambia *ka/ki*, la misma alternancia -a/-i que ya conoces de *mera/meri* y *tumhara/tumhari*.
    note: 'Una segunda forma, muy común, de preguntar un precio; sigue el mismo patrón de concordancia de género de los posesivos: solo cambia la partícula ka/ki, no kitne.'
  hi.a1.unit07.lesson02.teach.yeh_kitne_ka_hai:
    title: ¿Cuánto cuesta esto? (masculino)
    gloss: ¿Cuánto cuesta esto?
    note: Se usa para un objeto masculino, como una bolsa.
  hi.a1.unit07.lesson02.teach.yeh_kitne_ki_hai:
    title: ¿Cuánto cuesta esto? (femenino)
    gloss: ¿Cuánto cuesta esto?
    note: Se usa para un objeto femenino, como un sombrero.
  hi.a1.unit07.lesson02.teach.sasta_mehenga:
    title: Barato, caro
    gloss: barato, caro
    note: Un par de adjetivos muy común para reaccionar ante un precio; aquí se muestran las formas masculinas.
    example_gloss:
    - Este bolso es barato.
    - Este bolso es caro.
  hi.a1.unit07.lesson02.teach.sasti_mehengi_note:
    title: Sasti y mehengi
    gloss: '«Sasta» y «mehenga» también cambian según sean masculinos o femeninos, como «mera/meri»: con palabras femeninas decimos «sasti» y «mehengi», como en «yah topi sasti hai» (este sombrero es barato) o «yah kameez mehengi hai» (esta camisa es cara).'
    note: Otro ejemplo real del mismo patrón de concordancia de género que este curso señala una y otra vez.
  hi.a1.unit07.lesson03.teach.khareedna:
    title: Comprar
    gloss: comprar
    note: Retoma la construcción «verbo + na chahta/chahti hun» (quiero...) que se enseñó en la unidad 1 con el yoga; ahora se aplica a comprar.
    example_gloss:
    - Quiero comprar esta camisa.
    - Quiero comprar este sombrero.
  hi.a1.unit07.lesson03.teach.chalo_kuch_khareedte_hain:
    title: ¡Vamos a comprar algo!
    gloss: ¡Vamos a comprar algo!
    note: Una forma amistosa y fija de proponer ir de compras juntos; abre el diálogo final de esta unidad y sigue el patrón «chalo, kuch khate hain!» de la unidad de comida.
  hi.a1.unit07.lesson03.teach.dialogue.line01:
    title: Arjun propone ir de compras
    gloss: 'Arjun dice: «¡Vamos a comprar algo!».'
    note: Retoma la frase inicial de esta unidad.
  hi.a1.unit07.lesson03.teach.dialogue.line02:
    title: Priya acepta
    gloss: 'Priya acepta y se pregunta: ¿una camisa o un sombrero?'
    note: Introduce *ya* (o) para ofrecer a elegir entre dos artículos.
  hi.a1.unit07.lesson03.teach.dialogue.line03:
    title: El tendero los saluda
    gloss: El tendero los saluda y les pregunta qué desean.
    note: El saludo formal en registro aap; retoma *aapko kya chahiye* de la lección 1.
  hi.a1.unit07.lesson03.teach.dialogue.line04:
    title: Priya pregunta por una camisa
    gloss: Priya saluda cortésmente al tendero, le pide una camisa y luego pregunta su precio.
    note: Combina *ji*, *mujhe ... chahiye* e *iski keemat kya hai*.
  hi.a1.unit07.lesson03.teach.dialogue.line05:
    title: El tendero dice el precio
    gloss: El tendero dice que su precio es de trescientas rupias.
    note: Retoma el patrón *iski keemat ... rupaye hai* con un número nuevo.
  hi.a1.unit07.lesson03.teach.dialogue.line06:
    title: Priya reacciona y se decide
    gloss: 'Priya dice: «¿Trescientas rupias? ¡Es barata! Quiero esta camisa».'
    note: Retoma *sasti* de la nota de gramática de la lección 2.
  hi.a1.unit07.lesson03.teach.dialogue.line07:
    title: Arjun pregunta por un sombrero
    gloss: Arjun dice que quiere un sombrero y pregunta cuánto cuesta.
    note: Retoma la forma femenina *kitne ki hai* de la lección 2.
  hi.a1.unit07.lesson03.teach.dialogue.line08:
    title: El tendero responde
    gloss: El tendero dice que el sombrero cuesta quinientas rupias.
    note: Retoma *paanch sau* (quinientos) de la lección 2.
  hi.a1.unit07.lesson03.teach.dialogue.line09:
    title: Arjun reacciona y se decide de todos modos
    gloss: 'Arjun dice: «¿Quinientas rupias? ¡Es caro! Bueno, quiero este sombrero».'
    note: Retoma *mehengi* de la nota de gramática de la lección 2; después decide comprarlo de todos modos.
  hi.a1.unit07.lesson03.teach.dialogue.line10:
    title: El tendero pregunta si eso es todo
    gloss: 'El tendero dice: «Bien, ¿desea algo más?».'
    note: Retoma *aapko aur kuch chahiye* de la lección 1.
  hi.a1.unit07.lesson03.teach.dialogue.line11:
    title: Priya cierra el pedido
    gloss: 'Priya dice: «No, solo esto. ¡Gracias!».'
    note: Retoma *ji nahin, sirf yah* de la lección 1 y añade *shukriya*.
  hi.a1.unit07.lesson03.teach.dialogue.line12:
    title: El tendero se despide
    gloss: 'El tendero dice: «Gracias, hasta la próxima».'
    note: Retoma la frase de despedida habitual de este curso.
