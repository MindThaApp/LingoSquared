    gloss: Uso mi teléfono todos los días.
    note: '*हर दिन* («todos los días») es una expresión de tiempo que va antes del verbo.'
  hi.a1.unit35.lesson02.teach.aip:
    title: La aplicación
    gloss: la aplicación
    example_gloss: Tengo una aplicación para la previsión del tiempo.
  hi.a1.unit35.lesson02.teach.maisej:
    title: El mensaje
    gloss: el mensaje
    example_gloss: Enviaré un mensaje por la aplicación.
  hi.a1.unit35.lesson02.teach.maisej_bhejte_bhee:
    title: El verbo sigue a la persona
    gloss: 'Un *मैसेज* se puede enviar o leer, y la terminación del verbo depende de la persona: *मैं भेजता हूँ*, *तुम पढ़ते हो*, *वह पढ़ता है*.'
    note: Une la palabra nueva con el sustantivo compuesto que ya se enseñó en la unidad del tiempo.
  hi.a1.unit35.lesson02.teach.priya_aip_se:
    title: Priya envía un mensaje desde la aplicación
    gloss: Priya envía un mensaje desde la aplicación.
    note: '*ऐप से* significa «desde la aplicación»: *से* indica el medio o la herramienta que se usa.'
  hi.a1.unit35.lesson02.teach.arjun_maisej_parhta:
    title: Arjun lee el mensaje
    gloss: Arjun lee el mensaje.
  hi.a1.unit35.lesson03.teach.chek_karna:
    title: Buscar
    gloss: buscar
    example_gloss: Consulto la previsión del tiempo.
  hi.a1.unit35.lesson03.teach.chek_karna_men:
    title: Solo cambia करना
    gloss: 'En *चेक करना*, la palabra *चेक* no cambia y solo *करना* cambia según la persona: *मैं चेक करता हूँ*, *तुम चेक करते हो*. *इस्तेमाल करना* funciona igual.'
    note: 'Muchos verbos del hindi se forman con un sustantivo o un préstamo más *करना*: aprende la primera palabra una vez y cambia solo *करना*.'
  hi.a1.unit35.lesson03.teach.vikram_mausam_ka:
    title: Vikram consulta el pronóstico del tiempo
    gloss: Vikram consulta el pronóstico del tiempo.
  hi.a1.unit35.lesson03.teach.phir_vah_daurne:
    title: Luego se va a correr
    gloss: Luego se va a correr.
    note: '*दौड़ने जाना* («ir a correr») pone el verbo en la forma *-ने* antes de *जाना*.'
  hi.a1.unit35.lesson04.teach.priya_chalo_shanivar:
    title: Priya propone un plan
    gloss: 'Priya: ¿Hacemos ejercicio el sábado a las diez?'
  hi.a1.unit35.lesson04.teach.arjun_achchha_aidiya:
    title: Arjun acepta
    gloss: 'Arjun: ¡Buena idea! Voy a consultar el pronóstico del tiempo.'
    note: '*अच्छा आइडिया!* es una forma rápida y amistosa de decir «buena idea».'
  hi.a1.unit35.lesson04.teach.arjun_shanivar_ko:
    title: Arjun consulta el tiempo
    gloss: 'Arjun: ¡El sábado hace sol!'
    note: 'En hindi no se usa un sujeto como «ello»: se dice *शनिवार को धूप है* («el sábado sol hay»).'
  hi.a1.unit35.lesson04.teach.vikram_mujhe_maisej:
    title: Vikram ve el mensaje
    gloss: 'Vikram: Veo el mensaje. ¡Nos vemos el sábado!'
  hi.a1.unit35.lesson04.teach.phir_milenge_yah:
    title: फिर मिलेंगे vs día + को
    gloss: 'Ya conoces *फिर मिलेंगे!* («nos vemos otra vez»). Para indicar un día, pon *को* después de él: *शनिवार को मिलते हैं!*, *सोमवार को मिलते हैं!*'
    note: Amplía la fórmula de despedida de la unidad de saludos a un día concreto.
  hi.a1.unit35.lesson05.teach.priya_har_din:
    title: ¿Quién usa qué?
    gloss: Priya llama a Arjun todos los días. Usa su teléfono, no una aplicación. Arjun no tiene computadora en casa, pero usa internet en su teléfono. Vikram consulta el pronóstico del tiempo todas las mañanas. Luego sale a correr. Neha envía mensajes a Priya a menudo. ¿Tú también usas tu teléfono todos los días?
    note: Compara los hábitos tecnológicos de los cuatro personajes, con la misma forma que la lectura comparativa de la unidad de deportes.
    glosses:
      कॉल: llama
      हर: cada
      दिन: día
      इस्तेमाल: usa
      फ़ोन: teléfono
      ऐप: aplicación
      कंप्यूटर: ordenador
      घर: en casa
      इंटरनेट: internet
      चेक: consulta
      सुबह: mañana
      अनुमान: pronóstico del tiempo
      जाता: va
      दौड़ने: a correr
      भेजती: envía
      अक्सर: a menudo
      मैसेज: mensaje
      करते: usar
  hi.a1.unit35.lesson05.teach.vikram_har_subah:
    title: Vikram consulta el pronóstico todas las mañanas
    gloss: Vikram consulta el pronóstico del tiempo todas las mañanas.
  hi.a1.unit35.lesson05.teach.neha_aksar_priya:
    title: Neha escribe a Priya a menudo
    gloss: Neha envía mensajes a Priya a menudo.
  hi.a1.unit35.lesson06.teach.priya_mujhe_maisej:
    title: Priya confirma el plan
    gloss: 'Priya: Veo el mensaje. ¿Hacemos ejercicio el sábado a las diez en el parque?'
  hi.a1.unit35.lesson06.teach.arjun_han_aur:
    title: Arjun confirma el tiempo
    gloss: 'Arjun: Sí, ¡y el sábado hace sol!'
  hi.a1.unit35.lesson06.teach.vikram_tab_main:
    title: El plan de Vikram
    gloss: 'Vikram: Entonces iré a correr. Después también jugaré al fútbol.'
    note: '*उसके बाद* («después de eso») introduce el segundo paso, y *भी* significa «también».'
  hi.a1.unit35.lesson06.teach.neha_mujhe_tairna:
    title: El plan de Neha
    gloss: 'Neha: Prefiero nadar, pero también iré al parque.'
    note: Para expresar preferencia se usa la estructura *मुझे ... पसंद है*, y *ज़्यादा* añade «más».
  hi.a1.unit35.lesson06.teach.priya_barhiya_shanivar:
    title: Priya cierra la conversación
    gloss: 'Priya: ¡Genial! ¡Nos vemos el sábado en el parque!'
    note: Cierra en una sola línea el hilo de mensajes de esta unidad y el plan de la unidad de deportes.
