units:
  hi.a1.unit04.time:
    title: La hora
lessons:
  hi.a1.unit04.lesson01.kitne_baje_hain:
    title: ¿Qué hora es?
  hi.a1.unit04.lesson02.din_ka_samay:
    title: Momentos del día
  hi.a1.unit04.lesson03.agli_class_ka_samay:
    title: La hora de la próxima clase
teaching:
  hi.a1.unit04.lesson01.teach.baje:
    title: En punto
    gloss: en punto (para dos o más)
    note: Se usa con cualquier hora excepto la una; más adelante en esta lección verás la forma especial para *la una*.
    example_gloss: Ahora son las cinco.
  hi.a1.unit04.lesson01.teach.abhi:
    title: Ahora
    gloss: ahora
    note: Una palabra de tiempo sencilla que usarás constantemente para decir la hora actual.
    example_gloss: Ahora son las diez.
  hi.a1.unit04.lesson01.teach.ek_do_teen:
    title: Uno, dos, tres
    gloss: uno, dos, tres
    note: 'Ya vistos en la unidad 2 y necesarios aquí para decir la hora: fíjate en que *ek* lleva la forma especial *baja*, mientras que *do* y *teen* llevan la forma normal *baje*.'
    example_gloss:
    - Ahora es la una.
    - Ahora son las dos.
    - Ahora son las tres.
  hi.a1.unit04.lesson01.teach.chaar_paanch_chhah:
    title: Cuatro, cinco, seis
    gloss: cuatro, cinco, seis
    note: 'Ya vistos en la unidad 2: los tres llevan la forma normal *baje*.'
    example_gloss:
    - Ahora son las cuatro.
    - Ahora son las cinco.
    - Ahora son las seis.
  hi.a1.unit04.lesson01.teach.saat_aath_nau:
    title: Siete, ocho, nueve
    gloss: siete, ocho, nueve
    note: Ya vistos en la unidad 2.
    example_gloss:
    - Ahora son las siete.
    - Ahora son las ocho.
    - Ahora son las nueve.
  hi.a1.unit04.lesson01.teach.das_gyaarah_baarah:
    title: Diez, once, doce
    gloss: diez, once, doce
    note: 'Ya vistos en la unidad 2: son los últimos números de hora que necesitarás.'
    example_gloss:
    - Ahora son las diez.
    - Ahora son las once.
    - Ahora son las doce.
  hi.a1.unit04.lesson01.teach.baja_grammar_note:
    title: Baja y baje
    gloss: '*Baja* va con *uno*; *baje* va con cualquier otro número: *ek baja hai*, *do baje hain*.'
    note: 'Es una excepción de concordancia real y necesaria, no una simplificación: *ek baja hai* es la única hora que usa la forma singular.'
  hi.a1.unit04.lesson01.teach.kitne_baje_hain:
    title: Preguntar la hora
    gloss: ¿Qué hora es?
    note: Literalmente «¿cuántas en punto hay?»; es la forma estándar de preguntar la hora.
  hi.a1.unit04.lesson01.teach.abhi_paanch_baje_hain:
    title: Decir la hora
    gloss: Ahora son las cinco.
    note: La respuesta natural, en oración completa, a *Kitne baje hain?*
  hi.a1.unit04.lesson02.teach.yoga_class_reprise:
    title: Clase de yoga
    gloss: clase de yoga
    note: Ya vista en la unidad 1; es el ejemplo que usaremos en esta lección para hablar de horarios.
    example_gloss: La clase de yoga es hoy.
  hi.a1.unit04.lesson02.teach.subah:
    title: Mañana (por la mañana)
    gloss: mañana (parte del día)
    note: Una de las cuatro palabras de momentos del día que enseña esta lección.
    example_gloss: La clase de yoga es por la mañana.
  hi.a1.unit04.lesson02.teach.dopahar:
    title: Mediodía / tarde
    gloss: mediodía, tarde
    note: Abarca tanto el mediodía como la primera parte de la tarde.
    example_gloss: No hay clase por la tarde.
  hi.a1.unit04.lesson02.teach.shaam:
    title: Tarde (atardecer)
    gloss: tarde-noche
    note: El tramo del día que va después de *dopahar* y antes de *raat*.
    example_gloss: La próxima clase es a las cinco de la tarde.
  hi.a1.unit04.lesson02.teach.raat:
    title: Noche
    gloss: noche
    note: La última de las cuatro palabras de momentos del día.
    example_gloss: No hay clase por la noche.
  hi.a1.unit04.lesson02.teach.ko_reprise:
    title: Ko con un momento general
    gloss: '*Ko* va con una palabra de momento del día cuando no se da una hora concreta: *dopahar ko*, *raat ko*.'
    note: Es el mismo *ko* que marca un día de la semana (unidad 3), ahora para un período general del día. Es una construcción natural, pero no la única de esta unidad (la forma para una hora concreta está en la siguiente nota).
  hi.a1.unit04.lesson02.teach.time_of_day_baje_note:
    title: Un momento del día justo antes de baje
    gloss: 'Para una hora concreta, la palabra del momento del día va justo antes de *baje*, sin nada en medio: *subah saat baje*, *shaam paanch baje*.'
    note: 'Aquí no se usa *ko*: se reserva para un período general sin hora concreta, como explica la nota anterior.'
  hi.a1.unit04.lesson02.teach.class_kitne_baje_hai:
    title: Preguntar a qué hora es la clase
    gloss: ¿A qué hora es la clase?
    note: Es el mismo patrón *kitne baje* de la lección 1, ahora para preguntar por un evento y no por la hora actual.
  hi.a1.unit04.lesson02.teach.class_subah_saat_baje_hai:
    title: Decir la hora de un evento
    gloss: La clase es a las siete de la mañana.
    note: Une *subah* directamente con *saat baje*, según la nota gramatical anterior.
  hi.a1.unit04.lesson03.teach.kal:
    title: Mañana / ayer
    gloss: mañana, ayer
    note: 'El hindi usa una sola palabra para ambos: el contexto (y el tiempo verbal) indica cuál se quiere decir. En esta lección siempre significa «mañana».'
    example_gloss: Mañana la clase es a las cinco de la tarde.
  hi.a1.unit04.lesson03.teach.agli_reprise:
    title: Siguiente
    gloss: siguiente
    note: 'Ya vista en la unidad 3: es la forma femenina, que concuerda con *clase*, que es femenino.'
    example_gloss: La próxima clase es mañana.
  hi.a1.unit04.lesson03.teach.theek_hai_shukriya_reprise:
    title: Vale, gracias
    gloss: ¡Vale, gracias!
    note: Las dos palabras ya aparecieron en el vocabulario de despedida de la unidad 1.
  hi.a1.unit04.lesson03.teach.milte_hain_reprise:
    title: Nos vemos / quedamos
    gloss: nos vemos
    note: Ya vista en la despedida final de la unidad 3; ahora se combina con *kal* para decir «hasta mañana».
  hi.a1.unit04.lesson03.teach.agli_class_kitne_baje_hai:
    title: Preguntar cuándo es la próxima clase
    gloss: ¿A qué hora es la próxima clase?
    note: Combina *agli* (femenino, concuerda con clase) con el patrón *kitne baje* de esta unidad.
  hi.a1.unit04.lesson03.teach.agli_class_shaam_paanch_baje_hai:
    title: Decir la hora de la próxima clase
    gloss: La próxima clase es a las cinco de la tarde.
    note: La respuesta natural y completa a la pregunta anterior.
  hi.a1.unit04.lesson03.teach.kal_milte_hain:
    title: Despedirse quedando para mañana
    gloss: ¡Vale, hasta mañana!
    note: La forma natural de cerrar una conversación cuando ya se ha acordado una hora.
  hi.a1.unit04.lesson03.teach.dialogue.line01:
    title: Arjun pregunta por la próxima clase
    gloss: Arjun pregunta a qué hora es la próxima clase.
    note: Repite exactamente la pregunta de esta lección.
  hi.a1.unit04.lesson03.teach.dialogue.line02:
    title: Priya dice la hora
    gloss: Priya dice que la próxima clase es a las cinco de la tarde.
    note: Repite exactamente la oración de respuesta de esta lección.
  hi.a1.unit04.lesson03.teach.dialogue.line03:
    title: Arjun le da las gracias
    gloss: Arjun dice vale, gracias.
    note: Ya vista en el vocabulario de la unidad 1.
  hi.a1.unit04.lesson03.teach.dialogue.line04:
    title: Priya cierra la conversación
    gloss: Priya está de acuerdo y dice hasta mañana.
    note: Repite exactamente la frase de cierre de esta lección.
