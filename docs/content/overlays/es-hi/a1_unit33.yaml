    title: Juego al fútbol
    gloss: Juego al fútbol.
    note: 'El hindi usa el verbo que corresponde a cada deporte: *खेलना* («jugar») para el fútbol, así que *मैं फ़ुटबॉल खेलता हूँ*.'
  hi.a1.unit33.lesson01.teach.futbol_khelna_yog:
    title: खेलना o करना
    gloss: 'Jugar al fútbol, hacer yoga. El hindi elige el verbo según el deporte: *खेलना* para juegos como el fútbol y *करना* para actividades como el yoga, y el deporte va antes del verbo.'
    note: 'No hace falta aprender un verbo distinto para cada deporte en este nivel: basta con fare o giocare a.'
  hi.a1.unit33.lesson02.teach.hafte_men_do:
    title: Veces por semana
    gloss: veces por semana
