  hi.a1.unit33.lesson02.teach.main_hafte_men:
    title: हफ़्ते में दो बार
    gloss: Corro dos veces por semana. *हफ़्ते में दो बार* («en una semana, dos veces») indica la frecuencia con más precisión que *रोज़* o *अक्सर*, y va antes del verbo.
    note: Amplía el vocabulario de frecuencia que ya se vio en la unidad de pasatiempos.
  hi.a1.unit33.lesson02.teach.main_hafte_men_2:
