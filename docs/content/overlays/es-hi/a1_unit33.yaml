  hi.a1.unit33.lesson05.teach.priya_hafte_men:
    title: Priya y Neha hablan de deporte
    gloss: Priya hace yoga dos veces por semana. Le encanta moverse con calma. Neha no hace yoga, pero le encanta nadar. Neha nada a menudo, casi todas las semanas. ¿Qué deporte practicas tú?
    note: 'Este texto contrasta dos deportes y dos formas de decir la frecuencia: *हफ़्ते में दो बार* y *अक्सर, लगभग हर हफ़्ते*; los verbos *करती है* y *तैरती है* están en femenino.'
    glosses:
      करती: hace
      दो: dos
      बार: veces
      हफ़्ते: semana
      योग: yoga
      पसंद: le encanta
      आराम: con calma
      कसरत: ejercicio
      तैरना: la natación
      तैरती: nada
      अक्सर: a menudo
      लगभग: casi
      कौन: qué
      खेल: deporte
  hi.a1.unit33.lesson05.teach.neha_aksar_tairtee:
