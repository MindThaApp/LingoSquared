    title: चलो + खेलें
    gloss: Vamos, juguemos juntos. *चलो* más la forma en *-एँ* (*खेलें*) propone hacer algo juntos, que es como el hindi dice «¿hacemos...?».
    note: Retoma exactamente la construcción para proponer planes de la unidad de planes.
