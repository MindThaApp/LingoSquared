teaching:
  hi.a1.unit26.lesson01.teach.jaiket_svetar:
    title: Abrigo, jersey
    gloss: el abrigo, el jersey
    note: '*जैकेट* es femenino y *स्वेटर* es masculino, y eso se nota en las palabras que los acompañan: *मेरी जैकेट*, *मेरा स्वेटर*.'
    example_gloss:
    - Busco un abrigo.
    - Tengo un jersey.
  hi.a1.unit26.lesson01.teach.paint_joote:
    title: Pantalón, zapatos
    gloss: el pantalón, los zapatos
    note: '*पैंट* es una sola palabra para un pantalón (*मेरी पैंट*), y *जूते* es el plural de *जूता*: un sustantivo masculino terminado en *-आ* cambia a *-ए* en plural.'
    example_gloss:
    - Busco un pantalón.
    - Busco zapatos.
  hi.a1.unit26.lesson01.teach.main_ek_jaiket:
    title: Decir lo que buscas
    gloss: Busco un abrigo.
    note: 'El verbo va al final: *मैं एक जैकेट ढूँढ़ रहा हूँ*. *रहा हूँ* da el sentido de «estoy buscando» (acción en curso), y *रहा* es la forma masculina (una mujer dice *रही*).'
  hi.a1.unit26.lesson02.teach.saiz:
    title: Talla
    gloss: la talla
    note: '*साइज़* es un sustantivo masculino, así que las palabras que lo acompañan también son masculinas: *मेरा साइज़*.'
    example_gloss: ¿Qué talla usas?
  hi.a1.unit26.lesson02.teach.apka_saiz_kya:
    title: Preguntar por la talla
    gloss: ¿Qué talla usas?
    note: '*कौन सा* («cuál») pregunta por una opción dentro de un conjunto, y *सा* concuerda con el sustantivo: *कौन सा साइज़*, pero *कौन सी जैकेट*. *आप* es el «usted» de cortesía para un dependiente.'
  hi.a1.unit26.lesson02.teach.mera_saiz_em:
    title: Decir tu talla
    gloss: Soy talla M.
    note: 'En hindi no se usa un verbo como «tener» aquí: *मेरा साइज़ एम है* significa literalmente «mi talla es M», y *मेरा* concuerda con el masculino *साइज़*.'
  hi.a1.unit26.lesson03.teach.kala_neela:
    title: Negro, azul
    gloss: negro, azul
    note: Los dos adjetivos de color básicos de esta lección.
    example_gloss:
    - Quiero el abrigo en negro.
    - ¿Tiene también este en azul?
  hi.a1.unit26.lesson03.teach.mujhe_vah_jaiket:
    title: Pedir un color
    gloss: Quiero el abrigo en negro.
    note: '*मुझे ... चाहिए* es la forma de decir «quiero» en hindi: el deseo ocurre «a mí» (*मुझे*), y lo que se quiere va justo antes de *चाहिए*.'
  hi.a1.unit26.lesson03.teach.kya_apke_pas:
    title: Preguntar por otro color
    gloss: ¿Tiene también este en azul?
    note: '*आपके पास ... है?* («junto a usted ... está?») es la forma cortés de preguntar «¿tiene ...?», y *भी* («también») va después de la palabra a la que se añade.'
  hi.a1.unit26.lesson04.teach.kya_yah_jaiket:
    title: Preguntar cómo queda
    gloss: ¿Te queda bien este abrigo?
    note: 'En hindi la ropa «viene bien»: *ठीक आती है*. El verbo concuerda con la prenda: *जैकेट*, femenino, da *आती*, y *स्वेटर*, masculino, daría *आता*.'
  hi.a1.unit26.lesson04.teach.yah_ekdam_theek:
    title: Confirmar que queda bien
    gloss: Me queda bien.
    note: '*एकदम* («completamente») da el sentido de «queda perfecta»; *आती है* concuerda con el femenino *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_chhotee:
    title: Demasiado pequeño
    gloss: Es demasiado pequeño.
    note: '*बहुत* va antes del adjetivo y aquí da el sentido de «demasiado»: *बहुत छोटी*. El adjetivo concuerda con el femenino *जैकेट*.'
  hi.a1.unit26.lesson04.teach.yah_bahut_baree:
    title: Demasiado grande
    gloss: Es demasiado grande.
    note: 'Mismo patrón con *बड़ी*: *बड़ा* cambia a *बड़ी* con un sustantivo femenino, así que *बहुत बड़ी*.'
  hi.a1.unit26.lesson05.teach.nabbe:
    title: Novecientos
    gloss: novecientos
    note: '*नौ सौ* es el número 900, usado en el precio de la chaqueta.'
    example_gloss: La chaqueta cuesta novecientas rupias.
  hi.a1.unit26.lesson05.teach.jaiket_kee_keemat:
    title: Decir un precio
    gloss: La chaqueta cuesta novecientas rupias.
    note: 'Hindi dice «el precio de la chaqueta es ...»: *जैकेट की कीमत नौ सौ रुपये है*. *की* concuerda con el femenino *कीमत*, no con *जैकेट*.'
  hi.a1.unit26.lesson05.teach.sardee_kee_jaiket:
    title: Lee un ticket de tienda
    gloss: 'Chaqueta de invierno: talla M, color negro. Precio: novecientas rupias. Esta chaqueta queda bien y es abrigada.'
    note: Fíjate en la talla, el color, el precio y las dos cualidades que se mencionan del abrigo.
    glosses:
      सर्दी: de invierno (chaqueta)
      साइज़: talla
      रंग: color
      काला: negro
      कीमत: precio
      नौ: nueve
      सौ: cien
      रुपये: rupias
      जैकेट: abrigo
      आती: queda bien
      गर्म: caluroso
  hi.a1.unit26.lesson06.teach.priya_yah_jaiket:
    title: Priya se fija en la chaqueta
    gloss: 'Priya: ¡Esta chaqueta es muy bonita! ¿Qué talla usas?'
    note: '*अच्छी* concuerda con el femenino *जैकेट*. *तुम्हारा* es el «tu» informal, usado entre amigos.'
  hi.a1.unit26.lesson06.teach.arjun_mera_saiz:
    title: Arjun pide probársela
    gloss: 'Arjun: Uso la talla M. ¿Puedo probármela?'
    note: '*पहनकर देखना* («ponerse y ver») es como se dice «probarse» en hindi. *सकता हूँ* significa «puedo», y una mujer dice *सकती हूँ*.'
  hi.a1.unit26.lesson06.teach.priya_zaroor_kya:
    title: Priya pregunta cómo le queda
    gloss: 'Priya: Claro. ¿Te queda bien?'
    note: '*यह* significa «esto» o «ello», y *आती* concuerda con el femenino *जैकेट*.'
  hi.a1.unit26.lesson06.teach.arjun_han_yah:
    title: Arjun lo confirma
    gloss: 'Arjun: Sí, me queda perfecta y además es abrigada.'
    note: 'Coincide exactamente con el ticket leído antes: es el mismo abrigo.'
  hi.a1.unit26.lesson06.teach.priya_barhiya_tum:
    title: Priya pregunta por el color
    gloss: 'Priya: ¡Genial! ¿Te la llevas en negro o en azul?'
    note: '*या* («o») ofrece una opción. El segundo *रंग* se puede omitir: *काले रंग में ... या नीले में*. *तुम* es informal.'
  hi.a1.unit26.lesson06.teach.arjun_main_ise:
    title: Arjun decide
    gloss: 'Arjun: Me la llevo en negro.'
    note: '*लूँगा* es el futuro de *लेना* («tomar»), el verbo habitual para decidirse por algo en una tienda. Una mujer dice *लूँगी*.'
  hi.a1.unit26.lesson06.teach.main_leta_hoon:
    title: लेता हूँ y लेता है
    gloss: Yo tomo, él toma.
    note: '*-ता* es la terminación del presente habitual y concuerda con el sujeto, mientras que *हूँ* va con *मैं* y *है* va con *वह*.'
