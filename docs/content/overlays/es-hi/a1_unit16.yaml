teaching:
  hi.a1.unit16.lesson01.teach.tum_ho_review:
    title: 'Repaso: tú, bien, estás'
    gloss: tú (informal), bien, estás
    note: Un repaso rápido de las palabras necesarias para preguntar a un amigo cómo se siente.
    example_gloss: ¿Cómo estás?
  hi.a1.unit16.lesson01.teach.mujhe_hai_review:
    title: 'Repaso: a mí, es'
    gloss: a mí / para mí, es
    note: El verbo copulativo necesario para formar la construcción de los síntomas de esta lección.
    example_gloss: Tengo trabajo.
  hi.a1.unit16.lesson01.teach.tum_theek_ho_phrase:
    title: ¿Estás bien?
    gloss: ¿Estás bien?
    note: La pregunta con la que empieza la unidad, para interesarse por un amigo.
  hi.a1.unit16.lesson01.teach.main_hoon_nahin_review:
    title: 'Repaso: yo, soy/estoy, no'
    gloss: yo, estoy, no
    note: Necesario para responder en negativo a «¿Estás bien?».
    example_gloss: Estoy bien.
  hi.a1.unit16.lesson01.teach.sir:
    title: Cabeza
    gloss: cabeza
    note: Un sustantivo nuevo, necesario para el primer síntoma de esta unidad.
    example_gloss: Mi cabeza es grande.
  hi.a1.unit16.lesson01.teach.dard:
    title: Dolor
    gloss: dolor
    note: Un sustantivo nuevo. Combinado con una parte del cuerpo, nombra un dolor concreto (consulta la nota de gramática de esta unidad).
    example_gloss: Tengo dolor.
  hi.a1.unit16.lesson01.teach.mujhe_sir_dard_hai_phrase:
    title: Tengo dolor de cabeza.
    gloss: Me duele la cabeza.
    note: La primera oración completa de la unidad para expresar un síntoma.
  hi.a1.unit16.lesson01.teach.grammar_symptom_hai:
    title: Mujhe + síntoma + hai
    gloss: '«Mujhe + sustantivo + hai» ya se aprendió en la unidad 11 («mujhe kaam hai» = tengo trabajo). Ahora también se usa para los síntomas: «mujhe sir dard hai» significa «tengo dolor de cabeza». «Sir dard» (sir = cabeza, dard = dolor) forma junto el concepto «dolor de cabeza». No es gramática nueva: es el mismo patrón de antes.'
    note: Presenta el segundo uso de un patrón ya enseñado (dativo + sustantivo + hai), indicando la unidad anterior antes de aplicarlo a los síntomas.
  hi.a1.unit16.lesson01.teach.bukhar:
    title: Fiebre
    gloss: fiebre
    note: Un sustantivo nuevo, el segundo síntoma de esta unidad.
    example_gloss: ¿Tienes fiebre?
  hi.a1.unit16.lesson01.teach.mujhe_bukhar_hai_phrase:
    title: Tengo fiebre.
    gloss: Tengo fiebre.
    note: El mismo patrón dativo + sustantivo + hai aplicado al segundo síntoma de esta lección.
  hi.a1.unit16.lesson02.teach.tumhein_jaana_review:
    title: 'Repaso: a ti, ir'
    gloss: a ti / para ti, ir
    note: Ambos ya se enseñaron (unidad 6 y unidad 15); aquí se reutilizan para hablar de ir al médico.
    example_gloss:
    - ¿Qué te gustaría?
    - Necesito ir a la estación.
  hi.a1.unit16.lesson02.teach.ke_paas_review:
    title: 'Repaso: cerca de / junto a'
    gloss: cerca de / junto a (un lugar)
    note: Se enseñó por primera vez en la unidad 8; aquí se reutiliza y, en la nota de gramática de esta lección, recibe un tercer sentido.
    example_gloss: El banco está cerca de la escuela.
  hi.a1.unit16.lesson02.teach.doctor:
    title: Médico
    gloss: médico
    note: Un sustantivo nuevo, el tema principal de esta lección.
    example_gloss: El médico es bueno.
  hi.a1.unit16.lesson02.teach.mujhe_doctor_ke_paas_jana_hai_phrase:
    title: Tengo que ir al médico.
    gloss: Tengo que ir al médico.
    note: Combina *ke paas* con la construcción de obligación *mujhe...jana hai* de la unidad 15.
  hi.a1.unit16.lesson02.teach.grammar_ke_paas_third_sense:
    title: 'Ke paas: un tercer sentido'
    gloss: 'Los dos primeros sentidos de «ke paas» se enseñaron antes: cerca de (unidad 8: «bank school ke paas hai») y posesión (unidad 2: «mere paas ek kitab hai»). Ahora, un tercer uso: ir hacia una PERSONA, es decir, ir a verla: «doctor ke paas jana hai» significa «hay que ir al médico». También se repite de la unidad 15 la misma estructura «mujhe...jana hai».'
    note: Nombra los dos sentidos anteriores por número de unidad antes de presentar el tercero, y señala de nuevo la reutilización de la construcción de obligación.
  hi.a1.unit16.lesson02.teach.aaraam:
    title: Descanso
    gloss: descansa
    note: Un sustantivo nuevo, el primer consejo de esta unidad.
    example_gloss: Necesito descansar.
  hi.a1.unit16.lesson02.teach.chahiye_review:
    title: 'Repaso: querer / necesitar'
    gloss: querer / necesitar
    note: Se enseñó por primera vez en la unidad 6; aquí se reutiliza para expresar lo que alguien necesita.
    example_gloss: Quisiera té.
  hi.a1.unit16.lesson02.teach.tumhein_aaraam_chahiye_phrase:
    title: Necesitas descansar.
    gloss: Necesitas descansar.
    note: El patrón ya conocido *tumhein...chahiye* aplicado al sustantivo nuevo de esta lección.
  hi.a1.unit16.lesson02.teach.dawa:
    title: Medicina
    gloss: medicina
    note: Un sustantivo nuevo, el segundo consejo de esta unidad.
    example_gloss: Necesito medicina.
  hi.a1.unit16.lesson02.teach.tumhein_dawa_chahiye_phrase:
    title: Necesitas medicina.
    gloss: Necesitas medicina.
    note: El mismo patrón con *chahiye* aplicado a la medicina.
  hi.a1.unit16.lesson02.teach.jaao_aur_review:
    title: 'Repaso: ¡ve!, y'
    gloss: ¡ve!, y
    note: Ambos ya se enseñaron (unidad 9 y unidad 1/2); aquí se reutilizan para unir dos consejos.
    example_gloss:
    - Vaya todo recto.
    - Quisiera té y café.
  hi.a1.unit16.lesson02.teach.karo_grammar:
    title: 'Karo: reutilizar la regla del imperativo en -o'
    gloss: '«Karo» usa la misma regla del imperativo de tum vista antes («jao», «muro», «batao», «gino»: todos terminan en «-o»). Aquí se forma a partir de «karna» (el «maaf karna» de la unidad 11): la raíz «kar» más «-o» da «karo», que significa «¡haz!». «Aaraam karo» significa «¡Descansa!».'
    note: Una ampliación directa y explícita de la regla del imperativo ya conocida, aplicada a un verbo que el estudiante ya conoce en infinitivo.
  hi.a1.unit16.lesson02.teach.aaraam_karo_phrase:
    title: ¡Descansa!
    gloss: ¡Descansa!
    note: El nuevo imperativo aplicado al primer consejo de esta unidad.
  hi.a1.unit16.lesson02.teach.aaraam_karo_aur_doctor_ke_paas_jaao_phrase:
    title: Descansa y ve al médico.
    gloss: Descansa y ve al médico.
    note: Combina los dos consejos de esta lección en una sola instrucción natural, como anticipo de la tarjeta de lectura de la lección 3.
  hi.a1.unit16.lesson03.teach.dialogue.line01:
    title: Priya le pregunta a Arjun si está bien
    gloss: Arjun, ¿estás bien?
  hi.a1.unit16.lesson03.teach.dialogue.line02:
    title: Arjun dice que tiene dolor de cabeza y fiebre
    gloss: No, tengo dolor de cabeza y fiebre.
  hi.a1.unit16.lesson03.teach.dialogue.line03:
    title: Priya dice que necesita descansar
    gloss: Eso no está bien. Necesitas descansar.
  hi.a1.unit16.lesson03.teach.dialogue.line04:
    title: Arjun también necesita medicina
    gloss: Sí, pero también necesito medicina.
  hi.a1.unit16.lesson03.teach.dialogue.line05:
    title: Priya dice que tiene que ir al médico
    gloss: De acuerdo. Tienes que ir al médico.
  hi.a1.unit16.lesson03.teach.dialogue.line06:
    title: Arjun le da las gracias a Priya
    gloss: De acuerdo, gracias.
  hi.a1.unit16.lesson03.teach.dialogue.line07:
    title: Priya le dice que descanse
    gloss: ¡Descansa!
  hi.a1.unit16.lesson03.teach.dialogue.line08:
    title: Arjun está de acuerdo
    gloss: De acuerdo.
  hi.a1.unit16.lesson03.teach.grammar_summary:
    title: Tres reglas principales
    gloss: 'Las tres reglas principales de esta unidad: (1) «mujhe/tumhein + síntoma + hai» expresa un problema de salud (p. ej., «mujhe bukhar hai»); (2) «tumhein/mujhe + cosa + chahiye» expresa una necesidad (p. ej., «tumhein aaraam chahiye»); (3) «X ke paas jana hai» indica a quién hay que ir a ver (p. ej., «doctor ke paas jana hai»).'
    note: Un resumen final que reúne toda la gramática de la unidad, a modo de la nota de gramática de la unidad 15 que enlazaba su paradigma.
  hi.a1.unit16.lesson03.teach.advice_reading:
    title: Leer unos consejos
    gloss: Descansa. Ve al médico.
    note: Una instrucción breve y directa (sin marco narrativo, como suenan los consejos hablados reales) que repite exactamente los hechos ya establecidos en el diálogo, sin añadir nada nuevo.
    glosses:
      आराम: descansa
      करो: haz (imperativo, de करना)
      डॉक्टर: médico
      जाओ: ve (imperativo, de जाना)
