teaching:
  hi.a1.unit11.lesson01.teach.review_chai_kaafi:
    title: 'Repaso: té, café'
    gloss: té, café
    note: 'Un repaso rápido de las palabras de bebidas de la unidad 6: en esta unidad las reutilizamos para proponer planes.'
    example_gloss:
    - Quiero té.
    - Quiero café.
  hi.a1.unit11.lesson01.teach.filma:
    title: Película
    gloss: película
    note: 'Un sustantivo nuevo para el tema de esta unidad: hacer planes.'
    example_gloss: Esta película es buena.
  hi.a1.unit11.lesson01.teach.dekhna:
    title: Vemos / veamos
    gloss: (nosotros) vemos / veamos
    note: La forma habitual de plural de 'dekhna' (ver, mirar), usada aquí para proponer una actividad juntos.
    example_gloss: Vemos una película.
  hi.a1.unit11.lesson01.teach.chalo_film_phrase:
    title: ¡Vamos a ver una película!
    gloss: ¡Vamos a ver una película!
    note: «Chalo» + un verbo en presente habitual plural es la forma cotidiana de proponer hacer algo juntos. Ya apareció de pasada en las unidades 1, 6 y 7 («chalo shuru karte hain», «chalo, kuch khaate hain», «chalo, kuch khareedte hain»); esta unidad formaliza y amplía el patrón.
  hi.a1.unit11.lesson01.teach.saath:
    title: Juntos
    gloss: juntos
    note: Se usa para proponer hacer una actividad en conjunto.
    example_gloss: ¡Vamos a ver una película juntos!
  hi.a1.unit11.lesson01.teach.peena:
    title: Bebemos / vamos a beber
    gloss: (nosotros) bebemos / vamos a beber
    note: Es la forma de presente habitual plural de «peena» (beber), con el mismo patrón que «dekhte hain».
    example_gloss: Bebemos té.
  hi.a1.unit11.lesson01.teach.chalo_chai_phrase:
    title: ¡Vamos a tomar té juntos!
    gloss: ¡Vamos a tomar té juntos!
    note: Combina «saath» y «peete hain» de esta lección en una segunda propuesta, con el mismo patrón de «chalo» que la propuesta de la película.
  hi.a1.unit11.lesson01.teach.chalo_grammar_note:
    title: Chalo + verbo-te + hain = Vamos a ___
    gloss: 'Para proponer hacer algo juntos, di «chalo» + verbo-te + hain: ¡Vamos a ver una película! ¡Vamos a tomar té juntos!'
    note: Presenta el patrón completo de forma explícita, formalizando lo que ya apareció de pasada tres veces en unidades anteriores.
  hi.a1.unit11.lesson01.teach.achha_vichar:
    title: ¡Buena idea!
    gloss: ¡Buena idea!
    note: Una forma lista para usar de aceptar una propuesta con entusiasmo.
  hi.a1.unit11.lesson02.teach.vyast:
    title: Ocupado
    gloss: ocupado
    note: Un adjetivo nuevo, que se usa con la cópula ya conocida (hoon/ho/hai) para decir que no estás disponible.
    example_gloss: Hoy estoy ocupado.
  hi.a1.unit11.lesson02.teach.maaf_karna:
    title: Lo siento / perdón
    gloss: lo siento / perdón
    note: Una expresión cortés fija, que sirve para suavizar un rechazo.
    example_gloss: Lo siento, estoy ocupado.
  hi.a1.unit11.lesson02.teach.maaf_vyast_phrase:
    title: Lo siento, estoy ocupado.
    gloss: Lo siento, estoy ocupado.
    note: La frase básica para rechazar una propuesta, que combina las dos expresiones nuevas de esta lección.
  hi.a1.unit11.lesson02.teach.mujhe_kaam_hai:
    title: Tengo trabajo.
    gloss: Tengo trabajo.
    note: Reutiliza el patrón «mujhe... hai» (tengo...), visto antes con «mujhe... chahiye» (quiero/necesito), aquí para dar un motivo al rechazar.
  hi.a1.unit11.lesson02.teach.decline_grammar_note:
    title: Cómo rechazar con cortesía
    gloss: Para rechazar un plan con cortesía, di «maaf karna» (lo siento) seguido de tu situación (p. ej., «estoy ocupado») o de un motivo (p. ej., «tengo trabajo»).
    note: Reutiliza a propósito gramática ya aprendida (la cópula y el patrón dativo de posesión) en lugar de introducir una construcción nueva para «poder».
  hi.a1.unit11.lesson02.teach.hum_pronoun:
    title: Nosotros
    gloss: nosotros
    note: 'Es el primer pronombre formal de primera persona del plural del curso. Su forma verbal de presente habitual (-te + hain) es la misma que ya se enseñó para ve (ellos): no hay conjugación nueva, solo un pronombre nuevo. (Tum también usa -te, pero con «ho»: tum milte ho.)'
    example_gloss: Nos vemos todos los días.
  hi.a1.unit11.lesson02.teach.kab_milte_phrase:
    title: ¿Cuándo nos vemos?
    gloss: ¿Cuándo nos vemos?
    note: Combina «hum» con «kab» (unidad 10) y «milte hain» (usado desde las despedidas de la unidad 1, donde normalmente se omitía el sujeto).
  hi.a1.unit11.lesson02.teach.din_review:
    title: 'Repaso: sábado, domingo'
    gloss: sábado, domingo
    note: Un repaso rápido de dos días de la semana de la unidad 3, necesarios para organizar un plan.
    example_gloss:
    - Hoy es sábado.
    - Mañana es domingo.
  hi.a1.unit11.lesson02.teach.samay_review:
    title: 'Repaso: las cuatro, qué hora'
    gloss: las cuatro, qué hora
    note: Un repaso rápido de las palabras de la hora de la unidad 4, necesarias para organizar un plan.
    example_gloss:
    - Ahora son las cuatro.
    - ¿Qué hora es ahora?
  hi.a1.unit11.lesson02.teach.kya_ravivar_thik_phrase:
    title: ¿Te parece bien el domingo?
    gloss: ¿Te parece bien el domingo?
    note: Reutiliza «kya» como marca de pregunta de sí o no, ya vista desde la unidad 1 («kya yeh tumhari pahli baar hai?», «kya tum yoga karti ho?»), en lugar de un interrogativo nuevo para «qué día».
  hi.a1.unit11.lesson03.teach.sandesh:
    title: Mensaje
    gloss: mensaje
    note: Un sustantivo nuevo, que se usa en la parte de la lección sobre la invitación escrita.
    example_gloss: Este es el mensaje de Arjun.
  hi.a1.unit11.lesson03.teach.dialogue.line01:
    title: Arjun propone una película el sábado
    gloss: Priya, ¿vamos a ver una película el sábado?
  hi.a1.unit11.lesson03.teach.dialogue.line02:
    title: Priya rechaza y da un motivo
    gloss: Lo siento, el sábado estoy ocupada. Tengo trabajo.
  hi.a1.unit11.lesson03.teach.dialogue.line03:
    title: Arjun pregunta cuándo pueden verse
    gloss: Vale. ¿Cuándo nos vemos?
  hi.a1.unit11.lesson03.teach.dialogue.line04:
    title: Priya propone el domingo
    gloss: ¿Te parece bien el domingo? ¡Vamos a tomar té juntos!
  hi.a1.unit11.lesson03.teach.dialogue.line05:
    title: Arjun acepta y pregunta la hora
    gloss: ¡Buena idea! ¿A qué hora el domingo?
  hi.a1.unit11.lesson03.teach.dialogue.line06:
    title: Priya sugiere una hora
    gloss: ¿Te parece bien a las cuatro?
  hi.a1.unit11.lesson03.teach.dialogue.line07:
    title: Arjun confirma
    gloss: Sí, a las cuatro está bien. ¡Hasta entonces!
  hi.a1.unit11.lesson03.teach.dialogue.line08:
    title: Priya cierra la conversación
    gloss: Vale, ¡nos vemos el domingo!
  hi.a1.unit11.lesson03.teach.invitation_message:
    title: El mensaje de Priya
    gloss: 'Hola, Arjun: quedemos el domingo a las cuatro y tomemos té. ¿Vale? - Priya'
    note: Una invitación escrita breve, que repite el plan que acaba de confirmarse en el diálogo.
    glosses:
      चलो: vamos a
      रविवार: domingo
      मिलते: vernos (de मिलना)
      चाय: té
      पीते: beber (de पीना)
      ठीक: vale / bien
