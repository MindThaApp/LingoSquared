teaching:
  hi.a1.unit28.lesson01.teach.fon_karna:
    title: Llamar
    gloss: llamar
    note: El infinitivo del verbo para hacer una llamada telefónica.
    example_gloss: Tengo que llamarte.
  hi.a1.unit28.lesson01.teach.main_tumhen_fon:
    title: Decir que vas a llamar
    gloss: Te llamo.
    note: '*करूँगा* es el futuro de *करना* y en hindi se usa donde en español decimos ''te llamaré'' o ''te voy a llamar''. La persona a quien llamas lleva *तुम्हें* (''a ti'').'
  hi.a1.unit28.lesson01.teach.hailo_main_priya:
    title: Contestar al teléfono
    gloss: Hola, soy Priya.
    note: Por teléfono se dice *मैं ... बोल रही हूँ* ('estoy hablando'); *रही* es femenino porque Priya es una mujer.
  hi.a1.unit28.lesson01.teach.hailo_main_arjun:
    title: Arjun contesta de la misma manera
    gloss: Hola, soy Arjun.
    note: 'Mismo patrón con el masculino *रहा*: *मैं अर्जुन बोल रहा हूँ*, porque Arjun es un hombre.'
  hi.a1.unit28.lesson02.teach.main_kisse_bat:
    title: Preguntar quién llama
    gloss: ¿Con quién hablo?
    note: '*किससे* (''con quién'') es *कौन* (''quién'') más *से*, y *से* marca a la persona con la que hablas.'
  hi.a1.unit28.lesson02.teach.ap_priya_se:
    title: Identificarse de manera formal
    gloss: Está hablando con Priya.
    note: '*आप* es el ''usted'' de cortesía para un desconocido. *प्रिया से बात कर रहे हैं* coloca *से* después del nombre, y *हैं* acompaña a *आप*.'
  hi.a1.unit28.lesson03.teach.kya_tum_yah:
    title: Pedir que repitan
    gloss: ¿Puedes repetirlo?
    note: '*सकते हो* significa ''puedes'' y va después del verbo principal: *कह सकते हो*. *क्या* al principio convierte la oración en pregunta.'
  hi.a1.unit28.lesson03.teach.itna_tez_mat:
    title: Pedir a alguien que vaya más despacio
    gloss: No hables tan rápido, por favor.
    note: '*मत बोलो* es el ''no hables'' amistoso con *तुम*, y *इतना तेज़* significa ''tan rápido''.'
  hi.a1.unit28.lesson03.teach.mujhe_tumharee_avaz:
    title: Decir que no oyes bien
    gloss: No te oigo bien.
    note: 'El hindi dice ''tu voz no me llega'': *मुझे तुम्हारी आवाज़ नहीं आ रही है*. Quien escucha va con *मुझे*, y la voz es el sujeto.'
  hi.a1.unit28.lesson04.teach.maisej:
    title: Mensaje de texto
    gloss: el mensaje de texto
    note: '*मैसेज* es un préstamo muy común y es masculino: *एक मैसेज*, *यह मैसेज ... का है*.'
    example_gloss: El mensaje de texto es de Priya.
  hi.a1.unit28.lesson04.teach.main_tumhen_ek:
    title: Decir que vas a enviar un mensaje
    gloss: Te envío un mensaje.
    note: 'El orden es persona, luego cosa y luego verbo: *तुम्हें एक मैसेज भेजूँगा*. *भेजना* significa ''enviar''.'
  hi.a1.unit28.lesson04.teach.main_tumhen_bad:
    title: Decir que volverás a llamar
    gloss: Te vuelvo a llamar más tarde.
    note: '*वापस फ़ोन करना* significa ''devolver la llamada'', con *वापस* antes de *फ़ोन करना*; *बाद में* significa ''más tarde''.'
  hi.a1.unit28.lesson05.teach.arjun_hay_priya:
    title: Lee una conversación por mensajes
    gloss: 'Arjun: Hola, Priya, ¿puedes llamarme? Tengo que decirte algo importante. Priya: Sí, claro, te devuelvo la llamada en cinco minutos.'
    note: Fíjate en qué pide Arjun, por qué lo pide y cuándo dice Priya que devolverá la llamada.
    glosses:
      हाय: hola
      सकती: puedes
      फ़ोन: llamar
      ज़रूरी: 'importante (como en: algo importante que decir)'
      कुछ: algo
      बतानी: decir
      ज़रूर: claro
      करूँगी: llamaré
      पाँच: cinco
      मिनट: minutos
      वापस: de vuelta
  hi.a1.unit28.lesson06.teach.arjun_hailo_main:
    title: Arjun contesta la llamada
    gloss: 'Arjun: Hola, soy Arjun.'
    note: Quien contesta dice primero su nombre con *मैं ... बोल रहा हूँ*, aquí con el masculino *रहा*.
  hi.a1.unit28.lesson06.teach.priya_hay_arjun:
    title: Priya se presenta
    gloss: 'Priya: Hola, Arjun, soy Priya. Arjun: ¡Qué bueno que llamaste!'
    note: '*अच्छा हुआ तुमने फ़ोन किया* significa ''qué bueno que llamaste''; *तुमने ... किया* es el pasado con *ने*.'
  hi.a1.unit28.lesson06.teach.priya_tumharee_pahlee:
    title: Priya pregunta por el turno
    gloss: 'Priya: ¿Cómo te fue en tu primer turno?'
    note: '*कैसी रही* pregunta ''¿cómo fue?''; *कैसी* es femenino porque *शिफ़्ट* es femenino.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_achchhee:
    title: Arjun cuenta una buena noticia
    gloss: 'Arjun: Me fue muy bien, mejor de lo que pensaba.'
    note: '*अच्छी रही* (''fue bien'') concuerda con el femenino *शिफ़्ट*, y *जितना मैंने सोचा था उससे भी बेहतर* significa ''incluso mejor de lo que pensaba''.'
  hi.a1.unit28.lesson06.teach.vah_narvas_tha:
    title: 'था y थी: era / estaba'
    gloss: Él estaba nervioso, ella estaba contenta.
    note: '*था* es ''era/estaba'' para un sujeto masculino y *थी* para uno femenino; la terminación concuerda con quien o lo que se describe.'
  hi.a1.unit28.lesson06.teach.priya_yah_sunkar:
    title: Priya está orgullosa
    gloss: 'Priya: ¡Qué alegría oír eso! Estoy orgullosa de ti.'
    note: '*तुम पर गर्व है* (''el orgullo está sobre ti'') usa *पर*, y la persona orgullosa lleva *मुझे*.'
  hi.a1.unit28.lesson06.teach.arjun_bahut_shukriya:
    title: Arjun está emocionado
    gloss: 'Arjun: Muchas gracias, significa mucho para mí.'
    note: '*मेरे लिए* significa ''para mí'', y *इसका बहुत मतलब है* es ''significa mucho''.'
  hi.a1.unit28.lesson06.teach.uskee_pahlee_shift:
    title: Su
    gloss: Su primer turno salió muy bien.
    note: '*उसकी* significa ''su'' (de él o de ella, es la misma palabra) y concuerda con el femenino *शिफ़्ट*.'
