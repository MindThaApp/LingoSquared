teaching:
  hi.a1.unit05.lesson01.teach.parivar:
    title: La familia
    gloss: familia
    note: La palabra general para «familia», que se usa a lo largo de esta unidad.
    example_gloss: Mi familia está en la India.
  hi.a1.unit05.lesson01.teach.pita_maa:
    title: Padre, madre
    gloss: padre, madre
    note: Ambas palabras llevan la forma de plural de respeto *hain* en lugar de *hai* al presentarlos, y *pita* lleva *mere* en lugar de *mera*; consulta la nota sobre el trato respetuoso más adelante en esta lección.
    example_gloss:
    - Este es mi padre.
    - Esta es mi madre.
  hi.a1.unit05.lesson01.teach.bhai_behan:
    title: Hermano, hermana
    gloss: hermano, hermana
    note: 'El par clave de esta unidad para el contraste de concordancia mera/meri: *mera bhai*, *meri behan*.'
    example_gloss:
    - Tengo un hermano.
    - Tengo una hermana.
  hi.a1.unit05.lesson01.teach.ek_as_article:
    title: Ek como «un/una»
    gloss: '*Ek* significa «uno» al contar y también funciona como «un/una»: *mera ek bhai hai*.'
    note: 'Es la misma palabra que ya se enseñó como el número 1: el hindi no tiene un artículo indefinido independiente.'
  hi.a1.unit05.lesson01.teach.mata_pita:
    title: Padres
    gloss: padres
    note: 'Compuesto de *mata* (madre, formal) y *pita* (padre): la palabra estándar para «padres».'
    example_gloss: Mis padres viven en Delhi.
  hi.a1.unit05.lesson01.teach.mera_meri_note:
    title: Mera y meri
    gloss: '*Mera* va con palabras masculinas y *meri* con palabras femeninas: *mera bhai*, *meri behan*.'
    note: 'El punto gramatical central de esta unidad: el posesivo concuerda con la persona o cosa poseída, no con quien habla.'
  hi.a1.unit05.lesson01.teach.mere_honorific_note:
    title: Mere para los mayores respetados
    gloss: 'Por respeto a los mayores, *mera* se convierte en *mere* y *hai* en *hain*, incluso para una sola persona: *yeh mere pita hain* (Este es mi padre).'
    note: 'Es una convención real y auténtica, no un error: los mayores de la familia a los que se respeta (padre, abuelo) llevan esta forma que parece plural. Las madres y las abuelas mantienen *meri*, pero el verbo también va en plural (*hain*) por la misma razón.'
  hi.a1.unit05.lesson01.teach.yah_mera_bhai_hai:
    title: Este es mi hermano
    gloss: Este es mi hermano.
    note: 'La forma masculina sencilla: para un hermano no hace falta forma de respeto.'
  hi.a1.unit05.lesson01.teach.yah_meri_behan_hai:
    title: Esta es mi hermana
    gloss: Esta es mi hermana.
    note: La forma femenina sencilla, que concuerda con *behan*.
  hi.a1.unit05.lesson01.teach.yah_kaun_hai:
    title: ¿Quién es este?
    gloss: ¿Quién es?
    note: Una pregunta sencilla y útil para presentar a los miembros de la familia.
  hi.a1.unit05.lesson02.teach.dada_dadi:
    title: Abuelo paterno, abuela paterna
    gloss: abuelo paterno, abuela paterna
    note: Se refiere específicamente a los padres de tu padre; mira la nota más adelante en esta lección, que los contrasta con los padres de tu madre.
    example_gloss:
    - Mi abuelo vive en Delhi.
    - Mi abuela vive en Delhi.
  hi.a1.unit05.lesson02.teach.nana_nani:
    title: Abuelo materno, abuela materna
    gloss: abuelo materno, abuela materna
    note: 'Los padres de tu madre: el hindi usa un par de palabras totalmente distinto al de los padres de tu padre.'
    example_gloss:
    - Mi abuelo (por parte de madre) vive en Bombay.
    - Mi abuela (por parte de madre) vive en Bombay.
  hi.a1.unit05.lesson02.teach.dilli_mumbai:
    title: Delhi, Bombay
    gloss: Delhi, Bombay
    note: Dos grandes ciudades de la India, usadas en los ejemplos de esta lección para decir dónde viven los familiares.
    example_gloss:
    - Mi familia vive en Delhi.
    - Mi hermano vive en Bombay.
  hi.a1.unit05.lesson02.teach.dada_nana_note:
    title: Dos pares de abuelos
    gloss: 'Los padres del padre: *dada-dadi*. Los padres de la madre: *nana-nani*.'
    note: A diferencia del español, que usa un solo par «abuelo/abuela» para ambos lados, el hindi tiene palabras totalmente distintas según el lado de la familia.
  hi.a1.unit05.lesson02.teach.rehna_verb:
    title: Vive (rehna)
    gloss: vive (masculino / femenino / plural de respeto)
    note: 'El verbo «vivir/residir»: *rehta hai* para un hombre, *rehti hai* para una mujer, *rehte hain* para más de una persona o para un mayor al que se respeta.'
    example_gloss:
    - Mi hermano vive en Delhi.
    - Mi hermana vive en Bombay.
    - Mis abuelos viven en Delhi.
  hi.a1.unit05.lesson02.teach.tumhara_tumhari:
    title: Tu (informal)
    gloss: tu (informal, masculino / femenino)
    note: El posesivo informal del registro de *tum*, que concuerda con el sustantivo poseído exactamente igual que *mera/meri*.
    example_gloss:
    - ¿Dónde vive tu hermano?
    - ¿Dónde vive tu hermana?
  hi.a1.unit05.lesson02.teach.mera_tumhara_note:
    title: Mera y tumhara juntos
    gloss: '*Mera* y *tumhara* van con palabras masculinas; *meri* y *tumhari* van con palabras femeninas: *mera bhai*/*tumhara bhai*, *meri behan*/*tumhari behan*.'
    note: El mismo patrón de concordancia de la lección 1, que ahora vemos que también se aplica a *tumhara*.
  hi.a1.unit05.lesson03.teach.bada_badi:
    title: Mayor / grande
    gloss: mayor, grande (masculino / femenino)
    note: 'El hindi marca al hermano mayor con este adjetivo que concuerda, mientras que el español suele añadir el adjetivo «mayor» sin cambiar de palabra para el hermano, pero en hindi esta forma cambia según el género: bada / badi.'
    example_gloss:
    - Mi hermano mayor vive en Delhi.
    - Mi hermana mayor vive en Bombay.
  hi.a1.unit05.lesson03.teach.chota_choti:
    title: Menor / pequeño
    gloss: menor, pequeño (masculino / femenino)
    note: El contrario de *bada/badi*, para un hermano menor.
    example_gloss:
    - Mi hermano menor es estudiante ahora.
    - Mi hermana menor es estudiante ahora.
  hi.a1.unit05.lesson03.teach.bada_chota_note:
    title: Concordancia de bada/chota
    gloss: '*Bada* y *chota* van con palabras masculinas; *badi* y *choti*, con palabras femeninas: *bada bhai*, *badi behan*.'
    note: La misma concordancia de género en los adjetivos que ya vimos con *mera/meri*, ahora aplicada a palabras que describen la edad.
  hi.a1.unit05.lesson03.teach.aur_lekin_bhi:
    title: Y, pero, también
    gloss: y, pero, también
    note: Tres palabras básicas para conectar ideas, que se reutilizan en el diálogo final de esta lección.
    example_gloss:
    - Mi hermano y mi hermana viven en Delhi.
    - Mi hermano vive en Delhi, pero mi hermana vive en Bombay.
    - Yo también tengo una hermana.
  hi.a1.unit05.lesson03.teach.accha_phir_milenge:
    title: Bien, hasta la próxima
    gloss: ¡Bien! Hasta la próxima.
    note: Una despedida amistosa, tomada del vocabulario de despedida de la unidad 2.
  hi.a1.unit05.lesson03.teach.theek_hai_phir_milte_hain:
    title: De acuerdo, hasta pronto
    gloss: De acuerdo, ¡hasta pronto!
    note: La respuesta informal a la despedida anterior, igual que en los intercambios finales de unidades previas.
  hi.a1.unit05.lesson03.teach.dialogue.line01:
    title: Arjun pregunta por la familia de Priya
    gloss: Arjun pregunta dónde vive la familia de Priya.
    note: Reutiliza el patrón *parivar kahan rehta hai* de esta unidad.
  hi.a1.unit05.lesson03.teach.dialogue.line02:
    title: Priya habla de sus padres y su hermano
    gloss: Priya dice que sus padres viven en Delhi y que también tiene un hermano mayor.
    note: Combina *mata-pita*, *rehte hain* y *bada bhai bhi hai*.
  hi.a1.unit05.lesson03.teach.dialogue.line03:
    title: Arjun pregunta por sus abuelos
    gloss: 'Arjun dice «ya veo» y pregunta: ¿y tus abuelos?'
    note: '*Tumhare* es la forma de respeto de *tumhara* que se usa para los mayores, igual que *mere* respecto a *mera* (nota de respeto de la lección 1).'
  hi.a1.unit05.lesson03.teach.dialogue.line04:
    title: Priya habla de los dos pares de abuelos
    gloss: Priya dice que sus abuelos paternos viven en Delhi, pero que sus abuelos maternos viven en Bombay.
    note: Usa *lekin* para contrastar las ciudades de los dos pares de abuelos, reforzando la distinción dada-dadi/nana-nani de la lección 2.
  hi.a1.unit05.lesson03.teach.dialogue.line05:
    title: Arjun menciona a su propia hermana
    gloss: Arjun dice que él también tiene una hermana menor.
    note: Reutiliza *bhi* y *choti behan*.
  hi.a1.unit05.lesson03.teach.dialogue.line06:
    title: Priya cierra la conversación
    gloss: Priya dice «bien, hasta la próxima».
    note: Reutiliza la frase de despedida de esta lección.
  hi.a1.unit05.lesson03.teach.dialogue.line07:
    title: Arjun responde
    gloss: Arjun asiente y dice «hasta pronto».
    note: Reutiliza la frase de respuesta de esta lección.
