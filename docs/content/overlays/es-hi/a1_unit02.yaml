teaching:
  hi.a1.unit02.lesson01.teach.shoonya:
    title: Cero
    gloss: cero
    note: El punto de partida de todos los números de esta unidad.
    example_gloss: Hoy la temperatura es cero.
  hi.a1.unit02.lesson01.teach.ek:
    title: Uno
    gloss: uno
    note: En hindi, los números del 11 al 99 son palabras independientes, sin un patrón «diez + uno»; en español, en cambio, treinta y uno se forma con piezas reconocibles. Lo verás en la lección 2, donde बीस (20) y तीस (30) no comparten ninguna parte visible con एक (1) ni con दो (2).
    example_gloss: Tengo un libro.
  hi.a1.unit02.lesson01.teach.do:
    title: Dos
    gloss: dos
    note: Un número sencillo y muy frecuente; también es el imperativo informal de «dar», pero el contexto siempre aclara el significado.
    example_gloss: Tengo dos hermanos.
  hi.a1.unit02.lesson01.teach.teen:
    title: Tres
    gloss: tres
    note: '*Chahiye* («se necesita») es una construcción impersonal habitual: *mujhe teen seb chahiye* significa literalmente «a mí tres manzanas [son] necesarias», una forma muy natural de decir «necesito».'
    example_gloss: Necesito tres manzanas.
  hi.a1.unit02.lesson01.teach.chaar:
    title: Cuatro
    gloss: cuatro
    note: 'Aquí no hay irregularidades: chaar se comporta como los demás números pequeños.'
    example_gloss: Tengo cuatro amigos.
  hi.a1.unit02.lesson01.teach.paanch:
    title: Cinco
    gloss: cinco
    note: 'Se escribe con chandrabindu (पाँच), no con anusvara: el signo vocálico de aa (ा) no sobresale por encima de la letra, y por eso se usa chandrabindu en lugar de un punto simple, igual que en हाँ/कहाँ de la unidad 1.'
    example_gloss: Tengo cinco rupias.
  hi.a1.unit02.lesson01.teach.chhah:
    title: Seis
    gloss: seis
    note: En textos antiguos también se escribe छः; छह es la ortografía moderna estándar.
    example_gloss: Tengo seis libros.
  hi.a1.unit02.lesson01.teach.saat:
    title: Siete
    gloss: siete
    note: Un número útil para hablar de los días de la semana.
    example_gloss: Una semana tiene siete días.
  hi.a1.unit02.lesson01.teach.aath:
    title: Ocho
    gloss: ocho
    note: 'Sin irregularidades: aath se comporta como los demás números pequeños.'
    example_gloss: Hay ocho sillas en esta habitación.
  hi.a1.unit02.lesson01.teach.nau:
    title: Nueve
    gloss: nueve
    note: Aquí no hace falta ninguna marca de nasalización, a diferencia de algunos números cercanos.
    example_gloss: La clase de yoga empieza a las nueve de la mañana.
  hi.a1.unit02.lesson01.teach.das:
    title: Diez
    gloss: diez
    note: El último número de este primer grupo; la lección 2 sigue con los números hasta el veinte y las decenas, que a partir de aquí dejan de ser predecibles.
    example_gloss: Tengo diez dedos en las manos.
  hi.a1.unit02.lesson02.teach.gyaarah:
    title: Once
    gloss: once
    note: 'A partir de aquí, cada número hindi es una palabra irregular propia: gyaarah no contiene de forma visible das (10) ni ek (1). No hay atajos; hay que aprender cada uno por separado.'
    example_gloss: Hay once estudiantes en esta clase.
  hi.a1.unit02.lesson02.teach.baarah:
    title: Doce
    gloss: doce
    note: 'Otro que simplemente hay que memorizar: ningún patrón previsible lo une con do (2).'
    example_gloss: Un año tiene doce meses.
  hi.a1.unit02.lesson02.teach.pandrah:
    title: Quince
    gloss: quince
    note: Muy común para hablar de periodos cortos, como un descanso de quince minutos.
    example_gloss: Necesito quince minutos.
  hi.a1.unit02.lesson02.teach.bees:
    title: Veinte
    gloss: veinte
    note: Una palabra totalmente nueva, no una combinación de das (10) y do (2); este patrón continúa en todas las decenas siguientes.
    example_gloss: Mi hermana tiene veinte años.
  hi.a1.unit02.lesson02.teach.tees:
    title: Treinta
    gloss: treinta
    note: 'De nuevo una palabra propia: se parece un poco a teen (3), pero no se forma con teen más das, así que apréndela como palabra independiente.'
    example_gloss: El billete cuesta treinta rupias.
  hi.a1.unit02.lesson02.teach.pachaas:
    title: Cincuenta
    gloss: cincuenta
    note: Un número redondo muy usado, sobre todo con los precios.
    example_gloss: Tengo cincuenta rupias.
  hi.a1.unit02.lesson02.teach.sau:
    title: Cien
    gloss: cien
    note: Un número redondo y limpio, muy frecuente en los precios cotidianos.
    example_gloss: Este libro cuesta cien rupias.
  hi.a1.unit02.lesson02.teach.keemat:
    title: Precio
    gloss: precio
    note: '*Keemat* es un sustantivo femenino: su posesivo siempre toma la forma femenina (*iski keemat*, «su precio»), sea cual sea el objeto cuyo precio se pregunta.'
    example_gloss: ¿Cuál es el precio de este billete?
  hi.a1.unit02.lesson02.teach.rupaye:
    title: Rupias
    gloss: rupias
    note: '*Rupaya* es la forma singular (para una sola rupia); *rupaye* se usa para cualquier cantidad mayor.'
    example_gloss: Esto cuesta cincuenta rupias.
  hi.a1.unit02.lesson02.teach.iski_keemat_kya_hai:
    title: Preguntar un precio
    gloss: ¿Cuál es su precio?
    note: '*Iski* («su») concuerda con el sustantivo femenino *keemat* («precio»), no con el objeto al que se le pone precio; es el mismo patrón de concordancia posesiva que la unidad 1 presentó con *mera naam*.'
  hi.a1.unit02.lesson02.teach.iski_keemat_pachaas_rupaye_hai:
    title: Decir un precio
    gloss: Su precio es de cincuenta rupias.
    note: La respuesta natural en frase completa a Iski keemat kya hai?
  hi.a1.unit02.lesson03.teach.aapka_phone_number_kya_hai:
    title: Pedir un número de teléfono, de forma formal
    gloss: ¿Cuál es su número de teléfono? (formal)
    note: '*Number* (नंबर) es un préstamo muy usado a diario en hindi. *Aapka* concuerda con el sustantivo masculino *number*.'
  hi.a1.unit02.lesson03.teach.tumhara_phone_number_kya_hai:
    title: Preguntar el número de teléfono de manera informal
    gloss: ¿Cuál es tu número de teléfono? (informal)
    note: Tumhara sustituye a aapka cuando hablas con un amigo o un igual, igual que en la unidad 1.
  hi.a1.unit02.lesson03.teach.mera_number:
    title: Dar un número, frase de introducción
    gloss: Mi número es...
    note: Una forma natural de empezar antes de leer los dígitos uno por uno.
  hi.a1.unit02.lesson03.teach.sample_number:
    title: Un número de teléfono de ejemplo
    gloss: Seis, dos, ocho, tres, cinco.
    note: En hindi los números de teléfono se leen dígito por dígito; todos los dígitos de aquí ya se vieron en la lección 1.
  hi.a1.unit02.lesson03.teach.aapki_umra_kya_hai:
    title: Preguntar la edad a alguien, de manera formal
    gloss: ¿Qué edad tiene usted? (formal)
    note: '*Umra* («edad») es un sustantivo femenino, así que *aapki* toma la forma femenina; es el mismo patrón de concordancia que *iski keemat*, ahora aplicado a la edad de una persona en lugar de a un precio.'
  hi.a1.unit02.lesson03.teach.tumhari_umra_kya_hai:
    title: Preguntar la edad a alguien, de manera informal
    gloss: ¿Cuántos años tienes? (informal)
    note: Tumhari sustituye a aapki cuando hablas con un amigo o un igual.
  hi.a1.unit02.lesson03.teach.meri_umra_tees_saal_hai:
    title: Decir tu edad
    gloss: Mi edad es de treinta años.
    note: '*Meri* concuerda con *umra* (femenino), nunca con el género de quien habla; a diferencia de las formas verbales *chahta/chahti* de la unidad 1, este posesivo no cambia según quién hable.'
  hi.a1.unit02.lesson03.teach.dialogue.line01:
    title: Arjun le pide el número a Priya
    gloss: Arjun le pide a Priya su número de teléfono, de manera informal.
    note: Repite exactamente la pregunta informal sobre el número de teléfono de esta lección.
  hi.a1.unit02.lesson03.teach.dialogue.line02:
    title: Priya da su número y pregunta el de él
    gloss: Priya dice su número de teléfono dígito por dígito y luego pregunta por el de Arjun.
    note: Todos los dígitos de aquí ya se vieron en la lección 1 de esta unidad.
  hi.a1.unit02.lesson03.teach.dialogue.line03:
    title: Arjun da su número
    gloss: Arjun dice su propio número de teléfono.
    note: De nuevo, todos los dígitos reutilizan el vocabulario de la lección 1.
  hi.a1.unit02.lesson03.teach.dialogue.line04:
    title: Priya pregunta la edad de Arjun
    gloss: Priya le da las gracias y le pregunta su edad, de manera informal.
    note: Shukriya («gracias») no cambia con el registro, igual que la tarjeta shukriya de la unidad 1.
  hi.a1.unit02.lesson03.teach.dialogue.line05:
    title: Arjun dice su edad y pregunta la de ella
    gloss: Arjun dice que tiene veinte años y luego le pregunta a Priya la suya.
    note: Tumhari? solo es una forma corta y natural de devolver la pregunta.
  hi.a1.unit02.lesson03.teach.dialogue.line06:
    title: Priya dice su edad
    gloss: Priya dice que tiene treinta años.
    note: Meri umra tees saal hai repite exactamente el patrón de frase visto antes en esta lección.
  hi.a1.unit02.lesson03.teach.dialogue.line07:
    title: Arjun cierra la conversación
    gloss: Arjun reacciona con agrado y dice que se verán de nuevo.
    note: Accha y phir milenge reutilizan el vocabulario de despedida de la unidad 1.
  hi.a1.unit02.lesson03.teach.dialogue.line08:
    title: Priya cierra la conversación
    gloss: Priya está de acuerdo y se despide de manera informal.
    note: Theek hai y phir milte hain reutilizan el vocabulario de despedida de la unidad 1.
