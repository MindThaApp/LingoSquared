    title: Alto, bajo, viejo y joven
  hi.a1.unit31.lesson02.balon_ke_bare_men:
    title: Describir el pelo
  hi.a1.unit31.lesson03.ankhen_aur_vah_kaisa:
    title: Los ojos y ¿cómo es alguien?
  hi.a1.unit31.lesson04.priya_neena_ka_huliya:
    title: Priya describe a Nina
  hi.a1.unit31.lesson05.vikram_aur_neha_kee:
    title: Comparamos a Vikram y Neha
  hi.a1.unit31.lesson06.arjun_neena_ko_pahchanta:
    title: Arjun reconoce a Nina
teaching:
  hi.a1.unit31.lesson01.teach.lanba_chhota:
    title: Alto y bajo
    gloss: alto / bajo
    note: '*लंबा* y *छोटा* describen la estatura y suelen ir con *कद* (''estatura''): *नेहा का कद लंबा है*. Terminan en *-ा* con un sustantivo masculino y en *-ी* con uno femenino.'
    example_gloss:
    - Neha es alta.
    - Vikram es bajo.
  hi.a1.unit31.lesson01.teach.boorha_javan:
    title: Viejo y joven
    gloss: viejo / joven
    note: '*बूढ़ा* y *जवान* describen la edad que aparenta alguien, sin dar ningún número.'
    example_gloss:
    - El abuelo es viejo.
    - Arjun es joven.
  hi.a1.unit31.lesson01.teach.tumharee_umr_kitnee:
    title: उम्र y बूढ़ा
    gloss: ¿Cuántos años tienes? El abuelo es mayor.
    note: Para preguntar la edad exacta el hindi usa *उम्र* ('edad'), mientras que *बूढ़ा* describe a una persona mayor sin dar ningún número.
  hi.a1.unit31.lesson01.teach.neha_ka_kad:
    title: Neha es alta y Vikram es bajo
    gloss: Neha es alta y Vikram es bajo.
    note: '*और* (''y'') une las dos descripciones, y cada *का कद* concuerda con el masculino *कद*.'
  hi.a1.unit31.lesson02.teach.bal:
    title: El pelo
    gloss: el pelo
    note: '*बाल* (''pelo'') es masculino plural en hindi, así que las palabras que lo describen terminan en *-े*: *लंबे बाल*.'
    example_gloss: Arjun tiene el pelo corto y negro.
  hi.a1.unit31.lesson02.teach.sunahre_bhoore_safed:
    title: Rubio, castaño y blanco
    gloss: rubio / castaño / blanco
    note: 'Tres colores de pelo: *सुनहरे*, *भूरे* y *सफ़ेद*; antes de *बाल* terminan en *-े*.'
    example_gloss:
    - Priya tiene el pelo rubio.
    - Vikram tiene el pelo castaño.
    - El abuelo tiene el pelo blanco.
  hi.a1.unit31.lesson02.teach.lanbe_chhote:
    title: Largo y corto (pelo)
    gloss: largo / corto (pelo)
    note: '*लंबे* (''largo'') y *छोटे* (''corto'') describen el pelo, y terminan en *-े* porque *बाल* es plural.'
    example_gloss:
    - Neha tiene el pelo largo.
    - Vikram tiene el pelo corto.
  hi.a1.unit31.lesson02.teach.lanbe_bal_chhote:
    title: Adjetivos antes de बाल
    gloss: Pelo largo, pelo corto, pelo rubio, pelo castaño, pelo blanco, pelo negro.
    note: '*बाल* es masculino plural, así que el adjetivo que va delante termina en *-े*: *लंबे बाल*, *भूरे बाल*.'
  hi.a1.unit31.lesson02.teach.uske_bal_lanbe:
    title: 'उसके: su (de él o de ella)'
    gloss: Su pelo es largo (de él o de ella).
    note: '*उसके* significa tanto ''su (de él)'' como ''su (de ella)'', así que solo el contexto indica cuál; aquí concuerda con el plural *बाल*.'
  hi.a1.unit31.lesson02.teach.arjun_ke_bal:
    title: Arjun tiene el pelo corto y negro
    gloss: Arjun tiene el pelo corto y negro.
    note: Aquí se usa otra vez *काले*, ahora para el pelo, y termina en *-े* porque *बाल* es plural.
  hi.a1.unit31.lesson02.teach.priya_ke_bal:
    title: Priya tiene el pelo largo y rubio
    gloss: Priya tiene el pelo largo y rubio.
    note: Combina el vocabulario de longitud y de color de esta lección en una frase natural.
  hi.a1.unit31.lesson03.teach.ankhen:
    title: Los ojos
    gloss: los ojos
    note: '*आँखें* (''ojos'') es un sustantivo femenino plural; el singular es *आँख*.'
    example_gloss: Arjun tiene los ojos castaños.
  hi.a1.unit31.lesson03.teach.neela_bhoora_hara:
    title: Azul, marrón y verde
    gloss: azul / marrón / verde
    note: 'Tres colores de ojos: *नीला*, *भूरा* y *हरा*; delante del femenino *आँखें* pasan a *नीली*, *भूरी* y *हरी*.'
    example_gloss:
    - Priya tiene los ojos azules.
    - Vikram tiene los ojos castaños.
    - Neha tiene los ojos verdes.
  hi.a1.unit31.lesson03.teach.neelee_ankhen_bhooree:
    title: Adjetivos antes de आँखें
    gloss: Ojos azules, ojos castaños, ojos verdes.
    note: '*आँखें* es femenino, así que el adjetivo que va delante termina en *-ी*: *नीली आँखें*.'
  hi.a1.unit31.lesson03.teach.priya_kaisee_dikhtee:
    title: ¿Cómo es Priya físicamente?
    gloss: ¿Cómo es Priya físicamente?
    note: '*कैसी दिखती है?* (''¿cómo se ve ella?'') es la pregunta clave: *कैसी* y *दिखती* son femeninos para una mujer, y *कैसा* y *दिखता* son masculinos para un hombre.'
  hi.a1.unit31.lesson03.teach.priya_ke_bal:
    title: Priya tiene el pelo largo y rubio y los ojos azules
    gloss: Priya tiene el pelo largo y rubio y los ojos azules.
    note: 'Una respuesta modelo: pelo y ojos unidos con *और*. El poseedor lleva *के* con el plural *बाल* y *की* con el femenino *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_bhasha_kaife:
    title: Priya presenta a Nina
    gloss: 'Priya: Una chica nueva viene al café de idiomas. Se llama Nina.'
    note: '*आ रही है* (''viene'') introduce a alguien nuevo, y *उसका नाम ... है* indica el nombre.'
  hi.a1.unit31.lesson04.teach.arjun_oke_vah:
    title: Arjun pregunta cómo es físicamente
    gloss: 'Arjun: ¡Vale! ¿Cómo es físicamente?'
    note: '*वह देखने में कैसी है?* pregunta ''¿cómo es a la vista?''; *वह* significa tanto ''él'' como ''ella''.'
  hi.a1.unit31.lesson04.teach.priya_uska_kad:
    title: Priya describe la estatura y el pelo de Nina
    gloss: 'Priya: Es baja y tiene el pelo corto y rubio.'
    note: 'Aquí se unen la estatura y el pelo: *उसका कद छोटा है और उसके बाल छोटे और सुनहरे हैं*.'
  hi.a1.unit31.lesson04.teach.arjun_aur_uskee:
    title: Arjun pregunta por sus ojos
    gloss: 'Arjun: ¿Y sus ojos?'
    note: '*उसकी आँखें* significa ''sus ojos (de ella)''; *उसकी* es femenino para concordar con *आँखें*.'
  hi.a1.unit31.lesson04.teach.priya_uskee_ankhen:
    title: Priya describe los ojos de Nina
    gloss: 'Priya: Tiene los ojos verdes.'
    note: '*हरी* termina en *-ी* porque *आँखें* es femenino.'
  hi.a1.unit31.lesson04.teach.arjun_shukriya_tab:
    title: Arjun la reconocerá
    gloss: 'Arjun: ¡Gracias! Entonces la reconoceré.'
    note: '*पहचान लूँगा* (''reconoceré'') es el futuro de *पहचानना*, y *उसे* significa ''la''.'
  hi.a1.unit31.lesson05.teach.vikram_aur_neha:
    title: Comparamos a Vikram y Neha
    gloss: Vikram y Neha son hermanos, pero no se parecen. Vikram es bajo y tiene el pelo corto y castaño y los ojos castaños. Neha es más alta que Vikram y tiene el pelo largo y castaño y los ojos verdes. ¿Y tú, cómo eres físicamente?
    note: Una breve comparación que reúne todas las palabras de color y de longitud vistas hasta ahora y termina con la pregunta clave de la unidad dirigida al lector.
    glosses:
      भाई: hermano
      बहन: hermana
      दिखते: parecerse
      अलग: diferentes
      छोटा: bajo
      छोटे: bajo
      भूरे: castaño
      बाल: pelo
      भूरी: castaño
      आँखें: ojos
      लंबी: más alta
      लंबे: largo
      हरी: verdes
      कैसे: cómo (como en '¿cómo eres físicamente?')
  hi.a1.unit31.lesson05.teach.vikram_neha_se:
    title: Comparar con से
    gloss: Vikram es más bajo que Neha.
    note: 'Aquí *से* significa ''que'' y va después de la persona con quien se compara: *नेहा से छोटा*; el adjetivo va justo antes del verbo.'
  hi.a1.unit31.lesson05.teach.neha_ke_bal:
    title: Neha tiene el pelo más largo que Vikram
    gloss: Neha tiene el pelo más largo que Vikram.
    note: '*लंबे* concuerda con el plural *बाल*, y *विक्रम से* expresa la comparación.'
  hi.a1.unit31.lesson05.teach.mere_bal_chhote:
    title: Tengo el pelo corto y castaño
    gloss: Tengo el pelo corto y castaño.
    note: '*मेरे बाल छोटे और भूरे हैं* (''tengo el pelo corto y castaño'') es una oración modelo para describirte a ti mismo; *मेरे* concuerda con el plural *बाल*.'
  hi.a1.unit31.lesson06.teach.arjun_dekho_kya:
    title: Arjun ve a Nina
    gloss: 'Arjun: Mira, ¿esa es Nina? Tiene el pelo corto y rubio y los ojos verdes.'
    note: '*देखो* (''mira'') es el imperativo informal para un amigo.'
  hi.a1.unit31.lesson06.teach.priya_han_vahee:
    title: Priya lo confirma
    gloss: 'Priya: ¡Sí, esa es Nina!'
    note: Una confirmación breve y natural.
  hi.a1.unit31.lesson06.teach.neena_hay_kya:
    title: Nina saluda a Arjun
    gloss: 'Nina: Hola, ¿eres Arjun?'
    note: '*क्या तुम अर्जुन हो?* es una pregunta informal sencilla para alguien de tu edad.'
  hi.a1.unit31.lesson06.teach.arjun_han_tumse:
    title: Arjun saluda a Nina
    gloss: 'Arjun: ¡Sí! Encantado de conocerte, Nina.'
    note: '*तुमसे मिलकर अच्छा लगा* es la frase habitual al conocer a alguien por primera vez; el sentimiento le «sucede» a quien habla, así que no hace falta una palabra para «yo».'
  hi.a1.unit31.lesson06.teach.neena_mujhe_bhee:
    title: Nina responde al saludo
    gloss: 'Nina: ¡Encantada de conocerte también!'
    note: 'Cierra el diálogo: Arjun reconoció a Nina gracias a la descripción que Priya hizo antes.'
