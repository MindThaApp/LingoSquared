teaching:
  hi.a1.unit13.lesson01.teach.chai_coffee_review:
    title: 'Repaso: té, café'
    gloss: té, café
    note: Un repaso rápido del vocabulario de la unidad 6, necesario para hablar de gustos y disgustos en esta unidad.
    example_gloss:
    - Quiero té.
    - Quiero café.
  hi.a1.unit13.lesson01.teach.mujhe_review:
    title: 'Repaso: a mí'
    gloss: a mí
    note: 'El pronombre en dativo visto antes y usado en las unidades 6, 7 y 11: esta unidad lo combina con un nuevo predicado.'
    example_gloss: Quiero té.
  hi.a1.unit13.lesson01.teach.pasand:
    title: Gusto / que gusta
    gloss: gusto / que gusta
    note: 'Un sustantivo que significa «agrado» (no «favorito»): junto con un sujeto en dativo (mujhe/tumhein) y la cópula hai/hain, forma la expresión para «me gusta...».'
    example_gloss: Me gusta el té.
  hi.a1.unit13.lesson01.teach.pasand_hai_grammar:
    title: Pasand hai = me gusta
    gloss: '''Pasand hai'' significa «X me agrada», es decir, «me gusta X». Empieza con mujhe/tumhein igual que ''mujhe...chahiye'' (unidad 6), pero, a diferencia de ''chahiye'' (que no lleva ''hai'' después), ''pasand'' siempre necesita ''hai'' o ''hain'' detrás.'
    note: Explica de forma clara la diferencia estructural entre chahiye (querer/necesitar) y pasand hai (gustar), para que no se confundan las dos construcciones.
  hi.a1.unit13.lesson01.teach.sangeet:
    title: La música
    gloss: música
    note: Un sustantivo nuevo, para practicar la construcción pasand hai con un sujeto singular e incontable.
    example_gloss: Me gusta la música.
  hi.a1.unit13.lesson01.teach.haan_nahi_review:
    title: 'Repaso: sí, no'
    gloss: sí, no
    note: Un repaso rápido de dos palabras iniciales, necesarias para responder y negar preguntas sobre preferencias en esta unidad.
    example_gloss:
    - Sí, me gusta la música.
    - No, no me gusta el café.
  hi.a1.unit13.lesson01.teach.pasand_nahi_hai_phrase:
    title: No me gusta el café.
    gloss: No me gusta el café.
    note: 'La negación funciona igual que en otras frases con hai ya vistas (p. ej., ''yoga class nahin hai'' de la unidad 3): nahin va justo antes de hai.'
  hi.a1.unit13.lesson01.teach.kitab_kitaben:
    title: Libro / libros
    gloss: libro / libros
    note: Un nuevo par de sustantivos, singular y plural, para mostrar que 'hai'/'hain' después de pasand concuerda con el número de lo que gusta.
    example_gloss:
    - Me gusta el libro.
    - Me gustan los libros.
  hi.a1.unit13.lesson01.teach.number_agreement_grammar:
    title: Hai o hain después de pasand
    gloss: '''Hai'' o ''hain'' después de ''pasand'' concuerda con el NÚMERO de lo que gusta, igual que ''mere paas...hai/hain'' (unidad 2): té/música pasand hai (singular), libros pasand hain (plural).'
    note: Extiende directamente la regla de concordancia de número hai/hain de la unidad 2 a un contexto nuevo, en lugar de introducir un concepto gramatical nuevo.
  hi.a1.unit13.lesson02.teach.tumhein_review:
    title: 'Repaso: a ti (informal)'
    gloss: a ti (informal)
    note: Se vio por primera vez en la unidad 6 con chahiye ('tumhein...chahiye?'); aquí se reutiliza el mismo pronombre en dativo con pasand hai.
    example_gloss: ¿Te gusta la música?
  hi.a1.unit13.lesson02.teach.kya_tumhein_pasand_hai_grammar:
    title: Kya tumhein...pasand hai?
    gloss: '''Kya'' al comienzo de una pregunta es la marca de pregunta de sí/no (unidad 1); ''tumhein'' repite el mismo esquema con sujeto en dativo de ''tumhein...chahiye?'' (unidad 6): aquí ''pasand hai'' sustituye a ''chahiye''.'
    note: Confirma que se trata de una nueva aplicación de un esquema de pregunta ya conocido, no de un punto gramatical nuevo.
  hi.a1.unit13.lesson02.teach.khel:
    title: Deporte / juego
    gloss: deporte / juego
    note: Un sustantivo nuevo. Se combina con 'yah' (este) en los ejemplos para que la concordancia de número sea clara, ya que 'khel' no cambia de forma entre singular y plural.
    example_gloss: Me gusta este deporte.
  hi.a1.unit13.lesson02.teach.yah_review:
    title: 'Repaso: este'
    gloss: este
    note: Se vio por primera vez en la unidad 7 ('mujhe yah chahiye'); aquí se reutiliza para que la referencia en singular a 'khel' quede clara.
    example_gloss: Este libro es bueno.
  hi.a1.unit13.lesson02.teach.ya_review:
    title: 'Repaso: o'
    gloss: o
    note: Se vio por primera vez en las unidades 6 y 7 para pedir comida y artículos; aquí se reutiliza para formular una pregunta de elección sobre gustos.
    example_gloss: ¿Té o café?
  hi.a1.unit13.lesson02.teach.chai_ya_coffee_phrase:
    title: ¿Te gusta el té o el café?
    gloss: ¿Te gusta el té o el café?
    note: Combina el esquema de pregunta con tumhein de esta lección con ya (o), ya conocido, para pedirte que elijas.
  hi.a1.unit13.lesson02.teach.zyada:
    title: Más
    gloss: más
    note: Una palabra nueva que se coloca justo antes de 'pasand hai' para expresar preferencia entre dos cosas ya nombradas.
    example_gloss: Me gusta más el té.
  hi.a1.unit13.lesson02.teach.zyada_pasand_grammar:
    title: Zyada pasand hai = preferir
    gloss: '''X zyada pasand hai'' significa preferir una de dos cosas: ''mujhe chai zyada pasand hai'' significa «me gusta más el té» / «prefiero el té».'
    note: 'Es una ampliación léxica, no gramática nueva: ''zyada'' simplemente modifica ''pasand hai'', que ya conoces.'
    target_text: '''X ज़्यादा पसंद है'' का मतलब है दो चीज़ों में से एक को तरजीह देना (preferir) -- ''मुझे चाय ज़्यादा पसंद है'' का मतलब है ''me gusta más el té'' / ''prefiero el té''।'
  hi.a1.unit13.lesson03.teach.review_words:
    title: 'Repaso: música, deporte, libros'
    gloss: música, deporte/juego, libros
    note: Un repaso rápido de los sustantivos clave de esta unidad, necesarios para el diálogo y la nota de lectura.
    example_gloss:
    - Me gusta la música.
    - No me gusta este deporte.
    - Me gustan los libros.
  hi.a1.unit13.lesson03.teach.dialogue.line01:
    title: Arjun pregunta por la música
    gloss: Priya, ¿te gusta la música?
  hi.a1.unit13.lesson03.teach.dialogue.line02:
    title: Priya dice que le gusta mucho
    gloss: Sí, me gusta mucho la música. ¿Y a ti?
  hi.a1.unit13.lesson03.teach.dialogue.line03:
    title: Arjun coincide y añade el deporte
    gloss: ¡A mí también! Y también me gusta el deporte.
  hi.a1.unit13.lesson03.teach.dialogue.line04:
    title: Priya prefiere los libros a este juego
    gloss: ¡Qué bien! No me gusta este juego. Me gustan los libros.
  hi.a1.unit13.lesson03.teach.dialogue.line05:
    title: Arjun pregunta si prefiere té o café
    gloss: Vale. ¿Te gusta el té o el café?
  hi.a1.unit13.lesson03.teach.dialogue.line06:
    title: Priya prefiere el té
    gloss: Me gusta más el té.
  hi.a1.unit13.lesson03.teach.dialogue.line07:
    title: Arjun coincide
    gloss: ¡Muy bien! A mí también me gusta el té.
  hi.a1.unit13.lesson03.teach.dialogue.line08:
    title: Priya se despide
    gloss: ¡Vale! ¿Nos vemos otra vez mañana?
  hi.a1.unit13.lesson03.teach.chahiye_pasand_zyada_grammar:
    title: Tres patrones relacionados
    gloss: 'Los tres patrones de esta unidad: «chahiye» (querer/necesitar, unidad 6) no lleva «hai» detrás; «pasand hai/hain» (esta unidad) cambia según el número de lo que gusta; «zyada pasand hai» expresa la preferencia entre dos cosas.'
    note: Resumen final que une toda la gramática de la unidad, igual que la nota gramatical de la unidad 12 reunía su paradigma.
    target_text: 'इस यूनिट के तीन तरीके: ''चाहिए'' (चाहना/ज़रूरत, यूनिट 6) के बाद ''है'' नहीं आता; ''पसंद है/हैं'' (यह यूनिट) चीज़ की संख्या से बदलता है; ''ज़्यादा पसंद है'' का मतलब है दो में से एक को तरजीह देना (preferir)।'
  hi.a1.unit13.lesson03.teach.priya_note:
    title: La nota de Priya
    gloss: Arjun, me gusta mucho la música. También me gustan los libros. No me gusta este juego. Me gusta más el té. - Priya
    note: Una nota breve que repite exactamente los datos ya presentados en el diálogo, sin añadir nada nuevo.
    glosses:
      संगीत: música
      बहुत: mucho
      पसंद: gustado / agradable
      किताबें: libros
      खेल: juego
      नहीं: 'no'
      चाय: té
      ज़्यादा: más / de preferencia
