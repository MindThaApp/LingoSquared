answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. No new spelling AMBIGUITY was needed for this unit's own new vocabulary -- बाएँ/दाएँ/जाऊँ all follow the already-established non-ascending-vowel-sign chandrabindu rule from units 01-08 (यहाँ, वहाँ, कहाँ). In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?), exclamation marks, and commas may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks.
