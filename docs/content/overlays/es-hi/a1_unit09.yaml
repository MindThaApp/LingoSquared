teaching:
  hi.a1.unit09.lesson01.teach.review_places:
    title: 'Repaso: lugares'
    gloss: banco, escuela, hospital, parque, estación, oficina de correos
    note: Un repaso rápido de las palabras de lugar de la unidad anterior; esta unidad las usa mucho.
    example_gloss:
    - El banco está aquí.
    - La oficina de correos está cerca del banco.
  hi.a1.unit09.lesson01.teach.review_function_words:
    title: 'Repaso: es/está, dónde, aquí, allí, desde, de, bien'
    gloss: es/está, dónde, aquí, allí, desde, de, bien
    note: Un repaso rápido de palabras funcionales de unidades anteriores que los ejercicios de esta unidad vuelven a usar.
    example_gloss:
    - ¿Dónde está el banco?
    - El parque está allí.
  hi.a1.unit09.lesson01.teach.seedhe_baaen_daaen:
    title: Recto, izquierda, derecha
    gloss: todo recto, izquierda, derecha
    note: Las tres palabras básicas de dirección de esta unidad.
    example_gloss:
    - Sigue recto.
    - Gira a la izquierda.
  hi.a1.unit09.lesson01.teach.jao_muro:
    title: ¡Ve!, ¡dobla!
    gloss: ¡ve!, ¡dobla! (orden informal)
    note: 'Órdenes en forma tum: el registro natural entre dos amigos que se indican el camino.'
    example_gloss:
    - Sigue recto.
    - Gira a la derecha.
  hi.a1.unit09.lesson01.teach.yahan_se_seedhe_jao:
    title: Ve recto desde aquí
    gloss: Ve todo recto desde aquí.
    note: Combina las palabras nuevas de esta lección con 'yahaan se' (desde aquí).
  hi.a1.unit09.lesson01.teach.baaen_muro_phrase:
    title: Gira a la izquierda
    gloss: Gira a la izquierda.
    note: Una orden independiente, lista para usar sola.
  hi.a1.unit09.lesson01.teach.daaen_muro_phrase:
    title: Gira a la derecha
    gloss: Gira a la derecha.
    note: La orden simétrica de 'baaen muro'.
  hi.a1.unit09.lesson01.teach.imperative_note:
    title: La terminación -o de las órdenes
    gloss: '''Jaao'' y ''muro'' son órdenes en forma tum, como ''bataao'' y ''gino'': todas terminan en ''-o''.'
    note: Señala el patrón común de las órdenes informales con dos palabras ya enseñadas en unidades anteriores (bataao en la unidad 7, gino en la unidad 2).
  hi.a1.unit09.lesson02.teach.bank_kaise_jaun:
    title: ¿Cómo llego al banco?
    gloss: ¿Cómo llego al banco?
    note: La pregunta básica para pedir indicaciones, con la forma de primera persona «debo ir».
  hi.a1.unit09.lesson02.teach.tak:
    title: Hasta
    gloss: hasta
    note: Ya apareció en la unidad 2 para contar ('zero se das tak'); aquí se reutiliza en su sentido espacial, igualmente real.
    example_gloss: Sigue recto hasta el banco.
  hi.a1.unit09.lesson02.teach.bank_tak_seedhe_jao:
    title: Sigue recto hasta el banco
    gloss: Sigue recto hasta el banco.
    note: Una frase de ejemplo con 'tak' en sentido espacial.
  hi.a1.unit09.lesson02.teach.pahle_phir:
    title: Primero, luego
    gloss: primero, luego
    note: Un par de palabras que sirve para ordenar dos pasos de una indicación.
    example_gloss:
    - Primero sigue recto.
    - Luego gira a la izquierda.
  hi.a1.unit09.lesson02.teach.pahle_seedhe_phir_baaen:
    title: Primero recto, luego a la izquierda
    gloss: Primero sigue recto, luego gira a la izquierda.
    note: Une 'pahle' y 'phir' en una indicación de dos pasos.
  hi.a1.unit09.lesson02.teach.pahle_phir_note:
    title: Pahle y phir
    gloss: '''Pahle'' y ''phir'' unen dos pasos: la primera acción va con ''pahle'' y la segunda con ''phir'', como en ''pahle seedhe jaao, phir baaen muro.'''
    note: Un punto de gramática real y útil para encadenar indicaciones de varios pasos.
  hi.a1.unit09.lesson03.teach.nukkad:
    title: Esquina
    gloss: esquina
    note: Una palabra de lugar nueva para el diálogo final de la lección; se usa con 'par' (en).
    example_gloss:
    - El banco está en la esquina.
    - El parque está detrás de la escuela.
  hi.a1.unit09.lesson03.teach.bas:
    title: Solo / nada más
    gloss: solo / nada más
    note: También es un préstamo muy común para 'autobús' (el vehículo), pero ese sentido no se enseña en este curso, así que aquí no hay confusión posible.
    example_gloss: Solo sigue un poco más.
  hi.a1.unit09.lesson03.teach.samajh_gaya:
    title: Entendido / ya entendí
    gloss: entendido / ya entendí
    note: 'Una expresión habitual de dos palabras: ''samajh'' (la raíz de ''samajhna'', entender) más ''gaya'' (fue), que marca la acción como terminada. Esta es la forma masculina; Priya diría ''samajh gayi''.'
    example_gloss: Entendí. / Ya entendí.
  hi.a1.unit09.lesson03.teach.accha_bahut_shukriya:
    title: ¡Vale! ¡Muchas gracias!
    gloss: ¡Vale! ¡Muchas gracias!
    note: Reutiliza 'accha', 'bahut' y 'shukriya' de unidades anteriores.
  hi.a1.unit09.lesson03.teach.koi_baat_nahin_phir_milenge:
    title: ¡De nada! Nos vemos.
    gloss: ¡De nada! Nos vemos.
    note: La frase de despedida habitual de este curso, repetida tal cual de la Unidad 8.
  hi.a1.unit09.lesson03.teach.dialogue.line01:
    title: Arjun pregunta por la oficina de correos
    gloss: Arjun le pregunta a Priya cómo llegar a la oficina de correos.
    note: Reutiliza el patrón de pregunta con el que empezó esta lección en la lección 2.
  hi.a1.unit09.lesson03.teach.dialogue.line02:
    title: Priya empieza a dar indicaciones
    gloss: 'Priya dice: desde aquí, primero sigue recto.'
    note: Reutiliza 'yahaan se' y 'pahle' de antes en esta unidad.
  hi.a1.unit09.lesson03.teach.dialogue.line03:
    title: Arjun pregunta qué sigue
    gloss: Arjun dice que vale y pregunta qué hay después.
  hi.a1.unit09.lesson03.teach.dialogue.line04:
    title: Priya continúa
    gloss: 'Priya dice: luego gira a la izquierda en la esquina del banco.'
    note: Presenta 'nukkad' (esquina) en contexto.
  hi.a1.unit09.lesson03.teach.dialogue.line05:
    title: Arjun confirma y vuelve a preguntar
    gloss: Arjun repite «izquierda», confirma que vale y pregunta qué sigue.
  hi.a1.unit09.lesson03.teach.dialogue.line06:
    title: Priya termina la primera ruta
    gloss: 'Priya dice: solo sigue un poco más; la oficina de correos está allí, cerca del banco.'
    note: 'Presenta ''bas'' (solo / nada más) y es coherente con lo ya establecido en la Unidad 8: la oficina de correos está cerca del banco.'
  hi.a1.unit09.lesson03.teach.dialogue.line07:
    title: Arjun entiende y pregunta por el parque
    gloss: Arjun dice que ya entendió y pregunta cómo llegar al parque.
    note: Presenta la expresión 'samajh gaya'.
  hi.a1.unit09.lesson03.teach.dialogue.line08:
    title: Priya da la segunda ruta
    gloss: 'Priya dice: ¿el parque? Primero sigue recto, luego gira a la derecha; el parque está detrás de la escuela.'
    note: 'Es coherente con lo ya establecido en la Unidad 8: el parque está detrás de la escuela.'
  hi.a1.unit09.lesson03.teach.dialogue.line09:
    title: Arjun le da las gracias a Priya
    gloss: Arjun dice que ya entendió y le da las gracias a Priya.
  hi.a1.unit09.lesson03.teach.dialogue.line10:
    title: Priya se despide
    gloss: Priya dice que de nada y que se ven pronto.
    note: La misma frase de despedida del diálogo de la Unidad 8, repetida tal cual.
