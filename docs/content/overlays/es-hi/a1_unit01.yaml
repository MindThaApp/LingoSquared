answer_policy:
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction (हूँ, हाँ, कहाँ vs. मैं, हैं, में, मिलेंगे). In typed A1 answers, accept a variant that drops the nasalization mark entirely or substitutes anusvara for chandrabindu (हूं for हूँ, हां for हाँ) when every other character is correct -- these marks are small, easy to miss on a virtual keyboard, and near-homophonous in casual speech; this is a beginner course, not a spelling test. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark, matching how it is actually printed and taught. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent -- most everyday Hindi typed on phones/keyboards uses a plain period, and this distinction carries no meaning difference. Question marks (?) and exclamation marks may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility and appropriate register (aap vs. tum) rather than written punctuation or nasalization marks.
course:
  title: Hindi A1
  description: Aprende a saludar, preguntar cómo está alguien, presentarte e intercambiar información personal básica en hindi. La guía destaca el sistema de formalidad aap/tum (una distinción gramatical real, parecida a la de tú/usted pero con sus propias formas verbales) y los adjetivos y formas verbales del hindi que concuerdan en género.
units:
  hi.a1.unit01.greetings:
    title: Namaste y primeros encuentros
lessons:
  hi.a1.unit01.lesson01.aap_and_tum:
    title: 'Aap y tum: preguntar cómo está alguien'
  hi.a1.unit01.lesson02.greetings_and_farewells:
    title: Saludos y despedidas
  hi.a1.unit01.lesson03.names_origin_and_dialogue:
    title: Nombres, origen y un primer encuentro en una clase de yoga
teaching:
  hi.a1.unit01.lesson01.teach.aap:
    title: «Usted» formal y respetuoso
    gloss: usted (formal, respetuoso)
    note: 'Como en español con tú y usted, el hindi marca una elección social real: *aap* se usa con alguien mayor, desconocido o en una relación profesional respetuosa. Gramaticalmente se trata como plural aunque sea una sola persona: los verbos que concuerdan con *aap* llevan las mismas terminaciones tipo -en/hain que se usan para «ellos».'
  hi.a1.unit01.lesson01.teach.tum:
    title: Tú (trato informal)
    gloss: tú (informal, familiar)
    note: '*Tum* se usa con un amigo, un igual, una persona más joven o un familiar: una relación informal, pero todavía respetuosa (no es lo mismo que *tu*, aún más íntimo, que este curso no enseña). *Tum* tiene sus propias terminaciones verbales, distintas de las de *aap* y de *tu*.'
  hi.a1.unit01.lesson01.teach.aap_kaise_hain:
    title: Pregunta formal por el bienestar, a un hombre
    gloss: ¿Cómo está usted? (formal, a un hombre)
    note: '*Kaise* concuerda con el GÉNERO DE LA PERSONA A QUIEN SE PREGUNTA, no con el de quien habla; esta forma se usa al dirigirse a un hombre. En español «cómo» nunca cambia así, pero en hindi sí varía.'
  hi.a1.unit01.lesson01.teach.aap_kaisi_hain:
    title: ¿Cómo está usted? (a una mujer, formal)
    gloss: ¿Cómo está usted? (formal, a una mujer)
    note: 'Misma pregunta, mismo registro *aap*: solo *kaisi* cambia respecto a *kaise*, al concordar con una interlocutora. El verbo *hain* nunca cambia; solo cambia la forma del adjetivo.'
  hi.a1.unit01.lesson01.teach.tum_kaise_ho:
    title: Pregunta informal sobre cómo estás
    gloss: ¿Cómo estás? (informal)
    note: 'Con *tum*, el verbo es *ho*, no *hain*: compara el formal *Aap kaise/kaisi hain?* con el informal *Tum kaise ho?*. Es el mejor par mínimo para oír la distinción aap/tum en el propio verbo.'
  hi.a1.unit01.lesson01.teach.main_theek_hoon:
    title: Una respuesta habitual
    gloss: Estoy bien, gracias.
    note: '*Theek* («bien/de acuerdo») no cambia según el género ni el registro: a diferencia de *kaise/kaisi*, se mantiene igual sin importar quién habla ni a quién se habla.'
  hi.a1.unit01.lesson01.teach.aur_aap:
    title: Devolver la pregunta de forma formal
    gloss: ¿Y usted?
    note: Una forma breve de devolver la pregunta en el registro respetuoso de aap.
  hi.a1.unit01.lesson01.teach.aur_tum:
    title: Devolver la pregunta de forma informal
    gloss: ¿Y tú?
    note: Usa tum para devolver la pregunta a un amigo o igual.
  hi.a1.unit01.lesson02.teach.namaste:
    title: Saludo para cualquier ocasión
    gloss: hola; (también se usa para despedirse)
    note: '*Namaste* sirve a cualquier hora del día, en contextos formales e informales, y tanto para empezar como para terminar una conversación: es un saludo realmente universal, mientras que el español distingue entre palabras de saludo y de despedida.'
    example_gloss: ¡Hola! ¿Cómo estás?
  hi.a1.unit01.lesson02.teach.namaskar:
    title: Saludo respetuoso
    gloss: hola (más formal y respetuoso que namaste)
    note: '*Namaskar* significa básicamente lo mismo que *namaste*, pero tiene un tono más formal y respetuoso: es apropiado con una persona mayor, ante un público numeroso o en un entorno profesional.'
    example_gloss: ¡Namaskar! ¿Y usted?
  hi.a1.unit01.lesson02.teach.phir_milenge:
    title: Hasta la próxima (futuro)
    gloss: hasta la próxima; hasta luego
    note: 'Literalmente «[nos] encontraremos de nuevo»: una forma estándar y neutra de despedirse cuando esperas volver a ver a la persona.'
  hi.a1.unit01.lesson02.teach.alvida:
    title: Despedida formal
    gloss: adiós; despedida
    note: '*Alvida* es una palabra hindi real y correcta para decir adiós, pero en el uso cotidiano tiene un tono más definitivo, formal e incluso algo dramático que *namaste* o *phir milenge*: se parece más a «despedida» que a un informal «chao».'
    example_gloss: ¡Adiós! Hasta la próxima.
  hi.a1.unit01.lesson02.teach.phir_milte_hain:
    title: Nos vemos (informal/habitual)
    gloss: nos vemos; hasta pronto
    note: 'Literalmente «[nos] encontramos de nuevo», con la forma verbal de presente habitual en lugar del futuro: un equivalente cotidiano algo más informal de *phir milenge*.'
  hi.a1.unit01.lesson02.teach.shubh_ratri:
    title: Buenas noches
    gloss: buenas noches (para ir a dormir)
    note: 'Se dice cuando alguien se va a pasar la noche o a acostarse: como «buenas noches» en español en ese uso, es una despedida, nunca un saludo de apertura, a diferencia de *namaste*.'
  hi.a1.unit01.lesson02.teach.shubh_din:
    title: Deseo de cortesía al despedirse
    gloss: Que tengas un buen día.
    note: 'Literalmente «que tu día siga siendo bueno»: un deseo cortés de despedida, apropiado al separarse de alguien con respeto, ya sea en una relación formal o informal.'
  hi.a1.unit01.lesson03.teach.aapka_naam_kya_hai:
    title: Preguntar el nombre, de forma formal
    gloss: ¿Cómo se llama usted? (formal)
    note: '*Aapka* («su») concuerda con el sustantivo masculino *naam* («nombre»): los posesivos del hindi cambian de forma según la cosa poseída, no según el poseedor (en español ocurre algo parecido con «mi/mis», pero el hindi también distingue el género).'
  hi.a1.unit01.lesson03.teach.tumhara_naam_kya_hai:
    title: Preguntar el nombre, de manera informal
    gloss: ¿Cómo te llamas? (informal)
    note: Mismo patrón con *tumhara* («tu», informal) en lugar de *aapka*. Compara el formal *Aapka naam kya hai?* con el informal *Tumhara naam kya hai?*.
  hi.a1.unit01.lesson03.teach.mera_naam_priya_hai:
    title: Decir tu nombre
    gloss: Me llamo Priya.
    note: '*Mera* («mi») también concuerda con *naam*, que es masculino: observa que tiene la misma terminación masculina que *aapka*/*tumhara* arriba, porque los tres modifican el mismo sustantivo.'
  hi.a1.unit01.lesson03.teach.aapse_milkar_khushi_hui:
    title: Expresar el gusto de conocer a alguien, de manera formal
    gloss: Mucho gusto. (formal)
    note: 'Literalmente «habiéndole conocido, ocurrió la alegría»: una expresión fija y muy usada para un primer encuentro respetuoso.'
  hi.a1.unit01.lesson03.teach.mujhe_bhi:
    title: Devolver el gesto
    gloss: Yo también.
    note: Una respuesta breve y natural a Aapse milkar khushi hui o a Tumse milkar accha laga.
  hi.a1.unit01.lesson03.teach.aap_kahan_se_hain:
    title: Preguntar el origen, de manera formal
    gloss: ¿De dónde es usted?
    note: Kahan significa «dónde»; se significa «de».
  hi.a1.unit01.lesson03.teach.main_bharat_se_hoon:
    title: Decir de dónde eres
    gloss: Soy de India.
    note: Bharat es el nombre de India en hindi y se usa constantemente en el habla cotidiana.
  hi.a1.unit01.lesson03.teach.tum_kahan_se_ho:
    title: Preguntar el origen, de forma informal
    gloss: ¿De dónde eres? (informal)
    note: 'La misma pregunta con *tum* y *ho* en lugar de *aap* y *hain*: es el mismo patrón de terminaciones verbales formal/informal visto a lo largo de esta unidad.'
  hi.a1.unit01.lesson03.teach.dialogue.line01:
    title: Inicio del encuentro
    gloss: Priya saluda a Arjun y le pregunta si es la primera vez que viene.
    note: Ambos hablantes usan el registro informal *tum* desde el principio, algo natural entre dos iguales que se conocen en una clase comunitaria. *Tumhari* («tu») concuerda con el sustantivo femenino *baar* («vez», en el sentido de «ocasión»), no con el género de ninguno de los hablantes.
  hi.a1.unit01.lesson03.teach.dialogue.line02:
    title: Inicio del encuentro, respuesta
    gloss: Arjun dice que sí, que es su primera vez y que quiere aprender yoga.
    note: '*Chahta hoon* («quiero») toma aquí la forma masculina porque Arjun, quien habla, es hombre: este verbo concuerda con el género de QUIEN HABLA, a diferencia de *kaisi*/*kaise* de antes, que concordaban con la persona A QUIEN SE HABLA.'
  hi.a1.unit01.lesson03.teach.dialogue.line03:
    title: Intercambiar nombres
    gloss: Priya dice «¡yo también!», da su nombre y pregunta el de Arjun.
    note: '*Main bhi!* («¡yo también!») responde a *main ... chahta hoon* de Arjun: cuando la frase de la otra persona tiene *main* como sujeto, «yo también» es *main bhi*. *Mujhe bhi* es la respuesta a una frase de tipo *mujhe*, como *Tumse milkar accha laga*. *Mera naam...hai* es la forma natural y sencilla de dar el nombre.'
  hi.a1.unit01.lesson03.teach.dialogue.line04:
    title: Intercambiar nombres, respuesta
    gloss: Arjun da su nombre y dice, de manera informal, que le ha dado gusto conocerla.
    note: '*Tumse milkar accha laga* es el equivalente informal del formal *Aapse milkar khushi hui* de esta lección: ambos significan más o menos «mucho gusto», según el registro.'
  hi.a1.unit01.lesson03.teach.dialogue.line05:
    title: Preguntar por el origen
    gloss: Priya corresponde a ese sentimiento y pregunta de dónde es Arjun.
    note: Tum kahan se ho pregunta por el origen usando el registro informal ya aprendido.
  hi.a1.unit01.lesson03.teach.dialogue.line06:
    title: Preguntar por el origen, respuesta
    gloss: Arjun es de India pero ahora vive en Londres, y luego devuelve la misma pregunta.
    note: '*Rahta hoon* («vivo») es masculino y concuerda con Arjun como hablante: es el mismo patrón de concordancia con el sujeto que *chahta hoon* en la línea 2. *Lekin* («pero») enlaza el contraste entre el origen y la residencia actual.'
  hi.a1.unit01.lesson03.teach.dialogue.line07:
    title: Hablar del origen y de un interés
    gloss: Priya dice que es de Estados Unidos y que ella también quiere aprender yoga.
    note: '*Chahti hoon* es la forma femenina del mismo verbo que usó Arjun en la línea 2 (*chahta hoon*): observa que ambos concuerdan con el género de quien habla, lo que da un par mínimo directo para comparar.'
  hi.a1.unit01.lesson03.teach.dialogue.line08:
    title: Preguntar por la actividad compartida
    gloss: Arjun reacciona con entusiasmo y pregunta si Priya hace yoga.
    note: '*Karti ho* («haces») es femenino y concuerda con Priya como persona a quien se pregunta: como *kaisi* antes, esta forma verbal sigue el género de la persona A QUIEN SE HABLA, no el de quien habla.'
  hi.a1.unit01.lesson03.teach.dialogue.line09:
    title: 'Preguntar por la actividad compartida: la respuesta'
    gloss: Priya dice que no, que es su primera vez y que todavía está aprendiendo.
    note: '*Seekh rahi hoon* («estoy aprendiendo») usa la forma continua femenina, que concuerda con Priya como hablante: es el equivalente en presente continuo de *chahti hoon*.'
  hi.a1.unit01.lesson03.teach.dialogue.line10:
    title: Cerrar la conversación
    gloss: Arjun acepta empezar y luego dice hasta luego.
    note: '*Chalo shuru karte hain* («empecemos») es una forma fija y natural de proponer comenzar algo juntos. *Phir milte hain* cierra la conversación con la despedida informal de la lección 2.'
