answer_policy:
  mujhe_verb_hai: This unit's central grammar point is the दात-subject obligation construction "X + verb-infinitive + है" (मुझे/तुम्हें/हमें/आपको + infinitive + है = "X needs/has to ___"). A typed answer that drops है entirely, or that appends हैं instead of है (है is invariant here -- it agrees with the infinitive verb, not the दात subject), should be marked incorrect -- this is the exact point being tested.
  kitne_ka_gender: '"टिकट कितने का है?" (how much is the ticket) is taught with का, treating टिकट as masculine -- the same कितने का/की gender-agreement rule unit07 already established. Many native speakers also use टिकट as feminine (टिकट कितने की है?), so की with टिकट is ACCEPTED as a valid alternative wherever typed; plural के with one ticket is the error the grammar_check targets.'
  train_gender: ट्रेन is grammatically feminine, so every habitual-present verb form describing it in this unit uses जाती है, never जाता है. A typed answer using जाता है for the train should be marked incorrect as a real agreement error.
  nasalization_marks: Display and teach the correct chandrabindu/anusvara distinction. This unit's one new nasalized word, हमें, uses anusvara, verified against a direct codepoint check -- consistent with the already-established तुम्हें convention. In typed A1 answers, accept a variant that drops a nasalization mark entirely or substitutes anusvara for chandrabindu (or vice versa) when every other character is correct. Do not extend this tolerance to a wrong vowel or consonant, which changes the actual word.
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation or nasalization marks. For any exercise asking the learner to state their own travel request, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit15.travel:
    title: De viaje
lessons:
  hi.a1.unit15.lesson01.station_jana:
    title: Necesito ir a la estación
  hi.a1.unit15.lesson02.platform_samay:
    title: Número de andén y hora
  hi.a1.unit15.lesson03.priya_arjun_station:
    title: 'Priya y Arjun: en la estación'
teaching:
  hi.a1.unit15.lesson01.teach.station_mujhe_hai_review:
    title: 'Repaso: estación, a mí, es'
    gloss: estación, me / para mí, es
    note: Un repaso rápido del sustantivo de lugar y del verbo «ser/estar/haber» necesarios para construir la expresión de obligación de esta lección.
    example_gloss:
    - La estación está aquí.
    - Tengo trabajo.
  hi.a1.unit15.lesson01.teach.jaana:
    title: Ir
    gloss: ir (infinitivo)
    note: Es la forma de infinitivo del verbo que ya conoces como imperativo de तुम, *jao* (unidad 9). En esta lección se presenta el infinitivo base.
    example_gloss: Necesito ir.
  hi.a1.unit15.lesson01.teach.grammar_mujhe_verb_hai:
    title: Mujhe + verbo + hai = tener que
    gloss: '''Mujhe'' ya se aprendió con ''chahiye'' (unidad 6, con un sustantivo) y con ''hai'' (unidad 11, como ''mujhe kaam hai'', tengo trabajo). Ahora también aparece con un verbo: ''mujhe jana hai'' significa ''necesito ir''. Ojo: con ''jana'', ''hai'' no cambia, nunca se convierte en ''hain'': no concuerda con quien habla.'
    note: Presenta el tercer uso de un patrón ya conocido de pronombre + verbo copulativo, y recuerda los dos usos anteriores por su unidad antes de introducir el nuevo verbo.
  hi.a1.unit15.lesson01.teach.mujhe_station_jana_hai_phrase:
    title: Necesito ir a la estación.
    gloss: Necesito ir a la estación.
    note: El primer ejemplo completo de la construcción de obligación en esta unidad.
  hi.a1.unit15.lesson01.teach.tiket:
    title: Billete
    gloss: billete
    note: Un sustantivo nuevo, necesario a lo largo de esta unidad sobre viajes.
    example_gloss: ¿Dónde está mi billete?
  hi.a1.unit15.lesson01.teach.chahiye_review:
    title: 'Repaso: querer / necesitar'
    gloss: querer / necesitar
    note: Se vio por primera vez en la unidad 6 con bebidas; aquí se reutiliza con un billete.
    example_gloss: Quisiera té.
  hi.a1.unit15.lesson01.teach.mujhe_tiket_chahiye_phrase:
    title: Necesito un billete.
    gloss: Necesito un billete.
    note: El patrón ya conocido *mujhe...chahiye* aplicado al sustantivo nuevo de esta unidad.
  hi.a1.unit15.lesson01.teach.train:
    title: Tren
    gloss: tren
    note: Un sustantivo nuevo.
    example_gloss: El tren es grande.
  hi.a1.unit15.lesson01.teach.delhi_ka_review:
    title: 'Repaso: Delhi, de'
    gloss: Delhi, de (marca de posesión)
    note: Delhi se vio en la unidad 5; la marca de posesión *ka* ya se ha usado a lo largo del curso (por ejemplo, unidades 5-14). Aquí se reutiliza para indicar el destino de un billete.
    example_gloss:
    - Mi hermano vive en Delhi.
    - Esta es la bolsa de Arjun.
  hi.a1.unit15.lesson01.teach.mujhe_delhi_ka_tiket_chahiye_phrase:
    title: Necesito un billete para Delhi.
    gloss: Necesito un billete para Delhi.
    note: Combina el sustantivo de esta lección con el patrón de la marca de posesión para nombrar un destino concreto.
  hi.a1.unit15.lesson01.teach.kahan_tumhein_review:
    title: 'Repaso: dónde, a ti'
    gloss: dónde, te / para ti
    note: Ambas ya se vieron (unidad 8 y unidad 6); aquí se reutilizan para preguntar adónde tiene que ir alguien.
    example_gloss:
    - ¿Dónde está el banco?
    - ¿Qué quieres?
  hi.a1.unit15.lesson02.teach.number_review:
    title: 'Repaso: número'
    gloss: número
    note: Se vio por primera vez en la unidad 2 para los números de teléfono; aquí se reutiliza para el número de un andén.
    example_gloss: ¿Cuál es tu número de teléfono?
  hi.a1.unit15.lesson02.teach.platform:
    title: Andén
    gloss: andén
    note: Un sustantivo nuevo, la palabra habitual en hindi para el andén de una estación. Es un préstamo del inglés, como *phone* en la unidad 2, y se adapta a la pronunciación hindi.
    example_gloss: El andén es grande.
  hi.a1.unit15.lesson02.teach.platform_number_kya_hai_phrase:
    title: ¿Cuál es el número de andén?
    gloss: ¿Cuál es el número de andén?
    note: Reutiliza el patrón de pregunta *kya hai* ya conocido (teléfono, precio, edad) para un tema nuevo.
  hi.a1.unit15.lesson02.teach.platform_number_teen_hai_phrase:
    title: El andén es el número 3.
    gloss: El número de andén es el 3.
    note: La respuesta natural en frase completa a la pregunta anterior.
  hi.a1.unit15.lesson02.teach.jaana_habitual_grammar:
    title: Jaati hai (concordancia femenina)
    gloss: '''Jaati hai'' usa la regla de la unidad 10 de -ta/-ti/-te + hai/hain, con el verbo nuevo ''jana''. ''Tren'' es gramaticalmente femenino en hindi, así que se dice ''jaati hai'', no ''jaata hai''.'
    note: Una ampliación directa y explícita del patrón de concordancia del presente habitual ya conocido, aplicada a un verbo nuevo y a un sustantivo nuevo de género femenino.
  hi.a1.unit15.lesson02.teach.se_review:
    title: 'Repaso: desde'
    gloss: desde
    note: Se vio por primera vez en la unidad 9 para las indicaciones; aquí se reutiliza para el andén del que sale el tren.
    example_gloss: Sigue recto desde aquí.
  hi.a1.unit15.lesson02.teach.train_platform_se_jaati_hai_phrase:
    title: El tren sale del andén número 3.
    gloss: El tren sale del andén número 3.
    note: Combina la forma verbal del presente habitual de esta lección con la posposición «desde» ya conocida.
  hi.a1.unit15.lesson02.teach.kitne_baje_review:
    title: 'Repaso: a qué hora'
    gloss: a qué hora
    note: Se vio por primera vez en la unidad 4 para decir la hora; aquí se reutiliza para preguntar la hora de salida.
    example_gloss: ¿Qué hora es?
  hi.a1.unit15.lesson02.teach.train_kitne_baje_jaati_hai_phrase:
    title: ¿A qué hora sale el tren?
    gloss: ¿A qué hora sale el tren?
    note: La pregunta «a qué hora» aplicada a una salida programada, no a la hora actual.
  hi.a1.unit15.lesson02.teach.train_chhah_baje_jaati_hai_phrase:
    title: El tren sale a las 6.
    gloss: El tren sale a las 6.
    note: La respuesta natural en frase completa, con la forma plural *baje* de la unidad 4 (las seis no son la excepción *baja*, que solo se aplica a la una).
  hi.a1.unit15.lesson02.teach.tiket_kitne_ka_hai_phrase:
    title: ¿Cuánto cuesta el billete?
    gloss: ¿Cuánto cuesta el billete?
    note: Reutiliza la pregunta de precio *kitne ka/ki* de la unidad 7. *Tikat* suele tratarse como masculino (*ka*); muchos hablantes lo tratan también como femenino (*kitne ki*), lo cual también es correcto.
  hi.a1.unit15.lesson02.teach.rupaye_review:
    title: 'Repaso: rupias, cincuenta'
    gloss: rupias, cincuenta
    note: Ambas se vieron por primera vez en la unidad 2 para precios y cantidades; aquí se reutilizan para el precio de un billete.
    example_gloss: Tengo cincuenta rupias.
  hi.a1.unit15.lesson02.teach.tiket_pachaas_rupaye_ka_hai_phrase:
    title: El billete cuesta 50 rupias.
    gloss: El billete cuesta 50 rupias.
    note: La respuesta natural en frase completa a la pregunta de precio anterior.
  hi.a1.unit15.lesson03.teach.hum_hamein:
    title: Nosotros, a nosotros
    gloss: nosotros, nos / para nosotros
    note: '''Hum'' (nosotros) se presentó en la unidad 11 como el primer pronombre de primera persona del plural del curso; ''hamein'' es su forma de dativo, necesaria aquí para el diálogo de un viaje conjunto.'
    example_gloss:
    - Estamos bien.
    - Necesitamos ir a la estación.
  hi.a1.unit15.lesson03.teach.hamein_grammar:
    title: 'Hamein: el cuarto pronombre de dativo'
    gloss: '''Hamein'' es la forma de dativo de ''hum'' (unidad 11), igual que ''mujhe'' (main) y ''tumhein'' (tum). Aquí también, con ''jana'', ''hai'' no cambia, nunca se convierte en ''hain'': no concuerda con ''hum''/''hamein''.'
    note: 'Nombra los tres pronombres de dativo anteriores por su unidad antes de añadir el cuarto, y repite el aviso de la primera lección: ''hai'' no concuerda con el sujeto sino que permanece invariable.'
  hi.a1.unit15.lesson03.teach.hamein_station_jana_hai_phrase:
    title: Necesitamos ir a la estación.
    gloss: Necesitamos ir a la estación.
    note: La construcción de obligación con el nuevo pronombre de dativo plural.
  hi.a1.unit15.lesson03.teach.ki_review:
    title: 'Repaso: de (femenino)'
    gloss: de (marca de posesión, femenino)
    note: Se vio por primera vez en la unidad 7 junto con *ka*/*kitne*; aquí se reutiliza porque «tren» es gramaticalmente femenino en hindi, así que su forma posesiva es 'ki', no 'ka'.
    example_gloss: Este es el tren de Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line01:
    title: Arjun dice que tienen que ir
    gloss: Priya, tenemos que ir a la estación.
  hi.a1.unit15.lesson03.teach.dialogue.line02:
    title: Priya necesita un billete para Delhi
    gloss: Vale. Necesito un billete para Delhi.
  hi.a1.unit15.lesson03.teach.dialogue.line03:
    title: Arjun pregunta el precio
    gloss: Yo también. ¿Cuánto cuesta el billete?
  hi.a1.unit15.lesson03.teach.dialogue.line04:
    title: Priya dice el precio
    gloss: El billete cuesta 50 rupias.
  hi.a1.unit15.lesson03.teach.dialogue.line05:
    title: Arjun pregunta la hora de salida
    gloss: Bien. ¿A qué hora sale el tren?
  hi.a1.unit15.lesson03.teach.dialogue.line06:
    title: Priya dice la hora y el andén
    gloss: El tren sale a las 6, del andén número 3.
  hi.a1.unit15.lesson03.teach.dialogue.line07:
    title: Arjun lo entiende y dice que vayan
    gloss: Entendido. ¡Vamos!
  hi.a1.unit15.lesson03.teach.dialogue.line08:
    title: Priya está de acuerdo
    gloss: ¡Vamos!
  hi.a1.unit15.lesson03.teach.grammar_summary:
    title: Tres reglas principales
    gloss: 'Las tres reglas principales de esta unidad: (1) ''mujhe/tumhein/hamein + verbo + hai'' significa ''tener que ___''; (2) ''X kitne ka/ki hai?'' sirve para preguntar el precio; (3) ''X [hora] baje [lugar] se jaati hai'' indica la hora y el lugar de un viaje.'
    note: Un resumen final que reúne toda la gramática de la unidad, a modo de la nota de gramática de la unidad 14, que también unía los paradigmas.
  hi.a1.unit15.lesson03.teach.tiket_reading:
    title: Leer un billete
    gloss: 'Billete: Delhi. Andén número 3. Las 6.'
    note: Texto breve y fragmentario, como en un billete real (sin oraciones completas), que repite exactamente los datos ya establecidos en el diálogo, sin añadir nada nuevo.
    glosses:
      टिकट: billete
      प्लेटफ़ॉर्म: andén
      नंबर: número
      बजे: horas
