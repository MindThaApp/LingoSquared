teaching:
  hi.a1.unit17.lesson01.teach.tum_tumhara_kya_review:
    title: 'Repaso: tú, tu, qué'
    gloss: tú (informal), tu (informal), qué
    note: Un repaso rápido de las palabras necesarias para preguntar a un amigo por su trabajo.
    example_gloss: ¿Cómo te llamas?
  hi.a1.unit17.lesson01.teach.arjun_priya_review:
    title: 'Repaso: Arjun, Priya'
    gloss: Arjun, Priya
    note: Un recordatorio de los nombres de los dos personajes antes de que esta lección los use para practicar preguntas según el género.
    example_gloss:
    - Me llamo Arjun.
    - Me llamo Priya.
  hi.a1.unit17.lesson01.teach.copula_review:
    title: 'Repaso: yo, soy, es, eres'
    gloss: yo, soy, es, eres (tú, informal)
    note: El pequeño conjunto completo de formas del verbo «ser» necesario para las oraciones de identidad de esta unidad.
    example_gloss:
    - ¿Estás bien?
    - Estoy bien.
  hi.a1.unit17.lesson01.teach.kaam_review:
    title: 'Repaso: trabajo'
    gloss: trabajo
    note: Se enseñó por primera vez en las unidades 10 y 11; aquí se reutiliza como palabra temática de toda la unidad.
    example_gloss: Tengo trabajo.
  hi.a1.unit17.lesson01.teach.karte_karti_karta_verb:
    title: Hacer (tú, masculino / tú, femenino / yo, masculino)
    gloss: haces (tú, masculino, informal), haces (tú, femenino, informal), hago (yo, masculino)
    note: Amplía al verbo *karna* (hacer) la regla de concordancia -ta/-ti/-te ya vista en la unidad 10 (y también en *kya tum yog karti ho?* de la unidad 1).
    example_gloss:
    - ¿Qué haces?
    - Desayuno.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karte_ho_phrase:
    title: ¿A qué te dedicas? (a un hombre)
    gloss: ¿A qué te dedicas?
    note: La pregunta con la que empieza esta lección, dirigida a un amigo.
  hi.a1.unit17.lesson01.teach.tum_kya_kaam_karti_ho_phrase:
    title: ¿A qué te dedicas? (a una mujer)
    gloss: ¿A qué te dedicas?
    note: 'La misma pregunta, dirigida a una amiga: solo cambia la terminación del verbo.'
  hi.a1.unit17.lesson01.teach.shikshak_shikshika:
    title: Profesor (hombre / mujer)
    gloss: profesor, profesora
    note: Un nuevo par de sustantivos de profesión. A diferencia de la mayoría de los sustantivos vistos hasta ahora, este cambia según el género de QUIEN HABLA; consulta la nota gramatical de esta lección.
    example_gloss:
    - Soy profesor.
    - Soy profesora.
  hi.a1.unit17.lesson01.teach.grammar_occupation_gender:
    title: Mein + profesión + hoon
    gloss: '''Mein + profesión + hoon'' sirve para decir a qué te dedicas: es la misma estructura ''mein...hoon'' de la unidad 1. Algunas profesiones cambian según el género de quien habla: ''shikshak'' (hombre), ''shikshika'' (mujer), igual que cambiaba la terminación verbal -ta/-ti en la unidad 10. ''Doctor'' y ''engineer'' no cambian: es la misma palabra para ambos géneros.'
    note: Presenta de forma explícita la división en dos grupos (sustantivos que concuerdan con el género y préstamos invariables) antes de que cualquier ejercicio dependa de ella.
  hi.a1.unit17.lesson01.teach.doctor_review:
    title: 'Repaso: médico'
    gloss: médico
    note: Se enseñó por primera vez en la unidad 16; aquí se reutiliza como profesión invariable en cuanto al género.
    example_gloss: Él/ella es médico.
  hi.a1.unit17.lesson01.teach.mein_doctor_hoon_phrase:
    title: Soy médico.
    gloss: Soy médico/a.
    note: El patrón de identidad aplicado a una palabra de repaso.
  hi.a1.unit17.lesson01.teach.engineer:
    title: Ingeniero
    gloss: ingeniero
    note: Un sustantivo de profesión nuevo, invariable en cuanto al género, como *doctor*.
    example_gloss: Él/ella es ingeniero/a.
  hi.a1.unit17.lesson01.teach.mein_engineer_hoon_phrase:
    title: Soy ingeniero/a.
    gloss: Soy ingeniero/a.
    note: El patrón de identidad aplicado a la segunda profesión nueva de esta lección.
  hi.a1.unit17.lesson02.teach.kahan_review:
    title: 'Repaso: dónde'
    gloss: dónde
    note: Se vio por primera vez en la unidad 1; aquí se reutiliza para preguntar por un lugar de trabajo.
    example_gloss: ¿Dónde está el hospital?
  hi.a1.unit17.lesson02.teach.mein_review:
    title: 'Repaso: en / a'
    gloss: en
    note: Se vio por primera vez en la unidad 1; aquí se reutiliza para nombrar un lugar de trabajo.
    example_gloss: Vivo en Londres.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karte_ho_phrase:
    title: ¿Dónde trabajas? (a un hombre)
    gloss: ¿Dónde trabajas?
    note: La pregunta con la que se abre esta lección, dirigida a un amigo.
  hi.a1.unit17.lesson02.teach.tum_kahan_kaam_karti_ho_phrase:
    title: ¿Dónde trabajas? (a una mujer)
    gloss: ¿Dónde trabajas?
    note: La misma pregunta, dirigida a una amiga.
  hi.a1.unit17.lesson02.teach.school_review:
    title: 'Repaso: escuela'
    gloss: escuela
    note: Se vio por primera vez en la unidad 8; es el primer lugar de trabajo de esta lección.
    example_gloss: Trabajo en la escuela (hablante mujer).
  hi.a1.unit17.lesson02.teach.mein_school_mein_kaam_karti_hoon_phrase:
    title: Trabajo en la escuela.
    gloss: Trabajo en la escuela.
    note: El patrón del lugar de trabajo aplicado a la escuela, en forma femenina.
  hi.a1.unit17.lesson02.teach.hospital_review:
    title: 'Repaso: hospital'
    gloss: hospital
    note: Se vio por primera vez en la unidad 8; es el segundo lugar de trabajo de esta lección y va con la profesión de médico.
    example_gloss: El médico trabaja en el hospital.
  hi.a1.unit17.lesson02.teach.daftar:
    title: Oficina
    gloss: oficina
    note: Un sustantivo nuevo, el tercer lugar de trabajo de esta lección, que va con la profesión de ingeniero.
    example_gloss: Trabajo en la oficina (hablante hombre).
  hi.a1.unit17.lesson02.teach.mein_daftar_mein_kaam_karta_hoon_phrase:
    title: Trabajo en la oficina.
    gloss: Trabajo en la oficina.
    note: El patrón del lugar de trabajo aplicado a la oficina, en forma masculina.
  hi.a1.unit17.lesson02.teach.grammar_workplace:
    title: Lugar + mein + kaam karta/karti hoon
    gloss: '''[Lugar] + mein + kaam karta/karti hoon'' combina tres piezas ya conocidas: ''mein'' (unidad 1, ''London mein rehta hoon''), ''kaam'' (unidad 10/11) y la forma -ta/-ti/-te de ''karna'' (el ''nashta karta hoon'' de la unidad 10 y el ''kya tum yog karti ho?'' de la unidad 1). No es gramática nueva: son las tres piezas unidas por primera vez en una sola oración.'
    note: Nombra cada pieza ya enseñada con su número de unidad antes de combinarlas, como en todas las notas gramaticales anteriores.
  hi.a1.unit17.lesson03.teach.roz_review:
    title: 'Repaso: todos los días'
    gloss: cada día
    note: Se vio por primera vez en la unidad 10; aquí se reutiliza para describir una rutina diaria de trabajo.
    example_gloss: Trabajo todos los días.
  hi.a1.unit17.lesson03.teach.jaana_forms_review:
    title: 'Repaso: ir (tú, mujer / tú, hombre / yo, hombre)'
    gloss: vas (tú, mujer), vas (tú, hombre), voy (yo, hombre)
    note: Las formas en -ta/-ti/-te de *jana* (ir), ya enseñadas en la unidad 10, se reutilizan aquí para el trayecto diario al trabajo.
    example_gloss:
    - Voy a la escuela todos los días (hablante mujer).
    - ¿Vas a la oficina todos los días? (a un hombre)
  hi.a1.unit17.lesson03.teach.bhi_haan_review:
    title: 'Repaso: también, sí'
    gloss: también, sí
    note: Ambas ya enseñadas (unidad 1 y unidad 1/6/13); se reutilizan en el diálogo de esta lección.
    example_gloss: Sí, a mí también me gustó.
  hi.a1.unit17.lesson03.teach.dialogue.line01:
    title: Arjun le pregunta a Priya por su trabajo
    gloss: Priya, ¿a qué te dedicas?
  hi.a1.unit17.lesson03.teach.dialogue.line02:
    title: Priya dice que es profesora en una escuela
    gloss: Soy profesora. Trabajo en una escuela.
  hi.a1.unit17.lesson03.teach.dialogue.line03:
    title: Arjun le pregunta si va a la escuela todos los días
    gloss: ¡Qué bien! ¿Vas a la escuela todos los días?
  hi.a1.unit17.lesson03.teach.dialogue.line04:
    title: Priya lo confirma y le hace la misma pregunta a Arjun
    gloss: Sí, voy a la escuela todos los días. ¿Y tú, a qué te dedicas?
  hi.a1.unit17.lesson03.teach.dialogue.line05:
    title: Arjun dice que es ingeniero y trabaja en una oficina
    gloss: Soy ingeniero. Trabajo en una oficina.
  hi.a1.unit17.lesson03.teach.dialogue.line06:
    title: Priya le pregunta si él también va a la oficina todos los días
    gloss: ¡Muy bien! ¿Tú también vas a la oficina todos los días?
  hi.a1.unit17.lesson03.teach.dialogue.line07:
    title: Arjun lo confirma
    gloss: Sí, voy a la oficina todos los días.
  hi.a1.unit17.lesson03.teach.dialogue.line08:
    title: Priya le da las gracias
    gloss: Está bien, gracias.
  hi.a1.unit17.lesson03.teach.grammar_summary:
    title: Tres reglas principales
    gloss: 'Las tres reglas principales de esta unidad: (1) ''mein + profesión + hoon'' indica una profesión (por ejemplo, ''mein shikshika hoon''), y algunas profesiones cambian según el género de quien habla; (2) ''[lugar] + mein + kaam karta/karti hoon'' indica el lugar de trabajo (por ejemplo, ''mein daftar mein kaam karta hoon''); (3) ''roz [lugar] jata/jati hoon'' indica un hábito diario, con la misma regla -ta/-ti de la unidad 10.'
    note: Un resumen final que une toda la gramática de la unidad, igual que la nota gramatical de las unidades 15 y 16 que enlaza sus paradigmas.
  hi.a1.unit17.lesson03.teach.work_profile_reading:
    title: Lectura de un perfil breve
    gloss: Priya es profesora. Trabaja en una escuela. Arjun es ingeniero. Trabaja en una oficina.
    note: Un perfil breve y directo que repite exactamente los datos ya presentados en el diálogo, sin afirmaciones nuevas; responde justo al objetivo de leer un perfil laboral breve.
    glosses:
      शिक्षिका: profesora
      स्कूल: escuela
      काम: trabajo
      करती: hace / trabaja (femenino, de करना)
      इंजीनियर: ingeniero/a
      दफ़्तर: oficina
      करता: hace / trabaja (masculino, de करना)
