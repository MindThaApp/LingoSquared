teaching:
  hi.a1.unit08.lesson01.teach.ghar_school:
    title: Casa, escuela
    gloss: casa / hogar, escuela
    note: Dos lugares comunes que se usan a lo largo de esta unidad.
    example_gloss:
    - Esto es una casa.
    - Esto es una escuela.
  hi.a1.unit08.lesson01.teach.aspatal_bank:
    title: Hospital, banco
    gloss: hospital, banco
    note: Dos lugares más comunes que quizá necesites encontrar en un barrio.
    example_gloss:
    - Esto es un hospital.
    - Esto es un banco.
  hi.a1.unit08.lesson01.teach.park_station:
    title: Parque, estación
    gloss: parque, estación
    note: Los dos últimos lugares comunes de esta unidad.
    example_gloss:
    - Esto es un parque.
    - Esto es una estación.
  hi.a1.unit08.lesson01.teach.yahan_wahan:
    title: Aquí, allí
    gloss: aquí, allí
    note: Un par básico para señalar dónde está algo.
    example_gloss:
    - La escuela está aquí.
    - El banco está allí.
  hi.a1.unit08.lesson01.teach.school_kahan_hai:
    title: ¿Dónde está la escuela?
    gloss: ¿Dónde está la escuela?
    note: Reutiliza *kahaan* (dónde), que viste en la unidad 1, ahora para preguntar por un lugar en vez del origen de una persona.
  hi.a1.unit08.lesson01.teach.school_yahan_hai:
    title: La escuela está aquí
    gloss: La escuela está aquí.
    note: Una respuesta de ejemplo con *yahaan*.
  hi.a1.unit08.lesson01.teach.bank_kahan_hai:
    title: ¿Dónde está el banco?
    gloss: ¿Dónde está el banco?
    note: El mismo patrón de pregunta, con otro lugar.
  hi.a1.unit08.lesson01.teach.bank_wahan_hai:
    title: El banco está allí
    gloss: El banco está allí.
    note: Una respuesta de ejemplo con *wahaan*.
  hi.a1.unit08.lesson02.teach.paas:
    title: Cerca
    gloss: cerca
    note: 'Se presenta formalmente aquí por primera vez: solo había aparecido en las frases de ejemplo de la unidad 2 (*mere paas*, ''tengo'', literalmente ''cerca de mí'') sin enseñarse nunca como palabra propia hasta ahora.'
    example_gloss: El banco está cerca.
  hi.a1.unit08.lesson02.teach.door:
    title: Lejos
    gloss: lejos
    note: Lo contrario de *paas*.
    example_gloss: La estación está lejos.
  hi.a1.unit08.lesson02.teach.ke_paas_note:
    title: Ke paas
    gloss: '''Ke paas'' significa cerca de un lugar, como en ''school bank ke paas hai'' (la escuela está cerca del banco). Es el mismo ''paas'' que apareció antes en ''mere paas'' (tengo), pero allí significaba ''en mi posesión'' y aquí significa ''cerca'': una misma palabra, dos usos distintos.'
    note: Una posposición nueva formada con una palabra ya vista, indicando expresamente su sentido anterior para que no se confundan los dos usos.
    target_text: '''के पास'' का मतलब है किसी जगह के नज़दीक -- जैसे ''बैंक स्कूल के पास है''। यह वही ''पास'' है जो पहले ''मेरे पास'' (मेरे पास एक किताब है) में आया था, पर वहाँ इसका मतलब था ''मेरे स्वामित्व में'' (tener), और यहाँ इसका मतलब है ''नज़दीक'' (cerca de) -- एक ही शब्द, दो अलग इस्तेमाल।'
  hi.a1.unit08.lesson02.teach.school_bank_ke_paas_hai:
    title: La escuela está cerca del banco
    gloss: La escuela está cerca del banco.
    note: Una frase de ejemplo con *ke paas*.
  hi.a1.unit08.lesson02.teach.samne_peeche:
    title: Delante de, detrás de
    gloss: delante de, detrás de
    note: Un segundo par de palabras de ubicación, que también se usan con *ke*.
    example_gloss:
    - El hospital está delante de la estación.
    - El parque está detrás de la escuela.
  hi.a1.unit08.lesson02.teach.samne_peeche_note:
    title: Samne y peeche
    gloss: '''Samne'' y ''peeche'' también van con ''ke'', igual que ''paas'', y son opuestos entre sí: ''paark school ke peeche hai'' y ''school paark ke samne hai'' describen exactamente la misma relación real, solo que desde dos puntos de vista distintos.'
    note: 'El mismo hecho dicho de dos maneras: un punto de gramática real y útil sobre cómo se relacionan las dos palabras.'
  hi.a1.unit08.lesson02.teach.school_park_ke_samne_hai:
    title: La escuela está delante del parque
    gloss: La escuela está delante del parque.
    note: El otro lado del mismo hecho que *paark school ke peeche hai*, visto arriba.
  hi.a1.unit08.lesson03.teach.dakghar:
    title: Oficina de correos
    gloss: oficina de correos
    note: Un nuevo lugar común para el diálogo final de esta unidad.
    example_gloss: La oficina de correos está cerca del banco.
  hi.a1.unit08.lesson03.teach.dakghar_kahan_hai:
    title: ¿Dónde está la oficina de correos?
    gloss: ¿Dónde está la oficina de correos?
    note: Abre el diálogo final de esta unidad.
  hi.a1.unit08.lesson03.teach.dialogue.line01:
    title: Arjun pregunta por la oficina de correos
    gloss: Arjun le pregunta a Priya dónde está la oficina de correos.
    note: Reutiliza la frase con la que empieza esta lección.
  hi.a1.unit08.lesson03.teach.dialogue.line02:
    title: Priya responde
    gloss: Priya dice que está cerca del banco.
    note: Reutiliza *ke paas* de la lección 2.
  hi.a1.unit08.lesson03.teach.dialogue.line03:
    title: Arjun pregunta por el hospital
    gloss: Arjun dice que bien y pregunta dónde está el hospital.
    note: Reutiliza *achchha* (bien / ya veo) de unidades anteriores.
  hi.a1.unit08.lesson03.teach.dialogue.line04:
    title: Priya responde
    gloss: Priya dice que el hospital está delante de la estación.
    note: Reutiliza *ke samne* de la lección 2.
  hi.a1.unit08.lesson03.teach.dialogue.line05:
    title: Arjun pregunta si está lejos
    gloss: 'Arjun pregunta: ¿la estación está lejos?'
    note: Reutiliza *door* de la lección 2.
  hi.a1.unit08.lesson03.teach.dialogue.line06:
    title: Priya confirma y contrasta
    gloss: Priya dice que sí, que está un poco lejos; el banco está cerca.
    note: 'Presenta *thoda* (un poco) y mantiene la coherencia: la estación está lejos y el banco sigue cerca.'
  hi.a1.unit08.lesson03.teach.dialogue.line07:
    title: Arjun pregunta por el parque
    gloss: Arjun dice que vale y pregunta dónde está el parque.
  hi.a1.unit08.lesson03.teach.dialogue.line08:
    title: Priya responde
    gloss: Priya dice que el parque está detrás de la escuela.
    note: Reutiliza *ke peeche* de la lección 2.
  hi.a1.unit08.lesson03.teach.dialogue.line09:
    title: Arjun lo deduce
    gloss: 'Arjun dice: ¡entonces la escuela está delante del parque!'
    note: Introduce *to* (entonces/pues) y relaciona el dato con la nota gramatical de la lección 2 sobre *samne*/*peeche*.
  hi.a1.unit08.lesson03.teach.dialogue.line10:
    title: Priya confirma
    gloss: 'Priya dice: ¡sí, es correcto!'
    note: Introduce *sahi* (correcto/cierto).
  hi.a1.unit08.lesson03.teach.dialogue.line11:
    title: Arjun da las gracias a Priya
    gloss: 'Arjun dice: ¡muchas gracias, Priya!'
    note: Reutiliza *bahut* (muy/mucho) y *shukriya* de unidades anteriores.
  hi.a1.unit08.lesson03.teach.dialogue.line12:
    title: Priya se despide
    gloss: 'Priya dice: ¡No hay problema! Nos vemos.'
    note: Reutiliza las frases de cierre habituales de este curso, vistas en unidades anteriores.
