teaching:
  hi.a1.unit29.lesson01.teach.kul_kitna_hua:
    title: Preguntar el precio total
    gloss: ¿Cuánto cuesta en total?
    note: '*कुल* significa «total», y *कितना हुआ?* («¿a cuánto sale?») es la forma habitual de preguntar el total.'
  hi.a1.unit29.lesson01.teach.kul_pachchees_rupye:
    title: Decir el precio total
    gloss: En total son doscientas cincuenta rupias.
    note: '*हुए* concuerda con el plural *रुपये*: *कुल दो सौ पचास रुपये हुए* es literalmente «en total, doscientas cincuenta rupias resultaron».'
  hi.a1.unit29.lesson02.teach.kard_se_pement:
    title: Pagar con tarjeta o en efectivo
    gloss: pagar con tarjeta, pagar en efectivo
    note: El hindi dice *कार्ड से पेमेंट करना* («hacer el pago con tarjeta») y *नकद पेमेंट करना*; *से* indica el medio de pago.
    example_gloss:
    - ¿Puedo pagar con tarjeta aquí?
    - Pago en efectivo.
  hi.a1.unit29.lesson02.teach.kya_main_yahan:
    title: Preguntar si se puede pagar con tarjeta
    gloss: ¿Puedo pagar con tarjeta aquí?
    note: '*यहाँ* («aquí») indica el lugar, y *सकता हूँ* («puedo») va después de la frase principal; una mujer dice *सकती हूँ*.'
  hi.a1.unit29.lesson02.teach.ap_nakad_pement:
    title: Preguntar la forma de pago preferida
    gloss: ¿Quiere pagar en efectivo o con tarjeta?
    note: '*आप ... करेंगे* es la pregunta de futuro cortés que usa un cajero, y *आप* lleva el verbo en plural *करेंगे*.'
  hi.a1.unit29.lesson03.teach.bil:
    title: La cuenta
    gloss: la cuenta
    note: '*बिल* es un sustantivo masculino: *एक बिल*, *बिल का*.'
    example_gloss: ¿Dividimos la cuenta?
  hi.a1.unit29.lesson03.teach.bil_bant_len:
    title: Proponer dividir la cuenta
    gloss: ¿Dividimos la cuenta?
    note: '*बाँट लें?* («¿lo dividimos?») sugiere un plan compartido sin decir *हम*; *लें* es la forma de «hagamos» de *लेना*.'
  hi.a1.unit29.lesson03.teach.kya_main_alag:
    title: Pedir pagar por separado
    gloss: ¿Puedo pagar por separado?
    note: '*अलग से* significa «por separado» y va antes de *पेमेंट कर सकता हूँ*.'
  hi.a1.unit29.lesson04.teach.bakee_paise:
    title: El cambio
    gloss: el cambio
    note: '*बाकी पैसे* («el dinero restante») es plural y se refiere al cambio que te devuelven.'
    example_gloss: Aquí tiene su cambio.
  hi.a1.unit29.lesson04.teach.ye_rahe_apke:
    title: Entregar el cambio
    gloss: Aquí tiene su cambio.
    note: '*आपके* es el «su» cortés (*आप* + *के*), que concuerda con el plural *पैसे*.'
  hi.a1.unit29.lesson04.teach.mujhe_bakee_paise:
    title: Rechazar el cambio
    gloss: No necesito el cambio.
    note: '*मुझे ... नहीं चाहिए* («a mí ... no hace falta») es como el hindi dice «no necesito»; *नहीं* va antes de *चाहिए*.'
  hi.a1.unit29.lesson05.teach.paintees:
    title: Trescientos cincuenta
    gloss: trescientos cincuenta
    note: '*तीन सौ पचास* es 350: se dicen primero las centenas y después las decenas.'
    example_gloss: Cuesta trescientas cincuenta rupias.
  hi.a1.unit29.lesson05.teach.bil_do_thalee:
    title: Lee la cuenta de un restaurante
    gloss: 'Cuenta: dos thalis y dos tés. Total: trescientas cincuenta rupias. Pago: con tarjeta.'
    note: Fíjate en lo que se pidió, en el total y en cómo se pagó.
    glosses:
      बिल: cuenta
      दो: dos
      थाली: thalis
      चाय: tés
      कुल: total
      तीन: tres
      सौ: cien
      पचास: cincuenta
      रुपये: rupias
      पेमेंट: pago
      कार्ड: tarjeta
  hi.a1.unit29.lesson06.teach.priya_bil_mang:
    title: Priya pide la cuenta
    gloss: 'Priya: ¿Pedimos la cuenta?'
    note: '*माँग लें?* («¿la pedimos?») vuelve a usar la forma de «hagamos» de *लेना*, y *माँगना* significa «pedir».'
  hi.a1.unit29.lesson06.teach.arjun_han_achchha:
    title: Arjun pregunta el total
    gloss: 'Arjun: Sí, buena idea. ¿Cuánto es en total?'
    note: '*कुल कितना हुआ?* es la pregunta del total de antes, ahora hecha en la mesa.'
  hi.a1.unit29.lesson06.teach.priya_paintees_rupye:
    title: Priya dice el total
    gloss: 'Priya: Son trescientas cincuenta rupias. ¿La dividimos?'
    note: '*तीन सौ पचास रुपये हुए* dice el total, y *बाँट लें?* pregunta «¿la dividimos?».'
  hi.a1.unit29.lesson06.teach.arjun_naheen_aj:
    title: Arjun insiste en pagar
    gloss: 'Arjun: No, hoy déjame pagar a mí. Me has ayudado mucho.'
    note: '*मुझे पेमेंट करने दो* significa «déjame pagar», y *तुमने मेरी बहुत मदद की है* usa *ने* porque el verbo está en pasado.'
  hi.a1.unit29.lesson06.teach.priya_tum_kitne:
    title: Priya se emociona
    gloss: 'Priya: ¡Qué amable eres! Muchas gracias.'
    note: '*तुम कितने अच्छे हो!* («qué bueno/amable eres») es un cumplido cálido, y *शुक्रिया* significa «gracias».'
  hi.a1.unit29.lesson06.teach.arjun_kya_main:
    title: Arjun pregunta si puede pagar con tarjeta
    gloss: 'Arjun: ¿Puedo pagar con tarjeta aquí?'
    note: La pregunta *क्या मैं यहाँ कार्ड से पेमेंट कर सकता हूँ?* se usa otra vez, ahora en un restaurante de verdad.
  hi.a1.unit29.lesson06.teach.arjun_bil_deta:
    title: 'देता है: él paga'
    gloss: Arjun paga la cuenta.
    note: '*देता है* es la forma de *वह* de *देना* («dar»); el hindi dice «da la cuenta» para «paga la cuenta».'
