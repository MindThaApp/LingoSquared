answer_policy:
  weather_existential: '"Aaj/kal + [weather word] + hai" states the current or a stated day''s weather -- *dhoop hai* ("it''s sunny"), *baarish hai* ("it''s raining"), *hawa hai* ("it''s windy") are each stated as a bare existential sentence, not a progressive verb form. A typed answer using the correct weather noun with *hai* is accepted; using *hain* where the sentence''s own subject is singular (or vice versa) is judged as a real grammar error, the exact contrast this unit''s own grammar_check exercises target -- not tolerated as a minor typo.'
  garm_invariant_thanda_agrees: '*Garm* ("hot") never changes for gender or number -- "mausam garm hai" always uses *garm*. *Thanda*/*thandi* ("cold") DOES change with the noun''s gender, the same "-a"/"-i" pattern already taught for *bada*/*badi* (unit 14) -- masculine *mausam* takes *thanda*, a feminine noun would take *thandi*. Every exercise in this unit pairs *thanda*/*thandi* with *mausam* only, so only *thanda* is ever actually required as a typed answer here; a typed answer using the wrong gender form where one IS tested is marked incorrect as a real grammar error, not tolerated as a typo.'
  kal_context_ambiguity: '*Kal* means both "yesterday" (as taught in units 4/12) and "tomorrow" (as used throughout this unit) -- genuinely ambiguous in real Hindi, disambiguated only by the sentence''s own tense/context. This unit''s own sentences are all future/plan-making in context, so *kal* consistently means "tomorrow" here; don''t mark a learner''s own free sentence wrong merely for using *kal* to mean "yesterday" in a DIFFERENT context than this unit''s own scenario, since both meanings are equally correct Hindi.'
  suggestion_pattern: '"Chalo" + a habitual-plural verb form (e.g. *jaate hain*, *chalte hain*) makes a "Let''s ___" suggestion, the same pattern already used for "chalo, kuch khaate hain!" (unit 6) and "chalo, kuch kharidte hain!" (unit 7). *Jaate hain* here is the same "-te hain" habitual form applied to *jaana* ("to go," unit 15''s infinitive), not a new verb.'
  punctuation: Hindi text is shown with the traditional danda (।) as the sentence-final mark. In typed answers, accept the danda, a plain period (.), or the mark omitted entirely as equivalent. Question marks (?) may likewise be omitted, but the fully punctuated form remains the model answer.
  spoken_answers: Judge spoken responses by intelligibility rather than written punctuation. For any exercise asking the learner to describe today's or tomorrow's weather, accept any of this unit's taught phrasings that fit the prompt, not only the single model sentence given in `accepted_answers`.
course:
  title: Hindi A1
units:
  hi.a1.unit19.weather:
    title: El tiempo
lessons:
  hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa:
    title: 'El tiempo: sol, lluvia y viento'
  hi.a1.unit19.lesson02.garam_thanda_baadal:
    title: Calor, frío y nubes
  hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam:
    title: 'Priya y Arjun: ¿qué tiempo hará mañana?'
teaching:
  hi.a1.unit19.lesson01.teach.aaj_review:
    title: 'Repaso: hoy'
    gloss: hoy
    note: 'Se vio por primera vez en la unidad 3: es la palabra de tiempo que se repite en toda esta unidad, junto con *kal* (mañana) en la lección 3.'
    example_gloss: Hoy es día tres.
  hi.a1.unit19.lesson01.teach.mausam:
    title: El tiempo
    gloss: tiempo (meteorológico)
    note: 'Sustantivo nuevo y palabra temática de toda esta unidad. Es masculino: consulta las notas de concordancia de género de esta unidad.'
    example_gloss: ¿Qué tiempo hace hoy?
  hi.a1.unit19.lesson01.teach.kaisa_review:
    title: 'Repaso: de qué tipo / cómo es'
    gloss: de qué tipo / cómo es
    note: Se vio por primera vez en la unidad 12; aquí se reutiliza para preguntar por el tiempo.
    example_gloss: ¿Cómo es tu casa?
  hi.a1.unit19.lesson01.teach.hai_hain_review:
    title: 'Repaso: es, son'
    gloss: es (singular), son (plural)
    note: La pareja de singular y plural del verbo de la que depende todo el patrón existencial del tiempo en esta unidad.
    example_gloss:
    - Hoy hace buen tiempo.
    - Hay tres habitaciones en la casa.
  hi.a1.unit19.lesson01.teach.dhoop:
    title: Sol / luz del sol
    gloss: sol / luz del sol
    note: 'Sustantivo nuevo. Se usa como existencial simple: *aaj dhoop hai* = «hoy hace sol» (literalmente, «hoy hay sol»).'
    example_gloss: Hoy hace sol.
  hi.a1.unit19.lesson01.teach.baarish:
    title: Lluvia
    gloss: lluvia
    note: 'Sustantivo nuevo. Se usa como existencial simple: *aaj baarish hai* = «hoy llueve».'
    example_gloss: Hoy está lloviendo.
  hi.a1.unit19.lesson01.teach.hawa:
    title: Viento
    gloss: viento
    note: 'Sustantivo nuevo. Se usa como existencial simple: *aaj hawa hai* = «hoy hace viento».'
    example_gloss: Hoy hace viento.
  hi.a1.unit19.lesson01.teach.grammar_mausam_existential:
    title: El patrón existencial del tiempo
    gloss: Para describir el tiempo, di 'aaj/kal + [palabra del tiempo] + hai', por ejemplo 'aaj dhoop hai', 'aaj baarish hai', 'aaj hawa hai'. Es el mismo patrón hai/hain que ya conoces de la casa (unidad 18), pero aquí sin número, directamente como sujeto.
    note: 'Primera nota gramatical de esta unidad: une el vocabulario nuevo con un patrón de oración que ya conoces.'
  hi.a1.unit19.lesson02.teach.mausam_review:
    title: 'Repaso: el tiempo (clima)'
    gloss: tiempo (meteorológico)
    note: Se retoma de la lección 1 de esta unidad.
    example_gloss: ¿Qué tiempo hace hoy?
  hi.a1.unit19.lesson02.teach.garam:
    title: Calor
    gloss: calor
    note: 'Adjetivo nuevo. No cambia según el género: consulta la nota gramatical de esta lección.'
    example_gloss: Hoy hace calor.
  hi.a1.unit19.lesson02.teach.thanda_thandi:
    title: Frío (masc. / fem.)
    gloss: frío (masculino), fría (femenino)
    note: 'Adjetivo nuevo. SÍ cambia según el género, a diferencia de *garm*: *mausam*, masculino, lleva *thanda*; los sustantivos femeninos (como *rasoi*, unidad 18) llevan *thandi*. Consulta la nota gramatical de esta lección.'
    example_gloss:
    - Hoy hace frío.
    - Hoy la cocina está fría.
  hi.a1.unit19.lesson02.teach.grammar_garam_thanda:
    title: Adjetivos invariables y adjetivos que concuerdan en género
    gloss: '''Garm'' es un adjetivo que termina en consonante y no cambia según el género: ''mausam garm hai'' siempre lleva ''garm''. En cambio, ''thanda''/''thandi'' es un adjetivo terminado en ''-a'' que SÍ cambia según el género, igual que ''bada''/''badi'' (unidad 14): ''mausam'', masculino, lleva ''thanda''; un sustantivo femenino lleva ''thandi''.'
    note: 'Contraste gramatical central de esta unidad: une un nuevo par de adjetivos con la regla que ya aprendiste en la unidad 14.'
  hi.a1.unit19.lesson02.teach.baadal:
    title: Nube(s)
    gloss: nube(s)
    note: 'Sustantivo nuevo, usado en esta unidad solo en su plural existencial natural: *aaj baadal hain* = «hoy hay nubes» / «hoy está nublado».'
    example_gloss: Hoy hay nubes.
  hi.a1.unit19.lesson02.teach.accha_review:
    title: 'Repaso: bueno'
    gloss: bueno
    note: Se vio por primera vez en la unidad 9; aquí se reutiliza para describir el tiempo.
    example_gloss: Hoy hace buen tiempo.
  hi.a1.unit19.lesson02.teach.bura:
    title: Malo
    gloss: malo
    note: Adjetivo nuevo, opuesto al ya conocido *accha* (bueno). En esta unidad solo se usa en masculino, como *mausam*.
    example_gloss: Hoy hace mal tiempo.
  hi.a1.unit19.lesson02.teach.bahut_review:
    title: 'Repaso: muy'
    gloss: muy
    note: Se vio por primera vez en la unidad 6; aquí se reutiliza para reforzar la descripción del tiempo.
    example_gloss: Hoy hace mucho frío.
  hi.a1.unit19.lesson03.teach.kal_review:
    title: 'Repaso: mañana (también: ayer)'
    gloss: mañana (según el contexto, también significa «ayer»)
    note: 'Se vio por primera vez en la unidad 4 y se reutilizó con el sentido de «ayer» en la unidad 12: en el hindi real es ambigua y solo el contexto la aclara. Las oraciones de esta unidad son todas de futuro y de planes, así que aquí ''kal'' significa «mañana».'
    example_gloss: Mañana lloverá.
  hi.a1.unit19.lesson03.teach.ghar_review:
    title: 'Repaso: casa / hogar'
    gloss: casa / hogar
    note: Se vio por primera vez en la unidad 8; aquí se reutiliza para el plan resultante (quedarse en casa).
    example_gloss: Esta es una casa.
  hi.a1.unit19.lesson03.teach.mein_review:
    title: 'Repaso: en'
    gloss: en
    note: Se vio por primera vez en la unidad 1; aquí se reutiliza en «ghar mein» (en casa).
    example_gloss: Hay tres habitaciones en la casa.
  hi.a1.unit19.lesson03.teach.hum_review:
    title: 'Repaso: nosotros'
    gloss: nosotros
    note: Se vio por primera vez en la unidad 11; aquí se reutiliza como sujeto del plan de esta lección.
    example_gloss: Vemos una película.
  hi.a1.unit19.lesson03.teach.rehte_hain_review:
    title: 'Repaso: [ellos/nosotros] se quedan / viven'
    gloss: '[ellos/nosotros] se quedan / viven'
    note: 'Se vio por primera vez en la unidad 5 (con un abuelo en singular, por la concordancia de respeto en masculino plural); en esta unidad se usa por primera vez con un sujeto realmente plural, ''hum'' (nosotros): es la misma forma verbal, aplicada de manera más sencilla.'
    example_gloss: Mi abuelo vive en Delhi.
  hi.a1.unit19.lesson03.teach.chalo_review:
    title: 'Repaso: vamos / ¡vamos!'
    gloss: vamos / ¡vamos!
    note: Se presentó en la unidad 1 y se reutilizó en las unidades 6, 7 y 11 con un verbo en plural habitual para decir «Vamos a ___». Aquí se usa del mismo modo.
    example_gloss: ¡Vamos a comer algo!
  hi.a1.unit19.lesson03.teach.jaana_review:
    title: 'Repaso: ir'
    gloss: ir
    note: Se presentó en la unidad 15 como infinitivo. En esta lección se amplía a la forma de plural habitual «jaate hain» (vamos), la misma derivación que ya se usó en la unidad 11 con «dekhte hain» y «peete hain».
    example_gloss: Necesito ir a la estación.
  hi.a1.unit19.lesson03.teach.aur_review:
    title: 'Repaso: y'
    gloss: y
    note: Se presentó en la unidad 1. Aquí se reutiliza para unir el tiempo y la temperatura de mañana.
    example_gloss: Mañana lloverá y hará frío.
  hi.a1.unit19.lesson03.teach.bahar:
    title: Afuera
    gloss: afuera
    note: 'Palabra nueva: vocabulario propio de esta lección para el plan resultante.'
    example_gloss: ¡Vamos afuera!
  hi.a1.unit19.lesson03.teach.jaate_hain_phrase:
    title: ¡Vamos afuera!
    gloss: ¡Vamos afuera!
    note: '«Chalo» + el plural habitual «jaate hain» (de «jaana», ir): el mismo patrón «Vamos a ___» que ya se vio en las unidades 1, 6, 7 y 11.'
  hi.a1.unit19.lesson03.teach.dialogue.line01:
    title: Arjun le pregunta a Priya por el tiempo de hoy
    gloss: Priya, ¿qué tiempo hace hoy?
  hi.a1.unit19.lesson03.teach.dialogue.line02:
    title: Priya describe el tiempo de hoy
    gloss: Hoy hace sol y hace calor.
  hi.a1.unit19.lesson03.teach.dialogue.line03:
    title: Arjun propone salir
    gloss: ¡Genial! Vamos afuera.
  hi.a1.unit19.lesson03.teach.dialogue.line04:
    title: Priya pregunta por el tiempo de mañana
    gloss: ¡De acuerdo! ¿Y qué tiempo hará mañana?
  hi.a1.unit19.lesson03.teach.dialogue.line05:
    title: Arjun describe el tiempo de mañana
    gloss: Mañana lloverá y hará frío.
  hi.a1.unit19.lesson03.teach.dialogue.line06:
    title: Priya propone quedarse en casa
    gloss: Entonces, ¿mañana nos quedamos en casa?
  hi.a1.unit19.lesson03.teach.dialogue.line07:
    title: Arjun está de acuerdo
    gloss: Sí, mañana nos quedamos en casa.
  hi.a1.unit19.lesson03.teach.dialogue.line08:
    title: Priya está de acuerdo
    gloss: ¡De acuerdo!
  hi.a1.unit19.lesson03.teach.grammar_summary:
    title: Tres reglas principales
    gloss: 'Las tres reglas principales de esta unidad: (1) «aaj/kal + [palabra del tiempo] + hai/hain» sirve para describir el tiempo; (2) «garm» no cambia según el género, pero «thanda»/«thandi» sí, igual que «bada»/«badi»; (3) «chalo» + un verbo en plural habitual (como «jaate hain») forma una propuesta: «chalo, bahar jaate hain!».'
    note: Resumen final que reúne la gramática de toda la unidad, como las notas gramaticales de las unidades 15 a 18 que enlazan los paradigmas.
  hi.a1.unit19.lesson03.teach.weather_reading:
    title: Lectura sobre hoy y mañana
    gloss: Hoy hace calor y hace sol. ¡Vamos afuera! Mañana lloverá y hará frío. Mañana nos quedamos en casa.
    note: 'Un texto breve y directo, sin marco narrativo nuevo, que repite exactamente los datos del diálogo sin añadir nada: sirve para practicar la lectura de un pronóstico del tiempo breve.'
    glosses:
      आज: hoy
      मौसम: tiempo (atmosférico)
      गर्म: caliente / caluroso
      धूप: sol
      चलो: vamos
      बाहर: fuera
      जाते: ir (de जाना)
      कल: mañana
      बारिश: lluvia
      ठंडा: frío
      रहते: quedarse / vivir (de रहना)
