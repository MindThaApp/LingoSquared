teaching:
  hi.a1.unit03.lesson01.teach.aaj:
    title: Hoy
    gloss: hoy
    note: La palabra que reutilizarás en casi todas las frases de esta lección.
    example_gloss: Hoy hace buen tiempo.
  hi.a1.unit03.lesson01.teach.somvar:
    title: Lunes
    gloss: Lunes
    note: Viene de सोम (la Luna), igual que en español «lunes» es el día de la Luna.
    example_gloss: La clase de yoga es el lunes.
  hi.a1.unit03.lesson01.teach.mangalvar:
    title: Martes
    gloss: martes
    note: Viene de मंगल (Marte), el mismo patrón que siguen casi todos los nombres de los días en hindi.
    example_gloss: Hoy es martes.
  hi.a1.unit03.lesson01.teach.budhvar:
    title: Miércoles
    gloss: miércoles
    note: Viene de बुध (Mercurio).
    example_gloss: Hoy es miércoles.
  hi.a1.unit03.lesson01.teach.guruvar:
    title: Jueves
    gloss: jueves
    note: Viene de गुरु (Júpiter).
    example_gloss: Hoy es jueves.
  hi.a1.unit03.lesson01.teach.shukravar:
    title: Viernes
    gloss: viernes
    note: Viene de शुक्र (Venus).
    example_gloss: El viernes no hay clase de yoga.
  hi.a1.unit03.lesson01.teach.shanivar:
    title: Sábado
    gloss: Sábado
    note: Viene de शनि (Saturno).
    example_gloss: Hoy es sábado.
  hi.a1.unit03.lesson01.teach.ravivar:
    title: Domingo
    gloss: Domingo
    note: Viene de रवि, un nombre sánscrito del Sol; es el día del Sol.
    example_gloss: Hoy es domingo.
  hi.a1.unit03.lesson01.teach.kaun_sa_din_hai:
    title: Preguntar qué día es
    gloss: ¿Qué día es hoy?
    note: '*Kaun sa* («cuál») concuerda con el sustantivo masculino *din* («día»); más adelante verás la forma femenina, *kaun si*, con sustantivos femeninos.'
  hi.a1.unit03.lesson01.teach.yoga_class_monday:
    title: Decir que algo ocurre un día
    gloss: La clase de yoga es el lunes.
    note: '*Ko* después del nombre de un día significa «el»: *somvar ko* es «el lunes», y el patrón es el mismo para todos los días de la semana.'
  hi.a1.unit03.lesson01.teach.no_class_friday:
    title: Decir que algo no ocurre un día
    gloss: El viernes no hay clase de yoga.
    note: Nahin niega la oración; ko sigue marcando el día, aquí al principio para dar énfasis.
  hi.a1.unit03.lesson02.teach.jan_feb_mar:
    title: Enero, febrero, marzo
    gloss: enero, febrero, marzo
    note: Los nombres de los meses en hindi son en su mayoría préstamos y se reconocen enseguida; no hay gramática nueva, solo vocabulario.
    example_gloss:
    - Mi cumpleaños es en enero.
    - El próximo día festivo es en febrero.
    - Mi cumpleaños es en marzo.
  hi.a1.unit03.lesson02.teach.apr_may_jun:
    title: Abril, mayo, junio
    gloss: abril, mayo, junio
    note: Se reconocen igual de fácil que los tres primeros meses.
    example_gloss:
    - El próximo día festivo es en abril.
    - Mi cumpleaños es en mayo.
    - El próximo día festivo es en junio.
  hi.a1.unit03.lesson02.teach.jul_aug_sep:
    title: Julio, agosto, septiembre
    gloss: julio, agosto, septiembre
    note: Sitambar se escribe aquí con anusvara (सितंबर); la grafía con media m (सितम्बर) también es común y igual de correcta.
    example_gloss:
    - Mi cumpleaños es en julio.
    - El próximo día festivo es en agosto.
    - Mi cumpleaños es en septiembre.
  hi.a1.unit03.lesson02.teach.oct_nov_dec:
    title: Octubre, noviembre, diciembre
    gloss: octubre, noviembre, diciembre
    note: Navambar y disambar usan la misma grafía con anusvara que sitambar; नवम्बर y दिसम्बर (con media m) también son comunes y igual de correctas.
    example_gloss:
    - El próximo día festivo es en octubre.
    - Mi cumpleaños es en noviembre.
    - El próximo día festivo es en diciembre.
  hi.a1.unit03.lesson02.teach.tareekh:
    title: Fecha
    gloss: fecha
    note: '*Tareekh* es un sustantivo femenino, así que su palabra interrogativa toma la forma femenina (*kitni tareekh*, nunca *kitna tareekh*), el mismo tipo de concordancia que viste en la unidad 2 con *keemat* y *umra*.'
    example_gloss: Hoy es día tres.
  hi.a1.unit03.lesson02.teach.mein_postposition:
    title: En (con un mes)
    gloss: 'en: se usa con el nombre de un mes'
    note: '*Mein* marca un mes igual que *ko* marca un día: *janvari mein* es «en enero», nunca *janvari ko*.'
  hi.a1.unit03.lesson02.teach.aaj_kitni_tareekh_hai:
    title: Preguntar la fecha
    gloss: ¿Qué fecha es hoy?
    note: Literalmente «cuántos es la fecha de hoy»; kitni concuerda con el femenino tareekh.
  hi.a1.unit03.lesson02.teach.aaj_teen_tareekh_hai:
    title: Decir la fecha solo con el número
    gloss: Hoy es día tres.
    note: El hindi expresa la fecha con un número cardinal simple (*teen*, «tres»), igual que el español en «tres de enero» (salvo el día uno); no hay una palabra especial para la fecha, solo los números que ya conoces.
  hi.a1.unit03.lesson02.teach.aaj_teen_january_hai:
    title: Decir la fecha con el mes
    gloss: Hoy es 3 de enero.
    note: El mismo patrón con número cardinal, ahora con el nombre del mes después.
  hi.a1.unit03.lesson03.teach.kab:
    title: Cuándo
    gloss: cuándo
    note: Una palabra interrogativa sencilla y muy frecuente.
    example_gloss: ¿Cuándo es la próxima clase?
  hi.a1.unit03.lesson03.teach.agli:
    title: Siguiente
    gloss: siguiente
    note: '*Agli* es la forma femenina: *class* (क्लास) se trata como sustantivo femenino en el hindi cotidiano, por eso lleva *agli* y no el masculino *agla*.'
    example_gloss: La próxima clase es el martes.
  hi.a1.unit03.lesson03.teach.das_reprise:
    title: Diez
    gloss: diez
    note: Ya apareció en la unidad 2; aquí hace falta para una fecha real.
    example_gloss: La próxima clase es el día diez.
  hi.a1.unit03.lesson03.teach.janmadin:
    title: Cumpleaños
    gloss: cumpleaños
    note: 'Sustantivo masculino: mera janmadin, nunca meri janmadin.'
    example_gloss: Mi cumpleaños es en diciembre.
  hi.a1.unit03.lesson03.teach.tumhara_janmadin_kab_hai:
    title: Preguntar el cumpleaños a alguien, de manera informal
    gloss: ¿Cuándo es tu cumpleaños? (informal)
    note: Tumhara concuerda con el masculino janmadin.
  hi.a1.unit03.lesson03.teach.mera_janmadin_january_mein_hai:
    title: Decir cuándo es tu cumpleaños
    gloss: Mi cumpleaños es en enero.
    note: La respuesta natural en frase completa a Tumhara janmadin kab hai?
  hi.a1.unit03.lesson03.teach.agli_class_kab_hai:
    title: Preguntar cuándo es la próxima clase
    gloss: ¿Cuándo es la próxima clase?
    note: Combina agli (femenino, concuerda con class) y kab.
  hi.a1.unit03.lesson03.teach.agli_class_mangalvar_das_march:
    title: Decir el día y la fecha completos
    gloss: La próxima clase es el martes 10 de marzo.
    note: 'El día de la semana y la fecha van juntos, como en español: primero el día, luego el número y el mes.'
  hi.a1.unit03.lesson03.teach.dialogue.line01:
    title: Arjun pregunta por la próxima clase
    gloss: Arjun pregunta cuándo es la próxima clase de yoga.
    note: Repite exactamente la pregunta de esta lección, con yog añadido para mayor claridad.
  hi.a1.unit03.lesson03.teach.dialogue.line02:
    title: Priya da el día y la fecha
    gloss: Priya dice que la próxima clase es el martes 10 de marzo.
    note: Repite exactamente la frase de día y fecha de esta lección.
  hi.a1.unit03.lesson03.teach.dialogue.line03:
    title: Arjun le da las gracias
    gloss: Arjun dice que está bien y le da las gracias.
    note: Theek hai y shukriya reutilizan vocabulario de la unidad 1.
  hi.a1.unit03.lesson03.teach.dialogue.line04:
    title: Priya responde
    gloss: Priya dice que no hay problema.
    note: Koi baat nahin es una forma muy común y natural de decir «de nada» o «no hay problema».
  hi.a1.unit03.lesson03.teach.dialogue.line05:
    title: Arjun pregunta el cumpleaños de Priya
    gloss: Arjun pregunta cuándo es el cumpleaños de Priya.
    note: Repite exactamente la pregunta informal sobre el cumpleaños de esta lección.
  hi.a1.unit03.lesson03.teach.dialogue.line06:
    title: Priya responde
    gloss: Priya dice que su cumpleaños es en enero.
    note: Repite exactamente la frase de respuesta de esta lección.
  hi.a1.unit03.lesson03.teach.dialogue.line07:
    title: Arjun reacciona y cuenta el suyo
    gloss: Arjun reacciona con entusiasmo y dice que su cumpleaños es en diciembre.
    note: Accha reutiliza vocabulario de la unidad 1; diciembre ya se enseñó en la lección 2 de esta unidad.
  hi.a1.unit03.lesson03.teach.dialogue.line08:
    title: Priya cierra la conversación
    gloss: Priya está de acuerdo y se despide de manera informal.
    note: Theek hai y phir milte hain reutilizan el vocabulario de despedida de la unidad 1.
