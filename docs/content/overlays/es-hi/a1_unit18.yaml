teaching:
  hi.a1.unit18.lesson01.teach.ghar_review:
    title: 'Repaso: casa'
    gloss: casa
    note: Se vio por primera vez en la unidad 8; es la palabra central de toda esta unidad.
    example_gloss: Esta es una casa.
  hi.a1.unit18.lesson01.teach.mein_review:
    title: 'Repaso: en'
    gloss: en
    note: Se vio por primera vez en la unidad 1; se usa en toda esta unidad para situar habitaciones y objetos.
    example_gloss: Trabajo en la oficina.
  hi.a1.unit18.lesson01.teach.hai_hain_review:
    title: 'Repaso: es/está, son/están'
    gloss: es / está (singular), son / están (plural)
    note: La pareja de verbos singular/plural de la que depende todo el patrón de cantidades de esta unidad.
    example_gloss:
    - Esta es una casa.
    - Mi abuelo vive en Delhi.
  hi.a1.unit18.lesson01.teach.numbers_review:
    title: 'Repaso: cuántos, uno, dos, tres'
    gloss: cuántos, uno, dos, tres
    note: Se vieron por primera vez en las unidades 2 y 7; aquí se reutilizan para contar habitaciones.
    example_gloss:
    - Tengo tres hermanos.
    - ¿Cuántas habitaciones hay en la casa?
  hi.a1.unit18.lesson01.teach.kamra_kamre:
    title: Habitación (singular / plural)
    gloss: habitación, habitaciones
    note: 'Un sustantivo nuevo. Fíjate en el plural: *kamra* (una) pasa a *kamre* (más de una); consulta la nota gramatical de esta lección.'
    example_gloss:
    - Hay una habitación en la casa.
    - Hay tres habitaciones en la casa.
  hi.a1.unit18.lesson01.teach.grammar_room_plural:
    title: Plural masculino -a → -e
    gloss: 'Los sustantivos masculinos que terminan en ''-a'' cambian a ''-e'' en plural: ''kamra'' (uno) pasa a ''kamre'' (más de uno). El verbo también cambia según el número: ''hai'' para uno, ''hain'' para más de uno; por ejemplo, ''ghar mein ek kamra hai'' pero ''ghar mein teen kamre hain''.'
    note: La primera regla de plural de sustantivos que se enseña formalmente en este curso, explicada antes de que algún ejercicio dependa de ella.
  hi.a1.unit18.lesson01.teach.rasoi:
    title: Cocina
    gloss: cocina
    note: Un sustantivo nuevo, la primera palabra de habitación de esta unidad.
    example_gloss: Hay una cocina en la casa.
  hi.a1.unit18.lesson01.teach.bathroom:
    title: Baño
    gloss: baño
    note: Préstamo del inglés muy común en el hindi hablado de todos los días, con el mismo patrón que *doctor* e *ingeniero* (unidades 16 y 17).
    example_gloss: Hay un baño en la casa.
  hi.a1.unit18.lesson01.teach.bedroom:
    title: Dormitorio
    gloss: dormitorio
    note: 'También es un préstamo común, invariable como *bathroom*: no toma un sufijo de plural propio, solo el patrón numeral + *hain*.'
    example_gloss: Hay dos dormitorios en la casa.
  hi.a1.unit18.lesson01.teach.ghar_mein_kitne_kamre_phrase:
    title: ¿Cuántas habitaciones hay en la casa?
    gloss: ¿Cuántas habitaciones hay en la casa?
    note: La pregunta con la que empieza esta lección.
  hi.a1.unit18.lesson01.teach.ghar_mein_teen_kamre_phrase:
    title: Hay tres habitaciones en la casa.
    gloss: Hay tres habitaciones en la casa.
    note: Una respuesta modelo a la pregunta con la que empieza esta lección.
  hi.a1.unit18.lesson02.teach.aur_review:
    title: 'Repaso: y'
    gloss: y
    note: Se vio por primera vez en la unidad 1; aquí se reutiliza para enumerar muebles.
    example_gloss: A mí también me gustó, ¿y a ti?
  hi.a1.unit18.lesson02.teach.mez:
    title: Mesa
    gloss: mesa
    note: Un sustantivo nuevo, que en los ejercicios de esta unidad aparece solo en singular (su regla de plural aún no se ha enseñado).
    example_gloss: Hay una mesa en la cocina.
  hi.a1.unit18.lesson02.teach.kursi_kursiyan:
    title: Silla (singular / plural)
    gloss: silla, sillas
    note: 'Un sustantivo nuevo. Fíjate en el plural: *kursi* (una) pasa a *kursiyan* (más de una); es una regla distinta de la de *kamra*/*kamre*, consulta la nota gramatical de esta lección.'
    example_gloss:
    - Hay una silla en la cocina.
    - Hay cuatro sillas en la cocina.
  hi.a1.unit18.lesson02.teach.chaar_review:
    title: 'Repaso: cuatro'
    gloss: cuatro
    note: Se vio por primera vez en la unidad 2; aquí se reutiliza para contar sillas.
    example_gloss: Hay cuatro sillas en la cocina.
  hi.a1.unit18.lesson02.teach.grammar_feminine_plural:
    title: Plural femenino -i → -iyan
    gloss: 'Los sustantivos femeninos que terminan en ''-i'' cambian a ''-iyan'' en plural: ''kursi'' (una) pasa a ''kursiyan'' (más de una), igual que ''kamra'' pasó a ''kamre'' antes en esta unidad con la regla masculina; pero aquí la regla es distinta, porque esta palabra es femenina y termina en ''-i''.'
    note: La segunda regla de plural de esta unidad, enseñada a propósito justo después de la primera para que el contraste se vea con facilidad.
  hi.a1.unit18.lesson02.teach.bistar:
    title: Cama
    gloss: cama
    note: Un sustantivo nuevo, que en los ejercicios de esta unidad se usa solo en singular.
    example_gloss: Hay una cama en el dormitorio.
  hi.a1.unit18.lesson02.teach.khidki_khidkiyan:
    title: Ventana (singular / plural)
    gloss: ventana, ventanas
    note: Sigue la misma regla del plural femenino '-i' -> '-iyan' que *kursi*/*kursiyan*.
    example_gloss:
    - Hay una ventana en el dormitorio.
    - Hay dos ventanas en el dormitorio.
  hi.a1.unit18.lesson02.teach.rasoi_mein_mez_phrase:
    title: Hay una mesa en la cocina.
    gloss: Hay una mesa en la cocina.
    note: El patrón lugar + objeto aplicado a la cocina.
  hi.a1.unit18.lesson02.teach.bedroom_mein_bistar_phrase:
    title: Hay una cama en el dormitorio.
    gloss: Hay una cama en el dormitorio.
    note: El patrón lugar + objeto aplicado al dormitorio.
  hi.a1.unit18.lesson03.teach.kaisa_review:
    title: 'Repaso: cómo es / de qué tipo'
    gloss: cómo es / de qué tipo
    note: Se vio por primera vez en la unidad 12; aquí se reutiliza para preguntar por una casa.
    example_gloss: ¿Cómo es tu casa?
  hi.a1.unit18.lesson03.teach.bada_chota_review:
    title: 'Repaso: grande, pequeño'
    gloss: grande (masc.), grande (fem.), pequeño (masc.), pequeña (fem.)
    note: 'Se vio por primera vez en la unidad 14; aquí se reutiliza para describir una casa. Concuerda con el género del propio sustantivo: *ghar* (masculino) lleva *bada*/*chota*, y *rasoi* (femenino) lleva *badi*.'
    example_gloss:
    - Mi casa es pequeña.
    - Esta es una cocina grande.
  hi.a1.unit18.lesson03.teach.ya_review:
    title: 'Repaso: o'
    gloss: o
    note: Se vio por primera vez en la unidad 14; aquí se reutiliza para hacer una pregunta de elección.
    example_gloss: ¿Tu casa es grande o pequeña?
  hi.a1.unit18.lesson03.teach.arjun_priya_review:
    title: 'Repaso: Arjun, Priya'
    gloss: Arjun, Priya
    note: Un recordatorio de los nombres de ambos personajes antes de que los ejercicios de ordenar palabras y de gramática de esta lección los usen para indicar de quién es la casa que se describe.
    example_gloss:
    - Me llamo Arjun.
    - Me llamo Priya.
  hi.a1.unit18.lesson03.teach.ka_review:
    title: 'Repaso: de (posesivo)'
    gloss: de (posesivo, con sustantivo masculino)
    note: Se vio por primera vez en las unidades 7, 10, 12, 14 y 15; aquí se reutiliza para indicar de quién es la casa que se describe, siempre en su forma simple a lo largo de esta unidad.
    example_gloss: La casa de Priya es pequeña.
  hi.a1.unit18.lesson03.teach.dialogue.line01:
    title: Arjun le pregunta a Priya por su casa
    gloss: Priya, ¿tu casa es grande o pequeña?
  hi.a1.unit18.lesson03.teach.dialogue.line02:
    title: Priya dice que su casa es pequeña
    gloss: 'Mi casa es pequeña. La casa tiene dos habitaciones: una cocina y un baño.'
  hi.a1.unit18.lesson03.teach.dialogue.line03:
    title: Priya le hace la misma pregunta a Arjun
    gloss: ¿Y tu casa, Arjun?
  hi.a1.unit18.lesson03.teach.dialogue.line04:
    title: Arjun dice que su casa es grande
    gloss: Mi casa es grande. La casa tiene tres dormitorios y una cocina grande.
  hi.a1.unit18.lesson03.teach.dialogue.line05:
    title: Priya pregunta qué hay en el dormitorio
    gloss: ¡Vaya! ¿Qué hay en el dormitorio?
  hi.a1.unit18.lesson03.teach.dialogue.line06:
    title: Arjun describe el dormitorio
    gloss: En el dormitorio hay una cama y dos ventanas.
  hi.a1.unit18.lesson03.teach.dialogue.line07:
    title: Priya reacciona
    gloss: ¡Qué bonito!
  hi.a1.unit18.lesson03.teach.dialogue.line08:
    title: Arjun le da las gracias
    gloss: ¡Gracias!
  hi.a1.unit18.lesson03.teach.grammar_summary:
    title: Tres reglas principales
    gloss: 'Las tres reglas principales de esta unidad: (1) ''[lugar] + mein + [número] + [sustantivo] + hai/hain'' indica qué hay en una casa y cuántos; (2) los sustantivos masculinos que terminan en ''-a'' pasan a ''-e'' en plural (kamra -> kamre); (3) los sustantivos femeninos que terminan en ''-i'' pasan a ''-iyan'' en plural (kursi -> kursiyan, khidki -> khidkiyan).'
    note: Un resumen final que reúne toda la gramática de la unidad, como la nota gramatical de las unidades 15 a 17.
  hi.a1.unit18.lesson03.teach.home_reading:
    title: Lectura sobre dos casas
    gloss: 'La casa de Priya es pequeña. La casa tiene dos habitaciones: una cocina y un baño. La casa de Arjun es grande. La casa tiene tres dormitorios y una cocina grande.'
    note: Un perfil breve y directo que repite exactamente los datos ya presentados en el diálogo, sin información nueva; sirve para practicar la lectura de una descripción corta de una vivienda.
    glosses:
      घर: casa / hogar
      छोटा: pequeño
      कमरे: habitaciones
      रसोई: cocina
      बाथरूम: baño
      बड़ा: grande
      बेडरूम: dormitorios
      बड़ी: grande (femenino)
