teaching:
  hi.a1.unit32.lesson01.teach.janvar_paltoo_janvar:
    title: Animal, mascota
    gloss: el animal / una mascota
    note: '*जानवर* es la palabra general para «animal», y *पालतू जानवर* («animal doméstico») significa «mascota».'
    example_gloss:
    - Un perro es un animal.
    - Un perro también es una mascota.
  hi.a1.unit32.lesson01.teach.kutta_billee:
    title: Perro y gato
    gloss: el perro / el gato
    example_gloss:
    - Priya tiene un perro.
    - Vikram tiene un gato.
  hi.a1.unit32.lesson01.teach.machhlee_chiriya:
    title: Pez y pájaro
    gloss: el pez / el pájaro
    example_gloss:
    - El abuelo tiene un pez.
    - Nina tiene un pájaro.
  hi.a1.unit32.lesson01.teach.kya_tumhare_pas:
    title: ¿Tienes una mascota?
    gloss: ¿Tienes una mascota?
    note: '*तुम्हारे पास ... है?* («junto a ti ... hay?») pregunta «¿tienes ...?», y *कोई* («algún») mantiene la pregunta abierta.'
  hi.a1.unit32.lesson01.teach.han_mere_pas:
    title: Sí, tengo un perro
    gloss: Sí, tengo un perro.
    note: Una respuesta afirmativa sencilla con el vocabulario nuevo de esta unidad.
  hi.a1.unit32.lesson01.teach.naheen_mere_pas:
    title: No, no tengo mascota
    gloss: No, no tengo mascota.
    note: '*कोई ... नहीं है* («no hay ningún ...») expresa que no tienes ninguno.'
  hi.a1.unit32.lesson01.teach.mere_pas_koee:
    title: कोई ... नहीं
    gloss: No tengo ninguna mascota.
    note: '*कोई* («algún») junto con *नहीं है* niega que se tenga algo: *मेरे पास कोई पालतू जानवर नहीं है*.'
  hi.a1.unit32.lesson02.teach.ghumane_le_jana:
    title: Pasear (a un animal)
    gloss: pasear (a un animal)
    note: '*घुमाने ले जाना* («llevar a pasear») es como el hindi dice «pasear a un animal»; después de *घुमाने* va *ले जाना*.'
    example_gloss: Paseo al perro todos los días.
  hi.a1.unit32.lesson02.teach.vah_kutte_ko:
    title: घुमाने ले जाना
    gloss: Ella saca a pasear al perro.
    note: El animal lleva *को* (*कुत्ते को*), y *घुमाने ले जाती है* va al final; *ले जाना* («llevar consigo») se mantiene junto, como dos palabras.
  hi.a1.unit32.lesson02.teach.khana_dena:
    title: Dar de comer
    gloss: dar de comer
    example_gloss: Le doy de comer al gato todos los días.
  hi.a1.unit32.lesson02.teach.ke_sath_khelna:
    title: Jugar con
    gloss: jugar con
    example_gloss: Vikram juega con su gata.
  hi.a1.unit32.lesson02.teach.main_roz_kutte:
    title: Paseo al perro todos los días
    gloss: Paseo al perro todos los días.
    note: '*रोज़* («todos los días») va antes del complemento: *रोज़ कुत्ते को घुमाने ले जाता हूँ*.'
  hi.a1.unit32.lesson02.teach.main_roz_billee:
    title: Le doy de comer al gato todos los días
    gloss: Le doy de comer al gato todos los días.
    note: '*खाना देना* («dar de comer») marca con *को* a quien recibe la comida: *बिल्ली को खाना देता हूँ*.'
  hi.a1.unit32.lesson03.teach.ek_kutta_do:
    title: Formas del plural
    gloss: Un perro, dos perros; un gato, dos gatos. Un sustantivo masculino terminado en *-आ* cambia a *-ए* en plural (*कुत्ता* → *कुत्ते*), mientras que un sustantivo femenino terminado en *-ई* añade *-याँ* (*बिल्ली* → *बिल्लियाँ*).
    note: El patrón regular del plural en hindi, presentado aquí por primera vez con sustantivos de animales como ejemplos.
  hi.a1.unit32.lesson03.teach.kutte_billiyan:
    title: Perros y gatos
    gloss: perros / gatos
    example_gloss:
    - A Arjun le encantan los perros.
    - A Neha le encantan los gatos.
  hi.a1.unit32.lesson03.teach.machhliyan_chiriyan:
    title: Peces y pájaros (plural)
    gloss: peces / pájaros
    example_gloss:
    - Adoro los peces.
    - El abuelo adora los pájaros.
  hi.a1.unit32.lesson03.teach.mujhe_janvar_bahut:
    title: Adoro a los animales
    gloss: Adoro a los animales.
    note: '*मुझे जानवर बहुत पसंद हैं* («a mí, los animales me gustan mucho») significa «me encantan los animales»; *हैं* es plural porque *जानवर* está en plural.'
  hi.a1.unit32.lesson03.teach.neha_ko_billiyan:
    title: A Neha le encantan los gatos, pero no tiene mascota
    gloss: A Neha le encantan los gatos, pero no tiene mascota.
    note: Prepara el contraste en torno al cual se construye la lectura de la lección 5.
  hi.a1.unit32.lesson04.teach.arjun_kya_tumhare:
    title: Arjun pregunta por una mascota
    gloss: 'Arjun: ¿Tienes alguna mascota, Priya?'
  hi.a1.unit32.lesson04.teach.priya_han_mere:
    title: Priya tiene un perro
    gloss: 'Priya: Sí, tengo un perro.'
  hi.a1.unit32.lesson04.teach.arjun_vah_kaisa:
    title: Arjun pregunta cómo es
    gloss: 'Arjun: ¿Cómo es?'
    note: '*वह कैसा दिखता है?* también se usa para animales, y *कैसा* es masculino porque el perro es macho.'
  hi.a1.unit32.lesson04.teach.priya_uske_bal:
    title: Priya describe a su perro
    gloss: 'Priya: Tiene el pelo marrón y es pequeño.'
    note: Retoma el vocabulario de color del pelo y de tamaño de la unidad del aspecto físico, ahora para describir el pelaje de un animal y no el pelo de una persona.
  hi.a1.unit32.lesson04.teach.vah_mera_kutta:
    title: वह para animales
    gloss: Ese es mi perro. Me gusta mucho.
    note: '*वह* y *उसे* se usan tanto para animales como para personas; el hindi no tiene aquí una palabra distinta para «ello».'
  hi.a1.unit32.lesson04.teach.arjun_kya_tum:
    title: Arjun pregunta por los paseos
    gloss: 'Arjun: ¿Lo sacas a pasear todos los días?'
  hi.a1.unit32.lesson04.teach.priya_han_main:
    title: Priya cuenta su rutina
    gloss: 'Priya: Sí, lo saco a pasear todos los días y le doy de comer.'
  hi.a1.unit32.lesson05.teach.arjun_aur_neha:
    title: Arjun, Neha y Vikram hablan de animales
    gloss: 'A Arjun y a Neha les encantan los animales, pero ninguno de los dos tiene mascota. A Arjun le encantan los perros y a Neha le encantan los gatos. Vikram sí tiene una mascota: una gata. A menudo juega con su gata y le da de comer todos los días. ¿Tienes tú alguna mascota?'
    note: Contrasta querer a los animales con tener uno de verdad, que es el objetivo comunicativo de la unidad.
    glosses:
      पसंद: adorar
      दोनों: los dos
      जानवर: animales
      किसी: ninguno de ellos
      पालतू: mascota
      कुत्ते: perros
      बिल्लियाँ: gatos
      बिल्ली: gato
      खेलता: juega
      देता: da
      रोज़: cada
      खाना: comida
  hi.a1.unit32.lesson05.teach.vikram_aksar_apnee:
    title: Vikram juega a menudo con su gata
    gloss: Vikram juega a menudo con su gata.
    note: '*अक्सर* («a menudo») va antes del verbo, y *अपनी* concuerda con el femenino *बिल्ली*.'
  hi.a1.unit32.lesson05.teach.mujhe_kutte_bahut:
    title: Adoro a los perros. No tengo mascota.
    gloss: Adoro a los perros. No tengo mascota.
    note: Una respuesta modelo de dos frases, lista para reutilizar en el ejercicio de escritura de la unidad.
  hi.a1.unit32.lesson06.teach.priya_neena_kya:
    title: Priya le pregunta a Nina
    gloss: 'Priya: Nina, ¿tú también tienes alguna mascota?'
  hi.a1.unit32.lesson06.teach.neena_han_mere:
    title: Nina tiene un pájaro llamado Pico
    gloss: 'Nina: Sí, tengo un pájaro. Se llama Pico.'
    note: '*उसका नाम पिको है* («su nombre es Pico») usa *का* porque *नाम* es masculino.'
  hi.a1.unit32.lesson06.teach.arjun_vah_kitna:
    title: Reacción de Arjun
    gloss: 'Arjun: ¡Qué bien! ¿Qué haces con él todos los días?'
  hi.a1.unit32.lesson06.teach.neena_main_use:
    title: Nina le da de comer todos los días
    gloss: 'Nina: Le doy de comer todos los días.'
  hi.a1.unit32.lesson06.teach.arjun_mujhe_bhee:
    title: A Arjun también le encantan los pájaros
    gloss: 'Arjun: A mí también me encantan los pájaros.'
  hi.a1.unit32.lesson06.teach.priya_kitna_achchha:
    title: Priya cierra la conversación
    gloss: 'Priya: ¡Qué bonito que a los tres nos encanten los animales!'
    note: Cierra el círculo con los datos sobre animales de los tres personajes de esta unidad.
