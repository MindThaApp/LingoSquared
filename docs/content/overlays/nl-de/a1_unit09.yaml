    note: '*Krankenhaus* betekent letterlijk ''huis voor zieken'' -- onzijdig zelfstandig naamwoord, *das Krankenhaus*.'
    example_gloss: Mijn vriend ligt in het ziekenhuis.
  de.a1.unit09.lesson01.teach.apotheke:
    title: Apotheke
    gloss: apotheek
    note: '*Apotheke* betekent apotheek -- vrouwelijk zelfstandig naamwoord, *die Apotheke*.'
    example_gloss: De apotheek is vandaag open.
  de.a1.unit09.lesson01.teach.park:
    title: Park
    gloss: park
    note: '*Park* betekent park -- mannelijk zelfstandig naamwoord, *der Park*.'
    example_gloss: We wandelen graag in het park.
  de.a1.unit09.lesson01.teach.restaurant:
    title: Restaurant
    gloss: restaurant
