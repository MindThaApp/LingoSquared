    example_gloss: Dit restaurant heeft lekker eten.
  de.a1.unit09.lesson02.teach.neben:
    title: Die Apotheke ist neben dem Park.
    gloss: De apotheek is naast het park.
    note: '*neben* betekent ''naast''. Het is een wisselvoorzetsel -- bij een vaste plaats (zoals hier) staat de datief, dus *der Park* (mannelijk) wordt *dem Park*.'
  de.a1.unit09.lesson02.teach.gegenueber_von:
    title: Die Apotheke ist gegenüber vom Krankenhaus.
    gloss: De apotheek is tegenover het ziekenhuis.
    note: '*gegenüber von* betekent ''tegenover''. *vom* is de gebruikelijke samentrekking van *von dem* (datief onzijdig, *das Krankenhaus*), in gesproken en geschreven taal.'
  de.a1.unit09.lesson02.teach.zwischen:
    title: Die Apotheke ist zwischen der Bank und dem Park.
    gloss: De apotheek is tussen de bank en het park.
    note: '*zwischen* betekent ''tussen''. Let op beide datiefvormen: *der Bank* (vrouwelijk) en *dem Park* (mannelijk).'
  de.a1.unit09.lesson02.teach.hinter:
    title: Das Restaurant ist hinter der Bank.
    gloss: Het restaurant is achter de bank.
    note: '*hinter* betekent ''achter'' -- *der Bank* is de vrouwelijke datiefvorm.'
  de.a1.unit09.lesson02.teach.vor:
    title: Der Park ist vor dem Krankenhaus.
    gloss: Het park ligt voor het ziekenhuis.
    note: '*vor* betekent ''voor'' -- *dem Krankenhaus* is de onzijdige datiefvorm.'
  de.a1.unit09.lesson03.teach.wo_ist_die_bank:
    title: Wo ist die Bank?
    gloss: Waar is de bank?
    note: '*Wo ist...?* is de standaardmanier om te vragen waar iets is.'
  de.a1.unit09.lesson03.teach.sie_ist_neben:
    title: Sie ist neben dem Park.
    gloss: Die is naast het park.
    note: '*Sie* betekent hier ''die/ze'' (verwijst naar *die Bank*, vrouwelijk). Het heeft alleen een hoofdletter omdat het de zin begint. Het werkwoord *ist* laat zien dat het niet de beleefdheidsvorm ''u'' is, want die zou *Sie sind* zijn.'
  de.a1.unit09.lesson03.teach.ist_es_weit:
    title: Ist es weit von hier?
    gloss: Is het ver van hier?
    note: '*weit* betekent ver. *es* is hier een algemeen aanduidend woord voor de situatie en komt niet overeen met het geslacht van een bepaald zelfstandig naamwoord.'
  de.a1.unit09.lesson03.teach.nicht_weit:
    title: Nein, es ist nicht weit.
    gloss: Nee, het is niet ver.
    note: '*nicht* ontkent het bijvoeglijk naamwoord *weit*.'
  de.a1.unit09.lesson04.teach.entschuldigung_wo:
    title: Entschuldigung, wo ist die Apotheke?
    gloss: Pardon, waar is de apotheek?
    note: '*Entschuldigung* kwam eerder voor als ''pardon / sorry'' -- hier opent het op beleefde wijze een vraag.'
  de.a1.unit09.lesson04.teach.line01:
    title: Felix vraagt de weg
    gloss: 'Felix zegt: Pardon, waar is de apotheek?'
    note: Dezelfde beleefde opening als in de losse zin hierboven, nu in een echt gesprek.
  de.a1.unit09.lesson04.teach.line02:
    title: Anna zegt waar het is
    gloss: 'Anna zegt: Die is tegenover het ziekenhuis.'
    note: Een volledig antwoord geeft de ligging van de apotheek ten opzichte van een bekend oriëntatiepunt.
  de.a1.unit09.lesson04.teach.line03:
    title: Felix vraagt hoe ver het is
    gloss: 'Felix zegt: Is het ver van hier?'
    note: Een natuurlijke vervolgvraag als je de richting ongeveer weet.
  de.a1.unit09.lesson04.teach.line04:
    title: Anna antwoordt over de afstand
    gloss: 'Anna zegt: Nee, het is niet ver. Die is tussen de bank en het park.'
    note: Een volledig antwoord stelt gerust over de afstand en noemt dan een tweede, preciezer oriëntatiepunt.
