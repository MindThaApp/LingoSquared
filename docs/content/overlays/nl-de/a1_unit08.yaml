    gloss: een zak rijst
    note: '*Tüte* betekent zak.'
  de.a1.unit08.lesson01.teach.ein_kilo:
    title: ein Kilo Tomaten
    gloss: een kilo tomaten
    note: '*Kilo* is de standaard metrische gewichtseenheid en wordt veel vaker gebruikt dan *Pfund*, behalve voor losse, alledaagse hoeveelheden.'
  de.a1.unit08.lesson02.teach.was_kosten_die_aepfel:
    title: Was kosten die Äpfel?
    gloss: Hoeveel kosten de appels?
    note: '*kosten* betekent ''kosten'' – letterlijk ''Wat kosten de appels?'''
  de.a1.unit08.lesson02.teach.sie_kosten_zwei_euro:
    title: Sie kosten zwei Euro das Pfund.
    gloss: Ze kosten twee euro per pond.
    note: '*Sie* betekent hier ''ze'' (de appels), niet het formele ''u''. Formeel *Sie* en meervoud *sie* (''ze'') hebben precies dezelfde werkwoordsvorm (*kosten*) en aan het begin van een zin schrijf je beide met een hoofdletter. Alleen de context maakt het duidelijk: hier gaat het over de appels, niet over een persoon.'
  de.a1.unit08.lesson02.teach.kann_ich_zwei_pfund:
    title: Kann ich zwei Pfund haben, bitte?
    gloss: Mag ik twee pond, alstublieft?
    note: Een beleefd verzoek, vergelijkbaar met *Ich möchte..., bitte* uit Unit 7.
  de.a1.unit08.lesson02.teach.ist_es_frisch:
    title: Ist es frisch?
    gloss: Is het vers?
    note: '*frisch* betekent vers. *es* verwijst hier naar een onzijdig woord (zoals das Brot); bij een mannelijk product zeg je *Ist er frisch?* (der Reis) en bij een vrouwelijk product *Ist sie frisch?* (die Milch). Het voornaamwoord verandert dus mee met het geslacht van het woord en is niet vast *es*.'
  de.a1.unit08.lesson03.teach.pro_pfund:
    title: pro Pfund
    gloss: per pond
    note: '*pro* betekent ''per'' – je gebruikt het op prijskaartjes en ook in gesproken prijzen.'
    example_gloss: Appels kosten twee euro per pond.
  de.a1.unit08.lesson03.teach.preisschild_text:
    title: Markt-Preisschild
    gloss: Prijsbordje op de markt
    note: Een eenvoudig prijsbordje met drie producten en hun prijs per eenheid.
  de.a1.unit08.lesson04.teach.das_macht_acht_euro:
    title: Das macht acht Euro.
    gloss: Dat is acht euro.
    note: '*Das macht...* is de standaardmanier om een totaalprijs te noemen, al gezien in Unit 7.'
  de.a1.unit08.lesson04.teach.line01:
    title: Felix vraagt naar de prijs
    gloss: 'Felix zegt: Hoeveel kosten de appels?'
    note: Dezelfde vraag als in les 2, nu in een echt gesprek.
  de.a1.unit08.lesson04.teach.line02:
    title: Anna noemt de prijs
    gloss: 'Anna zegt: Ze kosten twee euro per pond.'
    note: Een volledig antwoord noemt de prijs per eenheid.
  de.a1.unit08.lesson04.teach.line03:
    title: Felix bestelt
    gloss: 'Felix zegt: Goed, mag ik twee pond, alstublieft?'
    note: '*Gut* betekent hier ''goed/prima'': je gaat akkoord met de prijs voordat je bestelt.'
  de.a1.unit08.lesson04.teach.line04:
    title: Anna vraagt of het nog iets meer mag zijn
    gloss: 'Anna zegt: Natuurlijk. Verder nog iets?'
    note: '*Natürlich* betekent ''natuurlijk/vanzelfsprekend''.'
  de.a1.unit08.lesson04.teach.line05:
    title: Felix bestelt meer
    gloss: 'Felix zegt: Ja, ook een dozijn eieren.'
    note: '*auch* betekent ''ook''.'
  de.a1.unit08.lesson04.teach.line06:
    title: Anna noemt het totaalbedrag
    gloss: 'Anna zegt: Dat is acht euro.'
    note: Twee pond appels (4€) plus een dozijn eieren (4€) is samen acht euro.
