    title: ein Pfund Äpfel
    gloss: een pond appels
    note: '*Pfund* wordt in Duitsland informeel nog steeds vaak gebruikt; een Duits *Pfund* is precies 500 g (een halve kilo), net als het Nederlandse pond, ook al is het land officieel metrisch.'
  de.a1.unit08.lesson01.teach.ein_dutzend:
