    example_gloss:
    - Ik heb vijf appels.
    - Ik heb zes appels.
    - Ik heb zeven appels.
    - Ik heb acht appels.
    - Ik heb negen appels.
    - Ik heb tien appels.
  de.a1.unit03.lesson02.teach.elf_zwoelf:
    title: elf, zwölf
    gloss: elf, twaalf
    note: '*elf* en *zwölf* zijn onregelmatig, net als Nederlands ''elf'' en ''twaalf'': ze volgen niet het patroon van de getallen vanaf 13.'
    example_gloss:
    - Mijn huisnummer is elf.
    - Mijn huisnummer is twaalf.
  de.a1.unit03.lesson02.teach.dreizehn_bis_sechzehn:
    title: dreizehn, vierzehn, fünfzehn, sechzehn
    gloss: dertien, veertien, vijftien, zestien
    note: 'Vanaf 13 vormt het Duits getallen met het basiscijfer + *-zehn*, net zoals wij in het Nederlands -tien gebruiken (vergelijk het Engelse *-teen*). Let op: *sechzehn*, niet *sechszehn* – de *s* valt weg.'
    example_gloss:
    - Mijn huisnummer is dertien.
    - Mijn huisnummer is veertien.
    - Mijn huisnummer is vijftien.
    - Mijn huisnummer is zestien.
  de.a1.unit03.lesson02.teach.siebzehn_bis_zwanzig:
    title: siebzehn, achtzehn, neunzehn, zwanzig
    gloss: zeventien, achttien, negentien, twintig
    note: 'Let op: *siebzehn*, niet *siebenzehn*: de *-en* van *sieben* valt weg voor *-zehn*.'
    example_gloss:
    - Mijn huisnummer is zeventien.
    - Mijn huisnummer is achttien.
    - Mijn huisnummer is negentien.
    - Mijn huisnummer is twintig.
  de.a1.unit03.lesson03.teach.dreissig_bis_fuenfzig:
    title: dreißig, vierzig, fünfzig
    gloss: dertig, veertig, vijftig
    note: 'Let op: *dreißig*, niet *dreizig*: 30 eindigt op *-ßig* in plaats van *-zig* (ook 20, *zwanzig*, is onregelmatig).'
    example_gloss:
    - Dat kost dertig euro.
    - Dat kost veertig euro.
    - Dat kost vijftig euro.
  de.a1.unit03.lesson03.teach.sechzig_bis_neunzig:
    title: sechzig, siebzig, achtzig, neunzig
    gloss: zestig, zeventig, tachtig, negentig
    note: 'Vanaf 40 is het patroon regelmatig: cijfer + *-zig* (met dezelfde verkortingen *sech-* en *sieb-* als bij de getallen vanaf 13).'
    example_gloss:
    - Dat kost zestig euro.
    - Dat kost zeventig euro.
    - Dat kost tachtig euro.
    - Dat kost negentig euro.
  de.a1.unit03.lesson03.teach.hundert:
    title: hundert
    gloss: honderd
    note: '*hundert* betekent op zichzelf ''honderd'': je hebt er geen *ein* voor nodig (*einhundert* kan ook, maar is in het dagelijks taalgebruik minder gebruikelijk).'
    example_gloss: Dat kost honderd euro.
  de.a1.unit03.lesson03.teach.einundzwanzig:
    title: einundzwanzig
    gloss: eenentwintig
    note: Net als in het Nederlands komt in de Duitse samengestelde getallen van 21 tot 99 eerst het cijfer van de eenheden, dan *und* ('en'), dan het tiental, alles in ÉÉN woord. *einundzwanzig* = *ein* (één) + *und* (en) + *zwanzig* (twintig).
  de.a1.unit03.lesson03.teach.zweiunddreissig:
    title: zweiunddreißig
    gloss: tweeëndertig
    note: 'Zelfde patroon: *zwei* (twee) + *und* + *dreißig* (dertig) = 32.'
  de.a1.unit03.lesson04.teach.wie_alt_sind_sie:
    title: Wie alt sind Sie?
    gloss: Hoe oud bent u? (formeel)
    note: '*alt* betekent ''oud'': letterlijk ''hoe oud bent u''.'
  de.a1.unit03.lesson04.teach.wie_alt_bist_du:
    title: Wie alt bist du?
    gloss: Hoe oud ben jij? (informeel)
    note: De informele versie, met *du*.
  de.a1.unit03.lesson04.teach.ich_bin_jahre_alt:
    title: Ich bin achtundzwanzig Jahre alt.
    gloss: Ik ben achtentwintig jaar oud.
    note: '*Jahre alt* (''jaar oud'') staat altijd achter het getal. Net als in het Nederlands zeg je je leeftijd met ''ik ben [getal] jaar oud''.'
  de.a1.unit03.lesson05.teach.line01:
    title: Felix vraagt naar Anna's leeftijd
    gloss: 'Felix zegt: Hoe oud bent u, als ik het mag vragen?'
    note: '*wenn ich fragen darf* (''als ik het mag vragen'') maakt een vraag die anders wat direct kan overkomen zachter: een beleefd tintje dat past bij het formele *Sie* waarmee ze blijven praten.'
  de.a1.unit03.lesson05.teach.line02:
    title: Anna antwoordt en vraagt terug
    gloss: 'Anna zegt: Ik ben achtentwintig jaar oud. En u?'
    note: Anna noemt haar leeftijd en stelt de vraag terug, zoals in Unit 2.
  de.a1.unit03.lesson05.teach.line03:
    title: Felix antwoordt
    gloss: 'Felix zegt: Ik ben eenendertig jaar oud.'
    note: Hieruit blijkt dat Felix drie jaar ouder is dan Anna.
