teaching:
  de.a1.unit04.lesson01.teach.montag:
    title: Montag
    gloss: maandag
    note: '*Montag* is in Duitstalige landen de eerste dag van de week.'
    example_gloss: Ik heb maandag tijd.
  de.a1.unit04.lesson01.teach.dienstag:
    title: Dienstag
    gloss: dinsdag
    note: '*Dienstag* is de tweede dag van de week.'
    example_gloss: Ik heb dinsdag tijd.
  de.a1.unit04.lesson01.teach.mittwoch:
    title: Mittwoch
    gloss: woensdag
    note: '*Mittwoch* betekent letterlijk ''midden van de week'' -- het is echt de middelste dag van de Duitse werkweek.'
    example_gloss: Ik heb woensdag tijd.
  de.a1.unit04.lesson01.teach.donnerstag:
    title: Donnerstag
    gloss: donderdag
    note: '*Donnerstag* is vernoemd naar de Germaanse god Donar (Thor).'
    example_gloss: Ik heb donderdag tijd.
  de.a1.unit04.lesson01.teach.freitag:
    title: Freitag
    gloss: vrijdag
    note: '*Freitag* is vernoemd naar de Germaanse godin Frigg.'
    example_gloss: Ik heb vrijdag tijd.
  de.a1.unit04.lesson01.teach.samstag:
    title: Samstag
    gloss: zaterdag
    note: '*Samstag* is het standaardwoord voor zaterdag in het grootste deel van Duitsland; *Sonnabend* is een regionaal alternatief (Noord- en Oost-Duitsland).'
    example_gloss: Ik heb zaterdag tijd.
  de.a1.unit04.lesson01.teach.sonntag:
    title: Sonntag
    gloss: zondag
    note: '*Sonntag* betekent letterlijk ''zonnedag'', net als het Nederlandse ''zondag'' (zon + dag).'
    example_gloss: Ik heb zondag tijd.
  de.a1.unit04.lesson01.teach.welcher_tag:
    title: Welcher Tag ist heute?
    gloss: Welke dag is het vandaag?
    note: '*heute* betekent ''vandaag''; *Welcher Tag* = ''welke dag''.'
  de.a1.unit04.lesson02.teach.januar:
    title: Januar
    gloss: januari
    note: '*Januar* is de eerste maand van het jaar.'
    example_gloss: Ik ben jarig in januari.
  de.a1.unit04.lesson02.teach.maerz:
    title: März
    gloss: maart
    note: '*März* is de derde maand van het jaar.'
    example_gloss: Ik ben jarig in maart.
  de.a1.unit04.lesson02.teach.mai:
    title: Mai
    gloss: mei
    note: '*Mai* is kort en makkelijk te onthouden -- bijna gelijk aan het Nederlandse ''mei''.'
    example_gloss: Ik ben jarig in mei.
  de.a1.unit04.lesson02.teach.juli:
    title: Juli
    gloss: juli
    note: '*Juli* is de zevende maand van het jaar.'
    example_gloss: Ik ben jarig in juli.
  de.a1.unit04.lesson02.teach.september:
    title: September
    gloss: september
    note: '*September* wordt in het Duits en het Nederlands bijna hetzelfde gespeld: alleen de beginletter verschilt in hoofdletter.'
    example_gloss: Ik ben jarig in september.
  de.a1.unit04.lesson02.teach.dezember:
    title: Dezember
    gloss: december
    note: '*Dezember* is de laatste maand van het jaar.'
    example_gloss: Ik ben jarig in december.
  de.a1.unit04.lesson02.teach.welcher_monat:
    title: Welcher Monat ist es?
    gloss: Welke maand is het?
    note: '*Monat* betekent ''maand''; *es* = ''het''.'
  de.a1.unit04.lesson03.teach.wievielte:
    title: Der Wievielte ist heute?
    gloss: Welke datum is het vandaag?
    note: Letterlijk 'de hoeveelste is het vandaag?' -- de standaardmanier om in het Duits naar de datum te vragen, net als in het Nederlands.
  de.a1.unit04.lesson03.teach.siebte_juli:
    title: Heute ist der siebte Juli.
    gloss: Vandaag is het 7 juli.
    note: 'Het Duits noemt eerst de dag en dan de maand, net als het Nederlands: *der siebte Juli* = ''de zevende juli''. Leer *der siebte Juli* als vaste uitdrukking.'
  de.a1.unit04.lesson03.teach.dienstag_siebte_juli:
    title: Heute ist Dienstag, der siebte Juli.
    gloss: Vandaag is het dinsdag 7 juli.
    note: Zet de weekdag voor de datum, gescheiden door een komma.
  de.a1.unit04.lesson03.teach.numerische_form:
    title: Man kann es auch als 7.7. schreiben.
    gloss: Je kunt het ook schrijven als 7.7.
    note: 'Duitse numerieke data hebben eerst de dag, dan de maand, elk gevolgd door een punt: 7.7. = 7 juli. In het Nederlands gebruik je daarvoor meestal streepjes (7-7).'
  de.a1.unit04.lesson03.teach.geburtstag_frage:
    title: Wann haben Sie Geburtstag?
    gloss: Wanneer bent u jarig?
    note: 'Letterlijk: ''Wanneer hebt u verjaardag?'' In het Duits zeg je niet dat je jarig bent, maar dat je een verjaardag *hebt*.'
  de.a1.unit04.lesson03.teach.geburtstag_antwort:
    title: Mein Geburtstag ist der dritte März.
    gloss: Ik ben op 3 maart jarig.
    note: '*Mein Geburtstag* = ''mijn verjaardag''; *der dritte März* = ''3 maart'' (eerst de dag, dan de maand).'
  de.a1.unit04.lesson04.teach.oeffnet:
    title: öffnet
    gloss: opent / gaat open
    note: '*öffnet* is de derde persoon enkelvoud van *öffnen* (openen) -- gebruikt voor ''het gaat open'', bijvoorbeeld een winkel of bibliotheek.'
    example_gloss: De winkel gaat maandag open.
  de.a1.unit04.lesson04.teach.wieder:
    title: wieder
    gloss: weer
    note: '*wieder* betekent ''weer'' -- hier gebruikt om te vragen wanneer iets heropent.'
    example_gloss: De bibliotheek gaat maandag weer open.
  de.a1.unit04.lesson04.teach.die:
    title: die
    gloss: de (vrouwelijk/meervoud)
    note: '*die* is het bepaald lidwoord voor vrouwelijk enkelvoud en alle meervoudsvormen -- hier gebruikt bij het vrouwelijke woord *Bibliothek*.'
    example_gloss: De bibliotheek is groot.
  de.a1.unit04.lesson04.teach.bibliothek:
    title: Bibliothek
    gloss: bibliotheek
    note: '*Bibliothek* is een vrouwelijk zelfstandig naamwoord (*die Bibliothek*).'
    example_gloss: Ik ga naar de bibliotheek.
  de.a1.unit04.lesson04.teach.am:
    title: am
    gloss: op / aan de
    note: '*am* is een samentrekking van *an dem*, gebruikt bij weekdagen en data (*am Montag* = ''op maandag'').'
    example_gloss: Op maandag werk ik.
  de.a1.unit04.lesson04.teach.den:
    title: den
    gloss: de (mannelijk, accusatief)
    note: '*den* is de mannelijke accusatiefvorm van *der*. Hij staat in volledige data na een weekdag, zoals in *am Donnerstag, den neunten Juli* -- leer dit als vast patroon in plaats van de naamval te analyseren. (Je ziet ook *dem* na *am*; dat is even correct.)'
    example_gloss: We spreken af op donderdag 9 juli.
  de.a1.unit04.lesson04.teach.neunten:
    title: neunten
    gloss: negende
    note: '*neunten* is de verbogen rangtelwoordvorm van *neun* (negen), gebruikt in data: *der neunte Juli* (nominatief) wordt *den neunten Juli* in deze volledige datumconstructie.'
    example_gloss: Ik ben op 9 juli jarig.
  de.a1.unit04.lesson04.teach.line01:
    title: Felix vraagt naar de datum
    gloss: 'Felix zegt: Welke datum is het vandaag?'
  de.a1.unit04.lesson04.teach.line02:
    title: Anna noemt de datum
    gloss: 'Anna zegt: Vandaag is het dinsdag 7 juli.'
  de.a1.unit04.lesson04.teach.line03:
    title: Felix vraagt naar de bibliotheek
    gloss: 'Felix zegt: Wanneer gaat de bibliotheek weer open?'
  de.a1.unit04.lesson04.teach.line04:
    title: Anna antwoordt
    gloss: 'Anna zegt: Ze gaat weer open op donderdag 9 juli.'
    note: '*Sie* verwijst hier terug naar *die Bibliothek* (een vrouwelijk woord) en betekent dus ''ze'' of ''hij''.'
  de.a1.unit04.lesson04.teach.line05:
    title: Felix neemt afscheid
    gloss: 'Felix zegt: Goed, tot donderdag.'
    note: '*bis Donnerstag* = ''tot donderdag'' -- een veelgebruikte manier om te zeggen dat je elkaar donderdag ziet.'
  de.a1.unit04.lesson04.teach.notiz:
    title: Een briefje op de deur
    gloss: Gesloten tot donderdag 9 juli.
    note: '*Geschlossen* betekent ''gesloten''.'
