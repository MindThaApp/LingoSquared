teaching:
  de.a1.unit01.lesson01.teach.hallo:
    title: Hallo
    gloss: hallo / hoi
    note: '*Hallo* is een informele begroeting die je op elk moment van de dag kunt gebruiken, net als "hoi" of "hallo" in het Nederlands.'
    example_gloss: Hallo, Felix!
  de.a1.unit01.lesson01.teach.guten_morgen:
    title: Guten Morgen
    gloss: goedemorgen
    note: '*Guten Morgen* gebruik je ''s ochtends, ongeveer tot laat in de ochtend.'
  de.a1.unit01.lesson01.teach.guten_tag:
    title: Guten Tag
    gloss: goedendag / dag
    note: '*Guten Tag* is de standaard, iets formelere begroeting overdag. Je gebruikt hem vanaf laat in de ochtend tot in de middag.'
  de.a1.unit01.lesson01.teach.guten_abend:
    title: Guten Abend
    gloss: goedenavond
    note: '*Guten Abend* zeg je als je ''s avonds ergens aankomt. Het is een begroeting, geen afscheid.'
  de.a1.unit01.lesson02.teach.tschuss:
    title: Tschüss
    gloss: doei
    note: '*Tschüss* is een informele, heel gewone manier om tot ziens te zeggen tegen vrienden en kennissen.'
    example_gloss: Doei, tot snel!
  de.a1.unit01.lesson02.teach.auf_wiedersehen:
    title: Auf Wiedersehen
    gloss: tot ziens (formeel)
    note: '*Auf Wiedersehen* betekent letterlijk "tot we elkaar weer zien". Het is het standaard, formelere afscheid, passend bij onbekenden of in een zakelijke setting.'
  de.a1.unit01.lesson02.teach.bis_bald:
    title: Bis bald
    gloss: tot snel
    note: '*Bis bald* is een vriendelijke manier om afscheid te nemen als je de ander snel weer verwacht te zien.'
  de.a1.unit01.lesson02.teach.bis_spater:
    title: Bis später
    gloss: tot later
    note: '*Bis später* gebruik je als je de ander later op dezelfde dag weer ziet.'
  de.a1.unit01.lesson02.teach.gute_nacht:
    title: Gute Nacht
    gloss: goedenacht
    note: '*Gute Nacht* zeg je als iemand naar bed gaat of de dag afsluit. Anders dan *Guten Abend* is dit een afscheid, geen begroeting.'
  de.a1.unit01.lesson03.teach.sie:
    title: Sie
    gloss: u
    note: '*Sie* is het formele "u". Het wordt altijd met een hoofdletter geschreven, ook midden in een zin, en gebruikt tegenover onbekenden, ouderen of in formele situaties. Net als in het Nederlands bestaat dus het onderscheid tussen "u" en "jij", maar in het Duits is het gebruik van Sie strikter, en het werkwoord verandert mee.'
  de.a1.unit01.lesson03.teach.du:
    title: du
    gloss: jij / je
    note: '*du* is het informele "jij", dat je gebruikt tegen vrienden, familie en kinderen. *du* gebruiken tegen een onbekende kan te familiair of zelfs onbeleefd klinken.'
  de.a1.unit01.lesson03.teach.wie_geht_es_ihnen:
    title: Wie geht es Ihnen?
    gloss: Hoe gaat het met u?
    note: De formele manier om te vragen hoe het met iemand gaat. *Ihnen* is de formele datief van "u" en hoort bij het register van *Sie*.
  de.a1.unit01.lesson03.teach.wie_gehts:
    title: Wie geht's?
    gloss: Hoe gaat het? (informeel)
    note: '*Wie geht''s* is een samentrekking van *Wie geht es*. Het is de gewone, informele manier om te vragen hoe het met iemand gaat.'
  de.a1.unit01.lesson03.teach.gut_danke:
    title: Gut, danke.
    gloss: Goed, dank je.
    note: Een eenvoudig, neutraal antwoord dat je in beide registers kunt gebruiken.
  de.a1.unit01.lesson03.teach.sehr_gut_danke:
    title: Sehr gut, danke.
    gloss: Heel goed, dank je.
    note: Een enthousiaster antwoord dan *Gut, danke.*
  de.a1.unit01.lesson03.teach.und_ihnen:
    title: Und Ihnen?
    gloss: En met u?
    note: De formele manier om de vraag terug te stellen, passend bij het register van *Sie*.
  de.a1.unit01.lesson03.teach.und_dir:
    title: Und dir?
    gloss: En met jou?
    note: De informele manier om de vraag terug te stellen. *dir* is de informele datief van "jij" en hoort bij het register van *du*.
  de.a1.unit01.lesson04.teach.danke:
    title: Danke
    gloss: dank je / dank u
    note: '*Danke* kwam al voor in de eerdere antwoorden. Hier is het het losse woord op zich.'
    example_gloss: Hartelijk dank!
  de.a1.unit01.lesson04.teach.bitte:
    title: Bitte
    gloss: alsjeblieft / graag gedaan
    note: '*Bitte* heeft echt twee gangbare betekenissen, afhankelijk van de context: "alsjeblieft" bij een verzoek of "graag gedaan" als antwoord op een bedankje. De context laat zien welke bedoeld is. Het is geen toeval of fout: beide gebruiken zijn volkomen standaard.'
    example_gloss:
    - Een koffie, alsjeblieft.
    - Heel graag gedaan!
  de.a1.unit01.lesson04.teach.entschuldigung:
    title: Entschuldigung
    gloss: pardon / sorry
    note: '*Entschuldigung* gebruik je zowel om beleefd iemands aandacht te trekken als om kort je excuses aan te bieden.'
    example_gloss: Pardon, waar is het toilet?
  de.a1.unit01.lesson04.teach.kein_problem:
    title: Kein Problem
    gloss: geen probleem
    note: Een informeel, vriendelijk antwoord, vergelijkbaar in toon met het Nederlandse "geen probleem".
  de.a1.unit01.lesson04.teach.gern_geschehen:
    title: Gern geschehen
    gloss: graag gedaan
    note: Een vollere, explicietere manier om "graag gedaan" te zeggen dan het kortere *Bitte*.
  de.a1.unit01.lesson05.teach.line01:
    title: Anna begroet Felix
    gloss: 'Anna zegt: Goedendag!'
    note: Anna en Felix ontmoeten elkaar voor het eerst als buren in hun flatgebouw.
  de.a1.unit01.lesson05.teach.line02:
    title: Felix beantwoordt de groet en vraagt hoe het met haar gaat
    gloss: 'Felix zegt: Goedendag! Hoe gaat het met u?'
    note: Felix gebruikt het formele register met *Sie*, omdat ze elkaar net hebben leren kennen.
  de.a1.unit01.lesson05.teach.line03:
    title: Anna antwoordt en vraagt terug
    gloss: 'Anna zegt: Dank u, goed. En met u?'
    note: Anna antwoordt en stelt de vraag formeel terug, passend bij het register van Felix.
  de.a1.unit01.lesson05.teach.line04:
    title: Felix antwoordt
    gloss: 'Felix zegt: Heel goed, dank u.'
    note: Een iets enthousiaster antwoord dan een gewoon *Gut, danke.*
  de.a1.unit01.lesson05.teach.line05:
    title: Anna neemt afscheid
    gloss: 'Anna zegt: Tot ziens!'
    note: Anna gebruikt het formelere afscheid, passend bij het register van *Sie* dat ze steeds hebben gebruikt.
  de.a1.unit01.lesson05.teach.line06:
    title: Felix neemt afscheid en zegt tot snel
    gloss: 'Felix zegt: Tot ziens, tot snel!'
    note: Felix combineert het formele afscheid met "tot snel" en blijft zo in het register van *Sie* dat beide sprekers tijdens deze eerste ontmoeting hebben gebruikt.
