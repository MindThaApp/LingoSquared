    title: Du bist Felix.
    gloss: Jij bent Felix.
    note: '*bist* is de *du*-vorm van *sein*.'
  de.a1.unit02.lesson03.teach.deutschland:
    title: Deutschland
    gloss: Duitsland
    note: Landnamen hebben in het Duits meestal geen lidwoord – gewoon *Deutschland*, niet *das Deutschland*.
    example_gloss: Ik kom uit Duitsland.
  de.a1.unit02.lesson03.teach.england:
    title: England
    gloss: Engeland
    note: Het Duitse England is korter dan het Nederlandse 'Engeland' en wordt met Duitse klanken uitgesproken.
    example_gloss: Ik kom uit Engeland.
  de.a1.unit02.lesson03.teach.frankreich:
    title: Frankreich
    gloss: Frankrijk
    note: 'Let op: het Duitse woord wijkt af van het Franse *France*.'
