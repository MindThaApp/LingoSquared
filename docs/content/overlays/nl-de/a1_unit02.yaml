    gloss: Hoe heet je? (informeel)
    note: De informele versie, met *du* uit Unit 1.
  de.a1.unit02.lesson01.teach.ich_heisse_felix:
    title: Ich heiße Felix.
    gloss: Ik heet Felix.
    note: Dezelfde constructie als *Ich heiße Anna*, alleen met een andere naam.
  de.a1.unit02.lesson01.teach.freut_mich:
    title: Freut mich.
    gloss: Aangenaam.
    note: Een korte, gangbare manier om te zeggen dat je blij bent kennis te maken, in beide registers bruikbaar.
  de.a1.unit02.lesson01.teach.ganz_meinerseits:
    title: Ganz meinerseits.
    gloss: Insgelijks. / Het genoegen is aan mijn kant.
    note: Het natuurlijke antwoord op *Freut mich* – letterlijk 'geheel van mijn kant'.
  de.a1.unit02.lesson02.teach.ich:
    title: ich
    gloss: ik
    note: '*ich* schrijf je met een kleine letter, behalve aan het begin van een zin (zoals in *Ich bin Anna.*) – net als ik in het Nederlands.'
  de.a1.unit02.lesson02.teach.du:
    title: du
    gloss: jij/je (informeel)
    note: Al behandeld in Unit 1 – hier herhaald als onderwerp van een volledige zin.
  de.a1.unit02.lesson02.teach.ich_bin_anna:
    title: Ich bin Anna.
    gloss: Ik ben Anna.
    note: '*bin* is de *ich*-vorm van *sein* (zijn).'
