    gloss: En u? (formeel)
    note: Een korte manier om de vraag terug te stellen, passend bij het *Sie*-register.
  de.a1.unit02.lesson05.teach.line01:
    title: Felix begroet Anna
    gloss: 'Felix zegt: Goedendag!'
    note: Felix en Anna zijn buren die elkaar al eens eerder hebben ontmoet (Unit 1), maar nooit hun namen hebben uitgewisseld. Nu lopen ze elkaar weer tegen het lijf, dit keer bij de bushalte.
  de.a1.unit02.lesson05.teach.line02:
    title: Anna beantwoordt de groet en vraagt naar zijn naam
    gloss: 'Anna zegt: Goedendag! Hoe heet u?'
    note: Anna gebruikt het formele *Sie* en blijft dus in het register dat ze als vreemden in Unit 1 al hadden.
  de.a1.unit02.lesson05.teach.line03:
    title: Felix noemt zijn naam en vraagt hetzelfde terug
    gloss: 'Felix zegt: Ik heet Felix. En u?'
    note: Felix antwoordt en stelt de vraag formeel terug.
  de.a1.unit02.lesson05.teach.line04:
    title: Anna noemt haar naam
    gloss: 'Anna zegt: Ik heet Anna. Aangenaam.'
    note: Anna antwoordt op dezelfde manier en voegt de beleefdheidsformule toe.
  de.a1.unit02.lesson05.teach.line05:
    title: Felix antwoordt en vraagt waar ze vandaan komt
    gloss: 'Felix zegt: Insgelijks. Waar komt u vandaan?'
    note: Felix beantwoordt de beleefdheidsformule en brengt het gesprek op herkomst.
  de.a1.unit02.lesson05.teach.line06:
    title: Anna antwoordt en vraagt terug
    gloss: 'Anna zegt: Ik kom uit Duitsland. En u?'
    note: Hieruit blijkt dat Anna Duitse is, wat past bij twee buren in een Duitstalige stad.
  de.a1.unit02.lesson05.teach.line07:
    title: Felix antwoordt
    gloss: 'Felix zegt: Ik kom uit Engeland.'
    note: 'Nu weten we dat Felix uit Engeland komt: een Engelse buurman die in Duitsland woont.'
  de.a1.unit02.lesson05.teach.line08:
    title: Anna neemt afscheid
    gloss: 'Anna zegt: Tot ziens!'
    note: Het formele afscheid uit Unit 1, passend bij het *Sie*-register dat ze blijven gebruiken.
  de.a1.unit02.lesson05.teach.line09:
    title: Felix neemt afscheid
    gloss: 'Felix zegt: Tot ziens!'
    note: Felix sluit op dezelfde manier af en blijft in hetzelfde register als in de rest van dit gesprek.
  de.a1.unit02.lesson05.teach.steckbrief:
    title: Een kort schriftelijk profiel
    gloss: 'Naam: Felix. Land: Engeland.'
    note: 'Een eenvoudige profielkaart met een naam en één gegeven over de persoon: dezelfde informatie die Felix eerder in het gesprek hardop gaf.'
