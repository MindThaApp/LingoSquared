teaching:
  de.a1.unit56.lesson01.teach.das_tier_das:
    title: Dier, een huisdier
    gloss: het dier / een huisdier
    note: '*Tier* is het algemene woord voor dier; *Haustier* (letterlijk ''huisdier'') betekent specifiek een dier dat je als huisdier houdt.'
    example_gloss:
    - Een hond is een dier.
    - Een hond is ook een huisdier.
  de.a1.unit56.lesson01.teach.der_hund_die:
    title: Hond en kat
    gloss: de hond / de kat
    example_gloss:
    - Anna heeft een hond.
    - Jonas heeft een kat.
  de.a1.unit56.lesson01.teach.der_fisch_der:
    title: Vis en vogel
    gloss: de vis / de vogel
    example_gloss:
    - Opa heeft een vis.
    - Nina heeft een vogel.
  de.a1.unit56.lesson01.teach.hast_du_ein:
    title: Heb jij een huisdier?
    gloss: Heb jij een huisdier?
    note: 'Het vraagpatroon *Hast du ...?* ken je al uit eerdere lessen: het werkwoord staat voorop.'
  de.a1.unit56.lesson01.teach.ja_ich_habe:
    title: Ja, ik heb een hond
    gloss: Ja, ik heb een hond.
    note: Een eenvoudig bevestigend antwoord met de nieuwe woorden uit deze les.
  de.a1.unit56.lesson01.teach.nein_ich_habe:
    title: Nee, ik heb geen huisdier
    gloss: Nee, ik heb geen huisdier.
    note: '*Kein* ontkent het zelfstandig naamwoord *ein Haustier*: zie de grammaticanotitie.'
  de.a1.unit56.lesson01.teach.kein_sagt_nein:
    title: 'Kein: een zelfstandig naamwoord ontkennen'
    gloss: 'Kein zegt nee tegen een zelfstandig naamwoord dat ein- zou krijgen: Ich habe einen Hund, maar Ich habe kein Haustier.'
    note: '*Kein* vervangt *ein* in een ontkennende zin en krijgt dezelfde uitgangen: ein Haustier wordt kein Haustier, einen Hund wordt keinen Hund. Bij werkwoorden en bijvoeglijke naamwoorden gebruik je *nicht*.'
  de.a1.unit56.lesson02.teach.ausfuehren:
    title: Een dier uitlaten
    gloss: uitlaten (een dier)
    note: 'Een scheidbaar werkwoord: zie de grammaticanotitie.'
    example_gloss: Ik laat de hond elke dag uit.
  de.a1.unit56.lesson02.teach.ausfuehren_ist_trennbar:
    title: Ausführen is scheidbaar
    gloss: 'Ausführen is scheidbaar, net als aufstehen: ich führe den Hund aus.'
    note: Hier geldt precies hetzelfde patroon voor scheidbare werkwoorden (stam + ... + voorvoegsel aan het eind) als bij de werkwoorden voor de dagelijkse routine.
  de.a1.unit56.lesson02.teach.futter_geben:
    title: Voeren
    gloss: voeren
    example_gloss: Ik geef de kat elke dag te eten.
  de.a1.unit56.lesson02.teach.spielen_mit:
    title: Spelen met
    gloss: spelen met
    example_gloss: Jonas speelt met zijn kat.
  de.a1.unit56.lesson02.teach.ich_fuehre_den:
    title: Ik laat de hond elke dag uit
    gloss: Ik laat de hond elke dag uit.
    note: Combineert *ausführen* met *jeden Tag* (elke dag). *Jeden* eindigt op -en omdat Tag mannelijk is en in de accusatief staat.
  de.a1.unit56.lesson02.teach.ich_gebe_der:
    title: Ik geef de kat elke dag te eten
    gloss: Ik geef de kat elke dag te eten.
    note: 'Combineert *Futter geben* met *jeden Tag*. Het dier staat in de datief: der Katze (aan de kat).'
  de.a1.unit56.lesson03.teach.den_plural_lernst:
    title: 'Plural: Hund -> Hunde'
    gloss: 'Duitse meervouden verschillen per woord: der Hund -> die Hunde, die Katze -> die Katzen, der Vogel -> die Vögel. Leer het meervoud bij elk zelfstandig naamwoord mee.'
    note: 'Duitse meervoudsvormen zijn niet altijd te voorspellen. Hier zie je ze voor het eerst, met dierennamen als voorbeeld: -e, -n en een umlaut.'
  de.a1.unit56.lesson03.teach.hunde_katzen:
    title: Honden en katten
    gloss: honden / katten
    example_gloss:
    - Felix houdt van honden.
    - Lena houdt van katten.
  de.a1.unit56.lesson03.teach.fische_voegel:
    title: Vissen en vogels (meervoud)
    gloss: vissen / vogels
    example_gloss:
    - Ik hou van vissen.
    - Opa houdt van vogels.
  de.a1.unit56.lesson03.teach.ich_liebe_tiere:
    title: Ik hou van dieren
    gloss: Ik hou van dieren.
    note: '*Lieben* (houden van) krijgt zijn object direct, zonder voorzetsel: ich liebe Tiere.'
  de.a1.unit56.lesson03.teach.lena_liebt_katzen:
    title: Lena houdt van katten, maar heeft geen huisdier
    gloss: Lena houdt van katten, maar ze heeft geen huisdier.
    note: Bereidt het contrast voor waar de leestekst van deze les om draait.
  de.a1.unit56.lesson04.teach.felix_hast_du:
    title: Felix vraagt naar een huisdier
    gloss: 'Felix: Heb jij een huisdier, Anna?'
  de.a1.unit56.lesson04.teach.anna_ja_ich:
    title: Anna heeft een hond
    gloss: 'Anna: Ja, ik heb een hond.'
  de.a1.unit56.lesson04.teach.felix_wie_sieht:
    title: Felix vraagt hoe hij eruitziet
    gloss: 'Felix: Hoe ziet hij eruit?'
    note: 'Hier komt de vraag *Wie sieht ... aus?* uit de les over uiterlijk terug, nu gesteld over een dier: wie sieht er aus?'
  de.a1.unit56.lesson04.teach.anna_er_hat:
    title: Anna beschrijft haar hond
    gloss: 'Anna: Hij heeft een bruine vacht en hij is klein.'
    note: Hier komen de woorden voor haarkleur en grootte uit de les over uiterlijk terug, nu om de vacht van een dier te beschrijven in plaats van het haar van een persoon.
  de.a1.unit56.lesson04.teach.bei_tieren_zaehlt:
    title: Er/ihn bij dieren
    gloss: 'Bij dieren bepaalt het geslacht van het woord het voornaamwoord: der Hund is er (hij), die Katze is sie (zij).'
    note: 'Duitse voornaamwoorden volgen het grammaticale geslacht van het zelfstandig naamwoord: der Hund -> er (accusatief: ihn), die Katze -> sie, das Tier -> es.'
  de.a1.unit56.lesson04.teach.felix_fuehrst_du:
    title: Felix vraagt naar het uitlaten
    gloss: 'Felix: Laat jij hem elke dag uit?'
  de.a1.unit56.lesson04.teach.anna_ja_ich_2:
    title: Anna vertelt over haar routine
    gloss: 'Anna: Ja, ik laat hem elke dag uit en ik geef hem te eten.'
  de.a1.unit56.lesson05.teach.felix_und_lena:
    title: Felix, Lena en Jonas over dieren
    gloss: 'Felix en Lena houden allebei van dieren, maar geen van beiden heeft een huisdier. Felix houdt van honden en Lena houdt van katten. Jonas heeft wel een huisdier: een kat. Hij speelt vaak met zijn kat en geeft de kat elke dag te eten. Heb jij een huisdier?'
    note: 'Zet van dieren houden tegenover er echt een hebben: dat is het communicatieve doel van deze les.'
    glosses:
      lieben: houden van
      beide: beide
      Tiere: dieren
      beiden: beide
      Haustier: huisdier
      Hunde: honden
      Katzen: katten
      Katze: kat
      spielt: speelt
      gibt: geeft
      jeden: elke
      Futter: voer
  de.a1.unit56.lesson05.teach.jonas_spielt_oft:
    title: Jonas speelt vaak met zijn kat
    gloss: Jonas speelt vaak met zijn kat.
    note: '*Oft* staat meestal direct na het werkwoord: Jonas spielt oft mit seiner Katze.'
  de.a1.unit56.lesson05.teach.ich_liebe_hunde:
    title: Ik hou van honden. Ik heb geen huisdier.
    gloss: Ik hou van honden. Ik heb geen huisdier.
    note: Een voorbeeldantwoord van twee zinnen, dat je kunt hergebruiken voor de schrijfopdracht van deze les.
  de.a1.unit56.lesson06.teach.anna_nina_hast:
    title: Anna vraagt het aan Nina
    gloss: 'Anna: Nina, heb jij ook een huisdier?'
  de.a1.unit56.lesson06.teach.nina_ja_ich:
    title: Nina heeft een vogel die Pico heet
    gloss: 'Nina: Ja, ik heb een vogel. Hij heet Pico.'
    note: '*Er heißt Pico* gebruikt het werkwoord *heißen* uit de allereerste les. Er verwijst naar der Vogel.'
  de.a1.unit56.lesson06.teach.felix_wie_schoen:
    title: Felix reageert
    gloss: 'Felix: Wat leuk! Wat doe je elke dag met hem?'
  de.a1.unit56.lesson06.teach.nina_ich_gebe:
    title: Nina geeft hem elke dag te eten
    gloss: 'Nina: Ik geef hem elke dag te eten.'
  de.a1.unit56.lesson06.teach.felix_ich_liebe:
    title: Felix houdt ook van vogels
    gloss: 'Felix: Ik hou ook van vogels.'
  de.a1.unit56.lesson06.teach.anna_schoen_dass:
    title: Anna rondt het gesprek af
    gloss: 'Anna: Fijn dat wij alle drie van dieren houden!'
    note: Rondt het gesprek af met wat alle drie de personages in deze les over dieren hebben verteld.
