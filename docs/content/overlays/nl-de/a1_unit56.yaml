course:
  title: Duits A1
  description: 'Duits voor beginners over huisdieren en veelvoorkomende dieren: ze benoemen, basisverzorging (uitlaten, voeren, spelen), zeggen van welke dieren je houdt, ook als je er zelf geen hebt, en het regelmatige Duitse meervoud.'
