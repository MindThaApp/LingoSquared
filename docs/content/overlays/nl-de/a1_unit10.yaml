units:
  de.a1.unit10.wegbeschreibungen:
    title: De weg vragen en de weg wijzen
teaching:
  de.a1.unit10.lesson01.teach.links_abbiegen:
    title: Biegen Sie links ab.
    gloss: Slaat u linksaf.
    note: '*abbiegen* (afslaan) is een scheidbaar werkwoord, net als in het Nederlands: het voorvoegsel *ab* gaat helemaal naar het eind van de zin: *Biegen Sie... ab*, niet *Sie biegen ab* of *Abbiegen Sie*.'
  de.a1.unit10.lesson01.teach.rechts_abbiegen:
    title: Biegen Sie rechts ab.
    gloss: Slaat u rechtsaf.
    note: Hetzelfde patroon van het scheidbare werkwoord als bij *links abbiegen*, nu met *rechts*.
  de.a1.unit10.lesson01.teach.geradeaus_gehen:
    title: Gehen Sie geradeaus.
    gloss: Gaat u rechtdoor.
    note: '*geradeaus* betekent ''rechtdoor'': hier is geen scheidbaar voorvoegsel, dus de beleefde gebiedende wijs is eenvoudiger.'
  de.a1.unit10.lesson01.teach.hier_anhalten:
    title: Halten Sie hier an.
    gloss: Stopt u hier.
    note: '*anhalten* (stoppen) is ook scheidbaar: *an* gaat naar het eind, hetzelfde patroon als bij *abbiegen*.'
  de.a1.unit10.lesson01.teach.ecke:
    title: Ecke
    gloss: hoek
    note: '*Ecke* betekent hoek: een vrouwelijk woord, *die Ecke*.'
    example_gloss: Sla op de hoek linksaf.
  de.a1.unit10.lesson02.teach.wie_komme_ich_zur_bank:
    title: Wie komme ich zur Bank?
    gloss: Hoe kom ik bij de bank?
    note: '*zur* is de samentrekking van *zu der* (datief vrouwelijk, die Bank): hetzelfde samentrekkingspatroon als *vom* (von + dem) uit Les 9.'
  de.a1.unit10.lesson02.teach.geradeaus_dann_links:
    title: Gehen Sie geradeaus, dann biegen Sie an der Ecke links ab.
    gloss: Gaat u rechtdoor en sla dan op de hoek linksaf.
    note: '*dann* (dan) verbindt twee stappen van de route; *an der Ecke* (op de hoek) heeft het vrouwelijke datiefartikel, zoals bij de plaatsvoorzetsels uit Les 9.'
  de.a1.unit10.lesson02.teach.ist_es_weit:
    title: Ist es weit?
    gloss: Is het ver?
    note: '*weit* betekent ver.'
  de.a1.unit10.lesson02.teach.zwei_minuten:
    title: Es ist nur zwei Minuten von hier.
    gloss: Het is maar twee minuten hiervandaan.
    note: '*nur* betekent ''maar'' of ''slechts''.'
  de.a1.unit10.lesson02.teach.nicht_verfehlen:
    title: Das können Sie nicht verfehlen.
    gloss: Dat kunt u niet missen.
    note: '*verfehlen* betekent ''missen'' (niet vinden): letterlijk ''Dat kunt u niet missen'', met het werkwoord können op de tweede plaats.'
  de.a1.unit10.lesson03.teach.erste_strasse:
    title: Nehmen Sie die erste Straße links.
    gloss: Neem de eerste straat links.
    note: '*erste* betekent ''eerste'': een rangtelwoord, net als in het Nederlands.'
  de.a1.unit10.lesson03.teach.zweite_strasse:
    title: Nehmen Sie die zweite Straße rechts.
    gloss: Neem de tweede straat rechts.
    note: '*zweite* betekent ''tweede''.'
  de.a1.unit10.lesson03.teach.route_text:
    title: Wegbeschreibung zur Apotheke
    gloss: De route naar de apotheek
    note: Een korte geschreven routebeschrijving met meerdere zinnen die je al kent.
  de.a1.unit10.lesson04.teach.line01:
    title: Felix vraagt de weg
    gloss: 'Felix: Pardon, hoe kom ik bij de bank?'
    note: Dezelfde beleefde opening als in Les 9, maar nu vraag je naar een route in plaats van alleen naar een plek.
  de.a1.unit10.lesson04.teach.line02:
    title: Anna wijst de route
    gloss: 'Anna: Gaat u rechtdoor en sla dan op de hoek linksaf.'
    note: Een volledig antwoord verbindt twee stappen met *dann*.
  de.a1.unit10.lesson04.teach.line03:
    title: Felix bevestigt en vraagt verder
    gloss: 'Felix: Op de hoek linksaf, goed. Is het ver?'
    note: Felix herhaalt de route om te checken of hij het begrepen heeft en stelt dan een logische vervolgvraag.
  de.a1.unit10.lesson04.teach.line04:
    title: Anna antwoordt hoe ver het is
    gloss: 'Anna: Nee, het is maar twee minuten hiervandaan. U kunt het niet missen.'
    note: Een volledig, geruststellend antwoord.
