course:
  title: Duits A1
  description: 'Duits voor beginners om het uiterlijk van een persoon te beschrijven: indrukken van lengte en leeftijd, haar- en oogkleur, de kernvraag Wie sieht ... aus? en het vergelijken van het uiterlijk van twee mensen.'
units:
  de.a1.unit55.aussehen:
    title: Uiterlijk beschrijven
lessons:
  de.a1.unit55.lesson01.gross_klein_alt_und:
    title: Lang, klein, oud en jong
  de.a1.unit55.lesson02.haare_beschreiben:
    title: Haar beschrijven
  de.a1.unit55.lesson03.augen_und_wie_jemand:
    title: Ogen en hoe ziet iemand eruit?
  de.a1.unit55.lesson04.anna_beschreibt_nina:
    title: Anna beschrijft Nina
  de.a1.unit55.lesson05.jonas_und_lena_im:
    title: Jonas en Lena vergelijken
  de.a1.unit55.lesson06.felix_erkennt_nina:
    title: Felix herkent Nina
teaching:
  de.a1.unit55.lesson01.teach.gross_klein:
    title: Lang en klein
    gloss: lang / klein
    note: '*Groß* beschrijft een lange persoon en *klein* een kleine. Let op: bij mensen zegt het Duits groß en niet lang, terwijl je in het Nederlands wel ''lang'' zegt.'
    example_gloss:
    - Lena is lang.
    - Jonas is klein.
  de.a1.unit55.lesson01.teach.alt_jung:
    title: Oud en jong
    gloss: oud / jong
    note: '*Alt* en *jung* beschrijven hier een algemene indruk van leeftijd, geen exact aantal jaren.'
    example_gloss:
    - Opa is oud.
    - Felix is jong.
  de.a1.unit55.lesson01.teach.alt_kann_eine:
    title: 'Alt: een getal of een indruk'
    gloss: Alt kan bij een aantal jaren staan, zoals in Ich bin dreißig Jahre alt, of een algemene indruk geven, zoals in Opa ist alt.
    note: Naar iemands exacte leeftijd vraag je met *Wie alt bist du?* Hier beschrijft *alt* hoe oud iemand ERUITZIET, zonder getal.
  de.a1.unit55.lesson01.teach.lena_ist_gross:
    title: Lena is lang en Jonas is klein
    gloss: Lena is lang en Jonas is klein.
    note: Een eenvoudige samengestelde zin met *und* (en), als voorbereiding op de directe vergelijking in les 05.
  de.a1.unit55.lesson02.teach.die_haare:
    title: Haar
    gloss: het haar
    note: '*Haare* is een meervoudsvorm: *die Haare*. Het Duits kent ook het enkelvoud das Haar, maar voor het haar op je hoofd zegt men meestal Haare. In het Nederlands gebruik je hiervoor juist het enkelvoud ''haar''.'
    example_gloss: Felix heeft kort zwart haar.
  de.a1.unit55.lesson02.teach.blond_braun_grau:
    title: Blond, bruin en grijs
    gloss: blond / bruin / grijs
    note: 'Drie haarkleuren: blond, braun, grau. Vóór een meervoudig zelfstandig naamwoord zonder lidwoord krijgen ze de uitgang -e: blonde, braune, graue Haare.'
    example_gloss:
    - Anna heeft blond haar.
    - Jonas heeft bruin haar.
    - Opa heeft grijs haar.
  de.a1.unit55.lesson02.teach.lang_kurz:
    title: Lang en kort (haar)
    gloss: lang / kort (haar)
    note: '*Kurz* (kort) en *lang* (lang) beschrijven de haarlengte. Weer de uitgang -e: kurze Haare, lange Haare.'
    example_gloss:
    - Lena heeft lang haar.
    - Jonas heeft kort haar.
  de.a1.unit55.lesson02.teach.haare_ist_plural:
    title: Haare krijgt de uitgang -e
    gloss: 'Haare is meervoud en heeft geen lidwoord, dus het bijvoeglijk naamwoord eindigt op -e: kurze Haare, lange Haare, blonde Haare, braune Haare, graue Haare, schwarze Haare.'
    note: Zonder lidwoord krijgt een bijvoeglijk naamwoord vóór een meervoudig zelfstandig naamwoord de uitgang -e. Het patroon is hetzelfde als bij *Augen* in les 03.
  de.a1.unit55.lesson02.teach.anna_hat_lange:
    title: 'Ihre: haar'
    gloss: 'Ihre betekent hier ''haar'': ihre Haare = haar haren. Anna heeft lang haar, en haar haar is blond.'
    note: '*Ihre* (met kleine i) is het bezittelijk voornaamwoord ''haar'' en congrueert met het meervoud Haare. Met een hoofdletter I betekent *Ihre* ''uw'' (beleefdheidsvorm).'
  de.a1.unit55.lesson02.teach.felix_hat_kurze:
    title: Felix heeft kort zwart haar
    gloss: Felix heeft kort zwart haar.
    note: 'Hergebruikt *schwarz* (zwart), nu voor haar: schwarze Haare.'
  de.a1.unit55.lesson02.teach.anna_hat_lange_2:
    title: Anna heeft lang blond haar
    gloss: Anna heeft lang blond haar.
    note: Combineert de woorden voor lengte en kleur uit deze les in één natuurlijke zin.
  de.a1.unit55.lesson03.teach.die_augen:
    title: Ogen
    gloss: de ogen
    note: '*Augen* is het meervoud van *das Auge*. Het Duits gebruikt meestal het meervoud, omdat we twee ogen hebben.'
    example_gloss: Felix heeft bruine ogen.
  de.a1.unit55.lesson03.teach.blau_braun_gruen:
    title: Blauw, bruin en groen
    gloss: blauw / bruin / groen
    note: 'Kleuren: blau (blauw), braun (bruin) en grün (groen).'
    example_gloss:
    - Anna heeft blauwe ogen.
    - Jonas heeft bruine ogen.
    - Lena heeft groene ogen.
  de.a1.unit55.lesson03.teach.augen_ist_plural:
    title: Augen krijgt -e
    gloss: 'Augen is meervoud, dus het bijvoeglijk naamwoord eindigt op -e: blaue Augen, braune Augen, grüne Augen.'
    note: 'Dezelfde regel als bij Haare: geen lidwoord plus een meervoudig zelfstandig naamwoord geeft de uitgang -e.'
  de.a1.unit55.lesson03.teach.wie_sieht_anna:
    title: Hoe ziet Anna eruit?
    gloss: Hoe ziet Anna eruit?
    note: '*Wie sieht ... aus?* is de kernvraag van deze unit. *Aussehen* is een scheidbaar werkwoord: sieht ... aus.'
  de.a1.unit55.lesson03.teach.anna_hat_lange:
    title: Anna heeft lang blond haar en blauwe ogen
    gloss: Anna heeft lang blond haar en blauwe ogen.
    note: Een voorbeeldantwoord dat haar en ogen met *und* in één zin combineert.
  de.a1.unit55.lesson04.teach.anna_ein_neues:
    title: Anna stelt Nina voor
    gloss: 'Anna: Er komt een nieuw meisje naar het taalcafé. Ze heet Nina.'
    note: '*Ein neues Mädchen kommt* introduceert iemand nieuws. Na *kommt* staat de richting *ins* (in das) Sprachcafé in de accusatief.'
  de.a1.unit55.lesson04.teach.felix_okay_wie:
    title: Felix vraagt hoe ze eruitziet
    gloss: 'Felix: Oké! Hoe ziet ze eruit?'
    note: 'Hergebruikt de kernvraag van deze unit, nu met *sie* (ze) in plaats van een naam: wie sieht sie aus?'
  de.a1.unit55.lesson04.teach.anna_sie_ist:
    title: Anna beschrijft de lengte en het haar van Nina
    gloss: 'Anna: Ze is klein en heeft kort blond haar.'
    note: 'Combineert *klein* met de haarwoordenschat uit les 02. De tweede *sie* wordt weggelaten: sie ist klein und hat ...'
  de.a1.unit55.lesson04.teach.felix_und_ihre:
    title: Felix vraagt naar haar ogen
    gloss: 'Felix: En haar ogen?'
    note: '*Ihre* betekent hier ''haar'' (bezittelijk), geen vorm van ''u''. Het past bij het meervoud Augen.'
  de.a1.unit55.lesson04.teach.anna_sie_hat:
    title: Anna beschrijft de ogen van Nina
    gloss: 'Anna: Ze heeft groene ogen.'
    note: Hergebruikt *grüne Augen* uit les 03.
  de.a1.unit55.lesson04.teach.felix_danke_dann:
    title: Felix zal haar herkennen
    gloss: 'Felix: Bedankt! Dan herken ik haar vast.'
    note: '*Dann erkenne ich sie bestimmt* betekent ''dan herken ik haar vast''. Na *dann* staat het werkwoord op de tweede plaats: dann erkenne ich sie.'
  de.a1.unit55.lesson05.teach.jonas_und_lena:
    title: Jonas en Lena vergeleken
    gloss: Jonas en Lena zijn broer en zus, maar ze zien er verschillend uit. Jonas is klein en heeft kort bruin haar en bruine ogen. Lena is groter dan Jonas en heeft lang bruin haar en groene ogen. Hoe zie jij eruit?
    note: Een korte vergelijking met alle kleur- en lengtewoorden die tot nu toe zijn geleerd, met als slot de kernvraag van de unit aan de lezer.
    glosses:
      Bruder: broer
      Schwester: zus
      sehen: eruitzien
      unterschiedlich: verschillend
      klein: kort
      kurze: kort
      braune: bruin
      Haare: haar
      Augen: ogen
      größer: groter
      lange: lang
      grüne: groen
      aus: (deel van 'aussehen' = eruitzien)
  de.a1.unit55.lesson05.teach.das_muster_kennst:
    title: De vergelijkende trap nog eens
    gloss: 'Je kent het patroon al: bijvoeglijk naamwoord + -er + als (dan). Hier gebruik je het voor personen: Lena is groter dan Jonas.'
    note: 'Hetzelfde patroon *-er + als* als in de unit over vergelijkingen. Groß wordt größer: de klinker krijgt een umlaut.'
  de.a1.unit55.lesson05.teach.lena_hat_laengere:
    title: Lena heeft langer haar dan Jonas
    gloss: Lena heeft langer haar dan Jonas.
    note: '*Längere Haare*: länger krijgt -e voor een meervoudig zelfstandig naamwoord zonder lidwoord, en lang krijgt in de vergelijkende trap een umlaut.'
  de.a1.unit55.lesson05.teach.ich_habe_kurze:
    title: Ik heb kort bruin haar
    gloss: Ik heb kort bruin haar.
    note: Een voorbeeldzin in de ik-vorm met *Ich habe ...*, handig om je eigen uiterlijk te beschrijven.
  de.a1.unit55.lesson06.teach.felix_schau_mal:
    title: Felix ziet Nina
    gloss: 'Felix: Kijk, is dat Nina? Ze heeft kort blond haar en groene ogen.'
    note: '*Schau mal* (kijk eens) is een vriendelijke manier om iets aan te wijzen. Het is de gebiedende wijs van du.'
  de.a1.unit55.lesson06.teach.anna_ja_das:
    title: Anna bevestigt het
    gloss: 'Anna: Ja, dat is Nina!'
    note: Een korte, natuurlijke bevestiging.
  de.a1.unit55.lesson06.teach.nina_hallo_bist:
    title: Nina begroet Felix
    gloss: 'Nina: Hoi, ben jij Felix?'
    note: 'Een eenvoudige informele vraag: *bist du ...?* (ben jij ...?). Bist is de du-vorm van sein.'
  de.a1.unit55.lesson06.teach.felix_ja_freut:
    title: Felix begroet Nina terug
    gloss: 'Felix: Ja! Aangenaam, Nina.'
    note: '*Freut mich* is de standaarduitdrukking bij een eerste kennismaking, zoals in unit 2. Tegen iemand die je al kent zeg je *Schön, dich zu sehen*.'
  de.a1.unit55.lesson06.teach.nina_freut_mich:
    title: Nina beantwoordt de begroeting
    gloss: 'Nina: Aangenaam!'
    note: 'Sluit de dialoog af: Felix heeft Nina herkend aan de beschrijving van Anna.'
