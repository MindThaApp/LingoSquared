    title: Bauchschmerzen
    gloss: buikpijn
    note: '*Bauch* is buik; *Schmerzen* betekent pijn.'
    example_gloss: Ik heb buikpijn.
  de.a1.unit17.lesson01.teach.hals:
    title: Hals
    gloss: keel / nek
    note: '*Hals* kan keel of nek betekenen, afhankelijk van de context.'
    example_gloss: Mijn keel doet pijn.
  de.a1.unit17.lesson01.teach.weh:
    title: Mein Kopf tut weh.
    gloss: Mijn hoofd doet pijn.
    note: 'In het Duits ''doet'' het lichaamsdeel pijn: *tut weh*. In het Nederlands zeg je meestal dat iets ''pijn doet'', net zo.'
    example_gloss: Mijn buik doet pijn.
  de.a1.unit17.lesson01.teach.mir_ist_schlecht:
    title: Mir ist schlecht.
    gloss: Ik voel me misselijk.
    note: Vertaal dit niet woord voor woord als 'ik ben slecht'; *Mir ist schlecht* is de natuurlijke uitdrukking.
    example_gloss: Ik voel me misselijk; ik heb buikpijn.
  de.a1.unit17.lesson02.teach.brauchen_sie_hilfe:
    title: Brauchen Sie Hilfe?
    gloss: Heeft u hulp nodig?
    note: De beleefdheidsvorm *Sie* houdt de vraag beleefd.
  de.a1.unit17.lesson02.teach.ich_brauche:
    title: Ich brauche Wasser.
    gloss: Ik heb water nodig.
    note: '*brauche* betekent ''nodig hebben'', niet ''gebruiken''.'
    example_gloss: 'In context: ik heb water en een pauze nodig.'
  de.a1.unit17.lesson02.teach.pause:
    title: Pause
    gloss: pauze
    note: '*eine Pause* is een korte rust of pauze.'
    example_gloss: Ik heb een pauze nodig.
  de.a1.unit17.lesson02.teach.health_instruction:
    title: Trinken Sie Wasser.
    gloss: Drink water. Neem een pauze.
    note: De beleefdheidsvorm *Sie* houdt de opdracht beleefd.
    example_gloss: Neem een pauze.
  de.a1.unit17.lesson02.teach.gesundheit_text:
    title: Annas Problem
    gloss: Anna's probleem
    note: De korte tekst noemt het symptoom en wat er direct nodig is.
    example_gloss: Ze heeft water nodig.
  de.a1.unit17.lesson02.teach.line01:
    title: Felix vraagt hoe het met Anna gaat
    gloss: 'Felix: Anna, gaat het goed met u?'
    note: Felix gebruikt de beleefde vorm *Ihnen* tegen Anna.
  de.a1.unit17.lesson02.teach.line02:
    title: Anna noemt het probleem
    gloss: 'Anna: Nee, ik heb hoofdpijn.'
    note: Het antwoord noemt het symptoom heel direct.
  de.a1.unit17.lesson02.teach.line03:
    title: Felix biedt hulp aan
    gloss: 'Felix: Heeft u hulp nodig?'
    note: Een eenvoudig aanbod van hulp.
