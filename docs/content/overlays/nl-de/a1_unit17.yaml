    gloss: 'Anna: Ja, graag. Ik heb water en een pauze nodig.'
    note: Het antwoord begint met *Ja, bitte* en noemt wat ze direct nodig heeft.
    example_gloss: 'In context: ik heb water en een pauze nodig.'
