course:
  title: Duits A1
  description: 'Duits voor beginners om je vrijetijdsbesteding te beschrijven: hobbywoordenschat, uitdrukkingen voor hoe vaak je iets doet, vragen en antwoorden wat iemand in zijn vrije tijd doet en de hobby''s van twee mensen vergelijken.'
