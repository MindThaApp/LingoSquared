teaching:
  de.a1.unit54.lesson01.teach.lesen_sport_treiben:
    title: Lezen, sporten, koken
    gloss: lezen, sporten, koken
    note: 'Drie veelgebruikte hobbywerkwoorden: *lesen* (lezen), *Sport treiben* (sporten) en *kochen* (koken). Sport is een zelfstandig naamwoord en wordt dus met een hoofdletter geschreven.'
    example_gloss:
    - Ik lees graag een boek.
    - Ik sport op zaterdag.
    - Ik kook graag voor vrienden.
  de.a1.unit54.lesson01.teach.die_freizeit:
    title: Vrije tijd
    gloss: vrije tijd
    note: '*Die Freizeit* is een vrouwelijk zelfstandig naamwoord: leer het altijd met het lidwoord die. Het is het sleutelwoord om over hobby''s te praten.'
    example_gloss: In mijn vrije tijd lees ik graag.
  de.a1.unit54.lesson01.teach.in_meiner_freizeit:
    title: Zeggen wat je in je vrije tijd doet
    gloss: In mijn vrije tijd lees ik graag.
    note: '*Lese* is de ich-vorm van *lesen* (lezen). De zin begint met een tijdsaanduiding, maar het werkwoord blijft op de tweede plaats: in meiner Freizeit lese ich gern.'
  de.a1.unit54.lesson02.teach.musik_hoeren_zeichnen:
    title: Muziek, tekenen, gamen
    gloss: naar muziek luisteren, tekenen, gamen
    note: 'Nog drie hobby-uitdrukkingen: *Musik hören* (naar muziek luisteren), *zeichnen* (tekenen) en *Videospiele spielen* (videogames spelen). Musik en Videospiele zijn zelfstandige naamwoorden, dus ze krijgen een hoofdletter.'
    example_gloss:
    - Ik luister graag naar muziek.
    - Ik teken vaak.
    - Ik game graag met vrienden.
  de.a1.unit54.lesson02.teach.ich_hoere_gern:
    title: Zeggen dat je graag naar muziek luistert
    gloss: Ik luister graag naar muziek.
    note: Het Duits zegt *Musik hören* zonder voorzetsel, terwijl je in het Nederlands 'naar muziek luisteren' zegt, met 'naar'.
  de.a1.unit54.lesson02.teach.ich_spiele_gern:
    title: Zeggen dat je graag met vrienden gamet
    gloss: Ik game graag met vrienden.
    note: '*Mit Freunden* (met vrienden): na mit staat altijd de datief, daarom wordt Freunde Freunden.'
  de.a1.unit54.lesson03.teach.immer_oft_manchmal:
    title: Altijd, vaak, soms, nooit
    gloss: altijd, vaak, soms, nooit
    note: 'De vier belangrijkste frequentiebijwoorden: immer, oft, manchmal, nie. Ze staan meestal direct na het werkwoord: ich spiele nie.'
    example_gloss:
    - Ik sport altijd op zaterdag.
    - Ik lees vaak een boek.
    - Ik teken soms.
    - Ik game nooit.
  de.a1.unit54.lesson03.teach.jede_woche_jedes:
    title: Elke week, elk weekend
    gloss: elke week, elk weekend
    note: '*Jede Woche* en *jedes Wochenende* betekenen allebei ''elke'', maar de uitgang verandert met het geslacht van het zelfstandig naamwoord: zie de volgende kaart.'
    example_gloss:
    - Ik kook elke week voor vrienden.
    - Ik sport elk weekend.
  de.a1.unit54.lesson03.teach.die_woche_jede:
    title: Jede of jedes
    gloss: Die Woche is vrouwelijk, dus jede Woche. Das Wochenende is onzijdig, dus jedes Wochenende.
    note: '*Woche* is vrouwelijk (*die Woche*) en krijgt dus *jede*; *Wochenende* is onzijdig (*das Wochenende*) en krijgt dus *jedes*. Leer elk zelfstandig naamwoord met zijn lidwoord, dan ken je de uitgang.'
  de.a1.unit54.lesson03.teach.was_machst_du:
    title: Vragen naar vrije tijd
    gloss: Wat doe je in je vrije tijd?
    note: 'Dit is de kernvraag van deze unit: gebruik hem om iedereen naar zijn of haar hobby''s te vragen.'
  de.a1.unit54.lesson04.teach.anna_wir_gehen:
    title: Anna begint over hobby's
    gloss: 'Anna: We gaan vaak samen wandelen. Maar wat doe jij verder nog in je vrije tijd, Felix?'
    note: '*Wir gehen oft zusammen spazieren* gebruikt gehen plus een tweede werkwoord: het vervoegde werkwoord gehen staat op de tweede plaats, de infinitief spazieren komt aan het eind.'
  de.a1.unit54.lesson04.teach.felix_ich_koche:
    title: Felix' hobby's
    gloss: 'Felix: Ik kook graag, ook thuis. En ik sport vaak.'
    note: '*Auch zu Hause* (ook thuis) maakt duidelijk dat Felix voor zijn plezier kookt, en niet alleen in zijn baan in het restaurant.'
  de.a1.unit54.lesson04.teach.anna_kochst_du:
    title: Anna is verrast
    gloss: 'Anna: Kook je ook thuis? Je kookt toch al de hele dag op je werk!'
    note: '*Den ganzen Tag* (de hele dag) staat in de accusatief, daarom wordt der Tag den Tag. Tijdsduur staat in de accusatief.'
  de.a1.unit54.lesson04.teach.felix_ja_aber:
    title: Felix legt uit
    gloss: 'Felix: Ja, maar koken vind ik ontspannend. En jij, wat doe jij graag?'
    note: '*Kochen finde ich entspannend* zet Kochen voorop om de nadruk te leggen. Het werkwoord blijft op de tweede plaats, dus ich komt erachter.'
  de.a1.unit54.lesson04.teach.anna_ich_lese:
    title: Anna's hobby's
    gloss: 'Anna: Ik lees graag en ik luister vaak naar muziek.'
    note: Combineert twee hobbywerkwoorden uit les 1-2 in één zin met *und* (en).
  de.a1.unit54.lesson04.teach.felix_spielst_du:
    title: Felix vraagt naar gamen
    gloss: 'Felix: Game jij ook?'
    note: 'Een korte ja/nee-vraag: het werkwoord staat vooraan, spielst du ...?'
  de.a1.unit54.lesson04.teach.anna_nein_ich:
    title: Anna antwoordt
    gloss: 'Anna: Nee, ik game nooit. Maar ik teken soms!'
    note: '*Nie* (nooit) en *manchmal* (soms) uit les 3, tegenover elkaar in één antwoord. Beide staan direct na het werkwoord.'
  de.a1.unit54.lesson05.teach.felix_und_ich:
    title: Hobby's vergelijken
    gloss: Felix en ik gaan vaak samen wandelen. Maar we hebben ook andere hobby's. Felix kookt graag, ook thuis, en hij sport vaak. Ik lees graag en ik luister vaak naar muziek. Ik teken soms, maar ik game nooit. Wat doe jij graag in je vrije tijd?
    note: Anna's bericht herhaalt feiten uit les 4 en eindigt met de kernvraag van de unit aan de lezer.
    glosses:
      spazieren: wandelen
      oft: vaak
      zusammen: samen
      andere: andere
      kocht: kookt
      gern: graag
      Hause: thuis
      Sport: sport
      lese: lees
      höre: luister
      Musik: muziek
      zeichne: teken
      manchmal: soms
      spiele: videogames spelen
      nie: nooit
      freien: vrij
      Zeit: tijd
  de.a1.unit54.lesson06.teach.felix_was_machst:
    title: Felix vraagt naar het weekend
    gloss: 'Felix: Wat doe je dit weekend?'
    note: '*Dieses Wochenende* (dit weekend) heeft de onzijdige uitgang -es, omdat das Wochenende onzijdig is.'
  de.a1.unit54.lesson06.teach.anna_ich_weiss:
    title: Anna twijfelt
    gloss: 'Anna: Dat weet ik nog niet. Ik lees graag, maar ik wil ook naar buiten.'
    note: '*Nach draußen* (naar buiten) is een gangbare manier om te zeggen dat je het huis uit wilt.'
  de.a1.unit54.lesson06.teach.felix_gehen_wir:
    title: Felix stelt een plan voor
    gloss: 'Felix: Gaan we samen wandelen? Daarna kook ik voor ons.'
    note: '*Danach* (daarna) staat voorop, dus daarna komt het werkwoord en dan het onderwerp: danach koche ich.'
  de.a1.unit54.lesson06.teach.anna_gute_idee:
    title: Anna stemt in
    gloss: 'Anna: Goed idee! Ik ga graag wandelen en ik kook ook graag.'
    note: '*Gern* na het werkwoord laat zien dat je iets leuk vindt: ich gehe gern spazieren, ich koche gern. Het werkt met bijna elk werkwoord.'
  de.a1.unit54.lesson06.teach.felix_perfekt_dann:
    title: Felix bevestigt
    gloss: 'Felix: Perfect. Dan zie ik je zaterdag!'
    note: 'Een vriendelijke afsluiting die het plan voor *Samstag* (zaterdag) bevestigt. Dagen van de week krijgen *am*: am Samstag.'
