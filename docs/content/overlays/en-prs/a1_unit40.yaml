course:
  title: Dari A1
  description: "Beginner Kabul Dari: recognize a basic emergency, ask for help, state whether you need the police, an ambulance, or the fire brigade, describe an injury, and read a short emergency-related passage."
units:
  prs.a1.unit40.emergencies:
    title: Emergencies
    description: Recognize a basic emergency, ask for help, and state which kind of help is needed (police, ambulance, or fire brigade).
lessons:
  prs.a1.unit40.lesson01.emergency_types:
    title: Emergency help
  prs.a1.unit40.lesson02.asking_for_help:
    title: Asking for help
  prs.a1.unit40.lesson03.describing_the_emergency:
    title: Injured and bleeding
  prs.a1.unit40.lesson04.emergency_dialogue:
    title: Emergency dialogue
  prs.a1.unit40.lesson05.emergency_reading:
    title: Reading about emergency help
  prs.a1.unit40.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit40.lesson01.teach.review_help_want:
    title: "Review: help, I want"
    gloss: help / I want
    note: "کمک (from unit07) and می‌خواهم (from unit17) are review words used throughout this unit to state what kind of help is needed."
  prs.a1.unit40.lesson01.teach.review_this_is:
    title: "Review: this, is"
    gloss: this / is
    note: "این and است are early review words used to say what kind of situation this is."
  prs.a1.unit40.lesson01.teach.emergency_word:
    title: Emergency
    gloss: emergency
    note: "اضطراری means emergency/urgent."
    example_gloss: This is an emergency.
  prs.a1.unit40.lesson01.teach.police_word:
    title: Police
    gloss: police
    note: "پولیس is the standard Afghan Dari word for police (from English \"police\")."
    example_gloss: I need the police.
  prs.a1.unit40.lesson01.teach.ambulance_word:
    title: Ambulance
    gloss: ambulance
    note: "امبولانس means ambulance."
    example_gloss: I need an ambulance.
  prs.a1.unit40.lesson01.teach.fire_word:
    title: Fire
    gloss: fire
    note: "آتش means fire."
    example_gloss: There is a fire.
  prs.a1.unit40.lesson01.teach.fire_brigade_word:
    title: Fire brigade
    gloss: fire brigade
    note: "اطفائیه is the everyday Kabul term for the fire department/fire brigade."
    example_gloss: I need the fire brigade.
  prs.a1.unit40.lesson01.teach.emergency_help_phrase:
    title: This is an emergency! I need the police!
    gloss: This is an emergency! I need the police!
    note: "این اضطراری است combines این (this) with اضطراری (emergency) and است (is)."
  prs.a1.unit40.lesson02.teach.review_can_you_do:
    title: "Review: can you, do (polite imperative), to/for, quickly"
    gloss: can you / do / to/for / quickly
    note: "می‌تانین, کنین, به, and زود (from earlier units) combine with other words to form polite requests and commands."
  prs.a1.unit40.lesson02.teach.mera_word:
    title: Me
    gloss: me
    note: "مه ره is the colloquial Dari way of saying \"me\" as an object (مه is a colloquial form of من, and ره is a colloquial form of the object marker را)."
    example_gloss: Can you help me?
  prs.a1.unit40.lesson02.teach.can_you_help_me_phrase:
    title: Can you help me?
    gloss: Can you help me?
    note: "A real, commonly used Dari phrase for directly asking for help."
  prs.a1.unit40.lesson02.teach.call_word:
    title: Call! (imperative)
    gloss: call
    note: "زنگ بزنین is the polite imperative form of زنگ زدن (to call/ring), building on the already-taught زنگ می‌زنم (I call)."
    example_gloss: Call the police!
  prs.a1.unit40.lesson02.teach.come_word:
    title: Come! (imperative)
    gloss: come
    note: "بیایین is the polite imperative form of آمدن (to come)."
    example_gloss: Come quickly!
  prs.a1.unit40.lesson02.teach.call_ambulance_phrase:
    title: Call the ambulance!
    gloss: Call the ambulance!
    note: "به (to/for) plus امبولانس (ambulance) plus the imperative زنگ بزنین."
  prs.a1.unit40.lesson03.teach.review_he_she_has:
    title: "Review: he/she, he/she has"
    gloss: he/she / he/she has
    note: "او and دارد are review forms used to describe someone else's condition in an emergency."
  prs.a1.unit40.lesson03.teach.injured_word:
    title: Injured
    gloss: injured
    note: "زخمی means injured/wounded."
    example_gloss: He/she is injured.
  prs.a1.unit40.lesson03.teach.bleeding_word:
    title: Bleeding
    gloss: bleeding
    note: "خون‌ریزی means bleeding."
    example_gloss: He/she is bleeding.
  prs.a1.unit40.lesson03.teach.injured_ambulance_phrase:
    title: He/she is injured! I need an ambulance!
    gloss: He/she is injured! I need an ambulance!
    note: "Combines زخمی with the already-taught امبولانس می‌خواهم."
  prs.a1.unit40.lesson03.teach.bleeding_come_quickly_phrase:
    title: He/she is bleeding! Come quickly!
    gloss: He/she is bleeding! Come quickly!
    note: "Combines خون‌ریزی with the already-taught زود بیایین."
  prs.a1.unit40.lesson04.teach.review_dialogue_words:
    title: "Review: what, he/she comes, I call, thanks a lot"
    gloss: what / he/she comes / I call / thanks a lot
    note: "چه, می‌آید (from unit32), زنگ می‌زنم (from unit07/unit30), and تشکر زیاد (from unit32) are review words used in the emergency dialogue."
  prs.a1.unit40.lesson04.teach.dialogue_line1:
    title: "Homayoun: Zarmina, help! Help!"
    gloss: Zarmina, help! Help!
  prs.a1.unit40.lesson04.teach.dialogue_line2:
    title: "Zarmina: What?"
    gloss: What?
  prs.a1.unit40.lesson04.teach.dialogue_line3:
    title: "Homayoun: He/she is injured! He/she is bleeding!"
    gloss: He/she is injured! He/she is bleeding!
  prs.a1.unit40.lesson04.teach.dialogue_line4:
    title: "Zarmina: I need an ambulance. I'm calling!"
    gloss: I need an ambulance. I'm calling!
  prs.a1.unit40.lesson04.teach.dialogue_line5:
    title: "Homayoun: Thanks a lot!"
    gloss: Thanks a lot!
  prs.a1.unit40.lesson04.teach.dialogue_line6:
    title: "Zarmina: The ambulance is coming quickly."
    gloss: The ambulance is coming quickly.
  prs.a1.unit40.lesson05.teach.review_reading_words:
    title: "Review: one, person, city, he/she does, in/at"
    gloss: one / person / city / he/she does / in/at
    note: "یک, نفر (from unit03), شهر (from unit24), می‌کند (from unit18/unit29/unit30), and در are review words used in this reading passage."
  prs.a1.unit40.lesson05.teach.reading_passage:
    title: Reading about an emergency
    gloss: "In the city a person is injured. He/she is bleeding. Homayoun helps. An ambulance comes."
  prs.a1.unit40.lesson06.teach.review_wrap_up_words:
    title: "Review: telephone, I don't have, but, you (formal)"
    gloss: telephone / I don't have / but / you (formal)
    note: "تلفن (from unit07), ندارم, اما, and شما (from unit02) are review words used to contrast a need with a limitation and ask a formal question."
  prs.a1.unit40.lesson06.teach.contrast_phrase:
    title: I need help, but I don't have a phone
    gloss: I need help, but I don't have a phone.
    note: "اما contrasts the need for help with not having a phone to call for it."
  prs.a1.unit40.lesson06.teach.formal_question_phrase:
    title: Can you help?
    gloss: Can you help?
    note: "The formal شما-prefixed version of asking for help, for a polite direct ask."
