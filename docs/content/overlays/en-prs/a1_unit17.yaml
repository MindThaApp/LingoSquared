kenization (all clean). Independently web-verified دل‌درد and standalone تشکر as genuine natural Dari usage. Re-ran the actual compiler (validate then compile) as the final check and directly inspected compiled output: 0 errors/0 warnings, all 30 exercises have non-empty accepted answers, match_advice_vocab and write_dialogue_summary compile with the expected 8 and 12 entries respectively. No further issues found.

