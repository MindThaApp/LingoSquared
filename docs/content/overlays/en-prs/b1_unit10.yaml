course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: combining two facts about a person, place, or
    thing into one richer sentence using که ("that/who/which") -- as
    subject, as object, and (with a resumptive pronoun) as the object of
    a preposition.

units:
  prs.b1.unit10.descriptions:
    title: Descriptions
    description: Combine two facts about a person, place, or thing into a single sentence using a relative clause, including cases needing a preposition and resumptive pronoun.

lessons:
  prs.b1.unit10.lesson01.subject_relative_clause:
    title: "The colleague who..."
  prs.b1.unit10.lesson02.object_relative_clause:
    title: "The car that... (bought)"
  prs.b1.unit10.lesson03.preposition_relative_clause:
    title: "The manager that... with him"
  prs.b1.unit10.lesson04.dialogue_new_car_job:
    title: "The new car and job"
  prs.b1.unit10.lesson05.reading_two_stories:
    title: "Two good stories"
  prs.b1.unit10.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit10.lesson01.teach.ke:
    title: "That / who / which"
    gloss: "that / who / which"
    note: "که introduces a relative clause -- it combines two facts about someone or something into one sentence."
    example_gloss: "The colleague who works in the office is kind."
  prs.b1.unit10.lesson01.teach.grammar_relative_clause:
    title: "The relative clause construction"
    gloss: "همکاری که در دفتر کار می‌کند، مهربان است = the colleague who works in the office is kind"
    note: "که is INVARIANT in Dari -- it never changes for gender or number, unlike some other languages' relative pronouns. The -ی on همکاری is an indefinite marker often used on the head noun right before که."
  prs.b1.unit10.lesson01.teach.hamkari:
    title: "A colleague"
    gloss: "a colleague"
    note: "همکاری means a colleague -- the indefinite -ی marks it as unspecified, right before a relative clause."
    example_gloss: "The colleague who works in the office is kind."
  prs.b1.unit10.lesson01.teach.dar_daftar:
    title: In the office
    gloss: "in the office"
    note: "در دفتر means in the office."
    example_gloss: "The colleague who works in the office is kind."
  prs.b1.unit10.lesson01.teach.kar_mikonad:
    title: Works
    gloss: works
    note: "کار می‌کند means he/she works."
    example_gloss: "The colleague who works in the office is kind."
  prs.b1.unit10.lesson01.teach.mehraban:
    title: Kind
    gloss: kind
    note: "مهربان means kind."
    example_gloss: "The colleague who works in the office is kind."

  prs.b1.unit10.lesson02.teach.moteri_ke:
    title: "The car that..."
    gloss: "a/the car that..."
    note: "موتری که begins a relative clause describing a car."
    example_gloss: "The car that Homayoun bought is cheap."
  prs.b1.unit10.lesson02.teach.khared:
    title: Bought
    gloss: bought
    note: "خرید is the 3rd person simple past of خریدن (to buy)."
    example_gloss: "The car that Homayoun bought is cheap."
  prs.b1.unit10.lesson02.teach.grammar_object_relative:
    title: "که as the object of its own clause"
    gloss: "موتری که همایون خرید، ارزان است = the car that Homayoun bought is cheap"
    note: "که can stand for the OBJECT of the embedded verb, not just its subject -- که stands for موتری as the object of خرید (bought), while همایون is still the subject of that same embedded clause."
  prs.b1.unit10.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "همایون -- an established recurring character in this course."
    example_gloss: "The car that Homayoun bought is cheap."
  prs.b1.unit10.lesson02.teach.review_arzan:
    title: Cheap
    gloss: cheap
    note: "ارزان means cheap."
    example_gloss: "The car that Homayoun bought is cheap."
  prs.b1.unit10.lesson02.teach.kari_ke:
    title: "The job that..."
    gloss: "a/the job that..."
    note: "کاری که begins a relative clause describing a job."
    example_gloss: "The job that Zarmina found is good."
  prs.b1.unit10.lesson02.teach.peida_kard:
    title: Found
    gloss: found
    note: "پیدا کرد is the 3rd person simple past of پیدا کردن (to find)."
    example_gloss: "The job that Zarmina found is good."
  prs.b1.unit10.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "زرمینه -- an established recurring character in this course."
    example_gloss: "The job that Zarmina found is good."
  prs.b1.unit10.lesson02.teach.review_khoob:
    title: Good
    gloss: good
    note: "خوب means good."
    example_gloss: "The job that Zarmina found is good."

  prs.b1.unit10.lesson03.teach.modiri_ke:
    title: "The manager that..."
    gloss: "a/the manager that..."
    note: "مدیری که begins a relative clause describing a manager."
    example_gloss: "The manager that Homayoun works with is kind."
  prs.b1.unit10.lesson03.teach.ba_oo:
    title: "With him"
    gloss: "with him"
    note: "با او means with him/her -- او is a resumptive pronoun standing back in for the relativized noun."
    example_gloss: "The manager that Homayoun works with is kind."
  prs.b1.unit10.lesson03.teach.grammar_resumptive:
    title: "Relative clauses with a preposition"
    gloss: "مدیری که همایون با او کار می‌کند = the manager that Homayoun works with"
    note: "که alone cannot carry a preposition -- when the relativized noun needs one (with, in, to...), Dari repeats it inside the clause with a resumptive pronoun (او 'he/she/it', or آن 'it'). Dropping با او and leaving just که همایون کار می‌کند would lose the 'with' relationship entirely."
  prs.b1.unit10.lesson03.teach.daftari_ke:
    title: "The office that..."
    gloss: "an/the office that..."
    note: "دفتری که begins a relative clause describing an office."
    example_gloss: "The office that Homayoun works in is close to home."
  prs.b1.unit10.lesson03.teach.dar_aan:
    title: "In it"
    gloss: "in it"
    note: "در آن means in it -- آن is a resumptive pronoun standing back in for the relativized noun."
    example_gloss: "The office that Homayoun works in is close to home."
  prs.b1.unit10.lesson03.teach.nazdik:
    title: Near / close
    gloss: "near / close"
    note: "نزدیک means near or close."
    example_gloss: "The office that Homayoun works in is close to home."
  prs.b1.unit10.lesson03.teach.review_khana:
    title: House
    gloss: house
    note: "خانه means house."
    example_gloss: "The office that Homayoun works in is close to home."

  prs.b1.unit10.lesson04.teach.khaste_ke:
    title: Small
    gloss: small
    note: "کوچک means small."
    example_gloss: "The car that I bought is good, although it's small."
  prs.b1.unit10.lesson04.teach.aali:
    title: Excellent
    gloss: excellent
    note: "عالی means excellent."
    example_gloss: "The job that I found is excellent."
  prs.b1.unit10.lesson04.teach.khoshhalam_ke:
    title: "I'm glad that"
    gloss: "I'm glad that"
    note: "خوشحالم که means I'm glad that."
    example_gloss: "I'm glad that both of us are happy."
  prs.b1.unit10.lesson04.teach.khoshhal_astim:
    title: "We are happy"
    gloss: "we are happy"
    note: "خوشحال استیم means we are happy."
    example_gloss: "Both of us are happy."
  prs.b1.unit10.lesson04.teach.review_har_do:
    title: Both
    gloss: both
    note: "هر دو means both."
    example_gloss: "Both of us are happy."
  prs.b1.unit10.lesson04.teach.review_chetor:
    title: How
    gloss: how
    note: "چطور means how -- also used to ask what something is like."
    example_gloss: "Homayoun, this car that you bought, what's it like?"
  prs.b1.unit10.lesson04.teach.review_in:
    title: This
    gloss: this
    note: "این means this."
    example_gloss: "Homayoun, this car that you bought, what's it like?"
  prs.b1.unit10.lesson04.teach.kharidi:
    title: You bought
    gloss: "you bought"
    note: "خریدی is the 2nd person simple past of خریدن (to buy)."
    example_gloss: "Homayoun, this car that you bought, what's it like?"
  prs.b1.unit10.lesson04.teach.kharidam:
    title: I bought
    gloss: "I bought"
    note: "خریدم is the 1st person simple past of خریدن (to buy)."
    example_gloss: "The car that I bought is good."
  prs.b1.unit10.lesson04.teach.peida_kardi:
    title: You found
    gloss: "you found"
    note: "پیدا کردی is the 2nd person simple past of پیدا کردن (to find)."
    example_gloss: "That job that you found, what's it like?"
  prs.b1.unit10.lesson04.teach.peida_kardam:
    title: I found
    gloss: "I found"
    note: "پیدا کردم is the 1st person simple past of پیدا کردن (to find)."
    example_gloss: "The job that I found is excellent."
  prs.b1.unit10.lesson04.teach.review_aan:
    title: That
    gloss: that
    note: "آن means that."
    example_gloss: "That job that you found, what's it like?"
  prs.b1.unit10.lesson04.teach.review_harchand:
    title: Although
    gloss: although
    note: "هرچند means although."
    example_gloss: "The car that I bought is good, although it's small."
  prs.b1.unit10.lesson04.teach.review_khoob2:
    title: Good
    gloss: good
    note: "خوب means good."
    example_gloss: "The car that I bought is good."
  prs.b1.unit10.lesson04.teach.dialogue_zarmina_ask:
    title: "Homayoun, this car that you bought, what's it like?"
    gloss: "Homayoun, this car that you bought, what's it like?"
    note: "Zarmina asks about the car."
  prs.b1.unit10.lesson04.teach.dialogue_homayoun_answer:
    title: "The car that I bought is good, although it's small. Zarmina, that job that you found, what's it like?"
    gloss: "The car that I bought is good, although it's small. Zarmina, that job that you found, what's it like?"
    note: "Homayoun answers and asks back about Zarmina's job."
  prs.b1.unit10.lesson04.teach.dialogue_zarmina_answer:
    title: "The job that I found is excellent. The manager that I work with is kind."
    gloss: "The job that I found is excellent. The manager that I work with is kind."
    note: "Zarmina shares her good news, using both an object-relative clause (کاری که پیدا کردم) and a preposition-relative clause (مدیری که با او کار می‌کنم)."
  prs.b1.unit10.lesson04.teach.dialogue_homayoun_close:
    title: "I'm glad that both of us are happy."
    gloss: "I'm glad that both of us are happy."
    note: "Homayoun closes warmly."

  prs.b1.unit10.lesson05.teach.review_ra:
    title: "(object marker)"
    gloss: "(object marker)"
    note: "را marks the direct object."
    example_gloss: "He likes the car that he bought."
  prs.b1.unit10.lesson05.teach.doost_darad:
    title: Likes
    gloss: likes
    note: "دوست دارد means he/she likes."
    example_gloss: "Homayoun likes the car that he bought."
  prs.b1.unit10.lesson05.teach.komak_mikonad:
    title: Helps
    gloss: helps
    note: "کمک می‌کند means he/she helps."
    example_gloss: "The manager helps her."
  prs.b1.unit10.lesson05.teach.review_be_oo:
    title: "To him / her"
    gloss: "to him / her"
    note: "به او means to him/her."
    example_gloss: "The manager helps her."
  prs.b1.unit10.lesson05.teach.review_va:
    title: And
    gloss: and
    note: "و means and."
    example_gloss: "The manager she works with is kind and helps her."
  prs.b1.unit10.lesson05.teach.mibinad:
    title: Sees
    gloss: sees
    note: "می‌بیند means he/she sees -- used here idiomatically as 'how does he view/see it.'"
    example_gloss: "How does Homayoun see the car that he bought?"
  prs.b1.unit10.lesson05.teach.review_modir:
    title: Manager
    gloss: manager
    note: "مدیر means manager -- an established recurring role in this course."
    example_gloss: "The manager helps Zarmina."
  prs.b1.unit10.lesson05.teach.review_che:
    title: What
    gloss: what
    note: "چه means what."
    example_gloss: "What does the manager do for Zarmina?"
  prs.b1.unit10.lesson05.teach.reading_passage:
    title: "Two good stories"
    gloss: "Homayoun likes the car that he bought, although it's small. Zarmina likes the job that she found. The manager that Zarmina works with is kind and helps her."
    note: "A short reading combining subject, object, and preposition relative clauses, reusing this unit's established characters and their achieved goals."

  prs.b1.unit10.lesson06.teach.grammar_review:
    title: "Review: relative clauses"
    gloss: "که combines two facts into one sentence, whether it's the subject or object of its own clause. When که would need a preposition, add a resumptive pronoun instead (با او، در آن)."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit10.lesson06.teach.review_zibaa:
    title: Beautiful
    gloss: beautiful
    note: "زیبا means beautiful."
    example_gloss: "The house that Zarmina lives in is beautiful."
  prs.b1.unit10.lesson06.teach.zendagi_mikonad:
    title: Lives
    gloss: lives
    note: "زندگی می‌کند means he/she lives."
    example_gloss: "The house that Zarmina lives in is beautiful."
  prs.b1.unit10.lesson06.teach.khaneyi_ke:
    title: "The house that..."
    gloss: "a/the house that..."
    note: "خانه‌ای که begins a relative clause describing a house."
    example_gloss: "The house that Zarmina lives in is beautiful."
  prs.b1.unit10.lesson06.teach.review_man:
    title: I
    gloss: I
    note: "من means I."
    example_gloss: "The manager I work with helps me."

