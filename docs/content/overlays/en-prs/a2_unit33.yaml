course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying what you started, stopped, tried or forgot to do. Starting with the thing and را, with به and the infinitive or with که and the subjunctive; giving up a habit with ترک کردن and دیگر; trying and forgetting with که and the subjunctive.'
units:
  prs.a2.unit33.starting_stopping_trying:
    title: Starting, stopping, trying
lessons:
  prs.a2.unit33.lesson01.starting:
    title: 'Starting something: "I started running"'
  prs.a2.unit33.lesson02.that_i_run:
    title: '"That I run": starting and trying with که'
  prs.a2.unit33.lesson03.stopping:
    title: 'Stopping: ترک کردن and "no longer"'
  prs.a2.unit33.lesson04.forgetting:
    title: Forgetting to do something
  prs.a2.unit33.lesson05.reading_and_listening:
    title: Reading and listening about habits
  prs.a2.unit33.lesson06.gym_conversation:
    title: A conversation at the gym
teaching:
  prs.a2.unit33.lesson01.teach.gym:
    title: Gym
    gloss: gym, sports club
    note: '*باشگاه* is a gym or sports club. You go there with *به*: *به باشگاه می‌روم* is I go to the gym.'
    example_gloss: The gym is near the house.
  prs.a2.unit33.lesson01.teach.run:
    title: To run
    gloss: to run
    note: '*دویدن* is to run. Its present stem is *دو*, so *می‌دوم* is I run. Like every infinitive, *دویدن* ends in *-ن*, and you will use this *-ن* form after *به* in this lesson.'
    example_gloss: I run every morning.
  prs.a2.unit33.lesson01.teach.exercise:
    title: To exercise
    gloss: to do sport, to exercise
    note: '*ورزش کردن* is to do sport or to exercise. It is a two-word verb: *ورزش* stays in front and only *کردن* changes, as in *ورزش می‌کنم* (I exercise) and *ورزش کردم* (I exercised).'
    example_gloss: I exercise every day.
  prs.a2.unit33.lesson01.teach.half_hour:
    title: Half an hour
    gloss: half an hour
    note: '*نیم ساعت* is half an hour. *نیم* means half and stands before the noun, as in *نیم ساعت* and *نیم ساعت ورزش*.'
    example_gloss: Every morning I exercise for half an hour.
  prs.a2.unit33.lesson01.teach.habit:
    title: Habit
    gloss: habit
    note: '*عادت* is a habit. This whole unit is about habits: starting a good one, stopping a bad one, trying to keep one, and forgetting one.'
    example_gloss: Exercise is a good habit.
  prs.a2.unit33.lesson01.teach.start_noun:
    title: 'Starting something: the thing + را + شروع کردن'
    gloss: I started exercising. You started running. He or she started work.
    note: 'To say that you started something, put the thing before *را* and then use *شروع کردن* (to start): *ورزش را شروع کردم* is I started exercising. It is a two-word verb like *ورزش کردن*, so only *کردن* changes: *شروع کردم، شروع کردی، شروع کرد، شروع کردیم، شروع کردین، شروع کردند*. The thing you start can be a noun (*کار*, work) or an infinitive (*دویدن*, running). The pronoun is optional because the ending already shows who.'
  prs.a2.unit33.lesson01.teach.month_ago:
    title: I started exercising a month ago
    gloss: I started exercising a month ago.
    note: '*پیش* after a time word means ago: *یک ماه پیش* is a month ago and *دو هفته پیش* is two weeks ago. The time word usually stands at the start of the sentence.'
  prs.a2.unit33.lesson01.teach.start_to:
    title: 'Starting to do something: به + infinitive + شروع کردن'
    gloss: I started running. You started exercising. He or she started reading.
    note: 'To say that you started doing an action, put *به* and the infinitive (the verb in its *-ن* form) before *شروع کردن*: *به دویدن شروع کردم* is I started running. A two-word verb keeps both words in the infinitive: *به ورزش کردن شروع کردم* is I started exercising. You will also hear the order *شروع کردم به دویدن*, which means the same thing. Compare the two patterns: *ورزش را شروع کردم* names a thing you started, and *به ورزش کردن شروع کردم* names the action.'
  prs.a2.unit33.lesson01.teach.read_start:
    title: He or she started reading books two weeks ago
    gloss: He or she started reading books two weeks ago.
    note: '*خواندن* is to read (and to study). The infinitive *خواندن* comes after *به*, and its object *کتاب* can follow it: *به خواندن کتاب شروع کرد*.'
  prs.a2.unit33.lesson02.teach.sleep:
    title: To sleep, to go to bed
    gloss: to sleep, to go to bed
    note: '*خوابیدن* is to sleep or to go to bed. Its present stem is *خواب*: *می‌خوابم* is I sleep. *شب‌ها* means at night or in the evenings, as a time word.'
    example_gloss: In the evenings I go to bed early.
  prs.a2.unit33.lesson02.teach.try:
    title: To try
    gloss: to try, to make an effort
    note: '*کوشش* is effort, and *کوشش کردن* is to try. It is a two-word verb: *کوشش می‌کنم* is I try and *کوشش کردم* is I tried. The thing you try to do comes after *که*, in the subjunctive.'
    example_gloss: I try to wake up early.
  prs.a2.unit33.lesson02.teach.subjunctive:
    title: 'The subjunctive: ب + present stem + ending'
    gloss: that I run, that I sleep, that I read, that I eat, that I go, that I see; that I exercise, that I wake up
    note: 'The subjunctive is the verb form you use for something you start, try or forget to do. You already know it from *باید*, as in *باید بروم*. To build it, take the present stem, put *ب-* in front and add the endings *-م، -ی، -د، -یم، -ین، -ند*. For *دویدن* (stem *دو*): *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*. Other verbs: *خوابیدن* gives *بخوابم*, *خواندن* gives *بخوانم*, *خوردن* gives *بخورم*, *رفتن* gives *بروم*, *دیدن* gives *ببینم*. A two-word verb has no *ب-*: the first word stays and only *کردن* or *شدن* changes, so *ورزش کنم* (that I exercise) and *بیدار شوم* (that I wake up).'
  prs.a2.unit33.lesson02.teach.che_pattern:
    title: شروع کردن and کوشش کردن with که
    gloss: I started to run. I try to go to bed early. I tried to exercise.
    note: 'After *شروع کردن* and *کوشش کردن* you add *که* and a subjunctive verb. *شروع کردم که بدوم* means the same as *به دویدن شروع کردم*: I started running. *کوشش می‌کنم که زود بخوابم* is I try to go to bed early. The subject normally stays the same, so the subjunctive ending shows the same person as the main verb: *کوشش کردم که بروم*, *کوشش کردی که بروی*, *کوشش کرد که برود*. The tense of the first verb gives the time (I tried, I try); the subjunctive itself has no time of its own.'
  prs.a2.unit33.lesson02.teach.negative_subj:
    title: 'The negative subjunctive: ن instead of ب'
    gloss: I try not to eat sweets. I try not to go to bed late.
    note: 'To say try not to, put *ن-* in the place of *ب-*: *بخورم* becomes *نخورم* (that I do not eat), *بخوابم* becomes *نخوابم*, *بروم* becomes *نروم*. Do not write *نبخورم*. A two-word verb puts the *ن-* on its verb part: *ورزش نکنم* (that I do not exercise).'
  prs.a2.unit33.lesson02.teach.he_tried:
    title: He or she tried to wake up early
    gloss: He or she tried to wake up early.
    note: 'The subjunctive ending shows the subject: *شود* is he or she, so *او کوشش کرد که زود بیدار شود* is He or she tried to wake up early.'
  prs.a2.unit33.lesson02.teach.we_started:
    title: We started to exercise every day
    gloss: We started to exercise every day.
    note: 'The ending *-یم* is we in both verbs: *شروع کردیم* and *ورزش کنیم*.'
  prs.a2.unit33.lesson03.teach.quit:
    title: To give up, to quit
    gloss: to give up, to quit
    note: '*ترک کردن* is to give up or to quit a habit. It is a two-word verb: *ترک کردم* is I quit and *ترک می‌کنم* is I give up.'
    example_gloss: He or she gave up eating sweets.
  prs.a2.unit33.lesson03.teach.sweets:
    title: Sweets
    gloss: sweets, cakes, sugary snacks
    note: '*شیرینی* is sweets and cakes. It is a good example of a habit people try to give up.'
    example_gloss: I like sweets.
  prs.a2.unit33.lesson03.teach.for_hours:
    title: For hours
    gloss: for hours
    note: '*ساعت‌ها* is the plural of *ساعت* and means for hours, for a long time. It is how you talk about screen time: *ساعت‌ها ویدیو دیدم* is I watched videos for hours.'
    example_gloss: He or she watches videos for hours.
  prs.a2.unit33.lesson03.teach.sometimes:
    title: Sometimes
    gloss: sometimes
    note: '*گاهی* is sometimes. It stands at the start of the sentence or before the verb, and it is the opposite of *همیشه* (always) and *هرگز* (never).'
    example_gloss: Sometimes I watch videos.
  prs.a2.unit33.lesson03.teach.quit_pattern:
    title: 'Giving up a habit: the habit + را + ترک کردن'
    gloss: I gave up eating sweets. You gave up sleeping late. He or she gave up watching videos.
    note: 'To say that you gave up a habit, put the habit before *را* and then use *ترک کردن*. The habit is an infinitive phrase: *شیرینی خوردن* (eating sweets), *دیر خوابیدن* (sleeping late), *ویدیو دیدن* (watching videos). It is the same pattern as *ورزش را شروع کردم*: the thing, *را*, then the verb. You can also say *عادت بد را ترک کردم* (I gave up a bad habit).'
  prs.a2.unit33.lesson03.teach.no_longer:
    title: 'No longer: دیگر + negative verb'
    gloss: I no longer eat sweets. I no longer watch videos. I no longer go to bed late.
    note: '*دیگر* with a negative verb means no longer or not any more: *دیگر شیرینی نمی‌خورم* is I no longer eat sweets. It describes how things are now, after you have given something up. For a past story you can use *دیگر* with the negative simple past: *از آن روز دیگر شیرینی نخوردم* is from that day on I did not eat sweets again. In the present, *ترک کردم* says you made the decision and *دیگر نمی‌خورم* says the result.'
  prs.a2.unit33.lesson03.teach.from_today:
    title: From today I no longer go to bed late
    gloss: From today I no longer go to bed late.
    note: '*از امروز* is from today. With *دیگر* and a negative verb it announces a new habit.'
  prs.a2.unit33.lesson03.teach.bad_habit:
    title: I gave up a bad habit
    gloss: I gave up a bad habit.
    note: '*عادت بد* is a bad habit. The adjective *بد* comes after the noun.'
  prs.a2.unit33.lesson03.teach.less_phone:
    title: At night I use the phone less
    gloss: At night I use the phone less.
    note: '*کمتر* is less. Cutting down screen time is another way of stopping a habit: you do not quit, you do it less.'
  prs.a2.unit33.lesson04.teach.forget:
    title: To forget
    gloss: to forget
    note: '*فراموش کردن* is to forget. It is a two-word verb: *فراموش کردم* is I forgot and *فراموش نکردم* is I did not forget.'
    example_gloss: Sorry, I forgot.
  prs.a2.unit33.lesson04.teach.why_not_come:
    title: Why did you not come yesterday?
    gloss: Why did you not come yesterday?
    note: '*نیامدی* is the negative simple past of *آمدن* for one friend: you did not come. The question *چرا* asks why.'
  prs.a2.unit33.lesson04.teach.forget_pattern:
    title: 'Forgetting to do something: فراموش کردن که + subjunctive'
    gloss: I forgot to phone. I forgot to bring my book. I forgot to go to bed early.
    note: 'To say that you forgot to do something, use *فراموش کردن* with *که* and a subjunctive verb: *فراموش کردم که تیلفون کنم* is I forgot to phone, so the phone call did not happen. It is the same subjunctive as in the last lessons, and the subject normally stays the same. *فراموش کردم* is past, so you are talking about a moment that has already passed; the subjunctive after *که* has no tense of its own.'
  prs.a2.unit33.lesson04.teach.not_forget:
    title: 'I did not forget to: فراموش نکردم که'
    gloss: I did not forget to phone. I did not forget to bring my book.
    note: '*فراموش نکردم* puts the negative on *کردم*: I did not forget. After it, the thing was done: *فراموش نکردم که کتابم را بیاورم* is I did not forget to bring my book, so I brought it. Compare *فراموش کردم که کتابم را بیاورم* (I forgot to bring my book, so I did not bring it).'
  prs.a2.unit33.lesson04.teach.four_verbs:
    title: Four verbs, four patterns
    gloss: I started. I gave up. I tried. I forgot.
    note: 'All four verbs end in *کردن*, so the person endings are always the same (*کردم، کردی، کرد، کردیم، کردین، کردند*). What follows is different. *شروع کردن*: the thing and *را*, or *به* plus the infinitive, or *که* plus the subjunctive. *ترک کردن*: the habit and *را*. *کوشش کردن*: *که* plus the subjunctive. *فراموش کردن*: *که* plus the subjunctive. To say that you do not do something any more, use *دیگر* and a negative present verb.'
  prs.a2.unit33.lesson04.teach.sorry_forgot_sleep:
    title: I forgot to go to bed early
    gloss: I forgot to go to bed early.
    note: This is the kind of sentence you say when something went wrong because of a habit you did not keep.
  prs.a2.unit33.lesson05.teach.read_book:
    title: To read a book
    gloss: to read a book
    note: '*کتاب خواندن* is to read a book. The present is *کتاب می‌خوانم* (I read a book); *خواندن* is also to study.'
    example_gloss: Every night I read a book for half an hour.
  prs.a2.unit33.lesson05.teach.two_weeks:
    title: I started reading books two weeks ago
    gloss: I started reading books two weeks ago.
    note: 'The pattern is the one from the first lesson: a time word with *پیش*, then *به* plus the infinitive, then *شروع کردم*.'
  prs.a2.unit33.lesson05.teach.dlg_turn01:
    title: Najiba asks Yasin when he started
    gloss: Yasin, when did you start exercising?
    note: '*ورزش را کی شروع کردی؟* uses the pattern thing plus *را* plus *شروع کردی*. *کی* asks when. The speakers are friends, so they use *تو*.'
  prs.a2.unit33.lesson05.teach.dlg_turn02:
    title: Yasin says when and how much
    gloss: A month ago. Now I run in the gym for half an hour every morning.
    note: '*یک ماه پیش* is the starting point. *حالا هر صبح نیم ساعت در باشگاه می‌دوم* is the habit he has now.'
  prs.a2.unit33.lesson05.teach.dlg_turn03:
    title: Najiba asks about sweets
    gloss: Very good! Do you eat sweets too?
    note: '*خیلی خوب* is a friendly reaction. *شیرینی هم می‌خوری؟* asks whether he also eats sweets.'
  prs.a2.unit33.lesson05.teach.dlg_turn04:
    title: Yasin says he gave up sweets
    gloss: No, I gave up eating sweets. I no longer eat sweets.
    note: '*شیرینی خوردن را ترک کردم* names the decision and *دیگر شیرینی نمی‌خورم* names the result.'
  prs.a2.unit33.lesson05.teach.dlg_turn05:
    title: Najiba asks about videos
    gloss: Do you watch videos at night?
    note: '*شب‌ها* is a time word for at night, and *می‌بینی* is you see or watch.'
  prs.a2.unit33.lesson05.teach.dlg_turn06:
    title: Yasin says he tries to watch less
    gloss: Yes, but I try to watch less.
    note: '*کوشش می‌کنم که کمتر ببینم* uses *کوشش کردن* with the subjunctive *ببینم*. He has not given videos up: he is trying.'
  prs.a2.unit33.lesson05.teach.khalida_message:
    title: A message about new habits
    gloss: Hello Najiba. Two weeks ago I started reading books. Every night I read for half an hour. I gave up watching videos, so at night I no longer watch videos. I try to go to bed early. Yesterday I forgot to phone you. Khalida
    note: 'A short written message that uses all four patterns: starting (*به خواندن کتاب شروع کردم*), giving up (*ویدیو دیدن را ترک کردم*), trying (*کوشش می‌کنم که زود بخوابم*) and forgetting (*فراموش کردم که تیلفون کنم*). The writer is a different person from Yasin.'
  prs.a2.unit33.lesson06.teach.late_wake:
    title: I woke up late in the morning
    gloss: I woke up late in the morning.
    note: '*بیدار شدن* is to wake up. *دیر* is late and *زود* is early: *صبح زود بیدار شدم* is I woke up early.'
  prs.a2.unit33.lesson06.teach.every_night:
    title: I try to go to bed early every night
    gloss: I try to go to bed early every night.
    note: '*هر شب* is every night. A time word like *هر شب* can stand before or after *زود*; here it comes after *که*.'
  prs.a2.unit33.lesson06.teach.dlg_turn01:
    title: Yasin asks why Najiba did not come
    gloss: Najiba, why did you not come to the gym yesterday?
    note: '*چرا* asks why and *نیامدی* is you did not come. *به باشگاه* is to the gym.'
  prs.a2.unit33.lesson06.teach.dlg_turn02:
    title: Najiba says what she forgot
    gloss: I forgot to go to bed early, so I woke up late in the morning.
    note: '*فراموش کردم که زود بخوابم* is the reason, with the subjunctive *بخوابم*. *پس* (so) introduces the result: *صبح دیر بیدار شدم*.'
  prs.a2.unit33.lesson06.teach.dlg_turn03:
    title: Yasin asks about today
    gloss: Are you coming today?
    note: '*می‌آیی* is you come or you are coming, for one friend. In Dari the plain present with a time word can also refer to the near future.'
  prs.a2.unit33.lesson06.teach.dlg_turn04:
    title: Najiba says she is coming and what she tries
    gloss: Yes, I am coming at six o'clock today. I try to go to bed early every night.
    note: '*امروز ساعت شش می‌آیم* is the plain present with a time word. *کوشش می‌کنم که هر شب زود بخوابم* is the new habit she wants to keep.'
  prs.a2.unit33.lesson06.teach.dlg_turn05:
    title: Yasin reacts
    gloss: Very good!
    note: '*خیلی خوب* is a short friendly reaction.'
exercises:
  prs.a2.unit33.lesson01.exercise01.recognize_started_running:
    instruction: What does this sentence mean?
    correct_option: I started running
    distractors:
    - I stopped running
    - I will run tomorrow
    - I ran yesterday
    accepted_answers:
    - value: I started running
      status: correct
    feedback: '*به دویدن شروع کردم* is I started running: *به* plus the infinitive *دویدن*, then *شروع کردم*.'
  prs.a2.unit33.lesson01.exercise02.recognize_started_exercise_month:
    instruction: What does this sentence mean?
    correct_option: I started exercising a month ago
    distractors:
    - I will start exercising next month
    - I stopped exercising a month ago
    - I exercise for a month
    accepted_answers:
    - value: I started exercising a month ago
      status: correct
    feedback: '*یک ماه پیش* is a month ago, and *ورزش را شروع کردم* is I started exercising.'
  prs.a2.unit33.lesson01.exercise03.match_start_words:
    instruction: Match each Dari word or phrase with its meaning.
    accepted_answers:
    - value:
        باشگاه: gym
        دویدن: running, to run
        ورزش کردن: to exercise
        نیم ساعت: half an hour
        عادت: habit
        شروع کردم: I started
        شروع کردی: you started (to a friend)
        شروع کرد: he or she started
        یک ماه پیش: a month ago
      status: correct
    feedback: 'Only the ending of *کردن* changes with the person: *شروع کردم* I started, *شروع کردی* you started, *شروع کرد* he or she started.'
  prs.a2.unit33.lesson01.exercise04.order_started_exercising:
    instruction: 'Arrange the words to say: I started exercising.'
    accepted_answers:
    - value:
      - به
      - ورزش
      - کردن
      - شروع
      - کردم
      status: correct
    - value:
      - شروع
      - کردم
      - به
      - ورزش
      - کردن
      status: correct
    feedback: '*به ورزش کردن شروع کردم.* The infinitive *ورزش کردن* comes after *به*. The order *شروع کردم به ورزش کردن* is also correct.'
  prs.a2.unit33.lesson01.exercise05.complete_started_running:
    instruction: 'Complete the sentence: I started running a month ago.'
    accepted_answers:
    - value: شروع
      status: correct
    feedback: '*شروع* is the first part of the two-word verb *شروع کردن*: *به دویدن شروع کردم*.'
  prs.a2.unit33.lesson01.exercise06.translate_started_running:
    instruction: 'Translate into Dari, using شروع کردن: I started running.'
    accepted_answers:
    - value: به دویدن شروع کردم.
      status: correct
    - value: من به دویدن شروع کردم.
      status: correct
    - value: شروع کردم به دویدن.
      status: correct
