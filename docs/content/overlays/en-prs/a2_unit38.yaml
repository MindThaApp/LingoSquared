course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: asking for information indirectly and politely, for example Do you know where the station is? The frame می‌دانین که ... with an unchanged embedded question (where, when, why, which, how much), I do not know that ..., yes or no with یا نه, and the polite request می‌توانین بگویین که ... .'
units:
  prs.a2.unit38.asking_indirectly:
    title: Asking indirectly
lessons:
  prs.a2.unit38.lesson01.do_you_know_where:
    title: Do you know where the station is?
  prs.a2.unit38.lesson02.i_dont_know:
    title: I do not know when the bus leaves
  prs.a2.unit38.lesson03.yes_or_no:
    title: Open or not?
  prs.a2.unit38.lesson04.polite_requests:
    title: Excuse me, can you tell me ...
  prs.a2.unit38.lesson05.reading_and_listening:
    title: Reading and listening about a museum and a bank
  prs.a2.unit38.lesson06.station_conversation:
    title: A conversation at the station
teaching:
  prs.a2.unit38.lesson01.teach.station:
    title: Station
    gloss: station, stop
    note: '*ایستگاه* is a station or a stop. This unit asks where places are, and the station is the first one: *ایستگاه بس* is the bus station.'
    example_gloss: The station is in Kabul.
  prs.a2.unit38.lesson01.teach.museum:
    title: Museum
    gloss: museum
    note: '*موزیم* is a museum. The National Museum of Afghanistan is in Kabul.'
    example_gloss: The museum is in Kabul.
  prs.a2.unit38.lesson01.teach.office:
    title: Office
    gloss: office
    note: '*دفتر* is an office, for example the passport office or the office of a bus company.'
    example_gloss: The office is near.
  prs.a2.unit38.lesson01.teach.library:
    title: Library
    gloss: library
    note: '*کتابخانه* is a library. *نزدیک* means near.'
    example_gloss: The library is near.
  prs.a2.unit38.lesson01.teach.where:
    title: Where is it?
    gloss: where is it?
    note: '*کجا* means where, and *کجاست* is where is it: *کجا* plus the short form of *است*. Put the place first: *ایستگاه کجاست؟* is where is the station?'
    example_gloss: Where is the museum?
  prs.a2.unit38.lesson01.teach.know:
    title: To know
    gloss: I know
    note: '*دانستن* is to know a fact: *می‌دانم* is I know. Use it for facts (where a place is, when a bus leaves), not for knowing a person.'
    example_gloss: I know.
  prs.a2.unit38.lesson01.teach.know_paradigm:
    title: 'To know: می‌دانم'
    gloss: I know, you know, he/she knows, we know, you (formal or plural) know, they know
    note: 'The present of *دانستن* is *می‌* plus the ending: *می‌دانم، می‌دانی، می‌داند، می‌دانیم، می‌دانین، می‌دانند*. The 2pl ending is *-ین*. With a stranger, an older person or a group you say *می‌دانین*; with a close friend you say *می‌دانی*. The pronoun is optional.'
  prs.a2.unit38.lesson01.teach.direct_to_indirect:
    title: From a direct to an indirect question
    gloss: Where is the station? Do you know where the station is?
    note: 'An indirect question is softer and more polite than a direct one. Start with *می‌دانین که* (do you know that) and then put the direct question after it with nothing changed: *ایستگاه کجاست؟* becomes *می‌دانین که ایستگاه کجاست؟*. The question word *کجا* stays where it was, and the order of the words stays the order of a statement.'
  prs.a2.unit38.lesson01.teach.do_you_know_museum:
    title: Do you know where the museum is?
    gloss: Do you know where the museum is?
    note: 'This is the model sentence of the unit. *که* (that) is optional: *می‌دانین موزیم کجاست؟* is also correct. The question mark comes once, at the end, because the whole sentence is one question.'
  prs.a2.unit38.lesson01.teach.friend_or_polite:
    title: Friend or polite
    gloss: 'Friend: do you know where the library is? Polite: do you know where the library is?'
    note: 'Only the ending of *دانستن* changes with the person you speak to: *می‌دانی* for a friend, *می‌دانین* for someone you address politely. Everything after *که* is the same.'
  prs.a2.unit38.lesson02.teach.know_not_know:
    title: I know / I do not know
    gloss: I know where the museum is. I do not know where the museum is.
    note: 'The same frame works for a statement. *می‌دانم که* is I know that, and *نمی‌دانم که* is I do not know that, with *ن* in front of the verb. The embedded question follows unchanged: *نمی‌دانم که موزیم کجاست.* This time the sentence ends with a full stop, because it is a statement.'
  prs.a2.unit38.lesson02.teach.order_unchanged:
    title: The verb stays as in the direct question
    gloss: When does the museum open? I do not know when the museum opens.
    note: 'Nothing inside the embedded question changes. The question word keeps its place, the verb keeps its tense, and no subjunctive is needed. Dari does not reorder: the direct question and the embedded question are written the same.'
  prs.a2.unit38.lesson02.teach.when:
    title: When
    gloss: when, at what time
    note: '*کی* means when. You can also ask for the clock time with *ساعت چند*: *بس ساعت چند حرکت می‌کند؟*'
    example_gloss: When does the bus leave?
  prs.a2.unit38.lesson02.teach.opens:
    title: To open
    gloss: opens (becomes open)
    note: '*باز* is open and *شدن* is to become, so *باز می‌شود* is it opens. Say it for offices, museums, banks and shops.'
    example_gloss: The office opens at nine.
  prs.a2.unit38.lesson02.teach.closes:
    title: To close
    gloss: closes (becomes closed)
    note: '*بسته* is closed. *بسته می‌شود* is it closes. It is the opposite of *باز می‌شود*.'
    example_gloss: The office closes at four.
  prs.a2.unit38.lesson02.teach.leaves:
    title: To depart
    gloss: departs, leaves
    note: '*حرکت کردن* is to depart. It is used for buses, trains and planes: *بس حرکت می‌کند* is the bus leaves.'
    example_gloss: The bus leaves at eight.
  prs.a2.unit38.lesson02.teach.ticket:
    title: Ticket
    gloss: ticket
    note: '*بلیت* is a ticket for a bus, a plane or a museum.'
    example_gloss: The ticket is in the office.
  prs.a2.unit38.lesson02.teach.why:
    title: Why
    gloss: why
    note: '*چرا* means why. In an embedded question it keeps its place: *نمی‌دانم که چرا دفتر بسته است.*'
    example_gloss: Why is the office closed?
  prs.a2.unit38.lesson02.teach.which:
    title: Which
    gloss: which
    note: '*کدام* means which and comes before the noun: *کدام بس* is which bus.'
    example_gloss: Which bus goes to Mazar?
  prs.a2.unit38.lesson02.teach.question_words:
    title: Question words after که
    gloss: I do not know how much the ticket is. I do not know why the office is closed. I do not know which bus goes to Mazar.
    note: 'Every question word of the direct question can follow *که*: *کجا* (where), *کی* (when), *ساعت چند* (what time), *چند* (how much), *چرا* (why), *کدام* (which). Each stays in its place and the rest of the sentence is a normal statement.'
  prs.a2.unit38.lesson03.teach.open:
    title: Open
    gloss: open
    note: '*باز* means open. *باز است* is it is open.'
    example_gloss: The museum is open today.
  prs.a2.unit38.lesson03.teach.closed:
    title: Closed
    gloss: closed
    note: '*بسته* means closed. *بانک* is a bank.'
    example_gloss: The bank is closed today.
  prs.a2.unit38.lesson03.teach.market:
    title: Market
    gloss: market, bazaar
    note: '*بازار* is the market or bazaar.'
    example_gloss: The market is near.
  prs.a2.unit38.lesson03.teach.yes_no:
    title: 'Yes or no questions: یا نه'
    gloss: Is the office open? Do you know whether the office is open or not?
    note: 'A yes or no question has no question word, so the embedded form adds *یا نه* (or not) at the end: *می‌دانین که دفتر باز است یا نه؟* is do you know whether the office is open or not? Here *که* and *یا نه* frame the clause. *یا نه* is the usual way to say whether in Dari.'
  prs.a2.unit38.lesson03.teach.yes_no_negative:
    title: I do not know whether
    gloss: I do not know whether the office is open or not.
    note: 'The statement form is the same: *نمی‌دانم که دفتر باز است یا نه.* Everything between *که* and *یا نه* is the ordinary sentence *دفتر باز است*.'
  prs.a2.unit38.lesson03.teach.aya:
    title: 'آیا: whether'
    gloss: Is the museum open? I do not know whether the museum is open or not.
    note: '*آیا* is a formal word that marks a yes or no question: *آیا موزیم باز است؟* In an embedded question you can add it after *که*, as in *که آیا موزیم باز است یا نه*, but you do not have to: *یا نه* is enough.'
  prs.a2.unit38.lesson03.teach.answer_yes_no:
    title: Yes, it is open. No, it is closed.
    gloss: Yes, it is open. No, it is closed.
    note: '*بلی* is yes and *نخیر* is no. A short answer repeats the adjective: *باز است* (it is open) or *بسته است* (it is closed).'
  prs.a2.unit38.lesson03.teach.know_open_today:
    title: Do you know whether it is open today?
    gloss: Do you know whether it is open today?
    note: 'When the place was already mentioned, you can leave it out: *امروز باز است* means it is open today.'
  prs.a2.unit38.lesson04.teach.excuse:
    title: Excuse me
    gloss: excuse me, sorry
    note: '*ببخشین* is excuse me. You say it to a stranger before you ask.'
    example_gloss: Excuse me, where is the office?
  prs.a2.unit38.lesson04.teach.staff:
    title: Employee
    gloss: employee, clerk
    note: '*کارمند* is an employee. At a counter or ticket window you often ask a *کارمند*.'
    example_gloss: The employee is in the office.
  prs.a2.unit38.lesson04.teach.polite_request:
    title: Can you tell me ...?
    gloss: Excuse me, can you tell me where the station is?
    note: To ask a stranger politely, use *می‌توانین بگویین که* (can you tell me) and put the direct question after it. It is a request, softer than *می‌دانین که*. *بگویین* is the polite command of *گفتن*.
  prs.a2.unit38.lesson04.teach.polite_more:
    title: Request with other questions
    gloss: Can you tell me how much the ticket is? Can you tell me whether the office is open or not?
    note: 'The same request works with every embedded question from this unit: *چند* (how much), *کی*, *کجا*, *چرا*, and the yes or no form with *یا نه*.'
  prs.a2.unit38.lesson04.teach.answer_politely:
    title: Answering politely
    gloss: Yes, I know. The station is near. Sorry, I do not know.
    note: To answer *می‌دانین که ...؟*, say *بلی، می‌دانم* and give the information, or *ببخشین، نمی‌دانم* if you do not know. You can also say *من هم نمی‌دانم* (I do not know either).
  prs.a2.unit38.lesson04.teach.me_neither:
    title: I do not know either
    gloss: I do not know either.
    note: '*هم* means also. With a negative verb it means either: *من هم نمی‌دانم* is I do not know either.'
  prs.a2.unit38.lesson05.teach.first:
    title: First
    gloss: first, at first
    note: '*اول* means first. *اول ... بعد ...* means first ... then ...'
    example_gloss: First I go to the bank.
  prs.a2.unit38.lesson05.teach.then:
    title: Then, afterwards
    gloss: then, afterwards
    note: '*بعد* means then or afterwards.'
    example_gloss: Then I go to the library.
  prs.a2.unit38.lesson05.teach.museum_turn01:
    title: Samir asks Samina where the museum is
    gloss: Samina, do you know where the museum is?
    note: Samir asks a friend, so he uses *می‌دانی*. The embedded question is *موزیم کجاست؟*.
  prs.a2.unit38.lesson05.teach.museum_turn02:
    title: Samina answers
    gloss: Yes, the museum is near the station.
    note: 'Samina says *بلی* and gives the information: *نزدیک ایستگاه است* (it is near the station).'
  prs.a2.unit38.lesson05.teach.museum_turn03:
    title: Samir asks the opening time
    gloss: Do you know what time it opens?
    note: The museum was already mentioned, so Samir leaves it out. *ساعت چند باز می‌شود* is the embedded question.
  prs.a2.unit38.lesson05.teach.museum_turn04:
    title: Samina does not know
    gloss: No, I do not know what time it opens.
    note: Samina repeats the embedded question after *نمی‌دانم که*. *نه* is a friendly no.
  prs.a2.unit38.lesson05.teach.museum_turn05:
    title: Samir asks whether it is open tomorrow
    gloss: Do you know whether it is open tomorrow or not?
    note: A yes or no question with *یا نه*. *فردا* is tomorrow.
  prs.a2.unit38.lesson05.teach.museum_turn06:
    title: Samina will phone first
    gloss: I do not know. First I will make a phone call.
    note: '*تیلفون می‌کنم* is I make a phone call. *اول* is first. She will phone before she answers.'
  prs.a2.unit38.lesson05.teach.message:
    title: A message from the market
    gloss: Hello Samina. Today I am in the market. Do you know where the bank is? I do not know whether the bank is near the market or not. Do you know whether the bank is open today or not? Then I go to the library.
    note: 'A short message that uses three indirect questions: where the bank is, whether it is near, and whether it is open. Notice that the first question is a question to a friend (*می‌دانی*) and the second is a statement (*نمی‌دانم که ... یا نه*).'
  prs.a2.unit38.lesson06.teach.gate:
    title: Gate, door
    gloss: gate, door
    note: '*دروازه* is a gate or a big door, for example the gate of a station or an office.'
    example_gloss: The gate is open.
  prs.a2.unit38.lesson06.teach.thousand:
    title: Thousand
    gloss: thousand
    note: '*هزار* is one thousand. *افغانی* is the Afghan money: *هزار افغانی* is a thousand afghanis.'
    example_gloss: The ticket is a thousand afghanis.
  prs.a2.unit38.lesson06.teach.station_turn01:
    title: Samir asks the clerk
    gloss: Excuse me, do you know when the bus to Mazar leaves?
    note: Samir speaks to a stranger, so he uses *ببخشین* and *می‌دانین*. *بس به مزار* is the bus to Mazar.
  prs.a2.unit38.lesson06.teach.station_turn02:
    title: The clerk answers
    gloss: Yes, I know. The bus leaves at eight.
    note: The clerk says *بلی، می‌دانم* and gives the time.
  prs.a2.unit38.lesson06.teach.station_turn03:
    title: Samir asks the price
    gloss: Can you tell me how much the ticket is?
    note: 'A polite request: *می‌توانین بگویین که* plus *بلیت چند است؟*.'
  prs.a2.unit38.lesson06.teach.station_turn04:
    title: The clerk gives the price
    gloss: The ticket is a thousand afghanis.
    note: A direct answer with no embedded question.
  prs.a2.unit38.lesson06.teach.station_turn05:
    title: Samir asks about the office
    gloss: Thank you. Do you know where the office is?
    note: '*تشکر* is thank you.'
  prs.a2.unit38.lesson06.teach.station_turn06:
    title: The clerk says where the office is
    gloss: The office is near the gate.
    note: '*نزدیک دروازه است* is it is near the gate.'
exercises:
  prs.a2.unit38.lesson01.exercise01.recognize_station:
    instruction: What does this sentence mean?
    correct_option: Do you know where the station is?
    distractors:
    - Where is the station?
    - I know where the station is
    - The station is near
    accepted_answers:
    - value: Do you know where the station is?
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* is do you know where the station is? It asks if the other person knows.'
  prs.a2.unit38.lesson01.exercise02.recognize_library_friend:
    instruction: What does this sentence mean?
    correct_option: Do you know where the library is? (to a friend)
    distractors:
    - Do you know where the library is? (polite)
    - I do not know where the library is
    - Is the library near?
    accepted_answers:
    - value: Do you know where the library is? (to a friend)
      status: correct
    feedback: '*می‌دانی* has the friend ending *-ی*: it is the same question for a friend.'
  prs.a2.unit38.lesson01.exercise03.match_forms:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        می‌دانم: I know
        می‌دانی: you know (to a friend)
        می‌داند: he or she knows
        می‌دانیم: we know
        می‌دانین: you know (polite or plural)
        می‌دانند: they know
        ایستگاه: station
        موزیم: museum
        کتابخانه: library
        دفتر: office
      status: correct
    feedback: 'Only the ending of *می‌دان-* changes: *-م* I, *-ی* you (friend), no ending he or she, *-یم* we, *-ین* you (polite or plural), *-ند* they.'
  prs.a2.unit38.lesson01.exercise04.order_do_you_know:
    instruction: 'Arrange the words to say: Do you know where the station is?'
    accepted_answers:
    - value:
      - می‌دانین
      - که
      - ایستگاه
      - کجاست
      status: correct
    feedback: '*می‌دانین که ایستگاه کجاست؟* puts the verb first, then *که*, then the direct question.'
  prs.a2.unit38.lesson01.exercise05.fill_where:
    instruction: 'Complete the sentence: Do you know where the museum is?'
    accepted_answers:
    - value: کجاست
      status: correct
    feedback: '*کجاست* is where is it. The direct question *موزیم کجاست؟* sits after *که*.'
  prs.a2.unit38.lesson01.exercise06.translate_museum:
    instruction: 'Translate into Dari, using می‌دانین: Do you know where the museum is?'
    accepted_answers:
    - value: می‌دانین که موزیم کجاست؟
      status: correct
    - value: می‌دانین موزیم کجاست؟
      status: correct
    feedback: '*می‌دانین که موزیم کجاست؟* is do you know where the museum is? *که* is optional.'
  prs.a2.unit38.lesson02.exercise01.recognize_dont_know_where:
    instruction: What does this sentence mean?
    correct_option: I do not know where the museum is
    distractors:
    - I know where the museum is
    - Where is the museum?
    - The museum is far
    accepted_answers:
    - value: I do not know where the museum is
      status: correct
    feedback: '*نمی‌دانم که موزیم کجاست.* is I do not know where the museum is.'
  prs.a2.unit38.lesson02.exercise02.recognize_dont_know_when:
    instruction: What does this sentence mean?
    correct_option: I do not know when the bus leaves
    distractors:
    - I know when the bus leaves
    - When does the bus leave?
    - The bus leaves at eight
    accepted_answers:
    - value: I do not know when the bus leaves
      status: correct
    feedback: '*کی* is when, and the verb *حرکت می‌کند* stays in the present.'
  prs.a2.unit38.lesson02.exercise03.match_embedded:
    instruction: Match each sentence with its meaning.
    accepted_answers:
    - value:
        می‌دانم که موزیم کجاست: I know where the museum is
        نمی‌دانم که موزیم کجاست: I do not know where the museum is
        نمی‌دانم که بس کی حرکت می‌کند: I do not know when the bus leaves
        نمی‌دانم که چرا دفتر بسته است: I do not know why the office is closed
        نمی‌دانم که کدام بس به مزار می‌رود: I do not know which bus goes to Mazar
        نمی‌دانم که بلیت چند است: I do not know how much the ticket is
      status: correct
    feedback: 'Each sentence is a frame (*می‌دانم که* or *نمی‌دانم که*) plus an unchanged direct question: where, when, why, which, how much.'
  prs.a2.unit38.lesson02.exercise04.order_when_leaves:
    instruction: 'Arrange the words to say: I do not know when the bus leaves.'
    accepted_answers:
    - value:
      - نمی‌دانم
      - که
      - بس
      - کی
      - حرکت
      - می‌کند
      status: correct
    feedback: '*نمی‌دانم که بس کی حرکت می‌کند.* keeps the order of the direct question after *که*.'
  prs.a2.unit38.lesson02.exercise05.fill_why:
    instruction: 'Complete the sentence: I do not know why the office is closed.'
    accepted_answers:
    - value: چرا
      status: correct
    feedback: '*چرا* is why. It stays right after *که*.'
  prs.a2.unit38.lesson02.exercise06.translate_what_time_opens:
    instruction: 'Translate into Dari: I do not know what time the museum opens.'
    accepted_answers:
    - value: نمی‌دانم که موزیم ساعت چند باز می‌شود.
      status: correct
    - value: نمی‌دانم موزیم ساعت چند باز می‌شود.
      status: correct
    - value: نمی‌دانم که موزیم کی باز می‌شود.
      status: correct
    - value: نمی‌دانم موزیم کی باز می‌شود.
      status: correct
    - value: نمی‌دانم که ساعت چند موزیم باز می‌شود.
      status: correct
    - value: نمی‌دانم ساعت چند موزیم باز می‌شود.
      status: correct
    feedback: '*نمی‌دانم که موزیم ساعت چند باز می‌شود.* is I do not know what time the museum opens. *کی* (when) is also fine, and *که* is optional.'
  prs.a2.unit38.lesson03.exercise01.recognize_whether_office:
    instruction: What does this sentence mean?
    correct_option: Do you know whether the office is open or not?
    distractors:
