course:
  title: Dari A1
  description: Beginner Kabul Dari for respectful everyday communication.

units:
  prs.a1.unit03.family:
    title: Family and relatives

lessons:
  prs.a1.unit03.lesson01.immediate_family: {title: "Immediate family members"}
  prs.a1.unit03.lesson02.extended_family: {title: "Relatives on your mother's and father's sides"}
  prs.a1.unit03.lesson03.family_size: {title: "How many people are in your family?"}
  prs.a1.unit03.lesson04.ask_about_family: {title: "Ask about someone else's family"}
  prs.a1.unit03.lesson05.marital_status: {title: "Marriage and marital status"}
  prs.a1.unit03.lesson06.family_dialogue: {title: "A conversation about Fereshteh's family"}

teaching:
  prs.a1.unit03.lesson01.teach.mother:
    title: Mother
    gloss: mother
    note: "مادر is the neutral Dari word for mother."
    example_gloss: "My mother is kind."
  prs.a1.unit03.lesson01.teach.father:
    title: Father
    gloss: father
    note: "پدر is the neutral Dari word for father."
    example_gloss: "My father is a doctor."
  prs.a1.unit03.lesson01.teach.brother:
    title: Brother
    gloss: brother
    note: "برادر means brother."
    example_gloss: "I have one brother."
  prs.a1.unit03.lesson01.teach.sister:
    title: Sister
    gloss: sister
    note: "خواهر means sister."
    example_gloss: "My sister is a teacher."
  prs.a1.unit03.lesson01.teach.parents:
    title: Parents
    gloss: father and mother; parents
    note: "Dari commonly says پدر و مادر when referring to one's parents."
    example_gloss: "My parents live in Kabul."
  prs.a1.unit03.lesson01.teach.my_mother:
    title: Identify your mother
    gloss: This is my mother.
    note: "The ending ـم on مادرم means my."

  prs.a1.unit03.lesson02.teach.grandfather:
    title: Grandfather
    gloss: grandfather
    note: "پدرکلان is the usual Afghan Dari term; literally, big or elder father."
    example_gloss: "My grandfather is old."
  prs.a1.unit03.lesson02.teach.grandmother:
    title: Grandmother
    gloss: grandmother
    note: "مادرکلان is the usual Afghan Dari term; literally, big or elder mother."
    example_gloss: "My grandmother is kind."
  prs.a1.unit03.lesson02.teach.paternal_uncle:
    title: Father's brother
    gloss: paternal uncle
    note: "کاکا specifically identifies your father's brother."
    example_gloss: "My uncle lives in Herat."
  prs.a1.unit03.lesson02.teach.paternal_aunt:
    title: Father's sister
    gloss: paternal aunt
    note: "عمه specifically identifies your father's sister."
    example_gloss: "My aunt is a teacher."
  prs.a1.unit03.lesson02.teach.maternal_uncle:
    title: Mother's brother
    gloss: maternal uncle
    note: "ماما specifically identifies your mother's brother in Dari."
    example_gloss: "My (maternal) uncle is an engineer."
  prs.a1.unit03.lesson02.teach.maternal_aunt:
    title: Mother's sister
    gloss: maternal aunt
    note: "خاله specifically identifies your mother's sister."
    example_gloss: "My (maternal) aunt lives in Kabul."
  prs.a1.unit03.lesson02.teach.side_distinction:
    title: Keep the two sides distinct
    gloss: Kaka and amma are paternal; mama and khala are maternal.
    note: "English aunt and uncle do not preserve the family-side distinction expressed by these four Dari words."

  prs.a1.unit03.lesson03.teach.family:
    title: Family
    gloss: family
    note: "فامیل is the ordinary Afghan Dari word for a family."
    example_gloss: "My family is big."
  prs.a1.unit03.lesson03.teach.how_many_people:
    title: Ask the family size politely
    gloss: How many people are in your family?
    note: "ـتان marks polite your; نفر is the counter for people."
  prs.a1.unit03.lesson03.teach.five_people:
    title: Give the family size
    gloss: There are five people in our family.
    note: "Dari states the family as a number of people with نفر است."
  prs.a1.unit03.lesson03.teach.have_siblings:
    title: Count your siblings
    gloss: I have one brother and two sisters.
    note: "دارم is I have. The noun remains singular after a number."
  prs.a1.unit03.lesson03.teach.only_child:
    title: Only child
    gloss: I am an only child.
    note: "استم is the Kabul Dari first-person form taught in this course."
  prs.a1.unit03.lesson03.teach.possession:
    title: Forms of to have
    gloss: I have; we have; you have
    note: "دارین is respectful or plural you have in educated colloquial Kabul Dari."

  prs.a1.unit03.lesson04.teach.have_siblings_question:
    title: Ask about siblings
    gloss: Do you have brothers and sisters?
    note: "دارین makes this respectful or plural."
  prs.a1.unit03.lesson04.teach.how_many_siblings:
    title: Ask how many siblings
    gloss: How many brothers and sisters do you have?
    note: "چند asks how many."
  prs.a1.unit03.lesson04.teach.parents_well:
    title: Ask after someone's parents
    gloss: Are your parents well?
    note: "جور استند is a familiar Afghan way to say they are well."
  prs.a1.unit03.lesson04.teach.yes_answer:
    title: Positive answer
    gloss: Yes, I have one brother.
    note: "بلی is the polite standard affirmative used in Afghanistan."
  prs.a1.unit03.lesson04.teach.no_answer:
    title: Negative answer
    gloss: No, I don't have a sister.
    note: "نخیر is the respectful negative; ندارم means I do not have."
  prs.a1.unit03.lesson04.teach.polite_your:
    title: Polite your
    gloss: your family; your mother; your father
    note: "The possessive ending ـتان is respectful or plural. This course joins it with a ZWNJ."

  prs.a1.unit03.lesson05.teach.married:
    title: Married
    gloss: married
    note: "متأهل is a neutral marital-status term."
    example_gloss: "He/she is married."
  prs.a1.unit03.lesson05.teach.single:
    title: Single
    gloss: single; unmarried
    note: "مجرد means unmarried in this context."
    example_gloss: "I am single."
  prs.a1.unit03.lesson05.teach.husband:
    title: Husband
    gloss: husband
    note: "شوهر is the ordinary word for husband."
    example_gloss: "My husband is an engineer."
  prs.a1.unit03.lesson05.teach.wife:
    title: Wife
    gloss: wife
    note: "خانم can mean wife or a politely addressed woman; context distinguishes them."
    example_gloss: "My wife is a teacher."
  prs.a1.unit03.lesson05.teach.marriage_question:
    title: Ask about marriage politely
    gloss: Are you married?
    note: "Literally, this asks Have you married? The ending ـین is the Kabul polite form."
  prs.a1.unit03.lesson05.teach.married_answer:
    title: State that you are married
    gloss: Yes, I am married.
    note: "استم is the Afghan Dari first-person copula used here."
  prs.a1.unit03.lesson05.teach.children:
    title: Ask about children
    gloss: Do you have children?
    note: "اولاد is a common collective word for one's child or children."

  prs.a1.unit03.lesson06.teach.turn01:
    title: Maryam asks about family size
    gloss: How many people are in your family?
    note: "Maryam uses respectful ـتان."
  prs.a1.unit03.lesson06.teach.turn02:
    title: Fereshteh describes her siblings
    gloss: There are five people. I have one brother and one sister.
    note: "The family members are counted with نفر."
  prs.a1.unit03.lesson06.teach.turn03:
    title: Maryam asks about marriage
    gloss: Are you married?
    note: "The question is polite and neutral in form."
  prs.a1.unit03.lesson06.teach.turn04:
    title: Fereshteh describes her husband
    gloss: Yes, I am married. My husband is a university student.
    note: "محصل, not Iranian دانشجو, is the established Afghan Dari word used here for student."
  prs.a1.unit03.lesson06.teach.turn05:
    title: Maryam asks about children
    gloss: Do you have children?
    note: "دارین maintains respectful address."
  prs.a1.unit03.lesson06.teach.turn06:
    title: Fereshteh answers
    gloss: No, we don't have children yet.
    note: "نخیر is respectful no; نداریم means we do not have."

exercises:
  prs.a1.unit03.lesson01.exercise01.recognize_mother:
    instruction: "Select the meaning of مادر."
    correct_option: mother
    distractors: [father, brother, sister]
    accepted_answers: [{value: mother, status: correct}]
    feedback: "مادر means mother."
  prs.a1.unit03.lesson01.exercise02.recognize_siblings:
    instruction: "Which pair means brother and sister?"
    correct_option: "برادر و خواهر"
    distractors: ["پدر و مادر", "کاکا و عمه", "ماما و خاله"]
    accepted_answers: [{value: "برادر و خواهر", status: correct}]
    feedback: "برادر and خواهر are brother and sister."
  prs.a1.unit03.lesson01.exercise03.match_immediate:
    instruction: "Match each immediate-family word to its meaning."
    accepted_answers:
      - value: {مادر: mother, پدر: father, برادر: brother, خواهر: sister}
        status: correct
    feedback: "These are the four immediate-family terms introduced here."
  prs.a1.unit03.lesson01.exercise04.order_parents:
    instruction: "Arrange the Dari expression for parents."
    accepted_answers: [{value: [پدر, و, مادر], status: correct}]
    feedback: "پدر و مادر literally says father and mother."
  prs.a1.unit03.lesson01.exercise05.translate_this_is_mother:
    instruction: "Translate into Dari: This is my mother."
    accepted_answers:
      - {value: "این مادرم است", status: correct}
      - {value: "این مادر من است", status: correct}
    feedback: "این مادرم است means this is my mother."
  prs.a1.unit03.lesson01.exercise06.translate_sister:
    instruction: "Translate into Dari: This is my sister."
    accepted_answers:
      - {value: "این خواهرم است", status: correct}
      - {value: "این خواهر من است", status: correct}
    feedback: "The possessive ending in خواهرم means my."
  prs.a1.unit03.lesson01.exercise07.speak_family_member:
    instruction: "Point to either a brother or sister in a photo and identify the person in Dari."
    accepted_answers:
      - {value: "این برادرم است", status: correct}
      - {value: "این خواهرم است", status: correct}
      - {value: "این برادر من است", status: correct}
      - {value: "این خواهر من است", status: correct}
    feedback: "Use این, the relationship with my, and است."

  prs.a1.unit03.lesson02.exercise01.recognize_grandparents:
    instruction: "Select the meaning of پدرکلان."
    correct_option: grandfather
    distractors: [grandmother, father, "paternal uncle"]
    accepted_answers: [{value: grandfather, status: correct}]
    feedback: "پدرکلان means grandfather in Afghan Dari."
  prs.a1.unit03.lesson02.exercise02.recognize_maternal_uncle:
    instruction: "Which relationship does ماما identify?"
    correct_option: "mother's brother"
    distractors: ["father's brother", "mother's sister", "father's sister"]
    accepted_answers: [{value: "mother's brother", status: correct}]
    feedback: "ماما is specifically a maternal uncle."
  prs.a1.unit03.lesson02.exercise03.match_sides:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {کاکا: "father's brother", عمه: "father's sister", ماما: "mother's brother", خاله: "mother's sister", مادر: mother, پدر: father, برادر: brother, خواهر: sister}
        status: correct
    feedback: "Dari preserves whether an aunt or uncle is on the father's or mother's side; the last four review lesson01's immediate family."
  prs.a1.unit03.lesson02.exercise04.order_grandmother:
    instruction: "Arrange: This is my grandmother."
    accepted_answers: [{value: [این, مادرکلان, من, است], status: correct}]
    feedback: "مادرکلان من means my grandmother."
  prs.a1.unit03.lesson02.exercise05.complete_uncle:
    instruction: "Complete: My mother's brother is my maternal uncle."
    accepted_answers:
      - {value: مامایم, status: correct}
      - {value: ماما, status: correct}
    feedback: "مامایم means my maternal uncle."
  prs.a1.unit03.lesson02.exercise06.translate_paternal_aunt:
    instruction: "Translate into Dari: She is my paternal aunt."
    accepted_answers:
      - {value: "او عمه‌ام است", status: correct}
      - {value: "او عمه ام است", status: acceptable_with_note, note: "Accepted keyboard spacing; standard spelling uses a ZWNJ."}
      - {value: "او عمهٔ من است", status: correct}
    feedback: "عمه identifies the father's sister."
  prs.a1.unit03.lesson02.exercise07.speak_distinction:
    instruction: "Explain the relationship, not a specific person: say that a paternal uncle (کاکا) is your father's brother, and a maternal uncle (ماما) is your mother's brother."
    accepted_answers:
      - {value: "کاکایم برادر پدرم است. مامایم برادر مادرم است.", status: correct}
      - {value: "کاکایم برادر پدرم است و مامایم برادر مادرم است", status: correct}
    feedback: "کاکا is on the father's side; ماما is on the mother's side."

  prs.a1.unit03.lesson03.exercise01.recognize_size:
    instruction: "How many people are in this family?"
    correct_option: five
    distractors: [four, six, seven]
    accepted_answers: [{value: five, status: correct}]
    feedback: "پنج نفر means five people."
  prs.a1.unit03.lesson03.exercise02.recognize_only_child:
    instruction: "Select the meaning of من تک‌فرزند استم."
    correct_option: "I am an only child."
    distractors: ["I have one child.", "I have one brother.", "We are one family."]
    accepted_answers: [{value: "I am an only child.", status: correct}]
    feedback: "تک‌فرزند means only child."
  prs.a1.unit03.lesson03.exercise03.match_have_forms:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {دارم: "I have", داریم: "we have", دارین: "you have (polite)", فامیل: family, "تک‌فرزند": "only child", "یک برادر و دو خواهر دارم": "I have one brother and two sisters."}
        status: correct
    feedback: "The endings distinguish I, we, and respectful or plural you; the last three show family vocabulary and دارم in a full sentence, all from this same lesson."
  prs.a1.unit03.lesson03.exercise04.order_size:
    instruction: "Arrange: There are six people in our family."
    accepted_answers: [{value: [فامیل, ما, شش, نفر, است], status: correct}]
    feedback: "فامیل ما شش نفر است gives a family size of six."
  prs.a1.unit03.lesson03.exercise05.complete_siblings:
    instruction: "Complete: I have one brother."
    accepted_answers: [{value: دارم, status: correct}]
    feedback: "دارم means I have."
  prs.a1.unit03.lesson03.exercise06.translate_size:
    instruction: "Translate into Dari: There are four people in our family."
    accepted_answers:
      - {value: "فامیل ما چهار نفر است", status: correct}
      - {value: "فامیل من چهار نفر است", status: acceptable_with_note, note: "This means there are four people in my family."}
    feedback: "Use the number with نفر است."
  prs.a1.unit03.lesson03.exercise07.describe_own:
    instruction: "Write two Dari sentences using these given facts: your family has four people, and you have one brother."
    accepted_answers:
      - {value: "فامیل من چهار نفر است. یک برادر دارم.", status: correct}
      - {value: "فامیل من چهار نفر است، یک برادر دارم.", status: correct}
      - {value: "فامیل من چهار نفر است و یک برادر دارم.", status: correct}
      - {value: "فامیل ما چهار نفر است. یک برادر دارم.", status: correct}
      - {value: "فامیل ما چهار نفر است و یک برادر دارم.", status: correct}
    feedback: "فامیل من چهار نفر است gives the size; یک برادر دارم adds the sibling fact."

  prs.a1.unit03.lesson04.exercise01.recognize_question:
    instruction: "What does برادر و خواهر دارین؟ ask?"
    correct_option: "Do you have brothers and sisters?"
    distractors: ["Are your parents well?", "How large is your family?", "Are you married?"]
    accepted_answers: [{value: "Do you have brothers and sisters?", status: correct}]
    feedback: "دارین means you have in respectful or plural address."
  prs.a1.unit03.lesson04.exercise02.recognize_negative:
    instruction: "Select the meaning of نخیر، خواهر ندارم."
    correct_option: "No, I don't have a sister."
    distractors: ["Yes, I have a sister.", "No, my sister isn't here.", "I have no brothers."]
    accepted_answers: [{value: "No, I don't have a sister.", status: correct}]
    feedback: "نخیر is no and ندارم is I do not have."
  prs.a1.unit03.lesson04.exercise03.match_answers:
    instruction: "Match each answer to its meaning."
    accepted_answers:
      - value: {"بلی": "yes", "نخیر": "no", "بلی، دارم": "yes, I have", "نخیر، ندارم": "no, I do not have"}
        status: correct
    feedback: "بلی affirms; نخیر gives the respectful negative -- both stand alone or combine with a fact."
  prs.a1.unit03.lesson04.exercise04.order_question:
    instruction: "Arrange the polite question: How many brothers and sisters do you have?"
    accepted_answers: [{value: [چند, برادر, و, خواهر, دارین], status: correct}]
    feedback: "چند introduces the quantity question."
  prs.a1.unit03.lesson04.exercise05.complete_polite:
    instruction: "Complete: How many people are in your family?"
    accepted_answers: [{value: نفر, status: correct}]
    feedback: "نفر counts people."
  prs.a1.unit03.lesson04.exercise06.translate_question:
    instruction: "Translate into Dari using respectful address: How many brothers do you have?"
    accepted_answers:
      - {value: "چند برادر دارین؟", status: correct}
      - {value: "چند برادر دارین", status: correct}
      - {value: "شما چند برادر دارین؟", status: correct}
      - {value: "شما چند برادر دارین", status: correct}
    feedback: "دارین is the Kabul Dari respectful form."
  prs.a1.unit03.lesson04.exercise07.ask_and_answer:
    instruction: "Reply politely that you have one sister."
    accepted_answers:
      - {value: "بلی، یک خواهر دارم", status: correct}
      - {value: "یک خواهر دارم", status: correct}
      - {value: "بلی، من یک خواهر دارم", status: correct}
      - {value: "من یک خواهر دارم", status: correct}
    feedback: "دارم agrees with the speaker: I have."

  prs.a1.unit03.lesson05.exercise01.recognize_married:
    instruction: "Select the meaning of متأهل استم."
    correct_option: "I am married."
    distractors: ["I am single.", "I have children.", "My husband is here."]
    accepted_answers: [{value: "I am married.", status: correct}]
    feedback: "متأهل means married."
  prs.a1.unit03.lesson05.exercise02.recognize_spouse:
    instruction: "Which pair means husband and wife?"
    correct_option: "شوهر و خانم"
    distractors: ["برادر و خواهر", "پدر و مادر", "کاکا و عمه"]
    accepted_answers: [{value: "شوهر و خانم", status: correct}]
    feedback: "شوهر is husband; خانم can mean wife in this context."
  prs.a1.unit03.lesson05.exercise03.match_status:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {متأهل: married, مجرد: single, شوهر: husband, خانم: wife, اولاد: children, محصل: student}
        status: correct
    feedback: "These words describe marital status, spouses, and children."
  prs.a1.unit03.lesson05.exercise04.order_marriage_question:
    instruction: "Arrange the polite marriage question."
    accepted_answers: [{value: [ازدواج, کردین], status: correct}]
    feedback: "ازدواج کردین؟ is a respectful way to ask whether someone is married."
  prs.a1.unit03.lesson05.exercise05.translate_am_single:
    instruction: "Translate into Dari: I am single."
    accepted_answers:
      - {value: "من مجرد استم", status: correct}
      - {value: "مجرد استم", status: correct}
      - {value: "من مجرد هستم", status: correct}
      - {value: "مجرد هستم", status: correct}
    feedback: "من مجرد استم means I am single."
  prs.a1.unit03.lesson05.exercise06.translate_husband:
    instruction: "Translate into Dari: My husband is a university student."
    accepted_answers:
      - {value: "شوهرم محصل است", status: correct}
      - {value: "شوهر من محصل است", status: correct}
    feedback: "محصل is the Afghan Dari term used here for a university student."
  prs.a1.unit03.lesson05.exercise07.speak_status:
    instruction: "Answer the question with either I am married or I am single."
