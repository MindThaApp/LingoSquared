course:
  title: Dari A1
  description: 'Beginner Kabul Dari: hobby and free-time vocabulary (reading, listening to music, watching movies, walking, cooking), asking what someone likes to do in their free time with دوست دارین, frequency with هر هفته/آخر هفته, and a Zarmina/Homayoun dialogue comparing how they spend their free time.'
units:
  prs.a1.unit26.hobbies:
    title: Hobbies
    description: Describe what you and others do for fun in your free time, and ask someone about theirs.
lessons:
  prs.a1.unit26.lesson01.hobby_vocabulary:
    title: Hobby words
  prs.a1.unit26.lesson02.free_time_question:
    title: Asking about free time
  prs.a1.unit26.lesson03.frequency:
    title: Every week and on weekends
  prs.a1.unit26.lesson04.hobbies_dialogue:
    title: Hobbies dialogue
  prs.a1.unit26.lesson05.reading_hobbies:
    title: Reading about hobbies
  prs.a1.unit26.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit26.lesson01.teach.hobby_word:
    title: Hobby
    gloss: hobby
    note: سرگرمی means hobby.
    example_gloss: Walking is my hobby.
  prs.a1.unit26.lesson01.teach.reading_word:
    title: Reading (books)
    gloss: reading (books)
    note: کتاب خواندن literally means "book reading" -- کتاب (book) + خواندن (reading).
    example_gloss: Reading is my hobby.
  prs.a1.unit26.lesson01.teach.music_word:
    title: Listening to music
    gloss: listening to music
    note: موسیقی گوش کردن literally means "music ear-doing" -- موسیقی (music, already introduced earlier in the course) + گوش (ear) + کردن (to do).
    example_gloss: Listening to music is my hobby.
  prs.a1.unit26.lesson01.teach.movie_word:
    title: Watching movies
    gloss: watching movies
    note: فلم دیدن literally means "film seeing" -- فلم (movie/film) + دیدن (seeing).
    example_gloss: Watching movies is my hobby.
  prs.a1.unit26.lesson01.teach.walking_word:
    title: Walking
    gloss: walking
    note: پیاده‌روی means walking (as an activity/exercise).
    example_gloss: Walking is my hobby.
  prs.a1.unit26.lesson01.teach.cooking_word:
    title: Cooking
    gloss: cooking
    note: آشپزی means cooking.
    example_gloss: Cooking is my hobby.
  prs.a1.unit26.lesson02.teach.free_word:
    title: Free
    gloss: free
    note: آزاد means free (as in "not busy," not "no cost").
    example_gloss: Today I am free.
  prs.a1.unit26.lesson02.teach.review_waqt:
    title: Time
    gloss: time
    note: وقت means time (already introduced earlier in the course).
  prs.a1.unit26.lesson02.teach.free_time_phrase:
    title: Free time
    gloss: free time
    note: وقت آزاد literally means "free time" -- وقت (time) + آزاد (free).
  prs.a1.unit26.lesson02.teach.chi_word:
    title: What
    gloss: what
    note: چی is the everyday spoken word for "what."
  prs.a1.unit26.lesson02.teach.review_dar:
    title: In
    gloss: in
    note: در means "in" or "at" (already introduced earlier in the course).
  prs.a1.unit26.lesson02.teach.review_like_reading:
    title: I like reading
    gloss: I like reading.
    note: Reviews دوست دارم (I like) with را, applied to this unit's کتاب خواندن.
  prs.a1.unit26.lesson02.teach.question_free_time:
    title: What do you like to do in your free time?
    gloss: What do you like to do in your free time?
    note: A common way to ask someone about their hobbies, using the polite دارین form (already introduced earlier in the course).
  prs.a1.unit26.lesson03.teach.review_har_ruz:
    title: Every day
    gloss: every day
    note: هر روز means every day (already introduced earlier in the course).
  prs.a1.unit26.lesson03.teach.review_hafta:
    title: Week
    gloss: week
    note: هفته means week (already introduced earlier in the course).
    example_gloss: Friday is the week's day off.
  prs.a1.unit26.lesson03.teach.har_hafta:
    title: Every week
    gloss: every week
    note: هر هفته literally means "every week" -- هر (every) + هفته (week).
  prs.a1.unit26.lesson03.teach.akher_word:
    title: End
    gloss: end
    note: آخر means end.
    example_gloss: I am free on the weekend.
  prs.a1.unit26.lesson03.teach.akher_hafta:
    title: Weekend
    gloss: weekend
    note: آخر هفته literally means "end of the week" -- آخر (end) + هفته (week).
  prs.a1.unit26.lesson03.teach.review_mikonam:
    title: I do
    gloss: I do
    note: می‌کنم means "I do" -- used with پیاده‌روی or آشپزی to say "I walk" or "I cook."
  prs.a1.unit26.lesson03.teach.walk_every_week:
    title: I walk every week
    gloss: I walk every week.
    note: Combines هر هفته with پیاده‌روی می‌کنم.
  prs.a1.unit26.lesson04.teach.review_pronouns_verb:
    title: I / you / do you do?
    gloss: I / you (informal) / do you do? (informal)
    note: من (I) and تو (you, informal) are review; می‌کنی is the informal "you do" form, matching the -ی pattern already seen with رفتی/کردی.
  prs.a1.unit26.lesson04.teach.review_connectors:
    title: Also / sometimes / and
    gloss: also / too / sometimes / and
    note: هم (also/too), گاهی (sometimes), and و (and) are all review from earlier in the course.
  prs.a1.unit26.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, what do you do in your free time?'
    gloss: 'Homayoun: Zarmina, what do you do in your free time?'
    note: An informal question between friends, using تو/-ی.
  prs.a1.unit26.lesson04.teach.dialogue_line2:
    title: 'Zarmina: I like reading, and I sometimes also listen to music'
    gloss: 'Zarmina: I like reading, and I sometimes also listen to music.'
    note: Combines two activities with و (and).
  prs.a1.unit26.lesson04.teach.dialogue_line3:
    title: 'Homayoun: I walk every week'
    gloss: 'Homayoun: I walk every week.'
    note: Reuses lesson03's walk_every_week sentence.
  prs.a1.unit26.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Good! I also like watching movies'
    gloss: 'Zarmina: Good! I also like watching movies.'
    note: Applies هم (also) to a new activity.
  prs.a1.unit26.lesson04.teach.dialogue_line5:
    title: 'Homayoun: I also sometimes cook'
    gloss: 'Homayoun: I also sometimes cook.'
    note: Applies گاهی (sometimes) and می‌کنم to آشپزی.
  prs.a1.unit26.lesson05.teach.reading_passage:
    title: Reading about hobbies
    gloss: Homayoun walks in his free time. Zarmina likes reading. She also sometimes cooks.
    note: A short reading passage recapping the unit's hobby words, reviewing او (he/she) and introducing the widely-used 3rd-person forms می‌کند (does) and دارد (has/likes).
  prs.a1.unit26.lesson06.teach.review_ama:
    title: But
    gloss: but
    note: اما means but (already introduced earlier in the course).
  prs.a1.unit26.lesson06.teach.review_hobby_word:
    title: Hobby (review)
    gloss: hobby
    note: سرگرمی means hobby (review from lesson01).
    example_gloss: Cooking is my hobby.
  prs.a1.unit26.lesson06.teach.wrap_summary:
    title: I walk in my free time, but I also sometimes like reading
    gloss: In my free time I walk, but I also sometimes like reading.
    note: Combines two hobby statements using اما.
