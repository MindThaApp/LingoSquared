course:
  title: Dari A1
  description: "Beginner Kabul Dari: talk about the four seasons, describe typical weather for each one, ask and state which season you like, and read a short passage about two people's favorite seasons."
units:
  prs.a1.unit39.seasons:
    title: Seasons
    description: Talk about the four seasons and describe typical weather or activities associated with each.
lessons:
  prs.a1.unit39.lesson01.primary_seasons:
    title: The four seasons
  prs.a1.unit39.lesson02.season_weather:
    title: Season weather
  prs.a1.unit39.lesson03.asking_about_seasons:
    title: Asking about seasons
  prs.a1.unit39.lesson04.seasons_dialogue:
    title: Seasons dialogue
  prs.a1.unit39.lesson05.seasons_reading:
    title: Reading about seasons
  prs.a1.unit39.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit39.lesson01.teach.review_basics:
    title: "Review: four, is, year"
    gloss: four / is / year
    note: "چهار, است, and سال are review words used to introduce this unit's season vocabulary."
  prs.a1.unit39.lesson01.teach.review_weather_connectors:
    title: "Review: weather, hot, cold, very, today, and, but"
    gloss: weather / hot / cold / very / today / and / but
    note: "هوا, گرم, سرد, خیلی, امروز, و, and اما are review words used throughout this unit's season sentences."
  prs.a1.unit39.lesson01.teach.fasl_word:
    title: Season
    gloss: season
    note: "فصل means season."
    example_gloss: There are four seasons in a year.
  prs.a1.unit39.lesson01.teach.bahar_word:
    title: Spring
    gloss: spring
    note: "بهار is the standard Dari word for spring."
    example_gloss: Spring is warm.
  prs.a1.unit39.lesson01.teach.tabestan_word:
    title: Summer
    gloss: summer
    note: "تابستان means summer."
    example_gloss: Summer is very hot.
  prs.a1.unit39.lesson01.teach.khonak_word:
    title: Cool
    gloss: cool
    note: "خنک means cool (temperature)."
    example_gloss: Today the weather is cool.
  prs.a1.unit39.lesson01.teach.khazan_word:
    title: Autumn/fall
    gloss: autumn / fall
    note: "خزان is the standard Afghan Dari word for autumn/fall -- Iranian Farsi more commonly uses پاییز instead."
    example_gloss: Autumn is cool.
  prs.a1.unit39.lesson01.teach.zemestan_word:
    title: Winter
    gloss: winter
    note: "زمستان means winter."
    example_gloss: Winter is cold.
  prs.a1.unit39.lesson01.teach.warm_seasons_phrase:
    title: Spring is warm and summer is very hot
    gloss: Spring is warm and summer is very hot.
    note: "و joins the two clauses describing each season's weather into one sentence."
  prs.a1.unit39.lesson01.teach.cool_cold_contrast_phrase:
    title: Autumn is cool, but winter is cold
    gloss: Autumn is cool, but winter is cold.
    note: "اما contrasts the weather of two different seasons in one sentence."
  prs.a1.unit39.lesson02.teach.review_in_becomes:
    title: "Review: in, becomes"
    gloss: in / becomes
    note: "در and می‌شود are review words used to describe how the weather changes in each season."
  prs.a1.unit39.lesson02.teach.review_rain_snow_sunny:
    title: "Review: rains/falls, rain, snow, sunny"
    gloss: falls/rains / rain / snow / sunny
    note: "می‌بارد, باران, برف, and آفتابی are review words used to describe each season's typical weather."
  prs.a1.unit39.lesson02.teach.rain_in_spring_phrase:
    title: In spring it rains
    gloss: In spring it rains.
    note: "در بهار باران می‌بارد literally says in spring, rain falls."
  prs.a1.unit39.lesson02.teach.hot_in_summer_phrase:
    title: In summer the weather becomes very hot
    gloss: In summer the weather becomes very hot.
    note: "می‌شود (becomes) describes a change in the weather across a season."
  prs.a1.unit39.lesson02.teach.cool_in_autumn_phrase:
    title: In autumn the weather becomes cool
    gloss: In autumn the weather becomes cool.
    note: "Same می‌شود construction applied to autumn's cooler weather."
  prs.a1.unit39.lesson02.teach.snow_in_winter_phrase:
    title: In winter it snows
    gloss: In winter it snows.
    note: "در زمستان برف می‌بارد literally says in winter, snow falls."
  prs.a1.unit39.lesson02.teach.sunny_summer_phrase:
    title: Summer is sunny
    gloss: Summer is sunny.
    note: "A simple است sentence describing summer's typical weather."
  prs.a1.unit39.lesson02.teach.cold_snow_winter_phrase:
    title: Winter is cold and it snows
    gloss: Winter is cold and it snows.
    note: "و combines two facts about winter's weather into one sentence."
  prs.a1.unit39.lesson03.teach.review_which_object_marker:
    title: "Review: which, object marker, I"
    gloss: which / object marker / I
    note: "کدام, را, and من (I) are review forms used to ask about and state season preference."
  prs.a1.unit39.lesson03.teach.review_like_forms:
    title: "Review: you like (formal), I like, I don't like"
    gloss: you like (formal) / I like / I don't like
    note: "دوست دارین, دوست دارم, and دوست ندارم are review forms of دوست داشتن (to like)."
  prs.a1.unit39.lesson03.teach.review_mahboob:
    title: "Review: favorite/popular"
    gloss: favorite / popular
    note: "محبوب is reused here to mean favorite."
  prs.a1.unit39.lesson03.teach.which_season_like_question_phrase:
    title: Which season do you like?
    gloss: Which season do you like?
    note: "کدام فصل را دوست دارین؟ literally asks which season [object marker] do-you-like?"
  prs.a1.unit39.lesson03.teach.favorite_season_spring_phrase:
    title: My favorite season is spring
    gloss: My favorite season is spring.
    note: "فصل محبوب من literally means my favorite season."
  prs.a1.unit39.lesson03.teach.dont_like_winter_phrase:
    title: I don't like winter
    gloss: I don't like winter.
    note: "دوست ندارم is the negative first-person form of دوست داشتن."
  prs.a1.unit39.lesson04.teach.review_dialogue_words:
    title: "Review: you (formal), yes"
    gloss: you (formal) / yes
    note: "شما and بلی are review words used in the seasons dialogue."
  prs.a1.unit39.lesson04.teach.dialogue_line1:
    title: "Homayoun: Zarmina, which season do you like?"
    gloss: Zarmina, which season do you like?
  prs.a1.unit39.lesson04.teach.dialogue_line2:
    title: "Zarmina: I like spring. Spring is warm and sunny."
    gloss: I like spring. Spring is warm and sunny.
  prs.a1.unit39.lesson04.teach.dialogue_line3:
    title: "Homayoun: My favorite season is winter."
    gloss: My favorite season is winter.
  prs.a1.unit39.lesson04.teach.dialogue_line4:
    title: "Zarmina: Winter? Winter is very cold!"
    gloss: Winter? Winter is very cold!
  prs.a1.unit39.lesson04.teach.dialogue_line5:
    title: "Homayoun: Yes, but I like snow."
    gloss: Yes, but I like snow.
  prs.a1.unit39.lesson04.teach.dialogue_line6:
    title: "Zarmina: I don't like snow."
    gloss: I don't like snow.
  prs.a1.unit39.lesson05.teach.review_reading_words:
    title: "Review: he/she, he/she likes"
    gloss: he/she / he/she likes
    note: "او and دوست دارد are review forms used in this reading passage."
  prs.a1.unit39.lesson05.teach.reading_passage:
    title: Reading about favorite seasons
    gloss: "Homayoun's favorite season is winter. Winter is cold and it snows. He likes snow. Zarmina's favorite season is spring. Spring is warm and sunny. She likes spring."
  prs.a1.unit39.lesson06.teach.review_like_dislike:
    title: "Review: I like, I don't like"
    gloss: I like / I don't like
    note: "دوست دارم and دوست ندارم are review forms used to contrast a liked and disliked season."
  prs.a1.unit39.lesson06.teach.contrast_phrase:
    title: I like winter, but I don't like summer
    gloss: I like winter, but I don't like summer.
    note: "اما contrasts a liked season with a disliked one in a single sentence."
  prs.a1.unit39.lesson06.teach.formal_question_phrase:
    title: Which season do you like?
    gloss: Which season do you like?
    note: "The formal شما-prefixed version of the question from lesson03, for a polite direct ask."
