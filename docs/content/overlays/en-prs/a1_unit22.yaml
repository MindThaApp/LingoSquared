course:
  title: Dari A1
  description: 'Beginner Kabul Dari: weather-condition vocabulary, asking/answering about today''s weather, temperature words, a tomorrow forecast, and a Zarmina/Homayoun dialogue where rain changes their plan.'
units:
  prs.a1.unit22.weather:
    title: The weather
    description: Describe current weather conditions and make a simple weather-related plan.
lessons:
  prs.a1.unit22.lesson01.weather_vocabulary:
    title: Weather words
  prs.a1.unit22.lesson02.snow_and_asking:
    title: Snow and asking about the weather
  prs.a1.unit22.lesson03.temperature:
    title: Hot and cold
  prs.a1.unit22.lesson04.tomorrow_forecast:
    title: Tomorrow's forecast
  prs.a1.unit22.lesson05.weather_changes_a_plan:
    title: Weather changes a plan
  prs.a1.unit22.lesson06.wrap_up_reading:
    title: Wrap-up reading
teaching:
  prs.a1.unit22.lesson01.teach.hawa:
    title: Weather
    gloss: weather
    note: هوا means weather (also means 'air').
    example_gloss: The weather is good today.
  prs.a1.unit22.lesson01.teach.aftabi:
    title: Sunny
    gloss: sunny
    note: آفتابی means sunny.
    example_gloss: The weather is sunny today.
  prs.a1.unit22.lesson01.teach.abri:
    title: Cloudy
    gloss: cloudy
    note: ابری means cloudy.
    example_gloss: The weather is cloudy today.
  prs.a1.unit22.lesson01.teach.baran:
    title: Rain
    gloss: rain
    note: باران means rain.
    example_gloss: It's raining.
  prs.a1.unit22.lesson01.teach.review_ast:
    title: Is / are
    gloss: is
    note: است (is) -- already familiar.
    example_gloss: The weather is sunny.
  prs.a1.unit22.lesson01.teach.review_emroz:
    title: Today
    gloss: today
    note: امروز (today) -- already familiar.
    example_gloss: The weather is cloudy today.
  prs.a1.unit22.lesson02.teach.barf:
    title: Snow
    gloss: snow
    note: برف means snow.
    example_gloss: It's snowing.
  prs.a1.unit22.lesson02.teach.chetor:
    title: How
    gloss: how
    note: چطور means how.
    example_gloss: How is the weather today?
  prs.a1.unit22.lesson02.teach.hawa_chetor_ast:
    title: How is the weather today?
    gloss: How is the weather today?
    note: امروز هوا چطور است؟ -- the standard way to ask about today's weather.
  prs.a1.unit22.lesson02.teach.mibarad:
    title: is falling / raining
    gloss: is falling
    note: می‌بارد is used for rain or snow 'falling'.
    example_gloss: It's raining today.
  prs.a1.unit22.lesson03.teach.garm:
    title: Hot
    gloss: hot
    note: گرم means hot.
    example_gloss: The weather is hot today.
  prs.a1.unit22.lesson03.teach.sard:
    title: Cold
    gloss: cold
    note: سرد means cold.
    example_gloss: The weather is cold today.
  prs.a1.unit22.lesson03.teach.ya:
    title: Or
    gloss: or
    note: یا means or.
    example_gloss: Is it hot or cold today?
  prs.a1.unit22.lesson03.teach.garm_ya_sard:
    title: Is it hot or cold today?
    gloss: Is it hot or cold today?
  prs.a1.unit22.lesson04.teach.review_farda:
    title: Tomorrow
    gloss: tomorrow
    note: فردا (tomorrow) -- already familiar from the plans unit.
    example_gloss: How will the weather be tomorrow?
  prs.a1.unit22.lesson04.teach.mishawad:
    title: will become
    gloss: will become
    note: می‌شود here means 'will become' (future weather change).
    example_gloss: It will get cold tomorrow.
  prs.a1.unit22.lesson04.teach.farda_chetor_mishawad:
    title: How will the weather be tomorrow?
    gloss: How will the weather be tomorrow?
  prs.a1.unit22.lesson05.teach.review_park:
    title: Park
    gloss: park
    note: پارک (park) -- already familiar.
    example_gloss: We're going to the park.
  prs.a1.unit22.lesson05.teach.behtar_ast:
    title: it's better
    gloss: it's better
    note: بهتر است introduces بهتر (better).
  prs.a1.unit22.lesson05.teach.dar_khana_bemanim:
    title: we stay home
    gloss: we stay home
    note: در خانه بمانیم introduces بمانیم (we stay/remain).
  prs.a1.unit22.lesson05.teach.review_pas:
    title: So
    gloss: so
    note: پس (so/then) -- already familiar.
    example_gloss: It's raining, so we're staying home.
  prs.a1.unit22.lesson05.teach.review_khana:
    title: House / home
    gloss: house
    note: خانه (house/home) -- already familiar from the housing unit.
    example_gloss: I'm at home.
  prs.a1.unit22.lesson05.teach.review_dar:
    title: In / at
    gloss: in/at
    note: در (in/at) -- already familiar.
    example_gloss: I'm at home.
  prs.a1.unit22.lesson05.teach.review_ba:
    title: To
    gloss: to
    note: به (to) -- already familiar.
    example_gloss: We're going to the park.
  prs.a1.unit22.lesson05.teach.review_mimanim:
    title: we stay
    gloss: we stay
    note: می‌مانیم (we stay) -- first-person-plural, an already-familiar conjugation pattern.
    example_gloss: We're staying home.
  prs.a1.unit22.lesson05.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: زرمینه (Zarmina) -- a recurring character in this course.
    example_gloss: Zarmina is going to the park.
  prs.a1.unit22.lesson05.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: همایون (Homayoun) -- a recurring character in this course.
    example_gloss: Homayoun is at home.
  prs.a1.unit22.lesson05.teach.turn01:
    title: Homayoun asks
    gloss: Zarmina, how will the weather be tomorrow?
    note: همایون (Homayoun) and زرمینه (Zarmina) are recurring characters in this course.
  prs.a1.unit22.lesson05.teach.turn02:
    title: Zarmina answers
    gloss: It will rain tomorrow.
  prs.a1.unit22.lesson05.teach.turn03:
    title: Homayoun reacts
    gloss: Rain? Then we can't go to the park.
    note: نمی‌توانیم (we can't) and برویم (we go) are introduced here.
  prs.a1.unit22.lesson05.teach.turn04:
    title: Zarmina agrees
    gloss: Yes, it's better to stay home.
  prs.a1.unit22.lesson05.teach.turn05:
    title: Homayoun suggests
    gloss: Good, we'll watch a film.
    note: فلم (film) and می‌بینیم (we watch/see) are introduced here.
  prs.a1.unit22.lesson06.teach.ama:
    title: But
    gloss: but
    note: اما means but.
    example_gloss: It's sunny today, but it will rain tomorrow.
  prs.a1.unit22.lesson06.teach.mimanand:
    title: they stay
    gloss: they stay
    note: می‌مانند is the third-person-plural form of 'to stay/remain'.
    example_gloss: Zarmina and Homayoun stay home.
  prs.a1.unit22.lesson06.teach.summary_text:
    title: A weather summary
    gloss: Today the weather is sunny and hot. But tomorrow it will rain and get cold. Zarmina and Homayoun stay home.
  prs.a1.unit22.lesson06.teach.review_va:
    title: And
    gloss: and
    note: و (and) -- already familiar.
    example_gloss: The weather is sunny and hot.
