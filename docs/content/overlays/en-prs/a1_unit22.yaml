    correct_option: weather
    distractors:
    - rain
    - snow
    - hot
    feedback: هوا means weather.
    accepted_answers:
    - value: weather
      status: correct
  prs.a1.unit22.lesson01.exercise02.recognize_aftabi:
    instruction: Select the correct translation.
    correct_option: sunny
    distractors:
