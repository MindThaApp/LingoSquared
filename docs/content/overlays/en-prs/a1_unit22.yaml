    - What is your size?
    - Where are you going?
    feedback: فردا هوا چطور می‌شود؟ means 'How will the weather be tomorrow?'
    accepted_answers:
    - value: How will the weather be tomorrow?
      status: correct
  prs.a1.unit22.lesson04.exercise02.recognize_mishawad_reading:
