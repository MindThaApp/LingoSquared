  prs.a1.unit22.lesson03.exercise02.recognize_sard:
    instruction: Select the correct translation.
    correct_option: cold
    distractors:
    - hot
    - snow
    - cloudy
    feedback: سرد means cold.
    accepted_answers:
    - value: cold
      status: correct
  prs.a1.unit22.lesson03.exercise03.recognize_temp_question_reading:
    instruction: Select the correct translation.
    correct_option: Is it hot or cold today?
    distractors:
    - Is this your size?
