    distractors:
    - is buying
    - is watching
    - is asking
    feedback: می‌بارد means 'is falling' (used for rain/snow).
    accepted_answers:
    - value: is falling
      status: correct
  prs.a1.unit22.lesson02.exercise04.match_snow_and_question:
