    correct_option: will become
    distractors:
    - is falling
    - is buying
    - is watching
    feedback: می‌شود here means 'will become'.
    accepted_answers:
    - value: will become
      status: correct
  prs.a1.unit22.lesson04.exercise03.match_forecast_phrases:
    instruction: Match each word or phrase to its meaning.
    accepted_answers:
    - value:
        فردا: tomorrow
        می‌شود: will become
        فردا هوا چطور می‌شود؟: How will the weather be tomorrow?
        گرم: hot
        سرد: cold
        آفتابی: sunny
      status: correct
  prs.a1.unit22.lesson04.exercise04.order_tomorrow_cold:
    instruction: Put the words in the correct order.
    accepted_answers:
    - فردا هوا سرد می‌شود
    feedback: The correct order is فردا هوا سرد می‌شود (It will get cold tomorrow).
  prs.a1.unit22.lesson04.exercise05.translate_forecast_question:
    instruction: Translate into Dari.
    accepted_answers:
    - فردا هوا چطور می‌شود
    - فردا هوا چطور می‌شود؟
    feedback: فردا هوا چطور می‌شود؟ means 'How will the weather be tomorrow?'
  prs.a1.unit22.lesson04.exercise06.write_own_forecast:
    instruction: Write a sentence about tomorrow's weather.
    accepted_answers:
    - فردا هوا سرد می‌شود
    - فردا هوا گرم می‌شود
    - فردا باران می‌بارد
    feedback: Any correct sentence about tomorrow's weather works.
  prs.a1.unit22.lesson05.exercise01.listen_context:
    instruction: Read the conversation. What is happening?
    correct_option: Rain will cancel their park trip, so they'll watch a film at home instead
    distractors:
    - They will go to the park despite the rain
    - Zarmina is buying an umbrella
    - Homayoun is asking about yesterday's weather
    feedback: Homayoun and زرمینه (Zarmina) change their plan because of tomorrow's rain -- they'll stay home and watch a film instead of going to the park.
    accepted_answers:
    - value: Rain will cancel their park trip, so they'll watch a film at home instead
      status: correct
  prs.a1.unit22.lesson05.exercise02.recognize_rain_forecast:
    instruction: Select the correct translation.
    correct_option: It's raining
    distractors:
    - It's snowing
    - It's sunny
    - It's cold
    feedback: باران می‌بارد means 'It's raining'.
    accepted_answers:
    - value: It's raining
      status: correct
  prs.a1.unit22.lesson05.exercise03.match_dialogue_facts:
    instruction: Match each word to its meaning.
    accepted_answers:
    - value:
        باران: rain
        پارک: park
        خانه: house
        فلم: film
        بهتر است: it's better
        بمانیم: we stay
        فردا: tomorrow
      status: correct
  prs.a1.unit22.lesson05.exercise04.order_better_to_stay:
    instruction: Put the words in the correct order.
    accepted_answers:
    - بهتر است در خانه بمانیم
    feedback: The correct order is بهتر است در خانه بمانیم (It's better to stay home).
  prs.a1.unit22.lesson05.exercise05.translate_cant_go_park:
    instruction: Translate into Dari.
    accepted_answers:
    - نمی‌توانیم به پارک برویم
    feedback: نمی‌توانیم به پارک برویم means 'We can't go to the park'.
  prs.a1.unit22.lesson05.exercise06.dialogue_response_suggest_alternative:
    instruction: Respond, suggesting they stay home and watch a film.
    accepted_answers:
    - بهتر است در خانه بمانیم. فلم می‌بینیم.
    - بهتر است در خانه بمانیم، فلم می‌بینیم.
    - بهتر است در خانه بمانیم و فلم می‌بینیم.
  prs.a1.unit22.lesson05.exercise07.write_plan_change_summary:
    instruction: Write a sentence summarizing the plan change.
    accepted_answers:
    - باران می‌بارد پس در خانه می‌مانیم. فلم می‌بینیم.
    - باران می‌بارد پس در خانه می‌مانیم، فلم می‌بینیم.
    - باران می‌بارد پس در خانه می‌مانیم و فلم می‌بینیم.
  prs.a1.unit22.lesson05.exercise08.speak_full_weather_scene:
    instruction: 'Say the full exchange: ask about tomorrow''s weather, hear it will rain, and suggest staying home.'
    accepted_answers:
    - فردا هوا چطور می‌شود؟ باران می‌بارد پس بهتر است در خانه بمانیم.
  prs.a1.unit22.lesson06.exercise01.reading_comprehension_today:
    instruction: Select the correct translation.
    correct_option: sunny and hot
    distractors:
    - cloudy and cold
    - rain and snow
    - hot and windy
    feedback: آفتابی و گرم means 'sunny and hot' -- today's weather in the reading.
    accepted_answers:
    - value: sunny and hot
      status: correct
  prs.a1.unit22.lesson06.exercise02.reading_comprehension_tomorrow:
    instruction: Select the correct translation.
    correct_option: it will rain and get cold
    distractors:
    - it will snow and get hot
    - it will stay sunny
    - it will stay cloudy
    feedback: باران می‌بارد و سرد می‌شود means 'it will rain and get cold' -- tomorrow's forecast in the reading.
    accepted_answers:
    - value: it will rain and get cold
      status: correct
  prs.a1.unit22.lesson06.exercise03.match_summary_vocab:
    instruction: Match each word to its meaning.
    accepted_answers:
    - value:
        آفتابی: sunny
        گرم: hot
        باران: rain
        سرد: cold
        اما: but
        می‌مانند: they stay
        امروز: today
      status: correct
  prs.a1.unit22.lesson06.exercise04.translate_summary_sentence:
    instruction: Translate into Dari.
    accepted_answers:
    - امروز هوا آفتابی و گرم است
    feedback: امروز هوا آفتابی و گرم است means 'Today the weather is sunny and hot'.
  prs.a1.unit22.lesson06.exercise05.write_own_weather_summary:
    instruction: Write a short weather summary like the reading.
    accepted_answers:
    - امروز هوا آفتابی و گرم است اما فردا باران می‌بارد و سرد می‌شود
    - امروز هوا آفتابی و گرم است، اما فردا باران می‌بارد و سرد می‌شود
    - امروز هوا آفتابی و گرم است. اما فردا باران می‌بارد و سرد می‌شود.
