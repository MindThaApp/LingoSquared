    - value:
        گرم: hot
        سرد: cold
        یا: or
        امروز گرم است یا سرد؟: Is it hot or cold today?
        برف: snow
        باران: rain
        آفتابی: sunny
      status: correct
  prs.a1.unit22.lesson03.exercise05.order_temp_question:
    instruction: Put the words in the correct order.
    accepted_answers:
    - امروز گرم است یا سرد
