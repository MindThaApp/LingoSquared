    - امروز هوا آفتابی است
    feedback: Any correct sentence using هوا works.
  prs.a1.unit22.lesson02.exercise01.recognize_barf:
    instruction: Select the correct translation.
    correct_option: snow
    distractors:
    - rain
    - sunny
    - cloudy
