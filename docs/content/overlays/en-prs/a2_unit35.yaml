  prs.a2.unit35.lesson05.exercise05.match_steps_in_order:
    instruction: Match each Dari phrase with its meaning.
    accepted_answers:
    - value:
        قبل از اینکه به میدان هوایی بروم: before I go to the airport
        بعد از اینکه آب جوش شد: after the water boiled
        وقتی که برسم: when I arrive
        قبل از اینکه بخوابم: before I go to sleep
        بعد از اینکه پیاز را خرد کردم: after I chopped the onion
        وقتی که برنج آماده شد: when the rice was ready
        اول پیاز را خرد کردم: first I chopped the onion
      status: correct
    feedback: Each phrase is one of the three connectors with its verb. After *قبل از اینکه* and *وقتی که* referring to a future event (such as *وقتی که برسم*) the verb is subjunctive, and after *بعد از اینکه* it is the simple past.
