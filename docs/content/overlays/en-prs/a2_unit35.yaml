  notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 34-39 pass): 2 fixes - (1) lesson06 exercise03 which_first_breakfast: the distractor I take a shower is, in this lesson''s own dialogue, the step Yusuf does before breakfast, so it was defensibly correct for What happens first?; replaced with I read the news. (2) lesson03 teach.noun_or_clause note said the verb after بعد از اینکه is past, contradicting the habit present the unit teaches in lesson02 and lesson06; now says past in a story, present with می‌ for a habit. Also checked every instruction against its answer data, every distractor and gloss, and the accepted_answers against grading (punctuation and one optional subject pronoun per clause are folded by the grader; بلیط/بلیت fold to تکت). No missing variant found for forms the course teaches. Paired with prs/a2_unit35_before_after_when.yaml (see that file''s review notes for the full rationale, the character canon check and the open questions for a native Dari reviewer). Every multi-clause production answer enumerates comma, no-comma and swapped-clause variants, optional من, and وقتی alone for وقتی که (AUTHORING_GUIDE section 12). Every note and feedback string that mixes Dari with English wraps the Dari in single asterisks (section 15). Each example_gloss matches its realization example (section 19). Production prompts name the form they want and the feedback shows an accepted string. The two listening items show the full transcript in the prompt (prs has no TTS) and their distractors were hand-checked against both dialogues and the reading, at meaning level as well as verbatim. status: unreviewed; the mandatory fresh-context review has not run.'
course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: putting events in order with time clauses, for example before I left, after I arrived and when the water boiled. Before and after with a noun, بعد از اینکه with the past, قبل از اینکه with the subjunctive, and وقتی که.'
units:
  prs.a2.unit35.before_after_when:
    title: Before, after, when
lessons:
  prs.a2.unit35.lesson01.before_after_nouns:
    title: Before and after with a noun
  prs.a2.unit35.lesson02.after_clause_travel:
    title: After a clause and travel jobs
  prs.a2.unit35.lesson03.before_clause_cooking:
    title: Before a clause and cooking
  prs.a2.unit35.lesson04.when_clause:
    title: When
  prs.a2.unit35.lesson05.reading_and_listening:
    title: Reading and listening about rice and a trip
  prs.a2.unit35.lesson06.morning_conversation:
    title: A conversation about the morning
teaching:
  prs.a2.unit35.lesson01.teach.before:
    title: Before
    gloss: before (with a noun)
    note: '*قبل از* means before. After it comes a noun and no verb of its own: *قبل از صبحانه* is before breakfast.'
    example_gloss: Before breakfast I take a shower.
  prs.a2.unit35.lesson01.teach.after:
    title: After
    gloss: after (with a noun)
    note: '*بعد از* means after, and it also takes a noun: *بعد از مکتب* is after school.'
    example_gloss: After school I go home.
  prs.a2.unit35.lesson01.teach.dinner:
    title: Dinner
    gloss: dinner, the evening meal
    note: '*شام* is dinner. *می‌خورم* is I eat or I drink: *شام می‌خورم* is I eat dinner and *چای می‌خورم* is I drink tea. Dari uses one verb for both.'
    example_gloss: After dinner I drink tea.
  prs.a2.unit35.lesson01.teach.get_dressed:
    title: To get dressed
    gloss: to put on clothes, to get dressed
    note: '*لباس* is clothes and *پوشیدن* is to put on. *لباس می‌پوشم* is I put on my clothes; *می‌پوشم* is the present form for I.'
    example_gloss: Every morning I get dressed.
  prs.a2.unit35.lesson01.teach.wake_up:
    title: To wake up
    gloss: to wake up
    note: '*بیدار شدن* is to wake up. *شدن* means to become, so *بیدار می‌شوم* is I wake up, or I become awake.'
    example_gloss: I wake up at six o'clock.
  prs.a2.unit35.lesson01.teach.noun_pattern:
    title: Before and after with a noun
    gloss: before breakfast, after breakfast, before school, after school, before dinner, after dinner
    note: 'Put a noun right after *قبل از* or *بعد از* to say when something happens: *قبل از صبحانه* (before breakfast), *بعد از مکتب* (after school). The phrase has no verb of its own; the verb comes in the main part of the sentence. The phrase can start the sentence (*بعد از شام چای می‌خورم*) or come at the end (*چای می‌خورم بعد از شام*).'
  prs.a2.unit35.lesson01.teach.sequence_words:
    title: First, then, after that, finally
    gloss: First I wake up. Then I take a shower. After that I eat breakfast. At the end I go to school.
    note: 'To tell a day in order, use short linking words: *اول* (first), *بعد* (then), *بعد از آن* (after that) and *در آخر* (finally, at the end). *بعد از آن* is *بعد از* with *آن* (that) as its noun, so it points back to the step you just named.'
  prs.a2.unit35.lesson01.teach.phrase_school:
    title: After breakfast I go to school
    gloss: After breakfast I go to school.
    note: The noun *صبحانه* follows *بعد از*, and the verb *می‌روم* comes at the end. This is the simplest way to say what comes after what.
  prs.a2.unit35.lesson02.teach.ticket:
    title: Ticket
    gloss: ticket (plane or bus)
    note: '*تکت* is a ticket for a plane or a bus. *تکت گرفتن* is to get or buy a ticket.'
    example_gloss: I got the plane ticket.
  prs.a2.unit35.lesson02.teach.suitcase:
    title: Suitcase
    gloss: suitcase
    note: '*چمدان* is a suitcase. Add *-م* for my: *چمدانم* is my suitcase.'
    example_gloss: My suitcase is at home.
  prs.a2.unit35.lesson02.teach.pack:
    title: I packed my suitcase
    gloss: I packed my suitcase.
    note: '*چمدان را بستن* is to pack a suitcase (the verb is the same *بستن* as in *دروازه بسته است*). The suitcase comes first, then *را*, then the verb: *بستم* is the simple past for I.'
  prs.a2.unit35.lesson02.teach.after_past:
    title: بعد از اینکه + past
    gloss: After I got the ticket, I packed my suitcase.
    note: '*بعد از اینکه* means after and it starts a clause with its own verb. When you tell a story in the past, that verb is the simple past: *بعد از اینکه تکت را گرفتم* is after I got the ticket. The main clause then says what came next: *چمدانم را بستم*. The event in the *بعد از اینکه* clause happened first.'
  prs.a2.unit35.lesson02.teach.after_habit:
    title: بعد از اینکه for habits
    gloss: After I get to the station, I get a ticket.
    note: 'For something you do again and again, put the verb in the present with *می‌*: *بعد از اینکه به ایستگاه می‌رسم* is after I get to the station, and *تکت می‌گیرم* is I get a ticket. *می‌رسم* is the present of *رسیدن* for I.'
  prs.a2.unit35.lesson02.teach.swap:
    title: The clauses can swap places
    gloss: I packed my suitcase, after I got the ticket.
    note: 'You can say the *بعد از اینکه* clause second. The meaning does not change: the event in the *بعد از اینکه* clause still happened first. Only the order of the words changes, not the order of the events.'
  prs.a2.unit35.lesson02.teach.noun_or_clause:
    title: Noun or clause
    gloss: after dinner / after I ate dinner
    note: Use *بعد از* with a noun and *بعد از اینکه* with a whole clause. *بعد از شام* is after dinner. *بعد از اینکه شام خوردم* is after I ate dinner. The second one has a verb, so it can also say who did it.
  prs.a2.unit35.lesson02.teach.phrase_station:
    title: After I arrived at the station, I phoned
    gloss: After I arrived at the station, I made a phone call.
    note: 'A real travel sequence: first *رسیدم* (arriving), then *تیلفون کردم* (the phone call). *تیلفون کردن* is the usual way to say to make a phone call.'
  prs.a2.unit35.lesson03.teach.subjunctive_forms:
    title: قبل از اینکه + subjunctive
    gloss: before I arrive, before I go, before I eat, before I come, before I buy
    note: '*قبل از اینکه* means before and it starts a clause with its own verb. This verb is not in the past. It is the subjunctive, the same form you use after *باید*: *ب-* plus the present stem plus the ending. *رسیدن* gives *برسم*, *رفتن* gives *بروم*, *خوردن* gives *بخورم*, *آمدن* gives *بیایم*, *خریدن* gives *بخرم*.'
  prs.a2.unit35.lesson03.teach.subjunctive_paradigm:
    title: The subjunctive endings
    gloss: that I arrive, that you arrive, that he/she arrives, that we arrive, that you arrive (formal or plural), that they arrive
    note: The endings are *-م، -ی، -د، -یم، -ین، -ند*. So *قبل از اینکه من برسم* is before I arrive, *قبل از اینکه تو برسی* before you arrive (to a friend), *قبل از اینکه او برسد* before he or she arrives, *قبل از اینکه ما برسیم* before we arrive, *قبل از اینکه شما برسین* before you arrive (formal or plural), *قبل از اینکه آن‌ها برسند* before they arrive. The second-person plural ends in *-ین* in Dari; written *-ید* is also understood.
  prs.a2.unit35.lesson03.teach.past_story:
    title: Even in a past story
    gloss: Before I left home, I packed my suitcase.
    note: 'The story is in the past, so you expect a past verb after *قبل از اینکه*. But you use the subjunctive: *بروم*, not *رفتم*. The reason is that at the moment of packing, the leaving had not happened yet. Do not say *قبل از اینکه رفتم* or *قبل از اینکه می‌روم* for this. The main clause is in the simple past: *چمدانم را بستم*.'
  prs.a2.unit35.lesson03.teach.noun_or_clause:
    title: Noun or clause
    gloss: before dinner / before I eat dinner
    note: 'With a noun use *قبل از*: *قبل از شام*. With a clause, add *اینکه* and put the verb in the subjunctive: *قبل از اینکه شام بخورم*. This mirrors *بعد از شام* and *بعد از اینکه شام خوردم*, except that after *بعد از اینکه* the verb is past in a story (present with *می‌* for a habit), and after *قبل از اینکه* it is subjunctive.'
  prs.a2.unit35.lesson03.teach.rice:
    title: Rice
    gloss: rice
    note: '*برنج* is rice. It is one of the main foods in Afghan cooking.'
    example_gloss: I eat rice.
  prs.a2.unit35.lesson03.teach.onion:
    title: Onion
    gloss: onion
    note: '*پیاز* is an onion. Many dishes start with onions.'
    example_gloss: There are onions at home.
  prs.a2.unit35.lesson03.teach.chop:
    title: To chop
    gloss: to chop, to cut into small pieces
    note: '*خرد کردن* is to chop something into small pieces. The thing comes first with *را*: *پیاز را خرد می‌کنم* is I chop the onion.'
    example_gloss: I chop the onion.
  prs.a2.unit35.lesson03.teach.cook:
    title: To cook
    gloss: to cook
    note: '*پختن* is to cook food. The present stem is *پز*: *می‌پزم* is I cook, *بپزم* is that I cook (the subjunctive, used after *قبل از اینکه*), and *پختم* is I cooked.'
    example_gloss: I cook rice.
  prs.a2.unit35.lesson03.teach.sleep:
    title: To sleep
    gloss: to sleep, to go to sleep
    note: '*خوابیدن* is to sleep or to go to bed. *می‌خوابم* is I sleep, and *بخوابم* is that I sleep (the subjunctive).'
    example_gloss: I go to sleep at ten o'clock.
  prs.a2.unit35.lesson03.teach.phrase_cook:
    title: Before I cook the rice, I chop the onion
    gloss: Before I cook the rice, I chop the onion.
    note: 'A cooking step in order. *بپزم* is the subjunctive after *قبل از اینکه*; *خرد می‌کنم* is the present for a habit or a recipe: first the onion, then the rice.'
  prs.a2.unit35.lesson04.teach.when_past:
    title: وقتی که for one event in the past
    gloss: When I got home, I ate dinner.
    note: '*وقتی که* means when and starts a clause with its own verb. For one event in the past, use the simple past in both parts: *وقتی که به خانه رسیدم* (when I got home), *شام خوردم* (I ate dinner). The two events happen at about the same time or one right after the other.'
  prs.a2.unit35.lesson04.teach.when_habit:
    title: وقتی که for a habit
    gloss: When I get home, I drink tea.
    note: 'For something that happens every time, use the present with *می‌* in both parts: *وقتی که به خانه می‌رسم، چای می‌خورم* is when I get home, I drink tea.'
  prs.a2.unit35.lesson04.teach.when_future:
    title: وقتی که for something still to come
    gloss: Tomorrow, when I arrive in Herat, I will phone.
    note: 'When the time is still to come, the verb after *وقتی که* is the subjunctive (*برسم*) and the main verb is the present with *می‌* plus a time word: *فردا ... تیلفون می‌کنم* (tomorrow I phone, so I will phone). You do not need a special future form.'
  prs.a2.unit35.lesson04.teach.water:
    title: Water
    gloss: water
    note: '*آب* is water. Cold water is *آب سرد*; for hot water say *آب گرم*.'
    example_gloss: The water is hot.
  prs.a2.unit35.lesson04.teach.boil:
    title: To boil
    gloss: to boil (of water)
    note: '*جوش شدن* is to boil. The simple past is *جوش شد* and the present is *جوش می‌شود*: *آب جوش می‌شود* is the water boils.'
    example_gloss: The water boiled.
  prs.a2.unit35.lesson04.teach.salt:
    title: Salt
    gloss: salt
    note: '*نمک* is salt. It goes together with *برنج* and *آب* in a simple recipe.'
    example_gloss: There is salt and rice at home.
  prs.a2.unit35.lesson04.teach.throw_in:
    title: To put in
    gloss: to throw in, to put in
    note: '*انداختن* is to throw or to put something in. In cooking it is the usual verb for adding something: *نمک را می‌اندازم* is I put in the salt. The simple past is *انداختم*.'
    example_gloss: I put the salt into the water.
  prs.a2.unit35.lesson04.teach.phrase_boil:
    title: When the water boils, I put in the rice
    gloss: When the water boils, I put in the rice.
    note: 'A habit in a recipe: both verbs are in the present with *می‌*.'
  prs.a2.unit35.lesson04.teach.when_short:
    title: وقتی که or just وقتی
    gloss: when I arrived / when I arrived
    note: Both forms are correct. *وقتی که* is a little fuller and *وقتی* alone is shorter, and the meaning is the same. The course uses *وقتی که* first; you may type either.
  prs.a2.unit35.lesson04.teach.phrase_ready:
    title: When the rice was ready, I ate it
    gloss: When the rice was ready, I ate it.
    note: '*آماده شد* is it became ready. *آن را* (it, with *را*) points back to the rice.'
  prs.a2.unit35.lesson05.teach.pack_present:
    title: To pack a suitcase
    gloss: to pack a suitcase
    note: '*چمدان بستن* is to pack a suitcase. The present for I is *می‌بندم*: *چمدانم را می‌بندم* is I pack my suitcase. The simple past is *بستم*.'
    example_gloss: Before a trip I pack my suitcase.
  prs.a2.unit35.lesson05.teach.travel_turn01:
    title: Narges asks about the flight time
    gloss: Akbar, what time does the plane leave tomorrow?
    note: Narges asks about the time with *ساعت چند*. *حرکت می‌کند* is the present of *حرکت کردن* (to depart); with *فردا* it says what will happen tomorrow.
  prs.a2.unit35.lesson05.teach.travel_turn02:
    title: Akbar gives the time and a first step
    gloss: At ten. Before I go to the airport, I pack my suitcase.
    note: Akbar gives the time, then says what he does first with a *قبل از اینکه* clause. *بروم* is the subjunctive, and *می‌بندم* is the present with a future meaning.
  prs.a2.unit35.lesson05.teach.travel_turn03:
    title: Narges asks about the ticket
    gloss: Do you have a ticket?
    note: '*تکت داری؟* is a friendly question to a friend: *داری* is you have, in the informal singular.'
  prs.a2.unit35.lesson05.teach.travel_turn04:
    title: Akbar says he has the ticket
    gloss: Yes, I got the ticket yesterday.
    note: '*گرفتم* is the simple past: he got the ticket yesterday. *بلی* is yes.'
  prs.a2.unit35.lesson05.teach.travel_turn05:
    title: Narges asks him to phone when he arrives
    gloss: When you arrive in Herat, will you phone me?
    note: The clause *وقتی که به هرات برسی* is still to come, so the verb is the subjunctive *برسی* (you arrive). *به من تیلفون می‌کنی؟* is will you phone me?
  prs.a2.unit35.lesson05.teach.travel_turn06:
    title: Akbar promises
    gloss: Yes. When I arrive, I will phone.
    note: 'Akbar uses the same pattern: *وقتی که برسم*, subjunctive for I, then *تیلفون می‌کنم*.'
  prs.a2.unit35.lesson05.teach.message:
    title: A message about cooking rice
    gloss: Hello Akbar. Yesterday I cooked rice at home. First I chopped the onion. After the water boiled, I put in the salt and the rice. When the rice was ready, I ate it. Before I went to sleep, I drank tea.
    note: 'A short written message that uses all three connectors to tell the steps in order: *اول*, *بعد از اینکه*, *وقتی که* and *قبل از اینکه*.'
  prs.a2.unit35.lesson06.teach.work_my:
    title: My work
    gloss: my work, my job
    note: '*کار* is work and *کارم* is my work. *کارم را شروع می‌کنم* is I start my work.'
    example_gloss: My work is in the office.
  prs.a2.unit35.lesson06.teach.morning_turn01:
    title: Nasrin asks when Yusuf wakes up
    gloss: Yusuf, what time do you wake up every morning?
    note: '*هر صبح* is every morning. *چه وقت* asks when, and *بیدار می‌شوی* is you wake up (to a friend).'
  prs.a2.unit35.lesson06.teach.morning_turn02:
    title: Yusuf gives the time and a first step
    gloss: At six. After I wake up, I take a shower.
    note: 'A habit, so the verbs after *بعد از اینکه* are in the present with *می‌*: *بیدار می‌شوم*, then *دوش می‌گیرم*.'
  prs.a2.unit35.lesson06.teach.morning_turn03:
    title: Nasrin asks what comes next
    gloss: What do you do after that?
    note: '*بعد از آن* is after that. It points back to the step just named.'
  prs.a2.unit35.lesson06.teach.morning_turn04:
    title: Yusuf says the next steps
    gloss: I get dressed. Before I go to the office, I eat breakfast.
    note: '*لباس می‌پوشم* is the next step. Then a *قبل از اینکه* clause: *بروم* is the subjunctive and *صبحانه می‌خورم* is the main verb.'
  prs.a2.unit35.lesson06.teach.morning_turn05:
    title: Nasrin asks about the office time
    gloss: What time do you go to the office?
    note: '*ساعت چند* asks for the time and *می‌روی* is you go.'
  prs.a2.unit35.lesson06.teach.morning_turn06:
    title: Yusuf says what he does at the office
    gloss: At eight. When I get there, I start my work first.
    note: '*وقتی که می‌رسم* is when I arrive (a habit: every day), and *اول کارم را شروع می‌کنم* is first I start my work.'
  prs.a2.unit35.lesson06.teach.summary:
    title: The three connectors together
    gloss: before I go; after I arrived; when I arrived
    note: 'Three connectors, three patterns. *قبل از اینکه* + subjunctive (*بروم*): the verb is the form with *ب-*. *بعد از اینکه* + simple past (*رسیدم*) in a story, or the present for a habit (*بیدار می‌شوم*): the first event is finished. *وقتی که* + simple past, present or subjunctive: the tense shows whether it was one time, a habit or still to come. With a noun you use *قبل از* or *بعد از* alone.'
exercises:
  prs.a2.unit35.lesson01.exercise01.recognize_before_breakfast:
    instruction: What does this sentence mean?
    correct_option: Before breakfast I take a shower
    distractors:
    - After breakfast I take a shower
    - Before dinner I take a shower
    - I take a shower every evening
    accepted_answers:
    - value: Before breakfast I take a shower
      status: correct
    feedback: '*قبل از صبحانه دوش می‌گیرم* is before breakfast I take a shower: *قبل از* means before.'
  prs.a2.unit35.lesson01.exercise02.recognize_after_dinner:
    instruction: What does this sentence mean?
    correct_option: After dinner I drink tea
    distractors:
    - Before dinner I drink tea
    - After school I drink tea
    - I eat dinner and drink tea
    accepted_answers:
    - value: After dinner I drink tea
      status: correct
    feedback: '*بعد از شام* is after dinner, so *بعد از شام چای می‌خورم* is after dinner I drink tea.'
  prs.a2.unit35.lesson01.exercise03.match_before_after:
    instruction: Match each Dari phrase with its meaning.
    accepted_answers:
    - value:
        قبل از صبحانه: before breakfast
        بعد از صبحانه: after breakfast
        قبل از مکتب: before school
        بعد از مکتب: after school
        قبل از شام: before dinner
        بعد از شام: after dinner
        بیدار می‌شوم: I wake up
        لباس می‌پوشم: I get dressed
        دوش می‌گیرم: I take a shower
      status: correct
    feedback: '*قبل از* is before and *بعد از* is after. The words that follow are nouns for the time of day or the meal, and the three verb phrases are the steps of a morning.'
  prs.a2.unit35.lesson01.exercise04.order_after_school_home:
    instruction: 'Arrange the words to say: After school I go home.'
    accepted_answers:
    - value:
      - بعد
      - از
      - مکتب
      - به
      - خانه
      - می‌روم
      status: correct
    - value:
      - به
      - خانه
      - می‌روم
      - بعد
      - از
      - مکتب
      status: correct
    feedback: '*بعد از مکتب به خانه می‌روم.* The noun follows *بعد از* and the verb is last.'
  prs.a2.unit35.lesson01.exercise05.complete_after_breakfast:
    instruction: 'Complete the sentence: After breakfast I go to school.'
    accepted_answers:
    - value: بعد
