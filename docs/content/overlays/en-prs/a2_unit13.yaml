course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: reporting a household problem to a
    landlord — vocabulary, describing the problem, reading a
    maintenance notice, and the phone call itself.

units:
  prs.a2.unit13.maintenance:
    title: Reporting a household problem

lessons:
  prs.a2.unit13.lesson01.maintenance_vocabulary: {title: "Words for household problems"}
  prs.a2.unit13.lesson02.reporting_the_problem: {title: "Reporting the problem"}
  prs.a2.unit13.lesson03.reading_a_maintenance_notice: {title: "Reading a maintenance notice"}
  prs.a2.unit13.lesson04.maintenance_call_dialogue: {title: "Calling the landlord"}

teaching:
  prs.a2.unit13.lesson01.teach.malfunction_word:
    title: "Malfunction / problem"
    gloss: "malfunction / breakage"
    note: "*خرابی* is the general word for something being broken or malfunctioning."
    example_gloss: "I reported the pipe malfunction."
  prs.a2.unit13.lesson01.teach.pipe_word:
    title: "Pipe"
    gloss: "pipe"
    note: "*لوله* is the everyday word for a pipe."
    example_gloss: "The kitchen pipe is leaking."
  prs.a2.unit13.lesson01.teach.electricity_word:
    title: "Electricity"
    gloss: "electricity / power"
    note: "*برق* means electricity or the power supply."
    example_gloss: "The electricity in my bedroom isn't working."
  prs.a2.unit13.lesson01.teach.leak_word:
    title: "Leak"
    gloss: "leak / drip"
    note: "*چکه* describes water leaking or dripping."
    example_gloss: "The pipe's leak gets worse every night."
  prs.a2.unit13.lesson01.teach.repair_word:
    title: "Repair"
    gloss: "repair"
    note: "*تعمیر* is the general word for a repair."
    example_gloss: "The pipe repair is tomorrow."
  prs.a2.unit13.lesson01.teach.worker_word:
    title: "Repairman"
    gloss: "repairman / worker"
    note: "*کارگر* is a general worker, here specifically a repairman."
    example_gloss: "The landlord is sending a repairman."
  prs.a2.unit13.lesson01.teach.asap_grammar:
    title: "As soon as possible, with هر چه زودتر"
    gloss: "as soon as possible"
    note: "*هر چه زودتر* -- this unit's A2-level urgency construction, literally 'whatever sooner'."

  prs.a2.unit13.lesson02.teach.pipe_leaking_asap:
    title: "Report the leaking pipe, with urgency"
    gloss: "My kitchen pipe is leaking and needs to be repaired as soon as possible."
    note: "Combines *چکه می‌کند* (is leaking) with *هر چه زودتر* and the already-established *باید* (need to)."
  prs.a2.unit13.lesson02.teach.when_send_worker:
    title: "Ask when a repairman can come"
    gloss: "When can you send a repairman?"
    note: "*کی می‌توانین...؟* asks 'when can you...?'."
  prs.a2.unit13.lesson02.teach.bedroom_electricity_not_working:
    title: "Report a second problem"
    gloss: "The electricity in my bedroom isn't working."
    note: "*کار نمی‌کند* means 'isn't working', used for a device or utility."

  prs.a2.unit13.lesson03.teach.cost_word:
    title: "Cost / fee"
    gloss: "cost / fee"
    note: "*هزینه* is the general word for a cost or expense."
    example_gloss: "The electrical repair has a cost."
  prs.a2.unit13.lesson03.teach.free_word:
    title: "Free of charge"
    gloss: "free of charge"
    note: "*رایگان* means 'free', at no cost."
    example_gloss: "The pipe repair is free."
  prs.a2.unit13.lesson03.teach.notice_text:
    title: "A building maintenance notice"
    gloss: "The maintenance worker is coming Thursday at ten o'clock. Pipe repairs are free, but electrical repairs have a cost."
    note: "A short general building notice, in the formal written register this unit is teaching -- a separate notice from کریم's own specific call in lesson04, not the same visit."

  prs.a2.unit13.lesson04.teach.turn01:
    title: "The landlord answers the phone"
    gloss: "The landlord answers, 'Hello, go ahead.'"
    note: "*الو* is the already-established way to answer a phone call; *بفرمایین* here means 'go ahead' rather than its usual 'please, come in'."
  prs.a2.unit13.lesson04.teach.turn02:
    title: "کریم introduces himself and reports the leak"
    gloss: "He greets, says he's کریم, and says his kitchen pipe is leaking."
    note: "Reuses the copula *استم* ('I am') already established in this realization."
  prs.a2.unit13.lesson04.teach.turn03:
    title: "The landlord asks since when"
    gloss: "The landlord asks since when it started."
    note: "*از کی شروع شده؟* -- already established -- asks 'since when'."
  prs.a2.unit13.lesson04.teach.turn04:
    title: "کریم answers with urgency"
    gloss: "Since last night. It needs to be repaired as soon as possible."
    note: "*دیشب* means 'last night'."
  prs.a2.unit13.lesson04.teach.turn05:
    title: "The landlord agrees on a time"
    gloss: "Okay, he'll send a repairman tomorrow at nine."
    note: "*باشه* is a casual 'okay', natural for this informal phone register."
  prs.a2.unit13.lesson04.teach.turn06:
    title: "کریم thanks him and reports a second problem"
    gloss: "He thanks the landlord, and says the electricity in his bedroom also isn't working."
    note: "*هم* here means 'also', adding the second problem."
  prs.a2.unit13.lesson04.teach.turn07:
    title: "The landlord confirms he'll pass it on"
    gloss: "The landlord says he'll also tell the repairman about that."
    note: "*آن را هم به کارگر می‌گویم* -- 'I'll also tell the repairman that' -- refers back to the electricity problem."

exercises:
  prs.a2.unit13.lesson01.exercise01.recognize_malfunction:
    instruction: "What does this word mean?"
    correct_option: "malfunction / breakage"
    distractors: ["pipe", "electricity", "repair"]
    accepted_answers: [{value: "malfunction / breakage", status: correct}]
    feedback: "*خرابی* means malfunction or breakage."
  prs.a2.unit13.lesson01.exercise02.recognize_pipe:
    instruction: "What does this word mean?"
    correct_option: "pipe"
    distractors: ["electricity", "leak", "repairman"]
    accepted_answers: [{value: "pipe", status: correct}]
    feedback: "*لوله* means pipe."
  prs.a2.unit13.lesson01.exercise03.match_maintenance_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {خرابی: malfunction, لوله: pipe, برق: electricity, چکه: leak, تعمیر: repair, کارگر: repairman}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's household problem."
  prs.a2.unit13.lesson01.exercise04.order_asap:
    instruction: "Arrange the words to say as soon as possible."
    accepted_answers: [{value: [هر, چه, زودتر], status: correct}]
    feedback: "*هر چه زودتر* means 'as soon as possible'."
  prs.a2.unit13.lesson01.exercise05.write_repairman:
    instruction: "Write the Dari word for repairman."
    accepted_answers:
      - {value: کارگر, status: correct}
    feedback: "*کارگر* means repairman."

  prs.a2.unit13.lesson02.exercise01.recognize_pipe_leaking_asap:
    instruction: "Which sentence reports a leaking kitchen pipe that needs urgent repair?"
    correct_option: "My kitchen pipe is leaking and needs to be repaired as soon as possible."
    distractors: ["When can you send a repairman?", "The electricity in my bedroom isn't working.", "Pipe repairs are free."]
    accepted_answers: [{value: "My kitchen pipe is leaking and needs to be repaired as soon as possible.", status: correct}]
    feedback: "*لولهٔ آشپزخانه‌ام چکه می‌کند و باید هر چه زودتر تعمیر شود.* reports both the problem and its urgency."
  prs.a2.unit13.lesson02.exercise02.order_bedroom_electricity:
    instruction: "Arrange the words to say the electricity in your bedroom isn't working."
    accepted_answers: [{value: [برق, اتاق, "خوابم", کار, "نمی‌کند"], status: correct}]
    feedback: "*برق اتاق خوابم کار نمی‌کند.* reports the second problem."
  prs.a2.unit13.lesson02.exercise03.dialogue_response_what_problem:
    instruction: "The landlord asks: 'What problem do you have?' Report your leaking kitchen pipe and its urgency."
    accepted_answers:
      - {value: "لولهٔ آشپزخانه‌ام چکه می‌کند و باید هر چه زودتر تعمیر شود.", status: correct}
      - {value: "لولهٔ آشپزخانه‌ام چکه می‌کند. باید هر چه زودتر تعمیر شود.", status: correct}
      - {value: "لولهٔ آشپزخانه‌ام چکه می‌کند، باید هر چه زودتر تعمیر شود.", status: correct}
    feedback: "Joining the report and the urgency with *و*, a period, or a comma are equally natural."
  prs.a2.unit13.lesson02.exercise04.translate_when_send_worker:
    instruction: "Translate: When can you send a repairman?"
    accepted_answers:
      - {value: "کی می‌توانین کارگر بفرستین؟", status: correct}
      - {value: "کی می‌توانین کارگر بفرستین", status: correct}
    feedback: "*کی می‌توانین کارگر بفرستین؟* asks when a repairman can come."
  prs.a2.unit13.lesson02.exercise05.write_bedroom_electricity:
    instruction: "Write that the electricity in your bedroom isn't working."
    accepted_answers:
      - {value: "برق اتاق خوابم کار نمی‌کند.", status: correct}
      - {value: "برق اتاق خوابم کار نمی‌کند", status: correct}
    feedback: "*برق اتاق خوابم کار نمی‌کند.* reports the second problem."

  prs.a2.unit13.lesson03.exercise01.read_worker_day:
    instruction: "According to the notice, what day and time does the maintenance worker come?"
    correct_option: "Thursday at ten o'clock"
    distractors: ["Wednesday at ten o'clock", "Thursday at nine o'clock", "Friday at ten o'clock"]
    accepted_answers: [{value: "Thursday at ten o'clock", status: correct}]
    feedback: "*کارگر تعمیرات روز پنج‌شنبه ساعت ده می‌آید* -- Thursday at ten o'clock."
  prs.a2.unit13.lesson03.exercise02.read_which_repair_free:
    instruction: "According to the notice, which repair is free?"
    correct_option: "the pipe repair"
    distractors: ["the electrical repair", "both repairs", "neither repair"]
    accepted_answers: [{value: "the pipe repair", status: correct}]
    feedback: "*تعمیر لوله رایگان است* -- the pipe repair is free."
  prs.a2.unit13.lesson03.exercise03.recognize_cost_word:
    instruction: "What does this word mean?"
    correct_option: "cost / fee"
    distractors: ["free of charge", "malfunction", "leak"]
    accepted_answers: [{value: "cost / fee", status: correct}]
    feedback: "*هزینه* means cost or fee."
  prs.a2.unit13.lesson03.exercise04.order_worker_day:
    instruction: "Arrange the words to say the maintenance worker comes Thursday at ten o'clock."
    accepted_answers: [{value: [کارگر, تعمیرات, روز, "پنج‌شنبه", ساعت, ده, "می‌آید"], status: correct}]
    feedback: "*کارگر تعمیرات روز پنج‌شنبه ساعت ده می‌آید* matches the notice exactly."
  prs.a2.unit13.lesson03.exercise05.write_electricity_has_cost:
    instruction: "Write that the electrical repair has a cost."
    accepted_answers:
      - {value: "تعمیر برق هزینه دارد.", status: correct}
      - {value: "تعمیر برق هزینه دارد", status: correct}
    feedback: "*تعمیر برق هزینه دارد.* says the electrical repair costs money."

  prs.a2.unit13.lesson04.exercise01.comprehend_leak_since:
    instruction: "Since when has the pipe been leaking?"
    correct_option: "since last night"
    distractors: ["since last week", "since this morning", "since yesterday morning"]
    accepted_answers: [{value: "since last night", status: correct}]
    feedback: "*از دیشب* -- since last night."
  prs.a2.unit13.lesson04.exercise02.comprehend_worker_when:
    instruction: "When will the landlord send a repairman?"
    correct_option: "tomorrow at nine"
    distractors: ["tonight", "next week", "tomorrow at ten"]
    accepted_answers: [{value: "tomorrow at nine", status: correct}]
    feedback: "*فردا ساعت نه کارگر را می‌فرستم* -- tomorrow at nine."
  prs.a2.unit13.lesson04.exercise03.recognize_second_problem:
    instruction: "What second problem does کریم report?"
    correct_option: "the electricity in his bedroom isn't working"
    distractors: ["the kitchen sink is broken", "the door won't lock", "the heater isn't working"]
    accepted_answers: [{value: "the electricity in his bedroom isn't working", status: correct}]
    feedback: "*برق اتاق خوابم هم کار نمی‌کند* -- the electricity in his bedroom also isn't working."
  prs.a2.unit13.lesson04.exercise04.order_pipe_leaking:
    instruction: "Arrange the words to say your kitchen pipe is leaking."
    accepted_answers: [{value: ["لولهٔ", "آشپزخانه‌ام", چکه, "می‌کند"], status: correct}]
    feedback: "*لولهٔ آشپزخانه‌ام چکه می‌کند* reports the leaking pipe."
  prs.a2.unit13.lesson04.exercise05.dialogue_response_as_karim:
    instruction: "The landlord answers the phone: 'Hello, go ahead.' Answer as کریم, introducing yourself and reporting the leaking pipe."
    accepted_answers:
      - {value: "سلام، من کریم استم. لولهٔ آشپزخانه‌ام چکه می‌کند.", status: correct}
      - {value: "سلام، من کریم استم، لولهٔ آشپزخانه‌ام چکه می‌کند.", status: correct}
    feedback: "*سلام، من کریم استم. لولهٔ آشپزخانه‌ام چکه می‌کند.* introduces کریم and reports the problem; a comma joins just as naturally as a period."
  prs.a2.unit13.lesson04.exercise06.write_worker_time_summary:
    instruction: "Write, quoting the landlord, when he will send the repairman."
    accepted_answers:
      - {value: "فردا ساعت نه کارگر را می‌فرستم.", status: correct}
      - {value: "فردا ساعت نه کارگر را می‌فرستم", status: correct}
    feedback: "*فردا ساعت نه کارگر را می‌فرستم.* is the landlord's own answer, quoted directly."
