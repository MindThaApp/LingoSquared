course:
  title: Dari B2
  description: Defend a position with reasons, evidence, concession, and rebuttal.
units:
  prs.b2.unit01.argumentation:
    title: Argumentation
    description: Defend a position with reasons, evidence, concession, and rebuttal.
lessons:
  prs.b2.unit01.argumentation.lesson01.claim:
    title: Clear claim
  prs.b2.unit01.argumentation.lesson02.evidence:
    title: Reasons and evidence
  prs.b2.unit01.argumentation.lesson03.rebuttal:
    title: Concession and rebuttal
teaching:
  prs.b2.unit01.argumentation.lesson01.claim.teach.card01:
    title: in my opinion
    gloss: in my opinion
    note: '*به نظر من* is a claim opener; follow it with evidence so the sentence does not stop at personal taste.'
    example_gloss: In my opinion, the youth program should continue.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card02:
    title: I believe that
    gloss: I believe that
    note: '*من باور دارم که* takes a full clause after *که*; keep the Dari verb at the end of that clause.'
    example_gloss: I believe that this decision is important for listeners.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card03:
    title: viewpoint
    gloss: viewpoint
    note: '*دیدگاه* names a viewpoint, not the person holding it, so use it for the position being defended.'
    example_gloss: Your viewpoint is clear and respectful.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card04:
    title: claim
    gloss: claim
    note: '*ادعا* needs support in B2 argumentation; pair it with a reason, statistic, or example.'
    example_gloss: Every claim must have a reason.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card05:
    title: is defensible
    gloss: is defensible
    note: '*قابل دفاع است* evaluates whether a position can be defended; it is stronger than simply saying it is good.'
    example_gloss: This proposal is defensible with enough evidence.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card06:
    title: program
    gloss: program
    note: '*برنامه* covers a broadcast or organized program here, so the argument can stay about the radio show.'
    example_gloss: The radio program airs every Thursday.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card07:
    title: youth
    gloss: youth
    note: '*جوانان* is plural in meaning; do not add an English-style article before it in Dari.'
    example_gloss: The city’s youth have new questions.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card08:
    title: continuation
    gloss: continuation
    note: '*ادامه* combines naturally with *پیدا کند* for "continue"; translating it as a bare noun can sound unfinished.'
    example_gloss: Continuing the discussion needs more time.
  prs.b2.unit01.argumentation.lesson01.claim.teach.card09:
    title: helps listeners
    gloss: helps listeners
    note: '*به شنونده‌ها کمک می‌کند* gives the practical reason for the claim; the verb agrees with the program, not the listeners.'
    example_gloss: A calm voice helps listeners.
  prs.b2.unit01.argumentation.lesson01.claim.teach.grammar:
    title: Argumentation grammar
    gloss: Argumentation grammar
    note: '*به نظر من* and *من باور دارم که* mark a claim. Dari keeps the verb at the end of the *که* clause; avoid English word order.'
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card01:
    title: for example
    gloss: for example
    note: '*برای نمونه* introduces evidence by example; place it before the fact being offered, not after the conclusion.'
    example_gloss: For example, listener calls have increased.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card02:
    title: according to statistics
    gloss: according to statistics
    note: '*بر اساس آمار* signals data-based support; English "according to" maps well here, but the source follows the phrase.'
    example_gloss: According to statistics, most students listen to the program.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card03:
    title: statistics
    gloss: statistics
    note: '*آمار* can be treated as evidence in an argument; keep it distinct from *ادعا*, which is the claim.'
    example_gloss: This year’s statistics were recorded more accurately.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card04:
    title: evidence
    gloss: evidence
    note: '*شواهد* is plural-looking evidence vocabulary; it should strengthen a claim rather than replace the claim itself.'
    example_gloss: We do not have enough evidence to reject the proposal.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card05:
    title: shows
    gloss: shows
    note: '*نشان می‌دهد* introduces what the evidence proves; the complement clause normally follows it in Dari.'
    example_gloss: This report shows that the program has listeners.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card06:
    title: call
    gloss: call
    note: '*تماس* is the countable event behind the statistic, useful when moving from numbers to evidence.'
    example_gloss: Each call brings a new question.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card07:
    title: listener
    gloss: listener
    note: '*شنونده* means listener, so *شنونده‌ها* marks the audience affected by the radio program.'
    example_gloss: A listener from Bamiyan Province sent a message.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card08:
    title: main reason
    gloss: main reason
    note: '*دلیل اصلی* identifies the strongest reason; use ezafe between the two words rather than separating them.'
    example_gloss: My main reason is the students’ need.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.card09:
    title: students
    gloss: students
    note: '*شاگردان* gives a concrete affected group; it makes evidence less abstract than saying "people" only.'
    example_gloss: Students listen to the radio after school.
  prs.b2.unit01.argumentation.lesson02.evidence.teach.grammar:
    title: Argumentation grammar
    gloss: Argumentation grammar
    note: '*برای نمونه* and *بر اساس آمار* support a claim. English speakers should separate evidence from opinion instead of translating both as just “I think.”'
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card01:
    title: it is true that
    gloss: it is true that
    note: '*درست است که* concedes an objection first, which lets the rebuttal sound fair instead of dismissive.'
    example_gloss: It is true that program time is short, but the discussion is important.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card02:
    title: objection
    gloss: objection
    note: '*اعتراض* is the opposing point to answer; do not translate it as a protest unless the context is public action.'
    example_gloss: The manager’s objection about cost was serious.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card03:
    title: cost
    gloss: cost
    note: '*هزینه* is the cost objection in this unit, so it sets up the contrast with social value.'
    example_gloss: The cost of broadcasting the program has increased.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card04:
    title: even so / still
    gloss: even so / still
    note: '*با آن هم* keeps the concession active while turning back to your claim; it is not just filler for "also."'
    example_gloss: Even so, the program has social value.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card05:
    title: we cannot ignore
    gloss: we cannot ignore
    note: '*نمی‌توانیم نادیده بگیریم* is a strong rebuttal frame; the object takes *را* before the verb phrase.'
    example_gloss: We cannot ignore young people’s voices.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card06:
    title: value
    gloss: value
    note: '*ارزش* lets the rebuttal appeal to value, not only money, which matches the social-program argument.'
    example_gloss: The value of education is not measured only by money.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card07:
    title: social
    gloss: social
    note: '*اجتماعی* modifies *ارزش* after it; keep the adjective after the noun in the Dari phrase.'
    example_gloss: A social program must be responsive.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card08:
    title: opposing point
    gloss: opposing point
    note: '*نقطه مخالف* is the objection you summarize before answering; presenting it fairly is part of the B2 outcome.'
    example_gloss: State the opposing point fairly first.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.card09:
    title: therefore
    gloss: therefore
    note: '*در نتیجه* closes the argument by drawing a conclusion from earlier evidence, not by adding a new reason.'
    example_gloss: Therefore, I defend continuing the broadcast.
  prs.b2.unit01.argumentation.lesson03.rebuttal.teach.grammar:
    title: Argumentation grammar
    gloss: Argumentation grammar
    note: '*درست است که* concedes an objection. *اما* and *ولی* are both natural; make the rebuttal explicit.'
