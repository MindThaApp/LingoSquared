teaching:
  prs.b1.unit14.lesson01.teach.dirooz:
    title: Yesterday
    gloss: yesterday
    note: دیروز means yesterday.
    example_gloss: Yesterday my car broke down.
  prs.b1.unit14.lesson01.teach.grammar:
    title: Telling events in order
    gloss: اول، بعد، آخر + simple past
    note: 'To tell what happened in order, use the simple past and link the events with اول (first), بعد (then) and آخر (finally): اول به دفتر رفتم، بعد جلسه داشتم، آخر به خانه آمدم (first I went to the office, then I had a meeting, finally I came home).'
  prs.b1.unit14.lesson01.teach.daftar:
    title: Office
    gloss: office
    note: دفتر means office.
    example_gloss: Yesterday I went to the office.
  prs.b1.unit14.lesson01.teach.raftam:
    title: I went
    gloss: I went
    note: رفتم is the 1st person simple past of رفتن (to go).
    example_gloss: Yesterday I went to the office.
  prs.b1.unit14.lesson01.teach.amadam:
    title: I came
    gloss: I came
    note: آمدم is the 1st person simple past of آمدن (to come).
    example_gloss: Then I came home.
  prs.b1.unit14.lesson01.teach.awal:
    title: First
    gloss: first
    note: اول starts a sequence of past events.
    example_gloss: First I went to the office.
  prs.b1.unit14.lesson01.teach.ba3d:
    title: Then
    gloss: then
    note: بعد introduces the next event.
    example_gloss: Then I came home.
  prs.b1.unit14.lesson01.teach.akhar:
    title: Finally
    gloss: finally
    note: آخر introduces the last event of the story.
    example_gloss: Finally I reached home.
  prs.b1.unit14.lesson02.teach.waqti:
    title: When / while
    gloss: when / while
    note: وقتی begins the background of the story.
    example_gloss: When I was going to the office, my car broke down.
  prs.b1.unit14.lesson02.teach.grammar:
    title: Background and main event
    gloss: وقتی ... می‌رفتم، ... خراب شد
    note: 'Use وقتی + the imperfect past (می‌رفتم) for the background action that was in progress, and the simple past (خراب شد) for the main event that interrupted it: وقتی به دفتر می‌رفتم، موترم خراب شد (when I was going to the office, my car broke down).'
  prs.b1.unit14.lesson02.teach.miraftam:
    title: I was going
    gloss: I was going
    note: 'می‌رفتم is the imperfect past: an action that was in progress.'
    example_gloss: When I was going to the office, it started to rain.
  prs.b1.unit14.lesson02.teach.motar:
    title: My car
    gloss: my car
    note: موترم means my car (the ending -م is "my").
    example_gloss: Yesterday my car broke down.
  prs.b1.unit14.lesson02.teach.kharab:
    title: Broke down
    gloss: broke down
    note: 'خراب شد is the simple past: it broke down.'
    example_gloss: Yesterday my car broke down.
  prs.b1.unit14.lesson03.teach.goft:
    title: Said
    gloss: said
    note: گفت is the 3rd person simple past of گفتن (to say).
    example_gloss: The mechanic said that the problem is small.
  prs.b1.unit14.lesson03.teach.grammar:
    title: Reporting inside a story
    gloss: گفت که + statement
    note: 'To report what someone said inside a story, use گفت که + the statement; the tense follows the story: مکانیک گفت که مشکل کوچک است (the mechanic said that the problem is small). Then continue with the simple past for the next event.'
  prs.b1.unit14.lesson03.teach.mechanic:
    title: Mechanic
    gloss: mechanic
    note: مکانیک means mechanic.
    example_gloss: The mechanic said that the problem is small.
  prs.b1.unit14.lesson03.teach.kochak:
    title: Small
    gloss: small
    note: کوچک means small.
    example_gloss: The mechanic said that the problem is small.
  prs.b1.unit14.lesson03.teach.dorost‌kard:
    title: Repaired
    gloss: repaired
    note: 'درست کرد is the simple past: he fixed or repaired it.'
    example_gloss: He repaired the car.
  prs.b1.unit14.lesson04.teach.amadin:
    title: You came
    gloss: you came
    note: آمدین is the polite 2nd person plural simple past, with the Afghan -ین ending.
    example_gloss: You came late.
  prs.b1.unit14.lesson04.teach.chaqadar:
    title: How much / how long
    gloss: how much / how long
    note: چقدر asks about amount or duration.
    example_gloss: How late did you arrive?
  prs.b1.unit14.lesson04.teach.dir:
    title: Late
    gloss: late
    note: دیر means late.
    example_gloss: I came late today.
  prs.b1.unit14.lesson04.teach.khabar:
    title: I called
    gloss: I called
    note: خبر کردم means I called someone or informed them.
    example_gloss: I called the mechanic.
  prs.b1.unit14.lesson04.teach.resid:
    title: I arrived
    gloss: I arrived
    note: رسیدم is the 1st person simple past of رسیدن (to arrive).
    example_gloss: I arrived one hour late.
  prs.b1.unit14.lesson04.teach.saat:
    title: Hour
    gloss: hour
    note: ساعت means hour (and clock).
    example_gloss: I arrived one hour late.
  prs.b1.unit14.lesson04.teach.dialogue01:
    title: Zarmina, why did you come late yesterday?
    gloss: Zarmina, why did you come late yesterday?
    note: Homayoun asks why she was late.
  prs.b1.unit14.lesson04.teach.dialogue02:
    title: When I was going to the office, my car broke down.
    gloss: When I was going to the office, my car broke down.
    note: Zarmina gives the background action and the main event with وقتی.
  prs.b1.unit14.lesson04.teach.dialogue03:
    title: What did you do then?
    gloss: What did you do then?
    note: Homayoun asks what came next.
  prs.b1.unit14.lesson04.teach.dialogue04:
    title: First I called a mechanic. Then he came and repaired the car.
    gloss: First I called a mechanic. Then he came and repaired the car.
    note: Zarmina tells two events in order with اول and بعد.
  prs.b1.unit14.lesson04.teach.dialogue05:
    title: What did he say?
    gloss: What did he say?
    note: Homayoun asks what the mechanic said.
  prs.b1.unit14.lesson04.teach.dialogue06:
    title: He said that the problem was small. In the end I arrived one hour late.
    gloss: He said that the problem was small. In the end I arrived one hour late.
    note: Zarmina reports his words and gives the ending with آخر.
  prs.b1.unit14.lesson05.teach.motarash:
    title: Her car
    gloss: her car
    note: موترش means his or her car (the ending -ش is "his/her").
    example_gloss: Her car broke down.
  prs.b1.unit14.lesson05.teach.miraft:
    title: Was going
    gloss: was going
    note: 'می‌رفت is the 3rd person imperfect past of رفتن: he or she was going.'
    example_gloss: She was going to the office.
  prs.b1.unit14.lesson05.teach.reading:
    title: A bad day
    gloss: Yesterday, when Zarmina was going to the office, her car broke down. First she called a mechanic. Then the mechanic came and said that the problem was small. In the end Zarmina arrived at the office one hour late.
    note: 'A past experience told in order: the background action with وقتی, then اول, بعد and آخر, with the mechanic''s words reported with گفت که.'
  prs.b1.unit14.lesson06.teach.grammar:
    title: 'Review: telling a story'
    gloss: اول، بعد، آخر; وقتی ... می‌رفتم
    note: 'Review: put events in order with اول، بعد، آخر; give the background with وقتی + the imperfect (می‌رفتم) and the main event with the simple past; report words with گفت که.'
  prs.b1.unit14.lesson06.teach.r‌baran:
    title: Rain
    gloss: rain
    note: باران means rain.
    example_gloss: Yesterday it rained.
  prs.b1.unit14.lesson06.teach.r‌khana:
    title: House / home
    gloss: house / home
    note: خانه means house or home.
    example_gloss: When I was going home, it rained.
