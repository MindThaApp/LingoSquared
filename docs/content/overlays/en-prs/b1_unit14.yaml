course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: telling a past experience in sequence, using وقتی with the imperfect past for background action, and reporting what others said.'
units:
  prs.b1.unit14.narrative:
    title: Recounting a past experience
    description: Tell what happened in order, mark background action against the main event, and report what someone said.
lessons:
  prs.b1.unit14.lesson01.sequence:
    title: First, then, finally
  prs.b1.unit14.lesson02.background‌main:
    title: While I was going...
  prs.b1.unit14.lesson03.report‌in‌story:
    title: He said that...
  prs.b1.unit14.lesson04.dialogue‌late:
    title: Why were you late?
  prs.b1.unit14.lesson05.reading‌late:
