course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: making a shopping complaint — a
    defective electric heater, explaining what's wrong, reading a store's
    return policy, and the conversation at the return counter itself.

units:
  prs.a2.unit18.shopping_complaint:
    title: Shopping complaint

lessons:
  prs.a2.unit18.lesson01.complaint_vocabulary: {title: "Words for a shopping complaint"}
  prs.a2.unit18.lesson02.explaining_the_problem: {title: "Explaining the problem"}
  prs.a2.unit18.lesson03.reading_a_return_policy: {title: "Reading a return policy"}
  prs.a2.unit18.lesson04.return_counter_dialogue: {title: "At the return counter"}

teaching:
  prs.a2.unit18.lesson01.teach.broken_word:
    title: "Broken"
    gloss: "broken"
    note: "*خراب* describes any defective or non-working item."
    example_gloss: "This heater is broken."
  prs.a2.unit18.lesson01.teach.exchange_word:
    title: "Exchange"
    gloss: "to exchange"
    note: "*تعویض کردن* -- *تعویض* means 'exchange', paired with *کردن* ('to do')."
    example_gloss: "I want to exchange the heater."
  prs.a2.unit18.lesson01.teach.refund_word:
    title: "Refund"
    gloss: "refund"
    note: "*بازپرداخت* is the formal word for a refund."
    example_gloss: "I want a refund."
  prs.a2.unit18.lesson01.teach.receipt_word:
    title: "Receipt"
    gloss: "receipt"
    note: "*رسید* is the same word already used for a rent receipt in earlier units, here meaning a purchase receipt."
    example_gloss: "I have the purchase receipt with me."
  prs.a2.unit18.lesson01.teach.warranty_word:
    title: "Warranty"
    gloss: "warranty"
    note: "*گارانتی* is a direct loanword, used exactly as in English."
    example_gloss: "This heater has a one-year warranty."
  prs.a2.unit18.lesson01.teach.defect_word:
    title: "Defect"
    gloss: "defect"
    note: "*عیب* means a fault or defect in an item."
    example_gloss: "This heater has a defect."
  prs.a2.unit18.lesson01.teach.when_grammar:
    title: "When, with وقتی"
    gloss: "When I turn it on, it doesn't get warm."
    note: "*وقتی* introduces a temporal clause -- a natural sibling of unit12's *اگر* (if) conditional, but stating a fact rather than a hypothetical."
  prs.a2.unit18.lesson01.teach.heater_word:
    title: "Electric heater"
    gloss: "electric heater"
    note: "*بخاری برقی* -- *بخاری* means 'heater' and *برقی* means 'electric'."
    example_gloss: "I bought an electric heater for my new home."
  prs.a2.unit18.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used to join clauses in this unit."

  prs.a2.unit18.lesson02.teach.state_item_broken:
    title: "State that a purchased item is broken"
    gloss: "This heater that I bought yesterday is broken."
    note: "*که دیروز خریدم* -- 'that I bought yesterday' -- a relative clause identifying which item."
  prs.a2.unit18.lesson02.teach.request_exchange_or_refund:
    title: "Ask for an exchange or a refund"
    gloss: "I want to exchange it or get my money back."
    note: "*یا* means 'or', offering the shopkeeper a choice."
  prs.a2.unit18.lesson02.teach.prefer_question:
    title: "Ask which the customer prefers"
    gloss: "Which do you prefer?"
    note: "*ترجیح دادن* means 'to prefer' -- this unit's A2-level grammar step for choosing between two offered options."

  prs.a2.unit18.lesson03.teach.deadline_word:
    title: "Deadline / time limit"
    gloss: "deadline"
    note: "*مهلت* is a time limit or deadline by which something must be done."
    example_gloss: "The exchange deadline is seven days."
  prs.a2.unit18.lesson03.teach.original_word:
    title: "Original"
    gloss: "original"
    note: "*اصلی* means 'original', as in the original receipt, not a copy."
    example_gloss: "Please bring the original receipt."
  prs.a2.unit18.lesson03.teach.policy_text:
    title: "A store notice about returns"
    gloss: "If a purchased item is defective, you can exchange it or get a refund within seven days with the original receipt."
    note: "A short official store notice, in the formal written register this unit is teaching."

  prs.a2.unit18.lesson04.teach.turn01:
    title: "The shopkeeper greets کریم"
    gloss: "The shopkeeper asks what help they can give him."
    note: "Reuses the same formal greeting an office clerk uses in unit09."
  prs.a2.unit18.lesson04.teach.turn02:
    title: "کریم states the problem"
    gloss: "کریم says the heater he bought yesterday is broken."
    note: "Reuses lesson02's exact sentence."
  prs.a2.unit18.lesson04.teach.turn03:
    title: "The shopkeeper asks what's wrong"
    gloss: "The shopkeeper asks what the problem is."
    note: "*مشکلی دارد؟* means 'what problem does it have?'"
  prs.a2.unit18.lesson04.teach.turn04:
    title: "کریم explains the defect"
    gloss: "When he turns it on, it doesn't get warm."
    note: "*روشنش می‌کنم* -- 'I turn it on' -- attaches the object suffix *-ش* to *روشن*."
  prs.a2.unit18.lesson04.teach.turn05:
    title: "The shopkeeper asks for the receipt"
    gloss: "The shopkeeper asks if he has the receipt with him."
    note: "*همراه‌تان* -- 'with you' -- the formal possessive suffix *-تان*."
  prs.a2.unit18.lesson04.teach.turn06:
    title: "کریم confirms he has it"
    gloss: "Yes, here is his receipt."
    note: "*اینه* is a casual 'here it is' used when handing something over, already established in unit11."
  prs.a2.unit18.lesson04.teach.turn07:
    title: "The shopkeeper offers a choice"
    gloss: "The shopkeeper can exchange it or refund his money. Which does he prefer?"
    note: "Reuses lesson02's *ترجیح می‌دهین؟* question."
  prs.a2.unit18.lesson04.teach.turn08:
    title: "کریم chooses exchange"
    gloss: "کریم says exchange is better, thanks."
    note: "*بهتر است* means 'is better'."

exercises:
  prs.a2.unit18.lesson01.exercise01.recognize_broken:
    instruction: "What does this word mean?"
    correct_option: "broken"
    distractors: ["refund", "warranty", "defect"]
    accepted_answers: [{value: "broken", status: correct}]
    feedback: "*خراب* means broken."
  prs.a2.unit18.lesson01.exercise02.recognize_refund:
    instruction: "What does this word mean?"
    correct_option: "refund"
    distractors: ["receipt", "exchange", "deadline"]
    accepted_answers: [{value: "refund", status: correct}]
    feedback: "*بازپرداخت* means refund."
  prs.a2.unit18.lesson01.exercise03.match_complaint_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {خراب: broken, "تعویض کردن": "to exchange", بازپرداخت: refund, رسید: receipt, گارانتی: warranty, عیب: defect}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's shopping complaint."
  prs.a2.unit18.lesson01.exercise04.order_when_not_warm:
    instruction: "Arrange the words to say when I turn it on, it doesn't get warm."
    accepted_answers: [{value: [وقتی, آن, را, روشن, "می‌کنم", گرم, "نمی‌شود"], status: correct}]
    feedback: "*وقتی آن را روشن می‌کنم، گرم نمی‌شود.* describes the defect."
  prs.a2.unit18.lesson01.exercise05.write_broken:
    instruction: "Write the Dari word for broken."
    accepted_answers:
      - {value: خراب, status: correct}
    feedback: "*خراب* means broken."

  prs.a2.unit18.lesson02.exercise01.recognize_state_item_broken:
    instruction: "Which sentence says a purchased item is broken?"
    correct_option: "This heater that I bought yesterday is broken."
    distractors: ["I want to exchange it or get my money back.", "Which do you prefer?", "The exchange deadline is seven days."]
    accepted_answers: [{value: "This heater that I bought yesterday is broken.", status: correct}]
    feedback: "*این بخاری که دیروز خریدم، خراب است.* states the problem."
  prs.a2.unit18.lesson02.exercise02.order_request_exchange_or_refund:
    instruction: "Arrange the words to say I want to exchange it or get my money back."
    accepted_answers: [{value: ["می‌خواهم", آن, را, تعویض, کنم, یا, پولم, پس, بگیرم], status: correct}]
    feedback: "*می‌خواهم آن را تعویض کنم یا پولم را پس بگیرم.* offers the two options."
  prs.a2.unit18.lesson02.exercise03.dialogue_response_explain_problem:
    instruction: "The shopkeeper asks: 'What's the problem?' Explain that when you turn it on, it doesn't get warm."
    accepted_answers:
      - {value: "وقتی آن را روشن می‌کنم، گرم نمی‌شود.", status: correct}
      - {value: "وقتی آن را روشن می‌کنم گرم نمی‌شود.", status: correct}
    feedback: "*وقتی آن را روشن می‌کنم، گرم نمی‌شود.* explains the defect."
  prs.a2.unit18.lesson02.exercise04.translate_request_exchange_or_refund:
    instruction: "Translate: I want to exchange it or get my money back."
    accepted_answers:
      - {value: "می‌خواهم آن را تعویض کنم یا پولم را پس بگیرم.", status: correct}
      - {value: "می‌خواهم آن را تعویض کنم، یا پولم را پس بگیرم.", status: correct}
    feedback: "Whether *یا* is preceded by a comma or not, both are equally natural here."
  prs.a2.unit18.lesson02.exercise05.write_state_item_broken:
    instruction: "Write that this heater you bought yesterday is broken."
    accepted_answers:
      - {value: "این بخاری که دیروز خریدم، خراب است.", status: correct}
      - {value: "این بخاری که دیروز خریدم خراب است.", status: correct}
    feedback: "*این بخاری که دیروز خریدم، خراب است.* states the problem."

  prs.a2.unit18.lesson03.exercise01.read_return_window:
    instruction: "According to the policy, within how many days can you exchange a defective item?"
    correct_option: "seven days"
    distractors: ["three days", "thirty days", "one day"]
    accepted_answers: [{value: "seven days", status: correct}]
    feedback: "*ظرف هفت روز* -- within seven days."
  prs.a2.unit18.lesson03.exercise02.read_required_document:
    instruction: "According to the policy, what document do you need for an exchange or refund?"
    correct_option: "the original receipt"
    distractors: ["a photo of the item", "a copy of the receipt", "no document is needed"]
    accepted_answers: [{value: "the original receipt", status: correct}]
    feedback: "The policy requires *رسید اصلی* -- the original receipt."
  prs.a2.unit18.lesson03.exercise03.recognize_deadline_word:
    instruction: "What does this word mean?"
    correct_option: "deadline"
    distractors: ["original", "warranty", "broken"]
    accepted_answers: [{value: "deadline", status: correct}]
    feedback: "*مهلت* means deadline."
  prs.a2.unit18.lesson03.exercise04.order_return_window:
    instruction: "Arrange the words to say the exchange deadline is seven days."
    accepted_answers: [{value: [مهلت, تعویض, هفت, روز, است], status: correct}]
    feedback: "*مهلت تعویض هفت روز است* states the deadline."
  prs.a2.unit18.lesson03.exercise05.write_original_receipt:
    instruction: "Write the Dari phrase for the original receipt."
    accepted_answers:
      - {value: "رسید اصلی", status: correct}
    feedback: "*رسید اصلی* means the original receipt."

  prs.a2.unit18.lesson04.exercise01.comprehend_problem:
    instruction: "What is wrong with کریم's heater?"
    correct_option: "it doesn't get warm"
    distractors: ["it doesn't turn on at all", "it makes a strange noise", "it's the wrong color"]
    accepted_answers: [{value: "it doesn't get warm", status: correct}]
    feedback: "*وقتی روشنش می‌کنم، گرم نمی‌شود* -- it doesn't get warm."
  prs.a2.unit18.lesson04.exercise02.comprehend_resolution_offered:
    instruction: "What does the shopkeeper offer کریم?"
    correct_option: "to exchange it or refund his money"
    distractors: ["only a repair", "only store credit", "nothing, since there's no receipt"]
    accepted_answers: [{value: "to exchange it or refund his money", status: correct}]
    feedback: "*می‌توانم آن را تعویض کنم یا پول‌تان را پس بدهم* -- exchange or refund."
  prs.a2.unit18.lesson04.exercise03.recognize_karim_choice:
    instruction: "What does کریم choose?"
    correct_option: "an exchange"
    distractors: ["a refund", "a repair", "he doesn't decide"]
    accepted_answers: [{value: "an exchange", status: correct}]
    feedback: "*تعویض بهتر است* -- کریم says exchange is better."
  prs.a2.unit18.lesson04.exercise04.order_ask_problem:
    instruction: "Arrange the words to say this heater you bought yesterday is broken."
    accepted_answers: [{value: [این, بخاری, که, دیروز, خریدم, خراب, است], status: correct}]
    feedback: "*این بخاری که دیروز خریدم، خراب است.* states the problem, matching کریم's own words."
  prs.a2.unit18.lesson04.exercise05.dialogue_response_as_karim:
    instruction: "The shopkeeper asks: 'How can I help you?' Explain that the heater you bought yesterday is broken."
    accepted_answers:
      - {value: "این بخاری که دیروز خریدم، خراب است.", status: correct}
      - {value: "این بخاری که دیروز خریدم خراب است.", status: correct}
    feedback: "*این بخاری که دیروز خریدم، خراب است.* is کریم's complaint."
  prs.a2.unit18.lesson04.exercise06.write_resolution_summary:
    instruction: "Write that this heater is broken and you want to exchange it."
    accepted_answers:
      - {value: "این بخاری خراب است و می‌خواهم آن را تعویض کنم.", status: correct}
      - {value: "این بخاری خراب است. می‌خواهم آن را تعویض کنم.", status: correct}
      - {value: "این بخاری خراب است، می‌خواهم آن را تعویض کنم.", status: correct}
    feedback: "Joining the two facts with *و*, a period, or a comma are equally natural."
