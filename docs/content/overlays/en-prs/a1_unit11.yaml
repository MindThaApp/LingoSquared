  notes: "Authored alongside the new prs a1_unit11_time.yaml realization. Follows the established en-prs overlay convention from units 09/10 (English instruction/correct_option/distractors/feedback, target-language Dari accepted_answers, English glosses for recognize_* multiple_choice items to avoid the same-string visual-matching anti-pattern already fixed in units 07/08/09/10). Authored §14/§16-compliant from the start alongside the realization. Needs the standard fresh-context review before shipping.

    FRESH-CONTEXT REVIEW COMPLETED 2026-07-06 (zero prior context, sibling fa files never opened). Verified every multiple_choice pairs a Dari-script prompt against English-gloss options/distractors -- zero prompt-shows-answer instances (no same-script visual-matching shortcut anywhere). Ran a Python tokenizer (ZWNJ-aware, Persian-punctuation-stripping) checking every accepted_answers/correct_option/distractors value against the realization's cumulative introduced_tokens up to that point in the lesson sequence: found and fixed ONE untaught-word violation -- lesson02.exercise05.dialogue_response_ask_time's accepted_answers included \"ببخشین، ساعت چند است؟\" using ببخشین before its lesson06 introduction; removed that variant (the two remaining forms, with and without the question mark, are both already-taught vocabulary and both status:correct). Confirmed content_key parity exact in both directions against the realization (units/lessons/teaching/exercises, zero orphans) and that this file's flat top-level-dict structure (units/lessons/teaching/exercises each keyed directly by content_key) is schema-correct. Found and fixed a real learner-facing factual error: the qarar_word teaching note claimed قرار \"match[ed] the vocabulary already used in unit09's meeting-scheduling dialogue\" -- verified directly against unit09 and confirmed جلسه, not قرار, is unit09's word for meeting (قرار never appears anywhere in prs content before this unit); corrected the note to accurately distinguish قرار (new, personal-appointment word) from جلسه (unit09's existing meeting word) instead of falsely claiming continuity. Applied the §15 target-language-asterisk convention to every note and feedback string in this file (56 strings, programmatically wrapped every Persian-range span in every note/feedback value) since this is freshly-authored content, not exempt pre-existing prose. Confirmed via actual compile (not just validate) that every exercise produces a real, non-empty correct_response, the multi-clause write_meeting_summary keeps its period-, comma-, and و-joined accepted forms all as status:correct per §12, and (working with the paired realization) that 3 dialogue_response exercises plus 1 writing_prompt no longer duplicate their own instruction text as a redundant second prompt block. Both validate and compile re-run clean (0 errors/0 warnings) after every fix; compile output is valid JSON.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 13 kind:vocabulary teaching entries with example_gloss (2 merged cards -- the numbers list and the names list -- each given a positionally-matched list of examples), each a natural, comprehensible-from-gloss sentence using the card's own word(s), using the Afghan Dari نان چاشت (lunch) term. schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    Review 2026-10-20 (en-prs A1 pass): 9 fixes - realization: two lesson titles given proper ZWNJ/ezafe spelling, register-note card no longer claims Iranian-only contraction; overlay: register note rewritten (است is often shortened in fast speech), added period-final and optional-من accepted variants on seven translation/response items. NATIVE FLAGS: is the contraction چنده used in Kabul speech; ظهر vs چاشت for noon; ربع به هشت for quarter to eight."
course:
  title: Dari A1
  description: Beginner Kabul Dari for respectful everyday communication.

units:
  prs.a1.unit11.time:
    title: Time

lessons:
  prs.a1.unit11.lesson01.basic_time_vocabulary: {title: "Basic time vocabulary"}
  prs.a1.unit11.lesson02.asking_the_time: {title: "Asking the time"}
  prs.a1.unit11.lesson03.telling_the_time: {title: "Telling the time"}
  prs.a1.unit11.lesson04.parts_of_the_day: {title: "Parts of the day"}
  prs.a1.unit11.lesson05.asking_about_an_appointment: {title: "Asking about an appointment"}
  prs.a1.unit11.lesson06.meeting_time_dialogue: {title: "Arrange a meeting time"}

teaching:
  prs.a1.unit11.lesson01.teach.saat_word:
    title: "Hour / clock"
    gloss: "hour / clock"
    note: "*ساعت* means both hour and clock, and also marks o'clock in time expressions."
    example_gloss: "What time is it?"
  prs.a1.unit11.lesson01.teach.daqiqa_word:
    title: Minute
    gloss: minute
    note: "*دقیقه* means minute."
    example_gloss: "Wait five minutes."
  prs.a1.unit11.lesson01.teach.nim_word:
    title: Half
    gloss: half
    note: "*نیم* means half, used for the half-hour (e.g. *ساعت سه و نیم*, three-thirty)."
    example_gloss: "It's half past seven."
  prs.a1.unit11.lesson01.teach.rub_word:
    title: Quarter
    gloss: quarter
    note: "*ربع* means quarter, used for quarter-hours (e.g. *ساعت چهار و ربع*, a quarter past four)."
    example_gloss: "It's a quarter to eight."
  prs.a1.unit11.lesson01.teach.numbers_review:
    title: "Numbers 1-5 (review)"
    gloss: "one, two, three, four, five"
    note: "*یک، دو، سه، چهار، پنج* review the numbers from Unit 4, needed to tell the time."
    example_gloss: ["I have one book.", "I have two brothers.", "I have three sisters.", "Four days remain.", "Wait five minutes."]
  prs.a1.unit11.lesson02.teach.chand_word:
    title: "How many / what"
    gloss: "how many / what"
    note: "*چند* combines with *ساعت* to ask the time: *ساعت چند است؟*"
    example_gloss: "What time is it?"
  prs.a1.unit11.lesson02.teach.saat_chand_ast:
    title: "What time is it?"
    gloss: "What time is it?"
    note: "*ساعت چند است؟* is the neutral, polite way to ask the time in Dari."
  prs.a1.unit11.lesson02.teach.register_note:
    title: "Register note"
    gloss: "ساعت چند است؟ (full, neutral form)"
    note: "*ساعت چند است؟* is the full, neutral form: it is correct in writing and in speech. In fast casual speech *است* is often shortened to a final -ه (as in *چنده*), but use the full form while you are learning."
  prs.a1.unit11.lesson03.teach.saat_se_ast:
    title: "It's three o'clock."
    gloss: "It's three o'clock."
    note: "*ساعت سه است* states the time on the hour."
  prs.a1.unit11.lesson03.teach.saat_se_o_nim:
    title: "It's three-thirty."
    gloss: "It's three-thirty."
    note: "*و* (and) joins the hour and the half: *ساعت سه و نیم است*."
  prs.a1.unit11.lesson03.teach.saat_char_o_rub:
    title: "It's a quarter past four."
    gloss: "It's a quarter past four."
    note: "*ساعت چهار و ربع است* adds a quarter past the hour."
  prs.a1.unit11.lesson04.teach.sobh_review:
    title: "Morning (review)"
    gloss: morning
    note: "*صبح* reviews the morning greeting from Unit 1 (*صبح بخیر*)."
    example_gloss: "I wake up early in the morning."
  prs.a1.unit11.lesson04.teach.zohr_word:
    title: Noon
    gloss: noon
    note: "*ظهر* means noon -- a new word, not covered in Unit 1's greetings."
    example_gloss: "I eat lunch at noon."
  prs.a1.unit11.lesson04.teach.asr_review:
    title: "Afternoon (review)"
    gloss: afternoon
    note: "*عصر* reviews the afternoon/evening greeting from Unit 1 (*عصر بخیر*)."
    example_gloss: "I work in the afternoon."
  prs.a1.unit11.lesson04.teach.shab_review:
    title: "Night (review)"
    gloss: night
    note: "*شب* reviews the night greeting from Unit 1 (*شب بخیر*)."
    example_gloss: "I go to sleep early at night."
  prs.a1.unit11.lesson04.teach.saat_noh_sobh:
    title: "It's nine in the morning."
    gloss: "It's nine in the morning."
    note: "*ساعت نه صبح است* combines the time with the part of the day."
  prs.a1.unit11.lesson04.teach.haft_word:
    title: "Seven (7)"
    gloss: "seven (7)"
    note: "*هفت* means seven, needed to say seven at night."
    example_gloss: "I'll come at seven."
  prs.a1.unit11.lesson05.teach.qarar_word:
    title: Appointment
    gloss: appointment
    note: "*قرار* means appointment -- a new word for this unit's personal-appointment context, distinct from *جلسه* (meeting), covered earlier's meeting-scheduling dialogue."
    example_gloss: "I have an appointment."
  prs.a1.unit11.lesson05.teach.qarar_saat_chand:
    title: "What time is your appointment?"
    gloss: "What time is your appointment?"
    note: "*قرار شما ساعت چند است؟* asks the time of someone's appointment, politely (*شما*)."
  prs.a1.unit11.lesson05.teach.qarar_answer:
    title: "My appointment is at eight-thirty."
    gloss: "My appointment is at eight-thirty."
    note: "*قرار من ساعت هشت و نیم است* states your own appointment time."
  prs.a1.unit11.lesson06.teach.names:
    title: "Zarmina and Homayoun"
    gloss: "Zarmina, Homayoun"
    note: "*زرمینه* and *همایون* are the two speakers in this lesson's dialogue."
    example_gloss: ["Zarmina is coming at seven.", "Homayoun is coming at eight."]
  prs.a1.unit11.lesson06.teach.dialogue_line1:
    title: "Excuse me, what time is the meeting?"
    gloss: "Excuse me, what time is the meeting?"
    note: "Zarmina politely asks the meeting time."
  prs.a1.unit11.lesson06.teach.dialogue_line2:
    title: "The meeting is at nine in the morning."
    gloss: "The meeting is at nine in the morning."
    note: "Homayoun states the meeting time."
  prs.a1.unit11.lesson06.teach.dialogue_line3:
    title: "Nine? Good. I'm coming at eight-thirty."
    gloss: "Nine? Good. I'm coming at eight-thirty."
    note: "Zarmina confirms and states her own arrival time."
  prs.a1.unit11.lesson06.teach.dialogue_line4:
    title: "Very good, I'll be waiting."
    gloss: "Very good, I'll be waiting."
    note: "*منتظر استم* (I'm waiting) uses the established *استم* copula ending."

exercises:
  prs.a1.unit11.lesson01.exercise01.recognize_saat_reading:
    instruction: "What does this word mean?"
    correct_option: "hour / clock"
    distractors: [minute, half, quarter]
    accepted_answers: [{value: "hour / clock", status: correct}]
    feedback: "*ساعت* means hour / clock."
  prs.a1.unit11.lesson01.exercise02.recognize_daqiqa_reading:
    instruction: "What does this word mean?"
    correct_option: minute
    distractors: ["hour / clock", half, quarter]
    accepted_answers: [{value: minute, status: correct}]
    feedback: "*دقیقه* means minute."
  prs.a1.unit11.lesson01.exercise03.recognize_nim_reading:
    instruction: "What does this word mean?"
    correct_option: half
    distractors: [minute, quarter, "hour / clock"]
    accepted_answers: [{value: half, status: correct}]
    feedback: "*نیم* means half."
  prs.a1.unit11.lesson01.exercise04.match_time_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {ساعت: "hour / clock", دقیقه: minute, نیم: half, ربع: quarter, یک: "1", دو: "2", سه: "3", چهار: "4", پنج: "5"}
        status: correct
    feedback: "The first four are this lesson's own time words; the last five review the numbers from Unit 4."
  prs.a1.unit11.lesson01.exercise05.translate_hour:
    instruction: "Translate into Dari: hour / clock."
    accepted_answers:
      - {value: ساعت, status: correct}
    feedback: "*ساعت* means hour / clock."
  prs.a1.unit11.lesson01.exercise06.translate_quarter:
    instruction: "Translate into Dari: quarter."
    accepted_answers:
      - {value: ربع, status: correct}
    feedback: "*ربع* means quarter."
  prs.a1.unit11.lesson02.exercise01.recognize_time_question_reading:
    instruction: "What does this question ask?"
    correct_option: "What time is it?"
    distractors: ["What is your name?", "Where are you from?", "How old are you?"]
    accepted_answers: [{value: "What time is it?", status: correct}]
    feedback: "*ساعت چند است؟* asks what time it is."
  prs.a1.unit11.lesson02.exercise02.match_question_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {"ساعت چند است؟": "What time is it?", ساعت: "hour / clock", چند: "how many / what", دقیقه: minute, نیم: half, ربع: quarter}
        status: correct
    feedback: "*چند* (how many/what) combines with *ساعت* to ask the time; the rest reviews this unit's time words."
  prs.a1.unit11.lesson02.exercise03.order_time_question:
    instruction: "Arrange the words to ask What time is it?"
    accepted_answers:
      - {value: [ساعت, چند, است], status: correct}
    feedback: "*ساعت چند است؟* means what time is it?"
  prs.a1.unit11.lesson02.exercise04.translate_time_question:
    instruction: "Translate into Dari: What time is it?"
    accepted_answers:
      - {value: "ساعت چند است", status: correct}
      - {value: "ساعت چند است؟", status: correct}
    feedback: "*ساعت چند است؟* means what time is it?"
  prs.a1.unit11.lesson02.exercise05.dialogue_response_ask_time:
    instruction: "You want to know the time. Ask politely."
    accepted_answers:
      - {value: "ساعت چند است؟", status: correct}
      - {value: "ساعت چند است", status: correct}
    feedback: "*ساعت چند است؟* asks the time politely."
  prs.a1.unit11.lesson03.exercise01.recognize_three_oclock_reading:
    instruction: "What does this sentence mean?"
    correct_option: "It's three o'clock."
    distractors: ["It's three-thirty.", "It's a quarter past four.", "It's five o'clock."]
    accepted_answers: [{value: "It's three o'clock.", status: correct}]
    feedback: "*ساعت سه است* means it's three o'clock."
  prs.a1.unit11.lesson03.exercise02.recognize_half_past_reading:
    instruction: "What does this sentence mean?"
    correct_option: "It's three-thirty."
    distractors: ["It's three o'clock.", "It's a quarter past four.", "It's five o'clock."]
    accepted_answers: [{value: "It's three-thirty.", status: correct}]
    feedback: "*ساعت سه و نیم است* means it's three-thirty."
  prs.a1.unit11.lesson03.exercise03.match_time_expressions:
    instruction: "Match each sentence with its meaning."
    accepted_answers:
      - value: {"ساعت سه است": "It's three o'clock.", "ساعت سه و نیم است": "It's three-thirty.", "ساعت چهار و ربع است": "It's a quarter past four.", "ساعت پنج است": "It's five o'clock.", "ساعت یک است": "It's one o'clock.", "ساعت دو و نیم است": "It's two-thirty."}
        status: correct
    feedback: "*و نیم* adds 'and a half'; *و ربع* adds 'and a quarter'."
  prs.a1.unit11.lesson03.exercise04.order_half_past:
    instruction: "Arrange the words to say It's three-thirty."
    accepted_answers:
      - {value: [ساعت, سه, و, نیم, است], status: correct}
    feedback: "*ساعت سه و نیم است* means it's three-thirty."
  prs.a1.unit11.lesson03.exercise05.translate_five_oclock:
    instruction: "Translate into Dari: It's five o'clock."
    accepted_answers:
      - {value: "ساعت پنج است", status: correct}
      - {value: "ساعت پنج است.", status: correct}
    feedback: "*ساعت پنج است* means it's five o'clock."
  prs.a1.unit11.lesson03.exercise06.translate_quarter_past_four:
    instruction: "Translate into Dari: It's a quarter past four."
    accepted_answers:
      - {value: "ساعت چهار و ربع است", status: correct}
      - {value: "ساعت چهار و ربع است.", status: correct}
    feedback: "*ساعت چهار و ربع است* means it's a quarter past four."
  prs.a1.unit11.lesson04.exercise01.recognize_zohr_reading:
    instruction: "What does this word mean?"
    correct_option: noon
    distractors: [morning, afternoon, night]
    accepted_answers: [{value: noon, status: correct}]
    feedback: "*ظهر* means noon."
  prs.a1.unit11.lesson04.exercise02.recognize_nine_morning_reading:
    instruction: "What does this sentence mean?"
    correct_option: "It's nine in the morning."
    distractors: ["It's nine at night.", "It's noon.", "It's three-thirty."]
    accepted_answers: [{value: "It's nine in the morning.", status: correct}]
    feedback: "*ساعت نه صبح است* means it's nine in the morning."
  prs.a1.unit11.lesson04.exercise03.match_parts_of_day:
    instruction: "Match each word or sentence with its meaning."
    accepted_answers:
      - value: {صبح: morning, ظهر: noon, عصر: afternoon, شب: night, "ساعت نه صبح است": "It's nine in the morning.", نه: "nine (9)"}
        status: correct
    feedback: "*صبح*/*عصر*/*شب* review the greetings from Unit 1; *ظهر* (noon) is new."
  prs.a1.unit11.lesson04.exercise04.order_nine_morning:
    instruction: "Arrange the words to say It's nine in the morning."
    accepted_answers:
      - {value: [ساعت, نه, صبح, است], status: correct}
    feedback: "*ساعت نه صبح است* means it's nine in the morning."
  prs.a1.unit11.lesson04.exercise05.translate_afternoon:
    instruction: "Translate into Dari: afternoon."
    accepted_answers:
      - {value: عصر, status: correct}
    feedback: "*عصر* means afternoon."
  prs.a1.unit11.lesson04.exercise06.translate_seven_night:
    instruction: "Translate into Dari: It's seven at night."
    accepted_answers:
      - {value: "ساعت هفت شب است", status: correct}
      - {value: "ساعت هفت شب است.", status: correct}
    feedback: "*ساعت هفت شب است* means it's seven at night."
  prs.a1.unit11.lesson05.exercise01.recognize_appointment_question_reading:
    instruction: "What does this question ask?"
    correct_option: "What time is your appointment?"
    distractors: ["What time is it?", "Where is your appointment?", "What is your name?"]
    accepted_answers: [{value: "What time is your appointment?", status: correct}]
    feedback: "*قرار شما ساعت چند است؟* asks what time your appointment is."
  prs.a1.unit11.lesson05.exercise02.recognize_appointment_answer_reading:
    instruction: "What does this sentence mean?"
    correct_option: "My appointment is at eight-thirty."
    distractors: ["My appointment is at nine.", "The meeting is at nine in the morning.", "What time is your appointment?"]
    accepted_answers: [{value: "My appointment is at eight-thirty.", status: correct}]
    feedback: "*قرار من ساعت هشت و نیم است* means my appointment is at eight-thirty."
  prs.a1.unit11.lesson05.exercise03.match_appointment_phrases:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {قرار: appointment, "قرار شما ساعت چند است؟": "What time is your appointment?", "قرار من ساعت هشت و نیم است": "My appointment is at eight-thirty.", شما: "you (polite)", من: I, هشت: "eight (8)"}
        status: correct
    feedback: "*قرار* (appointment) is the key new word this lesson adds."
  prs.a1.unit11.lesson05.exercise04.order_appointment_question:
    instruction: "Arrange the words to ask What time is your appointment?"
    accepted_answers:
      - {value: [قرار, شما, ساعت, چند, است], status: correct}
    feedback: "*قرار شما ساعت چند است؟* means what time is your appointment?"
  prs.a1.unit11.lesson05.exercise05.translate_appointment_answer:
    instruction: "Translate into Dari: My appointment is at eight-thirty."
    accepted_answers:
      - {value: "قرار من ساعت هشت و نیم است", status: correct}
      - {value: "قرار من ساعت هشت و نیم است.", status: correct}
    feedback: "*قرار من ساعت هشت و نیم است* means my appointment is at eight-thirty."
  prs.a1.unit11.lesson05.exercise06.dialogue_response_own_appointment:
    instruction: "Someone asks what time your appointment is. Say it's at eight-thirty."
    accepted_answers:
      - {value: "قرار من ساعت هشت و نیم است", status: correct}
      - {value: "قرار من ساعت هشت و نیم است.", status: correct}
    feedback: "*قرار من ساعت هشت و نیم است* means my appointment is at eight-thirty."
  prs.a1.unit11.lesson06.exercise01.recognize_context_reading:
    instruction: "Read the conversation. What time is the meeting?"
    correct_option: "Nine in the morning"
    distractors: ["Eight-thirty", "Nine at night", "Eight in the morning"]
    accepted_answers: [{value: "Nine in the morning", status: correct}]
    feedback: "*همایون* says the meeting is *جلسه ساعت نه صبح است* -- nine in the morning."
  prs.a1.unit11.lesson06.exercise02.match_dialogue_facts:
    instruction: "Match each cue with its fact from the dialogue."
    accepted_answers:
      - value: {"ساعت جلسه": "ساعت نه صبح", "من ساعت هشت و نیم می‌آیم": "Zarmina's arrival time", ببخشین: "excuse me", جلسه: meeting, خوب: good, منتظر: waiting}
        status: correct
    feedback: "The meeting is at 9am; Zarmina arrives at 8:30 (quoting her own words, *من ساعت هشت و نیم می‌آیم*)."
  prs.a1.unit11.lesson06.exercise03.order_meeting_time:
    instruction: "Arrange the words to say The meeting is at nine in the morning."
    accepted_answers:
      - {value: [جلسه, ساعت, نه, صبح, است], status: correct}
    feedback: "*جلسه ساعت نه صبح است* means the meeting is at nine in the morning."
  prs.a1.unit11.lesson06.exercise04.translate_zarmina_arrival:
    instruction: "Translate into Dari: I'm coming at eight-thirty."
    accepted_answers:
      - {value: "من ساعت هشت و نیم می‌آیم", status: correct}
      - {value: "من ساعت هشت و نیم می‌آیم.", status: correct}
      - {value: "ساعت هشت و نیم می‌آیم", status: correct}
      - {value: "ساعت هشت و نیم می‌آیم.", status: correct}
    feedback: "*من ساعت هشت و نیم می‌آیم* means I'm coming at eight-thirty."
  prs.a1.unit11.lesson06.exercise05.dialogue_response_confirm_time:
    instruction: "Homayoun just told you the meeting is at nine in the morning. Confirm that nine o'clock works well."
    accepted_answers:
      - {value: "ساعت نه؟ خوب است", status: correct}
      - {value: "ساعت نه؟ خوب است.", status: correct}
