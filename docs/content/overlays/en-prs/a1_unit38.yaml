course:
  title: Dari A1
  description: "Beginner Kabul Dari: identify and describe the colors of everyday objects, ask what color something is, state and ask about color preferences, and describe a person's home in a short passage."
units:
  prs.a1.unit38.colors:
    title: Colors
    description: Identify and describe the colors of everyday objects.
lessons:
  prs.a1.unit38.lesson01.primary_colors:
    title: Primary colors
  prs.a1.unit38.lesson02.more_colors:
    title: More colors
  prs.a1.unit38.lesson03.asking_about_colors:
    title: Asking about colors
  prs.a1.unit38.lesson04.colors_dialogue:
    title: Colors dialogue
  prs.a1.unit38.lesson05.colors_reading:
    title: Reading about colors
  prs.a1.unit38.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit38.lesson01.teach.review_basics:
    title: "Review: color, is, black, white, red"
    gloss: color / is / black / white / red
    note: "رنگ, است, سیاه, سفید, and سرخ were already taught in unit21's clothing colors sub-lesson and are review forms used throughout this unit."
  prs.a1.unit38.lesson01.teach.review_objects:
    title: "Review: this, shirt, car, book, I, and, but"
    gloss: this / shirt / car / book / I / and / but
    note: "این, پیراهن, موتر, کتاب, من, و, and اما are review words used to build this unit's color sentences."
  prs.a1.unit38.lesson01.teach.abi_word:
    title: Blue
    gloss: blue
    note: "آبی is the standard Dari word for blue."
    example_gloss: The car is blue.
  prs.a1.unit38.lesson01.teach.zard_word:
    title: Yellow
    gloss: yellow
    note: "زرد means yellow."
    example_gloss: This shirt is yellow.
  prs.a1.unit38.lesson01.teach.sabz_word:
    title: Green
    gloss: green
    note: "سبز means green."
    example_gloss: The book is green.
  prs.a1.unit38.lesson01.teach.narenji_word:
    title: Orange
    gloss: orange
    note: "نارنجی means orange (the color)."
    example_gloss: This shirt is orange.
  prs.a1.unit38.lesson01.teach.blue_and_white_phrase:
    title: My shirt is blue and white
    gloss: My shirt is blue and white.
    note: "و joins the two colors into one sentence."
  prs.a1.unit38.lesson01.teach.black_but_orange_phrase:
    title: The car is black, but the shirt is orange
    gloss: The car is black, but the shirt is orange.
    note: "اما contrasts the colors of two different objects in one sentence."
  prs.a1.unit38.lesson02.teach.review_house:
    title: "Review: house"
    gloss: house
    note: "خانه is a review word used in this lesson's color sentences."
  prs.a1.unit38.lesson02.teach.khakestari_word:
    title: Gray
    gloss: gray
    note: "خاکستری means gray."
    example_gloss: The car is gray.
  prs.a1.unit38.lesson02.teach.banafsh_word:
    title: Purple
    gloss: purple
    note: "بنفش means purple."
    example_gloss: This shirt is purple.
  prs.a1.unit38.lesson02.teach.qahwei_word:
    title: Brown
    gloss: brown
    note: "قهوه‌یی literally relates to قهوه (coffee) -- coffee-colored, the standard Dari word for brown."
    example_gloss: The house is brown.
  prs.a1.unit38.lesson02.teach.gray_and_brown_phrase:
    title: The house is gray and brown
    gloss: The house is gray and brown.
    note: "Combines two colors of the same object with و."
  prs.a1.unit38.lesson02.teach.purple_but_blue_phrase:
    title: The shirt is purple, but the book is blue
    gloss: The shirt is purple, but the book is blue.
    note: "اما contrasts the colors of two different objects."
  prs.a1.unit38.lesson03.teach.review_what_which:
    title: "Review: what, which"
    gloss: what / which
    note: "چه and کدام are review/near-review forms used to ask about colors."
  prs.a1.unit38.lesson03.teach.what_color_question_phrase:
    title: What color is this book?
    gloss: What color is this book?
    note: "این کتاب چه رنگ است؟ literally asks this book is what color? -- the natural way to ask what color something is."
  prs.a1.unit38.lesson03.teach.review_like_formal:
    title: "Review: you like (formal), object marker"
    gloss: you like (formal) / object marker
    note: "دوست دارین and را are review forms (from unit14 preferences) used to ask about color preference."
  prs.a1.unit38.lesson03.teach.which_color_like_question_phrase:
    title: Which color do you like?
    gloss: Which color do you like?
    note: "کدام رنگ را دوست دارین؟ literally asks which color [object marker] do-you-like?"
  prs.a1.unit38.lesson03.teach.i_like_green_phrase:
    title: I like the color green
    gloss: I like the color green.
    note: "دوست دارم is the first-person form of دوست داشتن (to like)."
  prs.a1.unit38.lesson04.teach.review_dialogue_words:
    title: "Review: you (formal)"
    gloss: you (formal)
    note: "شما is a review word used in the colors dialogue."
  prs.a1.unit38.lesson04.teach.dialogue_line1:
    title: "Homayoun: Zarmina, what color is your car?"
    gloss: Zarmina, what color is your car?
  prs.a1.unit38.lesson04.teach.dialogue_line2:
    title: "Zarmina: My car is blue."
    gloss: My car is blue.
  prs.a1.unit38.lesson04.teach.dialogue_line3:
    title: "Homayoun: What color is your shirt?"
    gloss: What color is your shirt?
  prs.a1.unit38.lesson04.teach.dialogue_line4:
    title: "Zarmina: My shirt is green and white."
    gloss: My shirt is green and white.
  prs.a1.unit38.lesson04.teach.dialogue_line5:
    title: "Homayoun: Which color do you like?"
    gloss: Which color do you like?
  prs.a1.unit38.lesson04.teach.dialogue_line6:
    title: "Zarmina: I like the color blue."
    gloss: I like the color blue.
  prs.a1.unit38.lesson05.teach.review_reading_words:
    title: "Review: he/she, room, table, he/she likes"
    gloss: he/she / room / table / he/she likes
    note: "او, اتاق, and میز are review words (اتاق/میز from unit19 housing); دوست دارد is the third-person form of دوست داشتن (to like) used earlier in this course for other persons."
  prs.a1.unit38.lesson05.teach.reading_passage:
    title: Reading about Zarmina's house
    gloss: "This is Zarmina's house. Her house is white and blue. Her room is green. Her table is brown. She likes the color green."
