course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying what you plan to do soon and what you intend to do later. The present tense with a time word for plans (tomorrow, next week, in the summer), می‌خواهم plus the subjunctive and تصمیم دارم for intentions, with holidays, courses and moving house.'
units:
  prs.a2.unit27.my_plans:
    title: My plans
lessons:
  prs.a2.unit27.lesson01.tomorrow_and_next_week:
    title: 'Tomorrow and next week: the present for plans'
  prs.a2.unit27.lesson02.everyone_and_holiday:
    title: 'Everyone''s plans: persons, questions, holidays'
  prs.a2.unit27.lesson03.i_want_to:
    title: 'I want to: intentions with می‌خواهم'
  prs.a2.unit27.lesson04.decisions_and_moving:
    title: Decisions, courses and moving house
  prs.a2.unit27.lesson05.reading_and_listening:
    title: Reading and listening about plans
  prs.a2.unit27.lesson06.conversation_and_writing:
    title: A conversation about a new house, and writing
teaching:
  prs.a2.unit27.lesson01.teach.names:
    title: Mahtab and Latif
    gloss: Mahtab and Latif are friends.
    note: Two friends, *مهتاب* (a woman) and *لطیف* (a man), tell their plans in this unit. They talk to each other as friends, so they use *تو*.
  prs.a2.unit27.lesson01.teach.tomorrow:
    title: Tomorrow
    gloss: tomorrow
    note: '*فردا* is tomorrow. It is the time word you will use most for a plan.'
    example_gloss: Tomorrow I am going to Kabul.
  prs.a2.unit27.lesson01.teach.next_week:
    title: Next week
    gloss: next week
    note: '*هفتهٔ آینده* is next week. *آینده* means coming or next, and it also works with other time words: *ماه آینده* (next month), *سال آینده* (next year).'
    example_gloss: Next week I am going to Herat.
  prs.a2.unit27.lesson01.teach.next_month:
    title: Next month
    gloss: next month
    note: '*ماه آینده* is next month. It has the same pattern as *هفتهٔ آینده*.'
    example_gloss: Next month I am going to Mazar.
  prs.a2.unit27.lesson01.teach.next_year:
    title: Next year
    gloss: next year
    note: '*سال آینده* is next year.'
    example_gloss: Next year I am coming to Kabul.
  prs.a2.unit27.lesson01.teach.summer:
    title: Summer
    gloss: summer, in the summer
    note: '*تابستان* is the summer. It also means in the summer: you do not need another word for in.'
    example_gloss: In the summer I am going to Bamyan.
  prs.a2.unit27.lesson01.teach.plan:
    title: Plan
    gloss: plan, programme
    note: '*برنامه* is a plan. *برنامه دارم* is I have a plan, which is the usual way to say you have plans.'
    example_gloss: I have a plan for the summer.
  prs.a2.unit27.lesson01.teach.rule:
    title: The present tense with a time word says what you plan to do
    gloss: Tomorrow I am going. Next week I am going. In the summer I am going.
    note: 'Dari has no separate everyday word for will. To talk about a plan you use the ordinary present, *می‌* plus the present stem, and add a time word that points to the future: *فردا می‌روم* is tomorrow I am going, *هفتهٔ آینده می‌روم* is next week I am going. The time word is what tells the listener the plan is in the future. Without a time word, *می‌روم* just means I go or I am going now. In English you can also say I will go, and that is the usual translation in a plan like this one. The word order is free: the time word usually comes first, but *به هرات فردا می‌روم* is also fine.'
  prs.a2.unit27.lesson01.teach.paradigm:
    title: The present of رفتن for every person
    gloss: I go, you go, he/she goes, we go, you go (formal or plural), they go
    note: 'The present has the prefix *می‌* (written with a half-space) plus the present stem *رو* and a personal ending: *می‌روم* (I), *می‌روی* (you, a friend), *می‌رود* (he or she), *می‌رویم* (we), *می‌روین* (you, formal or plural), *می‌روند* (they). The pronoun is optional because the ending already shows who. The 2pl ending is *-ین* in this course.'
  prs.a2.unit27.lesson01.teach.sentence:
    title: Tomorrow I am going to Herat
    gloss: Tomorrow I am going to Herat.
    note: 'This is the pattern of the unit: a time word, then the place with *به*, then the present verb at the end.'
  prs.a2.unit27.lesson02.teach.holiday:
    title: Holiday
    gloss: holiday, time off
    note: '*رخصتی* is a holiday or time off from work or school. It is the Afghan word you will hear most.'
    example_gloss: In the holiday I am going to Herat.
  prs.a2.unit27.lesson02.teach.travel:
    title: To travel
    gloss: to travel, to go on a trip
    note: '*سفر کردن* is to travel. You say where with *به*: *به بامیان سفر می‌کنم* is I am travelling to Bamyan. The ending goes on *کردن*, so it changes like any present verb: *سفر می‌کنم، سفر می‌کنی، سفر می‌کند*.'
    example_gloss: In the holiday he or she is travelling to Bamyan.
  prs.a2.unit27.lesson02.teach.hotel:
    title: To book a hotel
    gloss: to book a hotel
    note: '*رزرو کردن* is to book or to reserve and *هوتل* is a hotel. A booking is a typical plan, so the present with a time word fits: *فردا هوتل رزرو می‌کنم*.'
    example_gloss: Tomorrow I am booking a hotel.
  prs.a2.unit27.lesson02.teach.buy:
    title: To buy
    gloss: to buy
    note: '*خریدن* is to buy. The present stem is *خر*: *می‌خرم، می‌خری، می‌خرد*.'
    example_gloss: Tomorrow I am buying fruit.
  prs.a2.unit27.lesson02.teach.more_verbs:
    title: The present of آمدن
    gloss: I come, you come, he/she comes, we come, you come (formal or plural), they come
    note: 'The present stem of *آمدن* is *آی*, so the verb is *می‌آیم، می‌آیی، می‌آید، می‌آییم، می‌آیین، می‌آیند*. The same endings work for every verb: *می‌مانم* (I stay), *می‌گیرم* (I take), *می‌خرم* (I buy), *می‌کنم* (I do). Each of these can be a plan when you add a time word: *هفتهٔ آینده می‌آیم* is next week I am coming.'
  prs.a2.unit27.lesson02.teach.negative:
    title: 'The negative: نمی‌ for every person'
    gloss: I am not going, you are not going, he/she is not going, we are not going, you are not going, they are not going
    note: 'To say that you are not going to do something, put *ن* in front of *می‌*: *می‌روم* becomes *نمی‌روم*. The endings stay the same. *جمعه به مکتب نمی‌روم* is on Friday I am not going to school. Remember the half-space between *نمی‌* and the stem.'
  prs.a2.unit27.lesson02.teach.questions:
    title: Asking about someone's plans
    gloss: What are you doing tomorrow? Where are you going next week? Who are you going with?
    note: 'Ask about a plan with the same present tense: *فردا چه می‌کنی؟* is what are you doing tomorrow, *کجا می‌روی؟* is where are you going, *با کی می‌روی؟* is who are you going with. The answer uses the present too, so a conversation about plans needs no new verb form.'
  prs.a2.unit27.lesson02.teach.stay:
    title: I stay there for a week
    gloss: I am staying there for a week.
    note: '*می‌مانم* is I stay. A length of time such as *یک هفته* comes before the verb and needs no extra word for for.'
  prs.a2.unit27.lesson03.teach.pattern:
    title: 'Intention: می‌خواهم plus the subjunctive'
    gloss: I want to go to Herat. I want to come. I want to buy a book.
    note: 'To say what you intend or want to do, use *می‌خواهم* (I want) and then a second verb in the subjunctive: *می‌خواهم بروم* is I want to go. English uses to plus a verb. Dari uses a second verb with a personal ending and no word for to. The two verbs have the same person: *می‌خواهم بروم* (I want to go), *می‌خواهیم برویم* (we want to go). Do not put the infinitive after *می‌خواهم*. The word *که* is not needed here.'
  prs.a2.unit27.lesson03.teach.subjunctive:
    title: 'The subjunctive: بـ plus the present stem'
    gloss: that I go, that you go, that he/she goes, that we go, that you go, that they go
    note: 'The subjunctive is *بـ* plus the present stem and the same endings as the present: *رو* gives *بروم، بروی، برود، برویم، بروین، بروند*. Other verbs: *بخرم* (that I buy), *بگیرم* (that I take), *بمانم* (that I stay), *بخورم* (that I eat). *آمدن* is the exception: *بیایم* (that I come). You will meet it after *می‌خواهم* and also after *باید*.'
  prs.a2.unit27.lesson03.teach.want_paradigm:
    title: The present of خواستن
    gloss: I want, you want, he/she wants, we want, you want (formal or plural), they want
    note: '*خواستن* has the present stem *خواه*: *می‌خواهم، می‌خواهی، می‌خواهد، می‌خواهیم، می‌خواهین، می‌خواهند*. The second verb follows the same person: *او می‌خواهد برود* (he or she wants to go), *ما می‌خواهیم برویم* (we want to go).'
  prs.a2.unit27.lesson03.teach.want_negative:
    title: I do not want to
    gloss: I do not want to go. We do not want to come.
    note: 'Put *ن* on *می‌خواهم* to say you do not want to: *نمی‌خواهم بروم* is I do not want to go. The second verb stays in the subjunctive and does not take another negative.'
  prs.a2.unit27.lesson03.teach.plan_vs_intention:
    title: A plan and an intention
    gloss: Tomorrow I am going to Herat. I want to go to Herat.
    note: 'Compare the two. *فردا به هرات می‌روم* is a plan: it is decided, you give a time, and you use the present. *می‌خواهم به هرات بروم* is an intention or a wish: you want it, but it is not yet fixed, so it often has no exact time. When you have the time and everything is arranged, say the plan. When you only want it, say *می‌خواهم*.'
  prs.a2.unit27.lesson03.teach.course:
    title: Course
    gloss: course, class
    note: '*کورس* is a course, for example a language or computer course. You take one with *گرفتن*: *کورس گرفتن* is to take a course.'
    example_gloss: I want to take an English course.
  prs.a2.unit27.lesson03.teach.start:
    title: To start
    gloss: to start, to begin
    note: '*شروع شدن* is to start. It is used for a thing that begins, a course, a meeting or a lesson: *شروع می‌شود* is it starts. With a time word this is also a plan.'
    example_gloss: The course starts next week.
  prs.a2.unit27.lesson03.teach.university:
    title: University
    gloss: university
    note: '*پوهنتون* is a university. It is the Afghan word; you go there with *به*.'
    example_gloss: I want to go to university.
  prs.a2.unit27.lesson04.teach.move:
    title: To move house
    gloss: to move house, to change one's house
    note: '*عوض کردن* is to change, so *خانه عوض کردن* is to move house. *خانه را عوض می‌کنم* is also correct. The ending goes on *کردن*: *خانه عوض می‌کنم، خانه عوض می‌کنی*.'
    example_gloss: Next month I am moving house.
  prs.a2.unit27.lesson04.teach.rent:
    title: To rent
    gloss: to rent (a house)
    note: '*کرایه* is the rent. *کرایه گرفتن* is to rent a house for yourself, for example *یک خانه کرایه می‌گیرم*. With *می‌خواهم* the second verb is *بگیرم*.'
    example_gloss: I want to rent a new house.
  prs.a2.unit27.lesson04.teach.near:
    title: Near
    gloss: near, close
    note: '*نزدیک* is near. You say near what directly after it: *نزدیک مکتب* is near the school.'
    example_gloss: The new house is near the school.
  prs.a2.unit27.lesson04.teach.decide:
    title: 'تصمیم دارم: I have decided to'
    gloss: I intend to go to university next year.
    note: '*تصمیم دارم* is I have decided, I intend. It is a little stronger than *می‌خواهم*: you have thought about it. Like *می‌خواهم* it is followed by the subjunctive: *تصمیم دارم بروم* is I intend to go. You already know *قصد دارم* from the holiday unit, which means the same and is accepted as well. The subjunctive stays at the end of the clause, after the time word and the place.'
  prs.a2.unit27.lesson04.teach.written_future:
    title: 'The written future: خواهم رفت'
    gloss: Tomorrow I will go to Herat. (written)
    note: 'In notices, in the news and in formal writing you will see *خواهم رفت*, *خواهد رفت*, *خواهیم رفت*: *خواه-* plus the ending and then the past stem *رفت*. It means will go. You only need to recognise it. When you speak, use the present with a time word: *فردا به هرات می‌روم*.'
  prs.a2.unit27.lesson04.teach.because:
    title: Because my house is small
    gloss: Because my house is small.
    note: '*چون* is because. After it comes a short reason, here with the copula *است*.'
  prs.a2.unit27.lesson05.teach.morning:
    title: Morning
    gloss: morning, in the morning
    note: '*صبح* is the morning. *فردا صبح* is tomorrow morning.'
    example_gloss: Tomorrow morning I am going to Bamyan.
  prs.a2.unit27.lesson05.teach.holiday_turn01:
    title: Mahtab asks about the holiday
    gloss: Latif, do you have a plan for the holiday?
    note: Mahtab asks Latif about his holiday plans. *برنامه داری؟* is do you have a plan, and she uses *تو* because he is a friend.
  prs.a2.unit27.lesson05.teach.holiday_turn02:
    title: Latif gives his plan
    gloss: Yes. Next week I am going to Herat. I am staying there for a week.
    note: 'Latif answers *بلی* (yes). His plan has a time word, *هفتهٔ آینده*, and the present tense: *می‌روم*. *یک هفته آنجا می‌مانم* is a second plan in the present.'
  prs.a2.unit27.lesson05.teach.holiday_turn03:
    title: Mahtab asks about the time after that
    gloss: That is good! What are you doing after that?
    note: '*بعد از آن* is after that. The question is in the present, as always for a plan.'
  prs.a2.unit27.lesson05.teach.holiday_turn04:
    title: Latif says what he wants
    gloss: I want to take an English course.
    note: 'Latif has no exact date, so he uses an intention: *می‌خواهم* plus the subjunctive *بگیرم*.'
  prs.a2.unit27.lesson05.teach.holiday_turn05:
    title: Mahtab asks when the course starts
    gloss: Great! When does the course start?
    note: '*کورس کی شروع می‌شود؟* asks when a course begins. The present *شروع می‌شود* talks about a future date.'
  prs.a2.unit27.lesson05.teach.holiday_turn06:
    title: Latif gives the month
    gloss: From next month.
    note: '*از ماه آینده* is from next month. A short answer is enough.'
  prs.a2.unit27.lesson05.teach.message:
    title: A message about plans
    gloss: Hello Mahtab. Tomorrow morning I am going to Bamyan and I am staying there for two days. Next week I am working in the office. Next year I intend to go to university.
    note: A short written message. It has a plan for tomorrow, a plan for next week and an intention for next year. All the plans use the present tense with a time word, and the intention uses *تصمیم دارم* plus the subjunctive.
  prs.a2.unit27.lesson06.teach.help:
    title: To help
    gloss: to help
    note: '*کمک* is help. *کمک کردن* is to help: *فردا کمک می‌کنم* is tomorrow I will help. The ending goes on *کردن*.'
    example_gloss: Tomorrow I am helping my friend.
  prs.a2.unit27.lesson06.teach.house_turn01:
    title: Latif asks about next month
    gloss: Mahtab, what are you doing next month?
    note: Latif asks about a plan with a time word, *ماه آینده*, and the present tense.
  prs.a2.unit27.lesson06.teach.house_turn02:
    title: Mahtab gives her plan
    gloss: Next month I am moving house.
    note: '*خانه عوض می‌کنم* is I am moving house. It is a plan, so it uses the present with the time word.'
  prs.a2.unit27.lesson06.teach.house_turn03:
    title: Latif asks why
    gloss: Why?
    note: '*چرا؟* is why. A one-word question is natural between friends.'
  prs.a2.unit27.lesson06.teach.house_turn04:
    title: Mahtab explains
    gloss: Because my house is small. I want to rent a new house, near the school.
    note: '*چون* gives the reason with *است*. Then comes an intention, *می‌خواهم* plus the subjunctive *بگیرم*, because she has not found the house yet.'
  prs.a2.unit27.lesson06.teach.house_turn05:
    title: Latif offers to help
    gloss: Good! Tomorrow I am coming and I am helping.
    note: 'Latif makes a plan on the spot with *فردا* and the present: *می‌آیم* and *کمک می‌کنم*. *کمک کردن* is to help.'
  prs.a2.unit27.lesson06.teach.house_turn06:
    title: Mahtab thanks him
    gloss: Thanks!
    note: '*تشکر!* is a short way to say thanks to a friend.'
exercises:
  prs.a2.unit27.lesson01.exercise01.recognize_tomorrow:
    instruction: What does this sentence mean?
    correct_option: Tomorrow I am going to Kabul
    distractors:
    - Yesterday I went to Kabul
    - I always go to Kabul
    - I want to go to Kabul
    accepted_answers:
    - value: Tomorrow I am going to Kabul
      status: correct
    feedback: '*فردا* points to the future and *می‌روم* is the present, so this is a plan: tomorrow I am going to Kabul.'
  prs.a2.unit27.lesson01.exercise02.recognize_we_next_week:
    instruction: What does this sentence mean?
    correct_option: Next week we are going to Herat
    distractors:
    - Last week we went to Herat
    - We go to Herat every week
    - We are in Herat now
    accepted_answers:
    - value: Next week we are going to Herat
      status: correct
    feedback: '*هفتهٔ آینده* is next week and *می‌رویم* is we go, so next week we are going to Herat.'
  prs.a2.unit27.lesson01.exercise03.match_time_words:
    instruction: Match each Dari time word with its meaning.
    accepted_answers:
    - value:
        فردا: tomorrow
        هفتهٔ آینده: next week
        ماه آینده: next month
        سال آینده: next year
        تابستان: summer
        امروز: today
        دیروز: yesterday
      status: correct
    feedback: The words with *آینده* point to the future. *امروز* (today) and *دیروز* (yesterday) are not future time words.
  prs.a2.unit27.lesson01.exercise04.order_tomorrow_herat:
    instruction: 'Arrange the words to say: Tomorrow I am going to Herat.'
    accepted_answers:
    - value:
      - فردا
      - به
      - هرات
      - می‌روم
      status: correct
    - value:
      - به
      - هرات
      - فردا
      - می‌روم
      status: correct
    feedback: '*فردا به هرات می‌روم.* The time word comes first and the verb comes last. *به هرات فردا می‌روم* is also possible.'
  prs.a2.unit27.lesson01.exercise05.complete_we_go:
    instruction: 'Complete the sentence: Tomorrow we are going to Herat.'
    accepted_answers:
    - value: می‌رویم
      status: correct
    feedback: '*می‌رویم* is the present of *رفتن* for *ما*: the ending *-یم* means we.'
  prs.a2.unit27.lesson01.exercise06.translate_next_week_kabul:
    instruction: 'Translate into Dari, using the present tense: Next week I am going to Kabul.'
    accepted_answers:
    - value: هفتهٔ آینده به کابل می‌روم.
      status: correct
    - value: هفتهٔ آینده به کابل می‌روم
      status: correct
    - value: من هفتهٔ آینده به کابل می‌روم.
      status: correct
    - value: من هفتهٔ آینده به کابل می‌روم
      status: correct
    - value: به کابل هفتهٔ آینده می‌روم.
      status: correct
    - value: به کابل هفتهٔ آینده می‌روم
      status: correct
    feedback: '*هفتهٔ آینده به کابل می‌روم.* is next week I am going to Kabul. *من* is optional and the time word can move.'
  prs.a2.unit27.lesson02.exercise01.recognize_holiday_travel:
    instruction: What does this sentence mean?
    correct_option: In the holiday he or she is travelling to Bamyan
    distractors:
    - In the holiday he or she travelled to Bamyan
    - He or she lives in Bamyan
    - He or she does not want to go to Bamyan
    accepted_answers:
    - value: In the holiday he or she is travelling to Bamyan
      status: correct
    feedback: '*سفر می‌کند* is the present of *سفر کردن* for *او*. With *در رخصتی* it is a plan for the holiday.'
  prs.a2.unit27.lesson02.exercise02.recognize_friday_negative:
    instruction: What does this sentence mean?
    correct_option: On Friday I am not going to school
    distractors:
    - On Friday I went to school
    - On Friday I want to go to school
    - Tomorrow I am going to school
    accepted_answers:
    - value: On Friday I am not going to school
      status: correct
    feedback: '*نمی‌روم* is the negative of *می‌روم*: I am not going.'
  prs.a2.unit27.lesson02.exercise03.match_persons_and_words:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        می‌روم: I go
        می‌روی: you go (to a friend)
        می‌رود: he or she goes
        می‌رویم: we go
        می‌روین: you go (formal or plural)
        می‌روند: they go
