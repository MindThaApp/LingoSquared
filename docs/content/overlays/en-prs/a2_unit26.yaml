      status: correct
    - value: وقتی رسیدم دوستم هنوز نیامده بود.
      status: correct
    - value: دوستم هنوز نیامده بود، وقتی رسیدم.
      status: correct
    - value: دوستم هنوز نیامده بود وقتی رسیدم.
      status: correct
    feedback: '*وقتی رسیدم، دوستم هنوز نیامده بود.* The arrival is the later event and *نیامده بود* is the earlier one that had not happened.'
  prs.a2.unit26.lesson05.exercise01.read_found_at_office:
