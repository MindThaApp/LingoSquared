    - The bus will leave soon
    accepted_answers:
    - value: The bus had already left
      status: correct
    feedback: '*از قبل* means already. *بس از قبل رفته بود* is the bus had already left.'
  prs.a2.unit26.lesson04.exercise02.recognize_not_yet:
    instruction: What does this sentence mean?
    correct_option: He had not come yet
    distractors:
    - He had already come
    - He did not want to come
    - He came yesterday
    accepted_answers:
    - value: He had not come yet
      status: correct
    feedback: '*هنوز* with the negative *نیامده بود* means not yet: he had not come yet.'
  prs.a2.unit26.lesson04.exercise03.order_before_arrive:
    instruction: 'Arrange the words to say: Before I arrived, the plane had left.'
    accepted_answers:
    - value:
      - قبل
      - از
      - اینکه
      - من
      - برسم
      - طیاره
      - رفته
      - بود
