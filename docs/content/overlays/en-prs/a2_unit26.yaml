    feedback: '*قبل از اینکه من برسم، طیاره رفته بود.* After *قبل از اینکه* the verb is *برسم*, and the main clause has the past perfect.'
  prs.a2.unit26.lesson04.exercise04.complete_already:
    instruction: 'Complete the sentence: I had already eaten breakfast.'
    accepted_answers:
    - value: خورده
      status: correct
    feedback: '*خورده* is the participle of *خوردن*. *قبلاً صبحانه خورده بودم* is I had already eaten breakfast.'
  prs.a2.unit26.lesson04.exercise05.answer_what_happened:
    instruction: 'A friend asks: وقتی به ایستگاه رسیدی، چه شد؟ (When you arrived at the station, what happened?) Answer in Dari with the past perfect: The bus had already left.'
    accepted_answers:
    - value: بس از قبل رفته بود.
      status: correct
    - value: بس قبلاً رفته بود.
      status: correct
    - value: بس رفته بود.
      status: correct
    - value: وقتی رسیدم، بس از قبل رفته بود.
      status: correct
    - value: وقتی رسیدم، بس قبلاً رفته بود.
      status: correct
    - value: وقتی رسیدم، بس رفته بود.
      status: correct
    feedback: '*بس از قبل رفته بود.* is the bus had already left. *قبلاً* instead of *از قبل*, or no time word at all, are also correct.'
  prs.a2.unit26.lesson04.exercise06.write_friend_not_yet:
    instruction: 'Write in Dari, using هنوز and the negative past perfect of آمدن: When I arrived, my friend had not come yet.'
