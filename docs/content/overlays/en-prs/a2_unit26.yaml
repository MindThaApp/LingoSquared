course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying that something had already happened before a point in the past, for example that the bus had left before you arrived. The past perfect (participle plus the past of بودن), its negative, and the contrast with the simple past.'
units:
  prs.a2.unit26.already_happened:
    title: It had already happened
lessons:
  prs.a2.unit26.lesson01.form_and_travel_words:
    title: The form "had gone" and travel words
  prs.a2.unit26.lesson02.more_verbs_with_bud:
    title: More verbs with "had"
  prs.a2.unit26.lesson03.earlier_and_later:
    title: The earlier event and the later one
  prs.a2.unit26.lesson04.time_words:
    title: Already, before, not yet
  prs.a2.unit26.lesson05.reading_and_listening:
    title: Reading and listening about arriving late
  prs.a2.unit26.lesson06.airport_conversation:
    title: A conversation about a missed plane
teaching:
  prs.a2.unit26.lesson01.teach.bus:
    title: Bus
    gloss: bus
    note: '*بس* is the bus, the usual way to travel between cities in Afghanistan. It is a review word from the transport unit.'
    example_gloss: The bus goes to Mazar.
  prs.a2.unit26.lesson01.teach.station:
    title: Station
    gloss: station, bus stop
    note: '*ایستگاه* is a station or a stop. *ایستگاه بس* is the bus station.'
    example_gloss: The bus station is in Kabul.
  prs.a2.unit26.lesson01.teach.plane:
    title: Plane
    gloss: plane, aeroplane
    note: '*طیاره* is the Afghan word for an aeroplane.'
    example_gloss: The plane comes to Kabul.
  prs.a2.unit26.lesson01.teach.airport:
    title: Airport
    gloss: airport
    note: '*میدان هوایی* is the airport. Planes leave from the *میدان هوایی* and buses leave from the *ایستگاه*.'
    example_gloss: The airport is in Kabul.
  prs.a2.unit26.lesson01.teach.car:
    title: Car
    gloss: car
    note: '*موتر* is the Afghan word for a car. Add *-م* to say my car: *موترم*.'
    example_gloss: My car is new.
  prs.a2.unit26.lesson01.teach.arrive:
    title: To arrive
    gloss: to arrive, to reach
    note: '*رسیدن* is to arrive. You say where you arrive with *به*: *به ایستگاه رسیدم* is I arrived at the station. The past stem is *رسید*, so you get *رسیدم، رسیدی، رسید، رسیدیم*.'
    example_gloss: We arrived at the station.
  prs.a2.unit26.lesson01.teach.return:
    title: To go back
    gloss: to return, to go back
    note: '*برگشتن* is to go back or to return. The past stem is *برگشت*: *برگشتم* is I went back.'
    example_gloss: Yesterday I went back home.
  prs.a2.unit26.lesson01.teach.passport:
    title: Passport
    gloss: passport
    note: '*پاسپورت* is a passport. Add *-م* for my: *پاسپورتم*.'
    example_gloss: My passport is at home.
  prs.a2.unit26.lesson01.teach.key:
    title: Key
    gloss: key
    note: '*کلید* is a key. *کلیدم* is my key.'
    example_gloss: My key is at home.
  prs.a2.unit26.lesson01.teach.phone:
    title: Telephone
    gloss: telephone, phone
    note: '*تیلفون* is the telephone. *تیلفونم* is my phone. *تیلفون کردن* is to make a phone call.'
    example_gloss: My phone is new.
  prs.a2.unit26.lesson01.teach.lose:
    title: To lose
    gloss: to lose, to misplace
    note: '*گم کردن* is to lose something. *گم* means lost, and *کردن* is the verb to do: you put the thing you lost and *را* before it, as in *کلیدم را گم کردم* (I lost my key).'
    example_gloss: Yesterday I lost my key.
  prs.a2.unit26.lesson01.teach.when:
    title: When
    gloss: when, at the time that
    note: '*وقتی* begins a clause that gives a point in time, here a point in the past: *وقتی رسیدم* is when I arrived. This clause is the reference point of the whole unit.'
    example_gloss: When I arrived home, I ate breakfast.
  prs.a2.unit26.lesson01.teach.participle:
    title: 'The past participle: past stem plus ه'
    gloss: gone, eaten, seen, arrived, come, done, become (the participles)
    note: 'The past perfect is built from a past participle, so learn that first. Take the infinitive, drop the final *ن* to get the past stem, and add *ه*: *رفتن* has the stem *رفت*, so the participle is *رفته*. The same rule gives *خوردن* to *خورده*, *دیدن* to *دیده*, *رسیدن* to *رسیده*, *آمدن* to *آمده*, *کردن* to *کرده*, *شدن* to *شده*. The participle never changes for person: it is the same for I, you, he and they. It is also the part of *رفته‌ام* (I have gone) that you will meet in the unit about life experiences; this unit only uses it with the past of *بودن*.'
  prs.a2.unit26.lesson01.teach.paradigm:
    title: 'The past perfect: participle plus the past of بودن'
    gloss: I had gone, you had gone, he/she/it had gone, we had gone, you (formal or plural) had gone, they had gone
    note: 'The past perfect says that something had already happened before another moment in the past. It is the participle plus the past of *بودن* (to be): *بودم، بودی، بود، بودیم، بودین، بودند*. So *رفته بودم* is I had gone, *رفته بودی* you had gone (to a friend), *رفته بود* he, she or it had gone (the bare *بود* has no ending), *رفته بودیم* we had gone, *رفته بودین* you had gone (formal or plural), *رفته بودند* they had gone. The pronoun is optional because the ending already shows who. The participle and *بود-* are written as two words.'
  prs.a2.unit26.lesson01.teach.sentence:
    title: When I arrived at the station, the bus had left
    gloss: When I arrived at the station, the bus had left.
    note: 'This is the pattern of the whole unit. *وقتی به ایستگاه رسیدم* is the moment you arrived (simple past). *بس رفته بود* is what had already happened before that moment (past perfect): the bus left first, you arrived second.'
  prs.a2.unit26.lesson02.teach.more_participles:
    title: One rule for every verb
    gloss: I had eaten, you had seen, he/she had arrived, we had come, you had done, they had returned
    note: 'The rule from *رفتن* works for every verb: past stem plus *ه*, then *بودم، بودی، بود، بودیم، بودین، بودند*. *خورده بودم* is I had eaten, *دیده بودی* you had seen, *رسیده بود* he or she had arrived, *آمده بودیم* we had come, *کرده بودین* you had done, *برگشته بودند* they had returned. Only *بود-* changes, never the participle.'
  prs.a2.unit26.lesson02.teach.compound_verbs:
    title: Verbs made of two words
    gloss: I had lost; it had been closed; it had broken down
    note: 'Many verbs are a word plus *کردن* or *شدن*. The participle is made from the second part and the first part stays in front: *گم کردن* gives *گم کرده بودم* (I had lost), *بسته شدن* gives *بسته شده بود* (it had been closed), *خراب شدن* gives *خراب شده بود* (it had broken down). *شدن* is useful when something happened to a thing: the gate, the car, the office.'
  prs.a2.unit26.lesson02.teach.gate:
    title: Gate, door
    gloss: gate, door
    note: '*دروازه* is a gate or a big door, for example the gate at the airport or the door of an office.'
    example_gloss: The gate is open.
  prs.a2.unit26.lesson02.teach.gate_closed:
    title: The gate had been closed
    gloss: The gate had been closed.
    note: '*بسته شده بود* says the gate was already closed before you came. It is the past perfect of *بسته شدن*.'
  prs.a2.unit26.lesson02.teach.break_down:
    title: To break down
    gloss: to break down, to go wrong
    note: '*خراب* means broken or spoiled and *شدن* means to become, so *خراب شدن* is to break down. The simple past is *خراب شد*: *موترم خراب شد* is my car broke down.'
    example_gloss: My car broke down.
  prs.a2.unit26.lesson02.teach.ate_breakfast:
    title: I had eaten breakfast
    gloss: I had eaten breakfast.
    note: '*صبحانه خورده بودم* says that breakfast was already finished before the moment you are speaking about.'
  prs.a2.unit26.lesson02.teach.meeting:
    title: Meeting
    gloss: meeting
    note: '*جلسه* is a meeting. It is one more kind of appointment you can miss or be late for.'
    example_gloss: The meeting started at nine.
  prs.a2.unit26.lesson02.teach.manager:
    title: Manager
    gloss: manager, director
    note: '*مدیر* is the manager or director of an office.'
    example_gloss: The manager is in the office.
  prs.a2.unit26.lesson03.teach.contrast:
    title: Past perfect versus simple past
    gloss: When I arrived, the bus had left. / When I arrived, the bus left.
    note: 'When two past events are told together, the event that came first goes in the past perfect and the later event, the reference point, goes in the simple past. In *وقتی رسیدم، بس رفته بود* you arrived second and the bus left first, so you find nothing: the bus is already gone. In *وقتی رسیدم، بس رفت* both verbs are simple past, so the bus left after you arrived, or just as you arrived. The two clauses can also come in the other order: *بس رفته بود، وقتی رسیدم*.'
  prs.a2.unit26.lesson03.teach.bus_left_simple:
    title: When I arrived, the bus left
    gloss: When I arrived, the bus left.
    note: Compare this with *بس رفته بود*. Here the bus left after you arrived. You could have run to it. With *رفته بود* it was already gone.
  prs.a2.unit26.lesson03.teach.manager_left:
    title: When I arrived, the manager had left
    gloss: When I arrived, the manager had left.
    note: 'The same pattern as the bus: *وقتی رسیدم* is the arrival, *مدیر رفته بود* is the earlier event. This is what you say when you come to an appointment and the person is already gone.'
  prs.a2.unit26.lesson03.teach.negative:
    title: 'The negative: ن on the participle'
    gloss: I had not gone, you had not gone, he/she had not gone, we had not gone, you had not gone, they had not gone
    note: 'To say that something had not happened yet, put *ن* at the front of the participle, not on *بود*: *رفته بودم* becomes *نرفته بودم* (I had not gone). *بود-* keeps the same endings: *نرفته بودم، نرفته بودی، نرفته بود، نرفته بودیم، نرفته بودین، نرفته بودند*. Do not write *رفته نبودم* for this.'
  prs.a2.unit26.lesson03.teach.negative_more:
    title: Negative participles of other verbs
    gloss: I had not eaten, I had not seen, I had not arrived, I had not come
    note: 'The same *ن* goes on every participle: *نخورده* (not eaten), *ندیده* (not seen), *نرسیده* (not arrived). The verb *آمدن* is the exception to remember: its participle *آمده* takes *نیـ*, so the negative is *نیامده* (not come), as in *نیامده بودم*. Two-word verbs put the *ن* on the second part: *گم نکرده بودم* (I had not lost it).'
  prs.a2.unit26.lesson04.teach.already:
    title: Already, earlier
    gloss: already, before, earlier
    note: '*قبلاً* means before now or earlier. It stresses that the thing was done earlier, and it goes before the participle or at the start of the sentence.'
    example_gloss: I had already eaten breakfast.
  prs.a2.unit26.lesson04.teach.from_before:
    title: Already, from before
    gloss: already, beforehand
    note: '*از قبل* means in advance or already, from an earlier time. It sits before the participle: *از قبل رفته بود* is he had already gone. It is very common with the past perfect.'
    example_gloss: The bus had already left.
  prs.a2.unit26.lesson04.teach.not_yet:
    title: Still, not yet
    gloss: 'still, yet; with a negative: not yet'
    note: '*هنوز* with a negative verb means not yet. *هنوز نیامده بود* is he had not come yet. The negative past perfect and *هنوز* go together: the thing you expected had not happened by that moment.'
    example_gloss: He had not come yet.
  prs.a2.unit26.lesson04.teach.before_clause:
    title: 'قبل از اینکه: before I arrived'
    gloss: Before I arrived, the plane had left. / Before we arrived, the plane had left.
    note: '*قبل از اینکه* means before, and it starts a clause with its own verb. The verb after it is the subjunctive, the same form you use after *باید*: *برسم* (that I arrive), *برسیم* (that we arrive). It is not a past verb, even though the story is in the past. The main clause then says what had already happened: *طیاره رفته بود*. So *قبل از اینکه من برسم، طیاره رفته بود* means the same as *وقتی رسیدم، طیاره رفته بود*: the plane left first. The clauses can swap places.'
  prs.a2.unit26.lesson04.teach.friend_not_yet:
    title: When I arrived, my friend had not come yet
    gloss: When I arrived, my friend had not come yet.
    note: Here the earlier event is something that had not happened yet. *هنوز نیامده بود* places the missing event before the reference point *وقتی رسیدم*.
  prs.a2.unit26.lesson04.teach.what_happened:
    title: When you arrived at the station, what happened?
    gloss: When you arrived at the station, what happened?
    note: '*چه شد؟* asks what happened. The answer is usually the past perfect: *بس از قبل رفته بود* (the bus had already left).'
  prs.a2.unit26.lesson05.teach.four:
    title: Four
    gloss: four
    note: '*چهار* is four. You use it for the time: *ساعت چهار* is four o''clock.'
    example_gloss: I arrived home at four o'clock.
  prs.a2.unit26.lesson05.teach.staff:
    title: Staff, employees
    gloss: staff, employees
    note: '*کارمندان* is the plural of *کارمند* (employee). The ending *-ان* makes the plural for people.'
    example_gloss: The staff are in the office.
  prs.a2.unit26.lesson05.teach.passport_office:
    title: Passport office
    gloss: passport office
    note: '*دفتر پاسپورت* is the office where people get or renew a passport. You know both words already.'
    example_gloss: The passport office is in Kabul.
  prs.a2.unit26.lesson05.teach.bus_turn01:
    title: Shakiba asks Naimat about yesterday
    gloss: Naimat, did you go to Mazar yesterday?
    note: Shakiba asks a yes or no question about a finished action with the simple past *رفتی*. The speaker is a friend, so she uses *تو*.
  prs.a2.unit26.lesson05.teach.bus_turn02:
    title: Naimat says what he found
    gloss: No. When I arrived at the station, the bus had left.
    note: Naimat answers *نخیر*, then gives the reference point in the simple past, *وقتی به ایستگاه رسیدم*, and the earlier event in the past perfect, *بس رفته بود*.
  prs.a2.unit26.lesson05.teach.bus_turn03:
    title: Shakiba asks about the time
    gloss: What time did the bus leave?
    note: '*ساعت چند* asks for the time. *حرکت کرد* is the simple past of *حرکت کردن*, to depart.'
  prs.a2.unit26.lesson05.teach.bus_turn04:
    title: Naimat gives the two times
    gloss: At eight. I arrived at nine.
    note: 'Two times, two events: the bus left at *ساعت هشت* and Naimat arrived at *ساعت نه*. Eight is earlier than nine, so the bus left first.'
  prs.a2.unit26.lesson05.teach.bus_turn05:
    title: Shakiba asks what happened next
    gloss: What did you do then?
    note: '*بعد چه کردی؟* asks what you did next. It uses the simple past, because it is a new event after the arrival.'
  prs.a2.unit26.lesson05.teach.bus_turn06:
    title: Naimat went home
    gloss: I went back home.
    note: '*برگشتم* is the simple past of *برگشتن*: he went back home.'
  prs.a2.unit26.lesson05.teach.message:
    title: A message about arriving late
    gloss: Hello Shakiba. Today at four o'clock I arrived at the passport office, but the office had closed. The staff had left. My car had broken down, so I arrived late. Tomorrow morning I will go again.
    note: 'A short written message in the past perfect. It tells what the writer found on arrival: the office had been closed and the staff had left. It also gives the earlier reason for being late: the car had broken down.'
  prs.a2.unit26.lesson06.teach.herat:
    title: Herat
    gloss: Herat (a city in western Afghanistan)
    note: '*هرات* is the city of Herat, in the west of Afghanistan. People fly there from Kabul.'
    example_gloss: The plane goes to Herat.
  prs.a2.unit26.lesson06.teach.find:
    title: To find
    gloss: to find
    note: '*پیدا کردن* is to find something you were looking for. The thing comes before the verb with *را*: *کلیدم را پیدا کردم* is I found my key. The negative is *پیدا نکردم* (I did not find it).'
    example_gloss: I found my key.
  prs.a2.unit26.lesson06.teach.bad:
    title: Bad
    gloss: bad
    note: '*بد* means bad. *چه بد!* is a friendly reaction to bad news, the opposite of *چه خوب!*.'
    example_gloss: How bad! (What a pity!)
  prs.a2.unit26.lesson06.teach.airport_turn01:
    title: Naimat asks why Shakiba did not go
    gloss: Shakiba, why did you not go to Herat last week?
    note: Naimat asks *چرا* with the simple past negative *نرفتی*. He is a friend, so he uses *تو*.
  prs.a2.unit26.lesson06.teach.airport_turn02:
    title: Shakiba gives the reason
    gloss: Because I had lost my passport. I did not find it until ten o'clock.
    note: '*چون* (because) introduces the reason, and the reason is the earlier event, so it uses the past perfect: *گم کرده بودم*. *آن را* (it) points back to the passport.'
  prs.a2.unit26.lesson06.teach.airport_turn03:
    title: Naimat asks what happened at the airport
    gloss: When you arrived at the airport, what happened?
    note: The reference point is *وقتی به میدان هوایی رسیدی*, in the simple past. *چه شد؟* asks for what was already so.
  prs.a2.unit26.lesson06.teach.airport_turn04:
    title: Shakiba tells what she found and what she did
    gloss: The plane had left. Then I went back home and made a phone call.
    note: '*طیاره رفته بود* is the earlier event, in the past perfect. After that come two new events in the simple past: *برگشتم* and *تیلفون کردم*.'
  prs.a2.unit26.lesson06.teach.airport_turn05:
    title: Naimat reacts
    gloss: What a pity!
    note: '*چه بد!* is a short, friendly reaction to bad news.'
exercises:
  prs.a2.unit26.lesson01.exercise01.recognize_plane_left:
    instruction: What does this sentence mean?
    correct_option: The plane had left
    distractors:
    - The plane is leaving
    - The plane will leave
    - The plane is at the airport
    accepted_answers:
    - value: The plane had left
      status: correct
    feedback: '*طیاره رفته بود* is the plane had left: the participle *رفته* plus *بود*.'
  prs.a2.unit26.lesson01.exercise02.recognize_lost_passport:
    instruction: What does this sentence mean?
    correct_option: I had lost my passport
    distractors:
    - I found my passport
    - My passport is at home
    - I want a passport
    accepted_answers:
    - value: I had lost my passport
      status: correct
    feedback: '*گم کرده بودم* is I had lost: the participle *گم کرده* plus *بودم*.'
  prs.a2.unit26.lesson01.exercise03.recognize_we_arrived:
    instruction: What does this sentence mean?
    correct_option: We had arrived
    distractors:
    - They had arrived
    - I had arrived
    - We arrive every day
    accepted_answers:
    - value: We had arrived
      status: correct
    feedback: 'The ending of *بودیم* means we: *ما رسیده بودیم* is we had arrived.'
  prs.a2.unit26.lesson01.exercise04.match_form_and_words:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        رفته بودم: I had gone
        رفته بودی: you had gone (to a friend)
        رفته بود: he, she or it had gone
        رفته بودیم: we had gone
        رفته بودین: you had gone (formal or plural)
        رفته بودند: they had gone
        طیاره: plane
        میدان هوایی: airport
        ایستگاه: station
      status: correct
    feedback: 'Only *بود-* changes with the person: *بودم* I, *بودی* you (friend), *بود* he or she, *بودیم* we, *بودین* you (formal or plural), *بودند* they.'
  prs.a2.unit26.lesson01.exercise05.order_we_arrived_station:
    instruction: 'Arrange the words to say: We had arrived at the station.'
    accepted_answers:
    - value:
      - ما
      - به
      - ایستگاه
      - رسیده
      - بودیم
      status: correct
    feedback: '*ما به ایستگاه رسیده بودیم* puts the participle first and *بودیم* last.'
  prs.a2.unit26.lesson01.exercise06.translate_bus_left:
    instruction: 'Translate into Dari, using the past perfect of رفتن: The bus had left.'
    accepted_answers:
    - value: بس رفته بود.
      status: correct
    - value: آن بس رفته بود.
      status: correct
    feedback: '*بس رفته بود* is the bus had left. *آن* (that) is optional.'
  prs.a2.unit26.lesson02.exercise01.recognize_had_eaten:
    instruction: What does this sentence mean?
    correct_option: I had eaten breakfast
    distractors:
    - I will eat breakfast
    - I am eating breakfast
    - I do not want breakfast
    accepted_answers:
    - value: I had eaten breakfast
      status: correct
    feedback: '*خورده بودم* is I had eaten: the participle *خورده* plus *بودم*.'
  prs.a2.unit26.lesson02.exercise02.recognize_gate_closed:
    instruction: What does this sentence mean?
    correct_option: The gate had been closed
    distractors:
    - The gate is open
    - The gate will close tomorrow
    - The gate is at the airport
    accepted_answers:
    - value: The gate had been closed
      status: correct
    feedback: '*بسته شده بود* is the past perfect of *بسته شدن*: the gate had been closed.'
  prs.a2.unit26.lesson02.exercise03.match_participles:
    instruction: Match each past perfect verb with its meaning.
    accepted_answers:
    - value:
        رفته بود: he or she had gone
        خورده بود: he or she had eaten
        دیده بود: he or she had seen
        رسیده بود: he or she had arrived
        آمده بود: he or she had come
        کرده بود: he or she had done
        برگشته بود: he or she had returned
        گم کرده بود: he or she had lost
        خراب شده بود: it had broken down
      status: correct
    feedback: 'Every one of these is a participle in *ه* plus *بود*. For two-word verbs the first word stays in front: *گم کرده بود*, *خراب شده بود*.'
  prs.a2.unit26.lesson02.exercise04.order_lost_key:
    instruction: 'Arrange the words to say: I had lost my key.'
    accepted_answers:
    - value:
      - کلیدم
      - را
      - گم
      - کرده
      - بودم
      status: correct
    feedback: '*کلیدم را گم کرده بودم* keeps *را* after the thing that was lost and the verb at the end.'
  prs.a2.unit26.lesson02.exercise05.complete_gate:
    instruction: 'Complete the sentence: The gate had been closed.'
    accepted_answers:
    - value: بود
      status: correct
    feedback: '*بود* is the past of *بودن*. With *بسته شده* it makes the past perfect.'
  prs.a2.unit26.lesson02.exercise06.translate_car_broke_down:
    instruction: 'Translate into Dari, using the past perfect of خراب شدن: My car had broken down.'
    accepted_answers:
    - value: موترم خراب شده بود.
      status: correct
    - value: موتر من خراب شده بود.
      status: correct
    feedback: '*موترم خراب شده بود* is my car had broken down. *موتر من* is the same with the pronoun written out.'
  prs.a2.unit26.lesson03.exercise01.which_first:
    instruction: Read the sentence. What happened first?
    correct_option: The bus left
    distractors:
    - I arrived
    - I went home
    - I bought a ticket
    accepted_answers:
    - value: The bus left
      status: correct
    feedback: '*بس رفته بود* is the earlier event, so the bus left first. *وقتی رسیدم* is the later reference point.'
  prs.a2.unit26.lesson03.exercise02.bus_left_after:
    instruction: Read the sentence. Which statement is true?
    correct_option: The bus left after I arrived
    distractors:
    - The bus left before I arrived
    - The bus never left
    - I did not arrive
    accepted_answers:
    - value: The bus left after I arrived
      status: correct
    feedback: 'Both verbs are simple past, so the order is the order of the words: first *رسیدم*, then *بس رفت*.'
  prs.a2.unit26.lesson03.exercise03.match_simple_perfect:
    instruction: Match each Dari verb with its meaning.
    accepted_answers:
    - value:
        رسیدم: I arrived
        رسیده بودم: I had arrived
        رفت: he, she or it left
        رفته بود: he, she or it had left
        دیدم: I saw
        دیده بودم: I had seen
        گم کردم: I lost
        گم کرده بودم: I had lost
        نرفته بودم: I had not gone
      status: correct
    feedback: The simple past is the past stem plus an ending. The past perfect adds a participle and *بود-*, so it needs two words.
  prs.a2.unit26.lesson03.exercise04.order_plane_left:
    instruction: 'Arrange the words to say: When I arrived, the plane had left.'
    accepted_answers:
    - value:
      - وقتی
      - رسیدم
      - طیاره
      - رفته
      - بود
      status: correct
    - value:
      - طیاره
      - رفته
      - بود
      - وقتی
      - رسیدم
      status: correct
    feedback: '*وقتی رسیدم، طیاره رفته بود.* The arrival is the reference point and the plane leaving is the earlier event. The two clauses can swap places.'
  prs.a2.unit26.lesson03.exercise05.complete_bus_left:
    instruction: 'Complete the sentence: When I arrived at the station, the bus had left.'
    accepted_answers:
    - value: رفته
      status: correct
    feedback: '*رفته* is the participle of *رفتن*. With *بود* it makes *رفته بود*, the bus had left.'
  prs.a2.unit26.lesson03.exercise06.translate_manager_left:
    instruction: 'Translate into Dari, using the past perfect of رفتن: When I arrived, the manager had left.'
    accepted_answers:
    - value: وقتی رسیدم، مدیر رفته بود.
      status: correct
    - value: وقتی رسیدم مدیر رفته بود.
      status: correct
    - value: مدیر رفته بود، وقتی رسیدم.
      status: correct
    - value: مدیر رفته بود وقتی رسیدم.
      status: correct
    feedback: '*وقتی رسیدم، مدیر رفته بود.* is when I arrived, the manager had left. A comma or no comma are both fine, and the two clauses can swap places.'
  prs.a2.unit26.lesson04.exercise01.recognize_already_left:
    instruction: What does this sentence mean?
    correct_option: The bus had already left
    distractors:
    - The bus is leaving now
