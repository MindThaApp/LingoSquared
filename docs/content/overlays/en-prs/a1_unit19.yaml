course:
  title: Dari A1
  description: >-
    Beginner Kabul Dari: basic rooms (bedroom, kitchen, bathroom),
    household objects (table, chair, bed, window), combining quantity
    and location, reading a short and then a longer home description,
    and a dialogue asking about someone's home.

units:
  prs.a1.unit19.housing:
    title: Housing
    description: Describe a basic home, rooms, household objects, and location.

lessons:
  prs.a1.unit19.lesson01.room_words:
    title: "Room words"
  prs.a1.unit19.lesson02.object_words:
    title: "Household object words"
  prs.a1.unit19.lesson03.quantity_and_location:
    title: "Quantity and location"
  prs.a1.unit19.lesson04.reading_a_home_description:
    title: "Reading a home description"
  prs.a1.unit19.lesson05.reading_a_longer_description:
    title: "Reading a longer home description"
  prs.a1.unit19.lesson06.home_dialogue:
    title: "A dialogue about someone's home"

teaching:
  prs.a1.unit19.lesson01.teach.house_word:
    title: "House / home"
    gloss: "house / home"
    note: "خانه means house or home."
    example_gloss: "I have a house."
  prs.a1.unit19.lesson01.teach.room_word:
    title: Room
    gloss: room
    note: "اتاق means room."
    example_gloss: "I have a bedroom."
  prs.a1.unit19.lesson01.teach.sleep_word:
    title: Sleep
    gloss: sleep
    note: "خواب means sleep -- اتاق خواب literally means sleep-room, i.e. bedroom."
    example_gloss: "I have a bedroom."
  prs.a1.unit19.lesson01.teach.kitchen_word:
    title: Kitchen
    gloss: kitchen
    note: "آشپزخانه means kitchen."
    example_gloss: "I have a kitchen."
  prs.a1.unit19.lesson01.teach.bathroom_word:
    title: Bathroom
    gloss: bathroom
    note: "تشناب is the standard Afghan Dari term for bathroom/toilet (from تشنه thirsty + آب water), distinct from Iranian Farsi's دستشویی."
    example_gloss: "I have a bathroom."
  prs.a1.unit19.lesson01.teach.have_word:
    title: "I have"
    gloss: "I have"
    note: "دارم is the first-person present of داشتن (to have)."
  prs.a1.unit19.lesson02.teach.table_word:
    title: Table
    gloss: table
    note: "میز means table."
    example_gloss: "I have a table."
  prs.a1.unit19.lesson02.teach.chair_word:
    title: Chair
    gloss: chair
    note: "چوکی is the standard Afghan Dari term for chair, distinct from Iranian Farsi's صندلی."
    example_gloss: "I have a chair."
  prs.a1.unit19.lesson02.teach.bed_word:
    title: Bed
    gloss: bed
    note: "تخت means bed."
    example_gloss: "I have a bed."
  prs.a1.unit19.lesson02.teach.window_word:
    title: Window
    gloss: window
    note: "کلکین is the standard Afghan Dari term for window, distinct from Iranian Farsi's پنجره."
    example_gloss: "I have a window."
  prs.a1.unit19.lesson03.teach.two_word:
    title: Two
    gloss: two
    note: "دو means two."
    example_gloss: "I have two rooms."
  prs.a1.unit19.lesson03.teach.three_word:
    title: Three
    gloss: three
    note: "سه means three."
    example_gloss: "I have three rooms."
  prs.a1.unit19.lesson03.teach.near_word:
    title: Near
    gloss: near
    note: "نزدیک means near."
    example_gloss: "The table is near the window."
  prs.a1.unit19.lesson03.teach.is_word:
    title: Is
    gloss: is
    note: "است is the copula -- میز نزدیک کلکین است means the table is near the window."
  prs.a1.unit19.lesson04.teach.this_word:
    title: This
    gloss: this
    note: "این means this."
  prs.a1.unit19.lesson04.teach.has_word:
    title: "It has"
    gloss: "it has"
    note: "دارد is the third-person present of داشتن (to have)."
  prs.a1.unit19.lesson04.teach.one_word:
    title: One
    gloss: one
    note: "یک means one."
    example_gloss: "I have one kitchen."
  prs.a1.unit19.lesson04.teach.and_word:
    title: And
    gloss: and
    note: "و means and, joining two clauses or items."
  prs.a1.unit19.lesson04.teach.description_text:
    title: "A short home description"
    gloss: "This house has two bedrooms. It has a kitchen and a bathroom."
    note: "A short third-person description stating room counts."
  prs.a1.unit19.lesson05.teach.big_word:
    title: Big
    gloss: big
    note: "بزرگ means big, already established via its comparative بزرگ‌تر in this course's comparisons unit."
    example_gloss: "The kitchen is big."
  prs.a1.unit19.lesson05.teach.across_from_word:
    title: "Across from"
    gloss: "across from"
    note: "مقابل means across from or opposite."
  prs.a1.unit19.lesson05.teach.longer_description_text:
    title: "A longer home description"
    gloss: "This house has two bedrooms. It has a kitchen and a bathroom. The kitchen is big. The table is across from the window."
    note: "The same description as lesson04, extended with size and location facts."
  prs.a1.unit19.lesson06.teach.names:
    title: "Laila and Feridoon"
    gloss: "Laila, Feridoon"
    note: "Recurring characters in this course."
    example_gloss: ["I am Laila.", "I am Feridoon."]
  prs.a1.unit19.lesson06.teach.you_word:
    title: "You (polite)"
    gloss: you
    note: "شما is the polite second-person pronoun."
  prs.a1.unit19.lesson06.teach.how_many_word:
    title: "How many"
    gloss: "how many"
    note: "چند means how many."
  prs.a1.unit19.lesson06.teach.yes_word:
    title: "Yes"
    gloss: "yes"
    note: "بلی is the polite/formal word for yes, consistent with this course's register."
    example_gloss: "Yes, it's big."
  prs.a1.unit19.lesson06.teach.dialogue_line1:
    title: "Feridoon asks"
    gloss: "How many rooms does your house have?"
  prs.a1.unit19.lesson06.teach.dialogue_line2:
    title: "Laila answers"
    gloss: "It has two bedrooms."
  prs.a1.unit19.lesson06.teach.dialogue_line3:
    title: "Feridoon asks"
    gloss: "Is the kitchen big?"
  prs.a1.unit19.lesson06.teach.dialogue_line4:
    title: "Laila answers"
    gloss: "Yes, it's big."

exercises:
  prs.a1.unit19.lesson01.exercise01.recognize_house:
    instruction: "What does this word mean?"
    correct_option: "house / home"
    distractors: [room, kitchen, bathroom]
    accepted_answers: [{value: "house / home", status: correct}]
    feedback: "خانه means house or home."
  prs.a1.unit19.lesson01.exercise02.recognize_kitchen:
    instruction: "What does this word mean?"
    correct_option: kitchen
    distractors: [bathroom, bedroom, room]
    accepted_answers: [{value: kitchen, status: correct}]
    feedback: "آشپزخانه means kitchen."
  prs.a1.unit19.lesson01.exercise03.match_room_words:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {خانه: "house / home", "اتاق خواب": bedroom, آشپزخانه: kitchen, تشناب: bathroom, دارم: "I have", اتاق: room}
        status: correct
    feedback: "These are this lesson's core room vocabulary."
  prs.a1.unit19.lesson01.exercise04.translate_i_have_a_bedroom:
    instruction: "Translate into Dari: I have a bedroom."
    accepted_answers:
      - {value: "اتاق خواب دارم", status: correct}
    feedback: "اتاق خواب دارم means I have a bedroom."
  prs.a1.unit19.lesson01.exercise05.translate_i_have_a_kitchen:
    instruction: "Translate into Dari: I have a kitchen."
    accepted_answers:
      - {value: "آشپزخانه دارم", status: correct}
    feedback: "آشپزخانه دارم means I have a kitchen."
  prs.a1.unit19.lesson02.exercise01.recognize_chair:
    instruction: "What does this word mean?"
    correct_option: chair
    distractors: [table, bed, window]
    accepted_answers: [{value: chair, status: correct}]
    feedback: "چوکی means chair."
  prs.a1.unit19.lesson02.exercise02.recognize_window:
    instruction: "What does this word mean?"
    correct_option: window
    distractors: [table, chair, bed]
    accepted_answers: [{value: window, status: correct}]
    feedback: "کلکین means window."
  prs.a1.unit19.lesson02.exercise03.match_object_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {میز: table, چوکی: chair, تخت: bed, کلکین: window, اتاق: room, آشپزخانه: kitchen}
        status: correct
    feedback: "These combine lesson02's new words with lesson01's review vocabulary."
  prs.a1.unit19.lesson02.exercise04.translate_i_have_a_table:
    instruction: "Translate into Dari: I have a table."
    accepted_answers:
      - {value: "میز دارم", status: correct}
    feedback: "میز دارم means I have a table."
  prs.a1.unit19.lesson02.exercise05.translate_i_have_a_chair:
    instruction: "Translate into Dari: I have a chair."
    accepted_answers:
      - {value: "چوکی دارم", status: correct}
    feedback: "چوکی دارم means I have a chair."
  prs.a1.unit19.lesson03.exercise01.recognize_two_rooms:
    instruction: "What does this sentence mean?"
    correct_option: "I have two rooms"
    distractors: ["I have three rooms", "I have a table", "The table is near the window"]
    accepted_answers: [{value: "I have two rooms", status: correct}]
    feedback: "دو اتاق دارم means I have two rooms."
  prs.a1.unit19.lesson03.exercise02.recognize_table_near_window:
    instruction: "What does this sentence mean?"
    correct_option: "The table is near the window"
    distractors: ["The chair is near the window", "I have a table", "I have two rooms"]
    accepted_answers: [{value: "The table is near the window", status: correct}]
    feedback: "میز نزدیک کلکین است means the table is near the window."
  prs.a1.unit19.lesson03.exercise03.match_quantity_location_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {دو: two, سه: three, نزدیک: near, است: "is", اتاق: room, میز: table, کلکین: window}
        status: correct
    feedback: "These combine lesson03's new words with earlier review vocabulary."
  prs.a1.unit19.lesson03.exercise04.translate_i_have_two_rooms:
    instruction: "Translate into Dari: I have two rooms."
    accepted_answers:
      - {value: "دو اتاق دارم", status: correct}
    feedback: "دو اتاق دارم means I have two rooms."
  prs.a1.unit19.lesson03.exercise05.translate_table_near_window:
    instruction: "Translate into Dari: The table is near the window."
    accepted_answers:
      - {value: "میز نزدیک کلکین است", status: correct}
    feedback: "میز نزدیک کلکین است means the table is near the window."
  prs.a1.unit19.lesson04.exercise01.reading_comprehension_bedroom_count:
    instruction: "Read the description. How many bedrooms does this house have?"
    correct_option: Two
    distractors: [One, Three, "It isn't stated"]
    accepted_answers: [{value: Two, status: correct}]
    feedback: "The description says این خانه دو اتاق خواب دارد -- this house has two bedrooms."
  prs.a1.unit19.lesson04.exercise02.reading_comprehension_kitchen_count:
    instruction: "Read the description. How many kitchens does this house have?"
    correct_option: One
    distractors: [Two, "None", "It isn't stated"]
    accepted_answers: [{value: One, status: correct}]
    feedback: "The description says یک آشپزخانه ... دارد -- it has one kitchen."
  prs.a1.unit19.lesson04.exercise03.match_description_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {این: this, دارد: "it has", یک: one, و: and, آشپزخانه: kitchen, تشناب: bathroom}
        status: correct
    feedback: "These are the description's key words."
  prs.a1.unit19.lesson04.exercise04.translate_this_house_has_two_bedrooms:
    instruction: "Translate into Dari: This house has two bedrooms."
    accepted_answers:
      - {value: "این خانه دو اتاق خواب دارد", status: correct}
    feedback: "این خانه دو اتاق خواب دارد means this house has two bedrooms."
  prs.a1.unit19.lesson04.exercise05.write_own_home_sentence:
    instruction: "Write one sentence in Dari about your own home (how many rooms, or one object you have)."
    accepted_answers:
      - {value: "دو اتاق خواب دارم", status: correct}
      - {value: "سه اتاق خواب دارم", status: correct}
      - {value: "یک آشپزخانه دارم", status: correct}
      - {value: "یک تشناب دارم", status: correct}
      - {value: "میز دارم", status: correct}
      - {value: "چوکی دارم", status: correct}
    feedback: "دو اتاق خواب دارم means I have two bedrooms -- a good model answer. Any true fact using this unit's vocabulary is equally accepted."
  prs.a1.unit19.lesson05.exercise01.reading_comprehension_kitchen_size:
    instruction: "Read the description. Is the kitchen big or small?"
    correct_option: Big
    distractors: [Small, "It isn't stated", Medium]
    accepted_answers: [{value: Big, status: correct}]
    feedback: "The description says آشپزخانه بزرگ است -- the kitchen is big."
  prs.a1.unit19.lesson05.exercise02.reading_comprehension_table_location:
    instruction: "Read the description. Where is the table?"
    correct_option: "Across from the window"
    distractors: ["Near the window", "In the kitchen", "It isn't stated"]
    accepted_answers: [{value: "Across from the window", status: correct}]
    feedback: "The description says میز مقابل کلکین است -- the table is across from the window."
  prs.a1.unit19.lesson05.exercise03.match_longer_description_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {بزرگ: big, مقابل: "across from", میز: table, کلکین: window, آشپزخانه: kitchen, تشناب: bathroom, دارد: "it has"}
        status: correct
    feedback: "These combine lesson05's new words with earlier review vocabulary."
  prs.a1.unit19.lesson05.exercise04.reading_comprehension_full_check:
    instruction: "Read the description. Which of these is true?"
    correct_option: "The house has two bedrooms, a kitchen, and a bathroom; the kitchen is big"
    distractors: ["The house has three bedrooms and a small kitchen", "The house has one bedroom and no kitchen", "The table is near the window, not across from it"]
    accepted_answers: [{value: "The house has two bedrooms, a kitchen, and a bathroom; the kitchen is big", status: correct}]
    feedback: "این خانه دو اتاق خواب دارد. یک آشپزخانه و یک تشناب دارد. آشپزخانه بزرگ است -- the house has two bedrooms, a kitchen, and a bathroom, and the kitchen is big."
  prs.a1.unit19.lesson05.exercise05.write_home_description:
    instruction: "Write two or three sentences in Dari describing your home: how many rooms you have, one object you have, and whether something is big."
    accepted_answers:
      - {value: "دو اتاق خواب دارم. میز دارم. آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم. میز دارم، آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم. میز دارم و آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم، میز دارم. آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم، میز دارم، آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم، میز دارم و آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم و میز دارم. آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم و میز دارم، آشپزخانه بزرگ است", status: correct}
      - {value: "دو اتاق خواب دارم و میز دارم و آشپزخانه بزرگ است", status: correct}
      - {value: "یک آشپزخانه دارم. چوکی دارم. آشپزخانه بزرگ است", status: correct}
      - {value: "سه اتاق خواب دارم، تخت دارم، آشپزخانه بزرگ است", status: correct}
      - {value: "یک تشناب دارم و میز دارم و میز نزدیک کلکین است", status: correct}
    feedback: "دو اتاق خواب دارم، میز دارم، آشپزخانه بزرگ است means I have two bedrooms, I have a table, the kitchen is big -- a good model answer. Any true combination of a room count, an object, and a size/location fact from this unit's vocabulary, joined by a period, comma, or و at either boundary, is equally accepted."
  prs.a1.unit19.lesson06.exercise01.dialogue_comprehension_bedroom_count:
    instruction: "Read the conversation. How many bedrooms does Laila's house have?"
    correct_option: Two
    distractors: [One, Three, "It isn't stated"]
    accepted_answers: [{value: Two, status: correct}]
    feedback: "لیلا says دو اتاق خواب دارد -- it has two bedrooms."
  prs.a1.unit19.lesson06.exercise02.match_dialogue_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {شما: "you", چند: "how many", بلی: "yes", لیلا: Laila, فریدون: Feridoon, بزرگ: big}
        status: correct
    feedback: "These are the dialogue's key words and names."
  prs.a1.unit19.lesson06.exercise03.reading_comprehension_kitchen_big:
    instruction: "Read the lines. Is Laila's kitchen big?"
    correct_option: "Yes"
    distractors: ["No", "It isn't stated", "It's medium-sized"]
    accepted_answers: [{value: "Yes", status: correct}]
    feedback: "لیلا says بلی، بزرگ است -- yes, it's big."
  prs.a1.unit19.lesson06.exercise04.dialogue_response_own_home:
    instruction: "Feridoon asks 'خانه شما چند اتاق دارد؟' (How many rooms does your house have?). Answer, saying how many bedrooms you have and one more object you have."
    accepted_answers:
      - {value: "دو اتاق خواب دارم. میز دارم", status: correct}
      - {value: "دو اتاق خواب دارم، میز دارم", status: correct}
      - {value: "دو اتاق خواب دارم و میز دارم", status: correct}
      - {value: "یک اتاق خواب دارم. چوکی دارم", status: correct}
      - {value: "یک اتاق خواب دارم، چوکی دارم", status: correct}
      - {value: "یک اتاق خواب دارم و چوکی دارم", status: correct}
    feedback: "دو اتاق خواب دارم، میز دارم means I have two bedrooms, I have a table. Any true room count and object from this unit's vocabulary, joined by a period, comma, or و, is equally accepted."
  prs.a1.unit19.lesson06.exercise05.write_dialogue_summary:
    instruction: "Write two or three sentences in Dari summarizing the conversation: say how many bedrooms Laila's house has, and whether the kitchen is big."
    accepted_answers:
      - {value: "لیلا دو اتاق خواب دارد. آشپزخانه بزرگ است", status: correct}
      - {value: "لیلا دو اتاق خواب دارد، آشپزخانه بزرگ است", status: correct}
      - {value: "لیلا دو اتاق خواب دارد و آشپزخانه بزرگ است", status: correct}
    feedback: "لیلا دو اتاق خواب دارد، آشپزخانه بزرگ است means Laila has two bedrooms, the kitchen is big -- joined by a period, comma, or و, all equally accepted."
