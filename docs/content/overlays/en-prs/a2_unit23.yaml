course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: describing how life used to be, in childhood, at a previous home or job, and how it is now. The habitual past (می‌ plus the past stem), its negative, and the contrast with the simple past and the present.'
units:
  prs.a2.unit23.how_it_used_to_be:
    title: How life used to be
lessons:
  prs.a2.unit23.lesson01.then_and_now_words:
    title: Then-and-now words and the habitual form
  prs.a2.unit23.lesson02.more_verbs:
    title: The habitual past with more verbs
  prs.a2.unit23.lesson03.past_or_habit_or_now:
    title: Simple past, habitual past, present, and the negative
  prs.a2.unit23.lesson04.my_old_life:
    title: 'My old life: neighbourhood, school and work'
  prs.a2.unit23.lesson05.reading_and_listening:
    title: Reading and listening about a childhood
  prs.a2.unit23.lesson06.conversation_then_and_now:
    title: A conversation about then and now
teaching:
  prs.a2.unit23.lesson01.teach.before:
    title: Before, in the past
    gloss: before, in the past, formerly
    note: '*قبلاً* looks back to an earlier time of your life. It is the word that opens most ''how it used to be'' sentences: *قبلاً در هرات زندگی می‌کردم.* It does not by itself make the verb habitual; the verb does that, as you will see below.'
    example_gloss: Before, I used to live in Herat.
  prs.a2.unit23.lesson01.teach.now:
    title: Now
    gloss: now, at this time
    note: '*حالا* is now, the other half of every then-and-now contrast. The verb after *حالا* is the plain present: *حالا در کابل زندگی می‌کنم.*'
    example_gloss: Now I live in Kabul.
  prs.a2.unit23.lesson01.teach.every_day:
    title: Every day
    gloss: every day
    note: '*هر* means every and *روز* is day. *هر روز* is the clearest time phrase for a repeated habit, in the past and in the present.'
    example_gloss: Every day I used to go to school.
  prs.a2.unit23.lesson01.teach.always:
    title: Always
    gloss: always
    note: '*همیشه* means always. Like *هر روز*, it goes naturally with a habit and tells the listener that something happened again and again.'
    example_gloss: I always used to play with my friends.
  prs.a2.unit23.lesson01.teach.when_small:
    title: When I was small
    gloss: when I was small, when I was a child
    note: '*وقتی* means when, *کوچک* means small and *بودم* is I was. Together *وقتی کوچک بودم* is the standard way to open a story about your childhood.'
  prs.a2.unit23.lesson01.teach.school:
    title: School
    gloss: school
    note: '*مکتب* is the everyday Afghan word for school. A pupil is *شاگرد*, but you only need *مکتب* here.'
    example_gloss: I go to school every day.
  prs.a2.unit23.lesson01.teach.on_foot:
    title: On foot
    gloss: on foot, walking
    note: '*پیاده* means on foot. It sits before the verb: *پیاده به مکتب می‌رفتم* is I used to walk to school.'
    example_gloss: I walk to school (I go to school on foot).
  prs.a2.unit23.lesson01.teach.cities:
    title: Herat, Kabul
    gloss: Herat, Kabul
    note: '*هرات* and *کابل* are two Afghan cities. Cities take *در* (in): *در هرات* is in Herat, *در کابل* is in Kabul.'
    example_gloss:
    - He or she is in Herat.
    - We are in Kabul.
  prs.a2.unit23.lesson01.teach.to_live:
    title: To live
    gloss: to live, to be alive somewhere
    note: '*زندگی کردن* is to live, in the sense of living in a place. *زندگی* is life and *کردن* is the verb that takes the endings: *زندگی می‌کنم* is I live.'
    example_gloss: We live in Kabul.
  prs.a2.unit23.lesson01.teach.go_paradigm:
    title: 'The habitual past: می + past stem + endings'
    gloss: I used to go, you used to go, he or she used to go, we used to go, you (formal or plural) used to go, they used to go
    note: 'To say what used to happen again and again, put *می‌* in front of the past stem and add the same endings you know from the simple past. The past stem of *رفتن* (to go) is *رفت* (drop the final *ن*). So: *می‌رفتم* (I used to go), *می‌رفتی* (you, to a friend), *می‌رفت* (he or she), *می‌رفتیم* (we), *می‌رفتین* (you, formal or plural) and *می‌رفتند* (they). Compare the simple past *رفتم*, which is one finished event, and the present *می‌روم*, which uses the present stem *رو*. The habitual past can also be translated ''I would go'' or ''I was going''. The pronoun (*من، تو، او*) is optional because the ending already shows who. Do not confuse *می‌رفتم* with *می‌روم*: only one letter before the ending changes, but the first is the past and the second is now.'
  prs.a2.unit23.lesson01.teach.do_forms:
    title: 'Same rule, new verb: to do'
    gloss: I used to do, you used to do, he or she used to do, we used to do, you (formal or plural) used to do, they used to do
    note: '*کردن* (to do, to make) has the past stem *کرد*. The habitual past is *می‌کردم، می‌کردی، می‌کرد، می‌کردیم، می‌کردین، می‌کردند*. This verb is very useful because many Dari verbs are a noun plus *کردن*: *زندگی کردن* (to live), *بازی کردن* (to play), *کار کردن* (to work). The *می‌* and the ending always go on *کردن*, never on the noun: *زندگی می‌کردم*, I used to live.'
  prs.a2.unit23.lesson01.teach.zwnj:
    title: 'Spelling: می‌ and نمی‌ are followed by a half-space'
    gloss: I used to go and I used not to go
    note: 'In writing, *می‌* and *نمی‌* are separate prefixes, so they are followed by a zero-width non-joiner (ZWNJ, the ''half-space''): *می‌رفتم*, *نمی‌رفتم*. They do not join to the verb and they are not separated by a full space. If you type on a Persian keyboard, use the half-space key (often Shift plus Space) after *می* and *نمی*. The same half-space is used in the plural *ها* and in *آن‌ها*.'
  prs.a2.unit23.lesson02.teach.eat_paradigm:
    title: 'Same rule, new verb: to eat'
    gloss: I used to eat, you used to eat, he or she used to eat, we used to eat, you (formal or plural) used to eat, they used to eat
    note: 'The rule from *رفتن* works for regular verbs. *خوردن* (to eat) loses its *ن* to give the past stem *خورد*. Put *می‌* in front and add the endings: *می‌خوردم، می‌خوردی، می‌خورد، می‌خوردیم، می‌خوردین، می‌خوردند*. The he or she form is the bare stem with *می‌*, so *می‌خورد* means he or she used to eat.'
  prs.a2.unit23.lesson02.teach.tea:
    title: Tea
    gloss: tea
    note: '*چای* is tea, the drink Afghans have with almost every meal. You *چای می‌خوری*, you drink tea, using the verb *خوردن*.'
    example_gloss: Every morning I used to drink tea.
  prs.a2.unit23.lesson02.teach.morning:
    title: Morning
    gloss: morning, in the morning
    note: '*صبح* is morning. *هر روز صبح* is every morning, and *هر شب* is every night.'
    example_gloss: Every morning I used to go to school.
  prs.a2.unit23.lesson02.teach.night:
    title: Night
    gloss: night, evening
    note: '*شب* is night or evening. *هر شب* is every night. It is a review word from the daily-routine units.'
    example_gloss: Every night I used to read a book.
  prs.a2.unit23.lesson02.teach.book:
    title: Book
    gloss: book
    note: '*کتاب* is a book. With *خواندن* (to read) you say *کتاب خواندن*, to read a book. With the same verb you also say *درس خواندن*, to study.'
    example_gloss: I used to read a book.
  prs.a2.unit23.lesson02.teach.football:
    title: To play football
    gloss: to play football
    note: '*بازی کردن* is to play, and *فوتبال* is football. As with other ''noun plus *کردن*'' verbs, the *می‌* and the ending go on *کردن*: *فوتبال بازی می‌کردم*.'
    example_gloss: I used to play football with my friends.
  prs.a2.unit23.lesson02.teach.after_school:
    title: After school
    gloss: after school
    note: '*بعد از* means after, and it is followed by a noun: *بعد از مکتب* is after school.'
    example_gloss: After school I used to come home.
  prs.a2.unit23.lesson02.teach.friends:
    title: My friends
    gloss: my friends
    note: '*دوستان* is friends and *-م* adds my: *دوستانم* is my friends, a review word. With means *با*: *با دوستانم*.'
    example_gloss: My friends used to come to our house.
  prs.a2.unit23.lesson02.teach.more_verbs:
    title: Four more verbs, one rule
    gloss: to see, to do, to come, to read in the habitual past
    note: 'Every regular verb takes the same form: drop *ن* from the infinitive and put *می‌* in front of the past stem with the endings. *دیدن* (to see) gives *می‌دیدم*. *کردن* (to do or make) gives *می‌کردم*. *آمدن* (to come) gives *می‌آمدم*; the past stem *آمد* keeps its long *آ* after *می‌*, so you write *می‌آمدم*, never *می‌امدم*. *خواندن* (to read or study) gives *می‌خواندم*. Spoken and written Dari both use this form.'
  prs.a2.unit23.lesson02.teach.be_have:
    title: To be and to have in the past
    gloss: I was, you were, he or she was, we were, you (formal or plural) were, they were; I had, you had, ...
    note: 'The past of *بودن* (to be) is *بودم، بودی، بود، بودیم، بودین، بودند*, and the past of *داشتن* (to have) is *داشتم، داشتی، داشت، داشتیم، داشتین، داشتند*. These two verbs describe states, so they are already the ''used to be'' and ''used to have'' forms and you normally do not add *می‌*: *وقتی کوچک بودم، یک بایسکل داشتم* is when I was small, I had a bicycle.'
  prs.a2.unit23.lesson02.teach.bicycle:
    title: Bicycle
    gloss: bicycle
    note: '*بایسکل* is the Afghan word for bicycle. *یک* is a or one.'
    example_gloss: When I was small, I had a bicycle.
  prs.a2.unit23.lesson03.teach.contrast:
    title: One event, a habit, or now
    gloss: One day I went to the bazaar. Every day I used to go to school. Now I go to the office.
    note: 'Three verb forms can look alike, so ask what the sentence says. If it is ONE finished event, use the simple past: *یک روز به بازار رفتم* (one day I went to the bazaar). If it is something that happened again and again in the past, use *می‌* plus the past stem: *هر روز به مکتب می‌رفتم* (every day I used to go to school). If it is true now, use *می‌* plus the present stem: *حالا به دفتر می‌روم* (now I go to the office). Time words help: *یک روز، دیروز* go with the simple past; *هر روز، همیشه، قبلاً* go with the habitual past; *حالا* goes with the present.'
  prs.a2.unit23.lesson03.teach.one_day:
    title: One day
    gloss: one day, once
    note: '*یک روز* is one day. It introduces ONE event in the past, so the verb is the simple past with no *می‌*.'
    example_gloss: One day I went to the bazaar.
  prs.a2.unit23.lesson03.teach.yesterday:
    title: Yesterday
    gloss: yesterday
    note: '*دیروز* is yesterday. It points to one finished day, so the verb is the simple past: *دیروز به دفتر رفتم*.'
    example_gloss: Yesterday I went to the office.
  prs.a2.unit23.lesson03.teach.office:
    title: Office
    gloss: office
    note: '*دفتر* is an office, a place of work. You go to it with *به*.'
    example_gloss: Now I go to the office every day.
  prs.a2.unit23.lesson03.teach.bus:
    title: Bus
    gloss: bus
    note: '*بس* is the Afghan word for bus. With means *با*: *با بس* is by bus.'
    example_gloss: I go to the office by bus.
  prs.a2.unit23.lesson03.teach.neg_paradigm:
    title: 'The negative habitual past: نمی + past stem'
    gloss: I used not to go, you used not to go, he or she used not to go, we used not to go, you (formal or plural) used not to go, they used not to go
    note: 'To say that something did NOT used to happen, put *نمی‌* instead of *می‌*: *نمی‌رفتم* (I used not to go, I never went), *نمی‌رفتی، نمی‌رفت، نمی‌رفتیم، نمی‌رفتین، نمی‌رفتند*. Do not mix it up with the simple negative past *نرفتم*, which says one finished event did not happen. Compare: *دیروز به مکتب نرفتم* (yesterday I did not go to school) and *جمعه به مکتب نمی‌رفتم* (on Fridays I did not go to school, as a habit). Spell it with the half-space: *نمی‌*.'
  prs.a2.unit23.lesson03.teach.no_longer:
    title: 'No longer: دیگر + negative'
    gloss: I no longer play football.
    note: '*دیگر* with a negative verb means ''no longer'' or ''not any more'': *دیگر فوتبال بازی نمی‌کنم* is I no longer play football. The verb is the present negative *نمی‌کنم*, because the sentence is about now. For something you did before and stopped, you often pair the two halves: *قبلاً هر روز فوتبال بازی می‌کردم، ولی دیگر بازی نمی‌کنم* (before, I used to play football every day, but I no longer play).'
  prs.a2.unit23.lesson04.teach.neighbourhood:
    title: Neighbourhood
    gloss: neighbourhood, area of a town
    note: '*محله* is the neighbourhood, the part of town where you live. *قدیمی* means old.'
    example_gloss: Our house was in an old neighbourhood.
  prs.a2.unit23.lesson04.teach.old:
    title: Old
    gloss: old (of a place or thing)
    note: '*قدیمی* is old, for things and places that have been there a long time. It follows the noun: *محلهٔ قدیمی*.'
    example_gloss: We had an old house.
  prs.a2.unit23.lesson04.teach.neighbours:
    title: Neighbours
    gloss: neighbours
    note: '*همسایه* is a neighbour. The plural takes the half-space: *همسایه‌ها*. Neighbours are an important part of life in an Afghan neighbourhood.'
    example_gloss: The neighbours always used to come to our house.
  prs.a2.unit23.lesson04.teach.grandmother:
    title: Grandmother
    gloss: grandmother
    note: '*مادرکلان* is grandmother, the standard word. *-م* adds my: *مادرکلانم* is my grandmother.'
    example_gloss: On Fridays we used to go to visit my grandmother.
  prs.a2.unit23.lesson04.teach.fridays:
    title: On Fridays
    gloss: on Fridays, every Friday
    note: '*جمعه‌ها* (Fridays, with the half-space) means every Friday. It is another way to say something happened again and again.'
    example_gloss: On Fridays we used to go to the park.
  prs.a2.unit23.lesson04.teach.shop:
    title: Shop
    gloss: shop
    note: '*دوکان* is the Afghan word for a shop. *در دوکان کار کردن* is to work in a shop.'
    example_gloss: Before, I used to work in a shop.
  prs.a2.unit23.lesson04.teach.where_before:
    title: Where did you use to live?
    gloss: Where did you use to live?
    note: '*کجا* means where. A friend asks *قبلاً کجا زندگی می‌کردی؟* with the habitual past in the you (friend) form. For someone you do not know well, say *می‌کردین*.'
  prs.a2.unit23.lesson05.teach.street:
    title: Street
    gloss: street, road
    note: '*سرک* is the Afghan word for a street or road. You play or walk *در سرک*, in the street.'
    example_gloss: We used to play in the street.
  prs.a2.unit23.lesson05.teach.yes:
    title: 'Yes'
    gloss: 'yes'
    note: '*بلی* is yes in Dari, and its opposite is *نخیر* (no). Use *بلی* to answer a yes or no question.'
    example_gloss: Yes, I used to go every day.
  prs.a2.unit23.lesson05.teach.but:
    title: But
    gloss: but
    note: '*ولی* sets two things against each other. In a then-and-now story it often joins what used to happen with what is different.'
    example_gloss: I used to go, but now I do not.
  prs.a2.unit23.lesson05.teach.read_text:
    title: A childhood in Herat
    gloss: When I was small, we lived in Herat. Our house was in an old neighbourhood. Every morning I used to walk to school. After school I used to play football in the street with my friends. On Fridays we used to go to visit my grandmother. Now I live in Kabul and go to the office by bus. I no longer play football.
    note: 'A short written account of a childhood in Herat. Notice the shift: the habitual past (*می‌رفتم، بازی می‌کردم، می‌رفتیم*) describes the old life and the present (*زندگی می‌کنم، می‌روم*) describes now. The last sentence, *دیگر فوتبال بازی نمی‌کنم*, says what has stopped.'
  prs.a2.unit23.lesson05.teach.audio_q:
    title: Salima asks Javid about school
    gloss: Javid, did you use to go to school every day?
    note: Salima asks about a past habit with the habitual past in the you (friend) form, *می‌رفتی*. It is a yes or no question.
  prs.a2.unit23.lesson05.teach.audio_a:
    title: Javid answers
    gloss: Yes, I used to walk there every day, but on Friday I did not go.
    note: 'Javid first says what he used to do, then what he did not: *جمعه نمی‌رفتم*. The negative habitual past *نمی‌رفتم* shows that on Fridays he never went.'
  prs.a2.unit23.lesson06.teach.turn01:
    title: Salima asks Javid where he used to live
    gloss: Javid, where did you use to live?
    note: Salima asks about the past with *می‌کردی*, the habitual past in the you (friend) form.
  prs.a2.unit23.lesson06.teach.turn02:
    title: Javid describes his childhood
    gloss: When I was small, we lived in Herat. Every day I used to walk to school, and after school I used to play football with my friends.
    note: 'Javid uses the habitual past for everything that happened again and again: *زندگی می‌کردیم، می‌رفتم، بازی می‌کردم*.'
  prs.a2.unit23.lesson06.teach.turn03:
    title: Salima asks about now
    gloss: Do you play football now too?
    note: '*حالا هم* asks about the present: now as well? The verb switches to *می‌کنی* (present, you).'
  prs.a2.unit23.lesson06.teach.turn04:
    title: Javid says what has changed
    gloss: No, I no longer play football. Now I live in Kabul and go to the office by bus. And you?
    note: '*دیگر ... نمی‌کنم* is no longer. The rest of his answer is in the present, because it is about now. *تو چطور؟* is a short way to say and you?'
  prs.a2.unit23.lesson06.teach.turn05:
    title: Salima tells about her old job
    gloss: Before, I used to work in a shop, but now I work in an office.
    note: Salima contrasts the habitual past *کار می‌کردم* with the present *کار می‌کنم*, joined by *ولی*.
  prs.a2.unit23.lesson06.teach.turn06:
    title: Javid reacts
    gloss: How nice!
    note: '*چه خوب!* is a friendly reaction to good news.'
exercises:
  prs.a2.unit23.lesson01.exercise01.recognize_every_day:
    instruction: What does this sentence mean?
    correct_option: I used to go to school every day
    distractors:
    - I went to school yesterday
    - I go to school every day now
    - I did not go to school
    accepted_answers:
    - value: I used to go to school every day
      status: correct
    feedback: '*هر روز به مکتب می‌رفتم* is I used to go to school every day: *می‌* plus the past stem *رفت* plus *-م*.'
  prs.a2.unit23.lesson01.exercise02.recognize_used_to_live:
    instruction: What does this sentence mean?
    correct_option: I used to live in Herat
    distractors:
    - I live in Herat now
    - I will live in Herat
    - I did not live in Herat
    accepted_answers:
    - value: I used to live in Herat
      status: correct
    feedback: '*قبلاً در هرات زندگی می‌کردم* is I used to live in Herat: *می‌کردم* is the habitual past of *کردن*.'
  prs.a2.unit23.lesson01.exercise03.recognize_always_played:
    instruction: What does this sentence mean?
    correct_option: I always used to play with my friends
    distractors:
    - I played with my friends yesterday
    - I never played with my friends
    - I play with my friends now
    accepted_answers:
    - value: I always used to play with my friends
      status: correct
    feedback: '*همیشه* (always) goes with the habitual past: *بازی می‌کردم* is I used to play.'
  prs.a2.unit23.lesson01.exercise04.match_go_forms:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        می‌رفتم: I used to go
        می‌رفتی: you used to go (to a friend)
        می‌رفت: he or she used to go
        می‌رفتیم: we used to go
        می‌رفتین: you used to go (formal or plural)
        می‌رفتند: they used to go
        قبلاً: before, in the past
        حالا: now
        هر روز: every day
        همیشه: always
      status: correct
    feedback: 'Each ending shows who: *-م* I, *-ی* you (friend), no ending he or she, *-یم* we, *-ین* you (formal or plural), *-ند* they. The *می‌* in front is what makes the past habitual.'
  prs.a2.unit23.lesson01.exercise05.order_walked_school:
    instruction: 'Arrange the words to say: Every day I used to walk to school.'
    accepted_answers:
    - value:
      - هر روز
      - پیاده
      - به
      - مکتب
      - می‌رفتم
      status: correct
    - value:
      - پیاده
      - هر روز
      - به
      - مکتب
      - می‌رفتم
      status: correct
    - value:
      - هر روز
      - به
      - مکتب
      - پیاده
      - می‌رفتم
      status: correct
    feedback: '*هر روز پیاده به مکتب می‌رفتم* puts the time first, the manner next and the habitual verb last.'
