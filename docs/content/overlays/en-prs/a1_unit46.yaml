  required_next_reviewer: codex_fresh_context
  notes: "Authored with prs a1_unit46_pharmacy.yaml for en-prs only. Adapted from DLI Dari Semester 1 (s33-36.pdf) Lesson 34 'At the Pharmacy' per AUTHORING_GUIDE.md #10 -- heavily simplified from the source's B1/B2-level comparative-adverb/past-conditional grammar and contracted spoken dialogue forms down to A1 simple-present statements, one rising-intonation yes/no question, and this course's own established uncontracted -ین imperative family; دواخانه/دواساز/قرص/شربت/نسخه/دانه/بگیرین are genuinely source-verified (دواخانه/دواساز written as single-word compounds per this course's own established -خانه/-ساز compounding precedent from unit43's کتابخانه/کتابدار), دندان‌درد is a course-internal compound built from this course's own already-taught دندان (unit42) using the same compound pattern already established by سردرد/دل‌درد (unit17), not sourced from the DLI vocabulary list's differently-formed دندان دردی. The one اما-joined contrast sentence (lesson06) uses a single canonical comma-اما form, matching unit33/39-45's own established precedent. Dialogue content uses structured speakers in the realization, not embedded speaker labels. No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit, including every matching_pairs right: value (بلی/نخیر are quoted \"Yes\"/\"No\" where they appear as glosses)."
course:
  title: Dari A1
  description: "Beginner Kabul Dari: ask a pharmacist for a basic medicine, describe a simple symptom (headache, stomachache, or toothache), ask for a tablet or syrup, and understand a basic dosage instruction."
units:
  prs.a1.unit46.pharmacy:
    title: Pharmacy and medicine
    description: Ask a pharmacist for a basic medicine, describe a simple symptom, ask for a tablet or syrup, and understand a basic dosage instruction.
lessons:
  prs.a1.unit46.lesson01.pharmacy_and_pharmacist_vocabulary:
    title: Pharmacy and pharmacist
  prs.a1.unit46.lesson02.symptom_vocabulary:
    title: Headache, stomachache, and toothache
  prs.a1.unit46.lesson03.medicine_forms:
    title: Tablet and syrup
  prs.a1.unit46.lesson04.pharmacy_dialogue:
    title: Pharmacy dialogue
  prs.a1.unit46.lesson05.reading:
    title: Reading a prescription
  prs.a1.unit46.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit46.lesson01.teach.review_this_is_in:
    title: "Review: this, is, in"
    gloss: this / is / in
    note: "این, است, and در (used throughout this course) are review words used to talk about the pharmacy."
  prs.a1.unit46.lesson01.teach.pharmacy_word:
    title: Pharmacy
    gloss: pharmacy
    note: "دواخانه literally means \"medicine house\" -- built the same way as کتابخانه (\"book house\", library, unit43)."
    example_gloss: This is a pharmacy.
  prs.a1.unit46.lesson01.teach.this_is_pharmacy_phrase:
    title: This is a pharmacy
    gloss: This is a pharmacy.
    note: "این دواخانه است combines the words taught earlier in this lesson."
  prs.a1.unit46.lesson01.teach.pharmacist_word:
    title: Pharmacist
    gloss: pharmacist
    note: "دواساز literally means \"medicine maker.\""
    example_gloss: The pharmacist is in the pharmacy.
  prs.a1.unit46.lesson01.teach.pharmacist_in_pharmacy_phrase:
    title: The pharmacist is in the pharmacy
    gloss: The pharmacist is in the pharmacy.
    note: "دواساز در دواخانه است combines دواساز (pharmacist) and دواخانه (pharmacy)."
  prs.a1.unit46.lesson01.teach.review_medicine_want:
    title: "Review: medicine, I want"
    gloss: medicine / I want
    note: "دوا (from unit17) and می‌خواهم are review words used to ask for medicine."
  prs.a1.unit46.lesson01.teach.want_medicine_phrase:
    title: I want medicine
    gloss: I want medicine.
    note: "دوا می‌خواهم combines دوا (medicine) and می‌خواهم (I want)."
  prs.a1.unit46.lesson02.teach.review_headache_stomachache_have:
    title: "Review: headache, stomachache, I have, you have"
    gloss: headache / stomachache / I have / you have (polite)
    note: "سردرد, دل‌درد, دارم, and دارین (from unit17/unit03) are review words used to describe a symptom."
  prs.a1.unit46.lesson02.teach.review_very_yes_no:
    title: "Review: very, yes, no"
    gloss: very / yes / no
    note: "بسیار, بلی, and نخیر (from earlier units) are review words used to answer a symptom question."
  prs.a1.unit46.lesson02.teach.toothache_word:
    title: Toothache
    gloss: toothache
    note: "دندان‌درد combines دندان (tooth, unit42) with the same -درد (\"pain\") pattern already used in سردرد and دل‌درد."
    example_gloss: I have a toothache.
  prs.a1.unit46.lesson02.teach.severe_toothache_phrase:
    title: I have a bad toothache
    gloss: I have a bad toothache.
    note: "بسیار دندان‌درد دارم uses بسیار (very) to intensify the symptom."
  prs.a1.unit46.lesson02.teach.do_you_have_headache_phrase:
    title: Do you have a headache?
    gloss: Do you have a headache?
    note: "سردرد دارین؟ is a yes/no question formed by rising intonation, without a separate question word."
  prs.a1.unit46.lesson02.teach.no_toothache_phrase:
    title: "No, I have a toothache"
    gloss: "No, I have a toothache."
    note: "نخیر (from unit03) answers the previous question and names the actual symptom."
  prs.a1.unit46.lesson03.teach.review_want_one:
    title: "Review: I want, a/one"
    gloss: I want / a / one
    note: "می‌خواهم and یک (from earlier units) are review words used to ask for a medicine form."
  prs.a1.unit46.lesson03.teach.tablet_word:
    title: Tablet
    gloss: tablet / pill
    note: "قرص is the everyday Dari word for a tablet or pill."
    example_gloss: I want a tablet.
  prs.a1.unit46.lesson03.teach.want_tablet_phrase:
    title: I want a tablet
    gloss: I want a tablet.
    note: "یک قرص می‌خواهم combines یک (a) and قرص (tablet)."
  prs.a1.unit46.lesson03.teach.syrup_word:
    title: Syrup
    gloss: syrup
    note: "شربت is the everyday Dari word for a liquid medicine or syrup."
    example_gloss: I want syrup.
  prs.a1.unit46.lesson03.teach.want_syrup_phrase:
    title: I want syrup
    gloss: I want syrup.
    note: "شربت می‌خواهم combines شربت (syrup) and می‌خواهم (I want)."
  prs.a1.unit46.lesson03.teach.review_which_medicine_want_polite:
    title: "Review: which, medicine, you want (polite)"
    gloss: which / medicine / you want (polite)
    note: "کدام (from unit14/unit43), دوا, and می‌خواهین (from unit13/unit43) are review words used to ask what a customer wants."
  prs.a1.unit46.lesson03.teach.which_medicine_phrase:
    title: Which medicine do you want?
    gloss: Which medicine do you want?
    note: "کدام دوا می‌خواهین؟ is the polite question a pharmacist would ask."
  prs.a1.unit46.lesson04.teach.review_hello_stomachache_have:
    title: "Review: hello, stomachache, I have"
    gloss: hello / stomachache / I have
    note: "سلام, دل‌درد, and دارم (from earlier units) are review words used to open the dialogue."
  prs.a1.unit46.lesson04.teach.review_medicine_want_polite_yes:
    title: "Review: medicine, you want (polite), yes"
    gloss: medicine / you want (polite) / yes
    note: "دوا, می‌خواهین, and بلی (from earlier units) are review words used in the pharmacist's questions."
  prs.a1.unit46.lesson04.teach.review_this_tablet_good_is:
    title: "Review: this, tablet, good, is"
    gloss: this / tablet / good / is
    note: "این, قرص, خوب, and است (from earlier units and this lesson) are review words used to describe the medicine."
  prs.a1.unit46.lesson04.teach.piece_word:
    title: Piece
    gloss: piece / dose
    note: "دانه is a counter word for a piece or dose, used for tablets."
    example_gloss: Three pieces.
  prs.a1.unit46.lesson04.teach.take_word:
    title: Take
    gloss: take (polite)
    note: "بگیرین is the polite imperative \"take,\" part of the same -ین family as کنین/بنوشین elsewhere in this course."
    example_gloss: Take three pieces a day.
  prs.a1.unit46.lesson04.teach.review_day_three_thanks_welcome:
    title: "Review: day, three, thanks a lot, you're welcome"
    gloss: day / three / thanks a lot / you're welcome
    note: "روز, سه, تشکر زیاد, and خواهش می‌کنم (from earlier units) are review words used to close the dialogue."
  prs.a1.unit46.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I have a stomachache."
    gloss: Hello. I have a stomachache.
  prs.a1.unit46.lesson04.teach.dialogue_line2:
    title: "Pharmacist: Hello. Do you want medicine?"
    gloss: Hello. Do you want medicine?
  prs.a1.unit46.lesson04.teach.dialogue_line3:
    title: "Homayoun: Yes, I want a tablet."
    gloss: Yes, I want a tablet.
  prs.a1.unit46.lesson04.teach.dialogue_line4:
    title: "Pharmacist: This tablet is good. Take three a day."
    gloss: This tablet is good. Take three a day.
  prs.a1.unit46.lesson04.teach.dialogue_line5:
    title: "Homayoun: Thanks a lot."
    gloss: Thanks a lot.
  prs.a1.unit46.lesson04.teach.dialogue_line6:
    title: "Pharmacist: You're welcome."
    gloss: You're welcome.
  prs.a1.unit46.lesson05.teach.review_this_is_from:
    title: "Review: this, is, Homayoun, from"
    gloss: this / is / Homayoun / from
    note: "این, است, همایون, and از (from earlier units) are review words used in the reading passage."
  prs.a1.unit46.lesson05.teach.review_one_tablet_day_three_piece_take:
    title: "Review: one, tablet, day, three, piece, take"
    gloss: one / tablet / day / three / piece / take
    note: "یک, قرص, روز, سه, دانه, and بگیرین (from this unit) are review words used in the reading passage."
  prs.a1.unit46.lesson05.teach.prescription_word:
    title: Prescription
    gloss: prescription
    note: "نسخه is the everyday Dari word for a prescription or medicine label."
    example_gloss: This is a prescription.
  prs.a1.unit46.lesson05.teach.reading_passage:
    title: Reading a prescription
    gloss: "This prescription is from Homayoun. It is one tablet. Take three pieces a day."
  prs.a1.unit46.lesson06.teach.review_but_formal_you_how_many:
    title: "Review: but, you (formal), how many"
    gloss: but / you (formal) / how many
    note: "اما, شما, and چند (from earlier units) are review words used to state a schedule."
  prs.a1.unit46.lesson06.teach.review_morning_night_two_three_piece_is_prescription:
    title: "Review: morning, night, two, three, piece, is, your prescription"
    gloss: morning / night / two / three / piece / is / your prescription
    note: "صبح, شب, دو, سه, دانه, است (from earlier units and this unit), and نسخه‌تان (your prescription, using the same -تان suffix as نام‌تان/تلفن‌تان elsewhere in this course) are review words used to close the unit."
  prs.a1.unit46.lesson06.teach.morning_night_contrast_phrase:
    title: "Morning is two pieces, but night is three pieces"
    gloss: In the morning it's two pieces, but at night it's three pieces.
    note: "اما contrasts the morning dose and the night dose."
  prs.a1.unit46.lesson06.teach.your_prescription_question_phrase:
    title: How many pieces is your prescription?
    gloss: How many pieces is your prescription?
    note: "The formal شما-تان-suffixed version of asking about a prescription's dosage."
exercises:
  prs.a1.unit46.lesson01.exercise01.recognize_pharmacy:
    instruction: Select the correct translation.
    correct_option: pharmacy
    distractors: [pharmacist, medicine, in]
    feedback: "دواخانه means pharmacy."
    accepted_answers:
      - {value: pharmacy, status: correct}
  prs.a1.unit46.lesson01.exercise02.recognize_pharmacist:
    instruction: Select the correct translation.
    correct_option: pharmacist
    distractors: [pharmacy, medicine, "this is a pharmacy"]
    feedback: "دواساز means pharmacist."
    accepted_answers:
      - {value: pharmacist, status: correct}
  prs.a1.unit46.lesson01.exercise03.recognize_pharmacist_in_pharmacy:
    instruction: Select the correct translation.
    correct_option: "The pharmacist is in the pharmacy."
    distractors: ["This is a pharmacy.", "I want medicine.", "The pharmacist is good."]
    feedback: "دواساز در دواخانه است means \"The pharmacist is in the pharmacy.\""
    accepted_answers:
      - {value: "The pharmacist is in the pharmacy.", status: correct}
  prs.a1.unit46.lesson01.exercise04.match_pharmacy_vocab:
    instruction: Match each word or phrase to its meaning.
    accepted_answers:
      - value:
          دواخانه: pharmacy
          دواساز: pharmacist
          دوا: medicine
          در: in
          "این دواخانه است.": "This is a pharmacy."
          "دواساز در دواخانه است.": "The pharmacist is in the pharmacy."
          "دوا می‌خواهم.": "I want medicine."
  prs.a1.unit46.lesson01.exercise05.order_pharmacist_in_pharmacy:
    instruction: Put the words in the correct order.
    accepted_answers: ["دواساز در دواخانه است"]
    feedback: "The correct order is دواساز در دواخانه است."
  prs.a1.unit46.lesson01.exercise06.translate_want_medicine:
    instruction: "Translate into Dari: I want medicine."
    accepted_answers:
      - "دوا می‌خواهم."
      - "دوا می‌خواهم"
    feedback: "دوا می‌خواهم means \"I want medicine.\""
  prs.a1.unit46.lesson01.exercise07.write_pharmacy:
    instruction: Write the Dari word for pharmacy.
    accepted_answers: [دواخانه]
    feedback: "دواخانه means pharmacy."
  prs.a1.unit46.lesson02.exercise01.recognize_severe_toothache:
    instruction: Select the correct translation.
    correct_option: "I have a bad toothache."
    distractors: ["Do you have a headache?", "No, I have a toothache.", "I have a stomachache."]
    feedback: "بسیار دندان‌درد دارم means \"I have a bad toothache.\""
    accepted_answers:
      - {value: "I have a bad toothache.", status: correct}
  prs.a1.unit46.lesson02.exercise02.recognize_do_you_have_headache:
    instruction: Select the correct translation.
    correct_option: "Do you have a headache?"
    distractors: ["I have a bad toothache.", "No, I have a toothache.", "I have a stomachache."]
    feedback: "سردرد دارین؟ means \"Do you have a headache?\""
    accepted_answers:
      - {value: "Do you have a headache?", status: correct}
  prs.a1.unit46.lesson02.exercise03.recognize_no_toothache:
    instruction: Select the correct translation.
    correct_option: "No, I have a toothache."
    distractors: ["I have a bad toothache.", "Do you have a headache?", "I have a stomachache."]
    feedback: "نخیر، دندان‌درد دارم means \"No, I have a toothache.\""
    accepted_answers:
      - {value: "No, I have a toothache.", status: correct}
  prs.a1.unit46.lesson02.exercise04.match_symptom_words:
    instruction: Match each word or phrase to its meaning.
    accepted_answers:
      - value:
          سردرد: headache
          دل‌درد: stomachache
          دندان‌درد: toothache
          بسیار: very
          "بسیار دندان‌درد دارم.": "I have a bad toothache."
          "سردرد دارین؟": "Do you have a headache?"
          "نخیر، دندان‌درد دارم.": "No, I have a toothache."
  prs.a1.unit46.lesson02.exercise05.order_severe_toothache:
    instruction: Put the words in the correct order.
    accepted_answers: ["بسیار دندان‌درد دارم"]
    feedback: "The correct order is بسیار دندان‌درد دارم."
  prs.a1.unit46.lesson02.exercise06.translate_do_you_have_headache:
    instruction: "Translate into Dari: Do you have a headache?"
    accepted_answers:
      - "سردرد دارین؟"
      - "سردرد دارین"
    feedback: "سردرد دارین؟ means \"Do you have a headache?\""
  prs.a1.unit46.lesson02.exercise07.write_toothache:
    instruction: Write the Dari word for toothache.
    accepted_answers: [دندان‌درد]
    feedback: "دندان‌درد means toothache."
  prs.a1.unit46.lesson03.exercise01.recognize_want_tablet:
    instruction: Select the correct translation.
    correct_option: "I want a tablet."
    distractors: ["I want syrup.", "Which medicine do you want?", "I have a bad toothache."]
    feedback: "یک قرص می‌خواهم means \"I want a tablet.\""
    accepted_answers:
      - {value: "I want a tablet.", status: correct}
  prs.a1.unit46.lesson03.exercise02.recognize_want_syrup:
    instruction: Select the correct translation.
    correct_option: "I want syrup."
    distractors: ["I want a tablet.", "Which medicine do you want?", "I have a bad toothache."]
    feedback: "شربت می‌خواهم means \"I want syrup.\""
    accepted_answers:
      - {value: "I want syrup.", status: correct}
  prs.a1.unit46.lesson03.exercise03.recognize_which_medicine:
    instruction: Select the correct translation.
    correct_option: "Which medicine do you want?"
    distractors: ["I want a tablet.", "I want syrup.", "I have a bad toothache."]
    feedback: "کدام دوا می‌خواهین؟ means \"Which medicine do you want?\""
    accepted_answers:
      - {value: "Which medicine do you want?", status: correct}
  prs.a1.unit46.lesson03.exercise04.match_medicine_form_words:
    instruction: Match each word or phrase to its meaning.
    accepted_answers:
      - value:
          قرص: "tablet / pill"
          شربت: syrup
          کدام: which
          دوا: medicine
          "یک قرص می‌خواهم.": "I want a tablet."
          "شربت می‌خواهم.": "I want syrup."
          "کدام دوا می‌خواهین؟": "Which medicine do you want?"
  prs.a1.unit46.lesson03.exercise05.order_want_tablet:
    instruction: Put the words in the correct order.
    accepted_answers: ["یک قرص می‌خواهم"]
    feedback: "The correct order is یک قرص می‌خواهم."
  prs.a1.unit46.lesson03.exercise06.translate_want_syrup:
    instruction: "Translate into Dari: I want syrup."
    accepted_answers:
      - "شربت می‌خواهم."
      - "شربت می‌خواهم"
    feedback: "شربت می‌خواهم means \"I want syrup.\""
  prs.a1.unit46.lesson03.exercise07.write_tablet:
    instruction: Write the Dari word for tablet.
    accepted_answers: [قرص]
    feedback: "قرص means tablet or pill."
  prs.a1.unit46.lesson04.exercise01.dialogue_have_stomachache:
    instruction: Select the correct translation.
    correct_option: "Hello. I have a stomachache."
    distractors: ["Hello. Do you want medicine?", "Yes, I want a tablet.", "Thanks a lot."]
    feedback: "سلام. دل‌درد دارم means \"Hello. I have a stomachache.\""
    accepted_answers:
      - {value: "Hello. I have a stomachache.", status: correct}
  prs.a1.unit46.lesson04.exercise02.dialogue_want_medicine_question:
    instruction: Select the correct translation.
    correct_option: "Hello. Do you want medicine?"
    distractors: ["Hello. I have a stomachache.", "Yes, I want a tablet.", "You're welcome."]
    feedback: "سلام. دوا می‌خواهین؟ means \"Hello. Do you want medicine?\""
    accepted_answers:
      - {value: "Hello. Do you want medicine?", status: correct}
  prs.a1.unit46.lesson04.exercise03.dialogue_tablet_dosage:
    instruction: Select the correct translation.
    correct_option: "This tablet is good. Take three a day."
    distractors: ["Yes, I want a tablet.", "Thanks a lot.", "You're welcome."]
    feedback: "این قرص خوب است. روز سه دانه بگیرین means \"This tablet is good. Take three a day.\""
    accepted_answers:
      - {value: "This tablet is good. Take three a day.", status: correct}
  prs.a1.unit46.lesson04.exercise04.match_dialogue_words:
    instruction: Match each word or phrase to its meaning.
    accepted_answers:
      - value:
          دانه: "piece / dose"
          بگیرین: "take (polite)"
          "سلام. دل‌درد دارم.": "Hello. I have a stomachache."
          "سلام. دوا می‌خواهین؟": "Hello. Do you want medicine?"
          "بلی، یک قرص می‌خواهم.": "Yes, I want a tablet."
          "این قرص خوب است. روز سه دانه بگیرین.": "This tablet is good. Take three a day."
          "تشکر زیاد.": "Thanks a lot."
  prs.a1.unit46.lesson04.exercise05.order_take_three_a_day:
    instruction: Put the words in the correct order.
    accepted_answers: ["روز سه دانه بگیرین"]
    feedback: "The correct order is روز سه دانه بگیرین."
  prs.a1.unit46.lesson04.exercise06.translate_want_medicine_question:
    instruction: "Translate into Dari: Do you want medicine?"
    accepted_answers:
      - "دوا می‌خواهین؟"
      - "دوا می‌خواهین"
    feedback: "دوا می‌خواهین؟ means \"Do you want medicine?\""
  prs.a1.unit46.lesson04.exercise07.write_have_stomachache:
    instruction: Write a Dari sentence meaning "I have a stomachache."
    accepted_answers:
      - "دل‌درد دارم"
      - "دل‌درد دارم."
    feedback: "دل‌درد دارم means \"I have a stomachache.\""
  prs.a1.unit46.lesson05.exercise01.reading_how_many_per_day:
    instruction: According to the passage, how many pieces a day should Homayoun take?
    correct_option: "Three"
    distractors: ["One", "Two", "Five"]
    feedback: "The passage says روز سه دانه بگیرین."
    accepted_answers:
      - {value: "Three", status: correct}
  prs.a1.unit46.lesson05.exercise02.recognize_prescription_from_homayoun:
    instruction: Select the correct translation.
    correct_option: "This prescription is from Homayoun."
    distractors: ["Take three pieces a day.", "This is a prescription.", "I want a tablet."]
    feedback: "این نسخه از همایون است means \"This prescription is from Homayoun.\""
    accepted_answers:
      - {value: "This prescription is from Homayoun.", status: correct}
  prs.a1.unit46.lesson05.exercise03.recognize_three_a_day:
    instruction: Select the correct translation.
    correct_option: "Take three pieces a day."
