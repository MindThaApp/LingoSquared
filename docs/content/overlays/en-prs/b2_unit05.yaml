course:
  title: Dari B2
  description: Adapt requests to a friend, colleague, and institution.
units:
  prs.b2.unit05.register:
    title: Register
    description: Adapt requests to a friend, colleague, and institution.
lessons:
  prs.b2.unit05.register.lesson01.informal:
    title: Informal request
  prs.b2.unit05.register.lesson02.colleague:
    title: Collegial tone
  prs.b2.unit05.register.lesson03.formal:
    title: Formal request
teaching:
  prs.b2.unit05.register.lesson01.informal.teach.card01:
    title: friend
    gloss: friend
    note: '*دوست* marks the informal audience; the rest of the sentence should stay about the same meeting-time change.'
    example_gloss: My friend is at the library.
  prs.b2.unit05.register.lesson01.informal.teach.card02:
    title: can you
    gloss: can you
    note: '*می‌توانی* is singular and familiar, so it fits Farhad but would be too direct for an office.'
    example_gloss: Can you bring this book?
  prs.b2.unit05.register.lesson01.informal.teach.card03:
    title: meeting time
    gloss: meeting time
    note: '*وقت دیدار* is the shared content across all three registers; only the surrounding politeness shifts.'
    example_gloss: Our meeting time is not clear yet.
  prs.b2.unit05.register.lesson01.informal.teach.card04:
    title: move later
    gloss: move later
    note: '*عقب بیندازی* is natural for moving a time later in a friendly request, without the formal weight of *به تعویق بیندازید*.'
    example_gloss: Can you postpone the call?
  prs.b2.unit05.register.lesson01.informal.teach.card05:
    title: friendly
    gloss: friendly
    note: '*دوستانه* names the tone, but the actual request still needs direct second-person wording.'
    example_gloss: A friendly message is shorter.
  prs.b2.unit05.register.lesson01.informal.teach.card06:
    title: if it is possible for you
    gloss: if it is possible for you
    note: '*اگر برایت ممکن است* uses informal *برایت*, matching one close person rather than a colleague.'
    example_gloss: If possible for you, let me know earlier.
  prs.b2.unit05.register.lesson01.informal.teach.card07:
    title: library
    gloss: library
    note: '*کتابخانه* gives the casual meeting setting; do not let it replace the meeting-time request.'
    example_gloss: The university library is quiet.
  prs.b2.unit05.register.lesson01.informal.teach.card08:
    title: one hour
    gloss: one hour
    note: '*یک ساعت* preserves the amount of delay; changing it would break the same-message register contrast.'
    example_gloss: I will arrive one hour later.
  prs.b2.unit05.register.lesson01.informal.teach.card09:
    title: please
    gloss: please
    note: '*لطفا* can soften an informal request, but it is lighter than formal *لطف نموده*.'
    example_gloss: Please answer.
  prs.b2.unit05.register.lesson01.informal.teach.grammar:
    title: Register grammar
    gloss: Register grammar
    note: Informal Dari can use direct *می‌توانی* with a friend. The same message becomes softer in lesson 2 and institutional in lesson 3.
  prs.b2.unit05.register.lesson02.colleague.teach.card01:
    title: if it suits you
    gloss: if it suits you
    note: '*اگر برای شما مناسب است* keeps distance with *شما* while still sounding collegial rather than institutional.'
    example_gloss: If it suits you, let’s call after lunch.
  prs.b2.unit05.register.lesson02.colleague.teach.card02:
    title: meeting time
    gloss: meeting time
    note: '*وقت دیدار* repeats the exact content from the friend version, which helps learners notice register rather than topic change.'
    example_gloss: Our meeting time is still unclear.
  prs.b2.unit05.register.lesson02.colleague.teach.card03:
    title: colleague
    gloss: colleague
    note: '*همکار* signals the middle audience; avoid slipping into either familiar *تو* forms or official-letter wording.'
    example_gloss: Our colleague is at the university today.
  prs.b2.unit05.register.lesson02.colleague.teach.card04:
    title: let us move later
    gloss: let us move later
    note: '*عقب بیندازیم* changes the agency to "we," a useful collegial way to share the inconvenience.'
    example_gloss: Let us move the meeting time one hour later.
  prs.b2.unit05.register.lesson02.colleague.teach.card05:
    title: collegial
    gloss: collegial
    note: '*همکارانه* describes a cooperative tone; it should support, not replace, the actual postponement phrase.'
    example_gloss: A collegial tone reduces pressure.
  prs.b2.unit05.register.lesson02.colleague.teach.card06:
    title: is it possible
    gloss: is it possible
    note: '*امکان دارد* frames the request as a possibility, softer than directly asking *می‌توانی*.'
    example_gloss: Is it possible to send the form today?
  prs.b2.unit05.register.lesson02.colleague.teach.card07:
    title: suitable
    gloss: suitable
    note: '*مناسب* asks about suitability for the other person, a key politeness move in the colleague version.'
    example_gloss: This hour suits the teacher.
  prs.b2.unit05.register.lesson02.colleague.teach.card08:
    title: one hour later
    gloss: one hour later
    note: '*یک ساعت پس‌تر* is a natural way to say one hour later; keep the amount fixed across the register shift.'
    example_gloss: One hour later is better for me.
  prs.b2.unit05.register.lesson02.colleague.teach.card09:
    title: grateful
    gloss: grateful
    note: '*سپاسگزار* adds gratitude after the request, useful for collegial tone without over-formalizing.'
    example_gloss: I am grateful for your help.
  prs.b2.unit05.register.lesson02.colleague.teach.grammar:
    title: Register grammar
    gloss: Register grammar
    note: The colleague version keeps the same meeting-change request but uses *اگر برای شما مناسب است* and first-person plural *عقب بیندازیم*.
  prs.b2.unit05.register.lesson03.formal.teach.card01:
    title: I respectfully request
    gloss: I respectfully request
    note: '*خواهشمندم* opens the institutional request with formal deference instead of friend-level *می‌توانی*.'
    example_gloss: I respectfully request that you email the official response.
  prs.b2.unit05.register.lesson03.formal.teach.card02:
    title: meeting time
    gloss: meeting time
    note: '*وقت دیدار* is the same meeting time from the other registers; only the formality changes.'
    example_gloss: The meeting time is written in the letter.
  prs.b2.unit05.register.lesson03.formal.teach.card03:
    title: if possible
    gloss: if possible
    note: '*در صورت امکان* places the condition politely inside a formal written request.'
    example_gloss: If possible, I will bring the document tomorrow.
  prs.b2.unit05.register.lesson03.formal.teach.card04:
    title: postpone
    gloss: postpone
    note: '*به تعویق بیندازید* is the formal postponement verb here; it avoids the unnatural calque of "turning" a time into another time.'
    example_gloss: Kindly postpone the meeting time by one hour.
  prs.b2.unit05.register.lesson03.formal.teach.card05:
    title: formal
    gloss: formal
    note: '*رسمی* names the register expected for an institution or office.'
    example_gloss: A formal letter must be precise.
  prs.b2.unit05.register.lesson03.formal.teach.card06:
    title: request
    gloss: request
    note: '*درخواست* is the formal noun for the request being made; it does not change the meeting-time content.'
    example_gloss: Write the formal request briefly and clearly.
  prs.b2.unit05.register.lesson03.formal.teach.card07:
    title: document
    gloss: document
    note: '*سند* fits the institutional context around the request without replacing the meeting-time message.'
    example_gloss: The original document remained in the office.
  prs.b2.unit05.register.lesson03.formal.teach.card08:
    title: kindly / please
    gloss: kindly / please
    note: '*لطف نموده* is a formal politeness marker, stronger than casual please.'
    example_gloss: Kindly sign the form.
  prs.b2.unit05.register.lesson03.formal.teach.card09:
    title: office / administration
    gloss: office / administration
    note: '*اداره* signals the office or institution receiving the formal version.'
    example_gloss: The university office is open today.
  prs.b2.unit05.register.lesson03.formal.teach.grammar:
    title: Register grammar
    gloss: Register grammar
    note: The institutional version uses *خواهشمندم* and *به تعویق بیندازید* for a formal postponement request.
