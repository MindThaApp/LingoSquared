    title: Wrap-up
teaching:
  prs.a1.unit56.lesson01.teach.review_this_is_in_good:
    title: "Review: this, is, in, good"
    gloss: "this / is / in / good"
    note: "These are review words for talking about the gym."
  prs.a1.unit56.lesson01.teach.review_gym:
    title: "Review: gym"
    gloss: "gym"
    note: "*باشگاه* was already taught in unit29 (sports), where it was glossed as gym or sports club."
  prs.a1.unit56.lesson01.teach.membership_word:
    title: "Membership"
    gloss: "membership"
    note: "This is the usual Dari word for membership, as in a membership card for a club or center."
    example_gloss: "This gym's membership is good."
  prs.a1.unit56.lesson01.teach.equipment_word:
    title: "Equipment"
    gloss: "equipment / things"
    note: "This is the standard Dari word for equipment, gear, or belongings."
    example_gloss: "This gym has good equipment."
  prs.a1.unit56.lesson01.teach.membership_good_phrase:
    title: "This gym's membership is good"
    gloss: "This gym's membership is good."
    note: "This combines membership and good."
  prs.a1.unit56.lesson01.teach.equipment_phrase:
    title: "This gym has good equipment"
    gloss: "This gym has good equipment."
    note: "*دارد* is the 3rd-person form of 'to have', already established from earlier units."
  prs.a1.unit56.lesson02.teach.review_want_get_membership_card:
    title: "Review: I want, get/take, card, membership, a/one"
    gloss: "I want / get (take) / card / membership / a/one"
    note: "These are review words used to ask for a membership card, the same 'X می‌خواهم Y بگیرم' frame this course already established for a bicycle rental and a doctor's appointment."
  prs.a1.unit56.lesson02.teach.review_day_pass_words:
    title: "Review: daily, how much, afghani, 100"
    gloss: "daily / how much / afghani / 100"
    note: "These are review words used to ask the price of a day pass."
  prs.a1.unit56.lesson02.teach.want_membership_card_phrase:
    title: "I want to get a membership card"
    gloss: "I want to get a membership card."
    note: "This reuses this course's own already-established 'I want to get X' pattern."
  prs.a1.unit56.lesson02.teach.ask_day_pass_price_phrase:
    title: "How much is the day pass?"
    gloss: "How much is the day pass?"
    note: "A day pass is expressed as *کارت روزانه* -- literally 'daily card', combining two already-established words."
  prs.a1.unit56.lesson02.teach.day_pass_price_answer_phrase:
    title: "The day pass is 100 afghanis"
    gloss: "The day pass is 100 afghanis."
  prs.a1.unit56.lesson03.teach.review_gym_hour_what:
    title: "Review: gym, hour/o'clock, what"
    gloss: "gym / hour (o'clock) / what"
    note: "These are review words used to ask about the class time."
  prs.a1.unit56.lesson03.teach.class_word:
    title: "Class"
    gloss: "class"
    note: "This is the Dari word for a class or course. Here it is used for an exercise class at the gym, not only an academic course."
    example_gloss: "The class is at five o'clock."
  prs.a1.unit56.lesson03.teach.review_five:
    title: "Review: five"
    gloss: "five"
    note: "This is a review number from unit04."
  prs.a1.unit56.lesson03.teach.class_time_phrase:
    title: "The class is at five o'clock"
    gloss: "The class is at five o'clock."
  prs.a1.unit56.lesson03.teach.locker_word:
    title: "Locker"
    gloss: "locker"
    note: "This is the Dari word for a locker, closet, or cabinet."
    example_gloss: "I want a locker for my equipment."
  prs.a1.unit56.lesson03.teach.review_for:
    title: "Review: for, equipment"
    gloss: "for / equipment"
    note: "These are review words used to ask for a locker."
  prs.a1.unit56.lesson03.teach.locker_request_phrase:
    title: "I want a locker for my equipment"
    gloss: "I want a locker for my equipment."
  prs.a1.unit56.lesson04.teach.review_hello_want_membership_card:
    title: "Review: hello, I want, membership card, get/take"
    gloss: "hello / I want / membership card / get (take)"
    note: "These are review words used to open the gym-reception dialogue."
  prs.a1.unit56.lesson04.teach.review_welcome_day_pass_price:
    title: "Review: here you go, daily, 100, afghani, is"
    gloss: "here you go (please) / daily / 100 / afghani / is"
    note: "These are review words used to state the day-pass price."
  prs.a1.unit56.lesson04.teach.review_very_good_class_what_hour:
    title: "Review: very good, class, hour, what"
    gloss: "very good / class / hour / what"
    note: "These are review words used to ask about the class time."
  prs.a1.unit56.lesson04.teach.review_class_five:
    title: "Review: class, hour, five"
    gloss: "class / hour / five"
    note: "These are review words used to answer the class-time question."
  prs.a1.unit56.lesson04.teach.review_locker_for_equipment:
    title: "Review: locker, for, equipment, I want"
    gloss: "locker / for / equipment / I want"
    note: "These are review words used to ask for a locker."
  prs.a1.unit56.lesson04.teach.review_thanks_good_day:
    title: "Review: thanks a lot, have a good day"
    gloss: "thanks a lot / have a good day"
    note: "These are review words used to close the dialogue."
  prs.a1.unit56.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want to get a membership card."
    gloss: "Hello. I want to get a membership card."
  prs.a1.unit56.lesson04.teach.dialogue_line2:
    title: "Gym staff: Hello, welcome. The day pass is 100 afghanis."
    gloss: "Hello, welcome. The day pass is 100 afghanis."
  prs.a1.unit56.lesson04.teach.dialogue_line3:
    title: "Homayoun: Very good. What time is the class?"
    gloss: "Very good. What time is the class?"
  prs.a1.unit56.lesson04.teach.dialogue_line4:
    title: "Gym staff: The class is at five o'clock."
    gloss: "The class is at five o'clock."
  prs.a1.unit56.lesson04.teach.dialogue_line5:
    title: "Homayoun: I want a locker for my equipment."
    gloss: "I want a locker for my equipment."
  prs.a1.unit56.lesson04.teach.dialogue_line6:
    title: "Gym staff: Here you go. Thanks a lot. Have a good day!"
    gloss: "Here you go. Thanks a lot. Have a good day!"
  prs.a1.unit56.lesson05.teach.review_this_is_in_to:
    title: "Review: this, is, in, to"
    gloss: "this / is / in / to"
    note: "These are review words used in the reading passage."
  prs.a1.unit56.lesson05.teach.review_he_went_got_has:
    title: "Review: he/she, went, got/took, has"
    gloss: "he/she / went / got (took) / has"
    note: "These are review words used in the reading passage."
  prs.a1.unit56.lesson05.teach.review_gym_membership_equipment_homayoun:
    title: "Review: gym, membership card, equipment, Homayoun"
    gloss: "gym / membership card / equipment / Homayoun"
    note: "These are review words used in the reading passage."
  prs.a1.unit56.lesson05.teach.reading_passage:
    title: "Reading about the gym"
    gloss: "Homayoun went to the gym. He got a membership card. The gym has good equipment."
  prs.a1.unit56.lesson06.teach.review_but_day_pass_price:
    title: "Review: but, card, daily, 100, afghani"
    gloss: "but / card / daily / 100 / afghani"
    note: "These are review words used to state the day-pass price."
  prs.a1.unit56.lesson06.teach.monthly_word:
    title: "Monthly"
    gloss: "monthly"
    note: "Formed with the same -انه adverbial suffix this course's own unit48 already used for *روزانه* (daily), applied here to *ماه* (month)."
    example_gloss: "My membership is monthly."
  prs.a1.unit56.lesson06.teach.review_membership_thousand_one:
    title: "Review: membership, one thousand"
    gloss: "membership / one thousand"
    note: "These are review words used to state the monthly-membership price."
  prs.a1.unit56.lesson06.teach.price_contrast_phrase:
    title: "The day pass is 100 afghanis, but the monthly membership is 1000 afghanis"
    gloss: "The day pass is 100 afghanis, but the monthly membership is 1000 afghanis."
  prs.a1.unit56.lesson06.teach.review_your_membership:
    title: "Review: your membership"
    gloss: "your membership"
    note: "Your membership uses the same formal *-تان* suffix as unit50's your pool ticket, unit52's your cinema ticket, and unit53's your museum ticket, applied here to a new noun."
  prs.a1.unit56.lesson06.teach.your_membership_question_phrase:
    title: "Is your membership monthly?"
    gloss: "Is your membership monthly?"
