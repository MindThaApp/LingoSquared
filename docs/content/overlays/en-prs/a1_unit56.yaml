  notes: "2026-07-10 fresh-context review (Claude): found and fixed ONE real bug -- lesson02.exercise07.write_day_pass_price's realization tested_text was truncated to \"کارت روزانه صد افغانی\" (missing است), inconsistent with the overlay's own instruction/accepted_answers, which both correctly include است (\"کارت روزانه صد افغانی است\"). Since the compiler's untaught-vocabulary check runs against tested_text (not accepted_answers), this was a documentation/consistency gap, not a live grading bug -- fixed by adding است to the realization's tested_text so it matches what the exercise actually requires the learner to produce. Everything else in this unit checked clean against the full checklist (same-speaker-distractor risk, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, exercise-type registration). No listen_select/listen_type/dialogue_comprehension exercises exist in this file, so the same-speaker-distractor bug class doesn't structurally arise (every multiple_choice item shows literal Dari text, not audio). Re-validated clean after the fix: 0 errors/0 warnings standalone and as part of the full en-prs A1 corpus. Re-verified against the file's own original self-report below, which is otherwise accurate. Authored with prs a1_unit56_gym.yaml for en-prs only. Firecrawl was retried fresh (`firecrawl search`) and again returned no usable result, so the shared scratchpad's already-cached DLI Dari corpus was searched instead and this time found real, repeated attestation: عضویت (membership) and کارت عضویت (membership card) both appear in DLI Semester 1 Lesson 22's own lesson vocabulary list across five separate cumulative PDF exports (s21-24/s25-28/s29-32/s33-36/s37-40), with real worked example sentences about a student getting a cultural-center membership card; الماری (locker/closet/cabinet) appears independently in s29-32/s33-36/s37-40 with a real worked example about a locker between two beds; equipment itself is independently glossed as تجهیزات = وسایل = لوازم in s33-36/s37-40, confirming وسایل (this course's own already-established household-items word) as a genuinely DLI-attested translation of 'equipment'; and کورس (course/class) appears in the same Lesson 22 vocabulary list, glossed against a real 'They may have English classes' example -- reused here in its gym-exercise-class sense, a legitimate semantic extension of the same real word rather than an invented one. A DLI phrase list (Performance Checks, 'Direct me to the nearest gym') separately confirmed ورزشگاه as a real alternate word for gym/stadium, but this course's own unit29 already established و explicitly glossed باشگاه as 'gym or sports club', so باشگاه is reused as review per this project's dialect-consistency discipline rather than switching to the newly-found synonym. Four new content words this unit, three DLI-attested (عضویت, وسایل, الماری) and one DLI-attested with an applied sense extension (کورس); a fifth, ماهانه (monthly), is not directly source-attested but is formed by the same -انه adverbial suffix this course's own unit48 already used to coin روزانه (daily) -- an established-conventions extension of a real in-corpus precedent, not a fresh invention. No new grammar beyond ordinary recombination of already-taught patterns: می‌خواهم X بگیرم (unit42/unit43/unit48), گرفت (unit23), دارد (unit03/unit04/unit14/unit19/unit21), and ساعت چند (unit42). Everything else reuses this course's own established vocabulary: باشگاه (unit29), کارت (unit23), روزانه (unit48), چند/افغانی/صد/هزار (unit04/unit10/unit23), بگیرم (unit42/unit43/unit48), بسیار خوب/سلام/بفرمایین/تشکر زیاد/روز خوش (multiple earlier units), برای (unit42), ساعت/پنج (unit04/unit42), او/رفت (multiple earlier units), اما (unit33/unit39-55). No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit. Dialogue content uses structured speakers in the realization, not embedded speaker labels. Lesson04's multiple_choice distractors were re-checked against the standing same-speaker-distractor rule; a first draft had two exercises (testing a کارمند باشگاه line each) drawing a distractor from a DIFFERENT کارمند باشگاه line -- caught before shipping and fixed so every distractor for a given tested line is drawn only from the OTHER character's lines. This task did not open any fa/a1_unit* file at any point -- fa and prs are separate realizations per universal_spine.yaml's own explicit invariant, and every vocabulary/register choice here was made independently.\n\nReview 2026-10-20 (en-prs A1 pass): 2 fixes - removed internal source-attestation wording from four vocabulary notes; added accepted variants with optional من for the membership-card sentence. NATIVE FLAGS: بفرمایین glossed as \"Hello, please\" / \"Here you go\" (service-counter usage); کورس for a gym class. Follow-up: gloss of سلام، بفرمایین changed from Hello, please/here you go to Hello, welcome (same as units 48-54)."
course:
  title: Dari A1
  description: "Beginner Kabul Dari: ask about joining a gym or buying a day pass, describe basic equipment and a class, and talk simply about a workout."
units:
  prs.a1.unit56.gym:
    title: Gym
    description: "Ask about joining a gym or buying a day pass, describe basic equipment and a class, and talk simply about a workout."
lessons:
  prs.a1.unit56.lesson01.gym_and_equipment_vocabulary:
    title: The gym and equipment
  prs.a1.unit56.lesson02.membership_card_and_day_pass_price:
    title: Membership card and day-pass price
  prs.a1.unit56.lesson03.class_and_locker_vocabulary:
    title: Class and locker
  prs.a1.unit56.lesson04.gym_reception_dialogue:
