course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: explaining the purpose or goal behind an
    action with تا (in order to/so that) + subjunctive, including
    negative purpose, across a goals-and-savings scenario.

units:
  prs.b1.unit06.purpose:
    title: Purpose
    description: Explain the purpose or goal behind an action, using a purpose-clause construction, including avoiding something.

lessons:
  prs.b1.unit06.lesson01.present_purpose_1st2nd:
    title: "In order to learn"
  prs.b1.unit06.lesson02.present_purpose_all_persons:
    title: "All the persons"
  prs.b1.unit06.lesson03.negative_purpose:
    title: "So as not to get tired"
  prs.b1.unit06.lesson04.dialogue_goals:
    title: Goals
  prs.b1.unit06.lesson05.reading_two_goals:
    title: "Two goals"
  prs.b1.unit06.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit06.lesson01.teach.ta:
    title: "In order to"
    gloss: "in order to / so that"
    note: "*تا* + subjunctive introduces a purpose clause."
    example_gloss: "I go to school in order to learn English."
  prs.b1.unit06.lesson01.teach.yad_begiram:
    title: "(That) I learn"
    gloss: "(that) I learn"
    note: "*یاد بگیرم* is the 1st person subjunctive of *یاد گرفتن* (to learn)."
    example_gloss: "I go to school in order to learn English."
  prs.b1.unit06.lesson01.teach.maktab:
    title: School
    gloss: school
    note: "*مکتب* means school."
    example_gloss: "I go to school."
  prs.b1.unit06.lesson01.teach.english:
    title: English
    gloss: English
    note: "*انگلیسی* means English."
    example_gloss: "I'm learning English."
  prs.b1.unit06.lesson01.teach.grammar_ta:
    title: "تا states purpose"
    gloss: "تا + subjunctive states the purpose or goal behind an action"
    note: "*به مکتب می‌روم تا انگلیسی یاد بگیرم* = I go to school in order to learn English. The first clause is the action, تا introduces the goal."
  prs.b1.unit06.lesson01.teach.jam_koni:
    title: "(That) you save"
    gloss: "(that) you save / collect"
    note: "*جمع کنی* is the 2nd person subjunctive of *جمع کردن* (to save/collect)."
    example_gloss: "Do you work in order to save money?"
  prs.b1.unit06.lesson01.teach.pool:
    title: Money
    gloss: money
    note: "*پول* means money."
    example_gloss: "I'm saving money."
  prs.b1.unit06.lesson01.teach.review_kar_mikoni:
    title: "You work"
    gloss: "you work"
    note: "*کار می‌کنی* is the 2nd person present of *کار کردن* (to work)."
    example_gloss: "Do you work in order to save money?"
  prs.b1.unit06.lesson01.teach.review_ba:
    title: To
    gloss: to
    note: "*به* means to/at."
    example_gloss: "I go to school."
  prs.b1.unit06.lesson01.teach.review_miravam:
    title: "I go"
    gloss: "I go"
    note: "*می‌روم* is the 1st person present of *رفتن*."
    example_gloss: "I go to school."

  prs.b1.unit06.lesson02.teach.yad_begirad:
    title: "(That) he/she learns"
    gloss: "(that) he/she learns"
    note: "*یاد بگیرد* is the 3rd person singular form."
    example_gloss: "Zarmina goes to school in order to learn English."
  prs.b1.unit06.lesson02.teach.jam_konad:
    title: "(That) he/she saves"
    gloss: "(that) he/she saves"
    note: "*جمع کند* is the 3rd person singular form."
    example_gloss: "Homayoun works in order to save money."
  prs.b1.unit06.lesson02.teach.grammar_agreement:
    title: "All six persons"
    gloss: "یاد بگیرم/بگیری/بگیرد/بگیریم/بگیرین/بگیرند and جمع کنم/کنی/کند/کنیم/کنین/کنند follow the same subjunctive endings"
    note: "The تا-clause's verb agrees with the SAME subject as the main clause (unlike اگر/وقتی که, which can have different subjects)."
  prs.b1.unit06.lesson02.teach.review_kar_mikonad:
    title: "He/she works"
    gloss: "he/she works"
    note: "*کار می‌کند* is the 3rd person present indicative of *کار کردن* -- different from the subjunctive *کند* used inside the تا-clause."
    example_gloss: "Homayoun works in order to save money."
  prs.b1.unit06.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "*همایون* -- an established recurring character in this course."
    example_gloss: "Homayoun works in order to save money."
  prs.b1.unit06.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "*زرمینه* -- an established recurring character in this course."
    example_gloss: "Zarmina goes to school in order to learn English."
  prs.b1.unit06.lesson02.teach.review_miravad:
    title: "He/she goes"
    gloss: "he/she goes"
    note: "*می‌رود* is the 3rd person present of *رفتن*."
    example_gloss: "Zarmina goes to school."

  prs.b1.unit06.lesson03.teach.nashavam:
    title: "(So that) I don't become"
    gloss: "(so that) I don't become"
    note: "*نشوم* negates *بشوم* (that I become) with the same ب-/ن- swap regular verbs use."
    example_gloss: "I rest a little so that I don't get tired."
  prs.b1.unit06.lesson03.teach.grammar_negative_purpose:
    title: "Negative purpose"
    gloss: "تا + a negative subjunctive states a purpose of avoiding something"
    note: "*تا خسته نشوم* = so that I don't get tired / in order not to get tired."
  prs.b1.unit06.lesson03.teach.review_esterahat_mikonam:
    title: "I rest"
    gloss: "I rest"
    note: "*استراحت می‌کنم* is the 1st person present of *استراحت کردن* (to rest)."
    example_gloss: "I rest a little so that I don't get tired."
  prs.b1.unit06.lesson03.teach.review_khaste:
    title: Tired
    gloss: tired
    note: "*خسته* means tired."
    example_gloss: "So that I don't get tired."
  prs.b1.unit06.lesson03.teach.review_kami:
    title: "A little"
    gloss: "a little"
    note: "*کمی* means a little/somewhat."
    example_gloss: "I rest a little."
  prs.b1.unit06.lesson03.teach.mikhabam:
    title: "I sleep"
    gloss: "I sleep"
    note: "*می‌خوابم* is the 1st person present of *خوابیدن* (to sleep)."
    example_gloss: "I sleep early so that I don't get tired."
  prs.b1.unit06.lesson03.teach.review_zud:
    title: "Early / soon"
    gloss: "early / soon"
    note: "*زود* means early/soon."
    example_gloss: "I sleep early."
  prs.b1.unit06.lesson03.teach.nashavi:
    title: "(So that) you don't become"
    gloss: "(so that) you don't become"
    note: "*نشوی* is the 2nd person singular form."
    example_gloss: "Do you sleep early so that you don't get tired?"
  prs.b1.unit06.lesson03.teach.mikhabi:
    title: "You sleep"
    gloss: "you sleep"
    note: "*می‌خوابی* is the 2nd person singular form."
    example_gloss: "Do you sleep early so that you don't get tired?"

  prs.b1.unit06.lesson04.teach.chera:
