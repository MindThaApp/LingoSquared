course:
  title: Dari B2
  description: Speculate about causes and consequences with graded certainty.
units:
  prs.b2.unit02.speculation:
    title: Speculation
    description: Speculate about causes and consequences with graded certainty.
lessons:
  prs.b2.unit02.speculation.lesson01.certainty:
    title: Degrees of likelihood
  prs.b2.unit02.speculation.lesson02.deduction:
    title: Deducing from signs
  prs.b2.unit02.speculation.lesson03.consequence:
    title: Possible consequence
teaching:
  prs.b2.unit02.speculation.lesson01.certainty.teach.card01:
    title: perhaps
    gloss: perhaps
    note: '*شاید* keeps the cause uncertain; it should not be translated with the confidence of "surely."'
    example_gloss: Perhaps the road will open by evening.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card02:
    title: it is possible / may
    gloss: it is possible / may
    note: '*احتمال دارد* is the main "may" frame here; the speculative verb phrase still comes at the end.'
    example_gloss: The driver may arrive late.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card03:
    title: I suppose
    gloss: I suppose
    note: "*به گمانم* foregrounds the speaker's judgement, useful when the evidence is incomplete."
    example_gloss: I suppose new information will arrive by midday.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card04:
    title: surely / definitely
    gloss: surely / definitely
    note: '*حتما* raises certainty, so it needs stronger signs than *شاید* or *احتمال دارد*.'
    example_gloss: Surely a problem has come up on the route.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card05:
    title: bus
    gloss: bus
    note: '*بس* is the Afghan Dari word for bus; do not replace it with Iranian-style transport vocabulary here.'
    example_gloss: The bus left Bamiyan for Kabul.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card06:
    title: snow
    gloss: snow
    note: '*برف* gives the visible cause behind the guess, turning speculation into evidence-based deduction.'
    example_gloss: Snow closed the mountain road.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card07:
    title: may have been stuck on the road
    gloss: may have been stuck on the road
    note: '*در راه بند مانده باشد* combines location with a perfect subjunctive, matching "may have been stuck."'
    example_gloss: If the car has got stuck on the road, it is not surprising.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card08:
    title: reason
    gloss: reason
    note: '*دلیل* points to the cause or reason; use it to explain why a guess is plausible.'
    example_gloss: The reason for the delay is still unclear.
  prs.b2.unit02.speculation.lesson01.certainty.teach.card09:
    title: road
    gloss: road
    note: '*راه* is the general word for road or way; the later *سرک* is more concrete for a road surface.'
    example_gloss: The district road is narrow.
  prs.b2.unit02.speculation.lesson01.certainty.teach.grammar:
    title: Speculation grammar
    gloss: Speculation grammar
    note: '*شاید*, *احتمال دارد*, and *به گمانم* mark uncertainty. *حتما* is stronger and should be supported by evidence.'
  prs.b2.unit02.speculation.lesson02.deduction.teach.card01:
    title: must have taken
    gloss: must have taken
    note: '*باید گرفته باشد* expresses deduction from evidence here, not an obligation to take something.'
    example_gloss: He must have taken the key from the office.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card02:
    title: driver
    gloss: driver
    note: '*راننده* is the person whose likely action is inferred; the deduction verb agrees with this singular noun.'
    example_gloss: The driver took the safer route.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card03:
    title: route
    gloss: route
    note: '*مسیر* is the chosen route, useful when comparing alternatives after the main road closes.'
    example_gloss: The other route is longer.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card04:
    title: road
    gloss: road
    note: '*سرک* is natural Afghan Dari for road; it keeps the Bamiyan road-office setting local.'
    example_gloss: The main road is closed today.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card05:
    title: main
    gloss: main
    note: '*اصلی* follows the noun it modifies, so *سرک اصلی* is "the main road."'
    example_gloss: The main door was locked.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card06:
    title: closed
    gloss: closed
    note: "*بسته* describes the road's state; do not add a separate English-style \"is being\" helper."
    example_gloss: The shop closed after prayer.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card07:
    title: it is clear from the signs
    gloss: it is clear from the signs
    note: '*از نشانه‌ها معلوم است* makes the evidence explicit before the deduction, which is central to this lesson.'
    example_gloss: It is clear from the signs that the snow was heavy.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card08:
    title: mountain area
    gloss: mountain area
    note: '*کوهستان* sets the mountain context where snow makes the road delay credible.'
    example_gloss: The mountain area becomes dangerous in winter.
  prs.b2.unit02.speculation.lesson02.deduction.teach.card09:
    title: cannot be accidental
    gloss: cannot be accidental
    note: '*نمی‌تواند تصادفی باشد* rules out chance; use it only when the signs justify that confidence.'
    example_gloss: This delay cannot be accidental.
  prs.b2.unit02.speculation.lesson02.deduction.teach.grammar:
    title: Speculation grammar
    gloss: Speculation grammar
    note: '*باید ... باشد* can express deduction, not obligation. Pair it with a visible sign or reason.'
  prs.b2.unit02.speculation.lesson03.consequence.teach.card01:
    title: may / might
    gloss: may / might
    note: '*ممکن است* marks a possible consequence; it belongs before the outcome that may happen.'
    example_gloss: The news may arrive later.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card02:
    title: consequence
    gloss: consequence
    note: '*پیامد* is the consequence, not the cause; keep it separate from *دلیل*.'
    example_gloss: The consequence of the road closure is serious.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card03:
    title: passengers
    gloss: passengers
    note: '*مسافران* names the affected group; the sentence predicts what may happen to them.'
    example_gloss: The passengers are waiting in the teahouse.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card04:
    title: bazaar
    gloss: bazaar
    note: '*بازار* is the likely waiting place if travel stalls, not simply "market" as a shopping action.'
    example_gloss: Bamiyan bazaar is near the station.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card05:
    title: by evening
    gloss: by evening
    note: '*تا شام* sets a deadline meaning "by evening"; it does not mean the action lasts all evening.'
    example_gloss: We must decide by evening.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card06:
    title: does not open
    gloss: does not open
    note: '*باز نشود* is subjunctive after *اگر*; avoid the indicative *نمی‌شود* in this conditional.'
    example_gloss: If the door does not open, call.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card07:
    title: teahouse
    gloss: teahouse
    note: '*چایخانه* is a plausible waiting place in the travel scenario, giving the consequence a concrete setting.'
    example_gloss: The teahouse is a warm and calm place.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card08:
    title: we should be prepared
    gloss: we should be prepared
    note: '*آماده باشیم* uses first-person plural subjunctive, a natural way to advise preparation.'
    example_gloss: It is better to be prepared for delay.
  prs.b2.unit02.speculation.lesson03.consequence.teach.card09:
    title: delay
    gloss: delay
    note: '*تاخیر* names the delay itself; use it when summarizing the situation rather than speculating about a cause.'
    example_gloss: The long delay tired everyone.
  prs.b2.unit02.speculation.lesson03.consequence.teach.grammar:
    title: Speculation grammar
    gloss: Speculation grammar
    note: '*اگر* marks the condition; *ممکن است* marks the possible consequence. Do not add an English-style future helper unless Dari needs it.'
