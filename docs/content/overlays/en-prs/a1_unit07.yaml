course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari: answering the phone, identifying yourself on a
    call, asking to repeat or speak slowly, leaving a message, and basic
    text messaging.

units:
  prs.a1.unit07.communication:
    title: Talking on the phone

lessons:
  prs.a1.unit07.lesson01.answering_the_phone: {title: "Answer the phone"}
  prs.a1.unit07.lesson02.identifying_yourself: {title: "Identify yourself on a call"}
  prs.a1.unit07.lesson03.asking_to_repeat_or_slow_down: {title: "Ask someone to repeat or slow down"}
  prs.a1.unit07.lesson04.leaving_a_message: {title: "Leave a message"}
  prs.a1.unit07.lesson05.text_messages: {title: "Read and write a short text message"}
  prs.a1.unit07.lesson06.phone_call_dialogue: {title: "A full phone call"}

teaching:
  prs.a1.unit07.lesson01.teach.alo:
    title: "Hello (on the phone)"
    gloss: "hello (on the phone)"
    note: "الو is used specifically to answer or open a phone call, distinct from سلام used in person."
  prs.a1.unit07.lesson01.teach.goosh_astam:
    title: "Invite the caller to continue"
    gloss: "Yes, go ahead."
    note: "بلی، بفرمایید is the natural way to respond after picking up, using the same polite بفرمایید ('please'/'go ahead') already used elsewhere in this course -- not a literal translation of 'I'm listening.'"
  prs.a1.unit07.lesson01.teach.telephone_review:
    title: "Telephone (review)"
    gloss: "telephone"
    note: "تلفن was introduced in the numbers unit; it's used here as the setting for this whole unit."

  prs.a1.unit07.lesson02.teach.who_speaking:
    title: "Ask who's calling"
    gloss: "Excuse me, who's speaking?"
    note: "ببخشید، کی صحبت می‌کند؟ politely asks the caller's identity."
  prs.a1.unit07.lesson02.teach.this_is_speaking:
    title: "Identify yourself"
    gloss: "This is Farid."
    note: "من فرید استم directly states who's calling, using the same استم pattern from earlier units."
  prs.a1.unit07.lesson02.teach.colleague_context:
    title: "Explain your connection to the person called"
    gloss: "I'm Homayoun's colleague."
    note: "همکار همایون استم gives context for why you're calling, useful when the person answering doesn't know you."

  prs.a1.unit07.lesson03.teach.speak_slowly:
    title: "Ask someone to speak slowly"
    gloss: "Please speak slowly."
    note: "لطفاً آهسته صحبت کنید is a natural, polite request on a phone call with a poor connection or a new language learner."
  prs.a1.unit07.lesson03.teach.repeat_review:
    title: "Ask someone to repeat (review)"
    gloss: "Could you say it again?"
    note: "می‌توانید دوباره بگویید؟ was introduced in the introductions unit; it applies just as naturally to a phone call."
  prs.a1.unit07.lesson03.teach.combined_request:
    title: "Combine both requests"
    gloss: "Please speak slowly and say it again."
    note: "و joins the two requests into one natural combined phrase."

  prs.a1.unit07.lesson04.teach.payam_word:
    title: "Message"
    gloss: "message"
    note: "پیام is the general word for a message, spoken or written."
  prs.a1.unit07.lesson04.teach.want_to_leave_message:
    title: "Say you want to leave a message"
    gloss: "I want to leave a message."
    note: "می‌خواهم یک پیام بگذارم is what you say when the person you're calling isn't available."
  prs.a1.unit07.lesson04.teach.will_call_later:
    title: "Say you'll call back later"
    gloss: "I'll call later."
    note: "بعد زنگ می‌زنم is a simple alternative to leaving a message."

  prs.a1.unit07.lesson05.teach.short_message:
    title: "Text message"
    gloss: "text message (short message)"
    note: "پیام کوتاه literally means 'short message,' the everyday way to refer to a text message."
  prs.a1.unit07.lesson05.teach.meeting_tomorrow:
    title: "A sample message"
    gloss: "Tomorrow the meeting is at nine o'clock."
    note: "فردا جلسه ساعت نه است is a natural, complete piece of information to relay in a message."
  prs.a1.unit07.lesson05.teach.will_deliver:
    title: "Confirm you'll pass along the message"
    gloss: "I'll deliver it / pass it along."
    note: "می‌رسانم confirms the message will reach its intended recipient."

  prs.a1.unit07.lesson06.teach.turn01:
    title: "Lima answers the phone"
    gloss: "Lima answers with the phone greeting."
    note: "الو؟ is the standard way to answer an incoming call."
  prs.a1.unit07.lesson06.teach.turn02:
    title: "Farid greets her and confirms who she is"
    gloss: "Farid greets her and asks if she's Lima."
    note: "الو، سلام combines the phone greeting with the everyday greeting."
  prs.a1.unit07.lesson06.teach.turn03:
    title: "Lima invites him to continue and asks who's calling"
    gloss: "Lima invites him to continue and asks who's calling."
    note: "بلی، بفرمایید and کی صحبت می‌کند؟ both come from lesson01/lesson02."
  prs.a1.unit07.lesson06.teach.turn04:
    title: "Farid identifies himself"
    gloss: "Farid says he's Homayoun's colleague."
    note: "This reuses the colleague-context pattern from lesson02, giving Lima a reason to trust the call."
  prs.a1.unit07.lesson06.teach.turn05:
    title: "Lima asks him to speak slowly"
    gloss: "Lima greets him and asks him to speak slowly."
    note: "آهسته صحبت کنید، لطفاً reuses lesson03's request."
  prs.a1.unit07.lesson06.teach.turn06:
    title: "Farid agrees and asks to leave a message"
    gloss: "Farid agrees and says he wants to leave a message for Homayoun."
    note: "This extends lesson04's پیام pattern to name a specific recipient (برای همایون, 'for Homayoun')."
  prs.a1.unit07.lesson06.teach.turn07:
    title: "Lima agrees to write it down"
    gloss: "Lima invites him to go ahead and says she's writing it down."
    note: "بفرمایید here invites Farid to continue speaking."
  prs.a1.unit07.lesson06.teach.turn08:
    title: "Farid gives the message content"
    gloss: "Farid asks her to say the meeting is tomorrow at nine."
    note: "This reuses lesson05's sample message content directly."
  prs.a1.unit07.lesson06.teach.turn09:
    title: "Lima confirms and promises to deliver it"
    gloss: "Lima confirms the details and says she'll pass it along."
    note: "می‌رسانم closes the message-taking part of the call, as taught in lesson05."
  prs.a1.unit07.lesson06.teach.turn10:
    title: "Farid thanks her and says goodbye"
    gloss: "Farid thanks her very much and says goodbye."
    note: "تشکر زیاد and خدا حافظ both reuse vocabulary from earlier units."
  prs.a1.unit07.lesson06.teach.turn11:
    title: "Lima says goodbye"
    gloss: "Lima says goodbye."
    note: "خدا حافظ closes the call."
  prs.a1.unit07.lesson06.teach.past_tense_left:
    title: "Say someone left a message (past tense)"
    gloss: "Farid left a message."
    note: "گذاشت is the simple past tense of the same verb whose imperative form (بگذارم, I'll leave/put) was taught in lesson04 -- useful for summarizing what happened after a call."

exercises:
  prs.a1.unit07.lesson01.exercise01.recognize_alo:
    instruction: "Which word is used to answer the phone?"
    correct_option: الو
    distractors: [سلام, تشکر, "خدا حافظ"]
    accepted_answers: [{value: الو, status: correct}]
    feedback: "الو is used specifically on the phone, unlike سلام."
  prs.a1.unit07.lesson01.exercise02.recognize_goosh_astam:
    instruction: "Which phrase politely invites the caller to continue?"
    correct_option: "بلی، بفرمایید"
    distractors: ["الو؟", "کی صحبت می‌کند؟", "خدا حافظ"]
    accepted_answers: [{value: "بلی، بفرمایید", status: correct}]
    feedback: "بلی، بفرمایید politely invites the caller to go ahead and speak."
  prs.a1.unit07.lesson01.exercise03.listen_alo:
    instruction: "Listen and select the word you hear."
    correct_option: الو
    distractors: [سلام, تشکر, "خدا حافظ"]
    accepted_answers: [{value: الو, status: correct}]
    feedback: "The speaker says الو؟"
  prs.a1.unit07.lesson01.exercise04.match_phone_opening:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - {value: {الو: "hello (on the phone)", "بلی، بفرمایید": "Yes, go ahead.", تلفن: telephone}, status: correct}
    feedback: "These phrases open a typical phone call."
  prs.a1.unit07.lesson01.exercise05.order_goosh_astam:
    instruction: "Arrange the words to say Yes, go ahead."
    accepted_answers: [{value: [بلی, بفرمایید], status: correct}]
    feedback: "بلی، بفرمایید invites the caller to go ahead."
  prs.a1.unit07.lesson01.exercise06.listen_type_goosh_astam:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "بلی، بفرمایید", status: correct}
      - {value: "بلی بفرمایید", status: correct}
    feedback: "The recording says بلی، بفرمایید."
  prs.a1.unit07.lesson01.exercise07.speak_answer_phone:
    instruction: "Your phone rings. Answer it and invite the caller to continue."
    accepted_answers:
      - {value: "الو؟ بلی، بفرمایید.", status: correct}
      - {value: "الو، بلی بفرمایید", status: correct}
    feedback: "الو answers the call, and بلی، بفرمایید invites the caller to go ahead."

  prs.a1.unit07.lesson02.exercise01.recognize_who_speaking:
    instruction: "Which phrase asks who is calling?"
    correct_option: "ببخشید، کی صحبت می‌کند؟"
    distractors: ["من فرید استم", "همکار همایون استم", "الو؟"]
    accepted_answers: [{value: "ببخشید، کی صحبت می‌کند؟", status: correct}]
    feedback: "کی صحبت می‌کند؟ literally asks 'who is speaking.'"
  prs.a1.unit07.lesson02.exercise02.recognize_this_is:
    instruction: "Which phrase identifies the speaker as Farid?"
    correct_option: "من فرید استم"
    distractors: ["ببخشید، کی صحبت می‌کند؟", "همکار همایون استم", "بلی، بفرمایید"]
    accepted_answers: [{value: "من فرید استم", status: correct}]
    feedback: "من فرید استم directly states the speaker's name."
  prs.a1.unit07.lesson02.exercise03.listen_who_speaking:
    instruction: "Listen and select the question you hear."
    correct_option: "ببخشید، کی صحبت می‌کند؟"
    distractors: ["من فرید استم", "بلی، بفرمایید", "الو؟"]
    accepted_answers: [{value: "ببخشید، کی صحبت می‌کند؟", status: correct}]
    feedback: "The speaker asks ببخشید، کی صحبت می‌کند؟"
  prs.a1.unit07.lesson02.exercise04.match_identity_phrases:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - {value: {"ببخشید، کی صحبت می‌کند؟": "Excuse me, who's speaking?", "من فرید استم": "This is Farid.", "همکار همایون استم": "I'm Homayoun's colleague."}, status: correct}
    feedback: "These phrases cover asking and stating identity on a call."
  prs.a1.unit07.lesson02.exercise05.order_who_speaking:
    instruction: "Arrange the words to politely ask who's calling."
    accepted_answers: [{value: [ببخشید, کی, صحبت, می‌کند], status: correct}]
    feedback: "ببخشید، کی صحبت می‌کند؟ politely asks the caller's identity."
  prs.a1.unit07.lesson02.exercise06.translate_this_is:
    instruction: "Translate into Dari: This is Farid."
    accepted_answers:
      - {value: "من فرید استم", status: correct}
    feedback: "من فرید استم states the speaker's identity."
  prs.a1.unit07.lesson02.exercise07.speak_identify_self:
    instruction: "ببخشید، کی صحبت می‌کند؟ Answer as if your name is Farid."
    accepted_answers:
      - {value: "من فرید استم", status: correct}
    feedback: "من [name] استم correctly identifies the speaker."

  prs.a1.unit07.lesson03.exercise01.recognize_speak_slowly:
    instruction: "Which phrase asks someone to speak slowly?"
    correct_option: "لطفاً آهسته صحبت کنید"
    distractors: ["می‌توانید دوباره بگویید؟", "بلی، بفرمایید", "الو؟"]
    accepted_answers: [{value: "لطفاً آهسته صحبت کنید", status: correct}]
    feedback: "آهسته صحبت کنید means speak slowly."
  prs.a1.unit07.lesson03.exercise02.recognize_repeat:
    instruction: "Which phrase asks someone to repeat what they said?"
    correct_option: "می‌توانید دوباره بگویید؟"
    distractors: ["لطفاً آهسته صحبت کنید", "کی صحبت می‌کند؟", "می‌خواهم یک پیام بگذارم"]
    accepted_answers: [{value: "می‌توانید دوباره بگویید؟", status: correct}]
    feedback: "دوباره بگویید؟ asks someone to say it again."
  prs.a1.unit07.lesson03.exercise03.listen_speak_slowly:
    instruction: "Listen and select the phrase you hear."
    correct_option: "لطفاً آهسته صحبت کنید و دوباره بگویید"
    distractors: ["بلی، بفرمایید", "می‌خواهم یک پیام بگذارم", "بعد زنگ می‌زنم"]
    accepted_answers: [{value: "لطفاً آهسته صحبت کنید و دوباره بگویید", status: correct}]
    feedback: "The speaker combines both requests: لطفاً آهسته صحبت کنید و دوباره بگویید."
  prs.a1.unit07.lesson03.exercise04.match_clarification_phrases:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - {value: {"لطفاً آهسته صحبت کنید": "Please speak slowly.", "می‌توانید دوباره بگویید؟": "Could you say it again?"}, status: correct}
    feedback: "Both phrases help you understand a caller better."
  prs.a1.unit07.lesson03.exercise05.order_speak_slowly:
    instruction: "Arrange the words to ask someone to please speak slowly."
    accepted_answers: [{value: [لطفاً, آهسته, صحبت, کنید], status: correct}]
    feedback: "لطفاً آهسته صحبت کنید asks for slower speech."
  prs.a1.unit07.lesson03.exercise06.listen_type_combined_request:
    instruction: "Listen and type what you hear."
    accepted_answers:
      - {value: "لطفاً آهسته صحبت کنید و دوباره بگویید", status: correct}
    feedback: "The recording combines both requests."
  prs.a1.unit07.lesson03.exercise07.speak_clarification_request:
    instruction: "You can't understand the caller well. Ask them to speak slowly and repeat."
    accepted_answers:
      - {value: "لطفاً آهسته صحبت کنید و دوباره بگویید", status: correct}
      - {value: "لطفاً آهسته صحبت کنید، دوباره بگویید", status: correct}
      - {value: "لطفاً آهسته صحبت کنید. می‌توانید دوباره بگویید؟", status: correct}
    feedback: "Joining the two requests with و, with a comma, or as two separate sentences, are equally natural."

  prs.a1.unit07.lesson04.exercise01.recognize_leave_message:
    instruction: "Which phrase says you want to leave a message?"
    correct_option: "می‌خواهم یک پیام بگذارم"
    distractors: ["بعد زنگ می‌زنم", "بلی، بفرمایید", "کی صحبت می‌کند؟"]
    accepted_answers: [{value: "می‌خواهم یک پیام بگذارم", status: correct}]
    feedback: "می‌خواهم یک پیام بگذارم says you want to leave a message."
  prs.a1.unit07.lesson04.exercise02.recognize_call_later:
    instruction: "Which phrase says you'll call back later?"
    correct_option: "بعد زنگ می‌زنم"
    distractors: ["می‌خواهم یک پیام بگذارم", "الو؟", "لطفاً آهسته صحبت کنید"]
    accepted_answers: [{value: "بعد زنگ می‌زنم", status: correct}]
    feedback: "بعد زنگ می‌زنم says you'll call later instead of leaving a message."
  prs.a1.unit07.lesson04.exercise03.listen_leave_message:
    instruction: "Listen and select the phrase you hear."
    correct_option: "می‌خواهم یک پیام بگذارم"
    distractors: ["بعد زنگ می‌زنم", "بلی، بفرمایید", "می‌توانید دوباره بگویید؟"]
    accepted_answers: [{value: "می‌خواهم یک پیام بگذارم", status: correct}]
    feedback: "The speaker says می‌خواهم یک پیام بگذارم."
  prs.a1.unit07.lesson04.exercise04.match_message_phrases:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - {value: {پیام: message, "می‌خواهم یک پیام بگذارم": "I want to leave a message.", "بعد زنگ می‌زنم": "I'll call later."}, status: correct}
    feedback: "These phrases cover the two basic options when someone isn't available."
  prs.a1.unit07.lesson04.exercise05.order_leave_message:
    instruction: "Arrange the words to say you want to leave a message."
    accepted_answers: [{value: [می‌خواهم, یک, پیام, بگذارم], status: correct}]
    feedback: "می‌خواهم یک پیام بگذارم says you want to leave a message."
  prs.a1.unit07.lesson04.exercise06.translate_call_later:
    instruction: "Translate into Dari: I'll call later."
    accepted_answers:
      - {value: "بعد زنگ می‌زنم", status: correct}
    feedback: "بعد زنگ می‌زنم says you'll call later."
  prs.a1.unit07.lesson04.exercise07.speak_leave_message:
    instruction: "The person you're calling isn't available. Say you want to leave a message."
    accepted_answers:
      - {value: "می‌خواهم یک پیام بگذارم", status: correct}
    feedback: "می‌خواهم یک پیام بگذارم correctly says you want to leave a message."

  prs.a1.unit07.lesson05.exercise01.recognize_short_message:
    instruction: "Which phrase means text message?"
    correct_option: "پیام کوتاه"
    distractors: ["فردا جلسه ساعت نه است", می‌رسانم, "بعد زنگ می‌زنم"]
    accepted_answers: [{value: "پیام کوتاه", status: correct}]
    feedback: "پیام کوتاه literally means 'short message.'"
  prs.a1.unit07.lesson05.exercise02.recognize_meeting_time:
    instruction: "Which sentence tells you when the meeting is?"
    correct_option: "فردا جلسه ساعت نه است"
    distractors: ["پیام کوتاه", می‌رسانم, "می‌خواهم یک پیام بگذارم"]
    accepted_answers: [{value: "فردا جلسه ساعت نه است", status: correct}]
    feedback: "فردا جلسه ساعت نه است states the meeting is tomorrow at nine."
  prs.a1.unit07.lesson05.exercise03.read_text_message:
    instruction: "Read the message. What time is the meeting?"
    correct_option: "nine o'clock"
    distractors: ["seven o'clock", "noon", "It doesn't say."]
    accepted_answers: [{value: "nine o'clock", status: correct}]
    feedback: "فردا جلسه ساعت نه است states the meeting is at nine o'clock."
  prs.a1.unit07.lesson05.exercise04.match_message_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - {value: {"پیام کوتاه": "text message (short message)", "فردا جلسه ساعت نه است": "Tomorrow the meeting is at nine o'clock.", می‌رسانم: "I'll deliver / pass it along"}, status: correct}
    feedback: "These cover naming a text message, a sample message, and confirming delivery."
  prs.a1.unit07.lesson05.exercise05.order_meeting_time:
    instruction: "Arrange the words to say tomorrow the meeting is at nine o'clock."
    accepted_answers: [{value: [فردا, جلسه, ساعت, نه, است], status: correct}]
    feedback: "فردا جلسه ساعت نه است states the meeting time."
  prs.a1.unit07.lesson05.exercise06.translate_will_deliver:
    instruction: "Translate into Dari: I'll deliver it / pass it along."
    accepted_answers:
      - {value: می‌رسانم, status: correct}
    feedback: "می‌رسانم confirms you'll pass the message along."
  prs.a1.unit07.lesson05.exercise07.write_text_message:
    instruction: "Write a short text message telling someone the meeting is tomorrow at nine o'clock."
    accepted_answers:
      - {value: "فردا جلسه ساعت نه است", status: correct}
    feedback: "فردا جلسه ساعت نه است is a complete, natural text message."

  prs.a1.unit07.lesson06.exercise01.listen_context:
    instruction: "Listen to the full dialogue. What is this phone call about?"
    correct_option: "leaving a message about a meeting time"
    distractors: ["ordering food for delivery", "asking for directions", "discussing family members"]
    accepted_answers: [{value: "leaving a message about a meeting time", status: correct}]
    feedback: "Farid calls to leave Homayoun a message about tomorrow's meeting."
  prs.a1.unit07.lesson06.exercise02.recognize_who_calls:
    instruction: "Who is calling, and how are they connected to Homayoun?"
    correct_option: "Farid, Homayoun's colleague"
    distractors: ["Lima, Homayoun's sister", "an unknown caller", "Homayoun himself"]
    accepted_answers: [{value: "Farid, Homayoun's colleague", status: correct}]
    feedback: "Farid identifies himself as همکار همایون (Homayoun's colleague)."
  prs.a1.unit07.lesson06.exercise03.listen_message_content:
    instruction: "Listen and type the message Farid wants to leave."
    accepted_answers:
