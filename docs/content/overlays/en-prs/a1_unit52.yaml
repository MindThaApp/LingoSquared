course:
  title: Dari A1
  description: "Beginner Kabul Dari: go to the cinema, read a cinema schedule, buy a ticket, ask about a showtime, and talk simply about a film."
units:
  prs.a1.unit52.cinema:
    title: Cinema
    description: "Go to the cinema, read a cinema schedule, buy a ticket for a specific showtime, and say which film you want."
lessons:
  prs.a1.unit52.lesson01.cinema_and_staff_vocabulary:
    title: The cinema and the staff member
  prs.a1.unit52.lesson02.reading_the_schedule:
    title: Reading the cinema schedule
  prs.a1.unit52.lesson03.choosing_a_film_and_asking_for_a_ticket:
    title: Choosing a film and asking for a ticket
  prs.a1.unit52.lesson04.cinema_dialogue:
    title: Cinema dialogue
  prs.a1.unit52.lesson05.reading:
    title: Reading about the cinema
  prs.a1.unit52.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit52.lesson01.teach.review_this_is_in_good:
    title: "Review: this, is, in, good"
    gloss: "this / is / in / good"
    note: "These are review words (used throughout this course) for talking about the cinema."
  prs.a1.unit52.lesson01.teach.cinema_word:
    title: "Cinema"
    gloss: "cinema"
    note: "This is the Dari word for a cinema or movie theater."
    example_gloss: "The cinema is good."
  prs.a1.unit52.lesson01.teach.review_staff_word:
    title: "Review: staff member"
    gloss: "staff member"
    note: "This is the same general staff/employee word already taught at the swimming pool, reused here for the cinema ticket counter."
  prs.a1.unit52.lesson01.teach.this_is_cinema_phrase:
    title: "This is a cinema"
    gloss: "This is a cinema."
    note: "This combines this, is, and cinema the same way this course already joins these words elsewhere."
  prs.a1.unit52.lesson01.teach.staff_at_cinema_phrase:
    title: "The staff member is at the cinema"
    gloss: "The staff member is at the cinema."
    note: "This combines staff member, in, and cinema."
  prs.a1.unit52.lesson02.teach.review_price_and_schedule_words:
    title: "Review: how much, afghani, is, thirty, five, o'clock, and, in, movie, schedule, interesting"
    gloss: "how much / afghani / is / thirty / five / o'clock / and / in / movie / schedule / interesting"
    note: "These are review words (from earlier units) used to read the cinema schedule and ask a price."
  prs.a1.unit52.lesson02.teach.sky_word:
    title: "Sky"
    gloss: "sky"
    note: "The film in this unit is called Sky, which is the everyday Dari word for sky."
    example_gloss: "The movie Sky is interesting."
  prs.a1.unit52.lesson02.teach.its_ticket_word:
    title: "Its ticket"
    gloss: "its ticket"
    note: "This reuses the same possessive suffix already established earlier in this course, applied to ticket."
    example_gloss: "Its ticket is good."
  prs.a1.unit52.lesson02.teach.schedule_reading:
    title: "Reading the cinema schedule"
    gloss: "On the cinema schedule, the movie Sky is at five and its ticket is 30 afghanis."
  prs.a1.unit52.lesson02.teach.ask_sky_ticket_price_phrase:
    title: "How much is the movie Sky?"
    gloss: "How much is the movie Sky?"
    note: "This combines the words taught earlier in this lesson."
  prs.a1.unit52.lesson02.teach.sky_ticket_price_answer_phrase:
    title: "Its ticket is 30 afghanis"
    gloss: "Its ticket is 30 afghanis."
    note: "This states the movie's ticket price from the schedule."
  prs.a1.unit52.lesson03.teach.review_ask_want_setup:
    title: "Review: you (formal), what is, I, I want, one/a"
    gloss: "you (formal) / what is / I / I want / one/a"
    note: "These are review words used to ask about and state what film or ticket you want."
  prs.a1.unit52.lesson03.teach.review_which_and_you_want:
    title: "Review: which, movie, you want (formal)"
    gloss: "which / movie / you want (formal)"
    note: "These are review words used to ask which film someone wants."
  prs.a1.unit52.lesson03.teach.which_film_phrase:
    title: "Which film do you want?"
    gloss: "Which film do you want?"
    note: "This reuses this course's own already-established which-question pattern, applied to film."
  prs.a1.unit52.lesson03.teach.want_sky_phrase:
    title: "I want the movie Sky"
    gloss: "I want the movie Sky."
    note: "This extends the same want pattern already used throughout this course, with a new object, the movie Sky."
  prs.a1.unit52.lesson03.teach.review_ticket_please:
    title: "Review: ticket, please"
    gloss: "ticket / please"
    note: "These are review words used to ask for a ticket."
  prs.a1.unit52.lesson03.teach.want_ticket_please_phrase:
    title: "I want a ticket, please"
    gloss: "I want a ticket, please."
    note: "This combines ticket, want, and please."
  prs.a1.unit52.lesson04.teach.review_hello_want_ticket:
    title: "Review: hello, one/a, ticket, I want"
    gloss: "hello / one/a / ticket / I want"
    note: "These are review words used to open the dialogue."
  prs.a1.unit52.lesson04.teach.review_welcome_which_film:
    title: "Review: here you go, which, movie, you want (formal)"
    gloss: "here you go / which / movie / you want (formal)"
    note: "These are review words used to ask which film the customer wants."
  prs.a1.unit52.lesson04.teach.review_good_showtime_price:
    title: "Review: very good, Sky, o'clock, five, thirty, afghani, is"
    gloss: "very good / Sky / o'clock / five / thirty / afghani / is"
    note: "These are review words used to state the movie's showtime and price."
  prs.a1.unit52.lesson04.teach.review_thanks_welcome:
    title: "Review: thanks a lot, you're welcome"
    gloss: "thanks a lot / you're welcome"
    note: "These are review words used to close the dialogue."
  prs.a1.unit52.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want a ticket."
    gloss: "Hello. I want a ticket."
  prs.a1.unit52.lesson04.teach.dialogue_line2:
    title: "Staff member: Hello, welcome. Which film do you want?"
    gloss: "Hello, welcome. Which film do you want?"
  prs.a1.unit52.lesson04.teach.dialogue_line3:
    title: "Homayoun: I want the movie Sky."
    gloss: "I want the movie Sky."
  prs.a1.unit52.lesson04.teach.dialogue_line4:
    title: "Staff member: Very good. The movie Sky is at five. The ticket is 30 afghanis."
    gloss: "Very good. The movie Sky is at five. The ticket is 30 afghanis."
  prs.a1.unit52.lesson04.teach.dialogue_line5:
    title: "Homayoun: Thanks a lot."
    gloss: "Thanks a lot."
  prs.a1.unit52.lesson04.teach.dialogue_line6:
    title: "Staff member: You're welcome."
    gloss: "You're welcome."
  prs.a1.unit52.lesson05.teach.review_this_is_in_cinema:
    title: "Review: this, is, in, cinema"
    gloss: "this / is / in / cinema"
    note: "These are review words used in the reading passage."
  prs.a1.unit52.lesson05.teach.review_he_sky_showtime_ticket:
    title: "Review: he/she, movie, Sky, five o'clock, its ticket, 30 afghanis"
    gloss: "he/she / movie / Sky / five o'clock / its ticket / 30 afghanis"
    note: "These are review words (from this unit) used in the reading passage."
  prs.a1.unit52.lesson05.teach.wants_3rd_person_word:
    title: "Wants"
    gloss: "wants"
    note: "This is the third-person present form of the same verb already taught as I want."
    example_gloss: "He/she wants a ticket."
  prs.a1.unit52.lesson05.teach.reading_passage:
    title: "Reading about the cinema"
    gloss: "Homayoun is at the cinema. He wants the movie Sky. The movie is at five. Its ticket is 30 afghanis."
  prs.a1.unit52.lesson06.teach.review_but_second_showtime:
    title: "Review: but, o'clock, eight, forty, afghani, is"
    gloss: "but / o'clock / eight / forty / afghani / is"
    note: "But is a review word from earlier units."
  prs.a1.unit52.lesson06.teach.showtime_price_contrast_phrase:
    title: "The 5 o'clock ticket is 30, but the 8 o'clock ticket is 40"
    gloss: "The 5 o'clock ticket is 30 afghanis, but the 8 o'clock ticket is 40 afghanis."
    note: "But contrasts the price of the two showtimes."
  prs.a1.unit52.lesson06.teach.review_your_ticket_how_much:
    title: "Review: your ticket, how much"
    gloss: "your ticket / how much"
    note: "Your ticket uses the same formal suffix as unit50's your pool ticket, unit49's your laundry, and unit51's your order."
  prs.a1.unit52.lesson06.teach.your_ticket_question_phrase:
    title: "How much is your ticket?"
    gloss: "How much is your ticket?"
    note: "This is the formal suffixed version of asking about a cinema ticket's price."
