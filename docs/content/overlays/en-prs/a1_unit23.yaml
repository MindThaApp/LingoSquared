  notes: '2026-07-10 fresh-context review (Claude), paired with the realization file review. Corrected one inaccuracy carried over from the original authoring notes: this file previously described lesson04''s dialogue as "Homayoun voices the صرافی role," but the realization''s dialogue turns label the money exchanger with the generic speaker صرافی, never the personal name همایون -- unit23 does not actually establish Homayoun as the money exchanger or give him any line in this unit at all. Found and fixed the same two bugs documented in the realization file''s review notes: 3 matching_pairs exercises bumped from 5 to 6 pairs (lesson02/03/04), and all 6 translation exercises'' instructions rewritten to name the specific English sentence (previously bare "Translate into Dari." with an empty prompt, i.e. unanswerable without already knowing the answer). Multi-clause production exercises'' period/comma/و-joined accepted_answers variants were checked and are correctly authored per §12. Re-validated clean (0 errors/0 warnings) after fixes.'
course:
  title: Dari A1
  description: 'Beginner Kabul Dari: money and payment vocabulary, asking about payment method, currency exchange at a صرافی (money exchanger), and a Zarmina/Homayoun dialogue exchanging dollars for afghanis.'
units:
  prs.a1.unit23.money:
    title: Money
    description: Handle basic money matters such as exchanging currency, paying, and asking about payment methods.
lessons:
  prs.a1.unit23.lesson01.money_vocabulary:
    title: Money words
  prs.a1.unit23.lesson02.payment_method:
    title: Payment method
  prs.a1.unit23.lesson03.currency_exchange:
    title: Currency exchange
  prs.a1.unit23.lesson04.exchange_dialogue:
    title: At the money exchanger
  prs.a1.unit23.lesson05.reading_receipt:
    title: Reading a receipt
  prs.a1.unit23.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit23.lesson01.teach.pul:
    title: Money
    gloss: money
    note: پول means money.
    example_gloss: I have money.
  prs.a1.unit23.lesson01.teach.naqd:
    title: Cash
    gloss: cash
    note: نقد means cash.
    example_gloss: I pay cash.
  prs.a1.unit23.lesson01.teach.kart:
    title: Card
    gloss: card
    note: کارت means card (payment card).
    example_gloss: I have a card.
  prs.a1.unit23.lesson01.teach.dollar:
    title: Dollar
    gloss: dollar
    note: دالر means dollar (USD) -- widely used and quoted alongside the afghani in everyday Afghan currency exchange.
    example_gloss: I have one hundred dollars.
  prs.a1.unit23.lesson01.teach.review_dorom:
    title: I have
    gloss: I have
    note: دارم means "I have" (already introduced in unit10 shopping).
    example_gloss: I have money.
  prs.a1.unit23.lesson01.teach.review_sad:
    title: Hundred
    gloss: hundred
    note: صد means hundred -- already introduced in unit04 numbers and reused in unit10 shopping.
    example_gloss: I have one hundred dollars.
  prs.a1.unit23.lesson02.teach.mipardazam:
    title: I pay
    gloss: I pay
    note: می‌پردازم means "I pay."
    example_gloss: I pay cash.
  prs.a1.unit23.lesson02.teach.ya:
    title: Or
    gloss: or
    note: یا means or.
    example_gloss: I pay cash or card.
  prs.a1.unit23.lesson02.teach.naqdi_ya_karti:
    title: Cash or card?
    gloss: Will you pay cash or by card?
    note: A common question at a shop or exchange counter.
  prs.a1.unit23.lesson02.teach.review_mitanom:
    title: I can
    gloss: I can
    note: می‌توانم means "I can" (already introduced earlier in the course).
    example_gloss: I can pay cash.
  prs.a1.unit23.lesson02.teach.bepardazam:
    title: Pay
    gloss: pay
    note: بپردازم is the subjunctive form of "to pay," used after می‌توانم (I can) -- می‌توانم نقد بپردازم literally means "I can pay cash."
    example_gloss: I can pay cash.
  prs.a1.unit23.lesson03.teach.sarafi:
    title: Money exchanger
    gloss: money exchanger
    note: صرافی is the real, common Afghan institution for currency exchange -- distinct from a formal بانک (bank).
    example_gloss: I go to the money exchanger.
  prs.a1.unit23.lesson03.teach.tabdil_kardan:
    title: To exchange
    gloss: to exchange
    note: تبدیل کردن means "to exchange" (currency).
    example_gloss: I exchange dollars for afghanis.
  prs.a1.unit23.lesson03.teach.narkh:
    title: Exchange rate
    gloss: exchange rate
    note: نرخ means rate/exchange rate.
    example_gloss: What is today's dollar rate?
  prs.a1.unit23.lesson03.teach.narkh_chand_ast:
    title: What's today's rate?
    gloss: What is today's dollar rate?
    note: The standard way to ask the exchange rate.
  prs.a1.unit23.lesson03.teach.review_afghani:
    title: Afghani
    gloss: afghani
    note: افغانی is Afghanistan's currency (already introduced in unit10 shopping, e.g. "صد افغانی").
    example_gloss: I have one hundred afghanis.
  prs.a1.unit23.lesson03.teach.review_ast_emroz_chand:
    title: "Review: is, today, how much"
    gloss: is / today / how much
    note: است, امروز, and چند are review words (already established earlier in the course) combined in this lesson's rate question.
    example_gloss: What is today's dollar rate?
  prs.a1.unit23.lesson03.teach.review_ba_ra_mikonam:
    title: "Review: to, object marker, I do, do, I want"
    gloss: to / object marker / I do / do / I want
    note: به, را, می‌کنم, کنم, and می‌خواهم are review words (already established earlier in the course) combined in this lesson's exchange sentences.
    example_gloss: I want to exchange dollars for afghanis.
  prs.a1.unit23.lesson04.teach.review_mikhaham:
    title: I want
    gloss: I want
    note: می‌خواهم means "I want" (already established from earlier units).
    example_gloss: I want to exchange dollars.
  prs.a1.unit23.lesson04.teach.chand_darin:
    title: How many do you have?
    gloss: How many dollars do you have?
    note: دارین is the polite/plural form of "have," addressing the customer.
  prs.a1.unit23.lesson04.teach.bufarmayin:
    title: Here you go
    gloss: here you go
    note: بفرمایین is a polite phrase used when handing something over.
    example_gloss: Here you go, seven thousand afghanis.
  prs.a1.unit23.lesson04.teach.hazar:
    title: Thousand
    gloss: thousand
    note: هزار means thousand.
    example_gloss: Seven thousand afghanis.
  prs.a1.unit23.lesson04.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: زرمینه, the established recurring character.
    example_gloss: Zarmina goes to the money exchanger.
  prs.a1.unit23.lesson04.teach.review_besyar_khub:
    title: Very good
    gloss: very good
    note: بسیار خوب, already established, used here to accept an offer.
    example_gloss: Very good, thanks.
  prs.a1.unit23.lesson04.teach.review_haftad_tashakor_kard:
    title: "Review: seventy, thanks, did/made"
    gloss: seventy / thanks / did, made (he/she)
    note: هفتاد and تشکر are review words; کرد is the third-person past of کردن (to do/make), already used in unit20's past-tense lesson -- combined here to summarize the exchange.
    example_gloss: Zarmina exchanged one hundred dollars for afghanis.
  prs.a1.unit23.lesson04.teach.turn01:
    title: 'Zarmina: Hello, I want to exchange dollars for afghanis.'
    gloss: 'Hello, I want to exchange dollars for afghanis.'
  prs.a1.unit23.lesson04.teach.turn02:
    title: 'Money exchanger: How many dollars do you have?'
    gloss: How many dollars do you have?
  prs.a1.unit23.lesson04.teach.turn03:
    title: "Zarmina: I have one hundred dollars. What is today's rate?"
    gloss: I have one hundred dollars. What is today's rate?
  prs.a1.unit23.lesson04.teach.turn04:
    title: 'Money exchanger: Today one dollar is seventy afghanis.'
    gloss: Today one dollar is seventy afghanis.
  prs.a1.unit23.lesson04.teach.turn05:
    title: 'Zarmina: Very good, please exchange it.'
    gloss: Very good, please exchange it.
    note: تبدیل کنین is the polite imperative "(please) exchange."
  prs.a1.unit23.lesson04.teach.turn06:
    title: 'Money exchanger: Here you go, seven thousand afghanis.'
    gloss: Here you go, seven thousand afghanis.
  prs.a1.unit23.lesson04.teach.turn07:
    title: 'Zarmina: Thanks.'
    gloss: Thanks.
  prs.a1.unit23.lesson05.teach.rasid:
    title: Receipt
    gloss: receipt
    note: رسید means receipt.
    example_gloss: I take a receipt.
  prs.a1.unit23.lesson05.teach.migiram:
    title: I take / receive
    gloss: I take / I receive
    note: می‌گیرم means "I take/receive."
    example_gloss: I take the money.
  prs.a1.unit23.lesson05.teach.reading_text:
    title: Reading passage
    gloss: Zarmina went to the money exchanger. She had one hundred dollars and wanted to exchange dollars for afghanis. Today's rate was seventy afghanis. Zarmina received seven thousand afghanis and took a receipt.
  prs.a1.unit23.lesson05.teach.review_raft:
    title: Went
    gloss: went
    note: رفت is the past tense "went" (he/she).
    example_gloss: Zarmina went to the money exchanger.
  prs.a1.unit23.lesson05.teach.review_haft_gereft:
    title: "Review: seven, took/received (he/she), I took/received"
    gloss: seven / took, received (he/she) / I took, received
    note: هفت is a review number; گرفت and گرفتم are the third-person and first-person past of گرفتن (to take/receive), used here for the amount Zarmina received.
    example_gloss: Zarmina received seven thousand afghanis.
  prs.a1.unit23.lesson06.teach.review_summary:
    title: Wrap-up summary
    gloss: 'I have money: cash and card. I can exchange dollars for afghanis at the money exchanger. Today''s rate is seventy afghanis for one dollar.'
  prs.a1.unit23.lesson06.teach.review_bara:
    title: For
    gloss: for
    note: برای means "for."
    example_gloss: Seventy afghanis for one dollar.
  prs.a1.unit23.lesson06.teach.review_va:
    title: And
    gloss: and
    note: و means "and" -- already familiar from earlier units.
    example_gloss: "I have money: cash and card."
