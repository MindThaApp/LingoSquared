    instruction: Write a sentence using پول (money).
    accepted_answers:
    - پول
    - پول دارم
    feedback: Any correct sentence using پول works.
  prs.a1.unit23.lesson02.exercise01.recognize_payment_question:
    instruction: Select the correct translation.
    correct_option: Will you pay cash or by card?
    distractors:
    - How much does it cost?
    - Do you have change?
    - Where is the bank?
    feedback: نقدی می‌پردازین یا کارتی؟ means "Will you pay cash or by card?"
    accepted_answers:
    - value: Will you pay cash or by card?
      status: correct
  prs.a1.unit23.lesson02.exercise02.recognize_mipardazam_reading:
    instruction: Select the correct translation.
    correct_option: I pay
    distractors:
    - I have
    - I want
    - I can
    feedback: می‌پردازم means "I pay."
    accepted_answers:
    - value: I pay
      status: correct
  prs.a1.unit23.lesson02.exercise03.match_payment_phrases:
    instruction: Match each phrase to its meaning.
    accepted_answers:
    - value:
        می‌پردازم: I pay
        نقدی می‌پردازین یا کارتی؟: Will you pay cash or by card?
        می‌توانم: I can
        پول: money
        کارت: card
        یا: or
  prs.a1.unit23.lesson02.exercise04.order_can_pay_cash:
    instruction: Put the words in the correct order.
    accepted_answers:
    - می‌توانم نقد بپردازم
    feedback: The correct order is می‌توانم نقد بپردازم (I can pay cash).
  prs.a1.unit23.lesson02.exercise05.translate_payment_question:
    instruction: 'Translate into Dari: Will you pay cash or by card?'
    accepted_answers:
    - نقدی می‌پردازین یا کارتی
    feedback: نقدی می‌پردازین یا کارتی؟ means "Will you pay cash or by card?"
  prs.a1.unit23.lesson02.exercise06.speak_payment_choice:
    instruction: 'Say: I pay cash.'
    accepted_answers:
    - نقد می‌پردازم
  prs.a1.unit23.lesson03.exercise01.recognize_sarafi:
    instruction: Select the correct translation.
    correct_option: money exchanger
    distractors:
    - bank
    - shop
    - post office
    feedback: صرافی means money exchanger.
    accepted_answers:
    - value: money exchanger
      status: correct
  prs.a1.unit23.lesson03.exercise02.recognize_narkh_question_reading:
    instruction: Select the correct translation.
    correct_option: What is today's dollar rate?
    distractors:
    - What time is it today?
    - How much does the shirt cost?
    - Where is the money exchanger?
    feedback: امروز نرخ دالر چند است؟ means "What is today's dollar rate?"
    accepted_answers:
    - value: What is today's dollar rate?
      status: correct
  prs.a1.unit23.lesson03.exercise03.match_exchange_words:
    instruction: Match each word to its meaning.
    accepted_answers:
    - value:
        صرافی: money exchanger
        تبدیل کردن: to exchange
        نرخ: exchange rate
        افغانی: afghani
        دالر: dollar
        چند: how much / how many
  prs.a1.unit23.lesson03.exercise04.order_exchange_rate_question:
    instruction: Put the words in the correct order.
    accepted_answers:
    - امروز نرخ دالر چند است
    feedback: The correct order is امروز نرخ دالر چند است؟ (What is today's dollar rate?)
  prs.a1.unit23.lesson03.exercise05.translate_exchange:
    instruction: 'Translate into Dari: I exchange dollars for afghanis.'
    accepted_answers:
    - دالر را به افغانی تبدیل می‌کنم
    feedback: "دالر را به افغانی تبدیل می‌کنم means \"I exchange dollars for afghanis.\""
  prs.a1.unit23.lesson03.exercise06.write_exchange_sentence:
    instruction: Write a sentence saying you want to exchange dollars for afghanis.
    accepted_answers:
    - می‌خواهم دالر را به افغانی تبدیل کنم
    feedback: می‌خواهم دالر را به افغانی تبدیل کنم means "I want to exchange dollars for afghanis."
  prs.a1.unit23.lesson04.exercise01.listen_context:
    instruction: Read the conversation. What is happening?
    correct_option: Zarmina exchanges one hundred dollars for afghanis at the money exchanger
    distractors:
    - Zarmina is buying dollars with a credit card
    - Zarmina is opening a bank account
    - Zarmina is asking for the price of a shirt
    feedback: Zarmina exchanges one hundred dollars for seven thousand afghanis at today's rate of seventy afghanis per dollar.
    accepted_answers:
    - value: Zarmina exchanges one hundred dollars for afghanis at the money exchanger
      status: correct
  prs.a1.unit23.lesson04.exercise02.recognize_amount:
    instruction: Select the correct translation.
    correct_option: one hundred dollars
    distractors:
    - seventy dollars
    - one hundred afghanis
    - seven dollars
    feedback: صد دالر means "one hundred dollars."
    accepted_answers:
    - value: one hundred dollars
      status: correct
  prs.a1.unit23.lesson04.exercise03.match_dialogue_facts:
    instruction: Match each word to its meaning.
    accepted_answers:
    - value:
        صد دالر: one hundred dollars
        هفتاد: seventy
        هزار: thousand
        بفرمایین: here you go
        تشکر: thanks
        می‌خواهم: I want
  prs.a1.unit23.lesson04.exercise04.order_want_exchange:
    instruction: Put the words in the correct order.
    accepted_answers:
    - می‌خواهم دالر را به افغانی تبدیل کنم
    feedback: The correct order is می‌خواهم دالر را به افغانی تبدیل کنم (I want to exchange dollars for afghanis).
  prs.a1.unit23.lesson04.exercise05.translate_how_many_dollars:
    instruction: 'Translate into Dari: How many dollars do you have?'
    accepted_answers:
    - چند دالر دارین
    feedback: چند دالر دارین؟ means "How many dollars do you have?"
  prs.a1.unit23.lesson04.exercise06.dialogue_response_ask_rate:
    instruction: Respond, asking what today's exchange rate is.
    accepted_answers:
    - امروز نرخ چند است
    - امروز نرخ چند است؟
  prs.a1.unit23.lesson04.exercise07.write_exchange_summary:
    instruction: Write a sentence saying Zarmina exchanged one hundred dollars for afghanis.
    accepted_answers:
    - زرمینه صد دالر را به افغانی تبدیل کرد
    - زرمینه صد دالر را به افغانی تبدیل کرد.
    feedback: زرمینه صد دالر را به افغانی تبدیل کرد means "Zarmina exchanged one hundred dollars for afghanis."
  prs.a1.unit23.lesson04.exercise08.speak_full_exchange_scene:
    instruction: 'Say: I want to exchange dollars for afghanis. What is today''s rate?'
    accepted_answers:
    - می‌خواهم دالر را به افغانی تبدیل کنم امروز نرخ چند است
    - می‌خواهم دالر را به افغانی تبدیل کنم. امروز نرخ چند است؟
    - می‌خواهم دالر را به افغانی تبدیل کنم، امروز نرخ چند است
  prs.a1.unit23.lesson05.exercise01.reading_comprehension_amount:
    instruction: How much did Zarmina receive?
    correct_option: seven thousand afghanis
    distractors:
    - seven hundred afghanis
    - seventy afghanis
    - one hundred afghanis
    feedback: Zarmina received seven thousand afghanis for her one hundred dollars.
    accepted_answers:
    - value: seven thousand afghanis
      status: correct
  prs.a1.unit23.lesson05.exercise02.reading_comprehension_where:
    instruction: Where did Zarmina go?
    correct_option: the money exchanger
    distractors:
    - the bank
    - the shop
    - the post office
    feedback: Zarmina went to the money exchanger (صرافی).
    accepted_answers:
    - value: the money exchanger
      status: correct
  prs.a1.unit23.lesson05.exercise03.match_reading_vocab:
    instruction: Match each word to its meaning.
    accepted_answers:
    - value:
        رسید: receipt
        می‌گیرم: I take/receive
        رفت: he/she went
        صرافی: money exchanger
        نرخ: exchange rate
        هزار: thousand
  prs.a1.unit23.lesson05.exercise04.translate_reading_summary:
    instruction: 'Translate into Dari: Zarmina received seven thousand afghanis.'
    accepted_answers:
    - زرمینه هفت هزار افغانی گرفت
    feedback: زرمینه هفت هزار افغانی گرفت means "Zarmina received seven thousand afghanis."
  prs.a1.unit23.lesson05.exercise05.write_own_receipt_note:
    instruction: Write a sentence saying you took a receipt.
    accepted_answers:
    - رسید گرفتم
    feedback: رسید گرفتم means "I took a receipt."
  prs.a1.unit23.lesson06.exercise01.reading_comprehension_rate:
    instruction: What is today's rate for one dollar?
    correct_option: seventy afghanis
    distractors:
    - seven afghanis
    - one hundred afghanis
    - seven hundred afghanis
    feedback: Today's rate is seventy afghanis for one dollar.
    accepted_answers:
    - value: seventy afghanis
      status: correct
  prs.a1.unit23.lesson06.exercise02.match_all_money_vocab:
    instruction: Match each word to its meaning.
    accepted_answers:
    - value:
        پول: money
        نقد: cash
        کارت: card
        دالر: dollar
        صرافی: money exchanger
        نرخ: exchange rate
        افغانی: afghani
  prs.a1.unit23.lesson06.exercise03.order_can_exchange:
    instruction: Put the words in the correct order.
    accepted_answers:
    - می‌توانم دالر را به افغانی تبدیل کنم
    feedback: The correct order is می‌توانم دالر را به افغانی تبدیل کنم (I can exchange dollars for afghanis).
  prs.a1.unit23.lesson06.exercise04.translate_summary_sentence:
    instruction: 'Translate into Dari: Today''s rate is seventy afghanis.'
    accepted_answers:
    - نرخ امروز هفتاد افغانی است
    feedback: نرخ امروز هفتاد افغانی است means "Today's rate is seventy afghanis."
  prs.a1.unit23.lesson06.exercise05.write_own_money_summary:
    instruction: Write a sentence summarizing what you learned about money and exchange.
    accepted_answers:
    - پول دارم نقد و کارت می‌توانم دالر تبدیل کنم
    - پول دارم نقد و کارت می‌تانم دالر تبدیل کنم
