    instruction: Put the words in the correct order.
    accepted_answers:
    - صد دالر دارم
    feedback: The correct order is صد دالر دارم (I have one hundred dollars).
  prs.a1.unit23.lesson01.exercise06.translate_cash:
    instruction: Translate into Dari.
    accepted_answers:
    - نقد
    feedback: نقد means cash.
