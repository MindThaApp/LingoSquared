    instruction: Select the correct translation.
    correct_option: money
    distractors:
    - cash
    - card
    - dollar
    feedback: پول means money.
    accepted_answers:
    - value: money
      status: correct
  prs.a1.unit23.lesson01.exercise02.recognize_naqd:
    instruction: Select the correct translation.
    correct_option: cash
    distractors:
    - card
    - money
    - dollar
    feedback: نقد means cash.
    accepted_answers:
    - value: cash
      status: correct
  prs.a1.unit23.lesson01.exercise03.recognize_dollar_reading:
    instruction: Select the correct translation.
