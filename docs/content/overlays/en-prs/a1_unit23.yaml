    - I can
    feedback: می‌پردازم means "I pay."
    accepted_answers:
    - value: I pay
      status: correct
  prs.a1.unit23.lesson02.exercise03.match_payment_phrases:
    instruction: Match each phrase to its meaning.
    accepted_answers:
