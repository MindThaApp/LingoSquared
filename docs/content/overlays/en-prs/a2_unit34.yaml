course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: giving a reason and a consequence in one message. Reasons with چون (and زیرا for reading), results with به همین دلیل / برای همین and بنابراین, and به دلیل plus a noun, with vocabulary for excuses and changes of plan.'
units:
  prs.a2.unit34.because_so:
    title: Because and so
lessons:
  prs.a2.unit34.lesson01.ask_and_give_reasons:
    title: Why? Because…
  prs.a2.unit34.lesson02.order_and_not_coming:
    title: Order of the clauses and "I did not come"
  prs.a2.unit34.lesson03.because_of_this:
    title: 'That is why: به همین دلیل and برای همین'
  prs.a2.unit34.lesson04.because_of_and_therefore:
    title: به دلیل, بنابراین and زیرا
  prs.a2.unit34.lesson05.reading_and_listening:
    title: Reading and listening about reasons
  prs.a2.unit34.lesson06.change_of_plan:
    title: A conversation about changing the plan
teaching:
  prs.a2.unit34.lesson01.teach.headache:
    title: Headache
    gloss: headache
    note: '*سردرد* is a headache. You say *سردرد دارم* (I have a headache) and *سردرد داشتم* (I had a headache). It is a very common reason to give when you cannot do something.'
    example_gloss: Yesterday I had a headache.
  prs.a2.unit34.lesson01.teach.tired:
    title: Tired
    gloss: tired
    note: '*خسته* is tired. It is an adjective, so it goes with *استم* (I am) and *بودم* (I was): *خسته بودم* is I was tired.'
    example_gloss: Today I am very tired.
  prs.a2.unit34.lesson01.teach.busy:
    title: Busy
    gloss: busy, occupied
    note: '*مصروف* is busy. *مصروف بودم* is I was busy. It is the usual short reason for missing a meeting or a visit.'
    example_gloss: This week I am busy.
  prs.a2.unit34.lesson01.teach.weather:
    title: Weather
    gloss: weather, air
    note: '*هوا* is the weather and also the air. *هوا خوب است* is the weather is good.'
    example_gloss: Today the weather is good.
  prs.a2.unit34.lesson01.teach.cold:
    title: Cold
    gloss: cold
    note: '*سرد* is cold. *هوا سرد است* is it is cold, said about the weather.'
    example_gloss: At night the weather is cold.
  prs.a2.unit34.lesson01.teach.excuse:
    title: Excuse
    gloss: excuse, reason given
    note: '*عذر* is the reason you give for not doing something, an excuse. A good *عذر* answers the question *چرا؟*.'
    example_gloss: His excuse was a headache.
  prs.a2.unit34.lesson01.teach.why_because:
    title: Asking why and answering because
    gloss: Why did you not go to the office? Because I was tired.
    note: '*چرا* asks for a reason and *چون* gives it. The answer can be a whole clause: *چون خسته بودم* (because I was tired). In a short answer you do not repeat the rest of the question. Nothing changes inside the clause after *چون*: the verb stays at the end, as in every Dari sentence.'
  prs.a2.unit34.lesson01.teach.reason_sentence:
    title: I did not go to the office because I was ill
    gloss: I did not go to the office because I was ill.
    note: 'This is the pattern of the unit: first what happened, then a comma, then *چون* and the reason. The two parts can also swap places: *چون مریض بودم، به دفتر نرفتم*.'
  prs.a2.unit34.lesson02.teach.friends:
    title: Marjan and Haroon
    gloss: Marjan and Haroon are friends.
    note: 'Marjan and Haroon are the two friends in this unit. They speak to each other with *تو*. The ending *-ند* of *استند* is the plural of *است*: they are.'
  prs.a2.unit34.lesson02.teach.came:
    title: 'To come: the simple past'
    gloss: I came, you came, he/she came, we came, you came (formal or plural), they came
    note: 'The past of *آمدن* is *آمدم، آمدی، آمد، آمدیم، آمدین، آمدند*. You say where you came to with *به*: *به جلسه آمدم* is I came to the meeting. The endings are the same as for every past verb you know.'
  prs.a2.unit34.lesson02.teach.did_not_come:
    title: 'I did not come: ن + یامد'
    gloss: I did not come, you did not come, he/she did not come, we did not come, you did not come, they did not come
    note: 'The negative of *آمدن* in the past is *نیامدم* (I did not come). Put *ن* before the verb: *نـ + آمدم* becomes *نیامدم*, with a *ی* between the two *ا* sounds. The other forms are *نیامدی، نیامد، نیامدیم، نیامدین، نیامدند*. For *رفتن* it is simple: *نرفتم، نرفتی، نرفت*.'
  prs.a2.unit34.lesson02.teach.stay:
    title: To stay
    gloss: to stay, to remain
    note: '*ماندن* is to stay. The past is *ماندم، ماندی، ماندیم*, and the present is *می‌مانم، می‌مانی، می‌مانیم*. *در خانه ماندم* is I stayed at home, a very common result when the weather is bad or you are ill.'
    example_gloss: Today I am staying at home.
  prs.a2.unit34.lesson02.teach.either_order:
    title: The reason can come first or second
    gloss: Because it is cold, I stay at home. / I stay at home because it is cold.
    note: 'The clause with *چون* can stand before or after the main clause, and the meaning is the same. When it comes first, put a comma after it: *چون هوا سرد است، در خانه می‌مانم*. Dari verbs stay at the end of each clause either way, so the word order inside the clauses never changes.'
  prs.a2.unit34.lesson02.teach.sorry:
    title: I am sorry, I did not come to the meeting
    gloss: I am sorry, I did not come to the meeting.
    note: '*متأسفم* is I am sorry. People often say it first and then give the reason with *چون*.'
  prs.a2.unit34.lesson02.teach.stayed_home:
    title: Because I was tired, I stayed at home
    gloss: Because I was tired, I stayed at home.
    note: The reason (*خسته بودم*) is in the past and the result (*در خانه ماندم*) is in the past too.
  prs.a2.unit34.lesson03.teach.so_dalil:
    title: 'به همین دلیل: for this reason, so'
    gloss: I was busy. That is why I did not come.
    note: '*به همین دلیل* gives the result of what you just said. It means for this same reason, that is why. It starts the second sentence: first the reason (*مصروف بودم*), then the result (*به همین دلیل نیامدم*). It is the mirror image of *چون*: *چون* introduces the reason, *به همین دلیل* introduces the result.'
  prs.a2.unit34.lesson03.teach.so_hamin:
    title: 'برای همین: that is why'
    gloss: It was cold. That is why we stayed at home.
    note: '*برای همین* means the same as *به همین دلیل* and is shorter. It is common in conversation, and *به همین دلیل* is a little more careful. You can put *و* before either one: *هوا سرد بود و برای همین در خانه ماندیم*.'
  prs.a2.unit34.lesson03.teach.because_vs_so:
    title: Two ways to say the same thing
    gloss: Because I was ill, I did not come. / I was ill. That is why I did not come.
    note: 'These two sentences say the same thing. With *چون* the reason comes first or last inside one sentence. With *به همین دلیل* you have two sentences: the reason first, then the result. The reason always has the same meaning. Use one connector for one link: do not put *چون* and *به همین دلیل* in the same sentence.'
  prs.a2.unit34.lesson03.teach.busy_not_come:
    title: I was busy. That is why I did not come
    gloss: I was busy. That is why I did not come.
    note: 'A short message to explain an absence: the reason, then the result.'
  prs.a2.unit34.lesson03.teach.cold_stayed:
    title: It was cold. That is why we stayed at home
    gloss: It was cold. That is why we stayed at home.
    note: The same pattern with *برای همین*. *ماندیم* is we stayed.
  prs.a2.unit34.lesson03.teach.car_broken:
    title: My car was broken. That is why I arrived late
    gloss: My car was broken. That is why I arrived late.
    note: 'The result can be a different kind of action: not only staying home, but arriving late.'
  prs.a2.unit34.lesson04.teach.be_dalil:
    title: 'به دلیل + noun: because of'
    gloss: because of the snow, because of a headache, because of work
    note: '*به دلیل* means because of, and it is followed by a noun, not by a whole clause: *به دلیل برف* (because of the snow), *به دلیل سردرد* (because of a headache). The sentence that follows is the result. *به دلیل برف* does the same job as *چون برف می‌بارید*, in fewer words. Use *چون* when you have a verb and *به دلیل* when you only have a noun.'
  prs.a2.unit34.lesson04.teach.snow_cancel:
    title: Because of the snow, the meeting was cancelled
    gloss: Because of the snow, the meeting was cancelled.
    note: '*لغو شد* is was cancelled. The phrase with *به دلیل* often comes first and is followed by a comma.'
  prs.a2.unit34.lesson04.teach.headache_office:
    title: Because of a headache, I did not go to the office
    gloss: Because of a headache, I did not go to the office.
    note: 'The same pattern with a different noun. You can also put it last: *به دفتر نرفتم، به دلیل سردرد*.'
  prs.a2.unit34.lesson04.teach.change_plan:
    title: To change
    gloss: to change, to alter
    note: '*تغییر دادن* is to change something. The thing you change comes before the verb with *را*: *برنامه را تغییر دادیم* is we changed the plan. The past is *دادم، دادی، دادیم* and the present is *می‌دهیم*: *برنامه را تغییر می‌دهیم* is we are changing the plan.'
    example_gloss: We changed the plan.
  prs.a2.unit34.lesson04.teach.banabarin:
    title: 'بنابراین: therefore'
    gloss: The road was closed. Therefore the bus did not go.
    note: '*بنابراین* means therefore, and it starts a sentence that gives the result: the reason first, then *بنابراین* and the result. It has the same job as *به همین دلیل*, but it is more formal. You will mostly find it in written messages, notices and reports. In speech people prefer *برای همین* or *به همین دلیل*.'
  prs.a2.unit34.lesson04.teach.zira:
    title: 'زیرا: because (in writing)'
    gloss: The meeting was cancelled because the manager did not come.
    note: '*زیرا* also means because, but you will see it in writing, not in speech. It usually comes after the result and a comma: the result first, then *زیرا* and the reason. When you speak or write a message to a friend, use *چون*. You only need to recognise *زیرا*.'
  prs.a2.unit34.lesson04.teach.connectors:
    title: Reason words and result words
    gloss: 'because, because (written), because of: the reason. for this reason, that is why, therefore: the result.'
    note: Sort the words by their job. *چون*, *زیرا* and *به دلیل* come with the reason. *به همین دلیل*, *برای همین* and *بنابراین* come with the result. In conversation use *چون* and *برای همین*. In a formal message use *زیرا*, *به دلیل* and *بنابراین*.
  prs.a2.unit34.lesson05.teach.meeting_today:
    title: Meeting (linked form)
    gloss: meeting of ... (linked form)
    note: 'When *جلسه* is followed by another word that describes it, a small sign (the hamza on the final *ه*) joins the two: *جلسهٔ امروز* is today''s meeting. In everyday writing this sign is often left out.'
    example_gloss: Today's meeting is at ten o'clock.
  prs.a2.unit34.lesson05.teach.niloufar:
    title: Niloufar (name)
    gloss: Niloufar (a woman's name)
    note: '*نیلوفر* is a woman''s name. She writes the message you will read.'
    example_gloss: Niloufar works in an office.
  prs.a2.unit34.lesson05.teach.d1_t1:
    title: Marjan asks Haroon why he did not come
    gloss: Haroon, why did you not come to the meeting yesterday?
    note: Marjan asks *چرا* with the simple past negative *نیامدی*. She speaks to a friend, so she uses *تو*.
  prs.a2.unit34.lesson05.teach.d1_t2:
    title: Haroon explains
    gloss: I am sorry. I had a headache, so I stayed at home.
    note: Haroon apologises, gives the reason (*سردرد داشتم*) and the result (*به همین دلیل در خانه ماندم*) in two short sentences.
  prs.a2.unit34.lesson05.teach.d1_t3:
    title: Marjan asks about the phone call
    gloss: Why did you not phone?
    note: '*تیلفون نکردی* is you did not phone. She asks for one more reason with *چرا*.'
  prs.a2.unit34.lesson05.teach.d1_t4:
    title: Haroon gives a second reason
    gloss: Because my phone was broken.
    note: 'A short answer: *چون* and the reason, with nothing else.'
  prs.a2.unit34.lesson05.teach.d1_t5:
    title: Marjan reacts
    gloss: How bad! Are you well now?
    note: '*چه بد!* is a friendly reaction to bad news. *استی* is the friendly form of you are.'
  prs.a2.unit34.lesson05.teach.d1_t6:
    title: Haroon answers
    gloss: Yes, I am well now.
    note: '*استم* is I am.'
  prs.a2.unit34.lesson05.teach.message:
    title: A message from Niloufar
    gloss: Hello Marjan. I am sorry, today's meeting was cancelled, because the manager did not come to the office. Because of the snow, the road was closed. Therefore the meeting is on Thursday. Niloufar
    note: 'A short written message. It uses the written reason words: *زیرا* for the reason, *به دلیل برف* for a cause that is a noun, and *بنابراین* for the result.'
  prs.a2.unit34.lesson06.teach.d2_t1:
    title: Haroon suggests a day
    gloss: Marjan, shall we go to the park on Wednesday?
    note: 'The simple present *می‌رویم* with a day of the week is a plan: we are going on Wednesday. The question ends with a rising voice.'
  prs.a2.unit34.lesson06.teach.d2_t2:
    title: Marjan gives a reason
    gloss: Not Wednesday, because it is going to snow.
    note: Marjan refuses with *نه* and gives the reason with *چون*. The present tense *برف می‌بارد* is also how people talk about tomorrow's weather.
  prs.a2.unit34.lesson06.teach.d2_t3:
    title: Haroon changes the plan
    gloss: Then we will change the plan. Shall we go on Thursday?
    note: '*پس* is then, so. *برنامه را تغییر می‌دهیم* is we change the plan.'
  prs.a2.unit34.lesson06.teach.d2_t4:
    title: Marjan cannot come on Thursday
    gloss: I have a meeting on Thursday, so I cannot.
    note: Reason (*جلسه دارم*) and result (*به همین دلیل نمی‌توانم*) in one sentence, joined by a comma. *نمی‌توانم* is I cannot.
  prs.a2.unit34.lesson06.teach.d2_t5:
    title: Haroon chooses another day
    gloss: Good, then we will go on Friday.
    note: '*پس* here means then: that settles it.'
  prs.a2.unit34.lesson06.teach.d2_t6:
    title: Marjan agrees
    gloss: Yes, Friday is good.
    note: '*جمعه خوب است* is Friday is good, said to agree with a plan.'
exercises:
  prs.a2.unit34.lesson01.exercise01.recognize_headache:
    instruction: What does this mean?
    correct_option: Because I have a headache
    distractors:
    - Because I had a headache
    - Why do I have a headache?
    - Because I am tired
    accepted_answers:
    - value: Because I have a headache
      status: correct
    feedback: '*چون* is because and *سردرد دارم* is I have a headache.'
  prs.a2.unit34.lesson01.exercise02.recognize_not_go:
    instruction: What does this sentence mean?
    correct_option: I did not go to the office because I was tired
    distractors:
    - I went to the office because I was tired
    - I will not go to the office because I am tired
    - I was tired because I did not go to the office
    accepted_answers:
    - value: I did not go to the office because I was tired
      status: correct
    feedback: '*چون خسته بودم* is the reason (because I was tired) and *به دفتر نرفتم* is what happened (I did not go to the office).'
  prs.a2.unit34.lesson01.exercise03.recognize_cold:
    instruction: What is the reason in this sentence?
    correct_option: The weather is cold
    distractors:
    - I am ill
    - I am busy
    - I do not like parks
    accepted_answers:
    - value: The weather is cold
      status: correct
    feedback: 'The reason comes after *چون*: *هوا سرد است* is the weather is cold.'
  prs.a2.unit34.lesson01.exercise04.match_reason_words:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        چرا: why
        چون: because
        سردرد: headache
        خسته: tired
        مصروف: busy
        هوا: weather
        سرد: cold
        عذر: excuse
        مریض: ill
        برف: snow
        باران: rain
      status: correct
    feedback: '*چرا* asks for the reason and *چون* gives it. The other words are common reasons: a headache, being tired, being busy, the weather.'
  prs.a2.unit34.lesson01.exercise05.order_not_go_ill:
    instruction: 'Arrange the words to say: I did not go to the office because I was ill.'
    accepted_answers:
    - value:
      - به
      - دفتر
      - نرفتم
      - چون
      - مریض
      - بودم
      status: correct
    - value:
      - چون
      - مریض
      - بودم
      - به
      - دفتر
      - نرفتم
      status: correct
    feedback: '*به دفتر نرفتم، چون مریض بودم.* The reason clause can come first or second.'
  prs.a2.unit34.lesson01.exercise06.translate_not_go_tired:
    instruction: 'Translate into Dari: I did not go to the office because I was tired.'
    accepted_answers:
    - value: به دفتر نرفتم، چون خسته بودم.
      status: correct
    - value: به دفتر نرفتم چون خسته بودم.
      status: correct
    - value: چون خسته بودم، به دفتر نرفتم.
      status: correct
    - value: چون خسته بودم به دفتر نرفتم.
      status: correct
    - value: من به دفتر نرفتم، چون خسته بودم.
      status: correct
    - value: من به دفتر نرفتم چون خسته بودم.
      status: correct
    - value: چون خسته بودم، من به دفتر نرفتم.
      status: correct
    - value: چون خسته بودم من به دفتر نرفتم.
      status: correct
    - value: من به دفتر نرفتم، چون من خسته بودم.
      status: correct
    - value: من به دفتر نرفتم چون من خسته بودم.
      status: correct
    - value: چون من خسته بودم، من به دفتر نرفتم.
      status: correct
    - value: چون من خسته بودم من به دفتر نرفتم.
      status: correct
    feedback: '*به دفتر نرفتم، چون خسته بودم.* The reason clause with *چون* can come first or second, and *من* is optional.'
  prs.a2.unit34.lesson02.exercise01.recognize_not_come_meeting:
    instruction: What does this sentence mean?
    correct_option: I did not come to the meeting because I was ill
    distractors:
    - I came to the meeting because I was ill
    - I will not come to the meeting because I am ill
    - I did not go to the doctor because I was ill
    accepted_answers:
    - value: I did not come to the meeting because I was ill
      status: correct
    feedback: '*نیامدم* is I did not come, and *چون مریض بودم* gives the reason.'
  prs.a2.unit34.lesson02.exercise02.reason_rain:
    instruction: What is the reason?
    correct_option: It is snowing
    distractors:
    - I am ill
    - I am tired
    - I am busy
    accepted_answers:
    - value: It is snowing
      status: correct
    feedback: 'The reason follows *چون*: *برف می‌بارد* is it is snowing.'
  prs.a2.unit34.lesson02.exercise03.match_come_forms:
    instruction: Match each Dari verb with its meaning.
    accepted_answers:
    - value:
        آمدم: I came
        نیامدم: I did not come
        آمدی: you came
        نیامدی: you did not come
        آمد: he or she came
        نیامد: he or she did not come
        آمدیم: we came
        نیامدیم: we did not come
        آمدند: they came
        نیامدند: they did not come
      status: correct
    feedback: 'The negative adds *ن* and a *ی*: *آمدم* becomes *نیامدم*. The endings stay the same for each person.'
  prs.a2.unit34.lesson02.exercise04.order_cold_stay:
    instruction: 'Arrange the words to say: Because it is cold, I stay at home.'
    accepted_answers:
    - value:
      - چون
      - هوا
      - سرد
      - است
      - در
      - خانه
      - می‌مانم
      status: correct
    - value:
      - در
      - خانه
      - می‌مانم
      - چون
      - هوا
      - سرد
      - است
      status: correct
    feedback: '*چون هوا سرد است، در خانه می‌مانم.* The two parts can swap places, and each verb stays at the end of its own part.'
  prs.a2.unit34.lesson02.exercise05.complete_not_come:
    instruction: 'Complete the sentence: Yesterday I did not come to the meeting, because I was busy.'
    accepted_answers:
    - value: نیامدم
      status: correct
    feedback: '*نیامدم* is I did not come. *دیروز به جلسه نیامدم، چون مصروف بودم.*'
  prs.a2.unit34.lesson02.exercise06.answer_why_not_come:
    instruction: 'Marjan asks: هارون، چرا دیروز به جلسه نیامدی؟ (Haroon, why did you not come to the meeting yesterday?) Answer as Haroon: Because I was busy.'
    accepted_answers:
    - value: چون مصروف بودم.
      status: correct
    - value: مصروف بودم.
      status: correct
    - value: چون من مصروف بودم.
      status: correct
