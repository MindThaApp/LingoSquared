course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: expressing present and past ability using
    the می‌تان(م/ی/ه/یم/ین/ن) که + subjunctive-clause construction,
    across everyday errands and appointments.

units:
  prs.b1.unit01.abilities:
    title: Ability
    description: Express what you can, could, or could not do, using a modal-plus-clause construction, in present and past tense.

lessons:
  prs.b1.unit01.lesson01.present_ability_1st2nd:
    title: "I can / you can"
  prs.b1.unit01.lesson02.present_ability_all_persons:
    title: "All the persons"
  prs.b1.unit01.lesson03.past_ability:
    title: "I could / I could not"
  prs.b1.unit01.lesson04.dialogue_errands:
    title: "Errands"
  prs.b1.unit01.lesson05.reading_appointment:
    title: "A doctor's appointment"
  prs.b1.unit01.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit01.lesson01.teach.mitanam:
    title: I can
    gloss: I can
    note: "می‌تانم is the colloquial Dari form of 'I can' (from توانستن/تانستن, to be able)."
    example_gloss: "I can buy this book."
  prs.b1.unit01.lesson01.teach.mitani:
    title: You can
    gloss: you can
    note: "می‌تانی is the 2nd person singular form."
    example_gloss: "Can you send this letter?"
  prs.b1.unit01.lesson01.teach.grammar_ke_clause:
    title: "The که-clause ability construction"
    gloss: "می‌تانم که بخرم = I can buy (literally \"I can that I buy\")"
    note: "که introduces a subjunctive clause: بخرم (buy), ببینم (see), بفرستم (send) change form with the subject. A simpler colloquial form without که (می‌تانم بخرم) also exists and is common in casual speech -- but می‌تانم که + subjunctive is a real, slightly more deliberate register still used today, especially for careful or semi-formal speech, and is this unit's main focus."
  prs.b1.unit01.lesson01.teach.review_ketab:
    title: Book
    gloss: book
    note: "کتاب means book."
    example_gloss: "This is my book."
  prs.b1.unit01.lesson01.teach.review_nama:
    title: Letter
    gloss: letter
    note: "نامه means letter."
    example_gloss: "This letter is for you."
  prs.b1.unit01.lesson01.teach.review_in:
    title: This
    gloss: this
    note: "این means this."
    example_gloss: "This is a book."
  prs.b1.unit01.lesson01.teach.review_ra:
    title: "(object marker)"
    gloss: "(object marker)"
    note: "را marks the direct object."
    example_gloss: "I buy the book."
  prs.b1.unit01.lesson01.teach.befresti:
    title: "(that) you send"
    gloss: "(that) you send"
    note: "بفرستی is the 2nd person subjunctive of فرستادن (to send)."
    example_gloss: "You can send this letter."

  prs.b1.unit01.lesson02.teach.mitana:
    title: He/she can
    gloss: he/she can
    note: "می‌تانه is the 3rd person singular form."
    example_gloss: "Homayoun can take this letter."
  prs.b1.unit01.lesson02.teach.mitanim:
    title: We can
    gloss: we can
    note: "می‌تانیم is the 1st person plural form."
    example_gloss: "We can go tomorrow."
  prs.b1.unit01.lesson02.teach.mitanin:
    title: "You (pl./polite) can"
    gloss: "you (plural/polite) can"
    note: "می‌تانین is the 2nd person plural/polite form."
    example_gloss: "You can do this work."
  prs.b1.unit01.lesson02.teach.mitanan:
    title: They can
    gloss: they can
    note: "می‌تانن is the 3rd person plural form."
    example_gloss: "They can come early."
  prs.b1.unit01.lesson02.teach.grammar_agreement:
    title: "Subject agreement across the whole sentence"
    gloss: "Both the modal AND the embedded verb agree with the same subject"
    note: "همایون می‌تانه که ببره (he can that he-take = he can take) -- both halves of the sentence track the same person, not a fixed form."
  prs.b1.unit01.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "همایون -- an established recurring character in this course."
    example_gloss: "Homayoun has work today."
  prs.b1.unit01.lesson02.teach.review_anha:
    title: They
    gloss: they
    note: "آنها means they."
    example_gloss: "They are coming today."
  prs.b1.unit01.lesson02.teach.zud:
    title: Early / soon
    gloss: early / soon
    note: "زود means early or soon."
    example_gloss: "They come early."
  prs.b1.unit01.lesson02.teach.farda:
    title: Tomorrow
    gloss: tomorrow
    note: "فردا means tomorrow."
    example_gloss: "We're going tomorrow."

  prs.b1.unit01.lesson03.teach.mitanestam:
    title: I could
    gloss: I could / I was able to
    note: "می‌تانستم is the past form of می‌تانم -- add ـستم to the می‌تان- stem."
    example_gloss: "Yesterday I could buy this book."
  prs.b1.unit01.lesson03.teach.natanestam:
    title: I could not
    gloss: I could not / I was not able to
    note: "نتانستم negates می‌تانستم with the ن- prefix."
    example_gloss: "Yesterday I could not go to the office."
  prs.b1.unit01.lesson03.teach.grammar_past:
    title: "Forming past ability"
    gloss: "می‌تانستم که بخرم = I could/was able to buy (about the past)"
    note: "Add ـستم to می‌تان to make the past stem (می‌تانستم، می‌تانستی، می‌تانست، می‌تانستیم، می‌تانستین، می‌تانستن), still followed by که + subjunctive. Negate with ن-: نتانستم = I could NOT."
  prs.b1.unit01.lesson03.teach.review_diroz:
    title: Yesterday
    gloss: yesterday
    note: "دیروز means yesterday."
    example_gloss: "I had work yesterday."
  prs.b1.unit01.lesson03.teach.review_daftar:
    title: Office
    gloss: office
    note: "دفتر means office."
    example_gloss: "Where is the ID office?"
  prs.b1.unit01.lesson03.teach.review_beravam:
    title: "(that) I go"
    gloss: "(that) I go"
    note: "بروم is the subjunctive of رفتن (to go)."
    example_gloss: "I want to go."
  prs.b1.unit01.lesson03.teach.ba:
    title: To
    gloss: to
    note: "به means to/at."
    example_gloss: "I'm going to the office."
  prs.b1.unit01.lesson03.teach.mitanesti:
    title: You could
    gloss: you could / you were able to
    note: "می‌تانستی is the 2nd person past form."
    example_gloss: "Could you go yesterday?"

  prs.b1.unit01.lesson04.teach.posta:
    title: Post office
    gloss: post office
    note: "پسته خانه means post office."
    example_gloss: "I'm taking this letter to the post office."
  prs.b1.unit01.lesson04.teach.tazkera:
    title: "ID card / national ID document"
    gloss: "ID card"
    note: "تذکره is the Afghan national identity document."
    example_gloss: "The ID office is open tomorrow."
  prs.b1.unit01.lesson04.teach.zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "زرمینه -- an established recurring character in this course."
    example_gloss: "Zarmina has work today."
  prs.b1.unit01.lesson04.teach.narft:
    title: "Didn't go"
    gloss: "didn't go"
    note: "نرفت is the 3rd person past negative of رفتن (to go)."
    example_gloss: "Yesterday she didn't go to the office."
  prs.b1.unit01.lesson04.teach.emroz:
    title: Today
    gloss: today
    note: "امروز means today."
    example_gloss: "I have time today."
  prs.b1.unit01.lesson04.teach.bali:
    title: "Yes"
    gloss: "yes"
    note: "بلی means yes."
    example_gloss: "Yes, I can."
  prs.b1.unit01.lesson04.teach.daram:
    title: "I have"
    gloss: "I have"
    note: "دارم is the 1st person present of داشتن (to have)."
    example_gloss: "I have time today."
  prs.b1.unit01.lesson04.teach.dialogue_zarmina_ask:
    title: "Homayoun, can you take this letter to the post office?"
    gloss: "Homayoun, can you take this letter to the post office?"
    note: "Zarmina asks Homayoun a favor, using می‌تانی که + subjunctive."
  prs.b1.unit01.lesson04.teach.dialogue_homayoun_agree:
    title: "Yes, I can. I have time today."
    gloss: "Yes, I can. I have time today."
    note: "Homayoun agrees."
  prs.b1.unit01.lesson04.teach.dialogue_zarmina_pastaction:
    title: "Thanks. By the way, yesterday I wanted to go to the ID office, but I couldn't."
    gloss: "Thanks. By the way, yesterday I wanted to go to the ID office, but I couldn't."
    note: "Zarmina shifts to a past-ability example."
  prs.b1.unit01.lesson04.teach.dialogue_homayoun_why:
    title: "Why couldn't you?"
    gloss: "Why couldn't you?"
    note: "Homayoun asks why, using نتانستی."
  prs.b1.unit01.lesson04.teach.dialogue_zarmina_reason:
    title: "I didn't have time. Tomorrow I can go."
    gloss: "I didn't have time. Tomorrow I can go."
    note: "Zarmina explains and states a future-present ability."

  prs.b1.unit01.lesson05.teach.daktar:
    title: Doctor
    gloss: doctor
    note: "داکتر means doctor."
    example_gloss: "I'm going to the doctor today."
  prs.b1.unit01.lesson05.teach.molaqat:
    title: Appointment
    gloss: appointment
    note: "ملاقات means appointment/meeting."
    example_gloss: "My appointment is at three o'clock."
  prs.b1.unit01.lesson05.teach.beravad:
    title: "(that) he/she go"
    gloss: "(that) he/she go"
    note: "برود is the 3rd person subjunctive of رفتن (to go)."
    example_gloss: "Homayoun can go."
  prs.b1.unit01.lesson05.teach.natanest:
    title: "He/she could not"
    gloss: "he/she could not"
    note: "نتانست is the 3rd person past-negative of تانستن."
    example_gloss: "Last year he could not go."
  prs.b1.unit01.lesson05.teach.nazd:
    title: "Near / at (someone's place)"
    gloss: "near / at (someone's)"
    note: "نزد is used for going to see a person, e.g. نزد داکتر (to the doctor's)."
    example_gloss: "I'm going to the doctor's."
  prs.b1.unit01.lesson05.teach.che:
    title: What
    gloss: what
    note: "چه means what."
    example_gloss: "What work do you have?"
  prs.b1.unit01.lesson05.teach.kar:
    title: Work
    gloss: work
    note: "کار means work."
    example_gloss: "I have work today."
  prs.b1.unit01.lesson05.teach.review_ast2:
    title: Is
    gloss: is
    note: "است means is."
    example_gloss: "My appointment is at three."
  prs.b1.unit01.lesson05.teach.saat:
    title: "Hour / o'clock"
    gloss: "hour / o'clock"
    note: "ساعت means hour or o'clock."
    example_gloss: "It's three o'clock."
  prs.b1.unit01.lesson05.teach.se:
    title: Three
    gloss: three
    note: "سه means three."
    example_gloss: "The appointment is at three."
  prs.b1.unit01.lesson05.teach.man:
    title: "I / me / my"
    gloss: "I / me / my"
    note: "من means I/me."
    example_gloss: "It's my appointment."
  prs.b1.unit01.lesson05.teach.reading_passage:
    title: "Zarmina and the doctor's appointment"
    gloss: "Last year Zarmina had a doctor's appointment, but she couldn't go, because she had work. This year, she can take the appointment, because tomorrow she has no work. Homayoun can also go with Zarmina, if he has time."
    note: "A short reading combining present and past ability, reusing this unit's established characters."

  prs.b1.unit01.lesson06.teach.grammar_review:
    title: "Review: present and past ability"
    gloss: "Present ability = می‌تان + person-ending + که + subjunctive. Past ability = می‌تانست + person-ending + که + subjunctive. Negative = ن- prefix on either."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit01.lesson06.teach.ba2:
    title: With
    gloss: with
    note: "با means with."
    example_gloss: "I'm going with Homayoun."
  prs.b1.unit01.lesson06.teach.bokonam:
    title: "(that) I do"
    gloss: "(that) I do"
    note: "بکنم is the 1st person subjunctive of کردن (to do)."
    example_gloss: "I can do this work."

exercises:
  prs.b1.unit01.lesson01.exercise01.recognize_mitanam:
    instruction: "What does this word mean?"
    correct_option: "I can"
    distractors: ["you can", "I want", "I have"]
    accepted_answers: [{value: "I can", status: correct}]
    feedback: "می‌تانم means I can."
  prs.b1.unit01.lesson01.exercise02.recognize_mitani:
    instruction: "What does this word mean?"
    correct_option: "you can"
    distractors: ["I can", "you want", "you have"]
    accepted_answers: [{value: "you can", status: correct}]
    feedback: "می‌تانی means you can."
  prs.b1.unit01.lesson01.exercise03.order_mitanam_bokharam:
    instruction: "Put the words in order: I can buy this book."
    accepted_answers:
      - {value: "می‌تانم که این کتاب را بخرم", status: correct}
    feedback: "می‌تانم که این کتاب را بخرم means I can buy this book."
  prs.b1.unit01.lesson01.exercise04.match_ability_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {می‌تانم: "I can", می‌تانی: "you can", کتاب: book, نامه: letter, این: this, را: "(object marker)"}
        status: correct
    feedback: "These are this lesson's core ability words."
  prs.b1.unit01.lesson01.exercise05.translate_can_send_letter:
    instruction: "Translate into Dari: Can you send this letter?"
    accepted_answers:
      - {value: "می‌تانی که این نامه را بفرستی؟", status: correct}
    feedback: "می‌تانی که این نامه را بفرستی؟ means can you send this letter?"
  prs.b1.unit01.lesson01.exercise06.speak_can_buy_book:
    instruction: "Say aloud in Dari: I can buy this book."
    accepted_answers:
      - {value: "می‌تانم که این کتاب را بخرم", status: correct}
    feedback: "می‌تانم که این کتاب را بخرم means I can buy this book."
  prs.b1.unit01.lesson01.exercise07.write_ability_sentence:
    instruction: "Write in Dari: I can send this letter."
    accepted_answers:
      - {value: "می‌تانم که این نامه را بفرستم", status: correct}
    feedback: "می‌تانم که این نامه را بفرستم means I can send this letter."

  prs.b1.unit01.lesson02.exercise01.recognize_mitana:
    instruction: "What does this word mean?"
    correct_option: "he/she can"
    distractors: ["we can", "they can", "you can"]
    accepted_answers: [{value: "he/she can", status: correct}]
    feedback: "می‌تانه means he/she can."
  prs.b1.unit01.lesson02.exercise02.recognize_mitanim:
    instruction: "What does this word mean?"
    correct_option: "we can"
    distractors: ["he/she can", "they can", "I can"]
    accepted_answers: [{value: "we can", status: correct}]
    feedback: "می‌تانیم means we can."
  prs.b1.unit01.lesson02.exercise03.order_homayoun_mitana:
    instruction: "Put the words in order: Homayoun can take this letter."
    accepted_answers:
      - {value: "همایون می‌تانه که این نامه را ببره", status: correct}
    feedback: "همایون می‌تانه که این نامه را ببره means Homayoun can take this letter."
  prs.b1.unit01.lesson02.exercise04.match_person_forms:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {می‌تانم: "I can", می‌تانی: "you (sg) can", می‌تانه: "he/she can", می‌تانیم: "we can", می‌تانین: "you (pl/polite) can", می‌تانن: "they can"}
        status: correct
    feedback: "These are all six persons of the present-ability form."
  prs.b1.unit01.lesson02.exercise05.translate_they_can_come:
    instruction: "Translate into Dari: They can come early."
    accepted_answers:
      - {value: "آنها می‌تانن که زود بیایند", status: correct}
    feedback: "آنها می‌تانن که زود بیایند means they can come early."
  prs.b1.unit01.lesson02.exercise06.speak_we_can_go:
    instruction: "Say aloud in Dari: We can go tomorrow."
    accepted_answers:
      - {value: "می‌تانیم که فردا برویم", status: correct}
    feedback: "می‌تانیم که فردا برویم means we can go tomorrow."
  prs.b1.unit01.lesson02.exercise07.write_homayoun_ability:
    instruction: "Write in Dari: Homayoun can take this letter."
    accepted_answers:
      - {value: "همایون می‌تانه که این نامه را ببره", status: correct}
    feedback: "همایون می‌تانه که این نامه را ببره means Homayoun can take this letter."

  prs.b1.unit01.lesson03.exercise01.recognize_mitanestam:
    instruction: "What does this word mean?"
    correct_option: "I could"
    distractors: ["I can", "I could not", "I will"]
    accepted_answers: [{value: "I could", status: correct}]
    feedback: "می‌تانستم means I could/was able to."
  prs.b1.unit01.lesson03.exercise02.recognize_natanestam:
    instruction: "What does this word mean?"
    correct_option: "I could not"
    distractors: ["I could", "I can", "I will not"]
    accepted_answers: [{value: "I could not", status: correct}]
    feedback: "نتانستم means I could not/was not able to."
  prs.b1.unit01.lesson03.exercise03.order_diroz_natanestam:
    instruction: "Put the words in order: Yesterday I could not go to the office."
    accepted_answers:
      - {value: "دیروز نتانستم که به دفتر بروم", status: correct}
    feedback: "دیروز نتانستم که به دفتر بروم means yesterday I could not go to the office."
  prs.b1.unit01.lesson03.exercise04.match_past_present:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {می‌تانم: "I can (now)", می‌تانستم: "I could (past)", می‌تانی: "you can (now)", می‌تانستی: "you could (past)", نتانستم: "I could not", دیروز: yesterday}
        status: correct
    feedback: "Compare the present and past forms side by side."
  prs.b1.unit01.lesson03.exercise05.translate_could_not_go:
    instruction: "Translate into Dari: Yesterday I could not go to the office."
    accepted_answers:
      - {value: "دیروز نتانستم که به دفتر بروم", status: correct}
    feedback: "دیروز نتانستم که به دفتر بروم means yesterday I could not go to the office."
  prs.b1.unit01.lesson03.exercise06.speak_could_buy:
    instruction: "Say aloud in Dari: Yesterday I could buy this book."
    accepted_answers:
      - {value: "دیروز می‌تانستم که این کتاب را بخرم", status: correct}
    feedback: "دیروز می‌تانستم که این کتاب را بخرم means yesterday I could buy this book."
  prs.b1.unit01.lesson03.exercise07.write_past_ability:
    instruction: "Write in Dari: Yesterday I could not go to the office."
    accepted_answers:
      - {value: "دیروز نتانستم که به دفتر بروم", status: correct}
    feedback: "دیروز نتانستم که به دفتر بروم means yesterday I could not go to the office."

  prs.b1.unit01.lesson04.exercise01.comprehend_dialogue:
    instruction: "Why didn't Zarmina go to the ID office yesterday?"
    correct_option: "She didn't have time"
    distractors: ["The office was closed", "She was sick", "Homayoun asked her not to"]
    accepted_answers: [{value: "She didn't have time", status: correct}]
    feedback: "Zarmina says وقت نداشتم (I didn't have time)."
  prs.b1.unit01.lesson04.exercise02.recognize_posta:
    instruction: "What does this word mean?"
    correct_option: "post office"
    distractors: ["ID office", "doctor's office", "shop"]
    accepted_answers: [{value: "post office", status: correct}]
    feedback: "پسته خانه means post office."
  prs.b1.unit01.lesson04.exercise03.order_mitani_nama:
    instruction: "Put the words in order: Can you take this letter to the post office?"
    accepted_answers:
      - {value: "می‌تانی که این نامه را به پسته خانه ببری؟", status: correct}
    feedback: "می‌تانی که این نامه را به پسته خانه ببری؟ means can you take this letter to the post office?"
  prs.b1.unit01.lesson04.exercise04.match_dialogue_words:
