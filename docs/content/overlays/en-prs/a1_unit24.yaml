  notes: '2026-07-10 fresh-context review (Claude), paired with the realization file review. Found and fixed the two bugs documented in the realization file''s review notes: (1) all 5 forward translation exercises'' instructions rewritten to name the specific English sentence (previously bare "Translate into Dari." with an empty prompt). (2) lesson06.exercise06.translate_wrap converted from a wrongly-typed, doubly-broken exercise (type: translation with an English accepted_answers value, a bare "Translate into English." instruction, and no visible source text) into a normal English-to-Dari translation exercise consistent with the rest of the unit ("Translate into Dari: I go by bicycle.", accepted_answers now با دوچرخه می‌روم / با دوچرخه می‌روم.). Confirmed no same-speaker dialogue-distractor violation on the lesson04 comprehension exercise. Re-validated clean (0 errors/0 warnings) after fixes.'
course:
  title: Dari A1
  description: 'Beginner Kabul Dari: transportation vocabulary (bus, taxi, car, bicycle, on foot), saying how you get somewhere, buying a ticket, and a Zarmina/Homayoun dialogue comparing commute options.'
units:
  prs.a1.unit24.transportation:
    title: Transportation
    description: Talk about how you get around town, buy a ticket, and ask which transport to take.
lessons:
  prs.a1.unit24.lesson01.transport_vocabulary:
    title: Transport words
  prs.a1.unit24.lesson02.how_you_go:
    title: How you go
  prs.a1.unit24.lesson03.buying_a_ticket:
    title: Buying a ticket
  prs.a1.unit24.lesson04.commute_dialogue:
    title: Commute dialogue
  prs.a1.unit24.lesson05.reading_commute:
    title: Reading about commuting
  prs.a1.unit24.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit24.lesson01.teach.bus:
    title: Bus
    gloss: bus
    note: بس means bus.
    example_gloss: The bus is coming.
  prs.a1.unit24.lesson01.teach.taxi:
    title: Taxi
    gloss: taxi
    note: تکسی means taxi.
    example_gloss: I take a taxi.
  prs.a1.unit24.lesson01.teach.car:
    title: Car
    gloss: car
    note: موتر means car -- the common colloquial Afghan Dari term, not the more formal ماشین.
    example_gloss: I have a car.
  prs.a1.unit24.lesson01.teach.bicycle:
    title: Bicycle
    gloss: bicycle
    note: دوچرخه means bicycle.
    example_gloss: I have a bicycle.
  prs.a1.unit24.lesson01.teach.on_foot:
    title: On foot
    gloss: on foot / walking
    note: پیاده means on foot or walking.
    example_gloss: I go on foot.
  prs.a1.unit24.lesson01.teach.review_miravam:
    title: I go
    gloss: I go
    note: می‌روم means "I go" (already introduced earlier in the course).
    example_gloss: I go on foot.
  prs.a1.unit24.lesson02.teach.ba:
    title: By/with
    gloss: by/with
    note: با is the instrumental preposition, used for "by [transport]."
    example_gloss: I go by bus.
  prs.a1.unit24.lesson02.teach.ba_bus:
    title: I go by bus
    gloss: I go by bus.
    note: با بس می‌روم means "I go by bus."
  prs.a1.unit24.lesson02.teach.ba_taxi:
    title: I go by taxi
    gloss: I go by taxi.
    note: با تکسی می‌روم means "I go by taxi."
  prs.a1.unit24.lesson02.teach.chetor:
    title: How
    gloss: how
    note: چطور means how.
    example_gloss: How do you go?
  prs.a1.unit24.lesson02.teach.chetor_miravi:
    title: How do you go?
    gloss: How do you go?
    note: A common question asking someone's mode of transport.
  prs.a1.unit24.lesson03.teach.ticket:
    title: Ticket
    gloss: ticket
    note: تکت means ticket, a common everyday loanword.
    example_gloss: I buy a ticket.
  prs.a1.unit24.lesson03.teach.station:
    title: Station
    gloss: station/stop
    note: ایستگاه means station or stop.
    example_gloss: Where is the bus station?
  prs.a1.unit24.lesson03.teach.ticket_price_q:
    title: How much is the ticket?
    gloss: How much is the ticket?
    note: A common question when buying a ticket.
  prs.a1.unit24.lesson03.teach.review_khoram:
    title: I buy
    gloss: I buy
    note: می‌خرم means "I buy" (already introduced earlier in the course).
    example_gloss: I buy a ticket.
  prs.a1.unit24.lesson04.teach.dialogue_line1:
    title: 'Zarmina: How do you get to town?'
    gloss: 'Zarmina: Homayoun, how do you get to town?'
    note: شهر means city/town, new in this line.
  prs.a1.unit24.lesson04.teach.dialogue_line2:
    title: 'Homayoun: I walk, it is near'
    gloss: 'Homayoun: I go on foot, it is near. How do you go?'
    note: نزدیک means near, new in this line.
  prs.a1.unit24.lesson04.teach.dialogue_line3:
    title: 'Zarmina: I go by taxi, it is direct and fast'
    gloss: 'Zarmina: I go by taxi, it is direct and fast.'
    note: تیز means fast, new in this line.
  prs.a1.unit24.lesson04.teach.dialogue_line4:
    title: 'Homayoun: The bus is good too, it is cheap'
    gloss: 'Homayoun: The bus is good too, it is cheap.'
    note: ارزان means cheap, new in this line.
  prs.a1.unit24.lesson04.teach.dialogue_line5:
    title: 'Zarmina: Yes, but the taxi is faster'
    gloss: 'Zarmina: Yes, but the taxi is faster.'
    note: اما means "but"; تیزتر is the comparative "faster."
  prs.a1.unit24.lesson05.teach.reading_passage:
    title: Reading about commuting
    gloss: Zarmina goes to town by taxi every day. The taxi is fast, but it is not cheap. Homayoun walks, because his house is near. He saves money for a car.
    note: A short reading passage recapping the unit's vocabulary and the "چون" (because) connector.
  prs.a1.unit24.lesson06.teach.review_dochakhe:
    title: Bicycle (review)
    gloss: bicycle
    note: دوچرخه means bicycle (review from lesson01).
    example_gloss: I go by bicycle.
  prs.a1.unit24.lesson06.teach.wrap_summary:
    title: I walk or take the bus every day
    gloss: I go on foot or by bus every day.
    note: یا means "or," new in this closing summary sentence.
