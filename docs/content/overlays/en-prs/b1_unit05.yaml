course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: reporting what someone said or asked using
    گفت که (said that) and پرسید (که) (asked whether/what), across a
    workplace-news scenario.

units:
  prs.b1.unit05.reported_speech:
    title: Reported Speech
    description: Report what someone else said or asked, using an embedded reported-speech clause.

lessons:
  prs.b1.unit05.lesson01.present_report_1st2nd:
    title: "I said / you said"
  prs.b1.unit05.lesson02.present_report_all_persons:
    title: "All the persons"
  prs.b1.unit05.lesson03.reported_questions:
    title: "He/she asked"
  prs.b1.unit05.lesson04.dialogue_manager_news:
    title: "The manager's news"
  prs.b1.unit05.lesson05.reading_manager_news:
    title: "Today's news"
  prs.b1.unit05.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit05.lesson01.teach.goftam:
    title: "I said"
    gloss: "I said"
    note: "*گفتم* is the 1st person simple past of *گفتن* (to say)."
    example_gloss: "I said that I'm coming tomorrow."
  prs.b1.unit05.lesson01.teach.grammar_goft_ke:
    title: "گفت که reports a statement"
    gloss: "گفت که + clause reports what someone said"
    note: "Unlike English (which backshifts tense: \"she said she WOULD come\"), Dari keeps the clause's own natural tense: *گفتم که فردا می‌آیم* = I said that I'm coming tomorrow -- می‌آیم stays present, it doesn't change."
  prs.b1.unit05.lesson01.teach.gofti:
    title: "You said"
    gloss: "you said"
    note: "*گفتی* is the 2nd person singular form."
    example_gloss: "Did you say that you're coming tomorrow?"
  prs.b1.unit05.lesson01.teach.review_farda:
    title: Tomorrow
    gloss: tomorrow
    note: "*فردا* means tomorrow."
    example_gloss: "I'm coming tomorrow."
  prs.b1.unit05.lesson01.teach.review_miayam:
    title: "I come"
    gloss: "I come"
    note: "*می‌آیم* is the 1st person present of *آمدن* (to come)."
    example_gloss: "I said that I'm coming tomorrow."
  prs.b1.unit05.lesson01.teach.review_miayi:
    title: "You come"
    gloss: "you come"
    note: "*می‌آیی* is the 2nd person singular form."
    example_gloss: "Did you say that you're coming tomorrow?"

  prs.b1.unit05.lesson02.teach.goft:
    title: "He/she said"
    gloss: "he/she said"
    note: "*گفت* is the 3rd person singular form."
    example_gloss: "Homayoun said that he's coming tomorrow."
  prs.b1.unit05.lesson02.teach.goftim:
    title: "We said"
    gloss: "we said"
    note: "*گفتیم* is the 1st person plural form."
    example_gloss: "We said that we're coming tomorrow."
  prs.b1.unit05.lesson02.teach.goftid:
    title: "You (pl./polite) said"
    gloss: "you (plural/polite) said"
    note: "*گفتید* is the 2nd person plural/polite form."
    example_gloss: "Did you say that you're coming tomorrow?"
  prs.b1.unit05.lesson02.teach.goftand:
    title: "They said"
    gloss: "they said"
    note: "*گفتند* is the 3rd person plural form."
    example_gloss: "They said that they're coming tomorrow."
  prs.b1.unit05.lesson02.teach.grammar_agreement:
    title: "All six persons"
    gloss: "گفتم، گفتی، گفت، گفتیم، گفتید، گفتند -- the same م/ی/-/یم/ید/ند person endings as other simple-past verbs"
    note: "The embedded clause's own verb (می‌آید، می‌آییم، می‌آیند) agrees with ITS OWN subject, which is often a different person than گفت's subject."
  prs.b1.unit05.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "*همایون* -- an established recurring character in this course."
    example_gloss: "Homayoun said that he's coming tomorrow."
  prs.b1.unit05.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "*زرمینه* -- an established recurring character in this course."
    example_gloss: "Zarmina said that she's coming tomorrow."
  prs.b1.unit05.lesson02.teach.review_anha:
    title: They
    gloss: they
    note: "*آنها* means they."
    example_gloss: "They said that they're coming tomorrow."
  prs.b1.unit05.lesson02.teach.ma:
    title: We
    gloss: we
    note: "*ما* means we."
    example_gloss: "We said that we're coming tomorrow."

  prs.b1.unit05.lesson03.teach.porsid:
    title: "He/she asked"
    gloss: "he/she asked"
    note: "*پرسید* is the 3rd person simple past of *پرسیدن* (to ask)."
    example_gloss: "He/she asked when you're coming."
  prs.b1.unit05.lesson03.teach.porsidam:
    title: "I asked"
    gloss: "I asked"
    note: "*پرسیدم* is the 1st person simple past form."
    example_gloss: "I asked when he/she is coming."
  prs.b1.unit05.lesson03.teach.che_vaqt:
    title: "When / what time"
    gloss: "when / what time"
    note: "*چه وقت* means when/what time -- used instead of the ambiguous *کی* (which can also mean \"who\")."
    example_gloss: "When are you coming?"
  prs.b1.unit05.lesson03.teach.grammar_reported_question:
    title: "پرسید reports a question"
    gloss: "پرسید (که) + a question reports what someone asked, wh- or yes/no"
    note: "Both a wh-question (*پرسید که چه وقت می‌آیی؟* = he/she asked when you're coming) and a yes/no question (*پرسید که می‌آیی؟* = he/she asked whether you're coming) embed the same way, directly after که, with no extra \"if/whether\" word needed like English uses."

  prs.b1.unit05.lesson04.teach.modir:
    title: Manager
    gloss: manager
    note: "*مدیر* means manager."
    example_gloss: "What did the manager say today?"
  prs.b1.unit05.lesson04.teach.che_goft:
    title: "What did [he/she] say?"
    gloss: "what did [he/she] say?"
    note: "*چه گفت* asks what someone said."
    example_gloss: "What did the manager say today?"
  prs.b1.unit05.lesson04.teach.yek:
    title: "One / a"
    gloss: "one / a"
    note: "*یک* means one/a."
    example_gloss: "A guest is coming."
  prs.b1.unit05.lesson04.teach.mehman:
    title: Guest
    gloss: guest
    note: "*مهمان* means guest."
    example_gloss: "An important guest is coming."
  prs.b1.unit05.lesson04.teach.mohem:
    title: Important
    gloss: important
    note: "*مهم* means important."
    example_gloss: "An important guest is coming."
  prs.b1.unit05.lesson04.teach.chizi:
    title: "Something / anything"
    gloss: "something / anything"
    note: "*چیزی* means something/anything."
    example_gloss: "Did you ask anything?"
  prs.b1.unit05.lesson04.teach.sobh:
    title: Morning
    gloss: morning
    note: "*صبح* means morning."
    example_gloss: "He's coming in the morning."
  prs.b1.unit05.lesson04.teach.review_bayad:
    title: "Must / should"
    gloss: "must / should"
    note: "*باید* is an invariant modal particle."
    example_gloss: "I should come early."
  prs.b1.unit05.lesson04.teach.review_zud:
    title: "Early / soon"
    gloss: "early / soon"
    note: "*زود* means early/soon."
    example_gloss: "I should come early."
  prs.b1.unit05.lesson04.teach.biayam:
    title: "(that) I come"
    gloss: "(that) I come"
    note: "*بیایم* is the 1st person subjunctive of *آمدن*."
    example_gloss: "I should come early."
  prs.b1.unit05.lesson04.teach.review_bali:
    title: "Yes"
    gloss: "yes"
    note: "*بلی* means yes."
    example_gloss: "Yes, I asked."
  prs.b1.unit05.lesson04.teach.review_va:
    title: And
    gloss: and
    note: "*و* means and."
    example_gloss: "I asked, and he said he's coming in the morning."
  prs.b1.unit05.lesson04.teach.porsidi:
    title: "You asked"
    gloss: "you asked"
    note: "*پرسیدی* is the 2nd person simple past of *پرسیدن* (to ask)."
    example_gloss: "Did you ask anything?"
  prs.b1.unit05.lesson04.teach.dialogue_zarmina_ask:
    title: "Homayoun, what did the manager say today?"
    gloss: "Homayoun, what did the manager say today?"
    note: "Zarmina asks for the manager's news."
  prs.b1.unit05.lesson04.teach.dialogue_homayoun_report:
    title: "He said that an important guest is coming tomorrow."
    gloss: "He said that an important guest is coming tomorrow."
    note: "Homayoun reports the manager's statement."
  prs.b1.unit05.lesson04.teach.dialogue_zarmina_askmore:
    title: "Did you ask anything?"
    gloss: "Did you ask anything?"
    note: "Zarmina asks for more detail."
  prs.b1.unit05.lesson04.teach.dialogue_homayoun_answer:
    title: "Yes, I asked when he's coming, and he said he's coming in the morning."
    gloss: "Yes, I asked when he's coming, and he said he's coming in the morning."
    note: "Homayoun reports both his own question and the manager's answer."
  prs.b1.unit05.lesson04.teach.dialogue_zarmina_conclude:
    title: "I should come early."
    gloss: "I should come early."
    note: "Zarmina draws a conclusion from the news."

  prs.b1.unit05.lesson05.teach.sohbat_kard:
    title: Talked
    gloss: talked
    note: "*صحبت کرد* is the 3rd person simple past of *صحبت کردن* (to talk)."
    example_gloss: "Yesterday the manager talked with Homayoun."
  prs.b1.unit05.lesson05.teach.shenid:
    title: Heard
    gloss: heard
    note: "*شنید* is the 3rd person simple past of *شنیدن* (to hear)."
    example_gloss: "Zarmina heard too."
  prs.b1.unit05.lesson05.teach.review_ba:
    title: With
    gloss: with
    note: "*با* means with."
    example_gloss: "The manager talked with Homayoun."
  prs.b1.unit05.lesson05.teach.review_dirooz:
    title: Yesterday
    gloss: yesterday
    note: "*دیروز* means yesterday."
    example_gloss: "Yesterday the manager talked."
  prs.b1.unit05.lesson05.teach.review_ou:
    title: "He / she"
    gloss: "he / she"
    note: "*او* means he or she."
    example_gloss: "He said that he's coming tomorrow."
  prs.b1.unit05.lesson05.teach.review_ham:
    title: "Also / too"
    gloss: "also / too"
    note: "*هم* means also or too."
    example_gloss: "Zarmina heard too."
  prs.b1.unit05.lesson05.teach.reading_passage:
    title: "Today's news"
    gloss: "Yesterday the manager talked with Homayoun. He said that an important guest is coming tomorrow. Homayoun asked when he's coming, and the manager said he's coming in the morning. Zarmina heard too, and said that she's also coming early."
    note: "A short reading combining reported statements and reported questions, reusing this unit's established characters."

  prs.b1.unit05.lesson06.teach.grammar_review:
    title: "Review: reported statements and questions"
    gloss: "گفت که + clause reports a statement. پرسید (که) + a question reports a question, wh- or yes/no, embedded the same way."
    note: "Both keep the embedded clause's own natural tense -- Dari never backshifts like English does."
  prs.b1.unit05.lesson06.teach.emroz:
    title: Today
    gloss: today
    note: "*امروز* means today."
    example_gloss: "What did the manager say today?"

