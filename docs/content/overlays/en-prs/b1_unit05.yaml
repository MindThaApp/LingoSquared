    feedback: "*گفت که فردا یک مهمان مهم می‌آید.* means he said that an important guest is coming tomorrow."


  prs.b1.unit05.lesson05.exercise01.comprehend_talked_yesterday:
    instruction: "Did the manager talk with Homayoun yesterday, according to the reading?"
    correct_option: "Yes, they talked"
    distractors: ["No, they didn't talk", "No, they talked today", "No, Zarmina talked with him instead"]
