course:
  title: Dari A1
  description: "Beginner Kabul Dari: make and confirm a simple appointment by naming the service, day, and time -- ask who is free which day, offer and confirm a day and time, and read a short passage about a booked appointment."
units:
  prs.a1.unit42.appointments:
    title: Making an appointment
    description: Ask which day someone is free, name a service, offer and confirm a day and time, and read a short passage about a booked appointment.
lessons:
  prs.a1.unit42.lesson01.appointment_vocabulary:
    title: Appointment vocabulary
  prs.a1.unit42.lesson02.asking_availability:
    title: Asking which day is free
  prs.a1.unit42.lesson03.making_the_appointment:
    title: Making the appointment
  prs.a1.unit42.lesson04.dentist_appointment_dialogue:
    title: Dentist appointment dialogue
  prs.a1.unit42.lesson05.reading:
    title: Reading about the appointment
  prs.a1.unit42.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit42.lesson01.teach.review_appointment_doctor_have:
    title: "Review: appointment, doctor, I have, is"
    gloss: appointment / doctor / I have / is
    note: "قرار (from unit11), داکتر (from unit17), دارم, and است are review words used to talk about an appointment."
  prs.a1.unit42.lesson01.teach.review_want_one:
    title: "Review: I want, a/one"
    gloss: I want / a / one
    note: "می‌خواهم (from unit17) and یک (from unit04) combine to say what you want."
  prs.a1.unit42.lesson01.teach.tooth_word:
    title: Tooth
    gloss: tooth
    note: "دندان is the standard Dari word for tooth."
    example_gloss: I have a tooth.
  prs.a1.unit42.lesson01.teach.dentist_phrase:
    title: Dentist
    gloss: dentist
    note: "داکتر دندان literally means \"tooth doctor,\" the standard Afghan Dari word for a dentist."
  prs.a1.unit42.lesson01.teach.want_appointment_phrase:
    title: I want an appointment
    gloss: I want an appointment.
    note: "یک قرار می‌خواهم combines یک (a/one), قرار (appointment), and می‌خواهم (I want)."
  prs.a1.unit42.lesson01.teach.review_with:
    title: "Review: with"
    gloss: with
    note: "با (from unit24) means with."
  prs.a1.unit42.lesson01.teach.want_appointment_dentist_phrase:
    title: I want an appointment with the dentist
    gloss: I want an appointment with the dentist.
    note: "با داکتر دندان (with the dentist) is added to یک قرار می‌خواهم."
  prs.a1.unit42.lesson02.teach.review_which_day:
    title: "Review: which, day"
    gloss: which / day
    note: "کدام (from unit14) and روز (from unit09) are review words used to ask about a day."
  prs.a1.unit42.lesson02.teach.review_free_are:
    title: "Review: free, you are (polite)"
    gloss: free / you are (polite)
    note: "آزاد (from unit26) and استین (from unit01) combine to ask if someone is free."
  prs.a1.unit42.lesson02.teach.which_day_free_phrase:
    title: Which day are you free?
    gloss: Which day are you free?
    note: "کدام روز آزاد استین؟ asks which day someone is available."
  prs.a1.unit42.lesson02.teach.review_monday_am:
    title: "Review: Monday, I am"
    gloss: Monday / I am
    note: "دوشنبه (from unit09) and استم are review words used to answer."
  prs.a1.unit42.lesson02.teach.day_free_answer_phrase:
    title: I'm free Monday
    gloss: I'm free Monday.
    note: "دوشنبه آزاد استم answers the question with a specific day."
  prs.a1.unit42.lesson02.teach.review_hour_what:
    title: "Review: hour/o'clock, what"
    gloss: "hour / o'clock / what"
    note: "ساعت and چند (both from unit09/unit11) combine to ask about a time."
  prs.a1.unit42.lesson02.teach.what_time_free_phrase:
    title: What time are you free?
    gloss: What time are you free?
    note: "ساعت چند آزاد استین؟ asks what time someone is available."
  prs.a1.unit42.lesson03.teach.review_want_appointment:
    title: "Review: I want, appointment"
    gloss: I want / appointment
    note: "می‌خواهم and قرار are review words used to ask for an appointment."
  prs.a1.unit42.lesson03.teach.get_word:
    title: Get / take
    gloss: get / take
    note: "بگیرم is the subjunctive form (\"that I get/take\"), used with می‌خواهم to say \"I want to get.\""
    example_gloss: I want to get an appointment.
  prs.a1.unit42.lesson03.teach.for_word:
    title: For
    gloss: for
    note: "برای means for."
    example_gloss: For the dentist.
  prs.a1.unit42.lesson03.teach.review_ten_how:
    title: "Review: ten, how"
    gloss: ten / how
    note: "ده (from unit04) and چطور are review words used to offer a time."
  prs.a1.unit42.lesson03.teach.confirm_time_phrase:
    title: How about Monday at ten?
    gloss: How about Monday at ten?
    note: "دوشنبه ساعت ده چطور است؟ offers a specific day and time."
  prs.a1.unit42.lesson03.teach.review_very_good:
    title: "Review: very, good"
    gloss: very / good
    note: "بسیار (from unit09/unit11) and خوب are review words used to confirm a time."
  prs.a1.unit42.lesson03.teach.confirm_answer_phrase:
    title: That's very good
    gloss: That's very good.
    note: "بسیار خوب است confirms that the offered time works."
  prs.a1.unit42.lesson04.teach.review_greeting_want:
    title: "Review: hello, I want"
    gloss: hello / I want
    note: "سلام and می‌خواهم are review words used in the dialogue."
  prs.a1.unit42.lesson04.teach.review_thanks_welcome:
    title: "Review: thanks a lot, you're welcome"
    gloss: thanks a lot / you're welcome
    note: "تشکر زیاد (from unit01/unit40) and خواهش می‌کنم are review words used in the dialogue."
  prs.a1.unit42.lesson04.teach.receptionist_word:
    title: Receptionist
    gloss: receptionist
    note: "منشی means secretary/receptionist, the person who answers the phone at a doctor's or dentist's office."
    example_gloss: I am a receptionist.
  prs.a1.unit42.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want to get an appointment with the dentist."
    gloss: Hello. I want to get an appointment with the dentist.
  prs.a1.unit42.lesson04.teach.dialogue_line2:
    title: "Receptionist: Hello. Which day are you free?"
    gloss: Hello. Which day are you free?
  prs.a1.unit42.lesson04.teach.dialogue_line3:
    title: "Homayoun: I'm free Monday."
    gloss: I'm free Monday.
  prs.a1.unit42.lesson04.teach.dialogue_line4:
    title: "Receptionist: Very good. How about Monday at ten?"
    gloss: Very good. How about Monday at ten?
  prs.a1.unit42.lesson04.teach.dialogue_line5:
    title: "Homayoun: That's very good. Thanks a lot."
    gloss: That's very good. Thanks a lot.
  prs.a1.unit42.lesson04.teach.dialogue_line6:
    title: "Receptionist: You're welcome."
    gloss: You're welcome.
  prs.a1.unit42.lesson05.teach.review_he_she_has:
    title: "Review: Homayoun, he/she, he/she has"
    gloss: Homayoun / he/she / he/she has
    note: "همایون (from unit09/unit11/unit16/unit20-unit41), او (from unit03), and دارد are review words used in the reading passage."
  prs.a1.unit42.lesson05.teach.reading_passage:
    title: Reading about the appointment
    gloss: "Homayoun has an appointment. His appointment is with the dentist. His appointment is Monday. His appointment is at ten. Homayoun is happy."
  prs.a1.unit42.lesson06.teach.review_wrap_up_words:
    title: "Review: I don't have, but, you (formal)"
    gloss: "I don't have / but / you (formal)"
    note: "ندارم, اما, and شما (from unit03/unit14/unit28/unit32/unit39/unit40/unit41) are review words used to contrast two days."
  prs.a1.unit42.lesson06.teach.review_tuesday:
    title: "Review: Tuesday"
    gloss: Tuesday
    note: "سه‌شنبه (from unit09) is a review word."
  prs.a1.unit42.lesson06.teach.contrast_phrase:
    title: I have an appointment Monday, but not Tuesday
    gloss: I have an appointment Monday, but I don't have one Tuesday.
    note: "اما contrasts having an appointment Monday with not having one Tuesday."
  prs.a1.unit42.lesson06.teach.formal_question_phrase:
    title: Which day are you free?
    gloss: Which day are you free?
    note: "The formal شما-prefixed version of asking which day someone is free."
