course:
  title: Dari A1
  description: 'Beginner Kabul Dari: technology and device vocabulary (mobile phone, computer, internet, app, photo), phone-action phrases (send a message, call, take a photo, download an app), asking and answering how many times a day you use your mobile phone, and a Zarmina/Homayoun dialogue about phone, computer, and internet use.'
units:
  prs.a1.unit30.technology:
    title: Technology
    description: Talk about phones, computers, the internet, and apps -- and how often you use them.
lessons:
  prs.a1.unit30.lesson01.device_vocabulary:
    title: Technology words
  prs.a1.unit30.lesson02.phone_actions:
    title: Phone actions
  prs.a1.unit30.lesson03.frequency_question:
    title: How many times a day?
  prs.a1.unit30.lesson04.tech_dialogue:
    title: Technology dialogue
  prs.a1.unit30.lesson05.reading_technology:
    title: Reading about technology
  prs.a1.unit30.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit30.lesson01.teach.tech_word:
    title: Technology
    gloss: technology
    note: تکنالوژی means technology -- the genuine Afghan-government-standard spelling (verified against Afghanistan's own Ministry of Communications and Information Technology), distinct from the Iranian تکنولوژی spelling.
    example_gloss: Technology is good.
  prs.a1.unit30.lesson01.teach.mobile_word:
    title: Mobile phone
    gloss: mobile phone
    note: موبایل means mobile phone, distinct from the more general تلفن (telephone, review from unit07).
    example_gloss: I have a mobile phone.
  prs.a1.unit30.lesson01.teach.computer_word:
    title: Computer
    gloss: computer
    note: کمپیوتر means computer, a standard shared Persian/Dari loanword.
    example_gloss: The computer is at the office.
  prs.a1.unit30.lesson01.teach.internet_word:
    title: Internet
    gloss: internet
    note: انترنت means internet, a standard shared Persian/Dari loanword.
    example_gloss: The internet is slow.
  prs.a1.unit30.lesson01.teach.app_word:
    title: App
    gloss: app
    note: اپلیکیشن means app (application), a standard shared Persian/Dari loanword.
    example_gloss: This app is good.
  prs.a1.unit30.lesson01.teach.photo_word:
    title: Photo
    gloss: photo
    note: عکس means photo or picture.
    example_gloss: This photo is good.
  prs.a1.unit30.lesson01.teach.review_estefade_kardan:
    title: To use
    gloss: use + to do → I use
    note: استفاده (use) combines with کردن (to do, review) to make استفاده می‌کنم (I use) -- the same light-verb pattern already used throughout this course, e.g. بازی می‌کنم (unit29) and ورزش می‌کنم (unit29).
  prs.a1.unit30.lesson01.teach.combined_sentence:
    title: I use the internet
    gloss: I use the internet.
    note: Combines من (I, review), از (from/using, review), انترنت, and استفاده می‌کنم.
  prs.a1.unit30.lesson02.teach.review_peyam:
    title: Message
    gloss: message
    note: پیام (review from unit07) means message.
  prs.a1.unit30.lesson02.teach.mifrestam_phrase:
    title: I send a message
    gloss: I send a message
    note: می‌فرستم means "I send" -- a new verb, distinct from the unit07 message verb بگذارم (to leave a message).
  prs.a1.unit30.lesson02.teach.review_zang_mizanam:
    title: I call
    gloss: I call
    note: زنگ می‌زنم (review from unit07) means "I call."
  prs.a1.unit30.lesson02.teach.akas_migiram_phrase:
    title: I take a photo
    gloss: I take a photo
    note: عکس می‌گیرم reuses می‌گیرم (I take/receive, review from unit23) applied to عکس.
  prs.a1.unit30.lesson02.teach.download_word:
    title: Download
    gloss: download
    note: دانلود is the standard Dari loanword for "download," combined with کردن (to do, review) as a light verb, e.g. دانلود می‌کنم (I download).
    example_gloss: I download this app.
  prs.a1.unit30.lesson02.teach.want_download_app_phrase:
    title: I want to download an app
    gloss: I want to download an app
    note: Follows the same می‌خواهم + subjunctive pattern as unit07's می‌خواهم یک پیام بگذارم (I want to leave a message).
  prs.a1.unit30.lesson03.teach.review_chand_bar:
    title: How many / time
    gloss: how many / time (occurrence)
    note: چند بار (review from unit29) is used here to ask about frequency.
  prs.a1.unit30.lesson03.teach.review_ruz:
    title: Day
    gloss: day
    note: روز (review from unit12) means day.
  prs.a1.unit30.lesson03.teach.review_mikonin:
    title: You use (formal)
    gloss: you use (formal)
    note: استفاده می‌کنین is the formal "you use," matching the ورزش می‌کنین pattern from unit29.
  prs.a1.unit30.lesson03.teach.question_frequency:
    title: How many times a day do you use your mobile phone?
    gloss: How many times a day do you use your mobile phone?
    note: Combines چند بار (how many times), در روز (per day), از موبایل (using the mobile phone), and استفاده می‌کنین.
  prs.a1.unit30.lesson03.teach.answer_har_ruz:
    title: I use the internet every day
    gloss: I use the internet every day.
    note: هر روز (review from unit12) combines with از انترنت استفاده می‌کنم.
  prs.a1.unit30.lesson04.teach.review_mikonad:
    title: He/she uses
    gloss: he/she uses
    note: استفاده می‌کند is the 3rd person form, matching the می‌کند pattern reviewed in unit29.
  prs.a1.unit30.lesson04.teach.review_to_miokni:
    title: You (informal) / you use (informal)
    gloss: you (informal) / you use (informal)
    note: تو and می‌کنی (review from unit26/unit29) are the informal register used between Homayoun and Zarmina.
  prs.a1.unit30.lesson04.teach.review_koja:
    title: Where
    gloss: where
    note: کجا (review from unit05) means where.
  prs.a1.unit30.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, how many times a day do you use your mobile phone?'
    gloss: 'Zarmina, how many times a day do you use your mobile phone?'
  prs.a1.unit30.lesson04.teach.dialogue_line2:
    title: 'Zarmina: I use my mobile phone a lot. I take photos and send messages.'
    gloss: I use my mobile phone a lot. I take photos and send messages.
  prs.a1.unit30.lesson04.teach.dialogue_line3:
    title: 'Homayoun: Do you use a computer?'
    gloss: Do you use a computer?
  prs.a1.unit30.lesson04.teach.dialogue_line4:
    title: 'Zarmina: Yes, I use a computer at the office.'
    gloss: Yes, I use a computer at the office.
  prs.a1.unit30.lesson04.teach.dialogue_line5:
    title: 'Homayoun: I use the internet every day.'
    gloss: I use the internet every day.
  prs.a1.unit30.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Great!'
    gloss: Great!
  prs.a1.unit30.lesson05.teach.reading_passage:
    title: Reading about technology
    gloss: 'Zarmina uses her mobile phone every day. She takes photos and sends messages. Homayoun uses a computer at the office and uses the internet every day.'
  prs.a1.unit30.lesson06.teach.review_ama:
    title: But
    gloss: but
    note: اما (review from unit24/unit29) means but.
  prs.a1.unit30.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have
    gloss: I like / time / I don't have
    note: دوست دارم (I like), وقت (time), and ندارم (I don't have) are all review from unit11/unit14/unit26/unit29.
  prs.a1.unit30.lesson06.teach.wrap_summary:
    title: I like technology, but I don't have time
    gloss: "I like technology, but I don't have time."
    note: Combines تکنالوژی را دوست دارم (I like technology, review construction) with اما وقت ندارم (but I don't have time).
