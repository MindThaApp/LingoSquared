    distractors: ['Where?', 'Every day.', 'Yes.']
    feedback: عالی است means "Great!"
    accepted_answers:
      - {value: Great!, status: correct}
  prs.a1.unit30.lesson04.exercise04.match_dialogue_words:
    instruction: Match each word or phrase to its meaning.
    accepted_answers:
      - value:
          زرمینه، تو چند بار در روز از موبایل استفاده می‌کنی؟: 'Zarmina, how many times a day do you use your mobile phone?'
