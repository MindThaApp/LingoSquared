    feedback: من هر روز از انترنت استفاده می‌کنم means "I use the internet every day."
    accepted_answers:
      - {value: 'I use the internet every day.', status: correct}
  prs.a1.unit30.lesson03.exercise04.match_frequency_words:
    instruction: Match each word or phrase to its meaning.
    accepted_answers:
      - value:
          چند: 'how many'
          بار: 'time (occurrence)'
