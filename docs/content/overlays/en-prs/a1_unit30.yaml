          تو از کمپیوتر استفاده می‌کنی؟: 'Do you use a computer?'
          بلی، در دفتر از کمپیوتر استفاده می‌کنم.: 'Yes, I use a computer at the office.'
          من هر روز از انترنت استفاده می‌کنم.: 'I use the internet every day.'
          عالی است!: 'Great!'
          کجا: where
  prs.a1.unit30.lesson04.exercise05.order_dialogue_line2_first_clause:
    instruction: Put the words in the correct order.
    accepted_answers: ['من زیاد از موبایل استفاده می‌کنم']
