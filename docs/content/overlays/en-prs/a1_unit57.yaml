  notes: "2026-07-10 fresh-context review (Claude): checked against the full checklist (same-speaker-distractor risk in multiple_choice/dialogue_response, stray YAML boolean coercion, untaught vocabulary via the compiler, matching_pairs/word_order answer-shape correctness, cross-lesson fact consistency, internal-jargon leaks, Dari translation/register/script correctness, and exercise-type registration against ExerciseRenderer.tsx) -- no real bugs found in this unit. No listen_select/listen_type/dialogue_comprehension exercises exist in this file (prs has zero TTS/audio coverage per AUTHORING_GUIDE.md #14), so the same-speaker-distractor bug class doesn't structurally arise; every multiple_choice item shows the literal Dari text being translated, not audio, so distractor overlap with other same-speaker lines elsewhere in the dialogue can't create ambiguity the way it does for listen_select. matching_pairs accepted_answers use the established flat-dict shape and word_order accepted_answers use the established space-joined-string shape, both of which the compiler/grade() already canonicalize correctly. Compiler validation (grouped with the rest of the prs A1 corpus, per course-level Course-row scoping) is clean: 0 errors, 0 warnings. Re-verified against the file's own original self-report below, which is accurate. Authored with prs a1_unit57_beach.yaml for en-prs only. Firecrawl was retried fresh (`firecrawl search`) and again returned HTTP 402 (0 credits), so the shared scratchpad's already-cached DLI Dari corpus was searched instead. Found one genuine, real attestation: ریگ (sand) appears in DLI Semester 3 Book 1's own numbered vocabulary key alongside a real worked spendthrift idiom ('I used to spend money like sand'). No direct beach/coast scenario exists anywhere in the corpus (Afghanistan is landlocked; the DLI/Peace Corps materials are daily-life/hotel/travel-focused, not coastal-recreation-focused) -- honestly disclosed rather than overclaiming source attestation. ساحل (beach/shore), موج (wave), and چتر (umbrella) are authored from established Persian/Dari conventions: all three are basic, high-frequency, dialect-neutral vocabulary shared identically with Iranian Farsi, no register/dialect-divergence risk. چتر آفتابی ('sun/beach umbrella') is a genuine natural Persian/Dari compound, built by combining چتر with this course's own already-established آفتابی ('sunny,' unit22 weather) rather than inventing an unrelated adjective. Cultural-authenticity note: since Afghanistan is landlocked, this unit deliberately frames ساحل generically as a sandy lake/river shore (a real, common Kabul-area day-trip context) rather than an ocean beach, without naming any specific unverified location. Four new content words: ساحل, ریگ (DLI-attested), موج, چتر. شنا (swimming) is correctly REVIEW, not new -- already established in unit29 (sports) with the identical شنا-plus-light-verb pattern reused here, confirmed by grepping the full prs corpus for all five candidate words before authoring. No new grammar beyond ordinary recombination: می‌خواهم X کنم (unit23), شنا می‌کنم-family (unit29), می‌خواهی (unit55), برویم (unit13), کرد (unit20), and the -تان formal-possessive suffix (unit39-56) are all reused. Everything else reuses this course's own established vocabulary: این/است/در/خوب (multiple early units), باز/بسته (unit50), از/تا/هفت/پنج/صبح/شب/ساعت (unit01/unit04/unit08), آب (unit08), امروز/دارد (unit17/multiple units), هوا/آفتابی (unit22), بلی/عالی/بسیار خوب (multiple units), یا/میله (unit01/unit08/unit55), بود/او/به/رفت (multiple units), دوست/دارم/را/اما (unit03/unit14/unit26/unit29), کجاست (unit50). No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit. Dialogue content uses structured speakers in the realization, not embedded speaker labels. Lesson04's multiple_choice distractors were checked against the standing same-speaker-distractor rule: every distractor for a tested همایون line is drawn only from زرمینه's three lines, and vice versa -- no exercise draws a distractor from the same character's other lines. This task did not open any fa/a1_unit* file at any point -- fa and prs are separate realizations per universal_spine.yaml's own explicit invariant, and every vocabulary/register choice here was made independently."
course:
  title: Dari A1
  description: "Beginner Kabul Dari: describe a day at the beach (sand, waves, swimming, a beach umbrella), read a beach sign, and propose a beach outing with a friend."
