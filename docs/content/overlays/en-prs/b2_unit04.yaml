    title: Narrative
    description: Recount complex events with background, interruption, and earlier past.
lessons:
  prs.b2.unit04.narrative.lesson01.background:
    title: Narrative background
  prs.b2.unit04.narrative.lesson02.earlier:
    title: Before the event
  prs.b2.unit04.narrative.lesson03.interruption:
    title: Interruption
teaching:
  prs.b2.unit04.narrative.lesson01.background.teach.card01:
    title: when it was raining
    gloss: when it was raining
    note: '*وقتی باران می‌بارید* sets background with an ongoing past action before the main event advances.'
    example_gloss: When it was raining, the courtyard was empty.
  prs.b2.unit04.narrative.lesson01.background.teach.card02:
    title: exhibition
    gloss: exhibition
    note: '*نمایشگاه* is the event being narrated; keep it as the school exhibition, not a shop display.'
    example_gloss: The students’ exhibition was full of photos.
  prs.b2.unit04.narrative.lesson01.background.teach.card03:
    title: school
    gloss: school
    note: '*مکتب* is Afghan Dari for school and fits the Mazar classroom setting.'
    example_gloss: The school is near the mosque.
  prs.b2.unit04.narrative.lesson01.background.teach.card04:
    title: had just begun
    gloss: had just begun
    note: '*تازه آغاز شده بود* marks a state just established before another event, matching "had just begun."'
    example_gloss: The meeting had just begun when the power went out.
  prs.b2.unit04.narrative.lesson01.background.teach.card05:
    title: background
    gloss: background
    note: '*زمینه* names the background layer of a story, not the foreground incident.'
    example_gloss: He explained the background of the story slowly.
  prs.b2.unit04.narrative.lesson01.background.teach.card06:
    title: courtyard
    gloss: courtyard
    note: '*حویلی* is the courtyard area; it gives a physical scene for the narrative background.'
    example_gloss: The school courtyard had been planted with flowers.
  prs.b2.unit04.narrative.lesson01.background.teach.card07:
    title: rain
    gloss: rain
    note: '*باران* explains the conditions around the event without being the main plot move.'
    example_gloss: The rain softened the dust.
  prs.b2.unit04.narrative.lesson01.background.teach.card08:
    title: at that time
    gloss: at that time
    note: '*در همان وقت* links simultaneous actions, so it is useful when two past events overlap.'
    example_gloss: At that time, the principal entered the class.
  prs.b2.unit04.narrative.lesson01.background.teach.card09:
    title: students
    gloss: students
    note: '*شاگردان* identifies the actors in the school story; later verbs should match them as plural.'
    example_gloss: The students brought their handicrafts.
  prs.b2.unit04.narrative.lesson01.background.teach.grammar:
    title: Narrative grammar
    gloss: Narrative grammar
    note: '*وقتی* plus imperfect forms sets the background. The completed event then moves the story forward.'
  prs.b2.unit04.narrative.lesson02.earlier.teach.card01:
    title: before the guests arrived
    gloss: before the guests arrived
    note: '*پیش از رسیدن مهمانان* places one action before another past action without needing a second full clause.'
    example_gloss: Before the guests arrived, tea was ready.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card02:
    title: guests
    gloss: guests
    note: '*مهمانان* is plural; the narrative contrast depends on whether they had arrived yet.'
    example_gloss: The guests had come from Balkh Province.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card03:
    title: tables
    gloss: tables
    note: '*میزها* carries the plural marker *ها*, which pairs with plural preparation in the model sentence.'
    example_gloss: The tables were put beside the wall.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card04:
    title: had prepared
    gloss: had prepared
    note: '*آماده کرده بودند* is pre-past: the preparation was complete before the guests arrived.'
    example_gloss: They had prepared the program since morning.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card05:
    title: before / earlier
    gloss: before / earlier
    note: '*پیش* can mean before or earlier; add context so learners know which event it precedes.'
    example_gloss: Before the start, everyone was calm.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card06:
    title: classroom / class
    gloss: classroom / class
    note: '*صنف* can mean class or classroom; the exhibition context decides the English gloss.'
    example_gloss: The fifth class had drawn pictures.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card07:
    title: wall
    gloss: wall
    note: '*دیوار* anchors where photos and notices are placed, helping the timeline stay visual.'
    example_gloss: There was a map of Afghanistan on the wall.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card08:
    title: had not arrived yet
    gloss: had not arrived yet
    note: '*هنوز نرسیده بودند* combines "not yet" with past perfect, a clear signal that arrival came later.'
    example_gloss: The teachers had not arrived yet when the bell rang.
  prs.b2.unit04.narrative.lesson02.earlier.teach.card09:
    title: tea
    gloss: tea
    note: '*چای* is a prepared item in the scene; it helps show what had already been arranged.'
    example_gloss: Tea was ready for the guests.
  prs.b2.unit04.narrative.lesson02.earlier.teach.grammar:
    title: Narrative grammar
    gloss: Narrative grammar
    note: '*کرده بود* marks an action completed before another past moment. This keeps the timeline unambiguous.'
  prs.b2.unit04.narrative.lesson03.interruption.teach.card01:
    title: we were putting up the photos
    gloss: we were putting up the photos
    note: '*داشتیم عکس‌ها را می‌زدیم* shows an action in progress; the interruption comes after *که*.'
    example_gloss: We were putting up the photos when the principal called.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card02:
    title: photos
    gloss: photos
    note: '*عکس‌ها* is plural and takes *را* when it is the object being put up.'
    example_gloss: The photos were of village life.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card03:
    title: on the wall
    gloss: on the wall
    note: '*روی دیوار* is the location phrase; keep it before the verb phrase in the ordered sentence.'
    example_gloss: There was a new notice on the wall.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card04:
    title: suddenly the power went out
    gloss: suddenly the power went out
    note: '*ناگهان برق رفت* is the interrupting event; it should feel sudden, not like ordinary background.'
    example_gloss: Suddenly the power went out and the classroom became dark.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card05:
    title: interruption
    gloss: interruption
    note: '*قطع* names an interruption or cut-off, useful for explaining why the sequence changed.'
    example_gloss: The power interruption slowed the program.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card06:
    title: order
    gloss: order
    note: '*ترتیب* is the order of events; this unit tests chronology, not just vocabulary recall.'
    example_gloss: Tell the order of events again.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card07:
    title: later we realized that
    gloss: later we realized that
    note: '*بعد فهمیدیم که* introduces a later discovery; what follows explains the earlier interruption.'
    example_gloss: Later we realized that the generator had no fuel.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card08:
    title: generator
    gloss: generator
    note: '*جنراتور* gives the reason for the power problem, so it belongs in the later-explanation part.'
    example_gloss: The school generator is old.
  prs.b2.unit04.narrative.lesson03.interruption.teach.card09:
    title: dark
    gloss: dark
    note: '*تاریک* describes the result after the power went out, not a separate event in the timeline.'
    example_gloss: The classroom suddenly became dark.
  prs.b2.unit04.narrative.lesson03.interruption.teach.grammar:
    title: Narrative grammar
    gloss: Narrative grammar
    note: '*داشتیم ... که* presents an ongoing action interrupted by another event. It is clearer than a simple chain of past verbs.'
