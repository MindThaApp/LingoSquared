teaching:
  prs.b1.unit18.lesson01.teach.barnama:
    title: Plan
    gloss: plan
    note: برنامه means plan or schedule.
    example_gloss: What plans do you have tomorrow?
  prs.b1.unit18.lesson01.teach.grammar:
    title: Fixed arrangements
    gloss: فردا ساعت نه جلسه دارم
    note: 'For a fixed arrangement in the future, use the present tense with a time word: فردا ساعت نه جلسه دارم (tomorrow at nine I have a meeting); قطار ساعت هشت حرکت می‌کند (the train leaves at eight).'
  prs.b1.unit18.lesson01.teach.jalasa_daram:
    title: I have a meeting
    gloss: I have a meeting
    note: جلسه دارم is the present tense, used for a fixed arrangement in the future.
    example_gloss: Tomorrow at nine I have a meeting.
  prs.b1.unit18.lesson01.teach.jomea:
    title: Friday
    gloss: Friday
    note: جمعه means Friday, the weekly day off.
    example_gloss: On Friday morning the car comes.
  prs.b1.unit18.lesson01.teach.sobh:
    title: Morning
    gloss: morning
    note: صبح means morning.
    example_gloss: On Friday morning the car comes.
  prs.b1.unit18.lesson01.teach.harkat:
    title: Leaves / departs
    gloss: leaves / departs
    note: حرکت می‌کند is the present tense for a scheduled departure.
    example_gloss: The car leaves at nine.
  prs.b1.unit18.lesson02.teach.qasd:
    title: I intend to
    gloss: I intend to
    note: قصد دارم که + subjunctive states an intention.
    example_gloss: I intend to work tomorrow.
  prs.b1.unit18.lesson02.teach.grammar:
    title: Intentions
    gloss: قصد دارم که + subjunctive
    note: 'To state an intention, use قصد دارم که + the subjunctive: قصد دارم که آخر هفته به پغمان بروم (I intend to go to Paghman at the weekend). An intention is less fixed than an arrangement: it says what you plan, not a booked time.'
  prs.b1.unit18.lesson02.teach.baram:
    title: (that) I go
    gloss: (that) I go
    note: بروم is the 1st person subjunctive of رفتن.
    example_gloss: I intend to go tomorrow.
  prs.b1.unit18.lesson02.teach.paghman:
    title: Paghman
    gloss: Paghman
    note: پغمان is a hill town near Kabul that people visit at the weekend.
    example_gloss: Paghman is near Kabul.
  prs.b1.unit18.lesson02.teach.kabul:
    title: Kabul
    gloss: Kabul
    note: کابل means Kabul.
    example_gloss: Paghman is near Kabul.
  prs.b1.unit18.lesson02.teach.akhar_hafta:
    title: The weekend
    gloss: the weekend
    note: آخر هفته means the weekend.
    example_gloss: At the weekend I am going to Paghman.
  prs.b1.unit18.lesson03.teach.shayad:
    title: Maybe
    gloss: maybe
    note: شاید means maybe; the verb that follows is subjunctive.
    example_gloss: Maybe it will rain tomorrow.
  prs.b1.unit18.lesson03.teach.grammar:
    title: Predictions
    gloss: حتماً، احتمالاً، شاید
    note: 'To predict with different certainty: حتماً + present tense = certain (حتماً می‌آیم); احتمالاً + present tense = probable (احتمالاً هوا خوب می‌شود); شاید + subjunctive = possible (شاید باران بیاید).'
  prs.b1.unit18.lesson03.teach.biayad:
    title: (that) it come
    gloss: (that) it come
    note: بیاید is the 3rd person subjunctive of آمدن; باران آمدن means "to rain".
    example_gloss: Maybe it will rain tomorrow.
  prs.b1.unit18.lesson03.teach.ehtemalan:
    title: Probably
    gloss: probably
    note: احتمالاً means probably; use it with the present tense or می‌شود.
    example_gloss: The weather will probably be good.
  prs.b1.unit18.lesson03.teach.hawa:
    title: Weather
    gloss: weather
    note: هوا means weather (and air).
    example_gloss: The weather will probably be good.
  prs.b1.unit18.lesson03.teach.mishawad:
    title: Becomes / will be
    gloss: becomes / will be
    note: 'می‌شود here means "will be": it describes a prediction.'
    example_gloss: The weather will probably be good.
  prs.b1.unit18.lesson04.teach.hardkat_mikonim:
    title: We leave
    gloss: we leave
    note: حرکت می‌کنیم is the 1st person plural present.
    example_gloss: On Friday morning we leave.
  prs.b1.unit18.lesson04.teach.haft:
    title: Seven
    gloss: seven
    note: هفت means seven.
    example_gloss: We leave at seven.
  prs.b1.unit18.lesson04.teach.kuja:
    title: Where
    gloss: where
    note: کجا means where.
    example_gloss: Where are you going at the weekend?
  prs.b1.unit18.lesson04.teach.darin:
    title: You have
    gloss: you have
    note: دارین is the polite 2nd person plural present of داشتن.
    example_gloss: What plans do you have tomorrow?
  prs.b1.unit18.lesson04.teach.che_waqt:
    title: When
    gloss: when
    note: چه وقت asks "at what time".
    example_gloss: When are you going?
  prs.b1.unit18.lesson04.teach.dialogue01:
    title: Zarmina, what plans do you have for the weekend?
    gloss: Zarmina, what plans do you have for the weekend?
    note: Homayoun asks about her weekend plans.
  prs.b1.unit18.lesson04.teach.dialogue02:
    title: I intend to go to Paghman.
    gloss: I intend to go to Paghman.
    note: Zarmina states an intention with قصد دارم که.
  prs.b1.unit18.lesson04.teach.dialogue03:
    title: When are you going?
    gloss: When are you going?
    note: Homayoun asks when.
  prs.b1.unit18.lesson04.teach.dialogue04:
    title: We leave on Friday morning at seven.
    gloss: We leave on Friday morning at seven.
    note: Zarmina gives a fixed time with the present tense.
  prs.b1.unit18.lesson04.teach.dialogue05:
    title: What will the weather be like?
    gloss: What will the weather be like?
    note: Homayoun asks about the weather.
  prs.b1.unit18.lesson04.teach.dialogue06:
    title: The weather will probably be good, but maybe it will rain.
    gloss: The weather will probably be good, but maybe it will rain.
    note: Zarmina gives a prediction with احتمالاً and a possibility with شاید.
  prs.b1.unit18.lesson05.teach.mibarad:
    title: He/she goes
    gloss: he/she goes
    note: می‌رود is the 3rd person present of رفتن.
    example_gloss: She goes to Paghman at the weekend.
  prs.b1.unit18.lesson05.teach.biravad:
    title: (that) he/she go
    gloss: (that) he/she go
    note: برود is the 3rd person subjunctive of رفتن.
    example_gloss: Zarmina intends to go to Paghman.
  prs.b1.unit18.lesson05.teach.reading:
    title: Zarmina's plans
    gloss: Zarmina intends to go to Paghman at the weekend. They leave on Friday morning at seven. The weather will probably be good, but maybe it will rain.
    note: 'Plans told in the third person: an intention (قصد دارد که + subjunctive), a fixed time in the present tense, and a prediction with احتمالاً and a possibility with شاید.'
  prs.b1.unit18.lesson06.teach.grammar:
    title: 'Review: plans and predictions'
    gloss: فردا ... دارم؛ قصد دارم که؛ احتمالاً؛ شاید
    note: 'Review: fixed arrangement = present tense + time word; intention = قصد دارم که + subjunctive; prediction = حتماً / احتمالاً + present tense, or شاید + subjunctive.'
  prs.b1.unit18.lesson06.teach.r_kar:
    title: Work
    gloss: work
    note: کار means work.
    example_gloss: I have a lot of work today.
  prs.b1.unit18.lesson06.teach.r_waqt:
    title: Time
    gloss: time
    note: وقت means time.
    example_gloss: I have no time today.
