course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: fixed arrangements with the present tense and a time word, intentions with قصد دارم که, and predictions with شاید and احتمالاً.'
units:
  prs.b1.unit18.future_plans:
    title: Future plans and predictions
    description: Talk about fixed arrangements, intentions and predictions, with the right degree of certainty.
