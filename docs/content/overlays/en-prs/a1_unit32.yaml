course:
  title: Dari A1
  description: 'Beginner Kabul Dari: celebration and birthday vocabulary (birthday, celebration, cake, gift, congratulations), asking and stating which month someone''s birthday falls in, a formal invitation phrase, and a Basir/Maryam dialogue about a birthday party.'
units:
  prs.a1.unit32.celebrations:
    title: Celebrations
    description: Talk about birthdays and celebrations -- say when your birthday is, invite someone, and congratulate them.
lessons:
  prs.a1.unit32.lesson01.celebration_vocabulary:
    title: Celebration words
  prs.a1.unit32.lesson02.birthday_month:
    title: Birthday month
  prs.a1.unit32.lesson03.invitation_phrase:
    title: Invitation to a celebration
  prs.a1.unit32.lesson04.celebration_dialogue:
    title: Birthday party dialogue
  prs.a1.unit32.lesson05.reading_celebration:
    title: Reading about a celebration
  prs.a1.unit32.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit32.lesson01.teach.birthday_word:
    title: Birthday
    gloss: birthday
    note: تولد means birthday, the topic word for this unit.
    example_gloss: My birthday is in Hamal.
  prs.a1.unit32.lesson01.teach.celebration_word:
    title: Celebration
    gloss: celebration / party
    note: جشن means a celebration or party.
    example_gloss: Our celebration is big.
  prs.a1.unit32.lesson01.teach.cake_word:
    title: Cake
    gloss: cake
    note: کیک means cake, a standard shared Persian/Dari loanword.
    example_gloss: The cake is delicious.
  prs.a1.unit32.lesson01.teach.gift_word:
    title: Gift
    gloss: gift / present
    note: هدیه means gift or present, the everyday Dari/Persian word (تحفه is also valid but less common in everyday speech).
    example_gloss: This gift is for you.
  prs.a1.unit32.lesson01.teach.congratulations_word:
    title: Congratulations
    gloss: congratulations
    note: تبریک means congratulations, used with می‌گویم (I say) in the everyday phrase تبریک می‌گویم (I congratulate you).
    example_gloss: Congratulations!
  prs.a1.unit32.lesson01.teach.review_mubarak:
    title: Happy birthday (formation)
    gloss: your birthday (informal) + blessed → Happy birthday
    note: تولدت combines تولد (birthday) with the informal "your" suffix -ت; مبارک means blessed/happy. Together, تولدت مبارک is the standard Dari/Persian birthday greeting.
  prs.a1.unit32.lesson01.teach.happy_birthday_phrase:
    title: Happy birthday!
    gloss: Happy birthday!
    note: The genuine, widely-used Dari/Persian birthday greeting (تولدتان مبارک is the formal-register variant, not tested in this unit's exercises).
  prs.a1.unit32.lesson02.teach.review_shoma_dar_ast:
    title: You / in-at / is
    gloss: you (formal) / in-at / is
    note: شما (you formal), در (in/at), and است (is) are all review from earlier units.
  prs.a1.unit32.lesson02.teach.review_man_kodam:
    title: I / which
    gloss: I / which
    note: من (I) and کدام (which) are both review from earlier units.
  prs.a1.unit32.lesson02.teach.month_word:
    title: Month
    gloss: month
    note: ماه means month, a genuinely new word for this course.
    example_gloss: This month is warm.
  prs.a1.unit32.lesson02.teach.review_hamal:
    title: Hamal
    gloss: Hamal (the first month)
    note: حمل (review from unit09) is the first month of the Solar Hijri calendar.
  prs.a1.unit32.lesson02.teach.question_which_month:
    title: In which month is your birthday?
    gloss: In which month is your birthday?
    note: Combines تولد (birthday, review), شما (you, formal, review), در (in, review), کدام (which, review), and ماه (month).
  prs.a1.unit32.lesson02.teach.answer_hamal:
    title: My birthday is in Hamal
    gloss: My birthday is in Hamal.
    note: Combines تولد من در ... است (my birthday is in ..., review construction) with حمل (Hamal).
  prs.a1.unit32.lesson03.teach.review_dawat_mehmani:
    title: Invitation / party
    gloss: invitation / party
    note: دعوت (review from unit13) and مهمانی (review from unit02) are both re-declared here per this course's per-file vocabulary rule.
  prs.a1.unit32.lesson03.teach.review_ra_ba:
    title: Object marker / to
    gloss: object marker / to, toward
    note: را (object marker) and به (to/toward) are both review function words.
  prs.a1.unit32.lesson03.teach.review_mikonam:
    title: I do
    gloss: I do → I invite
    note: می‌کنم (I do, review) combines with دعوت to form the light-verb phrase دعوت می‌کنم (I invite).
  prs.a1.unit32.lesson03.teach.invite_sentence:
    title: I invite you to the birthday celebration
    gloss: I invite you to the birthday celebration.
    note: Combines من ... را به ... دعوت می‌کنم (I invite ... to ..., review construction) with جشن تولد (birthday celebration).
  prs.a1.unit32.lesson03.teach.review_miyayin:
    title: Will you come? (formal)
    gloss: will you come? (formal)
    note: می‌آیین follows the established -ین formal verb-ending pattern (matching استین/می‌خوانین/می‌کنین).
  prs.a1.unit32.lesson03.teach.will_you_come_question:
    title: Will you come?
    gloss: Will you come?
    note: Combines شما (you, formal, review) with می‌آیین.
  prs.a1.unit32.lesson04.teach.review_time_words:
    title: Friday / o'clock / how many / seven
    gloss: Friday / o'clock, hour / how many, what / seven
    note: جمعه, ساعت, چند, and هفت are all review from earlier units (dates and time).
  prs.a1.unit32.lesson04.teach.review_informal_come:
    title: You (informal) / you come / I come / yes / very good / thanks a lot
    gloss: you (informal) / you come (informal) / I come / yes / very good / thanks a lot
    note: تو, می‌آیی, می‌آیم, بلی, بسیار خوب, and تشکر زیاد are all review, gathered here for the informal dialogue register.
  prs.a1.unit32.lesson04.teach.dialogue_line1:
    title: 'Basir: Maryam, Friday is my birthday party. Will you come?'
    gloss: 'Maryam, Friday is my birthday party. Will you come?'
  prs.a1.unit32.lesson04.teach.dialogue_line2:
    title: 'Maryam: Yes, I''ll come! What time is it on Friday?'
    gloss: "Yes, I'll come! What time is it on Friday?"
  prs.a1.unit32.lesson04.teach.dialogue_line3:
    title: 'Basir: It''s at seven o''clock.'
    gloss: It's at seven o'clock.
  prs.a1.unit32.lesson04.teach.dialogue_line4:
    title: 'Maryam: Very good. Happy birthday, Basir!'
    gloss: Very good. Happy birthday, Basir!
  prs.a1.unit32.lesson04.teach.dialogue_line5:
    title: 'Basir: Thanks a lot!'
    gloss: Thanks a lot!
  prs.a1.unit32.lesson05.teach.happy_word:
    title: Happy
    gloss: happy
    note: خوشحال (review from unit25) means happy.
    example_gloss: He/She is happy.
  prs.a1.unit32.lesson05.teach.review_u_yak:
    title: He/she / a, one
    gloss: he/she / a, one
    note: او (he/she, review from unit31) and یک (a/one, review from unit04) are both re-declared here.
  prs.a1.unit32.lesson05.teach.review_miyayad_miyawarad:
    title: He/she comes / he/she brings
    gloss: he/she comes / he/she brings
    note: می‌آید and می‌آورد are the 3rd-person forms, matching the established 3rd-person -د verb pattern (e.g. می‌خواند from unit31).
  prs.a1.unit32.lesson05.teach.reading_passage:
    title: Reading about a celebration
    gloss: 'Basir''s birthday party is on Friday. It''s at seven o''clock. Maryam is coming to the party. She''s bringing a gift. Basir is happy.'
  prs.a1.unit32.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have / but
    gloss: I like / time / I don't have / but
    note: دوست دارم (I like), وقت (time), ندارم (I don't have), and اما (but) are all review from earlier units, continuing unit31's own wrap-up construction.
  prs.a1.unit32.lesson06.teach.wrap_summary:
    title: I like celebrations, but I don't have time
    gloss: "I like celebrations, but I don't have time."
    note: Combines جشن را دوست دارم (I like celebrations, review construction) with اما وقت ندارم (but I don't have time).
