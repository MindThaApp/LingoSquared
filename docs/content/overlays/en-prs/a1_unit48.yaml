  prs.a1.unit48.lesson06.teach.review_daily_price_ninety:
    title: "Review: rent, daily, fifty, ninety, afghani, how much"
    gloss: "rent / daily / fifty / ninety / afghani / how much"
    note: "These are review words (from this unit and earlier units) used to close the unit."
  prs.a1.unit48.lesson06.teach.price_contrast_phrase:
    title: "Bicycle rental is 50 afghanis daily, but 90 for two days"
