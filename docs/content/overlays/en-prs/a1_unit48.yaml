course:
  title: Dari A1
  description: "Beginner Kabul Dari: rent a bicycle from a shop, ask the daily price, understand that an ID card is needed as collateral, and agree a return time."
units:
  prs.a1.unit48.bike_rental:
    title: Bicycle rental
    description: "Rent a bicycle from a shop, ask the daily price, understand the ID-card deposit, and agree a return time."
