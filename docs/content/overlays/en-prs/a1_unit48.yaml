    note: "These are review words (from unit01 and earlier units) used to close the dialogue."
  prs.a1.unit48.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want to rent a bicycle."
    gloss: "Hello. I want to rent a bicycle."
  prs.a1.unit48.lesson04.teach.dialogue_line2:
    title: "Shopkeeper: Hello, welcome. The daily rental is 50 afghanis."
    gloss: "Hello, welcome. The daily rental is 50 afghanis."
  prs.a1.unit48.lesson04.teach.dialogue_line3:
    title: "Homayoun: Very good. Do you need an ID card?"
    gloss: "Very good. Do you need an ID card?"
  prs.a1.unit48.lesson04.teach.dialogue_line4:
    title: "Shopkeeper: Yes, for the rental, I need your ID card."
    gloss: "Yes, for the rental, I need your ID card."
  prs.a1.unit48.lesson04.teach.dialogue_line5:
    title: "Homayoun: Here you go. I'll return it tomorrow."
    gloss: "Here you go. I'll return it tomorrow."
  prs.a1.unit48.lesson04.teach.dialogue_line6:
    title: "Shopkeeper: Thanks a lot. Have a good day!"
    gloss: "Thanks a lot. Have a good day!"
  prs.a1.unit48.lesson05.teach.review_this_is_shopkeeper_in:
    title: "Review: this, is, shopkeeper, in"
    gloss: "this / is / shopkeeper / in"
    note: "These are review words (from earlier units and this unit) used in the reading passage."
