    note: "These are review words (from earlier units and this unit) used to open the dialogue."
  prs.a1.unit48.lesson04.teach.review_welcome_daily_price:
    title: "Review: here you go, daily, fifty, afghani, is"
    gloss: "here you go / daily / fifty / afghani / is"
    note: "These are review words (from unit10 and this unit) used to state the price."
  prs.a1.unit48.lesson04.teach.review_very_good_id_want_polite:
    title: "Review: very good, ID card, you want (polite)"
    gloss: "very good / ID card / you want (polite)"
    note: "These are review words (from earlier units and this unit) used to ask about the deposit."
  prs.a1.unit48.lesson04.teach.review_yes_for_rent_want:
    title: "Review: yes, for"
    gloss: "yes / for"
    note: "These are review words (from unit01/unit03 and unit42) used to confirm the deposit."
