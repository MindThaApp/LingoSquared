    title: "Review: he/she, so that he/she takes, daily, 50 afghanis, tomorrow, gives back"
    gloss: "he/she / so that he/she takes / daily / 50 afghanis / tomorrow / gives back"
    note: "These are review words (from this unit and unit18) used in the reading passage."
  prs.a1.unit48.lesson05.teach.wants_3rd_person_word:
    title: "Wants"
    gloss: "wants"
    note: "This is the third-person present form of the same verb already taught as I want."
    example_gloss: "He/she wants a bicycle."
  prs.a1.unit48.lesson05.teach.reading_passage:
    title: "Reading about a bicycle rental"
    gloss: "Homayoun is at the bicycle-rental shop. He wants to rent a bicycle. The daily rental is 50 afghanis. He returns the bicycle tomorrow."
  prs.a1.unit48.lesson06.teach.review_but_two_days_your_rent:
    title: "Review: but, two days, your rental"
    gloss: "but / two days / your rental"
