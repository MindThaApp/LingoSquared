  prs.a1.unit48.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit48.lesson01.teach.review_this_is_in:
    title: "Review: this, is, in"
    gloss: "this / is / in"
    note: "These are review words (used throughout this course) for talking about the bike-rental shop."
  prs.a1.unit48.lesson01.teach.review_shop_shopkeeper_bike:
    title: "Review: shop, shopkeeper, bicycle"
    gloss: "shop / shopkeeper / bicycle"
    note: "Shop and shopkeeper are review words from unit10; bicycle is a review word from unit24."
  prs.a1.unit48.lesson01.teach.rent_word:
    title: "Rent / rental"
    gloss: "rent / rental"
    note: "This is the everyday Dari word for a rental fee, already used in this course for house rent."
    example_gloss: "This is a bicycle-rental shop."
  prs.a1.unit48.lesson01.teach.this_is_bike_rental_shop_phrase:
    title: "This is a bicycle-rental shop"
    gloss: "This is a bicycle-rental shop."
    note: "This combines this, shop, rent, and bicycle the same way this course already joins two nouns together without a linking word."
  prs.a1.unit48.lesson01.teach.shopkeeper_at_shop_phrase:
    title: "The shopkeeper is at the shop"
    gloss: "The shopkeeper is at the shop."
    note: "This combines shopkeeper and shop."
  prs.a1.unit48.lesson02.teach.review_want_take_rent_bike:
    title: "Review: I want, so that I take, rent, bicycle"
    gloss: "I want / so that I take / rent / bicycle"
    note: "These are review words (from unit42/unit43 and this unit) used to ask for a rental."
  prs.a1.unit48.lesson02.teach.daily_word:
    title: "Daily"
    gloss: "daily"
    note: "This is the everyday Dari word for daily, used here to state a per-day rental price."
    example_gloss: "It's 50 afghanis daily."
  prs.a1.unit48.lesson02.teach.want_to_rent_phrase:
    title: "I want to rent a bicycle"
    gloss: "I want to rent a bicycle."
    note: "This extends the same want-plus-subjunctive pattern already used for library borrowing and making an appointment."
  prs.a1.unit48.lesson02.teach.ask_daily_price_phrase:
    title: "How much is the daily bicycle rental?"
    gloss: "How much is the daily bicycle rental?"
    note: "This combines the words taught earlier in this lesson."
  prs.a1.unit48.lesson02.teach.daily_price_answer_phrase:
    title: "It's 50 afghanis daily"
    gloss: "It's 50 afghanis daily."
    note: "This states the price using already-taught numbers and currency."
  prs.a1.unit48.lesson03.teach.review_for_want_polite_rent:
    title: "Review: for, you want (polite), rent"
    gloss: "for / you want (polite) / rent"
    note: "These are review words (from unit42 and this unit) used to ask what's needed for the rental."
  prs.a1.unit48.lesson03.teach.id_card_word:
    title: "ID card"
    gloss: "ID card"
    note: "This is the Afghan national ID card, already used in this course for a different registration context; here it's the shop's deposit collateral instead of cash."
    example_gloss: "I need an ID card."
  prs.a1.unit48.lesson03.teach.want_id_for_rental_phrase:
    title: "For the rental, I need your ID card"
    gloss: "For the rental, I need your ID card."
    note: "This combines rent and ID card."
  prs.a1.unit48.lesson03.teach.review_when_giveback_tomorrow:
    title: "Review: when, give back, tomorrow"
    gloss: "when / give back / tomorrow"
    note: "These are review words (from unit16, unit43, and unit09) used to ask about the return time."
  prs.a1.unit48.lesson03.teach.ask_return_time_phrase:
    title: "When will you return the bicycle?"
    gloss: "When will you return the bicycle?"
