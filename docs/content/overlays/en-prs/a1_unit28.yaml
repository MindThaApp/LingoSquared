course:
  title: Dari A1
  description: 'Beginner Kabul Dari: animal and pet vocabulary (dog, cat, bird, fish), asking and answering whether you have a pet with حیوان خانگی دارین؟, describing a pet''s size and color, and a Zarmina/Homayoun dialogue about owning and feeding a cat.'
units:
  prs.a1.unit28.animals:
    title: Animals
    description: Talk about pets and common animals, including whether you have one and basic care.
lessons:
  prs.a1.unit28.lesson01.animal_vocabulary:
    title: Animal words
  prs.a1.unit28.lesson02.have_a_pet:
    title: Do you have a pet?
  prs.a1.unit28.lesson03.describe_pet:
    title: Describing your pet
  prs.a1.unit28.lesson04.pet_dialogue:
    title: Pet dialogue
  prs.a1.unit28.lesson05.reading_animals:
    title: Reading about animals
  prs.a1.unit28.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit28.lesson01.teach.animal_word:
    title: Animal
    gloss: animal
    note: حیوان means animal, the general word covering pets and other creatures.
    example_gloss: A dog is an animal.
  prs.a1.unit28.lesson01.teach.dog_word:
    title: Dog
    gloss: dog
    note: سگ means dog.
    example_gloss: I have a dog.
  prs.a1.unit28.lesson01.teach.cat_word:
    title: Cat
    gloss: cat
    note: پشک means cat -- this is the everyday Dari/Afghan word, distinct from Iranian Farsi's گربه.
    example_gloss: I have a cat.
  prs.a1.unit28.lesson01.teach.bird_word:
    title: Bird
    gloss: bird
    note: پرنده means bird.
    example_gloss: I have a bird.
  prs.a1.unit28.lesson01.teach.fish_word:
    title: Fish
    gloss: fish
    note: ماهی means fish.
    example_gloss: I have a fish.
  prs.a1.unit28.lesson01.teach.pet_phrase:
    title: Pet
    gloss: pet
    note: حیوان خانگی literally means "house/home animal" -- حیوان (animal, review) + خانگی (domestic/household).
    example_gloss: The dog is my pet.
  prs.a1.unit28.lesson01.teach.review_daram_dast:
    title: I have / you have (formal) / is
    gloss: I have / you have (formal) / is
    note: دارم (I have), دارین (you have, formal), and است (is) are all review from earlier in the course, used throughout this unit to talk about pets.
  prs.a1.unit28.lesson02.teach.pet_question:
    title: Do you have a pet?
    gloss: Do you have a pet?
    note: حیوان خانگی دارین؟ is the polite, formal way to ask whether someone has a pet.
  prs.a1.unit28.lesson02.teach.yes_answer:
    title: Yes, I have a dog
    gloss: 'Yes, I have a dog.'
    note: بلی (yes, review from unit03) combined with this unit's سگ دارم.
  prs.a1.unit28.lesson02.teach.no_answer:
    title: No, I don't have a pet
    gloss: "No, I don't have a pet."
    note: نخیر (formal no, review from unit03) combined with حیوان خانگی ندارم (I don't have a pet).
  prs.a1.unit28.lesson02.teach.review_bali_nakhair:
    title: Yes / no / I don't have
    gloss: yes / no / I don't have
    note: بلی، نخیر، and ندارم are all review from unit03's family-members exchange, reused here for pet ownership.
  prs.a1.unit28.lesson03.teach.review_rang:
    title: Color
    gloss: color
    note: رنگ means color (review from unit21 clothing).
  prs.a1.unit28.lesson03.teach.black_word:
    title: Black
    gloss: black
    note: سیاه means black (review from unit21/unit27).
    example_gloss: My dog is black.
  prs.a1.unit28.lesson03.teach.white_word:
    title: White
    gloss: white
    note: سفید means white (review from unit21).
    example_gloss: My cat is white.
  prs.a1.unit28.lesson03.teach.small_word:
    title: Small
    gloss: small
    note: کوچک means small (review from unit15 comparisons).
    example_gloss: My cat is small.
  prs.a1.unit28.lesson03.teach.big_word:
    title: Big
    gloss: big
    note: بزرگ means big (review from unit15 comparisons).
    example_gloss: My dog is big.
  prs.a1.unit28.lesson03.teach.combined_sentence:
    title: My dog is black and big
    gloss: My dog is black and big.
    note: Combines two traits with و (and, review).
  prs.a1.unit28.lesson04.teach.review_to_dari:
    title: You (informal) / you have (informal)
    gloss: you (informal) / you have (informal)
    note: تو (you, informal) and داری (you have, informal) are both review, used in this lesson's informal dialogue between close friends.
  prs.a1.unit28.lesson04.teach.review_che_har_roz:
    title: What / every day
    gloss: what / which / every day
    note: چه (what/which, review from unit21's "what color") and هر روز (every day, review from unit24) are used together to ask about a pet's care.
  prs.a1.unit28.lesson04.teach.dialogue_line1:
    title: 'Homayoun: Zarmina, do you have a pet?'
    gloss: 'Homayoun: Zarmina, do you have a pet?'
    note: An informal question between friends, using the informal داری form.
  prs.a1.unit28.lesson04.teach.dialogue_line2:
    title: 'Zarmina: Yes, I have a cat'
    gloss: 'Zarmina: Yes, I have a cat.'
    note: Answers with بلی and یک پشک دارم.
  prs.a1.unit28.lesson04.teach.dialogue_line3:
    title: 'Homayoun: What color is your cat?'
    gloss: 'Homayoun: What color is your cat?'
    note: Uses چه رنگ (what color), the same pattern as unit21's shopping question.
  prs.a1.unit28.lesson04.teach.dialogue_line4:
    title: "Zarmina: It's white"
    gloss: "Zarmina: It's white."
    note: A short answer - just the color plus است. The cat is already clear from the question, so پشک is not repeated.
  prs.a1.unit28.lesson04.teach.dialogue_line5:
    title: 'Homayoun: Do you feed it every day?'
    gloss: 'Homayoun: Do you feed it every day?'
    note: Introduces غذا می‌دهی (you feed/give food, informal), built from غذا (food) + می‌دهی, the informal counterpart of unit18's می‌دهد.
  prs.a1.unit28.lesson04.teach.dialogue_line6:
    title: 'Zarmina: Yes, I feed it every day'
    gloss: 'Zarmina: Yes, I feed it every day.'
    note: Applies هر روز (every day) to می‌دهم (I feed/give, 1st person).
  prs.a1.unit28.lesson05.teach.reading_passage:
    title: Reading about a pet
    gloss: Zarmina has a cat. Her cat is white and small. Zarmina feeds the cat every day.
    note: A short reading passage recapping the unit's pet vocabulary, introducing دارد (has, 3rd person, review from unit26/27) and می‌دهد (gives/feeds, 3rd person, review from unit18).
  prs.a1.unit28.lesson06.teach.review_ama:
    title: But
    gloss: but
    note: اما means but (review from earlier units).
  prs.a1.unit28.lesson06.teach.review_astam:
    title: I am
    gloss: I am
    note: استم (I am) is review from earlier in the course.
  prs.a1.unit28.lesson06.teach.wrap_summary:
    title: I have a dog, but I don't have a cat
    gloss: "I have a dog, but I don't have a cat."
    note: Combines two pet-ownership facts using اما.
