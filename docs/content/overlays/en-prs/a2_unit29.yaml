    instruction: Match each Dari sentence with its meaning.
    accepted_answers:
    - value:
        باید بیایم: I must come
        نباید بیایم: I must not come
        لازم نیست بیایم: I do not have to come
        باید پول بدهم: I must pay
        نباید پول بدهم: I must not pay
        لازم نیست پول بدهم: I do not have to pay
        باید حوله بیاورم: I must bring a towel
        نباید حوله بیاورم: I must not bring a towel
