course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying what you must, must not or need not do, and asking whether something is allowed. Rules of a library, a swimming pool and a gym with باید, نباید, لازم نیست, اجازه دارم and می‌توانم.'
units:
  prs.a2.unit29.rules_permission:
    title: Rules and permission
lessons:
  prs.a2.unit29.lesson01.must_and_places:
    title: Must, and the places in the centre
  prs.a2.unit29.lesson02.must_not:
    title: 'Must not: rules in the library'
  prs.a2.unit29.lesson03.ask_permission:
    title: 'Asking: may I? can I?'
  prs.a2.unit29.lesson04.no_need:
    title: 'No need: you do not have to'
  prs.a2.unit29.lesson05.reading_and_listening:
    title: Reading and listening about rules
  prs.a2.unit29.lesson06.gym_conversation:
    title: A conversation at the gym and the pool
teaching:
  prs.a2.unit29.lesson01.teach.library:
    title: Library
    gloss: library
    note: '*کتابخانه* is a library. You say where you go with *به*: *به کتابخانه می‌روم* is I go to the library. This unit is about the rules of a community centre that has a library, a pool and a gym.'
    example_gloss: The library is near my house.
  prs.a2.unit29.lesson01.teach.pool:
    title: Swimming pool
    gloss: swimming pool
    note: '*حوض آب‌بازی* is a swimming pool. It is the word from the swimming pool unit.'
    example_gloss: I go to the swimming pool every week.
  prs.a2.unit29.lesson01.teach.gym:
    title: Gym
    gloss: gym, sports club
    note: '*باشگاه* is a gym or a sports club. It is the word from the gym unit.'
    example_gloss: The gym is open at six o'clock.
  prs.a2.unit29.lesson01.teach.rules:
    title: Rules
    gloss: 'rules (singular: rule, law)'
    note: '*قانون* is a rule, and *قانون‌ها* is rules. The place goes after it with *-ی*: *قانون‌های کتابخانه* are the rules of the library. The plural ending is written as a separate small part after the noun, with a half-space.'
    example_gloss: The rules of the gym are in the office.
  prs.a2.unit29.lesson01.teach.membership:
    title: Membership card
    gloss: membership card
    note: '*کارت عضویت* is a membership card, the card that lets you borrow books or use a gym. *کارت* is a word you know already.'
    example_gloss: My membership card is at home.
  prs.a2.unit29.lesson01.teach.sports_shoes:
    title: Sports shoes
    gloss: sports shoes, trainers
    note: '*کفش* is a shoe and *ورزشی* means for sport, from *ورزش*. So *کفش ورزشی* is sports shoes.'
    example_gloss: My sports shoes are new.
  prs.a2.unit29.lesson01.teach.must:
    title: 'Must: باید plus the subjunctive'
    gloss: I must go, you must go (to a friend), he/she must go, we must go, you must go (formal or plural), they must go
    note: '*باید* means must or have to. It never changes. The person shows in the verb after it, which is the subjunctive: *بروم، بروی، برود، برویم، بروین، بروند*. The endings are the same as in the present, *-م، -ی، -د، -یم، -ین، -ند*, but the verb starts with *ب-* instead of *می‌*. You have already met this form after *می‌خواهم* (*می‌خواهم یک تکت بگیرم*). The word order is *باید* first, the verb last: *من باید به کتابخانه بروم*. The pronoun *من* is optional because the ending already shows who.'
  prs.a2.unit29.lesson01.teach.formation:
    title: How to make the subjunctive
    gloss: 'I go: that I go. I come: that I come. I do: that I do. I take (get): that I take. I give: that I give. I carry: that I carry.'
    note: 'Take the present, drop *می‌* and put *ب-* in front: *می‌روم* becomes *بروم*, *می‌گیرم* becomes *بگیرم*, *می‌دهم* becomes *بدهم*, *می‌برم* becomes *ببرم*. Two verbs are different. *آمدن* gives *بیایم* (not *بآیم*), and *کردن* gives *کنم* without *ب-* (you will also hear *بکنم*, which is fine). With two-word verbs only the verb part changes: *پس بدهم*, *کار کنم*, *دوش بگیرم*. The other persons follow the same endings: *بگیری، بگیرد، بگیریم، بگیرین، بگیرند*.'
  prs.a2.unit29.lesson01.teach.wear:
    title: To wear
    gloss: to wear, to put on
    note: '*پوشیدن* is to wear or put on clothes and shoes. The subjunctive is *بپوشم، بپوشی، بپوشد، بپوشیم، بپوشین، بپوشند*, so *باید کفش بپوشم* is I must wear shoes.'
    example_gloss: In the gym I must wear new shoes.
  prs.a2.unit29.lesson01.teach.more_verbs:
    title: Must with more verbs
    gloss: I must get a card. You must take a shower. We must give the book back. You must wear sports shoes. They must come to the gym.
    note: 'The same pattern works for every verb: *باید* and then the subjunctive with the right ending. *دوش گرفتن* is to take a shower and *پس دادن* is to give back, so *باید کتاب را پس بدهیم* is we must give the book back. The thing you give or take goes before the verb, with *را* when it is a definite thing: *کتاب را*.'
  prs.a2.unit29.lesson01.teach.sentence:
    title: I must go to the library
    gloss: I must go to the library.
    note: This is the pattern of the whole unit. *باید* tells you it is a rule or a duty, and *بروم* shows the person. Everyone in the centre follows the same rules.
  prs.a2.unit29.lesson02.teach.quiet:
    title: Quiet
    gloss: quiet, silent
    note: '*ساکت* means quiet or silent. *ساکت باشین* is please be quiet (to several people or to someone you respect).'
    example_gloss: The library is quiet.
  prs.a2.unit29.lesson02.teach.be_paradigm:
    title: 'Must be: باشم'
    gloss: I must be quiet, you must be quiet, he/she must be quiet, we must be quiet, you must be quiet (formal or plural), they must be quiet
    note: 'The subjunctive of *بودن* (to be) is *باشم، باشی، باشد، باشیم، باشین، باشند*. After *باید* it says that someone must be in some state: *باید ساکت باشین* is you must be quiet. You have met *باشد* and *باشین* already; *باشم، باشی، باشیم* complete the set.'
  prs.a2.unit29.lesson02.teach.food:
    title: Food
    gloss: food, a meal
    note: '*غذا* is food or a meal. *غذا خوردن* is to eat a meal, and *غذا بخورم* is the subjunctive of that.'
    example_gloss: We eat a meal at home.
  prs.a2.unit29.lesson02.teach.cigarette:
    title: Cigarette
    gloss: cigarette
    note: '*سگرت* is a cigarette. *سگرت کشیدن* is to smoke, using the verb *کشیدن*.'
    example_gloss: He smokes cigarettes every day.
  prs.a2.unit29.lesson02.teach.forbidden:
    title: Forbidden
    gloss: forbidden, not allowed
    note: '*ممنوع* means forbidden and is what you read on signs: *غذا خوردن ممنوع است* is eating is not allowed. The activity comes first in the infinitive (*کشیدن، خوردن، گرفتن*), then *ممنوع است*.'
    example_gloss: Smoking is forbidden in the gym.
  prs.a2.unit29.lesson02.teach.loud:
    title: Loud, loudly
    gloss: 'loud, loudly (also: tall, high)'
    note: '*بلند* means loud when you say how someone speaks: *بلند صحبت کردن* is to talk loudly. *صحبت کردن* is a verb you know already.'
    example_gloss: He talks loudly.
  prs.a2.unit29.lesson02.teach.must_not:
    title: 'Must not: نباید plus the subjunctive'
    gloss: I must not eat, you must not eat, he/she must not eat, we must not eat, you must not eat (formal or plural), they must not eat
    note: '*نباید* is the negative of *باید* and means must not. The *ن* goes on *باید*, and the verb after it stays positive: *نباید غذا بخورین* is you must not eat. The verb has the same subjunctive endings as after *باید*. *نباید* is for a rule or a strong advice, so it is what the staff of a library or a pool say.'
  prs.a2.unit29.lesson02.teach.forbidden_same:
    title: Two ways to say it is not allowed
    gloss: Eating is forbidden. You must not eat.
    note: '*ممنوع است* and *نباید* say the same thing. The sign uses the infinitive: *غذا خوردن ممنوع است*. A person talking to you uses *نباید* with the subjunctive: *نباید غذا بخورین*.'
  prs.a2.unit29.lesson02.teach.no_eat_library:
    title: You must not eat in the library
    gloss: You must not eat in the library.
    note: The place comes first, then *نباید*, then the thing and the verb at the end.
  prs.a2.unit29.lesson02.teach.quiet_library:
    title: You must be quiet in the library
    gloss: You must be quiet in the library.
    note: '*باید ساکت باشین* is a rule that tells you what to do, while *نباید* tells you what not to do.'
  prs.a2.unit29.lesson02.teach.phone_forms:
    title: Must not with more persons
    gloss: I must not talk on the phone. You must not talk on the phone (to a friend). You must not talk on the phone (formal or plural).
    note: 'With a two-word verb such as *صحبت کردن*, only the verb part changes: *صحبت کنم، صحبت کنی، صحبت کنین*. To a friend you say *نباید ... کنی*, to several people or someone you respect *نباید ... کنین*.'
  prs.a2.unit29.lesson02.teach.no_phone_gym:
    title: You must not talk on the phone in the gym
    gloss: You must not talk on the phone in the gym.
    note: '*با تیلفون صحبت کردن* is to talk on the phone. *صحبت کنین* is the subjunctive of *صحبت کردن* for *شما*.'
  prs.a2.unit29.lesson03.teach.here:
    title: Here
    gloss: here
    note: '*اینجا* means here. You know *آنجا* (there) already: *اینجا* is the near one.'
    example_gloss: The library is here.
  prs.a2.unit29.lesson03.teach.permission:
    title: Permission
    gloss: permission
    note: '*اجازه* is permission. *اجازه دارم* is I am allowed (I have permission) and *اجازه ندارم* is I am not allowed. For someone else you say *اجازه دارین* (you are allowed) or *اجازه ندارین* (you are not allowed).'
    example_gloss: You are allowed here.
  prs.a2.unit29.lesson03.teach.photo:
    title: Photo
    gloss: photo, picture
    note: '*عکس* is a photo. *عکس گرفتن* is to take a photo, with the verb *گرفتن*.'
    example_gloss: My photos are on my phone.
  prs.a2.unit29.lesson03.teach.ask_allowed:
    title: May I? اجازه دارم plus the subjunctive
    gloss: May I take a photo here? May I take the book home? May I use the phone?
    note: 'To ask if you are allowed to do something, say *اجازه دارم* and then the subjunctive of the verb: *اجازه دارم اینجا عکس بگیرم؟* is may I take a photo here? Begin with *ببخشین* (excuse me) to be polite. The person is shown in the verb after *اجازه دارم*, so for a different person you change both: *اجازه دارین عکس بگیرین* is you may take a photo.'
  prs.a2.unit29.lesson03.teach.can_paradigm:
    title: 'Can: می‌توانم'
    gloss: I can, you can (to a friend), he/she can, we can, you can (formal or plural), they can
    note: '*می‌توانم* is I can. It is written with a small gap between *می* and *توانم*. The forms are *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. After it comes the subjunctive: *می‌توانم اینجا عکس بگیرم؟* is can I take a photo here? Asking *می‌توانم ...؟* is another way to ask permission, as common as *اجازه دارم ...؟*.'
  prs.a2.unit29.lesson03.teach.answers:
    title: Saying yes or no
    gloss: Yes, you are allowed. Yes, you can. No, you are not allowed. No, you cannot. No, it is forbidden.
    note: 'Answer with the same verb you were asked: *اجازه دارم؟* gets *اجازه دارین / اجازه ندارین*, and *می‌توانم؟* gets *می‌توانین / نمی‌توانین*. When a rule forbids it, you can also say *ممنوع است*. You can add *بلی، البته* (yes, of course).'
  prs.a2.unit29.lesson03.teach.polite_ask:
    title: Excuse me, may I take this book home?
    gloss: Excuse me, may I take this book home?
    note: '*ببخشین* opens the question politely. *به خانه ببرم* is take home.'
  prs.a2.unit29.lesson03.teach.answer_yes:
    title: Yes, you may
    gloss: Yes, you are allowed.
    note: A short, polite yes to a question with *اجازه دارم*.
  prs.a2.unit29.lesson03.teach.answer_no_photo:
    title: No, taking photos is forbidden here
    gloss: No, taking photos is not allowed here.
    note: 'A no that gives the reason with *ممنوع*: *عکس گرفتن ممنوع است*.'
  prs.a2.unit29.lesson04.teach.no_need:
    title: 'No need: لازم نیست plus the subjunctive'
    gloss: I do not need to come. You do not need to pay.
    note: '*لازم نیست* means it is not necessary, so you do not have to. It is followed by the subjunctive, just like *باید*: *لازم نیست پول بدهین* is you do not have to pay. *لازم نیست* does not forbid anything. It only says that it is up to you.'
  prs.a2.unit29.lesson04.teach.no_need_formal:
    title: 'More formal: ضرورت ندارد'
    gloss: It is not necessary to bring a card.
    note: '*ضرورت ندارد* means the same as *لازم نیست*, but it is a little more formal and you see it on notices: *ضرورت ندارد کارت بیاورین* is there is no need to bring a card. The verb after it is the subjunctive again. In everyday speech *لازم نیست* is the usual choice.'
  prs.a2.unit29.lesson04.teach.three_meanings:
    title: Three different meanings
    gloss: I must come. I must not come. I do not have to come.
    note: '*باید بیایم* is a duty, *نباید بیایم* is a ban, and *لازم نیست بیایم* is freedom: I may come, but I do not have to. Do not mix up *نباید* and *لازم نیست*: *نباید* forbids, *لازم نیست* does not.'
  prs.a2.unit29.lesson04.teach.towel:
    title: Towel
    gloss: towel
    note: '*حوله* is a towel. *حوله‌ام* is my towel.'
    example_gloss: My towel is in the gym.
  prs.a2.unit29.lesson04.teach.everyone:
    title: Everyone, all
    gloss: everyone, all
    note: '*همه* means everyone or all. It is useful for rules that are for everybody: *همه باید ساکت باشند* is everyone must be quiet.'
    example_gloss: Everyone in the library is quiet.
  prs.a2.unit29.lesson04.teach.bring:
    title: To bring
    gloss: to bring
    note: '*آوردن* is to bring. The subjunctive is *بیاورم، بیاوری، بیاورد، بیاوریم، بیاورین، بیاورند*. You know *بیاورم* already: *لازم نیست حوله بیاوری* is you do not have to bring a towel.'
    example_gloss: Tomorrow you must bring my books.
  prs.a2.unit29.lesson04.teach.towel_phrase:
    title: In the gym you do not need to bring a towel
    gloss: In the gym you do not need to bring a towel.
    note: 'The gym has its own towels, so bringing one is not necessary. This is a good example of *لازم نیست*: it is not forbidden, only not needed.'
  prs.a2.unit29.lesson04.teach.pay_phrase:
    title: You do not have to pay
    gloss: You do not have to pay.
    note: The library membership is free, so you do not have to pay for it. *پول بدهین* is the subjunctive of *پول دادن*.
  prs.a2.unit29.lesson05.teach.centre:
    title: Centre
    gloss: centre
    note: '*مرکز اجتماعی* is a community centre, a building with a library, a pool and a gym. You know *اجتماعی* from earlier units.'
    example_gloss: The community centre is near my house.
  prs.a2.unit29.lesson05.teach.rubbish:
    title: Rubbish, bin
    gloss: 'rubbish, waste (and: bin)'
    note: '*زباله* is rubbish and *سطل* is a bin. Both words are from the waste unit. The verb is *انداختن*, to throw: *زباله را در سطل بیندازین* is put the rubbish in the bin.'
    example_gloss: The rubbish is in the bin.
  prs.a2.unit29.lesson05.teach.run:
    title: To run
    gloss: to run
    note: '*دویدن* is to run. The subjunctive is *بدوم، بدوی، بدود، بدویم، بدوین، بدوند*, so *نباید بدوین* is you must not run.'
    example_gloss: You must not run in the pool.
  prs.a2.unit29.lesson05.teach.throw:
    title: To throw, to put
    gloss: to throw, to put in
    note: '*انداختن* is to throw. The subjunctive is *بیندازم، بیندازی، بیندازد، بیندازیم، بیندازین، بیندازند*, so *باید زباله را در سطل بیندازین* is you must put the rubbish in the bin.'
    example_gloss: Put the rubbish in the bin.
  prs.a2.unit29.lesson05.teach.library_turn01:
    title: Shakila asks to take a book home
    gloss: Excuse me, may I take this book home?
    note: Shakila is new at the library and asks with *اجازه دارم* plus the subjunctive *ببرم*. She says *ببخشین* to be polite.
  prs.a2.unit29.lesson05.teach.library_turn02:
    title: Nasir says she needs a card first
    gloss: Yes, but first you must get a membership card.
    note: 'Nasir is the librarian, so he says *شما* in the *-ین* form: *بگیرین*. *اول باید* is first you must.'
  prs.a2.unit29.lesson05.teach.library_turn03:
    title: Shakila asks about paying
    gloss: Do I have to pay?
    note: '*باید پول بدهم؟* is a question with *باید*: do I have to pay?'
  prs.a2.unit29.lesson05.teach.library_turn04:
    title: Nasir says no payment, but give the book back
    gloss: No, you do not have to pay. You must give the book back within two weeks.
    note: '*لازم نیست* says there is no need to pay. *باید کتاب را تا دو هفته پس بدهین* is a duty: the book must come back within two weeks.'
  prs.a2.unit29.lesson05.teach.library_turn05:
    title: Shakila asks about eating
    gloss: Can I eat here?
    note: '*می‌توانم ...؟* asks if you may. The subjunctive is *بخورم*.'
  prs.a2.unit29.lesson05.teach.library_turn06:
    title: Nasir says no eating and be quiet
    gloss: No, you must not eat. You must also be quiet.
    note: '*نباید غذا بخورین* is a ban and *باید ساکت هم باشین* is a duty. *هم* means also.'
  prs.a2.unit29.lesson05.teach.notice:
    title: A notice about the rules of the centre
    gloss: 'Notice. The rules of the community centre. Library: In the library you must not eat and you must be quiet. Swimming pool: Before you go into the pool you must take a shower. You must not run in the pool. Gym: In the gym you must wear sports shoes. You do not need to bring a towel. You must put rubbish in the bin.'
    note: 'A real notice mixes all three kinds of rule: *باید* for what you must do, *نباید* for what you must not do, and *لازم نیست* for what is not necessary. The notice speaks to everybody, so it uses the *-ین* form.'
  prs.a2.unit29.lesson06.teach.first_time:
    title: The first time
    gloss: the first time
    note: '*اولین بار* is the first time. *اولین* means first and *بار* means time, as in *هر بار* (every time).'
    example_gloss: I am going to this library for the first time.
  prs.a2.unit29.lesson06.teach.what_must_i:
    title: What must I do?
    gloss: What must I do?
    note: 'A useful question: *چه* (what), *باید* and the subjunctive *بکنم*. *بکنم* and *کنم* are both fine here.'
  prs.a2.unit29.lesson06.teach.gym_turn01:
    title: Nazila asks what she must do
    gloss: Fahim, tomorrow I am going to the gym for the first time. What must I do?
    note: Nazila uses *تو* with her friend. *فردا ... می‌روم* is the plain present for tomorrow.
  prs.a2.unit29.lesson06.teach.gym_turn02:
    title: Fahim lists a duty and a no-need
    gloss: You must wear sports shoes. You do not need to bring a towel, the gym has towels.
    note: 'Fahim talks to a friend, so the verbs end in *-ی*: *بپوشی، بیاوری*. *باید* is a duty, *لازم نیست* is no need.'
  prs.a2.unit29.lesson06.teach.gym_turn03:
    title: Nazila asks about the pool
    gloss: After the gym can I go to the swimming pool?
    note: '*می‌توانم ... بروم؟* asks if she may go.'
  prs.a2.unit29.lesson06.teach.gym_turn04:
    title: Fahim says yes, with two rules
    gloss: Yes, but first you must take a shower. You must also not run in the pool.
    note: '*اول باید دوش بگیری* is a duty and *نباید بدوی* is a ban. Both use the *-ی* ending for a friend.'
  prs.a2.unit29.lesson06.teach.gym_turn05:
    title: Nazila thanks him
    gloss: Good! Thank you.
    note: A short, friendly ending. *تشکر* is thanks.
exercises:
  prs.a2.unit29.lesson01.exercise01.recognize_must_go:
    instruction: What does this sentence mean?
    correct_option: I must go
    distractors:
    - I want to go
    - I went yesterday
    - I do not want to go
    accepted_answers:
    - value: I must go
      status: correct
    feedback: '*من باید بروم* is I must go: *باید* plus the subjunctive *بروم*.'
  prs.a2.unit29.lesson01.exercise02.recognize_get_card:
    instruction: What does this sentence mean?
    correct_option: You must get a membership card
    distractors:
    - You have a membership card
    - You must give back the card
    - I must get a card
    accepted_answers:
    - value: You must get a membership card
      status: correct
    feedback: '*بگیرین* is the subjunctive for *شما*, so *شما باید کارت عضویت بگیرین* is you must get a membership card.'
  prs.a2.unit29.lesson01.exercise03.match_places_and_must:
    instruction: Match each Dari word or phrase with its meaning.
    accepted_answers:
    - value:
        کتابخانه: library
        حوض آب‌بازی: swimming pool
        باشگاه: gym
        قانون: rule
        کارت عضویت: membership card
        کفش ورزشی: sports shoes
        باید بروم: I must go
        باید بروی: you must go (to a friend)
        باید برود: he or she must go
        باید برویم: we must go
        باید بروین: you must go (formal or plural)
        باید بروند: they must go
      status: correct
    feedback: 'Only the ending of the verb changes with the person: *بروم* I, *بروی* you (friend), *برود* he or she, *برویم* we, *بروین* you (formal or plural), *بروند* they.'
  prs.a2.unit29.lesson01.exercise04.order_go_library:
    instruction: 'Arrange the words to say: I must go to the library.'
    accepted_answers:
    - value:
      - من
      - باید
      - به
      - کتابخانه
      - بروم
      status: correct
    - value:
      - من
      - به
      - کتابخانه
      - باید
      - بروم
      status: correct
    feedback: '*من باید به کتابخانه بروم.* The verb *بروم* stands last. *به کتابخانه* can also come before *باید*.'
  prs.a2.unit29.lesson01.exercise05.complete_go_gym:
    instruction: 'Complete the sentence: We must go to the gym.'
    accepted_answers:
    - value: برویم
      status: correct
    feedback: '*برویم* is the subjunctive of *رفتن* for *ما*. *ما باید به باشگاه برویم* is we must go to the gym.'
  prs.a2.unit29.lesson01.exercise06.translate_get_card:
    instruction: 'Translate into Dari, using باید: I must get a membership card.'
    accepted_answers:
    - value: من باید کارت عضویت بگیرم.
      status: correct
    - value: باید کارت عضویت بگیرم.
      status: correct
    - value: من باید یک کارت عضویت بگیرم.
      status: correct
    - value: باید یک کارت عضویت بگیرم.
      status: correct
    - value: من کارت عضویت باید بگیرم.
      status: correct
    - value: کارت عضویت باید بگیرم.
      status: correct
    feedback: '*من باید کارت عضویت بگیرم.* is I must get a membership card. *من* is optional, and *یک* before *کارت* is also fine.'
  prs.a2.unit29.lesson02.exercise01.recognize_no_eat:
    instruction: What does this sentence mean?
    correct_option: You must not eat in the library
    distractors:
    - You must eat in the library
    - You may eat in the library
    - The food is in the library
    accepted_answers:
    - value: You must not eat in the library
      status: correct
    feedback: '*نباید غذا بخورین* is you must not eat: *نباید* plus the subjunctive *بخورین*.'
  prs.a2.unit29.lesson02.exercise02.recognize_no_smoking:
    instruction: What does this sign mean?
    correct_option: Smoking is not allowed
    distractors:
    - Smoking is allowed here
    - You must smoke here
    - The cigarette is new
    accepted_answers:
    - value: Smoking is not allowed
      status: correct
    feedback: '*ممنوع است* means is forbidden, so *سگرت کشیدن ممنوع است* is smoking is not allowed.'
  prs.a2.unit29.lesson02.exercise03.match_not_rules:
    instruction: Match each Dari word or phrase with its meaning.
    accepted_answers:
    - value:
        ساکت: quiet
        غذا: food
        سگرت: cigarette
        ممنوع: forbidden
        بلند: loud, loudly
        نباید غذا بخورم: I must not eat
        نباید غذا بخوری: you must not eat (to a friend)
        باید ساکت باشم: I must be quiet
        باید ساکت باشین: you must be quiet (formal or plural)
        نباید غذا بخورند: they must not eat
      status: correct
    feedback: '*باید* says you must and *نباید* says you must not. The verb ending still shows the person.'
  prs.a2.unit29.lesson02.exercise04.order_no_loud:
    instruction: 'Arrange the words to say: You must not talk loudly in the library.'
    accepted_answers:
    - value:
      - در
      - کتابخانه
      - نباید
      - بلند
      - صحبت
      - کنین
      status: correct
    - value:
      - نباید
      - در
      - کتابخانه
      - بلند
      - صحبت
      - کنین
      status: correct
    feedback: '*در کتابخانه نباید بلند صحبت کنین.* The place can come first or after *نباید*. The verb *کنین* stays last.'
  prs.a2.unit29.lesson02.exercise05.complete_no_eat:
    instruction: 'Complete the sentence: You must not eat in the library.'
    accepted_answers:
    - value: نباید
      status: correct
    feedback: '*نباید* is must not. *در کتابخانه نباید غذا بخورین* is you must not eat in the library.'
  prs.a2.unit29.lesson02.exercise06.translate_be_quiet:
    instruction: 'Translate into Dari, using باید: In the library you must be quiet.'
    accepted_answers:
    - value: در کتابخانه باید ساکت باشین.
      status: correct
    - value: باید در کتابخانه ساکت باشین.
      status: correct
    - value: شما در کتابخانه باید ساکت باشین.
      status: correct
    - value: شما باید در کتابخانه ساکت باشین.
      status: correct
    - value: در کتابخانه شما باید ساکت باشین.
      status: correct
    feedback: '*در کتابخانه باید ساکت باشین.* is in the library you must be quiet. *شما* is optional, and *در کتابخانه* can move.'
  prs.a2.unit29.lesson03.exercise01.recognize_may_photo:
    instruction: What does this question mean?
    correct_option: May I take a photo here?
    distractors:
    - I took a photo here
    - I must take a photo here
    - Do you have a photo?
    accepted_answers:
    - value: May I take a photo here?
      status: correct
    feedback: '*اجازه دارم* asks for permission, and *بگیرم* is the subjunctive of *گرفتن*: may I take a photo here?'
  prs.a2.unit29.lesson03.exercise02.recognize_no_cannot:
    instruction: What does this answer mean?
    correct_option: No, you may not
    distractors:
    - Yes, you may
    - No, I may not
    - Yes, I can
    accepted_answers:
    - value: No, you may not
      status: correct
    feedback: '*نمی‌توانین* is you cannot, here you may not. It answers *می‌توانم ...؟*.'
  prs.a2.unit29.lesson03.exercise03.match_permission_words:
    instruction: Match each Dari word or phrase with its meaning.
    accepted_answers:
    - value:
        اجازه دارم: I am allowed
        اجازه ندارم: I am not allowed
        اجازه دارین: you are allowed (formal or plural)
        اجازه ندارین: you are not allowed (formal or plural)
        می‌توانم: I can
        می‌توانی: you can (to a friend)
        می‌توانیم: we can
        می‌توانین: you can (formal or plural)
        می‌توانند: they can
        عکس: photo
      status: correct
    feedback: '*اجازه دارم* and *می‌توانم* both ask if you may. The endings *-م، -ی، -یم، -ین، -ند* show the person.'
  prs.a2.unit29.lesson03.exercise04.order_take_book:
