course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: handling a travel disruption — a
    cancelled intercity bus, asking about alternatives, reading a station
    notice, and the conversation with station staff itself.

units:
  prs.a2.unit15.travel_disruption:
    title: Travel disruption

lessons:
  prs.a2.unit15.lesson01.disruption_vocabulary: {title: "Words for travel disruption"}
  prs.a2.unit15.lesson02.asking_about_alternatives: {title: "Asking about alternatives"}
  prs.a2.unit15.lesson03.reading_a_station_notice: {title: "Reading a station notice"}
  prs.a2.unit15.lesson04.station_dialogue: {title: "At the bus station"}

teaching:
  prs.a2.unit15.lesson01.teach.delay_word:
    title: "Delay"
    gloss: "delay"
    note: "*تاخیر* is a general delay -- a bus, a meeting, anything running late."
    example_gloss: "Today's bus is an hour late."
  prs.a2.unit15.lesson01.teach.cancellation_word:
    title: "Cancellation"
    gloss: "cancellation"
    note: "*لغو* is used with *شدن* (*لغو شده*, 'has been cancelled')."
    example_gloss: "The 9 o'clock bus has been cancelled."
  prs.a2.unit15.lesson01.teach.closed_word:
    title: "Closed"
    gloss: "closed"
    note: "*بسته* describes a road, a shop, or an office that isn't open."
    example_gloss: "The Kabul-Mazar-i-Sharif road is closed."
  prs.a2.unit15.lesson01.teach.alternative_route_word:
    title: "Alternative route"
    gloss: "alternative route"
    note: "*مسیر بدیل* -- *مسیر* means 'route' and *بدیل* means 'alternative'."
    example_gloss: "There is no alternative route."
  prs.a2.unit15.lesson01.teach.snowfall_word:
    title: "Snowfall"
    gloss: "snowfall"
    note: "*برفباری* -- *برف* (snow) plus the suffix that turns it into 'snowfall'."
    example_gloss: "Due to snowfall, the road is closed."
  prs.a2.unit15.lesson01.teach.notice_word:
    title: "Announcement / notice"
    gloss: "announcement"
    note: "*اطلاعیه* is a posted notice, like the kind on a station wall."
    example_gloss: "I read the station's announcement."
  prs.a2.unit15.lesson01.teach.due_to_grammar:
    title: "Due to, with به دلیل"
    gloss: "Due to snowfall, the bus has been cancelled."
    note: "*به دلیل* + noun states a cause -- this unit's A2-level grammar step, a new causal connector beyond unit10's *چون* (because), which instead takes a full clause."
  prs.a2.unit15.lesson01.teach.wait_phrase:
    title: "Say you must wait"
    gloss: "You must wait until tomorrow morning."
    note: "*باید ... صبر کنین* -- 'you must wait' -- the formal-plural verb ending used for a stranger."
  prs.a2.unit15.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used to join clauses in this unit."
  prs.a2.unit15.lesson01.teach.first_person_wait:
    title: "I must wait too"
    gloss: "I must wait too."
    note: "*من هم باید صبر کنم* introduces the first-person subjunctive *کنم* ('I do'), used bare after *باید* -- 'must' -- without *می‌*."

  prs.a2.unit15.lesson02.teach.ask_next_bus:
    title: "Ask when the next bus leaves"
    gloss: "When does the next bus leave?"
    note: "*بعدی* means 'next'."
  prs.a2.unit15.lesson02.teach.ask_alternative_route:
    title: "Ask about an alternative route"
    gloss: "Is there an alternative route?"
    note: "*وجود دارد؟* -- 'does it exist?' -- a common way to ask if something is available."
  prs.a2.unit15.lesson02.teach.tomorrow_departure:
    title: "State tomorrow's departure time"
    gloss: "The bus leaves tomorrow at 8 in the morning."
    note: "Reuses the already-established *ساعت* (o'clock) pattern."

  prs.a2.unit15.lesson03.teach.station_word:
    title: "Station"
    gloss: "station"
    note: "*ایستگاه* is used for a bus station just as for a train station."
    example_gloss: "Homayoun went to the bus station."
  prs.a2.unit15.lesson03.teach.passengers_word:
    title: "Passengers"
    gloss: "passengers"
    note: "*مسافران* is the plural of *مسافر* (passenger/traveller)."
    example_gloss: "Passengers must wait."
  prs.a2.unit15.lesson03.teach.notice_text:
    title: "A station notice about the cancelled bus"
    gloss: "Today's 9 o'clock bus to Mazar-i-Sharif has been cancelled due to snowfall. The Kabul-Mazar-i-Sharif road is closed. Passengers must wait until tomorrow morning. The next bus leaves tomorrow at 8 in the morning."
    note: "A short official station notice, in the formal written register this unit is teaching."

  prs.a2.unit15.lesson04.teach.turn01:
    title: "Station staff greets همایون"
    gloss: "Station staff asks what help they can give him."
    note: "Reuses the same formal greeting an office clerk uses in unit09."
  prs.a2.unit15.lesson04.teach.turn02:
    title: "همایون asks about the 9 o'clock bus"
    gloss: "همایون asks when the 9 o'clock bus to Mazar-i-Sharif leaves."
    note: "Reuses the *کی ... می‌کند؟* question pattern taught in lesson02."
  prs.a2.unit15.lesson04.teach.turn03:
    title: "Station staff explains the cancellation"
    gloss: "Station staff apologizes and says that bus has been cancelled due to snowfall."
    note: "*متأسفم* means 'I'm sorry'."
  prs.a2.unit15.lesson04.teach.turn04:
    title: "همایون asks about an alternative"
    gloss: "همایون asks if there is an alternative route."
    note: "Reuses lesson02's exact question."
  prs.a2.unit15.lesson04.teach.turn05:
    title: "Station staff answers and gives the wait"
    gloss: "No, the road is closed. He must wait until tomorrow morning."
    note: "*نخیر* is a more formal 'no', paired with *بلی* the way this corpus already uses it."
  prs.a2.unit15.lesson04.teach.turn06:
    title: "همایون asks about tomorrow's bus"
    gloss: "همایون asks what time tomorrow's bus leaves."
    note: "*چند* here means 'what (time)'."
  prs.a2.unit15.lesson04.teach.turn07:
    title: "Station staff gives the time"
    gloss: "Tomorrow's bus leaves at 8 in the morning."
    note: "Reuses lesson02's exact fact, since it's the same real detail."
  prs.a2.unit15.lesson04.teach.turn08:
    title: "همایون thanks the staff"
    gloss: "همایون thanks them for the information."
    note: "*معلومات‌تان* -- 'your information' -- attaches the formal possessive suffix *-تان*."

exercises:
  prs.a2.unit15.lesson01.exercise01.recognize_delay:
    instruction: "What does this word mean?"
    correct_option: "delay"
    distractors: ["cancellation", "closed", "announcement"]
    accepted_answers: [{value: "delay", status: correct}]
    feedback: "*تاخیر* means delay."
  prs.a2.unit15.lesson01.exercise02.recognize_cancellation:
    instruction: "What does this word mean?"
    correct_option: "cancellation"
    distractors: ["snowfall", "alternative route", "passengers"]
    accepted_answers: [{value: "cancellation", status: correct}]
    feedback: "*لغو* means cancellation."
  prs.a2.unit15.lesson01.exercise03.match_travel_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {تاخیر: delay, لغو: cancellation, بسته: closed, "مسیر بدیل": "alternative route", برفباری: snowfall, اطلاعیه: announcement}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's travel disruption."
  prs.a2.unit15.lesson01.exercise04.order_road_closed:
    instruction: "Arrange the words to say the road is closed due to snowfall."
    accepted_answers: [{value: [راه, به, دلیل, برفباری, بسته, است], status: correct}]
    feedback: "*راه به دلیل برفباری بسته است* states the closure and its cause."
  prs.a2.unit15.lesson01.exercise05.write_cancellation:
    instruction: "Write the Dari word for cancellation."
    accepted_answers:
      - {value: لغو, status: correct}
    feedback: "*لغو* means cancellation."

  prs.a2.unit15.lesson02.exercise01.recognize_ask_next_bus:
    instruction: "Which question asks when the next bus leaves?"
    correct_option: "When does the next bus leave?"
    distractors: ["Is there an alternative route?", "The bus leaves tomorrow at 8 in the morning.", "You must wait until tomorrow morning."]
    accepted_answers: [{value: "When does the next bus leave?", status: correct}]
    feedback: "*بس بعدی کی حرکت می‌کند؟* asks when the next bus leaves."
  prs.a2.unit15.lesson02.exercise02.order_tomorrow_departure:
    instruction: "Arrange the words to say the bus leaves tomorrow at 8 in the morning."
    accepted_answers: [{value: [بس, فردا, ساعت, هشت, صبح, حرکت, "می‌کند"], status: correct}]
    feedback: "*بس فردا ساعت هشت صبح حرکت می‌کند.* states tomorrow's departure time."
  prs.a2.unit15.lesson02.exercise03.dialogue_response_ask_alternative:
    instruction: "The staff member says: 'I'm sorry, that bus has been cancelled due to snowfall.' Ask if there is an alternative route."
    accepted_answers:
      - {value: "مسیر بدیل وجود دارد؟", status: correct}
      - {value: "مسیر بدیل وجود دارد", status: correct}
    feedback: "*مسیر بدیل وجود دارد؟* asks about an alternative route."
  prs.a2.unit15.lesson02.exercise04.translate_ask_next_bus:
    instruction: "Translate: When does the next bus leave?"
    accepted_answers:
      - {value: "بس بعدی کی حرکت می‌کند؟", status: correct}
      - {value: "بس بعدی کی حرکت می‌کند", status: correct}
    feedback: "*بس بعدی کی حرکت می‌کند؟* asks when the next bus leaves."
  prs.a2.unit15.lesson02.exercise05.write_alternative_route:
    instruction: "Write, asking if there is an alternative route."
    accepted_answers:
      - {value: "مسیر بدیل وجود دارد؟", status: correct}
      - {value: "مسیر بدیل وجود دارد", status: correct}
    feedback: "*مسیر بدیل وجود دارد؟* asks about an alternative route."

  prs.a2.unit15.lesson03.exercise01.read_cancellation_reason:
    instruction: "According to the notice, why was the 9 o'clock bus cancelled?"
    correct_option: "snowfall"
    distractors: ["a broken bus", "a driver shortage", "no reason given"]
    accepted_answers: [{value: "snowfall", status: correct}]
    feedback: "The notice says the bus was cancelled *به دلیل برفباری* -- due to snowfall."
  prs.a2.unit15.lesson03.exercise02.read_next_departure:
    instruction: "According to the notice, when does the next bus leave?"
    correct_option: "tomorrow at 8 in the morning"
    distractors: ["later today", "tomorrow at noon", "the day after tomorrow"]
    accepted_answers: [{value: "tomorrow at 8 in the morning", status: correct}]
    feedback: "*بس بعدی فردا ساعت هشت صبح حرکت می‌کند* -- tomorrow at 8 in the morning."
  prs.a2.unit15.lesson03.exercise03.recognize_station_word:
    instruction: "What does this word mean?"
    correct_option: "station"
    distractors: ["passengers", "road", "notice"]
    accepted_answers: [{value: "station", status: correct}]
    feedback: "*ایستگاه* means station."
  prs.a2.unit15.lesson03.exercise04.order_passengers_wait:
    instruction: "Arrange the words to say passengers must wait until tomorrow morning."
    accepted_answers: [{value: [مسافران, باید, تا, فردا, صبح, صبر, کنین], status: correct}]
    feedback: "*مسافران باید تا فردا صبح صبر کنین* matches the notice exactly."
  prs.a2.unit15.lesson03.exercise05.write_road_closed:
    instruction: "Write that the Kabul-Mazar-i-Sharif road is closed."
    accepted_answers:
      - {value: "راه کابل-مزار شریف بسته است.", status: correct}
      - {value: "راه کابل-مزار شریف بسته است", status: correct}
    feedback: "*راه کابل-مزار شریف بسته است* says the road is closed."

  prs.a2.unit15.lesson04.exercise01.comprehend_cancellation_reason:
    instruction: "Why was همایون's bus cancelled?"
    correct_option: "snowfall"
    distractors: ["a mechanical problem", "not enough passengers", "a driver strike"]
    accepted_answers: [{value: "snowfall", status: correct}]
    feedback: "*آن بس به دلیل برفباری لغو شده* -- cancelled due to snowfall."
  prs.a2.unit15.lesson04.exercise02.comprehend_alternative_route:
    instruction: "What does the station staff say about an alternative route?"
    correct_option: "there is none, the road is closed"
    distractors: ["there is a longer alternative route", "there is a faster route by taxi", "the staff doesn't know"]
    accepted_answers: [{value: "there is none, the road is closed", status: correct}]
    feedback: "*نخیر، راه بسته است* -- no, the road is closed."
  prs.a2.unit15.lesson04.exercise03.recognize_tomorrow_departure_time:
    instruction: "What time does tomorrow's bus leave?"
    correct_option: "8 in the morning"
    distractors: ["9 in the morning", "noon", "8 in the evening"]
    accepted_answers: [{value: "8 in the morning", status: correct}]
    feedback: "*بس فردا ساعت هشت صبح حرکت می‌کند* -- 8 in the morning."
  prs.a2.unit15.lesson04.exercise04.order_ask_next_bus_time:
    instruction: "Arrange the words to ask when the 9 o'clock bus to Mazar-i-Sharif leaves."
    accepted_answers: [{value: [بس, ساعت, نه, به, مزار, شریف, کی, حرکت, "می‌کند"], status: correct}]
    feedback: "*بس ساعت نه به مزار شریف کی حرکت می‌کند؟* asks about the 9 o'clock bus."
  prs.a2.unit15.lesson04.exercise05.dialogue_response_as_homayoun:
    instruction: "Station staff asks: 'How can I help you?' Ask when the 9 o'clock bus to Mazar-i-Sharif leaves."
    accepted_answers:
      - {value: "بس ساعت نه به مزار شریف کی حرکت می‌کند؟", status: correct}
      - {value: "بس ساعت نه به مزار شریف کی حرکت می‌کند", status: correct}
    feedback: "*بس ساعت نه به مزار شریف کی حرکت می‌کند؟* is همایون's question."
  prs.a2.unit15.lesson04.exercise06.write_disruption_summary:
    instruction: "Write that the 9 o'clock bus was cancelled due to snowfall and you must wait until tomorrow morning."
    accepted_answers:
      - {value: "بس ساعت نه به دلیل برفباری لغو شده و باید تا فردا صبح صبر کنم.", status: correct}
      - {value: "بس ساعت نه به دلیل برفباری لغو شده. باید تا فردا صبح صبر کنم.", status: correct}
      - {value: "بس ساعت نه به دلیل برفباری لغو شده، باید تا فردا صبح صبر کنم.", status: correct}
    feedback: "Joining the two facts with *و*, a period, or a comma are equally natural."
