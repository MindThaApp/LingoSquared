course:
  title: Dari A2
  description: >-
    Lower-intermediate Afghan Dari: discussing online habits — social
    media and screen-time vocabulary, giving a simple opinion, reading
    about screen time, and a real conversation between two friends about
    their own habits.

units:
  prs.a2.unit16.online_habits:
    title: Online habits

lessons:
  prs.a2.unit16.lesson01.online_habits_vocabulary: {title: "Words for online habits"}
  prs.a2.unit16.lesson02.describing_and_giving_an_opinion: {title: "Describing and giving an opinion"}
  prs.a2.unit16.lesson03.reading_about_screen_time: {title: "Reading about screen time"}
  prs.a2.unit16.lesson04.friends_dialogue: {title: "A conversation between friends"}

teaching:
  prs.a2.unit16.lesson01.teach.social_media_word:
    title: "Social media"
    gloss: "social media"
    note: "*شبکهٔ اجتماعی* literally means 'social network'."
    example_gloss: "Zarmina looks at social media every day."
  prs.a2.unit16.lesson01.teach.video_word:
    title: "Video"
    gloss: "video"
    note: "*ویدیو* is a direct loanword, used exactly as in English."
    example_gloss: "Homayoun likes watching videos."
  prs.a2.unit16.lesson01.teach.download_word:
    title: "Download"
    gloss: "to download"
    note: "*دانلود کردن* -- *دانلود* is a loanword, paired with *کردن* ('to do')."
    example_gloss: "I download music."
  prs.a2.unit16.lesson01.teach.messaging_app_word:
    title: "Messaging app"
    gloss: "messaging app"
    note: "*پیام‌رسان* literally means 'message-carrier'."
    example_gloss: "I send messages to my friends with a messaging app."
  prs.a2.unit16.lesson01.teach.computer_game_word:
    title: "Computer game"
    gloss: "computer game"
    note: "*بازی کمپیوتری* -- *بازی* means 'game' and *کمپیوتری* means 'computer-related'."
    example_gloss: "Homayoun plays computer games."
  prs.a2.unit16.lesson01.teach.free_time_word:
    title: "Free time"
    gloss: "free time"
    note: "*وقت آزاد* -- *وقت* means 'time' and *آزاد* means 'free'."
    example_gloss: "I look at social media in my free time."
  prs.a2.unit16.lesson01.teach.usually_grammar:
    title: "Usually, with معمولاً"
    gloss: "I usually look at social media in my free time."
    note: "*معمولاً* ('usually') is this unit's first A2-level frequency adverb."
  prs.a2.unit16.lesson01.teach.sometimes_grammar:
    title: "Sometimes, with بعضی اوقات"
    gloss: "Sometimes it takes too much time."
    note: "*بعضی اوقات* ('sometimes') is this unit's second frequency adverb, contrasting with *معمولاً*."
  prs.a2.unit16.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "*و* is the common connecting word used to join clauses in this unit."
  prs.a2.unit16.lesson01.teach.every_day_grammar:
    title: "Every day, with هر روز"
    gloss: "I look at social media every day."
    note: "*هر روز* means 'every day' -- *روز* alone means 'day'."

  prs.a2.unit16.lesson02.teach.ask_how_much_time:
    title: "Ask how much time someone spends"
    gloss: "How much time do you spend on social media?"
    note: "*تو* is the informal 'you' used between friends, unlike the formal *شما*/-*ین* endings used elsewhere in this course for strangers."
  prs.a2.unit16.lesson02.teach.opinion_phrase:
    title: "Give a simple opinion"
    gloss: "In my opinion the internet is useful, but sometimes it takes too much time."
    note: "Reuses the already-established *به نظر من* ('in my opinion') opinion pattern from unit10."
  prs.a2.unit16.lesson02.teach.limit_use_phrase:
    title: "Say you should limit your use"
    gloss: "We should limit our time."
    note: "*محدود کردن* means 'to limit'."
  prs.a2.unit16.lesson02.teach.mostly_word:
    title: "Mostly"
    gloss: "mostly"
    note: "*بیشتر* means 'mostly' or 'more' here."

  prs.a2.unit16.lesson03.teach.user_word:
    title: "User"
    gloss: "user"
    note: "*کاربر* is the general word for a user of an app, device, or service."
    example_gloss: "Many users use their phone every day."
  prs.a2.unit16.lesson03.teach.limit_word:
    title: "To limit"
    gloss: "to limit"
    note: "*محدود کردن* -- the same phrase from lesson02, reused here in a general statement about people rather than 'we'."
    example_gloss: "Some people limit their time."
  prs.a2.unit16.lesson03.teach.article_text:
    title: "A short article about screen time"
    gloss: "Many people use social media for several hours a day. Some people limit their time so they have more time for family and friends."
    note: "A short informational text, in the reading register this unit is teaching."

  prs.a2.unit16.lesson04.teach.turn01:
    title: "همایون asks زرمینه about her time online"
    gloss: "همایون asks زرمینه how much time she spends on social media."
    note: "Reuses lesson02's exact question, and the informal *تو*-register already established for this friend pair."
  prs.a2.unit16.lesson04.teach.turn02:
    title: "زرمینه answers and asks back"
    gloss: "Usually an hour a day. She asks him the same."
    note: "*چطور* here means 'what about (you)?'"
  prs.a2.unit16.lesson04.teach.turn03:
    title: "همایون describes his own habit"
    gloss: "He mostly watches video. Maybe two hours a day."
    note: "*بیشتر* means 'mostly' here."
  prs.a2.unit16.lesson04.teach.turn04:
    title: "زرمینه gives her opinion"
    gloss: "In her opinion that's too much."
    note: "Reuses lesson02's *به نظر من* opinion pattern."
  prs.a2.unit16.lesson04.teach.turn05:
    title: "همایون agrees but says he enjoys it"
    gloss: "Maybe, but he enjoys it."
    note: "*لذت می‌برم* means 'I enjoy (it)'."
  prs.a2.unit16.lesson04.teach.turn06:
    title: "زرمینه suggests limiting use"
    gloss: "Sometimes they should limit their time."
    note: "Reuses lesson02's *محدود کنیم* exactly."
  prs.a2.unit16.lesson04.teach.turn07:
    title: "همایون agrees to use less"
    gloss: "That's right. He'll use it less starting tomorrow."
    note: "*کمتر* means 'less'."
  prs.a2.unit16.lesson04.teach.turn08:
    title: "زرمینه approves"
    gloss: "زرمینه says that's great."
    note: "*عالی است!* is a common way to say 'that's great!'"

exercises:
  prs.a2.unit16.lesson01.exercise01.recognize_social_media:
    instruction: "What does this word mean?"
    correct_option: "social media"
    distractors: ["video", "messaging app", "computer game"]
    accepted_answers: [{value: "social media", status: correct}]
    feedback: "*شبکهٔ اجتماعی* means social media."
  prs.a2.unit16.lesson01.exercise02.recognize_download:
    instruction: "What does this phrase mean?"
    correct_option: "to download"
    distractors: ["free time", "user", "to limit"]
    accepted_answers: [{value: "to download", status: correct}]
    feedback: "*دانلود کردن* means to download."
  prs.a2.unit16.lesson01.exercise03.match_technology_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {"شبکهٔ اجتماعی": "social media", ویدیو: video, "دانلود کردن": "to download", "پیام‌رسان": "messaging app", "بازی کمپیوتری": "computer game", "وقت آزاد": "free time"}, status: correct}
    feedback: "These six words cover the basic vocabulary for this unit's online habits."
  prs.a2.unit16.lesson01.exercise04.order_usually_sentence:
    instruction: "Arrange the words to say I usually look at social media in my free time."
    accepted_answers: [{value: [من, معمولاً, در, وقت, آزاد, "شبکه‌های", اجتماعی, را, "می‌بینم"], status: correct}]
    feedback: "*من معمولاً در وقت آزاد شبکه‌های اجتماعی را می‌بینم.* uses *معمولاً* for a habitual action."
  prs.a2.unit16.lesson01.exercise05.write_download:
    instruction: "Write the Dari phrase for to download."
    accepted_answers:
      - {value: "دانلود کردن", status: correct}
    feedback: "*دانلود کردن* means to download."

  prs.a2.unit16.lesson02.exercise01.recognize_ask_how_much_time:
    instruction: "Which question asks how much time you spend on social media?"
    correct_option: "How much time do you spend on social media?"
    distractors: ["In my opinion the internet is useful, but sometimes it takes too much time.", "We should limit our time.", "Sometimes it takes too much time."]
    accepted_answers: [{value: "How much time do you spend on social media?", status: correct}]
    feedback: "*تو چقدر وقت در شبکه‌های اجتماعی می‌گذرانی؟* asks how much time you spend."
  prs.a2.unit16.lesson02.exercise02.order_limit_use:
    instruction: "Arrange the words to say we should limit our time."
    accepted_answers: [{value: [باید, وقت, خود, را, محدود, کنیم], status: correct}]
    feedback: "*باید وقت خود را محدود کنیم.* says we should limit our time."
  prs.a2.unit16.lesson02.exercise03.dialogue_response_own_habit:
    instruction: "زرمینه asks: 'How much time do you spend on social media?' Answer that you mostly watch video."
    accepted_answers:
      - {value: "من بیشتر ویدیو می‌بینم.", status: correct}
      - {value: "من بیشتر ویدیو می‌بینم", status: correct}
    feedback: "*من بیشتر ویدیو می‌بینم.* describes همایون's own habit."
  prs.a2.unit16.lesson02.exercise04.translate_opinion:
    instruction: "Translate: In my opinion the internet is useful, but sometimes it takes too much time."
    accepted_answers:
      - {value: "به نظر من انترنت مفید است، ولی بعضی اوقات وقت زیاد می‌گیرد.", status: correct}
      - {value: "به نظر من انترنت مفید است. ولی بعضی اوقات وقت زیاد می‌گیرد.", status: correct}
      - {value: "به نظر من انترنت مفید است ولی بعضی اوقات وقت زیاد می‌گیرد.", status: correct}
    feedback: "Joining the two clauses with a comma, a period, or no punctuation before *ولی* are equally natural."
  prs.a2.unit16.lesson02.exercise05.write_limit_use:
    instruction: "Write that we should limit our time."
    accepted_answers:
      - {value: "باید وقت خود را محدود کنیم.", status: correct}
      - {value: "باید وقت خود را محدود کنیم", status: correct}
    feedback: "*باید وقت خود را محدود کنیم.* says we should limit our time."

  prs.a2.unit16.lesson03.exercise01.read_how_much_screen_time:
    instruction: "According to the article, how many hours a day do many people use social media?"
    correct_option: "several hours a day"
    distractors: ["only a few minutes a day", "the article doesn't say", "never"]
    accepted_answers: [{value: "several hours a day", status: correct}]
    feedback: "The article says people use social media *چند ساعت* -- several hours -- a day."
  prs.a2.unit16.lesson03.exercise02.read_why_limit:
    instruction: "According to the article, why do some people limit their time?"
    correct_option: "to have more time for family and friends"
    distractors: ["because it costs money", "because their phone is old", "because their internet is slow"]
    accepted_answers: [{value: "to have more time for family and friends", status: correct}]
    feedback: "The article says it's *برای خانواده و دوستان* -- for family and friends."
  prs.a2.unit16.lesson03.exercise03.recognize_user_word:
    instruction: "What does this word mean?"
    correct_option: "user"
    distractors: ["video", "download", "free time"]
    accepted_answers: [{value: "user", status: correct}]
    feedback: "*کاربر* means user."
  prs.a2.unit16.lesson03.exercise04.order_limit_time_reason:
    instruction: "Arrange the words to say some people limit their time."
    accepted_answers: [{value: [بعضی, افراد, وقت, خود, را, محدود, "می‌کنند"], status: correct}]
    feedback: "*بعضی افراد وقت خود را محدود می‌کنند* matches the article exactly."
  prs.a2.unit16.lesson03.exercise05.write_users_daily_hours:
    instruction: "Write that many people use social media for several hours a day."
    accepted_answers:
      - {value: "بسیاری از مردم روزانه چند ساعت از شبکه‌های اجتماعی استفاده می‌کنند.", status: correct}
      - {value: "بسیاری از مردم روزانه چند ساعت از شبکه‌های اجتماعی استفاده می‌کنند", status: correct}
    feedback: "*بسیاری از مردم روزانه چند ساعت از شبکه‌های اجتماعی استفاده می‌کنند* matches the article."

  prs.a2.unit16.lesson04.exercise01.comprehend_zarmina_frequency:
    instruction: "How much time does زرمینه usually spend on social media?"
    correct_option: "an hour a day"
    distractors: ["two hours a day", "half an hour a day", "she doesn't say"]
    accepted_answers: [{value: "an hour a day", status: correct}]
    feedback: "*معمولاً یک ساعت در روز* -- usually an hour a day."
  prs.a2.unit16.lesson04.exercise02.comprehend_homayoun_frequency:
    instruction: "About how much time does همایون spend online, mostly on video?"
    correct_option: "maybe two hours a day"
    distractors: ["exactly one hour a day", "thirty minutes a day", "he doesn't say"]
    accepted_answers: [{value: "maybe two hours a day", status: correct}]
    feedback: "*شاید دو ساعت در روز* -- maybe two hours a day."
  prs.a2.unit16.lesson04.exercise03.recognize_homayoun_activity:
    instruction: "What does همایون say he mostly does online?"
    correct_option: "watches video"
    distractors: ["plays computer games", "downloads music", "sends messages"]
    accepted_answers: [{value: "watches video", status: correct}]
    feedback: "*من بیشتر ویدیو می‌بینم* -- he mostly watches video."
  prs.a2.unit16.lesson04.exercise04.order_ask_how_much_time:
    instruction: "Arrange the words to ask زرمینه how much time she spends on social media."
    accepted_answers: [{value: [زرمینه, تو, چقدر, وقت, در, "شبکه‌های", اجتماعی, "می‌گذرانی"], status: correct}]
    feedback: "*زرمینه، تو چقدر وقت در شبکه‌های اجتماعی می‌گذرانی؟* asks how much time she spends."
  prs.a2.unit16.lesson04.exercise05.dialogue_response_as_homayoun:
    instruction: "زرمینه asks how much time you spend on social media. Answer as همایون."
    accepted_answers:
      - {value: "من بیشتر ویدیو می‌بینم. شاید دو ساعت در روز.", status: correct}
      - {value: "من بیشتر ویدیو می‌بینم، شاید دو ساعت در روز.", status: correct}
      - {value: "من بیشتر ویدیو می‌بینم و شاید دو ساعت در روز.", status: correct}
    feedback: "Joining همایون's two sentences with a period, a comma, or *و* are equally natural."
  prs.a2.unit16.lesson04.exercise06.write_habit_summary:
    instruction: "Write that زرمینه and you should limit your time."
    accepted_answers:
      - {value: "من و زرمینه باید وقت خود را محدود کنیم.", status: correct}
      - {value: "من و زرمینه باید وقت خود را محدود کنیم", status: correct}
    feedback: "*من و زرمینه باید وقت خود را محدود کنیم.* -- زرمینه and I should limit our time."
