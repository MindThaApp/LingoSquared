course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: describing step by step how a morning or a trip went, including a step you skipped. Compound verbs in the simple past, their negation on the light verb, the position of را, and the connectors اول، بعد، بعد از آن، در آخر.'
units:
  prs.a2.unit22.busy_morning:
    title: A busy morning
lessons:
  prs.a2.unit22.lesson01.morning_words_and_compound_verbs:
    title: Morning words and compound verbs
  prs.a2.unit22.lesson02.more_compound_verbs:
    title: More compound verbs
  prs.a2.unit22.lesson03.negative_compound_verbs:
    title: Negating compound verbs, and where را goes
  prs.a2.unit22.lesson04.telling_in_order:
    title: Telling it in order
  prs.a2.unit22.lesson05.reading_and_listening:
    title: 'Reading and listening: a busy morning'
  prs.a2.unit22.lesson06.morning_conversation:
    title: A conversation about the morning
teaching:
  prs.a2.unit22.lesson01.teach.this_morning:
    title: This morning
    gloss: today morning, this morning
    note: '*امروز* is today and *صبح* is morning. Together *امروز صبح* is this morning, the time frame for this unit. In a Dari sentence the time word comes first and the verb comes last.'
    example_gloss: This morning I went to the office.
  prs.a2.unit22.lesson01.teach.late_early:
    title: Late, early
    gloss: late, early
    note: '*دیر* means late and *زود* means early. Both go in front of the verb part of the sentence, the same place where you would put the English word.'
    example_gloss:
    - This morning I woke up late.
    - Today he woke up early.
  prs.a2.unit22.lesson01.teach.office:
    title: Office
    gloss: office
    note: '*دفتر* is the office, the place where many people in Kabul work on weekday mornings.'
    example_gloss: In the morning I went to the office.
  prs.a2.unit22.lesson01.teach.school:
    title: School
    gloss: school
    note: '*مکتب* is the everyday Afghan word for school. You go to it with *به*, as in *به مکتب رفتم*.'
    example_gloss: He went to school in the morning.
  prs.a2.unit22.lesson01.teach.by_bus_car:
    title: By bus, by car
    gloss: by bus, by car
    note: '*با* means with or by. *با بس* is by bus and *با موتر* is by car. *بس* is the bus and *موتر* is the Afghan word for a car.'
    example_gloss:
    - I went to the office by bus.
    - We went to school by car.
  prs.a2.unit22.lesson01.teach.on_foot:
    title: On foot
    gloss: on foot, walking
    note: '*پیاده* means on foot. *پیاده رفتن* is to go on foot, to walk to a place, and *پیاده* sits just before the verb.'
    example_gloss: I went to school on foot.
  prs.a2.unit22.lesson01.teach.bus_stop:
    title: Bus stop, station
    gloss: bus stop, stop
    note: '*ایستگاه* is a stop or station. *ایستگاه بس* is a bus stop.'
    example_gloss: I went to the bus stop.
  prs.a2.unit22.lesson01.teach.gate:
    title: Gate, door
    gloss: gate, outer door of a house
    note: '*دروازه* is the gate or the outer door of a house. You open it every morning, so you will meet it again with the little word *را* in the next lessons.'
    example_gloss: I opened the gate.
  prs.a2.unit22.lesson01.teach.clothes:
    title: My clothes
    gloss: my clothes
    note: '*لباس* is clothing, *لباس‌ها* is clothes (the plural ending *-ها* is joined with a small gap), and *-م* adds my: *لباس‌هایم* is my clothes.'
    example_gloss: I put on my clothes.
  prs.a2.unit22.lesson01.teach.shower:
    title: Shower
    gloss: shower
    note: '*دوش* is a shower. You do not say wash a shower: you take it, with the verb *گرفتن*, which you will meet in the next lesson.'
    example_gloss: In the morning I took a shower.
  prs.a2.unit22.lesson01.teach.tea:
    title: Tea
    gloss: tea
    note: '*چای* is tea, the usual morning drink. In Dari you eat tea, so the verb is *خوردن*.'
    example_gloss: In the morning I drank tea.
  prs.a2.unit22.lesson01.teach.breakfast:
    title: Breakfast
    gloss: breakfast
    note: '*صبحانه* is breakfast. You will also hear *ناشتا* in Kabul for the same meal; this course uses *صبحانه*.'
    example_gloss: For breakfast I ate bread and had tea.
  prs.a2.unit22.lesson01.teach.wake_up:
    title: To wake up
    gloss: 'to wake up (literally: to become awake)'
    note: '*بیدار* means awake and *شدن* means to become. Together *بیدار شدن* is to wake up. This is a compound verb: a word that is not a verb (here an adjective) plus a light verb.'
    example_gloss: This morning I woke up.
  prs.a2.unit22.lesson01.teach.get_ready:
    title: To get ready
    gloss: 'to get ready (literally: to become ready)'
    note: '*آماده* means ready and *شدن* means to become. *آماده شدن* is to get ready, a second compound verb built with *شدن*.'
    example_gloss: This morning I got ready.
  prs.a2.unit22.lesson01.teach.open:
    title: To open
    gloss: 'to open (literally: to make open)'
    note: '*باز* means open and *کردن* means to do or make. *باز کردن* is to open. It is a compound verb built with *کردن*: you make something open.'
    example_gloss: I opened the gate.
  prs.a2.unit22.lesson01.teach.went_office:
    title: I went to the office
    gloss: I went to the office.
    note: '*رفتم* is the simple past of *رفتن* from unit 19: past stem *رفت* plus *-م*. *به* is to, so *به دفتر رفتم* is I went to the office.'
  prs.a2.unit22.lesson01.teach.opened_gate:
    title: I opened the gate
    gloss: I opened the gate.
    note: '*را* is a small word that marks a specific object, here the gate. Learn the whole sentence for now. Lesson 3 explains exactly where *را* goes.'
  prs.a2.unit22.lesson01.teach.compound_rule:
    title: 'Compound verbs in the past: the ending goes on the light verb'
    gloss: I woke up, you woke up, he/she woke up, we woke up, you (formal or plural) woke up, they woke up
    note: 'Many everyday verbs in Dari are compound verbs: a noun or adjective plus a light verb such as *شدن* or *کردن*. *بیدار شدن* (to wake up), *آماده شدن* (to get ready) and *باز کردن* (to open) are all compound verbs. In the simple past the first part never changes. Only the light verb takes the past ending you already know from *رفتم*: take the infinitive, drop *ن* (*شدن* gives *شد*), then add *-م، -ی، nothing، -یم، -ین، -ند*. So *بیدار شدم* is I woke up, *بیدار شدی* is you woke up (to a friend), *بیدار شد* is he or she woke up, *بیدار شدیم* is we woke up, *بیدار شدین* is you woke up (formal or plural) and *بیدار شدند* is they woke up. The pronoun is optional, because the ending already shows who did it.'
  prs.a2.unit22.lesson02.teach.take_shower:
    title: To take a shower
    gloss: to take a shower
    note: '*دوش گرفتن* is to take a shower. The light verb here is *گرفتن*, to take or to get. Its past stem is *گرفت*, so I took a shower is *دوش گرفتم*.'
    example_gloss: This morning I took a shower.
  prs.a2.unit22.lesson02.teach.take_walk:
    title: To take a walk
    gloss: to take a walk, to stroll
    note: '*قدم* is a step. *قدم زدن* is to take a walk, for pleasure and without a goal. The light verb is *زدن* and its past stem is *زد*: *قدم زدم* is I took a walk. Compare *پیاده رفتن*, to walk to a place.'
    example_gloss: I took a walk in the park.
  prs.a2.unit22.lesson02.teach.talk:
    title: To talk, to speak
    gloss: to talk, to speak
    note: '*حرف* is a word or speech. *حرف زدن* is to talk, again with *زدن*: *حرف زدم* is I talked.'
    example_gloss: I talked with my friend.
  prs.a2.unit22.lesson02.teach.my_friend:
    title: My friend
    gloss: my friend
    note: '*دوست* is a friend and *-م* adds my: *دوستم* is my friend. Put *به* in front of him or her when you phone: *به دوستم*.'
    example_gloss: This morning I talked with my friend.
  prs.a2.unit22.lesson02.teach.phone:
    title: To phone
    gloss: to phone, to make a phone call
    note: '*تیلفون* is the telephone. *تیلفون کردن* is to phone, another compound verb with *کردن*. The person you phone comes with *به*: *به دوستم تیلفون کردم*.'
    example_gloss: I phoned my friend.
  prs.a2.unit22.lesson02.teach.wait:
    title: To wait
    gloss: 'to wait (literally: to pull a wait)'
    note: '*انتظار* is waiting. *انتظار کشیدن* is to wait. The light verb is *کشیدن*, to pull or draw, and its past stem is *کشید*: *انتظار کشیدم* is I waited.'
    example_gloss: I waited at the stop.
  prs.a2.unit22.lesson02.teach.get_on:
    title: To get on, to board
    gloss: to get on, to board (a bus, a car)
    note: '*سوار* means mounted or on board and *شدن* means to become. *سوار شدن* is to get on a bus or into a car. The thing you board comes with *به*: *به بس سوار شدم*.'
    example_gloss: I got on the bus.
  prs.a2.unit22.lesson02.teach.get_off:
    title: To get off
    gloss: to get off, to alight
    note: '*پیاده شدن* is to get off a bus or car. Be careful: *پیاده رفتم* is I walked and *پیاده شدم* is I got off. The vehicle you leave comes with *از*: *از بس پیاده شدم*.'
    example_gloss: I got off the bus.
  prs.a2.unit22.lesson02.teach.put_on:
    title: To put on, to wear
    gloss: to put on (clothes), to wear
    note: '*پوشیدن* is to put on clothes. It is a simple verb, not a compound one: its past stem is *پوشید*, so *پوشیدم* is I put on.'
    example_gloss: I put on my clothes.
  prs.a2.unit22.lesson02.teach.close:
    title: To close
    gloss: to close, to shut
    note: '*بستن* is to close or shut. It is a simple verb with the past stem *بست*, so *بستم* is I closed. It is the opposite of *باز کردن*.'
    example_gloss: I closed the gate.
  prs.a2.unit22.lesson02.teach.arrive:
    title: To arrive
    gloss: to arrive, to reach
    note: '*رسیدن* is to arrive. The place you reach comes with *به*, and the past stem is *رسید*: *به دفتر رسیدم* is I arrived at the office.'
    example_gloss: I arrived at the office.
  prs.a2.unit22.lesson02.teach.light_verbs:
    title: Five light verbs and their past stems
    gloss: I woke up, I opened, I took a shower, I took a walk, I waited
    note: 'A compound verb gets its meaning from both parts, so learn the light verb and the first part together. These five light verbs build most of the compound verbs of a morning. *شدن* (past stem *شد*) means to become: *بیدار شدم*, *سوار شدم*. *کردن* (*کرد*) means to do or make: *باز کردم*, *تیلفون کردم*. *گرفتن* (*گرفت*) means to take: *دوش گرفتم*. *زدن* (*زد*) means to hit or strike but in compounds it just carries the action: *قدم زدم*, *حرف زدم*. *کشیدن* (*کشید*) means to pull or draw: *انتظار کشیدم*. The ending is added to the stem of the light verb in the same way as for *رفتم*. Simple verbs such as *پوشیدن* (*پوشیدم*), *بستن* (*بستم*) and *رسیدن* (*رسیدم*) take the same endings.'
  prs.a2.unit22.lesson03.teach.neg_rule:
    title: 'Negating a compound verb: the ن goes on the light verb'
    gloss: I did not wake up, you did not wake up, he/she did not wake up, we did not wake up, you (formal or plural) did not wake up, they did not wake up
    note: 'In unit 19 you put *ن* in front of a simple past verb: *رفتم* became *نرفتم*. A compound verb is made of two parts, and the *ن* goes on the light verb, never on the first part. *بیدار شدم* (I woke up) becomes *بیدار نشدم* (I did not wake up), and the six forms are *بیدار نشدم، بیدار نشدی، بیدار نشد، بیدار نشدیم، بیدار نشدین، بیدار نشدند*. The same rule works for every light verb: *نکردم، نگرفتم، نزدم، نکشیدم*. Writing *نبیدار شدم* is wrong. Simple verbs behave as before: *نپوشیدم، نبستم، نرسیدم*. There is still no *نمی* in the negative simple past.'
  prs.a2.unit22.lesson03.teach.neg_phone_walk:
    title: The same ن with five light verbs
    gloss: I did not phone, I did not take a walk, I did not wait, I did not take a shower, I did not open
    note: 'Look at the five light verbs from the last lesson and put *ن* on each: *کردم* gives *نکردم* (*تیلفون نکردم*, *باز نکردم*), *زدم* gives *نزدم* (*قدم نزدم*), *کشیدم* gives *نکشیدم* (*انتظار نکشیدم*), *گرفتم* gives *نگرفتم* (*دوش نگرفتم*). The first part stays where it was and the verb after it is negative.'
  prs.a2.unit22.lesson03.teach.no_breakfast:
    title: I did not eat breakfast
    gloss: I did not eat breakfast.
    note: '*نخوردم* is *ن* plus *خوردم*. *خوردن* is a simple verb, so the *ن* is in front of the whole verb. In unit 19 you met *خوردی*, you ate, to a friend: *صبحانه خوردی؟* is did you eat breakfast?'
  prs.a2.unit22.lesson03.teach.on_time:
    title: On time
    gloss: on time
    note: '*وقت* is time. *به وقت* is on time. It goes before the verb, so *به وقت بیدار نشدم* is I did not wake up on time.'
    example_gloss: This morning I did not wake up on time.
  prs.a2.unit22.lesson03.teach.make_tea:
    title: To make, to prepare
    gloss: 'to make, to prepare (literally: to make right)'
    note: '*درست* means right or correct, and *درست کردن* means to make or prepare something, such as tea or food. It is a compound verb with *کردن*. The object comes in front: *چای درست کردم*.'
    example_gloss: I made tea.
  prs.a2.unit22.lesson03.teach.ra_rule:
    title: Where را goes before a compound verb
    gloss: I opened the gate. I did not open the gate. I did not put on my clothes. I made tea.
    note: 'When the object of the verb is a definite thing, one that is known or specific (*دروازه*, the gate you open every morning, or *لباس‌هایم*, my own clothes), Dari marks it with *را*. In a compound verb *را* comes right after the object and before the first part of the verb: *دروازه را باز کردم*, never in the middle of *باز کردم*. The compound verb stays together, and the negative follows the same rule as before: *دروازه را باز نکردم*. When the object is not specific, as in *چای درست کردم* (I made tea, some tea), no *را* is used.'
  prs.a2.unit22.lesson04.teach.first:
    title: First
    gloss: first
    note: '*اول* opens a sequence. It goes at the start of the first clause.'
    example_gloss: First I took a shower.
  prs.a2.unit22.lesson04.teach.then:
    title: Then
    gloss: then, afterwards
    note: '*بعد* continues the sequence after *اول*. It goes at the start of the clause it introduces.'
    example_gloss: Then I put on my clothes.
  prs.a2.unit22.lesson04.teach.after_that:
    title: After that
    gloss: after that
    note: '*بعد از آن* means after that. It is a slightly fuller *بعد* and is useful when you already used *بعد* once and have a third step.'
    example_gloss: After that I closed the gate.
  prs.a2.unit22.lesson04.teach.finally:
    title: Finally
    gloss: finally, in the end
    note: '*در آخر* closes a sequence, after *اول*، *بعد* and *بعد از آن*. *آخر* means the end.'
    example_gloss: Finally I arrived at the office.
  prs.a2.unit22.lesson04.teach.but:
    title: But
    gloss: but
    note: '*ولی* sets a step you did against a step you did not do, or the other way round.'
    example_gloss: I did not eat breakfast, but I drank tea.
  prs.a2.unit22.lesson04.teach.no:
    title: 'No'
    gloss: 'no'
    note: '*نخیر* is the polite, everyday no used to answer a yes or no question. Between friends you may also hear the shorter *نی*.'
    example_gloss: No, I did not phone.
  prs.a2.unit22.lesson04.teach.start_work:
    title: To start, to begin
    gloss: to start, to begin
    note: '*شروع* is a beginning and *شروع کردن* is to start. It is a compound verb with *کردن*, and *کار* is work: *کار را شروع کردم* is I started the work.'
    example_gloss: I started work.
  prs.a2.unit22.lesson04.teach.order_rule:
    title: Telling a morning in order
    gloss: First I took a shower, then I put on my clothes, after that I opened the gate and finally I walked to the office.
    note: 'To tell how a morning went, give every finished step its own past verb and mark the order with *اول* (first), *بعد* (then), *بعد از آن* (after that) and *در آخر* (finally). The steps come in the order they happened. Join them with a comma, a full stop or *و*: *اول دوش گرفتم، بعد لباس‌هایم را پوشیدم.* To add a step that did not happen, put in a negative compound verb: *بعد از آن تیلفون نکردم.* The connector stands at the start of its clause, and the verb stays at the end.'
  prs.a2.unit22.lesson05.teach.way:
    title: Way, road
    gloss: way, road; on the way (with در)
    note: '*راه* is the way or the road. *در راه* is on the way. It tells where in the journey something happened.'
    example_gloss: On the way we talked.
  prs.a2.unit22.lesson05.teach.we_form:
    title: 'Doing it together: the we ending -یم'
    gloss: With my friend we went to school on foot. On the way we talked. Finally we arrived at school.
    note: 'When a friend does the steps with you, change the ending from *-م* to *-یم*: *رفتیم* (we went), *حرف زدیم* (we talked), *رسیدیم* (we arrived). In a compound verb the ending still goes on the light verb only: *حرف زدیم*, not *حرف‌یم زد*. The negative works the same way: *حرف نزدیم* is we did not talk.'
  prs.a2.unit22.lesson05.teach.message:
    title: Soraya writes about her morning
    gloss: This morning I woke up early. First I took a shower and put on my clothes. Then I ate breakfast, but I did not make tea. After that I opened the gate. With my friend we went to school on foot. On the way we talked. Finally we arrived at school.
    note: 'A short written account, in order. Every step is a finished action with a past verb; the compound verbs *بیدار شدم*, *دوش گرفتم*, *حرف زدیم* and the negative *درست نکردم* all keep the light verb last. One step did not happen: *چای درست نکردم*.'
  prs.a2.unit22.lesson05.teach.exchange_q:
    title: Naveed asks Soraya about the tea
    gloss: Soraya, did you make tea this morning?
    note: 'Naveed asks with the past of a compound verb, *درست کردی*, the you (friend) form: the ending *-ی* sits on the light verb.'
  prs.a2.unit22.lesson05.teach.exchange_a:
    title: Soraya answers
    gloss: No, I did not make tea. I ate breakfast.
    note: Soraya says first what did not happen, *چای درست نکردم*, then what did, *صبحانه خوردم*.
  prs.a2.unit22.lesson06.teach.turn01:
    title: Soraya asks Naveed about his morning
    gloss: Naveed, what did you do this morning?
    note: '*چه کار کردی؟* is what did you do? It asks for a finished action, so it uses the past *کردی*.'
  prs.a2.unit22.lesson06.teach.turn02:
    title: Naveed gives the first steps and a step he skipped
    gloss: First I woke up late, then I took a shower and put on my clothes. I did not eat breakfast.
    note: Naveed uses *اول* and *بعد* for the order and ends with a negative step, *صبحانه نخوردم*.
  prs.a2.unit22.lesson06.teach.turn03:
    title: Soraya asks what came next
    gloss: What did you do after that?
    note: '*بعد از آن* is after that, so she asks for the next step.'
  prs.a2.unit22.lesson06.teach.turn04:
    title: Naveed tells how he got to work
    gloss: I opened the gate and walked to the bus stop. I waited at the stop and got on the bus.
    note: 'Four finished steps with four past verbs: *باز کردم، رفتم، انتظار کشیدم، سوار شدم*. Note *دروازه را باز کردم*: *را* comes straight after the object.'
  prs.a2.unit22.lesson06.teach.turn05:
    title: Soraya asks about the phone call
    gloss: Did you phone me?
    note: A yes or no question about a finished action. *به من* is to me.
  prs.a2.unit22.lesson06.teach.turn06:
    title: Naveed says no and finishes his account
    gloss: No, I did not phone. But finally I arrived at the office.
    note: '*نخیر، تیلفون نکردم* answers with the negative compound verb. *ولی در آخر* then closes the account.'
exercises:
  prs.a2.unit22.lesson01.exercise01.recognize_woke_late:
    instruction: What does this sentence mean?
    correct_option: This morning I woke up late
    distractors:
    - This morning I woke up early
    - This morning I got ready late
    - Yesterday morning I woke up late
    accepted_answers:
    - value: This morning I woke up late
      status: correct
    feedback: '*بیدار شدم* is I woke up and *دیر* is late: *امروز صبح دیر بیدار شدم* is this morning I woke up late.'
  prs.a2.unit22.lesson01.exercise02.recognize_opened_gate:
    instruction: What does this sentence mean?
    correct_option: I opened the gate
    distractors:
    - I closed the gate
    - I went to the gate
    - I did not open the gate
    accepted_answers:
    - value: I opened the gate
      status: correct
    feedback: '*باز کردم* is I opened: *باز* plus the past of *کردن*, with the ending *-م*.'
  prs.a2.unit22.lesson01.exercise03.recognize_by_bus:
    instruction: What does this sentence mean?
    correct_option: I went to the office by bus
    distractors:
    - I went to the office on foot
