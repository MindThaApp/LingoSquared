course:
  title: "Dari A1"
  description: >-
    Beginner Afghan Dari: shop and price vocabulary, asking a price
    politely, reading a price label, asking for a quantity, bargaining
    for a discount, and a full market conversation.

units:
  prs.a1.unit10.shopping:
    title: "Shopping and prices"

lessons:
  prs.a1.unit10.lesson01.shopping_vocabulary: {title: "Shopping words"}
  prs.a1.unit10.lesson02.asking_a_price: {title: "Asking a price"}
  prs.a1.unit10.lesson03.reading_a_price_label: {title: "Reading a price label"}
  prs.a1.unit10.lesson04.asking_for_a_quantity: {title: "Asking for a quantity"}
  prs.a1.unit10.lesson05.bargaining_for_a_discount: {title: "Bargaining for a discount"}
  prs.a1.unit10.lesson06.market_dialogue: {title: "A full market conversation"}

teaching:
  prs.a1.unit10.lesson01.teach.dokan:
    title: "Shop"
    gloss: "shop"
    note: "دوکان is the genuine Afghan Dari word for a small local shop, as distinct from Iranian Farsi's مغازه."
  prs.a1.unit10.lesson01.teach.qeymat:
    title: "Price"
    gloss: "price"
    note: "قیمت means price."
  prs.a1.unit10.lesson01.teach.arzan:
    title: "Cheap"
    gloss: "cheap"
    note: "ارزان means cheap or inexpensive."
  prs.a1.unit10.lesson01.teach.gran:
    title: "Expensive"
    gloss: "expensive"
    note: "گران is the opposite of ارزان."
  prs.a1.unit10.lesson01.teach.takhfif:
    title: "Discount"
    gloss: "discount"
    note: "تخفیف means a price discount."
  prs.a1.unit10.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "و is the common connecting word used to join two short statements or requests."

  prs.a1.unit10.lesson02.teach.qeymatesh_chand:
    title: "How much is it?"
    gloss: "How much is it?"
    note: "قیمتش چند است؟ literally asks 'its price, how much is it?'"
  prs.a1.unit10.lesson02.teach.sad_afghani:
    title: "It's one hundred afghanis."
    gloss: "It's one hundred afghanis."
    note: "صد افغانی است states a price using افغانی, the Afghan currency."

  prs.a1.unit10.lesson03.teach.sib:
    title: "Apple(s)"
    gloss: "apple(s)"
    note: "سیب means apple, used here in the plural/generic sense for a batch being sold."
  prs.a1.unit10.lesson03.teach.kilo:
    title: "Kilo"
    gloss: "kilo"
    note: "کیلو is the standard unit for selling produce by weight."
  prs.a1.unit10.lesson03.teach.label_text:
    title: "Apples: one kilo, one hundred afghanis"
    gloss: "Apples: one kilo, one hundred afghanis"
    note: "سیب: یک کیلو صد افغانی is a typical market price label."

  prs.a1.unit10.lesson04.teach.yak_kilo_sib:
    title: "I'd like a kilo of apples."
    gloss: "I'd like a kilo of apples."
    note: "یک کیلو سیب می‌خواهم uses the same یک [item] می‌خواهم pattern taught for food ordering in unit08."
  prs.a1.unit10.lesson04.teach.do_kilo:
    title: "I'd like two kilos."
    gloss: "I'd like two kilos."
    note: "دو کیلو می‌خواهم swaps in دو (two) for a larger quantity."

  prs.a1.unit10.lesson05.teach.takhfif_mitanin:
    title: "Can you give a discount?"
    gloss: "Can you give a discount?"
    note: "تخفیف می‌تانین بتین؟ politely asks for a lower price, using می‌تانین (you can)."
  prs.a1.unit10.lesson05.teach.baraye_shoma:
    title: "For you it comes to 180 afghanis."
    gloss: "For you it comes to 180 afghanis."
    note: "برای شما صد و هشتاد افغانی می‌شه offers a discounted total price -- 20 afghanis off the full 200 for two kilos at 100 each."

  prs.a1.unit10.lesson06.teach.befarmayin:
    title: "Please, go ahead"
    gloss: "please, go ahead"
    note: "بفرمایین is a warm, polite greeting/invitation a shopkeeper uses when a customer arrives."
  prs.a1.unit10.lesson06.teach.turn01:
    title: "Hello, please come in."
    gloss: "Hello, please come in."
    note: "The shopkeeper greets the customer warmly."
  prs.a1.unit10.lesson06.teach.turn02:
    title: "Hello. How much are the apples?"
    gloss: "Hello. How much are the apples?"
    note: "The customer asks the price of the apples."
  prs.a1.unit10.lesson06.teach.turn03:
    title: "One kilo is one hundred afghanis."
    gloss: "One kilo is one hundred afghanis."
    note: "The shopkeeper states the per-kilo price."
  prs.a1.unit10.lesson06.teach.turn04:
    title: "I'd like two kilos. Can you give a discount?"
    gloss: "I'd like two kilos. Can you give a discount?"
    note: "The customer states the quantity and asks for a discount."
  prs.a1.unit10.lesson06.teach.turn05:
    title: "Yes, for you two kilos comes to 180 afghanis."
    gloss: "Yes, for you two kilos comes to 180 afghanis."
    note: "The shopkeeper agrees and gives the discounted total -- consistent with the 100-afghani-per-kilo price stated in turn03 (200 minus a 20-afghani discount)."
  prs.a1.unit10.lesson06.teach.turn06:
    title: "Very good, thank you."
    gloss: "Very good, thank you."
    note: "The customer accepts the price and thanks the shopkeeper."

exercises:
  prs.a1.unit10.lesson01.exercise01.recognize_dokan:
    instruction: "What does this word mean?"
    correct_option: "shop"
    distractors: ["price", "discount", "expensive"]
    accepted_answers: [{value: "shop", status: correct}]
    feedback: "دوکان means shop."
  prs.a1.unit10.lesson01.exercise02.recognize_takhfif:
    instruction: "What does this word mean?"
    correct_option: "discount"
    distractors: ["shop", "price", "cheap"]
    accepted_answers: [{value: "discount", status: correct}]
    feedback: "تخفیف means discount."
  prs.a1.unit10.lesson01.exercise03.listen_words:
    instruction: "Listen and select the word you hear."
    correct_option: "expensive"
    distractors: ["shop", "price", "cheap"]
    accepted_answers: [{value: "expensive", status: correct}]
    feedback: "The recording lists shopping words; گران means expensive."
  prs.a1.unit10.lesson01.exercise04.match_words:
    instruction: "Match each Dari word with its meaning."
    accepted_answers:
      - {value: {دوکان: shop, قیمت: price, ارزان: cheap, گران: expensive, تخفیف: discount, و: and}, status: correct}
    feedback: "These are the core shopping words for this unit."
  prs.a1.unit10.lesson01.exercise05.order_arzan_gran:
    instruction: "Arrange the words: cheap, expensive."
    accepted_answers: [{value: [ارزان, گران], status: correct}]
    feedback: "ارزان (cheap) and گران (expensive) are opposites."
  prs.a1.unit10.lesson01.exercise06.translate_discount:
    instruction: "Translate into Dari: discount."
    accepted_answers: [{value: تخفیف, status: correct}]
    feedback: "تخفیف means discount."
  prs.a1.unit10.lesson01.exercise07.write_qeymat:
    instruction: "Write the Dari word for price."
    accepted_answers: [{value: قیمت, status: correct}]
    feedback: "قیمت means price."

  prs.a1.unit10.lesson02.exercise01.recognize_price_question:
    instruction: "What does this phrase mean?"
    correct_option: "How much is it?"
    distractors: ["It's one hundred afghanis.", "I'd like two kilos.", "Can you give a discount?"]
    accepted_answers: [{value: "How much is it?", status: correct}]
    feedback: "قیمتش چند است؟ asks how much something costs."
  prs.a1.unit10.lesson02.exercise02.recognize_price_answer:
    instruction: "What does this sentence mean?"
    correct_option: "It's one hundred afghanis."
    distractors: ["How much is it?", "I'd like a kilo of apples.", "Very good, thank you."]
    accepted_answers: [{value: "It's one hundred afghanis.", status: correct}]
    feedback: "صد افغانی است states the price."
  prs.a1.unit10.lesson02.exercise03.listen_price_question:
    instruction: "Listen and select the question you hear."
    correct_option: "قیمتش چند است؟"
    distractors: ["تخفیف می‌تانین بتین؟", "یک کیلو سیب می‌خواهم"]
    accepted_answers: [{value: "قیمتش چند است؟", status: correct}]
    feedback: "The speaker asks قیمتش چند است؟"
  prs.a1.unit10.lesson02.exercise04.match_price_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"قیمتش چند است؟": "How much is it?", "صد افغانی است.": "It's one hundred afghanis.", دوکان: shop, قیمت: price, ارزان: cheap, گران: expensive, تخفیف: discount}, status: correct}
    feedback: "These cover asking and stating a price, plus a review of this unit's shopping words."
  prs.a1.unit10.lesson02.exercise05.order_price_question:
    instruction: "Arrange the words to ask how much something costs."
    accepted_answers: [{value: [قیمتش, چند, است], status: correct}]
    feedback: "قیمتش چند است؟ asks the price."
  prs.a1.unit10.lesson02.exercise06.translate_price_question:
    instruction: "Translate into Dari: How much is it?"
    accepted_answers:
      - {value: "قیمتش چند است؟", status: correct}
      - {value: "قیمتش چند است", status: correct}
    feedback: "قیمتش چند است؟ is the natural way to ask."
  prs.a1.unit10.lesson02.exercise07.speak_ask_price:
    instruction: "Ask the shopkeeper how much something costs."
    accepted_answers:
      - {value: "قیمتش چند است؟", status: correct}
      - {value: "قیمتش چند است", status: correct}
    feedback: "قیمتش چند است؟ correctly asks the price."

  prs.a1.unit10.lesson03.exercise01.recognize_item:
    instruction: "What is being sold on the label?"
    correct_option: "apples"
    distractors: ["bread", "tea", "rice"]
    accepted_answers: [{value: "apples", status: correct}]
    feedback: "سیب means apples."
  prs.a1.unit10.lesson03.exercise02.recognize_price_on_label:
    instruction: "What is the price per kilo on the label?"
    correct_option: "100 afghanis"
    distractors: ["180 afghanis", "50 afghanis", "200 afghanis"]
    accepted_answers: [{value: "100 afghanis", status: correct}]
    feedback: "The label reads صد افغانی (100 afghanis) per kilo."
  prs.a1.unit10.lesson03.exercise03.listen_label:
    instruction: "Listen and select the label you hear."
    correct_option: "سیب یک کیلو صد افغانی"
    distractors: ["قیمتش چند است؟", "دو کیلو می‌خواهم"]
    accepted_answers: [{value: "سیب یک کیلو صد افغانی", status: correct}]
    feedback: "The recording reads the price label: سیب یک کیلو صد افغانی."
  prs.a1.unit10.lesson03.exercise04.match_label_parts:
    instruction: "Match each part of the label with its meaning."
    accepted_answers:
      - {value: {سیب: apples, کیلو: kilo, "صد افغانی": "100 afghanis", دوکان: shop, قیمت: price, ارزان: cheap, گران: expensive, تخفیف: discount}, status: correct}
    feedback: "Together سیب، کیلو، صد افغانی state: apples, one kilo, 100 afghanis; the rest reviews this unit's shopping words."
  prs.a1.unit10.lesson03.exercise05.order_label:
    instruction: "Arrange the words to form the price label."
    accepted_answers: [{value: [سیب, یک, کیلو, صد, افغانی], status: correct}]
    feedback: "سیب یک کیلو صد افغانی reads the label in order."
  prs.a1.unit10.lesson03.exercise06.translate_label:
    instruction: "Translate into Dari: Apples, one kilo, one hundred afghanis."
    accepted_answers:
      - {value: "سیب یک کیلو صد افغانی", status: correct}
    feedback: "سیب یک کیلو صد افغانی is the natural label format."
  prs.a1.unit10.lesson03.exercise07.write_own_label:
    instruction: "Write a price label: apples, one kilo, one hundred afghanis."
    accepted_answers:
      - {value: "سیب یک کیلو صد افغانی", status: correct}
    feedback: "سیب یک کیلو صد افغانی correctly labels the item and price."

  prs.a1.unit10.lesson04.exercise01.recognize_quantity_request:
    instruction: "What does this sentence mean?"
    correct_option: "I'd like a kilo of apples."
    distractors: ["I'd like two kilos.", "How much is it?", "Can you give a discount?"]
    accepted_answers: [{value: "I'd like a kilo of apples.", status: correct}]
    feedback: "یک کیلو سیب می‌خواهم requests one kilo of apples."
  prs.a1.unit10.lesson04.exercise02.recognize_do_word:
    instruction: "What does this word mean?"
    correct_option: "two"
    distractors: ["one", "three", "ten"]
    accepted_answers: [{value: "two", status: correct}]
    feedback: "دو means two."
  prs.a1.unit10.lesson04.exercise03.listen_quantity:
    instruction: "Listen and select the sentence you hear."
    correct_option: "یک کیلو سیب می‌خواهم"
    distractors: ["دو کیلو می‌خواهم", "تخفیف می‌تانین بتین؟"]
    accepted_answers: [{value: "یک کیلو سیب می‌خواهم", status: correct}]
    feedback: "The speaker says یک کیلو سیب می‌خواهم."
  prs.a1.unit10.lesson04.exercise04.match_quantity_phrases:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - {value: {"یک کیلو سیب می‌خواهم": "I'd like a kilo of apples.", "دو کیلو می‌خواهم": "I'd like two kilos.", سیب: apples, کیلو: kilo, "صد افغانی": "100 afghanis", دوکان: shop, قیمت: price}, status: correct}
    feedback: "These cover asking for one and two kilos, plus a review of earlier vocabulary."
  prs.a1.unit10.lesson04.exercise05.order_do_kilo:
    instruction: "Arrange the words to say 'I'd like two kilos.'"
    accepted_answers: [{value: [دو, کیلو, می‌خواهم], status: correct}]
    feedback: "دو کیلو می‌خواهم means I'd like two kilos."
  prs.a1.unit10.lesson04.exercise06.translate_quantity:
    instruction: "Translate into Dari: I'd like two kilos."
    accepted_answers:
      - {value: "دو کیلو می‌خواهم", status: correct}
    feedback: "دو کیلو می‌خواهم is the natural way to say this."
  prs.a1.unit10.lesson04.exercise07.speak_ask_quantity:
    instruction: "Tell the shopkeeper you'd like two kilos."
    accepted_answers:
      - {value: "دو کیلو می‌خواهم", status: correct}
    feedback: "دو کیلو می‌خواهم correctly requests two kilos."

  prs.a1.unit10.lesson05.exercise01.recognize_discount_request:
    instruction: "What does this question mean?"
    correct_option: "Can you give a discount?"
    distractors: ["How much is it?", "I'd like two kilos.", "Very good, thank you."]
    accepted_answers: [{value: "Can you give a discount?", status: correct}]
    feedback: "تخفیف می‌تانین بتین؟ politely asks for a discount."
  prs.a1.unit10.lesson05.exercise02.recognize_discounted_price:
    instruction: "What does this phrase mean?"
    correct_option: "180 afghanis"
    distractors: ["100 afghanis", "200 afghanis", "80 afghanis"]
    accepted_answers: [{value: "180 afghanis", status: correct}]
    feedback: "صد و هشتاد افغانی means 180 afghanis."
  prs.a1.unit10.lesson05.exercise03.listen_discount_request:
    instruction: "Listen and select the question you hear."
    correct_option: "تخفیف می‌تانین بتین؟"
    distractors: ["قیمتش چند است؟", "دو کیلو می‌خواهم"]
    accepted_answers: [{value: "تخفیف می‌تانین بتین؟", status: correct}]
    feedback: "The speaker asks تخفیف می‌تانین بتین؟"
  prs.a1.unit10.lesson05.exercise04.match_discount_phrases:
    instruction: "Match each phrase with its meaning."
    accepted_answers:
      - {value: {"تخفیف می‌تانین بتین؟": "Can you give a discount?", "برای شما صد و هشتاد افغانی می‌شه": "For you it comes to 180 afghanis.", "یک کیلو سیب می‌خواهم": "I'd like a kilo of apples.", "دو کیلو می‌خواهم": "I'd like two kilos.", سیب: apples, کیلو: kilo}, status: correct}
    feedback: "These cover asking for and receiving a discount, plus a review of the quantity phrases."
  prs.a1.unit10.lesson05.exercise05.order_discount_request:
    instruction: "Arrange the words to politely ask for a discount."
    accepted_answers: [{value: [تخفیف, می‌تانین, بتین], status: correct}]
    feedback: "تخفیف می‌تانین بتین؟ politely asks for a discount."
  prs.a1.unit10.lesson05.exercise06.translate_discount_request:
    instruction: "Translate into Dari: Can you give a discount?"
    accepted_answers:
      - {value: "تخفیف می‌تانین بتین؟", status: correct}
      - {value: "تخفیف می‌تانین بتین", status: correct}
    feedback: "تخفیف می‌تانین بتین؟ is the natural, polite way to ask."
  prs.a1.unit10.lesson05.exercise07.speak_ask_discount:
    instruction: "Politely ask the shopkeeper for a discount."
    accepted_answers:
      - {value: "تخفیف می‌تانین بتین؟", status: correct}
      - {value: "تخفیف می‌تانین بتین", status: correct}
    feedback: "تخفیف می‌تانین بتین؟ correctly and politely asks for a discount."

  prs.a1.unit10.lesson06.exercise01.listen_context:
    instruction: "Listen to the conversation. What does the customer buy, and how many kilos?"
    correct_option: "two kilos of apples"
    distractors: ["one kilo of apples", "two kilos of bread", "one kilo of rice"]
    accepted_answers: [{value: "two kilos of apples", status: correct}]
    feedback: "The customer buys two kilos of سیب (apples), with a discount."
  prs.a1.unit10.lesson06.exercise02.recognize_item_bought:
    instruction: "What is the customer buying?"
    correct_option: "apples"
    distractors: ["bread", "tea", "rice"]
    accepted_answers: [{value: "apples", status: correct}]
    feedback: "The customer asks about سیب (apples)."
  prs.a1.unit10.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each topic with the correct fact from the dialogue."
    accepted_answers:
      - {value: {"Price per kilo": "100 afghanis", "Discounted price for two kilos": "180 afghanis", دوکان: shop, ارزان: cheap, گران: expensive, تخفیف: discount, سیب: apples}, status: correct}
    feedback: "One kilo costs 100 afghanis; with the discount, two kilos comes to 180 afghanis (20 afghanis off the full 200) -- the rest reviews this unit's shopping words."
  prs.a1.unit10.lesson06.exercise04.order_final_agreement:
    instruction: "Arrange the words for the customer's closing agreement."
    accepted_answers: [{value: [بسیار, خوب, تشکر], status: correct}]
    feedback: "بسیار خوب، تشکر means 'Very good, thank you.'"
  prs.a1.unit10.lesson06.exercise05.listen_discounted_total:
    instruction: "Listen and type the shopkeeper's discounted total."
    accepted_answers:
      - {value: "صد و هشتاد افغانی می‌شه", status: correct}
    feedback: "The shopkeeper says صد و هشتاد افغانی می‌شه (it comes to 180 afghanis)."
  prs.a1.unit10.lesson06.exercise06.dialogue_response_ask_discount:
    instruction: "The shopkeeper just said one kilo is 100 afghanis. Respond as the customer, asking for two kilos and requesting a discount."
    accepted_answers:
      - {value: "دو کیلو می‌خواهم. تخفیف می‌تانین بتین؟", status: correct}
      - {value: "دو کیلو می‌خواهم و تخفیف می‌تانین بتین؟", status: correct}
    feedback: "دو کیلو می‌خواهم. تخفیف می‌تانین بتین؟ states the quantity and asks for a discount -- two separate moments, joined by a period or with و."
  prs.a1.unit10.lesson06.exercise07.write_purchase_summary:
    instruction: "Write a short summary of the purchase: two kilos of apples for 180 afghanis."
    accepted_answers:
      - {value: "دو کیلو سیب صد و هشتاد افغانی", status: correct}
    feedback: "دو کیلو سیب صد و هشتاد افغانی summarizes the purchase."
  prs.a1.unit10.lesson06.exercise08.speak_full_market_scene:
    instruction: "You are at the market. Ask the price of apples, say you want two kilos, and ask for a discount."
    accepted_answers:
      - {value: "سیب‌ها قیمتش چند است؟ دو کیلو می‌خواهم. تخفیف می‌تانین بتین؟", status: correct}
      - {value: "سیب‌ها قیمتش چند است؟ دو کیلو می‌خواهم و تخفیف می‌تانین بتین؟", status: correct}
    feedback: "This combines the price question, the quantity request, and the discount request taught across this unit -- joining the last two with a period or with و are equally natural."
