  notes: "2026-07-10 fresh-context review (Claude) found no real bugs in this unit's overlay. Checked: compiler validation (0 errors/0 warnings, run across all of prs units 36-52 together, including this file); no stray unquoted yes/no/true/false/on/off YAML booleans anywhere (title/gloss/note/example_gloss/instruction/correct_option/distractors/feedback); no internal-jargon/snake_case leaks in any learner-facing English string; every dialogue teaching-card title matches its own gloss exactly (English translations are internally consistent across gloss/correct_option/feedback/accepted_answers/distractors/matching_pairs for the same Dari sentence); no audio-dependent exercise types exist, so the same-speaker-distractor bug class does not apply. English translations read as accurate and natural throughout.\n\nReview 2026-10-20 (en-prs A1 pass): 2 fixes - کتابدار note no longer says book-keeper (false friend for accountant); stray Dari و replaced by and inside an English note. NATIVE FLAGS: پس دادن vs واپس دادن for returning a book; قرض for borrowing a library book (vs امانت), and the example این کتاب قرض است; یک کتاب را از کتابدار می‌خواهم (را after یک)."
course:
  title: Dari A1
  description: "Beginner Kabul Dari: borrow and return a simple library item, ask for the due date, and read a short passage about a borrowed book -- ask which book someone wants, offer and confirm a return date, and understand a basic library exchange."
units:
  prs.a1.unit43.library:
    title: The library
    description: Ask for a book, borrow and return it, ask for and confirm a return date, and read a short passage about a borrowed book.
lessons:
  prs.a1.unit43.lesson01.library_vocabulary:
    title: Library vocabulary
  prs.a1.unit43.lesson02.asking_return_date:
    title: Asking the return date
  prs.a1.unit43.lesson03.borrowing_and_returning:
    title: Borrowing and returning the book
  prs.a1.unit43.lesson04.library_dialogue:
    title: Library dialogue
  prs.a1.unit43.lesson05.reading:
    title: Reading about the borrowed book
  prs.a1.unit43.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit43.lesson01.teach.review_book_have_is_in:
    title: "Review: book, I have, is, in"
    gloss: book / I have / is / in
    note: "کتاب (from unit04/unit11/unit26), دارم, است, and در are review words used to talk about a book."
  prs.a1.unit43.lesson01.teach.review_want_one:
    title: "Review: I want, a/one"
    gloss: I want / a / one
    note: "می‌خواهم (from unit17) and یک (from unit04) combine to say what you want."
  prs.a1.unit43.lesson01.teach.library_word:
    title: Library
    gloss: library
    note: "کتابخانه is the standard Dari word for library, built from کتاب (book) and خانه (house)."
    example_gloss: The book is in the library.
  prs.a1.unit43.lesson01.teach.librarian_word:
    title: Librarian
    gloss: librarian
    note: "کتابدار literally means \"book-holder\" (someone who looks after the books), formed the same way as دکاندار (\"shopkeeper,\" unit08)."
    example_gloss: The librarian is at the library.
  prs.a1.unit43.lesson01.teach.want_book_phrase:
    title: I want a book
    gloss: I want a book.
    note: "یک کتاب می‌خواهم combines یک (a/one), کتاب (book), and می‌خواهم (I want)."
  prs.a1.unit43.lesson01.teach.review_from_object_marker:
    title: "Review: from, object marker"
    gloss: from / (object marker)
    note: "از (from) and را (marks the object of a sentence, from unit14/unit26) are review words."
  prs.a1.unit43.lesson01.teach.want_book_from_librarian_phrase:
    title: I want the book from the librarian
    gloss: I want the book from the librarian.
    note: "از کتابدار (from the librarian) is added to کتاب را می‌خواهم."
  prs.a1.unit43.lesson01.teach.want_one_book_from_librarian_phrase:
    title: I want a book from the librarian
    gloss: I want a book from the librarian.
    note: "Combines یک (a/one) with کتاب را از کتابدار می‌خواهم."
  prs.a1.unit43.lesson02.teach.review_date_day_monday:
    title: "Review: date, day, Monday"
    gloss: date / day / Monday
    note: "تاریخ, روز, and دوشنبه (all from unit09) are review words used to ask about a return date."
  prs.a1.unit43.lesson02.teach.review_which_is:
    title: "Review: which, is"
    gloss: which / is
    note: "کدام (from unit14) and است are review words used to ask a question."
  prs.a1.unit43.lesson02.teach.return_giving_back_word:
    title: Returning / giving back
    gloss: returning / giving back
    note: "پس دادن literally means \"to give back\"; پس (back) combines with دادن (to give)."
    example_gloss: The return date is Monday.
  prs.a1.unit43.lesson02.teach.ask_return_date_phrase:
    title: Which day is the return date?
    gloss: Which day is the book's return date?
    note: "تاریخ پس دادن کتاب کدام روز است؟ asks when a borrowed book is due back."
  prs.a1.unit43.lesson02.teach.return_date_answer_phrase:
    title: The return date is Monday
    gloss: The return date is Monday.
    note: "تاریخ پس دادن دوشنبه است answers the question with a specific day."
  prs.a1.unit43.lesson03.teach.review_want_book_one_this:
    title: "Review: I want, book, a/one, this"
    gloss: I want / book / a / one / this
    note: "می‌خواهم، کتاب، یک، and این are review words used to ask for a specific book."
  prs.a1.unit43.lesson03.teach.get_word:
    title: Get / take
    gloss: get / take
    note: "بگیرم is the subjunctive form (\"that I get/take\"), the same form unit42 used with می‌خواهم to say \"I want to get.\""
    example_gloss: I want to get a book.
  prs.a1.unit43.lesson03.teach.loan_word:
    title: Loan
    gloss: loan
    note: "قرض means loan or borrowing; قرض گرفتن (\"to take as a loan\") is the everyday Dari way to say \"to borrow.\""
    example_gloss: This book is borrowed.
  prs.a1.unit43.lesson03.teach.want_borrow_book_phrase:
    title: I want to borrow the book
    gloss: I want to borrow the book.
    note: "می‌خواهم کتاب را قرض بگیرم combines می‌خواهم, کتاب را, قرض, and the subjunctive بگیرم."
  prs.a1.unit43.lesson03.teach.give_back_word:
    title: Give (back)
    gloss: give (back)
    note: "بدهم is the subjunctive form of دادن (to give); with پس (back) it means \"to give back / return.\""
    example_gloss: I want to give it back.
  prs.a1.unit43.lesson03.teach.want_return_book_phrase:
    title: I want to return the book
    gloss: I want to return the book.
    note: "می‌خواهم کتاب را پس بدهم combines می‌خواهم, کتاب را, پس, and the subjunctive بدهم."
  prs.a1.unit43.lesson03.teach.review_very_good:
    title: "Review: very, good"
    gloss: very / good
    note: "بسیار (from unit09/unit11/unit42) and خوب are review words used to confirm something."
  prs.a1.unit43.lesson03.teach.good_answer_phrase:
    title: That's good
    gloss: That's good.
    note: "خوب است confirms that something works."
  prs.a1.unit43.lesson04.teach.review_hello_want:
    title: "Review: hello, I want"
    gloss: hello / I want
    note: "سلام and می‌خواهم are review words used in the dialogue."
  prs.a1.unit43.lesson04.teach.review_very_thanks_welcome:
    title: "Review: very, thanks a lot, you're welcome"
    gloss: very / thanks a lot / you're welcome
    note: "بسیار, تشکر زیاد (from unit01/unit40), and خواهش می‌کنم are review words used in the dialogue."
  prs.a1.unit43.lesson04.teach.dialogue_line1:
    title: "Homayoun: Hello. I want to borrow a book."
    gloss: Hello. I want to borrow a book.
  prs.a1.unit43.lesson04.teach.dialogue_line2:
    title: "Librarian: Hello. Which book do you want?"
    gloss: Hello. Which book do you want?
    note: "می‌خواهین (from unit13) is the polite plural form of \"you want.\""
  prs.a1.unit43.lesson04.teach.dialogue_line3:
    title: "Homayoun: I want this book."
    gloss: I want this book.
  prs.a1.unit43.lesson04.teach.dialogue_line4:
    title: "Librarian: Good. The return date is Monday."
    gloss: Good. The return date is Monday.
  prs.a1.unit43.lesson04.teach.dialogue_line5:
    title: "Homayoun: Very good. Thanks a lot."
    gloss: Very good. Thanks a lot.
  prs.a1.unit43.lesson04.teach.dialogue_line6:
    title: "Librarian: You're welcome."
    gloss: You're welcome.
  prs.a1.unit43.lesson05.teach.review_he_she_has:
    title: "Review: Homayoun, he/she, he/she has"
    gloss: Homayoun / he/she / he/she has
    note: "همایون (from unit09/unit11/unit16/unit20-unit42), او (from unit03), and دارد are review words used in the reading passage."
  prs.a1.unit43.lesson05.teach.reading_passage:
    title: Reading about the borrowed book
    gloss: "Homayoun has a book. His book is from the library. His book's return date is Monday. Homayoun is happy."
  prs.a1.unit43.lesson06.teach.review_wrap_up_words:
    title: "Review: I don't have, but, you (formal)"
    gloss: "I don't have / but / you (formal)"
    note: "ندارم, اما, and شما (from unit03/unit14/unit28/unit32/unit39-unit42) are review words used to contrast two days."
  prs.a1.unit43.lesson06.teach.review_tuesday:
    title: "Review: Tuesday"
    gloss: Tuesday
    note: "سه‌شنبه (from unit09) is a review word."
  prs.a1.unit43.lesson06.teach.contrast_phrase:
    title: I have a book Monday, but not Tuesday
    gloss: I have a book Monday, but I don't have one Tuesday.
    note: "اما contrasts having a book Monday with not having one Tuesday."
  prs.a1.unit43.lesson06.teach.formal_question_phrase:
    title: Which book do you want?
    gloss: Which book do you want?
    note: "The formal شما-prefixed version of asking which book someone wants."
