course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying what was going on when something else happened. The ongoing past with می‌ and the past stem, the optional در حال ... بودم, the simple past for the interrupting event, linked with وقتی که, ناگهان and همان وقت.'
units:
  prs.a2.unit24.what_was_happening:
    title: What was happening when...
lessons:
  prs.a2.unit24.lesson01.words_and_continuing_past:
    title: Weather and street words, and the form می‌رفتم
  prs.a2.unit24.lesson02.more_verbs_and_things:
    title: More verbs, and things from the story
  prs.a2.unit24.lesson03.contrast_finished_or_ongoing:
    title: Finished action or action in progress
  prs.a2.unit24.lesson04.telling_what_was_happening:
    title: 'Telling what was happening: وقتی که …'
  prs.a2.unit24.lesson05.reading_and_listening:
    title: Reading and listening about an incident
  prs.a2.unit24.lesson06.conversation_and_mixed:
    title: A conversation about last night
teaching:
  prs.a2.unit24.lesson01.teach.sarak:
    title: Street
    gloss: street, road
    note: '*سرک* is a street or road. With *در* it means in the street: *در سرک*. The unit starts on the street because most of our small incidents happen there.'
    example_gloss: Our office is near the street.
  prs.a2.unit24.lesson01.teach.piyada:
    title: On foot
    gloss: on foot, walking
    note: '*پیاده* means on foot. *پیاده می‌روم* is I go on foot, I walk. Here the verb is the present *می‌روم*; in this unit you will meet the past of the same pattern.'
    example_gloss: Every day I go to the office on foot.
  prs.a2.unit24.lesson01.teach.rain:
    title: Rain
    gloss: rain
    note: '*باران* is rain. *شروع شد* means started or began: *باران شروع شد* is the rain started. You will use this pair for the interrupting event all through the unit.'
    example_gloss: The rain started.
  prs.a2.unit24.lesson01.teach.snow:
    title: It rains, it snows
    gloss: it is raining, it is snowing
    note: '*برف* is snow. The verb *باریدن* (to fall as rain or snow) is used for both: *باران می‌بارد* is it is raining and *برف می‌بارد* is it is snowing. Both are present forms with *می*.'
    example_gloss:
    - Today it is raining.
    - In Kabul it is snowing.
  prs.a2.unit24.lesson01.teach.wind:
    title: Wind
    gloss: wind
    note: '*باد* is wind. To say it is windy, say there is a lot of wind: *باد زیاد است*.'
    example_gloss: Today there is a lot of wind.
  prs.a2.unit24.lesson01.teach.traffic:
    title: Traffic
    gloss: traffic
    note: '*ترافیک* is traffic. *ترافیک زیاد* is heavy traffic, a very common reason to be late.'
    example_gloss: There is heavy traffic in the street.
  prs.a2.unit24.lesson01.teach.imperfect_paradigm:
    title: 'Was going: می + past stem + endings'
    gloss: I was going, you were going, he/she was going, we were going, you (formal or plural) were going, they were going
    note: 'You already know the simple past for a finished action: *رفتم* is I went. To say what was going on at a moment in the past, put *می‌* in front of the past verb: *می‌رفتم* is I was going. The pattern is *می‌* + past stem (*رفت*) + the same endings: *می‌رفتم، می‌رفتی، می‌رفت، می‌رفتیم، می‌رفتین، می‌رفتند*. The pronouns *من، تو، او، ما، شما، آن‌ها* are optional. Weather works the same way: *باران می‌بارید* is it was raining and *برف می‌بارید* is it was snowing. Compare the present *می‌روم* (I go): only the stem and the ending change. The same *می‌رفتم* form can also mean I used to go (a habit), as in *هر روز پیاده می‌رفتم*; the sentence around it tells you which meaning is meant. In this unit it will mostly mean was going.'
  prs.a2.unit24.lesson02.teach.car:
    title: Car
    gloss: car
    note: '*موتر* is the everyday Afghan word for a car. *در موتر* is in the car.'
    example_gloss: Our car is new.
  prs.a2.unit24.lesson02.teach.phone:
    title: Telephone
    gloss: telephone, phone
    note: '*تیلفون* is a telephone. Add *-م* to say my: *تیلفونم* is my phone.'
    example_gloss: My phone is on.
  prs.a2.unit24.lesson02.teach.umbrella:
    title: Umbrella
    gloss: umbrella
    note: '*چتر* is an umbrella. Rain and an umbrella go together: *چتر دارم* is I have an umbrella and *چتر ندارم* is I do not have one.'
    example_gloss: Today it is raining, I have an umbrella.
  prs.a2.unit24.lesson02.teach.wet:
    title: To get wet
    gloss: to get wet
    note: '*خیس* is wet and *خیس شدن* is to get wet. *خیس شدم* is I got wet, a common result of rain.'
    example_gloss: If it rains, I get wet.
  prs.a2.unit24.lesson02.teach.ring:
    title: To ring, to phone
    gloss: to ring, to phone someone
    note: '*زنگ زدن* has two uses. A phone can ring: *تیلفونم زنگ زد* (my phone rang). A person can phone someone: *دوستم به من زنگ زد* (my friend phoned me). The past stem is *زد*, from *زدن*.'
    example_gloss: My friend phoned me.
  prs.a2.unit24.lesson02.teach.driving:
    title: To drive
    gloss: to drive, to do the driving
    note: '*رانندگی کردن* is to drive. *رانندگی* is the driving and *کردن* is the verb to do, as in *خرید کردن*. It is a noun plus *کردن*, so the verb part is what changes: *رانندگی کردم*.'
    example_gloss: I drive every day.
  prs.a2.unit24.lesson02.teach.more_verbs:
    title: The same pattern with other verbs
    gloss: I was doing, you were doing, I was eating, I was seeing or watching, I was coming
    note: 'Every verb follows the same rule: *می‌* + past stem + ending. *کردن* gives *می‌کردم* (I was doing) and *می‌کردی* (you were doing). *خوردن* gives *می‌خوردم* (I was eating). *دیدن* gives *می‌دیدم* (I was seeing; with a film, I was watching). *آمدن* gives *می‌آمدم* (I was coming). With a verb like *آشپزی کردن*, only the verb part changes: *آشپزی می‌کردم* is I was cooking, not *می‌آشپزی*. The stem never changes, only the endings.'
  prs.a2.unit24.lesson02.teach.cooking:
    title: I was cooking
    gloss: I was cooking.
    note: '*آشپزی* is cooking, a review word from the daily-routine units. *آشپزی می‌کردم* says you were in the middle of cooking.'
  prs.a2.unit24.lesson02.teach.watching:
    title: I was watching a movie at home
    gloss: I was watching a movie at home.
    note: '*فلم دیدن* is to watch a movie, so the ongoing past is *فلم می‌دیدم*. *در خانه* is at home.'
  prs.a2.unit24.lesson02.teach.driving_car:
    title: I was driving in the car
    gloss: I was driving in the car.
    note: '*در موتر* is in the car and *رانندگی می‌کردم* is I was driving.'
  prs.a2.unit24.lesson03.teach.was_paradigm:
    title: 'Was, were: بودن in the past'
    gloss: I was, you were, he/she/it was, we were, you (formal or plural) were, they were
    note: '*بودن* is to be. Its past is formed like any other past: stem *بود* plus the endings *بودم، بودی، بود، بودیم، بودین، بودند*. It is the way to say was or were: *در موتر بودم* (I was in the car), *ترافیک زیاد بود* (the traffic was heavy). Do not mix it up with the present *استم، استی، است*. A state such as being somewhere or waiting does not need *می‌*, because *بودم* already describes a situation at that past time.'
  prs.a2.unit24.lesson03.teach.waiting:
    title: To wait
    gloss: to wait, to be waiting
    note: '*منتظر بودن* is to wait. Waiting is a state, so the past is just *منتظر بودم* (I was waiting), with no *می‌*. The thing you wait for comes before *منتظر*: *منتظر بس بودم*.'
    example_gloss: At the station I was waiting for the bus.
  prs.a2.unit24.lesson03.teach.negative_continuing:
    title: 'Was not going: نمی + past stem'
    gloss: I was not going, I was not eating, I was not seeing, I was not doing
    note: 'To say you were not doing something at that moment, put *نمی‌* in front of the past stem instead of *می‌*: *نمی‌رفتم* (I was not going), *نمی‌خوردم* (I was not eating), *نمی‌دیدم* (I was not seeing), *نمی‌کردم* (I was not doing). Compare the simple negative past from the weekend unit: *نرفتم* is I did not go (a finished fact: it did not happen), while *نمی‌رفتم* is I was not going (not in progress at that time, or I did not use to go).'
  prs.a2.unit24.lesson03.teach.finished_vs_ongoing:
    title: Went versus was going
    gloss: I went home. / I was going home.
    note: 'The two forms look almost the same, but they tell different stories. *به خانه رفتم* is I went home: the trip is finished. *به خانه می‌رفتم* is I was going home: I was on my way, not yet there, and something may happen on the way. When you tell what was happening, the longer background action uses *می‌*, and the sudden event uses the simple past without *می‌*.'
  prs.a2.unit24.lesson03.teach.when_two_pasts:
    title: When + simple past or when + می
    gloss: When I got home, the rain started. / When I was going along the street, the rain started.
    note: 'Both sentences use *وقتی که* (when), but the verb after it decides the meaning. With a simple past, *وقتی که به خانه رسیدم، باران شروع شد*, the first event is finished and the second follows it: after I got home, the rain started. With *می‌*, *وقتی که در سرک می‌رفتم، باران شروع شد*, the first action was still going on and the rain started in the middle of it. Telling what was happening needs the second pattern.'
  prs.a2.unit24.lesson03.teach.in_progress_emphasis:
    title: 'Optional: در حال … بودم'
    gloss: I was in the middle of going. / I was in the middle of cooking. / I am in the middle of going.
    note: 'Dari has a second, slightly stronger way to say something was in progress: *در حال* + the infinitive + *بودم*. *در حال رفتن بودم* is I was in the middle of going, and with a noun plus *کردن* the whole infinitive follows: *در حال آشپزی کردن بودم*. It means the same as the plain *می‌رفتم* and *آشپزی می‌کردم*; it only puts more weight on the fact that it was in progress. You never have to use it, and both forms are correct everywhere in this unit. The present has the same emphasis form: *در حال رفتن استم* is I am in the middle of going, but the plain *می‌روم* is what people usually say.'
  prs.a2.unit24.lesson04.teach.when_pattern:
    title: 'The pattern: وقتی که + می، then the event'
    gloss: When I was going along the street, the rain started.
    note: 'To say what was going on when something happened, build the sentence in two parts. First the background: *وقتی که* + the action in progress with *می‌*: *وقتی که در سرک می‌رفتم*. Then a comma and the event that interrupted it, in the simple past without *می‌*: *باران شروع شد*. The result is *وقتی که در سرک می‌رفتم، باران شروع شد.* The long action (*می‌رفتم*) was already going on and the short event (*شروع شد*) cut into it. The same works with the optional emphasis form: *وقتی که در حال رفتن بودم، باران شروع شد*. You can drop *که* and say just *وقتی*.'
  prs.a2.unit24.lesson04.teach.suddenly:
    title: Suddenly
    gloss: suddenly
    note: '*ناگهان* means suddenly. It goes just before the verb of the sudden event, as in *ناگهان باران شروع شد*. It fits well with the interrupting verb, which is in the simple past.'
    example_gloss: Suddenly the rain started.
  prs.a2.unit24.lesson04.teach.same_time:
    title: At that moment
    gloss: at that same moment
    note: '*همان وقت* is at that same moment. Use it at the start of a new sentence to add a second event that happened at the same time: *همان وقت تیلفونم زنگ زد*.'
    example_gloss: At that same moment my phone rang.
  prs.a2.unit24.lesson04.teach.power_cut:
    title: The power went off
    gloss: the power went off
    note: '*برق* is electricity. *برق رفت* is the power went off (the electricity left), a small incident that stops whatever you were doing.'
    example_gloss: Suddenly the power went off.
  prs.a2.unit24.lesson04.teach.event_vs_background:
    title: Which verb has می and which does not
    gloss: When I was watching a movie, suddenly the power went off. At that same moment my phone rang.
    note: 'Check each sentence for two kinds of verb. The background action has *می‌*: *فلم می‌دیدم* (I was watching a movie), because it lasts a while. The interrupting event has no *می‌*: *برق رفت* (the power went off), because it happens once and is over. *ناگهان* or *همان وقت* go with the event, not with the background. If both verbs had *می‌* or both had none, the sentence would no longer tell which one cut into the other.'
  prs.a2.unit24.lesson05.teach.got_wet_we:
    title: We got wet
    gloss: we got wet
    note: '*شدیم* is we became, the simple past of *شدن* with the ending *-یم*. *خیس شدیم* is we got wet.'
    example_gloss: In the street the rain started and we got wet.
  prs.a2.unit24.lesson05.teach.friend_pl:
    title: With my friends
    gloss: with my friends
    note: '*دوستانم* is my friends and *با* is with: *با دوستانم* is with my friends. You will hear it in the next exchange.'
    example_gloss: On Friday I was in the bazaar with my friends.
  prs.a2.unit24.lesson05.teach.message:
    title: A message about yesterday morning
    gloss: Yesterday morning I was going to the office. There was heavy traffic in the street. While I was waiting in the bus, the rain started. At that same moment my phone rang. It was my friend. I got to the office late.
    note: 'A short written account of a small incident. The background has *می‌*: *به دفتر می‌رفتم*. The waiting is a state, *منتظر بودم*. The two events are in the simple past: *باران شروع شد* and *تیلفونم زنگ زد*.'
  prs.a2.unit24.lesson05.teach.exchange_q:
    title: Homayoun asks Zarmina about Friday
    gloss: Zarmina, what happened in the bazaar on Friday?
    note: Homayoun asks with *چه شد؟*, what happened? It is the usual way to ask for the story of a small incident.
  prs.a2.unit24.lesson05.teach.exchange_a:
    title: Zarmina tells what happened
    gloss: When I was going along the bazaar with my friends, the rain started. I had no umbrella and we got wet.
    note: Zarmina gives the background with *می‌* (*می‌رفتم*) and then the event (*باران شروع شد*). Her result, *خیس شدیم*, is in the simple past too.
  prs.a2.unit24.lesson06.teach.turn01:
    title: Homayoun asks what Zarmina was doing
    gloss: Zarmina, what were you doing last night?
    note: '*چه کار می‌کردی؟* is what were you doing? It asks about an action in progress, so it uses *می‌کردی*, not the finished *کردی*.'
  prs.a2.unit24.lesson06.teach.turn02:
    title: Zarmina says what she was doing and what happened
    gloss: When I was watching a movie, suddenly the power went off.
    note: Background *فلم می‌دیدم*, then the event *برق رفت* with *ناگهان*.
  prs.a2.unit24.lesson06.teach.turn03:
    title: Homayoun asks what she did next
    gloss: What did you do then?
    note: '*چه کار کردی؟* with the simple past asks about a finished action: what did you do?'
  prs.a2.unit24.lesson06.teach.turn04:
    title: Zarmina tells about the phone call and asks back
    gloss: At that same moment my phone rang. It was my friend. I talked with her. And you?
    note: '*همان وقت* adds a second event. *با او صحبت کردم* is I talked with her, and *تو چطور؟* asks and you?'
  prs.a2.unit24.lesson06.teach.turn05:
    title: Homayoun tells about the bus and the weather
    gloss: I was coming home from the office. I was in the bus. The traffic was heavy and it was raining too.
    note: He uses *می‌آمدم* for the trip, *بودم* and *زیاد بود* for the situation and *می‌بارید* for the rain in progress.
  prs.a2.unit24.lesson06.teach.bad:
    title: How bad!
    gloss: bad; how bad!
    note: '*بد* means bad. *چه بد!* is how bad! or what a pity, a friendly reaction to a small misfortune.'
    example_gloss: Today it is raining and the traffic is bad.
  prs.a2.unit24.lesson06.teach.turn06:
    title: Zarmina reacts
    gloss: How bad!
    note: '*چه بد!* is a friendly reaction to bad news, the opposite of *چه خوب!*.'
exercises:
  prs.a2.unit24.lesson01.exercise01.recognize_it_was_raining:
    instruction: What does this sentence mean?
    correct_option: It was raining
    distractors:
    - It is raining now
    - It will rain tomorrow
    - It was snowing
    accepted_answers:
    - value: It was raining
      status: correct
    feedback: '*باران می‌بارید* is it was raining: *می‌* plus the past stem *بارید*.'
  prs.a2.unit24.lesson01.exercise02.recognize_we_were_walking:
    instruction: What does this sentence mean?
    correct_option: We were going on foot in the street
    distractors:
    - I was going on foot in the street
    - They were going on foot in the street
    - We go on foot in the street
    accepted_answers:
    - value: We were going on foot in the street
      status: correct
    feedback: 'The ending *-یم* in *می‌رفتیم* means we, and *می‌* shows it was in progress: *ما در سرک پیاده می‌رفتیم*.'
  prs.a2.unit24.lesson01.exercise03.recognize_it_was_snowing:
    instruction: What does this sentence mean?
    correct_option: It was snowing
    distractors:
    - It was raining
    - It is snowing now
    - It will snow tomorrow
    accepted_answers:
    - value: It was snowing
      status: correct
    feedback: '*برف* is snow, so *برف می‌بارید* is it was snowing.'
  prs.a2.unit24.lesson01.exercise04.match_forms_and_words:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        می‌رفتم: I was going
        می‌رفتی: you were going (to a friend)
        می‌رفت: he or she was going
        می‌رفتیم: we were going
        می‌رفتین: you were going (formal or plural)
        می‌رفتند: they were going
        سرک: street
        پیاده: on foot
        ترافیک: traffic
        باد: wind
      status: correct
    feedback: 'Each ending shows who was going: *-م* I, *-ی* you (friend), no ending he or she, *-یم* we, *-ین* you (formal or plural), *-ند* they.'
  prs.a2.unit24.lesson01.exercise05.order_walking_street:
    instruction: 'Arrange the words to say: I was going on foot in the street.'
    accepted_answers:
    - value:
      - در
      - سرک
      - پیاده
      - می‌رفتم
      status: correct
    - value:
      - پیاده
      - در
      - سرک
      - می‌رفتم
      status: correct
    feedback: '*در سرک پیاده می‌رفتم* keeps the verb with *می‌* at the end.'
  prs.a2.unit24.lesson01.exercise06.translate_going_on_foot:
    instruction: 'Translate into Dari, using می‌ and the past stem رفت: I was going on foot.'
    accepted_answers:
    - value: پیاده می‌رفتم.
      status: correct
    - value: من پیاده می‌رفتم.
      status: correct
    - value: پیاده می‌رفتم
      status: correct
    - value: من پیاده می‌رفتم
      status: correct
    feedback: '*پیاده می‌رفتم* is I was going on foot. Adding *من* is fine, but the ending *-م* already says I.'
  prs.a2.unit24.lesson02.exercise01.recognize_cooking:
    instruction: What does this sentence mean?
    correct_option: I was cooking
    distractors:
    - I was eating
    - I was watching a movie
    - I was driving
    accepted_answers:
    - value: I was cooking
      status: correct
    feedback: '*آشپزی می‌کردم* is I was cooking: *می‌* plus the past stem *کرد* plus *-م*.'
  prs.a2.unit24.lesson02.exercise02.recognize_phone_rang:
    instruction: What does this sentence mean?
    correct_option: My phone rang
    distractors:
    - I phoned my friend
    - My phone is broken
    - I turned my phone off
    accepted_answers:
    - value: My phone rang
      status: correct
    feedback: '*تیلفونم زنگ زد* is my phone rang. *زد* has no *می‌* because the ring is a single event.'
  prs.a2.unit24.lesson02.exercise03.match_verbs_and_things:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        آشپزی می‌کردم: I was cooking
        فلم می‌دیدم: I was watching a movie
        رانندگی می‌کردم: I was driving
        می‌خوردم: I was eating
        می‌آمدم: I was coming
        موتر: car
        تیلفون: telephone
        چتر: umbrella
        خیس: wet
        زنگ زد: rang or phoned
      status: correct
    feedback: The verbs with *می‌* say what was in progress. *موتر، تیلفون، چتر* and *خیس* are the things and results in the stories.
  prs.a2.unit24.lesson02.exercise04.order_driving_car:
    instruction: 'Arrange the words to say: I was driving in the car.'
    accepted_answers:
    - value:
      - در
      - موتر
      - رانندگی
      - می‌کردم
      status: correct
    feedback: '*در موتر رانندگی می‌کردم* keeps the verb with *می‌* at the end.'
  prs.a2.unit24.lesson02.exercise05.complete_watching:
    instruction: 'Complete the sentence: I was watching a movie at home.'
    accepted_answers:
    - value: می‌دیدم
      status: correct
    feedback: '*می‌دیدم* is I was watching: *می‌* plus the past stem *دید* plus *-م*.'
