  prs.a2.unit24.lesson03.exercise04.match_finished_and_ongoing:
    instruction: Match each Dari verb with its meaning.
    accepted_answers:
    - value:
        بودم: I was
        بودی: you were (to a friend)
        بود: he, she or it was
        بودیم: we were
        بودین: you were (formal or plural)
        بودند: they were
        رفتم: I went (finished)
        می‌رفتم: I was going
        نرفتم: I did not go (it did not happen)
        نمی‌رفتم: I was not going
      status: correct
    feedback: The endings show who; *می‌* shows an action in progress, and *ن* before the finished form says it did not happen.
