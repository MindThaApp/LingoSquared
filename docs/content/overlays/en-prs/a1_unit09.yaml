course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari: days of the week, months of the Hijri Shamsi
    calendar, asking and giving today's date, and arranging a meeting date.

units:
  prs.a1.unit09.dates:
    title: Days and dates

lessons:
  prs.a1.unit09.lesson01.days_of_the_week: {title: "Days of the week"}
  prs.a1.unit09.lesson02.months: {title: "Months of the year"}
  prs.a1.unit09.lesson03.asking_todays_date: {title: "Ask what day it is today"}
  prs.a1.unit09.lesson04.giving_a_date: {title: "Give a full date"}
  prs.a1.unit09.lesson05.asking_about_a_future_date: {title: "Ask about a future date"}
  prs.a1.unit09.lesson06.meeting_date_dialogue: {title: "Arrange a meeting date"}

teaching:
  prs.a1.unit09.lesson01.teach.shanbe_yakshanbe:
    title: "Saturday and Sunday"
    gloss: "Saturday, Sunday"
    note: "شنبه (Saturday) is the first day of the week in Afghanistan; یکشنبه (Sunday) follows it."
    example_gloss: ["Today is Saturday.", "Tomorrow is Sunday."]
  prs.a1.unit09.lesson01.teach.doshanbe_seshanbe:
    title: "Monday and Tuesday"
    gloss: "Monday, Tuesday"
    note: "دوشنبه and سه‌شنبه literally mean 'second day' and 'third day' after شنبه."
    example_gloss: ["I have class on Monday.", "I have an appointment on Tuesday."]
  prs.a1.unit09.lesson01.teach.chaharshanbe_panjshanbe:
    title: "Wednesday and Thursday"
    gloss: "Wednesday, Thursday"
    note: "چهارشنبه and پنجشنبه continue the same 'fourth day'/'fifth day' pattern."
    example_gloss: ["I work on Wednesday.", "I'll see you on Thursday."]
  prs.a1.unit09.lesson01.teach.jomeh:
    title: "Friday"
    gloss: "Friday"
    note: "جمعه is the weekly holiday in Afghanistan, equivalent in function to a Western weekend day."
    example_gloss: "Friday is a holiday."
  prs.a1.unit09.lesson01.teach.tarikh_word:
    title: "Date"
    gloss: "date"
    note: "تاریخ is the general word for a calendar date."
    example_gloss: "What is today's date?"
  prs.a1.unit09.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "و is the common connecting word used throughout this unit."
  prs.a1.unit09.lesson01.teach.weekend_note:
    title: "The weekly holiday"
    gloss: "Friday is the weekly day off."
    note: "Unlike a Saturday-Sunday weekend, Afghanistan's single weekly holiday is جمعه (Friday)."

  prs.a1.unit09.lesson02.teach.hamal:
    title: "Hamal (1st month)"
    gloss: "Hamal, the first month of the Hijri Shamsi calendar (roughly late March-April)"
    note: "حمل begins the Afghan solar year, coinciding with the Nowruz new year."
    example_gloss: "Hamal is the first month of the year."
  prs.a1.unit09.lesson02.teach.sawr:
    title: "Sawr (2nd month)"
    gloss: "Sawr, the second month (roughly April-May)"
    note: "ثور follows حمل."
    example_gloss: "The weather is nice in Sawr."
  prs.a1.unit09.lesson02.teach.jawza:
    title: "Jawza (3rd month)"
    gloss: "Jawza, the third month (roughly May-June)"
    note: "جوزا follows ثور."
    example_gloss: "I was born in Jawza."
  prs.a1.unit09.lesson02.teach.calendar_note:
    title: "Afghanistan's calendar"
    gloss: "Afghanistan uses the Hijri Shamsi (Solar Hijri) calendar."
    note: "This is the same solar calendar system used in Iran, distinct from both the Gregorian and lunar Hijri calendars."

  prs.a1.unit09.lesson03.teach.what_day_today:
    title: "Ask what day it is today"
    gloss: "What day is today?"
    note: "امروز چند شنبه است؟ literally asks 'today is which -shanbe,' the natural way to ask the day of the week."
  prs.a1.unit09.lesson03.teach.today_word:
    title: "Today"
    gloss: "today"
    note: "امروز names the current day."
    example_gloss: "What's the date today?"

  prs.a1.unit09.lesson04.teach.give_full_date:
    title: "Give a full date"
    gloss: "Today is Thursday, the 15th of Hamal."
    note: "امروز پنجشنبه، پانزدهم حمل است combines the day of the week, an ordinal date, and the month name."

  prs.a1.unit09.lesson05.teach.which_day_meeting:
    title: "Ask what day an event is"
    gloss: "What day is the meeting?"
    note: "جلسه کدام روز است؟ uses کدام (which) to ask about an event's day."
  prs.a1.unit09.lesson05.teach.which_date:
    title: "Ask for a specific date"
    gloss: "What date of Hamal is Monday?"
    note: "دوشنبه چندم حمل است؟ asks which numbered day of the month Monday falls on."

  prs.a1.unit09.lesson06.teach.nozdahom:
    title: "19th"
    gloss: "19th"
    note: "*نوزدهم* is the ordinal form of nineteen, following the same ordinal pattern as *پانزدهم* (15th)."
    example_gloss: "Today is the 19th."
  prs.a1.unit09.lesson06.teach.turn01:
    title: "Homayoun asks about the meeting day"
    gloss: "Homayoun asks Bashir what day the meeting is."
    note: "جلسه کدام روز است؟ from lesson05."
  prs.a1.unit09.lesson06.teach.turn02:
    title: "Bashir answers"
    gloss: "Bashir says he thinks it's Monday."
    note: "فکر می‌کنم (I think) softens the answer since he isn't fully certain."
  prs.a1.unit09.lesson06.teach.turn03:
    title: "Homayoun asks for the exact date"
    gloss: "Homayoun asks what date of Hamal Monday is."
    note: "دوشنبه چندم حمل است؟ from lesson05."
  prs.a1.unit09.lesson06.teach.turn04:
    title: "Bashir gives the exact date"
    gloss: "Bashir says Monday is the 19th of Hamal."
    note: "*دوشنبه نوزدهم حمل است* combines the day, ordinal date, and month, as taught in lesson04's pattern."
  prs.a1.unit09.lesson06.teach.turn05:
    title: "Homayoun asks about Friday"
    gloss: "Homayoun agrees and asks if Bashir is free on Friday."
    note: "وقت داری؟ (do you have time?) is a natural way to ask about availability."
  prs.a1.unit09.lesson06.teach.turn06:
    title: "Bashir says he's busy"
    gloss: "Bashir says no, he's busy on Friday."
    note: "مصروف استم (I'm busy) explains why Friday doesn't work."
  prs.a1.unit09.lesson06.teach.turn07:
    title: "Homayoun confirms Monday"
    gloss: "Homayoun says that's no problem, he'll see Bashir on Monday."
    note: "مشکل نیست (no problem) smooths over the scheduling conflict before confirming the original Monday plan."

exercises:
  prs.a1.unit09.lesson01.exercise01.recognize_shanbe:
    instruction: "What does this word mean?"
    correct_option: Saturday
    distractors: [Sunday, Monday, Friday]
    accepted_answers: [{value: Saturday, status: correct}]
    feedback: "شنبه means Saturday, the first day of the Afghan week."
  prs.a1.unit09.lesson01.exercise02.recognize_jomeh:
    instruction: "What does this word mean?"
    correct_option: Friday
    distractors: [Saturday, Thursday, Wednesday]
    accepted_answers: [{value: Friday, status: correct}]
    feedback: "جمعه means Friday, the weekly holiday."
  prs.a1.unit09.lesson01.exercise03.recognize_doshanbe:
    instruction: "Which day does دوشنبه mean?"
    correct_option: Monday
    distractors: [Saturday, Friday, Sunday]
    accepted_answers: [{value: Monday, status: correct}]
    feedback: "دوشنبه means Monday."
  prs.a1.unit09.lesson01.exercise04.match_days:
    instruction: "Match each day with its English name."
    accepted_answers:
      - {value: {شنبه: Saturday, یکشنبه: Sunday, دوشنبه: Monday, "سه‌شنبه": Tuesday, چهارشنبه: Wednesday, پنجشنبه: Thursday, جمعه: Friday}, status: correct}
    feedback: "These seven words cover all the days of the week."
  prs.a1.unit09.lesson01.exercise05.order_days_sequence:
    instruction: "Arrange the days in order: Saturday, Sunday, Monday."
    accepted_answers: [{value: [شنبه, یکشنبه, دوشنبه], status: correct}]
    feedback: "شنبه، یکشنبه، دوشنبه follows the week's natural order."
  prs.a1.unit09.lesson01.exercise06.translate_friday:
    instruction: "Translate into Dari: Friday."
    accepted_answers:
      - {value: جمعه, status: correct}
    feedback: "جمعه means Friday."
  prs.a1.unit09.lesson01.exercise07.write_wednesday:
    instruction: "Write the Dari word for Wednesday."
    accepted_answers:
      - {value: چهارشنبه, status: correct}
    feedback: "چهارشنبه means Wednesday."

  prs.a1.unit09.lesson02.exercise01.recognize_hamal:
    instruction: "Which word names the first month of the Hijri Shamsi calendar?"
    correct_option: حمل
    distractors: [ثور, جوزا, جمعه]
    accepted_answers: [{value: حمل, status: correct}]
    feedback: "حمل is the first month, coinciding with the Nowruz new year."
  prs.a1.unit09.lesson02.exercise02.recognize_jawza:
    instruction: "Which word names the third month?"
    correct_option: جوزا
    distractors: [حمل, ثور, شنبه]
    accepted_answers: [{value: جوزا, status: correct}]
    feedback: "جوزا is the third month, following ثور."
  prs.a1.unit09.lesson02.exercise03.recognize_sawr_reading:
    instruction: "Which month does ثور name?"
    correct_option: Sawr
    distractors: [Hamal, Jawza, Friday]
    accepted_answers: [{value: Sawr, status: correct}]
    feedback: "ثور names Sawr, the second Hijri Shamsi month."
  prs.a1.unit09.lesson02.exercise04.match_months:
    instruction: "Match each month with its approximate Gregorian equivalent."
    accepted_answers:
      - {value: {حمل: "1st Hijri Shamsi month (~late March-April)", ثور: "2nd Hijri Shamsi month (~April-May)", جوزا: "3rd Hijri Shamsi month (~May-June)"}, status: correct}
    feedback: "These three months begin the Afghan solar year."
  prs.a1.unit09.lesson02.exercise05.order_months_sequence:
    instruction: "Arrange the months in order: Hamal, Sawr, Jawza."
    accepted_answers: [{value: [حمل, ثور, جوزا], status: correct}]
    feedback: "حمل، ثور، جوزا follows the year's natural order."
  prs.a1.unit09.lesson02.exercise06.calendar_check:
    instruction: "Which calendar system does Afghanistan use for everyday dates?"
    options: ["Hijri Shamsi (Solar Hijri)", "Gregorian only", "Lunar Hijri only"]
    accepted_answers: [{value: "Hijri Shamsi (Solar Hijri)", status: correct}]
    feedback: "افغانستان از تقویم هجری شمسی استفاده می‌کند -- Afghanistan uses the Hijri Shamsi calendar."
  prs.a1.unit09.lesson02.exercise07.write_hamal:
    instruction: "Write the name of the first month of the Hijri Shamsi calendar."
    accepted_answers:
      - {value: حمل, status: correct}
    feedback: "حمل is the first month."

  prs.a1.unit09.lesson03.exercise01.recognize_what_day:
    instruction: "Which phrase asks what day it is today?"
    correct_option: "امروز چند شنبه است؟"
    distractors: ["امروز", "جلسه کدام روز است؟", "دوشنبه چندم حمل است؟"]
    accepted_answers: [{value: "امروز چند شنبه است؟", status: correct}]
    feedback: "امروز چند شنبه است؟ asks the day of the week."
  prs.a1.unit09.lesson03.exercise02.recognize_today_word:
    instruction: "What does this word mean?"
    correct_option: today
    distractors: [tomorrow, "which day", month]
    accepted_answers: [{value: today, status: correct}]
    feedback: "امروز means today."
  prs.a1.unit09.lesson03.exercise03.recognize_what_day_reading:
    instruction: "What does this question ask?"
    correct_option: "What day is today?"
    distractors: ["What day is the meeting?", "What date of Hamal is Monday?", "Do you have time?"]
    accepted_answers: [{value: "What day is today?", status: correct}]
    feedback: "امروز چند شنبه است؟ asks what day it is today."
  prs.a1.unit09.lesson03.exercise04.match_today_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"امروز چند شنبه است؟": "What day is today?", امروز: today, هفته: week, روز: day, رخصتی: "day off/holiday", تاریخ: date}, status: correct}
    feedback: "چند شنبه literally asks 'which -shanbe,' i.e. which day of the week; هفته/روز/رخصتی review lesson01's weekend note, and تاریخ reviews lesson01's own date word."
  prs.a1.unit09.lesson03.exercise05.order_what_day:
    instruction: "Arrange the words to ask what day it is today."
    accepted_answers: [{value: [امروز, چند, شنبه, است], status: correct}]
    feedback: "امروز چند شنبه است؟ asks the day of the week."
  prs.a1.unit09.lesson03.exercise06.translate_what_day:
    instruction: "Translate into Dari: What day is today?"
    accepted_answers:
      - {value: "امروز چند شنبه است؟", status: correct}
      - {value: "امروز چند شنبه است", status: correct}
    feedback: "امروز چند شنبه است؟ is the natural way to ask."
  prs.a1.unit09.lesson03.exercise07.speak_ask_day:
    instruction: "Ask a friend what day it is today."
    accepted_answers:
      - {value: "امروز چند شنبه است؟", status: correct}
      - {value: "امروز چند شنبه است", status: correct}
    feedback: "امروز چند شنبه است؟ correctly asks the question."

  prs.a1.unit09.lesson04.exercise01.recognize_full_date:
    instruction: "Which sentence gives a full date?"
    correct_option: "امروز پنجشنبه، پانزدهم حمل است"
    distractors: ["امروز چند شنبه است؟", "جلسه کدام روز است؟", "جمعه است"]
    accepted_answers: [{value: "امروز پنجشنبه، پانزدهم حمل است", status: correct}]
    feedback: "امروز پنجشنبه، پانزدهم حمل است gives the day, date, and month together."
  prs.a1.unit09.lesson04.exercise02.recognize_ordinal:
    instruction: "Which word means 15th?"
    correct_option: پانزدهم
    distractors: [پنجشنبه, حمل, نوزدهم]
    accepted_answers: [{value: پانزدهم, status: correct}]
    feedback: "پانزدهم means 15th."
  prs.a1.unit09.lesson04.exercise03.recognize_full_date_reading:
    instruction: "What date does this sentence give?"
    correct_option: "Thursday, the 15th of Hamal"
    distractors: ["What day is today?", "Monday, the 19th of Hamal", "I'm busy on Friday"]
    accepted_answers: [{value: "Thursday, the 15th of Hamal", status: correct}]
    feedback: "امروز پنجشنبه، پانزدهم حمل است gives Thursday, the 15th of Hamal."
  prs.a1.unit09.lesson04.exercise04.match_date_parts:
    instruction: "Match each part of the date with its meaning."
    accepted_answers:
      - {value: {پنجشنبه: Thursday, پانزدهم: "15th", حمل: Hamal, شنبه: Saturday, دوشنبه: Monday, ثور: Sawr}, status: correct}
    feedback: "A full date combines the weekday, the ordinal day, and the month; the last three review lesson01/lesson02's day and month names."
  prs.a1.unit09.lesson04.exercise05.order_full_date:
    instruction: "Arrange the words: Today is Thursday, the 15th of Hamal."
    accepted_answers: [{value: [امروز, پنجشنبه, پانزدهم, حمل, است], status: correct}]
    feedback: "امروز پنجشنبه، پانزدهم حمل است gives the full date."
  prs.a1.unit09.lesson04.exercise06.translate_full_date:
    instruction: "Translate into Dari: Today is Thursday, the 15th of Hamal."
    accepted_answers:
      - {value: "امروز پنجشنبه، پانزدهم حمل است", status: correct}
      - {value: "امروز پنجشنبه پانزدهم حمل است", status: correct}
    feedback: "امروز پنجشنبه، پانزدهم حمل است gives the full date."
  prs.a1.unit09.lesson04.exercise07.speak_give_date:
    instruction: "امروز چند شنبه است؟ Answer as if today is Thursday, the 15th of Hamal."
    accepted_answers:
      - {value: "امروز پنجشنبه، پانزدهم حمل است", status: correct}
      - {value: "امروز پنجشنبه پانزدهم حمل است", status: correct}
    feedback: "امروز پنجشنبه، پانزدهم حمل است gives the requested date."

  prs.a1.unit09.lesson05.exercise01.recognize_which_day_meeting:
    instruction: "Which phrase asks what day the meeting is?"
    correct_option: "جلسه کدام روز است؟"
    distractors: ["امروز چند شنبه است؟", "دوشنبه چندم حمل است؟", "وقت داری؟"]
    accepted_answers: [{value: "جلسه کدام روز است؟", status: correct}]
    feedback: "جلسه کدام روز است؟ asks about the meeting's day."
  prs.a1.unit09.lesson05.exercise02.recognize_which_date:
    instruction: "Which phrase asks what date of Hamal Monday is?"
    correct_option: "دوشنبه چندم حمل است؟"
    distractors: ["جلسه کدام روز است؟", "امروز چند شنبه است؟", "جمعه مصروف استم"]
    accepted_answers: [{value: "دوشنبه چندم حمل است؟", status: correct}]
    feedback: "دوشنبه چندم حمل است؟ asks for the specific date."
  prs.a1.unit09.lesson05.exercise03.recognize_which_day_reading:
    instruction: "What does this question ask?"
    correct_option: "What day is the meeting?"
    distractors: ["What date of Hamal is Monday?", "What day is today?", "Do you have time?"]
    accepted_answers: [{value: "What day is the meeting?", status: correct}]
    feedback: "جلسه کدام روز است؟ asks what day the meeting is."
  prs.a1.unit09.lesson05.exercise04.match_future_date_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"جلسه کدام روز است؟": "What day is the meeting?", "دوشنبه چندم حمل است؟": "What date of Hamal is Monday?", کدام: which, چندم: "what number/which day (of the month)", جلسه: meeting, حمل: Hamal, دوشنبه: Monday, پانزدهم: "15th"}, status: correct}
    feedback: "کدام asks which day generally; چندم asks for the specific numbered date; the last three review the month, day, and ordinal-date vocabulary already taught earlier in the unit."
  prs.a1.unit09.lesson05.exercise05.order_which_day_meeting:
    instruction: "Arrange the words to ask what day the meeting is."
    accepted_answers: [{value: [جلسه, کدام, روز, است], status: correct}]
    feedback: "جلسه کدام روز است؟ asks about the meeting's day."
  prs.a1.unit09.lesson05.exercise06.translate_which_date:
    instruction: "Translate into Dari: What date of Hamal is Monday?"
    accepted_answers:
      - {value: "دوشنبه چندم حمل است؟", status: correct}
      - {value: "دوشنبه چندم حمل است", status: correct}
    feedback: "دوشنبه چندم حمل است؟ asks for the specific date."
  prs.a1.unit09.lesson05.exercise07.speak_ask_meeting_day:
    instruction: "Ask a colleague what day the meeting is."
    accepted_answers:
      - {value: "جلسه کدام روز است؟", status: correct}
      - {value: "جلسه کدام روز است", status: correct}
    feedback: "جلسه کدام روز است؟ correctly asks the question."

  prs.a1.unit09.lesson06.exercise01.listen_context:
    instruction: "Read the conversation. What are Homayoun and Bashir arranging?"
    correct_option: "the date of a meeting"
    distractors: ["a phone number", "a restaurant order", "a place to meet for lunch"]
    accepted_answers: [{value: "the date of a meeting", status: correct}]
    feedback: "Homayoun and Bashir confirm the exact day and date of an upcoming meeting."
  prs.a1.unit09.lesson06.exercise02.recognize_meeting_day:
    instruction: "What day is the meeting?"
    correct_option: Monday
    distractors: [Friday, Thursday, Saturday]
    accepted_answers: [{value: Monday, status: correct}]
    feedback: "Bashir says دوشنبه (Monday)."
  prs.a1.unit09.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each cue with its fact from the dialogue."
    accepted_answers:
