course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying what you can and cannot do, when you are free or busy, and what might happen. The modal می‌توانم with the subjunctive, ممکن است and شاید with the subjunctive, and fixing a time when you can come.'
units:
  prs.a2.unit30.can_and_might:
    title: What I can and might do
lessons:
  prs.a2.unit30.lesson01.what_i_can_do:
    title: Things I can do
  prs.a2.unit30.lesson02.all_persons_and_no:
    title: All persons and the negative
  prs.a2.unit30.lesson03.free_or_busy:
    title: Free or busy
  prs.a2.unit30.lesson04.might_and_maybe:
    title: It might, maybe
  prs.a2.unit30.lesson05.reading_and_listening:
    title: Reading and listening about free time
  prs.a2.unit30.lesson06.plans_conversation:
    title: A conversation about Friday
teaching:
  prs.a2.unit30.lesson01.teach.swim:
    title: To swim
    gloss: to swim
    note: '*شنا کردن* is to swim. It is a two-word verb: the noun *شنا* plus *کردن*. Many skills are named this way: *آشپزی کردن* (to cook), *رانندگی کردن* (to drive), *صحبت کردن* (to speak).'
    example_gloss: I swim well.
  prs.a2.unit30.lesson01.teach.paint:
    title: To paint, to draw
    gloss: to paint, to draw
    note: '*نقاشی کردن* is to paint or to draw a picture. Like *شنا کردن*, it is a noun plus *کردن*.'
    example_gloss: My friend paints.
  prs.a2.unit30.lesson01.teach.letter:
    title: Letter
    gloss: letter
    note: '*نامه* is a letter. The verb to write is *نوشتن*, and the letter is the thing you write: *نامه نوشتن* is to write a letter.'
    example_gloss: The letter is at home.
  prs.a2.unit30.lesson01.teach.dari:
    title: Dari
    gloss: Dari (the language)
    note: '*دری* is the name of the language you are learning. You speak it with *صحبت کردن*: *دری صحبت کردن*, and *انگلیسی صحبت کردن* is to speak English.'
    example_gloss: I speak a little Dari.
  prs.a2.unit30.lesson01.teach.can:
    title: 'می‌توانم: I can'
    gloss: I can go. I can come. I can cook.
    note: '*می‌توانم* means I can, I am able to. It is always followed by a second verb in the subjunctive: *می‌توانم بروم* (I can go), *می‌توانم بیایم* (I can come), *می‌توانم آشپزی کنم* (I can cook). The two verbs stand together and both are in the first person. Write *می‌توانم* with a half space (ZWNJ) between *می* and *توانم*, not a full space.'
  prs.a2.unit30.lesson01.teach.subjunctive:
    title: 'The subjunctive: ب plus the present stem plus م'
    gloss: I (may) go, eat, read, write, cook, buy, see, say
    note: 'The subjunctive is made of three parts: *ب* + the present stem + the personal ending. For I the ending is *-م*. The present stem of *رفتن* is *رو*, so it is *بروم*. The same rule gives *خوردن* to *بخورم*, *خواندن* to *بخوانم*, *نوشتن* to *بنویسم*, *پختن* to *بپزم*, *خریدن* to *بخرم*, *دیدن* to *ببینم*, *گفتن* to *بگویم*. You have met this form after *باید*. After *می‌توانم* it is the second verb. *آمدن* is irregular: *بیایم*.'
  prs.a2.unit30.lesson01.teach.compound:
    title: Two-word verbs have no ب
    gloss: I can cook, drive, swim, speak, paint
    note: 'A verb made of a noun and *کردن* does not take *ب*. Only the light verb changes: *کنم*. The standard written form is *آشپزی کنم*; *آشپزی بکنم* is also heard in speech. Compare *می‌توانم آشپزی کنم* (I can cook) with *می‌توانم بروم* (I can go). The same pattern works for *رانندگی کنم*, *شنا کنم*, *صحبت کنم*, *نقاشی کنم*. The simple verb *کردن* alone is *بکنم*.'
  prs.a2.unit30.lesson01.teach.cook:
    title: I can cook
    gloss: I can cook.
    note: 'This is the basic pattern: subject (optional), *می‌توانم*, the skill, and the subjunctive of *کردن*.'
  prs.a2.unit30.lesson01.teach.speak_dari:
    title: I can speak Dari
    gloss: I can speak Dari.
    note: The subject *من* can be left out because *می‌توانم* already shows who is speaking. The verb *صحبت کنم* closes the sentence.
  prs.a2.unit30.lesson02.teach.paradigm:
    title: The whole paradigm
    gloss: I can go, you can go, he/she can go, we can go, you (formal or plural) can go, they can go
    note: 'Both verbs change with the person. The modal: *می‌توانم، می‌توانی، می‌تواند، می‌توانیم، می‌توانین، می‌توانند*. The subjunctive: *بروم، بروی، برود، برویم، بروین، بروند*. So *می‌توانی بروی* is you can go (to a friend), *می‌تواند برود* he or she can go, *می‌توانیم برویم* we can go, *می‌توانین بروین* you can go (formal or one person you respect, or several people), *می‌توانند بروند* they can go. The ending of the second person plural is *-ین* in both verbs.'
  prs.a2.unit30.lesson02.teach.agreement:
    title: 'Two-word verbs: only کنم changes'
    gloss: He can drive. You can drive. We can cook.
    note: 'With two-word verbs the noun stays the same and only *کنم* changes: *کنم، کنی، کند، کنیم، کنین، کنند*. So: *می‌توانم رانندگی کنم*, *می‌توانی رانندگی کنی*, *می‌تواند رانندگی کند*, *می‌توانیم رانندگی کنیم*, *می‌توانین رانندگی کنین*, *می‌توانند رانندگی کنند*. The person must be the same in both verbs.'
  prs.a2.unit30.lesson02.teach.negative:
    title: 'The negative: نمی‌توانم'
    gloss: I cannot go, you cannot go, he/she cannot go, we cannot go, you cannot go, they cannot go
    note: 'To say you cannot do something, put *ن* on the modal: *می‌توانم* becomes *نمی‌توانم*. The second verb stays positive: *نمی‌توانم بروم* (I cannot go), not *نمی‌توانم نروم*. All endings are the same as in the positive paradigm.'
  prs.a2.unit30.lesson02.teach.help_q:
    title: Can you help me?
    gloss: Can you help me?
    note: 'This is how to ask whether a friend is able to do something: *می‌توانی* plus the subjunctive. To a person you respect, or to several people, say *می‌توانین به من کمک کنین؟*.'
  prs.a2.unit30.lesson02.teach.no_drive:
    title: He cannot drive
    gloss: He cannot drive. / She cannot drive.
    note: '*او* means he or she, so this sentence is about one person who is not able to drive. *نمی‌تواند* is the negative; *کند* is the subjunctive of *کردن* for he or she.'
  prs.a2.unit30.lesson03.teach.busy:
    title: Busy
    gloss: busy, occupied
    note: '*مشغول* means busy. You say *مشغول استم* (I am busy), the opposite of *آزاد استم* (I am free).'
    example_gloss: Today I am busy.
  prs.a2.unit30.lesson03.teach.tonight:
    title: Tonight
    gloss: tonight, this evening
    note: '*امشب* is tonight. Like *فردا* (tomorrow) and *امروز* (today), it is a time word that stands before the verb.'
    example_gloss: Tonight I am at home.
  prs.a2.unit30.lesson03.teach.five:
    title: Five
    gloss: five
    note: '*پنج* is five. *ساعت پنج* is five o''clock and *بعد از ساعت پنج* is after five o''clock.'
    example_gloss: At five o'clock I go home.
  prs.a2.unit30.lesson03.teach.time_word:
    title: Time word plus می‌توانم
    gloss: Tomorrow I can come. Tonight I cannot come. On Friday I can come.
    note: 'To say when you are able to do something, put a time word in the sentence: *فردا*, *امشب*, *روز جمعه*. The verbs stay the same, *می‌توانم بیایم*; the time word shows that it is about the future, so you do not need another future form. The time word can come first (*فردا می‌توانم بیایم*) or after the modal (*می‌توانم فردا بیایم*). The question is *فردا می‌توانی بیایی؟* (Can you come tomorrow?).'
  prs.a2.unit30.lesson03.teach.reply:
    title: Yes, no, because, but
    gloss: Yes, I can come. No, I cannot come, because I am busy. But on Friday I am free.
    note: 'To accept, answer *بلی* and repeat the modal: *بلی، می‌توانم بیایم*. To refuse, answer *نخیر* and give the reason with *چون*: *نخیر، نمی‌توانم بیایم، چون مشغول استم*. *ولی* (but) then offers another time: *ولی روز جمعه آزاد استم*. *آزاد استم* is I am free and *مشغول استم* is I am busy. You can also say *کار دارم* (I have work).'
  prs.a2.unit30.lesson03.teach.after_five:
    title: Free after five
    gloss: After five o'clock I am free.
    note: This tells the other person when you are free. *بعد از ساعت پنج* is after five o'clock.
  prs.a2.unit30.lesson03.teach.when_q:
    title: When can you come?
    gloss: When can you come?
    note: '*کی* asks for the time. The answer is a time word with the same pattern: *فردا می‌توانم بیایم* or *بعد از ساعت پنج می‌توانم بیایم*.'
  prs.a2.unit30.lesson04.teach.possible:
    title: It is possible, it might
    gloss: it is possible that, it might
    note: '*ممکن است* means it is possible, it might. It is followed by a clause whose verb is the subjunctive: *ممکن است باران ببارد* (it might rain). *ممکن* never changes; the verb after it carries the person.'
    example_gloss: It might rain tomorrow.
  prs.a2.unit30.lesson04.teach.maybe:
    title: Maybe
    gloss: maybe, perhaps
    note: '*شاید* means maybe. Like *ممکن است*, it is followed by the subjunctive: *شاید بیایم* (maybe I will come), *شاید او بیاید* (maybe he will come). *شاید* is shorter and is used more in speech.'
    example_gloss: Maybe he will come.
  prs.a2.unit30.lesson04.teach.rain:
    title: Rain
    gloss: rain
    note: '*باران* is rain. The verb is *باریدن*: *باران ببارد* (it may rain), *باران نبارد* (it may not rain). The subjunctive of *باریدن* is *ببارد*.'
    example_gloss: It is raining today.
  prs.a2.unit30.lesson04.teach.sure:
    title: Sure
    gloss: sure, certain
    note: '*مطمئن* means sure. *مطمئن نیستم* is I am not sure. It is a natural thing to say before you add *شاید* or *ممکن است*.'
    example_gloss: I am not sure.
  prs.a2.unit30.lesson04.teach.possible_subj:
    title: ممکن است plus the subjunctive
    gloss: I might come late. He might come. It might rain.
    note: 'After *ممکن است* the verb is the subjunctive, in the person you mean: *بیایم* (I come), *بیایی* (you come), *بیاید* (he comes), *بیاییم* (we come), *بیایین* (you come), *بیایند* (they come). The negative puts *ن* on the subjunctive: *ممکن است نیاید* (he might not come). Compare with *می‌توانم*: that says I am able; *ممکن است* says it is possible that it happens.'
  prs.a2.unit30.lesson04.teach.maybe_subj:
    title: شاید plus the subjunctive
    gloss: Maybe I will come. Maybe you will come. Maybe he will come. Maybe they will not come.
    note: '*شاید* works exactly like *ممکن است*: it is followed by the subjunctive and the person is shown by the verb ending: *شاید بیایم، شاید بیایی، شاید بیاید، شاید بیاییم، شاید بیایین، شاید بیایند*. The negative has *ن* on the verb: *شاید نیایند* (maybe they will not come). A time word can stand in front: *شاید فردا بیایم*.'
  prs.a2.unit30.lesson04.teach.can_maybe:
    title: 'شاید بتوانم: maybe I can'
    gloss: Maybe I can come. Maybe I cannot come. He might be able to come.
    note: 'You can put the two ideas together: *شاید* or *ممکن است* plus the subjunctive of *توانستن*, which is *بتوانم، بتوانی، بتواند، بتوانیم، بتوانین، بتوانند*, plus the second verb. So *شاید بتوانم بیایم* is maybe I can come. The negative is *نتوانم*: *شاید نتوانم بیایم* is maybe I cannot come. This is useful when you do not know yet whether you are free.'
  prs.a2.unit30.lesson04.teach.maybe_tomorrow:
    title: Maybe I can come tomorrow
    gloss: Maybe I can come tomorrow.
    note: You are not sure, but there is a chance. The time word *فردا* stands after *شاید*.
  prs.a2.unit30.lesson04.teach.rain_phrase:
    title: It might rain
    gloss: It might rain.
    note: '*ممکن است* plus *ببارد*: a possibility, not a promise.'
  prs.a2.unit30.lesson05.teach.fix:
    title: To fix
    gloss: to fix, to repair, to make
    note: '*درست کردن* is to fix or repair something, and also to make, as in *چای درست کردن* (to make tea). The thing comes first with *را*: *کمپیوترم را درست می‌کنم*.'
    example_gloss: My friend fixes my car.
  prs.a2.unit30.lesson05.teach.problem:
    title: Problem
    gloss: problem, difficulty
    note: '*مشکل* is a problem. *مشکل کوچک* is a small problem.'
    example_gloss: The problem is small.
  prs.a2.unit30.lesson05.teach.turn01:
    title: Wahida asks if Sakhi can come
    gloss: Sakhi, can you come to our house tomorrow?
    note: 'Wahida asks a friend whether he is free tomorrow: *فردا می‌توانی ... بیایی؟*. She uses *تو* because Sakhi is a friend.'
  prs.a2.unit30.lesson05.teach.turn02:
    title: Sakhi gives his time
    gloss: In the morning I cannot, because I have work at the office. But after five o'clock I am free.
    note: Sakhi refuses the morning with *نمی‌توانم* and gives the reason with *چون*. In *نمی‌توانم* the second verb is left out because *بیایم* is clear from the question. Then he offers another time with *ولی*.
  prs.a2.unit30.lesson05.teach.turn03:
    title: Wahida asks for help
    gloss: That is good. My computer is broken. Can you fix it?
    note: '*می‌توانی ... درست کنی؟* asks whether he is able to fix it. *آن را* (it) points back to the computer.'
  prs.a2.unit30.lesson05.teach.turn04:
    title: Sakhi is not sure
    gloss: Maybe I can. The problem might be small.
    note: Sakhi is not certain, so he says *شاید بتوانم* (maybe I can) and *ممکن است ... باشد* (it might be). Both are followed by the subjunctive.
  prs.a2.unit30.lesson05.teach.message:
    title: A message from a friend
    gloss: Hello my friend. Tomorrow I cannot come, because in the morning I have work at the office. After five o'clock I am free, but I might arrive late. Maybe I can come on Thursday. Are you free on Thursday?
    note: 'A short message that uses all three ideas of the unit: what the writer cannot do (*نمی‌توانم بیایم*), when the writer is free (*بعد از ساعت پنج آزاد استم*), and what might happen (*ممکن است دیر برسم، شاید ... بتوانم*).'
  prs.a2.unit30.lesson06.teach.park:
    title: Park
    gloss: park
    note: '*پارک* is a park. You go *به پارک* (to the park) and stay *در پارک* (in the park).'
    example_gloss: The park is in Kabul.
  prs.a2.unit30.lesson06.teach.tea:
    title: Tea
    gloss: tea
    note: '*چای* is tea. *چای درست کردن* is to make tea, with the verb you met in the last lesson.'
    example_gloss: The tea is hot.
  prs.a2.unit30.lesson06.teach.turn01:
    title: Hamid asks about Friday
    gloss: Palwasha, are you going to the park on Friday?
    note: '*جمعه به پارک می‌روی؟* asks about a plan with the plain present *می‌روی* and a time word. Palwasha is a friend, so he uses *تو*.'
  prs.a2.unit30.lesson06.teach.turn02:
    title: Palwasha is not sure
    gloss: Maybe I will go. It might rain.
    note: Palwasha is not sure. *شاید بروم* is maybe I will go, and *ممکن است باران ببارد* is it might rain. Both verbs are the subjunctive.
  prs.a2.unit30.lesson06.teach.turn03:
    title: Hamid offers and asks
    gloss: I can cook food. Can you make tea?
    note: Hamid says what he can do (*می‌توانم غذا بپزم*) and asks what Palwasha can do (*می‌توانی چای درست کنی؟*).
  prs.a2.unit30.lesson06.teach.turn04:
    title: Palwasha agrees, with a condition
    gloss: Yes, I can. But if it rains, we cannot stay in the park.
    note: '*بلی، می‌توانم* accepts. Then *اگر باران ببارد* (if it rains) gives a condition, and *نمی‌توانیم ... بمانیم* says what the two cannot do. *اگر* also takes the subjunctive.'
  prs.a2.unit30.lesson06.teach.turn05:
    title: Hamid has another idea
    gloss: Then maybe we will eat at my house.
    note: '*شاید ... بخوریم* is a suggestion that might work: maybe we will eat food at my house. *پس* (then, so) follows from the problem of the rain.'
exercises:
  prs.a2.unit30.lesson01.exercise01.recognize_swim:
    instruction: What does this sentence mean?
    correct_option: I can swim
    distractors:
    - I swam yesterday
    - I like the water
    - I want to learn to swim
    accepted_answers:
    - value: I can swim
      status: correct
    feedback: '*می‌توانم شنا کنم* is I can swim: *می‌توانم* plus the subjunctive *کنم*.'
  prs.a2.unit30.lesson01.exercise02.recognize_letter:
    instruction: What does this sentence mean?
    correct_option: I can write a letter
    distractors:
    - I wrote a letter
    - I have a letter
    - I must write a letter
    accepted_answers:
    - value: I can write a letter
      status: correct
    feedback: '*می‌توانم نامه بنویسم* is I can write a letter: *نامه* is the letter and *بنویسم* is the subjunctive of *نوشتن*.'
  prs.a2.unit30.lesson01.exercise03.match_skills:
    instruction: Match each Dari sentence with its meaning.
    accepted_answers:
    - value:
        می‌توانم شنا کنم: I can swim
        می‌توانم آشپزی کنم: I can cook
        می‌توانم رانندگی کنم: I can drive
        می‌توانم نقاشی کنم: I can paint
        می‌توانم نامه بنویسم: I can write a letter
        می‌توانم دری صحبت کنم: I can speak Dari
        می‌توانم انگلیسی صحبت کنم: I can speak English
        می‌توانم کتاب بخوانم: I can read a book
      status: correct
    feedback: 'Each sentence is *می‌توانم* plus a skill plus the subjunctive: *کنم* for two-word verbs, *بنویسم* and *بخوانم* for the simple verbs.'
  prs.a2.unit30.lesson01.exercise04.order_speak_dari:
    instruction: 'Arrange the words to say: I can speak Dari.'
    accepted_answers:
    - value:
      - من
      - می‌توانم
      - دری
      - صحبت
      - کنم
      status: correct
    feedback: '*من می‌توانم دری صحبت کنم* puts *می‌توانم* after the subject and the subjunctive *کنم* last.'
  prs.a2.unit30.lesson01.exercise05.complete_drive:
    instruction: 'Complete the sentence: I can drive.'
    accepted_answers:
    - value: کنم
      status: correct
    - value: بکنم
      status: acceptable_with_note
      note: This also exists, but with a two-word verb the course uses کنم.
    feedback: '*رانندگی کنم* is the subjunctive of *رانندگی کردن*. A two-word verb takes *کنم*.'
  prs.a2.unit30.lesson01.exercise06.translate_cook:
    instruction: 'Translate into Dari: I can cook.'
    accepted_answers:
    - value: من می‌توانم آشپزی کنم.
      status: correct
    - value: می‌توانم آشپزی کنم.
      status: correct
    - value: من می‌توانم آشپزی کنم
      status: correct
    - value: می‌توانم آشپزی کنم
      status: correct
    feedback: '*من می‌توانم آشپزی کنم.* *من* is optional.'
  prs.a2.unit30.lesson02.exercise01.recognize_he_drive:
    instruction: What does this sentence mean?
    correct_option: He or she can drive
    distractors:
    - He or she drove
    - I can drive
    - They can drive
    accepted_answers:
    - value: He or she can drive
      status: correct
    feedback: '*می‌تواند* is the he or she form of the modal, and *کند* is the matching subjunctive.'
  prs.a2.unit30.lesson02.exercise02.match_paradigm:
    instruction: Match each Dari form with its meaning.
    accepted_answers:
    - value:
        می‌توانم بروم: I can go
        می‌توانی بروی: you can go (to a friend)
        می‌تواند برود: he or she can go
        می‌توانیم برویم: we can go
        می‌توانین بروین: you can go (formal or plural)
        می‌توانند بروند: they can go
        نمی‌توانم بروم: I cannot go
        نمی‌توانند بروند: they cannot go
      status: correct
    feedback: 'Both verbs change with the person: *-م* I, *-ی* you (friend), *-د* he or she, *-یم* we, *-ین* you (formal or plural), *-ند* they. The negative puts *ن* on *می‌توانم* only.'
  prs.a2.unit30.lesson02.exercise03.order_you_help:
    instruction: 'Arrange the words to say: You can help. (to several people or someone you respect)'
    accepted_answers:
    - value:
      - شما
      - می‌توانین
      - کمک
      - کنین
      status: correct
    feedback: '*شما می‌توانین کمک کنین* uses the *-ین* ending in both verbs.'
  prs.a2.unit30.lesson02.exercise04.complete_you_pl:
    instruction: 'Complete the sentence: You can speak Dari. (to several people or someone you respect)'
    accepted_answers:
    - value: کنین
      status: correct
    feedback: '*کنین* is the second person plural of *کنم*: both verbs end in *-ین*.'
  prs.a2.unit30.lesson02.exercise05.answer_speak_dari:
    instruction: 'A friend asks: می‌توانی دری صحبت کنی؟ (Can you speak Dari?) Answer in Dari: Yes, I can speak Dari.'
