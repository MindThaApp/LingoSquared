  prs.a2.unit30.lesson04.exercise01.recognize_might_rain:
    instruction: What does this sentence mean?
    correct_option: It might rain
    distractors:
    - It is raining
    - It rained yesterday
    - I like the rain
    accepted_answers:
    - value: It might rain
      status: correct
    feedback: '*ممکن است* means it might, and *ببارد* is the subjunctive of *باریدن*.'
  prs.a2.unit30.lesson04.exercise02.recognize_maybe_not_come:
    instruction: What does this sentence mean?
    correct_option: Maybe he or she will not come
    distractors:
    - Maybe he or she will come
    - He or she did not come
    - He or she cannot come
    accepted_answers:
    - value: Maybe he or she will not come
      status: correct
    feedback: '*شاید* is maybe, and *نیاید* is the negative subjunctive: *ن* plus *یاید*.'
  prs.a2.unit30.lesson04.exercise03.match_possibility:
    instruction: Match each Dari sentence with its meaning.
    accepted_answers:
    - value:
        ممکن است باران ببارد: It might rain
        شاید دیر بیایم: Maybe I will come late
        شاید او بیاید: Maybe he will come
        ممکن است نیایند: They might not come
        شاید بتوانم بیایم: Maybe I can come
        شاید نتوانم بیایم: Maybe I cannot come
        ممکن است مشغول باشد: He might be busy
        مطمئن نیستم: I am not sure
      status: correct
    feedback: 'After *شاید* or *ممکن است* the verb is the subjunctive. The negative puts *ن* on the verb: *نیایند*, *نتوانم*.'
