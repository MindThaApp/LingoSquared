    - I cannot come tomorrow
    accepted_answers:
    - value: I can come tomorrow
      status: correct
    feedback: '*فردا* is tomorrow and *می‌توانم بیایم* is I can come.'
  prs.a2.unit30.lesson03.exercise02.recognize_tonight_no:
    instruction: What does this sentence mean?
    correct_option: I cannot come tonight because I am busy
    distractors:
