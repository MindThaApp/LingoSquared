    accepted_answers:
    - value: I cannot come tonight because I am busy
      status: correct
    feedback: '*نمی‌توانم بیایم* is I cannot come, *چون مشغول استم* is because I am busy, *امشب* is tonight.'
  prs.a2.unit30.lesson03.exercise03.match_availability:
    instruction: Match each Dari phrase with its meaning.
    accepted_answers:
    - value:
