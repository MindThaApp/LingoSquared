course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari: food and drink vocabulary, ordering politely,
    asking what's available, quantities, and restaurant etiquette
    including asking for the bill.

units:
  prs.a1.unit08.food:
    title: Food and ordering a meal

lessons:
  prs.a1.unit08.lesson01.food_and_drink_vocabulary: {title: "Food and drink"}
  prs.a1.unit08.lesson02.polite_ordering: {title: "Order politely"}
  prs.a1.unit08.lesson03.asking_whats_available: {title: "Ask what's available"}
  prs.a1.unit08.lesson04.quantities: {title: "Order specific quantities"}
  prs.a1.unit08.lesson05.restaurant_etiquette_and_bill: {title: "Restaurant etiquette and the bill"}
  prs.a1.unit08.lesson06.restaurant_dialogue: {title: "A full teahouse conversation"}

teaching:
  prs.a1.unit08.lesson01.teach.naan:
    title: "Bread"
    gloss: "bread"
    note: "نان is a staple of every Afghan meal."
    example_gloss: "The bread is fresh."
  prs.a1.unit08.lesson01.teach.palaw:
    title: "Rice pilaf"
    gloss: "rice pilaf"
    note: "پلو is the Afghan rice pilaf dish, distinctly seasoned and often cooked with meat, carrots, or raisins -- not just plain rice."
    example_gloss: "The pulao is delicious."
  prs.a1.unit08.lesson01.teach.qorma:
    title: "Meat and vegetable stew"
    gloss: "meat and vegetable stew"
    note: "قورمه is a general term for a cooked meat-and-vegetable stew dish, commonly served over پلو."
    example_gloss: "I eat korma with pulao."
  prs.a1.unit08.lesson01.teach.chai_review:
    title: "Tea (review)"
    gloss: "tea"
    note: "چای is the default drink offered almost anywhere in Afghanistan."
    example_gloss: "One tea, please."
  prs.a1.unit08.lesson01.teach.ab_water:
    title: "Water"
    gloss: "water"
    note: "آب is the ordinary word for water."
    example_gloss: "One water, please."
  prs.a1.unit08.lesson01.teach.va_word:
    title: "And"
    gloss: "and"
    note: "و is the common connecting word used to join a list of foods."

  prs.a1.unit08.lesson02.teach.mikham_chai:
    title: "Order tea politely"
    gloss: "I'd like a tea."
    note: "یک چای می‌خواهم is a neutral, polite way to order, using می‌خواهم (I want) directly rather than a more indirect construction."
  prs.a1.unit08.lesson02.teach.lotfan:
    title: "Please"
    gloss: "please"
    note: "لطفاً can be added to soften almost any request."
    example_gloss: "Please help."
  prs.a1.unit08.lesson02.teach.mikham_naan:
    title: "Order bread politely"
    gloss: "I'd like a bread."
    note: "The same یک [item] می‌خواهم pattern applies to any food or drink noun."

  prs.a1.unit08.lesson03.teach.what_do_you_have:
    title: "Ask what's available"
    gloss: "What do you have?"
    note: "چی دارین؟ is the natural way to ask a shopkeeper or server what food is available."
  prs.a1.unit08.lesson03.teach.we_have_both:
    title: "Respond with what's available"
    gloss: "We have rice pilaf and stew."
    note: "پلو و قورمه داریم uses داریم (we have), the plural/polite form of دارم."
  prs.a1.unit08.lesson03.teach.fresh_word:
    title: "Fresh"
    gloss: "fresh"
    note: "تازه describes freshly prepared food."
    example_gloss: "This bread is fresh."

  prs.a1.unit08.lesson04.teach.yek_boshghab:
    title: "A plate of rice pilaf"
    gloss: "a plate of rice pilaf"
    note: "بشقاب (plate) is the counting word for food served on a plate."
  prs.a1.unit08.lesson04.teach.do_ta_naan:
    title: "Two breads"
    gloss: "two breads"
    note: "تا is the general counter word placed after a number for most countable items, here two pieces of bread."
  prs.a1.unit08.lesson04.teach.combined_order:
    title: "Combine a full order"
    gloss: "A plate of rice pilaf and two breads, please."
    note: "Multiple quantity phrases can be joined with و (and) in a single order."

  prs.a1.unit08.lesson05.teach.bill_word:
    title: "The bill"
    gloss: "the bill / check"
    note: "بل (from English 'bill') is the everyday Afghan word for a restaurant bill."
    example_gloss: "The bill, please."
  prs.a1.unit08.lesson05.teach.bill_request:
    title: "Ask how much the bill comes to"
    gloss: "How much is the bill?"
    note: "بل چند می‌شه؟ literally asks 'the bill becomes how much,' the natural everyday way to ask for the total."
  prs.a1.unit08.lesson05.teach.khoshmaze:
    title: "Say the food was delicious"
    gloss: "It was very delicious."
    note: "خیلی خوش‌مزه بود is a natural compliment to say after a meal."
  prs.a1.unit08.lesson05.teach.chaikhana:
    title: "Teahouse"
    gloss: "teahouse / simple eatery"
    note: "چایخانه is a common, everyday type of simple eatery in Afghanistan, especially in Kabul, serving tea and basic meals."

  prs.a1.unit08.lesson06.teach.welcome_review:
    title: "Welcome (review)"
    gloss: "welcome"
    note: "خوش آمدین was introduced in the greetings unit; it's used here as a shopkeeper's greeting."
  prs.a1.unit08.lesson06.teach.turn01:
    title: "The shopkeeper greets the customer"
    gloss: "The shopkeeper welcomes the customer and asks what they'd like."
    note: "چی میل دارین؟ is a polite opening question, similar in function to چی دارین؟ but framed from the customer's preference."
  prs.a1.unit08.lesson06.teach.turn02:
    title: "The customer asks what's available"
    gloss: "The customer greets the shopkeeper and asks what's available."
    note: "چی دارین؟ opens the ordering exchange, from lesson03."
  prs.a1.unit08.lesson06.teach.turn03:
    title: "The shopkeeper lists what's available"
    gloss: "The shopkeeper says they have rice pilaf and stew, both fresh."
    note: "هردو (both) confirms freshness for both dishes mentioned."
  prs.a1.unit08.lesson06.teach.turn04:
    title: "The customer places a full order"
    gloss: "The customer agrees and orders a plate of rice pilaf with stew, plus a tea."
    note: "This combines lesson04's quantity pattern with the food vocabulary from lesson01."
  prs.a1.unit08.lesson06.teach.turn05:
    title: "The shopkeeper acknowledges the order"
    gloss: "The shopkeeper says they'll bring it right away."
    note: "چشم، همین حالا می‌آرم is a respectful acknowledgment, similar to چشم، الان میارم seen in the directions unit."
  prs.a1.unit08.lesson06.teach.turn06:
    title: "The customer compliments the food and asks for the bill"
    gloss: "The customer says it was delicious and asks for the bill."
    note: "Both phrases directly reuse lesson05's vocabulary."
  prs.a1.unit08.lesson06.teach.turn07:
    title: "The shopkeeper states the total"
    gloss: "The shopkeeper thanks them and says it comes to two hundred afghanis."
    note: "افغانی is the currency of Afghanistan; دوصد (two hundred) combines with the currency name to state a price."

exercises:
  prs.a1.unit08.lesson01.exercise01.recognize_naan:
    instruction: "What does this word mean?"
    correct_option: bread
    distractors: ["rice pilaf", stew, water]
    accepted_answers: [{value: bread, status: correct}]
    feedback: "نان means bread."
  prs.a1.unit08.lesson01.exercise02.recognize_palaw:
    instruction: "What does this word mean?"
    correct_option: "rice pilaf"
    distractors: [bread, stew, tea]
    accepted_answers: [{value: "rice pilaf", status: correct}]
    feedback: "پلو means rice pilaf."
  prs.a1.unit08.lesson01.exercise03.recognize_qorma_reading:
    instruction: "What does this word mean?"
    correct_option: "meat and vegetable stew"
    distractors: [bread, "rice pilaf", tea]
    accepted_answers: [{value: "meat and vegetable stew", status: correct}]
    feedback: "قورمه means meat and vegetable stew."
  prs.a1.unit08.lesson01.exercise04.match_food_words:
    instruction: "Match each word with its English meaning."
    accepted_answers:
      - {value: {نان: bread, پلو: "rice pilaf", قورمه: "meat and vegetable stew", چای: tea, آب: water}, status: correct}
    feedback: "These five words cover the basic food and drink vocabulary for this unit."
  prs.a1.unit08.lesson01.exercise05.order_food_list:
    instruction: "Arrange the words to say bread and rice pilaf and stew."
    accepted_answers: [{value: [نان, و, پلو, و, قورمه], status: correct}]
    feedback: "نان و پلو و قورمه lists three foods joined with و."
  prs.a1.unit08.lesson01.exercise06.translate_qorma:
    instruction: "Translate into Dari: meat and vegetable stew."
    accepted_answers:
      - {value: قورمه, status: correct}
    feedback: "قورمه means the meat and vegetable stew dish."
  prs.a1.unit08.lesson01.exercise07.write_water:
    instruction: "Write the Dari word for water."
    accepted_answers:
      - {value: آب, status: correct}
    feedback: "آب means water."

  prs.a1.unit08.lesson02.exercise01.recognize_polite_order:
    instruction: "What does this phrase mean?"
    correct_option: "I'd like a tea."
    distractors: ["I'd like a bread.", "What do you have?", please]
    accepted_answers: [{value: "I'd like a tea.", status: correct}]
    feedback: "یک چای می‌خواهم politely orders a tea."
  prs.a1.unit08.lesson02.exercise02.recognize_lotfan:
    instruction: "What does this word mean?"
    correct_option: please
    distractors: [want, one, tea]
    accepted_answers: [{value: please, status: correct}]
    feedback: "لطفاً means please."
  prs.a1.unit08.lesson02.exercise03.recognize_polite_order_reading:
    instruction: "What does this phrase mean?"
    correct_option: "I would like a tea, please."
    distractors: ["I would like bread.", "What do you have?", "How much is the bill?"]
    accepted_answers: [{value: "I would like a tea, please.", status: correct}]
    feedback: "یک چای می‌خواهم، لطفاً means I would like a tea, please."
  prs.a1.unit08.lesson02.exercise04.match_order_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"یک چای می‌خواهم": "I'd like a tea.", لطفاً: please, "یک نان می‌خواهم": "I'd like a bread.", نان: bread, پلو: "rice pilaf", قورمه: "meat and vegetable stew", آب: water, چای: tea}, status: correct}
    feedback: "These cover the basic polite ordering pattern, reviewing lesson01's food vocabulary too."
  prs.a1.unit08.lesson02.exercise05.order_polite_naan:
    instruction: "Arrange the words to politely order bread."
    accepted_answers: [{value: [یک, نان, می‌خواهم], status: correct}]
    feedback: "یک نان می‌خواهم politely orders bread."
  prs.a1.unit08.lesson02.exercise06.translate_polite_order:
    instruction: "Translate into Dari: I would like a tea, please."
    accepted_answers:
      - {value: "یک چای می‌خواهم لطفاً", status: correct}
      - {value: "یک چای می‌خواهم، لطفاً", status: correct}
    feedback: "یک چای می‌خواهم، لطفاً means I would like a tea, please."
  prs.a1.unit08.lesson02.exercise07.translate_water_order:
    instruction: "Translate into Dari: I'd like a water, please."
    accepted_answers:
      - {value: "یک آب می‌خواهم لطفاً", status: correct}
      - {value: "یک آب می‌خواهم، لطفاً", status: correct}
    feedback: "یک آب می‌خواهم لطفاً politely orders water."

  prs.a1.unit08.lesson03.exercise01.recognize_what_available:
    instruction: "What does this phrase mean?"
    correct_option: "What do you have?"
    distractors: ["How much is the bill?", "I'd like a tea.", fresh]
    accepted_answers: [{value: "What do you have?", status: correct}]
    feedback: "چی دارین؟ asks what's available."
  prs.a1.unit08.lesson03.exercise02.recognize_fresh:
    instruction: "What does this word mean?"
    correct_option: fresh
    distractors: ["rice pilaf", stew, please]
    accepted_answers: [{value: fresh, status: correct}]
    feedback: "تازه means fresh."
  prs.a1.unit08.lesson03.exercise03.recognize_what_available_reading:
    instruction: "What does this question ask?"
    correct_option: "What do you have?"
    distractors: ["I would like a tea.", "How much is the bill?", "It was very delicious."]
    accepted_answers: [{value: "What do you have?", status: correct}]
    feedback: "چی دارین؟ asks what's available."
  prs.a1.unit08.lesson03.exercise04.match_availability_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"چی دارین؟": "What do you have?", "پلو و قورمه داریم": "We have rice pilaf and stew.", تازه: fresh, "یک چای می‌خواهم": "I'd like a tea.", لطفاً: please, "یک نان می‌خواهم": "I'd like a bread."}, status: correct}
    feedback: "These cover asking about and confirming availability, reviewing lesson02's polite-ordering phrases too."
  prs.a1.unit08.lesson03.exercise05.order_what_available:
    instruction: "Arrange the words to ask what's available."
    accepted_answers: [{value: [چی, دارین], status: correct}]
    feedback: "چی دارین؟ asks what's available."
  prs.a1.unit08.lesson03.exercise06.translate_what_available:
    instruction: "Translate into Dari: What do you have?"
    accepted_answers:
      - {value: "چی دارین؟", status: correct}
      - {value: "چی دارین", status: correct}
    feedback: "چی دارین؟ is the natural way to ask."
  prs.a1.unit08.lesson03.exercise07.speak_ask_available:
    instruction: "You'd like to know what food is available. Ask the shopkeeper."
    accepted_answers:
      - {value: "چی دارین؟", status: correct}
      - {value: "چی دارین", status: correct}
    feedback: "چی دارین؟ correctly asks the question."

  prs.a1.unit08.lesson04.exercise01.recognize_plate_of_rice:
    instruction: "What does this phrase mean?"
    correct_option: "a plate of rice pilaf"
    distractors: ["two breads", "I'd like a tea.", "What do you have?"]
    accepted_answers: [{value: "a plate of rice pilaf", status: correct}]
    feedback: "بشقاب (plate) is the counting word for food served on a plate."
  prs.a1.unit08.lesson04.exercise02.recognize_two_breads:
    instruction: "What does this phrase mean?"
    correct_option: "two breads"
    distractors: ["a plate of rice pilaf", "I'd like a bread.", fresh]
    accepted_answers: [{value: "two breads", status: correct}]
    feedback: "دو تا نان uses the counter تا after the number two."
  prs.a1.unit08.lesson04.exercise03.recognize_quantity_order_reading:
    instruction: "What does this order mean?"
    correct_option: "a plate of pilaf and two breads"
    distractors: ["I would like a tea.", "What do you have?", "How much is the bill?"]
    accepted_answers: [{value: "a plate of pilaf and two breads", status: correct}]
    feedback: "یک بشقاب پلو و دو تا نان means a plate of pilaf and two breads."
  prs.a1.unit08.lesson04.exercise04.match_quantities:
    instruction: "Match each quantity phrase with its meaning."
    accepted_answers:
      - {value: {"یک بشقاب پلو": "a plate of rice pilaf", "دو تا نان": "two breads", "چی دارین؟": "What do you have?", "پلو و قورمه داریم": "We have rice pilaf and stew.", تازه: fresh}, status: correct}
    feedback: "بشقاب and تا are both counting words, tied to how the item is served or counted -- reviewing lesson03's availability phrases too."
  prs.a1.unit08.lesson04.exercise05.order_combined_order:
    instruction: "Arrange the words for a plate of rice pilaf and two breads, please."
    accepted_answers: [{value: [یک, بشقاب, پلو, و, دو, تا, نان, لطفاً], status: correct}]
    feedback: "یک بشقاب پلو و دو تا نان لطفاً combines two quantities in one order."
  prs.a1.unit08.lesson04.exercise06.translate_combined_order:
    instruction: "Translate into Dari: a plate of pilaf and two breads."
    accepted_answers:
      - {value: "یک بشقاب پلو و دو تا نان", status: correct}
    feedback: "یک بشقاب پلو و دو تا نان means a plate of pilaf and two breads."
  prs.a1.unit08.lesson04.exercise07.translate_quantity:
    instruction: "Translate into Dari: a plate of stew."
    accepted_answers:
      - {value: "یک بشقاب قورمه", status: correct}
    feedback: "یک بشقاب قورمه uses the same بشقاب counter as پلو."

  prs.a1.unit08.lesson05.exercise01.recognize_bill_request:
    instruction: "What does this phrase mean?"
    correct_option: "How much is the bill?"
    distractors: ["It was very delicious.", "What do you have?", teahouse]
    accepted_answers: [{value: "How much is the bill?", status: correct}]
    feedback: "بل چند می‌شه؟ asks for the total."
  prs.a1.unit08.lesson05.exercise02.recognize_delicious:
    instruction: "What does this phrase mean?"
    correct_option: "It was very delicious."
    distractors: ["How much is the bill?", "What do you have?", fresh]
    accepted_answers: [{value: "It was very delicious.", status: correct}]
    feedback: "خیلی خوش‌مزه بود says the meal was delicious."
  prs.a1.unit08.lesson05.exercise03.recognize_bill_request_reading:
    instruction: "What does this question ask?"
    correct_option: "How much is the bill?"
    distractors: ["It was very delicious.", "What do you have?", "I would like a tea."]
    accepted_answers: [{value: "How much is the bill?", status: correct}]
    feedback: "بل چند می‌شه؟ asks how much the bill comes to."
  prs.a1.unit08.lesson05.exercise04.chaikhana_meaning:
    instruction: "What is a چایخانه?"
    correct_option: "a teahouse / simple eatery"
    distractors: ["a formal fine-dining restaurant", "a grocery store", "a private home kitchen"]
    accepted_answers: [{value: "a teahouse / simple eatery", status: correct}]
    feedback: "چایخانه is a common, everyday type of simple eatery in Afghanistan."
  prs.a1.unit08.lesson05.exercise05.order_delicious:
    instruction: "Arrange the words to say it was very delicious."
    accepted_answers: [{value: [خیلی, خوش‌مزه, بود], status: correct}]
    feedback: "خیلی خوش‌مزه بود compliments the meal."
  prs.a1.unit08.lesson05.exercise06.translate_bill_request_spoken:
    instruction: "Translate into Dari: How much is the bill?"
    accepted_answers:
      - {value: "بل چند می‌شه؟", status: correct}
      - {value: "بل چند می‌شه", status: correct}
    feedback: "بل چند می‌شه؟ means how much is the bill?"
  prs.a1.unit08.lesson05.exercise07.translate_bill_request:
    instruction: "Translate into Dari: How much is the bill?"
    accepted_answers:
      - {value: "بل چند می‌شه؟", status: correct}
      - {value: "بل چند می‌شه", status: correct}
    feedback: "بل چند می‌شه؟ is the natural way to ask."

