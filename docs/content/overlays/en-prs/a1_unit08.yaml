  prs.a1.unit08.lesson06.exercise03.match_dialogue_facts:
    instruction: "Match each fact to what it describes in the dialogue."
    accepted_answers:
      - {value: {مشتری: "پلو با قورمه و یک چای", بل: "دوصد افغانی", هردو: تازه, "خیلی خوش‌مزه بود": "It was very delicious."}, status: correct}
