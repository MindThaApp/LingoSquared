    accepted_answers: [{value: "at a teahouse", status: correct}]
    feedback: "A shopkeeper and a customer complete a full ordering exchange at a چایخانه."
  prs.a1.unit08.lesson06.exercise02.recognize_what_ordered:
    instruction: "What did the customer order?"
