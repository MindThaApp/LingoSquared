course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: making polite requests with می‌شود که and لطفاً, offering help, accepting or declining politely, and asking someone not to do something with the negative command (نکنین).'
units:
  prs.a2.unit31.polite_requests:
    title: Could you ...? Polite requests and offers
lessons:
  prs.a2.unit31.lesson01.polite_request:
    title: Could you ...? Polite requests
  prs.a2.unit31.lesson02.please_and_commands:
    title: Please and the command form
  prs.a2.unit31.lesson03.offers_and_replies:
    title: Offering help, accepting and declining
  prs.a2.unit31.lesson04.dont:
    title: 'Do not ...: the negative command'
  prs.a2.unit31.lesson05.reading_and_listening:
    title: Reading and listening about a neighbour
  prs.a2.unit31.lesson06.shop_call:
    title: A phone call to the shop
teaching:
  prs.a2.unit31.lesson01.teach.neighbour:
    title: Neighbour
    gloss: neighbour
    note: '*همسایه* is a neighbour. Neighbours often ask each other for small favours, so this is the first person you will make polite requests to.'
    example_gloss: Our neighbour is very nice.
  prs.a2.unit31.lesson01.teach.shopkeeper:
    title: Shopkeeper
    gloss: shopkeeper
    note: '*دوکاندار* is the person who works in a *دوکان* (shop). You ask the *دوکاندار* for what you need and he or she may offer you more.'
    example_gloss: The shopkeeper is in the shop.
  prs.a2.unit31.lesson01.teach.milk:
    title: Milk
    gloss: milk
    note: '*شیر* is milk. It is a common thing to ask for in a shop, like *نان* (bread).'
    example_gloss: I drink milk every day.
  prs.a2.unit31.lesson01.teach.bag:
    title: Bag
    gloss: bag, carrier bag
    note: '*کیسه* is a bag, for example the bag the shopkeeper puts your shopping in.'
    example_gloss: I bought a bag of bread.
  prs.a2.unit31.lesson01.teach.frame:
    title: 'The polite request: می‌شود که ...؟'
    gloss: 'Could you give me a little bread? (lit.: Is it possible that you give a little bread?)'
    note: 'To ask someone for something politely, start with *می‌شود که* (is it possible that) and put the verb in the subjunctive: *می‌شود که کمی نان بدهین؟* The verb after *که* is the same kind of form you use after *باید*, and it ends in *-ین* when you are polite to one person or speak to several (*شما*). A request is a question, so the sentence ends with *؟*. A shorter spoken version drops *که*: *می‌شود کمی نان بدهین؟*. You can also ask with *می‌توانین*: *می‌توانین کمی نان بدهین؟*'
  prs.a2.unit31.lesson01.teach.subj:
    title: The subjunctive of دادن
    gloss: that I give, that you give, that he/she gives, that we give, that you give (polite or plural), that they give
    note: The subjunctive is *ب* plus the present stem plus the endings *-م، -ی، -د، -یم، -ین، -ند*. For *دادن* the stem is *ده*, so you get *بدهم، بدهی، بدهد، بدهیم، بدهین، بدهند*. For a request to a neighbour or a shopkeeper you need the *-ین* form, *بدهین*.
  prs.a2.unit31.lesson01.teach.subj_more:
    title: Requests with other verbs
    gloss: give, bring, send, take/get, take away, say/tell, do
    note: 'Put the same *-ین* subjunctive after *می‌شود که* with any verb: *بیاورین* (bring), *بفرستین* (send), *بگیرین* (get), *ببرین* (take something to a place), *بگویین* (say) and *کنین* (do). Verbs made with *کردن* use *کنین* after the first word: *کمک کنین* (help), *صبر کنین* (wait), *تیلفون کنین* (phone), *باز کنین* (open).'
  prs.a2.unit31.lesson01.teach.help_req:
    title: Could you help?
    gloss: Could you help?
    note: '*می‌شود که کمک کنین؟* is the everyday way to ask a neighbour for help. Begin with *ببخشین* (excuse me) if you do not know the person well.'
  prs.a2.unit31.lesson01.teach.bag_req:
    title: Excuse me, could you give me a bag?
    gloss: Excuse me, could you give me a bag?
    note: '*ببخشین* is a polite opening and is not a real apology. Then comes the request: *می‌شود که یک کیسه بدهین؟*'
  prs.a2.unit31.lesson01.teach.yes_sure:
    title: Yes, of course
    gloss: Yes, of course.
    note: '*بلی، حتماً.* is a polite yes to a request. *البته.* (of course) means the same.'
  prs.a2.unit31.lesson02.teach.table:
    title: Table
    gloss: table
    note: '*میز* is a table. It is something you may need help carrying or moving.'
    example_gloss: The table is in the room.
  prs.a2.unit31.lesson02.teach.here:
    title: Here
    gloss: here
    note: '*اینجا* means here, in this place. The opposite is *آنجا* (there).'
    example_gloss: The key is here.
  prs.a2.unit31.lesson02.teach.imp_pl:
    title: The polite command (imperative) with -ین
    gloss: come, go, give, say, take, bring, do (to a neighbour or to several people)
    note: 'A command to *شما* (a neighbour, an older person, or several people) ends in *-ین*: *بیایین* (come), *بروین* (go), *بدهین* (give), *بگویین* (say), *بگیرین* (take), *بیاورین* (bring), *کنین* (do). It is the same form as the subjunctive you used after *می‌شود که*.'
  prs.a2.unit31.lesson02.teach.imp_sg:
    title: The command to a friend (no ending)
    gloss: come, go, give, say, take, bring, do (to a friend or a child)
    note: 'To one friend or a child, drop the *-ین*: *بیا، برو، بده، بگو، بگیر، بیاور، کن*. This is the bare form and it is blunt on its own, so use it only with people you call *تو*. To a neighbour or a shopkeeper always use the *-ین* form.'
  prs.a2.unit31.lesson02.teach.imp_rule:
    title: How the command is made
    gloss: 'The pattern: b + present stem'
    note: The command is *ب* plus the present stem (*رو، ده، گو، گیر*), and *-ین* is added for *شما*. The verb *کردن* has no *ب* (*کن، کنین*), and *آمدن* has *بیا، بیایین*. *آوردن* is *بیاور* for a friend and *بیاورین* in the polite form.
  prs.a2.unit31.lesson02.teach.please_wait:
    title: Please wait a little
    gloss: Please wait a little.
    note: '*لطفاً* (please) goes at the start of a command and makes it polite: *لطفاً کمی صبر کنین.*'
  prs.a2.unit31.lesson02.teach.please_bring:
    title: Please bring the bag
    gloss: Please bring the bag.
    note: 'The object comes before the verb and takes *را* when it is a particular thing: *کیسه را بیاورین*.'
  prs.a2.unit31.lesson02.teach.please_table:
    title: Please take this table to the room
    gloss: Please take this table to the room.
    note: '*ببرین* is to take something to a place. *به اتاق* says where.'
  prs.a2.unit31.lesson02.teach.two_ways:
    title: Two ways to ask
    gloss: Please open the gate. / Excuse me, could you open the gate?
    note: '*لطفاً* plus the command is short and direct and is fine when the other person is expected to do it, for example a shopkeeper. *می‌شود که ...؟* is softer and better for a favour from a neighbour. Both are polite.'
  prs.a2.unit31.lesson03.teach.offer_forms:
    title: 'Offering help: the verb with -م'
    gloss: Shall I help? Shall I bring tea? Shall I give a bag too? Shall I send tea too?
    note: 'To offer something, ask a question with the *من* form of the subjunctive: *کنم* (that I do), *بیاورم* (that I bring), *بدهم* (that I give), *بفرستم* (that I send). *کمک کنم؟* is Shall I help? You can add *هم* (also, too): *کیسه هم بدهم؟*'
  prs.a2.unit31.lesson03.teach.want_that:
    title: Do you want me to help?
    gloss: Do you want me to help?
    note: '*می‌خواهین که ...؟* is another way to offer. It asks whether the other person wants it, and the verb after *که* is again in the *-م* form.'
  prs.a2.unit31.lesson03.teach.offer_vs_request:
    title: Offer or request?
    gloss: Shall I bring tea? / Please bring tea.
    note: 'The ending shows who does the action. *بیاورم* (I bring) is an offer: I will do it for you. *بیاورین* (you bring) is a request: you do it for me. So *کیسه هم بدهم؟* is the shopkeeper offering and *کیسه بدهین* is the customer asking.'
  prs.a2.unit31.lesson03.teach.sugar:
    title: Sugar
    gloss: sugar
    note: '*قند* is sugar. People in Afghanistan drink tea with or without *قند*.'
    example_gloss: Tea with sugar is good.
  prs.a2.unit31.lesson03.teach.kindness:
    title: Kindness
    gloss: kindness, favour
    note: '*لطف* is kindness. *لطف می‌کنین* is a polite thank-you: you are being kind.'
    example_gloss: Thank you for your kindness.
  prs.a2.unit31.lesson03.teach.self:
    title: Myself
    gloss: myself, by myself
    note: '*خودم* is myself. *خودم می‌کنم* means I will do it myself.'
    example_gloss: I will do the work myself.
  prs.a2.unit31.lesson03.teach.yes_please:
    title: Yes, please
    gloss: Yes, please.
    note: This accepts an offer. After *بلی* you can add *تشکر*.
  prs.a2.unit31.lesson03.teach.yes_kind:
    title: Yes, thank you, that is kind
    gloss: Yes, thank you. That is kind of you.
    note: A warmer way to accept. *لطف می‌کنین* says that the other person is being kind.
  prs.a2.unit31.lesson03.teach.no_thanks:
    title: No, thank you
    gloss: No, thank you.
    note: The simplest polite refusal. Always add *تشکر*; a bare *نه* is abrupt.
  prs.a2.unit31.lesson03.teach.no_need:
    title: There is no need
    gloss: There is no need.
    note: '*لازم نیست* is not necessary. Use it to refuse an offer kindly. You can say *نه، تشکر. لازم نیست.* or *خودم می‌کنم.*'
  prs.a2.unit31.lesson04.teach.neg_pl:
    title: 'Do not ...: the negative command with نـ'
    gloss: do not do, do not go, do not say, do not give, do not take, do not come
    note: 'To say do not, put *نـ* on the command instead of *بـ*: *بروین* becomes *نروین*, *بگویین* becomes *نگویین*, *بدهین* becomes *ندهین*, *بگیرین* becomes *نگیرین*. *کنین* has no *بـ*, so it just gets *نـ* in front: *نکنین*. *بیایین* is the one to remember: it becomes *نیایین*.'
  prs.a2.unit31.lesson04.teach.neg_sg:
    title: The negative command to a friend
    gloss: do not do, do not go, do not say, do not give, do not come, do not take
    note: 'To a friend the same rule applies without the ending: *نکن، نرو، نگو، نده، نیا، نگیر*. A bare *نکن* is blunt, so keep it for friends and children. To a neighbour always say *نکنین* and add *لطفاً*.'
  prs.a2.unit31.lesson04.teach.leave:
    title: 'To put, to leave: بگذارین and نگذارین'
    gloss: put/leave, put/leave (polite); do not put/leave, do not put/leave (polite)
    note: '*گذاشتن* is to put or to leave something somewhere. *دروازه را باز بگذارین* is leave the gate open; *دروازه را باز نگذارین* is do not leave the gate open.'
  prs.a2.unit31.lesson04.teach.dont_late:
    title: Please do not be late
    gloss: Please do not be late.
    note: '*دیر کردن* is to be late or to take too long. *لطفاً دیر نکنین* is a polite reminder before someone brings or sends something.'
  prs.a2.unit31.lesson04.teach.dont_go:
    title: Please do not go tomorrow
    gloss: Please do not go tomorrow.
    note: '*لطفاً* plus a negative command asks someone politely not to do something.'
  prs.a2.unit31.lesson04.teach.dont_come_late:
    title: Please do not come late
    gloss: Please do not come late.
    note: '*نیایین* is the negative of *بیایین* (come).'
  prs.a2.unit31.lesson04.teach.gate_open:
    title: Please do not leave the gate open
    gloss: Please do not leave the gate open.
    note: A typical request to a neighbour or a shop visitor.
  prs.a2.unit31.lesson04.teach.park:
    title: Please do not leave a car here
    gloss: Please do not leave a car here.
    note: 'Another everyday use of *نگذارین*: please do not park here.'
  prs.a2.unit31.lesson04.teach.no_trouble:
    title: Please do not trouble yourself
    gloss: Please do not go to any trouble.
    note: '*زحمت کشیدن* is to take trouble. People say *لطفاً زحمت نکشین* when someone offers them tea or help, to refuse politely and with thanks.'
  prs.a2.unit31.lesson04.teach.better_not:
    title: It is better not to go tomorrow
    gloss: It is better if you do not go tomorrow.
    note: '*بهتر است* (it is better) is a softer way to say do not. It is advice and not an order.'
  prs.a2.unit31.lesson05.teach.mrs:
    title: Mrs, madam
    gloss: Mrs, madam
    note: '*خانم* is put before a woman''s name as a polite title: *خانم رحیمه*.'
    example_gloss: Mrs Rahima is our neighbour.
  prs.a2.unit31.lesson05.teach.mr:
    title: Mr
    gloss: Mr, sir
    note: '*آقای* is put before a man''s name: *آقای مسعود*.'
    example_gloss: Mr Masood is in the shop.
  prs.a2.unit31.lesson05.teach.flower:
    title: Flower
    gloss: flower
    note: '*گل* is a flower. Add *‌ها* for the plural and *-م* for my: *گل‌هایم* (my flowers).'
    example_gloss: My flowers are in the house.
  prs.a2.unit31.lesson05.teach.water:
    title: Water
    gloss: water
    note: '*آب* is water. *آب دادن* is to water a plant: *به گل‌ها آب بدهین*.'
    example_gloss: I drink water.
  prs.a2.unit31.lesson05.teach.not_home:
    title: I am not at home until Friday
    gloss: I am not at home until Friday.
    note: '*نیستم* is I am not. *تا جمعه* is until Friday.'
  prs.a2.unit31.lesson05.teach.may_i:
    title: May I ...?
    gloss: May I leave the key with you?
    note: 'With the *-م* form, *می‌شود که ...؟* asks for permission: *می‌شود که کلید را پیش شما بگذارم؟* is may I leave the key with you? With the *-ین* form it is a request to the other person. Compare *می‌شود که کمک کنم؟* (may I help?) with *می‌شود که کمک کنین؟* (could you help?).'
  prs.a2.unit31.lesson05.teach.people:
    title: Majida and Shafiq are neighbours
    gloss: Majida and Shafiq are neighbours.
    note: In the reading below Majida leaves a note for her neighbour Shafiq.
  prs.a2.unit31.lesson05.teach.d1_t1:
    title: Masood asks for help
    gloss: Hello Mrs Rahima. Excuse me, could you help me a little today?
    note: Masood starts with a greeting and *ببخشین*, then asks with *می‌شود که* and the *-ین* form *کنین*.
  prs.a2.unit31.lesson05.teach.d1_t2:
    title: Rahima agrees
    gloss: Hello Mr Masood. Of course. What shall I do?
    note: '*البته* is a polite yes. *چه کار کنم؟* uses the *-م* form to ask what she should do.'
  prs.a2.unit31.lesson05.teach.d1_t3:
    title: Masood says what he needs
    gloss: Could you carry this table to the room with me?
    note: A second request, this time for a specific thing. *با من* is with me.
  prs.a2.unit31.lesson05.teach.d1_t4:
    title: Rahima accepts
    gloss: Yes, certainly.
    note: A short, warm acceptance.
  prs.a2.unit31.lesson05.teach.d1_t5:
    title: Masood offers tea
    gloss: Thank you very much. Shall I bring tea?
    note: '*خیلی تشکر* is thank you very much. *چای بیاورم؟* is an offer with the *-م* form.'
  prs.a2.unit31.lesson05.teach.d1_t6:
    title: Rahima declines
    gloss: No, thank you. Please do not go to any trouble.
    note: Rahima refuses with *نه، تشکر* and then uses the negative command *نکشین* to say do not trouble yourself.
  prs.a2.unit31.lesson05.teach.message:
    title: A note to a neighbour
    gloss: Hello Mr Shafiq. Tomorrow I am going to Mazar and I will not be at home until Friday. May I leave my house key with you? Please give my flowers water every day. Please do not leave the gate open. Thank you for your kindness. Majida
    note: A short written note with one permission request, one request and one negative request. Notice that it uses the same patterns as the conversation.
  prs.a2.unit31.lesson06.teach.d2_t1:
    title: Farzana phones the shop
    gloss: Hello. Could you send two breads and a carton of milk to our house?
    note: Farzana phones the shop. *الو* is hello on the phone. *بفرستین* is the polite request form of *فرستادن* (to send).
  prs.a2.unit31.lesson06.teach.d2_t2:
    title: The shopkeeper agrees and asks the time
    gloss: Yes, certainly. At what time shall I send it?
    note: The shopkeeper accepts and uses the *-م* form *بفرستم* to ask when.
  prs.a2.unit31.lesson06.teach.d2_t3:
    title: Farzana gives the time
    gloss: At five o'clock. Please do not be late.
    note: Farzana answers with the time and adds a negative command.
  prs.a2.unit31.lesson06.teach.d2_t4:
    title: The shopkeeper promises and offers tea
    gloss: No, I will not be late. Shall I send tea too?
    note: '*نه* here agrees with the negative request: no, I will not be late. Then he offers tea.'
  prs.a2.unit31.lesson06.teach.d2_t5:
    title: Farzana declines
    gloss: No, thank you. I have tea.
    note: 'She declines and gives a reason: she already has tea.'
  prs.a2.unit31.lesson06.teach.d2_t6:
    title: The shopkeeper closes
    gloss: Very well.
    note: A short closing.
  prs.a2.unit31.lesson06.teach.cannot:
    title: Sorry, I cannot now
    gloss: Sorry, I cannot now.
    note: 'To say no to a request, say sorry with *متأسفم* or *ببخشین* and then why or when: *متأسفم، فردا نمی‌توانم.*'
  prs.a2.unit31.lesson06.teach.summary:
    title: The whole system
    gloss: Request, polite command, negative command, offer
    note: 'A request: *می‌شود که ... بدهین؟* or *لطفاً ... بدهین*. A request not to do something: *لطفاً ... نکنین*. An offer: *... بدهم؟* or *می‌خواهین که ... کنم؟*. Replies: *بلی، لطفاً.* or *نه، تشکر.* A refusal of a request: *متأسفم، نمی‌توانم.*'
exercises:
  prs.a2.unit31.lesson01.exercise01.recognize_bread:
    instruction: What does this sentence mean?
    correct_option: Could you give me a little bread?
    distractors:
    - I gave you some bread
    - The bread is on the table
    - I want a lot of bread
    accepted_answers:
    - value: Could you give me a little bread?
      status: correct
    feedback: '*می‌شود که* starts a polite request and *بدهین* is the verb: could you give.'
  prs.a2.unit31.lesson01.exercise02.recognize_help:
    instruction: What does this sentence mean?
    correct_option: Excuse me, could you help me?
    distractors:
    - Excuse me, I will help you
    - Excuse me, where is the shop?
    - Excuse me, I need a bag
    accepted_answers:
    - value: Excuse me, could you help me?
      status: correct
    feedback: '*ببخشین* is excuse me, and *می‌شود که کمک کنین؟* is could you help?'
  prs.a2.unit31.lesson01.exercise03.match_requests:
    instruction: Match each request with its meaning. Each one can follow می‌شود که.
    accepted_answers:
    - value:
        کمی نان بدهین: give me a little bread
        یک شیر بدهین: give me a carton of milk
        یک کیسه بدهین: give me a bag
        کمک کنین: help me
        صبر کنین: wait
        تیلفون کنین: phone me
        به خانه بفرستین: send it to the house
        دروازه را باز کنین: open the gate
      status: correct
    feedback: 'After *می‌شود که* all of these are subjunctive verbs in *-ین*. Two-word verbs keep the first word: *کمک کنین، صبر کنین، تیلفون کنین، باز کنین*.'
  prs.a2.unit31.lesson01.exercise04.order_bread:
    instruction: 'Arrange the words to say: Could you give me a little bread?'
    accepted_answers:
    - value:
      - می‌شود
      - که
      - کمی
      - نان
      - بدهین
      status: correct
    feedback: '*می‌شود که کمی نان بدهین؟* puts the verb last.'
  prs.a2.unit31.lesson01.exercise05.complete_milk:
    instruction: 'Complete the request: Could you give me a carton of milk?'
    accepted_answers:
    - value: بدهین
      status: correct
    feedback: '*بدهین* is the polite subjunctive of *دادن*: *می‌شود که یک شیر بدهین؟*'
  prs.a2.unit31.lesson01.exercise06.translate_bag:
    instruction: 'Translate into Dari: Could you give me a bag?'
    accepted_answers:
    - value: می‌شود که یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌شود که یک کیسه بدهین؟
      status: correct
    - value: می‌شود یک کیسه بدهین؟
      status: correct
    - value: ببخشین، می‌شود یک کیسه بدهین؟
