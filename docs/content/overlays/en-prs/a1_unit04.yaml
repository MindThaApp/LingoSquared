review:
  status: reviewed
  required_next_reviewer: null
  notes: "Fresh-context review completed 2026-07-05, authored independently of the fa realization per the sibling-isolation rule. Fixes made alongside the paired realization file: 9 multiple_choice exercises' prompts changed from displaying the exact correct-answer text to showing the digit instead (previously solvable by string-matching alone, defeating the point of the question), and lesson06 exercise pacing corrected to recognition->drag->production order. Dialect verified as genuinely Afghan Dari (نمبر not شماره, استم/استین forms), no jargon leaks, no script-purity issues. Compiler validation clean before and after fixes. Supplemental pass 2026-07-05 per AUTHORING_GUIDE §11-13: fact cross-check clean (ages/phone numbers internally consistent), fill_in_blank frames all have real surrounding context, and lesson06's write_ages_summary gained a و-joined variant as status:correct (previously only period-joined, and marked acceptable_with_note instead of correct). URGENT FOLLOW-UP 2026-07-05: live QA found the whole en-prs course failed to actually compile (real `compile`, not just `validate` -- `validate` never exercises the full exercise-answer-derivation check that caught this). Root cause here specifically: 3 exercises (lesson04.exercise07.speak_own_age, lesson05.exercise07.speak_own_phone_number, lesson06.exercise02.speak_own_age_reply) asked the learner to supply their own real age/phone number but had only `acceptable_with_note` accepted_answers with no `status:correct` entry -- the compiler has no canonical answer to derive without one, so compilation crashed. Same root problem as the ungradeable-blank-template bug already fixed once in unit02: rewrote all three to ask for a SPECIFIC given fact (age 30, phone 079-345-678, age 26 matching Bashir) with concrete `status:correct` answers instead of an open-ended real-world placeholder. Re-verified with the actual `compile` command -- now produces valid JSON end-to-end. AUDIO-ACCESSIBILITY RETROFIT 2026-07-06 (§14, added after this review completed): converted the 10 listen_type/bare-listen_select exercises' instructions/correct_option/distractors/accepted_answers to match the realization's multiple_choice/translation conversion (the 3 sequence-listening exercises simplified to single-number recognition since no audio exists) -- see that file's notes for the full list. Re-verified 0 remaining §14 violations, content_key parity intact, both validate and compile clean after the retrofit. MATCHING_PAIRS SCALE RETROFIT 2026-07-06 (§16): expanded match_teens/match_tens/match_age_phrases to match the realization's expansion (10/9/4 pairs) -- match_teens and match_tens previously used only a subset of numbers already fully taught in their own lesson. Left match_phone_vocab (3) and match_dialogue_facts (2) unchanged as genuine small closed sets.

    2026-07-07: AUTHORING_GUIDE.md §19 retrofit -- added real example sentence(s) to all 17 kind:vocabulary teaching entries with example_gloss (11 merged multi-number cards each given a positionally-matched list of examples, one per number), each a natural, comprehensible-from-gloss sentence using the card's own word(s), consistent with this course's full-form استم register. schema_version bumped to 1.1. Example sentences are Claude-authored and pending fresh-context review.

    Review 2026-10-20 (en-prs A1 pass): 12 fixes - six example_gloss lines that did not translate their Dari examples (books, people, minutes, pages mismatches); added accepted age and phone-number answer variants (من, سال دارم, نمبر تلفن من). NATIVE FLAGS: see realization."

course:
  title: Dari A1
  description: >-
    Beginner Afghan Dari: counting from one to a hundred, asking and stating
    age, and exchanging phone numbers.

units:
  prs.a1.unit04.numbers:
    title: Counting and numbers

lessons:
  prs.a1.unit04.lesson01.numbers_one_to_ten: {title: "Count from one to ten"}
  prs.a1.unit04.lesson02.numbers_eleven_to_twenty: {title: "Count from eleven to twenty"}
  prs.a1.unit04.lesson03.tens: {title: "Tens up to a hundred"}
  prs.a1.unit04.lesson04.asking_age: {title: "Ask and state someone's age"}
  prs.a1.unit04.lesson05.phone_numbers: {title: "Exchange phone numbers"}
  prs.a1.unit04.lesson06.numbers_exchange_dialogue: {title: "Two friends compare ages and phone numbers"}

teaching:
  prs.a1.unit04.lesson01.teach.one_to_three:
    title: "One, two, three"
    gloss: "1, 2, 3"
    note: "یک، دو، سه are the basic Persian numerals shared across Dari and Farsi."
    example_gloss: ["I have one brother.", "I have two books.", "I have three sisters."]
  prs.a1.unit04.lesson01.teach.four_to_six:
    title: "Four, five, six"
    gloss: "4, 5, 6"
    note: "چهار is the standard written form; some speakers colloquially shorten it to چار in casual speech, but this course uses the standard spelling."
    example_gloss: ["I have four books.", "Wait five minutes.", "He/she has six books."]
  prs.a1.unit04.lesson01.teach.seven_eight:
    title: "Seven, eight"
    gloss: "7, 8"
    note: "هفت، هشت continue the sequence."
    example_gloss: ["There are seven days in a week.", "I'll come at eight o'clock."]
  prs.a1.unit04.lesson01.teach.nine_ten:
    title: "Nine, ten"
    gloss: "9, 10"
    note: "نه، ده complete the numbers one through ten."
    example_gloss: ["There are nine people in the class.", "I have ten fingers."]

  prs.a1.unit04.lesson02.teach.eleven_thirteen:
    title: "Eleven, twelve, thirteen"
    gloss: "11, 12, 13"
    note: "یازده، دوازده، سیزده are formed as distinct words, not simple compounds of the ones digits."
    example_gloss: ["I have class at eleven.", "There are twelve months in a year.", "He/she is thirteen years old."]
  prs.a1.unit04.lesson02.teach.fourteen_sixteen:
    title: "Fourteen, fifteen, sixteen"
    gloss: "14, 15, 16"
    note: "چهارده، پانزده، شانزده continue the teens."
    example_gloss: ["I'll come in fourteen more days.", "He/she has fifteen books.", "He/she is sixteen years old."]
  prs.a1.unit04.lesson02.teach.seventeen_nineteen:
    title: "Seventeen, eighteen, nineteen"
    gloss: "17, 18, 19"
    note: "هفده، هجده، نوزده complete the teens."
    example_gloss: ["He/she has seventeen books.", "He/she is eighteen years old.", "Nineteen days remain."]
  prs.a1.unit04.lesson02.teach.twenty:
    title: "Twenty"
    gloss: "20"
    note: "بیست begins the tens, covered fully in the next lesson."
    example_gloss: "I have twenty books."

  prs.a1.unit04.lesson03.teach.twenty_thirty_forty:
    title: "Twenty, thirty, forty"
    gloss: "20, 30, 40"
    note: "بیست، سی، چهل are the tens words, each a distinct form rather than a predictable pattern."
    example_gloss: ["I am twenty years old.", "There are thirty days in this month.", "He/she is forty years old."]
  prs.a1.unit04.lesson03.teach.fifty_sixty:
    title: "Fifty, sixty"
    gloss: "50, 60"
    note: "پنجاه، شصت continue the tens."
    example_gloss: ["He/she has fifty books.", "Sixty minutes is one hour."]
  prs.a1.unit04.lesson03.teach.seventy_eighty:
    title: "Seventy, eighty"
    gloss: "70, 80"
    note: "هفتاد، هشتاد continue the tens."
    example_gloss: ["This book has seventy pages.", "He/she has eighty books."]
  prs.a1.unit04.lesson03.teach.ninety_hundred:
    title: "Ninety, one hundred"
    gloss: "90, 100"
    note: "نود، صد complete the sequence up to one hundred."
    example_gloss: ["He/she is ninety years old.", "He/she has a hundred books."]
  prs.a1.unit04.lesson03.teach.combining_tens:
    title: "Combine tens and ones"
    gloss: "25 is literally 'twenty and five.'"
    note: "A tens word and a ones word are joined with و (and), the same connector used elsewhere in this course, for example بیست و پنج (25)."

  prs.a1.unit04.lesson04.teach.chand:
    title: "How many / how much"
    gloss: "how many / how much"
    note: "چند introduces a question about a quantity, including age."
    example_gloss: "How old are you?"
  prs.a1.unit04.lesson04.teach.sal_word:
    title: "Year"
    gloss: "year"
    note: "سال is used when stating age, literally 'years.'"
    example_gloss: "I am twenty years old."
  prs.a1.unit04.lesson04.teach.age_question_polite:
    title: "Ask someone's age politely"
    gloss: "How old are you?"
    note: "چند ساله استین؟ literally asks 'how many years old are you,' using the respectful استین form for someone you don't know well."
  prs.a1.unit04.lesson04.teach.age_question_informal:
    title: "Ask a close friend's age"
    gloss: "How old are you?"
    note: "چند ساله استی؟ uses the informal استی; reserve it for a close friend or peer, the same register rule established elsewhere in this course."
  prs.a1.unit04.lesson04.teach.age_answer:
    title: "State your age"
    gloss: "I'm 25 years old."
    note: "بیست و پنج ساله استم combines the number, ساله (years old), and استم."

  prs.a1.unit04.lesson05.teach.number_word:
    title: "Number"
    gloss: "number"
    note: "نمبر is a widely used everyday Afghan term (from Persian/English) for a number, especially a phone number."
    example_gloss: "This is my phone number."
  prs.a1.unit04.lesson05.teach.telephone_word:
    title: "Telephone"
    gloss: "telephone"
    note: "تلفن is the standard word for telephone."
    example_gloss: "My phone is broken."
  prs.a1.unit04.lesson05.teach.phone_question:
    title: "Ask for a phone number"
    gloss: "What is your phone number?"
    note: "نمبر تلفن‌تان چند است؟ uses the same چند pattern from the age question, applied to a phone number."
  prs.a1.unit04.lesson05.teach.zero_word:
    title: "Zero"
    gloss: "zero"
    note: "صفر is needed for reading out most Afghan phone numbers."
    example_gloss: "Zero is a number."
  prs.a1.unit04.lesson05.teach.phone_answer:
    title: "Give your phone number"
    gloss: "My phone number is 079-345-678."
    note: "Afghan phone numbers are typically read out in short grouped chunks rather than digit by digit, as modeled here."

  prs.a1.unit04.lesson06.teach.turn01:
    title: "Homayoun greets Bashir"
    gloss: "Homayoun asks Bashir how he's doing, using the informal register appropriate for a close friend."
    note: "جور استی؟ signals these two are already close friends, so the informal register is appropriate throughout this dialogue."
  prs.a1.unit04.lesson06.teach.turn02:
    title: "Bashir replies and asks Homayoun's age"
    gloss: "Bashir says he's well and asks how old Homayoun is."
    note: "چند ساله استی؟ uses the informal register consistent with their friendship."
  prs.a1.unit04.lesson06.teach.turn03:
    title: "Homayoun answers and returns the question"
    gloss: "Homayoun says he's 28 and asks Bashir the same question."
    note: "The age-answer pattern from lesson04 is reused directly."
  prs.a1.unit04.lesson06.teach.turn04:
    title: "Bashir answers"
    gloss: "Bashir says he's 26."
    note: "Completes the age exchange."
  prs.a1.unit04.lesson06.teach.turn05:
    title: "Homayoun asks for Bashir's phone number"
    gloss: "Homayoun asks for Bashir's phone number."
    note: "تلفنت uses the informal possessive ending, matching the register of the rest of this dialogue."
  prs.a1.unit04.lesson06.teach.turn06:
    title: "Bashir gives his phone number"
    gloss: "Bashir reads out his phone number in grouped chunks."
    note: "The number is read out the same natural grouped way as lesson05's example."
  prs.a1.unit04.lesson06.teach.turn07:
    title: "Homayoun confirms he's saved it"
    gloss: "Homayoun thanks him and says he'll save it right now."
    note: "سیف می‌کنم (from English 'save') is a common informal Afghan tech-related loanword, appropriate for this casual exchange between friends."

exercises:
  prs.a1.unit04.lesson01.exercise01.recognize_three:
    instruction: "Which word means the number 3?"
    correct_option: سه
    distractors: [دو, چهار, هفت]
    accepted_answers: [{value: سه, status: correct}]
    feedback: "سه means three."
  prs.a1.unit04.lesson01.exercise02.recognize_seven:
    instruction: "Which word means the number 7?"
    correct_option: هفت
    distractors: [هشت, نه, شش]
    accepted_answers: [{value: هفت, status: correct}]
    feedback: "هفت means seven."
  prs.a1.unit04.lesson01.exercise03.recognize_seh_reading:
    instruction: "Which number is this?"
    correct_option: three
    distractors: [seven, nine, ten]
    accepted_answers: [{value: three, status: correct}]
    feedback: "سه means three."
  prs.a1.unit04.lesson01.exercise04.match_one_to_ten:
    instruction: "Match each Dari number word with its digit."
    accepted_answers:
      - {value: {یک: "1", دو: "2", سه: "3", چهار: "4", پنج: "5", شش: "6", هفت: "7", هشت: "8", نه: "9", ده: "10"}, status: correct}
    feedback: "These ten words cover the numbers one through ten."
  prs.a1.unit04.lesson01.exercise05.order_count_to_five:
    instruction: "Arrange the numbers in order from one to five."
    accepted_answers: [{value: [یک, دو, سه, چهار, پنج], status: correct}]
    feedback: "یک، دو، سه، چهار، پنج counts up to five in order."
  prs.a1.unit04.lesson01.exercise06.translate_number:
    instruction: "Translate into Dari: eight."
    accepted_answers:
      - {value: هشت, status: correct}
    feedback: "هشت means eight (8)."
  prs.a1.unit04.lesson01.exercise07.write_number_word:
    instruction: "Write the Dari word for the number 10."
    accepted_answers:
      - {value: ده, status: correct}
    feedback: "ده means ten."

  prs.a1.unit04.lesson02.exercise01.recognize_fifteen:
    instruction: "Which word means the number 15?"
    correct_option: پانزده
    distractors: [چهارده, شانزده, پنج]
    accepted_answers: [{value: پانزده, status: correct}]
    feedback: "پانزده means fifteen."
  prs.a1.unit04.lesson02.exercise02.recognize_twenty:
    instruction: "Which word means the number 20?"
    correct_option: بیست
    distractors: [دوازده, نوزده, ده]
    accepted_answers: [{value: بیست, status: correct}]
    feedback: "بیست means twenty."
  prs.a1.unit04.lesson02.exercise03.recognize_davazdah_reading:
    instruction: "Which number is this?"
    correct_option: twelve
    distractors: [thirteen, fourteen, eleven]
    accepted_answers: [{value: twelve, status: correct}]
    feedback: "دوازده means twelve."
  prs.a1.unit04.lesson02.exercise04.match_teens:
    instruction: "Match each Dari number word with its digit."
    accepted_answers:
      - {value: {یازده: "11", دوازده: "12", سیزده: "13", چهارده: "14", پانزده: "15", شانزده: "16", هفده: "17", هجده: "18", نوزده: "19", بیست: "20"}, status: correct}
    feedback: "These ten words cover the numbers eleven through twenty."
  prs.a1.unit04.lesson02.exercise05.order_teens_sequence:
    instruction: "Arrange the numbers in order: 17, 18, 19, 20."
    accepted_answers: [{value: [هفده, هجده, نوزده, بیست], status: correct}]
    feedback: "هفده، هجده، نوزده، بیست counts from seventeen to twenty."
  prs.a1.unit04.lesson02.exercise06.translate_teen:
    instruction: "Translate into Dari: sixteen."
    accepted_answers:
      - {value: شانزده, status: correct}
    feedback: "شانزده means sixteen (16)."
  prs.a1.unit04.lesson02.exercise07.translate_eighteen:
    instruction: "Translate into Dari: eighteen."
    accepted_answers:
      - {value: هجده, status: correct}
    feedback: "هجده means eighteen."

  prs.a1.unit04.lesson03.exercise01.recognize_sixty:
    instruction: "Which word means the number 60?"
    correct_option: شصت
    distractors: [پنجاه, هفتاد, شش]
    accepted_answers: [{value: شصت, status: correct}]
    feedback: "شصت means sixty."
  prs.a1.unit04.lesson03.exercise02.recognize_hundred:
    instruction: "Which word means the number 100?"
    correct_option: صد
    distractors: [نود, ده, هشتاد]
    accepted_answers: [{value: صد, status: correct}]
    feedback: "صد means one hundred."
  prs.a1.unit04.lesson03.exercise03.recognize_see_reading:
    instruction: "Which number is this?"
    correct_option: thirty
    distractors: [forty, twenty, fifty]
    accepted_answers: [{value: thirty, status: correct}]
    feedback: "سی means thirty."
  prs.a1.unit04.lesson03.exercise04.match_tens:
    instruction: "Match each Dari number word with its digit."
    accepted_answers:
      - {value: {بیست: "20", سی: "30", چهل: "40", پنجاه: "50", شصت: "60", هفتاد: "70", هشتاد: "80", نود: "90", صد: "100"}, status: correct}
    feedback: "These nine words cover every ten from twenty through one hundred."
  prs.a1.unit04.lesson03.exercise05.order_combined_number:
    instruction: "Arrange the words to say twenty-five."
    accepted_answers: [{value: [بیست, و, پنج], status: correct}]
    feedback: "بیست و پنج literally means 'twenty and five.'"
  prs.a1.unit04.lesson03.exercise06.fill_combined_number:
    instruction: "Complete the number thirty-three."
    accepted_answers:
      - {value: و, status: correct}
    feedback: "سی و سه joins the tens and ones with و."
  prs.a1.unit04.lesson03.exercise07.translate_forty_two:
    instruction: "Translate into Dari: forty-two."
    accepted_answers:
      - {value: "چهل و دو", status: correct}
    feedback: "چهل و دو means forty-two."

  prs.a1.unit04.lesson04.exercise01.recognize_age_question:
    instruction: "Which phrase politely asks someone's age?"
    correct_option: "چند ساله استین؟"
    distractors: ["چند ساله استی؟", "نمبر تلفن‌تان چند است؟", "نام‌تان چیست؟"]
    accepted_answers: [{value: "چند ساله استین؟", status: correct}]
    feedback: "چند ساله استین؟ is the respectful form for someone you don't know well."
  prs.a1.unit04.lesson04.exercise02.recognize_register:
    instruction: "چند ساله استی؟ is appropriate to ask..."
    correct_option: "a close friend"
    distractors: ["a stranger you just met", "an elder at a formal event", "a new colleague on the first day"]
    accepted_answers: [{value: "a close friend", status: correct}]
    feedback: "The informal استی form fits only a close friend or peer, the same rule as elsewhere in this course."
  prs.a1.unit04.lesson04.exercise03.recognize_age_question_reading:
    instruction: "What does this question ask?"
    correct_option: "How old are you? (polite)"
    distractors: ["How old are you? (informal)", "What is your phone number?", "What is your name?"]
    accepted_answers: [{value: "How old are you? (polite)", status: correct}]
    feedback: "چند ساله استین؟ asks how old you are, politely."
  prs.a1.unit04.lesson04.exercise04.match_age_phrases:
    instruction: "Match each phrase or word with its meaning."
    accepted_answers:
      - {value: {"چند ساله استین؟": "How old are you? (polite)", "چند ساله استی؟": "How old are you? (informal)", "بیست و پنج ساله استم": "I'm 25 years old.", سال: year, چند: "how many"}, status: correct}
    feedback: "The register split mirrors نام‌تان/نامت from the introductions unit; سال and چند are the standalone words this lesson builds the age question from."
  prs.a1.unit04.lesson04.exercise05.order_age_answer:
    instruction: "Arrange the words to say I'm 25 years old."
    accepted_answers: [{value: [بیست, و, پنج, ساله, استم], status: correct}]
    feedback: "بیست و پنج ساله استم states the age."
  prs.a1.unit04.lesson04.exercise06.translate_age_answer:
    instruction: "Translate into Dari: I'm 25 years old."
    accepted_answers:
      - {value: "بیست و پنج ساله استم", status: correct}
      - {value: "من بیست و پنج ساله استم", status: correct}
      - {value: "بیست و پنج سال دارم", status: correct}
      - {value: "من بیست و پنج سال دارم", status: correct}
    feedback: "بیست و پنج ساله استم means I'm 25 years old."
  prs.a1.unit04.lesson04.exercise07.speak_own_age:
    instruction: "چند ساله استین؟ Answer as if you are 30 years old."
    accepted_answers:
      - {value: "سی ساله استم", status: correct}
      - {value: "من سی ساله استم", status: correct}
      - {value: "سی سال دارم", status: correct}
      - {value: "من سی سال دارم", status: correct}
    feedback: "سی ساله استم states an age of 30 using the [number] ساله استم pattern."

  prs.a1.unit04.lesson05.exercise01.recognize_phone_question:
    instruction: "Which phrase asks for a phone number?"
    correct_option: "نمبر تلفن‌تان چند است؟"
    distractors: ["چند ساله استین؟", "نام‌تان چیست؟", "کار شما چیست؟"]
    accepted_answers: [{value: "نمبر تلفن‌تان چند است؟", status: correct}]
    feedback: "نمبر تلفن‌تان چند است؟ asks for a phone number."
  prs.a1.unit04.lesson05.exercise02.recognize_zero:
    instruction: "Which word means zero?"
    correct_option: صفر
    distractors: [ده, نه, یک]
    accepted_answers: [{value: صفر, status: correct}]
    feedback: "صفر means zero."
  prs.a1.unit04.lesson05.exercise03.recognize_phone_question_reading:
    instruction: "What does this question ask?"
    correct_option: "What is your phone number?"
    distractors: ["How old are you?", "What is your name?", "Where are you from?"]
    accepted_answers: [{value: "What is your phone number?", status: correct}]
    feedback: "نمبر تلفن‌تان چند است؟ asks for your phone number."
  prs.a1.unit04.lesson05.exercise04.match_phone_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - {value: {نمبر: number, تلفن: telephone, صفر: zero}, status: correct}
    feedback: "These three words are the core vocabulary for exchanging phone numbers."
  prs.a1.unit04.lesson05.exercise05.order_phone_question:
    instruction: "Arrange the words to ask for a phone number."
    accepted_answers: [{value: [نمبر, تلفن‌تان, چند, است], status: correct}]
    feedback: "نمبر تلفن‌تان چند است؟ asks for the number."
  prs.a1.unit04.lesson05.exercise06.translate_phone_answer:
    instruction: "Translate into Dari: My phone number is 0-79-345-678."
    accepted_answers:
      - {value: "نمبر تلفنم صفر هفتاد و نه، سه چهار پنج، شش هفت هشت است", status: correct}
      - {value: "نمبر تلفنم صفر هفتاد و نه سه چهار پنج شش هفت هشت است", status: correct}
