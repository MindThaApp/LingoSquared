  notes: "Fresh-context Dari review required before import.

    Review 2026-10-20 (en-prs B2 pass): 9 fixes - learner-facing template wording (recognize_sentence feedback now states the meaning instead of an internal remark; grammar_check feedback now names the specific error in each lesson; speak/write instructions and feedback no longer say 'taught sentence meaning' / 'taught B2 frame'); L1 card08/card09 glossed the full source notes as 'source one/two' -> titles 'first/second report' with a full English translation of each note as the gloss. NATIVE FLAGS: خلاصه اینکه (joined, course-wide); whether quoting farmers is enough to call report two better supported, since report one quotes village elders."
course:
  title: Dari B2
  description: Combine sources, identify agreement and conflict, and give a reasoned judgement.
units:
  prs.b2.unit08.synthesis:
    title: Synthesis
    description: Combine sources, identify agreement and conflict, and give a reasoned judgement.
lessons:
  prs.b2.unit08.synthesis.lesson01.compare:
    title: Comparing sources
  prs.b2.unit08.synthesis.lesson02.judge:
    title: Reasoned judgement
  prs.b2.unit08.synthesis.lesson03.summary:
    title: Final synthesis
teaching:
  prs.b2.unit08.synthesis.lesson01.compare.teach.card01:
    title: both reports
    gloss: both reports
    note: '*هر دو گزارش* signals that the summary must represent both sources, not just the preferred one.'
    example_gloss: Both reports refer to the water canal.
  prs.b2.unit08.synthesis.lesson01.compare.teach.card02:
    title: source
    gloss: source
    note: '*منبع* is the source of a claim; synthesis depends on saying which source supports which point.'
    example_gloss: The first source is a local interview.
  prs.b2.unit08.synthesis.lesson01.compare.teach.card03:
    title: cost
    gloss: cost
    note: '*هزینه* is one disputed dimension between the reports, so it should not be treated as shared evidence.'
    example_gloss: The repair cost is not final yet.
  prs.b2.unit08.synthesis.lesson01.compare.teach.card04:
    title: agree
    gloss: agree
    note: '*توافق دارند* marks agreement; use it only for points both sources actually share.'
    example_gloss: The two sources agree about the main problem.
  prs.b2.unit08.synthesis.lesson01.compare.teach.card05:
    title: timing / time
    gloss: timing / time
    note: '*زمان* names the timing issue, one of the places where the canal reports conflict.'
    example_gloss: The completion time is not known.
  prs.b2.unit08.synthesis.lesson01.compare.teach.card06:
    title: disagree
    gloss: disagree
    note: '*اختلاف دارند* takes plural agreement because the reports are the ones disagreeing.'
    example_gloss: The sources disagree about implementation timing.
  prs.b2.unit08.synthesis.lesson01.compare.teach.card07:
    title: canal
    gloss: canal
    note: '*کانال* is the shared topic of both source notes; keep the comparison centered on repair of it.'
    example_gloss: The village water canal has dried up.
  prs.b2.unit08.synthesis.lesson01.compare.teach.card08:
    title: first report
    gloss: 'Report 1: The village elders say that repairing the canal takes two weeks and that its cost is low.'
    note: '*گزارش اول* gives one concrete viewpoint; read it for its cost and timing claims before summarizing.'
  prs.b2.unit08.synthesis.lesson01.compare.teach.card09:
    title: second report
    gloss: 'Report 2: The farmers say that the repair cost is high, but the work must be finished within a week.'
    note: '*گزارش دوم* gives the contrasting viewpoint; compare its cost and timing claims with the first report.'
  prs.b2.unit08.synthesis.lesson01.compare.teach.grammar:
    title: Synthesis grammar
    gloss: Synthesis grammar
    note: A synthesis sentence should name what the two sources share, then the exact point where they differ.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card01:
    title: in my opinion
    gloss: in my opinion
    note: '*به نظر من* introduces your judgement after comparing sources; it should still be backed by evidence.'
    example_gloss: In my opinion, the second source is more precise.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card02:
    title: the second report
    gloss: the second report
    note: '*گزارش دوم* is singular, so later verbs like *نقل می‌کند* must be singular too.'
    example_gloss: The second report interviewed farmers.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card03:
    title: is more convincing
    gloss: is more convincing
    note: '*قانع‌کننده‌تر است* compares persuasiveness; it requires a reason, not just preference.'
    example_gloss: This reason is more convincing than the previous example.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card04:
    title: number
    gloss: number
    note: '*عدد* can strengthen support when a report gives specifics instead of vague claims.'
    example_gloss: An exact number helps the reader.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card05:
    title: exact / precise
    gloss: exact / precise
    note: '*دقیق* describes precise evidence; in Dari it follows the noun it modifies.'
    example_gloss: The exact date is in the report.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card06:
    title: gives
    gloss: gives
    note: '*می‌دهد* completes frames like "gives an example"; keep the subject singular unless the source is plural.'
    example_gloss: The writer gives an example for the claim.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card07:
    title: judgement
    gloss: judgement
    note: '*داوری* is the judgement stage of synthesis, after agreement and conflict have been stated.'
    example_gloss: A judgement without a reason is not enough.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card08:
    title: is better supported
    gloss: is better supported
    note: '*بهتر پشتیبانی شده است* means better supported by evidence; it should be followed or preceded by the support.'
    example_gloss: The second claim is better supported.
  prs.b2.unit08.synthesis.lesson02.judge.teach.card09:
    title: farmers
    gloss: farmers
    note: '*دهقانان* are the directly cited stakeholders, which is why report two can be judged stronger.'
    example_gloss: The farmers spoke of water shortage.
  prs.b2.unit08.synthesis.lesson02.judge.teach.grammar:
    title: Synthesis grammar
    gloss: Synthesis grammar
    note: '*قانع‌کننده‌تر است* gives evaluation; B2 synthesis must add the reason for that judgement.'
  prs.b2.unit08.synthesis.lesson03.summary.teach.card01:
    title: in summary
    gloss: in summary
    note: '*خلاصه اینکه* closes the comparison; use it after the source details have already been introduced.'
    example_gloss: In summary, both sources tell part of the reality.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card02:
    title: synthesis / summary
    gloss: synthesis / summary
    note: '*جمع‌بندی* should balance both sources before choosing which conclusion is better supported.'
    example_gloss: The synthesis should be impartial.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card03:
    title: shared point
    gloss: shared point
    note: '*نقطه مشترک* is the shared point, so it must be something both reports actually say.'
    example_gloss: The shared point of the two reports is the need for repair.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card04:
    title: conflict
    gloss: conflict
    note: '*تضاد* marks conflict between claims, stronger than a small wording difference.'
    example_gloss: The main conflict is about scheduling.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card05:
    title: despite this disagreement
    gloss: despite this disagreement
    note: '*با وجود این اختلاف* lets you acknowledge conflict while still drawing a careful overall judgement.'
    example_gloss: Despite this disagreement, both sources are useful.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card06:
    title: conclusion
    gloss: conclusion
    note: '*نتیجه* is the conclusion drawn from the sources; it should not introduce a new unsupported fact.'
    example_gloss: The conclusion must come from evidence.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card07:
    title: we should be cautious
    gloss: we should be cautious
    note: '*بهتر است محتاط باشیم* gives a cautious evaluation when the sources conflict or evidence is incomplete.'
    example_gloss: We should be cautious because the information is incomplete.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card08:
    title: information
    gloss: information
    note: '*معلومات* is the information being weighed; distinguish it from the source that provides it.'
    example_gloss: New information will be published tomorrow.
  prs.b2.unit08.synthesis.lesson03.summary.teach.card09:
    title: gives a fuller picture
    gloss: gives a fuller picture
    note: '*تصویر کامل‌تری می‌دهد* explains why reading both sources improves the synthesis; the singular verb agrees with the act of reading.'
    example_gloss: Reading two sources gives a fuller picture.
  prs.b2.unit08.synthesis.lesson03.summary.teach.grammar:
    title: Synthesis grammar
    gloss: Synthesis grammar
    note: '*خلاصه اینکه* closes a synthesis. It should gather agreement, conflict, and judgement without adding a new source.'
exercises:
