    instruction: What does this Dari word or phrase mean?
    correct_option: they disagree
    distractors:
    - they invite us
    - they had begun
    - they pay cash
    accepted_answers:
    - value: they disagree
      status: correct
    feedback: '*اختلاف دارند* means they disagree.'
  prs.b2.unit08.synthesis.lesson01.compare.exercise02.recognize_sentence:
    instruction: What is the best English meaning of this Dari sentence?
    correct_option: Both reports discuss canal repair, but disagree about cost and timing.
    distractors:
    - Both reports say the repair cost is low and the timing is the same.
    - The first report discusses the school, while the second discusses the hospital.
    - Both reports reject repairing the canal.
    accepted_answers:
    - value: Both reports discuss canal repair, but disagree about cost and timing.
      status: correct
    feedback: 'This sentence means: Both reports discuss canal repair, but disagree about cost and timing.'
  prs.b2.unit08.synthesis.lesson01.compare.exercise03.match:
    instruction: Match each Dari item with its English meaning.
    accepted_answers:
    - value:
        هر دو گزارش: both reports
        منبع: source
        هزینه: cost
        توافق دارند: agree
        زمان: timing / time
        اختلاف دارند: disagree
        کانال: canal
        در حالی که: whereas
      status: correct
