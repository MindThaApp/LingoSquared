  notes: 'Paired with prs/a2_unit36_in_order_to.yaml (see that file''s review notes for the full rationale, the character canon check and the open questions for a native Dari reviewer). Every multi-clause production answer enumerates comma and no-comma variants, swapped clause order, optional من, and both برای اینکه and تا where the course teaches them (AUTHORING_GUIDE section 12). Every note and feedback string that mixes Dari with English wraps the Dari in single asterisks (section 15). Each example_gloss matches its realization example (section 19). Production prompts name the form they want and the feedback shows an accepted string. The three listening/reading-with-transcript items show the full transcript in the prompt (prs has no TTS) and their distractors were hand-checked against both dialogues and the message. status: unreviewed; the mandatory fresh-context review has not run.'
course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: saying what you do something for. Purpose with برای plus a noun or an infinitive, برای اینکه and تا plus the subjunctive, and the negative (so that I do not ...), for errands, learning and saving money.'
units:
  prs.a2.unit36.in_order_to:
    title: In order to
lessons:
  prs.a2.unit36.lesson01.errands_and_for:
    title: 'Errands: for + noun or infinitive'
  prs.a2.unit36.lesson02.for_that_subjunctive:
    title: 'In order that: the subjunctive'
  prs.a2.unit36.lesson03.ta_and_negative:
    title: 'So that: تا and the negative'
  prs.a2.unit36.lesson04.learning_and_saving:
    title: Learning and saving money
  prs.a2.unit36.lesson05.reading_and_listening:
    title: Reading and listening about errands and saving
  prs.a2.unit36.lesson06.english_conversation:
    title: A conversation about learning English
teaching:
  prs.a2.unit36.lesson01.errands_and_for.teach.friends:
    title: Faroozan and Arif
    gloss: This is Faroozan. This is Arif. They are friends.
    note: '*فروزان* and *عارف* are two friends who appear in the conversations and examples of this unit. Faroozan is a woman and Arif is a man.'
  prs.a2.unit36.lesson01.errands_and_for.teach.post:
    title: Post office
    gloss: post office
    note: '*پُسته خانه* is the post office. People go there to send a letter or a parcel.'
    example_gloss: The post office is near.
  prs.a2.unit36.lesson01.errands_and_for.teach.letter:
    title: Letter
    gloss: letter
    note: '*نامه* is a letter. You send a letter with *را*: *نامه را می‌فرستم*.'
    example_gloss: The letter is at the post office.
  prs.a2.unit36.lesson01.errands_and_for.teach.bank:
    title: Bank
    gloss: bank
    note: '*بانک* is a bank. You go there to take money (*پول*) or to put money in.'
    example_gloss: The bank is in the market.
  prs.a2.unit36.lesson01.errands_and_for.teach.send:
    title: To send
    gloss: to send
    note: '*فرستادن* is to send. It is also the infinitive you use after *برای*: *برای فرستادن نامه* is in order to send a letter.'
    example_gloss: Sending a letter is easy.
  prs.a2.unit36.lesson01.errands_and_for.teach.shopping:
    title: Shopping
    gloss: shopping, purchases
    note: '*خرید* is shopping, the things you buy. *خرید دارم* means I have shopping to do.'
    example_gloss: Today I have a lot of shopping.
  prs.a2.unit36.lesson01.errands_and_for.teach.for_noun:
    title: 'برای + noun: what you do something for'
    gloss: I go to the market for shopping. I come to Kabul for work. I go home for a rest.
    note: 'Put *برای* before a noun to say what you do something for: *برای خرید* (for shopping), *برای کار* (for work), *برای استراحت* (for a rest). The place stays with *به*: *به بازار می‌روم*. In English you often say to or in order to; in Dari the noun after *برای* already gives the purpose.'
  prs.a2.unit36.lesson01.errands_and_for.teach.for_inf:
    title: 'برای + infinitive: in order to do something'
    gloss: In order to send a letter I go to the post office. In order to buy bread I go to the shop. In order to get money I go to the bank.
    note: 'To say what you do something in order to do, put the infinitive after *برای*: *فرستادن* (to send), *خریدن* (to buy), *گرفتن* (to take, to get). The infinitive ends in *ن*. The thing you send, buy or take comes after the infinitive: *فرستادن نامه*, *خریدن نان*, *گرفتن پول*.'
  prs.a2.unit36.lesson01.errands_and_for.teach.order_question:
    title: The purpose can come last; asking what for
    gloss: I go to the bank in order to get money. What do you go to the bank for?
    note: 'The purpose can also come at the end: *به بانک می‌روم برای گرفتن پول*. To ask what for, say *برای چه؟*: *برای چه به بانک می‌روی؟* means what do you go to the bank for? You answer with *برای* and a noun or an infinitive.'
  prs.a2.unit36.lesson01.errands_and_for.teach.sentence:
    title: In order to send a letter, I go to the post office
    gloss: In order to send a letter, I go to the post office.
    note: 'This is the pattern of the first lesson: *برای* + infinitive first, then the place with *به*, then the verb at the end.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_form:
    title: 'The subjunctive: ب + present stem + ending'
    gloss: that I buy, that I go, that I take, that I send, that I read, that I see, that I come, that I bring
    note: 'The subjunctive is the verb form that comes after *برای اینکه* and *تا*. You build it from the present stem: put *ب-* in front and add the personal ending. For I the ending is *-م*: *بخرم* (that I buy), *بروم* (that I go), *بگیرم* (that I take). It is the same form you already know from *می‌خواهم بروم* and *باید بیایم*. Two forms are spelled differently and are best learned as they are: *بیایم* (from *آمدن*) and *بیاورم* (from *آوردن*).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.subj_paradigm:
    title: The six persons of the subjunctive
    gloss: that I buy, that you buy, that he or she buys, that we buy, that you buy (formal or plural), that they buy
    note: 'The endings are *-م، -ی، -د، -یم، -ین، -ند*. The ending for you (formal or plural) is *-ین*, as everywhere in this course. The subjunctive has no *می‌*: compare *می‌خرم* (I buy) with *بخرم* (that I buy).'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.for_that:
    title: 'برای اینکه + subjunctive: so that I do something'
    gloss: In order to buy bread, I go to the shop. In order to get money, I go to the bank.
    note: '*برای اینکه* means in order that or so that. It starts a clause with its own subjunctive verb, and the verb shows the person: *برای اینکه نان بخرم* is so that I buy bread. The main clause tells what you do. Where English says to buy, Dari says so that I buy. The two clauses can swap places: *به دوکان می‌روم برای اینکه نان بخرم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.more_verbs:
    title: More examples, and two-word verbs
    gloss: In order to send a letter, I go to the post office. In order to see my friend, I go to Kabul. In order to save, I walk.
    note: 'The same rule works for every verb. With a two-word verb such as *پس‌انداز کردن* only the verb part changes and there is no *ب-*: *پس‌انداز کنم* (that I save), *کار کنم* (that I work). Put the thing you see or take with *را* before the verb: *دوستم را ببینم*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.teach.sentence:
    title: In order to buy bread, I go to the shop
    gloss: In order to buy bread, I go to the shop.
    note: 'Compare with lesson 1: *برای خریدن نان* (infinitive) and *برای اینکه نان بخرم* (subjunctive clause) say the same thing.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.ta:
    title: 'تا + subjunctive: the short form'
    gloss: I go to the shop so that I buy bread. I go to the bank so that I get money. I go to the post office so that I send a letter.
    note: '*تا* is a short form of *برای اینکه*. It comes after the main clause and is followed by a subjunctive verb: *به دوکان می‌روم تا نان بخرم*. *تا* has other meanings too, for example until in *تا ساعت ده*. If a subjunctive verb with *ب-* follows, it means so that.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.persons:
    title: 'Other persons: we, he, they'
    gloss: We go so that we buy bread. He goes so that he sends a letter. They go so that they get money.
    note: 'Both verbs take the same person when the subject is the same: *می‌رویم* and *بخریم* both end in *-یم* (we). The endings of the subjunctive are *-م، -ی، -د، -یم، -ین، -ند*, so *بفرستد* is that he or she sends and *بگیرند* is that they take.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative:
    title: 'The negative: ن + stem'
    gloss: I go early so that I do not arrive late. So that I do not arrive late, I go early.
    note: 'To say what you want to avoid, put *ن-* before the stem and drop the *ب-*: *برسم* (that I arrive) becomes *نرسم* (that I do not arrive). The main clause tells what you do to avoid it: *زود می‌روم*.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.negative_two_word:
    title: The negative of two-word verbs
    gloss: I put my money in the bank so that I do not lose it.
    note: 'With a two-word verb the *ن-* goes on the verb part: *گم کنم* (that I lose) becomes *گم نکنم* (that I do not lose). *آن را* (it) points back to the money.'
  prs.a2.unit36.lesson03.ta_and_negative.teach.sentence:
    title: I go early so that I do not arrive late
    gloss: I go early so that I do not arrive late.
    note: '*تا دیر نرسم* names what you do not want, and *زود می‌روم* is what you do about it.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.lesson:
    title: Lesson, study
    gloss: lesson, class
    note: '*درس* is a lesson or a class. With *خواندن* it means to study: *درس خواندن*.'
    example_gloss: The English lesson is at four o'clock.
  prs.a2.unit36.lesson04.learning_and_saving.teach.exam:
    title: Exam
    gloss: exam, test
    note: '*امتحان* is an exam. You take the exam and get a mark (*نمبر*).'
    example_gloss: The exam is tomorrow.
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn:
    title: To learn
    gloss: to learn
    note: '*یاد گرفتن* is to learn. *یاد* is the first part and *گرفتن* is the verb. The subjunctive for I is *یاد بگیرم*, with *ب-* before *گیر*.'
    example_gloss: I am learning English.
  prs.a2.unit36.lesson04.learning_and_saving.teach.study:
    title: To study
    gloss: to study
    note: '*درس خواندن* is to study. *می‌خوانم* is I read or I study. The lesson stays in front, like *درس می‌خوانم*.'
    example_gloss: Every night I study.
  prs.a2.unit36.lesson04.learning_and_saving.teach.expensive:
    title: Expensive
    gloss: expensive
    note: '*گران* means expensive. Its opposite is *ارزان* (cheap).'
    example_gloss: The course is expensive.
  prs.a2.unit36.lesson04.learning_and_saving.teach.cheap:
    title: Cheap
    gloss: cheap
    note: '*ارزان* means cheap. Things that are *ارزان* help you save money.'
    example_gloss: The bicycle is cheap.
  prs.a2.unit36.lesson04.learning_and_saving.teach.spend:
    title: To spend money
    gloss: to spend (money)
    note: '*خرج کردن* is to spend money. The negative of the two-word verb puts *ن* on *کردن*: *خرج نکنم* (that I do not spend).'
    example_gloss: I do not spend a lot of money.
  prs.a2.unit36.lesson04.learning_and_saving.teach.for_noun2:
    title: برای + noun with learning and saving words
    gloss: I study for the exam. I save money for the course.
    note: 'The pattern from lesson 1 works with these words too: *برای امتحان* (for the exam), *برای کورس* (for the course). A noun after *برای* is a short way to say what the effort is for.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.learn_clause:
    title: Purpose clauses about learning
    gloss: In order to learn English, I read a book every night. In order to get a good mark in the exam, I study a lot.
    note: 'Use *برای اینکه* or *تا* with a subjunctive verb to say why you study: *یاد بگیرم* (that I learn), *نمبر خوب بگیرم* (that I get a good mark). Both clauses work in either order.'
  prs.a2.unit36.lesson04.learning_and_saving.teach.save_clause:
    title: Purpose clauses about saving money
    gloss: I save money so that I buy a bicycle. I buy a cheap book so that I do not spend a lot of money.
    note: For saving money, the main clause says what you do and the *تا* clause says what for. The negative *خرج نکنم* tells what you do not want to happen.
  prs.a2.unit36.lesson04.learning_and_saving.teach.sentence:
    title: I save so that I buy a bicycle
    gloss: I save money in order to buy a bicycle.
    note: A short sentence that names the action first and the purpose last.
  prs.a2.unit36.lesson05.reading_and_listening.teach.narges:
    title: Fozia
    gloss: Fozia is Faroozan's friend.
    note: '*فوزیه* is a third friend. She writes the message in this lesson. She is not the same person as Faroozan.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.fare:
    title: 'To pay the fare: کرایه دادن'
    gloss: I pay the fare. I do not pay the fare. So that I do not pay the fare, I walk.
    note: '*کرایه دادن* is to pay the fare for a taxi or a bus. The present is *می‌دهم*, the negative is *نمی‌دهم*, and the negative subjunctive is *ندهم* (that I do not give). *پیاده می‌روم* is I go on foot.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn01:
    title: Faroozan asks where Arif is going
    gloss: Arif, where are you going today?
    note: Faroozan asks *به کجا می‌روی؟* with the present *می‌روی*. She is a friend, so she uses *تو*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn02:
    title: Arif names two errands
    gloss: First I go to the post office to send this letter. Then I go to the bank.
    note: 'The first errand has a purpose: *تا این نامه را بفرستم*. *اول* and *بعد* put the two errands in order.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn03:
    title: Faroozan asks about the bank
    gloss: What do you have to do at the bank?
    note: '*چه کار داری؟* asks what business you have somewhere.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn04:
    title: Arif says what for
    gloss: I go to get money.
    note: The short answer *می‌روم تا پول بگیرم* gives the purpose with *تا* and the subjunctive *بگیرم*.
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn05:
    title: Faroozan asks how he goes
    gloss: Do you go by car?
    note: '*با موتر* is by car.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.errand_turn06:
    title: Arif walks to save the fare
    gloss: No, I walk so that I do not pay the fare.
    note: '*نخیر* is no. *تا کرایه ندهم* is the negative purpose: he walks to save money.'
  prs.a2.unit36.lesson05.reading_and_listening.teach.message:
    title: A message about saving money
    gloss: Hello Faroozan. Every month I save two thousand afghanis so that I can buy a bicycle. So that I do not pay fares, I want to go to school by bicycle. Tomorrow I go to the bank to take my money. Fozia
    note: 'A short message with three purposes: *تا یک بایسکل بخرم* (to buy a bicycle), *برای اینکه کرایه ندهم* (so as not to pay the fare) and *تا پولم را بگیرم* (to take her money). Fozia uses the plain present *می‌روم* with *فردا* for the plan.'
  prs.a2.unit36.lesson06.english_conversation.teach.give_book:
    title: 'Two different subjects: I give, so that you do not spend'
    gloss: I give you my book. I give you my book so that you do not spend money.
    note: 'The two verbs can have different subjects. In *کتابم را به تو می‌دهم تا پول خرج نکنی* the giver is I (*می‌دهم*) and the one who does not spend is you (*نکنی*). The subjunctive agrees with its own subject: *-ی* for you.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn01:
    title: Arif asks why Faroozan reads every night
    gloss: Faroozan, why do you read a book every night?
    note: '*می‌خوانی* is you read. *چرا* asks why and invites a reason or a purpose.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn02:
    title: Faroozan says what she studies for
    gloss: In order to learn English.
    note: 'A short answer that is only a purpose clause: *برای اینکه انگلیسی یاد بگیرم*. The main clause is left out because the question already gave it.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn03:
    title: Arif asks for the deeper purpose
    gloss: What for?
    note: '*برای چه؟* asks for the next purpose behind the first one.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn04:
    title: Faroozan gives the next purpose
    gloss: So that I get a good mark in the exam.
    note: '*تا در امتحان نمبر خوب بگیرم* is a *تا* clause on its own. *نمبر* is the mark or grade.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn05:
    title: Arif wants to study too
    gloss: I want to study English too, but the course is expensive.
    note: '*می‌خواهم انگلیسی بخوانم* uses the subjunctive *بخوانم* after *می‌خواهم*.'
  prs.a2.unit36.lesson06.english_conversation.teach.english_turn06:
    title: Faroozan offers her book
    gloss: I give you my book so that you do not spend money.
    note: '*تا پول خرج نکنی* has a different subject from the main verb: the book is given by I, the money is not spent by you.'
exercises:
  prs.a2.unit36.lesson01.errands_and_for.exercise01.recognize_send_letter:
    instruction: What does this sentence mean?
    correct_option: I go to the post office to send a letter
    distractors:
    - I will send a letter to the bank
    - The post office is near
    - I do not want to send a letter
    accepted_answers:
    - value: I go to the post office to send a letter
      status: correct
    feedback: '*برای فرستادن نامه* is in order to send a letter and *به پُسته خانه می‌روم* is I go to the post office.'
  prs.a2.unit36.lesson01.errands_and_for.exercise02.recognize_shopping:
    instruction: What does this sentence mean?
    correct_option: I go to the market for shopping
    distractors:
    - The market is far from home
    - I do not go to the market
    - I bought bread at the market yesterday
    accepted_answers:
    - value: I go to the market for shopping
      status: correct
    feedback: '*برای خرید* is for shopping. With *به بازار می‌روم* it means I go to the market for shopping.'
  prs.a2.unit36.lesson01.errands_and_for.exercise03.match_errand_words:
    instruction: Match each Dari word with its meaning.
    accepted_answers:
    - value:
        پُسته خانه: post office
        نامه: letter
        بانک: bank
        فرستادن: to send
        خریدن: to buy
        گرفتن: to take, to get
        خرید: shopping
        استراحت: rest
        برای: for, in order to
      status: correct
    feedback: These are the words for the errands in this lesson. *برای* goes before a noun or an infinitive to say what you do something for.
  prs.a2.unit36.lesson01.errands_and_for.exercise04.order_buy_bread:
    instruction: 'Arrange the words to say: In order to buy bread, I go to the shop.'
    accepted_answers:
    - value:
      - برای
      - خریدن
      - نان
      - به
      - دوکان
      - می‌روم
      status: correct
    - value:
      - به
      - دوکان
      - می‌روم
      - برای
      - خریدن
      - نان
      status: correct
    feedback: '*برای خریدن نان به دوکان می‌روم.* The purpose can come first or last, and the verb *می‌روم* stays at the end of its clause.'
  prs.a2.unit36.lesson01.errands_and_for.exercise05.complete_send:
    instruction: 'Complete the sentence: In order to send a letter, I go to the post office.'
    accepted_answers:
    - value: فرستادن
      status: correct
    feedback: '*فرستادن* is the infinitive. *برای فرستادن نامه* is in order to send a letter.'
  prs.a2.unit36.lesson01.errands_and_for.exercise06.translate_get_money:
    instruction: 'Translate into Dari, using برای and an infinitive: I go to the bank to get money.'
    accepted_answers:
    - value: برای گرفتن پول به بانک می‌روم.
      status: correct
    - value: من برای گرفتن پول به بانک می‌روم.
      status: correct
    - value: به بانک می‌روم برای گرفتن پول.
      status: correct
    - value: من به بانک می‌روم برای گرفتن پول.
      status: correct
    feedback: '*برای گرفتن پول به بانک می‌روم.* The purpose can come last, and *من* is optional because the ending *-م* already means I.'
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise01.recognize_buy_bread:
    instruction: What does this sentence mean?
    correct_option: In order to buy bread, I go to the shop
    distractors:
    - I bought bread at the shop yesterday
    - I do not buy bread at the shop
    - The shop sells bread
    accepted_answers:
    - value: In order to buy bread, I go to the shop
      status: correct
    feedback: '*برای اینکه نان بخرم* is in order that I buy bread. The verb *بخرم* is the subjunctive of *خریدن*.'
  prs.a2.unit36.lesson02.for_that_subjunctive.exercise02.choose_subjunctive:
    instruction: 'Choose the verb that completes the sentence: In order to get money, I go to the bank.'
    correct_option: بگیرم
    distractors:
    - گرفتم
    - می‌گیرم
    - گرفتن
    accepted_answers:
    - value: بگیرم
      status: correct
    feedback: 'After *برای اینکه* you need the subjunctive: *بگیرم*, not the past *گرفتم* or the present *می‌گیرم*.'
