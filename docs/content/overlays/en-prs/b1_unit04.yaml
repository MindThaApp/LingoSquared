course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: sequencing two events with وقتی (که) (when),
    in both present/habitual and past time frames, across an after-work
    daily-routine scenario.

units:
  prs.b1.unit04.sequencing:
    title: Sequencing
    description: Say when one event happens relative to another, using a time-clause construction, in present/habitual and past time frames.

lessons:
  prs.b1.unit04.lesson01.present_time_clause_1st2nd:
    title: "When I work"
  prs.b1.unit04.lesson02.present_time_clause_all_persons:
    title: "All the persons"
  prs.b1.unit04.lesson03.past_time_clause:
    title: "When I arrived"
  prs.b1.unit04.lesson04.dialogue_after_work:
    title: "After work"
  prs.b1.unit04.lesson05.reading_homayouns_day:
    title: "Homayoun's day"
  prs.b1.unit04.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit04.lesson01.teach.vaqti_ke:
    title: When
    gloss: when
    note: "*وقتی که* introduces a time clause -- states WHEN something happens, as a fact or habit."
    example_gloss: "When I work, I get tired."
  prs.b1.unit04.lesson01.teach.kar_mikonam:
    title: "I work"
    gloss: "I work"
    note: "*کار می‌کنم* is the 1st person present of *کار کردن* (to work)."
    example_gloss: "When I work, I get tired."
  prs.b1.unit04.lesson01.teach.khaste:
    title: Tired
    gloss: tired
    note: "*خسته* means tired."
    example_gloss: "I get tired."
  prs.b1.unit04.lesson01.teach.mishavam:
    title: "I become"
    gloss: "I become"
    note: "*می‌شوم* is the 1st person present of *شدن* (to become) -- خسته می‌شوم = I get/become tired."
    example_gloss: "When I work, I get tired."
  prs.b1.unit04.lesson01.teach.grammar_vaqti:
    title: "وقتی (که) vs. اگر"
    gloss: "وقتی (که) states a fact/habit; اگر states a hypothetical condition"
    note: "وقتی که کار می‌کنم، خسته می‌شوم = when(ever) I work, I get tired -- this always happens, it isn't conditional, unlike the اگر-sentences from the previous unit."
  prs.b1.unit04.lesson01.teach.kar_mikoni:
    title: "You work"
    gloss: "you work"
    note: "*کار می‌کنی* is the 2nd person singular form."
    example_gloss: "When you work, do you get tired?"
  prs.b1.unit04.lesson01.teach.mishavi:
    title: "You become"
    gloss: "you become"
    note: "*می‌شوی* is the 2nd person singular form."
    example_gloss: "When you work, do you get tired?"

  prs.b1.unit04.lesson02.teach.kar_mikonad:
    title: "He/she works"
    gloss: "he/she works"
    note: "*کار می‌کند* is the 3rd person singular form."
    example_gloss: "When Homayoun works, he gets tired."
  prs.b1.unit04.lesson02.teach.kar_mikonim:
    title: "We work"
    gloss: "we work"
    note: "*کار می‌کنیم* is the 1st person plural form."
    example_gloss: "When we work, we get tired."
  prs.b1.unit04.lesson02.teach.kar_mikonid:
    title: "You (pl./polite) work"
    gloss: "you (plural/polite) work"
    note: "*کار می‌کنین* is the 2nd person plural/polite form."
    example_gloss: "When you (pl) work, do you get tired?"
  prs.b1.unit04.lesson02.teach.kar_mikonand:
    title: "They work"
    gloss: "they work"
    note: "*کار می‌کنند* is the 3rd person plural form."
    example_gloss: "When they work, they get tired."
  prs.b1.unit04.lesson02.teach.grammar_agreement:
    title: "All six persons, both verbs"
    gloss: "کار می‌کنم/می‌کنی/می‌کند/می‌کنیم/می‌کنین/می‌کنند and می‌شوم/می‌شوی/می‌شود/می‌شویم/می‌شین/می‌شوند both follow the same person endings"
    note: "The وقتی-clause and the result clause can have different subjects; each verb agrees with its own."
  prs.b1.unit04.lesson02.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "*همایون* -- an established recurring character in this course."
    example_gloss: "When Homayoun works, he gets tired."
  prs.b1.unit04.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "*زرمینه* -- an established recurring character in this course."
    example_gloss: "When Zarmina works, she gets tired."
  prs.b1.unit04.lesson02.teach.review_anha:
    title: They
    gloss: they
    note: "*آنها* means they."
    example_gloss: "When they work, they get tired."
  prs.b1.unit04.lesson02.teach.ma:
    title: We
    gloss: we
    note: "*ما* means we."
    example_gloss: "When we work, we get tired."

  prs.b1.unit04.lesson03.teach.residam:
    title: "I arrived"
    gloss: "I arrived"
    note: "*رسیدم* is the 1st person simple past of *رسیدن* (to arrive)."
    example_gloss: "When I arrived home, I cooked food."
  prs.b1.unit04.lesson03.teach.pokhtam:
    title: "I cooked"
    gloss: "I cooked"
    note: "*پختم* is the 1st person simple past of *پختن* (to cook)."
    example_gloss: "When I arrived home, I cooked food."
  prs.b1.unit04.lesson03.teach.residi:
    title: "You arrived"
    gloss: "you arrived"
    note: "*رسیدی* is the 2nd person singular form."
    example_gloss: "When you arrived home, what did you do?"
  prs.b1.unit04.lesson03.teach.kardi:
    title: "You did"
    gloss: "you did"
    note: "*کردی* is the 2nd person simple past of *کردن* (to do)."
    example_gloss: "When you arrived home, what did you do?"
  prs.b1.unit04.lesson03.teach.grammar_past_time:
    title: "Past time clauses"
    gloss: "وقتی که + simple past states a completed, one-time past event"
    note: "Contrasted with lessons 1-2's present/habitual وقتی-clauses (کار می‌کنم, an ongoing habit). وقتی که رسیدم uses simple past رسیدم (I arrived, one specific time), not a habit."
  prs.b1.unit04.lesson03.teach.ghaza:
    title: Food
    gloss: food
    note: "*غذا* means food."
    example_gloss: "I cooked food."
  prs.b1.unit04.lesson03.teach.review_ba:
    title: To
    gloss: to
    note: "*به* means to/at."
    example_gloss: "I arrived home."
  prs.b1.unit04.lesson03.teach.review_khana:
    title: House
    gloss: house
    note: "*خانه* means house."
    example_gloss: "I arrived home."
  prs.b1.unit04.lesson03.teach.review_che:
    title: What
    gloss: what
    note: "*چه* means what."
    example_gloss: "What did you do?"

  prs.b1.unit04.lesson04.teach.az:
    title: From
    gloss: from
    note: "*از* means from."
    example_gloss: "When you come from work, what do you do?"
  prs.b1.unit04.lesson04.teach.che_kar_mikoni:
    title: "What do you do?"
    gloss: "what do you do?"
    note: "*چه کار می‌کنی* asks what someone does."
    example_gloss: "Then what do you do?"
  prs.b1.unit04.lesson04.teach.miayi:
    title: "You come"
    gloss: "you come"
    note: "*می‌آیی* is the 2nd person present of *آمدن* (to come)."
    example_gloss: "When you come from work, what do you do?"
  prs.b1.unit04.lesson04.teach.kami:
    title: "A little"
    gloss: "a little"
    note: "*کمی* means a little/somewhat."
    example_gloss: "I rest a little."
  prs.b1.unit04.lesson04.teach.esterahat_mikonam:
    title: "I rest"
    gloss: "I rest"
    note: "*استراحت می‌کنم* is the 1st person present of *استراحت کردن* (to rest)."
    example_gloss: "When I get tired, I rest a little."
  prs.b1.unit04.lesson04.teach.baad:
    title: "Then / after"
    gloss: "then / after"
    note: "*بعد* means then/after."
    example_gloss: "Then I eat food."
  prs.b1.unit04.lesson04.teach.mikhoram:
    title: "I eat"
    gloss: "I eat"
    note: "*می‌خورم* is the 1st person present of *خوردن* (to eat)."
    example_gloss: "Then I eat food."
  prs.b1.unit04.lesson04.teach.television:
    title: Television
    gloss: television
    note: "*تلویزیون* means television."
    example_gloss: "I watch television."
  prs.b1.unit04.lesson04.teach.mibinam:
    title: "I watch / see"
    gloss: "I watch / see"
    note: "*می‌بینم* is the 1st person present of *دیدن* (to see/watch)."
    example_gloss: "I watch television."
  prs.b1.unit04.lesson04.teach.review_va:
    title: And
    gloss: and
    note: "*و* means and."
    example_gloss: "I eat food and watch television."
  prs.b1.unit04.lesson04.teach.review_man:
    title: "I / me"
    gloss: "I / me"
    note: "*من* means I/me."
    example_gloss: "I also rest."
  prs.b1.unit04.lesson04.teach.review_ham:
    title: "Also / too"
    gloss: "also / too"
    note: "*هم* means also or too."
    example_gloss: "I also rest."
  prs.b1.unit04.lesson04.teach.dialogue_zarmina_ask:
    title: "When you come from work, what do you do?"
    gloss: "When you come from work, what do you do?"
    note: "Zarmina asks about Homayoun's after-work routine."
  prs.b1.unit04.lesson04.teach.dialogue_homayoun_rest:
    title: "When I get tired, I rest a little."
    gloss: "When I get tired, I rest a little."
    note: "Homayoun describes his first step."
  prs.b1.unit04.lesson04.teach.dialogue_zarmina_then:
    title: "Then what do you do?"
    gloss: "Then what do you do?"
    note: "Zarmina asks for the next step."
  prs.b1.unit04.lesson04.teach.dialogue_homayoun_eat_tv:
    title: "Then I eat food and watch television."
    gloss: "Then I eat food and watch television."
    note: "Homayoun's second step."
  prs.b1.unit04.lesson04.teach.dialogue_zarmina_own_routine:
    title: "I also rest, when I get tired."
    gloss: "I also, when I get tired, rest."
    note: "Zarmina shares her own routine, reusing the same time-clause construction."

  prs.b1.unit04.lesson05.teach.dirooz:
    title: Yesterday
    gloss: yesterday
    note: "*دیروز* means yesterday."
    example_gloss: "Yesterday Homayoun worked."
  prs.b1.unit04.lesson05.teach.kard:
    title: "He/she did"
    gloss: "he/she did"
    note: "*کرد* is the 3rd person simple past of *کردن* (to do)."
    example_gloss: "Yesterday Homayoun worked."
  prs.b1.unit04.lesson05.teach.review_ba:
    title: To
    gloss: to
    note: "*به* means to/at."
    example_gloss: "He arrived home."
  prs.b1.unit04.lesson05.teach.review_khana:
    title: House
    gloss: house
    note: "*خانه* means house."
    example_gloss: "He arrived home."
  prs.b1.unit04.lesson05.teach.resid:
    title: "He/she arrived"
    gloss: "he/she arrived"
    note: "*رسید* is the 3rd person simple past of *رسیدن*."
    example_gloss: "When he arrived home, he was tired."
  prs.b1.unit04.lesson05.teach.review_boud:
    title: Was
    gloss: was
    note: "*بود* is the 3rd person simple past of *بودن* (to be)."
    example_gloss: "Homayoun was tired."
  prs.b1.unit04.lesson05.teach.khord:
    title: "He/she ate"
    gloss: "he/she ate"
    note: "*خورد* is the 3rd person simple past of *خوردن*."
    example_gloss: "Then he ate food."
  prs.b1.unit04.lesson05.teach.tamam_shod:
    title: Finished
    gloss: finished
    note: "*تمام شد* -- *تمام* means complete, *شد* is the 3rd person simple past of *شدن*."
    example_gloss: "Zarmina's work finished."
  prs.b1.unit04.lesson05.teach.amad:
    title: "He/she came"
    gloss: "he/she came"
    note: "*آمد* is the 3rd person simple past of *آمدن*."
    example_gloss: "Zarmina came home."
  prs.b1.unit04.lesson05.teach.ba_ham:
    title: Together
    gloss: together
    note: "*با هم* means together."
    example_gloss: "They drank tea together."
  prs.b1.unit04.lesson05.teach.chai:
    title: Tea
    gloss: tea
    note: "*چای* means tea."
    example_gloss: "They drank tea together."
  prs.b1.unit04.lesson05.teach.reading_passage:
    title: "Homayoun's day"
    gloss: "Yesterday Homayoun worked. When he arrived home, he was tired. He rested a little and then ate food. Zarmina also, when her work finished, came home. They drank tea together."
    note: "A short reading combining past time-clauses, reusing this unit's established characters."

  prs.b1.unit04.lesson06.teach.grammar_review:
    title: "Review: present/habitual vs. past time clauses"
    gloss: "وقتی که + present/habitual clause = a recurring fact. وقتی که + simple past clause = a completed one-time event."
    note: "Both always have two clauses, time + result, exactly like اگر in the previous unit."
  prs.b1.unit04.lesson06.teach.emroz:
    title: Today
    gloss: today
    note: "*امروز* means today."
    example_gloss: "Today I work."

