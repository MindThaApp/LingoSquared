  prs.b1.unit04.lesson04.exercise01.comprehend_dialogue:
    instruction: "What does Homayoun do when he gets tired?"
    correct_option: "He rests a little"
    distractors: ["He eats food", "He watches television", "He goes to the park"]
    accepted_answers: [{value: "He rests a little", status: correct}]
    feedback: "Homayoun says وقتی که خسته می‌شوم، کمی استراحت می‌کنم (when I get tired, I rest a little)."

