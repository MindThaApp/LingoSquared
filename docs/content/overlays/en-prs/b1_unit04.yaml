  prs.b1.unit04.lesson05.exercise01.comprehend_tired:
    instruction: "Was Homayoun tired when he arrived home, according to the reading?"
    correct_option: "Yes, he was tired"
    distractors: ["No, he was fine", "No, he was hungry", "They didn't say"]
    accepted_answers: [{value: "Yes, he was tired", status: correct}]
    feedback: "The reading says وقتی که به خانه رسید، خسته بود (when he arrived home, he was tired)."

  prs.b1.unit04.lesson05.exercise02.comprehend_together:
    instruction: "Did Zarmina and Homayoun drink tea together, according to the reading?"
    correct_option: "Yes, they drank tea together"
    distractors: ["No, they watched television instead", "No, they went to the park", "No, only Zarmina drank tea"]
    accepted_answers: [{value: "Yes, they drank tea together", status: correct}]
    feedback: "The reading says آنها با هم چای نوشیدند (they drank tea together)."

