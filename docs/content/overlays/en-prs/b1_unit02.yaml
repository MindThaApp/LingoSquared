course:
  title: Dari B1
  description: >-
    Intermediate Kabul Dari: expressing present and past necessity/
    obligation using the invariant modal باید (must/should) plus a
    person-conjugated subjunctive verb, its negation نباید, and its
    past-regret form باید + imperfect stem, across an everyday
    household scenario.

units:
  prs.b1.unit02.necessity:
    title: Necessity
    description: Express what you must, must not, or should have done, using an invariant modal plus a person-conjugated verb, in present and past tense.

lessons:
  prs.b1.unit02.lesson01.present_necessity_1st2nd:
    title: "I must / you must"
  prs.b1.unit02.lesson02.present_necessity_all_persons:
    title: "All the persons"
  prs.b1.unit02.lesson03.past_necessity_and_negation:
    title: "I should have / I must not"
  prs.b1.unit02.lesson04.dialogue_guests:
    title: "Guests"
  prs.b1.unit02.lesson05.reading_last_year:
    title: "Last year and this year"
  prs.b1.unit02.lesson06.wrapup_production:
    title: "Wrap-up"

teaching:
  prs.b1.unit02.lesson01.teach.bayad:
    title: "Must / should"
    gloss: "must / should"
    note: "*باید* is an invariant modal particle -- it never changes form, no matter who the subject is."
    example_gloss: "I must buy bread."
  prs.b1.unit02.lesson01.teach.nan:
    title: Bread
    gloss: bread
    note: "*نان* means bread."
    example_gloss: "I want bread."
  prs.b1.unit02.lesson01.teach.bekharam:
    title: "I (should) buy"
    gloss: "I (should) buy"
    note: "*بخرم* is the 1st person singular subjunctive of *خریدن* (to buy)."
    example_gloss: "I must buy bread."
  prs.b1.unit02.lesson01.teach.bekhari:
    title: "You (should) buy"
    gloss: "you (should) buy"
    note: "*بخری* is the 2nd person singular form."
    example_gloss: "Must you buy bread?"
  prs.b1.unit02.lesson01.teach.grammar_bayad_invariant:
    title: "باید is invariant -- the verb after it changes"
    gloss: "باید بخرم = I must buy. باید itself never changes; the verb after it (بخرم, بخری...) changes with the subject."
    note: "Unlike *می‌تانم* (can), which itself conjugates for person, *باید* always stays the same -- only the subjunctive verb that follows it agrees with the subject."
  prs.b1.unit02.lesson01.teach.chera:
    title: Why
    gloss: why
    note: "*چرا* means why."
    example_gloss: "Why must you buy it?"
  prs.b1.unit02.lesson01.teach.emroz:
    title: Today
    gloss: today
    note: "*امروز* means today."
    example_gloss: "Today I must buy bread."

  prs.b1.unit02.lesson02.teach.bekhare:
    title: "He/she (should) buy"
    gloss: "he/she (should) buy"
    note: "*بخره* is the 3rd person singular form."
    example_gloss: "Zarmina must buy bread."
  prs.b1.unit02.lesson02.teach.bekharim:
    title: "We (should) buy"
    gloss: "we (should) buy"
    note: "*بخریم* is the 1st person plural form."
    example_gloss: "We must buy bread."
  prs.b1.unit02.lesson02.teach.bekharin:
    title: "You (pl./polite) (should) buy"
    gloss: "you (plural/polite) (should) buy"
    note: "*بخرین* is the 2nd person plural/polite form."
    example_gloss: "You must buy bread."
  prs.b1.unit02.lesson02.teach.bekharan:
    title: "They (should) buy"
    gloss: "they (should) buy"
    note: "*بخرن* is the 3rd person plural form."
    example_gloss: "They must buy bread."
  prs.b1.unit02.lesson02.teach.grammar_agreement:
    title: "All six persons"
    gloss: "باید بخرم، باید بخری، باید بخره، باید بخریم، باید بخرین، باید بخرن -- the same م/ی/ه/یم/ین/ن endings you already know from می‌تانم."
    note: "The subjunctive verb after *باید* takes the same person endings as *می‌تانم* did in the previous unit -- just applied to a different verb (*خریدن* instead of *تانستن*)."
  prs.b1.unit02.lesson02.teach.review_zarmina:
    title: Zarmina
    gloss: Zarmina
    note: "*زرمینه* -- an established recurring character in this course."
    example_gloss: "Zarmina must buy bread."
  prs.b1.unit02.lesson02.teach.review_anha:
    title: They
    gloss: they
    note: "*آنها* means they."
    example_gloss: "They must buy bread."
  prs.b1.unit02.lesson02.teach.shoma:
    title: "You (plural/polite)"
    gloss: "you (plural/polite)"
    note: "*شما* means you (plural or polite singular)."
    example_gloss: "You must buy bread."

  prs.b1.unit02.lesson03.teach.bayad_mikharidam:
    title: "I should have bought"
    gloss: "I should have bought / I was supposed to buy"
    note: "*باید می‌خریدم* combines *باید* with the past imperfect stem of *خریدن*, expressing an unfulfilled past obligation -- something you should have done but didn't."
    example_gloss: "Yesterday I should have bought bread."
  prs.b1.unit02.lesson03.teach.nabayad:
    title: "Must not"
    gloss: "must not"
    note: "*نباید* negates *باید* with the *ن-* prefix."
    example_gloss: "You must not buy bread."
  prs.b1.unit02.lesson03.teach.grammar_past_regret:
    title: "Present necessity vs. past regret vs. prohibition"
    gloss: "باید بخرم = I must buy (now). باید می‌خریدم = I should have bought (past regret). نباید بخری = you must not buy."
    note: "Three related but distinct forms: present obligation, unfulfilled past obligation, and prohibition -- all built from the same *باید*/*نباید* + subjunctive-or-imperfect pattern."
  prs.b1.unit02.lesson03.teach.diroz:
    title: Yesterday
    gloss: yesterday
    note: "*دیروز* means yesterday."
    example_gloss: "Yesterday I should have bought it."
  prs.b1.unit02.lesson03.teach.chon:
    title: Because
    gloss: because
    note: "*چون* means because."
    example_gloss: "I didn't buy it because I didn't have money."
  prs.b1.unit02.lesson03.teach.pool_nadashtam:
    title: "I didn't have money"
    gloss: "I didn't have money"
    note: "*پول نداشتم* -- *پول* means money, *نداشتم* is the 1st person past negative of *داشتن* (to have)."
    example_gloss: "Yesterday I didn't have money."
  prs.b1.unit02.lesson03.teach.nakharidam:
    title: "I didn't buy"
    gloss: "I didn't buy"
    note: "*نخریدم* is the 1st person simple past negative of *خریدن*."
    example_gloss: "Yesterday I didn't buy bread."

  prs.b1.unit02.lesson04.teach.mehman:
    title: "Guest(s)"
    gloss: "guest(s)"
    note: "*مهمان* means guest(s)."
    example_gloss: "We have guests tonight."
  prs.b1.unit02.lesson04.teach.amshab:
    title: Tonight
    gloss: tonight
    note: "*امشب* means tonight."
    example_gloss: "Guests are coming tonight."
  prs.b1.unit02.lesson04.teach.khana:
    title: House
    gloss: house
    note: "*خانه* means house."
    example_gloss: "We must clean the house."
  prs.b1.unit02.lesson04.teach.ra:
    title: "(object marker)"
    gloss: "(object marker)"
    note: "*را* marks the direct object -- here, *خانه را* means \"the house\" as the thing being cleaned."
    example_gloss: "We're cleaning the house."
  prs.b1.unit02.lesson04.teach.pak_konim:
    title: "We clean"
    gloss: "we clean"
    note: "*پاک کنیم* is the 1st person plural subjunctive of *پاک کردن* (to clean, literally \"to make clean\")."
    example_gloss: "We must clean the house."
  prs.b1.unit02.lesson04.teach.ghaza:
    title: Food
    gloss: food
    note: "*غذا* means food."
    example_gloss: "I must cook food."
  prs.b1.unit02.lesson04.teach.bepazam:
    title: "I (will) cook"
    gloss: "I (will) cook"
    note: "*بپزم* is the 1st person singular subjunctive of *پختن* (to cook)."
    example_gloss: "I must cook food."
  prs.b1.unit02.lesson04.teach.va:
    title: And
    gloss: and
    note: "*و* means and."
    example_gloss: "I'm buying bread and meat."
  prs.b1.unit02.lesson04.teach.man:
    title: "I / me"
    gloss: "I / me"
    note: "*من* means I/me."
    example_gloss: "I must buy it."
  prs.b1.unit02.lesson04.teach.review_homayoun:
    title: Homayoun
    gloss: Homayoun
    note: "*همایون* -- an established recurring character in this course."
    example_gloss: "Homayoun must buy bread."
  prs.b1.unit02.lesson04.teach.goosht:
    title: Meat
    gloss: meat
    note: "*گوشت* means meat."
    example_gloss: "I must buy meat."
  prs.b1.unit02.lesson04.teach.bali:
    title: "Yes"
    gloss: "yes"
    note: "*بلی* means yes."
    example_gloss: "Yes, I must buy it."
  prs.b1.unit02.lesson04.teach.dialogue_zarmina_guests:
    title: "Homayoun, guests are coming tonight. We must clean the house."
    gloss: "Homayoun, guests are coming tonight. We must clean the house."
    note: "Zarmina announces the evening's plans."
  prs.b1.unit02.lesson04.teach.dialogue_homayoun_agree:
    title: "Yes. I must buy bread and meat."
    gloss: "Yes. I must buy bread and meat."
    note: "Homayoun agrees and states his own task."
  prs.b1.unit02.lesson04.teach.dialogue_zarmina_cook:
    title: "I must cook food."
    gloss: "I must cook food."
    note: "Zarmina states her task."
  prs.b1.unit02.lesson04.teach.dialogue_homayoun_help:
    title: "Don't worry, I'll help."
    gloss: "Don't worry, I'll help."
    note: "Homayoun offers to help."
  prs.b1.unit02.lesson04.teach.dialogue_zarmina_thanks:
    title: "Thanks, Homayoun."
    gloss: "Thanks, Homayoun."
    note: "Zarmina thanks him."

  prs.b1.unit02.lesson05.teach.parsal:
    title: "Last year"
    gloss: "last year"
    note: "*پارسال* means last year."
    example_gloss: "I was sick last year."
  prs.b1.unit02.lesson05.teach.emsal:
    title: "This year"
    gloss: "this year"
    note: "*امسال* means this year."
    example_gloss: "I am well this year."
  prs.b1.unit02.lesson05.teach.che:
    title: What
    gloss: what
    note: "*چه* means what."
    example_gloss: "What work do you have?"
  prs.b1.unit02.lesson05.teach.mitane_review:
    title: "He/she can"
    gloss: "he/she can"
    note: "*می‌تانه* -- from the previous unit's ability construction, reused here alongside necessity."
    example_gloss: "Zarmina can cook."
  prs.b1.unit02.lesson05.teach.mariz_boud:
    title: "Was sick"
    gloss: "was sick"
    note: "*مریض بود* -- *مریض* means sick, *بود* is the 3rd person past of *بودن* (to be)."
    example_gloss: "Last year Zarmina was sick."
  prs.b1.unit02.lesson05.teach.bayad_esterahat_mikard:
    title: "He/she should have rested"
    gloss: "he/she should have rested"
    note: "*باید استراحت می‌کرد* -- another example of *باید* + the past imperfect stem for an unfulfilled past obligation, this time with a 3rd person subject."
    example_gloss: "Yesterday he/she should have rested."
  prs.b1.unit02.lesson05.teach.kar_dasht:
    title: "Had work"
    gloss: "had work"
    note: "*کار داشت* -- *کار* means work, *داشت* is the 3rd person past of *داشتن* (to have)."
    example_gloss: "Zarmina had work last year."
  prs.b1.unit02.lesson05.teach.vali:
    title: But
    gloss: but
    note: "*ولی* means but."
    example_gloss: "She was sick, but she had work."
  prs.b1.unit02.lesson05.teach.halash_khoub_ast:
    title: "He/she is doing well"
    gloss: "he/she is doing well"
    note: "*حالش خوب است* -- literally \"his/her condition is good,\" the everyday way to say someone is well."
    example_gloss: "This year she is doing well."
  prs.b1.unit02.lesson05.teach.baray:
    title: For
    gloss: for
    note: "*برای* means for."
    example_gloss: "She cooks food for the guest."
  prs.b1.unit02.lesson05.teach.bepazad:
    title: "He/she (will) cook"
    gloss: "he/she (will) cook"
    note: "*بپزد* is the 3rd person singular subjunctive of *پختن*."
    example_gloss: "Zarmina can cook food."
  prs.b1.unit02.lesson05.teach.mikonad:
    title: "He/she does"
    gloss: "he/she does"
    note: "*می‌کند* is the 3rd person singular present indicative of *کردن* (to do)."
    example_gloss: "Homayoun helps."
  prs.b1.unit02.lesson05.teach.ou:
    title: "He / she"
    gloss: "he / she"
    note: "*او* means he or she."
    example_gloss: "He/she was sick."
  prs.b1.unit02.lesson05.teach.ham:
    title: "Also / too"
    gloss: "also / too"
    note: "*هم* means also or too."
    example_gloss: "Homayoun helps too."
  prs.b1.unit02.lesson05.teach.reading_passage:
    title: "Last year and this year"
    gloss: "Last year Zarmina was sick. She should have rested, but she had work. This year she is doing well and can cook food for the guest. Homayoun helps too."
    note: "A short reading combining present and past necessity, reusing this unit's established characters."

  prs.b1.unit02.lesson06.teach.grammar_review:
    title: "Review: present necessity, past regret, prohibition"
    gloss: "باید بخرم، باید بخری، باید بخره، باید بخریم، باید بخرین، باید بخرن. باید می‌خریدم. نباید بخری."
    note: "This lesson reviews and combines everything from lessons 1-5."
  prs.b1.unit02.lesson06.teach.farda:
    title: Tomorrow
    gloss: tomorrow
    note: "*فردا* means tomorrow."
    example_gloss: "Tomorrow I must buy it."

exercises:
  prs.b1.unit02.lesson01.exercise01.recognize_bayad:
    instruction: "What does this word mean?"
    correct_option: "must/should"
    distractors: ["can", "want", "have"]
    accepted_answers: [{value: "must/should", status: correct}]
    feedback: "*باید* means must/should."

  prs.b1.unit02.lesson01.exercise02.recognize_bekharam:
    instruction: "What does this word mean?"
    correct_option: "I (should) buy"
    distractors: ["you (should) buy", "I (should) sell", "I have"]
    accepted_answers: [{value: "I (should) buy", status: correct}]
    feedback: "*بخرم* means I (should) buy."

  prs.b1.unit02.lesson01.exercise03.order_bayad_nan_bekharam:
    instruction: "Put the words in order: I must buy bread."
    accepted_answers:
      - {value: "باید نان بخرم", status: correct}
    feedback: "*باید نان بخرم* means I must buy bread."

  prs.b1.unit02.lesson01.exercise04.match_necessity_words:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {باید: "must/should", نان: bread, بخرم: "I (should) buy", بخری: "you (should) buy", چرا: why, امروز: today}
        status: correct
    feedback: "These are this lesson's core necessity words."

  prs.b1.unit02.lesson01.exercise05.translate_must_buy_bread_today:
    instruction: "Translate into Dari: I must buy bread today."
    accepted_answers:
      - {value: "باید امروز نان بخرم", status: correct}
      - {value: "امروز باید نان بخرم", status: correct}
    feedback: "*باید امروز نان بخرم* means I must buy bread today."

  prs.b1.unit02.lesson01.exercise06.speak_should_you_buy_bread:
    instruction: "Say aloud in Dari: Should you buy bread?"
    accepted_answers:
      - {value: "باید نان بخری؟", status: correct}
    feedback: "*باید نان بخری؟* means should you buy bread?"

  prs.b1.unit02.lesson01.exercise07.write_necessity_sentence:
    instruction: "Write in Dari: Today I must buy bread."
    accepted_answers:
      - {value: "امروز باید نان بخرم", status: correct}
      - {value: "باید امروز نان بخرم", status: correct}
    feedback: "*امروز باید نان بخرم* means today I must buy bread."


  prs.b1.unit02.lesson02.exercise01.recognize_bekhare:
    instruction: "What does this word mean?"
    correct_option: "he/she (should) buy"
    distractors: ["we (should) buy", "they (should) buy", "you (should) buy"]
    accepted_answers: [{value: "he/she (should) buy", status: correct}]
    feedback: "*بخره* means he/she (should) buy."

  prs.b1.unit02.lesson02.exercise02.recognize_bekharim:
    instruction: "What does this word mean?"
    correct_option: "we (should) buy"
    distractors: ["he/she (should) buy", "they (should) buy", "I (should) buy"]
    accepted_answers: [{value: "we (should) buy", status: correct}]
    feedback: "*بخریم* means we (should) buy."

  prs.b1.unit02.lesson02.exercise03.order_zarmina_bekhare:
    instruction: "Put the words in order: Zarmina must buy bread."
    accepted_answers:
      - {value: "زرمینه باید نان بخره", status: correct}
    feedback: "*زرمینه باید نان بخره* means Zarmina must buy bread."

  prs.b1.unit02.lesson02.exercise04.match_person_forms:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {بخرم: "I (should) buy", بخری: "you (should) buy", بخره: "he/she (should) buy", بخریم: "we (should) buy", بخرین: "you (pl/polite) (should) buy", بخرن: "they (should) buy"}
        status: correct
    feedback: "These are all six persons of the present-necessity form."

  prs.b1.unit02.lesson02.exercise05.translate_they_must_buy_bread:
    instruction: "Translate into Dari: They must buy bread."
    accepted_answers:
      - {value: "آنها باید نان بخرن", status: correct}
    feedback: "*آنها باید نان بخرن* means they must buy bread."

  prs.b1.unit02.lesson02.exercise06.speak_we_must_buy_bread:
    instruction: "Say aloud in Dari: We must buy bread."
    accepted_answers:
      - {value: "باید نان بخریم", status: correct}
    feedback: "*باید نان بخریم* means we must buy bread."

  prs.b1.unit02.lesson02.exercise07.write_zarmina_necessity:
    instruction: "Write in Dari: Zarmina must buy bread."
    accepted_answers:
      - {value: "زرمینه باید نان بخره", status: correct}
    feedback: "*زرمینه باید نان بخره* means Zarmina must buy bread."


  prs.b1.unit02.lesson03.exercise01.recognize_bayad_mikharidam:
    instruction: "What does this phrase mean?"
    correct_option: "I should have bought"
    distractors: ["I must buy", "I must not buy", "I will buy"]
    accepted_answers: [{value: "I should have bought", status: correct}]
    feedback: "*باید می‌خریدم* means I should have bought."

  prs.b1.unit02.lesson03.exercise02.recognize_nabayad:
    instruction: "What does this word mean?"
    correct_option: "must not"
    distractors: ["should have", "must", "will not"]
    accepted_answers: [{value: "must not", status: correct}]
    feedback: "*نباید* means must not."

  prs.b1.unit02.lesson03.exercise03.order_diroz_bayad_mikharidam:
    instruction: "Put the words in order: Yesterday I should have bought bread."
    accepted_answers:
      - {value: "دیروز باید نان می‌خریدم", status: correct}
    feedback: "*دیروز باید نان می‌خریدم* means yesterday I should have bought bread."

  prs.b1.unit02.lesson03.exercise04.match_past_present_necessity:
    instruction: "Match each form with its meaning."
    accepted_answers:
      - value: {بخرم: "I must buy (now)", می‌خریدم: "I should have bought (past)", نباید: "must not", دیروز: yesterday, چون: because, نخریدم: "I didn't buy"}
        status: correct
    feedback: "Compare the present, past-regret, and negative forms side by side."

  prs.b1.unit02.lesson03.exercise05.translate_must_not_buy_bread:
    instruction: "Translate into Dari: You must not buy bread."
    accepted_answers:
      - {value: "نباید نان بخری", status: correct}
    feedback: "*نباید نان بخری* means you must not buy bread."

  prs.b1.unit02.lesson03.exercise06.speak_should_have_bought_bread:
    instruction: "Say aloud in Dari: Yesterday I should have bought bread."
    accepted_answers:
      - {value: "دیروز باید نان می‌خریدم", status: correct}
    feedback: "*دیروز باید نان می‌خریدم* means yesterday I should have bought bread."

  prs.b1.unit02.lesson03.exercise07.write_no_money:
    instruction: "Write in Dari: Yesterday I didn't buy bread because I didn't have money."
    accepted_answers:
      - {value: "دیروز نان نخریدم چون پول نداشتم", status: correct}
    feedback: "*دیروز نان نخریدم چون پول نداشتم* means yesterday I didn't buy bread because I didn't have money."


  prs.b1.unit02.lesson04.exercise01.comprehend_why_clean:
    instruction: "Why must we clean the house?"
