course:
  title: Dari A1
  description: "Beginner Kabul Dari: name basic personality traits, ask what someone is like, give simple reasons with because, and describe a person's character in a short passage."
units:
  prs.a1.unit37.personality:
    title: Personality
    description: Describe a person's basic personality traits and ask what someone is like.
lessons:
  prs.a1.unit37.lesson01.personality_words:
    title: Personality words
  prs.a1.unit37.lesson02.more_traits:
    title: More traits
  prs.a1.unit37.lesson03.asking_about_personality:
    title: Asking about personality
  prs.a1.unit37.lesson04.personality_dialogue:
    title: Personality dialogue
  prs.a1.unit37.lesson05.personality_reading:
    title: Reading about personality
  prs.a1.unit37.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit37.lesson01.teach.mehraban_word:
    title: Kind
    gloss: kind
    note: "مهربان is the standard Dari word for a kind or warm-hearted person."
    example_gloss: He/she is kind.
  prs.a1.unit37.lesson01.teach.zahmatkash_word:
    title: Hardworking
    gloss: hardworking
    note: "زحمتکش literally means one who takes trouble or effort — a hardworking person."
    example_gloss: He/she is hardworking.
  prs.a1.unit37.lesson01.teach.bahosh_word:
    title: Smart
    gloss: smart / intelligent
    note: "باهوش combines با (with) and هوش (intelligence) — a smart or clever person."
    example_gloss: He/she is smart.
  prs.a1.unit37.lesson01.teach.tambal_word:
    title: Lazy
    gloss: lazy
    note: "تنبل means lazy."
    example_gloss: He/she is lazy.
  prs.a1.unit37.lesson01.teach.review_basics:
    title: "Review: he/she, is, and, but"
    gloss: he/she / is / and / but
    note: "او, است, و, and اما are review forms used throughout this unit's personality sentences."
  prs.a1.unit37.lesson01.teach.kind_and_hardworking_phrase:
    title: He/she is kind and hardworking
    gloss: He/she is kind and hardworking.
    note: "و joins the two traits into one sentence."
  prs.a1.unit37.lesson01.teach.smart_but_lazy_phrase:
    title: He/she is smart, but lazy
    gloss: He/she is smart, but lazy.
    note: "اما contrasts two traits in one sentence."
  prs.a1.unit37.lesson02.teach.shokh_word:
    title: Funny
    gloss: funny / playful
    note: "شوخ describes someone who jokes around or is playful."
    example_gloss: He/she is funny.
  prs.a1.unit37.lesson02.teach.kamharf_word:
    title: Quiet
    gloss: quiet / reserved
    note: "کم‌حرف literally means few-worded — a quiet, reserved person."
    example_gloss: He/she is quiet.
  prs.a1.unit37.lesson02.teach.rastgoo_word:
    title: Honest
    gloss: honest
    note: "راستگو combines راست (true, straight) and گو (speaker) — a truthful, honest person."
    example_gloss: He/she is honest.
  prs.a1.unit37.lesson02.teach.review_and_but:
    title: "Review: and, but"
    gloss: and / but
    note: "و and اما are review words used to combine or contrast traits."
  prs.a1.unit37.lesson02.teach.funny_and_honest_phrase:
    title: He/she is funny and honest
    gloss: He/she is funny and honest.
    note: "Combines two positive traits with و."
  prs.a1.unit37.lesson02.teach.quiet_but_kind_phrase:
    title: He/she is quiet, but kind
    gloss: He/she is quiet, but kind.
    note: "اما contrasts a reserved trait with a warm one."
  prs.a1.unit37.lesson03.teach.person_word:
    title: Person
    gloss: person
    note: "آدم is a common, gender-neutral word for a person or human being."
    example_gloss: He/she is a good person.
  prs.a1.unit37.lesson03.teach.review_how_because:
    title: "Review: how/what kind, because, help"
    gloss: how, what kind / because / help
    note: "چطور, چون, and کمک are review forms used to ask about and explain personality."
  prs.a1.unit37.lesson03.teach.what_kind_person_question:
    title: What kind of person is he/she?
    gloss: What kind of person is he/she?
    note: "او چطور آدم است؟ literally asks he/she is what-kind (of) person? — the natural way to ask what someone is like."
  prs.a1.unit37.lesson03.teach.kind_because_helps_phrase:
    title: He/she is kind, because he/she helps
    gloss: He/she is kind, because he/she helps.
    note: "چون introduces the reason; کمک می‌کند literally means does help."
  prs.a1.unit37.lesson03.teach.hardworking_because_works_phrase:
    title: He/she is hardworking, because he/she works a lot
    gloss: He/she is hardworking, because he/she works a lot.
    note: "زیاد کار می‌کند literally means does a lot (of) work."
  prs.a1.unit37.lesson04.teach.review_dialogue_words:
    title: Yes / a bit / always
    gloss: yes / a bit, a little / always
    note: "بلی, کمی, and همیشه are review words used in the personality dialogue."
  prs.a1.unit37.lesson04.teach.dialogue_line1:
    title: "Homayoun: Zarmina, what kind of person is Karim?"
    gloss: Zarmina, what kind of person is Karim?
  prs.a1.unit37.lesson04.teach.dialogue_line2:
    title: "Zarmina: Karim is kind and hardworking."
    gloss: Karim is kind and hardworking.
  prs.a1.unit37.lesson04.teach.dialogue_line3:
    title: "Homayoun: Is he smart?"
    gloss: Is he smart?
  prs.a1.unit37.lesson04.teach.dialogue_line4:
    title: "Zarmina: Yes, he's smart, but a bit quiet."
    gloss: Yes, he's smart, but a bit quiet.
  prs.a1.unit37.lesson04.teach.dialogue_line5:
    title: "Homayoun: Is he honest?"
    gloss: Is he honest?
  prs.a1.unit37.lesson04.teach.dialogue_line6:
    title: "Zarmina: Yes, he's always honest."
    gloss: Yes, he's always honest.
  prs.a1.unit37.lesson05.teach.review_reading_words:
    title: Sometimes, everyone, object marker, they like
    gloss: sometimes / everyone / object marker / they like
    note: "گاهی (sometimes) and همه (everyone) are used in the reading; را marks a definite direct object; دوست دارند is the third-person plural form of دوست دارم (I like)."
  prs.a1.unit37.lesson05.teach.reading_passage:
    title: Reading about Homayoun's personality
    gloss: "Homayoun is kind and hardworking. He is smart, but sometimes quiet. He is always honest. Everyone likes him."
  prs.a1.unit37.lesson06.teach.review_i_am_you_are:
    title: "Review: I am, you are (formal)"
    gloss: I am / you are (formal)
    note: "استم and استین are the review copula forms for I am and you are (formal), used throughout this wrap-up lesson's sentences."
  prs.a1.unit37.lesson06.teach.self_description_phrase:
    title: I am kind, but sometimes lazy
    gloss: I am kind, but sometimes lazy.
    note: "من (I) and استم (I am) let the learner describe their own personality directly, following the same او/است pattern used throughout the unit."
  prs.a1.unit37.lesson06.teach.formal_question_phrase:
    title: What kind of person are you?
    gloss: What kind of person are you?
    note: "Adds شما (you, formal) and استین (you are, formal) to the same question form from lesson03, now addressed directly to the learner."
