course:
  title: Dari A1
  description: 'Beginner Kabul Dari: household chore vocabulary (housework, broom, dishes, clean, help), saying which chore needs doing today with باید, asking someone for help with a chore, and a Wahid/Shukria dialogue about splitting household chores.'
units:
  prs.a1.unit33.household:
    title: Household chores
    description: Talk about household chores -- say which chores need doing, who does them, and ask someone for help with one.
lessons:
  prs.a1.unit33.lesson01.chore_vocabulary:
    title: Chore words
  prs.a1.unit33.lesson02.needing_to_do_chores:
    title: Chores that need doing
  prs.a1.unit33.lesson03.asking_for_help:
    title: Asking for help
  prs.a1.unit33.lesson04.chores_dialogue:
    title: Splitting the chores
  prs.a1.unit33.lesson05.reading_chores:
    title: Reading about chores
  prs.a1.unit33.lesson06.wrap_up:
    title: Wrap-up
teaching:
  prs.a1.unit33.lesson01.teach.housework_word:
    title: Housework
    gloss: housework / household chores
    note: کار خانه means housework or household chores, the topic phrase for this unit.
    example_gloss: There's a lot of housework.
  prs.a1.unit33.lesson01.teach.broom_word:
    title: Broom
    gloss: broom
    note: جاروب means broom, a genuine, widely-used Afghan Dari term.
    example_gloss: Where's the broom?
  prs.a1.unit33.lesson01.teach.dishes_word:
    title: Dishes
    gloss: dishes
    note: ظرف means dishes, a standard shared Persian/Dari word.
    example_gloss: The dishes are in the kitchen.
  prs.a1.unit33.lesson01.teach.clean_word:
    title: Clean
    gloss: clean
    note: پاک means clean, describing a room or object.
    example_gloss: The room is clean.
  prs.a1.unit33.lesson01.teach.review_wash_do:
    title: To wash / to do
    gloss: to wash / to do — I wash / I do
    note: شستن (to wash) is a genuinely new verb; کردن (to do) and می‌کنم (I do) are review from earlier units.
  prs.a1.unit33.lesson01.teach.sweep_phrase:
    title: I sweep
    gloss: I sweep.
    note: Combines جاروب (broom) with می‌کنم (I do, review) — literally "I do broom."
  prs.a1.unit33.lesson01.teach.wash_dishes_phrase:
    title: I wash the dishes
    gloss: I wash the dishes.
    note: Combines ظرف (dishes) with می‌شویم (I wash), the 1st-person form of شستن.
  prs.a1.unit33.lesson02.teach.review_emrouz_che_bali:
    title: Today / what / yes
    gloss: today / what / yes
    note: امروز, چه, and بلی are all review from earlier units.
  prs.a1.unit33.lesson02.teach.must_word:
    title: Must / need to
    gloss: must / need to
    note: باید is a genuinely new modal word, used here to say a chore needs doing.
  prs.a1.unit33.lesson02.teach.subjunctive_konam:
    title: That I do
    gloss: that I do
    note: کنم is the bare subjunctive form used after باید with کردن-based verbs (no می‌ prefix).
  prs.a1.unit33.lesson02.teach.must_sweep_phrase:
    title: Today I need to sweep
    gloss: Today I need to sweep.
    note: Combines امروز (today, review) with باید جاروب کنم (I need to sweep).
  prs.a1.unit33.lesson02.teach.must_clean_phrase:
    title: I need to clean
    gloss: I need to clean.
    note: Combines باید (must, review) with پاک کنم (that I clean).
  prs.a1.unit33.lesson02.teach.what_must_question:
    title: What do I need to do?
    gloss: What do I need to do?
    note: Combines چه کار (what chore/work) with باید کنم (I need to do).
  prs.a1.unit33.lesson02.teach.answer_must_sweep:
    title: Yes, I need to sweep
    gloss: Yes, I need to sweep.
    note: Combines بلی (yes, review) with باید جاروب کنم (I need to sweep).
  prs.a1.unit33.lesson03.teach.help_word:
    title: Help
    gloss: help
    note: کمک means help, a genuinely new word for this course (it only appeared inside an unrelated example sentence in unit08 before, which never counted as taught).
    example_gloss: I want help.
  prs.a1.unit33.lesson03.teach.review_lotfan_kardan_man:
    title: Please / to do / I / do! (formal)
    gloss: please / to do / I / do! (formal)
    note: لطفاً, کردن, من, and کنین (the formal imperative, matching the established -ین formal-suffix family) are all review from earlier units.
  prs.a1.unit33.lesson03.teach.please_help_phrase:
    title: Please help
    gloss: Please help.
    note: Combines لطفاً (please, review) with کمک کنین (help!, formal imperative).
  prs.a1.unit33.lesson03.teach.review_ki_mikonad:
    title: Who / he-she does
    gloss: who / he/she does
    note: کی (who, review from unit07) and می‌کند (he/she does, review) are both re-declared here.
  prs.a1.unit33.lesson03.teach.who_sweeps_question:
    title: Who sweeps?
    gloss: Who sweeps?
    note: Combines کی (who, review) with جاروب می‌کند (sweeps, 3rd person).
  prs.a1.unit33.lesson03.teach.wahid_sweeps_answer:
    title: Wahid sweeps
    gloss: Wahid sweeps.
    note: Introduces the character Wahid (وحید), answering the "who sweeps?" question.
  prs.a1.unit33.lesson03.teach.i_help_phrase:
    title: I help
    gloss: I help.
    note: Combines من (I, review) with کمک می‌کنم (I help).
  prs.a1.unit33.lesson04.teach.review_informal_words:
    title: You (informal) / you do / also / thanks / a lot
    gloss: you (informal) / you do (informal) / also / thanks / a lot
    note: تو, می‌کنی, هم, تشکر, and زیاد are all review, gathered here for the informal dialogue register.
  prs.a1.unit33.lesson04.teach.review_room_object_marker:
    title: Room / object marker
    gloss: room / object marker
    note: اتاق (review from unit19) and را (object marker, review) are both re-declared here.
  prs.a1.unit33.lesson04.teach.dialogue_line1:
    title: 'Wahid: Shukria, today I need to sweep. Will you help?'
    gloss: 'Shukria, today I need to sweep. Will you help?'
  prs.a1.unit33.lesson04.teach.dialogue_line2:
    title: "Shukria: Yes, I'll help. I'll wash the dishes."
    gloss: "Yes, I'll help. I'll wash the dishes."
  prs.a1.unit33.lesson04.teach.dialogue_line3:
    title: 'Wahid: Will you clean too?'
    gloss: Will you clean too?
  prs.a1.unit33.lesson04.teach.dialogue_line4:
    title: "Shukria: Yes, I'll clean the room."
    gloss: "Yes, I'll clean the room."
  prs.a1.unit33.lesson04.teach.dialogue_line5:
    title: 'Wahid: Thanks a lot!'
    gloss: Thanks a lot!
  prs.a1.unit33.lesson05.teach.review_u_har_ruz_ast:
    title: He/she / every day / is
    gloss: he/she / every day / is
    note: او (he/she, review from unit24), هر روز (every day, review from unit12), and است (is, review) are all re-declared here.
  prs.a1.unit33.lesson05.teach.review_mishuyad:
    title: He/she washes
    gloss: he/she washes
    note: می‌شوید is the 3rd-person form of شستن, matching the established 3rd-person -د verb pattern (e.g. می‌کند).
  prs.a1.unit33.lesson05.teach.review_khoshhal:
    title: Happy
    gloss: happy
    note: خوشحال (review from unit25) means happy.
  prs.a1.unit33.lesson05.teach.reading_passage:
    title: Reading about chores
    gloss: 'Wahid sweeps every day. Shukria washes the dishes. He/She also helps. Wahid is happy.'
  prs.a1.unit33.lesson06.teach.review_like_have_time:
    title: I like / time / I don't have / but
    gloss: I like / time / I don't have / but
    note: دوست دارم (I like), وقت (time), ندارم (I don't have), and اما (but) are all review from earlier units, continuing unit32's own wrap-up construction.
  prs.a1.unit33.lesson06.teach.wrap_summary:
    title: I like housework, but I don't have time
    gloss: "I like housework, but I don't have time."
    note: Combines کار خانه را دوست دارم (I like housework, review construction) with اما وقت ندارم (but I don't have time).
