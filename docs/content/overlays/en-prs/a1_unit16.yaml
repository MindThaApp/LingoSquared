course:
  title: Dari A1
  description: >-
    Beginner Kabul Dari: basic travel vocabulary, buying a ticket,
    asking about departure time and platform, reading a short schedule,
    and a dialogue at the ticket counter.

units:
  prs.a1.unit16.travel:
    title: Travel
    description: Handle basic transport information, tickets, destinations, and departure details.

lessons:
  prs.a1.unit16.lesson01.basic_travel_vocab:
    title: "Basic travel vocabulary"
  prs.a1.unit16.lesson02.buying_a_ticket:
    title: "Buying a ticket"
  prs.a1.unit16.lesson03.asking_departure_details:
    title: "Asking about departure time and platform"
  prs.a1.unit16.lesson04.reading_a_schedule:
    title: "Reading a departure schedule"
  prs.a1.unit16.lesson05.ticket_counter_dialogue:
    title: "A dialogue at the ticket counter"
  prs.a1.unit16.lesson06.confirming_travel_plans:
    title: "Confirming travel plans"

teaching:
  prs.a1.unit16.lesson01.teach.belit_word:
    title: Ticket
    gloss: ticket
    note: "تکت means ticket. This is the everyday Afghan Dari word; بلیط (also spelled بلیت, the Iranian-style word) is understood and accepted, but تکت is what you will usually hear."
    example_gloss: "I have a ticket."
  prs.a1.unit16.lesson01.teach.qatar_word:
    title: Train
    gloss: train
    note: "قطار means train."
    example_gloss: "The train is good."
  prs.a1.unit16.lesson01.teach.bas_word:
    title: Bus
    gloss: bus
    note: "بس means bus, a common Afghan Dari usage."
    example_gloss: "The bus is good."
  prs.a1.unit16.lesson01.teach.maidan_hawayi_word:
    title: Airport
    gloss: airport
    note: "میدان هوایی means airport -- this course's established Afghan Dari term (not the Iranian فرودگاه), consistent with Unit 5."
    example_gloss: "The airport is good."
  prs.a1.unit16.lesson01.teach.yak_word:
    title: A/one
    gloss: "a / one"
    note: "یک means one, used here as an indefinite article (a ticket)."
  prs.a1.unit16.lesson01.teach.az_word:
    title: From
    gloss: from
    note: "از means from, marking origin (distinct from its other use as than in comparisons)."
  prs.a1.unit16.lesson01.teach.doo_word:
    title: Two
    gloss: two
    note: "دو means two."
    example_gloss: "I have two tickets."
  prs.a1.unit16.lesson01.teach.sekooye_word:
    title: "Platform two"
    gloss: "platform two"
    note: "سکوی دو combines سکو (platform) with the ezafe connector -ی and دو (two)."
  prs.a1.unit16.lesson02.teach.herat_word:
    title: Herat
    gloss: Herat
    note: "A major city in western Afghanistan."
    example_gloss: "I'm going to Herat."
  prs.a1.unit16.lesson02.teach.mikhaham_word:
    title: "I want"
    gloss: "I want"
    note: "می‌خواهم is the full, uncontracted form of I want, consistent with this course's register."
  prs.a1.unit16.lesson02.teach.be_word:
    title: To
    gloss: to
    note: "به marks the destination -- به هرات means to Herat."
  prs.a1.unit16.lesson02.teach.belit_be_herat_phrase:
    title: "I want a ticket to Herat"
    gloss: "I want a ticket to Herat"
    note: "یک تکت به هرات می‌خواهم combines this lesson's vocabulary into the standard way to request a ticket."
  prs.a1.unit16.lesson03.teach.sekoo_word:
    title: Platform
    gloss: platform
    note: "سکو means platform (at a train station)."
    example_gloss: "The train departs from platform two."
  prs.a1.unit16.lesson03.teach.harekat_mikonad_phrase:
    title: "It departs"
    gloss: "it departs"
    note: "حرکت می‌کند is the full, uncontracted form of it departs/moves."
  prs.a1.unit16.lesson03.teach.kay_word:
    title: When
    gloss: when
    note: "کی means when, used to ask about time."
  prs.a1.unit16.lesson04.teach.sobh_word:
    title: Morning
    gloss: morning
    note: "صبح means morning."
    example_gloss: "The train departs at eight in the morning."
  prs.a1.unit16.lesson04.teach.schedule_text:
    title: "Sample schedule text"
    gloss: "The Herat train departs from platform two at eight in the morning."
    note: "A short factual announcement combining this unit's travel vocabulary -- since prs has no working audio, this written text stands in for a spoken station announcement."
  prs.a1.unit16.lesson05.teach.farda_word:
    title: Tomorrow
    gloss: tomorrow
    note: "فردا means tomorrow."
    example_gloss: "I'm going tomorrow morning."
  prs.a1.unit16.lesson05.teach.besyar_khoob_word:
    title: "Very good / okay"
    gloss: "very good / okay"
    note: "بسیار خوب is the full, formal way to say okay/very well, consistent with this course's register (not the colloquial باشه)."
    example_gloss: "The train is very good."
  prs.a1.unit16.lesson05.teach.dialogue_line1:
    title: "The traveler says"
    gloss: "I want a ticket to Herat."
  prs.a1.unit16.lesson05.teach.dialogue_line2:
    title: "The seller asks"
    gloss: "When do you want to go?"
  prs.a1.unit16.lesson05.teach.dialogue_line3:
    title: "The traveler answers"
    gloss: "Tomorrow morning."
  prs.a1.unit16.lesson05.teach.dialogue_line4:
    title: "The seller confirms"
    gloss: "Very good, the train departs from platform two at eight in the morning."
  prs.a1.unit16.lesson06.teach.tashakor_ziyad_word:
    title: "Thanks a lot"
    gloss: "thanks a lot"
    note: "تشکر زیاد is a common polite way to say thank you very much, already established in Unit 5/Unit 6."
  prs.a1.unit16.lesson06.teach.qabeli_nadara_phrase:
    title: "You're welcome"
    gloss: "you're welcome"
    note: "قابلی نداره is the standard polite reply to thanks, already established in Unit 5/Unit 6."
  prs.a1.unit16.lesson06.teach.safar_khosh_phrase:
    title: "Safe travels"
    gloss: "safe travels"
    note: "سفر خوش is a common farewell wish for someone about to travel, already established in Unit 6."
  prs.a1.unit16.lesson06.teach.va_word:
    title: And
    gloss: and
    note: "و means and, joining two clauses or items."

exercises:
  prs.a1.unit16.lesson01.exercise01.recognize_belit:
    instruction: "What does this word mean?"
    correct_option: ticket
    distractors: [train, bus, airport]
    accepted_answers: [{value: ticket, status: correct}]
    feedback: "تکت means ticket."
  prs.a1.unit16.lesson01.exercise02.recognize_qatar:
    instruction: "What does this word mean?"
    correct_option: train
    distractors: [ticket, bus, airport]
    accepted_answers: [{value: train, status: correct}]
    feedback: "قطار means train."
  prs.a1.unit16.lesson01.exercise03.match_travel_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {تکت: ticket, قطار: train, بس: bus, "میدان هوایی": airport, کابل: Kabul, هرات: Herat, چپ: left, راست: right}
        status: correct
    feedback: "These four are this lesson's core travel vocabulary, plus city and direction words from earlier units useful for planning a trip."
  prs.a1.unit16.lesson01.exercise04.translate_a_train_ticket:
    instruction: "Translate into Dari: a train ticket"
    accepted_answers:
      - {value: "یک تکت قطار", status: correct}
      - {value: "یک بلیط قطار", status: correct}
      - {value: "تکت قطار", status: correct}
      - {value: "بلیط قطار", status: correct}
      - {value: "یک بلیت قطار", status: correct}
      - {value: "بلیت قطار", status: correct}
    feedback: "تکت قطار means train ticket."
  prs.a1.unit16.lesson01.exercise05.translate_the_airport:
    instruction: "Translate into Dari: the airport"
    accepted_answers:
      - {value: "میدان هوایی", status: correct}
    feedback: "میدان هوایی means the airport."
  prs.a1.unit16.lesson02.exercise01.recognize_herat:
    instruction: "What does this word mean?"
    correct_option: Herat
    distractors: [ticket, train, "I want"]
    accepted_answers: [{value: Herat, status: correct}]
    feedback: "هرات means Herat."
  prs.a1.unit16.lesson02.exercise02.recognize_mikhaham:
    instruction: "What does this word mean?"
    correct_option: "I want"
    distractors: [Herat, to, ticket]
    accepted_answers: [{value: "I want", status: correct}]
    feedback: "می‌خواهم means I want."
  prs.a1.unit16.lesson02.exercise03.match_ticket_vocab:
    instruction: "Match each word with its meaning."
    accepted_answers:
      - value: {تکت: ticket, قطار: train, هرات: Herat, "می‌خواهم": "I want", به: to, بس: bus}
        status: correct
    feedback: "These combine lesson02's new words with lesson01's review vocabulary."
  prs.a1.unit16.lesson02.exercise04.word_order_belit_be_herat:
    instruction: "Arrange the words to say I want a ticket to Herat."
    accepted_answers:
      - {value: [یک, تکت, به, هرات, "می‌خواهم"], status: correct}
    feedback: "یک تکت به هرات می‌خواهم means I want a ticket to Herat."
  prs.a1.unit16.lesson02.exercise05.translate_ticket_request:
    instruction: "Translate into Dari: I want a ticket to Herat."
    accepted_answers:
