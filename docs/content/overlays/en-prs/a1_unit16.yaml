  prs.a1.unit16.lesson03.exercise01.recognize_sekoo:
    instruction: "What does this word mean?"
    correct_option: platform
    distractors: [ticket, train, "it departs"]
    accepted_answers: [{value: platform, status: correct}]
    feedback: "سکو means platform."
  prs.a1.unit16.lesson03.exercise02.recognize_harekat_mikonad:
    instruction: "What does this phrase mean?"
    correct_option: "it departs"
    distractors: [platform, when, ticket]
    accepted_answers: [{value: "it departs", status: correct}]
    feedback: "حرکت می‌کند means it departs."
  prs.a1.unit16.lesson03.exercise03.match_departure_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {سکو: platform, "حرکت می‌کند": "it departs", کی: when, قطار: train, هرات: Herat, تکت: ticket}
        status: correct
    feedback: "These combine lesson03's new words with earlier review vocabulary."
  prs.a1.unit16.lesson03.exercise04.translate_when_does_it_depart:
    instruction: "Translate into Dari: When does the train depart?"
    accepted_answers:
      - {value: "قطار کی حرکت می‌کند", status: correct}
      - {value: "قطار کی حرکت می‌کند؟", status: correct}
    feedback: "قطار کی حرکت می‌کند؟ means when does the train depart?"
  prs.a1.unit16.lesson03.exercise05.translate_platform_two:
    instruction: "Translate into Dari: The train departs from platform two."
    accepted_answers:
      - {value: "قطار از سکوی دو حرکت می‌کند", status: correct}
      - {value: "قطار از سکوی دو حرکت می‌کند.", status: correct}
    feedback: "قطار از سکوی دو حرکت می‌کند means the train departs from platform two."
  prs.a1.unit16.lesson04.exercise01.reading_comprehension_departure_time:
    instruction: "Read the announcement. What time does the Herat train depart?"
    correct_option: "Eight in the morning"
    distractors: ["Eight at night", "Two o'clock", "It isn't stated"]
    accepted_answers: [{value: "Eight in the morning", status: correct}]
    feedback: "The text says ساعت هشت صبح -- eight in the morning."
  prs.a1.unit16.lesson04.exercise02.reading_comprehension_platform:
    instruction: "Read the announcement. Which platform does it depart from?"
    correct_option: "Platform two"
    distractors: ["Platform eight", "Platform one", "It isn't stated"]
    accepted_answers: [{value: "Platform two", status: correct}]
    feedback: "The text says از سکوی دو -- from platform two."
  prs.a1.unit16.lesson04.exercise03.match_schedule_vocab:
    instruction: "Match each word or phrase with its meaning."
    accepted_answers:
      - value: {قطار: train, هرات: Herat, "ساعت هشت": "eight o'clock", صبح: morning, سکو: platform, دو: two}
        status: correct
    feedback: "These are the schedule text's key words."
  prs.a1.unit16.lesson04.exercise04.translate_train_departs_eight:
    instruction: "Translate into Dari: The train departs at eight in the morning."
    accepted_answers:
      - {value: "قطار ساعت هشت صبح حرکت می‌کند", status: correct}
      - {value: "قطار ساعت هشت صبح حرکت می‌کند.", status: correct}
      - {value: "ساعت هشت صبح قطار حرکت می‌کند", status: correct}
    feedback: "قطار ساعت هشت صبح حرکت می‌کند means the train departs at eight in the morning."
  prs.a1.unit16.lesson04.exercise05.write_own_travel_detail:
    instruction: "Write one sentence in Dari about the train: its departure time, its platform, or both."
    accepted_answers:
      - {value: "قطار ساعت هشت صبح از سکوی دو حرکت می‌کند", status: correct}
      - {value: "قطار ساعت هشت صبح حرکت می‌کند", status: correct}
      - {value: "قطار از سکوی دو حرکت می‌کند", status: correct}
