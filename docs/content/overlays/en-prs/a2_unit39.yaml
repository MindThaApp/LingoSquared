course:
  title: Dari A2
  description: 'Lower-intermediate Afghan Dari: passing on a simple message in the present tense with می‌گوید که, می‌پرسد که and می‌خواهد که + subjunctive, with phone messages and notes.'
units:
  prs.a2.unit39.passing_message:
    title: Passing on a message
lessons:
  prs.a2.unit39.lesson01.he_says_that:
    title: He says that ...
  prs.a2.unit39.lesson02.he_asks_that:
    title: He asks that ...
  prs.a2.unit39.lesson03.he_wants_that:
    title: He wants that ...
  prs.a2.unit39.lesson04.messages_and_notes:
    title: Messages and notes
  prs.a2.unit39.lesson05.reading_and_listening:
    title: Reading and listening about messages
  prs.a2.unit39.lesson06.office_conversation:
    title: A conversation at the office
teaching:
  prs.a2.unit39.lesson01.teach.message:
    title: Message
    gloss: message
    note: '*پیام* is a message, for example a phone message or a text message. In this unit you pass on a message: you tell a second person what a first person said, asked or wanted.'
    example_gloss: I have a message for you.
  prs.a2.unit39.lesson01.teach.says:
    title: He or she says
    gloss: he says, she says
    note: '*می‌گوید* is he or she says, the present of *گفتن*. You already know *می‌گویم* (I say). The ending *-د* is the he, she or it ending, as in *می‌آید*.'
    example_gloss: He or she says that he or she is coming tomorrow.
  prs.a2.unit39.lesson01.teach.pattern:
    title: 'Passing on what someone says: می‌گوید که + statement'
    gloss: The manager says that the meeting is at ten. He says that he is coming tomorrow.
    note: 'To pass on what someone is saying now, use *می‌گوید که* and then the statement. *که* means that. The statement keeps its present tense: *جلسه ساعت ده است*. In this unit you only pass on messages in the present. Past messages come later in the course.'
  prs.a2.unit39.lesson01.teach.person:
    title: I becomes he or she when you pass it on
    gloss: 'Mina: I am coming tomorrow. Mina says that she is coming tomorrow.'
    note: 'When Mina says *من فردا می‌آیم* (I am coming tomorrow) and you pass it on, the person changes: Mina is now *او* (she) for you, so the verb ending changes from *-م* to *-د*: *مینا می‌گوید که فردا می‌آید*. The word *او* is optional because the ending already shows who.'
  prs.a2.unit39.lesson01.teach.they_say:
    title: They say
    gloss: they say
    note: '*می‌گویند* is they say. Add *-ند* to the stem: *می‌گویند* is the *آن‌ها* form of *می‌گوید*.'
    example_gloss: They say that the meeting is at ten.
  prs.a2.unit39.lesson01.teach.hashmat:
    title: Hashmat says that Mina is coming tomorrow
    gloss: Hashmat says that Mina is coming tomorrow.
    note: Here the person who says (*حشمت*) and the person who comes (*مینا*) are different, and the sentence names both. Check who says and who comes whenever you read a message.
  prs.a2.unit39.lesson02.teach.asks:
    title: He or she asks
    gloss: he asks, she asks
    note: '*می‌پرسد* is he or she asks, the present of *پرسیدن*. It has the same ending *-د* as *می‌گوید*.'
    example_gloss: He or she asks where the manager is.
  prs.a2.unit39.lesson02.teach.wh:
    title: 'Passing on a question: می‌پرسد که + question'
    gloss: Hashmat asks where you are. Mina asks what time it is.
    note: To pass on a question, use *می‌پرسد که* and then the question with its question word (*کجا*, *ساعت چند*, *چه*, *کی*, *چرا*). The word order of the question does not change. *استی* is you are (to a friend), the *تو* form of *است*. When you tell the person who was asked, *تو* stays *تو*.
  prs.a2.unit39.lesson02.teach.yesno:
    title: Passing on a yes or no question
    gloss: He or she asks whether you are coming tomorrow.
    note: 'In this unit we keep the question as spoken, with no extra marker (you may also add *آیا* or *یا نه* as in unit 38). A yes or no question is passed on with *می‌پرسد که*: *او می‌پرسد که تو فردا می‌آیی*. The answer is *بلی* or *نخیر*. *می‌آیی* is you come (to a friend), the *تو* form of *می‌آید*.'
  prs.a2.unit39.lesson02.teach.id:
    title: The manager asks whether you have an ID card
    gloss: The manager asks whether you have an ID card.
    note: Another yes or no question. *تذکره* is the Afghan ID card, and *داری* is you have.
  prs.a2.unit39.lesson02.teach.person:
    title: Who is asked changes the pronoun
    gloss: Mina asks where you are. Mina asks where Hashmat is.
    note: 'Mina asks Hashmat: *تو کجا استی؟* (Where are you?). If you tell Hashmat, you say *مینا می‌پرسد که تو کجا استی* and *تو* stays. If you tell someone else, Hashmat becomes the third person: *مینا می‌پرسد که حشمت کجا است*.'
  prs.a2.unit39.lesson03.teach.pattern:
    title: 'Passing on a wish: می‌خواهد که + subjunctive'
    gloss: He or she wants you to come. He or she wants me to go.
    note: 'To pass on what someone wants another person to do, use *می‌خواهد که* and then the subjunctive: *او می‌خواهد که تو بیایی* (he or she wants that you come). The subjunctive is the same form you use after *باید* and in *بروم* (that I go). It is not the *می‌* present: there is no *می‌* in *بیایی*.'
  prs.a2.unit39.lesson03.teach.go:
    title: The subjunctive of رفتن
    gloss: that I go, that you go, that he or she goes, that we go, that you go (formal or plural), that they go
    note: 'The subjunctive is *ب* plus the present stem plus the ending: *ب + رو + م* gives *بروم*. The endings are *-م، -ی، -د، -یم، -ین، -ند*. So: *بروم، بروی، برود، برویم، بروین، بروند*. You know *بروم* already; this card adds the other forms.'
  prs.a2.unit39.lesson03.teach.come:
    title: The subjunctive of آمدن
    gloss: that I come, that you come, that he or she comes, that we come, that you come (formal or plural), that they come
    note: '*آمدن* is irregular: the subjunctive stem is *بیای-*. The endings are the same: *بیایم، بیایی، بیاید، بیاییم، بیایین، بیایند*. *بیایم* and *بیایین* you know already.'
  prs.a2.unit39.lesson03.teach.do:
    title: The subjunctive of کردن and آوردن
    gloss: that I do, that you do, that he or she does, that we do, that you do, that they do. that I bring, that you bring, that he or she brings.
    note: '*کردن* has no *ب*: *کنم، کنی، کند، کنیم، کنین، کنند*. So *تیلفون کردن* gives *تیلفون کنی* (that you phone). *آوردن* works like *آمدن* with *بیاور-*: *بیاورم، بیاوری، بیاورد*.'
  prs.a2.unit39.lesson03.teach.tell:
    title: The subjunctive of گفتن
    gloss: that I tell, that you tell, that he or she tells
    note: '*گفتن* has the stem *گوی-* in the subjunctive: *بگویم، بگویی، بگوید*. The pattern is *ب* plus stem plus ending, as for *بروم*.'
  prs.a2.unit39.lesson03.teach.phone:
    title: The manager wants you to phone
    gloss: The manager wants you to phone.
    note: The wanting person is *مدیر*, the person who should act is *تو*, and the verb after *که* is *کنی*.
  prs.a2.unit39.lesson03.teach.computer:
    title: He or she wants you to bring the computer
    gloss: He or she wants you to bring the computer.
    note: '*را* follows the thing that is brought, as in any sentence with an object.'
  prs.a2.unit39.lesson03.teach.same:
    title: The same subjunctive when the wanter goes too
    gloss: I want to go. He or she wants to go.
    note: 'If the person who wants and the person who acts are the same, the subjunctive is also used: *من می‌خواهم که بروم*. Use the matching ending: *-م* for I, *-د* for he or she. This unit mostly passes on a wish for someone else, as in *او می‌خواهد که تو بیایی*.'
  prs.a2.unit39.lesson04.teach.note:
    title: Note
    gloss: note, memo
    note: '*یادداشت* is a short written note, for example a note left on a table or a door. It is also a way to pass on a message when the person is not there.'
    example_gloss: The note is in the office.
  prs.a2.unit39.lesson04.teach.writes:
    title: He or she writes
    gloss: he writes, she writes
    note: '*می‌نویسد* is he or she writes, the present of *نوشتن*. *می‌نویسم* is I write.'
    example_gloss: Hashmat writes a note.
  prs.a2.unit39.lesson04.teach.sends:
    title: He or she sends
    gloss: he sends, she sends
    note: '*می‌فرستد* is he or she sends. You know *می‌فرستم* (I send).'
    example_gloss: The manager sends a message.
  prs.a2.unit39.lesson04.teach.written:
    title: 'A written message: می‌نویسد که'
    gloss: In the note he or she writes that the meeting is at nine.
    note: 'A written message is passed on in the same way as a spoken one: *می‌نویسد که* and then the statement. *در یادداشت* means in the note. The order is the same as for *می‌گوید که*.'
  prs.a2.unit39.lesson04.teach.tell_him:
    title: 'Saying who you tell: به'
    gloss: I tell him or her that the meeting is at nine. The manager tells Mina that the meeting is tomorrow.
    note: 'Put *به* and the listener before the verb to say who is told: *به او می‌گویم* (I tell him or her), *به مینا می‌گوید* (he tells Mina). The rest of the pattern stays: *که* and then the message.'
  prs.a2.unit39.lesson04.teach.phone_says:
    title: He or she phones and says that he or she is coming tomorrow
    gloss: He or she phones and says that he or she is coming tomorrow.
    note: 'A phone message often has two verbs in a row: *تیلفون می‌کند* (phones) and *می‌گوید که ...* (says that ...), joined by *و*.'
  prs.a2.unit39.lesson04.teach.i_write:
    title: I write a note
    gloss: I write a note.
    note: You write a note when you cannot pass on the message in person.
  prs.a2.unit39.lesson05.teach.not_come:
    title: He or she does not come
    gloss: he does not come, she does not come
    note: '*نمی‌آید* is he or she does not come: *ن* in front of *می‌آید*. You know *نمی‌روم* (I do not go).'
    example_gloss: He or she is not coming tomorrow.
  prs.a2.unit39.lesson05.teach.call_turn01:
    title: Turn 1
    gloss: Hashmat, who phoned?
    note: Mina comes home and asks who phoned.
  prs.a2.unit39.lesson05.teach.call_turn02:
    title: Turn 2
    gloss: The manager phoned. He says that the meeting is tomorrow at nine.
    note: Hashmat answers and passes on the first part of the message with *می‌گوید که*.
  prs.a2.unit39.lesson05.teach.call_turn03:
    title: Turn 3
    gloss: At nine? What else does he say?
    note: Mina asks for more. *چه می‌گوید* is what does he say.
  prs.a2.unit39.lesson05.teach.call_turn04:
    title: Turn 4
    gloss: He asks whether you are coming tomorrow. And he wants you to bring the computer.
    note: 'Two more parts of the message: a question with *می‌پرسد که* and a wish with *می‌خواهد که* and the subjunctive *بیاوری*.'
  prs.a2.unit39.lesson05.teach.call_turn05:
    title: Turn 5
    gloss: Yes, I am coming tomorrow and I am bringing the computer.
    note: Mina answers the question and the wish in the first person.
  prs.a2.unit39.lesson05.teach.call_turn06:
    title: Turn 6
    gloss: Good. Then I will phone him.
    note: Hashmat will pass Mina's answer back by phone. *به او تیلفون می‌کنم* is I phone him.
  prs.a2.unit39.lesson05.teach.note_read:
    title: A note from Hashmat
    gloss: Hello Mina. Today at four o'clock your friend phoned. He or she says that he or she is not coming tomorrow, because of work. He or she asks whether you have time on Friday. He or she wants you to phone him or her. His or her number is in this note. Hashmat
    note: 'A written message that passes on a phone call with the three verbs of this unit: *می‌گوید که*, *می‌پرسد که* and *می‌خواهد که*. The friend''s own call is a different one from the manager''s call in the conversation.'
  prs.a2.unit39.lesson06.teach.office_turn01:
    title: Turn 1
    gloss: Rahila, I have a message for you.
    note: 'Behzad starts: he has a message to pass on.'
  prs.a2.unit39.lesson06.teach.office_turn02:
    title: Turn 2
    gloss: From whom is it?
    note: Rahila asks who the message is from.
  prs.a2.unit39.lesson06.teach.office_turn03:
    title: Turn 3
    gloss: From the doctor's office. An employee phoned. He or she says that your appointment is on Thursday at two.
    note: Behzad passes on the first part with *می‌گوید که*.
  prs.a2.unit39.lesson06.teach.office_turn04:
    title: Turn 4
    gloss: Thursday at two? What else does he or she say?
    note: Rahila asks for the rest.
  prs.a2.unit39.lesson06.teach.office_turn05:
    title: Turn 5
    gloss: He or she asks whether you have an ID card. And he or she wants you to come at one.
    note: A question with *می‌پرسد که* and a wish with *می‌خواهد که* and the subjunctive *بیایی*.
  prs.a2.unit39.lesson06.teach.office_turn06:
    title: Turn 6
    gloss: Yes, I have it. I will write a note. Many thanks.
    note: Rahila answers the question, says that she writes a note so that she does not forget, and thanks Behzad.
  prs.a2.unit39.lesson06.teach.summary:
    title: Three verbs, three kinds of message
    gloss: He or she says that the appointment is on Thursday. He or she asks whether you have an ID card. He or she wants you to come at one.
    note: A message usually has a statement, a question or a wish. *می‌گوید که* is followed by a statement, *می‌پرسد که* by a question, and *می‌خواهد که* by the subjunctive. The verb ending shows who speaks, and the message keeps the present tense.
exercises:
  prs.a2.unit39.lesson01.exercise01.recognize_manager_says:
    instruction: What does this sentence mean?
    correct_option: The manager says that the meeting is at nine
    distractors:
    - The manager asks whether the meeting is at nine
    - The manager said that the meeting was at nine
    - The meeting is in the manager's office
    accepted_answers:
    - value: The manager says that the meeting is at nine
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است* is the manager says that the meeting is at nine.'
  prs.a2.unit39.lesson01.exercise02.recognize_they_say:
    instruction: What does this sentence mean?
    correct_option: They say that the meeting is at ten
    distractors:
    - They ask what time the meeting is
    - They say that the meeting is at nine
    - They say that the meeting was at ten
    accepted_answers:
    - value: They say that the meeting is at ten
      status: correct
    feedback: '*می‌گویند* is they say, and *ساعت ده* is ten o''clock.'
  prs.a2.unit39.lesson01.exercise03.recognize_who_says:
    instruction: What does this sentence mean?
    correct_option: Hashmat says that Mina is coming tomorrow
    distractors:
    - Mina says that Hashmat is coming tomorrow
    - Hashmat asks whether Mina is coming tomorrow
    - Hashmat says that Mina came yesterday
    accepted_answers:
    - value: Hashmat says that Mina is coming tomorrow
      status: correct
    feedback: 'The speaker comes first: *حشمت می‌گوید*. What he says is *مینا فردا می‌آید*.'
  prs.a2.unit39.lesson01.exercise04.match_says:
    instruction: Match each Dari word or sentence with its meaning.
    accepted_answers:
    - value:
        می‌گویم: I say
        می‌گوید: he or she says
        می‌گویند: they say
        پیام: message
        مدیر می‌گوید که جلسه ساعت نه است: The manager says that the meeting is at nine
        آن‌ها می‌گویند که جلسه ساعت ده است: They say that the meeting is at ten
        او می‌گوید که فردا می‌آید: He or she says that he or she is coming tomorrow
        حشمت می‌گوید که مینا فردا می‌آید: Hashmat says that Mina is coming tomorrow
      status: correct
    feedback: 'Only the ending of the verb changes with the person: *-م* I, *-د* he or she, *-ند* they. After *که* comes what is said.'
  prs.a2.unit39.lesson01.exercise05.order_manager_says:
    instruction: 'Arrange the words to say: The manager says that the meeting is at nine.'
    accepted_answers:
    - value:
      - مدیر
      - می‌گوید
      - که
      - جلسه
      - ساعت
      - نه
      - است
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است.* The speaker and the verb come first, then *که*, then the statement.'
  prs.a2.unit39.lesson01.exercise06.translate_manager_says:
    instruction: 'Translate into Dari, using می‌گوید که: The manager says that the meeting is at nine.'
    accepted_answers:
    - value: مدیر می‌گوید که جلسه ساعت نه است.
      status: correct
    - value: مدیر می‌گوید جلسه ساعت نه است.
      status: correct
    feedback: '*مدیر می‌گوید که جلسه ساعت نه است.* is the manager says that the meeting is at nine. The word *که* may be left out in everyday speech.'
  prs.a2.unit39.lesson02.exercise01.recognize_where_manager:
    instruction: What does this sentence mean?
    correct_option: He or she asks where the manager is
    distractors:
    - He or she says that the manager is at home
    - He or she asks who the manager is
    - He or she wants the manager to come
    accepted_answers:
    - value: He or she asks where the manager is
      status: correct
    feedback: '*می‌پرسد* is asks and *کجا* is where: he or she asks where the manager is.'
  prs.a2.unit39.lesson02.exercise02.recognize_coming_tomorrow:
    instruction: What does this sentence mean?
    correct_option: Hashmat asks whether you are coming tomorrow
    distractors:
    - Hashmat says that you are coming tomorrow
    - Hashmat asks whether he can come tomorrow
    - Hashmat asks why you came yesterday
    accepted_answers:
    - value: Hashmat asks whether you are coming tomorrow
      status: correct
    feedback: '*می‌پرسد که* introduces a question, here a yes or no question: Hashmat asks whether you are coming tomorrow.'
  prs.a2.unit39.lesson02.exercise03.match_asks:
    instruction: Match each Dari word or sentence with its meaning.
    accepted_answers:
    - value:
        می‌گوید: he or she says
        می‌پرسد: he or she asks
        او می‌گوید که فردا می‌آید: He or she says that he or she is coming tomorrow
        او می‌پرسد که تو فردا می‌آیی: He or she asks whether you are coming tomorrow
        او می‌پرسد که ساعت چند است: He or she asks what time it is
        او می‌پرسد که تو کجا استی: He or she asks where you are
        مدیر می‌پرسد که تو تذکره داری: The manager asks whether you have an ID card
        مدیر می‌گوید که جلسه ساعت نه است: The manager says that the meeting is at nine
      status: correct
    feedback: '*می‌گوید که* is followed by a statement. *می‌پرسد که* is followed by a question.'
  prs.a2.unit39.lesson02.exercise04.order_where_are_you:
    instruction: 'Arrange the words to say: Hashmat asks where you are.'
    accepted_answers:
    - value:
      - حشمت
      - می‌پرسد
      - که
      - تو
      - کجا
      - استی
      status: correct
    feedback: '*حشمت می‌پرسد که تو کجا استی.* The question keeps its own word order after *که*.'
  prs.a2.unit39.lesson02.exercise05.complete_asks:
    instruction: 'Complete the sentence: Hashmat asks where you are.'
    accepted_answers:
    - value: می‌پرسد
      status: correct
    feedback: '*می‌پرسد* is asks. *حشمت می‌پرسد که تو کجا استی* is Hashmat asks where you are.'
  prs.a2.unit39.lesson02.exercise06.translate_id_card:
    instruction: 'Translate into Dari, using می‌پرسد که: The manager asks whether you have an ID card.'
    accepted_answers:
    - value: مدیر می‌پرسد که تو تذکره داری؟
      status: correct
    - value: مدیر می‌پرسد که تذکره داری؟
      status: correct
    - value: مدیر می‌پرسد تو تذکره داری؟
      status: correct
    - value: مدیر می‌پرسد تذکره داری؟
      status: correct
    feedback: '*مدیر می‌پرسد که تو تذکره داری؟* is the manager asks whether you have an ID card. *که* and *تو* may be left out.'
  prs.a2.unit39.lesson03.exercise01.recognize_wants_you:
    instruction: What does this sentence mean?
    correct_option: He or she wants you to come
    distractors:
    - He or she says that you are coming
    - He or she asks whether you are coming
    - He or she wants to come
    accepted_answers:
    - value: He or she wants you to come
      status: correct
    feedback: '*می‌خواهد که تو بیایی* is he or she wants that you come. *می‌خواهد* is wants, not says or asks.'
  prs.a2.unit39.lesson03.exercise02.recognize_manager_phone:
    instruction: What does this sentence mean?
    correct_option: The manager wants you to phone
    distractors:
    - The manager says that you phone
    - The manager asks whether you phone
    - The manager wants to phone
    accepted_answers:
    - value: The manager wants you to phone
      status: correct
    feedback: '*کنی* is the subjunctive of *کردن* for you: the manager wants that you phone.'
  prs.a2.unit39.lesson03.exercise03.match_subjunctive:
    instruction: Match each subjunctive form with its meaning.
    accepted_answers:
