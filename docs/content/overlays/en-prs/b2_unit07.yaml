    instruction: What does this Dari word or phrase mean?
    correct_option: we split equally
    distractors:
    - we cancel completely
    - we speak informally
    - we arrive late
    accepted_answers:
    - value: we split equally
      status: correct
    feedback: '*برابر تقسیم کنیم* means we split equally.'
  prs.b2.unit07.negotiation.lesson01.proposal.exercise02.recognize_sentence:
    instruction: What is the best English meaning of this Dari sentence?
    correct_option: My proposal is that we split the storeroom rent equally.
    distractors:
    - My proposal is that you pay all the storeroom rent alone.
    - My proposal is that we divide the electricity bill, not the storeroom rent.
    - The owner proposed cancelling the storeroom agreement.
    accepted_answers:
    - value: My proposal is that we split the storeroom rent equally.
      status: correct
    feedback: 'This sentence means: My proposal is that we split the storeroom rent equally.'
  prs.b2.unit07.negotiation.lesson01.proposal.exercise03.match:
    instruction: Match each Dari item with its English meaning.
    accepted_answers:
    - value:
        پیشنهاد من این است که: my proposal is that
        کرایه: rent
        گدام: storeroom
        برابر: equally
