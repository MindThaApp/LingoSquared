  notes: "Fresh-context Dari review required before import.

    Review 2026-10-20 (en-prs B2 pass): 13 fixes - learner-facing template wording (recognize_sentence feedback now states the meaning instead of an internal remark; grammar_check feedback now names the specific error in each lesson; speak/write instructions and feedback no longer say 'taught sentence meaning' / 'taught B2 frame'); دکان -> دوکان (course spelling; target, examples, note, tokens); L2 card01 example آماده گفت‌وگو هستم -> استم (token updated); L1 and L3 grammar_check prompts were grammatical (تقسیم کنم, موافقیم: only person changes) -> missing را and agreement error کوتاه‌تر باشند; پیش‌پرداخت note called the ZWNJ a hyphen; فعلا -> فعلاً. NATIVE FLAGS: گدام for storeroom; مصرف برق را برابر حساب کنیم gloss; امتیاز as 'concession'."
course:
  title: Dari B2
  description: Propose terms, push back, concede conditionally, and preserve the relationship.
units:
  prs.b2.unit07.negotiation:
    title: Negotiation
    description: Propose terms, push back, concede conditionally, and preserve the relationship.
lessons:
  prs.b2.unit07.negotiation.lesson01.proposal:
    title: Proposing terms
  prs.b2.unit07.negotiation.lesson02.pushback:
    title: Polite pushback
  prs.b2.unit07.negotiation.lesson03.concession:
    title: Conditional concession
teaching:
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card01:
    title: my proposal is that
    gloss: my proposal is that
    note: '*پیشنهاد من این است که* states a term explicitly while leaving room for the other side to respond.'
    example_gloss: My proposal is that we do the work in stages.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card02:
    title: rent
    gloss: rent
    note: '*کرایه* is rent in this shop context; do not confuse it with fare for transport.'
    example_gloss: The shop rent is paid every month.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card03:
    title: storeroom
    gloss: storeroom
    note: '*گدام* is the storeroom being shared, so it anchors the negotiation in a concrete cost.'
    example_gloss: The storeroom is behind the shop.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card04:
    title: equally
    gloss: equally
    note: '*برابر* means equally here; it describes the split, not the physical size of the room.'
    example_gloss: Let’s calculate the electricity cost equally.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card05:
    title: we split
    gloss: we split
    note: '*تقسیم کنیم* uses "we" to propose shared action, which is less confrontational than ordering the other side.'
    example_gloss: Let’s split the cleaning tasks.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card06:
    title: terms
    gloss: terms
    note: '*شرایط* are the terms under discussion; a negotiation should make them specific.'
    example_gloss: The deal terms must be clear.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card07:
    title: share
    gloss: share
    note: "*سهم* is one party's share, useful when explaining why an equal split is fair."
    example_gloss: Each person’s share should be written separately.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card08:
    title: is fair
    gloss: is fair
    note: '*منصفانه است* evaluates fairness, a relationship-preserving reason for the proposed term.'
    example_gloss: This way is fair for both sides.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.card09:
    title: shop
    gloss: shop
    note: '*دوکان* is Afghan Dari for shop; it keeps the rent negotiation grounded in a small-business setting.'
    example_gloss: The shop opens early in the morning.
  prs.b2.unit07.negotiation.lesson01.proposal.teach.grammar:
    title: Negotiation grammar
    gloss: Negotiation grammar
    note: '*پیشنهاد من این است که* states a term without sounding like an order. The *که* clause carries the proposed arrangement.'
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card01:
    title: I do not agree with this part
    gloss: I do not agree with this part
    note: '*با این بخش موافق نیستم* rejects only one term, which keeps the rest of the agreement open.'
    example_gloss: I do not agree with this part, but I am ready to discuss.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card02:
    title: amount
    gloss: amount
    note: '*مبلغ* is the amount of money; it pairs naturally with deposit and rent terms.'
    example_gloss: The rent amount must be written.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card03:
    title: deposit
    gloss: deposit
    note: '*پیش‌پرداخت* is the upfront payment; it is written as one word, with *پیش* not joined to *پرداخت*.'
    example_gloss: The deposit is high for the shop.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card04:
    title: high
    gloss: high
    note: '*بلند* means high for an amount in Afghan Dari, not only physically tall.'
    example_gloss: Material prices are high today.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card05:
    title: is not acceptable
    gloss: is not acceptable
    note: '*قابل قبول نیست* is firm refusal language; soften it by naming the reason after it.'
    example_gloss: This condition is not acceptable for me.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card06:
    title: condition
    gloss: condition
    note: '*شرط* names the condition that can turn a refusal into a possible agreement.'
    example_gloss: The second condition is vague.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card07:
    title: disagreement
    gloss: disagreement
    note: '*اختلاف* is the disagreement itself; identifying it helps avoid rejecting the whole relationship.'
    example_gloss: Our disagreement is about usage time.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card08:
    title: find another way
    gloss: find another way
    note: '*راه دیگر پیدا کنیم* proposes problem-solving after pushback, keeping the exchange cooperative.'
    example_gloss: Let’s find another way.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.card09:
    title: working relationship
    gloss: working relationship
    note: '*رابطه کاری* is the relationship to protect, so the refusal should stay polite and specific.'
    example_gloss: Let’s not damage the working relationship.
  prs.b2.unit07.negotiation.lesson02.pushback.teach.grammar:
    title: Negotiation grammar
    gloss: Negotiation grammar
    note: '*با این بخش موافق نیستم* is firm and specific. Name the term you reject so negotiation can continue.'
  prs.b2.unit07.negotiation.lesson03.concession.teach.card01:
    title: if the contract is shorter
    gloss: if the contract is shorter
    note: '*اگر قرارداد کوتاه‌تر باشد* puts the condition before the concession, making the trade-off clear.'
    example_gloss: If the contract is shorter, the risk is lower.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card02:
    title: contract
    gloss: contract
    note: '*قرارداد* is the contract whose length changes the acceptable risk.'
    example_gloss: The contract must have an end date.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card03:
    title: I agree to the higher amount
    gloss: I agree to the higher amount
    note: '*با مبلغ بالاتر موافقم* is a concession, but only when tied to the shorter-contract condition.'
    example_gloss: I agree to the higher amount if repairs are the owner’s responsibility.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card04:
    title: concession
    gloss: concession
    note: '*امتیاز* is a concession or advantage in bargaining; it should usually come with a condition.'
    example_gloss: Every concession needs a clear condition.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card05:
    title: guarantee
    gloss: guarantee
    note: '*ضمانت* adds security to a deal, useful when one side accepts a higher cost.'
    example_gloss: A guarantee is necessary for equipment.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card06:
    title: provided that
    gloss: provided that
    note: '*به شرطی که* formally attaches the condition; the following clause should state the required term.'
    example_gloss: Provided that the hours are equal, I accept.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card07:
    title: agreement
    gloss: agreement
    note: '*توافق* is the agreement reached or sought, not the opening proposal itself.'
    example_gloss: An agreement without a date is vague.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card08:
    title: I accept for now
    gloss: I accept for now
    note: '*فعلاً قبول می‌کنم* accepts for now, signaling that the agreement may be reviewed later.'
    example_gloss: I accept for now, but let’s review again next month.
  prs.b2.unit07.negotiation.lesson03.concession.teach.card09:
    title: owner
    gloss: owner
    note: '*مالک* names the owner, the party responsible for major terms like repairs or contract length.'
    example_gloss: The owner must do the major repair.
  prs.b2.unit07.negotiation.lesson03.concession.teach.grammar:
    title: Negotiation grammar
    gloss: Negotiation grammar
    note: '*اگر ... باشد، موافقم* attaches a condition to a concession. It protects your position while moving toward agreement.'
exercises:
