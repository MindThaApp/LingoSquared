course:
  title: Dari B1
  description: 'Intermediate Kabul Dari: describing what is wrong with a product, saying what already happened, and asking politely for a replacement or refund.'
units:
  prs.b1.unit16.complaint:
    title: Making a complaint
    description: 'Make a polite complaint: say what is wrong, say what already happened, and ask for a concrete solution.'
lessons:
  prs.b1.unit16.lesson01.whats‌wrong:
    title: What is wrong
