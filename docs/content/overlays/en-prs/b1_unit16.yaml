teaching:
  prs.b1.unit16.lesson01.teach.telefon:
    title: Phone
    gloss: phone
    note: تیلفون means phone (a telephone or mobile phone).
    example_gloss: I bought this phone yesterday.
  prs.b1.unit16.lesson01.teach.grammar:
    title: Saying what is wrong
    gloss: تیلفون کار نمی‌کند
    note: 'To say what is wrong, state the product and the problem: این تیلفون کار نمی‌کند (this phone does not work); تیلفونی که خریدم کار نمی‌کند (the phone that I bought does not work). For damage, use است: صفحه شکسته است (the screen is broken).'
  prs.b1.unit16.lesson01.teach.kar‌nemikonad:
    title: Does not work
    gloss: does not work
    note: کار نمی‌کند means "does not work" (for a machine).
    example_gloss: This phone does not work.
  prs.b1.unit16.lesson01.teach.dokan:
    title: Shop
    gloss: shop
    note: دوکان means shop.
    example_gloss: I bought the phone from the shop.
  prs.b1.unit16.lesson01.teach.khaharidam:
    title: I bought
    gloss: I bought
    note: خریدم is the 1st person simple past of خریدن (to buy).
    example_gloss: The phone that I bought does not work.
  prs.b1.unit16.lesson01.teach.telefoni:
    title: The phone that
    gloss: the phone that
    note: 'تیلفونی که starts a relative clause: "the phone that ...".'
    example_gloss: The phone that I bought yesterday is small.
  prs.b1.unit16.lesson01.teach.shikast:
    title: Broken
    gloss: broken
    note: شکسته means broken.
    example_gloss: The phone screen is broken.
  prs.b1.unit16.lesson02.teach.hafta‌gozashta:
    title: Last week
    gloss: last week
    note: هفته‌ی گذشته means last week.
    example_gloss: Last week I bought the phone.
  prs.b1.unit16.lesson02.teach.grammar:
    title: Saying what already happened
    gloss: هفته‌ی گذشته ... دیروز ...
    note: 'To say what already happened, use the simple past with a time word: هفته‌ی گذشته تیلفون را خریدم، دیروز به دوکان تیلفون کردم (last week I bought the phone, yesterday I phoned the shop). Add what the result was: هیچ کس جواب نداد (nobody answered).'
  prs.b1.unit16.lesson02.teach.telefon‌kardam:
    title: I phoned
    gloss: I phoned
    note: 'تیلفون کردم is the simple past: I phoned.'
    example_gloss: Yesterday I phoned the shop.
  prs.b1.unit16.lesson02.teach.hichkas:
    title: Nobody
    gloss: nobody
    note: هیچ کس means nobody; the verb is negative in meaning but positive in form in the past.
    example_gloss: Nobody answered.
  prs.b1.unit16.lesson02.teach.jawab:
    title: Did not answer
    gloss: did not answer
    note: جواب نداد is the negative simple past of جواب دادن (to answer).
    example_gloss: Nobody answered.
  prs.b1.unit16.lesson03.teach.mikhaham:
    title: I want that
    gloss: I want that
    note: می‌خواهم که + subjunctive politely asks someone else to do something.
    example_gloss: I would like you to replace the phone.
  prs.b1.unit16.lesson03.teach.grammar:
    title: Asking for a solution
    gloss: می‌خواهم که ... عوض کنین
    note: 'To ask for a solution, use می‌خواهم که + the polite subjunctive: می‌خواهم که تیلفون را عوض کنین (I would like you to replace the phone). Offer an alternative with یا: ... یا پولم را پس بدهین (or give me my money back). Add لطفاً to stay polite.'
  prs.b1.unit16.lesson03.teach.awaz:
    title: (that) you replace
    gloss: (that) you replace
    note: عوض کنین is the polite subjunctive of عوض کردن (to replace or exchange).
    example_gloss: I would like you to replace the phone.
  prs.b1.unit16.lesson03.teach.pas:
    title: (that) you give back
    gloss: (that) you give back
    note: پس دادن means to give back or refund.
    example_gloss: Please give my money back.
  prs.b1.unit16.lesson03.teach.pul:
    title: My money
    gloss: my money
    note: پولم means my money.
    example_gloss: Please give my money back.
  prs.b1.unit16.lesson03.teach.ya:
    title: Or
    gloss: or
    note: یا means or.
    example_gloss: Replace it or give me my money back.
  prs.b1.unit16.lesson04.teach.bebakhshin:
    title: Excuse me / sorry
    gloss: excuse me / sorry
    note: ببخشین is a polite way to excuse yourself or say sorry.
    example_gloss: Excuse me, I have a problem.
  prs.b1.unit16.lesson04.teach.mikhahin:
    title: You want
    gloss: you want
    note: می‌خواهین is the polite 2nd person plural present of خواستن.
    example_gloss: What do you want?
  prs.b1.unit16.lesson04.teach.dialogue01:
    title: Please, what problem do you have?
    gloss: Please, what problem do you have?
    note: The shopkeeper asks what the problem is.
  prs.b1.unit16.lesson04.teach.dialogue02:
    title: Last week I bought this phone, but it does not work.
    gloss: Last week I bought this phone, but it does not work.
    note: Homayoun says when he bought the phone and what is wrong.
  prs.b1.unit16.lesson04.teach.dialogue03:
    title: I am sorry. Did you phone us yesterday?
    gloss: I am sorry. Did you phone us yesterday?
    note: The shopkeeper apologizes and asks about the earlier call.
  prs.b1.unit16.lesson04.teach.dialogue04:
    title: Yes, I phoned yesterday, but nobody answered.
    gloss: Yes, I phoned yesterday, but nobody answered.
    note: Homayoun says what already happened.
  prs.b1.unit16.lesson04.teach.dialogue05:
    title: I am sorry. What do you want?
    gloss: I am sorry. What do you want?
    note: The shopkeeper asks what solution he wants.
  prs.b1.unit16.lesson04.teach.dialogue06:
    title: I would like you to replace the phone, or give me my money back.
    gloss: I would like you to replace the phone, or give me my money back.
    note: Homayoun asks politely for a replacement or a refund.
  prs.b1.unit16.lesson05.teach.dokandar:
    title: Shopkeeper
    gloss: shopkeeper
    note: دوکاندار means shopkeeper.
    example_gloss: The shopkeeper did not answer.
  prs.b1.unit16.lesson05.teach.awaz‌konad:
    title: (that) he/she replace
    gloss: (that) he/she replace
    note: عوض کند is the 3rd person subjunctive of عوض کردن.
    example_gloss: Homayoun wants the shopkeeper to replace the phone.
  prs.b1.unit16.lesson05.teach.reading:
    title: Homayoun's complaint
    gloss: Last week Homayoun bought a phone, but it does not work. Yesterday he phoned the shop, but nobody answered. Now he wants the shopkeeper to replace the phone.
    note: 'A complaint told in the third person: the problem, what already happened, and the solution requested with می‌خواهد که + subjunctive.'
  prs.b1.unit16.lesson06.teach.grammar:
    title: 'Review: making a complaint'
    gloss: کار نمی‌کند؛ می‌خواهم که ... عوض کنین
    note: 'Review: say what is wrong (کار نمی‌کند، شکسته است), say what already happened (هفته‌ی گذشته ... خریدم، دیروز ... تیلفون کردم), and ask politely for a solution (می‌خواهم که ... عوض کنین، یا پولم را پس بدهین).'
  prs.b1.unit16.lesson06.teach.r‌lotfan:
    title: Please
    gloss: please
    note: لطفاً means please.
    example_gloss: Please help.
  prs.b1.unit16.lesson06.teach.r‌mushkil:
    title: Problem
    gloss: problem
    note: مشکل means problem.
    example_gloss: I have a problem.
