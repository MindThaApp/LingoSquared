  notes: "Authored with prs a1_unit50_swimming_pool.yaml for en-prs only. A fresh, targeted keyword search (Unicode-normalized, since raw pdftotext output uses Arabic presentation-form glyphs) was run this task across the full locally cached DLI Dari corpus (all Semester 1/2/3 student books plus all nine Semester 3 'Other documents' supplements) for swim/pool/swimming and direct Dari-script حوض/آببازی/اوبازی/شنا terms. This found a genuine, real, repeated hit: حوض آببازی (also spelled حوض اَوبازی) is the DLI corpus's own attested term for 'swimming pool,' appearing in six different Semester 1 glossaries and inside a real worked grammar example in Lesson 19 ('At a Hotel') built around 'Does the hotel have a swimming pool?' in both colloquial and formal registers -- independently corroborating unit45's own prior finding of the same term inside that same lesson's hotel-room-vocabulary list. This confirms حوض آببازی as authentic Dari vocabulary for the pool itself, honestly disclosed alongside the fact that every DLI hit is a hotel-amenity-question context, not a public-pool-visit scenario -- none of the source material covers buying a ticket, a locker, opening/closing hours, or pool rules, this outcome's own actual assessment_requirements. Per AUTHORING_GUIDE.md #10's fallback, the pool-visit content itself (ticket, locker, hours, staff dialogue) is authored fresh, built entirely from this course's own already-established vocabulary and grammar (ticket from unit16, want-plus-subjunctive-get from unit42/unit43/unit48/unit49, where-is from unit05, a phone-number-style locker number from unit04, time words from unit04/unit09/unit11/unit16/unit48/unit49, and the already-established -ش possessive-suffix pattern from قیمتش, extended here to a new noun for 'his/her locker'). Three new words beyond the pool term itself, none source-derived: locker, open, and closed are all standard, everyday modern Dari vocabulary, chosen because the DLI corpus (checked in full) has no locker/hours vocabulary for this domain at all -- honestly disclosed as fresh authoring, not presented as source-derived. The 3rd-person 'wants' form is the same already-established precedent unit47/unit48/unit49 all set for introducing a 3rd-person cell of an already-taught 1st-person verb. No bare Yes/No/True/False/On/Off gloss values exist anywhere in this unit. Deliberately kept the pool's open time (from nine) and close time (at five) as two clearly distinct facts, never combined into an arithmetic total, each stated identically everywhere it's referenced. Dialogue content uses structured speakers in the realization, not embedded speaker labels. This task did not open any fa/a1_unit* file at any point -- fa and prs are separate realizations per universal_spine.yaml's own explicit invariant, and every vocabulary/register choice here was made independently."
course:
