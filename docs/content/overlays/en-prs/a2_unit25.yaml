    accepted_answers:
    - value: Last year I went to Herat
      status: correct
    feedback: '*پارسال* fixes the time, so the verb is the simple past *رفتم*: last year I went to Herat.'
  prs.a2.unit25.lesson03.exercise03.choose_experience_form:
    instruction: Which sentence says you have been to Herat at some point in your life, with no time given?
    correct_option: به هرات رفته‌ام
    distractors:
